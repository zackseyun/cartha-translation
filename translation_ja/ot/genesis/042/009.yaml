revisions:
- from: その時、ヨセフは彼らについて見た夢を思い出し、彼らに言った。「おまえたちはスパイだ。この国の裸[a]を見るために来たのだ。」
  to: その時、ヨセフは彼らに関して見た夢を思い出し、彼らに言った。「おまえたちはスパイだ。この地の無防備な所を見るために来たのだ。」
  rationale: 慣用句「地の裸」は、日本語本文ではその意味を自然に伝える「この地の無防備な所」と訳し、原語の字義的表現と比喩を脚注で保持した。「彼らに関して見た夢」により、夢の内容が彼らに関するものであることを明確にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:15Z'
review_pass:
  verdict: revise
  source_fidelity: ヘブライ語の文意は概ね正確に捉えている。もっとも、עֶרְוַת הָאָרֶץを本文で「この国の裸」とすると、日本語では比喩としてほとんど機能せず、原語の慣用的な意味（地の露出した、無防備な箇所）が伝わりにくい。また、אָרֶץはここでは近代的な政治単位としての「国」より「地」とするほうが原語に近い。
  naturalness: 「彼らについて見た夢」は理解可能だが、修飾関係が一瞬取りにくい。「彼らに関して見た夢」とすれば、ヨセフが見た夢であり、その内容が兄弟たちに関するものだと明瞭になる。「この国の裸」は現代標準語として不自然なので、本文は慣用義を明示し、字義的表現は脚注に置くのが安全である。
  terminology: 「スパイ」は現代の一般読者に明瞭で、מְרַגְּלִיםに適する。「おまえたち」は告発場面の厳しい口調として維持できる。「無防備な所」はここでの「地の裸」の慣用義を自然に表す。
  issues:
  - severity: medium
    issue: 「この国の裸」
    rationale: 原語の語彙イメージを機械的に再現しているが、日本語では意味が通りにくく、明瞭な現代標準語という対象方針に適合しない。本文では慣用義を訳し、直訳と比喩は脚注で示すのがよい。
  - severity: low
    issue: 「彼らについて見た夢」
    rationale: 誤訳ではないが、「彼らに関して見た夢」のほうが、夢の主体と夢の対象との関係を自然かつ明瞭に表せる。
  - severity: low
    issue: 「この国」
    rationale: אָרֶץはこの文脈で地・土地を指す。現代国家を連想しうる「国」より「この地」がより適切である。
  revised_text: その時、ヨセフは彼らに関して見た夢を思い出し、彼らに言った。「おまえたちはスパイだ。この地の無防備な所を見るために来たのだ。」
  revised_footnotes:
