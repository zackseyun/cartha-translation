base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: ja
  text: その時、ヨセフは彼らに関して見た夢を思い出し、彼らに言った。「おまえたちはスパイだ。この地の無防備な所を見るために来たのだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 思い出し
  rationale: 物語の進行を示す接続形として、ヨセフがこの時に夢を想起したことを自然な日本語で表す。
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: 見た夢
  rationale: ヘブライ語は「夢」と「夢を見る」を重ねる同根語表現だが、日本語で「夢見た夢」とすると不自然になりやすいため、意味を明瞭に保つ表現とした。
- source_word: לָהֶם
  choice: 彼らについて
  rationale: 文脈上、夢は兄たちに関するものである。与格的な形の曖昧さを過度に広げず、ここで最も自然な関係を示す。
- source_word: מְרַגְּלִים
  choice: スパイ
  rationale: この文脈では偵察や諜報を行う者への告発を指す。現代の一般読者に最も明瞭な語を用いた。
- source_word: לִרְאוֹת
  choice: 見るために
  rationale: 不定詞の基本的意味「見る」を保ち、偵察するという含意は「スパイ」という文脈から伝わるようにした。
- source_word: עֶרְוַת הָאָרֶץ
  choice: この国の裸
  rationale: 直訳的な比喩「国の裸」を本文に残し、それが無防備で攻撃されやすい場所を指す慣用表現であることを脚注で説明する。
- source_word: בָּאתֶם
  choice: 来たのだ
  rationale: 到来の目的を断定的に告発する発話の力を、自然な日本語の「来たのだ」で表した。
