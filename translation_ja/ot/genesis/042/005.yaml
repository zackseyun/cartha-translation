  source_fidelity: 「カナンの地にも」の「も」は原文に明示されておらず、エジプトとの対比を補う表現となるため省くのがよい。בְּתוֹךְ הַבָּאִים は、他の来訪者の一群の中で来たことを表す。
  naturalness: 現行の「来た／やって来た」は原文の同根反復を反映するが、日本語としてやや重い。「訪れる人々に交じって来た」とすれば、意味を保って明瞭な現代標準日本語になる。
  terminology: 「イスラエルの息子たち」はこの文脈でヤコブの息子たちを正確に指し、「穀物を買う」も文脈に即している。「飢饉」は適切である。
