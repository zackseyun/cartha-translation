  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: ja
  text: こうして、イスラエルの息子たちも、穀物を買うため、訪れる人々に交じって来た。カナンの地に飢饉があったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来た
  rationale: בוא の物語上の連続動作を表し、エジプトへの到着という視点にも自然に合う。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たち
  rationale: ここでは民族一般ではなく、ヤコブ（イスラエル）の実際の息子たちを指すため、具体的に訳した。
- source_word: לִשְׁבֹּר
  choice: 穀物を買いに
  rationale: 動詞自体は「買う」だが、飢饉とヨセフ物語の文脈では穀物・食糧を買うことを指す。日本語では目的語を補うことで意味が明確になる。
- source_word: בְּתוֹךְ הַבָּאִים
  choice: やって来た人々に交じって
  rationale: 「来る人々のただ中に」という集団内の位置・同行を自然な日本語で表し、同根語 בוא の反復も「来た／やって来た」である程度保持した。
- source_word: כִּי
  choice: からである
  rationale: 彼らが他の人々に交じって来た理由を示す因果関係として訳した。
- source_word: הָיָה הָרָעָב
  choice: 飢饉があった
  rationale: ヘブライ語の状態・存在表現を自然な日本語にした。既知の飢饉であることは文脈から明らかで、日本語では冠詞相当の明示は不要。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地にも
  rationale: 地理的・物語的に重要な「カナンの地」を保持した。「にも」は、彼らが穀物を求めて向かった先だけでなくカナンにも飢饉が及んでいたという文脈上自然な含意を示す。
