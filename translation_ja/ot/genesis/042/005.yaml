  to: こうして、イスラエルの息子たちも、穀物を買うため、訪れる人々に交じって来た。カナンの地に飢饉があったからである。
  rationale: 原文の因果関係、イスラエルの息子たちが穀物を買うため他の来訪者の群れに交じって来たこと、およびカナンの地の飢饉を保持した。一方、原文にない「も」（カナンの地にも）の追加的含意を除き、重い反復を自然な日本語に改めた。冒頭の「息子たちも」は、来訪者の一団に加わるという文意を自然に示す。
