  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: ja
  text: ヨセフは兄たちを見分けたが、彼らはヨセフを見分けなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、前半と後半に同じ動詞が繰り返されている。「ヨセフは兄たちを見分けたが、彼らはヨセフを見分けなかった。」
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: 分かった
  rationale: ヒフィル形のנכרは、以前から知っている人物を見分ける、すなわち認識することを表す。現代日本語では「分かった」が自然で、後半との語の反復も保てる。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אֶת־אֶחָיו
  choice: 兄たちだと
  rationale: אָחの男性複数形と三人称男性単数接尾辞は、文脈上ヨセフの男性のきょうだいたちを指す。日本語ではヨセフより年上であることが文脈上明らかなため「兄たち」とした。認識内容を自然に示すため「だと」を補った。
- source_word: וְהֵם
  choice: が、彼らは
  rationale: 接続詞וְは形式上「そして」だが、ここではヨセフの認識と兄たちの不認識を対比するため、逆接の「が」で表した。
- source_word: לֹא
  choice: なかった
  rationale: 否定辞を、日本語の自然な過去否定として述語に組み込んだ。
- source_word: הִכִּרֻהוּ
  choice: ヨセフだとは分からなかった
  rationale: 前半と同じנכרを「分かる」で反復し、物語上の対照を保った。接尾辞「彼を」は日本語では指示対象を「ヨセフ」と明示する方が誤解がなく自然である。
