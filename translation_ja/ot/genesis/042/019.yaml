  register: ヨセフが拘束下の兄たちに命じる場面に合わせ、威厳を保ちつつ明瞭な現代日本語とした。二人称は権力差と複数への呼びかけを示す「おまえたち」、命令形は「しておけ」「持って帰れ」とした。
