  to: もしおまえたちが正直な者[a]なら、兄弟のうち一人を、おまえたちが拘束されている場所[b]に残しておけ。おまえたちは行って、家の者たちの飢えをしのぐ穀物を持って帰れ。
  rationale: 拘束場所への言及を現在形に改め、一人の兄弟をそこにとどめる命令を自然に表した。「家の者たち」は、建物としての家ではなく、その家に属する人々を指す文脈上の意味を保つ。脚注aは原語形容詞の代替訳としてより直接的な表現に整えた。
