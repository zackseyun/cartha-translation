  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: ja
  text: もしおまえたちが正直な者[a]なら、兄弟のうち一人を、おまえたちが拘束されている場所[b]に残しておけ。おまえたちは行って、家の者たちの飢えをしのぐ穀物を持って帰れ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誠実な者」「真実な者」。ヘブライ語の形容詞は、真実であること、信頼できることを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「おまえたちの拘束の家」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: 正直な者
  rationale: この文脈では、兄弟たちの供述が真実かどうかが試されている。「正直な者」は現代日本語として自然であり、人柄の高潔さだけに意味を限定しない。
- source_word: אֲחִיכֶם אֶחָד
  choice: 兄弟のうち一人
  rationale: 兄弟たちの中の一人という部分集合の意味を、自然な日本語で明確に表す。
- source_word: יֵאָסֵר
  choice: 拘留しておけ
  rationale: אסר のニファルは、縛られることにも拘禁されることにもなり得る。直後の拘留場所への言及に合わせ、身体を縄で縛ることに限定せず、拘禁の意味を表した。
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: おまえたちが留置されていた場所
  rationale: 直訳は「おまえたちの拘留の家」。接尾辞は彼らが置かれていた拘留状態・場所を指すと理解し、古代の施設を近代的な「刑務所」と断定しない表現にした。
- source_word: וְאַתֶּם לְכוּ
  choice: おまえたちは行って
  rationale: 独立代名詞による、一人だけ残る兄弟と出発する他の者たちとの対照を保った。接続詞は過度に逆接化せず、文の流れの中で表した。
- source_word: הָבִיאוּ
  choice: 持って帰れ
  rationale: בוא のヒフィルは「持って来る」を表すが、ここでは穀物を家族のもとへ運ぶ指示なので、日本語の視点に即して「持って帰れ」とした。
- source_word: שֶׁבֶר
  choice: 穀物
  rationale: ヨセフ物語の飢饉場面では、購入される食糧、とりわけ穀物を指すため、広すぎる「食べ物」ではなく「穀物」とした。
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: 家族の飢えをしのぐ
  rationale: 字義的には「おまえたちの家々の飢饉（飢え）」に近い。בָּתֵּיכֶם は建物より家に属する人々を指すため「家族」とし、目的関係を自然な日本語で表した。
