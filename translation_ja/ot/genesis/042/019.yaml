  naturalness: 命令としての調子は自然である。「拘留しておけ」より「残しておけ」のほうが、一人をその拘束場所にとどめ、他の者は出発するという場面を明瞭かつ自然に伝える。
  terminology: 「拘束されている場所」は、古代の施設を近代的な刑務所・留置場と特定せず、מִשְׁמָרの拘禁・監視下という意味を保つ。「家族」は文脈上許容されるが、原文の「家々／世帯」の範囲を保つため「家の者たち」とする。
