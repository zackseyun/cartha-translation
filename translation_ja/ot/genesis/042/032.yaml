id: GEN.42.32
reference: Genesis 42:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שְׁנֵים עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑י/נוּ הָ/אֶחָ֣ד אֵינֶ֔/נּוּ וְ/הַ/קָּטֹ֥ן הַ/יּ֛וֹם אֶת אָבִ֖י/נוּ בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: ja
  text: 私たちは十二人兄弟で、皆、同じ父の息子です。一人はもういません[a]。末の弟は今日、カナンの地で父と一緒にいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一人はいません」。このヘブライ語表現は、その人が不在である、いなくなった、または死んだと思われていることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: 私たちは十二人兄弟です
  rationale: 動詞のないヘブライ語節を、人数と兄弟関係が明確に伝わる自然な現代日本語にした。
- source_word: בְּנֵי אָבִינוּ
  choice: 皆、同じ父の息子です
  rationale: 直訳的な「私たちの父の息子たち」では日本語として不自然なため、同じ父を持つ兄弟であるという同格的説明を明確に表した。
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: 一人はもういません
  rationale: אֵינֶנּוּ は字義的には「彼はいない」で、行方不明・不在・死亡したと考えられている状態を表し得る。「もういません」は死と断定せず、文脈上の重みも保つ。
- source_word: וְהַקָּטֹן
  choice: 末の弟
  rationale: קָטֹן はここでは兄弟のうち最も年下の者を指す。「末の弟」は日本語の家族文脈で自然かつ明確である。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 時間副詞を直接訳し、発言時点での状況という原文の即時性を保った。
- source_word: אֶת אָבִינוּ
  choice: 父と一緒に
  rationale: ここでの אֶת は目的語標識ではなく同伴を示すため、「父と一緒に」とした。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地で
  rationale: 「地」を明示する原文の構造を、自然な日本語で保持した。
theological_decisions:
- issue: אֵינֶנּוּ がヨセフの死を意味するか
  choice: 「もういません」とし、死を明言しない
  alternative: 「もう死にました」「もうこの世にいません」
  rationale: 兄たちはヨセフを失われた者とみなしているが、このヘブライ語表現自体は不在・喪失・死亡推定の幅を持つため、その曖昧さを残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「私たちの父の息子たち」という不自然な逐語訳を避けつつ、全員が同じ父の息子であるという原文の説明を保持した。「今日」は原文に即して残し、「一人はもういません」には意味範囲を示す注を付した。
