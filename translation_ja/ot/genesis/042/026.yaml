  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: ja
  text: そこで彼らは、自分たちの穀物[a]をろばに積み、そこを立ち去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食糧」または「買い入れた穀物」とも訳せる。ヘブライ語の語は食糧を広く指すことがあるが、ここではエジプトで買い入れた穀物を指すのが最も自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: 積み
  rationale: נשׂאは基本的に「持ち上げる、運ぶ」を意味するが、荷を家畜の上に載せるこの文脈では、日本語の「積む」が動作を自然かつ簡潔に表す。
- source_word: שִׁבְרָם
  choice: 自分たちの穀物
  rationale: שֶׁבֶרは食糧一般を指すこともあるが、ヨセフ物語の飢饉とエジプトでの買い付けという文脈では、入手した穀物を指すと考えるのが最も自然である。接尾辞「彼らの」は、主語との関係が明確になるよう「自分たちの」とした。
- source_word: עַל חֲמֹרֵיהֶם
  choice: ろばに
  rationale: עַלはここでは積み荷をろばの上に載せる関係を示す。日本語では「ろばに積む」が自然であり、場所・方向の意味を過不足なく伝える。
- source_word: וַיֵּלְכוּ
  choice: 立ち去った
  rationale: הלךは一般的な移動を表すが、מִשָּׁם「そこから」と組み合わされて出発を示すため、「立ち去った」と訳した。
- source_word: מִשָּׁם
  choice: そこを
  rationale: 直訳は「そこから」。日本語では「そこを立ち去った」とすることで、起点と離去の意味を自然に表せる。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、物語文にふさわしい簡潔で品位ある調子を保った。「そこで」は継起を示す接続として用い、「立ち去った」によって מִשָּׁם を伴う移動の意味を自然に表した。
