  - severity: low
    issue: 終文の「降りかかっている」は継続状態に寄る。
    rationale: עָלַי הָיוּ כֻלָּנָה は、これらすべての事態が自分に不利に及んだという累積的な訴えである。「降りかかってきた」は自然な日本語でその完了的・累積的含意を表せる。
