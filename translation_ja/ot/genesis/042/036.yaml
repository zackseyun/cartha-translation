base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: ja
  text: 彼らの父ヤコブは彼らに言った。「おまえたちは、私に子を失わせた。ヨセフはいない。シメオンもいない。そのうえ、ベニヤミンまで連れて行こうというのか。これらすべてが私に降りかかってきた。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: 私に子を失わせている
  rationale: ピエル形が表す、子を失わせて親を悲嘆させる意味を明示する。完了形は、すでに生じた損失と、ベニヤミンをめぐって続く事態を一つの嘆きとして捉えた表現と理解した。
- source_word: אֵינֶנּוּ
  choice: いない
  rationale: 死と断定せず、不在・喪失を表すヘブライ語の曖昧さを保つ。ヨセフとシメオンの双方に自然に用いることができる。
- source_word: תִּקָּחוּ
  choice: 連れて行こうというのか
  rationale: 未完了形が文脈上示す、目前の意図された行為に対するヤコブの抗議を自然な現代日本語で表した。
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: これらすべてが私に降りかかっている
  rationale: עָלַי の不利な影響と、複数の出来事が累積してヤコブを襲う感覚を保つ。
- source_word: אֹתִי
  choice: 私に
  rationale: 前置された目的語による、損失を被るヤコブ自身への強調を日本語でも明示した。
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: 彼らの父ヤコブ
  rationale: 関係を明確にしつつ、自然で格調ある日本語の語順とした。
