  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: ja
  text: しかし父は言った。「私の息子は、おまえたちと一緒に下って行かない。この子の兄は死んでおり、この子だけが残っているからだ。おまえたちが行く道中で、もしこの子に災難が降りかかれば、おまえたちは私の白髪を悲しみのうちにシェオルへ下らせることになる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シェオル」は、死者の領域を指すヘブライ語。「墓」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: 下って行かせない
  rationale: 原文は字義的には「下らない」だが、父が同行を許さないという文脈を自然な日本語で表した。カナンからエジプトへ「下る」という創世記の地理的表現も保持する。
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: この子だけが残った
  rationale: ラケルの子らのうち、ヤコブの認識ではベニヤミンだけが残っているという強調を保つ。
- source_word: אָסוֹן
  choice: 災難
  rationale: 重大な危害や不幸を表す語であり、死に限定せず、文脈上の深刻さを伝える。
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: おまえたちが行く道中で
  rationale: 「あなたがたがそこを行く道で」という原文の具体的な旅路を、明瞭で自然な現代日本語にした。
- source_word: שֵׂיבָתִי
  choice: この白髪の私
  rationale: 字義的な「私の白髪」という老齢の比喩を保ちつつ、日本語として人物自身を指すことが明瞭になるよう表現した。
- source_word: בְּיָגוֹן
  choice: 悲しみのうちに
  rationale: 深い悲嘆を表し、「シェオルへ下る」時の状態を原文どおり示す。
- source_word: שְׁאֹלָה
  choice: シェオルへ
  rationale: 単なる物理的な墓に狭めず、死者の領域を指し得るヘブライ語概念の幅を保持する。
theological_decisions:
- issue: שְׁאוֹלを「墓」と訳すか、音写するか
  choice: シェオル
  alternative: 墓／死者の世界
  rationale: この語が物理的な墓だけを意味するとは限らないため、意味を一つに限定せず、原語の神学的・詩的な幅を残した。
translation_notes:
  register: 家長である父の切迫した拒絶と悲嘆を、現代の読者に明瞭でありながら荘重さを失わない語調で表した。「おまえたち」は父から息子たちへの直接的な呼びかけとして用いた。脚注記号は節末に置き、シェオルの説明に対応させた。
