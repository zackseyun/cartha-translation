id: GEN.42.29
reference: Genesis 42:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֛אוּ אֶל יַעֲקֹ֥ב אֲבִי/הֶ֖ם אַ֣רְצָ/ה כְּנָ֑עַן וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֛ת כָּל הַ/קֹּרֹ֥ת אֹתָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: ja
  text: こうして彼らはカナンの地にいる父ヤコブのもとに帰り、自分たちに起こったことをすべて彼に報告して、こう言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: こうして彼らは…帰り
  rationale: 物語を進めるワイイクトールの継起性を「こうして」で示す。文脈上、息子たちが父のもとへ戻る場面なので、日本語では「来て」より「帰り」が自然である。
- source_word: אֶל־יַעֲקֹב אֲבִיהֶם
  choice: 父ヤコブのもとに
  rationale: 方向を示す אֶל と「彼らの父」を、明瞭で自然な現代日本語にした。
- source_word: אַרְצָה כְּנָעַן
  choice: カナンの地にいる
  rationale: ヘブライ語は方向を示す語形で、字義的には「カナンの地へ」だが、直前にも到着先があるため、日本語ではヤコブの所在を示す形にして二重の目的地表現を避けた。
- source_word: וַיַּגִּידוּ לוֹ
  choice: 彼に報告して
  rationale: נגד のヒフィル形は「告げる、報告する」。旅先での出来事を詳しく伝える文脈に「報告する」が適する。
- source_word: אֵת כָּל־הַקֹּרֹת אֹתָם
  choice: 自分たちに起こったことをすべて
  rationale: קרה の分詞表現を、彼らの身に降りかかった一連の出来事として自然に訳した。
- source_word: לֵאמֹר
  choice: こう言った
  rationale: 次節から始まる直接話法を導く定型句。日本語では文を自然に完結させつつ続きがあることを示す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「父ヤコブ」として親子関係を簡潔に示し、物語の流れに即して「帰り」を採用した。原文の地理的方向表現は、日本語の不自然な二重目的地を避けて所在表現に調整した。
