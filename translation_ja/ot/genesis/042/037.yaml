  text: וַ/יֹּ֤אמֶר רְאוּבֵן֙ אֶל אָבִ֣י/ו לֵ/אמֹ֔ר אֶת שְׁנֵ֤י בָנַ/י֙ תָּמִ֔ית אִם לֹ֥א אֲבִיאֶ֖/נּוּ אֵלֶ֑י/ךָ תְּנָ֤/ה אֹת/וֹ֙ עַל יָדִ֔/י וַ/אֲנִ֖י אֲשִׁיבֶ֥/נּוּ אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: ja
  text: ルベンは父に言った。「もし私が彼をあなたのもとに連れ帰らなかったなら、私の二人の息子を殺してもかまいません。彼を私に任せてください[a]。私自身が彼をあなたのもとに連れ帰ります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼を私の手の上に置いてください」。すなわち、「彼を私に任せてください」の意。
    reason: ヘブライ語の具体的な「手」の表現と、その委託を表す慣用的な意味の両方を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר רְאוּבֵן אֶל־אָבִיו
  choice: ルベンは父に言った
  rationale: 物語を進める接続形は、日本語では文脈上自然な単純過去で表した。לֵאמֹר は直接話法の導入と重なるため、別語としては訳出しない。
- source_word: אֶת־שְׁנֵי בָנַי תָּמִית
  choice: 私の二人の息子を殺してもかまいません
  rationale: מות のヒフィル形が示す「死に至らせる」を明確に表しつつ、未完了形を命令そのものと断定せず、失敗した場合に父がそうしてよいというルベンの誓約として自然に訳した。
- source_word: אִם־לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: もし私が彼をあなたのもとに連れ帰らなかったなら
  rationale: בוא のヒフィル形は字義的には「連れて来る」だが、ベニヤミンを父のもとへ戻す文脈を「連れ帰る」で明示した。
- source_word: תְּנָה אֹתוֹ עַל־יָדִי
  choice: 彼を私の手に託してください
  rationale: 字義的な「私の手の上に置く」という身体的比喩を「私の手に」で残し、その慣用的意味である委託を「託す」で自然に表した。字義形は脚注に示した。
- source_word: וַאֲנִי אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: 私が必ず彼をあなたのもとに連れ帰ります
  rationale: 明示された独立代名詞 אֲנִי の強調を「私が必ず」で表し、שׁוב のヒフィル形「戻らせる」を自然な「連れ帰る」とした。
theological_decisions:
- issue: ルベンの発言を命令と許可のどちらに寄せるか
  choice: 「殺してもかまいません」とし、誓約に伴う許可として表した
  alternative: 「殺してください」または「殺せ」
  rationale: 原文の תָּמִית は命令形ではなく未完了形であり、条件節と結びついた帰結・許可として読む余地がある。強烈な発言内容は保ちつつ、文法上の形を命令へ固定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、家族間の切迫した誓約にふさわしい簡潔で重みのある語調とした。「彼」は直前の文脈に従ってベニヤミンを指すが、原文同様、この節では固有名を補っていない。
