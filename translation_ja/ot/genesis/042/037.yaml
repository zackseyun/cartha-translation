revisions:
- from: ルベンは父に言った。「もし私が彼をあなたのもとに連れ帰らなかったなら、私の二人の息子を殺してもかまいません。彼を私の手に託してください[a]。私が必ず彼をあなたのもとに連れ帰ります。」
  to: ルベンは父に言った。「もし私が彼をあなたのもとに連れ帰らなかったなら、私の二人の息子を殺してもかまいません。彼を私に任せてください[a]。私自身が彼をあなたのもとに連れ帰ります。」
  rationale: 主語代名詞による強調を「私自身が」で明示し、原文にない確実性副詞「必ず」を除いた。また、委託を表す慣用句は本文で自然な日本語にし、その字義的表現を脚注に保存した。条件付きの強い申し出については、原文の未完了形が許可・誓約としても読めることを保つため「殺してもかまいません」を維持した。
