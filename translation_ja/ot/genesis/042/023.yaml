  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: ja
  text: しかし彼らは、ヨセフが自分たちの話を理解している[a]とは知らなかった。ヨセフと彼らの間に通訳がいたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聞いている」。ここでは、彼らの話している言葉を理解している、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: しかし彼らは
  rationale: 接続詞と代名詞による前文との対照を、現代日本語の自然な物語表現で示した。
- source_word: לֹא יָדְעוּ
  choice: 知らなかった
  rationale: ידעの完了形が表す認識の欠如を、直接的で自然な日本語にした。
- source_word: כִּי
  choice: 〜とは
  rationale: 最初のכִּיは、彼らが知らなかった事柄の内容を導くため、日本語では引用内容を示す「〜とは」で表した。
- source_word: שֹׁמֵעַ
  choice: 話を理解している
  rationale: 基本義は「聞く」だが、通訳が介在する文脈で焦点となるのは、ヨセフが兄弟たちの言語を理解できたことである。語の字義的な可能性は脚注に残した。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: כִּי
  choice: 〜からである
  rationale: 二つ目のכִּיは、兄弟たちが気づかなかった理由を示すため、明瞭な理由表現とした。
- source_word: הַמֵּלִיץ
  choice: 通訳
  rationale: 異なる言語の話者の間で発言を取り次ぐ者を指す文脈上の意味を簡潔に表した。
- source_word: בֵּינֹתָם
  choice: 彼らの間には
  rationale: ヨセフと兄弟たちの間に通訳が介在していたという関係を自然に表した。
