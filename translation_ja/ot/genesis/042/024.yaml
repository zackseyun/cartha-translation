base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: ja
  text: 彼は彼らから顔を背けて泣いた。それから彼らのところに戻って彼らに話し、彼らの中からシメオンを連れ出して、彼らの目の前で縛った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: 彼らから顔を背けて
  rationale: סבבと分離を表すמֵעֲלֵיהֶםを合わせ、彼らのいる方から向きを変えた動作を自然な日本語で表した。「立ち去った」とまでは本文にないため避けた。
- source_word: וַיֵּבְךְּ
  choice: 泣いた
  rationale: בכהの物語文における直接的で一般的な訳。
- source_word: וַיָּשָׁב אֲלֵיהֶם
  choice: 彼らのところに戻って
  rationale: שובの「戻る」という意味と、אֲלֵיהֶםが示す帰着先を明確にした。
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: 彼らに話し
  rationale: 発言内容が記されていないため、דברの基本的意味を簡潔に訳した。
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  choice: 彼らの中からシメオンを連れ出して
  rationale: מֵאִתָּםが集団の中から一人を取り分けることを示すため、「彼らから取った」より自然で具体的な表現とした。「捕らえた」は文脈上あり得るが、לקח自体より意味を強めるため採らなかった。
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: 縛った
  rationale: אסרがここで表す具体的な拘束行為を保持し、「投獄した」という解釈的な訳を避けた。
- source_word: לְעֵינֵיהֶם
  choice: 彼らの目の前で
  rationale: 直訳的な像と、兄弟たちに見えるところで行ったという公開性の双方を自然な日本語で表した。
theological_decisions: []
