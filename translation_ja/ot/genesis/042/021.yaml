base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: ja
  text: 彼らは互いに言った。「確かに、私たちは弟のことで罪を負っている。弟が私たちに嘆願したとき、その心の苦しみ[a]を見ながら、私たちは聞き入れなかった。だから、この苦しみが私たちに降りかかったのだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼の魂の苦しみ」。人の全存在に及ぶ深い苦悩を表す言い方。
    reason: lexical_alternative
  - marker: b
    text: 原文では、弟の「苦しみ」と兄たちに降りかかった「苦しみ」に同じ語が用いられ、過去の仕打ちと現在の苦境が結びつけられている。
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: 彼らは互いに言った
  rationale: אִישׁ אֶל־אָחִיו の相互的な意味を、自然な現代日本語で表した。物語をつなぐ接続辞は、日本語では明示しなくても流れが保たれる。
- source_word: אֲבָל
  choice: 確かに
  rationale: ここでは逆接ではなく、自らの罪を強く認める語として用いられているため。
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: 私たちは弟のことで罪を負っている
  rationale: אָשֵׁם の罪責・責任の意味を保ち、עַל は罪が関わる事柄を示すものとして訳した。文脈上「兄弟」はヨセフを指し、話者たちから見て弟なので「弟」とした。
- source_word: צָרַת נַפְשׁוֹ
  choice: その心の苦しみ
  rationale: 直訳的な「彼の魂の苦しみ」が示す深い内面的苦悩を、明瞭で自然な日本語にした。
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: 私たちに嘆願したとき
  rationale: חנן の再帰・強意形が表す切実な懇願を訳しつつ、原文に明示されない目的語「憐れみを」は補わなかった。
- source_word: וְלֹא שָׁמָעְנוּ
  choice: 私たちは聞き入れなかった
  rationale: 単に音を聞かなかったのではなく、訴えに応じず退けたという文脈上の意味を表した。
- source_word: עַל־כֵּן בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: だから、この苦しみが私たちに降りかかったのだ
  rationale: 原因と結果の結びつきを明示し、בוא אל の慣用的な到来を「降りかかった」と自然に表した。また צָרָה を前半と同じ「苦しみ」で訳して語の反復を保った。
