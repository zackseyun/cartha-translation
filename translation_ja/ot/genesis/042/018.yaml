  text: 三日目に、ヨセフは彼らに言った。「こうしなさい。生きなさい[a]。私は神を畏れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「こうしなさい。そうすれば生きられる」。ヘブライ語は二つの命令としても、先行する命令に続く結果としても理解できる。
    reason: וִחְיוּ は複数への命令形であるが、命令の連続は結果・帰結を表すこともあるため。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: ヨセフは彼らに言った
  rationale: אמרの物語用法と間接目的語を、現代日本語の自然な語順で表した。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目に
  rationale: 定冠詞を伴う序数の時を示す句を、簡潔で自然な日本語にした。
- source_word: זֹאת עֲשׂוּ
  choice: こうしなさい
  rationale: 指示代名詞と複数命令形を、文脈に即した自然な命令表現で訳した。
- source_word: וִחְיוּ
  choice: そうすれば生きられる
  rationale: 命令形の連続が示し得る結果・帰結を自然な日本語で表しつつ、直結した命令「生きよ」の可能性は脚注に残した。
- source_word: אֶת הָאֱלֹהִים
  choice: 神を
  rationale: ここでは定冠詞付きאֱלֹהִיםがヨセフの畏れる神を指す。日本語では固有の指示を不自然に説明せず「神」とした。
- source_word: אֲנִי יָרֵא
  choice: 私は神を畏れている
  rationale: 明示された一人称代名詞と状態・特性を表す分詞を反映した。「畏れる」は単なる恐怖ではなく、神への畏敬を含む。
theological_decisions:
- issue: אֶת הָאֱלֹהִים אֲנִי יָרֵא におけるヨセフの告白
  choice: 「私は神を畏れている」とし、ヨセフが神への畏敬を自らの措置の背景として示す表現を保った。
  alternative: エジプトの宮廷という場に合わせ、「私は神々を恐れる」または漠然と「神を恐れる」と理解する。
  rationale: 創世記の物語ではヨセフと父祖の神との関係が一貫して描かれる一方、この一節だけで説明を付加せず、原文の簡潔な「神」をそのまま保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「恐れる」ではなく「畏れる」を用い、神への畏敬という含意を自然に示した。主文の脚注記号[a]は該当表現の直後に置いた。
