base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: ja
  text: 'ユダよ、

    兄弟たちはあなたをたたえる。[a]

    あなたの手は敵のうなじの上にあり、

    あなたの父の息子たちはあなたにひれ伏す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「たたえる」と訳したヘブライ語は、「感謝する」「認める」という意味にもなり得る。ここでは「ユダ」という名との語呂合わせになっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: ユダ
  rationale: 固有名として、日本語聖書で定着している表記を用いた。続く動詞 ידה との語呂合わせは日本語では再現できないため、脚注で補う。
- source_word: יוֹדוּךָ
  choice: あなたをたたえる
  rationale: ידה のヒフィル形は、感謝する、ほめたたえる、認めるなどの意味を持ち得る。ここでは祝福の文脈とユダの名との語呂合わせから、「たたえる」が最も適切である。
- source_word: אַחֶיךָ
  choice: 兄弟たち
  rationale: 男性複数名詞に二人称男性単数接尾辞が付く。ヤコブの息子たちという直接の文脈に合わせ、原文の性と家族関係を保った。
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: あなたの手は敵のうなじを押さえ
  rationale: 原文には「押さえる」に相当する動詞はないが、「手が敵のうなじにある」という征服の比喩を、具体的な身体像を保ちながら自然な日本語にした。עֹרֶף は首の後ろ、すなわち「うなじ」を指す。
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: あなたの前にひれ伏す
  rationale: この動詞は文脈により礼拝または服従・敬意を表す伏礼を意味する。ここではユダに対する家族的・王的な服従なので、「礼拝する」とせず「ひれ伏す」とした。
- source_word: בְּנֵי אָבִיךָ
  choice: 父の子ら
  rationale: 直訳的な「あなたの父の息子たち」は日本語では重いため、二人称所有を文脈上明らかなものとして省きつつ、「父の子ら」という原文の表現を保った。
theological_decisions:
- issue: יִשְׁתַּחֲווּ לְךָ が表す敬意の性質
  choice: 人間であるユダへの服従・敬意を表す「ひれ伏す」
  alternative: 神への礼拝を示す「礼拝する」
  rationale: ヤコブがユダに与える祝福という直接の文脈では、王的権威への服従を表す。後代の神学的理解を本文へ先取りして読み込まず、動作と敬意の含みを保持した。
translation_notes:
  register: 明快で格調ある現代標準日本語。詩的な並行構造と身体的イメージを保った。「うなじを押さえ」は原文の動詞省略を日本語で自然に補った表現であり、征服・優位の含意を伝える。脚注記号 [a] は該当箇所の直後に置いた。
