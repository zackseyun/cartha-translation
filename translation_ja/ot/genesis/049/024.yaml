  text: וַ/תֵּ֤שֶׁב בְּ/אֵיתָן֙ קַשְׁתּ֔/וֹ וַ/יָּפֹ֖זּוּ זְרֹעֵ֣י יָדָ֑י/ו מִ/ידֵי֙ אֲבִ֣יר יַעֲקֹ֔ב מִ/שָּׁ֥ם רֹעֶ֖ה אֶ֥בֶן יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: ja
  text: しかし、彼の弓は揺るがず、彼の腕はヤコブの力ある方の御手によってしなやかにされた。そこから、イスラエルの牧者、イスラエルの岩が来る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そこから、イスラエルの牧者、イスラエルの岩が来る」に当たるヘブライ語は、統語上、意味を取りにくい表現である。末尾を前の句に結びつけ、「イスラエルの牧者、イスラエルの岩である方によって」と理解する別解もある。
    reason: מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל の統語的・解釈的曖昧さを保存し、本文の「そこから」という読みと、前句に結びつける解釈の双方を示すため。
lexical_decisions:
- source_word: וַתֵּשֶׁב בְּאֵיתָן
  choice: 揺るがず
  rationale: 直訳的には「堅固さのうちにとどまった」。敵の攻撃にも弓が安定して力を保つことを、自然な日本語で表した。
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: 彼の腕はしなやかに動く
  rationale: פזז はここでは敏捷さ、柔軟さ、活力ある動きを示すと解した。「手の腕」というヘブライ語的表現は日本語では簡潔に「腕」とした。
- source_word: אֲבִיר יַעֲקֹב
  choice: ヤコブの力ある方
  rationale: 神を指す称号として、語義と荘重さを保った。
- source_word: רֹעֶה
  choice: 牧者
  rationale: 比喩的な指導者・守護者を表す語を、聖書的でありつつ理解可能な語で訳した。
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: イスラエルの…岩
  rationale: אבן の保護・安定を表す比喩を保持した。日本語では「石」より称号として自然な「岩」を選んだ。
theological_decisions:
- issue: מִשָּׁם と「牧者、イスラエルの岩」の統語関係
  choice: 「そこから、イスラエルの牧者、岩が出る」とし、出所を表す読みを本文に採用
  alternative: 「イスラエルの牧者、岩である方によって」とし、前句の神的称号に結びつける
  rationale: マソラ本文の מִשָּׁם は字義的に「そこから」。統語と意味が難解で複数の解釈があるため、本文では形態に沿う読みを示し、別解を脚注に残した。
- issue: 「牧者」と「岩」の指示対象
  choice: 同一の人物または存在に並置された二つの称号として訳す
  alternative: 二つを別々の指示対象とみなす
  rationale: 無接続で並ぶ רעה אבן ישראל は、同一対象を説明する称号の並置として読むのが自然だが、誰を指すかは本文で限定しない。
translation_notes:
  register: 現代の一般読者に通じる簡潔で荘重な文体。「御手」「牧者」は詩的な祝福の調子と神的称号を保つために用いた。原文の行分けに近い切れ目を句点で示し、難解な末尾は脚注で別解を提示した。
