  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: ja
  text: 'ゼブルンは海の岸辺に住み[a]、

    船のための岸辺に住む[b]。

    その端はシドンの方へ延びる[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の「海」は複数形で、直訳すれば「海々の岸辺」。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「船の岸辺に」。「船のための港に」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「端」は、「脇」「側面」「境」または「最も遠い所」とも訳せる。地理的には、その領域の側面・末端を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: ゼブルン
  rationale: 人名として、日本語で定着している聖書表記を用いた。
- source_word: לְחוֹף יַמִּים
  choice: 海の岸辺に
  rationale: חוֹףの海岸・岸辺という空間的意味を明確にしつつ、複数形יַמִּיםは日本語として自然な単数表現にした。原文の複数形は脚注で示した。
- source_word: יִשְׁכֹּן
  choice: 住み
  rationale: שׁכןの基本義である居住・定住を保ち、詩的な祝福にふさわしい簡潔な表現とした。
- source_word: לְחוֹף אֳנִיּוֹת
  choice: 船の着く岸辺に臨む
  rationale: 字義的には「船の岸辺に」であるが、日本語では関係が不明瞭になるため、船が接岸する海辺という含意を自然に表した。「港」と断定せず、岸辺の像を残した。
- source_word: וְיַרְכָתוֹ
  choice: その端は
  rationale: יַרְכָהは脇、側面、末端を表し得る。ここでは地理的・領域的な文脈に適する「端」を選び、より身体的な比喩や境界という可能性は脚注に残した。
- source_word: עַל צִידֹן
  choice: シドンの方へ延びる
  rationale: עַלを地理的な方向・接近として「の方へ」と訳し、領域の端について自然な日本語となるよう「延びる」とした。シドンに達することまでは断定していない。
