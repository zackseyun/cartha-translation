id: GEN.49.10
reference: Genesis 49:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: ja
  text: シロが来るまで、王笏はユダから離れず、支配者の杖もその足の間から離れない[a]。諸民族は彼に従う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その権利を持つ者が来るまで」とも訳せる。ヘブライ語「シロ」は難解で、称号、地名、または貢ぎ物を指すとも解されている。
    reason: alternative_reading
  - marker: b
    text: 「諸民族は彼のもとに集まる」、または「諸民族は彼に服する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: 王笏
  rationale: מְחֹקֵק と並ぶ王権の詩的文脈において、単なる杖や部族ではなく、統治権を象徴する笏を指すと判断した。
- source_word: מִיהוּדָה
  choice: ユダを離れず
  rationale: 前置詞 מִן の分離・起点の意味を、否定動詞 יָסוּר と合わせて自然な日本語で表した。
- source_word: מְחֹקֵק
  choice: 支配者の杖
  rationale: この語は法を定める者または統治を象徴する杖を指し得る。王笏との並行関係と「足の間」という具体的表現を踏まえ、統治の標章として訳した。
- source_word: מִבֵּין רַגְלָיו
  choice: その足の間を
  rationale: 座して統治する姿や子孫を暗示する可能性はあるが、解釈を本文に織り込まず、ヘブライ語の具体的な像を保った。
- source_word: עַד כִּי
  choice: …時まで
  rationale: 先行する状態の終点を示す表現として、明瞭で自然な日本語にした。
- source_word: שילה
  choice: シロ
  rationale: 意味と形態が古くから論争されている難語である。マソラ本文の伝統的な固有名詞としての読みを音写し、主要な別解は脚注に残した。
- source_word: וְלוֹ
  choice: 彼に
  rationale: 本文でシロを人格的な指示対象として扱う読みと整合させつつ、その人物が誰かは明示しない。
- source_word: יִקְּהַת
  choice: 従う
  rationale: 非常にまれで意味に議論のある語だが、王権の文脈では諸民族の服従を表すと理解できる。日本語では「服従は彼のもの」とせず、自然な動詞表現にした。
- source_word: עַמִּים
  choice: 諸民族
  rationale: 複数形と民族的な広がりを保ち、「国々」より原語に近い表現を選んだ。
theological_decisions:
- issue: 長くメシア的に解釈されてきた שילה の同定と訳し方
  choice: 本文では固有名詞として「シロ」と音写し、指示対象をメシアと明示しない。
  alternative: 「その権利を持つ者が来るまで」「貢ぎ物が彼のもとに来るまで」「彼がシロに来るまで」
  rationale: 難解なヘブライ語を一つの神学的解釈に固定せず、本文の曖昧さと神学的緊張を保つため。
- issue: 節に含まれる王権的・メシア的含意
  choice: 「王笏」「支配者の杖」「諸民族は彼に従う」という王権表現を保つ。
  alternative: 純粋に王朝政治的な表現に弱める、またはメシアを明示する意訳
  rationale: ユダに結びつく王権のイメージは明瞭に訳す一方、本文が直接述べていない教理的同定は加えないため。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調ある詩的表現を用いた。「王笏」はやや文語的だが王権の象徴として定着しており、「支配者の杖」と並べることで意味を明瞭にした。原文の二つの否定句と具体的な身体像を保ち、難語については本文で過度に説明せず脚注で主要な異読を示した。
