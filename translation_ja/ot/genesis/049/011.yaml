  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: ja
  text: 彼は自分の若いろばをぶどうの木につなぎ、自分の雌ろばの子を選り抜きのぶどうの木につなぐ[a]。彼は自分の衣服をぶどう酒で洗い、自分の衣をぶどうの血で洗う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「選り抜きのぶどうの木」は、「上等なぶどうの木」とも訳せる。ヘブライ語は良質なぶどうの木を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ぶどうの血」は、ぶどうの汁またはぶどう酒を表すヘブライ語の詩的表現。
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: つなぎ
  rationale: 男性単数分詞による生き生きとした描写を、後続する動作と自然につながる連用形で表した。
- source_word: לַגֶּפֶן
  choice: ぶどうの木に
  rationale: 定冠詞を伴う単数形だが、ここでは種類を代表する一般的な表現として自然な日本語にした。
- source_word: עירֹה
  choice: 自分のろば
  rationale: עַיִרは若いろば、ろばの子を指し得るが、次句の「雌ろばの子」との過度な反復を避けつつ、所有接尾辞を明示した。
- source_word: וְלַשֹּׂרֵקָה
  choice: 上等なぶどうの木に
  rationale: שֹׂרֵקָהは選り抜きの良質なぶどうの木を指す。「上等な」は現代日本語で品質の高さを明瞭に伝える。
- source_word: בְּנִי אֲתֹנוֹ
  choice: 雌ろばの子
  rationale: 直訳は「彼の雌ろばの息子」。動物について自然な日本語となるよう「子」とし、אֲתוֹןの雌性も保持した。
- source_word: כִּבֵּס
  choice: 洗う
  rationale: 完了形は祝福の詩における鮮明な情景・特徴的行為として理解できるため、時制を過度に限定しない現在形で描写した。
- source_word: בַּיַּיִן
  choice: ぶどう酒で
  rationale: בは液体の中で洗う情景を示すが、日本語では「ぶどう酒で洗う」が自然で、豊富なぶどう酒という具体的イメージも保てる。
- source_word: לְבֻשׁוֹ
  choice: 自分の衣
  rationale: 衣服を表す集合的な語。詩的で簡潔な「衣」とし、所有を明示した。
- source_word: וּבְדַם עֲנָבִים
  choice: ぶどうの血で
  rationale: ぶどうの汁またはぶどう酒を指す詩的比喩を平板化せず、そのまま保持した。
- source_word: סוּתוֹ
  choice: その上着
  rationale: לְבֻשׁוֹと並行する衣服語。具体性を過度に限定せず、現代日本語で理解しやすい「上着」とした。
theological_decisions:
- issue: ユダへの祝福におけるメシア的または部族的なイメージ
  choice: 並外れた豊かさと威厳を示す詩的情景として訳し、本文ではメシア的解釈を明示しない。
  alternative: 直接的なメシア預言として訳す、またはユダ族の歴史的繁栄だけに限定して訳す。
  rationale: より広いユダの託宣は伝統的にメシア的に読まれてきたが、この節自体はぶどう酒の豊かさを詩的に描く。翻訳本文でいずれかの教理的解釈に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祝福の詩にふさわしい簡潔さと品位を保った。二つの平行表現を維持し、「ぶどうの血」という原文の強い比喩も保存した。
