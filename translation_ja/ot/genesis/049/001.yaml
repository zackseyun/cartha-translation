base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: ja
  text: そこでヤコブは息子たちを呼び寄せて言った。「集まりなさい。後の日々[a]にあなたがたに何が起こるかを、あなたがたに告げよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「将来に」とも訳せる。このヘブライ語表現は、文脈によって終末的な意味を帯びることがある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せて
  rationale: この文脈のקראは、息子たちを自分のもとへ招集することを表す。「呼んで」より意図が明確で、自然な日本語となる。
- source_word: בָּנָיו
  choice: 息子たち
  rationale: 続く文脈ではヤコブの男子である十二人と諸部族が念頭にあり、性別を明確にした訳が適切である。
- source_word: הֵאָסְפוּ
  choice: 集まりなさい
  rationale: אסףのニファル命令形が表す、自ら一か所に集まるよう求める意味を、現代日本語で自然に伝える。
- source_word: וְאַגִּידָה לָכֶם
  choice: 告げよう
  rationale: コホータティブによる話者の意志を保ちつつ、ヤコブの厳粛な宣言にふさわしい簡潔な表現とした。
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: あなたがたに何が起こるか
  rationale: ここでקרהは「呼ぶ」ではなく、ある事柄が人に生じる、降りかかるという慣用的意味を持つ。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: これからの日々に
  rationale: 字義的には「日々の後の部分に」。この箇所では息子たちとその諸部族の将来を指し得るため、終末論的意味だけに限定しない未来志向の訳とした。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִיםを明確に終末論的な表現として訳すか
  choice: これからの日々に
  alternative: 終わりの日々に／後の日に
  rationale: この句は文脈によって広く将来を指す場合と、終末的な含意を帯びる場合がある。本文ではヤコブの息子たちと諸部族の将来という広い意味を保ち、より字義的で終末的にも読める訳を脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、ヤコブの厳粛な語り口を「告げよう」で表した。脚注記号は対象句の直後に置いた。
