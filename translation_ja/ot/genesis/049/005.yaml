  terminology: 「シメオン」「レビ」は日本語聖書で定着した固有名詞表記である。「兄弟」「暴虐」「武器」も文脈に適合する。脚注は「剣」という特定化が確定的な語義ではないことを適切に明示しており、教義的な解釈を加えていない。
