  text: שִׁמְע֥וֹן וְ/לֵוִ֖י אַחִ֑ים כְּלֵ֥י חָמָ֖ס מְכֵרֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: ja
  text: 'シメオンとレビは兄弟。

    彼らの剣[a]は暴虐の武器。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「剣」と訳したヘブライ語は極めてまれで、意味は確定していない。「彼らの道具」とも解釈でき、古い翻訳には「彼らの住まい」とするものもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: シメオンとレビ
  rationale: 固有名詞は、日本語聖書で広く定着している音写を用い、接続詞 וְ は「と」とした。
- source_word: אַחִים
  choice: 兄弟
  rationale: 直訳は「兄弟」。動詞のない名詞文を、日本語として簡潔な「兄弟」と表した。実際の兄弟関係と行動上の結びつきの双方を保つ。
- source_word: כְּלֵי חָמָס
  choice: 暴虐の武器
  rationale: כְּלֵי は広く「器具、道具、武器」を意味するが、חָמָס（暴力、暴虐）との結びつきから、文脈に即して「武器」とした。חָמָס は単なる乱暴さでなく不正な暴力を含むため、格調を保ちつつ「暴虐」と訳した。
- source_word: מְכֵרֹתֵיהֶם
  choice: 彼らの剣
  rationale: 極めてまれで意味の確定しない語だが、暴力の道具を指すと見る文脈的解釈に基づき「剣」とした。不確実性と他の可能性は脚注に明示した。
theological_decisions: []
translation_notes:
  register: 簡潔な詩文の並行性を保ち、現代の読者に明瞭でありながら荘重さのある表現とした。語義が不確かな מְכֵרֹתֵיהֶם については本文で一つの有力な解釈を採りつつ、脚注で真正の曖昧さを保存した。
