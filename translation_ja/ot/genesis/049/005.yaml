  source_fidelity: 本文は、名詞文「シメオンとレビは兄弟」と、暴力に関わる武器・器具を述べる後半を忠実に伝えている。「彼らの剣は暴虐の武器」は、ヘブライ語の語順を日本語として自然な主題提示に替えたものであり、意味を損なわない。まれで不確かな מְכֵרֹתֵיהֶם を本文では「剣」とし、脚注で不確実性と主要な代案を保持している。
