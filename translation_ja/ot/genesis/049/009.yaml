  to: 'ユダ[b]は獅子の子。


    獲物から、わが子よ、おまえは上った。


    彼は身をかがめ、獅子のように伏し、

    雌獅子[a]のように横たわった。


    だれが彼を起こせようか。'
  rationale: 動詞を補って解釈を加えるのではなく、原文にある「身をかがめる／伏す（横たわる）」という二つの動作を明示し、両方の獅子の比較句に自然に係るよう整えた。「上った」により原文の方向性の曖昧さを保持した。脚注内容は維持し、内容に対応する箇所へアンカーを移した。
