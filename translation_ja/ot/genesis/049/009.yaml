source:
  edition: WLC
  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: ja
  text: 'ユダ[b]は獅子の子。


    獲物から、わが子よ、おまえは上った。


    彼は身をかがめ、獅子のように伏し、

    雌獅子[a]のように横たわった。


    だれが彼を起こせようか。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、たけき獅子のように」。ここで使われるヘブライ語は、前の「獅子」とは異なる語で、雌獅子とも、成熟した力強い獅子とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: ユダの獅子の姿は、後代の王権やメシアへの希望との関連で予型的に読まれることがある。ただし、この節が直接語っているのは、ヤコブの祝福におけるユダである。
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: 獅子の子
  rationale: 若い動物を表す גּוּר と「獅子」אַרְיֵה の連語。日本語として自然で、ユダを若い獅子にたとえる比喩を簡潔に保つ。
- source_word: מִטֶּרֶף
  choice: 獲物のもとから
  rationale: 前置詞 מִן の起点と טֶרֶף の捕食獣に捕らえられた獲物という像を保つ。「獲物をしとめて」など、動作を明示する解釈は本文に加えない。
- source_word: בְּנִי
  choice: わが子よ
  rationale: ヤコブがユダに直接呼びかける親子関係と詩的な調子を、明瞭で格調ある現代日本語で表す。
- source_word: עָלִיתָ
  choice: おまえは上って来た
  rationale: 二人称単数と「上る」という方向性を保持する。「立ち去った」「安全な所へ戻った」など、獅子の行動についての推測は織り込まない。
- source_word: כָּרַע רָבַץ
  choice: 身をかがめ、…伏した
  rationale: 獅子の比喩に即して、身を低くして横たわる一連の動作として自然に訳す。礼拝を連想させる「ひれ伏す」は避ける。
- source_word: כְּאַרְיֵה
  choice: 獅子のように
  rationale: 比較をそのまま示し、冒頭の אַרְיֵה との語彙的つながりを保つ。
- source_word: וּכְלָבִיא
  choice: また雌獅子のように
  rationale: אַרְיֵה と異なる語であることを訳し分けるため「雌獅子」とした。ただし לָבִיא の性別と語感には幅があるため、別訳を脚注に示す。
- source_word: מִי יְקִימֶנּוּ
  choice: だれが彼を起こせようか
  rationale: קום の使役形を「起こす」と訳し、修辞疑問の威圧感を「起こせようか」で表す。「だれがあえて」のような、明示されていない語は補わない。
theological_decisions:
- issue: ユダの獅子の比喩をメシア預言として明示するか
  choice: 本文ではヤコブがユダ本人ないしユダ族を祝福する直接的意味にとどめる。
  alternative: 後代の王権およびメシアへの希望と結び付ける予型的・メシア的解釈。
  rationale: この節自体はユダを獅子にたとえて力と近寄りがたい威厳を描くが、メシアを明示してはいない。後代の聖書的展開を否定せず、本文へ先取りして挿入もしない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ヤコブの詩的な祝福にふさわしい簡潔で格調ある文体とした。原文にある二人称から三人称への移行を保ち、「おまえ」は父から息子への直接の呼びかけとして用いた。短い行分けによりヘブライ詩の並行と獅子の動作の進展を見えやすくした。
