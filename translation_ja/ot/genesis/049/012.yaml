  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: ja
  text: その目はぶどう酒で赤く、その歯は乳で白い。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その目はぶどう酒よりも暗く（または、いっそう輝いて）、その歯は乳よりも白い」。ヘブライ語のまれな語 חַכְלִילִי と前置詞 מִן は、目と歯の色合いをぶどう酒・乳と比較する意味にも、ぶどう酒・乳によってそのようになるという原因・由来の意味にも理解できる。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: 赤く
  rationale: まれな語で意味には議論があるが、箴言23:29の関連表現と、前節から続くぶどう酒の豊かさという文脈を踏まえ、目の赤みを表す語として訳した。輝きや暗い色合いを指す可能性は注で示した。
- source_word: עֵינַיִם
  choice: 目
  rationale: 両数形だが、日本語では身体部位として自然な単数形の総称「目」で表した。
- source_word: מִיָּיִן
  choice: ぶどう酒で
  rationale: 前置詞 מִן を原因・由来と捉え、豊富なぶどう酒による目の赤みとして訳した。比較を表す可能性もあるため注記した。
- source_word: וּלְבֶן
  choice: その歯は…白い
  rationale: 並行する詩句として、形容詞「白い」を自然な日本語の述語にした。接続詞は読点で結び、簡潔な詩的並行を保った。
- source_word: שִׁנַּיִם
  choice: 歯
  rationale: 両数形を、日本語で自然な総称「歯」とした。
- source_word: מֵחָלָב
  choice: 乳で
  rationale: מִן を原因・由来と捉え、乳の豊かさによって歯が白いという像を表した。比較の可能性は注記した。
theological_decisions:
- issue: 二つの מִן を原因・由来と取るか比較と取るか
  choice: 「ぶどう酒で」「乳で」とし、豊かさの結果を描く読みを本文に採用
  alternative: 「ぶどう酒よりも暗く（または赤く）、乳よりも白い」
  rationale: 49:11から続くぶどう酒と乳の豊かさ、חַכְלִילִי の語義上のつながり、二行の対句を考慮すると、原因・由来の読みが十分に強い。一方、מִן には比較用法もあり、伝統的な比較の読みも排除できないため注で保持した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調ある詩文とした。「ワイン」ではなく聖書文体になじむ「ぶどう酒」を用い、原因・由来を表す「で」によって原文の凝縮した並行法を保った。
