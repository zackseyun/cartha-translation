base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: ja
  text: イッサカルは骨太のろば。二つの囲いの間に伏している。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鞍袋の間に」とも訳せる。ヘブライ語はまれな語で、意味について議論がある。伝統的には、家畜を入れる二つの囲いを指すと理解されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: イッサカル
  rationale: ヘブライ語の人名を、日本語聖書で定着している形で音写した。
- source_word: חֲמֹר גָּרֶם
  choice: 骨太のろば
  rationale: 直訳的には「骨のろば」。痩せて骨張った姿ではなく、頑丈な体格を表す可能性が高いため、具体的な骨の比喩を保ちながら自然な日本語にした。
- source_word: רֹבֵץ
  choice: 伏している
  rationale: 動物が身を伏せて横たわる状態を表す分詞。詩的で簡潔な動物像を保つ。
- source_word: בֵּין
  choice: 間に
  rationale: 二者の間を示す基本的な意味をそのまま表した。
- source_word: הַמִּשְׁפְּתָיִם
  choice: 二つの囲い
  rationale: まれで語義に議論のある双数形。家畜の囲いとする伝統的・牧畜的理解を本文に採り、双数の形も反映した。ただし何の囲いかを「羊」と限定せず、異説を脚注に示した。
