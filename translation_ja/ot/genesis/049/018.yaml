base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: ja
  text: ヤハウェよ、私はあなたの救いを待ち望みます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェよ、私はあなたの救いを待ち望んできました」。ヘブライ語の「救い」は「救出」とも訳せる。神名は原文ではYHWH。
    reason: 動詞の時制・相と名詞の語義、および神名の表記に関する訳語の選択肢を示すため。
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: あなたの救いを
  rationale: יְשׁוּעָהは救出・解放・救いを表す。ここでは意味を軍事的な救出に限定せず、広がりを保つ「救い」とした。前置詞לִは、目的語を取る日本語の「待ち望む」によって自然に表現した。
- source_word: קִוִּיתִי
  choice: 私は待ち望みます
  rationale: קוהは期待と希望を込めて待つことを表すため、単なる「待つ」より「待ち望む」が適切である。完了形は「待ち望んできました」とも訳せるが、この短い詩的な告白では継続する期待を自然に示す現在形とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字יהוהを称号に置き換えず、一般的な日本語音写「ヤハウェ」で表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく固有の神名を用いているため、その区別を保って音写した。
- issue: יְשׁוּעָהの意味の幅
  choice: 救い
  alternative: 救出
  rationale: 具体的な危機からの解放を含みつつ、それだけに狭めない原語の幅を保つため「救い」とした。
translation_notes:
  register: 簡潔な詩的発言として、前置された「あなたの救いを」を保ち、期待を含む「待ち望む」を用いた。語調は現代日本語として明瞭でありながら、族長の祝福の中の祈りにふさわしい格調を保つ。
