  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: ja
  text: 彼は、休息の場所が良く[a]、その土地が快いのを見て、肩をかがめて荷を負い、強制労働に従事する者となった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「休息が良く」。ヘブライ語は「休息」と「休息の場所」のどちらも意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「貢納に服するしもべとなった」または「奴隷労働者となった」。原語は賦役などの強制労働を指すことが多いが、厳密な社会的意味については議論がある。
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: 安息の地
  rationale: 「休息」と「休息の場所」の両義がある。ここでは並行する「土地」と領土の文脈により、場所を表す意味を本文に採った。
- source_word: טוֹב
  choice: 良い
  rationale: 原語の簡潔で広い肯定的意味を保つ。
- source_word: הָאָרֶץ
  choice: その土地
  rationale: イッサカルの部族領を指す文脈に即し、「地」より自然な領土表現とした。
- source_word: נָעֵמָה
  choice: 快い
  rationale: 土地の好ましさ、心地よさを、抑制の利いた現代日本語で表す。
- source_word: וַיֵּט שִׁכְמוֹ
  choice: 肩をかがめて
  rationale: 重荷に身を屈して従う身体的比喩を保持しつつ、日本語として自然にした。
- source_word: לִסְבֹּל
  choice: 荷を負い
  rationale: 目的語が明示されない「負う」を、日本語で理解しやすくしながら、肩と重荷のイメージを保つ。
- source_word: לְמַס עֹבֵד
  choice: 強制労働に服する者
  rationale: מַסがしばしば賦役・強制労働を表し、עֹבֵדが働く者を指すことを反映する。奴隷身分と断定せず、強制的な労役への従属を表した。
theological_decisions:
- issue: 末尾におけるイッサカルの従属の性質
  choice: 強制労働に服する者となった
  alternative: 貢納に服するしもべとなった／奴隷労働者となった
  rationale: מַסは強制労働・賦役を指す可能性が高いが、貢納的隷属という解釈もあり得る。本文では有力な労役の意味を採り、社会的身分を過度に限定する別訳は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。詩的な身体イメージを残し、文脈上必要な「荷」を補って自然な日本語にした。脚注記号は該当箇所に置いた。
