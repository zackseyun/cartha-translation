translation_notes:
  register: 簡潔な詩文の並行性と前半から後半への逆転を保ちつつ、現代の一般読者に明瞭な語彙を用いた。原文の語呂合わせは日本語本文だけでは保持できないため脚注で示し、「かかと」の比喩が持つ解釈上の幅は本文と脚注の双方で保った。
