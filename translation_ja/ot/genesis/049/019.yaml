  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: ja
  text: 'ガドには略奪隊が襲いかかる。

    しかし彼は、その後方を襲う。[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「ガド」「略奪隊」「襲う」に音の響きが重なる語呂合わせが用いられている（gad／gedud／yagud）。
    reason: lexical_alternative
  - marker: b
    text: 直訳「かかとを」。敵の背後を攻撃すること、または敵の後を追って襲うことを意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: ガド
  rationale: ヤコブの息子およびその部族の固有名として、現代日本語で一般的な音写を用いた。
- source_word: גְּדוּד
  choice: 略奪隊
  rationale: 襲撃や略奪を行う武装集団を指す語。後続する同根動詞との語呂合わせを日本語で完全には再現できないため、意味を明確に伝える語を選んだ。
- source_word: יְגוּדֶנּוּ
  choice: 襲いかかる
  rationale: גדד の未完了形に三人称男性単数の接尾辞が付いた形。略奪隊による敵対的な襲撃を自然な日本語で表した。
- source_word: וְהוּא
  choice: しかし彼は
  rationale: 接続詞は字義的には「そして」も可能だが、襲われる側から反撃する側への転換を表す文脈上、逆接として訳した。
- source_word: יָגֻד
  choice: 襲う
  rationale: 前の動詞と同じ語根に由来するため、「襲いかかる／襲う」と近い表現を用いて反復を示した。
- source_word: עָקֵב
  choice: そのかかと
  rationale: 字義は「かかと」。敵の後方を襲う、または後を追って攻撃するという比喩的意味を含み得るため、本文では具体像と曖昧さを保った。
