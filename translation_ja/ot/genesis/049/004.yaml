  variant: clear modern standard Japanese
source:
  edition: WLC
  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: ja
  text: '水のように奔放なおまえは、


    優位に立てない。


    父の寝床に上ったからだ。


    そのとき、おまえは私の寝床を汚した――


    彼は私の寝床に上った。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より滑らかには、「そのとき、おまえは私の寝床を汚した。おまえは私の寝床に上ったのだ」とも訳せる。ヘブライ語本文は末尾で唐突に三人称の「彼は上った」へ移る。これはルベンを指す感嘆的な反復とも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: 定まらない者
  rationale: この語が表す不安定さ、無軌道さ、抑えの利かない性質を、水との比喩が自然に通じる現代日本語で表した。単なる感情の揺れではなく、ルベンの軽率で制御されない性質を含意する。
- source_word: כַּמַּיִם
  choice: 水のように
  rationale: 原文の簡潔な直喩をそのまま保ち、形や流れが定まらない水の性質との比較を伝えた。
- source_word: אַל תּוֹתַר
  choice: おまえは抜きん出ることがない
  rationale: יתרがここで示す卓越、優越、長子としての上位性を、長子の特権という説明を本文へ補わずに表した。否定命令とも未来の宣告とも取り得る形だが、文脈上の宣告として自然な日本語にした。
- source_word: כִּי עָלִיתָ
  choice: 上ったからだ
  rationale: כִּיの理由を示す働きと、性的行為を婉曲に指すעלהの比喩的表現を保った。露骨な説明は加えていない。
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: 父の寝床
  rationale: 原文は形態上複数だが、一つの婚姻の寝床を指す表現として日本語では単数が自然である。所有関係は明瞭に保った。
- source_word: אָז
  choice: その時
  rationale: 出来事の時点と結果を簡潔に示す原文の副詞に対応させた。
- source_word: חִלַּלְתָּ
  choice: 汚した
  rationale: 性的・家族的文脈における冒瀆と汚損の重大さを、現代日本語で明瞭に伝える語を選んだ。
- source_word: יְצוּעִי
  choice: 私の寝床
  rationale: 一人称所有の移行を明示し、寝る場所および婚姻の床を表す語として自然で重みのある表現にした。
- source_word: עָלָה
  choice: 彼はそこに上った
  rationale: マソラ本文の三人称男性単数を保ち、直前までの二人称からの唐突な人称転換を解消しなかった。「そこ」は「私の寝床」を受け、過度な反復だけを避けた。
theological_decisions:
- issue: ルベンの行為を指す性的婉曲表現と道徳的評価
  choice: 「父の寝床に上った」「私の寝床を汚した」と、原文の婉曲性を保ちながら理解可能に訳す。
  alternative: 「父のそばめと寝た」など、創世記35章22節の情報を明示的に補う。
  rationale: 本節自体は行為を婉曲に述べているため、その調子を維持した。具体的な相手を本文に補わず、原文の告発の強さは「汚した」で示した。
- issue: 末尾のעָלָהにおける人称の急変
  choice: 本文では三人称を保ち、「彼はそこに上った」とする。
  alternative: 二人称に整えて「おまえは私の寝床に上った」とする、または「そこに上ったのだ」と主語を省く。
  rationale: 原文の三人称男性単数は統語上唐突であり、ルベンを指す感嘆的な反復とも理解される。真正な曖昧さと修辞的な衝撃を本文に残し、滑らかな理解を脚注に示した。
translation_notes:
  register: 現代標準語による、簡潔で格調を保った父の宣告として訳した。呼びかけには「おまえ」を用い、家族内の厳しい叱責と詩的託宣の直接性を表した。行分けによってヘブライ詩の節を示し、末尾の急変はダッシュで際立たせた。
