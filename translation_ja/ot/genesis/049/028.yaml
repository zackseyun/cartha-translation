  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: ja
  text: これらすべてはイスラエルの十二部族である。これは、彼らの父が彼らに語り、彼らを祝福したことである。父は一人ひとりを、それぞれの祝福に応じて祝福した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: これらすべて
  rationale: 指示表現の集合的な力を保ちつつ、現代日本語として自然にまとめた。
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: イスラエルの十二部族
  rationale: 連語と同格の数詞を、日本語で定着した簡潔な語順にした。
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: これは、彼らの父が彼らに語ったことであり
  rationale: דִּבֶּר の「語る」を保ち、先行する発言全体を総括する構文として訳した。
- source_word: וַיְבָרֶךְ אֹתָם
  choice: 彼は彼らを祝福した
  rationale: 接続された独立した動作として表し、「祝福した時」と解釈的に従属させることを避けた。
- source_word: אִישׁ אֲשֶׁר כְּבִרְכָתוֹ
  choice: 一人ひとりを、それぞれの祝福に応じて
  rationale: אִישׁ の配分的用法と、כְּ の「～に応じて／～に従って」を保持した。「ふさわしい」と意味を限定せず、原文の簡潔さと余地を残した。
- source_word: בֵּרַךְ אֹתָם
  choice: 祝福したのである
  rationale: ברך の反復を日本語でも「祝福した」と繰り返し、結びの強調を保った。
