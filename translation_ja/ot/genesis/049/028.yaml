  to: これらすべてはイスラエルの十二部族である。これは、彼らの父が彼らに語り、彼らを祝福したことである。父は一人ひとりを、それぞれの祝福に応じて祝福した。
  rationale: 意味変更を伴わず、日本語の構文だけを整えた。「祝福した」の反復、配分的な「一人ひとり」、および「それぞれの祝福に応じて」を維持し、原文と英語監査履歴の双方にある解釈上の余地を狭めていない。
