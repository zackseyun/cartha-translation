base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: ja
  text: ヤコブは息子たちに命じ終えると、両足を寝床の上に引き寄せ[a]、息を引き取り、自分の民のもとに集められた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「両足を寝床へ集めた」。ヘブライ語では「集める」という動詞が使われている。
    reason: lexical_alternative
  - marker: b
    text: 「自分の民のもとに集められた」は、死と自分の民との結びつきを表すヘブライ語の言い回し。単に埋葬されたという意味には限られない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: 終えると
  rationale: 動詞 כלה は、ヤコブが息子たちに語り、命じる行為を完了したことを示す。物語の連続性が自然に伝わる表現とした。
- source_word: לְצַוֹּת
  choice: 命じ
  rationale: צוה の基本義である「命じる」を保った。ここでは臨終に際しての厳粛な指示を含むが、「言い聞かせる」として意味を弱めない。
- source_word: בָּנָיו
  choice: 息子たち
  rationale: 原文は明示的に「彼の息子たち」と述べており、直前までの文脈にも合致する。
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: 両足を寝床の上に引き寄せ
  rationale: אָסַף の「集める」という像を踏まえつつ、日本語で動作が自然に理解できるよう「引き寄せ」とした。寝床に横たわる姿勢へ足を戻す場面を表す。
- source_word: הַמִּטָּה
  choice: 寝床
  rationale: מִטָּה は寝台や床を指す。「寝床」は古代の具体的な形状を過度に限定せず、臨終の場面にも自然である。
- source_word: וַיִּגְוַע
  choice: 息を引き取り
  rationale: גוע は死ぬ、絶命することを表す。「息を引き取る」は、その語感を自然な現代日本語で伝え、後続の「加えられた」と区別できる。
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: 自分の民に加えられた
  rationale: 「その民に集められた」というヘブライ語の慣用表現を平板な「死んだ」や「埋葬された」に置き換えず、受動形と文学的余韻を保った。
theological_decisions:
- issue: 「自分の民に加えられた」の意味
  choice: 埋葬だけを意味する表現に還元せず、原文の慣用句を保持する。
  alternative: 先祖と共に葬られた／先祖のもとへ行った
  rationale: ヤコブの埋葬は次章で行われるため、この句を埋葬の通知と同一視できない。「民」を「先祖」と明示することも避け、死と死者の共同体をめぐる原文の含みを残した。
translation_notes:
  register: 明快な現代標準語を用いながら、臨終場面にふさわしい落ち着いた格調を保った。「自分の民に加えられた」は日常語としてはやや異質だが、原文固有の慣用表現と神学的含意を保存するため意図的に残した。
