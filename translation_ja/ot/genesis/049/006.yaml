id: GEN.49.6
reference: Genesis 49:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: ja
  text: '私の魂が彼らの会議[a]に加わることがないように。

    私の誉れ[b]が彼らの集いに連なることがないように。

    彼らは怒りに任せて人を殺し、

    思いのままに雄牛[c]の脚の腱を切った。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの密かな相談」または「彼らの親しい仲間の集まり」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「私の栄光」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: マソラ本文では「雄牛」。同じ子音を別の語として読み、この句を「城壁を壊した」と解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: 彼らの会議
  rationale: סוֹדは、内密な相談、親しい者の集まり、協議の場を表し得る。並行するקָהָלとの違いを保ちつつ、秘密性を本文で断定しない訳とした。
- source_word: תָּבֹא נַפְשִׁי
  choice: 私の魂が…加わることがないように
  rationale: אַלを伴う指示・願望の形を願いとして表し、נַפְשִׁיを単に「私」とせず「私の魂」として詩的な自己言及を保持した。「入る」は日本語では所属の意味に取られにくいため、文脈上自然な「加わる」とした。
- source_word: בִּקְהָלָם
  choice: 彼らの集い
  rationale: קָהָלは招集された集団・集会を指す。「集い」は現代日本語として自然で、前半の「会議」との詩的並行を保つ。
- source_word: תֵּחַד כְּבֹדִי
  choice: 私の誉れが…連なることがないように
  rationale: יחדはここでは結びつく、加わる意と解した。כָּבוֹדは「栄光」「誉れ」の両義を持つが、暴力から自らの尊厳・名誉を切り離す文脈に合う「誉れ」を採用した。
- source_word: בְאַפָּם
  choice: 怒りに任せて
  rationale: אַףの慣用的意味である怒りを明確にし、怒りの中で行動したという状況を自然な日本語で表した。
- source_word: הָרְגוּ אִישׁ
  choice: 人を殺し
  rationale: אִישׁの単数形を一般化しすぎず、簡潔な「人を」とした。シェケムの事件への暗示を本文中の説明で限定しない。
- source_word: וּבִרְצֹנָם
  choice: 思いのままに
  rationale: רָצוֹןは意志、望み、好みを表す。この否定的文脈では、抑制されない意志に従ったことを示す「思いのままに」が自然である。
- source_word: עִקְּרוּ
  choice: 脚の腱を切った
  rationale: 動物を動けなくするために脚の腱を切る行為を指すと解した。「腱を切る」は、日本語で具体的な行為が分かる表現である。
- source_word: שׁוֹר
  choice: 雄牛
  rationale: マソラ本文の母音付けに従い、牛、特に雄牛を指す語として訳した。別の語として読む解釈は脚注に残した。
theological_decisions:
- issue: 自己を指す詩的表現כְבֹדִיの訳
  choice: 私の誉れ
  alternative: 私の栄光
  rationale: ヤコブがシメオンとレビの暴力から自らを切り離す文脈では、人格的尊厳や名誉を表す「誉れ」が明瞭である。ただし「栄光」という語義も排除せず脚注に示した。
- issue: 末尾のשׁוֹרの解釈
  choice: 雄牛
  alternative: 城壁
  rationale: マソラ本文の母音付けは「牛」を示し、עקרとの組み合わせも動物の脚の腱を切る意味によく合う。子音を別の語として捉える「城壁」の解釈は、重要な異読として脚注に記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、二つの願望文と後半二行の並行法を改行で示した。「魂」「誉れ」を保持して、原文の詩的な自己言及と緊張を平板化しないようにした。
