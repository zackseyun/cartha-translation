base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: ja
  text: アシェルからは豊かな食物が出て[a]、彼は王にふさわしい美味な食べ物を与える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「アシェルからは、彼のパンは肥えている」。ここで「パン」は食物一般を指し得る。
    reason: 「豊かな食物」とした語の字義的な含み、およびヘブライ語の簡潔な構文を示すため。
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: アシェルからは
  rationale: 前置詞 מִן の起点・出所を明示し、部族またはその土地から産物が出るという意味を自然な日本語で表した。
- source_word: שְׁמֵנָה
  choice: 豊かな
  rationale: 字義は「脂肪に富む、肥えた」だが、食物の上質さや豊富さを表す文脈に即して、現代日本語で自然な「豊かな」とした。
- source_word: לַחְמוֹ
  choice: 食物
  rationale: לֶחֶם は字義的には「パン」だが、食物・糧一般を指し得る。後半の珍味との並行を考慮して広義の「食物」とした。三人称単数接尾辞の関係は「アシェルからは」という構文の中で表現した。
- source_word: וְהוּא
  choice: 彼は
  rationale: 独立代名詞による主語の再提示を保ち、アシェルを部族の祖として人格的に表す詩的用法を維持した。
- source_word: יִתֵּן
  choice: 供する
  rationale: 基本義は「与える」だが、上等な食物を産出し提供する文脈では「供する」が簡潔で品位ある表現となる。未完了形は祝福の将来的・継続的な趣旨に合う日本語の非過去形で表した。
- source_word: מַעֲדַנֵּי
  choice: 珍味
  rationale: 喜ばしい上等な食べ物を指す語として、簡潔で現代にも通じる「珍味」を採用した。
- source_word: מֶלֶךְ
  choice: 王にふさわしい
  rationale: 字義的な属格「王の」を、品質を示す表現として自然に理解できるよう「王にふさわしい」とした。
theological_decisions: []
translation_notes:
  register: 祝福の詩にふさわしい簡潔さと品位を保ちつつ、一般の読者に明瞭な現代標準日本語とした。「出て」と「供する」により、アシェルの土地が上質な食物を産出する情景を自然に表現した。
