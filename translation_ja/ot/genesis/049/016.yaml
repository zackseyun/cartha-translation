  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: ja
  text: ダンは、イスラエルの諸部族の一つとして、自分の民を裁く[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の民のために正義を行う」。ヘブライ語の動詞は、判決を下すだけでなく、擁護することや正義を確保することも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: ダン
  rationale: ヤコブの子およびその部族の固有名として、日本語聖書で一般的な音写を用いた。後続する動詞「裁く」との語呂合わせは日本語では再現しにくい。
- source_word: יָדִין
  choice: 裁く
  rationale: דין のQal未完了形で、祝福の文脈における未来の働きを表す。「裁く」は司法的判断だけでなく、統治や正義の実現も含み得る原語の中心的意味を保つ。
- source_word: עַמּוֹ
  choice: 自分の民を
  rationale: עם に三人称男性単数接尾辞が付いた形を自然な日本語で表した。文脈上はダンに属する民、すなわちその部族民を指すと考えられるが、原文どおり広がりを残した。
- source_word: כְּאַחַד
  choice: 一つとして
  rationale: 比較のכとאחדを、ダンがイスラエルの諸部族の一員として同等の立場を持つことが伝わるように訳した。
- source_word: שִׁבְטֵי
  choice: 諸部族
  rationale: שֵׁבֶט の複数構文形。ここではイスラエルを構成する諸部族を明確に指す。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 民または民族を表す固有名として、日本語で定着した表記を用いた。
theological_decisions:
- issue: ダンが果たす役割における דין の意味
  choice: ダンはイスラエルの一部族として、自分の民を「裁く」。
  alternative: ダンは自分の民のために正義を行う／自分の民を擁護する。
  rationale: דין は裁判、統治、権利の擁護や正義の確保まで含み得る。本文では基本義の「裁く」を保ち、より広い可能性を脚注に示して、統治か擁護かを過度に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イスラエルの諸部族の一つとして」は原文の比較表現を自然に示し、ダンが一部族として役割を果たす意味を保った。
