  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: ja
  text: ダンは、道端の蛇、小道のほとりの毒蛇[a]となれ。馬のかかとにかみつき、その乗り手を後ろへ倒れさせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語はまれな語で、正確な種類は不明。「まむし」または「角のある蛇」とも訳される。ここでは危険な蛇を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: となれ
  rationale: היהの指図形が持つ願望ないし宣言の響きを保ち、ヤコブの祝福にふさわしい詩的な表現とした。
- source_word: נָחָשׁ
  choice: 蛇
  rationale: 蛇類を広く指す語であり、現代日本語で明瞭かつ自然な「蛇」とした。
- source_word: עֲלֵי דֶרֶךְ
  choice: 道端
  rationale: 道のそばに潜んで待ち伏せする情景を、簡潔で自然な日本語で表した。
- source_word: שְׁפִיפֹן
  choice: 毒蛇[a]
  rationale: 希少語で正確な種は不明だが、危険な蛇を指す文脈上の意味を明瞭に伝える。種の不確実性は脚注に残した。
- source_word: עֲלֵי אֹרַח
  choice: 小道のほとり
  rationale: דֶרֶךְとの詩的な同義並行を保ちつつ、両語を同一表現に平板化しないようにした。
- source_word: הַנֹּשֵׁךְ
  choice: かみつき
  rationale: 蛇をその動作によって描く分詞の継続的・描写的な力を自然な日本語で表した。
- source_word: עִקְּבֵי סוּס
  choice: 馬のかかと
  rationale: 馬の後脚のかかと付近を表す構文を、原文の比喩を保って直截に訳した。
- source_word: וַיִּפֹּל רֹכְבוֹ אָחוֹר
  choice: その乗り手を後ろへ落とすものとなれ
  rationale: 蛇が馬をかんだ結果、乗り手が後方へ落ちる因果的な情景を保ち、冒頭の指図形と結びつく日本語の詩句として整えた。
theological_decisions:
- issue: יְהִיの願望と予告の両義性
  choice: 「となれ」
  alternative: 「となる」または「となるであろう」
  rationale: 祝福の言葉としての願望的な響きを前面に出しつつ、部族の性格についての宣言としても読める表現にした。特定の神学的解釈には限定していない。
translation_notes:
  register: 現代の一般読者に明瞭な語彙を用いながら、ヤコブの祝福にふさわしい簡潔で格調ある詩的調子を保った。「道端／小道のほとり」「蛇／毒蛇」という並行表現を生かした。
