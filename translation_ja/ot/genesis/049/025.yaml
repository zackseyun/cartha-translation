id: GEN.49.25
reference: Genesis 49:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: ja
  text: あなたの父の神によって[a]――その方があなたを助ける――、また全能者によって――その方が、上にある天の祝福、下に横たわる深淵の祝福[b]、乳房と子宮の祝福をもってあなたを祝福する――。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの父の神から……また全能者とともに」。ヘブライ語の前置詞と「全能者」の前の小辞は構文が圧縮されており、起源、動作主、または密接な同格を表すとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 別訳「下にうずくまる深淵」。このヘブライ語の動詞は「横たわる」とも「うずくまる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: あなたの父の神によって
  rationale: 前置詞 מִן の構文は圧縮され、起源または動作主を表し得る。祝福の文脈と後続の動詞に自然につながる「によって」を本文に採用し、曖昧さは脚注に示した。אָבִיךָ はこの場面ではヨセフの父を指すため「あなたの父」とした。
- source_word: וְיַעְזְרֶךָ
  choice: その方はあなたを助ける
  rationale: 三人称男性単数の主語と二人称男性単数の目的語を明示し、ヘブライ語の並列性を保ちながら現代日本語で明瞭にした。
- source_word: וְאֵת שַׁדַּי
  choice: また全能者によって
  rationale: שַׁדַּי の前の אֵת は異例で、並列または同格を示す圧縮表現と理解できる。前句との対応を保つため「また…によって」とした。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 神名の音写ではなく、神の称号として意味を伝える標準的な訳語を用いた。
- source_word: וִיבָרְכֶךָ
  choice: その方はあなたを祝福する
  rationale: 三人称男性単数の主語を明示し、祝福の宣言としてヘブライ語未完了形の将来的な力を自然な日本語で表した。
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: 上にある天の祝福
  rationale: 天と下方の深淵との垂直的な対句を保持した。
- source_word: בִּרְכֹת תְּהוֹם רֹבֶצֶת תָּחַת
  choice: 下に横たわる深淵の祝福
  rationale: תְּהוֹם は地下の水を含む原初的な深みを表すため「深淵」とした。רֹבֶצֶת は「横たわる」と「うずくまる」の両義があり、本文では地下の水域に自然な前者を採った。
- source_word: בִּרְכֹת שָׁדַיִם וָרָחַם
  choice: 乳房と胎の祝福
  rationale: 養育と生殖の具体的な身体像を弱めず保持した。רָחַם はここでは子を宿す器官を指すが、詩的で簡潔な並列を保つため「胎」とした。
theological_decisions:
- issue: 神の称号 שַׁדַּי の訳し方
  choice: 全能者
  alternative: シャダイ
  rationale: 称号の意味を現代日本語で伝え、音写による不透明さを避けた。語源について本文以上の教理的説明は加えていない。
- issue: 神を表す二つの句の構文関係
  choice: 「あなたの父の神によって」と「また全能者によって」を並列にした
  alternative: 「あなたの父の神から…全能者とともに」、または「すなわち全能者」と同格にする
  rationale: 原文の前置詞と אֵת は構文的に圧縮され、起源・動作主・同格の可能性がある。本文では詩的並行を優先しつつ、別解を脚注に保存した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の詩的な上下の対句と反復を保ち、ダッシュで圧縮された統語関係を可視化した。「乳房と胎」は生殖と養育の身体的比喩を婉曲化せず、簡潔な聖書詩の語調で表した。
