  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: ja
  text: 集まれ、ヤコブの息子たちよ。聞け、あなたがたの父イスラエルに耳を傾けよ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: 集まって
  rationale: קבץのニファル命令形複数。自ら一つ所に集うよう促す意味を、現代日本語で自然かつ簡潔に表す。
- source_word: שִׁמְעוּ
  choice: 聞け
  rationale: 単なる聴覚ではなく、注意して耳を傾けるよう求める命令。二度の反復を保ち、強調と詩的並行を示す。
- source_word: בְּנֵי יַעֲקֹב
  choice: ヤコブの息子たち
  rationale: בניםはここで、祝福を受けるために集められたヤコブの男子を明示している。
- source_word: שִׁמְעוּ אֶל
  choice: 聞け、…に
  rationale: אֶלを伴う構文の方向性を保ち、話し手に耳を傾けよとの呼びかけを表す。日本語としてやや格調ある詩的表現を採る。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 固有名を慣用的に音写する。前半の「ヤコブ」と異なる名をそのまま残す。
- source_word: אֲבִיכֶם
  choice: 父
  rationale: 二人称男性複数接尾辞「あなたがたの」は、呼びかけられた息子たちとの関係から日本語では「父」で明瞭であり、「父イスラエル」という同格関係を保つ。
theological_decisions:
- issue: ヤコブ／イスラエルという二つの名の並行
  choice: 「ヤコブの息子たち」と「父イスラエル」の両方を保持する
  alternative: 一方の名に統一して滑らかにする
  rationale: 原文は同一人物の二つの名を意図的に並べているため、その詩的・契約的な響きを平板化せず保存する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、父祖の詩的託宣にふさわしい簡潔で威厳ある命令表現「聞け」を用いた。原文の命令の反復を省略しない。
