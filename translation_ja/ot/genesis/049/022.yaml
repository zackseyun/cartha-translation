  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: ja
  text: 'ヨセフは実り豊かな息子[a]、


    泉のほとりの実り豊かな息子。


    娘たち[b]は壁を越えて進む。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨセフは実を結ぶ枝、泉のほとりの実を結ぶ枝」。ヘブライ語は詩的で意味が圧縮されており、伝統的な「枝」という訳は周囲の比喩をより明示したもの。
    reason: lexical_alternative
  - marker: b
    text: 「娘たち」は、壁を越えて伸びる枝や若枝を比喩的に指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: 実り豊かな子
  rationale: בֵּןの通常の意味「子」と、פרהに由来するפֹּרָתの「実り豊かな」という意味をともに保ち、圧縮された詩的表現を訳文でも残した。
- source_word: עֲלֵי עָיִן
  choice: 泉のほとり
  rationale: עַיִןには「目」と「泉」の両義があるが、実りを語る文脈では水源としての「泉」が自然であり、עֲלֵיは位置を表す「ほとり」とした。
- source_word: בָּנוֹת
  choice: 娘たち
  rationale: 語の直接的な意味を保った。枝や若枝を指す比喩と解することもできるが、本文ではその解釈に限定せず、原文の詩的な曖昧さを残した。
- source_word: צָעֲדָה
  choice: 進む
  rationale: 「歩み進む、踏み出す」を表す動詞。日本語では、壁を越えて伸びていく可能性も含ませられる簡潔な表現とした。
- source_word: עֲלֵי שׁוּר
  choice: 壁を越えて
  rationale: שׁוּרを「壁」と取り、עֲלֵיは境界を越える動きを自然に表すよう「越えて」と訳した。
