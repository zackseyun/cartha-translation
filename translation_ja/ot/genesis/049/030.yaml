  to: カナンの地、マムレの向かい[a]にあるマクペラの畑の洞穴に。その畑は、アブラハムがヒッタイト人エフロンから埋葬用の所有地として[b]買い取ったものである。
  rationale: 購入対象が「その畑」である点は維持しつつ、最後の句を「埋葬用の所有地として」と改めた。これにより、埋葬用途と法的な所有地という両方の含意を、目的表現へ過度に限定せずに示す。脚注bも本文と原語に整合するよう更新した。
