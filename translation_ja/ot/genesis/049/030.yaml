base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: ja
  text: カナンの地、マムレの向かい[a]にあるマクペラの畑の洞穴に。その畑は、アブラハムがヒッタイト人エフロンから埋葬用の所有地として[b]買い取ったものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「マムレの正面」。ヘブライ語はマムレとの位置関係を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「埋葬のための所有地として」。埋葬用として正式に保有される土地であることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: 洞穴に
  rationale: 前置詞בְּと定冠詞付き名詞מְעָרָהの場所を表す意味を保った。「洞穴」は自然で明瞭な現代日本語である。
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: マクペラの畑の洞穴
  rationale: 洞穴がマクペラの畑にあるという位置関係を、簡潔で自然な連体修飾によって示した。מַכְפֵּלָהは地名として音写した。
- source_word: עַל פְּנֵי מַמְרֵא
  choice: マムレの向かい
  rationale: この空間表現が示す「正面に」「向かいに」という位置関係を保った。「近く」として距離だけに限定しない。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地
  rationale: 標準的な地理表現として訳した。
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: その畑は、アブラハムが…買い取ったものである
  rationale: אֶת הַשָּׂדֶהを動詞קָנָהの直接目的語「その畑」として明確に反映した。ヘブライ語の長い関係節は、日本語で指示語を用いた独立文に組み替え、対象を取り違えないようにした。
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: ヒッタイト人エフロンから
  rationale: מֵאֵתが売買における取得元を示すため「から」とし、חִתִּיは民族名として訳した。
- source_word: לַאֲחֻזַּת קָבֶר
  choice: 墓地として所有するため
  rationale: אֲחֻזָּהの法的・継続的な所有地という含意と、קֶבֶרの埋葬用途を、読みやすい日本語でともに示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、族長物語にふさわしい落ち着いた文体とした。前節から続く場所句であるため、冒頭は原文どおり述語を補わず断片として残した。後半はヘブライ語の関係節と再述された直接目的語を日本語で明確にするため独立文に分けた。
