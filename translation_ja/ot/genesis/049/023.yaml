  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: ja
  text: 射手たちは、彼をひどく苦しめ、彼に矢を射かけ[a]、彼を憎んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼と争い」または「彼を攻め立て」。この箇所のヘブライ語の動詞は解釈が難しく、より一般的に「彼を襲い」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: 彼をひどく苦しめ
  rationale: מררのピエル形は「苦くする、苦しめる、ひどく扱う」という強意・使役的な意味を持つ。敵対行為が並ぶ文脈に合わせ、感情だけでなく加害を表す自然な日本語とした。
- source_word: וָרֹבּוּ
  choice: 彼に矢を射かけ
  rationale: 語形と意味の解釈には難しさがあり、「争う」「攻め立てる」とも理解されるが、直後の「矢を持つ者たち」という表現との詩的並行を踏まえ、伝統的な「射る」の解釈を本文に採った。
- source_word: וַיִּשְׂטְמֻהוּ
  choice: 彼を憎んだ
  rationale: שטםは憎悪や敵意を表す。簡潔で明瞭な「憎んだ」と訳した。
- source_word: בַּעֲלֵי חִצִּים
  choice: 弓を射る者たち
  rationale: 字義的には「矢の所有者たち」だが、矢を用いる者、すなわち射手を指す慣用表現である。一般読者に分かりやすく、荘重さも保つ表現とした。
