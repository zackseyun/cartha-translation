source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ja
  text: あなたの父の祝福は、私の先祖の祝福をしのぎ、いにしえの丘々[a]の最果てにまで及ぶ。それらがヨセフの頭に、兄弟たちから選び分けられた者[b]の頭の頂に臨むように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「永遠の丘々」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たちの中の君」とも訳し得る。ヘブライ語は「兄弟たちから聖別された（分けられた）者」。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: あなたの父の祝福
  rationale: 複数形が表す重なり豊かな祝福を日本語では集合的な「祝福」で自然に表し、二人称接尾辞を「あなたの」と明示した。
- source_word: גָּבְרוּ עַל
  choice: しのぎ
  rationale: גבר と עַל の比較的用法を、強さと優越の含みを保つ自然な日本語で表した。
- source_word: בִּרְכֹת הוֹרַי
  choice: 私の両親の祝福
  rationale: הוֹרַי を「私を生んだ者たち」の意に取り、現代日本語で明瞭な「私の両親」とした。別の本文理解は脚注に示した。
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: いにしえの丘々の最果てにまで及ぶ
  rationale: 難解な詩句を祝福の到達範囲として読み、עולם はここでは「永遠」より「太古からの、いにしえの」とした。תַּאֲוַת の字義的な「願い、望ましいもの」ではなく、文脈上の限界・果てという理解を採用した。
- source_word: תִּהְיֶיןָ לְרֹאשׁ
  choice: 頭に臨むように
  rationale: 祝福の宣言における願望的な未完了形を「ように」で表し、祝福が頭上に置かれる像を「臨む」で自然に示した。
- source_word: קָדְקֹד
  choice: 頭の頂
  rationale: 「頭」との詩的並行を保ちながら、頭頂部を指す語義を明瞭に表した。
- source_word: נְזִיר אֶחָיו
  choice: 兄弟たちから選び分けられた者
  rationale: נְזִיר の分離・聖別という基本的含意を保ち、後代の制度的な「ナジル人」を持ち込まない表現とした。「君」という身分的理解は脚注に残した。
theological_decisions:
- issue: ヨセフへの呼称 נְזִיר אֶחָיו の解釈
  choice: 兄弟たちから選び分けられた者
  alternative: 兄弟たちの中の君／兄弟たちの中で聖別された者
  rationale: ヨセフが兄弟たちと区別された存在であることを示しつつ、政治的な称号や後代のナジル人制度に意味を限定しない。語が持つ分離と卓越の緊張を保持した。
- issue: בִּרְכֹת הוֹרַי をめぐる本文理解
  choice: 私の両親の祝福
  alternative: いにしえの山々の祝福
  rationale: マソラ本文の母音と形態に従えば「私の両親」が素直である。一方、古い山々を指す読みも本文批評上知られているため、脚注で明示して曖昧さを隠さない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、族長の詩的祝福にふさわしい格調を保った。「しのぐ」「最果て」「頭の頂」で並行法と広がりを示し、難解な本文とヨセフの呼称の別解は脚注に委ねた。
