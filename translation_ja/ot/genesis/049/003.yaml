source:
  edition: WLC
  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: ja
  text: ルベンよ。あなたは私の長子、私の力、私の活力の初め[a]。威厳において卓越し、力において卓越した者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の力の初め」とも訳せる。この表現は、父の生命力、特に生殖力が最初に現れた者であることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「威厳において第一であり、力において第一である者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: 私の長子
  rationale: 出生順だけでなく、家族内の身分や相続に関わる含みを保つため、「いちばん上の息子」ではなく「長子」とした。
- source_word: כֹּחִי
  choice: 私の力
  rationale: כח の基本的な意味を簡潔に保ち、後半の「力」と響き合う詩的表現にした。
- source_word: רֵאשִׁית אוֹנִי
  choice: 私の活力の初め
  rationale: ראשית の「初め」と、און の生命力・精力を表す幅を保った。父の生殖力が最初に現れた者という含意は脚注で補った。
- source_word: יֶתֶר שְׂאֵת
  choice: 威厳にまさり
  rationale: יתר の優越・卓越と、שׂאת の高位・威厳・誉れという意味領域を、簡潔な詩的表現で示した。
- source_word: יֶתֶר עָז
  choice: 力にまさる
  rationale: יתר の比較・卓越の力を前句と同じ構文で保ち、עז を自然な現代日本語の「力」とした。
- source_word: אַתָּה
  choice: あなたは
  rationale: 明示された独立代名詞による呼びかけの強調を日本語でも保持した。
theological_decisions:
- issue: רֵאשִׁית אוֹנִי における父の生殖力の含意
  choice: 本文では「私の活力の初め」とし、含意を脚注で説明する
  alternative: 私の精力の初め／私の力の初穂
  rationale: 生殖的な意味を消さず、同時に本文を過度に露骨または農業的な比喩にしないため。
- issue: יֶתֶר שְׂאֵת וְיֶתֶר עָז の統語的な含み
  choice: 「威厳にまさり、力にまさる者」
  alternative: 威厳と力において卓越した者／威厳に満ち、力に満ちる者
  rationale: יתר が持つ「余り・豊かさ」と「優越・卓越」の両義性のうち、文脈に適する優越の意味を本文に採り、別解を脚注に残した。
translation_notes:
  register: 族長が息子に告げる詩的な託宣として、簡潔で格調のある現代標準語を用いた。「長子」「威厳」は意味の重みを保ちつつ、一般読者にも理解できる語として選んだ。
