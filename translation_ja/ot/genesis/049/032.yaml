  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: ja
  text: その畑と、その中にある洞窟は、ヘトの子ら[a]から買い取ったものである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヒッタイト人」。ヘブライ語では「ヘトの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その畑と、その中にある洞窟の取得は、ヘトの子らからであった」。原文は簡潔な名詞文。
    reason: source_ambiguity
lexical_decisions:
- source_word: מִקְנֵה
  choice: 買い取ったものである
  rationale: 購入によって取得された物件を指す名詞を、日本語では自然な叙述にして表した。名詞文の簡潔な総括という性格も保っている。
- source_word: הַשָּׂדֶה
  choice: その畑
  rationale: 土地所有の文脈における標準的な訳語。「その」により既出の畑を指すことを示す。
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: その中にある洞窟
  rationale: בּוֹ の男性単数形が直前の「畑」を受け、洞窟が畑の中にあることを明確に表す。
- source_word: מֵאֵת
  choice: から
  rationale: 取得元を示す前置詞として自然な日本語にした。
- source_word: בְּנֵי חֵת
  choice: ヘトの子ら
  rationale: ヘブライ語の氏族的表現を透明に保つ。「ヒッタイト人」は文脈上可能な代替訳として脚注に示す。
