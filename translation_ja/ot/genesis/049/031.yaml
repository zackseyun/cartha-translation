  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: ja
  text: そこに、アブラハムとその妻サラを葬り、そこに、イサクとその妻リベカを葬った。そしてそこに、私はレアを葬った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: そこには／そこに
  rationale: 直前に述べられた畑の洞穴を指す場所の副詞。節の構造に応じて「そこには」と「そこに」を使い分け、三度の反復を保った。
- source_word: קָבְרוּ
  choice: 葬られ
  rationale: 三人称複数の能動形だが、主語が明示されていない。日本語では不特定の「人々は」を補うより、自然な受身で墓所に葬られた事実を表す。
- source_word: אִשְׁתּוֹ
  choice: その妻
  rationale: 三人称男性単数接尾辞を、アブラハムとイサクをそれぞれ受ける自然な日本語として訳した。
- source_word: קָבַרְתִּי
  choice: 私は……葬った
  rationale: 一人称単数の完了形を明示し、前二節の不特定複数主語との対照を保った。
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: 葬られ……葬られた……葬った
  rationale: 同じ語根 קבר の反復を「葬る」で一貫して表しつつ、日本語として自然な態と時制に整えた。
- source_word: לֵאָה
  choice: レア
  rationale: 現代日本語の聖書で通用する標準的な固有名表記を用いた。
