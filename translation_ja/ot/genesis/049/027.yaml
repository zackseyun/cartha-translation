  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: ja
  text: ベニヤミンは獲物を引き裂く狼。[a] 朝には獲物[b]を食らい、夕べには戦利品[c]を分ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「ベニヤミンは狼、彼は引き裂く」。狼の捕食する激しさを表す。
    reason: 原文の簡潔な詩的構文と動詞のニュアンスを示すため。
  - marker: b
    text: 「略奪物」または「分捕り物」とも訳せる。
    reason: ヘブライ語 עַד には、獲物だけでなく略奪して得た物を指す可能性もあるため。
  - marker: c
    text: 「略奪物」または「分捕り物」とも訳せる。
    reason: ヘブライ語 שָׁלָל の語義の幅を示すため。
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: ベニヤミン
  rationale: 固有名詞として、日本語聖書で広く定着している音写を用いた。
- source_word: זְאֵב יִטְרָף
  choice: 獲物を引き裂く狼
  rationale: זְאֵבは「狼」、טרףは獲物を引き裂く行為を表す。簡潔な詩的表現を保ちつつ、捕食者としての激しい姿を明確にした。
- source_word: בַּבֹּקֶר
  choice: 朝には
  rationale: 夕べとの時間的な並行関係を自然な日本語で示した。助詞「には」によって対句の調子も保った。
- source_word: יֹאכַל
  choice: 食らい
  rationale: 基本義は「食べる」だが、狼の比喩に即して力強い「食らう」を選んだ。過度に説明的な「むさぼり食う」は避けた。
- source_word: עַד
  choice: 獲物
  rationale: この稀な語は「獲物」のほか「略奪物」とも理解できる。直前の狼の比喩と「食らう」という動詞に最も自然につながる「獲物」を本文に採用した。
- source_word: וְלָעֶרֶב
  choice: 夕べには
  rationale: 「朝には」との詩的な並行を保ち、現代語としても格調を損なわない表現とした。
- source_word: יְחַלֵּק שָׁלָל
  choice: 戦利品を分ける
  rationale: חלקのピエル形は分配すること、שָׁלָלは戦いで得た略奪物・戦利品を指す。「戦利品を分ける」は軍事的な像を明瞭かつ自然に伝える。
theological_decisions:
- issue: ベニヤミンについての比喩の意味
  choice: 捕食する狼と、得た戦利品を分ける勝者の姿を、そのまま詩的比喩として訳す。
  alternative: ベニヤミン族の後代の好戦性や特定の歴史上の出来事への言及として明示的に訳す。
  rationale: ヘブライ語本文は具体的な歴史的成就を名指しせず、比喩によって力強さと勝利を描く。訳文では後代の解釈を本文に持ち込まず、その開かれた意味を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「食らう」「夕べ」「戦利品」によって短い詩句の力強さと格調を保った。「朝には／夕べには」の対句を明確にし、過度な歴史的・教派的説明は本文に加えていない。
