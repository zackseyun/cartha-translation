  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: ja
  text: '彼らの怒りも、彼らの憤りも、呪われよ。

    怒りは激しく、憤りは苛烈だから。


    わたしは彼らをヤコブの中に分け、

    イスラエルの中に散らす。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: 呪われよ
  rationale: 受動分詞による呪いの宣告として、その遂行的な力を自然な日本語で表した。状態を述べる「呪われている」も文法上可能なので脚注に示した。
- source_word: אַפָּם
  choice: 彼らの怒り
  rationale: 字義的には「鼻」と関係する語だが、ここでは慣用的に怒りを指すため、その意味を訳した。
- source_word: עָז
  choice: 激しい
  rationale: 基本義の「強い」を怒りについて自然に表し、その破壊的な強烈さを伝える。
- source_word: עֶבְרָתָם
  choice: 彼らの憤り
  rationale: あふれるような激怒を表す語。「怒り」との詩的な並行を保ちつつ、語を区別した。
- source_word: קָשָׁתָה
  choice: 苛烈
  rationale: 「硬い、厳しい」という意味領域を、憤りの激しく容赦ない性質として簡潔に表した。「残酷」と断定して原語以上に道徳的評価を強めることは避けた。
- source_word: אֲחַלְּקֵם
  choice: 彼らを…分け
  rationale: ピエル形の「分ける」を直接に訳し、後続する「散らす」との動詞の違いを保持した。
- source_word: בְּיַעֲקֹב
  choice: ヤコブの中に
  rationale: ヤコブの子孫である民の中を意味するが、イスラエルとの詩的並行を保つため固有名をそのまま残した。
- source_word: וַאֲפִיצֵם
  choice: …散らす
  rationale: 使役的な散在を表す語を、自然で明瞭な日本語にした。
- source_word: בְּיִשְׂרָאֵל
  choice: イスラエルの中に
  rationale: 「ヤコブの中に」との並行を保ち、二つの名を一つにまとめなかった。
theological_decisions:
- issue: 呪いの対象
  choice: 呪いはシメオンとレビ本人ではなく、彼らの怒りと憤りに向けられている。
  alternative: 兄弟本人たちが呪われていると読む。
  rationale: ヘブライ語は明示的に「彼らの怒り」を呪われたものとしており、人そのものへの呪いに強めず、その区別を本文に保持した。
- issue: 一人称による将来の宣告
  choice: 「わたしは…分け、…散らす」と訳す。
  alternative: 非人称的に「彼らは…分けられ、…散らされる」と訳す。
  rationale: 原文の一人称単数を保持し、語り手による宣告の緊張を解消しないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、詩的な宣告にふさわしい荘重さを保った。行分けによってヘブライ語の並行法を示し、「ヤコブ」と「イスラエル」をともに残した。
