source:
  edition: WLC
  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: ja
  text: それからヤコブは彼らに命じて言った。「私は今、自分の民のもとに集められようとしている[a]。私を、私の先祖たちと共に、ヘト人エフロンの畑にある洞窟に葬りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は今、自分の民のもとに集められている」。ヘブライ語のこの慣用表現は、死が迫っていること、また死において自分の民に加わることを表す。
    reason: 相の訳し分けと、慣用句が死を指すことを示すため。
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じて
  rationale: צוהの持つ指示・命令の強さを保ち、死を前にしたヤコブの厳粛な申し渡しとして自然に表した。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 彼らに言った
  rationale: 一般的な発話表現を簡潔に訳し、原文の物語上の流れを保った。
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: 私は今、私の民のもとに集められようとしている
  rationale: 死が迫っていることを表す受動形の慣用句を、単に「死ぬ」と言い換えず、原文の比喩と祖先との結びつきを残した。「今」と「ようとしている」により文脈上の切迫性を示した。
- source_word: עַמִּי
  choice: 私の民
  rationale: 「身内」や「先祖」と限定せず、原語の「私の民」を保つことで、家族的・神学的な余韻を残した。
- source_word: קִבְרוּ אֹתִי
  choice: 私を…葬りなさい
  rationale: 複数相手への直接命令を、現代日本語で自然かつ厳粛に表した。
- source_word: אֶל־אֲבֹתָי
  choice: 私の先祖たちと共に
  rationale: 前置詞の方向性を逐語的に「先祖たちのもとへ」とせず、同じ墓所に葬るという文脈を自然に表した。「父祖」より一般読者に明瞭な「先祖たち」を選んだ。
- source_word: הַמְּעָרָה
  choice: 洞窟
  rationale: 語義をそのまま保ち、文脈から明らかな「墓」の意味を本文に付加しなかった。
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: エフロンの畑にある
  rationale: 関係節の内容を自然な日本語の連体修飾にし、所有関係と場所を明確にした。
- source_word: הַחִתִּי
  choice: ヘト人
  rationale: 聖書日本語で広く定着した民族名を用いて、エフロンの所属を示した。
theological_decisions:
- issue: 「私の民のもとに集められる」の意味
  choice: 死が迫っていることを示す慣用句を比喩のまま保持する
  alternative: 「私はもうすぐ死ぬ」と明示する
  rationale: この表現は生物学的な死だけでなく、死において自分の民・祖先に連なるという含みを持つ。死後の状態について本文以上の教理を確定せず、その含意と緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、族長の臨終の命令にふさわしい厳粛さを保った。「民のもとに集められる」という非日常的な表現は、原文固有の比喩と神学的余韻を保つため維持した。
