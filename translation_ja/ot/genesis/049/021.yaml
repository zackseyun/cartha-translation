  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: ja
  text: 'ナフタリは、解き放たれた雌鹿で、

    美しい言葉を与える。[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「放たれた雌鹿」。自由に走れるよう解き放たれた雌鹿の姿が描かれている。
    reason: lexical_alternative
  - marker: b
    text: 後半は「美しい言葉を語る」とも訳せる。また、後半の語句を異なる意味に取るなら、「美しい子鹿を産む」と理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: ナフタリ
  rationale: 人名・部族名として、日本語聖書で定着している音写を用いた。
- source_word: אַיָּלָה
  choice: 雌鹿
  rationale: 雌の鹿を指す語であり、比喩の女性形を明確かつ自然な現代日本語で保った。
- source_word: שְׁלֻחָה
  choice: 解き放たれた
  rationale: שלחの受動形。ここでは鹿が自由に走れるよう放たれた姿を表すと理解し、詩的で自然な表現とした。
- source_word: הַנֹּתֵן
  choice: 語る
  rationale: 字義は「与える」だが、「言葉を与える」は現代日本語では不自然になりやすいため、「言葉」との結びつきを自然に表した。分詞の継続的・描写的な働きも保っている。
- source_word: אִמְרֵי שָׁפֶר
  choice: 美しい言葉
  rationale: אִמְרֵיは「言葉、言い表されたこと」、שָׁפֶרは美しさや麗しさを表す。簡潔で明瞭な訳とした。
theological_decisions:
- issue: 後半の分詞句の主語と意味
  choice: 「美しい言葉を語る」をナフタリについての描写として、主語を繰り返さずに訳した。
  alternative: 雌鹿の比喩を直接受けると見る解釈や、末尾を「美しい子鹿を産む」と理解する解釈がある。
  rationale: ヘブライ語は簡潔で、定冠詞付き男性単数分詞はナフタリを受けると自然に理解できる一方、詩的構文には曖昧さが残る。本文ではマソラ本文の母音記号に沿い、別解は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。ヘブライ語詩の短く並置された構造を二行で表し、本文で解釈を過度に固定せず、主要な別解を脚注に残した。
