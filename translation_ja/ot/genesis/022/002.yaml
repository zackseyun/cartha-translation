id: GEN.22.2
reference: Genesis 22:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: ja
  text: 神は言われた。「どうか、あなたの息子、あなたにとってただ一人の者[a]、あなたが愛しているイサクを連れて、モリヤの地へ行きなさい。そして、わたしがあなたに告げる山の一つで、彼を全焼のささげ物として献げなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたのひとり息子」とも訳せる。ヘブライ語は「ただ一人の者」「唯一無二の者」を意味し得て、ここではイサクの特別な位置を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: どうか
  rationale: 命令に添えられた懇願・丁重さを表す小辞。時間を表す「今」とせず、現代日本語で自然な「どうか」とした。
- source_word: בִּנְךָ
  choice: あなたの息子
  rationale: בֵּןに二人称男性単数接尾辞が付いた形を、直接かつ自然に訳した。
- source_word: יְחִידְךָ
  choice: あなたのただ一人の者
  rationale: 「ただ一人の者」「かけがえのない者」という唯一性・特別性を表し得る語。イシュマエルの存在との緊張を消さず、イサクの特別な位置を示すため、この表現を本文に置いた。
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: あなたが愛している
  rationale: 完了形はここでは継続する状態としての愛を表すため、自然な現在表現とした。
- source_word: וְלֶךְ לְךָ
  choice: 行きなさい
  rationale: לְךָが本人の関与や強調を添える可能性はあるが、日本語で不自然な過剰訳を避け、命令として明瞭に表した。
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: モリヤの地
  rationale: אֶרֶץの基本義を保ち、固有名詞とともに伝統的で明瞭な表現とした。
- source_word: וְהַעֲלֵהוּ
  choice: 彼を……献げなさい
  rationale: עֹלָהを伴う祭儀的文脈では、עלהのヒフィル形は「献げる」を意味する。上昇という字義より、文脈上の行為を自然に示した。
- source_word: לְעֹלָה
  choice: 全焼のささげ物として
  rationale: עֹלָהは祭壇上ですべてを焼く献げ物を指す専門語。「焼き尽くす献げ物」より簡潔で、内容も明示できる「全焼のささげ物」とした。
- source_word: עַל אַחַד הֶהָרִים
  choice: 山の一つで
  rationale: 複数の山のうち、まだ特定されていない一つを指す構文を自然な日本語で表した。前置詞עַלは祭儀を行う場所として「で」と訳した。
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: わたしがあなたに告げる
  rationale: אמרの基本的な発話の意味を保ち、「示す」という別の動詞の意味を持ち込まず、文脈に自然な未来的表現とした。
theological_decisions:
- issue: イシュマエルが存在する中でのיְחִידְךָの訳し方
  choice: あなたのただ一人の者
  alternative: あなたのひとり息子／あなたのかけがえのない息子
  rationale: この語は生物学的な独り子という意味だけでなく、唯一無二で特別な者という意味を持ち得る。契約上・関係上・情愛上のどの側面かを一つに限定せず、イサクの特異な位置と本文の緊張を保った。伝統的で可能な訳は脚注に示した。
- issue: 命令の話者の明示
  choice: 神は言われた
  alternative: 彼は言った
  rationale: ヘブライ語本文は文脈を受ける三人称男性単数だが、この節だけでも話者が分かるよう「神」と補った。これは直前の22:1で明示される指示対象であり、話者の同定に新たな解釈を加えるものではない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の命令場面にふさわしい荘重さを保った。「連れて」「献げなさい」により動作を自然に示し、祭儀用語は意味の伝わる「全焼のささげ物」とした。脚注記号[a]は該当語の直後に置いた。
