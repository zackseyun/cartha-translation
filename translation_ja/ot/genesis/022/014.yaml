source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: ja
  text: アブラハムはその場所を「主が備えてくださる」と名づけた。それで今日でも、「主の山で備えられる」と言われている。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主が備えてくださる」「備えられる」に当たるヘブライ語は、字義的にはそれぞれ「主は見る」「見られる（または現れる）」とも訳せる。同じ語根を用いた言葉遊びである。後半は「主の山で、主は現れる」とも解釈できる。
    reason: 原文の語根ראהの反復、能動形とニファル形の違い、および「備える」「見る／現れる」の解釈上の幅を保存するため。
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を、現代日本語聖書で広く理解される伝統的な表記「主」で示した。
- source_word: יִרְאֶה
  choice: 備えてくださる
  rationale: 字義は「見る」であるが、この物語の文脈では、神が必要をご覧になり用意するという含意を持つため、場所の名称として自然な日本語にした。敬意を表す補助動詞も加えた。
- source_word: יֵרָאֶה
  choice: 備えがある
  rationale: ニファル形の字義は「見られる／現れる」であり、「備えられる」という伝統的理解も可能である。日本語では山で神の備えが示される趣旨を簡潔に表現した。
- source_word: קָרָא ... שֵׁם
  choice: 名づけた
  rationale: ヘブライ語の「名を呼んだ」という命名表現を、自然な現代日本語にした。
- source_word: עַד־הַיּוֹם
  choice: 今日でも
  rationale: 語り手の時代までその言い回しが続いていることを自然に表した。
theological_decisions:
- issue: ראה の語遊びと「供給」の意味
  choice: 本文では「備える」を採用し、脚注で字義と別解を示す
  alternative: 「主は見る／主の山で現れる」と字義的に訳す
  rationale: 直前で神が犠牲を備えた文脈と英語監査層の判断を踏まえつつ、同じ語根の能動形・受動形にある意図的な語遊びと曖昧さを脚注で保存した。
- issue: 後半の受動形 יֵרָאֶה
  choice: 「備えがある」
  alternative: 「備えられる」または「現れる」
  rationale: 誰によって備えられるかを明示せず、神の備えがその山で示されるという含みを保つため、非人称的な表現にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その場所の名を呼んだ」という直訳調は避けて「名づけた」とした。神名は「主」とし、神の行為には自然な敬語を用いた。
