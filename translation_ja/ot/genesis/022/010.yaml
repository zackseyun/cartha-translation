base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: ja
  text: そこでアブラハムは手を伸ばし、刃物を取って、自分の息子を屠るために。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「屠る」は、単に「殺す」より具体的な語で、犠牲に関連して動物を屠ることにも用いられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 手を伸ばし
  rationale: この文脈では「遣わす」ではなく、手を差し伸べる具体的な動作を表す。現代日本語として自然で、原文の動作も保つ。
- source_word: יָדוֹ
  choice: 手
  rationale: 三人称男性単数の接尾辞を伴う「彼の手」。日本語では主語が明示されているため「自分の手」と重ねず、「手」とするのが自然。
- source_word: וַיִּקַּח
  choice: 取って
  rationale: 基本義に即した簡明な訳。「つかんで」ほど動作の仕方を限定しない。
- source_word: הַמַּאֲכֶלֶת
  choice: 刃物
  rationale: 屠殺に用いる切断具を指す語。通常の「ナイフ」より場面の重みを保ちつつ、「屠殺用の刀」と過度に限定しない。
- source_word: לִשְׁחֹט
  choice: 屠ろうとした
  rationale: 一般的な「殺す」より具体的で、犠牲を屠る含意を保つ。不定詞の目的用法と直前の動作を、日本語では意図を示す「～ようとした」で自然に表した。
- source_word: בְּנוֹ
  choice: 自分の息子
  rationale: 「彼の息子」の意味。日本語では主語アブラハムとの帰属関係を明確かつ自然に示すため「自分の息子」とした。
- source_word: וַ
  choice: そこで
  rationale: 物語を進める連続形を、直前の出来事を受けた行動として自然に表す。
theological_decisions:
- issue: שָׁחַטの犠牲祭儀的な響きを訳語に残すか
  choice: 屠る
  alternative: 殺す
  rationale: この動詞は単なる殺害よりも屠殺を具体的に表し、犠牲を屠る文脈でも用いられる。「屠る」は祭儀的・物語的な緊張を保つ一方、後代の教理的結論までは読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、場面の厳粛さにふさわしい格調を保った。「屠る」はやや文語的だが現代でも理解可能であり、原語の具体性と祭儀的含意を伝えるため採用した。
