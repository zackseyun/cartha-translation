  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: ja
  text: 長男のウツ、その兄弟ブズ、そしてアラムの父[a]ケムエル。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「アラムの祖先」。系譜では「父」が、直接の父ではなく、祖先や始祖を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וּץ
  choice: ウツ
  rationale: 固有名詞として、日本語で一般的な聖書名の表記を用いた。
- source_word: בְּכֹר֖וֹ
  choice: 長男
  rationale: 出生順で最初の息子を指す語であり、現代日本語の系譜では「長男」が自然で明確である。
- source_word: בּ֣וּז
  choice: ブズ
  rationale: 固有名詞として音写した。
- source_word: אָחִ֑יו
  choice: その兄弟
  rationale: 原語は兄か弟かを明示しないため、「弟」と限定せず、曖昧さを保った。
- source_word: קְמוּאֵ֖ל
  choice: ケムエル
  rationale: 固有名詞として、日本語で一般的な聖書名の表記を用いた。
- source_word: אֲבִ֥י
  choice: 父
  rationale: 原語の最も直接的な意味を本文に採用した。系譜では祖先や始祖を指す可能性があるため、その幅は脚注に示した。
- source_word: אֲרָֽם
  choice: アラム
  rationale: 本文が名だけを示しているため、民族名や地域名と断定せず固有名詞として音写した。
theological_decisions:
- issue: אֲבִי אֲרָם の系譜上の意味
  choice: アラムの父
  alternative: アラムの祖先、または始祖
  rationale: ヘブライ語の直接的な表現を本文に保ちつつ、系譜における「父」が直系の父以外を指し得ることを脚注で示し、特定の民族的・地理的解釈を本文に持ち込まないようにした。
translation_notes:
  register: 簡潔な系譜の列挙として、現代標準日本語の自然さと格調を両立させた。「兄弟」は原語が兄・弟を区別しないことを保つために用いた。脚注記号は意味上対応する「ケムエル」の直後に置いた。
