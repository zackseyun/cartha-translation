  yaml_path: translation/ot/genesis/022/004.yaml
  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: ja
  text: 三日目に、アブラハムは目を上げ、遠くからその場所を見た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「遠くにその場所を見た」。
    reason: מֵרָחֹק は「遠くから」という見る者の位置を表すほか、見えた場所が遠方にあったことを表すとも訳せる。
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目に
  rationale: 定冠詞を伴う序数による時の表現。文脈上は旅の三日目だが、ヘブライ語に明示のない「旅の」を補わず、自然な日本語とした。
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: 目を上げ
  rationale: 直訳的には「彼の目を上げた」というヘブライ語の慣用表現。日本語でも自然な「目を上げる」とし、物語の動作を保った。
- source_word: וַיַּרְא
  choice: 見た
  rationale: ראה のワウ継続法で、先行する動作に続く単純な物語叙述として訳した。
- source_word: הַמָּקוֹם
  choice: その場所
  rationale: 定冠詞付きの普通名詞「場所」。日本語では、すでに指し示されている目的地を表す定性を自然に示すため「その場所」とした。
- source_word: מֵרָחֹק
  choice: 遠くに
  rationale: 距離を表す副詞句。視認した対象の位置を自然な現代日本語で表した。「遠くから」とも取れるため脚注に示した。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で広く定着した固有名の表記を用いた。
