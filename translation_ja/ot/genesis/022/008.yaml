  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: ja
  text: アブラハムは言った。「わが子よ、神がご自分のために、焼き尽くすいけにえの羊を備えてくださる[a]。」こうして二人は一緒に進んで行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「神がご自分のために、焼き尽くすいけにえの羊を見る」。ヘブライ語の動詞には「見る」という意味があり、ここでは慣用的に「取り計らう、備える」という意味に理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ワウ継続法による物語の進行を、前後の流れに自然につながる簡潔な過去形で表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: アブラハムが語る唯一の神を指すため、現代日本語で自然な「神」とした。
- source_word: יִרְאֶה לּוֹ
  choice: ご自分のために…備えてくださる
  rationale: ראה の字義は「見る」だが、ここでは「取り計らう、備える」という慣用的意味が文脈に適する。לּוֹ は「ご自分のために」で明示し、神ご自身が必要を満たすというニュアンスを保った。字義的な可能性は脚注に残した。
- source_word: הַשֶּׂה
  choice: 羊
  rationale: שֶׂה は羊または山羊を含み得る小家畜を指す。日本語の「小羊」では若い羊に限定しやすいため、原語の幅を保つ「羊」とした。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえ
  rationale: עֹלָה は祭壇上で全体を焼くささげ物を指す。一般読者にも内容が伝わり、祭儀用語としても明確な表現を用いた。
- source_word: בְּנִי
  choice: わが子よ
  rationale: 父から息子への直接的で情愛を帯びた呼びかけを、品位ある自然な日本語で表した。
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: こうして二人は一緒に進んで行った
  rationale: 二人が共に歩み続けることを強調する反復表現を保ちつつ、物語の進行を自然な日本語にした。
theological_decisions:
- issue: 神の行為についてのアブラハムの発言の意味
  choice: 神がご自分のために羊を備える
  alternative: 神がご自分のために羊を見る／見つける
  rationale: ראה の字義を脚注に示しながら、文脈上の慣用的意味を本文に採用した。アブラハムの言葉が回避的発言なのか、預言的発言なのか、あるいはその両方なのかは断定せず、物語上の緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、アブラハムの呼びかけには「わが子よ」を採用して場面の厳粛さと情愛を保った。「ご自分のために」によって לּוֹ を明示し、原文の曖昧さは脚注で提示した。
