  terminology: 「ろば」「礼拝」「ひれ伏し」は文脈と原語の語義に適切である。「若者たち」はנְעָרָיוの基本義を保ちつつ、この場面の同行者を自然に表す。「この子」はアブラハムから見たナアールを不必要に年齢確定せずに表現している。
