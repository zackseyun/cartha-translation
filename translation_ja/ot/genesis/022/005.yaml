source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָהָ֜ם אֶל נְעָרָ֗י/ו שְׁבוּ לָ/כֶ֥ם פֹּה֙ עִֽם הַ/חֲמ֔וֹר וַ/אֲנִ֣י וְ/הַ/נַּ֔עַר נֵלְכָ֖ה עַד כֹּ֑ה וְ/נִֽשְׁתַּחֲוֶ֖ה וְ/נָשׁ֥וּבָה אֲלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: ja
  text: アブラハムは若者たちに言った。「おまえたちは、ろばと一緒にここに残っていなさい。私とこの子はあそこまで行き、礼拝し[a]、おまえたちのところへ戻って来る[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひれ伏し」。ヘブライ語の動詞は、礼拝の際に身を低くしてひれ伏すことを表す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「私たちは戻って来る」と複数形で述べられている。これが意図を隠す言葉なのか、期待なのか、神の備えへの確信なのかを、本文は説明していない。
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: 若者たち
  rationale: נַעַרには若者、従者などの意味がある。ここでは同行していた二人を指すため、身分を限定する「しもべたち」よりも、原語の基本的な意味を保つ「若者たち」とした。
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: おまえたちは、ここに残っていなさい
  rationale: יָשַׁבの「座る・とどまる」という意味のうち、先へ進まずその場にいるよう命じる文脈に合う自然な日本語とした。
- source_word: עִם הַחֲמוֹר
  choice: ろばと一緒に
  rationale: חֲמוֹרの一般的な現代日本語訳として「ろば」を用いた。
- source_word: וַאֲנִי וְהַנַּעַר
  choice: 私とこの子
  rationale: הַנַּעַרはここではイサクを指す。「この子」はアブラハムの視点を自然に表し、年齢を必要以上に特定しない。
- source_word: נֵלְכָה עַד כֹּה
  choice: あそこまで行き
  rationale: עַד כֹּהの指示的な意味と到達点を、「あそこまで」で簡潔かつ自然に表した。
- source_word: וְנִשְׁתַּחֲוֶה
  choice: 礼拝し
  rationale: שׁחהは身体を低くしてひれ伏すことを表し、神に対する文脈では礼拝を意味する。本文では文脈上の意味を示し、身体動作の含意は脚注に残した。
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: おまえたちのところへ戻って来る
  rationale: שׁוּבの意味を自然に表した。ヘブライ語は一人称複数形であり、直前の主語「私とこの子」がこの述語にもかかる形を保った。「それから」など原文に明示されない語は加えなかった。
theological_decisions:
- issue: アブラハムが帰還を一人称複数で述べていること
  choice: 「私とこの子」を共通の主語として、「戻って来る」と訳す
  alternative: 意図の隠蔽、二人とも戻るとの信仰、または神の備えへの確信のいずれかとして明示的に解釈する
  rationale: 原文では礼拝と帰還の双方に一人称複数形が使われている。日本語では動詞に数が現れないため、共通主語を明確に保ち、アブラハムの意図を本文で断定せず、原文の神学的緊張を維持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、族長の発話として落ち着いた品位を保った。「おまえたち」は上下関係のある直接命令として自然であり、過度に古風な語形は避けた。脚注記号は、それぞれが説明する「礼拝し」と「戻って来る」の直後に置いた。
