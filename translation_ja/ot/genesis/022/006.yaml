  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: ja
  text: アブラハムは全焼のささげ物に使う薪を取って、息子イサクに背負わせた。そして自分の手には火とナイフを持った。二人は一緒に歩いて行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: 全焼のささげ物に使う薪
  rationale: 構文上は「全焼のささげ物の薪」だが、目的関係を自然な現代日本語で明示した。「全焼のささげ物」は、全体を焼く祭儀上の עֹלָה を表す。
- source_word: וַיָּשֶׂם עַל
  choice: 背負わせた
  rationale: 直訳は「上に置いた」だが、人であるイサクの上に薪を載せて運ばせた場面なので、「背負わせた」が日本語として自然で、荷を負わせる描写も保つ。
- source_word: יִצְחָק בְּנוֹ
  choice: 息子イサク
  rationale: ヘブライ語の「イサク、その息子」を、日本語の自然な語順で表した。親子関係を明示する。
- source_word: בְּיָדוֹ
  choice: 自分の手には
  rationale: 単数形の「彼の手に」を保ちつつ、薪を担うイサクとの対照が分かるよう「自分の」を用いた。
- source_word: הָאֵשׁ
  choice: 火
  rationale: 原文は容器や火種を特定せず、単に「火」とするため、その非特定性を保った。
- source_word: הַמַּאֲכֶלֶת
  choice: 刃物
  rationale: 屠殺に用いる大型のナイフを指し得る語。「ナイフ」より古代の祭儀場面に自然で、用途を説明しすぎない「刃物」とした。
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: 二人は一緒に歩いて行った
  rationale: שְׁנֵיהֶם の明示的な「二人」と יַחְדָּו の「一緒に」をともに保ち、הלך の移動を自然な叙述として訳した。
theological_decisions:
- issue: עֹלָה の祭儀用語
  choice: 全焼のささげ物
  alternative: 焼き尽くすささげ物／上るささげ物
  rationale: 語源的な「上る」より、この文脈で確立している、供物全体を焼く祭儀区分を表す。「全焼のいけにえ」よりも、動物であることを先取りせず、祭儀的意味を明確にする。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の簡潔な連続動作と、父子が共に進む結語を保持した。説明的な補足やキリスト論的含意は本文に持ち込んでいない。
