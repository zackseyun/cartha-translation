  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: ja
  text: その時、アブラハムが目を上げて見ると、なんと、後ろに[a]一匹の雄羊がいて、その角が茂みに引っかかっていた。アブラハムは行ってその雄羊を取り、息子の代わりに[b]焼き尽くすいけにえとして献げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼の後ろに」。ヘブライ語には「彼」に当たる語は明示されておらず、ここでは אַחַר を場所を表す語と解している。
    reason: lexical_alternative
  - marker: b
    text: または「息子に代えて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: 目を上げて
  rationale: 視線を上げることを表すヘブライ語の慣用表現。物語の描写を保ちつつ、現代日本語として自然にした。
- source_word: וַיַּרְא
  choice: 見ると
  rationale: 直前の「目を上げて」と連続する動作を自然に示し、続く発見へつなげる表現とした。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 語り手が読者の注意を発見へ向ける機能を、明瞭な現代日本語で表した。
- source_word: אַיִל
  choice: 雄羊
  rationale: 成長した雄の羊を指す語であり、犠牲として献げる文脈にも適する標準的な訳語。
- source_word: אַחַר
  choice: 彼の後ろに
  rationale: この文脈では場所を示す副詞と解するのが自然。「彼」は原文に明示されないため、その点を脚注で示した。
- source_word: נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו
  choice: その角が茂みに引っかかっていた
  rationale: 雄羊が角のところで密生した木や草に捕らえられている状態を、自然かつ具体的に表した。
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: 焼き尽くすいけにえとして献げた
  rationale: 動物を祭壇で焼き尽くして献げる犠牲を指すため、祭儀的な意味を明確にした。
- source_word: תַּחַת בְּנוֹ
  choice: 息子の代わりに
  rationale: この文脈で明白な置き換え・代替の意味を、簡潔な現代日本語で表した。
theological_decisions:
- issue: תַּחַת בְּנוֹにおける代替の表現
  choice: 息子の代わりに
  alternative: 息子に代えて
  rationale: 雄羊が息子に代わって献げられたという本文の意味を保ちつつ、後代の教理的説明を本文へ持ち込まない表現とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「目を上げる」「焼き尽くすいけにえ」など原文の物語的・祭儀的な質感を保った。「なんと」により וְהִנֵּה の注意喚起と発見の驚きを自然に示した。
