  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: ja
  text: また、ベトエルはリベカをもうけた。この八人を、ミルカはアブラハムの兄弟ナホルに産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: また、ベトエルは
  rationale: 接続詞וを「また」とし、系譜の連続を自然に示した。固有名は日本語聖書で広く通用する「ベトエル」とした。
- source_word: יָלַד אֶת־רִבְקָה
  choice: リベカをもうけた
  rationale: 男性を主語とする系譜表現なので、現代日本語として自然で簡潔な「もうけた」を用いた。目的格標識אֶתは訳出しない。
- source_word: שְׁמֹנָה אֵלֶּה
  choice: この八人を
  rationale: 「この八人」というヘブライ語の明示的な数と指示を保ち、文脈から分かる「子どもたち」は補わなかった。
- source_word: יָלְדָה מִלְכָּה
  choice: ミルカは……産んだ
  rationale: 女性を主語とするיָלַדを、直接的で自然な「産んだ」と訳した。
- source_word: לְנָחוֹר
  choice: ナホルに
  rationale: 系譜的なלְを、日本語で夫との関係を簡潔に表す「に」とした。
- source_word: אֲחִי אַבְרָהָם
  choice: アブラハムの兄弟ナホル
  rationale: この同格句がナホルを特定していることを明確にするため、固有名の前に置いた。ヘブライ語אָחは年長・年少を特定しないため「兄」ではなく「兄弟」とした。
theological_decisions: []
