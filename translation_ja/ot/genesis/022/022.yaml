  yaml_path: translation/ot/genesis/022/022.yaml
  text: Kesed[a], Hazo, Pildash, Jidlaph, and Bethuel.
translation:
  language: ja
  text: ケセデ、ハゾ、ピルダシュ、イドラフ、ベトエル。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּשֶׂד
  choice: ケセド
  rationale: 系譜に挙げられた人名として、意味を訳さずヘブライ語の音に基づいて日本語表記した。
- source_word: חֲזוֹ
  choice: ハゾ
  rationale: 人名として音写した。語頭の ח は、現代日本語の聖書人名として読みやすい「ハ」で表した。
- source_word: פִּלְדָּשׁ
  choice: ピルダシュ
  rationale: 人名としてヘブライ語の子音と母音を日本語で自然に音写した。
- source_word: יִדְלָף
  choice: イドラフ
  rationale: 人名として音写し、語頭の י を「イ」、語末の ף を「フ」で表した。
- source_word: בְּתוּאֵל
  choice: ベトエル
  rationale: 人名として音写し、日本語で明瞭に読める形とした。
- source_word: וְ/אֶת … וְ/אֵת
  choice: 読点による列挙
  rationale: 反復される וְ は列挙を示し、אֶת は目的語標識なので日本語では訳出せず、人名を読点で自然に並べた。
