id: GEN.22.18
reference: Genesis 22:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: ja
  text: あなたの子孫によって、地のすべての国々は祝福を受ける[a]。あなたがわたしの声に従ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自らを祝福する」。ヘブライ語の動詞は、ここで再帰的な意味にも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: 祝福を受ける
  rationale: ヒトパエル形はここで受動・結果的な意味にも再帰的な意味にも解し得る。族長への約束という文脈に即して本文では自然な受動表現を採り、再帰的解釈は脚注に残した。
- source_word: בְזַרְעֲךָ
  choice: あなたの子孫によって
  rationale: זֶרַע は集合的に子孫を表す。前置詞 בְּ は「～にあって」とも「～によって」とも取り得るが、日本語では祝福が子孫を介して及ぶ意味を明瞭にするため「によって」とした。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地のすべての国々
  rationale: גּוֹיִם を基本義どおり「国々」とし、הָאָרֶץ の世界的な広がりを「地」で保った。
- source_word: עֵקֶב אֲשֶׁר
  choice: ～からである
  rationale: 約束が再確認される理由を示す因果表現として、明確で格調のある現代日本語にした。
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: あなたがわたしの声に従った
  rationale: 「声を聞く」というヘブライ語慣用句は、単なる聴取ではなく応答して従うことを意味するため、「声に従った」と訳した。
theological_decisions:
- issue: ברך のヒトパエル形によるアブラハムへの約束の意味
  choice: 諸国民がアブラハムの子孫によって祝福を受ける
  alternative: 諸国民がアブラハムの子孫を引き合いに出して自らを祝福する
  rationale: 契約の約束という文脈では受動・結果的理解がよく適合する。ただし、再帰的理解も文法上可能なので、本文だけで解消せず脚注に示した。
- issue: בְזַרְעֲךָ における前置詞 בְּ の関係
  choice: 子孫を媒介とする意味を表す「によって」
  alternative: 子孫との結びつきを表す「にあって」
  rationale: いずれも可能だが、現代日本語として意味が伝わりやすい媒介表現を選んだ。特定の後代的教理へ限定せず、זֶרַע の集合的な「子孫」という幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔で品位ある文体とした。「地」「わたしの声」は原文の表現を適度に保ち、理解しにくい古語は避けた。
