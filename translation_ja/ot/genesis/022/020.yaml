  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: ja
  text: これらの出来事の後、アブラハムに次のように告げられた。「見よ、ミルカもまた、あなたの兄弟ナホルに息子たちを産んだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: これらの出来事の後
  rationale: וַיְהִי は物語をつなぐ定型表現であり、日本語では独立した「さて」などを加えず、時を示す句として自然に表現した。דְּבָרִים はこの文脈では単なる「言葉」ではなく、先行する一連の出来事を指す。
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: アブラハムにこう知らされた
  rationale: 受動形「告げられた」と後続発言を導く לֵאמֹר を、明瞭で自然な現代日本語にまとめた。
- source_word: הִנֵּה
  choice: こう（後続する知らせへの注意喚起として反映）
  rationale: ここでは話者が相手の注意を後続内容へ向ける談話標識。直訳の「見よ」は現代日本語の伝聞文では不自然なため、引用を導く「こう」に機能を反映した。
- source_word: גַם הִוא
  choice: もまた
  rationale: ミルカも同様に子を産んだという追加・対応の意味を保った。
- source_word: לְנָחוֹר אָחִיךָ
  choice: あなたの兄弟ナホルに
  rationale: אָח は年長・年少を特定しないため、「兄」や「弟」と限定せず「兄弟」とした。לְ は出産した子の父との関係を示す自然な日本語として「ナホルに」と訳した。
