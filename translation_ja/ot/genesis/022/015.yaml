source:
  edition: WLC
  text: וַ/יִּקְרָ֛א מַלְאַ֥ךְ יְהוָ֖ה אֶל אַבְרָהָ֑ם שֵׁנִ֖ית מִן הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: ja
  text: ヤハウェの天使[a]は、天からアブラハムにもう一度呼びかけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天使」と訳した語は、「使者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼びかけた
  rationale: 物語を進める過去の動作として訳した。ここでは相手に声をかける意味なので、「叫んだ」や「宣言した」より「呼びかけた」が自然である。
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの天使
  rationale: מַלְאָךְには「使者」と「天使」の両義がある。この箇所では天から語る存在を指すため、本文では自然な「天使」とし、語の幅を脚注に残した。神学的な正体については断定しない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写して示した。
- source_word: אֶל אַבְרָהָם
  choice: アブラハムに
  rationale: אֶלは呼びかけの相手を示すため、自然な日本語の助詞「に」で表した。
- source_word: שֵׁנִית
  choice: もう一度
  rationale: 直訳的な「二度目に」より自然な現代日本語であり、直前の呼びかけに続く二度目であることを明確に伝える。
- source_word: מִן הַשָּׁמַיִם
  choice: 天から
  rationale: שָׁמַיִםは形態上複数形だが、この慣用では神的な領域としての「天」を指す。「空から」では文脈上の荘重さが弱まる。
theological_decisions:
- issue: מַלְאַךְ יְהוָה の理解
  choice: ヤハウェの天使
  alternative: ヤハウェの使者
  rationale: 本文では天的存在を表す一般的な訳語を用いる一方、この存在が被造の天使なのか、神の特別な顕現なのかは決めず、原文の神学的緊張を保った。語彙上の別訳は脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神名「ヤハウェ」と「天」という語で聖書本文にふさわしい品位を保った。
