  text: また、名をレウマという彼の側室も、テバ、ガハム、タハシュ、マアカを産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: また、彼のそばめがいて
  rationale: פִּילֶגֶשׁは正妻とは異なる地位の女性を指すため、社会的区別を保ちつつ現代の一般読者にも通じる「そばめ」とした。接続詞וּは「また」で表した。
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: その名はレウマであった
  rationale: 直訳的には「そして彼女の名はレウマ」という名詞文。日本語として自然な叙述に整えつつ、レウマがそばめの名であることを明確にした。
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: ילדはこの系譜的文脈で子を産むことを表すため、簡潔で自然な「産んだ」とした。
- source_word: גַּם הִוא
  choice: 彼女もまた
  rationale: 明示された代名詞הִואと追加・強調を表すגַּםの双方を残し、前節のミルカに加えてレウマも子を産んだという対比を保った。
- source_word: טֶבַח וְגַּחַם וְתַּחַשׁ וּמַעֲכָה
  choice: テバ、ガハム、タハシュ、マアカ
  rationale: いずれも人名として、ヘブライ語の音形に基づく日本語の慣用的な表記で音写した。
