id: GEN.22.12
reference: Genesis 22:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: ja
  text: 彼は言った。「その子に手を出してはならない。その子に何もしてはならない。今、わたしは、あなたが神を恐れていることを知った。あなたは自分の息子、自分のひとり子[b]を、わたしから差し控えなかった[a]からだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしのために惜しまなかった」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「あなたの息子、あなたのただ一人の者」。文脈上、約束の子としての唯一性を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: 手を下す
  rationale: 字義どおりには「手を伸ばす／送る」だが、この文脈では危害を加えることを指すヘブライ語の慣用表現である。「手を下す」は意味と比喩を自然な現代日本語で保つ。
- source_word: הַנַּעַר
  choice: その子
  rationale: נַעַר は少年から若者までを指し得る。ここでは年齢を必要以上に限定せず、直前からの指示対象を自然に示す「その子」とした。
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: 何もしてはならない
  rationale: 否定辞と מְאוּמָּה の組み合わせによる全面的な禁止を、簡潔で自然な日本語にした。文脈上、危害を加える行為を指す。
- source_word: עַתָּה יָדַעְתִּי
  choice: 今、…ことが分かった
  rationale: 「今」と完了形の組み合わせが示す、試みを経て知るに至ったという結果的な意味を自然に表す。神の知識についての神学的緊張は言い換えて解消しない。
- source_word: יְרֵא אֱלֹהִים
  choice: 神を恐れている
  rationale: 「神を畏れ敬う」と説明的に広げず、原文の直接的な表現と聖書的な含みを保つ。
- source_word: חָשַׂכְתָּ
  choice: 惜しまなかった
  rationale: חָשַׂךְ は「差し控える、惜しむ」の意。息子を神から引き留めなかったという文脈を、自然で重みのある日本語にした。「差し控えなかった」も可能なので脚注に示す。
- source_word: יְחִידְךָ
  choice: 自分のひとり子
  rationale: יָחִיד は「ただ一人の、唯一の」を意味する。イサクが契約の約束を担う唯一の息子であるという文脈で、自然な「ひとり子」とした。「愛する」は文脈上の含みになり得るが、語義として本文に加えない。
- source_word: מִמֶּנִּי
  choice: わたしにさえ
  rationale: מן と一人称接尾辞は字義的には「わたしから」。日本語では חָשַׂךְ との結びつきを「わたしにさえ惜しまなかった」と表すことで、神に対して息子を差し控えなかった意味を自然に伝える。
theological_decisions:
- issue: 「今、分かった」における神の知識の擬人的・関係的表現
  choice: 原文の「今、わたしは知った」を「今、…ことが分かった」と直接的に保つ。
  alternative: 「今、明らかになった」「今、あなたが…であることを示した」
  rationale: 原文は神の発話として「今、わたしは知った」と明記する。神の全知との関係を翻訳で説明したり、この緊張を解消したりせず、物語の表現をそのまま残す。
- issue: 「ひとり子」の意味範囲
  choice: 契約の文脈における唯一の息子として「ひとり子」とする。
  alternative: 「ただ一人の者」「愛する息子」
  rationale: アブラハムにはイシュマエルもいるため、生物学的に唯一の息子という意味へ単純化はしない。一方、「愛する」は原語の直接の語義ではないので本文に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令には簡潔で厳粛な調子を持たせた。「彼」は前節の発言者を受ける原文の代名詞を保ち、本文だけから「主」や「御使い」と明示することは避けた。
