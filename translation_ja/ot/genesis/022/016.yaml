source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: ja
  text: そして言った。「わたしは自分自身にかけて誓った――ヤハウェの宣言――。あなたがこのことを行い、あなたの子、あなたのひとり子[a]を惜しまなかった[b]ので、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ただ一人の子」または「唯一の子」。ここでのヘブライ語は、ただ一人であること、または他にないことを表しうる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「手元にとどめなかった」または「差し控えなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そして言った
  rationale: 継続する物語の動きを示す接続形を自然な日本語で表した。主語は文脈上明らかなため補わない。
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: わたしは自分自身にかけて誓う
  rationale: 神が自らを指して立てる誓いの定型句を明確に表す。完了形は、ここでは遂行的な宣言として現在の効力を持つため、日本語では「誓う」が自然である。
- source_word: נְאֻם יְהוָה
  choice: ――ヤハウェの宣言――
  rationale: 神による厳粛な託宣・宣言の定型句を、引用の流れを保ちながら荘重に示す。
- source_word: כִּי יַעַן אֲשֶׁר
  choice: ので
  rationale: 強い理由・根拠を示す複合表現を、後続節へ続く自然な日本語で表した。
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: あなたがこのことを行い
  rationale: דָּבָרがここでは具体的な行為を指すため、「このこと」とした。
- source_word: וְלֹא חָשַׂכְתָּ
  choice: 惜しまなかった
  rationale: 差し控えずに差し出したという文脈上の意味を自然に表す。「手元にとどめなかった」も語義上可能なので脚注で示す。
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: 自分の子、自分のひとり子
  rationale: 「あなたの子」に「あなたのただ一人の者」が同格で重ねられるヘブライ語の強調を保った。「ひとり子」は自然だが、語には「唯一の、特別な」の含みもあるため脚注を付した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名として音写し、神名と称号を区別した。
- issue: יְחִידְךָ の意味範囲
  choice: 自分のひとり子
  alternative: 自分のただ一人の、特別な子
  rationale: イサクの唯一性を示す同格表現を簡潔な日本語で保ちつつ、単なる生物学的な一人息子という意味だけに限定しないよう脚注で語義の幅を示した。
- issue: חָשַׂךְ の文脈的ニュアンス
  choice: 惜しまなかった
  alternative: 手元にとどめなかった／差し控えなかった
  rationale: 犠牲として差し出す場面に適した自然な表現を採ったが、感情面だけに狭めないよう別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の誓いと宣言の荘重さを保った。節が次節へ続く構文であるため、末尾を「ので、」として未完のまま保っている。
