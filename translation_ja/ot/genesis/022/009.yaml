  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: ja
  text: 彼らは、神がアブラハムに告げた場所に着いた[a]。アブラハムはそこに祭壇を築き[b]、薪を並べた。そして息子イサクを縛り、祭壇の上の薪の上に置いた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「神が彼に言った場所に着いた」。ここで「彼」はアブラハムを指す。
    reason: 原文の「言う」という表現と、代名詞の指示対象を示すため。
  - marker: b
    text: ヘブライ語では「その祭壇」。日本語では冠詞の区別を通常表さないため、「祭壇」と訳した。
    reason: 原文の定冠詞を示すため。
  - marker: c
    text: 直訳「薪の上方に」。すなわち、並べた薪の上に置いたことを表す。
    reason: 原文の空間表現と文脈上の位置関係を示すため。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 彼らは…着いた
  rationale: 物語を先へ進める連続形と複数主語を保ち、アブラハムとイサクの到着を自然な現代日本語で表した。
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: 神がアブラハムに告げておられた
  rationale: אמר＋間接目的語を文脈に即して「告げる」とし、到着に先立つ神の指示であることを「ておられた」で示した。代名詞「彼」の指示対象は日本語で明瞭になるよう「アブラハム」とした。
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: アブラハムはそこに祭壇を築き
  rationale: 定冠詞付きの名詞だが、日本語には冠詞の対立がないため、特定・不特定を過度に補わず「祭壇」とした。
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: 薪を並べた
  rationale: ערךの「整えて配置する」という意味を保ち、祭壇で燃やす木材を自然な日本語の「薪」で表した。
- source_word: וַיַּעֲקֹד אֶת יִצְחָק בְּנוֹ
  choice: 息子イサクを縛り
  rationale: עקדの拘束する行為を婉曲化せず「縛る」と訳し、בְּנוֹも明示した。
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ מִמַּעַל לָעֵצִים
  choice: 祭壇の上、薪の上に置いた
  rationale: שיםの広い配置の意味を「置く」で表し、祭壇と薪に対する位置関係を原文に沿って明示した。
theological_decisions:
- issue: 犠牲をささげる構造物の特定性
  choice: 祭壇
  alternative: その祭壇
  rationale: ヘブライ語には定冠詞があるが、日本語で「その」を加えると既出の祭壇を指す印象が強くなる。無冠詞の「祭壇」で、文脈上の特定性を保ちつつ不自然な限定を避けた。
- issue: イサクを縛る行為の表現
  choice: 息子イサクを縛り
  alternative: 息子イサクをくくり
  rationale: 伝統的な「縛り」の主題を保ちつつ、現代の一般読者に明瞭で、行為を弱めも強めもしない語を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、厳粛な物語調を維持した。敬語は神の発話行為に限定して穏やかに用い、アブラハムの行動は簡潔な連続動作として表現した。
