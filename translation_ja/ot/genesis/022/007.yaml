source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: ja
  text: イサクは父アブラハムに言った。「お父さん。」アブラハムは答えた。「ここにいるよ、わが子よ。」イサクは言った。「ほら、火と薪はあります。でも、焼き尽くすささげ物にする羊[a]はどこにいるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の「セー」は、羊や子羊だけでなく、山羊や子山羊をも含みうる、群れに属する小型の家畜を広く指すことがあります。
    reason: 原語 שֶׂה は本文の「羊」より広く、羊・山羊の別や年齢を必ずしも限定しないため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った／答えた
  rationale: אמרの通常の物語用法を基本的に「言った」とし、呼びかけに対する二つ目の発話は、日本語で対話の流れが明瞭になるよう「答えた」とした。
- source_word: אָבִיו
  choice: 父アブラハム
  rationale: 三人称の親族関係を明示し、場面の厳粛さに合う標準的な「父」を用いた。
- source_word: אָבִי
  choice: お父さん
  rationale: 一人称接尾辞を伴う呼びかけを、現代日本語で自然かつ敬意のある子から父への呼称として表した。
- source_word: הִנֶּנִי
  choice: ここにいるよ
  rationale: 応答を表す定型句の字義と文学的反復を保ちつつ、父が息子に語る自然な現代日本語とした。
- source_word: בְּנִי
  choice: わが子よ
  rationale: 所有と愛情を含む呼びかけを保ち、文脈の重みを伝える dignified な表現とした。
- source_word: הִנֵּה
  choice: ほら
  rationale: 目の前にある物へ注意を向ける指示詞を、古風な「見よ」を避けて自然に表した。
- source_word: הָאֵשׁ
  choice: 火
  rationale: 目の前に用意された火を指す。日本語では列挙の中で定冠詞を別に表す必要がない。
- source_word: הָעֵצִים
  choice: 薪
  rationale: 複数形の木片を、祭儀の火に用いるものとして自然で具体的な日本語にした。
- source_word: אַיֵּה
  choice: どこにいるのですか
  rationale: 生きた動物の所在を尋ねる疑問を、父への丁寧な問いとして自然に表した。
- source_word: הַשֶּׂה
  choice: 羊
  rationale: שהは羊または山羊を含み得る群れの小動物を指すが、本文では簡潔で自然な「羊」とし、語義の広さを脚注で保持した。
- source_word: לְעֹלָה
  choice: 焼き尽くすささげ物にする
  rationale: 全体を焼く献げ物を指す祭儀用語を、普通の読者にも意味が伝わる現代日本語で表した。
theological_decisions:
- issue: 犠牲動物 שֶׂה の範囲
  choice: 羊[a]
  alternative: 子羊／羊または山羊など群れの小動物
  rationale: 原語は年齢を子羊に限定せず、山羊も指し得る。本文の自然さを保つため「羊」とし、原語の幅を脚注で明示して特定の動物に過度に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話は自然にしつつ場面の厳粛さを保った。「お父さん」と「わが子よ」により親子の呼びかけを区別し、「見よ」のような古語は避けた。
