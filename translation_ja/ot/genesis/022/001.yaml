source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: ja
  text: これらのことの後[a]、神はアブラハムを試し、彼に「アブラハム」と言った。彼は答えた。「はい、ここにいます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの出来事の後」とも訳せる。
    reason: דְּבָרִים は「こと」「出来事」「事柄」などを意味し得るため。
  - marker: b
    text: 呼びかけに注意を向け、応じる用意があることを表す言い方。
    reason: הִנֵּנִי の慣用的なニュアンスを示すため。
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立した語としては訳出しない）
  rationale: ここでは物語を次の場面へ移す叙述上の導入として働くため、続く時間表現に含めるのが自然な現代日本語となる。
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: これらのことの後
  rationale: דְּבָרִים の広い意味を保ち、先行する物語との時間的なつながりを示す。「出来事」と限定しすぎない訳を本文に採った。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: この文脈ではまことの神を指す。神名YHWHではないため、「主」とはしない。
- source_word: נִסָּה
  choice: 試し
  rationale: ピエル形は、性質や忠実さを明らかにするため試験にかけることを表す。「誘惑した」では、悪へ誘ったという原文に不要な意味を生じさせる。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 彼に言った
  rationale: אמרと間接目的語を簡潔かつ自然に表す。
- source_word: אַבְרָהָם
  choice: アブラハムよ
  rationale: 呼びかけであることを、現代日本語で明確に示す。
- source_word: הִנֵּנִי
  choice: はい、ここにおります
  rationale: 呼びかけに対する注意深い応答と、すぐ応じる姿勢を表すヘブライ語の慣用句。「はい」だけにせず、存在と備えの含みを保った。
theological_decisions:
- issue: 神を主語とする נִסָּה の意味
  choice: 神はアブラハムを試した
  alternative: 神はアブラハムを誘惑した
  rationale: この文脈の動詞は試験にかける、確かめるという意味であり、悪へ誘うことを意味しない。ただし、試みの目的や結果について本文がこの節で明言していないため、それ以上の神学的説明は訳文に加えない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。神にだけ特別な敬語を付すことで原文にない距離感を加えないよう、叙述は常体で統一した。「ここにおります」はアブラハムの応答として自然な丁寧さを持たせている。
