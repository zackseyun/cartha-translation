  text: וַ/יָּ֤שָׁב אַבְרָהָם֙ אֶל נְעָרָ֔י/ו וַ/יָּקֻ֛מוּ וַ/יֵּלְכ֥וּ יַחְדָּ֖ו אֶל בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֥שֶׁב אַבְרָהָ֖ם בִּ/בְאֵ֥ר שָֽׁבַע־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: ja
  text: そこでアブラハムは若者たち[a]のところに戻った。彼らは立ち上がり、一緒にベエル・シェバへ向かった。アブラハムはベエル・シェバに住んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「アブラハムは若者たちのところに戻った」と記している。この節ではイサクに言及していないが、直前の物語には登場している。
    reason: 原文にある人物言及の省略を示し、イサクを本文に補わずに物語上の緊張を保持するため。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 戻った
  rationale: שׁובのカル・連続形は物語の流れの中で「戻る」を表す。簡潔で自然な現代日本語とした。
- source_word: נְעָרָיו
  choice: 若者たち
  rationale: נַעַרは文脈により若者、しもべ、従者を指し得る。ここでは同行したしもべたちだが、身分を限定しすぎず、原語の語義を保つため「若者たち」とした。
- source_word: וַיָּקֻמוּ
  choice: 立ち上がり
  rationale: קוםは物語で次の行動の開始を示すことが多い。「立ち上がり」は動作と継起性を自然に伝える。
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: 一緒に…向かった
  rationale: הלךとיחדוは共同で移動することを表す。目的地を伴う日本語として「一緒に…向かった」が自然であり、歩行という様態を不必要に加えない。
- source_word: בְּאֵר שָׁבַע
  choice: ベエル・シェバ
  rationale: 地名として意味を訳さず、一般的な聖書地名の音写を用いた。
- source_word: וַיֵּשֶׁב
  choice: 住んだ
  rationale: ישׁבは「座る」「とどまる」「住む」を意味し得る。ここでは地名を伴い、居住を述べる用法と判断した。「住んだ」は継続的な居住を明確かつ自然に表す。
theological_decisions:
- issue: 山から戻った者としてアブラハムだけが明記され、直前の物語にいるイサクがこの節では言及されないこと
  choice: 本文どおり、戻った者としてアブラハムだけを記し、イサクを補わない
  alternative: アブラハムが代表者として述べられており、イサクも共に戻ったと解して本文に補う
  rationale: ヘブライ語はアブラハムだけを明示している。イサクの同行を推測して本文に加えず、原文にある物語上の緊張と曖昧さを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の連続する動作は、短い文に分けて自然な物語文とした。「若者たち」は原語の幅を保ち、「しもべたち」と限定しなかった。
