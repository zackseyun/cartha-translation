source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: ja
  text: すると、ヤハウェの御使い[a]が天から[b]彼に呼びかけて言った。「アブラハム、アブラハム。」彼は言った。「はい、ここにおります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェの使者」とも訳せる。ヘブライ語 מַלְאָךְ は「使者」と「天使」のどちらも意味し得るが、ここでは天から呼びかけているため「御使い」とした。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では形の上で「天」は複数形だが、神の領域としての天を表す慣用的な語である。そのため、日本語では自然に「天から」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: 彼に呼びかけて
  rationale: קראはこの場面では相手に向かって声をかけることを表す。אֵלָיוの方向性も「彼に」で明示した。
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの御使い
  rationale: מַלְאָךְには「使者」と「天使」の両義があるが、天から語る存在という文脈により「御使い」が自然である。神名יהוהは固有名として「ヤハウェ」とした。
- source_word: מִן הַשָּׁמַיִם
  choice: 天から
  rationale: שָׁמַיִםは形態上複数形だが、ここでは神の領域としての天を指す慣用表現なので、自然な日本語の単数的表現「天から」とした。
- source_word: אַבְרָהָם אַבְרָהָם
  choice: アブラハム、アブラハム。
  rationale: 名前の反復をそのまま保ち、緊迫した直接の呼びかけを表した。句読点だけで力が伝わるため、原文にない感情の強さを加えかねない感嘆符は用いなかった。
- source_word: הִנְנִי
  choice: はい、ここにおります
  rationale: 自分がその場にいて応答する用意があることを示す定型句。現代日本語として自然で、相手への敬意も表す。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有の神名を普通名詞的な称号に置き換えず、一般的な学術的転写に基づく「ヤハウェ」で示した。
- issue: מַלְאַךְ יְהוָה の存在をヤハウェ自身の顕現と解釈するか
  choice: ヤハウェの御使い
  alternative: ヤハウェご自身／ヤハウェの使者
  rationale: 原文はこの存在をמַלְאַךְと呼んでいるため、その語を訳出し、存在論的同一性について本文以上の判断を加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会話では、アブラハムの応答の丁重さと即応の姿勢を「はい、ここにおります」で表した。接続詞וַは直前の行為を制止する展開に合わせて「すると」とした。
