  to: すると、ヤハウェの御使い[a]が天から[b]彼に呼びかけて言った。「アブラハム、アブラハム。」彼は言った。「はい、ここにおります。」
  rationale: 本文の意味は維持しつつ、脚注bの不自然で誤解を招く「天々から」を、ヘブライ語の形態と日本語訳の関係を正確に示す説明へ改めた。また、原文の通常の発話動詞に合わせて「答えた」を「言った」に改めた。
