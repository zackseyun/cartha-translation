id: GEN.22.17
reference: Genesis 22:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: ja
  text: わたしは必ずあなたを祝福し、あなたの子孫[a]を、天の星のように、また海辺にある砂のように、必ず増し加える。あなたの子孫は、その敵たちの門を手に入れる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「あなたの種」。この語は文法上は単数だが、子孫を集合的に指すことができる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その敵たちの門を受け継ぐ」。原文では「子孫／種」は文法上単数で、末尾は「彼の敵たち」となる単数の所有接尾辞を用いる。「門」は敵の町やその支配を表すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: （日本語では独立した接続語を置かない）
  rationale: 前節から続く誓いの内容を導く語。日本語では「わたしは」で直接始めるほうが自然であり、強調は後続する「必ず」によって表した。
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: わたしは必ずあなたを祝福し
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を、「必ず」で明確に表した。
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: 必ず増し加える
  rationale: 反復的なヘブライ語構文の強意を保ちつつ、現代日本語として自然な表現にした。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: 直訳は「あなたの種」だが、ここでは集合的に後代の者たちを指す。「子孫」は日本語では数を限定せず、集合的単数の含みも過度に解消しない。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: 天の星のように
  rationale: 比喩と格調を保ちながら、自然な聖書日本語とした。
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: 海辺にある砂のように
  rationale: אֲשֶׁר עַל の関係表現を「にある」で反映し、שְׂפַת הַיָּם の「海の縁」という像を自然な「海辺」で表した。
- source_word: וְיִרַשׁ
  choice: 手に入れる
  rationale: יָרַשׁ は「受け継ぐ」「所有する」「占有する」の意味領域を持つ。敵の門を支配下に置くという能動的意味を、過度に解釈せず自然に表した。
- source_word: שַׁעַר
  choice: 門
  rationale: 都市とその支配を代表する比喩的含意を持つが、原文の具体的な語像を保つため「門」とした。
- source_word: אֹיְבָיו
  choice: その敵ども
  rationale: 原文の接尾辞は文法上単数で、集合的単数の「子孫」を受ける。「その」によって単数的な照応を可能な限り保った。
theological_decisions:
- issue: זֶרַע の集合的単数と、אֹיְבָיו の単数接尾辞
  choice: 「あなたの子孫……その敵ども」とし、集合体を単数的に受ける構造を残す
  alternative: 「あなたの子孫たちは、彼らの敵どもの門を手に入れる」
  rationale: 原文は「子孫／種」を文法上単数として扱い、続く所有接尾辞も単数である。個人を指す読みか複数の子孫を指す読みかを翻訳段階で決めず、原文の集合的単数の緊張を保った。
- issue: 「敵の門を得る」という表現の意味
  choice: 比喩を保持して「門を手に入れる」とする
  alternative: 「敵を征服する」または「敵の町を支配する」
  rationale: 門が都市の支配を表す可能性は高いが、解釈を本文に織り込まず、原文の具体的な比喩を残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の誓いにふさわしい簡潔で格調ある調子を保った。「必ず」を二度用いて原文の並行した強意構文を再現し、「天の星」「海辺の砂」という詩的な対句を自然な語順で示した。
