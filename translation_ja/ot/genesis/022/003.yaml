  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: ja
  text: アブラハムは朝早く起き、ろばに鞍をつけ、二人の若者[a]と息子イサクを連れ、全焼のささげ物のための薪を割った。それから立ち上がり、神が彼に告げた場所へ向かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人の従者」または「二人の召使い」とも訳せる。ヘブライ語は、文脈により若い男性または男性の従者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: アブラハムは朝早く起き
  rationale: שׁכםの「早く起きる」という意味と、בבקרの時を表す句を、自然な現代日本語で明確に表した。
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: ろばに鞍を置き
  rationale: חבשはこの旅支度の文脈では、ろばに鞍や装具を取り付けることを指す。「鞍を置く」は意味を明確に保つ。
- source_word: שְׁנֵי נְעָרָיו
  choice: 二人の若者
  rationale: נַעַרは若者にも従者にもなり得る。本文では身分を限定しない「若者」とし、文脈上可能な別訳を脚注に示した。
- source_word: יִצְחָק בְּנוֹ
  choice: 息子イサク
  rationale: 日本語として自然な語順を用いながら、イサクとアブラハムの父子関係を明示した。
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: 全焼のささげ物のための薪を割った
  rationale: בקעの「割る」と、עֹלָהという祭儀用語を保ち、木材が供え物を焼くための薪であることを自然に示した。
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: それから立ち上がり、…へ向かった
  rationale: 連続する二つの動作を残しつつ、日本語の物語文として不自然にならないよう表現した。
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים
  choice: 神が彼に告げた場所へ
  rationale: 既に神から示された目的地を指す関係節を簡潔に表し、אמר לוの意味を「彼に告げた」とした。
theological_decisions:
- issue: עֹלָהの訳語
  choice: 全焼のささげ物
  alternative: 焼き尽くすささげ物
  rationale: 供え物が火で全て焼かれる祭儀上の区分を簡潔に示す。後代の制度的意味を過度に読み込まず、この語の基本的な祭儀的意味を保った。
- issue: נְעָרָיוが示す同行者の立場
  choice: 若者
  alternative: 従者／召使い
  rationale: 接尾辞はアブラハムとの所属関係を示すが、名詞自体は年齢と従者的役割の双方を表し得るため、本文で身分を断定せず、語義の幅を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の簡潔な連続動作を保ち、祭儀用語は一般読者にも意味が伝わる表現とした。
