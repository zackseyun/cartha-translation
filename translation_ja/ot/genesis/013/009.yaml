base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: ja
  text: この土地はすべてあなたの前にあるではないか。どうか私と別れてくれ。あなたが左へ行くなら[a]、私は右へ行こう。あなたが右へ行くなら、私は左へ行こう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の条件節では動詞が省略されており、直訳すると「もし左なら、私は右へ行こう。もし右なら、私は左へ行こう」となる。本文では意味を明確にするため、「行く」を補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ではないか
  rationale: 同意を期待する修辞疑問を、自然な現代日本語で表した。
- source_word: כָל הָאָרֶץ
  choice: 土地はすべて
  rationale: ここでの אֶרֶץ は地球全体ではなく、目の前にある居住可能な土地を指す。
- source_word: לְפָנֶיךָ
  choice: あなたの前にある
  rationale: 土地がロトの前にあり、選べる状態にあるというヘブライ語の空間的な比喩を保った。
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: どうか私と別れてくれ
  rationale: נָא の丁寧な依頼を「どうか」で示し、物理的に別れて住むよう求める意味を簡潔に表した。
- source_word: אִם הַשְּׂמֹאל
  choice: あなたが左へ行くなら
  rationale: 原文では動詞が省略されているため、文脈上最小限の補足として「行く」を用いた。
- source_word: וְאֵימִנָה
  choice: 私は右へ行こう
  rationale: 右の方向へ移る意志を表す方向形を、申し出として自然な「行こう」で訳した。
- source_word: וְאִם הַיָּמִין
  choice: あなたが右へ行くなら
  rationale: 前半と同じ省略構文を、対句の均衡を保って訳した。
- source_word: וְאַשְׂמְאִילָה
  choice: 私は左へ行こう
  rationale: 左の方向へ移る意志を表す方向形を、前半と対応させた。
