  text: אַבְרָ֖ם יָשַׁ֣ב בְּ/אֶֽרֶץ כְּנָ֑עַן וְ/ל֗וֹט יָשַׁב֙ בְּ/עָרֵ֣י הַ/כִּכָּ֔ר וַ/יֶּאֱהַ֖ל עַד סְדֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: ja
  text: アブラムはカナンの地に住み、ロトは平野の町々に住んで、ソドムに至るまで天幕を張った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ソドムの方まで天幕を移した」。ヘブライ語の動詞は、天幕を張ること、または天幕で生活することを表し得る。ここでは、ロトの宿営がソドムの方へ広がったことを示しており、この時点ですでに町の中に住んだとまでは述べていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: 住んだ／住んで
  rationale: 居住する、住み着くという基本的な意味を、現代日本語で自然に表した。文中では接続に合わせて「住み」「住んで」とした。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地に
  rationale: אֶרֶץ（地）を省略せず、自然な日本語で原文の表現を保った。
- source_word: בְּעָרֵי הַכִּכָּר
  choice: 低地の町々に
  rationale: כִּכָּרはこの文脈でヨルダン地方の平坦な低地を指す。「低地」は地形を明瞭に表し、複数形 עָרֵי は「町々」とした。
- source_word: וַיֶּאֱהַל
  choice: 天幕を張っていった
  rationale: 動詞 אהל の「天幕を張る／天幕生活をする」という意味を保ちつつ、עַד が示すソドム方面への広がりを自然に表した。
- source_word: עַד סְדֹם
  choice: ソドムに至るまで
  rationale: עַד の到達範囲・限界を表す。この時点でロトがソドム市内に住んだと断定せず、宿営がその方向へ及んだことを示す。
- source_word: אַבְרָם
  choice: アブラム
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: לוֹט
  choice: ロト
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: סְדֹם
  choice: ソドム
  rationale: 日本語聖書で定着した地名表記を用いた。
