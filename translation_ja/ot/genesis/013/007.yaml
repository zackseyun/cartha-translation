id: GEN.13.7
reference: Genesis 13:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: ja
  text: アブラムの家畜を飼う者たちと、ロトの家畜を飼う者たちとの間に争いが起こった。そのころ、カナン人とペリジ人[a]がその地に住んでいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カナン人」と「ペリジ人」は、原文ではそれぞれ単数形の民族名が集合的な意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 起こった
  rationale: 物語を進める存在・出来事の表現。日本語では「争いが起こった」とすることで、簡潔かつ自然に事態の発生を表せる。
- source_word: רִיב
  choice: 争い
  rationale: 口論から対立までを含み得る語であり、原因や具体的形態を限定しない現代日本語として選んだ。
- source_word: רֹעֵי מִקְנֵה
  choice: 家畜を飼う者たち
  rationale: מִקְנֶה は羊だけでなく家畜全般を指すため、「羊飼い」より広い表現とした。
- source_word: בֵּין ... וּבֵין
  choice: …と…との間に
  rationale: 対立する二つの集団を示す対応構造を保った。
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: カナン人とペリジ人
  rationale: ヘブライ語は単数形の民族名を集合的に用いている。日本語の民族名も単複を形態上区別しないため、自然にその集合的意味を保持できる。
- source_word: אָז
  choice: そのころ
  rationale: 物語上の同時期を示す語として、硬すぎず自然な時間表現を選んだ。
- source_word: יֹשֵׁב
  choice: 住んでいた
  rationale: 分詞が表す継続的な居住状態を、日本語の過去進行的な表現で示した。
- source_word: בָּאָרֶץ
  choice: その地に
  rationale: 直前まで語られている土地を指す文脈を明確にしつつ、「地」が持ち得る創世記での地理的・契約的響きを不必要に弱めない。
theological_decisions:
- issue: הָאָרֶץ が持ち得る契約的含意
  choice: その地
  alternative: その地方／その国
  rationale: この節ではまず地理的な記述だが、創世記における「地」の反復的な意義を消さない表現とした。文脈にない神学的説明は加えていない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての落ち着きを保つ文体。「牧者」は避け、家畜全般を扱うことが明確な「家畜を飼う者たち」とした。脚注標識は該当する民族名の直後に置いた。
