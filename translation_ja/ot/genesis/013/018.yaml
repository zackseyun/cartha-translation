- from: そこで、アブラムは天幕を移し、ヘブロンにあるマムレの樫の木々[a]のそばに来て住んだ。そして、そこでヤハウェ[b]のために祭壇を築いた。
  to: そこで、アブラムは天幕を移し、ヘブロンにあるマムレの樫の木立[a]のそばに来て、そこに住んだ。そして、そこでヤハウェのための祭壇を築いた。
  rationale: 原文の意味を変更せず、樹木を表す複数形を自然な日本語の「木立」とし、到着・居住・そこでの祭壇建設という叙述の展開を明瞭にした。脚注aは樹種の不確定さを保持する。脚注bは本文にヤハウェを用いる判断の補足として維持する。
