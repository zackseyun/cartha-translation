  text: וַ/יֶּאֱהַ֣ל אַבְרָ֗ם וַ/יָּבֹ֛א וַ/יֵּ֛שֶׁב בְּ/אֵלֹנֵ֥י מַמְרֵ֖א אֲשֶׁ֣ר בְּ/חֶבְר֑וֹן וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: ja
  text: そこで、アブラムは天幕を移し、ヘブロンにあるマムレの樫の木立[a]のそばに来て、そこに住んだ。そして、そこでヤハウェのための祭壇を築いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マムレのテレビンの木立」とも訳せる。ヘブライ語は、樫やテレビンのような大木を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: 天幕を移し
  rationale: 動詞אהלは天幕を張ること、また天幕を伴って移動することを表す。ここでは到着と居住が続くため、文脈上の移動を自然に示す「天幕を移し」とした。
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: 来て住んだ
  rationale: 二つの動詞が示す到着と居住の順序を保ち、簡潔で自然な現代日本語にした。
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: マムレの樫の木々のそばに
  rationale: אֵלֹנִים系の語は樫またはテレビンのような大木を指し得る。本文では通用性の高い「樫」を用い、樹種の不確かさは脚注に残した。前置詞בְּはこの場所との位置関係を示すため「そばに」とした。
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: ヘブロンにある
  rationale: 関係節がマムレの木々の所在地を示していることを、自然な日本語の連体修飾で表した。
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: そこで祭壇を築いた
  rationale: שָׁםの場所の強調と、מִזְבֵּחַの通常の意味「祭壇」をそのまま保った。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 前置詞לְが示す祭壇の奉献先を「のために」で表し、神の固有名יהוהは音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された神の固有名を一般的な学術上の音写で示した。ユダヤ教の朗読伝統とそれに基づく翻訳では「主」とされるため、その慣例も脚注で示した。
- issue: אֵלֹנֵי が指す樹木
  choice: 樫の木々
  alternative: テレビンの木々
  rationale: 語が指す正確な樹種を断定できないため、本文では分かりやすい「樫」を採り、別の有力な理解を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の動作順序を保ちつつ、逐語訳的な不自然さを避けた。「天幕」「祭壇」は聖書の歴史的背景に適した一般的な語として用いた。
