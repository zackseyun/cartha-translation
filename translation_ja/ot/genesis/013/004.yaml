  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: ja
  text: 以前そこに築いた祭壇の場所へ戻った。そこでアブラムはヤハウェの名を呼び求めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェの名を宣べ伝えた」、または「ヤハウェの名によって呼びかけた」とも訳せる。ヘブライ語の表現は、神への呼びかけと御名の宣言の両方を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל מְקוֹם הַמִּזְבֵּחַ
  choice: 祭壇の場所へ
  rationale: 前節から続く移動の到着点を示す。מְקוֹם と定冠詞付きの הַמִּזְבֵּחַ を自然な現代日本語で表した。
- source_word: אֲשֶׁר עָשָׂה שָׁם בָּרִאשֹׁנָה
  choice: 初めにそこに築いた
  rationale: עָשָׂה は字義的には「造った」だが、祭壇について日本語では「築いた」が自然。בָּרִאשֹׁנָה はアブラムが以前この地に来た時を指すため「初めに」とした。
- source_word: וַיִּקְרָא שָׁם אַבְרָם
  choice: そこでアブラムは…呼び求めた
  rationale: 二度目の שָׁם も「そこで」と訳し、原文の場所への強調を保った。
- source_word: בְּשֵׁם יְהוָה
  choice: ヤハウェの名を呼び求めた
  rationale: קרא בשם の慣用句は祈願・礼拝的な呼びかけを表し得る。「呼び求めた」は自然である一方、宣べ伝える意味もあり得るため脚注で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、一般的な学術的推定発音に基づいて音写した。
- source_word: אַבְרָם
  choice: アブラム
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 「主」、または「エホバ」
  rationale: 原文が固有の神名を用いていることを本文で明示するため「ヤハウェ」とした。伝統的な代読や別音写は採らなかった。
- issue: קרא בשם יהוה の意味範囲
  choice: ヤハウェの名を呼び求めた
  alternative: 「ヤハウェの名を宣べ伝えた」／「ヤハウェを御名によって呼んだ」
  rationale: この句は祈り・礼拝における呼びかけと、公に御名を告げることの双方を含み得る。本文では文脈上自然な「呼び求めた」を採り、意味の幅を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「造った」より祭壇との自然な結びつきを持つ「築いた」を採用し、神名は「ヤハウェ」と音写した。前節から文が続く断片性を避けるため、移動を表す「戻った」を補って独立した日本語文とした。
