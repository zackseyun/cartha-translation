lexical_decisions:
- source_word: נָשָׂא
  choice: 十分である
  rationale: 基本義は「担う、支える」。ここでは土地が二人とその家畜・財産を収容し支える余力を表すため、日本語として自然な「住むには十分でなかった」とした。
- source_word: רְכוּשָׁם
  choice: 二人の財産
  rationale: 家畜を含む取得財・所有物全般を指す語であり、文脈に即して簡潔に「財産」とした。
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: 一緒に住む
  rationale: ישׁב はここでは定住・居住を表し、יַחְדָּו は両者が同じ地域で暮らすことを示す。反復も原文どおり保持した。
