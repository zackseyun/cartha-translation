id: GEN.13.16
reference: Genesis 13:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: ja
  text: わたしは、あなたの子孫[a]を大地のちりのように多くする。もし人[b]が大地のちりを数えられるなら、あなたの子孫も数えられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子孫」に当たるヘブライ語は、直訳すれば「種」で、後代全体を指す単数形の集合名詞。
    reason: lexical_alternative
  - marker: b
    text: 「人」に当たるヘブライ語は男性単数形だが、ここでは人一般を指す。
    reason: source_form
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: わたしは…多くする
  rationale: שׂוּם は本来「置く、定める」だが、目的語と比較句を伴うここでは「…のようにする」の意。日本語では、無数の子孫という文脈を明確にする「多くする」が自然である。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: זֶרַע は単数形の集合名詞で、ここではアブラムから生まれる後代全体を指す。「種」より現代日本語で意味が明瞭な「子孫」を採用し、集合名詞であることは脚注に示す。
- source_word: כַּעֲפַר הָאָרֶץ
  choice: 大地のちりのように
  rationale: 比較表現と、数え尽くせないほどの多さを示す原文の具体的な比喩を保つ。「地のちり」より「大地のちり」が現代日本語として明瞭で自然である。
- source_word: אֲשֶׁר אִם
  choice: もし…なら
  rationale: 後続節は、ちりを数えられるなら子孫も数えられるという仮定的な対応を表す。日本語では「もし…なら」で条件関係を明確に表せる。
- source_word: אִישׁ
  choice: 人
  rationale: 男性単数名詞だが、ここでは特定の男性ではなく一般的な人を指す。日本語の「人」は原文の総称的機能を自然に伝える。
- source_word: לִמְנוֹת / יִמָּנֶה
  choice: 数えられる／数えられる
  rationale: 同じ語根 מנה の能動不定詞とニファル形の対応を、同じ「数える」を用いて保つ。後半は条件文中の可能を表すため「数えられる」とする。
- source_word: גַּם
  choice: も
  rationale: 大地のちりとアブラムの子孫との対応を、簡潔で自然な助詞「も」で表す。
theological_decisions:
- issue: アブラムへの約束における集合名詞 זֶרַע の訳
  choice: 子孫
  alternative: 種、子孫となる者たち
  rationale: この節ではアブラムの後代が数え切れない集団として語られている。「子孫」はその意味を明瞭に伝えつつ、この節だけに特定の単数的・メシア的解釈を持ち込まない。単数形の集合名詞という原文の特徴は脚注で保持する。
- issue: אִישׁ の総称的用法
  choice: 人
  alternative: 男、だれか
  rationale: 原文は男性単数形だが、意味上は人一般を指す。日本語では「男」とすると対象を男性に限定する含みが生じるため、総称性を正確に表す「人」を本文に置き、形態上の情報を脚注に示す。
- issue: 条件文が示す子孫の不可算性
  choice: もし人が…数えられるなら、…も数えられる
  alternative: だれも…数えられないように、…も数えられない
  rationale: 原文の反実的・修辞的な条件表現を否定文へ言い換えず、その緊張と論理構造を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の約束にふさわしい簡潔で格調ある調子と、原文の反復および条件構文を保った。
