reference: Genesis 13:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: ja
  text: ロトは目を上げ、ヨルダンの低地全体を見渡した。[a] それは、ヤハウェがソドムとゴモラを滅ぼす前には、ツォアルの方へ向かうところまで、どこもよく潤っており、ヤハウェの園のようであり、エジプトの地のようであった。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨルダンの低地」は、直訳すると「ヨルダンの円形の地域」。文脈により「ヨルダンの平野」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェの園」は、その豊かな潤いからエデンの園を思い起こさせる表現と考えられる。
    reason: cross_reference
  - marker: c
    text: 「ツォアルの方へ向かうところまで」は、「ツォアルの方へ進むとき」または「ツォアルに近づくにつれて」とも訳せる。原文はツォアルの方向を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: 目を上げ
  rationale: 視線を向けることを表すヘブライ語の慣用句。日本語でも自然で、原文の語り口を保てる。
- source_word: וַיַּרְא
  choice: 見渡した
  rationale: 単純には「見た」だが、広い地域全体を視野に収める文脈に合わせ、自然な日本語として「見渡した」とした。
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: ヨルダン川流域の低地をすべて
  rationale: כִּכָּרは円形の地域、平地、低地を指し得る。地理的意味を明確にしつつ、特定の地形理解に狭めすぎない表現とした。
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: その一帯は……どこもよく潤っており
  rationale: מַשְׁקֶהは水が豊かに供給された状態を表す。「潤っている」は水利と肥沃さを自然に伝える。כִּי以下を、ロトが見た土地の状態として明示した。
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: ヤハウェが……滅ぼす前
  rationale: לִפְנֵיを時間的な「前」、שׁחתを都市への神の破壊行為として直接的に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
- source_word: כְּגַן יְהוָה
  choice: ヤハウェの園のよう
  rationale: 原文の直喩を保ち、エデンを想起させる表現を説明的に限定しなかった。
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地のよう
  rationale: אֶרֶץを訳出し、土地の水の豊かさをめぐる地理的比較を保持した。
- source_word: בֹּאֲכָה צֹעַר
  choice: ツォアルに至るまで
  rationale: ツォアル方向への広がりを示す慣用的な地理表現として自然な日本語にした。原文の方向・接近の含みは注で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が四文字神名を用いているため、称号で代替せず「ヤハウェ」と音写し、固有名としての性格を保った。
- issue: 「ヤハウェの園」が指すもの
  choice: 本文では「ヤハウェの園」とのみ訳す
  alternative: エデンの園
  rationale: エデンを想起させる可能性は高いが、原文はここで「エデン」と明記していないため、本文では同定せず、含意を注記するにとどめた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「目を上げ」は原文の物語的な慣用表現を残し、「見渡した」で広い地域への視線を自然に示した。比較表現の反復を保ちつつ、日本語として読みやすい語順に再構成した。
