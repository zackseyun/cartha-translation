base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: ja
  text: 彼はネゲブから、宿営を移しながらベテルへ、すなわち、最初に自分の天幕があったベテルとアイの間の場所まで進んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 進み
  rationale: 移動経路を述べる旅の文脈に合う自然な表現であり、単なる「行った」より継続的な移動を示す。
- source_word: לְמַסָּעָיו
  choice: 宿営を移しながら
  rationale: מַסָּעは宿営を解いて次の地点へ進む旅程・行程を指す。日本語では、 successive stages の具体像を簡潔に伝えるためこのように訳した。
- source_word: מִנֶּגֶב
  choice: ネゲブから
  rationale: 族長物語の地理的文脈では、方角としての「南」より地域名ネゲブと取るのが適切である。
- source_word: וְעַד בֵּית אֵל
  choice: ベテルまで
  rationale: עַדが示す移動範囲の終点を自然に表す。
- source_word: עַד הַמָּקוֹם
  choice: 場所……に来た
  rationale: 二つ目のעַדは目的地をさらに限定する。日本語の文として自然になるよう、到着を表す述語にまとめた。
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: 自分の天幕を張っていた
  rationale: 直訳的な「天幕があった」より、天幕による宿営を自然に表現する。שָׁםの場所の意味は連体節「場所」に含めた。
- source_word: בַּתְּחִלָּה
  choice: 初めに
  rationale: アブラムの以前の宿営、特に創世記12章8節を指す時間表現を保つ。
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: ベテルとアイの間
  rationale: 二地点の間という位置関係を明確かつ自然に表す。הָעָיの冠詞は日本語の地名表記には反映しない。
