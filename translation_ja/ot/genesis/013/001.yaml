  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: ja
  text: そこでアブラムは、妻と自分に属するすべてのもの、またロトと共に、エジプトからネゲブ[a]へ上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「南へ」。ヘブライ語「ネゲブ」は、ネゲブと呼ばれる南部地方を指すことも、一般に南または南方の地方を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上って行った
  rationale: עלהの基本的な移動表現「上る」を保ちつつ、エジプトから約束の地方面へ向かう聖書的な地理表現を自然な日本語で示す。
- source_word: מִמִּצְרַיִם
  choice: エジプトから
  rationale: 前置詞מןと地名の意味をそのまま明確に訳す。
- source_word: הוּא וְאִשְׁתּוֹ
  choice: 妻と
  rationale: 日本語では主語「アブラム」がすでに明示されるため、独立代名詞הוּאを重ねず、同行者として妻を自然に示す。
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: 自分のすべての持ち物を伴い
  rationale: アブラムに属するもの全体を表す。文脈上は財産を中心とするが、原語の広がりを過度に限定しない「持ち物」とした。
- source_word: וְלוֹט עִמּוֹ
  choice: ロトと一緒に
  rationale: ロトがアブラムに同行したことを、付加的な位置づけも保ちながら自然に表す。
- source_word: הַנֶּגְבָּה
  choice: ネゲブへ
  rationale: 方向を示す語尾を「へ」で表し、ここではカナン南部の地域名として理解する。ただし「南へ」という普通名詞的理解も可能なので脚注に残す。
