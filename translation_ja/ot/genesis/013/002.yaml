source:
  edition: WLC
  text: וְ/אַבְרָ֖ם כָּבֵ֣ד מְאֹ֑ד בַּ/מִּקְנֶ֕ה בַּ/כֶּ֖סֶף וּ/בַ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: ja
  text: アブラムは、家畜、銀、金の点で非常に富んでいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「そして、アブラムは、家畜、銀、金の点で非常に富んでいた」。
    reason: 文頭の וְ を明示的な接続語として訳すこともできる。
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: アブラムは
  rationale: 固有名を慣用的に音写した。文頭の接続詞 וְ は物語の継続を示すが、日本語では主題を示す「は」によって自然に前文との流れが保たれるため、本文では独立した接続語を置かなかった。
- source_word: כָּבֵד מְאֹד
  choice: 非常に富んでいた
  rationale: כָּבֵד は本来「重い」だが、ここでは後続する財産の列挙とともに「富んでいる」という慣用的意味を表す。מְאֹד の強意は「非常に」で示した。
- source_word: בַּ/מִּקְנֶה
  choice: 家畜の点で
  rationale: מִקְנֶה は取得した財産、特に群れをなす飼育動物を指すため、「家畜」とした。前置詞 בְּ は富の分野・内訳を示すものとして、列挙全体にかかる「の点で」に反映した。
- source_word: בַּ/כֶּסֶף וּ/בַ/זָּהָב
  choice: 銀、金の点で
  rationale: כֶּסֶף と זָהָב をそれぞれ「銀」「金」とし、家畜と並ぶ富の内訳として自然な日本語で列挙した。接続詞 וּ は日本語の並列列挙に含めた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、族長物語にふさわしい落ち着いた文体とした。「裕福だった」よりも、富の内訳との結びつきを保ちやすい「富んでいた」を採用した。
