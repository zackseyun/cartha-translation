  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: ja
  text: そこでアブラムはロトに言った。「どうか、私とあなたとの間にも、私の牧夫たちとあなたの牧夫たちとの間にも、争いがないようにしよう。私たちは身内同士なのだから[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私たちは兄弟である男たちなのだから」。ここで「兄弟」は、同じ両親から生まれた兄弟に限らず、広く親族を指す。
    reason: 原語の字義（「男たち」「兄弟」）と、「兄弟」の広い親族的用法を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこでアブラムは……言った
  rationale: ワウ継続法による物語の進行を、現代日本語で自然な「そこで」によって示した。直前の状況を受けた発言であることも伝わる。
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: どうか……争いがないようにしよう
  rationale: אַלと指意形が表す否定的な願い・要請、およびנָאの丁重さを「どうか」で表した。「しよう」は、アブラムがロトと共に争いを避けようと呼びかける自然な日本語である。
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: 私とあなたとの間にも
  rationale: ヘブライ語の「私とあなたとの間」という対句的構造を保ち、後続する牧夫同士の関係との並行を「にも」で明確にした。
- source_word: רֹעַי ... רֹעֶיךָ
  choice: 私の牧夫たち……あなたの牧夫たち
  rationale: רעהの分詞は家畜を飼う者を指す。羊だけに限定せず、当時の家畜群を世話する者という文脈に合う「牧夫」を選んだ。
- source_word: כִּי
  choice: なのだから
  rationale: 争いを避けるべき理由を導く説明・根拠の働きを、自然な日本語の理由表現で示した。
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: 私たちは身内同士なのだから
  rationale: אַחִיםは字義的には「兄弟」だが、ここでは叔父アブラムと甥ロトの広い親族関係を指す。「身内同士」はその意味と、親族なのだから争うべきでないという訴えを自然に伝える。אֲנָשִׁיםを逐語的に「男たち」と加えると日本語では不自然で、句全体が表す親族関係を損なうため、慣用的にまとめた。
theological_decisions:
- issue: アブラムとロトについて用いられたאַחִיםの範囲
  choice: 本文では「身内同士」とし、広い親族関係を表した
  alternative: 「兄弟」または「近親者同士」
  rationale: ロトはアブラムの実の兄弟ではなく甥である。ヘブライ語の「兄弟」はより広い血縁者を指し得るため、関係を誤解させない自然な訳を本文に置き、原語の比喩的・修辞的な「兄弟」は脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、アブラムの丁重で和解的な訴えにふさわしい落ち着いた語調とした。「家畜を飼う者」より簡潔で文脈に合う「牧夫」を採用し、「身内同士」によって普通の読者にも親族関係が直ちに伝わるようにした。
