source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: ja
  text: 立って、この地を縦にも横にも歩き回りなさい。[a] わたしがあなたにこの地を与えるからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「この地を、その長さとその幅にわたって歩き回りなさい」。
    reason: ヘブライ語の空間表現を示し、「縦にも横にも」が土地の全域を意味することを明らかにするため。
lexical_decisions:
- source_word: ק֚וּם
  choice: 立って
  rationale: קוםの命令形を直接的に表し、後続する命令「歩き回りなさい」へ自然につなげる。
- source_word: הִתְהַלֵּ֣ךְ
  choice: 歩き回りなさい
  rationale: הלךのヒトパエル命令形が表す、土地の中を広く歩いて巡る動作を自然な現代日本語で示す。
- source_word: בָּאָרֶץ
  choice: この地を
  rationale: 文脈上、一般的な「地」や「世界」ではなく、アブラムの前に示された特定の土地を指す。日本語では移動範囲を示す助詞「を」が自然である。
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: 縦にも横にも
  rationale: 直訳的には「その長さとその幅にわたって」。土地の全域を巡ることを表す対句を、簡潔で分かりやすい日本語にした。
- source_word: כִּ֥י
  choice: からだ
  rationale: 先の命令の理由を導く接続関係を明確に表す。
- source_word: לְךָ֖ אֶתְּנֶֽנָּה
  choice: わたしがあなたにこの地を与える
  rationale: 一人称単数の主語と二人称単数の受領者を明示し、女性単数接尾辞の指示対象である「この地」を日本語で補って明瞭にした。未完了形は文脈上の約束として表現する。
theological_decisions:
- issue: אֶתְּנֶנָּהの女性単数接尾辞の指示対象
  choice: 「この地」を指すものとして本文に明示する
  alternative: 代名詞的に「それを」と訳す
  rationale: 女性単数接尾辞は直前の女性名詞אֶרֶץを自然に受ける。日本語では「それ」より「この地」と反復する方が、約束の内容を明瞭にしつつ解釈を付加しない。
translation_notes:
  register: 神の直接命令として簡潔で dignified な調子を保ちつつ、現代の一般読者に自然な表現とした。「縦にも横にも」は原文の「長さ」と「幅」の対句を保つ慣用的な訳である。
