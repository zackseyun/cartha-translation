translation:
  language: ja
  text: アブラムと一緒に旅をしていたロトも、羊ややぎなどの群れ[a]、牛の群れ、天幕を持っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊ややぎなどの群れ」に当たるヘブライ語は、特に羊とやぎを中心とする小家畜を広く指す。「牛の群れ」に当たる語は、牛類の家畜を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: も
  rationale: 接続詞と付加を表す副詞の組み合わせを、前節とのつながりを保ちつつ、ロトにも財産があったことを示す自然な日本語の「も」で表した。
- source_word: לְלוֹט ... הָיָה
  choice: ロトも…持っていた
  rationale: 所有者を示す前置詞を伴う存在構文であり、直訳的な「ロトに…があった」より、現代日本語で自然な所有表現とした。
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: アブラムと一緒に旅をしていた
  rationale: 分詞が、アブラムに同行していたロトを説明している。継続的な同行の意味が伝わるよう「旅をしていた」とした。
- source_word: צֹאן
  choice: 羊ややぎの群れ
  rationale: 羊とやぎを中心とする小家畜を広く指す語なので、普通の読者に具体的な範囲が伝わる表現を選んだ。
- source_word: וּבָקָר
  choice: 牛の群れ
  rationale: 牛類の家畜を指す集合語であり、צֹאןとの並行性も保てる。
- source_word: וְאֹהָלִים
  choice: それに天幕
  rationale: 複数の幕屋を指す。家畜との列挙を自然につなぎ、聖書時代の移動式住居として明確な「天幕」を用いた。
