  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: ja
  text: ロトはヨルダンの低地全域を自分のために選び、東へ[a]旅立った。こうして二人は互いに別れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「東から」。ヘブライ語の表現は、進んだ方向とも出発点とも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ לוֹט
  choice: ロトは…自分のために選び
  rationale: בחרの「選ぶ」と与格לוֹの自己利益・自己選択の含みを、自然な日本語で明示した。
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: ヨルダン川流域の低地をことごとく
  rationale: כִּכָּרはこの地理的文脈ではヨルダン周辺の平坦な地域を指す。「低地」に「流域」を添えて現代日本語で場所を明確にし、כָּלは「ことごとく」で保持した。
- source_word: וַיִּסַּע
  choice: 旅立った
  rationale: נסעは宿営を畳んで移動を始めることを表す。文脈に自然で、単なる歩行以上の移住的な出発を伝える。
- source_word: מִקֶּדֶם
  choice: 東へ
  rationale: 文脈上もっとも自然な方向表現として採用した。ただし形態上は起点を示す「東から」も可能なので脚注に残した。
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  choice: 二人は互いに別れた
  rationale: Nifal形の相互的な分離と、分配的表現「人がその兄弟から」の意味を、明瞭で自然な日本語にした。アブラムとロトの二人を指すため「二人」とした。
theological_decisions:
- issue: מִקֶּדֶםの方向・起点の曖昧さ
  choice: 東へ
  alternative: 東から
  rationale: 物語の地理的流れには「東へ」がよく合うが、ヘブライ語の前置詞מִןは起点としても読めるため、別訳を脚注で明示した。
- issue: אִישׁ מֵעַל אָחִיוの親族語
  choice: 二人は互いに別れた
  alternative: それぞれ兄弟から離れた
  rationale: אָחִיוは親族関係を背景に持つが、句全体は相互分離を表す慣用的・分配的表現である。日本語本文では不自然な「兄弟」を避けつつ相互性を保持した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある物語文。「低地」で地形を示し、「ことごとく」で全域を選んだことを表した。脚注記号[a]は曖昧な語句の直後に置いた。
