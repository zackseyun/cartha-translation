id: GEN.13.14
reference: Genesis 13:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: ja
  text: ロトがアブラムと別れた後、ヤハウェ[a]はアブラムに言われた。「さあ、目を上げ、あなたがいるその場所から、北の方、南の方、東の方、西の方を見なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語で記された神の固有名。伝統的に「主」とも訳される。
    reason: 神名יהוהの表記と伝統的な訳語を説明するため。
lexical_decisions:
- source_word: וַיהוָה
  choice: ヤハウェは
  rationale: 接続詞וַは日本語の自然な物語の流れでは明示せず、神の固有名יהוהを「ヤハウェ」と音写した。
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: ロトがアブラムと別れた後
  rationale: אַחֲרֵיと不定詞構文の時間関係を「後」で表し、נפרד מןの離別を自然な日本語の「～と別れる」とした。代名詞の指示対象は明白にするため「アブラム」とした。
- source_word: שָׂא נָא עֵינֶיךָ
  choice: さあ、目を上げ
  rationale: שָׂאの命令と「目を上げる」という原文の身体的表現を保ち、נָאの促しを文脈に合う「さあ」で表した。
- source_word: וּרְאֵה
  choice: 見なさい
  rationale: ראהの命令を直接的に訳した。「見渡しなさい」も可能だが、原語以上の広がりを加えないため「見なさい」とした。
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: あなたがいるその場所から
  rationale: アブラムの現在地が眺望の起点であることを、過不足のない現代日本語で表した。
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: 北の方、南の方、東の方、西の方を
  rationale: 方向を示す-הの働きを「～の方」で表し、原文の順序を保った。接続詞の反復は、日本語では読点による列挙が自然なため反復しなかった。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名יהוהを用いているため、その固有名としての性質を保つ音写を本文に採用した。日本語聖書で伝統的な「主」は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神の発話は威圧的になりすぎない命令表現とし、原文の方向の列挙と視点を保持した。
