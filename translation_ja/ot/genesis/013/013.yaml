source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: ja
  text: ソドムの男たちは、ヤハウェに対して非常に悪く、罪深い者たちだった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェの前で非常に悪く、罪深い者たちだった」。
    reason: לַיהוָה は、ヤハウェに対する罪を表すとも、ヤハウェの前で、すなわちその目に悪く罪深いことを表すとも理解できるため。
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: ソドムの男たちは
  rationale: אַנְשֵׁי は אִישׁ の構成形複数で、ここではソドムの男性住民を指す。「男たち」として性別を明示し、文頭の וְ は日本語の自然な叙述では訳出しない。
- source_word: רָעִים
  choice: 悪く
  rationale: 道徳的な悪を表す述語であり、並列される「罪深かった」と自然につながる形にした。
- source_word: וְ/חַטָּאִים
  choice: 罪深かった
  rationale: רָעִים と並ぶ複数の述語的表現で、彼らが罪を特徴としていたことを表す。「罪人だった」よりも形容的な構文を保つ。
- source_word: לַ/יהוָה
  choice: ヤハウェに対して
  rationale: חַטָּאִים とともに、罪がヤハウェへの背きであることを示す。ただし「ヤハウェの前で」という解釈も可能なため脚注に残す。神名 יהוה は固有名として「ヤハウェ」とする。
- source_word: מְאֹד
  choice: 甚だしく
  rationale: 述語を強く修飾する語であり、原文の強調と荘重さを保つ。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の四文字神名を固有名として明示し、一般名詞的な称号へ置き換えない。
- issue: חַטָּאִים לַיהוָה における ל の意味
  choice: ヤハウェに対して罪深かった
  alternative: ヤハウェの前で罪深かった
  rationale: 罪がヤハウェに対するものであるという関係的・道徳的な意味を本文に採る一方、「その御前で／その目に」という場所的・評価的な解釈も原語上可能なので脚注で保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「甚だしく」で原文の強い程度表現と聖書本文にふさわしい品位を保った。形容述語の並列を日本語として自然に整え、原文の道徳的な重みを維持した。
