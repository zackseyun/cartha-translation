source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: ja
  text: なぜなら、あなたが見ている土地をすべて、わたしはあなたに、またあなたの子孫[a]に、永遠に与えるからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたの種」。ヘブライ語 זֶרַע（ゼラ）は集合名詞で、「種」「子孫」「後代」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （独立した接続語としては訳出しない）
  rationale: 前節の命令を受けて約束の根拠・内容を導く語だが、この一節だけの自然な現代日本語では、文脈上のつながりを語順で十分に表せる。「なぜなら」は因果関係を強くしすぎる。
- source_word: כָּל הָאָרֶץ
  choice: 土地をすべて
  rationale: 目に入る土地の全体を指す。日本語では関係節の後に「土地をすべて」と置くことで、包括性を自然に示せる。
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: あなたが見渡している
  rationale: 分詞の継続的な情景を表し、直前に四方を眺めるよう命じられた文脈にも適合する。「見ている」より土地の広がりが自然に伝わる。
- source_word: לְךָ אֶתְּנֶנָּה
  choice: わたしはあなたに……与える
  rationale: לְךָは受領者を示し、未完了形はここでは将来の約束を表す。日本語ではもう一方の受領者とまとめて「あなたと……に」とした。
- source_word: וּלְזַרְעֲךָ
  choice: あなたの子孫[a]に
  rationale: זֶרַעは集合的に後代を指し得る。現代日本語の「子孫」は自然で明瞭だが、原語の「種」という像と集合名詞としての幅は脚注に残す。
- source_word: עַד עוֹלָם
  choice: とこしえに
  rationale: 永続的・無期限の継続を荘重かつ自然に表す。土地の約束がどのように成就するかについて、特定の神学体系を訳文に持ち込まない。
theological_decisions:
- issue: 土地の約束における עַד עוֹלָם の期間
  choice: とこしえに
  alternative: いつまでも／永遠に
  rationale: 原文の永続的、または期限を定めない時間的重みを保つ。約束の歴史的・終末論的な解釈は訳語で限定せず、本文の緊張をそのまま残す。
- issue: זֶרַע の集合性と単数的な形
  choice: 子孫（脚注で「種」も明示）
  alternative: 種／末裔
  rationale: 「子孫」は単数・複数を訳文で過度に確定せず、集合的な後代を自然に表せる。原語の語像と解釈上の幅は脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の約束にふさわしい品位を「とこしえに」で保った。「見渡している」は直前の眺望の文脈を自然に反映する。脚注標識[a]は本文中に明示した。
