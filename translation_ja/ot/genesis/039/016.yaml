  yaml_path: translation/ot/genesis/039/016.yaml
  text: So she kept his garment beside her until his master came home.
translation:
  language: ja
  text: 彼女は、主人が家に帰って来るまで、ヨセフの衣服を自分のそばに置いておいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: 置いておいた
  rationale: 語根 נוח のヒフィル形は「置く、そこにとどめておく」を表す。文脈上、衣を証拠として手元に保っていた継続性も自然に伝える。
- source_word: בִּגְדוֹ
  choice: ヨセフの上着
  rationale: בֶּגֶד は広く「衣、衣服」を意味するが、直前の文脈でヨセフから取った衣を指すため、指示対象を明確にして「ヨセフの上着」とした。
- source_word: אֶצְלָהּ
  choice: 自分のそばに
  rationale: 前置詞 אֵצֶל と三人称女性単数接尾辞を素直に反映し、「彼女の手元に」よりも空間的意味を保った。
- source_word: עַד בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ
  choice: 主人が家に帰って来るまで
  rationale: 字義的には「彼の主人が彼の家に来るまで」。日本語では所有関係が文脈上明白なので「主人」とし、אֶל־בֵּיתוֹ は自然な帰宅表現で訳した。
