id: GEN.39.2
reference: Genesis 39:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: ja
  text: ヤハウェはヨセフと共におられた。ヨセフは成功を収める人[a]となり、エジプト人である主人の家にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「栄える人」。ヘブライ語の分詞は、物事が順調に進むこと、または成功することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、現代日本語で一般的な音写によって示した。
- source_word: אֶת יוֹסֵף
  choice: ヨセフと共に
  rationale: 神の臨在と好意を表す「～と共にいる」というヘブライ語の慣用的表現を、そのまま自然な日本語にした。
- source_word: אִישׁ מַצְלִיחַ
  choice: 成功を収める人
  rationale: מַצְלִיחַ は「成功する、栄える」を表す分詞であり、金銭的繁栄だけに限定せず、ヨセフの行うことがうまく進む意味を伝える。אִישׁ はここでは男性であるヨセフを指すため「人」とした。
- source_word: בְּבֵית אֲדֹנָיו
  choice: 主人の家に
  rationale: 家または家政全体を指し得るが、物語の具体的な場所を保つ簡潔な訳とした。
- source_word: הַמִּצְרִי
  choice: エジプト人である
  rationale: 主人がエジプト人であることを明示する同格的・形容詞的な語を、誤解のない自然な日本語にした。
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: おられた。…となり、…いた
  rationale: 反復される物語叙述の流れを保ちつつ、日本語として単調かつ不自然にならないよう、各節の主語と意味に応じて訳し分けた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が称号ではなく神の固有名を用いているため、その区別を保つ音写を採用した。
- issue: ヨセフの成功と神の臨在との関係
  choice: 二つの文を並べ、因果を明示する接続語は補わない
  alternative: 「そのため」を加えて成功を神の臨在の結果として明示する
  rationale: 文脈上は密接な関係が示唆されるが、ヘブライ語本文には明示的な因果接続詞がないため、訳文で関係を限定しすぎないようにした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「おられた」は神を主語とする文として自然な敬意を示すが、過度に古風な表現は避けた。脚注記号は該当する「成功を収める人」の直後に置いた。
