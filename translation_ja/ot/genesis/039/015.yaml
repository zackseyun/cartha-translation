  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: ja
  text: 彼は、私が声を上げて叫んだ[a]のを聞くと、自分の衣を私のそばに[b]残して、逃げて外へ出て行きました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が声を上げて呼んだのを聞くと」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私のもとに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: そして彼は、…聞くと
  rationale: וַיְהִיを伴う時間節を、物語の流れを保ちながら自然な現代日本語の「聞くと」で表した。
- source_word: כִּי
  choice: …のを
  rationale: 彼が聞いた内容を導く接続詞として理解し、日本語では内容を示す「…のを」で自然に表した。
- source_word: הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: 私が声を上げて叫んだ
  rationale: 「声を上げる」というヘブライ語の慣用表現を保ち、קראの切迫した発声を「叫んだ」とした。呼びかけとも取れる余地は脚注に示した。
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: 自分の衣を…残し
  rationale: בגדの単数形に対応して「衣」とし、עָזַבはこの場面で自然な「残す」と訳した。
- source_word: אֶצְלִי
  choice: 私のそばに
  rationale: 話者との近接を明確に表す訳。より広く「私のもとに」とも訳せるため脚注に示した。
- source_word: וַיָּנָס
  choice: 逃げて
  rationale: נוּסが示す急な逃走を簡潔に表した。
- source_word: וַיֵּצֵא הַחוּצָה
  choice: 外へ出て行った
  rationale: 方向を示すהַחוּצָהを「外へ」と明示し、移動を自然な日本語で表した。
