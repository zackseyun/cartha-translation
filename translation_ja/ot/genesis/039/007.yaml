  text: And after these things[a], his master's wife cast her eyes on Joseph and said, “Lie with me.”
translation:
  language: ja
  text: これらの出来事の後、主人の妻はヨセフに目を留め[a]、「私と寝なさい」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヨセフに向かって目を上げた」。ここでは、ヨセフに欲望を伴う強い関心を向けたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: これらの出来事の後
  rationale: 物語の次の展開を導く表現。「これらの事の後」より自然な現代日本語としつつ、ヘブライ語の指示表現と時間的順序を保った。
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: 目を留め
  rationale: 字義は「目を上げて…に向けた」。ここでは単なる一瞥ではなく、相手に強い関心を向けたことを表す。「目をつけた」ほど否定的意味を付加せず、文脈上の欲望を次の発言に語らせた。
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: 主人の妻
  rationale: ヨセフの主人との関係によって女性を特定する連語。直前の文脈で主人がヨセフの主人であることは明瞭なので、自然な日本語にした。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: שִׁכְבָה עִמִּי
  choice: 私と寝なさい
  rationale: 命令形による直接的な性的誘い。「床を共にしなさい」より現代的で、「一緒に寝て」より命令の強さと簡潔さを保つ。
