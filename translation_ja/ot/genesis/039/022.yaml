  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Joseph’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: ja
  text: 牢獄の長は、牢獄にいる囚人を皆ヨセフに任せた。[a] そこで行われることはすべて、ヨセフが取り仕切っていた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヨセフの手に渡した」。これは、ヨセフの管理と権限のもとに委ねたという意味のヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「そこでなされることはすべて、彼が行っていた」。原文はヨセフを強調し、牢獄内の働きに継続して責任を負っていたことを表す。
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: 牢獄の長
  rationale: שַׂר は責任者・長を表す。この文脈では牢獄を管理する役人を指すため、明瞭で原文にも近い「牢獄の長」とした。
- source_word: בְּיַד יוֹסֵף
  choice: ヨセフに任せた
  rationale: 直訳は「ヨセフの手に」だが、人をその管理と権限のもとに委ねるというヘブライ語の慣用表現なので、自然な日本語で意味を明示した。原文の比喩は脚注に残した。
- source_word: כָּל הָאֲסִירִם
  choice: 囚人を皆
  rationale: אֲסִירִים は拘束・収監されている者を指す。牢獄という文脈に即して、現代日本語で明快な「囚人」とした。
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: そこで行われることはすべて
  rationale: עֹשִׂים は不特定の複数主体による行為を表し、日本語では受け身にすると主体を不必要に限定せず自然に表現できる。
- source_word: הוּא הָיָה עֹשֶׂה
  choice: ヨセフが取り仕切っていた
  rationale: 明示された הוּא の強調と、היה＋分詞の継続的・常態的な意味を反映した。「取り仕切る」は、ヨセフ自身があらゆる作業を一人で実行したというより、牢獄内の働き全般を実際に担い、監督していたという文脈上の意味を自然に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「牢獄」を反復して原文の語彙的結び付きを保ちつつ、慣用句は本文で自然に訳し、原文の比喩を脚注に示した。後半はヨセフの継続的な実務上の責任を表しつつ、彼が全作業を文字どおり単独で行ったと断定しない表現にした。
