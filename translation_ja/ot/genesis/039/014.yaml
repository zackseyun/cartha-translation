  to: 彼女は家の男たちを呼び、こう言った。「見なさい。あの人は、私たちをあざけるために、ヘブライ人の男を私たちのところへ連れて来ました[a]。その男は私と寝るために、私のところへ来ました。そして私は大声で叫びました。」
  rationale: 主文のלְצַחֶק בָּנוּを「あざける」として、その基本的で広い語義を保った。性的な含みは、文脈上の可能性として脚注にとどめた。「寝るために」は来訪の目的を表す原文の不定詞に対応する。「そして」により接続詞を過剰に因果化せず、発話の連続を保った。
