base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: ja
  text: 彼女は家の男たちを呼び、こう言った。「見なさい。あの人は、私たちをあざけるために、ヘブライ人の男を私たちのところへ連れて来ました[a]。その男は私と寝るために、私のところへ来ました。そして私は大声で叫びました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちを笑いものにするために」または「私たちを辱めるために」とも訳せる。原語は笑うこと、あざけること、相手を笑いものにすることを表す。この非難では、性的な辱めの含みもあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: 彼女は家の男たちを呼び
  rationale: אַנְשֵׁי の男性複数を「男たち」と明示し、בֵיתָהּ は文脈上、家に属する者たちを指すが、日本語では簡潔で自然な「家の男たち」とした。
- source_word: רְאוּ
  choice: 見なさい
  rationale: 相手の注意を強く引く命令形を、現代日本語の直接的な呼びかけで表した。
- source_word: הֵבִיא לָנוּ
  choice: あの人は…私たちのところへ連れて来ました
  rationale: 使役形の「連れて来る」と לָנוּ の共同体への訴えを保持した。主語は原文では明示されず文脈から夫を指すため、固有の解釈を加える「主人」ではなく「あの人」とした。
- source_word: אִישׁ עִבְרִי
  choice: ヘブライ人の男
  rationale: 民族的呼称と אִישׁ の男性であることの双方を保ち、妻の非難めいた言い方を再現した。
- source_word: לְצַחֶק בָּנוּ
  choice: 私たちをもてあそぶために
  rationale: צחק がここで含み得る嘲弄、弄び、性的な辱めを一義的に狭めずに表せる語を選んだ。
- source_word: בָּא אֵלַי לִשְׁכַּב עִמִּי
  choice: その男は私と寝ようとして、私のところへ来ました
  rationale: 「共に寝る」という性交を表すヘブライ語の婉曲表現を、明瞭で過度に露骨でない現代日本語にした。
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: それで私は大声で叫びました
  rationale: 接続を物語上の結果として自然に示し、「大きな声で叫ぶ」という原文の意味を簡潔に保った。
