  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: ja
  text: そして彼女は、ヨセフが自分の衣服を彼女の手に残して外へ逃げたのを見ると、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָהּ
  choice: 彼女は……のを見ると
  rationale: וַיְהִיは物語を進める接続表現であり、続く時間節と合わせて、現代日本語では「彼女は……のを見ると」とすることで、出来事の推移と時間関係を自然に示せる。
- source_word: כִּי
  choice: ……のを
  rationale: ここでは彼女が見た内容を導くため、日本語では内容を表す「のを」で自然に表現した。
- source_word: עָזַב
  choice: 残して
  rationale: この文脈では「置き去りにする、残す」の意味。衣服が彼女の手元に残ったという具体的状況を明瞭に示す。
- source_word: בִּגְדוֹ
  choice: 上着
  rationale: בֶּגֶדは衣服一般を指し得る語だが、この場面では身につけていた一着を指す。「上着」は自然で具体的だが、ヘブライ語自体は衣服の種類を限定しないため脚注を付した。
- source_word: בְּיָדָהּ
  choice: 自分の手に
  rationale: 女性を主語とする日本語の従属節内で、三人称女性単数接尾辞を「自分の」と訳し、衣服が彼女の手にあったという具体的な描写を保った。
- source_word: וַיָּנָס
  choice: 逃げた
  rationale: נוּסの切迫した逃走の意味を、簡潔で自然な「逃げた」で表した。
- source_word: הַחוּצָה
  choice: 外へ
  rationale: 方向を示す語尾を含むため、単なる場所の「外で」ではなく、移動方向を明示する「外へ」とした。
