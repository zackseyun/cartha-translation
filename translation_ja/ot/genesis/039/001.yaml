source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: ja
  text: ヨセフはエジプトへ連れて行かれた。ファラオの廷臣[a]で護衛隊長を務めるエジプト人ポティファルが、ヨセフをエジプトへ連れて行ったイシュマエル人たちから買った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「廷臣」と訳したヘブライ語は、「宦官」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: 連れて行かれた
  rationale: ירדのホファル形が示す使役受動を、自然な現代日本語の受動表現で示した。ヘブライ語には「下る」という方向感覚があるが、「エジプトへ連れ下られた」は不自然なため、目的地への移送を明確にした。
- source_word: מִצְרָיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾を「へ」で表し、エジプトが移動先であることを明確にした。
- source_word: וַיִּקְנֵהוּ
  choice: 彼を買い取った
  rationale: 奴隷取引の文脈におけるקנהの売買上の意味を、平明かつ明確に表した。
- source_word: סְרִיס פַּרְעֹה
  choice: ファラオの廷臣
  rationale: סְרִיסは宦官とも宮廷の役人とも解し得る。この箇所では役職を示す広い意味を本文に採り、字義的な別解は脚注に残した。
- source_word: שַׂר הַטַּבָּחִים
  choice: 護衛隊長
  rationale: 王の護衛や刑の執行に関わる部隊の長を指す可能性がある称号として、過度に限定せず理解しやすい表現を選んだ。
- source_word: אִישׁ מִצְרִי
  choice: エジプト人
  rationale: אִישׁを伴う民族呼称を、日本語として自然な「エジプト人」で表した。ポティファルが男性であることは文脈上明らかであり、「一人のエジプト人男性」とする必要はない。
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: イシュマエル人たちから
  rationale: 「手から」を字義どおり再現せず、購入元を示す日本語の自然な助詞「から」で慣用的意味を表した。
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: ヨセフをそこへ連れて来た
  rationale: 関係節の主語がイシュマエル人たちであり、「そこ」がエジプトを指すことを自然な日本語で示した。日本語の視点では到着地への移送を「連れて来た」と表すのが自然である。
theological_decisions:
- issue: ポティファルに付されたסְרִיסの意味
  choice: 本文では「廷臣」とした
  alternative: 「宦官」
  rationale: この語は身体的な意味での宦官と宮廷の高官の両方を表し得る。物語自体はどちらか一方を確定させないため、本文にはより広い官職上の意味を置き、別解を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語とした。ヘブライ語の長い一文は日本語で読みやすいよう二文に分けたが、移送、ポティファルの肩書と出自、購入元という情報関係は保持した。冒頭の接続詞וְは物語の連続を担うが、独立した「さて」「今や」に相当する語ではないため、不要な談話標識を加えなかった。
