revisions:
- from: ヨセフはエジプトへ連れて行かれた。ファラオの廷臣[a]で護衛隊長を務めるエジプト人ポティファルが、ヨセフをそこへ連れて来たイシュマエル人たちから彼を買い取った。
  to: ヨセフはエジプトへ連れて行かれた。ファラオの廷臣[a]で護衛隊長を務めるエジプト人ポティファルが、ヨセフをエジプトへ連れて行ったイシュマエル人たちから買った。
  rationale: 関係節の移動動詞を「連れて来た」から「エジプトへ連れて行った」に改め、原文の目的地と方向性を、日本語の叙述視点を不必要に加えずに表した。あわせて、購入の目的語の重複を解消し、「買った」にして原語קנהの直接的な売買の意味を平明に保った。脚注はסריסの実質的な語義の曖昧さを適切に保持しているため維持した。
