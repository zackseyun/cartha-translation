  terminology: 「廷臣」はסריסの官職的用法を反映し、脚注で「宦官」の可能性を保持しているため適切である。「護衛隊長」はשׂר הטבחיםの慣用的・非限定的な訳として許容できる。「エジプト人」はאיש מצריの自然な日本語訳である。
