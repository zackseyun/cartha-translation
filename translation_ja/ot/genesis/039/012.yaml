  terminology: 「服」はבֶּגֶדの一般性を適切に保つ。「上着」「衣」という代替可能性を注記したことも妥当である。脚注bは「寝なさい」の性的含意と逐語的な表現を適切に説明している。人名「ヨセフ」の補足は文脈上明確であり、意味を付加していない。
