  source_fidelity: ヘブライ語の動作連鎖を忠実に反映している。「ヨセフの服をつかみ」は、בְּבִגְדוֹ（彼の衣服をつかんで／衣服によって彼をつかんで）の自然な日本語表現である。「服を彼女の手に残したまま逃げ、外へ出た」も、衣服を彼女の手中に残して逃走し、外へ出たことを正確に伝える。
