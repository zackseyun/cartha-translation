source:
  edition: WLC
  text: וַ/תִּתְפְּשֵׂ֧/הוּ בְּ/בִגְד֛/וֹ לֵ/אמֹ֖ר שִׁכְבָ֣/ה עִמִּ֑/י וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ בְּ/יָדָ֔/הּ וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: ja
  text: 彼女はヨセフの服[a]をつかみ、「私と寝なさい[b]」と言った。しかしヨセフは、服を彼女の手に残したまま逃げ、外へ出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「服」は「上着」や「衣」とも訳せる。ヘブライ語は衣服一般を指す語。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「私と横になりなさい」。ここでは性交を求める婉曲表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: 彼女はヨセフを…つかみ
  rationale: תפשׂはしっかりと捕らえる動作を表す。日本語では、何をつかんだかを示す「服を」と組み合わせ、「彼女はヨセフの服をつかみ」とするのが自然である。代名詞だけでは指示対象が曖昧になりやすいため、文脈上の人物名「ヨセフ」を補った。
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: ヨセフの服／服
  rationale: בגדは特定の衣服の種類に限定されない一般的な語なので、「上着」や「外套」と狭めず「服」とした。
- source_word: לֵאמֹר
  choice: 「…」と言った
  rationale: 直接話法を導く不定詞である。逐語的な「言って」より、現代日本語の物語として自然な「と言った」とした。
- source_word: שִׁכְבָה עִמִּי
  choice: 私と寝なさい
  rationale: שׁכב עםはここで性交を求める婉曲表現。「寝なさい」は日本語でも同様の含意を保ち、命令形の力も伝える。
- source_word: וַיַּעֲזֹב
  choice: 残したまま
  rationale: עזבは「残す、置いて去る」の意。衣服が彼女の手に留まった状態で逃げたという動作の関係を、自然な日本語で表した。
- source_word: בְּיָדָהּ
  choice: 彼女の手に
  rationale: ידの具体的な意味「手」を保ち、衣服が実際に彼女の手中にあったことを示す。
- source_word: וַיָּנָס
  choice: 逃げ
  rationale: נוסが表す切迫した逃走を、簡潔な「逃げ」で表現した。
- source_word: וַיֵּצֵא הַחוּצָה
  choice: 外へ出た
  rationale: יצאと方向を示すהחוצהを、自然かつ明確な現代日本語で表した。
theological_decisions: []
