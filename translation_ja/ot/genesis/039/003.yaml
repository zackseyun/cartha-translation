  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: ja
  text: 主人は、ヤハウェが彼と共におられ、彼がすることすべてをヤハウェが成功させておられるのを見た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の手において」。この句は、彼の手を通して、または彼の管理・活動のもとで、という含意を持ちうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見た
  rationale: 物語を進める基本的な動詞として、主人が状況を目の当たりにして認識したことを簡潔に表す。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: ポティファルとヨセフの主人・僕という社会的関係を、現代日本語で自然かつ明確に示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。原文で二度用いられているため、訳文でも二度明記した。
- source_word: אִתּוֹ
  choice: 彼と共におられ
  rationale: ヨセフに伴う神の臨在を表す。神を主語とするため、現代日本語として自然な敬意を示す表現にした。
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: 彼のすることすべて
  rationale: 行為の包括的な範囲を保ちつつ、継続的・一般的な内容にも対応できる日本語にした。
- source_word: מַצְלִיחַ
  choice: 成功させておられる
  rationale: ヒフィル形の使役的意味と、成功をもたらす主体がヤハウェであることを明示する。
- source_word: בְּיָדוֹ
  choice: 彼の手のうちで
  rationale: 字義的な「彼の手に／手のうちで」という具体的表現を残し、手段・管理・活動領域のどれか一つに限定しない。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号に置き換えずに示す。
- issue: בְּיָדוֹ の意味範囲
  choice: 本文では「彼の手のうちで」とし、注で幅を示す
  alternative: 彼の手を通して、彼の指揮のもとで
  rationale: この句には手段、管理、活動領域という重なり合う含意があり、一つに決め切らず原文の具体的な比喩と曖昧さを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の単純な物語調を維持し、神名の反復と「手」の具体的表現を残した。
