  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: ja
  text: そこで彼女は夫に、次のように語った。「あなたが私たちのところに連れて来たあのヘブライ人の奴隷が、私を笑いものにしようとして、私のところへ来ました[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私をもてあそぶために」とも訳せる。ここでは、性的に辱めようとすること、あるいは乱暴を加えることを含意する可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: そこで彼女は夫に語った
  rationale: 物語を進める wayyiqtol を「そこで」で表し、אֵלָיו の指示対象は文脈上の夫であることを、日本語で曖昧にならないよう明示した。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 同じような言葉で
  rationale: 比較の כ と複数形「言葉」を保ちつつ、続く発言内容を導く自然な日本語とした。
- source_word: הָעֶבֶד הָעִבְרִי
  choice: あのヘブライ人の奴隷
  rationale: עבד が示す隷属身分を弱めず「奴隷」とし、定冠詞を伴う侮蔑的・告発的な言い方を「あの」で表した。
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: あなたが私たちのところに連れて来た
  rationale: 夫への非難を帯びた二人称と、一人称複数 לָּנוּ をそのまま保持した。
- source_word: בָּא אֵלַי
  choice: 私に近寄って来ました
  rationale: 彼女への接近を表す בוא＋אל を自然に訳しつつ、それ自体を性的婉曲表現と断定しないようにした。
- source_word: לְצַחֶק בִּי
  choice: 私をもてあそぶために
  rationale: צחק の嘲弄・弄びという幅と、この場面で含み得る性的または虐待的なニュアンスを、過度に限定せず表した。別訳の可能性は脚注に示す。
