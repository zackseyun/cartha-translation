source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: ja
  text: しかし、ヤハウェはヨセフと共にいて、彼に変わらぬ愛[a]を示し、ヨセフが監獄の長[b]から好意を得られるようにされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慈しみ」「誠実な愛」または「恵み」とも訳せる。ヘブライ語 חָסֶד は、忠実で変わることのない愛や好意を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「監獄の家の長」。すなわち、監獄を管理する責任者。
    reason: source_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を日本語で一般的な形に音写した。
- source_word: וַיְהִי ... אֶת
  choice: 共にいて
  rationale: 人物に寄り添う存在・同伴を表す定型表現として、自然な日本語にした。
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: 彼に変わらぬ愛を示し
  rationale: נָטָה の字義的な『伸ばす・傾ける』よりも、この句全体が表す行為を自然に訳した。חָסֶד の忠実で持続的な好意を保ちつつ、直近の文脈に明記されていない契約を本文へ補わない表現とした。
- source_word: חִנּוֹ בְּעֵינֵי
  choice: 目にかなう者とされた
  rationale: 直訳は『彼の好意を……の目に与えた』だが、他者から好意的に受け入れられることを表すヘブライ語の慣用句として明瞭な日本語にした。
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: 監獄の長
  rationale: 役職名を推測して『典獄』などに限定せず、『監獄を統率する者』という構成語の意味を簡潔に保った。
- source_word: וַ
  choice: しかし
  rationale: 前節までの投獄という境遇と、ヤハウェが共にいたこととの対照を日本語の談話上明示した。
theological_decisions:
- issue: חָסֶד に表された神の忠実な好意
  choice: 変わらぬ愛
  alternative: 慈しみ／誠実な愛／恵み
  rationale: 神の持続的で忠実な愛顧を伝えながら、この節自体が明示しない『契約』を本文に読み込まないようにした。語の幅は脚注に残した。
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文にある神の固有名を称号へ置換せずに示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、物語文としての品位を保った。『目にかなう』は現代日本語でも理解可能な聖書的慣用表現で、原文の『目に』という比喩を自然に残している。
