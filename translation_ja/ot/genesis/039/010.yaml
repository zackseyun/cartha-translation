source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Joseph day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: ja
  text: さて、彼女が来る日も来る日もヨセフに話しかけるたびに、ヨセフは彼女の言うことを聞かず、彼女のそばに横たわることも[a]、彼女と一緒にいることもしなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼女と寝ることも」とも訳せる。ヘブライ語の「横たわる」は性的な意味を持つことがある。「彼女のそばに横たわる」と訳すことで原文の表現を保ち、続く「彼女と一緒にいる」との区別も残した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: こうして
  rationale: 物語の次の展開を導く叙述表現。日本語では出来事の連続を自然に示し、古風すぎない「こうして」とした。
- source_word: כְּדַבְּרָהּ אֶל־יוֹסֵף
  choice: 彼女が……ヨセフに言い続けても
  rationale: כְּ の時間的用法と、後続する「来る日も来る日も」が示す反復を自然な日本語で表した。「言い寄る」と限定せず、原文の広い「語る」を保った。
- source_word: יוֹם יוֹם
  choice: 来る日も来る日も
  rationale: 名詞の反復による継続・反復を、執拗さも伝わる現代日本語の慣用表現で示した。
- source_word: שָׁמַע אֵלֶיהָ
  choice: 彼女の言うことを聞かず
  rationale: 「聞く」「耳を傾ける」「従う」の幅を持つ表現。ここでは要求を受け入れなかったことが文脈から分かる、広く自然な訳を選んだ。
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: 彼女のそばに横たわることも
  rationale: שׁכב は横になることにも性的関係にも用いられ、אצל は近接を表す。「そばに横たわる」として語形を保ちつつ、文脈上の性的含意を排除しないよう脚注を付した。
- source_word: לִהְיוֹת עִמָּהּ
  choice: 彼女と一緒にいることも
  rationale: 「彼女と共にいる」という広い意味を保ち、直前の性的な誘いだけでなく、危うい同席そのものを避けた可能性も残した。
theological_decisions:
- issue: ヨセフの拒絶が性的行為だけを指すのか、彼女と同席することまで含むのか
  choice: 二つの不定詞句をそれぞれ「横たわることも」「一緒にいることも」と訳し、区別を保った。
  alternative: 全体を「彼女と寝ることを拒んだ」と一つの意味にまとめる。
  rationale: 原文は לִשְׁכַּב אֶצְלָהּ と לִהְיוֹת עִמָּהּ を並べており、後者の独自の意味を消さない方が、原文の倫理的・物語的な幅を保持できる。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「来る日も来る日も」で反復を表し、「ヨセフ」は日本語聖書読者に定着した人名表記を採用した。文脈上の性的含意は伝えつつ、本文では原文の二つの句を安易に一つへ統合していない。
