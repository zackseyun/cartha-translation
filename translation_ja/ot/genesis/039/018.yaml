  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: ja
  text: 私が声を上げて叫んだとき、彼は彼の衣[a]を私のそばに残して、外へ逃げました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣」は「外套」とも訳せる。ヘブライ語のベゲドは衣類一般を指し、どの種類の衣服かを特定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: 私が……上げると
  rationale: וַיְהִי に続く כַּ＋不定詞構文を時の従属節として自然な日本語にし、物語の流れを保った。
- source_word: קוֹלִי
  choice: 声を
  rationale: קוֹל はここでは「声」を意味し、「声を上げる」という自然な日本語の慣用表現にした。
- source_word: וָאֶקְרָא
  choice: 叫ぶ
  rationale: קרא は「呼ぶ」「叫ぶ」の意を持つ。危急を訴えるという文脈に合う「叫ぶ」を選び、声量以上の意味は加えなかった。
- source_word: וַיַּעֲזֹב
  choice: 残して
  rationale: עזב はここで衣をその場に置いたまま去ることを表すため、日本語として自然な「残して」とした。
- source_word: בִּגְדוֹ
  choice: 自分の衣
  rationale: בֶּגֶד は衣服一般を指し、上着や外套など特定の種類に限定しない。「衣」は簡潔で品位があり、原語の広さを保つ。
- source_word: אֶצְלִי
  choice: 私のそばに
  rationale: אצל の近接・所在の意味を明確に表し、単なる所有を示すようにも読める「私のもとに」より空間的な表現を選んだ。
- source_word: וַיָּנָס
  choice: 逃げました
  rationale: נוס の切迫した逃走の意味を自然な現代日本語で表した。発話中の妻の言葉なので、文末は丁寧体とした。
- source_word: הַחוּצָה
  choice: 外へ
  rationale: 方向を示す語尾 ה を反映し、単なる所在の「外で」ではなく、外への移動を表した。
