  text: וַ/יִּמְצָ֨א יוֹסֵ֥ף חֵ֛ן בְּ/עֵינָ֖י/ו וַ/יְשָׁ֣רֶת אֹת֑/וֹ וַ/יַּפְקִדֵ֨/הוּ֙ עַל בֵּית֔/וֹ וְ/כָל יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: ja
  text: ヨセフは主人の好意を得て、主人に仕えた。主人はヨセフを自分の家の管理に当たらせ、所有するものすべてをヨセフの手に委ねた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の手に置いた」。これは、ヨセフの権限と管理のもとに委ねたことを表す言い回し。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: ヨセフは主人の好意を得て
  rationale: 直訳は「ヨセフは彼の目に恵みを見いだした」。日本語では評価と厚意を表す慣用句として「好意を得る」が明瞭であり、文脈上の指示対象を「主人」とした。
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: 主人に仕えた
  rationale: שרתはここではポティファルへの身近な奉仕を表す。「仕えた」は簡潔で、物語の身分関係も自然に伝える。
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: 主人はヨセフを自分の家の管理に当たらせ
  rationale: 使役形のפקדは監督・管理の任に就けることを表す。「家」は住居だけでなく家産や家の組織を含み得るため、本文では原語の像を保ちつつ「管理」で意味を明らかにした。
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: 所有するものすべて
  rationale: 主人が持つ財産や管理対象の全体を包括する表現として、自然で簡潔な日本語にした。
- source_word: נָתַן בְּיָדוֹ
  choice: ヨセフの手に委ねた
  rationale: 「手に置く」というヘブライ語の比喩を残しながら、管理権と責任を託した意味が伝わるよう「委ねた」とした。代名詞の連続による日本語での混乱を避けるため、ヨセフを明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「主人」を補って代名詞の指示を明確にしつつ、ヘブライ語の「家」と「手」の表現は可能な範囲で保持した。
