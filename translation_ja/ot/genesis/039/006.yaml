source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: ja
  text: そこで彼は、自分の持つすべてをヨセフの手に任せた。そして、自分が食べる物[a]のほかは何も気にかけなかった[b]。さて、ヨセフは姿も顔立ちも美しかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食べる物」は、ヘブライ語では字義どおりには「パン」。ここでは食物一般を指すと考えられる。
    reason: 原語の字義と文脈上の意味の幅を示すため。
  - marker: b
    text: 直訳すると、「彼と共には何も知らなかった」。この句全体は、ヨセフに管理を任せたため、主人が諸事を把握したり気にかけたりしなかったことを表す慣用的表現と理解される。
    reason: 原文の אִתּוֹ（「彼と共に」）の係り方と句全体の慣用的な意味に解釈の幅があるため。
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: 任せ
  rationale: 基本義は「残す、離す」だが、この行政上の文脈では、ポティファルが全財産の管理をヨセフに委ねたことを表すため、「任せ」が自然である。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 自分の持つすべて
  rationale: 所有物だけでなく家の諸事を含み得る包括的な表現として、原文の広さを保った。
- source_word: בְּיַד יוֹסֵף
  choice: ヨセフの手に
  rationale: 「手」が管理・支配を表すヘブライ語の比喩を、日本語でも理解できる形で残した。
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: ヨセフに任せたものについては何も気にかけなかった
  rationale: 直訳的には「彼と共には何も知らなかった」で解釈に幅があるが、文脈上はヨセフの管理下の事柄を把握したり心配したりしなかった意とした。別解は脚注に示した。
- source_word: כִּי אִם
  choice: ただし……だけは別であった
  rationale: 例外を示す構文を、自然で明確な日本語にした。
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: 自分が食べる物
  rationale: לֶחֶם の字義は「パン」だが、ここでは食物一般または食事を指す可能性が高い。「自分」は主語がポティファルであることを明確にする。
- source_word: וַיְהִי יוֹסֵף
  choice: さて、ヨセフは
  rationale: 次の出来事への場面転換を自然に示し、状態描写として訳した。
- source_word: יְפֵה תֹאַר
  choice: 体つきも
  rationale: תֹאַר は身体の形や輪郭を指し、後続の「容姿」との区別を保つため「体つき」とした。
- source_word: וִיפֵה מַרְאֶה
  choice: 容姿も美しかった
  rationale: מַרְאֶה は見た目・外観を指す。二つの表現の並行性を保ちつつ、自然な日本語とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「ヨセフの手に」という原文の比喩を保持した。「体つきも容姿も美しかった」により、簡潔さとヘブライ語の並行表現を両立させた。
