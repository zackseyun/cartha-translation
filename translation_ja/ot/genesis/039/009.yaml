  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: ja
  text: この家で私より上の者は、だれもいません[a]。主人は、あなた以外、私に与えなかったものは何一つありません。あなたが主人の妻だからです。どうして私がこのような大きな悪[b]を行い、神に対して罪を犯すことができるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「この家には、私より大いなる者はいない」。ここで「家」は家屋だけでなく、家全体やその管理組織を指すことができます。
    reason: lexical_alternative
  - marker: b
    text: 「大きな悪事」または「大きな不正」とも訳せます。ヘブライ語の רָעָה は、悪、邪悪、不正を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: この家で私より上の者は、だれもいません
  rationale: אֵיןを用いた構文を、ヨセフより高い地位にある者の不在を表すものとして訳した。現代日本語として自然であり、家の管理における序列も明確に伝わる。
- source_word: בַּבַּיִת הַזֶּה
  choice: この家で
  rationale: בַּיִתは建物だけでなく家全体・家政組織も指し得る。「家」はヘブライ語の比喩的広がりを保ちつつ、文脈上は主人の家政を含む。
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: 何一つ私に差し控えてはいません
  rationale: חָשַׂךְの「差し控える、取っておく」と、否定下のמְאוּמָה「何一つ」を直接かつ自然に表した。
- source_word: כִּי אִם אוֹתָךְ
  choice: あなた以外
  rationale: 否定文に続くכִּי אִםの例外指定を簡潔に示す。
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: あなたは主人の妻だからです
  rationale: 例外の理由を示す因果関係を明瞭にした。三人称代名詞を機械的に用いるより、文脈上の指示対象である主人を示す方が日本語として自然である。
- source_word: וְאֵיךְ אֶעֱשֶׂה
  choice: どうして私が…行い…ことができるでしょうか
  rationale: וְאֵיךְが導く強い修辞疑問と、עשהの基本義「行う」を保った。
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: このような大きな悪
  rationale: רָעָהの道徳的な重みを「悪」で表し、定冠詞と指示詞による特定性も「このような」で自然に示した。
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: 神に対して罪を犯す
  rationale: לを伴うחטאを日本語で自然な「神に対して罪を犯す」とし、社会的な背信だけでなく神への罪であることを保持した。
theological_decisions:
- issue: אֱלֹהִיםの指示対象
  choice: 神
  alternative: ある神／神々
  rationale: 創世記の物語とヨセフの発言の文脈では、彼が礼拝する唯一の神を指す。固有の指示対象として「神」と訳すのが適切である。
- issue: 誘惑への応諾の性格
  choice: 「大きな悪」であり「神に対する罪」でもあるという並列を保持
  alternative: 主人への背信だけに限定して説明する
  rationale: 原文は行為の道徳的悪と神への罪という二つの表現を結びつけており、どちらか一方に還元すべきではない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨセフの敬意ある語調と道徳的な厳粛さを保った。「主人」は文脈上のポティファルを指し、妻への呼びかけに不自然な代名詞を重ねることを避けるために用いた。
