- from: 牢獄の長は、ヨセフの手に委ねたこと[b]には何一つ目を配らなかった[a]。ヤハウェがヨセフとともにおられ、ヨセフが何をしても、ヤハウェがそれを成功させておられたからである[c]。
  to: 監獄の長は、ヨセフの管理に委ねられていること[b]については、何一つ気を配らなかった[a]。ヤハウェがヨセフとともにおられ、ヨセフが行うことは何でも、ヤハウェが成功させておられたからである[c]。
  rationale: 「手にある」という管理責任を表す慣用句を、「ヨセフの管理に委ねられていること」として自然な日本語にし、牢獄の長がヨセフの担当事項を監督しなかったという文脈を明確にした。後半は、ヤハウェの同在と成功を与える使役的働きを維持した。
