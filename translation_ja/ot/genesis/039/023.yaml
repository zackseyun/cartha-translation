id: GEN.39.23
reference: Genesis 39:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: ja
  text: 監獄の長は、ヨセフの管理に委ねられていること[b]については、何一つ気を配らなかった[a]。ヤハウェがヨセフとともにおられ、ヨセフが行うことは何でも、ヤハウェが成功させておられたからである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「何一つ見ていなかった」。ここでは、何一つ気にかけず、監督しなかったことを表す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「彼の手にあるもの」。ヨセフの管理に委ねられたものを指す慣用表現。
    reason: cultural_note
  - marker: c
    text: 「ヤハウェが、ヨセフのすることを何でも成功させておられた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: 牢獄の長
  rationale: שַׂר の管理者・責任者という意味を保ちつつ、現代日本語で自然かつ簡潔に表した。
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: 何一つ目を配らなかった
  rationale: 字義どおりの「何も見なかった」ではなく、ヨセフに任せた事柄を監督したり気にかけたりする必要がなかったという文脈上の意味を表す。
- source_word: בְּיָדוֹ
  choice: ヨセフの手に委ねたこと
  rationale: 「彼の手にある」というヘブライ語の具体的な表現をある程度残しながら、管理を委ねられた事柄を指す慣用的意味が伝わるようにした。
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: ヤハウェがヨセフとともにおられ…からである
  rationale: בַּאֲשֶׁר をこの文脈で理由を示す表現と理解し、日本語では文末の「からである」によって因果関係を明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文にある神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: ヨセフが何をしても
  rationale: 関係表現の包括的な意味を自然な日本語で表し、文脈上の指示対象であるヨセフを明示した。
- source_word: מַצְלִיחַ
  choice: 成功させておられた
  rationale: צלח のヒフィル形が持つ使役の意味、すなわちヤハウェが成功をもたらしたことを保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、その固有名としての性格を保つ音写を採用した。
- issue: ヨセフの成功と神の働きの関係
  choice: ヤハウェがそれを成功させておられた
  alternative: 彼のすることは成功していた
  rationale: מַצְלִיחַ の使役形を反映し、成功の主体的な原因がヤハウェにあるという原文の表現を弱めないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半ではヘブライ語の「見る」という比喩を「目を配る」として生かし、後半では使役形を明示した。文脈上明らかな代名詞の指示対象は「ヨセフ」と補って読み違いを避けた。
