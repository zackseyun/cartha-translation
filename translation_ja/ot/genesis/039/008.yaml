source:
  edition: WLC
  text: וַ/יְמָאֵ֓ן וַ/יֹּ֨אמֶר֙ אֶל אֵ֣שֶׁת אֲדֹנָ֔י/ו הֵ֣ן אֲדֹנִ֔/י לֹא יָדַ֥ע אִתִּ֖/י מַה בַּ/בָּ֑יִת וְ/כֹ֥ל אֲשֶׁר יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדִֽ/י׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: ja
  text: しかしヨセフは拒み、主人の妻に言った。「ご覧ください。主人は、家の中のことを私に任せて、何も気にかけておられません[a]。また、ご自分の持ち物をすべて私の手に委ねておられます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「私とともに、家の中に何があるかを知らない」。主人が家の管理をヨセフに任せ、自らは関与していないことを表す慣用的な言い方です。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の手に与えました」。すべてをヨセフの管理と権限のもとに置いた、という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: しかしヨセフは拒み
  rationale: 文脈上、主人の妻の誘いに対する拒絶なので、接続の逆接的な働きを「しかし」で表した。主語の「ヨセフ」は日本語で指示対象を明確にするため補った。
- source_word: הֵן
  choice: ご覧ください
  rationale: 後続の説明へ注意を促す談話標識。主人の妻に対する発話であるため、自然な敬語表現とした。
- source_word: אֲדֹנִי
  choice: 主人
  rationale: ポティファルとヨセフの家内における身分関係を明確に表し、神学的称号との混同を避ける。
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: 家の中のことを私に任せて、何も気にかけておられません
  rationale: 直訳しにくい「私とともに知らない」という表現を、ヨセフに家の管理を任せ、主人自身は関与していないという文脈上の意味で自然に訳した。「家」は財産だけでなく家内の事柄も含み得る。
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: ご自分の持ち物をすべて
  rationale: 主人に属するものの総体を、現代日本語で明瞭に表した。
- source_word: נָתַן בְּיָדִי
  choice: 私の手に委ねておられます
  rationale: 「私の手に与えた」という具体的な比喩を残しつつ、権限と管理を託した意味が伝わるよう「委ねる」とした。
theological_decisions: []
