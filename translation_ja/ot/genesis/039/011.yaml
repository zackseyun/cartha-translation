  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: ja
  text: ある日のこと[a]、ヨセフは自分の仕事をするため家に入った。そのとき、家の男たちは一人もその家の中にいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この日のような日に」。ここでは「ある時」「ある日のこと」という意味の慣用的な言い回しと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ある日のこと
  rationale: ヘブライ語の物語を進める定型表現を、古風にならない自然な日本語で示した。後続の時の表現と合わせて一つの導入句とした。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: ある日のこと
  rationale: 字義どおりには「この日のような日に」だが、文脈では特定の機会を導入する慣用的表現と考えられるため、自然な日本語にした。字義的な形は脚注に残した。
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: ヨセフが……家に入ると
  rationale: 方向を示す語尾を伴う בוא は家の中への移動を表す。日本語では主語を「彼」とするより、文脈上の人物名「ヨセフ」を補うほうが明瞭である。
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: 自分の仕事をするため
  rationale: מְלָאכָה の通常の意味である「仕事」を採用し、所有接尾辞も「自分の」と明示した。仕事内容を本文以上に限定していない。
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: 家の男たちは一人も……いなかった
  rationale: אַנְשֵׁי の男性複数を「男たち」として保ち、否定存在文を自然な日本語の「一人もいなかった」で表した。
- source_word: שָׁם בַּבָּיִת
  choice: そこにいなかった
  rationale: שָׁם の「そこに」を明示した。直前の「家に」と「家の男たち」によって場所が明らかなため、末尾で「家の中に」を重ねず、日本語として自然にした。
