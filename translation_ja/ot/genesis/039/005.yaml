revisions:
- from: 彼がヨセフを自分の家と全財産の管理に任命した時から[a]、ヤハウェはヨセフのゆえにそのエジプト人の家を祝福された。ヤハウェの祝福は、家にあるものにも畑にあるものにも、彼の全財産の上にあった[b]。
  to: 彼がヨセフを自分の家と全財産の管理者に任命して以来[a]、ヤハウェはヨセフのゆえにそのエジプト人の家を祝福された。ヤハウェの祝福は、家でも畑でも、そのエジプト人が持つすべてのものに及んだ[b]。
  rationale: 後半を原文の構造に即して、「家と畑」を所有物全体の範囲を示す句として配置した。「祝福は…に及んだ」は、祝福が全所有物に及ぶという意味を明瞭な現代標準日本語で表す。前半は「管理者に任命した」として、ヨセフを管理権限のある地位に置いた意味を明確にした。
