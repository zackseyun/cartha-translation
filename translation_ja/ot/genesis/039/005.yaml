id: GEN.39.5
reference: Genesis 39:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: ja
  text: 彼がヨセフを自分の家と全財産の管理者に任命して以来[a]、ヤハウェはヨセフのゆえにそのエジプト人の家を祝福された。ヤハウェの祝福は、家でも畑でも、そのエジプト人が持つすべてのものに及んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼がヨセフを自分の家とすべての財産の管理に任せた時から」。
    reason: מֵאָז はこの任命を起点とする時を示し、הִפְקִיד は管理を委ねることも表す。
  - marker: b
    text: 直訳的には「ヤハウェの祝福は、家においても畑においても、彼が持つすべてのものの中にあった」。
    reason: 「家と畑」は、そのエジプト人の所有物全体に祝福が及ぶ領域・範囲を具体化している。
lexical_decisions:
- source_word: מֵאָז
  choice: 時から
  rationale: ある時点を起点として、その後の状態が続いたことを表す。後続する任命の出来事と自然に結び付けた。
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: ヨセフを自分の家と全財産の管理に任命した
  rationale: 使役形の動詞は監督・管理の任を与えることを示す。「管理に任命した」により、単なる配置ではなく委任された権限を明確にした。目的語の代名詞は文脈上ヨセフなので、現代日本語で分かりやすく固有名詞を補った。
- source_word: וַיְבָרֶךְ
  choice: 祝福された
  rationale: 物質的繁栄という結果に狭めず、原語の「祝福する」を保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: בֵּית הַמִּצְרִי
  choice: そのエジプト人の家
  rationale: 直前まで登場する主人を指す定冠詞を「その」で表し、「家」が家屋だけでなく家に属する営みや財産を含み得る余地を残した。
- source_word: בִּגְלַל יוֹסֵף
  choice: ヨセフのゆえに
  rationale: 原因・理由を示す表現を、明瞭かつ格調のある現代日本語で訳した。
- source_word: בִּרְכַּת יְהוָה
  choice: ヤハウェの祝福
  rationale: 構成形を自然な所有表現で訳し、祝福の源を明示した。
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: 彼の全財産の上に
  rationale: 祝福が所有物の全体に及ぶことを示し、「上に」によって祝福がそこに臨むという原文の比喩を保った。
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: 家にあるものにも畑にあるものにも
  rationale: 家内と農地という二領域を具体的に保ちながら、何に祝福が及んだかを日本語で自然に示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を明記しているため、称号へ置換せず一般的な学術的音写を用いた。
- issue: 祝福の意味範囲
  choice: 祝福された／祝福
  alternative: 繁栄させた／繁栄
  rationale: 文脈には繁栄が含まれるが、原語 ברך の神学的・関係的な広がりを物質的成功だけに限定しないため「祝福」を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語本文にふさわしい簡潔さと品位を保った。「全財産の管理に任命した」は行政的役割を自然に伝え、「ヨセフのゆえに」は因果関係と格調を両立させる。神名は一貫して「ヤハウェ」とした。
