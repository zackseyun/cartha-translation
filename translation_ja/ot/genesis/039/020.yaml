  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: ja
  text: ヨセフの主人は彼を連れて行き、牢獄[a]に入れた。そこは、王の囚人たちが拘禁されていた場所であった[b]。ヨセフは牢獄にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「ソハルの家」。拘禁施設を指す、おそらくエジプト語由来の表現。
    reason: cultural_note
  - marker: b
    text: ヘブライ語では「縛る、拘禁する」を意味する同じ語根が繰り返され、直訳に近く言えば「王の囚人たちが拘禁されていた」となる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: ヨセフの主人
  rationale: この文脈のאָדוֹןは神的称号ではなく、ヨセフを所有し家を治める人間の主人を指す。日本語では「主人」が自然である。
- source_word: וַיִּקַּח
  choice: 捕らえ
  rationale: 基本義は「取る」だが、告発を受けた主人がヨセフを牢獄へ送る場面では「捕らえる」が自然である。ただし、過度に暴力的な「取り押さえる」とはしない。
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: 入れた
  rationale: נתןとאֶלの組み合わせは、ここでは人をある場所に置くことを表す。牢獄との自然な日本語の結び付きから「入れた」とした。
- source_word: בֵּית הַסֹּהַר
  choice: 牢獄
  rationale: 字義的には「ソハルの家」で、拘禁施設を指す語である。本文では意味が明確に伝わる「牢獄」とし、語形上の情報は脚注に残す。
- source_word: מְקוֹם אֲשֶׁר
  choice: そこは…場所であった
  rationale: 牢獄を説明する同格的な表現を省かず、日本語として読みやすい独立文にした。
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: 王の囚人たちが拘禁されている
  rationale: אסרの同根語反復が「囚人」と「拘禁される」に現れている。日本語でも意味と反復をある程度保ちつつ、不自然な「囚人が投獄される」を避けた。
- source_word: וַיְהִי שָׁם בְּבֵית הַסֹּהַר
  choice: こうしてヨセフは牢獄にいた
  rationale: 主語を明示して日本語の参照を明確にし、場所の反復も保持した。「とどまった」は継続の含意を加えるため避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「牢獄」は「刑務所」より古代の拘禁施設に適し、「獄屋」ほど古風ではない。原文末尾の場所の反復を残した。
