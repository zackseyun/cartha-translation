source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: ja
  text: さて、主人は、妻が主人に「あなたの奴隷[a]は私にこんなことをしました」と語った言葉を聞くと、怒りに燃えた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」は「僕（しもべ）」「しもべ」とも訳せる。ここではヨセフの身分を踏まえて「奴隷」とした。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、主人の怒りが誰に向けられたのかを明示していない。
    reason: preserved_ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: さて
  rationale: 物語の次の出来事を導く継続表現。逐語的な「そして、こうなった」よりも、現代日本語の物語として自然に接続する。
- source_word: כִשְׁמֹעַ
  choice: 聞くと
  rationale: כ＋不定詞が表す時間的関係を、自然な日本語で示す。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: ここではヨセフの所有者・家の主人であるポティファルを指す。
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו לֵאמֹר
  choice: 妻が彼に「……」と語るのを
  rationale: ヘブライ語の「妻の言葉」「彼に語った」「言って」という重なりを、日本語では引用を用いて簡潔かつ自然に表した。「彼」は主人を指す。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: こんなこと
  rationale: כְּの類似・様態と הָאֵלֶּה の指示性を合わせ、「このようなこと」という意味を口頭の告発にふさわしい自然な表現で示す。
- source_word: עָשָׂה לִי
  choice: 私に……しました
  rationale: עשה と לִי を過度に解釈せず、「私に対して」と敵対性を明示的に補わない形で訳す。
- source_word: עַבְדְּךָ
  choice: あなたの奴隷
  rationale: עבדには「僕、しもべ」の意味もあるが、この家でのヨセフの隷属的身分が明確なため「奴隷」とした。
- source_word: וַיִּחַר אַפּוֹ
  choice: 怒りを燃やした
  rationale: 怒りが燃えるというヘブライ語の比喩を、理解しやすい現代日本語で保持する。
theological_decisions:
- issue: 主人の怒りが誰に向けられたか
  choice: 本文では対象を明示しない
  alternative: 「ヨセフに対して激しく怒った」
  rationale: ヘブライ語は主人の怒りが燃えたとのみ述べ、怒りの対象を明示していない。文脈からヨセフと推測できても、本文で確定させない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「怒りを燃やした」という原文の比喩を残した。妻の発言は口頭の訴えとして自然な「こんなこと」とし、全体を簡潔で品位ある物語文に整えた。
