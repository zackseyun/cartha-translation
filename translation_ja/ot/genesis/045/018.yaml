  text: וּ/קְח֧וּ אֶת אֲבִי/כֶ֛ם וְ/אֶת בָּתֵּי/כֶ֖ם וּ/בֹ֣אוּ אֵלָ֑/י וְ/אֶתְּנָ֣ה לָ/כֶ֗ם אֶת טוּב֙ אֶ֣רֶץ מִצְרַ֔יִם וְ/אִכְל֖וּ אֶת חֵ֥לֶב הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: ja
  text: 'あなたがたの父と家族を連れて、わたしのもとへ来なさい。わたしはあなたがたにエジプトの地の最良のものを与えよう。あなたがたはその地の最上のものを食べなさい。[a]


    [a] 直訳すると「地の脂肪を食べる」。これは、その地の最も豊かな恵み、すなわち最上のものを指すヘブライ語の表現。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「地の脂肪を食べる」。これは、その地の最も豊かな恵み、すなわち最上のものを指すヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: 連れて
  rationale: לקח の複数命令形。父と家族を同行させる文脈なので、基本義を踏まえつつ日本語として自然な「連れて」とした。
- source_word: אֲבִיכֶם
  choice: あなたがたの父
  rationale: 二人称男性複数接尾辞を伴い、ヤコブ一人を指す。
- source_word: בָּתֵּיכֶם
  choice: 家族
  rationale: 字義は「家々」だが、ここでは家に属する人々、すなわち世帯・家族を指す。一般読者に自然な「家族」とした。
- source_word: וּבֹאוּ אֵלַי
  choice: 私のところへ来なさい
  rationale: בוא の複数命令形と אֶל。「戻る」という明示されていない意味は加えず、単純な到来命令として訳した。
- source_word: וְאֶתְּנָה לָכֶם
  choice: そうすれば、私はあなたがたに……与えよう
  rationale: 命令に続く נתן の意志形的な形を、約束・確約として自然に表現した。
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: エジプトの地の最良のもの
  rationale: טוּב は良いもの、恵み、最上のものを表す。後続の חֵלֶב と区別しつつ、与えられる最良の資源を広く示す訳とした。
- source_word: וְאִכְלוּ
  choice: 食べることができる
  rationale: 形は命令形だが、先行する約束の結果として、最上の産物を享受できるという保証を表す。日本語では許可・享受可能の表現が文脈に自然。
- source_word: חֵלֶב הָאָרֶץ
  choice: この地の最も豊かな産物
  rationale: 字義は「地の脂肪」で、土地の最上・最も豊かな産物を指す慣用表現。本文では意味を明瞭にし、原文の比喩は脚注に保持した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ファラオの命令と約束にふさわしい端正な文体とした。「家族」は文脈上の集合的意味を自然に伝え、「地の脂肪」という原文の比喩は脚注で示した。
