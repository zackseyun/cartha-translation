  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: ja
  text: あなたはこう命じられている。「このようにしなさい。エジプトの地から、幼い子どもたちと妻たちのために荷車[a]を持って行き、父を運んで来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「車」とも訳せる。人や荷物を運ぶための車両。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: あなたはこう命じられている
  rationale: プアル完了形の受動を保ち、文脈上ファラオからヨセフに与えられた命令として、現代日本語で自然に表した。
- source_word: זֹאת עֲשׂוּ
  choice: このようにしなさい
  rationale: 指示を導く簡潔な命令句として、原文の命令の力を保った。
- source_word: קְחוּ לָכֶם
  choice: 持って行き
  rationale: 後続するエジプトからカナンへの移動に即して訳した。לָכֶם の受益的ニュアンスは「子どもたちと妻たちのために」によって文中に明示されるため、不自然な重複を避けた。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: אֶרֶץ を省略せず、自然な日本語で原文の表現を保持した。
- source_word: עֲגָלוֹת
  choice: 荷車
  rationale: 人や荷物を運ぶ車両を指す語として、時代錯誤を避けつつ明瞭な語を選んだ。
- source_word: לְטַפְּכֶם
  choice: 幼い子どもたちのために
  rationale: טַף が特に幼い子どもを指すことを明示した。
- source_word: וְלִנְשֵׁיכֶם
  choice: 妻たちのために
  rationale: 家族の移住という文脈における נָשִׁים の関係的意味を明確にした。
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: 父上を乗せて
  rationale: נשא の「運ぶ」という意味を、直前の荷車とのつながりに即して自然に表現した。「父上」は息子たちへの命令として日本語の敬意を自然に示す。
- source_word: וּבָאתֶם
  choice: こちらへ来なさい
  rationale: 基本義「来る」を保ち、話者のいるエジプトへの方向を日本語で自然に示した。「戻る」とは訳さず、原文にない反復・帰還の意味を加えていない。
theological_decisions:
- issue: וּבָאתֶם が帰還を明示するか
  choice: こちらへ来なさい
  alternative: 戻って来なさい
  rationale: 文脈上はエジプトへの帰来だが、ヘブライ語は単に「来る」と述べるため、「戻る」を本文に加えず語の方向性だけを自然に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ファラオがヨセフに与えた命令をヨセフが兄弟たちへ伝える構文を保持した。引用内は直接的な命令調としつつ、「父上」で日本語として自然な家族関係上の敬意を表した。
