lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: は言った
  rationale: 物語を進める標準的なワイイクトル形。日本語では文脈上、接続詞を補わず自然に表した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文が明示する名を保ち、「ヤコブ」に置き換えなかった。
- source_word: רַב
  choice: もう十分だ
  rationale: ここでは満足・充足を表す感嘆的な用法。突然の感情と、知らせによって心が定まったことを自然な日本語で表す。
- source_word: עוֹד
  choice: まだ
  rationale: חָי と結びつき、ヨセフが今なお生きていることを示す。
- source_word: בְּנִי
  choice: 息子
  rationale: 一人称所有は日本語では文脈から明白であり、イスラエル自身の発言として自然に表した。
- source_word: חָי
  choice: 生きている
  rationale: 述語的な形容表現を、現代日本語の通常の言い方で訳した。
- source_word: אֵלְכָה
  choice: 私は…行って…会おう
  rationale: コホータティブが示す強い意志を、「行こう」という決意の表現で保った。後続動詞と自然につないだ。
- source_word: וְאֶרְאֶנּוּ
  choice: あの子に会おう
  rationale: 直訳は「彼を見よう」だが、親子の再会という文脈では「会う」が自然。目的語は息子への情愛が響く「あの子」とした。
- source_word: בְּטֶרֶם
  choice: 前に
  rationale: まだ起きていない出来事に先立つ時を示す標準的な訳。
- source_word: אָמוּת
  choice: 私は死ぬ
  rationale: מות の一人称単数形を率直に訳した。
