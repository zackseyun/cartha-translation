  language: ja
  text: こうして彼らはエジプトから上って行き、カナンの地に、父ヤコブのもとへ来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上って行き
  rationale: עלהの「上る」という移動表現を保ちつつ、エジプトを出てカナンへ向かう地理的・慣用的な方向性を自然な日本語で示す。
- source_word: מִמִּצְרָיִם
  choice: エジプトから
  rationale: 前置詞מִןが示す出発点・起点を明確に表す。
- source_word: וַיָּבֹאוּ
  choice: 来た
  rationale: בואの基本的な移動の意味を保ち、目的地への到着を文脈上自然に表す。「入った」として領域への進入を過度に強調しない。
- source_word: אֶרֶץ כְּנַעַן
  choice: カナンの地
  rationale: 原文に明示されたאֶרֶץ「地」を省かず、定着した聖書的地名表現として訳す。
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: 父ヤコブのもとへ
  rationale: אֶלの方向性とאֲבִיהֶם「彼らの父」を自然な日本語で表す。所有関係は「彼らの」を重ねず、「父ヤコブ」で文脈上明瞭にした。
