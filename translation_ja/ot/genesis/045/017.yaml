source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אֱמֹ֥ר אֶל אַחֶ֖י/ךָ זֹ֣את עֲשׂ֑וּ טַֽעֲנוּ֙ אֶת בְּעִ֣ירְ/כֶ֔ם וּ/לְכוּ בֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: ja
  text: そこでファラオはヨセフに言った。「兄弟たちにこう言いなさい。『こうしなさい。家畜に荷を積み、出発して、カナンの地へ行きなさい[a]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「行き、カナンの地へ来なさい」。
    reason: ヘブライ語は「行く」と「来る」という二つの命令形を続けて用いているため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、現代日本語の自然な叙述として表した。
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: 兄弟たちにこう言いなさい
  rationale: 命令として語るようヨセフに指示する構文を、引用への導入が明瞭になる形で訳した。
- source_word: זֹאת עֲשׂוּ
  choice: こうしなさい
  rationale: 指示語と複数形命令を簡潔で自然な日本語にした。
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  choice: 家畜に荷を積み
  rationale: בְּעִירはここでは運搬に用いる家畜を指す。動詞טעןが示す、動物に荷を積む動作を明示した。
- source_word: וּלְכוּ בֹאוּ
  choice: 出発して……行きなさい
  rationale: 連続する二つの命令形が表す出立と目的地への移動を、ぎこちない逐語訳を避けながら日本語で表した。
- source_word: אַרְצָה כְּנָעַן
  choice: カナンの地へ
  rationale: 方向を示す語尾と、本文に明示された「地」をともに反映した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、ファラオの命令としての簡潔さと威厳を保った。「獣」のような古風な語は避け、文脈上の役割が伝わる「家畜」とした。
