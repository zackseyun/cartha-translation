base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Joseph that he had spoken to them[a], and he saw the wagons that Joseph had sent to carry him[b], and the spirit of their father Jacob revived.
translation:
  language: ja
  text: 彼らは、ヨセフが自分たちに語った言葉をすべて父に伝えた。ヤコブは、ヨセフが父を運ぶために送った荷車を見た。すると、彼らの父ヤコブの気力はよみがえった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らの父ヤコブの霊は生き返った」。元気や希望を取り戻したことを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: 彼らは、ヨセフが自分たちに語ったことをすべて父に伝えた
  rationale: דבר の反復を日本語で不自然に重ねず、兄弟たちがヨセフの言葉を父に報告したという伝達行為を明確にした。אֵלָיו の指示対象は文脈上ヤコブなので「父」とした。
- source_word: הָעֲגָלוֹת
  choice: 荷車
  rationale: 人や物を運ぶ車両を指す語であり、古代の場面にも合う自然な日本語として「荷車」を採用した。
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: 自分を運ぶためにヨセフが送った
  rationale: נשא の「運ぶ、担う」という意味を保った。「自分」は、見た者であり運ばれる者でもあるヤコブを指す。
- source_word: וַתְּחִי רוּחַ
  choice: 気力はよみがえった
  rationale: 直訳的な「霊が生き返った」が表す、活力や希望を取り戻したという慣用的意味を、生命の回復という比喩を残して自然な日本語にした。
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: 父ヤコブ
  rationale: 「彼らの父ヤコブ」を簡潔で自然な日本語にした。固有名は日本語聖書で定着した「ヤコブ」を用いた。
theological_decisions:
- issue: רוּחַ の意味範囲
  choice: 気力
  alternative: 霊
  rationale: ここではヤコブが元気と希望を取り戻す文脈であり、「気力」が慣用的意味を自然に伝える。ただし原語は「霊」とも訳せるため、その字義的可能性を脚注に残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ヘブライ語の連続する三つの叙述は、日本語で読みやすい三文に分けた。「すると」で最後の出来事の結果的なつながりを自然に示した。
