  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: ja
  text: あなたはゴシェンの地に住み、私の近くにいることになる。あなたも、あなたの息子たちも、孫たちも、羊ややぎの群れも、牛の群れも、あなたの持つすべてのものも、私の近くにいることになる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: 住み
  rationale: ישׁבはここでは、特定の土地に定住して暮らすことを表す。「住む」は現代日本語として自然で、継続的な居住の意味も保つ。
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地に
  rationale: אֶרֶץの地理的な意味を「地」で示し、地名גֹּשֶׁןは一般的な表記「ゴシェン」とした。
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: 私の近くにいることになる
  rationale: היהと形容詞קָרוֹבの組み合わせが示す状態・結果を自然な日本語で表し、ヨセフとの地理的近接を保持する。
- source_word: אַתָּה וּבָנֶיךָ וּבְנֵי בָנֶיךָ
  choice: あなたも、あなたの息子たちも、孫たちも
  rationale: 独立代名詞אַתָּהの強調と列挙を助詞「も」で示す。בָּנִיםは「息子たち」、בְּנֵי בָנֶיךָは自然な日本語で「孫たち」とした。
- source_word: וְצֹאנְךָ
  choice: 羊ややぎの群れも
  rationale: צֹאןは羊とやぎを中心とする小家畜の集合語であるため、単なる「羊」より範囲が明確になるよう訳した。
- source_word: וּבְקָרְךָ
  choice: 牛の群れも
  rationale: בָּקָרは大型家畜、特に牛を指す集合語であり、צֹאןとの区別を明確にする。
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: あなたの持つすべてのものも
  rationale: 所有物全般を含む広い表現を、明快で自然な現代日本語にした。
theological_decisions: []
translation_notes:
  register: ヨセフが父ヤコブに直接語る親密さを保ちつつ、現代の標準的な日本語で明快にした。命令というより将来の居住を告げるヘブライ語の形を「いることになる」で表した。列挙では「も」を反復し、אַתָּהの強調と家族・家畜・所有物を包括する流れを再現した。
