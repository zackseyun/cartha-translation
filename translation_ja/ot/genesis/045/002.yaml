source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֶת קֹל֖/וֹ בִּ/בְכִ֑י וַ/יִּשְׁמְע֣וּ מִצְרַ֔יִם וַ/יִּשְׁמַ֖ע בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: ja
  text: ヨセフは声を上げて泣いた[a]。エジプト人たちはそれを聞き[b]、ファラオの家の者たちも聞いた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「泣きながら声を与えた」。大声で泣くことを表すヘブライ語の言い回し。
    reason: lexical_alternative
  - marker: b
    text: 「エジプトはそれを聞いた」とも訳せるが、原文の動詞が複数形なので、ここでは人々を指すと捉えた。
    reason: lexical_alternative
  - marker: c
    text: 「ファラオの家」は、「ファラオの家族・家臣」または広く「ファラオの宮廷」を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: 声を上げて泣いた
  rationale: 直訳的には「泣くことにおいて自分の声を与えた」だが、大声で泣いたことを表すヘブライ語の慣用表現である。自然な現代日本語で、その声が周囲に聞こえた文脈も保つ。
- source_word: וַיִּשְׁמְעוּ / וַיִּשְׁמַע
  choice: 聞き／聞いた
  rationale: ここでの שׁמע は、服従や傾聴ではなく音を耳にしたことを指す。原文にある動詞の反復も保った。
- source_word: מִצְרַיִם
  choice: エジプト人たち
  rationale: 語形自体は国名「エジプト」とも取れるが、複数形の動詞 וַיִּשְׁמְעוּ が人々を集合的に指す理解を支持する。
- source_word: בֵּית פַּרְעֹה
  choice: ファラオの家の者たち
  rationale: בֵּית は建物だけでなく家に属する人々や王宮の組織を表し得る。ここでは「聞いた」の主語として、人々を指すことが自然であり、「家」の比喩的広がりも残す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ヨセフ」は直前の文脈から補った主語であり、単独節としての明瞭さを確保する。「それを」も、泣き声を聞いたという関係を自然に示すための補足。
