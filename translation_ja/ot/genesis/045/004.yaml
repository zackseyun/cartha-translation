  verdict: revise
  source_fidelity: ヘブライ語は、ヨセフが兄弟たちに近づくよう求め、彼らが実際に近づいた後で、「わたしはヨセフ、あなたがたがエジプトへ売ったあなたがたの兄弟です」と述べる。現訳は概ね忠実だが、「彼らが近寄ると」は、完了した応答（「彼らは近づいた」）を条件・同時関係のように表し、叙述の順次性をやや弱める。
  naturalness: 「私のそばに来てください」「彼らが近寄ると」は自然だが、原文の同じ動詞の反復と、命令への応答をより明瞭にするには「わたしの近くに来てください。」「彼らが近づくと」よりも「近づいて来た」のように独立文で訳すのがよい。発話内は「わたし」に統一すると、現代日本語の聖書本文として落ち着く。
  terminology: 「ヨセフ」「兄弟たち」「エジプト」は適切。「あなたがたの兄弟」は、対象が兄・弟のいずれにも当たりうる原文の אָח を不必要に限定せず、適切である。
