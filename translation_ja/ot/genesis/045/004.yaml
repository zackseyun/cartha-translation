  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: ja
  text: ヨセフは兄弟たちに言った。「どうか、わたしの近くに来てください。」彼らは近づいて来た。ヨセフは言った。「わたしはヨセフです。あなたがたがエジプトへ売った、あなたがたの兄弟です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める継続形の機能は、日本語では文の順序と文脈によって自然に示せるため、過度に接続語を補わず簡潔に訳した。
- source_word: אֶל־אֶחָיו
  choice: 兄弟たちに
  rationale: אָחの複数形と三人称男性単数接尾辞を、そのまま自然な現代日本語で表した。
- source_word: גְּשׁוּ נָא אֵלַי
  choice: どうか、私のそばに来てください
  rationale: נגשׁの「近づく」とנָאの丁寧な願いを表す。「そばに」により、話者のもとへ近づく方向も自然に示した。
- source_word: וַיִּגָּשׁוּ
  choice: 彼らが近寄ると
  rationale: 直前の命令に対する応答を示しつつ、同じ語根の反復を「そばに来る／近寄る」で保った。日本語の物語として滑らかになるよう従属節にした。
- source_word: אֲנִי יוֹסֵף
  choice: 私はヨセフです
  rationale: 名詞文を自然な日本語の判断文として訳し、自己開示の直接性を保った。
- source_word: אֲחִיכֶם
  choice: あなたがたの兄弟
  rationale: ヨセフはベニヤミンには兄で、ほかの兄弟には弟であるため、「弟」と限定せず、原語どおり関係を包括的に示す「兄弟」とした。
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: あなたがたが…売った
  rationale: 二人称複数の主語と一人称の目的語を明確にし、原文の率直で責任を突きつける表現を弱めなかった。日本語では後続の「あなたがたの兄弟」が目的対象であることを示す。
- source_word: מִצְרָיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾־ָהの意味を、目的地を表す自然な助詞「へ」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、再会場面の厳粛さとヨセフの直接的な自己開示を保った。「兄弟」は性別を曖昧にする一般語ではなく、この文脈で実の兄弟関係を示す語として用いている。
