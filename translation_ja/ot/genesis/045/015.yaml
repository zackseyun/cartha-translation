  text: ヨセフは兄弟全員に口づけをし、彼らを抱いて泣いた。その後、兄弟たちはヨセフと話した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たちはヨセフに話した」とも訳せる。ヘブライ語のこの表現は、「ヨセフと話した」とも「ヨセフに話した」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: 口づけし
  rationale: ピエル形のנשׁקは、愛情と和解を表す接吻を指す。反復の含みを過度に明示せず、現代日本語として品位のある「口づけする」とした。
- source_word: לְכָל אֶחָיו
  choice: 兄弟全員に
  rationale: כָּלと複数形により、ヨセフの兄弟の一人も除外されないことを簡潔に表す。
- source_word: וַיֵּבְךְּ
  choice: 泣いた
  rationale: בכהの基本的な意味を、自然で明瞭な現代日本語で表した。
- source_word: עֲלֵיהֶם
  choice: 彼らにすがって
  rationale: עַלがこの場面で示す身体的な接触を、日本語として不自然な「彼らの上で」を避けつつ表現した。「抱いた」と断定するよりも、原文の幅をある程度保つ。
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 出来事の時間的な順序を、簡潔で自然な日本語で示す。
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: 兄弟たちはヨセフと語り合った
  rationale: דברにאֵתが伴う構文の相互的な会話の含みを「語り合った」で表した。代名詞だけでは日本語で指示対象が曖昧になり得るため、「ヨセフ」と明示した。
