  to: 今は、私をここへ売ったことで、悲しんだり[a]、自分自身に腹を立てたり[b]してはなりません。命を保つために[c]、神があなたがたより先に私を遣わされたのです。
  rationale: 談話標識は因果を加えない「今は」とし、神の派遣の目的は生命の維持・存続を表す「命を保つために」とした。兄弟たちの売却という行為と、神が遣わしたという行為の両方を明示し、本文の神学的緊張は解消していない。脚注bは原語の慣用句の比喩をより自然かつ正確に示すよう改めた。
