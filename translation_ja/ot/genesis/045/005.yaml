  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: ja
  text: 今は、私をここへ売ったことで、悲しんだり[a]、自分自身に腹を立てたり[b]してはなりません。命を保つために[c]、神があなたがたより先に私を遣わされたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心を痛めたり」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「あなたがたの目に怒りが燃えないように」。怒ったり不快に思ったりすることを表す慣用句。
    reason: lexical_alternative
  - marker: c
    text: または「命を存続させるため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: だから今
  rationale: וְ の接続的な働きと עַתָּה の時間的意味を保ちつつ、直前の発言を受けてヨセフが勧告へ移る流れを自然な現代日本語で示す。
- source_word: אַל תֵּעָצְבוּ
  choice: 悲しんだり……してはならない
  rationale: עצב は心の痛みや悲しみを表す。「悲しむ」は簡明で自然であり、兄弟たちの動揺を過度に限定しない。
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: 自分自身に腹を立てたりしてはならない
  rationale: 直訳的には「あなたがたの目に燃えさせるな」という怒り・不快を表す慣用句。文脈上、自分たちの行為に対する怒りや自責を指すため、「自分自身に腹を立てる」とした。
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: 私をここへ売ったことで
  rationale: 兄弟たちがヨセフを売ったという人間側の行為を明確に保つ。הֵנָּה は移動の到達点を示すので「ここへ」とした。
- source_word: לְמִחְיָה
  choice: 命を救うため
  rationale: מִחְיָה は生命の維持・存続を表し、前置詞 לְ はここで目的を示す。「命を救うため」は自然で、神の派遣の生命保存的な目的を明瞭に伝える。
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: 神が……私を遣わされた
  rationale: 完了形を過去の行為として訳し、神が主体的にヨセフを遣わしたという本文の表現を弱めずに保つ。神を主語とする「遣わされた」は現代日本語の敬語慣用に沿う。
- source_word: לִפְנֵיכֶם
  choice: あなたがたより先に
  rationale: 空間的・時間的な先行をともに含み得る表現。兄弟たちの到着に先立ってヨセフが遣わされたという文脈を自然に表す。
theological_decisions:
- issue: 神の摂理と人間の行為
  choice: 兄弟たちの行為を「あなたがたが私を売った」、神の行為を「神が私を遣わされた」と、ともに明示する。
  alternative: 兄弟たちの行為を婉曲化する、または神の行為を単なる許容として表す。
  rationale: ヘブライ語本文は人間の責任ある行為と神の目的ある行為を並置している。どちらも弱めず、その緊張関係を解消しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、ヨセフの慰めの言葉にふさわしい落ち着きと威厳を保った。「だから今」で談話のつながりを示し、「悲しんだり、腹を立てたり」の並行表現によって原文の二つの禁止を自然に再現した。
