  naturalness: 「私をここへ売ったことで、悲しんだり、自分自身に腹を立てたりしてはならない」は明快で自然である。「命を保つために」とし、理由を「～のです」で結ぶと、現代標準日本語としてより滑らかで、ヨセフの慰めの発言にも適する。
