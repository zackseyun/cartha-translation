base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: ja
  text: こうしてヨセフは兄弟たちを送り出し、彼らは出発した。彼は兄弟たちに言った。「道中、言い争ってはならない。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「道中、動揺してはならない」「怒ってはならない」「恐れてはならない」。このヘブライ語動詞は、さまざまな感情の乱れを表し得る。ここでは、ヨセフが身を明かした後、兄弟たちが共に旅をするという文脈から、「言い争う」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 送り出し
  rationale: ピエル形がここでは自分のもとから行かせることを表すため、「遣わした」よりも、別れと出発の場面に自然な「送り出した」とした。
- source_word: אֶת־אֶחָיו
  choice: 兄弟たち
  rationale: ヨセフの男のきょうだいたちを指す親族名称を、そのまま明確に表した。日本語の「兄たち」ではベニヤミンを含めにくいため、「兄弟たち」とした。
- source_word: וַיֵּלֵכוּ
  choice: 彼らは出発した
  rationale: הלךの基本義は「行く」だが、送り出された後の連続した動作を自然に示すため「出発した」とした。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 彼は兄弟たちに言った
  rationale: 標準的な発話導入句として訳した。日本語では指示対象を明瞭にするため、代名詞だけでなく「兄弟たち」を補った。
- source_word: אַל
  choice: ～てはならない
  rationale: 否定命令を、威圧的すぎず格調を保つ現代日本語で表した。
- source_word: תִּרְגְּזוּ
  choice: 言い争って
  rationale: רגזは動揺、怒り、恐れ、震えなど幅のある感情的混乱を表し得る。ヨセフの告白後、兄弟たちが一緒に帰る直近の文脈では、互いに責め合うことへの戒めとして「言い争う」が自然。ただし語の広い意味は注に残した。
- source_word: בַּדָּרֶךְ
  choice: 道中
  rationale: カナンへ帰る旅の途中を指す。原文の簡潔さを保ちながら、現代日本語として自然な表現とした。
