id: GEN.45.8
reference: Genesis 45:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: ja
  text: ですから今、私をここへ遣わしたのは、あなたがたではなく、神なのです。神は私をファラオにとって父[a]とし、ファラオの家全体の主とし、エジプト全土を治める者とされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ファラオにとって父のような者」。ここでの「父」は、有力な保護者、助言者、または恩人としての役割を表す比喩。
    reason: אָב の比喩的な意味を説明しつつ、本文では原文の表現を保持するため。
lexical_decisions:
- source_word: וְעַתָּה
  choice: ですから今
  rationale: 接続の וְ と、直前までの和解の言葉を受けて結論を導く עַתָּה の談話的な働きを、自然な現代日本語で表した。
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה כִּי הָאֱלֹהִים
  choice: 私をここへ遣わしたのは、あなたがたではなく、神なのです
  rationale: 明示された אַתֶּם と否定後の対比的な כִּי を、「あなたがたではなく、神」という強い対照で再現した。הֵנָּה はエジプトを指す「ここ」とした。
- source_word: וַיְשִׂימֵנִי
  choice: 神は私を…とされました
  rationale: 神がヨセフを現在の地位に置いた行為を表す。日本語では主語を補って前文とのつながりを明確にし、敬意を含む「されました」を用いた。
- source_word: לְאָב לְפַרְעֹה
  choice: ファラオの父
  rationale: אָב の比喩を狭く「助言者」などと解釈せず、「父」という原文の像を本文に保持した。意味領域は脚注で示した。
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: その全家の主
  rationale: אָדוֹן が表す権威を「主」とし、בֵּיתוֹ は家族・家政・王宮組織を含み得る幅を残すため「家」と訳した。
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土を治める者
  rationale: מֹשֵׁל は統治権を行使する者を表すため、特定の官職名に限定せず「治める者」とした。אֶרֶץ の領域的な広がりは「全土」で表した。
theological_decisions:
- issue: 神の主権と兄弟たちの人間的行為
  choice: 「あなたがたではなく、神」と原文の強い修辞的対照をそのまま保った。
  alternative: 兄弟たちの行為を否定しないよう対照を弱める、または摂理について説明的に言い換える。
  rationale: この発言は神の決定的な目的を強調する一方、物語全体では兄弟たちが実際にヨセフを売ったことも保たれている。翻訳ではその緊張を体系的説明によって解消しない。
- issue: 「ファラオの父」という比喩
  choice: 比喩を本文に保持し、脚注で役割上の意味を補った。
  alternative: 「ファラオの助言者」または「後援者」と本文で解釈的に訳す。
  rationale: 「父」は保護者、恩人、重臣、助言者などを示し得る広い比喩であり、一つの職能に限定すると原文の含意を狭める。
translation_notes:
  register: 明快な現代標準日本語を用いながら、ヨセフの厳粛な宣言にふさわしい品位を保った。「ファラオ」「エジプト」は一般に通用する現代表記とした。三つの地位は並列を保ち、原文の反復される接続関係を日本語の「…とし」で表した。
