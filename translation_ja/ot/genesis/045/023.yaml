  - severity: medium
    issue: 「旅の間の父の食料」はלַדָּרֶךְの目的用法を時間的限定として読ませうる。
    rationale: 原文は父の旅のために用意された物資を示す。「父が旅に備えるための食料」とすれば、旅のためという用途を自然かつ正確に表せる。
  revised_text: 父には次のものを送った。エジプトの最上の品々を載せたろば十頭と、穀物、パン、父が旅に備えるための食料を載せた雌ろば十頭を。
