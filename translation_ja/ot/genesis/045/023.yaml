  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: ja
  text: 父には次のものを送った。エジプトの最上の品々を載せたろば十頭と、穀物、パン、父が旅に備えるための食料を載せた雌ろば十頭を。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּזֹאת
  choice: （日本語では明示せず、後続の内容で表現）
  rationale: 送った物の一覧を導く表現。日本語で「このようなものを」と置くより、目的語をそのまま続けるほうが自然で、内容も失われない。
- source_word: חֲמֹרִים
  choice: ろば
  rationale: 現代日本語で明瞭な一般名称。後半の雌ろばとの原文上の区別も保てる。
- source_word: נֹשְׂאִים
  choice: 載せた
  rationale: 荷を運ぶ動物についての分詞を、自然な日本語で表した。「積んだ」も可能だが、動物の背に荷を置く文脈では「載せた」が明瞭。
- source_word: מִטּוּב מִצְרָיִם
  choice: エジプトの最上の品々
  rationale: טוּבの品質・豊かな産物という含みを保ち、品目を不必要に限定しない。分格的なמִןは、日本語では複数的な「品々」により自然に含意される。
- source_word: אֲתֹנֹת
  choice: 雌ろば
  rationale: 前半の一般的な「ろば」と異なり、原文が雌を明示していることを保持する。
- source_word: בָּר
  choice: 穀物
  rationale: 特定の穀類に限定せず、語の一般的意味を正確に表す。
- source_word: לֶחֶם
  choice: パン
  rationale: 通常の具体的意味を保持し、「食物」と一般化しない。
- source_word: מָזוֹן
  choice: 食料
  rationale: 旅のための糧を指す文脈に自然で、直前の「パン」とも区別できる。
- source_word: לַדָּרֶךְ
  choice: 旅の間の
  rationale: 父が旅をする際に用いる食料という目的を、自然な現代日本語で表す。
