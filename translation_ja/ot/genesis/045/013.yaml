  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: ja
  text: 父に、エジプトでの私のすべての栄誉[a]と、あなたがたが見たすべてのことを伝えてください。急いで父をここへ連れて来てください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エジプトでの私のすべての栄光（または威光）」。ヘブライ語は、栄誉、栄光、威光などを意味し得る。ここでは、エジプトでヨセフに与えられた高い地位と栄誉を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: 伝えてください
  rationale: ヒフィル形は「知らせる、告げる」の意。兄弟たちへの直接の指示として、現代日本語で自然かつ丁寧な命令表現とした。
- source_word: כָּל כְּבוֹדִי
  choice: 私が受けている大きな栄誉
  rationale: כבוד は栄誉、威光、栄華などを表し得る。ここではエジプトにおけるヨセフの高い地位と、それに伴う栄誉を指す。「すべての栄誉」という不自然さを避けつつ、כָּל の広がりを「大きな」で表した。
- source_word: בְּמִצְרַיִם
  choice: エジプトで
  rationale: ヨセフが栄誉を受けている場所を示す自然な場所表現。
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: あなたがたが見たすべてのこと
  rationale: 兄弟たちが実際に目撃した事柄を余さず指す、原文に近く自然な表現。
- source_word: מִהַרְתֶּם
  choice: 急いで
  rationale: 文脈上の命令的な力と緊急性を簡潔に表す。
- source_word: הוֹרַדְתֶּם
  choice: 連れて来てください
  rationale: ヒフィル形は直訳すれば「下らせる」。エジプトへの移動を「下る」と捉える原文の方向感覚はあるが、日本語で「ここへ下らせる」は不自然なため、目的地への同行・移送を自然に表した。
- source_word: הֵנָּה
  choice: ここへ
  rationale: 話者ヨセフのいる場所を目的地として示す。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で品位ある直接話法。「父」は文脈上ヨセフ自身の父を指すため、そのまま簡潔にした。原文冒頭の接続詞は前節との連続性を担うが、単独節としての自然さを優先して明示しなかった。
