base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: ja
  text: というのも、この地では飢饉がもう二年続いており[a]、これからなお五年間、耕すことも刈り入れることもないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「地のただ中で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: というのも……からです
  rationale: 直前の発言の理由を示す接続を、日本語として自然な説明表現で示した。
- source_word: זֶה שְׁנָתַיִם
  choice: もう二年
  rationale: 現在までに二年間が経過したことを表すヘブライ語の時の表現を、明瞭な現代日本語にした。
- source_word: הָרָעָב
  choice: 飢饉
  rationale: 物語ですでに語られている特定の飢饉を指す。日本語では文脈上、定冠詞を明示する必要がない。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: この地では
  rationale: 字義的には「地のただ中で」だが、ここではその地域内で飢饉が続いていることを自然に表す。「地」は文脈上、世界全体ではなく当地を指す。
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: さらに五年
  rationale: 現在からなお五年が残っているという継続と将来性を簡潔に表した。
- source_word: אֲשֶׁר אֵין
  choice: ……こともない
  rationale: これからの五年間を説明する関係節。日本語では「さらに五年」との組み合わせで未来の意味が明らかになる。
- source_word: חָרִישׁ
  choice: 耕すこと
  rationale: 土地を耕す農作業を指す。現代の一般読者に分かりやすい動詞表現とした。
- source_word: קָצִיר
  choice: 刈り入れること
  rationale: 収穫の行為または時期を指す語を、対になる「耕すこと」と調和する表現で訳した。
