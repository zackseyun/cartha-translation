source:
  edition: WLC
  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: ja
  text: 急いで私の父のところへ上り、父に言いなさい。『あなたの息子ヨセフがこう言っています。神は私を全エジプトの主君とされました。私のところへ下って来てください。ぐずぐずしないでください[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ためらわないでください」。直訳「立ち止まってはなりません」。
    reason: אַל תַּעֲמֹדは字義的には立ち止まることを禁じるが、ここでは滞在して出発を延ばしたり、ぐずぐずしたりしないよう求める意味である。
lexical_decisions:
- source_word: מַהֲרוּ
  choice: 急いで
  rationale: 複数への命令が持つ切迫感を、自然な現代日本語で表す。
- source_word: וַעֲלוּ אֶל אָבִי
  choice: 私の父のところへ上り
  rationale: カナンへの移動を「上る」とする原文の地理的な方向表現を保ちつつ、目的地を自然に示す。
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: 父に言いなさい
  rationale: 先行する命令に続く指示として明確に訳し、代名詞の指示対象も日本語で明らかにする。
- source_word: כֹּה אָמַר בִּנְךָ יוֹסֵף
  choice: あなたの息子ヨセフがこう言っています
  rationale: 使者の伝言を導入する定型句を、格式を失わない自然な現代日本語で表す。
- source_word: שָׂמַנִי אֱלֹהִים
  choice: 神は私を……とされました
  rationale: שׂים がここで地位に就けることを表すため、「置く」ではなく役割への任命を自然に示す。
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: 全エジプトの主
  rationale: אָדוֹן の権威ある地位を保ち、「支配者」など特定の政治的官職に狭めない。
- source_word: רְדָה אֵלַי
  choice: 私のところへ下って来てください
  rationale: エジプトへの下降を保ち、話者ヨセフを目的地とする日本語として「来る」を用いる。父への言葉なので丁寧な依頼形としたが、強い要請は文脈上保たれる。
- source_word: אַל תַּעֲמֹד
  choice: 遅れてはなりません
  rationale: 字義は「立ち止まるな」だが、この文脈では滞在・遅延を禁じる慣用的意味であり、急ぐよう促す意図を明瞭にする。
theological_decisions:
- issue: ヨセフの宣言における אֱלֹהִים の訳
  choice: 神
  alternative: 神々／ある神
  rationale: 動詞および文脈は単数の神を指し、ヨセフが自らの地位を神の働きに帰しているという原文の明白な意味を反映する。
- issue: לְאָדוֹן における称号の訳
  choice: 主
  alternative: 支配者／主人
  rationale: ヨセフの権威を示す称号の幅を保つ。「主」はここで神の称号ではなく、エジプト全域に対して権威を持つ者を意味する。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。ヨセフが父に伝える言葉では丁寧形を用いた一方、使者たちへの冒頭の命令は直接的な命令形を保った。「上る／下る」により、カナンとエジプトの間の原文の方向表現を保存した。
