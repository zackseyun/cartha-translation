- from: 急いで私の父のところへ上り、父に言いなさい。『あなたの息子ヨセフがこう言っています。神は私を全エジプトの主とされました。私のところへ下って来てください。遅れてはなりません[a]。』」
  to: 急いで私の父のところへ上り、父に言いなさい。『あなたの息子ヨセフがこう言っています。神は私を全エジプトの主君とされました。私のところへ下って来てください。ぐずぐずしないでください[a]。』
  rationale: 余分な閉じ引用符を除去した。終結命令を「ぐずぐずしないでください」として、父への丁寧な呼びかけを保ちながら、原文の切迫した『滞るな』という趣旨をより直接的に表した。「主君」は、אָדוֹןが指す非神的な高い権威を自然な日本語で示すための最小限の語調整である。
