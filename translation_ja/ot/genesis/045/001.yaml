- from: ヨセフは、そばに立っているすべての人の前で、もはや自分を抑えていることができなくなり、声を上げて言った。「皆を私のもとから退出させよ。」そこで、ヨセフが兄弟たちに自分のことを明かしたとき、彼とともに残っている者は一人もいなかった。
  to: ヨセフは、そばに立っているすべての人の前で、もはや自分を抑えきれなくなり、声を上げて言った。「皆を私の前から出しなさい。」そして、ヨセフが兄弟たちに自分が誰であるかを明かしたとき、彼とともに残っている者は一人もいなかった。
