  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: ja
  text: ヨセフは、そばに立っているすべての人の前で、もはや自分を抑えきれなくなり、声を上げて言った。「皆を私の前から出しなさい。」そして、ヨセフが兄弟たちに自分が誰であるかを明かしたとき、彼とともに残っている者は一人もいなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָכֹל לְהִתְאַפֵּק
  choice: 自分を抑えていることができなくなり
  rationale: 能力を表す יכל と、再帰的な自制を表す התאפק の双方を明示し、感情の種類を本文以上に限定しない表現とした。
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: そばに立っているすべての人の前で
  rationale: נצב の「立っている」と、עליו がこの文脈で示す近接・随伴を保った。「家臣」や「従者」とは限定しなかった。
- source_word: וַיִּקְרָא
  choice: 声を上げて言った
  rationale: 単なる発話ではなく、大声で呼びかける動詞の力を自然な日本語で表した。
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: 皆を私のもとから退出させよ
  rationale: 使役形の複数命令を保ち、כָל אִישׁ は日本語として自然な総称「皆」とした。מֵעָלָי はヨセフのいる所から離れさせる意味で訳した。
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: 彼とともに残っている者は一人もいなかった
  rationale: עמד の字義は「立つ」だが、ここではその場に居残ることを意味するため、文脈上の意味を明確にした。
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: ヨセフが兄弟たちに自分のことを明かしたとき
  rationale: התודע の再帰的・開示的な意味を表し、「正体」のような本文にない含みは加えなかった。
