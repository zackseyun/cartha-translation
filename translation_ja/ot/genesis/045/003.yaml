base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: ja
  text: そこでヨセフは兄弟たちに言った。「私はヨセフです。父はまだ生きていますか。」しかし兄弟たちは、彼を前にして動転し、答えることができなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、直前の展開を受ける自然な現代日本語で表した。
- source_word: אֶל אֶחָיו
  choice: 兄弟たちに
  rationale: ヨセフの男のきょうだいたちを指す文脈に即し、発話の相手として訳した。
- source_word: אֲנִי יוֹסֵף
  choice: 私はヨセフです
  rationale: 明示的な自己同定を保持し、固有名は日本語聖書で定着した表記を用いた。
- source_word: הַעוֹד אָבִי חָי
  choice: 父はまだ生きていますか
  rationale: 状態の継続を問う עוֹד を「まだ」で表し、一人称接尾辞を伴う אָבִי は文脈上自然な「父」とした。
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: しかし……答えることができなかった
  rationale: 対照的な展開を「しかし」で示し、יכולתを表す יכל と発話による応答を表す ענה を明確に訳した。
- source_word: נִבְהֲלוּ
  choice: 動転し
  rationale: בהל のニファルが示す、突然の衝撃によって強く取り乱し、応答できない状態を、恐怖に限定しすぎない自然な日本語で表した。
- source_word: מִפָּנָיו
  choice: 彼を前にして
  rationale: 直訳的な「彼の顔／面前から」というヘブライ語表現を踏まえ、ヨセフの面前で受けた衝撃を自然に表した。
