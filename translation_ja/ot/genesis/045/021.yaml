  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: ja
  text: イスラエルの息子たちはそのとおりにした。ヨセフはファラオの命令に従って彼らに荷車を与え、旅のための食糧も与えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: そのとおりにした
  rationale: 直前に指示されたことを実行したという意味を、自然な現代日本語で表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たち
  rationale: この文脈ではヤコブ（イスラエル）の男子たちを指すため、字義と指示対象の双方を明確にする。
- source_word: עֲגָלוֹת
  choice: 荷車
  rationale: 人や物を運ぶ車両を指し、この物語の古代的な場面にも合う一般的な日本語である。
- source_word: עַל פִּי פַרְעֹה
  choice: ファラオの命令に従って
  rationale: 字義は「ファラオの口に従って」だが、命令に基づくことを表すヘブライ語の慣用句なので、その意味を明瞭に訳す。
- source_word: צֵדָה לַדָּרֶךְ
  choice: 旅のための食糧
  rationale: צֵדָה は旅に携える糧・食料を指す。ここでは簡潔で自然な「旅のための食糧」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「イスラエルの息子たち」により、民族全体ではなくこの場面のヤコブの息子たちを指すことを保った。接続詞の反復は、日本語として読みやすい二文構成で表現した。
