base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: ja
  text: 「ヨセフの兄弟たちが来た」との知らせがファラオの宮廷に伝わった。ファラオもその家臣たちも、これを喜ばしく思った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: 知らせが……伝わった
  rationale: 直訳的には「声／音が聞かれた」だが、後続する「ヨセフの兄弟たちが来た」という内容を受けるため、ここでは「知らせが伝わった」が文脈に即した自然な日本語となる。
- source_word: בֵּית פַּרְעֹה
  choice: ファラオの宮廷
  rationale: 字義は「ファラオの家」だが、この文脈では王の家政・宮廷を指す。「宮廷」は場所だけでなく、知らせを聞いた王室関係者を自然に表す。
- source_word: לֵאמֹר
  choice: 「……」との
  rationale: 報告の内容を導く不定詞であり、日本語では引用を受ける「との」によって簡潔かつ自然に表した。
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: ヨセフの兄弟たちが来た
  rationale: 完了した到着を表す。日本語では引用内の出来事として自然な過去形「来た」を用いた。
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: これを喜んだ
  rationale: 字義的な「目に良かった」は、好意的に受け止めた、喜ばしく思ったというヘブライ語慣用句である。現代日本語として明瞭な「喜んだ」とした。
- source_word: עֲבָדָיו
  choice: その家臣たち
  rationale: 王宮の文脈で עֶבֶד は王に仕える者・役人を指し得る。「僕」よりも身分関係と宮廷的背景が分かりやすい「家臣」を選んだ。
