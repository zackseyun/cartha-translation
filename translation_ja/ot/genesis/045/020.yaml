  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: ja
  text: また、家財を惜しんではならない[a]。エジプト全土の最も良いものは、あなたがたのものなのだから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの目が、あなたがたの家財を惜しまないようにせよ」。家財を残すことに未練を抱いたり、心配したりしないように、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: また、…惜しんではならない
  rationale: 「目」を主語とするヘブライ語の慣用表現は、日本語で直訳すると不自然になるため、家財を手放すことへの未練や心配を表す「惜しむ」で自然に伝えた。接続詞 וְ は「また」とした。原文の比喩は脚注に残した。
- source_word: עַל־כְּלֵיכֶם
  choice: 家財を
  rationale: כְּלִי は器具、品物、持ち物などを広く指す。この文脈では移住の際に残す所持品・家財を意味するため、「家財」が簡潔で自然である。前置詞 עַל は日本語の動詞「惜しむ」の目的語として処理した。
- source_word: כִּי
  choice: …なのだから
  rationale: 先の命令の理由を示す接続詞なので、理由説明を自然に表す文末表現とした。
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: エジプト全土の最も良いもの
  rationale: טוּב はここでは抽象的な「善」ではなく、土地が提供する良質な物や恵みを指す。「最も良いもの」として、最上の物資・産物を含み得る幅を保った。כָּל־אֶרֶץ は「全土」とした。
- source_word: לָכֶם הוּא
  choice: あなたがたのもの
  rationale: 前置詞 לְ と代名詞による所有・帰属の強調を、自然な日本語の「あなたがたのもの」で表した。
