  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: ja
  text: そこで私はあなたを養います。飢饉はなお五年続くからです。あなたも、あなたの家の者も、あなたの家全体も窮乏に陥らないようにするためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: 私は…養います
  rationale: כלכלのピエル形は、食糧など必要なものを供給して扶養することを表す。「養う」は文脈に即し、簡潔で自然。
- source_word: רָעָב
  choice: 飢饉
  rationale: 単なる空腹ではなく、地域的な食糧欠乏を指すため。
- source_word: תִּוָּרֵשׁ
  choice: 困窮してしまう
  rationale: ירשのニファル形で、貧しくなる・窮乏する意。家族と財産を含む主語全体に自然にかかる表現とした。
theological_decisions:
- issue: כִּיの論理関係
  choice: 飢饉はなお五年続くからです
  alternative: 飢饉がなお五年あるので
  rationale: ヨセフが養う理由を明示する因果関係として保持した。
- issue: פֶּןの警告・防止の含意
  choice: そうしなければ…困窮してしまうでしょう
  alternative: …困窮することのないように
  rationale: פֶּןが示す望ましくない結果への懸念を明確にしつつ、それが確定した予言であるかのようには訳さない。
translation_notes:
  register: 現代標準語による、明瞭で品位ある語り口。ヨセフが父に直接語る文脈に合わせて敬語化せず、「あなた」を用いた。
