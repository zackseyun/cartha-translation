revisions:
- from: そこで私はあなたを養います。飢饉はなお五年続くからです。そうしなければ、あなたも、あなたの家族も、あなたの持つすべてのものも、困窮してしまうでしょう。
  to: そこで私はあなたを養います。飢饉はなお五年続くからです。あなたも、あなたの家の者も、あなたの家全体も窮乏に陥らないようにするためです。
  rationale: 原文の「あなた、あなたの家、あなたに属するすべてのもの」という重ねた列挙が指す包括性を、「あなた」「家の者」「家全体」により自然な日本語で表した。「～ないようにするためです」により、פֶּןが表す回避すべき結果を、確定的な予言にせず保持した。
