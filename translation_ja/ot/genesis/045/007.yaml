base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: ja
  text: 神は、地にあなたがたのために生き残る者を残し[a]、大いなる救いを得させるためにあなたがたを生き長らえさせるため[b]、私をあなたがたより先に遣わされたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生き残る者を残し」は、「残りの者を置き」、「生存者を残し」、または「子孫を存続させ」とも訳せる。ヘブライ語は、残った者、生存者、後代の子孫を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「大いなる救いを得させるために」は、「大いなる逃れのために」または「大勢の生存者を残すために」とも訳せる。ヘブライ語は、救出・逃れそのものと、その結果として生き残った人々のどちらを強調するとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: 私を遣わされた
  rationale: 物語を進める過去の行為を表す。日本語では神への敬意を自然に示す「遣わされた」とした。
- source_word: לִפְנֵיכֶם
  choice: あなたがたより先に
  rationale: 直訳の「あなたがたの前に」ではなく、ヨセフが家族に先立ってエジプトへ来たという時間的先行を明確にした。
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: あなたがたのために残る者を保ち
  rationale: שׂוּם は本来「置く、定める」だが、ここでは שְׁאֵרִית と結びつき、生き残る者を存続させる意味を表す。「残りの者」より自然な「残る者」を採用した。
- source_word: בָּאָרֶץ
  choice: 地に
  rationale: אֶרֶץ の局地的な意味を保ちつつ、文脈上どの土地かを過度に限定しない表現とした。
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: あなたがたを生き長らえさせる
  rationale: חיה のヒフィル形が表す「生かしておく、命を保つ」を、飢饉の文脈に即した自然な日本語で表した。
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: 大いなる救いによって
  rationale: פְּלֵיטָה は逃れること、救出、または生き残った者を指し得る。本文では神の保存の働きによる大規模な救済という理解を採り、係り受けを明瞭にした。
theological_decisions:
- issue: שְׁאֵרִית を神学的響きのある「残りの者」とするか、文脈的な「生存者」とするか
  choice: 残る者
  alternative: 生存者／子孫
  rationale: 「残ったもの・者」という原語の基本像と聖書内の響きを保ちながら、日本語として過度に専門的な定型句にしないため。
- issue: לִפְלֵיטָה גְּדֹלָה が救出の出来事を指すか、生き残る人々を指すか
  choice: 大いなる救いによって
  alternative: 大勢の生存者として／大いなる逃れのために
  rationale: 「生き長らえさせる」との関係から救済の結果・手段として読む一方、人物集団を指す可能性は脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。ヨセフの発言として「私」、兄弟たちへの呼びかけとして「あなたがた」を用いた。原文の目的を表す二つの不定詞句の並行関係を保ちつつ、日本語では長い修飾部を先に置いて文意を明確にした。
