  yaml_path: translation/ot/genesis/045/014.yaml
  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: ja
  text: ヨセフは弟ベニヤミンの首に抱きついて泣き、ベニヤミンもヨセフの首に抱きついて泣いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を直訳すると、前半は「弟ベニヤミンの首々に倒れかかって」、後半は「ベニヤミンは彼の首に泣いた」となる。前半の「首々」はヘブライ語では複数形だが、抱擁の場面で首のあたりを指す慣用的な表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל עַל צַוְּארֵי
  choice: 首に抱きついて
  rationale: 直訳は「首の上に倒れかかって」だが、再会の抱擁を表すヘブライ語の慣用表現であるため、現代日本語で自然かつ動作の具体性を保つ「首に抱きついて」とした。
- source_word: בִנְיָמִן אָחִיו
  choice: 弟ベニヤミン
  rationale: אָחִיו は「彼の兄弟」。文脈上ベニヤミンはヨセフの弟であり、日本語では「彼の兄弟ベニヤミン」より「弟ベニヤミン」が自然で、家族関係も明示できる。
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: 泣き／泣いた
  rationale: בכה の基本的な意味を、感情的な再会の場面にふさわしい平明な現代語「泣く」で一貫して表した。
- source_word: וּבִנְיָמִן
  choice: ベニヤミンも
  rationale: 接続詞 waw による後続動作を示しつつ、相互に泣いたことを自然な日本語で示すため「も」とした。
- source_word: עַל צַוָּארָיו
  choice: ヨセフの首に抱きついて
  rationale: 原文は代名詞接尾辞で「彼の首に」だが、日本語では指示対象を明確にするため「ヨセフの首に」とした。抱擁の慣用的意味は前半とそろえた。
