  text: וַ/יַּגִּ֨דוּ ל֜/וֹ לֵ/אמֹ֗ר ע֚וֹד יוֹסֵ֣ף חַ֔י וְ/כִֽי ה֥וּא מֹשֵׁ֖ל בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם וַ/יָּ֣פָג לִבּ֔/וֹ כִּ֥י לֹא הֶאֱמִ֖ין לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: ja
  text: 彼らは父に告げた。「ヨセフはまだ生きています。しかも、エジプト全土を治めています。」しかし、彼は茫然とした[a]。彼らの言葉を信じなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼の心は弱った」。あるいは「彼の心はしびれた」「彼の心は気を失った」とも訳せる。ヘブライ語は、この知らせを聞いたヤコブが衝撃のあまり茫然とし、気力を失った状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: 彼らは父に告げた
  rationale: נגדのヒフィル形は「告げる、報告する」の意。代名詞の指示対象であるヤコブを文脈に即して「父」とし、לֵאמֹרは後続の直接話法によって自然に表した。
- source_word: עוֹד יוֹסֵף חַי
  choice: ヨセフは今も生きています
  rationale: עוֹדは生存状態の継続を示すため、「まだ」よりも、驚くべき知らせとして自然な「今も」を採用した。
- source_word: וְכִי
  choice: そればかりか
  rationale: 第二の報告内容を加える接続表現。単なる「そして」より、ヨセフの生存に加えて統治者であるという驚くべき情報が重なる流れを自然な日本語で示した。
- source_word: מֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土を治めています
  rationale: מֹשֵׁלは支配・統治を行う者を表す分詞。特定の官職名に狭めず、動詞「治める」で統治権を明確にした。
- source_word: וַיָּפָג לִבּוֹ
  choice: 父は心が凍りついたようになった
  rationale: פוגは弱る、感覚を失う、茫然とする状態を表し得る。日本語で比喩を保ちつつ、突然の知らせに衝撃を受けて反応できない内面を自然に表現した。意味の幅は脚注に示した。
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: 彼らの言うことを信じられなかったのである
  rationale: כִּיの因果関係を「のである」で示した。単なる意志的拒否より、あまりの知らせに信じることができない文脈を自然に表した。
