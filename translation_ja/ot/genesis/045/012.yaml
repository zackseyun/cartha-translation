  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: ja
  text: 見なさい[a]。あなたがたの目も、私の弟ベニヤミンの目も、私自身の口があなたがたに語っているのを見ているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「見よ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: さあ
  rationale: 相手の注意を強く促す談話上の働きを、現代日本語で自然に表した。「見よ」という直訳的な表現は脚注に示した。
- source_word: עֵינֵיכֶם רֹאוֹת וְעֵינֵי אָחִי בִנְיָמִין
  choice: あなたがたの目も、私の弟ベニヤミンの目も……見ています
  rationale: 直接目にして確認しているという強調と、「目」を反復するヘブライ語の並行構造を保った。
- source_word: כִּי
  choice: ……ことを
  rationale: ここでは、彼らの目が確認している内容を導く接続詞として解した。
- source_word: פִי
  choice: この私の口
  rationale: ヨセフ自身が通訳を介さず直接語っていることを強調する具体的な「私の口」を保持し、「この」によって指示的な強調を自然に表した。
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: 今あなたがたに語っている
  rationale: 定冠詞付き分詞が表す、現に進行している直接の発話を自然な日本語で示した。
