lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: 彼らには一人一人に
  rationale: 「彼ら全員に」と「各人に」という重なった分配表現を、自然な日本語で一人ずつ全員に与えたことが明確になるように訳した。
- source_word: נָתַן
  choice: 与えた
  rationale: 贈り物を渡す場面に即した、平明で標準的な訳語。
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: 着替えの衣服（を）一そろい／五そろい
  rationale: 取り替えて着る衣服の組を指す表現として訳した。前半は分配表現に従い、一人につき一そろいであることを示した。
- source_word: וּלְבִנְיָמִן
  choice: しかしベニヤミンには
  rationale: 接続詞が示す、ほかの兄弟への贈り物とベニヤミンへの特別な贈り物との対比を自然に表した。
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: 銀三百
  rationale: 原文には「シェケル」などの貨幣・重量単位が明記されていないため、特定の単位や「銀貨」を補わず、数値の曖昧さを保持した。
