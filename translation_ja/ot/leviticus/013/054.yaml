base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: ja
  text: 祭司は、異常のある物[a]を洗うよう命じ、それを再び七日間隔離する[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その中に異常のしるしがあるもの」。検査対象となっている品を広く指す表現。
    reason: lexical_alternative
  - marker: b
    text: または「閉じ込めておく」。検査のため、ほかから分けておくことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: 祭司は……命じ
  rationale: 律法上の手順を示すワウ接続完了形を、現代日本語で自然な規定・手順の表現とした。
- source_word: וְכִבְּסוּ
  choice: 洗うよう
  rationale: 動詞は三人称複数形で、祭司の命令を受けて名の明示されない人々が洗うことを表す。日本語では行為者を補わず、「洗うよう命じ」とするのが自然である。
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: 患部のある物
  rationale: 文脈上、検査対象となっている衣服や革製品などを指すが、ヘブライ語自体は対象を広く表しているため、「物」として限定を避けた。נגעは対象に現れた異常な箇所を指す語として「患部」とした。
- source_word: וְהִסְגִּירוֹ
  choice: それを……隔離する
  rationale: 検査のために閉じ込めて別にしておく処置を、現代日本語で明瞭に表した。
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: もう一度、七日間
  rationale: 二度目の七日間の隔離であることを、自然な語順で明示した。
