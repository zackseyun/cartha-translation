  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: ja
  text: もし皮膚の疾患[a]が皮膚全体に広がり、その疾患が、祭司の目に見えるかぎり、その人の皮膚全体を頭から足まで覆っているなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ツァラアトは、レビ記では儀礼上の扱いを必要とするさまざまな皮膚の異常を指し、現代医学でいうハンセン病だけに限定することはできない。
    reason: cultural_note
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: 広がり
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を、文脈上、皮膚全体へ広範に及ぶこととして自然な日本語で表した。
- source_word: הַצָּרַעַת
  choice: 皮膚の疾患
  rationale: レビ記のצָרַעַתは現代医学のハンセン病だけを指す語ではないため、誤った限定を避けつつ理解しやすい表現とした。
- source_word: בָּעוֹר
  choice: 皮膚全体に
  rationale: בはここでは疾患が及ぶ身体表面を示す。「全体に」は後続する全身の描写と強意表現を自然につなぐ。
- source_word: וְכִסְּתָה
  choice: 覆っている
  rationale: 条件節内で、診察時に認められる状態を表す継続的な日本語表現とした。
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: 患部の皮膚を
  rationale: 直訳は「患部（病変）の皮膚すべて」。曖昧さを過度に解消せず、日本語として理解可能な形にした。
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: 頭から足まで
  rationale: 全身を示すメリズムを簡潔かつ自然に保持した。日本語では所有代名詞を補わなくても当人の身体と明瞭に分かる。
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: 祭司の目に見えるかぎり
  rationale: 祭司の診察で視認できる全範囲を示すヘブライ語の慣用表現を、明瞭な現代日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文が13節へ続く条件節であるため、文末を「なら、」として継続性を保持した。「患部の皮膚」は原文の「病変・患部の皮膚」を比較的形式的に保ち、対象者の全皮膚と断定的に言い換えることを避けた。
