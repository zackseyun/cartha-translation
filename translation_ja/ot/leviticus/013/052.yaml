source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: ja
  text: その衣服、または羊毛か亜麻の縦糸もしくは横糸、あるいは異常のある革製品を焼かなければならない。それは悪性のツァラアト[a]だからである。火で焼かなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は伝統的に「らい病」と訳されてきたヘブライ語だが、現代のハンセン病だけを指す語ではない。レビ記では、人の皮膚だけでなく、衣服や家に生じる異常にも用いられる祭儀上の汚れの分類である。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: 焼かなければならない
  rationale: 祭司に対する法的・手続き的な命令として、現代日本語で義務を明確に表した。
- source_word: הַבֶּגֶד
  choice: その衣服
  rationale: בגד の一般的な意味を保ち、直前まで検査対象となっている特定の衣服を指す文脈も表した。
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: 縦糸もしくは横糸
  rationale: 織物の二つの技術用語を、一般読者にも理解しやすい現代日本語の標準的な対語で訳した。
- source_word: בַּצֶּמֶר אוֹ בַפִּשְׁתִּים
  choice: 羊毛か亜麻の
  rationale: 素材を示す句として自然な日本語にし、亜麻は原料およびその繊維を指し得る語として訳した。
- source_word: כָּל כְּלִי הָעוֹר
  choice: 革製品
  rationale: כל の包括性は日本語の無冠詞的な総称に含め、כלי の幅広い意味を「製品」で表した。
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: その患部のある
  rationale: נגע はここで物に現れた異常箇所を指すため、現代医学的な感染と断定せず「患部」とした。
- source_word: צָרַעַת מַמְאֶרֶת
  choice: 悪性のツァラアト
  rationale: צָרַעַת は人だけでなく衣服や家にも用いられる祭儀上の分類であり、「皮膚病」とすると本節では不自然になる。音写で語の同一性を保ち、ממארת は破壊的・しつこい性質を示す「悪性」とした。
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: 火で焼かなければならない
  rationale: 受動形の規定的な力を、日本語では義務表現により自然かつ明確に示した。
theological_decisions:
- issue: צָרַעַת の祭儀的分類と現代の病名との関係
  choice: ツァラアト
  alternative: 重い皮膚病／らい病
  rationale: この語はレビ記で人体以外の衣服や家にも適用され、現代のハンセン病や一般的な皮膚病と同一視できない。音写により範囲を狭めず、注で説明した。
- issue: מַמְאֶרֶת の意味合い
  choice: 悪性の
  alternative: 腐食性の／破壊的な／広がる
  rationale: 語は有害で根深い、または食い荒らすような性質を表し得る。「悪性」は医学的診断に限定せず、その深刻で有害な性質を簡潔に表す。
translation_notes:
  register: 明瞭で現代的な法令調を用いた。織物用語は「縦糸／横糸」として専門性と理解しやすさを両立させた。原文末尾の焼却命令の反復は、強調と規定の構造を保つため省略しなかった。
