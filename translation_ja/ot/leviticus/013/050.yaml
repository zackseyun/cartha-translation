  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: ja
  text: 祭司はその異常の見られる物[a]を調べ、その物を七日間、隔離しておく[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その異常のしるし」または「その斑点」。直前の文脈では、衣服や革製品に現れたしるしを指す。ヘブライ語は現代医学上の特定の病気を意味するとは限らない。
    reason: lexical_alternative
  - marker: b
    text: 直訳「閉じ込めておく」。経過を見るため、一時的にほかから分けておくことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べ
  rationale: 基本義は「見る」だが、ここでは祭司が判定のために行う正式な検査を表すため、「調べる」とした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記における כֹּהֵן の標準的で明瞭な訳語。定冠詞の指示性は文脈に沿って「祭司は」で表した。
- source_word: הַנָּגַע / הַנֶּגַע
  choice: その患部
  rationale: נגע はここで、祭司の検査対象となる異常のしるし、またはその生じた箇所を指す。現代医学上の特定の病名に限定せず、衣類などについても用いうる「患部」とした。二度の出現を同じ訳語で保った。
- source_word: וְהִסְגִּיר
  choice: 隔離しておく
  rationale: ヒフィル形は文字どおりには「閉じ込める」であり、経過観察のため一時的に別にしておく処置を指す。「隔離しておく」は期間中の継続性も自然に伝える。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す構文として、現代日本語で簡潔かつ自然に訳した。
