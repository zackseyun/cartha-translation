  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: ja
  text: 祭司がその患部を調べ、見よ、その外見が皮膚よりも深く見え、そこに黄色く細い毛が生えているなら、祭司はその人を汚れていると宣告する。これはネテク[a]、すなわち頭またはひげの皮膚病[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ネテク」に当たるヘブライ語 נֶתֶק が指す厳密な病状は不明。伝統的には「かいせん」などと訳されるが、頭やひげの部分に生じる特定の病変を指す。
    reason: lexical_alternative
  - marker: b
    text: ここで「皮膚病」と訳したヘブライ語 צָרַעַת（ツァラアト）は、広い範囲の皮膚疾患を指す語であり、現代医学でいうハンセン病だけを指すものではない。
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: 患部
  rationale: 祭司が目で調べる、病変の現れている箇所を指す。「災い」「傷」などよりも、現代日本語で文脈に即して明瞭である。
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: その患部が皮膚よりも深く見え
  rationale: מַרְאֶה の「見た目」と עָמֹק の比較表現を保ちつつ、病変がくぼんで見えるという診断上の所見を自然な日本語で表した。実際の深さだと断定せず、「見え」によって原文の視覚的表現を維持した。
- source_word: שֵׂעָר צָהֹב דַּק
  choice: 黄色い細い毛
  rationale: צָהֹב の色と דַּק の細さをともに明示し、祭司の診断基準を簡潔に再現した。
- source_word: וְטִמֵּא אֹתוֹ
  choice: その人を汚れていると宣告する
  rationale: 祭司が汚れを生じさせるのではなく、儀礼上の状態を判定する司法的な行為であることを「宣告する」で示した。
- source_word: נֶתֶק
  choice: 脱毛性の患部
  rationale: 頭部やひげの部分に生じる特定の病変を表すが、厳密な現代医学上の同定は不確かである。語根および文脈にある毛の異常を踏まえ、断定的な病名を避けた説明的な訳とした。
- source_word: צָרַעַת
  choice: 重い皮膚病
  rationale: レビ記におけるこの語は広い範囲の深刻な皮膚疾患を含み、現代医学のハンセン病だけを意味しない。「重い」により、祭儀上重大な診断対象であることを示した。
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: 頭またはひげに生じる
  rationale: 原文の二つの部位を保った。「頭皮」と限定せず、רֹאשׁ の通常の意味である「頭」を採用した。
theological_decisions:
- issue: 祭司による「汚れ」の判定
  choice: 「汚れていると宣告する」とし、祭司が儀礼上の状態を判定する表現にした。
  alternative: 「汚れた者とする」または「汚す」
  rationale: וְטִמֵּא の使役形はこの法規では判定・宣告の機能を持つ。祭司が病気や汚れそのものを発生させるという含意を避ける。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で dignified な法規文体とした。「見よ」は原文 וְהִנֵּה の注意喚起を保つため残した。医学的に不確かな語には説明的な本文訳と脚注を用い、特定の現代病名への同定を避けた。
