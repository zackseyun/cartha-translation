  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: ja
  text: この男は皮膚の病に冒された者であり[a]、汚れている。祭司は必ず、この男を汚れた者であると宣告しなければならない。その患部は頭にある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病の人」と訳される。ヘブライ語は本章で扱われる皮膚の症状を指し、現代のハンセン病と必ずしも同一ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: その男
  rationale: 単数男性の人物を指す法規上の事例であるため、性を明示する「男」とした。文脈上すでに特定された人物なので「その」を添えた。
- source_word: צָרוּעַ
  choice: 皮膚病に冒されており
  rationale: צרעに由来し、本章で診断対象となる皮膚の病変を持つ状態を表す。現代のハンセン病に限定せず、明瞭で自然な日本語とした。
- source_word: טָמֵא הוּא
  choice: 汚れている
  rationale: レビ記における祭儀上の不浄な状態を表す定訳的な表現。衛生上または道徳上の評価ではなく、祭儀的身分を指す。
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: 必ず汚れていると宣告しなければならない
  rationale: 不定詞絶対形と未完了形の組み合わせによる強調を「必ず」で表した。祭司が汚れを生じさせるのではなく、診断して公に認定する文脈なので「宣告する」とした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 診察と祭儀上の判定を担う役職を表す標準的な訳語。
- source_word: בְּרֹאשׁוֹ
  choice: 頭に
  rationale: 前置詞と名詞の位置表現を簡潔に保ち、原文どおり患部の所在を頭とした。
- source_word: נִגְעוֹ
  choice: その患部
  rationale: נגעは本章で診断される病変・患部を指す。「災い」では意味が広すぎ、「病気」では頭に位置するという表現が不自然になり得るため、「患部」とした。
theological_decisions:
- issue: 祭司の宣告と汚れの成立との関係
  choice: 祭司は、その男がすでに汚れていることを公式に宣告する
  alternative: 祭司がその男を汚れた者にする
  rationale: 祭司による診察と判定という文脈に従い、ヒフィル形を状態の公式な認定として訳した。祭司が汚れそのものを生じさせるという解釈は採らない。
- issue: 「汚れ」の性質
  choice: 祭儀上の状態を示す「汚れている」
  alternative: 衛生上または道徳上、汚れている
  rationale: レビ記13章の祭儀法の文脈を保ち、身体的症状を道徳的罪と同一視しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法規としての厳粛さを保った。「必ず……宣告しなければならない」で原文の強調を表し、「皮膚病」と脚注によって古い訳語が招く医学的誤解と偏見を避けた。
