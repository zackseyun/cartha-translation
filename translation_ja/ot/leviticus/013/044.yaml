  to: この男は皮膚の病に冒された者であり[a]、汚れている。祭司は必ず、この男を汚れた者であると宣告しなければならない。その患部は頭にある。
  rationale: 指示語「その」を原文のない限定を避ける「この」に改めた。また、皮膚疾患の語を「皮膚の病に冒された者」とし、原文の男性名詞と状態を保ちながら自然な現代日本語に整えた。祭司の宣告は、汚れを生じさせる行為ではなく祭儀上の状態の公式な判定であることが分かるよう、「汚れた者であると宣告する」とした。
