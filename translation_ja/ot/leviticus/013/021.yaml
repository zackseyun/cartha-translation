  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: ja
  text: しかし、祭司がそれを調べ、そこに白い毛がなく、皮膚よりくぼんでおらず、その患部が淡く見えるなら、祭司はその人を七日間隔離する[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「閉じ込めておく」とも訳せる。ヘブライ語の動詞は、経過を観察するためにその人をほかから分けておくことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 前節の診断例と対照をなす条件を、自然な現代日本語で示す。
- source_word: יִרְאֶנָּה
  choice: それを調べた
  rationale: 字義は「それを見る」だが、祭司による診察・判定の文脈なので「調べる」とした。女性単数の目的語は患部を指す。
- source_word: וְהִנֵּה
  choice: ところ
  rationale: 観察の結果に注意を向ける提示表現。日本語では「見よ」を機械的に残さず、「調べたところ」として検査の場面を自然に表した。
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: そこに白い毛がなく
  rationale: 患部内に白い毛がないという診断基準を直接表す。
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: 皮膚より深くなっておらず
  rationale: שְׁפָלָה は字義的には「低い、くぼんだ」。皮膚病変を目視する文脈に即して、皮膚面より深く見えないことを表した。
- source_word: וְהִיא כֵהָה
  choice: その患部が薄れている
  rationale: כֵהָה は色や見え方が弱い、薄い状態を示す。指示対象を明確にしつつ、診断場面に自然な表現とした。
- source_word: וְהִסְגִּירוֹ
  choice: その人を…隔離する
  rationale: 動詞は閉じ込める、隔離する意で、男性単数接尾辞は患部ではなく本人を指す。観察期間中に他から分けておく処置として「隔離する」とした。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す定型句を簡潔に訳した。
