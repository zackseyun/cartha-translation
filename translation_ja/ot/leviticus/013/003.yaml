review_pass:
  verdict: revise
  source_fidelity: 全体として、皮膚の患部、毛が白く変わること、患部の見え方、祭司による検査と判定というヘブライ語の診断的・儀礼的文脈をよく伝えている。אָתוֹは文脈上、検査を受ける人を指す理解でよく、「その人を調べ」とすることは妥当である。終句のטִמֵּאは儀礼的状態の公式な判定であり、日本語ではその点を明示するのが望ましい。
  naturalness: 簡潔で現代標準日本語として読みやすい。「患部が体の皮膚より深く見える」はやや不自然で、比較対象が視覚的には周囲の皮膚であることを示す「周囲の皮膚より深く見える」のほうが自然かつ明確である。
  terminology: 「ツァラアト」は特定の近代医学的診断を押し付けない点で適切であり、脚注による説明も必要である。ただし「汚れている」だけでは日常的な汚れとも読めるため、レビ記のטֻמְאָהに関する儀礼上の判定であることを「儀礼上汚れている」と明示する。脚注では、伝統訳「らい病」を歴史的訳語として示しつつ、ツァラアトを現代のハンセン病と同一視しない。
