revisions:
- from: 祭司は、体の皮膚にある患部を調べる。その患部の毛が白く変わり、患部が体の皮膚より深く見えるなら、それはツァラアト[a]の患部である。祭司はその人を調べ、汚れていると宣告する。
  to: 祭司は、体の皮膚にある患部を調べる。その患部の毛が白く変わり、患部が周囲の皮膚より深く見えるなら、それはツァラアト[a]の患部である。祭司はその人を調べ、儀礼上汚れていると宣告する。
  rationale: 本文の用語選択と構文は原文におおむね忠実であるため維持した。「周囲の皮膚」を用いて視覚的比較を自然にし、祭司の宣告が儀礼上の不浄に関する判定であることを明確にした。脚注も、ツァラアトをハンセン病と安易に同一視しない説明へ整えた。
