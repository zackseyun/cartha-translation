source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: ja
  text: 祭司は、体の皮膚にある患部を調べる。その患部の毛が白く変わり、患部が周囲の皮膚より深く見えるなら、それはツァラアト[a]の患部である。祭司はその人を調べ、儀礼上汚れていると宣告する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、伝統的に「らい病」と訳されてきたヘブライ語。ただし、現代のハンセン病と同一視できず、皮膚に現れるより広い種類の異常を指す。
    reason: ツァラアトを現代の特定疾患と誤認することを避けつつ、伝統的訳語との関係を示すため。
lexical_decisions:
- source_word: נֶגַע
  choice: 患部
  rationale: 祭司が目で調べる皮膚の異常箇所を指すため、現代日本語で自然かつ診察文脈に適した「患部」とした。病因や感染性までは断定しない。
- source_word: בְּעוֹר הַבָּשָׂר
  choice: 体の皮膚にある
  rationale: 「肉の皮膚」という逐語表現を避けつつ、עוֹר と בָּשָׂר の身体的意味を明瞭に伝える。
- source_word: שֵׂעָר בַּנֶּגַע הָפַךְ לָבָן
  choice: その患部の毛が白く変わり
  rationale: 完了形が示す観察可能な変化後の状態を、自然な日本語で表した。
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: 患部が体の皮膚より深く見える
  rationale: מַרְאֵה の視覚的判断を「見える」で明示し、病変が周囲の皮膚より陥没して見えるという比較表現を保った。
- source_word: נֶגַע צָרַעַת
  choice: ツァラアトの患部
  rationale: צָרַעַת は現代のハンセン病と同一視できない古代イスラエルの分類であるため、音写して範囲の不確かさを保ち、「患部」によって構文上の二名詞も反映した。
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: 祭司はその人を調べ
  rationale: 接尾辞を文脈上、診察される人と理解した。「見る」より法的検査の文脈に合う「調べる」を用いた。
- source_word: וְטִמֵּא אֹתוֹ
  choice: 汚れていると宣告する
  rationale: 祭司が汚れを生じさせるのではなく、儀礼上の状態を判定して公に示す行為として訳した。
theological_decisions:
- issue: צָרַעַת の訳し方
  choice: ツァラアト
  alternative: 皮膚病／らい病
  rationale: 特定の現代医学的疾患への同定を避け、レビ記におけるより広い儀礼的・診断的分類の曖昧さを保つ。意味の手掛かりは脚注で示す。
- issue: 祭司の וְטִמֵּא אֹתוֹ の作用
  choice: 汚れていると宣告する
  alternative: 彼を汚れた者にする
  rationale: 文脈は祭司による検査と判定であり、祭司がその人に汚れを発生させるという含意を避けた。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で威厳ある法規文体。「である」と「する」を用いて規定の確定性を示した。専門的な音写語「ツァラアト」には必ず脚注を付し、本文では過度な医学的特定を避けた。
