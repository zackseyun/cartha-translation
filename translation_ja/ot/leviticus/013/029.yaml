  yaml_path: translation/ot/leviticus/013/029.yaml
  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: ja
  text: 男であれ女であれ、頭またはひげに患部[a]がある場合、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「病変」「異常」。ヘブライ語ネガは、レビ記で祭司が検査する、目に見える患部や症状を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: 男であれ女であれ
  rationale: 原文は男女をそれぞれ明記しているため、その両方を保ちつつ、現代日本語の法規的な条件表現として自然に訳した。
- source_word: כִּי
  choice: 場合
  rationale: 祭司法における事例条件を導く語であり、日本語では「場合」が自然である。
- source_word: יִהְיֶה בּוֹ
  choice: ある
  rationale: 直訳的には「その人に生じる／ある」だが、患部の所在を表す日本語として簡潔に「ある」とした。
- source_word: נָגַע
  choice: 患部
  rationale: レビ記13章では祭司が検査する目に見える病変や異常を広く指し、現代医学上の特定の感染症とは限らない。「患部」はその広さを保ち、自然な日本語でもある。
- source_word: בְּ/רֹאשׁ
  choice: 頭
  rationale: 文脈上は頭皮を指す可能性が高いが、原語はより広い「頭」なので本文では限定しなかった。
- source_word: בְ/זָקָן
  choice: ひげ
  rationale: 原語 זָקָן の通常の意味をそのまま明瞭に訳した。
theological_decisions: []
