  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: ja
  text: しかし、もしそれが皮膚に広がるなら、祭司はその人を汚れていると宣告しなければならない。それは病変[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「病変」と訳したヘブライ語は意味の幅が広く、「患い」「災い」「異常な斑点」などとも訳し得る。現代医学上の特定の病名や診断を指すとは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前節の診断結果と対照をなす条件を導入するため、接続詞と条件詞の働きを自然な現代日本語で表した。
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: 明らかに広がる
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意を、「明らかに」で示した。「広がり続ける」として継続の意味に限定することは避けた。
- source_word: בָּעוֹר
  choice: 皮膚に
  rationale: עוֹרの通常の意味である「皮膚」を採用し、前置詞בを広がる範囲として自然に表した。
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: 祭司はその人を汚れていると宣告しなければならない
  rationale: 祭司が人を汚れた状態にするのではなく、祭儀上の身分を公的に判定するというピエル形の法的用法を明示した。
- source_word: נֶגַע הִוא
  choice: それは患部である
  rationale: נֶגַעを現代の特定疾患や感染症に狭めず、診察対象となる異常な部位を指す広い語として「患部」とした。ヘブライ語の名詞文の断定も保った。
theological_decisions:
- issue: 祭司による汚れの宣告の性質
  choice: 祭司がその人を「汚れている」と公的に宣告する
  alternative: 祭司がその人を汚れた者にする
  rationale: 祭司法の診断文脈では、祭司の発言は祭儀上の状態を生じさせる行為というより、その状態を権威をもって判定し宣告する行為である。
- issue: נֶגַעの医学的特定
  choice: 特定の現代医学上の感染症とはせず、「患部」とする
  alternative: 感染症、疫病、皮膚病
  rationale: この語は病変、災厄、異常な斑点などを含み得る広い語であり、本文だけでは現代医学上の分類を確定できない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で威厳ある法令文調とした。「汚れている」は衛生上の不潔ではなく祭儀上の状態を指すが、本節では説明を本文に加えず、レビ記の用語体系を保った。
