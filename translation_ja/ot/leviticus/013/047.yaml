  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: ja
  text: 衣服にツァラアト[a]の病変が生じた場合、羊毛の衣服であれ、亜麻布の衣服であれ、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ツァラアト」。伝統的に「らい病」と訳されてきたが、現代医学でいうハンセン病だけを指す語ではない。ここでは衣服に現れる異常や汚染をも含む、より広い分類を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: 衣服
  rationale: בגדは衣服・衣類を指す。ここでは律法上の一般的な事例を示しているため、自然な無冠詞の「衣服」とした。
- source_word: כִּי יִהְיֶה בוֹ
  choice: に……が生じた場合
  rationale: 律法の事例を導入するכִּיと未完了形を「場合」とし、בוֹの所在の意味を助詞「に」で表した。
- source_word: נֶגַע צָרָעַת
  choice: ツァラアトの病変
  rationale: נגעは検査対象となる異常な箇所・病変を表す。צָרָעַתは衣服にも及ぶ祭儀上の分類であり、現代のハンセン病と同一視させないため音写した。
- source_word: בְּבֶגֶד צֶמֶר
  choice: 羊毛の衣服であれ
  rationale: צמרは羊毛を指す。反復される素材別の選択肢を、日本語で自然な「であれ」の並列によって表した。
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: 亜麻布の衣服であれ
  rationale: פשתיםは亜麻またはその織物を指し、完成した衣服の素材として「亜麻布」が適切である。אוֹによる二者の並列を保った。
theological_decisions:
- issue: צָרָעַתの範囲
  choice: 「ツァラアト」と音写し、脚注で意味範囲を説明する
  alternative: 「らい病」「重い皮膚病」などと訳す
  rationale: 本文脈では衣服にも生じる状態を指すため、特定の現代医学上の疾患や皮膚だけの病気に限定せず、原語の広い祭儀的分類を保持する。
translation_notes:
  register: 現代の一般読者に明瞭な律法文体としつつ、文が次節へ続くことを示す読点を末尾に残した。「であれ……であれ」により、羊毛と亜麻布という二つの素材を自然かつ格調を保って並列した。
