  text: וְ/אִם בְּ/עֵינָי/ו֩ עָמַ֨ד הַ/נֶּ֜תֶק וְ/שֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח בּ֛/וֹ נִרְפָּ֥א הַ/נֶּ֖תֶק טָה֣וֹר ה֑וּא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: ja
  text: しかし、祭司が見て、鱗状の患部が変わらず、そこに黒い毛が生えているなら、その患部は治っている。その人は清い。祭司はその人を清いと宣言する[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭司はその人を清める」。ここで用いられるヘブライ語の動詞は「清める」とも訳せるが、この文脈では、患部が治った後に祭司がその人を清いと公式に判定することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: 祭司が見て
  rationale: 直訳は「彼の目に」だが、直前から続く祭司の診察を指す。日本語では観察者を明示し、診察の場面を自然に表した。
- source_word: עָמַד
  choice: 変わらず
  rationale: 患部が以前の状態にとどまっていることを表す。文脈上「広がらず」とも理解できるが、原語のより広い意味を保つため「変わらず」とした。
- source_word: הַנֶּתֶק
  choice: 脱毛を伴う患部
  rationale: 頭部またはひげの部分に生じ、毛が抜ける特定の患部を指す。単なる「かゆみ」や一般的な「皮膚病」とせず、症状と局所性を分かりやすく示した。
- source_word: שֵׂעָר שָׁחֹר
  choice: 黒い毛
  rationale: 診断上の徴候となる色を原語どおり具体的に訳した。
- source_word: צָמַח בּוֹ
  choice: そこに…生えている
  rationale: 患部の中に毛が生じているという意味を、自然な日本語で表した。
- source_word: נִרְפָּא
  choice: 治っている
  rationale: 患部が治癒した状態を示す受動・状態的な表現として訳した。
- source_word: טָהוֹר הוּא
  choice: その人は清い
  rationale: 「清い」という判定は患部だけでなく診察を受けた人に関わるため、主語を明示した。レビ記の清浄規定に沿い「清い」とした。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司はその人を清いと宣言する
  rationale: ここで祭司は患部を治療するのではなく、治癒を確認して清浄について公式な判定を下す。
theological_decisions:
- issue: 清浄判定における祭司の行為の性質
  choice: 祭司はその人を清いと宣言する
  alternative: 祭司はその人を清める
  rationale: 本文は患部の治癒と、それに続く祭司の判定を区別している。祭司が病を治す、またはこの行為自体によって清浄を生じさせるという意味に限定せず、法的・祭儀的な公式判定として表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、レビ記の祭儀用語である「清い」を保持した。「脱毛を伴う患部」は専門的すぎない説明的表現とし、原語が指す特定の症状を一般読者にも伝わるようにした。
