  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンに次のように告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（יהוה）。日本語訳では伝統的に「主」と訳されることが多い。
    reason: 神名の原語表記と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 神が新たに語り始める定型的な叙述。現代日本語として自然であり、後続する発言の導入であることも明確にする。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号の「主」に置き換えず、本文に記された神の固有名YHWHを一般的な日本語音写で示す。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: 二人がともに語りかけられた相手であることを、簡潔で自然な日本語で表す。
- source_word: לֵאמֹר
  choice: 次のように
  rationale: 後続する発言内容を導くヘブライ語の定型句を、日本語で不自然な「言って」とせず、次節へのつながりが明確になるように訳す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名YHWHを明記しているため、その固有名としての性格を保持する。伝統的な代替表記については脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら、神の発言を導入する箇所にふさわしい端正な文体とした。「語って言った」のようなヘブライ語直訳調は避け、「次のように告げた」で לֵאמֹר の機能を保った。
