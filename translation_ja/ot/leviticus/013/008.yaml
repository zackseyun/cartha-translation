source:
  edition: WLC
  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: ja
  text: 祭司がその人を調べ、皮膚の発疹が広がっているなら、祭司はその人を汚れた者と宣言する。それはツァラアト[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ツァラアト」。伝統的に「らい病」と訳されてきたが、レビ記では現代のハンセン病だけでなく、より広い範囲の皮膚の症状を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べ
  rationale: 祭司が皮膚の状態を正式に検査する文脈なので、単に「見る」ではなく「調べる」とした。
- source_word: וְהִנֵּה
  choice: 確認したなら
  rationale: 直訳は「すると、見よ」だが、ここでは検査によって判明した条件を導入する。現代日本語の法的・手続き的な文脈に自然な形で表した。
- source_word: פָּשְׂתָה
  choice: 広がっている
  rationale: 症状が皮膚上で拡大したことを示す診断上の基準を明確に表す。
- source_word: הַמִּסְפַּחַת
  choice: 発疹
  rationale: 皮膚表面に現れる異常を指す語として、狭すぎる「かさぶた」よりも自然で包括的な表現を選んだ。
- source_word: בָּעוֹר
  choice: 皮膚の
  rationale: 症状が皮膚に現れ、そこで広がることを自然な日本語で示した。
- source_word: וְטִמְּאוֹ
  choice: その人を汚れていると宣告する
  rationale: 祭司がその人を汚れた状態にするという因果ではなく、儀礼上の状態を権威をもって判定・宣告することを表す。
- source_word: צָרַעַת
  choice: ツァラアト
  rationale: 現代のハンセン病と同一視する誤解を避けつつ、ヘブライ語における固有の診断・儀礼上の分類を保持した。意味は脚注で説明する。
- source_word: הִוא
  choice: これは…である
  rationale: 直前の皮膚の症状を指して、その正体を特定する述語文として表した。
theological_decisions:
- issue: レビ記の清浄規定における צָרַעַת の訳し方
  choice: ツァラアト
  alternative: 重い皮膚病／らい病／ハンセン病
  rationale: このヘブライ語は現代医学のハンセン病だけを意味するとは限らず、レビ記ではより広い異常を扱う分類語である。音写と脚注により、誤った医学的特定を避けながら原文のカテゴリーを保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。祭司の行為は「調べる」「宣告する」として、診断と儀礼上の判定という手続き的性格を明示した。原語固有の分類名「ツァラアト」は脚注を伴わせ、一般読者にも意味が分かるようにした。
