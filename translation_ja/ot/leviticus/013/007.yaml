  text: וְ/אִם פָּשֹׂ֨ה תִפְשֶׂ֤ה הַ/מִּסְפַּ֨חַת֙ בָּ/ע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛/וֹ אֶל הַ/כֹּהֵ֖ן לְ/טָהֳרָת֑/וֹ וְ/נִרְאָ֥ה שֵׁנִ֖ית אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: ja
  text: しかし、その人が清いと認められるために祭司に自分を見せた後、皮膚の発疹[a]が確かに広がるなら[b]、その人はもう一度祭司に自分を見せなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「発疹」に当たるヘブライ語は、祭司の診察対象となる表面的な皮膚症状を指す。「皮膚症状」または伝統的に「かさぶた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「広がる」という動詞が強められており、「確かに広がるなら」という意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: さらに広がるなら
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意を、診察後にも病変が進展するという文脈に即して「さらに」で自然に表した。
- source_word: הַמִּסְפַּחַת
  choice: 皮膚の発疹
  rationale: 表皮に現れる診察対象の皮膚症状を指す語。「かさぶた」では治癒中の傷を連想させるため、より広く中立的な「発疹」とした。
- source_word: בָּעוֹר
  choice: 皮膚の
  rationale: 病変が皮膚に生じていることを自然な日本語で示した。原文に明示的な所有表現がないため、「その人の皮膚」とはしなかった。
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: 自分を見せた後
  rationale: 祭司の診察を受けるために本人が出向いて身を示す手続きを表す再帰的な意味を保持した。
- source_word: לְטָהֳרָתוֹ
  choice: 清いと認められるために
  rationale: この文脈では、単に身体を清める行為ではなく、祭司の診察を経て儀礼的に清いと判定されることが焦点なので、その目的を明示した。
- source_word: וְנִרְאָה שֵׁנִית אֶל הַכֹּהֵן
  choice: もう一度、祭司に自分を見せなければならない
  rationale: 祭司による再診を受ける義務を、現代日本語の法規的な文体で明確に表した。
theological_decisions:
- issue: לְטָהֳרָתוֹ が清めの行為か、清いとの判定か
  choice: 清いと認められるために
  alternative: 清めのために
  rationale: レビ記13章の直接の文脈は祭司による皮膚症状の検査と清浄宣言であり、本人が清められる儀式そのものに限定しない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭司による検査という法規的文脈を反映しつつ、「清め」を物理的処置と誤解しにくい表現にした。
