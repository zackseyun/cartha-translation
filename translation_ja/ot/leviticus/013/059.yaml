reference: Leviticus 13:59
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: ja
  text: これは、毛織りの衣服または亜麻織りの衣服、縦糸または横糸、あるいはあらゆる革製品に生じたツァラアト[a]の異常箇所について、それを清いと宣言するか、汚れていると宣言するかを定める規定である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」はヘブライ語の音写。この語は人の皮膚だけでなく、衣服や家屋に現れる異常にも用いられており、現代医学の「ハンセン病」と同じものとは限らない。ここでの「清い」「汚れている」は、祭儀上の状態についての判定を表す。
    reason: 原語が指す範囲と、特定の現代病名による誤解を説明し、清浄／不浄が祭儀上の判定であることを明示するため。
lexical_decisions:
- source_word: תּוֹרַת
  choice: 規定
  rationale: この節は直前までの事例を総括する祭司的な判定手続きを述べるため、現代日本語で自然な「規定」とした。「律法」も可能だが、個別規則としての機能を明確にした。
- source_word: נֶגַע צָרַעַת
  choice: ツァラアトの患部
  rationale: נֶגַע は目に見える異常箇所を指すため「患部」とし、צָרַעַת は衣服や革にも及ぶ分類なので、現代の特定疾患名を当てず音写した。
- source_word: בֶּגֶד הַצֶּמֶר אוֹ הַפִּשְׁתִּים
  choice: 毛織りまたは亜麻織りの衣服
  rationale: 素材を示す並列表現として訳し、後者にも文脈上共有される「衣服」を補った。
- source_word: הַשְּׁתִי אוֹ הָעֵרֶב
  choice: 縦糸または横糸
  rationale: 織物における長手方向と交差方向の糸を指す技術語を、一般読者にも分かる現代日本語で表した。
- source_word: כָּל כְּלִי עוֹר
  choice: どのような革製品であれ
  rationale: כְּלִי は器に限らず物品全般を表すため「革製品」とし、כָּל の包括性を「どのような…であれ」で示した。
- source_word: לְטַהֲרוֹ אוֹ לְטַמְּאוֹ
  choice: それを清いと宣言するか、汚れていると宣言するか
  rationale: 物理的に洗浄・汚染する行為ではなく、祭司が祭儀上の状態を判定して宣言する文脈を明示した。
theological_decisions:
- issue: 衣服や革製品に用いられる צָרַעַת の訳語
  choice: ツァラアト
  alternative: らい病、重い皮膚病、かび状の災い
  rationale: この語は本章で人だけでなく衣服や家にも適用され、現代医学上のハンセン病と同定できない。音写と注記によって、原語の包括的かつ祭儀的な分類を保ち、医学的意味を過度に限定しない。
- issue: 清い・汚れているという判定の性質
  choice: 宣言する
  alternative: 清める／汚す
  rationale: 文脈は祭司による状態認定であり、対象の状態を実際に変化させる行為と断定しないよう、判定的な意味を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。織物用語は専門的すぎない「縦糸／横糸」を用い、祭儀上の法的判定は「清い／汚れていると宣言する」と表現した。
