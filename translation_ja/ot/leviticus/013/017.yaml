base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: ja
  text: 祭司はその人を調べる。見ると、患部[a]は白く変わっている。祭司はその患部について清いと宣言する[b]。患部は清い。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「患部」と訳したヘブライ語ネガは、祭司が調べる、異常の現れた箇所を指す。現代医学上の特定の病名を示す語ではない。
    reason: lexical_alternative
  - marker: b
    text: または「清いと判定する」。祭司は患部を治すのではなく、検査に基づいて清浄の判定を下す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: 祭司はその人を調べる
  rationale: 動詞は字義的には「見る」だが、祭司による判定の文脈では「調べる」が自然。接尾代名詞は男性単数で、直前の文脈にいる人を指すため、「その人」とした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 検査によって判明した状態へ注意を向ける談話標識の働きを、現代日本語で自然に表した。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 目に見える異常の現れた箇所を指し、現代医学上の特定の診断名を意味しない。「患部」は簡潔で、観察対象となる箇所を示せる。
- source_word: נֶהְפַּךְ ... לְלָבָן
  choice: 白く変わっている
  rationale: ニファル形による状態の変化と、検査時にその結果が認められることを自然に表現した。
- source_word: וְטִהַר
  choice: 清いと宣言する
  rationale: 祭司が患部を治療したり清めたりするのではなく、検査後に清浄の判定を下す文脈であるため。
- source_word: טָהוֹר הוּא
  choice: それは清い
  rationale: 簡潔な判定文を保ちつつ、男性単数代名詞の指示対象が患部またはその人と理解され得る余地を残した。
theological_decisions:
- issue: 祭司の行為の性質
  choice: 祭司は患部を「清いと宣言する」
  alternative: 祭司は患部を「清める」
  rationale: レビ記13章では祭司は検査して清浄・不浄の判定を下す者であり、治癒や儀礼的処置を行ったとは本文に記されていないため。
- issue: 「それは清い」の指示対象
  choice: 本文では指示対象を限定せず、注で曖昧さを示す
  alternative: 「その人は清い」または「その患部は清い」と明示する
  rationale: 原文の男性単数代名詞は、文法上、直前の男性名詞「患部」を受けることも、検査された人を指すことも可能であるため、解釈を一方に固定しない。
translation_notes:
  register: 明瞭で端正な現代標準日本語を用いた。「見よ」のような古風な命令表現は避け、וְהִנֵּהの観察結果を示す働きを「見ると」で表した。清浄規定の専門性は保ちつつ、医学的診断を過度に特定しない語彙を選んだ。
