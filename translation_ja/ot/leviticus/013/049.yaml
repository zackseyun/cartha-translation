source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: ja
  text: その箇所が、衣服、革、縦糸、横糸、あるいは何らかの革製品にあって、緑がかっている、または赤みがかっているなら、それはツァラアトの異常箇所である。それは祭司に見せられなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֶּגַע
  choice: その箇所／異常
  rationale: 衣服や革に目で確認できる異常箇所を指す。日本語では初出を「箇所」、判定部分を「異常」として、病変や災厄に限定しすぎないようにした。
- source_word: יְרַקְרַק
  choice: 緑がかったもの
  rationale: 重複形が示す緑系の色合いを、特定の濃淡に限定せず自然な現代日本語で表した。
- source_word: אֲדַמְדָּם
  choice: 赤みがかったもの
  rationale: 重複形による赤系の色合いを表し、鮮明な純赤と断定しない訳とした。
- source_word: בֶּגֶד
  choice: 衣服
  rationale: 文脈上、羊毛または亜麻で作られた着用物を中心に指すため「衣服」とした。ただし素材一般を含み得る語義の幅は周囲の「縦糸、横糸」によって補われる。
- source_word: עוֹר
  choice: 革
  rationale: 生体の皮膚ではなく、加工素材およびその製品を指す文脈なので「革」とした。
- source_word: שְׁתִי
  choice: 縦糸
  rationale: 織物の長手方向の糸を指す専門語だが、一般読者にも分かりやすい日本語を選んだ。
- source_word: עֵרֶב
  choice: 横糸
  rationale: 織物の横方向の糸を指し、「縦糸」との対を明瞭に保った。
- source_word: כְּלִי עוֹר
  choice: 何らかの革製品
  rationale: 革で作られた器具・品物全般を指す広い表現であるため、用途を限定しない「革製品」とした。
- source_word: נֶגַע צָרַעַת
  choice: ツァラアトによる異常
  rationale: צָרַעַת は人だけでなく衣服や革にも用いられる祭司法上の分類で、現代医学のハンセン病とは同一視できない。音写を用い、本文では「異常」と組み合わせて対象物にも自然に適用できるようにした。
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: それを祭司に見せなければならない
  rationale: 原文の使役受動形は提示者を明示しない。「それを祭司に見せる」という自然な日本語で義務を表しつつ、誰が見せるかは特定しなかった。
theological_decisions:
- issue: 祭司法における צָרַעַת の訳語
  choice: ツァラアト
  alternative: 重い皮膚病／らい病
  rationale: この語は本節で衣服や革製品にも適用されるため、「皮膚病」では対象範囲を狭め、「らい病」では現代の特定疾患との誤った同一視を招く。音写と注で、原文固有の儀礼的・身体的分類とその不確定性を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭司法の判定文としての簡潔さと厳粛さを保った。「縦糸、横糸」は専門的な外来語を避け、一般読者に即時理解できる表現とした。
