    rationale: נֶגַע צָרַעַת は、ツァラアトに分類される異常箇所を表す構文である。「による」は原因を前面に出すため、「ツァラアトの異常箇所」として構文上の関係をより直接に表す。
  revised_text: その箇所が、衣服、革、縦糸、横糸、あるいは何らかの革製品にあって、緑がかっている、または赤みがかっているなら、それはツァラアトの異常箇所である。それは祭司に見せられなければならない。
