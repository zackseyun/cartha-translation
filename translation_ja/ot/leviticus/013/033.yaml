  text: וְ/הִ֨תְגַּלָּ֔ח וְ/אֶת הַ/נֶּ֖תֶק לֹ֣א יְגַלֵּ֑חַ וְ/הִסְגִּ֨יר הַ/כֹּהֵ֧ן אֶת הַ/נֶּ֛תֶק שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: ja
  text: その人は毛をそる。ただし、脱毛のある患部[a]はそってはならない。祭司は、その患部のある人をもう一度、七日間隔離する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、頭部またはひげの部位に生じる特定の患部を指す語である。脱毛を伴うと考えられるが、正確な現代医学上の診断は特定できない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: その人は毛をそる
  rationale: התגלח は גלח のヒトパエル形で、本人がそる、またはそってもらうことを表す。日本語では行為者を「その人」と明示しつつ、どの毛かを原文以上に限定しない「毛をそる」とした。
- source_word: הַנֶּתֶק
  choice: 脱毛した患部
  rationale: נתק はレビ記13章で、頭またはひげの部分に生じ、脱毛を伴う特定の症状を指す。「かゆみ」では意味を狭めすぎ、「うろこ状の斑点」では本文から確定しにくい性状を加えるため、診察対象となる部位を自然に示す表現とした。
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: ただし、脱毛した患部はそってはならない
  rationale: 対格標識 את により、そらない対象は患部そのものとして示されている。周囲だけをそるという推定は本文に入れず、原文の指示を保った。
- source_word: וְהִסְגִּיר
  choice: 隔離する
  rationale: 祭司が経過観察のため対象を一定期間分離するレビ記13章の手続きを、現代日本語で明瞭に表す。
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: さらに七日間
  rationale: שנית は二度目の期間であることを示す。直前の七日間に続く再度の隔離として、日本語では「さらに七日間」が自然である。
theological_decisions:
- issue: 隔離される対象
  choice: 「その患部を」とはせず、文脈上その人を隔離する手続きとして訳す
  alternative: 祭司は、その患部をさらに七日間隔離する
  rationale: 文法上 את־הנתק が וְהִסְגִּיר の目的語であり、字義的には「患部を閉じ込める」となるが、レビ記13章の手続きでは患部を持つ人を隔離して観察することを意味する。日本語で患部そのものを「隔離する」とすると不自然で誤解を招くため、文脈上の対象を示した。
translation_notes:
  register: 祭司法の簡潔で厳正な手続き文として、常体の現代標準語を用いた。「皮膚病」など診断を過度に確定する語は避け、נתק の脱毛を伴う患部という文脈的特徴を示した。
