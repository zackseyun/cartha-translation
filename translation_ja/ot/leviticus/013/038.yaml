  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: ja
  text: 男または女の体の皮膚に、白い光沢のある斑点ができたなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: 男でも女でも
  rationale: 男女を明示する原文を保ちつつ、一般的な事例を示す律法の文体として自然な日本語にした。
- source_word: כִּי יִהְיֶה
  choice: できたなら
  rationale: 診断上の条件を導く表現であり、皮膚に斑点が現れる場合を自然な日本語で示した。
- source_word: בְּעוֹר בְּשָׂרָם
  choice: その体の皮膚に
  rationale: עוֹרを「皮膚」、この文脈のבָּשָׂרを「体」とし、接尾辞が各人を指すことを「その」で表した。
- source_word: בֶּהָרֹת
  choice: 明るい斑点
  rationale: 皮膚上の明色または光沢のある斑点を指す語として、診断文脈に即しつつ原語の明るさの含意を残した。
- source_word: בֶּהָרֹת לְבָנֹת
  choice: 白い斑点
  rationale: לְבָנֹתが斑点の白色を明示するため「白い」とし、同じ名詞を繰り返す原文の表現を本文でも保った。
