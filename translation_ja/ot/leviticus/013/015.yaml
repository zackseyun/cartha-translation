  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: ja
  text: 祭司がその露出した生の肉[a]を見たなら、その人を汚れていると宣告しなければならない[b]。その露出した生の肉は汚れている。それは皮膚の病気[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「生きた肉」。患部に現れた、露出した生の組織を指す。伝統的には「ただれた肉」などとも訳される。
    reason: lexical_alternative
  - marker: b
    text: または「その人を汚れたものとする」。祭司が祭儀上の不浄について公式の判定を下すことを意味する。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語「ツァラアト」。現代のハンセン病だけを指す語ではなく、レビ記では人の皮膚などに見られる種々の異常状態を表す。伝統的には「らい病」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 見たなら
  rationale: 律法の手続きの進行を示す waw＋完了形を、現代日本語で自然な条件・時の節として表した。
- source_word: הַבָּשָׂר הַחַי
  choice: 生きた肉
  rationale: 字義どおり「生きた肉」。露出した生の組織を指しうるが、「ただれた肉」などと意味を限定せず、原文の表現を保った。
- source_word: וְטִמְּאוֹ
  choice: その人を汚れていると宣告しなければならない
  rationale: ピエル形は、この祭司律法の文脈では汚れを生じさせることより、公的な清浄・不浄の判定を下すことを表す。
- source_word: טָמֵא הוּא
  choice: 汚れている
  rationale: レビ記の祭儀的な区分を示す定訳として「汚れている」を用いた。衛生上または道徳上の不潔だけを意味するものではない。
- source_word: צָרַעַת
  choice: ツァラアト
  rationale: 現代のハンセン病や特定の皮膚病と同一視せず、レビ記固有の広い病変・状態の分類であることを保つため音写した。
theological_decisions:
- issue: צָרַעַת の医学的・祭儀的範囲
  choice: ツァラアト
  alternative: 皮膚病／重い皮膚病／らい病
  rationale: 原語は現代医学の一疾患に正確には対応せず、レビ記では衣服や家屋にも用いられる。音写に説明注を付け、祭儀上の分類を医学的診断に置き換えないようにした。
- issue: 祭司の行為が不浄を生じさせるのか判定するのか
  choice: 汚れていると宣告する
  alternative: 汚れたものとする
  rationale: 文脈上、祭司は徴候を認定して公式の判定を告げる。祭司自身がその人を本質的に汚すとの含意を避けた。
translation_notes:
  register: 明快で荘重すぎない現代標準語。「祭司」「汚れている」はレビ記の祭儀的用語として一貫性を重視した。「生きた肉」は耳慣れないため注を付し、原文の具体的だが解釈に幅のある表現を保持した。
