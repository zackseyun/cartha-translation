  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: ja
  text: また、亜麻布や羊毛の縦糸または横糸に、または革に、あるいはあらゆる革製品に生じた場合――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: 縦糸
  rationale: 織物の長手方向に張る糸を指すため、現代日本語の標準的な織物用語「縦糸」とした。
- source_word: עֵרֶב
  choice: 横糸
  rationale: 縦糸に交差させて織り込む糸を指すため、明瞭な標準用語「横糸」とした。
- source_word: לַפִּשְׁתִּים
  choice: 亜麻布
  rationale: 語そのものは亜麻を表し得るが、ここでは織物とその糸を扱う文脈なので、亜麻から作られた布地を自然に示す「亜麻布」とした。
- source_word: וְלַצָּמֶר
  choice: 羊毛
  rationale: צֶמֶרの通常の意味を簡潔に表し、亜麻布と並ぶ素材の区分として訳した。
- source_word: עוֹר
  choice: 革
  rationale: 製品の素材として用いられる加工された動物の皮を指す文脈なので、「皮」より「革」が適切である。
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: どのような革製品にでも
  rationale: מְלָאכָהはここでは労働ではなく、革を用いて作られた物を指す。自然で包括的な日本語にした。
- source_word: אוֹ ... אוֹ
  choice: または……あるいは……または
  rationale: 列挙される発生箇所・素材が選択肢として並ぶヘブライ語の構造を、日本語として不自然にならない範囲で保った。
theological_decisions: []
translation_notes:
  register: 前節から続く条件節であるため、文末を「生じた場合――」として後続節への継続を示した。専門語は一般読者にも理解しやすい「縦糸」「横糸」を用い、簡潔で格調を保った現代標準日本語とした。
