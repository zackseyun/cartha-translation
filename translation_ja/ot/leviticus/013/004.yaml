base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: ja
  text: しかし、もしその人の体の皮膚に白い斑点[a]があり、見たところ皮膚より深くなく、そこに生えている毛も白く変わっていないなら、祭司はその患部[b]について、七日間の隔離措置を取らなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「白く光る箇所」または「明るい斑」とも訳せる。ここでは皮膚に現れた、白く明るく見えるしるしを指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「患い」「病変」を意味する語で、ここでは祭司が調べている皮膚の箇所を指す。
    reason: lexical_alternative
  - marker: c
    text: 「隔離する」とも訳せる。ヘブライ語では「患部」を目的語として用いるが、経過観察のために一時的な隔離を命じる手続きを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: 斑点
  rationale: 皮膚に現れる、白く明るく見える局所的なしるしを指す。「斑点」は現代日本語として自然で、病名を先取りしない。白さは לְבָנָה によって明示する。
- source_word: לְבָנָה
  choice: 白い
  rationale: 色を表す形容詞の素直な訳。
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: その人の体の皮膚に
  rationale: ヘブライ語の「彼の肉の皮膚」を、意味を保ちつつ自然な現代日本語で表した。ここで「肉」は人体を指す。
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: 見たところ皮膚より深くなく
  rationale: 周囲の皮膚との見かけ上の深さを診断基準として述べる表現。「見たところ」により מַרְאֶה の視覚的判断を保持した。
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: そこに生えている毛も白く変わっていない
  rationale: 病変部にある毛と、その色の変化を明確に表す。הפך の状態変化も「変わる」で保持した。
- source_word: וְהִסְגִּיר
  choice: 隔離下に置かなければならない
  rationale: 一時的に区別して観察するための措置を表す。単なる閉じ込めと誤解されにくい表現を選んだ。
- source_word: אֶת־הַנֶּגַע
  choice: その患部
  rationale: 祭司が検査している病変箇所を指す。「災い」「疫病」は意味を強めすぎ、「患部」は具体的な対象を簡潔に示す。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 隔離措置の期間を示す標準的な訳。
