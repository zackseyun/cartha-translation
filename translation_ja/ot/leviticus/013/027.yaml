  text: וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י אִם פָּשֹׂ֤ה תִפְשֶׂה֙ בָּ/ע֔וֹר וְ/טִמֵּ֤א הַ/כֹּהֵן֙ אֹת֔/וֹ נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: ja
  text: 祭司は七日目にその人を調べる。もし患部が皮膚に確かに広がっているなら、祭司はその人を汚れていると宣告する。これは皮膚病[a]による患部である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病」と訳されてきた。ヘブライ語「ツァラアト」は、イスラエルの清浄規定における深刻な皮膚の異常を広く指し、現代のハンセン病に限られない。
    reason: 「ツァラアト」の意味範囲と伝統的訳語を示し、現代医学上の病名との安易な同一視を避けるため。
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: その人を調べる
  rationale: 動詞の基本義は「見る」だが、祭司が皮膚の状態を判定する文脈では、単なる目視より「調べる」が自然である。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目に
  rationale: 時を示す句を簡潔で自然な現代日本語にした。
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: もし患部が…確かに広がっているなら
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「確かに」で表した。文脈上の主語である患部を補って明瞭にした。
- source_word: בָּעוֹר
  choice: 皮膚に
  rationale: עוֹרの基本義「皮膚」を保ち、広がる範囲を表す自然な助詞「に」を用いた。
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: 祭司はその人を汚れていると宣告する
  rationale: 祭司がその人を物理的に汚すのではなく、祭儀上の状態を公式に判定することを「宣告する」で示した。
- source_word: נֶגַע
  choice: 患部
  rationale: レビ記13章では目に見える皮膚の異常箇所を指すため、現代日本語で過度に医学的な断定を避けつつ具体的な「患部」とした。
- source_word: צָרַעַת
  choice: 皮膚病
  rationale: この箇所では人の皮膚に現れる症状を指す。現代のハンセン病に限定する誤解を避け、一般読者に理解しやすい語を選んだ。語の範囲と伝統訳は脚注で示す。
- source_word: הִוא
  choice: それは…である
  rationale: 直前まで述べられた状態を同定する代名詞の働きを保った。
theological_decisions:
- issue: 祭儀上の「汚れ」の判定
  choice: 汚れていると宣告する
  alternative: 汚れた者とする
  rationale: 祭司による公式な判定であることを明示し、祭司自身が汚れを生じさせるという含意を避けた。
- issue: צָרַעַתの訳語
  choice: 皮膚病
  alternative: らい病／ツァラアト
  rationale: このヘブライ語は現代医学のハンセン病と同一とは限らず、レビ記ではより広い現象を表す。本文では文脈に即した分かりやすい訳語を用い、伝統的な訳との関係を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「診察する」は近代医学的に響くため避け、「調べる」とした。「汚れている」は道徳的非難ではなく祭儀上の状態を表す文脈で用いている。
