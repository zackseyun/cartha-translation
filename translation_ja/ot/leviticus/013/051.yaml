source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: ja
  text: 七日目に、祭司はその異常な箇所を調べる。それが衣服、縦糸、横糸、革、また革を用いて作られたあらゆる製品に広がっているなら、その異常な箇所は悪性のツァラアト[a]である。その箇所は不浄である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、伝統的に「らい病」などと訳されてきたヘブライ語。しかしレビ記では、人の皮膚だけでなく衣服や革に現れる異常にも用いられる清浄規定上の語であり、現代の特定の病名を指すとは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べる
  rationale: 祭司による判定手続きの文脈なので、単に「見る」ではなく、注意深く検査する意味を自然な現代日本語で表した。
- source_word: הַנֶּגַע
  choice: 異常な箇所
  rationale: 衣服や革にも生じる目に見える異常を指すため、医学的な感染を断定する「感染」や人体に偏る「患部」を避けた。
- source_word: פָשָׂה
  choice: 広がっている
  rationale: 異常が拡大した状態を表す動詞の基本的な意味を明瞭に訳した。
- source_word: בֶּגֶד
  choice: 衣服
  rationale: 織物一般とも解し得るが、この清浄規定における通常の具体的意味を採った。
- source_word: שְׁתִי / עֵרֶב
  choice: 縦糸／横糸
  rationale: 織物の経糸と緯糸を、専門知識のない読者にも分かりやすい現代語で示した。
- source_word: עוֹר
  choice: 革
  rationale: 物品に加工して用いる素材という文脈なので、「皮」より「革」が適切である。
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: 革を加工して作ったどのような品にも
  rationale: ヘブライ語の包括的な範囲を保ちながら、不自然な逐語表現を避けた。
- source_word: צָרַעַת
  choice: ツァラアト
  rationale: この語は現代医学上のハンセン病と同一ではなく、本章では衣服や革にも用いられるため、誤解を招く病名に置き換えず音写した。
- source_word: מַמְאֶרֶת
  choice: 破壊性の
  rationale: 有害で物を損なう、あるいは食い尽くす性質を表す語義を、過度に医学化せず示した。
- source_word: טָמֵא הוּא
  choice: それは汚れている
  rationale: 祭儀上の不浄を表す定型句であり、原文にある代名詞の指示対象の余地も残した。
theological_decisions:
- issue: צָרַעַתを特定の現代病名として訳すか
  choice: ツァラアト
  alternative: 重い皮膚病／らい病／かび
  rationale: レビ記13章の語は人の皮膚だけでなく衣服や革の異常にも適用される。特定の疾病や菌類と断定せず、清浄規定上の専門語としての幅を保った。
- issue: טָמֵא הוּאの指示対象
  choice: それは汚れている
  alternative: その品は汚れている／その異常な箇所は汚れている
  rationale: 文法上は直前の「異常な箇所」を受け得る一方、規定の実際上は対象物の不浄を宣告しているとも理解できるため、本文では指示対象を限定しなかった。
translation_notes:
  register: 祭司の検査規定にふさわしい簡潔で格調ある文体としつつ、「縦糸、横糸」など一般読者に分かりやすい現代語を用いた。専門的かつ意味範囲の広い צָרַעַת は音写し、脚注で説明した。
