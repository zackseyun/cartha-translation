source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: ja
  text: しかし、もしその明るい斑点がその場所にとどまり[a]、皮膚に広がらず、薄くなっているなら、それはやけどによる腫れである。祭司はその人を清いと宣言する。それはやけどの跡だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その下に立つ」。ここでは、明るい斑点が広がらず、その場所にとどまっていることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: 元の所にとどまり
  rationale: 直訳は「その下に立つ」だが、ここでは斑点が移動・拡大せず、その場所にとどまっているという診断上の意味を自然な日本語で表した。字義的表現は脚注に残した。
- source_word: הַבַּהֶרֶת
  choice: 白い斑点
  rationale: 皮膚に現れる明るい色の斑点を指す。本章の診察場面に即し、現代日本語で視覚的に分かりやすい表現とした。
- source_word: פָשְׂתָה בָעוֹר
  choice: 皮膚に広がらず
  rationale: 病変が皮膚上で拡大することを表す定型的な診断語として訳した。
- source_word: כֵהָה
  choice: 薄くなっている
  rationale: 斑点の色や明るさが弱まった状態を自然に示す。「薄い」という状態だけでなく、観察された変化も表せる形にした。
- source_word: שְׂאֵת הַמִּכְוָה
  choice: やけどによる腫れ
  rationale: שְׂאֵת は皮膚の盛り上がりや腫れ、מִכְוָה はやけどを指すため、両者の関係が明瞭になるように訳した。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司はその人を清いと宣言する
  rationale: ここでの動詞は祭司が実際に清める行為ではなく、診察に基づいて清いと判定・宣言することを意味する。
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: やけどの跡
  rationale: やけどの後に残る瘢痕または痕跡を指す。専門的すぎる「瘢痕」を避け、一般読者に明瞭な「跡」とした。
theological_decisions:
- issue: 「清い」の意味
  choice: 祭司による診断上・儀礼上の宣言として表現する
  alternative: 祭司がその人を清める
  rationale: 文脈は皮膚症状の判定規定であり、祭司が治療や浄化を施すという意味に解さないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。皮膚症状の診断手順が読み取りやすいよう簡潔な文に分け、「清い」はレビ記の儀礼的・共同体的用語として保持した。
