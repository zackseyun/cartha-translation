  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: ja
  text: 祭司は七日目にその病変を調べる。そのとき、うろこ状の患部[a]が広がっておらず、そこに黄色い毛がなく、その患部が皮膚より深く見えない場合は、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、頭部やひげに生じる特有の病変を指す。伝統的に「かいせん」などとも訳されるが、現代医学の特定の病名と同一とは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べる
  rationale: 祭司による診断手順を表すため、単に「見る」ではなく、現代日本語で自然な「調べる」とした。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 特定の現代医学的診断名を持ち込まず、異常の現れた部位を簡潔に表す。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目に
  rationale: 再検査の時期を示す原文の時間表現をそのまま明確に訳した。
- source_word: וְהִנֵּה
  choice: もし
  rationale: ここでは観察結果を導入し、後続節へ続く条件構文として機能するため、日本語では「もし」で自然に示した。独立した感嘆表現は加えなかった。
- source_word: הַנֶּתֶק
  choice: うろこ状に荒れた患部
  rationale: 頭皮またはあごに生じる特有の病変を指す語。現代の特定疾患名に断定せず、読者に病変の性質が伝わる表現を選んだ。
- source_word: לֹא פָשָׂה
  choice: 広がっておらず
  rationale: 皮膚上で病変が拡大していないという診断上の所見を自然に表す。
- source_word: שֵׂעָר צָהֹב
  choice: 黄色い毛
  rationale: 診断徴候となる毛の色を、原文どおり平明に表現した。
- source_word: אֵין עָמֹק מִן הָעוֹר
  choice: 皮膚より深く見えない
  rationale: 病変そのものの実測深度ではなく、目視による外観上の所見であることを「見えない」で明示した。
