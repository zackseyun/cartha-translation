  register: 明瞭な現代標準日本語を基調としつつ、וְהִנֵּהの注意喚起を「見よ」で残して律法本文の荘重さを保った。「その人」を反復して指示対象を明確にし、「もう七日間」で二度目の隔離期間を自然に示した。
