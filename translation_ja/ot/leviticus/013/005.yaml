base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: ja
  text: 祭司は七日目にその人を調べる。すると、患部[a]が祭司の見るところ変わらず、皮膚に広がっていなければ、祭司はその人を再び七日間隔離する[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「患部」に当たるヘブライ語ネガは、「災い」「異常のしるし」などとも訳せる。ここでは祭司が目で調べる皮膚の異常箇所を指し、現代医学上の特定の病気を意味するとは限らない。
    reason: lexical_alternative
  - marker: b
    text: 「隔離する」は、直訳では「彼を閉じ込める」または「彼を閉ざしておく」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: その人を調べる
  rationale: ראהは字義的には「見る」だが、ここでは祭司による儀礼上の判定のための検査を指すため、「調べる」とした。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 検査結果へ注意を促す談話標識を、簡潔で dignified な聖書文体の「見よ」で保持した。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 目に見える皮膚の異常箇所を指し、現代医学上の特定の病名とは限らない。「患部」は「病気」と断定せず、検査対象となる箇所を自然に表す。
- source_word: עָמַד בְּעֵינָיו
  choice: 祭司の目に変わらず
  rationale: 字義的には「彼の目に立っている」。祭司が見たところ状態が変わっていない、という慣用的意味と観察者の視点を保った。
- source_word: לֹא פָשָׂה ... בָּעוֹר
  choice: 皮膚に広がっていない
  rationale: 患部が皮膚の範囲内で拡大していないことを、自然な現代日本語で示す。
- source_word: וְהִסְגִּירוֹ
  choice: その人を隔離する
  rationale: 動詞の基本義は「閉じ込める／閉ざす」。ここでは祭司の手続きによる分離を表し、現代医学的な「検疫」の含意を避けて「隔離する」とした。
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: もう七日間
  rationale: 二度目の七日間であることを、明瞭で自然な日本語として表した。
theological_decisions: []
