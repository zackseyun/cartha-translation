  source_fidelity: 冒頭の接続は直前節との対照として「しかし」で適切です。אָשֶׁר תְּכַבֵּס（「あなたが洗うもの」）は、衣服以下の各対象を修飾します。しかし現行の「洗った衣服、縦糸、横糸…」は修飾が「衣服」にだけ掛かるように読め、完了した洗浄を表してしまいます。洗浄後に異常箇所が消えた場合、二度目に洗われて清くなるという手順は保持します。
  naturalness: 「衣服、縦糸、横糸、または革製品のどれであっても、それを洗い」とすることで、対象範囲と手順が明瞭になります。また、革製品に「患部」を用いるのは現代日本語では身体部位の含意が強いため、「異常箇所」のほうが物品に現れるנגעを自然に表せます。
  terminology: 「縦糸／横糸」は明瞭であり、脚注の「緯糸」は有用です。「清くなる」は祭儀上の清さを適切に保持します。「異常箇所」は現代医学的な診断を持ち込まず、物品上の目に見える問題箇所という原文の範囲を保ちます。
