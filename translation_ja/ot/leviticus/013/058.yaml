source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: ja
  text: しかし、衣服、縦糸、横糸[a]、または革製品のどれであっても、それを洗い、その異常箇所が消えたなら、もう一度洗わなければならない。そうすれば清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「横糸」は、織物で横方向に通す糸。伝統的な用語では「緯糸」。
    reason: 織物に関する専門語の意味と別訳を示すため。
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: 衣服
  rationale: 一般的な衣服または布製品を指す語であり、文脈に即して簡潔な「衣服」とした。
- source_word: הַשְּׁתִי
  choice: 縦糸
  rationale: 織物で縦方向に張る糸を指す。専門語「経糸」より一般読者に分かりやすい表現を選んだ。
- source_word: הָעֵרֶב
  choice: 横糸
  rationale: 縦糸と対をなし、織物を横方向に通す糸を指す。明瞭な現代語として「横糸」とした。
- source_word: כָל כְּלִי הָעוֹר
  choice: どのような革製品でも
  rationale: כְּלִי は器に限らず物品全般を指すため、範囲を狭めない「革製品」とした。
- source_word: הַנָּגַע
  choice: 患部
  rationale: この章で物に現れる目に見える異常箇所を指す。現代の特定の病名や微生物学的診断を持ち込まず、文脈上の反復語として「患部」とした。
- source_word: וְסָר מֵהֶם
  choice: 患部がそれらから消えたなら
  rationale: 接続詞を含む叙述は、洗浄後に患部がなくなった場合の処置を定める文脈上の条件として自然に表した。
- source_word: וְכֻבַּס שֵׁנִית
  choice: もう一度洗わなければならない
  rationale: 受動形と「二度目に」の意味を、規定として自然な義務表現で示した。
- source_word: וְטָהֵר
  choice: そうすれば清くなる
  rationale: 二度目の洗浄後にもたらされる祭儀上の清さを示す。「清潔」ではなく、レビ記の清浄規定に沿って「清い」を用いた。
theological_decisions:
- issue: טהר が表す清さ
  choice: 清くなる
  alternative: きれいになる／清浄と認められる
  rationale: 衛生上の清潔さだけに限定せず、祭儀上の清さを表す語義を保った。また、本文は明示的に「認められる」とは述べないため、その司法的含意を付加しなかった。
translation_notes:
  register: 明瞭で現代的な規定文とした。「縦糸・横糸」は一般読者に理解しやすい語を採用しつつ、脚注で専門語を補った。原文冒頭の接続を「しかし」で示し、直前の処置との対照を保った。
