lexical_decisions:
- source_word: וְאִם
  choice: しかし、……なら
  rationale: 前の検査結果とは対照的な条件を導入する接続表現として、自然な現代日本語にした。
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: 広がるようなら
  rationale: 不定詞絶対形を伴う強調構文の力を、条件表現全体に持たせた。過度に「広がり続ける」と限定せず、病変の拡大を明確に表す。
- source_word: הַנֶּתֶק
  choice: うろこ状の患部
  rationale: 頭皮やひげの部位に生じ、毛の異常を伴う、この章特有の病変を指す。特定の現代的診断名に断定せず、読者に見える病変として表現した。
- source_word: בָּעוֹר
  choice: 皮膚に
  rationale: עוֹרの基本義「皮膚」を採り、病変が皮膚上で範囲を広げることが自然に伝わる助詞を用いた。
- source_word: אַחֲרֵי טָהֳרָתוֹ
  choice: 清いとされた後に
