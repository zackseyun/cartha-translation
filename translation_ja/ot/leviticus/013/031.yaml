  naturalness: 現行の「患部を七日間隔離する」は原文の目的語を字義的に反映しますが、日本語では患部そのものを隔離するようにも読めます。「患部について…隔離の措置を取る」とすれば、原文の『病変』を中心とする表現を保ちつつ自然です。
