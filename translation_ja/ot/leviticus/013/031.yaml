source:
  edition: WLC
  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: ja
  text: 祭司が皮膚の症状[a]の患部を調べ、それが皮膚より深く見えず、そこに黒い毛がないなら、祭司はその患部について七日間、隔離の措置を取る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皮膚の症状」に当たるヘブライ語（ネテク）は、この章では頭部やひげの部位に見られる特定の症状を指す。伝統的には「かいせん」などとも訳されるが、正確な現代医学上の病名は確定できない。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: 患部
  rationale: 祭司が目で調べる病変・異常のある箇所を指すため、現代日本語で簡潔かつ医学的に断定しすぎない「患部」とした。
- source_word: נֶתֶק
  choice: 脱毛性の皮膚症状
  rationale: 頭部またはひげの部位に生じ、毛の状態を診断基準とする特定の症状を指す。語源的にも毛が抜け落ちた状態との関連が考えられるため、特定の現代病名に同定せず、文脈上の特徴を示した。
- source_word: מַרְאֵהוּ
  choice: それが…見えず
  rationale: 直訳的な「その外見は」より自然な日本語にしつつ、視覚的な判定であることを保持した。
- source_word: עָמֹק מִן־הָעוֹר
  choice: 皮膚より深く
  rationale: ヘブライ語の比較表現をそのまま保ち、患部が皮膚面よりくぼんで見えるかどうかという診断基準を表した。
- source_word: שֵׂעָר שָׁחֹר
  choice: 黒い毛
  rationale: 色を一般化せず、原文が明記する「黒い」を保持した。
- source_word: וְהִסְגִּיר
  choice: 隔離する
  rationale: 経過観察のため一定期間分離しておく祭儀法上の処置を、過度に現代的な公衆衛生用語へ限定せず明瞭に表した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を示す標準的で自然な日本語表現とした。
- source_word: וְכִי
  choice: …なら
  rationale: 前後の規定に続く条件法であることを、日本語の自然な条件構文で示した。
- source_word: יִרְאֶה
  choice: 調べ
  rationale: 字義は「見る」だが、ここでは祭司による正式な検査を指すため「調べる」とした。
theological_decisions:
- issue: 隔離の文法上の対象
  choice: 原文どおり「その患部」を目的語として残した
  alternative: 「その患部のある者を七日間隔離する」
  rationale: 実際の処置対象は患者本人と理解されるが、ヘブライ語は明示的に「患部」を目的語としているため、本文ではその表現を保ち、解釈上の補足を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭司による法的・儀礼的検査の厳粛さを保った。現代医学上の病名への断定を避け、原文の観察基準と文法上の曖昧さを保持した。
