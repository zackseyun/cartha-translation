id: LEV.13.2
reference: Leviticus 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: ja
  text: 人の体の皮膚に腫れ、かさぶた、または明るい斑点が生じ、それがその人の体の皮膚にツァラアト[a]の病変となった場合、その人は祭司アロン、またはその息子たち、すなわち祭司たちの一人のもとに連れて来られなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、ここでは祭司が判定する皮膚の病変の分類を指すヘブライ語。伝統的に「らい病」と訳されてきたが、現代のハンセン病と同じものとは限らない。
    reason: 原語の指す範囲を保ち、現代医学上の特定の病気との誤った同一視を避けるため。
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 性別を限定しない一般的な事例を導入する語として、現代日本語の法規的文脈に自然である。
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: 体の皮膚に
  rationale: 「肉の皮膚」という逐語表現を避けつつ、身体表面を指す具体性と原文での反復を保つ。
- source_word: שְׂאֵת
  choice: 腫れ物
  rationale: 皮膚の盛り上がった異常を表す語として明瞭であり、特定の現代医学的診断に限定しない。
- source_word: סַפַּחַת
  choice: かさぶた
  rationale: 正確な皮膚科学的指示対象には不確かさがあるが、具体的な皮膚病変を示す伝統的で理解しやすい訳語である。
- source_word: בַּהֶרֶת
  choice: 光る斑点
  rationale: 明るい、または白っぽい皮膚の斑点という広い意味を保ち、「白斑」などの狭い診断名を避ける。
- source_word: לְנֶגַע צָרָעַת
  choice: ツァラアトの患部
  rationale: נֶגַעを診察対象となる「患部」とし、צָרָעַתは現代のハンセン病と同一視せず、原語を音写してその固有の分類概念を保持する。
- source_word: וְהוּבָא
  choice: 連れて行かなければならない
  rationale: ヘブライ語の受動形と規定上の義務を、自然な現代日本語で表す。
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロン
  rationale: 称号と固有名の標準的で簡潔な日本語表現。
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: 祭司である彼の息子たちの一人
  rationale: アロンの息子たちであり、かつ祭司であるという原文の家族的・職務的関係を明示する。
theological_decisions:
- issue: צָרָעַתの訳し方
  choice: ツァラアト
  alternative: 皮膚病、らい病
  rationale: この語はレビ記における祭司の判定対象となる広い病変分類で、現代医学のハンセン病に自動的に対応しない。「皮膚病」だけでは後続箇所で衣服や家にも用いられる語の統一性が失われるため、音写を本文に置き、脚注で説明する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀法規としての手続き性を保ちつつ、医学用語を過度に限定しない。「ツァラアト」はレビ記全体で人、衣服、家に関して一貫して扱える用語として採用した。
