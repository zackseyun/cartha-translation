  text: א֣וֹ בָשָׂ֔ר כִּֽי יִהְיֶ֥ה בְ/עֹר֖/וֹ מִכְוַת אֵ֑שׁ וְֽ/הָיְתָ֞ה מִֽחְיַ֣ת הַ/מִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: ja
  text: また、体[a]の皮膚に火によるやけどがあり、そのやけどの生きた組織[b]に、赤みを帯びた白い、または白い明るい斑点が生じたなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「体」に当たるヘブライ語は通常「肉」を意味するが、ここでは皮膚を含む人体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「生きた組織」は、やけどの箇所に現れた生きた組織を指すヘブライ語表現。
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: また、…なら
  rationale: 診断規定の別の事例を導入する語。「また」で選択・追加を示し、節末の「なら」で条件文として自然に表した。
- source_word: בָשָׂר
  choice: 体
  rationale: 基本義は「肉」だが、ここでは皮膚を持つ人体を指す。「肉」では現代日本語で誤解されやすいため「体」とした。
- source_word: בְעֹרוֹ
  choice: その皮膚に
  rationale: 直訳的には「その皮膚に」。日本語では直前の「体」と結び「体の皮膚に」とした。
- source_word: מִכְוַת אֵשׁ
  choice: 火によるやけど
  rationale: 火を原因とする熱傷を明確かつ自然な現代日本語で表した。
- source_word: מִחְיַת הַמִּכְוָה
  choice: そのやけどの生々しい組織
  rationale: 患部に現れる生きた、露出した組織を指す表現。「生肉」は食肉を連想させやすいため避けた。
- source_word: בַּהֶרֶת
  choice: 光る斑点
  rationale: レビ記13章の診断用語として、皮膚に目立って現れる明るい斑点を表す。
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: 赤みがかった白色
  rationale: 白を基調として赤みを帯びた混合色という形を自然に表した。
- source_word: אוֹ לְבָנָה
  choice: または白色
  rationale: 二つの色彩所見の選択関係をそのまま保持した。
