source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: ja
  text: しかし、後頭部のはげた所、または前頭部のはげた所[b]に、白く赤みがかった斑点があるなら、それは、その人の後頭部または前頭部のはげた所に現れた皮膚病[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病」と訳されてきた。このヘブライ語はさまざまな皮膚の疾患や異常を広く指し、現代のハンセン病だけを意味するものではない。
    reason: lexical_alternative
  - marker: b
    text: 原文では、後頭部のはげと前頭部のはげに別々の語が用いられている。
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: しかし、～なら
  rationale: 直前の規定との対照を示しつつ、法律文の条件節として自然な日本語にした。
- source_word: בַקָּרַחַת / בַגַּבַּחַת
  choice: 後頭部のはげた所／額側のはげた所
  rationale: 対をなす二語が示す頭の後方と前方の脱毛部位の区別を、分かりやすい現代日本語で保持した。
- source_word: נֶגַע
  choice: 患部
  rationale: 祭司が目で調べる皮膚上の異常箇所を指す。現代医学上の特定の病変へ限定せず、簡潔で自然な語を選んだ。
- source_word: לָבָן אֲדַמְדָּם
  choice: 白く赤みがかった
  rationale: 「白い」と「赤みを帯びた」という色彩描写を保ち、原文の語順にも沿った自然な表現とした。
- source_word: צָרַעַת
  choice: 皮膚病
  rationale: このヘブライ語は現代のハンセン病と同一視できず、レビ記で扱われるより広い皮膚症状・疾患を表すため、中立的な訳語とした。
- source_word: פֹּרַחַת
  choice: 広がっている
  rationale: 語根 פרח がこの文脈で表す、皮膚に発生して進展する状態を自然に示した。「現れている」も可能だが、症状の活動性をよりよく伝える。
- source_word: בְּקָרַחְתּוֹ / בְגַבַּחְתּוֹ
  choice: その人の後頭部または額側のはげた所に
  rationale: 三人称男性単数の所有接尾辞を「その人の」で明示し、前半の部位区分を繰り返して診断箇所を保持した。
theological_decisions:
- issue: צָרַעַת を伝統的な「らい病」と訳すか
  choice: 本文では「皮膚病」とし、伝統訳を脚注で示す
  alternative: らい病／重い皮膚病
  rationale: 原語は現代医学のハンセン病だけを指す語ではない。特定の疾患への誤った同定や偏見を避けながら、伝統的訳語との関係は脚注で透明に示した。
translation_notes:
  register: 祭儀法の判定文にふさわしい簡潔で格調ある文体を保ちながら、現代の一般読者にも理解できる語彙を用いた。「はげた所」は身体部位を具体的に示し、「患部」「皮膚病」は不必要な現代医学的断定を避ける。
