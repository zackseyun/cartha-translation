  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: ja
  text: あるいは、生きた肉[a]が元に戻って白くなったなら、その人は祭司のところに来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「生きている肉」。ここでは患部に現れている生の肉を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ כִּי
  choice: あるいは、～なら
  rationale: אוֹは別の場合を提示し、כִּיはここでは条件を導入する。日本語では「あるいは、～なら」としてその構造を自然に表した。
- source_word: יָשׁוּב
  choice: 元に戻って
  rationale: שׁובの「戻る」という意味を保ち、前節までに述べられた状態からの変化であることを示す。
- source_word: הַבָּשָׂר הַחַי
  choice: 生きた肉
  rationale: 直訳的な表現を本文に残し、病変部に見える生の肉を指す文脈上の意味を脚注で説明することで、原文の身体的な表現を保った。
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: 白くなった
  rationale: נהפךの状態変化を自然な日本語で表し、לבןの色彩語を明確に訳した。
- source_word: וּבָא אֶל־הַכֹּהֵן
  choice: その人は祭司のところに来なければならない
  rationale: 診断手続きに続く行為として、主語を日本語で補い、律法上求められる手順であることを自然に示した。
