  to: 祭司が調べ、体の皮膚に淡い白い斑点があるのを見れば、それは皮膚に生じた発疹である。その人は清いとされる。
  rationale: 本文の「白斑」を、特定の医学的病名を含意しない「発疹」に改めた。脚注は語義上の不確定さと章内での祭儀的区別を説明するにとどめた。また、最終判定を「清いとされる」として、道徳的評価ではなく祭司の判定であることを明瞭にした。
