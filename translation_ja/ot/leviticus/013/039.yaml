  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: ja
  text: 祭司が調べ、体の皮膚に淡い白い斑点があるのを見れば、それは皮膚に生じた発疹である。その人は清いとされる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べて
  rationale: 祭司が皮膚の状態を判定する文脈なので、単なる「見る」ではなく、診察・検分を表す自然な語を選んだ。
- source_word: בְעוֹר בְּשָׂרָם
  choice: 体の皮膚に
  rationale: 直訳的な「彼らの肉の皮膚」を、具体的意味を保ちながら現代日本語として自然にした。人称と数は日本語では文脈上明示する必要がない。
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: 淡い白色の斑点
  rationale: כֵּהוֹת が示す、鮮明ではない、弱い色合いを「淡い」で表し、皮膚上の目に見える印を「斑点」とした。
- source_word: בֹּהַק
  choice: 白斑
  rationale: この章で汚れをもたらす重い皮膚疾患とは区別される皮膚症状を指す稀語。医学的に特定しすぎず、白っぽい皮膚斑という外見を簡潔に示した。語義の幅は脚注に残した。
- source_word: פָּרַח
  choice: 生じた
  rationale: 皮膚症状が現れ出たことを表す。字義的な「咲いた」より、この文脈で自然な日本語を用いた。
- source_word: טָהוֹר הוּא
  choice: その人は清い
  rationale: レビ記13章における祭司の清浄判定を簡潔に表す。「儀式的に」を補わず、原文の祭儀的・法的カテゴリーを保持した。
theological_decisions:
- issue: 祭司による טָהוֹר の判定の性質
  choice: 「その人は清い」とし、祭儀上・法規上の清浄判定として読める表現を保つ。
  alternative: 「その人は儀式上清い」または「その人は治っている」
  rationale: 文脈は道徳的純潔や医学的治癒ではなく、共同体における清浄状態の判定である。ただし原文にない説明語は本文へ加えない。
- issue: בֹּהַק の症状の評価
  choice: 本文では「白斑」とし、害がないという評価を明示的には加えない。
  alternative: 「害のない発疹」
  rationale: 「その人は清い」という判定から深刻な汚れを生じないことは分かるが、בֹּהַק 自体に「害のない」という医学的評価まで含まれるとは断定せず、原文の範囲を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭司法規の手順として読みやすい条件文に整え、「見よ」は逐語的に残さず、検査結果を示す構文に統合した。
