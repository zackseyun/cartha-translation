id: LEV.13.25
reference: Leviticus 13:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: ja
  text: 祭司はその箇所を調べる。すると、明るい斑点の中の毛が白く変わり、その見え方が皮膚より深く見える。それは、やけどの跡に現れた皮膚病[a]である。祭司はその人が儀礼上汚れていると宣告する。これは皮膚病の病変である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ツァラアト」。深刻な皮膚の異常を広く指す語で、伝統的には「らい病」と訳されてきたが、現代のハンセン病だけを意味するものではない。
    reason: 原語の意味範囲を示し、現代の特定疾患との誤った同一視を避けるため。
lexical_decisions:
- source_word: רָאָה
  choice: 調べる
  rationale: 祭司が徴候を正式に検査して判定する文脈なので、単に「見る」ではなく「調べる」とした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 注意を促し、検査で確認された状態を導入する語感を、現代日本語として自然な形で表した。
- source_word: בַּהֶרֶת
  choice: 白い斑点
  rationale: 皮膚に見える明るい病変を具体的に示す。文脈上の白さを明示しつつ、現代医学上の専門診断名は避けた。
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: 毛が白く変わり
  rationale: 毛が白色へ変化したというヘブライ語の状態変化をそのまま表した。
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: その箇所が皮膚より深く見える
  rationale: 実際の深さを断定せず、外見上そう見えるという診断表現を保った。
- source_word: צָרַעַת
  choice: 皮膚病
  rationale: 現代のハンセン病に限定されない広い祭儀的・皮膚病変上の区分であるため、本文では理解しやすい一般語を用い、脚注で原語の範囲を説明した。
- source_word: מִכְוָה
  choice: やけどの跡
  rationale: 単なる受傷時のやけどではなく、病変が現れた既存の受傷箇所を指すため。
- source_word: פָּרָחָה
  choice: 現れた
  rationale: 病変が生じて表面に出たことを自然な日本語で示し、「広がった」とまでは限定しなかった。
- source_word: טִמֵּא אֹתוֹ
  choice: その人を汚れていると宣告する
  rationale: 祭司が汚れを生じさせるのではなく、祭儀上の状態を権威をもって判定することを示した。
- source_word: נֶגַע צָרַעַת
  choice: 皮膚病の患部
  rationale: נֶגַעを目に見える罹患箇所として表し、医学的な感染を断定する「感染症」は避けた。
theological_decisions:
- issue: צָרַעַתを現代の特定疾患と同一視するか
  choice: 皮膚病
  alternative: らい病／ハンセン病、ツァラアト
  rationale: この語はレビ記の清浄規定における広い分類であり、現代のハンセン病との同一視は本文以上の医学的限定を持ち込む。本文の明瞭さを優先して「皮膚病」とし、原語の幅は脚注で保持した。
- issue: 祭司の行為が汚れを生じさせるか判定するか
  choice: 汚れていると宣告する
  alternative: 汚れた者とする
  rationale: 文脈では祭司が徴候に基づいて祭儀上の状態を公式に判定するのであり、病変や汚れを因果的に作り出すとは解さなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭司による検査と宣告という法規的な調子を維持しつつ、医学的に過度な特定を避けた。
