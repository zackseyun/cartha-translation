    rationale: 「それは広がりつつある患部である」は意味を伝えるが、原文は「それは広がっている／広がるものだ」という述語的表現である。日本語でも述語にして、分類名を過度に固定しないほうが自然で原文に近い。
  - severity: low
    issue: 「どのような革製品にでも」
    rationale: כָל（すべての）には「あらゆる革製品に」が簡潔で自然である。
  revised_text: しかし、それが再び衣服、縦糸、横糸、またはあらゆる革製品に現れるなら、それは広がっている。その患部のある物を火で焼かなければならない。
