revisions:
- from: しかし、それが衣服や、縦糸や横糸、またはどのような革製品にでも再び現れるなら、それは広がりつつある患部である。その患部のある物を火で焼かなければならない。
  to: しかし、それが再び衣服、縦糸、横糸、またはあらゆる革製品に現れるなら、それは広がっている。その患部のある物を火で焼かなければならない。
  rationale: 原文の再出現（עוֹד）、織物に関する対語、および法規的な焼却命令を保ったまま、「広がる」という分詞の叙述性を反映し、革製品の列挙を自然な現代日本語に整えた。
  reviewer_model: gpt-5.6-terra
