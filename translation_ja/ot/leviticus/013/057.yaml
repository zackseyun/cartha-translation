  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: ja
  text: しかし、それが再び衣服、縦糸、横糸、またはあらゆる革製品に現れるなら、それは広がっている。その患部のある物を火で焼かなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: 再び現れる
  rationale: ニファル形の観察上の意味と、洗浄後に患部が再発・再出現するという時間的意味を自然な日本語で表す。
- source_word: בֶּגֶד
  choice: 衣服
  rationale: レビ記13章における衣類・布製品を指す標準的な語として明瞭である。
- source_word: שְׁתִי אֽוֹ עֵרֶב
  choice: 縦糸や横糸
  rationale: 織物の縦方向と横方向の糸を指す対語を、一般読者にも理解しやすい現代日本語で表す。
- source_word: כְּלִי עוֹר
  choice: 革製品
  rationale: 革で作られた各種の物品を広く含むヘブライ語表現を簡潔に伝える。
- source_word: פֹּרַחַת הִוא
  choice: それは広がりつつある患部である
  rationale: פרח の『芽を出す』という比喩から生じた、患部が活動的に広がる意味を保持する。進行中のニュアンスを『つつある』で示す。
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: 火で焼かなければならない
  rationale: 法規的な義務を自然で明確な現代日本語として示す。
- source_word: הַנָּגַע
  choice: 患部
  rationale: נגע は本章で、現代医学的な感染症と断定できない異常な斑点・侵された箇所を指す専門語であるため、『感染』より診断を過度に限定しない『患部』とする。
theological_decisions: []
translation_notes:
  register: 祭儀法規としての厳粛さを保ちつつ、現代の一般読者に明瞭な標準語を用いた。『患部』を章内の専門語として採用し、現代医学上の病因を断定する表現は避けた。
