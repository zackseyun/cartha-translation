base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: ja
  text: 祭司は七日目にもう一度その人を調べる。患部が薄くなり、皮膚に広がっていなければ、祭司はその人を清いと宣言する。それは発疹[a]である。その人は衣服を洗い、清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皮膚の発疹」とも訳せる。ヘブライ語は、広がる重い症状とは区別される、比較的軽い皮膚の症状を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べる
  rationale: 祭司による公的な診断の文脈なので、単に「見る」ではなく「調べる」とした。
- source_word: שֵׁנִית
  choice: もう一度
  rationale: 検査の反復を表す副詞として、現代日本語で自然に表現した。
- source_word: כֵּהָה
  choice: 薄くなる
  rationale: 患部の色や見た目が弱まり、目立たなくなった状態を表す。治癒したとまでは断定しない。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 観察対象となる皮膚の異常箇所を指す。現代医学上の感染症と断定する「感染」は避けた。
- source_word: פָשָׂה
  choice: 広がる
  rationale: 皮膚上で患部が拡大するという文脈上の意味を明確にした。
- source_word: בָּעוֹר
  choice: 皮膚に
  rationale: 前置詞בはこの文脈では患部が皮膚に広がることを示すため、自然な日本語として「皮膚に」とした。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司はその人を清いと宣言する
  rationale: 祭司が身体を治療したり浄化したりするのではなく、儀礼上の清さについて判定を下すことを示した。
- source_word: מִסְפַּחַת
  choice: 発疹
  rationale: 重い拡散性の皮膚疾患とは区別される、比較的軽い皮膚の異常を表す語として、分かりやすい「発疹」を用いた。語義の幅は脚注で示した。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: その人は衣服を洗い
  rationale: 主語を明示し、現代日本語として自然にした。
- source_word: וְטָהֵר
  choice: 清くなる
  rationale: 衣服を洗った後の儀礼上の状態を表し、身体的な治癒とは解さない表現にした。
theological_decisions:
- issue: 儀礼上の清さの判定と身体的治癒の区別
  choice: 祭司が「清いと宣言する」とし、洗濯後にその人が「清くなる」とした。
  alternative: 祭司がその人を清める／その人は治る
  rationale: 本文は皮膚症状の治癒そのものではなく、祭司による儀礼上の清浄判定を扱っているため、医学的治癒や祭司自身による浄化を意味する表現を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司法規としての公的で厳粛な調子を保った。「患部」「発疹」は過度に専門的な医学用語を避けつつ、身体的治癒と儀礼上の清さを混同しない語として選んだ。
