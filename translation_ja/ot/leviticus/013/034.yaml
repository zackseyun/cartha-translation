base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: ja
  text: 祭司は七日目に、その皮膚の症状[a]を調べる。それが皮膚に広がっておらず、患部が周囲の皮膚より低く見えなければ[b]、祭司はその人を清いと宣言する[c]。その人は衣服を洗い、清い者となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ネテク。レビ記13章の前後の文脈では、頭またはひげの生える部位に見られる特定の皮膚症状を指す。現代のどの皮膚疾患に当たるかは確定できない。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その外観が皮膚より深くない」。患部が周囲の皮膚よりくぼんで見えないことを示す、祭司による判定基準。
    reason: cultural_note
  - marker: c
    text: 直訳は「祭司はその人を清くする」。ここでは祭司が治療するのではなく、その人が儀礼上清いと公式に判定することを意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: 頭やあごの皮膚疾患
  rationale: この語はレビ記13章で、頭皮またはあごひげの生える部分に現れる特定の症状を指す。現代の特定の病名に同定せず、文脈上の部位と皮膚症状で明確に表した。
- source_word: פָשָׂה
  choice: 広がっておらず
  rationale: 診察対象の症状が皮膚上で拡大していないことを示す、自然で明確な表現。
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן־הָעוֹר
  choice: その見た目が周囲の皮膚より深くなければ
  rationale: 患部が周囲の皮膚よりくぼんで見えるかどうかという祭司の判定基準を表す。「周囲の」を補って比較対象を自然な日本語で明確にした。
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: 祭司はその人を清いと宣言する
  rationale: 祭司が治療するという意味ではなく、儀礼上の清い身分を公式に判定する行為であることを示す。
- source_word: וְכִבֶּס בְּגָדָיו וְטָהֵר
  choice: その人は衣服を洗い、清くなる
  rationale: 衣服を洗う行為と、その後に得られる清い状態を、ヘブライ語の順序に沿って簡潔に表した。
- source_word: וְרָאָה
  choice: 調べる
  rationale: 単に見るのではなく、祭司による所定の診察・検査を意味する文脈に合う。
- source_word: וְהִנֵּה
  choice: それが…なければ
  rationale: 直訳的な「見よ」ではなく、診察によって確認された条件を導く機能を自然な日本語の条件文で表した。
theological_decisions:
- issue: 清めにおける祭司の行為の性質
  choice: 祭司はその人を「清いと宣言する」
  alternative: 祭司はその人を清める
  rationale: この祭儀法の文脈における טהר は、祭司が病気を治したり清さを作り出したりすることではなく、儀礼上の状態を公に判定することを表すため。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある法規文の文体とした。「である」調を過度に硬く用いず、祭司の検査、判定、衣服の洗浄、清い状態への移行という手順が明瞭に読めるようにした。
