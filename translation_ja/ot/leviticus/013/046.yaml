source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: ja
  text: その人にその症状がある間はずっと[a]、その人は汚れた者である。彼は汚れた者である。[b] 彼は独りで住む。その住まいは宿営の外にある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「症状」と訳した語は、「災い」「打撃」「病変」などを表し得る広い語で、ここではこの章で診断された状態を指す。
    reason: lexical_alternative
  - marker: b
    text: ここで「汚れた者」とは、レビ記の律法における汚れの状態を指し、それ自体が必ずしも道徳的な罪を意味するわけではない。
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: 患部
  rationale: נֶגַעは打撃、災厄、患部などを表す広い語で、レビ記13章では祭司の診断対象となる皮膚上の異常を指す。「病気」よりも身体に現れた箇所という文脈に適し、病名を特定しない。
- source_word: בּוֹ
  choice: その人に
  rationale: 前置詞בは「中に／上に」を含み得る。日本語では「患部がその人にある」として、身体に症状が存在することを自然に表した。
- source_word: יִטְמָא
  choice: 汚れている
  rationale: טמאの未完了形は、この規定のもとで継続する汚れの状態を示す。現代日本語では「汚れた者となる」より「汚れている」が明瞭である。
- source_word: טָמֵא הוּא
  choice: 彼は汚れているのである
  rationale: 独立した無動詞文による強調を、前文と分け、「のである」で明示的に保った。原文にない「儀礼的」を本文には補わない。
- source_word: בָּדָד
  choice: 独り離れて
  rationale: בָּדָדは単独で、また他から隔てられている状態を表す。「独り」だけでは物理的隔離が弱くなり得るため、簡潔に「独り離れて」とした。
- source_word: יֵשֵׁב
  choice: 住み
  rationale: ישבは座る、住む、とどまるを意味するが、ここでは居所についての継続的規定なので「住む」が自然である。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外
  rationale: 荒野における共同体の野営地を指す定型句として、「陣営」より生活圏を明瞭に表す「宿営」を採用した。
- source_word: מוֹשָׁבוֹ
  choice: その住まい
  rationale: מוֹשָׁבは居住地、住む場所を表す。日本語として簡潔で具体的な「その住まい」とした。
theological_decisions:
- issue: レビ記13章における汚れの性質
  choice: טמאを本文で「汚れている」と訳し、「儀礼上」などの限定語を加えない。
  alternative: 「儀礼上汚れている」「祭儀的に汚れている」
  rationale: 文脈上はレビ記の律法における汚れの身分を指すが、ヘブライ語自体は単に「汚れている」と述べる。道徳的罪と同一視せず、同時に本文で解釈的に狭めないため、説明は脚注に置く。
- issue: 隔離規定の表現
  choice: בָּדָד יֵשֵׁבを「独り離れて住み」と訳す。
  alternative: 「独りで住み」「隔離されて住み」
  rationale: 原文は受動的に隔離されるとは明記せず、単独・分離の状態で住むよう規定する。「独り離れて」はその両面を保ち、近代的な医療制度の含意を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法文としての厳粛さを保った。原文の反復「汚れている。彼は汚れている」を維持し、後半は日本語の規定文として自然な「でなければならない」で法的効力を示した。脚注記号[a]は関連する語の直後、[b]は節末に置いた。
