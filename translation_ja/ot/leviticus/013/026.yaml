  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: ja
  text: しかし、祭司がそれを調べて、そこに白い毛がなく、その斑点が皮膚より低く見えず[a]、その色が薄いなら、祭司はその人を七日間隔離する[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「皮膚より低くはなく」。すなわち、周囲の皮膚よりくぼんで見えないということ。
    reason: lexical_alternative
  - marker: b
    text: または「その人を閉じ込める」「その人を別にしておく」。観察のため一定期間ほかから離すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: それを調べてみて
  rationale: 基本義は「見る」だが、ここでは祭司による正式な患部の検査を表すため、「調べる」とした。
- source_word: בַּבֶּהֶרֶת
  choice: その光る斑点に
  rationale: בַּהֶרֶת は皮膚上の明るく見える病変を指す。「光る斑点」は視覚的特徴を保ちつつ、特定の現代医学的診断名を持ち込まない。
- source_word: שֵׂעָר לָבָן
  choice: 白い毛
  rationale: 単数形は集合的に理解でき、日本語では本数を限定しない「白い毛」が自然である。
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן־הָעוֹר
  choice: 皮膚より深くはなく
  rationale: שָׁפָל は「低い、くぼんだ」の意。患部が周囲の皮膚より沈んで見えるかという診断基準を、自然な日本語で表した。
- source_word: כֵהָה
  choice: 色が薄れている
  rationale: 患部の色や見え方が鮮明でなく、弱まっている状態を表す。文脈上、「色が薄れている」が明確で自然である。
- source_word: וְהִסְגִּירוֹ
  choice: その人を七日間隔離する
  rationale: 動詞は観察のために閉じ込める、別にしておくことを表す。「隔離する」は簡潔で理解しやすく、現代的な病名や制度を過度に連想させない。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間をそのまま明確に訳した。
- source_word: וְהִנֵּה
  choice: 調べてみて
  rationale: 検査によって判明した状態へ注意を向ける談話機能を、日本語の「てみて」に織り込み、不自然な「見よ」は避けた。
