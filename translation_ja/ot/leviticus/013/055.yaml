  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: ja
  text: 祭司は、その異常箇所が洗われた後、それを調べる。見ると、その異常箇所の見た目が変わらず[a]、広がってもいなければ、それは不浄である。それを火で焼かなければならない。それは素材をむしばむ傷み[b]であり、その一方の面にあっても、他方の面にあってもそうである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その目が変わらず」。ここで「目」は目に見える様子を指し、「色が変わらず」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「素材をむしばむ傷み」に当たるヘブライ語の意味は確定しにくく、「侵食性の異常」とも訳せる。衣服や皮革を損なう状態を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: この最後の句は難解で、直訳に近くは「そのはげの部分にあっても、その額の部分にあっても」。衣服や皮革の文脈では、異常箇所の二つの面または異なる表面状態を指すと考えられるが、具体的に何を区別するかは不明である。
    reason: textual_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: 祭司は…調べる
  rationale: 祭司による判定のための観察なので、単なる「見る」ではなく「調べる」とした。接続のワウは日本語の文脈に自然な形で表した。
- source_word: אַחֲרֵי הֻכַּבֵּס
  choice: 患部が洗われた後
  rationale: כּבס のホファル形が示す受動の意味を明示した。文法上の目的語は「患部」である。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 衣服や皮革などに生じた異常箇所を指すため、現代医学上の特定疾患を想起させにくい「患部」とした。
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: 見た目が変わらず
  rationale: 直訳は「その目を変えない」だが、עַיִן はここで目に見える様相を指す。「色」と限定し得る一方、より広い「見た目」を本文に採用した。
- source_word: וְהַנֶּגַע לֹא פָשָׂה
  choice: 広がってもいなくても
  rationale: 直訳的には「患部が広がっていなくても」。直後に汚れの判定が続くため、非拡大にもかかわらず汚れているという譲歩関係を自然な日本語で明示した。
- source_word: טָמֵא הוּא
  choice: それは汚れている
  rationale: レビ記の祭儀的清浄規定における定型的な状態判定として「汚れている」を用いた。
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: それを火で焼かなければならない
  rationale: 二人称単数の義務的な指示を、現代日本語の法規的表現で示した。
- source_word: פְּחֶתֶת
  choice: 素材をむしばむ傷み
  rationale: 語は材料を侵食・劣化させる状態を表すと考えられるが、厳密な種類は不明である。「むしばむ傷み」は破壊的な性質を示しつつ、現代の特定診断名を持ち込まない。
- source_word: בְּקָרַחְתּוֹ א֥וֹ בְגַבַּחְתּוֹ
  choice: 表側にあっても裏側にあっても
  rationale: 直訳すれば人体の「はげ／額」に関係する対語だが、衣服・皮革の文脈で何を区別するかは不確かである。本文では二つの面を指す可能性を読みやすく示し、脚注で不確かさを保持した。
