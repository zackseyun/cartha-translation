revisions:
- from: 祭司は、患部が洗われた後、それを調べる。もし患部の見た目が変わらず[a]、広がってもいなくても、それは汚れている。それを火で焼かなければならない。それは素材をむしばむ傷み[b]であり、表側にあっても裏側にあっても同じである[c]。
  to: 祭司は、その異常箇所が洗われた後、それを調べる。見ると、その異常箇所の見た目が変わらず[a]、広がってもいなければ、それは不浄である。それを火で焼かなければならない。それは素材をむしばむ傷み[b]であり、その一方の面にあっても、他方の面にあってもそうである[c]。
  rationale: 否定条件を「広がってもいなければ」と明確にし、原文にない「同じである」を削除した。素材に関する文脈に適合するようנגעを「異常箇所」とし、儀礼上のターメーを「不浄」とした。末尾の難解な対語は、一方・他方の面という最小限の理解にとどめ、具体的な意味は脚注で留保した。
