id: LEV.13.23
reference: Leviticus 13:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: ja
  text: しかし、その白い斑点が元の場所にとどまり[a]、広がっていなければ、それは腫れ物の跡である。祭司はその人を清いと宣言する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その下に立ち」。ここでは、白い斑点が広がらず元の場所にとどまることを意味する。
    reason: ヘブライ語の字義的表現と文脈上の意味を示すため。
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…ならば
  rationale: 直前の、患部が広がった場合との対比を示す条件節として、自然な現代日本語にした。
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: 元の場所にとどまり
  rationale: 字義的には「その下に立つ」だが、この診断文脈では斑点がその場にとどまることを表す。「元の場所に」で、広がらないという慣用的な意味を明確にした。
- source_word: הַבַּהֶרֶת
  choice: 白い斑点
  rationale: 皮膚に見える明るい、または白っぽい斑点を指す。特定の現代医学的診断名を持ち込まず、観察可能な特徴を表した。
- source_word: לֹא פָשָׂתָה
  choice: 広がっていなければ
  rationale: レビ記13章で皮膚の患部が拡大することを繰り返し表す動詞であり、「広がる」が明瞭で自然である。
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: 腫れ物の跡
  rationale: 炎症を起こした腫れ物が残した痕を指す。「跡」は「傷跡」よりも状態を限定しすぎず、簡潔で分かりやすい。
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: 祭司はその人を清いと宣言する
  rationale: ここでの動詞は、祭司が本人を物理的に清めることではなく、儀礼上の清い身分であると判定し、公に示すことを意味する。
theological_decisions:
- issue: 儀礼上の清さと身体的な治癒の区別
  choice: 「祭司はその人を清いと宣言する」
  alternative: 「祭司はその人を清める」
  rationale: 本文は祭司による診察と清浄の身分判定を述べており、祭司が患部を治療したり本人を直接清めたりするとは述べていないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「患部」など本文にない補足語や現代医学の病名を避け、祭司による儀礼上の判定を明確にした。
