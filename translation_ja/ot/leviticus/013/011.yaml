  terminology: 「皮膚病」 appropriately avoids identifying צָרַעַת with modern Hansen’s disease. 「汚れている」 is acceptable here as established ritual-legal terminology when framed by the priest’s declaration; the footnote appropriately distinguishes the disease term without overmedicalizing it.
