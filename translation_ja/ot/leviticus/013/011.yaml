source:
  edition: WLC
  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: ja
  text: これは、その人の体の皮膚にある長く続く皮膚病[a]である。祭司はその人を汚れていると宣告しなければならない。その人を隔離してはならない。その人は汚れているからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「以前からある皮膚病」。伝統的に「らい病」と訳されることがあるが、ヘブライ語のツァラアトは、レビ記では現代医学のハンセン病より広い範囲の症状を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: 皮膚病
  rationale: レビ記におけるこの語は、現代医学でいうハンセン病だけでなく、より広い皮膚症状を指すため、医学的に限定しない「皮膚病」とした。
- source_word: נוֹשֶׁנֶת
  choice: 長く続く
  rationale: 「古い、長期間にわたる」という意味を、診断がすでに明らかな持続的症状として自然な現代日本語で表した。
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: その人の体の皮膚に生じた
  rationale: 前置詞は文脈上、症状が皮膚に存在することを表す。「肉」より「体」が現代日本語では自然であり、「生じた」を補って関係を明確にした。
- source_word: וְטִמְּאוֹ
  choice: その人を汚れていると宣告しなければならない
  rationale: 祭司が人を汚れた状態にするのではなく、儀礼上の状態を判定して公に告げるという機能を表した。接続完了形の規定的用法を「しなければならない」で示した。
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: その人を隔離する必要はない
  rationale: ここでの隔離は観察のための措置だが、診断が確定しているので不要である。「隔離してはならない」より、理由節との論理関係が自然に伝わる表現とした。
- source_word: כִּי טָמֵא הוּא
  choice: すでに汚れているからである
  rationale: 隔離による追加観察が不要な理由を示す因果節。「すでに」は原文に明示されないが、確定済みの状態という文脈を明確にする最小限の補足である。
theological_decisions:
- issue: 儀礼的汚れを表す טמא の訳語
  choice: 汚れている
  alternative: 不浄である
  rationale: ここで問題となるのは祭儀法上の状態であって、個人的な道徳的罪ではない。聖書用語として理解されやすい「汚れている」を用い、祭司による宣告という文脈で儀礼的意味を保った。
translation_notes:
  register: 明快で格調を保った現代標準日本語。祭司による診断規定としての法的調子を維持しつつ、医学的に誤解を招く限定語を避けた。
