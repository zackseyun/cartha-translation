source:
  edition: WLC
  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: ja
  text: しかし、祭司が調べ、見ると、その品物が洗われた後にその異常のある箇所が薄くなっているなら、その箇所を衣服、革、縦糸、または横糸から裂き取らなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 前節から続く条件を示しつつ、別の場合への対比的な展開を自然な日本語で表した。
- source_word: רָאָה הַכֹּהֵן
  choice: 祭司が調べてみて
  rationale: 直訳は「祭司が見て」だが、祭儀上の判定を伴う検査の文脈なので「調べる」が明確である。
- source_word: וְהִנֵּה
  choice: （「調べてみて」の「みて」に含意）
  rationale: 注意を促す提示表現を、現代日本語で不自然な「見よ」とせず、発見を表す「調べてみて」に織り込んだ。
- source_word: כֵּהָה הַנֶּגַע
  choice: その患部が薄くなっている
  rationale: נגעは素材に現れた異常箇所を指し、כההはその色や見え方が弱まった状態を表す。「患部」は単なるしみ以上の異常を保ち、「薄くなる」は変化を明瞭に示す。
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: 洗った後に
  rationale: 受動形の意味を日本語で自然に表現した。目的語は文脈上、その品物を指す。
- source_word: וְקָרַע אֹתוֹ
  choice: その部分を切り取らなければならない
  rationale: 動詞は本来「裂く、引き裂く」だが、ここでは患部を品物から除去する指示であるため、「切り取る」が現代日本語として誤解が少ない。
- source_word: מִן הַבֶּגֶד
  choice: 衣服から
  rationale: בגדの一般的かつ文脈に適した訳語。
- source_word: מִן הָעוֹר
  choice: 革から
  rationale: ここでは人体の皮膚ではなく、加工品の素材を指すため「革」とした。
- source_word: מִן הַשְּׁתִי
  choice: 縦糸から
  rationale: 織物の縦方向の糸を指す専門語を、一般読者にも分かる日本語で表した。
- source_word: מִן הָעֵרֶב
  choice: 横糸から
  rationale: 織物の横方向の糸を指し、「縦糸」と対になる明瞭な語を用いた。
theological_decisions: []
translation_notes:
  register: 祭儀法規としての厳粛さを保ちながら、現代の一般読者に明瞭な標準語とした。「見よ」のような古風な提示句は避け、その機能を自然な叙述に組み込んだ。
