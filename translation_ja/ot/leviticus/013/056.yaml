revisions:
- from: しかし、祭司が調べてみて、洗った後にその患部が薄くなっているなら、衣服、革、縦糸、あるいは横糸から、その部分を切り取らなければならない。
  to: しかし、祭司が調べ、見ると、その品物が洗われた後にその異常のある箇所が薄くなっているなら、その箇所を衣服、革、縦糸、または横糸から裂き取らなければならない。
  rationale: 原文の受動的な洗浄、素材上に生じた異常箇所という対象、そして「裂く」という除去動作を明確に反映させた。「見ると」により、וְהִנֵּהの確認・発見の機能も不自然な古語を用いずに保持した。
  reviewer_model: gpt-5.6-terra
