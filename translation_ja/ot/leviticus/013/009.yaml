  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: ja
  text: 人にツァラアト[a]の患部があるとき、その人は祭司のもとに連れて来られなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、伝統的に「らい病」と訳されてきたヘブライ語。しかし、現代のハンセン病だけを指すのではなく、皮膚の異常を含む、より広い分類語と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: 患部
  rationale: レビ記13章の診察規定では、目に見える病変・患部を指す。「感染」では感染性を不必要に断定するため避けた。
- source_word: צָרַעַת
  choice: ツァラアト性の
  rationale: 現代医学のハンセン病に限定できず、皮膚や衣服、家屋にも用いられる分類語であるため、音写しつつ形容的関係を示した。脚注で意味範囲を説明する。
- source_word: כִּי
  choice: とき
  rationale: ここでは事例法の条件を導入しており、自然な日本語の法規表現として「とき」とした。
- source_word: תִהְיֶה
  choice: ある
  rationale: 単純な存在を表す動詞であり、明記されていない「現れる」という意味は加えなかった。
- source_word: בְּאָדָם
  choice: 人に
  rationale: אָדָםはここでは性別を限定しない一般的な人を指す。日本語では「人」が原文の包括的な意味を自然に表す。
- source_word: וְהוּבָא
  choice: その人は…連れて来られなければならない
  rationale: 受動形と手続き上の帰結を保持した。日本語では義務を明確にするため「なければならない」とした。
- source_word: אֶל הַכֹּהֵן
  choice: 祭司のもとに
  rationale: 定冠詞を伴う祭司を、当該の診察を担う祭司として表した。
theological_decisions:
- issue: צָרַעַתを現代医学上の「らい病／ハンセン病」と同一視するか
  choice: 本文では「ツァラアト」と音写し、脚注で広い意味範囲を示す
  alternative: 重い皮膚病、らい病
  rationale: 語の指示範囲は現代の特定疾患より広く、本章では衣服や家屋にも適用される。医学的同定を本文で断定せず、祭儀的・診断的分類の曖昧さを保つ。
- issue: אָדָםの性別表現
  choice: 人
  alternative: 男、人間
  rationale: この一般的な事例規定は男性だけに限定されていない。「人」は原語の総称的用法を現代日本語で正確かつ自然に伝える。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法規的文体。専門的な医学診断を避け、原語固有の分類概念を音写と脚注で保持した。
