  choice: 汚れている
  alternative: 不潔である／汚れた者となる
  rationale: ここでの語は道徳的非難ではなく祭儀上の状態を表すため、レビ記で通用する簡潔な定型表現を採用した。
- issue: בּוֹ の指示対象
  choice: 患部を指す「そこに」
  alternative: その人に
  rationale: 直前の文脈と英語監査層の改訂に沿い、現れる場所は人そのものではなく患部であることを示した。
