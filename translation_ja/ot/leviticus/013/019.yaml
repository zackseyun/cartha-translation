  yaml_path: translation/ot/leviticus/013/019.yaml
  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: ja
  text: 腫れ物のあった場所に、白い腫れ、あるいは赤みがかった白い斑点が生じたなら、その人は祭司の診察を受けなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その人は祭司に見られる」または「祭司の前に出る」とも訳せる。ここでは、祭司による診察を受けるためにその人が出向くことを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 生じたなら
  rationale: 皮膚症状が以前の腫れ物の跡に現れることを表す文脈上の意味を、自然な条件表現で示した。
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: 腫れ物のあった所に
  rationale: שְׁחִיןを炎症性のできものとして分かりやすく「腫れ物」とし、その部位を指すことが明確になるように訳した。
- source_word: שְׂאֵת לְבָנָה
  choice: 白い腫れ
  rationale: שְׂאֵתは皮膚の盛り上がった病変を指すため、簡潔で理解しやすい「腫れ」とした。
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: 赤みがかった白い斑点
  rationale: בַהֶרֶתを周囲から目立つ皮膚の斑として「斑点」と訳し、白色でありながら赤みを帯びるという複合的な色調を保持した。
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: それを祭司に見せなければならない
  rationale: ニファル形の「見られる／現れる」を、祭司による診察に提示するという法的手続きとして自然な日本語で表した。
