  yaml_path: translation/ot/leviticus/013/040.yaml
  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: ja
  text: ある男の頭髪が抜け落ちた場合、その人ははげている。その人は清い。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ
  choice: 男
  rationale: 男性単数名詞で始まる身体上の事例規定であり、原文の性を保って「男」とした。
- source_word: כִּי
  choice: ～ても
  rationale: 事例を導入する条件表現。後半がその状態でも清いとの判定なので、日本語では譲歩的条件が自然である。
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: 頭から髪が抜け落ちる
  rationale: מרט のニファルは毛がなくなる、または抜かれて露出することを表す。原因を限定せず、後続の「はげている」との語彙上の区別も保った。
- source_word: קֵרֵחַ
  choice: はげている
  rationale: 頭髪のない状態を示す形容的述語として、明瞭で自然な現代日本語を用いた。
- source_word: טָהוֹר
  choice: 清い
  rationale: レビ記13章における儀礼上の清浄という判定を表し、道徳的潔白を意味しない定訳語を用いた。
- source_word: הוּא ... הוּא
  choice: その人は…だけで、清い
  rationale: 二つの述語を明示しつつ、日本語として自然につなぎ、単なる脱毛は汚れの判定理由ではないという対照を表した。
theological_decisions:
- issue: レビ記の汚れに関する規定での清浄用語
  choice: 清い
  alternative: 純粋である
  rationale: ここで問題となるのは皮膚疾患の診察に伴う儀礼上の状態であり、道徳的な無罪や内面的純粋さではないため。
translation_notes:
  register: 明瞭で現代的な標準日本語。「はげ」は身体状態を表す一般語として用い、診断規定の簡潔さを保った。「清い」はレビ記の儀礼的カテゴリーを一貫して示す。
