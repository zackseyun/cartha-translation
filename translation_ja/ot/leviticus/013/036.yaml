  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר לֹֽא יְבַקֵּ֧ר הַ/כֹּהֵ֛ן לַ/שֵּׂעָ֥ר הַ/צָּהֹ֖ב טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: ja
  text: 祭司がその人を調べ、かさ状の患部[a]が皮膚に広がっているのを確認したなら、祭司は黄色い毛があるかどうかを調べる必要はない。その人は儀礼上、汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このヘブライ語は、特に頭部やひげの部分に生じる、かさ状の皮膚症状を指す。「かゆみ」と訳すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: 祭司がその人を調べ
  rationale: 祭司による判定のための視診という文脈なので、単なる「見る」ではなく「調べる」とした。周囲の規定に基づく条件的な手順として訳した。
- source_word: וְהִנֵּה
  choice: 広がっているのを確認したなら
  rationale: 観察によって判明した状態を示す指示的な力を、日本語の診察手順として自然に表した。「見よ」とすることも可能だが、ここでは条件文とのつながりを優先した。
- source_word: פָּשָׂה
  choice: 広がっている
  rationale: 患部が以前より拡大したことを示す、皮膚疾患規定での標準的な意味を採った。
- source_word: הַנֶּתֶק
  choice: かさ状の患部
  rationale: 頭部またはひげの部分に生じ、鱗屑や毛の変化を伴う特定の症状を指す。現代日本語で症状の外観が分かりやすく、特定の現代病名に断定しない表現とした。
- source_word: בָּעוֹר
  choice: 皮膚に
  rationale: ヘブライ語の前置詞を日本語として自然な位置表現にした。
- source_word: לֹא יְבַקֵּר
  choice: 調べる必要はない
  rationale: 患部の拡大が確認されれば、別の徴候について追加の検査をする必要がないという規定上の意味を表した。
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: 黄色い毛があるかどうか
  rationale: 前節までに挙げられた診断徴候を明確にし、日本語で「毛を調べる」の目的が分かる形にした。
- source_word: טָמֵא הוּא
  choice: その人は汚れている
  rationale: 文法上の主語を患部ではなく診察された人と捉え、レビ記の清浄規定で定着した表現を用いた。
theological_decisions:
- issue: レビ記の清浄規定における טָמֵא の性質
  choice: 汚れている
  alternative: 不浄である
  rationale: ここで示されるのは祭儀的・共同体的な清浄状態であり、道徳的罪責の宣告ではない。「汚れている」は聖書の清浄規定で理解しやすい定訳で、現代日本語としても平明である。
translation_notes:
  register: 現代の一般読者に理解できる明瞭な規定文としつつ、祭司による診察という厳粛な文脈を保った。特定の現代医学上の病名には置き換えず、原語が示す症状の範囲を残した。
