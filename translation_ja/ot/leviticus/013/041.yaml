  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: ja
  text: また、頭の前の部分の毛が抜けたなら[a]、その人は前頭部がはげているのであり、清い。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「頭の前の部分がはげたなら」。ヘブライ語は、前節にある後頭部または頭頂部側のはげとは異なり、前頭部のはげを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: 頭の前の部分
  rationale: 直訳的には「彼の顔の側・端から」だが、前節との対比と頭皮の診断という文脈から、頭の前方部分を指す。現代日本語で自然かつ解剖学的に明確にした。
- source_word: יִמָּרֵט
  choice: 毛が抜けた
  rationale: ニファル形は毛が失われて地肌が露出することを表す。この診断文脈では、原因を特定しない「毛が抜けた」が自然である。
- source_word: רֹאשׁוֹ
  choice: 頭
  rationale: 身体部位を指す通常の意味。日本語では「その人の」が文脈上明白なので、重複を避けた。
- source_word: גִּבֵּחַ
  choice: 額の側がはげている
  rationale: 前節の後頭部・頭頂部側のはげを表す語と区別され、前頭部のはげを指す。その対比が伝わるよう部位を明示した。
- source_word: טָהוֹר
  choice: 清い
  rationale: レビ記の祭儀的な清浄状態を表す定型語として「清い」を用い、道徳的な潔白とは区別した。
theological_decisions:
- issue: 清浄規定における祭儀的身分の用語
  choice: 清い
  alternative: 純粋である／潔白である
  rationale: ここで扱われるのは祭司による身体状態の判定と祭儀上の身分であって、道徳的な純潔ではない。「清い」がレビ記の区分を最も適切に保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。診断規定らしい簡潔さを保ちつつ、前節との解剖学的な対比と祭儀的な「清い」という用語を明確にした。
