  to: 祭司がそれを調べると、患部は皮膚より深く見え、そこに生えた毛が白く変わっている。祭司はその人を汚れていると宣告する。これは皮膚の異常[a]の病変であり、腫れ物の中に生じたものである。
  rationale: 原文の観察から儀礼的判定へ進む流れを保つため、条件構文を叙述文に改めた。本文にない程度を加える「重い」を除き、נֶגַע צָרַעַתを中立的に「皮膚の異常の病変」とした。脚注アンカーは同じ箇所に維持し、ツァラアトの語義範囲を説明した。
