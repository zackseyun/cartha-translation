source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: ja
  text: 祭司がそれを調べると、患部は皮膚より深く見え、そこに生えた毛が白く変わっている。祭司はその人を汚れていると宣告する。これは皮膚の異常[a]の病変であり、腫れ物の中に生じたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ツァラアト」。伝統的には「らい病」と訳されてきた語だが、レビ記では現代のハンセン病に限らず、さまざまな皮膚の異常を指すと考えられる。
    reason: ツァラアトを現代の特定疾患と同一視することを避けつつ、伝統的な訳語との関係を示すため。
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べる
  rationale: 祭司が徴候を確認する診断上の文脈なので、単なる「見る」ではなく「調べる」とした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 観察によって判明した徴候へ注意を向ける談話標識の働きを、自然な現代日本語で表した。
- source_word: מַרְאֶהָ שָׁפָל מִן־הָעוֹר
  choice: その患部が皮膚より深く見え
  rationale: 周囲の皮膚より陥没して見えるという外観上の徴候を示す。「見え」により、実際の深さではなく観察された外観であることを保った。
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: そこに生えた毛が白く変わっている
  rationale: 女性接尾辞が指す患部にある毛だと明確にし、完了した変化の結果状態を表した。
- source_word: וְטִמְּאוֹ
  choice: その人を汚れていると宣告する
  rationale: 祭司が人を汚すのではなく、儀礼上の状態を権威をもって判定することを示した。
- source_word: נֶגַע צָרַעַת
  choice: 重い皮膚病の患部
  rationale: נֶגַעを診断対象となる「患部」、צָרַעַתを現代のハンセン病に限定されない「重い皮膚病」とした。
- source_word: בַּשְּׁחִין
  choice: 腫れ物のところに
  rationale: שְׁחִיןは炎症を伴う腫れ物・できものを指すため、一般読者に明瞭な「腫れ物」を選んだ。
- source_word: פָּרָחָה
  choice: 現れた
  rationale: 病変が芽を出すように発現する意味を自然に表し、必ずしも広範囲への拡大を意味する「広がった」は避けた。
theological_decisions:
- issue: レビ記の清浄規定における צָרַעַת の訳語
  choice: 重い皮膚病
  alternative: らい病／ハンセン病
  rationale: צָרַעַתは現代医学上のハンセン病だけを指すとは限らず、レビ記ではより広い異常を含む。医学的に過度な限定を避けつつ、祭司による重大な儀礼的診断であることを「重い」で示した。
- issue: וְטִמְּאוֹ の作用
  choice: 汚れていると宣告する
  alternative: 汚れた者にする
  rationale: 祭司の言葉が病変を生じさせたり道徳的罪を付与したりするのではなく、本文の清浄規定に基づいて儀礼上の状態を判定するものとして訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭司による手続き的な診断を自然に表しつつ、「深く見え」によって外観上の判断であることを保持した。「汚れ」は道徳的非難ではなくレビ記の儀礼的区分を表す語として用いた。
