  text: וְ/רָאָ֨ה אֹת֜/וֹ הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת הַ/נֶּ֨גַע֙ לְבָנָ֣ה אֲדַמְדֶּ֔מֶת בְּ/קָרַחְתּ֖/וֹ א֣וֹ בְ/גַבַּחְתּ֑/וֹ כְּ/מַרְאֵ֥ה צָרַ֖עַת ע֥וֹר בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: ja
  text: 祭司がその人を調べると、見よ、その病変の隆起が、頭の後部のはげた部分、または前部のはげた部分[b]にあって、赤みを帯びた白色であり、体の皮膚に現れるツァラアト[a]の外観と同じである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」はヘブライ語の音写。伝統的に「らい病」と訳されてきたが、レビ記ではハンセン病に限らず、さまざまな深刻な皮膚の異常を含む語である。
    reason: lexical_alternative
  - marker: b
    text: ここで「はげた部分」と訳した二つのヘブライ語は、おそらく頭の後部と前部の脱毛部を区別している。
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べ
  rationale: 祭司が皮膚の状態を判定する文脈なので、単に「見る」ではなく、診察・検査の意味を含む「調べる」とした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 観察によって判明した状態を導入する機能を、現代日本語で自然な「見ると」によって表した。
- source_word: שְׂאֵת הַנֶּגַע
  choice: 患部の盛り上がり
  rationale: שְׂאֵת の隆起した状態と、הַנֶּגַע の病変・患部という意味をともに保った。
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: 赤みを帯びた白色
  rationale: 白色を基調としつつ赤みのある複合的な色合いを、明瞭な日本語で表した。
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: 頭の後部のはげた所か、前部のはげた所
  rationale: 対をなす二語が頭の後部と前部の脱毛部を指すと考えられるため、その対比を本文に明示しつつ、語義の蓋然性は注で示した。
- source_word: צָרַעַת
  choice: ツァラアト
  rationale: 現代医学上の特定疾患、とりわけハンセン病と同一視することを避け、レビ記独自の広い病変カテゴリーを音写で保持した。
- source_word: עוֹר בָּשָׂר
  choice: 体の皮膚
  rationale: 直訳的な「肉の皮膚」より自然でありながら、身体の皮膚を指す意味を保った。
theological_decisions:
- issue: צָרַעַתを現代の特定疾患と同定するか
  choice: 固有の分類名として「ツァラアト」と音写する
  alternative: 「らい病」「ハンセン病」「重い皮膚病」
  rationale: 本文が扱う範囲は現代医学上のハンセン病より広く、単一の病名に限定できない。音写によって古代イスラエルの祭儀的・診断的カテゴリーとしての幅を保った。
translation_notes:
  register: 祭司による判定手順として明瞭で落ち着いた現代標準語を用いた。原文が次節へ続く条件節であることを示すため、文末を「なら、」とした。「見よ」は直訳せず、観察結果を自然に導く「見ると」とした。
