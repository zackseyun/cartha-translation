  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: ja
  text: 祭司が調べ、皮膚の疾患[a]がその人の全身を覆っているのを認めたなら、その人を清いと宣言する[b]。それがすべて白く変わっているなら、その人は清い。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ツァラアトは、伝統的に「らい病」と訳されてきたが、レビ記では現代のハンセン病に限らず、さまざまな皮膚の異常を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その患部を清いと宣言する」。清いとの判定は、その患部のある人に適用される。
    reason: source_form
lexical_decisions:
- source_word: וְרָאָה
  choice: 診察し
  rationale: 字義的には「見て」だが、祭司が皮膚の状態を判定する法的・祭儀的文脈では、単なる目視ではなく「診察する」が自然で正確。
- source_word: וְהִנֵּה
  choice: 確認したなら
  rationale: 観察の結果として判明した状態を示す語。前後の条件法的な規定に合わせ、現代日本語で自然な手続き表現とした。
- source_word: הַצָּרַעַת
  choice: 皮膚の疾患
  rationale: צָרַעַת は現代医学のハンセン病だけを指す語ではなく、レビ記ではより広い皮膚症状を含むため、誤った医学的限定を避けた。
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: その人の全身
  rationale: 字義は「彼の肉のすべて」。ここでは身体の表面全体を指すため、自然な日本語の「全身」とした。
- source_word: וְטִהַר
  choice: 清いと宣言する
  rationale: ピエル形は治療して清めることではなく、祭司が清いとの判定を下すことを表す。
- source_word: אֶת הַנָּגַע
  choice: 患部のある人
  rationale: 文法上の直接目的語は「患部・病変」だが、清いとの判定が実際に適用される人を本文では明示し、字義的構造は脚注に残した。
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: すべてが白く変わっている
  rationale: 何が「すべて」なのかを過度に限定せず、ヘブライ語の指示対象の幅を保った。
- source_word: טָהוֹר הוּא
  choice: その人は清い
  rationale: レビ記の祭儀的清浄を表す定型的な判定。「儀式的に」を補わず、簡潔な原文の断定を保った。
theological_decisions:
- issue: צָרַעַת の病名
  choice: 皮膚の疾患
  alternative: らい病／ハンセン病
  rationale: 古代の語を現代の特定疾患と同一視せず、レビ記における広い症状カテゴリーを保つ。
- issue: 祭司の役割を示す וְטִהַר
  choice: 清いと宣言する
  alternative: 清める
  rationale: 祭司はここで治癒や清めを生じさせるのではなく、観察に基づいて清浄の判定を告げる。
- issue: אֶת הַנָּגַע の対象
  choice: 患部のある人
  alternative: 患部を清いと宣言する
  rationale: 原文の文法的対象は「患部・病変」だが、法的判定の帰属先はその人である。本文の明瞭さと原文の形の双方を、本文と脚注で示した。
translation_notes:
  register: 現代の一般読者に明快な、簡潔で品位ある法規文体。「診察」「宣言」によって祭司の判定行為を明示しつつ、医学的・教派的な説明を本文へ持ち込まない。
