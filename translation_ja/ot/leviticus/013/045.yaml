source:
  edition: WLC
  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: ja
  text: 皮膚の病気を患い、その症状のある人は、衣服を裂き、髪を乱したままにし、口ひげの辺りを覆い[a]、「汚れている、汚れている！」と叫ばなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「上唇を覆い」。ヘブライ語は上唇ないし口ひげの辺りを指す。
    reason: 語の指示範囲に曖昧さがあるため。
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: 皮膚の病気にかかった人
  rationale: ツァラアトを現代医学のハンセン病に限定せず、レビ記の文脈にある広範な皮膚症状を表す。ヘブライ語は男性単数形だが、ここでは性別を不必要に明示しない自然な日本語とした。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: ここでは皮膚に現れた異常・病変を指す。「感染」とすると現代の病原体概念を含み得るため避けた。
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: 衣服を引き裂き
  rationale: 衣服が裂かれた状態になるという命令を、悲嘆や公的なしるしとして自然に表した。
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: 髪を乱したままにし
  rationale: פָרוּעַは髪を解いた、整えない状態を示す。「頭を裸にする」と断定せず、主要な語義を採った。
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: 口ひげの辺りを覆い
  rationale: שָׂפָםが上唇または口ひげの辺りを指す曖昧さを保ち、顔のその部分を覆う動作として訳した。
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 「汚れている、汚れている」と叫ばなければならない
  rationale: 反復による強調と、公に告げ知らせる行為を保持した。「汚れ」はこの文脈で儀礼上の状態を表し、道徳的罪悪を意味すると限定しない。
theological_decisions:
- issue: טָמֵאが表す汚れの性質
  choice: 「汚れている」と訳し、儀礼上・共同体上の状態を表す語として保持する
  alternative: 「不浄だ」「けがれている」
  rationale: 道徳的な罪や現代医学上の感染性を本文に読み込まず、レビ記における儀礼的・公的身分の含みを残す。「汚れている」は平明でありつつ、文脈から儀礼的意味が理解できる。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、律法の命令としての厳粛さを保った。「〜なければならない」で一連の未完了形の規定的用法を表した。
