base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/018.yaml
  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: ja
  text: 人の体の皮膚に腫れ物ができ、それが治った場合、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: 人の体
  rationale: בָשָׂר は字義的には「肉」だが、ここでは皮膚に症状を持つ人の身体を指す。日本語の診断規定として「人の体」が明瞭で自然である。
- source_word: כִּי יִהְיֶה
  choice: できた場合
  rationale: כִּי は事例法の条件を導き、יִהְיֶה は「生じる、ある」の意。「場合」として条件性を保ちつつ、「できる」で自然に表した。
- source_word: בֽוֹ בְעֹרוֹ
  choice: その皮膚に
  rationale: 二つの前置詞句が身体における位置を示す。日本語では重複を避け、所有関係を「その皮膚に」と明示した。
- source_word: שְׁחִין
  choice: 腫れ物
  rationale: 炎症を伴うできもの、腫れ物を指す語。現代日本語で理解しやすく、特定の現代医学的診断に狭めすぎない表現を採った。
- source_word: וְנִרְפָּא
  choice: それが治った
  rationale: רפא のニファル形は「治る／癒やされる」の両義を許す。この文脈では患部の状態変化を自然な自動詞「治る」で表し、完了した事例として「治った」とした。
theological_decisions: []
translation_notes:
  register: 祭司による皮膚症状の判定規定にふさわしい、簡潔で明瞭な事例法の文体。「肉」という直訳調を避けつつ、身体上の病変という原文の指示を保持した。次節へ続く従属的な条件節なので読点で終えた。
