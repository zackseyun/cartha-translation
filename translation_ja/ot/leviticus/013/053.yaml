  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: ja
  text: しかし、祭司が調べ、その病変が衣服にも、縦糸にも横糸[a]にも、またどの革製品にも広がっていないことが分かったなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「横糸」は「緯糸」ともいう。縦糸と交差する方向の糸を指す。
    reason: 繊維用語の一般的な呼称と専門的な呼称を併記し、原語の指示対象を明確にするため。
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 前節から続く条件を示しつつ、前の場合との対照を自然な現代日本語で表した。
- source_word: יִרְאֶה הַכֹּהֵן
  choice: 祭司が調べてみて
  rationale: 動詞の字義は「見る」だが、ここでは祭司による正式な再検査を指すため、「調べる」とした。「みて」により、וְהִנֵּה が示す確認結果への移行も自然に含めた。
- source_word: לֹא פָשָׂה הַנֶּגַע
  choice: その患部が広がっていない
  rationale: פשה は患部の拡大を表す。「患部」は נגע を現代的な特定の病名に限定せず、素材に現れた異常箇所として表せる。
- source_word: בַּבֶּגֶד
  choice: 衣服でも
  rationale: בגד の基本的で文脈に即した訳。列挙される各素材・品目のどこに患部がある場合も含む構文を「でも」で表した。
- source_word: בַשְּׁתִי
  choice: 縦糸
  rationale: 織物の長手方向の糸を指す伝統的かつ分かりやすい繊維用語。
- source_word: בָעֵרֶב
  choice: 横糸
  rationale: 縦糸と交差する方向の糸を指す。一般読者に分かりやすい語を採用し、専門用語を脚注に示した。
- source_word: בְּכָל כְּלִי עוֹר
  choice: どの革製品でも
  rationale: כְּלִי は広く物品・用具を意味するため、「製品」として範囲を狭めすぎず、עוֹר は加工品の文脈に合わせて「革」とした。
