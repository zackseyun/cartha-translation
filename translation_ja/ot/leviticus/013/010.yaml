base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: ja
  text: 祭司がその人を調べ、皮膚に白い腫れ[a]があり、その腫れが毛を白くし、さらにその腫れの中に生きた肉の部分[b]があるなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「盛り上がった斑点」とも訳せる。ヘブライ語は、この章で皮膚の盛り上がった病変を指す専門的な語。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「生きた肉」。病変の中に露出して現れた、生きた組織を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べて
  rationale: 祭司による皮膚症状の診断的な観察を表す文脈なので、単なる「見る」より「調べる」が自然である。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記の清浄規定において、判定を担う役職を示す標準的な訳語。
- source_word: וְהִנֵּה
  choice: （明示せず、「あり」で表現）
  rationale: 観察によって判明した状態を導く機能を、日本語では「皮膚に…があり」という自然な構文に織り込んだ。
- source_word: שְׂאֵת
  choice: 腫れ
  rationale: 皮膚に盛り上がった病変を指す章内の専門語であり、現代日本語で明瞭な「腫れ」を採用した。盛り上がった斑点という可能性は脚注に残す。
- source_word: בָּעוֹר
  choice: 皮膚に
  rationale: עוֹרは皮膚を意味し、病変が皮膚に現れていることを自然な日本語で示す。
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: それが毛を白く変え
  rationale: 女性単数代名詞は直前の「腫れ」を受ける。病変によって毛が白くなったという原文の使役的表現を保った。
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: 生きた肉の部分
  rationale: 直訳的な「生きた肉」を保ちつつ、病変内に見える生体組織の一部分であることが伝わるよう「部分」を添えた。
- source_word: בַּשְׂאֵת
  choice: その腫れの中に
  rationale: 病変内部に位置することを明示し、שְׂאֵתの訳語を一貫させた。
