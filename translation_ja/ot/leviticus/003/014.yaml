  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: ja
  text: 彼はその中から、自分の献げ物、すなわちヤハウェへの火による献げ物として、内臓を覆う脂肪と、内臓の上にあるすべての脂肪を献げる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 献げる
  rationale: ヒフィル形は祭儀の文脈で、供え物を神の前に差し出すことを表す。「献げる」は儀礼的意味を自然な現代日本語で伝える。
- source_word: מִמֶּנּוּ
  choice: その中から
  rationale: 接尾辞は直前の犠牲動物を指す。ここでは、その動物から所定の部分を取り分ける意味が明瞭になる表現とした。
- source_word: קָרְבָּנוֹ
  choice: 自分の献げ物
  rationale: קָרְבָּן は祭儀上の供え物を指す専門語であり、「献げ物」が明瞭かつ自然である。
- source_word: אִשֶּׁה
  choice: 火による献げ物
  rationale: 語源と用法には議論があり、「食物の献げ物」と理解される場合もあるが、祭壇の火で焼く供え物という伝統的かつ文脈に適した意味を本文に採用した。別解は脚注に示した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞 ל は献呈の相手を示す。神名 יהוה は固有の契約名として「ヤハウェ」と音写した。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 犠牲動物のうち祭壇で焼かれる特定の脂肪部分を指すため、直接的な「脂肪」とした。
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 内臓を覆う
  rationale: 分詞の修飾関係を自然な連体節で表し、קֶרֶב はこの解剖学的文脈で「内臓」とした。
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内臓の上にあるすべての脂肪
  rationale: עַל の空間的意味と、脂肪部分を包括する כָּל の意味を保持した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を訳文でも明示し、一般に受け入れられている推定発音に基づいて音写した。
- issue: אִשֶּׁה の意味
  choice: 火による献げ物
  alternative: 食物の献げ物
  rationale: 火で焼かれる祭儀行為を前面に出す伝統的理解を本文に置きつつ、祭司文書における神への食物という用語法の可能性を脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その中から」で犠牲動物から脂肪を取り分ける動作を示し、「すなわち」によって後続する具体的部位が献げ物の内容であることを明確にした。
