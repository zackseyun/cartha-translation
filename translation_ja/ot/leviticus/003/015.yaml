base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: ja
  text: また、二つの腎臓と、その上にあって腰のあたりにある脂肪、および肝臓の上にある付属部分[a]を、腎臓とともに[b]取り除く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。この部分を指すヘブライ語の厳密な解剖学上の意味は不確かである。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「腎臓の上に」。ここでは、腎臓と一緒に取り除くという意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 犠牲動物の解剖を述べる箇所で、כְּלָיָה は明確に腎臓を指す。数詞を保って自然な日本語とした。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: レビ記の犠牲規定では、取り分けて献げる脂肪部分を指す。現代日本語で明瞭な「脂肪」とした。
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: その上、すなわち腰のあたりにある
  rationale: 腎臓に付着し、腰部に位置する脂肪を示す二つの関係節のつながりを保った。כְּסָלִים はここでは腰部・脇腹周辺を指すため、「腰のあたり」とした。
- source_word: הַיֹּתֶרֶת
  choice: 付属部分
  rationale: 肝臓に関連する突出部を指すが、厳密な現代解剖学上の同定には不確かさがある。「葉」と断定せず、原語の曖昧さを保つ表現とした。
- source_word: עַל הַכָּבֵד
  choice: 肝臓の上にある
  rationale: 前置詞 עַל の基本的な位置関係をそのまま表し、特定の付着様式を補わないようにした。
- source_word: עַל הַכְּלָיֹת
  choice: 腎臓とともに
  rationale: 字義的には「腎臓の上に」だが、この祭儀上の定型句では当該部分を腎臓と一緒に取り除く手順を示すと考えられる。本文では自然な手順表現とし、字義は脚注に示した。
- source_word: יְסִירֶנָּה
  choice: 取り除く
  rationale: סור のヒフィル形が表す除去の意味を簡潔に訳した。日本語の規定文として主語を繰り返さず、文脈上の行為者を暗黙にした。
