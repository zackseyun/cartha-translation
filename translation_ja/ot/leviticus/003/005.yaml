revisions:
- from: アロンの子らは、それを祭壇の上で、火の上の薪に載せた全焼のささげ物の上に置いて焼き、煙にする。これは、ヤハウェへの火によるささげ物[a]、喜ばしい香りである。
  to: アロンの子らは、それを祭壇で、火の上の薪の上にある全焼のささげ物の上で焼いて、煙にする。これは、ヤハウェへの火によるささげ物[a]、喜ばしい香りである。
  rationale: 原文の火・薪・全焼のささげ物という重層的な位置関係を、「火の上の薪の上にある全焼のささげ物」として明示した。これにより、原文にない「載せる」「置く」という行為を加えず、祭壇上でその部分を焼いて煙にするという指示を保った。
