id: LEV.3.5
reference: Leviticus 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: ja
  text: アロンの子らは、それを祭壇で、火の上の薪の上にある全焼のささげ物の上で焼いて、煙にする。これは、ヤハウェへの火によるささげ物[a]、喜ばしい香りである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物のささげ物」。
    reason: אִשֶּׁהは「火によるささげ物」を指す祭儀用語と理解できる一方、祭壇で神に供される「食物のささげ物」という機能的な訳も可能なため。
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: 焼き、煙にする
  rationale: 祭儀文脈におけるקטרのヒフィル形は、祭壇で焼いて煙として立ち上らせる行為を表す。「焼く」だけでなく「煙にする」を添え、語の祭儀的な含意を自然な現代日本語で示した。未完了形は祭儀上の指示として訳した。
- source_word: אֹתוֹ
  choice: それを
  rationale: 直前の節で取り分けられた会食のいけにえの部分を指す男性単数の目的語代名詞を、そのまま自然に受けた。
- source_word: בְנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: 構成形を簡潔に訳し、家系上の関係と祭司としての呼称を保った。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴うが、ここでは祭壇を行為の到達点・場所として自然に表した。
- source_word: עַל הָעֹלָה
  choice: 全焼のささげ物の上に
  rationale: עַלの基本的な空間関係を「上に」とし、עֹלָהはレビ記で一貫して識別しやすい「全焼のささげ物」とした。
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: 火の上の薪に載せた
  rationale: 原文の重なる位置関係、すなわち火、その上の薪、その上の全焼のささげ物を、日本語として理解できる順序で示した。עֵצִיםは具体化しすぎず「薪」とした。
- source_word: אִשֵּׁה
  choice: 火によるささげ物
  rationale: 火を用いて献げる祭儀上の専門語として、語形と文脈に近い訳を採った。「食物のささげ物」という理解もあり得るため脚注に残した。
- source_word: רֵיחַ נִיחֹחַ
  choice: 喜ばしい香り
  rationale: 神に受け入れられるささげ物を表す定型句として、感情を鎮めるとの解釈に限定せず、自然で品位ある日本語にした。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לの方向・献呈の関係を「への」で表し、神名יהוהは固有名として「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある四文字神名を称号に置き換えず、契約の神の固有名として一般的な学術的再建音に基づき表記した。
- issue: 祭儀用語 אִשֵּׁה の意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 語源と祭儀的用法には議論があり、本文では火によって献げるものという直接的な理解を採用した。一方、神に供される祭壇の食物という祭儀的機能を前面に出す理解も排除せず、脚注に示した。
- issue: רֵיחַ נִיחֹחַ の神学的含意
  choice: 喜ばしい香り
  alternative: なだめの香り
  rationale: ささげ物が神に受け入れられ、喜ばれることを示す定型表現として訳し、神が文字どおり香りを必要とする、または香りによって感情を鎮められるとの限定的理解を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀文としての厳粛さを保った。原文の位置関係は日本語で把握しやすい語順に整えつつ、火・薪・全焼のささげ物という積み重なりを保持した。「焼き、煙にする」によって動作の具体性と祭儀的含意を両立させた。
