    rationale: אֲשֶׁר עַל הָעֵצִיםは全焼のささげ物の所在を述べる関係節であり、誰かがそれを薪に載せたという動作は表さない。また、וְהִקְטִירוּは祭壇上で焼いて煙としてささげる行為であって、「置く」と「焼く」という二つの明示的動作ではない。
