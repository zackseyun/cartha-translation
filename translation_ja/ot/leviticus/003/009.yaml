id: LEV.3.9
reference: Leviticus 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: ja
  text: 彼は、交わりのいけにえ[a]から、火によるささげ物をヤハウェに献げる。その内訳は、その脂肪、すなわち丸ごとの脂尾[b]を背骨の近く[c]で取り除いたもの、内臓を覆う脂肪、および内臓の上にあるすべての脂肪である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」または「幸いのいけにえ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 脂尾とは、脂肪を蓄えた羊の太い尾のこと。ここでは、その尾全体をささげる。
    reason: cultural_note
  - marker: c
    text: 「背骨の向かいで」または「脊柱の付け根で」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִיםには平和、無事、交わりという意味領域がある。この祭儀では献げる者も食事にあずかるため、「交わりのいけにえ」は現代日本語で祭儀的性格を伝えやすい。ただし語義を一つに限定しないよう別訳を脚注に示した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭壇の火で献げる物を指す祭儀用語であり、通常の食物との誤解を避けつつ、火との関係を明示した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に記された神の固有名יהוהを音写し、一般名詞の「主」に置き換えなかった。
- source_word: חֶלְבּוֹ
  choice: その脂肪
  rationale: 犠牲動物のうち祭壇に献げる脂肪部分を指す。ヘブライ語の所有接尾辞も明示した。
- source_word: הָאַלְיָה תְמִימָה
  choice: 脂尾を丸ごと
  rationale: אַלְיָהは脂肪を蓄えた羊の太い尾を指し、תְמִימָהはそれを欠けのない全体として取り除くことを表す。
- source_word: לְעֻמַּת הֶעָצֶה
  choice: 背骨の近くで
  rationale: 切り取る位置を脊柱との関係で示す表現。「背骨の向かいで」「脊柱の付け根で」とも解し得るため、脚注で曖昧さを保持した。
- source_word: יְסִירֶנָּה
  choice: 切り取る
  rationale: 語義の中心は「取り除く」だが、ここでは動物の尾を所定の位置から取り外す具体的動作なので、自然な日本語として「切り取る」とした。
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 内臓を覆う脂肪
  rationale: 祭儀解剖上のקֶרֶבを「内臓」とし、覆っている脂肪を簡潔に表した。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内臓についているすべての脂肪
  rationale: 直前の「内臓を覆う脂肪」との並行と微妙な区別を保ち、同じקֶרֶבを一貫して「内臓」と訳した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の契約名を明記しているため、現代日本語で一般的な学術的音写「ヤハウェ」を用いた。
- issue: זֶבַח הַשְּׁלָמִיםの祭儀的意味
  choice: 交わりのいけにえ
  alternative: 平和のいけにえ、幸いのいけにえ
  rationale: 語が含み得る平和・無事・共同の食事という含意のうち、祭儀の性格が読者に伝わる表現を本文に採用し、他の可能性を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀本文にふさわしい簡潔で端正な調子を保った。「献げる」「ささげ物」「いけにえ」は一般読者にも理解できる宗教語として使い分けた。原文は次節へ続く列挙だが、日本語では本節内の構造が分かるよう「すなわち」と「である」を補った。
