  terminology: 「交わりのいけにえ」「火によるささげ物」「ヤハウェ」「内臓」は適切である。「脂尾」は脚注によって具体的意味が補われている。「内臓についている」は原文の「内臓の上にある」よりやや広いため、本文では後者に改める。
