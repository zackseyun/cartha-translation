  naturalness: 全体として明瞭な現代標準日本語であり、祭儀規定にふさわしい簡潔な文体です。「会見の幕屋」「祭司であるアロンの子ら」も自然です。本文の血の動作を「投げかける」とすれば、簡潔さを保ったまま原文にいっそう近づきます。
  terminology: 「ささげ物」「会見の幕屋」「祭壇」「祭司」は一貫しており適切です。「屠る」は祭儀的文脈に適合します。זרק の訳語は本文を「投げかける」とし、「振りかける」を語彙的な別訳として脚注に置くのが適切です。
