  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: ja
  text: その人は、自分のささげ物の頭に手を置き、会見の幕屋の入り口でそれを屠る。祭司であるアロンの子らは、その血を祭壇の周囲に投げかける[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その血を祭壇の周囲に振りかける」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: 手を置き
  rationale: סמך は犠牲奉献の文脈で、動物の上に手を置く、または押し当てる行為を表す。「手を置く」は自然であり、原文が圧力の程度を明示しないことも保つ。יָדוֹ は単数なので「手」とした。
- source_word: עַל רֹאשׁ קָרְבָּנוֹ
  choice: 自分のささげ物の頭に
  rationale: רֹאשׁ は具体的な「頭」。קָרְבָּן は神に近づけてささげる物を広く指すため、特定の供犠類型に狭めず「ささげ物」とした。
- source_word: וּשְׁחָטוֹ
  choice: それを屠る
  rationale: שׁחט は供犠動物を屠殺する標準的な動詞。「殺す」より儀礼的文脈を正確に伝える「屠る」を採用した。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の幕屋の入り口で
  rationale: פֶּתַח は開口部・入り口を指す。אֹהֶל מוֹעֵד は聖所となる幕屋の定型名称であり、自然で定着した「会見の幕屋」とした。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 祭司であるアロンの子ら
  rationale: הַכֹּהֲנִים は「アロンの子ら」を同格的に特定する。「祭司である」として両者の関係を明瞭に保った。
- source_word: וְזָרְקוּ ... אֶת הַדָּם
  choice: その血を……振りかける
  rationale: זרק は血を投げかける、振りかける動作を表し、細かな霧状の散布を意味する語に限定されない。日本語の祭儀文脈で自然な「振りかける」を用い、別訳を脚注に示した。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の周囲に
  rationale: עַל はここでは血を祭壇へ向けて付着させる関係を示し、סָבִיב は周囲一帯を表す。「祭壇の周囲に」で簡潔かつ自然に表現した。
theological_decisions:
- issue: 祭壇への血の適用方法
  choice: その血を祭壇の周囲に振りかける
  alternative: その血を祭壇の周囲に投げかける
  rationale: זרק は単なる「注ぐ」や、別の儀礼動作を想起させやすい限定的な「散らす」ではなく、血を祭壇に向けて投げかける行為を表す。「振りかける」は自然な日本語として儀礼行為を伝え、より直訳的な可能性を脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、レビ記の祭儀規定にふさわしい簡潔で品位ある文体とした。主語の混同を避けるため冒頭を「その人は」とし、後半では祭司を明示した。
