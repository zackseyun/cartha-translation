id: LEV.3.12
reference: Leviticus 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: ja
  text: もしその人のささげ物がやぎなら、それをヤハウェ[a]の前に差し出さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（神名）。伝統的には「主」と訳される。発音は確定していないが、ここでは「ヤハウェ」と表記した。
    reason: 神名の原語表記、伝統的訳語、および音写上の不確実性を示すため。
lexical_decisions:
- source_word: וְאִם
  choice: もし〜なら
  rationale: 接続詞を伴う条件表現で、いけにえに関する規定の次の事例を導入する。日本語では文脈上、接続語を明示しなくても自然に連続性が伝わる。
- source_word: עֵז
  choice: やぎ
  rationale: 単数の山羊を指す。現代日本語で明瞭な「やぎ」とした。
- source_word: קָרְבָּנוֹ
  choice: その人のささげ物
  rationale: קָרְבָּןは神の前に携えて来る供え物を広く指すため、「いけにえ」より範囲の広い「ささげ物」とした。三人称接尾辞は、自然で明確な「その人の」で表した。
- source_word: וְהִקְרִיבוֹ
  choice: それを…差し出さなければならない
  rationale: קרבのヒフィル形は、近くに持って来て奉呈することを表す。ここでは後続節で具体的な奉献手順が述べられるため、「献げる」と重ねず、主の前への提示を表す「差し出す」とした。規定文としての効力は「なければならない」で示した。
- source_word: לִפְנֵי
  choice: 〜の前に
  rationale: 空間的かつ祭儀的に御前へ提示することを表す、簡潔で自然な訳語。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: ヘブライ語本文の神名四文字יהוהを称号に置き換えず、一般的な推定発音に基づいて音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文は称号ではなく固有の神名を用いているため、その区別を保つ。「ヤハウェ」は推定発音であることを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語による簡潔な規定文とした。「ささげ物」「差し出す」を用いて、同語根を機械的に重ねることを避けつつ、祭儀的な提示の意味を保った。
