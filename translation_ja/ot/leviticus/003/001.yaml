revisions:
- from: もし、その人の供え物が和解のいけにえ[a]であり、牛の群れからささげるのであれば、雄でも雌でも、傷のないものをヤハウェの前にささげなければならない。
  to: その人の供え物が平和のいけにえ[a]であり、それを牛の群れから供える場合には、雄でも雌でも、傷のないものをヤハウェの前に供えなければならない。
  rationale: 本文の祭儀名称を「平和のいけにえ」として、原語שְׁלָמִיםおよび英語POBの「peace offerings」に対応させた。「和解」は有力な日本語聖書の伝統訳として脚注に保持するが、原文が直接述べない神学的含意を本文に固定しない。あわせて、「それを」を補って条件節を明瞭にした。
