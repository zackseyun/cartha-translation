id: LEV.3.1
reference: Leviticus 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: ja
  text: その人の供え物が平和のいけにえ[a]であり、それを牛の群れから供える場合には、雄でも雌でも、傷のないものをヤハウェの前に供えなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「和解のいけにえ」「交わりのいけにえ」。ヘブライ語は「平和、無事、健やかさ・繁栄」に関わる供え物を指す。
    reason: שְׁלָמִיםの訳語には伝統と幅があり、本文の「平和のいけにえ」がその意味を尽くすものではないことを示すため。
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: 和解のいけにえ
  rationale: זֶבַחの「いけにえ」と、שְׁלָמִיםが表す祭儀上の種類を簡潔に示す。שְׁלָמִיםには平和、健全、繁栄、交わりに関わる含みがあり、「和解」だけに限定されないため、別訳を脚注に残す。
- source_word: קָרְבָּנוֹ
  choice: その人の供え物
  rationale: קָרְבָּןは神の前に携えて来る供え物を指す一般語。「その人」として、ヘブライ語の三人称男性単数を現代日本語で自然に表した。
- source_word: מִן הַבָּקָר
  choice: 牛の群れから
  rationale: בָּקָרは牛類の家畜を指す集合的表現であり、「牛の群れから」は原文の前置詞と集合性を保つ。
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: ささげる／ささげなければならない
  rationale: קרבのヒフィル形は祭儀の文脈で「近づける、差し出す」、すなわち「ささげる」の意。後半の未完了形は律法上の指示として表した。
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: 雄でも雌でも
  rationale: 対応するאִם…אִםを、どちらも許容されることが明瞭な自然な日本語にした。
- source_word: תָּמִים
  choice: 傷のないもの
  rationale: 祭儀上、身体的な欠陥のない動物を表すため、「完全な」より具体的で分かりやすい。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵיを「前に」とし、固有の神名יהוהを「ヤハウェ」と音写して明示した。
theological_decisions:
- issue: שְׁלָמִיםで呼ばれる供え物の名称
  choice: 和解のいけにえ
  alternative: 平和のいけにえ／交わりのいけにえ
  rationale: 伝統的で理解しやすい名称を本文に置きつつ、語の意味領域を和解だけに固定しないよう脚注で別訳を示した。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の契約名を明記しているため、称号の「主」に置き換えず音写した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある律法文の調子とした。「雄でも雌でも」で許容範囲を簡潔に示し、命令は「ささげなければならない」として規定の性格を表した。脚注記号[a]は該当語の直後に置いた。
