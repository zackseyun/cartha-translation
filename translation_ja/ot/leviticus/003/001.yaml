  source_fidelity: 主な問題は、זֶבַח שְׁלָמִיםを「和解のいけにえ」とした点です。これは日本語聖書で用例のある祭儀用語ですが、שְׁלָמִיםの基本的な「平和・無事・健やかさ（well-being）」の含みを「和解」に狭め、贖罪・罪の処理を連想させ得ます。「平和のいけにえ」を本文とし、代替訳を脚注に残すほうが原語の意味領域と英語POBの方針により忠実です。雄・雌のいずれも可であること、無傷の動物をヤハウェの前に供えることは正しく反映されています。
  naturalness: 原案は全体として明瞭ですが、「牛の群れからささげるのであれば」は何を供えるかがやや省略され、条件節のつながりも少し硬くなっています。「それを牛の群れから供える場合には」とすると、原文の代名詞目的語を自然に明示できます。
  terminology: יַהוֶהを「ヤハウェ」とするのは適切です。「いけにえ」「供え物」「傷のないもの」も祭儀文脈にふさわしく、現代標準日本語として理解可能です。脚注は「和解」を主訳のように扱わず、語義の広がりを示す形に改めます。
