  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: ja
  text: また、二つの腎臓と、その上にあって腰のあたりにある脂肪と、肝臓の上の付属部[a]を、腎臓と一緒に取り除く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「付属部」に当たるヘブライ語が指す解剖学的部位は確定していない。「肝臓の葉」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 犠牲動物の解剖学的器官として、複数形と数詞を明確に反映した。
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: その上にある脂肪
  rationale: 祭儀で取り分ける脂肪を指し、腎臓との位置関係も自然な日本語で保持した。
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: すなわち腰のあたりの脂肪
  rationale: כְּסָלִים は腰・脇腹の領域を指す。先行する脂肪の位置を詳しく示す同格的説明として訳した。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝臓の上の付属部
  rationale: יֹתֶרֶת が示す厳密な解剖学的部位は不確かであるため、「葉」などに特定せず、位置を表す עַל も保持した。
- source_word: עַל הַכְּלָיוֹת
  choice: 腎臓と一緒に
  rationale: この祭儀定型句では、肝臓の付属部を腎臓とともに除く手順を示すと理解できる。直訳的な「腎臓の上で」は解剖学的関係を過度に断定しかねない。
- source_word: יְסִירֶנָּה
  choice: 取り除く
  rationale: ヒフィル形の除去するという意味を簡潔に表した。日本語では前後の律法命令の文脈により、終止形でも規定として自然に読める。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある祭儀規定の文体とした。原文の反復を保ちつつ、「すなわち」を補って脂肪の位置説明を明瞭にした。主語は前後の文脈に委ね、原文同様、この節では明示していない。
