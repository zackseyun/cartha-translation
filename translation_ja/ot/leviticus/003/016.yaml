  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: ja
  text: 祭司は、心地よい香り[b]を立てるため、食物としての火によるささげ物を祭壇の上で焼いて煙にする。脂肪はすべてヤハウェのためのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「芳しい香り」または「なだめの香り」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: それらを……焼いて煙にし
  rationale: 祭儀の文脈におけるקטרのヒフィル形は、供物を祭壇で焼き、煙として立ち上らせることを表す。「焼く」だけでなく「煙にする」を添え、語の祭儀的な含意を明確にした。三人称男性複数接尾辞は、文脈上先に挙げられた供物の部分を指すため「それら」とした。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向・場所を示す語尾は、この文脈では焼く場所が祭壇であることを表す。自然な日本語として「祭壇の上で」とした。
- source_word: לֶחֶם אִשֶּׁה
  choice: 食物、すなわち火によるささげ物
  rationale: לֶחֶםは字義的には「パン」だが、ここでは神に供される「食物」の意味。אִשֶּׁהは火を用いる祭儀的なささげ物を指すため、「火によるささげ物」とした。両語の関係は同格的に読めるため「すなわち」でつないだが、字義的な構造は脚注に示した。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 心地よい香りとする
  rationale: 定型的な祭儀表現で、受け入れられる供物の香りを比喩的に描く。「心地よい」はנִיחֹחַの鎮める・喜ばせるという含みを過度に説明せず、現代日本語で自然に伝える。
- source_word: כָּל חֵלֶב
  choice: 脂肪はすべて
  rationale: כָּלの包括的・強調的な力を保ち、祭儀で取り分けられる脂肪部分のすべてを指す表現とした。
- source_word: לַיהוָה
  choice: ヤハウェのためのものである
  rationale: 前置詞לְが示す献呈・帰属の幅を保つため、単純な所有に限定する「ヤハウェのもの」よりも「ヤハウェのためのもの」とした。神名יהוהは「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名יהוהが明記されているため、称号に置き換えず「ヤハウェ」と音写し、契約の神名を本文に保持した。
- issue: לְרֵיחַ נִיחֹחַという祭儀定型句
  choice: 心地よい香り
  alternative: なだめの香り／芳しい香り
  rationale: 神への受容性を示す祭儀的比喩を保持しつつ、それを教理的説明へ展開しない。「なだめ」は神学的意味を限定しかねず、「芳しい」はやや文語的であるため、明快な現代語の「心地よい」とした。
- issue: כָּל חֵלֶב לַיהוָהにおけるלְの意味
  choice: 脂肪はすべてヤハウェのためのものである
  alternative: 脂肪はすべてヤハウェのものである
  rationale: לְには献呈と帰属の双方の含みがあり得る。「ためのもの」は、脂肪がヤハウェに取り分けられていることを示しつつ、単純な法的所有へ狭めることを避ける。
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭儀本文にふさわしい端正さを保った。「焼いて煙にし」で原語の祭儀的動作を具体的に表し、「ヤハウェのためのものである」で献呈と帰属の両義性を残した。脚注記号[a][b]はすべて本文中に配置した。
