source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: ja
  text: 彼は自分のささげ物の頭に手を置き、会見の天幕の前でそれを屠る。アロンの子らは、その血を祭壇の周囲に投げかける[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「振りかける」「浴びせる」とも訳せる。ヘブライ語の動詞は、血を力を込めて祭壇に投じる儀礼行為を表し、軽く穏やかに散らすことではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 手を置き
  rationale: 犠牲の動物の頭に手を当てる儀礼行為を自然な現代日本語で表す。圧力の程度や罪の転嫁など、本文が明示しない意味は加えない。
- source_word: קָרְבָּנוֹ
  choice: 自分のささげ物
  rationale: קָרְבָּןの広い意味を保ち、特定の犠牲概念に狭めない。「供え物」よりも、神にささげる行為とのつながりが明瞭である。
- source_word: וְשָׁחַט
  choice: 屠る
  rationale: 祭儀における動物の処理を示す術語として、「殺す」より正確で、簡潔かつ荘重である。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための天幕という名称の意味を保つ、聖書日本語として定着した明瞭な表現。
- source_word: וְזָרְקוּ
  choice: 振りかける
  rationale: 血を祭壇へ勢いを伴って投じる祭儀行為を表す。日本語の「振りかける」だけでは穏やかな散布とも取れるため、語義上の注意を脚注で示す。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: 原文の男性の親族名称を一般化せず、そのまま保持する。
- source_word: דָּמוֹ
  choice: その血
  rationale: 接尾辞が直前の犠牲動物を指すことを、自然な日本語で表す。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の周囲に
  rationale: 血が祭壇の一か所だけでなく、その周囲に施されることを簡潔に表現する。
theological_decisions:
- issue: 犠牲動物への按手の意味
  choice: 「頭に手を置き」と行為だけを訳す。
  alternative: 罪の転嫁や犠牲との同一化を訳文に明示する。
  rationale: この節は儀礼行為を命じるが、その神学的意味を説明してはいないため、解釈を本文へ持ち込まない。
- issue: בְּנֵי אַהֲרֹןの性別と身分
  choice: 「アロンの子ら」と訳す。
  alternative: 「アロンの子孫」または「祭司たち」と一般化する。
  rationale: 原文が明示する父子関係と男性複数形を保持し、より広い集団へ言い換えない。
- issue: 血を扱う動作の強さ
  choice: 本文では自然な祭儀表現「振りかける」を用い、力を伴う動作であることを脚注で補う。
  alternative: 「投げつける」として動作の強さを本文で前面に出す。
  rationale: זרקの投じる動作を尊重しつつ、「投げつける」が帯びやすい乱暴・敵対的な含意は避ける。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「屠る」「会見の天幕」は祭儀文脈に必要な荘重さと正確さを保つ。命令的な法文の連続性は「置き、…屠る。…振りかける」で自然に表した。脚注記号[a]は該当語の直後に置いた。
