  to: また、その人の献げ物が、ヤハウェへの和解のいけにえとして羊ややぎの群れからのものであるなら、雄でも雌でも、傷のないものを献げなければならない。
  rationale: 原文の「その人の献げ物が、…群れからのものであるなら」という関係を日本語で明確にした。羊とやぎは集合名詞צֹאןの代表的な構成動物として示し、性別と無傷という資格条件、および規定としての義務表現を保持した。
