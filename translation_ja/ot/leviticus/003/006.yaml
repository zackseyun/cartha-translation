id: LEV.3.6
reference: Leviticus 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: ja
  text: また、その人の献げ物が、ヤハウェへの和解のいけにえとして羊ややぎの群れからのものであるなら、雄でも雌でも、傷のないものを献げなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: また、…であるなら
  rationale: 接続詞と条件をともに表し、前節までの規定に続く別の場合であることを自然な日本語で示す。
- source_word: מִן הַצֹּאן
  choice: 羊またはやぎの群れから取った
  rationale: צֹאןは羊とやぎを中心とする小型家畜の群れを集合的に指す。日本語では構成動物を明示することで意味を正確かつ分かりやすくした。
- source_word: קָרְבָּנוֹ
  choice: その人の献げ物
  rationale: 祭儀のために神の前へ携えて来る物を表す標準的な語として「献げ物」を用い、所有接尾辞は自然な日本語の「その人の」で表した。
- source_word: לְזֶבַח שְׁלָמִים
  choice: 和解のいけにえ
  rationale: זֶבַחの祭儀的意味を「いけにえ」で表し、שְׁלָמִיםには伝統的な訳語「和解」を採用した。ただし、語が含み得る平安、健全、共同の会食や交わりという側面は脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לְによる奉献の向きを「への」で示し、固有の神名יהוהは「ヤハウェ」と音写した。
- source_word: זָכָר אוֹ נְקֵבָה
  choice: 雄でも雌でも
  rationale: いけにえとなる動物の性別について、どちらも認められることを自然な日本語で明示する。
- source_word: תָּמִים
  choice: 傷のないもの
  rationale: 祭儀文脈では身体的欠陥のない動物を指すため、「完全な」ではなく具体的で定着した表現を用いた。
- source_word: יַקְרִיבֶנּוּ
  choice: 献げなければならない
  rationale: קרבのヒフィル形が表す祭儀的な提示・奉献を「献げる」で表し、規定文としての未完了形の義務的ニュアンスを「なければならない」で示した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された契約の固有名を普通名詞的な称号へ置き換えず、音写によって示した。
- issue: שְׁלָמִיםの祭儀用語
  choice: 和解のいけにえ
  alternative: 交わりのいけにえ
  rationale: 伝統的な訳語を本文に置きつつ、この語が単に敵対関係の解消だけでなく、平安、健全、神の前での共同の食事や交わりを含み得るという意味の幅を脚注で保持した。
translation_notes:
  register: 現代の一般読者に理解しやすい、明瞭で格調を保った規定文とした。「雄でも雌でも」を原文の語順に近い位置に置き、「傷のないもの」が献げる動物を修飾することを明確にした。
