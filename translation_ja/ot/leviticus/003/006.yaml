  naturalness: 「羊またはやぎの群れから取った、ヤハウェへの和解のいけにえ」という連続修飾は不自然で、何が「群れから取った」のかが曖昧になりうる。語順を整えることで、明瞭な現代標準日本語の規定文となる。
  terminology: 「ヤハウェ」「献げ物」「和解のいけにえ」「傷のないもの」は、祭儀文脈で一貫して用いうる。「和解のいけにえ」は定着した訳語として本文に維持し、その語義の幅は脚注で示す。脚注は「平安・健全」を含むことをより直接に記し、単なる敵対関係の解消に限定しない。
