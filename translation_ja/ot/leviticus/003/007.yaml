id: LEV.3.7
reference: Leviticus 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: ja
  text: 羊[a]を自分のささげ物としてささげる場合は、それをヤハウェの前にささげなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子羊」とも訳せる。
    reason: כֶּשֶׂבは羊一般を指し得る一方、文脈や用法によっては若い羊、すなわち子羊を指す可能性があるため。
lexical_decisions:
- source_word: אִם
  choice: もし～なら
  rationale: 犠牲に関する規定の中で一つの条件的な場合を導入しているため、現代日本語で明確な条件表現とした。
- source_word: כֶּשֶׂב
  choice: 羊
  rationale: 羊を指す語であり、文脈上は若い羊も含み得るが、年齢を限定しない「羊」が最も広く原語に対応する。「子羊」の可能性は脚注に残した。
- source_word: הוּא
  choice: その人が
  rationale: ヘブライ語の明示的な代名詞を反映しつつ、日本語で指示対象が明確になる自然な表現とした。
- source_word: מַקְרִיב
  choice: 差し出す
  rationale: קרבのヒフィル分詞は、供え物を神のもとへ近づけて提示することを表す。「差し出す」は祭儀的な提示を平明に伝える。
- source_word: קָרְבָּנוֹ
  choice: 自分のささげ物
  rationale: קָרְבָּןは神に近づけてささげる供え物の一般的名称である。「いけにえ」より範囲を狭めない「ささげ物」とした。接尾辞の三人称単数を「自分の」で表した。
- source_word: וְהִקְרִיב
  choice: 差し出さなければならない
  rationale: この法規的文脈における動作の順序と義務を、現代日本語の規定文として明確に表した。また、前半と同じ語根קרבの反復を「差し出す」で保った。
- source_word: אֹתוֹ
  choice: それを
  rationale: 直前の羊を受ける目的語代名詞として自然に訳した。
- source_word: לִפְנֵי
  choice: ～の前に
  rationale: 空間的かつ祭儀的に、神の御前へ動物を提示することを表す標準的な訳語である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文にある神の固有名を音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有名である四文字神名を用いているため、その区別を保って「ヤハウェ」とした。
- issue: 法規表現の強さ
  choice: 差し出さなければならない
  alternative: 差し出すものとする
  rationale: 祭儀上の指示・義務を明確にしながら、現代の一般読者に理解しやすい表現を選んだ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀規定にふさわしい簡潔で格調ある文体とした。原文におけるקרבの反復は「差し出す」の反復で保持した。
