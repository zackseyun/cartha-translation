source:
  edition: WLC
  text: וְ/הִקְטִיר֥/וֹ הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֥חֶם אִשֶּׁ֖ה לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: ja
  text: 祭司はそれを、ヤハウェへの火によるささげ物の食物[a]として、祭壇の上で焼いて煙にする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「ヤハウェへの火によるささげ物のパン」。ここで「パン」は、祭壇で焼いて献げられる食物を表す祭儀的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: それを祭壇の上で焼いて煙にし
  rationale: ヒフィル形のקטרは祭儀の文脈で、祭壇上で焼いて煙を立ち上らせることを表す。「焼いて煙にし」は、行為と煙の含意を自然な現代日本語で伝える。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀を執行するכֹּהֵןの標準的な訳語。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴う形であり、供物を焼く場所として自然に「祭壇の上で」とした。
- source_word: לֶחֶם
  choice: 食物
  rationale: 通常は「パン」だが、ここでは神に物理的な食事が必要だという意味ではなく、祭壇に供される分を指す祭儀的な比喩表現であるため、「食物」とした。字義は脚注に示す。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 火を介して献げられる供物を指す祭儀上の専門語として、明瞭で過度に解釈的でない表現を選んだ。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名יהוהを固有名「ヤハウェ」として示し、前置詞לの献呈先を「に」で表した。
theological_decisions:
- issue: 祭儀的表現 לֶחֶם אִשֶּׁה の解釈
  choice: 食物として、火によるささげ物
  alternative: 火によるささげ物の食物／パン、すなわち火によるささげ物
  rationale: 二つの祭儀語の並置を保ちつつ、「食物」が神の物理的 nourishment を意味するとの誤解を避ける。原文の統語関係には「火によるささげ物の食物」と取る余地もあるため、その緊張を句読法だけで断定的に解消しない訳とした。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の神名を明示し、提示された方針に従った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀本文にふさわしい簡潔で品位ある文体とした。「焼いて煙にし」によって原語の煙の含意を保ち、「ささげ物」はひらがなを交えて一般読者にも読みやすくした。
