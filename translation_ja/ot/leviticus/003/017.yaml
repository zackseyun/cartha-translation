source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: ja
  text: これは、代々にわたり、あなたがたの住むすべての所で有効な永続する定めである[a]。脂肪も血も、決して食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「とこしえの定め」「永久の定め」。ヘブライ語の「オーラム」は、法的な文脈では、長く継続して効力を持つことを表すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: חֻקָּהの法的・契約的な規定という意味を「定め」で表し、עוֹלָםはこの法的定型句における継続的な効力を「永続する」で示した。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたり
  rationale: 後に続く各世代を通じて効力が続くことを、自然な現代日本語で表した。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: あなたがたの住むすべての所で
  rationale: מוֹשָׁבの居住地・住む場所という意味と、כֹלの包括的な範囲を明確に表した。
- source_word: כָּל חֵלֶב וְכָל דָּם
  choice: 脂肪も血も
  rationale: כָּלは否定文の中で全面的禁止を表す。日本語では「も……も」と強い禁止表現を組み合わせることで、脂肪と血のいずれも対象であることを自然に示せる。
- source_word: לֹא תֹאכֵלוּ
  choice: 決して食べてはならない
  rationale: 律法文中のלֹא＋未完了形が表す禁止を、明瞭で格調を保った現代日本語にした。
theological_decisions:
- issue: עוֹלָםが示す定めの存続期間
  choice: 永続する定め
  alternative: とこしえの定め／永久の定め
  rationale: 法的定型句として、世代を越えて継続する効力を表しつつ、哲学的な意味で絶対に終わりがないとの解釈を訳文だけで確定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法としての荘重さを保った。「守るべき」は日本語として文を整えるための補足であり、定めの規範的性格を明示する。
