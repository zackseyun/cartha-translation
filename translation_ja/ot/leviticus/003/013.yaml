  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹאשׁ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: ja
  text: その人は、いけにえの頭に手を置き、会見の天幕の前でそれを屠る。アロンの子らは、その血を祭壇の周囲に振りかける。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その血を祭壇の周囲に投げかける」。ヘブライ語の動詞は、祭儀において血を祭壇に向けて投じる動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ עַל־רֹאשׁוֹ
  choice: いけにえの頭に手を置き
  rationale: 「手」は原文どおり単数を保った。目的語の接尾辞は供え物の動物を指すため、日本語では指示対象を明確にして「いけにえ」とした。סמך יד על は祭儀文脈で手を当てる行為を表し、現代日本語として自然な「手を置く」と訳した。
- source_word: וְשָׁחַט אֹתוֹ
  choice: それを屠る
  rationale: שׁחט は祭儀的な屠殺を表す標準語であり、単なる「殺す」より文脈に即した「屠る」を用いた。
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: 会見の天幕の前で
  rationale: אֹהֶל מוֹעֵד は祭儀施設の名称として「会見の天幕」とし、לִפְנֵי の空間的意味を「前で」で明示した。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: ヘブライ語の構造と祭司集団としての正式な呼称を保った。
- source_word: וְזָרְקוּ אֶת־דָּמוֹ עַל־הַמִּזְבֵּחַ סָבִיב
  choice: その血を祭壇の周囲に振りかける
  rationale: זרק は血を祭壇に向けて投じて付着させる祭儀動作を表す。「振りかける」は自然な日本語だが軽い散布とも受け取れるため、より直接的な別訳を脚注に示した。סָבִיב は祭壇の周りへの適用を表すため「周囲に」とした。
theological_decisions: []
