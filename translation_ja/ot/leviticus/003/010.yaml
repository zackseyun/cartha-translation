source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ja
  text: また、二つの腎臓と、その上にある脂肪、すなわち腰のあたりにある脂肪、そして肝臓の上の付属部分[a]を、腎臓と一緒に取り除く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。この解剖部位を指すヘブライ語（יֹתֶרֶת）の正確な意味は確定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 犠牲動物の解剖部位として明確に腎臓を指すため、具体的な名称をそのまま用いた。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: レビ記の供犠規定では、ささげるために取り分ける内臓周辺の脂肪を指す。現代日本語で明瞭な「脂肪」とした。
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: その上にある
  rationale: 脂肪が二つの腎臓の上にあるという位置関係を自然に表した。
- source_word: הַכְּסָלִים
  choice: 腰のあたり
  rationale: 腰部ないし脇腹の領域を表す語であり、過度に解剖学的な限定をせず位置を明瞭にした。
- source_word: הַיֹּתֶרֶת
  choice: 付属部分
  rationale: 肝臓に関連する部位だが正確な解剖学的同定には不確かさがあるため、「葉」などに限定せず「付属部分」とした。
- source_word: עַל הַכָּבֵד
  choice: 肝臓の上の
  rationale: 前置詞の広い空間的・接続的関係を保ち、「肝臓の上の」と簡潔に訳した。
- source_word: עַל הַכְּלָיֹת
  choice: 腎臓と一緒に
  rationale: この供犠手順では、肝臓の付属部分を腎臓とともに取り除くことを示すと理解し、自然な手順表現にした。
- source_word: יְסִירֶנָּה
  choice: 取り除く
  rationale: ヒフィル形が示す除去の動作を、規定文として簡潔に表した。
theological_decisions: []
