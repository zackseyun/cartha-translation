id: LEV.3.3
reference: Leviticus 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: ja
  text: また、交わりのいけにえの中から、内臓を覆う脂肪と、内臓についているすべての脂肪を、ヤハウェへの火によるささげ物[a]として献げる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「火のささげ物」。あるいは「食物のささげ物」とも訳せる。
    reason: אִשֶּׁהは伝統的に火に関わるささげ物と理解されるが、「食物のささげ物」と理解する見解もあるため。
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 献げる
  rationale: 祭儀の文脈で、神の前に供え物を正式に差し出すことを表す。現代日本語として自然であり、「近づける」という語源的表現より文脈に適する。
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: 交わりのいけにえから
  rationale: זֶבַחは屠って献げる「いけにえ」、שְׁלָמִיםは平安、健全、神との交わりを含む祭儀上の名称である。「交わり」は、この供犠に伴う共同の食事という性格を現代の読者に伝えやすい。
- source_word: אִשֶּׁה
  choice: 火で焼いて献げる物
  rationale: 祭壇の火によって煙にして神に献げる物を指す。火そのものを献げるとの誤解を避けつつ、語の火に関わる側面を明示した。別の理解は脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に明記された契約の神の固有名יהוהを、称号に置き換えず音写した。
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 内臓を覆う脂肪
  rationale: 犠牲動物の内臓を覆う、祭壇に献げる特定の脂肪部分を具体的に表す。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内臓についているすべての脂肪
  rationale: 前句の覆う脂肪に加え、内臓に付着している脂肪全体を指す解剖学的表現として自然に訳した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いていることを明確にし、神名と一般的な称号との区別を保つ。
- issue: אִשֶּׁהの祭儀的意味
  choice: 火で焼いて献げる物
  alternative: 火のささげ物、食物のささげ物
  rationale: 火によって煙にして献げる祭儀上の行為を本文で明瞭にしつつ、「神への食物」という祭司文書の比喩的・祭儀的理解も脚注で示し、語義を一つに断定しすぎない。
- issue: שְׁלָמִיםの供犠名称
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ、平安のいけにえ
  rationale: 語が示し得る平安・健全さと、供犠に伴う神および共同体との交わりを踏まえた。罪の赦しに限定される「和解」という印象を避けるが、意味範囲を単一の教理に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀本文にふさわしい簡潔で格調ある調子を保った。「いけにえ」と「献げる」を使い分け、前者を供犠の種類、後者を祭儀行為として示した。
