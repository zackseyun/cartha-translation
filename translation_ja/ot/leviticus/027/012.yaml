  text: וְ/הֶעֱרִ֤יךְ הַ/כֹּהֵן֙ אֹתָ֔/הּ בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כְּ/עֶרְכְּ/ךָ֥ הַ/כֹּהֵ֖ן כֵּ֥ן יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/012.yaml
  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: ja
  text: 祭司は、その動物が良いか悪いかを評価する。祭司が評価したとおりに、その価額は定まる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を字義どおりに訳すと、「あなたの評価に従って、祭司よ、そのとおりとなる」。文脈上、祭司の評価が正式な価額として確定するという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: 評価する
  rationale: ヒフィル形は、誓願に関わる動物の価額を公的に査定することを表す。「評価する」は現代日本語として明瞭で、祭司が価額を定める行為にも適する。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記の祭儀・法規文脈における כֹּהֵן の標準的で自然な訳語。
- source_word: אֹתָהּ
  choice: その動物
  rationale: 女性単数代名詞は前節の動物を指す。日本語では単なる「それ」より指示対象を明示するほうが明瞭である。
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: 良いか悪いか
  rationale: 字義的には「良いものと悪いものとの間」だが、ここでは動物の品質を判定する範囲を表すため、自然な日本語にした。
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: 祭司が評価したとおりに
  rationale: 本文の二人称単数接尾辞を直訳すると「あなたの評価のとおり、祭司」となるが、「祭司」が同格的にその評価者を示すと理解し、文脈上の意味を自然に表した。形態上の特異さは脚注で保持する。
- source_word: כֵּן יִהְיֶה
  choice: その価額は定まる
  rationale: 祭司の評価が拘束力を持つという法的効力を明瞭に示す。単に「そのようになる」より、この文脈で何が確定するかが分かりやすい。
