  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: ja
  text: ヨベルの年には、その畑は、それを買い受けた元の所有者、すなわち、その土地を保有地として持つ者[a]に戻る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その土地が代々受け継がれる所有地である者」とも訳せる。ヘブライ語の「保有地」は土地の所有・保有を指し、この文脈では元の一族に割り当てられた土地を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: ヨベルの年には
  rationale: בְּ＋「年」は時を示し、הַיּוֹבֵלはレビ記の制度上の「ヨベル」を指す。現代日本語で定着した表現を用いた。
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: その畑は…戻る
  rationale: שָׂדֶהを通常の意味どおり「畑」とし、法規の結果を表す未完了形יָשׁוּבは、硬すぎる「返還されなければならない」ではなく、簡潔な「戻る」で表した。
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: それを買った相手
  rationale: 直訳的には「彼がそれをその人から買った、その人へ」。日本語では「それを買った相手」が購入元の相手を自然に示し、ヘブライ語の不特定の男性主語を不用意に補わない。
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: すなわち、その土地を所有地として持つ者
  rationale: 二つのלַאֲשֶׁר句は同一人物を言い換えていると理解し、「すなわち」で関係を明示した。אֲחֻזָּהの土地保有・所有地という法的意味を保ちつつ、本文では世襲性を明示しすぎない。
theological_decisions:
- issue: ヨベル法におけるאֲחֻזַּת הָאָרֶץの性格
  choice: 本文では「その土地を所有地として持つ者」とした。
  alternative: 「その土地を代々の所有地として持つ者」または「その土地が先祖伝来の所有地である者」
  rationale: 文脈上は氏族に割り当てられた世襲の土地を指すが、אֲחֻזָּה自体の中心義は「所有地、保有地」である。本文では語義を保ち、文脈上の世襲的含意は注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨベル法の法的で厳粛な調子を保った。「相手」は購入元を自然に表し、原文に明示されない主語を補っていない。
