  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: ja
  text: 地の十分の一はすべて、地の作物からのものも木の実からのものも、ヤハウェのものである。それはヤハウェのために聖別されたものである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: 地の十分の一はすべて
  rationale: 単数形を伴う כָל の配分的な意味を「すべて」で表し、מַעְשַׂר は日本語で意味が明瞭な「十分の一」とした。文脈上 הָאָרֶץ は農産物を生じさせる「地」を指す。
- source_word: מִזֶּרַע הָאָרֶץ
  choice: 地の種からのものも
  rationale: 農作物一般を指しうる表現だが、原文の具体的な「種」という比喩を保ち、後続の「木の実」との対句も維持した。
- source_word: מִפְּרִי הָעֵץ
  choice: 木の実からのものも
  rationale: 集合的に用いられた単数形 הָעֵץ を自然な日本語の「木」で表し、מִן の由来・範囲を「からのもの」で明示した。
- source_word: לַיהוָה הוּא
  choice: ヤハウェのものである
  rationale: לְ はここで所有・帰属を示すため、単なる方向を表す「ヤハウェに」ではなく、自然で明確な帰属表現とした。
- source_word: קֹדֶשׁ לַיהוָה
  choice: ヤハウェにとって聖なるものである
  rationale: 十分の一がヤハウェのために取り分けられた聖なるものだという祭儀的意味を保つ。「最も聖なる」は原文にない強意を加えるため避けた。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有の神名を称号に置き換えず、日本語で一般的な学術的音写「ヤハウェ」によって示した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある文体。「十分の一」は専門語「十分の一税」より原語の割合を直接伝える。原文の反復と二つの名詞文を保ちつつ、日本語として明瞭に整えた。
