  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに告げて言われた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では神の名を表す四文字「YHWH」。伝統的には「主」と訳される。
    reason: 本文の「ヤハウェ」が原文の固有の神名 יְהוָה を訳出していること、および伝統的な「主」という置換を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げて言われた
  rationale: דבר のワウ継続形は神の発言を導入する定型句。「告げる」に続く לֵאמֹר を合わせ、日本語として自然な発話導入にした。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名YHWHを指す。日本語聖書で広く定着した「主」を本文に用い、原語について脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: אֶל は発言の向かう相手を示すため、現代日本語では「に」が自然。מֹשֶׁה は慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する発言内容を導く不定詞。日本語では וַיְדַבֵּר と一体の定型表現「告げて言われた」とすることで、その機能を明確に保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注でYHWHを明示）
  alternative: ヤハウェ／ヤーウェ
  rationale: 原文が固有の神名を用いる事実は脚注で保持しつつ、本文では日本語として定着し、朗読にも適した「主」を採用した。発音の復元には不確実性があるため、特定の母音表記を本文で確定しない。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。ヘブライ語の定型的な発話導入を、日本語で不自然な重複にならない範囲で反映した。
