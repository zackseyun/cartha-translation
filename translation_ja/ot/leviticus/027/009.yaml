id: LEV.27.9
reference: Leviticus 27:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: ja
  text: また、人がその中からヤハウェに献げ物を献げる家畜の場合[a]、その家畜からヤハウェに献げるものはすべて聖なるものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェに献げ物として献げることのできる家畜の場合」。ヘブライ語は、その家畜から実際に献げ物を献げることを述べているとも、献げ物に適した種類の家畜を述べているとも理解できる。
    reason: 原文の関係節が持つ、実際の献供を述べる読みと献供適格性を述べる読みの語義上の曖昧さを保持するため。
lexical_decisions:
- source_word: וְאִם
  choice: また、～の場合
  rationale: 律法規定の条件節を導く接続表現。前後とのつながりを保ちつつ、現代日本語として自然にした。
- source_word: בְּהֵמָה
  choice: 家畜
  rationale: 広く動物を指し得る語だが、ここでは祭儀で献げられる動物が文脈上想定されるため、「家畜」が自然で明確。
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: ヤハウェへの献げ物をその中から献げる
  rationale: יַקְרִיבוּの祭儀的な「近づける、献げる」と、מִמֶּנָּהの「その中から」を保持した。実際に献げる家畜か、献げ物にできる種類の家畜かという曖昧さは脚注で示した。
- source_word: קָרְבָּן
  choice: 献げ物
  rationale: 祭儀において神に差し出すものを表す標準的で分かりやすい訳語。
- source_word: לַיהוָה
  choice: ヤハウェに／ヤハウェへの
  rationale: 神名יהוהを称号に置き換えず、固有名「ヤハウェ」として表した。
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: その家畜のうちからヤハウェにささげるものはすべて
  rationale: יִתֵּןの一般的な単数主語を日本語では明示せず、性別を不必要に限定しない形で表現した。מִמֶּנּוּの指示対象も明確にした。
- source_word: יִהְיֶה קֹדֶשׁ
  choice: 聖なるものとなる
  rationale: 祭儀上、神のために取り分けられた状態を示すקֹדֶשׁの神学的含意を保った。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神の固有名を明示し、称号への置換を避けた。
- issue: יִהְיֶה קֹדֶשׁが示す状態
  choice: 聖なるものとなる
  alternative: 聖なるものである／聖別される
  rationale: 原文の存在動詞と名詞קֹדֶשׁに沿い、奉献の結果としてヤハウェに属する聖なる状態になることを、過度に説明せず表した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調ある律法文の文体とした。「献げる」と「ささげる」が近接する箇所では、名詞「献げ物」との視認上の重複を和らげるため後者を平仮名にした。
