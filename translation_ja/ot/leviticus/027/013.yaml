  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: ja
  text: しかし、もし彼がそれを買い戻すなら[a]、あなたの評価額の五分の一を上乗せしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「買い戻すことを彼が買い戻すなら」という形で、不定詞絶対形と定動詞を重ね、買い戻しの行為を強調している。
    reason: 本文では自然な条件文とし、原文の強意構文は脚注で示す。
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前節の規定と対照をなす条件を、現代日本語で自然に示す。
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: その人がそれを買い戻すのであれば
  rationale: גאלを、評価された動物を代価を払って取り戻す法的文脈に即して「買い戻す」とした。女性単数接尾辞は前節の動物を指すため「それ」とした。強意構文については脚注で示す。
- source_word: וְיָסַף
  choice: 加えなければならない
  rationale: この法規定における結果としての義務を、明瞭で自然な現代日本語で表す。
- source_word: חֲמִישִׁתוֹ
  choice: その五分の一
  rationale: 男性単数接尾辞は男性名詞である評価額を受けると理解し、加算額が評価額の五分の一であることを明確にした。
- source_word: עַל עֶרְכֶּךָ
  choice: あなたの評価額に
  rationale: עַלは上乗せを表し、二人称男性単数の接尾辞を保って、評価を行う祭司への直接の指示として訳した。
