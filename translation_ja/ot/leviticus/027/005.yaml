  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: ja
  text: また、五歳から二十歳までであれば、あなたの評価額は、男子には二十シェケル、女子には十シェケルとする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: また、…であれば
  rationale: 接続詞と条件辞を反映し、前節から続く評価規定の一項であることを自然な現代日本語で示す。
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: 五歳から二十歳まで
  rationale: בֶּןを用いた年齢表現と、下限から上限までの範囲を簡潔に表す。境界の厳密な包含関係は原文以上に限定しない。
- source_word: וְהָיָה
  choice: …とする
  rationale: 法規的・規定的な効力を、現代日本語の規定文にふさわしい形で表す。
- source_word: עֶרְכְּךָ
  choice: あなたが定める額
  rationale: 二人称接尾辞を保ちつつ、レビ記27章における誓願に伴う公定の評価額を自然に示す。単なる人物の価値そのものとは読ませない。
- source_word: הַזָּכָר
  choice: 男子
  rationale: 年齢区分に属する男性個人という法的分類を簡潔に表す。
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: 二十シェケル
  rationale: 歴史的な重量・貨幣単位を現代通貨へ換算せず、音写して保持する。
- source_word: וְלַנְּקֵבָה
  choice: 女子には
  rationale: 対応する女性の分類と、לが示す割当てを日本語で明瞭に表す。
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: 十シェケル
  rationale: 数値と歴史的単位をそのまま保持し、男子の評価額との対照を示す。
theological_decisions:
- issue: 祭儀法における性別ごとの評価区分
  choice: 男子には…女子には
  alternative: 男には…女には／男性には…女性には
  rationale: 原文は複数の社会集団一般ではなく、評価表上の単数的な性別区分を示す。「男子」「女子」は五歳から二十歳までという年齢範囲にも自然に対応し、この規定を人間の本質的価値についての一般論へ広げない。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語の法規的文体。「とする」によって規定の力を示しつつ、過度に古風な表現は避けた。本文に脚注は不要と判断した。
