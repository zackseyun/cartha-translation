source:
  edition: WLC
  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: ja
  text: 人のうちから聖絶されたものはすべて、贖い戻すことができない[a][b]。必ず殺されなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人のうちから滅ぼすべきものとして聖絶された者は、だれも贖い戻すことができない。その者は必ず殺されなければならない。」
    reason: alternative_reading
  - marker: b
    text: 「人のうちから」は、ここで聖絶の対象となっているのが人間であることを示す。
    reason: lexical_clarification
lexical_decisions:
- source_word: חֵרֶם
  choice: 聖絶されたもの
  rationale: 神のために取り分けられ、通常の仕方では取り戻せないものを指す祭儀的・法的な専門語として「聖絶」を用いた。「もの」は原語の名詞表現を保ちつつ、続く「人の中から」によって、ここでは人が対象であることを示す。
- source_word: יָחֳרַם
  choice: 聖絶された
  rationale: חֵרֶםとの語根上のつながりを日本語でも「聖絶」によって保った。「滅ぼすべきものとされた」と限定せず、奉献と滅ぼすことが重なる原文の緊張を残した。
- source_word: מִן הָאָדָם
  choice: 人の中から
  rationale: ここでאָדָםは特定の男性ではなく、人類・人間の範疇を表す。「人の中から」は、対象が人間であることを自然な日本語で明示する。
- source_word: יִפָּדֶה
  choice: 贖い戻すことができない
  rationale: פדהの身代金によって取り戻すという法的・祭儀的意味を「贖い戻す」で表した。否定文中の未完了形は許可・可能性を含む規定として訳した。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を「必ず」で示し、受動形の法的な死の宣告を「死刑に処せられなければならない」と訳した。
theological_decisions:
- issue: 人を対象とするחֵרֶםの意味
  choice: 本文では祭儀的・法的な専門語「聖絶」を保ち、後半の死刑宣告によってその重大な帰結を示す。
  alternative: 「人の中から滅ぼすべきものとして聖絶された者」と明示する。
  rationale: 原文はחרםとפדהという祭儀的・法的語彙を死刑定型句と結びつけている。「滅ぼすべき者」とだけ訳すと、奉献・禁制の含意を先に解釈してしまうため、本文では原文の緊張を保持した。
- issue: 「もの」と人間の指示関係
  choice: 原語の包括的な名詞表現に対応して「聖絶されたもの」とし、「人の中から」で人間を指すことを示す。
  alternative: 「聖絶された者」として人間であることを直接明示する。
  rationale: 「者」は文脈上明快だが、חֵרֶםの技術的な名詞性が弱まる。本文は形式を残し、脚注で自然で明示的な読みを提示した。
translation_notes:
  register: 現代の一般読者に理解できる法文調を用いた。「聖絶」と「贖い戻す」はレビ記の祭儀的・法的文脈を保つための聖書語だが、文全体は簡潔で自然な現代標準語とした。
