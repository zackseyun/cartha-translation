  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: ja
  text: しかし、その人があなたの定めた評価額を納められないほど貧しいなら[a]、その人を祭司の前に立たせる。祭司はその人を評価し、誓願を立てた者の資力に応じて[b]、その人の評価額を定める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その人があなたの評価額よりも貧しいなら」。ここでは、その評価額を負担できないほど貧しいという意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「誓願を立てた者の手が届くところに応じて」。支払うことのできる経済的能力を表す慣用句。
    reason: idiom
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: あなたの定めた評価額を納められないほど貧しい
  rationale: מָךְは経済的に困窮している状態を表し、מִןを伴う句は、定められた評価額を負担できないほど貧しいという文脈上の比較を示す。日本語では支払い能力との関係を明確にした。
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: その人を祭司の前に立たせる
  rationale: עמדのヒフィル形「立たせる」と祭司の前に出頭させる法的手続きを保ちつつ、原文で明示されていない使役主体を日本語でも特定しない。
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: 祭司はその人を評価し……その人の評価額を定める
  rationale: ערךは本章で人に対応する金銭的評価額を設定する専門的な語。反復を保ちながら、自然な日本語になるよう二度目を「評価額を定める」とした。
- source_word: עַל פִּי
  choice: に応じて
  rationale: 評価額を決める基準を導く「～に従って、～に応じて」の意味を自然な日本語で表した。
- source_word: אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: 誓願を立てた者の資力に応じて
  rationale: 直訳では「誓願を立てた者の手が届くところに応じて」。これは経済的な能力を表すヘブライ語の慣用句なので、「資力」として明確に伝えた。
- source_word: הַנֹּדֵר
  choice: 誓願を立てた者
  rationale: נדרの分詞で、誓願をする当事者を指す。宗教的・法的文脈を保ちながら現代日本語で理解しやすくした。
theological_decisions:
- issue: 「あなたの評価額」の二人称接尾辞
  choice: あなたの定めた評価額
  alternative: 定められた評価額
  rationale: 原文の二人称単数接尾辞を保持し、直前の規定で告げられた評価額を指すことが分かるよう「定めた」を補った。
- issue: 祭司の前に立たせる主体
  choice: 主語を明示しない
  alternative: 誓願を立てた者がその人を祭司の前に立たせる
  rationale: 原文の動詞は使役形だが、その主体は明示されていない。誓願者だと断定せず、原文の曖昧さを保った。
translation_notes:
  register: 律法規定にふさわしい簡潔で端正な文体としつつ、「資力」「評価額」など現代の読者に明確な法的・経済的語彙を用いた。原文の動詞の反復と、使役主体が明示されない点を保持した。
