  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: ja
  text: また、六十歳以上の場合、男性なら、あなたの評価額は十五シェケル、女性なら十シェケルとする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: 六十歳以上の場合
  rationale: 六十歳を起点としてそれより上の年齢を含むヘブライ語の年齢表現を、明確で自然な現代日本語にした。
- source_word: זָכָר
  choice: 男性
  rationale: この評価規定では社会的身分ではなく性別を示すため、「男」よりも対になる「男性／女性」を用いた。
- source_word: עֶרְכְּךָ
  choice: あなたの評価額
  rationale: 二人称単数接尾辞を保持しつつ、レビ記27章の誓願に関する規定で用いられる金額評価の専門的意味を示した。
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: 十五シェケル
  rationale: 数値と単位を直接訳し、古代の重量・貨幣単位シェケルは音写した。
- source_word: לַנְּקֵבָה
  choice: 女性なら
  rationale: 男性の場合と対応する性別区分として、簡潔で自然な条件表現にした。
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: 十シェケル
  rationale: 数値と単位を直接訳した。
