source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: ja
  text: しかし、その人が女性なら、あなたが定める評価額は三十シェケルとする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 接続詞と条件辞が、前節の男性の場合と対照をなす条件を導入しているため。現代日本語の法的な文脈で自然に対照と条件を示す。
- source_word: נְקֵבָה הִוא
  choice: その人が女性なら
  rationale: נְקֵבָהはここでは人の女性を指す。女性単数代名詞הִואの指示対象を「その人」で明示しつつ、「女性」で性別による区分を自然に表した。
- source_word: וְהָיָה
  choice: …とする
  rationale: 条件節に続く帰結を示す法規的表現として、現代日本語で簡潔かつ自然に表した。
- source_word: עֶרְכְּךָ
  choice: あなたが定める評価額
  rationale: ערךはレビ記27章における誓願に伴う規定上の評価額を指す。二人称単数接尾辞を、曖昧になりやすい「あなたの評価額」ではなく、評価を定める側を示す「あなたが定める」と訳した。
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: 三十シェケル
  rationale: 数値と重量・通貨単位をそのまま保持した。原文に明記されない「銀」は補わなかった。
theological_decisions: []
translation_notes:
  register: 簡潔な法規文の調子を保ちながら、一般の現代日本語読者に理解しやすい表現とした。「女性」は年齢を限定する「女」や成人に限定され得る「女の人」よりも、原語の性別区分を明確に伝える。
