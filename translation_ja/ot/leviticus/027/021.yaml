  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: ja
  text: しかし、その畑は、ヨベルの年に手放されるとき、主のために聖なるものとなり、主にささげ尽くされた畑[a]のようになる。それは祭司の所有地となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「禁令の下に置かれた畑」とも訳せる。ヘブライ語は、主に撤回不能にささげられ、通常の人間の使用から除かれたものを指す。文脈によっては、滅ぼすことを伴う。
    reason: חֵרֶםの語義の幅と、単なる奉納を超える不可逆的な奉献の含意を示すため。
lexical_decisions:
- source_word: וְהָיָה
  choice: しかし、…となる
  rationale: 前節の買い戻しの場合との対照を示しつつ、法規の帰結を自然な日本語で表す。
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: ヨベルの年に手放されるとき
  rationale: 字義は「ヨベルにそれが出るとき」。土地が元の権利関係から離れる法的文脈を明瞭にし、「返還」と訳して祭司への帰属と衝突することを避けた。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 主のために聖なるもの
  rationale: 神に取り分けられた状態を示す定型句。יהוהは日本語聖書で広く通用する「主」とした。
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: 奉納された畑
  rationale: חֵרֶםの中心的な意味である、主に不可逆的にささげられて通常の使用から除かれたものを表す。ここで明記されない「滅ぼす」を本文に加えず、語の強さは注で補う。
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: それは祭司の所有地となる
  rationale: לַכֹּהֵןを帰属、אֲחֻזָּהを土地法上の保有地として訳し、ヨベル時の帰属の結果を自然に表した。
theological_decisions:
- issue: חֵרֶםの訳語
  choice: 奉納された畑
  alternative: 滅ぼすものとしてささげられた畑／禁令の下に置かれた畑
  rationale: この語は主への不可逆的な奉納と通常の人間的使用からの除外を含むが、当該節では破壊そのものを明記しない。本文では過剰に限定せず、法的・聖別的な重みを注で保持した。
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 明瞭で dignified な現代日本語聖書の慣用に従いつつ、固有名であることは訳語選択上認識している。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある法文調。「ヨベル」は制度名として保持し、「所有地」で土地法上の帰属を示した。
