id: LEV.27.18
reference: Leviticus 27:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: ja
  text: しかし、もしその人がヨベルの後に自分の畑を聖別するなら[a]、祭司はヨベルの年までの残りの年数に応じてその人のために金額を算定し[b]、その金額はあなたの評価額から差し引かれる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨベルの年の後に」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「祭司はその人のために代価を査定する」。
    reason: lexical_alternative
  - marker: c
    text: または「あなたの評価額は減額される」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: ヨベルの後に
  rationale: אַחַרは時間的な「後」を表し、הַיֹּבֵלはレビ記のヨベル制度、またはその年を指す。本文では簡潔な「ヨベルの後に」とし、年を明示する訳は脚注に残した。
- source_word: יַקְדִּישׁ
  choice: 聖別する
  rationale: קדשׁのヒフィル形は、畑を聖なるものとして主のために取り分けることを表す。「ささげる」より祭儀的意味を明確に保つ。
- source_word: שָׂדֵהוּ
  choice: 自分の畑
  rationale: 三人称男性単数の所有接尾辞を、その人自身の所有であることが自然に伝わる形で訳した。
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: 祭司は……その人のために金額を算定し
  rationale: חשבはこの法的文脈では計算・算定を意味し、כֶּסֶףは銀そのものより評価に伴う金額を指す。「その人のために」によりלוֹも保持した。
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: 残っている年数に応じて
  rationale: עַל־פִּיの「～に基づいて」と、残存年数に比例して算定する趣旨を自然な日本語で表した。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: ヨベルの年までに
  rationale: 算定の基準となる残存期間の終点がヨベルの年であることを明示した。
- source_word: וְנִגְרַע מֵעֶרְכֶּךָ
  choice: その額をあなたの評価額から差し引く
  rationale: גרעのニファルは減額・控除を表す。日本語では受動形を機械的に再現せず、金銭法規として明瞭な「差し引く」とした。二人称単数接尾辞は「あなたの」で保持した。
theological_decisions:
- issue: מֵעֶרְכֶּךָの二人称単数接尾辞
  choice: あなたの評価額から
  alternative: その評価額から／定められた評価額から
  rationale: ヘブライ語の二人称単数による直接的な法的呼びかけを保持し、前段で規定された評価とのつながりを曖昧にしないため。
- issue: יַקְדִּישׁの祭儀的意味
  choice: 聖別する
  alternative: ささげる／奉献する
  rationale: 財産を聖なるものとして取り分けるというレビ記27章の意味を保ちつつ、特定教派の用語に限定しないため。
- issue: וְנִגְרַעの文法上の受動性と実際の計算関係
  choice: その額をあなたの評価額から差し引く
  alternative: あなたの評価額は減額される
  rationale: 原文の減額という意味を維持しながら、直前に算定された金額と基準評価額との関係が日本語で明確になるようにした。別の統語的表現は脚注に示した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調を保った法規文体。「ヨベル」は制度名として音写し、「聖別」「祭司」「評価額」など文脈上必要な祭儀・法的用語を用いた。文頭のוְאִםは前節との対照を示すため「しかし、もし」とした。
