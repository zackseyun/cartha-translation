id: LEV.27.34
reference: Leviticus 27:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: ja
  text: これらは、シナイ山で、ヤハウェがモーセにイスラエルの子らに命じた戒めである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子らのために」とも訳せる。また、「イスラエル人に」または「イスラエル人のために」と意訳することもできる。
    reason: 前置詞 אֶל は基本的に宛先・方向を示すが、この構文では「…のために」と理解する余地もある。定型句 בְּנֵי יִשְׂרָאֵל の表現上の代案も示すため。
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: これらは……戒めである
  rationale: 結語となる要約形式を保ちつつ、現代日本語として自然な名詞述語文にした。מִצְוָהの法的な命令性は「戒め」で表した。
- source_word: אֲשֶׁר צִוָּה
  choice: 命じた
  rationale: 関係節として訳し、名詞「戒め」と動詞「命じる」の語根上の結びつきも可能な限り保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文にある神の固有名を称号に置き換えず、一般的な日本語音写で示した。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: אֵתは形式上直接目的語を示すが、日本語の「命じる」は命令を受ける相手を「に」で示すのが自然である。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのために
  rationale: אֶלの方向・対象の含みを踏まえ、モーセに与えられた命令がイスラエルの子らに関わることを表した。原語の「子ら」という形も保持したが、「に」も可能なため注記した。
- source_word: בְּהַר סִינָי
  choice: シナイ山で
  rationale: 出来事の場所を示すבְּを、自然な日本語の場所格「で」で表した。「山で」は山上または山の場所でという幅を保つ。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有名を本文どおり固有名として示し、称号への置換を避けた。
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原語の構造を保つ。「子ら」は民族全体を代表する定型表現であり、男性だけに限定する意図までは本文から確定しない。
- issue: אֶל の関係
  choice: イスラエルの子らのために
  alternative: イスラエルの子らに
  rationale: 命令の最終的な対象・関係先を表す読みを採ったが、伝達の方向をより直接に示す「に」も文法上可能なので、曖昧さを脚注に残した。
translation_notes:
  register: レビ記末尾の厳粛な結語にふさわしい簡潔な文語調を保ちながら、「これらは」「命じた」「である」など、現代の読者にも明瞭な標準語を用いた。
