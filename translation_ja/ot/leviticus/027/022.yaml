id: LEV.27.22
reference: Leviticus 27:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: ja
  text: しかし、もし人が、自分の相続地に属さない、買い取った畑[a]をヤハウェに聖別するなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼が取得した畑」。先祖から受け継いだ相続地ではなく、購入によって得た土地を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前の規定を受けつつ、別の条件付き事例へ移る対照と条件の両方を表す。
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: 買い取った畑
  rationale: 購入によって取得した畑を意味する構文を、現代日本語で自然かつ法的区別が明確になるように訳した。
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: 自分の相続地に属さない
  rationale: אֲחֻזָּה が指す世襲の土地保有を「相続地」とし、購入地との対比を明瞭にした。מִן の分離・所属関係は、日本語として自然な「に属さない」で表した。
- source_word: יַקְדִּישׁ
  choice: 聖別する
  rationale: 誓願・祭儀上の目的で主のために聖なるものとして取り分ける行為を表す。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞 ל の方向・帰属を「に」で表し、神名 יהוה は固有名として「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として示し、一般名詞・称号との区別を保つ。
- issue: אֲחֻזָּה の土地制度上の意味
  choice: 相続地
  alternative: 所有地
  rationale: この文脈では、単なる所有物ではなく先祖から受け継ぐ世襲の土地を購入地と対比しているため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。条件文が次節へ続くため、読点で終えた。「買い取った」は「購入した」より一般読者に自然でありながら、相続地との法的な対比を保つ。
