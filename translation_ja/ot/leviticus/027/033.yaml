id: LEV.27.33
reference: Leviticus 27:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: ja
  text: その良し悪しを吟味してはならず[a]、それを別のものと取り替えてもならない。もし実際に取り替えたなら[b]、元のものもその代わりのものも聖なるものとなる。買い戻すことはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「良いものと悪いものとの間を調べる」。十分の一として選ばれる動物を、質によって選り分けることをいう。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では同じ語根を重ね、「もし確かに取り替えるなら」と交換の事実を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר בֵּין טוֹב לָרַע
  choice: その良し悪しを吟味する
  rationale: 動物の質を調べて良いものと悪いものを選り分けるという法的文脈を、自然な現代日本語で表した。単なる観察ではなく、質的な判別を含む。
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: それを別のものと取り替える／実際に取り替える
  rationale: 別の動物を元の動物の代わりにするという、ここでの法的な意味を明確にした。不定詞絶対形と定動詞の重なりによる強調は「実際に」で表した。
- source_word: תְמוּרָתוֹ
  choice: その代わりのもの
  rationale: 元の動物に代えて差し出された動物を指す。専門的すぎない明瞭な表現を採用した。
- source_word: קֹדֶשׁ
  choice: 聖なるもの
  rationale: 神のために取り分けられた祭儀上の地位を保ち、「神聖なもの」よりもレビ記の用語として一貫しやすい表現とした。
- source_word: לֹא יִגָּאֵל
  choice: 買い戻すことはできない
  rationale: 奉献された状態から代価によって取り戻すことを指すため、「贖う」より一般読者に明瞭な祭儀法上の表現を選んだ。
- source_word: הוּא וּתְמוּרָתוֹ
  choice: 元のものもその代わりのものも
  rationale: 二頭とも聖なるものになることを、日本語で誤解なく明示した。
theological_decisions:
- issue: 奉献に関する祭儀法上の語調
  choice: קֹדֶשׁを「聖なるもの」、גאלを「買い戻す」と訳す
  alternative: 「神聖なもの」「贖う」と訳す
  rationale: 神に属するものとしての聖別という含意を保ちつつ、後代の教理的意味を過度に持ち込まず、財産・奉献規定としての買い戻しを明瞭にした。
- issue: 交換後に聖なるものとなる対象
  choice: 元の動物と代わりの動物の双方を明示する
  alternative: ヘブライ語の形を直訳して「それとその代わりのもの」とする
  rationale: ヘブライ語の指示内容を変えず、日本語で双方が対象であることを明確にした。
translation_notes:
  register: 現代の一般読者に理解できる簡潔な法令調とし、「〜てはならない」「聖なるもの」でレビ記にふさわしい品位を保った。末尾はヘブライ語の単数表現を過度に説明せず、文脈上、聖なるものとなった動物を買い戻せないという規定として自然に読める形にした。
