id: LEV.27.28
reference: Leviticus 27:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: ja
  text: ただし、人が自分の所有するもののうちから主のために聖絶したもの[a]はすべて、それが人であれ家畜であれ、また相続地である畑であれ、売ることも買い戻すこともできない。聖絶されたものはすべて、主にとって最も聖なるものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖絶」はヘブライ語ヘーレムに基づく専門用語で、主のために取り返しのつかない仕方で取り分けることをいう。文脈によっては、禁令の下に置いて滅ぼすという意味を伴う。
    reason: חֵרֶםが持つ、不可逆的な奉献と破壊を伴う禁令との意味の幅を示すため。
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 直前までの、買い戻し得る誓願の品についての規定に対し、例外的・制限的な規定へ移ることを明瞭に示す。
- source_word: חֵרֶם / יַחֲרִם
  choice: 聖絶されたもの／聖絶する
  rationale: 主のために取り返しのつかない仕方で取り分けるという専門的意味を保つ。同語には文脈によって滅ぼすべきものとする含意もあるため、脚注でその意味の幅を示した。
- source_word: אִישׁ
  choice: 人
  rationale: 男性単数形による法的な代表表現だが、日本語では「人が」が自然であり、原文の性を不必要に限定せず一般的な効力を表せる。
- source_word: לַיהוָה
  choice: 主のために／主にとって
  rationale: 神名יהוהを日本語聖書で広く認知される「主」とし、前半では奉献の向かう先、後半では聖なる関係を文脈に即して表した。
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: 自分の所有するもののうちから
  rationale: 聖絶の対象がその人に属するものの範囲から取られることを明確にした。
- source_word: מֵאָדָם וּבְהֵמָה
  choice: 人であれ家畜であれ
  rationale: 人と動物という対照的な区分を自然な日本語で保持した。בְּהֵמָהはこの財産法的文脈では「家畜」が適切である。
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: また相続地である畑であれ
  rationale: אֲחֻזָּהがイスラエルで世襲される土地保有を指す法的ニュアンスを「相続地」で表した。
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: 売ることも買い戻すこともできない
  rationale: 禁止を明瞭に示し、גאלはこの章における財産の回復・買い戻しという具体的な法的意味で訳した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同じ語を重ねたヘブライ語の最上級表現を、自然で荘重な現代日本語にした。
theological_decisions:
- issue: חֵרֶםの法的・神学的意味
  choice: 本文では「聖絶されたもの」とし、主のために不可逆的に取り分けられる点を前面に出した。
  alternative: 「滅ぼすべきもの」「禁令の下に置かれたもの」
  rationale: この語群は文脈によって滅亡・破壊を伴うが、本節自体が強調するのは、売却も買い戻しもできず、主にとって最も聖なるものだという不可逆性である。破壊の含意を本文に限定的に持ち込まず、脚注で意味の幅を保持した。
- issue: אִישׁの男性単数による法的表現
  choice: 日本語本文では一般的な主体として「人が」と訳した。
  alternative: 「男が」
  rationale: 原文は男性単数形だが、この規定の主体を表す代表的な法文表現である。日本語の「人」は性別を明示せず、原文の一般的効力を自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔で荘重な調子を保った。「聖絶」は日常語ではないため脚注を付し、「贖う」ではなく財産法上の動作が伝わる「買い戻す」を採用した。
