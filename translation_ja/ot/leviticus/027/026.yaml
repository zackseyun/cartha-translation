id: LEV.27.26
reference: Leviticus 27:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: ja
  text: ただし、家畜のうち、初子としてヤハウェに属するものは、だれもそれを聖別してはならない。牛であれ、羊または山羊であれ[a]、それはヤハウェのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊または山羊」と訳したヘブライ語は、群れに属する小家畜を指し、羊にも山羊にも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 直前までの規定に対する例外・制限を導入する語として、現代日本語で自然な「ただし」とした。
- source_word: בְּכוֹר
  choice: 初子
  rationale: 家畜の最初に生まれたものを指す祭儀的・法的用語として、簡潔で定着した「初子」を用いた。
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: 家畜の初子、すなわち初子としてヤハウェのものとなるもの
  rationale: בכר の受動形は人が何かを『初子にする』行為よりも、初子としての身分を表す。לַיהוָה と末尾の לַיהוָה הוּא を踏まえ、その身分ゆえにヤハウェに帰属することを示した。
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: だれもそれを聖別してはならない
  rationale: אִישׁ はここでは一般的な人を指すため「だれも」とし、קדש のヒフィルが持つ祭儀的な意味を「聖別する」で保った。
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: 牛であれ、羊や山羊であれ
  rationale: שׁוֹר は牛、שֶׂה は羊だけでなく山羊も含み得る小家畜を指すため、その語義の幅を本文で明示した。
- source_word: לַיהוָה הוּא
  choice: それはヤハウェのものである
  rationale: לְ の帰属・権利関係を明瞭にし、この節の法的論理を自然な日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を固有名として音写した。
theological_decisions:
- issue: 初子を改めて聖別してはならない理由
  choice: 初子はその身分によってすでにヤハウェに帰属しているため、人が誓願などによって改めて聖別することはできない。
  alternative: 初子という身分そのものが聖別を意味し、法的所有への強調は弱い。
  rationale: 「初子としてヤハウェのものとなる」と末尾の「それはヤハウェのものである」が、既存の神の権利・帰属を示す。ただし本文では理由を説明的に付加せず、原文の二つの帰属表現にとどめた。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。「初子」「聖別」は律法・祭儀の文脈で必要な用語として保持し、構文は読みやすく整えた。אִישׁ の文法上の男性形を日本語で不必要に男性限定せず、一般的な禁止として「だれも」と訳した。
