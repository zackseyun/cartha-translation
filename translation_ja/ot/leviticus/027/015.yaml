source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: ja
  text: もし、自分の家を聖別した者がその家を買い戻すなら、その人は、あなたが評価した銀額に、その五分の一を加えなければならない[a]。そうすれば、その家はその人のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、文脈上、祭司が定めた銀の評価額に、その五分の一を上乗せする。
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: 聖別した者
  rationale: קדשׁ の使役形分詞で、家を主のために聖なるものとして取り分けた者を指す。「奉献した者」も可能だが、「聖別」は祭儀的・法的な意味を明確に保つ。
- source_word: יִגְאַל
  choice: 買い戻す
  rationale: この財産評価の文脈では、代価を支払って再び所有することを表す。日本語の「贖う」より法的行為が明瞭で、現代の読者にも自然である。
- source_word: בֵּיתוֹ
  choice: 自分の家／その家
  rationale: 直訳は「彼の家」。条件節では主語との関係を明確にするため「自分の家」とし、目的語の反復では「その家」とした。
- source_word: וְיָסַף חֲמִישִׁית
  choice: 五分の一をそれに加えなければならない
  rationale: 条件に続く義務を表す法文として訳した。「五分の一」は原文の割合をそのまま保つ。
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: あなたが評価した銀額
  rationale: כֶּסֶף の具体的な「銀」と、二人称単数の祭司による評価をともに保持しつつ、日本語として理解しやすい「銀額」とした。
- source_word: וְהָיָה לוֹ
  choice: その家は彼のものとなる
  rationale: 追加額を含む支払いの結果、家の所有が本人に帰することを自然な現代日本語で表した。
theological_decisions:
- issue: 神に取り分けられた家を表す祭儀用語
  choice: 聖別した
  alternative: 奉献した／聖なるものとした
  rationale: 家が誓願と評価の制度の中で聖なるものとして取り分けられたことを示す。特定の後代的教理を持ち込まず、קדשׁ の聖性を保つため「聖別」を採用した。
translation_notes:
  register: 現代標準日本語による簡潔で格調ある法文調。「買い戻す」により行為を明瞭にしつつ、「聖別」「銀額」で原文の祭儀的・具体的表現を保持した。
