base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: ja
  text: しかし、その畑を聖別した者がその畑を買い戻すなら、その評価額の五分の一をそれに加えなければならない。そうすれば、その畑はその人のものとなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 前節から続く条件を示しつつ、別の場合への転換を自然な現代日本語で表す。
- source_word: גָּאֹל יִגְאַל
  choice: どうしても…買い戻そうとする
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意を表す。文脈上、単なる未来より、本人が買い戻す意思を実行に移す場合を自然に示す。
- source_word: הַשָּׂדֶה
  choice: その畑
  rationale: 直前まで扱われている特定の畑を指すため、定冠詞を「その」で表した。
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: その畑を聖別した本人
  rationale: קדשの祭儀的な『聖なるものとして取り分ける』意味を保ち、分詞が当の行為者を指すことを「本人」で明確にした。
- source_word: וְיָסַף חֲמִשִׁית כֶּסֶף עֶרְכְּךָ עָלָיו
  choice: その評価額にその五分の一を加えなければならない
  rationale: 直訳的な『あなたの評価の銀の五分の一』を、日本語の法規文として明瞭に表現した。二人称単数は祭司的評価権者への定型的呼びかけであり、この一節単独では「評価額」とする方が自然である。
- source_word: וְקָם לוֹ
  choice: その畑はその人のものとなる
  rationale: 字義は『彼のために立つ／確定する』。法的結果として所有が確定することを自然な日本語で示す。
theological_decisions:
- issue: הקדישׁ の祭儀的意味
  choice: 聖別した
  alternative: ささげた／聖なるものとした
  rationale: 単なる寄付ではなく、主のために聖なるものとして取り分ける行為を示すため。「奉献」より一般読者に理解しやすく、祭儀的含意も保てる。
- issue: 法規上の義務と結果
  choice: 加えなければならない／ものとなる
  alternative: 加える／彼のために確定する
  rationale: 法規文脈における義務と、その履行後に生じる法的結果を明確にし、過去の物語として読まれることを避けた。
- issue: 強意構文 גָּאֹל יִגְאַל
  choice: どうしても…買い戻そうとするなら
  alternative: 確かに買い戻すなら／必ず買い戻すなら
  rationale: 原文の強意を残しながら、『必ず』が法的義務そのものを修飾するとの誤解を避け、本人による買い戻しの確かな意思・行為として表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法規としての義務と結果を自然に示しつつ、祭儀用語の宗教的ニュアンスを維持した。原文に説明上不可欠な異読はないため脚注は付していない。
