source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: ja
  text: 生後一か月から五歳までであれば、男の評価額は銀五シェケル、女の評価額は銀三シェケルとする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: 生後一か月から
  rationale: ヘブライ語の年齢表現を、下限が明確に伝わる自然な現代日本語にした。
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: 五歳まで
  rationale: 年齢区分の上限を簡潔に示し、原文の法規的な明確さを保った。
- source_word: עֶרְכְּךָ
  choice: 評価額
  rationale: レビ記27章における誓願に伴う規定額を指すため、単なる価値ではなく金額として明確な語を選んだ。二人称接尾辞は、規定を自然な日本語で示すため独立した「あなたの」とは訳出しなかった。
- source_word: הַזָּכָר
  choice: 男
  rationale: 年齢を限定しない性別上の法的区分であり、「男児」では五歳未満に狭まりすぎるため「男」とした。
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: 銀五シェケル
  rationale: כסףが銀を、שקליםが重量・貨幣単位を示すことを簡潔に保った。
- source_word: וְלַנְּקֵבָה
  choice: 女の
  rationale: 男性区分との対句を自然な日本語で示し、年齢限定的な「女児」を避けた。
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: 銀三シェケル
  rationale: 男性側の金額表現と統一し、銀による評価額であることを明示した。
- source_word: וְהָיָה
  choice: とする
  rationale: 法規文脈における規定の効力を、現代日本語の端正な法令調で表した。
theological_decisions: []
