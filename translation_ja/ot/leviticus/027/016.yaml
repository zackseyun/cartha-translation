source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: ja
  text: もし人が、自分の相続地の畑の一部[a]をヤハウェに聖別するなら、あなたの評価額は、その畑に必要な種の量に応じる。大麦一ホメル分を種としてまく土地につき、銀五十シェケルとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の所有地である畑の一部」。ヘブライ語は代々受け継ぐ保有地を指し、「畑」に付く前置詞は、その一部が聖別されることを示している。
    reason: 相続による保有地という法的含意と、畑の一部を指す構文上の含意を補足するため。
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: 自分の相続地である畑の一部
  rationale: 前置詞 מִן は畑全体ではなく、その一部を取り分けることを示す。אֲחֻזָּה は単なる所有物ではなく、代々受け継ぐ土地保有を指すため、「相続地」とした。
- source_word: יַקְדִּישׁ
  choice: 聖別する
  rationale: この文脈では、物をヤハウェのために聖なるものとして取り分ける行為を表す。「献げる」だけよりも祭儀的な意味を保つ。
- source_word: אִישׁ
  choice: 人
  rationale: 男性単数形だが、法規の適用対象を代表的に示す用法である。日本語の「人」は自然にその一般的効力を伝える。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に記された神の固有名 יהוה を音写し、契約の神の名を明示する。
- source_word: עֶרְכְּךָ
  choice: あなたは……評価額を定める
  rationale: 二人称単数の接尾辞を保ちつつ、現代日本語で自然な能動文とした。祭司的権威による査定額を指す。
- source_word: לְפִי זַרְעוֹ
  choice: その畑に必要な種の量に応じて
  rationale: 接尾辞は畑を指し、畑をまくのに要する種の量を評価基準とする。単に「その種に応じて」とせず、農地面積の尺度であることを明確にした。
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: 大麦一ホメルを種としてまく土地
  rationale: 一ホメル分の大麦の種を必要とする土地を表す技術的な農業尺度として、誤解の少ない日本語にした。
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: 銀五十シェケル
  rationale: 評価額を示す原文の貨幣・重量単位を保持した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を明示し、一般称号へ置き換えない。
- issue: אִישׁ の法規上の一般的用法
  choice: 人
  alternative: 男
  rationale: 原語の文法上の男性形は認めつつ、この規定が代表的・一般的な条件文であることを、性別を不必要に限定しない自然な日本語で表した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、律法本文にふさわしい簡潔で端正な文体とした。ホメル、シェケルは古代の単位として音写し、換算値は本文に持ち込まなかった。
