revisions:
- from: もし人が、自分の相続地である畑の一部[a]をヤハウェに聖別するなら、あなたは、その畑に必要な種の量に応じて評価額を定める。大麦一ホメルを種としてまく土地につき、銀五十シェケルである。
  to: もし人が、自分の相続地の畑の一部[a]をヤハウェに聖別するなら、あなたの評価額は、その畑に必要な種の量に応じる。大麦一ホメル分を種としてまく土地につき、銀五十シェケルとする。
  rationale: 原文の名詞的な評価額表現を保つため、「あなたは……評価額を定める」を「あなたの評価額は……に応じる」に改めた。また、大麦一ホメルが播種用の量であり、それに見合う土地面積が評価基準となることを自然な日本語で明示した。意味の追加や神学的解釈は行っていない。
