  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: ja
  text: あなたが定める評価額はすべて、聖所のシェケル[a]によるものとする。一シェケルは二十ゲラとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖なるシェケル」。ヘブライ語は、聖所に関わる評価に用いられた基準シェケルを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: あなたが行う評価
  rationale: レビ記27章における、誓願や奉納に伴って定める評価額という専門的意味を保ちつつ、二人称単数接尾辞も自然な日本語で表した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準として
  rationale: 聖所に関わる評価で用いられる公定の重量・貨幣基準を指すため。「聖なるシェケル」という直訳的可能性は脚注に残した。
- source_word: גֵּרָה
  choice: ゲラ
  rationale: 対応する自然な日本語単位がない古代の重量・貨幣単位なので、音写した。
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: 一シェケルは二十ゲラとする
  rationale: シェケルの換算基準を定める規定として、簡潔で自然な法令調にした。
- source_word: וְכָל
  choice: すべて
  rationale: 文脈を受ける接続辞は日本語では明示せず、分配的・包括的意味を「すべて」で保持した。
- source_word: יִהְיֶה
  choice: しなければならない／とする
  rationale: 法規文中の未完了形が持つ規定的な力を、現代日本語の自然な法令調で表した。
