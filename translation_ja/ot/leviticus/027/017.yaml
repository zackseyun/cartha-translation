  text: もし彼がヨベルの年から自分の畑を聖別するなら、あなたの評価額がそのまま有効となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: もし～なら
  rationale: 事例法の条件を導く標準的な条件表現。
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: ヨベルの年から
  rationale: 前置詞מִןの起点の意味を保ち、次のヨベルまでの残存期間に関わる評価規定であることを自然に示す。
- source_word: יַקְדִּישׁ
  choice: 聖別する
  rationale: 畑を聖なるものとして取り分ける使役形の祭儀的意味を保持する。
- source_word: שָׂדֵהוּ
  choice: 自分の畑を
  rationale: 三人称男性単数の所有接尾辞を、主語との関係が自然に伝わる日本語にした。
- source_word: כְּעֶרְכְּךָ
  choice: あなたの評価額どおりに
  rationale: 祭司である二人称の受け手が定める金銭的評価を表し、כְּの基準・一致の意味を明示する。
- source_word: יָקוּם
  choice: 定まる
  rationale: 法的・行政的に評価額が有効なものとして確定する意味を、現代日本語で簡潔に表す。
theological_decisions:
- issue: 主への奉献を表す祭儀的動詞
  choice: 聖別する
  alternative: ささげる／奉献する
  rationale: קדשׁの「聖なるものとして取り分ける」という意味を保ちつつ、畑そのものが神格化されるとの誤解を避ける文脈的な用法として採用した。
