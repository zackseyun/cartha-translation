  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: ja
  text: 「イスラエルの人々に告げなさい。彼らにこう言いなさい。『人が特別な誓願を立て、ヤハウェに献げる人について、あなたが定める評価額に従う場合、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この箇所のヘブライ語は解釈が難しい。別訳「人が特別な誓願を立て、あなたの評価に従って、人をヤハウェに献げる場合」。以下の節では、誓願の対象となる人について定められた評価額が示される。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々に告げて
  rationale: בְּנֵי יִשְׂרָאֵל は字義的には「イスラエルの子ら」だが、契約共同体全体を指す定型表現であるため、現代日本語で自然な「イスラエルの人々」とした。
- source_word: אִישׁ
  choice: 人が
  rationale: 男性単数形だが、ここでは法規上の一般的な主体を示すため、日本語では性別を限定しない「人」が自然である。
- source_word: יַפְלִא נֶדֶר
  choice: 特別な誓願を立て
  rationale: יַפְלִא はこの誓願が通常とは異なる特別なものであることを示す。נֶדֶר は祭儀・法規の文脈に即して「誓願」とした。
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: 人をあなたの評価額に付す
  rationale: 難解な構文と二人称単数接尾辞を保ちつつ、後続節で定められる人の評価額を指すことが分かる表現とした。נְפָשֹׁת はここでは非物質的な「魂」ではなく、人間を指す。
- source_word: לַיהוָה
  choice: ヤハウェにささげる
  rationale: 神名 יהוה を固有名「ヤハウェ」として示し、לְ の献納の方向性を日本語では「にささげる」で明確にした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に現れる契約の神名を固有名として保持する。
- issue: 誓願と人の評価額との関係
  choice: ヤハウェにささげる人をあなたの評価額に付す
  alternative: 人々について、あなたの評価に従ってヤハウェに特別な誓願を立てる
  rationale: ヘブライ語の統語には難しさがあるため、誓願が人の評価額に関わるという文脈上の中心を示しながら、「あなたの」という二人称と解釈上の余地を残した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調ある法規文の調子とした。「告げて言いなさい」は原文の反復的な命令形式を適度に保持する。節が次節へ続くため、末尾は読点とした。
