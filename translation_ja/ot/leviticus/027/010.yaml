source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: ja
  text: その家畜を取り替えたり、交換したりしてはならない[a]。良いものを悪いものに、あるいは悪いものを良いものに替えてはならない。もし実際に家畜を別の家畜と交換するなら[b]、元の家畜もその代わりの家畜も聖なるものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「取り替える」と「交換する」に、意味の近い二つの異なる動詞が用いられている。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は動詞を重ねて強調しており、「もし実際に交換するなら」または「もし確かに交換するなら」という意味に取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: それを別のものに取り替える
  rationale: חלףのヒフィル形は、ここでは誓願によってささげられた動物を別のものに置き換えることを表す。「取り替える」は自然な現代日本語であり、後続のמוּרとの語の違いもある程度保てる。
- source_word: יָמִיר אֹתוֹ
  choice: それを交換する
  rationale: מוּרはこの文脈で、一頭を別の一頭と交換する行為を指す。「交換する」として、先行する「取り替える」と区別した。
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: 良いものを悪いものに、あるいは悪いものを良いものに
  rationale: 形容詞が名詞的に用いられているため、「もの」を補って自然にし、良否いずれの方向の交換も禁じる対句を保持した。
- source_word: וְאִם הָמֵר יָמִיר
  choice: もし実際に……交換したなら
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を、「実際に」で簡潔に示した。
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: 家畜を別の家畜と
  rationale: בְּהֵמָהは祭儀法の文脈では家畜を指す。「別の」を補い、交換関係を明瞭にした。
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: 元の家畜もその代わりの家畜も
  rationale: 代名詞が元の動物を、תְּמוּרָהが交換に出された代替の動物を指すことを、自然な日本語で明示した。
- source_word: קֹדֶשׁ
  choice: 聖なるものとなる
  rationale: 神に属するものとして聖別された法的・祭儀的地位を表す。原語に直接的で、文脈にも適した表現とした。
theological_decisions:
- issue: 交換を試みた後の元の家畜と代わりの家畜の地位
  choice: 元の家畜と代わりの家畜の両方が聖なるものとなる
  alternative: 代わりの家畜だけが聖なるものとなる、または交換が無効だと述べるだけと解する
  rationale: 「それとその代わりのものは聖なるものとなる」という節は、両方に聖なる地位を帰している。「も……も」によってその二重の結果を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀法にふさわしい端正な調子を保った。「取り替える」と「交換する」を並べて原文の二動詞を反映し、強調構文と両方の家畜が聖なるものになる法的帰結を明示した。
