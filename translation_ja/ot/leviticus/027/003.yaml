source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: ja
  text: あなたが定める二十歳から六十歳までの男性の評価額は、聖所のシェケルに従って銀五十シェケル[a]とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所のシェケル」とは、聖所に関わる基準となる重量単位としてのシェケルを指す。
    reason: 「聖所のシェケル」が銀の量を測る基準であることを説明するため。
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: あなたが定める評価額
  rationale: עֵרֶךְは人の本質的な価値ではなく、誓願に関して定められる祭儀法上の評価額を指す。二人称接尾辞も明示した。
- source_word: הַזָּכָר
  choice: 男子
  rationale: 年齢と性別による法的区分を示す男性単数形であり、現代日本語で簡潔かつ明確な「男子」とした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: 二十歳から六十歳まで
  rationale: 年齢範囲を表すヘブライ語の慣用句を、自然で明瞭な日本語にした。
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: 銀五十シェケル
  rationale: 銀の重量額を表す語句として、単位名シェケルを保持しつつ簡潔に訳した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準に
  rationale: 前置詞בְּが示す測定基準を明示し、הַקֹּדֶשׁを祭儀的な聖所に属する公定基準として訳した。
- source_word: וְהָיָה ... וְהָיָה
  choice: …については、…とする
  rationale: 反復される法規定の形式を、日本語の規定文として自然な「とする」で表した。
theological_decisions:
- issue: 性別による評価区分
  choice: 男子
  alternative: 男／男性
  rationale: 原文が明示する性別区分を中性化せず保持した。「男子」はここで個人の尊厳ではなく法的分類を表す。
- issue: עֵרֶךְの性質
  choice: 評価額
  alternative: 価値／値積もり
  rationale: 人間の本質的価値や売買価格ではなく、誓願に伴う祭儀法上の算定額であることを明確にした。
- issue: 聖所のシェケル
  choice: 聖所のシェケルを基準に
  alternative: 聖なるシェケルで
  rationale: 抽象的な神聖性よりも、聖所に関係する公定の重量基準を指す文脈を反映した。
translation_notes:
  register: 現代の一般読者に理解できる簡潔な法規定の文体とした。「とする」で規定性を示しつつ、古代の単位名「シェケル」は本文に保持した。
