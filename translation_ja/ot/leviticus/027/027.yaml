source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: ja
  text: しかし、それが儀礼上汚れた家畜であれば[a]、その人は、あなたの評価額にその五分の一を加えて[b]、それを買い戻すことができる。もしそれが買い戻されないなら、あなたの評価額で売られる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れた家畜の中のものであれば」とも訳せる。儀礼上汚れているとされる種類の家畜を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その五分の一をその上に加える」。評価額の二十パーセントを加算するという意味。
    reason: lexical_clarification
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: 汚れた家畜の類に属するものであれば
  rationale: בְּהֵמָהは家畜・獣を指し、ここでは儀礼上汚れていてささげ物にできない家畜の分類を表す。前置詞בְּの分類的な意味を自然な日本語で示した。
- source_word: וּפָדָה
  choice: 買い戻すことができる
  rationale: פדהは代価を払って取り戻すこと。後半の「もし買い戻されないなら」と対になる選択可能な手続きとして読み、義務と断定せずに法文の意味を表した。
- source_word: בְעֶרְכֶּךָ
  choice: あなたの評価額
  rationale: עֵרֶךְはレビ記27章で祭司が定める査定額を指す。二人称単数の呼びかけも保持した。
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: その五分の一を上乗せして
  rationale: 査定額にその五分の一、すなわち二十パーセントを加える意味。「上乗せ」で追加分であることを明確にした。
- source_word: וְאִם לֹא יִגָּאֵל
  choice: もし買い戻されないなら
  rationale: גאלのニファル形が行為者を明示しない受動表現であるため、日本語でも行為者を補わなかった。
- source_word: וְנִמְכַּר
  choice: 売られる
  rationale: ニファル形の法的な受動を簡潔に保った。
theological_decisions:
- issue: 買い戻しが義務か選択肢か
  choice: 「買い戻すことができる」として選択可能な手続きを示す
  alternative: 「買い戻さなければならない」または「買い戻す」
  rationale: 直後に「もし買い戻されないなら、売られる」という別の処置が置かれているため、絶対的義務とすると緊張が生じる。法的文脈における条件・手続きの意味を保ちつつ、後半との関係を自然に示した。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で品位ある法文調とした。「儀礼上汚れた」は本文では簡潔に「汚れた」とし、分類上の意味は脚注で説明した。
