source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: ja
  text: しかし、もしヤハウェに献げ物として献げることのできない汚れた動物であれば、彼はその動物を祭司の前に立たせなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし…なら
  rationale: 前節までの規定と対照をなしつつ、新たな条件付き事例を導入する接続表現として自然に訳した。
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: 汚れた動物
  rationale: טָמֵא は衛生上の汚さではなく祭儀上の不浄を表すため、「汚れた」とした。כָּל はこの条件文では該当するどの動物にも適用される一般性を持つ。
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: 献げ物として献げることのできない
  rationale: יַקְרִיבוּ の一般・非人称的な複数形を日本語では可能表現で自然に示し、מִמֶּנָּה の「その動物から」を、動物そのものを献げ物とする文脈に即して「献げ物として」と表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 原文の神名 יהוה を固有名として音写し、方向・受益を示す לְ を「に」で表した。
- source_word: וְהֶעֱמִיד
  choice: 立たせなければならない
  rationale: עמד のヒフィル形「立たせる」を保持し、法規文の義務を現代日本語の「なければならない」で明示した。
- source_word: לִפְנֵי הַכֹּהֵן
  choice: 祭司の前に
  rationale: 位置と公式な提示の双方を含む לִפְנֵי を、簡潔で自然な「前に」と訳した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の契約の神名が明記されているため、それを一般称号に置き換えず音写した。
- issue: 汚れた動物が献げられないことの表現
  choice: 献げることのできない
  alternative: 人々が献げない
  rationale: יַקְרִיבוּ は一般・非人称的な複数として理解し、単なる慣行ではなく祭儀上の不適格を自然に表した。ただし原文の形態上は「人々が献げない」とも直訳できる。
translation_notes:
  register: 明瞭な現代標準日本語による法規文。祭儀用語として「汚れた」「献げ物」「祭司」を用い、原文の条件構造と義務表現を保った。
