id: LEV.27.23
reference: Leviticus 27:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: ja
  text: 祭司は、ヨベルの年までの期間に応じて、その人のためにあなたの評価額の相当分を計算する。その人はその日に、その評価額をヤハウェへの聖なるささげ物として納める[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤハウェに聖なるものとして」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: 計算する
  rationale: ピエル形の「算定する、計算する」という意味を、金額を割り出す文脈に即して明確に表した。
- source_word: לּוֹ
  choice: その人のために
  rationale: 与格代名詞を、祭司が当人について金額を算定することを示す自然な日本語にした。
- source_word: מִכְסַת
  choice: 相当分
  rationale: ヨベルの年までの残存期間に応じた、評価額の一定割合・割当額を表す。
- source_word: הָעֶרְכְּךָ
  choice: あなたの評価額
  rationale: レビ記27章における עֵרֶךְ の専門的な「評価額」という意味と、二人称男性単数接尾辞を保持した。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: ヨベルの年までの期間に応じて
  rationale: 単なる期限ではなく、その年までの期間を基準に按分する文脈を自然に示した。
- source_word: וְנָתַן
  choice: 納める
  rationale: 基本義は「与える」だが、ここでは算定された金額を聖所に差し出す行為なので、「支払う」ほど商取引的に限定せず「納める」とした。
- source_word: בַּיּוֹם הַהוּא
  choice: その日に
  rationale: 時間表現を直接的かつ自然に訳した。
- source_word: קֹדֶשׁ לַיהוָה
  choice: ヤハウェへの聖なるささげ物として
  rationale: 直訳は「ヤハウェに聖なるもの」。直前の評価額が神に献納されるという祭儀的意味を本文で分かりやすく示し、形式的な訳は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を称号に置き換えず、ヘブライ語の固有名として音写した。
theological_decisions:
- issue: וְנָתַן の省略された主語
  choice: 土地をささげた当人を「その人」として明示
  alternative: 祭司を主語とみなし、「祭司は……納める」とする
  rationale: 祭司は金額を計算し、当人がその算定額を納めるという直前からの文脈が自然である。ただしヘブライ語本文では二つ目の動詞の主語は明示されていない。
- issue: קֹדֶשׁ לַיהוָה の表現
  choice: 「ヤハウェへの聖なるささげ物として」と祭儀的意味を明示
  alternative: 「ヤハウェに聖なるものとして」と形式的に訳す
  rationale: 評価額を神に献納する趣旨を現代日本語で明瞭にしつつ、原文に近い表現を脚注に示して意味の幅を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法規文として簡潔にしつつ、主語交替は読者に分かるよう「その人」を補った。「ヨベル」は制度名として保持した。
