id: LEV.27.20
reference: Leviticus 27:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: ja
  text: しかし、その人がその畑を買い戻さず、あるいはその畑を別の人[a]に売ったなら、その畑を二度と買い戻すことはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「別の男」とも訳せる。
    reason: ヘブライ語 אִישׁ は「男」を意味する一方、このような法律的文脈では「人」一般を指すこともあるため。
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら／あるいは…なら
  rationale: 前節から続く二つの条件を示す。最初の接続には文脈上の対照を表す「しかし」を用い、二つ目は選択的条件として自然な「あるいは」で結んだ。
- source_word: יִגְאַל / יִגָּאֵל
  choice: 買い戻す／買い戻すことはできない
  rationale: גאלはここでは、聖別された不動産を定められた手続きで取り戻す法律的行為を指す。「贖う」より具体的で現代の読者に明瞭な「買い戻す」を用い、能動形と受動形の対応を保った。末尾の受動形は日本語として自然な可能表現で訳した。
- source_word: הַשָּׂדֶה
  choice: その畑
  rationale: 一般的な土地ではなく、直前から論じられている特定の畑を指すため。
- source_word: מָכַר
  choice: 売った
  rationale: 条件節内の完了した売却を簡潔で自然な日本語で表す。主語は直前の三人称男性単数と同じく「その人」と理解できる構文にした。
- source_word: לְאִישׁ אַחֵר
  choice: 別の人
  rationale: אישは字義的には男性を表し得るが、法律的表現では人一般を指すこともある。日本語本文では自然で過度に限定しない「人」を採用し、字義的な形は脚注に示した。
- source_word: עוֹד
  choice: 二度と
  rationale: 売却後は以後の買い戻しが認められないという不可逆的な法的結果を、否定表現と自然に結び付けて示す。
theological_decisions:
- issue: גאלの法律的・祭儀的含意
  choice: 買い戻す
  alternative: 贖い戻す／贖う
  rationale: 本節では畑の所有権を対価によって回復する具体的な行為が中心である。「買い戻す」は法律的意味を明確にしつつ、文脈にある聖別財産としての性格を否定しない。
- issue: אישの男性形と法律上の一般性
  choice: 本文では「別の人」、脚注で「別の男」とも訳せることを示す
  alternative: 別の男
  rationale: ヘブライ語の男性形を隠さず脚注に残しながら、法律上の受取人を男性に限定するかどうか本文だけで断定しない。
translation_notes:
  register: 明瞭で現代的な法律文体としつつ、聖書本文にふさわしい落ち着きを保った。「二度と…できない」により、売却後の法的な最終性を自然に表現した。
