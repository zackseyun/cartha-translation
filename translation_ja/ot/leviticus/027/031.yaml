  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: ja
  text: もし人が自分の十分の一の一部を買い戻すなら[a]、それに五分の一を加えなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「買い戻す」が不定詞絶対形と同じ動詞の未完了形を重ねる形で表され、動作が強調されている。
    reason: 原文の不定詞絶対形＋同語根未完了形による強意構文を説明するため。
lexical_decisions:
- source_word: וְ/אִם
  choice: しかし、もし
  rationale: 接続詞と条件辞が、先行する規定に続いて別の条件を提示しているため。日本語の法文として自然になるよう「しかし、もし」とした。
- source_word: גָּאֹל יִגְאַל
  choice: 買い戻すなら
  rationale: גאלは、聖別された物を代価によって取り戻す文脈なので「買い戻す」とした。不定詞絶対形と未完了形の組み合わせによる強意は、日本語本文を不自然にしないため脚注で示した。
- source_word: אִישׁ
  choice: 人
  rationale: 男性単数形だが、この法規では一般的な当事者を指す。現代日本語では「人」が性別を不必要に限定せず、原文の一般的用法を自然に伝える。
- source_word: מִ/מַּעַשְׂר/וֹ
  choice: 自分の十分の一のささげ物の一部を
  rationale: מִןの部分を表す用法を「一部」と明示し、מַעֲשֵׂרは文脈上、単なる割合ではなく神に属する十分の一の分なので「十分の一のささげ物」とした。
- source_word: חֲמִשִׁית/וֹ
  choice: その五分の一を
  rationale: 接尾辞を保ち、買い戻す対象の価値に対する五分の一を指す形で訳した。
- source_word: יֹסֵף עָלָי/ו
  choice: それに加えなければならない
  rationale: ヒフィル形の「加える」とעַלの加算対象を自然な日本語で表し、法規としての義務を「なければならない」で示した。
