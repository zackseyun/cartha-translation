  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: ja
  text: 牛や羊とやぎについては、杖[a]の下を通るもののうち、十頭目ごとに当たるものはすべて、ヤハウェのための聖なるものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「杖」は、家畜を一頭ずつその下に通して数えるための牧者の杖を指す。
    reason: cultural_note
lexical_decisions:
- source_word: מַעְשַׂר
  choice: 十分の一
  rationale: 家畜から十頭ごとに一頭を取り分けることを示す法的用語。現代日本語で意味が直接伝わる表現とした。
- source_word: בָּקָר וָצֹאן
  choice: 牛や羊やぎ
  rationale: בָּקָרは牛類、צֹאןは羊とやぎを含む小家畜の集合名詞なので、対象範囲を明確に示した。
- source_word: יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: 杖の下を通る
  rationale: 家畜を一頭ずつ数える牧畜上の具体的な光景を保った。
- source_word: הָעֲשִׂירִי
  choice: その十頭目
  rationale: 原文は直訳すれば「その十番目」だが、文脈上は数えられる家畜を指すため、日本語では助数詞を補った。
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: 聖なるものとなる
  rationale: 単なる一般的な奉納ではなく、神のために聖別された状態を表す原文の聖性概念を保持した。
- source_word: לַיהוָה
  choice: ヤハウェの
  rationale: 神名יהוהを称号に置き換えず、固有名として音写した。日本語では「ヤハウェの聖なるもの」として帰属・献納の関係を自然に表した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を固有名として示し、称号への置換や特定の伝統的発音の採用を避けた。
- issue: קֹדֶשׁ לַיהוָהの表現
  choice: ヤハウェの聖なるものとなる
  alternative: ヤハウェにささげられる／ヤハウェのものとなる
  rationale: 帰属や献納だけに意味を狭めず、原文の「聖」という神学的カテゴリーを明示した。
translation_notes:
  register: 現代の一般読者に理解しやすい簡潔な法文調とした。「羊やぎ」は羊とやぎをまとめて指す自然な並列表現であり、原文の集合名詞צֹאןの範囲を明確にする。
