source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: ja
  text: また、ある人が自分の家をヤハウェに聖別するなら、祭司はその家が良いか悪いか[a]を査定する。祭司がそれを査定した[b]とおりに、その評価は確定する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「良いか悪いか」は、祭司が家の状態や質を見定めることを表す。
    reason: cultural_note
  - marker: b
    text: 「査定する」は「価値を定める」「値踏みする」とも訳せる。ここでは祭司による公的な評価を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: また、ある人が……なら
  rationale: 祭儀法における個別事例を導入する条件表現。男性単数形を踏まえつつ、現代日本語で自然な「ある人」とした。
- source_word: יַקְדִּשׁ
  choice: 聖なるものとしてささげる
  rationale: קדשׁ のヒフィル形は、物を聖別して神に属するものとすることを表す。「奉献する」より一般読者に明瞭で、単なる贈与とも区別できる表現とした。
- source_word: בֵּיתוֹ
  choice: 自分の家
  rationale: この章の評価規定では建物・不動産としての家が問題となるため、「家庭」ではなく「家」とした。
- source_word: קֹדֶשׁ לַיהוָה
  choice: ヤハウェのために聖なるものとして
  rationale: 家がヤハウェに属する聖別物となる意味を明示しつつ、原文の「聖なるもの」という概念を保った。
- source_word: וְהֶעֱרִיכוֹ / יַעֲרִיךְ
  choice: それを査定する
  rationale: ערך のヒフィル形は、ここでは祭司が贖い等に関わる公的な価額を定めること。「査定する」は制度的な評価を明瞭に伝え、同じ語の反復も訳文に保つ。
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: 良いか悪いか
  rationale: 直訳的な「良いものと悪いものとの間」を避け、家の状態や質のいかんを評価するヘブライ語の慣用表現として自然に訳した。
- source_word: כֵּן יָקוּם
  choice: その評価は確定する
  rationale: 直訳は「そのように立つ」だが、この法的文脈では祭司の査定が有効なものとして確定する意。「評価」は文脈から補って自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に記された四文字神名を固有名として示す。特定教派に結びつきやすい「エホバ」を避け、現代の標準的な学術的表記である「ヤハウェ」とした。
- issue: 家を聖なるものとする行為の性格
  choice: ヤハウェのために聖なるものとしてささげる
  alternative: ヤハウェに献納する／家そのものが本質的に聖化される
  rationale: 原文は家を神に属する聖別物として取り分ける行為を述べる。所有権移転や存在論的変化の細部を本文に読み込まず、祭儀的な奉献の意味を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法としての厳粛さを保った。「査定」「確定」により法的・公的な性格を表し、「聖なるものとしてささげる」により専門語に偏らず聖別の意味を伝えた。
