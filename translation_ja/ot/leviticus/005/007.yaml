source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: ja
  text: しかし、もしその人に羊一匹を用意する余裕がなければ、犯した罪の償いの供え物として、山鳩二羽か家鳩のひな二羽を主に携えて来なければならない。そのうち一羽を罪のためのいけにえ[a]とし、もう一羽を全焼のいけにえとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのいけにえ」とも訳せる。ヘブライ語 חַטָּאת は「罪」を意味するほか、祭儀の文脈では、罪や汚れを取り除くためのいけにえを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: 羊一匹を用意する余裕がなければ
  rationale: 「手が届く」というヘブライ語の慣用表現を、経済的な能力を表す自然な現代日本語にした。「買えなければ」よりも、入手方法を金銭的購入だけに限定しない。
- source_word: אֲשָׁמוֹ
  choice: 償いの供え物
  rationale: ここでは罪責そのものより、犯した罪について携えて来る供え物を指す。ただし、後続する鳥は「罪のためのいけにえ」と「全焼のいけにえ」に分けられるため、別種の祭儀名と誤解されにくい「償いの供え物」とした。
- source_word: אֲשֶׁר חָטָא
  choice: 犯した罪
  rationale: ヘブライ語の関係節を、日本語で供え物との関係が明確になるよう名詞句として表した。
- source_word: שְׁתֵּי תֹרִים
  choice: 山鳩二羽
  rationale: תֹרִיםの慣用的な鳥名を用い、鳥を数える助数詞「羽」を添えた。
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: 家鳩のひな二羽
  rationale: 直訳では「鳩の子二羽」だが、若い鳩を指すヘブライ語の慣用表現を自然な日本語にした。תֹרִיםとの区別も示す。
- source_word: לַיהוָה
  choice: 主のもとに
  rationale: 神名יהוהは、日本語聖書で広く理解される敬称「主」で表した。前置詞לと動詞「携えて来る」の組み合わせは、献げ物の届け先を示す「主のもとに」とした。
- source_word: לְחַטָּאת
  choice: 罪のためのいけにえ
  rationale: 祭儀上の供え物を指す伝統的で分かりやすい表現を本文に採用した。「清めのいけにえ」という機能的理解も可能なため脚注に残した。
- source_word: לְעֹלָה
  choice: 全焼のいけにえ
  rationale: 供え物全体を祭壇で焼くעֹלָהの祭儀的特徴を、一般読者にも分かる定訳的表現で示した。
theological_decisions:
- issue: חַטָּאתの祭儀的意味
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: 語は罪に関係する供え物を指す一方、祭儀的な汚れを除く機能に重点を置いて「清めのいけにえ」と理解することもできる。本文では伝統的で明瞭な表現を用い、別の有力な理解を脚注で保持した。
- issue: אָשָׁםを祭儀の固有名称と見るか、広く償いの供え物と見るか
  choice: 償いの供え物
  alternative: 罪過のいけにえ
  rationale: この節で実際に献げる二羽はחַטָּאתとעֹלָהに分けられており、אָשָׁםを第三の独立したいけにえの種類として訳すと混乱を招く。そこで、罪責に対する償いとして携える供え物という広い意味を表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「携えて来なければならない」により律法文の義務性を示しつつ、過度に古風な語法は避けた。「いけにえ」は一般読者への分かりやすさを優先して平仮名表記とした。
