  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: ja
  text: また、二羽目は、定められた手順に従って焼き尽くすいけにえとしてささげる[a]。祭司は、その人が犯した罪に関して、その人のために贖いを行い、その人は赦される[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「規定に従って」。ここでは、定められた祭儀の手順を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、赦す方を明示しない受動表現。
    reason: theological_ambiguity
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: 二羽目
  rationale: 直前の文脈にある二羽の鳥のうち第二の鳥を指す。日本語では対象が鳥だと明示できる「二羽目」が自然で明確。
- source_word: יַעֲשֶׂה עֹלָה
  choice: 焼き尽くすいけにえとしてささげる
  rationale: עשהは広義の「行う／作る」だが、ここでは祭儀上の実施を表す。עֹלָהにはレビ記で通用する「焼き尽くすいけにえ」を用い、動作は自然な日本語として「ささげる」とした。
- source_word: כַּמִּשְׁפָּט
  choice: 定められた手順に従って
  rationale: מִשְׁפָּטはここでは供犠について確立された規定・手順を指すため、法的意味と祭儀的な手順の双方を分かりやすく表す。
- source_word: וְכִפֶּר עָלָיו
  choice: その人のために贖いを行う
  rationale: 祭司によるכפרの標準的な祭儀用語を保持し、後代の特定の教理体系へ狭めない。「その人のために」はעָלָיוを自然に表す。
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: その人が犯した罪のために
  rationale: 罪が贖いの対象・契機であることを、ヘブライ語の重複表現を不自然に直訳せず明確に示す。
- source_word: וְנִסְלַח לוֹ
  choice: その人は赦される
  rationale: 神を明示しない受動形を保ち、原文の神学的慎みと含意を維持する。
theological_decisions:
- issue: 祭司による贖いの表現
  choice: 贖いを行う
  alternative: 清める／赦しを得させる
  rationale: כפרの祭儀的・神学的な幅を保持し、単なる清めや赦しの獲得だけに意味を限定しない。
- issue: 赦しを与える主体が明示されない受動表現
  choice: その人は赦される
  alternative: 主はその人を赦す
  rationale: 原文は赦しの主体を明示しない神的受動表現であるため、神を主語として補わず、その含みを保つ。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある文体。「焼き尽くすいけにえ」「贖い」はレビ記の祭儀用語として一貫性を優先しつつ、文全体は自然な日本語に整えた。
