  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: ja
  text: その人は、群れの中から傷のない雄羊を、あなたの評価に従って、償いのささげ物[a]として祭司のもとに携えて行かなければならない。祭司は、その人が知らないまま誤って犯した過ち[b]について、その人のために贖いを行う。こうして、その人は赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪過のささげ物」とも訳せる。ヘブライ語אָשָׁםは、特定の種類のささげ物を指す。
    reason: lexical_alternative
  - marker: b
    text: 「過失」とも訳せる。ヘブライ語は、意図せずに犯した誤りであることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 携えて来なければならない
  rationale: 接続詞付き完了形は、この祭儀法規では義務を示す。現代日本語の規定文として自然な形にした。
- source_word: אַיִל תָּמִים
  choice: 傷のない雄羊
  rationale: אַיִלは成獣の雄羊、תָּמִיםは祭儀の文脈で欠陥がないことを表す。
- source_word: מִן הַצֹּאן
  choice: 群れの中から
  rationale: צֹאןは羊や山羊などの小家畜の群れを指すが、ここではאַיִלによって雄羊に限定されている。
- source_word: בְּעֶרְכְּךָ
  choice: あなたの評価額に相当するものとして
  rationale: 二人称単数の『あなたの評価』という形を保ち、祭儀上の査定額との対応を明確にした。評価者が誰かは本文以上に限定しない。
- source_word: לְאָשָׁם
  choice: 償いのささげ物
  rationale: אָשָׁםは特定の祭儀的ささげ物を指し、罪責だけでなく償いの側面も持つ。一般読者に意味が伝わる表現を採用した。
- source_word: וְכִפֶּר עָלָיו
  choice: その人のために贖いを行う
  rationale: 祭司がその人のために行うכפרの祭儀的行為を、神学的な重みを保つ定訳的表現で示した。
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג וְהוּא לֹא יָדַע
  choice: 本人が知らないまま誤って犯した過ちについて
  rationale: 同根語שׁגגהとשׁגגが示す過失性と、本人が知らなかったという後続句の双方を保持した。
- source_word: וְנִסְלַח לוֹ
  choice: こうして、その人は赦される
  rationale: ニファル形の受動表現を保ち、赦す主体を本文が明示していない点も維持した。
theological_decisions:
- issue: אָשָׁםという祭儀用語の訳
  choice: 償いのささげ物
  alternative: 罪過のいけにえ／罪責のささげ物
  rationale: これはレビ記における特定の供え物の類型である。『償い』は修復的側面を伝えつつ、後代の特定教派の体系を持ち込まない。別訳は脚注に示した。
- issue: כפרの訳
  choice: 贖いを行う
  alternative: 罪を覆う／償いをする
  rationale: 祭司の祭儀行為と、その結果である赦しとの関係を保つため、意味を狭く限定せず『贖い』を用いた。
- issue: 赦しの主体
  choice: 受動形のまま『赦される』とする
  alternative: 神に赦される
  rationale: 文脈上は神の赦しが想定されるが、ヘブライ語本文は主体を明示しないため、訳文でも補わなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭儀法規としての端正さを保った。『贖い』『赦される』など本文の神学的語彙は維持し、評価者や赦しの主体は原文以上に特定していない。
