  terminology: 「死骸」「野生動物」「家畜」は適切です。「群がる小動物」は שֶׁרֶץ の分類語として理解可能であり、伝統的な「這うもの」に狭めない点もよいです。「汚れた」は祭儀上の不浄を表す語として文脈上許容されます。「罪責を負う」は אָשֵׁם の法的・祭儀的な責任を適切に示します。
