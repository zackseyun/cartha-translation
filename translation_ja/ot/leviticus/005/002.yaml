id: LEV.5.2
reference: Leviticus 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: ja
  text: ある人が、何か汚れたもの、すなわち、汚れた野生動物の死骸、汚れた家畜の死骸、または汚れた群がる小動物の死骸に触れ、そのことに気づかず[a]、汚れた状態にあり、罪責を負う場合、[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その人には隠されていて」。すなわち、その人がそのことを認識していないこと。
    reason: lexical_alternative
  - marker: b
    text: 「罪責を負う」は、祭儀上の汚れに伴う責任を負うこと。死骸に触れる行為そのものが、意図的な罪と同じ意味で道徳的悪であるということではない。
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ある人
  rationale: 祭儀法の文脈では、非物質的な「魂」ではなく、法の対象となる一個人を指す。現代日本語として自然な「ある人」とした。
- source_word: תִּגַּע בְּ
  choice: に触れ
  rationale: 前置詞 ב を伴う נגע は物理的接触を表すため、簡潔で明瞭な「触れる」とした。
- source_word: כָל דָּבָר טָמֵא
  choice: 何か汚れたもの
  rationale: דָּבָר の広い意味を保ち、後続する死骸の例を包括する表現とした。
- source_word: נִבְלַת
  choice: 死骸
  rationale: レビ記の清浄規定では動物の遺骸を指す。「死体」よりも動物について自然で正確な「死骸」を用いた。
- source_word: חַיָּה טְמֵאָה
  choice: 汚れた野生動物
  rationale: בְּהֵמָה との対比から、חַיָּה はここでは野生の陸生動物を指す。
- source_word: בְּהֵמָה טְמֵאָה
  choice: 汚れた家畜
  rationale: 野生動物との対比を明確にし、飼育される四足動物を自然な現代語で表した。
- source_word: שֶׁרֶץ טָמֵא
  choice: 汚れた群がる小動物
  rationale: שֶׁרֶץ は群がる、あるいは地を這う小動物の総称である。「群がる小動物」はヘブライ語の分類的な広がりを比較的明瞭に伝える。
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: そのことに気づかないまま
  rationale: 字義的には「その人から隠されている」。日本語では意味を自然に伝える「気づかない」とし、継続状態を「まま」で表した。
- source_word: וְהוּא טָמֵא
  choice: 汚れた者となり
  rationale: 接触によって生じる祭儀上の状態を表す。「罪深い」などの道徳的含意を避けた。
- source_word: וְאָשֵׁם
  choice: 罪責を負った
  rationale: אָשֵׁם はこの法的文脈で責任・負い目を負うことを表す。「罪を犯した」と断定せず、法的責任の含みを保った。
theological_decisions:
- issue: 汚れの性質
  choice: טָמֵא/טְמֵאָה を「汚れた」と訳す。
  alternative: 「不浄な」「罪深い」
  rationale: ここで問題となるのは死骸への接触による祭儀上の汚れであり、それ自体を意図的な道徳悪と同一視しないため。
- issue: וְאָשֵׁם の罪責概念
  choice: 「罪責を負った」と訳す。
  alternative: 「罪を犯した」「有罪となった」
  rationale: 原語は法的・祭儀的な責任を負うことを示し得る。道徳的悪意を必要以上に読み込まず、同時に責任の発生を弱めない表現とした。
- issue: 無自覚と責任の関係
  choice: 無自覚の接触、汚れた状態、罪責という本文の緊張をそのまま示す。
  alternative: 気づいた時点で初めて罪責を負うと明示する。
  rationale: 本文の וְנֶעְלַם מִמֶּנּוּ は無自覚を示すが、気づく時点はこの節には明記されないため、解釈を本文へ補わない。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある法文調。「そのことに気づかないまま」は字義訳より自然さを優先しつつ意味を保持した。列挙の構造を保ち、祭儀的な「汚れ」と法的な「罪責」を区別した。
