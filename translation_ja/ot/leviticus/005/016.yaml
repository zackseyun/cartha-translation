  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: ja
  text: その人は、聖なるものに関して損なった分を弁償し[a]、さらにその額の五分の一を加えて祭司に渡さなければならない。祭司は、償いのささげ物としての雄羊[b]によって、その人のために贖いを行う。こうして、その人は赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なるものから不当に取り去った分を弁償し」。ヘブライ語は、聖別された物や聖なる納付物に関わる違反の償いを指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「罪過のささげ物としての雄羊」。ヘブライ語の語には、罪責と、それに伴う償い・賠償の両面がある。
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: 聖なるものについて損なった分
  rationale: この句は、聖別された物や聖なる納付物に関わる違反と、その損失の補填を指す。日本語として意味が通るよう「損なった分」としたが、「聖なるものから不当に差し引いた分」という含みもありうるため脚注で示した。
- source_word: יְשַׁלֵּם
  choice: 償い
  rationale: שלםのピエル形は、この法的・祭儀的文脈では単なる支払いではなく、損失の返済・補償を表す。
- source_word: חֲמִישִׁתוֹ
  choice: その五分の一
  rationale: 元の損失額に対する五分の一の加算を、正確で自然な現代日本語で表した。
- source_word: יוֹסֵף עָלָיו
  choice: さらに……を加えて
  rationale: 元の額に割増分を上乗せするというヘブライ語の慣用表現を明確にした。
- source_word: לַכֹּהֵן
  choice: 祭司に
  rationale: 受取人を示す直接的で標準的な訳。
- source_word: יְכַפֵּר עָלָיו
  choice: その人のために贖いを行う
  rationale: 祭儀におけるכפרの働きを表す定型的かつ理解しやすい表現。罪を覆う、除く、関係を回復するなどの意味を一語で狭く限定しない。
- source_word: בְּאֵיל הָאָשָׁם
  choice: 償いのささげ物の雄羊によって
  rationale: אָשָׁםには罪責と賠償の両面がある。この節では直前の償いと加算が強調されるため「償いのささげ物」とし、別訳を脚注に残した。
- source_word: וְנִסְלַח לוֹ
  choice: こうして、その人は赦される
  rationale: סלחのニファル形が表す、違反者に赦しが与えられる結果を自然な日本語で示した。
theological_decisions:
- issue: 祭儀用語 אָשָׁם の訳
  choice: 償いのささげ物
  alternative: 罪過のささげ物
  rationale: אָשָׁםは罪責と、それに伴う賠償・償いの双方を含みうる。本節では実際の返済と五分の一の加算が明記されるため「償い」を本文に採用したが、罪責の側面を排除しないよう別訳を脚注に示した。
- issue: כפרの訳語
  choice: 贖いを行う
  alternative: 罪を償う／宥めを行う
  rationale: 祭司がいけにえによって行う祭儀的行為を表しつつ、その作用を特定の贖罪理論に限定しない表現を選んだ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。律法文の義務は「なければならない」で明示し、祭儀用語は一般読者にも追いやすい「祭司」「贖い」「ささげ物」を用いた。曖昧な原語表現とאָשָׁםの意味幅は本文で一方に固定しすぎず、脚注で保持した。
