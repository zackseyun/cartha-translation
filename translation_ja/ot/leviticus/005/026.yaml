  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: ja
  text: 祭司はその人のためにヤハウェの前で贖いを行う。こうして、その人が行って罪責を負うに至ったすべての事柄のいずれについても、その人は赦される。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: 祭司はその人のために…贖いを行う
  rationale: כפר のピエル形は祭儀の文脈で贖いを成し遂げることを表し、על はその対象となる人を示す。「贖いを行う」は祭儀的意味を保ちつつ、特定の贖罪理論に限定しない。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の臨在・御前の意味を「前で」で表し、神名 יהוה は固有名として「ヤハウェ」とした。
- source_word: וְנִסְלַח לוֹ
  choice: 彼は赦される
  rationale: סלח のニファル形が示す受動的・結果的な赦しを自然な日本語で表す。赦す主体は文脈上神だが、原文同様に明示しない。
- source_word: עַל אַחַת מִכֹּל
  choice: どの事についても
  rationale: 全体に属する個々の事例のいずれにも当てはまるという配分的な意味を、自然な日本語で表した。
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: その人が行って罪責を負うに至った
  rationale: 直訳的には「彼がそれによって罪責を負うために行うもの」。行為と、その結果として生じる罪責との関係を明確にし、ここでの אשמה を供え物ではなく罪責として訳した。
theological_decisions:
- issue: 神名 יהוה の訳出
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の四文字神名を称号に置き換えず、固有の契約名として音写した。
- issue: 贖いと赦しの関係
  choice: 祭司が贖いを行い、その人は赦される
  alternative: 祭司がその人の罪を赦す
  rationale: 原文は祭司を贖いの祭儀的行為の主体とする一方、赦しの主体を明示しない。祭司自身が赦すとの解釈を避け、この区別を保った。
translation_notes:
  register: 現代標準日本語による、簡潔で格調を保った文体。「罪責」は日常語よりやや専門的だが、単なる感情としての罪悪感ではなく、違反によって負う客観的な責任を示すため採用した。
