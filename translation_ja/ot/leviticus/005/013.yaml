reference: Leviticus 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: ja
  text: こうして祭司は、彼がこれらのいずれかについて犯した罪のために、その人のために贖いを行う。彼は赦される[a]。そのささげ物は、穀物のささげ物と同様に、祭司のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼に赦しが与えられる」。ヘブライ語は受動形で、赦す方を明示していない。
    reason: 受動構文と赦しの行為者が明示されない点を、自然な日本語で示すため。
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: 祭司は……彼のために贖いをする
  rationale: 祭司の祭儀行為を表す כפר と עַל の組み合わせを、レビ記で確立した宗教的意味を保ちつつ、現代日本語で明瞭に表した。「贖い」は特定の贖罪理論に限定せず、儀礼によって罪への対処がなされることを示す。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 彼が……犯した罪のために
  rationale: חַטָּאת は「罪」と「罪のきよめのささげ物」の両義を持つが、直後の「犯した」が指すのは行為としての罪なので、ここでは「罪」とした。
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: これらのうちのどれかについて
  rationale: 前に列挙された事例の一つを指す部分表現を、過度に具体化せず自然な日本語にした。
- source_word: וְנִסְלַח לוֹ
  choice: 彼は赦される
  rationale: סלח のニファル形による受動表現を保ち、赦す主体を本文に補わなかった。
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: それは……祭司のものとなる
  rationale: 文脈上のささげ物を受ける女性単数形を「それ」で示し、祭司に帰属することを明確にした。
- source_word: כַּמִּנְחָה
  choice: 穀物のささげ物と同じように
  rationale: レビ記の祭儀規定における מִנְחָה の通常の意味を採用し、比較を自然な日本語で示した。
theological_decisions:
- issue: 赦しの定型句における行為者の明示
  choice: 彼は赦される
  alternative: その罪は彼のために赦される
  rationale: ヘブライ語は受動形で、赦す方を明示しない。自然な日本語を用いながら、その神学的な抑制を保った。
- issue: חַטָּאת の意味
  choice: 罪
  alternative: 罪のきよめのささげ物
  rationale: 同語は供え物を指す場合もあるが、「彼が犯した」という関係節によって、ここでは犯された罪を指すと判断した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「贖いをする」「穀物のささげ物」はレビ記の祭儀用語として一貫して用いられる表現を選び、原文の反復と受動表現を可能な限り保持した。
