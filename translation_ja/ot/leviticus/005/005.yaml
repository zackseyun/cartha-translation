  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: ja
  text: これらのうちの一つについて罪責を負ったとき[a]、そのことに関して犯した罪を告白しなければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪責を負った」は、「有罪となった」「責任を負った」とも訳せる。ヘブライ語は、単に心の中で罪に気づくことより、罪による責任を負うことに重点がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「そのことに関して自分が罪を犯したことを告白する」。ここで「そのこと」は、直前までに挙げられた事例の一つを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …とき
  rationale: 律法上の条件・状況を導く定型表現。日本語では「そして、…ということになる」と逐語的にせず、「…とき」として法文の流れを自然に示した。
- source_word: יֶאְשַׁם
  choice: 罪責を負った
  rationale: 単なる罪の自覚ではなく、違反によって法的・祭儀的な責任を負うことを表すため、「罪に気づいた」ではなく「罪責を負った」とした。
- source_word: לְאַחַת מֵאֵלֶּה
  choice: これらのうちの一つについて
  rationale: 直前に列挙された事例のいずれか一つを指すことを明確にしつつ、原文の指示性を保った。
- source_word: וְהִתְוַדָּה
  choice: 告白しなければならない
  rationale: ヒトパエル形の「告白する」を、律法上の義務を示す現代日本語として表現した。
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: そのことに関して犯した罪
  rationale: 関係節と女性単数接尾辞が、先に述べた一つの事例を受けていることを示す。「何を罪として犯したか」という告白の内容を自然な日本語で表した。
