source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: ja
  text: または、人の汚れ[a]、すなわち、人がそれによって汚れるあらゆる汚れに触れ、そのことに気づかずにいて[b]、後でそれを知ったなら、その人は罪責を負う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「汚れ」は、祭儀上の汚れを指す。「人の不浄」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「それが彼から隠されていて」。つまり、その時には本人が気づいていなかったということ。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: 触れ
  rationale: 前置詞בを伴うנגעは物理的接触を表すため、簡潔で直接的な「触れ」とした。
- source_word: טֻמְאַת אָדָם
  choice: 人の汚れ
  rationale: טֻמְאָהはこの祭儀法の文脈で儀礼上の汚れを指し、אָדָםは性別を限定しない人間一般、または人に由来する汚れを表す。「人の汚れ」は原文の属格的表現と曖昧さを保つ。
- source_word: לְכֹל טֻמְאָתוֹ
  choice: どのような汚れにでも
  rationale: 人に関わるあらゆる種類の汚れへ範囲を広げる表現として、自然な日本語にした。
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: それによって人が汚れる
  rationale: 関係節はその汚れがもたらす結果を説明する。主語を一般化した「人が」により、ヘブライ語の文脈上の一般的な効力を自然に示した。
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: そのことに気づかずにいて
  rationale: 直訳は「それが彼から隠されていて」だが、ここでは接触時に本人の認識から隠れていたことを意味する。日本語として明瞭にしつつ脚注で原文の受動的比喩を示す。
- source_word: וְהוּא יָדַע
  choice: 後でそれを知ったなら
  rationale: 先の無認識との対比から、その後に知るという時間的推移を「後で」で明示した。
- source_word: וְאָשֵׁם
  choice: 罪責を負う
  rationale: אשםはこの法的・祭儀的文脈で、単なる感情としての罪悪感ではなく、罪責または責任を負うことを表す。
theological_decisions:
- issue: レビ記のטֻמְאָהの性質
  choice: 「汚れ」と訳し、儀礼上のカテゴリーとして読む
  alternative: 「不浄」「罪深さ」
  rationale: 接触によって生じる儀礼的な汚れが主題であり、それ自体を道徳的な罪深さと同一視しない。「汚れ」は本文の祭儀的・法的意味を保ち、脚注で明確にする。
- issue: אָדָםの範囲
  choice: 性別を限定しない「人」
  alternative: 「男」「人間」
  rationale: ここでאָדָםは男性に限定されず、人に由来する汚れを一般的に表すため、「人」が正確で自然である。
- issue: וְאָשֵׁםの法的含意
  choice: 「罪責を負う」
  alternative: 「罪となる」「有罪である」
  rationale: この語は違反によって生じる祭儀法上の責任を表す。「罪責を負う」はその司法的な力を保ち、接触による汚れそのものを安易に道徳化しない。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法文調。「汚れ」を維持してレビ記の術語的一貫性を確保し、「罪責を負う」で結語の法的重みを表した。
