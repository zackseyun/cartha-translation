source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: ja
  text: その人は、自分の罪過のささげ物[a]として、あなたの評価に従い、群れの中から傷のない雄羊を、ヤハウェにささげるため祭司のもとへ携えて来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪過のささげ物」と訳したヘブライ語は、「罪責」や「償い」を指すこともある。
    reason: אָשָׁםは罪責・償いと、そのための特定の供え物の双方を表し得るため。
lexical_decisions:
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: 自分の罪過のささげ物／罪過のささげ物として
  rationale: אָשָׁםは罪責や償いと、それに対応する特定の供え物の双方を表し得る。この文脈では雄羊という祭儀上の供え物が明示されるため、「罪過のささげ物」とし、同じ語が二度用いられる原文の反復も保った。語の広がりは脚注で示した。
- source_word: יָבִיא
  choice: 携えて来なければならない／携えて来る
  rationale: 法規におけるヒフィル未完了形の義務的な力を、現代日本語として明確に表した。後半は前半の内容を具体化する説明として自然に続けた。
- source_word: לַיהוָה
  choice: ヤハウェのもとに
  rationale: 神名יהוהを固有名として音写し、方向を表す前置詞לְを「もとに」で表した。
- source_word: אַיִל תָּמִים מִן הַצֹּאן
  choice: 群れの中の傷のない雄羊
  rationale: אַיִלを「雄羊」、תָּמִיםを祭儀上の欠陥がないことを示す「傷のない」、צֹאןを羊や山羊から成る小家畜の「群れ」と訳した。雄羊と明示されているため、動物種は曖昧にならない。
- source_word: בְּעֶרְכְּךָ
  choice: あなたの評価額に相当する
  rationale: 二人称単数接尾辞を省かず、「あなたの」を残した。עֵרֶךְの法的・金銭的な評価の含みを「評価額」で示した。
- source_word: אֶל הַכֹּהֵן
  choice: 祭司のもとに
  rationale: 供え物を執行者である祭司へ持参する方向を、自然な日本語で表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に記された契約の神名を称号に置き換えず、現代日本語で一般的な音写によって示した。
- issue: אָשָׁםが一節に二度現れること
  choice: 両方を「罪過のささげ物」と訳し、第一の用例の意味の広がりを脚注で示す
  alternative: 第一を「償い」、第二を「罪過のささげ物」と訳し分ける
  rationale: 二つの用例には償いと祭儀的供え物の重なりがあるが、同じヘブライ語の反復を本文で保つことを優先した。罪責・償いという含みを脚注で明示し、意味を一義的に限定しないようにした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。法的義務は「なければならない」で示し、原文の同格的な構文は「すなわち」で展開して読みやすくした。祭儀用語は専門性を保ちつつ、「いけにえ」より広い語である「ささげ物」を用いた。
