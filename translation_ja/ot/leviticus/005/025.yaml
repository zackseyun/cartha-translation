  naturalness: 「ヤハウェにささげるため、祭司のもとへ携えて来なければならない」と一文に整理すれば、二つの方向句を不自然に並べず、現代日本語としても明瞭になる。「すなわち」による重複した再叙述は不要である。
  terminology: 「罪過のささげ物」はאָשָׁםの祭儀的用法を適切に表し、二度の反復も維持できる。神名は方針どおり「ヤハウェ」とする。「傷のない雄羊」「祭司」も適切である。
