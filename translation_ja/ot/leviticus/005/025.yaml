revisions:
- from: またその人は、自分の罪過のささげ物[a]をヤハウェのもとに携えて来なければならない。すなわち、あなたの評価額に相当する、群れの中の傷のない雄羊を、罪過のささげ物として祭司のもとに携えて来る。
  to: その人は、自分の罪過のささげ物[a]として、あなたの評価に従い、群れの中から傷のない雄羊を、ヤハウェにささげるため祭司のもとへ携えて来なければならない。
