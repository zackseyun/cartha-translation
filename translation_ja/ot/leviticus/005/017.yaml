source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: ja
  text: また、もし人が罪を犯し、ヤハウェがしてはならないと命じた事柄のどれか一つを行ったなら、それを知らなかったとしても、その人は有罪となり[a]、自分の咎を負うことになる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「罪責を負い」「罪責を負う者となり」。このヘブライ語は、違反の結果として罪責を負うことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: または「自分の罪責を負う」。ヘブライ語の「咎を負う」は、違反に伴う責任や結果を担うことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: この祭司法的文脈では、非物質的な「魂」ではなく、一人の人を指す慣用的用法である。
- source_word: תֶחֱטָא
  choice: 罪を犯し
  rationale: 祭司法における חטא の直接的な意味を、自然な現代日本語で表した。
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: どれか一つを行った
  rationale: 禁じられた事柄の中から一つを行うという分配的な意味を明確にした。
- source_word: מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: ヤハウェの戒めでしてはならないとされていること
  rationale: 神の戒めが禁じる行為という法的な力を、過度に逐語的にならない日本語で示した。
- source_word: וְלֹא יָדַע
  choice: それを知らなかったとしても
  rationale: 何を知らなかったのかを本文以上に限定せず、無知の状態でも責任が生じるという譲歩的関係を示した。
- source_word: וְאָשֵׁם
  choice: 罪責を負い
  rationale: אָשֵׁם が表す、有罪であること、または違反によって責任を負うことの双方を簡潔に表現した。
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: 自分の咎を負うことになる
  rationale: 「咎を負う」というヘブライ語の重い法的・契約的慣用句を保ちつつ、結果として責任や処罰を担う意味を自然に示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の契約名を明示し、一般名詞的な称号に置き換えなかった。
- issue: 知らずに犯した罪と責任の関係
  choice: 知らなかったとしても、その人は罪責を負う
  alternative: 知らなかったので罪責が軽減される
  rationale: 本文は無知を述べながらも罪責が生じると明言しているため、その緊張を解消せずに保った。
- issue: וְנָשָׂא עֲוֺנוֹ の意味範囲
  choice: 自分の咎を負うことになる
  alternative: 自分の罪の罰を受ける
  rationale: 原文の慣用句は罪責・責任・結果を含み得るため、「罰」に限定せず、原文の幅を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭司法にふさわしい厳粛さを保った。「罪責」と「咎」を使い分け、אָשֵׁם と עָוֺן の重なりつつ異なる法的ニュアンスを反映した。
