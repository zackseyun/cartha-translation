  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: ja
  text: 祭司は、罪のためのささげ物[a]の血の一部を祭壇の側面に振りかけ、残りの血を祭壇の土台に絞り出す。これは罪のためのささげ物である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのささげ物」とも訳せる。ヘブライ語の語は、罪に関わるささげ物を指すとともに、その清めの機能を強調する場合がある。本文で二度用いられる語。
    reason: חַטָּאת の祭儀上の浄化機能という有力な語義上のニュアンスを示しつつ、本文では罪との関係を表す基本訳を用いるため。
lexical_decisions:
- source_word: וְהִזָּה
  choice: 振りかけ
  rationale: נזה のヒフィル形は、祭儀において血を振りかけて付着させる行為を表す。現代日本語として自然で、儀礼的動作も明確な「振りかけ」を採用した。
- source_word: מִדַּם
  choice: 血の一部
  rationale: 前置詞 מִן はここでは部分を表し、この段階で血の全量ではなく、その一部を用いることを明示する。
- source_word: הַחַטָּאת
  choice: 罪のきよめのささげ物
  rationale: חַטָּאת は罪に関わる供え物を指すと同時に、その浄化機能を含意し得る。「罪のきよめのささげ物」は両面を簡潔に保ち、単なる罪そのものとの混同も避ける。
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: 祭壇の側面に
  rationale: קִיר の字義は「壁」だが、祭壇については日本語の「側面」が具体的な表面を自然に示す。
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: 残りの血
  rationale: שׁאר のニファル分詞が示す「残っているもの」を、簡潔で自然な日本語にした。
- source_word: יִמָּצֶה
  choice: 絞り出す
  rationale: מצה のニファル形は、鳥の犠牲から残った血を押し絞って出す動作を表す。単なる「注ぐ」より原文の具体的な動作を保つ。ヘブライ語の受動形は、日本語では祭司を暗黙の動作主とする能動表現が自然である。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 祭壇の土台のところで
  rationale: יְסוֹד は祭壇の基部・土台を指す。血を絞り出す位置を自然な日本語で示すため「土台のところで」とした。
- source_word: חַטָּאת הוּא
  choice: これは罪のきよめのささげ物である
  rationale: 犠牲を祭儀上の種類として明示する同定文であり、前半と用語を統一した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳し方
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪のささげ物
  rationale: חַטָּאת には罪との関係と、儀礼上の浄化という機能の双方がある。本文では両方を可視化する複合表現を採用し、より伝統的で短い訳語を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい端正な文体とした。「祭司は」を補って動作主を前節の文脈から明示し、受動形の逐語訳による不自然さを避けた。
