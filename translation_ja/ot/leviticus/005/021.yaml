source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: ja
  text: 人が罪を犯し、ヤハウェに対して背信を行い、預かり物、手に託された物[a]、または強奪に関して仲間に偽りを言い、あるいは仲間を搾取したなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「担保」「手に置かれた物」。このヘブライ語表現の意味には幅がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 祭儀・法規定における個々の当事者を指すため、現代日本語で自然な「人」とした。
- source_word: כִּי תֶחֱטָא
  choice: 罪を犯し…したなら
  rationale: כִּיと未完了形が導く事例法上の条件を、日本語の条件表現「なら」で示した。
- source_word: וּמָעֲלָה מַעַל
  choice: 不実な行いをし
  rationale: 同根語を重ねた表現が示す背信・不忠実の意味を、過度に専門用語化せずに表した。
- source_word: בַּיהוָה
  choice: ヤハウェに対して
  rationale: 神名יהוהを「ヤハウェ」と音写し、前置詞בの敵対的・関係的な向きを「に対して」で明示した。
- source_word: וְכִחֵשׁ
  choice: 欺いたり
  rationale: 否認、偽り、欺きを含み得る語を、この財産法的文脈に合う広い表現で訳した。
- source_word: בַּעֲמִיתוֹ
  choice: 同胞
  rationale: 共同体に属する仲間を指すעָמִיתの社会的範囲を、「隣人」より法的文脈に明確な語で表した。
- source_word: בְּפִקָּדוֹן
  choice: 預かり物
  rationale: 保管を委ねられた財物を指す語として、一般読者に明瞭な表現を選んだ。
- source_word: בִתְשׂוּמֶת יָד
  choice: 手に託された物
  rationale: 直訳的には「手に置かれた物」で、委託物・担保・貸付けなど解釈に幅があるため、曖昧さを比較的保つ表現とした。
- source_word: בְגָזֵל
  choice: 奪い取った物
  rationale: 強奪という行為だけでなく、その対象となる財物も示し得るため、列挙される物件と自然につながる形にした。
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: 同胞を搾取したり
  rationale: 圧迫、ゆすり、不当な取り立てや留保を含み得る経済的加害の広さを保った。
theological_decisions:
- issue: 同胞への財産上の不正が神への背信でもあることをどう表すか
  choice: ヤハウェに対して不実な行いをし
  alternative: ヤハウェに関して不実な行いをし
  rationale: ヘブライ語は対人上の欺きや搾取をיהוהへのמעלとして明示するため、その垂直的関係を「に対して」で保持した。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 固有名としての機能を保つため音写した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、法規定としての品位を保った。原文が次節へ続く条件節なので、文末は「なら、」として継続させた。
