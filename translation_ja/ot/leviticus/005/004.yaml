source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: ja
  text: また、ある人が、悪いことをするにせよ良いことをするにせよ、人が誓って口にするどのようなことについても、軽率に[a]口にして誓い、それがその人には分からず、後になってそれを知り、これらのうち一つについて罪責を負うなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軽率に口にして」は、別訳「口に出して」。ヘブライ語の表現は、言葉として発すること自体を強調し得るが、文脈上は不用意な誓いを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ある人
  rationale: 律法上の個人を表す語であり、日本語では「ある人」が自然である。
- source_word: תִשָּׁבַע
  choice: 誓う
  rationale: ニファル形はここで誓約を立てることを表す。
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: 軽率に唇で
  rationale: בטאの基本的な「口に出す」という意味と、文脈上の不用意な誓いという含みをともに保った。「軽率に」は文脈的解釈であるため脚注で別訳を示す。
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: 悪いことをするにせよ良いことをするにせよ
  rationale: 誓いの内容を両極によって包括的に示す原文を保持する。
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: 誓いによって人が口にするどのようなことであれ
  rationale: 特定の善悪の行為に限らず、誓いとして発した事柄全般を指す一般化を保つ。日本語の「人」は性別を限定せず、הָאָדָםの総称的用法に適する。
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: それがその人には分からず
  rationale: 直訳的な「彼から隠され」を自然な日本語にしつつ、当人が認識していない状態を表した。何が認識されていないかは原文同様、完全には限定しない。
- source_word: וְהוּא יָדַע
  choice: 後になってそれを知り
  rationale: 先の無自覚との時間的な推移を明示する。
- source_word: וְאָשֵׁם
  choice: 罪責を負う
  rationale: 単なる感情的な罪悪感ではなく、律法上の有責性を表す。
- source_word: לְאַחַת מֵאֵלֶּה
  choice: これらのうち一つについて
  rationale: 直前までに列挙された事例のいずれかを指す表現として訳した。
theological_decisions:
- issue: 誓いを認識していなかったことと罪責の関係
  choice: 「それ」が何を指すかを限定せず、無自覚から認識、罪責へ至る原文の流れを保つ
  alternative: 誓いを破ったことに気づかなかった、と明示する
  rationale: 原文は、誓いそのもの、その意味合い、または違反の事実のどれが隠されていたのかを明示しないため、解釈を本文に織り込まない。
- issue: הָאָדָםの総称的表現
  choice: 「人」
  alternative: 「男」
  rationale: ここでは男女を問わない代表的・総称的な人間を指す。日本語の「人」は原文の一般性を自然に伝える。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある律法文の文体とした。前後の条件文が次節へ続くため、末尾を「なら、」として継続を示した。
