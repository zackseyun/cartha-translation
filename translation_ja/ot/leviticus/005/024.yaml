source:
  edition: WLC
  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: ja
  text: また、偽りの誓いを立てた事柄が何であっても、それを元の額どおりに返し、それに五分の一を加えなければならない。自分の罪責の日に[a]、それを本来の持ち主に渡さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の罪過の日に」。ヘブライ語は「罪責／罪過」を指すが、祭儀的な文脈では「自分の罪過のいけにえの日に」と理解することもできる。
    reason: אַשְׁמָתוֹが罪責そのものを指す読みと、罪過のいけにえに関係づける読みの両方を示し、本文にない「明らかになった」という補足を避けるため。
lexical_decisions:
- source_word: אוֹ מִכֹּל אֲשֶׁר
  choice: また、……どのような物についても
  rationale: 前節から続く選択肢を示す אוֹ を、日本語の法文として自然な「また」でつなぎ、מִכֹּל אֲשֶׁר の包括的な範囲を「どのような物についても」で表した。
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: 偽って誓った
  rationale: 対象について偽りの誓いを立てることを、簡潔で自然な現代日本語にした。
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: 元の額を全額返し
  rationale: 直訳的には「その元本で償う」。法的慣用句として、損害分の元本を欠けなく返還する意味を明確にした。
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: それに五分の一を加え
  rationale: 返還額に二十パーセントを上乗せする規定を、原文の分数表現に沿って訳した。
- source_word: לַאֲשֶׁר הוּא לוֹ
  choice: 本来の持ち主に
  rationale: 直訳は「それがその人のものである者に」。正当な所有者への返還という法的意味を自然に表した。
- source_word: יִתְּנֶנּוּ
  choice: それを……渡さなければならない
  rationale: נתן の基本義「与える」を保ちつつ、返還物を所有者へ引き渡す文脈に合わせた。
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: 自分の罪過が明らかになった日に
  rationale: אַשְׁמָה はここではまず「罪過・有責」を表すと判断した。「明らかになった」は、法的責任が確定して償いを行う時点を自然な日本語で示すが、祭儀的な読みの可能性は脚注に残した。
theological_decisions:
- issue: בְּיוֹם אַשְׁמָתוֹ の解釈
  choice: 自分の罪過が明らかになった日に
  alternative: 罪過のいけにえを献げる日に
  rationale: 語形 אַשְׁמָתוֹ は直接には「彼の罪過／有責」を指しうるため、本文では罪責が認められる時点として訳した。一方、直後に罪過のいけにえが規定される祭儀的文脈から、その奉献の日を指すと解する余地もあるので、脚注で示して曖昧さを保持した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調ある法規文の調子とした。「弁償」だけでは所有者への返還が曖昧になるため「返す」「渡す」を用い、義務表現は「なければならない」で統一した。
