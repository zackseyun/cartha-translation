base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: ja
  text: その人は二羽を祭司のもとへ持って行く。祭司は、まず罪のためのささげ物[a]として一羽をささげ、その頭を首のあたりで[b]ひねる[c]。ただし、頭を切り離してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのささげ物」とも訳せる。ヘブライ語の語は、罪および清めに関わる祭儀上のささげ物を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は直訳すると「その首（うなじ）の向かい側から」とも読める。首のどの側を指すかについては解釈が分かれる。
    reason: textual_ambiguity
  - marker: c
    text: 鳥の犠牲を扱う際の祭儀上の特殊な動作。続く規定により、頭は完全には切り離さない。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: その人は二羽を祭司のもとへ持って行く
  rationale: אֹתָם は前節の二羽を指すため、「それら」ではなく自然な日本語で「二羽」と明示した。文脈上、持参する者と儀式を行う祭司を区別した。
- source_word: וְהִקְרִיב
  choice: 祭司は……ささげ
  rationale: ヒフィル形の祭儀用語で、「近づける」よりも日本語の犠牲祭儀の文脈に自然な「ささげる」とした。直前の「持って行く」とは区別される。
- source_word: חַטָּאת
  choice: 罪のきよめのささげ物
  rationale: 罪に関わる供え物であることと、レビ記における清めの機能の双方を簡潔に表した。「罪のためのいけにえ」「清めのささげ物」も可能である。
- source_word: וּמָלַק
  choice: ひねる
  rationale: 鳥の犠牲を扱う際の祭儀的な動作を表す特殊な語。完全に切り離すことは後半で否定されるため、「ひねり切る」は避けた。
- source_word: מִמּוּל עָרְפּוֹ
  choice: うなじの側で
  rationale: מול と ערף の組み合わせは位置関係の解釈が難しい。「うなじの側で」として身体部位を保ちつつ、前面か背面かを本文で過度に断定しないようにした。
- source_word: וְלֹא יַבְדִּיל
  choice: ただし、頭を切り離してはならない
  rationale: בדל の「分ける、切り離す」という意味を、この儀式では頭を胴から完全に離さないという具体的な指示として自然に表した。
theological_decisions:
- issue: חַטָּאת の祭儀上の名称
  choice: 罪のきよめのささげ物
  alternative: 罪のためのいけにえ／清めのささげ物
  rationale: 「罪」と「清め」のどちらか一方に意味を限定せず、レビ記の文脈にある両面を保った。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で厳かな法文調とした。「その人」と「祭司」を明示して動作主体の移行を分かりやすくし、原文の難しい身体位置の表現は注で曖昧さを保った。
