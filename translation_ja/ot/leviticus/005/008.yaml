  to: その人は二羽を祭司のもとへ持って行く。祭司は、まず罪のためのささげ物[a]として一羽をささげ、その頭を首のあたりで[b]ひねる[c]。ただし、頭を切り離してはならない。
  rationale: 本文の祭儀名称を自然で広く理解可能な「罪のためのささげ物」に整え、清めを重視する語義は注に保持した。難しい身体位置の句は、本文では不必要な断定を避け、注で原語の位置関係と解釈の幅を明示した。動作の順序、祭司が行為者であること、頭を完全に分離しないことは保持している。
