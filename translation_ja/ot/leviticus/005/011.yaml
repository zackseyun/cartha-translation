id: LEV.5.11
reference: Leviticus 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: ja
  text: しかし、もしその人に二羽の山鳩か二羽の若い鳩を用意するだけの資力がないなら[a]、犯した罪のためのささげ物として、上質な小麦粉一エファの十分の一を罪のためのささげ物として持って来なければならない。それに油を加えてはならず、乳香を添えてもならない。これは罪のためのささげ物だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その手が届かない」。必要なものを用意するだけの力や資力がないことを表すヘブライ語の慣用句。
    reason: 原文の比喩的表現と、その文脈上の経済的意味を示すため。
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: 用意する余裕がない
  rationale: 直訳は「その手が届かない」。ここでは規定された鳥を得る経済的な力がないことを表す慣用句なので、自然な日本語で意味を明示した。
- source_word: תֹרִים
  choice: 山鳩
  rationale: 祭儀規定におけるキジバト類を指す語として、一般に理解しやすい伝統的な訳語を採用した。
- source_word: בְנֵי יוֹנָה
  choice: 若い鳩
  rationale: 字義は「鳩の子ら」であり、年若い鳩を指す。種を過度に限定せず、原文の年齢の区別を保持した。
- source_word: קָרְבָּנוֹ
  choice: ささげ物
  rationale: 祭壇に近づけてささげる物全般を表し、この節では穀物も含むため、「いけにえ」より広い「ささげ物」とした。
- source_word: אֲשֶׁר חָטָא
  choice: 犯した罪のための
  rationale: 直訳的な構文を日本語として自然にし、そのささげ物が当該の罪に関わることを示した。
- source_word: עֲשִׂירִת הָאֵפָה
  choice: 一エファの十分の一
  rationale: 古代の計量単位を換算せず保持し、原文どおりの割合を示した。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 祭儀用の細かく精製された穀粉を指す。日本語で材質と品質が分かる表現とした。
- source_word: לְחַטָּאת / חַטָּאת
  choice: 罪のためのささげ物
  rationale: חַטָּאתは「罪」と、そのための祭儀的なささげ物の双方を表し得る。「罪のためのささげ物」は祭儀的意味を明らかにしつつ、語の両義性とのつながりも保つ。
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: それに油を加えてはならず
  rationale: 粉に油を載せる行為を、調製についての禁止として自然な日本語で表した。
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: 乳香を添えてもならない
  rationale: לְבֹנָהは祭儀に用いる香料樹脂の乳香。直前との反復を避けながら、同じく添加禁止であることを示した。
- source_word: כִּי חַטָּאת הִיא
  choice: これは罪のためのささげ物だからである
  rationale: 油と乳香を用いない理由を述べる節として、因果関係を明確にした。
theological_decisions:
- issue: 祭儀文脈におけるחַטָּאתの意味
  choice: 罪のためのささげ物
  alternative: 罪／罪祭
  rationale: 文脈上は持参される祭儀物を指すが、ヘブライ語では「罪」と「罪に関わるささげ物」が同じ語で結び付いている。「罪のためのささげ物」とすることで、後代の教義概念を持ち込まず祭儀的意味を示した。
- issue: 貧困を表す慣用句の訳し方
  choice: 二羽の鳥を用意する余裕がない
  alternative: その手が届かない／買うことができない
  rationale: これは貧しい者への段階的な代替規定である。経済的能力の不足を明瞭にしつつ、「買う」と限定して原文以上の取引状況を読み込まない表現とした。
translation_notes:
  register: 現代の一般読者に分かる、明瞭で品位ある法規文体とした。「持って来なければならない」「加えてはならない」により規定としての力を保った。חַטָּאתには一貫して「罪のためのささげ物」を用い、自然さと原語の意味的連関を両立させた。
