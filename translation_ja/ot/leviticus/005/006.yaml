id: LEV.5.6
reference: Leviticus 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: ja
  text: その人は、自分が犯した罪のために、償いの献げ物[a]をヤハウェに携えて来なければならない。すなわち、罪の献げ物として、羊または山羊の群れから、雌の子羊か雌山羊一頭を献げる。祭司はその人のために、その罪について贖いを行う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪責のための献げ物」または「償いのための献げ物」とも訳せる。ヘブライ語では罪責や償いに関係する語（אָשָׁם）が使われる一方、この節の後半では動物が「罪の献げ物」と指定されている。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その罪から」。罪からの解放や罪の除去という、贖いの結果を強調している可能性がある。「その罪のために」とも解釈できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 携えて来なければならない
  rationale: 祭儀法規における命令的・規定的な力を、現代日本語で明確に示す。
- source_word: אֲשָׁמוֹ
  choice: 償いの献げ物
  rationale: אשםが持つ罪責と償いの含意を保ちつつ、後続の「罪の献げ物」と同一化しない。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名יהוהを固有名として音写する。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 自分が犯した罪のため
  rationale: 同語根の反復を不自然に直訳せず、罪が献げ物の理由であることを明瞭に表す。
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: 羊か山羊の群れから雌一頭
  rationale: צאןが羊と山羊から成る小家畜の群れを指すことと、雌であるとの指定を明示する。
- source_word: כִשְׂבָּה אוֹ שְׂעִירַת עִזִּים
  choice: 雌の子羊か雌山羊
  rationale: 二つの選択肢と雌の指定を自然な日本語で保持する。
- source_word: לְחַטָּאת
  choice: 罪の献げ物として
  rationale: 祭儀用語としてのחטאתを示し、אשםとの語彙上の並置を残す。
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: 祭司はその人のため……贖いをする
  rationale: 祭司によるכפרの祭儀的働きを、特定の贖罪理論に狭めず表す。
- source_word: מֵחַטָּאתוֹ
  choice: その罪からの
  rationale: 前置詞מןの分離・除去の含みを保ち、「罪からの贖い」という原文の緊張を脚注とともに提示する。
theological_decisions:
- issue: 同じ節にאשםとחטאתが併用されること
  choice: 「償いの献げ物」と「罪の献げ物」を区別して残す
  alternative: 双方を一般的な「罪のための献げ物」にそろえる、またはחטאתを「清めの献げ物」とする
  rationale: 原文は二つの祭儀語を意図的に並置しているため、その緊張を平滑化しない。
- issue: מֵחַטָּאתוֹにおけるמןの解釈
  choice: 「その罪からの贖い」
  alternative: 「その罪のために贖いをする」
  rationale: מןが示し得る罪からの解放・除去という含みを本文に残し、関係・原因の解釈も脚注で示す。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有の神名として明示し、称号への置換を避ける。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、祭儀規定にふさわしい端正さを保った。「献げ物」で用語を統一しつつ、אשםとחטאתの区別は「償い」と「罪」によって可視化した。
