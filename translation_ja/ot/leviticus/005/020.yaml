  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/020.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の固有名を表す四文字語「YHWH」。古代の正確な発音は確定していないが、一般に「ヤハウェ」と推定される。伝統的に「主」と訳されることも多い。
    reason: 神名の原語表記、発音上の不確かさ、および伝統的な訳語を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 神の発言を導入する物語上の定型表現。日本語では、後続する לֵאמֹר と合わせて「こう告げた」とすることで、自然さを保ちながら発言が続くことを示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に称号ではなく神の固有名を表す四文字語があるため、その一般的な推定発音を音写した。発音上の不確かさは脚注で明示する。
- source_word: אֶל
  choice: に
  rationale: 発言の相手を示す前置詞なので、自然な現代日本語の助詞「に」とした。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している聖書人名の表記を用いた。
- source_word: לֵאמֹר
  choice: こう
  rationale: 直訳的な「言って」は日本語では重複して不自然になるため、「こう告げた」として、後続の直接話法を導く機能を表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は「主」という称号ではなく四文字の神名を記している。その区別を本文で保つため「ヤハウェ」とした。ただし古代の正確な発音は確定していないため、脚注でその点を示した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「語って言った」というヘブライ語の形式的な重複は避け、「こう告げた」で発言導入の機能を自然に表現した。
