base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: ja
  text: その人が罪を犯して罪責を負うときは[a]、強奪した物、不当に取り上げた物[b]、保管を任された物、あるいは見つけた遺失物[c]を返さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を犯して罪責を負ったなら」とも訳せる。ヘブライ語の事例法の定型表現は、「とき」と「なら」のどちらでも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「圧迫して得た物」「不正に得た物」または「だまし取った物」とも訳せる。このヘブライ語は、圧迫、搾取、不正などによって他人の財産を得ることを広く表し得る。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「見つけた失われた物」。ここでは他人の遺失物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: その人が……なら
  rationale: ヘブライ語の事例法を導入する定型表現を、現代日本語の法的な条件文として自然に表した。「……とき」とも訳せるため、脚注でその可能性を示した。
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: 罪を犯して罪責を負った
  rationale: חטא の道徳的・契約的な意味を「罪を犯す」で明示し、אשם は単なる罪の自覚ではなく有罪・責任ある状態になることを「罪責を負う」と表した。
- source_word: וְהֵשִׁיב
  choice: 返さなければならない
  rationale: 財産返還を命じる法的文脈であるため、単なる未来ではなく義務を明確にした。
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: 強奪した物
  rationale: 同語根の名詞と動詞による反復を不自然に再現せず、不法に奪った対象を簡潔に示した。
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: 脅し取った物
  rationale: 圧迫や搾取によって他人の財産を得る意味を、財産法の列挙に適した自然な日本語で表した。語の幅は脚注で保持した。
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: 預かった物
  rationale: 他人から保管を任された財物を指すので、簡潔で一般に理解しやすい表現とした。
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: 拾った遺失物
  rationale: 見つけた他人の紛失物という法的意味を、明確かつ簡潔に表した。
theological_decisions:
- issue: וְאָשֵׁם が客観的な罪責か主観的な罪の自覚か
  choice: 罪責を負った
  alternative: 自分の罪に気づいた
  rationale: この動詞は罪責を負う、または有罪となることを表し得る。文脈上、返還義務の根拠となる客観的責任を本文に置き、主観的認識に限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法の規定としての格調と義務性を保った。財産の種類を並列し、原文の法的な列挙構造を維持した。
