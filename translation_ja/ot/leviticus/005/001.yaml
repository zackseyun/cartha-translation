id: LEV.5.1
reference: Leviticus 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: ja
  text: 人が罪を犯す場合、すなわち、証言を求める誓いの呼びかけ[a]を聞き、その事について見た、または知っている証人でありながら、それを告げないなら、その人は自分の咎を負う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「誓いの声」。事情を知る者に証言するよう求める、厳粛な誓いの呼びかけを指す。
    reason: lexical_alternative
  - marker: b
    text: 「自分の罪責を負う」とも訳せる。告げるべき証言を差し控えた責任を負うという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 律法の事例規定では個々の人を指すため、存在論的な含みを持ちうる「魂」ではなく、現代日本語で自然な「人」とした。
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: 誓いをもって証言を求める声を聞き
  rationale: 字義的には「誓いの声を聞く」だが、ここでは証人に証言を促す厳粛な誓約・呪誓の呼びかけを指す。「声」を残しつつ、法的な機能が伝わるようにした。
- source_word: וְהוּא עֵד
  choice: その件の証人である
  rationale: 当人が問題の事実について証言できる立場にあることを明確に表した。
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: 見たことでも知ったことでも
  rationale: 目撃による知識と、それ以外の仕方で得た知識の双方を含む並列表現として訳した。
- source_word: אִם לֹא יַגִּיד
  choice: それを告げないなら
  rationale: נגד のヒフィル形は「知らせる、申し述べる」を意味する。法的文脈を保ちながら、正式な法廷証言だけに狭めない表現とした。
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: 自分の咎を負う
  rationale: 罪責とそれに伴う責任を担うというヘブライ語の慣用句を、簡潔で重みのある日本語で保持した。
theological_decisions:
- issue: 罪を犯すことと、証言要請を聞くこととの構文上の関係
  choice: 「すなわち」を用い、後続部分が罪の具体的事例を説明する形にした
  alternative: 「人が罪を犯し、誓いの声を聞き」と単純に並列する
  rationale: この規定が問題としている罪は、証言を求められ、証人でありながら事実を告げないことである。接続詞の連続を不自然に因果関係へ固定せず、事例規定としてのまとまりを示した。
- issue: 法規定における性別表現
  choice: 性別を示さない「人」「その人」を用いた
  alternative: 男性を表す代名詞を用いる
  rationale: נֶפֶשׁ はここで性別を限定せず「人」を指す。日本語では文法的性を再現する必要がないため、原文の適用範囲を自然に表した。
- issue: 「咎を負う」の意味範囲
  choice: 罪責とその結果の双方を含みうる慣用表現のまま訳した
  alternative: 「罰を受ける」と結果だけを明示する
  rationale: עָוֹן は文脈により咎、罪責、その帰結を含みうるため、「罰」に限定せず原文の神学的・法的な幅を保った。
translation_notes:
  register: 現代の一般読者に理解できる法規定の文体としつつ、「証人」「咎を負う」など原文の法的・宗教的な重みを伝える語を用いた。長い条件節は読点で整理し、過度に口語化しなかった。
