  source_fidelity: 概ね原文に忠実であり、「人」「告げない」「自分の咎を負う」は適切である。ただし、本文の「見たことでも知ったことでも、その件の証人である」は日本語として係り受けが不明瞭で、「見た／知っている」が証人である根拠・範囲を示す原文の関係が十分明確ではない。
  naturalness: 法規定としての文体は保たれているが、「見たことでも知ったことでも、その件の証人であるのに」は不自然で読みにくい。「その事について見た、または知っている証人でありながら」とすることで、現代標準日本語として明瞭になる。
  terminology: 「咎を負う」は עָוֹנוֹ を罪責・責任・結果を含みうる表現として保つ適切な訳語である。「誓いをもって証言を求める声」も趣旨を伝えるが、「誓いの呼びかけ」として句の構造を自然にし、注で字義と法的機能を示すのがよい。
