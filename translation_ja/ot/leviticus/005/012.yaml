id: LEV.5.12
reference: Leviticus 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: ja
  text: その人はそれを祭司のもとに携えて行く。祭司はその中から一つかみ、すなわち記念の分を取り、祭壇の上で、ヤハウェへの火によるささげ物[b]に加えて、それを焼いて煙にする。これは罪のためのいけにえ[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これは浄めのいけにえである」。ヘブライ語の語は、罪を扱う供え物を指すと同時に、その浄めの働きを表すことがある。
    reason: alternative_reading
  - marker: b
    text: 直訳「ヤハウェへの火によるささげ物の上に」。この文脈では、「ヤハウェへの火によるささげ物とともに」または「それらに加えて」と理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: その人はそれを……携えて行く
  rationale: ヒフィル形の「持って来る」を、前節の上等の小麦粉を指す目的語とともに自然な現代日本語で表した。接続詞は律法文の流れの中で明らかなため、機械的に「そして」を置かなかった。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀規定におけるכהןの標準的で明瞭な訳語。
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: 一つかみ……取る
  rationale: 穀物のささげ物から祭司が手で一定量を取る祭儀上の動作を、直訳的な「彼の手の満ちる量」ではなく分かりやすく表した。
- source_word: אֶת אַזְכָּרָתָהּ
  choice: すなわち記念の分
  rationale: אַזְכָּרָהは祭壇で焼かれる代表部分を指す祭儀用語。「記念」だけでなく、それが全体から取られる一部分であることを示した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 祭壇で供え物を焼き、煙として立ち上らせるקטרの祭儀的含意を保った。単なる処分としての「焼く」と受け取られにくい表現である。
- source_word: עַל אִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物の上で
  rationale: אִשֶּׁהを原文に即して「火によるささげ物」とし、עַלの基本的な空間関係も「上で」として保持した。文脈上「それらとともに／それらに加えて」の意味に理解する余地は脚注で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、日本語で一般的な音写によって固有名として表した。
- source_word: חַטָּאת הִוא
  choice: これは罪のためのいけにえである
  rationale: חַטָּאתがここでは供え物の分類を表すことを明確にしつつ、「罪」との語源的・概念的つながりを保った。浄めの機能を前面に出す別訳は脚注に残した。
theological_decisions:
- issue: 祭司文書の供犠規定におけるחַטָּאתの訳し方
  choice: 罪のためのいけにえ
  alternative: 浄めのいけにえ
  rationale: この語は罪に関わる供え物を指す一方、儀礼的な浄めの働きを強調して理解することもできる。本文では読者に広く理解される訳を採用し、重要な解釈上の幅を脚注で保持した。
- issue: עַל אִשֵּׁי יְהוָהが示す関係
  choice: ヤハウェへの火によるささげ物の上で
  alternative: ヤハウェへの火によるささげ物とともに／それらに加えて
  rationale: 前置詞עַלの像を本文に残しながら、既存の祭壇の火や他の供え物との併置を指す可能性を脚注で明示し、意味を一つに限定しなかった。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で荘重な律法文の文体とした。「焼いて煙にする」「記念の分」など、祭儀上の動作と専門概念は平易さを保ちながら明示した。神名は「ヤハウェ」と音写した。脚注[a]は内容上חַטָּאתに属するため、「祭司」ではなく「罪のためのいけにえ」に付した。
