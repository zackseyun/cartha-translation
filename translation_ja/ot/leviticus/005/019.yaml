id: LEV.5.19
reference: Leviticus 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אָשָׁ֖ם ה֑וּא אָשֹׁ֥ם אָשַׁ֖ם לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: ja
  text: これは償いのささげ物である[a]。その人は確かに主に対して罪責を負った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これは罪過のささげ物である」。ヘブライ語では、「償いのささげ物／罪責」と「罪責を負う」に同じ語根が三度使われ、強調されています。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: 償いのささげ物
  rationale: 祭儀の文脈で特定の犠牲を指す名詞。単なる「罪」ではなく、罪責に伴う償いの性格を示しつつ、現代日本語で理解しやすくした。
- source_word: הוּא
  choice: これは…である
  rationale: 代名詞が述語的に働き、直前に規定された犠牲を「償いのささげ物」と認定している。
- source_word: אָשֹׁם אָשַׁם
  choice: 確かに…罪責を負った
  rationale: 同根の不定詞絶対形と定動詞の組み合わせによる強調を「確かに」で表した。「罪責を負った」は、罪を犯した事実だけでなく、その結果として責任ある状態になったことを示す。
- source_word: לַיהוָה
  choice: 主に対して
  rationale: אשם と結びつく ל を、主との関係における罪責として訳した。「主のためのささげ物」と限定せず、動詞句に係る原文の自然な理解を保つ。
- source_word: יהוה
  choice: 主
  rationale: 神名YHWHを、日本語聖書で広く定着した敬虔な表記「主」で訳した。
theological_decisions:
- issue: לַיהוָה が示す罪責の関係
  choice: その人が主に対して罪責を負った
  alternative: ささげ物が主に属する／その人が主の御前で罪責を負った
  rationale: 語順上、לַיהוָה は強調された動詞 אָשֹׁם אָשַׁם と結びつきやすい。「に対して」は主との関係における責任を表すが、敵意や意図的反逆まで読み込まない。
- issue: 同根語反復の扱い
  choice: 「償いのささげ物」と「罪責を負った」で語義上の連関を保ち、強調を「確かに」で示す
  alternative: 同じ日本語の語根を機械的に反復する
  rationale: 原文は אשם を名詞と強調された動詞で三度用いる。自然な日本語を保ちながら、ささげ物と罪責との密接な関係を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「贖愆祭」のような専門的・古風な用語を避け、「償いのささげ物」とした。節末の区切り（פ）は訳文上の句点で表した。
