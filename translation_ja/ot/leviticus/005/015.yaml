  source_fidelity: 主要な語義は原文に忠実である。不注意による罪、ヤハウェの聖なるものとの関係、欠陥のない雄羊、査定および聖所のシェケルという要素を適切に保持している。ただし、「銀数シェケル」は現代日本語として不自然であり、原文の「銀のシェケルによる査定」という表現も十分明瞭に伝えていない。
  naturalness: 「それは、あなたの査定に従い、聖所のシェケルで銀数シェケルの価値があるものとし」は、指示語の受け先と文の係り方が不明瞭である。雄羊を直接「査定した」ものとして提示する構文に改めると、明瞭な現代標準日本語になる。
  terminology: 「ヤハウェ」「聖なるもの」「傷のない雄羊」「償いのささげ物」は一貫しており、文脈に適する。「償いのささげ物」はאָשָׁםの賠償的側面を自然に表している。脚注では伝統的な「罪過のささげ物」と、賠償面を示す代案を示す。
