revisions:
- from: ある人が不実な行いをし、過ってヤハウェの聖なるものに関して罪を犯したなら、その人は自分の償いのささげ物[a]として、群れの中から傷のない雄羊をヤハウェのもとに携えて来なければならない。それは、あなたの査定に従い、聖所のシェケル[b]で銀数シェケルの価値があるものとし、償いのささげ物とする。
  to: ある人が不実な行いをし、ヤハウェの聖なるものに関して過って罪を犯したなら、その人はヤハウェに、自分の償いのささげ物[a]として、あなたの査定に従い、聖所のシェケル[b]による銀のシェケルで評価した、群れの中の傷のない雄羊を携えて来なければならない。これは償いのささげ物である。
  rationale: 原文にない具体的な数量を示唆しうる「銀数シェケル」を改め、査定が聖所の標準シェケルによる銀で行われることを、原文の曖昧さを保って表した。また、雄羊、その査定、償いのささげ物としての性格の関係を明確にした。
