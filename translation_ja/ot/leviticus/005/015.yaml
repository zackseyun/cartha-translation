id: LEV.5.15
reference: Leviticus 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: ja
  text: ある人が不実な行いをし、ヤハウェの聖なるものに関して過って罪を犯したなら、その人はヤハウェに、自分の償いのささげ物[a]として、あなたの査定に従い、聖所のシェケル[b]による銀のシェケルで評価した、群れの中の傷のない雄羊を携えて来なければならない。これは償いのささげ物である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪過のささげ物」または「賠償のささげ物」とも訳せる。ヘブライ語のאָשָׁםは、罪によって生じた負い目と、それを償うためのささげ物の両方を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「聖所のシェケル」は、聖なる事柄の価額を定める際に用いられた基準重量を指す。
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ある人
  rationale: 律法文において個々の人を指す語であり、単数の法的主体を自然な現代日本語で表した。
- source_word: תִמְעֹל מַעַל
  choice: 不実な行いをし
  rationale: 動詞と同根名詞を重ねた表現で、聖なる義務への背信を表す。日本語では意味を明瞭にしつつ過度に限定しない表現とした。
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: 過って…罪を犯した
  rationale: 故意の反逆ではなく、不注意や無知による罪であることを示す。
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: ヤハウェの聖なるものに関して
  rationale: 奉献物や聖なる財物などが関わる罪を指すが、対象を原文以上に狭めず、前置詞の関係的な幅も保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、日本語で一般的な音写によって固有名として示した。
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: 自分の償いのささげ物／償いのささげ物
  rationale: אָשָׁםは負い目と、その償いに関わるいけにえの双方を表し得る。この箇所では聖なるものへの損失と価額査定が続くため、償いの側面を前面に出し、同じ語の反復も保った。
- source_word: אַיִל תָּמִים מִן הַצֹּאן
  choice: 群れの中から傷のない雄羊
  rationale: 犠牲動物として欠陥がないことと、雄羊であることを明確に表した。
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: あなたの査定に従い…銀数シェケルの価値があるもの
  rationale: 二人称単数の査定者への呼びかけを保った。原文には具体的な数字がないため、「数シェケル」として不特定複数を維持した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルで
  rationale: 聖所で用いられた基準重量による評価を簡潔に表した。
theological_decisions:
- issue: אָשָׁםという犠牲名称の訳
  choice: 償いのささげ物
  alternative: 罪過のささげ物／罪責のささげ物
  rationale: 罪責の意味を否定せず、この文脈で明白な賠償・回復の側面を現代の読者に伝えるため。「罪過のささげ物」という伝統的な代案は脚注に残した。
- issue: 法文における単数の主体
  choice: その人
  alternative: その者／彼
  rationale: 原文の単数性を保ちながら、性別を不必要に限定しない自然な日本語とした。
- issue: 聖なるものに対する罪の関係
  choice: 聖なるものに関して
  alternative: 聖なるものに対して／聖なるものの一部を損なって
  rationale: 原文の前置詞が示す関係を狭く断定せず、奉献物の不正使用など複数の可能性を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法文としての条件構文と義務表現を維持しつつ、「査定」「シェケル」など必要な制度語は簡潔な脚注で補った。
