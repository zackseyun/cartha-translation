base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/014.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 神がモーセに語りかける定型句として、現代日本語で自然かつ品位のある表現。後続する発言内容の導入にも適する。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される伝統的な表記を本文に用い、原文が神名四文字であることを脚注に明示する。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 前置詞 אֶל が語りかける相手を示すため、日本語では助詞「に」で自然に表す。固有名 מֹשֶׁה は慣用表記「モーセ」とする。
- source_word: לֵאמֹר
  choice: 告げた（発言導入として統合）
  rationale: 直訳的な「言って」では日本語として冗長になるため、וַיְדַבֵּר と合わせて「告げた」とし、次節に続く直接発言を自然に導入する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主[a]
  alternative: ヤハウェ／YHWH
  rationale: 本文の明瞭さと日本語での定着度を考慮して「主」としつつ、称号への置換によって原文の固有名が見えなくならないよう、脚注でヘブライ語が YHWH であり「ヤハウェ」とも表記されることを示す。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の定型的な発話導入を、日本語で不自然な重複を避けて一文にまとめた。
