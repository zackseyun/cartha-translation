source:
  edition: WLC
  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: ja
  text: または、落とし物を見つけ、それについて偽りを言い、偽って誓うなら――人が行って、それらによって罪を犯す、あらゆる事柄の一つについて――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: 落とし物
  rationale: 失われて持ち主から離れた物を指す語。現代日本語で自然かつ具体的な「落とし物」とした。
- source_word: וְכִחֶשׁ בָּהּ
  choice: そのことについて偽りを言い
  rationale: כחש はここでは発見した事実や物件について虚偽を述べること。「否認する」に限定しすぎず、前置詞 בּ の関係も表した。
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: 偽りの誓いをする
  rationale: 虚偽を伴う誓いという原文の意味を、簡潔で明瞭な日本語にした。
- source_word: הָאָדָם
  choice: 人
  rationale: この文脈では人間一般を指し、性別を特定する必要がないため「人」とした。
- source_word: לַחֲטֹא בָהֵנָּה
  choice: 行って罪を犯すことになる
  rationale: 前置詞 בּ を機械的に「それらによって」とせず、そのような行為をすることで罪を犯すという関係を自然に表した。
theological_decisions:
- issue: 罪を成立させる行為の一般化
  choice: 人が行って罪を犯すことになる、これらすべての事柄
  alternative: 人がそれらによって罪を犯す、すべての事柄
  rationale: 原文の包括的な表現と罪との関係を保ちつつ、日本語として誤解なく読める形にした。特定の教派的解釈は加えていない。
translation_notes:
  register: 律法本文にふさわしい端正さを保ちながら、現代の一般読者に明瞭な標準語を用いた。前後の節に続く未完の条件節であることを長いダッシュで示した。
