revisions:
- from: また、落とし物を見つけながら、そのことについて偽りを言い、偽りの誓いをするなら――人が行って罪を犯すことになる、これらすべての事柄のどれか一つについて――
  to: または、落とし物を見つけ、それについて偽りを言い、偽って誓うなら――人が行って、それらによって罪を犯す、あらゆる事柄の一つについて――
  rationale: 未完の条件節と列挙の構造は保持しつつ、不要な「ながら」を除き、末尾にある「それらによって」という罪との関係を訳文に戻した。
