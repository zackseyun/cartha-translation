base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: ja
  text: それから彼は穀物のささげ物を差し出し、その一部を手のひらいっぱいに取って、祭壇の上で焼いて煙にした。これは朝の全焼のささげ物に加えて行ったものである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 差し出し
  rationale: ヒフィル形の「近づける、差し出す」を祭儀の文脈に即して表す。「ささげた」だけでは後続する焼却まで含むようにも読めるため、供物を祭壇へ差し出す段階を示した。
- source_word: הַמִּנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀用語として、一般的な贈り物ではなく穀物を用いる所定のささげ物を指す。
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: その一部を手いっぱいに取り
  rationale: 直訳的な「それから彼の手を満たした」という身体的イメージを保ちつつ、供物の一部を手に取ったことが現代日本語で明瞭になるようにした。
- source_word: וַיַּקְטֵר
  choice: 焼いて煙にした
  rationale: 祭壇上で供物を焼き、煙として立ち上らせる祭儀的意味を表す。「焼いた」だけより原語の含意を示しつつ、過度な解釈を加えない。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇の上で
  rationale: 場所を示す前置詞句を自然な現代日本語で表した。
- source_word: מִלְּבַד
  choice: 加えて
  rationale: ここでは朝の全焼のささげ物とは別に、追加して行われたことを示す。
- source_word: עֹלַת הַבֹּקֶר
  choice: 朝の全焼のささげ物
  rationale: עֹלָהを、供物全体を焼く祭儀であることが分かる定訳的な表現で訳した。
