  naturalness: 現行文はおおむね明瞭だが、「その一部を手いっぱいに取り」はやや不自然である。また、末文の「これは…行ったものである」は説明調で、原文の簡潔な付加関係を少し弱める。
  terminology: 祭儀用語の選択と一貫性は良好である。「焼いて煙にした」はקטרの祭儀的な含意を適切に伝える。
