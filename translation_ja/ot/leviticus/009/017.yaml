  to: それから彼は穀物のささげ物を差し出し、その一部を手のひらいっぱいに取って、祭壇の上で焼いて煙にした。これは朝の全焼のささげ物に加えて行ったものである。
  rationale: 「手のひらいっぱいに取って」として、ヘブライ語のכַּף（手のひら）と「満たす」という成句を、過度な解釈を避けつつ自然な日本語で表した。脚注も同じ語彙に合わせて明確化した。その他の祭儀用語と、朝の全焼のささげ物に加えて行われたという関係は維持した。
