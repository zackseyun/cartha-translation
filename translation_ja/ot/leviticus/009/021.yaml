  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: ja
  text: アロンは胸の肉と右のももを、揺祭としてヤハウェの前で揺り動かした。これはモーセが命じたとおりである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: 胸の部分
  rationale: 祭儀において動物の胸に当たる取り分を指す。複数形は文脈上、複数のいけにえから取られた部分を表すが、日本語では自然な集合表現とした。
- source_word: שׁוֹק הַיָּמִין
  choice: 右のもも
  rationale: שׁוֹק は脚、特に祭儀上のももの部分を指す。「右」を明示し、現代日本語で理解しやすい祭儀用語とした。
- source_word: הֵנִיף ... תְּנוּפָה
  choice: 揺り動かす奉献物として……揺り動かした
  rationale: 同根の動詞と名詞による祭儀表現を保ち、単なる持ち上げではなく、ヤハウェの前に提示する儀礼動作であることを示した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי を簡潔に「前で」とし、固有の神名 יְהוָה は「ヤハウェ」と音写した。
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: モーセが命じたとおりである
  rationale: 行為が先の命令に一致していたことを自然な現代日本語で表した。ヘブライ語どおり命令の目的語は補わなかった。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された契約の神名を固有名として保持するため、一般称号の「主」に置き換えず音写した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、祭儀用語の厳粛さと、נוּף／תְּנוּפָה の語根反復を保った。「胸の部分」は複数の祭儀的取り分を指す自然な集合表現である。
