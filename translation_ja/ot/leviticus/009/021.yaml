  naturalness: 「揺り動かす奉献物として……揺り動かした」は動詞句をそのまま名詞修飾にした不自然な表現です。「揺祭として……揺り動かした」とすることで、現代日本語として読みやすく、原文の動詞と同根名詞の反復も保てます。
  terminology: 「ヤハウェ」は原文の神名に対応し、英語POBの方針とも一致しています。「揺祭」は祭儀上の technical term ですが、本文中で動作を「揺り動かした」と明示するため、文脈上理解可能です。「胸の肉」は祭牲から取られる部分であることを「胸の部分」より明瞭にします。
