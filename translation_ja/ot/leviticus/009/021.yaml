  - severity: low
    issue: 「胸の部分」はやや一般的で、祭牲の可食部分としての意味が弱い。
    rationale: חָזוֹתはこの文脈では祭牲の胸の取り分を指すため、「胸の肉」とするほうが明確で自然です。
