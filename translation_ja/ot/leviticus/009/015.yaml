source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: ja
  text: それからアロンは民のささげ物を差し出した。民のための罪のきよめのささげ物である雄やぎを取り、これを屠り、先のものと同じように、罪のきよめのささげ物としてささげた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この動詞は、祭司の儀式では「罪や汚れを除く（清める）儀式を行った」という意味にも取れる。
    reason: וַיְחַטְּאֵהוּ の祭儀的な語義には、罪のきよめのささげ物として扱うことと、罪や汚れを除くことの両面があり、日本語本文だけではその幅を十分に表しにくいため。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 差し出した
  rationale: ヒフィル形の祭儀的な意味「近くに持って来る、ささげる」を、行為全体を過度に限定せず自然な日本語で表した。
- source_word: קָרְבַּן הָעָם
  choice: 民のささげ物
  rationale: קָרְבָּן は神の前に携えて来るささげ物を表す一般的な祭儀用語であり、属格関係を簡潔に示した。
- source_word: שְׂעִיר הַחַטָּאת
  choice: 罪のきよめのささげ物である雄やぎ
  rationale: שָׂעִיר を雄やぎ、祭儀文脈の חַטָּאת を罪に関わる清めのささげ物として訳し、抽象的な「罪」と動物そのものを混同しないようにした。
- source_word: אֲשֶׁר לָעָם
  choice: 民のための
  rationale: לְ はここでは所有よりも、民を代表し民のために指定された犠牲であることを示す。
- source_word: וַיִּשְׁחָטֵהוּ
  choice: これを屠り
  rationale: שׁחט は犠牲動物を屠る標準的な動詞なので、一般的な「殺す」ではなく祭儀的含意を保つ語を選んだ。
- source_word: וַיְחַטְּאֵהוּ
  choice: 罪のきよめのささげ物としてささげた
  rationale: 祭司文書における חטא のピエル形は、罪のきよめのささげ物の儀式を行う、または罪・汚れを除くことを表し得る。対象が雄やぎであるため、「それを清めた」という誤解を避けつつ、脚注で語義の幅を残した。
- source_word: כָּרִאשׁוֹן
  choice: 初めのものと同じように
  rationale: 直前に扱われた最初の罪のきよめのささげ物を指し、それと同じ手順で行ったことを示す。
theological_decisions:
- issue: 祭儀文脈における חַטָּאת の意味
  choice: 罪のきよめのささげ物
  alternative: 罪／罪のためのささげ物
  rationale: ここでは犠牲動物を指す用法である。「きよめ」を含めることで、この犠牲が罪と汚れを除く祭儀に関わることを示すが、償いなど別の専門概念までは読み込まない。
- issue: וַיְחַטְּאֵהוּ の祭儀的意味
  choice: 罪のきよめのささげ物としてささげた
  alternative: それを清めた／それによって罪や汚れを除いた
  rationale: ヘブライ語の語義には清め・除去の含意がある一方、目的語が雄やぎなので、日本語で動物自体が清められたと断定するのは不自然である。本文は儀式行為として訳し、真正な語義の幅を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀の厳粛さを保った。「罪祭」のような短い専門語は避け、初読でも意味をつかみやすい「罪のきよめのささげ物」とした。主語のアロンは文脈上明らかだが、日本語での参照を明確にするため補った。
