id: LEV.9.20
reference: Leviticus 9:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּשִׂ֥ימוּ אֶת הַ/חֲלָבִ֖ים עַל הֶ/חָז֑וֹת וַ/יַּקְטֵ֥ר הַ/חֲלָבִ֖ים הַ/מִּזְבֵּֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: ja
  text: 彼らは脂肪の部分を胸肉の上に載せ、彼はその脂肪を祭壇の上で焼いた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「その脂肪を祭壇の上で焼いて煙にした」。
    reason: קטרが祭壇上で焼いて煙を立ち上らせることを表す祭儀用語であるため。
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 彼らは…載せ
  rationale: שׂיםは「置く、載せる」の意。ここでは脂肪を胸肉の上に置く動作なので、日本語として具体的で自然な「載せる」とした。
- source_word: הַחֲלָבִים
  choice: 脂肪の部分／その脂肪
  rationale: 犠牲として取り分けられた複数の脂肪部分を指す。初出では複数性を「脂肪の部分」で表し、後半は自然な照応として「その脂肪」とした。
- source_word: עַל הֶחָזוֹת
  choice: 胸肉の上に
  rationale: חָזֶהは祭儀規定における動物の胸の部位を指す。「胸」だけでは人体とも読めるため、食肉・犠牲の部位として明瞭な「胸肉」とした。
- source_word: וַיַּקְטֵר
  choice: 焼いた
  rationale: 祭壇上で供え物を焼き、煙を立ち上らせる祭儀的動作を表す。本文は簡潔で自然な「焼いた」とし、煙の含意は脚注に示した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴うが、קטרとの組み合わせでは、祭壇に向かう移動よりも祭壇上で焼く場所を表すため、「祭壇の上で」と訳した。
theological_decisions:
- issue: 前半の複数主語と後半の単数主語の交替
  choice: 「彼らは」から「彼は」への交替を保持した
  alternative: 主語を省略して一連の動作として訳す
  rationale: ヘブライ語本文はוַיָּשִׂימוּ（複数）とוַיַּקְטֵר（単数）を明確に区別している。文脈上の役割分担を訳文で暗黙に解消せず、原文の主語交替を保った。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある叙述とした。「胸肉」は祭儀上の部位を自然に示し、原文の複数主語から単数主語への移行も明示した。
