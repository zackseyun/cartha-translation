source:
  edition: WLC
  text: וְ/אֶת הַ/בָּשָׂ֖ר וְ/אֶת הָ/ע֑וֹר שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: ja
  text: しかし、肉と皮は宿営の外で火で焼いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: しかし、
  rationale: 接続詞וְは前節から動作を続けつつ、祭壇で焼いた部分（10節）と宿営の外で焼く部分との対照を示す。日本語では「しかし」がこの談話上の対照を自然に表す。אֶתは目的語標識なので訳語を立てない。
- source_word: הַ/בָּשָׂר
  choice: 肉
  rationale: בָּשָׂרは動物の肉を指す。現代日本語では「肉」が明瞭で自然であり、犠牲の残部を具体的に示す。
- source_word: הָ/עוֹר
  choice: 皮
  rationale: עוֹרは動物の皮を指す。「皮」は簡潔で一般読者にも分かりやすく、文脈にも適する。
- source_word: שָׂרַף בָּ/אֵשׁ
  choice: 火で焼いた
  rationale: שָׂרַףの具体的な焼却動作と、בָּאֵשׁが示す手段を自然な日本語で表す。完焼など、本文に明示されない完了的含意は加えない。
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: 宿営の外で
  rationale: イスラエルの陣営の境界外という儀礼上重要な場所を明確に表す。「宿営」は幕営する共同体とその区域を示す聖書文脈に適した現代語である。
theological_decisions:
- issue: 犠牲祭儀における焼却処分の表現
  choice: 肉と皮を宿営の外で焼いたという具体的な祭儀行為として訳す。
  alternative: 後代の聖書的連関や予型的象徴を前面に出す訳。
  rationale: ヘブライ語本文は祭司が行った処置を直接記している。後代の神学的解釈を訳文に織り込まず、本文の具体的行為をそのまま伝える。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「しかし」で前節との対照を示しつつ、祭儀的な荘重さを損なわない文体とした。
