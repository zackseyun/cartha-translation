id: LEV.9.24
reference: Leviticus 9:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: ja
  text: すると、ヤハウェの御前から火が出て、祭壇の上の全焼のいけにえと脂肪の部分を焼き尽くした。民は皆これを見て、喜びの叫びを上げ[a]、ひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「歓声を上げ」。
    reason: רנן は、喜びに満ちた叫びや歓声を表す。
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: 火が出て
  rationale: יצאが表す外への動きを簡潔に保ち、出来事の鮮明な連続を自然な日本語で示す。
- source_word: מִלִּפְנֵי יְהוָה
  choice: ヤハウェの御前から
  rationale: לִפְנֵיの「前から／御前から」という空間的表現と、神の臨在から火が発した含意を保つ。神名は原文に従い「ヤハウェ」とした。
- source_word: וַתֹּאכַל
  choice: 焼き尽くした
  rationale: 字義的には「食べた」だが、火が供え物を完全に取り去る文脈では「焼き尽くした」が明瞭で自然。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: 供え物全体を煙としてささげる עֹלָה の祭儀的特徴を、現代の読者にも伝わる定訳で示す。
- source_word: הַחֲלָבִים
  choice: 脂肪の部分
  rationale: 一般的な脂肪ではなく、祭壇にささげるために取り分けられた複数の脂肪部分を指すため。
- source_word: וַיָּרֹנּוּ
  choice: 喜びの叫びを上げ
  rationale: רנן が表す歓喜を伴う高らかな叫びを示し、歌であったと限定しない。
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: ひれ伏した
  rationale: 字義は「顔を地につけて倒れた」であり、畏敬や礼拝を表す身体動作を自然で簡潔な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の神名を名称として明示する。一般名詞的な称号「主」に置き換えない。
- issue: 民の叫びの性格
  choice: 喜びの叫び
  alternative: 叫び声
  rationale: רנן の歓喜・歓呼の語義を反映する一方、典礼歌や特定の礼拝形式だったとは断定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀用語は「全焼のいけにえ」「脂肪の部分」として具体性を保ち、結びは身体動作を自然に表す「ひれ伏した」とした。
