  source_fidelity: 原文は「ヤハウェの御前から」火が出て、祭壇上の全焼のいけにえと脂肪の部分を焼き尽くし、民全体がそれを見て歓喜の叫びを上げ、ひれ伏した、と述べる。訳文はこの叙述順序、祭儀用語、民の反応を正確に反映している。「ひれ伏した」は「顔の上に倒れた」というヘブライ語慣用句の自然で適切な訳である。
