base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: ja
  text: 次に、アロンは、民のための交わりのいけにえ[a]である雄牛と雄羊を屠った。アロンの子らは血を彼のもとに持って来た。彼はそれを祭壇の周囲に振りかけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」または「幸いのいけにえ」とも訳せる。ヘブライ語は、平和、完全さ、交わりを連想させる。
    reason: שְׁלָמִיםの意味領域と主要な訳語の可能性を示すため。
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: 次に……屠った
  rationale: 物語の進行を「次に」で示し、祭儀における殺処分を表す語として「屠った」を用いた。
- source_word: הַשּׁוֹר וְאֶת הָאַיִל
  choice: 雄牛と雄羊
  rationale: שׁוֹרは牛を指すが、この祭儀の文脈では「雄牛」が自然であり、אַיִלは明確に雄羊を指す。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ[a]
  rationale: שְׁלָמִיםが含む平和、健全、神との交わり・会食という意味領域のうち、祭儀の性格を現代日本語で理解しやすく示す表現を選んだ。語の広がりは脚注で保持した。
- source_word: אֲשֶׁר לָעָם
  choice: 民のための
  rationale: このいけにえが民のために献げられたことを簡潔かつ自然に表した。
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: 彼のもとに……運んで来ると
  rationale: 祭儀の執行者であるアロンのもとへ血を持参した動作を自然な日本語で表した。指示対象は直前の「アロン」によって明確である。
- source_word: וַיִּזְרְקֵהוּ עַל הַמִּזְבֵּחַ סָבִיב
  choice: それを祭壇の全周に振りかけた
  rationale: זָרַקは祭儀で血を投げかける動作を表し、単なる滴状の散布に限定されない。「全周に」によりסָבִיבの意味を明確にした。
theological_decisions:
- issue: שְׁלָמִיםという祭儀名の意味領域
  choice: 本文では「交わりのいけにえ」とし、脚注で平和・健全の含意を示す
  alternative: 「平和のいけにえ」または「幸いのいけにえ」
  rationale: 一つの日本語で原語の全含意を尽くすことはできないため、祭儀の共同性を本文で伝えつつ、特定の贖罪論や和解論に限定せず、原語の意味の幅を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祭儀の厳粛さに合わせて「屠った」「いけにえ」を用いた。「アロンの子ら」は原文の反復を保ち、後続の代名詞の指示対象が曖昧にならないようにした。
