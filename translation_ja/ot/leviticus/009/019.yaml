  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: ja
  text: また、雄牛と雄羊からの脂肪の部分――脂肪のついた尾、内臓を覆う脂肪、腎臓、肝臓の付属部分――。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: また、…脂肪の部分…を取った
  rationale: 対格標識を伴う句は前節から続く目的語の列挙である。日本語では文脈上補う必要のある述語「取った」を加え、「脂肪の部分」によって祭儀で取り分けられる特定の脂肪部位を表した。
- source_word: מִן הַשּׁוֹר וּמִן הָאַיִל
  choice: 雄牛と雄羊から取った
  rationale: שׁוֹר は牛を広く指し得るが、直前の9:18で雄牛とされる動物を受けるため「雄牛」とした。אַיִל は祭儀の文脈で「雄羊」。
- source_word: הָאַלְיָה
  choice: 脂肪のついた尾
  rationale: 脂尾羊の脂肪に富む尾を指す祭儀用語。「脂尾」よりも一般読者に形態が伝わる自然な表現とした。
- source_word: וְהַמְכַסֶּה
  choice: 内臓を覆う脂肪
  rationale: 字義は「覆うもの」だが、この祭儀的・解剖学的列挙では内臓を覆う脂肪を指す。対象を明示して現代日本語で分かりやすくした。
- source_word: וְהַכְּלָיֹת
  choice: 腎臓
  rationale: 標準的な解剖学名称を用いた。ヘブライ語は複数形だが、日本語では総称として「腎臓」が自然である。
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: 肝臓の付属物
  rationale: יֹתֶרֶת の厳密な解剖学的同定には不確かさがあり、「葉」と断定せず、肝臓に付随する部分という原語の意味を保った。
theological_decisions: []
translation_notes:
