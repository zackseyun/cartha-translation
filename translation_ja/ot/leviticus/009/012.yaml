base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: ja
  text: それから、彼は焼き尽くすささげ物を屠った。アロンの子らはその血を彼のもとに持って来て、彼はそれを祭壇の周囲に浴びせかけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭壇の周囲に血を投げかけた」。ここで血を施すことを表すヘブライ語の動詞は、軽く振りかけるというより、勢いよく投じる動作を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: それから、彼は……屠った
  rationale: שׁחטは祭儀の文脈で動物を屠る行為を指す。「屠った」は単なる「殺した」よりも祭儀的な意味を正確に伝え、文頭の「それから」は物語の進行を自然な現代日本語で表す。
- source_word: הָעֹלָה
  choice: 焼き尽くすささげ物
  rationale: עלהは祭壇で全体を焼くささげ物を指す。「焼き尽くすささげ物」は、その性質を現代の一般読者にも分かる形で示す。
- source_word: וַיַּמְצִאוּ
  choice: 持って来ると
  rationale: この使役形は、アロンの子らが祭儀に用いる血をアロンのもとへ運んだことを表す。「持って来ると」は一連の動作を自然に接続する。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: 家族関係と祭司として行動する集団の双方を、簡潔かつ格調を保って表す。
- source_word: אֵלָיו
  choice: 彼のもとに
  rationale: 指示対象であるアロンへの方向を明確かつ自然に示す。
- source_word: הַדָּם
  choice: その血
  rationale: 直前に屠られたささげ物の血を指すため、日本語では「その」を用いて照応を明確にする。後半でも目的語を繰り返し、行為の対象を分かりやすくした。
- source_word: וַיִּזְרְקֵהוּ
  choice: その血を……浴びせかけた
  rationale: זרקはここで、細かな滴を軽く振りかけるというより、血を祭壇に勢いよく投じる祭儀動作を示す。「浴びせかけた」は不自然な直訳を避けながら、その力のある動作を伝える。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇……に
  rationale: עלは血を祭壇へ直接施す動作の到達点を示す。日本語では動詞「浴びせかける」と助詞「に」の組み合わせが自然である。
- source_word: סָבִיב
  choice: 全周に
  rationale: 祭壇の一か所だけでなく、その周囲全体に血を施したという分布的な意味を簡潔に表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祭儀の場面にふさわしい品位を保った。「焼き尽くすささげ物」は伝統的な専門語だけに頼らず祭儀の内容を伝え、「屠った」と「浴びせかけた」により動作の具体性と強さを保持した。原文では主語の「彼」は文脈上アロンを指すが、この節だけで固有名に置き換えず、原文の指示表現を保った。
