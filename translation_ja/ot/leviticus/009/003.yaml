id: LEV.9.3
reference: Leviticus 9:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: ja
  text: また、イスラエルの子らにこう告げなさい。「雄やぎ一頭を罪のためのいけにえ[a]として、また、一歳で傷のない子牛と子羊を、全焼のいけにえとして取りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清めのいけにえ」。祭儀の文脈におけるヘブライ語 חַטָּאת の別訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: また、イスラエルの子らに
  rationale: 接続詞と前置詞の流れを「また…に」で保ち、בְּנֵי יִשְׂרָאֵל の男性複数形を透明性のある「イスラエルの子ら」とした。
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: こう告げなさい
  rationale: 直訳的な「語って言いなさい」ではなく、命令の力と引用導入の機能を、自然な現代日本語で一体として表した。
- source_word: קְחוּ
  choice: 取りなさい
  rationale: לקח の基本義を保ち、原文に明示されない移動先を含意する「連れて来なさい」は避けた。複数への命令であることは文脈上明らかである。
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ一頭
  rationale: 雄であるという犠牲動物の指定を明示し、日本語として自然になるよう助数詞を補った。
- source_word: לְ/חַטָּאת
  choice: 罪のためのいけにえ
  rationale: 祭儀上の供え物を指すことを明確にしつつ、חַטָּאת と「罪」との語彙的な結び付きを保った。浄化を強調する訳語は脚注に示した。
- source_word: וְ/עֵגֶל וָ/כֶבֶשׂ
  choice: また…子牛と子羊
  rationale: עֵגֶל と כֶבֶשׂ の通常の動物名称を、それぞれ「子牛」「子羊」とした。
- source_word: בְּנֵי שָׁנָה תְּמִימִם
  choice: 一歳で傷のない
  rationale: 複数形が子牛と子羊の双方を修飾する構造を日本語でも自然に共有させ、祭儀上の無欠陥性を「傷のない」と表した。
- source_word: לְ/עֹלָה
  choice: 全焼のいけにえとして
  rationale: 供え物全体を焼く祭儀類型を明確にする、現代日本語として分かりやすい訳語を採用した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人たち
  rationale: 契約共同体を指す慣用的名称だが、原文の「子ら」という形を本文に残した。日本語では「子ら」が集団全体を指し得るため、男性だけに限定するとの不要な説明は加えていない。
- issue: 祭儀用語 חַטָּאת の意味
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: この語は祭司文書の文脈で罪への対処と浄化の両面を持ち得る。本文では語根とのつながりが見える伝統的理解を保ち、浄化を前面に出す有力な代案を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いけにえ」は一般読者に理解しやすい表記とし、命令表現は過度に古風な「取れ」ではなく「取りなさい」とした。
