id: LEV.9.2
reference: Leviticus 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: ja
  text: そして彼はアロンに言った。「自分のために、罪のささげ物として子牛を一頭[a]、焼き尽くすささげ物として雄羊を一頭、どちらも傷のないものを取り、ヤハウェの前に差し出しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「子牛、牛の群れの子」。若い牛を指す。
    reason: 原文の同格的な表現と動物の種類を示すため。英語資料では脚注記号が「アロン」の後に置かれているが、脚注内容に対応する「子牛」の後に配置した。
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אַהֲרֹן
  choice: そして彼はアロンに言った
  rationale: 物語を進める接続形の流れを「そして」で保ち、原文に明示されていない話者名を本文へ補わず、代名詞で表した。
- source_word: קַח לְךָ
  choice: 自分のために…取りなさい
  rationale: 命令形と利益・関与を示す לְךָ の再帰的な含みを、自然な現代日本語で保持した。
- source_word: עֵגֶל בֶּן־בָּקָר
  choice: 子牛を一頭[a]
  rationale: 本文では若い牛を指す自然な日本語を用い、直訳的な同格表現「牛の子である子牛」は脚注に示した。
- source_word: לְחַטָּאת
  choice: 罪のささげ物として
  rationale: 祭儀の文脈で חַטָּאת が罪そのものではなく供え物を指すことを明確にしつつ、「罪のため」と「清めのため」にまたがる語の機能を過度に限定しない表現とした。
- source_word: וְאַיִל לְעֹלָה
  choice: 焼き尽くすささげ物として雄羊を一頭
  rationale: אַיִל を「雄羊」、全体を祭壇で焼く עֹלָה を、その動作が分かる現代的な祭儀用語で訳した。
- source_word: תְּמִימִם
  choice: どちらも傷のないもの
  rationale: 複数形が子牛と雄羊の両方を修飾することを日本語で明示した。
- source_word: וְהַקְרֵב
  choice: 差し出しなさい
  rationale: 使役形の「近づける、持って来る」が祭儀では神の前に提示することを表すため、後続する実際の奉献手順と区別できる「差し出す」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 「御前に」という祭儀的な関係を保ち、固有の神名 יהוה を称号に置き換えず音写した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある契約の神名を称号へ置換せず、現代日本語で一般的な学術的音写によって示した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のささげ物
  alternative: 罪祭／清めのささげ物
  rationale: この語には罪への対処と儀礼的な清めの機能が関わるため、本文では簡潔で伝統的に理解可能な表現を用い、一方の理論だけに限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は専門的すぎる漢語を避け、「罪のささげ物」「焼き尽くすささげ物」として一般読者にも意味が伝わる形にした。
