source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: ja
  text: アロンの息子たちは彼のもとに血を運んだ[a]。彼は指をその血に浸し、その血を祭壇の角[b]に塗った。そして、その血を祭壇の土台に注いだ[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼に血を差し出した」とも訳せる。ヘブライ語の動詞は、祭儀の文脈では「近くに持って来る、差し出す」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 祭壇の四隅にある、角のように突き出た部分。
    reason: cultural_note
  - marker: c
    text: 「祭壇の根元に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: 運んだ
  rationale: ヒフィル形の「近づける、持って来る」を、祭儀の場面で自然な現代日本語にした。「差し出した」という儀礼的な意味も脚注に残す。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの息子たち
  rationale: 構文と家族的・祭司的な関係を明瞭に保つ自然な表現。
- source_word: אֵלָיו
  choice: 彼のもとに
  rationale: 代名詞を名前に置き換えず保持する。直前の文脈ではアロンを指すのが最も自然である。
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: 指をその血に浸し
  rationale: טבל の浸す動作と、単数の「彼の指」を簡潔に表す。日本語では主語から所有者が明らかなため「彼の」は省いた。
- source_word: וַיִּתֵּן עַל
  choice: に塗った
  rationale: 直訳は「上に置いた」だが、血を指で祭壇の角に付ける祭儀動作を自然かつ明確に表す。
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: 祭壇の角
  rationale: 祭壇の四隅から突き出た角状部分を指す定着した直訳を保持する。
- source_word: יָצַק
  choice: 注いだ
  rationale: 液体を意図的に注ぐ動作を簡潔な現代日本語で表す。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 祭壇の土台に
  rationale: יסוד の基本義である「基礎、土台」を保持する。「祭壇の根元に」とすることも可能。
- source_word: וְאֶת הַדָּם
  choice: そして、残りの血を
  rationale: ヘブライ語は単に「その血を」だが、一部を指で塗った後の血を指すことを日本語で自然に明示した。
theological_decisions:
- issue: אֵלָיו の代名詞が指す相手
  choice: アロン
  alternative: 祭壇、または文脈上補われる別の対象
  rationale: 息子たちが補助し、アロンが儀式を行う直前の文脈から、アロンが最も自然な先行詞である。ただし本文では原文どおり代名詞の「彼」を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「祭壇の角」は祭儀用語として原文の比喩を保持し、脚注で形状を説明した。逐語的な連続接続は短い文に分けて読みやすくした。
