  to: アロンの息子たちは彼のもとに血を運んだ[a]。彼は指をその血に浸し、その血を祭壇の角[b]に塗った。そして、その血を祭壇の土台に注いだ[c]。
  rationale: 原文にない「残りの」を削除し、定冠詞付きの「その血」を保持した。また、祭壇の角に塗る対象を「その血」と明示して、ヘブライ語の儀礼行為を日本語で明瞭にした。脚注のアンカーと内容は本文の各該当箇所に適切に対応している。
