  terminology: 「アロン」「祭壇」「祭壇の角」「土台」は適切である。「祭壇の角」は原語の比喩的・祭儀的表現を保っており、脚注の形状説明も適切である。「根元」は「土台」の有効な代替訳として脚注に残せる。
