id: LEV.9.6
reference: Leviticus 9:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: ja
  text: モーセは言った。「これは、ヤハウェがあなたがたに行うよう命じられたことである。そして、ヤハウェの栄光があなたがたに現れる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「あなたがたがこれを行えば、ヤハウェの栄光があなたがたに現れる」。目的を表して、「ヤハウェの栄光があなたがたに現れるように」とも取れる。
    reason: וְיֵרָא で始まる節は、並列的・結果的な未来として読むほか、前文に対する結果または目的としても理解し得るため。
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: モーセは言った
  rationale: 物語を進める接続形は、日本語では不自然な接続語を加えず、簡潔な叙述で表した。
- source_word: זֶה הַדָּבָר
  choice: これは……ことである
  rationale: 直訳的な「これはその事柄である」より自然な現代日本語としつつ、単数の具体的な指示を保った。
- source_word: צִוָּה יְהוָה תַּעֲשׂוּ
  choice: ヤハウェがあなたがたに行うよう命じられた
  rationale: צוה の権威ある命令の意味と、תעשו の複数の聞き手を明示した。日本語の敬語としてではなく、神への荘重な敬意を示す文体で「命じられた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: וְיֵרָא
  choice: それを行えば……現れる
  rationale: 命じられた行為に続く神の栄光の顕現という結果のつながりを、自然な日本語で表した。接続の目的・結果・単純な未来という幅は脚注で保持した。
- source_word: אֲלֵיכֶם
  choice: あなたがたに
  rationale: 顕現を受ける複数の者を明確にした。
- source_word: כְּבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: 構成語句を素直に訳し、神の目に見える威光・臨在を表す聖書的な語「栄光」を用いた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を保持し、称号への置換や別系統の伝統的音写を本文に持ち込まないため。
- issue: 末尾の וְיֵרָא の論理的関係
  choice: 命令の実行に続く結果として「それを行えば……現れる」
  alternative: 目的として「……現れるためである」、または並列的な未来として「そして……現れる」
  rationale: ヘブライ語の接続詞と未完了形は、結果・目的・未来の約束の間に解釈上の幅がある。本文では自然な結果表現を採り、別解を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀的文脈にふさわしい荘重さを保ちつつ、古風な文語や過度に直訳的な語順は避けた。
