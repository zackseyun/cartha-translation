id: LEV.9.4
reference: Leviticus 9:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: ja
  text: また、牛一頭と雄羊一匹を交わりのいけにえ[a]としてヤハウェ[b]の前でささげ、油を混ぜた穀物のささげ物もささげなさい。今日、ヤハウェがあなたがたに現れるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平安のいけにえ」「健やかさのためのいけにえ」とも訳せる。
    reason: שְׁלָמִיםは平安・健やかさ・交わりに関わる祭儀用語であり、「和解」を直接意味する語ではないため。
  - marker: b
    text: ヘブライ語の神の固有名は יְהוָה（YHWH）。本文では「ヤハウェ」と表記している。
    reason: 神名を「主」と訳す伝統もあるが、本文の「ヤハウェ」という表記方針を明示するため。
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 性別を明示しないウシ属の動物を指す語なので、文脈に不要な限定を加えず「牛」とした。
- source_word: אַיִל
  choice: 雄羊
  rationale: 成長した雄の羊を指す明確な語であり、祭儀文脈でも「雄羊」が自然で正確である。
- source_word: שְׁלָמִים
  choice: 交わりのいけにえ
  rationale: 神との平和、共同の食事、健全な関係を含み得る祭儀用語。現代日本語で祭儀の性格が伝わりやすい「交わりのいけにえ」を本文に置き、別訳を注記した。
- source_word: לִזְבֹּחַ
  choice: 献げる
  rationale: 単なる屠殺ではなく祭儀として犠牲を献げる行為を表すため、「献げる」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の空間的・祭儀的な「前で／御前で」という意味を保ち、神名は固有名として音写した。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀文脈では穀物を用いる供え物を指すため、一般的な「ささげ物」より具体的に訳した。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 油を混ぜた
  rationale: 油と混ぜ合わせて調製された状態を、自然な現代日本語で表した。
- source_word: כִּי הַיּוֹם
  choice: 今日……からである
  rationale: כִּי の理由を示す機能と、הַיּוֹם の時間的強調をともに明示した。
- source_word: נִרְאָה אֲלֵיכֶם
  choice: あなたがたに現れる
  rationale: 形態上は完了形だが、この文脈では間近に起こる顕現を告げる未来的用法と判断した。受け身的な語形の意味を自然な日本語の「現れる」で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文に固有の神名YHWHが記されていることを明示し、一般的な学術的再構音に基づく「ヤハウェ」を採用した。
- issue: שְׁלָמִים の祭儀的含意
  choice: 交わりのいけにえ
  alternative: 「和解のいけにえ」または「平安のいけにえ」
  rationale: この語が持つ平和・健全・交わりの意味領域を一語で完全には限定できないため、本文では理解しやすい表現を選び、真正な語義の幅を脚注に残した。
- issue: 神の顕現を表す時制
  choice: ヤハウェがあなたがたに現れる
  alternative: 「ヤハウェがあなたがたに現れた」
  rationale: 祭儀の後に期待される顕現を告げる文脈に従い、完了形を予告・確実な未来として訳した。また、次節の「ヤハウェの栄光」を本節に補わず、原文どおりヤハウェ自身を主語とした。
translation_notes:
  register: 明瞭で現代的ながら、祭儀本文にふさわしい品位を保った。「献げなさい」を補って、前節から続く命令の構造を日本語として明確にした。「御前」のようなやや古風な表現を避けて「前で」とし、単位は日本語の自然さのため「一頭」「一匹」を用いた。
