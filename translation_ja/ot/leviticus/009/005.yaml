id: LEV.9.5
reference: Leviticus 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: ja
  text: 彼らはモーセが命じたものを会見の天幕の前に運んだ。全会衆は近寄り、ヤハウェの前に立った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 運んだ
  rationale: 基本義は「取る」だが、目的地を示す「会見の天幕の前に」が続くため、ここでは品々をそこへ持って来る動作を自然な日本語で表した。
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: モーセが命じたもの
  rationale: 直前までに指定された供え物などを指す関係節であり、指示内容を具体化しすぎずに訳した。
- source_word: אֶל־פְּנֵי
  choice: 前に
  rationale: 天幕の正面・前方という空間的意味を表す。後半の「ヤハウェの前に」と同じ日本語になるが、各々の目的語によって意味は明瞭である。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための天幕を指す定着した透明性の高い訳語であり、「幕屋」より原語の構成を明示する。
- source_word: וַיִּקְרְבוּ
  choice: 近寄り
  rationale: קרב の接近する動きを、現代日本語で簡潔に表した。聖所へ近づく含みも保持している。
- source_word: כָּל־הָעֵדָה
  choice: 全会衆
  rationale: 祭儀のために集められたイスラエル共同体全体を指すため、簡潔で文脈に適する「全会衆」とした。
- source_word: וַיַּעַמְדוּ
  choice: 立った
  rationale: עמד の通常の意味をそのまま自然に表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 物理的な位置と神の臨在のもとにあることの両方を含む表現として「前に」を保ち、固有の神名は「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が四文字神名を明記しているため、称号に置き換えず、一般的な学術的再建音を日本語表記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二つの連続動作を二文に分けて読みやすくしつつ、行為の順序を保持した。
