  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: ja
  text: 彼は内臓とすねを洗い、祭壇の上の全焼のささげ物の上で、それらを焼いて煙にした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: 洗い
  rationale: רחץはここでは、いけにえの部分を水で洗う儀礼的な行為を表す。現代日本語では「洗う」が明確で自然。
- source_word: הַקֶּרֶב
  choice: 内臓
  rationale: קֶרֶבは一般には内部を指し得るが、犠牲祭儀の文脈では動物の内臓を指す。
- source_word: הַכְּרָעָיִם
  choice: すね
  rationale: כְּרָעַיִםは動物の脚、特に下脚部を指す。「すね」は解剖学的な範囲を簡潔に伝える。
- source_word: וַיַּקְטֵר
  choice: 焼いて煙にした
  rationale: 祭司資料におけるקטרのヒフィル形は、単に焼くことよりも、祭壇上でささげ物を焼いて煙を立ち上らせる行為を表すため、その祭儀的含意を保った。
- source_word: עַל הָעֹלָה
  choice: 全焼のささげ物の上に
  rationale: עַלはここで、すでに祭壇上にある全焼のささげ物への重ね置きを示す。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: עֹלָהは全体を焼く犠牲を指す定型的な祭儀用語。「全焼のささげ物」は意味が明確で、現代の読者にも理解しやすい。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴い、祭壇へ運んでそこで処理することを表す。日本語では文脈に即して「祭壇の上で」とした。
