  naturalness: 現行文の「祭壇の上で、全焼のささげ物の上に載せて焼いて煙にした」は、「載せて」が独立した追加動作のように響き、二つの「上」の係り方も一読で把握しにくい。祭壇上にある全焼のささげ物を先に修飾して示すと、明瞭で自然な現代日本語になる。
