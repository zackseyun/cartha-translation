base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: ja
  text: モーセはアロンに言った。「祭壇に近づき、あなたの罪のためのいけにえ[a]と全焼のいけにえを献げ、あなた自身と民のために贖いを行いなさい。それから、民の献げ物を献げ、ヤハウェが命じたとおり、彼らのために贖いを行いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの清めのいけにえ」。ヘブライ語のハッタートは罪のためのいけにえを指すが、文脈によっては汚れからの清めが強調される。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: 祭壇に近づき
  rationale: 命令形קרבの祭儀的な意味「近づく」を自然な現代日本語で表し、定冠詞のある祭壇も明示した。
- source_word: וַעֲשֵׂה
  choice: 献げ
  rationale: 字義は「行う／作る」だが、犠牲を目的語とする祭儀的文脈では「献げる」が自然である。
- source_word: חַטָּאתְךָ
  choice: あなたの罪のためのいけにえ
  rationale: חטאתがここでは供犠を指すことを明確にしつつ、罪との語義的関係を保った。清めを重視する訳も可能なので脚注に示した。
- source_word: עֹלָתֶךָ
  choice: 全焼のいけにえ
  rationale: 祭儀用語עֹלָה、すなわち全体を焼いて献げる供犠を明瞭に表した。
- source_word: וְכַפֵּר
  choice: 贖いをしなさい
  rationale: כפרの祭儀的・神学的な広がりを保ち、特定の贖罪理論や清めだけに限定しない表現とした。
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: あなた自身と民のために
  rationale: בעדが示す代理・受益の関係を、簡潔で自然な日本語にした。
- source_word: קָרְבַּן הָעָם
  choice: 民の献げ物
  rationale: קרבןの一般的な意味と連語の関係を簡潔に表した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: 主が命じたとおり
  rationale: כאשרが示す命令への一致を「とおり」で表し、יהוהは日本語聖書で広く理解される「主」とした。
theological_decisions:
- issue: 祭儀的文脈におけるחַטָּאתの訳
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: この語は罪に関わる供犠を指す一方、儀礼的な清めの働きを強調し得る。本文では罪との結びつきを保ち、別の有力な理解を脚注に残した。
- issue: כפרの訳
  choice: 贖いをする
  alternative: 清めを行う／償いをする
  rationale: 祭儀的な和解・除去・清めを含み得る語を、特定の神学体系に狭めず、重みのある包括的な表現で訳した。
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語本文として自然で広く認識される慣用表記を採用した。原文が固有の神名であることは、この節の意味を過度に説明する必要がないため脚注化しなかった。
translation_notes:
  register: 明瞭で現代的ながら礼拝・祭儀の荘重さを保つ文体。「いけにえ」と「献げ物」を使い分け、専門用語の過剰な硬さを避けた。
