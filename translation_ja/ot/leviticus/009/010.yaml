source:
  edition: WLC
  text: וְ/אֶת הַ/חֵ֨לֶב וְ/אֶת הַ/כְּלָיֹ֜ת וְ/אֶת הַ/יֹּתֶ֤רֶת מִן הַ/כָּבֵד֙ מִן הַ֣/חַטָּ֔את הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼は、罪のためのいけにえ[a]の脂肪、腎臓、肝臓の上の小葉を祭壇の上で焼いて煙にした。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。ヘブライ語は、罪に対処することだけでなく、汚れを取り除くこのいけにえの働きを強調する場合がある。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 祭儀の文脈で、祭壇にささげるために取り分けられた脂肪部分を指す。簡潔で具体的な訳語とした。
- source_word: כְּלָיֹת
  choice: 腎臓
  rationale: 明確な解剖学的名称であり、原文の具体的な祭儀描写を保つ。
- source_word: יֹתֶרֶת מִן־הַכָּבֵד
  choice: 肝臓の付属物
  rationale: 肝臓に伴う突出部または付属部分を指すが、その正確な解剖学的同定には不確かさがあるため、「葉」と断定せず、原語の幅を保った。
- source_word: חַטָּאת
  choice: 罪のためのいけにえ
  rationale: 罪に関わる祭儀上のささげ物という伝統的かつ理解しやすい意味を示す。同時に、汚れを除く清めの機能もあり得るため、別訳を脚注に残した。
- source_word: הִקְטִיר
  choice: 焼いて煙にした
  rationale: 単に焼くことではなく、祭壇上で焼いて煙として立ち上らせる祭儀行為を表す使役形の含意を伝える。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴うが、動詞との組み合わせでは、祭壇上で焼いて煙にするという自然な日本語が文脈に適する。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: この語は罪に対処するささげ物を指す一方、祭司文書では汚れを除く清めの機能も強調し得る。本文では広く理解される伝統的区分を用い、正当な別解を脚注で明示した。
translation_notes:
  register: 明瞭で現代的ながら、祭儀本文にふさわしい落ち着いた文体とした。「彼」は直前の文脈で行為者であるアロンを受ける。解剖学的に確定しにくい部位は「肝臓の付属物」とし、過度な特定を避けた。
