  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: ja
  text: 彼は全焼のささげ物を差し出し、規定どおりにそれをささげた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「定められた手順に従って」。
    reason: מִשְׁפָּטは規定そのものだけでなく、規定された祭儀上の手順を指すとも訳せるため。
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 差し出し
  rationale: קרבのヒフィル形は「近づける、差し出す」を意味する。祭儀の文脈に自然であり、後続の動詞と不必要に重複しない「差し出す」とした。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: עֹלָהは祭壇で全体を焼くいけにえを指す定着した祭儀用語である。語源的な「上るもの」ではなく、実際の供犠の種類が明確に伝わる表現とした。
- source_word: וַיַּעֲשֶׂהָ
  choice: それをささげた
  rationale: עשה自体は広く「行う、作る」の意だが、ここでは全焼のささげ物について定められた儀式を執行することを指す。日本語として自然な「ささげた」とし、目的語を「それ」で明示した。
- source_word: כַּמִּשְׁפָּט
  choice: 規定どおりに
  rationale: מִשְׁפָּטはここで供犠について定められた規範・手順を表す。「規定どおりに」は法的・祭儀的な拘束性を保ちつつ、現代日本語として簡潔である。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二つの動作を「差し出し」「ささげた」と区別し、祭儀的な簡潔さを維持した。
