id: LEV.9.8
reference: Leviticus 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: ja
  text: そこでアロンは祭壇に近づき、自分のための罪のいけにえの子牛を屠った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分のための清めのいけにえの子牛」。ヘブライ語の語は、罪や汚れを除くことに関わるいけにえを指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: 近づき
  rationale: 祭壇へ接近する具体的な動作を、現代日本語で自然かつ簡潔に表す。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲奉献の文脈における標準的な訳語。
- source_word: וַיִּשְׁחַט
  choice: 屠った
  rationale: 単に殺すのではなく、犠牲獣を儀礼的に屠る行為を的確に示す。
- source_word: עֵגֶל
  choice: 子牛
  rationale: 若い牛を指す直接的で一般に理解しやすい訳語。直前の文脈で指定された犠牲獣とも一致する。
- source_word: הַחַטָּאת
  choice: 罪のいけにえ
  rationale: レビ記の犠牲制度における供え物の種類を示す定着した明瞭な表現。罪や汚れの除去に関わる『清めのいけにえ』という理解も脚注に残す。
- source_word: אֲשֶׁר לוֹ
  choice: 自分のための
  rationale: 周囲の文脈にある民のための供え物と対照し、これがアロン自身のための供え物であることを自然に示す。
theological_decisions:
- issue: 祭儀的文脈における חטאת の訳し方
  choice: 罪のいけにえ
  alternative: 清めのいけにえ
  rationale: この語はここで犠牲の種類を指す。伝統的で理解しやすい『罪のいけにえ』を本文に置きつつ、罪や汚れを除く祭儀的機能を強調する別訳も脚注で明示し、ヘブライ語の意味の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀的な荘重さを保った。「屠った」は犠牲獣の処理を正確に示し、「自分のための」は文脈上の対比を自然に表す。
