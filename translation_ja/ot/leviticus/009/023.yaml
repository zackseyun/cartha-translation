id: LEV.9.23
reference: Leviticus 9:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: ja
  text: モーセとアロンは会見の幕屋に入り、出て来て民を祝福した。すると、ヤハウェの栄光が民全体に現れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の幕屋
  rationale: イスラエルの礼拝施設を指す定着した聖書用語であり、原語の「会うための天幕」という意味と祭儀的な文脈を簡潔に伝える。
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: 入り、出て来て
  rationale: モーセとアロンを主語とする一連の移動を自然な日本語で表し、後続する複数形の動詞に即して両者の行動として訳した。
- source_word: וַיְבָרֲכוּ
  choice: 祝福した
  rationale: 祝福の形式や言葉を本文以上に限定せず、動詞の意味を直接表す。
- source_word: הָעָם / כָּל הָעָם
  choice: 民／民全体
  rationale: 集められた契約共同体を指す語として自然であり、כָּל の包括性も「全体」で明示した。
- source_word: כְבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: כָבוֹד が示す神の目に見える威光を「栄光」で表し、固有の神名 יְהוָה は「ヤハウェ」と音写した。
- source_word: וַיֵּרָא
  choice: 現れた
  rationale: ニファル形が表す可視的な顕現を、神の栄光について自然な日本語で表現した。
- source_word: אֶל כָּל הָעָם
  choice: 民全体に
  rationale: 顕現がすべての民に向けられ、彼らに認められたことを、解釈を付加せず簡潔に表す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の契約名を明示し、一般称号へ置き換えない。
- issue: 各節の時間的・連続的関係
  choice: 入り、出て来て……した。すると……現れた
  alternative: 入り、出て来て……し、……現れた
  rationale: ヘブライ語の連続する物語叙述を保ちつつ、「すると」によって自然な進行を示す。因果関係までは断定しない。
translation_notes:
  register: 明瞭で現代的ながら礼拝文書にふさわしい格調を保った。「会見の幕屋」「栄光」は祭儀的・神学的な意味を損なわない定着表現として用い、文の連鎖は日本語として読みやすく整えた。
