  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: ja
  text: 彼らは全焼のささげ物の切り分けた部分と頭を、彼のもとへ差し出した。彼はそれらを祭壇の上で焼いて煙にした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「焼いて煙にした」に当たるヘブライ語は、祭儀の文脈では、祭壇で焼いて煙として立ち上らせることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: 動物を祭壇で全面的に焼く祭儀上のささげ物を指す定着した表現であり、現代日本語でも意味が明確である。
- source_word: הִמְצִיאוּ אֵלָיו
  choice: 彼のもとへ差し出した
  rationale: 使役形がここでは、祭司たちが各部分をアロンのもとへ運び、祭儀のために渡したことを表す。「差し出した」は単なる移動だけでなく、祭儀上の受け渡しも自然に伝える。
- source_word: לִנְתָחֶיהָ
  choice: 切り分けた部分ごとに
  rationale: נֶתַח は解体された動物の各部分を指し、前置詞 ל はここで分配的な意味を帯びる。原文の分節された状態と順次の受け渡しを明瞭に表す。
- source_word: הָרֹאשׁ
  choice: 頭
  rationale: ほかの切り分けた部分と区別して明記されているため、解剖学的な語をそのまま訳した。
- source_word: וַיַּקְטֵר
  choice: 焼いて煙にした
  rationale: קטר は祭儀の文脈で、祭壇上で焼いて煙として立ち上らせることを指す。「焼いた」だけより祭儀上の含意を保ちながら、自然な日本語とした。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇の上で
  rationale: 祭壇上で行われる焼却を示す標準的で明瞭な表現である。
theological_decisions:
- issue: קטר の祭儀上の含意
  choice: 焼いて煙にした
  alternative: 焼いた／煙としてささげた
  rationale: 単なる焼却とも、抽象的な奉献行為だけとも限定せず、実際に祭壇で焼いて煙を立ち上らせる祭儀行為を表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は直前の文脈におけるアロンを指す。原文の語順を過度に再現せず、切り分けた各部分と頭がともに差し出され、その後に祭壇で焼かれたという進行を自然に示した。
