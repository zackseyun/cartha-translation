  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: ja
  text: 八日目に、モーセはアロンとその息子たち、およびイスラエルの長老たちを呼んだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「呼び集めた」「召集した」とも訳せる。ヘブライ語の動詞は、この文脈では「呼ぶ」または「召集する」の意味を持ち得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: なったとき
  rationale: ヘブライ語の物語を進める定型表現を、直前の七日間を受ける自然な現代日本語の時間表現として訳した。独立した「出来事が起こった」という意味を過度に前面に出さない。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 八日目
  rationale: 原文どおりの簡潔な時間表現とし、「その翌日」など、文脈から推測できても明記されていない説明は加えない。
- source_word: קָרָא
  choice: 呼び集めた
  rationale: ここでは複数の者を所定の場へ招集する意味が自然であり、日本語の「呼んだ」より文脈が明瞭になる。ただし一般的な「呼んだ」も可能なので脚注に示した。
- source_word: לְאַהֲרֹן
  choice: アロン
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: וּלְבָנָיו
  choice: とその息子たち
  rationale: 祭司職に関わる文脈で、בנים はアロンの男子を指すため、「子どもたち」ではなく「息子たち」とした。
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: またイスラエルの長老たち
  rationale: 共同体を代表する指導者たちを表す定着した表現として「イスラエルの長老たち」とした。「また」により、アロン一行とは別の招集対象であることを自然に示した。
