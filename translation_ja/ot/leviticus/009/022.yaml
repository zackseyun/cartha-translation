source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: ja
  text: それからアロンは民に向かって手を上げ[a]、彼らを祝福した。そして、罪のためのいけにえ[b]、全焼のいけにえ、和解のいけにえ[c]をささげ終えて、下りた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の手を上げ」。ヘブライ語の形は単数だが、祝福の身ぶりとして両手を指すと理解されることも多い。
    reason: lexical_alternative
  - marker: b
    text: または「清めのいけにえ」。
    reason: lexical_alternative
  - marker: c
    text: または「交わりのいけにえ」「平和のいけにえ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 上げ
  rationale: נשׂא は手を目的語とすると「上げる」を意味する。祝福に先立つ身体動作を、自然な現代日本語で表した。
- source_word: יָדוֹ
  choice: 両手
  rationale: マソラ本文の語形は単数「彼の手」だが、祝福の身ぶりとして集合的に理解されることが多い。本文では自然な「両手」とし、語形上の別訳を脚注に残した。
- source_word: אֶל הָעָם
  choice: 民に向かって
  rationale: אֶל の方向性と、手を民の方へ上げた空間的な動作を明確に表す。
- source_word: וַיְבָרְכֵם
  choice: 彼らを祝福した
  rationale: ピエル形の ברך を簡潔かつ直接的に訳した。
- source_word: וַיֵּרֶד
  choice: 祭壇から下りた
  rationale: ירד は「下る」。出発点は原文に明記されないが、直前の祭儀と文脈から祭壇の所から下りたと理解されるため、補足を明示する脚注を付した。
- source_word: מֵעֲשֹׂת
  choice: ささげ終えて
  rationale: מן＋不定詞は、その行為を終えて次の動作へ移ることを示す。祭儀の文脈に即して自然に表した。
- source_word: הַחַטָּאת
  choice: 罪のためのいけにえ
  rationale: חטאת の伝統的な祭儀用語を、一般読者にも意味が伝わる形で表した。「清めのいけにえ」という機能的な訳も脚注に示した。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: עלה は祭壇で全体を焼く種類のささげ物を指す。日本語で祭儀上の区分が明瞭になる定訳を採用した。
- source_word: הַשְּׁלָמִים
  choice: 会食のいけにえ
  rationale: שׁלמים はささげる者が肉を共に食べる祭儀を含むため、「会食」が共同性を分かりやすく示す。ただし「和解のいけにえ」「交わりのいけにえ」などの訳語も可能なので脚注に残した。
theological_decisions:
- issue: レビ記の祭儀用語の訳し分け
  choice: 「罪のためのいけにえ」「全焼のいけにえ」「会食のいけにえ」と訳し分ける
  alternative: חטאתを「清めのいけにえ」、שׁלמיםを「和解のいけにえ」または「交わりのいけにえ」とする
  rationale: 三種類のささげ物の区別を保ちつつ、現代の一般読者に機能や形態が伝わる表現を用いた。各語の神学的な含意を一つに限定しないよう、主要な別訳を脚注に示した。
- issue: וַיֵּרֶד の出発点
  choice: 文脈を踏まえて「祭壇から下りた」とする
  alternative: 原文どおり単に「下りた」とする
  rationale: 祭壇から下りたという理解が自然だが、原文に「祭壇」は明記されていないため、本文で補足し、その事実を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いけにえ」は一般読者にも通じる祭儀語として用い、専門的な区分は修飾語で示した。原文の単数形、祭儀語の意味幅、補足された場所は脚注で透明性を確保した。
