  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ja
  text: 祭司は償いのささげ物[a]の子羊を屠り、その償いのささげ物の血をいくらか取って、清めを受けている者の右の耳たぶ[b]と、右手の親指と、右足の親指につける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪過のささげ物」。ヘブライ語は、罪責や損害に対処するための特定のささげ物を指す。
    reason: lexical_alternative
  - marker: b
    text: または「右耳の端」。ヘブライ語は耳の外側の先端部を指すが、厳密な部位には幅がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: 屠る
  rationale: 祭儀において動物を殺してささげる行為を表すため、一般的な「殺す」よりも犠牲を屠るという文脈に適した語を選んだ。
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: 償いのささげ物の子羊
  rationale: 構文上、אָשָׁםとして指定された子羊を指す。「償いのささげ物」とすることで、単なる罪責ではなく特定の祭儀的供え物であることを示した。
- source_word: אָשָׁם
  choice: 償いのささげ物
  rationale: レビ記における特定の犠牲を指す祭儀用語として訳した。「償い」は損害や罪責への対処という語感を保ち、「ささげ物」によって具体的な供え物であることを明示する。
- source_word: מִדַּם הָאָשָׁם
  choice: その償いのささげ物の血をいくらか
  rationale: 前置詞מִןの部分を表す用法を「いくらか」で明示し、血の全量ではなく一部を取ることを自然な日本語で表した。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳たぶ
  rationale: 耳の外側の突き出た端を指す語であり、儀式の適用箇所として自然で具体的な日本語を採用した。ただし厳密な部位には語義上の幅があるため脚注を付した。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている者
  rationale: ヒトパエル分詞が示す、清めの過程にある人という継続的・受動的な意味を保った。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手の親指
  rationale: בֹּהֶןは手について用いられる場合、親指を指すため、現代日本語の通常の解剖学的名称で訳した。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右足の親指
  rationale: בֹּהֶןは足について用いられる場合、足の第一趾を指す。一般読者に最も分かりやすい「足の親指」とした。
- source_word: וְ
  choice: そして／と
  rationale: 連続する祭儀動作を、日本語では文の区切りと並列助詞によって自然に表した。接続関係そのものは保持している。
theological_decisions:
- issue: 祭儀用語אָשָׁםの訳語
  choice: 償いのささげ物
  alternative: 罪過のささげ物／罪責のささげ物
  rationale: この語が抽象的な罪責ではなく、レビ記に定められた特定の供え物を指すことを明確にした。「償い」は語の修復的側面を伝えるが、後代の特定の贖罪理論を本文に持ち込まない表現である。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀本文にふさわしい格調を保った。「屠る」「祭司」「清め」などの主要語は簡潔で一貫した祭儀的表現とし、動作の順序が追いやすい文にした。
