    issue: 「彼は」の指示対象が不明確
    rationale: ヘブライ語の動詞は文脈上の主語を含意するが、日本語の「彼」は直前の文脈が本文単体にないため曖昧である。続く「祭司は」とも主語が交替したように読める。祭司を明示して一連の手順として示すのが安全である。
