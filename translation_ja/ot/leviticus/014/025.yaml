  source_fidelity: 概ね原文に忠実である。אָשָׁםを特定の祭儀的ささげ物として訳し、血の一部を取ること、清めの過程にある者、右の耳・手・足への塗布を適切に伝えている。ただし、原文で文脈上の主語となる祭司を「彼は」とするのは、日本語では指示対象が不明確になりやすい。
  naturalness: 「彼は…屠る。祭司は…」は、同一人物を指す可能性が高い連続動作を不自然に分断し、現代標準日本語としても「彼」の先行詞が曖昧である。「祭司は」を冒頭に置き、「その血」と受ける形が明瞭で自然である。
  terminology: 「償いのささげ物」はאָשָׁםの有力で自然な訳語であり、「罪過のささげ物」を別訳として示す脚注も妥当である。「耳たぶ」は本文の分かりやすい訳として採用可能だが、語が耳の端・先端部を指しうることを脚注で保持している。「屠る」「祭司」「清め」は祭儀文脈にふさわしい。
  issues:
