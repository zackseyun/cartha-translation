id: LEV.14.38
reference: Leviticus 14:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/יָצָ֧א הַ/כֹּהֵ֛ן מִן הַ/בַּ֖יִת אֶל פֶּ֣תַח הַ/בָּ֑יִת וְ/הִסְגִּ֥יר אֶת הַ/בַּ֖יִת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: ja
  text: そこで祭司は家から出て、家の入り口まで行き、その家を七日間閉鎖する[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その家を七日間閉めておく」。ヘブライ語の動詞は、調査のため一定期間、出入りできないようにすることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: そこで……出て
  rationale: 祭儀上の手順を進める接続表現として、現代日本語で自然な「そこで」を用い、後続動作につなげた。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記の祭儀・清浄規定における כֹּהֵן の標準的な訳語。
- source_word: מִן הַבַּיִת
  choice: 家から
  rationale: יָצָא とともに、家の内部から外へ出ることを簡潔に表す。
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: 家の入り口まで
  rationale: פֶּתַח は開口部または入り口を指す。「まで」によって、祭司が家を出て入り口の所へ移るという動作を自然に表した。物理的な扉の存在は断定しない。
- source_word: וְהִסְגִּיר
  choice: 閉鎖する
  rationale: סגר のヒフィル形は、ここでは一定期間その家への出入りを断つ措置を表す。「隔離する」ほど解釈を加えず、現代日本語で手続きの意味が明確な「閉鎖する」とした。
- source_word: אֶת הַבַּיִת
  choice: その家を
  rationale: 目的語標識は訳さず、文脈上すでに特定された家であることを「その」で自然に示した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す自然な現代日本語。
