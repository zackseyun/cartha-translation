  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: ja
  text: それから祭司は、左の手のひらにある油の一部を、右手の指で、ヤハウェの前に七回振りかける。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: それから……振りかける
  rationale: ヒフィル形は祭儀の文脈で液体を「振りかける」ことを表す。接続詞は一連の手順を自然に示す「それから」とした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀を執行する者を指す標準的な訳語。
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: 右手の指で
  rationale: 原文は単数の「指」と右側を明示する。日本語では「右手の指で」が自然であり、儀式上の指定も保つ。
- source_word: מִן הַשֶּׁמֶן
  choice: 油を……取り
  rationale: 前置詞 מִן の部分的・起点的意味を、手のひらの油の一部を指で取って振りかけるという日本語の動作表現で示した。
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: 左の手のひらにある
  rationale: כַּף はここでは油を載せる「手のひら」を指すため、「左手」だけでなく部位を明示した。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七回
  rationale: 回数を表す自然で正確な訳。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の臨在・祭儀的位置関係を「前で」とし、神名 יהוה は固有名として「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を明記しているため、その区別を保つ音写を採用した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある祭儀法規の文体とした。「油を右手の指で取り」は日本語として動作を明確にする補いだが、原文の部分を示す מִן と手段を示す בְּ の関係に基づく。
