id: LEV.14.17
reference: Leviticus 14:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: ja
  text: 祭司は、自分の手のひらにある残りの油からいくらかを、清めを受けている人の右の耳たぶ[a]と、右手の親指と、右足の親指に、罪過のいけにえの血の上につける[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「右耳の先」とも訳せる。ヘブライ語は耳の外側の先端部分を指す。
    reason: lexical_alternative
  - marker: b
    text: すでに罪過のいけにえの血をつけた同じ箇所に、油を重ねてつけるという意味。
    reason: clarification
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: 残りの油からいくらかを
  rationale: מִן の部分を示す働きと、יֶתֶר の「残り」という意味を自然な日本語で表した。油の全量ではなく、その一部を用いることも文脈に即して明確になる。
- source_word: עַל כַּפּוֹ
  choice: 自分の手のひらにある
  rationale: כַּף は手のひら、または手のくぼみを指す。日本語では「手のひら」が明瞭であり、所有者が祭司であることを「自分の」で自然に示した。
- source_word: יִתֵּן
  choice: つける
  rationale: נתן は広く「置く、つける」を意味する。この清めの儀式では身体の特定箇所に油を塗布する動作なので、「つける」が自然で過度に具体化しない。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳たぶ
  rationale: תְּנוּךְ は耳の外側の先端部分を指す語で、この儀式の文脈では「耳たぶ」が現代日本語で最も分かりやすい。語義上の別案は脚注に残した。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている人
  rationale: 再帰・受動的な過程を表す分詞であり、儀式上の清めを受けている最中の人を示す。「清められる人」より自然に過程性を表現した。
- source_word: בֹּהֶן יָדוֹ / בֹּהֶן רַגְלוֹ
  choice: 右手の親指／右足の親指
  rationale: בֹּהֶן は手では親指、足では足の親指を指す。日本語では身体部位を明示するこの表現が自然である。
- source_word: עַל דַּם הָאָשָׁם
  choice: 罪過のいけにえの血の上に
  rationale: עַל の空間的な関係を保持し、すでに血をつけた箇所に油を重ねる儀礼的順序を表した。אָשָׁם はレビ記の供犠用語として「罪過のいけにえ」とした。
theological_decisions:
- issue: אָשָׁם の供犠用語としての訳
  choice: 罪過のいけにえ
  alternative: 償いのいけにえ
  rationale: אָשָׁם は罪責や賠償責任に関わる特定の供え物を指す。「罪過のいけにえ」はその技術的区別を保ちつつ、後代の特定教派的解釈を持ち込まない。
- issue: 油と罪過のいけにえの血との位置関係
  choice: 血の上につける
  alternative: 血をつけた同じ箇所につける
  rationale: 原文の עַל を形式的に保持し、油が先につけられた血の上に重ねられるという自然な理解を本文に示した。ただし、重点を同一箇所への塗布と見る余地を脚注に残した。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で厳かな叙述とした。「清め」「罪過のいけにえ」などレビ記の儀礼用語は一貫性を優先し、動作は自然な日本語の「つける」で表した。
