source:
  edition: WLC
  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: ja
  text: 祭司は、全焼のささげ物と穀物のささげ物を祭壇の上にささげ、その人のために贖いを行う。こうして、その人は清くなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: ささげ
  rationale: עלהのヒフィル形は、いけにえの文脈では単に運び上げることではなく、祭壇でささげることを表す。自然な現代日本語として「ささげる」とした。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: עלהは、祭壇で全体を焼くいけにえを指す専門語。「全焼のささげ物」はその特徴を明確に示し、現代の読者にも意味を取りやすい。
- source_word: הַמִּנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀規定ではמנחהは穀物を材料とするささげ物を指すため、広義の「贈り物」ではなく文脈上の意味を採った。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を表す語尾を伴うが、この祭儀文脈では祭壇上でささげる行為を表す。「祭壇の上で」が日本語として自然である。
- source_word: וְכִפֶּר עָלָיו
  choice: その人のために宥めを行う
  rationale: כפרは祭司的祭儀の文脈で宥めを成し遂げる行為を表し、עליוはその人のため・その人に代わってという受益的関係を示す。「贖罪する」だけに限定せず、祭儀的意味を保つ表現とした。
- source_word: וְטָהֵר
  choice: こうして、その人は清くなる
  rationale: Qal形は儀式後に成立する清い状態を述べる。「清められる」と受動的過程に言い換えず、結果として「清くなる」とした。「こうして」は連続する結果関係を自然に示す。
theological_decisions:
- issue: 祭司律法における「清さ」の性質
  choice: 祭儀上の状態を表す「清くなる」
  alternative: 道徳的に純潔になる／清められる
  rationale: レビ記14章は皮膚病による汚れから共同体と礼拝へ復帰するための祭儀を扱う。したがって道徳的変化を読み込まず、原文の単純な状態表現を保った。
- issue: כפרの訳語
  choice: 宥めを行う
  alternative: 贖罪する／罪を償う
  rationale: この節の直接の文脈は道徳的罪だけでなく祭儀上の汚れからの回復であるため、「罪」に限定する語を本文へ補わず、祭儀的なכפרの幅を保った。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った祭儀法規の文体。原文の二つの動作を自然な日本語にまとめつつ、最後のוְטָהֵרは結果を示す独立した文として際立たせた。脚注を必要とするほどの本文上の異読はない。
