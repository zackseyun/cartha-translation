  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: ja
  text: これは、ツァラアト[a]のあらゆる病変と、頭部またはあごひげの部位に生じる皮膚の異常[b]についての律法である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、皮膚や毛のある部分に現れる異常だけでなく、衣服や家屋に生じる異常にも用いられるヘブライ語。伝統的に「らい病」と訳されることがあるが、現代のハンセン病だけを指す語ではない。
    reason: lexical_clarification
  - marker: b
    text: ヘブライ語は、特に頭髪部またはあごひげの部分に生じる特定の症状を指す。その正確な医学的相当語は不明で、「鱗状の発疹」または伝統的には「かさ」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: これは……についての律法である
  rationale: 章末の総括定型として、指示代名詞と名詞文を自然な現代日本語にしつつ、תּוֹרָהの法的・手続き的性格を「律法」で示した。
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: あらゆるツァラアトの患部
  rationale: נֶגַעは診察対象となる徴候・患部を指す。「症例」より身体上の現れを保つ「患部」とした。צָרַעַתは現代のハンセン病と同一視できず、皮膚以外にも用いられる語なので音写し、注で説明した。
- source_word: וְלַנָּתֶק
  choice: 頭やあごひげにできる皮膚の異常
  rationale: נֶתֶקはレビ記13章の用法上、頭髪部またはあごひげの部分に現れる特定の異常を指すが、正確な現代医学上の名称は不明である。文脈上の部位を明示し、特定疾患への断定を避けた。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、章末の法的総括にふさわしい簡潔で荘重な文体とした。医学的に誤解を招く「らい病」「白癬」などの断定的名称は本文で避け、原語の範囲と不確実性を脚注に保った。
