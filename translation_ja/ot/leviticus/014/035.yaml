source:
  edition: WLC
  text: וּ/בָא֙ אֲשֶׁר ל֣/וֹ הַ/בַּ֔יִת וְ/הִגִּ֥יד לַ/כֹּהֵ֖ן לֵ/אמֹ֑ר כְּ/נֶ֕גַע נִרְאָ֥ה לִ֖/י בַּ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/035.yaml
  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: ja
  text: その家の持ち主は祭司のもとに行き、こう告げなければならない。「家に、患部のようなもの[a]が見えます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「災い（患部）のようなもの」。これは現代医学上の診断名ではなく、家に見られた異常な状態・箇所を指しうる。持ち主は確定的な判定をせず、自分に見えたこととして祭司に告げている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 行き
  rationale: 法的手順の中で、接続詞を伴う完了形は次に行う行為を示す。日本語では後続の「報告しなければならない」と一続きにして、自然に手順を表した。
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: その家の持ち主
  rationale: 直訳は「その家が彼に属する者」。現代日本語で所有関係を明確かつ自然に表すため「持ち主」とした。
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: 祭司のところへ行き……と報告しなければならない
  rationale: נגדのヒフィル形は「知らせる、報告する」。祭司への公的な届け出という文脈を「報告する」で表した。
- source_word: כְּנֶגַע
  choice: 災いのようなもの[a]
  rationale: 接頭辞כְּは類似・近似を示し、持ち主が状態を確定していないことを保つ。נֶגַעはレビ記では人・衣服・家に現れる災い、患部、異常な箇所を指し得るため、現代医学的な「感染」と限定せず「災い」とした。
- source_word: נִרְאָה לִי
  choice: 現れたように見えます
  rationale: ראהのニファル形とלִיを踏まえ、現象が現れたことと、それが話者自身の観察にすぎないことの双方を表した。
- source_word: בַּבָּיִת
  choice: 家に
  rationale: 前置詞בְּはここでは異常が生じた場所・構造物を広く示すため、簡潔に「家に」とした。
theological_decisions:
- issue: 家に現れた状態を持ち主が確定診断しているか
  choice: 「災いのようなもの」「ように見えます」とし、暫定的な観察として訳す
  alternative: 「家に災いが現れました」と断定的に訳す
  rationale: 原文のכְּとלִיは、祭司の判定に先立って持ち主が断定を避けて報告する構造を示す。この法的・祭儀的な区別を訳文でも維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司への正式な届け出にふさわしく「報告しなければならない」とした。引用部は持ち主の限定的な観察を自然な敬体で表した。
