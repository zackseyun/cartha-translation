  to: その家の持ち主は祭司のもとに行き、こう告げなければならない。「家に、患部のようなもの[a]が見えます。」
  rationale: 原文の手順（家の持ち主が祭司のもとへ行き、告げる）を明瞭にし、נֶגַעが家に見られる異常箇所を指すことが伝わるよう「患部のようなもの」とした。「ようなもの」でכְּの近似を、「見えます」で話者の限定された観察を保持する。注は語の幅を示しつつ、現代的な診断への過度な限定を避ける。
