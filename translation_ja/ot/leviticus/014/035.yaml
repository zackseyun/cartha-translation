  source_fidelity: 原文は「その家を所有する者が来て、祭司に告げて言う」という手順と、כְּנֶגַע（災い・患部に似たもの）およびנִרְאָה לִי（私には見える／現れた）の限定的な観察を表す。現行訳は手順を概ね保つが、「災いのようなもの」は日本語では目に見える家の異常という文脈が伝わりにくい。
  naturalness: 「祭司のところへ行き……と報告しなければならない」も理解できるが、「祭司のもとに行き、こう告げなければならない」のほうが、原文の来訪・告知・引用の順序を自然に表す。引用内は「見えます」とすることで、話者自身の観察であることを簡潔に保てる。
  terminology: נֶגַעを現代医学上の感染症と断定しないことは適切である。ただし「災い」だけでは抽象的な不幸・災害を連想させるため、「患部のようなもの」として、家に見出された異常箇所を指す祭儀的用語の射程を注で補う。
