source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: ja
  text: それから、ほかの石を取って、石の代わりに据えなければならない。[a] また、別の土[b]を取って、その家を塗り直さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「石の下に持って来る」。ここでは、取り除いた石の代わりに新しい石を入れる、という意味。
    reason: lexical_alternative
  - marker: b
    text: 「土ぼこり」とも訳せる。ここでは、家の壁を塗り直すための土質の材料を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: そして、…取って…なければならない
  rationale: 祭儀規定の手順を示す接続ワウと完了形。文脈上の順序と規定としての拘束性を、現代日本語の自然な法令調で表した。
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: 別の石
  rationale: 取り除いた石に代わる石を指す簡潔な表現。
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: 元の石の代わりに据え
  rationale: תַּחַת はここでは物理的な「下」ではなく代替を表す。「持って来る」を逐語的に重ねず、家の修復という文脈に即して「据える」とした。逐語形は脚注に示した。
- source_word: וְעָפָר אַחֵר
  choice: 別の土
  rationale: עָפָר の基本義である「土、土ぼこり」を保ち、仕上げ材そのものを意味する「しっくい」と断定しなかった。家を塗るための材料であることは本文の動詞と脚注で明らかにした。
- source_word: יִקַּח
  choice: 取って…なければならない
  rationale: ヘブライ語は三人称男性単数で、直前の複数形から数が変わる。日本語では主語を明示せず、数の不自然な調和も避けた。
- source_word: וְטָח אֶת הַבָּיִת
  choice: その家を塗り直さなければならない
  rationale: טוח は表面を塗る、上塗りする意。すでに処置された家を新しい材料で再び塗る手順なので、「塗り直す」が自然で文脈に適う。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀法の規定として「なければならない」を用い、原文の複数形から単数形への移行は、日本語で主語を補わないことにより過度に解消しない。脚注記号は該当語句の直後に配置した。
