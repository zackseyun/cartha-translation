source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/חִלְּצוּ֙ אֶת הָ֣/אֲבָנִ֔ים אֲשֶׁ֥ר בָּ/הֵ֖ן הַ/נָּ֑גַע וְ/הִשְׁלִ֤יכוּ אֶתְ/הֶן֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: ja
  text: そこで祭司は、患部のある石[a]を取り外し、町の外の不浄な場所に捨てるよう命じる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その中に患部がある石」。
    reason: 原文が、患部（נֶגַע）が石の中にあるとの位置関係で表現していることを示すため。
lexical_decisions:
- source_word: וְצִוָּה
  choice: そこで……命じる
  rationale: 接続詞付き完了形が祭儀手順の次の段階を示すため、現代日本語の規定文として「そこで」と非過去形「命じる」で表した。
- source_word: וְחִלְּצוּ
  choice: 取り外し
  rationale: 石を建物から引き抜いて除去する意味を、作業内容に即した自然な日本語で表した。
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: 患部のある石
  rationale: נֶגַעはレビ記13―14章で人、衣服、家屋に現れる異常箇所を指す。現代の特定の病名や菌を断定せず、石に認められる問題箇所という意味を簡潔に表した。直訳的な構造は脚注に示した。
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: 捨てる
  rationale: この文脈では単に投げる動作より、取り除いた石を指定場所に廃棄することが要点なので「捨てる」とした。
- source_word: אֶל מִחוּץ לָעִיר
  choice: 町の外
  rationale: 移動先が居住区域の外であることを自然に表す。「町」は古代イスラエルの都市・集落を指す文脈に適する。
- source_word: אֶל מָקוֹם טָמֵא
  choice: 汚れた場所
  rationale: טָמֵאはレビ記の祭儀的な清浄・不浄の分類を示すため、物理的な汚さだけに限定されない定訳「汚れた」を用いた。
theological_decisions:
- issue: נֶגַעの家屋における意味
  choice: 患部
  alternative: 災厄、かび、感染箇所
  rationale: 原語は異常な徴候・打撃・患部を幅広く指し、現代科学上の「かび」や医学的な「感染」と断定できない。「患部」は問題の生じた箇所を示しつつ、その正体に関する原文の非限定性を保つ。
- issue: טָמֵאの祭儀的意味
  choice: 汚れた
  alternative: 不浄な、汚染された
  rationale: 祭儀上の状態・指定を表す語であり、道徳的な悪や通常の衛生状態と同一視しない。本文では分かりやすい「汚れた」を採用した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語の祭儀規定文。「命じる」「捨てる」で手順を自然に示し、「患部」「汚れた」によって現代医学的断定を避けながらレビ記の清浄規定の語感を保った。
