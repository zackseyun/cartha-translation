source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: ja
  text: 清めを受ける人は、衣服を洗い、すべての毛をそり落とし、水で身を洗う。そうすれば、その人は清くなる。その後、宿営の中に入ることができる[a]。ただし、七日間は自分の天幕の外にとどまらなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「宿営の中に入る」。ヘブライ語は、単純な未来（「入る」）とも、許可とも取れる。ここでは、なお制限はあるものの、再び宿営に入ることが許されるという意味に訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている者
  rationale: ヒトパエル分詞が、規定された儀式的清めの過程にある人を指すことを表す。道徳的な意味に限定せず、受け身に近い儀礼上の意味を自然な日本語で伝える。
- source_word: כִבֶּס ... בְּגָדָיו
  choice: 衣服を洗い
  rationale: כִּבֵּס は衣服を洗うことを表す。現代日本語として明瞭な「衣服」を用いた。
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: すべての毛をそり
  rationale: כָּל による全体性を保ち、身体の毛を全面的にそる行為として訳した。
- source_word: רָחַץ בַּמַּיִם
  choice: 水を浴びる
  rationale: 衣服を洗う行為と区別し、儀礼上、身体を水で洗うことを自然に表す。
- source_word: וְטָהֵר
  choice: こうしてその人は清くなる
  rationale: 一連の洗浄行為の結果として儀礼的に清い状態になることを示す。「こうして」で文脈上の結果と順序を明確にした。
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: 宿営の中に入ることができる[a]
  rationale: 未完了形は単純な未来・指示とも許可とも取り得る。続く天幕外滞在の制限から、宿営への再入域が許される意味を本文に採用し、別の読みを注記した。
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: ただし、七日間は自分の天幕の外にとどまらなければならない
  rationale: יָשַׁב はここでは一時的に滞在する意味。宿営への再入域と、自宅である天幕には戻れないこととの対比を「ただし」で自然に示した。
theological_decisions:
- issue: טהר による儀礼的清浄
  choice: 「清めを受けている」「清くなる」
  alternative: 「浄化されている」「清浄になる」
  rationale: 文脈は皮膚の患いから回復した人の儀礼上の身分回復であり、内面的・道徳的な清さに限定しない。レビ記で一般読者にも理解しやすい「清い」を保った。
- issue: 宿営への再入域が命令か許可か
  choice: 「入ることができる」
  alternative: 「入る」または「入らなければならない」
  rationale: ヘブライ語の未完了形自体は単純未来・指示と許可の双方を許す。直後に天幕外で七日間過ごす制限があるため、限定付きの再入域許可として本文に採用し、曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宿営」「天幕」はレビ記の歴史的・儀礼的場面に適した語として維持した。ヘブライ語の接続詞の連続は、日本語の自然な流れに合わせて「こうして」「その後」「ただし」とした。
