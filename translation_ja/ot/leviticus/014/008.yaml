revisions:
- from: 清めを受けている者は、衣服を洗い、すべての毛をそり、水を浴びる。こうしてその人は清くなる。その後、宿営の中に入ることができる[a]。ただし、七日間は自分の天幕の外にとどまらなければならない。
  to: 清めを受ける人は、衣服を洗い、すべての毛をそり落とし、水で身を洗う。そうすれば、その人は清くなる。その後、宿営の中に入ることができる[a]。ただし、七日間は自分の天幕の外にとどまらなければならない。
