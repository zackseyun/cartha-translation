  naturalness: 「清めを受けている者」は意味は通るが、進行中の状態を強く感じさせ、現代標準日本語としてやや硬く不自然である。「清めを受ける人」のほうが、儀礼の対象者を自然に指せる。「すべての毛をそり」も「すべての毛をそり落とし」とすれば、完全な除去という動詞の含意が明瞭になる。
  terminology: 「清め」「清い」「宿営」「天幕」は、儀礼的文脈と歴史的場面に適切である。「清い」は道徳的意味にも用いられ得るが、この文脈では儀礼的状態を無理なく表す。脚注は訳文の許可的理解と整合している。
