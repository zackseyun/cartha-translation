id: LEV.14.21
reference: Leviticus 14:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: ja
  text: しかし、その人が貧しく、十分な資力がないなら[a]、彼のために贖いを行うため、揺り動かして献げる償いのいけにえとして雄の子羊一匹を取り、穀物のささげ物として油を混ぜた上等の小麦粉一エファの十分の一と、油一ログ[b]を取る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「その手が届かない」。ここでは、必要な供え物を用意するだけの資力がないことをいう。
    reason: lexical_alternative
  - marker: b
    text: 「ログ」は、古代イスラエルの祭儀法で用いられた小さな液量単位。
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: 貧しい
  rationale: 経済的に乏しい状態を表す、この法的文脈で最も直接的で自然な訳語。
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: 十分な資力がない
  rationale: 字義は「その手が届かない」だが、ここでは供え物を用意できる経済力がないことを指す。比喩の意味を明確にし、脚注で字義を示した。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 雄の子羊一匹
  rationale: כֶּבֶשׂ の性別を含む語彙的な具体性と祭儀規定の厳密さを反映した。
- source_word: אָשָׁם
  choice: 償いのいけにえ
  rationale: 罪責とその償いに関わる独自の供犠区分を示しつつ、現代の一般読者にも理解しやすい表現とした。
- source_word: לִתְנוּפָה
  choice: 奉献のしぐさをしてささげる
  rationale: 子羊とは別の供え物ではなく、その子羊を振る動作によって祭儀的に提示することを表す。
- source_word: לְכַפֵּר עָלָיו
  choice: 贖罪のために
  rationale: 祭司文書における כפר の祭儀的・神学的な力を保ちつつ、特定の贖罪理論には限定しない。
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: 上等の小麦粉一エファの十分の一
  rationale: עִשָּׂרוֹן を祭儀法で用いられる一エファの十分の一として明示し、סֹלֶת は精製された良質な小麦粉として訳した。
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 粉と油を混ぜ合わせた状態を明快な現代日本語で表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物として
  rationale: レビ記の文脈で独自の供犠区分を指すため、単なる「供え物」より具体的に訳した。
- source_word: לֹג שָׁמֶן
  choice: 油一ログ
  rationale: 特定の古代イスラエルの液量単位であるため換算を断定せず、名称を保持して脚注で説明した。
theological_decisions:
- issue: 祭司法における供犠用語の訳し分け
  choice: 「償いのいけにえ」「奉献のしぐさ」「贖罪」「穀物のささげ物」として各祭儀概念を区別する。
  alternative: 一般化して「供え物」「儀式としてささげる」などと訳す。
  rationale: ヘブライ語本文が区別する供犠の種類と行為を保ち、特定教派の贖罪理解には踏み込まないため。
- issue: לִתְנוּפָה が示すもの
  choice: 償いのいけにえである子羊に対して奉献のしぐさを行うこととして訳す。
  alternative: 子羊とは別の区分である「奉献物」として訳す。
  rationale: 構文上、同じ子羊が אָשָׁם であり、振る動作によって提示されるのであって、別個の供え物が追加されるわけではない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。長いヘブライ語の法文を二文に分けて読みやすくした。「取る」を反復して、雄の子羊、小麦粉、油のすべてが命じられた品目であることを明確にした。
