  to: しかし、その人が貧しく、十分な資力がないなら[a]、彼のために贖いを行うため、揺り動かして献げる償いのいけにえとして雄の子羊一匹を取り、穀物のささげ物として油を混ぜた上等の小麦粉一エファの十分の一と、油一ログ[b]を取る。
