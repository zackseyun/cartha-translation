  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: ja
  text: 祭司はその一匹の雄の子羊を取り、油一ログ[b]とともに償いのささげ物[a]として献げる。そして、それらをヤハウェの前で揺り動かして献げる儀式を行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪過のささげ物」。このささげ物は、罪責と、それに伴う償いに関わる。
    reason: lexical_alternative
  - marker: b
    text: 「ログ」は、古代イスラエルで用いられた少量の液体の単位。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: 祭司は…取り
  rationale: 接続詞付き完了形が祭儀手順の進行を示すため、前後の連続性を保ちつつ、日本語では自然な手順表現とした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀的文脈における標準的な訳語。
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: その一匹の雄の子羊
  rationale: 定冠詞と数詞による特定性を「その一匹」で表し、כֶּבֶשׂと周辺文脈が示す雄の子羊を明示した。
- source_word: וְהִקְרִיב אֹתוֹ
  choice: 献げる
  rationale: קרבの使役形は祭儀で供え物を近づけて差し出すことを指す。「献げる」は犠牲処理の細部を過度に限定せず、現代日本語として自然である。
- source_word: לְאָשָׁם
  choice: 償いのささげ物として
  rationale: אָשָׁםは罪責だけでなく損害の償いを含み得る祭儀上の術語であり、「償いのささげ物」はその機能を明瞭に伝える。別訳は脚注に示した。
- source_word: לֹג הַשָּׁמֶן
  choice: 油一ログ
  rationale: לֹגは特定の液量単位なので近似換算せず、固有の単位名として音写した。
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: それらを…奉献物として揺り動かす
  rationale: 動詞と同語根の名詞が示す祭儀的な揺り動かしを動作として明示し、תְּנוּפָהの奉献・提示の性格も表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵיを祭儀的な「前で」とし、神名יהוהは固有名として「ヤハウェ」と表記した。
theological_decisions:
- issue: אָשָׁםの祭儀的意味
  choice: 償いのささげ物
  alternative: 罪過のささげ物
  rationale: この語には罪責と賠償・償いの両面がある。「償い」は後者を分かりやすく示すが、伝統的な別訳も可能なので脚注で保持した。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が四文字神名を直接用いているため、称号に置き換えず固有名として訳した。
translation_notes:
  register: 祭儀法規にふさわしい簡潔で格調ある現代標準日本語とした。専門単位「ログ」は保持して脚注で説明し、祭儀用語は一般読者にも意味が推測できる表現を優先した。
