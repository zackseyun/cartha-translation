id: LEV.14.13
reference: Leviticus 14:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: ja
  text: そして、その子羊を、罪のためのいけにえ[a]と全焼のいけにえを屠る場所、すなわち聖なる場所で屠る。罪のためのいけにえと同じく、償いのいけにえ[b]は祭司のものだからである。これは最も聖なるものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪のためのいけにえ」は「清めのいけにえ」とも訳せる。ヘブライ語 חַטָּאת は、祭司法では儀式による清めの働きを強調して理解されることがある。
    reason: lexical_alternative
  - marker: b
    text: 「償いのいけにえ」は「罪過のいけにえ」とも訳せる。ヘブライ語 אָשָׁם は、罪責と、それに伴う償いの両面を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: そして、…屠る
  rationale: 祭儀的な動物の殺処理を表す標準的な動詞なので、一般的な「殺す」ではなく、犠牲祭儀にふさわしい「屠る」とした。文脈上、法規として命じられているため、日本語では主語を明示せず現在形で自然に表した。
- source_word: הַכֶּבֶשׂ
  choice: その子羊
  rationale: 直前の文脈で指定された犠牲動物を指す。語自体は子羊を意味し、ここでは文脈が性別をすでに特定しているため「雄」を重ねなかった。
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: …を屠る場所
  rationale: 三人称単数形は法文で一般的・不定的な行為者を表し得る。特定の一人を想定する「彼が」より、日本語の無主語表現が自然である。
- source_word: הַחַטָּאת
  choice: 罪のためのいけにえ
  rationale: 伝統的な祭儀区分である「罪祭」の意味を平明に示しつつ、現代の一般読者にも理解しやすい表現とした。清めの機能を強調する解釈は脚注に残した。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: 犠牲全体を焼き尽くす עֹלָה の祭儀的特徴を明確に表し、「焼き尽くす献げ物」より簡潔な用語とした。
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: 聖なる場所
  rationale: 定冠詞を伴い、犠牲を屠るために定められた聖域内の場所を指す。「聖所」は建造物内部を指すと誤解され得るため避けた。
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: 罪のためのいけにえと同じく、償いのいけにえは祭司のものだからである
  rationale: כַּחַטָּאת の類比と לַכֹּהֵן の祭司への帰属を明瞭に表した。אָשָׁם は罪責だけでなく償い・賠償との関連を持つため「償いのいけにえ」とした。
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: これは最も聖なるものである
  rationale: ヘブライ語の強意・最上級的構文を、祭儀上の高度な聖性区分として自然な現代日本語で表した。
theological_decisions:
- issue: 祭司法における חַטָּאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: 語は罪との関係と祭儀的な清めの機能の双方を含み得る。本文では伝統的な犠牲区分との連続性を保ち、清めを前面に出す有力な理解を脚注で提示した。
- issue: אָשָׁם の訳し方
  choice: 償いのいけにえ
  alternative: 罪過のいけにえ
  rationale: この祭儀用語には罪責と賠償・償いの側面がある。「償い」は現代日本語で理解しやすく、その機能を示す一方、罪責を中心に捉える伝統的な別訳を脚注に残した。
- issue: לַכֹּהֵן が示す関係
  choice: 祭司のもの
  alternative: 祭司のためのもの
  rationale: 文脈は罪のためのいけにえとの類比により、犠牲のうち祭司に帰属する分を述べる。「祭司のもの」は帰属を簡潔に伝え、単に祭司の利益のためという意味に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀法にふさわしい端正さを保った。「いけにえ」で用語を統一し、「屠る」「祭司」「最も聖なるもの」により法規的・祭儀的な調子を維持した。原文の二つの独立した述語文を分け、論理関係を読み取りやすくした。
