source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: ja
  text: そして彼は、家を清めるために[a]、二羽の鳥、杉材、緋色の糸[b]、ヒソプを取る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「家の汚れを除くために」。ここで「清める」と訳したヘブライ語は、祭儀上の罪や汚れを取り除くことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「緋色のより糸」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: そして彼は……取る
  rationale: 接続詞を伴う完了形は、祭儀手順の連続を表す。現代日本語の規定文として自然な非過去形「取る」を用いた。
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: 家を清めるために
  rationale: חטא のピエル形は、この祭儀的文脈では家から汚れを除いて清浄にすることを表す。「罪から清める」と限定せず、儀礼的な意味を保つ「清める」とした。
- source_word: שְׁתֵּי צִפֳּרִים
  choice: 二羽の鳥
  rationale: 本文に明記された数と名詞をそのまま訳し、この節にない「生きた」は補わない。
- source_word: וְעֵץ אֶרֶז
  choice: 杉の木
  rationale: 祭儀に用いる杉材を指す構文。一般読者に分かりやすく、聖書語としても自然な表現を選んだ。
- source_word: וּשְׁנִי תוֹלַעַת
  choice: 緋色の糸
  rationale: 緋色に染めた糸状の祭儀用品を指す表現として、簡潔で自然な訳語を採用した。
- source_word: וְאֵזֹב
  choice: ヒソプ
  rationale: 植物の厳密な同定には議論があるため、広く定着した伝統的名称を用いた。
theological_decisions:
- issue: 家を目的語とする לְחַטֵּא の祭儀的意味
  choice: 「家を清める」と訳す
  alternative: 「家を罪から清める」または「家のために贖いをする」
  rationale: この箇所は汚れの生じた家の清めの儀式を述べている。動詞は道徳的赦免ではなく祭儀的な汚れの除去を表すため、「清める」が文脈に即している。罪や贖いの機序を本文以上に明示せず、語の祭儀的含意は注で示した。
translation_notes:
  register: 明快な現代標準日本語による、簡潔で品位ある祭儀規定文。「彼」は前文脈の祭司を受けるが、この節では名詞を補わず原文の代名詞的な連続性を保った。
