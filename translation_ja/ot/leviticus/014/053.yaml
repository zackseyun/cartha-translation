id: LEV.14.53
reference: Leviticus 14:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: ja
  text: それから祭司は、生きている鳥を町の外の野に放つ。こうして家のために贖いを行い[a]、その家は清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「家を清める」または「家のために償いをする」。ヘブライ語では、儀礼的な清めの文脈で、祭司による贖いを表す語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: それから祭司は…放つ
  rationale: ピエル形は、この儀式で鳥を自由に放つ行為を表す。文脈上の動作主である祭司を補い、接続詞は手順の進行として「それから」とした。
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 生きている鳥
  rationale: 先に殺された鳥との対比を明確に保ち、自然な現代日本語とした。
- source_word: אֶל מִחוּץ לָעִיר אֶל פְּנֵי הַשָּׂדֶה
  choice: 町の外の野に
  rationale: 移動先が町の境界外にある開けた野であることを、簡潔で自然な日本語で表した。
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: こうして家のために贖いを行い
  rationale: 祭司的儀礼における כפר の「贖う／償いをする」という語義を保持した。家を対象とする儀礼的清めという緊張を、単なる「清める」に置き換えず残した。
- source_word: וְטָהֵר
  choice: その家は清くなる
  rationale: 儀式の結果として家が清い状態になることを示す。日本語では主語を明示して指示対象を明確にした。
theological_decisions:
- issue: 家に対して用いられる祭司的な כפר の訳し方
  choice: 家のために贖いを行う
  alternative: 家を清める／家のために償いをする
  rationale: この箇所は家の清めの儀式でありながら、原文は祭司的な贖いの用語を用いる。その神学的緊張を保ち、特定の贖罪理論に限定せず「贖いを行う」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「祭司」は直前の文脈から補った。「野」は開けた田野を指し、「町の外の野に」で原文の二つの方向表現を自然にまとめた。
