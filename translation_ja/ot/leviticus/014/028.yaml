source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: ja
  text: 祭司は、自分の手のひらにある油の一部を、清めを受けている人の右の耳たぶ、右手の親指、右足の親指のそれぞれ、償いのささげ物の血が付けられた箇所に付ける。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「償いのささげ物の血の場所に」。直前の儀式で、その血が右の耳たぶ、右手の親指、右足の親指に付けられた箇所を指す。
    reason: ヘブライ語の簡潔な場所表現と、本文で明示した分配的な意味との対応を示すため。
lexical_decisions:
- source_word: וְנָתַן
  choice: 付ける
  rationale: 基本義は「与える、置く」だが、この儀式では身体の各部に油を施す動作なので、現代日本語として自然な「付ける」とした。
- source_word: מִן הַשֶּׁמֶן
  choice: 油の一部
  rationale: 部分を表す前置詞 מִן を明示し、手のひらの油を全部ではなく、その一部用いることを示した。
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: 自分の手のひらにある
  rationale: כַּף はここでは祭司の手のひらを指す。日本語では所有者を明確にするため「自分の」を補った。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳たぶ
  rationale: 祭司文書の儀礼的文脈で תְּנוּךְ は耳の端、特に耳たぶを指すと理解され、現代日本語で最も明瞭な身体名称を用いた。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている人
  rationale: ヒトパエル分詞が表す、儀礼的な清めの過程にある人という進行的な意味を保った。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手の親指
  rationale: 手についての בֹּהֶן は親指を指す。ヘブライ語の所有表現と右側の指定を自然な日本語にまとめた。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右足の親指
  rationale: 足についての בֹּהֶן は足の親指を指す。日常的で明瞭な表現を選んだ。
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: 償いのささげ物の血が付けられた箇所に
  rationale: 直訳的な「血の場所に」では日本語として意味が取りにくいため、直前の儀式でその血が施された身体上の箇所を指すことが分かるように表現した。
theological_decisions:
- issue: אָשָׁם の訳語
  choice: 償いのささげ物
  alternative: 罪過のいけにえ／罪責のささげ物
  rationale: אָשָׁם は罪責と、その償いに関わる供え物の両面を持つ。ここでは血を用いる祭儀上の供え物を明示しつつ、現代の一般読者にも意味が伝わる「償いのささげ物」とした。
- issue: 末尾の עַל מְקוֹם が指す範囲
  choice: 列挙された三つの身体部位すべてを、先に血が付けられた箇所として示す
  alternative: 最後の右足の親指だけにかかると読む
  rationale: 14:25で血が右耳、右手親指、右足親指のすべてに付けられており、14:28の末尾はそれらと同じ箇所に油を重ねることを要約すると読むのが文脈上自然である。「すなわち」によってこの関係を明示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「清めを受けている人」により儀礼的な過程を表し、「付ける」を反復せず列挙を滑らかにした。脚注記号 [a] は本文末尾の該当表現に置いた。
