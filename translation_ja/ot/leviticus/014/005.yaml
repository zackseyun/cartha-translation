  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/שָׁחַ֖ט אֶת הַ/צִּפּ֣וֹר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: ja
  text: 祭司は、一羽の鳥を土の器に入れた流水の上で屠るように命じる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「生きた水」。湧き水、または流れる新鮮な水を指す。
    reason: 原語の字義を示し、「流水」以外に可能な理解を示すため。
lexical_decisions:
- source_word: וְצִוָּה
  choice: 祭司は命じて
  rationale: 祭儀の手順を示す文脈における継起的・規定的な働きを、自然な現代日本語で表した。
- source_word: וְשָׁחַט
  choice: ほふらせる
  rationale: 形態上は能動形だが、直前の「命じる」を受け、祭司が誰かに実行させるという構文として訳した。祭儀として殺す意味を「ほふる」で示した。
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: 鳥の一羽
  rationale: 前後の文脈で用意された二羽のうち一羽を指すことを、簡潔で自然に示した。
- source_word: כְּלִי חֶרֶשׂ
  choice: 土の器
  rationale: 粘土を焼いて作った容器を指す、簡明で伝統的かつ理解しやすい表現。
- source_word: עַל מַיִם חַיִּים
  choice: 流水を入れた土の器の上で
  rationale: 「生きた水」という慣用句を、よどんでいない自然の水という儀礼上の意味が伝わる「流水」とした。前置詞句の関係は、水が器に入っており、その上で鳥をほふるという具体的な手順として自然に表した。
theological_decisions:
- issue: מַיִם חַיִּים の儀礼的意味
  choice: 流水
  alternative: 生きた水／湧き水／新鮮な水
  rationale: 後代の神学的象徴をこの箇所に持ち込まず、清めの儀礼に用いる、よどんでいない自然の水という意味を優先した。一方、原文の字義は脚注に残した。
- issue: 命令する者と屠る者の関係
  choice: 祭司が命じて、鳥をほふらせる
  alternative: 祭司が命じ、彼が鳥をほふる
  rationale: ヘブライ語の動詞自体は能動形だが、命令の内容または結果として屠殺が行われる構文である。実行者を祭司自身と断定せず、原文に明示されない執行者を補わない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀文としての品位を保った。「ほふる」は日常語ではないが、儀礼的な屠殺を「殺す」と区別して簡潔に表せる語として採用した。
