base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: ja
  text: しかし、石を取り除き、家を削り、塗り直した後に、その異常[a]が再び家に現れて広がるなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異常」に当たるヘブライ語ネガは、レビ記で人、衣服、家に現れる異常な状態を指す専門的な表現。「災い」「病変」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 法的手順の中で新たな条件を提示する接続表現。文脈上の対照を「しかし」で示し、条件を「なら」で自然に表した。
- source_word: יָשׁוּב
  choice: 再び…現れる
  rationale: 患部の再発を表す。日本語では後続の「広がる」と滑らかにつながるよう「再び現れる」とした。
- source_word: הַנֶּגַע
  choice: その患部
  rationale: レビ記で人・衣服・家に生じる異常な状態を指す専門的な語。家そのものの「病気」と断定せず、目に見える異常箇所を自然に表す。
- source_word: וּפָרַח
  choice: 広がる
  rationale: 字義的には芽吹くことを表すが、ここでは患部が再発して拡大する意。「広がる」が現代日本語で明確。
- source_word: בַּבַּיִת
  choice: 家に
  rationale: 場所を示す前置詞を簡潔に表現した。患部が家屋内に現れることを指す。
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: 石を取り除き…後に
  rationale: 直前に命じられた、患部のある石材を抜き取る処置を具体的に表した。
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: 家の内側を削り
  rationale: 家の表面を物理的に削り取る処置。文脈から作業箇所が内壁であることを「内側」で明確にした。
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: 塗り直した後に
  rationale: 削った後で漆喰などを塗る処置を指す。再施工であることを自然な日本語の「塗り直す」で表した。
