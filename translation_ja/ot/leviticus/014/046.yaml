source:
  edition: WLC
  text: וְ/הַ/בָּא֙ אֶל הַ/בַּ֔יִת כָּל יְמֵ֖י הִסְגִּ֣יר אֹת֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: ja
  text: その家が隔離されている間に、そこに入る者は皆、夕方まで汚れる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隔離されている」は、「閉ざされている」または「閉鎖されている」とも訳せる。ヘブライ語は、検査のため祭司の指示のもとでその家が立ち入りを制限されていることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: そこに入る者は皆
  rationale: 定冠詞付き分詞を一般的な規定として捉え、不特定の誰にでも当てはまる法的意味を自然な日本語で表した。接続詞 וְ は、この一節を単独で読んでも不自然にならないよう明示しなかった。
- source_word: אֶל הַ/בַּיִת
  choice: その家に
  rationale: בוא と אֶל の組み合わせが示す、家の中への移動を「入る」に含めた。「その家」は直前から問題となっている家を指す。
- source_word: כָּל יְמֵי
  choice: …間に
  rationale: 隔離措置が続く全期間を表す時間表現として、現代日本語で自然な「…間に」を採用した。
- source_word: הִסְגִּיר אֹתוֹ
  choice: その家が隔離されている
  rationale: סגר はレビ記13―14章の検査手続きにおいて、祭司の管理下で対象を閉鎖・隔離することを指す。現代医療上の検疫に限定しない「隔離」を用い、ヘブライ語の能動形に含まれる行為者は文脈上の祭司として明示せず、家の状態に焦点を置いた。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 儀礼上の汚れた状態になることを表す。法的帰結を簡潔に示し、身体的な不潔さと断定しない聖書用語として「汚れる」を採用した。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 一時的な儀礼上の汚れが継続する期限を示す定型表現として、自然な日本語にした。
theological_decisions:
- issue: 「汚れる」の性質
  choice: 本文では単に「汚れる」とし、儀礼上の状態を文脈に委ねる
  alternative: 「儀礼上、汚れた者となる」
  rationale: 原文は טמא の法的・祭儀的な語彙を用いるが、説明を本文に加えて意味を狭めすぎず、レビ記の文脈にある概念的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、レビ記の法規としての簡潔さと厳粛さを保った。脚注で סגר の語義の幅と祭司による検査手続きという文脈を示した。
