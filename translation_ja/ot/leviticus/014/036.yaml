  text: וְ/צִוָּ֨ה הַ/כֹּהֵ֜ן וּ/פִנּ֣וּ אֶת הַ/בַּ֗יִת בְּ/טֶ֨רֶם יָבֹ֤א הַ/כֹּהֵן֙ לִ/רְא֣וֹת אֶת הַ/נֶּ֔גַע וְ/לֹ֥א יִטְמָ֖א כָּל אֲשֶׁ֣ר בַּ/בָּ֑יִת וְ/אַ֥חַר כֵּ֛ן יָבֹ֥א הַ/כֹּהֵ֖ן לִ/רְא֥וֹת אֶת הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: ja
  text: 祭司は、その異常の箇所[a]を調べるために家に入る前に、家の中の物をすべて運び出すよう命じる。これは、家の中にあるすべての物が汚れたものとならないようにするためである。その後、祭司は家を調べるために入る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しるし」「異常の現れた箇所」。ヘブライ語ネガは、祭司が調べる、異常の現れた箇所またはその状態を指す。伝統的には「災い」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: 命じなければならない
  rationale: 祭儀規定における接続詞付き完了形を、手順上の義務を示す自然な現代日本語で表した。
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: 家の中の物をすべて運び出すよう
  rationale: 複数動詞の不特定の行為者を明示せず、家そのものではなく内容物を取り除く意味が伝わるようにした。
- source_word: לִרְאוֹת
  choice: 調べる
  rationale: 字義は「見る」だが、ここでは祭司による公式な検査を指すため、「調べる」が明瞭で自然である。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: レビ記13―14章で検査対象となる、異常の現れた箇所または状態を指す。現代医学上の特定の病名に限定しない表現とした。
- source_word: וְלֹא יִטְמָא
  choice: 汚れたものとなることはない
  rationale: 道徳的な罪ではなく祭儀上の汚れを表す語として、「汚れたものとなる」を用いた。文脈上、事前に運び出す目的・結果を「そうすれば」で示した。
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: 家の中にある物がすべて
  rationale: 家の内容物全体を指すことを簡潔に表した。
- source_word: וְאַחַר כֵּן
  choice: その後
  rationale: 規定された次の手順への移行を自然に示す。
theological_decisions:
- issue: טמא の祭儀的意味
  choice: 汚れたものとなる
  alternative: 不浄となる／汚される
  rationale: ここでの汚れは道徳的罪責ではなく祭儀上の状態である。「汚れたものとなる」は一般読者に分かりやすく、受動的な「汚される」が含み得る道徳的含意も避けられる。
- issue: נגע の性質
  choice: 患部
  alternative: しるし／異常／災い
  rationale: 家に現れた検査対象の箇所を表しつつ、その原因や医学的・超自然的性質を断定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。祭儀法の手順性を保ちつつ、過度に古風な法令調を避けた。「自分が」は、同じ祭司が命令した後に入るというヘブライ語の主語の連続を自然に示す。
