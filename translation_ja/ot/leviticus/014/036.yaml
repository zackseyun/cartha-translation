revisions:
- from: 祭司は、自分がその患部[a]を調べるために入る前に、家の中の物をすべて運び出すよう命じなければならない。そうすれば、家の中にある物がすべて汚れたものとなることはない。その後、祭司は家を調べるために入る。
  to: 祭司は、その異常の箇所[a]を調べるために家に入る前に、家の中の物をすべて運び出すよう命じる。これは、家の中にあるすべての物が汚れたものとならないようにするためである。その後、祭司は家を調べるために入る。
  rationale: 家屋に関する文脈に即して「患部」を「異常の箇所」に改めました。祭司が入る前に内容物を運び出す目的を、原文の「それによって家の中のすべてのものが汚れたものとならないように」という関係を保って明示しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:20:35Z'
