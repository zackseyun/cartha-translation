  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: ja
  text: 七日目に、その人はすべての毛を剃らなければならない。すなわち、頭の毛、ひげ、眉毛である。すべての毛を剃り、衣服を洗い、体を水で洗わなければならない。そうすれば、その人は清くなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: 七日目に
  rationale: 儀礼手順の次の段階を示す時間表現として、ヘブライ語の連続性を自然な現代日本語で表した。
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: すべての毛をそらなければならない
  rationale: גלחのピエル形が表す毛の除去と、כָּלの包括性を明確にした。日本語では身体全体の体毛を含み得る「毛」が文脈に適する。
- source_word: אֶת רֹאשׁוֹ וְאֶת זְקָנוֹ וְאֵת גַּבֹּת עֵינָיו
  choice: 頭の毛も、ひげも、眉毛も
  rationale: 原文は直訳すれば「頭、ひげ、目の眉」だが、そる対象を自然かつ明瞭に示すため「頭の毛」とし、列挙の強調を「も」で保持した。
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: すべての毛をそり
  rationale: 具体的な部位の列挙後にある原文の反復を省かず、全身の毛を除くという包括性と強調を保持した。
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: 衣服を洗い
  rationale: כבסはここでは衣服の洗浄を指す。「衣服」は明瞭で品位のある現代日本語である。
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: 全身を水で洗う
  rationale: בשרは字義的には「肉」だが、この清めの規定では本人の身体を指す。「全身」は直前の包括的な剃毛とも調和し、日本語として自然である。「水で」は原文の手段・媒体を保持する。
- source_word: וְטָהֵר
  choice: こうして、その人は清くなる
  rationale: 儀礼行為の結果として清い状態になることを示す。טהרを道徳的無罪ではなく祭儀上の清さとして訳した。
theological_decisions:
- issue: 祭儀的清浄を表す טהר
  choice: 清くなる
  alternative: 清められる／清潔になる
  rationale: 文法上は結果としての状態「清くなる」が適切であり、受動的な処置を強める「清められる」を避けた。また、衛生上の清潔さだけを意味する「清潔になる」とせず、レビ記の祭儀的区分を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法規定にふさわしい簡潔で dignified な調子とした。「頭」をそのまま目的語にすると頭部自体をそるようにも響くため、「頭の毛」と明示した。原文にある「すべての毛」の反復は、儀礼の徹底性を保つため訳文にも残した。
