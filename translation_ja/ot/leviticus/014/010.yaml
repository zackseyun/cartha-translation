id: LEV.14.10
reference: Leviticus 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: ja
  text: 八日目に、その人は、傷のない雄の子羊二匹と、傷のない一歳の雌の子羊一匹、油を混ぜた上質の小麦粉十分の三エファを穀物のささげ物として、また油一ログ[a]を用意する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ログ」は、古代イスラエルの儀式で用いられた少量の液体を量る単位。
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 八日目に
  rationale: 接続詞は儀式手順の連続性を示すが、日本語では文脈上「そして」を明示しなくても自然に連続性が伝わる。
- source_word: יִקַּח
  choice: 用意する
  rationale: 直訳は「取る」だが、ここでは規定された供物を取りそろえる意味であり、現代日本語の法的・儀礼的文脈に自然な表現とした。
- source_word: שְׁנֵי כְבָשִׂים
  choice: 雄の子羊二匹
  rationale: 後続の雌の子羊との性別の対照を保ち、犠牲動物の指定を明確にした。
- source_word: תְּמִימִים / תְּמִימָה
  choice: 傷のない
  rationale: 犠牲動物に欠陥がないことを表す祭儀用語として、明瞭で一般読者にも理解しやすい。
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: 傷のない一歳の雌の子羊一匹
  rationale: 雌であることと年齢条件を明示し、ヘブライ語の指定を自然な日本語で保持した。
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: 十分の三エファ
  rationale: עִשָּׂרוֹן は標準的に一エファの十分の一を指すため、量を明確にしつつ古代の単位を保持した。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 供物に用いる精製された良質な小麦粉を指す語として、自然で品位ある日本語を選んだ。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀用語として、単なる一般的な「供え物」ではなく穀物による供物であることを明示した。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 小麦粉が油と混ぜ合わされている状態を、簡潔な現代日本語で表した。
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: 油一ログ[a]
  rationale: ログは固有の液量単位で、正確に対応する現代日本語の単位がないため音写し、脚注で説明した。
theological_decisions: []
