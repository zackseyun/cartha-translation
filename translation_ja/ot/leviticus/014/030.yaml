  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: ja
  text: そして祭司は、山鳩一羽、または家鳩のひな一羽を、その人の資力に応じて[a]ささげる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その人の手が得るものから」。その人が負担できる資力に応じて、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: そして祭司は…ささげる
  rationale: 動詞自体は「行う／作る」だが、ここでは祭儀の文脈なので「ささげる」が自然。主語は直前の文脈にある祭司であり、日本語では明示して読みやすくした。
- source_word: אֶת הָאֶחָד
  choice: 一羽
  rationale: 後続する二種類の鳥のいずれか一羽を指す。鳥を数える自然な助数詞を用いた。
- source_word: מִן הַתֹּרִים
  choice: 山鳩一羽
  rationale: תּוֹרは祭儀規定で家鳩と区別されるキジバト類を指すため、日本語聖書で定着し一般にも理解しやすい「山鳩」とした。
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: か、家鳩のひな一羽
  rationale: בְּנֵי הַיּוֹנָהはレビ記で用いられる「若い家鳩」の定型表現。「ひな」で若齢を示し、選択肢それぞれに「一羽」を添えた。
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: その人の手の届くものに応じて
  rationale: 直訳的な身体比喩を保ちつつ、経済的能力の範囲を表す日本語としても理解できる表現にした。文脈上、手は祭司ではなく供え物を用意する当人を指すため「その人」とした。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準語。原文末尾は次節へ続く構文だが、この節単独でも不自然にならない句点とした。「祭司」は文脈から補った語であり、供え物をささげる祭儀上の主体を明確にしている。
