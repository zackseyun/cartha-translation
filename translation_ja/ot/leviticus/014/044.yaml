source:
  edition: WLC
  text: וּ/בָא֙ הַ/כֹּהֵ֔ן וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בַּ/בָּ֑יִת צָרַ֨עַת מַמְאֶ֥רֶת הִ֛וא בַּ/בַּ֖יִת טָמֵ֥א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: ja
  text: 祭司が来て調べ、異常が家に広がっていれば、それは家にある有害なツァラアト[a]である。その家は儀礼的に汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、人の皮膚だけでなく衣服や家にも用いられるヘブライ語の名称。ここでは家に生じる深刻な異常を指し、現代の「らい病」や特定の種類のかびと同一とは限らない。
    reason: 原語の広い祭儀的用法を説明し、現代の病名や菌類への誤った限定を避けるため。
lexical_decisions:
- source_word: וּבָא
  choice: そこで……来て
  rationale: 祭司による処置を順に示す法規の文脈なので、単純な過去ではなく、手順の進行を表す表現とした。
- source_word: וְרָאָה
  choice: 調べる
  rationale: 字義は「見る」だが、ここでは祭司が家の状態を判定するために検査することを指す。
- source_word: וְהִנֵּה
  choice: もし
  rationale: 検査によって確認された場合を導入する条件的な働きを、自然な日本語で示した。
- source_word: פָּשָׂה הַנֶּגַע
  choice: その異常が……広がっている
  rationale: נֶגַע は患部・災厄・異常な徴候を広く指し、家屋について現代医学的な「感染」と断定しない表現を選んだ。
- source_word: צָרַעַת
  choice: ツァラアト
  rationale: 人の皮膚だけでなく衣服や家にも用いられる祭儀上の分類名であり、「らい病」「皮膚病」「かび」のいずれかに限定すると原語の範囲を狭めるため、音写して注で説明した。
- source_word: מַמְאֶרֶת
  choice: 悪性の
  rationale: 深刻で害を及ぼす性質を示す語。「破壊的な」より日本語として自然だが、現代医学上の悪性腫瘍を意味するものではない。
- source_word: טָמֵא הוּא
  choice: その家は汚れている
  rationale: 直前の「家」を指す男性単数代名詞を明示し、レビ記の祭儀的な汚れの状態を表した。
theological_decisions:
- issue: 家について用いられる צָרַעַת の訳
  choice: ツァラアト
  alternative: かび／らい病／皮膚病
  rationale: 原語は人、衣服、家にまたがる祭儀上の異常の分類であり、特定の疾病や菌類と同一視できない。音写により、その独特な範囲と曖昧さを保つ。
- issue: טָמֵא הוּא の指示対象
  choice: その家は汚れている
  alternative: それは汚れている
  rationale: 文法上の男性単数は「家」と自然に対応するため、判定の対象を明確にした。
- issue: 法規文の時制・様態
  choice: 手順を示す現在形
  alternative: 過去形／「来なければならない」
  rationale: この箇所は出来事の回想ではなく祭司の検査手順を規定している。日本語では現在形が簡潔で自然な法規的叙述となる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭司法規の手順性を簡潔な現在形で示した。「ツァラアト」は一般読者に未知の語となるため脚注を付し、本文では「異常」と併用して状況を理解しやすくした。
