revisions:
- from: そこで祭司は来て調べる。もし、その異常が家に広がっているなら、それは家に生じた悪性のツァラアト[a]であり、その家は汚れている。
  to: 祭司が来て調べ、異常が家に広がっていれば、それは家にある有害なツァラアト[a]である。その家は儀礼的に汚れている。
  rationale: 原文の「祭司が来て調べる」「異常が家に広がっているなら」「家に有害なツァラアトがある」「その家は汚れている」という段階を保った。「有害な」により מַמְאֶרֶת の意味を医学的に狭めず、ツァラアトは音写と脚注でその非現代医学的・祭儀的分類としての性格を説明する。最終判定には「儀礼的に」を補い、טָמֵא のレビ記固有の意味を明確にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:20:35Z'
review_pass:
  verdict: revise
  source_fidelity: おおむね原文の法規的な順序と診断内容を伝えている。しかし、「悪性の」は現代日本語では腫瘍などの医学的診断を強く連想させ、מַמְאֶרֶת の害悪性・重大性を、不要に限定してしまう。また טָמֵא はこの文脈で祭儀上の状態を表すため、その点を本文で明示するのが適切である。
  naturalness: 「そこで祭司は来て調べる」は意味は通るが、法規の手順としては「祭司が来て調べ、…なら」のほうが現代標準日本語として滑らかである。「家に生じた…であり」も「家に…がある」とするほうが原文の断定に近く自然である。
  terminology: ツァラアトの音写と注による限定回避は適切である。「異常」は נֶגַע の非医学的な広がりを保つ。「汚れている」は儀礼的意味が不十分になり得るため、「儀礼的に汚れている」とする。
  issues:
  - severity: medium
    issue: 「悪性の」が現代医学用語として響く
    rationale: מַמְאֶרֶת は有害・悪性・破壊的といった性質を表すが、癌などの医学的な「悪性」を意味しない。「有害な」は原語の意味域を自然に保ち、医学的限定を避ける。
  - severity: medium
    issue: טָמֵא の祭儀的な意味が本文で明示されていない
    rationale: 「汚れている」だけでは衛生上・物理上の汚れとも読める。レビ記の判定用語として「儀礼的に汚れている」とすることで、原文の分類的・祭儀的意味を保てる。
  - severity: low
    issue: 手順を示す条件文の接続がやや不自然
    rationale: וְרָאָה וְהִנֵּה の検査と確認の流れは、「祭司が来て調べ、異常が…広がっていれば」とすると日本語で明瞭になる。
  revised_text: 祭司が来て調べ、異常が家に広がっていれば、それは家にある有害なツァラアト[a]である。その家は儀礼的に汚れている。
