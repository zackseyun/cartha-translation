base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: ja
  text: その家を、その石材、木材、家の壁土[a]もろとも取り壊し、それらをすべて町の外の不浄な場所へ運び出さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「家の土（または、ちり）をすべて」。ここでは、壁から削り落とした土やしっくいなどの塗材を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: 取り壊し
  rationale: 建物を物理的に解体することを表す動詞であり、文脈に即した自然な現代日本語とした。接続の וְ は前節から続く処置の流れとして表現した。
- source_word: הַבַּיִת
  choice: その家
  rationale: ここでは検査対象となっている建造物を指すため、「家」とした。定冠詞は文脈上既知の家を示す「その」で表した。
- source_word: אֲבָנָיו
  choice: その石材
  rationale: 直訳は「その石々」だが、家を構成する材料であることが明確になる自然な語として「石材」を選んだ。
- source_word: עֵצָיו
  choice: 木材
  rationale: 直訳的には「その木」であり、家の梁などを含む建築用の木部を広く示すため「木材」とした。
- source_word: כָּל עֲפַר הַבָּיִת
  choice: 家の壁土をすべて
  rationale: עָפָר は文字どおりには「土、ちり」だが、壁を削り落とす直前の規定（14:41–42）から、壁に用いられた土系の塗材を指す可能性が高い。「壁土」は建築文脈に合い、日本語でも理解しやすい。語義の幅は脚注に残した。
- source_word: וְהוֹצִיא
  choice: 運び出さなければならない
  rationale: 解体した資材を指定場所まで移す動作なので「運び出す」とした。法規の指示を自然な日本語で表すため義務表現を用いた。
- source_word: אֶל מִחוּץ לָעִיר
  choice: 町の外
  rationale: 居住区域の外へ出す方向を簡潔に表した。עִיר はこの文脈では現代日本語の「町」が自然である。
- source_word: אֶל מָקוֹם טָמֵא
  choice: 汚れた場所
  rationale: טָמֵא はレビ記の儀礼的清浄・不浄を示す用語であり、物理的な汚さだけに限定せず、同書で一貫して用いやすい「汚れた」を選んだ。
theological_decisions:
- issue: 儀礼的不浄を表す טָמֵא の訳語
  choice: 汚れた
  alternative: 不浄な／汚れのある
  rationale: レビ記の祭儀・法的な清浄規定に属する語である。「汚れた」は平明でありつつ儀礼的意味を保持でき、後代の教義的含意を加えない。
translation_notes:
  register: 明瞭で現代的な法規文の調子を用いた。「石材」「木材」「壁土」で解体される構成物を具体的に示しつつ、原文の列挙を保った。脚注記号 [a] は該当する「壁土」の直後に置いた。
