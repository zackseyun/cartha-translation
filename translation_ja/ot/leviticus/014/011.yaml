source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: ja
  text: 清めを行う祭司は、清めを受けているその男性とそれらの物を、ヤハウェの前、会見の天幕の入口に立たせる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: 前に立たせる
  rationale: עמדのヒフィル形が表す「立たせる」を保ちつつ、「ヤハウェの前に」と結びつく儀礼的な提示の意味も自然に伝える。
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: きよめを行う祭司
  rationale: 分詞は祭司がこの儀礼的きよめを執り行う役割を示す。「きよいと宣言する」だけに限定せず、道徳的浄化とも誤解されにくい表現とした。
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: きよめを受けているその人
  rationale: אישの単数の人物指示と、Hitpael形がここで表すきよめの過程にある状態を反映した。「その人」は文脈上の特定の男性を自然に指す。
- source_word: וְאֹתָם
  choice: それらの物を
  rationale: 複数代名詞は前節に挙げられた供え物などを指すため、日本語では指示対象が人ではなく物であることを明示した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の固有名יהוהを音写し、儀礼的に神の御前へ出すという空間的・祭儀的表現を保持した。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口で
  rationale: 幕屋の定型名称と場所を明確に示し、現代日本語として自然な語順にした。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の固有名を見える形で保持する。特定の教派的解釈を加えず、一般的な日本語音写を用いた。
- issue: 祭司による「きよめ」の性質
  choice: きよめを行う
  alternative: きよいと宣言する
  rationale: 文脈では祭司が一連の儀礼を執行するため、宣言行為だけに意味を狭めない。祭司が道徳的純潔そのものを生み出すとの含意も避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「清め」ではなく「きよめ」と表記し、儀礼上の清浄を平易に示した。原文の使役表現を保つため「立たせる」を採用した。
