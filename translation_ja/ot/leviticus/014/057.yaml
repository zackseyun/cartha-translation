  text: לְ/הוֹרֹ֕ת בְּ/י֥וֹם הַ/טָּמֵ֖א וּ/בְ/י֣וֹם הַ/טָּהֹ֑ר זֹ֥את תּוֹרַ֖ת הַ/צָּרָֽעַת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/057.yaml
  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: ja
  text: 汚れている場合と清い場合を教えるためである。これが、儀礼上の汚れに関わる状態[a]に関する律法である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病」と訳されてきた。ヘブライ語の語は、人の皮膚だけでなく衣類や家屋に現れる状態にも用いられ、現代のハンセン病に限定されない。
    reason: 語義上の別訳と、現代医学上の誤解を避けるため。
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: 教えるためである
  rationale: ヒフィル形の権威ある教示を表す。文脈上、祭司が清浄か汚れかを識別するための規定を教えることを指す。
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: 汚れている時と清い時について
  rationale: בְּיוֹם はここでは暦上の一日ではなく、その状態にある時を表す慣用的な時間表現である。対照関係を保ちつつ自然な日本語にした。
- source_word: תּוֹרַת
  choice: に関する律法
  rationale: 祭司的文脈における規定・教示を表す語であり、結語の定型表現として「律法」を用いた。
- source_word: הַצָּרָעַת
  choice: 汚れをもたらす状態
  rationale: 人の皮膚だけでなく衣類や家屋にも用いられる祭儀上の包括的カテゴリーであるため、現代の特定疾病に限定せず、共通する汚れの作用を表した。
theological_decisions:
- issue: レビ記の清浄規定における צָרַעַת の訳語
  choice: 汚れをもたらす状態
  alternative: ツァラアト／重い皮膚病／らい病
  rationale: この語は現代のハンセン病と同一ではなく、人、衣類、家屋に現れる現象を含む。医学的診断へ狭めず、祭儀上の汚れという本文上の共通点を示す訳とし、伝統的訳語は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「時」によって原文の時間的対照を残し、「汚れている／清い」はレビ記の祭儀的区分として訳した。
