source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: ja
  text: 祭司は、償いのささげ物の雄の子羊[a]と一ログの油[b]を取り、それらを揺祭としてヤハウェの前で揺り動かす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「償いのささげ物のための雄の子羊」。伝統的には「罪過のいけにえの雄の子羊」。
    reason: lexical_alternative
  - marker: b
    text: 「ログ」は、古代イスラエルの祭儀で用いられた少量の液体の容量単位。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: 祭司は……取り
  rationale: 接続詞を伴う完了形は祭儀手順の続行を表す。日本語では文脈上明らかな「次に」を補わず、自然な手順文として訳した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀・律法文脈における標準的な訳語。後半で原文が主語を繰り返す点は、日本語では冗長になるため動作の連続性を保って一度だけ明示した。
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: 償いのささげ物の子羊
  rationale: אָשָׁםを、罪責や賠償責任に関わる祭儀上の供え物として「償いのささげ物」とした。連語の関係を素直に「そのささげ物の子羊」と表した。
- source_word: לֹג הַשָּׁמֶן
  choice: 一ログの油
  rationale: לֹגは特定の液量単位なので、一般化せず音写して単位名を保存し、数量として自然な「一ログ」とした。
- source_word: וְהֵנִיף
  choice: 揺り動かす
  rationale: נוּףのヒフィル形が示す、ヤハウェの前で供え物を揺り動かして提示する祭儀行為を具体的に訳した。
- source_word: אֹתָם
  choice: それらを
  rationale: 子羊と油の双方を受ける複数代名詞を明示した。
- source_word: תְּנוּפָה
  choice: 奉献物として
  rationale: 動詞と同根の祭儀用語で、揺り動かして神に提示する供え物を指す。「揺祭」のような不透明な専門語を避け、機能が分かる表現とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在の前で祭儀を行うことを表す定型句を自然に訳し、固有の神名は「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を保ち、普通名詞的な称号へ置き換えなかった。
- issue: 祭儀用語 אָשָׁם の訳
  choice: 償いのささげ物
  alternative: 罪過のいけにえ
  rationale: 罪責と、それに伴う償い・賠償の含意を伝えつつ、現代の一般読者にも理解しやすい表現を選んだ。語の意味を単に「罪」だけに限定しない。
- issue: תְּנוּפָה の祭儀的意味
  choice: 奉献物として
  alternative: 揺祭として
  rationale: 供え物を揺り動かして神の前に提示する祭儀区分を示す。本文の動詞「揺り動かす」と合わせることで具体的行為も保持した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある祭儀手順文。専門的な祭儀概念は保ちつつ、難解な漢語に偏らない表現とした。すべての脚注記号を該当語の直後に置いた。
