source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: ja
  text: それから、杉材、ヒソプ、緋色の糸[a]、生きている鳥を取り、それらを屠られた鳥の血と流水[b]に浸し、家に七度振りかける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の直訳は「虫の緋色」。一般に、緋色に染めた糸を指すと理解されている。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「生きた水」。新鮮な水、または流れる水を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: それから、…を取り
  rationale: 儀礼手順を順に示す接続形として、現代日本語で自然な継起表現にした。
- source_word: עֵץ הָאֶרֶז
  choice: 杉の木
  rationale: 儀礼に用いる杉材を指す。簡潔で一般読者に分かりやすい表現とした。
- source_word: הָאֵזֹב
  choice: ヒソプ
  rationale: 植物名として定着した音写を用い、原文にない説明は本文へ加えなかった。
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: 緋色の糸
  rationale: 緋色に染めた糸状の素材を指す伝統的理解を、自然な日本語で表した。原語の字義は脚注に残した。
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 生きている鳥
  rationale: 屠られたもう一羽との対比を明確に保った。
- source_word: וְטָבַל אֹתָם
  choice: それらを…に浸し
  rationale: טבל の浸す・漬けるという儀礼動作を表し、複数目的語を「それら」で受けた。
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: 屠られた鳥の血
  rationale: שׁחט の儀礼的な屠殺の含意を「屠る」で保持した。
- source_word: וּבַמַּיִם הַחַיִּים
  choice: 流水
  rationale: 字義は「生きた水」だが、この文脈ではよどんでいない新鮮な水源の水を指す。「流水」は簡潔で、後代の神学的連想を不必要に持ち込まない。字義は脚注に示した。
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: 家に向かって…振りかける
  rationale: 儀礼的に振りかける動作と、前置詞 אֶל の方向性を明示した。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七度
  rationale: 回数を簡潔で格調ある現代日本語にした。
theological_decisions:
- issue: מַיִם חַיִּים の儀礼法における訳し方
  choice: 流水
  alternative: 生きた水／新鮮な水／湧き水
  rationale: 原語の慣用句は新鮮で流れのある水を指す。本文では儀礼上の具体的意味が伝わる「流水」を採り、字義的表現は脚注に保存した。
- issue: אֶל הַבַּיִת の方向性
  choice: 家に向かって
  alternative: 家に／家に振りかける
  rationale: 原文は家を方向・対象として示すが、液体が家屋の表面に付着することまで細かく規定してはいないため、「向かって」として曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、祭儀法にふさわしい簡潔で dignified な文体とした。「屠られた」「七度」により一定の格調を保ち、原文の手順構造を一文で再現した。脚注記号は該当語の直後に置いた。
