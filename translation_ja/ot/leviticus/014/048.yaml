  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: ja
  text: しかし、祭司が家に入って調べ、家にしっくいを塗った後も、患部[a]が家の中に広がっていないことが分かったなら、祭司はその家を清いものとする[b]。その患部は治ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「患部」と訳した語は、家に現れた病的な異常やその箇所を指す。現代医学上の特定の病気を意味するとは限らない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その家を清める」。ここでは、祭司がその家を儀礼上清いと判定する意味が中心である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし……なら（日本語では「……なら」に統合）
  rationale: 直前の処置後に起こり得る別の場合を示す条件節である。文頭の「しかし」で前の場合との対照を表し、条件は「なら」で自然に示した。
- source_word: בֹּא יָבֹא הַכֹּהֵן
  choice: 祭司が家に入って
  rationale: 不定詞絶対形と未完了形の組み合わせは入る行為を強めるが、日本語で不自然に強調せず、検査のため家に入るという手続き上の意味を明確にした。
- source_word: וְרָאָה
  choice: 調べ
  rationale: 基本義は「見る」だが、ここでは祭司による検査を指すため、文脈に即して「調べ」とした。
- source_word: וְהִנֵּה לֹא פָשָׂה
  choice: 広がっていないことが分かった
  rationale: הִנֵּה が検査によって判明した結果に注意を向ける働きを、現代日本語で自然な結果表現にした。פשה はこの文脈で患部の拡大を意味する。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 家に現れた異常・損傷箇所を指す語であり、現代医学上の特定の病気と断定せず、また「疫病」という誤解も避けられる表現を選んだ。
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: 家にしっくいを塗った後も
  rationale: טוח は壁面を塗る、しっくいを塗ることを表す。日本語では行為者を明示しない能動形が自然であり、「後も」によって、その後広がっていないという時間関係を明瞭にした。
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: 祭司はその家を清いものとする
  rationale: טהר の使役形は、清める行為とも清いとの祭司的判定とも取り得る。「清いものとする」は儀礼的・法的な宣言を自然に示しつつ、ヘブライ語の使役的な幅もある程度保つ。
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: その患部は治ったからである
  rationale: רפא の「癒やされる、治る」という比喩を保持し、単に患部が消えたと言い換えないようにした。
theological_decisions:
- issue: וְטִהַר における儀礼的宣言と実際の清め
  choice: 祭司はその家を清いものとする
  alternative: 祭司はその家を清める
  rationale: この箇所では修復処置と再検査がすでに済んでおり、祭司の役割は家の清さを確定することに重点がある。ただし動詞自体には「清める」という使役的意味もあるため、脚注で別訳を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭司規定にふさわしい簡潔で厳かな調子を保った。「患部」「治った」によって家の異常を身体の病のように語る原文の比喩を残しつつ、医学的診断と誤解されないよう脚注を付した。
