id: LEV.14.47
reference: Leviticus 14:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: ja
  text: その家で横になる[a]者は衣服を洗わなければならない。また、その家で食べる者も衣服を洗わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その家で眠る」とも訳せる。ヘブライ語の動詞は「横になる」と「眠る」の両方を意味し得るが、ここでは法規の適用範囲を保つため、より広い「横になる」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: その家で横になる者
  rationale: 定冠詞付き分詞の一般的・実体詞的用法を「者」で表した。שׁכב は睡眠に限らず横になること全般を意味し得るため、法的適用範囲を狭めない「横になる」を採用した。
- source_word: בַּבַּיִת
  choice: その家で
  rationale: 文脈上、病変について調べられている特定の家を指すため、日本語では「その家で」が明瞭で自然である。
- source_word: יְכַבֵּס אֶת־בְּגָדָיו
  choice: 衣服を洗わなければならない
  rationale: ピエル形 יְכַבֵּס の洗浄の意味と、祭司法における義務的な未完了形を、現代日本語の明確な規定表現で示した。所有接尾辞は、日本語では主語が明らかな場合に「自分の」を明示しないほうが自然である。
- source_word: וְהָאֹכֵל
  choice: また、その家で食べる者も
  rationale: 実体詞的分詞の一般的な適用を「食べる者」で表し、並列関係は「また」「も」によって自然に示した。原文は食事の種類や長さを限定していない。
theological_decisions:
- issue: 法規における男性単数形の一般的用法
  choice: 性別を限定しない「者」とし、所有代名詞は日本語で省略する
  alternative: 「彼の衣服」または「その人の衣服」と明示する
  rationale: ヘブライ語の男性単数分詞と接尾辞は、ここでは一般的な法的対象を表す。日本語の「者」は自然に一般範囲を保ち、文法上の男性形を性別限定として誤解させない。所有関係は文脈から明白である。
translation_notes:
  register: 祭司法の規定としての厳粛さを保ちつつ、現代の一般読者に明確な「洗わなければならない」を用いた。前半と後半の反復は原文の法的な並行構造を保つため維持した。
