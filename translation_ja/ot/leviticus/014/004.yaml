base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: ja
  text: 祭司は、清めを受けている者のために、生きている清い鳥二羽、杉材、緋色の糸[a]、ヒソプ[b]を用意するよう命じる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「緋色のひも」。ヘブライ語の表現は緋色に染めた素材を指すが、その素材の厳密な形状は確定できない。
    reason: lexical_alternative
  - marker: b
    text: 「ヒソプ」がどの植物を指すかは確定していない。ここでは伝統的な訳語を用いた。
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: 命じる
  rationale: 祭儀の手順を示す完了形を、現代日本語の規定文として自然な非過去形で表した。接続詞は逐語的に「そして」とせず、文脈上の順序に委ねた。
- source_word: וְלָקַח
  choice: 持って来るよう
  rationale: 形態上は三人称男性単数だが、「祭司は命じる」に続く慣用的な指示として、祭司自身が取ると限定せず、必要な品々を用意させる意味が伝わる表現とした。
- source_word: לַמִּטַּהֵר
  choice: 清めを受けている者のために
  rationale: ヒトパエル分詞が表す、儀礼的な清めの過程にある人という継続的な含みを保った。
- source_word: שְׁתֵּי צִפֳּרִים
  choice: 鳥二羽
  rationale: צִפּוֹרは一般的な鳥を指し、すずめなど特定の種類には限定されない。日本語の自然な助数詞を用いた。
- source_word: חַיּוֹת
  choice: 生きている
  rationale: 死んだ鳥ではなく生きた鳥であることを明示する形容語の意味をそのまま表した。
- source_word: טְהֹרוֹת
  choice: 清い
  rationale: レビ記の文脈では儀礼上の区別を表す語であり、本文では簡潔な定訳「清い」を用いた。
- source_word: עֵץ אֶרֶז
  choice: 杉の木
  rationale: 祭儀に用いる杉材を指す構成句として、分かりやすく伝統的な表現を選んだ。「杉」は現代植物分類上の日本杉を特定する意図ではない。
- source_word: שְׁנִי תוֹלַעַת
  choice: 緋色の糸
  rationale: 虫由来の染料で染めた緋色の素材を指す表現。素材の厳密な形状には幅があるため、明瞭で伝統的な「糸」を採用し、別訳可能性を注記した。
- source_word: אֵזֹב
  choice: ヒソプ
  rationale: 正確な植物同定には議論があるが、聖書の祭儀文脈で定着した名称を保持し、不確実性は注記した。
