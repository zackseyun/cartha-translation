  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: ja
  text: 祭司の手のひらにある油の残りを、祭司は清めを受けている人の頭に塗り、ヤハウェの前でその人のために贖いをする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: 油の残り
  rationale: 分詞 הַנּוֹתָר と部分を表す מִן を、儀式の流れに合う自然な日本語で表した。
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: 祭司の手のひらにある
  rationale: כַּף は手のひら、עַל は字義的には「上に」だが、液体を手に受けている場面なので、日本語では「手のひらにある」が自然で具体的な像も保てる。
- source_word: יִתֵּן עַל רֹאשׁ
  choice: 頭に塗り
  rationale: נתן は広く「置く、付ける」を意味する。ここでは油を頭に施す儀式的動作なので「塗る」が明確で自然。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている人
  rationale: טהר のヒトパエル分詞が示す、清めの儀式の過程にある人という意味を保った。
- source_word: לְכַפֵּר עָלָיו
  choice: その人のために贖いをする
  rationale: 祭儀上の重要語 כפר を「贖いをする」とし、עַל が示す受益者を「その人のために」と明示した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在の前で行うことを表し、固有の神名 יהוה は「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の契約名を直接用いているため、その区別を保つ音写を採用した。
- issue: כפר の祭儀的意味
  choice: 贖いをする
  alternative: 償いをする／罪を覆う
  rationale: 語の祭儀的・神学的重みを保ちつつ、作用の仕組みを本文以上に限定しない定訳を用いた。
translation_notes:
  register: 明瞭で現代的ながら、祭儀本文にふさわしい簡潔で厳かな文体。「清めを受けている人」により、完了状態ではなく儀式の進行中であることを示した。
