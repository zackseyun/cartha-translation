source:
  edition: WLC
  text: וְ/רָאָ֣ה אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ בְּ/קִירֹ֣ת הַ/בַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּ/מַרְאֵי/הֶ֥ן שָׁפָ֖ל מִן הַ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: ja
  text: 患部を調べ、もしその患部が家の壁に、緑がかった、あるいは赤みがかったくぼみ[a]として現れ、その外観が壁の表面より低ければ[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「へこんだ箇所」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「壁より低い」。すなわち、壁の表面から奥にくぼんで見えるということ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 調べ
  rationale: 祭司が患部を診断する規定の文脈なので、単に「見る」ではなく、注意して観察する手続き的な意味を表した。
- source_word: הַנֶּגַע
  choice: 患部
  rationale: 家の壁に現れた異常箇所を指す。病因を特定する「感染」や、現代日本語で意味が広すぎる「災い」を避け、診断対象となる箇所を自然に示した。
- source_word: וְהִנֵּה
  choice: もし…現れ
  rationale: 直訳的な「見よ」ではなく、検査によって判明した条件を導入する法規文の働きを日本語で表した。
- source_word: בְּקִירֹת הַבַּיִת
  choice: 家の壁に
  rationale: 壁面または壁の内部に見える患部を自然な日本語で表し、ヘブライ語の前置詞の範囲を不必要に限定しなかった。
- source_word: שְׁקַעֲרוּרֹת
  choice: くぼみ
  rationale: へこんだ、または陥没した箇所を表す稀な語。後続の「壁の表面より低い」と整合する平明な語を選んだ。
- source_word: יְרַקְרַקֹּת
  choice: 緑がかった
  rationale: 重複形が示す緑色の色合いを、純粋な「緑」よりも控えめな表現で保持した。
- source_word: אֲדַמְדַּמֹּת
  choice: 赤みがかった
  rationale: 重複形が示す赤色の色合いを自然な現代日本語で表した。
- source_word: וּמַרְאֵיהֶן
  choice: その見た目
  rationale: 患部の視覚的な様相を指す語として、明瞭で一般読者に分かりやすい表現を選んだ。
- source_word: שָׁפָל מִן הַקִּיר
  choice: 壁の表面より低い
  rationale: 字義的な「壁より低い」を保ちつつ、壁面から奥にくぼんで見えるという視覚的基準が伝わるよう「表面」を補った。
