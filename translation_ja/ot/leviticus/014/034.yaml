id: LEV.14.34
reference: Leviticus 14:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: ja
  text: あなたがたが、わたしが所有地として与えるカナンの地に入るとき、あなたがたの所有地にある家に、わたしがツァラアト[a]による異常を生じさせることがあれば、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的に「らい病」と訳されることがあるヘブライ語。現代でいうハンセン病だけを指す語ではなく、人の皮膚だけでなく衣服や家にも現れる、さまざまな異常を含む。
    reason: ツァラアトの意味範囲を説明し、現代医学上の特定疾患との誤同を避けるため。
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: 入ったなら
  rationale: ここでは将来起こる状況を導入する法令上の表現。日本語では後続の条件を含む「入ったなら」が自然である。
- source_word: אֶרֶץ כְּנַעַן
  choice: カナンの地
  rationale: 地理的名称を簡潔かつ慣用的に表した。
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם לַאֲחֻזָּה
  choice: わたしが所有地として与える
  rationale: 分詞 נֹתֵן の継続的・近接未来的な意味を現在形で表し、אֲחֻזָּה の土地保有の意味を「所有地」で示した。
- source_word: וְנָתַתִּי
  choice: わたしが…生じさせた
  rationale: 直訳的な「与えた」では日本語として不自然なため、現象を起こす意味の「生じさせた」としつつ、神の明示的な行為主体性を保持した。
- source_word: נֶגַע צָרַעַת
  choice: ツァラアトの異常
  rationale: נֶגַע を目に見える異常・患部という広い意味で表し、人体だけでなく家にも及ぶ צָרַעַת を現代医学上の特定疾患に限定しないよう音写した。
- source_word: בְּבֵית אֶרֶץ אֲחֻזַּתְכֶם
  choice: その所有地にある家に
  rationale: 逐語的な「あなたがたの所有の地の家」より自然な日本語としながら、前半のאֲחֻזָּהとの語彙的つながりを「所有地」で保った。
theological_decisions:
- issue: 家に生じる異常における神の主体性
  choice: 「わたしが…生じさせた」と明示する
  alternative: 「異常が生じた」などの非人称表現にする
  rationale: ヘブライ語の一人称動詞 וְנָתַתִּי は神を明確な行為主体としているため、その神学的緊張を弱めずに訳した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法令文としての品位を保った。節が次節へ続く構文であるため、末尾を読点とした。「ツァラアト」は本文だけでは不透明になり得るため、脚注で意味範囲を補った。
