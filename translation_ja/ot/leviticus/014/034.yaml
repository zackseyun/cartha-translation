- from: あなたがたが、わたしが所有地として与えるカナンの地に入り、その所有地にある家に、わたしがツァラアト[a]の異常を生じさせたなら、
  to: あなたがたが、わたしが所有地として与えるカナンの地に入るとき、あなたがたの所有地にある家に、わたしがツァラアト[a]による異常を生じさせることがあれば、
  rationale: 法令文としての将来の時間設定を「入るとき」で明確にし、神の明示的な行為を「わたしが…生じさせることがあれば」と保持した。節末が次節へ続くため読点を維持した。
