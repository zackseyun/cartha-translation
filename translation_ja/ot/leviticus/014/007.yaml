  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: ja
  text: それを、皮膚の病[a]から清めを受けている人に七度振りかけ、その人を清いと宣言し[b]、生きている鳥を野原へ放たなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病」とも訳されてきた。ヘブライ語の「ツァラアト」は、レビ記では現代のハンセン病に限らず、より広い皮膚の異常を指す。
    reason: lexical_alternative
  - marker: b
    text: または「その人を清いと認定し」。ここでの行為は、単なる医学的判断ではなく、祭司による儀礼上の認定である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: それを……振りかけ
  rationale: 儀礼の文脈における נזה のヒフィル形は、液体などを振りかけることを表す。目的語は本文では明示されていないが、直前の儀礼で用意されたものを指すため、日本語では「それを」と補った。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けようとしている人
  rationale: טהר のヒトパエル分詞が示す、清めの手続きの途上にある人という意味を表した。単に「清い人」とはしなかった。
- source_word: מִן הַצָּרַעַת
  choice: 皮膚の病から
  rationale: レビ記で人に生じる צָרַעַת は、現代医学上のハンセン病と同一視できない皮膚症状の広い区分を指すため、過度に限定しない表現とした。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七度
  rationale: 回数を表す句を、簡潔で自然な日本語にした。
- source_word: וְטִהֲרוֹ
  choice: その人を清いと宣言し
  rationale: 祭司による儀礼的・法的な認定を表す文脈なので、身体を治療する意味に限定されないよう「宣言し」とした。
- source_word: וְשִׁלַּח
  choice: 放たなければならない
  rationale: 鳥を生きたまま解放する儀礼行為を、自然な日本語で表した。
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 生きている鳥
  rationale: 前節で殺された鳥との対照を明確に保った。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 野原へ
  rationale: 直訳的には野の表面・広がりの上を指す表現であり、鳥を開けた野へ放す動作として自然に訳した。
theological_decisions:
- issue: צָרַעַת の訳語
  choice: 皮膚の病
  alternative: らい病／重い皮膚病
  rationale: この語が現代の特定疾患だけを意味するとは限らないため、医学的・歴史的に不正確な同一視を避けつつ、この節では人の皮膚に現れる症状であることを示した。
- issue: וְטִהֲרוֹ における祭司の行為
  choice: 清いと宣言する
  alternative: 清める
  rationale: 祭司が医学的に治癒させるという意味へ狭めず、共同体の儀礼上「清い」と認定する行為を明示した。
translation_notes:
  register: 現代の一般読者に分かりやすい標準的な文体としつつ、律法規定としての格調を保つため、文末を「なければならない」とした。主語の祭司はこの節のヘブライ語本文では明示されていないため補わず、文脈から理解できる形にした。
