  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: ja
  text: それから、土の器に入れた生きた水[a]の上で、その一羽の鳥を屠る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「生きた水」。新鮮な水、または流れる水を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: そして…屠る
  rationale: 儀式の手順を続けて示す形として「そして」を用い、儀礼的な殺し方を表すため「屠る」とした。
- source_word: הַצִּפֹּר הָאֶחָת
  choice: 一羽の鳥
  rationale: 二羽のうち一羽を指し、原文にない「最初の」を加えない表現とした。
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: 土の器の上で
  rationale: 血が器に入るよう、その上で鳥を屠るという儀式の動作を自然な日本語で示した。「土の器」は粘土を焼いた器を指す簡潔な表現である。
- source_word: עַל מַיִם חַיִּים
  choice: 生きた水を入れた…上で
  rationale: 水が器の中にあるという関係を明示しつつ、מַיִם חַיִּים の字義的表現を本文に保持した。
theological_decisions:
- issue: מַיִם חַיִּים の儀礼的意味
  choice: 生きた水
  alternative: 新鮮な水／流水
  rationale: 原文の比喩的な言い方と聖書内での響きを本文に残し、ここでの実際的な意味は脚注で説明して曖昧さを不必要に解消しないようにした。
