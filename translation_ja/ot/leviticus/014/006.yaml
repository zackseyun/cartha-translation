id: LEV.14.6
reference: Leviticus 14:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: ja
  text: 生きている鳥のほうは、杉材、緋色の糸、ヒソプとともに取り、それらと生きている鳥を、流れる水[a]の上で屠った鳥の血に浸す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「生きた水」。停滞していない新鮮な水、すなわち流水を指す。
    reason: 字義的表現と文脈上の意味の両方を示すため。
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: 生きている鳥
  rationale: 形容詞 חַיָּה を明示し、屠られた鳥との対照を保った。
- source_word: יִקַּח
  choice: 取る
  rationale: 祭儀規定における指示の未完了形を、現代日本語の法規的な常体で表した。
- source_word: עֵץ הָאֶרֶז
  choice: 杉材
  rationale: 祭儀に用いる cedar の木片・木材を簡潔に表す。
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: 緋色の糸
  rationale: 虫由来の染料で染めた緋色の素材を指す慣用句として、理解しやすい表現を採った。
- source_word: הָאֵזֹב
  choice: ヒソプ
  rationale: 植物の厳密な同定には議論があるため、伝統的で透明性のある音写名称を用いた。
- source_word: וְטָבַל
  choice: 浸す
  rationale: 液体に物をつける祭儀上の動作を自然な日本語で表した。
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: 屠った鳥
  rationale: שׁחט の祭儀的な屠殺の意味を、一般的な「殺した」より正確に保った。
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: 流れる水の上で
  rationale: 字義は「生きた水」だが、ここでは停滞していない新鮮な流水を指す。עַל の位置関係も「上で」として保持した。
theological_decisions:
- issue: מַיִם חַיִּים の祭儀的文脈での訳し方
  choice: 流れる水
  alternative: 生きた水／新鮮な水／湧き水
  rationale: 後代の神学的連想を本文に持ち込まず、ヘブライ語の具体的な指示対象を自然に示した。同時に字義を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語の常体を用いた。原文で「生きている鳥」が繰り返される構造を保ち、何を血に浸すのかが曖昧にならないようにした。
