id: LEV.14.18
reference: Leviticus 14:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: ja
  text: 祭司は、手のひらにある残りの油を、清めを受けている者の頭につける。[a] こうして祭司は、ヤハウェの前でその人のために贖いを行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「祭司の手のひらの上にある油の残りを、清めを受けている者の頭の上に置く」。
    reason: 前置詞 עַל と動詞 נתן の字義的表現、および原文の係り受けを明示するため。
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: 残りの油
  rationale: נוֹתָר の「残っているもの」という実質的な用法と、בַּשֶּׁמֶן の文脈上の部分を表す関係を、簡潔で自然な日本語にした。
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: 祭司の手のひらにある
  rationale: כַּף はここでは「手のひら」。עַל は字義的には「上に」だが、油を手のひらに載せている場面では日本語の「手のひらに」が自然である。
- source_word: יִתֵּן עַל רֹאשׁ
  choice: 頭につける
  rationale: נתן は広く「置く、つける」を意味する。油を頭に施す儀式的動作として「つける」が自然であり、原文にない塗り広げる動作までは含意しない。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている者
  rationale: טהר のヒトパエル分詞が示す、儀式的な清めの過程にある人という継続的な意味を保った。
- source_word: וְכִפֶּר עָלָיו
  choice: こうして祭司は、その人のために贖いを行う
  rationale: 祭司文書の儀式用語 כפר を、特定の贖罪理論に限定せず、定着した表現「贖いを行う」で訳した。עָלָיו は文脈に即して「その人のために」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の「前で／面前で」を簡潔に表し、固有の神名 יְהוָה は「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有の契約名を、称号に置き換えず一般的な日本語音写で示した。
- issue: 祭儀的文脈における כפר
  choice: 贖いを行う
  alternative: 罪を償う、清める
  rationale: 語の祭儀的・神学的な幅を保ち、贖いの仕組みについて特定の教派的解釈を持ち込まないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の祭儀的な荘重さを保った。「清めを受けている者」により、清めが進行中であるという分詞のニュアンスを表した。
