  text: また、皮膚の腫れ[a]、皮疹[b]、明るい斑点[c]に関するものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「盛り上がった患部」。正確な症状は不明である。
    reason: lexical_alternative
  - marker: b
    text: または「かさぶた」「発疹」。正確な皮膚科学的意味は不明である。
    reason: lexical_alternative
  - marker: c
