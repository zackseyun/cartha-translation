lexical_decisions:
- source_word: שְׂאֵת
  choice: 皮膚の腫れ
  rationale: レビ記13―14章の診断的文脈では、皮膚の盛り上がった患部を指す。「皮膚の腫れ」は意味を明確にしつつ、特定の病名に限定しない。
- source_word: סַפַּחַת
  choice: 皮疹
  rationale: 皮膚に生じる病変や斑状の異常を表すが、厳密な皮膚科学的意味は不確かである。「皮疹」は「かさぶた」より広く、中立的な訳語である。
- source_word: בֶּהֶרֶת
  choice: 光る斑点
  rationale: 語の中心的な意味である明るさ・光沢を保ち、文脈から推測される白色を本文で断定しない。
- source_word: וְ/לַ
  choice: また、…について
  rationale: 前節から続く規定の列挙を、現代日本語で自然な法令調の表現として示す。節単独でも読めるよう、前文から補われる述語を添えた。
