  text: וּ/מִן הַ/שֶּׁ֖מֶן יִצֹ֣ק הַ/כֹּהֵ֑ן עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/026.yaml
  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: ja
  text: 祭司は、その油から自分の左の手のひらに注ぐ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「祭司の手のひら、その左のもの」。
    reason: 原文の語順と、同じ祭司を繰り返して示す表現を伝えるため。
lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: その油を
  rationale: 前節から続く儀式の手順として、接続詞は日本語では明示せず自然につなげた。מִן は油を取り分ける起点を示すが、日本語で「その油から注ぐ」とすると不自然なため、目的語として表現した。「一部を」と限定することは文脈上可能だが、原文に量の明示はない。
- source_word: יִצֹק
  choice: 注ぐ
  rationale: 儀式上の指示を表す未完了形。日本語の法令・手順文として自然な非過去形「注ぐ」で表した。
- source_word: הַ/כֹּהֵן
  choice: 祭司
  rationale: レビ記の祭儀的文脈における כֹּהֵן の標準的な訳語。
- source_word: עַל כַּף
  choice: 手のひらに
  rationale: כַּף はここでは手全体よりも、油を受ける手のひらを指す。עַל は注ぐ動作の到達点として助詞「に」で表した。
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: 自分の左の手のひら
  rationale: 原文は直訳すると「祭司の手のひら、その左のもの」であり、同じ祭司自身の左手を指す。日本語では「自分の」とすることで、祭司の反復を避けつつ指示対象を明確にした。
theological_decisions: []
translation_notes:
  register: 現代の標準的な日本語による、簡潔で格調を保った祭儀手順文。「左手」だけでなく「左の手のひら」として、כַּף の具体性を保持した。
