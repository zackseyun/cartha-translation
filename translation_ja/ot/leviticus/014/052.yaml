source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: ja
  text: こうして、鳥の血、生きた水[a]、生きている鳥、杉の木、ヒソプ、緋色の糸[b]を用いて、その家を清める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「湧き水」または「流水」とも訳せる。ヘブライ語では直訳すると「生きた水」で、新鮮な水源から得た水を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「緋色のひも」とも訳せる。ヘブライ語表現は、この清めの儀式に用いる緋色に染めた素材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: こうして……清める
  rationale: ピエル形のחטאは、この祭儀的文脈では罪を犯させることではなく、汚れを除いて清めることを表す。接続詞וְは直前の手順を受けるため「こうして」とした。
- source_word: הַבַּיִת
  choice: その家
  rationale: ここでは、汚れの徴候が現れ、清めの儀式を受ける建物としての家を指す。
- source_word: בְּדַם הַצִּפּוֹר
  choice: 鳥の血……を用いて
  rationale: 前置詞בְּは清めに用いる手段・材料を示す。列挙全体を自然な日本語にするため、末尾の「を用いて」にまとめて係らせた。
- source_word: וּבַמַּיִם הַחַיִּים
  choice: 生きた水
  rationale: 直訳的な祭儀表現を保ちつつ、湧き水や流水など新鮮な水源から得た水という慣用的意味は脚注で示した。
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: 生きている鳥
  rationale: 血を取られた鳥とは別の、生きたままの鳥であることを明確にする。
- source_word: וּבְעֵץ הָאֶרֶז
  choice: 杉の木
  rationale: עֵץはここでは儀式に用いる杉材を表す。「杉の木」は聖書の祭儀用語として自然で分かりやすい。
- source_word: וּבָאֵזֹב
  choice: ヒソプ
  rationale: 植物の厳密な同定には議論があるため、聖書翻訳で定着した名称を保持した。
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: 緋色の糸
  rationale: 緋色に染めた祭儀用の素材を指す。素材の太さや形状は確定できないため、分かりやすい「糸」とし、別の可能性を脚注に示した。
theological_decisions:
- issue: וְחִטֵּאの祭儀的意味
  choice: その家を清める
  alternative: その家のために贖いをする／その家から罪を除く
  rationale: この箇所の対象は家であり、文脈は汚れの除去と祭儀的清めである。「清める」は、罪責に関する特定の神学的解釈を付加せず、動詞の文脈上の機能を最も明瞭に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の祭儀的な列挙を一文に保ち、道具・材料のすべてに「を用いて」が係る自然な語順とした。「生きた水」は原文の表現と聖書内の響きを保持し、意味を脚注で補った。
