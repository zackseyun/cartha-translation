  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: ja
  text: これは、皮膚病[a]の症状があり、清めに必要なものを用意するだけの資力がない[b]者についての律法である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ツァラアト」は伝統的に「らい病」と訳されてきたが、レビ記では、さまざまな皮膚症状と、それに関連する儀礼上の不浄を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その清めにおいて、その人の手が届かない」。清めの儀礼に必要なものを用意するだけの資力がない、という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: 律法
  rationale: 祭司文書において定められた法的・儀礼的手順を指す語であり、この文脈では「律法」が簡潔でふさわしい。
- source_word: בּוֹ נֶגַע צָרָעַת
  choice: 皮膚病による患部があり
  rationale: נֶגַעを「患部」として明示し、צָרָעַתを現代のハンセン病に限定せず、レビ記における広い皮膚症状の分類として訳した。「その人にある」というヘブライ語の構文も「があり」で保持した。
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: 用意する余裕のない
  rationale: 直訳では「その手が届かない」だが、ここでは清めの儀礼に必要な供え物を賄う資力がないことを表す慣用句なので、自然な現代日本語で意味を示した。
- source_word: בְּטָהֳרָתוֹ
  choice: 身を清めるために必要なもの
  rationale: 前節までに定められた清めの儀礼と供え物を指す文脈を踏まえつつ、原文にない特定の供え物へ狭めず「必要なもの」とした。
theological_decisions:
- issue: צָרָעַתの同定
  choice: 皮膚病
  alternative: らい病／ツァラアト
  rationale: この語を現代医学上のハンセン病と同一視せず、レビ記の儀礼的分類が包含する複数の重い皮膚症状を示すため。原語の範囲は脚注で補った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法本文としての簡潔で厳かな調子を保った。「身を清める」は儀礼的な清めを表し、道徳的な罪の赦しへ意味を限定していない。
