  language: ja
  text: また、衣服や家屋に生じるツァラアト[a]について。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ツァラアト」は伝統的に「らい病」と訳されてきたが、レビ記では、人の皮膚だけでなく衣服や家屋にも現れる、より広い範囲の異常を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: また、…について
  rationale: 接続詞と前置詞が、前節から続く規定事項の列挙を示すため、日本語では「また、…について」とした。
- source_word: צָרַעַת
  choice: ツァラアト
  rationale: この語は人の皮膚だけでなく、衣服や家屋に現れる異常にも用いられる。特定の現代医学上の病名や単なる「かび」に限定せず、レビ記固有の包括的な分類を保つため音写した。
- source_word: הַבֶּגֶד
  choice: 衣服
  rationale: 単数形だが一般的な対象を指しているため、自然な日本語で「衣服」とした。
- source_word: וְלַבָּיִת
  choice: や家屋に生じる
  rationale: 接続詞は並列・選言的な列挙として「や」で表し、文脈上の所在を自然に示すため「生じる」を補った。「家屋」は規定対象としての建物を明確に表す。
