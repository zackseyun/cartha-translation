  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ja
  text: 祭司は、罪過のいけにえの血をいくらか取り[a]、きよめを受ける人の右の耳たぶ[b]、右手の親指、右足の親指にそれをつける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「罪過のいけにえの血から取る」。ここでは、その血の一部を取るという意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「右の耳の先」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: 血をいくらか
  rationale: 前置詞 מִן の部分を表す意味を、日本語の儀礼規定として自然かつ明確に示す。「血から」とするより、血の一部を取る動作が伝わる。
- source_word: הָאָשָׁם
  choice: 罪過のいけにえ
  rationale: レビ記の祭儀用語として、過失や償いに関わる特定のいけにえを指す。単なる「罪のいけにえ」と混同せず、現代日本語でも意味を取りやすい表現とした。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳たぶ
  rationale: 祭儀で血をつける耳の端、特に柔らかな部分を指すと考えられるため、自然な解剖学的表現を採用した。語の指示範囲には「耳の先」という可能性もあるため脚注に示す。
- source_word: הַמִּטַּהֵר
  choice: きよめを受ける人
  rationale: ヒトパエル分詞がこの文脈では祭司による清めの過程にある人を表すため、本人が自力で身を清めるとの含みを避けつつ、進行中の儀礼を示した。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手の親指
  rationale: בֹּהֶן は手について用いられると親指を指す。日本語では「手の親指」が明瞭で自然である。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右足の親指
  rationale: בֹּהֶן は足について用いられると足の第一趾を指す。一般読者に分かりやすい「足の親指」とした。
- source_word: וְלָקַח ... וְנָתַן
  choice: 取り……つける
  rationale: 祭儀手順を規定する完了形の指示的用法を、日本語の法規・手順文として自然な非過去形で表した。
theological_decisions:
- issue: 清めを受ける主体の描写
  choice: きよめを受ける人
  alternative: 自分をきよめる人／きよめられた人
  rationale: この人物は祭司の執行する清めの儀礼を受けている最中である。完了済みとも、自律的に自己を清めるとも断定せず、分詞と文脈が示す過程性を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語として「罪過のいけにえ」と「きよめ」を用い、動作の反復は日本語として簡潔にまとめた。すべての脚注記号を該当箇所に配置した。
