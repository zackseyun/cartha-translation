  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の神名「YHWH」。一般に「ヤハウェ」と表記され、伝統的には「主」と訳される。
    reason: 本文で音写した神名が原文のテトラグラマトンであること、および伝統的な「主」という訳語との関係を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神がモーセに語りかける定型句として、現代日本語で自然かつ品位ある敬語表現を用いる。後続する発言内容の導入も含意する。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した神名の代替表記を本文に用い、原文が固有名YHWHであることは脚注で明示する。
- source_word: אֶל
  choice: に
  rationale: 発話の向かう相手を示す自然な日本語の助詞。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記。
- source_word: לֵאמֹר
  choice: （「告げられた」に統合）
  rationale: 後続の発言内容を導くヘブライ語の定型表現。日本語では「言われた。『…』」よりも「告げられた。」で自然に機能を表せるため、動詞表現に統合した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 原文は称号ではなく神の固有名YHWHを記す。その事実を脚注で保持しつつ、本文では日本語の伝統的で通用性の高い「主」を採用した。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも適する文体。「語って言われた」という原語の重複的定型句を逐語的に再現せず、日本語として自然な「告げられた」にまとめた。
