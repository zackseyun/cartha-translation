revisions:
- from: その人は八日目に、自分の清め[a]のため、それらを祭司のもとへ、すなわち会見の天幕の入り口、ヤハウェの前へ持って行かなければならない。
  to: その人は八日目に、自分の清め[a]のため、それらを祭司のもとへ、会見の天幕の入口へ、ヤハウェの前へ持って来なければならない。
  rationale: 原文で反復される方向句の構造を保つため「すなわち」を除き、祭儀文脈に自然な「持って来る」を用いた。清めが儀礼上のものだという脚注の機能は維持しつつ、代替訳を自然な現代日本語に整えた。
  reviewer_model: gpt-5.6-terra
