    text: または「自分を清めるため」。ここでは儀礼上の清めを指す。
    reason: lexical_alternative
  revision_rationale: 原文で反復される方向句の構造を保つため「すなわち」を除き、祭儀文脈に自然な「持って来る」を用いた。清めが儀礼上のものだという脚注の機能は維持しつつ、代替訳を自然な現代日本語に整えた。
