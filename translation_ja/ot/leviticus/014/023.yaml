  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: ja
  text: その人は八日目に、自分の清め[a]のため、それらを祭司のもとへ、会見の天幕の入口へ、ヤハウェの前へ持って来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分を清めるため」。ここでは儀礼上の清めを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 持って行かなければならない
  rationale: 接続詞を伴うヒフィル完了形は、この法規的・手順的文脈では指示を表す。現代日本語でその規定性を明確にした。
- source_word: אֹתָם
  choice: それらを
  rationale: 前節に列挙された供え物を受ける男性複数の目的語代名詞である。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 八日目に
  rationale: 時間を示す前置詞בְּを、日本語の自然な時点表現で訳した。
- source_word: לְטָהֳרָתוֹ
  choice: 自分の清めのため
  rationale: 皮膚疾患からの回復後に行われる儀礼上の清めを指す。平易な「清め」を用い、所有接尾辞は主語を受けて「自分の」とした。
- source_word: אֶל הַכֹּהֵן
  choice: 祭司のもとへ
  rationale: 方向を表すאֶלを自然な日本語で示した。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: すなわち会見の天幕の入り口
  rationale: 祭司のいる場所をさらに特定する句として読み、二つのאֶל句の関係が分かるよう「すなわち」で結んだ。「会見の天幕」はאֹהֶל מוֹעֵדの定着した明瞭な訳語である。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前へ
  rationale: 礼拝・祭儀の場におけるヤハウェの臨在の前を表す定型句を簡潔に保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名יהוהを明記しているため、その区別を保つ音写を採用した。
- issue: לְטָהֳרָתוֹが表す清めの性質
  choice: 自分の清めのため
  alternative: 自分が清浄になるため
  rationale: この箇所は道徳的罪責そのものではなく、規定された儀礼上の清めの過程を扱う。「清め」は平易さを保ちつつ、その祭儀的意味を文脈に委ねる。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある法規文体。「なければならない」で手順上の義務を示し、過度に古風な語法は避けた。脚注記号は対応する語「清め」の直後に置いた。
