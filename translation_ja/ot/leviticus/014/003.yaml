  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: ja
  text: 祭司は宿営の外へ出て行き、その人を調べる。すると、その人のツァラアト[a]の患部が治っていれば、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、古くは「らい病」と訳されてきたが、現代のハンセン病だけを指す語ではない。律法において汚れに関わる、さまざまな皮膚の病変を含む。
    reason: 伝統的訳語との違いと、原語が示す範囲を明らかにするため。
lexical_decisions:
- source_word: וְיָצָא
  choice: 出て行き
  rationale: 祭儀上の手順を定める文脈で、接続詞付き完了形を規定的な動作として自然な現代日本語にした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀・律法の文脈における כֹּהֵן の標準的な訳語。ヘブライ語での反復は、日本語では主語が明白なため二度目を省き、意味を損なわず自然にした。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: אֶל の方向性と מִחוּץ の『外』を簡潔かつ自然に表した。
- source_word: וְרָאָה
  choice: 彼を調べる
  rationale: ראה の基本義は『見る』だが、この検査規定では祭司による診察・確認を表すため『調べる』とした。目的語は文脈上、患っている人を指すので補った。
- source_word: וְהִנֵּה
  choice: もし……なら
  rationale: 直訳は『見よ』だが、検査で判明した状態を導く手続き文の機能を現代日本語で自然に示した。
- source_word: נִרְפָּא
  choice: 治っている
  rationale: ニファル形の受動・結果状態を表し、検査時点ですでに治癒した状態にあることを示した。
- source_word: נֶגַע הַצָּרַעַת
  choice: ツァラアトの患部
  rationale: נגע の病変・患部という具体性を保ちつつ、צרעת を現代の特定疾患に誤って限定しないよう音写した。
- source_word: מִן הַצָּרוּעַ
  choice: その患っている人から
  rationale: מן の分離・除去の意味を保持し、病変がその人から治ったというヘブライ語の表現を反映した。
theological_decisions:
- issue: צָרַעַת／צָרוּעַ の訳し方
  choice: ツァラアト／患っている人
  alternative: 重い皮膚病／その皮膚病を患っている人、らい病／らい病人
  rationale: 聖書の צרעת は現代のハンセン病と同一とは限らず、衣服や家屋にも用いられる祭儀的分類である。特定の現代医学的診断を持ち込まないため主要語を音写し、人については自然な説明表現にした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。祭儀手順として簡潔にしつつ、原文の条件構造と מן の分離の含意を保持した。
