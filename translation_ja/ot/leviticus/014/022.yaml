id: LEV.14.22
reference: Leviticus 14:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: ja
  text: また、その人の手の届く範囲で、山鳩二羽か家鳩のひな二羽を用意する。一羽を罪のためのいけにえ[a]とし、もう一羽を全焼のいけにえとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのいけにえ」とも訳せる。ヘブライ語の語は、儀礼上の清めのためにささげるいけにえを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: また、山鳩二羽
  rationale: 接続詞は前節から続く供え物の一覧を受けるため「また」とした。תֹרִים は一般的な鳩ではなく、犠牲に用いる山鳩を指す。
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: か家鳩のひな二羽
  rationale: אוֹ の選択関係を「か」で示した。בְּנֵי יוֹנָה は字義的には「鳩の子ら」だが、犠牲用の若い家鳩を表す慣用句なので、年齢の含意を保って「家鳩のひな」とした。
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: その人の手の届く範囲で、…を用意する
  rationale: 字義は「その人の手が届くもの」。経済力に応じて入手できることを表す慣用表現であり、日本語でも手の届く範囲という比喩を保ちつつ、文脈上の入手を「用意する」で明示した。
- source_word: אֶחָד חַטָּאת
  choice: 一羽を罪のためのいけにえ
  rationale: אֶחָד は二羽のうちの一羽を指す。חַטָּאת の標準的な祭儀用語を踏まえ、「罪のためのいけにえ」とした。
- source_word: וְהָאֶחָד עֹלָה
  choice: もう一羽を全焼のいけにえ
  rationale: 定冠詞付きの「一つ」は対になる残りの一羽を示すため「もう一羽」とした。עֹלָה は祭壇で全体を焼く供え物を指す定着した訳語「全焼のいけにえ」で表した。
theological_decisions:
- issue: レビ記の祭儀文脈における חַטָּאת の訳し分け
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: חַטָּאת は罪と関係する供え物を表す一方、レビ記の清めの儀式では儀礼的な汚れを除く機能も前面に出る。本文では広く認知される祭儀用語を採用し、清めの含意を脚注に残して意味を一方に限定しない。
translation_notes:
  register: 明瞭で現代的ながら礼拝文書に適した格調を保った。「その人」は男性に限ることを強調せず、直前の規定の対象者を受ける表現。「用意する」は原文の経済的能力を表す慣用句を自然な日本語の文として補ったもの。脚注記号は、その説明対象である「罪のためのいけにえ」の直後に置いた。
