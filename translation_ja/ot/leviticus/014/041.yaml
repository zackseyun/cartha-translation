source:
  edition: WLC
  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: ja
  text: また、家の内側を周囲全体にわたって削り取らせ、人々は削り取った土くず[a]を町の外の不浄な場所に捨て置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「土」または「ちり」。ここでは家の壁から削り取られたものを指す。「不浄な」は、祭儀上清くないことをいう。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַקְצִעַ
  choice: 削り取らせ
  rationale: ヒフィル形の使役の意味を保ち、祭司が自ら作業するというより作業を命じることを自然な日本語で示す。
- source_word: מִבַּיִת סָבִיב
  choice: 家の内側をくまなく
  rationale: 家の内部を周囲全体にわたって処置する意味を、明瞭で自然な日本語にした。
- source_word: וְשָׁפְכוּ
  choice: 捨てさせる
  rationale: 字義的には「注ぎ出す」だが、削りくずを所定の場所へ運び出して処分する文脈では「捨てる」が自然であり、先行する単数の使役命令と後続する複数の作業者も日本語として明確に表せる。
- source_word: הֶעָפָר
  choice: 土くず
  rationale: עָפָר の基本義「土、ちり」を保ちつつ、壁から削り落とされた物質であることを示す。「しっくい」とは限定しない。
- source_word: אֲשֶׁר הִקְצוּ
  choice: 削り落とした
  rationale: 直前の壁面を削る作業によって除去された物質を指すことを明確にした。
- source_word: אֶל מִחוּץ לָעִיר
  choice: 町の外
  rationale: 町の境界外への移動を簡潔で自然に表した。
- source_word: אֶל מָקוֹם טָמֵא
  choice: 汚れた場所
  rationale: レビ記における祭儀的な清浄・不浄の区分を表し、道徳的な悪を意味する語としては扱わない。
theological_decisions:
- issue: レビ記の清浄規定における טָמֵא の訳語
  choice: 汚れた
  alternative: 不浄な
  rationale: 「汚れた」は現代の一般読者にも理解しやすく、文脈上は祭儀的に清くない状態を指す。「不浄な」も専門語として可能だが、本文では平明さを優先した。
translation_notes:
  register: 現代標準日本語による、平明でありながら律法本文にふさわしい簡潔で品位ある文体。使役形を用いて、祭司の指示と作業者の行為の区別を反映した。
