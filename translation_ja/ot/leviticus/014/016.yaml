  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: ja
  text: 祭司は、左の手のひらにある油に右手の指を浸し、その指で油を七度、ヤハウェの前に振りかける。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטָבַל
  choice: 浸し
  rationale: 液体に指をつける儀礼動作を、簡潔で自然な日本語にした。指全体を完全に沈めることまでは含意しない。
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: 右手の指
  rationale: 直訳的な「彼の右の指」では日本語として不自然なため、身体上の左右を明確にして「右手の指」とした。原文が特定していない指の種類は補わない。
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: 左の手のひらにある油に
  rationale: כַּףを手全体ではなく「手のひら」とし、טבלに続くמִןは日本語の動作表現に合わせて「油に……浸す」と訳した。
- source_word: וְהִזָּה
  choice: 振りまく
  rationale: 祭司儀礼で液体を指によって散らす動作を表す。現代日本語で明瞭かつ儀礼的な表現を選んだ。
- source_word: בְּאֶצְבָּעוֹ
  choice: その指で
  rationale: בְּの道具・手段の用法を示し、直前の右手の指を自然に受ける表現とした。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七度
  rationale: 儀礼上重要な回数をそのまま保持し、簡潔で格調のある語形を用いた。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の臨在の前で行うという祭儀的表現を保ち、固有の神名を音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を明示し、一般称号で置き換えない。
translation_notes:
  register: 現代の一般読者に分かる明瞭な文体を用いつつ、「七度」「ヤハウェの前に」によって祭儀規定としての簡潔さと荘重さを保った。
