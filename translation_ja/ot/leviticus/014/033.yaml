  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンに語り、こう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文はYHWH（四文字神名）。
    reason: 本文の「ヤハウェ」がヘブライ語の神名を訳したものであることを示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進めて新たな発話を導入する定型表現。後続節への導入として、現代日本語で自然かつ荘重な敬語表現とした。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される伝統的な代替表記を本文に用い、原文が固有名YHWHであることを脚注で明示した。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: 二度の前置詞אֶלは両者が発話の直接の受け手であることを示す。日本語では助詞「に」を共有させるのが自然である。
- source_word: לֵאמֹר
  choice: （後続する直接話法への導入として「告げられた」に統合）
  rationale: ヘブライ語の定型的な直接話法導入句。日本語で「言って言われた」のような冗長さを避けつつ、その談話機能を保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で「原文は神の固有名YHWH」）
  alternative: ヤハウェ
  rationale: 原文が称号ではなく四文字神名である事実を脚注に保持しつつ、日本語本文では広く定着した「主」を採用した。特定の発音再建を本文で断定しない。
translation_notes:
  register: 明瞭な現代標準日本語。祭儀規定を導入する神の発話公式にふさわしい簡潔で品位ある文体とし、ヘブライ語の「語って、言った」に当たる重複は自然な日本語の一動詞にまとめた。
