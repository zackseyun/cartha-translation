source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: ja
  text: 祭司は罪のためのいけにえ[a]をささげ、汚れから清めを受けている者のために贖いを行う。その後、全焼のいけにえを屠る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのためのいけにえ」。ヘブライ語 חַטָּאת は、レビ記の祭儀では汚れを清めるためのいけにえを指すことがある。
    reason: 語彙上の別訳
lexical_decisions:
- source_word: וְעָשָׂה
  choice: ささげ
  rationale: 字義は「行う、作る」だが、いけにえを目的語とする祭儀的文脈では、犠牲を正式にささげる行為を表す。現代日本語として自然な「ささげる」を採用した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記の祭儀を執行する職務者を表す標準的な訳語。
- source_word: הַחַטָּאת
  choice: 罪のためのいけにえ
  rationale: ここでは罪そのものではなく祭儀上の供え物を指す。「罪のためのいけにえ」は伝統的意味を保ちながら、現代の読者にも分かりやすい。清めを主眼とする名称も可能なため脚注に示した。
- source_word: וְכִפֶּר עַל
  choice: ～のために贖いを行う
  rationale: 祭司が当人のために行う祭儀的な贖いを表す。贖罪の仕組みを特定の教理に限定せず、動作性のある表現とした。
- source_word: הַמִּטַּהֵר
  choice: 清めを受けている者
  rationale: ヒトパエル分詞が表す、祭儀的な清めの過程にある者という受動・再帰的な含みを自然な日本語で表した。
- source_word: מִטֻּמְאָתוֹ
  choice: 汚れから
  rationale: טֻמְאָה はレビ記における祭儀上の不浄を指す。「汚れ」は本文として平明であり、「から」は清められる元の状態を示す。三人称男性単数接尾辞は、日本語では当人を修飾する構文によって文脈上保持される。
- source_word: וְאַחַר
  choice: その後
  rationale: 定められた祭儀の順序を明瞭かつ簡潔に示す。
- source_word: יִשְׁחַט
  choice: 屠る
  rationale: 犠牲動物を祭儀として屠殺する専門的動作を表す。「殺す」よりも祭儀的意味を正確に保つ。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: 動物を祭壇で全焼させる עֹלָה の性格を明示する、分かりやすく定着した訳語。
theological_decisions:
- issue: レビ記の祭儀における חַטָּאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのためのいけにえ
  rationale: 語は罪に関係する犠牲を表す一方、この箇所では汚れからの清めという祭儀的機能が前面に出る。本文では広く認識される罪との関連を保持し、別の妥当な理解を脚注で明示した。
- issue: כפר の神学的含意
  choice: 贖いを行う
  alternative: 償いをする／汚れを除く
  rationale: 祭司による祭儀的行為という意味を保持しつつ、贖いが具体的にどのように作用するかを翻訳で一義的に規定しない。
- issue: מִטֻּמְאָתוֹ の男性単数接尾辞
  choice: 「汚れから清めを受けている者」という単数表現
  alternative: その人をその汚れから清める
  rationale: ヘブライ語の単数の人物指示を保持した。日本語では所有代名詞を明示しなくても、その汚れが当人の状態であることが構文上明らかである。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祭儀用語には品位と厳密さを保った。「屠る」「贖い」はやや改まった語だが、犠牲祭儀の専門的意味を簡潔に伝えるため採用した。
