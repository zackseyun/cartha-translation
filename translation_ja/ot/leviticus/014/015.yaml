  text: וְ/לָקַ֥ח הַ/כֹּהֵ֖ן מִ/לֹּ֣ג הַ/שָּׁ֑מֶן וְ/יָצַ֛ק עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: ja
  text: それから祭司は、油一ログ[a]からその一部を取り、自分の左手のひらに注ぐ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ログ」は古代の液量単位。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: それから……取り
  rationale: ワウ接続の完了形が祭儀手順の継起を示すため、現代日本語の規定文として自然な順序表現にした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀の文脈におけるכֹּהֵןの標準的で明確な訳語。
- source_word: מִלֹּג הַשָּׁמֶן
  choice: その一ログの油からいくらかを
  rationale: מִןの起点・部分の意味を表し、油一ログ全部ではなく、その中から一部を取ることを明確にした。
- source_word: לֹג
  choice: ログ
  rationale: 古代固有の液量単位で、現代の単位への換算には不確実性があるため、音写して注で説明する。
- source_word: וְיָצַק
  choice: 注ぐ
  rationale: 一連の祭儀手順として、先行する「取り」と同じ規定的な力を持つ動作として訳した。
- source_word: עַל כַּף
  choice: 手のひらに
  rationale: עַלは字義的には「上に」だが、くぼませた手のひらへ油を注ぐ場面を日本語で自然に表す。
- source_word: הַשְּׂמָאלִית
  choice: 自分の左の手のひら
  rationale: 左であることと、その手が祭司自身のものであることを、原文の反復に即して曖昧なく示した。
