  to: その人の経済力で用意できるもの、すなわち一羽を罪のためのいけにえ[b]とし、もう一羽を全焼のいけにえとして、穀物のささげ物とともにささげる[a]。こうして祭司は、清めを受ける者のために、ヤハウェの前で贖いをする。
