  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: ja
  text: その人の経済力で用意できるもの、すなわち一羽を罪のためのいけにえ[b]とし、もう一羽を全焼のいけにえとして、穀物のささげ物とともにささげる[a]。こうして祭司は、清めを受ける者のために、ヤハウェの前で贖いをする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その人の手が届くもの」。すなわち、その人の経済力で用意できるもの。
    reason: lexical_alternative
  - marker: b
    text: 「清めのいけにえ」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: その人の手の届く範囲のもの
  rationale: 直訳的な「その人の手が届くもの」という比喩を生かしつつ、本人の経済力で用意できるものという意味が現代日本語で伝わるようにした。
- source_word: חַטָּאת
  choice: 罪のためのいけにえ
  rationale: レビ記の祭儀用語として広く理解でき、罪との関係を保つ訳。文脈上「清めのいけにえ」と捉える余地は脚注に残した。
- source_word: עֹלָה
  choice: 全焼のいけにえ
  rationale: いけにえ全体を焼いてささげる祭儀を明確に表し、単なる「焼いた供え物」との混同を避ける。
- source_word: עַל הַמִּנְחָה
  choice: 穀物のささげ物とともに
  rationale: ここでの עַל は空間的な「上に」ではなく、祭儀上の付加・随伴を示す。
- source_word: וְכִפֶּר
  choice: 贖いをする
  rationale: 祭司が執り行う כפר の祭儀的・神学的重みを保ちつつ、贖いの仕組みを特定の教理で限定しない。
- source_word: הַמִּטַּהֵר
  choice: 清めを受ける者
  rationale: 再帰・受動的な意味を持つ分詞として、清めの過程にある当人を自然な日本語で表す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 「前で／御前で」という臨在の表現を保ち、固有名 יהוה はヤハウェと音写した。
theological_decisions:
- issue: חַטָּאת の祭儀的意味
  choice: 本文では「罪のためのいけにえ」
  alternative: 清めのいけにえ
  rationale: 語が罪に関わるいけにえを指すことを保ちながら、儀礼的浄化を前面に出す解釈も脚注で示し、意味を一つに固定しすぎない。
- issue: כפר の訳し方
  choice: 贖いをする
  alternative: 清めを行う／罪を覆う
  rationale: 原語の祭儀的な働きを伝統的かつ理解可能な表現で示し、贖罪の機序について本文以上の説明を加えない。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 称号に置き換えず、ヘブライ語本文の固有名を明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の祭儀にふさわしい端正さを保った。「一羽」「もう一羽」により直前の文脈にある二羽を自然に受け、「ささげる」は前節から続く省略された動作を日本語として補った。
