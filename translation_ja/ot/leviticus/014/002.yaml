  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: ja
  text: 「ツァラアトに冒された人の清めの日の定めは、次のとおりである。その人は祭司のもとに連れて来られる。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、儀礼上の清浄・不浄に関わる特定の状態を指すヘブライ語の音写で、伝統的には「らい病」などと訳されてきたが、現代のハンセン病と同じとは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: 次のとおりである
  rationale: 規定を導入する定型表現として、指示語と未完了形の法的用法を自然な現代日本語で表した。
- source_word: תּוֹרַת
  choice: 適用される教え
  rationale: ここでのトーラーは抽象的な教義ではなく、清めに関する定められた手順・規定を指す。「教え」によって原語との連続性を保ちつつ、構文上の関係を「適用される」で明示した。
- source_word: הַמְּצֹרָע
  choice: ツァラアトに冒された人
  rationale: מְצֹרָעはツァラアトの状態にある人を指し、現代のハンセン病患者と同一視できない。「人」として表現し、状態だけでその人を規定しないようにした。
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: 清められる日に
  rationale: טהרはこの文脈では儀礼上の清めと回復に関係する。「清められる」は簡潔で、清めの手続きが行われる時を示す。
- source_word: וְהוּבָא
  choice: その人は……連れて来られる
  rationale: ホファル形の受動態を保持した。接続詞は、手順の開始を自然に示す文の区切りによって表した。
- source_word: אֶל הַכֹּהֵן
  choice: 祭司のもとに
  rationale: 定冠詞を踏まえ、当該手続きを担当する祭司を指すものとして定形の「祭司」とした。「もとに」は人のところへ連れて行く自然な表現である。
theological_decisions:
- issue: מְצֹרָעと現代医学上の「らい病／ハンセン病」との関係
  choice: ツァラアトに冒された人
  alternative: 重い皮膚病の人／らい病人
  rationale: 原語が指す状態は皮膚だけでなく衣服や家屋にも関係し、現代医学上の特定疾患とは一致しない。音写と注を用いて不正確な医学的同定を避け、儀礼的不浄という文脈を保った。
- issue: טָהֳרָתוֹが示す清めの性質
  choice: 清められる
  alternative: 治癒する／清いと認められる
  rationale: この語は医学的治癒だけに限定されず、儀礼上の清さへの回復を表すため、「清め」を用いて意味の幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法規の導入句を自然な日本語に整えつつ、原文の受動態と手順性を維持した。専門的な誤同定を避けるため「ツァラアト」を音写し、脚注で説明した。
