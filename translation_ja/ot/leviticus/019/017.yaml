id: LEV.19.17
reference: Leviticus 19:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: ja
  text: あなたは心の中で兄弟を憎んではならない。同胞を必ず戒めなさい。彼のことで罪を負ってはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「彼の上に罪を負ってはならない」。相手の過ちを戒めないためにそのことで罪責を負う、相手の罪に加担する、または戒める際に相手に対して罪を犯さない、という理解が可能である。
    reason: ヘブライ語の慣用表現 תִשָּׂא עָלָיו חֵטְא は、その係り方と意味に解釈上の幅があるため。
lexical_decisions:
- source_word: תִשְׂנָא
  choice: 憎んではならない
  rationale: שׂנאの強い道徳的意味を弱めず、禁止命令として自然な現代日本語にした。
- source_word: אָחִיךָ
  choice: 兄弟
  rationale: 実の兄弟にも契約共同体の仲間にもなり得る原語の親族的・共同体的響きを保った。
- source_word: בִּלְבָבֶךָ
  choice: 心の中で
  rationale: 内面の思考や意図を表す לֵבָב を、明瞭で慣用的な日本語にした。
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: 必ず戒めなさい
  rationale: 不定詞絶対形と定動詞の重複による強調を「必ず」で表し、道徳的な過ちへの率直な指摘を「戒める」で示した。
- source_word: עֲמִיתֶךָ
  choice: 同胞
  rationale: 共同体に属する仲間を指す語であり、直前の「兄弟」との共同体的連関を保ちつつ、現代日本語で明瞭にした。
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: 彼のことで罪を負う
  rationale: נשא חטא の「罪責を負う」と、עליו が示す「彼に関して／彼のゆえに」という関係を保ち、原文の慣用句が持つ曖昧さを脚注で示した。
theological_decisions:
- issue: 共同体倫理における親族語の範囲
  choice: 「兄弟」と「同胞」を用いる。
  alternative: 「仲間」「隣人」「同じイスラエル人」
  rationale: 男性単数形を機械的に性別限定とはせず、原文の親族的表現と契約共同体における代表的用法の双方を保持した。
- issue: 戒めと罪責の関係
  choice: 戒めることによって、相手のことで罪責を負わずに済むというつながりを「そうすれば」で表す。
  alternative: 「彼を戒めなさい。彼のために罪を負ってはならない」と命令を並列する。
  rationale: 文脈上、過ちを指摘しないことで罪責を負う可能性が示唆される。ただし、ヘブライ語の接続詞自体は結果関係を一義的に確定しないため、脚注で別の理解も示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「兄弟」は原語の親族的・契約共同体的響きを残し、「同胞」は共同体の仲間という עָמִית の意味を自然に表す。「そうすれば」は本文の流れを明瞭にするが、解釈上の幅は脚注で保持した。
