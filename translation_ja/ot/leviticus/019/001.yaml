base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な訳語を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語って言われた
  rationale: וַיְדַבֵּרは新たな神の発話を導入する定型表現。「語る」を中心に据え、後続のלֵאמֹרと合わせて日本語の聖書文体として自然な「語って言われた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名YHWHを称号の「主」に置き換えず、固有名として一般的な日本語表記「ヤハウェ」で示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を表す前置詞אֶלを、現代日本語で自然な助詞「に」で表した。מֹשֶׁהは慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する直接話法を導く定型句。逐語的な「言うために」ではなく、尊敬表現を用いた自然で格調ある導入句とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、その固有名としての性格を保持した。「主」は伝統的な代読を反映し、「エホバ」は別の慣用的音写である。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発話導入句には簡潔で格調ある聖書文体を用いた。敬語は神を主語とする「言われた」に限り、過度に古風な表現は避けた。
