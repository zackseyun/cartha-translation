id: LEV.19.2
reference: Leviticus 19:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: ja
  text: 「イスラエルの子らの全会衆[a]に語り、彼らに言いなさい。『あなたがたは聖なる者でありなさい[b]。あなたがたの神、ヤハウェであるわたしが聖なる者だからである。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人の全共同体」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたは聖なる者でなければならない」または「あなたがたは聖なる者となる」。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: 語り
  rationale: ピエル命令形の直接的な命令を保ちつつ、続く「言いなさい」と区別し、律法本文にふさわしい格調を持たせた。
- source_word: כָּל עֲדַת
  choice: 全会衆
  rationale: כָּלを「全」、עֵדָהを契約共同体としての「会衆」と訳し、集合体としての意味を保った。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の男性複数かつ親子的な表現を本文に残した。共同体全体を指す慣用的意味は脚注で示す。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 彼らに言いなさい
  rationale: 律法告知で反復される命令の連鎖を、自然で直接的な日本語にした。
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: あなたがたは聖なる者でなければならない
  rationale: 複数形の述語形容詞と未完了形がこの文脈で表す義務的な力を明確にし、単なる未来予告と誤解されにくくした。
- source_word: קָדוֹשׁ
  choice: 聖なる者
  rationale: 神との関係における聖性を表す定着した語を用い、「取り分けられた」だけに意味を狭めなかった。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く理解される伝統的な代替表記「主」で示し、神名であることを脚注に明記した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称男性複数接尾辞を、共同体全体への呼びかけとして自然に反映した。
theological_decisions:
- issue: 契約共同体を表す בְּנֵי יִשְׂרָאֵל の訳
  choice: イスラエルの子ら
  alternative: イスラエル人の全共同体
  rationale: 原文の親子的かつ男性複数の形を保持する一方、その表現が共同体全体を指すことを脚注の自然な代案で補った。
- issue: 聖であることを求める表現の法的効力
  choice: あなたがたは聖なる者でなければならない
  alternative: 聖なる者でありなさい／聖なる者となる
  rationale: תִּהְיוּ は形の上では未完了形だが、命令的文脈では義務を表し得る。本文ではその力を明確にし、命令形および未来・帰結的に読める代案を脚注に残した。
- issue: 神名 יְהוָה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語で自然かつ荘重な伝統的表記を本文に採用したが、原文が称号ではなく固有の神名であることと音写の代案を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、律法の公的告知にふさわしい荘重さを保った。「聖なる者」を反復して、原文の קדש の対応と根拠節の修辞を明確にした。
