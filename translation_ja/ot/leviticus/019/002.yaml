- from: 「イスラエルの子らの全会衆[a]に語り、彼らに言いなさい。『あなたがたは聖なる者でなければならない[b]。あなたがたの神、主[c]であるわたしが聖なる者だからである。』」
  to: 「イスラエルの子らの全会衆[a]に語り、彼らに言いなさい。『あなたがたは聖なる者でありなさい[b]。あなたがたの神、ヤハウェであるわたしが聖なる者だからである。』」
