source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: ja
  text: それを食べる者は、自分の罪責を負う。[a] ヤハウェの聖なるものを汚したからである。[b] その者は自分の民の中から断たれる。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪責を負う」は、その罪について責任を負い、その結果を担うことを含むヘブライ語の表現。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェの聖なるもの」とは、ヤハウェのために聖別されたものを指し、ここではいけにえの肉のこと。
    reason: cultural_note
  - marker: c
    text: 「断たれる」は契約上の刑罰を表す定型句。この節だけでは、死、共同体からの追放、神による直接の裁きのどれを意味するかは明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: それを食べる者
  rationale: 前節の規定に反していけにえの肉を食べる者を指す。ヘブライ語の一般的な単数の意味を、自然な現代日本語で表した。
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: 自分の罪責を負う
  rationale: 「罪」と、その罪について責任を負い結果を担うことの両面を含む慣用句である。「罪責」はこの法的・道徳的含意を簡潔に保つ。
- source_word: קֹדֶשׁ יְהוָה
  choice: 主の聖なるもの
  rationale: 文脈上はいけにえの肉を指すが、この節の表現自体はより広く「主に属する聖別されたもの」であるため、「供え物」と限定しすぎない訳にした。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、明瞭で品位ある標準的な日本語聖書表現として「主」と訳した。
- source_word: חִלֵּל
  choice: 汚した
  rationale: 聖なるものを俗なものとして扱い、その聖性を侵すことを表す。一般読者に分かりやすい「汚した」を用いた。
- source_word: וְנִכְרְתָה
  choice: 断たれる
  rationale: 契約上の刑罰を示す定型句を保持し、それが死、共同体からの追放、神による直接の裁きのいずれかを本文以上に特定しない。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: その者
  rationale: נֶפֶשׁ は直訳すれば「魂」だが、ここでは法的文脈で人そのものを指すため、自然な日本語の「その者」とした。
- source_word: מֵעַמֶּיהָ
  choice: 自分の民の中から
  rationale: נֶפֶשׁ に一致する女性形接尾辞だが、指示対象は違反した本人である。「自分の民」として性別を限定せず表した。
theological_decisions:
- issue: 「断たれる」という刑罰定型句の意味
  choice: 刑罰の方法を特定せず「自分の民の中から断たれる」とする。
  alternative: 「死刑にされる」「共同体から追放される」「神の裁きによって除かれる」
  rationale: この節のヘブライ語は刑罰の具体的な執行方法を明示していない。解釈上の幅と神学的緊張を保つため、定型句をそのまま生かした。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語を用いながら、律法本文にふさわしい品位を保った。「罪責」「聖なるもの」「断たれる」によって原文の法的・祭儀的な重みと曖昧さを維持した。
