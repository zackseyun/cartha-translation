id: LEV.19.5
reference: Leviticus 19:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: ja
  text: あなたがたがヤハウェに交わりのいけにえを献げるときは、受け入れられるように、それを献げなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: ～ときは
  rationale: 律法上の事例を導く条件・時の表現。単なる仮定に限定せず、現代日本語の規定文として自然にした。
- source_word: תִזְבְּחוּ / תִזְבָּחֻהוּ
  choice: 献げる／それを献げなければならない
  rationale: זבח は祭儀的に屠って供えることを表す。日本語では「献げる」が自然であり、後半では反復と規定の力を保持した。
- source_word: זֶבַח שְׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִים は共同の食事を伴う祭儀区分を指す。「和解」など特定の教理解釈に狭めず、現代の読者にも趣旨が伝わる慣用的表現とした。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞 ל の献納先を「に」で示し、神名 יהוה は固有名として「ヤハウェ」とした。
- source_word: לִרְצֹנְכֶם
  choice: 受け入れられるように
  rationale: 祭儀文脈の רָצוֹן を、献げる者または供え物が神に受け入れられるためという目的・適格性として自然な日本語にした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を保持し、日本語で一般的な学術的音写を用いた。
- issue: לִרְצֹנְכֶם の指示対象と意味
  choice: 受け入れられるように
  alternative: あなたがたが受け入れられるために／あなたがたの受け入れのために／あなたがたの望むとおりに
  rationale: 原文は「あなたがたの受容・受け入れのために」と簡潔で、受け入れられる主体が礼拝者か供え物かを明示しない。日本語でも主体を補わず、祭儀上の受容という意味を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。複数二人称は「あなたがた」、義務表現は「なければならない」とし、原文の動詞反復を維持した。
