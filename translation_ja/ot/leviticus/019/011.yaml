source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: ja
  text: 盗んではならない。欺いてはならない。互いにうそをついてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: 盗んではならない
  rationale: לאを伴う未完了形はここでは禁止を表す。גנבの基本義を、現代日本語で直接的かつ明瞭に表した。
- source_word: תְכַחֲשׁוּ
  choice: 欺いてはならない
  rationale: כחשのピエル形は、欺く、偽って否認する、不実に振る舞うという幅を持つ。「欺く」は、言葉だけに限定せず、不正直な対人行為を広く表せる。
- source_word: תְשַׁקְּרוּ
  choice: 偽りを言ってはならない
  rationale: שקרのピエル形が表す「偽る、うそをつく」を自然な日本語で示し、直前の「欺く」との違いも保った。
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: 互いに
  rationale: 字義的には「人がその仲間に対して」だが、文脈上は分配的・相互的な表現である。男性だけを指すものではないため、自然で包括的な「互いに」とした。
- source_word: עֲמִית
  choice: 仲間（句全体では「互いに」）
  rationale: 共同体の仲間、同胞、隣人を指す。本文ではאיש ... עמיתוという句全体の相互性を優先して「互いに」と訳した。
theological_decisions:
- issue: אִישׁ ... עֲמִיתוֹの男性形による分配表現
  choice: 本文では包括的に「互いに」と訳す
  alternative: 「人はその仲間に対して」「各自、その隣人に対して」
  rationale: 文法上は男性単数だが、命令の対象を男性だけに限定する表現ではなく、共同体の各人に及ぶ代表的用法である。日本語では性別を不必要に明示せず、相互的な意味を保つ。
- issue: 三つの禁止命令の関係
  choice: それぞれを独立した短文として並べる
  alternative: 接続助詞で一文に連結する
  rationale: 原文の反復されるלאと動詞の並列を明瞭に示し、盗み、欺き、偽言という関連しつつ区別される禁止を保つ。
translation_notes:
  register: 律法の禁止命令としての重みを保ちながら、現代の一般読者に明快な「〜てはならない」を用いた。「欺く」と「偽りを言う」を区別し、前者を広い不実な行為、後者を虚偽の発言として読める表現にした。
