id: LEV.19.18
reference: Leviticus 19:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: ja
  text: 自分の民の者たちに復讐してはならず、恨みを抱いてもならない。あなたの隣人を自分自身のように愛しなさい。わたしはヤハウェである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִקֹּם
  choice: 復讐する
  rationale: נקםの能動的な報復の意味を、現代日本語で明確かつ簡潔に表す。
- source_word: תִטֹּר
  choice: 恨みを抱く
  rationale: נטרがここで表す、怒りや恨みを心に持ち続ける継続的な意味を自然な日本語で伝える。
- source_word: בְּנֵי עַמֶּךָ
  choice: 自分の民の者たち
  rationale: 直訳は「あなたの民の子ら」だが、この慣用句は同じ民に属する者たちを指す。日本語では性別を不必要に限定せず、共同体への帰属を明確にした。
- source_word: וְאָהַבְתָּ
  choice: 愛しなさい
  rationale: 律法文脈における接続詞付き完了形の命令的効力を、自然で威厳ある命令表現にした。
- source_word: לְרֵעֲךָ
  choice: あなたの隣人
  rationale: רֵעַは仲間、友、隣人を意味し得るが、この倫理的命令では定着した「隣人」が文脈と後代の引用との連続性を保つ。
- source_word: כָּמוֹךָ
  choice: 自分自身のように
  rationale: 比較表現を素直に訳し、他者への愛の基準としての自己への愛を曖昧にしない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で音写する。
theological_decisions:
- issue: 命令の対象範囲
  choice: 前半は「自分の民の者たち」、後半は「あなたの隣人」と訳し、本文にある語の違いを保持する。
  alternative: 両方を広く一般化した語に統一する。
  rationale: בני עמךとרעךを同一の表現に平板化せず、契約共同体という直近の文脈と「隣人」という語の幅をともに残す。
- issue: 神名の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: יהוהを称号ではなく固有名として示し、原文の形式を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、二つの禁止命令と一つの積極命令を短く並べた。文語的な「汝」や法律調の「べからず」は避けつつ、聖書本文としての簡潔さと威厳を保った。
