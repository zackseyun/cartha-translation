id: LEV.19.37
reference: Leviticus 19:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: ja
  text: あなたがたは、わたしのすべての掟と、すべての法[a]を守り、これらを行わなければならない。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「掟」は「定め」、「法」は「裁き」「規則」とも訳せる。ヘブライ語では二つの異なる法律用語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守り
  rationale: שׁמרは律法・契約の文脈で、命令を「守る」「順守する」ことを表す。日本語では「掟と法を守る」が自然であり、継続する וּ は後続の動詞と滑らかに接続した。
- source_word: כָּל
  choice: すべての
  rationale: 二度の כָּל が持つ包括的な意味を、それぞれ明示した。
- source_word: חֻקֹּתַי
  choice: わたしのすべての掟
  rationale: חֻקִּים は制定された規定や掟を指す。「掟」は現代日本語で理解しやすく、後続の מִשְׁפָּטִים との語彙上の区別も保てる。
- source_word: מִשְׁפָּטַי
  choice: わたしのすべての法
  rationale: מִשְׁפָּטִים は裁定、法規、規則を指し得る。ここでは複数の規範を総称する自然な日本語として「法」を選び、חֻקִּים との区別を保った。意味範囲の広さは脚注で示した。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: これらを行わなければならない
  rationale: עשה は法的規定を実行することを表す。「行う」により原文の簡潔さを保ち、文全体の命令的効力を「なければならない」で自然に示した。複数代名詞 אֹתָם は「これら」と明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いていることを可視化し、称号「主」への置換を避けた。「ヤハウェ」は推定される発音に基づく標準的な日本語音写である。
- issue: 律法遵守を表す動詞の法的効力
  choice: 守り、これらを行わなければならない
  alternative: 守り、これらを行いなさい／守り、行う
  rationale: ヘブライ語の完了形がこの律法文脈で担う命令的効力を明確にしつつ、「守る」と「行う」という原文の二つの動作を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の結語にふさわしい簡潔で厳粛な調子を保った。「掟」と「法」によって二つのヘブライ語法律用語を区別し、神名は「ヤハウェ」と音写した。
