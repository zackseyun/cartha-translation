  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: ja
  text: あなたがたはそれぞれ、自分の母と父を畏れなさい[a]。わたしの安息日[b]を守りなさい。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「畏れなさい」は、「畏敬しなさい」「深く敬いなさい」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「安息日」は原文では複数形で、繰り返し巡って来る安息日を指す。
    reason: source_form
lexical_decisions:
- source_word: אִישׁ
  choice: あなたがたはそれぞれ
  rationale: אִישׁ は男性単数形だが、共同体の一人一人に命令を配分する用法であり、続く動詞は複数形である。日本語では性別を不必要に補わず、「あなたがたはそれぞれ」として配分的な意味と複数への呼びかけを自然に表した。
- source_word: אִמּוֹ וְאָבִיו
  choice: 自分の母と父
  rationale: 原文が母を父より先に明示しているため、その語順と個別の親族名称を保ち、「両親」とまとめなかった。
- source_word: תִּירָאוּ
  choice: 畏れ
  rationale: ירא が表す恐れ、畏敬、敬意の重なりを保つため、「敬い」より強く、文脈にふさわしい「畏れ」を採用した。
- source_word: שַׁבְּתֹתַי
  choice: わたしの安息日
  rationale: 神の所有を示す接尾辞を「わたしの」で明示した。ヘブライ語は複数形だが、日本語の「安息日」は反復される安息日を集合的に表せるため、不自然な「安息日々」とはしなかった。複数形は注で示した。
- source_word: תִּשְׁמֹרוּ
  choice: 守りなさい
  rationale: שׁמר は守る、遵守する、注意深く保つという意味を持つ。安息日との結び付きでは「守る」が自然で、命令の力も明確に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な学術的音写により示した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 契約定式においてヤハウェを指す単数の意味であり、二人称複数接尾辞を「あなたがたの」と表した。
theological_decisions:
- issue: 父母に対する命令の情意的な強さ
  choice: 畏れ
  alternative: 敬い
  rationale: 「畏れ」は、単なる礼儀や尊敬に弱めず、ירא にある恐れと畏敬の幅を保持する。ただし、ここで親を恐怖の対象とすることだけに限定しないよう注を付した。
- issue: 冒頭の男性単数形と共同体全体への適用
  choice: あなたがたはそれぞれ
  alternative: 男はみな
  rationale: אִישׁ は形の上では男性単数だが、複数形の命令と組み合わされ、共同体の各人を配分的に指す。日本語で「男」と限定すると適用範囲を狭めかねないため、文法的機能を優先した。
- issue: 神名の表記
  choice: ヤハウェ
  alternative: 主
  rationale: יְהוָה は称号ではなく固有の神名として記されているため、神名を見える形で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法の命令にふさわしい簡潔で荘重な調子を保った。「母と父」という原文の順序を維持し、「畏れ」によって原語の意味の緊張を残した。
