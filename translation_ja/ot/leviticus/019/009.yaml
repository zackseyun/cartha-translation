id: LEV.19.9
reference: Leviticus 19:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: ja
  text: あなたがたの土地の収穫を刈り取るとき、畑の端[a]まで残らず刈ってはならない。また、収穫の落ち穂を拾い集めてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「畑の隅」。ヘブライ語は「端」「側面」「隅」を意味し、ここでは刈らずに残す畑の外縁部を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: 刈り取るとき
  rationale: 前置詞を伴う不定詞構文を時間節として自然に表し、接続詞は文脈上、日本語では明示しない。
- source_word: קְצִיר אַרְצְכֶם
  choice: あなたがたの土地の収穫
  rationale: קְצִירはここでは収穫物ないし収穫を指し、אֶרֶץは政治的な国ではなく耕作地を含む土地を指す。
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: 残らず刈ってはならない
  rationale: כלהのピエル形が表す「完全にする、尽くす」と、刈り取りを表す不定詞を一つの自然な禁止表現にまとめた。
- source_word: פְּאַת שָׂדְךָ
  choice: 畑の端
  rationale: פאהは端、側面、隅を意味し、この規定では刈り残すべき畑の外縁部を指す。
- source_word: לֶקֶט קְצִירְךָ
  choice: 収穫の落ち穂
  rationale: לקטは収穫時に落ちたり残ったりしたものを指す法律用語であり、日本語の農耕語彙「落ち穂」が簡潔で適切である。
- source_word: לֹא תְלַקֵּט
  choice: 拾い集めてはならない
  rationale: לקטの動作を、地に落ちた穀物を拾って集めるという文脈に即して明瞭に表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で荘重さのある法令文体。「あなたがた」と「あなた」の数の移行は日本語では不自然になりやすいため、共同体への命令として文全体を「あなたがた」に統一した。
