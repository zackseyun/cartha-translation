id: LEV.19.31
reference: Leviticus 19:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: ja
  text: 霊媒師や口寄せをする者に目を向けてはならない。彼らを求めて、彼らによって汚れてはならない[a]。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊媒師」に当たるヘブライ語は、死者の霊、または死者の霊を呼び出す者を指すことがある。「口寄せをする者」に当たる語も、使いの霊を持つ者、霊能者などと訳し得る。いずれも、霊や死者に伺いを立てることに関係する禁じられた実践者を指す。
    reason: 二つの希少なヘブライ語の指示対象と訳語の幅を示すため。
lexical_decisions:
- source_word: תִּפְנוּ
  choice: 頼ってはならない
  rationale: 基本義は「向く」だが、この禁止の文脈では、助けや託宣を求めてその者たちのもとへ向かうことを表す。現代日本語では「頼る」が自然であり、「相談する」ほど行為を限定しない。
- source_word: הָאֹבֹת
  choice: 霊媒師
  rationale: 死者の霊との交信に関係する霊またはその実践者を指し得る語である。この並行表現では実践者を指すと理解し、「霊媒師」とした。語義上の不確かさは脚注に残した。
- source_word: הַיִּדְּעֹנִים
  choice: 口寄せをする者
  rationale: 霊的・秘術的な知識を得る禁じられた実践者を指す。現代の「魔法使い」という連想を避け、日本語で死者や霊を呼び出して語らせる実践者を表す語句を用いた。
- source_word: תְּבַקְשׁוּ
  choice: 捜し求め
  rationale: בקש の「求める、捜す」という意味を保ちつつ、意図的にその実践者を訪ね求める含意を自然な日本語で表した。
- source_word: לְטָמְאָה בָהֶם
  choice: 彼らによって汚れてはならない
  rationale: 関与の結果または目的として汚れた状態になることを表す。儀礼的汚れか道徳的汚れかに限定せず、ヘブライ語の幅を保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な学術的音写を用いた。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称複数の契約的な呼びかけを明示した。
theological_decisions:
- issue: この禁止における「汚れ」の性質
  choice: 単に「汚れる」とし、儀礼的・道徳的のいずれかに限定しない。
  alternative: 「儀礼的に汚れる」または「道徳的に身を汚す」と明示する。
  rationale: レビ記の טמא は儀礼的側面と道徳的側面の双方を帯び得るため、本文が持つ神学的な広がりを訳文でも保った。
- issue: 二つの禁じられた呼称が霊そのものか実践者か
  choice: 並行関係と命令の文脈に基づき、どちらも実践者として訳す。
  alternative: 「死者の霊」「使いの霊」など、呼び出される霊として訳す。
  rationale: 語は霊またはそれを扱う者を指し得るが、ここでは人が頼り、捜し求める対象として禁じられているため、実践者として読むのが自然である。ただし語義の幅は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「頼る」「捜し求める」により、禁じられた実践者へ意図的に向かう動きを自然に表した。「汚れる」はレビ記の用語として理解可能で、儀礼的・道徳的意味を不必要に限定しない。
