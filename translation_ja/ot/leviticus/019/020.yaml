id: LEV.19.20
reference: Leviticus 19:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: ja
  text: 男が女と床を共にして精を放ち、その女が、ある男のために定められた女奴隷[a]であり、まだ贖われておらず、自由も与えられていない場合には、審理が行われる[b]。二人を死刑にしてはならない。彼女がまだ自由の身ではなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ある男と婚約している」または「ある男に約束されている」とも訳せる。ヘブライ語は、女奴隷が特定の男に割り当てられ、または約束されていることを指すと思われるが、自由人の妻と同じ法的身分にあるとは限らない。
    reason: lexical_alternative
  - marker: b
    text: 「審理」と訳したヘブライ語はまれで、意味は確定していない。「処罰」または「償い」を意味する可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 男
  rationale: 男性単数を指す法文上の通常の意味を、そのまま明確に表した。
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: 女と床を共にして精を放ち
  rationale: 性交を表す婉曲表現と、精液の放出を明示する原文の法的な具体性の双方を保った。
- source_word: שִׁפְחָה
  choice: 女奴隷
  rationale: この規定では隷属という法的身分が重要であるため、「召使い」などの弱い表現を避けた。
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: ある男のために定められた
  rationale: 特定の男との関係が定められていることを示しつつ、自由人の正式な婚約と断定しない表現とした。語義の不確かさは脚注に示した。
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: まだ贖われておらず
  rationale: 身代金などによって奴隷身分から解放されるという法的・経済的意味を保った。原文の強調構文は「まだ」と文脈全体で自然に表した。
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: 自由も与えられていない
  rationale: 解放が法的に認められていない状態を、明快で現代的な日本語で表した。
- source_word: בִּקֹּרֶת
  choice: 審理
  rationale: まれで語義の定まらない語であるため、公式な調査・判断を広く含み得る語を選び、処罰や賠償と断定することを避けた。
- source_word: לֹא יוּמְתוּ
  choice: 二人を死刑にしてはならない
  rationale: 複数形の対象を「二人」と明示し、司法上の処刑を禁じる受動的・法的意味を自然な日本語にした。
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: 彼女がまだ自由の身ではなかったからである
  rationale: 死刑としない理由が、彼女の未解放の身分にあることを明確にした。
theological_decisions:
- issue: נֶחֱרֶפֶת לְאִישׁ が示す法的関係
  choice: ある男のために定められた
  alternative: ある男と婚約している／ある男に約束されている
  rationale: 女性がなお贖われず解放されてもいないという文脈から、自由人の正式な婚約と同一視せず、特定の男との定められた関係だけを本文で示した。
- issue: בִּקֹּרֶת の意味
  choice: 審理が行われる
  alternative: 処罰が科される／償いが求められる
  rationale: この名詞は用例がまれで解釈が分かれるため、特定の刑罰論に限定せず、原文の不確かさを脚注で保持した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある法文調とした。「女奴隷」で身分を曖昧にせず、性交の表現は露骨さを避けながら原文の具体性を保った。本文の脚注記号は、実際に注釈する語句の直後に配置した。
