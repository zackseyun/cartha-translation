id: LEV.19.30
reference: Leviticus 19:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ja
  text: あなたがたは、わたしの安息日を守り、わたしの聖所を畏れ敬いなさい[a]。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの聖所を恐れなさい」。ヘブライ語の動詞は「恐れる」と「畏れ敬う」のどちらも意味し得る。ここでは、ヤハウェの聖なる場所を聖なるものとして重んじることを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: わたしの安息日
  rationale: ヘブライ語は複数形で、ヤハウェが定めた安息日の継続的な遵守を指す。日本語では「安息日」自体に単複の区別がなく、「数々の」を補うと不自然になるため、自然な集合的表現とした。
- source_word: תִּשְׁמֹרוּ
  choice: 守り
  rationale: שׁמרの「守る、遵守する」という契約・律法上の意味を、明快で自然な日本語で表した。
- source_word: מִקְדָּשִׁי
  choice: わたしの聖所
  rationale: 神のために聖別された場所を指す。「幕屋」や「神殿」に限定せず、原語の範囲を保つ。
- source_word: תִּירָאוּ
  choice: 畏れ敬いなさい
  rationale: יראが持つ「恐れる」と「畏敬する」の両面を保ちつつ、聖所に対する聖なる敬意を自然な現代日本語で示す。字義的な別訳は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写して、契約の神の固有名を保持した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の自己宣言という定型句を、荘重さを保った明瞭な現代日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文が神名そのものを用いているため、称号「主」で代替せず、一般的な学術的音写「ヤハウェ」とした。
- issue: 聖所を目的語とする ירא の意味
  choice: わたしの聖所を畏れ敬いなさい
  alternative: わたしの聖所を恐れなさい
  rationale: 原語には恐れと畏敬の意味幅がある。聖なる場所へのふさわしい態度を表す文脈に即して「畏れ敬う」を本文に置きつつ、「恐れる」という字義的可能性を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、律法の命令としての荘重さは「なさい」「である」で保った。「畏れ敬う」は日常語として理解でき、同時に原語の宗教的な重みも伝える。
