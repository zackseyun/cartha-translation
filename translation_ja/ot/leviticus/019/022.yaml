  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: ja
  text: 祭司は、その人のために、償いのいけにえの雄羊[a]をもってヤハウェの前で、彼が犯した罪のために贖いを行う。こうして彼は、その人が犯した罪を赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「罪過のいけにえの雄羊」。ヘブライ語のאָשָׁם（アシャム）は、罪責と、それに伴う償い・賠償の両面を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: その人のために……贖いを行う
  rationale: 祭儀におけるכפרの意味を「贖いを行う」で表し、עלはその恩恵を受ける者を示す「その人のために」とした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀を執行する者を表す標準的な訳語。
- source_word: בְּאֵיל הָאָשָׁם
  choice: 償いのいけにえの雄羊
  rationale: אילを具体的に「雄羊」とし、אָשָׁםが含む罪責と賠償・償いの両面のうち、この文脈で明瞭な「償いのいけにえ」を本文に採用した。意味の幅は脚注に残した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 祭儀的な臨在を示すלִפְנֵיを「前で」とし、固有の神名יהוהを「ヤハウェ」と音写した。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 彼が犯した罪について
  rationale: 同根語を重ねるヘブライ語表現を自然な現代日本語に整えつつ、贖いの対象となる罪を明示した。
- source_word: וְנִסְלַח לוֹ
  choice: 彼は……赦される
  rationale: סלחのニファル形が示す受動表現を保ち、赦す主体を原文同様に明示しなかった。
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 自分が犯した罪を
  rationale: 日本語では「罪から赦される」より「罪を赦される」が自然であり、מןを含む赦しの定型句の意味を明瞭に表す。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を普通名詞的な称号に置き換えず、現代日本語で広く認識される形で音写した。
- issue: 赦しの主体
  choice: 明示しない受動表現
  alternative: 神が彼を赦す
  rationale: 文脈上は神による赦しと理解されるが、原文の受動形は行為者を明記していないため、その含みを保った。
- issue: אָשָׁםの祭儀的意味
  choice: 償いのいけにえ
  alternative: 罪責のいけにえ
  rationale: この語には罪責と、それに伴う償い・賠償の側面が重なっている。本文では文脈に合う自然な訳を用い、別の側面を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀用語には簡潔で品位ある表現を選んだ。「贖い」「いけにえ」はレビ記の文脈を伝えるため保持し、文を二つに分けて読みやすくした。
