id: LEV.19.16
reference: Leviticus 19:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: ja
  text: あなたの民の間を、中傷を言いふらしながら歩き回ってはならない。隣人の血を流す側に立ってはならない。[a] わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「隣人の血が流されるのを傍観してはならない。」
    reason: 原文の「隣人の血の上に立つ」は、隣人の生命が危険にさらされているときに傍観してはならない、という意味にも解される。
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: 悪口を言いふらして歩く
  rationale: הלךの移動のイメージと、רכילが表す有害な風聞を広める行為の両方を、現代日本語で自然に伝える。単なる「うわさ話」よりも道徳的な深刻さを保つ。
- source_word: בְּעַמֶּיךָ
  choice: あなたの民の間を
  rationale: 共同体の中を巡るという文脈を示し、前の動詞「歩く」と自然につなげた。
- source_word: תַעֲמֹד עַל דַּם
  choice: 血に逆らって立つ
  rationale: עמדの「立つ」、דםの「血」という具体的表現を保持し、עלを敵対的・加担的な意味に取りつつ、ヘブライ語の簡潔さと解釈上の緊張を残した。
- source_word: רֵעֶךָ
  choice: 隣人
  rationale: 同胞・身近な他者を指す定着した聖書語であり、現代日本語でも理解できる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示す。
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ の解釈
  choice: 隣人の血に逆らって立ってはならない
  alternative: 隣人の血が流されようとしているとき、傍観してはならない
  rationale: 原文は簡潔で、隣人の生命を害する側に立つこと、血を流すことに加担すること、また危険を傍観することなどの解釈が可能である。本文では「立つ」「血」の比喩を保ち、広く知られる傍観禁止の理解を脚注に示して曖昧さを解消しすぎないようにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「悪口」は軽く聞こえる可能性があるため、「言いふらして歩く」と組み合わせて、共同体内で有害な話を流布する継続的行為を表した。神名は「ヤハウェ」とした。
