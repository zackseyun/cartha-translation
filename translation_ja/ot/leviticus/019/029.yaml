base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: ja
  text: 自分の娘を売春させて[a]汚してはならない。そうでないと、その地が淫行に走り[b]、その地は恥ずべき悪行[c]で満ちることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「娘に淫行をさせて」。原文の動詞は使役形で、娘を売春または淫行へと仕向けることを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「地が淫行をし」。共同体全体が腐敗することを、「地」を擬人化して表している。
    reason: lexical_alternative
  - marker: c
    text: 「淫らな行い」「悪辣な行い」とも訳せる。原語は、しばしば性的な文脈で用いられ、常軌を逸した道徳的悪を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: 汚してはならない
  rationale: ピエル形の「俗なるものとして扱う、神聖さを損なう」という意味を、レビ記の聖・俗の文脈を踏まえつつ、現代日本語で自然に伝える。「冒瀆する」は対象が娘であるこの文脈では不自然になりやすいため避けた。
- source_word: בִּתְּךָ
  choice: 自分の娘
  rationale: 二人称男性単数接尾辞を、日本語の命令・規定文で明瞭かつ自然な「自分の娘」とした。単数も保持している。
- source_word: לְהַזְנוֹתָהּ
  choice: 売春させて
  rationale: זנה のヒフィル不定詞と三人称女性単数接尾辞が示す使役の意味を明示し、単に娘が淫行するのではなく、父がそうさせることへの禁止として訳した。
- source_word: תִזְנֶה הָאָרֶץ
  choice: この地も淫行に走り
  rationale: 直訳的には「地が淫行をする」。共同体全体の腐敗を地の淫行として表す擬人的な比喩を残しながら、現代日本語として理解できる形にした。
- source_word: וּמָלְאָה הָאָרֶץ
  choice: 地は……で満ちることになる
  rationale: 禁止に違反した場合の帰結を表す文脈に合わせ、結果を自然な日本語で示した。
- source_word: זִמָּה
  choice: 恥ずべき行い
  rationale: 性的文脈を持ちながら、悪辣で非道な行為を広く指し得る語であるため、意味を性的不品行だけに狭めず、その強い道徳的非難を伝える表現を選んだ。
theological_decisions:
- issue: 「地が淫行をする」という比喩をどう訳すか
  choice: 「この地も淫行に走り」として比喩を保持する
  alternative: 「この地の人々も堕落し」
  rationale: 原文は共同体の腐敗を「地」の淫行として擬人的に表現している。一般的な道徳的退廃へと言い換えず、本文の強い修辞と含意を保った。
- issue: חלל の聖・俗に関わる語感をどう表すか
  choice: 「娘を汚してはならない」
  alternative: 「娘を冒瀆してはならない」
  rationale: レビ記の聖性に関わる含意は重要だが、日本語で娘を「冒瀆する」と言うと著しく不自然である。「汚す」は身体的・道徳的な毀損と聖性の侵害の双方を含み得るため、明瞭さと文脈上の語感を両立できる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法規定としての厳粛さを保った。「売春させる」で使役を明示し、「地も淫行に走る」で原文の擬人化された比喩を残した。「さもないと」により、後半が禁止違反の帰結であることを自然に示した。
