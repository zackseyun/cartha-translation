id: LEV.19.13
reference: Leviticus 19:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: ja
  text: あなたの隣人を虐げてはならない。また、その人から奪い取ってはならない。雇い人の賃金を、朝まで手元に留め置いてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「雇い人の賃金が、朝まであなたのもとで夜を越してはならない」。
    reason: 「留め置く」と訳した動詞の具体的な夜越しの比喩と、原文では「賃金」が文法上の主語であることを示すため。
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: 虐げる
  rationale: 権力を悪用して他者を圧迫し、当然与えるべきものを与えないことも含む広い倫理的意味を保つため。「だます」より広く、文脈にも適合する。
- source_word: רֵעֲךָ
  choice: あなたの隣人
  rationale: 律法の倫理的文脈で、共同体の中にいる身近な他者を指す。「隣人」はレビ記19章の用語としても一貫性があり、現代日本語で理解できる。
- source_word: תִגְזֹל
  choice: その人から奪い取る
  rationale: 単なる窃盗に限らず、力ずくまたは不正に他人のものを取り上げる意味を表す。目的語が前の「隣人」と共有されることを自然な日本語で明示した。
- source_word: תָלִין
  choice: 朝まで手元に留め置く
  rationale: 女性単数形で「賃金」を主語とし、字義的には「夜を越す」。日本語では、支払うべき賃金を雇い主が翌朝まで保持することを禁じる表現として自然に訳した。
- source_word: פְּעֻלַּת
  choice: 賃金
  rationale: 語自体は仕事・働きまたはその報酬を表し得るが、雇い人との連語および支払いを遅らせる禁止という文脈から「賃金」が適切。
- source_word: שָׂכִיר
  choice: 雇い人
  rationale: 賃金を受け取るために雇われた人を指す。「雇い人」は簡潔で、特定の雇用形態に狭めない。
- source_word: אִתְּךָ
  choice: 手元に
  rationale: 直訳は「あなたと共に」。ここでは雇い主が賃金を保持していることを、自然な現代日本語で示す。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 支払いを遅らせてはならない具体的な期限を、原文どおり保持する。
theological_decisions: []
