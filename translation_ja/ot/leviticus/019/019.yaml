base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: ja
  text: あなたがたは、わたしの定めを守らなければならない。あなたがたの家畜を、異なる種類のものと交配させてはならない。あなたがたの畑に、異なる種類の種を一緒にまいてはならない。また、異なる素材を混ぜた衣服、すなわちシャアトネズ[a]を身に着けてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シャアトネズ」は、禁じられた混紡布を指すヘブライ語の専門用語。伝統的には羊毛と亜麻を混ぜたものと理解されている。申命記22章11節参照。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: わたしの定め
  rationale: חֻקָּהの、定められた規定・法令という意味を、現代日本語で自然かつ法的な重みを保って表す。
- source_word: תִּשְׁמֹרוּ
  choice: 守らなければならない
  rationale: 契約・律法の文脈におけるשׁמרの「遵守する」という意味を、明瞭な義務表現で示す。
- source_word: בְּהֶמְתְּךָ
  choice: 家畜
  rationale: 農耕生活の文脈で、飼育される動物を広く指す自然な訳語。
- source_word: תַרְבִּיעַ
  choice: 交配させる
  rationale: רבעのヒフィル形が示す、動物をつがわせる使役的意味を正確に表す。
- source_word: כִּלְאַיִם
  choice: 異なる種類どうし／異なる種類の種を一緒に／異なる素材を混ぜた
  rationale: 異種の混合を表す語を各文脈に即して自然に訳しつつ、動物・種・織物という三つの用例の連関を保つ。
- source_word: שָׂדְךָ
  choice: 畑
  rationale: 農地を指す語の直接的で自然な訳。
- source_word: תִזְרַע
  choice: まく
  rationale: 種を播くという農耕上の動作を明確に表す。
- source_word: בֶגֶד
  choice: 衣服
  rationale: 身に着ける物を広く指すבֶּגֶדを、現代日本語で自然に表す。
- source_word: שַׁעַטְנֵז
  choice: シャアトネズ
  rationale: まれな専門用語であり、語そのものを音写して本文に残し、伝統的理解は脚注で説明する。
- source_word: יַעֲלֶה עָלֶיךָ
  choice: 身に着けてはならない
  rationale: 字義的には「あなたの上に上ってはならない」だが、衣服についてのヘブライ語表現が意図する着用禁止を、自然で明瞭な日本語にする。
