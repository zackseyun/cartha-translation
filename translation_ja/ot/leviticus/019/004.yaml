id: LEV.19.4
reference: Leviticus 19:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: ja
  text: 偶像[a]に心を向けてはならない。また、自分たちのために鋳物の神々[b]を造ってはならない。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無価値な偶像」とも訳せる。ここで「偶像」と訳したヘブライ語には、軽蔑的な響きがあると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「鋳造した神々」または「金属製の偶像」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: 心を向ける
  rationale: 基本義は「向く、向ける」。この文脈では偶像へ注意・信頼・帰依を向けることを含み得るが、「拝む」と限定せず、現代日本語として自然な「心を向ける」とした。
- source_word: אֱלִילִים
  choice: 偶像
  rationale: 偶像を指す標準的な日本語。原語には「無価値なもの」という軽蔑的な響きがあり得るため、脚注で示した。
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: 鋳物の神々
  rationale: אֱלֹהֵי の複数性と、מַסֵּכָה が鋳造された物を表す点をともに保った。「鋳物」は一般読者にも製法を明瞭に伝える。
- source_word: תַעֲשׂוּ לָכֶם
  choice: 自分たちのために造る
  rationale: לָכֶם の受益・所有の含意を保ち、単に製作するだけでなく、自分たちのためのものとして造ることを表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 形態上は複数形に由来する語だが、ここでは契約定型句の中でイスラエルの唯一の神を指し、単数として訳す。
theological_decisions:
- issue: 偶像に「向く」ことを礼拝と明示するか
  choice: 心を向けてはならない
  alternative: 偶像を拝んではならない
  rationale: פנה はそれ自体では礼拝だけに限定されない。注意、信頼、帰依を向ける広がりを残し、原文より狭く解釈しないようにした。
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号で置換せず、神名として明示した。
- issue: אֱלֹהֵי מַסֵּכָה の複数性
  choice: 鋳物の神々
  alternative: 鋳物の偶像
  rationale: 原文の「神々」という表現を保つ一方、それらが真の神であるとの承認を意味しない。脚注で「鋳造した偶像」という訳の可能性も示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「心を向ける」によって原語の比喩を自然に伝え、禁止命令は「〜てはならない」で統一した。神名は「ヤハウェ」と表記した。
