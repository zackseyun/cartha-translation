  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: ja
  text: 裁判においても、長さ、重さ、容量の計量においても、不正を行ってはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裁きにおいて、また、尺度、重さ、容量について不正をしてはならない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ עָוֶל
  choice: 不正を行ってはならない
  rationale: 複数の民に向けた法的禁止を、現代日本語として自然でありながら厳粛な表現にした。「不正」は עָוֶל の意味領域である不義・不公平を、この司法および商取引の文脈で明確に伝える。
- source_word: בַּמִּשְׁפָּט
  choice: 裁判でも
  rationale: מִשְׁפָּט は裁き、裁判、正義を表し得る。ここでは後続する計量上の公正さと並ぶ領域として、具体的で理解しやすい「裁判」を採った。
- source_word: בַּמִּדָּה
  choice: 長さ…を量るとき
  rationale: מִדָּה は一般に寸法・計量を指すが、重さと容量が別に続くため、ここでは区別を明確にする「長さ」とした。
- source_word: בַּמִּשְׁקָל
  choice: 重さ…を量るとき
  rationale: מִשְׁקָל の直接的な意味である重量・計量を、列挙全体にかかる自然な日本語の動詞「量る」で表現した。
- source_word: וּבַמְּשׂוּרָה
  choice: 容量を量るとき
  rationale: מְשׂוּרָה は特に容積・容量の尺度を指す。「容量」は液体だけに限定せず、現代の読者にも三つの計量区分を明瞭に伝える。
theological_decisions:
- issue: בַּמִּשְׁפָּט の範囲
  choice: 本文では「裁判」とする
  alternative: 「公正を期すべき事柄」「さばき」
  rationale: 語は司法的裁きにも、より広い正義・公正にもなり得る。文脈上の具体性を優先して「裁判」としつつ、脚注で広い解釈の可能性を保持した。
translation_notes:
  register: 明瞭な現代標準日本語の法文調。「〜してはならない」で禁止の力を保ち、「長さ、重さ、容量」という並列によって原文の三つの計量領域を分かりやすく示した。脚注標識は文全体に関わるため文末に置いた。
