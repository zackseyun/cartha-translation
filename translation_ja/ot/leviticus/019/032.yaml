id: LEV.19.32
reference: Leviticus 19:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: ja
  text: 白髪の人の前では立ち上がり[a]、老人を敬い[b]、あなたの神を恐れなさい。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「白髪の前で立ち上がり」。ヘブライ語は白髪を老年の具体的なしるしとして用いている。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「老人の顔を敬い」。また、「長老を敬い」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: 白髪の人の前では
  rationale: מִפְּנֵיはקוםとともに「〜の前で／面前で立つ」を表す。שֵׂיבָהの具体的な「白髪」という像を保ちつつ、日本語として人を指すことが明確になるよう「白髪の人」とした。
- source_word: תָּקוּם
  choice: 立ち上がり
  rationale: ここでは敬意のしるしとして起立する命令。現代日本語で自然かつ具体的な「立ち上がる」を用いた。
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  choice: 老人を敬い
  rationale: הדרのピエル形は敬意を示すこと。פְּנֵי（「顔／面前」）はこの句では相手そのものを指すヘブライ語的表現なので、本文では自然な日本語にした。זָקֵןには「老人」と「長老」の可能性があるため、別訳を脚注に示した。
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: あなたの神を恐れなさい
  rationale: יראの「恐れる」という強さを保ち、単なる礼儀的尊敬へ弱めない。二人称単数の契約的・個人的な呼びかけも「あなたの」で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な学術的表記により音写した。
theological_decisions:
- issue: 神への畏れの表現
  choice: あなたの神を恐れなさい
  alternative: あなたの神を畏れなさい
  rationale: 「畏れる」も文脈上可能だが、原語יראが持つ畏敬と恐れの緊張を明瞭に保つため「恐れる」とした。
- issue: זָקֵןの指示対象
  choice: 老人
  alternative: 長老／年老いた男
  rationale: 語形は男性単数で、「年老いた男」または共同体の「長老」を指し得る。ただし年長者への敬意を命じる並行句では、性別を不自然に強調しない「老人」が日本語として適切であり、「長老」の可能性は脚注に残した。
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を称号で代替せず、その固有名性を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の荘重さを保った。「〜しなければならない」より簡潔な命令形を採用し、二つの対人的命令を連用形でつないだ。神名は「ヤハウェ」とした。
