  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: ja
  text: 頭の両脇の髪[a]を丸く刈り込んではならない[b]。また、ひげの縁を損なってはならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「頭の端（または側、隅）」。ここでは頭の両脇にある髪を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 頭の両脇の髪を、周囲に沿って丸い形に剃る、または切りそろえることを指すと考えられる。具体的な方法には不確かさがある。
    reason: cultural_note
  - marker: c
    text: 「ひげの縁を滅ぼす」「台なしにする」「傷つける」とも訳せる。原文は具体的な方法を明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: 丸く刈り込む
  rationale: נקףのヒフィル形がここでは、頭の端の髪を周囲に沿って丸い形に切る行為を指すと考えられるため。具体的な動作を示しつつ、剃ることだけに限定しない。
- source_word: פְּאַת רֹאשְׁכֶם
  choice: あなたがたの頭の両脇の髪
  rationale: פֵּאָהは「端、側面、隅」を意味する。本文では現代日本語として分かりやすい「頭の両脇の髪」とし、原語の語義の幅は脚注に残した。複数接尾辞の共同体への呼びかけは文脈上保持した。
- source_word: תַשְׁחִית
  choice: 損なう
  rationale: שׁחתのヒフィル形には「滅ぼす、台なしにする、傷つける」の意味がある。「損なう」は、ひげへの有害な加工を表しながら、その具体的方法を断定しない。
- source_word: פְּאַת זְקָנֶךָ
  choice: ひげの縁
  rationale: פֵּאָהの基本義を第二節では「縁」と訳し、זָקָןを通常どおり「ひげ」とした。原文が示す形状を保ち、特定の剃り方を本文に補わない。
- source_word: לֹא ... וְלֹא
  choice: …てはならない。また、…てはならない
  rationale: 二つの禁止命令の法的な力を、明瞭で格調を保った現代日本語で表した。
theological_decisions:
- issue: 禁止の性質と背景
  choice: 特定の髪とひげの整え方を禁じる具体的命令として訳し、動機は本文に補わない。
  alternative: 異教の服喪儀礼、または周辺諸民族の風習を明示的に禁じる命令として訳す。
  rationale: この節自体は禁じる行為を述べるだけで、その宗教的・文化的動機を明記していない。背景についての解釈を本文へ持ち込まず、原文の抑制を保つ。
- issue: 二人称の数の交替
  choice: 日本語本文では自然な共同体への一般命令として表し、第一節の複数形と第二節の単数形の交替を不自然に強調しない。
  alternative: 「あなたがたの頭」と「あなたのひげ」を逐語的に対置する。
  rationale: ヘブライ語には複数から単数への交替があるが、法文では共同体とその各成員への呼びかけとして理解できる。日本語で機械的に再現すると対象が変わったように響くため、意味を失わない自然な禁止文とした。
translation_notes:
  register: 明瞭な現代標準日本語の禁止表現を用い、律法としての厳粛さを保った。「刈り込む」は髪を切る具体性を示し、「損なう」は第二の動詞の強さと方法上の曖昧さを両立させる。
