source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: ja
  text: また、ぶどう畑の実を残らず摘み取ってはならない[a]。ぶどう畑に落ちたぶどうを拾い集めてはならない[b]。それらを、貧しい人と寄留者[c]のために残しておかなければならない。わたしはあなたがたの神、ヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ぶどう畑で残りの実を摘むな」。主な収穫の後、ぶどうの木に残った実まで取り尽くすことを禁じている。
    reason: lexical_alternative
  - marker: b
    text: 「ぶどう畑の落ちた実」とも訳せる。収穫中に落ちたぶどうを指す。
    reason: lexical_alternative
  - marker: c
    text: 「在留外国人」とも訳せる。ここでは、イスラエルの民の中に住む、よそから来た人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: あなたのぶどう畑
  rationale: כֶּרֶםの通常の意味を、現代日本語で自然な「ぶどう畑」とした。本文では所有者への直接命令が明白なため、「ぶどう畑」と簡潔に訳した。
- source_word: תְעוֹלֵל
  choice: 実を残らず摘み取る
  rationale: この文脈では、主な収穫の後にぶどうの木をもう一度回り、残った実まで取ることを指す。専門的になり得る「落ち穂拾いをする」ではなく、徹底して収穫する行為を明確に表した。
- source_word: פֶּרֶט
  choice: 落ちた実
  rationale: 収穫中に房から離れて落ちたぶどうを指す。日本語では文脈上ぶどうと分かるため「実」とし、具体的な状態を保った。
- source_word: תְלַקֵּט
  choice: 拾い集める
  rationale: לקטは散ったものを集めることを表す。地面などに落ちた実に対する動作として「拾い集める」が自然で具体的である。
- source_word: לֶעָנִי
  choice: 貧しい人
  rationale: עָנִיは貧困や困窮の状態にある者を表す。この法的文脈では「貧しい人」が明快である。
- source_word: וְלַגֵּר
  choice: 寄留者
  rationale: גֵּרはイスラエルの共同体の中に住む非在来の居住者を指す。「外国人」だけでは居住の含意が弱いため、聖書の法的背景を保つ「寄留者」とした。
- source_word: תַּעֲזֹב אֹתָם
  choice: それらは……残しておかなければならない
  rationale: עזבはここでは放棄ではなく、他者が得られるよう意図して残すことを意味する。「残しておく」により目的を自然に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で一般的な形に音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称複数接尾辞を明示し、契約的な定型句を忠実に表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、神名であることを保つ音写を採用した。
- issue: גֵּר が指す人々の範囲
  choice: 寄留者
  alternative: 外国人／在留外国人
  rationale: 単なる国外出身者一般ではなく、イスラエルの中に居住する非在来者という法的・社会的含意を保った。特定の後代制度に限定しない。
translation_notes:
  register: 明瞭で dignified な現代標準日本語を用いた。命令の法的な強さを「してはならない」「なければならない」で表しつつ、農作業の具体像が伝わる語を選んだ。神名は「ヤハウェ」とした。
