  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: ja
  text: 耳の聞こえない人を呪ってはならない。目の見えない人の前につまずきとなるものを置いてはならない。あなたの神を畏れなさい。わたしはヤハウェである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְקַלֵּל
  choice: 呪ってはならない
  rationale: ピエル形の「呪う、侮蔑する」という強い言語行為を直接的に表す。「悪く言う」では意味を弱めるため、「呪う」とした。
- source_word: חֵרֵשׁ
  choice: 耳の聞こえない人
  rationale: 聴覚障害のある者を指す実質的な用法。ヘブライ語は男性単数だが、現代日本語では名詞表現に文法上の性がなく、代表的な法的事例として自然かつ明瞭に訳した。
- source_word: לִפְנֵי עִוֵּר
  choice: 目の見えない人の前に
  rationale: לִפְנֵי の空間的意味「〜の前に」を保ち、עִוֵּר は現代日本語で明瞭な表現とした。
- source_word: מִכְשֹׁל
  choice: つまずきとなる物
  rationale: 実際につまずかせる障害物という具体的な像を保持する。「つまずき」だけより、置くことのできる物である点を明確にした。
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: あなたの神を畏れなさい
  rationale: מן は ירא の対象を示す慣用であり、日本語では「神を畏れる」が自然。「畏れる」により、単なる恐怖ではなく神への畏敬と責任を表す。接続詞は日本語で不自然な対比を加えず、命令の根拠となる独立した勧告として訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、音写した。
theological_decisions:
- issue: 男性単数形による代表的な法的事例
  choice: 「耳の聞こえない人」「目の見えない人」
  alternative: 「耳の聞こえない男」「目の見えない男」
  rationale: 原文の男性単数形は法文における具体的・代表的な事例である。日本語の「人」は性を明示しないが原文の適用範囲を不当に狭めず、また名詞の文法的性を持たない日本語として自然である。
- issue: 最後の動機づけの節の機能
  choice: 「あなたの神を畏れなさい」
  alternative: 「しかし、あなたの神を畏れなさい」
  rationale: 前二命令が人に気づかれにくい弱者への加害を禁じ、神への畏れをその倫理的根拠として置く構造を保った。וְ に明示的な逆接を読み込みすぎないよう、接続語は補わなかった。
- issue: מִכְשֹׁל の意味の広がり
  choice: 具体的な障害物の像を本文で保持する
  alternative: 比喩的に「害となるもの」「陥れるもの」と広げる
  rationale: 文脈上は文字どおりのつまずきの石が第一義的である一方、弱者につけ込むことへの広い倫理的含意も排除されない。本文では具体像を保ち、意味を一方に限定しなかった。
translation_notes:
  register: 現代の一般読者に明瞭で、律法文として簡潔かつ品位ある「〜てはならない」「〜なさい」の文体を採用した。「畏れる」は神への畏敬を示す聖書的語感を保ちつつ、現代標準日本語として理解可能である。
