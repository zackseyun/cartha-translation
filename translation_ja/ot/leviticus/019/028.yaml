id: LEV.19.28
reference: Leviticus 19:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: ja
  text: 死者のために、自分の肉体に傷をつけてはならない[a]。また、自分の体に入れ墨をしてはならない[b]。わたしは主である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一人の死者のために」とも訳せる。このヘブライ語表現は、一般に死者を悼む行為を指す。
    reason: lexical_alternative
  - marker: b
    text: 「刻み付けた印」とも訳せる。ヘブライ語の表現はまれで、身体に恒久的につける印を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: 傷
  rationale: 身体に意図的につける切り傷・刻み傷を表す。現代日本語として自然で、方法や傷の深さを限定しすぎない。
- source_word: לָנֶפֶשׁ
  choice: 死者のために
  rationale: この律法的・服喪的文脈では、נֶפֶשׁ は死者を指す慣用的用法と理解できる。「死者のために」は目的・関連性を保ちつつ自然である。
- source_word: בִּבְשַׂרְכֶם
  choice: 自分の肉体に
  rationale: בָּשָׂר の具体的な身体語彙を保つため「肉体」とした。
- source_word: כְתֹבֶת קַעֲקַע
  choice: 入れ墨
  rationale: まれな連語で、身体に刻み付けられる恒久的な印を指す可能性が高い。二語を一つの自然な日本語表現として訳した。
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: 自分の体に…してはならない
  rationale: נתן と ב の組み合わせが身体への付与を表すため、日本語では対象部位を明示した禁止表現が自然である。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 固有名詞 יהוה を「ヤハウェ」と音写し、契約的な自己宣言の簡潔さを保った。
theological_decisions:
- issue: 身体への印に関する禁止の範囲
  choice: 第一の禁止だけを明示的に死者との関連に結び付け、第二の禁止は本文どおり独立して訳す
  alternative: 両方を異教的な服喪儀礼だけに限定する、または現代のあらゆる入れ墨への普遍的禁止と訳文内で断定する
  rationale: ヘブライ語では「死者のために」が切り傷の禁止に直接かかる一方、入れ墨の禁止には反復されていない。適用範囲を訳文で狭めたり広げたりせず、本文の緊張を残す。
translation_notes:
  register: 明快な現代標準日本語を用い、律法の荘重さを保った。「肉体」と「体」を使い分け、第一節では原文の具体的な בשר を反映し、第二節では自然な日本語を優先した。
