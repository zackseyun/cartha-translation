id: LEV.19.34
reference: Leviticus 19:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: ja
  text: あなたがたと共に住む寄留者[a]を、あなたがたのうちに生まれた者と同じように扱いなさい。あなたはその人を自分自身のように愛しなさい。あなたがたもエジプトの地で寄留者だったからである。わたしはあなたがたの神、ヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者」は、イスラエルの共同体に住む、その地の生まれではない人を指す。「外国人」「在留外国人」「よそ者」とも訳せる。
    reason: גֵּרの社会的・法的な意味範囲と主要な訳語の選択肢を示すため。
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: あなたがたのうちに生まれた者と同じように
  rationale: אֶזְרָחは共同体の土地に生まれた生来の住民を指す。現代日本語で分かりやすく、比較を明示する表現とした。「国民」「市民」は近代的な法的概念を持ち込みやすいため避けた。
- source_word: הַגֵּר
  choice: 寄留者
  rationale: イスラエルの中に居住する非生来の住民という律法上の意味を表す。「外国人」より範囲が限定され、単なる旅行者でもないことを示せる。
- source_word: הַגָּר אִתְּכֶם
  choice: あなたがたのもとに住む
  rationale: גֵּרと同根の分詞だが、日本語で「寄留する寄留者」とすると不自然に重い。居住の継続性を自然な表現で示した。
- source_word: יִהְיֶה לָכֶם
  choice: 同じように扱いなさい
  rationale: 直訳的な「あなたがたにとって～である」は日本語では関係性が曖昧になるため、文脈上の命令的な力と、寄留者を生来の住民同様に見なす実践的含意を表した。
- source_word: וְאָהַבְתָּ לוֹ כָּמוֹךָ
  choice: あなたはその人を自分自身のように愛しなさい
  rationale: 単数の呼びかけを「あなた」で保ち、レビ記19:18との語句上のつながりを保持した。לוֹは自然な日本語で「その人を」とした。
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: あなたがたも…寄留者だったからである
  rationale: גֵּרを同じ「寄留者」で反復し、命令の根拠であるイスラエル自身の経験との語彙的な結びつきを保った。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地で
  rationale: ヘブライ語の定型的な「エジプトの地」を保ちつつ、自然な日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語音写で示した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 複数接尾辞を反映し、契約的な自己宣言の形を明確に保った。
theological_decisions:
- issue: 律法上のגֵּרの訳語
  choice: 寄留者
  alternative: 外国人／在留外国人／よそ者
  rationale: この語はイスラエルの共同体内に居住する非生来の住民を指す。「寄留者」はやや聖書的な語だが、現代の国籍・在留資格制度を不用意に読み込まず、居住者としての社会的立場を比較的よく保つ。代替表現は脚注に示した。
- issue: יִהְיֶה לָכֶםの命令的含意
  choice: 同じように扱いなさい
  alternative: あなたがたにとって同じでなければならない／同じ存在となる
  rationale: 形は未完了形だが、律法の命令文脈では規範を表す。「扱う」は実践面を明瞭にする一方、次の愛の命令によって単なる法的待遇以上の要求も本文内に保持される。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を用いていることを明示し、称号への置換を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。集団への複数の呼びかけ（「あなたがた」）と、個々人に向けた単数の命令（「あなた」）の切り替えを原文どおり保持した。「寄留者」は一般会話ではやや馴染みが薄いため、直後を「住む」とし、脚注でも説明した。
