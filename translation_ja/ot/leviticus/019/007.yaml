source:
  edition: WLC
  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: ja
  text: しかし、万一三日目にそれが食べられたなら、それは不適格なものとなり、受け入れられない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前節の規定に反する場合を示す条件節であり、接続の対照性と条件の力を自然な日本語で表した。
- source_word: הֵאָכֹל יֵאָכֵל
  choice: 少しでも食べられるなら
  rationale: 不定詞絶対形と未完了形の組み合わせによる強調を、「少しでも」によって簡潔に表した。受動態も保持している。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目に
  rationale: 時を示す句を明確かつ自然に訳した。
- source_word: פִּגּוּל
  choice: 忌むべきもの
  rationale: 祭儀上、不適格で受け入れられないものを指す評価的な語として訳した。単なる物理的腐敗とも、他のヘブライ語が表す一般的な「忌まわしいもの」とも断定しすぎないよう、脚注で祭儀的意味を明示した。
- source_word: לֹא יֵרָצֶה
  choice: 受け入れられない
  rationale: 祭儀の文脈におけるרצהのニファル形は、ささげ物が神に受納されることを指すため、「喜ばれない」より明確な表現を選んだ。
theological_decisions:
- issue: 三日目に食べられた肉の祭儀上の位置づけ
  choice: 規定の期限を越えて食べられたため、祭儀上受け入れられないものとなる。
  alternative: 肉が単に腐敗した、または他の重大な禁忌語と同じ意味で全面的に忌まわしいものとなる。
  rationale: 直前から続く和解のいけにえの規定と、結びの「受け入れられない」が祭儀的意味を示す。ただしפִּגּוּלの強い否定的評価は本文の「忌むべきもの」に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、律法本文にふさわしい簡潔で厳粛な文体とした。「少しでも」で原文の強調を表し、「受け入れられない」で祭儀上の受納を明確にした。
