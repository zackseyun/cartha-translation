id: LEV.19.12
reference: Leviticus 19:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: ja
  text: わたしの名によって偽りの誓いを立て、あなたの神の名を汚してはならない。わたしはヤハウェである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: 誓いを立ててはならない
  rationale: ニファル形は、法的・倫理的文脈で誓うことを表す。現代日本語として自然で、禁止の力も明確に伝える。
- source_word: בִשְׁמִי
  choice: わたしの名によって
  rationale: 誓いにおいて神の名を根拠として呼び求めることを示すため、「名によって」とした。
- source_word: לַשָּׁקֶר
  choice: 偽りの誓い
  rationale: 字義的には「偽りのために」だが、ここでは誓いの虚偽性を表す。「偽って誓う」も可能だが、後続する目的語との流れを整えるため名詞句で表現した。
- source_word: וְחִלַּלְתָּ
  choice: 神の名を汚してはならない
  rationale: ピエル形の「俗悪なものとする、冒瀆する」を、一般読者に明瞭で厳粛な「汚す」で表した。ヘブライ語の接続詞が結ぶ結果的関係は、二つの禁止を一続きにする日本語構文によって伝えた。
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: あなたの神の名
  rationale: 「名」を保持し、それが神の啓示された御人格と誉れを指す表現であることを損なわないようにした。אֱלֹהִים はここでは単数の神を指す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いていることを明示し、称号への置換を避けた。
- issue: 第二節の論理的な力
  choice: 偽りの誓いによって神の名を汚すという一続きの禁止
  alternative: 「そして神の名を汚してはならない」という単純な並列
  rationale: וְ は単純な接続も結果も表し得る。ここでは偽誓が神名の冒瀆となる関係を自然な日本語構文で示しつつ、「その結果」などを補って意味を過度に限定しなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、律法の厳粛さを保つため「〜してはならない」「〜である」とした。「冒瀆する」は難解になり得るため本文では「汚す」を採用した。
