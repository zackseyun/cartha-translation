source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: ja
  text: あなたがたは、裁判で不正を行ってはならない。貧しい者だからといってひいきせず、身分の高い者だからといって特別扱いしてはならない。[b] 正しく[a]仲間を裁きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「公正に」。
    reason: lexical_alternative
  - marker: b
    text: 「ひいきする」と「特別扱いする」に当たるヘブライ語は、直訳するとそれぞれ「貧しい者の顔を上げる」「身分の高い者の顔を重んじる」。裁判で一方に肩入れすることを表す慣用句。
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: 裁判で不正
  rationale: 法的判断の場で正義を曲げることを指すため、現代日本語で明確な「裁判で不正」とした。
- source_word: תִשָּׂא פְנֵי דָל
  choice: 貧しい者だからといってひいきする
  rationale: 字義は「貧しい者の顔を上げる」だが、司法上のえこひいきを表す慣用句なので、意味を自然な日本語で示した。
- source_word: דָל
  choice: 貧しい者
  rationale: 貧困と社会的弱さの双方を含み得るが、ここでは最も直接的な意味を採った。
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: 身分の高い者だからといって特別扱いする
  rationale: 高い地位や影響力のある者への敬意が裁判上の偏りとなることを禁じる表現として訳した。
- source_word: בְּצֶדֶק
  choice: 正しさをもって
  rationale: 道徳的な正しさと司法上の公正さを併せ持つ語であるため、一方だけに狭めない表現とした。
- source_word: תִּשְׁפֹּט
  choice: 裁きなさい
  rationale: 律法における命令の力を、簡潔で格調のある日本語で表した。
- source_word: עֲמִיתֶךָ
  choice: あなたの同胞
  rationale: 単なる近隣住民ではなく、共同体に属する仲間を指すため「同胞」とした。
theological_decisions:
- issue: 法的・倫理的文脈における צֶדֶק の訳
  choice: 正しさをもって
  alternative: 公正に
  rationale: 原語には道徳的な正しさと司法上の公正の両面がある。「正しさをもって」を本文に置き、「公正に」を脚注に示して意味の幅を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、律法の命令としての簡潔さと格調を保った。「顔」を用いるヘブライ語の比喩は本文で不自然に直訳せず、脚注で原文の表現を示した。
