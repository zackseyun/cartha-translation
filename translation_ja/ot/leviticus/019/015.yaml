  terminology: 「裁判で不正を行ってはならない」「ひいきせず」「特別扱いしてはならない」は法的文脈に適合しています。「身分の高い者」は原語の社会的に重要な者という広い意味を十分に表せます。「仲間」はעָמִיתの共同体内の相手という意味を、現代語として過度に限定せず表します。
