  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: ja
  text: あなたがたは、公正な天秤[a]、公正な重り、公正なエファ[b]、公正なヒン[c]を備えなければならない。わたしは、あなたがたをエジプトの地から導き出した、あなたがたの神、ヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公正な」は、ヘブライ語で「正義」「正しさ」を表す語。この節では、商取引に用いる天秤や度量衡が偽りなく公平であることを意味する。
    reason: lexical_alternative
  - marker: b
    text: エファは、古代の乾量単位。
    reason: cultural_note
  - marker: c
    text: ヒンは、古代の液量単位。
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: 公正な天秤
  rationale: מֹאזְנַיִםは取引で用いる天秤を指す。צֶדֶקの倫理的・司法的な力を保ちつつ、商取引の文脈で自然な「公正な」とした。
- source_word: אַבְנֵי צֶדֶק
  choice: 公正な重り
  rationale: אַבְנֵיは字義的には「石」だが、ここでは天秤に用いる石製の分銅を指すため「重り」とした。צֶדֶקは前句と同じく「公正な」と訳した。
- source_word: אֵיפַת צֶדֶק
  choice: 公正なエファ
  rationale: אֵיפָהは古代の乾量単位。現代の単位に不正確に換算せず、音写して文化的固有性を保った。
- source_word: וְהִין צֶדֶק
  choice: 公正なヒン
  rationale: הִיןは古代の液量単位。エファと同様に音写し、צֶדֶקの反復も「公正な」で再現した。
- source_word: יִהְיֶה לָכֶם
  choice: 用いなければならない
  rationale: 字義的には「あなたがたのためにあるべきだ」だが、度量衡を所有・使用する際の規範を命じる文脈に即し、現代日本語の法的・教示的表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語表記で音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 契約定型句における文脈上の単数として訳した。
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: あなたがたをエジプトの地から導き出した
  rationale: 出エジプトを指す定型的表現を、自然で荘重な現代日本語にした。
theological_decisions:
- issue: 商取引に関する規定で四度反復されるצֶדֶקの訳
  choice: 公正な
  alternative: 正しい／正確な／義にかなった
  rationale: 「正確な」だけでは測定精度に意味が狭まり、語が持つ正義と誠実さの倫理的要求が弱くなる。「公正な」は商取引における公平さを自然に示し、四度の反復も保てる。
- issue: 古代の度量単位の扱い
  choice: エファ、ヒンを音写する
  alternative: 乾量升、液量升、または現代単位への概算換算
  rationale: 原文の具体的な古代単位を保存し、不確かな現代換算による誤解を避ける。脚注で用途を簡潔に説明する。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／主なる神
  rationale: 原文にある固有の神名を称号へ置換せず、その区別を本文に保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法としての命令の重みを「用いなければならない」で表した。צֶדֶקの四度の反復をすべて「公正な」で再現し、神名と古代の単位は音写して原文の文化的・神学的輪郭を保った。
