id: LEV.19.23
reference: Leviticus 19:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: ja
  text: あなたがたがその地に入り、あらゆる食用の木を植えるとき、その実を「割礼を受けていないもの」と見なさなければならない[a]。三年間、その実はあなたがたにとって「割礼を受けていないもの」であり、食べられてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「割礼を受けていない」。ここでは比喩的に、最初の三年間はその実を食べることが許されていないという意味。
    reason: 原語の比喩を本文に残し、その法的な意味を明確にするため。
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: あなたがたがその地に入り……とき
  rationale: וְכִי はこの律法的文脈で将来の状況を示す。「その地」は本文にない「カナン」を補わず、定冠詞を反映する。
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: 食用となる木を植える
  rationale: עֵץ מַאֲכָל は食べられる実を結ぶ木を指す。「あらゆる」を機械的に加えず、כָּל の包括的な意味を日本語の無限定表現で自然に表した。
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: その実を「無割礼」のものと見なさなければならない
  rationale: ערל／ערלה の意図的な比喩を保持しつつ、果実に物理的処置を施す意味ではなく、法的な扱いを定める表現であることを「見なす」で示した。
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: 三年間、その実はあなたがたにとって無割礼のものであり
  rationale: 期間を前置する原文の強調と、לָכֶם の関係的な意味を保った。単数動詞と複数形容詞の不一致は、果実を集合的に指す「その実」で自然に処理した。
- source_word: לֹא יֵאָכֵל
  choice: 食べてはならない
  rationale: ニファルの受動・非人称的禁止が示す実際の規定を、明瞭で自然な日本語の禁止表現にした。
theological_decisions:
- issue: 果実に用いられた ערל／ערלה の比喩を保持するか、単に「禁じられた」と訳すか
  choice: 本文で「無割礼」を保持する
  alternative: 食べることを禁じられたもの
  rationale: 原文は割礼に関わる語を果実へ比喩的に適用しており、単に「禁じられた」とすると、その契約的・祭儀的な語感と反復が失われる。実際に食用禁止を意味することは、本文末尾と脚注で明確にした。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で格調を保った律法文体。「無割礼」は日常的でないが、原文固有の比喩を保持するため引用符と脚注を用いた。
