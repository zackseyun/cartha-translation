source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: ja
  text: あなたがたは、血の上で食べてはならない。[a] 占いをしてはならない。前兆を読んではならない。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「血と一緒に食べてはならない」。ヘブライ語の表現は難解で、血が残っている肉を食べること、または血に関わる儀礼的な食事に加わることを指す可能性がある。
    reason: alternative_reading
  - marker: b
    text: または「吉凶を占ってはならない」「時を見て占ってはならない」。このヘブライ語が指す占術の種類は確定しにくい。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: 食べてはならない
  rationale: 否定辞を伴う未完了形を、律法上の禁止として明瞭で格調ある現代日本語にした。
- source_word: עַל הַדָּם
  choice: 血の上で
  rationale: 意味の確定が難しい句であるため、前置詞 עַל の空間的表現を比較的直訳し、血を含む肉を食べることか、血に関わる儀礼的な食事かを本文で断定しない。
- source_word: תְנַחֲשׁוּ
  choice: 占いをする
  rationale: ピエル形の נחשׁ が表す占術の実践を、一般読者に分かりやすい現代日本語で表した。
- source_word: תְעוֹנֵנוּ
  choice: 吉凶を占う
  rationale: 語義には不確かさがあるが、前兆や時のしるしによって吉凶を判断する占術を指す可能性を、自然な日本語で示した。異なる伝統的理解は脚注に残した。
theological_decisions:
- issue: עַל הַדָּם が禁じる行為をどこまで特定するか
  choice: 本文では「血の上で」と比較的字義的に訳す
  alternative: 「血と一緒に」「血が残ったまま」「血に関わる儀礼の席で」
  rationale: この句が、血を含む肉を食べること、血に関わる儀礼的食事、または別の祭儀的行為のどれを指すかは確定しにくい。本文では曖昧さを保持し、具体的な可能性を脚注に示した。
- issue: תְעוֹנֵנוּ の占術の種類
  choice: 「吉凶を占う」と訳し、特定の方法に限定しない
  alternative: 「前兆を解く」「時を見て占う」「口寄せをする」
  rationale: 語源と正確な実践内容には議論があるため、占術一般の中で吉凶を判断する行為として表し、伝統的な別訳を脚注に示した。
translation_notes:
  register: 「〜てはならない」を反復して、現代日本語として明瞭さを保ちながら律法の厳粛な調子を出した。「血の上で」はやや異質に響くが、原文の genuine ambiguity を不用意に解消しないため意図的に保持した。
