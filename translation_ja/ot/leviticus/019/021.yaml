source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: ja
  text: その人は、ヤハウェに、自分の償いのささげ物[a]、すなわち償いのささげ物としての雄羊を、会見の天幕の入り口へ携えて来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪過のささげ物」または「賠償のささげ物」。ヘブライ語のאָשָׁם（アーシャーム）は、罪責と、その償いのために献げる供え物の両方を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 携えて来なければならない
  rationale: 接続詞を伴うヒフィル完了形が律法の文脈で示す命令的・規定的な力を、現代日本語の義務表現で明確にした。
- source_word: אֲשָׁמוֹ
  choice: 自分の償いのささげ物
  rationale: אָשָׁםは罪責と、それを償うための供え物の両方を指し得る。この箇所では犠牲動物が続けて特定されるため、供え物として訳しつつ、償いの意味を保った。
- source_word: לַיהוָה
  choice: ヤハウェのもとへ
  rationale: 前置詞לの方向性と、供え物を神に差し出す意味を表した。神名יהוהは固有名として「ヤハウェ」とした。
- source_word: אֶל פֶּתַח
  choice: 入り口に
  rationale: פֶּתַחの「入り口、開口部」という意味を、聖所の文脈に自然な日本語で表した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルの聖所を指す定型的な名称として、原語の「会見」と「天幕」を簡潔に保った。
- source_word: אֵיל
  choice: 雄羊
  rationale: אֵילが指定する成獣の雄羊を正確に表した。
- source_word: אָשָׁם
  choice: 償いのささげ物として
  rationale: 末尾の名詞句を、雄羊の祭儀上の役割を示す同格的な表現として訳した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された四文字神名を固有名として明示し、普通名詞的な称号に置き換えなかった。
- issue: אָשָׁםに含まれる罪責と償いの関係
  choice: 本文では「償いのささげ物」とし、語義の幅を脚注で示す
  alternative: 罪過のささげ物、賠償のささげ物
  rationale: ここでは祭儀上の供え物が直接指される一方、語そのものには罪責と賠償・償いの含意があるため、一方だけに限定しないよう脚注を付した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で厳かな律法文の調子とした。「携えて来なければならない」で規定の拘束力を示し、後半は「すなわち」で原文の同格的な補足を明確にした。
