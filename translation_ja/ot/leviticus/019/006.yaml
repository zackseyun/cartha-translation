  naturalness: 「あなたがたがいけにえを献げた日」でも意味は通りますが、「あなたがたのいけにえは、それを献げる日と翌日に」とすると、原文の「あなたがたのいけにえ」と、食べる対象である供え物とのつながりがより明瞭で自然です。
  terminology: 「いけにえ」「献げる」「火で焼く」は、明快な現代標準日本語として適切です。律法的な未完了形を「食べなければならない／焼かなければならない」とするのも、この文脈では許容されます。
