base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: ja
  text: あなたがたのいけにえは、それを献げる日とその翌日に食べなければならない。三日目まで残ったものは、火で焼かなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: あなたがたがいけにえを献げた日
  rationale: 時間を示す前置詞 בְּ を自然な日本語の「日」とし、זֶבַח は祭儀的な文脈を保ちながら一般読者にも分かる「いけにえ」とした。
- source_word: יֵאָכֵל
  choice: それを食べなければならない
  rationale: ニファル未完了形の受動表現を、日本語の律法規定として自然な義務表現にした。「それ」は文脈上のいけにえを指す補語である。
- source_word: וּמִמָּחֳרָת
  choice: とその翌日に
  rationale: מָחֳרָת の時間的意味を現代日本語で明確に表し、いけにえを献げた日と翌日の双方が食べられる期間であることを示した。
- source_word: וְהַנּוֹתָר
  choice: 残ったもの
  rationale: 分詞形が、許された期間後になお残存する部分を指すため、簡潔で自然な「残ったもの」とした。接続詞は日本語の文区切りによって表現した。
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: 三日目まで
  rationale: עַד の時間的限界を直接保ち、三日目に至るまで残っている状態を表した。
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: 火で焼かなければならない
  rationale: ニファルの受動的意味と律法上の規定を、日本語では自然な義務表現で示した。בָּאֵשׁ は手段を表す「火で」とした。
