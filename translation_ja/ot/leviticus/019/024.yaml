source:
  edition: WLC
  text: וּ/בַ/שָּׁנָה֙ הָ/רְבִיעִ֔ת יִהְיֶ֖ה כָּל פִּרְי֑/וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: ja
  text: しかし、四年目には、その実はすべて、ヤハウェへの賛美として聖なるものとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「聖なるもの、ヤハウェへの賛美」。または「聖なるもの、ヤハウェへの祝いの賛美」。ヘブライ語のこのまれな表現は、聖別された実がヤハウェへの賛美・祝祭に関わることを示すが、その正確な関係は明確でない。
    reason: まれな語הִלּוּלִיםと、קֹדֶשׁ הִלּוּלִים לַיהוָהの名詞句的・祭儀的な関係の曖昧さを保持するため。
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: しかし、四年目には
  rationale: 接続詞וを、最初の三年間との対比を示す「しかし」とし、前置詞בを時を表す「には」で表した。
- source_word: יִהְיֶה כָּל פִּרְיוֹ
  choice: その実はすべて…となり
  rationale: יִהְיֶהの法的文脈における将来的規定を「となる」で表し、כָּל פִּרְיוֹは木になる実の全体を指すため「その実はすべて」とした。
- source_word: קֹדֶשׁ
  choice: 聖なるもの
  rationale: 神のために取り分けられた状態を表す述語用法。日本語では名詞的な「聖なるもの」が文脈に自然である。
- source_word: הִלּוּלִים
  choice: 賛美するためのもの
  rationale: まれな複数名詞で、賛美ないし祝い喜ぶ行為を表す。原文に明示されない「供え物」を本文へ補わず、目的・用途として自然に表現した。
- source_word: לַיהוָה
  choice: ヤハウェを
  rationale: לが示す方向・帰属を、「賛美する」と結び付く自然な日本語の目的語で表した。神名יהוהは固有名として「ヤハウェ」と音写した。
theological_decisions:
- issue: קֹדֶשׁ הִלּוּלִים לַיהוָהというまれな祭儀的表現
  choice: 聖なるものとなり、ヤハウェを賛美するためのものとなる
  alternative: 聖なるもの、ヤハウェへの賛美となる／聖なるもの、ヤハウェへの祝いの賛美となる
  rationale: הִלּוּלִיםが実そのものを「賛美」と呼ぶのか、賛美のために用いることを示すのかは確定しにくい。本文では日本語として理解しやすい目的表現を採り、別訳を脚注に残した。「供え物」は原語に明示されないため避けた。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を明示するため音写した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法令調。前節までとの対比を「しかし」で示し、原文にない祭儀用語「供え物」は本文に加えなかった。
