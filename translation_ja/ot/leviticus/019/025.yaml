source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: ja
  text: 五年目には、その実を食べてよい。そうすれば、その木はあなたがたのために収穫を増す。わたしはあなたがたの神、ヤハウェである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: 五年目には
  rationale: 接続詞を日本語で不自然に明示せず、前節までの制限から第五年の許可へ移る法文の流れを「には」で示した。
- source_word: תֹּאכְלוּ
  choice: 食べてよい
  rationale: 法的文脈における未完了形を、禁止期間後の許可として自然な現代日本語で表した。
- source_word: אֶת־פִּרְיוֹ
  choice: その実
  rationale: פְּרִיは文脈上、植えた果樹の実を指す。「その」により男性単数接尾辞の指示関係を保持した。
- source_word: לְהוֹסִיף
  choice: こうして……増す
  rationale: לְ付き不定詞の目的・結果の含みを保持しつつ、日本語として明瞭にした。目的と結果の境界を過度に限定しない表現である。
- source_word: תְּבוּאָתוֹ
  choice: その木は……収穫を
  rationale: תְּבוּאָהの産出・収穫量という意味を「収穫」で表し、前半の「実」と区別した。主語の指示を自然な日本語にするため「その木」を補った。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: わたしはあなたがたの神、ヤハウェである
  rationale: 契約上の厳粛な自己宣言を保ち、神名יהוהを音写「ヤハウェ」で明示した。
theological_decisions:
- issue: 神名יהוהの訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約名を固有名として保持し、日本語で一般的な学術的音写を用いた。
- issue: 第五年に食べることと増収との関係
  choice: こうして、その木は……収穫を増す
  alternative: あなたがたの収穫が増すために
  rationale: לְהוֹסִיףが目的または結果を表し得る緊張を残し、増加の主体についても原文の男性単数接尾辞が直前の果樹を指す読みを反映した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法文としての簡潔さと神の自己宣言の荘重さを保った。「食べてよい」で許可の力を明示し、「こうして」は目的・結果双方の余地を残す。
