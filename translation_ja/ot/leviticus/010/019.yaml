id: LEV.10.19
reference: Leviticus 10:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: ja
  text: アロンはモーセに言った。「ご覧ください。今日、彼らは自分たちの罪のためのささげ物[a]と全焼のささげ物をヤハウェの前に献げました。しかし、このようなことが私の身に降りかかりました[b]。もし今日、私が罪のためのささげ物を食べていたなら、それはヤハウェの目に良いことだったでしょうか[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪のきよめのささげ物」とも訳せる。この節の二つの用例に当てはまる。ヘブライ語は「罪」と、罪や汚れからのきよめに関わる供え物の両方を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「このようなことが私に起こった」。アロンは、その日に息子たちが死んだことをはじめとする災いを指している。
    reason: cultural_note
  - marker: c
    text: 別訳「それはヤハウェに喜ばれたでしょうか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ご覧ください
  rationale: 注意を促して説明を切り出す語。古風な「見よ」より自然でありながら、アロンがモーセに釈明を始める力を保つ。
- source_word: הִקְרִיבוּ
  choice: 献げました
  rationale: ヒフィル形の祭儀的用法で、供え物を神の前に差し出すことを表す。日本語の祭儀文脈に自然な表現とした。
- source_word: חַטָּאתָם / חַטָּאת
  choice: 自分たちの罪のためのささげ物／罪のためのささげ物
  rationale: ここでは抽象的な「罪」ではなく祭儀上の供え物を指す。「罪のためのささげ物」は一般読者に意味が伝わりやすく、「罪のきよめのささげ物」という理解は脚注に残した。
- source_word: עֹלָתָם
  choice: 全焼のささげ物
  rationale: 祭儀用語として、全体を焼いて献げる供え物であることを明確にする。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の臨在の前で献げるというヘブライ語の定型的な祭儀表現を保つ。
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: このようなことが私の身に降りかかりました
  rationale: 直訳的な「このようなことが私に出会った」の意味を自然な日本語で表し、その日の災いを指すが、具体的な意味を本文で限定しない。
- source_word: וְאָכַלְתִּי
  choice: もし今日、私が…食べていたなら
  rationale: 形態上は接続詞付き完了形だが、後続の修辞疑問との関係から反実仮想的な条件として表した。
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: それはヤハウェの目に良いことだったでしょうか
  rationale: 神の是認を問う修辞疑問である。「目に良い」という原文の比喩を保ちつつ、現代日本語として理解できる形にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名として音写し、普通名詞的な称号に置き換えない。
theological_decisions:
- issue: アロンが供え物を食べなかった理由の性質
  choice: その日の災いを受けた状況で食べることがヤハウェに是認されたかを修辞疑問として問う
  alternative: 単に個人的な悲嘆を述べている、または祭儀上の資格の問題を明示的に論じていると理解する
  rationale: 原文は悲劇的出来事と食べることの適否を結び付けるが、問題が服喪、祭儀的状態、あるいはより広い意味での適切さのどれであるかは特定しないため、その緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、祭儀本文にふさわしい品位を保った。アロンからモーセへの発言なので「ご覧ください」「献げました」と丁寧体を用い、修辞疑問も自然な敬体で整えた。
