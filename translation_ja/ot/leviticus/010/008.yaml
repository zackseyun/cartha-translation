  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はアロンに次のように語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文では神名YHWH（四文字神名）。別表記「エホバ」。
    reason: 原語の神名と別表記を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: וַ付きの動詞で物語を進める神の発話を表す。日本語では、後続する לֵאמֹר と合わせて「こう告げた」とするのが自然であり、公式な語り口も保てる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語 YHWH を、称号に置き換えず、日本語で一般的な推定発音に基づいて音写した。
- source_word: אֶל
  choice: に
  rationale: 発話の相手を示す前置詞なので、自然な現代日本語の助詞「に」とした。
- source_word: אַהֲרֹן
  choice: アロン
  rationale: 人物名を、日本語聖書で広く通用する慣用表記で示した。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後に続く発言内容を導入する不定詞である。日本語では「言って」と重ねず、「こう告げた」として機能を明確かつ自然に表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: エホバ
  rationale: 原文は称号ではなく神の固有名 YHWH を用いているため、その固有名としての性格を保つ音写を本文に採用した。正確な古代発音には不確かさがあるため、別表記を脚注に示した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「こう告げた」により、ヘブライ語の定型的な発話導入を不自然な逐語調にせず、厳粛さを保って表現した。
