  terminology: 「聖なる場所」「息子たち」「ヤハウェ」は適切である。אִשֵּׁי は定型的な祭儀用語であり、「火によるささげ物」は可能な訳である。ただし脚注の「祭壇で焼かれて」という説明は語の語義を超えて儀礼の実行を限定的に説明するため、より中立的な語義注に改める。
