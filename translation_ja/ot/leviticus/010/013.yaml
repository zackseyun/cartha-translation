  source_fidelity: 本文は全体として原文の命令、祭儀的場所、祭司に割り当てられた分、男性の「息子たち」をよく反映している。ただし、末尾のヘブライ語受動完了形 צֻוֵּיתִי は、現在の継続状態を表しうる「命じられている」より、「命じられた」とするほうが直接的である。
