id: LEV.10.13
reference: Leviticus 10:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: ja
  text: あなたがたは、それを聖なる場所で食べなければならない。それは、ヤハウェへの火によるささげ物[a]の中から、あなたの取り分、またあなたの息子たちの取り分として定められたものだからである。私はそのように命じられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェの食物のささげ物」。ヘブライ語は、通常「火によるささげ物」と訳される祭儀用語。
    reason: אִשֵּׁי の代表的な別訳と祭儀用語としての性格を、儀礼の細部を断定せずに示すため。
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: あなたがたは……食べなければならない
  rationale: 男性複数への直接の指示を、現代日本語で明確な義務として表した。文頭の接続辞は、日本語では明示しなくても文脈上の連続性が保たれる。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 聖なる場所で
  rationale: 無冠詞の表現に即して特定の一室に限定せず、祭儀的な「聖」の語感を保った。
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: あなたとあなたの息子たちに定められた分
  rationale: 祭司に割り当てられる具体的な取り分を示す文脈なので、「おきて」ではなく、定められた分として訳した。בָּנֶיךָ は祭司職に関わる男性の子孫を指すため「息子たち」とした。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物
  rationale: אִשֶּׁה の火と結びつく祭儀的意味を本文で明示し、神名 יְהוָה は固有名として「ヤハウェ」とした。
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: 私はそのように命じられている
  rationale: 神から命令を受けたことを示す受動形と、כֵן の「そのように」という指示性を保持した。
theological_decisions:
- issue: 祭司の חֹק の意味
  choice: 定められた分
  alternative: おきて／受けるべき分
  rationale: ここでは抽象的な法令よりも、ささげ物から祭司に割り当てられた具体的な取り分が中心である。
- issue: אִשֵּׁי יְהוָה の訳し方
  choice: ヤハウェへの火によるささげ物
  alternative: ヤハウェの食物のささげ物
  rationale: 語の厳密な語源・ニュアンスには議論があるが、火を介する祭儀的ささげ物という伝統的かつ文脈的に明瞭な理解を採り、別訳を脚注に示した。
- issue: 「息子たち」の範囲
  choice: 息子たち
  alternative: 子どもたち／子孫
  rationale: 原文は男性複数を明示し、アロンの祭司家系という文脈にあるため、性別を一般化しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀本文にふさわしい荘重さを保った。「ヤハウェ」は神名として音写し、「聖なる場所」「ささげ物」など一般読者にも理解しやすい表現を選んだ。
