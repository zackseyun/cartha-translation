source:
  edition: WLC
  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: ja
  text: 見よ、その血は聖所の奥へ運び入れられなかった。あなたがたは、私が命じたとおり、それを聖なる場所で必ず食べるべきだった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「必ず食べるべきだった」――ヘブライ語では「食べる」という語を重ね、命令の強さを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 見よ
  rationale: 注意を強く促す語の機能を保ちつつ、荘重で明瞭な日本語とした。
- source_word: לֹא הוּבָא אֶת דָּמָהּ
  choice: その血は……運び入れられなかった
  rationale: הוּבָא は בוא のホファル形で、血が内部へ持ち込まれなかったことを受動表現で示す。
- source_word: אֶל הַקֹּדֶשׁ פְּנִימָה
  choice: 聖所の奥へ
  rationale: 方向を示す אֶל と、内部・奥を強調する פְּנִימָה の双方を自然な日本語で表した。「至聖所」とまでは特定しない。
- source_word: אָכוֹל תֹּאכְלוּ
  choice: 必ず食べるべきだった
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意を「必ず」で示し、過去の不履行を叱責する文脈を「べきだった」で表した。
- source_word: בַּקֹּדֶשׁ
  choice: 聖なる場所で
  rationale: 祭司がささげ物を食べるよう定められた聖別された区域を示す。前半の「聖所の奥」と区別し、場所の範囲を過度に限定しない訳とした。
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: 私が命じたとおり
  rationale: 先に与えられたモーセの命令を指す比較節を直接的に訳した。
theological_decisions:
- issue: 祭儀空間を表す二つの表現の区別
  choice: אֶל הַקֹּדֶשׁ פְּנִימָה を「聖所の奥へ」、בַּקֹּדֶשׁ を「聖なる場所で」と訳し分ける。
  alternative: 両方を「聖所」と訳す、または前者を「至聖所の中へ」と限定する。
  rationale: 前者には内部への方向を強める פְּנִימָה がある一方、後者は食べる場所を示す。儀礼上の対比を保ちつつ、本文が明示しない「至聖所」や「垂れ幕の内側」を補わない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、祭儀的文脈にふさわしい品位を保った。「見よ」は原文の強い注意喚起を伝えるために採用した。
