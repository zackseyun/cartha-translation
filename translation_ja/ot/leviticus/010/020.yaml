  terminology: 「モーセ」は日本語聖書で定着した人名表記である。評価表現「良しとした」は、原文の慣用的な「彼の目に良かった」の意味領域を十分に保つ。脚注も字義、自然な代案、解釈的な代案を区別なく断定せず提示しており適切である。
