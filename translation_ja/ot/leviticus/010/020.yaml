  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: ja
  text: モーセはこれを聞き、そのことを良しとした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「それは彼の目に良かった」。または「それは彼の目にかなった」「彼はそれを受け入れた」。
    reason: ヘブライ語の慣用句の字義と訳語の幅を示すため。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 聞き
  rationale: שׁמע の基本義「聞く」を保ち、前節のアロンの説明を受けたという物語の流れを示す。「理解した」「納得した」とまでは訳文で断定しない。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: וַיִּיטַב בְּעֵינָיו
  choice: そのことを良しとした
  rationale: 字義的には「それは彼の目に良かった」。日本語として自然で品位のある慣用表現にしつつ、そのことがモーセにとって適切・受け入れられるものだったという評価を表した。「納得した」ほど心理的理解を限定せず、「承認した」ほど公的決定の含みを強めない。
theological_decisions:
- issue: モーセの反応が理解・同意・承認のいずれを指すか
  choice: 良しとした
  alternative: 納得した／承認した／彼の目に良かった
  rationale: ヘブライ語は肯定的評価を示すが、その心理的・公的な性格を細かく限定していないため、曖昧さをある程度保てる表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「良しとした」という簡潔で格調ある表現を採用した。「これ」「そのこと」は前節のアロンの説明を受ける。
