  source_fidelity: 「あなたと共にいる息子たち」は、אִתָּךְ（「あなたと共に」）を日本語として不自然に「共にいる息子たち」という限定にし得る。原文はアロンとその息子たちの双方を対象とする定型的な言い方であり、その限定は避けるべきである。また、שֵׁכָרを単に「酒」とすると「ぶどう酒」と意味領域が重なり、日本語では何を区別しているかが本文上やや不鮮明である。
  naturalness: 「あなたも、あなたの息子たちも」とすれば、対象者を明瞭かつ自然に示せる。「ぶどう酒や、ほかの酔わせる酒」は、現代標準日本語として理解しやすく、ぶどう酒以外の酩酊性飲料という語義を本文でも区別できる。
  terminology: 「会見の天幕」は適切である。「飲んではならない」は命令の強さと法規的文体をよく保つ。「死ぬことがないように」は、וְלֹא תָמֻתוּの予防的・警告的な機能を自然に表す。「代々にわたる永遠の掟」は原文の定型句を保っており、維持できる。
  issues:
