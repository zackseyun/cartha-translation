id: LEV.10.9
reference: Leviticus 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ja
  text: あなたも、あなたの息子たちも、会見の天幕に入るときには、ぶどう酒や、ほかの酔わせる酒[a]を飲んではならない。あなたがたが死ぬことがないようにするためである。これは、代々にわたる永遠の掟である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ほかの酔わせる酒」は、ヘブライ語ではぶどう酒以外の酩酊性のある酒を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן
  choice: ぶどう酒
  rationale: ぶどうから造る発酵酒を指す標準的な語であり、「酒」一般と区別して明確に訳した。
- source_word: שֵׁכָר
  choice: 酒
  rationale: ぶどう酒以外の酩酊性飲料を広く指す。日本語では「強い酒」だとアルコール度数の高さに限定されやすいため、本文では自然な「酒」とし、範囲を脚注で示した。
- source_word: אַל תֵּשְׁתְּ
  choice: 飲んではならない
  rationale: אַל＋未完了形による禁止の力を、現代日本語の法的・訓戒的表現で示した。
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: あなたも、あなたと共にいる息子たちも
  rationale: アロン本人と彼と共にいる息子たちの双方を明示し、אִתָּךְも省略しなかった。
- source_word: בְּבֹאֲכֶם
  choice: 入るときには
  rationale: 前置詞בを伴う不定詞構文の時を表す意味を自然に示し、禁止が会見の天幕に入る場合に限定されることを保った。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルの聖所を指す定着した表現として、語義を簡潔に保った。
- source_word: וְלֹא תָמֻתוּ
  choice: あなたがたが死ぬことのないためである
  rationale: 禁止に続く警告を、回避すべき結果・目的として読める形で訳した。単純な結果保証にはしなかった。
- source_word: חֻקַּת עוֹלָם
  choice: 永遠の掟
  rationale: 継続的効力を持つ法規という定型句を、簡潔で荘重かつ現代的な日本語にした。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたる
  rationale: 後続する諸世代を通じた適用を表す契約・法規上の定型表現を自然に訳した。
theological_decisions:
- issue: 死の警告句の機能
  choice: 「あなたがたが死ぬことのないためである」とし、禁止に従うことで避けるべき死を示した。
  alternative: 「そうしなければ、あなたがたは死ぬ」または「あなたがたは死んではならない」
  rationale: וְלֹא תָמֻתוּは形の上では接続詞と否定未完了形であり、目的・回避される結果・帰結の含みがあり得る。本文は文脈上自然な予防的ニュアンスを採りつつ、機械的な因果関係を過度に断定しない。
- issue: 禁止の範囲
  choice: 会見の天幕に入るときの飲酒禁止として訳した。
  alternative: 祭司に対するあらゆる時と場合の全面禁酒命令
  rationale: בְּבֹאֲכֶם אֶל אֹהֶל מוֹעֵדという時・状況を限定する句をそのまま反映し、本文を超える一般的禁酒 doctrine を持ち込まなかった。
- issue: חֻקַּת עוֹלָםの時間的表現
  choice: 「代々にわたる永遠の掟」
  alternative: 「代々にわたる恒久の掟」
  rationale: עוֹלָםの持続性を「永遠」で表しつつ、לְדֹרֹתֵיכֶםを併記して世代を通じる法規という原文の重なりを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司への法的命令にふさわしい荘重さを保った。「あなたも、あなたと共にいる息子たちも」で原文の強調を再現し、禁止の適用場面と死の警告を別文にして読みやすくした。
