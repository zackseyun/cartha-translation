revisions:
- from: それからモーセは、アロンと、彼の残された息子たちエルアザルとイタマルに言った。「主への火によるささげ物のうち、残っている穀物のささげ物を取り、祭壇のそばで種なしのものとして食べなさい。それは最も聖なるものだからである。」
  to: それからモーセは、アロンと、その残された息子エルアザルとイタマルに言った。「ヤハウェへの火によるささげ物から残った穀物のささげ物を取り、祭壇のそばで種を入れずに食べなさい。それは最も聖なるものだからである。」
  rationale: 神名を「ヤハウェ」として原文とPOBの神名方針に合わせた。人名句の同格関係を自然な日本語で明示し、無酵母で食べるという命令も現代日本語として読みやすく整えた。祭儀用語、祭壇への近接、ならびに「最も聖なるもの」という最高度の聖性は保持している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:34:07Z'
