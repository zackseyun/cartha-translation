source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: ja
  text: それからモーセは、アロンと、その残された息子エルアザルとイタマルに言った。「ヤハウェへの火によるささげ物から残った穀物のささげ物を取り、祭壇のそばで種を入れずに食べなさい。それは最も聖なるものだからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それからモーセは……言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語の「それから」で表した。
- source_word: הַנּוֹתָרִים
  choice: 残された息子たち
  rationale: ナダブとアビフの死後に残った息子たちを指す分詞の意味を保ちつつ、「生き残った」と解釈的に強めることを避けた。
- source_word: הַמִּנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀用語として、一般的な贈り物ではなく穀物を用いる供え物を指すことを明確にした。
- source_word: הַנּוֹתֶרֶת
  choice: 残っている
  rationale: 主にささげられた分の後に残る部分を指す、女性単数分詞の意味を自然に表した。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: 主への火によるささげ物のうち
  rationale: אִשֶּׁה に含まれる火のイメージを保持し、מִן の部分・出所の関係も「うち」で示した。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される神名の慣用的な代替表記を用いた。原文では固有の神名YHWHである。
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: 種なしのものとして食べなさい
  rationale: מַצּוֹת が食べ方または形態を示す述語的・副詞的用法であることを表し、「パン」と原文以上に限定しなかった。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 祭壇のそばで
  rationale: אֵצֶל の近接性を、接触まで含意しない自然な日本語で表した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: ヘブライ語の最上級的表現を自然な日本語で示し、至聖所という場所との混同を避けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では日本語として定着した敬称「主」を採用したが、原文が一般名詞ではなく四文字神名YHWHを記すことは認識している。
- issue: קֹדֶשׁ קָדָשִׁים の対象
  choice: ささげ物を「最も聖なるもの」とする
  alternative: 「聖なるものの中でも聖なるもの」
  rationale: ここでは聖所の区画名ではなく、穀物のささげ物の祭儀上の聖性の最高区分を表す。
translation_notes:
  register: 明快で威厳のある現代標準日本語。祭儀用語は一貫して「ささげ物」とし、原文の命令と理由づけを簡潔に保った。固有名は一般的な日本語聖書表記を採用した。
