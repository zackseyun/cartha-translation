  naturalness: 現行の「彼の残された息子たちエルアザルとイタマル」は係り受けがやや不自然である。「その残された息子エルアザルとイタマル」とすることで、明快な現代標準日本語になる。「種なしのものとして食べなさい」も硬いため、「種を入れずに食べなさい」と自然にする。
  terminology: מִנְחָהは「穀物のささげ物」、אִשֵּי יהוהは火による供献を保って「ヤハウェへの火によるささげ物」、קדש קדשיםは「最も聖なるもの」とする。
  issues:
