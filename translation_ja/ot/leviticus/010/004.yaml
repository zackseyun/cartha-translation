  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: ja
  text: そこでモーセは、アロンのおじウジエルの息子であるミシャエルとエルツァファンを呼び、彼らに言った。「近寄りなさい。あなたがたの兄弟[a]を聖所の前[b]から宿営の外へ運び出しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」に当たるヘブライ語は、近い男性親族を広く指すことがある。ここでは、二人の従兄弟であるナダブとアビフを指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖なる場所の前」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び
  rationale: 物語の文脈で、相手に呼びかける、または呼び寄せる意。簡潔で自然な現代日本語とした。
- source_word: בְּנֵי עֻזִּיאֵל
  choice: ウジエルの息子である
  rationale: 二人がウジエルの直接の息子であることを表す構文として訳した。
- source_word: דֹּד אַהֲרֹן
  choice: アロンのおじ
  rationale: דּוֹד の通常の親族名称を保った。日本語の「伯父」「叔父」は年長・年少を区別するが、原文はそれを明示しないため、平仮名の「おじ」とした。
- source_word: קִרְבוּ
  choice: 近寄りなさい
  rationale: 聖所付近へ接近するという空間的な意味を保ち、命令として自然に表した。
- source_word: שְׂאוּ
  choice: 運び出しなさい
  rationale: 基本義は「持ち上げる、担う、運ぶ」。ここでは遺体をその場から宿営外へ移す命令なので、移動方向も含む自然な表現とした。
- source_word: אֲחֵיכֶם
  choice: あなたがたの兄弟
  rationale: אָח の直接的な親族表現を保った。ただし、ここで指すナダブとアビフは二人の実兄弟ではなく、近い男性親族であるため脚注で説明した。
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: 聖所の前から
  rationale: פְּנֵי の空間的な「前」の意味と、הַקֹּדֶשׁ が指す聖なる区域・聖所を簡潔に表した。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: אֶל が示す移動の方向を助詞「へ」で明確にした。
theological_decisions: []
