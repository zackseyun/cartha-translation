  source_fidelity: 「脂肪の火によるささげ物」は原文の「脂肪部分の火による供え物」をおおむね反映するが、「奉納物であるもも肉」は、もも肉と奉納物との関係を説明的に固定しすぎる。また、「これは…ものとなり、永続する定めとなる」は、原文の「永続する定めとして、あなたとあなたの息子たちのものとなる」、すなわち祭司家への恒久的な取り分という構文を不明瞭にしている。
  naturalness: 現行訳は概ね明瞭だが、「奉献物として揺り動かす」は直前の「揺り動かしてささげる」と対応が弱く、同根反復の祭儀用語としてもやや不自然である。「揺り動かす供え物としてささげる」とすると、現代日本語として読みやすく、原文の動詞と名詞の反復も保てる。
  terminology: 「ヤハウェ」は原文の神名に忠実であり適切。「もも肉」「胸肉」も適切である。תְּרוּמָה は本文では「奉納の」として簡潔に示し、脚注で「挙祭」という伝統訳と、取り分けられた献納部分という意味を説明する。אִשִּׁים は「火による供え物」とし、脂肪そのものではなく脂肪部分を火でささげる祭儀を表す。
