  to: '彼らは、奉納のもも肉[a][b]と、揺り動かしてささげる胸肉[c]を、脂肪部分の火による供え物に添えて持って来て、ヤハウェ[d]の前で揺り動かす供え物としてささげなければならない。これは、ヤハウェが命じたとおり、永続する定めとして、あなたとあなたの息子たちのものとなる。


