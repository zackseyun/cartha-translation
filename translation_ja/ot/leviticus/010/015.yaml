  - severity: medium
    issue: 「奉納物であるもも肉」が原文の並列関係を説明化している
    rationale: 原文は「奉納のもも肉」と「揺祭の胸肉」を並列する。日本語でも両者を対応する祭儀的修飾で示すほうが原文に近い。
