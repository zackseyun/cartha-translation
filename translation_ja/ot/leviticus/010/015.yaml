id: LEV.10.15
reference: Leviticus 10:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: ja
  text: '彼らは、奉納のもも肉[a][b]と、揺り動かしてささげる胸肉[c]を、脂肪部分の火による供え物に添えて持って来て、ヤハウェ[d]の前で揺り動かす供え物としてささげなければならない。これは、ヤハウェが命じたとおり、永続する定めとして、あなたとあなたの息子たちのものとなる。


    [a] 「もも肉」は「脚」とも訳せる。


    [b] 「奉納」は、取り分けて神にささげることを指す。伝統的には「挙祭」とも訳される。


    [c] 直訳は「揺り動かす供え物」。ヤハウェの前で儀礼的に差し出す供え物を指す。


    [d] 「ヤハウェ」は、ヘブライ語の神の名 יהוה（YHWH）を表す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もも肉」は「脚」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「奉納」は、取り分けて神にささげることを指す。伝統的には「挙祭」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「揺り動かす供え物」。ヤハウェの前で儀礼的に差し出す供え物を指す。
    reason: cultural_note
  - marker: d
    text: 「ヤハウェ」は、ヘブライ語の神の名 יהוה（YHWH）を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: もも肉
  rationale: 祭儀で祭司に与えられる後ろ脚の上部を指すと考えられるため。語義には「脚」の幅もあり、脚注で代案を示した。
- source_word: תְּרוּמָה
  choice: 奉納物
  rationale: 取り分けて神にささげる部分という意味を、古風な祭儀用語に依存せず表すため。
- source_word: חָזֶה
  choice: 胸肉
  rationale: 犠牲動物の部位を指す文脈なので、現代日本語で明確な解剖学的・食肉的表現とした。
- source_word: תְּנוּפָה / לְהָנִיף
  choice: 揺り動かしてささげる／奉献物として揺り動かす
  rationale: 名詞と同根動詞の反復、およびヤハウェの前で行う儀礼的動作を保ちつつ、日本語として理解できる形にした。
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: 脂肪の火によるささげ物とともに
  rationale: עַל の随伴的な意味を「とともに」で表し、אִשֵּׁי と脂肪部分が火にささげられる祭儀的内容を明示した。
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ לְחָק עוֹלָם
  choice: これは、あなたと、あなたとともにいる息子たちのものとなり、永続する定めとなる
  rationale: 祭司とその息子たちに与えられる権利、および継続的な規定という二面を自然な日本語で保持した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を本文で明示し、脚注でYHWHとの対応を説明した。
- issue: תְּנוּפָה の祭儀的意味
  choice: 揺り動かす動作を本文に残す
  alternative: 一般化して「奉献物」「ささげ物」とだけ訳す
  rationale: 原文が同根の名詞と動詞を重ねているため、具体的な儀礼動作を消さずに訳した。ただし、その正確な所作を本文以上に規定しない。
- issue: חָק עוֹלָם の時間的射程
  choice: 永続する定め
  alternative: 永遠の掟
  rationale: 祭儀制度内で継続して効力を持つ規定を表しつつ、後代の神学的体系によってその射程を過度に限定または絶対化しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法文としての威厳を保つため「なければならない」「永続する定め」とした。祭儀用語は必要以上に古風にせず、原文の反復と具体性を可能な限り残した。
