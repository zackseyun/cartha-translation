id: LEV.10.10
reference: Leviticus 10:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: ja
  text: 聖なるものと聖別されていないもの[a]、また、汚れたものと清いもの[b]を区別するためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別されていないもの」とは、聖なるものとして取り分けられていない通常のものを指す。冒瀆的なものという意味とは限らない。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れた」「清い」は、祭儀上の状態を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: 区別するためである
  rationale: 不定詞が前節から続く目的を表しているため、「区別するため」とした。「区別する」は、単に物理的に分離するのでなく、祭司が二つの区分を見分ける働きを自然に表す。
- source_word: בֵּין
  choice: 〜と〜とを
  rationale: 繰り返される前置詞が、対になった区分の間の対照を示すため、日本語では「AとBとを区別する」という形で表した。
- source_word: הַקֹּדֶשׁ
  choice: 聖なるもの
  rationale: 特定の一つの物ではなく、神のために取り分けられたものの区分全体を指すため、カテゴリーとして読める表現にした。
- source_word: הַחֹל
  choice: 俗なるもの
  rationale: 「聖なるもの」と対照される、聖別されていない通常の領域を表す。日本語の祭儀的文脈で簡潔に対を成す「俗なるもの」を採用し、悪や冒瀆を必ずしも意味しないことを注で補った。
- source_word: הַטָּמֵא
  choice: 汚れたもの
  rationale: レビ記における祭儀上の状態を表す定着した訳語であり、道徳的悪と同一視しないよう注を付した。
- source_word: הַטָּהוֹר
  choice: 清いもの
  rationale: 「汚れたもの」と対になる祭儀上の清さを表し、現代日本語でも理解しやすい表現とした。
theological_decisions:
- issue: קֹדֶשׁ と חֹל が示す祭司的な聖・俗の対照
  choice: 聖なるものと俗なるもの
  alternative: 聖なるものと普通のもの／聖なるものと聖でないもの
  rationale: 原文の二つの祭儀的カテゴリーを簡潔に保持した。「俗」はここで冒瀆的・邪悪という意味ではなく、聖別されていない通常のものを指すため、その点を脚注で明示した。
- issue: טָמֵא と טָהוֹר の性質
  choice: 汚れたもの／清いものを祭儀上の区分として訳す
  alternative: 不浄なもの／清浄なもの
  rationale: レビ記の文脈では主として祭儀上の状態を指す。「汚れた／清い」は明快で自然だが、あらゆる汚れを道徳的罪と受け取らないよう脚注で範囲を示した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、祭司的区分を示す簡潔で荘重な調子を保った。前節から続く目的表現であることを「〜ためである」によって示した。
