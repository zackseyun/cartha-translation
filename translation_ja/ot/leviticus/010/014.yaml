source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: ja
  text: また、あなたは息子たち、娘たちと共に、揺り動かしてささげる胸肉[a]と、奉納物のもも肉[b]を、清い場所で食べなければならない。これらは、イスラエルの子らの平和のいけにえ[c]から、あなたとあなたの息子たちに定められた取り分として与えられているからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「揺り動かすささげ物の胸肉」。主の前で揺り動かしてささげる儀礼に属する胸肉を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「奉納物のもも肉」。原語は、持ち上げる、または取り分けてささげる物を表す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「交わりのいけにえ」。原語には平和、全き状態、安寧などの意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 奉献のために揺り動かした胸肉
  rationale: חֲזֶהは犠牲動物の胸の部分、תְּנוּפָהは主の前で揺り動かして奉献する儀礼を指す。日本語では儀礼動作を明示することで、専門用語だけに頼らず意味を伝える。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 奉納されたもも肉
  rationale: שׁוֹקは脚ないしももの部位、תְּרוּמָהは取り分けて差し出される奉納物を表す。祭司に与えられる部位であることを自然な日本語で示した。
- source_word: תֹּאכְלוּ
  choice: 食べなければならない
  rationale: この未完了形は祭儀規定における指示・義務を表すため、許可ではなく命令的な力を保った。
- source_word: בְּמָקוֹם טָהוֹר
  choice: 清い場所で
  rationale: טָהוֹרはレビ記の文脈で祭儀上の清さを指すが、本文では原語どおり簡潔に「清い」とし、過度な説明を加えない。
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: あなたは、あなたの息子たち、娘たちと共に
  rationale: 息子と娘を明記する原文を保ちつつ、日本語として自然な並びにした。
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: あなたとあなたの息子たちの取り分
  rationale: חֹקはここでは法令そのものではなく、定められた祭司の分け前を指すため「取り分」とした。
- source_word: נִתְּנוּ
  choice: 与えられた
  rationale: 受動完了形が表す、すでに定められ現在も有効な授与を文脈上自然に表現した。
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: 交わりのいけにえ
  rationale: שְׁלָמִיםは平和、健全、繁栄を含み得る語であり、祭儀における神との交わりも示唆する。「和解」に限定せず、別訳を脚注に残した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の定型的な親族表現を保ち、イスラエル共同体全体を指す呼称として訳した。
theological_decisions:
- issue: שְׁלָמִיםの意味範囲
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平和のささげ物
  rationale: 語根が示す平和・全き状態という含意を認めつつ、祭儀の性格を日本語読者に伝える訳を本文に置いた。意味範囲を一つに固定しないよう別訳を脚注に示した。
- issue: בְּנֵי יִשְׂרָאֵלの共同体的指示
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 男性複数の「子ら」という原文の形を保持する一方、文脈上はイスラエル共同体を総称する定型句として理解する。
- issue: 祭司の家族が食べる権利と義務
  choice: 食べなければならない
  alternative: 食べてよい
  rationale: תֹּאכְלוּの指示的用法を義務として表し、単なる許可へ弱めない。息子だけでなく娘も明記される原文を維持した。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で品位ある祭儀規定の文体とした。「胸肉」「もも肉」で具体的部位を示し、「清い」「取り分」などレビ記の主要概念は簡潔に保った。専門的な祭儀語の曖昧さは脚注で補足した。
