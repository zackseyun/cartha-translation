revisions:
- from: また、あなたは、あなたの息子たち、娘たちと共に、奉献のために揺り動かした胸肉[a]と、奉納されたもも肉[b]を、清い場所で食べなければならない。これらは、イスラエルの子らが献げる交わりのいけにえ[c]の中から、あなたとあなたの息子たちの取り分として与えられたからである。
  to: また、あなたは息子たち、娘たちと共に、揺り動かしてささげる胸肉[a]と、奉納物のもも肉[b]を、清い場所で食べなければならない。これらは、イスラエルの子らの平和のいけにえ[c]から、あなたとあなたの息子たちに定められた取り分として与えられているからである。
  rationale: 原文の構文と祭儀用語をより直接に反映するため、「交わりのいけにえ」を「平和のいけにえ」に改め、「イスラエルの子らが献げる」という補足動詞を除きました。また、奉納対象として読める「奉納されたもも肉」を、祭儀上の名称として自然な「奉納物のもも肉」に改めました。指示・義務の力、家族の列挙、清さ、および祭司に割り当てられた取り分は保持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:34:14Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の骨格、食べる者（本人・息子・娘）、清い場所、祭司の定めの取り分という要素は原文に忠実です。しかし、「交わりのいけにえ」はשְׁלָמִיםの意味を「交わり」に寄せる解釈的な訳であり、「平和のいけにえ」のほうが原語の広い語義をより直接に保てます。また「イスラエルの子らが献げる」は原文にない動詞を補っており、構文どおり「イスラエルの子らの…いけにえから」とするのが適切です。「奉納されたもも肉」も、肉自体の受動的な奉納を述べる形になるため、「奉納物のもも肉」として原語の祭儀的分類を保つほうがよいです。
  naturalness: 現代標準日本語として概ね読みやすいですが、「あなたは、あなたの息子たち、娘たちと共に」は読点が多く、やや硬直しています。「あなたは息子たち、娘たちと共に」と整えられます。改訂文は祭儀規定として明瞭で品位ある文体を維持します。
  terminology: 「清い場所」「取り分」「イスラエルの子ら」は文脈に適しています。שְׁלָמִיםは本文で「平和のいけにえ」とし、脚注で「交わりのいけにえ」を代替訳として示します。תְּנוּפָהとתְּרוּמָהは、本文で儀礼的区別を保ちつつ脚注で説明します。
