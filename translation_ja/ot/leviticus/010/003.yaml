  to: 'モーセはアロンに言った。「これは、ヤハウェがこう語られたことである。


    『わたしに近づく者たちの間で、


    わたしは聖なる方として示される[a]。


    民すべての前で、


    わたしは栄光を受ける[b]。』」


    アロンは黙っていた。'
  rationale: 原文の並行する受動的表現を、明瞭で自然な現代日本語に改めた。「聖なる方として示される」は神の聖性の顕現という主文の読みを表し、脚注で人間側が神を聖として扱う読みを保持する。「栄光を受ける」は אֶכָּבֵד の公的な栄誉・栄光を受ける意味を過不足なく表す。
