source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: ja
  text: 'モーセはアロンに言った。「これは、ヤハウェがこう語られたことである。


    『わたしに近づく者たちの間で、


    わたしは聖なる方として示される[a]。


    民すべての前で、


    わたしは栄光を受ける[b]。』」


    アロンは黙っていた。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしに近づく者たちによって、わたしは聖なる方として扱われる」。ヘブライ語は、神の聖性が現されることとも、神に近づく者が神を聖なる方として認めることとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 別訳「あがめられる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、一般的な日本語音写で表した。
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: これはヤハウェが語られたことである
  rationale: 同定を表す構文と דבר の意味を保ちつつ、荘重で自然な現代日本語とした。
- source_word: בִּקְרֹבַי
  choice: わたしに近づく者たちのうちに
  rationale: 神への接近という祭儀的含意を保ちながら、「祭司」と限定せず、前置詞 ב の「うちに／によって」という幅も残した。
- source_word: אֶקָּדֵשׁ
  choice: わたしは聖なる者として現される
  rationale: קדש のニファルが持つ、神の聖性が現されることと、聖なる方として認められることの両面をできる限り保持した。
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: 民すべての前で
  rationale: 公然性を示すヘブライ語表現を、簡潔で自然な日本語にした。
- source_word: אֶכָּבֵד
  choice: わたしは栄光を現される
  rationale: כבד のニファルが示す、公に栄誉・栄光を受ける意味を神学的な重みとともに表した。
- source_word: וַיִּדֹּם
  choice: アロンは黙っていた
  rationale: 衝撃の中で沈黙し、静まった反応を、解釈を加えず簡潔に表した。
theological_decisions:
- issue: 神に近づく者との関係で、神が聖とされることをどう表すか
  choice: わたしに近づく者たちのうちに、わたしは聖なる者として現される
  alternative: わたしに近づく者たちによって、わたしは聖なる方として扱われる
  rationale: 原文は、神の聖性が裁きなどを通して現れる意味と、近づく者が神を聖なる方として認めて扱う意味の双方を許す。本文では前者を採り、後者を脚注に残した。
- issue: אֶכָּבֵד が表す公の栄誉
  choice: わたしは栄光を現される
  alternative: わたしはあがめられる
  rationale: 神の栄光が公に示される意味を保ちつつ、原文の受動的な形を反映した。より人間側の敬意に焦点を置く訳も可能なので脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の宣言には簡潔で荘重な調子を保った。詩的な並行構造が見えるよう改行し、アロンの反応は説明を加えず短く結んだ。
