    issue: 「聖なる者として現される」
    rationale: 神を指す「者」は不適切であり、「現される」も何がどのように現されるかが日本語として曖昧である。
  - severity: high
    issue: 「栄光を現される」
    rationale: 原文のニファル（神が栄光・誉れを受ける）ではなく、神が栄光を現すという別の意味に読まれやすい。
