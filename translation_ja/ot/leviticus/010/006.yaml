review_pass:
  verdict: revise
  source_fidelity: 「髪を振り乱してはならない」「衣を引き裂いてもならない」は、服喪のしるしを禁じる原文をよく伝えている。しかし、「…ないようにするためである」は禁止命令に対する日本語として不自然で、原文の警告・結果関係も明瞭にしていない。「焼き滅ぼし」は文脈に適うが、原文の「焼く」と「焼き」の同根語反復に対して「引き起こした」は火・焼くという動詞的要素を弱めている。また、יִבְכּוּ は本文ではイスラエル全体について述べる未完了形であり、「嘆き悲しみなさい」という直接命令より「嘆き悲しむであろう」が適切である。
  naturalness: 現行の前半は明瞭である一方、「あなたがたが死ぬことも、全会衆に憤りが下ることもないようにするためである」は、何を「するため」なのかが文法的・論理的に不安定である。警告として「さもないと」を用いると、簡潔な現代標準語になる。
  terminology: 「ヤハウェ」「全会衆」「イスラエルの全家」は一貫しており適切である。「頭髪を乱す」は服喪の慣行をより直接に表す。「焼き滅ぼし」は死者が出た直前の文脈にかなうが、脚注で原文の同根語反復を示す。
  issues:
  - severity: medium
    issue: 警告節が不自然な目的表現になっている。
    rationale: וְלֹא תָמֻתוּ וְעַל־כָּל־הָעֵדָה יִקְצֹף は、二つの禁止に伴う結果の警告である。「…ないようにするためである」では主文とのつながりが成立しにくい。
  - severity: medium
    issue: 「嘆き悲しみなさい」は原文の叙述的未完了形を直接命令に変えている。
    rationale: יִבְכּוּ の主語は「あなたがたの兄弟たち、イスラエルの全家」であり、ここでは彼らが嘆き悲しむことを述べる形が安全である。
  - severity: low
    issue: 「ヤハウェが引き起こした」は原文の「焼く」という語を一般的な因果表現にしている。
    rationale: 自然な日本語を保ちつつ、「焼き滅ぼされた」という表現で火による出来事と神の直接的行為を本文に残せる。
  revised_text: モーセはアロンと、その子エルアザルおよびイタマルに言った。「頭髪を乱してはならない[a]。衣を引き裂いてもならない。さもないと、あなたがたは死に、全会衆に憤りが下る[b]。しかし、あなたがたの兄弟たち、すなわちイスラエルの全家は、ヤハウェが焼き滅ぼされた焼き滅ぼし[c]を嘆き悲しむであろう。」
  revised_footnotes:
  - marker: a
    text: 「頭を覆わずにいてはならない」または「髪を乱れたままにしてはならない」とも訳せる。ヘブライ語は、頭または髪に関わる服喪のしぐさを指す。
    reason: lexical_alternative
  - marker: b
    text: 「憤る」の主語は原文に明記されていない。文脈上はヤハウェが暗黙の主語と考えられる。
    reason: preserve_ambiguity
  - marker: c
    text: 直訳は「ヤハウェが焼いた、その焼き滅ぼし」。原文では「焼く」と「焼き滅ぼし」という同根語が重ねられている。
    reason: lexical_alternative
  revision_rationale: 警告節を「さもないと」に改め、禁止に続く死と全会衆への憤りの結果を明瞭にした。「頭髪を乱してはならない」で服喪の頭髪のしぐさを自然に表し、יִבְכּוּ はイスラエル全体についての叙述として「嘆き悲しむであろう」とした。「ヤハウェが焼き滅ぼされた焼き滅ぼし」は原文の同根語反復を保とうとするが、日本語としてやや硬い表現である。
