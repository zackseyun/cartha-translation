reference: Leviticus 10:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: ja
  text: モーセはアロンと、その息子エルアザルおよびイタマルに言った。「髪を振り乱してはならない[a]。衣を引き裂いてもならない。あなたがたが死ぬことも、全会衆に憤りが下ることもないようにするためである[b]。しかし、あなたがたの兄弟たち、すなわちイスラエルの全家は、ヤハウェが引き起こした焼き滅ぼし[c]を嘆き悲しみなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「頭を覆わずにいてはならない」または「髪を乱れたままにしてはならない」とも訳せる。ヘブライ語は、頭または髪に関わる服喪のしぐさを指す。
    reason: lexical_alternative
  - marker: b
    text: 「憤る」の主語は原文に明記されていない。文脈上はヤハウェが暗黙の主語と考えられる。
    reason: preserve_ambiguity
  - marker: c
    text: 直訳は「ヤハウェが焼いた、その焼き滅ぼし」。原文では「焼く」と「焼き滅ぼし」という同根語が重ねられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: 髪を振り乱してはならない
  rationale: פרע はここで、頭髪を解いたまま乱れさせる喪のしぐさを指すと考えられる。日本語では行為とその喪のイメージが明瞭になる表現を採り、別解は脚注に残した。
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: 衣を引き裂いてもならない
  rationale: פרם は、とりわけ服喪のしるしとして衣服を裂くことを表す。「衣」は祭司の装いを扱う文脈にもふさわしい簡潔で格調ある語である。
- source_word: וְלֹא תָמֻתוּ וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: あなたがたが死ぬことも、全会衆に憤りが下ることもないようにするためである
  rationale: 二つの禁止に続く結果・警告として自然な日本語にした。יִקְצֹף は単数動詞で主語が明記されないため、本文では「憤りが下る」とし、ヤハウェを明示的主語として補わず曖昧さを保った。
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: あなたがたの兄弟たち、すなわちイスラエルの全家
  rationale: 「兄弟たち」という原語の具体性を保ち、後続の同格句によってイスラエル共同体全体を指すことを示した。
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: 焼き滅ぼしを嘆き悲しみなさい
  rationale: שְׂרֵפָה の火による破壊という具体像を保ちつつ、日本語で単なる火事と誤解されにくい表現とした。文脈上の命令的な力を「なさい」で表した。
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: ヤハウェが引き起こした
  rationale: 同根語をそのまま反復すると日本語では極端に不自然になるため、神の直接的な関与を保ちながら自然な表現にした。原文の語の反復は脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって表した。
theological_decisions:
- issue: יִקְצֹף の主語を明示するか
  choice: 本文では主語を明示せず「全会衆に憤りが下る」とする
  alternative: 「ヤハウェが全会衆に対して憤られる」
  rationale: 直前の出来事からヤハウェが暗黙の主語と理解できるが、ヘブライ語本文には主語名がない。日本語でも主語を補わず、神の憤りという文脈を保った。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された契約の神の固有名を保持し、称号への置換を避けた。
- issue: הַשְּׂרֵפָה を災厄・裁きと解釈するか
  choice: 焼き滅ぼし
  alternative: 災い／裁き
  rationale: 火による出来事という原文の具体像を保持し、それが「裁き」であるとの解釈語を本文に持ち込まなかった。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、祭司への厳粛な命令にふさわしい格調を保った。「衣」「全会衆」「イスラエルの全家」など、聖書本文として定着しやすい簡潔な語を用いた。
