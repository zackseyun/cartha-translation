  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: ja
  text: モーセは罪のきよめのささげ物の雄やぎを念入りに捜した[a]。見ると、それはすでに焼かれていた[b]。そこでモーセは、アロンの残された息子たち[c]、エルアザルとイタマルに腹を立てて言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「捜しに捜した」。ヘブライ語では不定詞絶対形と定動詞を重ねて、行為を強調している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すっかり焼かれていた」。ヘブライ語は、雄やぎが焼かれた状態で見つかったことを示す。
    reason: lexical_alternative
  - marker: c
    text: 「アロンの残された息子たち」とは、ナダブとアビフの死後に残ったエルアザルとイタマルを指す（レビ記10:1–2、12）。
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: 罪のきよめのささげ物の雄やぎ
  rationale: שְׂעִירを「雄やぎ」とし、חַטָּאתは罪を除き清める祭儀的機能が伝わる「罪のきよめのささげ物」とした。
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: 念入りに捜した
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を、自然な現代日本語で表した。文脈上、単なる照会ではなく、雄やぎの所在を捜し求めた行為を指す。
- source_word: וְהִנֵּה
  choice: ところが
  rationale: 発見時の驚きと予想外の事態への注意喚起を、物語として自然な逆接表現で示した。
- source_word: שֹׂרָף
  choice: すでに焼かれていた
  rationale: 受動分詞が示す、発見時に焼かれた状態にあったことを表す。完全に焼き尽くされたかどうかは本文で断定せず脚注に残した。
- source_word: וַיִּקְצֹף
  choice: 腹を立てて
  rationale: 怒りを表す動詞の強さを過度に増幅せず、後続する発言へ自然につないだ。
- source_word: הַנּוֹתָרִם
  choice: 残された
  rationale: ナダブとアビフの死後に残った息子たちという文脈を保ちつつ、「生き残った」より解釈を抑えた。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 次節の直接話法を導く定型句として、日本語では文末を「言った」として自然に完結させた。
theological_decisions:
- issue: חַטָּאתの祭儀名称
  choice: 罪のきよめのささげ物
  alternative: 罪祭／罪のためのいけにえ
  rationale: 語が罪に関わるだけでなく、祭儀上の清め・除去の働きを持つことを示しつつ、特定の教派的解釈に限定しない表現を選んだ。
translation_notes:
  register: 明瞭で現代的ながら礼拝文書にふさわしい品位を保った。「ところが」でוְהִנֵּהの発見と意外性を自然に示し、語順は日本語として読みやすく整えた。すべての脚注記号を対応箇所に配置した。
