source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: ja
  text: 「会見の天幕の入り口から外へ出てはならない。さもないと、死ぬことになる。ヤハウェの注ぎの油があなたがたの上にあるからだ。」彼らはモーセの言葉どおりにした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口から外へ
  rationale: מִןの起点を「から」、פֶּתַחを「入り口」とし、יָצָאの方向が明確になるよう「外へ」を補った。אֹהֶל מוֹעֵדは、幕屋における定型的な聖所名として「会見の天幕」とした。
- source_word: לֹא תֵצְאוּ
  choice: 出てはならない
  rationale: 否定を伴う未完了形がここでは厳粛な禁止を表すため、現代日本語の明確な禁止表現とした。
- source_word: פֶּן תָּמֻתוּ
  choice: そうすれば、あなたがたは死ぬことになる
  rationale: פֶּןが示す、禁止に背いた場合の警告的な帰結を自然な日本語で表した。「死なないために」と目的に限定せず、原文の警告の力を保った。
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: ヤハウェの注ぎの油
  rationale: 祭司を聖別するために注がれた油を指す構文を簡潔に再現し、神名יהוהは称号に置き換えず「ヤハウェ」と音写した。
- source_word: עֲלֵיכֶם
  choice: あなたがたの上にある
  rationale: 油が彼らの身に施されているというעלの空間的・儀礼的な含みを、解釈を加えすぎず保持した。
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: 彼らはモーセの言葉どおりにした
  rationale: 物語を進めるוַと、モーセの命令への一致を示すכִּדְבַרを、簡潔で自然な日本語にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名יהוהが明記されているため、称号「主」に置換せず、一般的な日本語音写によって固有名として示した。
- issue: 注ぎの油が「上にある」ことの意味
  choice: 比喩的説明を加えず「あなたがたの上にある」と訳す
  alternative: あなたがたはヤハウェによって聖別されている
  rationale: 文脈上は祭司としての聖別を指すが、原文は油が彼らの上にあると述べる。翻訳本文では具体的な象徴表現を保持し、その神学的意味に言い換えなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀的な荘重さを保った。「会見の天幕」「注ぎの油」はレビ記の用語として一貫性を持たせられる表現である。
