source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: ja
  text: アロンの息子たち、ナダブとアビフは、それぞれ自分の火皿を取り、その中に火を入れ、その上に香を置いた。そして、ヤハウェが彼らに命じなかったよその火[a]を、ヤハウェの前にささげた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異質な火」「外国の火」とも訳せる。文脈上、「許可されていない火」と理解される。続く句は、それがヤハウェが彼らに命じなかった火であったことを説明している。
    reason: אֵשׁ זָרָה の語義上の選択肢と、直後の説明句による文脈上の限定を示すため。
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 取った
  rationale: 物語を進める基本動詞。後続する一連の祭儀的行為を自然な現代日本語で表す。
- source_word: בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: アロンの息子ナダブとアビフ
  rationale: 構文上の親子関係と二人の固有名を明確に保つ。
- source_word: אִישׁ מַחְתָּתוֹ
  choice: それぞれ自分の火皿
  rationale: אִישׁの配分的用法を「それぞれ」で示し、מַחְתָּהは炭火を扱う器であるため、教会用語的な「香炉」より具体的な「火皿」とした。
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: その中に火を入れた
  rationale: 複数形の代名詞は二人の火皿を受けるが、日本語では直前の「それぞれ自分の火皿」に合わせ、配分的な単数表現が自然である。
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: その上に香を置いた
  rationale: 単数女性接尾辞を配分的に各火皿へ結びつける。「香」は祭儀で焚く香料を簡潔に表す。
- source_word: וַיַּקְרִבוּ
  choice: ささげた
  rationale: קרבのヒフィル形が祭儀的文脈で持つ、神前に差し出す意味を自然に表す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 祭儀的な定型表現を保ち、神名は固有名として音写する。
- source_word: אֵשׁ זָרָה
  choice: 異なる火
  rationale: זָרָהの基本的な「異質な、よその」という含みを保ち、何が問題だったかは直後の説明節に語らせることで、原文以上に意味を限定しない。
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: すなわち、ヤハウェが彼らに命じていなかった火
  rationale: 関係節が「異なる火」を説明する働きを明示する。命令者は文脈上ヤハウェであり、日本語では主語を補うことで誤読を避ける。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神の固有名を、一般的な日本語音写で示す。
- issue: אֵשׁ זָרָה の意味範囲
  choice: 異なる火
  alternative: 許可されていない火／よその火
  rationale: 直後の「命じていなかった」が違反の性質を説明しているため、本文では語の異質性を保ち、明示的に「無許可」と解釈し切らない。
translation_notes:
  register: 明瞭で品位ある現代標準語。祭儀用語は専門的になりすぎない「火皿」「香」「ささげる」を用いた。ヘブライ語の連続動作は、日本語の可読性のため二文に分けた。
