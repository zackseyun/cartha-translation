id: LEV.10.2
reference: Leviticus 10:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: ja
  text: すると、ヤハウェの前から[a]火が出て、二人を焼き尽くした。こうして二人はヤハウェの前で死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェの前から」は、「ヤハウェの臨在から」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: 出て
  rationale: יצא の物語を進める形であり、火が神の御前から外へ現れた方向性を自然な日本語で示す。
- source_word: אֵשׁ
  choice: 火
  rationale: ここでは裁きをもたらす実際の火を指す。
- source_word: מִלִּפְנֵי יְהוָה
  choice: ヤハウェの前から
  rationale: 「ヤハウェの顔／臨在の前から」という空間的かつ神学的な表現を、原文の形を保って訳した。
- source_word: וַתֹּאכַל
  choice: 焼き尽くした
  rationale: אכל は字義的には「食べる」だが、火を主語とすると「焼き尽くす」が自然で、破壊的な作用を明確に伝える。
- source_word: אֹתָם
  choice: 二人を
  rationale: 直前の文脈に登場するナダブとアビフを指すため、日本語では指示対象が明瞭になるよう「二人」とした。
- source_word: וַיָּמֻתוּ
  choice: 二人は…死んだ
  rationale: מות の能動・自動詞的表現を保ち、原因は先行節に委ねて「殺された」とは補わない。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 原文に反復される לפני יהוה を保ち、出来事が神の御前で起きたことを荘重かつ明瞭に示す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の契約の神名を固有名として示し、普通名詞的な称号へ置き換えない。
- issue: וַיָּמֻתוּ を単純な結果として訳すか、受動的な殺害として訳すか
  choice: 死んだ
  alternative: 殺された
  rationale: ヘブライ語は「死んだ」という能動の自動詞形であり、直前の火が原因を十分に示しているため、受動的な因果表現を付加しない。
- issue: וַתֹּאכַל の破壊の程度
  choice: 焼き尽くした
  alternative: 焼いた／のみ込んだ
  rationale: 火を主語とする אכל の慣用的な力を表す一方、遺体が物理的に完全消滅したとの説明までは加えない。
translation_notes:
  register: 明快な現代標準語を用いながら、神の裁きの場面にふさわしい簡潔で荘重な調子を保った。「すると」と「こうして」により、原文の連続する物語展開と因果関係を自然に示した。
