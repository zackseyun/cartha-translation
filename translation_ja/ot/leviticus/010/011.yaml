  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: ja
  text: また、イスラエルの子らに、ヤハウェがモーセを通して彼らに語ったすべての定めを教えること[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「モーセの手によって」。
    reason: בְּיַד מֹשֶׁהはモーセを仲介者とするヘブライ語の慣用表現である。本文では自然な日本語として「モーセを通して」と訳した。
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: また、……教えるためである
  rationale: 接続詞と前置詞を伴うヒフィル形不定詞で、前節から祭司の務め・目的を続けている。「教える」は現代日本語で明瞭であり、ירהの使役的な意味にも適合する。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの親族的・契約共同体的表現を保った。「イスラエル人」より原文の形を反映しつつ、共同体全体を指す表現として理解できる。
- source_word: כָּל הַחֻקִּים
  choice: すべての掟
  rationale: חֻקִּיםは定められた法規・規定を指す。「掟」は法的・契約的な語感を保ちながら、一般の読者にも分かりやすい。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: ヤハウェが……彼らに語られた
  rationale: 関係節が「すべての掟」を修飾する構造を保った。日本語では神への敬意を自然に示すため「語られた」とした。אֲלֵיהֶםは原文どおり「彼らに」と訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有の契約名として音写した。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセの手によって
  rationale: 仲介を表すヘブライ語の慣用句を本文に残し、モーセが神の言葉を取り次いだことを示した。自然な日本語の言い換えは脚注に掲げた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、称号で代替せず音写し、契約名としての性格を保った。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 文法上の男性複数を含む原文の親族的表現を保持した。ただし、この表現は契約共同体を集合的に指しており、成人男性だけに限定する意味を加えてはいない。
- issue: בְּיַד מֹשֶׁה におけるモーセの役割
  choice: モーセの手によって
  alternative: モーセを通して
  rationale: 神が語り、モーセがその言葉を仲介するという原文の関係を保った。より自然な日本語は脚注で示し、意味を一つの解釈に狭めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、祭司的・契約的文脈にふさわしい品位を保った。前節から続く目的表現を「また、……ためである」で受け、単独の節としても読みやすくした。
