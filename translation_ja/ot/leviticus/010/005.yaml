  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: ja
  text: そこで彼らは近寄り、二人を長衣ごと宿営の外へ運び出した[a]。モーセが言ったとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人を長衣を使って宿営の外へ運び出した」。ヘブライ語の前置詞は手段を表すこともあるため、長衣をつかんで、あるいは長衣を用いて遺体を運んだという意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: 彼らは近寄り
  rationale: קרבのカル・ワイイクトル。直前の命令を受け、遺体に近づく動作を自然な現代日本語で表す。
- source_word: וַיִּשָּׂאֻם
  choice: 二人を…運び出した
  rationale: נשׂאに三人称男性複数目的語接尾辞が付き、ナダブとアビフを指す。文脈上、遺体を聖所付近から宿営外へ移すことなので「運び出した」とした。
- source_word: בְּכֻתֳּנֹתָם
  choice: その長衣のまま
  rationale: כֻּתֹּנֶתは身体を覆う長い衣を指す。「下着」では現代日本語で誤解を招き、「上着」でも形状が不明確なため「長衣」とした。前置詞בは状態・手段のいずれにも取れ、本文では自然な「長衣のまま」を採り、手段の解釈を脚注に残す。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: אֶלとמִחוּץが示す外部への方向性を、簡潔で自然な日本語の「外へ」で表した。מַחֲנֶהは荒野の共同体の配置を指すため「宿営」とした。
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: モーセが言ったとおりである
  rationale: 直前のモーセの命令との一致を示す比較表現。日本語では時制を過度に補わず、文脈上明確な「言ったとおり」とした。
theological_decisions:
- issue: בְּכֻתֳּנֹתָםにおける前置詞בの解釈
  choice: 二人が長衣を着た状態のまま運ばれたと読める本文
  alternative: 長衣をつかむ、または長衣を用いて運んだ
  rationale: ヘブライ語のבは付帯状況と手段の双方を表し得るため、本文で一方を断定せず、自然な主要解釈を採用しつつ別解を脚注で明示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「二人」を補って指示対象を明確にし、衣服語は古風すぎる「祭服」や誤解を招く「下着」を避けて「長衣」とした。本文の[a]と脚注を対応させ、原文の曖昧さを保持した。
