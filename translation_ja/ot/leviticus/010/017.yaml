id: LEV.10.17
reference: Leviticus 10:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: ja
  text: 「なぜ、あなたがたは罪のためのささげ物[a]を聖なる場所で食べなかったのか。これは最も聖なるものであり、主はこれをあなたがたに与えられた。あなたがたが会衆の咎を負い、主の前で彼らのために贖いをするためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「きよめのささげ物」とも訳せる。ヘブライ語は、罪に対処する供え物だけでなく、汚れを除くための供え物を指すこともある。
    reason: חַטָּאת の祭儀的な意味範囲と有力な別訳を示すため。
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: なぜ、あなたがたは…食べなかったのか
  rationale: 理由を問う叱責として、ヘブライ語の疑問文を明確で自然な現代日本語にした。複数形の主語も保持した。
- source_word: הַחַטָּאת
  choice: 罪のきよめのささげ物
  rationale: この文脈では供え物を指す。「罪のためのささげ物」だけでなく、儀礼的な汚れを除く機能も含み得る語なので、「罪」と「きよめ」の両面を簡潔に示した。
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: 聖なる場所で
  rationale: 祭司が供え物を食べるよう指定された聖域を指す。日本語の「聖所」は幕屋内部の特定区画と誤解され得るため、より広い原語表現に合わせた。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 名詞を反復するヘブライ語の最上級表現を自然な日本語で表した。至聖所そのものとの混同も避けた。
- source_word: נָתַן לָכֶם
  choice: 主があなたがたに与えた
  rationale: 三人称男性単数の暗黙の主語は文脈上、主である。日本語では主語を明示したほうが意味が明瞭になるため補った。
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: 会衆の咎を負い
  rationale: נשא עון の「咎を負う」という代表的・祭儀的表現を保持した。「罪責」よりも平明で、「罰を受ける」と機序を限定しない。
- source_word: הָעֵדָה
  choice: 会衆
  rationale: 契約共同体として集められた民を表す語であり、レビ記の荘重な文体にも適する。
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: 彼らのために贖いをする
  rationale: 祭儀的文脈における כפר の伝統的かつ意味の広い表現を採用し、浄化・赦しなど特定の仕組みに狭めなかった。
- source_word: לִפְנֵי יְהוָה
  choice: 主の前で
  rationale: 神の臨在の前で行われる祭儀という意味を簡潔に保持した。神名は本文で自然かつ荘重な「主」とした。
theological_decisions:
- issue: חַטָּאת の祭儀用語としての訳
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／きよめのささげ物
  rationale: 供え物を指すことは確実だが、語が罪への対処と汚れの除去の双方に関わり得るため、一方だけに限定しない訳を本文に置いた。脚注で簡潔な代案を示した。
- issue: נָתַן の暗黙の主語
  choice: 「主が」と明示
  alternative: 「それはあなたがたに与えられた」と受動態で訳す
  rationale: 動詞は三人称男性単数であり、文脈上、祭司にこの供え物を与えた主体は主と理解される。日本語で明示しても文脈を越える教義的付加にはならない。
- issue: נשא עון の意味範囲
  choice: 咎を負う
  alternative: 罪責を担う／罰を負う
  rationale: 祭司の役割に関する表現の神学的緊張を残し、負う対象を「罰」に限定したり、単なる除去と説明したりしない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀本文にふさわしい荘重さを保った。「ささげ物」は平仮名として読みやすくし、「咎」「贖い」は重要な原語上の緊張を保つため維持した。
