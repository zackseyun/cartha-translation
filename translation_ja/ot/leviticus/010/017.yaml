revisions:
- from: 「なぜ、あなたがたは罪のきよめのささげ物[a]を聖なる場所で食べなかったのか。それは最も聖なるものであり、主があなたがたに与えたものである。それは、会衆の咎を負い、主の前で彼らのために贖いをするためである。」
  to: 「なぜ、あなたがたは罪のためのささげ物[a]を聖なる場所で食べなかったのか。これは最も聖なるものであり、主はこれをあなたがたに与えられた。あなたがたが会衆の咎を負い、主の前で彼らのために贖いをするためである。」
  rationale: 本文の「罪のためのささげ物」は、供え物であることを明示しつつ、英語監査記録の主要訳および日本語の慣用的な祭儀用語に対応する。脚注の「きよめのささげ物」により、語が祭儀的汚れの除去にも関わるという重要な意味範囲を保持する。「あなたがたが」を補って、主が祭司たちに供え物を与えた目的、すなわち会衆の咎を負い、そのために主の前で贖いを行うことを明確にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:34:16Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の大筋はヘブライ語に忠実である。ただし、חַטָּאת を本文で「罪のきよめのささげ物」とした上で、脚注が「『きよめのささげ物』とも訳せる」とするのは、別訳としての機能を果たしていない。本文は確立した祭儀用語「罪のためのささげ物」とし、脚注で「きよめのささげ物」を示すほうが、原語の意味範囲を保ちつつ明確である。また、与えられた目的の行為者は文脈上祭司である「あなたがた」なので、日本語では補うと構文が明瞭になる。
  naturalness: 「それは……与えたものである。それは……ためである」という反復は不自然ではないが、指示語の対象と目的の担い手がやや曖昧になる。「これは最も聖なるものであり、主はこれをあなたがたに与えられた。あなたがたが……するためである」とすると、現代標準日本語として自然で、原文の関係も明確になる。
  terminology: 「会衆」「咎」「贖い」「主」は祭儀・神学的文脈に適切である。「最も聖なるもの」「聖なる場所」も原文に忠実である。חַטָּאת については、本文を「罪のためのささげ物」とし、脚注で「きよめのささげ物」という有力な代案を示す。
  issues:
