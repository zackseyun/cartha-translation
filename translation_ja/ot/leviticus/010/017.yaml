    rationale: 本文の「罪のきよめのささげ物」はすでに「きよめ」を含むため、脚注の「『きよめのささげ物』とも訳せる」は有意味な別訳になっていない。本文と脚注の役割を分ける必要がある。
  - severity: low
    issue: 目的節の行為者が日本語ではやや曖昧
    rationale: ヘブライ語の「あなたがたに、会衆の咎を負わせるために」は、祭司たちが咎を負い、贖いを行う目的を表す。日本語で「あなたがたが」を補えば、原文が示す関係を明瞭にできる。
