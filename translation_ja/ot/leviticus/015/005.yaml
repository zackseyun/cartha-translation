source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: ja
  text: また、ある男性が、その人の寝床[a]に触れたなら、衣服を洗い、水を浴び、夕方まで汚れている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寝床」と訳した語は、寝台に限らず、その人が横たわった場所を広く指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れ」は、清浄規定における祭儀上の状態を指し、道徳的な罪を意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: また、…者は
  rationale: אִישׁは男性単数形だが、この規定では寝床に触れる者を一般的に指す。日本語では「者」が自然で、適用範囲を不必要に男性だけへ限定しない。接続詞וְは文脈を継ぐ「また」とした。
- source_word: יִגַּע
  choice: 触れた
  rationale: נגעの基本義である接触を簡潔に表す。後続する法的帰結との関係を自然な日本語の条件表現にした。
- source_word: בְּמִשְׁכָּבוֹ
  choice: その人の寝床
  rationale: 接尾辞וֹの指示対象は前節までの漏出のある男性であり、日本語では曖昧な「彼の」を避けて「その人の」とした。מִשְׁכָּבは寝台だけでなく横たわった場所も指し得るため、本文は自然な「寝床」とし、語義の幅を注記した。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: כבסはここでは衣類を洗うことを表す。「衣服」は現代日本語で明瞭かつ品位があり、所有者は主語から明らかなため「自分の」を補わない。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水で身を洗わなければならない
  rationale: רחץはこの文脈で身体を洗うことを指すため「身を洗う」と明示した。בַּמַּיִםのבは手段を表す自然な日本語として「水で」とした。法規の義務性は「なければならない」で表した。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: そして夕方まで汚れている
  rationale: טָמֵאは道徳的罪ではなく祭儀上の状態を表すが、本文では原語のカテゴリーを保つ「汚れている」とし、その意味を注記した。עַד הָעָרֶבは期間の終点を「夕方まで」と自然に訳した。
theological_decisions:
- issue: レビ記の清浄規定におけるטָמֵאの性質
  choice: 本文では「汚れている」と訳し、注で祭儀上の状態であることを示す。
  alternative: 本文で「儀礼上汚れている」または「祭儀上汚れている」と明示する。
  rationale: 原文は単にטָמֵאと述べており、道徳的罪責を意味しない。本文に説明語を織り込まず原文の表現を保ちつつ、現代の読者が倫理的な汚れと誤解しないよう注記する。
translation_notes:
  register: 明瞭な現代標準日本語による法規文。義務は「なければならない」で表し、「寝床」「衣服」「身を洗う」など日常的でありながら品位のある語を用いた。注記記号は該当語句の直後に配置した。
