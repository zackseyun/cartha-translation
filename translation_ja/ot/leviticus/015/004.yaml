  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: ja
  text: 漏出のある男性が横になる寝床はすべて汚れ、彼が座る物[a]はすべて汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「物」に当たるヘブライ語は、用具、器具、物品などを広く指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: 寝床
  rationale: 横になる場所を指す語であり、ここでは自然で簡潔な「寝床」が文脈に適する。
- source_word: הַזָּב
  choice: 漏出のある男性
  rationale: 男性単数の分詞で、直前の文脈では身体から漏出のある男性を指す。性別を曖昧にせず、現代日本語で明確に表した。
- source_word: יִשְׁכַּב עָלָיו
  choice: 横になる
  rationale: 前置詞を含めると「その上に横になる」の意だが、日本語では先行する「寝床」との関係から「横になる」で自然かつ十分明確である。
- source_word: יִטְמָא
  choice: 汚れたものとなる
  rationale: レビ記の規定における儀礼上の汚れという状態を表す。「汚れる」より法的な状態変化・認定が明確で、道徳的罪を意味するとの誤解も抑えられる。
- source_word: הַכְּלִי
  choice: 物
  rationale: 器、道具、物品などを広く指し得る語で、ここでは人が座ることのできる物が念頭にある。「器」では日本語で容器に狭く理解されやすいため、本文では広い「物」とした。
- source_word: יֵשֵׁב עָלָיו
  choice: 彼が座る
  rationale: 「その上に座る」の意。日本語では先行詞「物」があるため「彼が座る物」とするのが自然である。
theological_decisions:
- issue: 汚れの性質
  choice: 「汚れたものとなる」とし、レビ記の清浄規定上の状態を表す
  alternative: 「儀礼的に汚れる」「穢される」
  rationale: 原文には「儀礼的に」に当たる修飾語がないため本文には補わない。「穢される」は道徳的腐敗や外からの意図的な汚染を強く連想させ得る。
- issue: 主体の性別
  choice: 男性であることを明示する
  alternative: 「漏出のある者」として性別を明示しない
  rationale: 原文は男性単数形を用い、周辺文脈も男性の身体的漏出を扱うため、その情報を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、律法文らしい簡潔さと格調を保った。「漏出」は身体からの流出を婉曲かつ正確に表す文脈語として用いた。
