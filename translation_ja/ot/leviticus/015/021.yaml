id: LEV.15.21
reference: Leviticus 15:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ja
  text: 彼女の寝床[a]に触れる者は皆、衣服を洗い、水で身を洗わなければならない。その人は夕方まで汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼女が横になる場所」「彼女の寝具」。ヘブライ語は、彼女が横になる所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: 触れる者は皆
  rationale: 接続詞を伴う כָּל と実名詞的分詞の組み合わせを、一般的・普遍的な規定として自然な日本語で表した。
- source_word: בְּמִשְׁכָּבָהּ
  choice: 彼女の寝床
  rationale: מִשְׁכָּב は横になる場所や寝具を指し得るが、本文では具体的で簡潔な「寝床」とした。語義の幅は脚注に残した。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: כבס は衣類を洗うことを指すため、「衣服を洗う」と明示した。ヘブライ語の男性単数接尾辞は、日本語では主語から明らかなため所有表現を省いた。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水で身を洗わなければならない
  rationale: רחץ がここでは身体を水で洗うことを指すため「身を洗う」とした。法規上の義務を自然な現代日本語の「なければならない」で示した。
- source_word: וְטָמֵא
  choice: その人は…汚れている
  rationale: טמא は祭儀上の汚れを表す。文脈上の状態を示し、道徳的罪を意味する語を加えなかった。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 祭儀上の汚れが続く期限を、簡潔で自然な日本語で示した。
theological_decisions:
- issue: 汚れの性質
  choice: טמא を「汚れている」と訳し、祭儀上の状態として文脈に委ねる。
  alternative: 「不浄である」「身を汚した者となる」
  rationale: 本節はレビ記15章の清浄規定であり、道徳的な罪責を明示していない。「汚れている」は本文の基本概念を保ちつつ、余分な教理的説明を本文へ持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法規としての端正さを保った。「寝床」は日常語として理解しやすく、原語の語義の幅は脚注で示した。
