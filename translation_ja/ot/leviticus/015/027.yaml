source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ja
  text: それらに触れる者は皆、汚れる[a]。その者は衣服を洗い、水で身を洗わなければならない。その者は夕方まで汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「汚れる」とは、祭儀上、清くない状態になることをいう。「それら」は、前の文脈にある、彼女が寝た物や座った物などを指す。
    reason: 原文の祭儀的な清浄概念と、複数代名詞の前文脈上の指示対象を明確にするため。
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: それらに触れる者は皆
  rationale: כָּלと名詞的に用いられた分詞の組み合わせを、包括的な意味を保つ自然な日本語で表した。
- source_word: בָּ/ם
  choice: それらに
  rationale: 三人称男性複数接尾辞の指示対象を本文で限定せず、前文脈を受ける代名詞として訳した。具体的な指示対象は脚注で補った。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: レビ記の文脈における祭儀上の汚れを指す。道徳的罪悪を意味する「けがす」などは避け、状態の変化が伝わる表現とした。
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: その者は衣服を洗い
  rationale: כבסは衣服を洗濯することを表すため、現代日本語で明瞭な「衣服を洗う」とした。三人称単数は性別を過度に前面化しない「その者」で受けた。
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: 水を浴びなければならない
  rationale: רחץはこの祭儀的文脈では身体を水で洗うことを表す。「水を浴びる」により衣服の洗濯との違いを明確にし、連続する指示の義務性を自然な日本語で示した。
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: その者は夕方まで汚れている
  rationale: 祭儀上の汚れた状態が夕方まで続くことを、継続状態として明瞭に表した。
theological_decisions:
- issue: レビ記におけるטמאの性質
  choice: 祭儀上の状態を示す「汚れる／汚れている」
  alternative: 「けがれる」「不浄になる」
  rationale: 文脈は清浄規定であり、接触そのものを道徳的罪とする含みを避ける必要がある。「汚れる」は平易だが、脚注により祭儀的意味であることを明示した。
- issue: בָּםの指示対象
  choice: 本文では「それら」として曖昧さを保持する
  alternative: 本文で「彼女が寝た物や座った物」と具体化する
  rationale: 原文は代名詞のみであり、指示対象は前文脈から理解される。本文への具体化は解釈を加えるため、脚注に回した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、律法本文にふさわしい端正さを保った。「衣服」「その者」により、口語的すぎず古語的でもない文体とした。
