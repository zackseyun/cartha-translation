  text: וְ/כָל בֶּ֣גֶד וְ/כָל ע֔וֹר אֲשֶׁר יִהְיֶ֥ה עָלָ֖י/ו שִׁכְבַת זָ֑רַע וְ/כֻבַּ֥ס בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: ja
  text: 精液の付いた衣服や革製品はすべて、水で洗わなければならない。それらは夕方まで汚れたものとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れたもの」は、祭儀上不浄な状態にあることをいう。道徳的な罪責を意味するものではない。
    reason: טָמֵאの祭儀的意味を、日常的・物理的な汚れと区別して明確にするため。
lexical_decisions:
- source_word: בֶּגֶד
  choice: 衣服
  rationale: 衣類を表す広い語。現代日本語で自然かつ具体的であり、文脈にも合う。
- source_word: עוֹר
  choice: 皮革製品
  rationale: 直訳は「皮」だが、この文脈では獣皮から作られた物を指す可能性が高い。「皮革製品」は対象物であることを自然に示す。
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: 付いた
  rationale: 「その上にある」を、液体が衣服や皮革製品に付着しているという文脈に即して簡潔に表す。
- source_word: שִׁכְבַת זָרַע
  choice: 精液
  rationale: 字義的には精液の放出を含意する表現だが、ここでは物に付着した精液を指すため、日本語では「精液」が明瞭で自然。放出という出来事を明示する訳も可能である。
- source_word: וְכֻבַּס בַּמַּיִם
  choice: 水で洗わなければならず
  rationale: 受動形による法的指示を、現代日本語で明確な義務として自然に表す。בַּמַּיִם は手段を示す「水で」とした。
- source_word: וְטָמֵא
  choice: 汚れている
  rationale: レビ記の祭儀的な状態を示す語として「汚れ」を用い、道徳的罪悪と同一視しない。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 定冠詞を含む表現だが、日本語では「夕方まで」が最も自然で、時間的限界を正確に示す。
theological_decisions:
- issue: レビ記の清浄規定における טָמֵא の性質
  choice: 祭儀上の状態を示す「汚れている」と訳す。
  alternative: 「不浄である」「汚れた者となる」
  rationale: この箇所は道徳的な罪責ではなく祭儀上の汚れを扱う。「汚れている」は定訳的な語彙を保ちつつ、本文が述べない道徳的非難を加えない。
- issue: 汚れの文法的主体
  choice: 並列された「衣服や皮革製品」が夕方まで汚れていると読む。
  alternative: それを扱った人が夕方まで汚れるという補足的解釈
  rationale: ヘブライ語では洗われる物がそのまま単数形の וְטָמֵא の主体となるのが自然であり、本文に人を補わない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法規文としての簡潔さと品位を保った。「皮」だけでは身体の皮膚とも取れるため「皮革製品」とした。
