source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ja
  text: 漏出のある男性が、水で手をすすいでいないまま[a]、だれかに触れた場合、その人は衣服を洗い、水で身を洗い、夕方まで汚れた状態となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その男性が水で手をすすいでいなかった場合」とも訳せる。ヘブライ語のこの句は、接触によって汚れが移る条件を示すものと読める。
    reason: 「手をすすいでいない」という句が接触による汚れの伝達の条件を示すという統語的理解を注記し、原文にある表現上の余地を保つため。
lexical_decisions:
- source_word: הַזָּב
  choice: 漏出のある人
  rationale: זוּב に由来し、文脈上は身体からの異常な漏出がある男性を指す。日本語では性別を不自然に強調せず、周辺文脈に即して簡潔に表した。
- source_word: יִגַּע בּוֹ
  choice: だれかに触れたなら
  rationale: נגע ב は身体的接触を表す。日本語の法文として条件関係が明瞭になる形にした。
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: まだ水で手をすすいでいないまま
  rationale: この句を、漏出のある人が接触前に手をすすいでいないという付帯状況として訳した。שטף は後続の רחץ と区別して「すすぐ」とした。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: כבס は衣服の洗濯を表すため、自然な現代日本語で「衣服を洗う」とした。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水で身を洗わなければならない
  rationale: רחץ はここでは身体を水で洗うことを指す。「身を洗う」により衣服の洗濯と区別した。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: そして夕方まで汚れている
  rationale: טמא は道徳的罪悪ではなく祭儀上の汚れを表す。「汚れている」はその法的状態を簡潔に示す。
- source_word: כֹל אֲשֶׁר
  choice: だれか／その触れられた人
  rationale: 人を指す分配的表現。日本語では主語の交替を明確にするため、条件節では「だれか」、主節では「その触れられた人」とした。
theological_decisions:
- issue: レビ記の清浄規定における טמא の性質
  choice: 祭儀上の状態として「汚れている」と訳す
  alternative: 「けがれている」「不浄となる」
  rationale: この節は接触に伴う清浄規定であり、道徳的な罪を述べてはいない。平易さを優先しつつ、状態表現によって法的・祭儀的意味を保った。
- issue: וְיָדָיו לֹא שָׁטַף の統語的係り先
  choice: 漏出のある人が接触前に手をすすいでいないという条件として本文に反映
  alternative: ヘブライ語の並列をより直訳的に「そして彼の手は水ですすがれていない」とする
  rationale: 主語となる所有接尾辞は漏出のある人を指すのが自然で、接触によって汚れが移る条件を述べると理解した。ただしヘブライ語の句の結び付きには表現上の余地があるため注記した。
translation_notes:
  register: 明瞭で現代的な標準日本語の法規文体。「漏出」は身体的症状を指し、過度に医学的または婉曲的な表現は避けた。「汚れている」は祭儀上の状態であり、道徳的非難を意味しない。
