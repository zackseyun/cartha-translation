revisions:
- from: その漏出による汚れは、次のとおりである。すなわち、彼の体から漏出物が流れ出ている場合も、彼の体が漏出物でふさがっている場合も、それは彼の汚れである。[a]
  to: その漏出に関する彼の汚れは、こうである。すなわち、彼の体[a]がその漏出を流している場合でも、彼の体がその漏出のためにふさがっている場合でも、これが彼の汚れである。
  rationale: 後半の閉塞句について、漏出物そのものが閉塞の原因であるとの断定を避け、原文と英語監査記録が保持する解釈上の幅を保った。「体」の脚注は該当語に直接アンカーした。
