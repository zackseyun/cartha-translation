id: LEV.15.3
reference: Leviticus 15:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: ja
  text: その漏出に関する彼の汚れは、こうである。すなわち、彼の体[a]がその漏出を流している場合でも、彼の体がその漏出のためにふさがっている場合でも、これが彼の汚れである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「体」は直訳では「肉」。後半は直訳に近く、「彼の体がその漏出から閉ざされている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: 彼の汚れ
  rationale: レビ記の清浄規定における儀礼上の不浄を表す。「汚れ」は現代日本語で理解しやすく、単なる衛生状態ではなく規定上の状態を指す文脈に適する。
- source_word: זוֹב
  choice: 漏出／漏出物
  rationale: 異常な身体的分泌を指す。同じ語を、現象を指す箇所では「漏出」、流れ出るものを指す構文では自然な日本語として「漏出物」とした。
- source_word: רָר בְּשָׂרוֹ אֶת־זוֹבוֹ
  choice: 彼の体から漏出物が流れ出ている
  rationale: 動詞は流出している状態を示す。בשרは直訳では「肉」だが、ここでは身体ないし患部を指すため「体」とした。
- source_word: הֶחְתִּים בְּשָׂרוֹ מִזּוֹבוֹ
  choice: 彼の体が漏出物でふさがっている
  rationale: 語形は閉塞・阻止された状態を示す。前半の流出との対照を保ちつつ、מןの解釈には幅があるため、本文では身体が漏出物によって閉塞した状態として自然に表現した。
- source_word: וְזֹאת תִּהְיֶה
  choice: 次のとおりである
  rationale: 法規の導入句として、逐語的な未来形よりも現代日本語の規定文に自然な定型表現を用いた。
- source_word: אוֹ
  choice: 場合も……場合も
  rationale: 二つの選択的条件のいずれにも同じ判定が当てはまる法的構造を明確にした。
theological_decisions:
- issue: טֻמְאָהの性質
  choice: 「汚れ」として儀礼上の状態を表す
  alternative: 罪／道徳的な汚れ
  rationale: この節は身体的漏出に伴う清浄規定を述べており、本人の道徳的罪責を明示してはいないため、罪という解釈を持ち込まない。
- issue: 閉塞句 מִזּוֹבוֹ の関係
  choice: 漏出物によって体がふさがる状態
  alternative: 漏出が止まって体内にとどまる状態／漏出から体が閉ざされる状態
  rationale: ヘブライ語の圧縮された表現には解釈上の幅がある。本文は主要な意味を明瞭に示し、別の取り方を脚注に残した。
translation_notes:
  register: 現代標準日本語による簡潔で厳かな法規文。医学的に過度に専門化せず、婉曲にもなりすぎない表現とした。脚注記号[a]は本文末に配置した。
