source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: ja
  text: また、漏出のある者が清い人につばを吐きかけたなら[a]、その人は衣服を洗い、水で身を洗わなければならない。その人は夕方まで汚れた状態となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「清い者に」。ここでの「清い」は、儀礼上清い状態にあることを指す。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れた状態」とは、道徳的にけがれているという意味ではなく、儀礼上汚れた状態にあることをいう。
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: また、…なら
  rationale: 法規の連続を示す接続辞と条件を、現代日本語として自然な形で表した。
- source_word: יָרֹק הַזָּב
  choice: 漏出のある者が…つばを吐きかけた
  rationale: יָרֹק は「つばを吐く」、הַזָּב は継続的な身体の漏出がある者を指す。前置詞 בְּ が人を対象としているため、「吐きかける」とした。
- source_word: בַּטָּהוֹר
  choice: 清い人に
  rationale: 形容詞 טָהוֹר の名詞的用法を「清い人」とし、レビ記の文脈における儀礼上の清さを保持した。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: その人は衣服を洗い
  rationale: 接尾代名詞の指示対象が、つばをかけられた清い人であることを日本語で明確にした。כִּבֶּס は衣服を洗うことを表す。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水を浴びなければならない
  rationale: 身体を水で洗う儀礼的行為を自然な日本語で表し、法規としての義務を示した。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: そして夕方まで汚れている
  rationale: 定型的な儀礼的不浄の期間を表す。「汚れている」は道徳的罪ではなく、文脈上の儀礼的状態を指す。
theological_decisions:
- issue: 清浄・不浄の用語
  choice: טָהוֹר を「清い」、טָמֵא を「汚れている」と訳し、脚注で儀礼上の意味を明示した。
  alternative: 「清浄である／不浄である」
  rationale: 本文を一般読者に理解しやすく保ちながら、道徳的な善悪との混同を脚注によって避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語。法規としての端正さを保ちつつ、過度に古風な「衣を洗い、身をすすぐ」などは避けた。「漏出」は周辺文脈との用語的一貫性を意識した。
