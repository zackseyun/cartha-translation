  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: ja
  text: また、漏出のある男性が乗った鞍はすべて、汚れる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その人が乗ったものはすべて」とも訳せる。ヘブライ語は、狭い意味での鞍だけでなく、その人が乗るために用いたものを広く指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: また、…すべて
  rationale: 接続詞וְで前の規定との連続を示し、כָּלの包括的な範囲を自然な日本語で表した。
- source_word: הַ/מֶּרְכָּב
  choice: 乗り物
  rationale: מֶרְכָּבは「乗るもの」を広く指し得る。この文脈では鞍や乗用具が想定され得るが、「鞍」に限定せず原語の意味の幅を保った。
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: …が乗った
  rationale: 未完了形はこの法規の一般的な場合を表す。日本語では関係節を前置し、自然で簡潔な形にした。
- source_word: הַ/זָּב
  choice: 漏出のある人
  rationale: 男性形の実詞的分詞で、文脈上は身体からの漏出がある男性を指す。「人」は自然な日本語としつつ、章の文脈によって男性であることが明らかになる。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 祭儀上の汚れた状態になることを表す。道徳的罪悪を意味しない用語として、レビ記の法規に適した簡潔な表現を採用した。
theological_decisions:
- issue: レビ記における汚れの性質
  choice: יִטְמָאを祭儀的・法的な意味で「汚れる」と訳す。
  alternative: 「不浄になる」「けがれる」
  rationale: ここで扱われるのは身体の漏出に伴う祭儀上の状態であり、道徳的罪や人格的腐敗を本文に持ち込まないため。
translation_notes:
  register: 現代標準日本語による簡潔で格調ある法規文。「漏出」は章全体の身体的症状を明確に示し、「汚れる」は祭儀上の状態を表す。脚注標識[a]を本文に付した。
