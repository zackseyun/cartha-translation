id: LEV.15.10
reference: Leviticus 15:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: ja
  text: また、彼の下にあった物に触れる者は皆、夕方まで汚れる[a]。それらを運ぶ者は、衣服を洗い、水で身を洗わなければならない[b]。その者は夕方まで汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「彼の下にある物」とも訳せる。ここでは、漏出のある者の下に以前あった物を指す文脈に合わせて過去形とした。
    reason: lexical_alternative
  - marker: b
    text: 「それら」は、彼の下にあった物を集合的に指す。
    reason: referent_clarification
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: 触れる者
  rationale: נגע の分詞が表す一般的な身体的接触を、祭儀的清浄規定に即して簡潔に表す。
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: 彼の下にあった物
  rationale: 直訳的には「彼の下にある物」も可能だが、文脈上は漏出のある者の下に置かれていた物を指すため、日本語では過去形が自然である。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: טמא の祭儀的な不浄を表す定訳として「汚れる」を用い、道徳的な罪とは区別される文脈を保つ。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: ヘブライ語の時間的限界を、現代日本語で自然かつ明確に表す。
- source_word: הַנּוֹשֵׂא אוֹתָם
  choice: それらを運ぶ者
  rationale: נשא はここでは物を持ち運ぶ意。「それら」は、直前に集合的に言及された、彼の下にあった物を受ける。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: בגדים を現代標準語の「衣服」とし、清めのための洗濯を明確にする。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水を浴びなければならない
  rationale: רחץ はこの定型句では身体を水で洗うことを指す。「水を浴びる」により衣服を洗う行為との違いを明確にし、法規の義務性を自然に示す。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: その者は夕方まで汚れる
  rationale: 主語を補って日本語で明瞭にしつつ、洗浄後も夕方まで不浄が続くという原文の順序と意味を保つ。
theological_decisions: []
