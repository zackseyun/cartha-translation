source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: ja
  text: 女性に体からの流出があり、その流出が血である場合[a]、彼女は七日間、月経に伴う祭儀上の汚れの状態にある[b]。彼女に触れる者は皆、夕方まで汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、より直訳的には「その肉に（または、その体に）ある流出が血である場合」。本文の「体から」は、身体的な流出を自然な日本語で表したもの。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れ」は、レビ記の律法における祭儀上の状態を指し、道徳的な罪を意味するものではない。
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: 漏出があり／出るもの
  rationale: זוּב は身体から流れ出ることを表す。日本語では最初に「漏出」とし、続く箇所では重複を避けて「出るもの」とすることで、血であるとの説明を自然に示した。
- source_word: דָּם
  choice: 血
  rationale: 文脈上も語義上も直接的な訳。
- source_word: בִּבְשָׂרָהּ
  choice: その体から
  rationale: 字義的には「彼女の肉に／体に」だが、ここでは身体的な漏出の場所・起点を指すため、自然な日本語として「その体から」とした。ヘブライ語の直訳的な形は脚注に残した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す直接的で自然な訳。
- source_word: בְנִדָּתָהּ
  choice: 月経による汚れの状態にある
  rationale: レビ記の נִדָּה は月経そのものだけでなく、それに伴う祭儀上の汚れの期間・状態を指す。現代日本語で意味が伝わるように訳した。
- source_word: כָל־הַנֹּגֵעַ בָּהּ
  choice: 彼女に触れる者は皆
  rationale: 不特定の全員を指す分詞構文を、簡潔な法規文の日本語で表した。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 祭儀上の不浄な状態になることを表す。文脈上、道徳的罪悪を意味しない。
- source_word: עַד־הָעָרֶב
  choice: 夕方まで
  rationale: 日本語として自然であり、期限を明確に示す。
theological_decisions:
- issue: 月経に伴う汚れを道徳的な罪と混同させないこと
  choice: 「月経による汚れの状態」と訳し、脚注で祭儀上の状態であることを明示する
  alternative: 「月経の不浄」「月経期間」
  rationale: 本文はレビ記の清浄規定における状態を扱っており、女性の道徳的な過ちを述べてはいない。「不浄」は硬く誤解されやすく、「月経期間」だけでは祭儀上の意味が失われる。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調を保った法規文とした。「女」「汚れる」は原文の簡潔さとレビ記の用語上の一貫性を保つために用い、祭儀上の意味は脚注で明確にした。
