  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンに次のように告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では神名「YHWH」。伝統的に「主」と訳されている。
    reason: 原文の四文字神名を明示し、伝統的な代替表記を説明するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進める連続形であり、後続節に発言内容が続く定型表現。日本語では「告げられた」として、神の発話を自然かつ格調ある形で示す。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される伝統的な代替表記を本文に用い、原文が神名YHWHであることを脚注で明示する。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: 原文では前置詞が両名の前で反復されるが、日本語では一つの「に」で二人を並列するのが自然で、両者が発話の受け手である意味も保たれる。
- source_word: לֵאמֹר
  choice: （後続する直接話法に含意）
  rationale: 直訳は「言って」であるが、日本語では「告げられた」の後にそのまま引用内容を続けることで機能が十分に表されるため、重複的な表現を避けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注でYHWHを明示）
  alternative: ヤハウェ
  rationale: 原文が称号ではなく四文字神名YHWHである事実を脚注で保持しつつ、本文は現代日本語で広く定着した「主」とする。特定の神名発音を本文で断定しない。
translation_notes:
  register: 明快な現代標準日本語。神の発話にふさわしい簡潔で格調ある文体とし、次節から始まる発言への導入として自然に読める形にした。
