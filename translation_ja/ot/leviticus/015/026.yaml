source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: ja
  text: その身体の漏出が続く間、彼女が横になる寝床はすべて、彼女の月経時の寝床と同じ扱いとなる[a]。また、彼女が座る物はすべて汚れたものとなり、月経による汚れと同じである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「月経時の寝床」は、月経時に彼女が用いる寝床を指す。ヘブライ語「ニッダー」は月経を指すとともに、それに伴う儀礼上の隔離や汚れの状態をも表し得る。
    reason: lexical_alternative
  - marker: b
    text: ここで「物」と訳したヘブライ語は、容器に限らず、道具や品物などを広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: 寝床
  rationale: 横になる場所を指す語であり、現代日本語では「寝床」が自然で、儀礼規定の文脈にも適する。
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: その漏出が続く間
  rationale: זוֹבはこの文脈で身体からの異常な漏出を指す。「漏出」は医学的かつ中立的で、「続く間」により期間全体を自然に表す。
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: 月経中の寝床と同じように
  rationale: נִדָּהはここでは月経に伴う儀礼的状態を指す。本文では具体的な指示対象を明瞭にしつつ、比較構文を保った。
- source_word: יִהְיֶה לָּהּ
  choice: 彼女のために汚れたものとなる
  rationale: לָּהּが示す彼女との関係における状態・分類を「彼女のために」で残し、後続の汚れの状態を日本語として補った。
- source_word: כְּלִי
  choice: 物
  rationale: כְּלִיは容器だけでなく道具・品物を広く指し得る。ここでは座る対象なので、意味を不当に容器へ限定しない「物」とした。
- source_word: טָמֵא / טֻמְאָה
  choice: 汚れたもの／汚れ
  rationale: レビ記の儀礼的な清浄規定を表す定訳的な語を用い、道徳的罪悪を意味する表現は避けた。
theological_decisions:
- issue: טָמֵא／טֻמְאָהが表す汚れの性質
  choice: 儀礼上の状態を示す「汚れたもの／汚れ」
  alternative: 「不浄なもの／不浄」
  rationale: 本文は道徳的な罪ではなく、イスラエルの清浄規定における状態を扱う。「汚れ」は周辺文脈との語彙的一貫性を保ち、一般読者にも理解しやすい。
- issue: נִדָּהの訳し方
  choice: 本文では「月経」と具体的に訳す
  alternative: 「月経による汚れ」または「隔離の期間」
  rationale: この箇所の直接の指示対象は月経時の状態である。ただし語にはそれに伴う儀礼的隔離・汚れの含意があるため、脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法本文にふさわしい落ち着いた文体と反復構造を保った。「漏出」「月経」は婉曲化せず医学的・中立的に表現し、「汚れ」は儀礼上の状態として読めるよう脚注と文脈で支えた。
