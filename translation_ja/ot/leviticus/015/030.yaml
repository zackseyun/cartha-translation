source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: ja
  text: 祭司は、一羽を罪のためのいけにえ[a]として、もう一羽を全焼のいけにえとして献げる。そして祭司は、彼女の汚れた漏出のゆえに、ヤハウェの前で彼女のために贖いを行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪のためのいけにえ」は、「清めのいけにえ」とも訳せる。ヘブライ語 חַטָּאת は、ここではレビ記の祭儀における清めの働きを伴う供え物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 献げる
  rationale: 基本義は「行う、作る」だが、二つの祭儀的供え物を目的語とするため、日本語では「献げる」が自然である。
- source_word: הָאֶחָד חַטָּאת
  choice: 一羽を罪のためのいけにえ
  rationale: 文脈上、前節の二羽の鳥を受ける。「罪のためのいけにえ」は祭儀上の供え物を示しつつ、חַטָּאתの伝統的理解を保つ。「清めのいけにえ」も可能なので脚注に示す。
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: もう一羽を全焼のいけにえ
  rationale: 反復される「一つ」を日本語の対照表現「一羽／もう一羽」とし、עֹלָהは供え物全体を焼く祭儀として「全焼のいけにえ」とした。
- source_word: וְכִפֶּר עָלֶיהָ
  choice: 彼女のために贖いを行う
  rationale: 祭司文書におけるכפרの祭儀的・神学的含意を保ち、עָלֶיהָを自然に「彼女のために」と表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神名יהוהを固有名「ヤハウェ」とし、לִפְנֵיの礼拝・祭儀的な場面を「前で」で保持した。
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: その女の汚れた漏出のために
  rationale: זוֹבを身体からの継続的な流出として「漏出」、טֻמְאָהを祭儀上の「汚れ」として形容的に表し、מןの原因・契機の関係を「ために」で示した。
theological_decisions:
- issue: חַטָּאתの祭儀的名称
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: 語は「罪」と関連する供え物を指す一方、レビ記では清めの機能が前面に出る場合がある。本文では広く定着した意味を分かりやすく示し、別訳を脚注で保存した。
- issue: יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として明示した。
- issue: כפרの対象と機能
  choice: 彼女のために贖いを行う
  alternative: 彼女を清めるための儀式を行う
  rationale: 原文の祭儀的・神学的な幅を狭めないよう「贖い」を保ち、清めだけに限定しなかった。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調ある祭儀文体とした。前節から続く二羽の鳥を日本語で明示するため「一羽／もう一羽」とし、「汚れ」は道徳的非難ではなくレビ記上の祭儀的状態を表す。
