id: LEV.15.25
reference: Leviticus 15:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: ja
  text: 女性が、月経による汚れの時期ではないのに何日にもわたって出血する場合[a]、あるいは月経による汚れの期間を越えて出血する場合[b]、その汚れに伴う出血が続く間、月経による汚れの時と同じように、彼女は儀礼上汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「月経の時期以外に」とも訳せる。ヘブライ語の語は、月経そのものだけでなく、それに伴う儀礼上の汚れの状態も含む。
    reason: lexical_alternative
  - marker: b
    text: 別訳「月経による汚れに加えて出血する場合」。すなわち、通常の月経期間を越えて出血が続くことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: 出血が続く
  rationale: 動詞と名詞を重ねた表現は身体からの異常な流出を指す。ここでは対象が血であるため、「出血が続く」とすることで、継続する血の流出を自然で明確な現代日本語で表した。
- source_word: דָּמָהּ
  choice: 出血
  rationale: 直訳的には「彼女の血」だが、זוּבとの組み合わせを日本語として自然に「出血」と表した。
- source_word: יָמִים רַבִּים
  choice: 何日にもわたって
  rationale: 長期間に及ぶ継続を表す時間表現として、自然な日本語にした。
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: 月経による汚れの期間ではない時に
  rationale: עֵתの時間的意味と、נִדָּהが月経そのものだけでなく、それに伴う儀礼上の汚れの状態を含むことの両方を保った。
- source_word: נִדָּה
  choice: 月経による汚れ
  rationale: レビ記の法規における儀礼的な状態を明示しつつ、現代の一般読者にも理解できる表現とした。
- source_word: עַל נִדָּתָהּ
  choice: 月経による汚れの期間を越えて
  rationale: 前置詞עַלはこの文脈で、通常の月経期間に加えて、またはそれを越えて流出が続くことを示す。「越えて」はその時間的延長を簡潔に表す。
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: その汚れた出血が続く間はずっと
  rationale: 出血の継続期間全体と、その儀礼的に汚れた性質を、読みやすい日本語で表した。
- source_word: טְמֵאָה
  choice: 汚れている
  rationale: 道徳的な罪ではなく、レビ記における儀礼上の汚れを指す表現として用いた。
- source_word: כִּימֵי נִדָּתָהּ
  choice: 月経による汚れの期間と同じように
  rationale: 異常な出血中の状態が、通常の月経に伴う汚れの期間と同じであるという比較を明確にした。
theological_decisions:
- issue: 儀礼上の汚れを道徳的罪悪と混同させない表現
  choice: 「月経による汚れ」「汚れている」と訳し、レビ記の儀礼的身分を示す
  alternative: 「不浄」「穢れている」、または単に「月経」「生理」と訳す
  rationale: 本文は個人的な罪を断定するものではなく、律法上の清浄・汚れの区分を扱う。「汚れ」を用いることで儀礼的カテゴリーを保ち、「月経による」と限定することで意味を明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。身体現象を過度に婉曲化せず「出血」と明示しつつ、נִדָּהとטָמֵאは医学的状態や道徳的非難ではなく、レビ記の儀礼的な汚れを表すよう訳した。
