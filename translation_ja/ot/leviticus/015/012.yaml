  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: ja
  text: また、漏出のある者が触れた土器[a][b]は砕かなければならない。木製の器はすべて水ですすがなければならない。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「粘土製の器」または「陶器」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「漏出のある者」は、身体からの漏出がある人を指す、清めに関する規定上の用語。
    reason: cultural_note
  - marker: c
    text: 「水で洗わなければならない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: 土器
  rationale: 粘土を焼いて作った器を指し、木製の器との材質上の対比を簡潔かつ自然に保つ。
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: が触れた
  rationale: נגע の基本義「触れる」を直接表し、関係節を自然な日本語の連体修飾にした。
- source_word: הַזָּב
  choice: 漏出のある者
  rationale: 身体からの異常な流出がある人を指す清浄規定上の用語として、状態に焦点を置いた原文の表現を保った。
- source_word: יִשָּׁבֵר
  choice: 砕かなければならない
  rationale: 受動形による法的指示を、現代日本語で明確な義務として表した。
- source_word: כָל כְּלִי עֵץ
  choice: 木製の器はすべて
  rationale: 材質を明示しつつ、土器との並行関係と כָל の包括性を保った。
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: 水で洗い流さなければならない
  rationale: שטף が示す、水を用いてすすぐ・洗い流す動作を自然に表し、法的指示の力も保った。
theological_decisions:
- issue: הַזָּב の性別と清浄規定上の意味
  choice: 漏出のある者
  alternative: 漏出のある男
  rationale: 周辺文脈は男性の漏出を扱うが、この語自体は状態を表す名詞化分詞であるため、節の表現を必要以上に性別限定せず、清浄規定上の状態を前面に出した。
translation_notes:
  register: 明瞭で現代的な標準日本語。律法の義務性は「なければならない」で示し、専門的な清浄規定の語には脚注を付した。
