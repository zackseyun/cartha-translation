source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: ja
  text: また、何かが寝床の上、あるいは彼女が座っている物[a]の上にあるとき、それに触れる者は夕方まで汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「物」に当たるヘブライ語は、器、用具、品物などを広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: また、…場合
  rationale: 前の規定とのつながりを「また」で示し、条件を自然な日本語の「場合」で表した。
- source_word: עַל הַמִּשְׁכָּב
  choice: 寝床の上
  rationale: מִשְׁכָּב は横になる場所や寝床を指す。祭儀的清浄規定の文脈で明瞭な「寝床」とした。
- source_word: הוּא
  choice: それが…ある
  rationale: 男性単数代名詞だが、ここでは男性を指すとは限らず、文脈上の物を受ける。指示対象を過度に特定せず「それ」とした。
- source_word: עַל הַכְּלִי
  choice: 物の上
  rationale: כְּלִי は器、用具、品物などを広く指し得るため、文脈に適した包括的な「物」を採用した。語義の幅は脚注に残した。
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: 彼女が座る
  rationale: 分詞の継続的・特徴的な意味を、法規文として自然な現在形で表した。
- source_word: בְּנָגְעוֹ בוֹ
  choice: その物に触れた者は
  rationale: 前置詞 בְּ を伴う不定詞構文の時を表す意味を、日本語では条件的な連用修飾として表現した。三人称男性単数を一般的な行為者として「者」とした。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: ここでは祭儀上の汚れた状態になることを表す。「汚れる」は道徳的罪を明示せず、レビ記の定型表現として簡潔である。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: レビ記に繰り返される期限の定型句を、自然で明瞭な日本語にした。
theological_decisions:
- issue: レビ記の清浄規定における טָמֵא の性質
  choice: 「汚れる」と訳し、祭儀上の状態を表す
  alternative: 「儀礼的に汚れる」「不浄となる」
  rationale: 本文は清浄規定上の状態を述べており、必ずしも道徳的罪を意味しない。「儀礼的に」を本文へ補わず、原文の簡潔さを保った。
- issue: הוּא（それ）の指示対象
  choice: 「それ」として曖昧さを保つ
  alternative: 血、汚れ、触れる対象などを具体的に補う
  rationale: 原文の代名詞が何を指すかはこの節だけでは明示されないため、特定の解釈を本文に持ち込まない。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある法規文の調子とした。「寝床」「物」「汚れる」を用いて過度に古風な語を避けつつ、原文の条件構文と指示語の曖昧さを保持した。
