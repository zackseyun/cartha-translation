  to: 祭司はその二羽をささげ、一羽を罪のためのささげ物[a]とし、もう一羽を全焼のささげ物とする。こうして祭司は、その人の漏出のために、ヤハウェの前でその人のために贖いをする。
  rationale: 原文の祭儀的・法規的意味と英語監査記録の方針を保ったまま、「漏出のゆえに」を現代日本語として自然で中立的な「漏出のために」に改め、代名詞の反復を「その人」として明瞭にした。脚注の用語も本文に合わせて統一した。
