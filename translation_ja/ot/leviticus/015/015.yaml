  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: ja
  text: 祭司はその二羽をささげ、一羽を罪のためのささげ物[a]とし、もう一羽を全焼のささげ物とする。こうして祭司は、その人の漏出のために、ヤハウェの前でその人のために贖いをする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「きよめのささげ物」。ヘブライ語のחַטָּאתは、道徳的な罪のためだけでなく、儀礼上の汚れを取り除くためのささげ物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: その二羽をささげ
  rationale: עָשָׂהはここでは祭儀上、供え物として扱い、ささげることを指す。複数代名詞は前節の二羽の鳥を受けるため、日本語では「その二羽」と明示した。
- source_word: אֶחָד חַטָּאת
  choice: 一羽を罪のためのささげ物[a]とし
  rationale: חַטָּאתの伝統的で広く理解される訳語を保ちつつ、この文脈では道徳的罪だけでなく儀礼上の汚れを除く供え物であることを脚注で示した。
- source_word: וְהָאֶחָד עֹלָה
  choice: もう一羽を全焼のささげ物とする
  rationale: עֹלָהは祭壇上で全体を焼く供え物を指すため、「全焼のささげ物」とした。対になる定冠詞付きの「一つ」は自然な日本語で「もう一羽」とした。
- source_word: וְכִפֶּר עָלָיו
  choice: 彼のために贖いをする
  rationale: כפרの祭儀的・神学的な幅を保ち、作用の仕組みを一つに限定しない定着した表現とした。עָלָיוは「彼のために」と訳した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神名を固有名として示し、לִפְנֵיは祭儀が神の御前で行われることを表す「前で」とした。
- source_word: מִזּוֹבוֹ
  choice: 彼の漏出のゆえに
  rationale: מןはここでは贖いを必要とする原因・契機を示す。「漏出」は身体からの異常な流出を指す文脈に適合し、過度に医学的に限定しない。
theological_decisions:
- issue: 儀礼的汚れの文脈におけるחַטָּאת
  choice: 罪のためのささげ物
  alternative: きよめのささげ物
  rationale: 伝統的な祭儀用語との連続性を保ちながら、この供え物が本人の道徳的罪だけを前提とするとの誤解を避けるため、儀礼的浄化を強調する別訳を脚注に示した。
- issue: כפרの訳し方
  choice: 贖いをする
  alternative: 償いをする／汚れを除く儀式を行う
  rationale: 贖罪・償い・清めにまたがる語の祭儀的な含みを、特定の贖罪論や作用だけに狭めずに保持した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で荘重な祭儀法規の文体とした。「その二羽」「一羽」「もう一羽」により前節とのつながりを明確にし、神名は「ヤハウェ」と表記した。
