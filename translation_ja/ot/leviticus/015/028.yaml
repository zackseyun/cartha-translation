id: LEV.15.28
reference: Leviticus 15:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: ja
  text: しかし、もしその女の分泌が止まったなら[a]、自分のために七日を数えなければならない。その後、彼女は清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もしその女が自分の分泌から清くなったなら……その後、彼女は清い者となる」。ヘブライ語では前半と後半に同じ語根が使われ、前半では分泌が止むこと、後半ではその結果として祭儀上清い身分になることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前の規定を受けた条件を示す。接続詞と条件辞の働きを保ちつつ、現代日本語として明瞭にした。
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: その女の分泌が止まった
  rationale: 字義的には「彼女がその分泌から清くなった」。ここでは分泌の終止を指すため自然な日本語で表したが、同じ語根が後半では祭儀上の清い身分を表すことを脚注で示した。
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  choice: 自分のために七日を数えなければならない
  rationale: לָּהּを「自分のために」と明示し、手続き上の指示であることを「なければならない」で表した。
- source_word: וְאַחַר
  choice: その後
  rationale: 七日を数え終えた次の段階を簡潔に示す。
- source_word: תִּטְהָר
  choice: 彼女は清くなる
  rationale: 祭儀上の身分として清くなることを表す。前半と同じטהרの語根を「清い」に関わる表現として脚注でも補足した。
theological_decisions:
- issue: 清浄規定におけるטהרの意味
  choice: 「清くなる」を祭儀上の状態として訳す
  alternative: 「浄化される」「きよめられる」
  rationale: この文脈は身体の分泌に伴う祭儀上の清浄・不浄を扱っており、道徳的罪悪を意味しない。「清くなる」はその区別を比較的自然に保つ。
- issue: 前半と後半における同一語根の意味の幅
  choice: 前半を「分泌が止まった」、後半を「清くなる」とし、脚注で同一語根であることを示す
  alternative: 両方を「清くなる」でそろえる
  rationale: ヘブライ語の語彙的連関を脚注で保存しながら、前半の身体的な終止と後半の祭儀上の身分という文脈上の違いを明瞭にする。
translation_notes:
  register: 現代の標準的な日本語による、簡潔で格調を保った律法文。身体的な分泌の終止と祭儀上の清浄を混同せず、道徳的な含意を加えない。
