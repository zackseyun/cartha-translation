source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: ja
  text: 男が女と寝て、精液を出したなら[a]、二人は水で身を洗い、夕方まで汚れた状態となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「精液の放出を伴って」。ヘブライ語の表現は、特に精液の放出を指す。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れ」は、夕方まで続く祭儀上の汚れを指し、道徳的な罪を意味するとは限らない。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: 男が女と……なら
  rationale: 法規の条件文としての働きを自然な現代日本語の「なら」で表した。ヘブライ語では「女」が文頭に置かれるが、後続する男性主語を含め、日本語では出来事全体を条件節として組み立てた。
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: 男が女と寝て
  rationale: 性的関係を表す שׁכב の慣用表現を、原文の婉曲性と法文の品位を保つ「女と寝る」で訳した。
- source_word: שִׁכְבַת זָרַע
  choice: 精液を出した
  rationale: 字義的には「種の横たわり／放出」に当たり、ここでは射精を指す。日本語として明瞭で直接的だが過度に医学的ではない表現を採った。
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: 二人は水で身を洗い
  rationale: 複数形が男女双方を指すことを「二人」で明示した。בַמַּיִם は日本語の自然な手段表現として「水で」とし、רחץ は全身を洗う文脈を示す「身を洗う」とした。
- source_word: וְטָמְאוּ
  choice: 汚れる
  rationale: レビ記における一時的な祭儀上の状態を表す語であり、道徳的罪を意味する語を加えず簡潔に訳した。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 時間的境界を原文どおり保持し、日本語として自然な定型表現にした。
theological_decisions:
- issue: レビ記の清浄規定における「汚れ」の性質
  choice: 本文では単に「汚れる」と訳し、道徳的な罪責を示す表現を加えない。
  alternative: 「儀式上汚れる」または「祭儀的に汚れた者となる」
  rationale: טמא はこの箇所で性交後の一時的な祭儀上の状態を示す。本文にない道徳的非難を持ち込まず、その文脈上の意味は脚注で補足する。
- issue: שִׁכְבַת זָרַע の統語的関係
  choice: 性交に伴って男性が精液を出した場合を表す条件として訳す。
  alternative: 字義に近く「精液の放出を伴って女と寝たなら」
  rationale: 原文の圧縮された表現を自然な日本語に展開しつつ、規定が精液の放出を伴う性交を対象としている点を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の法文として簡潔で品位ある調子を保った。「寝る」は原文の婉曲表現を維持し、「精液」は身体的内容を曖昧にしない。「水で身を洗う」は日本語の自然さを優先しつつ、両者が洗うという複数形を明示した。
