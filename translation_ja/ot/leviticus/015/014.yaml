  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: ja
  text: 八日目に、その人は自分のために山鳩二羽か、鳩のひな二羽を取る。そしてヤハウェ[a]の前、会見の天幕の入口に来て、それらを祭司に渡す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の固有名「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語形と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 八日目に
  rationale: 接続詞を日本語で逐語的に「そして」とせず、前節から続く清めの手順として自然に示した。
- source_word: יִקַּח לוֹ
  choice: その人は自分のために…取る
  rationale: לוֹを「自分のために」と明示し、法規文の未完了形は現代日本語で簡潔な規定表現となる非過去形で訳した。
- source_word: שְׁתֵּי תֹרִים
  choice: 山鳩二羽
  rationale: תֹרִיםは犠牲に用いるturtledoveを指す。「山鳩」は聖書日本語として理解しやすく、後続の若い家鳩とも区別できる。
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: か、家鳩のひな二羽
  rationale: 直訳的な「鳩の子二羽」ではなく、בְּנֵי יוֹנָהが表す若い鳩を自然に示した。選択肢を表すאוֹは「か」で訳した。
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: ヤハウェの前に出て
  rationale: לִפְנֵיの空間的・礼拝的表現を「前に出る」で保ち、神名は固有名として音写した。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口に行き
  rationale: אֶלの方向性を「入り口に行き」で示し、אֹהֶל מוֹעֵדは定着した明瞭な表現「会見の天幕」とした。
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: それらを祭司に渡す
  rationale: נתןによる直接の受け渡しを、自然で具体的な「渡す」で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が記されていることを本文で明示するため「ヤハウェ」とした。伝統的な代読・訳語は脚注で示し、特定の教派的解釈は加えない。
- issue: לִפְנֵי יְהוָה と幕屋の入り口の関係
  choice: 会見の天幕の入り口に行き、ヤハウェの前に出て
  alternative: ヤハウェの前、会見の天幕の入り口に来て
  rationale: 原文の両句の密接な関係を保ちつつ、日本語では動作の順序が明瞭になるようにした。神が幕屋内の特定地点に限定されるとの説明は加えていない。
translation_notes:
  register: 現代の一般読者に理解できる簡潔で荘重な法規文。単位語は鳥に自然な「羽」を用い、「会見の天幕」「祭司」など祭儀上の用語は一貫性を優先した。
