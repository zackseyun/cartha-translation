source:
  edition: WLC
  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: ja
  text: 漏出のある男性の漏出が治まったなら、その人は自分を清めるために七日を数え、衣服を洗い、生きた水[a]で体を洗う。そうすれば、清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「生きた水」。新鮮な水、特に湧水や流水を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: 漏出のある男
  rationale: この章で扱われる身体からの異常な漏出がある者を指す。文脈上の男性への言及を保ちつつ、現代日本語で明瞭に表した。
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: 漏出が止まって清くなった
  rationale: טהר は祭儀上の清さへの移行を表し、מן は漏出から離れた状態を示す。「治った」と断定せず、漏出の終息と祭儀的な清さを区別しながら表現した。
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: その人は…七日を数え
  rationale: 手順を示す命令的な継続を自然な日本語で表し、七日間を数えるという原文の言い方を保った。
- source_word: לְטָהֳרָתוֹ
  choice: 清めのために
  rationale: 道徳的な罪責ではなく、祭儀上の清めの過程を指す語として訳した。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: 衣服の洗濯を指す語を簡潔で自然な現代日本語にした。
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: 体を洗う
  rationale: בשר の字義は「肉」だが、ここでは全身の洗浄を意味するため「体」とした。
- source_word: בְּמַיִם חַיִּים
  choice: 生きた水
  rationale: 字義的表現を本文に保ち、その実際的な意味である新鮮な水、特に湧水や流水を注で説明した。
- source_word: וְטָהֵר
  choice: そうすれば、清くなる
  rationale: 一連の手順の結果として祭儀上清くなることを示す。接続関係を日本語で明確にした。
theological_decisions:
- issue: 清浄規定の用語を道徳的罪責と混同しないこと
  choice: 「清くなる」「清め」と訳し、祭儀上の状態として扱う
  alternative: 「罪から清められる」など道徳的意味を加える
  rationale: 本文は身体の漏出に伴う祭儀上の汚れと清めを扱っており、個人的な罪を明示していないため。
- issue: מַיִם חַיִּים の比喩性と実際的意味
  choice: 本文では「生きた水」とし、注で新鮮な水、特に湧水や流水と説明する
  alternative: 本文で「流水」または「新鮮な水」と意訳する
  rationale: ヘブライ語の具体的で印象的な表現を保持しつつ、後代の神学的意味を無用に持ち込まず、当該清浄規定での意味を明らかにするため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の規定文としての簡潔で厳粛な調子を保った。「漏出」は医学的に中立な語であり、「清い」は衛生状態や道徳性ではなく祭儀上の状態を表す。
