base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: ja
  text: 八日目に、彼女は自分のために山鳩二羽、または若い鳩二羽を取り、会見の天幕の入口で祭司にそれらを持って行く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 八日目に
  rationale: 接続詞を日本語で明示すると不自然になりやすいため、律法規定の連続性は文脈に委ね、時を表す句を自然に訳した。
- source_word: תִּקַּח לָהּ
  choice: 彼女は自分のために…取る
  rationale: 法的指示を現代日本語の非過去形で表し、利益・再帰を示す לָהּ は「自分のために」として保持した。
- source_word: שְׁתֵּי תֹרִים
  choice: 山鳩二羽
  rationale: תֹרִים は犠牲に用いるキジバト類を指し、日本語聖書で理解しやすい慣用的な名称「山鳩」を採用した。
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: 若い鳩二羽
  rationale: 字義的には「鳩の子二羽」だが、年若い鳩を指すヘブライ語の慣用表現として自然に訳した。
- source_word: וְהֵבִיאָה אֹתָם
  choice: それらを…祭司のもとへ持って行く
  rationale: 先行する法的指示に続く行為として訳し、複数目的語を「それら」で明示した。
- source_word: אֶל הַכֹּהֵן אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口にいる祭司のもとへ
  rationale: 二度の אֶל が示す到達点を、日本語で自然な一つの場所関係として表現した。祭司が入口にいるという統語関係を明確にしつつ、原文の意味を保持した。
