    reason: 原文の反復する方向を表す前置詞と、それに伴う構文上の別の理解を示すため。
  revision_rationale: 本文は、供え物を祭司に持参するという指示と会見の天幕の入口という儀礼上の場所を、現代日本語として自然に表した。原文の二重の方向句を「入口にいる祭司」として限定することは避け、その形式的な特徴は脚注に保持した。
