source:
  edition: WLC
  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: ja
  text: 「イスラエルの人々に告げて、彼らにこう言いなさい。『ある男に体[a]からの漏出があるとき、その漏出は汚れている。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉」。ここでは身体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ ... וַאֲמַרְתֶּם אֲלֵהֶם
  choice: 告げて、こう言いなさい
  rationale: 二つの複数命令を、日本語の自然な法令的導入句として保った。文脈上、モーセとアロンへの命令である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義は「イスラエルの子ら」だが、ここでは共同体を指す定型表現なので、現代日本語で明瞭な表現とした。
- source_word: אִישׁ אִישׁ
  choice: 男に
  rationale: 反復による分配的意味（「どの男でも」）を、この男性の身体症状を扱う規定に即して簡潔に表した。
- source_word: כִּי יִהְיֶה זָב
  choice: 漏出があるとき
  rationale: כי を祭儀法の事例提示として「とき」とし、זב の継続的な流出・漏出という意味を自然な日本語で示した。
- source_word: מִבְּשָׂרוֹ
  choice: 体から
  rationale: בשר の字義は「肉」だが、身体からの排出を指すこの文脈では「体」が明瞭であり、原文が明示しない部位を限定しない。
- source_word: זוֹבוֹ
  choice: その漏出
  rationale: 動詞的表現 זב と同根の名詞を「漏出」で対応させ、法規文における語の連続性を保った。
- source_word: טָמֵא
  choice: 汚れている
  rationale: レビ記の祭儀上の不浄を表し、道徳的な罪と同一視しない定着した表現を用いた。
theological_decisions:
- issue: טָמֵא הוּא の指示対象
  choice: その漏出は汚れている
  alternative: その人は汚れている
  rationale: 直前の男性名詞 זוֹבוֹ（「その漏出」）を受ける読みを本文に採った。ただし הוא は男性本人を指すことも文法上可能なため、別訳を注記して曖昧さを保持した。
- issue: 祭儀的不浄の表現
  choice: 汚れている
  alternative: 不浄である
  rationale: טמא はこの箇所で祭儀上の状態を示す。「汚れている」は一般読者に理解しやすく、必ずしも道徳的非難を意味しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の法令文にふさわしい簡潔で厳粛な調子を保った。「漏出」はやや医学的だが、原文の婉曲性と身体部位の非限定性を維持できる語として採用した。
