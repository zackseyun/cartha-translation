source:
  edition: WLC
  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: ja
  text: 月経に伴う不調にあり、その汚れの状態にある女[a]について、身体からの漏出がある者について、すなわち男についても女についても、また、汚れた女[b]と寝る男についてのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「月経に伴う不調」は「月経中の女」とも訳せる。ここでいう「汚れ」は、月経に伴うレビ記の律法上の祭儀的な状態を指し、道徳的な汚れを意味しない。
    reason: lexical_alternative
  - marker: b
    text: ここで「汚れた」とは、レビ記の律法上、祭儀的に汚れた状態にあることをいう。人格や道徳性についての評価ではない。
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: 月経による汚れの状態にある女
  rationale: 二つの表現を不自然に重ねず、月経に伴うレビ記上の儀礼的な汚れの状態を明確に表した。הַדָּוָה の不調・流出という含みは文脈上の月経に包含される。
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: 漏出のある者
  rationale: 同語根を重ねるヘブライ語を自然な日本語にし、身体からの異常な漏出がある者という法的区分を示した。
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: それが男であれ女であれ
  rationale: 直前の『漏出のある者』が男女双方を含むことを、原文の範囲指定に沿って明示した。
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: と寝る
  rationale: 性的関係を指す婉曲表現を、原文と同様に婉曲でありながら現代日本語でも理解できる形で保った。
- source_word: טְמֵאָה
  choice: 汚れた女
  rationale: レビ記の祭儀的清浄規定における定型概念を表し、道徳的な人格評価ではないことは注で明確にした。
theological_decisions:
- issue: 汚れの性質
  choice: 『汚れ』を祭儀上の状態として訳す
  alternative: 道徳的な罪や不潔さを表す語として訳す
  rationale: נִדָּה と טְמֵאָה はここではレビ記の清浄規定上の状態を指し、女性の人格や道徳性を非難するものではない。
- issue: הַדָּוָה の訳し方
  choice: 文脈に即して『月経による汚れの状態にある女』とする
  alternative: 『病んでいる女』『月経中の女』と分けて訳す
  rationale: 語の不調・流出の含みを認めつつ、続く בְּנִדָּתָהּ が状態を限定しているため、日本語では月経に関する祭儀的状態として一体的に表すのが明瞭である。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある法規的文体とした。前後に続く総括文の一部であるため、列挙を保ち、末尾を『についてのものである』として文脈上のつながりを示した。
