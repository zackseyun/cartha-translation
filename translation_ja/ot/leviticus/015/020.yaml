source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: ja
  text: 彼女が月経による汚れの期間に横たわるものはすべて、汚れたものとなる[a]。彼女が座るものもすべて、汚れたものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「汚れたものとなる」とは、清浄規定上、儀礼的に汚れた状態になることをいう。道徳的な罪を意味しない。
    reason: 「汚れ」が身体的な不潔さや道徳的罪悪を意味すると誤解されないよう、レビ記における儀礼上の用法を示すため。
lexical_decisions:
- source_word: נִדָּה
  choice: 月経による汚れの期間
  rationale: 月経という身体的な出来事だけでなく、レビ記の清浄規定における儀礼上の汚れの状態を含む語であるため。「月経中」だけに狭めず、文脈上の法的・儀礼的意味を保った。
- source_word: תִּשְׁכַּב
  choice: 横たわる
  rationale: 物の上に身を横たえることを表し、必ずしも眠ることを意味しないため。
- source_word: תֵּשֵׁב
  choice: 座る
  rationale: ここでは物の上に座るという直接的な意味であり、自然で明確な訳語である。
- source_word: עָלָיו
  choice: 物の上に（関係節では「横たわる物」「座る物」）
  rationale: 女性の身体の下にある物との空間的関係を、日本語として自然な関係節で表した。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 清浄規定の中で儀礼上汚れた状態になることを示す。未来予告ではなく法規上の帰結として簡潔に表した。
- source_word: וְכֹל אֲשֶׁר
  choice: 物はすべて
  rationale: 該当する物を例外なく含むヘブライ語の包括的な表現を、自然な日本語で保った。
theological_decisions:
- issue: レビ記の清浄規定における「汚れ」の性質
  choice: 儀礼上の汚れとして訳し、道徳的な罪を意味させない
  alternative: 月経そのものを道徳的なけがれや罪と受け取れる表現にする
  rationale: טמא と נִדָּה はこの箇所ではイスラエルの清浄規定上の状態を指しており、月経を道徳的な罪と断定してはいない。脚注によってこの区別を明示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、法規としての簡潔さと重みを保った。「寝る」は睡眠を連想させるため避け、「横たわる」とした。
