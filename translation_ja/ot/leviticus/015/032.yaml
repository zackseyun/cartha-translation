source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: ja
  text: これは、漏出のある男性[a]と、精液の放出があり、それによって汚れた男性についての律法である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「漏出している者」。ここでは、身体から分泌物が流れ出る症状のある男性を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: これは……についての律法である
  rationale: レビ記の規定をまとめる定型句。「律法」は法的な教示という文脈を保ち、「についての」により日本語として自然に対象を示した。
- source_word: הַזָּב
  choice: 漏出のある人
  rationale: 身体から異常な分泌物が流れ出る状態の人を指す。性別を本文以上に明示せず、医学的に限定しすぎない表現とした。
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: 精液が出た……人
  rationale: 原文の「その人から精液の放出が出る」という具体的な表現を、明瞭で過度に婉曲でない現代日本語にした。
- source_word: לְטָמְאָה בָהּ
  choice: そのためにそれによって汚れた
  rationale: 不定詞の結果の意味と、女性単数接尾辞が指す精液の放出を反映した。「汚れ」は儀礼上の状態を表すレビ記の標準的な語として用いた。
theological_decisions:
- issue: טמא の性質
  choice: 「汚れた」と訳し、儀礼上の状態を表す文脈を保つ
  alternative: 「不浄になった」
  rationale: 道徳的罪と同一視せず、同時に本文へ説明を加えすぎないため、レビ記で一般的かつ理解しやすい「汚れ」を採用した。
translation_notes:
  register: 明瞭な現代標準日本語。法規の結語にふさわしい簡潔で dignified な文体とし、身体現象は婉曲化せず節度ある語で表現した。
