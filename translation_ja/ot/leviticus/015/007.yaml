  rationale: 身体を洗うという原文の行為を「水で身を洗う」と明確にし、衣服の所有を補った。בָּשָׂר の文字どおりの意味は注で示しつつ、本文では自然な「体」を用いた。祭儀上の汚れを表す「汚れている」は保持した。
