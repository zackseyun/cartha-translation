  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ja
  text: 体からの漏出がある男性の体[a]に触れる者は、自分の衣服を洗い、水で身を洗わなければならない。その者は夕方まで汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉」。ここでは身体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: 触れる者は
  rationale: 定冠詞付き分詞の一般的・実体詞的用法を、法文として自然な日本語で表した。
- source_word: בִּבְשַׂר
  choice: 肉体に
  rationale: בָּשָׂר の「肉」という具体性を保ちつつ、人の身体を指す文脈に即して、現代日本語で不自然にならない「肉体」とした。
- source_word: הַזָּב
  choice: 漏出のある人
  rationale: זוּב の分詞が示す身体的な漏出の状態を簡潔に表現した。男性単数形だが、日本語では文脈上の指示を保ちながら過度に性別を明示しない表現が自然である。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: 衣類を洗うことを表す定型的な語句として、明瞭で品位ある「衣服を洗う」を採用した。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水を浴びなければならない
  rationale: 身体を水で洗う行為を自然な日本語で示し、未完了形がこの法規で担う義務の意味を「なければならない」で明示した。
- source_word: וְטָמֵא
  choice: 汚れている
  rationale: 祭儀上の状態を表す語としてレビ記で通用する「汚れている」を用い、道徳的罪悪を意味しないようにした。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 汚れた状態が続く期限を簡潔かつ自然に表した。
theological_decisions:
- issue: טָמֵא が表す汚れの性質
  choice: 祭儀上の状態として「汚れている」と訳す
  alternative: 「不浄である」「穢れている」
  rationale: この章の語は道徳的な罪ではなく、イスラエルの清浄規定における祭儀上の状態を示す。「汚れている」は平明で、文脈を通してその専門的意味を保持できる。
translation_notes:
  register: 現代標準日本語による簡潔な法文調。「肉体」は原文 בָּשָׂר の具体性を保つために採用し、義務は「なければならない」で明確にした。
