source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ja
  text: 漏出のある男が座った物に座る者は、自分の衣服を洗い、水で身を洗わなければならない。そして、その人は夕方まで汚れている。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: 座る者は
  rationale: 定冠詞付き実詞的分詞の一般的な適用を、律法文として簡潔で自然な日本語にした。接続詞は日本語では明示しなくても文脈上の連続性が保たれる。
- source_word: הַכְּלִי
  choice: 物
  rationale: כְּלִי は器、道具、品物などを広く指す。ここでは座ることのできる何らかの物を指し、特定の容器に限定しないため、「物」が自然で意味の幅を保つ。
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: が座った
  rationale: 関係節は、その物を漏出のある男が先に座った物として特定する。ヘブライ語未完了形はこの文脈では既成の接触を指すため、日本語の過去形が自然である。
- source_word: הַזָּב
  choice: 漏出のある男
  rationale: この章の当該段落は男性の身体的漏出を扱い、語形も男性単数である。「漏出」は原語の身体症状を簡潔に表し、「男」で指示対象を明確にする。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 自分の衣服を洗い
  rationale: כִּבֵּס は衣服を洗うことを表す。「自分の」は三人称男性単数接尾辞を自然に明示する。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水を浴びなければならない
  rationale: 清浄規定における רָחַץ は身体を水で洗う行為を指す。「水を浴びる」は現代日本語で全身の洗浄を自然に伝え、義務表現によって法規的効力を示す。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: そして夕方まで汚れている
  rationale: 結果として続く儀礼上の汚れの状態と、その期限を簡潔に保持した。「そして」により、洗浄しても夕方までは状態が続くことを明確にした。
theological_decisions:
- issue: 汚れの性質
  choice: 「汚れている」と訳し、道徳的罪責を付加しない
  alternative: 「儀礼上汚れている」「身を汚している」
  rationale: 文脈はレビ記の清浄規定であり、必ずしも道徳的な罪を意味しない。「儀礼上」を本文に加えると解釈を補いすぎ、「身を汚す」は本人の能動的行為という含みを生じうる。
- issue: הַזָּב の性別
  choice: 「漏出のある男」として男性の指示対象を明示する
  alternative: 「漏出のある者」
  rationale: レビ記15章2–15節は男性の漏出を扱い、原文も男性単数形であるため、性別を中性化せず保持する。
- issue: 洗浄後も続く汚れ
  choice: 洗浄命令の後に「そして夕方まで汚れている」と続ける
  alternative: 洗えば夕方に清くなると説明的に訳す
  rationale: 原文は洗浄と汚れの期限を並置し、その関係を詳しく説明しない。神学的・儀礼的な緊張を解消せず、そのまま保つ。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で威厳ある律法文の文体。「なければならない」で規定の義務性を自然に表し、「汚れている」はレビ記の清浄規定における状態を一貫して示す。原文の כְּלִי は広義だが、日本語の「物」で十分に幅が保たれるため脚注は設けない。
