source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: ja
  text: 男から精液が出たなら[a]、その人は水で全身を洗わなければならない。そして、夕方まで汚れた状態となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「精液の排出があったなら」。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れ」は、レビ記の清浄規定における儀礼上の状態を指し、必ずしも道徳的な罪を意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: 男
  rationale: 男性の身体からの精液の排出を扱う規定なので、性別を明示する「男」とした。
- source_word: כִּי
  choice: なら
  rationale: 個別事例を規定する法文の条件を、自然な現代日本語で示した。
- source_word: תֵצֵא מִמֶּנּוּ
  choice: から……が出た
  rationale: 直訳的な「彼から出る」の方向性を保ちつつ、日本語として自然な表現にした。
- source_word: שִׁכְבַת זָרַע
  choice: 精液
  rationale: 字義的には「種の排出」を表す語句だが、この文脈では精液を指すため、明確で一般的な語を用いた。別の訳し方は脚注に示した。
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: その人は水で全身を洗わなければならない
  rationale: 「すべての肉」はここでは身体全体を意味するため「全身」とし、法的な指示を「なければならない」で表した。בַּמַּיִם は日本語の自然な手段表現として「水で」とした。
- source_word: וְטָמֵא
  choice: 汚れた者となる
  rationale: レビ記の清浄規定における状態の変化を表しつつ、本文では伝統的で簡潔な「汚れ」を保った。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 汚れた状態が続く期限を簡潔かつ自然に示した。
theological_decisions:
- issue: 清浄規定における טָמֵא の性質
  choice: 本文では「汚れた者となる」とし、儀礼上の汚れであることを脚注で説明する
  alternative: 道徳的に罪深い者となる、または単に身体が不潔になる
  rationale: この箇所は身体からの排出に関するレビ記の清浄規定であり、本文自体は道徳的罪責を述べていない。伝統的な語を残しながら、誤解を避けるため脚注で文脈を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法文としての厳粛さを保った。「全身」によってヘブライ語の「すべての肉」の意味を自然に伝え、「汚れ」は伝統的な聖書用語として残しつつ脚注で限定した。
