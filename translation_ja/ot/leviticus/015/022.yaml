source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ja
  text: また、彼女が座るどんな物[a]に触れる者も、衣服を洗い、水で身を洗わなければならない。その人は夕方まで汚れている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「器」「品物」。ヘブライ語は、器具や品物などを広く指す語。
    reason: lexical_alternative
  - marker: b
    text: ここでの「汚れている」は、儀礼上の清浄・不浄に関する状態を指す。
    reason: ritual_terminology
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: また、……触れる者は
  rationale: 接続詞と実体詞的分詞が示す包括的・一般的な規定を、自然な現代日本語で表した。
- source_word: בְּכָל כְּלִי
  choice: どの物にでも
  rationale: כְּלִי は器、道具、品物などを広く指し得る。この文脈では、狭く「器」と限定せず「物」とすることで語義の広さを保った。
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: 彼女が座った
  rationale: 前節までの女性を主語として補い、完了形ではないヘブライ語の一般的な規定を、日本語の連体修飾として自然に表現した。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: 衣類を洗濯する意味を明確にしつつ、律法上の指示の一部として簡潔に訳した。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水で身を洗わなければならない
  rationale: 祭儀的清めの文脈で身体を洗うことを示すため、「身を」を補った。義務性は一連の動詞全体に及ぶ自然な日本語で示した。
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: その人は夕方まで汚れている
  rationale: 接触による祭儀上の状態と、その継続期限を簡潔に表した。
theological_decisions:
- issue: レビ記の清浄規定における טָמֵא の性質
  choice: 「汚れている」と訳し、祭儀上の状態を表す
  alternative: 「不浄である」「けがれている」
  rationale: ここで述べられているのは接触によって生じる祭儀上の汚れであり、道徳的罪責ではない。文脈上の術語性を保ちつつ、一般読者に分かりやすい表現を選んだ。
translation_notes:
  register: 明瞭で端正な現代標準日本語。律法規定としての義務性を保ちつつ、過度に古風な「衣を洗い」「水に身をすすぐ」などは避けた。
