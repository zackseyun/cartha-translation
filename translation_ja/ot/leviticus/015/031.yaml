  to: あなたがたは、イスラエルの人々に、彼らの汚れについて警告しなければならない。彼らが、彼らのただ中にあるわたしの幕屋を汚して、汚れた状態のまま死ぬことがないようにするためである。
  rationale: 原文の語順に拘束されず、目的節の主語を「彼らが」と明示した。「彼らのただ中にある」は幕屋に係る関係節として保持し、「汚れた状態のまま」によりבְּטֻמְאָתָםの状態的な意味を自然に表した。これにより、幕屋を汚すことと当人たちの祭儀的汚れを混同せず、死を回避するという予防目的も明確になる。
