source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: ja
  text: あなたがたは、イスラエルの人々に、彼らの汚れについて警告しなければならない。彼らが、彼らのただ中にあるわたしの幕屋を汚して、汚れた状態のまま死ぬことがないようにするためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: 警告しなければならない
  rationale: זהרのヒフィル形は、この律法的文脈では危険を避けさせるために警告することを表す。後続の目的節とのつながりも自然に示せる。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 定型的な契約共同体の呼称を、原文の形に即して訳した。ここでは十五章で扱われる男女を含むイスラエル共同体を指す。
- source_word: מִטֻּמְאָתָם
  choice: その汚れについて
  rationale: זהרのヒフィル形に伴うמןを警告の対象・事柄として理解した。「汚れから遠ざける」も語源上は考えられるが、警告の意味を明確にした。
- source_word: טֻמְאָה
  choice: 汚れ
  rationale: レビ記における祭儀上の状態を表す語として、日本語聖書で理解しやすい「汚れ」を用いた。道徳的な罪そのものとは同一視しない。
- source_word: וְלֹא יָמֻתוּ
  choice: 死ぬことのないため
  rationale: 前の命令に続くוְלֹאを予防目的として自然な日本語にした。
- source_word: בְּטֻמְאָתָם
  choice: その汚れのうちに
  rationale: 前置詞בが示す状態・状況を保持し、原因だけに限定しない表現とした。
- source_word: בְּטַמְּאָם
  choice: 汚し
  rationale: טמאのピエル不定詞構文を、幕屋を汚れた状態にする行為として簡潔に表した。
- source_word: מִשְׁכָּנִי
  choice: わたしの幕屋
  rationale: 五書における具体的な礼拝施設であり神の住まいを指すため、「聖所」よりも指示対象の明確な「幕屋」とした。
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: 彼らのただ中にある
  rationale: 神の住まいがイスラエル共同体の中にあることを、原文に近く自然な日本語で示した。
theological_decisions:
- issue: レビ記における祭儀的な汚れ
  choice: טֻמְאָהを「汚れ」と訳し、祭儀上の状態として保持する。
  alternative: 「不浄」「罪」
  rationale: この節の焦点は、汚れが神の幕屋に及ぶ危険であり、一般的な道徳的罪への言い換えは原文の区別を失わせる。
- issue: 死と幕屋の汚染との構文関係
  choice: 幕屋を汚すことにより、汚れた状態のまま死ぬ危険が生じるという連関を保持する。
  alternative: 汚れそのものを単純に直接の死因として表現する。
  rationale: 二つのב句には状態・手段・状況の幅があるため、「その汚れのうちに」と「幕屋を汚し」を併置し、因果関係を過度に単純化しない。
- issue: בְּנֵי יִשְׂרָאֵלの共同体的範囲
  choice: 本文では「イスラエルの子ら」と形式を保持する。
  alternative: 「イスラエル人」
  rationale: 原文の定型句を保ちつつ、この文脈では男女を含む共同体全体を指すものとして理解する。
translation_notes:
  register: 現代標準日本語による、明瞭で荘重な律法文体。「警告しなければならない」で命令の強さを示し、「汚れ」は祭儀的術語として一貫させた。原文に実質的な異読注を要する箇所はないため、脚注は付していない。
