id: LEV.15.24
reference: Leviticus 15:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: ja
  text: もし男がその女と床を共にし[a]、その女の月経による汚れが男に及んだなら、男は七日間汚れる。また、男が横になる寝床はすべて汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より明示的には、「その女と性交し」。ヘブライ語では直訳すると「確かにその女と横になり」。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: 床を共にし
  rationale: このヘブライ語表現は、文脈上、性交を意味する。「床を共にする」は婉曲表現を保ちつつ現代日本語で自然であり、不定詞絶対形による強意は、条件節では日本語として不自然な強調を加えず文脈に反映した。明示的な訳は脚注に示す。
- source_word: אִישׁ
  choice: 男
  rationale: 単数男性名詞で、ここでは成人男性を指すため、簡潔で性別に正確な「男」とした。
- source_word: נִדָּתָהּ
  choice: その女の月経による汚れ
  rationale: 単なる生理現象だけでなく、レビ記の祭儀的な汚れの状態を表すため、「月経」だけではなく「月経による汚れ」とした。
- source_word: וּתְהִי ... עָלָיו
  choice: 男に及んだ
  rationale: 直訳的には「彼の上にある／なる」。汚れが男性にも及ぶという関係を、自然な日本語で保った。
- source_word: וְטָמֵא
  choice: 男は七日間汚れる
  rationale: 条件に続く結果を示す。日本語の法文的文脈で明確な結果として表現した。
- source_word: הַמִּשְׁכָּב
  choice: 寝床
  rationale: 横になる場所を表す名詞。祭儀規定の文脈に適し、現代日本語でも理解しやすい。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 祭儀上の状態を示す語として、前半と一貫させた。道徳的罪悪を意味する表現は避けた。
theological_decisions:
- issue: 祭儀的な汚れと道徳的罪悪の区別
  choice: 「月経による汚れ」「汚れる」と訳し、祭儀上の状態として表す
  alternative: 「けがれる」「罪ある者となる」「冒涜される」
  rationale: レビ記15章の טמא と נדה は祭儀的清浄に関する語であり、この節自体は道徳的な罪責を明言していない。そこで、罪や冒涜を含意する語を加えない。
- issue: 性交を表す婉曲表現
  choice: 本文では「床を共にする」とし、脚注で「性交する」を示す
  alternative: 本文で直接「性交する」と訳す
  rationale: 原文の「横になる」という慣用的な婉曲性を保ちながら、意味が曖昧にならないよう脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法規定としての簡潔さと品位を保った。「女」「男」を反復し、代名詞の指示が曖昧になりやすい日本語で誰に汚れが及ぶかを明確にした。
