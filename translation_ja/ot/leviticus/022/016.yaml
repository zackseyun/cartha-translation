id: LEV.22.16
reference: Leviticus 22:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: ja
  text: また、彼らに、自分たちの聖なるもの[b]を食べることによる償いを要する罪責[a]を負わせてはならない。わたしは、彼らを聖別する[c]ヤハウェである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪過の責任」。ヘブライ語の表現は難しく、罪過に伴う責任や償いの義務を強調している可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「聖なるもの」とは、聖別された分や供え物を指す。
    reason: cultural_note
  - marker: c
    text: または「聖なる者とする」「聖なるものとして取り分ける」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: また……負わせてはならない
  rationale: ヒフィル形の使役的意味「負わせる」を採り、接続詞は前節の禁止に連なる「また」で表した。否定辞は前節から継続する構文として日本語では明示した。
- source_word: עֲוֺן אַשְׁמָה
  choice: 償いを要する罪責
  rationale: עָוֹןの罪責とאָשְׁמָהの賠償・罪過責任を伴う祭儀的、法的含意を簡潔に伝える。
- source_word: בְּאָכְלָם
  choice: 食べることによって
  rationale: 前置詞בを伴う不定詞構文の手段・原因の意味を表した。
- source_word: קָדְשֵׁיהֶם
  choice: 自分たちの聖なるもの
  rationale: 直訳的な表現を保ちつつ、文脈上は聖別された分や供え物を指すことを注で補った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名として音写し、称号への置換を避けた。
- source_word: מְקַדְּשָׁם
  choice: 彼らを聖別する
  rationale: קדשׁのピエル分詞が持つ「聖なるものとして取り分ける、聖別する」という祭儀的意味を保った。
theological_decisions:
- issue: 二つの「彼ら」と「自分たち」の指示対象
  choice: 代名詞のまま保持し、本文で指示対象を限定しない
  alternative: 祭司またはイスラエルの民と明示する
  rationale: 文脈上の候補はあるが、ヘブライ語本文自体の代名詞的な曖昧さを訳文で不必要に解消しないため。
- issue: מְקַדְּשָׁםの目的語
  choice: 「彼ら」を聖別する
  alternative: 「聖なるもの」を聖別する
  rationale: 男性複数接尾辞を人々への指示として自然に訳しつつ、「彼ら」として原文の表現を維持した。
translation_notes:
  register: 現代の一般読者に理解できる格調ある標準語。「罪責」「聖別」はレビ記の法的・祭儀的文脈に必要な用語として用い、注で意味を補う。前節から続く禁止を日本語として完結させるため「てはならない」を明示した。
