base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: דבר のワウ継続法は新たな発話を導入する。日本語の聖書的な語り口として自然であり、続く神の言葉を明確に導入する。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語で広く定着した敬称「主」で本文に示し、原語の神名であることを脚注で明記する。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 前置詞 אֶל が発話の相手を示すため、自然な現代日本語の助詞「に」で表す。固有名 מֹשֶׁה は慣用表記「モーセ」とする。
- source_word: לֵאמֹר
  choice: （独立して訳出せず）
  rationale: 直訳は「言って」であるが、日本語では「告げた」が後続する直接話法の導入を十分に担うため、重複して不自然になる表現を避けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主[a]
  alternative: ヤハウェ／エホバ
  rationale: 本文では現代日本語の読者に広く理解される「主」を用いる一方、称号への置換によって原文が固有の神名を記す事実が見えなくならないよう、脚注で YHWH とその代表的音写を示す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「告げた」により、次節から始まる直接話法への導入を簡潔に表した。
