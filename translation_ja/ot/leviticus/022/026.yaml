  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神が新たに語り始める定型句。現代日本語として自然であり、神への敬意を示す尊敬表現とした。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した神名の代替表記を本文に用い、原文が神名YHWHであることは脚注で明示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞と固有名を、自然な日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 後続する直接話法を導く定型表現であり、「告げられた」に機能を含めることで、冗長な「言われた」を避けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主[a]
  alternative: ヤハウェ
  rationale: 本文では日本語として定着した「主」を採用しつつ、神名そのものが記されているという原文上・神学上の情報を脚注に保持した。
translation_notes:
  register: 明快で簡潔な現代標準日本語。律法本文で繰り返される神の発話導入句として、簡潔さと荘重さを両立させた。
