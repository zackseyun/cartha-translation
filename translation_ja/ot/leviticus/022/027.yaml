language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: ja
  text: '牛、羊、または山羊が生まれたとき、それは七日間、母のもとにとどまるものとする。八日目以降は、ヤハウェへの火による献げ物[a]として受け入れられる。


    [a] 「火による献げ物」は、火にかけてささげる供え物を表すヘブライ語。別訳「食物の献げ物」。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火による献げ物」は、火にかけてささげる供え物を表すヘブライ語。別訳「食物の献げ物」。
    reason: אִשֶּׁהの伝統的な理解と、議論のある語義上の別訳を示すため。
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 牛類を表す語であり、ここでは犠牲動物の種類を示すため、性別や用途を限定しない「牛」とした。
- source_word: כֶשֶׂב
  choice: 羊
  rationale: この文脈では必ずしも幼い子羊に限らず、犠牲に用いる動物の種類を示しているため「羊」とした。
- source_word: עֵז
  choice: 山羊
  rationale: 文法上は女性形だが、ここでは種別名として用いられているため、性別を限定しない「山羊」とした。
- source_word: כִּי יִוָּלֵד
  choice: 生まれたなら
  rationale: 祭儀法の事例条件を導く表現として自然な日本語にし、受動的な「生まれる」の意味を保った。
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: 七日間は母親のもとに置き
  rationale: תַּחַת の字義は「下」だが、ここでは生まれた動物が母とともにいることを指す。「母親のもと」でヘブライ語の関係性を自然に表した。
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: 八日目以降は
  rationale: 資格が生じる起点とその後の継続を簡潔に表した。
- source_word: יֵרָצֶה
  choice: 受け入れられる
  rationale: 単なる一般的な好ましさではなく、祭儀上、献げ物として受納されることを表す。
- source_word: לְקָרְבַּן
  choice: 献げ物として
  rationale: 神の前に持って来る供え物を指す一般的な祭儀語として訳した。
- source_word: אִשֶּׁה
  choice: 火による献げ物
  rationale: 火にかけて献げる祭儀的供え物を指す伝統的理解を明示しつつ、「食物の献げ物」という別の訳し方を脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞の方向性を「への」で示し、神名 יהוה を固有名として音写した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として示すため、日本語で一般的な音写「ヤハウェ」を用いた。
- issue: אִשֶּׁה の意味
  choice: 火による献げ物
  alternative: 食物の献げ物
  rationale: 火にかけて献げるという祭儀上の性格を本文で保ちつつ、語の理解に幅があるため別訳を脚注に示した。
translation_notes:
  register: 現代の一般読者に明快な、簡潔で品位ある法規文の調子とした。「母親の下」という逐語訳は避け、「母親のもと」と自然に表現した。
