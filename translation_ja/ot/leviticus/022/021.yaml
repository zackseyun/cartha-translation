id: LEV.22.21
reference: Leviticus 22:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: ja
  text: また、人がヤハウェに平和のいけにえ[a]を献げるとき、誓願を果たすため[b]であれ、自発の献げ物としてであれ、牛、または羊やぎの中から献げるなら、それが受け入れられるために、傷のないものでなければならない。その動物にはどんな欠陥もあってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」は、「交わりのいけにえ」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: 「誓願を果たすため」は、「誓願を実行するため」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: また、人が……なら
  rationale: אִישׁは男性単数形だが、この祭儀法では個別事例を導入する代表的な法文表現である。日本語で不自然に性別を強調せず、「人が……なら」として条件構文を明確にした。
- source_word: יַקְרִיב
  choice: 献げる
  rationale: קרבのヒフィル形は祭儀の文脈で、供え物を神の前に携えて来て献げることを表す。「献げる」は簡潔で、宗教的文脈にも自然である。
- source_word: זֶבַח שְׁלָמִים
  choice: 和解のいけにえ
  rationale: זֶבַחは屠って献げるいけにえ、שְׁלָמִיםはその種類を示す。日本語で定着した「和解のいけにえ」を用い、別の解釈的訳語は脚注に示した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 子音本文にある神の固有名יהוהを、称号に置き換えず「ヤハウェ」と音写した。
- source_word: לְפַלֵּא נֶדֶר
  choice: 誓願を果たすため
  rationale: この祭儀法の文脈では、誓った供え物を実行し、誓願を履行することを指す。語形に伴う別訳の余地は脚注に残した。
- source_word: אוֹ לִנְדָבָה
  choice: あるいは自発のささげ物として
  rationale: נְדָבָהは誓願による義務とは区別される、自発的な供え物を指す。
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: 牛の群れまたは羊ややぎの群れから
  rationale: בקרは牛類、צאןは羊とやぎを含む小家畜の群れを表す。日本語では含まれる動物を明示して誤解を避けた。
- source_word: תָּמִים יִהְיֶה לְרָצוֹן
  choice: 受け入れられるためには、それは傷のないものでなければならない
  rationale: תמיםは祭儀上、身体的な傷や欠陥がないこと、לרצוןは受納されるための適格性を示す。条件と要求の関係が明瞭になるよう訳した。
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: どんな欠陥もあってはならない
  rationale: מוּםは供え物を不適格にする身体的欠陥を指す。直前の「傷のない」を補強する絶対的な要件として自然な法文調にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有名יהוהを用いているため、その区別を保って音写した。
- issue: שְׁלָמִיםという供犠名の理解
  choice: 和解のいけにえ
  alternative: 交わりのいけにえ／平和のいけにえ
  rationale: 語根שׁלםとのつながりを保つ伝統的な訳を本文に置いたが、この供犠の意味を「交わり」と捉える訳もあるため脚注に示した。
- issue: אִישׁの法文上の性と範囲
  choice: 人
  alternative: 男
  rationale: ヘブライ語は男性単数形だが、ここでは事例を提示する法文上の主体である。現代日本語で「男」とすると適用範囲を必要以上に限定して聞こえるため、「人」とした。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法文調とした。「献げる」「いけにえ」など祭儀に必要な語は保持しつつ、家畜区分は「牛」「羊ややぎ」と具体化した。
