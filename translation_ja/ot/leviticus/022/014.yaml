reference: Leviticus 22:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: ja
  text: 人が[a]誤って[c]聖なるもの[b]を食べたなら、その人はその五分の一を上乗せし[d]、聖なるものを祭司に渡さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「男」。ヘブライ語 אִישׁ は男性単数形だが、このような法文では一般に「人」を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「聖なるもの」とは、聖別され、祭司のために取り分けられた食物や物を指す。
    reason: cultural_note
  - marker: c
    text: 別訳「過失によって」「知らずに」。故意ではない行為を表す。
    reason: lexical_alternative
  - marker: d
    text: 直訳に近くは「その五分の一をそれに加え」。
    reason: literal_rendering
lexical_decisions:
- source_word: וְאִישׁ
  choice: 人が
  rationale: אִישׁは形態上は男性単数だが、ここでは事例法の一般的な当事者を示す。現代日本語の法的表現として自然な「人」を用い、原語の形は脚注で示す。
- source_word: כִּי
  choice: ～なら
  rationale: 事例法の条件を導く用法であり、日本語では「～たなら」が自然である。
- source_word: יֹאכַל
  choice: 食べた
  rationale: 条件節内の行為として、現代日本語で自然な完了形を用いる。
- source_word: קֹדֶשׁ
  choice: 聖なるもの
  rationale: 祭司のために聖別された食物または物を指すが、原語自体の幅を保ち、「聖なる食物」などと狭く限定しない。二度の出現を同じ語で訳して語彙上の対応も保つ。
- source_word: בִּשְׁגָגָה
  choice: 誤って
  rationale: 故意ではない過失・不注意による行為を表す。簡潔で自然な現代日本語である。
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: その五分の一を上乗せし
  rationale: 元の分に五分の一を追加する償いを表す。「上乗せする」により加算の意味を自然に示し、何を基準とする五分の一かは原文同様に文脈に委ねる。
- source_word: וְנָתַן
  choice: 渡さなければならない
  rationale: 語義は「与える」だが、事例法の帰結にある義務的な効力を現代日本語で明確に表す。
- source_word: לַכֹּהֵן
  choice: 祭司に
  rationale: 定冠詞を伴う祭司を、当該の祭司または祭司職の受領者として自然に訳す。
- source_word: אֶת הַקֹּדֶשׁ
  choice: 聖なるものを
  rationale: 最初のקֹדֶשׁとの語彙的連関を保ち、償還される対象を原文以上に「代価」や「聖なる分」と限定しない。
theological_decisions:
- issue: 事例法における男性単数 אִישׁ
  choice: 本文では一般的な「人」とし、原語の男性形を脚注に記す
  alternative: 本文を「男」とする
  rationale: ヘブライ語の形態は男性単数だが、この法文では一般的な事例主体として機能しうる。日本語の「男」は成人男性に意味を狭めやすいため、一般性を本文で保ち、形態上の情報は脚注で明示する。
- issue: קֹדֶשׁ が指す償いの対象
  choice: 二箇所とも「聖なるもの」と訳す
  alternative: 「聖なる食物」「聖なる分」「その代価」と訳す
  rationale: 文脈上は祭司用に聖別された食物または物を指すが、本節だけでは対象や償還方法をさらに限定していない。広い表現を保つことで原文の含みを残す。
- issue: 五分の一の加算
  choice: 「その五分の一を上乗せし」とし、基準対象の曖昧さを保つ
  alternative: 「その価額の二十パーセントを加え」と説明的に訳す
  rationale: 原文は接尾辞によって先行する聖なるものを受けるが、価額であることを明示してはいない。「五分の一」を保ち、原文以上の解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法としての義務は「なければならない」で表した。「聖なるもの」を反復して原文の語彙的連関を保ちつつ、「上乗せする」によって加算を自然に表現した。
