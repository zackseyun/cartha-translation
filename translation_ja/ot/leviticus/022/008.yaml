  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: ja
  text: 死んでいた動物、または野獣に引き裂かれた動物[a]を食べて、これによって身を汚してはならない。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自然に死んだものや、野獣に引き裂かれたもの」。
    reason: נְבֵלָהは死骸、特に適切に屠られず自然に死んだ動物を表し得る。また、原文では「動物」に当たる語は明記されず、二つの名詞だけが置かれているため。
lexical_decisions:
- source_word: נְבֵלָה
  choice: 死んでいた動物
  rationale: 適切に屠られず、自然死などによって死骸となった動物を指す。祭司の食物規定という文脈を踏まえ、「死骸」だけよりも意味が明瞭な現代日本語とした。
- source_word: וּטְרֵפָה
  choice: 野獣に裂き殺された動物
  rationale: 捕食獣に襲われ、引き裂かれた動物を指す。ヘブライ語では行為者が明示されないが、語の確立した意味を自然な日本語で表した。
- source_word: לֹא יֹאכַל
  choice: 食べてはならない
  rationale: 否定辞を伴う未完了形が律法文で表す禁止を、明確で格調を保った現代日本語にした。
- source_word: לְטָמְאָה בָהּ
  choice: それによって身を汚してはならない
  rationale: ל を伴う不定詞が示す目的・結果を保ち、食べることで儀礼的に汚れることを表した。「汚す」はレビ記の清浄規定における טמא の用語上のつながりを保つ。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の固有名 יהוה を称号に置き換えず、「ヤハウェ」と音写し、レビ記に反復される契約上の定型句を簡潔に表した。
theological_decisions:
- issue: יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が神の固有名を直接用いているため、その固有名を日本語で音写した。
- issue: טמא の意味領域
  choice: 身を汚す
  alternative: 身を不浄にする
  rationale: ここでの汚れは主として儀礼的な不浄を指すが、本文では原語の簡潔な表現を保ち、特定の神学的説明を付加しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法の禁止としての重みを「〜てはならない」で示した。「わたし」は神の自己宣言にふさわしく平仮名とし、全体を簡潔で品位ある文体に整えた。
