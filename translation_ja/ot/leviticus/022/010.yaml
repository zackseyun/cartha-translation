source:
  edition: WLC
  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: ja
  text: 部外の者はだれも、聖なるもの[a]を食べてはならない。祭司の家に身を寄せる者[b]も、雇われ人も、聖なるものを食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる食物」または「聖別された取り分」とも訳せる。ここで「聖なるもの」とは、聖なるささげ物のうち、祭司が食べるために取り分けられた食物を指す。
    reason: lexical_alternative
  - marker: b
    text: 祭司の家に滞在し、その家に属して暮らす非家族成員を指す。「祭司の寄留者」または「祭司のもとに住む寄留者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: 部外の者
  rationale: ここでは民族的な「外国人」ではなく、聖なる食物を食べる資格を持つ祭司の家に属さない者を指す。「部外の者」は祭儀上の資格がないことを明確にする。
- source_word: קֹדֶשׁ
  choice: 聖なるもの
  rationale: ヘブライ語の単数名詞を保ちつつ、この文脈では祭司のために取り分けられた聖なる食物を指す。具体的な意味は脚注で示す。
- source_word: תּוֹשַׁב כֹּהֵן
  choice: 祭司の家に身を寄せる者
  rationale: 祭司本人ではなく、その家に滞在し、または従属して暮らす非家族成員を表す関係を自然な日本語で示す。外国人という身分までは本文で断定しない。
- source_word: שָׂכִיר
  choice: 雇われ人
  rationale: 賃金を受けて働く者を指す語であり、現代日本語として明瞭で、家族や所有下の僕との区別も保てる。
- source_word: לֹא יֹאכַל
  choice: 食べてはならない
  rationale: 否定辞を伴う未完了形が表す法的禁止を、律法文にふさわしい明瞭な現代日本語で表す。
- source_word: וְכָל
  choice: だれも…ない
  rationale: 後続する禁止と合わせ、ヘブライ語の全称的否定を日本語として自然に表現する。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位ある律法文。「部外の者」で祭儀上の資格外を示し、「祭司の家に身を寄せる者」は原文の関係性を保ちながら、日本語で誤解されにくい表現とした。
