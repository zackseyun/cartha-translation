source:
  edition: WLC
  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: ja
  text: わたしは、あなたがたの神となるために、あなたがたをエジプトの地から導き出した者であり、ヤハウェ[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の音写と伝統的訳語を示すため。
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: 導き出した者
  rationale: ヒフィル分詞に定冠詞が付き、ヤハウェを「導き出す者」として描写する。出エジプトという完了した歴史的行為を自然な現代日本語で表すため、「導き出した者」とした。
- source_word: אֶתְכֶם
  choice: あなたがたを
  rationale: 二人称男性複数接尾辞の複数性を明示した。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 出エジプトの定型表現に含まれる「地」を省略せず、起点を表す מִן を「から」で訳した。
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: あなたがたの神となるために
  rationale: 目的を示す לְ＋不定詞を「ために」、契約的な関係を表す לָכֶם לֵאלֹהִים を自然な所有表現「あなたがたの神」で表した。「となる」は目的として提示された関係への移行を自然に伝える。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 動詞のない自己同定文を日本語の荘重で明瞭な文体にし、固有の神名 יהוה を音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に固有の契約名が明記されているため、称号「主」に置き換えず音写した。一方、伝統的な訳語を脚注で示した。
- issue: לִהְיוֹת のニュアンス
  choice: 神となる
  alternative: 神である
  rationale: 目的を表す不定詞と היה の語義を反映して「となる」とした。ただし、これは神性の開始ではなく、「あなたがたの神」という契約関係を指す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「あなたがた」で原文の複数を示し、出エジプトの定型句と契約的表現を保った。前節から続く分詞句であるため、単独提示でもその構造が見えるよう「者である」とした。
