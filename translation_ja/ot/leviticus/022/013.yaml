id: LEV.22.13
reference: Leviticus 22:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: ja
  text: しかし、祭司の娘がやもめになるか、離婚され、子がなく、若いころのように父の家に戻ったなら、父の食物を食べることができる[a]。ただし、部外者はだれもそれを食べてはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「父のパン」。「パン」はここでは、祭司の家に備えられた食物を広く指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「部外者」は、民族的な意味での外国人とは限らず、祭司の食物を食べることを許された範囲の外にいる者を指す。別訳「資格のない者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן כִּי תִהְיֶה
  choice: しかし、祭司の娘が……なったなら
  rationale: 前節との対比を「しかし」で示し、כִּיを法規上の条件として自然な日本語の「なら」で表した。
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: やもめになるか、離婚され
  rationale: ヘブライ語の接続詞は二つの該当状態を並べているが、双方を同時に満たす意味ではないため、日本語では選択肢を示す「か」とした。「離婚され」は受動分詞の意味を保つ。
- source_word: וְזֶרַע אֵין לָהּ
  choice: 子がなく
  rationale: זֶרַעは直訳では「種」、家族関係では子孫・子を指す。この規定の具体的な条件を明瞭に伝えるため「子」とした。
- source_word: וְשָׁבָה אֶל־בֵּית אָבִיהָ כִּנְעוּרֶיהָ
  choice: 若いころのように父の家に戻ったなら
  rationale: 娘が結婚前と同じように父の家へ復帰するという社会的・法的状況を、過度な解釈を加えず自然に表した。
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: 父の食物を食べることができる
  rationale: לֶחֶםの字義は「パン」だが、ここでは祭司の家に属する食物を広く指し得る。「食べることができる」は法的な許可を表す。字義は脚注に残した。
- source_word: וְכָל־זָר
  choice: ただし、部外者はだれも
  rationale: זָרは民族的な外国人に限定されず、祭司の食物を食べる資格を持つ範囲の外にいる者を指すため、「部外者」とした。
- source_word: לֹא יֹאכַל בּוֹ
  choice: それを食べてはならない
  rationale: 法的禁止を明確に表し、「それ」は直前の父の食物を受ける。
theological_decisions:
- issue: 祭司法における「父のパン」の範囲
  choice: 本文では「父の食物」と訳し、祭司の家で娘が食べることを許される食物を指す表現として保つ。
  alternative: 字義どおり「父のパン」と訳す。
  rationale: レビ記22章の文脈は聖なる食物を食べる資格に関するものだが、この一語だけで対象を必要以上に限定しないよう「食物」とし、字義を脚注で示した。
- issue: זָרが指す者
  choice: 食べる資格を持つ祭司の家の範囲外にいる「部外者」とする。
  alternative: 「外国人」または「よそ者」とする。
  rationale: ここでの区別は民族よりも祭司の食物を食べる資格に関わるため。ただし、具体的に誰が該当するかを本文で追加規定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、法規としての品位を保つ文体とした。「やもめ」は聖書文脈で理解しやすい語として用い、「食べてはならない」で禁止を明確にした。脚注記号[a]と[b]は、それぞれ説明対象である「父の食物」と「部外者」に直接対応させた。
