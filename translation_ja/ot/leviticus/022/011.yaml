  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: ja
  text: しかし、祭司が金を払って人を自分の所有として買った場合[a]、その人は聖なるものを食べてよい。また、祭司の家で生まれた者たちも、祭司の食物[b]を食べてよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「人を、彼の金銭で得た取得物として」。金銭で買い取られ、その所有に属する人を指す。
    reason: lexical_alternative
  - marker: b
    text: 「食物」は直訳では「パン」。ここでは、祭司に割り当てられた食物全般を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: しかし、祭司が……場合
  rationale: 前節の、祭司の寄留者や雇い人は聖なるものを食べられないという規定と対照を成す法的事例として、接続詞を「しかし」、כִּי を条件の「場合」とした。
- source_word: יִקְנֶה נֶפֶשׁ
  choice: 人を……買った
  rationale: נֶפֶשׁ はここでは人間を指し、קנה は後続する金銭取得の表現によって売買による取得を意味する。
- source_word: קִנְיַן כַּסְפּוֹ
  choice: 金を払って……自分の所有として
  rationale: 単に「雇う」などと弱めず、金銭によって取得された所有物という原文の法的・所有的側面を明示した。
- source_word: הוּא יֹאכַל בּוֹ
  choice: その人は聖なるものを食べてよい
  rationale: הוּא は直前の、買われた人を指す。「聖なるもの」は目的語が前節から補われることを明確にし、法文中の未完了形は許可として訳した。
- source_word: וִילִיד בֵּיתוֹ
  choice: 祭司の家で生まれた者たち
  rationale: 家に生まれた従属的な構成員を指す表現であり、後続の複数代名詞と動詞に合わせて集合的複数で訳した。身分を原文以上に限定する語は加えていない。
- source_word: בְלַחְמוֹ
  choice: 祭司の食物を
  rationale: לֶחֶם の字義は「パン」だが、ここでは祭司に割り当てられた食物を広く指す。代名詞の指示対象を日本語で明確にするため「祭司の」とした。
theological_decisions:
- issue: 金銭で取得された人に関する所有表現
  choice: 金を払って人を自分の所有として買った
  alternative: 金で人を買った
  rationale: קִנְיַן כַּסְפּוֹ に含まれる所有権上の意味を隠さず表現した。これは古代の法的身分を記述するものであり、その制度への是認を訳文に加えるものではない。
- issue: הוּא の指示対象
  choice: その人
  alternative: 彼
  rationale: 文脈上、聖なる食物を食べる許可を受けるのは金で買われた人である。日本語の「彼」では祭司を指すとも読めるため、指示対象を明確にした。
translation_notes:
  register: 現代の一般読者に明瞭な、端正な法文調とした。「自分の所有として」によって原文の厳しい所有表現を和らげず、「聖なるもの」「食物」によって直前から続く祭司の食物規定とのつながりを示した。
