  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: ja
  text: あなたがたは、わたしの戒めを守り、それを行いなさい。わたしはヤハウェ[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。正確な古代の発音は確定していないが、ここでは「ヤハウェ」と表記した。
    reason: 神名の訳語と発音上の不確実性を示すため。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守り
  rationale: שׁמרは律法・契約の文脈で、命令を「守る、遵守する」ことを表す。接続詞וּは前文との連続を自然な日本語の流れに含ませ、独立した「そして」は置かなかった。
- source_word: מִצְוֺתַי
  choice: わたしの戒め
  rationale: מִצְוָהは命令・戒めを意味する。「戒め」は律法文としての格調を保ちながら、現代日本語でも明瞭である。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: それを行わなければならない
  rationale: עשהと目的語אֹתָםの具体的な「それらを行う」という表現を保ち、「守る」と「行う」の二動詞を統合しない。日本語では「戒め」を集合的に単数で受け、「それ」とした。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 反復される契約上の自己宣言を明示し、神名יהוהを音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を直接用いていることを可視化するため、「主」に置き換えず「ヤハウェ」とした。ただし正確な古代の発音には不確実性があるため注記した。
- issue: 命令の法的強さ
  choice: 行わなければならない
  alternative: 行いなさい／行う
  rationale: 接続完了形がこの律法文脈で帯びる義務・命令性を明瞭に表した。単なる未来の予告にはしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、律法の命令としての格調を保った。「守る」と「行う」を並べ、原文の強調を保持した。
