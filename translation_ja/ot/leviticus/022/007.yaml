source:
  edition: WLC
  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: ja
  text: 日が沈むと、その人は清くなる。その後、聖なるもの[b]を食べてよい。それは彼の食物[a]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「それは彼のパンである」。ここで「パン」は、聖なる取り分として彼に割り当てられた食物を意味する。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖なる供え物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: 日が沈むと
  rationale: 字義的には「太陽が入る／来る」だが、日没を表すヘブライ語の慣用表現である。接続語の時間的な働きも含め、現代日本語として自然に示した。
- source_word: וְטָהֵר
  choice: その人は清くなる
  rationale: 日没後に祭儀上の汚れた状態が終わることを示す。「清められる」として明示されていない受動の行為者を補わず、状態の変化として訳した。
- source_word: וְאַחַר
  choice: その後
  rationale: 規定された手順の次の段階を簡潔に表す。
- source_word: יֹאכַל
  choice: 食べてよい
  rationale: ここでの未完了形は、清い状態に戻った後に許される行為を表す。「食べるだろう」より法的文脈に適している。
- source_word: מִן הַקֳּדָשִׁים
  choice: 聖なるもの
  rationale: 複数形の語が指す聖別された物を広く保ち、「供え物」と限定しすぎない訳にした。文脈上は祭司に割り当てられた聖なる食物を指す。
- source_word: כִּי
  choice: だからである
  rationale: 直前の許可の理由を示す因果関係を、明瞭な現代日本語で表した。
- source_word: לַחְמוֹ הוּא
  choice: それが彼の食物
  rationale: לֶחֶם の字義は「パン」だが、ここでは生活の糧・食物を広く指す。単数代名詞 הוּא に対応する「それ」を残し、聖なる取り分を集合的に受ける表現とした。
theological_decisions:
- issue: 清さの性質
  choice: 祭儀上の清さを文脈によって示す
  alternative: 道徳的または霊的な清さと明示する
  rationale: レビ記22章は、汚れた状態にあった祭司が聖なる食物を再び食べられる時を扱う。本文は単に「清くなる」とし、道徳的意味を付加せず、祭儀上の意味は文脈に委ねた。
- issue: 「聖なるもの」と「それ」の数の対応
  choice: 「聖なるもの」を集合的に受けて「それ」とする
  alternative: 日本語の自然さを優先して「それら」とする
  rationale: 原文では「聖なるもの」は複数形だが、後続の代名詞と「パン／食物」は単数形である。この数の緊張を消さず、聖なる取り分全体を一つの食物として捉える余地を保った。
translation_notes:
  register: 明瞭で端正な現代標準日本語。「その人」で文脈上の祭司を受け、「食べてよい」によって規定上の許可を自然に表した。原文の簡潔さを保ちつつ、祭儀用語を過度に専門化していない。
