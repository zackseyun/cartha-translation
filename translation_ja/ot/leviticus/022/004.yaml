source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: ja
  text: アロンの子孫に属する男子はだれでも、皮膚の病にかかっているか[a]、分泌物が出ているなら、清くなるまでは聖なるものを食べてはならない。また、死者に関わる汚れたものに触れた者[b]、あるいは精液の放出があった者、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病」とも訳されますが、ヘブライ語は儀礼上の汚れをもたらす皮膚の症状を広く指し、現代のハンセン病に限りません。
    reason: lexical_alternative
  - marker: b
    text: 別訳「死体によって汚れた人に触れた者」。ヘブライ語は、死者に関係する汚れを表す慣用的で解釈の難しい表現です。
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: アロンの子孫である者は誰でも
  rationale: 重ねられた אִישׁ の分配的意味を「誰でも」で表し、文脈上の対象である男性の祭司を、アロンの系統に属する者として自然な日本語で示した。
- source_word: צָרוּעַ
  choice: 皮膚の病にかかっている
  rationale: 儀礼上の汚れをもたらす広範な皮膚症状を指し、現代のハンセン病と同一視しない表現とした。
- source_word: זָב
  choice: 漏出がある
  rationale: 儀礼上の汚れをもたらす身体的な漏出を指す。簡潔で品位ある表現を選んだ。
- source_word: בַּקֳּדָשִׁים
  choice: 聖なるもの
  rationale: 祭司が食べることのできる、聖別された供え物の取り分を指す。原文の複数形を包括的に表した。
- source_word: לֹא יֹאכַל
  choice: 食べてはならない
  rationale: 律法上の禁止を、現代日本語の明確な規定表現で示した。
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: 清くなるまでは
  rationale: 儀礼的に汚れた状態から清い状態へ移ることを表し、道徳的な清さとは区別した。
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: 死者による汚れのあるもの
  rationale: 死者に関係する汚れを表す難解な慣用句について、接触の対象を断定しすぎず、原文の曖昧さを保った。
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: 精液を漏らした者
  rationale: 字義的には「精液の放出が彼から出る男」。自然で明瞭かつ品位ある日本語とした。
theological_decisions:
- issue: 皮膚症状を現代の特定の病名と同一視するか
  choice: 「皮膚の病」とする
  alternative: 「らい病」「重い皮膚病」
  rationale: ここで問題なのは祭司の儀礼的な清さであり、現代医学上のハンセン病や、病状の重さを原文以上に特定しないため。
- issue: טמא נפש の統語的・慣用的な曖昧さ
  choice: 「死者による汚れのあるもの」とし、注で別解を示す
  alternative: 「死体に触れて汚れた人」
  rationale: 原文は死者に由来する汚れを明示する一方、直接の接触対象の捉え方には解釈の余地があるため、その緊張を保持した。
- issue: 清さの性質
  choice: 「清くなる」と訳す
  alternative: 「治る」「清められる」
  rationale: 病気の治癒や道徳的浄化に限定せず、レビ記の儀礼的な状態変化を表すため。
translation_notes:
  register: 現代の一般読者に明瞭な律法文体とし、「食べてはならない」で規定の厳粛さを保った。節末は次節へ続く列挙の途中なので、読点で終えた。専門的な儀礼用語を増やさず、「清い」「汚れ」というレビ記の基本対語を維持した。
