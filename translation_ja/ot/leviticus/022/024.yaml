source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: ja
  text: 睾丸が圧迫されて傷ついたり、押し砕かれたり、引きちぎられたり、切り取られたりしたもの[a]を、ヤハウェに献げてはならない。また、あなたがたの地で、このようなことをしてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は四種類の損傷を列挙している。身体部位は明記されていないが、文脈から「睾丸」を補った。
    reason: 原文で暗黙の身体部位を補っていること、および四つの損傷表現の列挙を明示するため。
lexical_decisions:
- source_word: מָעוּךְ
  choice: 圧迫されて傷ついた
  rationale: 圧力によって損傷した状態を表す受動分詞。次の「押し砕かれた」と区別しつつ、具体的な損傷を自然な日本語で示した。
- source_word: כָתוּת
  choice: 押し砕かれた
  rationale: 打つ、または砕くことによる損傷を表し、前語より強い破壊を示す訳とした。
- source_word: נָתוּק
  choice: 引きちぎられた
  rationale: 引っ張ることによって断ち離された状態を表すため、損傷の仕方が伝わる訳を採った。
- source_word: כָרוּת
  choice: 切り取られた
  rationale: 切断された状態を表す語であり、日本語でも直接的かつ明瞭に訳した。
- source_word: תַקְרִיבוּ
  choice: 献げてはならない
  rationale: 使役形は祭儀の文脈で、供え物として近づける、差し出すことを指す。「献げる」は日本語の祭儀表現として自然である。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名יהוהを固有名として音写し、原文の直接性を保った。
- source_word: בְאַרְצְכֶם
  choice: あなたがたの地で
  rationale: イスラエルに与えられる地を指す表現を、原文に沿って簡潔に訳した。
- source_word: תַעֲשׂוּ
  choice: このようなことをしてはならない
  rationale: 「行う／作る」という広い意味の動詞が目的語なしで用いられているため、直前の行為を受ける「このようなこと」で省略を補い、その範囲を狭く限定しなかった。
- source_word: 四つの受動分詞の暗黙の対象
  choice: 睾丸
  rationale: ヘブライ語では身体部位が明記されないが、文脈上は雄の家畜の生殖器、とりわけ睾丸の損傷を指す。現代日本語で意味を明確にするため補った。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有の神名を明示し、別の称号に置き換えないため。
- issue: 末尾の禁止וּבְאַרְצְכֶם לֹא תַעֲשׂוּの範囲
  choice: そのような損傷を加える行為を中心に指しつつ、「このようなこと」と広く表現する
  alternative: そのような動物を国内で献げることだけを禁じる、または犠牲用にそのような動物を作ることだけを禁じる
  rationale: 「する」は広義で目的語が省略されている。直前の去勢・損傷行為を指す可能性が高いが、訳文では原文以上に範囲を限定しないようにした。
translation_notes:
  register: 明瞭な現代標準語を用い、祭儀上の禁止にふさわしい簡潔で厳粛な文体とした。身体部位は婉曲語を避けて正確に示し、末尾の省略表現は過度に解釈せず保持した。
