id: LEV.22.2
reference: Leviticus 22:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: ja
  text: 「アロンとその子らに告げなさい。彼らは、イスラエルの人々がわたしのために聖別する聖なるもの[b]から身を引き[a]、わたしの聖なる名を汚してはならない。わたしはヤハウェである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「離れる」「関わることを控える」。ここでは、聖なるものとの関わりを慎むことを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの人々がわたしのために聖別する」は、「聖なるもの」を修飾する。
    reason: clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げなさい
  rationale: ピエル命令形による神の指示を、現代日本語として自然でありながら荘重さも保つ表現とした。
- source_word: וְיִנָּזְרוּ
  choice: 身を引き
  rationale: נזר のニファル形が表す、聖なるものとの関わりを控え、そこから離れているという再帰的・実際的な意味を示す。単なる物理的距離に限定しない。
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: イスラエルの人々が……聖別する聖なるものから
  rationale: קָדְשֵׁי の広い祭儀的意味を「聖なるもの」で保ちつつ、属格句と後続の関係節を自然な日本語に組み直した。「供え物」だけに限定する解釈は避けた。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: これは国民全体を指す定型的な民族名称であり、日本語で「イスラエルの息子たち」とすると実子に誤解されやすいため、意味を正確かつ自然に伝えた。
- source_word: יְחַלְּלוּ
  choice: 汚してはならない
  rationale: 聖なるものを俗なものとして扱い、その神聖さを損なう חלל の祭儀的意味を、一般読者に明瞭な日本語で表した。
- source_word: שֵׁם קָדְשִׁי
  choice: わたしの聖なる名
  rationale: ヘブライ語の構文と、神の名の契約的・神学的重みをそのまま保った。
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: イスラエルの人々がわたしのために聖別する
  rationale: 関係節を、その最も自然な先行詞である「聖なるもの」に結び付け、「聖」の語彙的連関も保持した。לִי はここでは受益・帰属を示す「わたしのために」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: 「彼らがわたしのために聖別する」に当たる関係節の先行詞
  choice: 「イスラエルの人々の聖なるもの」を修飾するものとして訳す。
  alternative: 文の流れの上で「わたしの聖なる名」と緩やかに結び付ける読み。
  rationale: 複数主語「彼ら」と、イスラエルが品物を神に聖別するという文脈から、聖なるものを先行詞とするのが文法的・文脈的に最も自然である。日本語では語順を整えてこの関係を明確にした。
- issue: 祭司が聖なるものから離れる命令の範囲
  choice: この節自体では理由や適用条件を補わず、「身を引く」と訳す。
  alternative: 汚れている間は供え物を扱わない、または食べない、と具体化する。
  rationale: 後続文脈は適用条件を説明するが、本節の語句自体はより広い。訳文で先取りして限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の命令にふさわしい簡潔で荘重な調子を保った。「聖なるもの」「聖別する」「聖なる名」によって原文の語彙的連関を示す。引用符は神の直接発話として付した。
