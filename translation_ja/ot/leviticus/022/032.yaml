source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: ja
  text: あなたがたは、わたしの聖なる名を汚してはならない。わたしはイスラエルの民[a]の間で聖なる方とされる[b]。わたしは、あなたがたを聖別するヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子ら」。イスラエルの民を指す定型表現。
    reason: lexical_alternative
  - marker: b
    text: または「聖なる方として示される」「聖なる方としてあがめられる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: 汚してはならない
  rationale: ピエル形が表す、聖なるものを俗なるものとして扱い、その神聖を損なう意味を、現代日本語で自然かつ厳粛に表した。
- source_word: שֵׁם קָדְשִׁי
  choice: わたしの聖なる名
  rationale: 「名」と「聖」の両要素を保ち、自然な日本語の連体表現とした。
- source_word: וְנִקְדַּשְׁתִּי
  choice: わたしは…聖なる者とされる
  rationale: ニファル形の受動的・再帰的な含みを保ち、神が聖なる方として認められ、扱われ、示されるという幅を一つに限定しない表現とした。
- source_word: בְּתוֹךְ
  choice: …の間で
  rationale: 契約共同体のただ中において、という場所的・関係的意味を自然な現代日本語で表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民
  rationale: 字義は「イスラエルの子ら」だが、文脈ではイスラエル共同体全体を指す定型句であるため、指示対象が明瞭な現代日本語とし、字義は脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神の固有名を音写した。
- source_word: מְקַדִּשְׁכֶם
  choice: あなたがたを聖別する
  rationale: 分詞の継続的・特徴的な働きを表しつつ、同節の「聖」との語根上のつながりを日本語でも保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文にある契約の固有名を称号で代替せず、一般的な学術的音写で示した。
- issue: וְנִקְדַּשְׁתִּי の態と意味
  choice: 聖なる者とされる
  alternative: 聖なる者として示される／聖なる者としてあがめられる
  rationale: 神の本質が新たに聖化されるという意味に狭めず、人々の間でその聖性が認められ、扱われ、現されるという受動・再帰の緊張を保った。
- issue: בְּנֵי יִשְׂרָאֵל の代表的用法
  choice: イスラエルの民
  alternative: イスラエルの子ら
  rationale: 文法上は男性複数だが、ここでは契約共同体全体を指す定型表現である。本文では自然で包括的な指示対象を示し、形態上の字義を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔で厳粛な調子を保った。「汚す」「聖別する」により聖性に関する語彙の連関を示し、神名は「ヤハウェ」とした。
