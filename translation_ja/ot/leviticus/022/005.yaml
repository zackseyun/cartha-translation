source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: ja
  text: または、どのような群がる小動物であれ、それに触れて汚れを受ける者、あるいは、どのような汚れを帯びている人であれ、その人に触れて汚れを受ける者、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ אִישׁ אֲשֶׁר יִגַּע
  choice: また、…触れた者
  rationale: 前節から続く選言を「また」で自然に示す。אִישׁ は男性単数形だが、祭司についての法的列挙の中で該当者を指すため、日本語では「者」とした。
- source_word: בְּכָל שֶׁרֶץ
  choice: どのような群がる小動物にでも
  rationale: שֶׁרֶץ は群がる、または地面近くを這う小さな生き物の祭儀的分類を指す。特定の動物群に狭めず、「群がる小動物」とした。
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: 身を汚す
  rationale: 接触によって祭儀上汚れた状態になることを簡潔に表す。道徳的罪悪を意味する表現にはしない。
- source_word: בְאָדָם
  choice: 人に触れた
  rationale: אָדָם はここでは汚れの原因となりうる人間を一般的に指す。前の יִגַּע を補って、日本語として明瞭にした。
- source_word: לְכֹל טֻמְאָתוֹ
  choice: どのような汚れであれ
  rationale: 人が帯びる汚れの種類を限定しない句として訳し、誰の汚れかを過度に明示せず原文の簡潔さを保った。
theological_decisions:
- issue: טמא／טֻמְאָה の性質
  choice: 「身を汚す／汚れ」と訳し、祭儀上の状態を表す
  alternative: 「不浄になる／不浄」
  rationale: 文脈は祭司の清浄規定であり、道徳的な罪を直接示すものではない。「汚れ」は日本語聖書として自然で、動詞と名詞の語根上のつながりもある程度保てる。
- issue: 末尾の代名詞 טֻמְאָתוֹ の指示対象
  choice: 「どのような汚れであれ」とし、文脈上は接触される人の汚れとして読める形を保つ
  alternative: 「その人が帯びているどのような汚れによってでも」
  rationale: 原文は男性単数代名詞を用いるが、日本語で明示しすぎると原文以上に解釈を固定するため、自然な範囲で曖昧さを残した。
translation_notes:
  register: レビ記の法規としての簡潔で格調ある調子を保ちつつ、現代日本語で理解しやすい語順にした。本節は次節へ続く列挙の一部なので、文末を読点とした。
