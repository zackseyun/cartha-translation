id: LEV.22.6
reference: Leviticus 22:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: ja
  text: それに触れた者は、夕方まで汚れている。その者は、水で体[b]を洗わないかぎり、聖なるもの[a]を食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる供え物」または「聖別されたもの」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「自分の肉を水で洗う」。ここで「肉」は体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 者
  rationale: 祭儀規定においては、非物質的な「魂」ではなく個々の人を指す。「者」は単数の法的主体を簡潔に表す。
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: それに触れた
  rationale: 動詞の女性形は、文法上女性名詞である נֶפֶשׁ に一致するもので、生物学的性別を示さない。接尾代名詞の指示対象は前節にある汚れの原因であり、人に限定しない「それ」とした。
- source_word: וְטָמְאָה
  choice: 汚れている
  rationale: 接触の結果として生じる祭儀上の状態を表す。道徳的な罪悪を意味する語を加えず、文脈に即した定型的な表現とした。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 祭儀上の汚れが続く期限を、自然な現代日本語で示す。
- source_word: וְלֹא יֹאכַל
  choice: 食べてはならない
  rationale: 法規文脈における禁止を、明確で格調を保った現代日本語で表した。
- source_word: מִן הַקֳּדָשִׁים
  choice: 聖なるもの
  rationale: 複数形は聖別され、食用として扱われる物を指す。文脈を限定しすぎない訳を本文に置き、具体的な語義の可能性を脚注に示した。
- source_word: כִּי אִם
  choice: 洗わないかぎり
  rationale: 食べるために満たすべき条件を導く慣用句であり、日本語では否定条件「ないかぎり」が自然である。
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: 水で体を洗う
  rationale: בָּשָׂר の直訳は「肉」だが、ここでは身体全体を指す。「体」は明瞭な現代日本語であり、直訳は脚注に残した。
theological_decisions:
- issue: 「汚れ」の性質
  choice: 祭儀上の汚れを表す語として「汚れている」と訳す
  alternative: 道徳的な罪または不浄と明示する
  rationale: この節は接触によって生じる状態、聖なるものを食べる資格、および水洗いを扱う。本文にない道徳的罪責を読み込まず、祭儀的文脈を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。法規としての禁止を「食べてはならない」で示し、性別を不必要に限定しない「者」を用いた。脚注記号は対応する語の直後に置いた。
