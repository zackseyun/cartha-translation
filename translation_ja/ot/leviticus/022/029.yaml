  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: ja
  text: また、あなたがたがヤハウェに感謝のいけにえ[a]を献げるときは、それを、あなたがたのために受け入れられるように献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「感謝のささげ物」「感謝の犠牲」。
    reason: זֶבַח תּוֹדָה は、感謝を伴う犠牲または感謝を表すための犠牲を意味し、複数の自然な訳し方が可能である。
lexical_decisions:
- source_word: וְ/כִי
  choice: また、……ときは
  rationale: 祭儀規定の流れをつなぎつつ、法文における条件的・時間的な意味を自然な現代日本語で表す。
- source_word: תִזְבְּחוּ
  choice: 献げる
  rationale: זבח は犠牲を屠って供える行為を指すが、日本語では祭儀的文脈に自然な「献げる」が最適である。
- source_word: זֶבַח תּוֹדָה
  choice: 感謝のいけにえ
  rationale: 感謝を特徴とする特定の犠牲祭を示す構文を、明瞭で定着した日本語として表す。
- source_word: לַ/יהוָה
  choice: ヤハウェに
  rationale: 前置詞 ל の献呈先を「に」で示し、神名 יהוה は固有名として「ヤハウェ」と音写する。
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: 受け入れられるように
  rationale: 祭儀的文脈の רָצוֹן は献げ物が神に受納されることを表す。「あなたがたの意志どおりに」ではなく、受納という意味を自然に示す。
- source_word: תִּזְבָּחוּ
  choice: それを献げなければならない
  rationale: 原文で反復される犠牲動詞を訳文でも保ち、法的命令を「なければならない」で明確にする。「それ」は感謝のいけにえを受ける。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の契約名を訳文でも明示し、一般名詞・称号への置換を避ける。
- issue: לִרְצֹנְכֶם の受納主体と意味
  choice: 受け入れられるように
  alternative: あなたがたの意志どおりに／あなたがたが受け入れられるために
  rationale: 犠牲祭規定における語義として神による受納を中心に据える。一方、ヘブライ語は「あなたがたのための受納」という簡潔な表現で、献げ物と献げる者のどちらに重心があるかを完全には明示しないため、過度な説明は避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法としての品位と命令の強さを保った。「いけにえ」は一般読者にも通じる表記とし、神名は「ヤハウェ」とした。
