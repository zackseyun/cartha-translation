id: LEV.22.15
reference: Leviticus 22:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: ja
  text: 彼らは、イスラエルの子らがヤハウェにささげる[b]聖なるもの[a]を汚してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエルの子らの聖なるささげ物」。
    reason: קָדְשֵׁי は広く「聖なるもの」を意味するが、この文脈ではイスラエルが奉献する物を指す。
  - marker: b
    text: 直訳では「高く上げる」。文脈では、神に奉献することをいう。
    reason: רוםのヒフィル形がもつ具体的な「上げる」と、祭儀文脈での「奉献する」の意味を示すため。
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: 汚してはならない
  rationale: ピエル形は祭儀的文脈で、聖なるものを俗なものとして扱い、その聖性を損なうことを表す。「冒瀆する」より平明でありながら、聖と俗の対比を保つ。
- source_word: קָדְשֵׁי
  choice: 聖なるもの
  rationale: 直訳的な複数表現を保ち、「聖なるささげ物」と限定しすぎない。文脈上はイスラエルが奉献する物を指す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 契約共同体を指す定型的な民族呼称を、原文の形に沿って訳した。
- source_word: אֲשֶׁר יָרִימוּ
  choice: が…ささげる
  rationale: רוםのヒフィル形は奉献物を高く上げる、または神に差し出すことを意味する。日本語本文では祭儀的意味が自然に伝わる「ささげる」とし、具体的な原義を脚注に示す。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 原文の固有名 יהוה を、契約の神名として音写した。
- source_word: וְלֹא
  choice: …てはならない
  rationale: 祭儀法における否定未完了形を、現代日本語の明確な禁止表現で訳した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に明記された契約の固有名を保持し、一般称号へ置き換えない。
- issue: 「彼らは」が指す主体
  choice: 直前の文脈にいる祭司たちを受ける表現
  alternative: イスラエルの子らを主体として読む
  rationale: この節だけでは主語が明示されないが、22:9以降、とりわけ22:14の祭司に関する規定の流れでは、冒頭の「彼ら」は祭司たちを指すと読むのが自然である。曖昧さは脚注で明示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。祭儀用語を過度に専門化せず、「聖なるもの」「汚す」「ささげる」によってレビ記の聖性の主題を伝えた。
