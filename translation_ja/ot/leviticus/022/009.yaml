id: LEV.22.9
reference: Leviticus 22:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: ja
  text: 彼らはわたしの務めを守り、それを汚してそのために罪を負い、死ぬことがないようにしなければならない[a][b][c]。わたしはヤハウェ、彼らを聖なる者とする[d]者である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪責を負い」とも訳せる。ヘブライ語の慣用表現は、罪の責任を負うこと、または罪責を招くことを表す。
    reason: lexical_alternative
  - marker: b
    text: または「そのために死ぬ」。死が何に起因するかは、ヘブライ語では単数代名詞で示されている。
    reason: lexical_alternative
  - marker: c
    text: 「それを汚す」は、または「それを俗なるものとして扱う」。
    reason: lexical_alternative
  - marker: d
    text: または「彼らを聖別する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: わたしから託された務めを守り
  rationale: מִשְׁמֶרֶת は祭司に委ねられた守るべき務め・責任を指す。「託された務め」とすることで、単なる規則ではなく委託された責務という含意を自然な日本語で示した。
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: そのために罪を負い
  rationale: נשׂא חטא の「罪を負う／罪責を負う」という慣用表現を保ち、עָלָיו は指示対象を限定せず「そのために」とした。
- source_word: וּמֵתוּ בוֹ
  choice: 死ぬことのないようにしなければならない
  rationale: 前の否定辞が死にも及ぶ構文として訳した。בוֹ の因果的な結びつきは文脈と脚注で示し、日本語本文では不自然な直訳を避けた。
- source_word: יְחַלְּלֻהוּ
  choice: それを聖なるものとして扱わず
  rationale: חלל の中心的な対立である「聖なるものを俗なるものとして扱う」を平明に表した。「汚す」だけでは儀礼的不浄の意味に狭く受け取られる可能性がある。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
- source_word: מְקַדְּשָׁם
  choice: 彼らを聖なる者とする
  rationale: קדשׁ の使役的意味を一般読者にも分かる現代日本語で表した。「聖別する」より明瞭でありつつ、ヤハウェが彼らを聖なるものとするという神学的主語を保つ。
theological_decisions:
- issue: 「そのために／それ」の指示対象
  choice: 単数代名詞に対応する「それ」「そのために」を用い、指示対象を特定しない。
  alternative: 直前の「託された務め」、または文脈上の聖なる食物・聖なるものを明示する。
  rationale: ヘブライ語本文は単数代名詞を用いるだけで名詞を反復していない。祭司の務めと聖なるものの双方が文脈にあるため、日本語でも曖昧さを保持した。
- issue: 否定辞と死の関係
  choice: 「罪を負い、死ぬことのないように」とし、否定を両方の動詞に及ぼす。
  alternative: 「罪を負わず、それによって死ぬ」と逐語的に並べる。
  rationale: וְלֹא が後続する並列動詞 וּמֵתוּ にも及ぶ警告構文として理解し、意味が誤解されない自然な日本語にした。
- issue: ヤハウェによる聖化
  choice: 「彼らを聖なる者とする者」と訳す。
  alternative: 「彼らを聖別する者」「彼らを聖める者」。
  rationale: 祭司の聖性が彼ら自身の達成ではなく、ヤハウェの働きによることを明示しつつ、特定の教派用語に寄せない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭司法としての厳粛さは「守り」「罪を負い」「聖なる者とする」で保った。代名詞の指示対象は原文どおり限定せず、専門的な宗教語は必要最小限にした。
