  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: ja
  text: 欠陥のあるものは、どれも献げてはならない。それは、あなたがたのために受け入れられないからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのために受け入れられるものとはならない」。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: 傷のあるものは、どれも
  rationale: 「その中に傷があるすべてのもの」という包括的な表現。自然な日本語で、例外のない禁止を明確にした。文脈上は犠牲として献げる動物を指すが、原文にない「動物」は本文に補わなかった。
- source_word: מוּם
  choice: 傷
  rationale: 祭儀上、献げ物として不適格にする身体的な欠陥を表す。「欠陥」より具体的で、現代日本語としても分かりやすい。
- source_word: לֹא תַקְרִיבוּ
  choice: 献げてはならない
  rationale: קרב のヒフィル形は祭儀文脈で、献げ物として近づける、差し出すことを意味する。「献げる」はこの文脈を簡潔かつ自然に伝える。
- source_word: כִּי
  choice: からである
  rationale: 前の禁止の理由を導く接続詞として訳した。
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: あなたがたのために受け入れられることはない
  rationale: לְרָצוֹן の祭儀上の「好意をもって受容されること」と、לָכֶם の受益・代理的な含みを保った。
theological_decisions:
- issue: 祭儀における受容の表現
  choice: あなたがたのために受け入れられることはない
  alternative: あなたがたに代わって受け入れられるものとはならない／あなたがたのために受け入れられるものとはならない
  rationale: 原文は単なる規格上の「適格性」だけでなく、献げ物が献げる者のために好意をもって受容されるかを述べる。代理性を過度に確定せず、「あなたがたのために」によって לָכֶם の幅を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「献げる」は祭儀文脈を示す表記とし、原文の法的な断定調を「てはならない」「からである」で表した。
