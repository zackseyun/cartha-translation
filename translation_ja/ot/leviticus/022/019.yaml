  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: ja
  text: あなたがたが受け入れられるためには、牛、羊、または山羊のうち、傷のない雄でなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: あなたがたが受け入れられるためには
  rationale: 祭げ物が礼拝者のために神に受け入れられるという文脈上の目的を、自然な日本語で表した。
- source_word: תָּמִים
  choice: 傷のない
  rationale: いけにえとなる動物に身体上の欠陥がないことを指す祭儀的用法を明確に表す。単なる健康状態を示す「健全な」より、この文脈に適する。
- source_word: זָכָר
  choice: 雄
  rationale: 動物の性別を簡潔かつ正確に示す。
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: 牛、羊、または山羊のうち
  rationale: 三種の家畜を供え物の選択肢として自然に列挙した。כְּשָׂבִים はここでは羊を指す。
theological_decisions:
- issue: לִרְצֹנְכֶם が示す受容の対象と関係
  choice: あなたがたが受け入れられるためには
  alternative: あなたがたに受け入れられるものとなるためには／自発的に
  rationale: 直前節のささげ物の規定に照らし、礼拝者が神の前で受け入れられるため、という祭儀的意味を採った。「自発的に」は רצון の別用法を反映し得るが、この構文と文脈では受納の意味がより妥当である。
translation_notes:
  register: 明快で格調を保った現代標準日本語。ヘブライ語の簡潔な命令的規定を、日本語では「～でなければならない」によって自然に表現した。
