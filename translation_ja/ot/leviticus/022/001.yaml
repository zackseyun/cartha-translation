  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセに語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（יהוה）。伝統的には「主」と訳される。古代の正確な発音は確定していないが、ここでは慣用的な推定形「ヤハウェ」とした。
    reason: 神名の原語表記、伝統的訳語、および発音上の不確実性を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 新しい神の発言を導入する定型表現。日本語では、後続する発言内容への導入として「語って言った」より自然で、荘重さも保てる「告げた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名יהוהを慣用的な推定発音で音写した。発音には不確実性があるため注記を付した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 前置詞אֶלは発話の相手を示すので、現代日本語で自然な「に」とした。מֹשֶׁהは定着した表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 後続する直接話法を導く定型的な不定詞である。「言って」と重ねると日本語では冗長になるため、「告げた」にその機能を含ませた。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／ヤハヴェ／エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、その点を見える形で保った。ただし古代の正確な発音は確定できないので、「ヤハウェ」が慣用的な推定形であることを脚注で明示した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。ヘブライ語の発言導入句を逐語的に重ねず、日本語として自然な聖書的叙述「告げた」にまとめた。
