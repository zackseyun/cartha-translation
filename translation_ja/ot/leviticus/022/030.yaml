  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: ja
  text: それはその日のうちに食べなければならない[a]。朝まで何一つ残してはならない。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その日に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: その日のうちに
  rationale: 字義的には「その日に」。いけにえを翌朝まで残してはならないという文脈上、同じ日のうちに食べるという時間的制限を、自然な現代日本語で明確に表す。
- source_word: יֵאָכֵל
  choice: 食べなければならない
  rationale: אכלのニファル未完了形で、ここでは受動・非人称的な規定を表す。日本語で「食べられなければならない」とすると不自然なため、義務を示す自然な規定文とした。
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: 何一つ残してはならない
  rationale: יתרのヒフィルは「残しておく」の意。מִמֶּנּוּが示す「その一部も」を「何一つ」によって簡潔に表し、禁止の強さを保った。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 翌朝に至るまで残すことを禁じる標準的な時間表現として、簡潔で自然な訳語を採用した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 動詞のない自己宣言の定型句を日本語の叙述文として表し、神名יהוהは普通名詞的な称号に置き換えず「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は契約の神名יהוהを明記しているため、その固有名としての性格を保持する音写を採用した。
translation_notes:
  register: 祭儀規定にふさわしい明確で端正な文体としつつ、現代の一般読者に自然な「食べなければならない」「残してはならない」を用いた。原文の受動・非人称構文は、日本語での不自然さを避けて義務表現にした。
