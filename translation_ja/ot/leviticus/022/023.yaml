source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: ja
  text: しかし、牛または羊で、肢が長すぎるものや短すぎるものは、自発のささげ物[a]とすることはできるが、誓願のささげ物としては受け入れられない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「体の一部が不釣り合いに大きいものや小さいもの」。ヘブライ語の二語は、互いに反対の身体的不釣り合いを表すと考えられるが、正確な意味は確定しにくい。
    reason: 語義上の別訳と不確実性を示すため。
lexical_decisions:
- source_word: וְשׁוֹר
  choice: 牛
  rationale: שׁוֹרは牛類の一頭を指す。祭儀規定として自然で、性別を不必要に限定しない「牛」とした。
- source_word: וָשֶׂה
  choice: 羊
  rationale: שֶׂהは羊または山羊を含み得る群れの小家畜を指すが、ここでは牛と対になる慣用的で簡潔な表現として「羊」とした。
- source_word: שָׂרוּעַ וְקָלוּט
  choice: 肢が長すぎるものや短すぎるもの
  rationale: 二語は身体の一部が伸びすぎた状態と縮んだ状態という、互いに反対の不均衡を表す可能性が高い。具体的な意味を本文に示しつつ、不確実性は脚注に残した。
- source_word: נְדָבָה
  choice: 自発のささげ物
  rationale: 義務としてではなく、自ら進んで献げる供え物を指す。「自発のささげ物」は現代日本語で意味が明瞭である。
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: とすることはできる
  rationale: 直訳は「それを作る／行う」だが、祭儀文脈では、その動物を所定のささげ物とすることを表す。許容を示す構文として自然に訳した。
- source_word: וּלְנֵדֶר
  choice: 誓願のささげ物としては
  rationale: נֵדֶרは誓願に伴う拘束的な献げ物を指す。自発のささげ物との対照が明確になるよう訳した。
- source_word: לֹא יֵרָצֶה
  choice: 受け入れられない
  rationale: 祭儀文脈におけるרצהのニファル形は、好意をもって受納されることを意味する。受け入れる主体を本文で補わず、ヘブライ語の含みを保った。
theological_decisions:
- issue: שָׂרוּעַとקָלוּטが表す欠陥の性質
  choice: 肢が長すぎるものや短すぎるもの
  alternative: 体が不均衡なものや発育不全のもの
  rationale: 対になった語は、身体部位の伸長と収縮という反対方向の不釣り合いを表す可能性が高い。ただし正確な解剖学的意味には不確実性があるため、別の広い理解を脚注に示した。
- issue: 「受け入れられない」の主体
  choice: 主体を明示しない
  alternative: 主に受け入れられない
  rationale: 文脈上は神による祭儀的受納を指すが、原文には主体が明示されていないため、本文では補足しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献げ物」より常用的に読みやすい「ささげ物」を用い、「誓願」は祭儀上の専門性を保つため維持した。
