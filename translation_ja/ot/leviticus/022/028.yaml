id: LEV.22.28
reference: Leviticus 22:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: ja
  text: 牛であれ、羊または山羊であれ[a]、その動物とその子[b]を同じ日に屠ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊または山羊」に当たるヘブライ語は、羊か山羊のいずれか一頭を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では字義的に「それとその息子」。ここでは動物とその子を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 牛科の家畜を指す。性別を不必要に限定する「雄牛」よりも、法文として包括的な「牛」が適切である。
- source_word: שֶׂה
  choice: 羊または山羊
  rationale: 群れに属する小家畜一頭を指し、文脈によって羊にも山羊にもなり得る。原語の範囲を保つため、両方を明示した。
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: その動物とその子
  rationale: 原文の個体とその子という関係を自然な日本語で示しつつ、最初の動物を母親と断定しないようにした。
- source_word: תִשְׁחֲטוּ
  choice: 屠ってはならない
  rationale: שׁחט は食用または犠牲として動物を屠ることを表す。「殺す」より原語の専門的な意味に近い。
- source_word: בְּיוֹם אֶחָד
  choice: 同じ日に
  rationale: 字義的には「一日のうちに」だが、この禁止規定では二頭を同一日に屠ることを禁じる意味であり、現代日本語では「同じ日に」が明確で自然である。
- source_word: וְשׁוֹר אוֹ שֶׂה
  choice: 牛であれ、羊または山羊であれ
  rationale: 冒頭の接続詞と אוֹ の選択関係を、日本語の法文として自然な「～であれ」で表した。
theological_decisions:
- issue: 最初の動物の性別・親子関係
  choice: 「その動物とその子」とし、母親とは明記しない
  alternative: 「母親とその子」
  rationale: 原文は字義的に「それとその息子」であり、この節自体は最初の個体を明示的に雌または母親と呼んでいないため、性別を補わず曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法的禁止を「～てはならない」で表し、原文にない母獣という限定は避けた。
