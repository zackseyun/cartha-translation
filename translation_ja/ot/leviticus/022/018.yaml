reference: Leviticus 22:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: ja
  text: 「アロンとその子ら、またイスラエルのすべての人々[a]に告げ、彼らに言いなさい。イスラエルの家に属する者、またはイスラエルに寄留する者[b]で、あらゆる誓願や自発のささげ物のために[c]、ヤハウェに焼き尽くす供え物として自分の供え物を献げる者は、だれでも、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「イスラエルのすべての子ら」。ここではイスラエルの民全体を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「寄留する者」は、イスラエルの共同体の中に居住する非イスラエル人を指す。
    reason: lexical_alternative
  - marker: c
    text: または「誓願の供え物と自発の供え物として」。ヘブライ語は、誓願・自発の供え物そのものを指すとも、それらのために献げることを指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げ
  rationale: 祭儀法規を導入するピエル命令形の厳粛さを保ちつつ、現代日本語として自然な表現とした。
- source_word: בָּנָיו
  choice: その子ら
  rationale: 祭司職にあるアロンの息子たちを指す男性複数形を反映した。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルのすべての人々
  rationale: 直訳的な「イスラエルのすべての息子たち」は日本語では不自然で範囲を狭く誤解されうるため、民族共同体全体を表すヘブライ語の慣用句として訳した。
- source_word: אִישׁ אִישׁ
  choice: だれでも
  rationale: 語の反復が表す分配的・包括的な意味を、自然な法令文の日本語で示した。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: イスラエルの家の者
  rationale: 契約共同体を表す「家」という比喩を保持した。
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: イスラエルに寄留している者
  rationale: גֵּרが共同体の中に居住する非イスラエル人を指す法的・社会的含意を「寄留」で表した。
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: 自分の供え物を…献げる
  rationale: קרבのヒフィル形の祭儀的意味と、קָרְבָּןの一般的な供え物という意味を、重複を避けた自然な日本語で表した。
- source_word: לְכָל נִדְרֵיהֶם
  choice: 誓願のささげ物として
  rationale: 文脈上、単なる誓願そのものではなく、それに伴う供え物を指すことを明瞭にした。
- source_word: נִדְבוֹתָם
  choice: 自発のささげ物
  rationale: 義務ではなく自由な意思によって献げる祭儀上の区分を表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 原文に記された神の固有名יהוהを音写して保持した。
- source_word: לְעֹלָה
  choice: 焼き尽くすささげ物として
  rationale: 全体を祭壇で焼くעֹלָהの祭儀的性格が一般読者にも伝わる表現とした。
theological_decisions:
- issue: אִישׁ אִישׁの男性形と適用範囲
  choice: だれでも
  alternative: 男はだれでも
  rationale: ここでの反復表現は法文における分配的な「各人、だれでも」を表す。日本語で「男」と限定すると、原文が意図する代表的・包括的用法以上の性別限定を生じさせるため避けた。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 固有名として示された契約の神の名を普通名詞に置き換えず、音写で示した。
- issue: נדריםが誓願そのものか誓願に伴う供え物か
  choice: 誓願のささげ物
  alternative: 彼らのあらゆる誓願のために
  rationale: קרבן、נדבות、עלהという祭儀的文脈から、誓願に伴って献げる供え物を指すと理解した。ただし、前置詞לを「誓願のために」と取る余地はある。
translation_notes:
  register: レビ記の法令としての厳粛さを保ちながら、現代の一般読者に明瞭な標準語とした。原文が次節へ続く未完の構文なので、訳文も読点で終えて連続性を示した。
