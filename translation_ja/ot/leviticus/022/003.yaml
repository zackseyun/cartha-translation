id: LEV.22.3
reference: Leviticus 22:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: ja
  text: 彼らに告げなさい。あなたがたの代々にわたって、あなたがたの子孫のうちの男で、儀礼上の汚れを帯びたまま、イスラエルの子らがヤハウェのために聖別する聖なるものに近づく者はだれでも、その者はわたしの前から断たれる[a]。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「断たれる」は契約上の刑罰を表す定型句。その具体的な形が死、共同体からの排除、または別の裁きのいずれを指すかについては議論がある。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: 彼らにこう告げなさい
  rationale: モーセに対する単数命令を、明瞭で dignified な現代日本語の法令導入句として訳した。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたって
  rationale: 規定が後続の各世代にも継続して適用されることを表す契約・法令上の定型句として自然に訳した。
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: あなたがたの子孫のうち、だれであれ…者
  rationale: 文脈上は祭司家系の男子を指すが、日本語では「だれであれ…者」が איש の法令的な不定表現と子孫関係を明確に伝える。
- source_word: יִקְרַב
  choice: 近づく
  rationale: 祭儀的文脈における空間的・儀礼的な接近という קרב の幅を保ち、「食べる」などに限定しなかった。
- source_word: הַקֳּדָשִׁים
  choice: 聖なるもの
  rationale: 奉献物・供え物を含み得る広い複数表現であり、原文以上に対象を限定しない。
- source_word: יַקְדִּישׁוּ
  choice: 聖別する
  rationale: קדשׁ のヒフィルが示す、聖なるものとして取り分ける祭儀的意味を保持した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の定型的民族呼称を比較的形式に即して残した。
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: 身に汚れがあるまま
  rationale: 直訳的な「彼の汚れが彼の上にある」の状態像を、自然な日本語で保った。単なる道徳的な「汚い」ではなく、儀礼上の汚れを表す。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: その者は…断たれる
  rationale: נפש を法令文脈の「者」とし、כרת の受動的な刑罰定型句は、具体的な執行方法を決めつけず「断たれる」とした。
- source_word: מִלְּפָנַי
  choice: わたしの前から
  rationale: 神の臨在・面前からという空間的かつ関係的な表現を保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文の固有の神名を音写し、一般名詞的な称号に置き換えなかった。
theological_decisions:
- issue: 「断たれる」（וְנִכְרְתָה）の刑罰内容
  choice: 具体的な仕組みを特定せず「断たれる」と訳す
  alternative: 死刑に処せられる／共同体から追放される／契約共同体から除かれる
  rationale: この定型句の厳密な執行形態は議論があり、本文自体はそれを限定していないため、神学的・法的な緊張を保持した。
- issue: מִלְּפָנַי の意味合い
  choice: わたしの前から
  alternative: わたしの臨在から
  rationale: 「顔・面前」を基礎とする原文を保ちつつ、「臨在」という解釈語だけに固定しなかった。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: シナイ契約における固有の神名として本文中に明示し、称号への置換を避けた。
translation_notes:
  register: 祭司法令にふさわしい簡潔で厳粛な文体としつつ、現代の一般読者にも理解できる語順にした。「聖別」「聖なるもの」「汚れ」は祭儀的な語彙として統一し、道徳的な汚れとの混同をできるだけ避けた。
