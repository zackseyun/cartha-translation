id: LEV.22.22
reference: Leviticus 22:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: ja
  text: 目の見えないもの、骨折したもの、体の一部を切られたもの、また、いぼ、かさぶた、皮膚病のあるもの——これらをヤハウェに献げてはならない。また、そのどれも、火によるささげ物[a]としてヤハウェの祭壇に置いてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食物のささげ物」とも訳せる。
    reason: ヘブライ語אִשֶּׁהは、火で献げる供え物を指すとも、祭壇に供される食物のささげ物を指すとも理解されるため。
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: 目の見えないもの
  rationale: 犠牲動物の欠陥を表す語。現代日本語で自然かつ明確に、視覚を失った動物を指す表現とした。
- source_word: שָׁבוּר
  choice: 骨折したもの
  rationale: 受動分詞で、身体の一部が折れている状態を表す。単なる負傷より具体的な「骨折」を採用した。
- source_word: חָרוּץ
  choice: 体の一部を切られたもの
  rationale: 切る、裂くという意味に由来し、身体が切損している欠陥を指す。特定の部位を断定せず、深刻な身体的損傷を明確にした。
- source_word: יַבֶּלֶת
  choice: いぼ
  rationale: 皮膚の異常な隆起を表す語として、一般読者に分かりやすい現代語を用いた。
- source_word: גָרָב
  choice: かさぶた
  rationale: 具体的な皮膚疾患ないし皮膚症状を指す語。病名を過度に限定せず、目に見える症状として訳した。
- source_word: יַלֶּפֶת
  choice: 皮膚病
  rationale: 具体的な皮膚疾患の同定は不確かであるため、湿疹などに限定せず広い表現とした。
- source_word: תַקְרִיבוּ
  choice: 献げてはならない
  rationale: ヒフィル形の祭儀的用法は、供え物を神の前に差し出すことを表す。「献げる」が日本語の文脈で自然である。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 火と結びついた祭儀用語であることを直接示す訳を本文に採用した。ただし「食物のささげ物」と理解する余地を脚注に残した。
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: そのどれも、祭壇に置いてはならない
  rationale: מֵהֶםの部分・分配的な意味を「そのどれも」で表し、祭壇上に置くという具体的な禁止を自然な日本語にした。
- source_word: לַיהוָה
  choice: ヤハウェに／ヤハウェの
  rationale: 固有の神名יהוהを音写し、前置詞לは各文脈に応じて献げる相手と祭壇の帰属を自然な日本語で示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有名יהוהが明記されているため、その固有名としての性格を保つ一般的な学術的音写を用いた。
- issue: 祭儀用語אִשֶּׁהの訳
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 語は火で処理される供え物との関連を持つ一方、祭壇に供される神への食物という機能を強調する理解もある。本文では形態的・伝統的な火との関連を示し、別の有力な理解を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀規定にふさわしい簡潔で重みのある文体とした。原文どおり欠陥の一覧を先に置き、指示語「これら」で受けた。皮膚症状の古代医学的な同定には不確実性があるため、過度に専門的・限定的な病名を避けた。
