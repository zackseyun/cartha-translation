id: LEV.22.12
reference: Leviticus 22:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: ja
  text: しかし、祭司の娘が祭司の家の外の男の妻となったなら[a]、聖なる供え物の一部を食べてはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「よそ者の男に（嫁ぐ）なら」。ここでの「よそ者」は必ずしも外国人を意味せず、祭司の家および聖なる食物を受ける資格の外にいる者を指す。別訳「非祭司の男と結婚したなら」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「聖なるものの奉納分」。別訳「聖なる奉納物を」「聖なる贈り物を」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: しかし、祭司の娘が
  rationale: וְ は前節との対照を示すため「しかし」とし、構文上の属格関係を自然な日本語で「祭司の娘」とした。
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: 祭司の家に属さない男の妻となったなら
  rationale: כִּי と היה はここでは身分の変化を伴う条件を表す。זָר は民族的な外国人ではなく、祭司の家とその聖なる食物を受ける資格の外にいる者を指すため、この文脈を明示した。לְאִישׁ は婚姻関係として自然に訳した。
- source_word: הִוא
  choice: （娘を主語として継続）
  rationale: 独立代名詞による主語の再提示は、日本語では同じ主語を自然に継続させることで表した。
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: 聖なるもののうち奉納された分を
  rationale: תְּרוּמָה の、取り分けてささげられた分という意味と、הַקֳּדָשִׁים の広い複数概念を保った。日本語の「食べる」に合わせ、בְּ は目的語として表現した。
- source_word: לֹא תֹאכֵל
  choice: 食べてはならない
  rationale: 祭儀法における否定命令の規範的な力を、明瞭で現代的な禁止表現によって示した。
theological_decisions:
- issue: 祭司法規における זָר の意味
  choice: 祭司の家に属さない者
  alternative: よそ者、外国人、一般人、非祭司
  rationale: レビ記22章では民族的区別ではなく、聖なる食物を食べる資格を持つ祭司の家の内外が問題となっている。「外国人」では不要な民族的意味を生じさせ、「非祭司」では祭司の家に属する非祭司まで排除するように読まれ得るため、文脈上の範囲を示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀法としての厳粛さを保った。「奉納された分」は専門的な古語を避けつつ、聖なるものから取り分けられた תְּרוּמָה の意味を伝える表現である。
