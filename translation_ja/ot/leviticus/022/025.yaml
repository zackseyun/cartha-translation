  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: ja
  text: また、外国人から、これらのいずれをも、あなたがたの神の食物[a]として献げてはならない。それらは損なわれており、欠陥[b]があるからである。それらは、あなたがたのためには受け入れられない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたの神のパン」。ここで「パン」は、神に献げる食物を指すヘブライ語の祭儀的表現。
    reason: lexical_alternative
  - marker: b
    text: または「傷」「しみ」。ヘブライ語は、動物を供え物として不適格にする身体上の欠陥を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד בֶּן נֵכָר
  choice: また、外国人の手から受けたものでも
  rationale: מִיַּד の「手から」という出所を示す慣用表現を残しつつ、日本語で文意が通るよう「受けたもの」を補った。בֶּן נֵכָר は字義的には「異国の者の子」だが、ここでは非イスラエル人を指す慣用句なので「外国人」とした。
- source_word: לֹא תַקְרִיבוּ
  choice: 献げてはならない
  rationale: קרב のヒフィル形は祭儀文脈で供え物を神の前に差し出すことを表すため、自然で厳かな「献げる」を用いた。
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: あなたがたの神の食物
  rationale: לֶחֶם の字義は「パン」だが、祭儀上は神に献げる食物全般を指す。この節の対象が動物であることを明確に伝えるため「食物」とし、字義的訳は脚注に示した。
- source_word: מִכָּל אֵלֶּה
  choice: これらのどれ一つとして
  rationale: מִן と כָּל の組み合わせが表す部分的・否定的な意味を、現代日本語で明瞭に表した。直前まで述べられた欠陥のある動物を指す。
- source_word: מָשְׁחָתָם
  choice: それらには損なわれたところがあり
  rationale: 語は腐敗、損傷、損なわれた状態を表しうる。続く מוּם と同一語にせず、身体が損なわれて献げ物に適さない状態を示す表現とした。
- source_word: מוּם
  choice: 欠陥
  rationale: レビ記21―22章で祭儀上不適格とする身体的な傷や異常を表す標準語であり、現代日本語で具体性のある「欠陥」とした。別訳を脚注に示した。
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: それらは、あなたがたのためには受け入れられない
  rationale: רצה のニファル形が祭儀において「好意をもって受け入れられる」ことを表す点と、לָכֶם が献げる者との関係・利益を示す点をともに保持した。
theological_decisions:
- issue: 犠牲の供え物を指す祭儀的表現
  choice: あなたがたの神の食物
  alternative: あなたがたの神のパン
  rationale: לֶחֶם の祭司文書における広い意味を伝え、動物の供え物を文字どおりのパンと誤解させないため。「神の食物」は原文の祭儀的比喩をそのまま保つ表現であり、神に食物が必要だという教理的説明を加えてはいない。
- issue: לֹא יֵרָצוּ לָכֶם における受容の関係
  choice: あなたがたのためには受け入れられない
  alternative: あなたがたに代わって受け入れられない
  rationale: לָכֶם は利益・関係・代理などの含みを持ちうるため、特定の贖罪理解に限定する「代わって」を本文に入れず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法の命令にふさわしい端正さを保った。「外国人の手から」という原文の慣用表現は保持しつつ、「受けたもの」を補って日本語としての係り受けを明確にした。脚注記号[a][b]は本文中に対応させた。
