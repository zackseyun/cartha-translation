source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחֽוֹת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה כִּֽי שְׁאֵ֥ר אִמְּ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: ja
  text: あなたの母の姉妹の裸をあらわにしてはならない。[a] 彼女はあなたの母の肉親だからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より意味を明示すれば、「あなたの母の姉妹と性的関係を持ってはならない」。ヘブライ語の直訳は「あなたの母の姉妹の裸をあらわにしてはならない」。
    reason: lexical_alternative
  - marker: b
    text: 「肉親」と訳したヘブライ語 שְׁאֵר（シェエール）は、基本的に「肉、身」を意味し、ここでは近い血縁者を表す親族用語。
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: 裸をあらわにしてはならない
  rationale: 「裸をあらわにする」は、この章で繰り返される法的な婉曲表現であり、禁じられた性的関係を指す。本文では原文の比喩と法的な語調を保ち、その意味を脚注で明示した。
- source_word: אֲחוֹת אִמְּךָ
  choice: あなたの母の姉妹
  rationale: 母と姉妹関係にある女性を直接表す。「母方のおば」より原文の親族関係を明確に保ち、姉か妹かを限定しない。
- source_word: שְׁאֵר אִמְּךָ
  choice: あなたの母の肉親
  rationale: שְׁאֵר は近い血縁・肉親を表す親族用語。「肉親」は「肉」という原語の含意を残しつつ、現代日本語でも自然に近親者を示す。
- source_word: כִּי
  choice: だからである
  rationale: 禁止の根拠を示す理由節として、明確で格調ある日本語にした。
- source_word: הִוא
  choice: 彼女は
  rationale: 母の姉妹を受ける女性単数代名詞を明示した。
theological_decisions:
- issue: 近親間の性関係を禁じる法的婉曲表現をどう訳すか
  choice: 本文では「裸をあらわにする」という原文の慣用句を保持する
  alternative: 「性的関係を持ってはならない」と意味を直接表す
  rationale: レビ記18章に反復される表現と法的な語調を保ち、婉曲表現が指す意味は脚注で補うことで、明瞭さと原文への忠実さを両立させた。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある法文調とした。「姉妹」は年長・年少を限定しない原文に対応する。反復される法的婉曲表現は本文に残し、現代読者に必要な説明を脚注に置いた。
