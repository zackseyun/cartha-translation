source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: ja
  text: なぜなら、これらすべての忌むべき行いの一つでも行う者は皆、自分の民の中から断たれる[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死刑に処せられる」または「共同体から排除される」と解することもできる。ヘブライ語は「断たれる」と述べるだけで、裁きの具体的方法を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: （文脈上の理由・帰結として訳文全体に反映）
  rationale: 前節までの禁止に対する理由または帰結を導く語。単独の接続詞を置くと日本語では硬く不自然になりやすいため、説明的なつながりを文全体に織り込んだ。
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה
  choice: する者は皆
  rationale: 不定の普遍関係表現と動詞「行う」を合わせ、例外のない適用範囲を自然な日本語で示す。
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: これらの忌むべき行いを一つでも
  rationale: 部分を示す מִן と包括性を示す כֹּל の双方を、「一つでも」によって明確に表した。תּוֹעֵבוֹת はこの文脈では抽象的な嫌悪感ではなく、列挙された行為を指す。
- source_word: תּוֹעֵבוֹת
  choice: 忌むべき行い
  rationale: 宗教的・道徳的に強く退けられるものという重みを保ちつつ、現代日本語で対象が行為であることを明確にした。
- source_word: וְנִכְרְתוּ
  choice: 断たれる
  rationale: כרת のニファル形が持つ受動的な法的・契約的表現を保持し、死刑、神の裁き、共同体からの排除のいずれかに限定しなかった。
- source_word: הַנְּפָשׁוֹת הָעֹשֹׂת
  choice: そのような行いをする者
  rationale: נֶפֶשׁ はここでは「魂」ではなく人を指す。ヘブライ語の複数主語を日本語では自然な総称単数として表した。
- source_word: מִקֶּרֶב עַמָּם
  choice: 自分の民の中から
  rationale: 契約共同体の内部から断たれるという関係を明瞭にし、「彼らの民」より自然な日本語とした。
theological_decisions:
- issue: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם が示す処罰の具体的方法
  choice: 自分の民の中から断たれる
  alternative: 死刑に処せられる／共同体から追放される
  rationale: 原文の定型句は裁きの具体的方法をこの節だけでは特定しない。本文では「断たれる」という比喩を保ち、解釈上の幅を脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「忌むべき行い」で原語の強い否定的評価を伝え、「断たれる」は意図的に解釈を狭めない表現とした。
