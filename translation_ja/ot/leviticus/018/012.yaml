  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: ja
  text: 父の姉または妹の裸をあらわにしてはならない。[a] 彼女はあなたの父の肉親である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裸をあらわにする」は、レビ記で禁じられた性的な露出または関係を指す法的な定型表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: …の裸をあらわにしてはならない
  rationale: レビ記18章で反復される法的な定型表現を保った。「性的関係を持つ」と明示するより原文の比喩性を残しつつ、現代日本語として理解できる形にした。
- source_word: אֲחוֹת אָבִיךָ
  choice: 父の姉妹
  rationale: 姉か妹かを特定しないヘブライ語の包括性を保つため、「叔母」や「父の姉／妹」と限定せず「父の姉妹」とした。
- source_word: שְׁאֵר אָבִיךָ
  choice: あなたの父の肉親
  rationale: שְׁאֵר の「肉・血縁」に基づく近親性を、「近い親族」より具体的に、しかし不自然な直訳の「肉」を避けて表した。
- source_word: הִוא
  choice: 彼女は…だからである
  rationale: 前文の禁止の根拠を示す説明文として自然な日本語にした。
theological_decisions:
- issue: 近親相姦禁止の定型句をどこまで明示的に訳すか
  choice: 本文では「裸をあらわにする」という原文の表現を保持し、脚注で法的含意を説明する。
  alternative: 「性的関係を持ってはならない」と意訳する。
  rationale: 原文の法的・反復的な言い回しを保存し、性的行為だけに意味を狭めて曖昧さを解消しすぎないため。
translation_notes:
  register: 明快な現代標準語を用いつつ、律法本文にふさわしい簡潔で厳粛な調子と、章全体の定型表現を保った。
