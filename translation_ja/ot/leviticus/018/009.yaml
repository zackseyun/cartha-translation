source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: ja
  text: あなたの姉妹、すなわち父の娘であれ母の娘であれ、家の中で生まれた者であれ外で生まれた者であれ、彼女たちの裸をあらわにしてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「家で生まれた者であれ外で生まれた者であれ」。ヘブライ語の「家」は建物だけでなく、家族共同体を指すこともありうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: その裸をあらわにする
  rationale: レビ記18章で性的関係を婉曲に表す定型的な法的表現であるため、原文の比喩を保ちつつ現代日本語で理解できる形にした。
- source_word: אֲחוֹתְךָ
  choice: あなたの姉妹
  rationale: 男性単数への呼びかけにおける直接的な親族名称を保持した。
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: 父の娘／母の娘
  rationale: 原文の並行構造と、父または母を同じくする姉妹を含む法的な範囲を明確に保った。
- source_word: מוֹלֶדֶת
  choice: 生まれた者
  rationale: 出生の状況を示す語として、自然で明瞭な現代日本語を選んだ。
- source_word: בַּיִת / חוּץ
  choice: 家の中／外
  rationale: 原文にある『家』と『外』の対照を保持した。『家』が建物か家族共同体かは断定せず、脚注で語義の幅を示した。
- source_word: לֹא תְגַלֶּה
  choice: あらわにしてはならない
  rationale: 継続的・一般的な法的禁止として、威厳がありながら現代でも自然な禁止表現にした。
- source_word: אוֹ ... אוֹ
  choice: …であれ…であれ
  rationale: 列挙される選択肢をすべて包含する原文の構造を、日本語の法文調として自然に再現した。
theological_decisions:
- issue: 禁止される親族関係の範囲
  choice: 父を同じくする姉妹も母を同じくする姉妹も、出生場所にかかわらず禁止の対象に含める。
  alternative: 末尾の修飾句を、同居して育った姉妹と別の場所で育った姉妹、または全姉妹と半姉妹を区別する表現と捉える。
  rationale: 原文は『あなたの姉妹』という範疇を父方・母方および家の内外の出生へ広げており、後代の法的区分を持ち込まず、包括的な禁止として訳した。
- issue: 『家の中／外』の意味
  choice: 本文では原文の空間的対照を保ち、脚注で家族共同体を指す可能性を示す。
  alternative: 本文で『家族の中／家族の外』または『家庭内／家庭外』と明示する。
  rationale: בַּיִת は建物としての家だけでなく家族・家共同体も表し得るため、 genuine ambiguity を保持した。
translation_notes:
  register: 現代標準日本語による簡潔で威厳ある法的文体。『裸をあらわにする』という章全体の定型句を保持し、『姉妹』によって年長・年少を限定しない。脚注記号[a]を本文末に置いた。
