  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: ja
  text: あなたがたは、わたしの定めを守り、あなたがたより前に行われていた忌まわしい慣習を一つも行ってはならない。それらによって身を汚してはならない。わたしはあなたがたの神、ヤハウェである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: あなたがたは、わたしの定めを守り
  rationale: 語根שׁמרの「守る」と、מִשְׁמֶרֶתの守るべき務め・規定という意味を、日本語で重複が過度にならないよう「わたしの定めを守る」と表した。文脈上の命令的な力は「守り…してはならない」で保持した。
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: 行ってはならない
  rationale: 不実行を求める目的・禁止の力を、自然で明確な現代日本語の禁止表現で示した。
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: 忌まわしい慣習を一つも
  rationale: חֻקּוֹתは制定法だけでなく定着した慣行を指し得るため、ここでは諸民族の行為という文脈に合う「慣習」とした。מןの部分・除外の含意を「一つも」で表し、תּוֹעֵבֹתの強い嫌悪評価を「忌まわしい」で保持した。
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: あなたがたより前に行われていた
  rationale: 受動形を保ちつつ、לפניכםをこの文脈で時間的に解し、イスラエル以前に行われていた慣行を指すことを自然に表した。
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: それらによって身を汚してはならない
  rationale: 再帰的な意味を「身を汚す」で、בָּהֶםの手段的意味を「それらによって」で表した。祭儀的・道徳的な汚れの両面を限定せず保持する。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: わたしはあなたがたの神、ヤハウェである
  rationale: 契約上の自己宣言の形を保ち、固有名יהוהを「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の固有名を明示し、一般称号へ置き換えなかった。
- issue: תּוֹעֵבֹתの道徳的・祭儀的な評価
  choice: 忌まわしい
  alternative: 嫌悪すべき／忌むべき
  rationale: 原語の強い否定的評価を保ちながら、その嫌悪が道徳面だけか祭儀面だけかを訳文で限定しない。
- issue: חֻקּוֹתが指すもの
  choice: 慣習
  alternative: 掟／定められた行い
  rationale: 先住の民が実際に行っていた反復的な行為を指す文脈を優先した。ただし、語が規定・定例をも意味し得る点は「慣習」に含ませた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。複数二人称を「あなたがた」と明示し、禁止と契約的自己宣言の重みを保った。脚注を要するほどの不可欠な異読はないため、本文のみとした。
