id: LEV.18.5
reference: Leviticus 18:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: ja
  text: あなたがたは、わたしの掟と定めを守らなければならない。それらを行う人は、それらによって生きる[a]。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「それらの中で生きる」。ヘブライ語の前置詞は、手段を表す「によって」とも、領域を表す「中で」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守らなければならない
  rationale: 接続詞を伴う完了形は、この法的文脈では命令的な効力を持つ。שׁמרの、注意深く守り行うという契約上の意味を自然な現代日本語で表した。
- source_word: חֻקֹּתַי
  choice: わたしの掟
  rationale: חֻקּוֹתは制定された規定を指す。「掟」は法的・宗教的な規定という意味を保ち、מִשְׁפָּטַיとの語彙上の区別も維持する。
- source_word: מִשְׁפָּטַי
  choice: 定め
  rationale: מִשְׁפָּטは裁定、法規、規範を表す。ここでは「定め」とし、「掟」と並ぶ二つの法的用語を一語に平板化しないようにした。
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: それらを行う人は
  rationale: 原文の単数形הָאָדָםは代表的・一般的な人を指す。日本語では性別を付加せず「人」とすることで、その一般的な指示を正確かつ自然に表した。עשהは抽象化せず「行う」と訳した。
- source_word: וָחַי בָּהֶם
  choice: それらによって生きる
  rationale: חיהを直接的に「生きる」とし、בを手段として「によって」と訳した。ここでいう「生」の範囲が地上の命、契約における生、より広い神学的な生のどれかに限定されないようにした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
theological_decisions:
- issue: 「それらによって生きる」の生の範囲
  choice: 生の性質や範囲を限定せず、「生きる」と訳す。
  alternative: それらによって命を得る／それらの中で生きる
  rationale: 原文は、約束される生が現世的、契約的、終末的なもののいずれかを明示していない。後代の解釈を本文へ持ち込まず、原文の神学的な幅を保った。
- issue: 前置詞בְּの解釈
  choice: 手段を表す「それらによって」
  alternative: 領域を表す「それらの中で」
  rationale: בָּהֶםは手段とも領域とも理解できる。本文には自然な日本語となる手段的解釈を採り、別の可能性を脚注で明示した。
- issue: הָאָדָםの代表的単数
  choice: 「人」
  alternative: 「一人の男」／「人間」／「だれでも」
  rationale: 文法上は男性単数だが、特定の男性ではなく一般的・代表的な人を指す。日本語の「人」は性を不必要に特定せず、原文の適用範囲を自然に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「掟と定め」により原文の二つの法的用語を区別しつつ、一般読者にも理解しやすくした。神の名は「ヤハウェ」と音写した。
