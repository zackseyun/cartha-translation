  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: ja
  text: あなたがたはだれも、裸をあらわにするために、自分の肉親に近づいてはならない[a]。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裸をあらわにする」は、この章で、近親者との禁じられた性的な露出や性的関係を指す法律上の慣用表現。
    reason: 原文の慣用句を本文で保持しつつ、現代の読者にその性的・法的意味を説明するため。
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: あなたがたはだれも
  rationale: 名詞の反復による分配的表現を、禁止文として自然な現代日本語にした。個々の者すべてに適用されることを示す。
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: 自分の肉親
  rationale: 「自分の肉の近しい者」という親族表現を、元の肉体的・血縁的含意を保ちつつ分かりやすく訳した。
- source_word: לֹא תִקְרְבוּ
  choice: 近づいて……してはならない
  rationale: 否定を伴う未完了形の法的禁止を明確に示し、後続の目的表現と自然につないだ。「近づく」という婉曲的な言い回しも保持した。
- source_word: לְגַלּוֹת עֶרְוָה
  choice: その裸をあらわにする
  rationale: 章全体に繰り返される法的・性的慣用句の比喩を本文に残した。意味の範囲は脚注で補足する。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の自己宣言の簡潔さと荘重さを保ち、固有名 יהוה を「ヤハウェ」と表記した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に記された契約の固有名を明示し、称号への置換を避けた。
- issue: 「裸をあらわにする」を本文でどこまで明示するか
  choice: 原文の慣用句を保持する
  alternative: 性的関係を持つ／性的な裸をさらす
  rationale: この章で反復される表現とその解釈上の幅を保つため、本文では一義的な言い換えを避け、脚注で性的含意を説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法文としての荘重さを保った。「肉親」は現代語として自然でありながら、ヘブライ語の「肉」による親族表現も反映する。「裸をあらわにする」は意図的に婉曲表現のままとし、脚注で意味を補った。
