source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: ja
  text: というのも、あなたがたより前にその地にいた人々が、これらすべての忌むべきことを行い、その地が汚れたからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その地は汚された」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: そのため
  rationale: 前節から続く理由・説明の関係を、日本語の一文の中で自然に示す。後半の結果とのつながりも明確になる。
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: これらの忌むべきことをすべて
  rationale: תּוֹעֵבָהの強い嫌悪と道徳的・宗教的非難を保ちつつ、現代日本語として理解しやすくした。指示語と全称も明示した。
- source_word: עָשׂוּ
  choice: 行い
  rationale: 一般動詞עשהを過度に専門化せず、目的語「忌むべきこと」と自然に結びつく表現とした。
- source_word: אַנְשֵׁי הָאָרֶץ אֲשֶׁר לִפְנֵיכֶם
  choice: あなたがたより前にこの地にいた者たち
  rationale: この句は先住の住民を集合的に指す。אַנְשֵׁיの文法上の男性形を、日本語で不自然に「男たち」と限定せず、文脈上の住民一般を表す「者たち」とした。
- source_word: וַתִּטְמָא
  choice: 汚れた
  rationale: טמאが表す、行為の結果として土地が不浄になったことを簡潔に保持する。儀礼的意味と道徳的・比喩的意味のいずれかに限定しない。
- source_word: הָאָרֶץ
  choice: この地
  rationale: 文脈では全世界ではなく、イスラエルが入ろうとしている特定の土地を指すため、「この地」とした。
theological_decisions:
- issue: 土地の汚れの性質
  choice: この地は汚れた
  alternative: この地は汚された
  rationale: ヘブライ語は、人々の行為によって土地が不浄な状態になったことを示す。「汚れた」はその結果状態を保ちつつ、それが儀礼的、道徳的、または比喩的な汚れのどれだけを含むかを決めつけない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「忌むべきこと」で原文の強い非難を保持し、「この地は汚れた」でレビ記における土地の不浄という神学的緊張を説明しすぎずに表現した。
