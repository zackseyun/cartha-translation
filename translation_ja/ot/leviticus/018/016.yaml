  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: ja
  text: あなたの兄弟の妻の裸をさらしてはならない[a]。それはあなたの兄弟の裸である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より明示的には、「あなたの兄弟の妻と性的関係を持ってはならない」。ヘブライ語は「裸をさらす」という婉曲表現を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: 裸
  rationale: レビ記18章で反復される法的な婉曲表現「裸をあらわにする」を保ち、性的関係を禁じる含意を注で明示した。
- source_word: אֵשֶׁת אָחִיךָ
  choice: あなたの兄弟の妻
  rationale: 構文上、兄弟と婚姻関係にある女性を指すため、「兄弟の妻」と明確に訳した。
- source_word: לֹא תְגַלֵּה
  choice: あらわにしてはならない
  rationale: לֹאを伴う未完了形の法的禁止を、現代日本語の荘重で明瞭な禁止表現で示した。
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: それは、あなたの兄弟の裸だからである
  rationale: 原文における「裸」の反復と、禁止の根拠を示す同定の論理を保った。
theological_decisions:
- issue: 婉曲的な法的表現を、性交渉の直接的禁止として本文で明示するか
  choice: 本文では「裸をあらわにする」という原文の婉曲表現を保持する
  alternative: あなたの兄弟の妻と性的関係を持ってはならない
  rationale: 原文は露骨な表現ではなく定型的な法的婉曲語法を用いるため、その表現と章内の用語的一貫性を本文で保ち、意味は脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、律法の禁止命令にふさわしい簡潔で荘重な文体とした。「裸をあらわにする」は日常語としてやや特殊だが、章全体の鍵となる原語の反復と法的婉曲性を保持するため採用した。
