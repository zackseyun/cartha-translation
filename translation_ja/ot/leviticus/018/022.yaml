  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: ja
  text: 女と寝るように、男と寝てはならない[a]。それは忌むべきことである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「女との寝床（複数）」で、女性との性交を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: 男
  rationale: 人間の男性を表す語。年齢を明示しないヘブライ語の範囲を保ちつつ、現代日本語で自然な「男」とした。
- source_word: תִשְׁכַּב
  choice: 寝てはならない
  rationale: ここでは性的関係を指す婉曲表現。「寝る」は原文の比喩を保ち、後続句によって性的意味も明らかになる。
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: 女と寝るように
  rationale: 直訳的には「女の寝床（複数）」だが、女性との性交を指す慣用句である。比較の形を残しながら自然な日本語にした。
- source_word: תּוֹעֵבָה
  choice: 忌むべきこと
  rationale: 強い嫌悪と禁忌を表す語。祭儀的か道徳的かを訳語だけで限定せず、聖潔規定にふさわしい重みを保つ。
- source_word: הִוא
  choice: それは……ことである
  rationale: 直前に禁じられた行為を受ける女性単数代名詞。日本語では「それは」と受けるのが自然である。
theological_decisions:
- issue: 聖潔規定における禁止の範囲
  choice: 男と、女と寝るように寝る行為への直接的な禁止として訳す。
  alternative: 祭儀的行為や搾取的行為だけを指すよう限定して訳す。
  rationale: この節そのものには、祭儀性や搾取性に限定する修飾語がないため、そのような限定を補わない。一方、「同性間の性行為」など原文より抽象的で広い表現にも置き換えず、原文の具体的な言い方を保つ。
translation_notes:
  register: 明確で格調ある現代標準日本語。「寝る」という原文の婉曲表現を保持し、脚注でヘブライ語の特異な複数形と慣用的意味を説明した。
