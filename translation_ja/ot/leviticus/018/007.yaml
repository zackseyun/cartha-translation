id: LEV.18.7
reference: Leviticus 18:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: ja
  text: あなたの父の裸、すなわち、あなたの母の裸をあらわにしてはならない。[a] 彼女はあなたの母である。その裸をあらわにしてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたの父の裸と、あなたの母の裸をあらわにしてはならない」とも訳せる。続く「彼女はあなたの母である」という文は、ここで母が指されていることを説明している。
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: ～の裸
  rationale: レビ記18章の「裸をあらわにする」は、禁じられた性的関係を表す定型的な婉曲表現である。「裸」を保つことで、原文の反復と法的な表現を伝える。
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: あらわにしてはならない
  rationale: גלהのピエル形とעֶרְוָהの組み合わせによる禁止定型句を、自然で格調ある現代日本語として表した。性的関係を意味する含意を説明的に言い換えすぎない。
- source_word: אָבִיךָ
  choice: あなたの父
  rationale: 二人称男性単数接尾辞を伴う親族名称を直接訳した。
- source_word: וְעֶרְוַת אִמְּךָ
  choice: すなわち、あなたの母の裸
  rationale: 接続詞וְは字義的には「そして」だが、後続する「彼女はあなたの母である」と文脈上の関係から、ここでは父の裸を母の裸によって説明する同格的用法として本文に示した。ただし逐語的な可能性は脚注に残した。
- source_word: הִוא
  choice: 彼女は
  rationale: 女性単数代名詞であり、母を指す強調的な説明を保持した。
- source_word: אִמְּךָ
  choice: あなたの母
  rationale: 原文の親族名称とその反復を保ち、法的な明確さと強調を伝えた。
theological_decisions:
- issue: 「あなたの父の裸」と「あなたの母の裸」の関係
  choice: 「あなたの父の裸、すなわち、あなたの母の裸」と説明的同格として訳す。
  alternative: 「あなたの父の裸と、あなたの母の裸」と並列に訳す。
  rationale: 後半の「彼女はあなたの母である」は、直接の対象が母であり、母との関係が父の裸をあらわにすることにも当たるという家族的・法的論理を示すと理解できる。一方、ヘブライ語のוְ自体は通常「そして」であるため、その形式的な曖昧さを脚注で明示した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で厳粛な法令調とした。「裸をあらわにする」という原文の婉曲表現を保持しつつ、「すなわち」で節内の説明関係を自然に示した。脚注記号[a]は該当箇所の直後に置いた。
