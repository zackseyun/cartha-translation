source:
  edition: WLC
  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: ja
  text: あなたの父の妻の娘、すなわち、あなたの父がもうけた者の裸をあらわにしてはならない。彼女はあなたの姉妹である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼女はあなたの父を同じくする姉妹である」とも訳せる。ヘブライ語は直訳すると「彼女はあなたの姉妹である」であり、その前の説明が父との具体的な親族関係を示している。
    reason: 本文が用いる一般的な「姉妹」を保ちつつ、先行する系譜説明による父系の関係を補足するため。
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: ～の裸／彼女の裸
  rationale: レビ記18章で繰り返される「裸をあらわにする」という性的関係の禁止を表す定型句として、法的・慣用的な表現と章内の一貫性を保つ。
- source_word: בַּת
  choice: 娘
  rationale: 直接的な親族名称として、そのまま訳した。
- source_word: אֵשֶׁת אָבִיךָ
  choice: あなたの父の妻
  rationale: 「継母」と限定せず、ヘブライ語の関係表現を保持した。
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: あなたの父を父として生まれた娘
  rationale: 父との生物学的な親子関係を明示する語句。日本語として意味が明瞭になるよう「娘」を補いつつ、父から生まれたという原文の焦点を保った。
- source_word: אֲחוֹתְךָ הִוא
  choice: 彼女はあなたの姉妹である
  rationale: 原文は「異母」を加えず、直接「あなたの姉妹」と述べているため、その広さを本文に残した。
- source_word: לֹא תְגַלֶּה
  choice: あらわにしてはならない
  rationale: 章内の法的禁止命令にふさわしい、明瞭で格調ある現代日本語とした。
theological_decisions:
- issue: 本文で関係を「異母姉妹」と明示するか
  choice: 原文どおり「彼女はあなたの姉妹である」とし、先行する親族関係の説明に限定を委ねる。
  alternative: 彼女はあなたの異母姉妹である。
  rationale: 文脈上は異母姉妹を指すと理解できるが、ヘブライ語本文は単に「姉妹」と述べる。本文で解釈を狭めず、必要な説明は脚注に置いた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、律法の禁止命令としての格調を保った。「裸をあらわにする」は章全体の定型表現として統一可能である。
