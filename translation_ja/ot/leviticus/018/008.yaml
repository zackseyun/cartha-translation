  text: עֶרְוַ֥ת אֵֽשֶׁת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: ja
  text: あなたの父の妻の裸をあらわにしてはならない[a]。それはあなたの父の裸である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より明示的には、「あなたの父の妻と性的関係を持ってはならない」。ヘブライ語では直訳すると「裸をあらわにする」。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: 裸
  rationale: レビ記18章で繰り返される「裸をあらわにする」という法的婉曲表現を保ち、単なる裸体の露出ではなく性的関係を指す文脈上の含みも注で明示する。
- source_word: אֵשֶׁת
  choice: 妻
  rationale: 「父」との連語では婚姻関係にある女性を指すため、「女」ではなく「妻」とする。
- source_word: לֹא תְגַלֵּה
  choice: あらわにしてはならない
  rationale: 否定辞を伴う未完了形が法規定として恒常的禁止を表すことを、現代日本語の厳粛で自然な禁止表現にした。
- source_word: אָבִיךָ
  choice: あなたの父
  rationale: 二人称単数の所有関係を明確にし、節内の反復も原文どおり保つ。
- source_word: הִוא
  choice: それは
  rationale: 文法上女性形の代名詞は女性本人よりも女性名詞「裸」を受けると理解し、日本語では「それは」と表す。
theological_decisions:
- issue: 「裸をあらわにする」という婉曲的な法的慣用句を、性的関係の禁止として本文で明示するか
  choice: 本文では原文の慣用句を「裸をあらわにする」として保つ
  alternative: 「父の妻と性的関係を持ってはならない」と明示する
  rationale: 章全体で反復される契約法の定型表現と婉曲的語調を保持するため。性的関係を指すという有力な意味は脚注で説明し、原文の表現上の含みを一義的な言い換えで消さない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、法文としての格調を保った。「裸をあらわにする」は日常語としてやや特殊だが、章内の反復と原文の婉曲表現を尊重して採用した。
