  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: ja
  text: 男は、どの動物とも寝て、それによって身を汚してはならない。また女性も、動物が自分と交わるために、その前に立ってはならない。[a] それは秩序を乱す行為である。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「女は、動物が自分に乗るために、その前に立ってはならない」となる。動物との性交を指す。
    reason: lexical_alternative
  - marker: b
    text: 「秩序を乱す行為」と訳した語は、「混乱」「倒錯」「秩序への侵犯」とも訳し得る。特に性的な文脈で、本来あるべき秩序を破ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: どの動物とも
  rationale: בְּהֵמָה は家畜を中心に動物を広く指し得る。כָּל の包括性を自然な現代日本語で示すため「どの動物とも」とした。
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: 寝てはならない
  rationale: 字義的には「あなたの寝ることを与えてはならない」だが、日本語では不自然で意味も伝わりにくい。性的な「寝る」というヘブライ語の婉曲表現を保ちつつ、禁止として自然に訳した。
- source_word: לְטָמְאָה בָהּ
  choice: それによって身を汚して
  rationale: טמא の汚れの概念を保ち、単に儀礼的な汚れへ限定せず、行為によって本人が汚れるという文脈上の意味を明示した。
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: 動物の前に身を置いてはならない
  rationale: 字義は「動物の前に立ってはならない」。ここでは性交のために自らを差し出す姿勢を表すため、「身を置く」として自然さと原文の像を両立させた。
- source_word: לְרִבְעָהּ
  choice: 動物と交わるために
  rationale: רבע はこの文脈で動物が雌に乗ること、すなわち獣姦を指す。女性が行為の対象であるという接尾辞の方向性は脚注で補い、本文は明瞭で品位ある表現とした。
- source_word: תֶּבֶל
  choice: 秩序を乱す行為
  rationale: תבל は性的文脈で本来あるべき区別や秩序の侵犯を表す。「混乱」では現代日本語で心理状態と誤解されやすく、「倒錯」は現代の臨床的・類型的含意を帯び得るため、語義を説明的に訳した。
theological_decisions:
- issue: 汚れの言語を儀礼的な意味だけに限定するか
  choice: それによって身を汚して
  alternative: それによって汚れた者となって／それと共に汚れるために
  rationale: 本文はこの行為を汚れとして扱うが、儀礼的汚れだけとも後代の教理的範疇とも限定していない。その幅を保つ表現を採った。
- issue: תֶּבֶל の道徳的・秩序的評価
  choice: 秩序を乱す行為
  alternative: 倒錯／混乱／忌まわしい行為
  rationale: 原語が示す正しい秩序の侵犯を表しつつ、「忌まわしい」に対応する別のヘブライ語と混同せず、「倒錯」が帯びる現代的な追加含意も避けた。
translation_notes:
  register: 明瞭な現代標準日本語。律法文としての厳粛さを保ちながら、過度に露骨な表現と意味不明な逐語訳を避けた。「交わる」は一般読者に理解できる品位ある性的表現として用いた。
