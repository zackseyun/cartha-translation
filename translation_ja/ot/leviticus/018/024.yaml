source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: ja
  text: これらのいずれによっても、身を汚してはならない[a]。わたしがあなたがたの前から追い出そうとしている諸国の民は、これらすべてのことによって汚れたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのいずれによっても、自分を汚してはならない。……諸国の民は……汚された。」
    reason: טמאのヒトパエル形とニファル形には、それぞれ再帰的表現と受動的表現による訳の可能性があるため。
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: 自分を汚してはならない
  rationale: אַל＋未完了形の禁止を明確に表し、再帰的なヒトパエル形を「自分を」で示した。「汚す」はレビ記における儀礼的・道徳的な不浄の両面を自然な現代日本語で保つ。
- source_word: בְּכָל אֵלֶּה
  choice: これらのどのことによっても
  rationale: 否定文中のכָלを「どの…も」とし、前置詞בְּの手段を表す働きを「によって」で示した。
- source_word: כִּי
  choice: からである
  rationale: 直前の禁止の根拠を導く説明的な接続を、日本語として自然に文末で表した。
- source_word: נִטְמְאוּ
  choice: 汚れた
  rationale: טמאのニファル形が表す、汚れた状態に至ったことを簡潔に表現し、前半との語彙的一貫性も保った。
- source_word: הַגּוֹיִם
  choice: 諸国の民
  rationale: ここではカナンに住む非イスラエルの諸民族を指すため、「異邦人」より時代錯誤や神学的含意が少なく、文脈に即している。
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: わたしが追い出そうとしている
  rationale: שׁלחの基本義は「送る」だが、土地から諸民族を排除する文脈では「追い出す」が適切である。分詞形の進行中・差し迫った行為を「追い出そうとしている」で表した。
- source_word: מִפְּנֵיכֶם
  choice: あなたがたの前から
  rationale: 前置詞מִןを省かず、「あなたがたの進む前から取り除く」という空間的意味を明示した。
theological_decisions:
- issue: レビ記18章における儀礼的・道徳的な不浄の用語
  choice: 汚す／汚れた
  alternative: 身を汚す／汚された、または不浄になる
  rationale: טמאは単なる衛生上の不潔ではなく、禁じられた行為によるレビ記的な不浄を表す。「汚す／汚れた」はその概念を自然に伝えつつ、儀礼的か道徳的かの一方だけに限定しない。
- issue: 諸国の民の汚れにおける態の表現
  choice: 汚れた
  alternative: 汚された
  rationale: ニファル形は受動または状態変化として理解できる。「汚れた」は原因となる行為によって不浄な状態に至ったことを表し、誰か外部の主体が彼らを汚したと限定しない。脚注で受動的表現の可能性を示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「諸国の民」によりגּוֹיִםの集合的・民族的意味を示し、「あなたがたの前から」で原文の空間表現を保持した。
