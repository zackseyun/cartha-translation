source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: ja
  text: あなたの息子の娘、あるいは娘の娘の裸をあらわにしてはならない[a]。彼女たちはあなたの裸だからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裸をあらわにする」は、ここでは性的関係を持つことを指すヘブライ語の婉曲表現。より説明的には、「あなたの息子の娘、あるいは娘の娘と性的関係を持ってはならない」。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼女たちはあなたの裸だからである」。この表現は、これらの近い子孫を本人の「裸」と同定する親族関係上の論理を表し、そのため性的関係が禁じられることを示す。
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: 裸／彼女たちの裸／あなたの裸
  rationale: 「裸をあらわにする」は、この章で禁じられた性的関係を表す定型的な婉曲表現である。字義的な語を保つことで、章全体の反復構造と、結びの句にある意図的な同語反復を伝える。
- source_word: בַּת בִּנְךָ
  choice: あなたの息子の娘
  rationale: 父方の孫娘を指すヘブライ語の親族表現を、法規としての正確さを保って直接訳した。
- source_word: בַת בִּתְּךָ
  choice: 娘の娘
  rationale: 母方の孫娘を指す親族表現を、前句との並行を保って訳した。日本語では二度目の「あなたの」を省いても指示関係は明瞭である。
- source_word: לֹא תְגַלֶּה
  choice: あらわにしてはならない
  rationale: 禁止法の端的で格調ある調子を保ちつつ、גלה ערוה の定型表現を日本語でも再現する。
- source_word: כִּי
  choice: だからである
  rationale: 禁止の根拠を示す因果関係を明確な現代日本語で表した。
- source_word: הֵנָּה
  choice: 彼女たちは
  rationale: 女性複数代名詞が二人の孫娘を受けることを明示し、原文の述語構文「彼女たちはあなたの裸」を保持した。
theological_decisions:
- issue: 結びの句「彼女たちはあなたの裸」の意味
  choice: 彼女たちはあなたの裸だからである
  alternative: 彼女たちの裸はあなた自身の裸だからである／彼女たちはあなた自身の肉親だからである
  rationale: 原文は「彼女たち」を主語として「あなたの裸」と同定しており、近い子孫を本人の家族的・身体的な延長と見る論理を表す。意味を一つに解消する説明的な意訳を本文に入れず、原文の比喩的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語による法規的で格調ある文体。「すなわち彼女たちの裸」によって原文の目的語の再提示を残し、結びの特異な比喩も脚注で説明しつつ本文では保持した。
