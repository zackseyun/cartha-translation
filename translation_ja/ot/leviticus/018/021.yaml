  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: ja
  text: あなたの子孫をだれ一人も、モレクに渡して通らせてはならない[a][b]。あなたの神の名を汚してはならない。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「あなたの種から」。ここでは「あなたの子どもたち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: モレクに関係する儀礼を指す。多くは子どもを犠牲としてささげることと理解され、ほかの箇所では子どもに「火の中を通らせる」と表現されることがある。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: あなたの子孫のうち、一人でも
  rationale: זֶרַע は字義的には「種」だが、ここでは子孫を指す。部分を示す מִן と否定文の力を「うち、一人でも」で表した。
- source_word: תִתֵּן
  choice: 渡してはならない
  rationale: נתן の基本義「与える」を保ちつつ、人を儀礼のために引き渡す文脈に自然な「渡す」とした。
- source_word: לְהַעֲבִיר
  choice: くぐらせて
  rationale: עבר のヒフィル形「通過させる」を簡潔に表す。この節自体には「火」が明記されないため、本文には補わない。
- source_word: לַמֹּלֶךְ
  choice: モレクに
  rationale: マソラ本文の母音と伝統的理解に従い、固有名として音写した。
- source_word: תְחַלֵּל
  choice: 汚してはならない
  rationale: ピエル形の「俗悪なものにする、冒涜する」の意味を、神の名を目的語とする自然で明瞭な現代日本語で表した。
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: あなたの神の名
  rationale: 原文の構造と、神の名が担う名誉・評判という契約的な重みを保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: モレクに関する禁止行為の性質
  choice: 本文では「渡して、くぐらせる」とし、「火」や「いけにえ」を明記しない。
  alternative: 「子どもをモレクへのいけにえとしてささげる」または「火の中を通らせる」
  rationale: 広い聖書文脈では子どもの犠牲や火を伴う儀礼との関連が強いが、本節そのものは「火」を明記していない。原文の曖昧さを本文に残し、儀礼的背景は注で示す。
- issue: זֶרַע の指示対象
  choice: 子孫
  alternative: 子ども／種
  rationale: 年齢を限定しない語の広さを保ち、字義的すぎる「種」は注に回した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法の禁止命令は「〜てはならない」で統一し、原文にない儀礼の詳細は本文へ補わず注に置いた。
