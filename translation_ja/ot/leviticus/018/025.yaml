  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: ja
  text: こうして、その土地は汚れた[a]。わたしはその土地に、その咎の責任を問うた[b]。そして、その土地は住民を吐き出した[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「汚された」。ヘブライ語は、土地が汚れた状態になったこととも、汚されたこととも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「わたしはその土地の咎を、その土地に対して顧みた（訪れた）」。これは、咎を見過ごさず、裁いて責任を問うことを表す慣用表現。
    reason: lexical_alternative
  - marker: c
    text: 「吐き出した」は原文の生々しい比喩。土地が汚れのために住民を排除するさまを描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: 汚れた
  rationale: טמאが表す、忌まわしい行為によって土地が儀礼的・道徳的に汚れた状態を、簡潔で自然な日本語で示す。受動的な「汚された」という理解も可能なため、脚注に残す。
- source_word: הָאָרֶץ
  choice: その土地
  rationale: 文脈は広義の「地球」ではなく、直前まで語られているカナンの土地を指す。「その」を添えて文脈上の指示対象を明確にする。
- source_word: וָאֶפְקֹד
  choice: 問うた
  rationale: פקדとעוןの組み合わせは、咎を看過せず裁きにおいて責任を問うことを表す。「罰した」と結果だけに限定せず、ヘブライ語の慣用表現が持つ裁きの含みを保つ。
- source_word: עֲוֺנָהּ
  choice: その土地の咎
  rationale: עוןには罪、不義、罪責、その結果という幅がある。「咎」は道徳的な違反と負うべき責任の両面を比較的よく保つ。接尾辞の指示対象を明示するため「その土地の」とする。
- source_word: עָלֶיהָ
  choice: その土地に
  rationale: עלが、咎を問われる対象として土地を示していることを保つ。日本語では「その土地の咎を、その土地に問う」として原文の反復と擬人化を残す。
- source_word: וַתָּקִא
  choice: 吐き出した
  rationale: קיאの生々しい「吐く」という比喩を弱めず、土地が住民を排除する擬人表現をそのまま伝える。
- source_word: יֹשְׁבֶיהָ
  choice: 住民
  rationale: ישבの分詞形が指す、その土地に住む人々の集合的意味を、簡潔で現代的な語で表す。
theological_decisions:
- issue: 土地が汚れに反応して住民を吐き出すという擬人化
  choice: 「その土地は住民を吐き出した」と具体的な比喩を保持する。
  alternative: 「その土地は住民を追い出した」
  rationale: 原文は、罪による汚れ、神の裁き、土地からの排除の結び付きを、「吐く」という強い擬人表現で描く。これを一般的な追放表現に弱めない。
- issue: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָにおける神の裁き
  choice: 「わたしはその土地の咎を、その土地に問うた」とし、神の主体的な裁きと原文の慣用表現をともに保つ。
  alternative: 「わたしはその土地を、その咎のゆえに罰した」
  rationale: 「罰した」は意味を明瞭にする一方、עוןの罪・罪責・結果という幅とפקדの「顧みて責任を問う」という含みを狭めうる。「咎を問う」は日本語として理解可能で、神の裁きを曖昧にしない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「咎を問う」で聖書本文にふさわしい品位と裁きの重みを保った。「土地」の反復は原文の擬人化と修辞を維持するため省略していない。接続は物語の帰結を示す「こうして」と、節内の連続を示す「そして」で自然に整えた。
