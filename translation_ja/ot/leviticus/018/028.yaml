id: LEV.18.28
reference: Leviticus 18:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: ja
  text: あなたがたがこの地を汚して、この地が、あなたがたより前にいた民を吐き出したように、あなたがたを吐き出すことがないように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: 吐き出す／吐き出した
  rationale: 土地が住民を排除するという原文の強烈な身体的比喩を保つ。「追い出す」よりも鮮烈で、土地を動作主体とする擬人化も明確に伝わる。
- source_word: הָאָרֶץ
  choice: この地
  rationale: 文脈上、全世界ではなく、イスラエルが入ろうとしているカナンの地を指すため。日本語では指示語を添えることで特定の土地であることが自然に伝わる。
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: あなたがたがこの地を汚したために
  rationale: 前置詞בְּを原因・契機として表し、土地の汚れと住民の排除との結び付きを自然な日本語で示す。時間的に「汚すとき」とする余地もあるが、ここでは警告の因果関係を明瞭にした。
- source_word: הַגּוֹי
  choice: 民
  rationale: 単数集合名詞として、先住の一つの民を指す。「国民」では近代国家の含意が強く、「異邦人」は後代の神学的含意を持ち込み得るため避けた。
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: あなたがたより前にいた
  rationale: 空間的な『前』ではなく、その地に先に住んでいたという時間的先行を明確に表す。
- source_word: וְלֹא
  choice: ことのないようにしなさい
  rationale: 直前から続く命令・警告に依存する否定的な目的／結果を、日本語で理解できる形にした。「しなさい」は文脈上の勧告を補っているが、独立した新命令を加える意図ではない。
theological_decisions:
- issue: 裁きの主体としての土地の擬人化
  choice: 土地を「吐き出す」動作の文法上の主体として保つ
  alternative: 神が土地を通して住民を追放すると説明的に訳す
  rationale: 原文は土地そのものを擬人化し、道徳的汚れが土地を汚染して住民の排除に至るというレビ記固有の神学的描写を示す。神の主権を否定せず、本文が明示していない説明を訳文に加えない。
- issue: בְּטַמַּאֲכֶםの時間的・原因的含意
  choice: 「汚したために」と原因的に訳す
  alternative: 「汚すとき」「汚すなら」
  rationale: ヘブライ語の前置詞構文には時間的・手段的な幅がある。ここでは汚れが追放を招くという警告の関係を示しつつ、神学的な仕組みを本文以上に細かく規定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、土地が住民を「吐き出す」という原文の強い比喩と擬人化を保持した。文脈に依存する否定目的節は「ことのないようにしなさい」として日本語の文として整えた。
