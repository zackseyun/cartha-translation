base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: そしてヤハウェはモーセに告げた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳：「そしてヤハウェはモーセに語って言った。」
    reason: 原文の定型的な発話導入句 וַיְדַבֵּר ... לֵאמֹר の形式を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: そして…告げた
  rationale: 連続する物語を導く接続形を「そして」で示し、דבר の発話行為を、後続の言葉を導入する自然で格調ある日本語「告げた」で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語音写「ヤハウェ」で示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞 אֶל を、現代日本語で自然な助詞「に」で表した。מֹשֶׁה は慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （「告げた」に含める）
  rationale: この不定詞は後続する発言内容を導入する定型句である。日本語で「言って言った」のような重複を避けつつ機能を保つため、「告げた」に統合した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を明記しているため、称号「主」に置き換えず音写した。
translation_notes:
  register: 明快な現代標準日本語。「告げた」によってヘブライ語の発話導入定型句を自然にまとめつつ、脚注で直訳的な形を示した。神名は「ヤハウェ」と音写した。
