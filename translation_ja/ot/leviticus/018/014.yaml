id: LEV.18.14
reference: Leviticus 18:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: ja
  text: あなたの父の兄弟の裸をあらわにしてはならない。その妻に近づいてはならない[a]。彼女はあなたのおばである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「近づく」。ここでは、近親関係を禁じる規定の文脈で性的な意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: 裸を
  rationale: レビ記18章で反復される「裸をあらわにする」という性関係を指す法的慣用句を、具体的表現のまま保持した。
- source_word: אֲחִי אָבִיךָ
  choice: あなたの父の兄弟
  rationale: 父方のおじを意味するが、原文の親族関係を明示し、「おじ」だけの場合に生じる父方・母方の曖昧さを避けた。
- source_word: לֹא תְגַלֵּה
  choice: あらわにしてはならない
  rationale: גלהのピエル形と否定命令を、この章の定型的な禁止表現として訳した。
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: その妻に近づいてはならない
  rationale: קרבの抑制された表現を保持しつつ、文脈上の性的意味は脚注で示した。
- source_word: דֹּדָתְךָ הִוא
  choice: 彼女はあなたのおばである
  rationale: דּוֹדָהの通常の親族名称を自然な日本語で表し、前文がその関係を父の兄弟の妻と特定していることを保った。
theological_decisions:
- issue: 近親関係を禁じる法的慣用句の訳し方
  choice: 「裸をあらわにする」を本文に保持する
  alternative: 「性的関係を持つ」と明示的に言い換える
  rationale: 反復される原文の法的定型と比喩的緊張を保ち、解釈的な言い換えによって表現を平板化しないため。
- issue: 父の兄弟の妻の呼称
  choice: 「彼女はあなたのおばである」
  alternative: 「彼女はあなたの父の兄弟の妻である」
  rationale: 原文は末尾で通常の親族語を用いており、直前の句ですでに具体的関係が示されているため。
translation_notes:
  register: 現代の標準的な日本語による、簡潔で厳粛な法令調。「父の兄弟」は原文の親族関係を明確にし、「おば」は自然な現代語として用いた。
