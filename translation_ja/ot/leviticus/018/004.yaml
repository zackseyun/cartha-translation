source:
  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: ja
  text: あなたがたは、わたしの法令を実行し、わたしの掟を守り、それらに従って歩みなさい。[a] わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「それらの中を歩む」。神の命令に従って生活することを表すヘブライ語の慣用表現。別訳「それらに従って生きなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: わたしの法令
  rationale: 法的な判断・規定を表す語であり、「法令」とすることで司法的・規範的な力を保ちつつ、חֻקֹּתַי（掟）との語義上の区別を示す。
- source_word: תַּעֲשׂוּ
  choice: 行い
  rationale: 基本義「行う」を保ち、法令を実際に実践することを簡潔に表す。
- source_word: חֻקֹּתַי
  choice: わたしの掟
  rationale: 定められた規則・制定事項を指す。「掟」は現代日本語でも理解でき、法令との区別を保つ。
- source_word: תִּשְׁמְרוּ
  choice: 守り
  rationale: 原義の「守る、保つ」と契約法における注意深い遵守の意味を自然に伝える。
- source_word: לָלֶכֶת בָּהֶם
  choice: それらに従って歩みなさい
  rationale: הלך の「歩む」という比喩を残しながら、בָּהֶם が示す、これらの規定に即して生活する意味を明瞭にする。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称男性複数接尾辞を反映し、イスラエル共同体に対する契約的な呼びかけを示す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: ヘブライ語本文の固有名を称号で代替せず、日本語で一般的な学術的音写を用いる。
- issue: לָלֶכֶת בָּהֶם の意味
  choice: それらに従って歩みなさい
  alternative: それらによって生きなさい
  rationale: 倫理的な生き方を示す「歩む」という原文の比喩を保持し、「それによって命を得る」という意味に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔で荘重な調子を保った。「あなたがた」で複数形を明示し、命令・規範としての力を「歩みなさい」で自然に表した。
