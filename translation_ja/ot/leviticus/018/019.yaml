  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: ja
  text: 月経による儀礼上の汚れの時期にある女に、その女の裸をあらわにするために近づいてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「月経による不浄の時期」とも訳せる。ヘブライ語は、清浄・不浄に関する儀礼的な用語を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: 女に近づく
  rationale: אִשָּׁהはここでは所有関係を示さない不定の「女」。אֶלはקרבと結びつき、「近づく」という慣用的な方向性を表す。
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: 月経による汚れのうちにある間
  rationale: נִדָּהは月経に伴う状態、טֻמְאָהはレビ記における儀礼的な汚れを表す。「月経中」だけに単純化せず、原文の清浄規定上の語彙を保った。
- source_word: לֹא תִקְרַב
  choice: 近づいてはならない
  rationale: 律法文中のלֹא＋未完了形を、現代日本語の明確で格調ある禁止表現とした。文脈上、性的関係を目的とする接近を含意するが、動詞自体を「性交する」と明示化しなかった。
- source_word: לְ/גַלּוֹת
  choice: あらわにするために
  rationale: גלהの「覆いを取り、露出させる」という意味と、レビ記18章に反復される法的婉曲表現を保持した。
- source_word: עֶרְוָתָהּ
  choice: その裸
  rationale: עֶרְוָהを「裸」と訳し、「裸をあらわにする」という章内の婉曲表現を保った。「陰部」や「性交」とすると原文以上に限定的・明示的になる。
theological_decisions:
- issue: טֻמְאָהを儀礼的な汚れとして訳すか、単に生理的・医学的状態として訳すか
  choice: 「月経による汚れ」とし、清浄規定上の概念を保持する
  alternative: 「月経中」または「月経の期間」
  rationale: טֻמְאָהはレビ記で清浄・不浄の制度に属する語であり、単なる時間表現に置き換えると原文の宗教的・儀礼的範疇が失われる。一方、「汚れ」は道徳的非難と誤解されうるため、脚注で儀礼的意味を明示する。
translation_notes:
  register: 現代標準日本語による簡潔な律法文。「近づいてはならない」で法的な禁止の調子を保ち、「裸をあらわにする」は原文の性的婉曲表現を過度に明示化せず再現した。脚注記号[a]は該当文末に置いた。
