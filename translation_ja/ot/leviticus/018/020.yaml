  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: ja
  text: あなたの隣人の妻と性的な関係を持ち[a]、それによって身を汚してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「あなたの隣人の妻に、子をもうけるための種としてあなたの精液を与えてはならない」。精液に関する婉曲表現。
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: あなたの隣人の妻
  rationale: עָמִיתはこの共同体の法的文脈で同胞・隣人を指す。「隣人の妻」は現代日本語として自然で、関係を明確に表す。
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: 性的な関係を持ってはならない
  rationale: 字義的には精液を種として与えるという性交の婉曲的表現である。本文では意味を明瞭に伝え、原文の具体的な表現は脚注に残す。
- source_word: לְטָמְאָה בָהּ
  choice: その女によって身を汚す
  rationale: 不定詞句は性交によって当事者が汚れることを示す。「身を汚す」は祭儀的意味に限定せず、原語の汚れの概念を保つ。
theological_decisions:
- issue: 禁止の内容と汚れの性質
  choice: 隣人の妻との性交を禁じ、それによって話しかけられている者が身を汚すと訳す。
  alternative: 原文の精液に関する表現を本文に直訳する、または「儀式的に汚れる」と限定する。
  rationale: ヘブライ語の句は性交を指す一方、末尾は当事者の汚れを述べる。「儀式的」と補うと原文以上に意味を限定するため避ける。
translation_notes:
  register: 明瞭で現代的な法的禁止表現としつつ、品位を保った。「その女」は直前の「隣人の妻」を受け、בָהּの女性単数形を反映する。
