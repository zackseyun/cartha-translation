id: LEV.18.3
reference: Leviticus 18:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: ja
  text: あなたがたは、かつて住んでいたエジプトの地の人々の行いにならってはならない[a]。また、わたしがあなたがたを導き入れようとしているカナンの地の人々の行いにならってはならない。彼らの定めのうちを歩んではならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「エジプトの地の行いに従って」。同じ表現がカナンについても繰り返されている。ここで「地の行い」とは、その地の人々の行いや慣行を指す。
    reason: lexical_alternative
  - marker: b
    text: 「彼らの定めに従ってはならない」とも訳せる。「歩む」は、生き方や行動を表す比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: 人々が行っているように
  rationale: 直訳は「その地の行いにならって」だが、土地そのものではなく住民の慣行を指すヘブライ語の表現であるため、意味を明確にしつつ「行い」の具体性を保った。
- source_word: אֶרֶץ מִצְרַיִם
  choice: エジプトの地
  rationale: 地理的な強調を保ち、続く「カナンの地」との並行も明瞭にした。
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: かつて住んでいた
  rationale: イスラエルの以前の居住地を示す完了形を、自然な現代日本語で表した。
- source_word: לֹא תַעֲשׂוּ
  choice: 行ってはならない
  rationale: 否定命令の法的な強さを、現代日本語の聖書文体として明確に表した。
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: カナンの地で人々が行っているように
  rationale: 前半との反復と対句を保ち、暗示されている住民を「人々」として明示した。
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: わたしがあなたがたを導き入れようとしている
  rationale: 分詞の進行中・目前の意味と、目的地へ入らせる使役的な方向性を自然に表した。
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: 彼らのおきてに従って
  rationale: חֻקּוֹת の規範的な意味を「おきて」で保った。「従って」は בְ と「歩く」の組み合わせが示す行動規範への追随を明瞭にする。
- source_word: לֹא תֵלֵכוּ
  choice: 歩んではならない
  rationale: 生き方・行動を表す聖書的な「歩む」の比喩を保持した。
theological_decisions:
- issue: 「エジプトの地／カナンの地の行い」を土地そのものの行為として直訳するか、住民の慣行として明示するか
  choice: 「その地で人々が行っているように」と訳す
  alternative: 「エジプトの地の行いにならって／カナンの地の行いにならって」
  rationale: 原文の換喩を自然な日本語で明確にし、禁じられているのが住民の実践であることを示す一方、特定の罪へ限定する解釈は加えない。
- issue: חֻקֹּתֵיהֶם を「慣習」とするか、規範性のある「おきて」とするか
  choice: 彼らのおきて
  alternative: 彼らの慣習／彼らの定め
  rationale: 周辺文脈にある主の定めとの対照を保ち、単なる社会習慣以上の規範的性格を伝える。ただし公的な成文法だけに意味を限定しないよう平仮名の「おきて」とした。
- issue: לֹא תֵלֵכוּ の歩行比喩を残すか
  choice: 従って歩んではならない
  alternative: 従ってはならない
  rationale: 「従う」という意味を明らかにしながら、生き方を示す原文の「歩く」という比喩も保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。二つの土地に関する禁止の並行を保ち、「行ってはならない」を反復した。「おきて」と「歩む」により法的・比喩的な響きを残しつつ、「従って」を添えて普通の読者にも意味が通るようにした。
