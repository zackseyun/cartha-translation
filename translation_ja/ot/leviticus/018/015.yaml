  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: ja
  text: あなたの嫁の裸をあらわにしてはならない[a]。彼女はあなたの息子の妻である。彼女の裸をあらわにしてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「裸をあらわにする」。レビ記で禁じられた性的関係を指して繰り返し用いられる法的な婉曲表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: 裸
  rationale: レビ記18章で繰り返される「裸をあらわにする」という法的な婉曲表現を保ち、章内の用語の一貫性とヘブライ語の反復を維持するため。
- source_word: כַּלָּתְךָ
  choice: あなたの嫁
  rationale: 二人称単数男性接尾辞を伴い、聞き手の息子の妻、すなわち嫁を指す。続く「あなたの息子の妻」がその関係を明示するため、日本語では簡潔な親族名称「嫁」とした。
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: あらわにしてはならない
  rationale: גלהのピエル形とעֶרְוָהから成る章内の定型的な禁止表現を保持した。「性的関係を持ってはならない」と明示的に言い換えず、原文の婉曲性を残している。
- source_word: אֵשֶׁת בִּנְךָ
  choice: あなたの息子の妻
  rationale: 嫁が禁じられる親族関係を説明する同格的な節を、自然で明確な現代日本語で表した。
- source_word: הִוא
  choice: 彼女は…である
  rationale: 直前の女性を指し示してその身分を説明する代名詞の働きを、簡潔な判断文で表した。
theological_decisions:
- issue: 性的禁止規定における「裸をあらわにする」という慣用句の訳し方
  choice: 「裸をあらわにする」という婉曲表現を本文に保持する。
  alternative: 「性的関係を持つ」または「性交する」と明示する。
  rationale: 原文はレビ記18章全体で一貫した法的婉曲表現を用いている。性的関係の禁止という意味は注で示しつつ、本文では原文の表現、その反復、含みを平板化しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あらわにする」は原文の法的婉曲表現を保つために用い、「彼女はあなたの息子の妻である」という反復的な説明も原文どおり残した。
