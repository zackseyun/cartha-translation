reference: Leviticus 18:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: ja
  text: 'あなたは、ある女とその娘の裸をあらわにしてはならない[a]。また、その女の息子の娘、あるいは娘の娘を迎え入れ、その裸をあらわにしてはならない[b]。彼女たちはその女の近親者である。これは淫らな行為である[c]。


    [a] 「裸をあらわにする」は、ここでは禁じられた性的関係を持つことを表すヘブライ語の慣用表現。


    [b] 「その裸」の「その」がだれを指すかは、原文では明示されていない。最初に述べられた女を指すとも、それぞれの孫娘を指すとも理解できる。


    [c] 「悪らつな行為」「恥ずべき行為」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裸をあらわにする」は、ここでは禁じられた性的関係を持つことを表すヘブライ語の慣用表現。
    reason: cultural_note
  - marker: b
    text: 「その裸」の「その」がだれを指すかは、原文では明示されていない。最初に述べられた女を指すとも、それぞれの孫娘を指すとも理解できる。
    reason: textual_ambiguity
  - marker: c
    text: 「悪らつな行為」「恥ずべき行為」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: 裸をあらわにする
  rationale: レビ記の近親関係規定で用いられる法的な慣用表現を保ちつつ、脚注で禁じられた性的関係を意味することを明示する。
- source_word: אִשָּׁה
  choice: ある女
  rationale: 「妻」に限定せず、女とその子孫を対象とする原文の広さを保つ。
- source_word: תִקַּח
  choice: 迎え入れる
  rationale: 字義的な「取る」を不自然に直訳せず、結婚だけに限定しないまま、女を性的・婚姻的な相手として取る文脈を表す。
- source_word: בַּת בְּנָהּ / בַּת בִּתָּהּ
  choice: その女の息子の娘／娘の娘
  rationale: 父方・母方のどちらを通じた孫娘かという原文の法的な区別を保つ。
- source_word: שַׁאֲרָה הֵנָּה
  choice: 彼女たちは近い血縁にある
  rationale: 字義的な「彼女の肉」を現代日本語で分かる血縁表現にし、女性複数の指示も保つ。
- source_word: זִמָּה
  choice: 淫らな行為
  rationale: 性的に倒錯した重大な悪行を指す語として、文脈に即した明瞭で厳粛な表現を選ぶ。脚注で意味範囲も示す。
theological_decisions:
- issue: לְגַלּוֹת עֶרְוָתָהּ の女性単数接尾辞の指示対象
  choice: 「その裸」として指示対象を確定しない
  alternative: 「最初に述べられた女の裸」または「それぞれの孫娘の裸」と明示する
  rationale: 原文の女性単数接尾辞は、最初の女との法的連結を示すとも、直前の各孫娘を配分的に指すとも読めるため、本文では曖昧さを保持し、脚注で両解釈を示す。
- issue: תִקַּח の法的な射程
  choice: 「迎え入れる」とし、婚姻のみに限定しない
  alternative: 「めとる」または「妻とする」
  rationale: この規定は婚姻契約だけでなく性的な近親関係を禁じるため、後続の慣用句と組み合わせて原文の広さを保つ。
- issue: זִמָּה の道徳的評価
  choice: 「淫らな行為」
  alternative: 「悪らつな行為」または「恥ずべき行為」
  rationale: 性的文脈と強い非難をともに伝えながら、特定教派の術語を持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語による法文調。過度に古風な「娶る」「取る」を避けつつ、命令の厳粛さを「してはならない」で保った。親族名称は法的な精確さを優先して原文どおりに表した。
