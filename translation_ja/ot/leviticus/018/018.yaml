source:
  edition: WLC
  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: ja
  text: また、妻が生きている間に、その姉妹をもう一人の妻として迎え、妻と張り合う関係に置くために、その姉妹の裸をあらわにしてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、妻が生きている間に、その姉妹を妻に加えて迎え、妻と競合させるために、その姉妹の裸をあらわにしてはならない。」ヘブライ語は簡潔で、「姉妹に加えて」と「競合させるために」の関係には複数の訳し方がある。ここでは、妻の存命中にその姉妹を追加の妻として迎えることを禁じる意味と理解した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה ... לֹא תִקָּח
  choice: また、…その姉妹を妻に迎えてはならない
  rationale: אִשָּׁה は「女」「妻」の両義を持つが、לקח と婚姻法の文脈から、自然な現代日本語として「妻に迎える」とした。
- source_word: אֶל אֲחֹתָהּ
  choice: その姉妹を
  rationale: 直訳的には「彼女の姉妹のところに／加えて」だが、姉妹を既存の妻に加えて迎える関係は、文全体と「妻が生きている間に」によって示した。
- source_word: לִצְרֹר
  choice: 競い合う者とし
  rationale: צרר のここでの不定詞は、二人の姉妹を対立・競合する関係に置くことを表す。「競い合う者」は「 rival 」の意味を保ちつつ、結果を示す構文にした。
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: その裸をあらわにして
  rationale: レビ記で性的関係を指す定型的な婉曲表現を、解釈的に言い換えず保持した。
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: 妻が生きている間に
  rationale: 「彼女の生存中に」の代名詞が最初の妻を指すことを日本語で明確にし、禁止の時間的範囲を示した。
theological_decisions:
- issue: 一夫多妻および姉妹婚に対する禁止の範囲
  choice: 妻の存命中、その姉妹を追加の妻として迎えることを禁じる。
  alternative: 最初の妻の死後も含め、姉妹二人との婚姻を一律に禁じる。
  rationale: בְּחַיֶּיהָ（彼女の生存中に）が明示する時間的限定を保持し、本文が述べる範囲を越えて禁止を拡張しない。
- issue: לִצְרֹר が示す関係
  choice: 姉妹同士を競合する妻の関係に置くこと。
  alternative: 対立の有無を問わず、二人の姉妹との婚姻だけを指す。
  rationale: 語の持つ敵対・競合の含意を訳文に残しつつ、婚姻法の文脈を明確にした。
translation_notes:
  register: 現代標準日本語による、明瞭で格調ある法令調。「裸をあらわにする」はレビ記の定型表現として保持した。「姉妹」は姉または妹の双方を含む。
