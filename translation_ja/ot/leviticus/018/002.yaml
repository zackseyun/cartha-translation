  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: ja
  text: 「イスラエルの子らに語り、彼らにこう言いなさい。『わたしはヤハウェ[a]、あなたがたの神である。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」はヘブライ語の神名YHWH（四文字神名）。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: 語り
  rationale: モーセに対する命令形であり、神の指示を民に伝える文脈にふさわしい、自然で格調ある表現。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの子ら」だが、ここでは契約共同体全体を指す。現代日本語で性別を不必要に限定せず、意味を明瞭に伝える。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: 彼らにこう言いなさい
  rationale: 接続された命令の流れと、後続する直接話法への導入を自然に示す。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェ
  rationale: 独立代名詞による自己提示と固有の神名を明確に保持する。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神である
  rationale: 二人称男性複数接尾辞を「あなたがたの」とし、文脈上単数を指す אֱלֹהִים を「神」と訳す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された四文字神名を称号へ置き換えず、固有名として音写する。伝統的な代読も脚注で示す。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的意味
  choice: イスラエルの人々
  alternative: イスラエルの子ら
  rationale: 原語の家族的・契約的背景を認めつつ、この箇所で民全体を指す機能を明瞭な現代日本語で表す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令と神の自己宣言の簡潔な調子を保ち、神名は音写した。
