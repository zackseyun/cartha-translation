  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: ja
  text: しかし、あなたがた自身は、わたしの掟と法の定めを守らなければならない。土地に生まれた者も、あなたがたの間に住む寄留者[a]も、これらの忌むべきことを一つたりとも行ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの間に住む外国人」とも訳せる。
    reason: גֵּר は単なる一時的な旅人ではなく、イスラエルの共同体内に居住する非生来の者を指し得るため、説明的な別訳を示す。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: しかし、あなたがた自身は……守らなければならない
  rationale: 接続詞を文脈上の対照として「しかし」とし、独立代名詞 אַתֶּם の強調を「あなたがた自身」で表した。契約・法規の文脈における שׁמר の遵守義務は「守らなければならない」とした。
- source_word: חֻקֹּתַי וְאֶת מִשְׁפָּטַי
  choice: わたしの掟と法の定め
  rationale: חֻקּוֹת は制定された規範として「掟」、מִשְׁפָּטִים は法的・司法的な決定や規定の含意を保つため「法の定め」とした。
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל
  choice: 一つたりとも行ってはならない
  rationale: 否定文中の מִן＋כֹּל が示す全面的禁止を、自然で強い現代日本語にした。עשה の広い意味は「行う」で保持した。
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: これらの忌むべきこと
  rationale: תּוֹעֵבָה の強い道徳的・祭儀的嫌悪を保ちつつ、現代の一般読者に明瞭な表現とした。
- source_word: הָאֶזְרָח
  choice: 土地に生まれた者
  rationale: その土地・共同体に属する生来の者を指し、הַגֵּר との対比が伝わるようにした。「市民」は近代的な法的身分を連想させるため避けた。
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: あなたがたの間に寄留する者
  rationale: גֵּר と同語根の分詞 הַגָּר の結び付きを「寄留する者」で簡潔に表し、共同体内に居住する非生来の者という意味を保持した。
theological_decisions:
- issue: 禁止命令が土地に生まれた者と寄留者の双方に及ぶ範囲
  choice: 土地に生まれた者にも、共同体の中に寄留する者にも同じ禁止が及ぶと訳した。
  alternative: 末尾の二つの名詞句を、命令の対象を並べて特定する同格的な補足として、等しさを明示せずに訳すこともできる。
  rationale: 統語上、הָאֶזְרָח と הַגֵּר はともに禁止の対象である。日本語では主語を前に出し、両者に禁止が及ぶことを明瞭にしたが、本文にない身分上の同一性までは主張していない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法規としての厳粛さを保った。「一つたりとも」は全面的禁止を自然に強調する。脚注記号は、その語を説明する「寄留する者」の直後に置いた。
