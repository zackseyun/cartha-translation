  source_fidelity: ヘブライ語本文の命令複数形（「告げなさい」）、宛先（「イスラエルの子ら」）、引用導入、食用として許可される対象、部分を示す מן（「…のうち」）、および地上の動物という範囲を正確に反映している。「生き物は、次のものである」は、単数の זֹאת הַחַיָּה が後続する分類・列挙を導入する用法を、自然な日本語で適切に表す。
