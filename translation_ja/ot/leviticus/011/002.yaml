id: LEV.11.2
reference: Leviticus 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: ja
  text: イスラエルの子ら[a]にこう告げなさい。「地上[c]にいるすべての動物のうち、あなたがたが食べてよい生き物は、次のものである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエルの民」「イスラエル人」。ヘブライ語の字義は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語の字義は「これは、あなたがたが食べてよい生き物である」。単数形の表現だが、ここではこれから挙げる種類を集合的に導入している。
    reason: lexical_alternative
  - marker: c
    text: または「陸上」。この句は、この章で後に扱われる水中などの生物と区別している。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: 告げなさい
  rationale: 複数形の命令で、文脈上モーセとアロンに向けられている。神の指示を民に伝える場面に合う、明瞭で自然な表現とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの家族的表現を保ちつつ、現代日本語でも理解できる形にした。「イスラエル人」も集合的意味を自然に表す選択肢である。
- source_word: לֵאמֹר
  choice: こう
  rationale: 直接話法を導く定型的な引用表現。日本語では「こう告げなさい」とまとめることで、冗長さを避けながら機能を明確に示す。
- source_word: זֹאת הַחַיָּה
  choice: 生き物は、次のものである
  rationale: ヘブライ語は指示詞と名詞が単数形だが、ここでは後続する種類全体を分類的・集合的に導入している。日本語ではその機能が自然に伝わるよう「次のもの」とした。
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: あなたがたが食べてよい
  rationale: 二人称複数の未完了形を、食物規定における許可の意味として表した。
- source_word: מִכָּל
  choice: すべての…のうち
  rationale: より大きな集合から選び出す部分の意味を明示する。
- source_word: הַבְּהֵמָה
  choice: 動物
  rationale: 家畜を指すこともある語だが、ここでは地上の動物を広く扱う文脈なので、範囲を不必要に狭めない訳語とした。
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: 地上にいる
  rationale: 後に扱われる水中の生物などと区別される陸上の生物を示す。簡潔で自然な現代日本語とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法の指示としての厳粛さを保った。「子ら」は原文の家族的表現を残すために採用し、その自然な代案を脚注に示した。引用導入は日本語らしく「こう告げなさい」とし、単数形の集合的・分類的機能は「次のもの」で表した。
