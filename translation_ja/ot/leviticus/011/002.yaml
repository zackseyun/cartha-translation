  terminology: 「イスラエルの子ら」は בְּנֵי יִשְׂרָאֵל の家族的・字義的表現を保ち、代替訳は脚注で適切に示されている。「生き物」と「動物」の使い分けも、原文の חַיָּה と בְּהֵמָה を不必要に同一化せず、文脈上十分に機能している。脚注b・cは各アンカーに対応し、英語監査記録の集合的用法および「地上／陸上」の選択肢を適切に反映する。
