  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: ja
  text: 群がり動くどんな生き物によっても、自分自身を忌むべきものとしてはならない[a]。また、それらによって自分を汚してはならない。それらによって汚れた者とならないように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「群がり動くどんな生き物」は、「這い動くどんな生き物」とも訳せる。ヘブライ語は、群がる、うごめく小動物の類を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: 自分自身を忌むべきものとしてはならない
  rationale: שׁקץの「忌むべきものとする」という意味と、נפשの再帰的な用法を保つ。「汚す」とはせず、後続するטמאとの語義上の区別を維持した。
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 群がり動くどの生き物によっても
  rationale: 名詞と同根動詞の反復が示す、生き物が群がり、うごめくという広い範疇を簡潔な現代日本語で表した。「這うもの」だけに限定される印象を避けた。
- source_word: תִטַּמְּאוּ
  choice: 自分を汚してはならない
  rationale: 再帰的な形を「自分を汚す」で示し、行為への禁止として訳した。レビ記における祭儀的な汚れを指す文脈を保つ。
- source_word: וְנִטְמֵתֶם
  choice: 汚れた者とならない
  rationale: 前の再帰的な禁止に続く状態への移行を表し、同じ語根の反復も可能な限り保った。接続関係は目的・結果の含みを持つものとして本文では「ため」とした。
- source_word: בָּהֶם／בָּם
  choice: それらによって
  rationale: 当該の生き物が汚れをもたらす手段・契機であることを示し、原文の反復も保った。
theological_decisions:
- issue: レビ記の清浄規定におけるטמאの訳語
  choice: 汚す／汚れた者となる
  alternative: 不浄にする／不浄になる
  rationale: ここでの語は契約共同体における祭儀的な汚れを指し得る。「汚れ」は日本語聖書の文脈でも理解しやすく、道徳的罪責だけに狭めない。
- issue: וְנִטְמֵתֶםの論理関係
  choice: それらによって汚れた者とならないためである
  alternative: そうして、それらによって汚れた者となる／それらによって汚れた者とならないように
  rationale: 禁止命令に続く文脈から目的・回避される結果として表したが、ヘブライ語の接続詞自体は単純な連結にも読めるため、異読を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の反復を生かしつつ、「群がり動く」でשׁרץの広い生物分類を示した。脚注bを付すため、本文末の対応箇所に[b]を置く必要がある。
