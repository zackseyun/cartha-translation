source:
  edition: WLC
  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: ja
  text: ただし、泉や貯水槽、すなわち水の集まる場所は、清いままである。しかし、それらの死骸に触れる者は汚れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 前節までの汚れに関する規定に対する例外を示す語として、制限の意味を強めすぎず、現代日本語で明瞭に対比を示す。
- source_word: מַעְיָן
  choice: 水の湧く泉
  rationale: 自然に水が湧き出る水源を指すことを、普通の読者に明確に伝える。
- source_word: בּוֹר
  choice: 貯水槽
  rationale: この文脈では水を蓄える人工の設備を指すと考えられ、「穴」や「井戸」よりも意味が明確である。
- source_word: מִקְוֵה מַיִם
  choice: 水をためる
  rationale: 字義的には「水の集まり」であり、泉と貯水槽に関わる表現として日本語で自然になるように訳した。別の構文理解が可能なため脚注で示した。
- source_word: יִהְיֶה טָהוֹר
  choice: 清いままである
  rationale: 直訳は「清いものである」だが、前節の死骸による汚れを受けないという文脈上の継続性を自然に表す。
- source_word: נֹגֵעַ
  choice: 触れる者
  rationale: 実体詞的に用いられた分詞の一般的な適用を、簡潔な現代日本語で表す。
- source_word: נִבְלָתָם
  choice: それらの死骸
  rationale: 接尾辞は前文脈の複数の小動物を受け、נְבֵלָה は動物の死骸を指す。集合的単数の形を日本語で自然に表した。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: レビ記の祭儀上の状態変化を表す定型語として、道徳的な罪悪と混同しにくい表現を用いた。
theological_decisions:
- issue: 祭儀的清浄を表す用語
  choice: 清い／汚れる
  alternative: 純粋である／不浄になる
  rationale: 本文は道徳的評価ではなく祭儀上の清浄状態を扱う。「清い／汚れる」はレビ記の対概念を平易に保ち、後代の教派的解釈を加えない。
- issue: 水源が清いことの時間的含意
  choice: 清いままである
  alternative: 清いものである
  rationale: ヘブライ語自体は単に「清いものである」とも訳せるが、直前の汚染規定に対する例外なので、汚れず清浄状態を保つという文脈上の意味を訳文に反映した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「清い」「汚れる」はレビ記の祭儀的文脈を示す用語として一貫して用い、道徳的意味を不用意に加えない。
