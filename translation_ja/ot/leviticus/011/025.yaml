  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: ja
  text: また、これらの死骸のいずれかを運ぶ者は皆、自分の衣服を洗わなければならず、夕方まで汚れた者となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: また、…運ぶ者は皆
  rationale: וְ は前の規定とのつながりを示し、כָּל と分詞の組み合わせは該当者全員を指す。נָשָׂא はこの文脈では死骸を持ち運ぶことを表す。
- source_word: מִ/נִּבְלָתָ/ם
  choice: これらの死骸のどれかを
  rationale: נְבֵלָה は祭儀的清浄規定における動物の死骸を指す。מִן を伴う構文の分配的な意味を、自然な日本語で明確にした。
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: 衣服を洗わなければならず
  rationale: 未完了形はここで法的義務を表す。「洗わなければならない」によって規定としての拘束力を自然な現代日本語で示す。文全体との接続のため連用形にした。
- source_word: וְ/טָמֵא
  choice: 汚れている
  rationale: טָמֵא は道徳的な悪ではなく祭儀上の汚れた状態を表す。レビ記で通用する簡潔な表現を採用した。
- source_word: עַד הָ/עָרֶב
  choice: 夕方まで
  rationale: 汚れた状態が続く期限を表す。冠詞を日本語で不自然に明示せず、自然で正確な表現とした。
theological_decisions:
- issue: 一般的な法規定における男性単数形の扱い
  choice: 「者は皆」とし、所有代名詞を明示せず「衣服」とする
  alternative: 「彼は自分の衣服を」と男性単数を明示する
  rationale: ヘブライ語の男性単数は代表的な個人を表す。日本語では「者は皆」と「衣服」によって単数形の法規定の一般性を自然に保て、原文にない性別限定を強く印象づけずに済む。
- issue: טָמֵא の性質
  choice: 「汚れている」
  alternative: 「不浄となる」
  rationale: ここでの汚れは祭儀上の状態であり、道徳的罪悪を意味しない。「汚れている」は文脈上その区別を保ちながら、一般読者にも理解しやすい。
translation_notes:
  register: レビ記の法規定にふさわしい端正さを保ちつつ、現代の一般読者に分かりやすい表現とした。「死骸」「衣服」「夕方まで」は簡潔で一貫性のある祭儀法の語彙である。
