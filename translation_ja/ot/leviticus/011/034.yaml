  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: ja
  text: 食べ物として食べられるものはどれも[a]、水がかかれば汚れる。また、どの器に入っていても、飲み物として飲まれるものはすべて汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「食べられる食べ物はどれも」。
    reason: 原文の同語根的な「食べ物／食べられる」という構造と、類別表現を示すため。
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: 食べ物として食べられるものはどれも
  rationale: 前置詞を伴う כָּל の包括的・類別的な意味と、הָאֹכֶל の「食物」という意味を、自然な現代日本語で表した。
- source_word: אֲשֶׁר יֵאָכֵל
  choice: 食べられる
  rationale: ニファル未完了形が示す「食用となる／食べることのできる」という適格性を保つ。「食べられた」と過去の出来事には限定しない。
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: 水がかかれば
  rationale: 直訳は「その上に水が来る」である。律法上の条件として自然に読めるよう条件形とし、水をかける行為者は補わなかった。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 祭儀上、汚れた状態になることを表す。日常的な物理的汚損ではなくレビ記の清浄規定上の語として文脈から明瞭であり、簡潔な定訳調を採った。
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: 飲み物として飲まれるもの
  rationale: מַשְׁקֶה を「飲み物」とし、ニファル形の修飾節を残して、飲用に供されるものという類別を示した。
- source_word: בְּכָל כְּלִי
  choice: どの器に入っていても
  rationale: בְּ の位置関係と כָּל の包括性を自然な日本語にした。כְּלִי はこの祭儀的文脈に合う「器」とした。
theological_decisions:
- issue: יִטְמָא が示す汚れの性質
  choice: 「汚れる」と訳し、本文中に「儀式的」などの説明語を加えない
  alternative: 「儀式上汚れたものとなる」
  rationale: 文脈上は祭儀的な汚れだが、原文自体に限定修飾語はない。レビ記の語彙上の連続性を保ち、解釈説明を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法文としての包括性と条件関係を保ちつつ、過度に逐語的な語順は避けた。
