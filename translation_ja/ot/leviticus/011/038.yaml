source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: ja
  text: しかし、種に水がかけられ、その上にそれらの死骸のいずれかが落ちたなら、その種はあなたがたにとって汚れたものとなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: しかし、…なら
  rationale: 前節との対照を示しつつ、律法の条件文として自然な日本語にした。
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: 種に水がかけられた後
  rationale: ホファルの受動態を「かけられた」で保持し、後続の出来事との順序と、すでに湿った状態が問題であることを自然に表した。
- source_word: וְנָפַל
  choice: 落ちたなら
  rationale: 条件法的な事例規定として、日本語で自然な過去形を用いた。
- source_word: מִנִּבְלָתָם
  choice: これらのものの死骸の一部
  rationale: נְבֵלָהを動物の「死骸」とし、מִןの部分用法を明示した。複数の死骸のうち一つとも、一つの死骸の一部とも取り得る原文の幅を保つ。
- source_word: עָלָיו
  choice: その上に
  rationale: 男性単数のזֶרַעを受け、種を指すことが明確になるよう訳した。
- source_word: טָמֵא הוּא לָכֶם
  choice: その種はあなたがたにとって汚れたものである
  rationale: 祭儀上の状態を表す定型句として「汚れた」を用い、לָכֶםも「あなたがたにとって」と反映した。
theological_decisions:
- issue: 「汚れ」の性質
  choice: 祭儀上の汚れを表す「汚れた」
  alternative: 道徳的な罪や腐敗を含意する表現
  rationale: 文脈はレビ記の清浄規定であり、道徳的罪責ではなく祭儀上の状態を宣言している。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で dignified な法令調。「死体」より動物に適した「死骸」を選び、「その種」を補って指示対象を明確にした。
