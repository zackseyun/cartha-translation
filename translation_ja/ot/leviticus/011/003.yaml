  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: ja
  text: 陸の動物のうち、ひづめが分かれ、完全に二つに割れていて[a]、反芻する[b]ものは、どれでも食べてよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「ひづめを分け、ひづめの裂け目を裂いている」。ヘブライ語は関連する二つの表現を重ね、ひづめが完全に分かれていることを示している。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「反芻した食物を口に戻す」。すなわち、反芻すること。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: どれでも
  rationale: 後続する特徴を備えた動物のすべてを分配的に指す。許可を示す規定として自然な現代日本語である。
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: ひづめが分かれ
  rationale: 字義的には「ひづめを分ける」。身体的特徴を平明に表し、続く同語根表現との重なりも保つ。
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: 完全に二つに割れていて
  rationale: 先の「ひづめが分かれ」をさらに限定し、ひづめが真に二分されている状態を示す。ヘブライ語の反復的な強調を読みやすく伝える。
- source_word: מַעֲלַת גֵּרָה
  choice: 反芻する
  rationale: 字義的には「反芻物を上げる」。現代日本語では動物の行動を正確かつ簡潔に示す標準的表現である。
- source_word: בַּבְּהֵמָה
  choice: 陸の動物のうち
  rationale: この食物規定の文脈では、魚類や鳥類と区別される地上の動物の分類を指す。「家畜」では範囲が狭すぎるため避けた。
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: ものは、どれでも食べてよい
  rationale: 命令として食べることを要求するのではなく、条件に合う動物を食用として許可する規定なので、「食べてよい」とした。
