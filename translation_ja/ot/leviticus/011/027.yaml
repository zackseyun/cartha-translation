source:
  edition: WLC
  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: ja
  text: また、四つ足で歩くすべての動物のうち、足の裏で歩くものは、あなたがたには汚れたものである。それらの死骸に触れる者はだれでも、夕方まで汚れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: また、足の裏をつけて歩くものはすべて
  rationale: כַּף は手のひら・足の裏を指し、ここでは動物が足裏を地につけて歩く姿を表す。「肉球」では狭すぎるため、自然で意味範囲の広い表現とした。
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: 四つ足で歩く動物のうち
  rationale: חַיָּה はこの食物規定では陸生動物を指す。集合的な単数表現を日本語で自然な分類表現にした。
- source_word: טְמֵאִים הֵם לָכֶם
  choice: あなたがたには汚れたものである
  rationale: טמא は道徳的な罪よりも祭儀上の状態を表すため、レビ記で定着した「汚れた」を用いた。
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: その死骸に触れる者はだれでも
  rationale: נְבֵלָה は動物の死骸を指す。ヘブライ語の名詞は単数で複数接尾辞を伴う集合的表現だが、日本語では各該当動物の死骸を受ける「その死骸」が明瞭である。
- source_word: יִטְמָא עַד הָעָרֶב
  choice: 夕方まで汚れる
  rationale: 法規文中の未完了形を規定として簡潔に訳し、祭儀上の状態が夕方まで続くことを示した。
theological_decisions:
- issue: 祭儀的清浄の用語
  choice: 汚れた／汚れる
  alternative: 不浄である／不浄になる
  rationale: ここで扱われるのは主として道徳的罪責ではなく祭儀上の身分である。「汚れ」は現代日本語の聖書文体で理解されやすく、この区別を保てる。
translation_notes:
  register: 現代標準日本語による、明瞭で簡潔な法規文体。「足の裏をつけて歩く」により、原語の身体部位の比喩を過度に動物種へ限定せずに伝えた。
