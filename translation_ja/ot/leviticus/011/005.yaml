id: LEV.11.5
reference: Leviticus 11:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ja
  text: また、岩だぬき[a]は、反芻するが、ひづめが分かれていないので、あなたがたには汚れたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ハイラックス」ともいう。岩場にすむ小型の哺乳類。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: 岩だぬき
  rationale: 岩場にすむ小型哺乳類ハイラックスを指すと考えられる。本文では日本語として比較的分かりやすい「岩だぬき」を用い、動物学的に明確な名称を脚注に示した。
- source_word: כִּי
  choice: ので
  rationale: この動物が汚れたものとされる理由を導く因果関係を、現代日本語として自然に表した。
- source_word: מַעֲלֵה גֵרָה
  choice: 反芻する
  rationale: 字義的には「食べ戻しを上げる」。食物規定における動作を簡潔かつ慣用的に表す語として「反芻する」を採用した。
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: ひづめが分かれていない
  rationale: ひづめが二つに分かれていないという分類基準を、明快な現代日本語で表した。
- source_word: טָמֵא
  choice: 汚れたもの
  rationale: レビ記の祭儀的・法的な清浄規定に属する状態を表し、動物そのものの道徳的悪を意味する表現にはしなかった。
- source_word: לָכֶם
  choice: あなたがたには
  rationale: この分類が語りかけられている共同体に適用されることを明示した。
theological_decisions:
- issue: レビ記の食物規定における טָמֵא の性質
  choice: 祭儀上の分類を示す「汚れたもの」
  alternative: 道徳的に不純または邪悪なもの
  rationale: 文脈上、語は食物規定における清浄・不浄の法的、祭儀的地位を示す。動物に道徳的悪を帰する解釈は加えない。
- issue: ハイラックスについての מַעֲלֵה גֵרָה の表現
  choice: 本文の分類表現を保ち「反芻する」と訳す
  alternative: 現代動物学に合わせて動作を説明し直す
  rationale: ここでは古代本文が用いる食物分類の言い方を訳し、現代の動物学的分類によって本文を修正しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く列挙を冒頭の「また」で示した。「ひづめ」は一般読者への読みやすさを優先して平仮名表記とした。
