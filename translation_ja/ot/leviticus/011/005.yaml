  source_fidelity: ヘブライ語は「岩だぬき（שפן）についても、それは反芻するが、ひづめを分けないので、あなたがたにとって汚れたものである」という構文であり、訳文は因果関係、反芻、分かれたひづめの欠如、不浄の法的分類、共同体への適用を過不足なく反映している。「反芻する」は現代動物学的な分類を本文に持ち込まず、古代の食物規定の表現を保つ適切な訳語である。
  naturalness: 「また、岩だぬきは、反芻するが、ひづめが分かれていないので、あなたがたには汚れたものである」は明瞭で自然な現代標準日本語である。列挙の継続を示す「また」も文脈に適する。
  terminology: 「岩だぬき」はשפןの読みやすい日本語訳として適切であり、脚注の「ハイラックス」が動物学的名称を補う。「反芻」「ひづめ」「汚れたもの」はレビ記11章の分類語彙として一貫している。「汚れたもの」は道徳的非難を加えず、儀礼的・法的な不浄のカテゴリーを適切に保つ。
