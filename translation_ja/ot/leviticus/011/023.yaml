id: LEV.11.23
reference: Leviticus 11:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: ja
  text: しかし、翼があり、群がる生き物で、四本の足を持つものはすべて、あなたがたには忌むべきものである[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「飛び回るもののうち、群がる生き物」。このヘブライ語表現は、主に昆虫など、群がって飛ぶ小さな生き物を広く指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「四本の足」。ここで「足」は「脚」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: しかし…すべて
  rationale: 接続詞 וְ は通常「そして」だが、前節の食べてよいものとの対比を示すため、ここでは「しかし」とした。כֹל の包括的な意味は「すべて」で保持した。
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: 翼があり、群がる生き物
  rationale: 小さな生き物が群がるという שֶׁרֶץ の意味と、飛ぶ生き物を表す עוֹף の意味を合わせて表現した。主に昆虫類を指すが、本文では範囲を狭めすぎない訳語とした。
- source_word: אֲשֶׁר ל/וֹ
  choice: …を持つもの
  rationale: 所有を表すヘブライ語の関係節を、現代日本語として自然な表現にした。
- source_word: אַרְבַּע רַגְלָיִם
  choice: 四本の足
  rationale: רַגְלַיִם は「足」または「脚」を意味する。原文の表現を直接保ちつつ、日本語で理解しやすい「足」とした。
- source_word: שֶׁקֶץ הוּא לָ/כֶם
  choice: あなたがたには忌むべきものである
  rationale: 動詞のない名詞文を「である」で補い、שֶׁקֶץ の強い拒絶と食物規定上の禁止を、「汚れた」と同一視せず「忌むべき」と訳した。לָכֶם は「あなたがたには」として対象を明示した。
theological_decisions:
- issue: שֶׁקֶץ と儀礼的な汚れとの関係
  choice: 忌むべきもの
  alternative: 汚れたもの／忌まわしいもの
  rationale: 本文の שֶׁקֶץ は嫌悪され、食用を禁じられるものを示すが、טָמֵא（汚れた）そのものではない。両概念を訳文で不用意に同一化しないため「忌むべきもの」とした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「群がる生き物」により分類語としての広さを保ち、「忌むべきもの」で祭儀・食物規定上の強い禁止を示した。
