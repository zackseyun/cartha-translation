  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: ja
  text: コウノトリ、サギ[a]の類[c]、ヤツガシラ[b]、コウモリ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サギ」と訳したヘブライ語がどの鳥を指すかは確定しておらず、トキなど、別の脚の長い水鳥を指す可能性もある。
    reason: lexical_alternative
  - marker: b
    text: 古くは「タゲリ」と訳されることもあったが、このヘブライ語はヤツガシラを指す可能性が高い。
    reason: alternative_reading
  - marker: c
    text: 「の類」は、サギという大まかな鳥の区分に属するさまざまな種類を指す表現。
    reason: cultural_note
lexical_decisions:
- source_word: חֲסִידָה
  choice: コウノトリ
  rationale: この鳥名の伝統的かつ最も広く支持される同定を採用した。語源上は「忠実・慈しみ」と関連する可能性があるが、ここでは鳥の名称として訳す。
- source_word: אֲנָפָה
  choice: サギ
  rationale: 正確な鳥種の同定には不確かさがあるものの、長い脚を持つ水鳥を指す名称として「サギ」が有力で、現代日本語でも明瞭である。不確かさは脚注に示す。
- source_word: לְמִינָהּ
  choice: の類
  rationale: 一つの一般的な鳥の型に属する複数の種類を含む分類表現。日本語の列挙として自然でありながら、ヘブライ語の分類的意味を保つ。
- source_word: דּוּכִיפַת
  choice: ヤツガシラ
  rationale: 古い訳語に見られるタゲリよりも、現代の語彙学的・動物学的判断ではヤツガシラの可能性が高い。
- source_word: עֲטַלֵּף
  choice: コウモリ
  rationale: 同定は確実である。現代の分類では哺乳類だが、本文は飛ぶ生き物を外見と行動に即して列挙しているため、そのまま訳す。
- source_word: וְאֵת / וְאֶת
  choice: 読点による列挙
  rationale: 接続詞付きの目的語標識が反復されるが、日本語では各項目を「また」で重ねるより、読点で並べるほうが自然で明瞭である。
theological_decisions: []
translation_notes:
  register: 簡潔な禁食動物一覧として、現代標準日本語の一般的な鳥名を用いた。原文の反復接続は日本語では読点に整理し、分類句は「の類」と簡潔に表した。語の同定に残る不確かさは本文で断定的に解消せず、脚注に明示した。
