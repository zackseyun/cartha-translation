id: LEV.11.28
reference: Leviticus 11:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: ja
  text: その死骸[a]を運ぶ者は、衣服を洗わなければならない。その人は夕方まで汚れた者となる。それらは、あなたがたにとって汚れたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それらの死骸」。ヘブライ語は、ここで述べられている動物それぞれの死骸を分配的に指すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: その死骸を運ぶ者は
  rationale: 冠詞付き分詞の一般的・法規的な用法を、現代日本語で自然な「…者は」とした。接続詞 וְ は文脈上、日本語で明示しなくても連続性が保たれる。
- source_word: נִבְלָתָם
  choice: その死骸
  rationale: נְבֵלָה は動物の死骸を指す。複数接尾辞は前節の動物群を受けるが、文脈上は各動物の死骸を分配的に指し得るため、日本語本文では自然な単数形とし、別解を脚注に示した。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗わなければならない
  rationale: 法規文中の未完了形が持つ命令・義務の力を、明瞭な現代日本語で表した。「衣服」は בְּגָדִים の自然で格調を損なわない訳語である。
- source_word: וְטָמֵא
  choice: その人は…汚れた者となる
  rationale: 死骸を運んだ結果として生じる祭儀上の状態を明確にし、洗濯の義務とは別の文にして誤読を避けた。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 期間の終点を示すヘブライ語を、簡潔で自然な日本語にした。
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: それらは、あなたがたにとって汚れたものである
  rationale: 複数代名詞が前の文脈の動物を指すことを保ち、לָכֶם も「あなたがたにとって」と明示した。
theological_decisions:
- issue: 祭儀的な汚れを表す用語
  choice: 汚れた／汚れた者
  alternative: 不浄である／身を汚す
  rationale: טמא はレビ記の清浄規定における専門的な祭儀上の状態であり、道徳的罪責を自動的に意味しない。「汚れた」を用いることで、本文のカテゴリーを保ちつつ過剰な解釈を避けた。
translation_notes:
  register: 明瞭な現代標準日本語による法規文の文体。義務と、その結果生じる祭儀上の状態を分けて表現し、厳粛さを保ちながら読みやすくした。
