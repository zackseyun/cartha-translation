source:
  edition: WLC
  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: ja
  text: 羽をもつ群がる生き物[a]で、四本の脚で歩くもの[b]はすべて、あなたがたにとって忌むべきものである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「空を飛ぶ群がる生き物」。ヘブライ語の עוֹף は、鳥だけでなく、飛ぶ生き物を広く指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「四つの上を歩く」。四本の脚による移動を表す言い方だが、続く節では、跳ぶための脚を持つ特定の昆虫が例外とされる。
    reason: cultural_note
  - marker: c
    text: 別訳「あなたがたにとって忌まわしいものである」。ここでの語は、食物規定において儀礼的に忌避すべき対象であることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: すべて
  rationale: 法規の対象となる種類を例外なく包括する語であり、現代日本語でも自然に総称性を表せる。
- source_word: שֶׁרֶץ
  choice: 群がる生き物
  rationale: 小さく、群がり増える生き物を指す語。「這うもの」では移動様式に意味を狭めるため、群生・群動の含意を保った。
- source_word: הָעוֹף
  choice: 羽のある
  rationale: עוֹףは鳥だけでなく飛ぶ生き物を広く指し得る。この文脈では昆虫も含まれるため、「鳥」と限定せず、分類上の特徴を自然に示した。
- source_word: הַהֹלֵךְ
  choice: 歩く
  rationale: 分詞が表す特徴的な移動の仕方を、簡潔で直接的な日本語にした。
- source_word: עַל אַרְבַּע
  choice: 四つ足で
  rationale: 直訳は「四つの上を」。後続節との関係を残しつつ、日本語で身体による移動を自然に表すため「四つ足で」とした。
- source_word: שֶׁקֶץ
  choice: 忌むべきもの
  rationale: 食物規定において、宗教儀礼上嫌悪され排除される対象を示す。「汚れたもの」と同一視せず、強い忌避の意味を保った。
- source_word: לָכֶם
  choice: あなたがたには
  rationale: イスラエル共同体との関係において、そのように見なされるべきことを示す与格を明示した。
theological_decisions:
- issue: שֶׁקֶץが示す忌避の性格
  choice: 「忌むべきもの」とし、食物規定における儀礼上の忌避を表す
  alternative: 「憎むべきもの」「汚れたもの」
  rationale: 道徳的悪そのものと断定する表現や、別の主要語である「汚れ」との区別を失う表現を避け、本文の祭儀的・法的文脈を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法文らしい格調を保った。「群がる生き物」は日常語として理解可能でありながら、伝統的な「這うもの」より原語の範囲を適切に示す。語順は日本語として自然になるよう整えつつ、「すべて」と「あなたがたには」を明示して法規の包括性と適用対象を保持した。
