  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: ja
  text: 水の中にいるもので、ひれとうろこのないものはすべて、あなたがたにとって忌むべきものである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたにとって嫌悪すべきものである」。ヘブライ語「シェケツ」は、この食物規定の文脈では、儀礼上忌避され、嫌悪されるものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: …ものはすべて
  rationale: 包括的な範囲を示すכֹּלと関係節を、自然な現代日本語の総括表現で再現した。
- source_word: אֵין לוֹ
  choice: …のない
  rationale: 所有を表す存在否定を、日本語で簡潔かつ自然な欠如表現とした。
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ひれとうろこ
  rationale: ヘブライ語では単数形だが種類全般の特徴を指すため、日本語でも総称として自然な形にした。
- source_word: בַּמָּיִם
  choice: 水の中にいる
  rationale: 場所を表す句を関係節に自然に組み込み、水生のものを指すことを明瞭にした。
- source_word: שֶׁקֶץ
  choice: 忌むべきもの
  rationale: 食物規定の文脈における、儀礼上退けるべき嫌悪の対象という強い評価を保ち、「汚れたもの」を表す別語彙との混同を避けた。
- source_word: לָכֶם
  choice: あなたがたにとって
  rationale: イスラエル共同体への適用を示す与格を、現代日本語で明確に表した。
theological_decisions:
- issue: 食物規定におけるשֶׁקֶץの表現
  choice: 忌むべきもの
  alternative: 嫌悪すべきもの／忌まわしいもの
  rationale: 強い嫌悪と儀礼的禁止の含意を保ちつつ、原文にない一般的な「汚れ」の専門語へ置き換えないため。
translation_notes:
  register: 明快な現代標準日本語。律法本文にふさわしい簡潔で格調ある断定調を用い、「ひれ」「うろこ」は一般読者に分かりやすい表記とした。
