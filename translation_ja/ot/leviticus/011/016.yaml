  text: ダチョウ[a]、タカ、カモメ、ハヤブサの仲間。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節のヘブライ語の鳥名には、同定が確かでないものがいくつかある。伝統的には、「ダチョウ」を「フクロウ」、「タカ」を「ヨタカ」または「フクロウ」、「カモメ」を「カッコウ」、「ハヤブサ」を「タカ」とする訳もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: だちょう
  rationale: 字義的には「ヤアナーの娘」だが、鳥類一覧では鳥名として機能する。種の同定には不確かさがあるものの、同族語などの証拠から「だちょう」が有力である。
- source_word: הַתַּחְמָס
  choice: たか
  rationale: 正確な鳥種は不明。猛禽類を指す広い現代日本語として「たか」を用い、過度に限定しない。
- source_word: הַשָּׁחַף
  choice: かもめ
  rationale: 同定には不確かさがあるが、現代の辞書で広く支持される「かもめ」を採用した。
- source_word: הַנֵּץ
  choice: はやぶさ
  rationale: たか・はやぶさ類の猛禽を指す語。「たか」と訳した תַּחְמָס と区別しつつ、語義範囲内の「はやぶさ」とした。
- source_word: לְמִינֵהוּ
  choice: その類
  rationale: 分類上の種類・類ごとを表す定型句。日本語の一覧として自然になるよう、直前の「はやぶさ」に続けて「はやぶさの類」とした。
- source_word: וְאֵת / וְאֶת
  choice: 列挙の読点
  rationale: 接続詞付き直接目的語標識が前節から続く列挙を構成する。日本語では目的語標識を訳さず、接続詞の反復も読点による自然な並列で表した。
