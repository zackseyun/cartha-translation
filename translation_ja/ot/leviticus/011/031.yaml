- from: これらは、群がるすべての小動物のうち、あなたがたにとって汚れたものである。これらが死んだ状態で、それに触れる者はみな、夕方まで汚れる。
  to: これらは、群がる生き物すべてのうち、あなたがたにとって汚れたものである。これらの死骸に触れる者はみな、夕方まで汚れる。
  rationale: 死後の状態での接触を「これらの死骸に触れる」として明確化し、代名詞照応の不自然さを解消した。また、原語の広い生物分類を保つため「小動物」を「群がる生き物」に改めた。意味や法規文としての簡潔な文体は維持している。
