base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: ja
  text: これらは、群がる生き物すべてのうち、あなたがたにとって汚れたものである。これらの死骸に触れる者はみな、夕方まで汚れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: これらは、あなたがたにとって汚れたものである
  rationale: 指示語の複数形と、イスラエルに関わる儀礼上の汚れを表す与格的な表現を保った。「汚れた」はレビ記の清浄規定に適した標準的な訳語。
- source_word: בְּכָל הַשָּׁרֶץ
  choice: 群がるすべての小動物のうち
  rationale: שֶׁרֶץ は群がる、あるいは這い回る小さな生き物を広く指すため、特定の動物分類に狭めず、「小動物」とした。前置詞 בְּ はここでは分類範囲を示す「のうち」と理解した。
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: それに触れる者はみな
  rationale: 分配的かつ一般的な範囲を「者はみな」で表した。先行する集合を一つの分類として受け、日本語では自然な単数代名詞「それ」を用いた。
- source_word: בְּמֹתָם
  choice: これらが死んだ状態で
  rationale: 直訳は「それらの死において」だが、死ぬ瞬間よりも死骸となった状態での接触を指すため、その意味を明示した。
- source_word: יִטְמָא עַד הָעָרֶב
  choice: 夕方まで汚れる
  rationale: 接触の結果として生じる儀礼上の汚れと、その時間的限界を、簡潔な法規文体で表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、レビ記の法規としての簡潔さと厳粛さを保った。「汚れる」は衛生上ではなく儀礼上の状態を表す文脈的用語として用いている。
