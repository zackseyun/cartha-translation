source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: ja
  text: それらの死骸[a]の一部がその上に落ちた物はすべて、汚れたものとなる。かまどであれ、調理炉[b]であれ、壊さなければならない。それらは汚れており、あなたがたにとって汚れたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死体」とも訳せる。ヘブライ語はここで、清浄規定の対象となる汚れた生き物の死骸を指す。
    reason: lexical_alternative
  - marker: b
    text: 古代の調理設備を指す語で、こんろ、鍋を据える炉、炉床のような設備などを意味し得る。
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: それらの死骸
  rationale: נְבֵלָה は、特に清浄規定において死んだ動物の死骸を指す。「死体」よりも動物について自然であり、接尾辞の複数指示も「それらの」で保持した。文脈上、落ちるのは死骸そのものまたはその一部なので、「一部」を補って意味を明確にした。
- source_word: יִפֹּל
  choice: 落ちた
  rationale: 未完了形は継続的な法規の一般条件を表す。日本語では条件節を「落ちた」とすることで、恒常的な規定として自然に読める。
- source_word: עָלָיו יִטְמָא
  choice: 落ちた物は……汚れたものとなる
  rationale: 死骸が接触した対象が儀礼上の汚れた状態になるという結果を表す。「汚れる」だけより、清浄規定上の状態を明確に示す。
- source_word: תַּנּוּר
  choice: かまど
  rationale: パンなどを焼くための炉を指す。古代の設備に合い、現代日本語でも理解しやすい「かまど」とした。
- source_word: כִירַיִם
  choice: 調理炉
  rationale: 鍋を据える炉、こんろ、炉床などの調理設備を指し得る。特定の構造に限定しすぎず、用途が分かる「調理炉」とした。
- source_word: יֻתָּץ
  choice: 壊さなければならない
  rationale: 受動形で命じられる破壊を、日本語の法規として自然な義務表現にした。土製の調理設備を解体・破壊する意味を伝える。
- source_word: טְמֵאִים הֵם
  choice: それらは汚れており
  rationale: 道徳的な悪ではなく儀礼上の汚れを表すが、本文ではレビ記の鍵語として簡潔な「汚れ」を維持した。
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: あなたがたにとって汚れたものである
  rationale: לָכֶם の関係を「あなたがたにとって」で保持し、イスラエルの民がそれらを汚れたものとして扱うべきことを表した。
theological_decisions:
- issue: レビ記の清浄規定における טמא の性質
  choice: 本文では「汚れたもの」と訳す
  alternative: 「儀礼上汚れたもの」「宗教儀礼上不浄なもの」
  rationale: ここでの汚れは道徳的な悪ではなく清浄規定上の状態である。ただし、本文で説明を加えすぎず、文脈と語彙の一貫性を保つため「汚れたもの」とした。
- issue: 単数形 נִבְלָתָם の集合的な含み
  choice: 「それらの死骸」とし、落下物を「一部」と表す
  alternative: 「それらの死体」「それらの死骸そのもの」
  rationale: ヘブライ語は複数の動物を受けつつ死骸を集合的に表し得る。日本語では数を過度に固定せず、接触による汚れという規定の趣旨を自然に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法規としての厳粛さを保った。「かまど」と「調理炉」を区別しつつ、古代設備の形状を断定しない訳語と注を採用した。「汚れ」はレビ記の清浄規定における反復語として統一した。
