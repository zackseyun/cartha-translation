  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: ja
  text: それらの肉は少しでも食べてはならない。また、それらの死骸[a]に触れてはならない。これらはあなたがたにとって汚れたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死体」。ヘブライ語はここで、死んだ動物の体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: その肉を少しでも
  rationale: 前置詞 מִן の部分を表す働きを「少しでも」によって自然な日本語で示し、肉のどの部分も食べてはならないという禁止を表した。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならない
  rationale: 法規における明確な禁止として、現代日本語で自然かつ荘重な表現を用いた。
- source_word: וּבְנִבְלָתָם
  choice: その死骸
  rationale: נְבֵלָה は死んだ動物の体を指すため、人間にも広く用いられる「死体」より、文脈に即した「死骸」とした。
- source_word: לֹא תִגָּעוּ
  choice: 触れてはならない
  rationale: נגע の基本義を直接訳し、接触によって生じる儀礼上の含意は文脈に委ねた。
- source_word: טְמֵאִים הֵם לָכֶם
  choice: これらはあなたがたにとって汚れたものである
  rationale: טָמֵא をレビ記の清浄規定で一貫して用いうる「汚れた」とし、לָכֶם の関係的な意味を「あなたがたにとって」で保持した。
theological_decisions:
- issue: 食物規定における「汚れ」の性質
  choice: 「汚れた」と訳し、レビ記の清浄規定上の区分をそのまま示す
  alternative: 「儀礼的に汚れている」または「不浄である」と明示する
  rationale: 原文は טָמֵא という区分を述べるが、この節自体は後代の神学的適用や道徳的悪との関係を説明していないため、限定的な説明を本文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法規としての厳粛さを保った。「少しでも」によって部分を表す מִן を自然に反映した。英語参照訳の脚注は語義上 נְבֵלָה に対応するため、日本語本文では「死骸」に付した。
