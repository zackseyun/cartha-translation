source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: ja
  text: 水の中にいるもののうち、あなたがたが食べてよいのは次のものである。海や川[a]の水の中にいて、ひれとうろこのあるものはすべて、食べてよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「川」と訳したヘブライ語は、流れ、川筋、季節的に水が流れる谷（ワジ）を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: あなたがたが食べてよいのは次のものである
  rationale: 直訳的な「これを食べてよい」を、食物規定の導入として自然な現代日本語にした。二人称複数も「あなたがた」で保持した。
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: 水の中にいるもののうち
  rationale: מִן の部分を表す意味を「〜のうち」で示し、生き物を指す文脈に合わせて「いるもの」とした。
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ひれとうろこ
  rationale: いずれも分類を示す集合的な名詞として、一般的で明快な日本語を用いた。
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: 海や川
  rationale: 海域と内陸の流水域を自然に包括する表現とした。נְחָלִים の意味範囲には「流れ」「川筋」「ワジ」もあるため脚注で補った。
- source_word: אֹתָם תֹּאכֵלוּ
  choice: 食べてよい
  rationale: 法的文脈で許可を表す未完了形として訳した。冒頭と結びの反復は保ちつつ、日本語では目的語の重複を避けた。
theological_decisions: []
