source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: ja
  text: 地上をうごめくあらゆる生き物[b]のうち、腹で進むもの[a]、四本の足で進むもの、さらに多くの足を持つものは、どれも食べてはならない。それらは忌むべきもの[c]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「腹ではうもの」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、「うごめくものがうごめく」に当たる同語根の語が重ねられ、この種類の生き物が強調されている。
    reason: lexical_alternative
  - marker: c
    text: 別訳「忌まわしいもの」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: あらゆる／どれも
  rationale: 各種の生き物を一つ残らず含める分配的・包括的な意味を、日本語の文脈に応じて表した。
- source_word: הוֹלֵךְ עַל גָּח
  choice: 腹で進むもの
  rationale: 移動の仕方を述べる原文に即しつつ、「はう」と限定しすぎない表現とした。
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: 四本の足で歩くもの
  rationale: 原文の具体的な表現を、明瞭で自然な現代日本語にした。
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: さらに多くの足を持つもの
  rationale: עַד の包含・拡張の働きを「さらに」で示し、多足の生き物まで禁令に含まれることを明確にした。
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: うごめくあらゆる小動物のうち
  rationale: שׁרץ の名詞と分詞による同語根反復を完全な逐語訳にはせず、分類を表す לְ と小さな生き物の動きを自然な日本語で表した。反復は脚注で示した。
- source_word: עַל הָאָרֶץ
  choice: 地の上を
  rationale: この動物分類の文脈では、広い意味の「地」よりも、生き物が移動する場所としての地面を自然に想起させる表現を選んだ。
- source_word: לֹא תֹאכְלֻם
  choice: 食べてはならない
  rationale: 律法文における直接的な禁止の力を、現代日本語の明瞭で格調ある禁止表現で保った。
- source_word: שֶׁקֶץ
  choice: 忌むべきもの
  rationale: 食物規定の文脈にある強い嫌悪・忌避を表しつつ、後代の特定の教義的含意を持ち込まない表現とした。
theological_decisions:
- issue: 聖潔規定における禁止の性質
  choice: レビ記の食物規定における直接の禁止として訳す。
  alternative: 永遠に適用される道徳的禁止と明示する、または単なる文化的禁忌へと弱める。
  rationale: 原文は食物に関する法的禁止を直接述べているが、その後代における適用範囲はこの節自体では論じていないため、翻訳で決着させない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法としての厳粛さを「食べてはならない」「忌むべきもの」で保った。原文の語順を機械的に再現せず、分類枠を先に置くことで日本語として理解しやすくした。
