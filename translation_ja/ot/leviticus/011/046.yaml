source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: ja
  text: これは、獣と鳥、水の中を動くすべての生き物、また地上をうごめくすべての生き物についての律法[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法」は「教え」とも訳せる。ヘブライ語 תּוֹרָה は、法規だけでなく、権威ある教えや指示をも表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: についての律法
  rationale: 直前までの清い生き物と汚れた生き物に関する規定を総括する権威ある教えを指す。「律法」は法的な性格を明確にし、「についての」によって自然な現代日本語とした。
- source_word: הַבְּהֵמָה
  choice: 獣
  rationale: この語は家畜に限らず陸上の動物を広く指し得る。章全体では野生動物も扱われるため、「家畜」より広い「獣」とした。
- source_word: הָעוֹף
  choice: 鳥
  rationale: 飛ぶ生き物を広く表し得るが、ここでは分類名として自然で分かりやすい「鳥」とした。
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: すべての生き物
  rationale: נֶפֶשׁ הַחַיָּה は生命ある存在を指す表現であり、非物質的な「魂」を意味するとは限らないため、「生き物」とした。
- source_word: הָרֹמֶשֶׂת בַּמָּיִם
  choice: 水の中を動く
  rationale: רמש は這うような動きを含み得るが、水中の生物全般について述べるこの箇所では、過度に限定しない「動く」が自然である。
- source_word: הַשֹּׁרֶצֶת עַל הָאָרֶץ
  choice: 地上をうごめく
  rationale: שׁרץ が表す、小さな生き物が群がり動く、または這い回る様子を「うごめく」で簡潔に表した。עַל הָאָרֶץ は水中との対比が明確になるよう「地上」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「獣」は家畜だけに限定せず、章全体で扱われる陸上動物を包含する。二つの分詞は、水中では広い動作を示す「動く」、地上では小動物の特徴的な動きを示す「うごめく」と訳し分けた。
