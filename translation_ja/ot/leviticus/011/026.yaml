id: LEV.11.26
reference: Leviticus 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: ja
  text: ひづめが分かれていても、それが完全には二つに割れておらず[a]、反芻しない動物はすべて、あなたがたにとって汚れたものである。それらに触れる者はみな汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「割れ目を割っておらず」。同根語を重ね、ひづめが完全に二つに割れていないことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: 動物はすべて
  rationale: לְ はここで対象となる部類を示し、בְּהֵמָה は文脈上、陸上の動物を広く指す。現代日本語として明瞭な「動物」を用いた。
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: ひづめが分かれていても
  rationale: 語源を直訳するより、ひづめが分かれた状態を自然な日本語で表した。後続の否定との対照を示すため「ても」とした。
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: それが完全には二つに割れておらず[a]
  rationale: 同根の名詞と動詞を重ねた表現は、ひづめが完全に二分されていないことを示す。「完全には二つに」でその限定を明示し、原文の特徴は脚注に残した。
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: 反芻しない
  rationale: 字義的には「食べ戻したものを上げない」だが、動物についての定着した簡潔な表現である「反芻しない」が意味を正確に伝える。
- source_word: טְמֵאִים הֵם לָכֶם
  choice: あなたがたにとって汚れたものである
  rationale: 祭儀上の清浄規定を表す טָמֵא を「汚れた」とし、לָכֶם の法的・契約的な観点を「あなたがたにとって」で保持した。
- source_word: כָּל הַנֹּגֵעַ בָּהֶם יִטְמָא
  choice: それらに触れる者はみな汚れる
  rationale: כָּל と分詞による一般化を「者はみな」とし、未完了形 יִטְמָא は接触によって生じる法的結果として自然な現在形で表した。
theological_decisions:
- issue: レビ記の清浄規定における טָמֵא の意味
  choice: 汚れた／汚れる
  alternative: 不浄である／不浄になる
  rationale: ここで問題となるのは祭儀上の清浄区分であり、必ずしも道徳的な悪を意味しない。「汚れた」は聖書の清浄規定として理解しやすく、原語の区分を保つ。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で格調を保った法文調とした。「反芻」「汚れた」はレビ記の動物分類と祭儀的清浄の文脈に適した標準的な語である。
