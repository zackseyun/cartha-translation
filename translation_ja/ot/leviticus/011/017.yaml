  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: ja
  text: コキンメフクロウ[a]、鵜、それにワシミミズク。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここに挙げられた鳥の同定は確かではない。「コキンメフクロウ」「鵜」「ワシミミズク」は、それぞれ伝統的または学術的に有力な訳語である。別案として、כּוֹסは「ふくろう」など、שָׁלָךְは「ペリカン」など、יַנְשׁוּףは「大型のふくろう」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: コキンメフクロウ
  rationale: 汚れた鳥の一覧にある特定の鳥名と考えられる。種の同定には不確かさがあるが、「コキンメフクロウ」は有力な現代的同定の一つであり、単に「ふくろう」とするより原文の具体性を保てる。
- source_word: הַשָּׁלָךְ
  choice: 鵜
  rationale: 正確な同定には議論があるものの、水中へ飛び込んで魚を捕る鳥との理解に合う伝統的かつ有力な訳語として「鵜」を採用した。別案は脚注に示した。
- source_word: הַיַּנְשׁוּף
  choice: ワシミミズク
  rationale: 鳥類一覧に現れる夜行性の大型のふくろうを指す可能性が高い。厳密な種の同定は確実でないため、その点を脚注で明示した。
- source_word: וְאֶת
  choice: 、／それに
  rationale: 反復される接続詞と目的語標識は前節から続く列挙を形作る。日本語では読点と最後の「それに」によって自然に表した。
