source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: ja
  text: また、豚は、ひづめが分かれ、ひづめが二つに割れているが、反芻しないので、あなたがたには汚れたものである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: 豚
  rationale: 現代日本語でこの動物を指す最も一般的で自然な語。種全般を表す。
- source_word: כִּי
  choice: ので
  rationale: 豚が汚れたものとされる理由を示す因果関係を、自然な日本語で明確にする。
- source_word: מַפְרִיס פַּרְסָה
  choice: ひづめが分かれ
  rationale: 分蹄を表すヘブライ語の表現を、一般読者に理解しやすい形で訳す。
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: ひづめが二つに割れている
  rationale: 直前の分蹄の記述をさらに明確にする原文の重ねた表現を、省略せず自然に保つ。
- source_word: גֵּרָה לֹא יִגָּר
  choice: 反芻しない
  rationale: 字義的には食物を再び上げないことを表すが、日本語では「反芻する」が正確で簡潔な定着表現である。
- source_word: טָמֵא הוּא לָכֶם
  choice: あなたがたには汚れたものである
  rationale: 食物規定における儀礼的区分を表し、道徳的悪を意味する表現にはしない。「あなたがたには」により対象となる共同体も保持する。
theological_decisions:
- issue: 食物規定における טָמֵא の性質
  choice: 汚れたもの
  alternative: 不浄なもの
  rationale: ここではイスラエルの食物規定上の儀礼的区分を指す。「汚れたもの」はレビ記での対概念を明瞭に示しつつ、道徳的な悪と断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「分かれ」と「二つに割れている」を併記して、原文にある分蹄表現の反復と強調を保持した。専門語「反芻」は広く定着しており、文脈上理解可能と判断した。
