  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンに語り、彼らにこう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（神の固有名）。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な代替訳を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げて
  rationale: 神の発話を導入する定型的な物語表現。後続する לֵאמֹר と不自然に重複しないよう、「語って」より「告げて」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: 二人がともに発話の受け手であることを、自然な現代日本語で明示した。
- source_word: לֵאמֹר
  choice: こう言われた
  rationale: 後続する発言内容を導くヘブライ語の定型句を、読みやすく品位ある日本語にした。
- source_word: אֲלֵהֶם
  choice: 彼らに
  rationale: 原文が二人への語りかけを重ねて明示しているため、省略せず保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写し、脚注で伝統的な訳し方を示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある聖書文体。原文の「彼らに」を残しつつ、「告げて……こう言われた」によって発話導入句の重なりを自然な日本語に整えた。
