  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: ja
  text: ただし、四つの脚で歩く、羽のある群がる生き物のうち、足より上に、地面を跳ぶための脚[b]があるもの[a]は食べてよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の書記された本文は字義どおりには「脚がない」と読めるが、伝統的な朗読、文脈、古代訳は「脚がある」と理解している。
    reason: textual_variant
  - marker: b
    text: 「跳ぶための脚」は「関節のある脚」とも訳せる。ここでは、跳ぶために使う特殊な後脚を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 直前の禁止に対する例外を導く語として、現代日本語の法規的文脈にも自然な「ただし」を用いた。
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: ものは食べてよい
  rationale: 単数形の指示表現が許可される一群を導いており、未完了形はここでは命令というより食用の許可を表す。
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: 羽のある群がる生き物のうち
  rationale: שֶׁרֶץの群がり動く生物という広い分類を保ち、הָעוֹףを鳥類に限定せず、飛翔する種類を示す表現とした。
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: 四つの脚で歩く
  rationale: 原文の身体的記述を保ちつつ、日本語として理解しやすくした。
- source_word: כְרָעַיִם
  choice: 跳躍脚
  rationale: 地面を跳ぶために用いる特殊な脚を指す文脈上の機能を簡潔に示す。語形自体の別解は脚注に残した。
- source_word: מִמַּעַל לְרַגְלָיו
  choice: 足より上に
  rationale: 特殊な跳躍用の脚が通常の足の上方にあるという原文の位置関係を、解剖学的に過度に説明せず保持した。
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: 地面を跳ぶための
  rationale: 目的を示す不定詞と道具を示す表現を、跳躍脚を修飾する自然な日本語にまとめた。
theological_decisions:
- issue: אֲשֶׁר לא כְרָעַיִם の本文と伝統的朗読の相違
  choice: 「脚があるもの」とする伝統的朗読を本文に採用
  alternative: 「脚がないもの」と字義どおりに訳す
  rationale: 書記された לא は「ない」を意味するが、マソラの伝統的朗読 לוֹ、文脈、および古代訳はいずれも「それに脚がある」という理解を支持する。異読は脚注で明示し、本文上の問題を隠さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「群がる生き物」によって古代の生物分類を残し、「昆虫」と現代分類に限定することは避けた。「ただし」と「食べてよい」で、禁止に対する法的な例外であることを自然に示した。
