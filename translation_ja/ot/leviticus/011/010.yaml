base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: ja
  text: しかし、海や川[a]にいる、水に群がるあらゆるもの、また水にいるあらゆる生き物のうち、ひれとうろこのないものはすべて、あなたがたには忌むべきものである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「川」は、「流れ」「谷川」、また地域によっては「涸れ川」とも訳せる。ヘブライ語は広く水の流れる場所を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたにとって嫌悪すべきものである」。ここでのヘブライ語は、食物規定において儀礼上忌避されるものを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: しかし、…ものはすべて
  rationale: 接続詞は前節の許可された水生生物との対照を示すため「しかし」とし、כֹלの包括性を「すべて」で保持した。
- source_word: אֲשֶׁר אֵין לוֹ
  choice: …のないもの
  rationale: 必要な特徴を持たないことを、明快で自然な現代日本語で表した。
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ひれとうろこ
  rationale: 二つの特徴を加算的に示す接続を保ち、日本語で一般的な魚類の身体名称を用いた。
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: 海や川に
  rationale: יַמִּיםを「海」、流れる水路を広く指すנְחָלִיםを本文では理解しやすい「川」とした。「や」は両方の水域を包括的に列挙する自然な日本語である。
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: 水に群がるあらゆるものも
  rationale: שֶׁרֶץの群がり、うごめく生物という集合的表現を「群がる」で保持し、部分を取り出すמִןは前置された「…もののうち」と対応させた。
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: 水にいるあらゆる生き物も
  rationale: נֶפֶשׁ הַחַיָּהを、人間の『魂』に限定されない生物一般として自然な「生き物」と訳した。
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: あなたがたには忌むべきものである
  rationale: 名詞文によるイスラエルに対する恒常的な位置づけを現在の状態として表現した。「忌むべき」は食物規定における強い儀礼的嫌悪を保つ。
theological_decisions:
- issue: 食物規定におけるשֶׁקֶץの儀礼的身分表現
  choice: 忌むべきもの
  alternative: 嫌悪すべきもの／忌まわしいもの
  rationale: 一般的な道徳的断罪へ広げず、契約共同体に対する食物上の強い禁止・嫌悪の意味を伝えるため。「汚れた」はこの語自体とは別の専門語を持ち込むため避けた。
translation_notes:
  register: 明快な現代標準日本語を用いながら、律法本文にふさわしい端正さを保った。列挙構造は「…も、…も」で再現し、対象範囲が水中の群生するものと生き物全般に及ぶことを示した。
