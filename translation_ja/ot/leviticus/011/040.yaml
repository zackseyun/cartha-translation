id: LEV.11.40
reference: Leviticus 11:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: ja
  text: その死骸の一部を食べる者は、衣服を洗わなければならず、夕方まで汚れている[a][b]。また、その死骸を運ぶ者は、衣服を洗わなければならず、夕方まで汚れている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その死骸から」または「その死骸のいくらかを」とも訳せる。ヘブライ語は部分を示す表現。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れ」は、イスラエルの祭儀上の清浄規定における状態を指す。
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: 食べる者
  rationale: 定冠詞付き分詞を、一般的な該当者を指す実体的用法として訳し、律法文の簡潔な調子を保った。
- source_word: מִנִּבְלָתָהּ
  choice: その死骸の一部を
  rationale: 前置詞 מִן の部分を示す意味を明示した。「その死骸から」とも訳せるが、日本語では食べる対象の一部分を自然に表せる。
- source_word: נִבְלָתָהּ
  choice: その死骸
  rationale: 文脈は動物の死体であり、人間の遺体ではないため、「死骸」が正確で自然である。接尾辞は文脈上の動物を指す。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 衣服を洗わなければならず
  rationale: 律法文における未完了形の規定的・義務的な力を、現代日本語の自然な法令調で表した。所有代名詞は日本語では不要なため明示しない。
- source_word: וְטָמֵא
  choice: 汚れている
  rationale: 結果として続く祭儀上の状態を表す。「祭儀的に」は本文に補わず、注で説明する。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: ヘブライ語の時間的限界を、簡潔で自然な日本語として表した。
- source_word: הַנֹּשֵׂא
  choice: 運ぶ者
  rationale: 定冠詞付き分詞の実体的・一般的用法を保ち、前半の「食べる者」と並行させた。
- source_word: אֶת נִבְלָתָהּ
  choice: その死骸を
  rationale: 目的語標識と接尾辞付き名詞を、日本語で自然かつ直接的に訳した。
theological_decisions:
- issue: 汚れの性質
  choice: 本文では「汚れている」とし、祭儀上の意味は注で示す。
  alternative: 「祭儀上、汚れている」
  rationale: טָמֵא 自体にない説明語を本文へ加えず、レビ記の清浄規定における意味を注で補うことで、原文の簡潔さと読者の理解を両立させた。
- issue: 法規定の一般的対象者と文法上の性
  choice: 「者」を用いて一般的な該当者として表す。
  alternative: 「その男」または代名詞を伴う男性単数表現
  rationale: ヘブライ語は男性単数形だが、法文では代表的・一般的に機能する。日本語の「者」は数や性を不必要に特定せず、その一般性を自然に保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、律法規定にふさわしい簡潔で厳正な調子を保った。「衣服を洗わなければならず」により義務性を自然に示し、二つの条項の並行構造を維持した。
