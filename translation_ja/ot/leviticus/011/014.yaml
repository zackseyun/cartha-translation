  text: וְ/אֶת הַ֨/דָּאָ֔ה וְ/אֶת הָ/אַיָּ֖ה לְ/מִינָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/014.yaml
  text: the kite[a], and the falcon according to its kind,
translation:
  language: ja
  text: トビ[a]とハヤブサの類。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: これらの鳥を厳密に同定することは難しい。別訳では、最初を「ハゲワシ」、次を「トビ」とする。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: トビ
  rationale: 猛禽を指す鳥名だが、厳密な同定には不確かさがある。現代日本語で分かりやすく、有力な同定を示す「トビ」とし、別案を脚注に残した。
- source_word: הָאַיָּה
  choice: ハヤブサ
  rationale: 猛禽類の鳥名で、「トビ」とする可能性もある。直前の鳥名との区別を保ちつつ語義範囲に収まる「ハヤブサ」を採用し、不確かさを脚注で示した。
- source_word: לְמִינָהּ
  choice: の類
  rationale: 分類を表す「その種類に従って」の意味を、動物一覧として自然で簡潔な現代日本語「の類」で表した。
- source_word: וְאֶת ... וְאֶת
  choice: …と、…
  rationale: 目的格標識 אֵת は訳語にせず、接続詞による列挙を日本語の「と」で自然に表した。
theological_decisions: []
translation_notes:
  register: 簡潔な律法上の一覧という原文の調子を保ち、現代の一般読者に明瞭で品位ある表現とした。鳥名の不確かさは本文で断定的に解消せず、脚注に別訳を示した。
