  text: וְ/אֶת הַ/תִּנְשֶׁ֥מֶת וְ/אֶת הַ/קָּאָ֖ת וְ/אֶת הָ/רָחָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/018.yaml
  text: the owl, the pelican, and the carrion vulture;
translation:
  language: ja
  text: ふくろう[a]、ペリカン[b]、エジプトハゲワシ[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このヘブライ語が指す鳥の正確な種類は不明。「白ふくろう」「とき」などとも訳される。
    reason: תנשמת の鳥類としての同定が不確かであり、古代訳と現代の提案が分かれるため。
  - marker: b
    text: この鳥の正確な同定は確定しておらず、「鵜」などとする見方もある。
    reason: קאת は通常ペリカンとされるが、翻訳史および語彙上は別の水鳥とする提案もあるため。
  - marker: c
    text: または「死肉を食べるハゲワシ」。この鳥の正確な同定は不明。
    reason: רחם はエジプトハゲワシとする説が有力だが、より一般的な腐肉食鳥の名称である可能性も残るため。
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (hattinšemet)
  choice: ふくろう
  rationale: 鳥類名としての正確な同定には議論がある。英語監査層の owl と主要な語彙的候補を踏まえ、本文では過度に種を限定しない一般的な名称を採用した。
- source_word: הַקָּאָת (haqqāʾat)
  choice: ペリカン
  rationale: 伝統的かつ広く認められる同定であり、現代日本語でも明確に通じる。語の厳密な同定にはなお不確実性があるため注を付した。
- source_word: הָרָחָם (hārāḥām)
  choice: エジプトハゲワシ
  rationale: 多くの現代語彙研究で Egyptian vulture と同定される。単なる『死肉を食べるハゲワシ』より具体的だが、同定の不確実性は注で示した。
theological_decisions:
- issue: 儀礼上汚れた鳥の名称を現代の種名にどこまで対応させるか
  choice: 有力な同定を簡潔な現代日本語で示し、不確実性を脚注に明記する
  alternative: すべてを伝統的名称または音写で表す
  rationale: 本文の可読性を保ちながら、古代の動物名を現代の分類学上の種へ断定的に固定することを避けるため。神学的意味を特定の動物同定に依存させない。
translation_notes:
  register: 簡潔な律法の列挙として、現代標準日本語の一般的な鳥名を読点で並べた。動物名には生物学的同定の不確実性があるため、本文を読みやすく保ちつつ各項目の注で代案を示した。
