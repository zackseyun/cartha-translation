id: LEV.11.45
reference: Leviticus 11:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: ja
  text: わたしは主であり、あなたがたの神となるために、あなたがたをエジプトの地から導き上げた者である[a]。あなたがたは聖なる者でありなさい。わたしは聖だからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがたをエジプトの地から導き上げる者」。ヘブライ語は分詞を用いているが、ここでは過去の出エジプトの出来事を指す。
    reason: lexical_alternative
  - marker: b
    text: または「わたしは聖であるからだ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を、日本語聖書で広く定着している「主」で表し、荘重さと読みやすさを保った。
- source_word: הַמַּעֲלֶה
  choice: 導き上った者
  rationale: 分詞の継続的・特徴づける響きを「者」で残しつつ、歴史上の出エジプトを指す文脈に合わせて過去形とした。また、עלהの「上る」という像も保持した。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 原文の「地」を省かず、出エジプトに関する契約的な定型表現を保った。
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: あなたがたの神となるために
  rationale: 目的を表す不定詞構文を自然な日本語で示し、神と民との契約関係を明確にした。
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: あなたがたは聖なる者となりなさい
  rationale: 文脈上の命令的な力を明示しつつ、「聖」を単に「取り分けられた」と言い換えず、意味の広がりを保った。
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: わたしが聖なる者だからである
  rationale: כִּיの因果関係を現代日本語で明確にし、民の聖さが神自身の聖さに根拠を持つことを示した。
theological_decisions:
- issue: 聖さの契約的根拠
  choice: イスラエルに求められる聖さを、主の出エジプトの行為、神と民との関係、そして主自身の聖さに結びつけて訳した。
  alternative: 食物規定に限られた儀礼的清さだけを述べるものとして訳す。
  rationale: 直近の文脈は食物規定だが、節自体は出エジプトと「あなたがたの神となる」という契約表現を明示しているため、その広がりを縮小しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の自己宣言と命令にふさわしい荘重さを保った。「あなたがた」を用いて複数形を明示した。
