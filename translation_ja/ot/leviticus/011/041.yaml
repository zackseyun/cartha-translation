  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: ja
  text: また、地の上を群がり動くものはすべて、忌むべきものである[a]。食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忌まわしいもの」。ここでは、食物として儀礼上忌避されるものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: また、…すべて
  rationale: וְによって直前の食物規定とのつながりを示し、כָּלの包括的な意味を「すべて」で表した。
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: 群がり動く小さな生き物
  rationale: שֶׁרֶץと同根の分詞שׁרץが重なる表現を、日本語で不自然な反復にせず、「群がり動く」によって群生・地を這うように動く小動物という広い意味を表した。
- source_word: עַל הָ/אָ֑רֶץ
  choice: 地の上を
  rationale: この章で水中や空中の生き物と区別される陸上の領域を指すため、「地の上」とした。日本語の移動表現に合わせて助詞は「を」とした。
- source_word: שֶׁ֥קֶץ ה֖וּא
  choice: 忌むべきものであり
  rationale: שֶׁקֶץはここでは食物として儀礼上退けられるものを示す。「忌むべき」は法的・祭儀的な強さを保ちつつ、一般的な道徳悪と断定しすぎない表現である。独立代名詞הוּאの断定も「ものであり」によって示した。
- source_word: לֹ֥א יֵאָכֵֽל
  choice: 食べてはならない
  rationale: ニファル未完了形による受動的禁止を、現代日本語の法規的で明瞭な禁止表現にした。
theological_decisions:
- issue: שֶׁקֶץの性質
  choice: 食物規定の文脈にある「忌むべきもの」と訳し、道徳的悪とは限定しない
  alternative: 「忌まわしいもの」「汚れたもの」
  rationale: 原語はこの箇所で食用として退けられる祭儀的評価を担う。「汚れたもの」だけでは別語טמאとの区別が曖昧になり、「忌まわしい」は一般的な道徳嫌悪に寄りやすい。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい端正な調子を保った。「群がり動く小さな生き物」は、原語が広く指す、群がるものや地面近くを這うように動く小動物を包含する。
