source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: ja
  text: ただし、反芻するもの、あるいはひづめを分けるもののうち、次のものは食べてはならない。らくだは反芻するが、ひづめを分けない。あなたがたにとって汚れたものである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「汚れた」とは、イスラエルに与えられた食物規定において汚れたものとされる、という意味。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 直前の規定に対する制限・例外を導く語として、逆接と限定の両方を自然な現代日本語で表す。
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: 反芻するもの
  rationale: 字義的には食物を再び上げることを指すが、動物の性質を示す標準的で簡潔な日本語として「反芻する」を用いる。
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: あるいはひづめの割れているもの
  rationale: 後に挙げられる動物は二条件の一方だけを満たすため、分類上の意味が明確になるよう接続を「あるいは」とした。「ひづめが割れている」は原語の動作・状態を自然に表す。
- source_word: הַגָּמָל
  choice: らくだ
  rationale: 動物名の直接的な現代日本語訳。
- source_word: כִּי מַעֲלֵה גֵרָה הוּא וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: 反芻するが、ひづめが割れていないので
  rationale: 一方の条件を満たすものの他方を満たさないという対照と、それが禁止理由であることを明瞭に示す。
- source_word: טָמֵא הוּא לָכֶם
  choice: あなたがたにとって汚れたものである
  rationale: 「汚れた」というレビ記の中心語を保持し、「あなたがたにとって」によってイスラエルに向けられた法的・契約的な言い方を反映する。
theological_decisions:
- issue: 食物規定における טָמֵא の性質
  choice: 汚れた
  alternative: 儀礼的に汚れた
  rationale: 文脈上はイスラエルの食物規定にかかわる分類だが、本文で「儀礼的」と限定して原語の意味を狭めず、説明は脚注に置く。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「食べてはならない」で法規定の力を示しつつ、専門的すぎる表現を避けた。原文の分類構造を保つため、冒頭は「反芻するもの、あるいはひづめの割れているもののうち」とした。
