translation:
  language: ja
  text: ヤモリ[a]、オオトカゲ、トカゲ、スナトカゲ、カメレオン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節に挙げられた動物のうち、いくつかは正確な同定が困難である。「ヤモリ」はフェレットまたはトガリネズミ、「オオトカゲ」はカメレオン、「スナトカゲ」はスキンク、古い伝統では「かたつむり」、「カメレオン」はモグラまたは別種のトカゲとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: ヤモリ
  rationale: 正確な動物学的同定は不確かだが、這う生き物の一覧という文脈では、イタチやトガリネズミなどの哺乳類よりトカゲ類が考えやすい。現代の読者にも分かりやすい候補として「ヤモリ」とした。
- source_word: הַכֹּחַ
  choice: オオトカゲ
  rationale: 大型のトカゲを指すと考えられているため、他のトカゲ類と区別できる自然な総称を用いた。ただし種の同定には確実性がない。
- source_word: הַלְּטָאָה
  choice: トカゲ
  rationale: 特定の種を確定できないため、意味を狭めすぎない一般的な名称とした。
- source_word: הַחֹמֶט
  choice: スナトカゲ
  rationale: 爬虫類の並びに適合する現代の有力な候補を採った。スキンク類とする説や、古い伝統の「かたつむり」もあるため、不確実性を注で示した。
- source_word: הַתִּנְשָׁמֶת
  choice: カメレオン
  rationale: 同じ語が別の箇所では鳥を表し得るが、ここでは地を這う生き物の一覧に置かれているため、爬虫類の候補を採った。正確な同定は不確かである。
