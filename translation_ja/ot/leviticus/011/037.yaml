  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: ja
  text: また、これらの死骸の一部が、まかれるためのどんな種に落ちても、その種は清い。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: また、～ても
  rationale: 前の規定とのつながりを「また」で示し、祭儀法上の条件を日本語として自然な「～ても」で表した。
- source_word: יִפֹּל
  choice: 落ちても
  rationale: נפל の未完了形を、条件的事例を表す自然な現代日本語にした。
- source_word: מִנִּבְלָתָם
  choice: これらの死骸の一部
  rationale: 前置詞 מִן の部分的な意味を明示しつつ、נְבֵלָה をこの文脈に適した「死骸」と訳した。集合的・複数的に解する余地は脚注に残した。
- source_word: עַל
  choice: ～に
  rationale: 落下の到達点を示すため、現代日本語では「上に」より自然な助詞「に」を用いた。
- source_word: כָּל
  choice: （無表示）
  rationale: 無冠詞的な זֶרַע と条件文により「どの種であっても」という一般性は日本語で十分伝わるため、不自然な「どんな」を加えなかった。
- source_word: זֶרַע זֵרוּעַ
  choice: 種をまくための…種
  rationale: 同根語を重ねるヘブライ語の強調をある程度保ち、食用などではなく播種用の種であることを明確にした。
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: これからまかれる
  rationale: 未完了形の将来的・用途的な意味を自然に表し、その種が播種予定であることを示した。
- source_word: טָהוֹר הוּא
  choice: その種は清い
  rationale: レビ記の祭儀的清浄の用語として טָהוֹר を「清い」と訳し、指示対象が種であることを日本語で明示した。「清いままである」という解釈は加えなかった。
