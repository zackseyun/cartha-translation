id: LEV.11.13
reference: Leviticus 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: ja
  text: 鳥のうち、次のものを忌むべきものとしなさい。これらを食べてはならない。それらは忌むべきものである。すなわち、鷲[a]、ヒゲワシ[b]、クロハゲワシ[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この一覧にあるヘブライ語の鳥名は、必ずしも確実に同定できない。「鷲」は、大型の猛禽類、あるいはハゲワシ類を広く指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 原語が指す鳥の同定は確実ではない。「ヒゲワシ」のほか、より広くハゲワシの一種とする見方もある。
    reason: lexical_alternative
  - marker: c
    text: この鳥の同定は不確かである。「クロハゲワシ」のほか、ミサゴやウミワシの一種とする見方もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: 忌むべきものとしなさい
  rationale: ピエル形が示す、単なる感情ではなく忌避すべきものとして扱うという評価的・規定的な意味を表した。後続する שֶׁקֶץ とも語感をそろえた。
- source_word: מִן הָעוֹף
  choice: 鳥のうち
  rationale: מִן の部分を示す用法を「うち」で表し、この食物規定の文脈では עוֹף を自然な「鳥」とした。
- source_word: לֹא יֵאָכְלוּ
  choice: これらを食べてはならない
  rationale: ニファル形の受動的禁止を、日本語では対象を明示した自然な禁止表現で訳した。
- source_word: שֶׁקֶץ
  choice: 忌むべきもの
  rationale: 食物規定における宗教的・儀礼的な忌避の強さを保ちつつ、単に「汚れたもの」と同一視することを避けた。
- source_word: הַנֶּשֶׁר
  choice: 鷲
  rationale: 伝統的かつ有力な対応語を本文に置いた。ただし大型猛禽類またはハゲワシ類を指す可能性があるため、同定の不確かさを脚注に示した。
- source_word: הַפֶּרֶס
  choice: ヒゲワシ
  rationale: 骨を砕くことで知られるヒゲワシとの同定が有力であり、現代日本語で分かりやすい名称を採用した。ただし確定的ではないため脚注を付した。
- source_word: הָעָזְנִיָּה
  choice: クロハゲワシ
  rationale: 現代の学術的提案の一つに従ったが、鳥種の同定には大きな不確かさがあるため、異なる可能性を脚注に残した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、律法の規定としての厳粛さを保った。「忌むべきもの」を反復し、原文の強調と語彙的連結を残した。鳥名は本文では簡潔な現代名を用い、動物学的同定の不確かさは脚注で明示した。
