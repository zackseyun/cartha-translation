source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: ja
  text: わたしはあなたがたの神、ヤハウェである。だから、あなたがたは自らを聖別し、聖なる者となりなさい。わたしが聖だからである。また、地の上を動くいかなる群がる生き物によっても、自分自身を汚してはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号への置き換えを避け、本文にある神の固有名を一般的な日本語音写で示す。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: ヤハウェを主語とする契約定式なので、複数形態であっても単数の「神」を意味する。
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: 自らを聖別し
  rationale: קדשׁ のヒトパエル形が持つ再帰的な意味、すなわち自分たちを聖なるものとして取り分けることを表す。
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: 聖なる者となりなさい
  rationale: 聖別に伴って求められる状態・結果を表し、文脈上の命令の力も保つ。
- source_word: קָדוֹשׁ
  choice: 聖なる／聖
  rationale: 神と民の双方に同じ語根の「聖」を用い、両者の明示的な結び付きを保つ。
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: 自分自身を汚してはならない
  rationale: נפשׁ を独立した「魂」に限定せず、人そのものを指す再帰的表現として訳し、טמא の汚れの概念を保つ。
- source_word: שֶּׁרֶץ
  choice: 群がる生き物
  rationale: 小さく群がり、うごめく生き物を指す語であり、単に「這うもの」と移動様式だけに限定しない。
- source_word: הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 地の上を動く
  rationale: 地上を動き回ることを表す分詞句として、移動方法を過度に限定せずに訳す。
theological_decisions:
- issue: 神の聖さとイスラエルに求められる聖さとの関係
  choice: 両方を一貫して「聖」で表す
  alternative: 一方または両方を「取り分けられた」とする
  rationale: קדשׁ の同語根反復によって、民への要求が神ご自身の聖さに根拠づけられているため、その結び付きを保持する。
- issue: נַפְשֹׁתֵיכֶם の人間理解
  choice: 「自分自身」と訳す
  alternative: 「あなたがたの魂」または「あなたがたの命」
  rationale: ここでは禁じられた生き物によって人自身が汚れることを述べており、身体と魂について本文が明言しない区別を持ち込まない。
- issue: 「聖なる者となりなさい」の様相
  choice: 文脈上の命令として訳す
  alternative: 「聖なる者となるだろう」とする
  rationale: 完了形に続く接続完了形だが、先行する自己聖別と神の聖さを根拠とする勧告・命令の連続として自然に理解できる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい荘重さを保った。「ヤハウェ」は神名として音写し、「聖別」「聖」「汚す」という祭儀的・神学的な主要語彙は保持した。
