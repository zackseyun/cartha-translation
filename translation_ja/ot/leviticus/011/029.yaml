source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: ja
  text: 地上で群がり動くもののうち、あなたがたにとって汚れたものは次のとおりである。モグラネズミ[a]、ネズミ、大トカゲの類である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「モグラネズミ」と「大トカゲ」に当たるヘブライ語がどの動物を指すかは確定していない。前者は伝統的に「イタチ」または「モグラ」、後者は「リクガメ」または単に「トカゲ」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: 次のとおりである
  rationale: 形態上は単数の「これ」だが、後続する複数の動物を導入するため、日本語では一覧を自然に示す表現とした。
- source_word: לָכֶם הַטָּמֵא
  choice: あなたがたにとって汚れているもの
  rationale: לָכֶם の関係・適用の意味を保ち、טָמֵא はレビ記の祭儀的清浄規定に即して「汚れている」とした。
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 群がり動く小動物のうち
  rationale: 同根語の反復が表す、地上を多数動き回る小動物という意味を自然な日本語で示した。「這うもの」だけに限定される印象を避けた。
- source_word: עַל הָאָרֶץ
  choice: 地上を
  rationale: ここではこれらの生き物が活動する陸地・地面の領域を指すため、「地上」とした。
- source_word: הַחֹלֶד
  choice: モグラネズミ
  rationale: 動物種の厳密な同定には不確かさがある。地中性の小動物を指す有力な理解を本文に採り、別案を脚注に示した。
- source_word: הָעַכְבָּר
  choice: ネズミ
  rationale: עַכְבָּר の標準的かつ包括的な日本語訳として「ネズミ」を用いた。
- source_word: הַצָּב
  choice: 大トカゲ
  rationale: 厳密な種の同定は不確かだが、この陸生小動物の一覧では大型のトカゲ類を指す可能性が高い。別の伝統的理解は脚注に示した。
- source_word: לְמִינֵהוּ
  choice: 大トカゲの類
  rationale: 分類を表す定型句を、現代日本語として自然な「〜の類」で表した。この句は直前の צָב に係る。
