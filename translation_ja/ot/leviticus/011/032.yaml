id: LEV.11.32
reference: Leviticus 11:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: ja
  text: 死んだそれらの一つが落ちた物はすべて、汚れる。木製の器具、衣服、皮、粗布など、作業に用いるすべての器具は、水の中に入れなければならない[a]。それらは夕方まで汚れた状態にあり、その後、清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「水の中へ運び入れられなければならない」。または「水に浸さなければならない」。
    reason: יוּבָאは字義的には「運び入れられる」を意味する使役受動形である。この文脈では水に浸すことを含む可能性があるが、動詞そのものは浸漬に限定されない。
lexical_decisions:
- source_word: אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: それらのどれかが死んだ状態で落ちかかった物
  rationale: 前節の小動物を受ける「それら」を保ち、בְּמֹתָםを死亡時または死骸となった状態を示す表現として訳した。「落ちかかった」は接触による汚れという文脈に即しつつ、動詞 נפל の具体性を残す。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 儀礼上の状態変化を簡潔に表す。道徳的な罪や物理的な汚損に限定しないよう、レビ記で定着した「汚れる」を用いた。
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: 木の器、衣服、皮、粗布など
  rationale: כְּלִי עֵץは広い意味を持つが、自然な法規文として「木の器」とした。שַׂקは袋そのものにも粗い織物にもなり得るため、列挙される素材との整合から「粗布」とした。「など」は מן の例示・範囲提示の働きを自然に伝える。
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: 何かの用途に使われる物はすべて
  rationale: מְלָאכָהを狭く労働だけに限定せず、列挙された素材で作られ実用に供される品という意味を明瞭にした。בָּהֶםは複数形で、直前の素材群を受けると理解した。
- source_word: בַּמַּיִם יוּבָא
  choice: 水の中に入れなければならない
  rationale: 字義は「水の中へ運び入れられる」。日本語の規定文として自然な義務表現にしたが、完全な浸漬を明示するかどうかは脚注で保留した。
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: それは夕方まで汚れているが、その後は清くなる
  rationale: 汚れの継続と、その期限後の清い状態への移行を明瞭に表した。接続詞は時間的推移に即して「が、その後は」とした。
theological_decisions:
- issue: טמא／טהר が示す汚れと清さの性質
  choice: 「汚れる／清くなる」と訳し、儀礼法上の状態として示す
  alternative: 「けがされる／清められる」、または「不浄になる／清浄になる」
  rationale: 本文は接触による祭儀的・法的状態を扱っており、道徳的罪責や内面的浄化を加えていない。一般読者に通じる伝統的な対語を用い、受動的な清めの行為も補わない。
- issue: בַּמַּיִם יוּבָא が完全な浸漬を命じるか
  choice: 本文では「水の中に入れる」とし、浸す可能性を脚注に示す
  alternative: 「水に浸さなければならない」
  rationale: ヘブライ語は字義的には「水の中へ運び入れられる」であり、結果として浸すことを含み得るが、動詞自体を専門的な浸漬用語に固定しない。
translation_notes:
  register: 現代標準日本語による簡潔で威厳のある法規文。「〜なければならない」で規定性を示した。「汚れる／清くなる」はレビ記の儀礼的清浄・不浄を表し、道徳的含意を付加しない。脚注記号[a]は該当する本文箇所に置いた。
