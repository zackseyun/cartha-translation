revisions:
- from: それらのどれかが死んだ状態で落ちかかった物は、すべて汚れる。木の器、衣服、皮、粗布など、何かの用途に使われる物はすべて、水の中に入れなければならない[a]。それは夕方まで汚れているが、その後は清くなる。
  to: 死んだそれらの一つが落ちた物はすべて、汚れる。木製の器具、衣服、皮、粗布など、作業に用いるすべての器具は、水の中に入れなければならない[a]。それらは夕方まで汚れた状態にあり、その後、清くなる。
  rationale: 原文の主語関係を明確にし、יִפֹּלの具体的な「落ちる」を保持した。列挙される対象を、一般的な「用途」ではなく「作業に用いる」器具として訳し、כְּלִיとמְלָאכָהの意味を保った。水に入れる命令と夕方までの儀礼的不浄、およびその後の清い状態への移行は維持した。
