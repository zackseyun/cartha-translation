id: LEV.11.33
reference: Leviticus 11:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: ja
  text: また、これらのものの一つが土器[a]の中に落ちたなら、その中にあるものはすべて汚れる。その土器は砕かなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、粘土を焼いて作った器を特に指す。「焼き物の器」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: 土器
  rationale: כְּלִי は器・容器を、חֶרֶשׂ は粘土を焼いて作った素材を示す。「土器」は簡潔で自然な現代日本語であり、祭儀上重要な器の材質も明確に伝える。
- source_word: יִפֹּל מֵהֶם
  choice: これらのものの一つが……落ちたなら
  rationale: 複数接尾辞は直前の文脈で挙げられた小動物の死骸を指す。「一つ」を補うことで、いずれか一体が落ちた場合という分配的な意味を自然に表した。
- source_word: אֶל תּוֹכוֹ
  choice: その中に
  rationale: תּוֹךְ が表す器の内部への進入を、簡潔で自然な日本語にした。
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: その中にあるものはすべて
  rationale: כֹּל の包括性を「すべて」で保ち、器の内容物全体が対象であることを明確にした。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: レビ記の祭儀的清浄規定における טמא を、道徳的な罪と混同しにくい定訳「汚れる」で表した。接触の結果としてその状態になることも自然に示せる。
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: その土器は砕かなければならない
  rationale: 前置された目的語の強調を「その土器は」で反映し、二人称複数の命令が持つ義務性を「なければならない」で明瞭に表した。「砕く」は器を使用不能にする強さを適切に伝える。
theological_decisions:
- issue: יִטְמָא が表す汚れの性質
  choice: 祭儀上の状態を表す「汚れる」
  alternative: 道徳的な意味にも取れる「不浄になる」
  rationale: 文脈は食物と器に関する祭儀的清浄規定であり、倫理的非難を読み込まない表現が適切である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いヘブライ語の一文を二文に分け、規定の条件と結果を読み取りやすくした。脚注記号は説明対象である「土器」の直後に置いた。
