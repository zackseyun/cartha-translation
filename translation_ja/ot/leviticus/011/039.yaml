  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: ja
  text: また、あなたがたが食用とすることを許されている家畜[a]の一頭が死んだ場合、その死骸に触れる者は夕方まで汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたにとって食物である」。ヘブライ語の句は、食用として許されている家畜を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: また、～場合
  rationale: 前の規定とのつながりを「また」で示し、条件節の意味を自然な現代日本語の「場合」で表した。
- source_word: יָמוּת
  choice: 死んだ
  rationale: 条件節中の未完了形を、日本語の条件表現に自然に合う形で訳した。
- source_word: מִן הַבְּהֵמָה
  choice: 家畜のどれか
  rationale: מןの部分を示す用法を「どれか」で明示し、בהמהはこの食物規定の文脈に即して「家畜」とした。
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: 食用としてよい
  rationale: 直訳的な「あなたがたにとって食物である」より自然でありつつ、食べる行為そのものよりも食用に認められた分類を示す句として訳した。
- source_word: הַנֹּגֵעַ
  choice: 触れる者
  rationale: 名詞的に用いられた分詞を、簡潔で格調を保つ表現にした。
- source_word: בְּנִבְלָתָהּ
  choice: その死骸
  rationale: נבלהは死んだ動物の遺骸を指すため、清浄規定で明確な「死骸」とした。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 儀礼上の汚れた状態になることを表す。日本語の律法文として簡潔で自然な表現を選んだ。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 定型的な時間の終点を、現代日本語で自然に表した。
theological_decisions:
- issue: יִטְמָאが示す汚れの性質
  choice: 汚れる
  alternative: 汚れた者となる
  rationale: ここでいう汚れは道徳的罪責ではなく律法上・儀礼上の状態だが、本文では原語と同様に簡潔な表現を保ち、解釈を過度に補わなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、律法文にふさわしい簡潔さと品位を保った。「食用としてよい」によって許可された分類を自然に示し、「汚れる」は原文の儀礼的状態を説明しすぎずに伝える。
