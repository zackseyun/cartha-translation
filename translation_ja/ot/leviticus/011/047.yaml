  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: ja
  text: 汚れたものと清いものとを、また、食べてよい生き物と食べてはならない生き物とを見分けるためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: 見分けるためである
  rationale: 不定詞は直前の文脈を受けて目的を表す。法規上の区別を認識する意味を自然な現代日本語で示した。
- source_word: בֵּין ... וּבֵין
  choice: …と…とを見分け、また、…と…とを見分ける
  rationale: 二組の対比を成す反復構造を、日本語で明確かつ自然な並行表現として保持した。
- source_word: הַטָּמֵא / הַטָּהֹר
  choice: 汚れたもの／清いもの
  rationale: レビ記における祭儀的・法的な分類語として定着した対語を用い、道徳的な悪善を意味する表現にはしなかった。
- source_word: הַחַיָּה
  choice: 生き物
  rationale: 動物に限定しすぎず、חַיָּה の広い指示範囲を保ちながら、現代日本語として自然な語を選んだ。
- source_word: הַנֶּאֱכֶלֶת
  choice: 食べてよい
  rationale: ニファル分詞がこの食物規定の文脈で示す許可・適格性を明瞭に表した。
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: 食べてはならない
  rationale: 単なる不可能や慣習ではなく、食べることの禁止を表す対照として訳した。
theological_decisions:
- issue: レビ記の祭儀的清浄分類
  choice: 「汚れたもの／清いもの」と訳す
  alternative: 「不浄なもの／清浄なもの」
  rationale: 祭儀上・法規上の区分を保ちつつ、内在的な道徳的悪を意味するかのような読み込みを避け、一般読者にも理解しやすくした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く目的節であることを「ためである」で明示し、二組の対比を並行的に表現した。
