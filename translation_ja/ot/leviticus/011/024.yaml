  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: ja
  text: これらによって[a]、あなたがたは汚れる。その死骸[b]に触れる者はみな、夕方まで汚れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらについて、あなたがたは汚れる」。冒頭の句は、汚れの原因を示すだけでなく、以下の分類を広く導入している可能性もある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、複数を指す接尾辞に単数形の名詞「死骸」が付いている。「それらの死骸」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: これらによって
  rationale: 接続詞 וּ と前置詞 לְ を伴う指示語。ここでは接触によって汚れが生じるという手段・原因の意味を本文に採ったが、次の規定対象を導入する「これらについて」の意味もあり得るため、脚注に残した。
- source_word: תִּטַּמָּאוּ
  choice: あなたがたは汚れる
  rationale: טמא の未完了形・男性複数二人称。道徳的罪悪ではなく、死骸との接触によって生じる儀礼上の汚れを簡潔に表す。
- source_word: כָּל הַנֹּגֵעַ
  choice: 触れる者はみな
  rationale: כָּל と単数分詞による一般的・包括的表現を、自然な現代日本語で表した。
- source_word: בְּנִבְלָתָם
  choice: その死骸に
  rationale: נְבֵלָה は動物の死骸を指す。原文は単数名詞に男性複数三人称の接尾辞を付けた形であるため、本文では日本語として簡潔な「その死骸」とし、数の特徴を脚注で示した。
- source_word: יִטְמָא
  choice: 汚れる
  rationale: 一般的な単数主語に対応する טמא の未完了形。前半と同じ語を用い、儀礼上の状態に入ることを表した。
- source_word: עַד הָעָרֶב
  choice: 夕方まで
  rationale: 儀礼上の汚れが続く期限を示す。現代日本語では定冠詞を独立して表さず「夕方まで」が自然である。
theological_decisions:
- issue: 清浄規定における טמא の性質
  choice: 「汚れる」と訳し、儀礼上の汚れを表す
  alternative: 「けがれる」「不浄となる」「自らを汚す」
  rationale: 文脈は動物の死骸への接触から生じる儀礼上の状態を扱っており、道徳的な罪や主体的な冒瀆行為を意味すると決めつけないため。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位のある法規文体。「あなたがた」を明示し、前半と後半で「汚れる」を統一した。脚注記号は該当語句の直後に置いた。
