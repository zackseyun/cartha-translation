  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: ja
  text: それらのうち、次のものは食べてよい。イナゴはその種類に従って[a]、サルアムはその種類に従って、コオロギはその種類に従って、バッタはその種類に従ってである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語で「イナゴ」と訳した語以外の昆虫名の正確な同定には不確実性がある。「サルアム」は原語の音写であり、伝統的には「毛のないイナゴ」と訳される。「コオロギ」「バッタ」も慣用的な訳語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: それらのうち、次のもの
  rationale: 直前に述べられた羽のある群がる生き物の中から、食用を許される一部を挙げる表現として、指示関係を明確にした。
- source_word: תֹּאכֵלוּ
  choice: 食べてよい
  rationale: 食物規定の文脈における許可の意味を、現代日本語で自然に表した。
- source_word: הָאַרְבֶּה
  choice: イナゴ
  rationale: 一般にイナゴ類を指す最も確立したヘブライ語名であり、日本語でも分かりやすい。
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: 〜の類
  rationale: 個体ではなく、それぞれに属する種類全体を指す分類表現を、簡潔で自然な日本語にした。
- source_word: הַסָּלְעָם
  choice: 毛のないイナゴ
  rationale: 正確な同定は不確かだが、古くからの訳語に沿って別種の昆虫名として示し、不確かさは脚注に明記した。
- source_word: הַחַרְגֹּל
  choice: コオロギ
  rationale: 正確な同定は不確かだが、跳躍する直翅目の昆虫を表す伝統的で分かりやすい訳語を採用した。
- source_word: הֶחָגָב
  choice: バッタ
  rationale: バッタ類を表す語として自然であり、同じ節の אַרְבֶּה（イナゴ）とも訳し分けられる。
