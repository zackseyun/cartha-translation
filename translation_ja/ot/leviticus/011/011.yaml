base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: ja
  text: それらはあなたがたにとって忌むべきもの[a]である。それらの肉は少しも食べてはならず、それらの死骸を忌むべきものとしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忌まわしいもの」。ヘブライ語は、この食物規定の文脈で、儀礼上強く嫌悪され、避けるべきものを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: 忌むべきもの
  rationale: 食物規定の文脈における、儀礼上強く退けるべきものという意味を表す。「汚れたもの」では意味が弱く、別の汚れの用語とも重なるため避けた。
- source_word: יִהְיוּ לָכֶם
  choice: あなたがたにとって……である
  rationale: לָכֶם の関係・評価の与格を自然な現代日本語で保ち、イスラエルがそれらをどう見なすべきかを示した。
- source_word: מִבְּשָׂרָם
  choice: その肉を少しも
  rationale: 否定された食べる行為に伴う מִן の部分用法を、「少しも……ない」として明確に表した。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならず
  rationale: 律法文における否定命令の規範的な力を、明瞭で自然な禁止表現にした。
- source_word: נִבְלָתָם
  choice: その死骸
  rationale: 動物の死体を指す語なので、文脈に即した「死骸」と訳した。
- source_word: תְּשַׁקֵּצוּ
  choice: 忌むべきものとしなければならない
  rationale: שֶׁקֶץ と同根であることを訳語の反復によって示し、単なる感情的嫌悪ではなく、忌避すべきものとして扱うという評価的・儀礼的意味を保った。
theological_decisions:
- issue: 食物規定における忌避の性質
  choice: 「忌むべきもの」と訳し、契約上・儀礼上の強い忌避を表す
  alternative: 「忌まわしいもの」または「汚れたもの」と訳す
  rationale: この箇所はイスラエルの食物区分を扱う。「忌むべきもの」は強い否定的評価を保ちつつ、本文が明示しない一般的な道徳悪の範疇へ意味を広げず、別のヘブライ語で表される「汚れ」とも不用意に同一視しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。冒頭の接続詞を「また」で表し、前節とのつながりを残した。法的命令は「してはならない」「しなければならない」で自然に示し、同根語の反復も維持した。
