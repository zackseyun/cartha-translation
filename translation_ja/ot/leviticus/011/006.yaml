source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ja
  text: また、野うさぎ[a]は反芻するが、ひづめが分かれていないので、あなたがたには汚れたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「うさぎ」。ヘブライ語「アルネベト」は伝統的に野うさぎと理解されているが、より広くうさぎ類を指すと考える見方もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: 野うさぎ
  rationale: 伝統的かつ有力な動物同定である「hare」に対応する。日本語の「うさぎ」より種別をやや明確にしつつ、同定の幅は脚注に残した。
- source_word: כִּי
  choice: ので
  rationale: この分類の理由を示す因果関係を、現代日本語として自然に表した。
- source_word: מַעֲלַת גֵּרָה
  choice: 反芻する
  rationale: 字義的には「反芻物を上げる」だが、食物規定の判定基準を簡潔かつ正確に示す一般的な表現を採った。
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: ひづめが分かれていない
  rationale: 直訳的な「ひづめを分けていない」より自然であり、否定された身体的特徴を明瞭に伝える。「が」により前項との対照も示した。
- source_word: טְמֵאָה הִוא לָכֶם
  choice: あなたがたには汚れたものである
  rationale: לָכֶםの契約共同体への適用を保ち、「汚れた」によってレビ記における儀礼的分類を表した。
theological_decisions:
- issue: レビ記の食物規定における「汚れ」の性質
  choice: 儀礼上の分類を示す「汚れた」
  alternative: 道徳的に邪悪・不純である
  rationale: 文脈はイスラエルに対する食物上の清浄・不浄の区分であり、動物そのものを道徳的に悪と断定してはいない。本文では聖書の主要概念である「汚れた」を保ち、過剰な説明を加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法本文にふさわしい簡潔で格調ある叙述とした。「反芻する」は現代の動物学的分類について説明するのではなく、本文が提示する観察上の食物規定をそのまま伝える表現である。
