  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに次のように告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神の発話を導入する定型句として、現代日本語で自然かつ品位のある表現。連続のワウによる物語の進行は、日本語では文脈上明らかなため、機械的に「そして」を加えない。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される慣用に従いつつ、原文が称号ではなく四文字神名YHWHであることを脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を表す前置詞句を、自然な現代日本語の格助詞で表した。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 後続する直接話法を導く不定詞であり、日本語では「告げられた」の後にその内容を置くことで機能が十分に伝わる。「言って言われた」のような不自然な重複を避けた。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 本文では「主」、脚注で「原文は神名YHWH（ヤハウェとも表記）」と明示
  alternative: 本文で「ヤハウェ」または「エホバ」
  rationale: 原文が固有の神名であることを隠さず脚注に示しながら、一般の日本語読者に自然で定着した本文表記を採用した。ヘブライ語の母音復元には議論があるため、一つの発音だけを絶対視しない。
translation_notes:
  register: 明快な現代標準日本語。神の発話にふさわしい簡潔で dignified な定型表現とし、次節以下の直接話法へ自然につながるようにした。
