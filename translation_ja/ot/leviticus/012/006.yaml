source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: ja
  text: 男の子の場合でも女の子の場合でも、彼女の清めの日々が満ちたとき、彼女は一歳の子羊一頭を全焼のささげ物として、また若い鳩一羽か山鳩一羽を罪のためのささげ物[a]として、会見の天幕の入口で祭司のもとに持って行かなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのためのささげ物」。ヘブライ語の語は、道徳的な罪のためだけでなく、祭儀上の汚れを除くためのささげ物を指すことがある。
    reason: חַטָּאת が持つ祭儀上の意味の幅を示し、出産そのものが道徳的罪だという誤解を避けるため。
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: 彼女の清めの期間が満了したなら
  rationale: 前置詞と מלא の不定詞構文が表す期間の完了を、自然な法規文の日本語で示した。טָהֳרָה は道徳的な赦しではなく、祭儀上の清めを指すため「清め」とした。
- source_word: לְבֵן אוֹ לְבַת
  choice: 男の子の場合でも女の子の場合でも
  rationale: 出産した子が男児か女児かを問わず規定が適用されることを明瞭にした。
- source_word: תָּבִיא
  choice: 持って行かなければならない
  rationale: ヒフィル未完了形がこの法規の中で持つ規定的な力を、現代日本語で過度に古風にならない形で表した。
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: 一歳の子羊一頭
  rationale: 「その一年の子」という年齢表現を、自然で明確な日本語にした。
- source_word: לְעֹלָה
  choice: 全焼のささげ物として
  rationale: עֹלָה は祭壇上で全体を焼く祭儀上の供え物を指す。「全焼のささげ物」は意味を明確にしつつ専門語としても使える。
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: 若い鳩一羽か山鳩一羽
  rationale: בֶּן־יוֹנָה の若い鳩と、תֹּר の山鳩を区別し、各一羽であることを日本語で明示した。
- source_word: לְחַטָּאת
  choice: 罪のためのささげ物
  rationale: חַטָּאת の伝統的な祭儀用語とのつながりを本文に残した。ただし、この箇所では道徳的罪だけでなく出産後の祭儀上の汚れを除く働きが前面に出るため、別訳を脚注に示した。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: 会見の天幕の入り口にいる祭司のもとへ
  rationale: 供え物の届け先が、会見の天幕の入り口にいる祭司であることを、ヘブライ語の関係を保ちながら自然な日本語で表した。
theological_decisions:
- issue: 出産後の清めという文脈における חַטָּאת の訳
  choice: 罪のためのささげ物
  alternative: 清めのためのささげ物
  rationale: חַטָּאת は「罪」と関係する定型的な供え物名だが、この文脈の儀礼は出産そのものを道徳的罪と断定するものではなく、祭儀上の汚れからの回復に関わる。語彙上のつながりを本文に残し、文脈上重要な別訳を脚注に置くことで両面を保持した。
translation_notes:
  register: 明瞭で現代的な法規文の調子を用いた。「ささげ物」「会見の天幕」「祭司」によってレビ記の祭儀的な荘重さを保ちつつ、「〜なら」「持って行かなければならない」で一般読者にも理解しやすくした。
