  to: しかし、もし小羊を用意する余裕がなければ、山鳩二羽、または若い鳩二羽を取り、一羽を焼き尽くすささげ物、もう一羽を罪のささげ物[a]としなければならない。祭司が彼女のために贖いを行い、彼女は清くなる。
