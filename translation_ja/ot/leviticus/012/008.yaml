id: LEV.12.8
reference: Leviticus 12:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: ja
  text: しかし、もし小羊を用意する余裕がなければ、山鳩二羽、または若い鳩二羽を取り、一羽を焼き尽くすささげ物、もう一羽を罪のささげ物[a]としなければならない。祭司が彼女のために贖いを行い、彼女は清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪のささげ物」は、「きよめのささげ物」とも訳せる。この文脈では、出産後の儀礼上の不浄からの清めに関わる。
    reason: חַטָּאת は通常「罪のささげ物」と訳されるが、この出産後の儀礼的清めの文脈では「きよめのささげ物」も有力な訳である。出産を道徳的な罪とみなす含意を避けつつ、原語の訳語上の幅を示す。
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: 小羊を用意する余裕がなければ
  rationale: 直訳は「彼女の手が小羊に足りるものを見いださない」だが、経済的な能力がないことを表すヘブライ語の慣用句なので、自然な現代日本語で意味を明示した。
- source_word: שֶׂה
  choice: 小羊
  rationale: 語自体は羊・山羊を含み得る小家畜を指すが、直前の12:6に求められる一年目の小羊を受けているため、「小羊」が文脈上明確で自然である。
- source_word: שְׁתֵּי תֹרִים
  choice: 山鳩二羽
  rationale: תֹר は一般的な鳩ではなく、犠牲に用いるキジバト類を指す。日本語聖書で定着し、普通の読者にも理解しやすい「山鳩」とした。
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: 家鳩のひな二羽
  rationale: 直訳的には「鳩の子二羽」。תֹרִים との区別を保ちつつ、若い鳩であることを明確にするため「家鳩のひな」とした。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 犠牲全体を祭壇で焼き上げる献げ物を表す。単なる「焼き尽くす献げ物」より簡潔で、祭儀用語としての内容も明確な表現を採った。
- source_word: חַטָּאת
  choice: 罪のきよめのささげ物
  rationale: חַטָּאת は罪に関わる犠牲を指す一方、この箇所では出産後の儀礼的不浄からの清めが前面に出る。「罪のささげ物」だけでは道徳的罪を過度に連想させ、「きよめのささげ物」だけでは語の罪との結びつきが消えるため、両面を保つ表現とした。
- source_word: וְכִפֶּר עָלֶיהָ
  choice: 祭司が彼女のために宥めを行う
  rationale: כפר の祭儀的・神学的な重みを保ち、単なる「清める」と同一化しないため「宥めを行う」とした。「贖いをする」も可能だが、ここでは祭司の儀礼行為を自然に表す。
- source_word: וְטָהֵרָה
  choice: 彼女は清くなる
  rationale: ここでの טהר は道徳的評価ではなく、儀礼上の清さへの回復を示す。簡潔な「清くなる」とし、文脈によって儀礼的意味が伝わるようにした。
theological_decisions:
- issue: 出産後の清めの文脈における חַטָּאת の訳語
  choice: 罪のきよめのささげ物
  alternative: 罪のささげ物／きよめのささげ物
  rationale: 出産そのものを道徳的罪と暗示することを避けながら、חַטָּאת が持つ「罪」との語彙的・祭儀的結びつきも消さない。本文で両面を提示し、脚注で文脈上の重点を説明した。
- issue: כפר と טהר の関係
  choice: 「宥めを行う」と「清くなる」を別個に訳す
  alternative: 「清めの儀式を行い、彼女は清くなる」
  rationale: 原文は祭司の כפר 行為と、その結果としての女性の טהר を異なる動詞で述べるため、両者を一つの「清め」に平板化せず、神学的緊張と動作・結果の区別を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜しなければならない」で法規的文体を示しつつ、過度に古風な語尾は避けた。祭儀用語は本文内で一貫して名詞句として扱い、原文の条件、二種類の鳥、一羽ずつの用途、祭司の行為と清めの結果という構造を保持した。
