source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: ja
  text: しかし、女の子を産んだなら、母親は月経の汚れの時と同じように二週間、汚れた状態となる[a]。さらに六十六日間、清めの血の期間を過ごす[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「汚れ」は、道徳的な罪ではなく、礼拝に関する律法上の状態を指す。ヘブライ語は、出産後の状態を月経に伴う汚れの状態になぞらえている。
    reason: lexical_alternative
  - marker: b
    text: 「清めの血の期間」とは、出産後に定められた清めの期間を指し、道徳的な罪責を意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם נְקֵבָה תֵלֵד
  choice: しかし、女の子を産んだ場合
  rationale: 前節の男児の場合との対照を「しかし」で示した。נְקֵבָה は性別を表すため、現代日本語で自然な「女の子」とした。
- source_word: וְטָמְאָה שְׁבֻעַיִם
  choice: 母親は……二週間、汚れた者となる
  rationale: 主語を明確にするため「母親」を補った。טמא は道徳的罪ではなく祭儀上の状態を表すが、本文ではレビ記の基本語彙を保つため「汚れた者」とした。
- source_word: כְּנִדָּתָהּ
  choice: 月経の時と同じように
  rationale: 月経に伴う汚れの状態との比較を、過度に専門的にせず明瞭に表した。
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: その後、六十六日間
  rationale: ヘブライ語の「六十日と六日」を自然な日本語の数表現にまとめた。「その後」は期間の順序を明確にする文脈上の補足である。
- source_word: תֵּשֵׁב עַל דְּמֵי טָהֳרָה
  choice: 清めの血の期間を過ごす
  rationale: תֵּשֵׁב の継続の意味と、דְּמֵי טָהֳרָה の祭儀的な定型表現を合わせて自然に表した。「期間」は、この句が産後の定められた清めの期間を指すことを明示する補足である。
theological_decisions:
- issue: 出産後の「汚れ」の性質
  choice: 祭儀上の状態を表す語として「汚れた者となる」と訳す
  alternative: 「儀式上汚れた者となる」と本文中で明示する
  rationale: 原文には「儀式上」に当たる限定語がないため本文には加えず、道徳的な罪を意味しないことを脚注で明らかにした。
- issue: 「清めの血」の理解
  choice: 出産後に定められた清めの期間を指す表現として保持する
  alternative: 単に「清めの期間」と意訳する
  rationale: 原文の「血」という具体的表現を残しつつ、それが道徳的罪責ではなく祭儀上の期間に関する語であることを脚注で説明した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、レビ記の法的で厳粛な調子を保った。「汚れ」「清めの血」という原文の祭儀的語彙を残し、誤解を避ける説明は脚注に置いた。
