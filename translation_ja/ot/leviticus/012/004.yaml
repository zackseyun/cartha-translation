source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: ja
  text: その後、彼女は三十三日間、清めに関わる出血の期間を過ごす。[a] 清めの日々が終わるまでは、どの聖なるものにも触れてはならず、聖所に入ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「清めの血のうちにとどまる」。ヘブライ語の「血」は複数形であり、出産後の出血と、それに関わる祭儀上の清めの期間を表す難解な表現と理解される。
    reason: 原語の具体的な字義を示すとともに、本文の「清めに関わる出血の期間」という文脈上の理解を説明するため。
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: それから三十三日間
  rationale: 直訳では「三十日と三日」だが、現代日本語では「三十三日間」が自然であり、接続詞も文脈の継続として「それから」とした。
- source_word: תֵּשֵׁב
  choice: 期間を過ごす
  rationale: 基本義は「座る、住む、とどまる」だが、ここでは一定の状態が続く期間を表すため、自然な日本語で「期間を過ごす」とした。
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: 出産後の出血に伴う清めの期間
  rationale: ヘブライ語の具体的な「清めの血」という表現が指す産後の出血と祭儀的清めとの関係を、現代日本語で理解できる形にした。字義的表現は脚注に残した。
- source_word: בְּ/כָל קֹדֶשׁ לֹא תִגָּע
  choice: 聖なるものには何一つ触れてはならず
  rationale: כָּל と否定の組み合わせが表す全面的禁止を「何一つ」で示し、קֹדֶשׁ の広い意味を「聖なるもの」として保持した。
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: 聖所に入ってもならない
  rationale: מִקְדָּשׁ を祭儀的な場所として「聖所」とし、「来る」の空間的意味を日本語では自然な「入る」で表した。
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: 清めの日々が満ちるまでは
  rationale: מלא の「満ちる、完了する」という比喩を保ちつつ、期間の終点を自然な日本語で示した。
theological_decisions:
- issue: 出産後の状態を道徳的罪と誤解させずに祭儀的清浄の用語を訳すこと
  choice: 清め
  alternative: きよめ／清浄になること
  rationale: ここで扱われているのは出産後の祭儀的状態であり、本人の道徳的罪責ではない。「清め」はその制度的・祭儀的意味を保ち、本文が述べない罪の含意を加えない。
- issue: 「清めの血」という難解な句の解釈
  choice: 本文では「出産後の出血に伴う清めの期間」とし、字義的表現を脚注に示す
  alternative: 清めの血のうちにとどまる
  rationale: 語句の具体的イメージと解釈上の幅を脚注で保持しながら、本文は普通の読者に理解可能な日本語とした。「血そのものが清める」と断定する神学的読み込みは避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、律法文にふさわしい端正な文体とした。禁止表現には「触れてはならず」「入ってもならない」を用い、「清め」「聖なるもの」「聖所」など祭儀的な主要語を一貫して明示した。
