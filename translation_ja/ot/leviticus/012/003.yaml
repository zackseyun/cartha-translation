  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: ja
  text: 八日目に、その子の包皮の肉に割礼が施されなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より自然に「八日目に、その子に割礼を施さなければならない」とも訳せる。ヘブライ語は受動形で、直訳すると「その子の包皮の肉に割礼が施されなければならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: 八日目に
  rationale: 接続詞を日本語で明示すると不自然になりやすいため、法規の連続性は文脈に委ね、時間表現を自然な「八日目に」とした。
- source_word: הַ/שְּׁמִינִי
  choice: 八日目
  rationale: 序数が「日」を修飾する標準的な表現として訳した。
- source_word: יִמּוֹל
  choice: 割礼が施されなければならない
  rationale: ニファル形の受動性を保ちつつ、未完了形が法規文で表す義務を、現代日本語で明確な「なければならない」によって示した。
- source_word: בְּשַׂר
  choice: 肉
  rationale: 語の具体的な身体性を保つため「肉」とした。
- source_word: עָרְלָתֽ/וֹ
  choice: その子の包皮
  rationale: 三人称男性単数接尾辞を、直前の文脈で生まれた男児を指す自然な日本語「その子の」とし、עָרְלָהは標準的な医学・一般語である「包皮」とした。
theological_decisions:
- issue: 割礼を受ける主体と施す者
  choice: 受動表現「割礼が施される」を保持する
  alternative: 「その子に割礼を施さなければならない」
  rationale: ヘブライ語のニファル形は施術者を明示しないため、その曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語の法規文体。原文の受動形と「包皮の肉」という具体的表現を本文に残し、義務性は「なければならない」で表した。
