source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: ja
  text: イスラエルの子らに告げなさい。『女が身ごもって男の子を産んだなら[a]、その女は七日間、汚れた状態になる。月経の不浄の期間と同じように、汚れた状態になる[b]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女が身ごもって男の子を産むとき」とも訳せる。ヘブライ語は法規上の事例を提示しており、「なら」と「とき」のどちらでも表し得る。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「汚れ」は、月経に伴う祭儀上の不浄状態を指し、道徳的な罪を意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の契約共同体を指す定型句を比較的形式的に保った。文脈上、共同体全体への呼びかけである。
- source_word: אִשָּׁה כִּי תַזְרִיעַ
  choice: 女が身ごもり
  rationale: תַזְרִיעַ は字義的には「種を生じさせる」に関係するが、出産と結び付いた慣用表現として自然な現代日本語の「身ごもる」とした。כִּי の条件・事例提示は後続の「なら」で表した。
- source_word: וְיָלְדָה זָכָר
  choice: 男の子を産んだ
  rationale: זָכָר の男性であることを明示しつつ、日本語として自然に表現した。
- source_word: וְטָמְאָה
  choice: 汚れた者となる
  rationale: 祭儀的な清浄規定の状態を指すが、原文にない説明語を本文へ加えず、「汚れ」を用いた。動詞的な状態変化も「となる」で表した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を明確で自然な日本語にした。
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  choice: 月経による汚れの日々と同じように
  rationale: נִדָּה と דְּוֺתָהּ が示す月経時の祭儀的不浄を明確にし、比較表現 כִּימֵי を保った。
- source_word: תִּטְמָא
  choice: 汚れた者となる
  rationale: 節末で不浄状態を明示的に繰り返す原文を、日本語でも省略せず保持した。
theological_decisions:
- issue: טמא が示す汚れの性質
  choice: 本文では「汚れた者となる」とし、祭儀的状態であることを注で説明する
  alternative: 「儀式上汚れた者となる」
  rationale: レビ記の文脈では祭儀的な清浄・不浄を指すが、原語そのものに説明的修飾語を足さず、倫理的な罪と同一視されないよう注記した。
- issue: בְּנֵי יִשְׂרָאֵל の対象範囲
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の形と契約共同体の定型的呼称を保った。ただし男性だけに限定する意味を訳文へ付加しない。
- issue: כִּי による事例提示
  choice: 「なら」
  alternative: 「とき」
  rationale: 法規の条件的事例として訳したが、時間的・一般的な「とき」とも訳し得るため、その幅を注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。法規としての調子を保つため命令の導入を「告げなさい」とし、引用内は簡潔な規定文とした。原文の不浄表現の反復を保持した。
