source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: ja
  text: 祭司はそれをヤハウェの前に捧げ、彼女のために贖いを行う。こうして彼女は、血の流出[a]から清くなる。これが、男児または女児を産む女についての律法である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼女の血の源」。ここでは産後の血の流出を指す。
    reason: 原語מָקוֹרの字義的な「源」と、文脈上の意味である血の流出との両方を示すため。
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: 祭司はそれを……献げ
  rationale: 使役形と三人称男性単数の目的語接尾辞を踏まえ、直前のささげ物を祭司が御前に差し出す祭儀的行為として訳した。主語の「祭司」は文脈上明らかなので、日本語で分かりやすく補った。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 祭儀的な定型句を自然な日本語で表し、固有の神名יהוהは「ヤハウェ」とした。
- source_word: וְכִפֶּר עָלֶיהָ
  choice: 彼女のために贖いを行う
  rationale: 祭司によるכפרの行為を、特定の贖罪理論に限定せず、レビ記の祭儀用語として一貫して理解できる表現にした。前置詞עלはここでは「彼女のために」とした。
- source_word: וְטָהֲרָה
  choice: こうして彼女は……清められる
  rationale: 祭司の行為の結果として女性が祭儀的に清い状態になることを表す。「こうして」で結果関係を明示し、日本語では自然な受け身表現にした。
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: 血の流出[a]から
  rationale: מָקוֹרの基本像は「源、泉」だが、この産後の清めの文脈では血の流出を指す。「血の源」という不自然で誤解されやすい直訳を脚注に残し、本文では身体的な流出を明確にした。
- source_word: זֹאת תּוֹרַת
  choice: これが……律法である
  rationale: レビ記の規定をまとめる定型句として、תּוֹרָהを「律法」と訳した。
- source_word: הַיֹּלֶדֶת לַזָּכָר אֹו לַנְּקֵבָה
  choice: 男児または女児を産む女
  rationale: 分詞の意味を明示しつつ、זָכָר／נְקֵבָהの性別表現を「男児／女児」として、出産の文脈に自然な現代日本語にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を固有名として明示するため、「ヤハウェ」と音写した。
- issue: כפרの祭儀的意味
  choice: 贖いを行う
  alternative: 清めを行う／罪を償う
  rationale: この文脈では清めと密接に関わるが、כפרそのものを単に「清め」と同一視せず、また特定の贖罪理解に狭めないよう「贖い」を用いた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、祭儀本文にふさわしい格調を保った。「祭司」は文脈から補い、「こうして」によって行為と清めの結果関係を読みやすくした。
