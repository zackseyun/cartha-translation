source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: ja
  text: わたしは野の獣[a]をあなたがたに差し向ける。それらはあなたがたから子どもを奪い[b]、家畜を絶やし、あなたがたの数を減らす。こうして、あなたがたの通り道は荒れ果てる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「野の動物」。
    reason: חַיַּת הַשָּׂדֶה は野に生息する野生動物一般を表す。「野の獣」は簡潔な訳語である。
  - marker: b
    text: 直訳に近くは「あなたがたを子のない者とし」。ヘブライ語の動詞は、子どもを失わせることを表す。
    reason: 原文では「子ども」が明記されていない一方、動詞自体が通常その意味を含むため。
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: わたしは……をあなたがたに差し向ける
  rationale: שלח のヒフィルは「送る、差し向ける」。敵対的な災厄を民に向けて送る文脈を、自然な現代日本語で表した。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 野の獣
  rationale: 野に生息する野生動物を指す構文。「野の獣」は簡潔で格調があり、現代日本語でも理解できる。
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: それらはあなたがたから子どもを奪い
  rationale: שׁכל のピエルは通常、子を失わせること、すなわち「子どもを奪う／子を失わせる」を意味する。目的語は「あなたがた」だけだが、日本語では慣用的意味を明示したほうが自然である。
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: 家畜を絶やし
  rationale: הכרית は「断つ、絶やす」、בְּהֵמָה はここでは飼育される家畜を指す。「絶やす」により徹底的な損失という裁きの強さを保った。
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: あなたがたの数を減らす
  rationale: מעט のヒフィル「少なくする」を、人口減少の意味が明瞭になるよう訳した。
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: あなたがたの道は荒れ果てる
  rationale: נשׁם は荒廃することを表す。דֶּרֶךְ の複数形はこの文脈では実際の道路・往来路が自然だが、「道」という原語に近い表現を保った。
theological_decisions:
- issue: 子を失わせる句の省略された意味内容
  choice: 本文で「子どもを奪い」と明示する
  alternative: 「あなたがたを子のない者とし」または目的内容を明示せず「あなたがたから奪い」
  rationale: שׁכל のピエルが慣用的に子を失わせる意味を持つため、これは新たな神学的内容の付加ではなく、ヘブライ語の通常の含意を自然な日本語で明示するものである。
- issue: דַּרְכֵיכֶם の具体性
  choice: 「あなたがたの道」
  alternative: 「あなたがたの道路」または比喩的な「あなたがたの生き方」
  rationale: 社会の荒廃と人口減少の文脈では、往来が途絶えた実際の道を指す可能性が高い。ただし原語の意味幅を狭めすぎないよう「道」とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「わたし」を用いて神の一人称を自然に示し、四つの結果を読みやすく二文に分けた。古風すぎる語法や教派固有の表現は避けた。
