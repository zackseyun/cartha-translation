  source_fidelity: ヘブライ語の条件詞 אִם を「もし……なら」で明確に表し、複数形の二人称も「あなたがたが」で保持している。「定めに従って歩み」は בְּחֻקֹּתַי תֵּלֵכוּ の生活態度を表す比喩と法的・契約的文脈を自然に伝える。「戒めを守り、それらを行う」も תִּשְׁמְרוּ וַעֲשִׂיתֶם אֹתָם に忠実である。
