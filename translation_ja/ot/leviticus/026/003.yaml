  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: ja
  text: もしあなたがたが、わたしの定めに従って歩み、わたしの戒めを守り、それらを行うなら[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「わたしの定めのうちを歩む」。人生の歩みをその定めに従わせる、という契約上の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし……なら
  rationale: 契約における明示的な条件節を、自然な現代日本語の条件表現で示す。
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: わたしの定めに従って歩み
  rationale: חֻקּוֹתの法的・契約的な意味を「定め」で表し、הלךの「歩む」という生活態度の比喩も保つ。「に従って」を補うことで現代日本語として意味を明瞭にする。
- source_word: מִצְוֺתַי
  choice: わたしの戒め
  rationale: 神が命じた事柄を表す語として自然であり、「定め」との語義上の区別も保てる。
- source_word: תִּשְׁמְרוּ
  choice: 守り
  rationale: 法や戒めを遵守するという文脈でのשׁמרの標準的な意味を簡潔に表す。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: それらを行う
  rationale: 戒めを実際に遂行することを表す原文の直接的な言い方と強調を保つ。
theological_decisions:
- issue: 契約への服従を表す「歩む」という比喩
  choice: 「わたしの定めに従って歩み」として歩行の比喩を残す。
  alternative: 「わたしの定めに従って生活し」または「わたしの定めに従い」
  rationale: 原文は、人生の歩み全体を神の定めに沿わせるという契約的・倫理的な含みを持つ。比喩を残しつつ、「に従って」によって日本語での理解を助ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「定め」と「戒め」を使い分け、後続節へ続く条件節であることを末尾の読点で示した。
