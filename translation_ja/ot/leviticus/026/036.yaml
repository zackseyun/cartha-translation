source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: ja
  text: あなたがたのうち、なお残る者たちについては、わたしは敵たちの国々で彼らの心をくじけさせる。吹き立てられる葉の音[a]が彼らを追い立て、彼らは剣から逃げる者のように逃げる。追う者もいないのに、彼らは倒れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「吹き立てられる葉の音」。原文は葉を吹き動かす作用者を明示していない。
    reason: נִדָּףの受動的な意味を示し、風を本文で特定しない訳文選択を説明するため。
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: あなたがたのうち、なお残る者たち
  rationale: שׁארの分詞が示す、裁きの後に残された者たちという意味と、בכםによるイスラエルへの直接的な呼びかけを保った。
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: わたしは……彼らの心をくじけさせる
  rationale: מֹרֶךְは単なる恐怖よりも勇気の衰えや内面的な弱気を表す。ヘブライ語の使役的表現を、現代日本語として自然な形で訳した。
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: 敵の地で
  rationale: 複数形אַרְצֹתは離散先の諸地域を指し得るが、日本語では総称的な「敵の地」が自然で、敵の領域にいるという意味を明確に伝える。
- source_word: וְרָדַף אֹתָם
  choice: 彼らを追い立て
  rationale: רדףの「追う」を保ちつつ、取るに足りない音によって恐慌に駆られる文脈に合う日本語とした。
- source_word: קוֹל עָלֶה נִדָּף
  choice: 風に吹き立てられる木の葉の音
  rationale: קוֹל、עָלֶה、נִדָּףをそれぞれ「音」「木の葉」「吹き立てられる」と反映した。受動分詞は風を明示しないため、より直訳的な選択肢を脚注に示した。
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: 彼らは剣から逃げるように逃げ
  rationale: מְנֻסַת חֶרֶבが表す、剣を前にした逃走の仕方との比較を明示し、原文の反復的な強調も保った。
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: 追う者もいないのに倒れる
  rationale: נפלの簡潔で多義的な「倒れる」を保持し、現実には追跡者がいないという皮肉を「のに」で自然に示した。
theological_decisions:
- issue: 裁きの性質
  choice: 神が敵地にいる残存者の心をくじけさせ、ささいな音にも恐慌を起こさせる裁き
  alternative: 外的な軍事的追跡だけを描く、または単なる比喩的な不安とみなす読み
  rationale: 本文は内面の弱気を神の行為として明示し、その結果として木の葉の音にも逃げ惑う姿を描く。神の主体性と心理的な恐慌の両方を保ち、後代の教理概念は持ち込まなかった。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「くじけさせる」で内面的な勇気の崩壊を自然に表し、「剣から逃げるように逃げ」では原文の強調を残した。
