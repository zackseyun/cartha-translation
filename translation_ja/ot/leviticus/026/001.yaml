  to: あなたがたは、自分たちのために偶像を造ってはならない。彫像や立石を自分たちのために立ててはならない。また、その上にひれ伏すために、意匠を施した石[a]をあなたがたの地に置いてはならない。わたしが、あなたがたの神ヤハウェ[b]だからである。
