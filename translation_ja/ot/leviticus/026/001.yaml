id: LEV.26.1
reference: Leviticus 26:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: ja
  text: あなたがたは、自分たちのために偶像を造ってはならない。彫像や立石を自分たちのために立ててはならない。また、その上にひれ伏すために、意匠を施した石[a]をあなたがたの地に置いてはならない。わたしが、あなたがたの神ヤハウェ[b]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彫った石」「石の像」または「像を刻んだ石」とも訳せる。ヘブライ語表現の厳密な意味には議論があるが、禁じられた礼拝に関係する、図柄や像を施した石を指すと考えられる。なお、本文の「その上にひれ伏すために」は「それにひれ伏すために」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語ではYHWH（יהוה）。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: 偶像
  rationale: 崇拝の対象として作られる像を指す明瞭な現代日本語。原語に伴いうる「価値のないもの」という軽蔑的含意は、本文で説明的に付加しない。
- source_word: פֶסֶל
  choice: 彫像
  rationale: 彫って作られた像という具体的意味を保ち、「偶像」と同一語にまとめない。
- source_word: מַצֵּבָה
  choice: 立石
  rationale: 直立させた石の記念物・柱を簡潔に表す。「聖なる石柱」とすると祭儀的性格を原語以上に明示するため避けた。
- source_word: אֶבֶן מַשְׂכִּית
  choice: 像を刻んだ石
  rationale: 何らかの像や意匠を施した石という有力な理解を自然な日本語で示す。ただし厳密な形状・加工法には議論があるため脚注を付す。
- source_word: תַעֲשׂוּ לָכֶם
  choice: 自分たちのために…造ってはならない
  rationale: לָכֶםの再帰的・受益的な意味を保持しつつ、日本語の禁止命令として自然にした。
- source_word: תָקִימוּ לָכֶם
  choice: 自分たちのために立ててはならない
  rationale: קוםの使役形が表す「直立させる、建立する」を、対象物に合う現代日本語で表した。
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: あなたがたの地に置いてはならない
  rationale: נתןと場所を示すבの組み合わせを「置く」と訳し、契約の地という範囲を保った。
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: それにひれ伏むために
  rationale: 不定詞の目的用法と、対象に身をかがめる礼拝行為を直接表す。「その上で礼拝する」という可能性もあるが、文脈上は石を礼拝対象とする理解がより自然。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、一般的な推定発音に基づく日本語表記とした。
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: わたしが、あなたがたの神ヤハウェだからである
  rationale: כִּיが禁止の根拠を示すことを「だからである」で明確にし、契約上の定型句を荘重で分かりやすい日本語にした。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 「主」、または「エホバ」
  rationale: 本文が称号ではなく四文字神名を用いているため、固有名として示した。
- issue: 複数の祭儀用物を表す語の区別
  choice: 「偶像」「彫像」「立石」「像を刻んだ石」と訳し分ける
  alternative: すべてを「偶像」または「像」にまとめる
  rationale: 原文が異なる四つの表現を重ねていることを保ち、禁令の具体性を平板化しない。
- issue: עָלֶיהָが示す礼拝行為の関係
  choice: 石を対象として「それにひれ伏む」
  alternative: 「その上で礼拝する」
  rationale: 前置詞עַלには位置を示す可能性もあるが、この文脈では禁じられた石を崇敬対象とする読みが自然。ただし文法上の別解を完全には否定しない。
translation_notes:
  register: 律法の禁止命令としての荘重さを保ちながら、「造ってはならない」「立ててはならない」「置いてはならない」という明瞭な現代標準語で統一した。二人称複数は「あなたがた」、神の一人称は「わたし」とした。脚注記号は説明対象の直後に配置した。
