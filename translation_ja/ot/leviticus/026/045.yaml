source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: ja
  text: しかし、わたしは彼らのために、以前の世代の人々との契約[a]を思い起こす。その人々を、わたしは諸国民の目の前でエジプトの地から導き出した。彼らの神となるためであった。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「先の者たちとの契約」。出エジプトの世代、またはそれ以前の世代の人々を指すと考えられる。
    reason: 原語 רִאשֹׁנִים の字義と、具体的にどの先行世代を指すかという指示範囲の曖昧さを示すため。
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: しかし、わたしは……思い起こす
  rationale: 接続詞は基本的に「そして」だが、直前の裁きの文脈から契約を顧みる約束への転換を示すため、「しかし」とした。動詞はここでは将来の行為を表す。
- source_word: לָהֶם
  choice: 彼らのために
  rationale: 前置詞 ל を反映し、単に彼らを思い出すのではなく、彼らのために契約を顧みるという受益的な方向性を保った。
- source_word: בְּרִית רִאשֹׁנִים
  choice: 先の人々との契約
  rationale: רִאשֹׁנִים は名詞的に用いられた男性複数形で、字義的には「先の者たち」。後続の関係節が出エジプトを経験した人々を指すため、人間の先行世代として訳しつつ、曖昧さを脚注に残した。
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: その人々を……導き出した
  rationale: 関係節の対象は契約ではなく「先の人々」である。日本語で指示関係を明確にするため独立文にし、「その人々」と受けた。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 出エジプトの定型的な表現を保ち、「エジプトから」より原文の אֶרֶץ を明示した。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 諸国民の目の前で
  rationale: 出来事が諸国民に公然と目撃されたことを表す比喩を自然な日本語で保持した。
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: 彼らの神となるため
  rationale: 契約の定型句を自然な日本語で表現した。文脈上、出エジプトの目的を示す不定詞句として訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 「先の人々との契約」の指示対象
  choice: 出エジプトの際に導き出された先行世代との契約を指す表現として訳す。
  alternative: 「先祖との契約」または抽象的な「最初の契約」と解する。
  rationale: רִאשֹׁנִים は圧縮された表現であるが、後続の「その人々をエジプトの地から導き出した」が人々を先行詞とするため、「先の人々」が原文の構造を最も直接に保つ。「先祖」と断定せず、世代的な範囲の曖昧さを残した。
- issue: 神となることと出エジプトの目的関係
  choice: 「彼らの神となるため」として目的を明示する。
  alternative: 「彼らの神であるため」または「彼らの神となって」とする。
  rationale: לִהְיוֹת の不定詞構文は目的として自然に読めるが、契約関係の開始時点について余分な教理的説明は加えない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「わたし」「諸国民」「ヤハウェ」を用い、契約の定型表現を保った。長い原文を二文に分け、関係節の対象を読み違えにくくした。
