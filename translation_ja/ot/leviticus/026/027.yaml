  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: ja
  text: しかし、それにもかかわらず、あなたがたがわたしの言うことを聞かず[a]、わたしに逆らって歩むなら[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これほどのことがあっても」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「わたしとともにケリをもって歩む」。この「ケリ」は意味の確定が難しい語で、ここでは神に対する対立的な態度を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 契約の警告がさらに進む条件節であり、接続の逆接的な進展と条件の双方を自然な日本語で表す。
- source_word: בְּזֹאת
  choice: それにもかかわらず
  rationale: 直前までに述べられた懲らしめを受けてもなお、という譲歩の意味を表す。
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: わたしの言うことを聞かず
  rationale: שׁמעの「聞く」という比喩を保ちつつ、応答し従う含意も日本語で自然に伝える。
- source_word: וַהֲלַכְתֶּם
  choice: 歩む
  rationale: הלךがここで生活態度や振る舞いを表す慣用表現であることを保つ。
- source_word: עִמִּי בְּקֶרִי
  choice: わたしに逆らって
  rationale: 字義上の「わたしとともに、反抗して」という難解な結び付きを、神に対する敵対的・反抗的な振る舞いとして自然に表す。
- source_word: בְּקֶרִי
  choice: 逆らって
  rationale: קֶרִיはレビ記26章で反復される難語であり、「敵意をもって」「反抗して」などの幅がある。「逆らって」は意味を過度に限定せず、関係上の対立を明確にする。
theological_decisions:
- issue: レビ記26章の契約警告における「歩む」という慣用表現
  choice: 「わたしに逆らって歩む」とし、関係的な慣用表現を保持する。
  alternative: 「わたしに敵意をもって振る舞う」「わたしに従わない」
  rationale: 単なる不服従へ平板化せず、契約関係における対立姿勢と、原文の「歩む」という表現を残すため。
translation_notes:
  register: 明瞭で現代的かつ格調ある標準日本語。「あなたがた」で複数形を明示し、神の発話は「わたし」とした。節は次節へ続く条件節なので読点で閉じた。
