source:
  edition: WLC
  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: ja
  text: しかし、彼らが自分たちの咎と父祖たちの咎、すなわち、彼らがわたしに対して不実を働いた、その不実[a]を告白し、また、わたしに逆らって歩んだこと[b]を告白するなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不実」は、「背信」または「裏切り」とも訳せる。ヘブライ語は同根の名詞と動詞を重ね、「彼らがわたしに対して不実を働いた、その不実」と、契約を破ったことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「わたしに敵意をもって歩んだ」とも訳せる。ここで用いられるヘブライ語は意味の確定が難しく、この章では神に反抗し、敵対する態度を表す語として繰り返される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: しかし、彼らが……告白し……なら
  rationale: 接続詞付き完了形を、前後に続く条件構文の一部として自然な現代日本語の条件表現で訳した。
- source_word: עֲוֺנָם
  choice: 自分たちの咎
  rationale: עָוֹןが表す道徳的な過ちと責任の重みを保ちつつ、現代日本語として理解しやすい「咎」を用いた。
- source_word: עֲוֺן אֲבֹתָם
  choice: 父祖たちの咎
  rationale: 男性祖先を指す原文の語を保ち、契約共同体における先代の咎の告白という内容を弱めずに訳した。
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: わたしに対して不実を働いた、その不実
  rationale: 同根の名詞と動詞による反復を日本語でも「不実」の反復で示し、神への関係的・契約的背信を表した。
- source_word: וְאַף
  choice: さらに
  rationale: 告白すべきもう一つの事柄を加える機能を、過度に強調せず自然に表した。
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: わたしに逆らって歩んだ
  rationale: 「歩む」という行動・生き方の比喩を保ち、難語קֶרִיの文脈上の対抗的意味を「逆らって」で表した。
theological_decisions:
- issue: 父祖の咎を含む共同体的告白
  choice: 「父祖たちの咎」を本文に明記する
  alternative: 「先祖の罪」または「父祖の咎の結果」とする
  rationale: 原文は彼ら自身の咎と父祖の咎を並べており、その共同体的・契約的側面を個人主義的に弱めたり、単なる結果に置き換えたりしないため。
- issue: קֶרִיの不確定な意味
  choice: 本文では「逆らって」とし、脚注で「敵意をもって」の可能性を示す
  alternative: 本文を「敵意をもって」とする
  rationale: この章で反復される難語の対抗・反抗の意味を明瞭にしつつ、語義の不確かさを脚注で保持するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「咎」「父祖」は聖書文体としての重みを保ちながら一般読者にも理解可能。「不実」の意図的な反復によって原文の同根語反復を再現した。節末は次節へ続く条件節であるため読点で閉じた。
