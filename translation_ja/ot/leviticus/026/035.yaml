  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: ja
  text: その荒廃の全期間、土地は休む。あなたがたがその土地に住んでいたとき、あなたがたの安息の時[a]に休まなかった分を、土地は休むのである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「あなたがたの安息の時」とは、土地に定められていた安息、特にこの文脈では安息年を指す。
    reason: cross_reference
  - marker: b
    text: より直訳すれば、「その荒廃の全期間、土地は、あなたがたがそこに住んでいたときに、あなたがたの安息の時に休まなかった分を休む」となる。ヘブライ語は「休む」という同じ動詞を繰り返して強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: その荒廃している間、…ずっと
  rationale: 全期間を表す כָּל יְמֵי と、土地を指す女性単数接尾辞を伴う הַשַּׁמָּה を、自然な現代日本語で明示した。
- source_word: תִּשְׁבֹּת
  choice: 土地は…休む
  rationale: 女性単数形の主語が土地であることを補い、שׁבת の「休む」を保った。
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: 休まなかった、その休みを得る
  rationale: 目的語を示す אֵת אֲשֶׁר と同根動詞の反復を、日本語として理解できるよう「その休み」を補って表した。
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: あなたがたの安息の時
  rationale: 字義的な複数形と二人称複数接尾辞を保ちつつ、文脈上の土地の安息、特に安息年を脚注で説明した。
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: あなたがたがそこに住んでいた間
  rationale: ישׁב の不定詞構文が示す居住中の時間的状況と、女性単数代名詞が指す土地を自然に表した。
theological_decisions:
- issue: 「あなたがたの安息」の指示範囲
  choice: 本文では「あなたがたの安息の時」とし、脚注で土地に定められた安息、特に安息年を指すと説明する
  alternative: 本文で「安息年」と限定する
  rationale: 周辺文脈は安息年を強く示すが、原文自体は שַׁבָּת の複数形であり、本文で過度に限定しないため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「土地」を補って指示対象を明確にし、原文の「休む」の反復と因果的対比は本文および脚注で保持した。
