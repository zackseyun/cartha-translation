id: LEV.26.15
reference: Leviticus 26:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: ja
  text: また、もしあなたがたがわたしの掟を退け、あなたがたが心底から[a]わたしの定め[b]を忌み嫌い、わたしのすべての戒めを行わず、こうしてわたしの契約を破る[c]なら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたの魂が」。ここで「魂」は人の全存在、またはその内面を表す。
    reason: 原文の נֶפֶשׁ を用いた表現を示すため。
  - marker: b
    text: 「定め」は「裁定」または「規則」とも訳せる。
    reason: מִשְׁפָּטִים の法的な語義の幅を示すため。
  - marker: c
    text: 「契約を無効にする」または「契約に背く」とも訳せる。
    reason: הפר の、破る・無効にするという契約上の語義の幅を示すため。
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: わたしの掟
  rationale: 神が定めた規定を指す法的・契約的な語調を保ちつつ、現代日本語として自然である。後続の מִשְׁפָּטַי（「定め」）とも区別した。
- source_word: תִּמְאָסוּ
  choice: 退け
  rationale: 軽蔑を伴う拒絶を表すが、文脈上の行為を明確に示す自然な日本語として「退ける」を選んだ。
- source_word: מִשְׁפָּטַי
  choice: わたしの定め
  rationale: 法的な裁定・規範を指す。日本語で「裁き」とすると処罰の意味に偏りやすいため、「定め」とし、「掟」との語彙上の違いを保った。
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: あなたがたが心底から…忌み嫌い
  rationale: געל の強い嫌悪を「忌み嫌う」で表し、נֶפֶשׁ を含む慣用的表現の強さを「心底から」で自然に示した。原文の直訳は脚注に残した。
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: …行わず
  rationale: 先行する拒絶・嫌悪が不従順に至る流れを、簡潔で自然な接続によって表した。
- source_word: כָּל מִצְוֺתַי
  choice: わたしのすべての戒め
  rationale: 命令を意味する契約法上の語を、定着した聖書日本語である「戒め」で表した。
- source_word: לְהַפְרְכֶם
  choice: こうして…破る
  rationale: 不従順によって契約を無効にし、破棄する結果を表す使役形の含意を、「こうして…破る」で明示した。
- source_word: בְּרִיתִי
  choice: わたしの契約
  rationale: בְּרִית の標準的かつ正確な法的・神学的訳語である。
theological_decisions:
- issue: נֶפֶשׁ を含む嫌悪表現の訳し方
  choice: あなたがたが心底から…忌み嫌い
  alternative: あなたがたの魂が…忌み嫌い
  rationale: 原文では נֶפֶשׁ が文法上の主語だが、ここで人間を分割する特定の霊魂観を読み込まず、全人格的で強い嫌悪を自然な日本語で表した。字義的な形は脚注に明示した。
- issue: 契約法に関する複数の用語の区別
  choice: 掟／定め／戒め／契約
  alternative: 規定／裁き／命令／契約
  rationale: 原文が重ねる חֻקִּים、מִשְׁפָּטִים、מִצְוֹת、בְּרִית の違いを可能な範囲で保持し、一つの一般語に均さなかった。
- issue: לְהַפְרְכֶם の契約的含意
  choice: こうしてわたしの契約を破る
  alternative: わたしの契約を無効にする
  rationale: 契約違反という意味を明瞭にしつつ、契約そのものが存在しなくなるという神学的断定を避けた。「無効にする」は語義上可能な別訳として脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、契約法の厳粛な語調を保持した。26節の条件節が次節へ続くため、文末は「なら、」として未完の構文を保った。
