source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: ja
  text: これは、ヤハウェがご自分とイスラエルの子らとの間に、シナイ山でモーセの手によって[b]授けた、掟と裁きと教えである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直訳「モーセの手によって」。これは「モーセを通して」という意味の慣用句。
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: これは……である
  rationale: 直前までの契約規定を受ける総括句として、現代日本語で自然な指示表現とした。
- source_word: הַחֻקִּים
  choice: 掟
  rationale: 定められた規定を指す法的・契約的な語感を保つ。
- source_word: הַמִּשְׁפָּטִים
  choice: 裁き
  rationale: 法的判断や規定を表す語として、原語の基本的な法的意味を直接反映する。
- source_word: הַתּוֹרֹת
  choice: 教え
  rationale: תּוֹרָהは単なる法令だけでなく権威ある教示も表すため、三語の違いを保って「教え」とした。
- source_word: אֲשֶׁר נָתַן
  choice: 授けた
  rationale: נָתַןの「与えた」という意味を保ちつつ、神が規定を与える文脈にふさわしい自然で格調ある日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: ご自分とイスラエルの子らとの間に
  rationale: 契約当事者間の関係を示す構文と、בְּנֵי יִשְׂרָאֵלの字義的表現を保持した。
- source_word: בְּהַר סִינַי
  choice: シナイ山で
  rationale: 出来事の場所を示す自然な日本語とした。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセの手によって
  rationale: 媒介を意味するヘブライ語の慣用句を本文に残し、その意味を注で明示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の契約名を用いているため、称号へ置換せず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の訳
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の系譜的な定型表現を本文で保持し、自然な民族呼称を注に示した。
- issue: 三つの法的用語の区別
  choice: 掟と裁きと教え
  alternative: 諸規定と法令と律法
  rationale: חֻקִּים、מִשְׁפָּטִים、תּוֹרֹתを一語に均さず、それぞれの意味領域と並列表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、節末の総括にふさわしい簡潔で格調ある文体とした。原文の三つの法的用語と「モーセの手」という表現を意図的に保持した。
