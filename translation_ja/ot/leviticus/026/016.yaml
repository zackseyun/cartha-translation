  to: わたしもまた、あなたがたにこのようにする。わたしはあなたがたに、突然の恐怖[a]、目を衰えさせ、命を萎えさせる消耗性の病[b]と熱病[c]をもたらす。あなたがたは自分たちの種をむなしく蒔く。そして、あなたがたの敵がそれを食べる。
  rationale: 神が災いをもたらすという原文の構文を回復し、二つの病とその身体を消耗させる結果を自然な日本語で一続きにした。末尾はヘブライ語の接続詞が持つ関係の幅を保つため、因果を明示しない並列訳とした。脚注cは、実際に問題となる修飾関係を本文の該当箇所に結び付けて説明する。
