id: LEV.26.16
reference: Leviticus 26:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: ja
  text: わたしもまた、あなたがたにこのようにする。わたしはあなたがたに、突然の恐怖[a]、目を衰えさせ、命を萎えさせる消耗性の病[b]と熱病[c]をもたらす。あなたがたは自分たちの種をむなしく蒔く。そして、あなたがたの敵がそれを食べる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの上に突然の恐怖を課す」。この動詞には、課す、またはもたらすという意味がある。
    reason: lexical_alternative
  - marker: b
    text: この病名が具体的に何を指すかは確定できない。体を消耗させる病を指すと考えられる。
    reason: lexical_uncertainty
  - marker: c
    text: 「目を衰えさせ、命を萎えさせる」は、文法上は主として「消耗性の病と熱病」を修飾すると理解できるが、列挙された災い全体に関わると見ることもできる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַף אֲנִי
  choice: わたしもまた
  rationale: 強調を伴う継続・対応を表し、文脈上「わたしもまた」が自然である。
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: あなたがたにこのようにする
  rationale: 裁きとして聞き手に向けて行われることを表す。
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: あなたがたの上に……を臨ませる
  rationale: 使役形の「任命する、課す、もたらす」という幅を踏まえ、災いを上に置くという原文の方向性を自然な日本語で示す。
- source_word: בֶּהָלָה
  choice: 突然の恐怖
  rationale: 恐怖、狼狽、急な戦慄を表す語として、唐突な恐れの含意を伝える。
- source_word: הַשַּׁחֶפֶת
  choice: 消耗性の病
  rationale: 古代の正確な病名は不明であり、結核などに限定せず、衰弱をもたらす病という語感を保つ。
- source_word: הַקַּדַּחַת
  choice: 熱病
  rationale: 熱や燃えるような症状を表す病名として、明瞭で自然な現代日本語を用いる。
- source_word: מְכַלּוֹת עֵינַיִם
  choice: 目を衰えさせ
  rationale: 直訳的な「目を尽きさせる」の意味を、日本語で理解できる身体的衰弱の表現にする。
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: 命を衰弱させる
  rationale: 難解な句だが、נפשを抽象的な霊魂ではなく生命・活力として捉え、病による消耗を示す。
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: 種を蒔いても無駄になる
  rationale: 種蒔きが成果を結ばず、何の役にも立たないことを自然な日本語で表す。
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: あなたがたの敵がそれを食べる
  rationale: 接続詞は前文の無益さの理由として自然に理解でき、目的語接尾辞は蒔かれた種、またはそこから生じる作物を指す。
theological_decisions:
- issue: נָפֶשׁ の訳語
  choice: 命
  alternative: 魂、心、活力
  rationale: 身体的な病と衰弱を述べる文脈では、生きる力を含む「命」が適切であり、後代の心身二元論を持ち込まない。
- issue: 最後の接続詞の関係
  choice: 理由を表す「からである」
  alternative: 「そして、あなたがたの敵がそれを食べる」
  rationale: ヘブライ語の接続詞自体は広い関係を表し得るが、敵が食べることが種蒔きの無益になる事情を説明している。論理関係を明確にしつつ、脚注で並列的な訳も示す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。神の直接発話として「わたし」を用いた。病名を現代医学の特定疾患に限定せず、原文の不確実性を保った。
