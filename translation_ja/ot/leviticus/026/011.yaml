source:
  edition: WLC
  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: ja
  text: わたしはあなたがたのただ中に、わたしの住まいを置く。わたしの魂は、あなたがたを忌み嫌わない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: わたしの住まい
  rationale: 「住む」を語根とする名詞に一人称単数接尾辞が付いた形。「幕屋」と限定せず、神が民の中に住む場所という語義を明確に保った。
- source_word: בְּתוֹכְכֶם
  choice: あなたがたのただ中に
  rationale: 複数の民の内部・間にあることを表すため、自然でありつつ位置関係を明瞭に示す表現とした。
- source_word: נַפְשִׁי
  choice: わたしの魂
  rationale: 主語として明示された נֶפֶשׁ と一人称接尾辞を省略せず訳し、神ご自身の強い人格的関与を示す原文の表現を保持した。
- source_word: תִגְעַל
  choice: 忌み嫌わない
  rationale: געל は嫌悪して退けることを表す。文脈にふさわしい、明瞭で品位ある現代語を選んだ。
theological_decisions:
- issue: 神について用いられる「わたしの魂」
  choice: 原文どおり「わたしの魂」を明示する
  alternative: 単に「わたしは、あなたがたを忌み嫌わない」とする
  rationale: 擬人的表現を解釈的に消去せず、原文が示す神の人格的な約束と表現上の緊張を保つため。
- issue: מִשְׁכָּן の具体性
  choice: 「住まい」
  alternative: 「幕屋」または「住居」
  rationale: この節では神が民の間に置くご自身の住まいという意味を優先し、特定の建造物だけに限定しない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、契約の宣言にふさわしい簡潔で荘重な調子を保った。「ただ中」「魂」「忌み嫌う」により、原文の具体性と強さを残している。
