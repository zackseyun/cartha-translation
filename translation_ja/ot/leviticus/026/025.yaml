source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: ja
  text: わたしはあなたがたに向けて、契約の報復を行う剣[a]を差し向ける。あなたがたは自分たちの町々へ集められる。それから、わたしはあなたがたの間に疫病を送り、あなたがたは敵の手に渡される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「契約の報復を報復する剣」。同じ語根を重ねた強意表現である。「契約のために報復する剣」「契約に背いたことへの報復を行う剣」、または「契約に定められた報復を行う剣」とも理解できる。
    reason: 同根語を重ねた強調と、「契約」と「報復」の関係にある解釈上の幅を示すため。
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: わたしはあなたがたに…差し向ける
  rationale: 使役形の「来させる、もたらす」と、敵対的な עַל の意味を、剣による攻撃という文脈に即して自然な日本語で表した。
- source_word: חֶרֶב
  choice: 剣
  rationale: 戦争と裁きの手段を指す語として、簡潔で格調のある訳語を用いた。
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: 契約の報復を遂げる
  rationale: 同根語を重ねた強意表現の力を「報復を遂げる」で示し、בְּרִית との連語が持つ複数の近接した解釈は脚注で明示した。
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: あなたがたは自分たちの町々に集められる
  rationale: ニファル形の受動性を保ち、包囲を避けて町の中へ集められる情景を訳文に残した。
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: そこで、わたしはあなたがたの間に疫病を送り
  rationale: דֶבֶר は契約の呪いの文脈における流行性の災厄なので「疫病」とした。「そこで」は、町に集められた後に疫病が広がる流れを示す。
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: あなたがたは敵の手に渡される
  rationale: 受動形と「手」の権力を表すヘブライ語慣用句を、日本語でも自然な「敵の手に渡される」で保持した。
theological_decisions:
- issue: 「契約の報復」の意味
  choice: 契約に結びついた神の裁きという関係を保ち、「契約の報復」と訳す
  alternative: 「契約に背いたことへの報復」「契約に代わってなされる報復」「契約に定められた報復」
  rationale: 属格的な連結は、契約違反を理由とする報復、契約を擁護する報復、契約に規定された制裁という近接した含みを許す。本文では一つに限定せず、脚注で幅を示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の裁きの厳粛さを保つ文体とした。「疫病」「敵の手に渡される」は聖書的な格調を保ちつつ、現在でも理解しやすい表現である。
