id: LEV.26.21
reference: Leviticus 26:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: ja
  text: もし、あなたがたがわたしに逆らって歩み[a]、わたしの言うことを聞こうとしないなら、わたしはあなたがたの罪に応じて、さらに七倍の打撃をあなたがたに加える[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしに敵対して歩み」。ここで「逆らって」と訳したヘブライ語は意味の確定が難しいが、この章では神に対抗する態度を表している。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「あなたがたの罪に応じて、さらに七回あなたがたを打つ」。
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: 逆らって
  rationale: 語義の確定が難しい語だが、レビ記26章で繰り返される文脈では、単なる偶然ではなく、神に対抗する態度を表す。「逆らって」は敵対性を伝えつつ、過度に強く限定しない。
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: わたしに逆らって歩み
  rationale: 「歩む」という行動・生き方の比喩を保ちながら、קֶרִי が示す対抗的な態度を自然な日本語で表した。
- source_word: וְלֹא תֹאבוּ לִשְׁמֹעַ לִי
  choice: わたしの言うことを聞こうとしない
  rationale: תֹאבוּ の意志性を「聞こうとしない」で示し、שׁמע の「聞く」と「従う」の含みを一方に限定せず残した。
- source_word: וְיָסַפְתִּי
  choice: さらに…加える
  rationale: 字義的な「加える」と、先行する懲罰が一段と増し加えられる文脈の双方を保った。
- source_word: מַכָּה
  choice: 打撃
  rationale: 「疫病」など特定の災厄に狭めず、打撃・災厄・傷を含み得る広い懲罰的意味を保った。
- source_word: שֶׁבַע
  choice: 七倍
  rationale: この章で反復される強化された裁きの定型句として、自然な日本語の「七倍」を用いた。
- source_word: כְּחַטֹּאתֵיכֶם
  choice: あなたがたの罪に応じて
  rationale: 単なる原因の「罪のために」だけでなく、罪との対応・相応性を示す前置詞 כְּ の含みを表した。
theological_decisions:
- issue: 契約上の懲罰が強められることの表現
  choice: 罪に応じて七倍の打撃が加えられるという警告として訳す
  alternative: 「罪のゆえに七回疫病を下す」のように、因果関係・回数・災厄の種類を限定する
  rationale: 本文は裁きの増大と罪との対応を明確にするが、מַכָּה の具体的な形や שֶׁבַע が厳密な回数を指すかは限定していないため、その幅を保った。
- issue: 「聞く」に含まれる服従の含意
  choice: 「言うことを聞こうとしない」とし、聴取と服従の両方を含み得る表現にする
  alternative: 「従おうとしない」と明示する
  rationale: 契約文脈では服従が含意されるが、原語 שׁמע の基本的な「聞く」という像を消さず、解釈を狭めないため。
translation_notes:
  register: 現代の一般読者に分かりやすい標準的な日本語を用いながら、「歩む」「打撃を加える」によって原文の比喩と厳粛な警告の調子を保った。
