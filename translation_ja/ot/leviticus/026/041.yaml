id: LEV.26.41
reference: Leviticus 26:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: ja
  text: わたしも彼らに逆らって歩み、彼らを敵たちの地へ連れて行く。あるいは、その時、彼らの割礼を受けていない心がへりくだり[a]、そのとき彼らは自分の咎の罰を受け入れる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らの無割礼の心がへりくだり」。これは内面の頑なさと汚れを表す契約的な比喩である。「あるいは、その時」という前置きの句は原文でも解釈が難しく、心がへりくだる時点を示している可能性がある。
    reason: cultural_note
  - marker: b
    text: または「彼らは自分の咎を償う」。このヘブライ語の慣用表現は、罪責に伴う当然の結果を受け入れ、負うことを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: わたしも
  rationale: 強意と応報的な対応を簡潔に保ち、神の行為が彼らの態度に呼応することを示す。
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: 彼らに逆らって歩み
  rationale: レビ記26章で反復される契約の呪いの表現を踏まえ、הלך の比喩を残しつつ、קֶרִי の敵対・反抗の意味を自然な日本語で表す。
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: 彼らを敵の地へ連れて行く
  rationale: בוא のヒフィルを「連れて行く」とし、捕囚先である敵の領土を明瞭に示す。
- source_word: אוֹ אָז
  choice: あるいは、その時
  rationale: 統語的に難しい句であるため、接続の不自然さを解消し切らず、ヘブライ語の選言的な力を保持する。
- source_word: יִכָּנַע
  choice: へりくだり
  rationale: 心を主語とするニファル形なので、外的な制圧より内面的な低下・悔悟を表す「へりくだる」が適切。
- source_word: לְבָבָם הֶעָרֵל
  choice: 彼らの割礼を受けていない心
  rationale: 契約的比喩を「頑なな心」へ平板化せず保持しつつ、現代日本語で理解できる形にする。
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: 彼らは自分の咎の罰を受け入れるようになる
  rationale: רצה＋עון は咎に伴う当然の結果を受ける、または償うという司法的な慣用表現であり、功績による贖罪と断定せず意味を明瞭にする。
theological_decisions:
- issue: 心に用いられた הֶעָרֵל の契約的比喩
  choice: 「割礼を受けていない心」という比喩を本文に残す
  alternative: 「頑なな心」「悔い改めない心」
  rationale: トーラーおよび預言書につながる契約的な含意を保ち、一般的な頑固さという解釈に狭めないため。
- issue: יִרְצוּ אֶת עֲוֺנָם の意味
  choice: 「自分の咎の罰を受け入れるようになる」
  alternative: 「自分の咎を償う」「咎の代価が支払われる」
  rationale: 契約違反の結果を認めて負う司法的意味を表しつつ、人が自力で贖罪を成し遂げるとの教理的含意を持ち込まないため。
- issue: אוֹ אָז の論理関係
  choice: 「あるいは、その時」として難しさを保持する
  alternative: 「その時」「もしその時」
  rationale: 原文の אוֹ を省かず、選言、転換、条件的展開のいずれとも取り得る曖昧さを残すため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話としての荘重さを保った。「逆らって歩む」「割礼を受けていない心」という原文の反復的・契約的表現を残し、難解な אוֹ אָז は過度に平滑化しなかった。すべての脚注記号を本文中に配置した。
