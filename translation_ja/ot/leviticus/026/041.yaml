  naturalness: 「彼らに逆らって歩み」「割礼を受けていない心」は、やや字義的ではあるが、反復される契約的表現と比喩を保つ明瞭な現代日本語として許容できる。「敵たちの地」とすることで「彼らの敵たちの地」の関係がより明瞭になる。
  terminology: 「咎」「割礼」「へりくだる」は適切である。「無割礼の心」は脚注内の短い直訳としても問題ない。本文の「割礼を受けていない心」と脚注の「無割礼の心」の対応も理解可能である。
