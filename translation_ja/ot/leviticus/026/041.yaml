revisions:
- from: わたしも彼らに逆らって歩み、彼らを敵の地へ連れて行く。あるいは、その時、彼らの割礼を受けていない心がへりくだり[a]、彼らは自分の咎の罰を受け入れるようになる[b]。
  to: わたしも彼らに逆らって歩み、彼らを敵たちの地へ連れて行く。あるいは、その時、彼らの割礼を受けていない心がへりくだり[a]、そのとき彼らは自分の咎の罰を受け入れる[b]。
  rationale: 原文の曖昧な אוֹ אָז は「あるいは、その時」として保持した。後半の וְאָז を「そのとき」で訳出し、יִרְצוּ の将来形には「受け入れる」を用いた。「敵たちの地」は原文の「彼らの敵たち」の関係を明瞭にする。脚注bから、原文の複数主語とずれる受動的な代案を除き、本文の意味を補う代案だけを残した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:26:48Z'
