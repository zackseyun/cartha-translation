id: LEV.26.13
reference: Leviticus 26:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: ja
  text: わたしは、あなたがたの神、ヤハウェである。わたしはあなたがたをエジプトの地から、彼らの奴隷であった状態から導き出した。わたしはあなたがたのくびきの横木[a]を折り、あなたがたを背を伸ばして[b]歩ませた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「くびきの棒」。
    reason: מֹטֹתは、くびきを構成する棒または横木を指し得るため。
  - marker: b
    text: または「まっすぐに歩ませた」「頭を高く上げて歩ませた」。
    reason: קוֹמְמִיּוּתは直立した姿勢を表し、文脈上、解放された者の尊厳ある歩みも含意し得るため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を一般的な学術的表記で音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 契約定式の中でヤハウェ一人を指しているため、単数の「神」とした。接尾辞の複数二人称は「あなたがた」で表した。
- source_word: הוֹצֵאתִי
  choice: 導き出した
  rationale: יצאのヒフィル形が示す「外へ出させる」を自然な日本語で表し、出エジプトという移動の意味も保った。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 地理的・契約的な定型表現を簡潔に保持した。
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: 彼らの奴隷であった状態から
  rationale: 前置詞付き不定詞が示す、奴隷状態からの解放を明示した。עֲבָדִיםはここでは一般的な奉仕者ではなく、エジプト支配下の隷属身分を指すため「奴隷」とした。
- source_word: וָאֶשְׁבֹּר
  choice: わたしは…折り
  rationale: שברの具体的な破壊行為と、一人称で語られる神の行為を直接的に表した。
- source_word: מֹטֹת עֻלְּכֶם
  choice: あなたがたのくびきの横木
  rationale: מֹטֹתを、くびきを構成する棒という具体像が伝わる「横木」とした。隷属を担わせる器具の比喩を保持した。
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: あなたがたを…歩ませた
  rationale: הלךのヒフィル形の使役的意味を保ち、単なる「導いた」に弱めなかった。
- source_word: קוֹמְמִיּוּת
  choice: 胸を張って
  rationale: まっすぐ立った姿勢と、隷属から解放されて尊厳を回復した様子の両方が自然な日本語で伝わる表現を選んだ。より字義的な姿勢の描写は脚注に示した。
theological_decisions:
- issue: エジプトにおけるイスラエルの身分
  choice: 奴隷
  alternative: しもべ
  rationale: 文脈は圧制的な隷属からの解放を語るため、身分の苛酷さを和らげず「奴隷」とした。
- issue: 節末の解放のイメージ
  choice: 胸を張って歩ませた
  alternative: まっすぐ立って歩ませた
  rationale: 原文は使役的な移動と直立した姿勢を組み合わせる。本文では尊厳回復の含意を自然に表しつつ、身体姿勢としての字義的な可能性を脚注で保持した。
- issue: 神名の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号へ置換せず、その人格的・契約的な神名を明示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、神の自己宣言には簡潔で荘重な調子を保った。「くびき」「横木」という具体的な隷属の比喩を残し、末尾は過度に抽象化せず身体的な姿勢と回復された尊厳がともに感じられる表現にした。
