source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: ja
  text: わたしはあなたがたを諸国の間に散らし、あなたがたの後を追って剣を抜く[a]。あなたがたの地は荒れ果て、町々は廃墟となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの後に向けて剣を抜く」。
    reason: אַחֲרֵיכֶםの空間的表現を示すとともに、文脈上の追撃の含意を補うため。
lexical_decisions:
- source_word: אֱזָרֶה
  choice: 散らし
  rationale: זרהのヒフィル形が表す分散の意味を、契約の裁きによる離散という文脈に即して自然な現代日本語で表した。
- source_word: בַגּוֹיִם
  choice: 諸国の民の間に
  rationale: גּוֹיִםの諸民族・諸国という意味を保ちつつ、地理的な離散先とそこに住む人々の両方が自然に伝わる表現とした。
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: 剣を抜く
  rationale: ריקとחֶרֶבの組み合わせは、剣を鞘から抜くという軍事的慣用表現である。具体的な比喩と神の直接的行為を保持した。
- source_word: אַחֲרֵיכֶם
  choice: あなたがたを追って
  rationale: 字義は「あなたがたの後ろに／後を」であり、ここでは敵対的な追跡を意味するため、日本語でその文脈的意味が明確になるようにした。
- source_word: שְׁמָמָה
  choice: 荒れ果て
  rationale: 土地が徹底して荒廃した状態になることを、現代日本語で自然かつ荘重に表した。
- source_word: חָרְבָּה
  choice: 廃墟
  rationale: 町々が破壊され、荒廃した場所となる結果を簡潔に表す語を選んだ。
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: 荒れ果て……廃墟となる
  rationale: היהの結果・変化の含意を、「となる」および状態変化を示す述語によって表した。
theological_decisions:
- issue: 捕囚と軍事的追撃を告げる契約の裁きにおける神の主体性
  choice: 「わたしは……散らし、……剣を抜く」と一人称の直接的行為を保持する
  alternative: 受動態や非人称表現にして神の直接的主体性を弱める
  rationale: ヘブライ語は離散と剣による追撃を神ご自身の行為として明示しているため、その神学的緊張を和らげずに訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの宣告にふさわしい簡潔で荘重な調子を保った。「諸国の民」は後代の宗教的含意を帯びやすい「異邦人」を避けた表現である。
