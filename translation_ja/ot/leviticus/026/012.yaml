source:
  edition: WLC
  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: ja
  text: わたしはあなたがたの間を歩み[a]、あなたがたの神となる。あなたがたはわたしの民となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのただ中を歩み」。
    reason: בְּתוֹכְכֶםの、より形式的で原語の空間表現に近い訳を示すため。
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: 歩み
  rationale: הלךのヒトパエル形が表す、民の中を行き巡る具体的な臨在のイメージを保つ。「住む」とすると、原語の動作性を越えて解釈を加えることになる。
- source_word: בְּתוֹכְכֶם
  choice: あなたがたの間を
  rationale: 共同体のただ中におられることを、自然な現代日本語で表す。「あなたがたの内を」は個々人の内面的な内住と誤解されやすいため避けた。
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: あなたがたの神となる
  rationale: יהיה＋לによる定型的な契約表現を、関係性を保った自然な日本語にした。
- source_word: לֵאלֹהִים
  choice: 神
  rationale: イスラエルとの契約という文脈では、契約関係にある唯一の神を指し、不定の「一人の神」ではない。
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: あなたがたはわたしの民となる
  rationale: 相互的な契約関係を表す定型句として、原文の関係的な意味を明瞭かつ自然に伝える。
theological_decisions:
- issue: 契約定型句の訳し方
  choice: 「あなたがたの神となる。あなたがたはわたしの民となる」
  alternative: 「あなたがたにとって神となり、あなたがたはわたしにとって民となる」
  rationale: ヘブライ語の相互的な契約関係を保ちつつ、余分な教理的説明を加えず、明瞭で格調ある現代日本語とした。
translation_notes:
  register: 平明で格調のある現代標準日本語。「わたし」を用い、神の臨在を表す具体的な「歩む」という比喩と、簡潔な契約定型句を保持した。
