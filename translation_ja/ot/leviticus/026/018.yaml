source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: ja
  text: これらのことがあっても[a]、なおわたしの言うことを聞かないなら、わたしはあなたがたの罪のために、さらに七倍にして、あなたがたを懲らしめる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらすべてのことの後にも」または「これらすべてのことにもかかわらず」。このヘブライ語の言い回しは、先に述べられた裁きがあってもなお、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם עַד אֵלֶּה
  choice: これらのことがあっても、なお……なら
  rationale: 条件を導く וְאִם と、先行する裁きにもかかわらず背き続けることを表す עַד אֵלֶּה の慣用的な意味を、自然な日本語で一体として表した。単なる時間的な「これらまで」にはしなかった。
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: わたしの言うことを聞かない
  rationale: שׁמע の「聞く」という比喩を保ちつつ、文脈から従順に応答する含意も読み取れる表現とした。「従わない」と明示して意味を限定することは避けた。
- source_word: וְיָסַפְתִּי
  choice: さらに
  rationale: 先行する裁きに加えて懲らしめを継続・強化する反復的な意味を、簡潔で自然な日本語にした。
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: あなたがたを……懲らしめる
  rationale: יסר が持つ処罰的な力と矯正の目的の両方を表し得る語を選んだ。単なる報復を示す「罰する」より原語の幅を保つ。
- source_word: שֶׁבַע
  choice: 七倍厳しく
  rationale: 裁きが大幅に強められることを自然に示しながら、「七」という原文の表現も保持した。厳密な回数を指す可能性は脚注に残した。
- source_word: עַל חַטֹּאתֵיכֶם
  choice: あなたがたの罪のために
  rationale: 懲らしめの根拠を示す עַל の因果的な意味を、明瞭な現代日本語で表した。
theological_decisions:
- issue: 契約の裁きという文脈における יָסַר の性質
  choice: 懲らしめる
  alternative: 罰する／戒める
  rationale: この語には処罰と矯正の両面がある。「罰する」だけでは報復に狭まり、「戒める」だけでは裁きの厳しさが弱まるため、両者の緊張を保つ「懲らしめる」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」は神の発話として一般読者に自然な表記を採用し、「懲らしめる」によって警告の厳しさと矯正的含意をともに残した。
