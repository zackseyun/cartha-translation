source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: ja
  text: わたしはあなたがたの方に向き[a]、あなたがたを実り多くし、増やす。そして、あなたがたとのわたしの契約を確立する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたがたの方に向く」。ここでは、好意をもって顧みることを含意する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: わたしはあなたがたに心を向け
  rationale: פנה の「向く」という具体的な像を保ちつつ、この祝福の文脈で神が好意をもって顧みる意味を、現代日本語として自然な「心を向け」で表した。
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: あなたがたに子を生ませ
  rationale: פרה のヒフィル形が表す使役的な実り、すなわち民の生殖と繁栄を明瞭に伝える。直訳的な「実り多くする」よりも、人々を目的語とするこの箇所では自然である。
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: その数を増やす
  rationale: רבה のヒフィル形が表す人口の増加を自然な日本語で示し、直前の「子を生ませ」と連続する祝福の内容を保った。
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי אִתְּכֶם
  choice: あなたがたとのわたしの契約を確かなものとする
  rationale: קום のヒフィル形と「契約」の結合は、文脈により契約を立てる、確認する、維持する意味を持ちうる。ここではすでに契約関係にあるイスラエルへの約束であるため、曖昧さを狭めすぎない「確かなものとする」とした。
theological_decisions:
- issue: 神が民に「向く」ことの好意的意味をどこまで明示するか
  choice: 本文を「心を向け」とし、好意的に顧みる意味を脚注で示す
  alternative: 「あなたがたを好意をもって顧み」または、より直訳的に「あなたがたの方を向き」
  rationale: 祝福の文脈は神の好意を明白に示すが、動詞自体は基本的に「向く」である。具体的な像と文脈上の含意の双方を保つため、本文と脚注を組み合わせた。
- issue: 「契約を立てる」が新規締結を意味するか、既存の契約の確認を意味するか
  choice: 「契約を確かなものとする」
  alternative: 「契約を立てる」または「契約を守る」
  rationale: הקים ברית は契約の確立・確認・履行を含みうる。この文脈で新しい契約の締結だけに限定せず、同時に「守る」と意訳しすぎない表現を選んだ。
translation_notes:
  register: 神の発言にふさわしい簡潔で dignified な現代標準日本語とした。「心を向け」は自然さを確保しながら原文の「向く」という像を残す。複数の二人称は一貫して「あなたがた」とした。
