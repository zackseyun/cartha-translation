  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: ja
  text: 脱穀はぶどうの収穫まで続き、ぶどうの収穫は種まきの時まで続く。あなたがたはパンを満ち足りるまで食べ、自分たちの地で安心して暮らす。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשִּׂיג ... דַּיִשׁ אֶת־בָּצִיר
  choice: 脱穀はぶどうの収穫まで続き
  rationale: 動詞 נׂשג の字義は「追いつく、達する」だが、ここでは豊作のため一つの農作業が次の季節まで継続することを表す。「続く」で自然にその意味を伝える。
- source_word: וּבָצִיר יַשִּׂיג אֶת־זָרַע
  choice: ぶどうの収穫は種まきの時まで続く
  rationale: בָּצִיר はぶどうの収穫、זֶרַע は文脈上、種または種まきの時期を指す。農事暦の連続を明確にするため「種まきの時」とした。
- source_word: לָשֹׂבַע
  choice: 満ち足りるまで
  rationale: 「満腹、十分」を表し、食物が豊かに与えられる含意を保つ。
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: 安心して暮らす
  rationale: ישׁב は「住む、暮らす」、לבטח は危険への恐れのない安全な状態を表す。現代日本語として自然な「安心して暮らす」とした。
theological_decisions:
- issue: 契約の祝福としての農作物の豊かさと安全
  choice: 季節をまたぐ豊作と、地で安心して暮らすことを、そのまま将来の約束として訳す
  alternative: 一般的な繁栄や霊的祝福として抽象化する
  rationale: 本文は脱穀、ぶどうの収穫、種まき、食物、土地での安全という具体的な契約の祝福を述べているため、抽象化しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。農事用語は一般読者に理解できる語を選び、原文の二つの節の並行構造を保持した。
