id: LEV.26.37
reference: Leviticus 26:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: ja
  text: 彼らは、剣を前にしたかのように、互いにつまずく[a]。追う者もいないのに、あなたがたは敵の前に立ちこたえることができない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「人が自分の兄弟につまずく」。恐怖のあまり互いにぶつかり合う様子を表す。
    reason: lexical_alternative
  - marker: b
    text: または「あなたがたには、敵の前に立つすべがない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: つまずく
  rationale: כשל の具体的な像を保ち、恐怖のために足を取られる文脈にも自然に合う。
- source_word: אִישׁ בְּאָחִיו
  choice: 互いに
  rationale: 字義的には「人がその兄弟に／兄弟につまずく」。分配的・相互的な意味を、現代日本語で自然に表した。
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: 剣を前にしたかのように
  rationale: 原文に明記されていない「逃げる」を補わず、比較表現と脅威に直面する像を保った。
- source_word: וְרֹדֵף אָיִן
  choice: 追う者もいないのに
  rationale: 字義は「追う者はいない」。前句との逆説的・譲歩的な関係を自然な日本語で示した。
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: あなたがたは…立ちこたえることができない
  rationale: תְּקוּמָה は「立つこと、立ち上がること、持ちこたえる力」を表し、敵との対峙という文脈では抵抗して持ちこたえる能力を指す。
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: 敵の前に
  rationale: 敵との対峙を表す לפני の簡潔で自然な訳。
