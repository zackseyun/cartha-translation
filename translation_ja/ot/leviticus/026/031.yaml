id: LEV.26.31
reference: Leviticus 26:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: ja
  text: わたしはあなたがたの町々を廃墟とし、あなたがたの聖所を荒れ果てさせる。そして、あなたがたのささげ物の心地よい香り[a]を嗅ぐことはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「あなたがたの心地よい香り」。これは、ささげ物が神に受け入れられることを表す祭儀上の定型表現。「ささげ物の」は意味を明確にするために補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: わたしはあなたがたの町々を廃墟とし
  rationale: נתןは字義的には「与える、置く」だが、目的語と述語名詞חָרְבָּהを伴うこの構文では「町々を廃墟にする」という使役的な意味になる。עָרִיםの複数は「町々」で表した。
- source_word: וַהֲשִׁמּוֹתִי
  choice: 荒れ果てさせる
  rationale: שמםのヒフィル形が表す「荒廃した状態にする」という使役の意味を、明瞭で自然な現代日本語にした。
- source_word: מִקְדְּשֵׁיכֶם
  choice: あなたがたの聖所
  rationale: מִקְדָּשׁは礼拝のために聖別された場所を指すため「聖所」とした。日本語では無標の名詞でも複数を表せ、文脈上も複数の聖所を指し得るため、不自然な「聖所の数々」は避けた。
- source_word: וְלֹא אָרִיחַ
  choice: 嗅ぐことはない
  rationale: ריחの明示的な嗅覚表現を保持した。「受け入れない」と意訳せず、神を人間的な感覚で描く原文の比喩を残した。
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: あなたがたのささげ物の心地よい香り
  rationale: רֵיחַ נִיחוֹחַは祭儀で用いられる定型句であり、「心地よい香り」とした。字義どおりの「あなたがたの心地よい香り」では人々自身の体臭とも受け取られ得るため、祭儀的指示対象である「ささげ物の」を明示した。補足であることは脚注に示した。
theological_decisions:
- issue: 末尾を嗅覚表現のまま訳すか、供え物を拒絶する意味に置き換えるか
  choice: 「心地よい香りを嗅ぐことはない」とし、原文の擬人的な嗅覚表現を保持する
  alternative: 「あなたがたのささげ物を受け入れない」
  rationale: ヘブライ語は「嗅ぐ」という動詞と祭儀上の定型句「心地よい香り」を明記している。受容拒否という含意はあるが、それに置き換えず、原文の祭儀的・神学的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の宣告にふさわしい簡潔で厳粛な調子を保った。「町々」で複数を明示し、「聖所」は日本語として自然な無標複数とした。接続は文を分けて「そして」とし、三つの将来的な裁きを読みやすく示した。
