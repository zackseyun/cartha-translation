source:
  edition: WLC
  text: בְּ/שִׁבְרִ֣/י לָ/כֶם֮ מַטֵּה לֶחֶם֒ וְ֠/אָפוּ עֶ֣שֶׂר נָשִׁ֤ים לַחְמְ/כֶם֙ בְּ/תַנּ֣וּר אֶחָ֔ד וְ/הֵשִׁ֥יבוּ לַחְמְ/כֶ֖ם בַּ/מִּשְׁקָ֑ל וַ/אֲכַלְתֶּ֖ם וְ/לֹ֥א תִשְׂבָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: ja
  text: わたしがあなたがたのパンの供給[a]を断つとき、十人の女性が一つのかまどであなたがたのパンを焼き、パンを重量で返す。あなたがたは食べても、満腹にはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「パンの杖」。生命を支えるパンの供給を指す比喩的な表現。
    reason: 本文ではヘブライ語の慣用句の意味を明瞭に訳し、脚注で字義的な比喩を示すため。
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: わたしが……断つとき
  rationale: בְּ＋不定詞構文の時を表す働きを「とき」で示した。שׁבר は直訳すれば「砕く」だが、ここでは生活を支える供給を絶つ比喩なので、現代日本語として自然な「断つ」とした。
- source_word: מַטֵּה לֶחֶם
  choice: パンの支え
  rationale: 字義的な「パンの杖」という比喩と、糧を支える供給源という意味の両方を保つため「パンの支え」とし、字義を脚注に示した。
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: 十人の女が……焼き
  rationale: 明記された人数と女性という主体を保った。完了形は裁きの予告の連続として未来的に理解し、日本語では時制を文脈に委ねた。
- source_word: בְּתַנּוּר אֶחָד
  choice: 一つのかまどで
  rationale: 極端な欠乏のため十人分のパンを一基で焼けるという強調を保持した。「かまど」は古代の焼き炉を一般読者に分かりやすく表す。
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: それを量って返す
  rationale: שוב のヒフィルを「返す」、בַּמִּשְׁקָל を配給のため重量を量ることとして「量って」と訳した。日本語で不自然な所有語の反復は代名詞で整理した。
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: あなたがたは食べても、満腹にはならない
  rationale: 食べることと飢えが満たされないことの逆接を「ても」で自然に示し、שׂבע の食事に即した意味を「満腹になる」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。裁きの厳しさと欠乏の具体像を保ち、「食糧供給」へ全面的に言い換えずパンの比喩を残した。
