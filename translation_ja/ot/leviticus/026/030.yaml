base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: ja
  text: わたしはあなたがたの高き所を滅ぼし、香をたく祭壇[a]を切り倒す。あなたがたの死骸を、あなたがたの偶像の死骸[b]の上に置く。わたしの魂はあなたがたを忌み嫌う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「太陽柱」とも訳せる。ヘブライ語は禁じられた礼拝に用いられた祭儀物を指すが、その正確な形状や用途については見解が分かれている。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、人々についても偶像についても同じ「死骸」という語を繰り返し、偶像が命のないものであり、辱めを受けることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: 滅ぼし
  rationale: ヒフィル形が表す徹底した破壊を、明瞭で格調ある現代日本語で表した。
- source_word: בָּמֹתֵיכֶם
  choice: あなたがたの高き所
  rationale: 偶像礼拝のための高所聖所を指す定着した表現であり、地形と祭儀施設の両面を保つ。
- source_word: הִכְרַתִּי
  choice: 切り倒す
  rationale: 語根כרתの具体的な「切る」像を保ち、柱状の祭儀物である可能性にも適合する。
- source_word: חַמָּנֵיכֶם
  choice: 香の祭壇
  rationale: 祭儀用の設備として理解しやすい訳を本文に置き、太陽崇拝に関係する柱という可能性は脚注に残した。
- source_word: פִּגְרֵיכֶם
  choice: あなたがたの死骸
  rationale: 人間にも物にも用い得る「死骸」によって、直後の同語反復と厳しい侮辱的響きを保った。
- source_word: פִּגְרֵי גִּלּוּלֵיכֶם
  choice: あなたがたの偶像の死骸
  rationale: 同じפֶּגֶרの反復を訳文にも反映し、偶像が命のないものにすぎないことを際立たせた。גִּלּוּלִיםの軽蔑的含意は文脈と「死骸」によって伝える。
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: わたしの魂は、あなたがたを忌み嫌う
  rationale: 「わたしの魂」という擬人的で強烈な原文表現を省略せず、געלの深い嫌悪を「忌み嫌う」で示した。
theological_decisions:
- issue: 神の激しい嫌悪を表す擬人的表現
  choice: わたしの魂は、あなたがたを忌み嫌う
  alternative: わたしは、あなたがたを忌み嫌う
  rationale: נַפְשִׁיを単に一人称へ平板化せず、神の契約的拒絶を強く表す原文の神学的緊張と修辞を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、裁きの宣告にふさわしい厳粛で峻烈な調子を保った。「高き所」は聖書的な祭儀用語として残し、「死骸」の反復と「わたしの魂」を意図的に保持した。
