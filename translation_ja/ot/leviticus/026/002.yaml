  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ja
  text: あなたがたは、わたしの安息日を守り、わたしの聖所を畏れ敬いなさい[a]。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの聖所を恐れなさい」または「わたしの聖所に畏敬の念を抱きなさい」。ヘブライ語の動詞は、文脈により恐れ、畏敬、深い敬意を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: わたしの安息日
  rationale: 複数形に一人称単数接尾辞が付いた形。日本語では「安息日」自体が反復される聖日を自然に表せるため、硬い「安息日々」ではなく「わたしの安息日」とした。週ごとの安息日に限らず、神に属する安息の定め全体を指し得る幅を保つ。
- source_word: תִּשְׁמֹרוּ
  choice: 守り
  rationale: שׁמר は命令や聖なる時を注意深く遵守することを表す。「守る」は服従と遵守の両面を簡潔に伝える。
- source_word: וּמִקְדָּשִׁי
  choice: わたしの聖所を
  rationale: מִקְדָּשׁ は聖別された場所、神の聖所を指す。「聖所」は祭儀的文脈に適した定着した訳語であり、この箇所では幕屋を含意し得る。
- source_word: תִּירָאוּ
  choice: 畏れ敬わなければならない
  rationale: ירא は恐れ、畏敬、敬虔な尊重を表し得る。聖所に向けられる態度として「畏れ敬う」は、単なる恐怖に狭めず、神聖さに対する真剣な畏敬を伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、神の固有名として日本語で一般的な音写「ヤハウェ」を用いた。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 命令の根拠となる話者の自己宣言を明確に保つ。原文の簡潔で荘重な契約定型句に対応する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を明記しているため、称号「主」で代替せず音写した。「エホバ」より、現代の学術的再構音を反映する「ヤハウェ」を採用した。
- issue: 聖所に対する ירא の意味
  choice: 畏れ敬う
  alternative: 恐れる／畏敬する
  rationale: 語の持つ恐れと畏敬の幅を残しつつ、聖所そのものへの恐怖ではなく、そこに示される神の聖さへの厳粛な尊重を自然な現代日本語で表した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、律法の命令としての荘重さを保った。「あなたがた」と義務表現「なければならない」により複数への命令を明示した。神名は「ヤハウェ」、一人称は厳粛で自然な「わたし」とした。
