  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: ja
  text: あなたがたは諸国民の間で滅び、敵の地があなたがたを食い尽くす。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: あなたがたは……滅び
  rationale: Qal形の「失われる、滅びる」を、契約の呪いがもたらす破滅として自然に表す。「滅ぼされる」ほど外的な加害を明示しない。
- source_word: בַּגּוֹיִם
  choice: 諸国民の間で
  rationale: גּוֹיִםを後代の宗教用語に狭めず、「諸国民」と訳し、離散・捕囚の場を示すבְּを「間で」とした。
- source_word: וְאָכְלָה
  choice: 食い尽くす
  rationale: אכלの字義である「食べる」を生かしつつ、土地を主語とする激しい比喩を現代日本語で自然に保持する。単なる「滅ぼす」への説明的な言い換えを避けた。
- source_word: אֶתְכֶם
  choice: あなたがたを
  rationale: 目的語標識に二人称男性複数接尾辞が付いた形を、自然な複数呼称で表した。
- source_word: אֶרֶץ
  choice: 地
  rationale: ここでは敵の支配する土地・国土を指す。「敵の地」は簡潔で、直後の擬人化された動作ともよく結び付く。
- source_word: אֹיְבֵיכֶם
  choice: 敵の
  rationale: 二人称複数接尾辞を持つ構文を日本語では簡潔に「敵の地」とした。文脈上、聞き手に敵対する者たちであることは明白である。
theological_decisions:
- issue: 「敵の地があなたがたを食べる」という比喩の扱い
  choice: 土地が人々を「食い尽くす」という契約の呪いの比喩をそのまま保持した。
  alternative: 「敵の地で滅ぼされる」など、意味を説明して比喩を解消する。
  rationale: 原文は土地を主語にしてאכל「食べる」を用いる。比喩の峻烈さと、捕囚の地で消耗・消滅するという含みを一義的に限定しないため、擬人化を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「諸国民」は聖書文脈に適しつつ一般読者にも理解できる語。「食い尽くす」により原文の具体的で厳しい比喩を保った。
