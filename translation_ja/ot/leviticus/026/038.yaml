  source_fidelity: ヘブライ語は「あなたがたは諸国民の間で滅び、あなたがたの敵の地があなたがたを食らう／食い尽くす」と読む。本文は主語・目的語、複数の聞き手、場所句、および土地を主語とするアカルの強い比喩を適切に再現している。「敵の地」は日本語では敵対者たちの土地を自然に表す。
