  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: ja
  text: あなたがたは自分の息子たちの肉を食べ、自分の娘たちの肉を食べる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: あなたがたは……食べ
  rationale: אכלのカル完了形二人称男性複数に接続詞が付いた形。契約の呪いがもたらす事態を予告する文脈を、日本語では非過去形で自然に表し、後半へ続く並列構造を保った。
- source_word: בְּשַׂר
  choice: 肉
  rationale: בָּשָׂרの直接的な意味を採用した。「肉」は日本語で身体の肉を指すことができ、この箇所の凄惨さを婉曲化しない。
- source_word: בְּנֵיכֶם
  choice: 自分の息子たちの
  rationale: 男性複数形「息子たち」を具体的に訳し、後続する「娘たち」との対を保持した。「自分の」は主語との所属関係を明瞭にする。
- source_word: וּבְשַׂר
  choice: 自分の……肉を
  rationale: 原文で「肉」が反復されるため、日本語でも省略せず、並行表現と厳しい響きを保った。接続詞は連用形「食べ」で自然に表現した。
- source_word: בְּנֹתֵיכֶם
  choice: 自分の娘たちの
  rationale: 原文どおり「娘たち」と訳し、「息子たち」との明示的な男女の対を保持した。
- source_word: תֹּאכֵלוּ
  choice: 食べる
  rationale: אכלのカル未完了形二人称男性複数。原文の動詞反復を日本語でも保ち、警告の強調と並行構造を再現した。
theological_decisions:
- issue: 契約の呪いとして語られる人肉食の表現
  choice: 「自分の息子たちの肉を食べ、自分の娘たちの肉を食べる」と直接的な予告として訳す
  alternative: 婉曲的・比喩的に弱めて訳す
  rationale: 原文は契約違反の結果として起こる凄惨な事態を直接警告している。説明を加えたり表現を和らげたりせず、その深刻さと神学的緊張を保持した。
translation_notes:
  register: 明快な現代標準日本語。原文の二つの目的語と動詞の反復を維持しつつ、日本語として自然な並列文にした。「あなたがた」で複数の聞き手を明示し、「息子たち」「娘たち」により原文の対句を保った。
