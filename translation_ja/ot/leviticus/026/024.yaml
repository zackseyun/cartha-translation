source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: ja
  text: そのとき、わたしもあなたがたに敵対して歩み、わたし自身、あなたがたの罪のゆえにあなたがたを七倍[a]も打つ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「七度」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: そのとき、わたしも…歩み
  rationale: הלךの基本的な比喩表現「歩む」を保ち、接続詞は警告の進行を示す文脈に即して「そのとき」とした。
- source_word: אַף אֲנִי
  choice: わたしも
  rationale: イスラエルの態度に応じて主も行動するという相互的な強調を、自然な日本語で示す。
- source_word: עִמָּכֶם בְּקֶרִי
  choice: あなたがたに敵対して
  rationale: עִםは字義的には「共に」だが、בקריと結び付いて相手に対する反対・敵対の態度を表す。26章で反復される語の力を保った。
- source_word: וְהִכֵּיתִי
  choice: 打つ
  rationale: נכהの直接的な懲罰行為を、古風すぎない簡潔な語で表した。
- source_word: גַּם אָ֔נִי
  choice: わたし自身が
  rationale: 神ご自身が直接行うという二度目の自己強調を明示した。
- source_word: שֶׁבַע
  choice: 七倍
  rationale: 罰の強化を示す簡潔な表現とし、厳密に七回という読みも脚注で示した。
- source_word: עַל חַטֹּאתֵיכֶם
  choice: あなたがたの罪のゆえに
  rationale: עלが示す処罰の根拠・原因を、明瞭で格調ある現代日本語にした。
theological_decisions:
- issue: 契約の裁きにおけるבקריの相互的表現
  choice: 敵対して
  alternative: 逆らって／対抗して
  rationale: 感情としての敵意に限定せず、イスラエルと主との間に描かれる相互的な反対行動を表す。章内の反復語としての連続性も確保する。
- issue: שֶׁבַעによる処罰の強度
  choice: 七倍
  alternative: 七度
  rationale: 修辞的に強められた裁きを保ちつつ、単なる回数だけに限定しない。別の可能性は脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「歩む」という章内の反復的な比喩を保持した。「敵対して」はבקריの意味を自然に伝えつつ、過度な解釈を避ける。
