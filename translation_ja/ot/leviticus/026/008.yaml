id: LEV.26.8
reference: Leviticus 26:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: ja
  text: あなたがたのうち五人が百人を追い、あなたがたのうち百人が一万人を追う。あなたがたの敵は、あなたがたの前で剣に倒れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: 追い／追う
  rationale: רדףの基本的な意味である「追う、追跡する」を保ち、軍事的文脈でも自然な現代日本語とした。
- source_word: מִכֶּם
  choice: あなたがたのうち
  rationale: 前置詞מןの部分を表す用法を明確にし、「あなたがたの中から」という意味を自然に表した。
- source_word: חֲמִשָּׁה מֵאָה
  choice: 五人が百人を
  rationale: 原文の数的対比を簡潔に保持した。文脈上、百人は追われる敵の人数である。
- source_word: רְבָבָה
  choice: 一万人
  rationale: 「万、万人」を意味し得る語であり、五対百、百対一万という数的並行を明確に保つ。
- source_word: וְנָפְלוּ
  choice: 倒れる
  rationale: נפלの「倒れる、落ちる」という像を保持し、戦闘で敵が倒される意味を自然に伝える。
- source_word: אֹיְבֵיכֶם
  choice: あなたがたの敵
  rationale: 軍事的な契約の祝福という文脈に即した標準的な訳語。
- source_word: לִפְנֵיכֶם
  choice: あなたがたの前で
  rationale: 原文の空間的・勝利的表現をそのまま保つ自然な訳。
- source_word: לֶחָרֶב
  choice: 剣に
  rationale: 剣によって戦死することを表すヘブライ語の簡潔な表現に対応し、「剣に倒れる」という自然で格調ある日本語にした。
theological_decisions:
- issue: 契約の祝福としての圧倒的な軍事的勝利を、誇張か字義的約束かに限定するか
  choice: 具体的な人数と軍事的勝利の約束を、そのまま訳文に保持する。
  alternative: 一般的な励ましや比喩的な勝利へと言い換える。
  rationale: 本文は具体的な数と敵が剣に倒れる場面を述べる。翻訳段階で誇張または厳密な数量的予告のどちらかに決めず、原文の直接性と緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、反復される「あなたがたのうち」を省略せず、原文の並行構造と数の増幅を保った。終止形を現在形に見える「追う」「倒れる」としたが、文脈上は約束される将来を表す日本語として自然である。
