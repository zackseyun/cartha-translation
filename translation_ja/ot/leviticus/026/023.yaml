  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: ja
  text: これらのことによっても、あなたがたがわたしに正されず、わたしに敵対して歩むなら[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしに敵対して歩む」に当たるヘブライ語は、字義的には「わたしとともに、敵対をもって」。最後の語はこの章では神に対する反抗・敵対を表すと理解される。これを「わたしに逆らって歩む」と訳すこともでき、語源に基づいて「成り行き任せに振る舞う」と解する説もある。
    reason: עִמִּי קֶרִיという慣用的で語義に議論のある表現について、本文の有力な文脈的意味と主要な別解の可能性を示すため。
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: これらのことによって
  rationale: 前節までに述べられた災い・懲らしめを手段として指すבの用法を明確にし、文脈とのつながりを保った。
- source_word: תִוָּסְרוּ לִי
  choice: わたしの戒めを受け入れず
  rationale: יסרのニファル形は「戒められる、懲らしめを受ける」の意。日本語で単に「戒められず」とすると、神が戒めなかったという意味にも取られるため、懲らしめを受けても矯正に至らない文脈を自然に表した。לִיは神との関係を示すものとして「わたしの」に含めた。
- source_word: וַהֲלַכְתֶּם
  choice: 歩むなら
  rationale: הלךの比喩的な「行動する、生きる」を、聖書的でありながら現代日本語でも理解可能な「歩む」で表した。条件文の継続であることを「なら」によって示した。
- source_word: עִמִּי קֶרִי
  choice: わたしに敵対して
  rationale: 直訳的には「わたしとともに、敵対／反抗をもって」に近い難解な慣用句。契約関係における対抗的な態度を明瞭に表しつつ、語義の不確かさは脚注に残した。
theological_decisions:
- issue: עִמִּי קֶרִי が表す神との関係
  choice: わたしに敵対して歩む
  alternative: 敵意をもってわたしと歩む／わたしに逆らって歩む／わたしに対して成り行き任せに振る舞う
  rationale: 本文では文脈上もっとも確かな対抗・敵対の意味を採用した。ただしקֶרִיは希少で語源・ニュアンスに議論があり、「偶然・成り行き」と結びつける理解もあるため、脚注で曖昧さを明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔で重みのある調子と、次節へ続く条件節の形を保った。「戒め」は「懲らしめ」よりも矯正・教導の目的を伝えやすく、過度に刑罰的な含意を避ける。
