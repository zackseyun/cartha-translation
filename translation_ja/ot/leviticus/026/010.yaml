reference: Leviticus 26:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: ja
  text: あなたがたは、長く蓄えておいた古いものを食べ、新しいもののために古いものを運び出す。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: あなたがたは……食べ
  rationale: 契約の祝福を告げる文脈で、接続詞を伴う完了形は未来の約束を表す。日本語では節末の「運び出す」と連動させ、自然な未来の叙述とした。
- source_word: יָשָׁן
  choice: 古いもの
  rationale: 「古い」が名詞的に用いられ、以前の収穫から蓄えられた食物を指す。穀物に限定せず、原文の簡潔さを保った。
- source_word: נוֹשָׁן
  choice: 長く蓄えておいた
  rationale: 蓄えられた食物が長期間保存されていることを表す。「古びた」「古くなった」のような否定的含意を避けた。
- source_word: וְיָשָׁן
  choice: 古いもの
  rationale: ここでも「古い」が名詞的に用いられ、前半と同じ貯蔵食物を指すため、対応を明確にした。
- source_word: מִפְּנֵי
  choice: ……のために
  rationale: 新しい収穫物が入ることにより、古い蓄えを外へ出すという原因・置換の関係を自然に表す。
- source_word: חָדָשׁ
  choice: 新しいもの
  rationale: 「新しい」が名詞的に用いられ、新しく収穫された産物を指す。原文どおり対象を過度に限定しない。
- source_word: תּוֹצִיאוּ
  choice: 運び出す
  rationale: יצא のヒフィル形の基本的意味「外へ出させる、運び出す」を保った。文脈上は新しい収穫物のために貯蔵場所から出すことを表す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祝福の約束にふさわしい簡潔で落ち着いた調子とした。「古いもの」「新しいもの」という原文の名詞的形容詞を保持し、穀物や収穫物と明示して意味を狭めることは避けた。
