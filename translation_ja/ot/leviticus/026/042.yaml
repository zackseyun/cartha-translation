  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: ja
  text: そのとき、わたしは、ヤコブと結んだわたしの契約を思い起こす。さらに、イサクと結んだわたしの契約を、さらにアブラハムと結んだわたしの契約を思い起こす。そして、その地を思い起こす。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: その時、わたしは…思い起こし
  rationale: זכרは契約の文脈では単なる記憶以上に行動への含意を持つが、原文どおり「思い起こす」とした。接続詞וְは直訳すれば「そして」だが、直前の条件・回復の文脈とのつながりを自然に示すため「その時」とした。
- source_word: בְּרִיתִי
  choice: わたしの契約／…との契約
  rationale: בְּרִיתの定着した訳語である「契約」を用いた。日本語では「わたしがヤコブと結んだ契約」も可能だが、簡潔さと反復を保つため「ヤコブとの契約」とした。所有の意味は神が話者である文脈により保持される。
- source_word: וְאַף
  choice: また
  rationale: 追加と強調を表す。現代日本語として過度に硬くせず、列挙の継続を明瞭にする「また」とした。
- source_word: יַעֲקֹב / יִצְחָק / אַבְרָהָם
  choice: ヤコブ／イサク／アブラハム
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: אֶזְכֹּר
  choice: 思い起こす
  rationale: アブラハムと土地について原文が動詞を反復する修辞的強調を保ち、省略しなかった。
- source_word: וְהָאָרֶץ
  choice: そして、この地
  rationale: 契約の文脈で特定の約束の地を指すため、日本語で指示対象が明瞭になる「この地」とした。接続詞も「そして」として保持した。
theological_decisions:
- issue: 族長たちと契約の順序および強調
  choice: 原文のヤコブ、イサク、アブラハムという順序を保ち、それぞれとの契約を個別に示した。
  alternative: 年代順にアブラハム、イサク、ヤコブとする、または「アブラハム、イサク、ヤコブとの契約」と一つにまとめる。
  rationale: 原文の逆年代順と反復には修辞的意図があり得るため、慣用的な並びへ変更せず、その強調を保持した。
- issue: 神が「思い起こす」ことの意味
  choice: 「思い起こす」と訳し、行動や契約更新を明示的には補わない。
  alternative: 「思い起こして行動する」「契約を新たにする」と訳す。
  rationale: 契約文脈では行動への含意があるものの、本文自体はזכרを用いる。語義を拡張せず、神の想起と行動との関係にある神学的含みを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「覚えている」よりも、契約に基づく神の主体的な想起を表しやすい「思い起こす」を採用した。原文の反復と族長名の順序を可能な限り保持した。
