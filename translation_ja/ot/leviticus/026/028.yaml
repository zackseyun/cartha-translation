source:
  edition: WLC
  text: וְ/הָלַכְתִּ֥י עִמָּ/כֶ֖ם בַּ/חֲמַת קֶ֑רִי וְ/יִסַּרְתִּ֤י אֶתְ/כֶם֙ אַף אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: ja
  text: わたしもまた、激しい憤りをもってあなたがたに逆らって歩み、あなたがたの罪のゆえに、七倍に懲らしめる。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「敵対の憤りをもって、あなたがたと共に歩む」。伝統的には「憤りをもって、あなたがたに逆らって歩む」。
    reason: קריは意味の確定が難しい語で、「逆らうこと」「対抗」「敵対」などと解されるため。
  - marker: b
    text: 別訳「あなたがたの罪のゆえに七度懲らしめる」。
    reason: שֶׁבַעは「七倍」とも「七度」とも訳し得るため。
lexical_decisions:
- source_word: וְהָלַכְתִּי עִמָּכֶם
  choice: あなたがたに逆らって歩み
  rationale: הלךの「歩く」を保ちつつ、עםとקריが作るこの章特有の敵対的な関係性を自然な日本語で示した。
- source_word: בַּחֲמַת קֶרִי
  choice: 激しい憤りをもって……逆らって
  rationale: חֵמָהの強い怒りを「激しい憤り」で表し、意味の難しいקֶרִיは文全体にかかる「逆らって」とした。名詞的な「反抗／敵対」の直訳可能性は脚注に残した。
- source_word: וְיִסַּרְתִּי
  choice: 懲らしめを与える
  rationale: יסרが持つ処罰と矯正の両面を保つため、「罰する」に限定せず「懲らしめ」を用いた。
- source_word: אַף אֲנִי
  choice: わたしもまた……わたし自身が
  rationale: אַףの追加的意味とאֲנִיの主語強調を、日本語で重すぎない範囲でともに表した。
- source_word: שֶׁבַע
  choice: 七倍の
  rationale: 契約の呪いにおける強められた裁きを簡潔に表す。「七度」の可能性を脚注に示した。
- source_word: עַל חַטֹּאתֵיכֶם
  choice: あなたがたの罪のゆえに
  rationale: 懲らしめの根拠を示すעלの因果的用法を明確にした。
theological_decisions:
- issue: 契約の呪いにおける神の応答の性質
  choice: 神が民に「逆らって歩む」という敵対的な関係表現と、「懲らしめ」という表現の両方を保持した。
  alternative: 全体を純粋な刑罰として「罰する」と訳す、または敵対性を一般的な不興へ弱める。
  rationale: ヘブライ語はהלך＋עם＋קריによる対抗的な表現と、矯正を含み得るיסרを併置しているため、報復だけ、または穏やかな訓戒だけに意味を限定しない。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。「歩む」により章内で反復される契約的な歩みの比喩を保ち、「懲らしめ」は古風すぎず、処罰と矯正の緊張を維持する。脚注記号は該当節末に[a][b]として明示した。
