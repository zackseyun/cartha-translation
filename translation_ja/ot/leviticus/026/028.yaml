  source_fidelity: 本文は、הלךの「歩む」という比喩、עםכם＋קריの敵対的な関係、חמהの強い怒り、יסרの懲らしめ、七倍（七度）の強調、および罪を根拠とする句をおおむね適切に保持している。ただし脚注aの「反抗への」は、קריを民の反抗に対する神の憤りと解しており、原文の構文が示す「敵対／対抗の憤り」という表現を不必要に一義化している。
  naturalness: 「激しい憤りをもってあなたがたに逆らって歩み」は明瞭で、反復される「歩む」の比喩も保つ。「七倍の懲らしめを与える」も通じるが、「七倍に懲らしめる」のほうが簡潔で自然である。
  terminology: 「憤り」「逆らって歩む」「懲らしめ」は、過度に古風にせず、原文の敵対性と矯正を含みうる語感をよく伝える。脚注aはקריの語義の争いを、中立的に示すよう訂正する必要がある。
