source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: ja
  text: その時、あなたがたが敵の地にいる間、地は荒廃しているすべての日々にわたり、その安息年を取り戻す[a]。その時、地は休み、その安息年を取り戻す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その安息年を享受する」または「その安息年の埋め合わせを受ける」。ヘブライ語の動詞には、この文脈で、与えられるべきものを受けるという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: その時
  rationale: 先行する裁きの結果が実現する時を示す時間副詞として、自然で明確な表現を採用した。
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: 取り戻す
  rationale: ここでは、守られなかった安息年の休みを、荒廃中の地が受けるという補償的な意味合いがある。同じ語根の反復を同じ訳語で表した。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 全世界ではなく、文脈上イスラエルに与えられた土地を指す。簡潔で聖書本文にふさわしい「地」とした。
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: 自らの安息年
  rationale: 土地に定められた安息、特に安息年を指す文脈である。所有接尾辞を「自らの」で表し、土地の安息であることを明確にした。
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: 荒れ果てている間ずっと
  rationale: 地が荒廃した状態にある全期間を、現代日本語として自然に表した。
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: あなたがたが敵の国にいる間
  rationale: 周囲の状況と期間を示す節として訳し、地の荒廃と民の国外滞在が同時であることを明確にした。
- source_word: תִּשְׁבַּת
  choice: 休み
  rationale: 耕作が止まり、土地が安息する意味を自然に表す。「安息を守る」とする可能性もあるが、主語が土地なので「休む」が明快である。
theological_decisions:
- issue: 捕囚中の地と安息年との関係
  choice: 民の不在と土地の荒廃の期間に、地が与えられなかった安息年を取り戻すことを述べる。
  alternative: 地が安息年を「喜ぶ」、または安息年に「満足する」と読む。
  rationale: רצה には受け入れる、満足するという幅があるが、この文脈では、怠られた土地の安息が裁きの期間に埋め合わされるという意味合いが強い。感情を過度に擬人化せず、司法的・補償的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、土地を主語とする原文の擬人的表現と、前後二度の「取り戻す」という反復を保持した。「安息年」は土地に関する律法上の安息を普通の読者に伝えるための文脈的な訳語である。
