source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: ja
  text: わたしはその地に平和を与える。あなたがたは横たわり、だれもあなたがたを恐れさせない。わたしは危険な獣をその地から絶やし、剣[a]があなたがたの地を通ることもない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「剣」は、戦争や武力による侵攻を表す比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם בָּאָרֶץ
  choice: わたしはその地に平和を与える
  rationale: נתןの基本義「与える」と、שלוֹםがこの文脈で表す平安・安全を直接的に訳した。「その地」は契約の地という具体的な領域を保つ。
- source_word: וּשְׁכַבְתֶּם
  choice: あなたがたは身を横たえて休み
  rationale: שׁכבの「横たわる」という像を残しつつ、日本語で安全な休息を自然に表した。「眠る」と限定しない。
- source_word: וְאֵין מַחֲרִיד
  choice: だれにもおびやかされない
  rationale: חרדの使役的な意味、すなわち恐れさせる者がいないことを、明瞭な現代日本語で表した。
- source_word: וְהִשְׁבַּתִּי חַיָּה רָעָה מִן הָאָרֶץ
  choice: わたしは危険な獣をその地から絶やし
  rationale: שׁבתのヒフィル形は「やめさせる、絶えるようにする」。חיה רעהのרעהは道徳的な悪ではなく、人に害を及ぼす危険性を表すため「危険な獣」とした。
- source_word: וְחֶרֶב לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: 剣があなたがたの地を通ることもない
  rationale: חרבの字義的な「剣」と、עברの「通る」を保ち、武力侵攻の比喩的含意は注で示した。
theological_decisions:
- issue: 約束される平和の範囲
  choice: イスラエルの地における、恐怖、危険な動物、武力侵攻からの具体的な安全として訳す
  alternative: 内面的・霊的平安だけを指す、または政治的平和だけを指すと限定する
  rationale: 横たわって休むこと、危険な獣、剣という具体的表現から、物質的現実に根差しつつ包括的な契約の祝福が示されている。訳文では一方に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「身を横たえて休み」により原文の具体的な像と自然な日本語を両立させた。原文に存在しない箇所へ注記を置かず、「剣」にのみ注を付した。
