id: LEV.26.19
reference: Leviticus 26:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: ja
  text: わたしは、あなたがたの力の誇りを打ち砕く。そして、あなたがたの空[a]を鉄のようにし、あなたがたの土地を青銅[b]のようにする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「あなたがたの諸天」という複数形。ここでは頭上の空を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「銅」。原語は銅または青銅を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: 打ち砕く
  rationale: שׁברの「壊す、打ち砕く」という意味を、誇りをくじく強い裁きの文脈に即して自然に表した。
- source_word: גְּאוֹן עֻזְּכֶם
  choice: あなたがたの力の誇り
  rationale: גְּאוֹןの「誇り」とעֹזの「力」を保ち、ヘブライ語の属格的な結びつきを過度に解釈せずに表した。
- source_word: וְנָתַתִּי
  choice: ～のようにする
  rationale: נתןの基本義は「与える、置く」だが、この目的語と比喩表現を伴う構文では、ある状態にするという結果を自然な日本語で示す。
- source_word: שְׁמֵיכֶם
  choice: あなたがたの空
  rationale: 形は複数だが、ここでは農耕地の上にある空を指すため、現代日本語として自然な「空」とした。原文の形は脚注で示した。
- source_word: כַּבַּרְזֶל
  choice: 鉄のように
  rationale: 雨をもたらさない、硬く閉ざされた空の比喩をそのまま保持した。
- source_word: אַרְצְכֶם
  choice: あなたがたの土地
  rationale: אֶרֶץは「地、国土、土地」を意味し得るが、農業上の裁きという文脈では「土地」が明確で自然である。
- source_word: כַּנְּחֻשָׁה
  choice: 青銅のように
  rationale: נְחֻשָׁהは銅または青銅を指し得る。硬く実りを生まない土地の比喩として定着した「青銅」を本文に採用し、別訳を脚注に示した。
theological_decisions:
- issue: 契約の呪いにおける比喩の意味
  choice: 空が鉄、土地が青銅になるという比喩をそのまま訳す
  alternative: 雨が降らず、土地が実らなくなると説明的に訳す
  rationale: 文脈上は干ばつと農業的不毛を示すが、原文はそれを明示せず、硬く閉ざされた空と土地の比喩によって表しているため、その神学的・文学的緊張を保持した。
- issue: גְּאוֹן עֻזְּכֶםの評価的意味
  choice: あなたがたの力の誇り
  alternative: あなたがたの力の威光
  rationale: גְּאוֹןには「威光、卓越」と「高慢、誇り」の幅がある。反逆に対する裁きの文脈では否定的な「誇り」が適切だが、「力」との原文上の関係は崩さずに残した。
translation_notes:
  register: 神の宣告としての重みを保ちつつ、現代の一般読者に明瞭な常体を用いた。「わたし」を主語として明示し、並行する二つの裁きを簡潔に結んだ。
