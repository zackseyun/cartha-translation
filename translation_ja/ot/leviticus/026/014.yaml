  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: ja
  text: しかし、もしあなたがたがわたしの言うことに耳を傾けず[a]、これらの戒めをすべて行わないなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしに聞き従わず」または「わたしに従わず」。ヘブライ語の動詞は「聞く」を基本義とし、従順に聞く意味を含むことがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 直前の祝福の約束との対照を「しかし」で示しつつ、אִםの条件を「もし」で明確にした。
- source_word: תִשְׁמְעוּ לִי
  choice: わたしの声に聞き従う
  rationale: שׁמע לは単に音を聞くことではなく、耳を傾けて従う含みを持つ。日本語では「わたしに聞く」より自然で、聴従の意味を保つ「わたしの声に聞き従う」とした。
- source_word: וְלֹא תַעֲשׂוּ
  choice: 行わない
  rationale: עשהの基本的な「行う」を用い、先行する否定節と並列させた。
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: これらの戒めをすべて
  rationale: כָּלの包括性、מִצְוֺתの契約的・法的な語感、הָאֵלֶּהの指示性を明瞭な現代日本語で表した。
theological_decisions:
- issue: שׁמע לを聴覚的な「聞く」とするか、服従を明示する「聞き従う」とするか
  choice: わたしの声に聞き従う
  alternative: わたしの言うことを聞く／わたしに従う
  rationale: 原語には聞くことと従うことの両面がある。「従う」だけでは聴くという比喩を失い、「聞く」だけでは日本語で服従の含意が弱くなりうるため、「声に聞き従う」で両面を保った。ただし別訳を脚注に示し、原文の語義幅を明らかにした。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「あなたがた」で複数形を明示した。節は次節以降へ続く条件節なので、末尾を読点とした。
