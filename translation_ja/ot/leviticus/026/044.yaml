- from: それでもなお、彼らが敵の地にいるとき、わたしは彼らを退けず、彼らを忌み嫌って滅ぼし尽くすことも、彼らとのわたしの契約を破ることもない。わたしはヤハウェ[a]、彼らの神だからである。
  to: それでもなお、彼らが敵たちの地にいるとき、わたしは彼らを退けることも、彼らを忌み嫌うこともない。彼らを滅ぼし尽くして、彼らとのわたしの契約を破ることはない。わたしはヤハウェ[a]、彼らの神だからである。
  rationale: 原文の否定の並列（「退けない」「忌み嫌わない」）を明示し、続く不定詞句が示す完全な滅亡と契約破棄を、神が行わない帰結として自然に表した。二つの不定詞の厳密な統語関係を過度に限定せず、契約を破るほどの完全な滅亡を否定する文脈を保っている。
