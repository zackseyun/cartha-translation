  source_fidelity: 「彼らを忌み嫌って滅ぼし尽くすことも」という現行のつながりは、「忌み嫌う」こと自体が「滅ぼし尽くす」行為の手段・連続であるかのように読める。原文はまず「退けない」「忌み嫌わない」と否定し、その結果としての完全な滅亡および契約破棄を否定する。これを二文にして関係を明瞭にした。また「敵の地」は「敵たちの地」として所有関係を明示した。
  naturalness: 改訂文は、現代標準日本語として無理のない簡潔な神の宣言である。「退けることも、忌み嫌うこともない」により二つの否定動詞が明瞭になり、後半も「滅ぼし尽くして…契約を破ることはない」と自然に読める。
  terminology: 「ヤハウェ」は原文の神名 יהוה を固有名として反映しており、脚注もその説明として適切である。「契約」「退ける」「忌み嫌う」「滅ぼし尽くす」は、契約文脈およびヘブライ語の強い表現を保つ。
