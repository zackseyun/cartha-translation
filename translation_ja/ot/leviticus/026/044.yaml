id: LEV.26.44
reference: Leviticus 26:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: ja
  text: それでもなお、彼らが敵たちの地にいるとき、わたしは彼らを退けることも、彼らを忌み嫌うこともない。彼らを滅ぼし尽くして、彼らとのわたしの契約を破ることはない。わたしはヤハウェ[a]、彼らの神だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語の神名 יהוה（YHWH）を表す。伝統的に「主」と訳されることもある。
    reason: divine_name
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: それでもなお
  rationale: 強い譲歩・逆接を表す語群。直前までの裁きにもかかわらず神の約束がなお存続することを、自然な現代日本語で示す。
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: 彼らが敵の地にいるとき
  rationale: 前置詞付き不定詞の時間的意味と、連語「彼らの敵の地」を明瞭に表す。
- source_word: לֹא מְאַסְתִּים
  choice: わたしは彼らを退けず
  rationale: מָאַס の関係的・契約的な拒絶の意味を表し、「軽蔑する」と狭く解さない。
- source_word: וְלֹא גְעַלְתִּים
  choice: 彼らを忌み嫌って
  rationale: גָּעַל の強い嫌悪を保ちつつ、現代日本語として自然で荘重な表現とした。
- source_word: לְכַלֹּתָם
  choice: 滅ぼし尽くす
  rationale: כּלה の完遂・絶滅に至る含意を「尽くす」で示し、単なる損害ではなく完全な滅亡を指す文脈を保つ。
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: 彼らとのわたしの契約を破る
  rationale: 契約について用いられる הֵפֵר の、無効にする・破棄するという意味を平明に表す。
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: わたしはヤハウェ、彼らの神だからである
  rationale: כִּי の理由提示を明示し、神の契約名とイスラエルとの関係が約束の根拠であることを保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に明記された四文字神名を固有名として音写し、普通名詞的な称号に置き換えない。発音再建には一定の不確かさがあるため脚注で説明する。
- issue: 完了形 מְאַסְתִּים／גְעַלְתִּים の時制・相
  choice: 文脈上の継続的・将来的な約束として「退けず」「こともない」
  alternative: 「退けなかった」「忌み嫌わなかった」
  rationale: 形態は完了形だが、節全体は敵国に置かれる将来の状況においても変わらない神の決意を述べる。日本語では非過去形によって、その継続的・将来的効力を自然に示した。
- issue: לְכַלֹּתָם と לְהָפֵר の統語関係
  choice: 完全な滅亡と契約破棄を、神が行わない二つの帰結として並べる
  alternative: 「彼らを滅ぼし尽くすことによって、契約を破ることはない」
  rationale: 二つの ל 不定詞は目的・結果を表し得る。日本語では並列を用い、完全な滅亡と契約破棄の密接な関係を保ちながら、一方だけに限定して解釈しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣言にふさわしい荘重さを保った。「忌み嫌う」「滅ぼし尽くす」により原文の強い語調を弱めず、文末の理由節で契約的な確証を明確にした。
