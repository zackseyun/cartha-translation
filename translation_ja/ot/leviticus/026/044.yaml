  - severity: low
    issue: 「敵の地」の所有関係
    rationale: 意味はおおむね通じるが、「敵たちの地」とするほうが בְּאֶרֶץ אֹיְבֵיהֶם（彼らの敵たちの地）の関係を明瞭に表せる。
  revised_text: それでもなお、彼らが敵たちの地にいるとき、わたしは彼らを退けることも、彼らを忌み嫌うこともない。彼らを滅ぼし尽くして、彼らとのわたしの契約を破ることはない。わたしはヤハウェ[a]、彼らの神だからである。
