source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: ja
  text: わたし自身がその地を荒れ果てさせる。そして、そこに住むあなたがたの敵は、その地を見て愕然とする[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「唖然とする」「恐れおののく」とも訳せる。このヘブライ語の動詞は、荒廃した地を前にして抱く驚きや恐れを表し得る。
    reason: 敵が土地の状態を前にして示す反応という、この箇所の語義の幅を示すため。
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: 荒れ果てさせる
  rationale: שׁמםの使役形の意味と、土地を荒廃させるという作用を、自然な現代日本語で明確に表す。
- source_word: אֲנִי
  choice: わたし自身が
  rationale: 動詞にすでに主語が含まれる中で独立代名詞が置かれているため、その強調を「自身が」で表した。
- source_word: הָאָרֶץ
  choice: その地
  rationale: 文脈は契約の裁きが及ぶイスラエルの土地を指しており、全世界を意味する「地球」や普遍的な「大地」とはしない。日本語では既知の土地を示す「その地」が自然である。
- source_word: וְשָׁמְמוּ
  choice: 驚きおののく
  rationale: 単純形のשׁמםは荒廃することも、荒廃を前に愕然・戦慄する反応も表し得る。ここでは敵が主語なので、土地の荒廃を見た衝撃的反応として訳した。語義の幅は脚注に残した。
- source_word: עָלֶיהָ
  choice: その荒廃を見て
  rationale: שׁמםとともに用いられたעַלは驚愕の対象・原因を示す。日本語では、荒れ果てた土地を目の当たりにする反応として自然に表現した。
- source_word: אֹיְבֵיכֶם
  choice: あなたがたの敵
  rationale: 二人称複数の所有をそのまま明示した。
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: そこに住む
  rationale: ישׁבの分詞が表す継続的な居住を、明快な現代日本語で表した。
theological_decisions:
- issue: 契約の裁きの文脈におけるהָאָרֶץの指示対象
  choice: その地（文脈上、イスラエル／カナンの地）
  alternative: 全地、地球
  rationale: 直前直後の文脈は、イスラエルの契約の地に下る呪いを扱っている。裁きを全世界に不必要に拡張しない訳を選んだ。
- issue: וְשָׁמְמוּが表す敵の状態
  choice: 荒廃を見て驚きおののく
  alternative: 敵自身が荒れ果てる
  rationale: 主語はその地に住む敵であり、עָלֶיהָは土地をめぐる驚愕の対象・原因を示すと理解するのが文脈に適う。ただし、同じ語根が土地の荒廃と人の愕然の双方に用いられる緊張は脚注で示した。
translation_notes:
  register: 明快で dignified な現代標準日本語。「わたし自身が」で神ご自身による行為という強調を保ち、「そして」でヘブライ語の単純な接続を反映して、明示されていない目的・結果関係を加えなかった。「驚きおののく」は日常語として理解可能でありながら、裁きの宣告にふさわしい重みを持つ。
