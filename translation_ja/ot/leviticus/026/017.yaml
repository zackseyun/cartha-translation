source:
  edition: WLC
  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: ja
  text: わたしはあなたがたに顔を向けて立ち向かう[a]。あなたがたは敵の前で打ち破られ[b]、あなたがたを憎む者たちがあなたがたを支配する。追う者がいないのに[c]、あなたがたは逃げる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「わたしはわたしの顔をあなたがたに向ける」。裁きに際して断固として敵対することを表すヘブライ語の慣用表現。
    reason: cultural_note
  - marker: b
    text: 別訳「敗北し」。
    reason: lexical_alternative
  - marker: c
    text: または「追う者がいない時にも」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: わたしはあなたがたに顔を向け、敵対する
  rationale: 「顔」を用いるヘブライ語の擬人的な慣用表現を残しつつ、日本語で好意的に顔を向ける意味に誤解されないよう「敵対する」を添え、裁きにおける神の断固とした対立を明確にした。
- source_word: וְנִגַּפְתֶּם
  choice: 打ち破られ
  rationale: נגע/נגף のニファル形がここで表す戦闘上の打撃・敗北を、過度に死を断定せず、なお鮮明に表現した。
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: 敵の前で
  rationale: 空間的・軍事的な表現を簡潔に保った。
- source_word: וְרָדוּ בָכֶם
  choice: あなたがたを支配する
  rationale: רדה の「治める、支配する」という意味を直接表し、この呪いの文脈にある服従を示しながら、残虐さの程度を訳文で付加しなかった。
- source_word: שֹׂנְאֵיכֶם
  choice: あなたがたを憎む者たち
  rationale: 先行する אֹיְבֵיכֶם（敵）との語彙上の区別を保ち、分詞の意味を明示した。
- source_word: וְנַסְתֶּם
  choice: あなたがたは逃げる
  rationale: 恐怖のために逃走することを、自然で簡潔な現代日本語で表した。
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: 追う者がいないのに
  rationale: 実際には追跡者がいないにもかかわらず逃げるという逆接的な恐慌の情景を明瞭にした。ただしヘブライ語の無動詞節は「追う者がいない時に」とも取れるため、その可能性を注記した。
theological_decisions:
- issue: 裁きにおける神の擬人的表現
  choice: 「顔」を残し、「敵対する」で慣用句の意味を明示する
  alternative: 「わたしはあなたがたに敵対する」
  rationale: 神が契約の民に対して個人的かつ断固とした態度を取るという文学的・神学的力を保ちつつ、日本語での誤解を避けた。
- issue: 敵対者による統治の性質
  choice: 「支配する」
  alternative: 「圧制する」
  rationale: 本文は憎む者による服従・支配を述べるが、この句だけでは残虐な統治の具体的程度まで明示しないため、より強い解釈語を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発話として簡潔で厳粛な調子を保った。「顔」という原文の比喩は注釈を伴って保持し、「打ち破られ」「支配する」「逃げる」により軍事的な裁きの連鎖を自然に示した。
