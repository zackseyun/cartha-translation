  text: וּ/רְדַפְתֶּ֖ם אֶת אֹיְבֵי/כֶ֑ם וְ/נָפְל֥וּ לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: ja
  text: あなたがたは敵を追い、彼らはあなたがたの前で剣に倒れる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「剣へ／剣に向かって倒れる」。この表現は「剣によって倒れる」とも理解できる。
    reason: ヘブライ語の前置詞句לֶחָרֶבの語義上・統語上の幅を示すため。
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: あなたがたは…追い
  rationale: רדףの基本義である「追う、追跡する」を、軍事的文脈を保ちながら自然な現代日本語で表した。
- source_word: אֹיְבֵיכֶם
  choice: 敵
  rationale: אֹיֵבは一般的な「敵」を意味し、二人称複数の所有関係は日本語では文脈上明らかなため、「あなたがたの敵」ではなく簡潔に「敵」とした。
- source_word: וְנָפְלוּ
  choice: 彼らは…倒れる
  rationale: נפלの「倒れる」という像を保持した。戦闘文脈では死または敗北を含意し得るが、本文ではそれを明示しすぎない。
- source_word: לִפְנֵיכֶם
  choice: あなたがたの前で
  rationale: לִפְנֵיの空間的・対面的な意味を自然に表し、敵がイスラエルの前で倒れるという場面を保持した。
- source_word: לֶחָרֶב
  choice: 剣に
  rationale: 前置詞לְと「剣」の結びつきを簡潔に保持した。「剣に倒れる」は剣によって討たれることを表す日本語として理解できるが、道具・原因を明示する訳も脚注に示した。
theological_decisions: []
translation_notes:
  register: 簡潔で力強い祝福の宣言として、現代標準日本語の常体を用いた。原文の反復的な二人称複数は「あなたがた」で明示し、戦闘の比喩は過度に説明せず保持した。
