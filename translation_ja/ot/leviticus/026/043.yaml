base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: ja
  text: しかし、その地は彼らによって見捨てられ、荒れ果てて彼らがいない間に、その安息の日々を享受する。そして彼らは、自分たちの咎に対する罰を受ける[a]。まさしく、彼らがわたしの裁きを退け、彼らの魂がわたしの掟を忌み嫌ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの咎を引き受ける」、または「自分たちの咎を償う」。このヘブライ語の表現には複数の解釈が可能である。ここでは契約に基づく刑罰という文脈に沿って訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: 彼らから離れて捨て置かれ
  rationale: ニファル形の受動的意味と、民がその地からいなくなることをともに表す。
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: 自らの安息を享受する
  rationale: 土地が与えられなかった安息を得るという文脈上の意味を、安息という契約的用語を保ちながら自然な日本語で示す。
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: 彼らがいない間、荒れ果てたまま
  rationale: 土地の荒廃した状態と、民の不在との双方を明示する。
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: 自分たちの咎に対する罰を受ける
  rationale: 裁きと追放の文脈における司法的意味を前面に出す。ただしヘブライ語の句には別の理解も可能なため脚注を付す。
- source_word: יַעַן וּבְיַעַן
  choice: まさしく……からである
  rationale: 重ねられた原因表現の強調を、冗長にならない現代日本語で再現する。
- source_word: בְּמִשְׁפָּטַי
  choice: わたしの裁き
  rationale: 契約における法的な裁定・規定を表す語として訳し、「掟」と区別する。
- source_word: חֻקֹּתַי
  choice: わたしの掟
  rationale: 制定された規定を指す語として明瞭で、מִשְׁפָּטַיとの語彙上の区別も保つ。
- source_word: גָּעֲלָה נַפְשָׁם
  choice: 彼らの魂が……忌み嫌った
  rationale: 集合的な単数「彼らの魂」を保持し、内面全体からの強い嫌悪を表す。
theological_decisions:
- issue: יִרְצוּ אֶת עֲוֺנָם における עָוֹן の意味
  choice: 咎に対する罰を受ける
  alternative: 自分たちの咎を引き受ける／自分たちの咎を償う
  rationale: 契約の呪い、追放、土地の安息という司法的文脈では、咎の結果である刑罰を負う意味が有力である。一方、原語の語義的な幅は脚注で保持し、自力による功績的な贖罪を本文に読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、契約法と裁きの場面にふさわしい格調を保った。「魂」は原文の集合的単数と人間の内面全体を示す表現として残した。
