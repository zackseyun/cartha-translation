  to: しかし、その地は彼らによって見捨てられ、荒れ果てて彼らがいない間に、その安息の日々を享受する。そして彼らは、自分たちの咎に対する罰を受ける[a]。まさしく、彼らがわたしの裁きを退け、彼らの魂がわたしの掟を忌み嫌ったからである。
