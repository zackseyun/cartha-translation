source:
  edition: WLC
  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: ja
  text: あなたがたの力はむなしく費やされ[a]、あなたがたの土地はその産物を生み出さず、その地の木々も実を結ばない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたがたの力はむなしく尽きる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: 使い果たされ
  rationale: 動詞 תמם は、力が尽きる、消耗し切ることを表す。受動的な日本語表現により、労力が費やされ尽くす意味を自然に伝える。
- source_word: לָרִיק
  choice: むなしく
  rationale: 「空虚へ」「無益に」という徒労の意味を示す。現代日本語で明瞭かつ格調を保つ「むなしく」とした。
- source_word: כֹּחֲכֶם
  choice: あなたがたの力
  rationale: כח の基本義である力、活力を保ち、農作業などに注ぐ労力も含み得る表現とした。
- source_word: אַרְצְכֶם
  choice: あなたがたの土地
  rationale: ここではイスラエルの耕作地・領土を指すため、「土地」が農業的文脈に適する。
- source_word: יְבוּלָהּ
  choice: 作物
  rationale: יבול は土地の産出物、収穫を指す。「作物」は一般読者に明瞭で、農業上の産物を自然に表す。
- source_word: תִתֵּן
  choice: 実らせず／実を結ばない
  rationale: 字義は「与える」だが、土地や木が産物・実を生じる文脈では、日本語の自然な対応表現を用いた。
- source_word: וְעֵץ הָאָרֶץ
  choice: その地の木々
  rationale: עֵץ は単数形だが集合的に用いられているため、日本語では自然な複数概念の「木々」とした。
- source_word: פִּרְיוֹ
  choice: 実
  rationale: 単数接尾辞は集合名詞 עֵץ に一致する。「木々」とした日本語に合わせつつ、意味を変えず「実」と表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、契約の呪いとしての厳粛さを保った。「実らせず」と「実を結ばない」により、土地と木についてのヘブライ語の反復を自然な日本語で再現した。
