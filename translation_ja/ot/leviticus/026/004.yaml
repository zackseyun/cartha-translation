    rationale: 原文は直訳すれば『地はその産物を与える』であり、日本語では地が『産物を生み出す／産出する』と表すのが自然である。「実らせる」は通常、作物・実などを主語にするか、栽培者が目的語を実らせる使役表現として理解されやすい。
  - severity: low
