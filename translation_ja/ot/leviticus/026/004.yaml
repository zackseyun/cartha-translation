  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: ja
  text: わたしは季節にかなった雨[a]をあなたがたに与える。地はその産物を生み出し、野の木々[b]はその実を結ぶ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ふさわしい時に雨をあなたがたに与える」。
    reason: lexical_alternative
  - marker: b
    text: 「野の木々」は、ヘブライ語では集合的な意味を持つ単数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: わたしは…与える
  rationale: נתןの基本義「与える」を直接に表し、神による契約上の約束を余分な解釈なしに保つ。
- source_word: גִשְׁמֵיכֶם
  choice: 雨をあなたがたに
  rationale: 複数形は季節ごとの降雨を指すヘブライ語的表現であり、日本語では自然な単数形「雨」とした。二人称複数接尾辞は、イスラエルのために与えられる意味が明確になるよう「あなたがたに」と表した。
- source_word: בְּעִתָּם
  choice: 季節にかなった
  rationale: 雨が適切な時期にもたらされることを、農耕の文脈に即して自然な現代日本語で表す。
- source_word: וְנָתְנָה הָאָרֶץ
  choice: 地は…実らせ
  rationale: 字義的には「地は与える」だが、日本語の農耕表現として自然な「実らせ」を用い、土地が産出する意味を保った。
- source_word: יְבוּלָהּ
  choice: その産物
  rationale: 土地から得られる収穫物全般を指す語なので、作物に狭く限定しない「産物」とした。
- source_word: וְעֵץ הַשָּׂדֶה
  choice: 野の木々
  rationale: 原文は単数形だが集合的な意味を持つ。日本語では集合的意味が自然に伝わる複数表現とし、その点を脚注で示した。
- source_word: יִתֵּן פִּרְיוֹ
  choice: その実を結ぶ
  rationale: 字義的には「その実を与える」。日本語では木の結実を自然に表す「実を結ぶ」とし、具体的な豊穣の約束を保った。
theological_decisions:
- issue: 従順に伴う契約上の農業的祝福
  choice: 雨、土地の産物、木の実という具体的な神の備えとして訳す。
  alternative: 一般的で時代を超えた物質的繁栄の保証と解する、または農業的祝福を専ら霊的な比喩として訳す。
  rationale: この節はレビ記の契約祝福の文脈で、現実の降雨と農地の生産力を述べている。翻訳ではその具体性を保ち、後代の教理的適用を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ威厳ある文体。「季節にかなった雨」で適時性を自然に示し、農業的祝福の具体性を維持した。原文の接続詞וְは、日本語で不自然な反復を避けるため文脈に沿って文の連続として表した。
