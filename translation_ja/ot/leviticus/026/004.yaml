- from: わたしは季節にかなった雨をあなたがたに与える[a]。地はその産物を実らせ、野の木々はその実を結ぶ[b]。
  to: わたしは季節にかなった雨[a]をあなたがたに与える。地はその産物を生み出し、野の木々[b]はその実を結ぶ。
  rationale: 土地の産出を表す箇所を「生み出し」として、原文の『与える』の比喩的用法と日本語の農耕表現の双方に適合させた。雨・土地・木という三つの具体的な祝福、および原文の集合的な『野の木』の意味は保持した。脚注の内容は維持し、各説明対象の直後へ記号を移した。
