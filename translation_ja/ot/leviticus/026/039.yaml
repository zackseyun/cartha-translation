source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: ja
  text: あなたがたのうち残された者たちは、敵の国々で、自分たちの咎のために衰え果てる[a]。また、彼らとともにある父祖たちの咎のために、彼らは衰え果てる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「朽ち果てる」または「やせ衰える」とも訳せる。ヘブライ語の動詞は、裁きのもとで消耗し、朽ちていくことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「彼らとともに」は、父祖たちの咎が彼らに伴っているという意味にも、父祖から続く咎とともに彼らが衰え果てるという意味にも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: あなたがたのうち残された者たち
  rationale: 裁きの後になお残っている者を指す分詞と、民の中からの残りであることを示す בכם の両方を、自然な日本語で表した。
- source_word: יִמַּקּוּ
  choice: 衰え果てる
  rationale: מקק のニファル形が表す、裁きのもとで消耗し、朽ちていく意味を、文脈に即した明瞭で厳粛な表現にした。二つの用例を同じ語で訳した。
- source_word: בַּעֲוֺנָם
  choice: 自分たちの咎のために
  rationale: עָוֹן が持つ罪・咎・責任の意味を「咎」で表し、前置詞 ב はここでは原因を示すものとして訳した。
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: 敵の国々で
  rationale: 複数形 אַרְצוֹת を「国々」として保持し、異国への離散という文脈を明確にした。
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: 父祖たちの咎
  rationale: 複数の「咎」を集合的に自然な日本語で表し、אָבוֹת は世代をさかのぼる父たちを示す「父祖たち」とした。
- source_word: אִתָּם
  choice: 彼らとともにある
  rationale: 簡潔で曖昧なヘブライ語の「彼らとともに」を保ちつつ、日本語の文としてつながる形にした。別の統語的理解が可能であることは脚注に示した。
theological_decisions:
- issue: 個人の咎と父祖の咎に関する世代間の裁き
  choice: 残された者たちが自分たちの咎のためだけでなく、彼らとともにある父祖たちの咎のためにも衰えるという本文の緊張を保持した。
  alternative: 父祖の罪の結果だけを受けると限定する、または父祖と同じ罪を犯した場合だけを意味すると解釈する。
  rationale: 原文は「彼らの咎」と「彼らの父祖たちの咎」の双方を明記している。翻訳では、個人の責任と世代を越える裁きとの関係を説明的に解消せず、本文のまま残すべきである。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、契約の裁きを告げる箇所にふさわしい厳粛さを保った。「罪」よりも、行為と責任の両面を含み得る「咎」を用いた。
