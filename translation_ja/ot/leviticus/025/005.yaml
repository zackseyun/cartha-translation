source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: ja
  text: あなたの収穫から自然に生えた作物[a]を刈り取ってはならない。また、あなたが手入れをせずにおいたぶどうの実[b]を摘み集めてはならない。その年は、土地が完全に休む年[c]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自然に生えた作物」は、「ひとりでに生えたもの」または「こぼれ種から生えた作物」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「あなたの分けておいたぶどうの実」。ここでは、安息年に剪定や手入れをせず、そのままにされたぶどうの木を指す。
    reason: lexical_alternative
  - marker: c
    text: 「安息年」または「厳かな休みの年」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: あなたの刈り入れの後に自然に生えた作物
  rationale: סְפִיחַは、以前の収穫からこぼれた種などによって自然に生じた作物を指す。意図的に種をまいた作物ではないことが明確に伝わる表現とした。קְצִירְךָとの連結関係は「あなたの刈り入れの後に」と自然な日本語で表した。
- source_word: תִקְצֹר
  choice: 刈り取って
  rationale: 穀物や畑の作物を刈る農作業を具体的に表す動詞なので、「収穫する」よりも原語の動作に即した「刈り取る」とした。
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: 手入れをせずにおいたぶどうの木の実
  rationale: עִנְּבֵיは「ぶどうの実」、נְזִירֶךָはこの農耕文脈では安息年に手入れや剪定をせず、そのままにされたぶどうの木を指す。「分けられた」という語源的な意味を直訳すると不明瞭になるため、文脈上の実際的な意味を明示した。
- source_word: תִבְצֹר
  choice: 摘み集めて
  rationale: ぶどうを摘み取って収穫することを表す動詞であり、日本語では「摘み集める」が作業内容を自然かつ具体的に伝える。
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: 全き安息の年
  rationale: שַׁבָּתוֹןが表す徹底した休止と安息の強調を、「全き安息」によって保った。「安息年」という暦上の名称だけにせず、この年の性質を伝える表現とした。
- source_word: לָאָרֶץ
  choice: 土地にとって
  rationale: レビ記25章では耕作される土地が休むことを指すため、「地」や「世界」ではなく「土地」とした。לְの関係は「土地にとって」と表し、その年が土地の安息のためであることを示した。
theological_decisions:
- issue: 安息年の用語を、後代の教派的・典礼的含意を加えずに表すこと
  choice: その年は、土地にとって全き安息の年となる
  alternative: その年は、土地のための安息年となる／その年は、土地にとって厳かな休みの年となる
  rationale: 本文は土地に与えられる徹底した安息を規定している。「全き安息の年」はשַׁבָּתוֹןの強意を保ちつつ、単なる制度名に狭めず、また本文を越えた教理的説明も加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、律法本文にふさわしい簡潔で格調ある禁止表現「〜てはならない」で統一した。農耕語彙は一般読者が具体的な作業を理解できる表現としつつ、「全き安息」によって原文の荘重さと安息の強調を保った。
