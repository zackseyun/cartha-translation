  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: ja
  text: あなたは自分のために、七年ごとの安息の期間を七回[a]、すなわち七年を七回、数えなければならない。その七つの年の安息の期間の日数は、四十九年となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「年の安息を七つ」。ここでの「安息」は、七年を一周期とするまとまりを指す。
    reason: 原文の「安息」という表現を示しつつ、この箇所で指す七年周期を明確にするため。
lexical_decisions:
- source_word: וְסָפַרְתָּ לְךָ
  choice: あなたは自分のために…数えなければならない
  rationale: ספרの数え上げる意味と、明示された二人称与格לְךָを保ちつつ、法規定として自然な現代日本語にした。
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: 七年ごとの安息の期間を七回
  rationale: 直訳的な「年の安息七つ」では意味が取りにくいため、安息年に結びつく七年周期を明示した。「週」と断定せず、שׁבתの安息という語感も残した。
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: すなわち七年を七回
  rationale: 原文の反復的な説明を保持し、「すなわち」で先行句との同格関係を明瞭にした。
- source_word: יְמֵי שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: 七年ごとの安息の期間七回の日数
  rationale: יְמֵיを「日数」として明示し、期間全体を表すヘブライ語的表現を日本語で理解可能にした。
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: 四十九年
  rationale: 数値を現代日本語の通常の順序で表した。
