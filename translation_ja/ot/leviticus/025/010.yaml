id: LEV.25.10
reference: Leviticus 25:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: ja
  text: あなたがたは五十年目を聖別し、その地に住むすべての人に解放[a]を宣言しなければならない。その年はあなたがたにとってヨベルの年[b]となる。あなたがたはそれぞれ自分の所有地[c]に帰り、それぞれ自分の氏族[d]のもとに帰らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自由」または「釈放」とも訳せる。ヘブライ語では、ヨベルの年に正式に告げられる解放を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ヨベル」は五十年目の特別な制度を指す語。この語は、その年を告げる角笛と関連づけられることがある。
    reason: cultural_note
  - marker: c
    text: 「自分の保有地」とも訳せる。ここでは特に、代々受け継がれる土地の保有分を指す。
    reason: lexical_alternative
  - marker: d
    text: 「家族」とも訳せる。ここでは家族を含む、より広い親族集団を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: 聖別し
  rationale: ピエル形の「聖なるものとして取り分ける、聖別する」という祭儀的な意味を保ちつつ、現代日本語の聖書文体として明瞭である。
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: 第五十年
  rationale: ヘブライ語の数詞構文を自然な日本語の序数表現にした。
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: 解放を宣言し
  rationale: דרורはヨベルの年に公に告げられる身分的・社会的解放を指す。「自由」だけよりも正式な解放措置という文脈を伝えやすい。
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: その地のすべての住民に
  rationale: בの場所的意味と、接尾辞を伴う「その住民すべて」を簡潔に表した。範囲を示す「国中」を補わずとも「すべて」が全域性を伝える。
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: その年は、あなたがたにとってヨベルの年となる
  rationale: この文脈のיוֹבֵלは角笛そのものではなく、第五十年の制度を表す専門語である。「ヨベルの年」は日本語で対象を明確にする。
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: 帰り……帰らなければならない
  rationale: 同じ語根שובの反復を日本語でも「帰る」で保ち、回復・復帰という主題を示した。
- source_word: אִישׁ ... וְאִישׁ
  choice: それぞれ……それぞれ
  rationale: 男性単数形だが法文では配分的に各人を指す。二人称複数の呼びかけを受けた自然な日本語とし、反復も保った。
- source_word: אֶל אֲחֻזָּתוֹ
  choice: 自分の所有地に
  rationale: אֲחֻזָּהは、とりわけ代々受け継ぐ土地の保有分を指す。「所有地」は簡潔で、土地に帰還する意味も明確である。
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: 自分の氏族のもとに
  rationale: מִשְׁפָּחָהは家族または氏族を表す。土地保有と社会的復帰の文脈では、核家族より広い親族集団を示す「氏族」が適切である。
theological_decisions:
- issue: 配分的なאִישׁの性別表現
  choice: あなたがたはそれぞれ
  alternative: 各人は／男はそれぞれ
  rationale: 原語は男性単数形だが、ここでは二人称複数の共同体に対して配分的に用いられている。日本語では「それぞれ」がこの統語的働きを正確かつ自然に伝え、適用範囲を不必要に狭めない。
- issue: יוֹבֵלの指示対象
  choice: ヨベルの年
  alternative: 雄羊の角笛／解放の年
  rationale: レビ記25章では第五十年の制度を指す専門語として機能する。語源・関連物である角笛に限定せず、制度名を音写して曖昧さを注で説明する。
- issue: מִשְׁפָּחָהが示す社会単位
  choice: 氏族
  alternative: 家族
  rationale: 近代的な核家族に限定せず、土地と帰属に関わる広い親族集団を表すため「氏族」とした。「家族」の可能性は注記する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の命令としての荘重さを保つため「なければならない」とした。二つの帰還命令の並行と「帰る」の反復を維持した。専門語「ヨベル」は本文に残し、一般読者向けの説明を脚注に置いた。
