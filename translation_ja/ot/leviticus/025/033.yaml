  naturalness: 「その所有の町」「売られた家、すなわち」は現代標準日本語としてぎこちない。条件節を簡潔にし、「その保有地の町で売られた家」とすることで、法令調を保ちながら明瞭になる。脚注bのアンカーは説明対象の語句「イスラエルの子ら」に置く。
  terminology: 「レビ人」「買い戻す」「ヨベルの年」「イスラエルの子ら」は適切である。אֲחֻזָּהは家々についても用いられる法的な保有・所有の語なので、「保有する財産」として、土地だけに限定しない表現に改める。
