id: LEV.25.33
reference: Leviticus 25:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: ja
  text: レビ人が買い戻す場合には、その保有地の町で売られた家は、ヨベルの年に返還される[a]。レビ人の町々にある家は、イスラエルの子ら[b]の間で彼らが保有する財産だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「出る」。売られた家が買い手の所有から離れ、ヨベルに返還されることをいう。冒頭の句は「レビ人が買い戻す場合」とも「レビ人から買い戻す者」とも取り得る難しい構文であり、本文では前者の理解を採った。
    reason: וְיָצָאの字義と、וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם の係り方に関する構文上の曖昧さを示すため。
  - marker: b
    text: 「イスラエルの子ら」は、イスラエルの民を指す原文の定型的な呼び名。
    reason: 原文の定型表現を保った訳語を説明するため。
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: レビ人の一人がそれを買い戻した場合でも
  rationale: מןを部分を示す用法と取り、「レビ人のうちの一人」と解した。גאלは土地・家屋に関する法的文脈なので、現代日本語で意味の明瞭な「買い戻す」とした。後続のヨベルによる復帰との対比を示すため、条件節には「でも」を用いた。
- source_word: וְיָצָא מִמְכַּר בַּיִת וְעִיר אֲחֻזָּתוֹ
  choice: 売られた家、すなわちその所有の町にある家は、…元の所有者に戻る
  rationale: 圧縮された難しい構文。ממכרを抽象的な「売買」より「売られたもの」と捉え、家がヨベルに買い手の手を離れる法的効果を自然に表した。「すなわち」は家と所有の町との関係を明示する補足である。
- source_word: בַּיֹּבֵל
  choice: ヨベルの年には
  rationale: ヨベルという制度上の年を指すため、日本語で理解しやすい「ヨベルの年」とした。
- source_word: בָּתֵּי עָרֵי הַלְוִיִּם
  choice: レビ人の町々にある家
  rationale: 連語を自然な日本語にし、レビ人に割り当てられた町々の中の家という意味を表した。
- source_word: הִוא אֲחֻזָּתָם
  choice: 彼らに与えられた所有地
  rationale: אֲחֻזָּהは恒久的・世襲的な保有財産を指す法的語。「所有地」を核とし、イスラエル内で割り当てられた保有分であることを「与えられた」で自然に示した。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの間で
  rationale: 契約共同体を指す定型表現の形を保ち、「イスラエルの子ら」と訳した。
theological_decisions:
- issue: מן הלוים の係り方
  choice: レビ人の一人が買い戻す
  alternative: レビ人から買い戻す
  rationale: מןを部分用法とする読みが文脈に適合する。ただしヘブライ語の構文は難しく、別の係り方も提案されるため、脚注で構文上の不確かさを示した。
- issue: ヨベルにおける家屋の復帰
  choice: 元の所有者に戻る
  alternative: 買い手の所有から出る
  rationale: יצאの字義は「出る」だが、ここでは売却物が買い手の手を離れて本来の保有関係へ復帰する法的結果を述べる。日本語本文では効果を明瞭にし、字義を脚注に残した。
- issue: בני ישראל の表現
  choice: イスラエルの子ら
  alternative: イスラエルの民
  rationale: 原文の契約共同体を指す定型的な男性複数表現を保持した。これは構成員を男性だけに限定するという解釈ではなく、共同体の伝統的呼称である。
translation_notes:
  register: 現代標準日本語による、明瞭で dignified な法令調の訳。「贖う」ではなく「買い戻す」を用いて財産法上の意味を分かりやすくしつつ、「ヨベル」「所有地」など本文の制度的・法的語彙は保持した。
