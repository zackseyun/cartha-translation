source:
  edition: WLC
  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: ja
  text: ヨベルの年の後の年数に応じて、あなたは同胞から買わなければならない。また、収穫の得られる年数[a]に応じて、同胞はあなたに売らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「産物（収穫）の年数」。売買価格は、次のヨベルの年までに作物を収穫できる残りの年数を基準とする。土地が恒久的に譲渡されるという意味ではない。
    reason: 語句の直訳と、この章の文脈における取引基準を明確にするため。
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל
  choice: ヨベルの年の後の年数に応じて
  rationale: בְּמִסְפַּרを評価の基準を示す「年数に応じて」とし、אַחַר הַיּוֹבֵלの時間関係をそのまま保った。
- source_word: תִּקְנֶה
  choice: 買わなければならない
  rationale: 律法上の指示として用いられた未完了形の規範的な力を、現代日本語で自然に表した。
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: 同胞から
  rationale: עָמִיתはこの法的文脈で共同体の仲間を指すため、「隣人」より取引当事者として明確な「同胞」とした。
- source_word: בְּמִסְפַּר שְׁנֵי תְבוּאֹת
  choice: 収穫の得られる年数に応じて
  rationale: 直訳的な「収穫の年々」が意味する、作物を得られる年の数を自然な日本語で示した。土地そのものの恒久的価値ではなく、収穫可能な期間が基準であることも伝わる。
- source_word: יִמְכָּר לָךְ
  choice: 同胞はあなたに売らなければならない
  rationale: 三人称男性単数の主語を直前のעֲמִיתֶךָと解し、買い手への指示と対応する規範表現にした。
theological_decisions:
- issue: 土地取引の性質
  choice: 本文では「買う」「売る」を保ち、恒久的な所有権移転とは言い換えない
  alternative: 次のヨベルまでの収穫権を買う／売る
  rationale: 文脈上は残る収穫年数を基準とする取引だが、原文の動詞は通常の「買う」「売る」であるため、解釈を本文に織り込まず脚注で補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二つの法的指示の対応関係を「買わなければならない／売らなければならない」で示し、専門的な説明は脚注に限定した。
