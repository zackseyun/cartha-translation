id: LEV.25.36
reference: Leviticus 25:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: ja
  text: 彼から利息も利得も取ってはならない[a]。あなたの神を畏れ、あなたの兄弟[b]があなたと共に生きられるようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「利得」は「増加分」または「利益」とも訳せる。ヘブライ語では、困窮した借り手から取り立てる利息や上乗せ分を表す、意味の近い二つの語が並べられている。
    reason: lexical_alternative
  - marker: b
    text: ここで「兄弟」とは、必ずしも実の兄弟ではなく、契約共同体に属する同胞を指す。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: 取ってはならない
  rationale: אַל＋未完了形による直接的な禁止を、明瞭で品位ある現代日本語で表した。
- source_word: מֵאִתּוֹ
  choice: 彼から
  rationale: 困窮した同胞を、不当な利益を取り立てる相手として示す前置詞句を簡潔に保持した。
- source_word: נֶשֶׁךְ
  choice: 利息
  rationale: 貸付金に課される利息を指す。現代日本語で意味が明確であり、「高利」のように過度であるとの限定を加えない。
- source_word: וְתַרְבִּית
  choice: 利得
  rationale: נֶשֶׁךְと並び、困窮した借り手から得る増加分・利益を指す。意味の重なりを保ちつつ、別語であることも示した。
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: あなたの神を畏れ
  rationale: 倫理的な命令の根拠となる神への畏敬を表す。「畏れる」により、単なる恐怖ではなく敬虔な畏れを自然に伝えた。接続のוְは日本語では連用形で保持した。
- source_word: וְחֵי
  choice: 生きられるようにしなさい
  rationale: 文脈上の指示的・結果的な力を、日本語として自然な許容・配慮の命令で表した。単に生存するだけでなく、共同体の中で生活を続ける含みを損なわない。
- source_word: אָחִיךָ
  choice: あなたの兄弟
  rationale: 字義的な家族語を保持し、契約共同体の仲間という広い用法は脚注で説明した。
- source_word: עִמָּךְ
  choice: あなたと共に
  rationale: 受け手と並んで共同体内で生活し続けることを、原文に沿って直接表した。
theological_decisions:
- issue: 契約法におけるאָחִיךָの社会的・倫理的範囲
  choice: あなたの兄弟
  alternative: あなたの同胞／あなたの仲間
  rationale: 原文の家族的・契約的な響きを本文に残し、生物学上の兄弟に限られないことを脚注で明示した。
- issue: וְחֵיの命令的・結果的な含み
  choice: 生きられるようにしなさい
  alternative: 生きなければならない／生きることができるように
  rationale: 困窮者の生活を共同体内で成り立たせるよう求める文脈上の力を示しつつ、目的と結果のどちらか一方に過度に限定しない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「畏れ」は神への敬虔な恐れを示す聖書文体として自然であり、「利得」は二つの経済用語の区別を保つ。家族語「兄弟」は原文に忠実に残し、共同体的意味を脚注で補った。
