  timestamp: '2026-07-19T10:25:43Z'
review_pass:
  verdict: revise
  source_fidelity: 前半の「受け継がせる」は、ヘブライ語の後代の息子たちへの世襲的移転という趣旨をおおむね捉えている。しかし続く「彼らを永久の所有物として相続し」は、命令対象である「あなたがた」が彼らを相続するかのように読め、息子たちが相続するという לִבְנֵיכֶם…לָרֶשֶׁת の関係を不明瞭にする。後半の「互いに」は אִישׁ בְּאָחִיו（各人が自分の兄弟に）の分配的表現をやや一般化するため、明示するのがよい。
  naturalness: 現行文は概ね明瞭だが、「相続財産として受け継がせる」と「所有物として相続し」が重なり、しかも後者の主語関係が不自然である。修正文は法文として自然な簡潔さを保つ。
  terminology: 「息子たち」「兄弟」「イスラエルの子ら」は原文の男性形親族語を適切に保持している。「所有物」および「労働を課す」も、世襲的所有と強制的労働という文脈を婉曲化しない。
  issues:
  - severity: medium
    issue: 「彼らを永久の所有物として相続し」の主語・受益者が曖昧である。
    rationale: 原文は、彼らを後に続く息子たちへ、世襲する所有として伝えることを述べる。日本語の現行表現は、聞き手自身が彼らを相続する意味に傾く。
  - severity: low
    issue: 「互いに」は אִישׁ בְּאָחִיו の個別的・分配的な関係を弱める。
    rationale: 「だれも自分の兄弟を」とすれば、各イスラエル人が同胞に対して過酷に支配してはならないという構文を明確にできる。
  revised_text: あなたがたは彼らを、後に続くあなたがたの息子たちに、永久に受け継ぐ所有物として相続させることができる[a]。彼らに労働を課すことができる。しかし、あなたがたの兄弟、すなわちイスラエルの子らについては[b]、だれも自分の兄弟を過酷に支配してはならない。
