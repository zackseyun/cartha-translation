id: LEV.25.46
reference: Leviticus 25:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: ja
  text: あなたがたは彼らを、後に続くあなたがたの息子たちに、永久に受け継ぐ所有物として相続させることができる[a]。彼らに労働を課すことができる。しかし、あなたがたの兄弟、すなわちイスラエルの子らについては[b]、だれも自分の兄弟を過酷に支配してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らを、後に続くあなたがたの息子たちに、世襲の所有物として譲り渡すことができる」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟」と「イスラエルの子ら」は、ヘブライ語の男性形の親族表現を直接反映している。この律法は、同じ契約共同体に属するイスラエル人を兄弟として扱っている。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: 相続財産として受け継がせる
  rationale: נחל のヒトパエル形がここで表す、世襲財産として後代に継承させるという法的な意味を、自然な現代日本語で示す。
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: あなたがたの後の息子たちに
  rationale: 原文の בנים は明示的に「息子たち」であり、相続法の男性形の表現を中性化せず保持する。
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: 永久の所有物として相続し
  rationale: רשׁ と אֲחֻזָּה が併せ持つ相続と所有の両面を明示する。前半の継承表現と意味は重なるが、原文の法的反復を残す。
- source_word: לְעֹלָם
  choice: 永久の
  rationale: この法的文脈における、期限を設けない恒久的な身分・所有状態を示し、形而上学的な永遠を過度に含意しない。
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: 彼らに労働を課すことができる
  rationale: 人に強制される労働という文脈上の実態を、「仕えさせる」などで和らげずに表す。
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: しかし、あなたがたの兄弟であるイスラエルの子らには
  rationale: 前節との対比、および同胞を契約共同体の兄弟と位置づける同格的表現を保持する。
- source_word: אִישׁ בְּאָחִיו
  choice: 互いに
  rationale: 字義的には「人がその兄弟に」であり、共同体の各人が同胞に対してしてはならないという分配的な意味を、簡潔で自然な日本語にする。
- source_word: לֹא תִרְדֶּה בוֹ
  choice: 支配をしてはならない
  rationale: רדה の支配・統御するという意味を直接示し、禁止命令として自然に訳す。
- source_word: בְּפָרֶךְ
  choice: 過酷な
  rationale: 強制労働の文脈での苛烈さを簡潔に表し、「無慈悲に」などの解釈的な感情色を加えない。
theological_decisions:
- issue: イスラエルの社会法における男性形の親族語
  choice: 「兄弟」「イスラエルの子ら」「息子たち」を保持する。
  alternative: 「同胞」「イスラエル人」「子どもたち」と中性化する。
  rationale: ヘブライ語は相続と契約上の連帯を明示的な男性形の親族語で表しているため、その形式と法的背景を保つ。ただし「互いに」によって禁止の分配的な働きを自然に示す。
- issue: 奴隷制・所有・強制労働に関する表現の直接性
  choice: 「所有物」「労働を課す」と訳し、法文の社会的・道徳的な重みを和らげない。
  alternative: 「僕」「奉仕させる」など、所有や強制性を弱める表現を用いる。
  rationale: 原文は人を世襲の所有物として相続し、その労働を用いることを明言している。訳文でその緊張を解消したり美化したりしない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、律法文としての簡潔さと厳粛さを保った。所有と強制労働の語を婉曲化せず、原文の法的反復と倫理的緊張を残した。
