revisions:
- from: あなたがたは彼らを、あなたがたの後の息子たちに相続財産として受け継がせることができる[a]。彼らを永久の所有物として相続し、彼らに労働を課すことができる。しかし、あなたがたの兄弟であるイスラエルの子らには[b]、互いに過酷な支配をしてはならない。
  to: あなたがたは彼らを、後に続くあなたがたの息子たちに、永久に受け継ぐ所有物として相続させることができる[a]。彼らに労働を課すことができる。しかし、あなたがたの兄弟、すなわちイスラエルの子らについては[b]、だれも自分の兄弟を過酷に支配してはならない。
  rationale: 世襲的移転の受益者を「後に続くあなたがたの息子たち」と明確に結び付け、「永久に受け継ぐ所有物として」で לָרֶשֶׁת אֲחֻזָּה לְעוֹלָם の相続・所有・継続性を保持した。また、禁止の対象を「だれも自分の兄弟を」として、原文の分配的構文を自然な日本語で反映した。
