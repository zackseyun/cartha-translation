  text: שֵׁ֤שׁ שָׁנִים֙ תִּזְרַ֣ע שָׂדֶ֔/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְמֹ֣ר כַּרְמֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: ja
  text: 六年の間、あなたの畑に種をまき、六年の間、あなたのぶどう畑を刈り込み、その産物[a]を集めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その収穫」。ヘブライ語は、農産物や収穫を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: 六年の間
  rationale: 期間を表す対格の働きを、自然な現代日本語で明示した。二度の反復も原文どおり保持した。
- source_word: תִּזְרַע
  choice: 種をまき
  rationale: 法規の文脈における指示的な未完了形。文末の「なさい」が並列された行為全体にかかる自然な構文とした。
- source_word: שָׂדֶךָ
  choice: 自分の畑
  rationale: שָׂדֶה の耕作地としての具体性を保ち、広義の「土地」とは訳し分けた。再帰的所有を日本語で自然に示すため「自分の」とした。
- source_word: תִּזְמֹר
  choice: 刈り込み
  rationale: ぶどう畑の文脈で זמר は枝を剪定することを指す。「剪定」はやや専門的なため、一般読者にも明瞭な「刈り込む」を採用した。
- source_word: כַּרְמֶךָ
  choice: 自分のぶどう畑
  rationale: כֶּרֶם の標準的かつ農業上具体的な訳。「自分の」は二人称単数所有接尾辞を自然に表す。
- source_word: וְאָסַפְתָּ
  choice: 取り入れなさい
  rationale: אָסַף の「集める」という意味を、農産物を収穫して取り込む文脈に合う自然な日本語で表した。命令の力は文末で明示した。
- source_word: תְּבוּאָתָהּ
  choice: その土地の産物
  rationale: תְּבוּאָה は農地から得られる産物・収穫を広く指す。女性単数接尾辞は直前の男性名詞「ぶどう畑」ではなく、直前節から続く女性名詞「土地」を受けると理解できるため、「その土地」と明示した。ただし語自体には「収穫」の意味合いもあるので脚注に代案を示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、律法の指示としての格調を保つ文体とした。並列された三つの行為を一つの「なさい」で受け、過度に古風な「せよ」は避けた。
