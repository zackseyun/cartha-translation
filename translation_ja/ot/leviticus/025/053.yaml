source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: ja
  text: 彼は、年ごとに雇われる者のように、その人のもとにいることになる。その人は、あなたの目の前で彼を過酷に支配してはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: 雇い人のように
  rationale: 接頭辞 כ の比較の意味を「ように」で表し、שׂכירを奴隷ではなく賃金で雇われる者として訳した。現代日本語として明瞭で、法的文脈にある身分上の比較も保つ。
- source_word: שָׁנָה בְּשָׁנָה
  choice: 年ごとの
  rationale: 各年にわたる継続的・分配的な意味を簡潔に表す。後続する「雇い人」に自然にかかるようにした。
- source_word: יִהְיֶה עִמּוֹ
  choice: その人のもとにいなければならない
  rationale: היה עם の基本的な意味「彼と共にいる」を保ちつつ、主人との関係を表す日本語として「もとにいる」とした。「仕える」は原文に明示されない内容を加えるため避けた。
- source_word: לֹא יִרְדֶּנּוּ
  choice: 彼を……支配してはならない
  rationale: רדה の「支配する、治める」という語義を保持した。使役的に「働かせる」と限定せず、権力行使全般への禁止として訳した。
- source_word: בְּפֶרֶךְ
  choice: 過酷に
  rationale: 強圧的・苛酷な扱いを示す語を、現代日本語で自然に「支配する」を修飾する副詞として表した。
- source_word: לְעֵינֶיךָ
  choice: あなたの目の前で
  rationale: 「あなたの目に」の具体的な比喩を保ち、見えるところで行われる行為、すなわち黙認してはならない状況を自然に表す。
theological_decisions:
- issue: 在留異国人のもとに身を売ったイスラエル人の身分
  choice: 「雇い人のように」と比較として訳し、奴隷そのものと断定しない
  alternative: 「雇われた僕として」
  rationale: כִּשְׂכִיר は比較を示し、שׂכיר は雇用された労働者を指す。章全体の隷属的状況は消さず、一方で本節が与える期限付きの保護された身分を、より強い動産奴隷の概念で上書きしない。
translation_notes:
  register: 明瞭な現代標準日本語。法文としての命令性と厳粛さを保つため「なければならない」「てはならない」を用いた。「その人」は直前の所有者を、「彼」は身を売った同胞を指す。代名詞の反復は多少あるが、原文の当事者関係を明確にするため維持した。
