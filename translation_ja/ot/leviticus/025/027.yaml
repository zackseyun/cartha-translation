  text: וְ/חִשַּׁב֙ אֶת שְׁנֵ֣י מִמְכָּר֔/וֹ וְ/הֵשִׁיב֙ אֶת הָ֣/עֹדֵ֔ף לָ/אִ֖ישׁ אֲשֶׁ֣ר מָֽכַר ל֑/וֹ וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/027.yaml
  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: ja
  text: その人は、売却してからの年数を計算し、残りの額[a]を、売った相手に返さなければならない。そして、自分の所有地[b]に戻る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「残りの額」は、売却代金のうち、未経過の年数に相当して買い手に返す額を指す。「余剰分」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「所有地」は、イスラエルで一族に受け継がれる土地、すなわち世襲地を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: 計算し
  rationale: חשבのピエル形は、ここでは土地を買い戻すための金額を算定することを表す。現代日本語として明快な「計算する」を用いた。
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: 売却してからの年数
  rationale: 直訳的には「その売却の年数」だが、文脈上は売却後に経過した年数を指すため、意味を明確にした。
- source_word: וְהֵשִׁיב
  choice: 返さなければならない
  rationale: שובのヒフィル形で、算定された金額を買い手に返すことを表す。律法規定としての義務を自然な日本語で示した。
- source_word: הָעֹדֵף
  choice: 残りの額
  rationale: עודףは計算後に残るもの、余剰分を表す。未経過年分に相当する返還額という文脈に合わせた。
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: 売った相手に
  rationale: 字義は「彼がそれを売った人に」。性別を不必要に強調せず、買い手である人物を自然に表現した。
- source_word: וְשָׁב
  choice: 戻ることができる
  rationale: Qal形のשובは所有地への帰還を表す。先行する返済によって帰還が可能になる手続き上の帰結として自然に訳した。
- source_word: לַאֲחֻזָּתוֹ
  choice: 自分の所有地
  rationale: אֲחֻזָּהはレビ記の土地法では、一般財産というよりイスラエルにおける世襲の土地保有を指す。「所有地」で土地性を明示し、世襲的背景は注に示した。
theological_decisions:
- issue: ヨベル規定における אֲחֻזָּה の性質
  choice: 所有地
  alternative: 世襲地／相続地
  rationale: 語はイスラエルの契約的土地制度に属する世襲の土地保有を含意するが、本文では明瞭で過度に説明的でない「所有地」とし、その文化的・法的含意を脚注で保持した。
- issue: וְשָׁב の法的ニュアンス
  choice: 戻ることができる
  alternative: 戻らなければならない／戻る
  rationale: 原語の動詞形自体は単純な継起を示し、義務か許可かを明示しない。買い戻し手続きの結果として帰還が可能になる意味を自然に示しつつ、特定の教派的理解は持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法本文にふさわしい簡潔で端正な調子とした。「その人」で前節からの主体を受け、「こうして」によって計算・返還・帰還という手続きの流れを示した。
