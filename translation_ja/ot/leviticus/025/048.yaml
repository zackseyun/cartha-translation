  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: ja
  text: 彼は売られた後、買い戻されることができる。彼の兄弟[a]の一人が彼を買い戻すことができる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」は字義的には男性の兄弟を指す。ここでの近親者による買い戻しの制度との関連では、より広く「親族」と理解・翻訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: 彼は売られた後にも
  rationale: אַחֲרֵי の時間的関係と、מכר のニファル形が示す受け身をそのまま表した。「にも」により、売却後もなお次の規定が有効であることを自然な日本語で示す。
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: 買い戻されることができる
  rationale: 直訳的には「彼には買い戻しがある」。法的な可能性・資格を自然な現代日本語で表し、この土地・債務奴隷制の文脈に合う「買い戻す」を用いた。
- source_word: אֶחָד מֵאֶחָיו
  choice: 彼の兄弟の一人
  rationale: 字義どおり「彼の兄弟たちのうちの一人」。男性親族を指す語を本文では具体的に保ち、親族としての法的意味は注で補った。
- source_word: יִגְאָלֶנּוּ
  choice: 彼を買い戻すことができる
  rationale: גאל は近親者が代価を払って身柄や財産を回復する法的行為を表す。ここでは宗教語としての「贖う」よりも、具体的な取引を明瞭に伝える「買い戻す」が適切である。未完了形の規定的・許可的な力を「できる」で表した。
theological_decisions:
- issue: גאל／גאלה の訳語
  choice: 買い戻す／買い戻される
  alternative: 贖う／贖われる
  rationale: 神学的響きを不必要に強めず、レビ記25章の近親者による法的・経済的回復を明確にする。ただし、原語の近親者による回復という意味は保持した。
- issue: אֶחָיו の範囲
  choice: 兄弟
  alternative: 親族／近親者
  rationale: 本文では男性複数形の具体性を保持する。一方、法制度上の近親者という含みを失わないよう注記する。
- issue: גְּאֻלָּה תִּהְיֶה לּוֹ の法的含意
  choice: 買い戻されることができる
  alternative: 買い戻しの権利がある
  rationale: 原文が権利を表す専門用語を明示していると断定せず、売却後にも買い戻しが可能であるという法的含意を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の受け身と法的可能性を維持し、近親者による身柄の回復が具体的に分かる表現とした。
