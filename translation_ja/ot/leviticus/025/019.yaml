  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: ja
  text: 土地は実りをもたらし、あなたがたは満ち足りるまで食べ、その地に安心して住む。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנָה הָאָרֶץ פִּרְיָהּ
  choice: 土地は実りをもたらし
  rationale: 直訳的には「土地はその実を与え」。日本語では農地の産出を自然に表す「実りをもたらす」とし、土地が主語である原文の構造を保った。
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: あなたがたは満ち足りるまで食べ
  rationale: שֹׂבַע は満腹・充足を表す。「満ち足りるまで」により、十分に食べられることを明確かつ自然に伝えた。
- source_word: וִישַׁבְתֶּם
  choice: 住む
  rationale: ישׁב はここでは座る動作ではなく、土地に定住して暮らすことを指す。「住む」が簡潔で現代的である。
- source_word: לָבֶטַח
  choice: 安らかに
  rationale: 安全と不安のない居住を表す語。「安らかに」は単なる心情ではなく、文脈上、安全に暮らす状態を自然に表現する。
- source_word: עָלֶיהָ
  choice: その地に
  rationale: 女性単数の代名詞は הָאָרֶץ（土地）を受ける。日本語では「その上に」より「その地に」が居住表現として自然で、指示対象も明確である。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、律法本文にふさわしい簡潔で落ち着いた調子とした。「住む」は原語の定住の意味を保ち、「安らかに」によって安全な居住という約束を表した。
