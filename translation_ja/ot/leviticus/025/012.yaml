source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: ja
  text: これはヨベルの年であり、あなたがたにとって聖なる年である。畑からその産物を食べなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: これは…であり
  rationale: 直前の規定の根拠を示す接続辞。日本語では独立した理由節として自然になるよう「これは…であり」とした。
- source_word: יוֹבֵל
  choice: ヨベルの年
  rationale: レビ記25章では雄羊の角笛ではなく、特別に定められた第五十年を指す。「ヨベル」だけでは現代の一般読者に年を指すことが伝わりにくいため、「の年」を補った。
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: あなたがたにとって聖なる年である
  rationale: קֹדֶשׁの契約的・宗教的な意味を「聖なる」で保ち、女性単数の主語がヨベルの年であることを日本語で明示した。
- source_word: מִן הַשָּׂדֶה
  choice: 畑から
  rationale: 土地に自然に生じたものを、通常の収穫・貯蔵によらず畑から得て食べるという文脈を簡潔に表す。
- source_word: תֹּאכְלוּ
  choice: 食べなければならない
  rationale: 法規文中の未完了形が持つ規範的な力を、現代日本語で明確に示した。許可だけを表す「食べてもよい」にはしなかった。
- source_word: תְּבוּאָתָהּ
  choice: その産物
  rationale: 畑が生み出すものを広く指す語として、作物に限定しすぎない「産物」を採用した。接尾代名詞は直前の「畑」を受ける「その」で表した。
theological_decisions:
- issue: ヨベルの年に関する聖性の表現
  choice: あなたがたにとって聖なる年である
  alternative: あなたがたのために取り分けられた年である
  rationale: 「聖なる」はקֹדֶשׁの神との関係を含む意味を保つ。「取り分けられた」だけでは、実務的な区別という印象に弱めるおそれがある。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位ある法規文。専門語「ヨベル」は章全体の中心概念として保持し、「の年」を添えて意味を明確にした。原文に明示的な語義上の異読はなく、日本語の「産物」が十分に広い意味を持つため脚注は設けない。
