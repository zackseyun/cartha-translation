id: LEV.25.43
reference: Leviticus 25:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: ja
  text: あなたは彼を過酷に支配してはならない[a]。あなたの神を畏れなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「苛酷に」「容赦なく」。ヘブライ語は、厳しく押しつぶすような扱いを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: 支配して
  rationale: רדהは「支配する、権力を行使する」の意。債務によって仕える同胞に対する権限を述べる文脈なので、関係性を明確にしつつ過度に解釈を加えない「支配する」とした。
- source_word: בּוֹ
  choice: 彼を
  rationale: 男性単数の代名詞で、直前まで述べられている仕える同胞を指す。日本語では「彼を支配する」が自然である。
- source_word: בְּפָרֶךְ
  choice: 過酷に
  rationale: פָּרֶךְは厳しく苛酷な扱い、押しつぶすような使役を表す。「過酷に」はこの強さを保ちつつ、現代日本語として自然である。別訳の幅は脚注に示した。
- source_word: וְיָרֵאתָ
  choice: 畏れなさい
  rationale: 接続詞は形式上「そして」だが、禁止命令に続いて、その行動を律する神への畏敬を命じる。日本語では文を分けても倫理的なつながりが自然に伝わるため、明示的な逆接語を補わなかった。
- source_word: מֵאֱלֹהֶיךָ
  choice: あなたの神を
  rationale: יראに伴う前置詞מִןは畏れの対象を示すヘブライ語表現であり、日本語では助詞「を」で表す。所有表現も保持した。
theological_decisions:
- issue: 最後の節と前半の禁止命令との関係
  choice: 「あなたの神を畏れなさい」と独立した命令として訳し、神への畏敬が人への権力行使を律する構造を保つ。
  alternative: 「そうではなく、あなたの神を畏れなさい」と逆接を明示する。
  rationale: ヘブライ語の接続詞は基本的に「そして」であり、文脈上は対照・動機づけとして働く。日本語本文では接続関係を限定しすぎず、原文の簡潔さと神学的緊張を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「恐れる」ではなく、神への敬虔な畏敬を示す「畏れる」を用いた。禁止命令は「してはならない」、肯定命令は「なさい」とし、法文としての明快さを保った。
