source:
  edition: WLC
  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: ja
  text: しかし、周囲に城壁のない村々の家は、土地の畑として数えられる[a]。それには買い戻しの権利があり、ヨベルの年には解放される[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「土地の畑として数えられる」。城壁のある町の家ではなく、農地と同じ規定が適用されるという意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「ヨベルには、それは出る」。すなわち、その物件はヨベルの年に買い手の手を離れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: しかし、村々の家
  rationale: חֲצֵרִים は文脈上、城壁都市と対比される農村集落を指す。「村々」とし、城壁がないことは後続の関係節で明示した。接続詞 וּ は前節との対比を示すため「しかし」とした。
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: 周囲に城壁のない
  rationale: סָבִיב の「周囲に」と、חֹמָה の都市を囲む「城壁」という意味を簡潔かつ自然に保持した。
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: 土地の畑と同じものと見なされる
  rationale: 直訳的な「土地の畑として数えられる」という法的分類を、現代日本語で理解しやすく表した。城壁のある町の家ではなく農地と同じ規定を受ける趣旨を保っている。
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: それには買い戻しの権利があり
  rationale: גְּאֻלָּה はこの財産法の文脈では近親者などによる「買い戻し」を表す。単なる可能性より法的権利を示す構文として訳した。男性単数代名詞は、分類された家・物件を集合的に受ける「それ」で保持した。
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: ヨベルの年には手放される
  rationale: יֵצֵא の字義は「出る」だが、ここでは売却された物件が現所有者の手を離れる法的解放・復帰を指す。帰属先を本文が明示しないため、「元の所有者に戻る」と補いすぎず「手放される」とした。
theological_decisions:
- issue: ヨベルにおける יֵצֵא の帰属先
  choice: 手放される
  alternative: 元の所有者に戻る／出て行く
  rationale: 文脈上は売却された物件の復帰を指すが、この節自体は帰属先を明示しない。「手放される」は法的効果を伝えつつ、本文以上の説明を本文へ織り込まない。字義的表現は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法的文脈を伝えるため「買い戻しの権利」を用い、専門語「ヨベル」はレビ記の制度名として保持した。
