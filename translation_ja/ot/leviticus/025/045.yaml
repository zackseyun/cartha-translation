source:
  edition: WLC
  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: ja
  text: また、あなたがたのもとに寄留している在留異国人の子らから、あなたがたは買うことができる。あなたがたと共にいる彼らの一族、すなわち彼らがあなたがたの土地でもうけた者たちからも買うことができる。彼らはあなたがたの所有物となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「所有物」は、ここでは法的に保有されるものを指す。次節では、それを相続財産として子孫に残せることが明示される。
    reason: legal_context
lexical_decisions:
- source_word: וְגַם
  choice: また…からも
  rationale: 前節に続いて、購入が認められる別の対象を付け加える表現として、自然な現代日本語にした。
- source_word: מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: あなたがたと共に住む寄留者の子孫から
  rationale: בני は直訳すれば「息子たち」だが、ここでは世代・血統を指すため「子孫」が自然である。תושב と גר の重なりは、非イスラエル系の居住者を表す法的用語として「共に住む寄留者」とした。
- source_word: מֵהֶם תִּקְנוּ
  choice: …から…買うことができる
  rationale: קנה の商取引上の意味を明示し、文脈上の許可を「ことができる」で表した。
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: あなたがたと共にいるその一族からも
  rationale: משפחה は家族より広い血縁集団をも指し得るため「一族」とした。
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: 彼らがあなたがたの国で生ませた者たち
  rationale: הוליד はヒフィル形で「生ませる、もうける」を意味する。男性を主語とする「もうけた」も可能だが、原文の使役的な形を保った。
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: 彼らはあなたがたの所有となる
  rationale: אחזה の「所有物・保有財産」という法的意味を率直に示す。「財産」と断定するより原語に近い「所有」を採った。
theological_decisions:
- issue: 奴隷の購入と所有を定める法的表現
  choice: 「買う」「所有」と直接的に訳す
  alternative: 「得る」「仕える者」と婉曲に訳す
  rationale: 本文は人を購入し、継承可能な所有とする制度を法的に述べているため、その厳しい内容を訳語で和らげない。本文が制度を記述することと、翻訳がそれを是認することとは区別する。
- issue: אֲחֻזָּה の具体的な法的含意
  choice: 本文では「所有」、脚注で相続可能な財産という含意を示す
  alternative: 本文で「相続財産」と明示する
  rationale: 語自体は「所有物・保有財産」を表し、相続可能性は周辺文脈、とりわけ次節によって明確になる。本文に文脈上の含意を過剰に織り込まず、脚注で説明した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、律法本文の厳粛な法的調子を保った。「寄留者」は聖書の法的・社会的区分を示す語として採用し、奴隷制を婉曲化する語は避けた。
