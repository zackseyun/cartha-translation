revisions:
- from: また、あなたがたと共に住む寄留者の子孫[a]からも、あなたがたと共にいるその一族からも、すなわち彼らがあなたがたの国で生ませた者たちを買うことができる。彼らはあなたがたの所有となる[b]。
  to: また、あなたがたのもとに寄留している在留異国人の子らから、あなたがたは買うことができる。あなたがたと共にいる彼らの一族、すなわち彼らがあなたがたの土地でもうけた者たちからも買うことができる。彼らはあなたがたの所有物となる[b]。
  rationale: 購入を表す動詞の反復は、日本語で原文の二つの購入元を明瞭に示すためのものである。「子ら」はבְּנֵיの基本的な意味を保ち、過度に広い「子孫」は避けた。一方、後半の関係節は「一族」を限定する形に改め、男性主語のהוֹלִידוּを自然な日本語で「もうけた」と訳した。人を法的に保有するという厳しい内容を曖昧にせず、「所有物」とした。脚注aは本文が「子ら」となったため不要であり、削除した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:25:47Z'
