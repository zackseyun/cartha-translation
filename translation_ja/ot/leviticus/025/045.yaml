  source_fidelity: 原文は、あなたがたのもとに寄留する在留異国人の「子ら」と、その一族（あなたがたの土地で彼らがもうけた者たち）を、購入可能な対象として並べる。現行訳の「彼らが…生ませた者たちを買う」は、修飾関係と購入元・購入対象の関係が不明瞭である。また「生ませた」は日本語では不自然で、ここでの男性複数主語に対しては「もうけた」が自然である。
  naturalness: 「あなたがたと共にいるその一族からも、すなわち彼らが…生ませた者たちを買うことができる」は係り受けが重く、「その一族」と「者たち」の関係も分かりにくい。原文の並列を保ちながら、「彼らの子らから、また…彼らの一族からも買うことができる」とすると明瞭である。
  terminology: תּוֹשָׁבִים と גָּרִים の重なりは、単に「寄留者」だけでなく居住する異国人という社会的・法的区分を示す。「在留異国人」は明瞭で、「あなたがたのもとに寄留している」が両語の含意を補う。「所有」は日本語では名詞止めとしてやや不自然なので、אֲחֻזָּהの法的な保有・所有の意味を保つ「あなたがたの所有物となる」とする。
