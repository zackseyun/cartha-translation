  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: ja
  text: 土地は永久に売り渡してはならない[a]。土地はわたしのものだからである。あなたがたは、わたしと共にいる寄留者であり、居住者なのだからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「永続的に」「永久譲渡として」。
    reason: lexical_alternative
  - marker: b
    text: 「寄留者であり、居住者」という表現は、イスラエルが土地の所有者である神のもとで、その土地に依存する立場にあることを示す。
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: 売り渡してはならない
  rationale: ニファル未完了形の受動的・禁止的な法的効力を、自然な現代日本語で表した。「売ってはならない」よりも、土地の所有権移転という文脈を明確にする。
- source_word: לִצְמִתֻת
  choice: 永久に
  rationale: 土地を回復不能な形で恒久的に譲渡することを指す。本文では簡潔で分かりやすい「永久に」とし、厳密な含意を脚注で補った。
- source_word: כִּי לִי הָאָרֶץ
  choice: 土地はわたしのものだからである
  rationale: 禁止の根拠を示す二つの כִּי のうち、第一の因果関係と神の直接的な所有権主張を保持した。
- source_word: גֵרִים
  choice: 身を寄せて住む者
  rationale: 自分の世襲地を持たず、他者の土地で保護を受けて居住する者という従属的な立場を、現代の読者に伝わる表現にした。
- source_word: וְתוֹשָׁבִים
  choice: 寄留者
  rationale: 定住していても土地に完全な世襲権を持たない居住者を表す。対語との重複を避けつつ、暫定的な居住資格を示す。
- source_word: עִמָּדִי
  choice: わたしのもとに
  rationale: 字義的には「わたしと共に」だが、ここでは神の土地に神に依存して住む関係を自然に表す。「わたしに対して」などと抽象化しすぎないようにした。
theological_decisions:
- issue: イスラエルと土地との関係
  choice: イスラエルの土地保有は神の所有権の下にある派生的・従属的なものとして訳す。
  alternative: 単なる社会経済的規定として訳す、または文脈を越えた絶対的な土地剝奪の主張として訳す。
  rationale: 「土地はわたしのもの」という明示的理由は、ヨベルの規定を神学的に根拠づける。法的側面と神の所有権の双方を保ち、後代の教理体系は持ち込まない。
- issue: גֵרִים וְתוֹשָׁבִים の二語の関係
  choice: 近接する二つの身分語を「身を寄せて住む者、寄留者」と並べ、意味の重なりと差異を残す。
  alternative: 一語にまとめて「寄留者」とする。
  rationale: 原文は二語を併置してイスラエルの非所有者的・依存的地位を強調しているため、訳文でも二項を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。法文としての禁止を「してはならない」で示し、神の直接発話にふさわしく「わたし」を用いた。二つの כִּי はいずれも理由を示すため「だからである」を反復し、原文の論理構造と強調を保った。
