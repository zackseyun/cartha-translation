id: LEV.25.41
reference: Leviticus 25:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: ja
  text: その人は、息子たちと共にあなたのもとを去り、自分の氏族[a]のもとへ帰り、父祖伝来の所有地[b]へ戻る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家族」とも訳せる。ヘブライ語は、近親家族より広い血縁集団を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「彼の父祖たちの所有地」。すなわち、父祖から受け継いだ土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: 去り
  rationale: 法規定の文脈で未来・継起を表す語として理解した。直訳的な「出て行く」より自然な日本語でありつつ、解放という法的意味を訳文に付加しすぎない。
- source_word: מֵעִמָּךְ
  choice: あなたのもとを
  rationale: 字義は「あなたと共にいる所から」。主人の家または奉仕から離れることを、解釈を狭めず自然に表す。
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: その人は、息子たちと共に
  rationale: בָּנִים の明示的な男性複数を保ち、本人と息子たちが一緒に去る構文を明確にした。
- source_word: וְשָׁב ... יָשׁוּב
  choice: 帰り……戻る
  rationale: 同じ動詞 שׁוב の反復を、日本語の不自然さを避けながら二つの移動先への回復として表した。
- source_word: מִשְׁפַּחְתּוֹ
  choice: 自分の氏族
  rationale: 土地保有と親族関係の文脈では、近親家族だけでなく、より広い血縁集団を指し得るため。
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: 父祖伝来の所有地
  rationale: אֲחֻזָּה の世襲的な土地保有の意味と、אֲבֹתָיו の父系の祖先への言及を、明瞭で自然な日本語にした。
theological_decisions:
- issue: 男性形の親族語
  choice: 息子たち……父祖
  alternative: 子どもたち……先祖
  rationale: 原文が明示する男性複数と父系の相続関係を中性化せず保持した。
- issue: 解放を表す社会法的含意
  choice: あなたのもとを去り
  alternative: あなたへの奉仕から解放され
  rationale: 文脈上は債務隷属からの解放を指すが、原文は具体的に「出る／去る」と述べるため、法的含意を本文で説明しすぎないようにした。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調ある法文調とした。「氏族」「所有地」は社会法的背景を保つために用い、二度の שׁוב は「帰り……戻る」として反復を感じさせつつ自然な日本語に整えた。
