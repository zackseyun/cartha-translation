source:
  edition: WLC
  text: וְ/לִ֨/בְהֶמְתְּ/ךָ֔ וְ/לַֽ/חַיָּ֖ה אֲשֶׁ֣ר בְּ/אַרְצֶ֑/ךָ תִּהְיֶ֥ה כָל תְּבוּאָתָ֖/הּ לֶ/אֱכֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: ja
  text: また、あなたの家畜と、あなたの地にいる野生の動物にとっても、そのすべての産物は食物となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: あなたの家畜
  rationale: בְּהֵמָהはここでは所有される飼育動物を集合的に指し、後続の野生動物との対比も明瞭になるため。
- source_word: לַחַיָּה
  choice: 野生の動物
  rationale: 家畜と対照される飼育されていない動物を指す。現代日本語として明快で具体的な表現を選んだ。
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: あなたの地にいる
  rationale: 関係節が「野生の動物」を修飾する構造を保ち、אֶרֶץの具体的かつ契約的・農耕的な語感を「地」で表した。
- source_word: תִּהְיֶה
  choice: となる
  rationale: 産物が食物として利用可能であることを示すהיהの機能を、自然な日本語で表した。
- source_word: כָּל תְּבוּאָתָהּ
  choice: そのすべての産物
  rationale: תְּבוּאָהは土地から得られる産物・収穫を指す。女性単数接尾辞は前節から続く「地」を受けるため、「その」とした。
- source_word: לֶאֱכֹל
  choice: 食物
  rationale: ל付き不定詞が示す用途・目的を、「食物となる」という自然で簡潔な日本語にした。
theological_decisions: []
translation_notes:
  register: 律法本文にふさわしい落ち着いた文体を保ちつつ、現代の一般読者に明瞭な語彙を用いた。「また」と「にとっても」により、前節から続く受益対象の列挙を自然に示した。
