  text: אֶ֨ת כַּסְפְּ/ךָ֔ לֹֽא תִתֵּ֥ן ל֖/וֹ בְּ/נֶ֑שֶׁךְ וּ/בְ/מַרְבִּ֖ית לֹא תִתֵּ֥ן אָכְלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: ja
  text: あなたの金銭を、利息を取ってその人に貸してはならない。また、利益を得るためにあなたの食物を与えてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: あなたの金
  rationale: כֶּסֶףは「銀」と「金銭」の両義を持つが、貸借を扱うこの法的・経済的文脈では、日本語の「金」が自然で明確である。
- source_word: תִתֵּן לוֹ
  choice: 彼に貸して
  rationale: 字義は「彼に与える」だが、金と利息を目的語・付加語に取るため、文脈上の貸借行為を自然な日本語で明示した。
- source_word: בְּנֶשֶׁךְ
  choice: 利息付きで
  rationale: נֶשֶׁךְは貸付に課す利息を指す。過大な利息だけを意味し得る「高利」などに狭めず、一般的な「利息」とした。
- source_word: וּבְמַרְבִּית
  choice: 利益を得るために
  rationale: מַרְבִּיתは増加、上乗せ、利得を表す。食物の供与から追加の利得を取ることを、現代日本語で明瞭に示す。
- source_word: אָכְלֶךָ
  choice: あなたの食物
  rationale: אָכֶלの具体的な意味を保つため「食物」とした。「食糧」も可能だが、原語より供給物の含意を強める。
- source_word: לֹא ... לֹא
  choice: …してはならない。また、…してはならない
  rationale: 二つの並列した禁止を、日本語の法文的で明瞭な構文として保持した。
theological_decisions: []
translation_notes:
  register: 現代標準日本語による、明瞭で威厳のある法文調。「彼」は直前の文脈にある困窮した同胞を受ける。原文の二つの禁止を分けて示し、נֶשֶׁךְとמַרְבִּיתの近接しつつ異なる語感を「利息」と「利益」で表した。
