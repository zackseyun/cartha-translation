source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: ja
  text: 彼は、自分を買った者と、自分がその者に身を売った年からヨベルの年までの年数を計算する[a]。彼の売却の代価は、その年数に応じたものとなる。彼は、雇い人と同じように、その者のもとにいる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「彼がその者に売られた年から」とも訳せる。文脈では、その人が自ら身を売って仕えることになった場合を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「雇い人の日々のように、彼はその者とともにいる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: 計算する
  rationale: 贖いの代価を算定する法的・経済的文脈であり、現代日本語で明瞭な「計算する」とした。
- source_word: קֹנֵהוּ
  choice: 自分を買った者
  rationale: 分詞の意味と人身をめぐる取引関係を明示しつつ、「買い手」より自然に対象を示す。
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: 自分がその者に身を売った年から
  rationale: ニファル形は形式上「売られた」とも訳せるが、直前の文脈にある自発的な身売りを自然な日本語で表した。別訳可能性は脚注に残した。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: ヨベルの年まで
  rationale: 制度名 יוֹבֵל を音写し、その年までの期間を示す原文の表現を保った。
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: 売られた代価は…定める
  rationale: כֶּסֶף は字義的には銀・金銭だが、ここでは売買上の金額を指すため「代価」とした。日本語として文を自然にするため述語を補った。
- source_word: בְּמִסְפַּר שָׁנִים
  choice: その年数に応じて
  rationale: 年数を基準とする比例的な算定を、簡潔で自然な日本語で表した。
- source_word: כִּימֵי שָׂכִיר
  choice: 雇い人の日数と同じように
  rationale: 「日々」というヘブライ語の比喩を残しつつ、雇用期間として扱う比較であることが伝わる表現とした。
- source_word: יִהְיֶה עִמּוֹ
  choice: 彼がその者のもとにいる期間は…扱われる
  rationale: 字義は「彼はその者とともにいる」だが、前の比較句との構文関係を明瞭にし、奉仕期間の算定を述べる日本語とした。
theological_decisions:
- issue: 身を売った者の法的な扱い
  choice: 雇い人の期間と同じように扱われる
  alternative: 雇い人のように彼とともにいる
  rationale: 永続的所有ではなく、年数に基づいて評価される雇用期間との比較を示す。ただし、現代的な自由雇用と同一だとは断定しない。
translation_notes:
  register: 現代の一般読者に明瞭な法文調を用いながら、荘重さを保った。「ヨベル」はレビ記の制度名として音写し、「身を売る」「代価」によって原文の取引的表現を弱めずに示した。
