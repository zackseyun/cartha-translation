  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: ja
  text: あなたがたは八年目に種をまき、九年目まで古い収穫物を食べる。九年目の収穫物が得られるまで、古いものを食べる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: あなたがたは……種をまき
  rationale: 接続詞を伴う完了形を、安息年後に行うことを述べる未来的な文脈に即して訳した。日本語では後続の述語と結び、自然な叙述形にしている。
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: 八年目
  rationale: 定冠詞を伴う序数表現を、現代日本語で自然な年次表現にした。
- source_word: וַאֲכַלְתֶּם
  choice: 食べる
  rationale: 先行する「種をまき」と並ぶ未来の行為として訳した。命令と断定しすぎず、文脈上の予告・指示の両面を保つ。
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: 古い収穫物
  rationale: תְּבוּאָהは農作物・収穫物を指し、יָשָׁןは以前の収穫に属する「古い」ものを表す。保存されていることは文脈から明らかだが、本文には明示されないため訳に加えなかった。
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: 九年目まで
  rationale: 時間的な限界を示す表現を直接的に訳した。
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: 九年目の収穫物が入るまで
  rationale: 女性単数接尾辞は直前の「九年目」を受けると理解し、日本語で指示対象が明確になるよう名詞を補った。בּוֹאの「来る」を、収穫物が利用可能になる意味に適した「入る」とした。
- source_word: תֹּאכְלוּ יָשָׁן
  choice: 古いものを食べる
  rationale: 原文がיָשָׁןを反復することを保ちつつ、日本語では文脈上の「収穫物」を「もの」で受け、過度な反復を避けた。
