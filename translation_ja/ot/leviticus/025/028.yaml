  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: ja
  text: しかし、もしその人に買い戻すだけの資力がなければ、売った土地は、それを買った人の手にヨベルの年まで残る。ヨベルの年になると、その土地は買い手の手を離れ、その人は自分の所有地に戻る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その土地はその人の所有に戻る」。最後のヘブライ語動詞は、売った人ではなく、売られた土地を主語とすることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ דֵּי
  choice: その人に…だけの資力がなければ
  rationale: 「その手が十分なものを見いださない」というヘブライ語の慣用表現を、現代日本語で明瞭な「資力がない」とした。土地を買い戻す経済的手段を欠くという文脈上の意味を表す。
- source_word: הָשִׁיב לוֹ
  choice: 買い戻す
  rationale: 直訳は「彼に返す」だが、直前の節から続く土地の贖回手続きであり、必要額を支払って土地を取り戻すことを指すため、「買い戻す」と明示した。
- source_word: מִמְכָּרוֹ
  choice: 売った土地
  rationale: 語自体は「彼の売却」または「彼が売ったもの」を表し得るが、この法規の対象は土地であり、後続句でも買い手のもとに残る対象となっているため、自然で明確な表現とした。
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: それを買った人の手に
  rationale: בְּיַד の所有・支配を表す比喩を日本語でも理解可能な「手に」で保持し、分詞 הַקֹּנֶה を「買った人」とした。
- source_word: שְׁנַת הַיּוֹבֵל
  choice: ヨベルの年
  rationale: יוֹבֵל を、この章の制度を指す聖書用語として「ヨベル」と音写し、「年」を添えて原文の形を保った。
- source_word: וְיָצָא בַּיֹּבֵל
  choice: ヨベルの年になると、その土地は買い手の手を離れ
  rationale: יצא の基本像「出る」を「手を離れる」と自然に表し、土地が買い手の支配から解放される法的結果を、次の句との流れの中で明確にした。
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: その人は自分の所有地に戻る
  rationale: 主語を元の所有者と取る有力な読みを本文に採用した。אֲחֻזָּה は相続による土地保有を含意するが、簡潔で通じやすい「所有地」とした。
theological_decisions:
- issue: 最後の動詞 וְשָׁב の主語
  choice: 元の所有者を主語として「その人は自分の所有地に戻る」
  alternative: 売られた土地を主語として「その土地は元の所有地に戻る」または「元の所有者のものに戻る」
  rationale: 男性単数形の動詞は、文脈上、売り手にも売られた対象にも結びつき得る。ヨベル法の人的・相続地的な焦点から元の所有者を主語とする読みを本文に置くが、原文に残る曖昧さは脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語による法文調。過度に古風な表現を避けつつ、「ヨベルの年」「買った人の手に」など原文の制度用語と具体的な比喩を適度に保持した。脚注記号[a]は該当する最終節の直後に配置した。
