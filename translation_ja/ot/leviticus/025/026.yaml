source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: ja
  text: しかし、もしその人に買い戻してくれる近親者[a]がなく、資力が十分になって、その土地を買い戻すのに必要な額を得たなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「買い戻す者」。ヘブライ語の「ゴーエール」は、ここでは一族の土地を買い戻す権利または務めを持つ近親者を指す。伝統的には「贖い手」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: しかし、もしその人が
  rationale: 前節から続く法的な場合分けとして「しかし、もし」とし、אִישׁは文脈上すでに述べられた土地の売り手を指すため「その人」とした。
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: その人に買い戻す親族がいなくても
  rationale: גֹּאֵלはこの土地法の文脈では、親族の土地を買い戻す権利または務めを持つ近親者を指す。「贖い手」だけでは現代日本語で宗教的意味に偏りやすいため、法的・家族的意味を本文で明示した。
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: 自分で十分な資力を得て
  rationale: 直訳は「彼の手が届き」であるが、財力が足りるようになることを表すヘブライ語の慣用句なので、意味を自然な日本語で示した。
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: 買い戻すのに必要な額を用意できたなら
  rationale: מָצָאは基本的に「見いだす／得る」、כְּדֵיは必要を満たす十分量を表す。גְאֻלָּהはここでは売却した土地の買い戻しを指すため、経済的意味を明確にした。
theological_decisions:
- issue: גֹּאֵלとגְאֻלָּהの訳語
  choice: 土地法の文脈に即して「買い戻す親族」「買い戻す」と訳す
  alternative: 「贖う者」「贖い」
  rationale: 本節は家族所有地の回復に関する法規であり、一般読者に具体的な法的意味が伝わる訳を選んだ。神学的な「贖い」との語彙上のつながりは脚注で補う。
translation_notes:
  register: 現代標準日本語による明瞭で端正な法文調。原文は次節へ続く条件節なので、文末を「なら、」として継続性を保った。「自分で」は親族の助けがない場合との対比を自然に示す。
