source:
  edition: WLC
  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: ja
  text: あなたがたの所有地[b]の全域で、土地を買い戻す権利[a]を認めなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「土地の買い戻しを認めなければならない」。原文の「贖い」は、ここでは売却された土地を代価によって取り戻すことを指す。
    reason: lexical_alternative
  - marker: b
    text: 「所有地」は、イスラエルで相続地として割り当てられ、代々保持される土地を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: どこにおいても
  rationale: 前後を結ぶ接続辞を踏まえつつ、所有地の全域に例外なく適用される規定であることを、自然な現代日本語で表した。
- source_word: אֶרֶץ
  choice: 土地
  rationale: ここでは地球や国ではなく、法的規定の対象となる土地を指す。
- source_word: אֲחֻזַּתְכֶם
  choice: あなたがたの所有地
  rationale: イスラエルの相続地として保持される土地を指す語であり、「所有地」は法的な含みを保ちながら簡潔で分かりやすい。相続地としての背景は脚注で補った。
- source_word: גְּאֻלָּה
  choice: 買い戻す権利
  rationale: 売却された土地を代価によって取り戻すこと、またその法的権利を表す文脈である。「贖い」だけでは現代日本語で土地取引の意味が伝わりにくいため、文脈上の意味を明示した。
- source_word: תִּתְּנוּ
  choice: 認めなければならない
  rationale: 字義的には「与えなければならない」だが、買い戻しの権利を法的に保障して妨げないという意味を自然な日本語で表した。
- source_word: לָאָרֶץ
  choice: その土地を
  rationale: ヘブライ語は字義的には「土地に／土地のために」だが、日本語では「その土地を買い戻す」と目的語として組み込むのが自然である。
theological_decisions:
- issue: 売却された相続地に関する命令の性質
  choice: 土地を買い戻す権利を認めるよう命じる法的規定として訳した。
  alternative: 「土地に贖いを与えなければならない」と、権利性を明示せず字義的に訳すこともできる。
  rationale: レビ記25章の土地法の文脈では、売却された土地を取り戻すための制度的な余地を確保する命令である。「権利」はこの法的含意を明確にするが、後代の教理的な贖罪概念は持ち込んでいない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。土地法としての意味が普通の読者に伝わるよう「買い戻す権利」とした一方、原語の字義と別訳を脚注に残した。
