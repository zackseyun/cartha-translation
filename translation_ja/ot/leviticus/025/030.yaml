id: LEV.25.30
reference: Leviticus 25:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: ja
  text: もし、丸一年が満了するまでに買い戻されなければ、城壁のある町[a]にあるその家は、買った者とその子孫の所有として永久に確定する[b]。ヨベルの年になっても、その家は元の所有者に戻らない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: マソラ本文の朗読形（Qere）は「城壁のある」と読む。子音本文（Ketiv）は「城壁のない」と読める。29節および31節との対比から、本文では朗読形に従った。
    reason: textual_variant
  - marker: b
    text: 直訳は「永久に立つ」。売買が法的に確定し、効力を保つことを意味する。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「ヨベルに出て行かない」。すなわち、ヨベルの年にも買い手の所有から離れて元の所有者に戻ることはない。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: 買い戻される
  rationale: גאלのニファル形は、この財産法の文脈では、定められた権利に基づいて家を買い戻すことを指す。「贖われる」より具体的で、現代日本語として明瞭である。
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: その家が丸一年たつまでに
  rationale: 買い戻しが可能な期限である完全な一年を自然な日本語で示し、接尾代名詞の指示対象も文脈に即して明示した。
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: 永久に確定する
  rationale: קוםの「立つ」という語義を法的文脈に即して「確定する」とし、לצמיתתの恒久性を「永久に」で保持した。
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לוֹ חֹמָה (Qere) / לא חֹמָה (Ketiv)
  choice: 城壁のある町にあるその家
  rationale: マソラ本文の朗読形לוֹ（「それに／その町にある」）に従った。直前の25:29から続く規定および直後の25:31との対比もこの読みを支持する。子音本文לאなら「城壁のない」となるため、異読を注記した。
- source_word: לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו
  choice: 買った者とその代々のものとして
  rationale: 買い手本人だけでなく、その家系にわたって所有が継続する法的意味を簡潔に表した。
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: ヨベルの年になっても、元の所有者に戻されない
  rationale: 直訳は「ヨベルに出て行かない」だが、ここでのיצאは買い手の所有から離れて元の所有者へ返ることを指すため、その法的意味を明確にした。
- source_word: יּוֹבֵל
  choice: ヨベルの年
  rationale: レビ記25章の制度を表す聖書用語として「ヨベル」を保ち、「年」を添えて時点を明瞭にした。
theological_decisions:
- issue: 城壁のある町の家の売買が持つ恒久的効力
  choice: 一年以内に買い戻されなければ、売買は買い手の家系に対して恒久的に確定し、ヨベルにも元の所有者へ戻らない。
  alternative: 「確定する」をより字義的に「立つ」と訳し、法的な帰結を本文では明示しない。
  rationale: וְקָם、לַצְּמִיתֻת、לְדֹרֹתָיו、לֹא יֵצֵא בַּיּוֹבֵלの組み合わせは、売買の恒久的確定とヨベル時の不返還を示す。財産法上の意味を明瞭にしつつ、それ以上の教理的含意は加えていない。
- issue: 「城壁のある／ない」の本文上の相違
  choice: マソラの朗読形לוֹに従い「城壁のある」とする。
  alternative: 子音本文לאに従い「城壁のない」とする。
  rationale: 朗読形、25:29からの文脈、そして25:31で城壁のない村落が別に規定される構成から、「城壁のある」が本文の法的対比に適合する。ただし子音本文の真正な相違は脚注で保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の法規にふさわしい簡潔で厳正な調子を保った。「買い戻す」「確定する」「戻されない」により法的関係を自然に表し、本文上の重要な異読は脚注で明示した。
