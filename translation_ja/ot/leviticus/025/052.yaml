  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: ja
  text: しかし、ヨベルの年まで残っている年数が少ないなら、その人は買い主と精算し、残りの年数に応じて、自分の買い戻しの代価を支払わなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分の買い戻しを返す」。ここでは、自由になるために支払う買い戻し金額を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: 残っている年数が少ない
  rationale: נשאר の「残る」と מעט の数量的意味を、現代日本語で自然な時間表現として示した。
- source_word: שְׁנַת הַיּוֹבֵל
  choice: ヨベルの年
  rationale: レビ記25章の制度名として、ヘブライ語 יוֹבֵל を音写しつつ「年」を添えた。
- source_word: וְחִשַּׁב לוֹ
  choice: その人は買い主と計算し
  rationale: חשב の法的・経済的な「算定する」という意味と、לוֹ が示す相手との精算を文脈に即して表した。主語と相手は前節から補った。
- source_word: כְּפִי שָׁנָיו
  choice: 残りの年数に応じて
  rationale: כפי の比例関係を明確にし、この文脈で שָׁנָיו が買い戻し時からヨベルまでの残存年数を指すことを自然に示した。
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: 自分の買い戻しの代価を返さなければならない
  rationale: גְּאֻלָּה はここでは抽象的な「贖い」ではなく、解放のための買い戻し金額を指す。ישיב の返還・支払いの意味を法文として明瞭にした。
theological_decisions:
- issue: גְּאֻלָּתוֹ の意味領域
  choice: 買い戻しの代価
  alternative: 贖い／買い戻し
  rationale: 奴隷状態からの解放に必要な金銭を算定する法的文脈なので、抽象的・神学的な意味に限定せず、経済的意味を明示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ヨベル」は章全体の制度用語として保持し、法的な義務は「なければならない」で表した。
