source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: ja
  text: 彼は、雇い人のように、寄留者[a]のように、あなたのもとにいなければならない。ヨベルの年まで、あなたのもとで働く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「在留外国人」。
    reason: תוֹשָׁבは、共同体内に居住する非本国人という社会的・法的区分を表すため。
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: 雇い人と同じように
  rationale: שָׂכִירは賃金を受けて働く者を指す。「雇い人」は現代日本語として明瞭で、文脈上、奴隷とは異なる身分であることも保つ。
- source_word: כְּתוֹשָׁב
  choice: 寄留者と同じように
  rationale: תּוֹשָׁבは共同体の中に住む非本国人という社会的・法的身分を表す。「寄留者」は聖書の法的文脈に適した簡潔な訳語であり、別訳として「在留外国人」を注記する。
- source_word: יִהְיֶה עִמָּךְ
  choice: あなたのもとにいなければならない
  rationale: 直訳的な「あなたと共にいる」より、この規定が雇用関係における身分と滞在を述べることを自然な日本語で示す。未完了形は法規定として義務的に訳した。
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: ヨベルの年まで
  rationale: レビ記25章の解放年を指す定着した専門語として「ヨベルの年」を用いる。
- source_word: יַעֲבֹד עִמָּךְ
  choice: あなたのもとで働く
  rationale: עבדは「仕える」「働く」の両義を持つが、直前の雇い人との比較と奴隷扱いを禁じる文脈を踏まえ、「働く」とした。עִמָּךְは支配を過度に強めず、雇用関係を自然に表す「あなたのもとで」と訳した。
theological_decisions:
- issue: 債務のために労働するイスラエル人の身分
  choice: 奴隷ではなく、雇い人または寄留者に準じる一時的な労働者として表現する。
  alternative: 「僕として仕える」など、隷属を強く連想させる表現。
  rationale: 直近の文脈（39～43節）は、この者を奴隷として扱うことを禁じ、その労働をヨベルの年までに限定する。したがって、本文の制限を弱める隷属的含意は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法規定としての厳粛さを保った。「いなければならない」によってיִהְיֶהの規定的性格を示し、「働く」によって文脈が否定する奴隷的含意を不必要に持ち込まないようにした。
