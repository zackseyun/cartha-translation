source:
  edition: WLC
  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: ja
  text: もしあなたの兄弟が貧しくなり、自分の相続地[a]の一部を売ったなら、その人に最も近い、買い戻しの務めを担う親族[b]が来て、その兄弟が売ったものを買い戻す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「相続地」とは、イスラエルで一族が代々受け継いだ土地を指す。
    reason: cultural_note
  - marker: b
    text: 原語は、近親者として一族の土地を買い戻す権利と責任を持つ者を指す。
    reason: lexical_note
lexical_decisions:
- source_word: יָמוּךְ
  choice: 貧しくなり
  rationale: 経済的に困窮することを表す動詞を、一般の読者に明瞭な現代日本語で表した。
- source_word: אָחִיךָ
  choice: あなたの兄弟
  rationale: 字義どおりの親族語を保った。この法的文脈では同胞のイスラエル人を指し得るが、それを本文で説明的に限定しなかった。
- source_word: מֵאֲחֻזָּתוֹ
  choice: 自分の相続地の一部
  rationale: מִן の部分的用法と、イスラエルの氏族・部族内で受け継ぐ土地保有を指す אֲחֻזָּה の文脈的意味を反映した。
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: その人に最も近い、買い戻しの務めを担う親族
  rationale: גאל の家族法上の役割と、הַקָּרֹב אֵלָיו が示す近親者としての優先順位を、理解しやすい日本語で表した。権利と責任の両面は脚注で補った。
- source_word: וּבָא וְגָאַל
  choice: 来て……買い戻す
  rationale: 法文の帰結として自然な日本語にしつつ、ヘブライ語自体が明示しない「できる」と「しなければならない」の度合いを本文で過度に確定しない形にした。
- source_word: אֵת מִמְכַּר אָחִיו
  choice: 兄弟の売ったもの
  rationale: מִמְכָּר を売却された物として取り、直前の相続地を受ける自然な表現とした。
theological_decisions:
- issue: イスラエルの法における兄弟という呼称
  choice: あなたの兄弟
  alternative: あなたの同胞／同じイスラエル人
  rationale: 契約共同体の成員を含み得る用法だが、原文の家族的表現を保持し、解釈的な一般化を本文に持ち込まなかった。
- issue: גאל の法的・神学的語感
  choice: 買い戻しの務めを担う親族／買い戻す
  alternative: 贖い人／贖う
  rationale: この箇所では土地を親族が回復する具体的な法制度が中心であるため、現代日本語で明瞭な「買い戻す」を用いた。同時に、単なる商取引ではなく親族としての役割であることを本文と脚注に残した。
- issue: וּבָא וְגָאַל の法的様相
  choice: 来て……買い戻す
  alternative: 来て買い戻さなければならない／来て買い戻すことができる
  rationale: 法的な期待・義務としても権利の行使としても理解され得るため、原文にない助動表現で一方に固定せず、平叙形で法規定を示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。法文として簡潔な条件文を用い、「兄弟」「相続地」など原文の親族的・土地制度的な語感を保持した。
