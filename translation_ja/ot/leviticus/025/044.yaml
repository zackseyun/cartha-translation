  text: וְ/עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ אֲשֶׁ֣ר יִהְיוּ לָ֑/ךְ מֵ/אֵ֣ת הַ/גּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם מֵ/הֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְ/אָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: ja
  text: あなたがたのものとなる男奴隷と女奴隷については、あなたがたの周囲にいる諸国民から、その者たちの中から、男奴隷と女奴隷を買うことができる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: あなたがたの所有となる男奴隷と女奴隷
  rationale: 購入と所有を扱う法的文脈なので、「しもべ」ではなく「奴隷」とし、ヘブライ語が区別する男女の語も明示した。単数形の接尾辞は共同体の各人に向けた一般的な用法だが、日本語では直後の複数形「あなたがた」と自然にそろえた。
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: あなたがたの所有となる
  rationale: 直訳的な「あなたがたのものとなる」が示す法的な帰属・所有の意味を、現代日本語で明確にした。
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: あなたがたの周囲にいる諸国民の中から
  rationale: גּוֹיִםを神学的含意の強い「異邦人」ではなく、周辺の非イスラエル諸民族を指す「諸国民」とした。מֵאֵתと後続のמֵהֶםが表す取得元を、日本語では一続きに自然に表現した。
- source_word: תִּקְנוּ
  choice: 買うことができる
  rationale: קנהの購入の意味を保ちつつ、この規定が命令ではなく許可を示すことを表した。
- source_word: עֶבֶד וְאָמָה
  choice: 男奴隷と女奴隷
  rationale: 男女それぞれの単数名詞による一般的・類型的表現を、日本語でも性別を明示して保持した。
theological_decisions:
- issue: 奴隷制を扱う法文における עֶבֶד／אָמָה の訳語
  choice: 「男奴隷」「女奴隷」
  alternative: 「男のしもべ」「女のしもべ」
  rationale: 本文は人を周辺諸国民から購入して所有することを明示するため、身分の実態を弱めず「奴隷」と訳した。規定を是認または批判する説明を本文に加えず、原文の法的内容をそのまま伝えた。
- issue: תִּקְנוּ の法的効力
  choice: 許可を表す「買うことができる」
  alternative: 命令を表す「買わなければならない」または「買いなさい」
  rationale: 未完了形はこの文脈で購入を義務づける命令ではなく、購入先を認める規定として機能している。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「男奴隷」「女奴隷」は厳しい語感を持つが、購入と所有を明記する原文を婉曲化しないために採用した。ヘブライ語の「あなた」は前半が単数、後半が複数だが、共同体への法規として日本語では一貫して「あなたがた」とした。
