  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: ja
  text: レビ人の町については、彼らの保有する町々にある家を、レビ人は恒久的に買い戻す権利がある。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より原文に近くは、「永久の買い戻しがレビ人に属するものとなる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: レビ人の町については
  rationale: 接続詞を伴う句が新たな法的事例を導入しているため、単純な「そして」ではなく、話題の転換を自然に示した。
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: 彼らが所有する町々にある家
  rationale: 原文は直訳すると「彼らの所有地の町々の家」。אֲחֻזָּה の法的な「所有地・保有地」の意味を保ちつつ、家が町の中にあるという関係を明確で自然な日本語にした。
- source_word: גְּאֻלַּת
  choice: 買い戻すこと
  rationale: 土地や家屋を親族・元の所有者が代価を払って取り戻すという本章の法的文脈に合わせ、「贖う」より具体的で分かりやすい「買い戻す」を採用した。
- source_word: עוֹלָם
  choice: いつでも
  rationale: ここでは抽象的な永遠性より、買い戻す権利が恒久的に失われないことを示す。現代日本語で法的効果を自然に伝えるため「いつでも」とした。
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: レビ人は……ことができる
  rationale: 直訳的には「レビ人に属するものとなる」だが、ラメドが示す受益者と未完了形の法規的効力を、継続的な権利・可能として表現した。
theological_decisions:
- issue: レビ人の家屋に関する買い戻し条項の法的効力
  choice: レビ人には、自分たちの町にある家を継続的に買い戻す権利がある。
  alternative: 「永久の買い戻しの権利がレビ人にある」と名詞句に近く訳す。
  rationale: גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם は、恒久的な買い戻しの権利を定める法文と理解できる。本文ではその法的効果を自然な日本語で示し、原文の名詞的表現は脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語の法文調。「レビ人」は一般的な聖書用語として保持し、「贖い戻す」ではなく意味の明確な「買い戻す」を用いた。
