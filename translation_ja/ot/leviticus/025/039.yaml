id: LEV.25.39
reference: Leviticus 25:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: ja
  text: あなたのもとで、あなたの兄弟が貧しくなり、あなたに身を売ることになったなら[b]、その人に奴隷の労働をさせてはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その人に奴隷の労働をさせてはならない」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたに売られたなら」。ヘブライ語は受け身の形だが、この文脈では、貧しくなった人が債務奉仕のために自らを売ることを指すと理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: ～なら
  rationale: 接続詞を伴う条件節を示す。日本語では文脈上、不自然な「そして」を加えず、条件表現で明確にした。
- source_word: יָמוּךְ
  choice: 貧しくなり
  rationale: 生活状態が悪化して困窮に陥ることを表す動詞であり、簡明な現代日本語とした。
- source_word: אָחִיךָ
  choice: あなたの兄弟
  rationale: 字義どおりの親族語を保った。この律法の文脈では同胞を指しうるが、本文で解釈的に限定しなかった。
- source_word: עִמָּךְ
  choice: あなたのもとで
  rationale: 相手との近接・関係を表す句を、日本語として自然に表現した。
- source_word: וְנִמְכַּר לָךְ
  choice: あなたに身を売ることになった
  rationale: 形態上は受け身だが、貧困に伴う自己売却を指す法的文脈を自然な日本語で表した。受け身の形は脚注に残した。
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: その人に～労働をさせてはならない
  rationale: 相手を働かせることへの法的禁止を明確に表した。
- source_word: עֲבֹדַת עָבֶד
  choice: 奴隷の労働
  rationale: 「奴隷の労働・奉仕」という同語根を用いた強い表現を保ち、単なる一般的な奉仕に弱めなかった。
theological_decisions:
- issue: 困窮した同胞に課してはならない労働身分の表現
  choice: 奴隷の労働
  alternative: 僕のように働かせる／奴隷として働かせる
  rationale: この節は奉仕そのものを否定するのではなく、奴隷に課す種類・身分の労働を禁じている。「奴隷」と明示することで禁止の強さを保ち、制度を婉曲化しない。
- issue: וְנִמְכַּר の受動形と自己売却の含意
  choice: 身を売ることになった
  alternative: 売られた
  rationale: ヘブライ語の受動形が持つ曖昧さを脚注で示しつつ、貧困者が債務奉仕に入る文脈を本文では自然に表した。外部の者による強制売却と断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法文としての禁止を「～させてはならない」で示し、「兄弟」「奴隷」という原文の社会的・関係的用語を婉曲化せず保持した。
