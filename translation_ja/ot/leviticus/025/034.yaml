source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: ja
  text: しかし、彼らの町々に付属する放牧地[a]は売ってはならない。それは彼らの永久の所有地[b]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「放牧地」に当たるヘブライ語は、「共有地」または「空き地」とも訳せる。レビ人の町々の周囲にある土地を指す。
    reason: lexical_alternative
  - marker: b
    text: 「永久の所有地」は、「永代の所有地」とも訳せる。ここで「永久」に当たる語は、いつまでも続くことを表し、この土地が恒久的に譲渡されないことを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה מִגְרַשׁ
  choice: しかし、……放牧地
  rationale: 接続詞は、直前のレビ人の町の家屋に関する規定との対照を示すため「しかし」とした。שְׂדֵה מִגְרַשׁは町の周囲に確保された開けた土地を指すため、現代日本語で自然な「放牧地」と訳した。שָׂדֶהの土地という意味は「放牧地」に含めた。
- source_word: עָרֵיהֶם
  choice: 彼らの町々に付属する
  rationale: 複数形と所有関係を保ちつつ、その土地がレビ人の町々に属していることを自然な日本語で表した。
- source_word: לֹא יִמָּכֵר
  choice: 売ってはならない
  rationale: ニファル形の受動的意味と、土地売却を禁じる法的な力を明確に表す。
- source_word: כִּי
  choice: だからである
  rationale: 後半が禁止の理由を示すことを明確にした。
- source_word: אֲחֻזַּת עוֹלָם הוּא לָהֶם
  choice: それは彼らの永久の所有地だからである
  rationale: אֲחֻזָּהを土地に関する「所有地」、עוֹלָםを継続的で譲渡不能な地位を示す「永久」とした。代名詞の指示関係も明示した。
theological_decisions:
- issue: イスラエルの土地法における עוֹלָם の意味
  choice: 永久の所有地
  alternative: 永遠の所有地／永代の所有地
  rationale: ここでは形而上学的な永遠性を断定するより、契約共同体の土地制度における恒久的かつ譲渡不能な所有を表す。「永久」はその法的な継続性を保ちながら、過度な含意を避ける。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法本文にふさわしい簡潔で厳粛な文体とした。「売却してはならない」より日常的に理解しやすい「売ってはならない」を採用した。
