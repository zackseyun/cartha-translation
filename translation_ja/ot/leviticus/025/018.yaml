source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: ja
  text: あなたがたは、わたしの掟を行い、わたしの法を守って[a]、それらを実行しなさい[b]。そうすれば、あなたがたはその地[c]に安全に住む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「掟」と「法」に当たるヘブライ語は、それぞれ חֻקִּים と מִשְׁפָּטִים で、異なる二つの法的用語である。別訳「わたしの定め……わたしの裁定」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「行う」を二度繰り返す。直訳すると、「わたしの掟を行い……わたしの法を守り、それらを行いなさい」。
    reason: lexical_alternative
  - marker: c
    text: すなわち、約束された地に安全に住むということ。
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: わたしの掟
  rationale: חֹק／חֻקָּהは定められた規定や法令を指す。「掟」は契約に基づく規範としての重みを保ちつつ、מִשְׁפָּטַיとの語義上の区別も示せる。
- source_word: מִשְׁפָּטַי
  choice: わたしの法
  rationale: מִשְׁפָּטは裁定、法的規定、正しい裁きを表す。ここでは複数の規定を指すため、現代日本語で自然な「法」とし、「掟」と区別した。
- source_word: תִּשְׁמְרוּ
  choice: 守って
  rationale: שׁמרは契約や律法の文脈で、注意深く守り従うことを表す。「守る」が簡潔で自然である。
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: 行い……それらを実行しなさい
  rationale: 原文はעשהを二度用いて、規定を実際に行うことを強調する。日本語の不自然な重複を和らげながら反復を残すため、「行い」と「実行しなさい」を用いた。
- source_word: וִישַׁבְתֶּם
  choice: 住むことができる
  rationale: ישׁבはこの土地の文脈では、そこに定住して暮らすことを意味する。先行する命令に続く帰結を自然な日本語で示した。
- source_word: הָאָרֶץ
  choice: その地
  rationale: 文脈上、イスラエルに約束された土地を指す。「その地」は既出の特定の土地であることを簡潔に示す。
- source_word: לָבֶטַח
  choice: 安心して
  rationale: בֶּטַחは危険や脅威のない安全な状態を表す。「安心して住む」は現代日本語として自然で、安定した安全を伝える。
theological_decisions:
- issue: 従順とその地での安全な居住との関係
  choice: 神の掟と法を守り行うことに続く契約上の帰結として、その地で安心して住めることを示した。
  alternative: あらゆる時代の信者に個人的な安全や繁栄を一律に保証する一般的約束と読むこと。
  rationale: 原文は命令と、その地で安全に住むことを直接結び付けている。翻訳ではイスラエルと土地をめぐる文脈を保ち、約束を本文の範囲を越えて一般化しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の重みと契約・土地という文脈を保った。「掟」と「法」で二つの法的用語を区別し、原文の「行う」の反復は読みやすさを損なわない範囲で再現した。
