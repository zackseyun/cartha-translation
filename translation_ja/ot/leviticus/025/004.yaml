source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: ja
  text: しかし、第七年には、土地のために完全な休み、すなわち安息がある。それはヤハウェのための安息である。あなたは自分の畑に種をまいてはならず、ぶどう畑の枝を刈り込んではならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: しかし、第七年には
  rationale: 前節の六年間の耕作許可との対照を示す接続詞 ו を、自然な日本語の「しかし」で表した。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 全き休みの安息
  rationale: 同根語を重ねて休止を強調するヘブライ語を、「安息」を保ちながら完全な休止を示す表現で訳した。
- source_word: יִהְיֶה לָאָרֶץ
  choice: 土地のために……がある
  rationale: 安息が土地に与えられるという ל の関係を保ち、現代日本語として理解しやすくした。
- source_word: שַׁבָּת לַיהוָה
  choice: ヤハウェへの安息
  rationale: ל の奉献・帰属の含意を「への」で簡潔に示した。
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: あなたは自分の畑に種をまいてはならず
  rationale: 二人称単数の禁止命令と農耕語彙 זרע の基本的意味を明確に表した。
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: ぶどう畑の枝を刈り込んではならない
  rationale: ぶどう栽培における זמר の意味である剪定を、一般読者に分かりやすい「枝を刈り込む」で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を明示し、提示された英語POBの本文および更新された方針と整合させた。
- issue: 土地の安息とヤハウェへの安息の関係
  choice: 二つの文として並置
  alternative: 「土地はヤハウェのために安息する」と統合する
  rationale: 原文の「土地のための全き安息」と「ヤハウェへの安息」という二つの表現を残し、その関係を説明的に限定しなかった。
translation_notes:
  register: 現代標準日本語の、簡潔で格調ある法令・聖書本文調。「全き」は強意を保つために用いたが、文全体は日常的に理解できる語彙で整えた。
