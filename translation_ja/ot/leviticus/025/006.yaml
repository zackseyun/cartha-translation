reference: Leviticus 25:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: ja
  text: 地の安息年の実りは、あなたがたの食物となる。すなわち、あなたのため、あなたの男奴隷と女奴隷のため、あなたに雇われた者のため、また、あなたと共に住む寄留者のためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: となる
  rationale: 律法文脈における未来・規定の意味を、現代日本語として自然な「となる」で表した。
- source_word: שַׁבַּת הָאָרֶץ
  choice: 地の安息年の実り
  rationale: 字義は「地の安息」だが、ここでは安息年に地が生じさせる産物が食物になることを指す。制度とのつながりと文脈上の指示対象をともに明確にした。
- source_word: לָכֶם לְאָכְלָה
  choice: あなたがたの食物
  rationale: לָכֶם の複数と、לְאָכְלָה の用途・目的を簡潔で自然な日本語にした。
- source_word: לְךָ
  choice: あなたのため
  rationale: ここから単数の受け手を筆頭とする列挙が始まるため、数の切り替わりを保った。
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: あなたの男奴隷と女奴隷
  rationale: 拘束された身分と原文の男女の区別を保持し、雇用労働者との社会的・法的相違を明示した。
- source_word: שְׂכִירְךָ
  choice: あなたに雇われた者
  rationale: 賃金を受けて働く者を指し、奴隷とは異なる身分を自然な日本語で表した。
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: あなたと共に住む寄留者
  rationale: 非在来の居住者が継続して共に住んでいる意味を表した。「寄留者」は聖書の法的・社会的範疇を簡潔に示す。
theological_decisions:
- issue: イスラエル法における隷属・雇用身分の訳し分け
  choice: עבד/אמהを「男奴隷／女奴隷」、שכירを「雇われた者」と訳し分ける
  alternative: すべてを「しもべ」または「使用人」と訳す
  rationale: 原文が区別する拘束身分と賃金労働者を一括せず、法的・経済的な緊張をそのまま示すため。
- issue: 「地の安息」の指示対象
  choice: 文脈上の産物を明示して「地の安息年の実り」とする
  alternative: 字義どおり「地の安息」とする
  rationale: 「食物となる」という述語との関係から、食べられるのは休止そのものではなく安息年の産物である。ただし「安息年」を残して制度との結び付きを保持した。
translation_notes:
  register: 明瞭な現代標準日本語。律法としての荘重さを保ちつつ、過度に古風な表現は避けた。複数の「あなたがた」から単数の「あなた」への移行も原文どおり反映した。
