base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: ja
  text: 第七の月、その月の十日に、あなたは角笛[a]を高らかに吹き鳴らしなさい。贖罪の日[b]に、あなたがたの全土に角笛を響かせなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ショファル」。動物の角で作る角笛で、伝統的には雄羊の角とされることが多い。
    reason: lexical_alternative
  - marker: b
    text: 「贖罪の日」に当たるヘブライ語は、字義的には複数形で「贖い（複数）の日」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: あなたは……鳴り響かせなさい
  rationale: עברのヒフィル形は字義的には「通らせる」だが、角笛との組み合わせでは、その音を響き渡らせることを表す。単数二人称も「あなたは」で保持した。
- source_word: שׁוֹפַר
  choice: 角笛
  rationale: 動物の角で作る吹奏具を指すため、現代日本語で分かりやすく、単なる金属製トランペットとも区別できる「角笛」とした。
- source_word: תְּרוּעָה
  choice: 高らかに
  rationale: 大きな合図の音、鬨の声、警報などを表し得る語だが、ここでは角笛の力強い吹奏を表すため、副詞的に「高らかに」とした。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 第七の月、その月の十日に
  rationale: ヘブライ語の時の表現を明確で自然な日本語にした。
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: 贖罪の日
  rationale: イスラエルの祭儀日を示す定着した名称を用い、複数形の形態的特徴は脚注に残した。
- source_word: תַּעֲבִירוּ
  choice: あなたがたの……鳴り響かせなさい
  rationale: 前半と同じ動詞の複数二人称形。「あなたがた」により、前半の単数形との違いを可能な限り示した。
- source_word: בְּכָל אַרְצְכֶם
  choice: あなたがたの全土で
  rationale: 領土の隅々に及ぶ包括的な範囲を簡潔に表した。
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים の訳し方
  choice: 贖罪の日
  alternative: 贖いの日／贖罪の日々
  rationale: 特定の祭儀日を指す慣用的名称として「贖罪の日」が明確である。原語が形態上複数形である点を本文で不自然に解消せず、脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、命令の厳粛さを保った。「あなた」と「あなたがた」を使い分け、原文における単数命令から複数命令への移行を示した。
