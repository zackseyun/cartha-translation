source:
  edition: WLC
  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: ja
  text: そこで、わたしは六年目に、あなたがたのためにわたしの祝福を命じる。その祝福は三年分の収穫をもたらす。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: そこで、わたしは……命じる
  rationale: 動詞צוהの強い意志と権威を「命じる」で保った。冒頭の接続詞は、前節で予想される問いへの答えを示すため「そこで」とした。
- source_word: אֶת־בִּרְכָתִי
  choice: わたしの祝福を
  rationale: 神が授ける恵みを広く表し、その農業上の具体的な効果は後半に語らせた。
- source_word: לָכֶם
  choice: あなたがたのために
  rationale: 前置詞לの受益者を示す用法を、自然な現代日本語で表した。
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: 六年目に
  rationale: 安息年周期における祝福の時を簡潔に示した。
- source_word: וְעָשָׂת אֶת־הַתְּבוּאָה
  choice: その年は……収穫をもたらす
  rationale: 女性単数動詞の主語を直前の「六年目」と捉え、日本語では「その年」と明示した。תבואהは農作物の産出を指すため「収穫」とした。
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: 三年分の
  rationale: 直訳的な「三年間の」よりも、収穫量が三年を賄うという文脈上の意味を自然かつ簡潔に表した。
theological_decisions:
- issue: 約束された祝福の性質
  choice: 神が直接命じる祝福によって、通常を超える農業上の備えが与えられる
  alternative: 一般的な摂理についての記述
  rationale: 一人称の「わたしは命じる」と「わたしの祝福」は、単なる通常の収穫についての観察ではなく、神の特別な働きを示す。
- issue: וְעָשָׂתの主語
  choice: 六年目（その年）
  alternative: 土地、または祝福
  rationale: 文法上は女性単数形で複数の理解が可能だが、直前の女性名詞「年」を自然な先行詞として訳した。神の祝福が土地を実らせるという意味は文脈に保たれている。
translation_notes:
  register: 明快な現代標準日本語を用い、神の権威を表す「命じる」を保持した。「三年分の収穫」は日本語として自然で、三年間を賄う産出量を簡潔に伝える。
