id: LEV.25.51
reference: Leviticus 25:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: ja
  text: もし残っている年数が多ければ、その年数に応じて、買い取られた代金の中から自分の贖い代を返さなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の贖いを返さなければならない」とも訳せる。ヘブライ語の名詞は贖いという行為を指すこともあるが、ここでは贖いのために返す金額を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עוֹד רַבּוֹת בַּשָּׁנִים
  choice: もし残っている年数が多ければ
  rationale: 条件文を明確にし、עוֹד と רַבּוֹת の意味を自然な現代日本語で表した。文脈上、残っているのはヨベルまでの年数であるが、原文にない語は本文へ補わなかった。
- source_word: לְפִיהֶן
  choice: その年数に応じて
  rationale: 直訳的な「それらの口に従って」ではなく、既出の年数を受ける比例の慣用表現として訳した。
- source_word: יָשִׁיב
  choice: 返さなければならない
  rationale: 使役形の「戻す」を、金銭法規の文脈に即して返済義務として表現した。
- source_word: גְּאֻלָּתוֹ
  choice: 自分の贖い代
  rationale: גְּאֻלָּה は贖いの行為自体とも解し得るが、ここでは購入代金を基準に算定される金額を指す可能性が高いため、「贖い代」とした。
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: 買い取られた代金の中から
  rationale: 直訳は「彼の購入の銀（代金）から」。人が買われた際の元の代金を基準にする意味が自然に伝わるよう受け身で表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に理解できる簡潔な法文調としつつ、聖書語として定着している「贖い代」を用いた。義務を表す未完了形は「返さなければならない」とした。
