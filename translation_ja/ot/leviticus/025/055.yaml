source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: ja
  text: イスラエルの子らは、わたしのしもべ[a]だからである。彼らは、わたしがエジプトの地から導き出したわたしのしもべである。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」は「奴隷」とも訳せる。ここでは、イスラエルが人間の主人ではなくヤハウェに属する者であることが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: だからである
  rationale: 直前の規定の根拠を示す接続詞として、説明・理由の働きを自然な日本語で表す。
- source_word: לִי ... עֲבָדִים / עֲבָדַי
  choice: わたしのしもべ／わたしのしもべ
  rationale: לִי は所属を示し、עבד は奴隷から僕・仕える者までを含む。ここでは人間の主人ではなくヤハウェに属するという契約的主張を表しつつ、日本語で過度に近代的な奴隷制へ限定しない「しもべ」を選び、反復も保った。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の父祖に由来する共同体表現を保持し、現代日本語でも理解できる形にした。
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: 彼らは、わたしが……導き出した
  rationale: ヒフィル形の使役的な脱出の語感を「導き出した」で表し、出エジプトの定型的主題を明瞭にする。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 原文の「地」を残し、自然な日本語の起点表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を普通名詞の称号に置き換えず、固有名として音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称男性複数接尾辞を、日本語で複数性が明確な「あなたがた」として表した。
theological_decisions:
- issue: עבד が示す隷属・奉仕と契約的所属
  choice: しもべ
  alternative: 奴隷
  rationale: 文脈はイスラエルが人間に恒久的に所有されず、ヤハウェに属することを強調する。「奴隷」も語義上可能だが、日本語では近代的な動産奴隷制を強く想起させ得るため、語義の幅と契約的奉仕を保つ「しもべ」を本文に置き、別訳を注記した。
- issue: בְנֵי יִשְׂרָאֵל の共同体表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 簡明な集合名詞へ平板化せず、原文の系譜的・共同体的な比喩を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準語。「しもべ」は聖書的な語感を持つが一般読者にも理解可能であり、עבד の語義的・神学的幅を保つ。原文の反復を維持して所属の強調を再現した。
