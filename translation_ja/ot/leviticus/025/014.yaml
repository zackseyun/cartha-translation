source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: ja
  text: あなたがたが仲間に品物を売る場合、または仲間から買う場合、だれも自分の同胞を不当に扱ってはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不当に扱う」は、「不当な利益を得る」「損害を与える」とも訳せる。ここでは特に、売買で相手につけ込むことを指す。
    reason: 語の意味の幅と、商取引という文脈上の含意を示すため。
lexical_decisions:
- source_word: וְכִי
  choice: あなたがたが……とき
  rationale: 律法上の事例を導入する接続表現。ここでは反復し得る取引の場面を示すため、自然な日本語の「……とき」とした。
- source_word: מִמְכָּר
  choice: 何か
  rationale: 売却物または売買を指す名詞だが、日本語では動詞「売る」の目的語として「何か」とするのが明瞭で自然。
- source_word: עָמִית
  choice: 同胞
  rationale: 共同体に属する仲間を指す語。「隣人」よりも、この律法における共同体的な関係を明確に表す。
- source_word: מִיַּד
  choice: から
  rationale: 直訳は「手から」だが、売買取引を表すヘブライ語の慣用句なので、日本語では自然に「から」とした。
- source_word: תּוֹנוּ
  choice: 不当に扱ってはならない
  rationale: 損害を与える、不当な利益を得る、虐げるという意味領域を持つ。商取引の文脈を踏まえつつ、動詞が持つ幅を狭めすぎない表現とした。
- source_word: אִישׁ אֶת־אָחִיו
  choice: だれもその同胞を
  rationale: 字義的には「人はその兄弟を」。法規としての個別的・代表的な力を保ちながら、現代日本語で共同体全体への適用が明瞭になるよう訳した。
theological_decisions:
- issue: אִישׁ と אָחִיו の代表的男性表現
  choice: 「だれもその同胞を」と訳す
  alternative: 「人はその兄弟を」と字義的に訳す
  rationale: 原文の規定は男性だけに限定する趣旨ではなく、契約共同体の成員相互の行為を禁じるもの。日本語では「同胞」が共同体的連帯を保ちつつ、代表的用法を自然に伝える。
- issue: 禁止される行為の範囲
  choice: 「不当に扱う」として意味の幅を保つ
  alternative: 「だます」「不当な利益を得る」と商取引上の搾取に限定する
  rationale: 直前の売買の文脈は経済的不正を強く示すが、この動詞自体はより広く虐待や不当な扱いを表し得るため、本文では限定しすぎず、文脈上の含意を脚注で示す。
translation_notes:
  register: 明瞭で現代的な律法文の調子とし、「同胞」を反復して共同体内の相互責任を示した。禁止は簡潔で厳粛な「……てはならない」とした。
