revisions:
- from: あなたがたが同胞に何かを売るとき、また同胞から買うときは、だれもその同胞を不当に扱ってはならない。[a]
  to: あなたがたが仲間に品物を売る場合、または仲間から買う場合、だれも自分の同胞を不当に扱ってはならない。[a]
  rationale: 草案の基本的な訳し方と脚注の説明は適切である。原文の「仲間」（עמית）と「兄弟」（אָח）の語を区別しつつ、後者の配分的表現を「だれも自分の同胞を」と明確にした。また、売買対象を自然に表す「品物」を用い、脚注記号を説明対象に対応させた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:25:15Z'
review_pass:
  verdict: revise
  source_fidelity: 原文は、共同体の仲間（עמית）との売買において、各人が自分の「兄弟」（אָח）を不当に扱わないよう命じる。草案はこの趣旨を正確に伝えているが、「その同胞」は直前の取引相手を特定しているようにも読め、原文の配分的な「各人が自分の同胞を」という表現をやや弱める。
  naturalness: 全体として明瞭で現代的である。「品物を売る場合」「仲間から買う場合」とすると、法律文として自然であり、「何か」よりも売買対象を明確に示せる。脚注記号は説明対象である禁止表現の直後に置く。
  terminology: עמיתは「仲間」、אָחはこの文脈で共同体内の成員を指す「同胞」とし、二つの異なる原語を不必要に同一化しない。不正行為を表す ינה は売買の文脈で不当な利益を得ることを含むが、本文では「不当に扱う」として語義の幅を保つ。
  issues:
  - severity: low
    issue: 「その同胞」の指示対象
    rationale: 「その」は直前の「同胞」、すなわち売買相手だけを指すように受け取られ得る。איש את־אחיו は配分的に「だれも自分の同胞を」であり、この形のほうが原文の構文に近い。
  - severity: low
    issue: 「何か」の具体性
    rationale: ממכר は売られる物・売買対象を指す。「品物」は日本語の売買文脈でより自然かつ明確で、意味を限定しすぎない。
  - severity: low
    issue: 脚注記号の位置
    rationale: 脚注は「不当に扱う」の語義を説明するため、文末ではなく当該禁止表現の直後に置くほうがアンカーが明確になる。
