id: LEV.25.42
reference: Leviticus 25:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: ja
  text: 彼らは、わたしがエジプトの地から連れ出した、わたしの奴隷[a]だからである。彼らは奴隷として売られてはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの僕」とも訳せる。ヘブライ語 עֲבָדַי は奉仕者を指すことも奴隷を指すこともあるが、ここでは神への所属が通常の奴隷としての売買を禁じる根拠となっている。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「奴隷の売買として売られてはならない」。つまり、通常の奴隷取引と同じ仕方で売ってはならない、ということ。
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: だからである
  rationale: 直前の規定の根拠を示す接続詞として、説明・理由の働きを自然な日本語で表した。
- source_word: עֲבָדַי הֵם
  choice: 彼らは……わたしの奴隷
  rationale: עֶבֶד に一人称単数接尾辞が付き、独立代名詞 הֵם によって『彼らこそわたしに属する者』という点が強調される。この文脈では隷属・所有関係が論拠なので、『僕』や『しもべ』より『奴隷』が社会法的な強さを保つ。
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: わたしがエジプトの地から連れ出した
  rationale: 出エジプトを表す定型的な使役形の表現を保ちつつ、現代日本語として自然にした。
- source_word: לֹא יִמָּכְרוּ
  choice: 売られてはならない
  rationale: ニファル未完了形の受動態と、法規における禁止の意味を明確に表した。
- source_word: מִמְכֶּרֶת עָבֶד
  choice: 奴隷として
  rationale: 直訳は『奴隷の売買で／奴隷の売られ方で』に近く、通常の奴隷取引と同じ扱いを禁じる意味を簡潔に表した。直訳的な形は脚注に残した。
theological_decisions:
- issue: עֲבָדַי における神への所属と隷属をどう表すか
  choice: わたしの奴隷
  alternative: わたしの僕／わたしのしもべ
  rationale: ここでは、出エジプトによってイスラエル人が神に属しているため、人間が通常の奴隷財産として売ってはならない、という法的・神学的論理が中心である。柔らかい語に置き換えず、古代の隷属関係が持つ緊張を残した。
- issue: 出エジプトの行為と売買禁止の関係
  choice: 理由を示す『だからである』で明示した
  alternative: 単純な並列として訳す
  rationale: כִּי は直前の法規の根拠を導入する。神による解放と神への所属が、人による奴隷売買を制限するという本文の緊張を解消せずに示した。
translation_notes:
  register: 現代標準日本語の法的で荘重な文体とした。神の一人称は『わたし』とし、『奴隷』を婉曲化せず用いる一方、語義の幅を脚注で示した。
