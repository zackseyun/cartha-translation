id: LEV.25.13
reference: Leviticus 25:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: ja
  text: このヨベルの年には、あなたがたはそれぞれ、自分の所有地に戻らなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: このヨベルの年には
  rationale: 前置詞 בְּ を時を表す「には」とし、יוֹבֵל はレビ記25章の制度を指す名称として「ヨベル」と音写した。「この」は הַזֹּאת の指示性を保つ。
- source_word: תָּשֻׁבוּ
  choice: 戻らなければならない
  rationale: 二人称複数未完了形が法的規定の文脈で義務を表すため、現代日本語の法令的表現として訳した。
- source_word: אִישׁ
  choice: あなたがたはそれぞれ
  rationale: אִישׁ の分配的用法を自然な日本語で示しつつ、動詞の二人称複数も明示した。ヘブライ語の男性単数形を、日本語で不自然に性別限定する「各男子」とはしなかった。
- source_word: אֶל אֲחֻזָּתוֹ
  choice: 自分の所有地に
  rationale: אֲחֻזָּה はこの文脈ではイスラエルの各家に割り当てられた土地保有を指す。「所有地」は単なる抽象的な所有物より土地の文脈を明確にし、接尾辞 וֹ は分配構文に合わせて「自分の」とした。
theological_decisions:
- issue: אִישׁ の分配的・男性形の表現
  choice: あなたがたはそれぞれ
  alternative: 各人は／男はそれぞれ
  rationale: ここでの אִישׁ は命令の対象を一人ずつ分配して示す。日本語では「それぞれ」がその機能を自然に保持し、本文が要求しない男性限定を加えない。
- issue: אֲחֻזָּה の範囲
  choice: 所有地
  alternative: 所有物／相続地
  rationale: レビ記25章の土地返還規定を踏まえ「所有地」としたが、「相続地」は世襲性を本文以上に明示する可能性があるため避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語。法的義務を「戻らなければならない」で示し、ヨベルは制度名として簡潔に音写した。
