id: LEV.25.11
reference: Leviticus 25:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: ja
  text: それはヨベルの年、すなわちあなたがたにとっての第五十年である。あなたがたは種を蒔いてはならない。自然に生えた作物を刈り取ってはならず、手入れをしていないぶどうの木になった実を収穫してはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹבֵל
  choice: ヨベルの年
  rationale: この文脈では角笛そのものではなく、第五十年に定められた特別な年を指す。制度名として定着している「ヨベル」を用い、「の年」を補って意味を明確にした。
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: 第五十年
  rationale: ヘブライ語の構文を、自然で明瞭な日本語の序数表現にした。
- source_word: תִּהְיֶה לָכֶם
  choice: あなたがたのための年となる
  rationale: לָכֶם の受益・関与の意味を保ちつつ、日本語として文意が通るよう「年」を補った。
- source_word: לֹא תִזְרָעוּ
  choice: 種を蒔いてはならない
  rationale: 律法文における禁止を、現代日本語の明確で格調ある表現にした。
- source_word: סְפִיחֶיהָ
  choice: 自然に生えた作物
  rationale: 種を蒔かずにひとりでに生じた農作物を指すため、専門的すぎない明瞭な表現を選んだ。
- source_word: לֹא תִקְצְרוּ
  choice: 刈り取ってはならず
  rationale: 穀物などの収穫を表す動詞として訳し、後続のぶどう収穫を表す動詞との違いを保った。
- source_word: נְזִרֶיהָ
  choice: 手入れをしなかったぶどうの木の実
  rationale: この農耕文脈では、剪定などの手入れをせず放置したぶどうの木に実ったものを指す。日本語では収穫の直接の対象が実であることを明示した。
- source_word: לֹא תִבְצְרוּ
  choice: 収穫してはならない
  rationale: ぶどうを取り入れることに用いられる動詞であり、日本語では対象を明示した上で「収穫する」とした。
theological_decisions:
- issue: יוֹבֵל の意味領域
  choice: 第五十年の制度名として「ヨベルの年」と訳す
  alternative: 雄羊の角／角笛
  rationale: 語は角笛を指し得るが、レビ記25章のこの箇所では明示的に第五十年を指しているため。語源や象徴について本文で断定しない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある律法文の文体。「〜てはならない」を反復し、原文の三つの禁止を明確に保った。冒頭の名詞文と、それに続く第五十年についての叙述を分け、原文の強調と構造をできる限り保持した。
