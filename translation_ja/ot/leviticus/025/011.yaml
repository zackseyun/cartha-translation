  timestamp: '2026-07-19T10:25:12Z'
review_pass:
  verdict: revise
  source_fidelity: 三つの禁止（種を蒔くこと、自生した生育物を刈ること、手入れされないぶどうに関わる収穫）を区別しており、全体としてヘブライ語に忠実です。ただし、冒頭の「第五十年は、あなたがたのための年となる」は、日本語では意味がやや取りにくく、יוֹבֵל と「第五十年」との同格的な関係が不明瞭です。
  naturalness: 「あなたがたのための年となる」は現代日本語として不自然ではないものの、何のための年かが曖昧に響きます。「ヨベルの年、すなわちあなたがたにとっての第五十年」とすることで、原文の同定関係を自然に明示できます。
  terminology: 「ヨベルの年」は適切です。「自然に生えた作物」は ספיחיה の自生・後生の意味をよく伝えています。「手入れをしなかったぶどうの木の実」は נזיריה の農耕上の意味に適合しますが、「ぶどうの実」として果実を明確にするほうが自然です。
  issues:
  - severity: medium
    issue: 冒頭の第五十年とヨベルの関係が不明瞭
    rationale: ヘブライ語はヨベルを第五十年として明示的に同定する。現訳の「あなたがたのための年となる」は、その同定を日本語で十分に示さず、受益を表す一般的表現にも読める。
  - severity: low
    issue: 「ぶどうの木の実」の表現
    rationale: 意味は通じるが、日本語では「ぶどうの実」または「手入れをしていないぶどうの木になった実」のほうが収穫対象を自然に表す。
  revised_text: それはヨベルの年、すなわちあなたがたにとっての第五十年である。あなたがたは種を蒔いてはならない。自然に生えた作物を刈り取ってはならず、手入れをしていないぶどうの木になった実を収穫してはならない。
