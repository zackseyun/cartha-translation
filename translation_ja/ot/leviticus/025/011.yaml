revisions:
- from: それはヨベルの年である。第五十年は、あなたがたのための年となる。あなたがたは種を蒔いてはならない。自然に生えた作物を刈り取ってはならず、手入れをしなかったぶどうの木の実を収穫してはならない。
  to: それはヨベルの年、すなわちあなたがたにとっての第五十年である。あなたがたは種を蒔いてはならない。自然に生えた作物を刈り取ってはならず、手入れをしていないぶどうの木になった実を収穫してはならない。
  rationale: 冒頭を同格構文に改め、ヨベルが「あなたがたにとっての第五十年」であるという原文の関係を、現代標準日本語で明瞭にした。禁止の三項目、農耕語彙の区別、および法文の登録は維持した。
