source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はシナイ山でモーセに、次のように語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の四文字神名「YHWH」。慣用的に「ヤハウェ」と音写するが、古代ヘブライ語における正確な発音は確定していない。「エホバ」と表記されることもある。
    reason: 神名の原語表記と発音上の不確実性、および別表記を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語られた
  rationale: 動詞דברの「語る」を保ちつつ、物語をつなぐוは日本語では必ずしも「そして」と明示せず、自然な叙述とした。神への敬意を示すため尊敬表現を用いた。
- source_word: יְהוָה
  choice: ヤハウェ[a]
  rationale: 四文字神名を称号に置き換えず、一般的な日本語音写で表した。発音には不確実性があるため脚注を付した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示すאֶלを自然な日本語の助詞「に」で表した。מֹשֶׁהは定着した表記「モーセ」とした。
- source_word: בְּהַר סִינַי
  choice: シナイ山で
  rationale: בを発話が行われた場所を示す処格と理解し、日本語では動作の場所を表す「で」とした。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 後続する発言内容を導くヘブライ語の定型表現であり、「言われた」と重ねるより、文末を「語られた」として次節の直接話法へ自然につないだ。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文にある固有の神名を称号「主」に置換せず音写した。ただし古代の正確な発音は確定していないため、その点を脚注で明示した。
translation_notes:
  register: 明瞭で現代的かつ礼節ある聖書文体。「言って」のような冗長な逐語表現を避け、次節の発言へつながる簡潔な一文とした。
