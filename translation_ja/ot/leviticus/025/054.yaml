id: LEV.25.54
reference: Leviticus 25:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: ja
  text: しかし、もし彼がこれらの方法で[a]贖われないなら、ヨベルの年に、彼は息子たちと共に出て行く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらによって」。直前の節々に記された贖いの手続きを指す。
    reason: 語句の別訳と指示対象の明確化
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前の贖いに関する規定を受けつつ、それが行われない場合を示す条件節なので、接続と緩やかな対照の両方を表した。
- source_word: יִגָּאֵל
  choice: 贖われない
  rationale: גאלのニファル形であり、この法的文脈では代価や近親者によって身柄を買い戻されることを指す。「贖われる」は原語の法的・神学的な含みを保つ。
- source_word: בְּאֵלֶּה
  choice: これらの方法で
  rationale: 指示語は直前の節々に記された贖いの手続きを指す。「方法で」を補い、現代日本語として指示対象を分かりやすくした。
- source_word: וְיָצָא
  choice: 出て行く
  rationale: 字義は「出て行く」で、この文脈では隷属状態から解放されることを意味する。意味を説明しすぎず、ヘブライ語の表現を保持した。
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: ヨベルの年に
  rationale: レビ記の制度名יוֹבֵלを音写し、その時を示す表現として訳した。
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: 彼は息子たちと共に
  rationale: 独立代名詞הוּאを「彼は」とし、בָנָיוの明示的な男性複数を「息子たち」として保持した。עִמּוֹは自然な日本語で「共に」とした。
theological_decisions:
- issue: בָנָיוの性別を伴う家族呼称
  choice: 息子たち
  alternative: 子どもたち
  rationale: 原文は男性複数形を明示しているため、性別を広げて解釈せず、そのまま「息子たち」と訳した。
- issue: וְיָצָאが表す解放
  choice: 出て行く
  alternative: 自由になる／解放される
  rationale: 文脈上は奉仕・隷属からの解放を指すが、原文の具体的な「出る」という表現を残し、法的意味を訳文だけで限定しすぎないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。条件文の法規的な調子を維持しつつ、「これらの方法で」に脚注を付して原文の簡潔な「これらによって」という読みも示した。
