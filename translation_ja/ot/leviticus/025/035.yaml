id: LEV.25.35
reference: Leviticus 25:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: ja
  text: あなたの兄弟が貧しくなり、あなたのもとで生計が立ち行かなくなったなら[a]、彼が寄留者や滞在者であるかのように[b]、あなたと共に生きていけるよう、彼を支えなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼の手があなたと共に傾いたなら」。自活する力や生活の手段を失うことを表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 「寄留者や滞在者」という句は、ヘブライ語では構文が圧縮されている。「彼を支えよ。寄留者と滞在者をも支えよ」と、支援対象を追加する意味に取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: ～なら
  rationale: 条件付きの規定を導く表現として、現代日本語で自然な条件形にした。接続詞は独立した「そして」とせず、文脈に含めた。
- source_word: יָמוּךְ
  choice: 貧しくなり
  rationale: 経済状態が低下することを表す動詞であり、簡明かつ自然に訳した。
- source_word: אָחִיךָ
  choice: あなたの兄弟
  rationale: 原文の親族語を保持した。文脈上は契約共同体の同胞を指すが、本文では解釈的な言い換えを避けた。
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: あなたのもとで生計が立ち行かなくなった
  rationale: 直訳では「彼の手があなたと共に傾く」。経済的な力や自活能力を失う慣用表現なので、日本語では意味が明瞭になるよう訳し、原像は脚注に残した。עִמָּךְの共同体的・関係的含意を「あなたのもとで」で表した。
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: 彼を支えなければならない
  rationale: ヒフィル形は、弱った者をしっかり支え、持ちこたえさせることを意味する。規定としての命令性を表した。
- source_word: גֵּר
  choice: 寄留者
  rationale: イスラエル社会に住む非土地民・外国出身の居住者を指す法的社会語として、聖書日本語で理解可能な「寄留者」を採用した。
- source_word: וְתוֹשָׁב
  choice: 滞在者
  rationale: 一定の居住をするが、土地や共同体への所属がより限定された者を表す語として、「寄留者」と区別した。
- source_word: וָחַי
  choice: 生きていけるようにしなさい
  rationale: 支援の目的・結果を表す文脈と理解し、単なる生命維持だけでなく生活の継続も自然に伝わる表現とした。
- source_word: עִמָּךְ
  choice: あなたと共に
  rationale: 共同体の中で共に暮らし続けるという関係的意味を明確に表した。
theological_decisions:
- issue: 「あなたの兄弟」の範囲
  choice: 本文では「あなたの兄弟」と原文の親族表現を保持する。
  alternative: 「あなたの同胞」「同じイスラエル人」
  rationale: 文脈上は共同体の一員を指すが、範囲を本文で説明的に限定せず、原文の家族的・契約共同体的な言い方を残した。
- issue: 「寄留者と滞在者」の統語的機能
  choice: 困窮した兄弟が「寄留者や滞在者のように」共に生きることを述べる比較的表現として訳す。
  alternative: 「寄留者と滞在者を支えよ」と、支援対象を追加する表現として読む。
  rationale: ヘブライ語は圧縮されており複数の構文理解が可能である。本文では直前の人物の身分・扱いを示す読みを採り、別の読みを脚注に明記して曖昧さを保存した。
- issue: וָחַי の機能
  choice: 支援の目的・結果として「生きていけるように」と訳す。
  alternative: 叙述または命令の帰結として「彼はあなたと共に生きなければならない／生きる」と訳す。
  rationale: 接続形は結果・目的として自然に理解できるが、独立性を強く取る読みも可能であるため、主本文では自然な目的表現を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法規定にふさわしい端正さを保った。「兄弟」「寄留者」など原文の社会的・親族的用語は保持し、難しい慣用句のみ本文で自然化して脚注で直訳を示した。
