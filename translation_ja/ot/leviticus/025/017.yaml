base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: ja
  text: あなたがたのだれも、仲間を不当に扱ってはならない。[a] あなたの神を畏れなさい。なぜなら、わたしはヤハウェ、あなたがたの神だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「欺いてはならない」または「搾取してはならない」とも訳せる。ヘブライ語の動詞は、社会的・経済的な関係で相手につけ込み、不当な扱いをすることを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: 不当に扱ってはならない
  rationale: ヒフィル形の ינה は、ここでは社会的・経済的な関係において相手につけ込み、損害を与えることを指す。「不当に扱う」は意味を搾取だけに限定せず、この法的文脈での重大さを保つ。
- source_word: אִישׁ אֶת־עֲמִיתוֹ
  choice: だれも同胞を
  rationale: 直訳的には「人がその仲間を」だが、複数への命令の中で分配的に用いられているため、「だれも……してはならない」とした。עָמִית はこの法的文脈で同じ共同体に属する者を指すため、「同胞」と訳した。
- source_word: וְיָרֵאתָ
  choice: あなたの神を畏れなさい
  rationale: 接続詞は形式上「そして」だが、前の禁止命令に続く積極的命令として、日本語では接続語を置かず簡潔に表した。「畏れる」は神への恐れと敬意の両面を保持する。
- source_word: מֵאֱלֹהֶיךָ
  choice: あなたの神を
  rationale: ירא に伴う前置詞 מן は恐れの対象を示す。日本語では自然に目的語として「神を」と表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を、称号「主」に置き換えず音写した。
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: わたしはヤハウェ、あなたがたの神である
  rationale: כִּי は命令の根拠を示すが、日本語では独立した宣言としても因果関係が明瞭であるため、重い契約定型句を自然に保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に固有名が明記されているため、称号に置換せず「ヤハウェ」とした。
- issue: אִישׁ の分配的男性単数
  choice: だれも
  alternative: 男はだれも
  rationale: ここで אִישׁ は、男性だけを限定的に指すというより、複数の聞き手一人一人に命令を配分する構文を成す。現代日本語でその機能を明確にするため「だれも」とし、適用範囲を不必要に男性へ限定しなかった。
- issue: 二人称の数の移行
  choice: 「あなたがた」から「あなた」への移行を本文に反映
  alternative: 全て「あなたがた」に統一
  rationale: ヘブライ語は最初と末尾で複数形、中間の「畏れなさい」「あなたの神」で単数形を用いる。共同体への命令と各人への直接的訴えの緊張を保つため、日本語でも区別した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法的命令にふさわしい簡潔さと荘重さを保った。「畏れる」は宗教的敬意を含む語として採用し、神名は「ヤハウェ」とした。
