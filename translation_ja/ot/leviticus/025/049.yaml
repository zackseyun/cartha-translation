id: LEV.25.49
reference: Leviticus 25:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: ja
  text: 彼のおじ、または彼のおじの息子[a]が彼を買い戻すことができる。あるいは、彼の氏族に属する血縁の近親者が彼を買い戻すことができる。あるいは、彼自身が十分な資力を得れば[b]、自分自身を買い戻すことができる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、「いとこ」。原文は字義どおりには「おじの息子」。
    reason: 親族関係を自然な日本語でも明確にするため。
  - marker: b
    text: 原文は字義どおりには「彼の手が届けば」。ここで「手」は、買い戻しに足りる資力を得ることを表す。
    reason: 原文の「手」という比喩を示しつつ、その経済的な意味を明確にするため。
lexical_decisions:
- source_word: דֹדוֹ
  choice: 彼のおじ
  rationale: 親族による買い戻しを定める文脈なので、親族名称としての「おじ」を採用した。
- source_word: בֶן דֹּדוֹ
  choice: おじの息子
  rationale: 原文の親族関係を明示する表現を保った。「いとこ」は脚注で示す。
- source_word: יִגְאָלֶנּוּ
  choice: 彼を買い戻すことができる
  rationale: גאל の親族による法的な贖回を、現代日本語で明瞭な「買い戻す」とした。ここでは絶対的義務より、買い戻しを行いうる親族の範囲を示す用法と理解した。
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: 近い血縁者
  rationale: 直訳的な「彼の肉の残り」ではなく、肉親としての近さを表すヘブライ語の慣用句の意味を自然に伝えた。
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: 氏族の中の
  rationale: מִשְׁפָּחָה はここで核家族より広い親族集団を指すため、「家族」ではなく「氏族」とした。
- source_word: הִשִּׂיגָה יָדוֹ
  choice: 自分の手が届くようになれば
  rationale: 十分な資力を得るという意味を持つ「手が届く」という原文の比喩を、日本語でも理解可能な形で残した。
- source_word: וְנִגְאָל
  choice: 自らを買い戻すことができる
  rationale: 形態上はニファル形だが、資力を得た本人について述べる文脈上の再帰的な意味を、自然な日本語で明示した。
theological_decisions:
- issue: 親族による贖回を表す גאל の訳語
  choice: 買い戻す
  alternative: 贖う／贖い出す
  rationale: 法的・経済的に隷属状態から本人を取り戻す行為を、宗派的な含意を加えず、現代の一般読者に明瞭に伝えるため。
- issue: הִשִּׂיגָה יָדוֹ の手の比喩
  choice: 自分の手が届くようになれば
  alternative: 十分な財力を得たなら
  rationale: 資力を得るという意味を失わずに、原文の具体的な「手」の像を本文に残した。脚注で意味を補足する。
- issue: וְנִגְאָל の態と文脈上の意味
  choice: 自らを買い戻すことができる
  alternative: 彼は買い戻される
  rationale: 原文の受動形そのものには再帰性が明示されないが、本人の資力が増した場合という直前の条件から、自分自身の解放代価を支払う意味が自然である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「贖う」より具体的な「買い戻す」を用いて法的文脈を明確にし、原文の反復も維持した。脚注記号[a]は、その説明対象である「おじの息子」の直後に置いた。
