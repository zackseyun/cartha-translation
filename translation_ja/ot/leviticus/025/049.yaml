  to: 彼のおじ、または彼のおじの息子[a]が彼を買い戻すことができる。あるいは、彼の氏族に属する血縁の近親者が彼を買い戻すことができる。あるいは、彼自身が十分な資力を得れば[b]、自分自身を買い戻すことができる。
