source:
  edition: WLC
  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: ja
  text: 年数が多ければ、それに応じて購入価格を高くし、年数が少なければ、それに応じて購入価格を低くしなければならない。彼があなたに売っているのは、収穫[a]の回数だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「収穫」は「作物」または「産物」とも訳せる。
    reason: ヘブライ語 תְּבוּאוֹת の語義には、収穫、作物、産物という幅があるため。
lexical_decisions:
- source_word: לְפִי
  choice: それに応じて
  rationale: 年数と価格が比例して対応することを、自然な現代日本語で示す。
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: 年数が多ければ／年数が少なければ
  rationale: ヨベルまでに残る年数の多少を対照的に示す法規定の構造を保つ。
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: 高くし／低くし
  rationale: 使役形の増減を、売買価格の調整として明瞭に表現する。
- source_word: מִקְנָתוֹ
  choice: 買い取り額
  rationale: 語義には購入物・取得・購入価格の幅があるが、年数に応じて増減させる文脈では取引額を指すと判断した。
- source_word: מִסְפַּר תְּבוּאֹת
  choice: それだけの回数の収穫
  rationale: מִסְפַּרの数量性と、תְּבוּאוֹתが表す収穫・産物の意味を保ち、土地そのものではなく残る収穫機会が取引対象であることを伝える。
- source_word: הוּא מֹכֵר לָךְ
  choice: 彼があなたに売るのは
  rationale: 男性単数の主語と二人称単数の受け手を保ち、後続する取引内容を自然な日本語で提示する。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な法規定の文体とし、「しなければならない」で規範性を示した。対句の均衡を保ちつつ、価格と残存年数の比例関係が普通の読者にも分かる表現にした。
