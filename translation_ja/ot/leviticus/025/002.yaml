source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: ja
  text: 「イスラエルの子ら[a]に語り、彼らに言いなさい。『わたしがあなたがたに与える地に入るとき、その地はヤハウェ[c]のために安息を守らなければならない[b]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は、自然な表現では「イスラエルの民」または「イスラエル人」とも訳せる。ヘブライ語では直訳すると「イスラエルの息子たち」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その地はヤハウェのための安息を守る」。原文は地そのものを安息を守る主体として描いており、土地の擬人化を含む。
    reason: lexical_alternative
  - marker: c
    text: 「ヤハウェ」は、ヘブライ語の神名 יהוה（YHWH）の訳。伝統的には「主」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに告げて
  rationale: בְּנֵי יִשְׂרָאֵל の家族的な表現を保ち、דַּבֵּר の直接的な命令を自然な現代日本語の「告げて」で表した。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: こう言いなさい
  rationale: 後続する直接話法への導入として、ヘブライ語の命令の流れと法令的な調子を保った。
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: 地に入るとき
  rationale: ここでの כִּי は、単なる仮定ではなく将来予期される出来事を示す時間的用法と判断した。בוא＋אֶל は「入る」とした。
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: わたしがあなたがたに与える
  rationale: 分詞 נֹתֵן が表す進行中または目前の授与を、日本語では文脈上自然な非過去形で表した。
- source_word: וְשָׁבְתָה הָאָרֶץ
  choice: その地は…安息しなければならない
  rationale: 地そのものを安息の主体とする原文の擬人化を保持し、法的義務を表す文脈に合わせて「しなければならない」とした。
- source_word: שַׁבָּת לַיהוָה
  choice: ヤハウェのために安息
  rationale: שַׁבָּת の休止・安息の意味と、לְ が示すヤハウェへの献呈を自然な日本語で表した。神名 יהוה は称号に置き換えず「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の契約名が明記されているため、称号「主」に置き換えず、一般的な学術的再構音に基づく「ヤハウェ」とした。
- issue: 土地の安息の主体性
  choice: その地は…安息しなければならない
  alternative: あなたがたは土地を休ませなければならない
  rationale: 原文は土地を文法上の主語とし、土地自身が安息するように描く。この擬人化と神学的緊張を、人間の耕作義務へと言い換えず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、神の法令としての荘重さを保った。「イスラエルの子ら」は原文の家族的呼称を保持するためやや聖書的な表現とし、その自然な代案を脚注に示した。土地の擬人化は本文で明確に維持した。
