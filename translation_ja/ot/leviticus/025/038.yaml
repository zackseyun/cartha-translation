source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: ja
  text: 「わたしは、あなたがたの神ヤハウェ[a]である。わたしはあなたがたをエジプトの地から導き出した。それは、あなたがたにカナンの地を与え、あなたがたの神であるためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神の固有名の原語表記と伝統的訳語を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 形は複数形だが、単数の神を指す契約定式であり、日本語でも単数の「神」とする。接尾辞の二人称複数は「あなたがた」と明示した。
- source_word: הוֹצֵאתִי
  choice: 導き出した
  rationale: יצאのヒフィル形は出エジプトの文脈で「連れ出す、導き出す」を意味する。神の救出行為を自然な日本語で表した。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 原文にある אֶרֶץ（地）を省略せず保持した。
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: あなたがたにカナンの地を与え
  rationale: 不定詞が表す目的を保持し、与える相手と対象を明瞭にした。
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: あなたがたの神となるため
  rationale: 契約関係を表す定式を自然な日本語にした。「となる」は神の本質の変化ではなく、イスラエルに対して神であるという関係を表す。
- source_word: אֲנִי
  choice: わたしは……である
  rationale: 独立人称代名詞の強調を保ちつつ、無動詞の同定文を現代日本語として明瞭な形にした。
theological_decisions:
- issue: 契約の神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく神の固有名を直接用いているため、音写して固有名であることを保った。伝統的な代替表現は脚注で示した。
- issue: 契約定式 לִהְיוֹת לָכֶם לֵאלֹהִים の解釈
  choice: あなたがたの神となるため
  alternative: あなたがたの神であるため
  rationale: 目的を表す不定詞と契約関係の成立・確立という語感を自然に示した。ただし、神の存在や本質が変化するとの意味には限定していない。
- issue: 二つの不定詞句の関係
  choice: いずれも出エジプトの目的を表すものとして並置
  alternative: 第二の不定詞だけを土地授与の目的と捉える
  rationale: לָתֵת と לִהְיוֹת が続く原文の構造を保ち、土地の授与と契約関係の双方を出エジプトの目的として読める形にした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の自己宣言にふさわしい簡潔で荘重な「である」調を採用した。長いヘブライ語文を二文に分け、「それは」で目的関係を明示した。
