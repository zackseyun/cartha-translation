  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: ja
  text: あなたがたの間に住む寄留者[a]が豊かになり、その者のそばであなたの兄弟が貧しくなって、あなたがたの間に住むその寄留者、または寄留者の氏族の一員[b]に身を売った場合、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがたと共にいる寄留者と居住者」。二つの身分を指すとも、一つの身分を重ねて表すとも取れる。
    reason: lexical_ambiguity
  - marker: b
    text: ヘブライ語は難解で、「寄留者の家族の根株（または枝）」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: 豊かになり
  rationale: 直訳は「手が届く」だが、ここでは資力を得て経済的に富むことを表す慣用句であるため、自然な日本語で表した。
- source_word: גֵּר וְתוֹשָׁב
  choice: 間に住む寄留者
  rationale: גֵּרは共同体内に居住する非イスラエル人、תוֹשָׁבは居住者・滞在者を指す。ここでは一つの社会的身分を重ねて表す可能性が高いため、両要素を自然な日本語にまとめた。逐語的な形は脚注に示した。
- source_word: וּמָךְ
  choice: 貧しくなって
  rationale: 経済状態が悪化して貧困に陥ることを簡潔に表す。
- source_word: אָחִיךָ
  choice: あなたの兄弟
  rationale: 文脈上は同胞のイスラエル人を指すが、律法の家族的・倫理的な表現を保つため「兄弟」とした。
- source_word: עִמּוֹ
  choice: その者のそばで
  rationale: 裕福になった寄留者との近接ないし対照的関係を示す。単なる「共に」より文脈が伝わりやすい。
- source_word: וְנִמְכַּר
  choice: 身を売った
  rationale: 形態上は受動にも訳せるが、債務によって自ら奉仕の身分に入るという法的文脈では再帰的な意味が自然である。
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: 寄留者の氏族の一員
  rationale: עֵקֶרは難語で、根株・枝、またそこから氏族に属する者を指す可能性がある。本文では文脈上自然な「一員」とし、語義の不確かさを脚注に残した。
theological_decisions:
- issue: イスラエル共同体内の親族呼称
  choice: あなたの兄弟
  alternative: あなたの同胞／同族の者
  rationale: 社会法の対象が同胞イスラエル人であることを踏まえつつ、原文の家族的な倫理性を弱めないため直訳的な呼称を保った。
- issue: וְנִמְכַּרが表す売却の態様
  choice: 身を売った
  alternative: 売られた
  rationale: ニファル形の受動的表現も可能だが、レビ記25章の債務奉仕の文脈では、自らを売るという再帰的理解が適切である。ただし強制の有無について本文以上の主張は加えていない。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で落ち着いた法文調とした。節が次節へ続く条件節であるため、末尾を「場合、」として統語上の連続性を保った。
