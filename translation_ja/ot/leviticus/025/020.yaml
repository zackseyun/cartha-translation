  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: ja
  text: もしあなたがたが、「第七年には何を食べるのか。見よ、種を蒔くことも、収穫物を取り入れることもしない」と言うなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נֹּאכַל
  choice: 何を食べればよいのか
  rationale: 直訳的な「何を食べるのか」よりも、安息年を守る際の生活上の懸念を自然な現代日本語で表す。
- source_word: נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ
  choice: 収穫物を取り入れる
  rationale: אסףの「集める、取り入れる」とתבואהの「産物、収穫物」を簡潔に反映し、「収穫する」だけに狭めない。
- source_word: הֵן
  choice: 〜のに
  rationale: 後続内容を疑問の根拠として提示する談話機能を、日本語では逆接的な理由提示で自然に表した。
theological_decisions:
- issue: 安息年に関する問いの性格
  choice: 神の命令に対する民の予想される生活上の問いとして訳す
  alternative: 不信仰な反抗として強く訳す
  rationale: 本文自体は問いを提示するだけで、その動機を反抗や不信仰と明示していないため。
translation_notes:
  register: 現代標準日本語。律法本文にふさわしい落ち着いた調子を保ちつつ、一般読者に自然な条件構文と引用表現を用いた。文末の読点は次節へ続く構文を示す。
