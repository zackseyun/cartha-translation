id: LEV.25.29
reference: Leviticus 25:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: ja
  text: 人が城壁のある町にある住居用の家を売った場合、その家を買い戻せるのは、売却から一年が満了するまでである。一年の間[a]、その家を買い戻す権利がある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「日々」とある。この法的な言い回しでは、一年という期間を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: 人が……場合
  rationale: 祭儀・民事法の事例を導く条件表現として自然な現代日本語にした。אִישׁ は個々の者を指すが、日本語では「人」が代表的な当事者を明確に表す。
- source_word: בֵּית מוֹשַׁב
  choice: 住居用の家
  rationale: מוֹשָׁב の居住用途を訳出し、単に建物一般ではなく住むための家であることを保持した。
- source_word: עִיר חוֹמָה
  choice: 城壁のある町
  rationale: 「城壁によって囲まれた町」という語義を、過度に軍事的な「要塞都市」とせず明瞭に表した。
- source_word: גְּאֻלָּתוֹ
  choice: その家を買い戻す／買い戻す権利
  rationale: 土地財産法上の גְּאֻלָּה は、売却物を親族または元の所有者が取り戻す行為・権利を表す。「贖い」よりも、この文脈では「買い戻す」が具体的で分かりやすい。接尾辞は売却された家を受けるものとして訳した。
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: 売却から一年が満了するまで
  rationale: 暦年の終わりではなく、売却時から数えた一年が完了する時までという法的期限を明確にした。
- source_word: יָמִים
  choice: 一年の間
  rationale: 字義は「日々」だが、この法的慣用句では一年の期間を表す。本文では意味を明瞭にし、字義は脚注に残した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な法文調としつつ、荘重さを保った。「買い戻す」を用いて、宗教用語として誤解されやすい抽象的な「贖う」を避けた。原文の同内容を反復する二つの節は、期限の宣言と権利存続の確認として保持した。
