  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: ja
  text: モーセはアロンとその子らに言った。「会見の天幕の入り口で肉を煮なさい。そしてそこで、その肉と、任職の供え物の籠[a]に入っているパンを食べなさい。私が『アロンとその子らがそれを食べるように』と命じたとおりである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別の供え物の籠」。ヘブライ語の語は、祭司を職に就ける儀礼に伴う供え物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: 煮なさい
  rationale: בשׁלはこのいけにえの調理という文脈では、一般的な「調理する」より具体的に「煮る」を表すため。
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: 食用となるいけにえの部分を指すので、現代日本語として自然な「肉」とした。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口で
  rationale: פֶּתַחの場所的意味を保ちつつ、祭儀の場所を明瞭に示した。
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: そしてそこで、その肉を……食べなさい
  rationale: שָׁםによる場所の強調を「そこで」で保持し、目的語を日本語で明確にした。
- source_word: הַלֶּחֶם
  choice: パン
  rationale: 任職儀礼に伴うパンを指すため、素直に「パン」と訳した。
- source_word: סַל הַמִּלֻּאִים
  choice: 任職の供え物の籠
  rationale: מִלֻּאִיםは祭司を職に就ける儀礼を指す。「任職」はこの文脈を簡潔に伝え、「供え物」を補うことで籠の内容との関係を自然に表した。別訳の可能性は脚注に示した。
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: 私が『……』と命じたとおりである
  rationale: לֵאמֹרが導く命令内容を直接引用として自然な日本語に組み込んだ。
- source_word: יֹאכְלֻהוּ
  choice: それを食べるように
  rationale: 未完了形がここで持つ命令・指示の力を、「ように」と命じる構文で表した。単なる未来にも強い義務表現にも限定しなかった。
theological_decisions:
- issue: 祭司就任儀礼における מִלֻּאִים の訳
  choice: 任職の供え物
  alternative: 聖別の供え物
  rationale: アロンとその子らを祭司職に就ける儀礼を具体的に示すため「任職」を採用した。「聖別」も語の儀礼的含意を表す可能な訳として脚注に残し、後代の教派的な聖職制度は持ち込まない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令は「〜なさい」で統一した。「会見の天幕」は祭儀用語として保持し、語順は日本語として自然になるよう整えた。末尾の単数代名詞は指示対象を過度に限定せず「それ」とした。
