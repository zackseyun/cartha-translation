id: LEV.8.26
reference: Leviticus 8:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: ja
  text: ヤハウェの前にあった種なしパンのかごから、種なしパン一個、油を使ったパン一個[a]、薄焼きパン一枚を取り、それらを脂肪の部分と右のももの上に置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「油を混ぜたパン一個」。ヘブライ語は油を用いて作ったパンを指すが、油をどのように用いたかは明示していない。
    reason: 油とパンの関係について原文が残す語彙上の曖昧さを示すため。
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: 種なしパンのかごから
  rationale: 前置詞 מִן の起点・出所の意味と、祭儀に用いる具体的なかごを自然な日本語で表した。
- source_word: חַלַּת מַצָּה אַחַת
  choice: 種なしパン一個
  rationale: חַלָּה は一定の形に作ったパンを指すが、形状は本文から確定できないため、「一個」で個体性を示しつつ過度に限定しなかった。
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: 油を使ったパン一個
  rationale: שֶׁמֶן とパンとの関係は明白だが、油を混ぜたのか塗ったのかは句だけでは確定できない。「油を使った」はその曖昧さを保つ。
- source_word: רָקִיק אֶחָד
  choice: 薄焼きパン一枚
  rationale: רָקִיק は薄い平たいパンを表すため、日本語で形状と一個分を自然に伝える「薄焼きパン一枚」とした。
- source_word: הַחֲלָבִים
  choice: 脂肪の部分
  rationale: 一般的な脂そのものではなく、いけにえから取り分けられた複数の脂肪部位を指す祭儀的文脈を表した。
- source_word: שׁוֹק הַיָּמִין
  choice: 右のもも
  rationale: שׁוֹק は祭儀で取り分ける脚の部位を指す。「右のもも」は現代日本語で明快で、伝統的な聖書用語にも沿う。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名である四文字語が明記されているため、称号に置き換えず音写した。
translation_notes:
  register: 祭儀の具体性を保ちながら、現代の一般読者に分かりやすい簡潔で品位ある文体とした。原文で主語が明示されていないため、日本語でも補わず、文脈に委ねた。
