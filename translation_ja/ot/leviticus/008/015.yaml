source:
  edition: WLC
  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: ja
  text: モーセはそれを屠り、その血を取った。そして、自分の指で祭壇の四隅の角に血をつけ、祭壇を清めた[a]。また、その血を祭壇の基部に注ぎ出し、祭壇を聖別して、その上で贖いを行えるようにした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祭壇を浄めた」とも訳せる。ここで用いられているヘブライ語動詞は、祭儀の文脈では、罪を犯させることではなく、汚れを除いて清めることを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「祭壇のために贖いを行うため」とも訳せる。ヘブライ語は直訳的には「その上で贖いを行うため」とも理解できる。この動詞は、犠牲による贖い、罪障の除去、祭儀的な清めにまたがる意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: それを屠り
  rationale: 犠牲を儀礼的にほふる行為なので、一般的な「殺す」ではなく「屠る」とした。目的語は直前の文脈から補った。
- source_word: קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の四方の角
  rationale: קֶרֶןは祭壇の角状の突起を指す祭儀用語であり、סָבִיבの周囲全体に及ぶ意味を自然な日本語で表した。
- source_word: בְּאֶצְבָּעוֹ
  choice: 指で
  rationale: 単数形と道具を表す前置詞の意味を簡潔に反映した。
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: 祭壇を清めた
  rationale: 祭司文書の祭儀的文脈におけるחטאのピエル形は、罪を犯させることではなく、汚れを除いて清めることを表す。
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: 血を祭壇の基部に注ぎ
  rationale: יְסוֹדは字義的には土台・基礎だが、ここでは祭壇下部の基部を指すため、「基部」とした。
- source_word: וַיְקַדְּשֵׁהוּ
  choice: 祭壇を聖別して
  rationale: 祭壇を聖なる用途のために取り分ける行為を、現代日本語の祭儀用語「聖別」で表した。
- source_word: לְכַפֵּר עָלָיו
  choice: そのために贖いを行った
  rationale: כפרの祭儀的・神学的な重みを「贖いを行う」で保ち、עַלの対象が祭壇であることを「そのために」で示した。
theological_decisions:
- issue: 祭司的清めにおけるחטאの訳
  choice: 祭壇を清めた
  alternative: 祭壇を浄めた／祭壇から汚れを除いた
  rationale: 祭壇が罪を犯したという意味ではなく、血の儀式によって祭儀的に清められたことを示す。特定の後代の教理を持ち込まず、祭司文書の用法を反映した。
- issue: 犠牲祭儀におけるכפרの訳
  choice: そのために贖いを行った
  alternative: それを贖い清めた／そのために罪障を除いた
  rationale: 中心的な祭儀語を「贖い」として保持しつつ、祭壇そのものが儀式の対象であるという本文の緊張を解消しないようにした。עַלの関係には「その上で」という空間的理解の余地もあるため、注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語とした。「屠る」「祭壇の角」「聖別」「贖い」は祭儀上の精度を保つために用い、文全体は一般読者にも追いやすいよう短く区切った。
