  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: しかしモーセは、その雄牛と、その皮[a]、肉、糞[b]を、宿営の外で火で焼いた。ヤハウェがモーセに命じたとおりに焼いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皮」は、ここでは雄牛の外皮、すなわち獣皮を指す。
    reason: lexical_clarification
  - marker: b
    text: ヘブライ語は一般的な廃物ではなく、具体的に糞、すなわち排泄物を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: הַפָּר
  choice: その雄牛
  rationale: פַּרの基本的な意味を簡潔に表す。「若い雄牛」も可能だが、年齢を強調せず、文脈上すでに示された雄牛を指す定冠詞を「その」で表した。
- source_word: עֹרוֹ
  choice: その皮
  rationale: עוֹרは動物の皮を指す。現代日本語では「皮」が自然かつ明瞭である。
- source_word: בְּשָׂרוֹ
  choice: 肉
  rationale: בָּשָׂרの具体的な意味を保ち、動物の体の肉を自然な日本語で表した。
- source_word: פִּרְשׁוֹ
  choice: 糞
  rationale: פֶּרֶשׁは一般的な廃物ではなく排泄物を具体的に指すため、「汚物」などとぼかさず「糞」とした。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 火で焼いた
  rationale: 動詞שׂרףとבָּאֵשׁの組み合わせを自然に表しつつ、原文の「火」の明示を保った。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外で
  rationale: 荒野でのイスラエルの陣営を指す定型表現として、明瞭で格調を損なわない「宿営」を用いた。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 命じたとおりであった
  rationale: 命令と行為との厳密な対応を表すכַּאֲשֶׁרの意味を自然な日本語で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文に記された神の固有名を音写した。
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: その雄牛と、その皮、肉、糞を
  rationale: 反復される接続詞と目的格標識による列挙を、日本語として読みやすい形で保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、その固有名としての性格を保つ音写を採用した。
- issue: שָׂרַף の暗黙の主語
  choice: モーセは……焼いた
  alternative: 彼は……焼いた／……焼かれた
  rationale: ヘブライ語の動詞は三人称男性単数で主語を明示しないが、直前の文脈と後半の「ヤハウェがモーセに命じたとおり」から、行為者はモーセと理解される。日本語で曖昧にならないよう主語を補ったが、祭儀を実行するモーセという文脈以上の意味は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で dignified な調子を保った。「しかし」は前節で祭壇上に焼いた部分との対比を示す。列挙は過度に古風な反復を避けつつ、雄牛の各部分を漏れなく示した。
