base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: ja
  text: 肉とパンの残ったものは、火で焼きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: 残ったものは
  rationale: ニファル分詞の名詞的用法を、自然な現代日本語で「残ったもの」と表した。冒頭の接続詞は、日本語では文脈上明示しないほうが自然である。
- source_word: בַּבָּשָׂר
  choice: 肉の
  rationale: בָּשָׂרは字義的には動物の「肉、肉体」を指し、ここでは祭儀で食べる動物の肉なので、現代日本語の「肉」が字義と文脈の双方を簡潔に伝える。
- source_word: וּבַלָּחֶם
  choice: パンの
  rationale: לֶחֶםの通常の意味をそのまま「パン」とし、「肉の」と並列させた。
- source_word: בָּאֵשׁ
  choice: 火で
  rationale: 前置詞בְּがここでは焼却の手段を示すため、日本語では「火で」が自然で直接的である。
- source_word: תִּשְׂרֹפוּ
  choice: 焼き尽くしなさい
  rationale: 二人称男性複数の未完了形が命令的に用いられている。「焼き尽くす」は、残り物を火で完全に処分する祭儀上の指示を明確に表す。
theological_decisions: []
translation_notes:
  register: 律法の指示としての厳粛さを保ちつつ、一般の読者に明瞭な現代標準日本語とした。原文の二人称複数は日本語では不自然に主語を補わず、命令形によって表した。
