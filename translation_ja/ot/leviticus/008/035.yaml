source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: ja
  text: あなたがたは七日間、昼も夜も会見の天幕の入口にとどまり、ヤハウェが定めた務めを守りなさい。そうすれば、あなたがたは死なない[a]。なぜなら、私はこのように命じられたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして、あなたがたは死なない」。また、命令に従うことによって死を避けるという警告・目的の意味で「死なないように」と理解することもできる。
    reason: וְלֹא תָמֻתוּ は、並列的な陳述としても、命令に従うことによって死を避けるという警告・目的としても理解できるため。
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口に
  rationale: פֶתַח は入口・開口部を表す。אֹהֶל מוֹעֵד は祭儀上の定型名称として「会見の天幕」とし、自然な場所表現にした。
- source_word: תֵּשְׁבוּ
  choice: とどまり
  rationale: ישׁב は座る・住む・とどまるを意味するが、ここでは七日間その場を離れずにいる命令なので、「とどまる」が文脈に適する。
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: 七日間、昼も夜も
  rationale: 期間と継続性を現代日本語で明瞭に示し、昼夜を通してという原文の包括的表現を保った。
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: ヤハウェから命じられた務めを守りなさい
  rationale: שׁמר＋משׁמרת は、課された務め・規定を忠実に守ることを表す。「ヤハウェの務め」では所有関係が曖昧になりやすいため、命令源を明示する自然な日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
- source_word: וְלֹא תָמֻתוּ
  choice: そうすれば死ぬことはない
  rationale: 直前の命令を守ることによって回避される結果として読んだ。ただし並列的な「そして死んではならない／死ぬことはない」や警告の「死なないためである」も文法上可能なため注記した。
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: 私はそのように命じられているからである
  rationale: 受動形を保ち、話者モーセが神から命令を受けたことを表した。完了形は現在も効力を持つ命令として自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に固有名が用いられているため、称号で代替せず音写した。
- issue: 死の警告 וְלֹא תָמֻתוּ の論理的関係
  choice: 従順によって死を免れる結果として「そうすれば死ぬことはない」
  alternative: 「そして、死ぬことはない」または「死なないためである」
  rationale: 命令に続く否定未完了形は、従順の結果または回避される危険を示し得る。本文では自然な条件・結果関係を示し、別の構文理解を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会見の天幕」は祭儀用語として一貫性を重視し、「とどまる」「務めを守る」によって命令の実際的意味を自然に表した。
