base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: モーセはその胸肉を取り、それを揺祭としてヤハウェの前で揺り動かした。これは任職のための雄羊[a]から取るモーセの分であった。ヤハウェがモーセに命じたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別のための雄羊」。
    reason: מִלֻּאִיםは祭司の任職・聖別の儀礼を指し、どちらの日本語表現も文脈上可能である。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: モーセは……取った
  rationale: 物語を進めるワイイクトール形を、日本語では自然な継起として訳した。
- source_word: הֶחָזֶה
  choice: その胸肉
  rationale: 犠牲動物の特定部位を指す祭儀用語であり、単なる身体部位ではなく食肉部分であることを明確にした。
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: 奉献物として揺り動かした
  rationale: 動詞נוּףと同根名詞תְּנוּפָהの祭儀的な動作と供え物としての性格を、自然な日本語で併せて表した。
- source_word: לִפְנֵי יְהוָה
  choice: 主の前で
  rationale: 祭儀において神の御前に差し出すことを示す定型句として訳した。
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: 任職の雄羊
  rationale: מִלֻּאִיםはレビ記8章の祭司就任儀礼を指すため、「任職」を採用した。「聖別」も可能なので脚注に示した。
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: モーセの受ける分であった
  rationale: מָנָהが割り当てられた取り分を意味することを、簡潔で自然な日本語にした。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 主がモーセに命じられたとおりである
  rationale: 先の神の命令に従ったことを示す定型的な履行句として訳した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語聖書で広く理解される敬称「主」を用いた。原文が固有の神名יהוהである点は認識しつつ、本文の明瞭さと品位を優先した。
- issue: מִלֻּאִיםの祭司就任文脈での意味
  choice: 任職
  alternative: 聖別
  rationale: 祭司職への就任儀礼という文脈を最も具体的に示す「任職」を本文に置き、語のより広い儀礼的含意を反映する「聖別」を脚注に残した。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った祭儀叙述。「奉献物として揺り動かした」により、具体的動作と祭儀上の機能を両立させた。
