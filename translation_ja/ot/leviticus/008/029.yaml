revisions:
- from: モーセはその胸肉を取り、主の前で奉献物として揺り動かした。それは任職の雄羊[a]のうち、モーセの受ける分であった。主がモーセに命じられたとおりである。
  to: モーセはその胸肉を取り、それを揺祭としてヤハウェの前で揺り動かした。これは任職のための雄羊[a]から取るモーセの分であった。ヤハウェがモーセに命じたとおりであった。
  rationale: 神名を原文および英語POB監査記録に合わせて「ヤハウェ」とし、揺祭の技術的性格を本文に明示した。「任職のための雄羊」は原文の意味を保ちながら日本語の明瞭さを改善する。脚注アンカーは該当語に維持した。
