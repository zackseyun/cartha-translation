source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ja
  text: それからモーセは、全焼のささげ物の雄羊を連れて来た[a]。アロンとその子らは、それぞれその雄羊の頭に手を置いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「差し出した」または「近くに連れて来た」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「手を押し当てた」とも訳せる。犠牲動物に対して行う祭儀的な動作を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 連れて来た
  rationale: 使役形は「近くに来させる、差し出す」を表す。ここでは犠牲の動物を儀式の場へ連れて来る動作として、自然な現代日本語にした。主語は直前の文脈からモーセと明示した。
- source_word: אֵיל הָעֹלָה
  choice: 全焼のささげ物とする雄羊
  rationale: אֵיל は雄羊、עֹלָה は全体を焼いてささげる祭儀上のささげ物を指す。「とする」により、この雄羊がそのささげ物として指定されている関係を自然に示した。
- source_word: וַיִּסְמְכוּ
  choice: 手を置いた
  rationale: 犠牲動物の上に手を置く祭儀的動作を表す。日本語として定着した明瞭な表現を採り、罪の転嫁など本文に明記されない意味は付け加えなかった。
- source_word: יְדֵיהֶם
  choice: それぞれ…手を
  rationale: 複数の行為者に属する手であることを「それぞれ」で示した。ヘブライ語の複数形だけから各人が必ず両手を用いたとは断定せず、「両手」とは訳さなかった。
- source_word: עַל רֹאשׁ הָאָיִל
  choice: その雄羊の頭に
  rationale: 前置詞句を明瞭で自然な日本語にした。定冠詞による既出の雄羊への指示を「その」で表した。
theological_decisions:
- issue: 犠牲動物への按手の意味
  choice: それぞれその雄羊の頭に手を置いた
  alternative: それぞれその雄羊の頭に手を押し当てた
  rationale: סמך には支える、寄りかかるという含みもあり得るが、この節自体は動作の神学的意味を説明していない。したがって儀式行為のみを記し、罪の転嫁や同一化といった特定の解釈を訳文へ織り込まなかった。
- issue: עֹלָה の祭儀用語
  choice: 全焼のささげ物
  alternative: 焼き尽くすささげ物
  rationale: 動物全体を祭壇で焼く種類のささげ物であることが普通の読者にも分かり、同時に祭儀用語として簡潔になる表現を選んだ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。文脈上の主語モーセを補って単独でも理解しやすくした。「全焼のささげ物」は祭儀上の区別を保ちつつ一般読者にも意味を取りやすい表現とした。
