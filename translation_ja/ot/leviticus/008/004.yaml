  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: ja
  text: モーセは、ヤハウェが彼に命じたとおりに行った。そして会衆は、会見の天幕の入り口に集まった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「会衆は集められた」とも訳せる。ヘブライ語の動詞形は、会衆が集まったことを表すとも、集められたことを表すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: עשהは広く「行う、作る」を意味するが、命令への服従という文脈では「行った」が自然である。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 命じたとおりに
  rationale: 命令との一致を表す比較・適合の意味を、自然な日本語で保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を日本語で音写する。
- source_word: וַתִּקָּהֵל
  choice: 集まった
  rationale: קהלのニファル形で、会衆が一か所に集合した出来事を表す。日本語では自動詞「集まった」が最も自然である。
- source_word: הָעֵדָה
  choice: 会衆
  rationale: イスラエルの共同体を指す五書の用語として、簡潔で格調も保てる。
- source_word: פֶּתַח
  choice: 入り口
  rationale: 天幕の開口部・入口を指し、現代日本語で明瞭である。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 「天幕」と、神が民に会う場所という名称の機能をともに保つ定訳的表現である。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号「主」に置き換えず音写した。
- issue: וַתִּקָּהֵל の態
  choice: 会衆は集まった
  alternative: 会衆は集められた
  rationale: ニファル形は受動的にも表し得るが、ここでは集合を表す自動詞として自然に読める。行為者を補わず、原文の幅は脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀的文脈にふさわしい簡潔で端正な文体とした。「会見の天幕」は五書の用語として一貫性を保てる表現である。
