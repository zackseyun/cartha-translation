  source_fidelity: ヘブライ語の列挙構造と内容を忠実に反映している。「内臓を覆う脂肪」「肝臓の付属部」「二つの腎臓とその脂肪」は、各語句とその係り先を適切に表す。「モーセは」を文頭に置く処理も、日本語として自然であり、後置されるヘブライ語の主語を損なわない。「焼いて煙にした」は祭儀文脈におけるוַיַּקְטֵרの含意を無理なく伝えている。
