  text: וַ/יִּקַּ֗ח אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וַ/יַּקְטֵ֥ר מֹשֶׁ֖ה הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: ja
  text: モーセは、内臓を覆う脂肪をすべて取り、肝臓の付属部[a]、二つの腎臓とその脂肪も取り、それらを祭壇の上で焼いて煙にした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。原語は、犠牲を整える際に切り取る肝臓の特定部分を指す。
    reason: lexical_alternative
  - marker: b
    text: 「焼いてささげた」とも訳せる。原語は祭儀の文脈では、焼いて煙を立ち上らせることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: モーセは……取り
  rationale: לקחの物語叙述形。ヘブライ語では主語が後半で明示されるが、日本語では動作主を冒頭に置いて自然で明確な文とした。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内臓を覆う脂肪をすべて
  rationale: קֶרֶבはここでは動物の内臓を指し、עַלはその上にある脂肪を表す。「覆う」は解剖学的な位置関係を自然な日本語で示す。
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: 肝臓の付属部
  rationale: 犠牲を整える際に切り取る肝臓の特定部分を指すが、厳密な解剖学的同定には幅があるため、「尾状葉」などに限定せず原語に近い表現を選んだ。
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 双数を明示した、直接的で分かりやすい解剖学的表現。
- source_word: חֶלְבְּהֶן
  choice: その脂肪
  rationale: 接尾代名詞は二つの腎臓を受ける。日本語では「その脂肪」として簡潔に示した。
- source_word: וַיַּקְטֵר
  choice: 焼いて煙にした
  rationale: קטרは祭儀の文脈で、祭壇上で焼いて煙を立ち上らせることを表す。単なる「焼いた」より祭儀的な含意を保つ。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向・場所を示す語形を、現代日本語で自然な位置表現にした。
theological_decisions: []
