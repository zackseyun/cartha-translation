  text: וַ/יַּקְרֵ֞ב אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יִּתֵּ֨ן מֹשֶׁ֤ה מִן הַ/דָּם֙ עַל תְּנ֤וּךְ אָזְנָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַֽ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: ja
  text: それからモーセはアロンの子らを近づかせ、血を少し取って、彼らの右の耳たぶ、右手の親指、右足の親指につけた。さらにモーセは、祭壇の周囲に血を振りかけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 近くに来させ
  rationale: ヒフィル形の使役的な意味を自然な現代日本語で表した。祭司としての奉献という解釈を本文に付加しない。
- source_word: תְּנוּךְ אָזְנָם הַיְמָנִית
  choice: 彼らの右の耳たぶ
  rationale: תְּנוּךְ は耳の一部、通常は耳たぶを指すと理解されるため、身体部位を明確にした。
- source_word: בֹּהֶן יָדָם הַיְמָנִית
  choice: 右手の親指
  rationale: בֹּהֶן は手について用いられる場合には親指を指す。
- source_word: בֹּהֶן רַגְלָם הַיְמָנִית
  choice: 右足の親指
  rationale: 同じ בֹּהֶן が足について用いられており、日本語では自然に「足の親指」とした。
- source_word: וַיִּזְרֹק
  choice: 振りかけた
  rationale: 血を祭壇に向けて勢いをつけて施す祭儀的動作を表す語であり、「投げた」よりも日本語の祭儀文脈に適しつつ、単なる滴下ではない動作を示す。
- source_word: סָבִיב
  choice: 周囲に
  rationale: 祭壇の回り全体に対して行われたことを簡潔に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文では冒頭の動作主が動詞に含まれるだけだが、直後にモーセが明示され、文脈上も同一人物なので、日本語では最初から「モーセ」を主語として示した。「その血」は直前まで扱われている血を指す。
