revisions:
- from: それから、モーセはアロンの子らを近くに来させ、彼らの右の耳たぶ、右手の親指、右足の親指に、その血をつけた。さらにモーセは、祭壇の周囲に血を振りかけた。
  to: それからモーセはアロンの子らを近づかせ、血を少し取って、彼らの右の耳たぶ、右手の親指、右足の親指につけた。さらにモーセは、祭壇の周囲に血を振りかけた。
  rationale: 原文の מִן־הַדָּם が示す部分性を「血を少し取って」により明示した。また、使役的な「近くに来させ」をより自然な「近づかせ」に整えた。他の表現は原文の意味と現代日本語としての明瞭さを保っているため維持した。
