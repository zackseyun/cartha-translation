  text: それからモーセは、アロンとその息子たちを呼び寄せて、水で彼らを洗った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 近くに進み出させ
  rationale: ヒフィル形の「近づける、進み出させる」という使役的意味と、任職儀礼の場へ導き出す具体的な動きを保った。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: אַהֲרֹן
  choice: アロン
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: בָּנָיו
  choice: その息子たち
  rationale: ここでは祭司として任職されるアロンの男子を指すため、性別を含む語義を正確に表した。
- source_word: וַיִּרְחַץ
  choice: 洗った
  rationale: רחץの基本義を自然な現代日本語で表し、洗った範囲など原文にない限定は加えなかった。
- source_word: אֹתָם
  choice: 彼らを
  rationale: アロンとその息子たちを合わせて受ける複数目的語として明示した。
- source_word: בַּמָּיִם
  choice: 水で
  rationale: 前置詞בを手段と解し、日本語で自然な「水で」とした。「水の中で」という場所的意味に限定しない。
- source_word: וַ
  choice: それから
  rationale: 物語を順次進める接続の働きを、自然な現代日本語で表した。
