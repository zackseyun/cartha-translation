  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進める接続形を、日本語では文脈上自然な過去形で表した。דבר と後続の לֵאמֹר からなる定型句は、直訳的な「語って言った」より「告げた」が明瞭で自然である。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神の固有名を表す四文字語である。日本語聖書で広く理解される伝統的表記「主」を本文に置き、原文が固有名YHWHであることを脚注で明示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す אֶל を自然な日本語の助詞「に」で表し、人名は慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （「告げた」に含める）
  rationale: 直後の直接話法を導くヘブライ語の定型表現。日本語では「次のように言った」とも訳せるが、節末で冗長になりやすいため、「告げた」に機能を含ませた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文では「主」、脚注で「原文はYHWH（ヤハウェ）」と明示
  alternative: 本文で「ヤハウェ」または「エホバ」
  rationale: 原文が称号ではなく神の固有名であることを隠さず脚注に示しつつ、現代日本語の聖書文体として広く通用する「主」を採用した。発音の再建には一定の不確かさがあるため、それも脚注で簡潔に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の発話導入定型句を日本語として簡潔な「告げた」にまとめた。
