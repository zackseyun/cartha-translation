  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: ja
  text: 彼に胸当て[a]を着け、その胸当てにウリムとトンミム[b]を入れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胸当て」は、大祭司が胸に着けた祭司の装具。武具ではない。
    reason: lexical_alternative
  - marker: b
    text: 「ウリム」と「トンミム」はヘブライ語の祭儀用語。その正確な形状や使用法は分かっていない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: 彼につけ
  rationale: 祭司の装束を身につけさせる文脈に即し、単なる位置づけより自然な日本語とした。עַל の「上に／身に」という空間的意味も保っている。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 大祭司が胸につける祭具を指す。現代日本語で分かりやすく、武具を強く連想させる「胸当て」との誤解を避けるため、脚注で祭司の装具であることを明記する。二度の出現は同じ語で統一した。
- source_word: וַיִּתֵּן אֶל הַחֹשֶׁן
  choice: 胸当ての中に……入れた
  rationale: נָתַן と אֶל の組み合わせを、この祭具に物を収める文脈に即して自然に表現した。
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ウリムとトンミム
  rationale: 正確な形状や使用法が不明な祭儀上の専門語であるため、推測的に意味訳せず音写した。日本語では固有の名称に冠詞を表さない。
theological_decisions:
- issue: 祭司の用具 אוּרִים וְתֻּמִּים の訳し方
  choice: 「ウリムとトンミム」と音写する
  alternative: 「光と完全」「聖なるくじ」などと意味訳する
  rationale: これらは神意を伺うことに関係するが、その実体と使用法には不確かさがある。音写により、ヘブライ語本文の固有性と曖昧さを保ち、特定の解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。連続する動作を「また」で結び、祭司の着装場面に自然な「つける」を用いた。脚注記号は該当語の直後に置いた。
