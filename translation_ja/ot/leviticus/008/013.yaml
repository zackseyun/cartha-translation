  naturalness: 「近くに進み出させ」は現代標準日本語ではぎこちない。「連れて来て」は自然で、脚注に祭儀的な提示の可能性を残せる。「頭巾を巻いた」も意味は通るが、帽子状の祭司用頭部装具に対しては「帽子をかぶせた」のほうが明瞭である。
  terminology: 「アロンの子ら」「長衣」「帯」「ヤハウェ」は適切である。מִגְבָּעוֹת は大祭司のかぶり物とは異なる一般祭司の頭部装具であり、「帽子」は明瞭な現代語として許容される。神名は本文で「ヤハウェ」とし、脚注で伝統的な「主」を示す扱いを維持する。
