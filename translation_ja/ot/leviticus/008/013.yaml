  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: それからモーセは、アロンの子らを連れて来て[a]、彼らに長衣を着せ、一人ひとりに帯を締め[b]、それぞれに帽子をかぶせた。ヤハウェ[c]がモーセに命じたとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アロンの子らを近くに連れて来た」または「アロンの子らを進み出させた」とも訳せる。ヘブライ語の動詞は、祭儀の場で人を近くに連れて来て提示することを表し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「帯」は単数形だが、アロンの子ら一人ひとりに帯を締めたという意味。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語の神名はYHWH。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 近くに進み出させ
  rationale: ヒフィル形の「近くに来させる、進み出させる」という意味を保ち、祭儀の場で御前に立たせる含みを伝える。単なる移動とも正式な「奉献」とも限定しない。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: ヘブライ語の構文と男性の家族関係を簡潔に保つ。
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: 彼らに長衣を着せ
  rationale: 使役形の動作を自然な日本語で表し、כֻּתֹּנֶתを丈のある基本的な衣として「長衣」とした。祭服などの説明を本文へ過度に加えない。
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: 一人ひとりに帯を締め
  rationale: חגרの「帯を締める」を明確に表す。אַבְנֵטは形態上単数だが、複数の対象それぞれに一つずつ着けたという配分的意味を「一人ひとり」で示す。
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: それぞれの頭に頭巾を巻いた
  rationale: חבשの「巻く、しっかり着ける」という具体性を保ち、מִגְבָּעוֹתを一般祭司の頭部装具として「頭巾」と訳した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 命令への厳密な従順を示す定型句を簡潔に再現し、神名を称号に置き換えず音写した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された固有の神名を音写し、称号への置換を避ける。ただし伝統的な訳し方は脚注で示す。
- issue: וַיַּקְרֵב の祭儀的含意
  choice: 近くに進み出させ
  alternative: ささげた／任職のために差し出した
  rationale: 祭儀的な提示の含みはあるが、語そのものが持つ「近づける」と「提示する」の幅を保ち、特定の神学的解釈に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司任職の記事にふさわしい簡潔で格調ある文体とした。「長衣」「帯」「頭巾」は理解しやすさと祭服用語としての区別を両立させる。原文の連続動作は日本語で読みやすい一文にまとめ、結びの服従定型句は独立文とした。
