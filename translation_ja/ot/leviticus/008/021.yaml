base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: また、内臓と脚を水で洗った。モーセは雄羊を丸ごと祭壇の上で焼いて煙にした。これは、心地よい香りとなる焼き尽くすいけにえ、すなわちヤハウェへの火によるささげ物であった。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: 内臓
  rationale: 犠牲動物の内部の諸部分を指す。現代日本語で具体的かつ自然な「内臓」とした。
- source_word: הַכְּרָעַיִם
  choice: 脚
  rationale: 犠牲動物の脚、特に下肢を指す語だが、本文では明快な「脚」とした。
- source_word: רָחַץ בַּמָּיִם
  choice: 水で洗った
  rationale: 明示された手段「水で」を残し、儀礼の具体性を保った。
- source_word: וַיַּקְטֵר
  choice: 焼いて煙にした
  rationale: 祭壇上で焼き、煙として立ち上らせる祭儀的な意味を、単なる「焼いた」より明確に表した。
- source_word: כָּל הָאַיִל
  choice: 雄羊を丸ごと
  rationale: כָּל が示す全体性を自然な日本語で明示した。
- source_word: עֹלָה
  choice: 焼き尽くすいけにえ
  rationale: 全体を祭壇で焼く犠牲の種類を、現代の読者に意味が伝わる定訳的表現で示した。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 心地よい香りとなる
  rationale: 神に受け入れられる犠牲という含意を持つ定型句の感覚的比喩を保持した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 語源と祭儀的用法に即し、火によってささげられる物という意味を直接示した。祭壇の「食物」とする解釈は本文に持ち込まず脚注で別訳を示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおり
  rationale: 命令への正確な従順を示す対応表現 כַּאֲשֶׁר を「とおり」で保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を保持し、称号への置換や別の伝統的音写を採用しなかった。
- issue: לְרֵיחַ נִיחֹחַ の祭儀的比喩
  choice: 心地よい香りとなる
  alternative: なだめの香りとなる、芳しい香りとなる
  rationale: 嗅覚的比喩と神に喜ばれる含意を保ちつつ、「なだめ」によって贖罪観を過度に限定しないようにした。
- issue: אִשֶּׁה の意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: この語の語義には議論があるため、本文では火との関連を明示する形式的訳を採用し、「食物」とする理解を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いけにえ」「ささげ物」は宗教的文脈で一般読者にも理解しやすい語として用いた。主語の切り替わりを明確にするため、原文の連続構文を二文に分けた。
