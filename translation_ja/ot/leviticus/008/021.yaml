  terminology: 「ヤハウェ」「焼き尽くすいけにえ」「火によるささげ物」は一貫しており、本文の אִשֶּׁה を『火によるささげ物』とするのは安全です。『食物のささげ物』は有力な文脈的理解ですが、語義上の議論を伴うため脚注にとどめる扱いが適切です。
