source:
  edition: WLC
  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: ja
  text: それからモーセは、罪のためのささげ物である雄牛を差し出した[a]。アロンとその子らは、その罪のためのささげ物である雄牛の頭に手を置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「近づけた」「前に連れて来た」。
    reason: וַיַּגֵּשׁ は「近づける、前に出す、提示する」を表し、祭儀の場へ動物を差し出す動作を指す。
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: 近くに引いて来た
  rationale: ヒフィル形の「近づける、差し出す」という祭儀的動作を表す。目的語が動物であるため、現代日本語として自然な「引いて来た」を用い、「近くに」によって原語の接近・提示の含みを保った。
- source_word: פַּר
  choice: 雄牛
  rationale: 祭儀の文脈で犠牲用の牛を指す。年齢を明示する語ではないため「若い」を補わず、「雄牛」とした。
- source_word: הַחַטָּאת
  choice: 罪のきよめのささげ物
  rationale: ここでは「罪」そのものではなく祭儀上の供え物を指す。「罪祭」より分かりやすく、罪に関わる汚れの除去・きよめという機能を表しつつ、単に刑罰代償だけへ意味を限定しない表現とした。
- source_word: וַיִּסְמֹךְ
  choice: 手を置いた
  rationale: 犠牲動物に手を当てる祭儀的行為を、現代日本語で簡潔に描写する。「押しつけた」として圧力の程度を過度に特定しない。
- source_word: יְדֵיהֶם
  choice: 手
  rationale: ヘブライ語は複数形だが、複数の人物がそれぞれ手を置くことを日本語では集合的な単数形「手」で自然に表せる。
- source_word: עַל רֹאשׁ
  choice: 頭に
  rationale: 位置関係を明瞭かつ自然な現代日本語で表した。
theological_decisions:
- issue: 犠牲祭儀における按手の意味
  choice: 行為のみを「頭に手を置いた」と記述し、その仕組みを説明しない。
  alternative: 罪責の移転、供え物との一体化、または犠牲動物の指定・聖別を明示する。
  rationale: 本文は行為を記すだけで、その神学的機序を説明していないため、特定の解釈を訳文に加えない。
- issue: חַטָּאת の祭儀的意味
  choice: 「罪のきよめのささげ物」とする。
  alternative: 「罪祭」「罪のためのいけにえ」「贖罪のささげ物」。
  rationale: 罪に関係する供え物であることと、祭儀的なきよめの機能を示す一方、本文がここで明示しない特定の贖罪理論へ限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀場面にふさわしい落ち着いた文体とした。「ささげ物」は漢字を重ねず読みやすくし、按手の神学的意味は説明的に補わなかった。
