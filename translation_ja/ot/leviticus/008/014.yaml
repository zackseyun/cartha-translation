  to: それからモーセは、罪のためのささげ物である雄牛を差し出した[a]。アロンとその子らは、その罪のためのささげ物である雄牛の頭に手を置いた。
  rationale: 訳語を原語の叙述にとどめ、祭儀的機能についての説明的な付加を除きました。「差し出した」により、動物を祭儀のために近づけて提示する動作を自然な日本語で表し、その語彙的幅は対応する脚注で保持しました。
