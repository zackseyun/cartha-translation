source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וַ/יִּמְשַׁ֥ח אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וַ/יְקַדֵּ֖שׁ אֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: ja
  text: それからモーセは注ぎ油を取り、幕屋とその中にあるすべてのものに油を注ぎ、これらを聖別した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なるものとした」。
    reason: קדשׁ は、ここでは聖なるものとして取り分けることを意味するため、その基本的な意味を示す別訳。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: それからモーセは……を取り
  rationale: 物語を前へ進めるワウ継続法の働きを、自然な現代日本語の「それから」で表した。動詞の基本義「取る」も保持している。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 人や物に油を注いで聖なる務めのために取り分ける際に用いる油を指す。原文にこの節では明示されない「聖なる」を補わず、簡潔な祭儀用語とした。
- source_word: וַיִּמְשַׁח
  choice: 油を注ぎ
  rationale: 祭儀において油を施す行為を表す標準的な訳語であり、単なる「塗る」よりも、この文脈での儀礼的な意味を伝える。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記・レビ記における聖所の構造物を指す定着した用語で、一般的な「住まい」より指示対象が明確である。
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: その中にあるすべてのもの
  rationale: 幕屋の内部にある備品類を包括的に指す原文を、明瞭で自然な日本語で表した。
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: これらを聖別した
  rationale: 幕屋とその中のすべてを、聖なるものとして取り分ける祭儀的行為を表す。「これら」により、複数形の目的語が幕屋とその内容物の双方を受けることを示した。
theological_decisions:
- issue: 祭司祭儀の文脈における קדשׁ の訳し方
  choice: 聖別した
  alternative: 聖なるものとした
  rationale: ここでは幕屋とその備品を聖なる用途のために取り分けることを述べている。「聖別した」は祭儀的な意味を簡潔に保ちつつ、後代の特定の教理を持ち込まない。別訳を脚注に示し、語の基本的な意味も明らかにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀用語として定着している「幕屋」「注ぎの油」「聖別」を保持した。物語の簡潔な連続性を再現し、原文にない説明は本文へ加えていない。
