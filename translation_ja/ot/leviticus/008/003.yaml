source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: ja
  text: また、会衆全体を会見の天幕の入り口に集めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「集会全体」または「共同体全体」とも訳せる。ヘブライ語「エダー」は、文脈により「会衆」「集会」「共同体」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: また、
  rationale: וְは前の命令に続く命令を示す接続語として「また」と訳し、אֵתは定目的語標識なので日本語では訳出しない。
- source_word: כָּל
  choice: 全体
  rationale: 定冠詞付きの名詞に伴い、会衆の全員を残らず集めるという総体性を表す。自然な日本語として「会衆全体」とした。
- source_word: הָעֵדָה
  choice: 会衆
  rationale: イスラエルの共同体を集合的に指す語であり、祭司任職という公的・礼拝的文脈に合う「会衆」を採用した。「集会」「共同体」も語義上可能である。
- source_word: הַקְהֵל
  choice: 集めなさい
  rationale: קהלのヒフィル命令形で、「集まらせる」を意味する。現代日本語で明確かつ自然な命令表現とした。
- source_word: אֶל פֶּתַח
  choice: 入り口に
  rationale: 移動の到達点を表すאֶלを、日本語では場所・到達点を自然に示す助詞「に」で表した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神が定められた場で会うための幕屋を指す定型表現として、意味と聖書的な品位を保つ「会見の天幕」を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の簡潔さと祭儀文脈にふさわしい品位を保った。「会衆」はやや聖書的な語だが一般にも理解可能であり、原語の共同体的・集合的含意をよく伝える。
