  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: ja
  text: 次に、モーセは雄羊を部分ごとに切り分け、その頭と切り分けた各部分と脂肪を焼いて煙に上らせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: 雄羊
  rationale: 祭儀の文脈で、成長した雄の羊を指す標準的で明確な訳語。
- source_word: נִתַּח לִנְתָחָיו
  choice: 部分ごとに切り分け
  rationale: 動物を解体して各部分に分ける動作を、自然な現代日本語で表す。
- source_word: וַיַּקְטֵר
  choice: 焼いて煙にした
  rationale: 祭壇上で焼き、煙として立ち上らせるというヒフィル形の祭儀的な意味を保つ。
- source_word: הָרֹאשׁ
  choice: その頭
  rationale: 解体された雄羊の頭を指すことを自然に明示する。
- source_word: הַנְּתָחִים
  choice: 切り分けた部分
  rationale: 前半の נִתַּח לִנְתָחָיו との語根上の反復を日本語でも保ち、何を指すか明瞭にする。
- source_word: הַפָּדֶר
  choice: 脂肪
  rationale: 犠牲獣の脂肪性の部分を指す語だが、特に『脂尾』と断定する根拠は十分でないため、意味の幅を保つ訳語を採る。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。前半では日本語として自然に主語を省略し、後半の明示された主語「モーセ」を保持した。「焼いて煙にした」により、単なる燃焼ではなく祭儀的に煙を立ち上らせる動作を表した。
