  - severity: low
    issue: 「焼いて煙にした」の日本語表現
    rationale: 意味は通るが、「煙に上らせた」のほうが、煙として上げるというカルト的動詞קטרの使役的意味をより自然に伝える。
  revised_text: 次に、モーセは雄羊を部分ごとに切り分け、その頭と切り分けた各部分と脂肪を焼いて煙に上らせた。
