source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: ja
  text: 今日行われたとおりのことを行い、あなたがたのために贖いをするよう、ヤハウェは命じられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: …とおりに
  rationale: 前節までに行われた儀式と、主が命じた行為とを対応させる比較表現として、自然な日本語にした。
- source_word: עָשָׂה
  choice: 行われた
  rationale: 形態上は三人称男性単数だが、ここでは直前の儀式を指す主体未特定の表現と理解し、受け身で訳した。
- source_word: בַּיּוֹם הַזֶּה
  choice: 今日
  rationale: 現在執り行われている儀式の日を示す時間表現を、明瞭で自然な現代日本語にした。
- source_word: צִוָּה
  choice: 命じられた
  rationale: 完了形の命令行為を表し、日本語では神への敬意を示す敬語によって訳した。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く認知される神名の伝統的な表記を用い、本文の荘重さと可読性を保った。
- source_word: לַעֲשֹׂת
  choice: 行うことを
  rationale: 先の עָשָׂה との語の反復を「行う」で保ちつつ、命令の内容として自然につないだ。
- source_word: לְכַפֵּר
  choice: 贖いをするよう
  rationale: 祭司的・祭儀的文脈における כפר の意味を保ち、機序を狭く限定しない慣用的な聖書語を用いた。
- source_word: עֲלֵיכֶם
  choice: あなたがたのために
  rationale: כפר と結びつく על を、対象者のため・ behalf を表す自然な日本語で訳した。
theological_decisions:
- issue: 祭儀的文脈における כפר の訳語
  choice: あなたがたのために贖いをする
  alternative: あなたがたのために罪を覆う／あなたがたを清める
  rationale: 「贖い」は祭儀的意味を保ちながら、宥め、償い、清めのいずれか一つに限定しない。「罪を」と補うことも避け、原文の神学的な幅を保持した。
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語の一般読者に明瞭で荘重な慣用表記を採用した。ただし原文は称号ではなく固有の神名である。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祭司任職儀礼の文脈にふさわしい簡潔で荘重な調子とした。原文の二度の עשה は「行われた／行う」と対応させた。
