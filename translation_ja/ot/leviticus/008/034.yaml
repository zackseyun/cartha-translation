  terminology: כפרには、祭儀的用語として広く用いられる「贖いをする」を維持します。これは罪・清め・宥めなどの機序を本文以上に限定しません。יהוהは「ヤハウェ」と音写し、原文が称号でなく神名であることを本文で保ちます。
