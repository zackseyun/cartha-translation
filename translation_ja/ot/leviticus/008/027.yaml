id: LEV.8.27
reference: Leviticus 8:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: ja
  text: モーセは、それらすべてをアロンの手のひらとその息子たちの手のひらに載せた[a]。そして、それらを揺り動かしてささげる供え物として、ヤハウェの前で揺り動かした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「アロンの手のひらの上に、またその息子たちの手のひらの上に置いた」。ここでは、品々を受けるように差し出した手に載せたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 載せた
  rationale: נתןは「与える、置く」の広い意味を持つ。ここでは祭儀の品々を手のひらに置く動作なので、日本語として自然な「載せた」とした。
- source_word: אֶת הַכֹּל
  choice: そのすべてを
  rationale: 前節で集められた複数の部分を残らず指すため、文脈上の指示を含む「そのすべて」とした。
- source_word: עַל כַּפֵּי
  choice: 手のひらに
  rationale: כַּףはここでは手のひらを指し、עַלは字義的には「上に」である。物を受けるように差し出した手に載せる場面を自然な日本語で表した。
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: その息子たちの手のひらに
  rationale: בָּנָיוの男性を指す家族語を具体的に保ち、ヘブライ語で反復される「手のひら」も省略しなかった。
- source_word: וַיָּנֶף אֹתָם תְּנוּפָה
  choice: それらを揺り動かすささげ物として、揺り動かした
  rationale: 動詞נוּףと同根の祭儀用語תְּנוּפָהの反復を保ちつつ、対象がアロンたちではなく手に載せた品々であることを「それら」で明示した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 祭儀が神の臨在のもとで行われることを表す定型句を「前で」とし、神名יהוהは「ヤハウェ」と表記した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名としての性格を明示し、プロジェクトの既定方針に従った。
- issue: בָנָיו の性別を伴う家族語
  choice: その息子たち
  alternative: その子どもたち
  rationale: この祭司任職の文脈ではアロンの男性の子らを具体的に指しているため、原文の性別上の限定を保った。
- issue: תְּנוּפָה の祭儀的意味
  choice: 揺り動かすささげ物
  alternative: 奉献物、振揺のささげ物
  rationale: 祭儀上の提示・奉献という含意を認めつつ、同根動詞との結びつきと実際の動作を読者に見える形で残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。祭儀用語の厳粛さを保ちながら、一般読者にも動作が理解できる表現とした。前文脈で動作主がモーセであるため、日本語では主語を明示した。
