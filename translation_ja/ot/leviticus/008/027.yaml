- from: モーセは、そのすべてをアロンの手のひらと、その息子たちの手のひらに載せた[a]。そして、それらを揺り動かすささげ物として、ヤハウェの前で揺り動かした。
  to: モーセは、それらすべてをアロンの手のひらとその息子たちの手のひらに載せた[a]。そして、それらを揺り動かしてささげる供え物として、ヤハウェの前で揺り動かした。
  rationale: 原文の動詞נוףと同根の祭儀名詞תְּנוּפָהの結び付きを、「揺り動かしてささげる供え物として、…揺り動かした」として保持した。これにより、対象が人ではなく手に載せられた品々であることも「それら」により明瞭にしつつ、不自然な日本語を解消した。脚注はעַלの字義的な「上に」を正確に示すよう補った。
