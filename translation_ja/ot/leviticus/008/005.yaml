id: LEV.8.5
reference: Leviticus 8:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: ja
  text: モーセは会衆に言った。「これは、ヤハウェが行うように命じたことである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ連続法を、日本語では文脈上自然な過去形で表した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: הָעֵדָה
  choice: 会衆
  rationale: 集められたイスラエル共同体を指す語であり、祭儀的文脈にも適する簡潔で定着した表現。
- source_word: זֶה הַדָּבָר
  choice: これは……ことである
  rationale: 指示語と名詞の構造を保ちつつ、現代日本語として不自然な「これは事である」を避けた。
- source_word: צִוָּה
  choice: 命じた
  rationale: すでに与えられ、今実施される命令を表す。日本語では単純過去形でその関係が自然に伝わる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写した。
- source_word: לַעֲשׂוֹת
  choice: 行うように
  rationale: 不定詞の能動形を保ち、行為者を明示しないことで、原文に含まれる非人称的な含みも狭めない表現とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号へ置換せず音写した。
- issue: לַעֲשׂוֹת の行為者
  choice: 「行うように」とし、行為者を補わない
  alternative: 「私たちが行うように」または「行われるように」
  rationale: 原文の不定詞は形の上では能動だが主語を明示していない。日本語でも行為者を補わず、能動と非人称的理解の余地を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀の公的宣言にふさわしい簡潔で品位ある文体とした。
