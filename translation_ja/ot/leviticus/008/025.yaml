base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: ja
  text: それからモーセは、脂肪、脂肪に富む尾、内臓を覆うすべての脂肪、肝臓の付属部分[a]、二つの腎臓とその脂肪、右のももを取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。ヘブライ語は、いけにえをささげる際に切り取られた特定の部位を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: それからモーセは……取った
  rationale: ワウ継続法による物語の進行を自然な現代日本語で示す。主語は直前の文脈からモーセであり、日本語での明瞭さのため補った。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: いけにえにおいて取り分けられる脂肪部を指す標準的な祭儀用語として、簡潔に訳した。
- source_word: הָאַלְיָה
  choice: 脂尾
  rationale: 単なる尾ではなく、羊の脂肪に富む尾を指す祭儀解剖上の語であるため、「脂尾」とした。
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: 内臓を覆うすべての脂肪
  rationale: קֶרֶב はここでは内臓を指す。「上にある」を解剖学的関係が自然に伝わる「覆う」と訳した。
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: 肝臓の付属物
  rationale: 祭儀で切り取られる肝臓に付随する特定部位を指すが、その厳密な同定には幅があるため、特定の肝葉と断定せず原語の形態的意味を保った。
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 数を含め、解剖学的な意味をそのまま明瞭に表した。
- source_word: חֶלְבְּהֶן
  choice: その脂肪
  rationale: 二つの腎臓に付随する脂肪であるという所有関係を保った。
- source_word: שׁוֹק הַיָּמִין
  choice: 右のもも
  rationale: שׁוֹק は祭儀解体における脚の上部を指すため、一般読者にも分かりやすい「もも」とした。
theological_decisions: []
