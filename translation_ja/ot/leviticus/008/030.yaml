  source_fidelity: 原文は、油注ぎ用の油と祭壇上の血の一部を取り、それらをアロン、その衣服、息子たち、そして「彼と共にいる」息子たちの衣服に振りかけた後、同じ対象を聖別したと述べる。草案は主要な行為と列挙を保っているが、אִתּוֹ（「彼と共に」）を二度とも省略している。また「注ぎの油」は現代日本語では油そのものを注ぐ意味にも受け取られやすい。
  naturalness: 「油注ぎ用の油」は祭儀用語として明瞭で、「それらを振りかけた」により油と血の両方が散布対象であることも自然に示せる。「アロンと共にいたその息子たち」は、原文の反復を過度に硬直させずに保持する。
  terminology: מִשְׁחָהは「油注ぎ」とし、קדשׁは人物と衣服の双方に適用できる「聖別した」とする。「息子たち」は男性複数の原文に適合する。
