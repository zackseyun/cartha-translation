revisions:
- from: モーセは、注ぎの油と、祭壇の上にあった血を少し取り、アロンとその衣服、その息子たちと彼らの衣服に振りかけた。こうして彼は、アロンとその衣服、その息子たちと彼らの衣服を聖別した。
  to: モーセは、油注ぎ用の油と祭壇の上にあった血を少し取り、それらをアロン、その衣服、アロンと共にいたその息子たち、またその衣服に振りかけた。こうして彼は、アロン、その衣服、アロンと共にいたその息子たち、またその衣服を聖別した。
  rationale: 原文の二つのמִןが示す部分性を「少し取り」で保ち、油と血の双方を「それらを」で受けた。草案で省かれていたאִתּוֹを、先行詞であるアロンを明示して二度再現した。「油注ぎ用の油」は原語の祭儀的意味を明瞭な現代日本語で表す。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:38:29Z'
