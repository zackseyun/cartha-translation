  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: ja
  text: モーセは、油注ぎ用の油と祭壇の上にあった血を少し取り、それらをアロン、その衣服、アロンと共にいたその息子たち、またその衣服に振りかけた。こうして彼は、アロン、その衣服、アロンと共にいたその息子たち、またその衣服を聖別した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: 注ぎの油と…血を少し取り
  rationale: 動詞は「取る」で、二つの物質に付く מִן はその一部を取ったことを示すため、「少し」を補って自然な日本語にした。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 祭司を任職する儀礼で用いる油を指す。「油注ぎの油」より自然で、祭儀的意味も保つ。
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 祭壇の上にあった血
  rationale: 関係節と עַל の位置関係を明確に保った。
- source_word: וַיַּז
  choice: 振りかけた
  rationale: 祭儀における液体の散布を表す נזה のヒフィルとして、明瞭で自然な表現を選んだ。
- source_word: בְּגָדָיו
  choice: その衣服
  rationale: 一般的な「服」よりも祭儀の格調を保ちつつ、「祭服」と限定しすぎない。
- source_word: בָּנָיו
  choice: その息子たち
  rationale: 男性複数で、祭司職に任じられるアロンの息子たちを具体的に指す。
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: 彼らの衣服
  rationale: 「彼と共に」は息子たちがアロンと共に儀礼を受けていることを文脈がすでに示すため、重い直訳を避けた。ただし対象である息子たちの衣服は明記した。
- source_word: וַיְקַדֵּשׁ
  choice: 聖別した
  rationale: קדשׁ の「聖なるものとして取り分ける」という意味を、祭司任職の文脈に即して簡潔に表す。
theological_decisions:
- issue: 祭司任職の文脈における קדשׁ の訳
  choice: 聖別した
  alternative: 聖なるものとした／奉献した
  rationale: 人物だけでなく衣服も対象であるため、「任職した」では狭すぎる。「聖別した」は、神聖な務めのために取り分ける意味を保ち、後代の教理を持ち込まない。
- issue: アロンの子孫を表す性別語
  choice: その息子たち
  alternative: その子どもたち
  rationale: 原文は男性複数であり、ここでは祭司として任じられるアロンの男子を指すため。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある叙述とした。列挙では原文の対象をすべて保持しつつ、日本語で不自然になる「彼と共に」の反復は文脈に織り込んだ。
