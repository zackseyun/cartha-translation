  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: ja
  text: アロンとその息子たちは、ヤハウェがモーセを通して命じたすべてのことを行った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「モーセの手によって」。これは「モーセを通して」または「仲介者であるモーセによって」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: עשהはここで、命じられた儀式を従順に実行したことを総括する。現代日本語として自然で、原文の簡潔な叙述を保つ。
- source_word: אַהֲרֹן וּבָנָיו
  choice: アロンとその子ら
  rationale: 祭司職に任じられたアロンの息子たちを指す。「子どもたち」より文脈上正確であり、複数形も示す。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: ことを、すべて
  rationale: דבריםは「言葉」「事柄」「こと」を意味し得るが、ここでは命令された一連の行為を指す。「ことを、すべて」は原文の包括性を保ちつつ自然である。
- source_word: צִוָּה
  choice: 命じた
  rationale: 完了形の命令行為を簡潔に表す。日本語では文脈により、命令が実行に先立つことが十分明確である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語音写で固有名として示す。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセを通して
  rationale: 字義は「モーセの手によって」だが、ここではモーセを仲介者として命令が伝えられたことを示す慣用句である。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく神名四文字を用いているため、固有名として音写し、本文上の区別を保つ。
- issue: בְּיַד מֹשֶׁה におけるモーセの役割
  choice: モーセを通して
  alternative: モーセの手によって
  rationale: 神が命令の主体で、モーセがそれを伝える媒介者であるという原文の慣用的意味を、過度な神学的説明を加えず明瞭に示す。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。「その子ら」は祭司文脈にふさわしい簡明な表現とし、命令された内容の包括性を語順と読点で明確にした。
