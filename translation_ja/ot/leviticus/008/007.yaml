source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: ja
  text: 彼に長服を着せ、彼の腰に帯を締め、上着を着せ、エフォドを着けた。さらに、エフォドの巧みに織られた帯[a]を彼の腰に締め、それでエフォドを彼の体に固定した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エフォドの飾り帯」または「エフォドの腰帯」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここのヘブライ語の動詞は、エフォドに付属する織り帯で、エフォドをアロンの体に固定したことを表すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: 長服
  rationale: 祭司が内側に着る基本的な衣を指す。現代日本語で衣服として理解でき、祭司の装束を表す語としても定着している。
- source_word: אַבְנֵט
  choice: 帯
  rationale: 腰に巻く布製の帯を表す。簡潔で自然な現代日本語であり、祭司装束にも適する。
- source_word: מְעִיל
  choice: 上着
  rationale: 長服の上に着る衣であることを、過度に形状を限定せず明瞭に示す。
- source_word: אֵפֹד
  choice: エフォド
  rationale: 正確に対応する日本語がない特殊な祭司装束なので、専門的名称を音写して保持する。
- source_word: חֵשֶׁב הָאֵפֹד
  choice: エフォドの巧みに織った帯
  rationale: エフォドに付属してそれを留める織り帯を指す。語義には『飾り帯』『腰帯』の可能性もあるため脚注に示す。
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: 彼に帯を締め
  rationale: חגר の腰に巻いて締める動作を、自然な現代日本語で表す。
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: それでエフォドを彼の体に固定した
  rationale: אֵפֹד から派生したまれな動詞と、帯を受ける בּוֹ の関係を明確にし、帯によってエフォドを装着した動作を表す。
- source_word: וַיִּתֵּן עָלָיו
  choice: 彼に……を着けた
  rationale: 衣服を人の上に置くというヘブライ語の慣用表現を、装着の文脈に即した自然な日本語にする。
theological_decisions:
- issue: 祭司装束の専門用語の訳し方
  choice: 一般的な衣類名は日本語に訳し、אֵפֹד は「エフォド」と音写する
  alternative: אֵפֹד を「前掛け状の祭服」などと説明的に訳す
  rationale: 形状を一つに断定せず、祭儀上の固有性を保ちながら、文全体は現代の読者に分かりやすくするため。
- issue: 最後の動詞が表す装着動作
  choice: 帯でエフォドを体に固定したと明示する
  alternative: 「それで彼にエフォドを着けた」など、原語の語形をより逐語的に反映する
  rationale: このまれな派生動詞には解釈上の難しさがあるが、文脈上は付属の帯によってエフォドを装着・固定する動作を指す可能性が高い。断定の根拠は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。連続する着衣動作を簡潔に示しつつ、原文にない固有名を本文へ補わず、代名詞の指示関係を維持した。技術的な祭司装束名「エフォド」は音写した。
