revisions:
- from: 彼に長服を着せ、帯を締め、上着を着せ、エフォドを着けた。それから、エフォドの巧みに織った帯[a]を彼に締め、それでエフォドを彼の体に固定した[b]。
  to: 彼に長服を着せ、彼の腰に帯を締め、上着を着せ、エフォドを着けた。さらに、エフォドの巧みに織られた帯[a]を彼の腰に締め、それでエフォドを彼の体に固定した[b]。
  rationale: 帯を締める対象を「彼の腰に」と明示し、原文で繰り返される対格の対象を日本語でも曖昧なく反映した。装束名、着衣の順序、最後の帯によるエフォドの固定という原文の関係は保持した。脚注のアンカーはそれぞれ語彙上の代替訳と最後の稀な動詞の説明に適切に対応している。
