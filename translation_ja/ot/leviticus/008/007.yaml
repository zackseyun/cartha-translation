    issue: 二つの「帯を締め」で、帯を締められる人物が文法上明示されていない。
    rationale: ヘブライ語はいずれも目的語『彼を』を伴う。日本語で目的人物を補わない場合、特に「彼に長服を着せ、帯を締め」は主語自身が帯を締めたとの読みも生じうる。『彼の腰に』を補えば、原文の着衣行為の対象を明瞭にできる。
  - severity: low
