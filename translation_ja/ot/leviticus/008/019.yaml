  yaml_path: translation/ot/leviticus/008/019.yaml
  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: ja
  text: アロンはそれを屠り、モーセはその血を祭壇の周囲に振りかけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その血を祭壇の四方に打ちかけた」。ヘブライ語の動詞は、犠牲の血を勢いをつけて祭壇に施すことを表し、軽く振りまくことではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: それを屠り
  rationale: שׁחטは祭儀の文脈で動物を屠殺することを表す。「それ」は直前の文脈にある犠牲の動物を受ける。
- source_word: וַיִּזְרֹק
  choice: 浴びせかけた
  rationale: זרקは犠牲の血を祭壇に勢いを伴って施す動作を表す。「振りかけた」よりも軽い散布を連想しにくく、現代日本語としても自然である。
- source_word: הַדָּם
  choice: その血
  rationale: 定冠詞付きの「血」。日本語では直前に屠った動物とのつながりを明確にするため「その血」とした。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲祭儀におけるמזבחの標準的な訳語。
- source_word: סָבִיב
  choice: 周囲に
  rationale: 血が祭壇の一面だけでなく、その周りの各面に施されたことを簡潔に表す。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着している人名表記。
