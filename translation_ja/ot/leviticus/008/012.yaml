  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: ja
  text: それからモーセは、聖別の油の一部をアロンの頭に注ぎ、彼に油を注いで彼を聖別した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 注いだ
  rationale: יצקは液体を「注ぐ」ことを表す。現代日本語として自然で、原文の動作を簡潔に伝える。
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油を
  rationale: מִןには部分を示す用法があり、油の一部を用いたことが含意されるが、日本語では数量を不自然に明示せずとも文脈上理解できる。「注ぎの油」は、任職のために人へ注ぐ特別な油を指す表現として明瞭である。
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: アロンの頭に
  rationale: 位置関係をそのまま自然な現代日本語で表した。
- source_word: וַיִּמְשַׁח
  choice: 油を注いだ
  rationale: משׁחは儀礼的に油を塗る、または注ぐ行為を表す。この場面では直前の「頭に注ぐ」という具体的動作に即しつつ、任職の儀礼的意味も保つ。
- source_word: לְקַדְּשׁוֹ
  choice: 彼を聖別するために
  rationale: קדשׁの使役的な意味を、祭司として神聖な務めのために取り分けることを示す「聖別する」で表した。
- source_word: וַ
  choice: それから
  rationale: 物語を進める接続辞の順次性を、自然な日本語で示した。
theological_decisions:
- issue: 祭司任職の文脈における קדשׁ の訳
  choice: 彼を聖別するために
  alternative: 彼を聖なる者とするために／彼を聖なる務めのために取り分けるために
  rationale: 原文はアロンが祭司の務めのために儀礼的に取り分けられることを述べる。「聖別」はこの祭儀的意味を簡潔に保ち、特定教派の後代的教義を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は目的語の反復を保って原文の構造を示す。「油を注いだ」の反復は、יצקとמשׁחの関連しつつ異なる二つの動詞を日本語で理解しやすく表現するために採用した。
