id: LEV.8.33
reference: Leviticus 8:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: ja
  text: あなたがたは、あなたがたの任職の期間が満了する日まで、すなわち七日間、会見の天幕の入り口から外に出てはならない。あなたがたを任職させるには七日を要するからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「あなたがたの手を満たす」。祭司職に就かせることを表すヘブライ語の慣用句。
    reason: 原語の祭司任職に関する慣用表現と、その字義を示すため。
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: 入り口から
  rationale: פֶּתַחの空間的意味を明確に保ち、接続詞וּは日本語の流れに合わせて独立には訳さない。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 「会見」のやや儀礼的な響きを保ちつつ、語構成をたどれる標準的な聖所名称とした。
- source_word: לֹא תֵצְאוּ
  choice: 外に出てはならない
  rationale: 否定命令の拘束力を、現代日本語の明瞭で厳粛な表現で示す。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間／七日かけて
  rationale: 最初は退出禁止の期間、二度目は任職が行われる期間を表すため、それぞれ自然な日本語にした。
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: あなたがたの任職の日々が満ちる日まで
  rationale: מלאの「満ちる」という反復を残しながら、מִלֻּאִיםの祭司任職という専門的意味を明示する。
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: あなたがたを任職させる
  rationale: 直訳「あなたがたの手を満たす」は現代日本語では意味が伝わりにくいため、祭司職への任命・就任を表すヘブライ語慣用句の意味を本文に置き、直訳を脚注で示す。三人称単数の主語は原文でもこの節だけでは名指しされないため、日本語でも補わない。
theological_decisions:
- issue: 祭司任職を表す慣用句 מלא את־יד の訳し方
  choice: 本文では「任職させる」と意味を訳し、脚注で字義を示す。
  alternative: 「あなたがたの手を満たす」と直訳する。
  rationale: 儀礼上重要なヘブライ語表現は脚注で見えるようにしつつ、本文は一般読者が誤解なく理解できる日本語とする。
- issue: יְמַלֵּאの三人称単数主語
  choice: 日本語では主語を明示しない。
  alternative: 文脈から「モーセは」と補う。
  rationale: 原文は動詞の形で単数男性主語を示すが、この節では名を明記しない。自然な日本語の主語省略によって、その指示関係を断定せずに保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀的な文脈にふさわしい厳粛さを保った。「任職」は一般語よりやや専門的だが、祭司職への正式な就任を簡潔かつ正確に表せる。原文の長い一文は、意味関係を明確にするため三文に分けた。
