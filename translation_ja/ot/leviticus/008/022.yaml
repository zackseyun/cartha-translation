base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ja
  text: 次にモーセは、第二の雄羊、任職式の雄羊[a]を差し出した。アロンとその子らは、その雄羊の頭に手を置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖別の雄羊」。ヘブライ語の表現は、祭司をその務めに就かせる儀礼を指す専門語。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 次にモーセは……連れて来た
  rationale: 使役形の「近くに来させる、差し出す」を祭儀の文脈に即して自然な日本語にした。主語モーセは直前の文脈から補った。接続形は物語の進行を示す「次に」で表した。
- source_word: הָאַיִל הַשֵּׁנִי
  choice: 二頭目の雄羊
  rationale: 序数 הַשֵּׁנִי を明確に「二頭目」とし、犠牲動物を数える自然な助数表現を用いた。
- source_word: אֵיל הַמִּלֻּאִים
  choice: 任職の雄羊
  rationale: מִלֻּאִים は字義的には「満たすこと」に関係するが、ここでは祭司職への就任儀礼を指す専門語である。「任職」はその職務への就任を簡潔に伝える。
- source_word: וַיִּסְמְכוּ
  choice: 手を置いた
  rationale: 犠牲に手を置く祭儀的行為を、現代日本語で明瞭かつ慣用的に表した。原語には押す・寄りかかる含意もあり得るが、本文では過度に具体化しない。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: ヘブライ語は複数形だが、日本語では複数の主体について「手を置いた」とするのが自然であり、各人が手を置いた意味も保たれる。
- source_word: עַל רֹאשׁ הָאָיִל
  choice: その雄羊の頭に
  rationale: 前置詞句を自然な日本語の位置関係として直接表現した。
- source_word: אַהֲרֹן וּבָנָיו
  choice: アロンとその子ら
  rationale: 祭司として任職されるアロンの息子たちを指すため、「子どもたち」ではなく、簡潔で格調ある「子ら」とした。
theological_decisions:
- issue: 祭司任職儀礼の専門語 מִלֻּאִים の訳し方
  choice: 任職
  alternative: 聖別、祭司任命
  rationale: レビ記8章ではアロンとその子らを祭司職に就かせる儀礼を指す。「任職」は就任の側面を明確にする一方、「聖別」も儀礼的な取り分けを強調する妥当な訳であるため、脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀本文にふさわしい簡潔で品位ある調子とした。「モーセ」は原文の動詞に明示されないが、直前から続く主語を日本語で明確にするため補った。脚注記号[a]は該当する専門語の直後に置いた。
