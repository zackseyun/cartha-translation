  source_fidelity: 原文は、モーセがアロンの頭に祭司用のターバンを置き、その前面に金の札、すなわち聖なる冠を取り付けたことを述べる。「ターバン」「正面」「金の札」「聖なる冠」、およびヤハウェの神名の保持は原文と英語監査記録に適合している。
  naturalness: 「彼はその頭に」は、直前の文脈を知らない読者には指示対象がやや不自然で、主語自身の頭であるようにも読める。モーセが別の人物（文脈上アロン）に装束を着ける場面なので、「彼の頭に」とするほうが自然で明確である。また、「聖なる冠」は物の正式名称ではなく金の札を説明する同格句であるため、引用符は外すのが自然である。
  terminology: 「ターバン」は祭司のかぶり物 מִצְנֶפֶת の明確な現代語訳として適切である。「金の札」はこの文脈の צִיץ に適合し、「聖なる冠」は נֵזֶר הַקֹּדֶשׁ の同格的説明を保つ。ヤハウェもテトラグラマトンの音写として一貫している。
