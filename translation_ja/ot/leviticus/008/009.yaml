source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼は彼の頭にターバンをかぶせ、ターバンの正面に金の札、すなわち聖なる冠を取り付けた。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: ターバン
  rationale: 祭司特有の、布を巻いた形のかぶり物を指す。現代日本語で形状を明確に伝えられる語を選んだ。
- source_word: אֶל מוּל פָּנָיו
  choice: ターバンの正面に
  rationale: 直訳的な「彼の顔の前に」ではなく、金の札を取り付ける位置、すなわちターバンの前面を示す慣用表現として訳した。
- source_word: צִיץ הַזָּהָב
  choice: 金の札
  rationale: צִיץには「花」「花形の飾り」の意味もあるが、祭司装束の文脈では文字を刻んでターバンに付ける金製の板状装飾を指すため、「金の札」とした。
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: 「聖なる冠」
  rationale: 金の札を言い換えて聖別された祭司の標章として示す同格表現。原語の「聖」と「冠」を保ちつつ、別訳の余地は注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で一般的な音写により表した。
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: かぶせ……取り付けた
  rationale: 同じ動詞の反復だが、前者はかぶり物を頭に載せる動作、後者は札をターバンに装着する動作なので、それぞれ自然な日本語に訳し分けた。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 行為が神の命令と一致していたことを明確に表す完結した日本語とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を用いているため、称号「主」ではなく神名を音写し、原文上の区別を保持した。
- issue: נֵזֶר הַקֹּדֶשׁ と金の札との関係
  choice: 同格の説明として「すなわち『聖なる冠』」
  alternative: 別個の装具として「聖なる冠とともに」
  rationale: ヘブライ語では「金の札」に続く同格句と読むのが自然であり、二つの別個の装具とはしなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。動作主と対象は直前の文脈で明らかなため、原文どおり固有名を補わず「彼」「その頭」とした。
