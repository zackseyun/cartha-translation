base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: ja
  text: 彼はその油の一部を祭壇に七回振りかけ[a]、祭壇とそのすべての祭具、洗盤とその台に油を塗って、これらを聖別した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「それから」または「その中から」。文脈上、塗油の油を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז מִמֶּנּוּ
  choice: 彼はその油を……振りかけ
  rationale: נזהのヒフィル形は祭儀において液体を振りかける行為を表す。מִמֶּנּוּは直訳では「それから」だが、文脈上は塗油の油を指すため、自然な日本語として「その油を」とした。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: いけにえを献げる祭儀的設備を表す標準的な訳語。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七回
  rationale: 反復された祭儀行為の回数をそのまま示す。
- source_word: וַיִּמְשַׁח
  choice: 油を注いで
  rationale: משׁחは聖別のために油を用いる行為を表す。現代日本語で理解しやすく、祭儀的意味も保つ表現とした。
- source_word: כָּל כֵּלָיו
  choice: そのすべての祭具
  rationale: כְּלִיは器具・用具を広く指す。ここでは祭壇に属する聖所の用具なので「祭具」が簡潔で自然。
- source_word: הַכִּיֹּר
  choice: 洗盤
  rationale: 幕屋の庭で洗い清めに用いる水盤を指す。単なる「鉢」より用途と祭儀的性格が明確になる。
- source_word: כַּנּוֹ
  choice: その台
  rationale: 洗盤を支える構造物を指すため、平明な「台」とした。
- source_word: לְקַדְּשָׁם
  choice: これらを聖別した
  rationale: קדשׁのピエル形は、これらの物を聖なる用途のために取り分けることを表す。「聖別する」は祭儀的意味を保つ標準的な日本語。
theological_decisions:
- issue: 祭具と祭儀行為に関する用語
  choice: 「油を注ぐ」「聖別する」という読みやすい祭儀用語を用いる
  alternative: 「油を塗る」「聖なるものとする」など、より説明的に訳す
  rationale: 後代の教派的意味を持ち込まず、幕屋の器物を神聖な用途のために取り分けるという本文の祭儀的意味を保持するため。
- issue: לְקַדְּשָׁםの統語上の働き
  choice: 一連の塗油行為の目的・結果として「これらを聖別した」と訳す
  alternative: 「これらを聖別するためであった」と目的を明示する
  rationale: ヘブライ語の不定詞は目的を示しうるが、日本語では動作の結果を含む述語として表すほうが自然であり、意味も損なわない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「洗盤」「祭具」「聖別」はレビ記の祭儀的文脈を保つために用いた。文中の対象列挙は原文の構造を維持しつつ、日本語として自然になるよう「また」を補った。
