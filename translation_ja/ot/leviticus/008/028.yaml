  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ja
  text: モーセはそれらを彼らの手のひらから取り、祭壇で、全焼のささげ物の上に焼いて煙にした。これらは、主に喜ばれる香りとなる任職のささげ物[a]、すなわち主への火によるささげ物[b]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別のささげ物」とも訳せる。ヘブライ語では、祭司を職に就ける儀式に用いられる専門語。文字どおりには「満たすこと」で、「手を満たす」という任職の表現に由来する。
    reason: lexical_alternative
  - marker: b
    text: 祭儀上の専門語で、「火でささげる供え物」の意。「主への食物としてのささげ物」と理解する説もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... אֹתָם
  choice: それらを……取り
  rationale: 前節でアロンとその子らの手に載せられた部分を受ける代名詞を保ち、לקחの通常の物語的意味を自然な日本語で表した。
- source_word: מֵעַל כַּפֵּיהֶם
  choice: 彼らの手のひらから
  rationale: כַּףの具体的な意味「手のひら」を保った。儀式で品物が手の上に載せられていた状況にも合う。
- source_word: וַיַּקְטֵר הַמִּזְבֵּחָה
  choice: 祭壇で焼き、煙にした
  rationale: 祭儀的文脈におけるקטרのヒフィル形は、供え物を焼いて煙として立ち上らせることを表す。「焼いた」だけでなく「煙にした」を添えて動詞の祭儀的含意を示した。
- source_word: עַל הָעֹלָה
  choice: 全焼のささげ物の上に置いて
  rationale: עַלの基本義「上に」を保つため、「そばに」ではなく、すでにある全焼のささげ物の上に載せて焼く動作として自然な日本語にした。
- source_word: מִלֻּאִים
  choice: 任職のささげ物
  rationale: 祭司を職に就ける儀式に用いられる専門語であり、語源的には「手を満たすこと」に関係する。後代の特定教派の聖職制度を持ち込まず、この文脈での機能を明確にした。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 芳ばしい香りとなる
  rationale: 祭儀における神の受容を表す定型句を、過度に説明せず、明瞭で格調ある現代日本語にした。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭司文書の専門的な供犠用語を、火でささげるものという中心的意味が伝わる形で訳した。「食物のささげ物」と限定するより、語の曖昧さを保つ。
- source_word: לַיהוָה
  choice: 主への
  rationale: 神名יהוהを、日本語聖書で明瞭かつ尊厳ある慣用表現「主」によって示した。
theological_decisions:
- issue: מִלֻּאִיםの祭司任職儀礼上の意味
  choice: 任職のささげ物
  alternative: 聖別のささげ物
  rationale: この語はアロンとその子らを祭司職に就ける儀式に固有の用語である。「任職」は具体的な儀礼機能を示し、「聖別」よりも文脈を明確にするが、別訳も脚注に残した。
- issue: אִשֶּׁהの訳し方
  choice: 火によるささげ物
  alternative: 主への食物としてのささげ物
  rationale: 語は火で焼かれる祭儀的供え物を指すが、「食物」という理解を本文に固定すると祭壇への供え物という比喩的側面を過度に具体化しうる。そのため本文では形式と機能を直接表す訳を採用した。
- issue: לְרֵיחַ נִיחֹחַに含まれる神の受容の表現
  choice: 芳ばしい香りとなる
  alternative: 心を和らげる香りとなる
  rationale: 原文の定型句が持つ受容・喜悦の含意を保ちつつ、神についての生理的または機械的な理解を説明として付け加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀本文にふさわしい落ち着いた格調を保った。「焼き、煙にした」により具体的な祭儀動作を示し、専門語には短い脚注を付した。本文中の脚注記号は、それぞれが説明する「任職のささげ物」と「火によるささげ物」の直後に置いた。
