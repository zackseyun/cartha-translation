  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: ja
  text: 彼がそれを屠り、モーセはその血をいくらか取り、アロンの右の耳たぶ[a]と、右手の親指と、右足の親指につけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「右耳の先」。
    reason: תְּנוּךְ が指す耳の部位には、「耳たぶ」のほか「耳の先」という理解もあり得るため。
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: 彼がそれを屠ると
  rationale: 祭儀における動物の屠殺を表すため、「殺す」よりも文脈に即した「屠る」を用いた。目的語の「それ」は直前の文脈から補った。後続動作との自然なつながりを示すため、連続する動詞を「〜と」で結んだ。
- source_word: מִדָּמוֹ
  choice: その血をいくらか
  rationale: 前置詞 מִן の部分を表す用法を反映し、血の全量ではなく一部を取ったことが明確になるようにした。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳たぶ[a]
  rationale: 祭司任職の儀式で血をつける耳の外側の部分を、現代日本語で最も自然な「耳たぶ」とした。ただし語の厳密な部位には不確かさがあるため、別訳を脚注に示した。
- source_word: הַיְמָנִית
  choice: 右の／右手の／右足の
  rationale: 各身体部位が右側であることを、日本語として自然な連体表現で示した。
- source_word: בֹּהֶן יָדוֹ
  choice: 右手の親指
  rationale: 手についての בֹּהֶן は親指を指すため、簡潔で正確な現代日本語とした。
- source_word: בֹּהֶן רַגְלוֹ
  choice: 右足の親指
  rationale: 足についての בֹּהֶן は足の第一趾を指す。「足の親指」は一般読者に明快で自然な表現である。
- source_word: וַיִּתֵּן עַל
  choice: につけた
  rationale: 血を身体の各部位に置く祭儀動作を、過度に専門的にせず自然に表した。
theological_decisions:
- issue: 犠牲の血をアロンの身体の末端部につける儀式
  choice: 象徴的意味を本文に付加せず、行為そのものを描写する
  alternative: 聖別や祭司任職の象徴的意味を本文中で明示する
  rationale: ヘブライ語本文は儀式の行為を記述しているが、その象徴的意味をこの節で説明してはいないため、翻訳本文には解釈を織り込まなかった。
translation_notes:
  register: 明快で品位ある現代標準日本語を用いた。「屠る」は祭儀的文脈の正確さを保ちつつ、一般読者にも理解できる表現である。身体部位は「右の耳たぶ」「右手の親指」「右足の親指」と自然にそろえた。
