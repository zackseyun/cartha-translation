base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: ja
  text: アロンとその息子たちを共に連れて行きなさい。また、衣服、油注ぎのための油、罪のいけにえの雄牛[a]、二匹の雄羊、種なしパンのかごを取りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえの雄牛」。ヘブライ語の語は、罪に関わるいけにえを指すと同時に、儀礼的な清めに関わるいけにえを指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: 連れて来なさい／持って来なさい
  rationale: 単数男性への命令形。目的語に人と物の両方が並ぶため、日本語では自然さを保ちながら、人には「連れて来なさい」、物には「持って来なさい」と訳し分けた。文脈上求められる招集・搬入の動きも明確になる。
- source_word: אַהֲרֹן
  choice: アロン
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: בָּנָיו אִתּוֹ
  choice: 彼とともにその息子たち
  rationale: אִתּוֹ（彼とともに）を省略せず、代名詞がアロンを指すことを保った。
- source_word: הַבְּגָדִים
  choice: 衣服
  rationale: 語そのものは一般的な「衣服」を意味する。祭司の装束であることは文脈から分かるため、本文では過度に専門化しない表現とした。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 直訳的には「油注ぎの油」。儀礼的な意味を保ちつつ、簡潔で聖書本文にふさわしい日本語とした。
- source_word: פַּר הַחַטָּאת
  choice: 罪のいけにえの雄牛
  rationale: פַּרは「雄牛」。חַטָּאתはここでは供え物を指すため「罪のいけにえ」としたが、清めに関わる祭儀的側面もあり得るので脚注に示した。
- source_word: שְׁנֵי הָאֵילִים
  choice: 二匹の雄羊
  rationale: 数詞と名詞をそのまま明瞭に訳した。
- source_word: סַל הַמַּצּוֹת
  choice: 種なしパンのかご
  rationale: מַצּוֹתはパンや菓子の形状をこの節だけでは限定しないため、包括的で分かりやすい「種なしパン」とした。
theological_decisions:
- issue: 祭儀的文脈における חַטָּאת の訳語
  choice: 罪のいけにえ
  alternative: 清めのいけにえ
  rationale: この語は罪に関わる供え物を指す一方、儀礼的な清めの機能を前面に出して理解することもできる。本文では伝統的で認知度の高い訳語を採り、もう一つの妥当な理解を脚注に残して、意味の幅を一方的に解消しないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀本文にふさわしい簡潔で端正な命令文とした。ヘブライ語では一つの命令動詞が人と物の列挙全体を支配するが、日本語では目的語に応じて「連れて来る」と「持って来る」に分けた。脚注記号は該当する「罪のいけにえの雄牛」の直後に置いた。
