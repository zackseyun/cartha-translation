  to: アロンとその息子たちを共に連れて行きなさい。また、衣服、油注ぎのための油、罪のいけにえの雄牛[a]、二匹の雄羊、種なしパンのかごを取りなさい。
  rationale: アロンと息子たちの同行を自然な日本語で表し、油注ぎに関する祭儀用語を明瞭化した。罪のいけにえに関する本文と脚注の意味の幅、列挙された物品、脚注アンカーはいずれも維持した。
