  terminology: 「ヤハウェ」は原文の神名を適切に反映する。「雄やぎ」はשָׂעִירの性別を明示する許容される訳である。「罪のきよめのささげ物」はחטאתの祭儀的用法を、特定教派の術語に固定せず明示できている。
