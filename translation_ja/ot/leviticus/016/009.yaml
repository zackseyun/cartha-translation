source:
  edition: WLC
  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: ja
  text: アロンは、ヤハウェのためのくじが当たった雄やぎを差し出し、罪のきよめのささげ物とする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 差し出し
  rationale: 祭儀のために近くへ連れて来て、御前に提示する意味を表す。後半で犠牲の種類が明示されるため、ここでは「ささげ」より「差し出し」が適切。
- source_word: הַשָּׂעִיר
  choice: 雄やぎ
  rationale: שָׂעִירはこの祭儀的文脈で雄のやぎを指すため、性別を明示した。
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: くじが…当たった
  rationale: 直訳的には「その上にくじが上った」だが、日本語の自然なくじ引きの表現で割り当ての意味を保った。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 前置詞לによる指定を「ために」で表し、神名יהוהは固有名として音写した。
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: 罪のきよめのささげ物とする
  rationale: 祭儀用語חַטָּאתは、単なる「罪」ではなく罪や汚れを除くための供え物を指す。「罪のきよめのささげ物」は機能を明確にしつつ、後代の教派的含意を避ける。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の契約名יהוהが明記されているため、称号に置き換えず「ヤハウェ」と音写した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のきよめのささげ物
  alternative: 罪祭／罪のためのいけにえ
  rationale: この語は罪だけでなく祭儀上の汚れを除く機能も持つため、「罪祭」より分かりやすく、その浄化機能を表す訳を採用した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある祭儀文体。「雄やぎ」で原語の具体性を示し、「差し出す」と「ささげ物とする」を分けて儀礼の二段階を保った。
