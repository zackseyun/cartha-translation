revisions:
- from: 彼が聖所で贖いを行うために会見の天幕に入ってから出て来るまで、だれも会見の天幕の中にいてはならない。彼は、自分のため、自分の家族のため、またイスラエルの全会衆のために贖いを行う。
  to: 彼が聖所に入り、そこで贖いを行ってから出て来るまで、だれも会見の天幕の中にいてはならない。彼は、自分のため、自分の家の者たちのため、またイスラエルの全会衆のために贖いを行う。
  rationale: 「聖所で贖いを行う」という原文の場所句を明確に保ちつつ、立入禁止の場所である「会見の天幕」と混同しない構文に改めた。また、祭司のבֵּיתוֹを核家族に限定しないよう「家の者たち」とした。贖いの対象、禁止の包括性、時間範囲は維持している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:21:08Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭の禁止と贖いの対象三者は適切に保持されている。ただし、原文の「彼が入って、聖所で贖いを行う」は、会見の天幕内に人がいないことを命じる句とは区別される。現行の「会見の天幕に入って」は、彼が入る先を会見の天幕そのものと明示しており、原文の『聖所で』との関係をやや不明瞭にしている。
  naturalness: 全体として明瞭で自然な現代標準日本語である。「聖所に入り、そこで贖いを行ってから出て来るまで」とすることで、場所と時間範囲がより読み取りやすくなる。
  terminology: 「会見の天幕」「聖所」「贖い」「全会衆」は祭儀文脈にふさわしく、一貫している。「家族」は理解しやすいが、בֵּיתוֹの『家・家の者（household）』をより過不足なく表すため、「家の者たち」とする。
  issues:
  - severity: medium
    issue: 入る先の表現が原文の構文関係をやや曖昧にしている
    rationale: 現行の「会見の天幕に入って」は、原文の『聖所で贖いを行うために入る』を、会見の天幕へ入ることとして限定して読める。本文は、だれも会見の天幕内にいない間に、彼が聖所で贖いを行うことを述べるため、両者を区別して訳すのが安全である。
  - severity: low
    issue: 「自分の家族」がבֵּיתוֹの範囲を狭めうる
    rationale: בֵּיתは家・家の者、すなわち家族に限られない家内・家の共同体を指しうる。「自分の家の者たち」は現代日本語として自然で、原語の幅を保つ。
  revised_text: 彼が聖所に入り、そこで贖いを行ってから出て来るまで、だれも会見の天幕の中にいてはならない。彼は、自分のため、自分の家の者たちのため、またイスラエルの全会衆のために贖いを行う。
  revised_footnotes: []
