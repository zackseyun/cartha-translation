source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: ja
  text: 彼が聖所に入り、そこで贖いを行ってから出て来るまで、だれも会見の天幕の中にいてはならない。彼は、自分のため、自分の家の者たちのため、またイスラエルの全会衆のために贖いを行う。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל־אָדָם לֹא יִהְיֶה
  choice: だれも…いてはならない
  rationale: ヘブライ語の「すべての人が…ない」は、全面的な禁止を表す自然な現代日本語にした。אָדָםはここでは性別の強調より、祭司を除く一切の人を指す。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 幕屋内の特定の聖所施設を指す定着した表現であり、「会見」という名称の意味も保持する。
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: 贖いを行う
  rationale: כפרの祭儀的意味を保ち、単に「赦す」などと解釈的に限定しない。
- source_word: בַּקֹּדֶשׁ
  choice: 聖所で
  rationale: 前置詞בを場所として自然に訳した。文脈上、至聖所を含む聖域での贖いの務めを指すが、原文の語を過度に限定しない。
- source_word: בֵּיתוֹ
  choice: 自分の家族
  rationale: 字義的には「彼の家」だが、ここでは祭司の家に属する人々を指すため、現代日本語では「家族」が明瞭。
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: イスラエルの全会衆
  rationale: קהלの共同体的・礼拝共同体的な含意を「会衆」で保持した。
theological_decisions:
- issue: 贖いの対象と祭司の役割
  choice: 「自分のため、自分の家族のため、またイスラエルの全会衆のため」と原文の三対象を並列に保持
  alternative: 祭司自身の罪、祭司の家、民の罪などを補足して明示する
  rationale: 原文は対象を挙げるのみで、各対象について「罪」を明示していないため、神学的説明を本文へ加えなかった。
- issue: 天幕内への立入禁止の主体
  choice: 「だれも」と包括的に訳す
  alternative: 「男はだれも」
  rationale: אָדָםはこの禁止において一般的な人を表す。日本語で「男」とすると、女性だけは在室できるという不要な含意を生じうる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「贖い」はレビ記の祭儀用語として一貫性を優先し、「贖いを行う」と動作性を示した。原文の長い一文は内容上のまとまりを保ちつつ、日本語として読みやすい二文にした。
