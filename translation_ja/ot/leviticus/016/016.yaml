id: LEV.16.16
reference: Leviticus 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: ja
  text: こうして彼は、イスラエルの民の汚れの数々と、彼らの背き、すなわちそのすべての罪のゆえに、聖所[a]のために贖いを行う[b]。彼らの汚れのただ中にあって彼らと共に住む会見の天幕のためにも、同じように行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる場所」とも訳せる。ヘブライ語は、この祭儀の文脈では聖所全体、または聖なる区域を指し得る。
    reason: lexical_alternative
  - marker: b
    text: ここで「贖いを行う」は、「清める」または「汚れを除く」とも表現できる。この儀式は罪と汚れの双方に対処する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: 贖いを行う
  rationale: レビ記の祭儀的文脈における כפר の包括的な意味を保つ。ここでは罪への贖いだけでなく、汚れから聖所を清める働きも含まれるため、その点を脚注で補った。
- source_word: עַל הַקֹּדֶשׁ
  choice: 聖所のために
  rationale: הַקֹּדֶשׁ は抽象的な「聖」ではなく祭儀上の聖なる場所を指す。「聖所」は自然で簡潔だが、「聖なる場所」という語義上の可能性も脚注に示した。
- source_word: מִטֻּמְאֹת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民のさまざまな汚れのゆえに
  rationale: מִן はここでは贖いを必要とする原因を示す。טֻמְאֹת の複数形を、不自然な「汚れども」とせず「さまざまな汚れ」で表した。בְּנֵי יִשְׂרָאֵל は民族共同体全体を指すため、現代日本語で明瞭な「イスラエルの民」とした。
- source_word: וּמִפִּשְׁעֵיהֶם לְכָל חַטֹּאתָם
  choice: 彼らのあらゆる罪における背きのゆえに
  rationale: פשע の反抗を伴う強い含意を「背き」で保ち、לְכָל חַטֹּאתָם をその背きが関わる罪の全体として訳した。חטאות は並行する語から「罪」と解するのが自然であり、「罪のいけにえ」とはしなかった。
- source_word: וְכֵן יַעֲשֶׂה לְאֹהֶל מוֹעֵד
  choice: 会見の天幕のためにも、同じように行う
  rationale: 対応する祭儀を次の対象にも施すという手順上の意味を、簡潔で自然な日本語で表した。אֹהֶל מוֹעֵד は語の構成が見える慣用的な「会見の天幕」とした。
- source_word: הַשֹּׁכֵן אִתָּם בְּתוֹךְ טֻמְאֹתָם
  choice: 彼らの汚れのただ中にあって、彼らと共に住む
  rationale: 分詞 הַשֹּׁכֵן が会見の天幕を修飾する構造と、汚れの中にも聖所が置かれているという空間的・神学的緊張を保った。
theological_decisions:
- issue: 贖罪日の文脈における כפר の意味
  choice: 本文では「贖いを行う」とし、脚注で「清める」という側面を示す
  alternative: 「清める」または「汚れを除く」と訳す
  rationale: この祭儀は罪への贖いと、汚れによって影響を受けた聖所の清めの双方に関わる。本文で一方だけに限定せず、祭儀用語の広がりを保った。
- issue: 会見の天幕が「彼らと共に住む」という表現の理解
  choice: 文法どおり会見の天幕を修飾する表現として訳す
  alternative: 天幕を通して神が民の間に住まわれることを明示する
  rationale: 神の臨在が暗示される可能性はあるが、原文の直接の文法上の主語は会見の天幕である。解釈を本文に補わず、原文の擬人的表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀本文にふさわしい簡潔で厳かな調子を保った。「贖い」「聖所」「会見の天幕」は文脈上必要な宗教語として残し、過度に古風な言い回しは避けた。
