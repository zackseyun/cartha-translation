id: LEV.16.1
reference: Leviticus 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: ja
  text: アロンの二人の息子がヤハウェの前に近づいて死んだ後、ヤハウェはモーセに語られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らがヤハウェの前に近づいた時」とも訳せる。ヘブライ語は、より直訳的には「彼らがヤハウェの前に近づく際に」。
    reason: בְּקָרְבָתָםの時間的・状況的な構文上の幅を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語られた
  rationale: 神の発話を導入する標準的な物語表現として、自然さと荘重さを保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: אַחֲרֵי מוֹת
  choice: 死んだ後
  rationale: 直訳的な「死の後」より現代日本語として自然で、二人の死という出来事の後であることを明確に表す。
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: アロンの二人の息子
  rationale: 属格関係と人数を過不足なく自然な日本語で示す。
- source_word: בְּקָרְבָתָם
  choice: 近づいて
  rationale: 前置詞בを伴う不定詞構文の時間的・状況的意味を保ちつつ、קרבの祭儀的含意を説明しすぎない。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 空間的意味と祭儀的な御前という含みの双方を保持する透明な訳。
- source_word: וַיָּמֻתוּ
  choice: 死んだ
  rationale: ヘブライ語の簡潔な叙述を保ち、因果関係を本文以上に強めない。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文の固有名を称号で代替せず、音写によって明示する。
- issue: 息子たちの接近と死の関係
  choice: 「近づいて死んだ」と並列的に訳す
  alternative: 「近づいたため死んだ」
  rationale: 原文は出来事を連続して述べるが、ここだけで因果を明示する接続表現はないため、その緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発話には「語られた」と敬意を示す表現を採用した。原文の簡潔さと語順上の焦点をおおむね保ち、接近と死の因果関係は補わなかった。
