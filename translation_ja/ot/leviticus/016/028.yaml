id: LEV.16.28
reference: Leviticus 16:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: ja
  text: それらを焼く者は、自分の衣服を洗い、水で体[a]を洗わなければならない。その後、宿営に入ることができる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉」。ここでは洗う対象としての「体」全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その後、宿営に入る」。ヘブライ語の動詞は単純な後続行為とも読めるが、ここでは清めの後に再び入ることが許される意味と考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף אֹתָם
  choice: それらを焼く者
  rationale: 定冠詞を伴う分詞を名詞的に訳し、前節の雄牛と雄やぎ、より直接にはその残骸を焼く役の者を指す表現とした。「それら」は文脈上の指示対象を限定しすぎずに保つ。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 自分の衣服を洗い
  rationale: 未完了形の規定的な力を文全体の「なければならない」で表した。בְּגָדִים は現代日本語で自然かつ儀礼的文脈にも適する「衣服」とした。
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: 水で体を洗わなければならない
  rationale: בָּשָׂר の字義は「肉」だが、身体を水で洗う定型表現では全身を指すため「体」とした。日本語では手段を表す「水で」が自然である。
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 清めの行為に続く時間的順序を簡潔に示す。
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: 宿営に入ることができる
  rationale: בוא と אֶל は宿営内への再入場を表す。文脈上、洗浄後に再入場が認められるという儀礼的な許可を自然な日本語で示した。
theological_decisions:
- issue: 末尾の未完了形 יָבֹא の儀礼的効力
  choice: 宿営に入ることができる
  alternative: 宿営に入る
  rationale: 単純な未来・後続行為とも読めるが、前節から続く儀礼的汚れと洗浄の順序では、清めの後に再入場が許されるという意味が有力である。別の読みは脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いつつ、律法の規定としての厳粛さを保った。「服」よりやや格調のある「衣服」、「キャンプ」ではなく共同体の区画を表す「宿営」を採用した。
