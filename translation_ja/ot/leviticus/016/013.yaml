  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: ja
  text: 彼はヤハウェの前で香を火の上に置く。すると、香の雲が証しの上にある贖いの蓋[a]を覆い、彼は死なない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恵みの座」。ヘブライ語は契約の箱の蓋を指し、特に贖罪の儀式に関わる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: 置く
  rationale: 接続詞を伴う完了形だが、祭儀手順を指示する文脈なので、現代日本語の手順文として自然な非過去形で表した。
- source_word: הַקְּטֹרֶת
  choice: 香
  rationale: 聖所の儀式で用いる香を指す。簡潔で定着した訳語を採用した。
- source_word: עַל הָאֵשׁ
  choice: 火の上に
  rationale: 香を燃えている火または炭火の上に置くという空間関係を、原文に即して表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在における祭儀上の近接を表すとともに、神名を音写した。
- source_word: עֲנַן הַקְּטֹרֶת
  choice: 香の雲
  rationale: 構成語句の比喩的な像を簡潔に保ち、香から生じる煙の雲であることを自然に伝えた。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱の蓋であり、贖罪儀礼において特別な役割を持つ物を指すため、物体としての『蓋』と祭儀的機能の双方を示した。
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: 証しの上にある
  rationale: עֵדוּת の指示対象を説明的に限定せず、幕屋文脈の用語としての曖昧さを保った。
- source_word: וְלֹא יָמוּת
  choice: 彼が死ぬことのないためである
  rationale: 香の雲が蓋を覆うことの目的または保護的結果を明確にしつつ、原文の祭儀的警告を保った。
theological_decisions:
- issue: הַכַּפֹּרֶת の訳し方
  choice: 贖いの蓋
  alternative: 恵みの座
  rationale: 語が契約の箱の蓋を指し、贖罪儀礼と結び付くことを明確にするため。伝統的な『恵みの座』は脚注に残し、本文では具体的な物体を誤解しにくい表現を選んだ。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号に置き換えず、一般的な学術的音写によって示した。
- issue: וְכִסָּה と וְלֹא יָמוּת の論理関係
  choice: 目的または意図された結果として表現
  alternative: 単純な出来事の連続として表現
  rationale: 文脈上、香の雲が蓋を覆うことは祭司が死なないための規定である。ただし目的と結果の境界を過度に限定しない表現にした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀規定にふさわしい簡潔で荘重な調子を保った。「証し」は原語の含意を説明しすぎないために維持し、「贖いの蓋」には伝統的別訳を脚注で示した。
