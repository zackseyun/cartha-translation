  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: ja
  text: その雄やぎは、彼らのすべての咎を身に負って、隔絶した地[a]へ運んで行く。任命された者は、その雄やぎを荒れ野に送り出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人里離れた地」「近づきにくい地」「荒れ果てた地」。ヘブライ語はおそらく、人の住む所から切り離された、孤立した場所を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: 運んで行く
  rationale: נשאの「担う、運ぶ」という具体的な像を保ちつつ、目的地を示す表現と自然につなげた。直前の「身に負って」と合わせ、咎を負担し共同体の外へ運び去る儀礼的動作を明確にする。
- source_word: הַשָּׂעִיר
  choice: そのやぎ
  rationale: שָׂעִירは雄やぎを指し得るが、この文脈では既出の特定のやぎであることが重要であり、日本語では「そのやぎ」が簡潔で自然である。
- source_word: עָלָיו
  choice: 身に
  rationale: 前置詞עַלと代名詞が表す「その上に」を、日本語で動物自身が咎を負う像として自然な「身に」で表した。
- source_word: כָּל עֲוֺנֹתָם
  choice: 彼らのすべての咎
  rationale: עָוֹןは罪、不義、またその結果としての責任や咎を含み得る。「咎」は道徳的・儀礼的重みを保ちつつ、ここで曖昧さを狭めすぎない。
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: 隔絶した地
  rationale: 難語גְּזֵרָהの「切り離された、隔てられた」という中核的な含意を、現代日本語で明瞭かつ簡潔に表す。居住地から離れた場所という趣旨を保ち、他の可能な訳は脚注に示す。
- source_word: וְשִׁלַּח
  choice: 放つ
  rationale: שׁלחはここで、やぎを荒れ野へ送り出し、去らせる行為を表す。「放つ」は拘束を解いて送り出す儀礼的動作を簡潔に伝える。
- source_word: בַּמִּדְבָּר
  choice: 荒れ野に
  rationale: מִדְבָּרは砂漠だけでなく、人里離れた未耕地や荒野を指す。「荒れ野」は聖書文脈にふさわしく、意味範囲も比較的よく保つ。
theological_decisions:
- issue: やぎが民の咎を負うという儀礼的表象
  choice: 「彼らのすべての咎を身に負って」と具体的に訳す。
  alternative: 「彼らの罪を取り除いて」のように結果を説明する意訳。
  rationale: 本文は、咎がやぎの上に置かれ、やぎがそれを運ぶという具体的な像を描く。その像を保持し、後代の教理的解釈を本文へ持ち込まない。
- issue: אֶרֶץ גְּזֵרָהの意味
  choice: 「隔絶した地」と訳す。
  alternative: 「人里離れた地」「近づき難い地」「荒れ果てた地」。
  rationale: 語義には不確かさがあるため、「切り離された、孤立した」という核を主本文に残し、特定の地理的・神学的理解に限定しない。
- issue: וְשִׁלַּחの主語
  choice: 直前の文脈で任命された人物を受けて「その人は」とする。
  alternative: 日本語で主語を省略し、「そのやぎを荒れ野に放つ」とする。
  rationale: ヘブライ語の三人称男性単数の主語は文脈上、前節の任命された人を指す。「その人は」と補うことで、日本語でやぎが自らを放つとの誤読を防ぐが、個人名や役職を本文に付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀本文にふさわしい簡潔で荘重な調子を保った。「咎」「荒れ野」は一般読者にも理解可能で、原文の道徳的・空間的な重みを伝える語として採用した。
