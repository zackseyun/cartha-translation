id: LEV.16.7
reference: Leviticus 16:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ja
  text: そして彼は二匹の雄やぎを取り、会見の幕屋の入り口で、ヤハウェの前に立たせる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: そして彼は…取り
  rationale: 祭儀の手順を順次述べる接続形として、前後との連続性を保つ「そして…取り」とした。日本語では文末の「立たせる」が指示の力を担う。
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: 二匹の雄やぎ
  rationale: שָׂעִירはここでは雄のやぎを指すため、性別を明示しつつ自然な現代日本語とした。
- source_word: וְהֶעֱמִיד אֹתָם
  choice: 立たせる
  rationale: עמדのヒフィル形が持つ「立たせる、立つように置く」という具体的な動作を保持した。「供える」では祭儀的解釈を加えすぎるため避けた。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵיの空間的・関係的意味「前に／御前に」を直接表し、神名יהוהは音写した。
- source_word: פֶּתַח
  choice: 入り口で
  rationale: 場所を示す語として自然な「入り口」を用い、文脈上の位置関係を「で」で表した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の幕屋
  rationale: 神と会うための天幕という名称を保つ、日本語聖書で理解されやすい表現を採用した。恒久的建築物を思わせる語は避けた。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を明記していることを保持するため「ヤハウェ」とした。称号の「主」への置換や別系統の音写は採用しない。
- issue: 「ヤハウェの前に」と入り口との関係
  choice: 会見の幕屋の入り口で、ヤハウェの前に立たせる
  alternative: ヤハウェの前、会見の幕屋の入り口に立たせる
  rationale: 原文の二つの場所表現をともに保ち、雄やぎを入り口に置くことがヤハウェの御前に置くことでもあるという関係を、過度に説明せず示した。
translation_notes:
  register: 明瞭で荘重さのある現代標準日本語。祭儀規定として簡潔にし、動作の具体性を保った。代名詞「彼」は文脈上アロンを指すが、この一節だけで固有名に置き換えず、原文の照応を維持した。
