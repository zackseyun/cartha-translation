  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: ja
  text: 父に代わって祭司として仕えるために油を注がれ、任職された[a]祭司が、贖いを行う。その祭司は、亜麻布の、聖なる衣服を着る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義どおりには「彼の手が満たされた」。祭司職に任じられたことを表す慣用句。
    reason: 原文の任職慣用句を示すため。
lexical_decisions:
- source_word: וְכִפֶּר
  choice: 贖いを行う
  rationale: 祭司による規定の儀礼を通して贖いをなすことを表す。機序を過度に限定せず、祭儀的な意味を保つ。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 文脈上は大祭司の後継者を指すが、原文自体は「祭司」とし、続く句でその資格を説明しているため、「大祭司」と補わない。
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: 油を注がれ
  rationale: 祭司職への聖別を示す油注ぎであり、日本語では受動表現が自然である。
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת־יָדוֹ
  choice: 任職された[a]
  rationale: 字義どおりには「その手を満たされた」だが、祭司職に就かせる慣用句であるため、本文では意味を明確にし、直訳を脚注に示す。
- source_word: לְכַהֵן
  choice: 祭司として仕えるために
  rationale: 祭司の職務を果たすことを表す目的句として、自然で明瞭な日本語にした。
- source_word: תַּחַת אָבִיו
  choice: 父に代わって
  rationale: 父の職を継いでその地位に就くという、職務上の交代・継承を表す。
- source_word: וְלָבַשׁ
  choice: 着る
  rationale: 儀式に際して衣服を身に着ける行為を簡潔に表す。
- source_word: בִּגְדֵי הַבָּד
  choice: 亜麻布の衣服
  rationale: 祭司の衣服の素材であるבדを、現代日本語で明確な「亜麻布」とした。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 聖なる衣服
  rationale: 直前の亜麻布の衣服を同格的に説明し、それが聖別された衣服であることを示す。
theological_decisions:
- issue: הַכֹּהֵןを「祭司」とするか「大祭司」とするか
  choice: 祭司
  alternative: 大祭司
  rationale: レビ記16章の文脈では大祭司の後継者だが、原文は称号として「大祭司」とは言わず、油注ぎ、任職、父の後継という説明で特定している。その表現を保持する。
- issue: 「手を満たす」という任職の慣用句の訳し方
  choice: 任職された
  alternative: その手を満たされた
  rationale: 字義訳は現代の一般読者には意味が伝わりにくいため本文では慣用的意味を示し、原文の比喩は脚注で保存する。
- issue: בִּגְדֵי הַבָּדとבִּגְדֵי הַקֹּדֶשׁの関係
  choice: 聖なる衣服である亜麻布の衣服
  alternative: 亜麻布の衣服、聖なる衣服
  rationale: 二つを別種の衣服と誤解させず、後者が前者を同格で説明する関係を明示する。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀法規にふさわしい簡潔で格調ある文体とした。「大祭司」は文脈上の理解にとどめ、原文の「祭司」を保持した。
