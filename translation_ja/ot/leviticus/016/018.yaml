  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: ja
  text: それから彼は、ヤハウェの前にある祭壇へ出て行き、その祭壇のために贖いの儀式を行う[a]。雄牛の血と雄やぎの血をそれぞれ取り、祭壇の角すべてに塗る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その祭壇を清める」。ここで「贖いの儀式を行う」と訳したヘブライ語動詞は、祭司の儀礼では汚れを除いて清める意味を含むことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: それから彼は…出て行き
  rationale: 儀式の手順を続ける接続表現として「それから」を用い、内側の聖所から祭壇へ向かう動きも保った。
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: ヤハウェの前にある祭壇
  rationale: לִפְנֵיを自然に「前に」と訳し、神名יהוהは称号に置き換えず「ヤハウェ」とした。
- source_word: וְכִפֶּר עָלָיו
  choice: その祭壇のために贖いを行う
  rationale: כפרの祭司儀礼上の広い意味と神学的重みを保つため「贖いを行う」とし、接尾辞の指示対象を明確にした。清めの意味合いは脚注に示した。
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: 雄牛の血と雄やぎの血をそれぞれ取り
  rationale: 反復されるמִןの部分を取る意味を日本語の「それぞれ」で表した。שָׂעִירは性別を含むため「雄やぎ」とした。
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の角の周囲に塗る
  rationale: 血を角に付ける儀礼動作としてנתןを自然な日本語の「塗る」で表し、סָבִיבは「周囲に」とした。
theological_decisions:
- issue: 祭司儀礼におけるכפרの訳語
  choice: 贖いを行う
  alternative: 清める
  rationale: 祭壇に向けられた儀礼であることを保ちつつ、כפרを浄化だけに狭めないため、本文では伝統的かつ理解可能な「贖い」を用いた。祭司文書では清めの含意もあり、その genuine ambiguity を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀文としての厳粛さを保った。「すなわち」は、後半の採血と塗布が贖いの具体的動作であることを自然に示す。
