base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: ja
  text: これは、あなたがたにとって完全な安息日である。あなたがたは身を慎まなければならない[a]。これは永久の定めである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「自らを苦しめなければならない」。伝統的には、断食や自己節制を含むと理解されてきた。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全な安息の安息日
  rationale: 「安息日」という律法上の定着した名称を保ちつつ、同語根を重ねた強意表現を「完全な安息」で明確に示した。
- source_word: הִיא לָכֶם
  choice: これは、あなたがたのための……である
  rationale: 共同体に向けられた述語的表現を、自然な現代日本語で再現した。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: あなたがたは自らを低くしなければならない
  rationale: 直訳的な「自分の魂を苦しめる」を避け、悔い改めと自己否定を含むヘブライ語の再帰的慣用表現を自然に訳した。断食に限定せず、語義の幅を保った。
- source_word: חֻקַּת עוֹלָם
  choice: 永久の定め
  rationale: 継続的な効力を表す律法上の定型句として、簡潔で格調のある日本語を選んだ。
theological_decisions:
- issue: 贖罪日に命じられる自己卑下の意味
  choice: 本文では「自らを低くしなければならない」と広く訳す。
  alternative: 「自らを苦しめなければならない」または「断食しなければならない」
  rationale: ヘブライ語は断食を直接表す動詞ではなく、ענהとנפשׁによる広い慣用表現である。伝統的には断食や自己節制を含むと理解されるが、本文で断食だけに限定せず、別訳と伝統的理解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔さと品位を保った。「安息日」「永久の定め」は聖書の祭儀・法的文脈を伝える定着した表現として用いた。
