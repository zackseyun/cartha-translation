revisions:
- from: これは、あなたがたにとって永遠の掟となる。第七の月、その月の十日に、あなたがたは自らを低くし[a]、いかなる仕事もしてはならない。この国に生まれた者も、あなたがたの間に寄留している者も同様である。
  to: これは、あなたがたにとって永続する定めとなる。第七の月の十日には、土地生まれの者も、あなたがたの間に寄留する者も、身を戒め[a]、いかなる仕事もしてはならない。
  rationale: 自己否定を求めるヘブライ語の慣用表現を、現代日本語として自然でありつつ、単なる謙遜に狭めない「身を戒め」に改めた。あわせて、日付表現と土地生まれの者・寄留者への適用の構文を整えた。意味の不確定性や断食という伝統的解釈は脚注で保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:21:18Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は全体としてヘブライ語の法的命令文をよく反映している。ただし「自らを低くし」は日本語では謙遜の態度を主に表し、ענה את־נפשותיכם の自己抑制・自己否定を伴う儀礼的命令としては弱く、やや意味がずれる。「身を戒め」とすることで、断食だけに限定せずに自己否定・克己の幅を保てる。
  naturalness: 「第七の月、その月の十日に」より「第七の月の十日には」のほうが現代日本語として自然である。また、禁止命令の後に「…も同様である」と置く構文より、土地生まれの者と寄留者の双方を命令の主語として前置するほうが明瞭である。
  terminology: חֻקַּת עוֹלָם は「永続する定め」として、継続的な法規という語義を自然に表す。「土地生まれの者」は האזרח を現代国家の概念に寄せずに表し、「寄留する者」は הגר הגר を適切に表す。
  issues:
  - severity: medium
    issue: 「自らを低くし」
    rationale: 日本語では主に謙遜・へりくだりを指し、原語の自己を苦しめる／戒めるという命令の意味領域を十分に伝えない。
  - severity: low
    issue: 命令対象を示す文の構成
    rationale: 末尾の「…も同様である」は意味は通るが、原文が土地生まれの者と寄留者の双方に命令を適用する構造を、命令文内に明示するほうが自然で明確である。
  revised_text: これは、あなたがたにとって永続する定めとなる。第七の月の十日には、土地生まれの者も、あなたがたの間に寄留する者も、身を戒め[a]、いかなる仕事もしてはならない。
