source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: ja
  text: これは、あなたがたにとって永続する定めとなる。第七の月の十日には、土地生まれの者も、あなたがたの間に寄留する者も、身を戒め[a]、いかなる仕事もしてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「自分自身を苦しめる」。この表現は伝統的に断食を含むと理解されてきた。
    reason: 字義的な別訳を示し、本文の「身を戒め」が断食だけに限定されないことを保ちながら、伝統的理解を補足するため。
lexical_decisions:
- source_word: וְהָיְתָה
  choice: これは……となる
  rationale: 直前までの規定を指す法的な定型表現として、主語を「これ」と補い、自然な現代日本語にした。
- source_word: לְחֻקַּת עוֹלָם
  choice: 永遠の掟
  rationale: חֻקָּהの法的な規定という意味と、עוֹלָםが表す継続的・恒久的な効力を簡潔に保った。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 第七の月、その月の十日に
  rationale: ヘブライ語の暦日表現を明確にしつつ、月名を補わず原文の言い方を保った。
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: 自らを低くし
  rationale: この句が表す自己卑下・自己否定の広がりを保ち、断食だけに限定しなかった。より字義的な訳と伝統的理解は脚注に示した。
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: いかなる仕事もしてはならない
  rationale: מְלָאכָהを通常の仕事・労働として訳し、全面的な禁止を明瞭に表した。
- source_word: הָאֶזְרָח
  choice: この国に生まれた者
  rationale: 共同体に属する土地生まれの者を、現代の政治用語である「市民」に狭めずに表した。
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: あなたがたの間に寄留している者
  rationale: 居住する外来者というגֵּרの法的・社会的含意を「寄留」で保ち、同語根の反復は日本語として自然な形に整えた。
theological_decisions:
- issue: 贖罪日の自己否定命令の意味
  choice: 本文では「自らを低くし」と広く訳す。
  alternative: 「自らを苦しめ」または「断食し」
  rationale: ヘブライ語の句は断食を含み得るが、それだけを明示してはいない。本文では意味の幅を保ち、より字義的な表現と伝統的理解を脚注に置いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「掟」「寄留」は法的・聖書的文脈に必要な語だが、文全体は一般の読者にも理解できる構文とした。脚注記号[a]は該当句の直後に置いた。
