source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: ja
  text: 彼は聖なる場所で水で体[a]を洗い、衣服を着て、外に出て、自分の全焼のささげ物と民の全焼のささげ物を献げ、自分と民のために贖いを行う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「自分の肉」。ここでは体全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「贖いを行う」は「贖いをする」とも訳せる。祭儀の文脈によっては、「清める」という意味合いを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַמַּיִם
  choice: 水を使って体を洗い
  rationale: 祭儀上の一連の指示として訳し、「肉」をこの文脈で自然な「体」とした。בַמַּיִם は日本語として明瞭な「水を使って」とした。
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: 聖なる場所で
  rationale: מָקוֹם に定冠詞がないため、特定の聖所区画を指す「聖所で」と断定せず、原文の非限定的な表現を保った。
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: 衣服を着て
  rationale: 祭儀文にふさわしい簡潔で格調ある表現とした。
- source_word: וְיָצָא
  choice: 外に出る
  rationale: 聖なる場所からの移動を自然かつ明確に表した。
- source_word: וְעָשָׂה אֶת־עֹלָתוֹ וְאֶת־עֹלַת הָעָם
  choice: 自分の全焼のささげ物と民の全焼のささげ物を献げ
  rationale: עָשָׂה はここでは供犠を執行する意味なので「献げる」とした。עֹלָה は現代の読者に祭儀の形が伝わる「全焼のささげ物」とした。
- source_word: וְכִפֶּר בַּעֲדוֹ וּבְעַד הָעָם
  choice: 自分と民のために贖いを行う
  rationale: כפר の祭儀的・神学的広がりを保つ標準的な訳語として「贖いを行う」を用い、בְּעַד の代理・受益の意味を「ために」で表した。
theological_decisions:
- issue: 祭儀文脈における כפר の訳
  choice: 贖いを行う
  alternative: 償いをする／清める
  rationale: 「贖い」は意味を特定の贖罪理論に狭めず、祭儀における罪の処理と関係回復を幅広く表せる。「清める」は一部の目的語や文脈では適切だが、本節では対象が「自分と民」であるため本文には採らなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で格調ある文体とした。連続する完了形は法的手順を示すものとして現在形で統一した。
