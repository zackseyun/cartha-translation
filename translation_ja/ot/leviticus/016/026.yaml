id: LEV.16.26
reference: Leviticus 16:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: ja
  text: アザゼル[a]へ雄やぎを送り出した者は、自分の衣服を洗い、体を水で洗わなければならない。その後、宿営に入ることができる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アザゼルのために」とも訳せる。このヘブライ語の意味については議論があり、固有の名称または呼称とも、除去を表す語、いわゆる「身代わりのやぎ」に関係する表現とも解される。
    reason: 異なる語義と統語的解釈を示し、本文で一つに限定しないため。
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: 送り出した者
  rationale: 定冠詞付き分詞を実質的な名詞として捉え、雄やぎを送り出す役目を担った者を自然な日本語で示した。後続の清めは送り出した後に行うため、文脈に即して完了形とした。
- source_word: הַשָּׂעִיר
  choice: 雄やぎ
  rationale: שָׂעִיר は祭儀文脈で雄のやぎを指すため、その情報を明示した。
- source_word: לַעֲזָאזֵל
  choice: アザゼルへ
  rationale: 語義には議論があるため、固有の名称ないし呼称として音写し、前置詞 ל の方向・関係を「へ」で簡潔に表した。特定の解釈に限定しないよう脚注を付した。
- source_word: יְכַבֵּס בְּגָדָיו
  choice: 自分の衣服を洗い
  rationale: 祭儀上の洗濯を表す定型句を、現代日本語で明瞭かつ自然に訳した。
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: 体を水で洗わなければならない
  rationale: בָּשָׂר の字義は「肉」だが、ここでは人の身体全体を指す。「水で洗う」として手段を自然に示し、二つの未完了形が一続きの祭儀上の義務を表すことを日本語の義務表現にまとめた。
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 清めの後という時間的順序を簡潔に示した。
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: 宿営に入ることができる
  rationale: 洗浄後に再び宿営へ入ることが許されるという祭儀上の順序を表した。「来る」よりも日本語では「入る」が場所への再入場を明瞭にする。
theological_decisions:
- issue: 贖罪日の儀式における לַעֲזָאזֵל の意味
  choice: 固有の名称ないし呼称として「アザゼルへ」と音写する
  alternative: 「除去のために」「身代わりのやぎとして」など、機能を明示して訳す
  rationale: この語の語源と指示対象には古くから議論があり、本文自体は説明していない。音写によって、場所・存在・儀式的な除去を表す語などの可能性を本文で一つに決めず、神学的緊張と曖昧さを保った。
translation_notes:
  register: 律法本文にふさわしい簡潔で端正な現代標準日本語を用いた。義務と、その履行後に許される宿営への再入場を区別した。「アザゼル」は説明的に訳さず音写し、必要な情報を脚注に置いた。
