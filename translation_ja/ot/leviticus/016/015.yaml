language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: ja
  text: それから、民のための罪のいけにえの雄やぎを屠り、その血を垂れ幕の内側に携え入れる。雄牛の血に行ったのと同じように、その血にも行い、その血を贖いのふた[a]の上と、贖いのふたの前に振りかける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖罪所」とも訳される。また、伝統的に「恵みの座」とも訳される。
    reason: כַּפֹּרֶת の主要な異訳と、「mercy seat」に対応する伝統的訳語を示すため。
lexical_decisions:
- source_word: וְשָׁחַט
  choice: それから……屠り
  rationale: 祭儀上の動物の殺害を表すため「屠る」とし、接続詞による手順の進行を自然な日本語の「それから」で示した。
- source_word: שְׂעִיר הַחַטָּאת
  choice: 罪のいけにえの雄やぎ
  rationale: שָׂעִיר が雄のやぎを指すことを明示し、חַטָּאת はこの祭儀文脈で理解しやすい「罪のいけにえ」とした。
- source_word: אֲשֶׁר לָעָם
  choice: 民のための
  rationale: アロンのための雄牛と区別される、民のためにささげる動物であることを簡潔に表した。
- source_word: וְהֵבִיא אֶת־דָּמוֹ אֶל־מִבֵּית לַפָּרֹכֶת
  choice: その血を垂れ幕の内側に携え入れる
  rationale: 幕の向こう側の区域へ血を運び入れるという方向と祭儀的動作を明確にした。
- source_word: וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: その血について、雄牛の血にしたのと同じようにし
  rationale: 原文のやや省略的な表現を保ちつつ、同じ血の儀式を行う意味が伝わる形にした。
- source_word: וְהִזָּה אֹתוֹ
  choice: その血を……振りかける
  rationale: 祭儀用語として נזה の使役形を「振りかける」とし、代名詞の指示対象が血であることを日本語で明示した。
- source_word: הַכַּפֹּרֶת
  choice: 贖いのふた
  rationale: 契約の箱の金のふたを指す語について、物体としての意味と贖いの祭儀との関係の双方が普通の読者に伝わる訳語を採用した。
- source_word: עַל ... וְלִפְנֵי
  choice: ……の上と、……の前に
  rationale: 血を振りかける二つの位置を区別する原文の空間表現をそのまま保った。
theological_decisions:
- issue: כַּפֹּרֶת の訳し方
  choice: 贖いのふた
  alternative: 贖罪所／恵みの座
  rationale: この語が契約の箱のふたを指すことを明確にしながら、贖いの儀式との語義上の結びつきを示した。「恵みの座」だけでは現代の読者に物体としての指示対象が伝わりにくいため、異訳を脚注に残した。
- issue: 同一節内の כַּפֹּרֶת の二度の訳出
  choice: 両方とも「贖いのふた」
  alternative: 一方を「贖いのふた」、他方を「恵みの座」とする
  rationale: 原文では同じ名詞が反復されており、指示対象も同一であるため、訳語を統一して祭儀上の位置関係を明瞭にした。
translation_notes:
  register: 現代の一般読者にも分かる、簡潔で厳かな祭儀規定の文体とした。「屠る」「垂れ幕」「振りかける」はレビ記の儀礼的文脈を保つ語である。原文の長い連鎖は二文に分け、手順を追いやすくした。
