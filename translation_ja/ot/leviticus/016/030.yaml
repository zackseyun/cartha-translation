  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: ja
  text: この日、あなたがたを清めるために、あなたがたのために贖いがなされる[a]。あなたがたは、ヤハウェ[b]の前で、すべての罪から清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼はあなたがたのために贖いをする」。ヘブライ語の動詞は単数形だが、この節では主語が明示されていない。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語はYHWH。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: からである
  rationale: 直前の命令の根拠を示す接続詞として、文末表現で説明の働きを自然に表した。
- source_word: בַיּוֹם הַזֶּה
  choice: この日
  rationale: 指示語の近接性と、贖罪日の儀礼的文脈を保った。
- source_word: יְכַפֵּר
  choice: 贖いがなされる
  rationale: 祭儀用語としてのכפרを「贖い」とし、明示されていない単数の主語を補わないため非人称的な受け身にした。
- source_word: עֲלֵיכֶם
  choice: あなたがたのために
  rationale: כפרとともに、贖いを受ける者・その受益者を示す自然な日本語とした。
- source_word: לְטַהֵר אֶתְכֶם
  choice: あなたがたを清めるため
  rationale: 贖いの目的または結果を表し、祭儀的な清めの意味を明確にした。
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: すべての罪から
  rationale: ここでのחטאתは罪の供え物ではなく、民が清められる対象となる罪を指す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の御前・臨在の意味を簡潔に保ち、固有の神名を音写した。
- source_word: תִּטְהָרוּ
  choice: 清くなる
  rationale: 先のピエル「清める」と区別し、カル形が示す清い状態への到達を表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された契約の神名を固有名として示し、伝統的な代替表記は脚注に残した。
- issue: 祭儀用語 כפר と行為者
  choice: 贖いがなされる
  alternative: 彼が贖いをする
  rationale: 祭儀的な贖いという意味を保ちつつ、ヘブライ語でこの節の行為者が明示されていないことを訳文でも断定しないようにした。
- issue: 清めの行為と結果の区別
  choice: 清めるため／清くなる
  alternative: 清めるため／清められる
  rationale: לְטַהֵר の他動的な清めと、תִּטְהָרוּ が表す清い状態を訳し分け、原文の反復と緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭儀的な語彙には「贖い」「清める」を採用して尊厳ある調子を保った。原文の因果関係、行為者の曖昧さ、および清めの行為と清い状態との区別を維持した。
