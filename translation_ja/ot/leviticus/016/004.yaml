id: LEV.16.4
reference: Leviticus 16:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: ja
  text: 聖なる亜麻布の長衣[a]を着て、亜麻布の下着をその身[b]に着ける。亜麻布の帯を腰に締め、亜麻布のターバンを巻く。これらは聖なる衣である。水で体を洗ってから、これらを身に着ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる」は「神聖な」とも訳せる。ここでは祭司の務めのために取り分けられた衣を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「彼の肉の上に」。後の「体」にも同じヘブライ語が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: 聖なる亜麻布の長衣
  rationale: כְּתֹנֶת は体に着る長い衣を指すため「長衣」とし、בַּד は祭司の衣服という文脈に即して「亜麻布」、קֹדֶשׁ は儀礼のために聖別された性質を表す「聖なる」とした。
- source_word: מִכְנְסֵי בַד
  choice: 亜麻布の下着
  rationale: 腰から腿を覆い、直接身に着ける祭司の衣服を、古風すぎない現代日本語で表した。
- source_word: עַל בְּשָׂרוֹ
  choice: その身に
  rationale: 直訳は「彼の肉の上に」だが、衣服を直接体に着けるという文脈では「その身に」が自然であり、具体的な身体性も保てる。
- source_word: אַבְנֵט בַּד
  choice: 亜麻布の帯
  rationale: 祭司が巻いて締める布製の帯を指すため、明瞭な「帯」とした。
- source_word: יַחְגֹּר
  choice: 腰に締める
  rationale: 自分の周りに帯を巻いて締める動作を、日本語として自然かつ具体的に表した。
- source_word: מִצְנֶפֶת בַּד
  choice: 亜麻布の頭巾
  rationale: 巻いて着用する祭司の頭部の装具を指す。日本語では「ターバン」よりも聖書本文の文体になじみ、形状を限定しすぎない「頭巾」とした。
- source_word: יִצְנֹף
  choice: 頭に巻く
  rationale: 単にかぶるのではなく、巻き付けるという動作を明示した。
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: 聖なる衣
  rationale: 祭司の務めのために取り分けられた衣服という本文の祭儀的意味を、解釈的な象徴を加えずに表した。
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: 水で体を洗う
  rationale: 直訳的な「水で肉を洗う」では不自然なため、儀礼として全身を洗う意味が明瞭な表現とした。
- source_word: וּלְבֵשָׁם
  choice: 洗ってから、これらを身に着ける
  rationale: 接続形による行為の順序を、日本語で自然な「てから」によって示した。「これら」は直前に列挙された聖なる衣を受ける。
theological_decisions:
- issue: 衣服の「聖」の性質
  choice: 「聖なる衣」とし、祭儀のために取り分けられた衣服として訳す
  alternative: 「神聖な衣」
  rationale: 本文が衣服そのものを קֹדֶשׁ と呼ぶ点を保持しつつ、後代の象徴的・教派的意味を付加しないため。
- issue: בָּשָׂר の儀礼的文脈での訳語
  choice: 衣服については「身」、洗浄については「体」とする
  alternative: 両方を直訳して「肉」とする
  rationale: 同じ身体を指す語であることは注で示しながら、日本語で「肉」が帯びうる神学的含意や不自然さを避け、具体的な着衣と洗浄の指示を明確にした。
- issue: 洗浄と着衣の順序
  choice: 「洗ってから、これらを身に着ける」
  alternative: 「洗い、これらを身に着ける」
  rationale: ヘブライ語の連続する動作を自然な日本語で示す。儀礼上の順序を明瞭にするが、本文にない追加の教義的意味は持たせない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「長衣」「帯」「頭巾」は祭司の衣服として理解しやすい語を選び、古語的な命令表現は避けた。反復される「亜麻布」と「聖なる」を保ち、原文の祭儀的な厳粛さを伝えた。
