source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: ja
  text: 彼はその血の一部を指で祭壇に七回振りかけ、イスラエルの人々[c]の汚れから祭壇を清め[a]、聖別する[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「浄める」とも訳せる。ヘブライ語では、儀礼的に清い状態にすることを表す祭司用語。
    reason: lexical_alternative
  - marker: b
    text: 「聖なるものとする」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「イスラエルの子ら」。ここではイスラエルの民全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: 振りかけ
  rationale: ヒフィル形の נזה は祭儀の文脈で血を振りかける行為を表す。「振りかける」は、現代日本語で自然かつ明確な祭儀用語である。
- source_word: עָלָיו
  choice: 祭壇に
  rationale: 代名詞の指示対象は前節の祭壇である。単独の節としても明瞭になるよう、指示対象を本文に明示した。
- source_word: מִן־הַדָּם
  choice: その血を
  rationale: מִן には一部を取り分ける意味があるが、日本語では「血を振りかける」だけで全量ではなく一部を用いることが自然に伝わるため、過剰な説明を避けた。
- source_word: בְּאֶצְבָּעוֹ
  choice: 指で
  rationale: 道具・手段を示す בְּ を、簡潔で自然な日本語の「で」で表した。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七回
  rationale: 祭儀上の具体的な回数をそのまま保持した。
- source_word: וְטִהֲרוֹ
  choice: 祭壇を清め
  rationale: טהר は祭司文書で儀礼的に清い状態にすることを表す。「清める」は日本語聖書の文体にもなじみ、道徳的改善ではなく祭儀的浄化を表現できる。
- source_word: וְקִדְּשׁוֹ
  choice: 聖別する
  rationale: קדש の、聖なるものとして取り分けるという祭儀的意味を明確に表す。「聖別する」は「神聖にする」より簡潔で正確である。
- source_word: מִטֻּמְאֹת
  choice: さまざまな汚れから
  rationale: 複数形を「さまざまな」によって反映し、ここで問題となる複数の儀礼的汚れを示した。「汚れ」は文脈上、身体的な不潔ではなく祭儀的な不浄を指す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義は「イスラエルの子ら」だが、集団を指す定型表現なので、現代日本語で自然な「イスラエルの人々」とした。字義的表現は脚注に残した。
theological_decisions:
- issue: 祭壇に対する清めと聖別
  choice: イスラエルの人々の儀礼的な汚れから祭壇を清め、聖別する
  alternative: 「浄化し、聖なるものとする」
  rationale: この節は祭壇という聖所の器物に対する祭司的儀礼を述べており、人の道徳的改心や内面的刷新を意味しない。二つの動詞を区別して訳し、祭儀上の浄化と聖別を保持した。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの人々
  alternative: イスラエルの子ら
  rationale: ヘブライ語の定型的な集団名称を自然な現代日本語にした。原文の字義的形は脚注で示し、男性だけを指すとの不要な限定を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「祭壇」は原文では代名詞だが、前節の指示対象を明確にするため二度明示した。「清める」「聖別する」は祭儀的意味を保ちつつ、一般読者にも理解できる語を選んだ。
