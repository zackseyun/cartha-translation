revisions:
- from: 罪のきよめのささげ物である雄牛と、罪のきよめのささげ物である雄やぎ、すなわち、聖所で贖いを行うためにその血が運び入れられたものを、彼は宿営の外へ運び出す。そして人々は、その皮と肉と糞を火で焼く。[a]
  to: 罪のためのささげ物である雄牛と、罪のためのささげ物である雄やぎ、すなわち、聖所で贖いを行うためにその血が運び入れられたものを、彼は宿営の外へ運び出す。そして人々は、それらの皮と肉と糞を火で焼く。[a]
