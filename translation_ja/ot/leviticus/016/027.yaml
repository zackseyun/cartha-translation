  edition: WLC
  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: ja
  text: 罪のためのささげ物である雄牛と、罪のためのささげ物である雄やぎ、すなわち、聖所で贖いを行うためにその血が運び入れられたものを、彼は宿営の外へ運び出す。そして人々は、それらの皮と肉と糞を火で焼く。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「彼は……運び出す」という単数形から、「人々は……焼く」という複数形へ移る。
    reason: 原文の主語の数の交替を明示するため。
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: 罪のきよめのささげ物である雄牛／雄やぎ
  rationale: חַטָּאת は罪に関わる犠牲であると同時に清めの機能を持つため、「罪のきよめのささげ物」として両面を簡潔に示した。動物の性別も明示した。
- source_word: הוּבָא אֶת־דָּמָם
  choice: その血が運び入れられた
  rationale: בוא のホファル形の受動と、聖所内への方向性を自然な日本語で保持した。
- source_word: לְכַפֵּר בַּקֹּדֶשׁ
  choice: 聖所で贖いを行うために
  rationale: כפר の祭儀的意味を限定しすぎず、「贖いを行う」とした。בַקֹּדֶשׁ はこの文脈で場所を表す「聖所」と訳した。
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ運び出す
  rationale: ヒフィル形の使役的・他動詞的意味と、אֶל の方向性を「外へ」で自然に表した。
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: そして人々は……火で焼く
  rationale: 複数動詞を不特定複数の主体「人々」で表し、先行する単数主語との数の交替を保持した。
- source_word: עֹרֹתָם וְאֶת בְּשָׂרָם וְאֶת פִּרְשָׁם
  choice: その皮と肉と糞
  rationale: 動物の遺骸についての具体的な列挙を、明瞭で過度に婉曲でない現代日本語にした。
theological_decisions:
- issue: חַטָּאת の祭儀用語
  choice: 罪のきよめのささげ物
  alternative: 罪のためのいけにえ／罪祭
  rationale: 「罪」と「清め」の双方を示し、この祭儀用語を単に処罰代償の意味へ狭めないため。
- issue: כפר の訳語
  choice: 贖いを行う
  alternative: 罪を償う／清める
  rationale: この章における贖罪と清めの緊張を保ち、どちらか一方に意味を限定しないため。
- issue: 単数 יוֹצִיא から複数 וְשָׂרְפוּ への交替
  choice: 「彼は……運び出す。そして人々は……焼く」と保持
  alternative: すべて単数または無主語で統一
  rationale: 執行者と作業に携わる者たちを区別している可能性があるため、原文の数の変化を平準化しなかった。
translation_notes:
  register: 明瞭で現代的ながら、祭儀規定にふさわしい端正な文体。「ささげ物」は平仮名を用いて一般読者への読みやすさを確保し、「聖所」「贖い」は定着した聖書語として保持した。
