    text: 原文は「彼は……運び出す」という単数形から、「人々は……焼く」という複数形へ移る。
    reason: 原文の主語の数の交替を明示するため。
  revision_rationale: 主文のחַטָּאתを、英語監査訳の “sin offering” に対応し、かつ特定の祭儀機能へ意味を限定しない「罪のためのささげ物」に改めた。そのほかは、原文の単数から複数への交替、方向性、祭儀用語、および焼却対象の列挙を保持した。
