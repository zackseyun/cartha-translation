  to: ヤハウェはモーセに言われた。「あなたの兄弟アロンに告げなさい。彼が死ぬことのないよう、いつでも好きな時に、垂れ幕の内側の聖所、箱の上にある贖いの覆い[a]の前に入ってはならない。わたしは雲の中に、贖いの覆いの上に現れるからである。」
  rationale: 神名を「ヤハウェ」に改め、原文の固有名とPOBの神名表記方針を反映した。「すなわち」を削除して、聖所への立ち入りと贖いの覆いの前という原文の場所指示の関係を保った。「雲の中に」は、自己顕現を表す原文の一人称動詞を自然な日本語で維持する。
