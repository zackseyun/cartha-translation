id: LEV.16.2
reference: Leviticus 16:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「あなたの兄弟アロンに告げなさい。彼が死ぬことのないよう、いつでも好きな時に、垂れ幕の内側の聖所、箱の上にある贖いの覆い[a]の前に入ってはならない。わたしは雲の中に、贖いの覆いの上に現れるからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの覆い」は、伝統的に「恵みの座」または「贖罪所」とも訳される。
    reason: 祭儀用語כַּפֹּרֶתの伝統的な別訳を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 日本語の聖書文体で神の固有名を示す慣用的な訳語を用いた。原文が称号ではなく神名であることには留意しつつ、明瞭で自然な現代標準日本語を優先した。
- source_word: דַּבֵּר אֶל
  choice: 告げなさい
  rationale: モーセがアロンへ命令を伝えるよう求められているため、命令の力を自然に表す。
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: いつでも好きな時に…入ってはならない
  rationale: בְכָל עֵתは絶えず入ることではなく、定めを無視した自由な立ち入りを指す。文脈上の制限を明確にした。
- source_word: הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת
  choice: 垂れ幕の内側の聖所
  rationale: 場所を示す語句として、垂れ幕を越えた内側の聖なる区域を簡潔かつ具体的に表した。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの覆い
  rationale: 箱の上の具体的な覆いであることと、贖罪儀礼との結び付きをともに示す。伝統的な別訳は脚注に残した。
- source_word: הָאָרֹן
  choice: 箱
  rationale: 原文は単に『箱』であり、『契約の箱』とは補わない。幕屋の文脈では指示対象が明らかである。
- source_word: וְלֹא יָמוּת
  choice: 彼が死ぬことのないよう
  rationale: 禁止に伴う、避けるべき結果を原文のつながりに沿って表した。
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: わたしは雲の中で…現れるからである
  rationale: כִּיを禁止の理由として訳し、בֶעָנָןは自然な場所・媒介表現として『雲の中で』とした。
theological_decisions:
- issue: כַּפֹּרֶתの祭儀的意味
  choice: 贖いの覆い
  alternative: 恵みの座／贖罪所
  rationale: 物体として箱を覆うものだという具体性と、贖いに関わる祭儀的機能を保つため。『座』と断定して原語の像を狭めず、伝統的表現は脚注で示した。
- issue: בְּכָל עֵתが示す立ち入り制限
  choice: いつでも好きな時に
  alternative: いつでも／常に
  rationale: 禁止されているのは無制限・無許可の立ち入りであり、継続的に入る行為ではないという文脈上の意味を明確にした。
- issue: 神が雲の中で現れるという表現
  choice: 原文どおり神の自己顕現として表現
  alternative: 神の栄光が雲に現れる
  rationale: 原文の一人称動詞『わたしは現れる』を保ち、『栄光』など明記されていない神学的説明を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発言にふさわしい簡潔で荘重な調子を保った。「すなわち」で聖所の位置を自然に説明し、原文にない教派的解釈は加えていない。
