id: LEV.16.21
reference: Leviticus 16:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: ja
  text: アロンは、生きている雄やぎの頭に両手を置き、その上で、イスラエルの子ら[a]のすべての咎と、彼らのすべての背きと、彼らのすべての罪に関して告白する。それらを雄やぎの頭に置き、その役目のために備えられた人[b]の手によって、荒野へ送り出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は、イスラエルの民全体を指す表現。別訳「イスラエル人」「イスラエルの民」。
    reason: 字義的表現と共同体的な意味範囲を示すため。
  - marker: b
    text: この人を表すヘブライ語は解釈が難しく、その役目のために準備されていたこと、任命されていたこと、またはその時に適任であったことを意味し得る。
    reason: 希少語 עִתִּי の語義上の不確かさを保持するため。
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 両手を置き
  rationale: 祭儀において手をいけにえの上に置く行為を表す。圧力の強さを不必要に限定せず、現代日本語として自然にした。
- source_word: הַשָּׂעִיר הַחַי
  choice: 生きている雄やぎ
  rationale: 贖罪日の儀式で生かしておかれた方の雄やぎを明確に示す。
- source_word: וְהִתְוַדָּה עָלָיו
  choice: 雄やぎの上で告白する
  rationale: 告白するという動詞と、雄やぎを前にした祭儀的行為を示す前置詞 עַל を保った。
- source_word: עֲוֺנֹת
  choice: 咎
  rationale: 道徳的な不正と、それに伴う罪責の重みを含み得る語として選び、他の罪語と区別した。
- source_word: פִּשְׁעֵיהֶם
  choice: 背き
  rationale: 規範や契約に対する反逆・違反という語感を伝え、「咎」「罪」と区別した。
- source_word: חַטֹּאתָם
  choice: 彼らのすべての罪
  rationale: 罪一般を表す語として訳し、前二語を包括する列挙の頂点として読める形にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保ちつつ、共同体全体を指す慣用句であることを注で明示した。
- source_word: וְנָתַן אֹתָם
  choice: それらを雄やぎの頭に置き
  rationale: 告白された咎・背き・罪を儀礼的に雄やぎの頭に置くという本文の具体的な比喩を保持した。
- source_word: בְּיַד אִישׁ עִתִּי
  choice: その役目のために備えられた人に託して
  rationale: בְּיַד の委託・媒介の意味を自然な日本語で示した。難解な עִתִּי は、任務への準備・指定を含み得る表現とした。
- source_word: הַמִּדְבָּרָה
  choice: 荒野へ
  rationale: 方向を表す語尾を「へ」で示し、地形を狭く砂漠に限定しない「荒野」を用いた。
theological_decisions:
- issue: 三つの罪語をどう訳し分けるか
  choice: 咎／背き／罪
  alternative: すべてを「罪」に統一する
  rationale: עָוֹן、פֶּשַׁע、חַטָּאת の重なり合いながら異なる語感を保ち、イスラエルの罪の全体性を示す累積的表現を平板化しないため。
- issue: לְכָל חַטֹּאתָם の関係
  choice: 「すなわち彼らのすべての罪」として総括的に訳す
  alternative: 「彼らのすべての罪に関して」と形式的に訳す
  rationale: לְ の厳密な関係には幅があるが、文脈では先行する咎と背きを包括的にまとめる力がある。日本語の明瞭さを優先しつつ、三語の区別は保持した。
- issue: 罪を雄やぎの頭に置くという表現
  choice: 本文の比喩をそのまま「置き」とする
  alternative: 「負わせ」と解釈的に訳す
  rationale: 儀礼的な罪の移行を示唆する一方、原文の具体的な動詞 נתן を解釈で置き換えず、神学的含意を読者に開いたままにするため。
- issue: עִתִּי が表す人の資格
  choice: その役目のために備えられた人
  alternative: 任命された人／用意のできた人／適任の人
  rationale: この希少で難解な語が、任命、準備、時宜への適合のどれを強調するかを断定せず、主要な可能性を本文と注で保持した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で荘重な叙述体とした。祭儀用語を過度に専門化せず、「咎」「背き」「罪」の三語は原文の累積的な響きを保つよう区別した。
