  to: アロンは、生きている雄やぎの頭に両手を置き、その上で、イスラエルの子ら[a]のすべての咎と、彼らのすべての背きと、彼らのすべての罪に関して告白する。それらを雄やぎの頭に置き、その役目のために備えられた人[b]の手によって、荒野へ送り出す。
  rationale: 修正は、告白が雄やぎの上で行われることを日本語の文構造で明示し、原文の行為の順序を整えるためである。また、「すなわち」を「…に関して」に改め、三重の罪語の累積と、前置詞לの解釈上の幅を保持した。その他の訳語と注は、原文と英語監査記録に照らして維持できる。
