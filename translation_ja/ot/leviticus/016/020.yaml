id: LEV.16.20
reference: Leviticus 16:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: ja
  text: こうして、聖所[a]、会見の天幕、祭壇のために贖い[c]を行うことを終えると、生きた雄やぎを前に連れて来る[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」は「聖なる場所」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「近づける」。次の儀式のために前へ連れて来ることをいう。
    reason: lexical_alternative
  - marker: c
    text: 「贖い」は、この文脈では祭儀によって清め、汚れを除くこととも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: 贖いの儀式を終えたなら
  rationale: כלהは行為の完了を表し、前置詞מִןを伴う不定詞כפרは「〜することを終える」という時間的関係を示す。日本語では後続動作との順序が自然に伝わる条件・時の表現とした。
- source_word: מִכַּפֵּר
  choice: 贖いの儀式
  rationale: כפרはレビ記の祭儀における重要語で、贖いに加えて清め・汚れの除去という含意を持ちうる。「贖い」を本文に保ちつつ、「儀式」を添えてここで祭儀的行為を指すことを明確にした。別の理解は脚注に示した。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: この文脈では抽象的な「聖さ」ではなく、聖なる場所・聖域を指す。「聖所」は簡潔で定着した訳語だが、範囲に幅があるため脚注を付した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: אֹהֶל「天幕」とמוֹעֵד「会見・定められた集会」の構成を保ち、現代日本語として理解できる定訳を採用した。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 祭儀用の壇を表す直接的で一般的な訳語。
- source_word: וְהִקְרִיב
  choice: 進み出させる
  rationale: קרבのヒフィルは字義的には「近づける」で、ここでは次の祭儀行為のために生きた雄やぎを前に出すことを表す。「献げる」では屠殺を伴う供犠と誤解されうるため避けた。
- source_word: הַשָּׂעִיר הֶחָי
  choice: 生きている雄やぎ
  rationale: חיはすでに屠られたもう一頭との対照を明示する。「雄やぎ」はשָׂעִירの性別を自然に伝える。
theological_decisions:
- issue: 祭儀文脈におけるכפרの訳し方
  choice: 贖いの儀式
  alternative: 清めの儀式／汚れを除く儀式
  rationale: כפרの祭儀的作用を特定の贖罪理論だけに限定せず、伝統的で広い意味を持つ「贖い」を本文に置いた。同時に、この箇所では聖所・天幕・祭壇が対象なので、清めや汚れの除去という理解も脚注で保存した。
- issue: הַקֹּדֶשׁが指す聖なる空間
  choice: 聖所
  alternative: 至聖所／聖域
  rationale: 語自体は聖なる場所を示すが、その範囲を本文だけで過度に限定しない。「聖所」を採用し、文脈上「至聖所」を指しうることを脚注で示した。
- issue: הקריבが生きた雄やぎに対して表す行為
  choice: 進み出させる
  alternative: 近くに連れて来る／献げる
  rationale: この雄やぎはこの時点で屠られる供え物ではなく、次の儀礼のために提示される。「献げる」に伴いやすい屠殺の含意を避け、原語の「近づける」という方向性を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」で一連の祭儀の完了を受け、「〜たなら」で次の動作との時間的順序を示した。専門的な祭儀語は必要最小限にとどめ、原文の曖昧さは脚注で保持した。
