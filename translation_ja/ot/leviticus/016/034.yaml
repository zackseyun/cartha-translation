source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: ja
  text: これは、あなたがたのための永遠の定めとなる。イスラエルの子ら[a]のすべての罪のために[b]、年に一度、贖いを行うのである。彼は、ヤハウェがモーセに命じたとおりに行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの人々」または「イスラエル人」とも訳せる。
    reason: 定型的民族呼称 בְּנֵי יִשְׂרָאֵל の自然な日本語訳を示すため。
  - marker: b
    text: 「そのすべての罪から清める」とも訳せる。この訳では、罪からの清め・除去という含みが前面に出る。
    reason: מִכָּל חַטֹּאתָם の前置詞 מִן が持ち得る分離・除去のニュアンスを示すため。
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם לְחֻקַּת עוֹלָם
  choice: これは、あなたがたのための永遠の定めとなる
  rationale: 法規を導入する未来表現と、継続して守るべき規定という意味を、現代日本語の荘重で明瞭な言い方で表した。
- source_word: לְכַפֵּר
  choice: 贖いを行う
  rationale: レビ記16章の祭儀的文脈における כפר の専門的・神学的意味を保持する。
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのため
  rationale: עַל の代行・対象の意味を「ため」で示し、定型的民族呼称 בְּנֵי יִשְׂרָאֵל の形も本文に残した。
- source_word: מִכָּל חַטֹּאתָם
  choice: そのすべての罪について
  rationale: 前置詞 מִן が表し得る原因・分離の両面を一方に限定せず、贖いが彼らのすべての罪に関わることを自然な日本語で示した。
- source_word: אַחַת בַּשָּׁנָה
  choice: 年に一度
  rationale: 毎年一回というヘブライ語の慣用表現を自然かつ簡潔に訳した。
- source_word: וַיַּעַשׂ
  choice: 彼は…行った
  rationale: 動詞の単数男性主語を示しつつ、この節自体に明示されていない人物名を補わないことで、原文の含みを保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文に記された神の固有名を音写した。
theological_decisions:
- issue: כפר の祭儀的意味
  choice: 贖いを行う
  alternative: 清めを行う
  rationale: 罪の除去・清めの含意を排除せず、レビ記の祭儀神学で中心的な「贖い」という語を本文に採用した。
- issue: וַיַּעַשׂ の暗黙の主語
  choice: 彼
  alternative: アロン
  rationale: 文脈上はアロンが自然だが、この節では名が明示されていないため、解釈を本文へ補わなかった。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 称号に置き換えず、原文の固有名を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法規にふさわしい簡潔で荘重な調子を保った。「掟」よりも法規として明確な「定め」を採用し、暗黙の主語には固有名を補わなかった。
