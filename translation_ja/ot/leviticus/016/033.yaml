source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: ja
  text: こうして彼は、聖なる聖所[b]、会見の幕屋、祭壇のために贖いを行い[a]、祭司たちと会衆に属するすべての民のために贖いを行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いを行う」は、「贖罪の儀式を行う」とも訳せる。この祭儀的文脈では、ヘブライ語の動詞は儀礼的不浄を取り除くことも含み得る。
    reason: lexical_alternative
  - marker: b
    text: 「聖なる聖所」は、「聖所の聖域」とも訳せる。文脈上「至聖所」を指す可能性もあるが、ヘブライ語の表現はそのように限定して訳さない余地を残す。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: 贖いを行う
  rationale: レビ記の祭儀における専門的な用法と、原文で同じ動詞が聖所・祭壇・祭司・民のすべてに用いられていることを保つ。「清める」だけに狭めず、儀礼的不浄の除去を含み得ることは脚注で示した。
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: 聖なる聖所
  rationale: 「聖所」と「聖なるもの／聖域」を組み合わせたヘブライ語の高い聖性を反映しつつ、「至聖所」と断定して指示範囲を狭めることを避けた。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の幕屋
  rationale: 神と会うための幕屋という名称の意味と、現代日本語の聖書用語としての明瞭さを両立させた。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 祭儀上の対象を自然かつ一貫した日本語で表した。
- source_word: עַל
  choice: 〜のために
  rationale: כפרと結びつく関係を、日本語で自然な「〜のために贖いを行う」とした。
- source_word: הַכֹּהֲנִים
  choice: 祭司たち
  rationale: 複数形を明示し、平明な現代日本語とした。
- source_word: כָּל עַם הַקָּהָל
  choice: 会衆の民すべて
  rationale: 単なる「すべての民」ではなく、集められた共同体に属する民という原文の明示的な表現を保持した。
theological_decisions:
- issue: 聖なる場所・器物と人の双方に用いられる贖いの表現
  choice: すべてに同じ「贖いを行う」を用いる
  alternative: 聖所・幕屋・祭壇には「清める」、祭司と民には「贖いを行う」と訳し分ける
  rationale: 原文はכפרを反復して儀礼全体の統一性を示している。対象ごとに動詞を訳し分けると、原文が明示していない神学的区別を持ち込むおそれがある。
- issue: מִקְדַּשׁ הַקֹּדֶשׁの指示範囲
  choice: 聖なる聖所
  alternative: 至聖所
  rationale: 文脈上、特に神聖な内部空間を指す可能性はあるが、この句自体は「至聖所」に相当する最も明示的な定型句ではないため、指示範囲を断定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「贖い」は祭儀上の重要語として保持し、「会見の幕屋」「祭壇」「祭司」などの定着した語彙を用いた。原文の反復は、日本語として過度に重くならない範囲で維持した。
