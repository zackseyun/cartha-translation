  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: ja
  text: アロンは二頭の雄やぎについてくじを引く。一つのくじは主のため、もう一つのくじはアザゼル[a]のためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一つのくじは放逐のやぎのため」。ヘブライ語「アザゼル」の意味については議論があり、固有名、やぎの役割、または「除き去ること」に関係する語とも理解される。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן ... גּוֹרָלוֹת
  choice: くじを引く
  rationale: 動詞は字義的には「置く／与える」だが、「くじ」と組み合わされた祭儀上の表現であり、現代日本語では「くじを引く」が動作を自然かつ明瞭に伝える。
- source_word: עַל שְׁנֵי הַשְּׂעִירִם
  choice: 二匹の雄やぎのために
  rationale: עַל は字義的には「上に」だが、日本語で「二匹の雄やぎの上にくじを置く」とすると物理的な配置に誤解されやすい。各やぎへの割り当てを表す自然な日本語とした。שָׂעִיר はここでは雄やぎを指す。
- source_word: גּוֹרָל אֶחָד
  choice: 一つのくじ
  rationale: 反復される単数句を素直に訳し、二つの割り当ての対照を保った。
- source_word: לַיהוָה
  choice: 主のため
  rationale: 神名 יהוה は日本語聖書で広く理解される「主」とし、接頭辞 לְ の割り当て・帰属の意味を「のため」で表した。
- source_word: לַעֲזָאזֵל
  choice: アザゼルのため
  rationale: עֲזָאזֵל の意味は論争があり、固有名、やぎの役割、除去に関係する語などの可能性がある。本文では音写して曖昧さを保持した。
theological_decisions:
- issue: 贖罪日の儀式における עֲזָאזֵל の意味
  choice: 本文では固有名のように「アザゼル」と音写する
  alternative: 「身代わりのやぎ」「放逐のやぎ」、または除去を表す語として訳す
  rationale: この節だけでは、やぎの役割、行き先、あるいは人格的存在のいずれを指すか確定できない。音写により神学的・語源的な論争を本文で一方的に解決せず、主要な別解を脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「雄やぎ」により原語の具体性を示し、「アザゼル」は解釈を固定せず音写した。
