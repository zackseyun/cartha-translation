id: LEV.16.6
reference: Leviticus 16:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: ja
  text: アロンは、自分のための罪のいけにえ[a]である雄牛を差し出し、自分と自分の家族のために贖いを行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのいけにえ」とも訳せる。ヘブライ語の חַטָּאת は「罪のいけにえ」を指し、文脈によっては儀式的な清めが強調される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 差し出し
  rationale: 祭儀の文脈で、供え物を主の前に近づけて提示することを表す。ここでは屠る行為まで先取りしない「差し出す」が適切である。
- source_word: פַּר הַחַטָּאת
  choice: 罪のいけにえである雄牛
  rationale: פַּרは雄牛、חַטָּאתはこの祭儀規定では供え物を指す。「罪のいけにえ」は現代日本語で理解しやすく、別の可能性は脚注に示す。
- source_word: אֲשֶׁר לוֹ
  choice: 自分のための
  rationale: 周囲の文脈にある民の供え物と区別し、アロン自身のために指定された雄牛であることを自然に表す。
- source_word: וְכִפֶּר
  choice: 贖いを行う
  rationale: 祭司文書の祭儀的・神学的な意味を保ちつつ、作用の仕組みを必要以上に限定しない表現である。
- source_word: בַּעֲדוֹ
  choice: 自分のために
  rationale: בְּעַדが示す受益・代理の意味を簡潔に表す。
- source_word: וּבְעַד בֵּיתוֹ
  choice: 自分の家族のために
  rationale: בַּיִתはここでは建物ではなく、アロンに属する家族・家の者たちを指す。「家族」は一般読者に明瞭である。
theological_decisions:
- issue: 祭儀規定における חַטָּאת の訳
  choice: 罪のいけにえ
  alternative: 清めのいけにえ
  rationale: 直近の文脈では抽象的な「罪」ではなく供え物を指す。「罪のいけにえ」を本文に採りつつ、儀式的な清めを強調する訳語も語義上可能なので脚注に残す。
- issue: בֵּיתוֹ の範囲
  choice: 自分の家族
  alternative: 自分の家／自分の家の者たち
  rationale: 物理的な家屋ではなく、アロンの家族・家に属する者たちを指すと解される。後代の教理的含意を持ち込まず、自然な現代日本語で示す。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある祭儀規定の文体とした。命令手順を表すヘブライ語の動詞形は、日本語では非過去形で表現した。
