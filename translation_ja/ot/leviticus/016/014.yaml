base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: ja
  text: 彼は雄牛の血の一部を取り、指で贖いの蓋[a]の表面の東側に振りかける。さらに、贖いの蓋の前で、血の一部を指で七度振りかける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの蓋」は契約の箱を覆う蓋を指し、贖罪の儀式と結び付いている。「贖罪の蓋」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח מִדַּם הַפָּר
  choice: 彼は雄牛の血をいくらか取り
  rationale: 祭儀の手順を示す継続的な指示として現在形で訳した。מִן の部分を表す用法は「いくらか」によって明示した。
- source_word: וְהִזָּה / יַזֶּה
  choice: 振りかける
  rationale: 祭司的文脈における נזה は、血を儀礼的に散布する行為を指す。「振りかける」は現代日本語で明瞭かつ自然である。
- source_word: בְאֶצְבָּעוֹ
  choice: 指で
  rationale: 前置詞 בְּ の道具・手段の意味を簡潔に表した。
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: 贖いの蓋の表面の東側に
  rationale: עַל פְּנֵי を物体の「表面」と取り、קֵדְמָה の東向きの位置・方向を「東側」とした。蓋そのものへの散布と、その前方への散布との違いも保たれる。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱を覆う具体的な物体であることと、語が持つ贖罪祭儀との結び付きをともに伝える訳語を選んだ。
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: また、贖いの蓋の前に
  rationale: לִפְנֵי の空間的意味を自然に表し、直前の「蓋の表面」と区別した。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七度
  rationale: 祭儀上重要な回数を明示し、簡潔で格調ある日本語とした。
- source_word: מִן הַדָּם
  choice: その血を
  rationale: 日本語では目的語として「その血を」とするのが自然であり、実際に用いるのが血の一部であることは先行する「いくらか」によって明らかである。
theological_decisions:
- issue: הַכַּפֹּרֶת の訳し方
  choice: 贖いの蓋
  alternative: 宥めの蓋／贖罪の蓋
  rationale: この語は契約の箱の蓋という具体物を指す一方、贖罪の日の儀礼と深く結び付く。「贖いの蓋」は物体と祭儀的機能の双方を明瞭に示すが、ヘブライ語の語源と神学的含意を一つに確定しすぎないよう脚注を付した。
translation_notes:
  register: 現代の一般読者に理解できる明瞭な祭儀文体を用いた。手順規定は「〜する」で統一し、過度に古風な命令表現を避けつつ、簡潔で荘重な調子を保った。
