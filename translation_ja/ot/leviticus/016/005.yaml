source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: ja
  text: また、イスラエルの人々の会衆から、雄やぎ二頭を罪のささげ物[b]として、雄羊一頭を全焼のささげ物として取る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「清めのささげ物」。ヘブライ語のחַטָּאתは、レビ記では罪だけでなく、祭儀上の汚れを取り除くためのささげ物を指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: また、〜から
  rationale: 接続と出所を示す。前後の儀礼規定との連続性と、動物が会衆から提供されることを自然な日本語で表した。
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民の会衆
  rationale: בְּנֵי יִשְׂרָאֵל は字義的には「イスラエルの子ら」だが、ここでは契約共同体全体を指すため「イスラエルの民」とし、עֲדָה の集合的・公的な意味を「会衆」で保持した。
- source_word: יִקַּח
  choice: 取る
  rationale: 儀礼法規における指示的な未完了形。文脈上の規定として、簡潔で威厳ある現在形を用いた。
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: 雄やぎ二頭
  rationale: 動物の種類と雄であること、頭数を明確に保った。日本語として自然な助数詞「頭」を用いた。
- source_word: לְחַטָּאת
  choice: 罪のささげ物のために
  rationale: 祭儀用語 חַטָּאת を伝統的で理解しやすい名称として訳した。同時に、清めの機能を強調する別訳を脚注に示した。
- source_word: וְאַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִל の性別と動物種、および אֶחָד の数量を明示した。
- source_word: לְעֹלָה
  choice: 全焼のささげ物のために
  rationale: 献げ物全体を祭壇で焼く עֹלָה の祭儀的性格を、現代の読者にも分かる定訳的表現で示した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの民
  alternative: イスラエルの子ら
  rationale: 語形上は男性複数だが、ここでは共同体全体を指す慣用句である。日本語で不必要に男性だけを意味するように読まれるのを避け、指示対象を正確に示した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のささげ物
  alternative: 清めのささげ物
  rationale: この語は罪に関わる献げ物を指す一方、レビ記では祭儀的な汚れを清める機能も持つ。本文では広く通用する名称を採り、意味上重要な別理解を脚注で保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、レビ記の祭儀規定にふさわしい簡潔で端正な文体とした。「献げ物」より視認性の高い「ささげ物」を採用した。英語版の脚注[a]に相当する情報は本文の「イスラエルの民」で直接明確にしたため、独立した脚注は設けていない。
