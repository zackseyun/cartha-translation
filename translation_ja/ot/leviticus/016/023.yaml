id: LEV.16.23
reference: Leviticus 16:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: ja
  text: それから、アロンは会見の天幕に入り、聖所[a]に入るときに身に着けた亜麻布の衣を脱ぎ、そこに置いておく。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖域」。贖罪日の儀式全体の文脈から、ここをより限定して「至聖所」と理解する見方もある。
    reason: 原語 הַקֹּדֶשׁ の指示範囲には幅があり、この節だけでは最奥部に限定されないため。
lexical_decisions:
- source_word: וּבָא
  choice: それから、…入る
  rationale: 祭儀手順を示すワウ＋完了形の継起的な働きを「それから」で表し、בוא の移動先が天幕内であるため、自然な日本語として「入る」とした。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 幕屋聖所を指す定型表現。現代日本語で意味が取りやすく、原語の「会見」と「天幕」の要素を保つ。
- source_word: וּפָשַׁט
  choice: 脱ぎ
  rationale: 衣服を取り去る動作を表す פשט に対応する、簡潔で自然な現代語。
- source_word: בִּגְדֵי הַבָּד
  choice: 亜麻布の衣
  rationale: בגד の衣服と בד の素材指定を保持した。「衣」は祭儀的文脈にふさわしい品位を保ちつつ一般にも理解できる。
- source_word: אֲשֶׁר לָבַשׁ
  choice: 身に着けた
  rationale: לבש の着用を自然に表し、関係節が亜麻布の衣を修飾する構造を明確にした。
- source_word: בְּבֹאוֹ
  choice: 入るときに
  rationale: 前置詞 ב＋不定詞連語＋接尾辞の時間的意味を明瞭に表した。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: 字義的には「聖なる所」であり、祭儀的な場所を指す日本語として簡潔な「聖所」を採用した。最奥部への限定は本文で断定せず脚注に示す。
- source_word: וְהִנִּיחָם שָׁם
  choice: そこに置いておく
  rationale: הניח の「置く／残しておく」という意味を、衣をその場にとどめる指示として自然な日本語で表した。
theological_decisions:
- issue: הַקֹּדֶשׁ が指す場所
  choice: 本文では「聖所」とし、指示対象を最奥部に限定しない。
  alternative: 「聖域」、または贖罪日の文脈から「至聖所」と特定する。
  rationale: ヘブライ語本文は単に「聖なる所」を意味する語を用い、最奥部を明示するより完全な表現をここでは用いていない。したがって本文では原語の幅を保ち、文脈に基づく限定的理解は脚注に置く。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で品位ある文体とした。主語に続く一連の動作を現在形で示し、律法の手順として読めるようにした。
