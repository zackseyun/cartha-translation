id: LEV.16.10
reference: Leviticus 16:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: ja
  text: しかし、アザゼルのためのくじが当たった雄やぎは、生きたまま主の前に立たせられる。雄やぎについて贖いを行い[a]、アザゼルのために荒野へ送り出すためである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その雄やぎの上に贖いを行い」。または「その雄やぎのために贖いを行い」。
    reason: עַל の語義は、雄やぎに関わる儀式的関係と、雄やぎのためという受益的関係のいずれにも理解されうるため。
  - marker: b
    text: 「アザゼル」の意味は定かでない。荒野の存在や場所の名、または「除去」に関係する語とも考えられてきた。伝統的には「スケープゴート」と訳されることがある。
    reason: 論争のあるヘブライ語 עֲזָאזֵל を本文で一義的に解釈しないため。
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: しかし、…雄やぎは
  rationale: 前節の、主のために選ばれた雄やぎとの対比を「しかし」で示す。שָׂעִיר はこの祭儀では雄やぎを指すため、明示した。
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל לַעֲזָאזֵל
  choice: アザゼルのためのくじが当たった
  rationale: くじによる選定を表すヘブライ語の慣用表現を自然な日本語にした。意味の定まらない עֲזָאזֵל は解釈せず音写した。
- source_word: יָעֳמַד חַי לִפְנֵי יְהוָה
  choice: 生きたまま主の前に立たせ
  rationale: יָעֳמַד の使役受動的な形を「立たせ」で保ち、חַי が犠牲にされるもう一頭との対照を示すことを「生きたまま」で表した。神名 יהוה は日本語聖書として明瞭で品位ある慣用の「主」とした。
- source_word: לְכַפֵּר עָלָיו
  choice: その上で贖いを行い
  rationale: כפר の祭儀的意味を「贖いを行う」とし、עַל の空間的表現を「その上で」に残して、雄やぎのための贖いか、雄やぎの上で行う儀式かを本文で決め切らないようにした。
- source_word: לְשַׁלַּח אֹתוֹ לַעֲזָאזֵל הַמִּדְבָּרָה
  choice: 荒野へ、アザゼルのもとに送り出す
  rationale: 方向を示す語尾を「荒野へ」で表し、二度目の לַעֲזָאזֵל も省略せず、目的地・相手を示しうる「アザゼルのもとに」とした。
theological_decisions:
- issue: עֲזָאזֵל の意味
  choice: アザゼル（音写）
  alternative: 身代わりのやぎ／除去／荒野の存在または場所
  rationale: 語義と指示対象には議論があるため、本文では固有名のように音写し、特定の解釈に固定しない。
- issue: לְכַפֵּר עָלָיו における עַל の意味
  choice: その上で贖いを行う
  alternative: そのために贖いを行う
  rationale: 前置詞は「上で」と「ために」の双方に理解されうる。本文ではより形式に近い表現を採り、受益対象を断定しない。
- issue: יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 現代日本語で自然かつ品位ある伝統的表記を用いた。ヘブライ語本文の固有の神名であることは脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀文としての簡潔さと品位を保った。「立たせ」は原文の使役受動的な形を反映する。なお、脚注cを付す場合は本文の「主」に[c]を置く必要があるため、公開本文では「主[c]」とするべきである。
