revisions:
- from: しかし、アザゼルのためのくじが当たった雄やぎは、生きたまま主の前に立たせ、その上で贖いを行い[a]、荒野へ、アザゼルのもとに送り出す[b]。
  to: しかし、アザゼルのためのくじが当たった雄やぎは、生きたまま主の前に立たせられる。雄やぎについて贖いを行い[a]、アザゼルのために荒野へ送り出すためである[b]。
  rationale: 受動の祭儀命令を「立たせられる」で回復し、二つの不定詞を「贖いを行い、…送り出すため」で示した。「アザゼルのために」は両方の לַעֲזָאזֵל に対応し、アザゼルが存在・場所・抽象的語のいずれかを本文で決めない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:21:15Z'
review_pass:
  verdict: revise
  source_fidelity: 「立たせ」は他動詞であり、ヘブライ語のホフアル（「立たせられる／立たされる」）を十分に表していません。また、「その上で」は通常「その後に」の意味となり、עָלָיו（その雄やぎの上に／それについて）を反映しません。終わりの「アザゼルのもとに」は、アザゼルを人格的存在として扱うため、論争のある語の曖昧さを狭めています。
  naturalness: 修正版は、受動形と二つの目的を明瞭にしつつ、現代標準日本語として読める簡潔な祭儀文に整えています。「雄やぎについて」は、直訳的な空間表現が日本語で不自然になることを避けながら、脚注で原語の幅を示せる表現です。
  terminology: 「雄やぎ」「贖い」「主」は文脈に適切です。עֲזָאזֵל は本文で「アザゼル」と音写し、両箇所の לַעֲזָאזֵל を「アザゼルのために」と対応させます。脚注の伝統的訳語は、代償・身代わりの神学的含意を強める「身代わりのやぎ」ではなく、「スケープゴート」として歴史的訳語であることを示します。
  issues:
  - severity: high
    issue: 「主の前に立たせ」
    rationale: 「立たせ」は能動的な使役で、文法的にも主語の雄やぎが何かを立たせるように読めます。יָעֳמַד はホフアルであるため、「立たせられる」とする必要があります。
  - severity: high
    issue: 「その上で贖いを行い」
    rationale: 日本語の「その上で」は時間的・談話的に「その後で」を意味するのが通常で、עָלָיו の「その雄やぎに関して／その上に」という関係を表せていません。
  - severity: medium
    issue: 「荒野へ、アザゼルのもとに」
    rationale: 「もとに」はアザゼルを人・存在として前提します。עֲזָאזֵל の指示対象は争われているため、本文ではその解釈を避けるべきです。
  - severity: low
    issue: 脚注bの「身代わりのやぎ」
    rationale: これは伝統的な理解の一つではあるものの、本文の語が直接その意味だと受け取られやすく、代償的解釈を強めます。歴史的訳語として「スケープゴート」と記す方が中立的です。
