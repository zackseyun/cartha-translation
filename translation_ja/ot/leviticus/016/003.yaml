  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: ja
  text: アロンは、次のものをもって聖所に入らなければならない。すなわち、罪のいけにえ[a]として牛の群れから雄牛一頭[b]、焼き尽くすいけにえとして雄羊一頭である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。このヘブライ語は、罪との関係だけでなく、祭儀上の清めをも強調することがある。
    reason: alternative_reading
  - marker: b
    text: 直訳「牛の群れの子である雄牛」。牛の群れに属する雄牛を指すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: 次のものを携えなければならない
  rationale: 前置詞בを伴う指示代名詞は、ここでは入域に必要な手段・条件を導入する。後続する供え物を自然な日本語で明示した。
- source_word: יָבֹא
  choice: 入るには……なければならない
  rationale: 祭儀規定における未完了形の指示的・規定的な力を表した。単純な未来ではなく、入る際の要件を示す。
- source_word: אֶל־הַקֹּדֶשׁ
  choice: 聖所に
  rationale: 定冠詞付きの「聖なる所」を祭儀空間として簡潔に訳した。文脈上、至聖所を指す可能性が高いが、この語自体の表現を狭めすぎないよう「聖所」とした。
- source_word: בְּפַר בֶּן־בָּקָר
  choice: 牛の群れから若い雄牛一頭
  rationale: פַרを若い雄牛、בֶּן־בָּקָרを牛類に属することを示す慣用表現として自然に表した。字義的表現は脚注に残した。
- source_word: לְחַטָּאת
  choice: 罪のいけにえとして
  rationale: 祭儀用語חַטָּאתの伝統的で理解しやすい訳を採用し、清めを担う側面は脚注で示した。
- source_word: וְאַיִל לְעֹלָה
  choice: 焼き尽くすいけにえとして雄羊一頭
  rationale: עֹלָהは全体を焼く供犠を指すため、「焼き尽くすいけにえ」とした。אַיִלは「雄羊」。
theological_decisions:
- issue: 祭儀用語חַטָּאתの意味
  choice: 罪のいけにえ
  alternative: 清めのいけにえ
  rationale: 罪との関係を示す伝統的な呼称を本文に用いつつ、祭儀上の清めをもたらす機能を「清めのいけにえ」という別訳として脚注に保存した。
- issue: הַקֹּדֶשׁが指す祭儀空間の範囲
  choice: 聖所
  alternative: 至聖所
  rationale: 直前の文脈では垂れ幕の内側を指すが、本文の語は一般に「聖なる所」であるため、訳語では原文の表現幅を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀用語には「いけにえ」を用い、規定文としての力を「なければならない」で示した。脚注記号は該当語句の直後に配置した。
