id: LEV.16.12
reference: Leviticus 16:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: ja
  text: 彼は、ヤハウェの前にある祭壇の上から、火皿いっぱいの燃える炭を取り、また、細かく砕いた香りのよい香を両手いっぱいに取り、それらを垂れ幕の内側[a]へ持って入る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「垂れ幕の内側」は、垂れ幕の向こう側、すなわち至聖所を指す。
    reason: 原文の圧縮された空間表現が指す場所を明確にするため。
lexical_decisions:
- source_word: וְלָקַח
  choice: 彼は……取り
  rationale: 接続詞付き完了形を、祭儀手順を指示する日本語として自然な非過去形で訳した。
- source_word: מְלֹא הַמַּחְתָּה
  choice: 火皿いっぱいの
  rationale: 「火皿の満量」という数量表現を自然な日本語にした。מַחְתָּהはここでは祭壇の炭を運ぶ器なので「火皿」とした。
- source_word: גַּחֲלֵי אֵשׁ
  choice: 燃える炭
  rationale: 字義は「火の炭」だが、現代日本語で明瞭に火のついた炭を表す。
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: ヤハウェの前にある祭壇の上から
  rationale: 炭を取る起点と、祭壇がヤハウェの前に位置するという空間関係の双方を保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を日本語で通用する音写によって示した。
- source_word: וּמְלֹא חָפְנָיו
  choice: 両手いっぱいに
  rationale: חָפְנָיוが両手で受ける分量を表すため、「両手」を明示しつつ自然な数量表現にした。
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: 細かく砕いた香りのよい香
  rationale: 香料から作る芳香のある香と、それが細かくされた状態を明瞭に表した。
- source_word: וְהֵבִיא
  choice: それらを……持って入る
  rationale: 火皿の炭と香の双方を目的語として補い、内側への移動を自然な日本語で示した。
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: 垂れ幕の内側へ
  rationale: 圧縮された空間表現を、垂れ幕の向こう側へ入る方向として訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、その区別を保つ音写を採用した。
- issue: מִבֵּית לַפָּרֹכֶת が指す場所
  choice: 垂れ幕の内側、すなわち幕の向こうの聖域
  alternative: 垂れ幕の中へ
  rationale: 文脈上は垂れ幕そのものの内部ではなく、垂れ幕で隔てられた向こう側の空間への移動を表すため。ただし本文では簡潔な空間表現を保ち、注で説明した。
translation_notes:
  register: 現代標準日本語による、簡潔で厳かな祭儀規定の文体。逐語的すぎる不自然さを避けながら、器、分量、祭壇との位置関係、両手、香の細かさ、垂れ幕の向こうへの移動を保持した。
