  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: ja
  text: アロンは、自分のための罪のためのささげ物の雄牛[a]を差し出し、自分と自分の家の者たちのために贖いを行う[b]。それから、自分のための罪のためのささげ物の雄牛を屠る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「罪のためのささげ物とする雄牛」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「自分のため、また自分の家のために」。「家」はここでは家に属する人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 進み出させ
  rationale: ヒフィル形の「近づける、差し出す」を祭儀の文脈で表す。後に屠る行為が続くため、ここで犠牲奉献の全過程を意味する「ささげる」とはしない。
- source_word: פַּר הַחַטָּאת
  choice: 罪のきよめのささげ物の雄牛
  rationale: חַטָּאת は罪に関わる供犠を指すが、祭司文書では清めの機能も重要である。「罪のきよめのささげ物」は、単なる処罰や特定の贖罪理論に狭めず、両面を伝える。
- source_word: אֲשֶׁר לוֹ
  choice: 自分のための
  rationale: 単なる所有より、この雄牛がアロン自身のために指定されたことを表す文脈上の機能を優先した。
- source_word: וְכִפֶּר
  choice: 宥めを行う
  rationale: 祭司的用法の כפר を、罪や汚れを処理して関係を回復する祭儀行為として表す。特定の神学的機序に限定しない。
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: 自分と自分の家の者たちのために
  rationale: בְּעַד の受益・代理の意味を「ために」で示し、בֵּיתוֹ は建物ではなく家に属する人々を指すため「家の者たち」とした。
- source_word: וְשָׁחַט
  choice: それから、…屠る
  rationale: 祭儀的な屠殺を表す標準的な語として「屠る」を用い、接続詞は一連の手順を自然に示す「それから」とした。
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: 自分のための罪のきよめのささげ物の雄牛
  rationale: ヘブライ語の反復と祭儀上の強調を保つため、節の前半と後半で同じ表現を繰り返した。
theological_decisions:
- issue: 祭儀用語 כפר の訳し方
  choice: 宥めを行う
  alternative: 贖いをする／清めを行う
  rationale: כפר には贖い・清め・宥めに関わる幅があり、この節だけでその機序を一つに確定しない。「宥め」は祭儀による罪の処理と関係回復を示しつつ、後代の特定の贖罪論を持ち込まない。
- issue: חַטָּאת の供犠名
  choice: 罪のきよめのささげ物
  alternative: 罪のためのいけにえ／罪祭
  rationale: 語の「罪」と祭司文書における清めの働きをともに見える形にし、罪の処理と聖所の清めの緊張を保存する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀文としての荘重さとヘブライ語の反復を保持した。「屠る」は日常語より硬いが、祭儀上の正確さのため採用した。
