  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: ja
  text: 彼は、罪のためのささげ物[a]の脂肪を祭壇の上で焼いて煙にする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのためのささげ物」。ヘブライ語の語は、罪や汚れからの清めのために用いられるささげ物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: （文脈上、継続を自然な日本語で表し、接続詞は明示しない）
  rationale: 接続詞は前の儀式手順との連続を示すが、単独の節としても日本語では無理に「また」を置かないほうが自然である。אֵתは目的語標識なので訳出しない。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: いけにえのうち祭壇で焼かれる脂肪を直接表す。「脂肪の部分」とすることもできるが、原文以上の限定を加えない。
- source_word: הַחַטָּאת
  choice: 罪のためのささげ物
  rationale: 祭儀上の供え物を指すことが明確で、現代の一般読者にも意味を取りやすい表現とした。清めの機能を強調する訳も可能なので脚注に残す。
- source_word: יַקְטִיר
  choice: 焼いて煙にする
  rationale: קטרのヒフィル形が祭壇上で焼いて煙を立ち上らせる祭儀行為を表すため、単なる「焼く」よりその含意を明示する。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴う形だが、この祭儀の文脈では行為の場所を表す自然な日本語とした。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳
  choice: 罪のためのささげ物
  alternative: 清めのためのささげ物
  rationale: この語は罪と関係する供え物を指す一方、罪や汚れからの清めという祭儀的機能を表すと理解する余地がある。本文では伝統的な「罪のため」の意味を保ち、重要な別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「焼いて煙にする」により祭壇での専門的な焼却行為を平易に表した。
