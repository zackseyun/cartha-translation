  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: ja
  text: 清い燭台の上で、彼は灯火をヤハウェの前に常に整えておかなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל הַמְּנֹרָה הַטְּהֹרָה
  choice: 清い燭台の上に
  rationale: עַל は位置を表す「上に」、מְנוֹרָה は祭儀用の燭台を指す。「清い」は טָהוֹר の祭儀的な含意を保ちつつ、材質上の「純金の」とは限定しない。
- source_word: יַעֲרֹךְ
  choice: 整えておく
  rationale: ערך は、定められた仕方で配置し整える行為を表す。継続を示す תָּמִיד と自然につながる表現とした。
- source_word: הַנֵּרוֹת
  choice: ともしび
  rationale: נֵרוֹת は燭台に据える個々の灯火・灯明を指す。器具そのものだけに限定しない自然な日本語として「ともしび」を選んだ。
- source_word: לִפְנֵי יְהוָה
  choice: 主の前に
  rationale: לִפְנֵי の臨在を示す祭儀的表現を「前に」で保った。神名 YHWH は、日本語聖書の朗読と理解に適した伝統的代置「主」とし、原文に神名があることを脚注で明示した。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 祭儀が継続的・恒常的に行われることを簡潔に表す。文脈上「定期的に」も可能だが、原語の持続性を保持した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では明瞭で格調ある日本語として「主」を用い、原文が称号ではなく神名 YHWH であることを脚注に示した。これにより伝統的な可読性と原文情報の双方を保つ。
- issue: תמיד の継続性
  choice: 絶えず
  alternative: いつも／定めどおり नियमितに
  rationale: 灯火を主の前に保つ継続的な務めとして訳したが、祭儀文脈では反復的・定期的な遂行を含み得るため、時間的意味を過度に厳密化しない。
translation_notes:
  register: 現代標準日本語による簡潔で格調ある祭儀文体。「彼」は直前の文脈で祭司アロンを受ける。目的語を先に置き、ヘブライ語の構造を保ちながら自然な語順にした。
