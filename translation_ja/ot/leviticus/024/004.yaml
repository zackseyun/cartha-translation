revisions:
- from: 彼は、清い燭台の上に、ともしびを主の前に絶えず整えておく。[a]
  to: 清い燭台の上で、彼は灯火をヤハウェの前に常に整えておかなければならない。
  rationale: 神名 יהוה を「ヤハウェ」と直接訳し、これに伴い「主」の原文説明だけを目的とする脚注を削除した。「絶えず整えておく」を「常に整えておかなければならない」に改め、祭儀上の継続的な義務を自然に表した。原文の語順と関係を保ち、神学的な解釈は加えていない。
