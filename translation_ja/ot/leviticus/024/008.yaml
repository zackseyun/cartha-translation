  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: ja
  text: 安息日ごとに[a]、彼はそれ[b]をヤハウェの前に常に整えて置かなければならない。それはイスラエルの子らからのものであり、永遠の契約である。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「安息日の日に、安息日の日に」。安息日ごと、すなわち毎安息日という意味の反復表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「それを順序よく並べる」。単数形の「それ」は、並べられたパン全体を一まとまりとして指す。
    reason: lexical_alternative
  - marker: c
    text: 語順により、「イスラエルの子らからのものとして、永遠の契約として」と前の命令に続けて訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: 安息日ごとに
  rationale: 「安息日の日に」の反復は、一回ごとの規則的な反復を表す分配的な言い方である。自然な現代日本語でその意味を示した。
- source_word: יַעַרְכֶנּוּ
  choice: 彼はこれを…整えて置かなければならない
  rationale: ערךは祭儀の品を順序立てて配置することを表す。単数の接尾辞「これ」は、パンの一式を集合的に指すと理解した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 祭儀において、神の臨在の前に供えることを示す定型表現である。神名は音写した。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 祭司文書では、途切れない動作だけでなく、定められた時ごとに継続して守ることも表す。直前の「安息日ごとに」が具体的な周期を明示している。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らからのもの
  rationale: מֵאֵתの出所を表す働きを保ち、「イスラエルの子ら」という原文の集合的な男性表現も維持した。日本語として文を成立させるため「もの」を補った。
- source_word: בְּרִית עוֹלָם
  choice: 永遠の契約
  rationale: 字義どおりの契約用語を保持し、ここで「義務」「規定」などを本文に補って法的機能を一義的に確定することを避けた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の神名が記されているため、普通名詞的な称号に置き換えず、日本語で一般的な音写を用いた。
- issue: בְּרִית עוֹלָם の祭儀規定における意味
  choice: 永遠の契約
  alternative: 永続する契約上の義務／永遠の定め
  rationale: この句には継続的な祭儀義務という含意があり得るが、原文は明確に「契約」と述べるため、その神学的・法的緊張を訳文で狭めなかった。
- issue: בְּנֵי יִשְׂרָאֵל の集合的表現
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の系譜的かつ集合的な表現を保った。文脈上は共同体全体を指すが、本文では中性化しなかった。
translation_notes:
  register: 明瞭で dignified な現代標準日本語を用いた。「整えて置く」は祭儀的な配置を自然に表しつつ、過度に専門的な語を避ける。「彼」は原文の三人称単数を保持し、文脈上の指示対象を本文で補わない。
