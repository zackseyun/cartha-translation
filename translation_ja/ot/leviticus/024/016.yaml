source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: ja
  text: ヤハウェの名を冒涜する者は、必ず死刑に処せられなければならない[a]。会衆全体がその者を必ず石で打ち殺さなければならない。寄留者であれ、その地に生まれた者であれ、御名[b]を冒涜する者は死刑に処せられなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「冒涜する」に当たるヘブライ語は、「はっきり口にする」「名指す」、またこの文脈では「呪う」とも訳し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では単に「名」。ここではヤハウェの名を敬意を込めて指している。
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: 冒瀆する／冒瀆するなら
  rationale: נקב には「明確に口にする」「名指す」などの語義があり、この構文では「呪う」とも解される。法的文脈では神の名を汚す行為を指すと見て、自然な日本語の「冒瀆する」を本文に採用し、語義上の幅は脚注に残した。
- source_word: שֵׁם יְהוָה
  choice: ヤハウェの名
  rationale: שֵׁם は「名」、יהוה は固有の神名であり、原文の直接性を保って「ヤハウェ」とした。
- source_word: מוֹת יוּמָת / יוּמָת
  choice: 必ず死刑に処せられなければならない／死刑に処せられなければならない
  rationale: 不定詞絶対形と受動態動詞の組み合わせによる強意と、司法上の処刑命令を表す。「死ぬ」ではなく「死刑に処せられる」として受動的・法的性格を明示した。
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: その者を必ず石で打ち殺さなければならない
  rationale: 不定詞絶対形による強意を「必ず」で示し、סקילהの具体的な処刑方法が分かるよう「石で打ち殺す」とした。
- source_word: כָּל הָעֵדָה
  choice: 会衆全体
  rationale: עֵדָה は契約共同体として集められた民を指すため、法的・共同体的な響きを持つ「会衆」を用いた。
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: 寄留者も、その地に生まれた者も同じ
  rationale: גֵּר はイスラエルの中に住む非土着の居留者、אֶזְרָח はその地に生まれた者を指す。両者に同じ規定が及ぶ比較構文を自然な日本語で明示した。
- source_word: שֵׁם
  choice: 御名
  rationale: 後半では יהוה を伴わず「名」とだけ記され、文脈上、神の名を敬意を込めて指すため「御名」とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文は四文字神名を直接記しているため、固有名として「ヤハウェ」と音写し、一般名詞の「主」に置き換えなかった。
- issue: 神名とともに用いられた נקב の意味
  choice: 冒瀆する
  alternative: 「口にする」または「呪う」
  rationale: 単なる発音を禁じる規定と断定せず、文脈上の神名の侵害を「冒瀆する」と表した。一方、動詞そのものの語義をめぐる曖昧さは脚注で保持した。
translation_notes:
  register: 現代の一般読者に理解できる、厳粛な法文調とした。「死刑に処せられなければならない」で司法上の義務を示しつつ、「寄留者」「会衆」「御名」など聖書本文にふさわしい語を過度に古風にならない範囲で用いた。
