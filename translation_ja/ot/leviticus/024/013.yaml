  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: それから、ヤハウェはモーセにこう語った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから……告げた
  rationale: 接続形は物語の進行と出来事の順序を示すため、「それから」とした。דבר は後続する発言内容を導入する文脈なので、現代日本語として自然な「告げた」と訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写を用いた。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 方向・受け手を示す前置詞 אֶל を助詞「に」で表し、固有名 מֹשֶׁה は慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （「告げた」に統合）
  rationale: 直訳すれば「言って」であるが、日本語では「告げて言った」とすると冗長で不自然になりやすい。次節に発言内容が続くことは「告げた」で十分に示されるため、発話導入句として統合した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、その区別を保って音写した。伝統的な代読である「主」に置き換えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の逐語的な「そして……語った、言って」は避けつつ、物語の継起と次節への発話導入を簡潔に表した。
