  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: ja
  text: 動物を打ち殺した者は、その償いをしなければならない。人を打ち殺した者は、死刑に処せられる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: 打ち殺した者
  rationale: נכהのヒフィル分詞。家畜については償い、人については死刑という結果が続くため、ここでは致命的に打つことを指す。日本語では「打ち殺した者」として、行為の性質と法規定の一般的用法を明確にした。
- source_word: בְהֵמָה
  choice: 家畜
  rationale: 大型の飼育動物を中心に指す語で、この賠償規定の文脈では「家畜」が自然である。「獣」より現代的で、「動物」より文脈上の範囲を明確に伝える。
- source_word: יְשַׁלְּמֶנָּה
  choice: その償いをしなければならない
  rationale: שלםのピエル形で、損失を補償することを表す。女性単数接尾辞はבְהֵמָהを受けるため、「その償い」とした。
- source_word: אָדָם
  choice: 人
  rationale: ここでは家畜と対照される個々の人間を指す。ヘブライ語は文法上男性単数だが、日本語の「人」は性別を限定せず、語の一般的な人間の意味と代表的な法文表現を自然に保持する。
- source_word: יוּמָת
  choice: 必ず死刑に処せられる
  rationale: מותのホファル形で、他者または共同体によって死に至らされる司法的処罰を示す。「死ぬ」ではなく受動的な死刑執行を明示し、法規定の強さを「必ず」で表した。
theological_decisions:
- issue: 法的文脈におけるאָדָםの訳
  choice: 人
  alternative: 男
  rationale: אָדָםは文法上男性単数形だが、この家畜との対比では性別よりも人間であることが焦点である。現代日本語の法的な一般規定では「人」が自然であり、原語の適用範囲を不必要に男性へ限定しない。
translation_notes:
  register: 簡潔で荘重な現代標準日本語の法文調。「者」と「しなければならない／死刑に処せられる」を用い、二つの対照的規定を明瞭にした。
