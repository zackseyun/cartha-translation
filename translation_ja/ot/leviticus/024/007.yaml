id: LEV.24.7
reference: Leviticus 24:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: ja
  text: それぞれの列[a]の上に純粋な乳香を置きなさい。それはパンのための記念の分となり、ヤハウェへの火によるささげ物となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「配列」または「並べた組」とも訳せる。文脈では、前節でパンを並べた二つの列（組）を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 置きなさい
  rationale: 祭儀規定の文脈における命令として、自然で明確な現代日本語にした。
- source_word: עַל הַמַּעֲרֶכֶת
  choice: それぞれの列の上に
  rationale: מַעֲרֶכֶת は整然と並べられた一組を指す。前節の二列を受け、単数形を配分的に理解した。語義上の幅は脚注に残した。
- source_word: לְבֹנָה זַכָּה
  choice: 純粋な乳香
  rationale: 乳香の儀礼上の純粋さを表す、定着した明瞭な表現。
- source_word: לַלֶּחֶם לְאַזְכָּרָה
  choice: パンのための記念の分
  rationale: אַזְכָּרָה は祭壇でささげられ、全体を代表する『記念の分』を指す祭儀用語。単なる心理的な思い出に狭めず、לַלֶּחֶם の関係も保持した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭儀用語として、火でささげる物を示す。語源について議論があるため断定的な『食物のささげ物』を避け、伝統的かつ文脈に明瞭な訳を採った。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 原文の固有の神名 יהוה を普通名詞や称号に置き換えず、音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: シナイ契約の文脈で明記された固有名を保ち、称号へ置換しない。一般的な学術的音写を用いた。
- issue: אַזְכָּרָה の祭儀的機能
  choice: 記念の分
  alternative: 記念／覚えのしるし
  rationale: 何を、また誰に思い起こさせるかを本文以上に限定せず、全体を代表してささげる部分という祭儀的含意を保った。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある祭儀規定の文体とした。「乳香」「記念の分」など必要な祭儀語は保持しつつ、文を二つに分けて係り受けを明瞭にした。
