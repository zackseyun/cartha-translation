  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: ja
  text: そのイスラエル人の女性の息子は、御名を口にして、呪った[a]。人々は彼をモーセのもとへ連れて来た。彼の母の名は、ダン部族に属するディブリの娘シェロミトであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御名を冒涜し、呪った」。ヘブライ語の動詞は「はっきり口にする」「名を挙げる」とも、この文脈では「冒涜する」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: 口にして
  rationale: נקב は「明確に言う、名を挙げる」とも、文脈上「冒瀆する」とも理解され得る。後続の וַיְקַלֵּל（「呪った」）と区別し、二つの動作を保つため、「御名を口にして」とした。
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: そのイスラエル人の女の息子
  rationale: 直前の文脈で示された人物を指す定冠詞を「その」で表し、構文を自然な日本語にした。
- source_word: אֶת־הַשֵּׁם
  choice: 御名
  rationale: 定冠詞を伴う「その名」は、この文脈では神の名への畏敬を込めた呼称である。日本語では「御名」が簡潔で自然であり、本文に神名そのものを補わない。
- source_word: וַיְקַלֵּל
  choice: 呪った
  rationale: קלל のピエル形の基本的な意味を直接表す。目的語は明示されていないため、日本語でも補わない。
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל־מֹשֶׁה
  choice: そこで人々は彼をモーセのもとへ連れて来た
  rationale: 主語が明示されない三人称複数を「人々」とし、能動表現を保った。「そこで」は物語の展開を自然に示す。
- source_word: וְשֵׁם אִמּוֹ
  choice: 彼の母の名は…といい
  rationale: 背景説明への移行を、現代日本語で自然な叙述として表した。
- source_word: שְׁלֹמִית בַּת־דִּבְרִי
  choice: シェロミトといい、…ディブリの娘
  rationale: 固有名をヘブライ語に基づいて音写し、親子関係を明確に表した。
- source_word: לְמַטֵּה דָן
  choice: ダン部族の
  rationale: 所属部族を示す定型表現として、明快で簡潔な日本語にした。
theological_decisions:
- issue: נקב と「御名」の組み合わせの解釈
  choice: 御名を明示的に口にし、そのうえで呪ったという二つの動作として訳す
  alternative: 「御名を冒瀆して、呪った」と訳し、נקב 自体を冒瀆行為と理解する
  rationale: 本文には נקב と קלל の二つの動詞があるため、それぞれを訳出して区別を保った。ただし נקב がこの文脈で冒瀆を意味し得ることは脚注に示し、語義上の曖昧さを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「御名」で畏敬を表しつつ神名を補わず、問題となる動詞の曖昧さは本文と脚注で保持した。
