  to: そのイスラエル人の女性の息子は、御名を口にして、呪った[a]。人々は彼をモーセのもとへ連れて来た。彼の母の名は、ダン部族に属するディブリの娘シェロミトであった。
  rationale: 本文の主要な解釈方針、すなわち「御名を口にして」と「呪った」を別の動作として訳し、前者の別解を脚注に残す方針は維持しました。そのうえで、部族所属と父娘関係の修飾を明確にし、接続表現と表記を現代標準日本語として整えました。
