id: LEV.24.19
reference: Leviticus 24:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: ja
  text: 人が自分の同胞に傷を負わせたなら、その人がしたとおりに、その人にもなされなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: 人が……なら
  rationale: 継続を示す接続詞を日本語で不自然に明示せず、事例法を導く כִּי の条件的用法を「なら」で自然に表した。אִישׁ はこの法規の行為主体として「人」とした。
- source_word: יִתֵּן מוּם
  choice: 傷を負わせた
  rationale: 字義は「欠陥・損傷を与える」。ここでは対人の身体的損傷を扱うため、「傷を負わせる」が具体性と自然さを保つ。
- source_word: בַּעֲמִיתוֹ
  choice: 自分の同胞に
  rationale: עָמִית は共同体内の仲間・同胞を指す。「隣人」よりも、同じ共同体に属する者という含みを明確に伝える。
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: その人がしたとおりに
  rationale: 行為と処置の対応関係を示す比較表現を、その強調を保って訳した。
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: その人にもなされなければならない
  rationale: ニファル形の受動表現と法規としての拘束力を保ちつつ、誰が執行するかを原文以上に特定しない。
theological_decisions:
- issue: 同害報復法の法的性格
  choice: 行為に対応する処置を定める司法的原則として訳した。
  alternative: 個人による報復を命じる表現として明示する。
  rationale: 原文の受動形は執行主体を明示していない。したがって、私的復讐とも特定の司法手続きとも訳文だけで断定せず、比例的な対応という法文の形を保った。
- issue: מוּם の意味範囲
  choice: 文脈上の身体的な「傷」とした。
  alternative: 字義に近い「欠陥」または「傷害」とする。
  rationale: 周囲の身体損傷に関する規定に即しつつ、「欠陥」が持ちうる恒久性を不必要に限定せず、普通の読者に明瞭な語を選んだ。
translation_notes:
  register: 明瞭で現代的な法文調。「なされなければならない」によって規定の拘束力を示しながら、古風な言い回しや執行主体の補足を避けた。
