  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: ja
  text: それらを二列[a]に、それぞれ六個ずつ、清い[b]机の上に、ヤハウェの前に並べなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二つの配置に」または「二つの積み重ねに」とも訳せる。ヘブライ語は、パンを秩序立てて配置したまとまりを指す。
    reason: lexical_alternative
  - marker: b
    text: 「清潔な」とも訳せるが、ここでの「清い」には、単なる物理的な清潔さではなく祭儀上の清さという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 並べなさい
  rationale: 基本義は「置く、据える」だが、パンを二つのまとまりに配置する文脈では「並べる」が自然であり、命令としての力も明確に伝える。
- source_word: אוֹתָם
  choice: それらを
  rationale: 前節の十二個の輪形パンを受ける複数目的語代名詞を明示した。
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: 二列に
  rationale: מַעֲרָכָה は秩序立てて配置された一組を指す。パンを机上に置く文脈では「列」が最も自然だが、「二組」や「二つの重ね」にも解し得るため脚注で幅を残した。
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: 一列六個ずつ
  rationale: 直訳的には「その一列に六つ」。二つの各配置に六個ずつという配分を、自然な日本語で明示した。
- source_word: עַל הַשֻּׁלְחָן
  choice: 机の上に
  rationale: עַל の通常の空間的意味「上に」をそのまま表した。
- source_word: הַטָּהֹר
  choice: 清い
  rationale: 聖所の祭儀的文脈における טָהוֹר は、単なる物理的な清潔さよりも儀礼上の清さを表すため、「清潔な」ではなく「清い」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵי の「前に、御前に」という臨在を示す表現を保ち、神名 יְהוָה は「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に記された固有の神名を明示し、特定の教派的慣行に寄せず、一般的な学術的音写を用いた。
- issue: 祭儀的形容詞 הַטָּהֹר の意味
  choice: 清い机
  alternative: 清潔な机／純粋な机
  rationale: ここでは聖所の備品について述べており、物理的な汚れの有無だけでなく祭儀上の清さが中心である。「清い」はその含みを保てる。
translation_notes:
  register: 現代の一般読者に理解しやすい簡潔な命令文としつつ、聖所での規定にふさわしい端正さを保った。「輪形パン」は前節に明示されているため、本節では原文どおり「それら」とした。
