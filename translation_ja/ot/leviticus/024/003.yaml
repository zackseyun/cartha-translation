id: LEV.24.3
reference: Leviticus 24:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ja
  text: 会見の天幕の中で、あかしの垂れ幕の外側に、アロンは夕方から朝まで、ヤハウェの前で絶えずそれを整えなければならない[a]。これは、あなたがたの代々にわたる永遠の定めである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「絶えず」は、「夕方から朝まで」と定められたこの務めを、継続して規則正しく行うことを指しうる。
    reason: cultural_note
  - marker: b
    text: 「永遠の定め」は、「永代の定め」「永久の定め」または「とこしえの定め」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: あかしの垂れ幕の外側で
  rationale: מִחוּץ の位置的意味を「外側で」とし、פָרֹכֶת を聖所を仕切る「垂れ幕」、הָעֵדֻת を祭儀上の定着した語「あかし」と訳した。語同士の関係を過度に説明せず、原文の簡潔さを保つ。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中
  rationale: イスラエルの幕屋を指す定型表現として、現代日本語の聖書用語でも理解しやすい「会見の天幕」を採用した。בְּ の位置を明確にするため「中」を補った。
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: それを整えておかなければならない
  rationale: ערך の「整える、秩序立てて置く」という祭儀的意味を保持した。目的語の代名詞 אֹתוֹ は前節のともし火に関わるが、本節では明示されないため「それ」として指示の曖昧さを残した。法規文としての未完了形は義務表現で訳した。
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: 夕方から朝まで
  rationale: 時間の起点と終点を示す原文を、自然で直接的な日本語にした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の臨在を示す祭儀的表現を「前で」とし、神名 יהוה は称号に置き換えず「ヤハウェ」と表記した。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 継続性を表す語義を保持しつつ、本節の「夕方から朝まで」と矛盾する無休の連続動作と断定しないよう、脚注で祭儀の反復的継続性を説明した。
- source_word: חֻקַּת עוֹלָם
  choice: 永代の定め
  rationale: חֻקָּה を拘束力のある規定として「定め」、עוֹלָם を世代を超える持続性として「永代」とした。直後の「代々」とも自然につながる。
- source_word: לְדֹרֹתֵיכֶם
  choice: あなたがたにとって代々にわたる
  rationale: 接尾辞二人称複数を「あなたがた」と明示し、世代を通じた適用を自然な日本語で表した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は神の固有名を用いているため、称号「主」に置換せず音写し、契約の神名としての性格を保った。
- issue: תָּמִיד と「夕方から朝まで」の関係
  choice: 本文では「絶えず」とし、定期的に継続する祭儀であることを脚注で示す
  alternative: 常に／毎晩欠かさず
  rationale: תָּמִיד は継続性を示す一方、この節自体が時間を夕方から朝までと限定する。「毎晩」と本文に補って解釈を固定せず、両方の表現が生む緊張を保った。
- issue: חֻקַּת עוֹלָם の持続性
  choice: 永代の定め
  alternative: 永久の定め／とこしえの定め
  rationale: עוֹלָם の長期的・継続的な効力を示しつつ、その神学的射程を本文で説明しすぎない表現を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で威厳ある法規文体とした。「会見の天幕」「あかし」「ヤハウェ」など文脈上重要な祭儀語・固有名は保持し、義務は「なければならない」で明示した。
