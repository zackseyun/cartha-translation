  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: ja
  text: 「イスラエルの子ら[a]に命じなさい。彼らが、明かりのため、灯火を絶えず[c]ともしておくために、砕いたオリーブから採った純粋な油[b]をあなたのもとへ持って来るように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イスラエルの子ら」。イスラエル人、すなわちイスラエルの民を指す慣用的な呼称。
    reason: lexical_alternative
  - marker: b
    text: 原文は、オリーブを砕いて採った、混じり物のない油であることを示す。
    reason: lexical_clarification
  - marker: c
    text: または「いつも」「定期的に」。祭儀の文脈では、途切れない継続にも、規則正しい反復にも用いられ得る。
    reason: ambiguity
lexical_decisions:
- source_word: צַו
  choice: 命じ
  rationale: 直接的な命令を表す命令形の権威ある語調を、現代日本語で自然に保つ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の慣用的な契約共同体の呼称を形の上でも示しつつ、「子ら」によって集合的表現として訳す。
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: あなたのもとへ持って来させなさい
  rationale: לקח の基本義は「取る」だが、「あなたへ」と組み合わさるここでは、必要な油を持参させる意味になる。日本語では命令構文に自然に従属させた。
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: 砕いたオリーブから採った純粋な油
  rationale: 原料、純粋さ、砕いて油を得る製法をすべて明示し、「純粋なオリーブ油」だけでは製法が見えにくくなることを避ける。
- source_word: לַמָּאוֹר
  choice: 明かりのために
  rationale: מָאוֹר の「光・照明」という意味を保ち、文脈上の特定の器具へ狭めない。
- source_word: לְהַעֲלֹת נֵר
  choice: 灯火を……ともしておく
  rationale: 字義的には灯火を「上らせる」使役表現だが、ここでは灯火をつけ、保つことを表す慣用句であるため、自然な日本語で機能を示す。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 継続性を端的に表す。ただし祭儀用語として「 नियमितに」の含みもあり得るため、脚注で代案を示す。
theological_decisions:
- issue: 契約共同体を指す בְּנֵי יִשְׂרָאֵל の性を含む表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の表現を本文で可視化しながら、これが共同体全体を指す慣用的呼称であることを脚注で説明し、男性だけに限定する解釈を押しつけない。
- issue: תָּמִיד の時間的ニュアンス
  choice: 絶えず
  alternative: いつも／定期的に
  rationale: 継続を表す読みを本文に採る一方、祭儀が規則正しく反復される意味の可能性を脚注に残す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「ともしておく」によって、単に点火するだけでなく灯火を保つ務めを自然に表した。原文の命令の強さと、祭儀規定としての簡潔さを維持した。
