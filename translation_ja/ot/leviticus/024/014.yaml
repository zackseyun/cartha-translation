  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: ja
  text: 「呪った者[a]を宿営の外へ連れ出しなさい。そして、聞いた者たちは皆、その者の頭に手を置き[b]、全会衆にその者を石で打ち殺させなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「呪った者」は、「冒瀆した者」とも訳せる。この文脈では、神の御名を呪った者を指す。
    reason: alternative_reading
  - marker: b
    text: 頭に手を置く行為は、聞いた者たちが違反者を正式に確認することを示すと考えられるが、象徴的な意味も含むと解する見方がある。本文はその意味を明記していない。
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: 連れ出しなさい
  rationale: 使役形の命令で「外へ出させる」を意味する。人を目的地へ移す文脈では「連れ出す」が自然である。
- source_word: הַמְקַלֵּל
  choice: 呪った者
  rationale: קלל の定冠詞付き分詞。文脈上は神の御名への冒瀆だが、本文では語の直接的な意味「呪う」を保った。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: 共同体の居住空間の外を示す標準的な空間表現。「宿営」は荒野の陣営という文脈を明確に伝える。
- source_word: כָל הַשֹּׁמְעִים
  choice: それを聞いた者たちは皆
  rationale: 目的語は明記されていないため、「彼を」ではなく、聞いた発言・呪いを指す自然な補いとして「それを」を用いた。証人であることは解釈として本文に加えない。
- source_word: וְסָמְכוּ ... אֶת יְדֵיהֶם עַל רֹאשׁוֹ
  choice: その者の頭に手を置き
  rationale: 手を頭に置くという儀礼的・司法的動作をそのまま訳し、象徴的意味は本文で特定しない。ヘブライ語の「彼らの手」は日本語では集合的に「手」とするのが自然である。
- source_word: וְרָגְמוּ אֹתוֹ
  choice: その者を石で打ち殺しなさい
  rationale: רגם は石打ちによる処刑を表す。「石で打つ」だけでは処刑の結果が日本語で曖昧になり得るため、文脈に即して「打ち殺す」とした。
- source_word: כָל הָעֵדָה
  choice: 全会衆
  rationale: עֵדָה の正式な共同体的意味を保ちつつ、聖書本文として簡潔で通用する表現を採用した。
theological_decisions:
- issue: 違反者を「呪った者」とするか「冒瀆した者」とするか
  choice: 呪った者
  alternative: 冒瀆した者／神を冒瀆した者
  rationale: 語そのものは קלל「呪う」の分詞である。神の御名を呪ったという広い文脈は認めつつ、本文では語彙上の直接的意味を保ち、解釈的な「冒瀆」は脚注に示した。
- issue: 頭に手を置く行為の意味
  choice: 動作だけを本文に記す
  alternative: 証人による犯人確認、または罪責の象徴的転嫁と明示する
  rationale: この節自体は行為の意味を説明していないため、特定の象徴解釈を本文へ取り込まない。
- issue: 石打ちを行う主体
  choice: 全会衆
  alternative: 共同体全体／集会全体
  rationale: 命令が共同体全体に向けられているという本文の緊張を弱めず、עֵדָה の集合的・公的性格を保持した。
translation_notes:
  register: 明瞭で現代的かつ威厳ある命令文とした。対象者の反復には「その者」を用い、口語的すぎる代名詞を避けた。脚注記号は該当内容の直後に配置した。
