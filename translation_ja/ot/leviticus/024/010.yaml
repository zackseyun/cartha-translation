base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: ja
  text: イスラエル人の女性の息子で、父がエジプト人である者が、イスラエルの子らの中に出て行った。そして宿営の中で、そのイスラエル人女性の息子と、あるイスラエル人の男が互いに争った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに争った」は、「口論した」または「けんかをした」とも訳せる。ヘブライ語の動詞は、言い争いにも身体的な争いにも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て来た
  rationale: יצא の物語形。出発点は明示せず、宿営共同体の中に姿を現したという文脈上の動きを自然な日本語で表す。
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: イスラエル人の女の息子
  rationale: 母方の出自による人物の特定を保ち、後半の反復にも対応させる。
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: 父がエジプト人である者
  rationale: 直訳は「彼はエジプト人の男の息子であった」。日本語では父子関係を明示するほうが自然であり、意味を過不足なく伝える。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの中に
  rationale: בני ישראל という定型的な民族・契約共同体の呼称を形式面でも保ち、בתוך を「中に」と訳す。
- source_word: וַיִּנָּצוּ
  choice: 争った
  rationale: נצה のニファル形は口論にも身体的な争いにもなり得るため、「争った」として原文の幅を保つ。
- source_word: בַּמַּחֲנֶה
  choice: 宿営の中で
  rationale: イスラエル共同体の宿営内という場所を明確に示す。
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: このイスラエル人の女の息子
  rationale: 原文の反復を保ちつつ、既出人物を指すことが自然に分かるよう「この」を補う。
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: あるイスラエル人の男
  rationale: 混合した親を持つ先の人物と、イスラエル人とされる別の男性との対比を自然に表す。
theological_decisions:
- issue: 民族的・契約的呼称 בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  alternative: イスラエル人たち
  rationale: ここでは定型的な共同体名であると同時に字義的には「イスラエルの子ら」であるため、原文との接触を保つ表現を本文に採用した。
- issue: 争いの性質 וַיִּנָּצוּ
  choice: 争った
  alternative: けんかをした／口論した
  rationale: 動詞は言い争いと身体的な争いの双方を含み得る。後続文脈だけから一方に限定せず、曖昧さを維持した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある物語文。冒頭に原文にない「さて」は加えない。母方の出自を示す表現の反復と、「イスラエルの子ら」という原文の定型表現を保持する。
