  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: ja
  text: また、男がだれか[a]を打って死なせたなら[b]、その男は必ず死刑に処せられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「いかなる人のいのちをも」。ここで「いのち」と訳せる語は、人そのものを指しており、非物質的な「魂」に限定されない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「だれかを殺したなら」。原語は字義的には「打つ」だが、ここでは死に至らせる打撃を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: また、男が
  rationale: 接続詞 וְ を、前後の法規とのつながりを示す「また」とした。אִישׁ は男性単数の「男」なので、その形を本文に保った。
- source_word: כִּי
  choice: なら
  rationale: 個別事例を扱う法文の条件を導くため、自然な日本語の条件表現「なら」とした。
- source_word: יַכֶּה
  choice: 打って死なせた
  rationale: נכה のヒフィル形は字義的には「打つ」だが、ここでは人の死と死刑規定が続くため致命的な打撃を指す。「殺した」だけにせず、原語の具体的な打撃の像も残した。
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: だれか
  rationale: ここで נֶפֶשׁ は非物質的な「魂」ではなく、人である生きた存在を指す。כָּל と合わせ、不特定の人を表す自然な日本語とした。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と受動態の動詞による強意を「必ず」で示し、受動の法的処罰表現を保った。
theological_decisions:
- issue: כָּל נֶפֶשׁ אָדָם の意味
  choice: だれか
  alternative: 人のいのちを／どの人をも
  rationale: 被害者である人そのものを指し、現代語で誤解されやすい霊魂の意味には限定しない。
- issue: אִישׁ の男性形
  choice: 男
  alternative: 人／だれでも
  rationale: この法が代表的・一般的に機能し得ることを否定せず、本文では原文の男性単数を明示した。
- issue: יַכֶּה が表す結果
  choice: 打って死なせた
  alternative: 打った／殺した
  rationale: 単なる殴打ではなく致死行為であるという文脈上の意味と、「打つ」という原語の像をともに示した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で厳粛な法文調とした。「死刑に処せられる」により、原文の受動表現と公的な刑罰の性格を示した。
