source:
  edition: WLC
  text: וְ/הָֽיְתָה֙ לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֔י/ו וַ/אֲכָלֻ֖/הוּ בְּ/מָק֣וֹם קָדֹ֑שׁ כִּ֡י קֹדֶשׁ֩ קָֽדָשִׁ֨ים ה֥וּא ל֛/וֹ מֵ/אִשֵּׁ֥י יְהוָ֖ה חָק עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: ja
  text: それはアロンとその子らのものとなり、彼らは聖なる場所でそれを食べる。それは、ヤハウェへの火によるささげ物[a]の中から彼に与えられる、最も聖なるものである。これは永遠の定めである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「食物のささげ物」。ヘブライ語の祭儀用語で、伝統的には火によってささげられる供え物を指す。
    reason: 祭儀用語 אִשֶּׁה は伝統的に「火によるささげ物」と理解される一方、「食物のささげ物」と訳す可能性もあるため。
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: それはアロンとその子らのものとなり
  rationale: היה に受領者を示す לְ が続くため、単なる存在ではなく、割り当て・所有を表す。現代日本語で法的な意味が明確になるように訳した。
- source_word: וַאֲכָלֻהוּ
  choice: 彼らは……それを食べる
  rationale: 法規の指示を継続する形であり、日本語では簡潔な現在形により規定としての意味を表した。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 聖なる場所で
  rationale: ヘブライ語には定冠詞がなく、特定の聖所内部の一区画に限定せず、場所の聖性をそのまま表した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: ヘブライ語の強意的な表現を自然な日本語の最上級で表し、聖所の『至聖所』との混同を避けた。
- source_word: הוּא לוֹ
  choice: 彼に属する……もの
  rationale: 単数形 לוֹ を保ち、アロンを祭司家の代表者として指す文法上の緊張を均さなかった。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物のうち
  rationale: אִשֶּׁה の伝統的・語源的な理解を本文に反映しつつ、『食物のささげ物』という語義上の可能性を脚注に示した。מִן はその種のささげ物から祭司に割り当てられる分を表すため、『のうち』とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の子音表記に対応する一般的な音写を用いた。
- source_word: חָק עוֹלָם
  choice: 永遠の定め
  rationale: 継続的に有効な法規を示す定型句として、明瞭で格調ある現代日本語を選んだ。
theological_decisions:
- issue: アロンとその子らが先行する文脈での単数形 לוֹ の指示対象
  choice: 単数の『彼に属する』とした
  alternative: 文脈上の祭司たちをまとめて『彼らに属する』とする
  rationale: 原文の単数形を保持し、アロンが祭司家を代表している可能性を読者に残した。
- issue: אִשֶּׁה の意味
  choice: 本文を『火によるささげ物』とした
  alternative: 『食物のささげ物』とする
  rationale: 火と関連する伝統的理解を本文で保持したが、この祭儀用語には『食物のささげ物』と理解する余地があるため、脚注で代案を明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法としての荘重さを保った。『子ら』『聖なる』『永遠の定め』は聖書本文に適した格調を持つが、古語的表現は避けた。
