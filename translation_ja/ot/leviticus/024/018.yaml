  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: ja
  text: 動物を打ち殺した者は、その償いをしなければならない。命には命を[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「命の代わりに命」。ここでは、殺した動物に対して相応の償いをすることを表す。
    reason: 原文の定式的表現と、この文脈での補償的意味を示すため。
lexical_decisions:
- source_word: וּמַכֵּה נֶפֶשׁ בְּהֵמָה
  choice: 動物を打ち殺した者は
  rationale: נכהのヒフィル分詞は一般的な法規の主体を示す。目的語のנֶפֶשׁ בְּהֵמָהは動物の命を奪う行為を意味するため、現代日本語では「打ち殺した」と簡潔に表した。
- source_word: בְּהֵמָה
  choice: 動物
  rationale: 家畜を含む動物一般を指し得る語であり、原文の一般的な法規表現を狭めない「動物」とした。
- source_word: יְשַׁלְּמֶנָּה
  choice: その償いをしなければならない
  rationale: שלםのピエル形は損失に対する弁償・補償を表す。接尾辞は動物を受けるため、日本語では「その償い」と自然に表現した。
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: 命には命をもって
  rationale: 直訳的な対応関係を保ちつつ、日本語の法的・格言的表現として通る形にした。具体的な弁償方法は本文以上に限定しない。
theological_decisions:
- issue: 動物を殺した場合の「命には命をもって」が意味する償いの内容
  choice: 同等の償いを求める定式として保持し、具体的な方法は特定しない
  alternative: 別の動物を文字どおり差し出すことを命じていると限定する
  rationale: 直前のיְשַׁלְּמֶנָּהが弁償を明示している一方、結びの定式自体は方法を詳述しない。原文の法的な響きと解釈上の幅をともに残した。
translation_notes:
  register: 明瞭な現代標準日本語の法規文体。「しなければならない」で義務を示し、結句は原文の簡潔で厳粛な定式を保った。
