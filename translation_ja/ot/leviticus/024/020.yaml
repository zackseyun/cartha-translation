  text: שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּ/אֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽ/אָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: ja
  text: 骨折には骨折、目には目、歯には歯。人に傷害[a]を負わせたとおり、その者にも同じ傷害が加えられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「傷害」と訳した語は、身体の欠陥、損傷、または損なわれた状態を意味しうる。直訳すれば「人に損傷を与える」となる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: 骨折
  rationale: 身体への加害を扱う法的文脈で、骨が折れること、またその傷害を具体的に表す。
- source_word: תַּחַת
  choice: には
  rationale: 同害報復の定型句における対応・等価関係を、自然な日本語の「骨折には骨折、目には目」で表した。
- source_word: מוּם
  choice: 身体の傷
  rationale: 原語は身体の欠陥、損傷、損なわれた状態を指しうる。ここでは人に加えられる傷害なので、「身体の傷」が自然であり、外見上の傷だけに狭めない。
- source_word: אָדָם
  choice: 人
  rationale: この判例法では特定の性別ではなく被害を受ける人間一般を指す代表単数であるため、現代日本語の「人」とした。
- source_word: יִנָּתֶן בּוֹ
  choice: その者も……傷を負わされる
  rationale: נתןの受動形と前置詞בְּを踏まえ、先に述べた傷が加害者にも負わされるという受動の対応関係を明示した。
theological_decisions:
- issue: 同害報復の定式を具体的に残すか
  choice: 「骨折には骨折、目には目、歯には歯」と具体的に訳す
  alternative: 「傷害に相当する償い」のように抽象化する
  rationale: 原文は具体的な身体部位と傷害を並べている。刑罰か賠償かという法解釈を訳文で先取りせず、原文の法的緊張を保つ。
- issue: 後半の受動表現
  choice: 「その者も同じように傷を負わされる」
  alternative: 「その者に同じ傷を負わせなければならない」
  rationale: 原文の受動態を保ちつつ、誰が執行するかを訳文で補わないようにした。
translation_notes:
  register: 簡潔で荘重な法文調を用いた。前半は日本語でもよく知られた対応表現を保ち、後半は現代の読者に明瞭な語順とした。
