base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: ja
  text: あなたは上質の粉を取り、それを焼いて十二個のパン[a]を作りなさい。一個につき十分の二エファ[b]とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「パン」は「パン菓子」とも訳せる。ヘブライ語は祭儀で用いる一単位の焼いたパンを指すが、その正確な形状は特定しにくい。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「十分の二」。この箇所の計量法では、一個につき一エファの十分の二を意味する。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: あなたは……取りなさい
  rationale: 接続詞を伴う完了形は、この規定の手順を示す命令として機能している。日本語では自然な指示文として表現した。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 祭儀で用いる精製された良質の粉を指す語。ヘブライ語自体は穀物名を明示しないが、レビ記の供え物の文脈と日本語での明瞭さを考慮し、「小麦粉」とした。
- source_word: וְאָפִיתָ אֹתָהּ
  choice: それを焼いて……作りなさい
  rationale: 女性単数の目的語は前の「粉」を受ける。日本語では、材料からパンを作る結果を自然に示す表現とした。
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: 十二個の輪形のパン
  rationale: חַלָּהは祭儀用の一単位のパンを表し、語源・用法上は輪形または穴のあるパンを指し得る。「菓子」という誤解を避けつつ、単なる一般的な食パンとも区別した。形状の確定には幅があるため脚注を付した。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分の二エファ
  rationale: 直訳は「十分の二」。祭司文書の計量法では一エファの十分の二を意味するため、単位を本文で補った。
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: 一個につき……とする
  rationale: 字義的には「一つのパンは……である」だが、ここでは各パンに同じ分量を配する意味なので、現代日本語の分配表現を用いた。
