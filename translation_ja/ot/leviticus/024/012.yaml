  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: ja
  text: 彼らは、ヤハウェの言葉に基づいて彼らに明らかにされるまで、その男を拘留した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに明らかにされる」は、「彼らにはっきり告げられる」とも訳せる。ヘブライ語の動詞には、ある事柄を明確に示すという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: そこで彼らはその男を…置き
  rationale: 使役形の「置く、留める」と物語の進行を表す接続を、文脈に即して自然な日本語で表した。目的語の男性を「その男」と明示した。
- source_word: בַּמִּשְׁמָר
  choice: 拘留し
  rationale: ここでの מִשְׁמָר は単なる見張りではなく、監視下に置くこと、すなわち拘留を指す。法的状況にも合う現代的な表現とした。
- source_word: לִפְרֹשׁ
  choice: 事を明らかにする
  rationale: פרשׁ の「明らかにする、はっきり示す」という意味を保った。何を明らかにするかは原文に明示されないため、「裁定」などと限定せず「事」とした。
- source_word: לָהֶם
  choice: 彼らのために
  rationale: 待っている共同体または関係者に向けた明示を表す。日本語では「彼らのために」が自然である。
- source_word: עַל־פִּי
  choice: 言葉に基づいて
  rationale: 直訳は「口に従って」で、権威ある発言に基づくことを示す慣用句。「命令」と限定せず、発話の含意を残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が記されているため、それを称号で代替せず音写した。
- issue: 明らかにする事柄の特定
  choice: 事を明らかにする
  alternative: 裁定を明らかにする
  rationale: 文脈上は裁定が想定されるが、原文には目的語が明示されていない。そのため法的判断に限定する語を本文へ補わず、原文の余地を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、神の権威ある言葉を扱う箇所として簡潔で厳かな調子を保った。原文で明示されない目的語や行為主体を過度に補わないようにした。
