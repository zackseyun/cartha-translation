source:
  edition: WLC
  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: ja
  text: あなたがたには、寄留者にもこの国に生まれた者にも、同一の裁きの基準がなければならない。わたしはあなたがたの神、主だからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: 同一の裁きの基準
  rationale: 直訳的な「一つの裁き」が表す、双方に等しく適用される法的基準という意味を明瞭に伝える。
- source_word: גֵּר
  choice: 寄留者
  rationale: イスラエル共同体の中に居住する非在来者を指す法的・社会的語であり、単なる旅行者を意味する「旅人」は避けた。
- source_word: אֶזְרָח
  choice: この国に生まれた者
  rationale: 寄留者と対比される、その土地に属する生来の民を自然な現代日本語で表す。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を、日本語聖書で広く理解される伝統的な表記「主」で示す。
theological_decisions:
- issue: 寄留者と在来者への法の適用
  choice: 両者に同一の裁きの基準があることを明示した。
  alternative: 「寄留者も、この国に生まれた者も同様である」とだけ訳す。
  rationale: 原文の כַּגֵּר כָּאֶזְרָח は双方を対等に並べ、מִשְׁפָּט אֶחָד が法的基準の同一性を示すため。
- issue: 神名の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 発音の再構成を本文で断定せず、一般読者に通用する日本語の慣用に従った。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある法令調の訳。原文の義務・規範性を「なければならない」で表し、節末の自己宣言は自然な理由節として訳した。
