source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: ja
  text: あなたはイスラエルの子ら[a]に、こう告げなさい。『自分の神を呪う者はだれでも、自分の罪を負わなければならない[b]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの息子たち」。ここではイスラエルの民全体を指す。
    reason: 語義と集合的な指示対象を明確にするため。
  - marker: b
    text: 「罪を負う」は、その違反について罪責を負い、処罰の対象となることを表すヘブライ語の言い回し。
    reason: ヘブライ語の慣用表現が持つ法的含意を説明するため。
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに
  rationale: 接続詞は日本語では新たな命令の開始として明示せず、前置詞の方向性を「に」で表した。בְּנֵי יִשְׂרָאֵל は字義どおり「イスラエルの子ら」とし、民全体を指すことは脚注で補った。
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: 告げなさい
  rationale: 法的な命令を自然で格調ある現代日本語の命令形で表現した。לֵאמֹר の引用導入機能は、後続のかぎ括弧によって十分に示されるため、冗長な「言って」を置かなかった。
- source_word: אִישׁ אִישׁ
  choice: だれであれ、…者
  rationale: 名詞の反復による分配的強調を自然な日本語で表した。文法上の男性形を不自然に「男」と限定せず、この法規が個々の該当者に及ぶ意味を保持した。
- source_word: כִּי יְקַלֵּל
  choice: 呪う者
  rationale: כִּי が導く法的条件を、日本語の一般条件を示す連体構文で表した。קלל のピエル形は、次節の御名に関するより限定的な違反と区別し、「冒瀆する」ではなく「呪う」とした。
- source_word: אֱלֹהָיו
  choice: 自分の神
  rationale: 三人称男性単数接尾辞を再帰的に自然な「自分の」で表し、本文にない「主」へ狭めなかった。אֱלֹהִים は文脈上単数の「神」とした。
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: 自分の罪を負わなければならない
  rationale: 条件に伴う法的帰結を「なければならない」で示し、「罪を負う」というヘブライ語の慣用表現を本文に保持した。その含意は脚注で明確にした。
theological_decisions:
- issue: אֱלֹהָיו が指す神の範囲
  choice: 自分の神
  alternative: 神／主
  rationale: 所有接尾辞を保持し、本文をイスラエルの神または主に明示的に限定しなかった。次節の御名に対する違反との語義上の緊張も残した。
- issue: אִישׁ אִישׁ の性と分配性
  choice: だれであれ、…者
  alternative: どの男でも／人はだれでも
  rationale: 男性単数名詞の反復は法文における分配的用法であり、日本語で「男」とすると適用対象を不必要に限定し得る。分配的強調を明確にしつつ、本文以上の性別限定を導入しなかった。
- issue: 「罪を負う」の意味
  choice: 慣用表現を本文に保持し、脚注で責任・処罰対象性を説明
  alternative: 罪の罰を受ける／罪責を負う
  rationale: חטא が持つ「罪」と「罪責」の幅を一語に決め切らず、原文の表現と法的含意の双方を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法本文にふさわしい簡潔で dignified な調子とした。「告げなさい」「負わなければならない」により命令と法的帰結を明確にしつつ、過度に古風な文語表現は避けた。
