  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: ja
  text: モーセはイスラエルの人々に告げた。彼らは呪った者[a]を宿営の外へ連れ出し、石で打ち殺した。こうしてイスラエルの人々は、ヤハウェがモーセに命じたとおりに行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、神の名を呪った者、すなわち「冒涜した者」を指す。ヘブライ語は字義的には「呪った者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げると
  rationale: ピエル形の「語る」を、命令を民に伝達する文脈に即して自然な日本語で表した。後続動作との連続も「すると」の構文で明確になる。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの子ら」だが、ここでは共同体を指す慣用句なので、現代日本語として明瞭で性別を不必要に限定しない表現を選んだ。
- source_word: וַיּוֹצִיאוּ
  choice: 連れ出し
  rationale: יצאのヒフィル形「外へ出させる、連れ出す」を、人を宿営外へ移送する司法的場面に即して訳した。
- source_word: הַמְקַלֵּל
  choice: のろった者
  rationale: קללの分詞であり、直前の文脈で神の御名をのろった人物を指す。「冒瀆者」と解釈的に限定せず、語の直接的意味を保った。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: 移動を表す動詞と方向を示す構文を合わせ、目的地としての宿営外を自然に表した。
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: 石で打ち殺した
  rationale: רגםとאָבֶןによる「石を投げつける」という処刑行為を、日本語で明瞭に表現した。文脈上の結果である死を示す「打ち殺す」は、日本語聖書語としても自然である。
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: 命じたとおりに行った
  rationale: 先行するヤハウェの命令への従順を要約する定型句を、時系列と対応関係が明確な日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号で置き換えず、一般的な日本語音写で固有名として示した。
theological_decisions:
- issue: הַמְקַלֵּלを神学的に限定した語で訳すか
  choice: のろった者
  alternative: 冒瀆した者／冒瀆者
  rationale: 前後の文脈では神の御名への冒瀆に当たるが、この節の語そのものはקלל「のろう」の分詞であるため、本文では直接的な語義を保ち、文脈上の含意は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「石で打ち殺した」は処刑場面を簡潔かつ自然に伝える。神名は「ヤハウェ」と音写し、共同体名は慣用的な「イスラエルの人々」とした。
