source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では神名を表す四文字YHWH（יהוה）。伝統的には「主」と訳される。古代の正確な発音は確定しておらず、「ヤーウェ」とも表記される。
    reason: 神名の伝統的な訳と発音上の不確かさを示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: こう告げた
  rationale: 接続形は物語を先へ進める。日本語では、後続する直接話法を示す「こう」と、権威ある伝達を自然に表す「告げた」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名YHWHを称号の「主」に置き換えず、神の固有名として音写した。発音には不確かさがあるため注記した。
- source_word: אֶל
  choice: に
  rationale: 発話の相手を示す前置詞であり、現代日本語では「モーセに」が自然である。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を用いた。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後続する直接話法を導く語法を、日本語で不自然な「言って」を重ねず「こう」で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、ヤーウェ
  rationale: 本文は称号ではなく四文字神名そのものを用いているため、固有名を保持した。一方、その古代の正確な発音は確定していないので、伝統的な代替表現と別表記を脚注で示した。
translation_notes:
  register: 明快な現代標準日本語を用いた。「語って言った」のようなヘブライ語的重複は避けつつ、「こう」によって後続の直接話法とのつながりを保った。神に対する敬語を文法上付加せず、簡潔で dignified な叙述とした。
