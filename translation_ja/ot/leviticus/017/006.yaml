source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: ja
  text: 祭司は、その血を会見の天幕の入口にあるヤハウェの祭壇に振りかけ[a]、その脂肪を焼いて煙にし、ヤハウェにささげる芳しい香り[b]としなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「振りかける」は、祭司が血を祭壇に向けて投げかけ、あるいは浴びせかける祭儀上の動作を指す。「振りまく」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「心地よい香り」。伝統的には「なだめの香り」「かぐわしい香り」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: 振りかけ
  rationale: 祭儀において血を祭壇へ勢いを伴って施す動作を表す。現代日本語として自然な「振りかけ」を本文に用い、「少量を軽く散らす」という意味に限定されないことを脚注で補った。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: イスラエルの祭儀を務めるכֹּהֵןの標準的で明瞭な訳語。定冠詞の指示性は文脈上「祭司は」で自然に表した。
- source_word: הַדָּם
  choice: その血
  rationale: 直前までに述べられた犠牲動物の血を指すため、日本語では「その」を添えて指示関係を明確にした。
- source_word: עַל מִזְבַּח יְהוָה
  choice: ヤハウェの祭壇に
  rationale: זָרַקとの組み合わせで、血を祭壇の上または祭壇に向けて施すことを表す。日本語では動作の到達点として自然な「祭壇に」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名יהוהを日本語で一般的な音写「ヤハウェ」とした。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口
  rationale: פֶּתַחを「入口」、אֹהֶל מוֹעֵדをレビ記の祭儀的施設名として明瞭な「会見の天幕」と訳した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にし
  rationale: 祭壇上で焼き、煙として立ち上らせるという祭儀用語の含意を、単なる「焼く」より明確に表した。
- source_word: הַחֵלֶב
  choice: その脂肪
  rationale: 犠牲動物から取り分けて祭壇で焼く脂肪部分を指す。「その」により既出の動物との関係を示した。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 芳しい香りとし
  rationale: 定型的な祭儀表現で、神に受け入れられる心地よい香りを示す。「芳しい香り」は簡潔で品位があり、受容の含意を過度に説明しない。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לְが示す、香りがヤハウェに向けられる関係を自然な日本語で表した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、固有名を保つ音写を採用した。
- issue: רֵיחַ נִיחֹחַが示す神への効果
  choice: 芳しい香り
  alternative: 心をなだめる香り／心地よい香り
  rationale: 語句には心地よさや受容の含意があるが、神を機械的に宥めるという解釈に固定せず、原文の祭儀的表現を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、レビ記の祭儀文にふさわしい品位を保った。義務・規定を示すヘブライ語の動詞連鎖は「しなければならない」で表し、「焼いて煙にし」によって祭壇での燻焼という専門的動作を平易に示した。
