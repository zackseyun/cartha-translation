id: LEV.17.11
reference: Leviticus 17:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: ja
  text: 肉の命は血の中にある[b]。わたしはそれを、祭壇の上であなたがたの命のために贖いを行うため、あなたがたに与えた。血が命によって贖いを行うからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「血は、その中にある命によって贖いを行うからである」。
    reason: alternative_reading
  - marker: b
    text: ヘブライ語ネフェシュ。この節では「命」の意。文脈によっては「人自身」「魂」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 命
  rationale: この祭儀的文脈では、非物質的な「魂」よりも、生き物を生かしている命を指す。節内の三つの用例を「命」で結び、血と命の論理的つながりを保った。
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: 生き物の身体を構成する「肉」を指すため、直接的で伝統的でもある「肉」とした。「肉体」より簡潔で、抽象的な身体概念に限定しない。
- source_word: בַּדָּם
  choice: 血の中に
  rationale: 前置詞בを場所・領域として素直に表し、命が血の中にあるという本文の言い方を保持した。
- source_word: נְתַתִּיו לָכֶם
  choice: わたしはその血を……あなたがたに与えた
  rationale: 男性単数代名詞の指示対象を日本語で明確にするため「その血」と補った。完了形は文脈に即して「与えた」とした。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇の上で
  rationale: עַלの基本的な空間表現と祭儀の場面を保った。
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵיכֶם
  choice: あなたがたの命のために贖いをするよう
  rationale: כפרの祭儀的意味を「贖いをする」で表し、特定の贖罪理論に狭めなかった。עַלは「のために」とし、נֶפֶשׁは前半との語彙的一貫性を保って「命」とした。
- source_word: בַּנֶּפֶשׁ יְכַפֵּר
  choice: 命によって贖いをする
  rationale: 難解で圧縮されたבַּנֶּפֶשׁを道具・手段の用法として訳しつつ、「命によって」というやや際立つ表現を残して原文の曖昧さを過度に解消しないようにした。
theological_decisions:
- issue: 祭儀法におけるנֶפֶשׁの意味
  choice: 節全体で「命」と訳す
  alternative: 「魂」または「人自身」と訳す
  rationale: この節は血の祭儀的働きを、血と結びついた命に基礎づけている。「魂」ではヘブライ語本文が必ずしも意図しない心身二元論を連想させうるため、「命」が文脈に最も適する。
- issue: 末尾のבַּנֶּפֶשׁの機能
  choice: 「命によって」と訳し、本文に保つ
  alternative: 「命がその中にあることによって」または「命のゆえに」と訳す
  rationale: 前置詞בの機能には解釈上の幅がある。本文では簡潔な手段表現を保ち、血が命との関係において贖いをするという緊張を残した。より説明的な理解は脚注に示した。
- issue: 血と贖いの関係
  choice: 主語を「血」として「血が……贖いをする」と表す
  alternative: 「血によって贖いがなされる」と受動的に表す
  rationale: 原文の強調された主語הַדָּם הוּאを保持し、血そのものが贖いをするという祭儀的表現を弱めなかった。
translation_notes:
  register: 現代標準日本語による、明瞭で格調ある祭儀法の文体。「贖い」はレビ記の専門的・神学的語彙として保持した。冒頭のכִּיは前文への理由説明だが、単独節としての自然さを考慮して第一文を断定し、続く内容との因果を「それゆえ」と「からである」で明示した。
