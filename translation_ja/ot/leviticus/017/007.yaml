id: LEV.17.7
reference: Leviticus 17:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: ja
  text: 彼らはもはや、自分たちのいけにえを、彼らがその後を追って淫行を行っている山羊の悪霊ども[a]に献げてはならない[b]。これは、代々にわたって彼らのための永続する定めとなる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「山羊の偶像」、「サテュロス」、または「山羊に結び付く霊的存在」とも訳せる。ヘブライ語は字義的には「毛深いもの」「雄山羊」を意味し得るが、ここでは不正な礼拝と結び付いた山羊的な存在または礼拝対象を指す。
    reason: lexical_alternative
  - marker: b
    text: 「その後を追って淫行を行っている」は、偶像礼拝による宗教的な不忠実を性的背信になぞらえた表現。
    reason: cultural_note
  - marker: c
    text: 「永遠の定め」または「恒久の定め」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: 自分たちのいけにえを…献げてはならない
  rationale: 否定辞を伴う未完了形の法的禁止を「献げてはならない」とした。日本語では同語反復を直訳すると不自然になるため、動詞は「献げる」、名詞は「いけにえ」とし、祭儀的意味を明確にした。
- source_word: עוֹד
  choice: もはや
  rationale: 従来または現に行われていた慣行を今後禁止する文脈なので、「再び」より「もはや」が適切である。
- source_word: לַשְּׂעִירִם
  choice: 山羊の姿をした悪霊ども
  rationale: שׂעירים は字義的には毛深いもの・雄山羊を指し得るが、ここでは不正な礼拝の対象となる山羊状の超自然的存在を指すと考えられる。「サテュロス」のような異文化の固有の神話像を持ち込まず、想定される意味を明瞭に表した。
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: 彼らがその後を慕って淫行をしている
  rationale: אַחֲרֵי の追随・追求の含意と、זנה の性的な比喩をともに残した。「偶像礼拝をする」と説明的に置き換えず、宗教的不忠実を性的背信として語る原文の緊張を保持した。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: 契約法規の定型句として、世代を越えて継続する規定を示す。「永遠の定め」も可能だが、日本語では無条件の形而上的永遠を強く示唆し得るため、「永続する」を採った。
- source_word: לְדֹרֹתָם
  choice: 代々にわたって
  rationale: 後続する各世代に継続して適用されることを、自然で格調ある現代日本語で表した。
theological_decisions:
- issue: שְּׂעִירִם が指す礼拝対象
  choice: 山羊の姿をした悪霊ども
  alternative: 雄山羊／山羊の偶像／サテュロス
  rationale: 犠牲を献げる対象であり、続く淫行の比喩も人格的な不正礼拝の対象を示唆するため、普通の山羊ではなく山羊状の霊的存在と解した。ただし脚注で語の幅を示した。
- issue: זֹנִים の宗教的不忠実の比喩
  choice: 淫行をしている
  alternative: 不実を働いている／偶像礼拝をしている
  rationale: 原文の露骨な性的比喩を弱めたり、解釈的な抽象語に置き換えたりせず保持した。「その後を慕って」を添えて、礼拝対象への追随という文脈を自然に示した。
- issue: חֻקַּת עוֹלָם の時間的範囲
  choice: 永続する定め
  alternative: 永遠の定め／恒久の定め
  rationale: עוֹלָם の持続性を保ちつつ、この法的定型句が必ずしも哲学的な無限時間を明示するとは限らないという幅を残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「いけにえ」「定め」は聖書の祭儀・法規文脈に適した一般的な語として用いた。「淫行」は原文の強い比喩を保持するため意図的に残した。
