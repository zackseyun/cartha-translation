source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: ja
  text: イスラエルの子らのうちのだれであれ、また彼らの間に寄留している寄留者であれ、食べることのできる獣または鳥を狩りで捕らえたなら、その血を流し出し、それを土で覆わなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それ」は直前に述べられた血を指すと考えられる。
    reason: ヘブライ語の目的語接尾辞の最も自然な指示対象を明示するため。
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: だれであれ
  rationale: 名詞の反復による分配的な意味を、現代日本語で自然な「だれであれ」とした。後続の所属句と合わせ、規定が個々人に及ぶことを示す。
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうちの
  rationale: בני ישראל の家族的・契約的表現を保ちつつ、「のうちの」によって前置詞 מן の範囲を明示した。
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: 彼らの間に寄留している寄留者
  rationale: גר の共同体内に居住する非イスラエル人という法的身分を「寄留者」で表し、同根語の反復も可能な範囲で保持した。
- source_word: יָצוּד צֵיד
  choice: 狩った
  rationale: 動詞と同根名詞によるヘブライ語の強調を、日本語では目的語となる「野獣または鳥」と自然につながる簡潔な狩猟表現にした。
- source_word: חַיָּה אוֹ עוֹף
  choice: 野獣または鳥
  rationale: 狩猟の文脈における חיה を家畜を含む一般的な「動物」ではなく「野獣」とし、עוף は「鳥」とした。
- source_word: אֲשֶׁר יֵאָכֵל
  choice: 食べることのできる
  rationale: ニファル形を文脈上、食用として許される、または適するものという意味に取り、許容の含みを残す表現とした。
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: その血を流し出し
  rationale: 法規定としての命令性は文末の「なければならない」で表し、דם の接尾辞は捕らえた野獣または鳥を指すため「その血」とした。
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: 土をかぶせなければならない
  rationale: עפר はこの場面では自然な「土」とし、目的語接尾辞は直前の血を指すと解した。日本語では「その血に土をかぶせる」の目的語を文脈上省略して自然に表現した。
theological_decisions:
- issue: וְכִסָּהוּ の接尾辞が何を指すか
  choice: 血に土をかぶせる
  alternative: 捕らえた動物を土で覆う、または埋める
  rationale: 最も近い先行詞は「その血」であり、レビ記17章の血に関する文脈にも適合する。ただし日本語本文では目的語を反復せず、注で指示対象を明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい端正さを保った。「イスラエルの子ら」「寄留者」により原文の共同体的・法的語感を残し、規定の義務性は「なければならない」で自然に示した。
