reference: Leviticus 17:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: ja
  text: 「イスラエルの家の者であれ、彼らの間に住む寄留者[a]であれ、だれでも、どのような血でも食べるなら、わたしはその血を食べる者[b]に顔を向けて敵対し、その者をその民の中から断ち除く[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者」は、イスラエル人の間に住む外国出身の居住者を指す。「在留異国人」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「その血を食べるネフェシュ」。ここでネフェシュは、違反した一人の人、すなわち当人を指す。
    reason: lexical_alternative
  - marker: c
    text: 「断ち除く」は契約上の刑罰を表す定型句。この箇所だけでは、死、共同体からの追放、または別の形の神の裁きのいずれを意味するかは特定されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: だれでも
  rationale: 語の反復による分配的・強意的な法的表現を、現代日本語で自然な「だれでも」とした。性別を不必要に限定しないが、適用対象が一人一人であることは明確に保つ。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: イスラエルの家の者
  rationale: 契約共同体を指す「イスラエルの家」というヘブライ語の法的表現を保ちつつ、「者」を補って日本語として理解しやすくした。
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: 彼らの間に住む寄留者
  rationale: גֵּרは一時的な旅人ではなく、イスラエル社会の中に居住する非生来の住民を指す。「寄留者」で法的・社会的含意を保ち、同語根の分詞は「住む」で自然に表した。
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: どのような血でも食べるなら
  rationale: יֹאכַלを通常の意味どおり「食べる」とし、כָּל דָּםの全面的禁止を「どのような血でも」で表した。
- source_word: וְנָתַתִּי פָנַי
  choice: わたしは…に顔を向けて敵対し
  rationale: 神が裁きのために当人へ向き合う慣用句の比喩を「顔を向けて」に残し、その否定的意味が日本語で誤解されないよう「敵対し」を添えた。
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: その血を食べる者
  rationale: נֶפֶשׁはここでは独立した「魂」ではなく違反した当人を指すため、「者」と訳した。
- source_word: אֶת הַדָּם
  choice: その血
  rationale: 定冠詞と直前の禁止対象への照応を「その」で明示した。
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: その者を…断ち除く
  rationale: 契約的・法的な裁きの定型句を、具体的な執行方法に限定せず「断ち除く」とした。
- source_word: מִקֶּרֶב עַמָּהּ
  choice: その民の中から
  rationale: מִקֶּרֶבの「ただ中から／間から」を自然な日本語で表し、נֶפֶשׁを受ける文法上の女性接尾辞は性を示さない「その者／その民」で処理した。
theological_decisions:
- issue: 「断ち除く」という刑罰定型句の意味
  choice: 具体的な手段を定めず、「その民の中から断ち除く」と訳す。
  alternative: 死刑にする／共同体から追放する／神の裁きによって滅ぼす
  rationale: 本文は重大な契約的裁きを告げるが、この節自体は死、追放、その他の神的裁きのいずれかを特定していないため、解釈上の幅を保った。
- issue: 神が「顔を向ける」という表現
  choice: 「顔を向けて敵対し」として、擬人的比喩と裁きの意味をともに示す。
  alternative: 立ち向かう／敵対する
  rationale: 「顔」という原文の像を消さず、好意的に顔を向ける意味ではないことを文脈に即して明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の宣告としての厳粛さを保った。「イスラエルの家」「顔を向けて敵対する」「断ち除く」など、神学的・法的に重要な原文の表現は過度に意訳せず残した。
