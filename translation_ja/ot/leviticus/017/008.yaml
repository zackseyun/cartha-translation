base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: ja
  text: また、彼らにこう言いなさい。「イスラエルの家の者、または彼らの間に寄留している寄留者で、全焼のささげ物またはいけにえをささげる者はだれでも[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「男、男」という男性形の反復で、法的表現として一人一人、すなわち「だれでも」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: また、彼らにこう言いなさい
  rationale: 接続詞の連続性を「また」で示し、モーセへの指示である未完了形を、自然で明確な命令表現とした。
- source_word: אִישׁ אִישׁ
  choice: 者はだれでも
  rationale: 語の反復による法的・分配的な意味、すなわち一人一人を例外なく対象とすることを、現代日本語で自然に表した。原文の男性形は脚注で明示した。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: イスラエルの家の者
  rationale: 契約共同体を指す定型表現「イスラエルの家」を保ちつつ、日本語の文として対象者が明確になるよう「者」を補った。
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: また彼らの間に寄留している寄留者も
  rationale: 名詞גֵּרと動詞גּוּרの語根上のつながりを「寄留者／寄留している」で保ち、イスラエルの中に居住する非イスラエル人という法的身分を示した。
- source_word: אֲשֶׁר יַעֲלֶה
  choice: ささげるなら
  rationale: 祭儀文脈におけるעלהのヒフィル形を「ささげる」と訳し、後続節へつながる条件的な構文を自然な日本語で示した。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 祭壇で全体を焼いて煙にする種類のささげ物であることを、現代の読者に分かりやすく示す定訳を採った。
- source_word: אוֹ זָבַח
  choice: あるいはいけにえ
  rationale: 全焼のささげ物と区別される、屠ってささげる祭儀的ないけにえを、簡潔で広い日本語として訳した。
theological_decisions:
- issue: אִישׁ אִישׁの性別と分配的用法
  choice: 本文では「者はだれでも」とし、男性形であることを脚注に記す
  alternative: 「男はだれでも」
  rationale: この反復表現の中心的機能は各個人を対象とする法的な分配性にある。日本語の「者はだれでも」はそれを明確に表し、原文の形態上の男性性は失われないよう脚注で示した。
- issue: גֵּרが表す共同体内の身分
  choice: 寄留者
  alternative: 在留外国人／よそ者
  rationale: 一時的な旅人や単なる見知らぬ人ではなく、イスラエル人の間に居住し、その法秩序の下にある非イスラエル人を指すため、聖書の法的・社会的含意を保つ「寄留者」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法にふさわしい端正な調子を保った。原文が次節へ続く未完の条件節で終わるため、日本語も読点で終えてその連続性を保持した。
