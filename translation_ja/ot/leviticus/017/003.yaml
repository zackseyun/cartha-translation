  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: ja
  text: イスラエルの家の者で、だれでも[a]、牛、羊、またはやぎを宿営の中でほふるにせよ、宿営の外でほふるにせよ――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「男、男」。一人一人に適用する分配的な表現で、ここではイスラエル共同体の者ならだれでも、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: 者はだれでも
  rationale: 名詞を重ねた分配的な慣用表現であり、一人一人に当てはまる「だれでも」の意味を自然な現代日本語で表した。原文の男性形については脚注で明示した。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: イスラエルの家に属する
  rationale: 契約共同体を表す「イスラエルの家」という原文の比喩的・民族的呼称を保ちつつ、「に属する」で日本語としての関係を明確にした。
- source_word: יִשְׁחַט
  choice: 屠る
  rationale: 単なる殺害ではなく、家畜を食用または儀礼のために殺すことを表す動詞なので、「殺す」より限定的な「屠る」を選んだ。
- source_word: שׁוֹר אוֹ כֶשֶׂב אוֹ עֵז
  choice: 牛、羊、またはやぎ
  rationale: 三種の家畜を年齢や性別で不必要に限定せず、それぞれ一般的な種類名で訳した。
- source_word: בַּמַּחֲנֶה ... מִחוּץ לַמַּחֲנֶה
  choice: 宿営の中で……宿営の外で
  rationale: 対照される二つの場所を明瞭に示し、「宿営」という荒野の移動共同体にふさわしい語を用いた。
- source_word: אֲשֶׁר ... אוֹ אֲשֶׁר
  choice: ……にせよ、……にせよ
  rationale: 二つの関係節が選言で並ぶ法文の構造を、日本語で自然な包括条件として表した。節末が次節に続くことはダッシュで示した。
