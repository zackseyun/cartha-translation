revisions:
- from: すべて肉なるものの命はその血であり、その命の中にあるからである[a]。それゆえ、わたしはイスラエルの子ら[b]に言った。『あなたがたは、どのような肉なるものの血も食べてはならない。すべて肉なるものの命はその血だからである。』それを食べる者は皆、断ち切られる。
  to: なぜなら、すべての生き物の命はその血にあり[a]、その血はその命のうちにあるからである。それゆえ、わたしはイスラエルの人々[b]に言った。『あなたがたは、どの生き物の血も食べてはならない。すべての生き物の命はその血にあるからである。』それを食べる者は皆、断たれる。
  rationale: 冒頭を「なぜなら」で始めて כִּי の理由提示を日本語として完結させた。「命はその血にあり」は、血と命の密接な関係を表す本文の反復を自然な現代語で保持する。後半の圧縮された構文については、本文で一義的な形而上学的説明を加えず、脚注に直訳寄りの可能性と解釈的な可能性を示した。
