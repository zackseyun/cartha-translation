id: LEV.17.14
reference: Leviticus 17:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: ja
  text: なぜなら、すべての生き物の命はその血にあり[a]、その血はその命のうちにあるからである。それゆえ、わたしはイスラエルの人々[b]に言った。『あなたがたは、どの生き物の血も食べてはならない。すべての生き物の命はその血にあるからである。』それを食べる者は皆、断たれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は圧縮された表現で、直訳に近くは「すべての生き物の命はその血であり、その血はその命のうちにある」とも訳せる。また、意味をくんで「その血がその命である」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「イスラエルの子ら」。すなわち、イスラエルの民。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 命
  rationale: この食物・犠牲規定の文脈では、物質と対置される「魂」ではなく、生き物を生かしている命を指す。血を食べてはならない理由とのつながりも明瞭になる。
- source_word: כָּל בָּשָׂר
  choice: すべて肉なるもの
  rationale: 生身の生き物を指す聖書的な表現を保ち、本文における反復を再現する。「すべての生き物」より形式的だが、現代日本語でも意味を追える。
- source_word: דָּם / דָּמוֹ
  choice: 血／その血
  rationale: 本節の禁止とその根拠を結ぶ中心語なので、一貫して直接的に訳す。
- source_word: בְנַפְשׁוֹ הוּא
  choice: その命の中にある
  rationale: 前置詞בְּを「中に」として表し、血と命との結びつきを示す圧縮された原文を、解釈で一つに限定せずに残した。より自然な別解は脚注に示す。
- source_word: וָאֹמַר
  choice: それゆえ、わたしは……言った
  rationale: 直前の命と血の原則を受けて禁止命令へ進む論理的なつながりを示す。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の親族的な呼称を本文に保つ。現代語としての意味は脚注で補う。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならない
  rationale: 契約法における直接的な禁止を、現代日本語の厳粛で明快な法的表現で訳す。
- source_word: כָּל אֹכְלָיו
  choice: それを食べる者は皆
  rationale: 分配的な意味を持つ表現として、該当する者すべてを指す自然な日本語にした。「それ」は直前の血を受ける。
- source_word: יִכָּרֵת
  choice: 断ち切られる
  rationale: 契約上の制裁を表す受動形の慣用句を、その実施方法を特定せずに保つ。
theological_decisions:
- issue: 血とנֶפֶשׁの関係
  choice: נֶפֶשׁを「命」と訳し、血と命の密接な関係を述べる表現として訳した。
  alternative: 「魂」と訳す、または「血が命そのものである」と一義的に言い切る。
  rationale: ここでの論旨は血を食べることの禁止を生き物の命に基づかせることにあり、後代の心身二元論的な「魂」を持ち込まない。また、原文の圧縮された構文が許す幅を脚注に残した。
- issue: 「断ち切られる」という制裁の内容
  choice: 制裁の具体的方法を説明せず、「断ち切られる」とした。
  alternative: 「処刑される」「共同体から追放される」「民から除かれる」。
  rationale: 原文の定型句だけでは、この箇所で死刑、共同体からの排除、神による裁きのいずれかに限定できないため、神学的・法的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、祭儀法の厳粛さと原文の反復を保った。「肉なるもの」「断ち切られる」は意図的に聖書的・法的な響きを残し、曖昧な箇所は本文で過度に平滑化せず脚注で別訳を示した。
