  source_fidelity: 原文は血と命の関係を反復的・圧縮的に述べる。草案の「その命の中にあるからである」は、文末の「からである」が文頭の כִּי と重なって文法的に不自然であり、また「その血」の主語が明示されない。本文では血と命の関係を「命はその血にある」と明瞭に訳し、圧縮された後半句の別の取り方は脚注に保持する。制裁句は具体化せず訳す。
  naturalness: 「肉なるもの」「どのような肉なるもの」は現代標準語として不自然で、意味も取りにくい。「生き物」とすることで、この文脈での כָּל־בָּשָׂר の指示対象を自然に表せる。「断たれる」は契約上の制裁の慣用句として「断ち切られる」より自然であり、制裁の方法を限定しない。
