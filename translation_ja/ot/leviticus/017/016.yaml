id: LEV.17.16
reference: Leviticus 17:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: ja
  text: しかし、もし衣服を洗わず、体を洗わないなら、その人は自分の咎を負う。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「咎を負う」は、罪責を担うこと、またその罪に伴う責任や罰を受けることを含み得るヘブライ語の法的表現。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前節で命じられた清めを行わない場合を対照的に示す条件節として、文脈上の逆接を自然な日本語で表した。
- source_word: יְכַבֵּס
  choice: 衣服を洗う
  rationale: 目的語は原文では省略されているが、前節と動詞 כבס の通常の用法から衣服を指すことが明らかなため、日本語では補った。
- source_word: וּבְשָׂרוֹ לֹא יִרְחָץ
  choice: 体を洗わない
  rationale: בשר の字義は「肉」だが、沐浴の文脈では身体全体を指す。「体を洗う」は現代日本語で明瞭かつ自然である。
- source_word: וְנָשָׂא
  choice: その人は…負う
  rationale: 条件不履行の結果を表す法律的な言い回しとして訳した。
- source_word: עֲוֹנוֹ
  choice: 自分の咎
  rationale: עון は罪責とその結果・処罰責任の両面を含み得る。「咎」はこの幅を比較的保ち、「負う」と結びついて自然な法律的・宗教的表現となる。
theological_decisions:
- issue: 「自分の עון を負う」という法的定型句の意味
  choice: 「自分の咎を負う」とし、罪責とその結果のいずれか一方に限定しない。
  alternative: 「自分の罪を負う」または「自分の罪の罰を受ける」
  rationale: ヘブライ語の表現は、本人の罪責だけでなく、それに伴う責任や結果をも含み得る。本文ではその緊張を保ち、注で意味の幅を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔で厳粛な調子を保った。「身体」より日常的な「体」を選び、「咎」によって原語の法的・神学的な意味の幅を残した。
