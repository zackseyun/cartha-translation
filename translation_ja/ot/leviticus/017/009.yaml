  to: また、それをヤハウェに献げるために会見の天幕の入り口へ持って来ないなら[a]、その者は自分の民の中から断たれる[b]。
  rationale: 原文は、いけにえをヤハウェに献げる目的で会見の天幕の入り口へ持参しない者を対象とする。語順を日本語として自然に整えつつ、「献げるために」を明示してこの目的関係と否定の範囲を保持した。脚注の内容とアンカーは、改訂文でもそれぞれ適切に対応している。
