  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: ja
  text: また、それをヤハウェに献げるために会見の天幕の入り口へ持って来ないなら[a]、その者は自分の民の中から断たれる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「それをヤハウェのために行う（または、作る）」。ここでは、いけにえを献げることを指すヘブライ語の祭儀的表現。
    reason: lexical_alternative
  - marker: b
    text: 「断たれる」は法的な定型句であり、ここでは刑罰の具体的方法が示されていない。契約共同体から除かれること、または神から直接裁かれることを含意し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: 入り口
  rationale: 天幕へ入る箇所を指す語であり、現代日本語として自然で明瞭な「入り口」とした。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルの聖所を指す定型表現として、神と会う場という名称の意味を保つ「会見の天幕」とした。
- source_word: יְבִיאֶנּוּ
  choice: それを携えて来て
  rationale: 接尾辞は文脈上、いけにえの動物を指す。「携えて来る」により、聖所へ持参する具体的な行為を自然に表した。
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: ヤハウェに献げる
  rationale: 字義的には「それをヤハウェのために行う／作る」だが、ここでは祭儀的にいけにえをささげることを表す慣用句である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で音写した。
- source_word: וְנִכְרַת
  choice: 断たれる
  rationale: 法的定型句の比喩を保持し、死刑、共同体からの追放、神による裁きなど、本文が特定していない執行形態を限定しない。
- source_word: הָאִישׁ הַהוּא
  choice: その者
  rationale: 違反した個人を指す法文として自然な日本語にした。文法上の男性形を不必要に強調せず、指示性と個人責任を保っている。
- source_word: מֵעַמָּיו
  choice: 自分の民の中から
  rationale: その者が属する民の共同体から切り離されるという関係を、日本語で明確にした。
theological_decisions:
- issue: 「断たれる」という刑罰の意味
  choice: 刑罰の具体的方法を特定せず、「自分の民の中から断たれる」とした。
  alternative: 「死刑に処せられる」「共同体から追放される」「滅ぼされる」
  rationale: ヘブライ語の法的定型句は、この箇所だけでは死、追放、子孫の断絶、神の直接的裁きのいずれかを明示しないため、その緊張と曖昧さを保持した。
- issue: הָאִישׁ הַהוּא の表現
  choice: その者
  alternative: その男
  rationale: 文法的には男性単数だが、ここで中心となる意味は当該の違反者を特定することにある。「その者」は現代日本語の法文として自然で、原文にない包括性を積極的に付加する表現でもない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く接続を「また」で示し、祭儀用語は過度に専門的にせず、法的定型句の重みと曖昧さを残した。
