id: LEV.17.12
reference: Leviticus 17:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: ja
  text: それゆえ、わたしはイスラエルの子ら[a]に言った。『あなたがたのうち、だれも血を食べてはならない。また、あなたがたの間に住む寄留者[b]も、血を食べてはならない。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエルの子孫」「イスラエル人」。ヘブライ語は字義的には「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 「寄留者」とは、イスラエル人ではないが、その共同体の中に住み、共同体の法のもとで生活する人を指す。「在留外国人」または文脈により「外国人」とも訳せる。
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 直前に示された、命と血との関係に基づく結論を導く表現として、原文の推論の力を簡潔かつ格調ある現代日本語で表す。
- source_word: אָמַרְתִּי
  choice: わたしは……言った
  rationale: 基本動詞「言う」の完了形を、律法の説明が続く文脈に即して過去形で訳し、「命じた」などの解釈を加えない。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの男性複数形「イスラエルの子ら」を保持する。日本語として理解可能であり、「イスラエル人」と一般化するより原文の定型表現を明示できる。
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: あなたがたのうち、だれも
  rationale: נֶפֶשׁ はここで個々の人を指すため、「魂」と直訳せず、否定辞と合わせて禁止の分配的な意味を自然に表す。
- source_word: לֹא תֹאכַל דָּם
  choice: 血を食べてはならない
  rationale: 法的禁止を明確な現代日本語で表しつつ、「血を食べる」という原文の具体的表現を言い換えずに残す。
- source_word: הַגֵּר
  choice: 寄留者
  rationale: イスラエル共同体の中に居住する非イスラエル人という社会的・法的立場を表す語として、「外国人」よりも共同体内での居住という含意を保つ。
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: あなたがたの間に住む
  rationale: גֵּר と同根の分詞が示す居住状態を自然な日本語で表す。「寄留する寄留者」という不自然な重複は避けながら、意味上のつながりを保持する。
- source_word: לֹא יֹאכַל דָּם
  choice: 血を食べてはならない
  rationale: 寄留者にも同じ禁止が及ぶことを、先行する命令と同一の表現で示し、原文の反復を保つ。
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל における性を伴う契約共同体の呼称
  choice: イスラエルの子ら
  alternative: イスラエルの子孫／イスラエル人
  rationale: 原文の「子ら」という男性複数の定型句を保持する一方、それが共同体の男性だけに命令を限定するとの解釈は本文に付加しない。訳注で慣用的な代案を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔で dignified な調子を保った。「だれも……してはならない」で禁止を自然に示し、二つの禁止を同じ表現で反復した。引用符は、神が以前イスラエルに語った内容としての直接話法を明示する。
