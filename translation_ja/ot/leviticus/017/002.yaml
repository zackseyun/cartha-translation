base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: ja
  text: 「アロンとその息子たち、およびイスラエルの民すべて[a]に告げ、彼らにこう言いなさい。『これは、ヤハウェが命じられた事柄である[b]。すなわち、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルのすべての子ら」。慣用的には「すべてのイスラエル人」。
    reason: lexical_alternative
  - marker: b
    text: 「これは、ヤハウェが命じられた言葉である」または「こと」とも訳せる。ヘブライ語の「言葉」は「事柄」「こと」をも意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げて
  rationale: ピエル命令形。後続の「こう言いなさい」と自然につながるよう、直接的な伝達命令として訳した。
- source_word: בָּנָיו
  choice: その子ら
  rationale: 文脈上は祭司であるアロンの息子たちを指す。「子ら」は現代日本語で簡潔かつ厳粛で、男性の子孫を指す文脈も保てる。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルのすべての民
  rationale: 字義は「イスラエルの子ら」だが、民族共同体を表す定型句として、日本語で誤解なく自然な「イスラエルのすべての民」とした。字義的表現は脚注に残した。
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: こう言いなさい
  rationale: 継続する命令を自然な日本語で表し、直後に引用される発言内容を明示する。
- source_word: זֶה הַדָּבָר
  choice: これは…ことである
  rationale: דבר の「言葉・事柄・こと」という幅を踏まえ、ここでは後続する命令内容を指す自然な「こと」を採用した。別訳は脚注に示した。
- source_word: צִוָּה
  choice: 命じられた
  rationale: 完了形の行為を表しつつ、神への敬意を示す日本語の尊敬表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: לֵאמֹר
  choice: すなわち、
  rationale: 命令内容が次節へ続くことを示す引用導入句。ヘブライ語の定型的な「言って」を逐語訳せず、現代日本語で自然に継続を示した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を保持し、称号への置換を避けた。
- issue: בני ישראל の共同体的範囲
  choice: イスラエルのすべての民
  alternative: イスラエルのすべての子ら
  rationale: この定型句は民族共同体全体を指すため、性別を不必要に限定せず、通常の日本語でその指示対象を明確にした。字義的形は脚注で保持した。
- issue: זה הדבר の意味幅
  choice: これは、…ことである
  alternative: これは、…言葉である
  rationale: 後続する具体的規定を導入する文脈では「こと」が自然だが、「言葉」という語義も可能なので脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の告知にふさわしい簡潔で厳粛な調子を保った。節末は次節へ続く引用導入なので「すなわち、」で開いた形にした。
