source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: ja
  text: 死んでいた動物や、野獣にかみ裂かれた動物[a]を食べた者はだれでも、イスラエル人であっても、寄留者[b]であっても、衣服を洗い、水で身を洗わなければならない。その者は夕方まで儀礼的に汚れているが、その後は清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死んでいた動物」は、正規に屠られずに死んだ動物の死体を指す。「野獣にかみ裂かれた動物」は、捕食獣に襲われて引き裂かれた動物を指す。
    reason: lexical_alternative
  - marker: b
    text: 「寄留者」は、イスラエル人の間に住む外国出身の居住者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 者はだれでも
  rationale: 祭儀法の文脈では非物質的な「魂」ではなく、個々の人を指す。日本語の条件文として自然な形にした。
- source_word: נְבֵלָה
  choice: 死んでいた動物
  rationale: 正規に屠られず、自然死などによって死体となった動物を指す語であり、単なる抽象的な「死体」より対象を明確に示す。
- source_word: טְרֵפָה
  choice: 野獣にかみ裂かれた動物
  rationale: 捕食獣に襲われ、引き裂かれた動物という原語の意味を明示した。
- source_word: בָּאֶזְרָח
  choice: この国に生まれた者
  rationale: イスラエル社会の土着の成員を指す。現代日本語で理解しやすく、寄留者との対比も保てる。
- source_word: בַגֵּר
  choice: 寄留者
  rationale: 一時的な旅行者ではなく、イスラエルの中に居住する外来者を表す法的・社会的な語として用いた。
- source_word: וְכִבֶּס בְּגָדָיו
  choice: 衣服を洗い
  rationale: 要求される祭儀上の処置を、簡潔で自然な現代日本語にした。
- source_word: וְרָחַץ בַּמַּיִם
  choice: 水を浴び
  rationale: 身体を水で洗う行為を表すため、「水を浴びる」とした。
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: 夕方まで汚れている
  rationale: 道徳的な罪悪ではなく祭儀上の状態を指す。「夕方まで」という期限をそのまま保持した。
- source_word: וְטָהֵר
  choice: その後は清くなる
  rationale: 洗浄と夕方までの経過の後、祭儀上の清い状態に戻ることを示す。接続辞は時間的帰結が分かるように訳した。
theological_decisions:
- issue: レビ記の清浄規定における汚れの性質
  choice: טָמֵא／טָהֵרを祭儀上の状態として「汚れている／清くなる」と訳す。
  alternative: 「けがされる／清められる」または道徳的罪責を含む表現
  rationale: 本文は死肉を食べた後の一時的な祭儀上の身分と、その解消手続きを扱う。道徳的な堕落や罪責を訳文に付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、レビ記の法規としての厳粛さを保った。「汚れ／清い」は祭儀上の対概念として統一し、「寄留者」はやや専門的だが本文の社会的区分を正確に保つため採用した。
