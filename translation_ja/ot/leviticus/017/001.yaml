  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の名YHWH（ヤハウェ）。伝統的には「主」と訳される。
    reason: 本文の「ヤハウェ」が原文の固有の神名יהוהを訳したものであることと、伝統的な「主」という訳語を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: דבר のワイイクトル形は新たな発話場面を導入する。神を主語とする定型句として、現代日本語で自然かつ荘重な敬語表現とした。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した表記を本文に用い、これが神の固有名YHWHであることを脚注で明示した。
- source_word: אֶל
  choice: に
  rationale: 発話の相手を示す前置詞であり、日本語では「モーセに」とするのが自然である。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を採用した。
- source_word: לֵאמֹר
  choice: （独立には訳出しない）
  rationale: 後続する発言内容を導く定型的不定詞である。日本語では「告げられた」でその機能を自然に表せるため、「言って」のような重複表現を避けた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 本文では「主」、脚注で「原文は神の名YHWH（ヤハウェ）」と示す
  alternative: 本文で「ヤハウェ」
  rationale: 原文が称号ではなく固有名を用いている事実を脚注で保持しつつ、一般の日本語読者に自然で定着した本文表現を採用した。神名の推定発音には不確実性があるため、その点も脚注で簡潔に示した。
translation_notes:
  register: 明快な現代標準日本語。ヘブライ語の発話導入句を日本語の自然な叙述に整えつつ、敬意と荘重さを保った。
