id: LEV.17.4
reference: Leviticus 17:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: ja
  text: また、それを、主[a]の幕屋の前で主へのささげ物として献げるために、会見の天幕の入口へ携えて来なかったなら、その人には血が帰せられる。彼は血を流したのであり、その人は民の中から断たれる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文で「主」と訳した語は、神の固有名であるיהוה（一般に「ヤハウェ」と表記される）。
    reason: 原語情報
  - marker: b
    text: 「断たれる」が、死、追放、あるいは別の形で契約共同体から除かれることのどれを指すかは、ここでは明示されていない。
    reason: 法的・文化的注記
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口
  rationale: 「入口」はפֶּתַחの自然な訳であり、「会見の天幕」は聖所を指す定着した名称としてאֹהֶל מוֹעֵדを明確に表す。
- source_word: הֱבִיאוֹ
  choice: それを……携えて来て
  rationale: ヒフィル形は「持って来る」の意。接尾辞の目的語は前節で屠った動物を指すため、「それを」とした。
- source_word: לְהַקְרִיב קָרְבָּן
  choice: ささげ物として献げる
  rationale: הקריבの「近づける、献呈する」という祭儀的意味と、קָרְבָּןの「ささげ物」を、過度に不自然な反復を避けつつ表す。
- source_word: לַיהוָה / מִשְׁכַּן יְהוָה
  choice: 主への／主の幕屋
  rationale: 神名יהוהは日本語聖書で広く通用する「主」とし、神名であることを脚注で示す。מִשְׁכָּןは祭儀的な住まいを指すため「幕屋」とした。
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: その人には血を流した責任があると見なされる
  rationale: 字義は「その人に血が数えられる」だが、文脈上は流血についての法的責任を負わせる表現である。直後の「彼は血を流した」とのつながりを保った。
- source_word: דָּם שָׁפָךְ
  choice: 彼は血を流した
  rationale: 流血行為を表すヘブライ語の定型句を、そのまま自然な日本語で表した。
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: その人は民の中から断たれる
  rationale: 契約法上の定型句を形式的に保ち、この節だけでは特定されない処罰の方法を訳文で限定しない。
theological_decisions:
- issue: דָּם יֵחָשֵׁבの法的慣用句
  choice: その人には血を流した責任があると見なされる
  alternative: その人に血が帰せられる／その人には血の罪があると見なされる
  rationale: 逐語的な「血が数えられる」だけでは現代日本語で意味が伝わりにくい。流血責任という法的意味を明示しつつ、「罪」という神学的語を本文に追加することは避けた。
- issue: 「断たれる」という処罰の内容
  choice: 民の中から断たれる
  alternative: 処刑される／追放される
  rationale: この節のכרתニファル形は、死刑、追放、その他の契約共同体からの除去のいずれかを明示しないため、曖昧さを保持した。
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では明瞭で dignified な慣用表記「主」を採用し、原文が固有の神名であることは脚注に残した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で厳かな法文調とした。節が前節から続く条件文であることを「また、それを」で示した。「会見の天幕」「幕屋」「断たれる」は祭儀・契約上の術語として保持し、意味が不明確になり得る箇所には脚注を付した。
