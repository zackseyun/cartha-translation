revisions:
- from: また、それを会見の天幕の入口に携えて来て、主[a]の幕屋の前で主へのささげ物として献げなかったなら、その人には血を流した責任があると見なされる。彼は血を流したのであり、その人は民の中から断たれる[b]。
  to: また、それを、主[a]の幕屋の前で主へのささげ物として献げるために、会見の天幕の入口へ携えて来なかったなら、その人には血が帰せられる。彼は血を流したのであり、その人は民の中から断たれる[b]。
  rationale: 持参しなかったという原文の条件を日本語で明示するため、文頭の接続を「携えて来なかったなら」に改め、その持参の目的を「主の幕屋の前で主へのささげ物として献げるために」とした。法的慣用句は、過度な神学的説明を本文へ加えず「血が帰せられる」と訳した。脚注aは表記を整え、脚注bは原文の処罰内容に関する曖昧さを維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:21:37Z'
review_pass:
  verdict: revise
  source_fidelity: 条件節の主動詞は「携えて来なかった」でなければならない。現行の「入口に携えて来て、…献げなかったなら」は、動物を入口へは持って来たが献げなかった場合を指し得るため、ヘブライ語の「入口へ持って来なかった」を逆転させるおそれがある。改訂は、持参しなかったことと、その目的である献呈を明確に結び付ける。『血がその人に帰せられる』はדם יחשבの משפט的慣用句を保ち、後半の『彼は血を流した』との反復も保持する。
  naturalness: 改訂文は現代標準語として通じる簡潔な法文調である。「主の幕屋の前で」を「献げる」に係らせ、「会見の天幕の入口へ」を「携えて来なかった」に係らせることで、原文の統語関係を日本語で明瞭にした。脚注aの神名表記には語と説明の間の区切りを加えた。
  terminology: 「会見の天幕」「幕屋」「ささげ物」「断たれる」は、祭儀および法的定型表現を保つ適切な訳語である。「主」は日本語聖書の慣用に沿い、脚注でיהוהという固有名を明示する。「断たれる」の処罰形態は本文でも脚注でも限定していない。
  issues:
  - severity: high
    issue: 条件節における「携えて来て」の統語的な誤解可能性
    rationale: 原文は『会見の天幕の入口へ、それを持って来なかったなら』という不持参を条件とする。現行文は『持って来て、献げなかったなら』と読め、持参自体を肯定してしまう可能性がある。
  - severity: low
    issue: 脚注aの神名と説明の表記上の区切り
    rationale: 「固有名יהוה」は日本語として読みにくい。『固有名であるיהוה』または括弧を用いる形が明瞭である。
