revisions:
- from: これは、イスラエルの民[a]が野で屠っているいけにえを、ヤハウェのもとへ、すなわち会見の天幕の入り口にいる祭司のもとへ携えて来て、それをヤハウェへの交わりのいけにえ[b]として屠るためである。
  to: これは、イスラエルの民[a]が野で屠っている自分たちのいけにえを、ヤハウェのもとへ、会見の天幕の入口へ、祭司のもとへ携えて来て、それらをヤハウェへの平和のいけにえ[b]として屠るためである。
  rationale: 目的を表す文構造と、原文の三つの方向句を保ちながら、祭司の所在を原文以上に明示する表現を除いた。「平和のいけにえ」は英語監査訳の "peace offerings" と対応し、שְׁלָמִים の意味を共同性や和解に限定しない。
