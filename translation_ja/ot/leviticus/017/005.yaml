id: LEV.17.5
reference: Leviticus 17:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: ja
  text: これは、イスラエルの民[a]が野で屠っている自分たちのいけにえを、ヤハウェのもとへ、会見の天幕の入口へ、祭司のもとへ携えて来て、それらをヤハウェへの平和のいけにえ[b]として屠るためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イスラエルの子ら」。ここではイスラエルの民全体を指す。
    reason: 原文の家族的表現と、その文脈上の指示範囲を示すため。
  - marker: b
    text: 「交わりのいけにえ」「健やかさのいけにえ」とも訳せる。
    reason: שְׁלָמִים は特定の犠牲分類を指し、その語義には平和・完全さ・健やかさに関わる含みがあるため。
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: これは……ためである
  rationale: 前節の命令の目的を示す表現。日本語では文脈とのつながりが明確で自然な目的構文とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民
  rationale: 字義は「イスラエルの子ら」だが、ここでは契約共同体全体を指す。現代日本語で明瞭かつ自然な表現を本文に採用し、字義を脚注に示した。
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: 彼らが野で屠っているいけにえ
  rationale: 名詞と動詞に共通する זבח の語根上の結びつきを、「いけにえ」と「屠る」で可能な限り保持した。分詞は継続中または常習的な行為を表し得る。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 野で
  rationale: 直訳的な「野の面で」ではなく、聖所外の野外を指すヘブライ語表現を簡潔で自然な日本語にした。
- source_word: לַיהוָה אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: ヤハウェのもとへ、すなわち会見の天幕の入り口にいる祭司のもとへ
  rationale: 三つの方向表現の関係を明確にし、祭司のもとへ携えることがヤハウェのもとへ携える具体的な仕方であることを自然な日本語で示した。
- source_word: זִבְחֵי שְׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִים は平和、健全、交わりに関係する特定の犠牲祭儀。共同の食事を伴う性格が伝わりやすい訳を採り、別訳を脚注に残した。
- source_word: יהוה
  choice: ヤハウェ
  rationale: 本文に記された神の固有名を、称号に置き換えず日本語で音写した。
theological_decisions:
- issue: 神名 יהוה の訳出
  choice: ヤハウェ
  alternative: 主
  rationale: ヘブライ語本文の固有名を明示し、称号への置換を避けた。
- issue: זִבְחֵי שְׁלָמִים の祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 語が含み得る平和・健全・共同参与の意味を一つに断定し切れないため、本文では祭儀の共同性が伝わる表現を用い、他の妥当な訳語も脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀本文にふさわしい厳粛さを保った。「屠る」は犠牲動物を殺す行為を正確に表すため採用した。「会見の天幕」は אֹהֶל מוֹעֵד の定着した訳語として用いた。
