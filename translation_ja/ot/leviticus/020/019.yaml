  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: ja
  text: あなたの母の姉妹、または父の姉妹の裸をあらわにしてはならない。彼は自分の肉親をあらわにしたのである[a]。二人は自分たちの罪を負う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の肉親をあらわにした」は、「自分の近親者をあらわにした」とも訳せる。ヘブライ語の「肉親」に当たる語は、字義的には「肉」を背景に持つ親族表現である。
    reason: lexical_alternative
  - marker: b
    text: 「自分たちの罪を負う」は、「自分たちの罪責を負う」、または「自分たちの罪に対する罰を受ける」という意味にも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: 裸をあらわにしてはならない
  rationale: レビ記の性に関する禁止規定で繰り返される「裸をあらわにする」という婉曲的な法的表現を保ち、単に「性的関係を持つ」と言い換えて原文の表現を平板化しないため。
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: あなたの母の姉妹、また父の姉妹
  rationale: 「おば」よりも原文の親族関係を正確に示し、母方と父方の並行関係を明確に保つため。
- source_word: כִּי
  choice: のである
  rationale: 禁止の理由を導く説明的な働きを、現代日本語として自然でありながら荘重さも保つ形で表した。
- source_word: שְׁאֵרוֹ
  choice: 自分の肉親
  rationale: שְׁאֵר は字義的には「肉」を背景に持つ親族語だが、ここでは近親者を指す。「自分の肉親」は血縁の含意と原文の身体的比喩の双方をある程度保つ。
- source_word: הֶעֱרָה
  choice: さらした
  rationale: 「裸をあらわにする」との語句の単調な重複を避けつつ、ערה の「むき出しにする、さらす」という意味を保った。
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: その罪を負う
  rationale: נשא עון の定型句を簡潔に訳し、罪そのもの、罪責、またその結果を負うという原文の意味の幅を残した。
theological_decisions:
- issue: 理由節の単数形と結末の複数形の切り替え
  choice: 「その者は」と単数で述べた後、「二人は」と複数に切り替える。
  alternative: 全体を複数にそろえて「二人は自分たちの肉親をさらした」とする。
  rationale: ヘブライ語は שְׁאֵרוֹ と הֶעֱרָה で単数を用い、עֲוֺנָם יִשָּׂאוּ で複数に移る。この不連続を消さず、行為の説明は単数の違反者に、責任は双方に向けられているという原文の法的表現を保った。
- issue: 性的な婉曲表現を本文で明示的に言い換えるか
  choice: 「裸をあらわにする」という原文の慣用表現を保持する。
  alternative: 「性的関係を持ってはならない」と明示する。
  rationale: 周辺文脈から性的意味は明らかであり、レビ記全体に共通する法的・文学的表現を保持するほうが原文の連関をよく伝える。
- issue: עָוֹן の罪・罪責・処罰という意味の幅
  choice: 本文では「罪を負う」とし、意味の幅を注に示す。
  alternative: 「罪の罰を受ける」と刑罰の意味に限定する。
  rationale: עָוֹן は罪、罪責、その結果としての処罰を表し得るため、本文で一つに限定せず原文の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、レビ記の法文らしい簡潔さと荘重さを保った。「母の姉妹」「父の姉妹」により親族関係を明示し、「裸をあらわにする」「罪を負う」という原文の定型的な表現を維持した。
