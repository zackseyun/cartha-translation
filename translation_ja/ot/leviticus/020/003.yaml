id: LEV.20.3
reference: Leviticus 20:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: ja
  text: わたし自身がその男に顔を向け、彼に敵対し、彼をその民の中から断ち切る。[a] 彼が自分の子孫の一部をモレクに与え、わたしの聖所を汚し、わたしの聖なる名を冒涜するためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼をその民の中から断ち切る」は、死または共同体からの排除を含み得る裁きの表現であり、ここではその方法を限定していない。また、「モレクに与えた」は、文脈上、子どもをいけにえとしてささげることを指すと考えられるが、ヘブライ語は直訳すると「自分の子孫の一部をモレクに与えた」である。
    reason: 「断ち切る」がいう裁きの具体的方法と、「モレクに与えた」という一般動詞の、文脈から推測される犠牲的含意の両方を、本文に解釈を加えず説明するため。
lexical_decisions:
- source_word: וַאֲנִי
  choice: わたし自身が
  rationale: 独立人称代名詞による強調を、自然な現代日本語で明示する。
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: その男に顔を向けて敵対し
  rationale: 神が意図的にその者に敵対するという慣用句の意味を保ちつつ、日本語で誤解なく伝える。「その男」で指示詞と男性単数を反映する。
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: 彼をその民の中から断ち切る
  rationale: 契約的・司法的表現の「断ち切る」を保持し、裁きの具体的方法は限定しない。
- source_word: מִזַּרְעוֹ
  choice: 自分の子孫のうちから
  rationale: זרעの子孫という意味と、מןの部分を示す働きの双方を表す。
- source_word: נָתַן לַמֹּלֶךְ
  choice: モレクに与え
  rationale: 動詞נתןの基本義「与える」を保持し、この節だけでは明記されない「いけにえとして」を本文に補わない。
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: わたしの聖所を汚し
  rationale: 祭儀的な汚れを表すטמאと、מקדשの聖所という意味を簡潔に反映する。
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: わたしの聖なる名を冒瀆した
  rationale: 神の名を聖でないものとして扱うחללの重大さを、定着した宗教語「冒瀆」で表す。
theological_decisions:
- issue: モレクに関わる行為の性質
  choice: 本文では「自分の子孫のうちからモレクに与え」とする。
  alternative: 「自分の子どもの一人をモレクへのいけにえとしてささげ」
  rationale: 文脈は子どもの犠牲を強く示すが、この節の動詞自体は「与える」であるため、本文では原文の表現を保ち、解釈は脚注で示す。
- issue: 神自身による裁きと「顔」の慣用句
  choice: 「わたし自身がその男に顔を向けて敵対し」とする。
  alternative: 「わたしはその男に敵対し」
  rationale: 神の直接的関与を示す強調と、顔を向けるというヘブライ語の比喩を残しながら、敵対の意味を明確にする。
- issue: 「断ち切る」が指す裁き
  choice: 裁きの具体的方法を特定せず「断ち切る」とする。
  alternative: 「滅ぼす」または「共同体から追放する」
  rationale: この定型句が死、追放、神による裁きのいずれを具体的に指すかを本文だけで一義的に限定せず、原文の含みを保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「冒瀆」はやや文語的だが、神の聖なる名を汚す行為の宗教的・法的重みを的確に伝える。神の発言として「わたし」を用いた。
