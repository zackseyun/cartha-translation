  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: ja
  text: 自らを聖別し[a]、聖なる者でありなさい。わたしがあなたがたの神、ヤハウェだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
