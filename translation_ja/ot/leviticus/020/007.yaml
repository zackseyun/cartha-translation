    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: 自らを聖別し
  rationale: קדשׁのヒトパエル形が持つ能動的・再帰的な意味を「自らを」で明示する。後続の「聖なる者となりなさい」との区別も保つ。
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: 聖なる者となりなさい
  rationale: היהと形容詞קָדוֹשׁの組み合わせを、先行する命令に続く命令として自然に表現する。「聖でありなさい」より現代日本語として明瞭で、状態へ至る含みも保持する。
- source_word: כִּי
  choice: だからである
  rationale: 命令の根拠を示す因果関係を明確にする。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 複数接尾辞を「あなたがたの」で表し、文脈上単数を指すאֱלֹהִיםを「神」と訳す。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を保持し、称号への代替を避ける。
- issue: 自己聖別と聖なる状態の関係
  choice: 「自らを聖別し」と「聖なる者となりなさい」を並列の命令として訳す
  alternative: 「聖なる者となるために、自らを聖別しなさい」
  rationale: 接続詞וְによる並列を保ち、目的関係を本文以上に確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の命令にふさわしい格調を保った。「聖別」は一般語よりやや専門的だが、後半の「聖なる者」との意味上の連関、および能動的な自己奉献を簡潔に表せるため採用した。
