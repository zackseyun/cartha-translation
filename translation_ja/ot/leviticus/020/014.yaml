id: LEV.20.14
reference: Leviticus 20:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: ja
  text: ある男が女とその母を共に取るなら[a]、これはみだらな行いである[b]。彼とその二人の女を火で焼かなければならない[c]。そうすれば、あなたがたの間にみだらな行いがなくなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は字義的には「女とその母を取る」。ここで「取る」は法的文脈では妻として迎えることを指し得るが、婚姻を明示する別の語は用いられていない。
    reason: lexical_alternative
  - marker: b
    text: 「みだらな行い」と訳した語は、「破廉恥な行い」「甚だしい悪」「忌まわしい行い」とも訳し得る、重大な性的違反を表す語。
    reason: lexical_alternative
  - marker: c
    text: 「その二人の女」とは、先に挙げられた女とその母を指す。
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: ある男
  rationale: 男性単数で、この規定における男性当事者を指すため、性別を明示した。
- source_word: יִקַּח אֶת אִשָּׁה וְאֶת אִמָּהּ
  choice: ある女とその母の両方を妻として迎える
  rationale: לקח は字義的には「取る」だが、אשה を目的語とする法的・性的文脈では婚姻を表し得る。日本語で単に「女を取る」とすると意味が不明瞭になるため、自然な表現を本文に置き、原文の幅は脚注で示した。
- source_word: זִמָּה
  choice: 忌まわしい淫行
  rationale: レビ記の性規定では、単なる一般的悪ではなく、甚だしく不道徳で許されない性的行為を表す。「忌まわしい」により強い非難を、「淫行」によりこの文脈での性的性格を伝えた。
- source_word: בָּאֵשׁ יִשְׂרְפוּ
  choice: 火で焼かなければならない
  rationale: בְּ は手段を示し、動詞は三人称複数能動形である。日本語の法規として自然な義務表現にしつつ、火で焼くという刑罰を明示した。
- source_word: אֹתוֹ וְאֶתְהֶן
  choice: 彼とその二人の女
  rationale: 男性一人と、先に挙げられた女およびその母を指す。日本語で曖昧な「彼と彼女たち」を避け、指示対象を明確にした。
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: あなたがたの間に忌まわしい淫行があってはならない
  rationale: 共同体の中からこの行為をなくすという規定の目的・帰結を、簡潔で自然な禁止表現として訳した。接続詞は日本語では独立文の流れにより十分に表される。
theological_decisions:
- issue: 「女とその母を取る」が示す関係の性質
  choice: 本文では自然な日本語として「妻として迎える」とし、原語の字義と意味の幅を脚注に残す。
  alternative: 「女とその母を取る」「女とその母の両方と関係を持つ」
  rationale: לקח は婚姻を指し得るが、独立した「結婚する」という語が使われているわけではない。日本語本文で意味を通じさせながら、婚姻への限定が解釈を含むことを脚注で明示した。
- issue: 刑罰節の能動態と執行主体
  choice: 「彼とその二人の女を火で焼かなければならない」とし、原文にない具体的な執行者は補わない。
  alternative: 「彼もその二人の女も火で焼かれなければならない」
  rationale: 原文は三人称複数の能動形だが主語を明示しない。日本語の無主語の法規表現により、能動的な命令性を保ちつつ執行者を特定しない。
- issue: זִמָּה の道徳的・性的含意
  choice: 「忌まわしい淫行」
  alternative: 「邪悪」「みだらな行い」「破廉恥な行い」
  rationale: この語が表す強い道徳的非難と、レビ記20章における性的違反の文脈をともに示すため。特定の教派的分類は持ち込まない。
translation_notes:
  register: 現代標準日本語による、明瞭で厳粛な法規文体。「めとる」のような古風な語を避け、「妻として迎える」とした。刑罰の表現は原文の厳しさを弱めず、同時に原文が明示しない執行主体や手順を補っていない。
