  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: ja
  text: あなたがたは、わたしのすべての掟とすべての定め[a]を守り、それらを行いなさい。そうすれば、あなたがたがそこに住むためにわたしが導き入れる地が、あなたがたを吐き出す[b]ことはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「掟」と「定め」は、原文では異なる二つの法的用語。別訳「規定と裁定」。
    reason: lexical_alternative
  - marker: b
    text: 原文は文字どおりには「吐く」。土地が住民を体外へ排出するかのように描く強い比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守り
  rationale: שׁמרは契約と律法の文脈で、命令を忠実に守り行うことを表す。「守る」は現代日本語で自然であり、法的・契約的な含意も保つ。
- source_word: חֻקֹּתַי
  choice: わたしのすべての掟
  rationale: חֻקָּהは制定された規定を指す。「掟」は厳粛な法規という響きを持ち、後続のמִשְׁפָּטִיםと訳し分けられる。
- source_word: מִשְׁפָּטַי
  choice: わたしのすべての定め
  rationale: מִשְׁפָּטは裁定、法規、正しい規範を意味し得る。ここでは「定め」とし、חֻקּוֹתとの語彙上の区別を保ちながら、文脈に合う法的意味を示す。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: それらを行いなさい
  rationale: עשהが法規を目的語に取る場合は、それを実行することを意味する。「行う」は簡潔で原文に近く、「それら」によって二組の法規を受ける。
- source_word: וְלֹא תָקִיא אֶתְכֶם הָאָרֶץ
  choice: そうすれば、その地が、あなたがたを吐き出すことはない
  rationale: קיאの「吐く」という生々しい比喩と、土地の擬人化を保持した。「そうすれば」は命令に続く否定的結果を自然な日本語で示すが、因果関係を必要以上に説明しない。
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה לָשֶׁבֶת בָּהּ
  choice: わたしがあなたがたを、そこに住むために導き入れるその地
  rationale: מֵבִיאの移動の意味、שָׁמָּהの到達点、לָשֶׁבֶת בָּהּの目的を明示しつつ、日本語として理解しやすい語順に整えた。
theological_decisions:
- issue: 土地が住民を排出するという契約上の警告
  choice: 土地が人々を「吐き出す」という擬人化をそのまま残す。
  alternative: 「その地から追い出される」「その地に拒まれる」と意訳する。
  rationale: 原文の強烈な身体的比喩は、汚れに対する土地の反応と追放の深刻さを伝える。婉曲化すると、聖さと土地を結ぶ本文の緊張が弱まる。
- issue: חֻקּוֹתとמִשְׁפָּטִיםの区別
  choice: 「掟」と「定め」という二つの語で訳し分ける。
  alternative: 双方をまとめて「律法」または「命令」とする。
  rationale: 原文は異なる二つの法的用語を並べているため、その区別を保持する。両語の意味領域には重なりがあるので、脚注で別訳の可能性も示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の厳粛さにふさわしい文体とした。「掟」「定め」は古めかしすぎない範囲で法的な重みを保つ。「吐き出す」という鮮烈な表現は意図的に弱めていない。
