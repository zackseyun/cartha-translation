id: LEV.20.23
reference: Leviticus 20:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: ja
  text: あなたがたの前からわたしが追い払う民[b]の定め[a]に従って歩んではならない。彼らはこれらすべてを行ったので、わたしは彼らを忌み嫌った[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定め」は「慣習」とも訳せる。ヘブライ語は、定められた規範や確立した慣行を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「あなたがたの前から送り去る」。ここでは、その土地から追放するという意味。
    reason: lexical_alternative
  - marker: c
    text: 「嫌悪した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: 歩んではならない
  rationale: הלךの基本的な「歩く」という比喩を保ちつつ、ここでは生活上の行動や振る舞いを表す自然な日本語とした。
- source_word: בְּחֻקֹּת
  choice: 定めに従って
  rationale: חֻקּוֹתは定められた規範や慣行を指す。「定め」で法的・倫理的な力を保ち、「に従って」によって行動の基準であることを明確にした。
- source_word: הַגּוֹי
  choice: 民
  rationale: 単数形で、追放されるカナンの住民を集合的に指す。日本語では「国民」よりも土地の住民集団を自然に表せる「民」とした。
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: あなたがたの前からわたしが追い払う
  rationale: שלחは本来「送る」だが、מִפְּנֵיכֶםと結び付くこの文脈では、その土地から退去させる意味である。「前から」は原文の空間的表現を残す。
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: 彼らはこれらすべてを行ったので
  rationale: כִּיを理由を示す接続として訳し、前段までに列挙された行為を指す「これらすべて」を保った。
- source_word: וָאָקֻץ בָּם
  choice: わたしは彼らを忌み嫌った
  rationale: קוץが表す強い嫌悪を「忌み嫌った」で表した。בםはその嫌悪の対象を示し、文脈上はそれらの行為をした民を受ける。
theological_decisions:
- issue: 神の強い嫌悪をどの程度明示するか
  choice: わたしは彼らを忌み嫌った
  alternative: わたしは彼らを嫌悪した
  rationale: 原文の強い情動的・道徳的反発を弱めずに表す一方、本文を越えた教理的説明は加えない。「忌み嫌う」は現代日本語として理解でき、宗教的・倫理的文脈にもふさわしい。
- issue: 嫌悪の対象
  choice: 彼ら
  alternative: それら
  rationale: בםは文法上複数の対象を受け、直前の行為を行った民を指すと読むのが自然であるため「彼ら」とした。ただし、その嫌悪が彼らの行った忌むべき事柄に起因することは理由節によって明示されている。
translation_notes:
  register: 明快な現代標準語を用いながら、「歩む」「定め」「忌み嫌う」によって原文の契約的・倫理的な調子と強さを保った。命令は「歩んではならない」とし、厳粛だが古風すぎない文体にした。
