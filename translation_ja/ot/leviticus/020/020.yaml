source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: ja
  text: 男が自分の叔父の妻と寝るなら、その者は叔父の裸をあらわにしたのである。[a] 二人は自分たちの罪を負う。[b] 二人は子のないまま死ぬ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「叔父の裸をあらわにした」。叔父の妻と寝ることによって、禁じられた親族間の性的境界を侵したことを表す、レビ記特有の言い回し。
    reason: cultural_note
  - marker: b
    text: 「自分たちの罪責を負う」とも訳せる。ヘブライ語の表現は、罪そのものと、それによって負う責任のどちらをも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 男が……なら
  rationale: 続く法的事例を示す条件構文として自然な日本語にし、אִישׁの男性単数も保持した。
- source_word: יִשְׁכַּב אֶת
  choice: ……と寝る
  rationale: この文脈では性交を指す定型表現。原文の婉曲的な言い方を保ちつつ、現代日本語でも理解できる。
- source_word: דֹּדָתוֹ
  choice: 自分のおば、すなわちおじの妻
  rationale: ここでは血縁上のおば一般ではなく、おじの妻を指す。日本語の「おば」だけでは範囲が広いため、本文中で関係を明示した。
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: おじの裸をあらわにした
  rationale: レビ記に特徴的な禁止された性的関係の慣用句を、解釈的に言い換えすぎず保持した。
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: 二人は自分たちの罪を負う
  rationale: 複数形により当事者双方を指すことを「二人」で明確にし、חטאの基本的意味である「罪」と「負う」という原文の比喩を保った。
- source_word: עֲרִירִים יָמֻתוּ
  choice: 彼らは子のないまま死ぬ
  rationale: 子孫を欠く状態と死を結び付ける簡潔な制裁文を保持し、その仕組みや時期を本文以上に特定しない。
theological_decisions:
- issue: עֲרִירִים יָמֻתוּ が示す制裁の内容
  choice: 彼らは子のないまま死ぬ
  alternative: 彼らは子を残さずに死ぬ／子を失って死ぬ
  rationale: 原文は制裁の仕組みや、すでにいる子の喪失を明示していない。「子のないまま死ぬ」は結果または状態を簡潔に示しつつ、曖昧さを残す。
- issue: חֶטְאָם の意味範囲
  choice: 罪
  alternative: 罪責
  rationale: חטאは犯された罪そのものにも、それに伴う責任・罪責にも関わり得る。本文では「罪」を採り、別の可能性を脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「叔父／伯父」は年長・年少を原文が区別しないため、ひらがなの「おじ」を用いた。「寝る」は性的意味の婉曲表現として原文の調子を保持する。脚注記号は内容に対応する箇所へ配置した。
