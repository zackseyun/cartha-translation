  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: ja
  text: 男が女と寝るように男性と寝たなら[a]、二人とも忌むべきことを行った。二人は必ず死刑に処せられる。彼ら自身がその死の責任を負う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「女との寝床（複数形）」。「女と寝る」、すなわち女性との性交を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「彼らの血は彼らの上にある」。彼ら自身にその死の責任があることを示す法的表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 男が……なら
  rationale: 接続詞を伴う法令上の条件節として自然な現代日本語にした。אִישׁ は成人男性を表すため「男」とした。
- source_word: יִשְׁכַּב אֶת
  choice: と寝る
  rationale: この文脈では性交を表す慣用表現。露骨な説明に置き換えず、ヘブライ語の比喩的表現を保った。
- source_word: זָכָר
  choice: 男性
  rationale: אִישׁ「男」と異なる語で、生物学的な「雄・男性」を指す。日本語でも可能な範囲で語の違いを示した。
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: 女と寝るように
  rationale: 直訳的には「女の寝床／女との複数の寝方」だが、女性との性交を指す慣用句なので、自然さと原文の比喩を両立させた。
- source_word: תּוֹעֵבָה
  choice: 忌むべきこと
  rationale: 契約的・道徳的に強い否定評価を表す語。現代日本語で理解しやすく、重みのある表現を選んだ。
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: 二人とも……行った
  rationale: 行為への両者の関与を明示する原文の強調を保持した。
- source_word: מוֹת יוּמָתוּ
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と受動動詞による強調された死刑宣告を、「必ず」と受動表現で示した。
- source_word: דְּמֵיהֶם בָּם
  choice: 彼らの血の責任は彼ら自身にある
  rationale: 死に対する責任が当人たちに帰するという法的慣用句の意味を明確にしつつ、「血」を残した。
theological_decisions:
- issue: 現代において論争のある規定をどう表現するか
  choice: 原文が規定する特定の行為と刑罰を、そのまま行為中心の表現で訳した。
  alternative: 「同性愛行為」などの包括的な現代用語、または現代の性的アイデンティティーを示す語を用いる。
  rationale: ヘブライ語本文は現代的な性的指向やアイデンティティーではなく、特定の行為を法令形式で述べているため、意味を広げたり狭めたりしない。
- issue: אִישׁ と זָכָר の区別
  choice: 「男」と「男性」を使い分けた。
  alternative: 両方を「男」と訳す。
  rationale: 原文が社会的人間を指す語と性を示す語を区別していることを、日本語として不自然にならない範囲で反映した。
- issue: דְּמֵיהֶם בָּם の解釈
  choice: 死の責任が当人たちにあるという意味を本文に示した。
  alternative: より逐語的に「彼らの血は彼らの上にある」とする。
  rationale: 逐語訳では現代日本語で意味が伝わりにくいが、「血」という原文の像は保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、法令としての厳粛さを保持した。「寝る」は原文の慣用的な婉曲表現を保ち、「死刑に処せられる」は受動の刑罰宣告を明確にする。
