source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: ja
  text: 男が他人の妻、すなわち隣人の妻と姦淫したなら、姦淫した男と女は必ず死刑に処せられる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は字義的には「男の妻と……隣人の妻と」と、罪状を繰り返して述べている。この反復は、法的な文体において違反内容を強調し、明確にする。
    reason: 原文の反復表現と、「他人の妻」という訳語が「男の妻」を文脈に即して表すことを示すため。
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 男が……したなら
  rationale: 接続詞、名詞、関係詞から成る法的な事例提示を、現代日本語の条件文として自然に表した。原文の男性単数も保持している。
- source_word: יִנְאַף
  choice: 姦淫した
  rationale: נאףは一般的な性的不品行ではなく、既婚者との不貞行為を指すため、意味の限定された「姦淫」を用いた。
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: 他人の妻と
  rationale: 字義的には「男の妻と」だが、行為者とは別の男の妻であることを、簡潔で自然な日本語で明示した。
- source_word: אֶת אֵשֶׁת רֵעֵהוּ
  choice: 隣人の妻と
  rationale: רֵעַは法的・共同体的文脈で仲間や同胞を広く指す。「隣人」は伝統的で簡潔な対応語であり、直近に住む人だけに限定しない。
- source_word: מוֹת יוּמַת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調と、ホファル形の受動的な死刑宣告を保持した。処刑方法は原文にないため補わない。
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: 姦淫した男も女も
  rationale: 男性形と女性形の分詞が両当事者を明示する対称的な表現を、分かりやすい現代日本語で再現した。「姦夫と姦婦」は簡潔だが、現代では硬く不慣れなため避けた。
theological_decisions:
- issue: 性別を明示する法的表現
  choice: 事例の主体を「男」とし、刑罰の対象を「男も女も」と明示した。
  alternative: 「人が……したなら、両者は」と性別を中立化する。
  rationale: 原文は事例提示でも刑罰対象でも男女を明示しているため、その法的な対称性を保持した。
- issue: 死刑宣告の強調と範囲
  choice: 「必ず死刑に処せられる」とし、刑罰の確実性を表した。
  alternative: 「処刑されなければならない」または処刑方法を補う。
  rationale: 原文は死刑を強く宣告するが、この節では執行方法を特定していない。したがって、強調は訳しつつ方法は補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法文としての厳粛さを保った。「姦淫」は日常語ではないが、נאףの限定された法的意味を正確に示す語として採用した。原文の反復は「すなわち」を添えて、単なる重複ではなく明確化として読めるようにした。
