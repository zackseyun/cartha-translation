  to: しかし、わたしはあなたがたに言った。「あなたがたは彼らの土地を所有する[a]。わたし自身が、それをあなたがたが所有するために与える。そこは乳と蜜の流れる地[b]である。」わたしは、あなたがたを諸民族から分けた[d]、あなたがたの神ヤハウェ[c]である。
