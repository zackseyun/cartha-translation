id: LEV.20.24
reference: Leviticus 20:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: ja
  text: しかし、わたしはあなたがたに言った。「あなたがたは彼らの土地を所有する[a]。わたし自身が、それをあなたがたが所有するために与える。そこは乳と蜜の流れる地[b]である。」わたしは、あなたがたを諸民族から分けた[d]、あなたがたの神ヤハウェ[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの土地を受け継ぐ……それを受け継ぐために」とも訳せる。ヘブライ語の動詞には、「受け継ぐ」と「取得して所有する」の両方の意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「乳と蜜の流れる地」は、豊かで肥沃な土地を表すヘブライ語の慣用表現。
    reason: cultural_note
  - marker: c
    text: ヘブライ語はYHWH（יהוה）。伝統的に「主」と訳される。
    reason: alternative_reading
  - marker: d
    text: 「あなたがたを諸民族から取り分けた」または「区別した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: しかし、わたしは……言った
  rationale: 接続詞は文脈上の対比を示す「しかし」とし、完了した発言を自然な日本語で表した。
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: 所有する／所有させる
  rationale: ירשׁには「受け継ぐ」と「取得して所有する」の両義がある。ここでは土地取得の約束に即して「所有する」を本文に採り、別義を注記した。後半は、神が土地を与える目的・結果が自然に伝わるよう「所有させる」とした。
- source_word: אַדְמָתָם
  choice: 彼らの土地
  rationale: 語義は「地面、土」だが、領土の取得を述べるこの文脈では「土地」が自然である。
- source_word: וַאֲנִי
  choice: わたし自身が
  rationale: 独立代名詞による主語の強調を「自身が」で保持した。
- source_word: אֶתְּנֶנָּה
  choice: それをあなたがたに与えて
  rationale: 接尾辞が指す土地を「それ」と明示し、神からの賜物であることを表した。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 乳と蜜の流れる地
  rationale: 豊かさと肥沃さを示すヘブライ語の慣用表現を、定着した簡潔な日本語で保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神名を日本語で音写した。
- source_word: הִבְדַּלְתִּי
  choice: 分けた
  rationale: בדלの基本的な分離の意味を保ち、「聖別した」など後代の神学用語に限定しなかった。
- source_word: הָעַמִּים
  choice: 諸民族
  rationale: 政治的国家に限定されない複数の民の集団を表すため「諸民族」とした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が称号ではなく四文字神名を用いるため、その固有名としての性格を保つ音写を採用した。
- issue: イスラエルと諸民族との区別
  choice: 諸民族から分けた
  alternative: 諸民族から選び分けた／取り分けた
  rationale: 神による分離という本文の主張をそのまま示し、目的や神学的含意を本文以上に補わないようにした。
- issue: 土地取得を表すירשׁの意味
  choice: 所有する
  alternative: 受け継ぐ
  rationale: 取得と相続の両方の含みを持つため、文脈に合う「所有する」を本文に置き、「受け継ぐ」を脚注で残した。
translation_notes:
  register: 現代の一般読者に理解しやすい、明瞭で格調を保った常体。神の発言では「わたし」を用い、約束の力点を保つため「わたし自身が」とした。原文の反復は日本語として不自然にならない範囲で保持し、曖昧な語義は脚注に残した。
