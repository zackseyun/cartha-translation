id: LEV.20.8
reference: Leviticus 20:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: ja
  text: あなたがたは、わたしの掟を守り、それを行いなさい。わたしは、あなたがたを聖別する[a]ヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたを聖なる者とする」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: あなたがたは……守り
  rationale: שׁמרは律法・契約の文脈で「守る、遵守する」を意味する。ここでは後続の動詞と結び、現代日本語として自然な命令表現にした。
- source_word: חֻקֹּתַי
  choice: わたしの掟
  rationale: חֻקָּהは定められた法規を指す。「掟」は法的な重みを保ちつつ、一般の読者にも理解しやすい。
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: それを行いなさい
  rationale: עשהはここで、掟を実際に行うことを表す。「行いなさい」は原文の具体性を保ち、「守る」との並行も再現する。日本語では複数代名詞を明示せず「それ」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
- source_word: מְקַדִּשְׁכֶם
  choice: あなたがたを聖別する
  rationale: קדשׁの使役分詞で、ヤハウェが民を聖なるものとして取り分ける継続的・特徴的な働きを表す。「聖別する」は聖性と契約上の意味を簡潔に保つ。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく固有の神名を用いているため、その区別を保って音写した。
- issue: מְקַדִּשְׁכֶם における聖性の表現
  choice: あなたがたを聖別する
  alternative: あなたがたを聖なる者とする
  rationale: 神が民を聖なるものとして取り分ける働きを示すため「聖別する」とした。一方、「聖なる者とする」も使役の意味を明瞭に表すため、脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法文の命令として「行いなさい」を用い、神の自己宣言は簡潔な「である」調とした。
