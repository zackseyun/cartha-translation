id: LEV.20.27
reference: Leviticus 20:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: ja
  text: 男であれ女であれ、霊媒者[a]または口寄せをする者[b]は、必ず死刑に処せられなければならない。石でその者を打ち殺さなければならない。その者自身が死の責任を負う[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊媒者」と訳した語は、死者の霊を呼び出す者を指す場合のほか、その者に結びつく霊そのものを指す場合もある。
    reason: lexical_alternative
  - marker: b
    text: 「口寄せをする者」と訳した語は、霊との交信によって隠された知識を得ようとする者を指すと考えられるが、「霊媒者」との正確な区別は明らかでない。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「その者の血はその者自身の上にある」。その死の責任が本人にあることを示す法的な定型表現。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֽוֹ אִשָּׁה
  choice: 男であれ女であれ
  rationale: ヘブライ語が男女を明示していることを保ちつつ、日本語の法的・一般的条件表現として自然にした。文頭の接続詞は、日本語では明示しないほうが自然である。
- source_word: כִּי יִהְיֶה בָהֶם
  choice: …をする者
  rationale: 字義的には「彼らのうちにある／彼らにある」だが、ここでは霊媒・口寄せにかかわる者を指す慣用的な構文と判断し、現代日本語で意味が明瞭になるよう行為者として表した。語そのものが霊を指し得る曖昧さは脚注で保持した。
- source_word: אוֹב
  choice: 霊媒
  rationale: 死者の霊を呼び出す行為、その媒介者、またはそれに結びつく霊を指し得る語である。本文では現代日本語で最も通じやすい「霊媒」を採用し、語義の幅を脚注に示した。
- source_word: יִדְּעֹנִי
  choice: 口寄せ
  rationale: 霊との交信や秘術的な知識に関係する者を指す語で、אוֹבと対になっている。「魔術師」では現代の幻想文学的連想が強いため、死者・霊との交信を表しやすい「口寄せ」とした。
- source_word: מוֹת יוּמָתוּ
  choice: 必ず死刑に処せられなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を「必ず」で表し、法規としての死刑宣告を明確にした。
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: 人々はその者を石で打ち殺さなければならない
  rationale: 原文の能動形と、石が処刑手段であることを保持した。不特定複数の主語は日本語で「人々」とした。
- source_word: דְּמֵיהֶם בָּם
  choice: その者の血の責任は、その者自身にある
  rationale: 字義的な「彼らの血は彼らの上にある」という法的定型句を、死の責任が当人に帰するという意味が現代日本語で伝わる形にした。字義は脚注で示した。
theological_decisions:
- issue: 霊的実践を表す二語の区別
  choice: אוֹבを「霊媒」、יִדְּעֹנִיを「口寄せ」とする
  alternative: 「使いの霊」と「霊能者」、または両方をまとめて「霊媒をする者」とする
  rationale: 古代の分類を過度に確定せず、二つの語が並置されていることを本文に残した。霊そのものか実践者かという語義上の幅は脚注で示し、特定の霊魂論を本文に持ち込まないようにした。
- issue: 男女の明示
  choice: 「男であれ女であれ」を保持する
  alternative: 「だれでも」
  rationale: 原文が男女の双方を明示しているため、その形式と適用範囲を保った。
- issue: 「血はその者自身にある」という定型句
  choice: 死についての本人の責任を示す法的表現として訳す
  alternative: 字義どおり「その者の血はその者の上にある」とする
  rationale: 裁判的文脈で責任の帰属を表す定型句であり、現代日本語で誤解なく伝えるため「血の責任」とした。ただし、原文の比喩は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で厳粛な法規の文体とした。「死刑に処せられなければならない」「石で打ち殺さなければならない」により原文の強い命令性を保ち、古風すぎる語尾や幻想文学を連想させる用語は避けた。
