  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の固有名YHWH（ヤハウェ）。伝統的には「主」と訳される。
    reason: 原文の神名と伝統的な代替表記との関係を明示するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 語りの新しい発話単位を導入するワウ継続法のピエル形。日本語では、後続する神の言葉を導く定型表現として「告げた」が自然で、単なる「言った」よりも荘重さを保てる。
- source_word: יְהוָה
  choice: 主
  rationale: 神名を表す四文字語YHWH。日本語の聖書読者に広く通じる伝統的な代替表記「主」を本文に置き、原文が固有の神名であることを脚注で明示した。
- source_word: אֶל
  choice: に
  rationale: 発話の相手を示す前置詞であり、「モーセに」が自然な現代日本語。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記。
- source_word: לֵאמֹר
  choice: 告げた（後続発話を導く）
  rationale: 直訳は「言って／言うために」だが、この定型句では後続する直接話法の導入標識として機能する。日本語では「告げた。」だけでその機能を自然に表せるため、独立した「言った」を重ねなかった。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注でYHWHを明示）
  alternative: ヤハウェ
  rationale: 原文が称号ではなく固有の神名YHWHを用いる事実を脚注で保持しつつ、本文は自然で荘重な日本語として定着した「主」とした。発音の再構成には不確実性があるため、脚注では「ヤハウェ」と断定せずYHWHを示す。
translation_notes:
  register: 明瞭で簡潔な現代標準語。「主はモーセに告げて言った」のようなヘブライ語構文の重複は避けつつ、神の宣言を導入する荘重さを保った。
