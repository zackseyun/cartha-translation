id: LEV.20.11
reference: Leviticus 20:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: ja
  text: もし男が父の妻と寝るなら[a]、彼は父の裸をあらわにしたのである。二人とも必ず死刑に処せられなければならない。彼らの血の責任は彼ら自身にある[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寝る」は、ここでは性交することを意味する。後半の「父の裸をあらわにした」はレビ記で禁じられた性的関係を表す定型句であり、より解釈的には「父を性的に辱めた」とも表現できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼らの血は彼らの上にある」。その死についての責任が本人たちにあることを示す法的な定型表現。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: もし男が…なら
  rationale: 法規の個別事例を導入する構文として自然な条件文にし、男性を指す原文も保持した。
- source_word: יִשְׁכַּב אֶת
  choice: …と寝る
  rationale: 性交を表す婉曲的な定型表現。現代日本語で理解でき、原文の婉曲性も保つ。
- source_word: אֵשֶׁת אָבִיו
  choice: 父の妻
  rationale: 「継母」と限定せず、原文の親族関係の表現をそのまま保持した。
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: 父の裸をあらわにした
  rationale: レビ記18章・20章に反復される「裸をあらわにする」という定型句とその相互参照性を保った。
- source_word: מוֹת יוּמְתוּ
  choice: 必ず死刑に処せられなければならない
  rationale: 不定詞絶対形と定動詞による強意を「必ず」で示し、法的刑罰であることを明確にした。
- source_word: שְׁנֵיהֶם
  choice: 二人とも
  rationale: 刑罰が双方に及ぶという明示的な強調を保持した。
- source_word: דְּמֵיהֶם בָּם
  choice: 彼らの血の責任は彼ら自身にある
  rationale: 直訳的な「彼らの血は彼らの上にある」より理解しやすくしつつ、死についての責任が本人たちに帰する法的定型句の意味を保った。
theological_decisions:
- issue: 性に関する禁止を表すレビ記の定型句
  choice: 父の裸をあらわにした
  alternative: 父を性的に辱めた
  rationale: 解釈的に平板化せず、「裸をあらわにする」という原文の比喩とレビ記内のつながりを保持した。
- issue: 法の対象者の性別
  choice: もし男が
  alternative: もし人が
  rationale: この条文の主体は明示的に男性であり、性別を中和しない。
- issue: 流血責任の法的定型句
  choice: 彼らの血の責任は彼ら自身にある
  alternative: 彼らの血は彼らの上にある
  rationale: 責任帰属という意味を明瞭にしながら、「血」という原文の法的・神学的語彙を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。性行為を表す原文の婉曲性と、レビ記固有の「裸をあらわにする」という定型句を保持した。死刑規定は強意を反映して明確に訳した。
