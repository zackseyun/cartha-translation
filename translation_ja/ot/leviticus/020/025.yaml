reference: Leviticus 20:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: ja
  text: あなたがたは、清い動物と汚れた動物、また汚れた鳥と清い鳥とを区別しなければならない。動物や鳥、また地を這うあらゆるもの、すなわち、わたしがあなたがたにとって汚れたものとして区別したものによって、あなたがた自身[b]を忌まわしいものにしてはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがた自身を忌むべきものにしてはならない」。このヘブライ語動詞は「忌まわしい、嫌悪すべき」という意味領域に属し、通常「汚れる」を表す語とは異なる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたがたのいのち」または「あなたがた自身」。ここでは人そのものを指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: それゆえ…区別しなければならない
  rationale: ヒフィル形の「分ける、区別する」という使役的・識別的意味を自然な日本語で表した。文脈上の接続を「それゆえ」で示した。
- source_word: הַבְּהֵמָה
  choice: 動物
  rationale: ここでは陸上動物を広く指すため、「家畜」に限定せず、現代日本語として明瞭な「動物」とした。
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: 清い／汚れた
  rationale: レビ記における儀礼上・契約上の分類を示し、単なる衛生状態や道徳的善悪への言い換えを避けた。
- source_word: הָעוֹף
  choice: 鳥
  rationale: 語義は飛ぶ生き物を広く含み得るが、食物規定の文脈では「鳥」が最も自然で理解しやすい。
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: 忌まわしいものにしてはならない
  rationale: שׁקץ の「忌み嫌う、忌まわしいものとする」という意味領域を保ち、通常の「汚れる」を表す טמא と混同しないようにした。
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: 自分自身
  rationale: נפשׁ はここでは非物質的な「魂」だけでなく人そのものを指す慣用表現なので、自然な再帰表現とした。
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: 地を這うあらゆるもの
  rationale: רמשׂ の地面近くを動く・這うという広い意味を簡潔に表した。
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: わたしがあなたがたのために汚れたものとして分けた
  rationale: 神がイスラエルのために該当する生き物を「汚れたもの」として分類したという意味を保ち、בדל の反復も「分けた」で示した。
theological_decisions:
- issue: 清浄・不浄を表す語の性格
  choice: 契約共同体における分類として「清い／汚れた」と訳す
  alternative: 「純粋な／不純な」「清潔な／不潔な」
  rationale: 本文は食物と聖性に関するレビ記の区分を扱うため、道徳的評価や衛生上の判断へ狭めない表現を採った。
- issue: אֶת נַפְשֹׁתֵיכֶם における נֶפֶשׁ
  choice: 人全体を指す「自分自身」
  alternative: 「あなたがたの魂」
  rationale: ヘブライ語の慣用法を踏まえ、本文が要求していない心身二元論的な含意を避けた。
- issue: וְלֹא תְשַׁקְּצוּ と不浄概念の関係
  choice: 「忌まわしいものにしてはならない」とし、טמא と語を分ける
  alternative: 「身を汚してはならない」
  rationale: 同節中の「汚れた」に用いられる語とは別の語根であるため、その語彙的緊張を保存した。
translation_notes:
  register: 現代の一般読者に分かる平明さを保ちつつ、律法本文にふさわしい簡潔で格調ある文体とした。「清い／汚れた」「忌まわしい」を区別し、原文の異なる意味領域を保った。
