source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: ja
  text: 女が、どの動物であれ、それと性交するために近づくなら[a]、あなたはその女とその動物を殺さなければならない。両者は必ず殺されなければならない。両者の血は両者自身に帰する[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「それと寝るために」。ヘブライ語の動詞は、ここでは動物との性交を指す。
    reason: lexical_alternative
  - marker: b
    text: または「両者の血の責任は両者にある」。これは、その死に対する責任が両者自身にあることを示す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: 近づく
  rationale: קרבの基本義である「近づく」を保ち、性的な目的は後続の不定詞句で明示した。
- source_word: כָּל בְּהֵמָה
  choice: どの動物であれ
  rationale: כָּלの包括性とבְּהֵמָהの一般的な意味を、明瞭な現代日本語で表した。
- source_word: לְרִבְעָה אֹתָהּ
  choice: それと交わるために
  rationale: רבעがここで獣との性交を指すことを明確にしつつ、原文の簡潔さと法文の品位を保った。字義的には「それに身を乗りかからせるために」とも理解できるため脚注を付した。
- source_word: וְהָרַגְתָּ
  choice: 殺さなければならない
  rationale: 法規定における命令・義務の力を、自然な現代日本語で示した。
- source_word: מוֹת יוּמָתוּ
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と定動詞による強調を「必ず」で表し、受動の処刑定型句を保持した。
- source_word: דְּמֵיהֶם בָּם
  choice: 彼らの血は彼ら自身に帰する
  rationale: 「血」という原文の比喩を残しながら、その死の責任が当人たちにあるという法的慣用句の意味を伝えた。
theological_decisions:
- issue: 獣姦に対する厳しい刑罰規定の訳し方
  choice: 行為と刑罰を婉曲化せず、法文として直接的に訳す。
  alternative: 「共に寝る」などの婉曲表現、または「乗りかからせる」のような字義的だが分かりにくい表現。
  rationale: 本文の厳粛さと明瞭さを保ち、追加の道徳的・教派的解説を持ち込まないため。
- issue: דְּמֵיהֶם בָּם の責任表現
  choice: 比喩を保って「彼らの血は彼ら自身に帰する」とする。
  alternative: 意味を全面的に明示して「彼らは自らの死の責任を負う」とする。
  rationale: 原文の「血」の語を保持しつつ、死に対する責任が本人たちに帰属するという意味を自然な日本語で示すため。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語の法文調。「交わる」は性的意味が文脈上明確で、過度に露骨にも婉曲にもならない表現とした。人間と動物を合わせて受ける複数代名詞は、日本語としてやや擬人的になり得るが、原文の複数接尾辞を反映して「彼ら」とした。
