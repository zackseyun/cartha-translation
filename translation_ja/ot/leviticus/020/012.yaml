source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: ja
  text: 男が自分の息子の妻と性的関係を持ったなら、二人とも必ず死刑に処せられなければならない。二人は忌まわしい行為[a]をした。彼らの血の責任は彼らにある[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「背徳」「倒錯」「恥ずべき行為」とも訳し得る。ヘブライ語の語は、この法的文脈で、道徳的に非難される不正な行為を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「彼らの血は彼らの上にある」。これは、二人が自らの死について責任を負うことを示すヘブライ語の法的慣用表現。
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: 男が……なら
  rationale: 事例法の条件節として自然な現代日本語にしつつ、אִישׁが指す男性を明示した。
- source_word: יִשְׁכַּב אֶת
  choice: と寝た
  rationale: この文脈では性交を表す定型的な婉曲表現であり、日本語でも意味が通じる簡潔な表現を採った。
- source_word: כַּלָּתוֹ
  choice: 自分の息子の妻
  rationale: כַּלָּהはここでは息子の妻を指す。「嫁」より親族関係が明確で、語義を限定しすぎない説明的表現とした。
- source_word: מוֹת יוּמְתוּ
  choice: 必ず死刑に処せられなければならない
  rationale: 不定詞絶対形と定動詞による強調、および受動形の法的命令を表した。
- source_word: שְׁנֵיהֶם
  choice: 二人とも
  rationale: 処罰の対象が両当事者であることを明確にした。
- source_word: תֶּבֶל
  choice: 秩序を乱す忌まわしい行為
  rationale: 性的立法における、道徳的に倒錯し秩序を乱す行為という強い非難を表しつつ、「倒錯」など特定の現代的含意に狭めることを避けた。
- source_word: עָשׂוּ
  choice: をした
  rationale: 基本義「行った」を簡潔に反映し、目的語との自然な日本語にした。
- source_word: דְּמֵיהֶם בָּם
  choice: 彼らの血は彼ら自身の上にある
  rationale: 死の責任が本人たちに帰するというヘブライ語の法的慣用句を、解釈で置き換えず保持した。
theological_decisions:
- issue: 法の主体の性別
  choice: 「男」と訳す
  alternative: 「人」「ある者」
  rationale: אִישׁは男性単数であり、この規定では男性当事者を指すため、性別を明示した。
- issue: תֶּבֶלによる行為の道徳的評価
  choice: 「秩序を乱す忌まわしい行為」
  alternative: 「背徳」「倒錯」「恥ずべき行為」
  rationale: 原文自体の強い道徳的非難を保ちながら、語源的・語義的な幅と法的文脈を反映し、特定の教派的解釈を付加しないようにした。
- issue: 死に対する責任を示す血の慣用句
  choice: 慣用句を本文に保持する
  alternative: 「その死の責任は彼ら自身にある」
  rationale: 原文の比喩的表現と神学的・法的含意を保存し、意味は脚注で説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法文としての厳粛さを保った。「寝た」は原文の婉曲表現を自然に伝え、「彼らの血は彼ら自身の上にある」は原文の法的慣用句を意図的に保持している。
