language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: ja
  text: また、イスラエルの子らにこう言いなさい。イスラエルの子らのうちのだれであれ、イスラエルに寄留している寄留者[a]であれ、自分の子孫[b]のだれかをモレク[c]に与える者は、必ず死刑に処せられる。その地の民は、その者を石で打ち殺す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルに居住する外国人」とも訳せる。ヘブライ語では、「寄留者」という名詞と「寄留する」という同根の動詞が用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「子孫」に当たるヘブライ語は、字義的には「種」を意味し、ここではその人の子どもまたは子孫を指す。
    reason: lexical_alternative
  - marker: c
    text: モレクは、伝統的には子どもの犠牲と結びついた神格を指すと理解されている。一方、この語を神格名ではなく、ある種の奉献を表す語と見る解釈もある。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の慣用表現と男性複数形を保ちつつ、現代日本語でも理解できる形とした。「イスラエル人」も可能だが、原文の表現を平滑化する。
- source_word: אִישׁ אִישׁ
  choice: 者は、だれでも
  rationale: 名詞の反復による分配的意味「一人一人、だれでも」を自然な日本語で表した。文脈上、規定は各個人に適用される。
- source_word: הַגֵּר הַגָּר
  choice: 寄留している寄留者
  rationale: 名詞גֵּרと同根動詞גּוּרの反復を可能な範囲で示した。単なる旅行者ではなく、イスラエルの中に居住する外国出身者を指す。
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: 自分の子孫のうちの一人をモレクに与える
  rationale: מִןの部分的意味を「うちの一人」で示し、זֶרַעは字義的な「種」ではなく、この文脈で人の子や子孫を指す「子孫」とした。「与える」は祭儀の具体的方法を本文以上に補わない。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と定動詞による強調、および司法的な受動の意味を表した。
- source_word: עַם הָאָרֶץ
  choice: その地の民
  rationale: 後代の社会階層を指す専門語とはせず、この法を執行する土地・共同体の民として原文に即して訳した。
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: その者を石で打ち殺さなければならない
  rationale: 石を用いた処刑であることを明示し、日本語として自然な法規定の表現にした。動詞の文脈的な結果も「打ち殺す」で明確にした。
theological_decisions:
- issue: לַמֹּלֶךְ（モレク）の意味
  choice: 本文では固有名ないし称号として「モレク」と表記する
  alternative: 特定の種類の「モレク奉献物」を指す語として訳す
  rationale: 伝統的かつ文脈上もっとも直接的な理解を本文に採ったが、語が神格ではなく奉献の種類を指す可能性も注で保持した。本文にない「火で焼く」「犠牲にする」などの詳細は補わなかった。
- issue: 子孫を「与える」行為の性質
  choice: 祭儀行為の具体的方式を限定せず「与える」と訳す
  alternative: 「子どもをいけにえとしてささげる」と明示する
  rationale: 周辺の聖書文脈では子どもの犠牲との関連が強いが、この節の動詞自体は「与える」であるため、翻訳で解釈を確定しすぎないようにした。
translation_notes:
  register: 現代標準日本語による、明瞭で厳粛な法規定の文体とした。「〜なければならない」で共同体に課された義務を示しつつ、原文の語彙的反復やモレクをめぐる解釈上の余地は本文と注で保持した。
