id: LEV.20.15
reference: Leviticus 20:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: ja
  text: 男が動物と性交したなら、その男は必ず死刑に処せられなければならない。あなたがたはその動物も殺さなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: 男
  rationale: 男性単数を明示し、女性の場合を別に扱う次節との法的な区別を保つ。
- source_word: אֲשֶׁר
  choice: …したなら
  rationale: 形式上は関係詞だが、ここでは事例法の条件を自然な現代日本語で表す。
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: 性交した
  rationale: 字義的には「自分の伏すことを与える」という性行為の婉曲表現。日本語では意味を明瞭かつ簡潔に伝える。
- source_word: בִּבְהֵמָה
  choice: 動物と
  rationale: בְּהֵמָה の一般的な意味を、現代日本語で自然に表す。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調と、法的な死刑宣告の双方を表す。
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: あなたがたはその動物も殺さなければならない
  rationale: 二人称複数の共同体への命令を「あなたがた」で示し、接続詞は両者が処罰対象であることを自然に示す「も」とした。
theological_decisions:
- issue: 行為者の性別の特定
  choice: 男性に限定して「男」とする
  alternative: 性別を限定せず「人」とする
  rationale: 原文は男性単数 אִישׁ を用い、次節が女性の場合を別に規定するため、原文の法的構成を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。性行為と刑罰を婉曲にぼかさず、原文の事例法としての条件、強調、二人称複数を明示した。
