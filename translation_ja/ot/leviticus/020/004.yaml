source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: ja
  text: しかし、もしその地の民が、その人が自分の子ども[c]の中のだれかをモレク[a]に与えるとき、ことさらにその人から目を背け[b]、彼を死刑に処さないようにするなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「モレク」は神の名、または子どもを献げる祭儀の呼称を指す可能性がある。別の読みでは「王に」。
    reason: alternative_reading
  - marker: b
    text: 直訳は「その人から自分たちの目を隠し」。意図的に見て見ぬふりをすることを表す。
    reason: lexical_alternative
  - marker: c
    text: 「子ども」は直訳では「種」。ここではその人の子どもを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: ことさらに……目を背け
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「ことさらに」で表し、意図的に見過ごすという慣用的意味を明確にした。
- source_word: עַם הָאָרֶץ
  choice: その地の民
  rationale: この法的文脈では特定の社会階層ではなく、その地の共同体の人々を指すため。
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: その人から目を背け
  rationale: 直訳的な身体表現を保ちながら、見て見ぬふりをして対処しないというヘブライ語の慣用的意味が自然に伝わる表現とした。
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: 自分の子どものうちの一人を……与える時
  rationale: מִן の部分を表す用法を「うちの一人」で示し、זֶרַע はこの文脈で子どもを指すものとして明瞭に訳した。「与える」は原語 נתן に対応する。
- source_word: לַמֹּלֶךְ
  choice: モレクに
  rationale: レビ記18章21節および20章2–5節の祭儀的文脈に従い、一般的な固有名の音写を採用した。
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: 彼を死刑にしないなら
  rationale: 共同体が見過ごした結果または意図として、規定された刑を執行しないことを表す法的な日本語とした。節が次節へ続く条件文であることも保持した。
theological_decisions:
- issue: 祭儀の受け手 לַמֹּלֶךְ の解釈
  choice: モレク
  alternative: 王に
  rationale: 子音表記だけなら「王」と読む可能性も論じられるが、レビ記18章21節と20章2–5節の文脈は禁じられた祭儀の受け手の名または呼称を強く示す。本文では伝統的な音写を用い、別の読みは注記した。
- issue: לְבִלְתִּי の目的・結果の含み
  choice: 死刑にしないなら
  alternative: 死刑にすることがないように
  rationale: 構文には目的と結果の両面があり得るため、本文ではどちらか一方に限定しすぎない条件文として訳した。
translation_notes:
  register: 現代の一般読者に明瞭な、厳粛で自然な法文調とした。原文の強調は「ことさらに」で表し、目を背けるという比喩を保持した。次節へ続く条件節なので、文末は読点で閉じた。
