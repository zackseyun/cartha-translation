language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: ja
  text: 男が月経中の女性[a]と寝て、その女性の裸をあらわにした場合、彼は彼女の源をさらし[b]、彼女も自分の血の源をあらわにした。二人はともに、その民の中から断たれる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「月経による汚れの状態にある女性」とも訳せる。ここでいう「汚れ」は、レビ記で月経に伴う儀礼上の状態を指し、道徳的な汚れを意味しない。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼は彼女の源をさらし、彼女は自分の血の源をあらわにした」。「源」は、ここでは血の流れ出る源を婉曲に表す語。
    reason: lexical_alternative
  - marker: c
    text: 「断たれる」は律法で用いられる定型的な法的表現。この節では、それがどのように行われるかは明記されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: 男
  rationale: 男性単数の法規定であり、性的関係の一方である男性を具体的に指しているため。
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: 女と寝る
  rationale: 性交を表すヘブライ語の慣用句を、現代日本語でも理解できる簡潔で品位ある表現として保った。
- source_word: דָּוָה
  choice: 月経による汚れの期間にある
  rationale: 単なる病気ではなく、レビ記における月経に伴う儀礼上の汚れを指す。本文では簡潔にし、脚注で儀礼的意味を明示した。
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: その裸をあらわにする
  rationale: レビ記で不適切な性的関係を表す定型的な婉曲表現を保ち、単に『性交する』と言い換えて比喩を消さないようにした。
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: 女の血の源をさらす
  rationale: מָקוֹר の『源、泉』という身体的な比喩を残しつつ、後続の『血の源』との並行関係によって何を指すかを明瞭にした。
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: 女も自分の血の源をあらわにした
  rationale: 女性側の関与を述べる並行節として、原文の『あらわにする』と『血の源』を保持した。
- source_word: וְנִכְרְתוּ
  choice: 断たれる
  rationale: 律法に繰り返される法的・契約的な定型句を保ち、死刑、共同体からの追放など、本文がここで特定しない執行方法を訳文で限定しなかった。
- source_word: מִקֶּרֶב עַמָּם
  choice: その民の中から
  rationale: 共同体のただ中から除かれるという原文の共同体的・契約的背景を自然な日本語で示した。
theological_decisions:
- issue: דָּוָה が表す女性の状態
  choice: 月経に伴う儀礼上の汚れとして訳す
  alternative: 単に『月経中』、または『病気／汚れ』と訳す
  rationale: レビ記の文脈では一般的な病気ではなく、月経とそれに伴う儀礼上の状態が問題となっている。道徳的な汚れと誤解されないよう脚注で説明した。
- issue: 『断たれる』という刑罰の性質
  choice: 執行方法を特定せず、定型句をそのまま保つ
  alternative: 『処刑される』『共同体から追放される』『子孫を絶たれる』と具体化する
  rationale: この節のヘブライ語自体は、断たれることがどのように実現するかを明示していないため、議論のある解釈を本文に持ち込まなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の法文らしい簡潔さと厳粛さを保った。「裸をあらわにする」「血の源」「断たれる」という原文の定型表現や比喩は、意味を過度に解釈して置き換えず、必要な説明を脚注に置いた。
