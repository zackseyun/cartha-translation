source:
  edition: WLC
  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: ja
  text: 霊媒者や口寄せをする者に心を向け、彼らの後を追って淫行をする者には、わたしはその者に顔を向けて敵対し、その者を民の中から断ち切る[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 「断ち切る」は律法で用いられる定型的な裁きの表現。この箇所では、裁きがどのように執行されるかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 者／その者
  rationale: 祭儀法・刑法的文脈の נֶפֶשׁ は、非物質的な「魂」ではなく一人の人を指すため、現代日本語として自然な「者」とした。
- source_word: תִּפְנֶה
  choice: 心を向け
  rationale: 基本的な「向く」という比喩を残しつつ、助けや導きを求めて霊媒者に頼る意味が伝わる表現とした。
- source_word: הָאֹבֹת
  choice: 霊媒
  rationale: 死者または霊との交信に関わる אֹוב の担い手を、現代日本語で広く理解される「霊媒」とした。
- source_word: הַיִּדְּעֹנִים
  choice: 口寄せ
  rationale: אֹוב と対になった別種の霊的託宣者を示す語として、日本語の聖書・宗教語彙で理解可能な「口寄せ」を採用した。両語の厳密な区別は不確かであるため注を付した。
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: その後を追って淫行をする
  rationale: אַחֲרֵי の追随の像と、זנה が持つ性的かつ契約的不忠実の比喩を保った。「不忠実になる」と意訳して比喩を消すことを避けた。
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: わたしは顔を向けて敵対し
  rationale: 神が裁きのために「顔を向ける」という原文の像を残し、その方向が好意ではなく敵対であることを日本語で明確にした。
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: その者を…断ち切る
  rationale: כרת の法的定型句が示す厳しい裁きを保ちつつ、その具体的方法を「処刑する」「追放する」などに限定しなかった。
- source_word: מִקֶּרֶב עַמּוֹ
  choice: 民の中から
  rationale: 共同体のただ中から除かれるという原文の共同体的な枠組みを、簡潔で自然な日本語にした。
theological_decisions:
- issue: 淫行の比喩を残すか
  choice: その後を追って淫行をする
  alternative: 彼らに従って不実になる
  rationale: 原文は זנה によって性的な不貞を明示的に比喩として用い、禁じられた霊的実践を契約的不忠実として描く。その緊張と強さを弱めないため比喩を保持した。
- issue: 「断ち切る」裁きの具体的内容
  choice: その者を民の中から断ち切る
  alternative: その者を処刑する／共同体から追放する
  rationale: この定型句が死、神による直接の裁き、追放などのどれを具体的に指すかは、この節だけでは確定できない。原文の厳しさと曖昧さをともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、「淫行」「顔を向けて敵対する」「断ち切る」という原文の強い比喩と法的表現を保持した。「霊媒」「口寄せ」は一般読者にも比較的理解しやすい伝統的な宗教語彙であり、不確かな語義上の区別は脚注で示した。
