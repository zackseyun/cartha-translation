id: LEV.20.17
reference: Leviticus 20:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: ja
  text: 男が自分の姉妹、すなわち自分の父の娘または自分の母の娘を取り、彼女の裸を見、彼女も彼の裸を見るなら、それは恥ずべきことである。[a] 二人は自分たちの民の目の前で断ち切られる。[b] 彼は自分の姉妹の裸をあらわにした。彼は自分の罪責を負う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恥ずべきこと」は、「恥辱」または「非難されるべきこと」とも訳せる。ここで用いられるヘブライ語 חֶסֶד は、通常の「慈しみ」や「変わらぬ愛」ではなく、まれな否定的意味で使われている。
    reason: lexical_alternative
  - marker: b
    text: 「断ち切られる」はヘブライ語の法的定型句を保った表現であり、ここでは死刑、追放、またはほかの形の排除のどれを指すかは明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: 男
  rationale: 男性単数の法文として、原文の性別を明示した。
- source_word: יִקַּח
  choice: めとり
  rationale: 基本義は「取る」だが、女性を目的語とするこの法的・性的文脈では婚姻を含む結びつきを表し得る。日本語の「取る」では意味が伝わりにくいため「めとる」としたが、続く「裸を見る」が禁じられた性的関係を明示する。
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: 自分の姉妹、すなわち父の娘または母の娘
  rationale: 同父・同母の姉妹だけでなく、父方または母方の異母・異父姉妹も含む原文の同格的説明を保持した。
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: 彼女の裸を見、彼女もその男の裸を見る
  rationale: 性的露出や性交を指す法的婉曲表現だが、「裸を見る」という原文の比喩を保ち、過度に具体化しなかった。
- source_word: חֶסֶד
  choice: 恥ずべきこと
  rationale: 通常の「慈しみ、誠実」と異なり、この箇所では文脈上、まれな否定的意味を持つ。「恥辱」より自然で明瞭な法的評価として訳した。
- source_word: וְנִכְרְתוּ
  choice: 断ち切られなければならない
  rationale: כרת の法的定型句を保ち、死刑、追放、共同体からの排除など、執行形態を訳文で限定しなかった。
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: 自分たちの民の目の前で
  rationale: 「彼らの民の子らの目に」という社会的・公的な表現を、分かりやすい現代日本語で保持した。
- source_word: גִּלָּה
  choice: あらわにした
  rationale: レビ記の性規定に繰り返される「裸をあらわにする」という定型的表現を保持した。
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: 自分の罪責を負う
  rationale: 罪そのものとその結果の双方を含み得る法的・神学的定型句を、どちらか一方に限定せず表した。
theological_decisions:
- issue: חֶסֶד の意味
  choice: 否定的な意味の「恥ずべきこと」
  alternative: 通常の肯定的意味である「慈しみ」「誠実」
  rationale: この禁止と刑罰の文脈では肯定的な意味は適合せず、まれな否定的用法として理解するのが妥当である。
- issue: 「断ち切られる」という刑罰の具体的内容
  choice: 法的定型句をそのまま保持する
  alternative: 死刑、追放、共同体からの排除などと具体化する
  rationale: この句だけでは刑罰の執行形態が明示されていないため、議論のある具体的意味を訳文で決めなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。性的禁忌を扱う法文として原文の婉曲表現を維持しつつ、古すぎる語法は避けた。注記記号は説明対象である「恥ずべきこと」と「断ち切られる」の直後に置いた。
