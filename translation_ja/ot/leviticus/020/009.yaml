  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: ja
  text: 自分の父または母を呪う者は、だれであれ、必ず死刑に処せられる。父と母を呪ったので、その者の血は本人に帰する。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その者の血はその者の上にある」。その者が自分の死について責任を負うことを示す法的な表現。
    reason: ヘブライ語の司法的慣用句が日本語の本文だけでは理解しにくい可能性があるため。
lexical_decisions:
- source_word: כִּי אִישׁ אִישׁ
  choice: …者は、だれであれ
  rationale: כִּיはここで直前から続く法規の根拠・適用例を導き、אִישׁ אִישׁは不特定の各人を指す分配的表現である。日本語では「…者は、だれであれ」として自然に普遍的適用を示す。
- source_word: יְקַלֵּל / קִלֵּל
  choice: 呪う／呪った
  rationale: ピエル形のקללは、この文脈では単なる軽視ではなく、父母に呪いの言葉を向ける行為を表すため、「呪う」とした。
- source_word: אֶת אָבִיו וְאֶת אִמּוֹ
  choice: 自分の父または母
  rationale: ヘブライ語は接続詞「そして」で結ぶが、法文の適用上は父母のいずれかを呪う場合を含む。日本語では誤って両方を呪った場合だけと読まれないよう「または」とした。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と未完了形の組み合わせによる強調、および受動的な司法処罰を、「必ず死刑に処せられる」で表した。
- source_word: דָּמָיו בּוֹ
  choice: その血の責任は本人にある
  rationale: 直訳的には「その血は彼の上に」であり、処刑される責任が本人に帰するという司法的慣用句である。現代日本語で意味が伝わりつつ「血」の比喩を残した。
theological_decisions:
- issue: אִישׁ אִישׁの性別表現
  choice: 「…者は、だれであれ」として普遍的適用を表す
  alternative: 「男はだれでも」
  rationale: אִישׁは男性形だが、この法的な重複表現は各人・だれでもという分配的意味を担う。日本語で「男」と限定すると、本文が意図する適用範囲を不必要に狭める可能性がある。
- issue: דָּמָיו בּוֹの責任表現
  choice: 「その血の責任は本人にある」
  alternative: 「その血はその者の上にある」または「その者には血の罪がある」
  rationale: 死についての責任が違反者自身に帰するという司法的意味を示し、贖罪論など本文を越える教理的含意は加えない。
- issue: 父母を結ぶ接続関係
  choice: 二箇所とも「父または母」
  alternative: ヘブライ語の形に即して「父と母」
  rationale: 原文のוְは形式上「そして」だが、この禁止規定は父母のどちらか一方への行為にも適用される。日本語の「と」が両者を同時に呪う場合だけを指すとの誤解を避けるため、法的な分配関係を明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法規としての厳粛さを示すため「死刑に処せられる」を用い、古風な「必ず殺されなければならない」は避けた。脚注記号[a]は対応する責任表現の直後に置いた。
