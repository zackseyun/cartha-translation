source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: ja
  text: あなたがたは、わたしに属する者として、聖なる者でなければならない。わたしヤハウェが聖なる者だからである。わたしは、あなたがたがわたしのものとなるよう、諸民族[a]からあなたがたを分けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸国民」とも訳せる。ヘブライ語 עַמִּים は「諸民族」「諸国民」のいずれをも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: でなければならない
  rationale: 接続詞を伴う完了形がこの律法的・勧告的文脈で示す、将来的な要請と結果の力を自然な現代日本語で表した。
- source_word: לִי קְדֹשִׁים
  choice: わたしの聖なる者
  rationale: לִי の神への帰属・関係と、קְדֹשִׁים の道徳的かつ祭儀的な聖別の両面を、簡潔で自然な日本語にした。
- source_word: כִּי
  choice: だからである
  rationale: イスラエルが聖なる者であるべき根拠を示す因果関係を明確にした。
- source_word: קָדוֹשׁ
  choice: 聖なる者
  rationale: 神の聖性を表す定着した語を用い、民に求められる聖さとの語義上のつながりを保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を音写した。
- source_word: וָאַבְדִּל
  choice: 分けた
  rationale: בדל の分離・区別する意味を表し、קדש を訳した「聖なる」との語彙上の区別を保った。完了した神の行為を示す。
- source_word: מִן הָעַמִּים
  choice: 諸民族
  rationale: עַמִּים は複数の民・民族集団を広く指し得るため、地政学的な国家に限定しない訳語を選んだ。
- source_word: לִהְיוֹת לִי
  choice: わたしのものとなるよう
  rationale: 分離の目的・結果と、契約における神への帰属を自然な日本語で表した。
theological_decisions:
- issue: 契約におけるイスラエルの聖さを、道徳的清さだけにも祭儀的な区別だけにも限定しないこと
  choice: קדש を「聖なる」、בדל を「分けた」と訳し分ける
  alternative: קדש も בדל も一律に「聖別する／取り分ける」と訳す
  rationale: 本文はヤハウェの聖さを民の聖さの根拠とし、そのうえで別の動詞 בדל により諸民族からの分離を述べる。二つの語を訳し分けることで、聖性と分離の関連を保ちつつ同一視を避けた。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文にある固有の契約名を称号に置き換えず、一般的な学術的再建に基づく日本語音写で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法としての厳粛さを保った。「わたしの聖なる者」は神への関係・帰属を自然に示し、「わたしのもの」との意図的な反復によって原文の契約的な帰属表現を保持した。
