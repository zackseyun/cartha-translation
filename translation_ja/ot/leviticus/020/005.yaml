id: LEV.20.5
reference: Leviticus 20:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: ja
  text: そのとき、わたし自身がその男とその一族に顔を向け、敵対する。そして、彼と、彼にならって淫行を行い[a]、モレクを慕って淫行を行う者すべてを、彼らの民の中から断つ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「淫行」は、ここでは性的な不貞を表す語を比喩的に用い、偶像礼拝によって神に背くことを指す。
    reason: lexical_alternative
  - marker: b
    text: 「断つ」は契約に基づく裁きを表す言い方。この節だけでは、死、追放、あるいは別の仕方による神の除去のどれを意味するかは特定されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: わたし自身が……顔を向けて敵対する
  rationale: 「顔を向ける」というヘブライ語の比喩を残しつつ、ここでは好意ではなく裁きのために立ち向かう意味であることを、自然な日本語で明示した。独立代名詞 אֲנִי の強調は「わたし自身」で表した。
- source_word: בָּאִישׁ הַהוּא
  choice: その男
  rationale: אִישׁ はここでは違反を犯した単数男性を指すため、性別を曖昧にせず「男」とした。
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: その一族
  rationale: מִשְׁפָּחָה は家族だけでなく親族集団をも指し得る。「一族」は意味範囲の広さを保ち、この文脈にも自然である。
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: 彼を……民の中から断つ
  rationale: 契約上の裁きを表す כרת の比喩を「断つ」で保持し、死、追放、その他の除去のいずれかに限定しなかった。
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: 彼に従って淫行に走り……者たちを皆
  rationale: אַחֲרָיו は彼の行為にならうことを「彼に従って」で表し、זנה の性的な不貞の比喩は「淫行に走る」として保持した。
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: モレクに従って淫行をする
  rationale: 原文が זנה を反復する修辞を日本語でも「淫行」と繰り返した。偶像礼拝を契約的不貞として描く比喩を平板化していない。
- source_word: הַמֹּלֶךְ
  choice: モレク
  rationale: この文脈では神格名として理解し、日本語で一般的な音写「モレク」を用いた。
- source_word: מִקֶּרֶב עַמָּם
  choice: 彼らの民の中から
  rationale: עַמָּם の複数接尾辞を反映して「彼らの民」とし、מִקֶּרֶב は共同体内部からの除去を示す「中から」と訳した。
theological_decisions:
- issue: 偶像礼拝を性的な不貞として描く比喩
  choice: 「淫行に走り」「淫行をする」と訳して比喩と反復を残す。
  alternative: 「不忠実になり」「偶像礼拝をする」と説明的に訳す。
  rationale: 原文は זנה を二度用い、偶像礼拝を契約関係における性的な不貞になぞらえている。その修辞的・神学的緊張を保持した。
- issue: 契約上の裁きとしての「断つ」の具体的意味
  choice: 「民の中から断つ」とし、裁きの手段を特定しない。
  alternative: 「殺す」「共同体から追放する」「滅ぼす」と具体化する。
  rationale: 本文は神による除去を告げるが、この節だけでは死、追放、その他の裁きのどれを指すかを明示していないため、解釈を一つに限定しなかった。
- issue: 裁きが違反者の一族にも向けられること
  choice: 「その男とその一族に顔を向けて敵対する」と原文どおり訳す。
  alternative: 一族への言及を違反に加担した者だけに限定して言い換える。
  rationale: 原文は一族への敵対を明記する一方、この節では各人の関与の程度を説明していない。その緊張を本文に残した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で厳粛な律法文の調子とした。「顔を向ける」「断つ」という原文の主要な比喩は残しながら、「敵対する」を添えて意味を明確にした。זנה の反復も不自然になりすぎない範囲で保持した。
