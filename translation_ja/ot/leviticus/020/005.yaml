  to: そのとき、わたし自身がその男とその一族に顔を向け、敵対する。そして、彼と、彼にならって淫行を行い[a]、モレクを慕って淫行を行う者すべてを、彼らの民の中から断つ[b]。
  rationale: 「彼にならって」により、違反者の行為を後追いするというאַחֲרָיוの含意を明示した。「モレクを慕って」は、偶像を追い求めるאַחֲרֵיの比喩を自然な現代日本語で保つ。二度の「淫行を行う」により、原文のזנהの反復を保持し、注記のアンカーをその語に対応させた。
