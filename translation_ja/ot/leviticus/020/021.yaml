source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: ja
  text: また、兄弟の妻を妻にする者がいるなら、それは汚れである。その者は兄弟の恥をあらわにしたのである。二人は子のない者となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: また、…者がいるなら
  rationale: 接続詞による前後の法規とのつながりと、条件的な法文の性格を、自然な現代日本語で示した。
- source_word: יִקַּח אֶת אֵשֶׁת אָחִיו
  choice: 兄弟の妻をめとる
  rationale: לקח は字義的には「取る」だが、女性を妻として迎える文脈では「めとる」が自然である。すでに「兄弟の妻」とされているため、婚姻手続きの細部までは特定しない。
- source_word: נִדָּה הִוא
  choice: それは汚れである
  rationale: נִדָּה は儀礼的・道徳的な汚れを表し得る。女性自身を「汚れている」と断定せず、この結びつき・行為を指すよう「それは」とした。
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: 兄弟の裸をあらわにした
  rationale: レビ記で不適切な性関係を表す定型的な婉曲表現を保ち、関連箇所との連続性を示した。
- source_word: עֲרִירִים יִהְיוּ
  choice: 二人は子のない者となる
  rationale: 複数形を明示して男女双方を指す「二人」とし、子がいない状態を表す語義を訳した。裁きがどのように実現するかは原文同様に特定しない。
theological_decisions:
- issue: עֲרִירִים יִהְיוּ が表す裁きの内容
  choice: 二人は子のない者となる
  alternative: 二人は子を残さずに死ぬ
  rationale: ヘブライ語は子のない状態を述べるが、死やその時期を明示していない。そのため、裁きの実現方法を訳文で補わず、原文の含みを保った。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で威厳ある法文調とした。「めとる」「裸をあらわにする」はやや格調を保ちつつ、レビ記の婚姻・性関係に関する定型表現を伝える。
