  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: ja
  text: どの遺体[a]にも近づいてはならない。父のためにも母のためにも、身を汚してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「死んだ者のネファショート（人・生命）」。「ネファショート」はここでは清浄規定における慣用表現で、人の遺体を指す。別訳「死体」。
    reason: 原語の慣用的用法と、「遺体」という訳語の選択を示すため。
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: …にも近づいてはならない
  rationale: בוא עַל は祭司の死体による汚れという文脈で、単に「来る」ことではなく、死体に近づくことを禁じる表現として理解した。日本語として自然な禁止表現にした。
- source_word: כָּל
  choice: どの…にも
  rationale: 否定文の中で、例外なく一切を含む包括的な意味を明確に表す。
- source_word: נַפְשֹׁת מֵת
  choice: 死体
  rationale: 字義的には「死者のネフェシュ（人・いのち）」に近いが、レビ記の清浄規定では人の遺体を指す慣用表現である。「死者の魂」は誤解を招くため避けた。
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: 父のためにも母のためにも
  rationale: 前置詞 לְ の関係・理由の意味を保ち、最も近い肉親の場合さえ例外ではないという強調を「にも」で表した。
- source_word: לֹא יִטַּמָּא
  choice: 身を汚してはならない
  rationale: טמא の再帰的な形を反映した。「汚す」はここでは道徳的罪ではなく、死体との関わりによって祭儀上の汚れを負うことを指す。
theological_decisions:
- issue: 死体による汚れの性質
  choice: 「身を汚す」というレビ記の清浄規定の用語を保持する
  alternative: 「儀式上汚れた者となる」と説明的に訳す
  rationale: 本文は道徳的な罪そのものではなく祭司の清浄規定を扱う。「儀式上」を本文に補わず、聖書本文のカテゴリーと緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法の禁止は「…てはならない」で統一し、祭儀上の汚れを道徳化する説明は本文に加えなかった。
