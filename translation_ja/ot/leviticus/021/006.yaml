    issue: 最終節の接続詞を「それゆえ」としている。
    rationale: 原文は וְהָיוּ（そして彼らは聖なる者である／ならなければならない）であり、明示的な帰結標識はない。文脈上の関係を読めても、「そして」として接続の幅を保つ方が原文に忠実である。
  - severity: low
    issue: 冒頭の「神に対して聖なる者」が日本語としてやや不自然である。
    rationale: לֵאלֹהֵיהֶם は神との関係における聖別を表す。「神のために聖なる者」とすることで、余計な神学的解釈を加えず、現代日本語として自然に表現できる。
  revised_text: 彼らは自分たちの神のために聖なる者でなければならず、自分たちの神の名を汚してはならない。彼らはヤハウェへの火によるささげ物、すなわち自分たちの神の食物を献げるからである。そして、彼らは聖なる者でなければならない。
