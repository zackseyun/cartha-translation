  variant: clear modern standard Japanese
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: ja
  text: 彼らは自分たちの神のために聖なる者でなければならず、自分たちの神の名を汚してはならない。彼らはヤハウェへの火によるささげ物、すなわち自分たちの神の食物を献げるからである。そして、彼らは聖なる者でなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: 自分たちの神に対して聖なる者でなければならず
  rationale: 「聖なる」はレビ記における聖／俗の対比を保つ。法的・規範的文脈の未完了形は、現代日本語で自然な義務表現「でなければならない」とした。ל の関係性は「神に対して」で表した。
- source_word: יְחַלְּלוּ שֵׁם אֱלֹהֵיהֶם
  choice: その神の名を汚してはならない
  rationale: חלל のピエル形が示す、聖なるものを俗なものとして扱う行為を、明瞭で格調のある「汚す」で表現した。
- source_word: אִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物
  rationale: אִשֶּׁה は祭儀上の専門語で、火を用いて献げる供え物を指す。「食物のささげ物」と意訳せず、語の火との結びつきを本文に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を音写した。
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: 自分たちの神の食物
  rationale: לֶחֶם は字義的には「パン」だが、ここでは供え物を神の食物として表す祭儀的用法なので、範囲を不必要に狭めない「食物」とした。
- source_word: מַקְרִיבִם
  choice: 献げる者
  rationale: קרב のヒフィル分詞が表す、供え物を神の前に近づけて差し出す祭司の継続的役割を、自然な日本語で表した。
- source_word: וְהָיוּ קֹדֶשׁ
  choice: それゆえ、彼らは聖なる者でなければならない
  rationale: 前の כי 節との論理的なつながりを自然に示しつつ、冒頭と呼応する聖性の要求を保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを読者に示し、称号への置換を避けた。
- issue: אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם の関係
  choice: ヤハウェへの火によるささげ物、すなわち自分たちの神の食物
  alternative: ヤハウェへの食物のささげ物、自分たちの神の食物
  rationale: 「火によるささげ物」という祭儀的意味と、それを「神の食物」と呼ぶ原文の同格的な表現をともに保った。「すなわち」は二つの表現が別々の供え物ではないことを明確にする。
- issue: 祭司の聖性の規範性
  choice: 聖なる者でなければならない
  alternative: 聖なる者となる
  rationale: 法的文脈における未完了形の規範的な力を示したが、聖性の性質について本文以上の教理的説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の祭儀的な格調を保った。「聖なる」「火によるささげ物」「神の食物」という反復と比喩を保持し、原文の神学的緊張を説明的に解消しない方針とした。
