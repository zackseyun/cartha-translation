revisions:
- from: 彼らは自分たちの神に対して聖なる者でなければならず、その神の名を汚してはならない。彼らはヤハウェへの火によるささげ物、すなわち自分たちの神の食物を献げる者だからである。それゆえ、彼らは聖なる者でなければならない。
  to: 彼らは自分たちの神のために聖なる者でなければならず、自分たちの神の名を汚してはならない。彼らはヤハウェへの火によるささげ物、すなわち自分たちの神の食物を献げるからである。そして、彼らは聖なる者でなければならない。
