id: LEV.21.1
reference: Leviticus 21:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「祭司たち、すなわちアロンの子らに告げて、こう言いなさい。あなたがたのうち、だれも自分の民の中の死者[a]のために身を汚してはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「ネフェシュ（נֶפֶשׁ）のために」。ここでは清浄規定上、死体または死者を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「汚れた者となってはならない」とも訳せる。ここでいう汚れは、死者との接触によって生じる祭儀上の汚れを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、現代日本語で一般的な音写によって示す。
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: 告げて、こう言いなさい
  rationale: 同じ動詞の反復をある程度保ちつつ、日本語として不自然な重複を避け、第二の動詞が伝達内容を導入する構造を明確にする。
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: 祭司たち、すなわちアロンの子ら
  rationale: 同格表現として、祭司たちがアロンの子らであることを明示する。「子ら」は家系的・契約的な呼称を保つ。
- source_word: לְנֶפֶשׁ
  choice: 死者のために
  rationale: この清浄規定の文脈では נֶפֶשׁ は死体または死者を指す慣用表現である。「死者」は自然であり、字義的な「魂」という誤解を避ける。前置詞 לְ の関係は「のために」として残す。
- source_word: יִטַּמָּא
  choice: 身を汚してはならない
  rationale: 死者との接触によって祭儀上の汚れを負う再帰的な意味を表す。「身を汚す」は道徳的意味にも取れるため、注で祭儀的汚れであることを明示する。
- source_word: בְּעַמָּיו
  choice: 自分の民の中の
  rationale: 直訳的な「彼の民の中で」を、複数の祭司への呼びかけに合う自然な日本語にした。後続節で近親者の例外が具体化されるため、ここでは「親族」と限定しない。
theological_decisions:
- issue: 祭司規定における「汚れ」の性質
  choice: 死者との関わりによる祭儀上の汚れとして訳す
  alternative: 道徳的な冒涜・罪として「自らをけがしてはならない」と訳す
  rationale: 文脈は死体接触に関する祭司の清浄規定であり、直接に道徳的悪を述べているのではない。本文では簡潔な「身を汚す」を用い、注で祭儀的意味を限定する。
- issue: 単数形 יִטַּמָּא と複数の祭司への命令
  choice: 「あなたがたのうち、だれも……してはならない」
  alternative: 「祭司は……してはならない」
  rationale: 動詞の単数形を個々の祭司に適用される禁止として表しつつ、直前の複数の祭司への呼びかけとのつながりを明確にする。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」で同格を明示し、「あなたがたのうち、だれも」によって複数への呼びかけと個別的禁止を自然に結び付けた。発話は次節以降へ続くため、閉じかぎ括弧は置いていない。
