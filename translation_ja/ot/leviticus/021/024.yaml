  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל אַהֲרֹ֖ן וְ/אֶל בָּנָ֑י/ו וְ/אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: ja
  text: こうしてモーセは、アロンとその息子たち、またイスラエルのすべての子ら[a]に語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人すべて」。ヘブライ語では直訳すると「イスラエルの子ら」で、イスラエルの民を指す定型的な呼び名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: こうして……語った
  rationale: 物語を進めるワウ継続法であり、ここでは一連の規定の結びとして総括的な流れも帯びるため、「こうして」とした。דבר の基本義は簡潔に「語った」と訳した。
- source_word: אֶל
  choice: に
  rationale: モーセが語りかけた相手を示す前置詞なので、現代日本語で自然な「に」とした。
- source_word: בָּנָיו
  choice: その息子たち
  rationale: 男性複数形に三人称男性単数の接尾辞が付き、アロンの男子を具体的に指すため、「子どもたち」ではなく「その息子たち」とした。
- source_word: כָּל
  choice: すべての
  rationale: 後続する集団全体を表す語なので、基本義どおり「すべての」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルのすべての子ら
  rationale: 直訳的な形「イスラエルの子ら」を保ちつつ、כָּל を自然な位置に置いた。この表現はイスラエルの民全体を指す定型的・契約的呼称であるため、その意味を脚注で明示した。
theological_decisions:
- issue: 契約共同体を指す בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルのすべての子ら
  alternative: イスラエル人すべて／イスラエルの全会衆
  rationale: この句は字義上「イスラエルの子ら」であり、同時に民全体を集合的に指す。本文では原文の親族的・契約的表現を残し、その包括的な指示範囲を脚注で示して、男性だけに限定するとの誤解を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、節末の総括的な調子を「こうして」で表した。「息子たち」は具体的なアロンの男子、「子ら」は契約共同体の定型呼称として訳し分けた。
