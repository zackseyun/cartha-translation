id: LEV.21.8
reference: Leviticus 21:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: ja
  text: あなたは彼を聖なる者として扱わなければならない。彼はあなたの神の食物[a]を献げるからである。彼はあなたにとって聖なる者でなければならない。あなたがたを聖なる者とするわたし、ヤハウェは聖なる者だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたの神のパン」。ここで「パン」は、神に献げられる食物の供え物全般を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: あなたは彼を聖なる者として扱わなければならない
  rationale: ピエル形の命令的用法と目的語接尾辞を踏まえ、祭司を聖別された者として認め、相応に扱うよう求める意味を、現代日本語で自然に表した。
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: あなたの神の食物
  rationale: לֶחֶם は字義的には「パン」だが、祭儀的文脈では神に献げる供え物全般を指し得るため、「食物」とした。字義的な別訳は脚注に残した。
- source_word: מַקְרִיב
  choice: 献げる
  rationale: קרב のヒフィル分詞は祭儀的文脈で供え物を差し出すことを表すため、日本語の聖書的・祭儀的用語として自然な「献げる」を選んだ。
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: 彼はあなたにとって聖なる者でなければならない
  rationale: 関係を示す לְ を「あなたにとって」で保ち、יִהְיֶה の規範的な力を「でなければならない」で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
- source_word: מְקַדִּשְׁכֶם
  choice: あなたがたを聖なる者とする
  rationale: קדשׁ の反復を「聖なる者」として可視化しつつ、現代の一般読者に明瞭な表現とした。複数接尾辞を「あなたがた」で明示した。
theological_decisions:
- issue: לֶחֶם אֱלֹהֶיךָ の祭儀的意味
  choice: あなたの神の食物
  alternative: あなたの神のパン
  rationale: 祭司が献げる供え物を広く指す可能性が高いので本文では「食物」とし、ヘブライ語の字義は脚注に示した。
- issue: קדשׁ 語根の反復
  choice: 聖なる者として扱う／聖なる者／聖なる者とする
  alternative: 聖別する／聖別された者／聖別する
  rationale: 祭司の扱い、祭司の身分、ヤハウェの働きの連関を保ちながら、専門語に偏らない明瞭な日本語にした。
- issue: 二人称の数の変化
  choice: 前半の単数を「あなた」、終節の複数を「あなたがた」として区別する
  alternative: 全体を「あなたがた」に統一する
  rationale: ヘブライ語本文にある ךָ／לָּךְ の単数と כֶם の複数の移行を、解釈で均さず保持した。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。「聖なる」の反復を保ち、祭儀的な「献げる」を用いた。二人称単数と複数の切り替わりも原文どおり示した。
