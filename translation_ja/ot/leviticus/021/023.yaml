id: LEV.21.23
reference: Leviticus 21:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: ja
  text: ただし、彼は垂れ幕のところへ行ってはならず、祭壇に近づいてもならない。彼の身体には欠陥があるからである[a]。彼はわたしの聖所を汚してはならない[b]。わたしは彼らを聖別するヤハウェだからである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「欠陥」は、この規定において祭司が祭壇で奉仕する資格に関わる身体上の状態を指し、道徳的な過失や人としての価値を意味しない。別訳「彼には傷がある」。
    reason: מוּםの祭儀的・法的な用法を示し、道徳的評価との混同を避けるため。
  - marker: b
    text: ヘブライ語は「わたしの聖所」を複数形で表している。ここでは日本語として自然な集合的表現で訳している。「汚す」は、聖なるものを俗なものとして扱い、その神聖さを損なうことをいう。
    reason: מִקְדָּשַׁיの複数形と、חללの祭儀的意味を明示するため。
  - marker: c
    text: 「彼ら」は、文脈上は祭司たちを指すと読むのが有力である。文法上は直前の「聖所」を指す可能性もあるため、本文では指示対象を限定していない。
    reason: מְקַדְּשָׁםの複数接尾辞にある解釈上の幅を保持するため。
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 前節で認められた聖なる食物を食べることに対し、ここで祭司としての接近には制限があることを示すため、逆接的・限定的な働きを自然な日本語で表した。
- source_word: הַפָּרֹכֶת
  choice: 垂れ幕
  rationale: 聖所内部を仕切る幕を指す祭儀用語であり、現代日本語で具体的に理解しやすい表現とした。
- source_word: יָבֹא אֶל־הַפָּרֹכֶת
  choice: 垂れ幕の所まで入る
  rationale: 直訳的には「垂れ幕へ来る」。聖所内で垂れ幕の所まで進み入ることを禁じる文脈を、過度に「内側」と限定せずに表した。
- source_word: יִגַּשׁ אֶל־הַמִּזְבֵּחַ
  choice: 祭壇に近づく
  rationale: 祭司が奉仕のため祭壇に接近することを表す定型的な祭儀表現を保った。
- source_word: מוּם בּוֹ
  choice: 彼には身体上の欠陥がある
  rationale: この祭司規定では身体的な欠損・障害を指し、道徳的な過失ではないことが分かるようにした。歴史的本文の厳しい表現は保持しつつ、脚注で適用範囲を明示した。
- source_word: יְחַלֵּל
  choice: 冒す
  rationale: 聖なるものを俗なものとして扱い、その神聖さを損なうという חלל の祭司文書における意味を、「汚す」よりも祭儀的に表した。
- source_word: מִקְדָּשַׁי
  choice: わたしの聖所の数々
  rationale: ヘブライ語の複数形を単数に均さず保持した。日本語としてやや明示的だが、後続の複数代名詞とのつながりも示せる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を、称号「主」に置き換えず音写した。
- source_word: מְקַדְּשָׁם
  choice: それらを聖別する
  rationale: 男性複数接尾辞を明示し、直前の複数形「わたしの聖所の数々」を最も近い先行詞として訳した。「聖別する」により קדש の聖性語彙を保った。
theological_decisions:
- issue: מוּם が示すものと人間的価値との区別
  choice: 祭壇奉仕への身体上の資格制限として訳す
  alternative: 道徳的な欠点、または人としての価値の欠如を示す表現として読む
  rationale: レビ記21章の文脈は祭司の特定の祭儀奉仕に関する規定であり、罪責や人格的価値を論じてはいない。この区別を脚注で明示した。
- issue: מְקַדְּשָׁם の接尾辞の指示対象
  choice: 直前の「わたしの聖所の数々」を指す
  alternative: 祭司たち、またはイスラエルの民を広く指す
  rationale: 文法上最も近い複数の先行詞は מִקְדָּשַׁי であり、聖なる空間への接近を扱う直近の文脈にも適合する。ただし、より広い対象を想定する余地を脚注で示した。
translation_notes:
  register: 明快な現代標準日本語を基調としながら、祭儀法にふさわしい端正さを保った。「身体上の欠陥」は原文の法的区分を率直に伝える一方、現代では人への否定的評価と受け取られ得るため、脚注で祭壇奉仕に限定された規定であることを明記した。「聖所の数々」は原文の複数形を可視化するためのやや形式対応的な表現である。
