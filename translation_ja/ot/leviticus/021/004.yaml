  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: ja
  text: 彼は、自分の民の中で夫として身を汚し[a]、自らの聖別を損なってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は、自分の民の中の有力者として身を汚し、自らの聖別を損なってはならない」。このヘブライ語の句は難解であり、夫に限らず、民の中で高い立場にある者として身を汚すことを禁じている、とも解釈される。
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: 身を汚す
  rationale: 死者との接触によって祭儀上の汚れを負うことを表す再帰的な動詞形。祭司の聖さという文脈に合う自然な表現とした。
- source_word: בַּעַל
  choice: 夫として
  rationale: この難解な句では「夫」が一般的な語義であり、直前の近親者に関する規定とも整合する。ただし「有力者として」という解釈も可能なため、脚注に残した。
- source_word: בְּעַמָּיו
  choice: 自分の民の中で
  rationale: 原文の「彼の民の中で」をほぼ字義どおりに訳し、親族集団を指し得る含みを保持した。
- source_word: לְהֵחַלּוֹ
  choice: 自らを聖なるものではなくする
  rationale: חללが聖と俗の対立を表すため、「冒涜する」よりも、この文脈で祭司自身の聖別された身分を損なう意味が伝わる表現を採った。目的・結果の含みは日本語の並列禁止表現に込めた。
theological_decisions:
- issue: 難解な句 בַּעַל בְּעַמָּיו の解釈
  choice: 祭司が自分の民の中で夫として、すなわち妻のために死者による汚れを負うことを禁じる句とした。
  alternative: 「自分の民の中の有力者として身を汚してはならない」、または「自分の民の中で身を汚し、自らを聖なるものではなくしてはならない」。
  rationale: בַּעַל の通常の語義「夫」と近親者を列挙する文脈を重視した。一方、原文は統語的に圧縮されており確定困難なので、別解を脚注で明示して曖昧さを保持した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭司法にふさわしい厳粛さを保った。「聖なるものではなくする」はやや説明的だが、聖／俗という原語の対立を可視化し、「冒涜する」が生み得る能動的な侮辱行為という誤解を避ける。
