  text: ヤハウェはモーセにこう告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語って言われた
  rationale: 物語を進めて神の新たな発言を導入する動詞。日本語の聖書文体として自然な敬語を用い、後続の לֵאמֹר と合わせて発言内容が次節に続くことを示した。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語だが、日本語で広く定着した伝統的な代替表記「主」を本文に置き、原語について脚注で明示した。
- source_word: אֶל
  choice: に
  rationale: 語りかけの相手を示す前置詞を、現代日本語で自然な助詞「に」とした。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を採用した。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する直接話法を導く定型句。וַיְדַבֵּר と組み合わせ、原文の二段階の発話導入を保ちつつ、神を主語とする自然で敬意ある日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で「原文は神の固有名YHWH」）
  alternative: ヤハウェ
  rationale: 原文が称号ではなく神の固有名を用いることは脚注で保持した。一方、本文では日本語聖書として認知度が高く朗読にも適する「主」を採用し、特定の学説に依存する母音表記を本文で断定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。簡潔な発話導入句として、次節へ続く構造を維持した。
