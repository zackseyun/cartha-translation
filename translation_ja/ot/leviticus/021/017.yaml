id: LEV.21.17
reference: Leviticus 21:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: ja
  text: アロンに告げなさい。「あなたの子孫のうち、代々、身体に欠陥[a]のある男は、自分の神の食物[b]を献げるために近づいてはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「欠陥」と訳した語は「傷、欠点」とも訳せる。ここでは、この祭司職務に就く資格に関わる身体的な欠陥を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「自分の神のパン」。この祭儀的な文脈では、神に献げる食物を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: アロンに告げなさい
  rationale: 命令形と発話導入句を、現代日本語の律法文として自然かつ明確に表した。
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: あなたの子孫のうち…男
  rationale: アロンの祭司職を継ぐ男子を指す男性単数形を保持しつつ、「種」のような不自然な直訳を避けた。
- source_word: לְדֹרֹתָם
  choice: 代々
  rationale: アロンの家系の後代にわたって規定が適用されることを簡潔に表した。
- source_word: מוּם
  choice: 身体に欠陥
  rationale: この祭司規定では職務上の資格に関わる身体的な欠損・異常を指す。「傷」だけに狭めず、文脈上の身体性を明示した。
- source_word: לֹא יִקְרַב
  choice: 近づいてはならない
  rationale: 聖所での奉仕に近づくという祭儀的な用法と、禁止の法的効力を保った。
- source_word: לְהַקְרִיב
  choice: 献げるために
  rationale: ヒフィル形が供え物を神に差し出す行為を表すため、祭儀文脈にふさわしい「献げる」とした。
- source_word: לֶחֶם אֱלֹהָיו
  choice: 自分の神の食物
  rationale: לֶחֶם の字義は「パン」だが、ここでは犠牲として献げる食物を広く指すため、本文では「食物」とし、字義を注記した。
theological_decisions:
- issue: 身体的欠陥のある祭司に関する祭儀上の制限
  choice: 食物を献げるために近づくという特定の祭司職務に関する禁止として訳した。
  alternative: 人としての価値、道徳的罪責、契約共同体全般からの排除まで意味する表現にする。
  rationale: 原文が明示するのは祭儀上の職務制限であり、それを超える評価を訳文に持ち込まないため。
- issue: לֶחֶם אֱלֹהָיו の範囲
  choice: 本文を「自分の神の食物」とし、注で字義の「パン」と祭儀的な広義を示した。
  alternative: 「自分の神のパン」と字義どおりに訳す。
  rationale: 祭司文書における供え物としての食物という意味を明瞭にしながら、原語の比喩的・祭儀的表現も注で保存するため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、律法としての厳粛さを保った。「男」「近づく」「献げる」によって、祭司職務に関する原文の具体性と祭儀的語感を保持した。
