  text: כִּ֚י אִם לִ/שְׁאֵר֔/וֹ הַ/קָּרֹ֖ב אֵלָ֑י/ו לְ/אִמּ֣/וֹ וּ/לְ/אָבִ֔י/ו וְ/לִ/בְנ֥/וֹ וּ/לְ/בִתּ֖/וֹ וּ/לְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: ja
  text: ただし、自分に近い近親者[a]、すなわち、母、父、息子、娘、兄弟のためには、身を汚してよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近親者」に当たるヘブライ語は、字義的には「肉」を意味し、肉親・近親者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ただし……ためには
  rationale: 前節の禁止に対する例外を導く表現として、現代日本語の法的・説明的文脈に自然な「ただし」を用いた。
- source_word: שְׁאֵרוֹ
  choice: 自分の身内
  rationale: 語の字義には「肉」の含みがあり、ここでは血縁関係にある近親者を指す。「身内」は自然な日本語で親族関係を表し、字義的背景は脚注に示した。
- source_word: הַקָּרֹב אֵלָיו
  choice: 自分に最も近い
  rationale: 親族としての近さを表す限定句であり、単なる心理的親密さではなく近親性を明確にするため「最も近い」とした。
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: 母、父、息子、娘、兄弟のためには
  rationale: 反復される לְ は、死者との関わりによる祭司の汚れが誰のために許されるかを示す。日本語では列挙の各項に「のために」を繰り返さず、末尾でまとめる方が自然で意味も保たれる。
- source_word: אָחִיו
  choice: 兄弟
  rationale: 男性のきょうだいを指す語であり、年長・年少は特定されないため「兄」や「弟」ではなく「兄弟」とした。
theological_decisions:
- issue: 前節から補われる述語
  choice: 「身を汚すことができる」を補った
  alternative: 原文どおり例外対象の列挙だけで節を終える
  rationale: この節はヘブライ語では前節の禁止を受ける省略構文だが、日本語で単独でも理解できるよう述語を補った。許可の意味は前節との統語関係から生じるもので、新たな教理的解釈ではない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の近親者の列挙順を保持しつつ、日本語として自然になるよう反復前置詞を末尾の「のためには」にまとめた。文脈上省略された述語を補い、単独の節としての可読性を確保した。
