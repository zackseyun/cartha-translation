source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: ja
  text: なぜなら、身体に欠陥のある者は、だれも近づいてはならない[a]。すなわち、目の見えない者、足の不自由な者、鼻など顔の一部に損傷や変形のある者[b]、また手足の一部が不釣り合いに長い者[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「近づく」とは、祭司として聖所で奉仕するために近づくことを指す。
    reason: cultural_note
  - marker: b
    text: このヘブライ語は稀な語で、特に鼻が欠けたり変形したりしている状態を指す可能性がある。
    reason: lexical_alternative
  - marker: c
    text: このヘブライ語の厳密な意味は不確かで、手足などが伸びすぎている状態、または身体の一部が不釣り合いである状態を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （独立した接続語としては訳出せず、理由説明の流れを文脈に委ねる）
  rationale: 前節の規定を説明する語。単節でも不自然にならない明瞭な日本語を優先し、内容上の説明関係は保持した。
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: 身体に欠陥のある者は、だれも
  rationale: 否定文中の「すべての男」を日本語の自然な全称否定で表した。מוּם はここでは祭司職務上の身体的欠陥を指すため、「身体に欠陥」とした。
- source_word: לֹא יִקְרָב
  choice: 近づいてはならない
  rationale: 祭司として聖所で奉仕するために近づくことを表す祭儀的用法。本文では原語の簡潔さを保ち、範囲を脚注で明示した。
- source_word: אִישׁ עִוֵּר
  choice: 目の見えない者
  rationale: 状態を自然で尊重ある現代日本語で表した。
- source_word: פִסֵּחַ
  choice: 足の不自由な者
  rationale: 歩行に支障のある状態を指す語を、現代日本語で過度に侮蔑的にならない表現とした。
- source_word: חָרֻם
  choice: 鼻など顔の一部が損なわれた者
  rationale: 稀な語で、特に鼻の欠損・変形を指す可能性が高いが、意味の確定度を超えないよう「など」を加えた。
- source_word: שָׂרוּעַ
  choice: 手足の一部が不釣り合いに長い者
  rationale: 伸びた、あるいは過度に長い身体部分を指すとみられる稀な語。具体性を保ちつつ、その不確実性を脚注に示した。
theological_decisions:
- issue: 身体的欠陥に関する規定の範囲
  choice: 祭司が奉仕のために近づく資格についての祭儀上の規定として訳す
  alternative: 人の価値や道徳性についての一般的評価として読む
  rationale: 文脈はアロンの子孫である祭司の聖所奉仕を扱っている。本文にない人格的・道徳的評価を加えず、規定の祭儀的範囲を脚注で明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の法規的な響きを維持しつつ、身体状態の表現には現在一般に理解しやすい語を用いた。稀な二語の意味は本文で過度に断定せず、脚注で不確実性を明示した。
