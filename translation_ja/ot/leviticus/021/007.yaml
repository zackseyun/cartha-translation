source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: ja
  text: 彼らは、娼婦や汚された女を妻としてはならない。また、夫に離縁された女を妻としてはならない。祭司は自分の神に対して聖なる者だからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹנָה
  choice: 娼婦
  rationale: 売春に従事する女性を指す通常の語義を、現代日本語で明確かつ簡潔に表した。
- source_word: חֲלָלָה
  choice: 身を汚された女
  rationale: 語根 חלל が示す聖性・身分の毀損を保ちつつ、この婚姻規定における女性を指す表現とした。具体的な事情は本文が明示しないため限定しない。
- source_word: יִקָּחוּ
  choice: 妻としてはならない
  rationale: 字義的には「取ってはならない」だが、文脈上は祭司の婚姻相手に関する規定なので、自然な日本語でその意味を明示した。
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: 夫から離縁された女
  rationale: 受動分詞と「彼女の夫から」という構文を反映し、離婚された女性であることを明確にした。
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו
  choice: 祭司は自分の神に対して聖なる者である
  rationale: 単数代名詞への移行を日本語で明確にし、לְ の関係性を「神に対して」と表した。
theological_decisions:
- issue: 複数形の婚姻規定から単数形の聖性理由への移行
  choice: 前半は「彼ら」、理由節は「祭司」とした
  alternative: 全体を複数形にそろえて「彼らは自分たちの神に対して聖なる者」とする
  rationale: ヘブライ語本文の数の変化を保持しながら、日本語で単数の「彼」が誰か曖昧になりすぎないよう集合的な「祭司」で示した。
- issue: חֲלָלָה の意味範囲
  choice: 身を汚された女
  alternative: 冒涜された女／聖性を失った女／汚れた女
  rationale: 祭司的な聖性の毀損という含意を残しつつ、本文が原因や法的身分を詳述していない点を尊重した。儀礼的不浄を直接表す טמא と同一視する「汚れた」は避けた。
translation_notes:
  register: 律法本文にふさわしい簡潔で端正な現代標準日本語。「妻としてはならない」で婚姻規定であることを明確化し、過度に古風な「娶る」は避けた。
