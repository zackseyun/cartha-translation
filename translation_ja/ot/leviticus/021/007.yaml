  source_fidelity: ヘブライ語の婚姻禁止、離婚された女性、ならびに祭司の聖性という全体の内容は適切に反映されている。ただし、חֲלָלָה は受動的に「俗なるものとされた／汚された」女性を指す語であり、「身を汚された」は身体的・性的な被害または行為を具体的に連想させやすい。「汚された女」として、本文が示さない事情を限定しない表現に改めるのが安全である。
  naturalness: 簡潔で現代標準日本語として自然であり、「妻としてはならない」は婚姻規定の文脈を明確にしている。「夫から離縁された」は意味は通るが、「夫に離縁された」のほうが現代日本語の受動表現として自然である。
  terminology: 「娼婦」は זֹנָה の通常の語義を明確に伝える。「離縁」は法規範的文脈に適する。חֲלָלָה については、儀礼的な不浄（טמא）と同一視せず、また具体的な原因を補わない「汚された女」がよい。理由節の「自分の神に対して聖なる者」は、לֵאלֹהָיו の関係を過度に教義化せずに表している。
