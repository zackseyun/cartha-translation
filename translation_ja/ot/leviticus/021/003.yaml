  source_fidelity: 原文は、祭司が死者のために儀礼上の汚れを負うことを許される近親者の一例として、「彼に近い処女の姉妹、すなわち男に属したことのない者」を挙げる。草案は主要な条件と許可の意味を概ね保っているが、「彼の身近にいる」は日本語として不自然で、ヘブライ語の近親性・近さの表現を十分に明瞭に伝えない。
  naturalness: 「自分の姉妹」と「彼の身近にいる」が同一人物を指すのに視点が混在し、また「彼の身近にいる処女」は現代日本語では空間的な近さを主に連想させる。主語を明示し、関係節を自然に整える必要がある。
  terminology: 「処女」は原語の性的状態を保つ適切な法的・本文的語である。「身を汚してよい」は文脈上は儀礼的汚れを指すが、現代語で道徳的含意もあり得るため、「儀礼上」を補って文脈上の意味を明確にするのが安全である。脚注は原文の慣用的表現が婚姻と性的結合のいずれにも関わり得ることを適切に示している。
