  text: וְ/לַ/אֲחֹת֤/וֹ הַ/בְּתוּלָה֙ הַ/קְּרוֹבָ֣ה אֵלָ֔י/ו אֲשֶׁ֥ר לֹֽא הָיְתָ֖ה לְ/אִ֑ישׁ לָ֖/הּ יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: ja
  text: また彼は、彼に近い処女の姉妹、すなわち男と結ばれたことのない者のためには、儀礼上、身を汚してよい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: また、自分の姉妹……のためには
  rationale: 接続詞と前置詞が、身を汚すことを許される別の近親者を列挙していることを示す。三人称接尾辞は自然な日本語で「自分の」とした。
- source_word: הַבְּתוּלָה
  choice: 処女
  rationale: 性的状態を表す語の直接的な意味を保ち、後続する条件との意図的な重なりも残した。
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: 彼の身近にいる
  rationale: 近い関係または近接を表すヘブライ語の比喩を保ちつつ、単に感情的な親密さだけに限定しない表現とした。
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: まだ男と結ばれていない
  rationale: 直訳的な所有表現を日本語に持ち込まず、婚姻または性的結合に入っていないという慣用句の幅を保った。限定を避けるため脚注を付した。
- source_word: יִטַּמָּא
  choice: 身を汚してもよい
  rationale: 文脈上、死者との接触によって祭儀上汚れた状態になることへの許可を表す。道徳的腐敗を意味する表現としてではなく、レビ記の清浄規定の定型的な言い方として訳した。
theological_decisions:
- issue: 祭司規定における「汚れ」の性質
  choice: 「身を汚してもよい」とし、死者との接触による祭儀上の汚れへの許可として表した
  alternative: 「自らを冒瀆してもよい」または道徳的な罪を示す表現
  rationale: この箇所が扱うのは祭司の死体接触に伴う清浄・不浄の身分であり、人格的・道徳的な堕落ではない。
- issue: 「男と結ばれていない」の範囲
  choice: 婚姻と性的結合の双方を含み得る表現として曖昧さを保った
  alternative: 「夫がいない」または「男と性的関係を持ったことがない」に限定する
  rationale: 原文の慣用表現は、男の家に婚姻によって入ることと性的結合の双方を示唆し得るため、一方だけに限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法本文にふさわしい簡潔で端正な調子とした。「すなわち」によって、後続部分が姉妹を限定・説明する構造であることを明確にした。
