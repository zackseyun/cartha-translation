  rationale: 関係節を「彼に近い処女の姉妹」として自然な現代標準日本語に改め、人称を統一した。「男と結ばれたことのない者」は、婚姻・性的結合のいずれにも関わり得る原文の慣用的な幅を維持する。「儀礼上」を補い、文脈上の不浄が道徳的非難ではないことを明確にした。
