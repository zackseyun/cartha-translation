  yaml_path: translation/ot/leviticus/021/019.yaml
  text: or a man who has a broken foot or a broken hand,[a]
translation:
  language: ja
  text: また、足を骨折している者、あるいは手を骨折している者、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: また／あるいは
  rationale: 列挙を続ける最初の接続詞は「また」、二つの身体部位を分ける二つ目は「あるいは」とし、日本語として自然に区別した。
- source_word: אִישׁ אֲשֶׁר יִהְיֶה בוֹ
  choice: …している者
  rationale: 直訳的には「その人のうちに…がある男」だが、祭司についての規定という文脈を受け、状態を表す自然な日本語とした。
- source_word: שֶׁבֶר
  choice: 骨折している
  rationale: 骨や身体部位の「折れ、骨折」を指す名詞。日本語では「足／手を骨折している」が明瞭で自然であり、原文で同語が反復される点も保った。
- source_word: רָגֶל
  choice: 足
  rationale: 基本義の「足」を採用した。「脚」の可能性もあるが、文脈から意味を広げる必然性はない。
- source_word: יָד
  choice: 手
  rationale: 基本義の「手」を採用した。「腕」まで含み得る語だが、ここで意味を広げる文脈上の必要はない。
theological_decisions: []
translation_notes:
  register: 祭司の身体的条件を列挙する法文として、簡潔で現代的かつ品位ある表現にした。節単独では文が次節へ続くため、末尾を読点とした。性別は周辺文脈で祭司を指すことから明らかであり、不自然な「男」を重ねず「者」とした。
