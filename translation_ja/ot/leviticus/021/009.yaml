  naturalness: 「祭司である人の娘」は現代日本語として不自然であり、「祭司の娘」が明瞭である。「父を冒涜している」も人を直接目的語に取る日本語としてやや硬く不自然なため、原文の聖性語彙を保ちながら「父を汚す」とするのが自然である。
  terminology: חללの二つの用例を「自らを汚す」「父を汚す」と対応させる。これは「冒涜」よりも人である父を目的語に取る日本語として適切で、祭司的聖性を損なう含意も保つ。זנהは文脈上「売春」でよい。
