source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: ja
  text: 祭司の娘が、もし売春をして[b]自らを汚すなら[a]、父を汚すことになる。彼女は火で焼かれなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もし売春を始めるなら」。ヘブライ語の動詞は「始める」を意味する場合もあるが、ここでは売春によって自らが汚される、すなわち聖別性が損なわれるという意味に取るのが文脈に適している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「娼婦として行って」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: 祭司である人の娘が
  rationale: 直訳的な構造「祭司である人の娘」を保ち、祭司の娘を対象とする法規定であることを明確にした。
- source_word: כִּי
  choice: もし…なら
  rationale: 法規定における条件を導く用法として訳した。時間的な「…するとき」も可能だが、ここでは事例法の条件表現が自然である。
- source_word: תֵחֵל
  choice: 身を汚す
  rationale: חלל のニファル形を、聖性が損なわれるという結果を含む表現として訳した。「始める」という別の語義も脚注に残した。
- source_word: לִזְנוֹת
  choice: 売春をして
  rationale: זנה の具体的な性的意味を保った。「性的不品行」では範囲が広すぎるため採らなかった。
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: 彼女は父を冒涜している
  rationale: חלל のピエル形が表す、祭司である父の聖性を俗なるものにするという祭司法上の重みを「冒涜する」で保持した。
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: 彼女は火で焼かれなければならない
  rationale: ニファル未完了形の法的な処罰規定としての力を、明確な義務表現で示した。処刑方法や手順について本文以上の限定は加えていない。
theological_decisions:
- issue: 祭司の聖性に関わる חלל の語彙をどう表すか
  choice: 娘については「身を汚す」、父については「冒涜する」と訳す
  alternative: 両方を「汚す」と訳す、または父について「辱める」と訳す
  rationale: 同じ語根のつながりを意味上保ちつつ、現代日本語として自然にした。「辱める」だけでは祭司の聖性を損なうという祭儀的含意が弱くなるため、「冒涜する」を用いた。
translation_notes:
  register: 現代の一般読者に理解できる明瞭な法文調としつつ、祭司法に固有の聖性・冒涜の語感を保った。刑罰表現は厳粛かつ直接的に訳し、本文にない説明は加えていない。
