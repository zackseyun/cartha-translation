  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: ja
  text: 彼は聖所から出てはならない。また、自分の神の聖所を汚して、俗なるものとしてはならない。彼の神の注ぎの油による聖別[a]が彼の上にあるからである。わたしは主である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別」は、より直訳的には「冠」とも訳せる。ヘブライ語の語は「冠」と「聖別、奉献」の両方を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: 彼は聖所から出てはならない
  rationale: מִקְדָּשׁを祭儀的文脈に即して「聖所」とし、יָצָאの具体的な「出る」という意味と、法規における禁止の力を保った。
- source_word: וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: また、自分の神の聖所を汚してはならない
  rationale: חללのピエル形は聖なるものを俗なものとして扱うことを表す。「汚す」は現代日本語で自然であり、聖所を冒す祭儀的意味を伝える。ヘブライ語に従って「聖所」を反復した。
- source_word: כִּי
  choice: からである
  rationale: 前の二つの禁止の理由を導く因果関係を明確に示した。
- source_word: נֵזֶר
  choice: 聖別のしるし
  rationale: この語には「冠、額飾り」と「聖別、奉献」の意味領域がある。ここでは注ぎの油によって示される大祭司の聖別された身分を自然に表しつつ、「しるし」によって具体的な標識の含みも残した。字義的な別訳は脚注に示した。
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: 彼の神の注ぎの油
  rationale: 連語の全要素を保ち、「油を注ぐ」という聖別行為とのつながりが分かる表現とした。
- source_word: עָלָיו
  choice: 彼の上にある
  rationale: 聖別が彼に付与され、継続していることを表す前置詞句を、原文に近い荘重な表現で保持した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の固有名יהוהを「ヤハウェ」と音写し、レビ記に繰り返される神の権威を示す定型句を保った。
theological_decisions:
- issue: נֵזֶרが大祭司の身分について何を指すか
  choice: 本文では「聖別のしるし」とした。
  alternative: 「彼の神の注ぎの油という冠が、彼の上にある」または「彼の神の注ぎの油による聖別が、彼の上にある」。
  rationale: 文脈では、注ぎの油によって与えられた聖別された身分が、聖所を離れたり汚したりしてはならない理由となっている。一方、נֵזֶרには文字どおりの「冠、額飾り」という像もあるため、その曖昧さを脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭司法規にふさわしい簡潔で荘重な調子を保った。禁止は「〜てはならない」で統一し、原文の反復と因果関係を明示した。
