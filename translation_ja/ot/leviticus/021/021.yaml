  terminology: 「祭司アロン」「ヤハウェ」「献げる」は一貫している。「神のパン」は原語の祭儀的慣用句を字義的に保持しており、脚注の説明で意味が補われている。「火によるささげ物」も אִשֵּׁי の有力な訳語として許容され、脚注の別訳も適切である。
