source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: ja
  text: 祭司アロンの子孫のうち、身体に欠陥のある者はだれも、ヤハウェへの火によるささげ物[a]を献げるために近づいてはならない。身体に欠陥のある者は、自分の神のパン[b]を献げるために近づいてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェへの食物のささげ物」。原語は、火によって献げられるささげ物を指す祭儀用語。
    reason: lexical_alternative
  - marker: b
    text: 「神のパン」は、犠牲として神に供えられる食物を指す祭司文書の表現。別訳「自分の神の食物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: …者はだれも…してはならない
  rationale: כָּל と否定節による全面的な禁止を、自然な現代日本語の法文調で表した。祭司職の文脈にある男性を指す「者」を用いた。
- source_word: מוּם
  choice: 身体に欠陥
  rationale: この文脈では祭司職を制限する身体上の状態を指す。単なる「傷」より範囲が明確になるよう、初出では「身体に欠陥」とした。
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの子孫のうち
  rationale: זֶרַע の系譜的意味を「子孫」で示し、הַכֹּהֵן をアロンへの同格表現として訳した。
- source_word: יִגַּשׁ
  choice: 近づいてはならない
  rationale: 祭儀奉仕のため神の前へ進み出るという נגשׁ の意味を保ち、二度の反復も訳文に残した。
- source_word: לְהַקְרִיב
  choice: 献げるために
  rationale: 使役形 הקריב の祭儀的用法を、明瞭で自然な「献げる」で表した。
- source_word: אִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物
  rationale: אִשֶּׁה の語源・伝統的理解に沿う「火によるささげ物」を本文に置き、食物としての含意は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名である四文字語を、一般的な日本語音写で示した。
- source_word: לֶחֶם אֱלֹהָיו
  choice: 自分の神のパン
  rationale: לֶחֶם の字義「パン」と祭司文書特有の比喩を保持し、ここで祭物を指すことを脚注で説明した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を明記しているため、称号に置き換えず音写した。
- issue: לֶחֶם אֱלֹהָיו の祭儀的表現
  choice: 自分の神のパン
  alternative: 自分の神の食物
  rationale: 原文の具体的な比喩を本文に保持しつつ、それが神に供される祭物を意味することを脚注で明示した。
- issue: מוּם の表現
  choice: 身体に欠陥
  alternative: 傷のある者
  rationale: 直前の列挙を受けた祭司資格に関する身体上の状態を表す一方、本文が述べていない道徳的評価を加えないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法にふさわしい簡潔で厳粛な調子と、原文にある「近づく」「献げる」の反復を保持した。
