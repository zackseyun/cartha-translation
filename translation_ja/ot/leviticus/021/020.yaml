base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: ja
  text: または、背中の曲がった者[a]、発育の損なわれた者[b]、目に異常のある者[c]、皮膚病のある者[d]、皮膚にただれのある者[d]、睾丸のつぶれた者である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「背の曲がった者」または「背にこぶのある者」。
    reason: lexical_alternative
  - marker: b
    text: このヘブライ語の意味は不確かで、「小柄な者」「発育不全の者」「やせ衰えた者」などとも訳される。
    reason: lexical_alternative
  - marker: c
    text: 別訳「目に斑点のある者」。どのような目の異常かは確定できない。
    reason: lexical_alternative
  - marker: d
    text: ここに挙げられた二つのヘブライ語は、異なる皮膚疾患を指すと考えられるが、現代の病名との正確な対応は不明である。
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: 背中の曲がった者
  rationale: 背中が湾曲または隆起した身体的状態を指す語。現代日本語で自然かつ直接的に表し、特定の医学的診断には限定しない。
- source_word: דַּק
  choice: 発育の損なわれた者
  rationale: 語義は不確かで、小柄、発育不全、やせ衰えた状態などが提案される。曖昧さを保ちながら、単に体格が小さいことへの断定を避ける。
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: 目に異常のある者
  rationale: 何らかの眼の異常を表すが、斑点や白内障など正確な症状は確定できないため、過度に医学的な特定を避ける。
- source_word: גָרָב
  choice: 皮膚病
  rationale: かゆみや疥癬状の症状を伴う皮膚疾患と考えられるが、現代の病名との厳密な対応は不明。広い表現を採る。
- source_word: יַלֶּפֶת
  choice: 皮膚のただれ
  rationale: גָרָבとは別種の発疹性または鱗状の皮膚疾患を指すとみられる。両語を区別しつつ、診断名を断定しない。
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: 睾丸のつぶれた者
  rationale: 睾丸が圧損・損傷した状態を指す。身体部位を婉曲化せず、ヘブライ語の具体性を保つ。
- source_word: אוֹ
  choice: また／または
  rationale: 列挙される各条件を選言的につなぐ反復語。日本語では冒頭を「また」、近接する皮膚疾患を「または」として自然な列挙にする。
theological_decisions:
- issue: 祭司の身体条件を定める律法における身体表現
  choice: 身体的状態を直接記し、道徳的評価を加えない
  alternative: 婉曲表現に置き換える、または現代医学の診断名で特定する
  rationale: 本文は祭壇奉仕に関する身体条件を列挙しており、その状態を罪や人格的劣等と見なしてはいない。具体性を保ちながら、本文にない道徳判断や診断を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。身体的状態を侮蔑語や過度な医学用語で表さず、反復的な原文の列挙構造を日本語として自然に整えた。
