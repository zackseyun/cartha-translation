id: LEV.21.22
reference: Leviticus 21:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: ja
  text: 彼は、自分の神の食物[a]を、最も聖なるものからも、聖なるものからも食べることができる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「自分の神のパン」。ここで「パン」は、祭司に与えられる食物の取り分全般を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: 食物
  rationale: 字義的には「パン」だが、ここでは祭司に与えられる聖なる取り分全般を指すため、「食物」とした。
- source_word: אֱלֹהָיו
  choice: 自分の神
  rationale: 三人称男性単数の接尾辞が祭司を指すことを明確にしつつ、ヘブライ語の所有表現を保った。
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: 最も聖なるものから
  rationale: 聖別されたもののうち最高度の区分を表す定型的な最上級表現として訳した。
- source_word: וּמִן הַקֳּדָשִׁים
  choice: 聖なるものからも
  rationale: 前の「最も聖なるもの」と対照される別の聖なる区分を示し、קדשとの語彙的なつながりも保った。
- source_word: יֹאכֵל
  choice: 食べることができる
  rationale: この祭司法規では、未来や義務ではなく、食べる資格が保たれているという許可を表す。自然な現代日本語でその法的意味を示した。
theological_decisions:
- issue: 祭司法規における未完了形 יֹאכֵל の意味
  choice: 許可（「食べることができる」）
  alternative: 単純未来（「食べる」）または義務（「食べなければならない」）
  rationale: 文脈は、身体に欠陥のある祭司が祭壇に近づくことを禁じる一方、聖なる取り分を食べる資格は失わないことを示す。義務と断定せず、法的な許可として訳した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「最も聖なるもの」と「聖なるもの」という祭儀上の区分を保ち、法的許可は「食べることができる」で表現した。
