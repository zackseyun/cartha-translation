source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: ja
  text: 彼らは、頭に、はげた部分を作ってはならない。ひげの縁[a]をそり落としてはならず、また、自分の身に切り傷をつけてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「縁」は「端」または「隅」とも訳せる。ヘブライ語は、縁、側面、隅を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: はげた部分を作る
  rationale: 同根の動詞と名詞の組み合わせが、自然に毛が抜けることではなく、意図的にはげた箇所を作る行為を指す。「はげた部分を作る」は、その具体性を明瞭な現代日本語で表す。
- source_word: בְּרֹאשָׁם
  choice: 彼らは頭に
  rationale: 単数名詞に複数接尾辞が付く分配的表現を、日本語として自然に「彼らは頭に」とした。
- source_word: פְאַת זְקָנָם
  choice: ひげの縁
  rationale: פאה は縁、端、隅を意味し得る。「縁」は特定の整髪様式を断定せず、原語の空間的なイメージを保つ。別訳の可能性は脚注に示した。
- source_word: יְגַלֵּחוּ
  choice: そり落とす
  rationale: ピエル形が表す毛の除去を、簡潔で自然な日本語にした。
- source_word: וּבִבְשָׂרָם
  choice: その身に
  rationale: בשר の身体的な具体性を保ちつつ、日本語で不自然になりやすい直訳の「肉に」を避けた。
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: 切り傷をつける
  rationale: 同根の動詞と名詞による、身体を切って傷を作る行為を直接的かつ平明に表した。
theological_decisions:
- issue: 禁止行為の性質
  choice: 身体や毛髪に対する具体的な行為として訳し、この節にない目的説明は加えない。
  alternative: 並行箇所に基づき「死者のために」または「喪に際して」と本文に補う。
  rationale: この節そのものは行為を禁止しているが、その目的や状況を明記していない。並行箇所から説明を本文へ持ち込まず、原文の範囲と含みを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「その身」は原語の身体的な表現を保ちながら、礼拝朗読にも適した自然さを意図した。三つの禁止を区別しつつ、後半二項を接続して原文の流れを再現した。
