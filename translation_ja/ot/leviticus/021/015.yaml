id: LEV.21.15
reference: Leviticus 21:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: ja
  text: また、自分の民の中で、自分の子孫を汚してはならない。[a][b] 私は、彼を聖なる者とするヤハウェだからである。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の子孫を俗なものとしてはならない」または「自分の子孫の聖性を損なってはならない」。ヘブライ語の動詞は、聖なるべきものを俗なものにすることを表す。
    reason: lexical_alternative
  - marker: b
    text: この文脈では、定められた婚姻規定に背くことにより、民の中で自分の家系に汚れをもたらすことを指す。
    reason: cultural_note
  - marker: c
    text: 別訳「彼を聖別する」または「彼を聖くする」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: 汚す
  rationale: ピエル形のחללは、聖なるべきものを俗なものにすることを表す。現代日本語では「冒瀆する」より自然でありつつ、祭司的な聖性を損なう意味を保つため「汚す」とした。
- source_word: זַרְעוֹ
  choice: 自分の子孫
  rationale: זֶרַעは「種」「子」「子孫」を意味し得る。ここでは婚姻と祭司の血統が文脈なので、個々の子だけに限定せず系統も含み得る「子孫」が適切である。
- source_word: בְּעַמָּיו
  choice: 自分の民の中で
  rationale: בְּとעַםの接尾辞付き形を素直に訳し、祭司の子孫が属する共同体の中で起こる汚れという社会的・契約的背景を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
- source_word: מְקַדְּשׁוֹ
  choice: 彼を聖なる者とする
  rationale: קדשׁのピエル分詞は、聖別する、聖なるものとして取り分ける意。「聖別する」も可能だが、一般読者に明瞭で、継続的な働きも表せる言い方を選んだ。
theological_decisions:
- issue: 禁令の指示対象と聖性の根拠
  choice: 祭司は共同体の中で自分の子孫を汚してはならず、その理由はヤハウェが祭司を聖なる者とする方だからだと訳した。
  alternative: 禁じられた女性との結婚によって、大祭司がその血統を祭司職に不適格なものにしてはならない、という意味を明示する。
  rationale: 直前の文脈は大祭司の婚姻規定だが、ヘブライ語本文は祭司職への不適格を明言せず、より広く「子孫を汚す」と述べる。そのため解釈上の限定を本文へ加えなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「また」で前節との継続を示し、「自分の」を用いて主語との関係を自然に明示した。神名は「ヤハウェ」と音写した。
