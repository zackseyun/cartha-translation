  source_fidelity: ヘブライ語の禁止（「彼の子孫を、彼の民の中で汚してはならない」）と、その根拠（「わたしは彼を聖なる者とするヤハウェ」）を忠実に反映している。「子孫」はזַרְעוֹの家系的含意を保ち、「民の中で」もבְּעַמָּיוを適切に訳している。
  naturalness: 「また、自分の民の中で、自分の子孫を汚してはならない」は明瞭な現代標準日本語であり、前節から続く規定としての文体にも合う。「自分の」の反復は、指示関係を曖昧にしないため許容される。
  terminology: 「汚す」はחללの聖性を損なう意味を簡明に表し、脚注が「俗なものにする」という祭司的・聖性語彙の含意を補っている。「ヤハウェ」および「聖なる者とする」は、神名とקדשׁの用語上の対応として適切である。
