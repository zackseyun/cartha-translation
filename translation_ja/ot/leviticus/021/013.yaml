  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: ja
  text: 彼は処女を妻に迎えなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女の処女性において」。すなわち、処女である女性を妻に迎える。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 彼は
  rationale: 独立代名詞による主語を明示しつつ、文脈上の継続を日本語として自然に表した。接続詞は前後の文脈に吸収できるため、機械的に「そして」を置かなかった。
- source_word: אִשָּׁה
  choice: 女を妻に
  rationale: לקח と結びつく婚姻表現であり、単なる「女」ではなく、妻として迎える意味を明確にした。
- source_word: בִבְתוּלֶיהָ
  choice: 処女である
  rationale: 字義的には「彼女の処女性のうちに」だが、状態を表す自然な現代日本語とした。ヘブライ語の構文は脚注で示した。
- source_word: יִקָּח
  choice: 迎えなければならない
  rationale: 妻を「取る」というヘブライ語の婚姻慣用句を、日本語の法規的文脈に適した「妻に迎える」で表し、未完了形の規定的な力を「なければならない」で示した。
theological_decisions:
- issue: 祭司法における婚姻表現
  choice: 「処女である女を妻に迎える」と訳す
  alternative: 「処女をめとる」／「処女の身にある女を妻として取る」
  rationale: 婚姻を定める法規であることを明確にしながら、古風すぎる「めとる」や不自然な直訳を避けた。本文が定める女性の状態を保持し、教派的な解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語による法規的で端正な文体。「妻に迎える」は婚姻の意味を自然に伝え、「なければならない」は規定としての拘束性を表す。
