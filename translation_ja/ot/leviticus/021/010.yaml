source:
  edition: WLC
  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: ja
  text: 兄弟たちの中で最も位の高い大祭司、すなわち、その頭に聖別の油を注がれ、祭服を身に着けるために任職された者は、頭髪を乱してはならず[b]、自分の衣服を引き裂いてもならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 頭髪を乱したままにすることや衣服を引き裂くことは、悲嘆や服喪を表す慣習だった。
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: 兄弟たちの中で最も位の高い祭司
  rationale: הַכֹּהֵן הַגָּדוֹל は最高位の祭司を指し、מֵאֶחָיו の比較・卓越の意味も表す。「大祭司」だけに縮約せず、原文の「兄弟たち」とその中での高い地位を本文に残した。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 任職の油
  rationale: 祭司職への任命というこの箇所の儀礼的文脈を明確にしつつ、油を頭に注ぐ具体的な描写を保った。
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: 任職された
  rationale: 字義は「その手を満たした」だが、祭司職に就けることを表すヘブライ語の慣用句である。現代日本語として意味が通る訳を本文に置き、原語の表現は脚注に示した。
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: 祭服を身に着けるために
  rationale: 定冠詞付きの「衣服」は文脈上、大祭司として着用する祭服を指すため、日本語ではその指示対象を簡潔に明示した。
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: 頭髪を乱してはならず
  rationale: 原文は字義的には「頭を解き放つ／乱れたままにする」。喪のしるしとして髪を整えずにおく行為を、過度に説明的にならない自然な日本語で表した。
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: 衣服を引き裂いてもならない
  rationale: 悲嘆や服喪を示す慣習的行為を、原文の具体的な動作に即して訳した。
theological_decisions:
- issue: מִלֵּא אֶת יָדוֹ の任職慣用句
  choice: 本文では「任職された」と意味を訳し、脚注で字義を示す
  alternative: 「その手を満たされた」と字義どおりに訳す
  rationale: 字義訳は現代日本語では意味を伝えにくい。祭司として正式に職に就けられたという儀礼的意味を本文で明確にしつつ、脚注によって原語特有の比喩を保持した。
- issue: מֵאֶחָיו が示す関係
  choice: 「兄弟たちの中で最も位の高い」と比較・卓越を表す
  alternative: 「兄弟たちの中から選ばれた」
  rationale: 前置詞 מִן はここでは出所だけでなく比較を示すと解するのが自然であり、他の祭司たちに対する最高位を表した。「兄弟たち」は男性祭司の同胞的集団を指す表現として保持した。
- issue: 服喪の禁止を本文でどこまで明示するか
  choice: 具体的行為を本文に残し、服喪の慣習であることを脚注で説明する
  alternative: 「喪に服してはならない」と一般化する
  rationale: 原文は頭髪を乱すことと衣服を裂くことを具体的に禁じているため、その描写と儀礼的緊張を本文で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭司任職と服喪規定にふさわしい簡潔で荘重な調子とした。「兄弟たち」を保持し、「同僚」などに一般化していない。
