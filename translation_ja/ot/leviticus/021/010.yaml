revisions:
- from: 兄弟たちの中で最も位の高い祭司、すなわち、その頭に任職の油を注がれ、祭服を身に着けるために任職された[a]者は、頭髪を乱してはならず[b]、衣服を引き裂いてもならない。
  to: 兄弟たちの中で最も位の高い大祭司、すなわち、その頭に聖別の油を注がれ、祭服を身に着けるために任職された者は、頭髪を乱してはならず[b]、自分の衣服を引き裂いてもならない。
  rationale: 「大祭司」と「聖別の油」により、確立した祭司制度の用語と原文の儀礼語彙を適切に再現した。「任職された」は慣用句の意味を明瞭に伝え、脚注aで字義と原語固有の表現を保持する。本文には脚注aのアンカーを、任職された箇所に付す必要があるため、完全な本文は次のとおりである：兄弟たちの中で最も位の高い大祭司、すなわち、その頭に聖別の油を注がれ、祭服を身に着けるために任職された[a]者は、頭髪を乱してはならず[b]、自分の衣服を引き裂いてもならない。
