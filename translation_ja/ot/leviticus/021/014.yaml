source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: ja
  text: 彼は、やもめ、離婚した女、聖別を損なった女[a]、娼婦を妻に迎えてはならない。自分の民の中からの処女だけを妻に迎えなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「俗なるものとされた女」「聖性を失った女」。ヘブライ語は、祭司の聖性に関する律法において婚姻相手として認められない状態の女性を指す。その状態に至った具体的な理由は、この語だけでは特定されない。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: やもめ
  rationale: 夫を亡くした女性を指す標準的な語義。律法文の格調を保ちつつ、現代日本語でも理解できる。
- source_word: גְרוּשָׁה
  choice: 離縁された女
  rationale: 受動的な形を反映し、夫から婚姻を解消された女性という法的意味を明確にする。
- source_word: חֲלָלָה
  choice: 聖なる身分を汚された女
  rationale: 語根の「俗化する、聖性を損なう」という祭司的聖別に関わる意味を明示する。「汚れた女」だけでは身体的・道徳的汚濁と誤解されやすいため、身分上の含意を補った。
- source_word: זֹנָה
  choice: 娼婦
  rationale: 売春に携わる女性を表す、簡潔で現代的な対応語。
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: これらを妻に迎えてはならない
  rationale: לקחの婚姻慣用を、日本語で自然な「妻に迎える」として表し、列挙された女性たちが目的語であることを明確にした。
- source_word: כִּי אִם
  choice: 〜なければならない
  rationale: 先行する禁止に対して許される対象を限定する強い対比を、日本語の規定文として自然に表現した。
- source_word: בְּתוּלָה
  choice: 処女
  rationale: この婚姻法の文脈で、未婚女性というだけでなく性的未経験を示す語義を保持する。
- source_word: מֵעַמָּיו
  choice: 自分の民の中から
  rationale: 前置詞מןの出所・範囲と、三人称複数接尾辞の集合的な「彼の民」を自然に表す。
- source_word: אִשָּׁה
  choice: 妻に
  rationale: ここでは一般的な「女」ではなく婚姻関係に入る妻を意味するため、日本語の婚姻表現に合わせた。
theological_decisions:
- issue: 祭司的聖性に関わる חֲלָלָה の訳
  choice: 聖なる身分を汚された女
  alternative: 聖性を失った女／聖別を汚された女／汚された女
  rationale: この語は単なる一般的な道徳的不潔ではなく、祭司聖性法において婚姻に不適格とされる身分を表す。何によってその身分になったかを本文以上に特定せず、祭儀的・身分的な含意を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法としての厳粛さを保った。「妻に迎える」によりヘブライ語の婚姻慣用を自然に表現した。חֲלָלָה は一般的な「汚れ」と誤解されないよう、祭司的な聖なる身分との関係を本文と脚注で示した。
