id: LEV.7.6
reference: Leviticus 7:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: ja
  text: 祭司たちのうち、男子はみなこれを食べることができる[a]。これは聖なる場所で食べなければならない。これは最も聖なるものである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これを食べなければならない」。ヘブライ語は法的な指示とも、食べる資格の付与とも取れる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「聖の聖」。最高度に聖なることを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: 祭司たちのうち、男子はみな
  rationale: כָּלを包括的な「みな」、זָכָרを年齢ではなく性別を示す「男子」とし、בַּכֹּהֲנִיםを集団内の所属を表す「祭司たちのうち」と訳した。
- source_word: יֹאכְלֶנּוּ
  choice: これを食べることができる
  rationale: 未完了形はここでは祭儀規定上の許可・資格を表すと解し、義務と断定せず「食べることができる」とした。
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: 聖なる場所で
  rationale: 無冠詞の「場所」を不必要に特定せず、聖別された場所という範囲を自然な日本語で示した。
- source_word: יֵאָכֵל
  choice: 食べなければならない
  rationale: ニファル受動形による法的指示を、日本語では場所に関する義務が明確になる能動的な構文で表した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 字義的には「聖の聖」だが、最高度の聖性を示すヘブライ語の強意表現として訳した。
- source_word: הוּא
  choice: これは
  rationale: 直前まで扱われている供え物を指す代名詞として、自然な日本語の指示表現を用いた。
theological_decisions:
- issue: 食べる資格が祭司集団内の男子に限定されること
  choice: 祭司たちのうち、男子はみな
  alternative: 祭司はみな
  rationale: 原文はזָכָר（男子）を明記しているため、この祭儀上の性別による限定を一般化せず保持した。
- issue: יֹאכְלֶנּוּが許可か義務か
  choice: 食べることができる
  alternative: 食べなければならない／食べる
  rationale: 文脈上、資格ある者に許された摂取を示すと判断したが、ヘブライ語未完了形には法的指示として読む余地があるため脚注で代案を示した。
translation_notes:
  register: 現代の一般読者に明快でありながら祭儀法にふさわしい端正な文体とした。「男子」は原文の性別指定を保ち、「男」より法規文として落ち着いた語感を選んだ。脚注記号[a][b]は本文中に対応させた。
