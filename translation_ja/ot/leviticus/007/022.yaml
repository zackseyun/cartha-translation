lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 新しい発話単位を導入する動詞。日本語の律法文脈で自然かつ格調を保ち、後続する神の言葉を導入できる。
- source_word: יְהוָה
