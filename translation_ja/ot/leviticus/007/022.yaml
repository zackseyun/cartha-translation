- source_word: לֵאמֹר
  choice: （「告げられた」に含める）
  rationale: 後続の直接話法を導く定型句であり、日本語では「言って言われた」と重ねず、発話導入動詞に統合するのが自然である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文では「主」、脚注で「原文は神名YHWH（ヤハウェ）」と明示
  alternative: ヤハウェ
  rationale: 原文が称号ではなく神名を用いる事実を脚注で保持しつつ、日本語読者に定着した本文表記を採用する。
