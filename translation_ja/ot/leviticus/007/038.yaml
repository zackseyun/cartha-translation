  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: ja
  text: これは、ヤハウェが、シナイの荒野でイスラエルの人々[a]に自分たちのささげ物をヤハウェに献げるよう命じた日に、シナイ山でモーセに命じたものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イスラエルの子ら」。「イスラエル人」または「イスラエルの民」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: これは、…ものである
  rationale: 直前に列挙された規定を受ける関係節を、節単独でも意味が通る自然な日本語として表した。
- source_word: צִוָּה
  choice: 命じた
  rationale: 祭儀法規における権威ある命令という語義を明確に保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写して示す。
- source_word: בְּהַר סִינָי
  choice: シナイ山で
  rationale: 場所を表す前置詞を、自然な日本語の場所表現で訳した。
- source_word: בְּיוֹם צַוֹּתוֹ
  choice: 命じた日に
  rationale: 原文の明示的な時間表現「日」を保持しつつ、不定詞構文を日本語の連体節にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の血縁的・集合的表現を可視化して訳し、慣用的な別訳は脚注に示した。
- source_word: לְהַקְרִיב
  choice: 献げる
  rationale: ' قرب のヒフィル形が祭儀文脈で表す、供え物を神の前に持って来て差し出す行為を簡潔に表す。'
- source_word: קָרְבְּנֵיהֶם
  choice: 自分たちのささげ物
  rationale: 複数種類の供犠を包括する広い祭儀用語であり、「犠牲」に限定せず訳した。再帰的な「自分たちの」で主語との関係を明瞭にした。
- source_word: בְּמִדְבַּר סִינָי
  choice: シナイの荒野で
  rationale: מִדְבָּר の荒涼とした未開地域という意味を保ち、地名との関係も自然に示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いているため、称号へ置換せず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の集合的表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の字義的な家族表現を本文に残しつつ、この語が共同体全体を指し得ることを脚注で補った。
- issue: 二つの場所表現と時間表現の関係
  choice: シナイ山でモーセに命じたことと、シナイの荒野で民に命じた日をともに明示
  alternative: 両方を一般的なシナイ地域への言及としてまとめる
  rationale: 原文は「シナイ山」と「シナイの荒野」を区別し、さらに「命じた日」を明示するため、その緊張を解消せず保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法規の結語にふさわしい厳粛さを保った。直前の節を受ける関係節は「これは、…ものである」として、単独でも読める形に整えた。
