  register: 祭儀文としての格調を保ちつつ、「献げる」「いけにえ」「種なし」「薄焼きパン」など、一般読者にも理解しやすい現代標準日本語を用いた。同じחַלּוֹתには形状を保つため「輪形パン」を用い、第三の品目の調理法の不確かさは脚注で明示した。
