  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: ja
  text: もし感謝のささげ物[a]としてこれを献げるのであれば、感謝のいけにえに添えて、油を混ぜた種なしパン、油を塗った種なしの薄焼きパン、また油を混ぜた上等の小麦粉のパン[b]を献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「感謝の供え物」とも訳せる。ヘブライ語は、感謝を表すために献げる供え物を指す。
    reason: lexical_alternative
  - marker: b
    text: 「油を混ぜた」と訳した箇所には、正確な調理法が不明なヘブライ語が含まれる。油を加えて十分に混ぜた、あるいは練ったものを指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: 感謝のささげ物
  rationale: 感謝・謝意を表すいけにえを指す語であり、ここでは交わりのいけにえの一種を表す。「感謝のささげ物」は現代日本語で意味が明瞭である。
- source_word: יַקְרִיבֶנּוּ
  choice: これを献げる
  rationale: קרבのヒフィル形は祭儀文脈で、供え物を神の前に差し出す、すなわち献げることを表す。
- source_word: זֶבַח הַתּוֹדָה
  choice: 感謝のいけにえ
  rationale: זֶבַחを「いけにえ」、属格のהַתּוֹדָהを「感謝の」とし、簡潔で自然な日本語にした。
- source_word: חַלּוֹת מַצּוֹת
  choice: 種なしの輪形パン
  rationale: חַלּוֹתは祭儀用パンの輪形または環状の一個一個を指し、מַצּוֹתは発酵させていないことを示す。単なる「パン」より形状を伝える。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 油を混ぜた
  rationale: בללは材料を混ぜ合わせることを表す。簡明な現代日本語とした。
- source_word: רְקִיקֵי מַצּוֹת
  choice: 種なしの薄焼きパン
  rationale: רְקִיקִיםは薄いパンまたは菓子状のものを指す。「薄焼きパン」は薄さと食品としての性質を自然に表す。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 油を塗った
  rationale: משׁחは塗る・油を注ぐ意を持つが、ここでは食品調理なので、儀式的な含意を不要に加えない「油を塗った」とした。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: סֹלֶתは精製された良質の穀粉を指す。レビ記の供え物の文脈では「上等の小麦粉」が明瞭である。
- source_word: מֻרְבֶּכֶת
  choice: 混ぜて練った
  rationale: この調理語の厳密な意味には不確かさがあるが、油などを加えて十分に混ぜ、練った生地を表す可能性が高い。本文は自然な調理表現とし、不確かさは脚注で示す。
