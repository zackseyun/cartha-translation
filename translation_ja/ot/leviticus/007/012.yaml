  to: もし感謝のささげ物[a]としてこれを献げるのであれば、感謝のいけにえに添えて、油を混ぜた種なしパン、油を塗った種なしの薄焼きパン、また油を混ぜた上等の小麦粉のパン[b]を献げなければならない。
