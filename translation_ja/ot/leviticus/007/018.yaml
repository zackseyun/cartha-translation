    rationale: 「和解」は伝統的な訳語として知られる一方、שלמים の語義を直接示すわけではなく、本文の語彙注としては神学的に限定的である。「交わりのいけにえ」および「幸福・健全さのいけにえ」のような説明的可能性を示すほうが安全である。
