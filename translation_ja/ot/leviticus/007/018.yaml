id: LEV.7.18
reference: Leviticus 7:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: ja
  text: しかし、その人が献げた平安のいけにえ[a]の肉が三日目に少しでも食べられるなら、そのいけにえは受け入れられず、これを献げた人のために数えられることもない。それは忌むべきもの[b]となり、それを食べる人は自分の咎を負う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平安のいけにえ」は、「交わりのいけにえ」または「健全さを求めるいけにえ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「忌むべきもの」に当たるヘブライ語は、規定に反したため受け入れられず、祭儀上忌むべきものとなった供え物を指す専門語。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、…なら
  rationale: 前節までの規定に反する場合を示す条件節として、接続と対照の両方を自然な日本語で表した。
- source_word: הֵאָכֹל יֵאָכֵל
  choice: 食べられるなら
  rationale: 不定詞絶対形と未完了形の組み合わせによる強調を、条件文全体と「少しでも」によって自然に反映した。
- source_word: מִבְּשַׂר
  choice: 肉が…少しでも
  rationale: 部分を表す前置詞 מִן を、日本語では「少しでも」によって明示した。
- source_word: זֶבַח שְׁלָמָיו
  choice: その人の交わりのいけにえ
  rationale: שלמים が表す平安・健全さと、供食を伴う祭儀的交わりの性格を踏まえ、現代の読者に意味が伝わる呼称を採用した。別訳を脚注に示した。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目に
  rationale: 時間表現を簡潔かつ直接的に訳した。
- source_word: לֹא יֵרָצֶה
  choice: 受け入れられず
  rationale: 祭儀の文脈における רצה のニファル形を、神の前でいけにえが受納されないこととして表した。
- source_word: הַמַּקְרִיב אֹתוֹ
  choice: これを献げた人
  rationale: 分詞の意味を保ちながら、自然な現代日本語の関係表現とした。
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: その人のために数えられることもない
  rationale: חשב と ל の会計的・帰属的な含みを保ちつつ、それが献げ手に有効なものとして認められないことを表した。
- source_word: פִּגּוּל
  choice: 忌むべきもの
  rationale: 祭儀上、受け入れ不能で嫌悪すべきものとなった状態を表す専門語であるため、評価的な強さを保つ訳語を用い、脚注で説明した。
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: それを食べる人
  rationale: נפש はここでは身体と区別された「魂」ではなく、法的責任を負う個人を指すため「人」とした。
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: 自分の咎を負う
  rationale: 罪責を担い、その結果に責任を負うという慣用句の含みを、過度に刑罰へ限定せず保持した。
theological_decisions:
- issue: זֶבַח שְׁלָמָיו の祭儀名称
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 特定の犠牲祭儀を指す語であり、共同の食事を伴う側面が読者に伝わる訳を本文に置いた。ただし語根 שלם に関係する平安・健全さを強調する伝統的な訳も可能なので脚注に残した。
- issue: לֹא יֵחָשֵׁב לוֹ の帰属表現
  choice: その人のために数えられることもない
  alternative: その人のものとは認められない／その人に帰せられない
  rationale: 献げ物が献げ手のために有効なものとして算入されないという文脈を保ち、後代の特定の義認論的用語へ狭めなかった。
- issue: עֲוֺנָהּ תִּשָּׂא の意味範囲
  choice: 自分の咎を負う
  alternative: 自分の罪の罰を負う
  rationale: ヘブライ語の慣用句は処罰への責任を含み得るが、本文自体はここで具体的な罰を明示しないため、罪責と責任の緊張を残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「いけにえ」「咎」はレビ記の祭儀的・法的文脈に適した語として保持し、文構造は長すぎないよう二文に整理した。脚注記号は該当語の直後に配置した。
