    rationale: 交わりはこの祭儀の実際的側面を表し得るが、ヘブライ語の語彙的中心を直接表す語ではない。明瞭な標準日本語では「平安のいけにえ」とし、「交わりのいけにえ」を脚注上の可能な訳とするほうが、原語への対応を保ちながら特定の解釈を本文に固定しない。
