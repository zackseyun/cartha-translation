  source_fidelity: 本文は条件、三日目の供食、献げ物の不受納、献げ手への不算入、ピグル、および食べた者が罪責を負うことを正確に伝えている。ただし、זֶבַח שְׁלָמָיו を「交わりのいけにえ」とするのは供食の側面を前面に出す解釈的な訳であり、語の基本的な「平安／完全・健全」の含意を本文で十分に示さない。
  naturalness: 文章は明瞭で自然である。「その人の…肉」より「その人が献げた…肉」とすれば、後続する「献げた人」との関係がより明確になる。
  terminology: 「平安のいけにえ」を本文の祭儀名称とする。「和解のいけにえ」は伝統的用語としては用例があるものの、本文脚注で単純な語彙的別訳として挙げると、和解という神学的意味に狭めるおそれがあるため外す。「忌むべきもの」は פִּגּוּל の文脈上の評価を適切に保つ。脚注のアンカーは各説明対象に正しく対応している。
