  to: しかし、その人が献げた平安のいけにえ[a]の肉が三日目に少しでも食べられるなら、そのいけにえは受け入れられず、これを献げた人のために数えられることもない。それは忌むべきもの[b]となり、それを食べる人は自分の咎を負う。
  rationale: 祭儀名称を、原語の語彙的含意により近く、現代日本語としても理解可能な「平安のいけにえ」に改めた。献げ手といけにえの関係も「その人が献げた」と明示した。その他の構文、罪責表現、ピグルの説明、および脚注アンカーは原文に忠実であり維持した。
