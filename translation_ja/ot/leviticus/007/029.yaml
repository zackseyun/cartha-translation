id: LEV.7.29
reference: Leviticus 7:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: ja
  text: 「イスラエルの人々[a]に告げなさい。『主に自分の平安のいけにえ[b]を献げる者は、その平安のいけにえから、自分の供え物を主に持って来なければならない。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子ら」。すなわちイスラエル人。
    reason: ヘブライ語の字義と、この呼称が指す共同体を示すため。
  - marker: b
    text: 「平和のいけにえ」「交わりのいけにえ」とも訳される。ヘブライ語は平安、健全、繁栄を表す語と関係する祭儀名。
    reason: שְׁלָמִיםの意味領域と代表的な訳語を示しつつ、特定の解釈に限定しないため。
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げなさい
  rationale: 直接的な命令を、現代日本語で自然かつ権威ある表現にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義は「イスラエルの子ら」だが、契約共同体全体を指す呼称として、性別を不必要に限定せず自然な日本語にした。字義的表現は脚注に示す。
- source_word: הַמַּקְרִיב
  choice: 献げる者
  rationale: קרבのヒフィル形が祭儀の文脈で供え物を近づけ、差し出すことを表すため、日本語の祭儀用語として自然な「献げる」を用いた。
- source_word: זֶבַח שְׁלָמָיו
  choice: 自分の平安のいけにえ
  rationale: זֶבַחの犠牲祭儀の意味を「いけにえ」で示し、שְׁלָמִיםとשׁלם（平安・健全・繁栄）との語義的つながりを「平安」で保った。技術用語の複数形は日本語では祭儀区分を表す単数形として訳した。
- source_word: לַיהוָה
  choice: 主に／主のもとに
  rationale: 神名יהוהを、日本語聖書で広く通用する「主」で表した。方向を示す前置詞לは、それぞれの動詞に合わせて自然に訳した。
- source_word: יָבִיא
  choice: 持って来なければならない
  rationale: 律法文中の未完了形が持つ規定・義務の力を、明瞭な現代日本語で示した。
- source_word: קָרְבָּנוֹ
  choice: 自分のささげ物
  rationale: 神のもとへ持って来る供え物を表す一般的な祭儀用語קָרְבָּןを、明快な「ささげ物」とした。
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: その平安のいけにえの中から
  rationale: 前置詞מִןが、持参するささげ物が当該のいけにえから取り分けられることを示すため、「の中から」とした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名であることを踏まえつつ、日本語におけるユダヤ・キリスト教の長い朗読伝統と一般的な聖書表記に従った。
- issue: שְׁלָמִיםの祭儀名称
  choice: 平安のいけにえ
  alternative: 交わりのいけにえ／和解のいけにえ／会食のいけにえ
  rationale: 語根שׁלםとのつながりを保ち、「交わり」「和解」「会食」のいずれか一つに意味を限定しないため、「平安」を本文に採用し、他の慣用訳を脚注に示した。
- issue: בְּנֵי יִשְׂרָאֵלの集合的呼称
  choice: イスラエルの人々
  alternative: イスラエルの子ら
  rationale: ヘブライ語の形は男性複数だが、ここでは共同体への集合的な呼びかけである。自然な日本語本文では「人々」とし、字義は脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法規定としての厳粛さを保った。「いけにえ」「ささげ物」を使い分けてזֶבַחとקָרְבָּןの区別を示し、同一の「平安のいけにえ」の反復も原文に従って残した。
