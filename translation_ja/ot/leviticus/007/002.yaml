  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: ja
  text: 全焼のささげ物を屠る場所で、償いのささげ物[a]も屠る。その血を祭壇の周囲に向けて振りかける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪過のささげ物」「賠償のささげ物」。ヘブライ語は、罪責と、それに伴う償いの両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: 場所で
  rationale: 場所を示す前置詞と関係節を、祭儀規定として自然な現代日本語にした。
- source_word: יִשְׁחֲטוּ
  choice: 屠る
  rationale: 犠牲動物を儀礼的に殺す行為を正確かつ簡潔に表す。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: 動物全体を焼いてささげる祭儀区分であることが、現代の読者にも分かる表現を選んだ。
- source_word: הָאָשָׁם
  choice: 償いのささげ物
  rationale: אָשָׁםが含む罪責と賠償・償還の側面の双方を踏まえ、単なる内面的な罪悪感に限定しない表現とした。別訳を脚注に示した。
- source_word: דָּמוֹ
  choice: その血
  rationale: 接尾辞が償いのささげ物として屠られた動物を指すことを自然に示す。
- source_word: יִזְרֹק
  choice: 振りかける
  rationale: 祭壇に向けて血を投げかけて付着させる祭儀動作を表す。軽く散布するだけと断定しない、定着した日本語表現を採用した。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の周囲に
  rationale: 血を祭壇の周りに施すという空間的意味を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 祭儀用語 אָשָׁם の訳語
  choice: 償いのささげ物
  alternative: 罪過のささげ物、賠償のささげ物
  rationale: 罪責と、それに伴う償いの含意を保ちつつ、特定の教派的理解に狭めない。語の幅は脚注で明示した。
- issue: 動詞の数の交替
  choice: 前半の複数形は非特定の祭儀担当者を表す自然な規定文とし、後半の単数形は「祭司が」と明示
  alternative: 全体を主語省略のまま訳す
  rationale: ヘブライ語は屠る者を複数形、血を振りかける者を単数形で表す。後者が祭司の務めであるという文脈上の区別を読みやすく示しつつ、前半の主体を不必要に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は過度に古風な漢語へ寄せず、「ささげ物」で統一した。「祭司が」はヘブライ語の単数形とレビ記の祭儀文脈を明確にするために補った。
