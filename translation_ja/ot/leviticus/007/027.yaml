  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: ja
  text: どのような血であれ、それを食べる者は皆、その者は自分の民から断たれる[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「者」と訳した語は、直訳すれば「魂」または「いのち」。ここでは個々の人を指す。
    reason: lexical_alternative
  - marker: b
    text: 「断たれる」は契約上の刑罰を表す定型句。共同体からの排除または神の裁きを含意し得るが、この箇所のヘブライ語は、その具体的方法を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 者
  rationale: 祭儀法の文脈では、非物質的な「魂」ではなく、個々の人を指す。「者」は日本語の一般的な法文表現として自然である。
- source_word: תֹּאכַל
  choice: 食べる
  rationale: 未完了形は関係節内で一般的な場合を表すため、日本語では「食べる」として恒常的な規定を示した。
- source_word: כָּל דָּם
  choice: どのような血であれ、それを
  rationale: 不可算名詞に付く כָּל の包括的・分配的意味を表し、血の種類を問わないことを自然な日本語で明示した。
- source_word: וְנִכְרְתָה
  choice: 断たれる
  rationale: ニファル形の契約上・司法上の定型句を簡潔に保ち、共同体からの排除、死、神の裁きのいずれかに限定しない。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: その者
  rationale: 前半で示された違反者を改めて強調する、名詞と指示詞による再提示を日本語で保持した。
- source_word: מֵעַמֶּיהָ
  choice: 自分の民の中から
  rationale: 接尾辞の女性形は文法上 נֶפֶשׁ に一致するもので性別を限定しない。「自分の」により包括的に表し、מִן の分離と共同体内部からの除去を示した。
theological_decisions:
- issue: 契約上の刑罰表現「断たれる」の意味
  choice: 「自分の民の中から断たれる」とし、処罰の具体的方法を特定しない。
  alternative: 「死刑に処せられる」「共同体から追放される」「神に滅ぼされる」
  rationale: ヘブライ語の定型句は簡潔で、死、共同体からの排除、神の裁きなどの解釈がある。この節自体が方法を明記しないため、その曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、律法の厳粛さを保った。「どのような血であれ」で כָּל דָּם の包括性を示し、「その者」で原文の反復による強調を再現した。
