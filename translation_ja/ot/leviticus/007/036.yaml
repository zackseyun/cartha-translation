id: LEV.7.36
reference: Leviticus 7:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: ja
  text: これは、ヤハウェが彼らに油を注いだ日に、イスラエルの人々[a]から彼らに与えるよう命じたものであり、彼らの代々にわたる永遠の定め[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子らから」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「恒久の定め」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: これは……ものであり
  rationale: 前節で述べられた祭司の取り分を受ける関係節。日本語では指示語を補い、文脈とのつながりを明確にした。
- source_word: צִוָּה
  choice: 命じた
  rationale: 神による権威ある命令という法的・契約的な力を保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を音写した。
- source_word: לָתֵת לָהֶם
  choice: 彼らに与えるよう
  rationale: ヘブライ語の不定詞構文を自然な日本語にしつつ、アロンとその子らが受領者であることを保った。
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: 彼らに油を注いだ日に
  rationale: מָשַׁח の具体的な行為を「聖別する」と一般化せず、「油を注ぐ」と訳した。主語は直前のヤハウェとして自然に読める。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らから
  rationale: 字義的な契約共同体の呼称を本文に残し、より慣用的な表現を脚注に示した。
- source_word: חֻקַּת עוֹלָם
  choice: 永遠の定め
  rationale: 祭儀法規における継続的効力を表す定型句の重みを保ち、哲学的な意味を過度に付加しない。
- source_word: לְדֹרֹתָם
  choice: 代々にわたる
  rationale: 後の各世代に継続して適用されることを自然な現代日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有の神名を称号で代替せず、一般的な学術的音写で示した。
- issue: 祭司律法における עוֹלָם の効力
  choice: 永遠の定め
  alternative: 恒久の定め
  rationale: 契約的・法的な持続性を保持しつつ、その適用範囲について本文以上の体系的結論を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節を受ける関係節は「これは……ものであり」として自然につなぎ、祭儀法規にふさわしい「命じた」「定め」を用いた。すべての脚注記号を本文中に配置した。
