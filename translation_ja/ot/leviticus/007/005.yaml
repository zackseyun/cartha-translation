base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: ja
  text: 祭司はそれらを祭壇の上で焼いて煙にする。これはヤハウェへの火によるささげ物[a]、すなわち罪過のささげ物である[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火のささげ物」とも訳せる。ヘブライ語は、火で焼いてささげる供え物を指す祭儀上の用語。
    reason: lexical_alternative
  - marker: b
    text: 「償いのささげ物」または「賠償のささげ物」とも訳せる。罪責と、それに伴う償い・賠償の両面を含む祭儀上の名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 焼いて煙にし
  rationale: ヒフィル形は、祭壇でささげ物を焼き、その煙を立ち上らせる行為を表す。「焼く」だけでなく「煙にする」を添え、祭儀上の意味を明確にした。
- source_word: אֹתָם
  choice: それらを
  rationale: 直前の文脈で指定された、いけにえの複数の脂肪部分を受ける目的語代名詞である。
- source_word: הַכֹּהֵן
  choice: 祭司は
  rationale: 定冠詞付き単数名詞を、祭儀を執行する者として自然な現代日本語で表した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を直訳すれば「祭壇へ」だが、実際の動作は祭壇上で焼くことなので、日本語では「祭壇の上で」が明瞭である。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 火でささげる供え物を指す祭儀上の専門語。食物としての供え物という含意を断定せず、語の明白な火との関係を保持した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞は奉献の向かう相手を示す。神名יהוהを称号に置き換えず「ヤハウェ」とした。
- source_word: אָשָׁם
  choice: 償いのささげ物
  rationale: レビ記における特定のいけにえの名称であり、罪責と賠償・償いの両面を持つ。「償い」は現代日本語として理解しやすく、別訳を脚注に示した。
- source_word: הוּא
  choice: これは…である
  rationale: このいけにえを祭儀上の種類として同定する名詞文を、自然で格調ある日本語にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を固有名として示し、称号への置換を避けた。
- issue: אָשָׁםという祭儀用語
  choice: 償いのささげ物
  alternative: 罪過のささげ物、賠償のささげ物
  rationale: この語には罪責と、それに伴う償い・賠償の側面がある。本文では自然な「償い」を用い、語義の幅を脚注で保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀規定にふさわしい簡潔で格調ある文体とした。「焼いて煙にし」により原語の動作を具体的に示し、専門用語には必要最小限の脚注を付した。
