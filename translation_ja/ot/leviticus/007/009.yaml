  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: ja
  text: また、かまどで焼かれたすべての穀物のささげ物も、深鍋で作られたものも、平鍋の上で作られたものも、それを献げる祭司のものとなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀的文脈では、一般的な贈り物ではなく、穀物を用いるささげ物を指すため。現代日本語で内容が明瞭になる表現を選んだ。
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: かまどで焼いた
  rationale: אפה のニファル形が表す『焼かれる』を自然な連体表現とし、תנור は古代の調理設備に適した『かまど』とした。
- source_word: נַעֲשָׂה
  choice: 調理したもの
  rationale: 基本義は広く『作られたもの』だが、器具を用いた穀物のささげ物の準備という文脈を自然に示すため、『調理したもの』とした。
- source_word: מַרְחֶשֶׁת
  choice: 深鍋
  rationale: 油を用いる比較的深い調理器具と理解される語であり、続く מחבת との推定上の違いを保った。器具の厳密な形状には不確かさがある。
- source_word: מַחֲבַת
  choice: 平鍋
  rationale: מרחשת より平たい調理器具と一般に区別されるため、『平鍋』とした。ただし形状の厳密な特定には不確かさがある。
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: それを献げる
  rationale: קרב のヒフィル分詞は祭儀の文脈で、供え物を神前に差し出す行為を表すため。
- source_word: לוֹ תִהְיֶה
  choice: そのものとなる
  rationale: 祭司への帰属を定める法的表現として、現代日本語で明瞭な所有表現にした。
theological_decisions: []
