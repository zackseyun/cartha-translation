source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: ja
  text: 酵母を入れたパン菓子に加え、感謝の平安のいけにえ[a]とともに、その献げ物を献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「交わりのいけにえ」「健全さのいけにえ」。
    reason: ヘブライ語シェラーミームは祭儀上の専門用語であり、平安・健全・交わりに関わる意味の幅をもつ。
lexical_decisions:
- source_word: עַל
  choice: とともに／に添えて
  rationale: この節では物理的な位置ではなく、付加・随伴を表す。同じ前置詞が二度用いられているが、自然な日本語の構文に合わせて訳し分けた。
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: 発酵させた輪形のパン
  rationale: חַלּוֹתは祭儀用のパン菓子またはパンを指し、חָמֵץはパン種によって発酵させたものであることを示す。前後の種なしパンとの対照を明確にしつつ、現代日本語として分かりやすくした。
- source_word: יַקְרִיב
  choice: 献げなければならない
  rationale: קרבのヒフィル形は祭儀の文脈で、神の前に持って来て献げることを表す。律法上の義務を日本語で明確に示した。
- source_word: קָרְבָּנוֹ
  choice: そのささげ物
  rationale: 神に近づけて献げる物を指す一般的な祭儀用語。直前まで述べられたパン類を含む献納物とのつながりを「その」で示した。
- source_word: זֶבַח תּוֹדַת
  choice: 感謝のための……いけにえ
  rationale: זֶבַחは屠って献げるいけにえ、תּוֹדָהは感謝・謝恩を表す。日本語では目的・性格を自然に示す「感謝のための」とした。
- source_word: שְׁלָמָיו
  choice: 和解のいけにえ
  rationale: שְׁלָמִיםは平安、健全、交わりに関係する祭儀上の一分類である。伝統的で認識しやすい訳語を本文に置き、意味の幅は脚注に残した。
theological_decisions:
- issue: שְׁלָמִיםという祭儀用語の訳し方
  choice: 和解のいけにえ
  alternative: 交わりのいけにえ／平安のいけにえ
  rationale: この語は平安や全き状態だけでなく、神との交わりを伴う供食的側面も示し得る。一つの解釈に限定せず、本文には伝統的な訳語を用い、主要な別訳を脚注に示した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある律法文の文体とした。「献げなければならない」によって規定としての効力を示し、祭儀用語には必要最小限の伝統語を用いた。
