source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: ja
  text: アロンの子らのうち、平和のいけにえ[a]の血と脂肪を献げる者には、右のももがその取り分となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「交わりのいけにえ」。
    reason: שְׁלָמִיםは祭儀名であり、平和・全き状態と、共同の食事に伴う交わりの両方に関連づけられるため。
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: 献げる者
  rationale: קרבのヒフィル分詞が表す、祭儀において供え物を差し出す行為と、その行為をする者という分詞の働きを、自然な日本語で保った。
- source_word: דַּם
  choice: 血
  rationale: 祭儀規定における語の通常の意味をそのまま訳した。
- source_word: הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִיםという祭儀上の供え物を、神との平和や共食を伴う交わりとの関連が伝わる現代日本語で表した。語義の幅を保つため、別訳を脚注に示した。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 犠牲動物から取り分けられる特定の脂肪部分を指す祭儀用語として、明確で字義に即した訳語を用いた。
- source_word: מִבְּנֵי אַהֲרֹן
  choice: アロンの子らのうち
  rationale: 祭司集団であるアロンの子らの中から該当者を選び出すמִןの意味を保ち、明示された男性複数も曖昧にしなかった。
- source_word: לוֹ תִהְיֶה
  choice: その者には……となる
  rationale: 法的に割り当てられ、帰属することを表す構文を、日本語の規定文として自然に表した。
- source_word: שׁוֹק הַיָּמִין
  choice: 右のもも
  rationale: שׁוֹקが指す脚の上部の肉、すなわち祭儀上分配されるももの部分を具体的に訳した。
- source_word: לְמָנָה
  choice: その取り分
  rationale: 割り当てられた分け前を意味するמָנָהを、所有関係が明瞭になるよう訳した。
theological_decisions:
- issue: בְּנֵי אַהֲרֹןの祭司的範囲と性別表現
  choice: アロンの子ら
  alternative: アロンの子孫／アロンの家系の者たち
  rationale: 本文は男性複数の「子ら」と明記し、祭儀に仕える祭司たちを具体的に指すため、家系全般へ一般化せず原文の表現を保った。
- issue: שְׁלָמִיםの解釈的幅
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平和のいけにえ
  rationale: この名称には平和・健全・共同の食事という関連があり、一つの神学的説明に限定しないよう、本文では祭儀的交わりを示す定着した表現を選び、別訳を脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある祭儀規定の文体とした。「献げる」は宗教的な差し出しを示し、「いけにえ」は読みやすさを優先して平仮名表記とした。
