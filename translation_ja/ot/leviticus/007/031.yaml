source:
  edition: WLC
  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: ja
  text: 祭司はその脂肪を祭壇の上で焼いて煙にし、胸肉はアロンとその子らのものとなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 焼いて煙にし
  rationale: 祭儀文脈における קטר のヒフィル形は、供え物を祭壇で焼き、その煙を立ち上らせることを表す。日本語では「焼いて煙にし」とすることで、単なる焼却ではなく祭壇上の燔焼という語義を明確かつ自然に伝える。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀に仕える כֹּהֵן の標準的な訳語であり、原文の単数形にも対応する。
- source_word: הַחֵלֶב
  choice: その脂肪
  rationale: レビ記の犠牲規定では、祭壇で焼くために取り分けられた脂肪部分を指す。「その」は直前の文脈にあるいけにえの脂肪であることを自然に示す。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を表す語尾は形式上「祭壇へ」とも訳せるが、הִקְטִיר と結び付く祭儀上の実際の動作は祭壇上で脂肪を焼くことであるため、明瞭な日本語にした。
- source_word: וְהָיָה
  choice: ものとなる
  rationale: 字義的には「そして、それはある」であるが、ここでは祭司の取り分として帰属することを定める法的表現である。「ものとなる」はその帰属を自然に示す。
- source_word: הֶחָזֶה
  choice: 胸肉
  rationale: 犠牲動物のうち祭司に割り当てられる胸の部位を指す。現代日本語では「胸」だけよりも「胸肉」のほうが動物の肉の部位として明確である。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らの
  rationale: לְ はここで割り当て・所有を示す。「アロンとその子らのもの」として原文の共同の帰属を簡潔に表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀法としての厳粛さを保つ文体とした。「焼いて煙にし」によりヘブライ語の祭儀的な煙の含意を本文に取り込み、脚注を不要とした。
