  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: ja
  text: また、あなたがたは、どこに住んでいても、鳥や家畜の血を一切食べてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל דָּם לֹא תֹאכְלוּ
  choice: また、…血を一切食べてはならない
  rationale: 接続詞וְは前の規定との連続を示すため「また」とした。否定文中のכָלは全面的禁止を表すので、「血を一切…ない」と自然な現代日本語で表した。
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: どこに住んでいても
  rationale: מוֹשָׁבは居住地・住む所を指す。בְּכֹלの包括的な適用範囲を、明快な日本語で示した。
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: 鳥や家畜の
  rationale: 前置詞לְはここで血が属する動物の種類を示す。「鳥や家畜の血」とすることで日本語として自然に関係を明示した。בְּהֵמָהはこの律法・供犠の文脈では主に家畜を指す。
theological_decisions:
- issue: 血を食べることの禁止範囲
  choice: イスラエルがどこに住んでいても、鳥や家畜の血を一切食べることを禁じる規定として訳す。
  alternative: 語順をより直訳的に保ち、「あなたがたのすべての居住地で、鳥にも家畜にも属する、いかなる血も」とする。
  rationale: ヘブライ語は禁じられる血の由来となる動物の区分と、規定が及ぶ場所を示している。後代の神学的説明は加えず、法的禁止だけを明瞭に表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法的命令の強さは「食べてはならない」で示し、不自然な逐語訳は避けた。
