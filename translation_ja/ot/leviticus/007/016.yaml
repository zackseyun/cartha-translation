  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: ja
  text: しかし、その人が献げるいけにえが、誓願の献げ物、あるいは自発的な献げ物であるなら、そのいけにえを献げる日に食べなければならない。翌日にも、その残りを食べてよい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶדֶר
  choice: 誓願のささげ物
  rationale: この文脈では、単に誓願そのものではなく、誓願に伴って献げるいけにえの種類を指す。対をなす נְדָבָה との区別を明確にするため、「誓願のささげ物」とした。
- source_word: נְדָבָה
  choice: 自発のささげ物
  rationale: 義務としてではなく、自ら進んで献げるものを表す。現代日本語で意味が直接伝わる表現を選んだ。
- source_word: זֶבַח קָרְבָּנוֹ
  choice: その人の献げ物のいけにえ
  rationale: זֶבַח（いけにえ）と קָרְבָּן（献げ物）の両語を訳出し、原文の重なりを保った。「その人」は三人称接尾辞を自然に表す。
- source_word: בְּיוֹם הַקְרִיבוֹ אֶת זִבְחוֹ
  choice: そのいけにえを献げる日に
  rationale: קרב の使役形が祭儀において「近づける、差し出す、献げる」を意味するため、日本語では自然な「献げる」とした。
- source_word: יֵאָכֵל（第一例）
  choice: 食べなければならない
  rationale: 受動形の未完了が祭儀規定の指示を表しているため、初日の規定を義務的な法令表現で訳した。
- source_word: וּמִמָּחֳרָת
  choice: 翌日にも
  rationale: מָחֳרָת は「次の日」を意味する。前日に加えて翌日も可食期間に含まれることが自然に伝わるよう、添加の「も」を用いた。
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: 残ったもの
  rationale: נוֹתָר は「残されているもの」を指す。指示対象がいけにえであることは文脈上明らかなため、簡潔な現代日本語とした。
- source_word: יֵאָכֵל（第二例）
  choice: 食べてよい
  rationale: 第一例と同じヘブライ語形だが、ここでは翌日に残りを食べることが許される期間を示すため、文脈上の許可を明示した。
theological_decisions:
- issue: 同一の יֵאָכֵל が二度用いられることによる、命令と許可の関係
  choice: 第一例を「食べなければならない」、第二例を「食べてよい」とした。
  alternative: 両方を「食べなければならない」と訳す。
  rationale: 初日は食べるべき時を定める法的指示であり、翌日の文は残った分の可食期間を認める趣旨と理解できる。語形の同一性は注釈上の判断として記録しつつ、日本語では規定の機能を明瞭にした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀法としての厳粛さを保つ文体とした。「献げ物」と「いけにえ」を使い分けて原文の二つの祭儀用語を保持し、「ささげ物」は複合語内で読みやすい表記にした。
