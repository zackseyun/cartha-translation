revisions:
- from: 自分の手で、主への火によるささげ物を携えて来なければならない。脂肪を胸肉とともに携えて来て、その胸肉を奉献物として主の前で揺り動かす。
  to: 自分の手で、主への火によるささげ物を携えて来なければならない。胸の肉の上に脂肪を載せて携えて来る。主の前で胸の肉を揺り動かし、揺り動かす供え物とするためである。
  rationale: 脂肪が胸の肉の上に置かれるという原文の関係を明示し、テヌーファーの祭儀的意味を「揺り動かす供え物」として保持した。「ためである」は לְהָנִיף の目的を自然な日本語で表す。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:32:39Z'
review_pass:
  verdict: revise
  source_fidelity: 原文は「その手で」主への火によるささげ物を持って来ることを求め、脂肪が胸の肉の「上に」置かれる関係を示す。その後、胸の肉を主の前でテヌーファー（揺り動かす供え物）として揺り動かす。現訳の「ともに」はこの位置関係を弱め、「奉献物」は תְּנוּפָה の固有の祭儀的意味を十分に表していない。
  naturalness: 「胸肉」は食材・料理を連想しやすいため、祭儀における部位としては「胸の肉」がより自然で明確である。「揺り動かす供え物」は、儀礼動作の方向を断定せず、現代日本語としても理解可能である。
  terminology: 「主」「火によるささげ物」は維持できる。תְּנוּפָה は単なる「奉献物」ではなく、揺り動かす行為を伴う祭儀上の供え物なので、「揺り動かす供え物」と訳す。
  issues:
  - severity: medium
    issue: עַל־הֶחָזֶה の位置関係が「ともに」とされている。
    rationale: עַל は通常「〜の上に」を表す。この箇所では脂肪を胸の肉の上に置いて持参する描写であり、単に同時に持参する意味へ一般化しないほうが原文に忠実である。
  - severity: medium
    issue: תְּנוּפָה が「奉献物」と訳されている。
    rationale: 「奉献物」では揺り動かす供え物という祭儀的な語義が失われる。直前の動詞だけでなく、名詞側にもその意味を反映させる必要がある。
  - severity: low
    issue: 「胸肉」が日常の食材名として響く。
    rationale: 原文の祭儀的な部位を明瞭に示すため、「胸の肉」とするのがよい。
  revised_text: 自分の手で、主への火によるささげ物を携えて来なければならない。胸の肉の上に脂肪を載せて携えて来る。主の前で胸の肉を揺り動かし、揺り動かす供え物とするためである。
  revised_footnotes: []
