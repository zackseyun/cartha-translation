source:
  edition: WLC
  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: ja
  text: 自分の手で、主への火によるささげ物を携えて来なければならない。胸の肉の上に脂肪を載せて携えて来る。主の前で胸の肉を揺り動かし、揺り動かす供え物とするためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: 自分の手で
  rationale: 祭司任せにせず、ささげる本人が直接持参することを表す強調を自然な日本語で再現した。
- source_word: אִשֵּׁי יְהוָה
  choice: 主への火によるささげ物
  rationale: אִשֶּׁה の祭儀的意味を保ちつつ、単なる食物や一般的ないけにえではなく、火に供するささげ物であることを示した。神名 יהוה は本文の慣例に適した「主」とした。
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: 脂肪を胸肉とともに
  rationale: 前置詞 עַל はここで二つを一緒に携える関係を示すと理解し、位置関係を不自然に限定する「胸肉の上に」ではなく「ともに」とした。
- source_word: תְּנוּפָה
  choice: 奉献物
  rationale: 語は祭儀上、主の前で揺り動かしてささげるものを指す。動作は直前の「揺り動かす」で明示されるため、日本語では目的を示す「奉献物」とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名であることを踏まえつつ、日本語聖書として広く理解される伝統的な表記を採用した。特定の発音復元を本文で断定しない。
- issue: תְּנוּפָה の具体的な儀礼動作
  choice: 揺り動かす
  alternative: 前後に振る／高く掲げる
  rationale: 語根の基本的な運動性は表すが、動作の正確な方向や型は本文だけでは確定しないため、限定しすぎない訳にした。
translation_notes:
  register: 律法本文にふさわしい簡潔で厳粛な命令調としつつ、現代の一般読者にも理解できる語順にした。「携えて来なければならない」で原文の未完了形が持つ規定的な力を表した。
