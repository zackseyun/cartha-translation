  naturalness: 現代標準日本語として概ね自然で、祭儀法文としての簡潔さもある。「また、だれかが、人に…」の読点は不自然なので除き、包括句と列挙の関係を「すなわち」で明瞭にすると読みやすい。
  terminology: 「汚れ」は儀礼的区分を一貫して示し、「主」「いけにえ」「民の中から断たれる」も適切である。「平和のいけにえ」は日本語として多少文語的だが、原語と英語監査記録の peace offerings により近く、定型的な祭儀用語として許容される。
