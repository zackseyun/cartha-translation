revisions:
- from: また、だれかが、人に由来する汚れ、汚れた動物、または汚れた忌むべきもののいずれかに触れ、主のものである交わりのいけにえの肉を食べるなら、その者は自分の民の中から断たれる[a]。
  to: また、だれかが何らかの汚れたもの、すなわち、人の汚れ、汚れた動物、あるいは汚れた忌むべきものに触れ、主のものである平和のいけにえの肉を食べるなら、その者は自分の民の中から断たれる[a]。
  rationale: 包括句「何らかの汚れたもの」を補い、後続の三項目がその具体化であることを「すなわち」によって示した。「平和のいけにえ」は、祭儀名としての重みを保ちつつ、שְׁלָמִים と英語監査記録の peace offerings により密接に対応させる変更である。制裁句の意味を限定しない脚注と本文は維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:33:09Z'
