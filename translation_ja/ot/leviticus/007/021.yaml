  - severity: low
    issue: 「交わりのいけにえ」は שְׁלָמִים の訳としてやや解釈的である。
    rationale: 「交わり」は英語 fellowship offering に対応する有力な慣用訳だが、提示された英語監査記録は peace offerings を選び、ヘブライ語の語根も平和・安寧の領域に属する。「平和のいけにえ」は原語の語感をより直接に保持する。
