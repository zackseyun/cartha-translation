  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: ja
  text: また、だれかが何らかの汚れたもの、すなわち、人の汚れ、汚れた動物、あるいは汚れた忌むべきものに触れ、主のものである平和のいけにえの肉を食べるなら、その者は自分の民の中から断たれる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民の中から断たれる」は契約違反への制裁を表す定型句。共同体からの排除または神による裁きなどを指し得るが、ここではその具体的な方法は示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: だれか／その者
  rationale: この律法文脈では、非物質的な「魂」ではなく、一人の人を指す。日本語では条件節を「だれかが」、制裁句を「その者は」とするのが自然である。
- source_word: תִגַּע בְּכָל טָמֵא
  choice: 汚れたもののいずれかに触れ
  rationale: נגע の接触の意味と、בכל の包括的範囲を明確に表す。ここでの「汚れ」は儀礼上の区分を指す。
- source_word: טֻמְאַת אָדָם
  choice: 人に由来する汚れ
  rationale: 人間に関連して生じる儀礼上の汚れを表す。「人の汚れ」より意味関係が明瞭で、性別も限定しない。
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: 汚れた動物
  rationale: בְּהֵמָה はここでは広く動物を指し、「動物」が明快である。
- source_word: שֶׁקֶץ טָמֵא
  choice: 汚れた忌むべきもの
  rationale: שֶׁקֶץ の強い忌避のニュアンスと、טָמֵא の儀礼上の汚れをともに保持する。特定の種類の生物だけに狭めない。
- source_word: וְאָכַל מִבְּשַׂר
  choice: 肉を食べる
  rationale: מן の部分を取る意味は、日本語では目的語「肉を」によって自然に含意される。犠牲の可食部を指す文脈に適する。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שלמים が示す祭儀名を、現代日本語で理解しやすい名称として表す。「和解」と断定して語義を狭めることを避ける。
- source_word: אֲשֶׁר לַיהוָה
  choice: 主のものである
  rationale: לַיהוָה が示す、主に属する、または主にささげられたものという関係を簡潔に表す。神名 יהוה は日本語聖書で広く通用する「主」とした。
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: 自分の民の中から断たれる
  rationale: 契約上の制裁を表す定型句の比喩を保持し、追放、死、神の裁きなど具体的な執行方法を本文で決めない。接尾辞の女性形は נֶפֶשׁ の文法的性によるため、日本語では性別を限定しない「自分」とする。
theological_decisions:
- issue: 「民の中から断たれる」という制裁の具体的意味
  choice: 比喩的な定型表現を保ち、具体的な執行方法を特定しない
  alternative: 共同体から追放される／死刑に処せられる／神の裁きによって命を絶たれる
  rationale: ヘブライ語本文はここで制裁の具体的な形を明示していないため、その神学的・法的な幅を訳文でも保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀法にふさわしい簡潔で重みのある文体とした。「汚れ」を一貫して儀礼上の用語として用い、制裁句の曖昧さを保持した。
