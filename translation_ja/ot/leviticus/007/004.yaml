base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ja
  text: また、二つの腎臓と、その上にあり腰部にある脂肪を取り除く。さらに、肝臓の上にある突起[a]を、腎臓とともに取り除く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。この解剖学的部位を表すヘブライ語は専門用語で、正確にどの部分を指すかについては議論がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 犠牲の部位を述べる文脈で、כְּלָיוֹת は明確に腎臓を指す。現代日本語で直接的かつ自然な表現とした。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: レビ記の犠牲規定では、ささげるために取り分ける脂肪部分を指す。「脂肪」が最も明瞭で一般的である。
- source_word: אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: その上、すなわち腰のあたりにある
  rationale: 二つの関係節を保ちつつ、日本語で部位の位置関係が分かるようにした。כְּסָלִים は腰・脇腹付近を指すため、過度に限定しない「腰のあたり」とした。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝臓に付いている突起
  rationale: יֹתֶרֶת は正確な指示対象が議論される祭儀上の解剖用語である。「突起」は特定の葉に断定せず、突出した部分という基本像を伝える。「付いている」は日本語の解剖表現として自然である。
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: 腎臓と一緒に取り除く
  rationale: この定型句では、肝臓の当該部分を腎臓とともに除去する手順を表すと理解し、自然な日本語にした。動作主は前後の規定から明らかなため、明示していない。
