source:
  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: ja
  text: 罪のためのいけにえも、償いのいけにえも、同じ定め[a]に従う。その供え物によって贖罪を行う祭司のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定め」に当たるヘブライ語は「トーラー」で、「教え」または「律法」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: 罪のためのいけにえも、償いのいけにえも同じであり
  rationale: 二つの前置詞 כ が作る対応的な比較を自然な日本語で表した。חטאת は祭儀文脈で「罪のためのいけにえ」、אשם は損害の償いを伴うことの多い祭儀上の供え物として「償いのいけにえ」とした。
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: 両者には一つの定めがある
  rationale: תורה はここでは祭儀上の規定・手順を指すため「定め」とした。להם が直前の二つのいけにえを受けることを「両者」で明示した。
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֶּר בּוֹ
  choice: それによって贖いを行う祭司
  rationale: כפר の祭儀的・神学的な重みを保つため「贖いを行う」とした。בו はいけにえを手段として示すので「それによって」と訳し、原文に明示されない対象を補わなかった。
- source_word: לוֹ יִהְיֶה
  choice: 祭司のものとなる
  rationale: 所有・割り当てを示すヘブライ語の慣用表現を、法規として明瞭な現代日本語にした。
theological_decisions:
- issue: 祭儀法における כפר の訳語
  choice: 贖いを行う
  alternative: 罪を覆う／清めを行う
  rationale: 語義を特定の贖罪理論や清めの側面だけに限定せず、祭司がいけにえによって行う神学的・祭儀的行為を広く保持した。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある法規文の調子とした。「罪祭」「愆祭」のような専門的な漢語は避け、供え物であることが明瞭な表現を用いた。
