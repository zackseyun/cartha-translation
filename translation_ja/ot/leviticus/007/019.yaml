source:
  edition: WLC
  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: ja
  text: しかし、何らかの汚れたもの[a]に触れた肉は、食べてはならない。それは火で焼かなければならない。一方、肉は、清い者ならだれでも食べてよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何らかの汚れたものに接触した」とも訳せる。ヘブライ語は広い表現で、儀礼上の汚れを指す。
    reason: 接触の表現と「汚れたもの」の儀礼的・包括的な意味範囲を示すため。
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: しかし、…肉は
  rationale: בָּשָׂר はこの文脈ではいけにえの「肉」を指す。冒頭の接続詞は、食べることのできる肉との対照を自然な日本語で示すため「しかし」とした。
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: 何であれ汚れたものに触れた
  rationale: יִגַּע の物理的な接触を「触れた」で表し、כָּל טָמֵא の広い範囲を限定しすぎず「何であれ汚れたもの」とした。ここでの汚れは儀礼上の状態である。
- source_word: לֹא יֵאָכֵל
  choice: 食べてはならない
  rationale: 受動形の禁止を、現代日本語の律法的表現として明確に訳した。
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: それは火で焼かなければならない
  rationale: 汚れた肉の処分義務を明確にし、בָּאֵשׁ を自然かつ具体的な「火で」と訳した。
- source_word: וְהַבָּשָׂר
  choice: 一方、肉は
  rationale: 同じ名詞の反復による話題転換と、汚れた肉との対照を示す。「それ以外の肉」など、原文に明示されない限定は加えなかった。
- source_word: כָּל טָהוֹר
  choice: 清い者ならだれでも
  rationale: 形容詞が人を指して名詞的に用いられていることを自然に表し、儀礼上清い状態にあるすべての人を含めた。
- source_word: יֹאכַל בָּשָׂר
  choice: 肉は…食べてよい
  rationale: 命令ではなく許可を表す文脈に即して「食べてよい」とした。日本語では目的語を文頭の主題として示した。
theological_decisions:
- issue: טָמֵא と טָהוֹר が表す清浄・不浄の性質
  choice: 「汚れたもの」「清い者」と訳し、儀礼上の状態として理解できるよう注記する
  alternative: 「不浄なもの」「清浄な者」または「けがれたもの」「きよい者」
  rationale: レビ記の祭儀規定では、これらは主として儀礼上の状態を表し、道徳的な善悪や個人の罪深さと同一ではない。本文では簡明な語を用い、脚注でその範囲を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、律法本文にふさわしい簡潔で厳正な調子を保った。「清い」「汚れた」は一般読者に理解しやすい表現とし、道徳的評価との混同を避けるため脚注を付した。
