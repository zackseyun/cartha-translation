id: LEV.7.8
reference: Leviticus 7:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: ja
  text: ある人の全焼のささげ物をささげる祭司には、その祭司がささげた全焼のささげ物の皮が、その祭司のものとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「その祭司に、それは彼のものとなる」。皮が、実際にその全焼のささげ物をささげた祭司の取り分となることを指す。
    reason: 原文の所有表現と指示対象を示すため。
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記の祭儀規定における כֹּהֵן の標準的で明瞭な訳語。定冠詞の機能は文脈と語順によって表した。
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: ささげる／ささげた
  rationale: קרב のヒフィル形がここで持つ祭儀的意味を、自然な現代日本語で表した。前者は当該祭司を特定する分詞、後者はすでに行った行為を示す完了形として訳し分けた。
- source_word: עֹלַת אִישׁ
  choice: ある人の全焼のささげ物
  rationale: עֹלָה を、供物全体を焼く祭儀区分として明瞭な「全焼のささげ物」とした。אִישׁ はここでは供献者一人を指すため、日本語で不自然に性別を強調せず「ある人」とした。
- source_word: ע֤וֹר הָֽעֹלָה
  choice: 全焼のささげ物の皮
  rationale: עֹור は動物の皮を指す。「皮」は現代日本語で自然であり、文脈上、なめした革ではなく供犠動物の皮であることが明らか。
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: その祭司のものとなる
  rationale: 直訳的には「その祭司に、彼のものとなる」。日本語では所有の帰属を明瞭にし、לוֹ の指示対象が供献者ではなく執行した祭司であることを示した。
theological_decisions:
- issue: אִישׁ の性別表現
  choice: ある人
  alternative: ある男／男の
  rationale: אִישׁ は男性単数形だが、この祭儀法の構文では特定の男性性を教えるというより個々の供献者を表す。日本語の「男の」は不要な対比や限定を生じさせるため避け、原文が単数の一人を指すことは「ある人」で保持した。
- issue: עֹלָה の祭儀用語
  choice: 全焼のささげ物
  alternative: 焼き尽くすささげ物／上るささげ物
  rationale: 語源的には「上る」と関係するが、この文脈では供物全体を祭壇で焼く既定の祭儀区分を指す。「全焼のささげ物」はその区分を簡潔かつ明瞭に示し、語源だけに基づく解釈を本文へ持ち込まない。
translation_notes:
  register: 祭儀法にふさわしい簡潔で端正な文体としつつ、現代の一般読者にも理解しやすい語順にした。「祭司」を三度用いる反復はやや目立つが、「その人」では供献者を指すようにも読めるため、帰属先を曖昧にしないことを優先した。
