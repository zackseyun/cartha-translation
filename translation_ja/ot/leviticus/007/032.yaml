  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: ja
  text: また、あなたがたの平和のいけにえの中から、右のももを奉納物として祭司に与えなさい。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「右の脚」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「奉納分」または「献納物」とも訳せる。伝統的には「挙祭」。
    reason: lexical_alternative
  - marker: c
    text: 「交わりのいけにえ」または「健全のいけにえ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק הַיָּמִין
  choice: 右のもも
  rationale: שׁוֹקは犠牲動物の脚、とりわけ上部を指し得るため、祭儀上の部位として「もも」とした。הַיָּמִיןの左右の指定も明示した。
- source_word: תִּתְּנוּ
  choice: 渡しなさい
  rationale: 二人称複数未完了形が法規の中で持つ指示の力を、現代日本語の自然な命令表現で示した。受領者が祭司であるため、「与えなさい」より「渡しなさい」が自然である。
- source_word: תְרוּמָה
  choice: 奉納物
  rationale: 取り分けて神にささげ、祭司に渡す指定部分を表す語である。「揺祭」のような伝統的専門語は、語自体に明示されない特定の動作を想起させ、一般読者には不透明なため避けた。
- source_word: לַכֹּהֵן
  choice: 祭司に
  rationale: 単数形と受領者をそのまま保持した。
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: あなたがたの会食のいけにえの中から
  rationale: מִןの起点・取り分けの意味と二人称複数接尾辞を明示した。שְׁלָמִיםは神との平和、交わり、安寧を含意し得る祭儀用語であり、供献者も食事にあずかる性格を読者に伝える「会食のいけにえ」を本文に採用した。
- source_word: וְאֵת
  choice: また
  rationale: וְによる前節との連続を自然に示し、目的語標識אֵתは訳語を置かなかった。
theological_decisions:
- issue: שְׁלָמִיםの祭儀的意味
  choice: 会食のいけにえ
  alternative: 和解のいけにえ／交わりのいけにえ／平安のいけにえ
  rationale: 語源的・神学的な意味を一つに限定せず、この供え物の具体的特徴である共同の食事を前景化した。別訳を脚注に示し、平和・交わり・安寧という意味の幅を保った。
translation_notes:
  register: 明瞭で現代的な法規文体としつつ、祭儀の荘重さを保った。「いけにえ」は一般読者にも理解可能な定着語として用い、「奉納物」は伝統的だが不透明な「揺祭」を避けるため採用した。
