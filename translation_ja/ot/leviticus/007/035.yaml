  variant: clear modern standard Japanese
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: ja
  text: これは、彼らをヤハウェに祭司として仕えさせるために近づけた日に、ヤハウェへの火によるささげ物の中からアロンとその子らに与えられる取り分[a]である。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「取り分」と訳したヘブライ語は「油を注ぐこと」と関係があり、「油注ぎに伴う取り分」とも訳せる。ここでは、祭司の任職に伴って割り当てられた取り分を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ヤハウェへの食物のささげ物」。伝統的には「ヤハウェへの火によるささげ物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: 受ける分
  rationale: 語源的には油注ぎと関係するが、ここでは祭司の任職に伴って割り当てられる取り分を指す。本文では自然な日本語を優先し、語源上の含みは脚注に残した。
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: アロンの受ける分と、その子らの受ける分
  rationale: 原文で名詞が反復されることを反映し、アロンとその子らそれぞれの取り分を明示した。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物のうちから
  rationale: אִשֶּׁה の火との明白な関連を保ちつつ、מִן の部分・出所の関係を「うちから」で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語表記で音写した。
- source_word: בְּיוֹם
  choice: 日に
  rationale: 祭司任職の時を示す時間表現として簡潔に訳した。
- source_word: הִקְרִיב אֹתָם
  choice: 彼らを近づけて
  rationale: קרב の使役形が持つ「近くに来させる／差し出す」という意味を保った。原文で明示されない動作主は、日本語でも補わなかった。
- source_word: לְכַהֵן לַיהוָה
  choice: ヤハウェに祭司として仕えさせた
  rationale: כהן の祭司職としての奉仕と、לַיהוָה が示す奉仕の相手を自然な日本語で表した。
theological_decisions:
- issue: מִשְׁחַת が油注ぎそのものを指すか、任職に伴う祭司の取り分を指すか
  choice: 本文では祭司に割り当てられた「受ける分」
  alternative: 「油注ぎの分」または「油注ぎ」
  rationale: 直前の文脈は祭司がささげ物から受ける取り分を扱っているため、配分の意味が最も適切である。ただし油注ぎとの語源的・儀礼的な結びつきは脚注で明示し、完全には消去しない。
- issue: הִקְרִיב の動作主
  choice: 日本語本文でも明示しない
  alternative: 「モーセが彼らを近づけて」
  rationale: 文脈上はモーセと理解できるが、この節のヘブライ語本文には主語の名がないため、補足による限定を避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀用語は難解な漢語に寄せすぎず、「ささげ物」「祭司として仕える」を用いた。第二文の「定められた」は、前半の名詞文と後半の時間句を自然につなぐための文脈的補足である。
