source:
  edition: WLC
  text: וְ/כָל מִנְחָ֥ה בְלוּלָֽה בַ/שֶּׁ֖מֶן וַ/חֲרֵבָ֑ה לְ/כָל בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּ/אָחִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: ja
  text: また、油を混ぜた穀物のささげ物も、乾いた穀物のささげ物も、アロンの子ら全員のものとなり、それぞれが兄弟と同じ分を受ける。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「一人がその兄弟のように」。このヘブライ語の言い回しは、アロンの子らの間で等しく分けることを表す。
    reason: ヘブライ語の慣用表現と、その分配上の意味を示すため。
lexical_decisions:
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀的文脈では、一般的な贈り物ではなく、穀物を用いる特定のささげ物を指すため。現代日本語で内容が明確になる表現を選んだ。
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 受動分詞と前置詞句が、油を混ぜるという調製法を表している。簡潔で自然な現代日本語とした。
- source_word: חֲרֵבָה
  choice: 乾いた
  rationale: 油を混ぜたものとの対照を保ち、『油を混ぜない』と解釈的に言い換えすぎないよう、原語の形容表現に対応させた。
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: アロンの子ら全員のものとなり
  rationale: לְ と היה の組み合わせが所有・割り当てを示すため、その法的な意味を自然な日本語で表した。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: 男性祭司を指す原文の親族表現を保持し、性別を中性化しなかった。
- source_word: אִישׁ כְּאָחִיו
  choice: それぞれが兄弟と同じ分を受ける
  rationale: 直訳的な比較表現の背後にある均等な分配という慣用的意味を、祭司法規として明瞭かつ自然に表した。
theological_decisions:
- issue: 祭司を指す性別のある親族表現
  choice: アロンの子ら……兄弟
  alternative: アロンの子孫……それぞれ
  rationale: 原文は男性を示す בְּנֵי と אָחִיו を用いており、男性祭司に関する法規なので、その性別表現を保持した。
- issue: 祭司間の分配方法
  choice: それぞれが兄弟と同じ分を受ける
  alternative: それぞれが兄弟のように受ける
  rationale: אִישׁ כְּאָחִיו は字面では比較表現だが、この配分規定では各人が同等の分を受けることを示す。曖昧な逐語訳を避けつつ、その均等性のみを明示した。
translation_notes:
  register: 祭司法規にふさわしい簡潔で品位ある文体を用いた。「も……も」で二種類の穀物のささげ物を並列し、一般の読者にも分かる現代標準日本語にした。
