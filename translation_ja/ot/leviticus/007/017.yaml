base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: ja
  text: また、いけにえの肉のうち、三日目に残っているものは、火で焼かなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: しかし、…残ったもの
  rationale: 接続詞と受動分詞を、前節の許可から残余物の処置へ移る対照として自然に表した。分詞の名詞的用法は「残ったもの」とした。
- source_word: מִבְּשַׂר הַזָּבַח
  choice: いけにえの肉のうち
  rationale: בָּשָׂר は食用となる犠牲獣の文脈なので、現代日本語で明瞭な「肉」とした。זֶבַח は祭儀的な犠牲を指すため「いけにえ」とし、מִן の部分・出所の意味を「のうち」で表した。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目まで
  rationale: 直訳は「三日目に」だが、前節の「二日目に食べることができる」という規定を受け、三日目に残存している状態を明瞭に示すため「三日目まで残った」とした。三日目に焼却する時点は保持している。
- source_word: בָּאֵשׁ
  choice: 火で
  rationale: 日本語では焼却の手段を「火で」と表すのが自然であり、火による処分という意味を保つ。
- source_word: יִשָּׂרֵף
  choice: 焼かなければならない
  rationale: ニファル未完了形の受動的・規定的意味を、日本語の法令・指示として明瞭な義務表現で示した。日本語では能動形だが、行為者を特定せず規定の効力を自然に伝える。
