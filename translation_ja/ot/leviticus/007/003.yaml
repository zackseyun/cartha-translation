  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: ja
  text: その動物から、その脂肪をすべて、すなわち、脂肪の多い尾[a]と、内臓を覆う脂肪とを差し出す[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 羊の尾に蓄えられた厚い脂肪の部分を指す。祭儀で献げられる特定の部位である。
    reason: cultural_note
  - marker: b
    text: 「献げる」とも訳せる。ヘブライ語の動詞は、犠牲の一部を神の前に差し出すこと、または献げることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: その脂肪／脂肪
  rationale: 祭儀の文脈で、いけにえとして取り分けられる脂肪部分を指す。日本語では「脂肪」が簡潔で直接的である。
- source_word: יַקְרִיב
  choice: 差し出す
  rationale: ヒフィル形は、祭儀において神の前に持って来て差し出すこと、または献げることを表す。「差し出す」は儀式のどの段階かを必要以上に限定しない。
- source_word: מִמֶּנּוּ
  choice: それから
  rationale: 接尾辞は直前の文脈にある犠牲の動物を指すと判断した。原文の代名詞的表現を保ちつつ、動物から脂肪を取り分ける意味を伝える。
- source_word: הָאַלְיָה
  choice: 脂肪のついた尾
  rationale: 羊の脂肪を多く蓄えた尾という特定の部位を指す。単に「尾」とするより祭儀上の部位が明確であり、「脂尾」のような難解な専門語も避けられる。
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: 内臓を覆う脂肪
  rationale: קֶרֶב はここでは動物の内臓を指す。「内臓を覆う」は解剖学的関係を明確かつ自然な現代日本語で表す。
- source_word: כָּל
  choice: すべて
  rationale: 指定された脂肪部分の全体を強調する語を、そのまま明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀上の具体的な部位を平易に示しつつ、יַקְרִיב の「差し出す／献げる」という語義の幅は脚注で保持した。脚注が本文に現れる順序に合わせ、文化注を[a]、語義注を[b]とした。
