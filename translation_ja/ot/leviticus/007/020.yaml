  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: ja
  text: しかし、主のための交わりのいけにえの肉を、汚れが身にあるままで食べる者は、自分の民から断たれる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の民から除かれる」。ここで「断たれる」が追放を指すのか死を指すのか、その具体的な手段をヘブライ語本文は明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 者
  rationale: 祭儀法の文脈では、非物質的な「魂」ではなく、一人の人を指す。日本語の法的な一般条件文として「者」が簡潔で自然。
- source_word: תֹּאכַל
  choice: 食べる
  rationale: 未完了形はここで一般的な法的事例を表すため、「食べる者」とした。
- source_word: בָּשָׂר
  choice: 肉
  rationale: 犠牲としてささげられ、食物となる肉を指す文脈に合う明瞭な現代語。
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: 交わりのいけにえの肉
  rationale: שְׁלָמִים は祭儀上の特定のささげ物。語義を単に「平和」に限定せず、神との交わりを伴う供食的性格を分かりやすく示す。זֶבַח は「いけにえ」と訳した。
- source_word: אֲשֶׁר לַיהוָה
  choice: 主にささげた
  rationale: לַיהוָה は、そのいけにえがYHWHのためのもの、すなわち主に属する聖別されたものだと示す。「主にささげた」は日本語として自然で、その祭儀的関係を明瞭に伝える。
- source_word: טֻמְאָתוֹ עָלָיו
  choice: 汚れを身に負ったままで
  rationale: 直訳的な「その汚れが彼の上にある」という比喩を、「身に負う」で保ちつつ、祭儀上の汚れが残っている状態を自然な日本語で表した。
- source_word: וְנִכְרְתָה
  choice: 断たれる
  rationale: 契約・法的文脈の כרת ニファル形が表す重大な共同体からの除去を、手段を特定せずに保持する。
- source_word: מֵעַמֶּיהָ
  choice: その民から
  rationale: נֶפֶשׁ に付く文法上の女性接尾辞を生物学的性別とは解さず、性別を限定しない自然な日本語とした。
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ が示す刑罰の具体的意味
  choice: その民から断たれる
  alternative: その民から追放される／死ぬ、または死刑に処される
  rationale: この定型句は契約共同体からの重大な除去を示すが、この箇所自体は、それが追放なのか死なのか、また誰が執行するのかを明示しない。その曖昧さを本文で解消せず、注で可能性を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀法としての厳粛さを保った。「者」「断たれる」によって法文の簡潔さを出し、「汚れを身に負ったまま」で原文の比喩と状態の継続を両立させた。神名יהוהは日本語聖書で広く理解される「主」とした。
