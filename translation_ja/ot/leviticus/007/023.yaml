source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: ja
  text: 「イスラエルの子ら[a]に告げなさい。『牛、羊、やぎの脂肪は、いっさい食べてはならない。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より自然には「イスラエル人」。ヘブライ語は字義どおりには「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げなさい
  rationale: ピエル命令形で、モーセに民への伝達を命じる語。日本語の律法導入句として自然で、命令の直接性も保つ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの表現を本文に残し、契約共同体全体を指すことを脚注で明示する。
- source_word: לֵאמֹר
  choice: 「……」
  rationale: 後続の発言内容を直接引用として示すことで、ヘブライ語の標準的な発言導入句を自然な現代日本語にする。
- source_word: כָּל חֵלֶב
  choice: 脂肪は、いっさい
  rationale: 禁止文中の כָּל が示す包括的範囲を「いっさい」で表す。חֵלֶב はこの祭儀的文脈で特定の脂肪部分を指し得るが、本文では広く明瞭な「脂肪」とする。
- source_word: שׁוֹר
  choice: 牛
  rationale: 性別を不必要に限定せず、家畜の種類を表す自然な総称。
- source_word: כֶשֶׂב
  choice: 羊
  rationale: 子羊や雄羊に限定せず、法的な家畜区分として訳す。
- source_word: עֵז
  choice: やぎ
  rationale: 文法上は女性形だが、この列挙では家畜の種類を一般的に指すため、総称として訳す。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならない
  rationale: 二人称複数への法的禁止を、明瞭で dignified な現代日本語で表す。
theological_decisions:
- issue: 脂肪の禁止範囲
  choice: 本文では「脂肪は、いっさい」と包括的に表現する
  alternative: 「脂身を一切」または祭儀で指定された脂肪部分に限定して訳す
  rationale: 原文の כָּל חֵלֶב の強い包括表現を保持し、周辺文脈から導かれる適用範囲をこの節だけで狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の命令としての端正さを保った。家畜名は一般読者に自然な「牛、羊、やぎ」とし、引用符によって לֵאמֹר の機能を表した。
