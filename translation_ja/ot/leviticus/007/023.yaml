  naturalness: 「イスラエルの子らに告げなさい。『…食べてはならない。』」は明瞭な現代標準日本語であり、律法文として適切に端正である。「いっさい」の位置も自然で、禁止の包括性が明確である。
  terminology: 「イスラエルの子ら」は בְּנֵי יִשְׂרָאֵל の字義を保つことができ、脚注の「イスラエル人」という自然な代案も適切である。家畜名「牛、羊、やぎ」は שׁוֹר、כֶּשֶׂב、עֵז の総称的用法に対応する。「脂肪」は一般読者に通じる中立的な訳語である。
