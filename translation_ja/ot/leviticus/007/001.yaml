  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: ja
  text: これが罪過のいけにえについての規定である。それは最も聖なるものである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「償いのいけにえ」または「賠償のいけにえ」とも訳せる。ヘブライ語アシャムは、罪責と償いに関わるいけにえを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: 次のとおりである
  rationale: 接続詞を伴う指示語が新しい規定を導入しているため、時間的な「今」を補わず、現代日本語で自然な節導入として表現した。
- source_word: תּוֹרַת
  choice: についての律法
  rationale: ここでは祭儀に関する定め・規定を指す。「律法」はレビ記の文脈と語の重みを保ちつつ、対象との関係を「についての」で明確にする。
- source_word: הָאָשָׁם
  choice: 贖罪のいけにえ
  rationale: אָשָׁםは罪責と償いに関わる特定の供え物を指す。日本語聖書で理解されやすい名称を本文に置き、償い・賠償の側面は脚注で保持した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同語反復によるヘブライ語の最上級表現を、聖所の区画名との混同を避けながら自然に訳した。
- source_word: הוּא
  choice: これは…ものである
  rationale: 男性単数代名詞がそのいけにえを受け、最高度の聖性に属するものと述べる述語文を明示した。
theological_decisions:
- issue: 祭儀用語 אָשָׁם の訳語
  choice: 贖罪のいけにえ
  alternative: 償いのいけにえ／賠償のいけにえ
  rationale: 罪責に関する祭儀という側面を保ち、一般読者にも通じる表現を本文に採用した。ただし、この語には損害の償い・返済と結びつく含意もあるため、代替訳を脚注に示して意味を狭めないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いけにえ」は宗教的文脈で一般読者にも理解しやすいひらがな表記とし、原文の簡潔な規定文の調子を保った。
