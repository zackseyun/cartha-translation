  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（神名四文字）。伝統的には「主」と訳される。
    reason: 神名の原語形と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: וַ־による語りの進行とדברの発話を、後続の直接話法を自然に導く現代日本語で表した。文脈上の連続は日本語では明示的な「そして」を置かなくても保たれる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字יהוהを称号に置き換えず、一般的な日本語表記で音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示すאֶלを自然な日本語の助詞「に」で表し、人名מֹשֶׁהは慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 後続の直接話法を導く定型句であり、日本語では「告げられた。」によってその機能が自然に表されるため、冗長な「言われた」を重ねなかった。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく神名四文字を用いているため、神名であることを本文で保持した。伝統的な代替表記は脚注で示した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。神の発話には敬意を示すため「告げられた」を用い、原文の定型的な導入句を不自然に逐語訳しない一方、神名は本文に保持した。
