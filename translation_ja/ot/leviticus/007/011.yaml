source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: ja
  text: これは、人がヤハウェにささげる平安のいけにえ[a]についての律法である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「健全のためのいけにえ」「幸福のためのいけにえ」。
    reason: שְׁלָמִיםには平安のほか、健全さ・幸福・繁栄という含みがある。本文では確立した技術用語「平安のいけにえ」を用い、意味に基づく代替訳を脚注に示す。
lexical_decisions:
- source_word: וְ/זֹאת
  choice: これは
  rationale: 接続詞を伴う指示語で新しい小区分を導入する。日本語では文脈上の進行を不自然な接続語で補わず、「これは」と簡潔に表した。
- source_word: תּוֹרַת
  choice: ～についての律法
  rationale: 祭司文書における所定の祭儀規定を指す。「律法」は法的・規範的な性格を保ち、後続語との連語関係は「～についての」で自然に示した。
- source_word: זֶבַח
  choice: いけにえ
  rationale: 屠られる犠牲を含意する祭儀用語であり、現代日本語の聖書文体で明瞭な「いけにえ」とした。
- source_word: הַ/שְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: 平安、健全、幸い、神との交わりを含む専門的な祭儀用語。「交わり」は供食を伴う祭儀の性格を伝えるが、語義を一つに限定しないよう別訳を脚注に残した。
- source_word: אֲשֶׁר יַקְרִיב
  choice: 人が～献げる
  rationale: 三人称男性単数は律法文で一般的な人を表すため、「人が」とした。קרב のヒフィル形は祭儀的に神の前へ携えて行く・差し出すことを表すので、「献げる」と訳した。
- source_word: לַ/יהוָה
  choice: ヤハウェに
  rationale: 前置詞 ל の方向・献呈先を「に」で示し、神名יהוהは固有名として「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の契約名を明記しているため、称号に置き換えず音写した。
- issue: שְׁלָמִיםという祭儀用語の訳
  choice: 交わりのいけにえ
  alternative: 平安のいけにえ／和解のいけにえ
  rationale: この語は平安、無事、充足、共同の食事という複数の含みを持つ。「交わり」は祭儀の性格を分かりやすく示す一方、語源的な「平安」の含みは脚注で保持した。「和解」は償いによる敵対解消と狭く受け取られ得るため本文には採らなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は一貫した名詞句とし、律法文における一般的な三人称男性単数は「人が」と包括的に表現した。
