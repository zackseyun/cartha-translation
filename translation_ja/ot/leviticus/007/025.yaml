id: LEV.7.25
reference: Leviticus 7:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: ja
  text: なぜなら、主への火によるささげ物[a]がささげられる家畜の脂肪を食べる者はだれでも、その人は自分の民から断たれる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主への食物のささげ物」。ヘブライ語は、祭壇の火で焼かれて煙となるささげ物を指す。
    reason: lexical_alternative
  - marker: b
    text: 「断たれる」はヘブライ語の法的な定型表現。その具体的な刑罰が、共同体からの追放、死、あるいは神による裁きを指すのかについては見解が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: （訳文では独立した「なぜなら」を置かない）
  rationale: 前節の禁止を受け、その違反者を理由づける接続詞だが、日本語では文脈上明らかであり、独立節として自然に読めるよう無標で訳した。
- source_word: כָּל אֹכֵל
  choice: 食べる者はだれでも
  rationale: 不特定のすべての違反者を指す普遍的な効力を、明瞭な現代日本語で表した。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 祭儀で主に取り分けられる動物の脂肪部分を指すため、平明で一貫性のある語を選んだ。
- source_word: מִן הַבְּהֵמָה
  choice: 家畜
  rationale: この祭儀的文脈では、ささげ物となる飼育動物を指すため、広すぎる「動物」より具体的な「家畜」とした。
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: が取られる
  rationale: 直訳的には「そこから人がささげる」だが、不特定の主語を自然な受動表現にし、その家畜からささげ物の部分が取られるという関係を保持した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭壇の火で焼かれて煙となるささげ物を表す祭儀用語として、意味を狭く「食物」に限定せず訳した。
- source_word: לַיהוָה
  choice: 主への
  rationale: 神名יהוהを日本語聖書で広く理解される「主」とし、前置詞の献呈先を「への」で示した。
- source_word: וְנִכְרְתָה
  choice: 断たれる
  rationale: 契約法における定型的な刑罰表現を保持し、追放・死・神の裁きのいずれかに限定しなかった。
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: その人
  rationale: נֶפֶשׁはこの法的文脈で個々の人を指す。「魂」ではなく自然な「人」とした。
- source_word: מֵעַמֶּיהָ
  choice: 自分の民の中から
  rationale: 接尾辞の文法上の女性形はנֶפֶשׁとの一致であり、違反者の性別を指定しない。日本語では「自分の」により単数の一般的指示を自然に保った。
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָという契約上の刑罰定型句
  choice: 自分の民の中から断たれる
  alternative: 自分の民から追放される／死刑に処される
  rationale: この「断つ」が共同体からの排除、死、神による裁きのどれを具体的に意味するかは確定しないため、原文の法的比喩と解釈上の緊張を保った。
- issue: 違反者を表す文法的性
  choice: その人／自分の民
  alternative: 彼女の民／彼の民
  rationale: 女性形の接尾辞は文法上נֶפֶשׁに一致するもので、女性の違反者だけを指すわけではない。日本語では性別を不必要に補わず、一般的な個人を正確に表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法としての重みを保った。「ささげ物」「断たれる」は聖書的・法的文脈に適した格調を持たせつつ、脚注で意味を明確にした。
