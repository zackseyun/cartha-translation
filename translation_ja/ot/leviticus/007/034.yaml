id: LEV.7.34
reference: Leviticus 7:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: ja
  text: 私は、イスラエルの子らの交わりのいけにえの中から、揺り動かしてささげる胸肉と、取り分けてささげるもも肉を取り、それらを祭司アロンとその子らに、イスラエルの子らから永代にわたって受けるべき定めとして与えたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「交わりのいけにえ」は、「平和のいけにえ」とも訳せる。「揺り動かしてささげる」は祭儀上の「揺祭」を、「取り分けてささげる」は奉納のために取り分けることを表す。
    reason: שְׁלָמִים の訳語上の幅、および תְּנוּפָה と תְּרוּמָה の異なる祭儀表現を示すため。
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 奉献して揺り動かす胸肉
  rationale: חֲזֵה は祭儀で取り分けられる胸部を指す。תְּנוּפָה は奉献の際に揺り動かす祭儀行為を表すため、その動作と奉献の意味が分かる表現にした。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 奉納するもも肉
  rationale: שׁוֹק は脚、特に腿の部分を指し、תְּרוּמָה は取り分けて神にささげる奉納物を表す。現代日本語で理解しやすく、胸肉との祭儀上の区別も保つ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の定型的な契約共同体名を形式的に保った。日本語では『イスラエル人』も可能だが、原文の反復と表現を可視化した。
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: その交わりのいけにえ
  rationale: זֶבַח の犠牲祭儀と、שְׁלָמִים が示す平和・健全・交わりに関わる祭儀区分を自然な日本語で示す。『和解のいけにえ』と限定して解釈することは避けた。
- source_word: לָקַחְתִּי ... וָאֶתֵּן
  choice: 取って、…与えた
  rationale: 完了形による神の確定した措置を、日本語の法令的説明に自然な過去形で表した。
- source_word: לְחָק עוֹלָם
  choice: 永代の定めの分
  rationale: חֹק は定められた規定・取り分の両義をこの文脈で帯びるため、『定めの分』として祭司に帰属する恒久的な権利を表した。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らから受ける
  rationale: 二度目の מֵאֵת が、祭司の取り分をイスラエル共同体から受けることを示すため、日本語で関係が明瞭になるよう補った。
theological_decisions:
- issue: שְׁלָמִים の祭儀名称
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平和のいけにえ
  rationale: 語が示し得る平和、健全、共同の食事という含意を一つの教理的説明へ狭めず、日本語で比較的理解しやすい名称を選んだ。別訳を脚注で示して語義の幅を保った。
- issue: בְּנֵי יִשְׂרָאֵל の共同体名称
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の形式と反復を保ち、契約共同体の定型的名称を集合名詞へ平板化しないようにした。
- issue: לְחָק עוֹלָם の効力
  choice: 永代の定めの分
  alternative: 永久の掟／いつまでも受けるべき分
  rationale: 原文が規定の継続性を述べることをそのまま表し、その後の適用範囲について本文外の神学的判断を加えなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀用語は説明的に訳しつつ、原文の二つの部位と二種類の奉献表現を区別した。理由を示す כִּי は『からである』で保持し、イスラエル共同体への言及の反復も残した。
