source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: ja
  text: 自然に死んだ動物[a]の脂肪や、野獣に裂かれた動物の脂肪は、どのような用途にも使ってよい。しかし、決してそれを食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ネベラー」は、適正に屠られずに死んだ動物を指す。「死んでいるのを見つけた動物」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 犠牲および食物規定における動物の脂を指す標準的で明瞭な表現。
- source_word: נְבֵלָה
  choice: 自然に死んだ動物[a]
  rationale: 適正に屠られずに死んだ動物を指す語であり、本文では平易に表現し、語義の幅を脚注に示した。
- source_word: טְרֵפָה
  choice: 野獣に裂かれた動物
  rationale: 捕食動物に襲われ、裂かれた動物という意味を自然な日本語で示す。
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: どのような用途にも使ってよい
  rationale: 食用以外の実用に用いることを許す文脈上の意味を、現代日本語で明確にした。
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: しかし、決してそれを食べてはならない
  rationale: 不定詞絶対形と定動詞による禁止の強調を「決して」で表した。
theological_decisions: []
