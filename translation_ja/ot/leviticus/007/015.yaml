  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: ja
  text: 感謝の平和のいけにえ[a]の肉は、その供え物を献げる日に食べなければならない。それを少しでも朝まで残してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「感謝のための平和のいけにえ」とも訳せる。
    reason: תּוֹדַת שְׁלָמָיוの構文を、「感謝の」と複合的に表す訳と、「感謝のための」と目的を明示する訳の両方が可能であることを示すため。
lexical_decisions:
- source_word: וּבְשַׂר
  choice: その肉は
  rationale: בשרは「肉」を意味する。日本語では犠牲動物の可食部分を自然かつ明確に表せる。
- source_word: זֶבַח
  choice: 犠牲
  rationale: זבחは屠って献げる犠牲を指す。「いけにえ」と重ねると不自然になりやすいため、構文上は「犠牲の肉」とした。
- source_word: תּוֹדַת
  choice: 感謝のための
  rationale: תודהが示す感謝・感謝奉献という目的を明確にし、このいけにえが感謝を表す種類であることを示す。
- source_word: שְׁלָמָיו
  choice: その人の交わりのいけにえ
  rationale: שלמיםという祭儀上の区分を「交わりのいけにえ」とした。語源的・機能的な含みを一語で確定しすぎないよう、別訳を脚注に示した。本文では所有接尾辞を「その人が」と後続句に反映した。
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: その人がそれを献げる日に
  rationale: 直訳的な名詞表現よりも自然な現代日本語としつつ、三人称男性単数の接尾辞を献げる人への言及として保持した。
- source_word: יֵאָכֵל
  choice: 食べなければならない
  rationale: 受動形の規定的な効力を、現代日本語で明確な義務として表した。
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: その一部も残してはならない
  rationale: 単数主語による禁止を自然な日本語の一般的規定として表し、מִמֶּנּוּが示す「それから少しも」を「その一部も」と明示した。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 時間的限界を簡潔で自然な日本語にした。
theological_decisions:
- issue: שְׁלָמִיםという祭儀区分の訳語
  choice: 交わりのいけにえ
  alternative: 平和のいけにえ／会食のいけにえ
  rationale: 「交わり」はこの犠牲に伴う共同の食事を想起させ、現代日本語で比較的理解しやすい。一方、語を特定の贖罪論や和解論に限定しないようにし、字義寄りの別訳を脚注に残した。
- issue: זֶבַח תּוֹדַת שְׁלָמָיוの構造
  choice: 感謝のための交わりのいけにえとして献げる犠牲
  alternative: 感謝のいけにえである、その人の交わりのいけにえの犠牲
  rationale: 密集した連語を、日本語では「感謝」をשלמיםの下位類型・目的として読める形に整理したが、独立した複数の供え物とは解さなかった。
translation_notes:
  register: 律法の規定としての厳粛さを保ちながら、「食べなければならない」「残してはならない」という明快な現代標準語を用いた。密集したヘブライ語の連語は、意味関係を保って普通の読者が追いやすい語順に整えた。
