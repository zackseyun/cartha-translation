source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: ja
  text: これは、全焼のささげ物、穀物のささげ物、罪のためのささげ物[a]、罪責のささげ物[b]、任職の儀式[c]、および交わりのいけにえ[d]についての規定である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「きよめのささげ物」とも訳せる。ヘブライ語は、罪への対処だけでなく、汚れを除くことを強調する場合もある。
    reason: lexical_alternative
  - marker: b
    text: 「償いのささげ物」とも訳せる。この語は、罪責に伴う賠償責任を強調することがある。
    reason: lexical_alternative
  - marker: c
    text: 「任職のささげ物」または「奉献の儀式」とも訳せる。ヘブライ語は複数形で、祭司を職に就ける一連の手続きを指す。
    reason: lexical_alternative
  - marker: d
    text: 「平和のいけにえ」または「幸いのいけにえ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: これは……についての規定である
  rationale: ここでの תּוֹרָה は各種のささげ物を定める祭儀上の指示を指す。「律法」よりも文脈に即して理解しやすい「規定」とした。
- source_word: לָעֹלָה
  choice: 全焼のささげ物
  rationale: עֹלָה は祭壇で全体を焼いて献げる供え物。「全焼のささげ物」は意味を明確に伝える。
- source_word: לַמִּנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀文脈における מִנְחָה は穀物を用いる供え物を指す。
- source_word: וְלַחַטָּאת
  choice: 罪のためのささげ物
  rationale: חַטָּאת は罪に対処する供え物であると同時に、汚れを除く機能も持つ。本文では自然で伝統的に理解しやすい表現を採用し、浄化の含意を脚注に残した。
- source_word: וְלָאָשָׁם
  choice: 罪責のささげ物
  rationale: אָשָׁם は罪責・賠償責任に関わる供え物を指す。「罪責」によって責任の側面を保ち、賠償の含意は脚注で示した。
- source_word: וְלַמִּלּוּאִים
  choice: 任職の儀式
  rationale: 複数形 מִלּוּאִים は祭司を職に就ける一連の奉献・任職手続きを指すため、単一の供え物に限定しなかった。
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: זֶבַח の「いけにえ」を明示し、שְׁלָמִים が含む神との平和・交わり・幸いの側面のうち、共同の食事を伴う祭儀として理解しやすい「交わり」を本文に採用した。
theological_decisions:
- issue: חַטָּאת が罪への対処を表すか、汚れの除去を強調するか
  choice: 本文を「罪のためのささげ物」とする
  alternative: 「きよめのささげ物」
  rationale: 語の両面を一方に限定せず、一般読者に分かりやすい表現を本文に置き、浄化の機能を脚注で保存した。
- issue: מִלּוּאִים を供え物一件と見るか任職手続き全体と見るか
  choice: 「任職の儀式」
  alternative: 「任職のささげ物」または「奉献の儀式」
  rationale: ヘブライ語が複数形であり、祭司就任の一連の手続きを指し得るため、意味を単一の供え物に狭めなかった。
- issue: שְׁלָמִים の訳語
  choice: 「交わりのいけにえ」
  alternative: 「和解のいけにえ」または「幸いのいけにえ」
  rationale: 語には平和、健全、共同の交わりという幅がある。本文では祭儀の共同性を伝え、他の含意は脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、祭儀用語には「ささげ物」と「いけにえ」を文脈に応じて使い分けた。列挙のリズムを保ちつつ、「についての規定」で冒頭の要約文として自然に整えた。
