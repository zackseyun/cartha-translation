  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: ja
  text: その中から、ささげ物の種類ごとに一つずつを、主への奉納物[a]として差し出さなければならない。それは、交わりのいけにえ[c]の血を振りかける[b]祭司のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奉納物」は、主のために取り分けられ、祭司に与えられる分を指す。別訳「主への取り分」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「投げかける」。原語は、いけにえの血を勢いよく施す祭儀上の動作を表す。
    reason: lexical_alternative
  - marker: c
    text: 「交わりのいけにえ」は、「平安のいけにえ」「和解のいけにえ」「会食のいけにえ」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 差し出さなければならない
  rationale: ヒフィル形の「近づける、ささげる」を祭儀の文脈に即して自然な義務表現で訳した。
- source_word: מִמֶּנּוּ
  choice: その中から
  rationale: 直前に述べられた感謝のいけにえに伴う一連のパンを集合的に受ける。日本語では「その中から」が自然である。
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: ささげ物の種類ごとに一つずつ
  rationale: 「あらゆるささげ物から一つ」という分配的意味を明確にし、前節の各種のパンから一個ずつ取ることを表す。
- source_word: תְּרוּמָה
  choice: 奉納物
  rationale: 主のために取り分けられ、祭司に割り当てられる物を指す。「奉納物」は現代日本語で理解しやすく、特定の持ち上げる動作を本文に読み込まない。
- source_word: לַיהוָה
  choice: 主への
  rationale: 神名יהוהは日本語聖書で広く認識される「主」とし、献納の向きを助詞「へ」で示した。
- source_word: הַזֹּרֵק
  choice: 祭壇に振りかける
  rationale: זרקは祭儀では血を投げかける、振りかける動作を指す。日本語として自然な「振りかける」を採り、文脈上の到達点である祭壇を補って誤解を避けた。
- source_word: דַּם הַשְּׁלָמִים
  choice: 会食のいけにえの血
  rationale: שלמיםは神との平和・交わりと共同の食事を伴う祭儀カテゴリーである。「会食のいけにえ」は機能を分かりやすく示すが、別訳を脚注に掲げて語義の幅を保つ。
- source_word: לוֹ יִהְיֶה
  choice: その祭司のものとなる
  rationale: 祭司への法的な帰属・割り当てを明瞭な現代日本語で表した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語本文では伝統的かつ広く理解される「主」を用いる一方、特定の発音を本文で断定しない。
- issue: שְׁלָמִיםの訳語
  choice: 会食のいけにえ
  alternative: 和解のいけにえ／交わりのいけにえ／平安のいけにえ
  rationale: この祭儀の共同飲食の性格を読者に伝える訳を採った。ただし原語には平和、充足、交わりに関わる幅があるため、脚注で主要な別訳を示す。
- issue: זרקの祭儀動作
  choice: 祭壇に振りかける
  alternative: 祭壇に投げかける／注ぎかける
  rationale: 血を祭壇へ勢いを伴って施す動作であり、単なる微細な散布とも注入とも断定しにくい。本文は自然さを優先し、脚注で別訳を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法上の命令は「なければならない」で示した。祭儀用語は過度に古風な専門語を避けつつ、脚注で原語の幅と主要な別訳を提示した。
