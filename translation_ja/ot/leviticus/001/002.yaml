reference: Leviticus 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: ja
  text: 「イスラエルの子ら[a]に告げ、彼らに言いなさい。『あなたがたのうちの一人[b]がヤハウェにささげ物を持って来るときは、家畜、すなわち牛の群れまたは羊ややぎの群れから、あなたがたのささげ物を持って来なさい[c]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの民」「イスラエル人」。直訳は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「人」（アダム）。ここでは、あなたがたのうちの「だれか」を代表的に指す。
    reason: lexical_alternative
  - marker: c
    text: 原文は、初めの「一人が……持って来る」では単数形を用い、ここでは共同体に向けた複数形の命令に移る。
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の定型的な呼びかけを保った。現代日本語では「イスラエルの民」も自然だが、本文では原文の比喩的・系譜的表現を残し、別訳を脚注に示した。
- source_word: אָדָם ... מִכֶּם
  choice: あなたがたのうちの一人
  rationale: אָדָם はここで個別事例を導入し、共同体に属する一人を代表的に指す。日本語の「一人」は性別を不必要に限定せず、מִכֶּם の部分を表す。
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: 持って来る／持って来なさい
  rationale: 犠牲奉献の文脈で、קרב のヒフィル形が表す「近くへ持って来る、差し出す」という具体的な動きを自然な日本語で示した。
- source_word: קָרְבָּן
  choice: ささげ物
  rationale: 犠牲だけに限定されない、神の前に携えて来る品を広く指す語として採用した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 原文の固有の神名 יהוה を称号に置き換えず、一般的な日本語音写で示した。
- source_word: הַבְּהֵמָה
  choice: 家畜
  rationale: ここでは奉献に用いる飼育動物の上位区分を指すため、「動物」より限定的で自然な「家畜」とした。
- source_word: הַבָּקָר
  choice: 牛の群れ
  rationale: 大型家畜、とりわけ牛類を指す集合名詞であることを表した。
- source_word: הַצֹּאן
  choice: 羊ややぎの群れ
  rationale: 羊とやぎを含み得る小型家畜の集合名詞なので、単なる「羊」より範囲が明確になるよう訳した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／主なる神
  rationale: 本文に固有名が明記されているため、その区別を保った。母音の復元には歴史上の不確実性があるが、「ヤハウェ」は現代の学術的・日本語的慣用に沿う。
- issue: אָדָם の代表的用法
  choice: 一人
  alternative: 男／だれか／人
  rationale: この語はここで男性だけを明示的に限定するよりも、イスラエル共同体から奉献する個人を代表的に導入している。「一人」はその単数性と代表性を保つ。
- issue: 単数の事例導入から複数の命令への移行
  choice: 一人が……あなたがたのささげ物を持って来なさい
  alternative: だれかが……その人はささげ物を持って来なさい
  rationale: 原文が אָדָם／יַקְרִיב の単数から תַּקְרִיבוּ／קָרְבַּנְכֶם の複数へ移る緊張を平準化せず保持した。
translation_notes:
  register: 律法の告知にふさわしい端正さを保ちつつ、現代の一般読者が理解できる語順と語彙を用いた。「イスラエルの子ら」は原文の定型句を意識したやや荘重な表現。「ささげ物」「持って来る」は祭儀的意味と具体的動作の双方を伝える。
