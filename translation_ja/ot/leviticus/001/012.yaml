  source_fidelity: 全体として、動物を切り分け、頭と脂肪を含む部分を祭司が祭壇の火の上の薪に整えて置く、というヘブライ語の手順をよく伝えている。もっとも、現行の「祭壇の上の火に載せた薪」は、薪を火に『載せた』という完了した人為的動作をやや強く示し、原文の二重の位置関係（薪が火の上にあり、火が祭壇の上にある）を直接には表していない。
