base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: ja
  text: そして、その人はそれを各部分に切り分け、その頭と脂肪[a]とともに、祭司はそれらを、祭壇の上の火の上にある薪の上に並べる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「脂身」、または「内臓を覆う脂肪」とも訳せる。ヘブライ語は、犠牲動物に付随する脂肪組織を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: それを各部分に切り分け
  rationale: 犠牲動物を所定の部分に解体する祭儀上の動作を、現代日本語で自然かつ具体的に表した。
- source_word: רֹאשׁוֹ
  choice: その頭
  rationale: 犠牲動物の頭を指す直接的な解剖学的表現。
- source_word: פִּדְרוֹ
  choice: 脂肪
  rationale: 犠牲動物に付随する脂肪組織を指す語。本文では簡潔で広義の「脂肪」とし、より限定的な理解は脚注に残した。
- source_word: וְעָרַךְ
  choice: 並べる
  rationale: 祭儀において整えて配置する動作を、明瞭な現代日本語で表した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: レビ記の祭儀法における כהן の標準的な訳語。
- source_word: עַל הָעֵצִים
  choice: 薪の上に
  rationale: 祭壇の火に用いる複数の木材を、日本語で自然な集合表現「薪」とした。
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 祭壇の上の火に載せた
  rationale: ヘブライ語の重層的な位置関係、すなわち祭壇上の火と、その火に載る薪を、意味関係が明瞭になる日本語で保持した。
