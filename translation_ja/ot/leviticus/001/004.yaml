source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: ja
  text: その人は全焼のささげ物の頭に手を置く。すると、そのささげ物はその人のために受け入れられ、その人のために贖いを行う[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すると、その人は受け入れられ、その人のために贖いを行う」。ヘブライ語の受動形は男性単数であり、女性名詞の「全焼のささげ物」ではなく、献げる人を指すと理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 手を置く
  rationale: 犠牲に手を当てる祭儀的行為を、力の込め方を過度に限定せず自然な現代日本語で表す。
- source_word: יָדוֹ
  choice: 手
  rationale: ヘブライ語の単数形を保つ。主語との関係は日本語では文脈上明白なため、「自分の」を補わない。
- source_word: עַל רֹאשׁ
  choice: 頭に
  rationale: 手を置く対象となる部位を自然な日本語で直接表す。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: 動物を祭壇で全焼させる עֹלָה の祭儀的内容を、語源的な「上るもの」ではなく一般読者にも分かる形で示す。
- source_word: וְנִרְצָה
  choice: 受け入れられる
  rationale: ニファル形の受動的意味を保つ。本文では直前の全焼のささげ物を主語として理解するが、人が受け入れられる可能性は脚注に残す。
- source_word: לוֹ
  choice: その人のための
  rationale: ささげ物が献げる人の益となる関係を表し、後続する贖いとの結びつきを自然に示す。
- source_word: לְכַפֵּר
  choice: 贖いをするものとして
  rationale: כפר の祭儀的・神学的重みを保ちつつ、特定の贖罪理論に限定しない。目的・結果を示す לְ を日本語として滑らかに表す。
- source_word: עָלָיו
  choice: その人のための
  rationale: 贖いが献げる人のためになされることを示す。לוֹ と重なる受益関係は、日本語では一つの句にまとめて自然に表現する。
theological_decisions:
- issue: וְנִרְצָה の主語・適用対象
  choice: 本文では、全焼のささげ物が受け入れられるとする
  alternative: 献げる人が受け入れられる
  rationale: 直前の祭儀的対象である全焼のささげ物を受けるのが文脈上自然である。ただし、ヘブライ語の男性単数受動形は献げる人に直接関係づける理解も許すため、脚注で明示する。
- issue: כפר の神学的含意
  choice: 贖いをする
  alternative: 償いをする／罪を覆う
  rationale: 祭儀用語としての広がりを保ち、作用の仕組みを特定の教理的説明に狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」ではなく文脈上の祭儀参加者を「その人」とし、「燔祭」のような古風な専門語を避けて「全焼のささげ物」とした。原文の二つの受益表現 לוֹ／עָלָיו は、冗長な反復を避けつつ意味を失わないよう日本語で統合した。
