base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: ja
  text: 祭司は、その鳥の餌袋[a]を羽毛[b]とともに取り除き、それを祭壇のそば、東側にある灰を置く場所へ投げ捨てる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 鳥の「餌袋」は、食べた物を一時的に蓄える器官で、「嗉嚢（そのう）」ともいう。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は直訳すると「その羽毛とともに」。この語句を「その汚物とともに」と理解する訳もある。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: 取り除き
  rationale: 使役形の意味を保ちつつ、祭儀の手順を示す自然な現代日本語とした。
- source_word: מֻרְאָתוֹ
  choice: その鳥の餌袋
  rationale: 鳥の消化器官である嗉嚢を指す。一般読者に分かりやすい「餌袋」を本文に用い、専門的名称は注で示した。
- source_word: בְּנֹצָתָהּ
  choice: 羽毛とともに
  rationale: 子音本文を נוצה（羽、羽毛）と結びつける素直な理解を採用した。ただし語句には解釈上の難しさがあるため、別解を注記した。
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: それを……投げ捨てる
  rationale: שלך の使役形が表す直接的な動作を自然に訳した。「それ」は取り除いた餌袋と羽毛を一まとまりとして受ける。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 祭壇のそば
  rationale: אֵצֶל の近接・側方という空間的意味を簡潔に表した。
- source_word: קֵדְמָה
  choice: 東側にある
  rationale: 方向を示す語を、灰の場所が祭壇の東側にあることが明確になるように表現した。
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: 灰の場所へ
  rationale: 祭壇から取り除かれる灰を置く所を指す。本文以上に「灰捨て場」「脂肪を含む灰」などと限定しなかった。
