id: LEV.1.10
reference: Leviticus 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: ja
  text: また、もしその人のささげ物が、全焼のささげ物[a]として群れのうち、羊またはやぎから選ぶものであるなら、傷のない[b]雄をささげなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「全焼のささげ物として」。
    reason: lexical_alternative
  - marker: b
    text: 「傷のない」とは、この犠牲に求められた、身体に欠陥がない状態をいう。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: また、もし
  rationale: 接続詞וְと条件を表すאִםを保ち、祭儀規定の次の事例を自然な現代日本語で導入する。
- source_word: מִן הַצֹּאן
  choice: 群れの中から
  rationale: צֹאןは主に羊とやぎからなる小家畜の群れを指す集合語であり、後続句がその内訳を明示するため、ここでは「群れ」とした。
- source_word: קָרְבָּנוֹ
  choice: その人のささげ物
  rationale: קָרְבָּןは礼拝において差し出す物を指す。「ささげ物」は祭儀的意味を明確かつ平易に伝え、接尾辞の三人称男性単数も「その人の」で示す。
- source_word: מִן הַכְּשָׂבִים אֹו מִן הָעִזִּים
  choice: すなわち羊かやぎの中から
  rationale: 二種類の小家畜を選択肢として示す原文を保つ。כְּשָׂבִיםを年齢の限定された「子羊」とせず、広い分類である「羊」と訳した。
- source_word: לְעֹלָה
  choice: 全焼のささげ物
  rationale: עֹלָהは祭壇上で全体を焼く特定のささげ物を指す。語源的な「上るもの」よりも、祭儀上の種類が一般読者に伝わる表現を選んだ。
- source_word: זָכָר
  choice: 雄
  rationale: 犠牲動物の性別を明示する原文の要件をそのまま保つ。
- source_word: תָּמִים
  choice: 傷のない
  rationale: 祭儀文脈では身体的な欠陥のない状態を指すため、抽象的な「完全な」ではなく具体的で自然な表現とした。
- source_word: יַקְרִיבֶנּוּ
  choice: ささげなければならない
  rationale: קרבのヒフィル形が祭儀文脈で表す「差し出す、ささげる」という意味と、規定としての指示の力を明瞭に表した。目的語は直前の「雄」によって日本語では十分明らかなため、重複する代名詞を置かなかった。
theological_decisions:
- issue: עֹלָהという祭儀用語の訳し方
  choice: 全焼のささげ物
  alternative: 上るささげ物／焼き尽くすささげ物
  rationale: 語源的には「上るもの」と関連するが、ここではレビ記の定まった犠牲の種類を指す。「全焼のささげ物」は、特定の神学的解釈を加えず、祭儀上の実態を明確に伝える。
- issue: 犠牲動物の性別要件
  choice: 雄
  alternative: 性別を明示しない表現
  rationale: 原文のזָכָרは動物が雄であることを明示しており、祭儀上の要件なので省略しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい端正さを保った。「いけにえ」より広い原語קָרְבָּןには「ささげ物」を用い、原文の「群れ」と「羊かやぎ」という総称と内訳の関係も残した。
