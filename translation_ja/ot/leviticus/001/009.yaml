source:
  edition: WLC
  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: ja
  text: その人は、その内臓と脚を水で洗う。祭司は、そのすべてを祭壇の上で焼いて煙にする。それは、全焼のささげ物、火によるささげ物[a]、ヤハウェに喜ばれる香り[b]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物のささげ物」。ヘブライ語の語は、「火によるささげ物」とも、祭壇の火によって神に差し出される「食物のささげ物」とも理解される。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「ヤハウェへの安らぎの香り」。供え物が神に喜ばれ、受け入れられることを示す祭儀上の定型表現。
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: その内臓
  rationale: 祭儀の文脈では、動物の体内の部分、特に内臓を指す。「内なる部分」より具体的で、洗うという動作にも自然に合う。
- source_word: כְרָעָיו
  choice: その脚
  rationale: 動物の下肢を指す。専門的な「すね」よりも、現代の一般読者に明瞭な「脚」とした。
- source_word: יִרְחַץ בַּמָּיִם
  choice: 水で洗う
  rationale: 動作と手段を自然な現代日本語で表した。動詞の三人称単数は前文脈の奉献者を指すため、「その人は」と明示した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 単に燃やすことではなく、祭壇でささげ物を煙として立ち上らせる祭儀的動作を表す。
- source_word: אֶת־הַכֹּל
  choice: そのすべて
  rationale: 整えられた動物の全体がささげられるという総体性を保持した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を、日本語の祭儀文脈で自然な場所表現として訳した。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 動物全体を祭壇で焼くこの供犠の性質が一般読者にも分かる定訳的表現を用いた。
- source_word: אִשֵּׁה
  choice: 火によるささげ物
  rationale: 語義には議論があるため、本文では伝統的かつ形態上分かりやすい「火によるささげ物」とし、「食物のささげ物」という理解を脚注に残した。
- source_word: רֵיחַ נִיחוֹחַ
  choice: 喜ばせる香り
  rationale: 神に受け入れられる供犠を表す定型的な比喩を、過度に説明せず自然な日本語で保持した。
- source_word: לַיהוָה
  choice: ヤハウェを
  rationale: 神名を固有名として音写し、לְが示す、この香りがヤハウェにとって喜ばしいという関係を日本語の目的語構文で表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の神名を見える形で保持する。日本語で広く用いられる音写「ヤハウェ」を採用した。
- issue: אִשֵּׁה の意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 「火による供物」とする伝統的理解と、祭儀における神への食物の贈り物とする語義理解の双方がある。本文で一方を明示しつつ、もう一方を脚注で保存した。
- issue: רֵיחַ נִיחוֹחַ の祭儀的比喩
  choice: ヤハウェを喜ばせる香り
  alternative: ヤハウェへの芳しい香り
  rationale: 香りという原文の比喩を保持しながら、この定型句が供え物の受容・好意を示すことを自然に伝えた。神の嗅覚についての機械的な説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ささげ物」はひらがなを用いて一般読者への可読性を確保した。原文の動作主体の交替を「その人は」「祭司は」で明示し、後半の同格的な祭儀用語の連なりは短い二文に分けて読みやすくした。
