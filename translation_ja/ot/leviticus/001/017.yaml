  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ja
  text: その鳥を翼のところから裂いて開くが、切り離してはならない。祭司はそれを祭壇の上で、火の上にある薪の上で焼いて煙にする。これは全焼のささげ物、火によるささげ物[a]、ヤハウェに喜ばれる香りである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「食物のささげ物」。
    reason: אִשֶּׁה は「火によるささげ物」と理解されることが多いが、「食物のささげ物」とする語義分析もあるため。
lexical_decisions:
- source_word: שִׁסַּע אֹתוֹ בִכְנָפָיו
  choice: その鳥を翼のところで引き裂いて開く
  rationale: שׁסע は裂く、切り開く動作を表し、続く「切り離してはならない」と対になる。「翼のところで」は ב の場所・手段の幅を保ちつつ、日本語で具体的な処置を自然に伝える。
- source_word: לֹא יַבְדִּיל
  choice: 切り離してはならない
  rationale: בדל の使役形が表す分離を明確にし、鳥を開いても二つに完全分離しないという対照を示す。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 祭儀用語として、単に焼くことだけでなく、祭壇で焼いて煙を立ち上らせる動作を表す。
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: 祭壇の火の上にある薪の上で
  rationale: 原文で反復される עַל と、火・薪・供え物の位置関係を、日本語として理解可能な形で保つ。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 供え物全体を祭壇で焼く祭儀上の意味を明示し、日本語で「焼き尽くす」行為との不要な混同を避ける。
- source_word: אִשֵּׁה
  choice: 火によるささげ物
  rationale: 火を用いて献げる供え物という伝統的かつ文脈に適した理解を本文に採用し、語源・意味をめぐる別理解は脚注に残す。
- source_word: רֵיחַ נִיחֹחַ
  choice: 芳しい香り
  rationale: 犠牲の香りが神に受け入れられることを示す定型表現を、比喩を保ちながら簡潔で格調ある現代日本語にした。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 神名 יהוה を称号に置き換えず固有名として示し、前置詞 ל の方向・帰属を「への」で表す。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を見える形で保ち、称号への置換によって本文上の区別を失わせない。
- issue: אִשֵּׁה の意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 祭壇の火で焼く直前の文脈に合う読みを本文とする一方、語の由来と意味には議論があるため、食物・供物と理解する可能性を脚注に明記した。
- issue: רֵיחַ נִיחֹחַ の祭儀的含意
  choice: 芳しい香り
  alternative: なだめの香り
  rationale: 神が犠牲を喜んで受け入れるという含意を保ちつつ、「なだめ」によって本文以上の贖罪論的説明を持ち込まない。
translation_notes:
  register: 明快な現代標準語を用いながら、祭儀本文にふさわしい簡潔さと格調を保った。「鳥」は直前の文脈から補って指示対象を自然に示し、祭儀用語は過度に専門的にならない表現とした。
