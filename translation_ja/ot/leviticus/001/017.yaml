revisions:
- from: その鳥を翼のところで引き裂いて開くが、切り離してはならない。祭司はそれを、祭壇の火の上にある薪の上で焼いて煙にする。これは全焼のささげ物、ヤハウェへの火によるささげ物[a]であり、芳しい香りである。
  to: その鳥を翼のところから裂いて開くが、切り離してはならない。祭司はそれを祭壇の上で、火の上にある薪の上で焼いて煙にする。これは全焼のささげ物、火によるささげ物[a]、ヤハウェに喜ばれる香りである。
  rationale: 原文の祭儀的定型句における לַיהוָה の係り方を明示し、「喜ばれる香り」がヤハウェへの受容を表すことを保持した。また、翼に関する動作表現と、祭壇・薪・火の位置関係を現代日本語としてより自然かつ明瞭に整えた。
  reviewer_model: gpt-5.6-terra
