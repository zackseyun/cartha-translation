  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: ja
  text: 次に、その人は全焼のささげ物の皮をはいで、それを部分ごとに切り分ける。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: 皮をはいで
  rationale: ヒフィル形は、いけにえの動物から皮を取り除く具体的な動作を表す。「皮をはぐ」よりも活用上自然な「皮をはいで」とし、現代日本語で明確にした。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: レビ記におけるעֹלָהは、祭壇で全体を焼くささげ物を指す。語源的な「上るもの」ではなく、儀礼上の意味を明確に伝える定訳性のある表現を採った。
- source_word: וְנִתַּח
  choice: 切り分ける
  rationale: 祭儀のために動物を複数の部分へ分割する意味。「切る」だけでは結果が曖昧になりうるため、後続句と合わせて自然な「切り分ける」とした。
- source_word: לִנְתָחֶיהָ
  choice: 各部分に
  rationale: 名詞נֵתַחは切り分けられた部分・区分を指す。接頭辞לְの結果的・配分的な意味を、「各部分に」で簡潔に表した。
- source_word: וְ
  choice: 次に
  rationale: 前節から続く祭儀手順の順序を示す接続として、単なる「そして」より自然で明瞭な「次に」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ礼節ある祭儀文体。「その人」は直前の行為者を受け、原文の三人称単数を保持する。「各部分に切り分ける」により原文の字義を自然に示せるため、英語版の補足脚注は日本語では不要と判断した。
