id: LEV.1.3
reference: Leviticus 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: ja
  text: 'もしその人のささげ物が牛の群れからの全焼のささげ物なら、傷のない雄をささげなければならない。それを会見の天幕の入口で、ヤハウェの前に受け入れられるために[a]差し出さなければならない。


    [a] 別訳「自ら進んで、それをヤハウェの前に差し出さなければならない」。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自ら進んで、それをヤハウェの前に差し出さなければならない」。
    reason: לִרְצֹנוֹは祭儀的な受容を指すとも、ささげる人の自発性を指すとも解されてきたため。
lexical_decisions:
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 祭壇で全体を焼いて煙として立ち上らせる犠牲を指すレビ記の祭儀用語。現代の一般読者にも内容が伝わる定訳的な表現を採った。
- source_word: קָרְבָּנוֹ
  choice: その人のささげ物
  rationale: 神のもとへ携えて来る供え物を表す一般的な祭儀用語。日本語では文脈に即して「ささげ物」が自然である。
- source_word: מִן הַבָּקָר
  choice: 牛の中から取る
  rationale: בקרは羊や山羊と対照される牛類を指す。「牛の中から」により供犠動物の区分を明確にした。
- source_word: זָכָר תָּמִים
  choice: 傷のない雄
  rationale: 供犠動物に求められる性別と、身体的欠陥がないという条件を簡潔かつ明確に表した。
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: ささげなければならない／それを差し出さなければならない
  rationale: קרבのヒフィル形は祭儀文脈で供え物を神前に携え出すことを指す。反復を日本語として自然にしつつ、二つの動詞を訳出した。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口
  rationale: イスラエルの聖所を表す定型句を、構造に忠実で理解可能な日本語にした。
- source_word: לִרְצֹנוֹ
  choice: 受け入れられるために
  rationale: 祭儀的な受容・好意を表す可能性を本文に採用した。誰または何が受け入れられるかは日本語でも明示せず、原文の含みを保った。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在の前という意味を自然に表し、固有の神名יהוהは「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の契約名が記されているため、称号に置き換えず音写した。
- issue: לִרְצֹנוֹの解釈
  choice: ヤハウェの前で受け入れられるために
  alternative: 自ら進んで、ヤハウェの前に
  rationale: 祭儀的に受け入れられるという解釈を本文に置きつつ、古くからある自発性の解釈を脚注に残し、原文の解釈上の緊張を隠さなかった。
- issue: 受け入れられる主体または対象
  choice: 明示しない
  alternative: ささげる人が受け入れられる／ささげ物が受け入れられる
  rationale: לִרְצֹנוֹは「彼の受容のために」と理解できるが、受け入れられるものを日本語本文で一義的に限定せず、原文の簡潔さと曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。祭儀用語は過度に専門的にせず、「全焼のささげ物」「会見の天幕」のような一貫性のある表現を用いた。義務を示す未完了形は「なければならない」で表した。
