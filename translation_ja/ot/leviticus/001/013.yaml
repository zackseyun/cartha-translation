id: LEV.1.13
reference: Leviticus 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ja
  text: 内臓と脚を水で洗う。祭司はそのすべてを献げ、祭壇の上で焼いて煙にする。これは主への全焼のささげ物、火によるささげ物[a]、主に喜ばれる香りである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物のささげ物」。
    reason: אִשֵּׁהは通常、火によって献げる物を指すが、神への「食物」という祭儀的理解を反映する訳もある。
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: 内臓
  rationale: 犠牲動物の体内の部分を指すため、具体的で現代日本語として自然な「内臓」とした。
- source_word: הַכְּרָעַיִם
  choice: 脚
  rationale: 犠牲動物の脚、特に下肢を指す。文脈上明瞭で簡潔な「脚」とした。
- source_word: יִרְחַץ בַּמָּיִם
  choice: 水で洗う
  rationale: רחץの基本義「洗う」と、手段を示す「水で」を明示した。ヘブライ語では主語が明示されないため、日本語でも補わなかった。
- source_word: וְהִקְרִיב
  choice: 献げ
  rationale: 祭儀における「近づける、差し出す」の意味を表し、後続の焼却行為と区別するため「献げる」とした。
- source_word: אֶת־הַכֹּל
  choice: そのすべて
  rationale: 整えられた犠牲全体を余すところなく指す表現として、原文の全体性を保った。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 単なる「焼く」ではなく、祭壇で焼いて煙として立ち上らせる祭儀的な含意を明示した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 動作の場所を自然な現代日本語で示した。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 犠牲全体を祭壇で焼く祭儀の名称として内容が分かりやすく、用語上の区別も保てる表現を採用した。
- source_word: אִשֵּׁה
  choice: 火によるささげ物
  rationale: 語の火に関する意味を直接保ちつつ、祭儀用語として理解できる表現にした。語義には議論があるため脚注で別案を示した。
- source_word: רֵיחַ נִיחֹחַ
  choice: 喜ばしい香り
  rationale: 神に受け入れられるささげ物を感覚的比喩で表す原文を、過度に説明せず自然な日本語で保持した。
- source_word: לַיהוָה
  choice: 主への
  rationale: 神名יהוהを、日本語聖書で広く通用する敬称「主」で表した。
theological_decisions:
- issue: רֵיחַ נִיחֹחַにおける神についての感覚的・擬人的表現
  choice: 喜ばしい香り
  alternative: なだめの香り／心地よい香り
  rationale: 犠牲が神に受け入れられることを示す祭儀的比喩を保持し、神の身体性について説明を加えて緊張を解消することを避けた。
- issue: אִשֵּׁהの意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 原語の火との明白な関連を本文に残した。「食物のささげ物」という理解もあり得るため、脚注で提示した。
- issue: יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語で自然かつ尊厳ある慣用表現を採用したが、固有名として音写する選択肢も認められる。
translation_notes:
  register: 明瞭で現代的ながら、祭儀本文にふさわしい簡潔で格調ある文体とした。「しかし」は前節との手順上の対照・継続を示す。原文で洗う行為の主語が明示されていないため、日本語でも主語を補わず曖昧さを保った。英語相談層の脚注位置には内容との不整合があるため、אִשֵּׁהに対応する箇所へ適切に配置した。
