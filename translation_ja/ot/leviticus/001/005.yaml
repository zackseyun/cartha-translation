id: LEV.1.5
reference: Leviticus 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: ja
  text: 彼はその若い雄牛[a]をヤハウェの前で屠る。祭司であるアロンの子らは、その血を差し出し、会見の天幕の入り口にある祭壇の周囲に、その血を投げかける[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「牛の群れの子」。牛を指す慣用表現で、ここでは「若い雄牛」と訳した。
    reason: lexical_alternative
  - marker: b
    text: 「投げつける」「勢いよくかける」とも訳せる。ヘブライ語の動詞は、儀礼の中で血を投げるようにして施すことを表す。伝統的には「振りかける」と訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 屠る
  rationale: いけにえの動物を儀礼的に殺す行為を、単なる「殺す」より正確かつ簡潔に表す。手順を述べる文脈なので、日本語では非過去形を用いた。
- source_word: בֶּן הַבָּקָר
  choice: 若い雄牛
  rationale: 字義的には「牛の群れの子」だが、牛を指す慣用表現であり、この奉献物の文脈では「若い雄牛」が自然で分かりやすい。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在する儀礼空間を示す表現を簡潔に保ち、神名יהוהは固有名として音写した。
- source_word: וְהִקְרִיבוּ
  choice: 差し出し
  rationale: קרבのヒフィル形が示す「近くへ持って来る／提示する」という動作を、目的語が血であることに即して表した。「ささげる」よりも、この段階での祭司による血の取り扱いが明確になる。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 祭司であるアロンの子ら
  rationale: 家系上の呼称と、それを説明する祭司職の同格関係を自然な日本語で保持した。
- source_word: וְזָרְקוּ
  choice: 投げかける
  rationale: זרקの基本的な「投げる、放つ」という力のある動作を保ちつつ、血を祭壇に適用する儀礼として自然な日本語にした。「振りかける」だけでは動作が弱く見える可能性がある。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の周囲に
  rationale: 血が祭壇の周囲の面に施されることを簡潔に表す。日本語では動詞「投げかける」と組み合わせることで、祭壇に向けた適用を示した。
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口にある
  rationale: 関係節が祭壇の位置を特定していることを、修飾関係の明瞭な日本語で表した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 「会見」と「天幕」という構成要素を透明に示し、後代の建築的な連想を過度に持ち込まない訳語とした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文に固有の神名יהוהが明記されているため、その契約上の名を隠さず日本語で音写した。
- issue: 血を祭壇に施す動作の強さ
  choice: 投げかける
  alternative: 振りかける／注ぎかける
  rationale: זרקが表す投げるような動作を保持し、単なる軽い散布や注ぐ行為へ限定しないようにした。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調を保った祭儀手順の文体とした。「屠る」「会見の天幕」は文脈上必要な聖書語彙として用い、文構造は過度に古風にしなかった。英語相談層では脚注記号と内容にずれが見られたため、原語上の対象に合わせて「若い雄牛」に[a]、「投げかける」に[b]を付した。
