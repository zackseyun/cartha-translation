id: LEV.1.14
reference: Leviticus 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: ja
  text: また、鳥を用いる焼き尽くすささげ物をヤハウェにささげる場合は、山鳩または家鳩のひなの中から、自分のささげ物を差し出さなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: また、…場合は
  rationale: 接続詞を伴う条件節で、前の規定に続く別の場合を導入する。日本語では「また、…場合は」として談話の連続性と条件関係を自然に示した。
- source_word: מִן הָעוֹף
  choice: 鳥の中から
  rationale: עוֹףはここでは供え物に用いる鳥類を指す。選択範囲を示す前置詞מִןも反映した。
- source_word: עֹלָה
  choice: 焼き尽くすささげ物
  rationale: 全体を祭壇で焼く祭儀上の種類を表す語であり、現代日本語で内容を理解しやすい定訳とした。
- source_word: קָרְבָּנוֹ
  choice: 自分のささげ物
  rationale: קָרְבָּןは神の前に携えて来る供え物を指す。三人称男性単数接尾辞は、一般的な規定の主体を受けて自然な「自分の」とした。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞לはささげ物の向け先を表し、神名יהוהは固有名として「ヤハウェ」と音写した。
- source_word: וְהִקְרִיב
  choice: 差し出さなければならない
  rationale: קרבのヒフィル形は祭儀において近づける、差し出すことを表す。規定文としての指示の力を日本語の義務表現で示した。
- source_word: מִן הַתֹּרִים
  choice: 山鳩…の中から
  rationale: תּוֹרはキジバト類の鳥を指す。日本語の聖書・祭儀文脈で理解されやすい「山鳩」を採用した。
- source_word: אוֹ
  choice: または
  rationale: 許される二種類の鳥を結ぶ選択の接続詞として訳した。
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: 家鳩のひなの中から
  rationale: 直訳的には「鳩の子ら」で、祭儀用語として若い家鳩を指す。成鳥の山鳩との表現上の違いも保った。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の神名が明記されているため、称号に置き換えず、日本語で一般的な学術的音写を用いた。
- issue: עֹלָהの祭儀的意味
  choice: 焼き尽くすささげ物
  alternative: 全焼のいけにえ／上るささげ物
  rationale: 語源上の「上る」という含みを一義的に本文へ持ち込まず、レビ記における具体的な祭儀区分を明瞭に表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法規定にふさわしい端正な文体と、原文の条件構文および選択範囲を保った。
