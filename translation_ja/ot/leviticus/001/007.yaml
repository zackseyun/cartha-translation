  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: ja
  text: 祭司アロンの子らは、祭壇の上に火を置き、その火の上に薪を並べる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: 置き
  rationale: נתןの基本義「置く」を採り、祭儀の手順として火を祭壇に置く動作を自然な現代日本語で表した。文脈上の指示・規定の力は、節全体の「並べる」という叙述的な規定文で示した。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの子ら
  rationale: הַכֹּהֵןは直前の固有名アロンを同格的に限定すると理解し、「祭司アロン」とした。בְּנֵיは複数を明示するため「子ら」とした。
- source_word: אֵשׁ
  choice: 火
  rationale: いけにえの手順における文字どおりの火を指すため、簡潔に「火」とした。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇の上に
  rationale: 空間的な配置を明確にしつつ、自然な日本語となるよう「祭壇の上に」とした。
- source_word: וְעָרְכוּ
  choice: 並べる
  rationale: ערךが表す「秩序立てて配置する」という祭儀上の意味を、分かりやすく簡潔な「並べる」で表した。
- source_word: עֵצִים
  choice: 薪
  rationale: 語自体は「木材」の複数だが、祭壇の火に載せる燃料という文脈から、現代日本語で自然かつ具体的な「薪」とした。
- source_word: עַל הָאֵשׁ
  choice: その火の上に
  rationale: ヘブライ語の反復を保ちながら、日本語では先行する火を受ける「その」を補って指示関係を明確にした。
