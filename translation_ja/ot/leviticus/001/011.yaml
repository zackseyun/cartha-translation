  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: ja
  text: その人は、祭壇の北側で、ヤハウェの前において、それを屠る。祭司であるアロンの子らは、その血を祭壇の周囲に投げかける[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その血を祭壇の周囲に勢いよく浴びせかける」。ヘブライ語の動詞は、軽く散らすというより、血を投げかける動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: 屠る
  rationale: 犠牲動物を儀礼的に屠殺することを表す標準的な動詞なので、一般的な「殺す」より具体的な「屠る」とした。祭儀規定として自然な現在形を用いた。
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: 祭壇の北側
  rationale: יֶרֶךְ はここでは祭壇の「側面・側」を指し、צָפֹנָה が北の位置を示すため、明瞭な日本語にした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 祭儀的に神の臨在の前で行うことを表す表現。固有名 יהוה はヤハウェと音写した。
- source_word: וְזָרְקוּ
  choice: 振りかける
  rationale: זרק は投げる、放つという力を伴う動作で、ここでは血を祭壇に浴びせかける祭儀行為を指す。「注ぐ」や軽い「滴らせる」と区別しつつ、本文では日本語聖書語として理解しやすい表現を採用し、動作の強さは脚注で補った。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 祭司であるアロンの子ら
  rationale: アロンの子らと祭司が同格であることを明示し、血の処置を担う主体を正確に示した。
- source_word: דָּמוֹ
  choice: その血
  rationale: 接尾代名詞は犠牲動物を指す。日本語では生物・無生物の文法的性を区別しないため、「その血」が自然である。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の周囲に
  rationale: עַל は血が祭壇に向けて施されること、סָבִיב は祭壇の周り全体を示す。日本語では「祭壇の周囲に」が簡潔で自然である。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の契約名を普通名詞的な称号に置き換えず、本文で識別できるよう音写した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で荘重な祭儀規定の文体とした。「その人」で屠る者を示し、祭司が血を扱うという役割の区別を保持した。
