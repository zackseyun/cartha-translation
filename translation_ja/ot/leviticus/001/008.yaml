  text: וְ/עָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים אֵ֚ת הַ/נְּתָחִ֔ים אֶת הָ/רֹ֖אשׁ וְ/אֶת הַ/פָּ֑דֶר עַל הָ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: ja
  text: 祭司であるアロンの子らは、切り分けた部分と頭と脂肪[a]を、祭壇の上の火の上にある薪の上に並べる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「獣脂」または「脂肪の覆い」とも訳せる。ヘブライ語は、供え物に用いる動物の脂肪部分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: 並べる
  rationale: ערךは祭儀の文脈で、物を順序立てて配置することを表す。日本語では手順を示す簡潔な現在形「並べる」が自然である。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 祭司であるアロンの子ら
  rationale: 「祭司たち」は「アロンの子ら」を同格的に説明しているため、その関係を明確にした。
- source_word: הַנְּתָחִים
  choice: 切り分けた部分
  rationale: 前節で解体された動物の各部分を指すため、単なる「部分」より文脈が明確であり、原語以上に細かな部位を特定しない表現とした。
- source_word: הָרֹאשׁ
  choice: 頭
  rationale: 原語の直接的な解剖学的意味をそのまま訳した。
- source_word: הַפָּדֶר
  choice: 脂肪
  rationale: 供え物に用いる脂肪部分を指すが、厳密な解剖学的位置には不確かさがあるため、本文では広く理解できる「脂肪」とし、別訳を脚注に示した。
- source_word: עַל הָעֵצִים
  choice: 薪の上に
  rationale: עֵצִיםはここでは燃料として置かれた木を集合的に指すので、祭壇の文脈に自然な「薪」とした。
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 祭壇の上にある火、その火の上にある薪の上に
  rationale: 祭壇、火、薪という原文の重層的な位置関係と、二つの関係節による反復を、理解可能な日本語で保った。
