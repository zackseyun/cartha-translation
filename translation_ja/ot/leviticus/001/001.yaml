id: LEV.1.1
reference: Leviticus 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: ja
  text: さて、ヤハウェはモーセに呼びかけ、会見の天幕から彼に語って、こう言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び
  rationale: קרא はここで神がモーセに呼びかけることを表す。「呼び出し」では召喚の意味を強めすぎるため、簡潔に「呼び」とした。
- source_word: אֶל־מֹשֶׁה
  choice: モーセを
  rationale: 日本語では「モーセに呼びかけ」も可能だが、後続の「彼に」との重複を避け、自然な「モーセを呼び」とした。意味上はモーセに向けた呼びかけを表す。
- source_word: וַיְדַבֵּר
  choice: 語って言われた
  rationale: דבר の「語る」と、後続の לאמר が発言内容を導く機能の双方を、日本語として不自然にならない一続きの表現で保った。主語が神であるため敬意を示す「言われた」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語音写「ヤハウェ」で表した。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 接尾代名詞は直前のモーセを指すため、「彼に」と明示した。
- source_word: מֵאֹהֶל מוֹעֵד
  choice: 会見の天幕から
  rationale: אֹהֶל מוֹעֵד は、定められた会見の場である聖所の天幕を指す。慣用的で透明性の高い「会見の天幕」とした。
- source_word: לֵאמֹר
  choice: 語って言われた
  rationale: 後続する直接話法を導く定型表現。日本語では独立した「言って」よりも、「語って言われた」として次節の発言につなぐのが自然である。
- source_word: וַ
  choice: さて
  rationale: 物語を進めつつ新しい書の場面を導入する接続として、現代日本語で自然かつ品位のある「さて」を選んだ。単純な時間順を強く示す「それから」も可能。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に称号ではなく神名四文字があることを明示するため、神名を音写した。特定の教派的慣行に依存せず、原文上の固有名を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法書の導入にふさわしい簡潔で品位ある文体とした。「語って言われた」はヘブライ語の דבר＋לאמר という二段構造をある程度保つための表現である。
