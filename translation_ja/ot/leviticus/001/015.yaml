base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: ja
  text: 祭司はその鳥を祭壇のもとへ持って行き、その頭をつまみ切り[a]、祭壇の上で焼く。その血は祭壇の側面に絞り出される[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「頭をひねり取って」とも訳せる。ヘブライ語の動詞は、祭司が鳥のいけにえを屠る動作を表す専門語。
    reason: lexical_alternative
  - marker: b
    text: 直訳「祭壇の壁に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: その鳥を……持って行き
  rationale: קרבのヒフィル形は「近づける、持って来る」を意味する。直後の「祭壇のところに」と合わせ、具体的な移動を自然な日本語で表した。目的語は文脈上の鳥であることを明示した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀規定におけるכֹּהֵןの標準的で明瞭な訳語。
- source_word: אֶל הַמִּזְבֵּחַ
  choice: 祭壇のところに
  rationale: אֶלが示す祭壇への方向・接近を表す。「祭壇に」では鳥を祭壇そのものの上へ置く意味にも読めるため、「ところに」とした。
- source_word: וּמָלַק
  choice: ひねり取って
  rationale: 鳥のいけにえを屠る祭司の動作を指す専門的な動詞。具体的で理解しやすい表現を本文に置き、語の専門性は脚注で示した。
- source_word: אֶת רֹאשׁוֹ
  choice: その頭を
  rationale: מלקの直接目的語であり、鳥の頭を指す。
- source_word: וְהִקְטִיר
  choice: 焼き
  rationale: 祭儀文脈のקטרは祭壇で焼いて煙として立ち上らせること。現代日本語として簡潔な「焼く」を採用した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴う形だが、ここでは祭壇上で焼く祭儀行為を自然に表す。
- source_word: וְנִמְצָה
  choice: 絞り出す
  rationale: מצהのニファル形は、血が押し出される、絞り出されることを表す。ヘブライ語の受動形を日本語で機械的に再現するより、祭司が続けて行う一連の指示として自然な能動表現にした。
- source_word: דָמוֹ
  choice: 血を
  rationale: 鳥の血を指す。日本語では所有代名詞を重ねずとも指示対象が明確である。
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: 祭壇の側面に
  rationale: קִירの字義は「壁」だが、祭壇については「側面」が自然で、位置を明瞭に伝える。字義的表現は脚注に残した。
