id: LEV.23.43
reference: Leviticus 23:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: ja
  text: それは、わたしがイスラエルの人々[b]をエジプトの地から導き出したとき、彼らを仮小屋[a]に住まわせたことを、あなたがたの後の世代が知るためである。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仮庵」または「一時的な小屋・避難所」とも訳せる。ヘブライ語スッコートは、一時的に用いる小屋や避難所を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「イスラエルの子ら」。ここではイスラエルの民全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: 知るためである
  rationale: 目的を表す לְמַעַן と、それに続く未完了形の意図・目的の意味を、自然な現代日本語で示した。
- source_word: דֹרֹתֵיכֶם
  choice: あなたがたの後の世代
  rationale: 直訳的な「あなたがたの世代」では意味が不明瞭になりやすいため、祭りの意味を知るべき後代の人々を指すことが明確な表現とした。
- source_word: כִּי
  choice: ことを
  rationale: ここでは「知る」内容を導く接続詞なので、日本語では引用内容を名詞化する「ことを」で表した。
- source_word: בַסֻּכּוֹת
  choice: 仮小屋に
  rationale: סֻכָּה は枝などで造る一時的な小屋・覆いを指す。祭りとの語彙的なつながりを保ちつつ、現代日本語で理解しやすい「仮小屋」とした。
- source_word: הוֹשַׁבְתִּי
  choice: 住まわせた
  rationale: ישׁב のヒフィル形が持つ使役の意味を明示した。「住ませた」よりも文語に偏らず、かつ dignified な表現である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの表現を保ち、イスラエルの民を集合的に指す語法として訳した。より説明的な訳語は脚注に示した。
- source_word: בְּהוֹצִיאִי
  choice: わたしが…導き出したとき
  rationale: 前置詞 ב を伴う不定詞構文の時間的意味を自然に表し、出エジプトにおける神の主導を示す「導き出す」を用いた。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 原文に明示された אֶרֶץ（地）と、起点を示す מִן をともに保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名四文字を日本語で一般的な音写により示した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称男性複数接尾辞を含む契約定型句を、過不足なく自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を明記しているため、称号「主」で代替せず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の集合的表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の父祖名と「子ら」という形を本文に保持した。ただし、この句が男性だけに限定されず契約共同体を集合的に指すことが分かるよう脚注を付した。
- issue: 仮小屋に住まわせた主体性
  choice: 住まわせた
  alternative: 住んだ／住むようにした
  rationale: ヒフィル形の使役性を保ち、神が住居を備えた、またはそこに居住させたという原文の幅を不必要に狭めない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「それは」で前節との目的関係を示し、原文の語順を機械的に再現せず日本語として自然な構文に整えた。神の一人称と民への複数呼称を明確にし、祭儀語 סֻכּוֹת は「仮小屋」として語彙上の特色を残した。
