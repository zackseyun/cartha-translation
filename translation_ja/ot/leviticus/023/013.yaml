id: LEV.23.13
reference: Leviticus 23:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: ja
  text: その穀物のささげ物は、油を混ぜた上等の小麦粉エファの十分の二とする。これはヤハウェへの火によるささげ物[a]、喜ばしい香りである。また、その注ぎのささげ物は、ぶどう酒一ヒンの四分の一とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「ヤハウェへの食物のささげ物」。
    reason: אִשֶּׁה の祭儀用語としての訳語には「火によるささげ物」と「食物のささげ物」という代替があり、語義上の議論を保持するため。
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: また、それに添える穀物のささげ物
  rationale: 祭儀の文脈における מִנְחָה を「穀物のささげ物」とし、三人称男性単数の接尾辞が前節の雄の子羊を指すことを、自然な日本語で「それに添える」と表した。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: エファの十分の二
  rationale: 原文は直訳すると「十分の二」だが、祭司文書で前提とされる容量単位エファを明示し、数量を正確かつ理解しやすくした。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 供え物に用いる精製された良質の粉を指す祭儀用語として、現代日本語で明瞭な表現を選んだ。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 油と粉が混ぜ合わされた状態を示す受動分詞を、自然で簡潔な日本語にした。
- source_word: אִשֶּׁה לַיהוָה
  choice: ヤハウェへの火によるささげ物
  rationale: אִשֶּׁה は祭壇の火で献げるささげ物を表す専門語であるため、「食物のささげ物」より原文の祭儀的手段が明瞭な訳を採った。神名 יהוה は固有名として「ヤハウェ」とした。
- source_word: רֵיחַ נִיחֹחַ
  choice: 喜ばしい香り
  rationale: 神に受け入れられる供え物を描く定型的な祭儀表現を、比喩を保ちながら自然な日本語で表した。
- source_word: וְנִסְכֹּה
  choice: また、それに添える注ぎのささげ物
  rationale: נֶסֶךְ は液体を注いで献げる供え物を指す。「注ぎのささげ物」により動作と祭儀上の意味を明示し、接尾辞は「それに添える」で表した。
- source_word: יַיִן
  choice: ぶどう酒
  rationale: 日本語で原料と酒類が明確になる標準的な聖書語彙を用いた。
- source_word: רְבִיעִת הַהִין
  choice: 一ヒンの四分の一
  rationale: 古代の容量単位ヒンを保持し、分数を自然な日本語の語順で示した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神の固有名を訳文でも識別できるよう、「ヤハウェ」と音写した。
- issue: אִשֶּׁה の祭儀的意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 語の正確な語源には議論があるものの、文脈上は祭壇の火で献げられる供え物を指すため、祭儀的な行為を明示した。「食物」と訳して神が食物を必要とするかのような含意を生じさせないようにした。
translation_notes:
  register: 明瞭で現代的ながら、律法本文にふさわしい簡潔で荘重な文体とした。古代の単位名エファとヒンは保持し、分量関係が分かるよう補った。「それ」は前節の雄の子羊を受ける。
