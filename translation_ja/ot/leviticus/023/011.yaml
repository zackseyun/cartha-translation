  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: ja
  text: 祭司は、あなたがたが受け入れられるために、その束をヤハウェの前で振る。[a] 安息日の翌日、祭司はそれを振る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのために受け入れられるものとする」。ヘブライ語は、ささげ物が受け入れられることを通して礼拝者たちが受け入れられる、という意味にも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף / יְנִיפֶנּוּ
  choice: 揺り動かし／それを揺り動かす
  rationale: נוּףのヒフィル形は、ささげ物を儀礼的に振って差し出す行為を表す。「揺り動かす」は、その具体的な動作を過度な説明なしに保つ。
- source_word: הָעֹמֶר
  choice: その束
  rationale: ここでは乾量単位よりも、初穂として携える穀物の束を指す。直前の文脈を受ける定冠詞も「その」で表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在の前に儀礼的に差し出すという、祭儀上の定型表現を自然な日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語音写で示した。
- source_word: לִרְצֹנְכֶם
  choice: あなたがたが受け入れられるようにする
  rationale: רָצוֹןの祭儀的な用法に基づき、ささげ物を通して礼拝者たちが神に受け入れられる目的・結果を表した。所有接尾辞の複数二人称も明示した。
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: 安息日の翌日に
  rationale: 特定の安息日に続く日を示す時間表現を、明瞭な現代日本語にした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: イスラエルの祭儀を担うכֹּהֵןの標準的な訳語。日本語では最初の節にも主語として補い、誰がその行為をするかを明瞭にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号に置き換えず音写し、神名としての性格を保持した。
- issue: לִרְצֹנְכֶם が示す受容の対象
  choice: あなたがたが受け入れられるようにする
  alternative: あなたがたのために受け入れられるものとする
  rationale: この句は、ささげ物そのものの受納とも、ささげ物を通した礼拝者の受容とも表現できる。本文では人々の受容を示す自然な訳を採り、祭儀的な曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。律法文としての簡潔さと反復を保ちつつ、祭儀用語を過度に専門化しなかった。
