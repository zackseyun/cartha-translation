source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: ja
  text: まさにこの日に、どのような仕事であれする者はだれでも、わたしはその者を民の中から滅ぼす[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その者を民の中から断つ（または、取り除く）」。ここで用いられているヘブライ語動詞は「滅ぼす、滅びさせる」という意味であり、通常「断つ」と訳される動詞とは異なる。ただし、裁きによって民の中から除かれるという意味では近い。
    reason: 原語の動詞の違いと、文脈上可能な別訳を示すため。
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 者／その者
  rationale: ここで נֶפֶשׁ は非物質的な「魂」ではなく、法的規定の対象となる一人の人を指す。日本語では「者」「その者」が自然である。
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: 何らかの仕事をする
  rationale: עשה と מְלָאכָה の組み合わせを自然な現代日本語で表し、כָּל の包括性も保つ。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: このまさに同じ日に
  rationale: עֶצֶם が日を強調していることを「まさに」で示し、直前の規定と同じ当日を指すことを「同じ」で明確にした。
- source_word: וְהַאֲבַדְתִּי
  choice: わたしが……滅ぼす
  rationale: אבד のヒフィル形は「滅びさせる、滅ぼす」を意味する。本文にない כרת の専門的な訳語へ置き換えず、動詞本来の強さを保った。
- source_word: מִקֶּרֶב עַמָּהּ
  choice: 民の中から
  rationale: 共同体のただ中から除かれるという裁きの表現を簡潔に再現する。接尾辞の文法的女性形は נֶפֶשׁ との一致によるもので、日本語では性を明示する必要がない。
theological_decisions:
- issue: וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ が表す刑罰の性質
  choice: わたしがその者を民の中から滅ぼす
  alternative: わたしがその者を民の中から断つ／取り除く
  rationale: 原文は通常「断つ」と訳される כרת ではなく、אבד のヒフィル形を用いる。そのため本文では「滅ぼす」としつつ、共同体からの除去を表す文脈的な別訳を脚注に残した。刑罰の具体的な執行形態は本文以上に限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「魂」のような誤解を招きやすい直訳を避け、法的・契約的文脈に合う「者」を採用した。神の明示的な主語を保つため「わたしが」とした。
