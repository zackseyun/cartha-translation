id: LEV.23.3
reference: Leviticus 23:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: ja
  text: 六日間は仕事をしてよい。しかし七日目は、徹底した休みの安息日、聖なる集会である。どんな仕事もしてはならない。あなたがたのすべての居住地において、それはヤハウェのための安息日である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェの安息日」とも訳せる。また、「あなたがたのすべての居住地」は「あなたがたの住むすべての所」または「あなたがたのすべての定住地」とも訳せる。
    reason: ヘブライ語 לַיהוָה はヤハウェへの方向づけ、またはヤハウェへの所属を表し得る。מוֹשְׁבֹתֵיכֶם は住居・居住地、または定住共同体を指し得る。
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: 仕事をしてよい
  rationale: 動詞はニファル形で字義的には「仕事がなされる」。ここでは六日間に仕事をすることが認められているという法的・一般的な意味を、自然な日本語で表した。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全な休みの安息日
  rationale: 同根語を重ねた強意表現であり、通常の仕事を完全にやめる安息日であることを示す。「完全な休み」によって強調を保った。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会の日
  rationale: 礼拝のために正式に呼び集められる聖なる集まりを指す。日本語として明瞭にするため「の日」を補った。
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: どんな仕事もしてはならない
  rationale: 二人称複数への全面的な禁止を、明確で現代的な日本語で表した。
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: ヤハウェの安息日である
  rationale: 前置詞 לְ は、この日がヤハウェに属し、ヤハウェにささげられた日であることを示す。日本語では「ヤハウェの」が簡潔で自然である。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: あなたがたの住むすべての所で
  rationale: מוֹשָׁב は住居、居住地、定住地を意味し得る。特定の一か所ではなく、イスラエルの各居住地に及ぶ規定であることを明瞭にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: ヘブライ語本文にある神の固有名を、称号に置き換えず日本語で音写した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有名を用いているため、その区別を保って「ヤハウェ」とした。
- issue: שַׁבַּת שַׁבָּתוֹן の強意
  choice: 完全な休みの安息日
  alternative: 厳かな安息の安息日
  rationale: 完全な休止という法的な強調を保ちつつ、後代の教理的意味を加えない表現を選んだ。
- issue: לַיהוָה の関係
  choice: ヤハウェの安息日
  alternative: ヤハウェのための安息日
  rationale: 所属と方向づけの両方を含み得る表現である。「の」は自然な日本語だが、「ための」という理解も可能なので脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法本文にふさわしい簡潔で厳かな調子を保った。「安息日」は定着した聖書用語として維持し、命令は「してはならない」と直接的に訳した。
