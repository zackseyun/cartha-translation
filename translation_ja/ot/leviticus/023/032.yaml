  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: ja
  text: これは、あなたがたのための完全に休む安息日である。あなたがたは自らを苦しめなければならない[a]。その月の九日の夕方、夕方から次の夕方まで[b]、あなたがたの安息日として守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自らを低くしなければならない」または「自らを慎まなければならない」。このヘブライ語の慣用句は儀礼的に自らを苦しめ、へりくだることを指し、伝統的には断食と結び付けられている。
    reason: lexical_alternative
  - marker: b
    text: 直訳「夕方から夕方まで」。イスラエルの一日の数え方に従い、夕方から翌日の夕方まで守ることを示す。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全な安息の安息日
  rationale: 同根語を重ねた強調を保ちつつ、全面的に仕事をやめて休む日であることを現代日本語で明確に表す。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: あなたがたは自らを苦しめなければならない
  rationale: 贖罪日の文脈における自己卑下・断食を伴いうる表現だが、ヘブライ語が明記する範囲を狭めず、字義に近い広がりを残す。
- source_word: נַפְשֹׁתֵיכֶם
  choice: 自らを
  rationale: ここでのנֶפֶשׁは人間の非物質的部分としての「魂」に限定されず、再帰的に人全体を指すため、自然な日本語とした。
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: その月の九日の夕方
  rationale: ヘブライ語の語順と時点を簡潔に保ち、九日の夕方から祭日の遵守が始まることを示す。
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: 夕方から次の夕方まで
  rationale: 原文の「夕方から夕方まで」を保ちながら、日本語で期間が明瞭になるよう「次の」を補った。
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: あなたがたの安息日を守りなさい
  rationale: 動詞שבתの休止・安息の意味と、安息日を遵守する慣用的意味を自然な命令表現で伝える。
theological_decisions:
- issue: 祭儀的文脈における自己苦行の意味
  choice: 本文では「自らを苦しめる」という広い命令を保持する。
  alternative: 「断食する」または「身を低くする」
  rationale: この句は伝統的に断食を含む悔い改めの実践と理解されるが、この節自体は断食を明記していないため、意味を一つの行為に限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「安息の安息日」という原文の強調構文を「完全な安息の安息日」として残し、祭儀的な自己苦行の意味は脚注で補足した。
