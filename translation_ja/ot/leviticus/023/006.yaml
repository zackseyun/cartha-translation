id: LEV.23.6
reference: Leviticus 23:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: ja
  text: また、この月の十五日は、ヤハウェのための[a]「種なしパンの祭り」である。七日間、あなたがたは種なしパンを食べなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェに属する」。ヘブライ語の前置詞は、奉献の対象または帰属を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר יוֹם
  choice: また、この月の十五日は
  rationale: 接続詞を「また」とし、ヘブライ語の「十五の日」という日付表現を、現代日本語で自然な「十五日」とした。
- source_word: לַ/חֹדֶשׁ הַ/זֶּה
  choice: この月の
  rationale: 当該月の中の日付を示す暦上の表現として、簡潔で自然な日本語にした。
- source_word: חַג הַ/מַּצּוֹת
  choice: 「種なしパンの祭り」
  rationale: חַגを宗教的祝祭を表す「祭り」とし、מַצּוֹתは発酵させないパンを指すため「種なしパン」とした。全体を固有の祭りの名称としてかぎ括弧で示した。
- source_word: לַ/יהוָה
  choice: ヤハウェのための
  rationale: 神名יהוהを「ヤハウェ」と音写し、前置詞לが表しうる奉献・帰属の関係を本文では自然な「のための」で表した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 行為が続く期間を示すため、日本語の期間表現「七日間」とした。
- source_word: מַצּוֹת
  choice: 種なしパン
  rationale: 複数形だが、食物の種類を表す日本語では個数を明示せず「種なしパン」とするのが自然である。
- source_word: תֹּאכֵלוּ
  choice: あなたがたは…食べなければならない
  rationale: 律法文脈における二人称複数の未完了形の規定的・命令的効力を、明確な現代日本語で表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名יהוהが明記されているため、その固有名としての性格を保つ音写を用いた。
- issue: לַיהוָהが示す関係
  choice: ヤハウェのための
  alternative: ヤハウェに属する
  rationale: 前置詞לは祭りの奉献先を示すとも、帰属を示すとも理解できる。本文では自然な奉献表現を採り、別の可能性を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、律法の規定としての厳粛さを保った。祭名は読者が名称として認識しやすいよう、かぎ括弧で示した。
