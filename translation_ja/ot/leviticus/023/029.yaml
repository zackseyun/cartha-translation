  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: ja
  text: なぜなら、まさにこの日に身を低くしない者はだれでも、その民の中から断たれる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自らを苦しめない」「身を慎まない」とも訳せる。ヘブライ語の慣用表現は、自己を慎み、へりくだることを指し、伝統的には断食と結び付けられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （訳文では独立した接続語を置かない）
  rationale: 前節の命令に対する理由・説明を導く語だが、日本語では文脈上、接続語を明示しなくても法文の流れが自然に伝わる。
- source_word: כָל הַנֶּפֶשׁ
  choice: 者はみな
  rationale: נֶפֶשׁ はここで非物質的な「魂」ではなく一人の人を指す。日本語の法文として自然な総称表現にした。
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: 自らを低くしない
  rationale: 贖罪日の文脈における ענה の慣用表現は、断食などを伴う自己抑制・へりくだりを指す。「苦しめる」だけに限定せず、悔い改めの姿勢を伝える。別の直訳的表現は脚注に示す。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: このまさにその日に
  rationale: עֶצֶם が日を強調する働きを保ち、「この日そのもの」という原文の強意を明示した。
- source_word: וְנִכְרְתָה
  choice: 断たれる
  rationale: 契約法における כרת のニファル形の重い法的表現を保ち、死、追放、神の裁きなど具体的な執行方法は特定しない。
- source_word: מֵעַמֶּיהָ
  choice: その民から
  rationale: 女性形接尾辞は女性名詞 נֶפֶשׁ との文法的一致による。日本語では性別を限定しない「その」を用いて一般的な人を指す。
theological_decisions:
- issue: 贖罪日に自らを「苦しめる／低くする」という命令の意味
  choice: 本文では「自らを低くしない」と訳す。
  alternative: 「自らを苦しめない」「身を慎まない」
  rationale: この慣用表現は悔い改めに伴う自己抑制を表し、伝統的には断食と結び付けられる。ただし本文だけで実践を断食に限定せず、より直訳的な可能性を脚注に残す。
- issue: 「断たれる」という刑罰の性質
  choice: 具体的な仕組みを定めず「その民から断たれる」とする。
  alternative: 「民から除かれる」「共同体から追放される」
  rationale: 原文はここで刑罰が死、追放、あるいは神による直接の裁きのどれであるかを明記していないため、その曖昧さと神学的緊張を保持する。
translation_notes:
  register: 明瞭で厳粛な現代標準語による法文調。「魂」のような誤解を招きうる直訳を避けつつ、「断たれる」という原文の重い契約用語と、その刑罰の具体像に関する曖昧さを保持した。
