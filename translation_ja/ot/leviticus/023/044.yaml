base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: ja
  text: モーセは、ヤハウェの定められた時をイスラエルの子らに告げた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では字義的に「イスラエルの息子たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: ピエル形の基本義「語る」を踏まえつつ、祭儀暦の結びとして、定められた時を民に知らせたという伝達の力を自然な日本語で表す。
- source_word: מֹעֲדֵי
  choice: 定めの時
  rationale: מוֹעֵדは定められた時・集まりを指す。レビ記23章では祭りだけでなく安息日も含むため、「祭り」より広い意味を保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず音写する。
- source_word: אֶל
  choice: に
  rationale: モーセが語り告げた相手を示す前置詞として、自然な日本語の助詞「に」で表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義的な表現「イスラエルの息子たち」と共同体を代表する用法を保ちつつ、現代日本語として簡潔にした。
theological_decisions:
- issue: 契約の御名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が神の固有名を直接用いているため、称号「主」に置換せず、一般的な学術的音写「ヤハウェ」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」で章末の要約としての機能を示し、「定めの時」によって祭りだけに限定されない מוֹעֵד の広がりを保持した。
