revisions:
- from: ただし、第七の月の十五日、あなたがたがその地の産物を取り入れた時、七日間、ヤハウェの祭りを祝いなさい。第一日には全き休み[a]があり、第八日にも全き休みがある。
  to: ただし、第七の月の十五日に、あなたがたが土地の産物を取り入れたとき、ヤハウェの祭りを七日間祝いなさい。第一日は厳かな休みの日とし、第八日も厳かな休みの日としなさい。
  rationale: 本文の意味は保持したまま、「全き休み」を現代日本語として自然で理解しやすい「厳かな休みの日」に改めた。これは祭りに伴うシャッバートーンの特別な性格を表す一方、週ごとの安息日と断定しない。脚注も自然な日本語に整え、代替的な訳語と通常の仕事を休むという語義を明示した。
  reviewer_model: gpt-5.6-terra
