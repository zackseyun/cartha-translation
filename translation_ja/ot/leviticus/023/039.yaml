  naturalness: 「全き休み」は現代日本語では硬く不自然である。「厳かな休みの日」とすることで、祭儀に属する特別な休みという趣旨を自然に表せる。また、日付句には助詞「に」を補うと文の構造が明瞭になる。
  terminology: 「ヤハウェ」は原文の神名の表記として適切。「土地の産物」「祭りを七日間祝いなさい」も自然で原文に忠実である。שַׁבָּתוֹןについては、週ごとの安息日と同一視しない本文表現を保ち、脚注で「安息日としての休み」という代案を示す。
