source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: ja
  text: ただし、第七の月の十五日に、あなたがたが土地の産物を取り入れたとき、ヤハウェの祭りを七日間祝いなさい。第一日は厳かな休みの日とし、第八日も厳かな休みの日としなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 前の規定を受けつつ、この祭りの時期と守り方を改めて明示する移行・限定の働きを自然な日本語で表す。
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: あなたがたがその地の産物を取り入れた時
  rationale: ב付き不定詞の時間的用法と、תְּבוּאָהの穀物だけに限定されない広い意味を保つ。
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: ヤハウェの祭りを祝いなさい
  rationale: חגגとחַגの祭儀的な祝祭の意味を、現代日本語として自然に表現する。神名は称号に置き換えず「ヤハウェ」とする。
- source_word: שַׁבָּתוֹן
  choice: 全き休み
  rationale: 通常の仕事をやめる特別な休止を表し、週ごとの安息日そのものと断定せず、完全な休みという語義を簡潔に伝える。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 祭りを祝う期間を自然な日本語で明示する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文にある固有の神名を称号へ置換せず、一般的な学術的転写に基づいて示す。
- issue: 祭儀規定における שַׁבָּתוֹן の意味
  choice: 全き休み
  alternative: 安息日／厳かな休み
  rationale: 週ごとの安息日と同一視する含みを避けつつ、祭りに伴う特別で完全な休止を示す。原語だけでは「厳かさ」が明示されないため本文には加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令は律法本文にふさわしい「祝いなさい」とし、複数の二人称は「あなたがた」で明示した。
