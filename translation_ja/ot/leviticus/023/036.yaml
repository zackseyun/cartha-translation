  terminology: 「ヤハウェ」は原文の神名を一貫して明示している。「ささげ物」「聖なる集会」「厳粛な集会」は祭儀的文脈に適した統一的な用語である。עֲצֶרֶתについて本文で「厳粛な集会」とし、脚注で代替的な理解を示す扱いも、語の含意を過度に限定しない。
