id: LEV.23.36
reference: Leviticus 23:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: ja
  text: 七日間、あなたがたは火によるささげ物[a]をヤハウェに献げなければならない。第八日には、聖なる集会を開き、火によるささげ物をヤハウェに献げなければならない。これは厳粛な集会[b]である。通常の仕事は一切してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火によって献げるささげ物」とも訳せる。ヘブライ語は、祭壇の火によって献げられる供え物を表す祭儀用語。
    reason: אִשֶּׁהの祭儀的意味と訳語の幅を示すため。
  - marker: b
    text: 「祭りを締めくくる集会」または「特別な集会」とも訳せる。
    reason: עֲצֶרֶתが持つ集会の性格と文脈的含意を一つに限定しないため。
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 献げ物を献げる期間を、簡潔で自然な現代日本語で示す。
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: 献げなければならない
  rationale: קרבのヒフィル形が祭儀文脈で表す「供え物として差し出す」という意味と、法規としての指示の力を自然に伝える。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭壇の火によって献げられる供え物を指す祭儀用語であるため。「食物のささげ物」より原語の形態と祭儀的特徴を直接示しつつ、脚注で語義の幅を補う。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞לの方向・奉献先を「に」で表し、神名יהוהは固有名として「ヤハウェ」とする。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八日には
  rationale: 時間を示す句を自然な日本語で表す。対比を示す「は」により、先の七日間に続く第八日を明確にする。
- source_word: מִקְרָא קֹדֶשׁ יִהְיֶה לָכֶם
  choice: 聖なる集会を開き
  rationale: מִקְרָא קֹדֶשׁは祭日に召集される聖別された集まりを指す。日本語では「聖なる集会を開く」として、制度的な召集を自然に表す。後続の命令と並列させるため接続形にした。
- source_word: עֲצֶרֶת
  choice: 厳粛な集会
  rationale: 特別な祭儀的集会を表す伝統的な語義を簡潔に示す。祭りを締めくくる集会という文脈的含意は脚注に残し、本文で一義的に限定しない。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 通常の仕事は一切
  rationale: 祭日に禁じられる日常的・職業的労働を指し、あらゆる行為の全面禁止と誤解されない明瞭な表現とした。כָּלの包括性は「一切」で表す。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文に現れる四文字神名を称号に置き換えず、契約の神の固有名として明示する。一般的な学術的再建に基づく日本語表記を用いる。
- issue: עֲצֶרֶתの性格
  choice: 厳粛な集会
  alternative: 祭りを締めくくる集会／特別な集会
  rationale: この語には集会、活動の停止・抑制、祭りの締めくくりという関連する含意があり得る。本文では祭儀的な厳粛さを表し、文脈上の「締めくくり」は脚注で代案として示して、曖昧さを不当に解消しない。
translation_notes:
  register: 現代の一般読者に理解できる明瞭な文体を用いつつ、祭儀法規としての荘重さと命令の強さを保った。「ささげ物」「聖なる集会」「厳粛な集会」により祭儀的語彙を統一し、過度に古風な言い回しは避けた。
