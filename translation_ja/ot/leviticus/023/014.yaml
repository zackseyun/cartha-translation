- from: パンも、炒った穀物[a]も、新鮮な穀物[b]も、まさにこの日、あなたがたの神へのささげ物を携えて来る時までは、食べてはならない。これは、あなたがたの住むすべての所で、代々にわたって守るべき永続する定め[c]である。
  to: パンも、炒った穀物[a]も、新たに実った穀物[b]も、あなたがたの神へのささげ物を持って来る、この日のまさにその時までは、食べてはならない。これは、あなたがたの住むすべての所で、代々にわたって守るべき永続する定め[c]である。
