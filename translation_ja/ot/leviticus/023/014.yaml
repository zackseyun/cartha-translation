id: LEV.23.14
reference: Leviticus 23:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ja
  text: パンも、炒った穀物[a]も、新たに実った穀物[b]も、あなたがたの神へのささげ物を持って来る、この日のまさにその時までは、食べてはならない。これは、あなたがたの住むすべての所で、代々にわたって守るべき永続する定め[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「煎った穀物」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「新穀」。実ったばかりの穀物、または生の穂を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「とこしえの定め」「永久の定め」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: パン
  rationale: 基本義である焼いたパンを指す具体語を採用し、穀物の加工形態を列挙する文脈を保った。
- source_word: קָלִי
  choice: 炒った穀物
  rationale: 火であぶる、または炒ることで調理した穀物を指すため、現代日本語で分かりやすく農耕上の具体性も保つ表現とした。
- source_word: כַרְמֶל
  choice: 新鮮な穀物
  rationale: ここでは地名カルメルではなく、実ったばかりの穀物または生の穂を指す。パン、炒った穀物との並列に即して訳した。
- source_word: לֹא תֹאכְלוּ
  choice: 食べてはならない
  rationale: 律法文中の否定された未完了形が表す禁止の効力を、明瞭な現代日本語の法令調で示した。
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: まさにこの日…までは
  rationale: עֶצֶם の強意を「まさに」で表し、指定された当日そのものを強調した。
- source_word: עַד הֲבִיאֲכֶם
  choice: 携えて来る時までは
  rationale: ささげ物を持参することが、禁止の終点となる行為であることを自然な日本語で表した。
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: あなたがたの神へのささげ物
  rationale: קָרְבָּן を特定の供犠形式に狭めず、神に近づけて献じる物という一般的意味を保った。ヘブライ語の属格関係は日本語で自然な方向性を示す「神への」とした。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: 継続的な拘束力を保ちつつ、後代における適用範囲についての神学的結論を訳文に持ち込まない表現とした。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたって
  rationale: ' successive generations に及ぶ継続性を、明瞭な日本語の慣用表現で示した。'
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: あなたがたの住むすべての所で
  rationale: イスラエルの民が居住するあらゆる場所という意味を、「居住地」のような硬すぎる語を避けて明瞭に表した。
theological_decisions:
- issue: モーセ律法における חֻקַּת עוֹלָם の効力
  choice: 「永続する定め」と訳し、レビ記の契約的・法的枠組みにおける継続的拘束力を示す。
  alternative: 「とこしえの定め」または「永久の定め」
  rationale: 原語の持続性を保持しながら、儀礼律法が後代にどのように適用されるかという継続・非継続の神学的論争を訳文だけで決着させないため。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「食べてはならない」「定め」によって律法文としての威厳と禁止の効力を保った。二つの עַד が形成する時間表現は一つの自然な日本語構文にまとめつつ、「まさにこの日」と、ささげ物を携えて来ることの双方を残した。
