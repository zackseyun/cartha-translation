base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: ja
  text: 第一日目には、聖なる集会を開き、通常の仕事は一切してはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「通常の仕事」は、「労働を伴う仕事」または「労役」とも訳せる。祭日に禁じられた、職業や日常の務めとしての仕事を指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一日には
  rationale: 前置詞בְּと「日」、序数「第一」から成る時の表現。祭りの第一日を自然かつ簡潔に示す。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会を開く
  rationale: 召集された聖なる集まりを指す祭儀上の定型句。「集会」によって共同の集まりを示し、「開く」で召集・開催の含意を自然な日本語にした。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: いかなる通常の仕事も
  rationale: あらゆる行為を一切禁じるのではなく、職業や日常の務めとして行う仕事を指す。「重労働」だけに狭めず、祭日に禁じられる通常の労働という意味を表した。
- source_word: לֹא תַעֲשׂוּ
  choice: してはならない
  rationale: 二人称複数の未完了形を、共同体への法的禁止として現代日本語の明確な規定表現にした。
theological_decisions:
- issue: 祭日に禁じられるמְלֶאכֶת עֲבֹדָהの範囲
  choice: 「通常の仕事」とし、あらゆる活動の全面禁止とはしない
  alternative: 「重労働」または「労役」
  rationale: 語句は祭日の規定における通常の職業的・奉仕的労働を指すと考えられるが、その厳密な範囲を訳文で教派的に確定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖なる集会」はレビ記の祭儀用語として一貫性を持たせ、「通常の仕事」は過度に古風な「労役」や範囲を狭めうる「重労働」を避けた。
