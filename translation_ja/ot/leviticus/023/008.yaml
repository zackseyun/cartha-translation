source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: ja
  text: 七日間、あなたがたはヤハウェに火によるささげ物[a]を献げなければならない。七日目は聖なる集会とし、通常の仕事は一切してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物のささげ物」。
    reason: אִשֶּׁהは、火を用いて献げる供え物を指す祭儀用語であり、「食物のささげ物」と理解されることもあるため。
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 献げなければならない
  rationale: 祭儀の文脈におけるקרבのヒフィル形で、供え物を神の前に持って来て献げることを表す。現代日本語として自然な義務表現にした。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭司文書で、火を用いて献げられる供え物を指す。語源や具体的な供献方法を決めつけず、ヘブライ語の祭儀的表現を保った。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞לの方向・献呈の意味を「に」で表し、神名יהוהは称号に置換せず「ヤハウェ」と音写した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 供献が続く期間を簡潔で自然な日本語で示した。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目には
  rationale: 時間を示す前置詞בを、日本語の主題化を伴う自然な時間表現で訳した。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会
  rationale: 召集された宗教的集会を意味する定型句。一般読者に分かりやすく、祭儀的な格調も保つ。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: いかなる労働の仕事も
  rationale: 単なるすべての行為ではなく、通常の労働・職務を指す表現。「いかなる…も」でכָּלを保持しつつ、禁止対象を過度に広げないようにした。
- source_word: לֹא תַעֲשׂוּ
  choice: してはならない
  rationale: 共同体全体に対する強い禁止を、明瞭で現代的な規範表現として訳した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有の神名が明記されているため、称号へ置き換えず、一般的な学術的音写を用いた。
- issue: אִשֶּׁה の供献物としての性質
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 火を介する供献という祭儀的意味を明示しつつ、それが必ず食物であるとの解釈に限定しない。別訳は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい簡潔で厳粛な調子を保った。「聖なる集会」「火によるささげ物」には祭儀的な語感を残した。
