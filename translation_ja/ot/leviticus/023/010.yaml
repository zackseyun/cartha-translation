base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: ja
  text: イスラエルの子らに告げなさい。彼らにこう言いなさい。あなたがたが、わたしがあなたがたに与える地に入り、その地の収穫を刈り取るとき、あなたがたの収穫の初穂の一束[a]を祭司のもとへ持って行きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの収穫の初穂の一オメル」。ヘブライ語「オメル」はここでは穀物の「束」を指すとみられるが、容量の単位を指す用法もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の定型的な契約共同体への呼びかけと男性複数形を保ちつつ、現代日本語で理解可能な形にした。
- source_word: כִּי תָבֹאוּ
  choice: 入るとき
  rationale: כִּי はここで命令が適用される時を示すため、条件を過度に強めず「とき」とした。
- source_word: הָאָרֶץ
  choice: 地
  rationale: イスラエルが入ることになる契約的・地理的な土地を指す文脈に沿った。
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: わたしが与えようとしている
  rationale: 分詞 נֹתֵן の進行中ないし目前の神の行為という含みを自然な日本語で表した。
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: その地の収穫を刈り取る
  rationale: 動詞と同根名詞による「刈る／収穫」の表現をできるだけ保ち、接尾辞が土地を指すことを明示した。
- source_word: וַהֲבֵאתֶם
  choice: 携えて来なければならない
  rationale: 儀礼規定としての命令性と、祭司のもとへ持参する動きを自然な日本語で示した。
- source_word: עֹמֶר רֵאשִׁית קְצִירְכֶם
  choice: あなたがたの収穫の初穂の一束
  rationale: עֹמֶר の具体的な農作物の束という意味を本文に採り、רֵאשִׁית の時間的・祭儀的な「初穂」の意味を保った。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀法規における כֹּהֵן の標準的な訳語。
theological_decisions:
- issue: 契約共同体への性別を伴う呼称
  choice: イスラエルの子ら
  alternative: イスラエルの人々
  rationale: 原文の בְּנֵי という形を本文で可視化し、共同体全体への定型的呼称であることを文脈に委ねた。
- issue: 祭儀用語 עֹמֶר
  choice: 一束
  alternative: 一オメル
  rationale: この箇所では刈り取った物を祭司へ持参する具体的な場面なので「束」を優先したが、専門用語または容量単位としての可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法規としての命令性を示しつつ、原文の時系列と農耕・祭儀用語を保持した。
