id: LEV.23.27
reference: Leviticus 23:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: ja
  text: ただし、この第七の月の十日は「贖罪の日」[a]である。それはあなたがたにとって聖なる集会である。あなたがたは自らを苦しめ[b]、ヤハウェに火によるささげ物[c]を献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「贖罪たちの日」または「諸々の贖罪の日」と複数形になっている。
    reason: 原語の複数形と、日本語で一般的な祭日名との違いを示すため。
  - marker: b
    text: 「身を低くする」または「自らを慎む」とも訳せる。この表現は伝統的に断食を含む自己否定と理解されてきたが、原文は断食だけに限定していない。
    reason: ヘブライ語の慣用句が持つ意味の幅を保持するため。
  - marker: c
    text: 「燃やして献げるささげ物」とも訳せる。
    reason: 祭儀用語 אִשֶּׁה の訳語上の別表現を示すため。
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 前の祭日の規定から区別し、この日の規定を強調して導入する制限的・対照的な小辞として自然に表した。
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: この第七の月の十日
  rationale: ヘブライ語の時を示す慣用表現を、指示語「この」も保ちながら明瞭な日本語にした。
- source_word: יוֹם הַכִּפֻּרִים
  choice: 「贖いの日」
  rationale: 祭日の名称として自然で分かりやすい表現を本文に採用し、原語が複数形であることは脚注に残した。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会
  rationale: 公に招集される礼拝共同体の集まりを指す祭儀的表現を、現代日本語で簡潔かつ荘重に表した。
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: 自らを苦しめ
  rationale: נֶפֶשׁを非物質的な「魂」に限定せず再帰的に捉え、断食だけに意味を狭めず、原文の厳しい表現を保持した。
- source_word: וְהִקְרַבְתֶּם
  choice: 献げなければならない
  rationale: 祭儀の文脈におけるヒフィル形の意味「供え物として差し出す」を、日本語の規定文として自然に表した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 語源と祭儀的用法に関して議論があるため、「食物のささげ物」と断定せず、伝統的で原文に近い表現を本文に置いた。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 固有名 יהוה を一般的に推定される日本語音写で示し、普通名詞の称号へ置き換えなかった。
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים の複数形を祭日名でどう表すか
  choice: 本文は「贖いの日」、脚注で字義的複数形を示す
  alternative: 「贖いたちの日」または「諸々の贖いの日」
  rationale: 複数形を本文で機械的に再現すると不自然で意味も不明瞭になるため、定着した祭日名を用いつつ、形態上の情報を脚注で保持した。
- issue: 自らを苦しめる命令の具体的意味
  choice: 自らを苦しめ
  alternative: 身を低くする／自らを慎む／断食する
  rationale: この句は自己否定や断食を含み得るが、本文だけで断食に限定せず、儀礼的・悔悟的な幅と原文の緊張を保った。
- issue: אִשֶּׁה の意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 火で煙にして献げる供え物を表す伝統的理解を採りつつ、「食物」とする別解を脚注に示し、語義上の議論を一方的に解消しなかった。
translation_notes:
  register: 現代の一般読者に通じる明瞭な規定文としつつ、祭日名と祭儀語には簡潔で荘重な調子を保った。「魂を苦しめる」のような誤解を招く直訳は避け、「自らを苦しめる」として原文の厳しさと意味の幅を残した。
