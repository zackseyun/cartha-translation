revisions:
- from: ただし、この第七の月の十日は「贖いの日」[a]である。あなたがたは聖なる集会を開き、自らを苦しめ[b]、ヤハウェに火によるささげ物[c]を献げなければならない。
  to: ただし、この第七の月の十日は「贖罪の日」[a]である。それはあなたがたにとって聖なる集会である。あなたがたは自らを苦しめ[b]、ヤハウェに火によるささげ物[c]を献げなければならない。
  rationale: 聖会についての原文の叙述構文を回復し、祭日名を日本語の標準的な祭儀用語「贖罪の日」に整えた。自己苦行の表現は断食に限定せず保持した。אִשֶּׁה については、議論のある「食物のささげ物」を脚注から外し、本文の「火によるささげ物」と整合する安全な別表現にした。
