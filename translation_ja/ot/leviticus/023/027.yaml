    rationale: יִהְיֶה לָכֶם は「それはあなたがたにとって…である／となる」であり、集会を開くことを直接命じる形ではない。
  - severity: low
    issue: 祭日名「贖いの日」
    rationale: 意味は通るが、כִּפֻּרִים の文脈では現代日本語で定着した「贖罪の日」のほうが専門用語として正確で、贖い（redemption）との混同を避けられる。
  - severity: medium
    issue: 脚注cが「食物のささげ物」を有力な別解のように提示する
    rationale: אִשֶּׁה の「食物」語源説・解釈は確定的ではない。本文の祭儀的意味を損なわず、安全な訳語上の別表現を示すべきである。
