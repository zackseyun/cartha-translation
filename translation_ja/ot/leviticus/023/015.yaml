  revision_rationale: 本文は、二重に示される起算点を保持しつつ、揺祭の穀物の束を分かりやすく訳しました。末尾は原文の叙述形を保って「完全な安息日が七つとなる」とし、「安息日」が「週」を意味しうる解釈は脚注にとどめました。
