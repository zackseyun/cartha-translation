revisions:
- from: あなたがたは、安息日の翌日、すなわち奉献のために揺り動かす穀物の束を携えて来る日から、自分たちのために数えなさい。完全な安息日を七回[a]数えなければならない。
  to: あなたがたは、自分たちのために、安息日の翌日から、すなわち揺り動かしてささげる穀物の束をささげる日から数えなさい。完全な安息日が七つとなる。
  rationale: 本文は、二重に示される起算点を保持しつつ、揺祭の穀物の束を分かりやすく訳しました。末尾は原文の叙述形を保って「完全な安息日が七つとなる」とし、「安息日」が「週」を意味しうる解釈は脚注にとどめました。
