reference: Leviticus 23:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: ja
  text: あなたがたは、自分たちのために、安息日の翌日から、すなわち揺り動かしてささげる穀物の束をささげる日から数えなさい。完全な安息日が七つとなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: 数えなさい
  rationale: 接続詞を伴う完了形は、この律法的文脈では命令の効力を持つ。「数えなさい」は現代日本語でその指示を明瞭に表す。
- source_word: לָכֶם
  choice: 自分たちのために
  rationale: 与格代名詞の再帰的・当事者的な含みを保つ。
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: 安息日の翌日
  rationale: מָחֳרַת の時間的意味を自然に表し、שַׁבָּת は祭儀暦上の語として「安息日」とした。
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: 携えて来る日から
  rationale: 起算点を示す מִן と יוֹם の構造を明示し、後続する穀物の束との自然な結び付きを表した。
- source_word: עֹמֶר
  choice: 穀物の束
  rationale: ここでは容量単位よりも、儀礼でささげる具体的な束を指す。「束」だけでは内容が不明瞭なため「穀物の束」とした。
- source_word: הַתְּנוּפָה
  choice: 奉献のために揺り動かす
  rationale: 儀礼的に揺り動かして主の前に差し出す行為を、専門用語だけに頼らず分かりやすく示した。
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: 安息日を七回
  rationale: 原文が通常の「週」ではなく שַׁבָּתוֹת を用いることを保持しつつ、日本語として回数を自然に表した。別解の「七週」は脚注に示す。
- source_word: תְּמִימֹת
  choice: 完全な
  rationale: 時間単位が欠けることなく満ちているという意味を保つ。
- source_word: תִּהְיֶינָה
  choice: 数えなければならない
  rationale: 直訳的な「なければならない」だけでは日本語で述語が不足するため、文脈上の計数命令と結び付けて表した。
theological_decisions:
- issue: 暦の規定における שַׁבָּת／שַׁבָּתוֹת の解釈
  choice: 本文では「安息日」を保持する。
  alternative: 七つの完全な週／丸七週間
  rationale: 原文は安息日を表す語を明示的に用いており、起算日や七日周期の解釈を本文で一つに限定しないため。一般的な「週」という理解は脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、律法の指示としての荘重さを保った。祭儀行為は「奉献のために揺り動かす」と説明的に訳し、暦上の解釈の余地は本文と脚注の組み合わせで保持した。
