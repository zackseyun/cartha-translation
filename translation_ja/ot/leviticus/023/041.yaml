language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: ja
  text: あなたがたは、これをヤハウェのための祭りとして、毎年七日間祝わなければならない[a]。これは、あなたがたの代々にわたる永続する定めである[b]。第七の月に、これを祝わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェへの祭りとして」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「とこしえの定め」または「永久の定め」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: 祝うものとする
  rationale: חָגַגは巡礼祭を祝う、または祭りとして守ることを表す。現代日本語として自然でありつつ、命令・規定の力を示すため「祝うものとする」とし、原文で反復される動詞も同じ訳語で再現した。
- source_word: אֹתוֹ
  choice: これを
  rationale: 文脈上、直前から続く祭りを指す代名詞である。原文にない名詞を補わず、指示対象が分かる自然な日本語とした。
- source_word: חַג
  choice: 祭り
  rationale: חַגは、しばしば巡礼を伴う宗教的な祝祭を指す。「祭り」はレビ記の祭儀的文脈に適し、一般の読者にも明瞭である。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לは献呈・方向を表し、この祭りがヤハウェを対象として祝われることを示す。「ヤハウェのための」も可能なので脚注に示した。神名יהוהは固有名として「ヤハウェ」とした。
- source_word: שִׁבְעַת יָמִים בַּשָּׁנָה
  choice: 年に七日間
  rationale: 祭りの期間と年ごとの実施を簡潔に表す。בַּשָּׁנָהの字義的な「その年に／年に」を保ちつつ、自然な日本語にした。
- source_word: חֻקַּת עוֹלָם
  choice: 永続の定め
  rationale: חֻקָּהは定められた規定、עוֹלָםはこの法的・契約的文脈で継続的、恒久的な効力を表す。「永続の定め」はその持続性を示しつつ、哲学的な絶対的無時間性まで断定しない。
- source_word: לְדֹרֹתֵיכֶם
  choice: あなたがたにとって代々にわたる
  rationale: 後続する世代にも継続して適用されることを明確かつ自然に表した。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 第七の月に
  rationale: 祭りを行う時期を指定する時間表現を素直に訳した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は四文字神名יהוהを直接用いているため、称号に置き換えず、契約の神の固有名として「ヤハウェ」と表記した。
- issue: 祭儀法におけるעוֹלָםの効力
  choice: 永続の定め
  alternative: とこしえの定め、永久の定め
  rationale: この語は継続的・恒久的な拘束力を表すが、文脈上、抽象的な意味での絶対的永遠を必ずしも明示しない。「永続」は原文の強さを保ちながら過剰な限定を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀法としての荘重さと規定的な響きを「ものとする」で保った。原文にある「祝う」の反復を残し、神名は「ヤハウェ」とした。
