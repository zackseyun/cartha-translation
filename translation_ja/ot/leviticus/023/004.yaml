source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: ja
  text: これらはヤハウェの定められた時、すなわち聖なる集会である。あなたがたは、それらをそれぞれ定められた時に告げ知らせなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: これらは
  rationale: 後に続く一覧を指し示す複数形。日本語として自然になるよう主題を示す「は」を添えた。
- source_word: מוֹעֲדֵי
  choice: 定めの時
  rationale: מוֹעֵדは祭りだけでなく、定められた時や会合の時を広く指す。この章では安息日も含むため、「祭り」より広い「定めの時」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: 聖なる集会
  rationale: 聖別された召集・集会を表す句。現代の一般読者に明瞭でありつつ、礼拝のために招集される意味を保つ。
- source_word: תִּקְרְאוּ
  choice: 告げ知らせる
  rationale: ここでは単に名づけるのでなく、定められた聖日を公に宣言することを指す。「告げ知らせる」はその公的な宣告の意味を自然な日本語で表す。
- source_word: אֹתָם
  choice: もの
  rationale: 関係節の目的語が先行する「定めの時／聖なる集会」を受けることを、「ものである」という構文で自然に示した。
- source_word: בְּמוֹעֲדָם
  choice: それぞれ定められた時に
  rationale: 各々の行事に属する所定の時を意味する。「それぞれ」により複数の行事ごとの時であることを明示し、מוֹעֵדの反復も保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: ヘブライ語本文は称号ではなく四文字神名を用いているため、固有名として音写した。
- issue: מוֹעֵד の範囲
  choice: 定めの時
  alternative: 祭り
  rationale: レビ記23章では祝祭だけでなく安息日を含む聖なる時が扱われるため、意味を「祭り」に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「定めの時」と「定められた時」の反復によって原文のמוֹעֵדの反復を反映し、一文の関係節構造もできる限り維持した。
