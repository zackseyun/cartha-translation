  terminology: 「ヤハウェ」「聖なる集会」は適切です。「聖なる招集」は מִקְרָאֵי קֹדֶשׁ の有効な代替訳として注記に残せます。「定められた時」は「祭り」に限定せず、מוֹעֵד の語義範囲を保ちます。
