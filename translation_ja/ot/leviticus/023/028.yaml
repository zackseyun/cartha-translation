id: LEV.23.28
reference: Leviticus 23:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: ja
  text: まさにこの日には、いかなる仕事もしてはならない。この日は贖いの日であり、あなたがたの神ヤハウェの前で、あなたがたのために贖いを行うための日である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: どのような仕事もしてはならない
  rationale: 祭日規定におけるמְלָאכָהは労働・仕事を指す。「どのような…も…ない」によりכָלを反映し、法的禁止を明確で自然な現代日本語にした。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: この同じ日には
  rationale: עֶצֶםを含む慣用句は、その日そのものを強調する。「この同じ日」で時間指定の強調を保った。
- source_word: כִּי
  choice: だからである
  rationale: 仕事を禁じる理由を導く接続詞として、後続節との因果関係を明示した。
- source_word: יוֹם כִּפֻּרִים
  choice: 贖いの日
  rationale: 祭日の名称として日本語で理解しやすく、כפרの祭儀的意味を保つ。原文のכִּפֻּרִיםが複数形であることは脚注に示した。
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: あなたがたのために贖いを行う
  rationale: ピエル不定詞の祭儀的行為を「贖いを行う」とし、עַלが示す対象・受益者を「ために」で表した。贖いの仕組みを特定の後代的理論に限定していない。
- source_word: לִפְנֵי
  choice: 前で
  rationale: ヤハウェの臨在のもとでなされる祭儀という空間的・関係的意味を簡潔に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称男性複数接尾辞を「あなたがたの」とし、ヤハウェとの同格的な契約表現に従って単数の「神」とした。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、称号「主」で代替せず、「ヤハウェ」と音写した。
- issue: כפרおよびכִּפֻּרִיםの祭儀的意味
  choice: 贖い／贖いの日
  alternative: 償い／清め／贖罪の日
  rationale: 祭儀的な罪の処理と関係回復を含み得る語義の幅を保ちつつ、特定の贖罪理論へ狭めない表現とした。複数形の形態は脚注で保持した。
- issue: לְכַפֵּרの目的関係
  choice: 贖いを行う日
  alternative: 贖うためである
  rationale: この不定詞は「贖いの日」の目的・機能を示す。日本語では「日」を補って結び付けることで、誰が儀式を執行するかを原文以上に限定しないようにした。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法令調。「してはならない」で禁止の強さを保ち、「である」調で祭儀規定としての厳粛さを表した。
