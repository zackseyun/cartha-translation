revisions:
- from: まさにこの日に、あなたがたは布告しなければならない。この日は、あなたがたにとって聖なる集会[a]となる。どのような労働もしてはならない[b]。これは、あなたがたがどこに住んでいても、代々守るべき永続する定め[c]である。
  to: まさにこの日に、あなたがたは聖なる集会[a]を布告しなければならない。労働を伴う仕事は一切してはならない[b]。これは、あなたがたのすべての居住地において、代々守るべき永続する定め[c]である。
  rationale: 聖なる集会を「布告する」という原文の構文を回復した。「あなたがたがどこに住んでいても」を「あなたがたのすべての居住地において」として、בְּכָל מוֹשְׁבֹתֵיכֶםの場所に関する法的な全域性を直接的に表した。労働禁止は「労働を伴う仕事」として、あらゆる活動一般を禁ずる表現にせず、原文の限定を保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:24:11Z'
