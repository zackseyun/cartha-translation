id: LEV.23.21
reference: Leviticus 23:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: ja
  text: まさにこの日に、あなたがたは聖なる集会[a]を布告しなければならない。労働を伴う仕事は一切してはならない[b]。これは、あなたがたのすべての居住地において、代々守るべき永続する定め[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる召集」または「聖なる会合」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「労働・奉仕の仕事は一切」。通常の労働を指す法的表現。
    reason: lexical_alternative
  - marker: c
    text: 「恒久の定め」または「いつまでも続く定め」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: 布告しなければならない
  rationale: קראの公的・祭儀的な宣言の意味を表し、単に「呼ぶ」ではなく、その日と集会を正式に告げる行為として訳した。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにこの日に
  rationale: עֶצֶםによる時の強調を、現代日本語で自然な「まさに」によって保持した。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会
  rationale: 正式に召集される祭儀的な集まりを指す定型句であり、専門性を残しつつ一般読者にも明瞭な表現とした。
- source_word: יִהְיֶה לָכֶם
  choice: あなたがたにとって…となる
  rationale: その日がイスラエルにとって何として定められるかを示す述語構造を明示した。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: どのような労働も
  rationale: 通常の労働・奉仕に属する仕事を禁じる表現であり、あらゆる行為を無差別に禁じる「何もしてはならない」とはしなかった。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: 法的定型句として、世代を越えて継続する効力を表す。形而上学的な含意を過度に加えず、עוֹלָםの持続性を保持した。
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: あなたがたがどこに住んでいても
  rationale: イスラエルのすべての居住地に及ぶ分配的な意味を、明瞭な現代日本語で表した。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々守るべき
  rationale: 後続する各世代への継続的な適用を、日本語の法規的文脈に自然な形で示した。
theological_decisions:
- issue: 祭日の労働禁止の範囲
  choice: 「どのような労働もしてはならない」と訳す。
  alternative: 「どのような仕事もしてはならない」または「通常の仕事をしてはならない」
  rationale: כָּל מְלֶאכֶת עֲבֹדָהは労働・奉仕に属する仕事を指す法的表現であり、あらゆる活動を一律に禁じるようには訳さない。一方、「通常の」と本文に補うことも避け、語句の幅を脚注で示した。
- issue: עוֹלָםの時間的射程
  choice: 「永続する定め」と訳す。
  alternative: 「永遠の定め」または「恒久の定め」
  rationale: 契約法の定型句が示す継続性を保持しつつ、「永遠」が招き得る絶対的・形而上学的な限定を本文で断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法本文にふさわしい端正な法規的調子を保った。「布告」「定め」により公的性格を示し、過度に古風な語尾や教派固有の術語は避けた。
