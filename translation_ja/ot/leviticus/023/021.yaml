  naturalness: 現代日本語としておおむね明瞭だが、独立した「布告しなければならない」の後に「この日は…集会となる」と続ける表現は不自然で、意味関係も曖昧になる。目的語を明示して一文に整えるのが自然である。
  terminology: 「聖なる集会」「定め」は適切である。「永続する定め」もעוֹלָםの法的・世代的継続性を無理なく表す。「労働を伴う仕事」により、禁止対象が単なるあらゆる行為ではなく、労働・奉仕の仕事であることを本文で保てる。
