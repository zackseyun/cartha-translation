id: LEV.23.25
reference: Leviticus 23:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: ja
  text: いかなる労働もしてはならない。また、ヤハウェに火によるささげ物[a]を献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物のささげ物」または「火のささげ物」。
    reason: 祭儀用語 אִשֶּׁה には、「火によるささげ物」とする伝統的理解と、祭壇に供される「食物のささげ物」とする理解があるため。
lexical_decisions:
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: いかなる労働もしてはならない
  rationale: כָּל ... לֹא の全面的な禁止を自然な日本語の「いかなる…も…ない」で表した。מְלֶאכֶת עֲבֹדָה は、あらゆる動作ではなく日常の労働・務めを指すため、簡潔に「労働」とした。
- source_word: וְהִקְרַבְתֶּם
  choice: また、…献げなさい
  rationale: 祭儀的文脈における קרב のヒフィル形は、供え物として差し出すことを表す。「献げる」は現代日本語で自然にその意味を伝える。接続詞 וְ は文脈に即して「また」とした。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭壇の火に関係する祭儀用語として、語の形と伝統的理解を明瞭に反映した。この語を「食物のささげ物」と理解する可能性は脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に記された神の固有名 יהוה を音写し、契約の神の名であることを保持した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、称号に置き換えず「ヤハウェ」とした。
- issue: 祭儀用語 אִשֶּׁה の理解
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 語源と厳密なニュアンスには議論があるため、本文では火との関係を示す伝統的な訳を採り、祭壇に供される「食物」という祭儀的理解を脚注で示して、曖昧さを隠さないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法の命令としての強さを「してはならない」「献げなさい」で表し、古風すぎる祭儀語は避けた。
