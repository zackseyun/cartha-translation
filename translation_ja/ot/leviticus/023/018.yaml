reference: Leviticus 23:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ja
  text: また、そのパンとともに[a]、傷のない一歳の雄の子羊七匹、雄牛一頭、雄羊二匹を献げなさい。これらは、それらの穀物の献げ物と注ぎの献げ物を伴う、ヤハウェへの全焼の献げ物、すなわち火による献げ物[b]であり、ヤハウェに喜ばれる香りである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そのパンに加えて」「そのパンの上に」とも訳せる。ヘブライ語の前置詞は、この文脈ではパンに伴って、またはそれに加えて献げることを表すとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「食物の献げ物」とも訳される。ヘブライ語は、火によって献げられる供え物を指すとも理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: 献げなさい
  rationale: 祭儀文脈におけるקרבのヒフィル形で、供え物を神の前に持って来て差し出す行為を表す。現代日本語では「献げる」が自然で簡潔。
- source_word: עַל הַלֶּחֶם
  choice: そのパンとともに
  rationale: עַלは字義的には「上に」も表すが、ここでは前節のパンに伴って動物を献げる意味と判断した。物理的にパンの上へ置くとの誤解を避けつつ、別解は脚注に残した。
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: 傷のない一歳の雄の子羊七匹
  rationale: 祭儀上の完全性、年齢、動物の種類と性を明確に反映した。תָּמִיםはこの文脈で「傷のない」とした。
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: 牛の群れから若い雄牛一頭
  rationale: פַר בֶּן־בָּקָרの牛科家畜に属する若い雄牛という語感を、日本語で過度に専門的にならずに表した。
- source_word: וְאֵילִם שְׁנָיִם
  choice: 雄羊二匹
  rationale: אַיִלは成長した雄羊を指すため、「雄羊」が正確で自然。
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: ヤハウェへの全焼の献げ物
  rationale: עֹלָהは祭壇で全体を焼く祭儀用語であり、「全焼の献げ物」として通常の献げ物と区別した。単数形は列挙された動物全体を集合的に受ける。
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: その穀物の献げ物と注ぎの献げ物とを伴う
  rationale: מִנְחָהとנֶסֶךְを、それぞれ祭儀上の穀物奉献と液体を注ぐ奉献として明瞭に訳し、動物の全焼の献げ物に伴う関係を示した。
- source_word: אִשֵּׁה
  choice: 火による献げ物
  rationale: 語の中心にある火によって献げる祭儀的性格を保持した。「食物の献げ物」という解釈的表現より原文に近い。
- source_word: רֵיחַ נִיחֹחַ
  choice: 喜ばせる香り
  rationale: נִיחֹחַは神に受け入れられ、喜ばれる香りを示す定型句。「心地よい香り」より、神がその受け手である点を自然に示した。
- source_word: לַיהוָה
  choice: ヤハウェへ／ヤハウェを
  rationale: 神名יהוהを称号に置換せず「ヤハウェ」と音写し、各句の日本語構文に応じた助詞を用いた。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の契約名が明記されているため、それを称号へ置き換えず、現代日本語で一般的な学術的音写を用いた。
- issue: רֵיחַ נִיחֹחַが示す神の応答
  choice: ヤハウェを喜ばせる香り
  alternative: ヤハウェへの心地よい香り
  rationale: 原文の定型表現を神が供え物を受け入れて喜ぶこととして表したが、物質的な香りそのものを神が必要とするとの含意は加えていない。
- issue: אִשֵּׁהの意味
  choice: 火による献げ物
  alternative: 食物の献げ物
  rationale: 語源・祭儀文脈に即して火の要素を明示し、神の食物という比喩的理解に限定しなかった。別の訳し方を脚注に示した。
translation_notes:
  register: 現代標準日本語の明瞭さを保ちつつ、祭儀用語には「全焼の献げ物」「穀物の献げ物」「注ぎの献げ物」を用いて区別した。命令は文脈に合う「献げなさい」とし、荘重さは保ちながら古語的な表現を避けた。
