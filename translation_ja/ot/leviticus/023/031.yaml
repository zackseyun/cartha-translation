source:
  edition: WLC
  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ja
  text: どんな仕事もしてはならない。これは、あなたがたが代々にわたり、すべての居住地[b]で守るべき、永続する定め[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「永遠の定め」または「いつまでも続く定め」。ヘブライ語の עוֹלָם は、長く続くことや永続することを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すべての定住地で」または「どこに住んでいても」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: どんな仕事もしてはならない
  rationale: כָּל と否定の組み合わせが仕事全般を禁じることを、自然な現代日本語の包括表現「どんな仕事も」で示した。法規上の禁止を「してはならない」で表した。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: חֻקָּה の法的な意味を「定め」で、עוֹלָם の継続的・恒久的な時間幅を「永続する」で表した。絶対的な無時間性まで断定しない。
- source_word: לְדֹרֹתֵיכֶם
  choice: あなたがたが代々にわたり
  rationale: 後の世代へ継続して適用される意味を、明瞭で自然な日本語にした。
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: すべての居住地で
  rationale: מוֹשָׁב の居住地・定住地という場所的意味と、כֹּל の包括性を保った。
theological_decisions:
- issue: 祭儀法における עוֹלָם の期間
  choice: 永続する定め
  alternative: 永遠の定め／いつまでも変わらない定め
  rationale: 契約共同体の世代を通じて継続する法的効力を保ちつつ、ヘブライ語が必ずしも要求しない哲学的な絶対永遠性を訳文で確定しないため。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法規的文体。「守るべき」はヘブライ語の名詞文が示す規範性を日本語で自然に補った。脚注記号は対応する語句の直後に置いた。
