  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: ja
  text: 雄やぎ一匹を罪のためのいけにえ[a]として、一歳の雄の子羊二匹を平和のいけにえ[b]として献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清めのいけにえ」。
    reason: lexical_alternative
  - marker: b
    text: または「交わりのいけにえ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 献げなさい
  rationale: 基本義は「行う、作る」だが、ここでは動物を特定の祭儀的ないけにえとする文脈なので、現代日本語では「献げる」が自然である。
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: 雄やぎ一匹
  rationale: 雄であることと数量を明確に保ち、日本語として自然な語順にした。
- source_word: לְחַטָּאת
  choice: 罪のためのいけにえ
  rationale: 祭儀上の名称として広く理解でき、同時にヘブライ語が持つ罪と清めの関係を一方的に限定しすぎない表現とした。別訳は脚注に示す。
- source_word: וּשְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: さらに一歳の雄の子羊二匹
  rationale: 年齢、性、頭数を明示した。「さらに」は接続詞の付加的な流れを自然に表す。
- source_word: לְזֶבַח שְׁלָמִים
  choice: 交わりのいけにえ
  rationale: זֶבַחの屠って献げるいけにえという祭儀的意味を「いけにえ」で表し、שְׁלָמִיםは供食と関係性を示す祭儀区分として「交わり」とした。「和解のいけにえ」も脚注に残す。
theological_decisions:
- issue: חטאת の祭儀的名称
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: この語は罪に関わるいけにえを指す一方、清めの機能も強調されうる。本文では伝統的理解との連続性を保ち、別の機能的理解を脚注に示して緊張を保存した。
- issue: שְׁלָמִים の祭儀的名称
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ
  rationale: 語の含意には平和、健全さ、共食による交わりなどがあり、一語で確定しにくい。本文では現代日本語で祭儀の共同性を比較的伝えやすい訳を採り、別訳を脚注に示した。
translation_notes:
  register: 律法本文にふさわしい簡潔で dignified な命令文としつつ、古風な「ささげよ」ではなく現代標準語の「献げなさい」を用いた。助数詞を付けて一般読者にも数量を明瞭にした。
