    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一日には
  rationale: 定冠詞を伴う序数を自然な時の表現として訳し、祭りの最初の日を示した。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会
  rationale: מִקְרָא の召集・集会という祭儀的意味と、קֹדֶשׁ の聖別された性格を、現代日本語で明瞭に表した。
- source_word: יִהְיֶה לָכֶם
  choice: あなたがたのために……がある
  rationale: 存在を表す構文と לָכֶם の受益・関係のニュアンスを保ち、「開かなければならない」のような動作を原文以上に明示しなかった。
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: 通常の労働は一切
  rationale: כָּל の全面的な禁止を「一切」で示しつつ、祭日法規における連語 מְלֶאכֶת עֲבֹדָה を、あらゆる行為ではなく通常の労働を指す表現として訳した。
- source_word: לֹא תַעֲשׂוּ
  choice: してはならない
  rationale: 法規における לֹא と未完了形の禁止命令を、簡潔で格調ある現代日本語にした。
theological_decisions:
- issue: מְלֶאכֶת עֲבֹדָה が禁じる範囲
  choice: 通常の労働を禁じる
  alternative: あらゆる仕事・行為を例外なく禁じる
  rationale: 原文は「仕事」を表す語だけでなく「労働／奉仕」を伴う定型句を用いているため、祭日における通常の労働の禁止という限定を保ち、禁止範囲を不必要に広げなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、レビ記の法規にふさわしい簡潔で厳かな調子を保った。「聖なる集会」は一般読者にも理解しやすく、祭儀的な響きも残す。
