base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 話者が神であることにふさわしい敬意を保ちつつ、後続する発言内容を導入する定型句として、現代日本語で自然に表した。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神名四文字יהוהを、日本語聖書で広く理解される伝統的な代置表現「主」で示し、原文が固有の神名であることは脚注で明記した。
- source_word: אֶל
  choice: に
  rationale: 発話の相手を示す前置詞を、自然な日本語の格助詞で表した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を用いた。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 日本語では「告げられた」が後続する直接話法を十分に導くため、「言って」を重ねると不自然になる。意味は発話導入表現全体に含めた。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: 主[a]
  alternative: ヤハウェ／エホバ
  rationale: 本文の読みやすさと日本語での定着を重視して「主」としつつ、原文が称号ではなく神名YHWHであること、また代表的な音写があることを脚注で保持した。
translation_notes:
  register: 簡潔な神託導入句として、明瞭で現代的かつ品位ある文体を採用した。「言われた」よりも内容伝達を明確にする「告げられた」を用い、原文のוַיְדַבֵּר…לֵאמֹרを日本語として自然な一文にまとめた。
