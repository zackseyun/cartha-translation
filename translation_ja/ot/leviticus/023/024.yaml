base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: ja
  text: イスラエルの子らに告げなさい。『第七の月の一日には、あなたがたにとって、厳粛な休み、響き渡る合図の音の記念[a]、聖なる集会となる。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「角笛の音の記念」とも訳せる。ヘブライ語は、叫び声や歓声、角笛などの、高く響く合図の音を広く指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保ちつつ、契約共同体全体を指す集合的用法として自然に読める形にした。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בְּאֶחָד לַחֹדֶשׁ
  choice: 第七の月、その月の一日には
  rationale: ヘブライ語の暦上の表現を、意味を補いすぎず明瞭な現代日本語にした。
- source_word: שַׁבָּתוֹן
  choice: 安息の日
  rationale: 通常の営みをやめて特別に守る休止を表す語として、祭儀的文脈にふさわしく簡潔に訳した。
- source_word: זִכְרוֹן
  choice: 記念する日
  rationale: 何かを覚えるための記念・記念行為という意味を、この暦規定の文脈で自然に表した。
- source_word: תְּרוּעָה
  choice: 響き渡る音
  rationale: 叫び声にも角笛などの吹奏音にもなり得る語なので、本文では音源を限定せず、脚注で語義の幅を示した。
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会の日
  rationale: 聖なるものとして召集される会衆の集まりを指す定型的な祭儀表現として訳した。
theological_decisions:
- issue: 祭日の名称における תְּרוּעָה の性質
  choice: 本文では「響き渡る音」とし、音源を限定しない
  alternative: 角笛の音／ラッパの音／歓声
  rationale: 語そのものは叫び、歓声、警報音、角笛などの高く響く合図の音を含み得る。祭儀的文脈では角笛の音が有力だが、原文が楽器を明記しないため、その曖昧さを保持した。
- issue: זִכְרוֹן תְּרוּעָה の統語関係
  choice: 「響き渡る音によって記念する日」
  alternative: 響き渡る音の記念／記念の響き
  rationale: 連語の簡潔さを保ちながら、音を伴う記念の祭日という関係を自然な日本語で示した。何を記念するのかは原文同様に特定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、律法の告知にふさわしい簡潔で荘重な文体とした。「しなければならない」で規定としての力を示し、祭儀用語は過度に専門的にしなかった。
