source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: ja
  text: あなたがたは七日間、仮小屋[a]で暮らさなければならない。イスラエル人として生まれた者は皆、仮小屋で暮らさなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「仮の住まい」。ヘブライ語は、祭りのために設ける一時的な小屋を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: 仮小屋で
  rationale: סֻכּוֹתは祭りの期間に用いる一時的な小屋を指す。「仮小屋」は具体的な像を保ちつつ、現代日本語で分かりやすい。
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: 暮らさなければならない
  rationale: ישׁבは本来「座る」の意を持つが、ここでは一定期間そこを住まいとして過ごすことを指す。「暮らす」は居住の意味を自然に表し、二つの節で反復も保つ。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表すヘブライ語を、自然で直接的な日本語の期間表現にした。
- source_word: כָּל הָאֶזְרָח
  choice: 生まれながらの者は皆
  rationale: אֶזְרָחは寄留者とは区別される共同体の生来の成員を指す。現代的な政治制度を連想させやすい「市民」を避け、男性だけに限定しない代表的用法も保った。
- source_word: בְּיִשְׂרָאֵל
  choice: イスラエルの
  rationale: イスラエルに属する共同体の範囲を簡潔に示す。単に出生地だけを指すと断定しない表現を選んだ。
theological_decisions:
- issue: הָאֶזְרָחの範囲と性別
  choice: イスラエルの生まれながらの者は皆
  alternative: イスラエルで生まれた男は皆
  rationale: 文法上は男性単数だが代表的な総称として用いられており、命令の対象を男性だけに限定しない。また、地理的な出生地だけを意味すると決めつけず、イスラエル共同体の生来の成員という含みを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。命令形は律法の規定として自然な「なければならない」とし、古風な「住まねばならない」は避けた。「仮庵」という慣用的な聖書用語よりも、一般読者に具体像が伝わる「仮小屋」を本文に採用した。
