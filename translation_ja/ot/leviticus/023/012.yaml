source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: ja
  text: あなたがたは、その穀物の束[a]を揺り動かす日に、傷のない一歳の雄の子羊一頭を、焼き尽くすいけにえとしてヤハウェに献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「オメル」とも訳せる。ここでは、乾量単位ではなく、奉献の儀式で差し出す穀物の束を指すと考えられる。
    reason: עֹמֶר には穀物の束と乾量単位の両義があり、音写する訳も可能なため。
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 献げなければならない
  rationale: 動詞 עשה は本来「行う、作る」だが、ここではいけにえについて用いられており、祭儀上の意味を自然な日本語で表した。接続する完了形の命令的用法も反映した。
- source_word: בְּיוֹם הֲנִיפְכֶם
  choice: 揺り動かして献げる日に
  rationale: נוף のヒフィル形が表す祭儀的な「揺り動かす」動作を保ちつつ、それが奉献の所作であることが日本語で明瞭になるようにした。
- source_word: הָעֹמֶר
  choice: その穀物の束
  rationale: この収穫祭の文脈では、乾量単位よりも儀礼で差し出す穀物の束を指すと考えられる。「オメル」という音写の可能性は脚注に残した。
- source_word: כֶּבֶשׂ
  choice: 雄の子羊一頭
  rationale: 犠牲動物としての子羊を表し、ヘブライ語名詞が示す雄性と単数を明示した。
- source_word: תָּמִים
  choice: 傷のない
  rationale: 犠牲動物に欠陥がないことを意味する祭儀上の用法を、現代日本語で明確に表した。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 直訳的には「その年の子」であり、「生後一年以内」の可能性もあるが、日本語の犠牲規定として簡潔で自然な年齢表現を採用した。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえとして
  rationale: עֹלָה は祭壇で全体を焼くいけにえを指す専門語であり、その性格が一般読者にも伝わる訳語とした。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名 יהוה を称号に置き換えず、固有の契約名として音写した。前置詞 לְ は、いけにえの向かう相手を示す「に」とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名 יהוה を用いているため、称号へ置換せず、一般的な学術的復元に基づく「ヤハウェ」とした。
- issue: עֹלָה の祭儀的意味
  choice: 焼き尽くすいけにえ
  alternative: 全焼のいけにえ、焼燔祭
  rationale: いけにえ全体を祭壇で焼く種類であることを示しつつ、特定教派の伝統語や現代では難解な漢語を避けた。
translation_notes:
  register: 律法の規定にふさわしい簡潔で荘重な文体としつつ、「焼き尽くすいけにえ」など、一般の現代日本語話者にも意味が伝わる表現を用いた。祭儀動作は「揺り動かして献げる」として、原語の具体性と日本語での明瞭さを両立させた。
