id: LEV.23.17
reference: Leviticus 23:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: ja
  text: あなたがたの住む所から、揺り動かしてささげるためのパンを二個持って来なければならない。それらは、上等の小麦粉、十分の二エファ[a]で作られ、パン種を入れて焼かなければならない[b]。ヤハウェにささげる初物である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「十分の二」。祭司文書の度量衡では、エファの十分の二を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「発酵させて焼く」。原文は、この初物のパンがパン種を用いたものであることを明記している。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: あなたがたの住む所から
  rationale: מוֹשָׁבは居住地・住む場所を表す。具体的な起点を保ちつつ、現代日本語として自然にした。
- source_word: תָּבִיאוּ
  choice: 持って来なければならない
  rationale: 祭儀規定における命令の力を、明瞭な現代日本語で示した。
- source_word: לֶחֶם תְּנוּפָה
  choice: 揺り動かしてささげるパン
  rationale: תְּנוּפָהが指す祭儀上の動作を保持しつつ、「揺祭」のような一般読者に分かりにくい専門語を避けた。
- source_word: שְׁתַּיִם
  choice: 二個
  rationale: 形は単数のלֶחֶםに二という数詞が付くため、日本語では個数を明示して自然に表した。
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: 十分の二エファ
  rationale: 原文は文字どおりには「十分の二」だが、祭司文書の度量衡ではエファの十分の二を意味するため、本文で単位を補い脚注で明示した。二個全体か各個かを本文で断定せず、原文の範囲を保った。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 穀物のささげ物に用いる精製された良質の粉を、一般読者に分かる表現で示した。
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: パン種を入れて焼く
  rationale: חָמֵץの発酵した状態と、תֵּאָפֶינָהの「焼かれる」という意味を自然な日本語で表した。
- source_word: בִּכּוּרִים
  choice: 初物
  rationale: 収穫の最初の産物を神にささげる祭儀的意味を簡潔に保持した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לの献納・帰属の関係を示し、神名יהוהを固有名として音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として示し、普通名詞的な称号へ置き換えなかった。
- issue: 祭儀用語 תְּנוּפָה の表現
  choice: 揺り動かしてささげる
  alternative: 揺祭／奉献物
  rationale: 特定の祭儀動作を伝えながら、その方法や神学的意味を原文以上に限定せず、一般読者にも理解できる動詞表現とした。
- issue: 二個のパンと十分の二エファとの数量関係
  choice: 各個とは明示しない
  alternative: それぞれ十分の二エファ
  rationale: ヘブライ語は「二個のパン」と「十分の二」を述べるが、十分の二が各個の分量であるとは明示していないため、解釈を本文に加えなかった。
translation_notes:
  register: 律法の規定にふさわしい簡潔で dignified な文体を用いつつ、「揺祭」など説明なしでは分かりにくい術語を避けた。「持って来なければならない」で命令性を明示し、文を短く区切って現代の一般読者が理解しやすい形にした。
