  terminology: 「主」および神名注は適切である。「全焼のささげ物」「穀物のささげ物」「いけにえ」「注ぎのささげ物」も一貫している。אִשֶּׁהは本文で「火によるささげ物」とし、語義上の議論は脚注で限定的に示すのが原文への忠実さを保つ。
