revisions:
- from: これらは主[a]の定められた時であり、あなたがたはこれを聖なる集会として告げ知らせなければならない。その時には、主に食物のささげ物[b]、すなわち、全焼のささげ物と穀物のささげ物、いけにえと注ぎのささげ物を、それぞれの日に定められたとおりに献げる。
  to: これらは主[a]の定められた時である。あなたがたはこれらを聖なる集会として宣言し、主に火によるささげ物[b]、すなわち、全焼のささげ物と穀物のささげ物、いけにえと注ぎのささげ物を、日ごとに、その日に定められたものとして献げなければならない。
  rationale: ヘブライ語の祭儀用語אִשֶּׁהを通常の意味に従って「火によるささげ物」とした。複数の祭期を受ける「これら」と「聖なる集会として宣言する」を明確にし、原文にない「その時には」を除いた。末尾は「日ごとに、その日に定められたものとして」として、日ごとの所定の供え物という原文の表現を保った。英語監査訳の「food offering」は参照したが、原語の通常の用法を優先した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:24:30Z'
