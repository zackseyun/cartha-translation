source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: ja
  text: これらは主[a]の定められた時である。あなたがたはこれらを聖なる集会として宣言し、主に火によるささげ物[b]、すなわち、全焼のささげ物と穀物のささげ物、いけにえと注ぎのささげ物を、日ごとに、その日に定められたものとして献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、神の固有の名「יהוה（YHWH）」。
    reason: 本文の「主」が一般的な称号ではなく神名を指すことを示すため。
  - marker: b
    text: 「火によるささげ物」と訳した語は、伝統的にこの意味に理解される。語源や「食物の供え物」との関係については議論がある。
    reason: אִשֶּׁהの通常の祭儀的意味を本文で保ちつつ、語義に関する不確実性を過度に断定せず示すため。
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: 定められた時
  rationale: 語根が示す「指定・約定された時」を自然な現代日本語で表し、単なる祭りの名称に限定しなかった。
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: 聖なる集会
  rationale: 公に召集された聖別された集まりを指す定型句として、簡潔で理解しやすい表現を採った。
- source_word: אִשֶּׁה
  choice: 食物のささげ物
  rationale: 文脈上、主に献げる供物の総称として訳した。ただし語形自体は通常「火によるささげ物」と理解されるため脚注で示した。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 祭壇上で全体を焼く供犠の種類を明示する、一般読者にも分かりやすい訳語。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀文脈における穀物を中心とした供物を明確にした。
- source_word: זֶבַח
  choice: いけにえ
  rationale: 屠って献げる供犠を表す自然で伝統的な日本語を用いた。
- source_word: נְסָכִים
  choice: 注ぎのささげ物
  rationale: 液体を注いで献げる祭儀行為が伝わる表現とした。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: それぞれの日に定められたとおりに
  rationale: 直訳的な「一日の事をその日に」が意味する、各日に割り当てられた供物をその日に献げるという趣旨を自然に表した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語聖書で広く理解される表記を本文に置き、原文が固有の神名であることを脚注に明記して情報を保持した。
- issue: אִשֶּׁהの意味
  choice: 食物のささげ物
  alternative: 火によるささげ物
  rationale: 直後に複数の供物が列挙される総括表現として「食物のささげ物」を採用したが、語の通常の理解である「火によるささげ物」も脚注に残し、語義上の緊張を隠さなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献げる」「ささげ物」を用いて祭儀文脈を統一し、過度に古風な言い回しは避けた。命令的な未完了形は「なければならない」で表した。
