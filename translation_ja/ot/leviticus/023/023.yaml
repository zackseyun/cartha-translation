base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/023.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「YHWH」。別に「エホバ」とも表記される。
    reason: 神名の原綴りと別表記を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: דברのワウ連続形で、新たな神の発言を導入する定型表現。日本語では、権威ある伝達を自然かつ端正に表す「告げた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語יהוהを、称号に置き換えず音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 前置詞אֶלは発言の相手を示すため、現代日本語で自然な「モーセに」とした。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後続する発言内容を導く不定詞の定型用法。日本語では「こう告げた」として、その機能を自然に表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: エホバ、または「主」
  rationale: 本文が固有の神名を明記していることを保つため、「主」という称号への置換を避けた。発音の再建には不確実性があるため、別表記は脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語。「こう告げた」により、ヘブライ語の定型的な発言導入を簡潔で自然に表現した。
