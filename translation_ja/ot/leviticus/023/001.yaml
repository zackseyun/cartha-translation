  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに語って言われた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では神の固有名を表す「YHWH」。本文では「ヤハウェ」と音写した。伝統的な日本語訳では「主」と訳される。
    reason: 神名יהוהの原語と本文訳の関係、および伝統的な訳し方を明示するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進めつつ神の発話を導入する定型表現。日本語では「語った」よりも、続く内容を正式に伝える文脈に自然である。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語であり、日本語聖書で広く定着した敬称「主」を本文に用い、原語について脚注で明示する。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を、自然な現代日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: （「告げた」に含める）
  rationale: 後続する発言内容を導くヘブライ語の定型句。単独で「言って」と重ねず、日本語では「告げた」に統合することで自然に内容が続く形とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 本文では「主」、脚注で「YHWH（ヤハウェ）」と示す
  alternative: 本文で「ヤハウェ」
  rationale: 原文が称号ではなく神名を用いている事実を脚注で保持しつつ、明瞭で品位ある現代日本語と日本語聖書の定着した慣用に従った。
translation_notes:
  register: 簡潔で荘重な律法本文の導入句とした。ヘブライ語の「語って、言った」に相当する重なりは、現代日本語で不自然にならないよう一つの述語にまとめた。
