base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: ja
  text: ヤハウェの安息日[a]とは別に、あなたがたの贈り物とは別に、あなたがたのすべての誓願とは別に、また、あなたがたがヤハウェに献げるすべての自発のささげ物[b]とは別に。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とは別に」は、文脈によって「に加えて」とも訳せる。この表現はこの節で四度繰り返されている。
    reason: lexical_alternative
  - marker: b
    text: 「自発のささげ物」は、義務としてではなく、自ら進んで献げるささげ物を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: מִלְּבַד
  choice: とは別に
  rationale: 直前に規定された祭りのささげ物に追加される別枠のものを示す。ヘブライ語で四度繰り返される構造を日本語でも保った。文脈上は「に加えて」の意味を含み得るため、脚注で示した。
- source_word: שַׁבְּתֹת יְהוָה
  choice: ヤハウェの安息日
  rationale: 複数形は複数の安息日を集合的に指すため、日本語では自然な単数形の類称「安息日」とした。構成関係を「ヤハウェの」で表した。
- source_word: מַתְּנוֹתֵיכֶם
  choice: あなたがたの贈り物
  rationale: 神に差し出す物を広く表す語であり、原文以上に祭儀上の種類を限定しない表現とした。
- source_word: כָּל נִדְרֵיכֶם
  choice: あなたがたのすべての誓願によるささげ物
  rationale: נֶדֶר は誓願そのもの、または誓願した物を表し得る。この祭儀的列挙では献げられる物が念頭にあるため「誓願によるささげ物」とした。
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: あなたがたのすべての自発のささげ物
  rationale: 祭儀の文脈における、義務ではなく自発的に献げる供え物を明確に表した。
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: すなわち、あなたがたがヤハウェに献げるもの
  rationale: 関係節が列挙されたささげ物を受けることを自然な日本語で示した。נתן はこの文脈では「献げる」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の契約名を固有名として明示し、称号へ置換しなかった。
- issue: מִלְּבַד が示す関係
  choice: とは別に
  alternative: に加えて
  rationale: 語の基本的な分離の意味を保ちつつ、この文脈では祭りの規定に追加される義務・献げ物を指すという含意を脚注に残した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調ある祭儀用語を用いた。原文が前節から続く従属的な列挙であることを尊重し、日本語でも独立した主節を補わずに訳した。
