  yaml_path: translation/ot/leviticus/023/033.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに次のように告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進める連続形で、新たな神の発話を導入する定型表現。日本語では「語った」よりも、後続する命令・告知を自然に導く「告げた」が明瞭である。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語。日本語聖書で広く理解される「主」を本文に用い、原語がYHWHであることと別表記を脚注で明示する。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を、自然な現代日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: （独立して訳出せず）
  rationale: 後続する発言内容を導くヘブライ語の定型的不定詞。日本語では「言って」「こう言われた」を重ねず、「告げた」で機能を自然に包含できる。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文「主」、脚注で「YHWH（ヤハウェ／エホバ）」
  alternative: 本文で「ヤハウェ」または「エホバ」
  rationale: 原文が称号ではなく神名を用いる事実を脚注で保持しつつ、本文は自然で広く通用する日本語とした。発音の再構成には不確実性があるため、特定の読みだけを無注記で確定しない。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。原文の発話導入句を、日本語で冗長にならない定型表現に整えた。
