  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: ja
  text: イスラエルの子らにこう告げなさい。『この第七の月の十五日は、ヤハウェのための仮小屋の祭り[a]であり、七日間行われる。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「仮庵の祭り」と呼ばれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: イスラエルの子らに告げなさい
  rationale: 命令形と定型的な引用導入を、現代日本語として自然な形にまとめた。「子ら」は בְּנֵי の表現を保ちつつ、契約共同体を集合的に指す。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: この第七の月の十五日から
  rationale: ヘブライ語の日付指定と指示語「この」を保持した。「から」は、続く「七日間」と自然につなぎ、祭りの期間の開始日であることを明確にする。
- source_word: חַג הַסֻּכּוֹת
  choice: 仮小屋の祭り
  rationale: סֻכּוֹת が指す一時的な小屋・覆いを、現代の一般読者に分かりやすく表した。伝統的名称は脚注に残した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 祭りの継続期間を簡潔かつ明確に示す。
- source_word: לַיהוָה
  choice: ヤハウェのための
  rationale: 神名 יהוה を音写し、前置詞 ל の献呈・方向性を「のための」で表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の契約名を本文で明示し、称号への置換を避けた。
- issue: 祭り סֻכּוֹת の名称
  choice: 仮小屋の祭り
  alternative: 仮庵の祭り
  rationale: 原語の具体的意味を現代語で伝えることを優先し、よく知られた伝統的名称は脚注で示した。
translation_notes:
  register: 律法の告知にふさわしい簡潔で dignified な文体としつつ、「仮小屋」によって現代の一般読者にも祭名の具体像が伝わるようにした。引用符で、モーセへの命令とイスラエルへの告知内容を区別した。
