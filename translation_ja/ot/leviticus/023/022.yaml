reference: Leviticus 23:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: ja
  text: あなたがたの土地の収穫を刈り入れるとき、畑の端[a]まで刈り尽くしてはならない。また、収穫の落ち穂を拾い集めてはならない。それらは貧しい者と寄留者[b]のために残しておかなければならない。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「畑の隅」とも訳せる。ヘブライ語は、端、側面、隅を意味し得る。
    reason: lexical_alternative
  - marker: b
    text: イスラエル人ではないが、その共同体の中に住み、法の保護を受けていた人を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: あなたがたの土地の収穫を刈り入れるとき
  rationale: 前置詞付き不定詞構文の時間的意味を自然な日本語で表し、קָצִירの農耕上の意味を「収穫」とした。
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: 畑の端まで刈り尽くしてはならない
  rationale: כלהの完遂の意味を「刈り尽くす」で示し、פאהは隅にも端にもなり得るため本文では広い「端」を採用した。反復される「刈り入れるとき」は、日本語では冗長になるため動詞「刈り尽くす」に意味を織り込んだ。
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: 収穫の落ち穂を拾い集めてはならない
  rationale: לֶקֶטは主要な刈り入れの後に拾われる残り物を指すため、穀物収穫の文脈に即した「落ち穂」とした。動詞との語根反復は「落ち穂を拾い集める」で自然に表した。
- source_word: לֶעָנִי
  choice: 貧しい者
  rationale: 社会的・経済的に弱い者を指す、この法令の直接的な意味を保った。
- source_word: וְלַגֵּר
  choice: 寄留者
  rationale: イスラエルの共同体内に住む非イスラエル人という法的・社会的立場を表し、単なる訪問者や未知の他人という印象を避けた。
- source_word: תַּעֲזֹב אֹתָם
  choice: それらは……のために残しておかなければならない
  rationale: עזבはここでは放棄ではなく、対象者が取れるよう意図的に残すことを意味する。目的語の複数形を「それら」で明示した。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: わたしはヤハウェ、あなたがたの神である
  rationale: 神名יהוהを固有名「ヤハウェ」として示し、契約上の定型句の重みを保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を直接用いているため、称号に置き換えず音写した。
- issue: גֵּר の社会的身分
  choice: 寄留者
  alternative: 在留異国人
  rationale: 共同体の中に居住し、その法的保護の下にある非イスラエル人を指す。現代の特定の移民制度を持ち込まず、原語の広がりを保つ表現を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭な標準日本語を用いつつ、法令としての厳粛さを保った。「〜してはならない」と「〜なければならない」で禁止と積極的命令を区別した。
