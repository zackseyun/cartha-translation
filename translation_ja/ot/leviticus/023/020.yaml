base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: ja
  text: 祭司は、初物のパンおよび二匹の子羊とともに、ヤハウェの前でそれらを揺り動かしてささげる。[a] これらはヤハウェに属する聖なるものであり、祭司のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「初物のパンの上で……二匹の子羊の上で」とも訳せる。ヘブライ語の前置詞は字義的には「上に、上で」を意味し得るが、ここでは一緒に祭儀的にささげることを表している可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: 揺り動かす奉納物として……揺り動かす
  rationale: נוּףのヒフィル形と同根の名詞תְּנוּפָהを、レビ記の祭儀的な動作と奉納物の性格の両方が分かるように訳した。
- source_word: אֹתָם
  choice: それら
  rationale: 直前の文脈で定められた品々を指す複数代名詞であり、この節だけで指示対象を過度に限定しない。
- source_word: עַל לֶחֶם הַבִּכּוּרִים ... עַל שְׁנֵי כְּבָשִׂים
  choice: 初物のパンおよび二匹の子羊とともに
  rationale: עַלは字義的には「上に／上で」とも訳せるが、ここでは品々を一緒に祭儀的に提示する関連を表す可能性が高いため、自然な日本語の「とともに」とした。別訳は脚注に残した。
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: 初物のパン
  rationale: パンと初物との属格的関係を簡潔に保ち、祭りの初物の奉納とのつながりを示す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在のもとで行う祭儀を表す定型句を自然かつ直接的に訳した。
- source_word: קֹדֶשׁ יִהְיוּ לַיהוָה לַכֹּהֵן
  choice: これらはヤハウェに属する聖なるものであり、祭司のものとなる
  rationale: 奉納物がヤハウェに聖別されながら祭司に割り当てられるという二重の関係を、矛盾として解消せず明確な日本語で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文にある神の固有名YHWHを音写し、契約の名として保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を明記しているため、称号に置き換えず「ヤハウェ」とした。
- issue: 「ヤハウェに」と「祭司に」の関係
  choice: ヤハウェに属する聖なるものであり、祭司のものとなる
  alternative: ヤハウェのため、祭司のために聖なるものとなる
  rationale: 奉納による神への帰属と、その聖なる分が祭司に与えられることを併記し、どちらか一方に還元しない。
translation_notes:
  register: 現代の一般読者に通じる端正な文体を用いた。「揺り動かす奉納物」は祭儀上の専門性を保ちつつ、動作が分かる表現とした。脚注記号[a]は該当文の直後に置いた。
