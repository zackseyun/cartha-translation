language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: ja
  text: 第一日目に、あなたがたは自分たちのために、美しい木の果実[a]、なつめやしの枝、葉の茂った木の大枝、川のほとりの柳を取り、あなたがたの神ヤハウェの前で七日間喜びなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後代のユダヤ教の伝統では、これはシトロン（エトログ）の実を指すとされる。ヘブライ語は字義的には「美しい、または見事な木の果実」と述べている。
    reason: 原文の一般的で同定に議論のある表現を本文に保ちながら、後代の伝統的同定を示すため。
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: 自分たちのために…取らなければならない
  rationale: 法規的文脈における指示の力を明確にしつつ、לָכֶםも訳出した。
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一日には
  rationale: 祭りの日であることは文脈上明らかだが、この節には明記されていないため補わない。
- source_word: פְּרִי עֵץ הָדָר
  choice: 見事な木の実
  rationale: הָדָרの「美しさ・華やかさ・威厳」という幅を自然な日本語で表し、特定の果実への同定を本文に持ち込まない。
- source_word: כַּפֹּת תְּמָרִים
  choice: なつめやしの枝
  rationale: תְּמָרִיםをナツメヤシとし、その葉をつけた枝を指す表現として平明に訳した。
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: 葉の茂った木の大枝
  rationale: עָבֹתが表す密生・繁茂の含意を葉の茂りとして表し、עֲנַףは大枝とした。
- source_word: וְעַרְבֵי נָחַל
  choice: 川辺の柳
  rationale: עַרְבֵיを柳、נָחַלを水の流れる場所として、自然で簡潔な日本語にした。
- source_word: וּשְׂמַחְתֶּם
  choice: 喜び祝わなければならない
  rationale: 喜ぶという語義と祭儀的文脈の双方を自然に伝え、指示としての力も保った。
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: あなたがたの神ヤハウェの前で
  rationale: לִפְנֵיを「前で」とし、神名יהוהは固有名として「ヤハウェ」と表記した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す自然な現代日本語とした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の契約名を直接示し、普通名詞的な称号に置き換えない。
- issue: פְּרִי עֵץ הָדָרの同定
  choice: 一般的な「見事な木の実」
  alternative: シトロンの実（エトログ）
  rationale: 後代のユダヤ教伝統ではシトロンとされるが、ヘブライ語本文自体はより広い表現なので、その曖昧さを本文に残した。
translation_notes:
  register: 明瞭で現代的ながら、律法の指示にふさわしい格調を保った。「喜び祝う」により、単なる感情だけでなく祭りとしての喜びも自然に伝える。
