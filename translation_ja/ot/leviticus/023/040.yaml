revisions:
- from: 第一日には、自分たちのために、見事な木の実[a]、なつめやしの枝、葉の茂った木の大枝、川辺の柳を取り、あなたがたの神ヤハウェの前で七日間喜び祝わなければならない。
  to: 第一日目に、あなたがたは自分たちのために、美しい木の果実[a]、なつめやしの枝、葉の茂った木の大枝、川のほとりの柳を取り、あなたがたの神ヤハウェの前で七日間喜びなさい。
  rationale: 原文の語順と列挙を保ちつつ、現代日本語として不自然な箇所を整えた。「美しい木の果実」により、形容が果実そのものではなく木に関わる原文の表現をより明確にし、特定のシトロン同定は脚注だけにとどめた。「喜びなさい」は祭儀的文脈を読者が理解できる程度に直接的で、原文の動詞に余分な意味を加えない。
  reviewer_model: gpt-5.6-terra
