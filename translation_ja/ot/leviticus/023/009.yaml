base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は神の名YHWH（ヤハウェ）。
    reason: 本文の「ヤハウェ」がヘブライ語の神名יהוה（YHWH）を表すことを示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 話者と聞き手を示して神の発言を導入する定型句。日本語では「告げた」が簡潔で自然かつ厳かな表現となる。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語。日本語聖書で広く定着した「主」を本文に用い、原文が固有名YHWHであることを脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 前置詞אֶלは発言の相手を示すため、自然な現代日本語の助詞「に」で表す。מֹשֶׁהは慣用表記「モーセ」とする。
- source_word: לֵאמֹר
  choice: （「告げた」に統合）
  rationale: 直訳は「言って」だが、後続の直接話法を導くヘブライ語の定型表現である。「告げた」と訳せば機能が十分に伝わり、日本語で冗長な「言って言われた」を避けられる。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: 本文では「主」、脚注で「原文は神の名YHWH（ヤハウェ）」
  alternative: 本文で「ヤハウェ」
  rationale: 固有名であることを脚注で保持しつつ、現代日本語の聖書文体として理解されやすく定着した表記を本文に採用する。称号への置換だけで原文情報が失われないよう注記する。
translation_notes:
  register: 明快な現代標準日本語。祭儀規定の新しい発言単位を導入する定型句として、簡潔で品位ある文体にした。脚注記号[a]は本文中の対応箇所に置いた。
