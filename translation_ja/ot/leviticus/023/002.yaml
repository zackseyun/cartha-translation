id: LEV.23.2
reference: Leviticus 23:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: ja
  text: イスラエルの子ら[c]に語り、彼らにこう言いなさい。『ヤハウェの定められた時[a]、すなわち、あなたがたがそれらを聖なる集会[b]として告げ知らせるもの、これらがわたしの定められた時である。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定められた祭り」または「祭典」とも訳せる。ヘブライ語は、祝宴に限らず、定められた聖なる時全般を指しうる。
    reason: lexical_alternative
  - marker: b
    text: 「聖なる召集」または「聖なる会合」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「イスラエルの息子たち」。イスラエルの民を共同体として指す、契約上の定型表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם
  choice: イスラエルの子らに語り、彼らに言いなさい
  rationale: 二つの発話動詞を保ち、律法の告知にふさわしい端正な命令表現とした。בְּנֵי יִשְׂרָאֵל は字義を生かしつつ、共同体全体を指す定型句として訳した。
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: 定めの時／わたしの定めの時
  rationale: מוֹעֵד は定められた時や会合を広く表し、この章では安息日も扱われるため、「祭り」に限定しなかった。末尾の一人称接尾辞も「わたしの」と明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、イスラエルの神の契約名を日本語で音写した。
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: あなたがたが……として布告する
  rationale: קרא の公に宣言し、定める含意を、祭儀的な文脈に合う「布告する」で表した。
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: 聖なる集会
  rationale: 召集された神聖な集まりを指す定型表現として、現代の読者にも明瞭な語を選んだ。
- source_word: אֵלֶּה הֵם
  choice: これらは……である
  rationale: 指示詞と代名詞による強調的な同定を、日本語で自然に保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有の契約名を称号へ置換せず、特定教派の用語に寄せない音写を採用した。
- issue: מוֹעֵד の範囲
  choice: 定めの時
  alternative: 祭り、祭日
  rationale: この語は祝宴だけでなく定められた聖なる時全般を表し、続く文脈には安息日も含まれるため、意味を狭めなかった。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の定型的な契約共同体表現を保った。ただし文脈上は成人男性だけでなく、イスラエルの民を共同体として指す。
- issue: 聖なる時を布告する主体
  choice: あなたがた
  alternative: あなた
  rationale: תִּקְרְאוּ は複数形であり、モーセ個人ではなく、告知を受ける共同体側の複数の主体を示すため、その数を明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法告知の厳粛さと原文の反復を保った。引用部では語順をできるだけ維持し、末尾の「これらはわたしの定めの時である」に同定の力点を置いた。
