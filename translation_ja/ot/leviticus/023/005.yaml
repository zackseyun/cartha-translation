base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: ja
  text: 第一の月の十四日、夕暮れ時[a]に、ヤハウェのための過越[b]がある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「二つの夕べの間」。日没前後の薄暮を指すヘブライ語の慣用句。
    reason: lexical_alternative
  - marker: b
    text: 「過越の供え物」または「過越の犠牲」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 第一の月
  rationale: 祭儀暦における最初の月を表す。簡潔で原文の序数表現にも沿う。
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: その月の十四日
  rationale: 月内の日付を示すヘブライ語の定型表現を、自然な現代日本語の日付表現にした。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 夕暮れ時
  rationale: 字義は「二つの夕べの間」。日没前後の薄暮を指す慣用句として明瞭に訳し、時刻をめぐる解釈上の幅は脚注に残した。
- source_word: פֶּסַח
  choice: 過越
  rationale: 祭り、儀礼、供え物・犠牲そのものを指し得る語である。本文では広い意味を保つ伝統的かつ簡潔な「過越」とし、犠牲の含意を脚注に示した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞 ל が示す奉献・帰属を「への」で表し、神名 יהוה は固有名として「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある契約の固有名を明示し、称号への置換を避けた。
- issue: 祭儀的文脈における פֶּסַח の意味
  choice: 過越
  alternative: 過越の供え物／過越の犠牲
  rationale: 語が祭り全体と犠牲・供え物の双方を指し得るため、本文では意味を狭めず、別の含意を脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「第一の月」は祭儀暦の表現として保持し、「過越」は原語の祭りと犠牲の両義性を本文と脚注で伝える。
