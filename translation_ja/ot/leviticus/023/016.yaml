id: LEV.23.16
reference: Leviticus 23:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: ja
  text: 第七の安息日の翌日まで、五十日を数えなさい[a]。そして、新しい穀物のささげ物をヤハウェに献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「第七週の翌日まで、五十日を数えなさい」。ヘブライ語は字義的には「第七の安息日の翌日」と記しており、祭りの日数を暦の上でどう表すかについて解釈が分かれる。
    reason: 「安息日」と「週」の関係をめぐる暦上の解釈の違いを示しつつ、本文では原文の語を保持するため。
lexical_decisions:
- source_word: עַד
  choice: まで
  rationale: 数える期間の到達点を示す語として、自然で明確な日本語にした。
- source_word: מִמָּחֳרַת
  choice: 翌日
  rationale: 「次の日」「その翌日」を意味するため、現代日本語で簡潔な「翌日」とした。前置詞מִןを含む形だが、עַדと結びついた期間表現全体を日本語として自然に整えた。
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: 第七の安息日
  rationale: 原文は通常の「週」ではなく「安息日」を明記しているため、その表現を保持した。暦上の解釈可能性は脚注で示した。
- source_word: תִּסְפְּרוּ
  choice: 数えなさい
  rationale: 二人称複数の法的指示を、明瞭で威厳を保った命令表現にした。
- source_word: חֲמִשִּׁים יוֹם
  choice: 五十日
  rationale: 数詞と単数形の集合的な名詞による表現を、標準的な日本語にした。
- source_word: וְהִקְרַבְתֶּם
  choice: そして、…献げなさい
  rationale: 祭儀の文脈で、供え物を神の前に持って来て差し出す行為を表すため、「献げる」とした。接続詞も保持した。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀用語として、単なる「供え物」より具体的な穀物の供え物を指すため、この訳語を用いた。
- source_word: חֲדָשָׁה
  choice: 新しい
  rationale: 形容詞の基本義を保ち、新しい収穫からのささげ物であることを過度に説明せず表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神の固有名יהוהを音写し、前置詞לを献げる相手を示す「に」とした。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を固有名として示し、一般名詞の称号に置き換えなかった。
- issue: הַשַּׁבָּת הַשְּׁבִיעִתを暦上どう表すか
  choice: 第七の安息日
  alternative: 第七週
  rationale: 原文が「週」の通常語ではなくשׁבתを用いているため、「安息日」を本文に保持した。祭りの日数計算に関する解釈上の幅は脚注に残し、本文で一方に決めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法の指示にふさわしい簡潔で格調ある命令形とした。「ささげ物」は祭儀的意味が伝わる一般的な表記とし、神名は「ヤハウェ」と表記した。
