id: LEV.4.15
reference: Leviticus 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: ja
  text: 会衆の長老たちは、ヤハウェの前で雄牛の頭に手を置く。そして、ある者がその雄牛をヤハウェの前で屠る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直前の「長老たち」は複数だが、ここで原文の動詞は単数に移る。誰が屠るのかは本文では明示されていない。
    reason: 原文における複数から単数への転換と、単数の実行者が明示されないことを示すため。
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: 手を置く
  rationale: 犠牲に手を押し当てる儀礼的行為を表す。日本語では「手を置く」が明瞭で自然であり、原文の動作を過度に説明しない。
- source_word: זִקְנֵי הָעֵדָה
  choice: 会衆の長老たち
  rationale: עֵדָהの共同体的・集合的意味を「会衆」で、זִקְנֵיの複数を「長老たち」で保持した。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: 原文は接尾辞を含めて「彼らの手々」だが、日本語では複数の行為者を主語とする「手を置く」が自然で、各長老の手を含意する。
- source_word: עַל רֹאשׁ הַפָּר
  choice: 雄牛の頭に
  rationale: 空間関係と犠牲獣פַּרを簡潔かつ直接的に訳した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵיの「前で／面前で」という意味を自然な日本語で示し、神名יהוהは称号に置換せず「ヤハウェ」とした。
- source_word: וְשָׁחַט
  choice: そして彼は……屠る
  rationale: 前の複数主語から三人称男性単数動詞へ移る原文の数の転換を保持した。「屠る」は犠牲祭儀における殺処分を端的に表す。
- source_word: הַפָּר
  choice: その雄牛
  rationale: 既出の特定の雄牛を指す定冠詞を、日本語の指示語「その」で自然に示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の神名を称号へ置き換えず、一般的な日本語音写で示した。
- issue: וְשָׁחַטの単数主語をどう表すか
  choice: 「彼は」として単数を保持する
  alternative: 「彼らは屠る」または受動態「雄牛は屠られる」
  rationale: 原文は「長老たち」という複数から単数動詞へ転じる。実行者が誰かを特定せず、代表者一人の可能性を残すため、数の不一致を平滑化しなかった。
translation_notes:
  register: 現代標準日本語の簡潔で品位ある祭儀法規の文体とした。「屠る」は日常語より格式があるが、犠牲祭儀の文脈では明確で適切。原文の未完了形に対応する規定文として、現在形で法的指示を表した。
