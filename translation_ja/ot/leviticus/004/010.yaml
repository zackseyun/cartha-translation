  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: ja
  text: 交わりのいけにえの雄牛から取り分けられるのと同じように[a]、祭司はそれらを全焼のささげ物の祭壇の上で焼いて煙にする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「交わりのいけにえの雄牛から持ち上げられるのと同じように」。ヘブライ語の動詞には、献げる部分を取り外して持ち上げるという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 〜のと同じように
  rationale: 直前までに規定された交わりのいけにえの手順との対応を、自然な現代日本語で明確に示す。
- source_word: יוּרַם
  choice: 取り分ける
  rationale: רוםのホファル形には字義的に「持ち上げられる」という意味合いがあるが、ここでは脂肪の部分を動物から取り分ける祭儀上の動作を指す。字義的な含みは脚注に残した。
- source_word: מִשּׁוֹר
  choice: 雄牛から
  rationale: שׁוֹרは牛を表し、この犠牲動物の文脈では「雄牛」が明確で自然である。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִיםの祭儀用語として、神との平和や共同の食事という含みを過度に一義化せず、現代の読者にも理解しやすい表現を採った。זֶבַחの犠牲としての性格は「いけにえ」によって表した。
- source_word: וְהִקְטִירָם
  choice: それらを……焼いて煙にする
  rationale: 目的語接尾辞の複数を「それら」で明示し、קטרの祭壇上で焼いて煙を立ち上らせる祭儀的動作を表した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀を執行する役職を表す標準的な訳語。
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物の祭壇の上で
  rationale: עֹלָהを、すべてを焼いて献げるささげ物として分かりやすく表し、祭壇との関係を原文どおり保った。
