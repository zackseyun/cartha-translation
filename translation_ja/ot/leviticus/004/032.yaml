  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: ja
  text: また、罪のためのいけにえ[a]として羊をささげ物に持って来るなら、傷のない雌の羊を持って来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。ヘブライ語の חַטָּאת は、罪や祭儀上の汚れを取り扱ういけにえを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: また、〜なら
  rationale: 前節から続く別の場合を示す接続的な条件表現として、現代日本語で自然に訳した。
- source_word: כֶּבֶשׂ
  choice: 羊
  rationale: ここでは群れに属する羊を指す。年齢を本文以上に限定しないよう「子羊」ではなく「羊」とした。
- source_word: יָבִיא קָרְבָּנוֹ
  choice: ささげ物にする
  rationale: 直訳は「自分のささげ物として持って来る」。後半の反復と合わせ、供犠として差し出す意味が自然に伝わる表現とした。
- source_word: לְחַטָּאת
  choice: 罪のためのいけにえ
  rationale: レビ記の祭儀用語として、罪を扱う供犠であることを明瞭にしつつ、「清めのいけにえ」という語義上の可能性を脚注に残した。
- source_word: נְקֵבָה תְמִימָה
  choice: 傷のない雌
  rationale: 動物の性別と、供犠に不適格な欠陥がないことを簡潔かつ正確に表した。
- source_word: יְבִיאֶנָּה
  choice: 連れて来なければならない
  rationale: 雌の動物を指す三人称女性単数接尾辞を日本語で自然に反映し、祭儀規定の義務的な力を示した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: חַטָּאת は罪を扱う供犠を指す一方、祭儀上の汚れからの清めを強調し得る。本文では一般読者に意味が伝わる伝統的な方向を採り、真正な語義上の幅は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語。祭儀規定としての荘重さを保ちつつ、過度に古風な「きずのない雌を携え来るべし」などは避けた。
