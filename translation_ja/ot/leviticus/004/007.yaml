  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: ja
  text: 祭司は、その血の一部を、会見の天幕の中、ヤハウェの前にある香料の香をたく祭壇[a]の角に塗る。また、雄牛の血をすべて[b]、会見の天幕の入口にある全焼のささげ物の祭壇の土台に注ぐ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 簡潔には「香の祭壇」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「雄牛の血をすべて」。すでに一部を祭壇の角に塗っているため、文脈上は残りの血を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: 塗る
  rationale: 基本義は「与える、置く」だが、祭壇の角に血を付着させる儀礼動作を、現代日本語で具体的かつ自然に表す。
- source_word: מִן הַדָּם
  choice: その血の一部を
  rationale: 前置詞 מִן を部分を示す用法と取り、血の全量ではなく一部であることを明確にする。
- source_word: קַרְנוֹת
  choice: 角
  rationale: 祭壇の四隅から突き出た部分を指す祭儀用語を、その形状を保って訳す。
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: 香料の香をたく祭壇
  rationale: קְטֹרֶת は香、הַסַּמִּים は芳香性の香料を指す。日本語で意味が取りやすいよう、祭壇の用途を自然に表現する。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 空間的・礼拝的な「御前」の意味を保ち、神名 יְהוָה は称号に置き換えず音写する。
- source_word: וְאֵת כָּל דַּם הַפָּר
  choice: 雄牛の血をすべて
  rationale: ヘブライ語の כָּל を明示的に保つ。先に一部を用いているため文脈上は残りを指すが、本文では原文の表現を保持し、注で説明する。
- source_word: יִשְׁפֹּךְ אֶל יְסוֹד
  choice: 土台に注ぐ
  rationale: שׁפך の液体を注ぎ出す動作と、יְסוֹד の祭壇の基部・土台という意味を簡潔に表す。
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物の祭壇
  rationale: עֹלָה が供え物全体を焼く犠牲であることを、一般読者にも分かる現代日本語で示す。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と民が定められた場で会うという名称の意味を保つ、定着した訳語を用いる。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを読者に示し、称号への置換を避ける。
- issue: כָּל דַּם הַפָּר と先に用いた血との関係
  choice: 本文では「雄牛の血をすべて」とし、文脈上の意味を注記する
  alternative: 雄牛の残りの血をすべて
  rationale: 原文は「残り」を明記していない一方、儀礼の順序から実際には残った血を指す。本文で形式を保ち、注で緊張関係を明らかにする。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀上の具体的な配置と動作が追いやすい語順にしつつ、原文にない「残り」を本文へ補わず、注で文脈を説明した。
