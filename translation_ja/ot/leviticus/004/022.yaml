id: LEV.4.22
reference: Leviticus 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: ja
  text: 指導者[a]が罪を犯し、自分の神であるヤハウェのすべての戒めのうち、してはならないことのどれか一つを意図せずに行って[b]、罪責を負った場合、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「指導者」と訳したヘブライ語は、「首長」「共同体の長」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「意図せずに」は、「過って」「知らずに」とも訳せる。故意ではない違反を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 部族や共同体の公認の長を指す語であり、君主制の「王子」に限定されないため、文脈に広く適合する「指導者」とした。
- source_word: יֶחֱטָא
  choice: 罪を犯し
  rationale: חטא の直接的な意味を、現代日本語で自然かつ明瞭に表した。
- source_word: וְעָשָׂה אַחַת מִכָּל מִצְוֺת
  choice: 戒めのうち、…どれか一つを…行って
  rationale: 複数の戒めに関わる禁止事項の中から一つを犯すという部分集合の意味を保った。
- source_word: יְהוָה אֱלֹהָיו
  choice: 自分の神ヤハウェ
  rationale: 神名を「ヤハウェ」と表記し、三人称接尾辞の示す指導者との関係も「自分の神」によって明示した。
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: してはならないこと
  rationale: 受動的・禁止的な表現を、簡潔で自然な日本語にした。
- source_word: בִּשְׁגָגָה
  choice: 意図せずに
  rationale: 故意ではない違反を指す祭儀法上の意味を明確にした。「知らずに」よりも、無知だけに意味を限定しない。
- source_word: וְאָשֵׁם
  choice: 罪責を負った
  rationale: 違反の結果として有罪・責任ある状態になる意味を表した。「罪責」は祭儀法の法的・宗教的含意を簡潔に伝える。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名として音写した。
- issue: וְאָשֵׁם が表す状態または結果
  choice: 罪責を負った
  alternative: 罪ある者となった／有罪となった
  rationale: 違反後に生じる責任状態を示しつつ、祭儀上の罪責と一般法廷の判決とを同一視しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい端正さを保った。後続節へ続く条件文なので、句点ではなく読点で結んだ。
