source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: ja
  text: その人は、ヤハウェの御前にある会見の天幕の入口へ雄牛を連れて来る。そして雄牛の頭に手を置き、ヤハウェの御前でその雄牛を屠る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: 連れて来る
  rationale: 使役形の動詞で、奉献者が動物を所定の場所へ導くことを指す。祭儀規定として自然な現在形で表した。
- source_word: הַפָּר
  choice: 雄牛
  rationale: פַּרは犠牲に用いる雄牛を指す。「若い」ことはこの節では明示されていないため補わない。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口
  rationale: פֶּתַחは開口部または入口、אֹהֶל מוֹעֵדは聖所を指す定型的名称である。「会見の天幕」は意味を保ちつつ日本語の聖書文体として明瞭である。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの御前に／御前で
  rationale: לִפְנֵיは「前に」「面前で」「臨在のもとで」を表す。移動の到達点では「御前に」、屠殺の場所では「御前で」とし、同じ祭儀的表現を自然な日本語にした。
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: 雄牛の頭に手を置き
  rationale: סמךはここでは犠牲動物の頭に手を置く祭儀的行為を表す。押しつける強さや象徴的意味までは本文が明示しないため、動作を端的に訳した。
- source_word: וְשָׁחַט
  choice: 屠る
  rationale: שׁחטは犠牲動物を屠殺する専門的な動詞である。「殺す」より祭儀的文脈を明確に保てる。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号に置き換えず、神名として音写した。
- issue: 雄牛の頭に手を置く行為の意味
  choice: 身体的行為のみを訳す
  alternative: 罪の転嫁または奉献者との同一化を明示する
  rationale: この節自体は行為の神学的意味を説明していないため、特定の解釈を本文へ加えず、原文の含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で品位ある文体とした。連続するヘブライ語の動作を二文に分け、手順を読み取りやすくした。
