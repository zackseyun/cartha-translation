source:
  edition: WLC
  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: ja
  text: そこで、油を注がれた祭司は、雄牛の血の一部を会見の天幕に携えて入れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: そこで……携えて入れる
  rationale: 接続詞を伴うヒフィル完了形は、祭儀手順の次の動作を示す。日本語では「そこで」により順序を自然に表し、目的地の内部への移動を「携えて入れる」で示した。
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  choice: 油を注がれた祭司
  rationale: מָשִׁיחַ はここでは油注ぎによって職に任じられた祭司を指し、メシアという称号ではない。「油を注がれた」は原語の具体的な意味を保つ。
- source_word: מִ/דַּם הַ/פָּר
  choice: 雄牛の血の一部
  rationale: מִן はこの文脈で部分を示すと考えられ、雄牛の血すべてではなく、その一部を運ぶ祭儀動作を明確に表す。פַּר は犠牲としての雄牛を指す。
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: 会見の天幕に……入れる
  rationale: אֶל は目的地への移動を表し、文脈上は天幕内部への搬入を含む。「会見の天幕」は אֹהֶל מוֹעֵד の構成を保ちながら、現代日本語で理解しやすい。
theological_decisions:
- issue: 祭司に用いられた הַמָּשִׁיחַ の訳
  choice: 油を注がれた
  alternative: 聖別された／メシア
  rationale: ここでは祭司職への任命のために油を注がれた者を表す。「聖別された」は意味を広げすぎ、「メシア」は後代の称号を想起させて文脈を誤解させるため避けた。
translation_notes:
  register: 祭儀規定にふさわしい簡潔で端正な現代標準日本語とした。「持って行く」より改まった「携えて入れる」を用い、天幕の内部へ運ぶ動きを自然に表した。
