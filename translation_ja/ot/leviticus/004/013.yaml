id: LEV.4.13
reference: Leviticus 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: ja
  text: もしイスラエルの全会衆が誤って罪を犯し[a]、そのことが集会に知られないまま[b]、ヤハウェがしてはならないと命じたことの一つを行い、罪責を負うに至ったなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誤って」は、故意の反逆ではなく、意図せずに罪を犯すことを表す。
    reason: cultural_note
  - marker: b
    text: 直訳「そのことが集会の目から隠されていて」。共同体がそのことに気づいていなかった、という意味の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: イスラエルの全会衆
  rationale: עֵדָהは共同体全体、また集められた会衆を表す。祭儀法の文脈にふさわしく、後出のקָהָלとの語の違いもある程度示せる訳語とした。
- source_word: יִשְׁגּוּ
  choice: 誤って罪を犯し
  rationale: שׁגהはレビ記4章の文脈では故意の反逆でなく、過失や不注意による罪を指す。「誤って」により、この法的区分を明示した。
- source_word: וְנֶעְלַם דָּבָר
  choice: そのことが…隠されていて
  rationale: 問題となる行為または事実が共同体に認識されていなかったことを表す受動表現を保った。
- source_word: מֵעֵינֵי הַקָּהָל
  choice: 集会の目から
  rationale: 認識や気づきを「目」で表すヘブライ語の比喩を保持した。קָהָלは先のעֵדָהと区別して「集会」とした。
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: ヤハウェがしてはならないと命じたことの一つを行い
  rationale: 禁止された行為のうち一つを行うという法的意味を、自然な日本語で示した。受動的な禁止表現の意味も保持している。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: וְאָשֵׁמוּ
  choice: 罪責を負うに至った
  rationale: 違反の結果として有責となる、また責任を負う状態に至るという動詞の結果的含意を表した。
theological_decisions:
- issue: 祭儀法におけるשׁגהの罪の性質
  choice: 誤って犯す罪
  alternative: 道を踏み外す／迷う
  rationale: レビ記4章は故意の反逆ではなく、過失による違反を扱うため。ただし道徳的責任がないという意味にはせず、続く「罪責を負う」との緊張を保った。
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号に置換せず明示した。
- issue: וְאָשֵׁמוּが表す状態
  choice: 罪責を負うに至った
  alternative: 罪ある者となった／罪に気づいた
  rationale: 動詞は違反の結果として有責になることを表し得る。「気づいた」と限定せず、認識と法的責任の可能性を不必要に解消しない訳とした。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある法文調。「会衆」と「集会」を使い分け、עֵדָהとקָהָלの語彙上の違いを反映した。節末は次節へ続く条件節として読点で閉じた。
