  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: ja
  text: その人は、罪のためのささげ物[a]の頭に手を置き、全焼のささげ物を屠殺する場所で、それを罪のためのささげ物として屠殺しなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「きよめのためのささげ物」。ヘブライ語は、罪および儀礼上の汚れに対処するささげ物を指しうる。この節の二か所とも同じ語。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ
  choice: 頭に手を置き
  rationale: 「手」は原文どおり単数を保つ。סמך は犠牲動物に手を置く儀礼行為を表し、日本語では「手を置く」が自然で、象徴的意味を過度に限定しない。
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: 罪のきよめのささげ物／罪のきよめのささげ物として
  rationale: חטאת は罪に対処する供え物であると同時に、きよめの機能を持つ祭儀用語。「罪のきよめのささげ物」は両面を簡潔に伝え、二つの出現を一貫して訳す。
- source_word: וְשָׁחַט
  choice: ほふらなければならない
  rationale: שׁחט は犠牲動物を屠る専門的な動詞。現代語として理解でき、祭儀文の格調も保つ「ほふる」を採用し、法規的な未完了形を義務表現で示す。
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: ほふる場所で
  rationale: 原文の三人称男性単数は一般的・手続き的な行為を表すため、日本語では主語を明示せず自然に訳す。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: עֹלָה は祭壇上で全体を焼く供え物を指す。「全焼のささげ物」は祭儀上の内容を普通の読者にも明確に伝える。
theological_decisions:
- issue: 祭儀用語 חטאת の訳し方
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／きよめのささげ物
  rationale: 語が持つ罪への対処と祭儀的なきよめの双方を保ち、一方だけに意味を固定しない。一般的な「罪のためのささげ物」も脚注に残す。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、祭儀動詞「ほふる」に聖書法規としての品位を持たせた。「供え物」より平易で動作性のある「ささげ物」を用い、法規の義務性は「なければならない」で表した。
