source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: ja
  text: 「イスラエルの子ら[a]に告げよ。もし人が、してはならないことを定めたヤハウェの戒めのいずれかに関して、誤って[b]罪を犯し、その一つを行ったなら、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イスラエルの息子たち」。ここではイスラエルの子孫である民、すなわちイスラエル人を指す。
    reason: lexical_alternative
  - marker: b
    text: 「知らずに」「間違って」とも訳せる。故意に反抗してではなく、不注意や錯誤によって罪を犯すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げよ
  rationale: モーセに対する直接的な命令であり、続く神の指示を民に伝えるよう命じる文脈に合う、自然で格調ある表現。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの親族的表現を保ち、ヤコブ（イスラエル）の子孫である民を指す。現代日本語で意味を明確にするため脚注を付す。
- source_word: נֶפֶשׁ
  choice: 人
  rationale: ここでは非物質的な「魂」を強調せず、律法上の行為主体である一人の人を指す慣用法。
- source_word: תֶחֱטָא
  choice: 罪を犯し
  rationale: חטא の動詞的意味を、律法の条文にふさわしい明瞭な日本語で表す。
- source_word: בִשְׁגָגָה
  choice: 過って
  rationale: 故意または反抗的にではなく、不注意や錯誤によって行うことを表す。
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: ヤハウェの戒めのどれかに関して
  rationale: מן を戒めとの関係・関連を示すものとして訳し、原文の構文を過度に「戒めに背く」と解釈しない。神名は固有名として「ヤハウェ」とする。
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: してはならないことについての
  rationale: 禁止事項を定める戒めであることを、原文の非人称的・受動的な含みを保ちながら自然な日本語で示す。
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: その一つを行ったなら
  rationale: 直前の禁止事項の一つを実際に行うという条件を簡潔に表す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された四文字神名を固有名として示し、「主」という称号に置き換えない。発音の再建には不確実性があるが、現代の標準的な日本語表記を採用する。
- issue: 過失による罪の性格
  choice: 「過って」とし、故意でない行為を示す
  alternative: 知らずに、間違って
  rationale: בִשְׁגָגָה は反抗的・意図的な罪と対照される過失や錯誤を表すが、責任が一切ないとまでは本文から断定しない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある律法文の文体とした。「告げよ」で命令の直接性を保ち、条件節は次節以降へ続くため読点で閉じた。原文の重なりを完全には平滑化せず、「罪を犯し、その一つを行ったなら」として法的条件の二段構造を残した。
