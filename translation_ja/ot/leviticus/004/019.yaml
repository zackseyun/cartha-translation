  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: ja
  text: そして、その雄牛から脂肪をすべて取り除き、祭壇の上で焼いて煙にする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: また
  rationale: 接続詞は、前節から続く一連の祭儀動作を示す。目的格標識は日本語では語順と助詞によって表した。
- source_word: כָּל
  choice: すべて
  rationale: 取り除くべき脂肪の全体を指し、一部分だけではないことを明示する。
- source_word: חֶלְבּוֹ
  choice: 脂肪
  rationale: 男性単数接尾辞の指示対象は罪のきよめのささげ物の雄牛である。日本語では文脈上明らかな所有表現を省き、レビ記の祭儀で焼くために取り分けられる脂肪を指す語として「脂肪」とした。
- source_word: יָרִים
  choice: 取り除き
  rationale: רום のヒフィル形は字義的には「持ち上げる」だが、ここでは動物から脂肪を分離して取り出す祭儀動作なので「取り除く」が自然で正確である。
- source_word: מִמֶּנּוּ
  choice: 雄牛から
  rationale: 前文脈の犠牲の雄牛を指す代名詞を、現代日本語で指示対象が明瞭になるよう名詞で示した。前置詞 מִן の分離の意味は「から」で表した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 祭儀用語 הקטיר は単なる燃焼ではなく、祭壇上で供物を焼いて煙として立ち上らせることを表す。「焼いて煙にする」により、自然さを保ちつつ固有の祭儀的含意を伝える。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴うが、הקטיר との組み合わせでは供物を祭壇上で焼く場所を表すため、「祭壇の上で」とした。
theological_decisions: []
translation_notes:
