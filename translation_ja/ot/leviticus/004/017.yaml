  source_fidelity: ヘブライ語の手順（祭司が血に指を浸し、ヤハウェの前で、幕の前方に向けて七回散布する）は概ね捉えられている。ただし「垂れ幕の正面で」は、散布の方向・対象を表すאֵת פְּנֵיよりも、祭司がその場所に立つことを表すように読める。
  naturalness: 「その血の一部に指を浸し」は意味は通じるものの、日本語としてやや不自然である。「血に指を浸し」が簡潔で自然であり、文脈上、血のすべてに指を浸すという含意にはならない。「振りかける」は祭儀的な血の散布を自然に表す。
  terminology: 「祭司」「ヤハウェ」は適切である。פָּרֹכֶתには本文で「垂れ幕」を用いることができるが、脚注は「仕切りの幕」ではなく、聖所内の区域を隔てる幕であることをより自然かつ中立的に説明する。
