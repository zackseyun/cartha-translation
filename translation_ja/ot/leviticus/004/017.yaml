  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: ja
  text: 祭司は血に指を浸し、ヤハウェの前で、垂れ幕[a]の前に向けてその血を七回振りかける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕切りの幕」とも訳せる。ヘブライ語は、聖所内の区域を隔てる幕を指す。
    reason: פָּרֹכֶתの別訳を示し、その祭儀的・建築的指示対象を自然な日本語で補足するため。
lexical_decisions:
- source_word: וְטָבַל
  choice: 浸し
  rationale: טבלの基本義「浸す」を保ちつつ、前後する祭儀手順の連続を自然な日本語の連用形で表した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀に仕えるכהןの標準的で明瞭な訳語。定冠詞の限定性は文脈上の「その祭司」に相当するが、日本語では自然さを優先して明示しない。
- source_word: אֶצְבָּעוֹ
  choice: 指
  rationale: 単数形を保った。「自分の」は日本語では主語との関係が明白なため省略した。
- source_word: מִן הַדָּם
  choice: その血の一部に
  rationale: מןの部分を示す含意を明示し、血全体ではなく、そこから取った血に指を浸すことを表した。
- source_word: וְהִזָּה
  choice: 振りまく
  rationale: 祭儀において液体を指で散らすהזהを表す。一般的な「注ぐ」ではなく、血を散らす動作が分かる語を選んだ。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七度
  rationale: 回数を直接かつ簡潔に表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前
  rationale: לפניの「前で／御前で」という空間的・臨在的な幅を保ち、神名יהוהは称号に置き換えず「ヤハウェ」と音写した。
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: 垂れ幕の正面で
  rationale: 「幕の面／前」を表す句を自然な日本語にした。פרכתは聖所を仕切る幕であり、「垂れ幕」は具体物として理解しやすい。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の神名が記されているため、称号「主」に置き換えず、現代日本語で一般的な音写を用いた。
- issue: פרכתの訳語
  choice: 垂れ幕
  alternative: 仕切りの幕／幕
  rationale: 聖所内部の聖なる空間を隔てる建築的な幕を指すことが伝わる、平明で具体的な語を選んだ。訳語だけでは用途を尽くせないため脚注で補った。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で品位ある祭儀規定の文体とした。手順を表すヘブライ語の連続形は、日本語では「浸し……振りまく」と現在形の規定文にした。脚注記号は対応語「垂れ幕」の直後に置いた。
