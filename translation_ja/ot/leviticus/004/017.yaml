  to: 祭司は血に指を浸し、ヤハウェの前で、垂れ幕[a]の前に向けてその血を七回振りかける。
  rationale: 方向を表す原文の句を「垂れ幕の前に向けて」と訳し、散布の行為との係りを明確にした。「血に指を浸し」として現代日本語の自然さを整えた。神名の音写、祭司という用語、回数、および脚注アンカーは維持した。
