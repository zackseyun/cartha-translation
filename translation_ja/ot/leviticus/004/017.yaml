  - severity: low
    issue: 「その血の一部に指を浸し」
    rationale: מן־הדםは血から取ることを示すが、日本語で「血の一部に浸す」とすると不自然である。「血に指を浸し」で十分に原文の動作を表せる。
  - severity: low
