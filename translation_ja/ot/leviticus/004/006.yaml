id: LEV.4.6
reference: Leviticus 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: ja
  text: 祭司は指をその血に浸し、その血の一部を、ヤハウェの前で、聖所の垂れ幕の前に七回振りかける。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטָבַל
  choice: 浸し
  rationale: 儀式の指示を続ける動詞として訳した。טבל の基本義である、液体の中に入れて浸す動作を自然な日本語で表す。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: この儀式を執り行う特定の祭司を指す定冠詞付き単数名詞。日本語では文脈上、定性を別に標示しない。
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: 指をその血に
  rationale: 三人称男性単数接尾辞を伴う「彼の指」は、主語が明確な日本語では「指」とし、ב は指を浸す対象を示すため「その血に」とした。
- source_word: וְהִזָּה
  choice: 振りかける
  rationale: 祭儀的文脈で、血を散らす行為を表すヒフィル形。「振りかける」は現代日本語で明瞭であり、単なる注ぎかけとも区別できる。
- source_word: מִן־הַדָּם
  choice: その血の一部を
  rationale: מן の部分を示す用法を明示し、血の全部ではなく、そこから取った血を用いる意味を伝える。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七回
  rationale: 回数を示す標準的な表現。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の空間的・祭儀的な意味を「前で」とし、神名 יְהוָה は固有名として「ヤハウェ」と音写した。
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: 聖所の垂れ幕の正面に
  rationale: פָּרֹכֶת は聖域を隔てる幕なので「垂れ幕」、הַקֹּדֶשׁ はここでは聖なる区域を指すため「聖所」とした。פְּנֵי は幕の正面・前面を示すものとして訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある四文字神名を固有名として示し、一般読者にも認識しやすい標準的な日本語音写を用いる。
- issue: לִפְנֵי יְהוָה と垂れ幕を示す句の関係
  choice: 「ヤハウェの前で」と「聖所の垂れ幕の正面に」を併記する
  alternative: 「聖所の垂れ幕の前で」と一続きに理解する
  rationale: 原文はヤハウェの御前という祭儀的定位と、垂れ幕に対する空間的定位を重ねている。本文では双方を保ち、句の捉え方の幅を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀文としての荘重さを保った。「振りかける」「垂れ幕」は専門的すぎず、具体的な動作と物を伝える語として選んだ。
