  source_fidelity: 主要な祭儀動作、回数、神名、血、垂れ幕を正しく伝えている。ただし、אֶת־פְּנֵי（「…の前／前面に向かって」）を「垂れ幕の正面に」とすると、垂れ幕そのものの表面に散布する意味にも読める。文脈と通常の空間表現に即して「垂れ幕の前に」とするのがより安全である。
  naturalness: 原案は意味が通るが、「ヤハウェの前で、聖所の垂れ幕の正面に」の並びはやや硬く、「正面に」は場所として不自然さがある。「垂れ幕の前に」とすれば、明瞭な現代標準日本語として自然になる。
  terminology: 「祭司」「ヤハウェ」「聖所」「垂れ幕」「振りかける」はいずれも適切である。「血の一部」は מן の部分的用法を無理なく反映している。
