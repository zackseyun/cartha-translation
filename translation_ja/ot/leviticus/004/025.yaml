source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: ja
  text: 祭司は、罪のためのいけにえ[a]の血を指で少し取り、焼き尽くすいけにえの祭壇の角に塗る。それから、祭司はその残りの血を焼き尽くすいけにえの祭壇の土台に注ぎ出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。ヘブライ語の語は、罪だけでなく、汚れを取り除く清めに関わるいけにえを指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 祭司は…取り
  rationale: 一連の祭儀手順を継続する形。日本語では文脈上の順序が明らかなため、自然な手順文として訳した。
- source_word: מִדַּם
  choice: 血を…少し
  rationale: 前置詞 מִן の部分を表す用法を明示し、血の一部を取ることを示した。
- source_word: הַחַטָּאת
  choice: 罪のためのいけにえ
  rationale: ここでは抽象的な「罪」ではなく祭儀上の供え物を指す。現代の一般読者に意味が通じやすく、罪との関連も保つ表現とした。
- source_word: בְּאֶצְבָּעוֹ
  choice: 指で
  rationale: בְּ־ の道具・手段を表す用法を簡潔に反映した。
- source_word: וְנָתַן עַל
  choice: …に塗る
  rationale: 直訳は「…の上に置く」だが、血を祭壇の角に付ける具体的な祭儀動作を自然な日本語で表した。
- source_word: קַרְנוֹת
  choice: 角
  rationale: 祭壇の四隅にある角状の突起を指す定着した表現を用いた。
- source_word: מִזְבַּח הָעֹלָה
  choice: 焼き尽くすいけにえの祭壇
  rationale: עֹלָה が全体を焼く供え物であることを分かりやすく示し、その供え物に用いる祭壇として訳した。
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: 残りの血は…注ぐ
  rationale: 先に血の一部を取ったことから、ここで注ぐのが残余であるという含意を自然な日本語で明示した。
- source_word: אֶל יְסוֹד
  choice: 土台に
  rationale: יְסוֹד は祭壇の基部・土台を指す。方向を表す אֶל と合わせ、注ぐ場所を簡潔に示した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: 語は罪と関わる供え物を表す一方、祭儀的な汚れの除去・清めという側面も含み得る。本文では伝統的な罪との関連を保ち、別訳を脚注に残して意味の幅を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀の手順として簡潔な現在形を用い、「いけにえ」は一般読者への分かりやすさを優先して平仮名表記とした。
