id: LEV.4.31
reference: Leviticus 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: ja
  text: その人は、その脂肪をすべて取り除く。和解のいけにえ[a]の脂肪が取り除かれるのと同じようにである。祭司はそれを祭壇の上で焼き、主に喜ばれる香り[b]とする。祭司はその人のために贖いを行い、その人は赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「交わりのいけにえ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 祭儀で用いられる定型表現で、供え物が主に受け入れられることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: その脂肪／脂肪
  rationale: 祭儀のために取り除いて焼く脂肪を指す。原文に明示されない「脂肪の部分」という限定は加えず、平明に訳した。
- source_word: יָסִיר
  choice: 取り除く
  rationale: 使役形の「除かせる、取り除く」という意味を、祭儀手順として自然な現代日本語で表した。
- source_word: כַּאֲשֶׁר הוּסַר
  choice: 取り除かれるのと同じように
  rationale: 既定の祭儀手順との比較を示す受動表現を保った。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שלמיםという祭儀上の区分を、現代の読者にも比較的分かりやすい名称で示した。「和解のいけにえ」という訳語の可能性は脚注に残した。
- source_word: וְהִקְטִיר
  choice: 焼き
  rationale: 祭壇で焼いて煙を立ち上らせる祭儀行為を指す。本文では簡潔で自然な「焼く」とし、祭壇という文脈に意味を担わせた。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を表す語形を、日本語の祭儀文脈で自然な場所表現にした。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 喜ばれる香り
  rationale: 神がその供え物を受け入れることを香りの比喩で表す定型句である。比喩を残しつつ、「なだめの香り」より明瞭な日本語とした。
- source_word: לַיהוָה
  choice: 主に
  rationale: 神名יהוהを日本語聖書で広く理解される「主」とし、供え物の向かう相手を助詞「に」で表した。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司はその人のために贖いを行い
  rationale: 祭司による祭儀的なכפרを、伝統的で意味の幅を保てる「贖い」で訳した。原文が述べない後代の教理的仕組みは補わなかった。
- source_word: וְנִסְלַח לוֹ
  choice: その人は赦される
  rationale: סלחの受動形と、贖いに続く赦しという結果を簡潔に保った。
theological_decisions:
- issue: 祭司による贖いと赦しの関係
  choice: 祭司はその人のために贖いを行い、その人は赦される
  alternative: 祭司がその人のために罪を償うと、その人の罪は赦される
  rationale: ヘブライ語は祭司の贖いに続いて赦しを述べるが、その仕組みを詳説していない。「罪を償う」と限定したり、因果接続を強めたりせず、祭儀的・契約的な緊張を保った。
- issue: 「喜ばれる香り」の理解
  choice: 比喩を本文に保持し、受容を示す祭儀的定型句であることを脚注で説明する
  alternative: 主に受け入れられる供え物とする
  rationale: 説明的な言い換えだけにせず、原文の身体感覚に訴える比喩を保存した。
translation_notes:
  register: 律法の手順を示す簡潔で端正な文体とした。主語を必要な箇所で明示しつつ、過度に古風な語順や文末は避けた。「贖い」「祭壇」「いけにえ」など不可欠な祭儀語は保持し、脚注記号は該当する語句の直後に配置した。
