source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: ja
  text: その脂肪をすべて、平安のいけにえ[a]の脂肪と同じように、祭壇の上で焼いて煙にする。こうして祭司は、その人の罪[b]について、その人のために贖いを行う。すると、その人は赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平安のいけにえ」は、「交わりのいけにえ」または「幸い・健やかさのいけにえ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語の語は「罪」と「罪のいけにえ」のどちらも意味し得る。ここでは、その人の罪を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: その脂肪
  rationale: 犠牲動物のうち祭壇で焼くよう定められた脂肪部分を指す。接尾辞を「その」で表し、レビ記の祭儀用語として「脂肪」を一貫して用いた。
- source_word: יַקְטִיר
  choice: 焼いて煙にしなければならない
  rationale: 祭壇上で焼き、煙として立ち上らせるヒフィル形の祭儀的な意味を、自然な現代日本語で明示した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を表す語形だが、実際の祭儀動作を日本語で自然に表すため「祭壇の上で」とした。
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえの脂肪と同じように
  rationale: 比較を明確に表し、שְׁלָמִים は神との平和・交わり・健全な関係を含意する祭儀区分として「交わりのいけにえ」とした。
- source_word: וְכִפֶּר עָלָיו
  choice: 祭司は、その人の罪のために贖いを行う
  rationale: כפר の祭儀的意味を、特定の贖罪理論に限定せず「贖いを行う」と表現した。עָלָיו の対象は「その人」と明示した。
- source_word: מֵחַטָּאתוֹ
  choice: その人の罪のために
  rationale: חַטָּאת は「罪」と「罪のいけにえ」の両義を持つが、続く赦しの宣言と統語から、ここでは罪そのものを指す可能性が高い。
- source_word: וְנִסְלַח לוֹ
  choice: すると、その人は赦される
  rationale: 神を明記しない受動形を保ちつつ、赦しを受ける人物を自然な日本語で主語として示した。
theological_decisions:
- issue: שְׁלָמִים の訳語
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: この語には平和、充足、神との交わりという意味領域がある。「交わり」は祭儀の共同性を分かりやすく示すが、他の訳語も可能であるため脚注で保持した。
- issue: מֵחַטָּאתוֹ における חַטָּאת の意味
  choice: その人の罪
  alternative: その人の罪のいけにえ
  rationale: 同語はレビ記で罪と罪のいけにえの双方を表し得る。しかし、祭司がその人のために贖いを行い、その人が赦されるという文脈では「罪」が最も自然である。曖昧さは脚注に残した。
- issue: וְנִסְלַח לוֹ の動作主
  choice: 神を明記しない受動表現
  alternative: 神はその人を赦される
  rationale: ヘブライ語本文は赦しの動作主を明示していないため、神学的に当然と推測される主語を訳文へ補わず、原文の受動表現を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀動作は「焼いて煙にする」と具体的にし、義務を表す未完了形は「しなければならない」で表した。指示対象の混乱を避けるため「その人」を補い、原文の節の進行は「こうして」「すると」で自然につないだ。
