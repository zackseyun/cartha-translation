  to: その脂肪をすべて、平安のいけにえ[a]の脂肪と同じように、祭壇の上で焼いて煙にする。こうして祭司は、その人の罪[b]について、その人のために贖いを行う。すると、その人は赦される。
  rationale: 原文の比較句を祭壇で脂肪を焼く動作に直接結び付けた。贖いの句では、対象者と罪との関係を区別して表した。脚注aは、原語の意味範囲と英語監査記録の代替案をより適切に反映するよう改めた。
