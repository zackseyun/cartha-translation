source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ja
  text: それから祭司は、指で罪のためのいけにえ[a]の血の一部を取り、全焼のささげ物を献げる祭壇の角に塗る。その血をすべて祭壇の土台に注ぎ出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのためのいけにえ」。ヘブライ語の語は、罪にかかわる、また儀礼上の清めのために献げられるいけにえを指すことがある。
    reason: חַטָּאת は「罪のためのいけにえ」とも「清めのためのいけにえ」とも訳し得るため。
lexical_decisions:
- source_word: וְלָקַח
  choice: それから……取る
  rationale: 接続詞を伴う完了形が祭儀手順の次の段階を示すため、現代日本語で順序が明確になるよう「それから」とした。規定文として現在形で表した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀を執行する者を指す定冠詞付き名詞の標準的な訳語。
- source_word: מִדַּם הַחַטָּאת
  choice: 罪のためのいけにえの血を
  rationale: מִן は文脈上、血の一部を取ることを表す部分用法。日本語では後続の「すべて」と手順から一部であることが分かるため、自然な表現を優先した。חַטָּאת はここでは抽象的な罪ではなく祭儀上の供え物を指す。
- source_word: בְּאֶצְבָּעוֹ
  choice: 指で
  rationale: 前置詞 בְּ の道具・手段の用法を簡潔な現代日本語で表した。
- source_word: וְנָתַן
  choice: 塗る
  rationale: 基本義は「置く、付ける」だが、指で血を祭壇の角に付ける祭儀動作を自然かつ明確に表すため「塗る」とした。
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物の祭壇の角に
  rationale: 祭壇の突起を示す「角」を保持し、עֹלָה は全体を焼く供え物であることが伝わる訳語とした。
- source_word: וְאֶת כָּל דָּמָהּ
  choice: その血をすべて
  rationale: כָּל の全体性を保持した。実際には先に一部を用いた後の残りを指すが、原文どおり「すべて」とし、解釈による補足を本文に加えなかった。
- source_word: יִשְׁפֹּךְ
  choice: 注ぎ出す
  rationale: 意図的な祭儀行為として血を流し出すことを表し、偶発的な「こぼす」を避けた。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 祭壇の土台に
  rationale: יְסוֹד の「基礎、土台」という具体的意味を明瞭に表した。אֶל はここでは注ぎ出す先を示す。
theological_decisions:
- issue: 祭儀規定における חַטָּאת の訳
  choice: 罪のためのいけにえ
  alternative: 清めのためのいけにえ
  rationale: この文脈では語が供え物を指すことは明らかだが、その祭儀は罪との関係と清めの機能の双方を含み得る。本文では一般読者に理解しやすい伝統的な意味を自然な日本語で示し、清めを強調する訳も脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は一読して意味を取りやすい表現を用い、「角」「土台」など原文の具体的イメージを保持した。
