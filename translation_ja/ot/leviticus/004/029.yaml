id: LEV.4.29
reference: Leviticus 4:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: ja
  text: その人は罪のためのいけにえ[a]の頭に手を置き、全焼のいけにえを屠る場所で、罪のためのいけにえを屠る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。ヘブライ語の「ハッタート」は、罪と清めに関わるいけにえを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: 手を置き
  rationale: סמך は祭儀の文脈で、いけにえの上に手を置く、または押し当てる行為を表す。現代日本語では「手を置く」が明瞭で自然である。
- source_word: יָדוֹ
  choice: 手
  rationale: ヘブライ語は三人称男性単数接尾辞を伴う単数形であり、「両手」とせず単数を保った。主語は文脈上「その人」と明示した。
- source_word: עַל רֹאשׁ
  choice: 頭に
  rationale: 位置と接触を自然な日本語で表し、祭儀行為の具体性を保持する。
- source_word: הַחַטָּאת
  choice: 罪のためのいけにえ
  rationale: חטאת はここでは罪そのものではなく、罪および清めに関わる供え物を指す。「罪祭」より一般読者に意味が伝わりやすく、同時に「清めのいけにえ」という語義上の可能性を脚注に残せる。
- source_word: וְשָׁחַט
  choice: 屠る
  rationale: שחט は祭儀用の動物を屠殺する専門的行為を表す。「殺す」より祭儀的な意味が明確で、簡潔かつ格調も保てる。
- source_word: בִּמְקוֹם
  choice: 場所で
  rationale: 動作が行われる指定地点を示すため、日本語の場所格「で」を用いた。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: עלה は祭壇上で全体を焼く供え物を指す定着した祭儀語である。「焼き尽くすいけにえ」も可能だが、「全焼のいけにえ」は簡潔で識別しやすい。
theological_decisions:
- issue: 祭儀用語 חטאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: この文では具体的に頭へ手を置き、屠る動物を指すため、「いけにえ」とする必要がある。חטאת は罪との関連と清めの働きの双方を含み得るので、本文では罪との関連を示し、別訳を脚注に掲げて意味を狭めすぎないようにした。
- issue: 法規・祭儀手順における動詞形の表現
  choice: 手を置き、……屠る
  alternative: 手を置かなければならない／手を置きなさい
  rationale: ヘブライ語の連続形がこの文脈では手順を示すことを、現代日本語の規定文として自然な非過去形で表した。義務表現や命令形を補わず、原文の簡潔さを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀文としての端正さを保った。「罪祭」のような専門的な漢語を避け、「罪のためのいけにえ」として一般読者への分かりやすさを優先した。原文の単数の「手」と、同じ חטאת の反復を保持した。
