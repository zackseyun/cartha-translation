base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: ja
  text: 雄牛を丸ごと宿営の外へ、清い場所[a]、すなわち灰を捨てる場所へ運び出し、薪の上で火を使って焼く。灰を捨てる場所で焼かれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「儀礼上清い場所」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: 運び出し
  rationale: ヒフィル形の使役・方向性を保ち、雄牛を宿営の外へ移す動作を自然な日本語で表した。
- source_word: כָּל הַפָּר
  choice: 雄牛を丸ごと
  rationale: כָּל が雄牛全体を指すことを、明瞭で自然な表現にした。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: 宿営の境界外への方向を明示した。
- source_word: מָקוֹם טָהוֹר
  choice: 清い場所
  rationale: レビ記における儀礼的清浄の含意を保ちつつ、本文では簡潔に訳した。
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: 灰を捨てる場所
  rationale: 灰を注ぎ出すために定められた処分場所という具体的意味を、現代日本語で明瞭に表した。
- source_word: וְשָׂרַף אֹתוֹ
  choice: 焼く
  rationale: שׂרף の通常の意味を保ち、祭儀上の手順として簡潔に訳した。
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: 薪の上で火をもって
  rationale: 燃料である木と、火によって焼くことの両方を訳文に残した。
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: 灰を捨てる場所で焼かなければならない
  rationale: 指定場所を重ねて強調する原文の法的文体を保持し、受動形を義務表現として自然に示した。
theological_decisions:
- issue: טָהוֹר の儀礼的清浄の含意
  choice: 清い場所
  alternative: 儀礼上清い場所
  rationale: 祭儀的文脈から儀礼上の清浄が念頭にあるが、原語自体の簡潔さを本文に保ち、含意は脚注で明示した。
- issue: שֶׁפֶךְ הַדֶּשֶׁן が指す場所
  choice: 灰を捨てる場所
  alternative: 灰捨て場／灰を注ぎ出す場所
  rationale: 単なる灰の山ではなく、祭壇の灰を処分する指定場所を指すことが伝わる表現を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で厳かな祭儀法の文体。原文にある指定場所の反復を残した。
