base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: ja
  text: 彼はその雄牛を宿営の外へ運び出し、先の雄牛を焼いたのと同じように、それを焼かなければならない。これは会衆のための罪のささげ物[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのささげ物」とも訳せる。ヘブライ語の語は、罪への対処だけでなく、汚れを取り除く働きを強調する場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: 運び出し
  rationale: 使役形の「外へ出す、運び出す」を表し、雄牛を宿営外へ移す動作として自然である。
- source_word: הַפָּר
  choice: その雄牛
  rationale: פַּרは雄牛を指す。定冠詞と文脈上すでに特定されている犠牲動物であることを「その」で示した。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: 宿営の境界外への移動を、簡潔で自然な日本語で表した。
- source_word: וְשָׂרַף אֹתוֹ
  choice: それを焼かなければならない
  rationale: שׂרףの基本義「焼く」を保ち、祭儀規定の指示として訳した。
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: 焼いたのと同じように
  rationale: 先の処置との明確な比較を表す。
- source_word: הַפָּר הָרִאשׁוֹן
  choice: 最初の雄牛
  rationale: 先に記された雄牛を指すרִאשׁוֹןを直接的に訳した。
- source_word: חַטַּאת
  choice: 罪のためのささげ物
  rationale: 祭儀文脈で罪に関わる供え物を指すことを、一般読者に理解しやすく表した。清めの機能を強調する訳も可能なため脚注に示した。
- source_word: הַקָּהָל
  choice: 会衆
  rationale: 契約共同体として集められた民全体を指す語として、簡潔かつ定着した表現を用いた。
- source_word: הוּא
  choice: これは…である
  rationale: 雄牛を会衆のささげ物として同定する述語的な代名詞の働きを明示した。
theological_decisions:
- issue: 祭儀用語חַטַּאתの訳し方
  choice: 罪のためのささげ物
  alternative: きよめのささげ物
  rationale: この語は「罪」と、それに関わる犠牲の両方を表し得る。本文では犠牲動物を指すため「ささげ物」とし、罪への対処を明示した。一方、祭儀上の汚れを除く機能を前面に出す理解も排除せず、脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀規定にふさわしい簡潔で厳粛な調子とした。「焼かなければならない」により命令的規定を自然に示し、原文末尾の同定文は独立した一文として保った。
