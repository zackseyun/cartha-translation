source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: ja
  text: 油を注がれた祭司は、雄牛の血をいくらか取り、それを会見の天幕の中へ携えて行く。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「雄牛の血から」。ここでのヘブライ語は、その血の一部を取るという意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「会見の天幕へ」。続く儀式が天幕の内部で行われるため、本文では「中へ」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 取り
  rationale: 祭儀手順を示す文脈で、接続詞付き完了形を順次的な指示として訳した。日本語では「取り……携えて行く」という連用形で自然に手順の連続を表せる。
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: 油を注がれた祭司
  rationale: מָשִׁיחַ の語義である「油を注がれた」を保ち、「大祭司」という解釈的な称号への置換や、後代のメシア的含意の持ち込みを避けた。
- source_word: מִדַּם הַפָּר
  choice: 雄牛の血をいくらか
  rationale: 前置詞 מִן を部分の意味に取り、血の全量ではなく、その一部を取ることを明瞭で自然な日本語にした。
- source_word: וְהֵבִיא אֹתוֹ
  choice: それを……携えて行く
  rationale: 目的語接尾辞は直前の「血」を指す。「携えて行く」は、物を所定の場所へ運び入れる祭儀動作を自然に表す。
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: 会見の天幕の中へ
  rationale: אֶל 自体は「へ／に」だが、後続する儀式が天幕内で行われる文脈を踏まえ、到達だけでなく内部への移動を示した。「会見の天幕」は אֹהֶל מוֹעֵד の伝統的かつ理解しやすい訳語。
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ の職名表現
  choice: 油を注がれた祭司
  alternative: 大祭司／聖別された祭司
  rationale: 原語の「油を注がれた」という表現を保持する。「大祭司」は文脈上の身分を説明するが原文の語形そのものではなく、「聖別された」は意味を一般化するため、本文では採用しない。
- issue: אֶל が示す移動の到達点
  choice: 会見の天幕の中へ
  alternative: 会見の天幕へ
  rationale: 原語の前置詞だけなら単に「へ」も可能だが、続く節の動作が聖所内部で行われるため、「中へ」が儀礼上の移動を適切に伝える。原語により近い別訳は脚注に示す。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある祭儀規定の文体。「雄牛」「祭司」「会見の天幕」はレビ記の用語として一貫性を重視し、命令的手順は日本語で不自然な未来形を用いず、非過去形で表した。
