id: LEV.4.23
reference: Leviticus 4:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: ja
  text: あるいは、彼が犯した罪を知らされたなら[a]、彼は献げ物として、傷のない雄のやぎを携えて来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「彼の罪、すなわち彼が犯した罪を知らされたなら」。
    reason: 原文では「彼の罪」が先に置かれ、その後に「彼が犯した」という説明が続く構造を示すため。
lexical_decisions:
- source_word: אֽוֹ
  choice: あるいは
  rationale: 前節から続く規定のもう一つの条件を示す選言接続詞として訳した。
- source_word: הוֹדַע אֵלָיו
  choice: 知らされたなら
  rationale: ידעのホファル形が表す受動の意味を保ち、本人が自力で気づくというより、その罪が本人に知らされることを示した。
- source_word: חַטָּאתוֹ
  choice: 彼が犯した罪
  rationale: 後続の関係節と自然にまとめ、ここでは供え物ではなく、犯した罪そのものを指すことを明確にした。
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: 彼が犯した
  rationale: בָּהּを日本語で不自然に逐語化せず、חטאの目的内容を表す自然な表現とした。
- source_word: וְהֵבִיא
  choice: 彼は……携えて来なければならない
  rationale: 法規における結果・義務を表す用法として、規定上の要求が明確になるように訳した。
- source_word: קָרְבָּנוֹ
  choice: 献げ物として
  rationale: 神の前に携えて来る供え物を指す語として、現代日本語で分かりやすく、祭儀的な意味も保つ表現を選んだ。
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: 雄のやぎ
  rationale: 動物の種類と明示された性別を、重複を避けつつ正確に表した。
- source_word: תָּמִים
  choice: 傷のない
  rationale: 祭儀用動物に欠陥がないことを表す、明瞭で自然な日本語とした。
theological_decisions:
- issue: חַטָּאתの意味
  choice: 罪、すなわち犯した行為
  alternative: 罪のためのいけにえ
  rationale: 「彼がそれによって犯した」という関係節が付くため、ここでは供え物ではなく罪を指す。供え物は後半でקָרְבָּנוֹとして別に示されている。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法としての品位と義務性を保った。「携えて来る」によって、単に差し出すだけでなく、献げ物を所定の場所へ持参する動作を表した。
