source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ja
  text: 祭司は、その血の一部を指で取り、焼き尽くすいけにえの祭壇の角[a]に塗る。そして、その血をすべて祭壇の土台に注ぎ出す。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祭壇の角」とは、祭壇の四隅にある角状の突起のこと。
    reason: cultural_note
  - marker: b
    text: 先に血の一部を祭壇の角に塗っているため、ここで「その血をすべて」とあるのは、残った血をすべて注ぎ出すという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: 祭司は……取り
  rationale: 祭儀の手順を定める文脈なので、過去の出来事ではなく規定として自然な日本語で表した。
- source_word: מִדָּמָהּ
  choice: その血の一部を
  rationale: 前置詞 מִן の部分を表す用法を明示し、祭壇に塗るため血の一部を取ることを示した。
- source_word: בְּאֶצְבָּעוֹ
  choice: 指で
  rationale: בְּ はここでは手段を示し、血を取って塗る際に指を用いることを表す。
- source_word: וְנָתַן
  choice: 塗る
  rationale: 基本義は「置く、付ける」だが、血を祭壇の角に付着させる祭儀動作として、現代日本語では「塗る」が明瞭で自然である。
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: 焼き尽くすいけにえの祭壇の角に
  rationale: קֶרֶן の祭儀上の具体的な像を「角」として保持し、מִזְבַּח הָעֹלָה を当該いけにえの祭壇として訳した。
- source_word: וְאֶת כָּל דָּמָהּ
  choice: その血をすべて
  rationale: כָּל の包括的な表現を本文に保持した。先に一部を用いた後なので実際には残りの血を指すことは脚注で説明した。
- source_word: יִשְׁפֹּךְ
  choice: 注ぎ出す
  rationale: 祭儀文脈における שׁפך の標準的な動作を、明瞭な現代日本語で表した。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 祭壇の土台に
  rationale: יְסוֹד は祭壇の基部を指すため「土台」とした。אֶל の方向性も「に」で自然に表した。
theological_decisions:
- issue: 祭儀規定における動詞の時制・法
  choice: 「取り……塗る。そして……注ぎ出す」と規定・手順として訳す
  alternative: 「取った……塗った……注ぎ出した」と過去の叙述として訳す
  rationale: この節は一回限りの歴史的出来事ではなく、罪のいけにえの手順を定める法的・祭儀的文脈に属するため。日本語では非過去形が規定を自然に表す。
- issue: 祭壇の付属部分を表す祭儀用語
  choice: 「角」を保持する
  alternative: 「隅」または「角状の突起」と機能的に言い換える
  rationale: ヘブライ語 קַרְנוֹת の具体的な祭儀的表象を本文で保持し、形状は脚注で補足するのが適切である。
- issue: 「その血をすべて」と先行する一部使用との関係
  choice: 本文では原文どおり「その血をすべて」とする
  alternative: 「残りの血をすべて」と明示する
  rationale: 文脈上は残った血を指すが、原文は「残り」と明記せず כָּל דָּמָהּ としているため、本文では表現を保持し、含意を脚注で説明した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。祭儀用語「祭壇の角」は原語の像を保ち、「焼き尽くすいけにえ」は עֹלָה の全焼性が一般読者にも伝わる表現とした。規定文として簡潔な非過去形を用いた。
