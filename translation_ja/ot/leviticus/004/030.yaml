  terminology: 「祭司」「祭壇」「角」「土台」は原語の祭儀用語と対応している。「塗る」は נתן の字義よりやや具体的だが、指で血を角に付着させる文脈に即した自然な訳語であり、意味を不当に限定しない。脚注aは「角」の形状を補い、脚注bは「すべて」の文脈的含意を本文に加筆せず説明している。
