  text: וְ/עָשָׂ֣ה לַ/פָּ֔ר כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/פַ֣ר הַֽ/חַטָּ֔את כֵּ֖ן יַעֲשֶׂה לּ֑/וֹ וְ/כִפֶּ֧ר עֲלֵ/הֶ֛ם הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: ja
  text: 彼は、この雄牛を、罪のためのささげ物[a]の雄牛にしたのと同じように扱う。この雄牛にも、そのように行う。祭司は彼らのために贖いを行い、彼らは赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのささげ物」。ヘブライ語の語は、罪に対処して清めをもたらすささげ物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: この雄牛にも行う
  rationale: עשה＋ל が示す、雄牛に対する一連の祭儀上の処置を、文脈から自然に理解できる簡潔な日本語で表した。
- source_word: כַּאֲשֶׁר עָשָׂה לְפַר הַחַטָּאת
  choice: 罪のためのささげ物の雄牛にしたのと同じように
  rationale: 比較を表す כַּאֲשֶׁר を「同じように」とし、直前までに述べられた雄牛の儀式を明示的に参照する形を保った。
- source_word: הַחַטָּאת
  choice: 罪のためのささげ物
  rationale: 祭儀用語として、罪を扱うささげ物であることを一般読者に明確に伝える。清めをもたらすささげ物という語義上の側面は脚注に残した。
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: この雄牛にも行う
  rationale: 指示対象が現在の雄牛であることを明確にし、「同じように」との対応によって כֵּן の意味を自然な日本語に組み込んだ。
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: 祭司は彼らのために贖いを行い
  rationale: כפר の祭儀的・神学的重みを保つため「贖いを行う」とし、על は受益・代理を示す「彼らのために」と訳した。
- source_word: וְנִסְלַח לָהֶם
  choice: 彼らは赦される
  rationale: סלח のニファル形が表す受動的な赦しの結果を、自然で明瞭な日本語の受身で示した。
theological_decisions:
- issue: 祭儀用語 חטאת の訳し分け
  choice: 罪のためのささげ物
  alternative: 清めのささげ物
  rationale: この語は、対処される罪と、儀式によってもたらされる清めの両面を帯びうる。本文では罪との関係が直ちに分かる訳を採り、清めを強調する有力な別訳を脚注に示して、語義の幅を保持した。
- issue: כפר の表現
  choice: 贖いを行う
  alternative: 償いをする／清めを行う
  rationale: 罪の赦しへ至る祭儀上の働きを一つの理論に限定せず、レビ記の中心的用語としての連続性を保つ表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀文としての荘重さを保った。「贖い」は日常語ではないが、כפר の重要な祭儀的意味を薄めないために採用した。
