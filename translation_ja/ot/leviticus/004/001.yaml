  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセに次のように語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語はYHWH（四文字神名）。一般に「ヤハウェ」と表記されるが、「エホバ」とも表記される。正確な古代の発音は確定していない。
    reason: 神名の原語表記、異なる音写、および発音上の不確実性を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神が新たな指示を語り始める定型句として、現代日本語で自然かつ尊厳のある表現を選んだ。「語られた」も可能だが、後続する神の命令を導入する文脈では「告げられた」が明瞭である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名YHWHを一般的な推定発音で音写した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を、自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後続する発言内容を導入するヘブライ語の定型表現を、日本語で不自然な「言って言われた」とせず、「こう告げられた」と表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: エホバ、主
  rationale: 原文は称号ではなく四文字神名YHWHを用いているため、その固有名としての性格を保つ。「エホバ」は別の伝統的音写であり、「主」はユダヤ教・キリスト教の朗読上の代読を反映するが、本文上の語形そのものではない。発音の不確実性は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語。神の発話にふさわしい尊厳を保ちつつ、ヘブライ語の重複的な発話導入句は日本語として自然な「こう告げられた」にまとめた。
