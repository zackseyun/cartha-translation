  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: ja
  text: あるいは、自分が犯した罪を知らされたなら[a]、その人は、犯した罪のためのささげ物として、傷のない雌の山羊を献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分が犯した罪が分かったなら」または「自分の罪を知らされたなら」。ヘブライ語の受動形は、自ら認識する場合にも、誰かから知らされる場合にも解することができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: あるいは
  rationale: 直前の法的事例に対する別の場合を導入する接続詞として、ヘブライ語の選択的なつながりを保つ。
- source_word: הוֹדַע אֵלָיו
  choice: 知らされたなら
  rationale: ידעのホファル形が示す受動の意味を保つ。自ら気づく場合か、他者から告げられる場合かを本文だけで限定しない。
- source_word: חַטָּאתוֹ
  choice: 自分が犯した罪／犯した罪
  rationale: この節では供え物そのものではなく、本人が犯した行為を指すため、「罪」と訳す。
- source_word: וְהֵבִיא
  choice: 献げなければならない
  rationale: 祭儀法における規定としての義務性を、自然な現代日本語で示す。
- source_word: קָרְבָּנוֹ
  choice: ささげ物として
  rationale: 祭壇に近づけて献げる供え物を表す語。後続する動物を、本人の供え物として持参する意味を明確にする。
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: 雌の山羊
  rationale: 原文は雌であることを明記しているため、その指定を簡潔に保持する。
- source_word: תְּמִימָה
  choice: 傷のない
  rationale: 祭儀用動物に欠陥がないことを表す標準的な意味を、明快な日本語で示す。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 犯した罪のための
  rationale: 供え物と罪との関係を示す表現であり、目的・理由を過度に限定せず「ための」と訳す。
theological_decisions:
- issue: 祭儀的文脈におけるחַטָּאתの意味
  choice: 二つのחַטָּאתをいずれも「罪」と訳す。
  alternative: 後半を「罪のきよめのささげ物」または「罪祭」と訳す。
  rationale: この節では供え物はקָרְבָּנוֹと呼ばれ、具体的に雌山羊と特定されている。二度のחַטָּאתוֹはいずれも「彼が犯した」という関係節を伴い、供え物ではなく違反行為を指す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。祭儀用語は専門的な「罪祭」を避け、「ささげ物」「献げる」として一般読者にも理解しやすくした。原文の受動表現にある曖昧さは脚注で保持した。
