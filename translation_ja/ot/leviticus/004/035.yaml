id: LEV.4.35
reference: Leviticus 4:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: ja
  text: また、その脂肪をすべて取り除く。すなわち、交わりのいけにえの子羊から脂肪を取り除くのと同じようにする。祭司はそれらを、祭壇の上で、ヤハウェへの火によるささげ物[a]の上に載せて焼いて煙にする。こうして祭司は、その人が犯した罪について、その人のために贖いを行う。すると、その人は赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェへの食物のささげ物」。ヘブライ語は、火でささげる物を指す祭儀上の専門表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: 脂肪
  rationale: 犠牲動物から取り除いて祭壇で焼くよう定められた脂肪を指す。解釈を加えた「脂肪の部分」より、原語の基本義を保った。
- source_word: יָסִיר / יוּסַר
  choice: 取り除く／取り除かれる
  rationale: 祭儀の手順として、動物から脂肪を除く動作を明確に表す。
- source_word: הַכֶּשֶׂב
  choice: 子羊
  rationale: 犠牲祭儀の文脈で指示される羊を、自然で具体的な日本語で表した。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שלמיםという祭儀区分には「和解」「平和」「交わり」などの含意があるが、意味を一つの神学的説明に狭めず、現代の読者にも理解しやすい名称とした。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 祭壇で単に焼却するだけでなく、煙として立ち上らせる祭儀的動作を表す語の含意を明示した。
- source_word: אֹתָם
  choice: それらを
  rationale: ヘブライ語の男性複数代名詞を反映し、取り分けられた複数の脂肪部分を受ける表現とした。
- source_word: עַל אִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物の上で
  rationale: עַלの位置関係と、אִשֶּׁהの専門的な祭儀用語としての性格を保った。別解は脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: וְכִפֶּר עָלָיו
  choice: その人のために贖いを行う
  rationale: 祭司による祭儀的行為を表す広い聖書的概念を保ち、特定の贖罪理論に限定しない表現とした。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: その人が犯した罪について
  rationale: 原文の前置詞句と同根語の反復が示す対象を、自然な現代日本語で伝えた。
- source_word: וְנִסְלַח לוֹ
  choice: その人は赦される
  rationale: 受動形が表す、祭儀の結果として本人に与えられる赦しを明瞭にした。
theological_decisions:
- issue: 祭儀的なכפרの訳し方
  choice: 贖いを行う
  alternative: 償いをする／罪を覆う
  rationale: この節は祭司の祭儀とその結果を述べるが、作用の仕組みを体系的に説明してはいない。「贖い」はその幅を保ち、「罪を覆う」のような語源的説明や特定理論への限定を避ける。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある四文字神名を称号へ置換せず、一般的な学術的再建に基づいて音写した。
- issue: שלמיםの祭儀名称
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平和のいけにえ
  rationale: 語の含意を「罪からの和解」に限定せず、共同の食事を伴う祭儀的交わりを想起させる、理解しやすい名称を採った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀本文にふさわしい端正さを保った。「また」「こうして」「すると」で手順と結果の流れを示した。原文の複数代名詞は「それら」として明示し、祭壇上で煙にする動作も具体的に表現した。
