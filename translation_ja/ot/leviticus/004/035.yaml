  naturalness: 「交わりのいけにえの子羊から脂肪が取り除かれるのと同じようにである」は現代標準語として不自然な断定的補足文になっている。また、「祭壇の上、…の上で」も日本語として読みづらい。文の関係を明示して整えるのが安全である。
