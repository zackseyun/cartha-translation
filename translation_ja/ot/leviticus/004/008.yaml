base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: ja
  text: 彼は、罪のためのいけにえの雄牛から、その脂肪をすべて取り除く。すなわち、内臓を覆う脂肪と、内臓の上にあるすべての脂肪である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのいけにえ」とも訳せる。ヘブライ語のハッタートは「罪」を表すと同時に、罪や汚れを取り除くためのいけにえを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: すべて
  rationale: 指定された脂肪を残らず取り除くという、ヘブライ語の包括的な意味を保つ。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 犠牲の動物から取り分ける特定の脂肪部位を指す。後続の解剖学的説明によって範囲が明確になるため、簡潔に「脂肪」とした。
- source_word: פַּר הַחַטָּאת
  choice: 罪のきよめのいけにえとして献げる雄牛
  rationale: 雄牛がחַטָּאתのために指定された動物であることを自然な日本語で示す。「罪」と「きよめ」の両面を含みうる祭儀用語の幅を、本文と注で保持する。
- source_word: יָרִים
  choice: 取り除く
  rationale: 字義的には「持ち上げる」だが、ここでは指定された脂肪を動物から分離して取る祭儀上の動作を表す。
- source_word: מִמֶּנּוּ
  choice: 雄牛から
  rationale: 代名詞の指示対象を日本語で明確にし、手順文として自然にした。
- source_word: הַמְכַסֶּה
  choice: 覆う
  rationale: 脂肪の位置と形状を説明する限定的な分詞の意味を簡潔に表す。
- source_word: קֶרֶב
  choice: 内臓
  rationale: 祭儀上の解剖学的文脈に適し、現代日本語で明瞭かつ過度に専門的でない。
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: 内臓に付いている
  rationale: עַלの位置関係を、日本語で解剖学的に自然な表現にした。「覆う脂肪」と区別される、内臓上の脂肪を示す。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳
  choice: 罪のきよめのいけにえ
  alternative: 罪のためのいけにえ／清めのいけにえ
  rationale: חַטָּאתは「罪」と、それに関わる除去・きよめの祭儀の双方を含みうる。「罪のためのいけにえ」だけではきよめの機能が見えにくく、「清めのいけにえ」だけでは語の罪との結びつきが弱まるため、本文では両面を示し、注で代案を明記した。
translation_notes:
  register: 祭儀の手順として明快で、現代の一般読者にも理解できる格調ある文体。「彼は」を保持して前節から続く祭司の動作を示し、原文の反復は「すなわち」で自然に展開した。
