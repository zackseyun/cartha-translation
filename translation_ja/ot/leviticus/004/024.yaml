  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: ja
  text: その人は雄やぎの頭に手を置き、ヤハウェの前で全焼のささげ物を屠る場所で、それを屠る。これは罪のためのささげ物[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清めのささげ物」。ヘブライ語「ハッタート」は、罪を表すことも、罪や汚れを除くためのささげ物を表すこともある。
    reason: חַטָּאת の語義と祭儀的機能に関する真正な幅を示すため。
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: その人は……手を置き
  rationale: 祭儀上の סמך יד を、単数の「手」を保ちながら現代日本語で自然な「手を置く」とした。主語は文脈上の奉献者を指すため「その人」と明示した。
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: 雄やぎの頭に
  rationale: שָׂעִיר はここでは雄のやぎを指す。日本語として自然な助詞「に」を用いた。
- source_word: וְשָׁחַט אֹתוֹ
  choice: それを屠る
  rationale: שׁחט は祭儀的な屠殺を表すため、一般的な「殺す」ではなく「屠る」とした。
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: 全焼のささげ物を屠る場所において
  rationale: 能動形 יִשְׁחַט の不特定主語を日本語では自然に省略し、指定された祭儀の場所を明確にした。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: עֹלָה は祭壇上ですべてを焼くささげ物を指す。「全焼のささげ物」は意味が明瞭で、現代の一般読者にも理解しやすい。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神名 יהוה を称号に置き換えず「ヤハウェ」と音写し、לִפְנֵי の臨在・位置関係を「前で」で表した。
- source_word: חַטָּאת הוּא
  choice: これは罪のきよめのささげ物である
  rationale: חַטָּאת は罪に関わるささげ物であると同時に、罪や汚れを除く祭儀的機能を持つ。「罪のきよめのささげ物」により両面を簡潔に示し、別訳を注記した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の契約名を保持するため音写した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物、清めのささげ物
  rationale: 語が「罪」と、罪・汚れを除く祭儀の双方に関係する曖昧さを持つため、一方だけに限定せず複合的に表現した。定着した別表現は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祭儀法にふさわしい簡潔で格調ある文体とした。「屠る」は文脈上必要な祭儀語として用い、「ささげ物」は読みやすさを優先して平仮名を交えた。
