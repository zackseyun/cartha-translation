id: LEV.4.18
reference: Leviticus 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: ja
  text: その血の一部[a]を、会見の天幕の中にあり、ヤハウェの前にある祭壇の角々に付ける。そして、血をすべて、会見の天幕の入口にある全焼のささげ物の祭壇の土台のところに注ぎ出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その血から付ける」。後に「血をすべて」とあることとの対比から、ここでは血の一部を指す。
    reason: 原文の部分を表す構文と、訳文で補った「一部」を説明するため。
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: その血の一部を
  rationale: ヘブライ語は字義的には「その血から」と始まる。後半の「血をすべて」との対比から部分を表す用法であるため、自然な日本語として「一部」を補った。
- source_word: יִתֵּן
  choice: 付ける
  rationale: נתן の基本義は「与える、置く」。ここでは血を祭壇の角に置く祭儀行為を、過度に専門化せず自然に「付ける」とした。
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: 祭壇の角
  rationale: קרנות の字義であり、祭壇の構造を示す定着した祭儀用語「角」を保持した。
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: ヤハウェの前の
  rationale: לִפְנֵי の空間的な意味「前に」を保ち、神名 יְהוָה は称号に置き換えず「ヤハウェ」と音写した。
- source_word: אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中にある
  rationale: אֹהֶל מוֹעֵד を明瞭で定着した「会見の天幕」とし、בְּ の位置関係を「中にある」で明示した。
- source_word: וְאֵת כָּל הַדָּם
  choice: そして、血をすべて
  rationale: 文脈上は角に付けた後の残りの血を指すが、原文の כל「すべて」を解釈的に「残り」に置き換えず保持した。
- source_word: יִשְׁפֹּךְ
  choice: 注ぐ
  rationale: שׁפך の祭儀文脈における通常の意味を、簡潔で自然な日本語にした。
- source_word: אֶל יְסוֹד
  choice: 土台に
  rationale: יְסוֹד は「基礎、土台」を意味する。祭壇の下部を指す語として具体的な「土台」を選んだ。
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物の祭壇
  rationale: עֹלָה は供え物全体を焼く献げ物を指すため、その特徴が普通の読者に伝わる「全焼のささげ物」とした。
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口にある
  rationale: פֶּתַח の空間的意味を、現代日本語で自然な「入口」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を直接用いているため、称号「主」に置き換えず、現代日本語で一般的な音写「ヤハウェ」を用いた。
- issue: כָּל הַדָּם が指す血の範囲
  choice: 血をすべて
  alternative: 残りの血をすべて
  rationale: 文脈上は残った血を指すと理解できるが、原文は「残り」と明記せず「すべて」とするため、その表現上の緊張を保持した。
translation_notes:
  register: 祭儀規定にふさわしい簡潔で格調ある常体とした。日本語では主語を繰り返さず、原文で暗示される執行者を文脈に委ねた。「塗る」より原語の一般性を保つ「付ける」を選び、専門用語には読者が意味を把握しやすい現代的な表現を用いた。
