id: LEV.4.3
reference: Leviticus 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: ja
  text: もし、油を注がれた祭司[a]が罪を犯し、そのために民が罪責を負うことになるなら[b]、その祭司は、自分が犯した罪のために、牛の群れから傷のない雄牛一頭を、罪のささげ物としてヤハウェに献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は「油を注がれた大祭司」を指すと考えられる。ヘブライ語は字義どおりには「油を注がれた祭司」。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「民の罪責に至るなら」。簡潔な原文は、祭司の罪によって民にも罪責が及ぶことを示すが、その関係を詳しく説明してはいない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: 油を注がれた祭司
  rationale: ヘブライ語は字義どおりには「その祭司、油を注がれた者」。文脈上は大祭司を指すが、本文に「大」を意味する語はないため、原文の表現を保った。
- source_word: יֶחֱטָא
  choice: 罪を犯し
  rationale: אִם に続く法規上の条件文として、自然な現代日本語の「もし……罪を犯し」とした。
- source_word: לְאַשְׁמַת הָעָם
  choice: そのために民が罪責を負うことになる
  rationale: לְ と אַשְׁמָה の簡潔な句が示す、祭司の罪によって民にも罪責が及ぶという結果を表す。ただし、その仕組みまでは説明しない。
- source_word: וְהִקְרִיב
  choice: 献げなければならない
  rationale: 祭儀法の文脈における הקריב は、供え物を神の前に持って来て献げることを表す。日本語の法規的な義務表現で訳した。
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 自分が犯した罪のために
  rationale: 原文の反復を過度に逐語化せず、どの罪のための供え物かを明確にした。
- source_word: פַּר בֶּן בָּקָר
  choice: 牛の群れの中から……若い雄牛一頭
  rationale: פַּר と בֶּן בָּקָר が示す牛種と若い雄牛という意味を、自然な日本語で表した。
- source_word: תָּמִים
  choice: 傷のない
  rationale: 犠牲動物に欠陥がないことを示す祭儀上の定型的意味を、平明な日本語で表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名 יהוה を称号に置き換えず、固有名として音写した。
- source_word: לְחַטָּאת
  choice: 罪のささげ物として
  rationale: ここで חַטָּאת は罪そのものではなく、罪に関する犠牲の名称を指すため、「罪のささげ物」とした。
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ を「油を注がれた祭司」とするか「大祭司」とするか
  choice: 油を注がれた祭司
  alternative: 油を注がれた大祭司
  rationale: この表現が文脈上は大祭司を指すとしても、ヘブライ語自体には「大祭司」という完全な称号がない。本文では原語の表現を保ち、職務上の同定は脚注に示した。
- issue: לְאַשְׁמַת הָעָם における祭司の罪と民の罪責との関係
  choice: そのために民が罪責を負うことになる
  alternative: 民の罪責に至る／民に罪を犯させる
  rationale: 祭司の罪に共同体的な結果があることは示しつつ、それが代表性、誘発、帰責のどれによるのかを本文で断定しない。
translation_notes:
  register: 現代の一般読者に分かる、明瞭で格調ある法規文の文体。「ささげ物」は宗教的な用語として理解しやすい表記を用い、「彼」の反復を避けて「その祭司」とし、指示対象を明確にした。
