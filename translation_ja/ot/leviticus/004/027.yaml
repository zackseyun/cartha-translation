source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: ja
  text: また、一般の民[a]の一人が、意図せずに、ヤハウェがしてはならないと命じたことの一つを行って罪を犯し、罪責を負う[b]なら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その地の民のうちの」。ここでは、周囲の規定に出る祭司や指導者とは異なる、共同体の一般の成員を指す。
    reason: lexical_alternative
  - marker: b
    text: または「罪がある者となる」「罪責を負った」。ヘブライ語の動詞は、罪ある状態になること、または罪責を負うことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: 一人
  rationale: 法的規定における個々の人を指す慣用表現であり、単数の主体を自然な日本語で示す。
- source_word: מֵעַם הָאָרֶץ
  choice: 一般の民のうちの
  rationale: 直訳は「その地の民のうちの」だが、周囲の規定では祭司や共同体全体、指導者と対比される一般の共同体成員を指す。
- source_word: בִשְׁגָגָה
  choice: 意図せずに
  rationale: 祭儀法の文脈における、故意ではない過失・不注意による行為を表す。
- source_word: תֶּחֱטָא
  choice: 罪を犯して
  rationale: חטא の基本的意味を明瞭に表し、後続の罪責との関係も自然に示す。
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: してはならないヤハウェの命令の一つを行い
  rationale: 禁止を示す受動的な関係節の規範的意味と、命令群から一つを取り出す部分表現を保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で音写する。
- source_word: וְאָשֵׁם
  choice: 罪責を負うようになった
  rationale: 違反の結果として罪ある状態に至る、または罪責を負うという動きを表しつつ、語の意味幅を脚注で示す。
theological_decisions:
- issue: מֵעַם הָאָרֶץ の社会的・法的範疇
  choice: 一般の民のうちの
  alternative: その地の民のうちの
  rationale: 周囲の犠牲規定における祭司・共同体全体・指導者との対比を伝え、現代日本語で別集団を指すかのような誤解を避ける。
- issue: וְאָשֵׁם の意味と相
  choice: 罪責を負うようになった
  alternative: 罪がある／罪責を負った
  rationale: 禁止行為の結果として生じる法的状態を示す一方、単なる主観的な罪悪感とはしない。別の取り得る訳は脚注に残す。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある法令調。「場合」で次節以降へ続く条件文を示した。神名は「ヤハウェ」とした。
