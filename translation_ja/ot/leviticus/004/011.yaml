id: LEV.4.11
reference: Leviticus 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: ja
  text: しかし、その雄牛[b]の皮[a]と、頭や脚を含む肉のすべて、また内臓[c]と糞を――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皮」は「外皮」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「雄牛」は「若い雄牛」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「内臓」は「体の内部」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: 皮
  rationale: 犠牲として屠られた動物の外皮を指す。現代日本語で明瞭かつ自然な「皮」とした。
- source_word: הַפָּר
  choice: その雄牛
  rationale: פַּרは雄牛、または若い雄牛を指しうる。ここでは年齢を明示せず、文脈上既出の個体を示す「その雄牛」とした。
- source_word: כָּל בְּשָׂרוֹ
  choice: 肉のすべて
  rationale: בָּשָׂרの具体的な意味を保ち、犠牲動物の肉全体を表した。
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: 頭や脚を含む
  rationale: この列挙でのעַלは、肉とともに扱われる部分を加える働きをするため、「含む」と自然に表現した。
- source_word: וְקִרְבּוֹ
  choice: また内臓
  rationale: 犠牲動物の体内の部分を指す具体的な語として「内臓」を用いた。
- source_word: וּפִרְשׁוֹ
  choice: と糞
  rationale: פֶּרֶשׁはここで排泄物を指すため、婉曲化せず「糞」と訳した。
theological_decisions: []
translation_notes:
  register: 律法の祭儀規定にふさわしい簡潔で格調ある現代日本語とした。ヘブライ語では本節が次節の動詞へ続く目的語の列挙なので、文末をダッシュとして未完の構文を保った。「しかし」は、前節までの祭壇で焼く部分との対照を示す。
