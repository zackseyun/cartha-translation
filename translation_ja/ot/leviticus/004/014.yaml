id: LEV.4.14
reference: Leviticus 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: ja
  text: 会衆が犯した罪が明らかになったなら[a]、会衆は罪のためのささげ物として雄牛一頭を差し出し、それを会見の天幕の前に連れて来なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、この節の「罪」と「罪のためのささげ物」に同じ語（ハッタート）が使われている。
    reason: 同一のヘブライ語が、前半では犯した罪、後半ではささげ物を指すという文脈上の使い分けを示すため。
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: 明らかになったなら
  rationale: ידעのニファル形が表す、罪が知られるに至ることを自然な日本語で示す。誰が知るのかは本文にないため、行為者を補わない。
- source_word: הַחַטָּאת
  choice: 罪
  rationale: 直後の「その犯した」という関係節により、ここでは供え物ではなく、犯した罪そのものを指す。
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: その犯した
  rationale: 日本語では「犯した罪」とするのが自然であり、前置詞עַלを不自然に逐語訳しない。
- source_word: הַקָּהָל
  choice: 会衆
  rationale: 祭儀的・法的文脈における共同体としての集まりを、簡潔で定着した語で表す。
- source_word: וְהִקְרִיבוּ
  choice: 差し出し
  rationale: קרבのヒフィル形が祭儀において表す、犠牲を神の前に差し出す行為を示す。後続の「連れて来る」との重複も避ける。
- source_word: פַּר בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: 雄牛であることと家畜の牛に属することを明示しつつ、「牛の子」という不自然な逐語表現を避ける。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: ここではחַטָּאתが祭儀上の供え物の種類を指す。「罪のきよめ」は、この犠牲が罪に関わる清めのためのものであることを示し、単なる抽象的な「罪」と区別する。
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: それを……連れて来なければならない
  rationale: 目的語は雄牛であり、生きた動物を所定の場所へ移すため「連れて来る」とした。ヘブライ語の法的指示の力を「なければならない」で表す。
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: 会見の天幕の前に
  rationale: 祭儀上の場所を表す定型句を、原語の「天幕」を保って訳す。
theological_decisions:
- issue: 同じ節に二度現れるחַטָּאתの訳し分け
  choice: 最初を「罪」、二度目を「罪のきよめのささげ物」とする
  alternative: 両方を同じ語で統一する、または二度目を「罪のためのささげ物」とする
  rationale: 最初は「犯した」という修飾により違反行為を、二度目はלְを伴い規定された犠牲の種類を指す。同じ原語の文脈上の二義を注で明示し、犠牲の機能を一つの教理体系に限定しない。
translation_notes:
  register: 現代の一般読者に分かる、明瞭で格調を保った法令文の文体。「会見の天幕」は祭儀用語として一貫性を保ち、「差し出す」と「連れて来る」を区別して二つの動作を明確にした。
