base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: ja
  text: また、二つの腎臓と、その上にある脂肪、すなわち腰のあたりにある脂肪を取り除く。肝臓の上の付属部分[a]も、腎臓と一緒に取り除く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。この解剖学的部位を表すヘブライ語の正確な意味は確定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 数を明示するヘブライ語の表現を保ちつつ、現代日本語で自然な解剖学的名称とした。
- source_word: הַחֵלֶב
  choice: 脂肪
  rationale: 祭儀で取り分ける脂肪部分を指す。専門的すぎる語を避け、明瞭な「脂肪」とした。
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: その上にある
  rationale: 「その」は直前の二つの腎臓を受け、脂肪の位置を原文どおり示す。
- source_word: הַכְּסָלִים
  choice: 腰のあたり
  rationale: 腰部・脇腹周辺を指す語であるため、特定しすぎず普通の読者に分かりやすい表現とした。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝臓の上の付属部分
  rationale: 正確な解剖学的部位には議論がある。前置詞 עַל を反映しつつ、「葉」と断定せず慎重に訳した。
- source_word: עַל הַכְּלָיוֹת
  choice: 腎臓と一緒に
  rationale: 字義的には「腎臓の上に」も可能だが、反復される祭儀上の定型句では、肝臓の当該部分を腎臓とともに取り除くことを表すと理解した。
- source_word: יְסִירֶנָּה
  choice: 取り除く
  rationale: 祭儀手順として指定された部分を切り離して除く動作を、簡潔な現代日本語で表した。
theological_decisions: []
