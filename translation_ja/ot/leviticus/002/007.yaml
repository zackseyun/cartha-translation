translation:
  language: ja
  text: また、あなたのささげ物が鍋[a]で調理した穀物のささげ物であるなら、それは上質の小麦粉と油で作るものとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鉄板」「深鍋」「調理鍋」とも訳せる。このヘブライ語が指す器具の正確な形状は分かっていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: また、〜であるなら
  rationale: 接続詞と条件辞により、穀物のささげ物について次の事例を追加する規定の流れを自然な現代日本語で示す。
- source_word: מִנְחַת
  choice: 穀物のささげ物
  rationale: レビ記2章では一般的な贈り物ではなく、穀物を用いる祭儀上のささげ物を指す。
- source_word: מַרְחֶשֶׁת
  choice: 鍋
  rationale: 調理用の器具を指すが、その正確な形状は不明なため、過度に限定しない一般的な語を採用する。
- source_word: קָרְבָּנֶךָ
  choice: あなたの〜ささげ物
  rationale: 神の前に携えて来る供え物を意味し、二人称単数の所有接尾辞も反映する。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 穀物のささげ物に用いる、精製された良質の小麦粉を表す自然で明確な訳語。
- source_word: בַּשֶּׁמֶן
  choice: 油を添えて
  rationale: 前置詞בはここで調製に伴う材料を示す。「混ぜて」とまでは明記せず、原文の幅を保つ。
- source_word: תֵּעָשֶׂה
  choice: 作る
  rationale: ニファル未完了形の受動的な規定「作られるべきである」を、日本語の主題構文の中で自然な指示表現にした。
