  yaml_path: translation/ot/leviticus/002/006.yaml
  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: ja
  text: それを幾つもの小片に割り[a]、その上に油を注ぎなさい。これは穀物のささげ物である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幾つもの断片に分け」とも訳せる。ヘブライ語は、油を注ぐ前にささげ物を小さな部分に割ることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: それを幾つもの小片に割り
  rationale: 不定詞絶対形が命令的に用いられ、同語根に関係する複数名詞が割った結果を示す。「幾つもの小片に割り」は、細かく分ける動作とその結果を自然な現代日本語で表す。
- source_word: וְ/יָצַקְתָּ֥
  choice: 注ぎなさい
  rationale: 接続詞を伴う完了形二人称男性単数は、祭儀手順の連続した指示として命令の力を持つ。前の動作に続く指示として簡潔に訳す。
- source_word: עָלֶ֖י/הָ
  choice: その上に
  rationale: 前述のささげ物を受ける女性単数接尾辞を明示し、油を表面に注ぐ意味を自然に表す。
- source_word: שָׁ֑מֶן
  choice: 油
  rationale: 原文は油の種類を明示していないため、「オリーブ油」と限定せず「油」とする。
- source_word: מִנְחָ֖ה
  choice: 穀物のささげ物
  rationale: レビ記2章の祭儀的文脈では穀類を用いるささげ物を指す。「穀物のささげ物」は一般読者にも内容が分かりやすく、用語の専門性も保つ。
- source_word: הִֽוא
  choice: これは…である
  rationale: 独立代名詞による同定を保ち、直前に述べたものが穀物のささげ物であることを端的に示す。
