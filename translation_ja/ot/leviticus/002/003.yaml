reference: Leviticus 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: ja
  text: 穀物のささげ物の残りは、アロンとその子らのものとなる。それは、ヤハウェへの火によるささげ物のうち、最も聖なるものである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִן־הַמִּנְחָה
  choice: 穀物のささげ物の残り
  rationale: 文脈上、מִנְחָה は穀物を用いる祭儀上のささげ物を指す。定冠詞を伴う分詞 הַנּוֹתֶרֶת は名詞的に「残り」を表す。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らのものとなる
  rationale: 前置詞 לְ が示す割り当て・帰属を、自然な現代日本語で明示した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同語反復による最上級的表現であり、祭儀上の最高度の聖性を表す。「至聖所」という場所の意味との混同を避けた。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物のうち
  rationale: אִשֶּׁה の火に関わる祭儀的含意を本文で保持した。מִן は、残りの部分がヤハウェへの火によるささげ物に属することを示すものとして「〜のうち」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים の祭儀上の分類
  choice: 最も聖なるもの
  alternative: 至聖のもの／聖なるものの中で最も聖なるもの
  rationale: 最高度の聖性という意味を保ちつつ、聖所内の特定の場所を指す表現だと誤解されないようにした。
- issue: אִשֵּׁי יְהוָה の解釈
  choice: ヤハウェへの火によるささげ物
  alternative: ヤハウェの食物のささげ物
  rationale: 語の火に関する基本的な祭儀的含意を優先した。「食物のささげ物」という理解も提案されるが、この節だけで意味を一方に狭めない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は過度に専門的・古風にならないよう「穀物のささげ物」「火によるささげ物」とした。
