id: LEV.2.8
reference: Leviticus 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: ja
  text: あなたは、これらから作られる穀物のささげ物をヤハウェに[a]携えて来なければならない。あなたはそれを祭司のところへ差し出し、それを祭壇へ近づけなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェのために」とも訳せる。ヘブライ語の前置詞は、方向だけでなく献呈も表し得る。
    reason: 前置詞לの方向的意味と献呈的意味の両方を保持するため。
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: あなたは……携えて来なければならない
  rationale: בואのヒフィル形は「持って来る、携えて来る」の意。律法上の指示であるため、現代日本語で義務を明確に示す「なければならない」とした。
- source_word: הַמִּנְחָה
  choice: 穀物のささげ物
  rationale: レビ記2章では穀物を材料とする特定の供え物を指す。一般的な「ささげ物」だけでは範囲が広すぎるため、内容を明示した。
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: これらのものから作られた
  rationale: עשהのニファル形の受動的意味と、直前に述べられた材料・調理法を指す指示語を保った。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: יהוהを固有の契約名として音写した。前置詞לは方向と献呈の双方を表し得るため、本文では儀礼の動きを自然に表す「に」とした。
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: それを祭司のもとに差し出し
  rationale: קרבのヒフィル形は「近くに持って行く、差し出す」。後続のנגשׁとの違いをある程度保ちつつ、祭司への受け渡しを自然な日本語で示した。
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: 祭司がそれを祭壇に近づける
  rationale: נגשׁのヒフィル形を「近づける」とし、祭壇まで運ぶ儀礼上の次段階を表した。文脈上の主語を祭司と明示して日本語を明瞭にした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された四文字神名を称号へ置き換えず、固有名として示した。
- issue: 前置詞 ל が示す関係
  choice: ヤハウェに
  alternative: ヤハウェのために
  rationale: לは方向を示すと同時に献呈も表し得る。本文では「携えて来る」という動作に合わせて「に」とし、献呈の意味も可能であることを脚注に残した。
- issue: 後半二動詞の主語
  choice: 祭司への差し出しの後、祭司が祭壇に近づける
  alternative: 後半の動作をすべて同一人物の行為として読む
  rationale: ヘブライ語では主語が明示されず、動詞形だけでは各動作の主体を完全には確定できない。儀礼の流れから、最後の動作の主体は祭司と読むのが自然である。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀規定にふさわしい端正さを保った。「供え物」よりも行為性が伝わる「ささげ物」を採用し、専門用語に偏らない表現とした。
