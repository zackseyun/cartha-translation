source:
  edition: WLC
  text: וְ/נָתַתָּ֤ עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/שַׂמְתָּ֥ עָלֶ֖י/הָ לְבֹנָ֑ה מִנְחָ֖ה הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: ja
  text: その上に油をかけ[a]、乳香を置きなさい。これは穀物のささげ物である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その上に油を与え（または置き）」。ヘブライ語の動詞は、供え物に油を加えることを表す広い語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: かけ
  rationale: נתןは広く「与える、置く」の意を持つが、ここでは供え物の上に油を加える動作を表すため、現代日本語として自然な「かける」とした。原語が注ぎ方を厳密に指定しているとは限らないため、その点を脚注で示した。
- source_word: עָלֶיהָ
  choice: その上に
  rationale: 前置詞עלと三人称女性単数接尾辞により、直前に述べられた供え物の上への配置を表す。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原語は一般に「油」を意味する。祭儀の文脈ではオリーブ油が想定され得るが、この節自体には「オリーブ」と明記されていないため補わない。
- source_word: וְשַׂמְתָּ
  choice: 置きなさい
  rationale: שׂיםの基本義「置く、据える」を自然な命令表現で訳し、乳香を意図的に供え物の上に置く動作を保持した。
- source_word: לְבֹנָה
  choice: 乳香
  rationale: 一般的な香ではなく、特定の香料であるフランキンセンスを指す定着した聖書用語「乳香」を採用した。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀規定では穀類を用いる供え物を指すため、単なる「供え物」ではなく内容が分かる表現とした。
- source_word: הִוא
  choice: これは…である
  rationale: 直前に述べたものを受けて同定する単純な述語文として訳した。
theological_decisions: []
translation_notes:
  register: 祭儀規定にふさわしい簡潔で dignified な命令文とした。「ささげ物」は現代の一般読者にも理解しやすいよう仮名書きにし、「乳香」は定着した用語を保持した。
