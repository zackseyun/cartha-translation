  naturalness: 「その上に油をかけ、乳香を置きなさい」は現代標準日本語として自然で、祭儀規定に必要な簡潔でやや改まった文体を保っている。「これは穀物のささげ物である」も明瞭である。
  terminology: 「乳香」はלבונהに対応する正確で定着した用語であり、「穀物のささげ物」はこのレビ記の文脈におけるמנחהを適切に示す。「油」も、原文にない「オリーブ」を補わず、適切である。
