  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: ja
  text: 祭司は、その粗く砕いた穀粒と油から、記念の分を取り、乳香をすべて添えて、祭壇で煙にする。これはヤハウェへの火によるささげ物である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「粗く砕いた穀粒」は、「ひき割り」または「粗びきの穀物」とも訳せる。ヘブライ語は、この穀物のささげ物のために砕いて整えた穀粒を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 祭壇で煙にする
  rationale: 祭儀の文脈におけるקטרのヒフィル形は、供え物を祭壇で焼いて煙として立ち上らせることを指す。「煙にする」は儀礼的な像を保ち、「祭壇で」を補って自然で明確な日本語にした。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀規定におけるכהןの標準的で明瞭な訳語。
- source_word: אַזְכָּרָתָהּ
  choice: 記念の分
  rationale: 穀物のささげ物から代表として祭壇で焼かれる部分を表す専門語。「記念の分」は、その機能を断定的に説明しすぎず、部分を指すことを明確にする。
- source_word: מִגִּרְשָׂהּ
  choice: その粗く砕いた穀粒から
  rationale: גרשは砕いた、または粗くひいた穀粒を指す。「粗く砕いた穀粒」は現代の一般読者にも分かりやすく、細かい粉との違いも示す。
- source_word: וּמִשַּׁמְנָהּ
  choice: 油から
  rationale: 前置詞מןを保ち、記念の分が穀粒と油から取られるという構造を自然な日本語で示す。
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: 乳香をすべて添えて
  rationale: ここでのעלは、記念の分とともに乳香を焼くことを示すと理解し、「添えて」と自然に訳した。「すべて」により乳香の全量であることを保持する。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 火を用いて献げる祭儀用語であることを明示しつつ、「食物の供え物」のような誤解を避ける。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: לは献呈の方向・対象を示す。神名יהוהは称号に置き換えず、固有名として「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が四文字神名を直接用いているため、契約の固有名を見える形で保つ。「主」は称号への置換となり、「エホバ」は後代の混成的発音に基づく。
- issue: אַזְכָּרָה の意味
  choice: 記念の分
  alternative: 記念のささげ物、思い起こさせる分
  rationale: この語が神に何を思い起こさせるのか、また献げる者の記念を指すのかを本文は詳述しないため、神学的機能を狭く決めず祭儀上の部分を示す訳とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀の動作を具体的に示すため「祭壇で煙にする」とし、専門語は「記念の分」「火によるささげ物」のように簡潔に訳した。脚注記号[a]は本文中に明示した。
