id: LEV.2.10
reference: Leviticus 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: ja
  text: 穀物のささげ物の残りは、アロンとその子らのものとなる。ヤハウェへの火によるささげ物[a]のうちで最も聖なるものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物の献げ物」。
    reason: אִשֶּׁה は「火による献げ物」とも、神に供される「食物の献げ物」とも解し得るため。
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִן הַמִּנְחָה
  choice: 穀物のささげ物の残り
  rationale: הַנּוֹתֶרֶת は冠詞付き分詞が名詞的に用いられ、残された部分を指す。レビ記2章の מִנְחָה は一般的な贈り物ではなく穀物のささげ物を指すため、文脈を明確にした。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らのものとなる
  rationale: 前置詞 לְ が配分・帰属を表す。ヘブライ語の名詞文を、規定として自然な現代日本語にした。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同語反復によるヘブライ語の最上級表現を反映した。「至聖所」と誤解されないよう、ここではささげ物の聖性の最高度を表す訳とした。
- source_word: מֵאִשֵּׁי
  choice: 火による献げ物のうち
  rationale: אִשֶּׁה は祭儀上、火を介して神にささげるものを指す。「食物の献げ物」という理解も可能なため脚注に示した。前置詞 מִן は、この残りがその種の献げ物に属することを表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
theological_decisions:
- issue: אִשֵּׁי יְהוָה の解釈
  choice: ヤハウェへの火による献げ物
  alternative: ヤハウェへの食物の献げ物
  rationale: 火を用いてささげるという祭儀的側面を本文で明示しつつ、אִשֶּׁה を神に供される「食物」と理解する語義上の可能性も脚注に残した。
- issue: קֹדֶשׁ קָדָשִׁים の指示対象
  choice: 残りの部分を「最も聖なるもの」とする
  alternative: 字義的に「聖なるものの中の聖なるもの」とする
  rationale: ヘブライ語の最上級的な慣用表現を自然に訳し、場所としての至聖所を意味するとの誤解を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は「穀物のささげ物」「火による献げ物」とし、一般読者に理解しやすい表現を用いた。神名は「ヤハウェ」と表記した。
