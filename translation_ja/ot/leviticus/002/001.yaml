id: LEV.2.1
reference: Leviticus 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: ja
  text: '人がヤハウェ[a]に穀物のささげ物[b]を献げるとき、そのささげ物は上等の小麦粉とし、それに油を注ぎ、その上に乳香を置く。


    [a] 神の固有名。ヘブライ語では「ヤハウェ」（יהוה）。

    [b] 「穀物のささげ物」はヘブライ語「ミンハ」。ここでは、上等の小麦粉を用いるささげ物を指す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 神の固有名。ヘブライ語では「ヤハウェ」（יהוה）。
    reason: divine_name
  - marker: b
    text: 「穀物のささげ物」はヘブライ語「ミンハ」。ここでは、上等の小麦粉を用いるささげ物を指す。
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 人
  rationale: 字義的には「魂」「いのち」だが、ここでは祭儀規定の主体となる一人の人を指す。日本語では「人」が自然で、不要な形而上学的含意を避けられる。
- source_word: תַקְרִיב קָרְבַּן
  choice: ささげ物を献げる
  rationale: קרב のヒフィル形は、供え物を神の前に「近づける、差し出す」ことを表す。「献げる」は祭儀的行為を明瞭かつ簡潔に伝える。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: 一般には贈り物や貢物も意味し得るが、レビ記の祭儀文脈では穀物を材料とするささげ物を指す。文脈上の意味を本文に明示した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞 ל を「に」で表し、神の固有名 יהוה は音写して「ヤハウェ」とした。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 供え物に用いる、よく精製されたきめの細かな粉を指す。現代日本語で理解しやすい慣用的な表現を選んだ。
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: そのささげ物は…とし
  rationale: 材料を規定する法文として自然な日本語にした。三人称男性単数接尾辞は、日本語では性を補わず「その」と受けることで単数の指示関係を保った。
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: それに油を注ぎ
  rationale: עַל と女性単数接尾辞がミンハを受けることを「それに」で示した。連続する完了形は、この法文では指示として訳した。
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: その上に乳香を置く
  rationale: לְבֹנָה は礼拝で用いる芳香性樹脂の乳香。נתן の基本的な動作を簡明な「置く」で表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に現れる契約の神の固有名を、称号に置き換えず音写した。脚注で神の固有名であることを示した。
- issue: 法文における男性単数形
  choice: 日本語で性別を補わず「人」「その」「それ」で表す
  alternative: 「彼」「彼の」を明示する
  rationale: ヘブライ語は代表的な単数と男性形を用いるが、日本語の自然な法文は代名詞に性を表示しない。主体とささげ物の単数の指示関係を保ちつつ、原文にない男性代名詞を日本語へ追加しなかった。
- issue: מִנְחָה の意味範囲
  choice: 穀物のささげ物
  alternative: 贈り物／ささげ物
  rationale: 語自体はより広い意味を持ち得るが、この祭儀規定は直後に上等の小麦粉を材料として指定するため、ここでは穀物のささげ物という文脈的意味が確かである。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀法としての厳粛さを保った。「とし」「置く」により規定文の簡潔な調子を出し、古風な命令語尾や過度に専門的な祭儀用語は避けた。
