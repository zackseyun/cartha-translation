source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: ja
  text: 初物のささげ物として[a]、それらをヤハウェに献げることができる。しかし、心地よい香りとするために、それらを祭壇に上らせてはならない。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「初物の供え物として」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「心地よい香りのために、祭壇へ上らせてはならない」。祭壇に献げて神に受け入れられる供え物とすることを指す祭儀的表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: 初物のささげ物
  rationale: 「ささげ物」と「初物」の連語関係を保ちつつ、現代日本語で自然な祭儀用語とした。
- source_word: תַּקְרִיבוּ
  choice: 献げることができる
  rationale: 祭儀的に神へ差し出す意味を「献げる」で表し、前後の対照から認められている行為であることを「できる」で示した。
- source_word: אֹתָם
  choice: それら
  rationale: 前節のパン種と蜜を用いたものを受ける男性複数代名詞を、そのまま複数の指示語で表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に記された神名יהוהを固有名として音写し、献呈の方向を助詞「に」で表した。
- source_word: לֹא יַעֲלוּ
  choice: 祭壇の上で焼いてはならない
  rationale: 字義は「上ってはならない」だが、祭壇から煙として立ち上らせる祭儀的文脈を、一般読者に明確な表現で示した。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 心地よい香りとして
  rationale: 犠牲が神に受け入れられることを香りで表す定型句の比喩を保持した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の契約の神名を普通名詞的な称号へ置き換えず、固有名として示した。
- issue: לֹא יַעֲלוּ の祭儀的意味
  choice: 祭壇の上で焼いてはならない
  alternative: 祭壇に上らせてはならない
  rationale: 祭壇上で煙を立ち上らせる行為を指す文脈上の意味を明瞭にした。ただし字義的表現も脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「献げる」「祭壇」など聖書祭儀に適した品位ある語彙を採用した。許容される献呈と、祭壇で焼くことの禁止との対照を明確にした。
