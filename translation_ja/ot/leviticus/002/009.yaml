id: LEV.2.9
reference: Leviticus 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: ja
  text: 祭司は穀物のささげ物からその記念の部分を取り上げ、祭壇の上で焼いて煙にする。これは火によるささげ物、主への芳しい香りである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵרִים
  choice: 取り上げ
  rationale: ヒフィル形が表す、ささげ物の一部を取り分けて祭儀的に扱う具体的な動作を自然な日本語で示す。
- source_word: מִן הַמִּנְחָה
  choice: 穀物のささげ物から
  rationale: レビ記2章では穀物を材料とする供え物を指すため、文脈に即して明確に訳す。
- source_word: אַזְכָּרָתָהּ
  choice: その記念の部分
  rationale: 全体ではなく、神の前で記念として焼かれる代表部分を指すことが分かる表現とした。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 祭壇で焼くことに加え、語根 קטר の煙を立ち上らせる含意も保持する。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語形を、この祭儀的文脈に自然な日本語で表す。
- source_word: אִשֵּׁה
  choice: 火によるささげ物
  rationale: 語の形と祭儀上の意味に近く、「食物のささげ物」と断定するより原語の幅を保つ。
- source_word: רֵיחַ נִיחֹחַ
  choice: 芳しい香り
  rationale: 香りの比喩を保ちながら、神に受け入れられるものという定型句の含意を簡潔で品位ある日本語にする。
- source_word: לַיהוָה
  choice: 主への
  rationale: 神名 יהוה を日本語聖書で広く定着した「主」で表し、助詞によって香りの向かう先を明示する。
theological_decisions:
- issue: אִשֵּׁה רֵיחַ נִיחֹחַ の祭儀定型句
  choice: 火によるささげ物、主への芳しい香り
  alternative: 主への食物のささげ物、喜ばれる香り
  rationale: אִשֵּׁה を「火によるささげ物」として原語に近く訳し、רֵיחַ נִיחֹחַ の擬人的な香りの表象を保持した。後代の神学的解釈や、神が食物を必要とするとの含意は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀用語には簡潔で格調のある表現を選んだ。「焼いて煙にする」により原語の具体性を残しつつ、過度に古風な言い回しを避けた。
