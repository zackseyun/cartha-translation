  terminology: 「祭司」「穀物のささげ物」「記念の部分」「祭壇」「火によるささげ物」「主」は一貫して適切である。「火によるささげ物」は英語監査記録の代替訳とも整合し、「食物のささげ物」という解釈を本文に固定しない点でも安全である。
