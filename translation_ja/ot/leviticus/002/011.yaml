id: LEV.2.11
reference: Leviticus 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: ja
  text: あなたがたがヤハウェに献げる穀物のささげ物は、どれもパン種を入れて作ってはならない。パン種も蜜[a]も、ヤハウェへの火によるささげ物[b]として焼いて煙にしてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「蜜」は、蜂蜜だけでなく、ナツメヤシなどの果実から作った濃いシロップを指す場合もある。
    reason: 古代語の意味範囲を示す文化的・語彙的注記。
  - marker: b
    text: 別訳「食物のささげ物」。ヘブライ語は、祭壇の火で焼いて献げるものを指す祭儀用語。
    reason: אִשֶּׁהの主要な訳語の可能性と祭儀的意味を示す。
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: 穀物のささげ物
  rationale: レビ記2章では、小麦粉などを材料とする特定のささげ物を指すため、一般的な「ささげ物」ではなく内容を明示した。
- source_word: תַּקְרִיבוּ
  choice: 献げる
  rationale: 祭儀的文脈で「近づける、差し出す」を意味するヒフィル形を、自然な現代日本語で表した。
- source_word: לַיהוָה
  choice: ヤハウェに／ヤハウェへの
  rationale: 本文に記された神の固有名יהוהを音写し、前置詞の方向・帰属を文脈に応じて表した。
- source_word: תֵעָשֶׂה חָמֵץ
  choice: パン種を入れて作ってはならない
  rationale: ささげ物を発酵した状態にしてはならないという禁止を、明瞭な日本語で表した。
- source_word: שְׂאֹר
  choice: パン種
  rationale: 発酵を起こす種を指す祭儀用語として、日本語で通用する「パン種」を採用した。
- source_word: דְּבַשׁ
  choice: 蜜
  rationale: 蜂蜜に限らず果実の濃縮汁を含み得る古代語の幅を保つため、やや広い「蜜」とし、注で説明した。
- source_word: לֹא תַקְטִירוּ
  choice: 焼いて煙にしてはならない
  rationale: 祭壇上で焼き、煙を立ち上らせる祭儀的動作を明示した。単なる調理上の「焼く」との混同を避けるため「煙にして」を加えた。
- source_word: מִמֶּנּוּ
  choice: 訳文では明示せず
  rationale: 単数接尾辞の指示対象には表現上の難しさがあり、日本語で「それから」とすると何を指すか不自然に曖昧になる。文脈上の禁止内容を保ちながら、パン種と蜜を直接目的語とした。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 火で祭壇に献げるものという祭儀的意味を保ち、「食物のささげ物」と断定して語源・意味の議論を解消しない訳を採用した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: ヘブライ語本文の固有名を固有名として示し、称号への置換を避けた。
- issue: אִשֶּׁהの祭儀的意味
  choice: 火によるささげ物
  alternative: 食物のささげ物、火のささげ物
  rationale: 祭壇で焼いて献げる点を明示しつつ、「神への食物」という解釈だけに限定しない。別訳の可能性を注記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ささげ物」は読みやすさのため平仮名を用い、祭儀動作は「焼いて煙にする」と具体的に表現した。すべての脚注記号を該当語の直後に置いた。
