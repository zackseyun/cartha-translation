  terminology: 「ヤハウェ」は本文の神名を適切に保持している。「穀物のささげ物」「パン種」「蜜」「火によるささげ物」は文脈に適した一貫した用語である。蜜の意味範囲とאִשֶּׁהの別訳可能性は脚注で適切に補われている。
