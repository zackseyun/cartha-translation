  text: וְ/אִם מִנְחָ֥ה עַל הַֽ/מַּחֲבַ֖ת קָרְבָּנֶ֑/ךָ סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן מַצָּ֥ה תִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: ja
  text: あなたのささげ物が平鍋[a]で作る穀物のささげ物であるなら、それは油を混ぜた上質な細かい小麦粉で、種なしのものとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「平たい鍋」。ヘブライ語は、この穀物のささげ物を作るための平たい調理器具を指す。
    reason: 調理器具の正確な形状を一義的に特定できないため、語義上の別訳を示す。
lexical_decisions:
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記2章では穀粉を材料とする祭儀上のささげ物を指すため、一般的な「贈り物」ではなく、内容が明確に伝わる表現とした。
- source_word: עַל הַמַּחֲבַת
  choice: 平鍋で焼く
  rationale: מַחֲבַת は平たい調理面を持つ器具と考えられる。「平鍋」とし、前置詞 עַל は日本語として自然な調理表現になるよう「で焼く」とした。器具の厳密な形状には不確かさがあるため脚注を付した。
- source_word: קָרְבָּנְךָ
  choice: あなたの…ささげ物
  rationale: 二人称単数の直接的な呼びかけを保った。מִנְחָה と同格的に用いられているため、日本語で不自然な重複を避け、一つの句にまとめた。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 祭儀に用いる、よく精製された良質の穀粉を表す。日本語で具体的かつ分かりやすい「上質の小麦粉」とした。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 油と穀粉を混ぜ合わせた状態を表し、こね方などを過度に限定しない自然な現代語とした。
- source_word: מַצָּה תִהְיֶה
  choice: 種なしのものとする
  rationale: מַצָּה はここでは供え物に求められる無発酵の状態を表す。תִהְיֶה の規定的な力を「ものとする」で示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀規定にふさわしい簡潔で品位ある文体とした。「ものとする」により法規的な指示を自然に表現した。
