  to: あなたが献げる穀物のささげ物にはすべて、塩を加えなければならない[a]。あなたの神の契約の塩を、穀物のささげ物から欠かしてはならない[b]。あなたが献げるすべてのささげ物は、塩を添えて献げなければならない[c]。
