id: LEV.2.13
reference: Leviticus 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: ja
  text: あなたが献げる穀物のささげ物にはすべて、塩を加えなければならない[a]。あなたの神の契約の塩を、穀物のささげ物から欠かしてはならない[b]。あなたが献げるすべてのささげ物は、塩を添えて献げなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「塩で塩をしなければならない」。
    reason: 原文では「塩」という名詞と「塩をする」という動詞が重ねて用いられているため。
  - marker: b
    text: 「契約の塩」は、契約と結び付けられた祭儀的表現。その象徴の意味は、この節では説明されていない。
    reason: 文化的・契約的な表現を、本文で一つの象徴解釈に限定しないため。
  - marker: c
    text: または「あなたが献げるすべてのささげ物の上に、塩を献げなければならない」。
    reason: 前置詞 עַל をより字義的に「～の上に」と訳すこともできるため。
lexical_decisions:
- source_word: קָרְבַּן
  choice: ささげ物
  rationale: 犠牲として神に差し出す物を広く指す語。現代日本語として自然で、節内の二つの用例にも対応できる。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記2章では穀類を用いる特定のささげ物を指すため、一般的な「ささげ物」だけでなく、その祭儀上の種類を明示した。
- source_word: בַּמֶּלַח תִּמְלָח
  choice: 塩を加えなければならない
  rationale: 原文は名詞「塩」と動詞「塩をする」を重ねる表現。「塩を加える」は儀礼上の要求を明確かつ自然な日本語で表す。
- source_word: תַשְׁבִּית
  choice: 欠かしてはならない
  rationale: 使役形が示す、なくす、取り除く、欠けた状態にするという禁止を、簡潔で自然に表した。
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: あなたの神の契約の塩
  rationale: 原文の連語と契約的な比喩を解釈的に言い換えず、そのまま保持した。
- source_word: מֵעַל
  choice: ～から
  rationale: 直訳的には「～の上から」だが、「欠かす」と組み合わせて自然な日本語となるよう「～から」とした。
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: あなたのささげ物はすべて、塩を添えて
  rationale: 前置詞 עַל の「上に」という具体像を「添えて」で自然に伝え、塩がすべてのささげ物に伴う要求を示した。
- source_word: תַּקְרִיב
  choice: 献げなければならない
  rationale: 祭儀の文脈で「近づける、差し出す」を意味する使役形を、神への奉献を表す現代日本語の「献げる」で訳した。
theological_decisions:
- issue: 契約の塩という表現を字義的に残すか、象徴的意味を補って言い換えるか
  choice: 「あなたの神の契約の塩」を本文に保持する
  alternative: 「あなたの神との契約を表す塩」または「あなたの神が契約において定めた塩」
  rationale: 本文自体は塩と契約の関係を説明していないため、象徴が忠実さ、永続性、保存性などのどれを特に示すかを翻訳で決めず、原文の神学的含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法の命令としての厳粛さを「～なければならない」で保った。「捧げ物」ではなく「ささげ物」とし、一般読者に読みやすくした一方、動詞は祭儀的な行為を示す「献げる」と表記した。
