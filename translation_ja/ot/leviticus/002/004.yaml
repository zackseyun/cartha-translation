  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: ja
  text: また、かまどで焼いた穀物のささげ物をささげる場合は、それは上等な小麦粉で作った、油を混ぜた種なしパン、または[a]油を塗った種なしの薄焼きパンとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「油を混ぜた種なしパンと、油を塗った種なしの薄焼きパン」。ヘブライ語の接続詞は通常「そして」を意味するが、ここでは二つの形を選択肢として挙げているとも考えられる。
    reason: 接続詞וが追加と選択のどちらを表すかという原文の曖昧さを示すため。
lexical_decisions:
- source_word: וְכִי
  choice: また、～場合は
  rationale: 祭儀規定の次の条件例を導入する接続辞と条件表現を、自然な現代日本語で示す。
- source_word: תַקְרִב קָרְבַּן
  choice: ささげ物をささげる
  rationale: קרבのヒフィル形が持つ「近づけて差し出す」という祭儀的意味を、日本語で過度に直訳せず明確に表す。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記2章では穀粉と油から成る特定の祭儀区分を指すため、一般的な「贈り物」ではなく内容を明示する。
- source_word: מַאֲפֵה תַנּוּר
  choice: かまどで焼いた
  rationale: 古代のתַנּוּרによる焼成を表す。現代の電気・ガス式オーブンに限定されない「かまど」を採った。
- source_word: סֹלֶת
  choice: 上等な小麦粉
  rationale: よく精製された良質の穀粉を指す。日本語では材料として自然で分かりやすい表現とした。
- source_word: חַלּוֹת מַצּוֹת
  choice: 種なしの輪形パン
  rationale: חַלּוֹתはパン状のまとまりを、מַצּוֹתは発酵させていないことを示す。「菓子」と誤解されやすい「ケーキ」は避けた。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 油を混ぜた
  rationale: בללの受動分詞が示す、材料に油を混ぜ込んだ状態を簡潔に表す。
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: または油を塗った種なしの薄焼きパン
  rationale: רְקִיקִיםは薄いパンを指す。接続詞וは字義上「そして」だが、ここでは二つの調理形態の選択肢を列挙すると解して「または」とした。脚注で曖昧さを保持する。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 油を塗った
  rationale: משׁחの受動形は表面に油を塗ることを指す。食品の調理法として明瞭で、不要な聖別の含意を加えない。
theological_decisions:
- issue: 祭儀文脈におけるמִנְחָה
  choice: 穀物のささげ物
  alternative: 贈り物／献げ物
  rationale: 語は一般に贈り物や貢物も意味するが、レビ記2章では穀粉と油による祭儀上の一分類を指すため、文脈上の特定性を保った。
- issue: 二種類の焼き物を結ぶוの関係
  choice: または
  alternative: そして
  rationale: 文脈上は輪形パンと薄焼きパンという代替的な形態の列挙と考えられるが、ヘブライ語自体は通常「そして」と訳せる接続詞なので、脚注に別訳を示した。
translation_notes:
  register: 現代の一般読者に理解しやすく、祭儀規定にふさわしい簡潔で端正な文体とした。「種なし」はレビ記の用語として明瞭で、「かまど」は古代の焼成設備を現代式オーブンに限定せず表す。脚注記号[a]を本文末に置き、二つのパン形態を結ぶ接続詞に関する注であることを示した。
