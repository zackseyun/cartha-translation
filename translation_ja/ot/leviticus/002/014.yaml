source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: ja
  text: 初物の穀物のささげ物をヤハウェに献げる場合は、火であぶった青い穂、新穀を粗く砕いたもの[a]を、初物のささげ物として献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火であぶった新しい穂、新しい収穫からの砕いた穀粒」とも訳せる。
    reason: אָבִיבおよびכַּרְמֶלは、穀物の成熟段階や新しさを表す語であり、「青い穂」「新しい穂」「新穀」「新しい収穫」などの訳語が可能である。
lexical_decisions:
- source_word: מִנְחַת
  choice: 穀物のささげ物
  rationale: レビ記2章では穀物を材料とする祭儀的なささげ物を指すため、一般的な「ささげ物」より具体的に訳した。
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: 初物
  rationale: 最初に実った収穫物を神に献げる祭儀的意味を、自然で定着した日本語で表す。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に記された神の固有名יהוהを音写し、契約の神の名を保持する。
- source_word: אָבִיב
  choice: 新穀の穂
  rationale: 乾燥しきる前の新しい穀物の穂を指す語として、農作物の具体的な姿が伝わる表現を選んだ。
- source_word: קָלוּי בָּאֵשׁ
  choice: 火で炒った
  rationale: 火によって穀物をあぶる、または炒る調理法を、現代日本語で明瞭に表した。
- source_word: גֶּרֶשׂ כַּרְמֶל
  choice: 新穀を粗く砕いたもの
  rationale: גֶּרֶשׂの砕かれた穀粒という意味と、כַּרְמֶלの新鮮な穀物・新穀という文脈上の意味を組み合わせて表した。
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: 献げる場合は……献げなさい
  rationale: 同じ動詞の反復を保ちつつ、条件節と命令の関係を自然な日本語で示した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: ヘブライ語本文の固有名を一般称号に置き換えず、音写によって明示した。
- issue: אָבִיבとגֶּרֶשׂ כַּרְמֶלの関係
  choice: 二つの並置された描写として訳す
  alternative: 後半を前半の言い換えとして「すなわち」で結ぶ
  rationale: ヘブライ語は接続関係を明示しておらず、同一材料の重ねた描写とも、調製段階を並べた表現とも取れるため、本文では解釈を限定する接続語を加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「供え物」より動作との統一が取りやすい「ささげ物」を用い、祭儀文脈では「献げる」と表記した。
