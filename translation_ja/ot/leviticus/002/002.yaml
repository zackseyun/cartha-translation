- from: その人はそれを、祭司であるアロンの子らのもとに携えて行く。そこから、その上等の小麦粉と油を手いっぱいに取り、乳香はすべて添える。そして祭司は、それを記念の分[a]として祭壇の上で焼いて煙にする。これは火によるささげ物[b]であり、ヤハウェに喜ばれる香りとなる。
