id: LEV.2.2
reference: Leviticus 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ja
  text: その人はそれを、アロンの子らである祭司たちのもとに携えて行く。そこから、その上等の小麦粉を手いっぱいと、その油の一部を取り、乳香はすべて加える。そして祭司は、その記念の分[a]を祭壇の上で焼いて煙にする。これは火によるささげ物[b]であり、ヤハウェに喜ばれる香りとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「記念の分」は、ささげ物全体を代表して祭壇で焼かれる部分を指す祭儀上の表現。何を、また誰に思い起こさせるのかは明記されていない。
    reason: 祭儀上の専門語 אַזְכָּרָה の意味の幅を示すため。
  - marker: b
    text: 別訳「食物のささげ物」。ヘブライ語 אִשֵּׁה は、伝統的には「火によるささげ物」と訳されるが、祭壇に供される食物との関連を示す語と理解されることもある。
    reason: 語義と語源に議論のある祭儀用語について主要な別解を保持するため。
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: その人はそれを……携えて行く
  rationale: ヒフィル形の「持って来る」を、供え物を祭司のもとへ運ぶ手続きとして自然な現代日本語で表した。3人称女性単数の接尾辞は穀物のささげ物を指すため「それ」とした。
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 祭司であるアロンの子ら
  rationale: 「アロンの子ら」と同格の「祭司たち」を明示し、家系上の呼称と祭司としての役割をともに保持した。
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: 手いっぱいに取り
  rationale: 動詞は手を閉じて取る行為、名詞句は「彼の手（こぶし）を満たす量」を表す。「一つかみ」より量感を明示する「手いっぱい」を採用した。ヘブライ語で主語が明示されないため、日本語でもここでは主語を補わず、祭司か献げる者かを本文で断定しない。
- source_word: מִסָּלְתָּהּ וּמִשַּׁמְנָהּ
  choice: その上等の小麦粉と油を
  rationale: סֹלֶת は供犠に用いる精製された良質の小麦粉。「上等の小麦粉」で祭儀的素材の質を示し、油もその採取される分に含めた。
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: 乳香はすべて添える
  rationale: 乳香については一部でなく全量であることを明示した。עַל の結合・追加の含意を、日本語では「添える」で自然に表した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にする
  rationale: 祭壇上で焼き、煙として立ち上らせる祭儀的動作を表すヒフィル形。単なる「焼く」より原語の祭儀的ニュアンスを保つ。
- source_word: אַזְכָּרָתָהּ
  choice: 記念の分
  rationale: ささげ物全体を代表して祭壇で焼かれる部分を指す祭儀上の専門語。語根の「覚える／思い起こす」と、部分としての性格の双方を簡潔に保った。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾は、この祭儀の文脈では焼く場所を指すため、日本語では位置を自然に示した。
- source_word: אִשֵּׁה
  choice: 火によるささげ物
  rationale: 祭司文書の専門語で、語義・語源には「火による供物」と「食物の供物」に関わる解釈の幅がある。直前に焼く動作があるため、本文では伝統的かつ形態上素直な「火によるささげ物」を採用し、別訳を脚注に示した。
- source_word: רֵיחַ נִיחֹחַ
  choice: ヤハウェに喜ばれる香り
  rationale: 神に受け入れられる供犠を表す定型句。「なだめの香り」と語源的に限定せず、現代日本語で意味が伝わる表現とした。
- source_word: יהוה
  choice: ヤハウェ
  rationale: 固有の神名である四文字名を、称号の「主」に置き換えず音写した。
theological_decisions:
- issue: וְקָמַץ の動作主
  choice: 日本語本文では主語を明示しない
  alternative: 「祭司は……取る」または「その人は……取る」
  rationale: ヘブライ語は単数の動詞だけを置き、直前の「アロンの子ら、祭司たち」は複数形である一方、続く文では「祭司」が単数で明示される。儀礼上は祭司と理解されることが多いが、本文にない主語を補って曖昧さを解消しないよう、日本語で自然な主語省略を用いた。
- issue: אַזְכָּרָתָהּ の祭儀的意味
  choice: 記念の分
  alternative: 記念のささげ物／思い起こさせる分
  rationale: 何を、また誰に思い起こさせるかを本文は説明していないため、神学的対象を補わず、専門語の含みを保持した。
- issue: אִשֵּׁה の訳
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 火で焼く供物という文脈と伝統的理解を本文に採りつつ、祭壇に供する食物との関連を示す別解も脚注に残した。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく固有の神名を用いていることを訳文でも示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、レビ記の儀礼規定にふさわしい簡潔で厳かな文体とした。「携えて行く」「焼いて煙にする」など具体的な動作を用い、古風な文語や教派固有の用語は避けた。
