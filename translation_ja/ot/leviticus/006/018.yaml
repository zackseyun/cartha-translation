base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: ja
  text: アロンとその子らにこう告げなさい。『罪のいけにえ[a]についての律法は次のとおりである。全焼のいけにえを屠る場所で、罪のいけにえをヤハウェの前で屠らなければならない。それは最も聖なるものである。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。ヘブライ語 חַטָּאת は「罪」を指すほか、罪や儀礼上の汚れに関わる清めのためのいけにえを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר
  choice: アロンとその子らに告げなさい
  rationale: 命令形と引用導入句を、現代日本語の法令的な語調を保ちながら自然にまとめた。「語りなさい。言いなさい」より簡潔で明瞭である。
- source_word: זֹאת תּוֹרַת
  choice: 〜についての律法は次のとおりである
  rationale: 祭儀に関する תּוֹרָה は「教え」「規定」も意味し得るが、本文の厳粛な法的性格を保つため「律法」とした。זֹאת の提示機能は「次のとおり」で自然に表した。
- source_word: הַחַטָּאת
  choice: 罪のいけにえ
  rationale: 祭儀文脈では罪そのものではなく供え物を指す。「清めのいけにえ」という理解も可能なため脚注で示した。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: עֹלָה は祭壇で全体を焼く供え物を指すため、現代の読者にも内容が伝わる祭儀用語とした。
- source_word: תִּשָּׁחֵט
  choice: 屠る／屠らなければならない
  rationale: שׁחט の祭儀的な屠殺を正確に表す。「殺す」より専門的文脈に適し、後半の未完了形の規定的用法は「なければならない」で示した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の祭儀的な「御前で」を直接的に表し、神名は固有名として音写した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: ヘブライ語の強意的構文が示す最高度の聖性を、供え物の分類として自然な日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の契約名を明記しているため、称号に置き換えず音写した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のいけにえ
  alternative: 清めのいけにえ
  rationale: 罪との関係を保つ伝統的で理解しやすい訳を本文に置きつつ、この供え物の清めの機能を強調する別訳も語義上可能なので脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀法としての厳粛さを保った。「いけにえ」は漢字を避けて読みやすくし、「屠る」は祭儀上の動作の正確さを優先した。脚注記号[a]は該当語「罪のいけにえ」の直後に置いた。
