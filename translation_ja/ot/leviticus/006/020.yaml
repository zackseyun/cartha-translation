  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: ja
  text: その肉に触れるものはすべて聖なるものとなる。また、その血が衣服に飛び散った[a]なら、あなたは血の飛び散った衣服を聖なる場所で洗わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「振りかけられた」。このヘブライ語動詞は祭儀的に血を振りかけることも表すが、ここでは衣服に付いた血を洗うことが問題となっているため、本文では「飛び散った」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: ものはすべて
  rationale: 不定かつ包括的な表現であり、人だけに限定せず、触れるもの全般を自然な日本語で示す。
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: その肉に触れる
  rationale: בָּשָׂרはここでは罪のいけにえの肉を指す。「肉」は祭儀的文脈でも自然で、具体的な接触を明確に表す。
- source_word: יִקְדָּשׁ
  choice: 聖なるものとなる
  rationale: 接触の結果として聖なる状態に入ることを表す。内面的・道徳的変化と断定せず、祭儀上の聖別という文脈上の意味を保つ。
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: その血が衣服に飛び散ったなら
  rationale: נזהは血が衣服に及ぶことを表す。ここでは洗浄が問題となるため「飛び散る」を本文に採用し、意図的な祭儀行為を示し得る別訳は脚注に残す。
- source_word: עַל הַבֶּגֶד
  choice: 衣服に
  rationale: בֶּגֶדを一般的な事例規定として自然な「衣服」と訳す。
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: 血の飛び散った衣服
  rationale: 女性単数接尾辞が衣服を受けることを明示し、洗う対象を日本語で曖昧なく示す。
- source_word: תְּכַבֵּס
  choice: あなたは…洗わなければならない
  rationale: 衣服を洗うことを表すピエル形と、二人称単数による直接的な法的命令を保持する。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 聖なる場所で
  rationale: 定冠詞のない句を過度に特定せず、聖別された区域を指し得る表現とする。
theological_decisions:
- issue: 罪のいけにえの肉との接触によって生じる「聖」の意味
  choice: 接触したものが聖なる状態となることを本文にそのまま示す。
  alternative: 道徳的な聖さではなく、祭儀上、聖なる用途に限定される状態と明示する。
  rationale: 文脈は祭儀上の聖さを扱うが、本文自体はその効果を詳しく定義していないため、「聖なるものとなる」として原文の神学的緊張を保つ。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある規定文の文体とした。原文の二人称単数は「あなたは」で保持し、祭儀上の用語は過度に専門化しなかった。脚注記号は、実際に異読を説明する「飛び散った」の直後に置いた。
