source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: ja
  text: 祭司のうち、男子は皆、それを食べることができる。それは最も聖なるものである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「聖なるものの聖なるもの」。最高度の聖性を表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: 男子は皆
  rationale: 単数形の「男子」と「すべて」の組み合わせを、日本語で自然な分配表現として訳した。זָכָרは成人男性に限定せず、男性であることを示す。
- source_word: בַּכֹּהֲנִים
  choice: 祭司のうち
  rationale: 前置詞בが祭司集団への所属範囲を示しているため、その範囲内の男子という意味を明確にした。
- source_word: יֹאכַל
  choice: 食べることができる
  rationale: 祭儀規定における未完了形を、全員への義務命令ではなく、許可された行為として表した。
- source_word: אֹתָהּ
  choice: それを
  rationale: 女性形代名詞は文脈上の供え物を指すが、原文どおり名詞を補わず代名詞で訳した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 直訳的には「聖なるものの聖なるもの」だが、最高度の聖性を表すヘブライ語の慣用的な最上級として自然な日本語にした。
- source_word: הִוא
  choice: それは～ものである
  rationale: 女性形代名詞による名詞文を、先行する供え物を受ける自然な日本語として明示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、祭儀規定にふさわしい簡潔で格調ある文体とした。許可を表す「食べることができる」を用い、命令とは断定しない形で法的文脈のニュアンスを保った。
