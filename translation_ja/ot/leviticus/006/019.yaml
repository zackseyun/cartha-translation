source:
  edition: WLC
  text: הַ/כֹּהֵ֛ן הַֽ/מְחַטֵּ֥א אֹתָ֖/הּ יֹאכֲלֶ֑/נָּה בְּ/מָק֤וֹם קָדֹשׁ֙ תֵּֽאָכֵ֔ל בַּ/חֲצַ֖ר אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: ja
  text: それを罪のきよめの供え物として献げる祭司[a]が、それを食べなければならない。それは聖なる場所、会見の天幕の庭で食べなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それを罪のきよめの供え物として献げる祭司」は、「それによって贖いをする祭司」または「それによってきよめを行う祭司」とも訳せる。ヘブライ語の分詞は、この供え物に関わる祭儀を執り行うことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 定冠詞を伴う標準的な祭儀用語。日本語では文脈上「その」を補わず、自然に「祭司」とした。
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: 罪のきよめのささげ物をささげる
  rationale: ピエル分詞は、ここでは罪を除くための祭儀を執行することを表す。「贖う」と限定せず、供え物の名称と祭司の奉仕を明確にした。
- source_word: יֹאכֲלֶנָּה
  choice: それを食べる
  rationale: 祭儀規定における未完了形。後続の義務表現と合わせ、規定として読める簡潔な現在形にした。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 聖なる場所
  rationale: מָקוֹם に定冠詞がないため、「聖所」と特定せず、原文どおり性質を示す表現とした。
- source_word: תֵּאָכֵל
  choice: 食べなければならない
  rationale: ニファル未完了形の受動的規定を、日本語の自然な法規表現で示した。
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: 会見の天幕の庭で
  rationale: אֹהֶל מוֹעֵד を「会見の天幕」、חָצֵר をその外庭を指す「庭」と訳した。
theological_decisions:
- issue: חטא の祭儀的意味
  choice: 罪のきよめのささげ物をささげる
  alternative: それによって贖いをする／それを罪のためにささげる／それによってきよめる
  rationale: この動詞は祭司が罪のきよめのささげ物の儀式を執行することを指し得る。贖罪だけに意味を狭めず、同時に一般読者にも祭儀上の機能が分かる表現を採った。
- issue: 女性形代名詞の指示対象
  choice: それ
  alternative: 彼女を／雌を
  rationale: 文法上は女性形だが、指示対象は直前の供え物であるため、日本語では自然に「それ」とした。
- issue: 聖なる場所と会見の天幕の庭との関係
  choice: 「すなわち」で同格・具体化として示す
  alternative: 二つの別個の場所として並列する
  rationale: 後半は食べるべき「聖なる場所」を具体的に会見の天幕の庭と定めると読むのが文脈に適う。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調ある祭儀法規の文体。「罪祭」は避け、「罪のきよめのささげ物」を用いた。脚注標識は節末に置き、主節の祭儀表現全体に関わる注であることを示した。
