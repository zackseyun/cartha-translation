id: LEV.6.2
reference: Leviticus 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: ja
  text: アロンとその息子たちに命じて、こう言いなさい。「全焼のささげ物についての定め[a]は次のとおりである。全焼のささげ物は、祭壇の炉床[b]の上に、一晩じゅう朝まで置いておく。祭壇の火は、その上で絶やさず燃やしておく。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全焼のささげ物についての教え」または「規定」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、祭壇の上でささげ物を燃やす場所、すなわち炉床を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: 命じて
  rationale: 直接的な命令を表す動詞の命令形であるため、弱めずに「命じて」とした。
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: アロンとその子ら
  rationale: 祭司職を担うアロンの男子たちを指す文脈を保ちつつ、現代日本語として自然な「子ら」とした。
- source_word: לֵאמֹר
  choice: 言いなさい
  rationale: 命令の内容となる直接話法を自然に導入する表現とした。
- source_word: זֹאת תּוֹרַת
  choice: についての定めは次のとおりである
  rationale: ここでの תּוֹרָה は祭儀を規定する個別の指示を指す。「律法」より文脈に即して明瞭な「定め」を用い、定型句の機能を自然な日本語で表した。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: 祭壇上ですべてを焼く עֹלָה の性質が一般読者にも伝わる、定着した明瞭な祭儀用語とした。
- source_word: הִוא הָעֹלָה
  choice: 全焼のささげ物そのものは
  rationale: 代名詞と名詞の反復による強調を「そのもの」で表し、直訳調の不自然さを避けた。
- source_word: עַל מוֹקְדָה
  choice: 燃える場所の上に置いておく
  rationale: מוֹקְדָה は祭壇上の燃焼場所または炉床を指す。本文では分かりやすい説明的表現を用い、継続してそこにあることを「置いておく」で示した。
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: 朝まで夜通し
  rationale: 夜の全期間から朝までという時間的継続を自然かつ簡潔に表した。
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: 祭壇の火は、その上で絶やさず燃やしておく
  rationale: Hophal形が示す、火を継続的に維持する規定を「絶やさず燃やしておく」で表した。בּוֹ は男性名詞の「祭壇」を受けるものと理解しつつ、「その上で」として原文の簡潔な指示表現を保った。
theological_decisions:
- issue: 祭儀規定における תּוֹרָה の訳語
  choice: 定め
  alternative: 律法／教え／規定
  rationale: ここではモーセ五書全体の名称ではなく、全焼のささげ物に関する個別の祭儀規定を導入している。「定め」は法的・規範的な調子を保ちながら、意味範囲を不必要に広げない。
- issue: 祭壇の火に関する命令の性質
  choice: 絶やさず燃やしておく
  alternative: 燃える
  rationale: 動詞の態と文脈は、単なる状態の描写ではなく、火が維持されるべきことを示す。そこで継続的な管理を伴う規定として訳した。
- issue: בּוֹ の指示対象
  choice: 祭壇を指す「その上で」
  alternative: 全焼のささげ物によって
  rationale: 接尾代名詞は男性単数であり、女性名詞 עֹלָה よりも男性名詞 מִזְבֵּחַ を受けるのが文法的に自然である。日本語では原文の簡潔さを保つため「その上で」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法にふさわしい端正な調子を保った。「全焼のささげ物」「祭壇」など必要な祭儀語は保持し、「炉床」のように一般読者には分かりにくい語は本文で説明的に訳して脚注で補った。
