  to: アロンとその息子たちに命じて、こう言いなさい。「全焼のささげ物についての定め[a]は次のとおりである。全焼のささげ物は、祭壇の炉床[b]の上に、一晩じゅう朝まで置いておく。祭壇の火は、その上で絶やさず燃やしておく。」
