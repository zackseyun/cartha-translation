lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げて言われた
  rationale: דברによる発話導入を、現代日本語として自然でありながら、後続のלֵאמֹרも反映できる定型表現で訳した。文頭のוַは日本語では明示せず、物語の連続性を自然な文脈に委ねた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語音写で示した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示すאֶלを、自然な現代日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直訳的な「言って」より自然な日本語の発話導入となるよう、דברと合わせて「告げて言われた」とした。後続する直接話法への導入機能を保っている。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、その固有名としての性質を保った。「主」は伝統的な代読・訳語として脚注に示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。日本語では不自然になりやすい文頭接続詞と「言って言った」という重複を避けつつ、原文の正式な託宣導入句を保った。
