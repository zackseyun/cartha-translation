id: LEV.6.10
reference: Leviticus 6:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: ja
  text: パン種を入れて焼いてはならない。わたしは、わたしの火によるささげ物[a]の中から、彼らの受ける分として、これを与えた。これは、罪のためのささげ物[b]や償いのささげ物[c]と同じく、最も聖なるものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの食物のささげ物」。
    reason: אִשֶּׁהは通常、火で献げるささげ物を指す祭儀用語である。一方、神に供される食物のささげ物という理解も可能である。
  - marker: b
    text: 別訳「罪のきよめのささげ物」。
    reason: חַטָּאתは罪に関するささげ物を表すと同時に、罪や汚れからのきよめの働きを指し得る。
  - marker: c
    text: 別訳「罪過のささげ物」または「賠償のささげ物」。
    reason: אָשָׁםは罪責に関するささげ物を指し、文脈によっては償いや賠償の側面が強調される。
lexical_decisions:
- source_word: תֵאָפֶה חָמֵץ
  choice: パン種を入れて焼いてはならない
  rationale: 受動形を日本語の自然な祭儀規定として表現した。חָמֵץは、文脈上「パン種を入れた状態で」を意味し、パンそのものと限定しない。
- source_word: חֶלְקָם
  choice: 彼らの受ける分
  rationale: 祭司たちに割り当てられた取り分を指す。単なる所有物ではなく、付与された分け前という含意を明確にした。
- source_word: נָתַתִּי אֹתָהּ
  choice: これを与えた
  rationale: 完了形が示す、神によってすでに定められ、今も効力を持つ授与を簡潔に表した。
- source_word: מֵאִשָּׁי
  choice: わたしへの火によるささげ物の中から
  rationale: אִשֶּׁהの祭儀的な用法と、接尾辞が示す神への帰属を保った。「食物のささげ物」と理解する可能性は脚注に残した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: ヘブライ語の最上級的表現を、場所としての「至聖所」と混同されない自然な日本語で示した。
- source_word: כַּחַטָּאת
  choice: 罪のためのささげ物
  rationale: חַטָּאתの一般的で理解しやすい祭儀名称を採用しつつ、「罪のきよめのささげ物」という機能重視の訳を脚注に示した。
- source_word: וְכָאָשָׁם
  choice: 償いのささげ物
  rationale: אָשָׁםが罪責だけでなく賠償・償いを伴う祭儀を指し得るため、現代日本語で機能が伝わる表現とした。
theological_decisions:
- issue: חַטָּאתの祭儀名称
  choice: 罪のためのささげ物
  alternative: 罪のきよめのささげ物
  rationale: 語が「罪」と「きよめ」の双方に関係するため、本文では広く理解できる名称を用い、浄化機能を前面に出す訳も脚注で保持した。
- issue: אָשָׁםの祭儀名称
  choice: 償いのささげ物
  alternative: 罪過のささげ物／賠償のささげ物
  rationale: 特定の贖罪論に狭く限定せず、この祭儀に伴う罪責と償いの側面を表せる名称を選んだ。
- issue: אִשֶּׁהの意味領域
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 火で献げる祭儀的側面を本文に保ちながら、神に供される食物という理解も原語の用法上あり得るため脚注に示した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で荘重な祭儀規定の文体とした。「献げ物」より常用的で視認しやすい「ささげ物」を用い、専門的な祭儀語の曖昧さは脚注で保持した。
