id: LEV.6.23
reference: Leviticus 6:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: ja
  text: また、聖所で贖いを行うために、その血の一部が会見の天幕に運び入れられる罪のためのいけにえ[a]は、どれも食べてはならない。火で焼かなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。レビ記で用いられるヘブライ語は、罪と汚れを扱ういけにえを指す。
    reason: חַטָּאתが持つ「罪のためのいけにえ」と「清めのいけにえ」という意味上の幅を示すため。
lexical_decisions:
- source_word: וְכָל
  choice: また、…どれも
  rationale: וְによる前文とのつながりと、כָלの包括的な範囲を自然な現代日本語で示す。文脈上、強い逆接とまでは限定しない。
- source_word: חַטָּאת
  choice: 罪のためのいけにえ
  rationale: ここでは抽象的な「罪」ではなく祭儀上の供え物を指す。一般読者に意味が伝わりやすい表現とし、清めに関わる側面は脚注で示す。
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: 血の一部が…携え入れられ
  rationale: מִןの部分を表す用法を明示し、血の全部ではなく、その一部が運び込まれることを表した。受動形も保った。
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: 会見の天幕の中へ
  rationale: אֶלの方向性と、天幕内部へ血を運ぶ祭儀上の動きを明確にする。「会見の天幕」は名称として定着した明瞭な訳語。
- source_word: לְכַפֵּר
  choice: 贖いをするために
  rationale: 祭司文書におけるכפרの祭儀的・神学的な幅を保ち、特定の贖罪理論に狭めない。
- source_word: בַּקֹּדֶשׁ
  choice: 聖所で
  rationale: 抽象的な聖性ではなく、聖なる区域で行われる祭儀を指すため、具体的な場所として訳した。
- source_word: לֹא תֵאָכֵל
  choice: 食べてはならない
  rationale: 受動形を日本語で不自然に直訳せず、いけにえを主題とする禁止規定として明瞭に表した。
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: 火で焼かなければならない
  rationale: 「火で」という原文の明示を残しつつ、法規的義務を自然な現代日本語で表現した。
theological_decisions:
- issue: 祭儀法におけるחַטָּאתの意味
  choice: 「罪のためのいけにえ」と訳す
  alternative: 「清めのいけにえ」
  rationale: この語は罪に関わる供え物を指す一方、儀礼的汚れを除く働きも含み得る。本文では広く理解される表現を用い、別訳を脚注に残して意味の幅を保持した。
- issue: 聖所へ運び入れられる血の範囲
  choice: 「血の一部」と明示する
  alternative: 「その血が」と訳す
  rationale: מִדָּמָהּのמִןは部分を表すと解するのが自然であり、供え物の血すべてが運ばれるという誤解を避ける。
- issue: בַּקֹּדֶשׁが指す場所
  choice: 「聖所で」
  alternative: 「聖なる場所で」または「聖域で」
  rationale: 会見の天幕内の聖なる区域を指すが、より限定された区画名か聖域一般かには表現上の幅がある。「聖所」はその具体性を保ちつつ過度に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は一般読者にも分かる表現を優先し、法規文として二つの義務を簡潔に示した。
