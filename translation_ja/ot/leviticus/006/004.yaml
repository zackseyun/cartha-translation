source:
  edition: WLC
  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: ja
  text: 自分の衣服を脱ぎ、別の衣服を着て、灰を宿営の外の清い[b]場所へ運び出す[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「持ち出す」「外へ出す」。
    reason: lexical_alternative
  - marker: b
    text: ここで「清い」とは、レビ記の規定における祭儀上の清さを指す。
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: それから、その衣を脱いで
  rationale: פשטは衣服を目的語とすると「脱ぐ」の意。接続のוは祭儀手順の順序を自然な日本語で示すため「それから」とした。
- source_word: בְּגָדָיו
  choice: その衣
  rationale: 直訳的には「彼の衣」だが、直前まで祭司が着ていた衣を指すため、日本語では「その衣」が自然である。
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: 別の衣を着
  rationale: אֲחֵרִיםは先の衣とは異なる衣を示す。「別の衣」は簡潔で、祭儀的な文脈にもふさわしい。
- source_word: וְהוֹצִיא
  choice: 運び出す
  rationale: יצאのヒフィル形は「外へ出す、持ち出す」の意。灰を宿営外の場所へ移す具体的動作を「運び出す」で表した。
- source_word: הַדֶּשֶׁן
  choice: 灰
  rationale: ここでは祭壇上の焼却後の灰・残滓を指す。日本語では集合的に「灰」とするのが自然である。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外の
  rationale: 宿営の境界を越えた場所への移動を表す。後続の「場所」と自然につながる形にした。
- source_word: אֶל מָקוֹם טָהוֹר
  choice: 清い場所へ
  rationale: טָהוֹרの基本的な対訳「清い」を保ち、レビ記における祭儀上の清浄という含意は脚注で明示した。
theological_decisions:
- issue: טָהוֹרが表す清浄の性質
  choice: 清い場所
  alternative: 儀礼上清い場所／汚れていない場所
  rationale: 祭儀上の清浄という意味を保持しつつ、本文では原語以上に説明的に限定しない。文脈上の専門的含意は脚注で補った。
translation_notes:
  register: 現代の読者に明瞭な標準語を用いながら、祭儀規定にふさわしい簡潔で端正な文体とした。主語は文脈上明らかなため、原文どおり本文では明示していない。
