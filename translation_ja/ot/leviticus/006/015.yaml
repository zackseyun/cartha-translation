source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: ja
  text: 彼の子らのうち、彼の後を継ぐ[a]油を注がれた祭司が、これをささげる。これは主のための永続する定め[b]であり、これをすべて焼いて煙にしなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼に代わる」。直訳は「彼の下に」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「永遠の定め」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「それは完全に煙にされる」。供え物を残さず祭壇で焼くことをいう。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: 油注がれた祭司
  rationale: 祭司職のために油を注がれた者を指す祭儀上の表現として訳し、メシア称号とは解さない。一方、本文にない「大祭司」は補わない。
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: 彼の子らのうち、彼の後を継ぐ
  rationale: תַּחְתָּיו の基本的な位置・代替の意味を、世襲される祭司職という文脈に即して自然な現代日本語で表した。מִבָּנָיו の「彼の息子たちの中から」という範囲も保持した。
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: これをささげる
  rationale: 動詞自体は広く「行う、作る」を意味するが、ここでは祭儀上の供え物を規定どおり扱う文脈なので、「ささげる」が自然である。
- source_word: חָק עוֹלָם
  choice: 永続する定め
  rationale: 長く変わらず効力を持つ規定を、古風すぎない明瞭な表現で示した。
- source_word: לַיהוָה
  choice: 主のための
  rationale: 神名יהוהは日本語聖書で広く定着した「主」とし、לְ はここでは奉献・帰属を示す「ための」と訳した。
- source_word: כָּלִיל תָּקְטָר
  choice: そのすべてを焼いて煙にしなければならない
  rationale: כָּלִיל の全体性と、קטרのヒフィル形が表す、祭壇上で供え物を煙にする祭儀的動作をともに保持した。
theological_decisions:
- issue: 「油注がれた祭司」の身分
  choice: 祭司職のために油を注がれ、先任者の後を継ぐ祭司
  alternative: 明示的に「大祭司」とする、またはメシア的称号と解する
  rationale: レビ記の祭儀的文脈と世襲を示す句は特定の祭司職の継承を示すが、本文そのものにない称号を訳文へ補わず、原文の表現を保った。
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語で定着した敬虔な神名表記を用いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は「油注がれた祭司」「ささげる」「焼いて煙にする」とし、一般読者にも動作が分かる表現を選んだ。
