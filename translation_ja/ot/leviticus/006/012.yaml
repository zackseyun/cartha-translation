lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進める神の発言導入句。日本語では、後続する発言内容を自然かつ荘重に導く「告げられた」が適切。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した表記を用いる一方、原文が固有の神名YHWHであることを脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発言の相手を示す前置詞と人名を、自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: （「告げられた」に統合）
  rationale: ヘブライ語の定型的な発言導入「言って」を日本語で機械的に重ねず、主動詞に統合して自然な導入文とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主（脚注で「原文は神名YHWH」）
  alternative: ヤハウェ
  rationale: 固有名であることを隠さないよう脚注を付しつつ、本文では現代日本語の聖書文体として理解されやすく定着した「主」を採用した。母音を含む発音の再構成には不確実性があるため、脚注ではYHWHと表記する。
translation_notes:
  register: 明瞭な現代標準日本語。定型句を簡潔で品位ある発言導入として訳した。
