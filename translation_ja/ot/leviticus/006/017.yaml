base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げて言われた
  rationale: 継続法ワウを伴う דבר は、新たな神の発言単位を導入する定型表現。日本語では前後の連続性を保ちつつ、単なる「言った」より荘重で自然な「告げて言われた」とした。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神の固有名を表す四文字語。日本語聖書で広く理解される伝統的代用表記「主」を本文に置き、原文が固有名 YHWH であることを脚注で明示した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 前置詞 אֶל は発話の相手を示すため、自然な現代日本語の助詞「に」で表した。מֹשֶׁה は慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直後の直接話法を導く定型語。日本語で不自然な「言って」を避け、神を主語とする敬意ある発話表現に組み込んだ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で YHWH／ヤハウェを明示）
  alternative: ヤハウェ
  rationale: 原文が称号ではなく神の固有名であることを脚注で保持しつつ、本文は普通の日本語読者に定着した「主」とした。発音の再構成には一定の不確かさがあるため、それを本文で断定しない。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも耐える文体。ヘブライ語の発話導入定型を、日本語として過度に逐語的にならない形で保持した。
