id: LEV.6.8
reference: Leviticus 6:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: ja
  text: 祭司は、穀物のささげ物の上質の小麦粉から自分のひとつかみと、その油の一部を取り上げ[a]、その穀物のささげ物の上にある乳香をすべて取る。そして、その記念の分[b]を祭壇の上で焼いて煙にし、ヤハウェに喜ばれる香りとしてささげる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「自分のひとつかみで、そこから取り上げる」。原文では「取り上げる」という動詞と「ひとつかみ」という語が組み合わされ、ささげ物から所定の分を手で取り分けることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「記念の分」は、穀物のささげ物を代表して祭壇で焼かれる部分を指す祭儀上の用語。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: そこから、ひとつかみを取り上げ
  rationale: רוּםのヒフィル形には持ち上げて取り分ける意味があり、בְּקֻמְצוֹは手でつかむ所定の量を示す。「ひとつかみを取り上げ」は、除去と挙上の含みを自然な日本語で表す。
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: 穀物のささげ物の上等の小麦粉から
  rationale: סֹלֶתは祭儀に用いる精製された良質の小麦粉を指す。「上等の小麦粉」は素材の質と祭儀上の具体性を保つ。מִנְחָהはこの文脈では穀物のささげ物。
- source_word: וּמִשַּׁמְנָהּ
  choice: その油から
  rationale: 前置詞מִןが部分を取り分けることを示すため、油の全量ではなく、その一部がひとつかみに含まれることを表した。
- source_word: וְאֵת כָּל הַלְּבֹנָה אֲשֶׁר עַל הַמִּנְחָה
  choice: その穀物のささげ物の上にある乳香をすべて
  rationale: לְבֹנָהは一般的な香ではなく乳香を指す。כָּלに従い、小麦粉や油の一部とは対照的に乳香はすべて取ることを明示した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にし、…ささげる
  rationale: 祭壇上で焼いて煙を立ち上らせる祭儀行為を指す。「焼く」だけでなく「煙にする」を添えて原語の祭儀的ニュアンスを保った。
- source_word: רֵיחַ נִיחֹחַ
  choice: 喜ばれる香り
  rationale: 犠牲が神に受け入れられることを示す定型句。単なる嗅覚的な快さに限定せず、現代日本語として自然に表現した。
- source_word: אַזְכָּרָתָהּ
  choice: その記念の分
  rationale: 穀物のささげ物全体を代表して祭壇で焼かれる部分を指す祭儀上の専門語。「記念」だけでは物そのものと誤解されやすいため、「分」を補った。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に記された神の固有名יהוהを称号に置き換えず、「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名יהוהを用いているため、神名を明示する訳を採用した。
- issue: רֵיחַ נִיחֹחַの祭儀的意味
  choice: ヤハウェに喜ばれる香り
  alternative: 心地よい香り
  rationale: 神が犠牲を受け入れるという定型句の意味を保ちつつ、神の嗅覚的満足だけを強調する読みを避けた。
- issue: אַזְכָּרָהの意味
  choice: 記念の分
  alternative: 記念のささげ物
  rationale: 何を、または誰に思い起こさせるのかを本文は明示しないため、その曖昧さを解消せず、ささげ物の代表部分を示す表現にとどめた。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある祭儀文体とした。「祭司」はヘブライ語本文では代名詞だが、直前の文脈で行為者が祭司であるため、日本語で主語を明確にする目的で補った。
