  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: ja
  text: アロンの子らのうち、男子は皆、これを食べることができる。これは、ヤハウェへの火によるささげ物のうちから受ける分について、あなたがたが代々にわたって守るべき永続する定めである。それらに触れるものはすべて、聖なるものとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別される」とも訳せる。ヘブライ語は、接触によって聖なる状態になることを表しうる。一方、「聖なるものだけがそれらに触れることができる」という制限を意味すると解することもできる。
    reason: 末尾の יִקְדָּשׁ が表す聖性の獲得と、その祭儀上の含意に複数の理解があるため。
lexical_decisions:
- source_word: כָּל זָכָר בִּבְנֵי אַהֲרֹן
  choice: アロンの子らのうち、男子は皆
  rationale: 祭司として食べる資格を持つ者の性別を正確に示しつつ、「アロンの子ら」という祭司的・家族的呼称を保った。
- source_word: יֹאכֲלֶנָּה
  choice: これを食べることができる
  rationale: 命令というより、祭司に認められた資格・権利を表す文脈として訳した。「これ」は直前のささげ物を受ける。
- source_word: חָק עוֹלָם לְדֹרֹתֵיכֶם
  choice: あなたがたが代々守るべき永遠の定め
  rationale: 継続的な法的効力と、世代を通じて守られる契約的表現の双方を自然な現代日本語で示した。
- source_word: מֵאִשֵּׁי יְהוָה
  choice: ヤハウェへの火によるささげ物について
  rationale: אִשֶּׁה の祭儀的意味と火との関連を保ち、神名 יהוה は固有名「ヤハウェ」とした。前置詞 מִן を含む句は、この定めがヤハウェへの火によるささげ物に関するものであることを示す表現として訳した。
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: それらに触れるものはすべて
  rationale: 人か物かを限定しないヘブライ語の広さを保つため、「者」ではなく「もの」とした。「それら」は複数形の接尾辞に対応する。
- source_word: יִקְדָּשׁ
  choice: 聖なるものとなる
  rationale: 接触の結果として聖なる状態になるという変化を明示しつつ、別解は脚注に残した。
theological_decisions:
- issue: 末尾の句における聖性の伝達
  choice: ささげ物に触れたものが、その接触によって聖なるものとなる
  alternative: すでに聖なるものだけが、それらに触れることを許される／触れたものが聖別の義務のもとに置かれる
  rationale: יִקְדָּשׁ の最も直接的な結果相の意味を本文に採りながら、祭儀上の含意を一つに固定せず、制限的な理解も脚注で示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。祭司規定としての法的調子を保ち、過度に古風な語法は避けた。
