  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: ja
  text: さて、穀物のささげ物についての律法[a]は次のとおりである。アロンの子らは、それをヤハウェの前に、祭壇の前でささげなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法」は、「教え」または「規定」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: さて、…は次のとおりである
  rationale: 接続詞と指示詞による新しい規定の導入を、現代日本語で自然かつ荘重に示す。
- source_word: תּוֹרַת הַמִּנְחָה
  choice: 穀物のささげ物についての律法
  rationale: תּוֹרָהの法規・指示という性格を「律法」で保ち、מִנְחָהは祭儀的文脈に即して「穀物のささげ物」とした。
- source_word: הַקְרֵב אֹתָהּ
  choice: それを…ささげなければならない
  rationale: 命令的な手続き規定としての力を示しつつ、קרבの使役形が表す祭儀的な提出・奉献を自然な日本語にした。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの子ら
  rationale: 祭司一族を表す原文の親族名称を明示的に保った。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の臨在の前で行うことを示し、固有名יהוהは音写した。
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: 祭壇の前で
  rationale: ささげ物を差し出す具体的な場所を示す句として訳し、「ヤハウェの前」と区別した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として明示し、普通名詞的な称号へ置き換えなかった。
- issue: 祭儀法におけるתּוֹרָהの意味
  choice: 律法
  alternative: 教え／規定
  rationale: ここでは穀物のささげ物に関する正式な祭儀手続きを指すため、法的・礼拝的な響きを保つ「律法」を採用した。曖昧さは脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で荘重な文体とした。二つの位置表現は「祭壇の前で」「ヤハウェの前に」と訳し分けた。
