  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: ja
  text: 祭司が献げる穀物のささげ物は、すべてを焼いて献げるものとし[a]、食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「全体のものとし」。ヘブライ語は「全体の、完全な」を意味します。ここでは、祭司の穀物のささげ物を食べず、すべて焼いて献げることを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: すべて
  rationale: 接続詞וְは前後の規定との連続を示すが、日本語では節頭の「また」を置かなくても自然に継続が伝わる。כָּלは単数名詞を伴って個々の該当例を包括するため、「すべて」とした。
- source_word: מִנְחַת
  choice: 穀物のささげ物
  rationale: レビ記におけるמִנְחָהは穀物を用いる祭儀上のささげ物を指す。「穀物のささげ物」は現代日本語で内容が明瞭で、一般的な「供え物」との区別も保てる。
- source_word: כֹּהֵן
  choice: 祭司が献げる
  rationale: 構文上は「祭司の穀物のささげ物」だが、日本語では所有と種類の曖昧さを避け、祭司を献げ手として自然に示した。
- source_word: כָּלִיל
  choice: 全焼のもの
  rationale: 語義は「全体の、完全な」で、祭儀文脈では食用に残さず全面的に祭壇へ渡して焼くものを指す。直後の「食べてはならない」との関係を明確にしつつ、原文に明示されない動詞を過度に補わない名詞的表現とした。
- source_word: תִּהְיֶה
  choice: ものとし
  rationale: 法規文中の未完了形が持つ規定的な力を、現代日本語の簡潔で格調ある法令調で表した。
- source_word: לֹא תֵאָכֵל
  choice: 食べてはならない
  rationale: ニファル形の受動的意味を日本語の一般的な禁止表現で示す。主語は直前の穀物のささげ物であり、「それを」を補わなくても明瞭である。
theological_decisions:
- issue: כָּלִילが示す全体性と焼却の含意
  choice: 本文では「全焼のもの」とし、祭司の取り分として食べない全面的な奉献を示す。
  alternative: 「すべて焼き尽くし」として動作を明示する、または「完全なもの」として語形をより直訳する。
  rationale: 祭儀上の実際的意味を明瞭にしながら、語そのものが形容詞であることと、「全体・完全」という語義の幅を脚注で保持する。特定の教派的解釈は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀法にふさわしい簡潔で格調ある規定表現とした。「献げる」「ささげ物」は可読性と用語識別の両立を図った表記である。
