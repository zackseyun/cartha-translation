  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: ja
  text: そのささげ物の残り[a]は、アロンとその子らが食べなければならない。それは種なしで、聖なる場所で[c]食べなければならない。会見の天幕の庭で、それを食べなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこから残ったもの」。穀物のささげ物の残りの部分を指す。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語は「聖なる場所で」であり、「その聖所で」とは限定していない。次の文が、その場所を会見の天幕の庭と特定している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: そのささげ物の残り
  rationale: 定冠詞付き女性単数分詞を名詞的に取り、穀物のささげ物のうち残った部分を指すものとした。「それから残ったもの」より自然で、指示対象も明確になる。
- source_word: יֹאכְלוּ / יֹאכְלוּהָ
  choice: 食べなければならない／それを食べなければならない
  rationale: 律法規定における未完了形の命令的・規定的な力を示し、最後の反復も省略せず保持した。
- source_word: אַהֲרֹן וּבָנָיו
  choice: アロンとその子ら
  rationale: 祭司職にあるアロンの男子を指す文脈に即し、「子どもたち」ではなく「子ら」とした。
- source_word: מַצּוֹת תֵּאָכֵל
  choice: パン種を入れずに食べなければならない
  rationale: מַצּוֹת は、残りのささげ物を発酵させない形で食べることを表す。「種なしパン」と名詞化しすぎず、現代日本語で意味が明瞭になるよう表現した。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 聖なる場所で
  rationale: מָקוֹם に定冠詞がないため、「その聖所で」と限定せず、不定の「聖なる場所」を保った。続く句が具体的な場所を示す。
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: 会見の天幕の庭で
  rationale: חָצֵר を天幕を囲む庭として訳し、אֹהֶל מוֹעֵד の字義的な比喩を保つ標準的な表現「会見の天幕」を用いた。
theological_decisions: []
