  register: 現代の一般読者に明瞭な、簡潔で荘重な律法文体とした。「食べなければならない」で規定の力を示し、原文末尾の反復も保持した。「パン種」は発酵を起こす種を指す聖書文脈の語として用い、単なる「種」との誤解を避けた。
