  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: ja
  text: それを土の器で煮たなら、その器は砕かなければならない。しかし、青銅の器[a]で煮たなら、その器はよくこすり洗いし、水ですすがなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銅の器」とも訳せる。ヘブライ語 נְחֹשֶׁת は、文脈により銅または青銅を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: 土の器
  rationale: 粘土を焼いて作った器を指す。現代日本語で分かりやすく、金属製の器との材質上の対比も保てる。
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: 煮た／煮た場合
  rationale: בשׁל の受動形で、ここではいけにえの肉を器の中で煮ることを表す。日本語では文脈上、対象を明示しない能動的表現が自然である。
- source_word: בּוֹ
  choice: それを煮た
  rationale: 前置詞と代名詞接尾辞は直前の器を受け、「その中で」の意。日本語では「それを煮た土の器」とすることで関係を自然に表した。
- source_word: יִשָּׁבֵר
  choice: 砕かなければならない
  rationale: ニファル未完了形が法規中の義務を示す。「砕く」は単に割れ目を入れる以上に、再使用できないよう破壊する含みを伝える。
- source_word: כְלִי נְחֹשֶׁת
  choice: 青銅の器
  rationale: נְחֹשֶׁת は銅または青銅を指し得る。古代の器物について一般的な訳語である「青銅」を本文に置き、語義上可能な「銅」を脚注に示した。
- source_word: וּמֹרַק
  choice: 磨き洗いし
  rationale: מרק はこすって徹底的に清める動作を表す。「磨き洗い」は表面を強くこする洗浄を自然な日本語で示す。
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: 水ですすがなければならない
  rationale: שטף は水を流して洗う、すすぐことを表す。直前のこすり洗いとは別の洗浄工程であることを保った。
