source:
  edition: WLC
  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: ja
  text: 祭壇の上の火は、燃え続けていなければならない。消えてはならない。祭司は毎朝[a]、祭壇の火に薪をくべ、その上に全焼のいけにえを並べ、さらにその上で交わりのいけにえ[b]の脂肪の部分を焼いて煙にしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「朝ごとに」。ヘブライ語では「朝」が繰り返され、毎朝行うことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「平安のいけにえ」「幸いの献げ物」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: 絶えず燃やしておかなければならない
  rationale: ホファル形が示す、火を燃焼状態に保つという継続的かつ受動的な祭儀上の義務を、自然な現代日本語で表した。
- source_word: לֹא תִכְבֶּה
  choice: 消してはならない
  rationale: 祭壇の火を絶やさないよう命じる禁止を簡潔に表す。「消えてはならない」も可能だが、文脈上は祭司たちの管理責任を含む表現とした。
- source_word: וּבִעֵר ... עֵצִים
  choice: 薪をくべ
  rationale: 直訳的には「木を燃やす」だが、すでに燃えている祭壇の火に毎朝燃料を加える動作なので、日本語では「薪をくべる」が最も自然である。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 毎朝
  rationale: 「朝」を反復する分配的表現を、明瞭な現代日本語で表した。
- source_word: וְעָרַךְ
  choice: 並べ
  rationale: 祭壇上に献げ物を定められた順序で配置する祭儀的動作を表す。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: 献げ物全体を祭壇で焼く祭儀区分を明確に示し、語源的な「上るもの」よりも読者に内容が伝わる表現を採用した。
- source_word: וְהִקְטִיר
  choice: 焼いて煙にし
  rationale: 祭壇上で献げ物を焼き、煙として立ち上らせる קטר の祭儀的含意を明示した。
- source_word: חֶלְבֵי
  choice: 脂肪の部分
  rationale: 一般的な「最良の部分」ではなく、祭儀で焼くよう指定された脂肪部位を指すため。
- source_word: הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: この祭儀名が含みうる平安、健全、共同の食事という意味領域のうち、現代日本語で祭儀区分として理解しやすい表現を選び、別訳は脚注に残した。
theological_decisions:
- issue: 犠牲祭儀の名称
  choice: 「全焼のいけにえ」「交わりのいけにえ」という認識しやすい祭儀用語を用いる
  alternative: 「上昇の献げ物」「平安のいけにえ」など、語源や別の意味要素を前面に出す
  rationale: 律法の祭儀規定として各献げ物の区分を明瞭にしつつ、שְׁלָמִים の意味を一つの神学的解釈に限定しないよう別訳を脚注で示した。
translation_notes:
  register: 祭儀法にふさわしい端正さを保ちながら、現代の一般読者に通じる命令表現を用いた。「薪をくべる」は直訳を避けつつ具体的な動作を明瞭にし、「焼いて煙にする」は祭壇での קטר の意味を可視化している。
