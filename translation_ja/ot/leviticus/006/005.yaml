- from: 祭壇の上の火は、絶えず燃やしておかなければならない。消してはならない。祭司は毎朝[a]その上に薪をくべ、全焼のいけにえをその上に並べ、さらに交わりのいけにえ[b]の脂肪の部分をその上で焼いて煙にしなければならない。
  to: 祭壇の上の火は、燃え続けていなければならない。消えてはならない。祭司は毎朝[a]、祭壇の火に薪をくべ、その上に全焼のいけにえを並べ、さらにその上で交わりのいけにえ[b]の脂肪の部分を焼いて煙にしなければならない。
