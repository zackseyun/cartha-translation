  text: וְ/לָבַ֨שׁ הַ/כֹּהֵ֜ן מִדּ֣/וֹ בַ֗ד וּ/מִֽכְנְסֵי בַד֮ יִלְבַּ֣שׁ עַל בְּשָׂר/וֹ֒ וְ/הֵרִ֣ים אֶת הַ/דֶּ֗שֶׁן אֲשֶׁ֨ר תֹּאכַ֥ל הָ/אֵ֛שׁ אֶת הָ/עֹלָ֖ה עַל הַ/מִּזְבֵּ֑חַ וְ/שָׂמ֕/וֹ אֵ֖צֶל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: ja
  text: 祭司は亜麻布の衣を着て、その身[a]に亜麻布の下着を着ける。そして、祭壇の上で火が全焼のささげ物を焼いてできた灰[b]を取り除き、祭壇のそばに置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その肉の上に」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「火が全焼のささげ物を焼き尽くした灰」。ヘブライ語の表現は簡潔で、灰と火による全焼のささげ物との関係は複数の近い仕方で訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: 亜麻布の衣
  rationale: 祭司の職務用の衣を指し、直後の בַד が素材を示す。衣の具体的な形を必要以上に限定しない「衣」とした。
- source_word: מִכְנְסֵי בַד
  choice: 亜麻布の下着
  rationale: 肌に直接着ける祭司の下半身用衣服を、現代日本語で自然に示す。
- source_word: עַל בְּשָׂרוֹ
  choice: その身に
  rationale: 直訳は「その肉の上に」。身体に直接着ける意味を、簡潔で品位ある日本語にした。
- source_word: וְהֵרִים
  choice: 取り除き
  rationale: 基本義は「持ち上げる」だが、この祭儀手順では祭壇から灰を取り除く行為を表す。
- source_word: הַדֶּשֶׁן
  choice: 灰
  rationale: 祭壇の火がいけにえを焼いた後に残る灰・燃え残りを指す文脈的な訳。
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: 火が全焼のささげ物を焼いてできた
  rationale: ヘブライ語の圧縮された構文を自然な日本語にし、灰が火による焼却の結果であることを示す。「食べる」はここでは火が焼き尽くすことの比喩。
- source_word: הָעֹלָה
  choice: 全焼のささげ物
  rationale: 全体を祭壇で焼く עֹלָה の祭儀的特徴が一般読者にも伝わる定訳的表現。
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: 祭壇のそば
  rationale: 祭壇に近接した場所を簡潔かつ自然に表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀規定にふさわしい簡潔で品位ある文体とした。「着る」の反復を避けず、衣と下着の装着を区別するため後者を「着ける」とした。
