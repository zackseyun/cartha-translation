source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: ja
  text: これは、アロンとその子らが、彼が油を注がれる日に[a]主に献げるささげ物である。すなわち、上質の小麦粉一エファの十分の一を常の穀物のささげ物として、半分を朝に、残りの半分を夕方に献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼に油を注ぐ日に」。この節は「アロンとその子ら」と述べる一方、ヘブライ語の代名詞は単数形である。別訳「彼の油注ぎの日に」。
    reason: 複数の先行表現に対して原文が単数代名詞を用いることを示し、単数を保つ自然な別訳を示す。
lexical_decisions:
- source_word: קָרְבַּן
  choice: ささげ物
  rationale: 犠牲や供え物を広く指す語であり、祭儀的文脈を保ちつつ現代日本語として自然な表現を選んだ。
- source_word: יַקְרִיבוּ
  choice: 献げる
  rationale: ヒフィル形は祭儀文脈で、主の前に供え物を差し出す行為を表す。「献げる」はその正式な祭儀行為を簡潔に伝える。
- source_word: לַיהוָה
  choice: 主に
  rationale: 神名יהוהを、日本語聖書として自然で威厳ある慣用表現「主」で示した。
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: 彼が油を注がれる日に
  rationale: 受動的意味を持つ不定詞と三人称男性単数の目的語接尾辞を反映し、複数に読み替えず単数の緊張を保持した。
- source_word: עֲשִׂירִת הָאֵפָה
  choice: 一エファの十分の一
  rationale: 原文の計量表現を正確に保ち、「エファ」は古代の容量単位として音写した。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 穀物のささげ物に用いる、よく精製された良質の粉を指す語として、一般読者に分かりやすい表現を選んだ。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: レビ記の祭儀規定では穀類によるささげ物を指すため、単なる「ささげ物」より具体的に訳した。
- source_word: תָּמִיד
  choice: 日ごとの
  rationale: 朝夕に反復して献げる定期性を、絶え間なく燃え続けるという誤解を避けながら自然な日本語で示した。
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: 半分を……残りの半分を
  rationale: 一つの分量を二等分することが日本語で明確になるようにした。
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: 朝に……夕方に
  rationale: 二度の奉献時を簡潔で自然な現代日本語で示した。
theological_decisions:
- issue: 「アロンとその子ら」に続く、油を注がれる者を示す単数代名詞の指示対象
  choice: マソラ本文どおり単数を保ち、「彼が油を注がれる日に」と訳す。
  alternative: 文脈に合わせて複数化し、「彼らが油を注がれる日に」と訳す。
  rationale: 原文はアロンとその子らを挙げながら、接尾辞を男性単数としている。アロンを第一の指示対象または祭司職の代表者と理解できるが、本文では一つに断定せず、原文の文法的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀法規にふさわしい簡潔で厳かな調子を保った。「ささげ物」「穀物のささげ物」を使い分け、専門的すぎる古語は避けた。
