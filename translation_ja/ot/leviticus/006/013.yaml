  source_fidelity: 本文は、アロンとその子ら、単数の目的語接尾辞を伴う「油を注ぐ日」、十分の一エファ、朝夕の二分というヘブライ語本文の要点を正確に伝えている。ただし、תָּמִידを「日ごとの」と限定すると、語そのものの「常に／継続的に、定例として」の意味を日単位の頻度に狭めるため、「常の」として朝夕の配分とともにその定例性を示すのがより忠実である。
  naturalness: 全体として明瞭で現代標準日本語として自然である。「これは…献げるささげ物である」に続けて末尾でも「献げる」とする反復はやや重いので、後半を「献げなければならない」として法規文らしく自然に整えた。
  terminology: 「主」「ささげ物」「穀物のささげ物」「油を注がれる」は祭儀文脈に適切である。「上等の小麦粉」は品質評価をやや強く響かせるため、סֹלֶתの通常の意味に即して「上質の小麦粉」とした。単数代名詞は本文と注で維持する。
