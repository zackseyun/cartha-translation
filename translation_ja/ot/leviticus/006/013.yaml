revisions:
- from: これは、アロンとその子らが、彼が油を注がれる日に[a]主に献げるささげ物である。上等の小麦粉一エファの十分の一を、日ごとの穀物のささげ物として、半分を朝に、残りの半分を夕方に献げる。
  to: これは、アロンとその子らが、彼が油を注がれる日に[a]主に献げるささげ物である。すなわち、上質の小麦粉一エファの十分の一を常の穀物のささげ物として、半分を朝に、残りの半分を夕方に献げなければならない。
