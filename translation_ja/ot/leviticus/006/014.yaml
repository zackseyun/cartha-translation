source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: ja
  text: 'それは平鍋で、油を用いて[a]作られ、よく混ぜ合わせたものを携えて来なさい。焼いた穀物のささげ物を小片にして[b]、ヤハウェへの芳しい香り[c]として献げなさい。


    [a] 「油の中で」とも訳せる。


    [b] 「焼いた」と訳したヘブライ語はまれな語で、平鍋で焼いて調えた部分を指す可能性がある。


    [c] 「芳しい香り」は、ヤハウェに受け入れられるささげ物を表す、祭儀に関する定型表現。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「油の中で」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「焼いた」と訳したヘブライ語はまれな語で、平鍋で焼いて調えた部分を指す可能性がある。
    reason: lexical_alternative
  - marker: c
    text: 「芳しい香り」は、ヤハウェに受け入れられるささげ物を表す、祭儀に関する定型表現。
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: 平鍋
  rationale: 穀物のささげ物を焼く平たい調理器具を指す。現代日本語で理解しやすく、単なる「鍋」より形状を明確に示す。
- source_word: בַּשֶּׁמֶן
  choice: 油を用いて
  rationale: 前置詞は「油の中で」とも取れるが、ここでは調理の手段を自然な日本語で表した。異なる可能性は脚注に残した。
- source_word: תֵּעָשֶׂה
  choice: 作り
  rationale: 受動形だが、日本語の祭儀規定として自然になるよう、後続する二人称の命令とつながる能動的な表現にした。
- source_word: מֻרְבֶּכֶת
  choice: よく混ぜ合わせて
  rationale: 油と生地またはささげ物を十分に混ぜ合わせた状態を表す語として、特定の調理法を過度に限定せず訳した。
- source_word: תְּבִיאֶנָּה
  choice: 携えて来る
  rationale: 女性単数接尾辞はささげ物を指す。祭儀の場へ持って来る方向性を表した。
- source_word: תֻּפִינֵי
  choice: 焼いた小片
  rationale: まれな調理用語で、焼いた部分または一片を指すと考えられる。確実でない語義は脚注で明示した。
- source_word: מִנְחַת
  choice: 穀物のささげ物
  rationale: レビ記の文脈で、小麦粉や穀物による祭儀的なささげ物を指すため、一般的な「ささげ物」より具体的に訳した。
- source_word: פִּתִּים
  choice: 小片にした
  rationale: 分けられた、または砕かれた複数の部分という意味を自然な日本語で示した。
- source_word: תַּקְרִיב
  choice: 献げなさい
  rationale: 祭儀文脈における「近づける、差し出す」の意味を、現代日本語の聖書文体で自然に表した。
- source_word: רֵיחַ נִיחֹחַ
  choice: 芳しい香り
  rationale: 神に受け入れられるいけにえを示す祭儀上の定型句を、過度に物理的な嗅覚描写へ限定せず簡潔に表した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 本文に記された神名יהוהを、称号へ置き換えず固有名として音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を保ち、一般的な称号である「主」と区別した。
- issue: רֵיחַ נִיחֹחַの祭儀的意味
  choice: 芳しい香り
  alternative: 安らぎの香り
  rationale: 神に受け入れられるささげ物という祭儀的含意を保つ定型表現とした。その意味は脚注で説明し、本文で解釈を過度に展開しなかった。
- issue: 希少語תֻּפִינֵיの不確実性
  choice: 焼いた小片
  alternative: 焼いた部分
  rationale: 直後の「小片」との関係を自然に示しつつ、語義が確定的でないことを脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀規定にふさわしい簡潔で dignified な文体とした。「ささげ物」と「献げる」を使い分け、読者に理解しやすくした。希少語と前置詞の曖昧さは本文で断定しすぎず脚注に保持した。
