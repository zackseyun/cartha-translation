id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ja
  text: '「息の息[a]」とコヘレト[b]は言う。

    「息の息。すべては、ただの息だ。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ヘベル（הֶבֶל）は、文字どおりには「息」または「蒸気」。本書に繰り返し現れ、息のようにすぐ消えること、つかめないこと、期待と現実が食い違うことを重ねて響かせる。日本語の一語ではそのすべてを表せないため、ここでは具体的な像を保って「息」とした。「息の息」は「歌の歌」「聖なるものの中の聖なるもの」と同種の、最上級を表すヘブライ語表現。伝統的には「空の空」「空しい」とも訳される。
    reason: lexical_choice
  - marker: b
    text: 「コヘレト」はヘブライ語の呼称の音写。「教師」「伝道者」「説教者」などとも訳されてきたが、いずれも意味を特定の方向に狭めるため、ここでは原語の開かれた含みを残した。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: 息
  rationale: この語の基本像である「息、蒸気」を具体的な「息」で表した。伝道者の書では、消えやすさ、つかみどころのなさ、期待と現実の食い違いという含みが重なり得るため、「空しさ」「無意味」「徒労」など一つの抽象語に限定しない。
- source_word: הֲבֵל הֲבָלִים
  choice: 息の息
  rationale: 「XのXたち」という最上級的なヘブライ語構文と、「息」という具体像をともに保つため。「この上なく空しい」などと意味を一つに決めず、詩的で反復的な原文の形を残した。
- source_word: אָמַר
  choice: 言う
  rationale: 形態上は完了形だが、文学的な発言提示として現在形にし、宣言の生々しさを保った。
- source_word: קֹהֶלֶת
  choice: コヘレト
  rationale: 「教師」「説教者」「集会を招集する者」などはいずれも語義を狭めるため、ヘブライ語の呼称を日本語で音写した。
- source_word: הַכֹּל
  choice: すべて
  rationale: 定冠詞を伴う包括的表現の全体性を、自然で簡潔な日本語で示した。
- source_word: הָבֶל
  choice: ただの息
  rationale: 述語位置では「息」だけだと物質についての定義のようにも響くため、「ただの」を添え、原文が文脈上帯びる評価的・落差的な響きを自然な日本語で伝えた。
theological_decisions:
- issue: 本書を貫く הֶבֶל の訳し方
  choice: 具体像を保ち、「息の息」「ただの息」と訳す。
  alternative: 空、空しさ、無意味、徒労、はかなさ、不条理、蒸気
  rationale: 原語は、短命で消えること、つかめないこと、期待と現実が食い違うことを文脈に応じて重ねて響かせる。抽象語一語に固定すると、その一部だけを前面に出し、とりわけ「無意味」は本文が必ずしも主張しない虚無主義を持ち込みかねない。具体的な「息」という像によって、読者が各文脈から含意を受け取れるようにした。
- issue: קֹהֶלֶת の身分・役割
  choice: コヘレトと音写する。
  alternative: 教師、伝道者、説教者、招集者
  rationale: 語形と役割の解釈には幅があるため、特定の職務や教派的な連想に固定しない。
translation_notes:
  register: 簡潔で格言的な反復と宣言調を保った。「息の息」は日常語としては異例だが、原文の詩的な最上級構文と中心的比喩を可視化するため意図的に採用した。終止は「だ」とし、現代の一般読者に明瞭でありつつ断言の力を保った。
