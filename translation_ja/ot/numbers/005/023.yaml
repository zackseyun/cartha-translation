  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: ja
  text: 祭司は、これらの呪いの言葉[a]を巻物に書き、それらを苦い水の中に洗い落とす[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの誓いに伴う呪い」とも訳せる。ヘブライ語は、誓いと結びついた呪いを指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「拭い消す」「消し去る」とも訳せる。ヘブライ語の動詞は、書かれた文字を拭い取って消すことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: 書き
  rationale: 儀式の手順を順に命じる文脈にある接続詞付き完了形として、後続の動作へ自然につながる連用形で表した。
- source_word: הָאָלֹת הָאֵלֶּה
  choice: これらの呪いの言葉
  rationale: אָלָהは誓いに伴う呪いを指し得る。ここでは実際に書き記す宣告内容であることが日本語で明確になるよう「呪いの言葉」とし、誓いとの関連は脚注に残した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: イスラエルの祭儀を執行する者を表す標準的な訳語。
- source_word: בַּסֵּפֶר
  choice: 巻物に
  rationale: סֵפֶרはここで現代的な綴じ本ではなく、文字を書きつける古代の文書媒体を指すため。
- source_word: וּמָחָה
  choice: 洗い落とす
  rationale: 文字を拭い消す、消し去るという意味を持つ語であり、この儀式では書かれた言葉を水へ移す具体的動作なので「洗い落とす」が自然。
- source_word: אֶל
  choice: 中に
  rationale: 書かれたものが水へ移される方向を表し、日本語では「水の中に」が明瞭。
- source_word: מֵי הַמָּרִים
  choice: 苦い水
  rationale: 直訳的には「苦さの水／苦い水」。この儀式で用いる液体を自然な現代日本語で表した。
