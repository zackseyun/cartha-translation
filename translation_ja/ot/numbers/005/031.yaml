id: NUM.5.31
reference: Numbers 5:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נִקָּ֥ה הָ/אִ֖ישׁ מֵ/עָוֺ֑ן וְ/הָ/אִשָּׁ֣ה הַ/הִ֔וא תִּשָּׂ֖א אֶת עֲוֺנָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: ja
  text: こうして、その男は罪責を免れるが、その女は自分の罪責を負う。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪責を負う」は、その罪の結果を負うことをも含み得るヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: 免れる
  rationale: ニファル形と前置詞 מִן の組み合わせが示す、責任や罪責から解放される意味を、自然な現代日本語で表す。
- source_word: הָאִישׁ
  choice: その男
  rationale: 基本義の「男」を保ちつつ、文脈上すでに登場している夫を指すため「その」を添えた。「夫」も文脈的には可能だが、やや解釈的である。
- source_word: מֵעָוֺן
  choice: 罪責を
  rationale: עָוֹן が含む罪とそれに伴う責任・負い目を表し、後半との語義的な対応も保つ。日本語では「罪責を免れる」が自然である。
- source_word: וְהָאִשָּׁה הַהִוא
  choice: が、その女は
  rationale: וְ の対照的な働きを「が」で表し、הַהִוא の指示的な強調を「その女」に反映した。
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: 自分の罪責を負う
  rationale: נשׂא עָוֹן の慣用表現を簡潔に保ち、罪そのものとその結果を担う含みを残す。「自分の」は三人称女性単数接尾辞を自然に表す。
theological_decisions:
- issue: 両節における עָוֹן の意味
  choice: 両方を「罪責」と訳し、男がそれを免れることと女がそれを負うことの法的・道徳的な対照を保つ。
  alternative: 「罪」「咎」、または「罪の罰」と訳す。
  rationale: 「罪責」は、行為としての罪だけでなく、それに伴う責任や負い目も含み得るため、ヘブライ語の幅を比較的よく保つ。「罰」と限定すると結果だけに狭めすぎる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」で規定全体の結論であることを示した。原文の対照と同一語 עָוֹן の反復を「罪責」で保持した。
