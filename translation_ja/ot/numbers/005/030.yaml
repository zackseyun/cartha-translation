  to: また、ある男に嫉妬の霊が臨み[a]、彼が妻に嫉妬して、その女をヤハウェの前に立たせる場合、祭司は彼女に対して、この教えに定められたことをすべて行う。
  rationale: 夫婦関係の文脈における「嫉妬」を用い、名詞 קִנְאָה と動詞 קִנֵּא の対応を統一した。また、条件節の語順を自然に整えた。それ以外は、רוּחַ の解釈上の曖昧さ、神名、儀礼的な「立たせる」、および תורה が指す規定全体の意味を保っている。
