source:
  edition: WLC
  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: ja
  text: また、ある男に嫉妬の霊が臨み[a]、彼が妻に嫉妬して、その女をヤハウェの前に立たせる場合、祭司は彼女に対して、この教えに定められたことをすべて行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼の上を通り過ぎる」。ここでは「彼に臨む」「彼を襲う」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: また、…場合
  rationale: 前から続く規定のもう一つの選択肢を導く接続詞として、文脈上自然な条件表現にした。
- source_word: אִישׁ
  choice: ある男
  rationale: 原語の一般的な「男」を保ち、婚姻関係は後続の「妻」によって明らかにした。
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: ねたみの霊が…臨み
  rationale: 「霊」が内的な衝動か霊的な力かを確定せず、原文の曖昧さを保持した。「通り過ぎる」を直訳せず、この構文での自然な日本語とした。
- source_word: קִנְאָה / וְקִנֵּא
  choice: ねたみ／ねたむ
  rationale: 名詞と同根動詞の反復を日本語でも示し、妻の不貞を疑う文脈に合う語を選んだ。
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: その女をヤハウェの前に立たせる
  rationale: 使役形の「立たせる、出頭させる」を比較的形式対応的に訳し、儀礼的な提示を表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を普通名詞の称号に置き換えず、固有名として音写した。
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: 祭司は彼女に対して…行う
  rationale: 祭司が規定された処置を実施する意味を、現代日本語で明瞭に示した。
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: この教えに定められたことをすべて
  rationale: תורה の「教え・指示・律法」という幅を保ちつつ、ここでは直前の一連の手続きを指すことが自然に伝わるようにした。
theological_decisions:
- issue: 「ねたみの霊」の性質
  choice: 「ねたみの霊」と訳し、心理的衝動か霊的作用かを特定しない。
  alternative: 「ねたみの衝動」「嫉妬心」
  rationale: רוּחַ の語を保持することで、本文が明示していない作用主体や存在論を翻訳で決定しないため。
- issue: תּוֹרָה の範囲
  choice: 「この教えに定められたこと」とし、規定全体の実施を表す。
  alternative: 「この律法」「この儀式」「この手続き」
  rationale: 単なる儀式に狭めず、同時に抽象的な「教え」だけにも聞こえないよう、文脈上の規定された処置を表した。
translation_notes:
  register: 現代標準日本語。法的・儀礼的な尊厳を保ちつつ、長いヘブライ語文を条件節として自然に構成した。「ねたみ」は同根語の反復を見せるため統一し、神名は「ヤハウェ」とした。
