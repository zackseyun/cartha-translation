id: NUM.5.15
reference: Numbers 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: ja
  text: 夫は妻を祭司のもとに連れて行き、彼女のためのささげ物として、大麦の粉、一エファの十分の一を携えて行かなければならない。その上に油を注いではならず、乳香を加えてもならない。これは嫉妬の穀物のささげ物、すなわち、咎を思い起こさせる記念のささげ物[a][b]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「記念のささげ物」は、「思い起こすためのささげ物」とも訳せる。
    reason: זִכָּרוֹן の語義の幅を示すため。
  - marker: b
    text: 「咎」は、「罪責」または「不正から生じる責任」とも訳せる。
    reason: עָוֹן は不正そのものだけでなく、罪責やその結果としての責任も表し得るため。
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: その人は妻を…連れて行き
  rationale: הביא は使役形だが、人を目的語とする場合、日本語では「連れて行く」が自然である。הָאִישׁ は直訳的に「その人」とし、続く「妻」で夫婦関係を明示した。
- source_word: וְהֵבִיא אֶת־קָרְבָּנָהּ עָלֶיהָ
  choice: 妻のためのささげ物として…携えて行き
  rationale: 女性接尾辞を保ち、עָלֶיהָ の代理・関係の意味を「妻のための」で表した。物を持参する הביא は「携えて行く」とした。
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: 一エファの十分の一
  rationale: 古代の容量単位エファを換算せず音写し、分量を原文どおり示した。
- source_word: קֶמַח שְׂעֹרִים
  choice: 大麦の粉
  rationale: קֶמַח は穀粉を指すため、現代日本語で明瞭な「大麦の粉」とした。
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: その上に油を注いではならず、乳香を載せてもならない
  rationale: 祭儀規定における禁止の効力を「〜てはならない」で表現した。לְבֹנָה は香料樹脂の「乳香」とした。
- source_word: מִנְחַת קְנָאֹת
  choice: ねたみの穀物のささげ物
  rationale: 祭儀文脈の מִנְחָה を「穀物のささげ物」とし、קְנָאֹת の嫉妬・疑念を含む幅を「ねたみ」で保持した。
- source_word: מִנְחַת זִכָּרוֹן מַזְכֶּרֶת עָוֹן
  choice: 咎を思い起こさせる記念のささげ物
  rationale: זִכָּרוֹן と分詞 מַזְכֶּרֶת の記憶語彙をそれぞれ「記念」「思い起こさせる」で再現し、עָוֹן は行為と責任の幅を持つ「咎」とした。
theological_decisions:
- issue: この儀式が妻の有罪を前提としているか
  choice: 有罪・無罪を確定せず、ささげ物が「咎を思い起こさせる」とのみ訳す
  alternative: 妻の罪を明らかにする、または妻の有罪を記念する、と解釈的に訳す
  rationale: 本文はささげ物の性質と機能を述べるが、この節だけでは妻の有罪を確定していないため、司法的・神学的結論を補わない。
- issue: קְנָאֹת の解釈
  choice: ねたみ
  alternative: 嫉妬による疑い／夫の疑念
  rationale: 語は嫉妬、熱情、疑念に関わる意味領域を持つ。「ねたみ」は文脈上の緊張を残し、主体や正当性を訳文だけで限定しない。
translation_notes:
  register: 現代標準日本語の祭儀規定として、平明さと格調を両立させた。「ささげ物」は仮名書きにし、「エファ」「乳香」など必要な祭儀・文化語は保持した。脚注標識は関連表現の直後に置くのが望ましいが、両注の対象が終結部に集中するため文末に配置した。
