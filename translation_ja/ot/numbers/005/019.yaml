source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: ja
  text: 祭司はその女に誓わせて、こう言う。『もし、だれもあなたと寝たことがなく、夫のもとにありながら、あなたが汚れに陥って道を踏み外したこともないなら、呪いをもたらすこの苦い水から免れよ[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「呪いをもたらすこの苦い水について潔白であれ」。
    reason: ヘブライ語 הִנָּקִי は、この水からの免除を求める表現としても、この水に関して潔白であることを表す語としても理解できるため。
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: 誓わせ
  rationale: שבע のヒフィル形が持つ使役の意味を保ち、祭司が女を誓いのもとに置く法的手続きを自然な現代日本語で表す。
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: もし、だれもあなたと寝たことがなく
  rationale: שׁכב は性交を指す婉曲表現である。「寝る」は婉曲性を保ち、איש の不定的な用法を「だれも」で自然に示す。
- source_word: שָׂטִית טֻמְאָה
  choice: 身を汚すことによって道を踏み外した
  rationale: שׂטה の逸脱の比喩と、טֻמְאָה の汚れ・不浄の概念をともに残す。文脈上は性的な不貞が問題だが、「姦淫」と断定して原文以上に限定しない。
- source_word: תַּחַת אִישֵׁךְ
  choice: 夫のもとにありながら
  rationale: 直訳的な「夫の下で」は現代日本語では不自然で誤解を招くため、婚姻関係にある状態とその絆の内側にいることを示す慣用的表現とした。
- source_word: הִנָּקִי
  choice: 害を受けることはない
  rationale: נקה の命令形がここで示す、潔白なら水の呪いの作用を免れるという意味を、日本語の条件文に自然につながる形で表す。別訳の可能性は脚注に示す。
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: 呪いをもたらすこの苦い水
  rationale: 「水」は日本語では物質名詞として単数形が自然である。הַמְאָרֲרִים の呪いを生じさせる働きを「呪いをもたらす」で明示する。
theological_decisions:
- issue: 女の違反を表す語の範囲
  choice: 「寝た」「身を汚す」「道を踏み外す」という原文の表現を保つ
  alternative: 「姦淫した」と明示する
  rationale: 文脈は婚姻上の性的な不貞を扱うが、原文は複数の婉曲的・儀礼的表現を用いているため、後代の教義的分類を持ち込まず、その緊張と幅を残す。
- issue: 苦い水が及ぼす作用
  choice: 「呪いをもたらす」とし、潔白な場合はその害を受けないと訳す
  alternative: 「呪いとなる水」または「この水から潔白であれ」と直訳する
  rationale: 分詞 הַמְאָרֲרִים は水が呪いを生じさせる性質を示すが、この節だけで作用の具体的機序を限定しない。הִנָּקִי は潔白と免除の両義を帯びるため、代案を脚注に残す。
translation_notes:
  register: 法的・儀礼的な厳粛さを保ちつつ、現代の一般読者に通じる明瞭な標準語とした。「夫のもとにありながら」は婚姻関係を表し、支配関係を不必要に強調しない。「身を汚す」は儀礼的・道徳的な両面を残す。
