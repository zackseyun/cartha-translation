revisions:
- from: イスラエルの子らに告げなさい。男であれ女であれ、人が犯すどのような罪であっても、それを犯して主に不実を働くなら、その人は罪責を負う。
  to: イスラエルの子らに告げなさい。男であれ女であれ、人が犯すいずれかの罪を犯し、主に対して不実を働くなら、その人は罪責を負う。
  rationale: 原文の「人間の罪のいずれか」と、不実が主に対してなされるという関係を保ちつつ、現行訳の冗長でやや不自然な条件節を明瞭にした。意味の追加・限定はしていない。
