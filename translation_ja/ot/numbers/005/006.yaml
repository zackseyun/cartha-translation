id: NUM.5.6
reference: Numbers 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: ja
  text: イスラエルの子らに告げなさい。男であれ女であれ、人が犯すいずれかの罪を犯し、主に対して不実を働くなら、その人は罪責を負う。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: 告げなさい
  rationale: ピエル命令形。神の法的な指示として、現代日本語で自然かつ明瞭な命令表現とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 民全体を指す一方、原文の家族的・契約的な表現を保った。
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: 男であれ女であれ
  rationale: 男女双方を明示する原文を保ち、日本語の法文調として自然に表現した。
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: 人が犯すどのような罪であっても
  rationale: הָאָדָם はここでは男性個人でなく人間一般を指す。日本語の「人」により包括的な意味を自然に表した。
- source_word: לִמְעֹל מַעַל
  choice: 不実を働く
  rationale: 同根語を重ねた表現が示す、信義や契約への背反を簡潔に伝える。
- source_word: בַּיהוָה
  choice: 主に
  rationale: 神の固有名を、日本語聖書で広く理解される尊称「主」で表した。前置詞は不実の向けられる相手を示す。
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: その人は罪責を負う
  rationale: נפש はここでは非物質的な「魂」ではなく当人を指す。אָשַׁם の有罪・責任を負う状態を「罪責を負う」とした。
theological_decisions:
- issue: יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 神の固有名であることを踏まえつつ、明瞭で格調ある現代日本語として定着した表記を採用した。
- issue: הָאָדָם の一般的用法
  choice: 人
  alternative: 人類
  rationale: この法的表現では男女を含む人間一般を指す。「人」は文脈に自然で、直前の「男であれ女であれ」とも調和する。
- issue: אָשַׁם が示す状態
  choice: 罪責を負う
  alternative: 罪に定められる
  rationale: 原文は必ずしも裁判上の宣告そのものに限定せず、罪を犯した結果として責任ある状態になることを示すため、より幅を保つ表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法的・契約的文脈にふさわしい品位を保った。「人が犯すどのような罪であっても、それを犯して」は原文の「人間の罪のどれかを行う」を自然な日本語に組み替えた表現である。
