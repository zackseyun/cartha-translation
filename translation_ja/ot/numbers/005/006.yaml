  timestamp: '2026-07-19T21:12:58Z'
review_pass:
  verdict: revise
  source_fidelity: 原文は、イスラエルの子らに対し、男でも女でも、人間一般に見られる罪のいずれかを犯して主に対する信義を破る者は有責となる、と述べる。改訂案はこの条件文、男女の明示、主に向けられた不実、結果としての罪責を保つ。
  naturalness: 現行文の「人が犯すどのような罪であっても、それを犯して」は「犯す」の重なりと「であっても」の係り方がやや不自然である。「人が犯すいずれかの罪を犯し」とすることで、法的文脈に合う明瞭な現代日本語となる。
  terminology: 「イスラエルの子ら」「男であれ女であれ」「主」「不実を働く」「罪責を負う」は、原文の語法と現代標準日本語の格調をおおむね適切に伝える。「主に対して」として、מעלの対象を明示する。
  issues:
  - severity: low
    issue: 条件節内の表現の重複と接続の不自然さ
    rationale: 「人が犯すどのような罪であっても、それを犯して」は意味は通るが、同じ動詞の反復と「であっても」から後続する条件へのつながりがぎこちない。原文の「罪のいずれかを行い」を保ちながら整えるのが安全である。
  revised_text: イスラエルの子らに告げなさい。男であれ女であれ、人が犯すいずれかの罪を犯し、主に対して不実を働くなら、その人は罪責を負う。
