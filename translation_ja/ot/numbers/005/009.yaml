  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: ja
  text: イスラエルの子ら[a]が祭司に携えて来る[c]、すべての聖別された品々に関わる奉納物[b]は、その祭司のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。ヘブライ語では「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖なるもの」または「聖なる供え物」。
    reason: lexical_alternative
  - marker: c
    text: 「携えて来る」は、祭儀の文脈では「近づける」「差し出す」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: 奉納物
  rationale: 聖別して差し出され、祭司の受け分となる物を指す。ここでは古風で専門的な訳語を避けつつ、単なる一般的な寄付ではない宗教的性格を保つ。
- source_word: קָדְשֵׁי
  choice: 聖なるもの
  rationale: 複数形の連語で、聖別された品々を広く指す。「聖なるもの」は原文の幅を保ち、「供え物」だけに狭めない。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な家族・共同体表現を保つ。現代日本語では「イスラエル人」のほうが自然なため、脚注に代案を示す。
- source_word: יַקְרִיבוּ
  choice: 携えて来る
  rationale: ヒフィル形は祭儀文脈で「近づける、差し出す」の意を持つ。日本語本文では不自然な直訳を避け、「携えて来る」とし、奉献・提示の含みは文脈と脚注で示す。
- source_word: לַכֹּהֵן
  choice: 祭司のもとに
  rationale: 贈与の相手を表す前置詞を自然な日本語で示す。後続句が所有への移行を明確にする。
- source_word: לוֹ יִהְיֶה
  choice: その祭司のものとなる
  rationale: 法的な帰属を表す慣用句。「彼のもの」では指示対象が曖昧になり得るため、祭司を補って明確にした。
theological_decisions:
- issue: 契約共同体を表す בְנֵי יִשְׂרָאֵל の訳
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数・親族的表現を保持しつつ、これを成人男性だけに限定する解釈は加えない。自然な民族名称は脚注に示す。
- issue: 聖別物からの奉納物と祭司の所有権の関係
  choice: すべての聖なるものからの奉納物は、どれもその祭司のものとなる
  alternative: すべての聖なる奉納物は、その祭司のものとなる
  rationale: לְכָל קָדְשֵׁי の関係を「聖なるものからの」と表し、奉納物と聖別物を完全に同一視して原文の構造を平板化しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。民数記の法規的調子を「どれも」「ものとなる」で保ち、過度に古風な祭儀用語は避けた。脚注記号は該当語句の直後または節末に配置した。
