base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: ja
  text: 各人の聖なるささげ物[a]は、その人のものとなる。人が祭司に与えるものは、その祭司のものとなる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その人の聖なるもの」。神に聖別された供え物を指す。
    reason: lexical_alternative
  - marker: b
    text: 原文では前半・後半とも簡潔に「その人（彼）のもの」と表現されている。後半の「その人」は、直前の「祭司」を指すと理解される。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: 人／その人
  rationale: 男性単数名詞だが、この法規では各個人を配分的に指す。現代日本語では「人」「その人」とすることで、不自然な「各々の男」を避けつつ個別性を保つ。
- source_word: קֳדָשָׁיו
  choice: その人の聖なるささげ物
  rationale: קדשׁ の複数形は、ここでは聖別された品々、すなわち聖なる供え物を指す。「聖なるもの」より文脈上の意味が明瞭であり、聖別の性格も保てる。
- source_word: לוֹ יִהְיוּ
  choice: その人のものとなる
  rationale: 所有を表す簡潔な構文。「その人のものとなる」は、献納者に帰属するという法的内容を自然な日本語で伝える。
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: 人が祭司に与えたもの
  rationale: 一般化された関係節として訳し、定冠詞付き単数の「祭司」を維持した。完了的な日本語表現により、実際に祭司へ渡された物を指すことを明確にする。
- source_word: לוֹ יִהְיֶה
  choice: その祭司のものとなる
  rationale: 直訳では代名詞「彼の」だが、直前の「祭司」を受けることを日本語では明示した方が誤解がない。ヘブライ語の反復的な所有表現も保持する。
theological_decisions:
- issue: 前半の לוֹ の指示対象
  choice: ささげ物を持つ各人に帰属するものとして訳す
  alternative: 祭司に帰属するものとして読む
  rationale: 語順上は直前の「人」を受けるのが自然であり、後半は祭司に実際に与えられた物が祭司のものになると区別して述べる。ただし原文の簡潔な代名詞表現には解釈上の緊張があるため脚注で補足する。
- issue: 後半の לוֹ の指示対象
  choice: 祭司を指すことを本文で明示する
  alternative: 「彼のものとなる」と代名詞のまま残す
  rationale: 直前の לַכֹּהֵן が自然な先行詞であり、祭司に与えられた物はその祭司に帰属するという意味である。日本語の「彼」では誰を指すか曖昧になりすぎるため名詞を反復した。
translation_notes:
  register: 現代標準日本語による、簡潔で格調を保った法規文。「ささげ物」は平仮名を用いて読みやすくし、「その人」「その祭司」によって原文の代名詞の指示対象を自然に明示した。
