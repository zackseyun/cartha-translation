  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: ja
  text: そのとき、彼らは自分たちの犯した罪を告白しなければならない。罪を犯した者は、賠償すべき額を全額返し[a]、それに五分の一を加えて、自分が罪責を負った相手に渡さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全額返し」は、原文では直訳すると「その頭において返す」の意で、五分の一の加算分を含まない元の賠償額を返すことを指す。続く「五分の一」は、その額に加える二十パーセントである。
    reason: ヘブライ語の慣用表現が元金（本来返すべき額）の返還を指し、その後に五分の一が加算されることを明確にするため。
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: そのとき、彼らは…告白しなければならない
  rationale: 再帰・相互的語幹の文脈上の意味である、罪を公に認めて告白することを表す。接続詞は文脈上の順序を「そのとき」で示し、完了形の規定的用法を「しなければならない」とした。
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: 自分たちの犯した罪
  rationale: חַטָּאתはここでは告白の対象となる罪・違反を指し、עָשׂוּとの組み合わせを自然な日本語の「犯した罪」とした。
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: 罪責について元の額を全額償い
  rationale: שׁובの使役形は返還・弁済を表し、אָשָׁםはこの文脈では供え物そのものではなく、罪から生じた責任または賠償義務を指す。בְּרֹאשׁוֹは加算前の元金・元の額を示す慣用表現なので、「元の額を全額」と明示した。
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: それに五分の一を加えて
  rationale: 元の額に二十パーセントを上乗せする規定を、原文に近く明瞭に表した。
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: 自分が罪を犯した相手に渡さなければならない
  rationale: 直訳的には「その人に対して罪責を負った者へ」だが、日本語では被害を受けた相手を自然に特定する表現とした。וְנָתַןの具体的な授受の語感を「渡す」で保った。
theological_decisions:
- issue: 賠償文脈における אָשָׁם の意味
  choice: 罪から生じた罪責・賠償義務
  alternative: 罪過のいけにえ
  rationale: 直後に元の額の返還、五分の一の加算、被害者への引き渡しが述べられるため、ここでは祭儀上の供え物ではなく、罪によって生じた責任と賠償額を指す。
- issue: 数の変化（複数形から単数形）
  choice: 告白は「彼ら」、賠償義務者は一般化された単数の「自分」
  alternative: 全節を複数に統一する
  rationale: 原文は וְהִתְוַדּוּ（複数）から וְהֵשִׁיב／וְנָתַן（単数）へ移る。この変化を均さず、後半は該当する個々人を指す一般的な単数として訳した。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で厳粛な法規文体。「罪責」は神学的・法的な含意を保つため採用し、金銭的な内容は「元の額を全額償う」で具体化した。原文の複数から単数への移行を保持した。
