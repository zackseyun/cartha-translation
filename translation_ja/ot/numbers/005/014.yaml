source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: ja
  text: また、夫に嫉妬の思いが起こり、夫が妻に対して嫉妬を抱き、妻が身を汚していた場合、あるいは、夫に嫉妬の思いが起こり、夫が妻に対して嫉妬を抱き、妻が身を汚していなかった場合には、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָבַר עָלָיו רוּחַ קִנְאָה
  choice: 嫉妬の思いが夫を襲い
  rationale: רוּחַはここでは人を動かす内的な衝動・心の状態を指す。「嫉妬の思い」は不必要に実体的な霊と断定せず、「襲う」によってעָבַר עַלの強い到来を自然な日本語で表す。
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: 妻に嫉妬した
  rationale: קנאのピエル形が表す夫の嫉妬の反応を、現代日本語で簡潔かつ自然に表現する。
- source_word: נִטְמָאָה
  choice: 身を汚していた
  rationale: 語義の根底にある汚れを保ちつつ、この文脈で問題となる妻自身の性的な不貞を示す。「汚れていた」だけでは儀礼的不浄に限定して読まれやすい。
- source_word: אוֹ
  choice: あるいは
  rationale: 法律文におけるもう一つの可能な事例を導く選択接続詞として訳す。
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: 妻は身を汚していなかった
  rationale: ヘブライ語の単純な接続を保ち、前の事例との対照は「あるいは」と否定によって自然に明らかになるため、「にもかかわらず」などは補わない。
theological_decisions:
- issue: 不貞の疑いに関する規定における汚れの性質
  choice: 「身を汚していた」と訳し、性的行為による道徳的・契約的な汚れを文脈上示す。
  alternative: 「汚れていた」「不浄になっていた」
  rationale: נִטְמָאָהの不浄語彙を残しながら、単なる儀礼的不浄という誤解を避ける。受動か自発かという形態上の曖昧さを越えて、不必要な教理的判断は加えない。
- issue: רוּחַ קִנְאָהの理解
  choice: 「嫉妬の思い」
  alternative: 「嫉妬の霊」「嫉妬心」
  rationale: רוּחַには霊、風、心的衝動という意味領域がある。この文脈では夫を動かす状態を指すとみられるため自然な表現を選ぶが、超自然的存在とは断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後に続く条件文の一部であるため、文末は「場合には、」として次節への連続性を保った。主語の代名詞は、日本語で指示対象を明確にするため「夫」「妻」とした。
