source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: ja
  text: これは、妻が夫のもとにありながら[a]道を外れ[b]、汚れたときの、嫉妬に関する律法[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「夫の下にありながら」。夫との婚姻関係のもとにあることを表す言い回し。
    reason: cultural_note
  - marker: b
    text: または「それる」。婚姻上の不貞を、道から外れることとして表す比喩。
    reason: lexical_alternative
  - marker: c
    text: 「嫉妬」に当たるヘブライ語は複数形で、この法的手続きを指す名称として用いられていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: 律法
  rationale: 法的規定を要約する定型句であり、民数記の文脈にふさわしい、明瞭で格調ある語を選んだ。
- source_word: הַקְּנָאֹת
  choice: ねたみに関する
  rationale: ヘブライ語は複数形だが、ここではこの一連の法的手続きを示す名称として機能する。日本語で不自然な「ねたみの数々」を避けつつ、語義を保持した。
- source_word: תִּשְׂטֶה
  choice: 道を外れ
  rationale: 婚姻上の不貞を指す文脈だが、原文の比喩を保ち、「姦淫する」と明示しすぎない表現とした。
- source_word: אִשָּׁה
  choice: 妻
  rationale: 後続する「彼女の夫」によって婚姻関係が明示されているため、「女」ではなく「妻」とした。
- source_word: תַּחַת אִישָׁהּ
  choice: 夫のもとにありながら
  rationale: 直訳的な「夫の下で」より自然な日本語で、夫との婚姻関係のもとにあるという慣用的意味を表した。
- source_word: וְנִטְמָאָה
  choice: 汚れた
  rationale: ニファル形の結果状態を簡潔に表し、祭儀的不浄だけにも、明示的な姦淫罪だけにも意味を限定しない。
theological_decisions:
- issue: 不浄を表す טמא の性質
  choice: 「汚れた」と訳し、原文の不浄の語彙を保持する。
  alternative: 「不浄になった」または「姦淫した」
  rationale: 文脈は性的な不貞の疑いを扱うが、原文自体は不浄の語を用いる。「姦淫した」と限定せず、祭儀的・道徳的含意の重なりを残した。
- issue: קנאות の複数形
  choice: 本文では自然な総称として「ねたみに関する律法」とし、複数形は脚注で示す。
  alternative: 「ねたみの数々についての律法」
  rationale: 複数形は真正な原文情報だが、日本語で機械的に複数化すると個々の感情の列挙に誤解されやすい。法的手続きの名称という機能を優先しつつ、脚注で形式を明示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準的日本語としつつ、法文の要約にふさわしい「律法である」という格調を保った。原文の語順は日本語として自然になるよう組み替えたが、比喩、不浄の語彙、複数形に伴う曖昧さは本文と脚注で保持した。
