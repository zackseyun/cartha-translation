  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: ja
  text: 彼は、呪いをもたらす苦い水をその女に飲ませる。[a] その呪いをもたらす水は彼女の内に入り、苦みとなる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「苦みの水」。ヘブライ語では「水」が複数形になっているが、水を表す通常の言い方である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼女の内に入り、苦く作用する」。この句は、その水がもたらす結果を表していると考えられるが、原文はその結果を具体的には説明していない。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: 彼は……飲ませる
  rationale: שׁקהのヒフィル形が表す「飲むようにさせる／飲ませる」という使役の意味を、自然な現代日本語で表した。
- source_word: אֶת הָאִשָּׁה
  choice: その女に
  rationale: 定冠詞付きの名詞を、文脈上すでに登場している特定の女性を指す「その女」とした。
- source_word: מֵי הַמָּרִים
  choice: 苦い水
  rationale: 直訳的には「苦みの水」。ヘブライ語では「水」が複数形だが、日本語では物質として単数的に「水」とするのが自然である。
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: 呪いをもたらす
  rationale: אררの分詞を、水そのものが呪われているというより、儀式において呪いを実現・媒介する働きを表すものとして訳した。二度の反復も保持した。
- source_word: וּבָאוּ בָהּ
  choice: 彼女の内に入り
  rationale: בואに前置詞בを伴う表現が、女性の体内への進入を示すため、「内に入る」とした。
- source_word: לְמָרִים
  choice: 苦みとなる
  rationale: לְを結果・帰結として捉えつつ、「苦み」という原語の比喩的で曖昧な表現を保ち、具体的な症状や「苦しみ」へ限定しなかった。
theological_decisions:
- issue: この水と呪いとの関係
  choice: 「呪いをもたらす水」
  alternative: 「呪われた水」
  rationale: 分詞形は、この水が有罪の場合に呪いを媒介・実現する役割を持つことを示し得る。「呪われた水」では水自体が呪詛の対象であるかのように読まれるため避けた。
- issue: לְמָרִיםが示す結果の性質
  choice: 「苦みとなる」
  alternative: 「苦しみをもたらす」または「苦く作用する」
  rationale: 身体的な害を含み得る文脈を認めつつも、原文が具体的な症状をここでは明示していないため、「苦み」という表現上の緊張と曖昧さを残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。儀式文としての反復を残しつつ、古風すぎる言い回しは避けた。「苦みとなる」はやや異質な表現だが、原文の反復と意味の曖昧さを保持するため意図的に採用した。
