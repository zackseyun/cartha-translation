id: NUM.5.8
reference: Numbers 5:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: ja
  text: 'しかし、その人に、罪過に対する賠償を返すべき近親者[a]がいないなら、主に返されるその賠償[b]は祭司のものとなる。それに加えて、その人のために贖いを行う贖罪の雄羊も祭司のものとなる。


    [a] 「近親者」に当たるヘブライ語は、親族の財産の買い戻しや賠償の受領などについて法的責任を負う家族を指す。「贖いをする者」または「近親の保護者」とも訳せる。


    [b] ここで「賠償」と訳したヘブライ語は、罪過に対して返される賠償を指す。後半で雄羊が別に挙げられているため、ここでは雄羊そのものを指してはいない。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近親者」に当たるヘブライ語は、親族の財産の買い戻しや賠償の受領などについて法的責任を負う家族を指す。「贖いをする者」または「近親の保護者」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「賠償」と訳したヘブライ語は、罪過に対して返される賠償を指す。後半で雄羊が別に挙げられているため、ここでは雄羊そのものを指してはいない。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: 近親者
  rationale: 親族として買い戻しや償いの受領に法的責任を負う者を指す。本文では簡潔で自然な「近親者」とし、専門的な法的含意を脚注で補った。
- source_word: הָאָשָׁם
  choice: 罪の償い
  rationale: この文脈では祭儀上の雄羊ではなく、罪過に対して返される賠償を指す。罪との結びつきを保ちながら、後述の雄羊と区別した。
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: 返されるその罪の償い
  rationale: שוב の受動分詞が示す返還の動作を明示し、法的な賠償の性格を保った。
- source_word: לַיהוָה
  choice: 主に
  rationale: 神名四文字を日本語聖書で通用する「主」として表し、この償いが主に帰属することを示した。
- source_word: לַכֹּהֵן
  choice: 祭司のものとなる
  rationale: ヘブライ語の簡潔な帰属表現を、日本語で法的な帰属先が明瞭になるよう述語を補って訳した。
- source_word: מִלְּבַד
  choice: とは別である
  rationale: 償いと雄羊が同一ではなく、雄羊がそれに加えて必要であることを明確にした。
- source_word: אֵיל הַכִּפֻּרִים
  choice: 贖罪の雄羊
  rationale: 雄羊の祭儀的機能を、簡潔で通用する日本語で表した。
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: その人のために贖いを行う
  rationale: 雄羊が贖いの手段であり、贖いが違反者のためになされることを自然な日本語で示した。ヘブライ語で暗黙の祭司を本文中にあえて補わなかった。
- source_word: לָאִישׁ
  choice: その人
  rationale: 文脈上の個人を指すが、日本語では「その男」より「その人」が自然であり、原文の指示対象を損なわない。
theological_decisions:
- issue: 賠償と犠牲の関係
  choice: 返される償いと贖罪の雄羊を別個のものとして訳す。
  alternative: 「罪過の供え物」を一つの祭儀的供え物として読む。
  rationale: מִלְּבַד（「別に／加えて」）により、賠償と雄羊が区別されている。民事的な償いと祭儀的な贖いを混同しないためである。
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語として広く通用する伝統的表記を用いた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法的・祭儀的な区別を保った。「近親者」の専門的含意と「罪の償い」の語義は脚注で補い、本文は朗読にも適する簡潔で格調ある文体とした。
