source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: ja
  text: 祭司が女にその水を飲ませたとき[a]、もし女が身を汚し、夫に対して不実を働いていたなら、呪いをもたらす水が女の内に入って苦しみとなり[c]、腹は膨れ、腿は衰える[b]。その女は民の間で呪いとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭司が女にその水を飲ませると」。ここから条件と結果が述べられる。
    reason: grammatical_alternative
  - marker: b
    text: 直訳は「腿が落ちる」。この表現は生殖に関わる部位への重い身体的障害を婉曲にいう可能性があるが、正確な意味は不明である。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「苦いものとなり」。ヘブライ語の句は難しく、水の性質をいうのか、その苦い結果・苦しみをいうのかは確定できない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: 祭司が女にその水を飲ませたとき
  rationale: ヒフィル形の使役の意味を「飲ませる」で保ち、後続する条件と結果につながる時間節として自然な日本語にした。主語は文脈上の祭司である。
- source_word: נִטְמְאָה
  choice: 身を汚し
  rationale: 道徳的・儀礼的な汚れの双方を含み得る語であり、ここでは再帰的な含意を自然に表した。
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: 夫に背いて不実を働いていた
  rationale: 同根語を重ねた強調を「背いて不実を働く」とし、夫に対する信義の破壊を表した。
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: 呪いをもたらす水
  rationale: 分詞の作用的な意味を、明瞭で自然な表現にした。
- source_word: וּבָאוּ בָהּ ... לְמָרִים
  choice: 女の内に入って苦い作用を及ぼし
  rationale: 水が体内に入るという像を保ちつつ、難解な לְמָרִים を結果・作用として訳した。別解は脚注に示した。
- source_word: וְצָבְתָה בִטְנָהּ
  choice: 腹は膨れ
  rationale: בטן を過度に「子宮」と限定せず、直接的な「腹」とした。
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: 腿は衰える
  rationale: 直訳は「腿が落ちる」だが日本語では意味が不明瞭なため、身体の重い衰弱を示す表現とし、正確な意味の不確かさを脚注で明示した。
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: その女は民の間で呪いの的となる
  rationale: 女性自身が共同体の中で呪いの実例・対象となる意味を、自然な日本語で表した。
theological_decisions:
- issue: 試練の結果として描かれる身体的障害を、特定の医学的・生殖的現象に限定するか
  choice: 「腹は膨れ、腿は衰える」とし、具体的な身体語を保ちながら断定を避ける
  alternative: 「腹が膨れて流産する」または「生殖器が萎える」
  rationale: ヘブライ語は具体的でありながら婉曲的でもあり、正確な生理的意味は確定できない。流産や不妊など一つの解釈を本文に持ち込まず、原文の緊張と不確かさを保持した。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で厳粛な文体。「女」は律法本文の叙述に合わせて用い、「女性」より簡潔な聖書文体とした。難解な身体表現は本文で過度に具体化せず、脚注で原文と不確かさを示した。
