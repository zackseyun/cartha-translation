    rationale: この句は水の性質（苦い水）をいうのか、その結果（苦しみ・苦味）をいうのかが議論される。「作用」は原文にない抽象的な説明語であるため、本文の断定を抑え、脚注で代替的理解を示す必要がある。
  - severity: low
    issue: 「呪いの的となる」は自然ではあるが、「女が呪いとなる」という原文の表現を少し言い換えすぎている。
    rationale: אָלה は共同体で用いられる呪いの例・定型とも関わる。「民の間で呪いとなる」は、過度に解釈せず原文の述語構造を保つ。
  - severity: low
    issue: 脚注bの「生殖器官に及ぶ重い身体的障害」は可能な解釈をやや強く述べている。
    rationale: 「腿」は生殖に関わる婉曲表現であり得るが、正確な生理的指示対象は確定できない。可能性として留める表現が望ましい。
