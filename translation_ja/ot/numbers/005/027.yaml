revisions:
- from: 祭司が女にその水を飲ませたとき[a]、もし女が身を汚し、夫に背いて不実を働いていたなら、呪いをもたらす水が女の内に入って苦い作用を及ぼし、腹は膨れ、腿は衰える[b]。こうして、その女は民の間で呪いの的となる。
  to: 祭司が女にその水を飲ませたとき[a]、もし女が身を汚し、夫に対して不実を働いていたなら、呪いをもたらす水が女の内に入って苦しみとなり[c]、腹は膨れ、腿は衰える[b]。その女は民の間で呪いとなる。
  rationale: 難解な לְמָרִים を「苦い作用」という不自然で説明的な語に固定せず、本文では文脈に即した「苦しみとなり」とし、脚注で水の性質と結果の双方の可能性を保持した。また、結語を原文に近い「呪いとなる」とし、腿に関する脚注の医学的含意を必要以上に断定しないよう整えた。
