base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: ja
  text: 祭司は女の手から、嫉妬に関する穀物のささげ物を受け取り、その穀物のささげ物をヤハウェの前で揺り動かし、祭壇の近くへ持って行く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: 受け取り
  rationale: 儀式の手順を続ける waw＋完了形。直訳的な「取る」より、女の手から祭司が受領する場面を自然な日本語で表す。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀を執行する職務者を表す標準的な訳語。
- source_word: מִיַּד הָאִשָּׁה
  choice: 女の手から
  rationale: ヘブライ語の身体的・直接的な受け渡しの表現を保持する。
- source_word: מִנְחַת הַקְּנָאֹת
  choice: 嫉妬の穀物のささげ物
  rationale: מִנְחָה の穀物供儀としての意味と、קְנָאֹת の属格的な儀礼名称をともに明示する。「嫉妬」は文脈上、夫の嫉妬に関わる儀式を指す。
- source_word: וְהֵנִיף
  choice: 揺り動かし
  rationale: נוף のヒフィルは供え物を儀礼的に揺り動かす行為を指すため、その動作を明瞭に訳す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の御前で行う祭儀という空間的・宗教的表現を保ち、固有名 יהוה はヤハウェとする。
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: 祭壇へ近づける
  rationale: קרב のヒフィルが持つ「近くへ持って行く」という祭儀的ニュアンスを保持する。目的語は直前の穀物のささげ物。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを可視化し、一般名詞・称号である「主」と区別する。
translation_notes:
  register: 現代の標準的な日本語による、簡潔で威厳ある祭儀規定の文体。「女」は文脈上の成人女性を指し、原文の簡潔さを保つ。「揺り動かす」「祭壇へ近づける」により祭儀動作を具体的に示した。
