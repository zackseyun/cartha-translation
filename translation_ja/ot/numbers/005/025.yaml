  source_fidelity: ヘブライ語の手順（祭司が女の手から供え物を受け取り、それをヤハウェの前で揺り動かし、祭壇へ近づける）および各動詞の目的語は、改訂文でも保持されている。「嫉妬に関する」は מִנְחַת הַקְּנָאֹת という儀礼名の属格関係を、過度に解釈せず自然な日本語で表す。
