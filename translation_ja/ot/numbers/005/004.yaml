source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: ja
  text: イスラエルの人々はそのとおりに行い、彼らを宿営の外へ出した。ヤハウェがモーセに告げたとおりに、イスラエルの人々は行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: そのとおりに行い
  rationale: עשה＋כןが直前の命令に従って実行することを表すため、自然な日本語で服従の意味を保った。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの息子たち」だが、ここでは民全体を指す慣用的・集合的表現なので、現代日本語として明瞭な表現にした。
- source_word: וַיְשַׁלְּחוּ אוֹתָם אֶל מִחוּץ לַמַּחֲנֶה
  choice: 彼らを宿営の外へ出した
  rationale: שׁלחはこの文脈では対象者を宿営から退出させることを意味する。「外へ出した」により移動と排除の両方を簡潔に示した。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 告げたとおりに
  rationale: 神が先にモーセへ語った命令と、イスラエルの行動との一致を自然に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: כֵּן עָשׂוּ
  choice: 行った
  rationale: 節末の反復を残し、命令への服従を強調するヘブライ語本文の構造を保った。直前の「とおりに」がכןの意味を担う。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、称号「主」ではなく神名を音写し、本文上の区別を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宿営」は民数記の荒野の共同体という文脈に適した語として用いた。原文の冒頭と末尾にある服従の反復を省略せず、同時に日本語として過度に硬くならないよう整えた。
