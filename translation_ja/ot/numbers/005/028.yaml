source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: ja
  text: しかし、その女が身を汚しておらず、清いなら、潔白と認められ、子を宿す。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「種をまかれる」。妊娠して子を得ることを表すヘブライ語の言い回し。
    reason: 原文の受動的な生殖に関する慣用表現を示すため。
lexical_decisions:
- source_word: וְאִם
  choice: しかし、……なら
  rationale: 前節の有罪の場合と対照をなす条件節であるため、接続の対照性を自然な現代日本語で示した。
- source_word: לֹא נִטְמְאָה הָאִשָּׁה
  choice: その女が身を汚しておらず
  rationale: ニファル形は「汚れた／汚された」とも訳せるが、この文脈では性的・道徳的な汚れを指す。「身を汚す」は当人の行為を表す自然な日本語で、受動態への限定を避ける。
- source_word: וּטְהֹרָה הִוא
  choice: 清い
  rationale: טָהוֹר の儀礼的・道徳的な清さを簡潔に表し、「潔白」として法廷的意味だけに狭めない。
- source_word: וְנִקְּתָה
  choice: 罪を免れ
  rationale: נקה のニファル形が表す「免れる、罰を受けない」を文脈に即して訳した。「無罪と認められ」は司法的に限定しすぎ、「害を受けない」は語の弁明・免責の側面を弱める。
- source_word: וְנִזְרְעָה זָרַע
  choice: 子を宿すようになる
  rationale: 直訳では「種をもって種をまかれる」という受動的な生殖表現であり、妊娠・子孫を得ることを指す。「子を宿す」は受胎の意味を自然に伝え、「産む」として出産までを明示しない。「ようになる」は、この結果が生殖能力の保持・回復を含み得ることを表す。
theological_decisions:
- issue: 潔白な女に約束される結果の性質
  choice: 罪を免れ、子を宿すようになる
  alternative: 無罪とされ、必ず妊娠する／妊娠できるようになる
  rationale: 前半は審判から免れることを示し、後半のヘブライ語慣用句は受胎・生殖を表す。「必ず」や「できる」を補わず、個別の即時妊娠か一般的な生殖能力かという含みを過度に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その女」は法規文脈の既出人物を指す。節末に脚注標識を置き、訳文の流れを妨げずに原文の比喩を説明した。
