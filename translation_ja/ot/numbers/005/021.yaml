  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: ja
  text: 祭司は女に呪いを伴う誓いを立てさせ[a]、女にこう言う。「ヤハウェがあなたの腿を衰えさせ[b]、あなたの腹を膨れさせる[c]とき、あなたを、あなたの民の間で呪いと誓いの文句に引き合いに出される者とされるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「呪いの誓い」。呪いを含む誓約・宣誓を指す。
    reason: lexical_alternative
  - marker: b
    text: 「腿」は字義どおりの訳。この難解な表現は、その部分が萎えたり崩れたりすることを指すとも、生殖器に関する婉曲表現とも考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「腹」に当たる語は「胎」と訳されることもある。ここで述べられる身体的または生殖的な作用が具体的に何かは確定できない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: 誓いを立てさせ
  rationale: שׁבעのヒフィル形が表す使役の意味と、祭司が女を誓約の下に置くという儀礼的・法的な働きを、明瞭な現代日本語で表した。
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: 呪いを伴う誓い
  rationale: 「誓い」と「呪い」の両要素を保ちつつ、「呪いの誓い」より意味の関係が伝わりやすい日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: 呪いや誓いの例
  rationale: 直訳的な「呪いと誓いとなる」が示す、共同体で呪いや誓いの文句を口にする際の実例として引き合いに出される意味を、簡潔で自然な日本語にした。
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: あなたの民の間で
  rationale: 共同体の内部における公的・社会的な意味を自然に表した。
- source_word: בְּתֵת
  choice: …させるとき
  rationale: 前置詞בを伴う不定詞構文を、この文脈の時・状況を表す表現として訳した。
- source_word: יְרֵכֵךְ
  choice: あなたの腿
  rationale: יָרֵךְの基本的な身体語義を本文に残し、生殖器官を指す婉曲表現である可能性は注で示した。
- source_word: נֹפֶלֶת
  choice: 衰えさせ
  rationale: 語根נפלの「落ちる」という像を背景に、この呪いの文脈で考えられる萎縮・衰弱を自然な日本語で表したが、特定の医学的症状には限定しなかった。
- source_word: בִּטְנֵךְ
  choice: あなたの腹
  rationale: בֶּטֶןは腹部にも胎にもなり得るため、本文では意味を狭めない一般的な身体語を用いた。
- source_word: צָבָה
  choice: 膨れさせる
  rationale: 膨張・膨満を表す語として、簡潔で分かりやすい表現を選んだ。
theological_decisions:
- issue: 身体に及ぶ呪いをどこまで生殖上の具体的症状として訳すか
  choice: 本文では「腿を衰えさせ、腹を膨れさせる」とし、ヘブライ語の身体的な像と不確定性を保つ。
  alternative: 「流産させる」「子宮を萎えさせる」など、特定の生殖上の結果を本文に明記する。
  rationale: このヘブライ語表現の正確な医学的・生殖的意味には議論がある。本文で流産、不妊、子宮脱などの一解釈に限定せず、その可能性を注で知らせることで、原文の曖昧さと神学的緊張を保持した。
- issue: 女が共同体の中で「呪いと誓い」になるという表現の理解
  choice: 「呪いや誓いの例とされる」と訳す。
  alternative: 字義どおり「呪いと誓いとされる」と訳す。
  rationale: 女自身が抽象的な呪いや誓いに変化するという意味ではなく、後に人々が呪いや誓いを述べる際に引き合いに出す実例となるという慣用的な力を表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀的な宣告にふさわしい厳粛さを保った。神名は「ヤハウェ」とし、難解な身体表現は過度に医学化せず、本文と注を組み合わせて原文の曖昧さを伝えた。
