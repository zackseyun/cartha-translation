  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう語った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 接続形を伴う דבר は新しい神の発言単位を導入する。日本語では、後続する発言内容を自然に予告する「告げた」が簡潔で格調も保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語表記で音写する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: אֶל は発話の相手を示すため、現代日本語では助詞「に」で自然に表せる。מֹשֶׁה は慣用表記「モーセ」とする。
- source_word: לֵאמֹר
  choice: （「告げた」に含める）
  rationale: 逐語的には「言って」であるが、日本語で「告げて言った」とすると冗長になる。後続の直接話法を導く機能を「告げた」に統合した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を明記しているため、称号「主」に代えず音写する。「エホバ」よりもヘブライ語の推定発音に近い一般的な学術表記を採用した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。定型句を不自然に逐語訳せず、神の発言を導入する荘重さを保った。
