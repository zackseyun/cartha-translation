id: NUM.5.18
reference: Numbers 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: ja
  text: 祭司はその女をヤハウェの前に立たせ、女の髪をほどき[a]、その両手に記念の穀物のささげ物を載せる。これはねたみの穀物のささげ物である。祭司の手には、呪いをもたらす苦い水がある[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女の頭をあらわにし」。ヘブライ語の表現は、髪をほどいて垂らすことを指すとも考えられます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その呪いをもたらす苦い水」。この分詞は、水が呪いをもたらす、または呪いを担うことを表すと理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: 立たせ
  rationale: עמדのヒフィル形で、儀式の場に立たせることを表す。原文の具体的な動作を自然な日本語で保った。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の臨在の前に出る祭儀的表現であり、固有名יהוהを「ヤハウェ」とした。
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: 女の髪をほどき
  rationale: פרעと「頭」から成る表現は、ここでは結ってある髪を解いて垂らす儀礼動作を指す可能性が高い。語義上の幅は脚注に残した。
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: その両手に…載せる
  rationale: 直訳は「彼女の手のひらの上に置く」。日本語では「両手に載せる」が具体的な姿勢を自然に伝える。
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: 覚えの穀物のささげ物
  rationale: מנחהを祭司文書の文脈に従って「穀物のささげ物」、זכרוןを「覚え」とし、神の前に覚えられるという含みを不用意に限定しない表現とした。
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: これはねたみの穀物のささげ物である
  rationale: קנאותは複数形だが抽象的な意味を持つ。「ねたみ」は夫の疑念だけでなく、関係の排他性をめぐる強い感情を表し得るため、その緊張を保持した。
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: 一方、祭司の手には…がある
  rationale: 女性がささげ物を持つのと同時に祭司が水を持つ、という付帯状況を示す。原文の単数「手」も維持した。
- source_word: מֵי הַמָּרִים
  choice: 苦い水
  rationale: ヘブライ語では「水」が複数形だが、日本語では物質名として単数的に「水」とするのが自然。「苦い」という性質はそのまま示した。
- source_word: הַמְאָרֲרִים
  choice: 呪いをもたらす
  rationale: אררの分詞を、水が呪いを実現・運搬する働きを表すものとして訳した。定冠詞を特定の「その呪い」と取る余地は脚注に示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として明示し、普通名詞・称号で置き換えなかった。
- issue: 「ねたみ」の主体と性質
  choice: 主体を補わず「ねたみ」とする
  alternative: 夫の嫉妬のささげ物／神の熱情のささげ物
  rationale: この句自体は、ねたみの主体を明示せず、קנאותも意味の幅を持つ。文脈から一方に限定せず、原文の神学的・関係的な緊張を保持した。
- issue: 水と呪いの関係
  choice: 呪いをもたらす
  alternative: その呪いをもたらす／呪いとなる
  rationale: 分詞が水の作用を表すと理解したが、特定の呪詛を指す読みも可能なので脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で格調ある文体とした。「女」は原文に即した法規的呼称。「ささげ物」は平仮名を交えて一般読者にも読みやすくし、「覚え」「ねたみ」「呪い」という反復される祭儀用語を省略せず保持した。
