  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ではיהוה（YHWH）という神の固有名。伝統的に「主」と訳される。別の音写に「エホバ」がある。
    reason: 原文が称号ではなく神の固有名を用いていることと、伝統的な訳語および代表的な別音写を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 新たな神の発言を導入する物語上の定型句。日本語では、後続する言葉を導く表現として「語られた」より「告げられた」が自然で、敬意も保てる。接続詞וַは文脈上の連続を示すが、現代日本語では明示しないほうが自然である。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神の固有名を表す四文字יהוה（YHWH）。本文では日本語聖書で広く理解される伝統的な代替表記「主」を用い、固有名であることと音写の選択肢を脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発言の相手を示す前置詞と固有名を、自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: （「告げられた」に統合）
  rationale: 直訳すれば「言って」だが、ヘブライ語の引用導入定型句である。日本語ではוַיְדַבֵּרと合わせて「告げられた」とすることで、重複を避けつつ後続の直接話法を自然に導く。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: 主[a]
  alternative: ヤハウェ／エホバ
  rationale: יהוהは称号ではなく神の固有名だが、その古代の正確な発音は確定していない。本文には日本語で伝統的かつ広く通用する「主」を置き、原文の神名と代表的な音写を脚注で示して、固有名であることを隠さない。
translation_notes:
  register: 明快な現代標準日本語。神の発言を表すため簡潔で品位のある敬語表現を用いた。ヘブライ語の定型句を逐語的に重ねず、日本語として自然な一文にした。
