  text: וְ/הִקְרִ֥יב אֹתָ֖/הּ הַ/כֹּהֵ֑ן וְ/הֶֽעֱמִדָ֖/הּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: ja
  text: 祭司はその女を連れて来て、ヤハウェ[a]の前に立たせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神名「YHWH」。伝統的には「主」と訳される。ここでは「ヤハウェ」と音写した。
    reason: 原文の四文字神名を示し、伝統的な代替表記との関係を明らかにするため。
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: その女を近くに連れて来て
  rationale: קרבのヒフィル形が持つ「近くに連れて来る」という空間的・使役的意味を保ち、文脈上の対象である女を明示した。祭儀的な「ささげる」とは訳さず、原文の意味を狭めないようにした。
- source_word: הַכֹּהֵן
  choice: 祭司は
  rationale: 祭儀・律法の文脈におけるכֹּהֵןの標準的で自然な訳語。
- source_word: וְהֶעֱמִדָהּ
  choice: 立たせる
  rationale: עמדのヒフィル形の使役的意味「立つようにさせる」を、簡潔で自然な現代日本語で表した。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 位置と臨在の双方を含み得る標準的な表現であり、「御前に」よりも平明な現代日本語とした。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く通用する伝統的な代替表記を本文に用い、原語が神名YHWHであることを脚注で明示した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: 本文では「主」、脚注で「YHWH（ヤハウェ）」と明示
  alternative: 本文で「ヤハウェ」と音写する
  rationale: 原文が称号ではなく四文字神名であることを隠さないよう脚注を付しつつ、一般の日本語読者に自然で格調ある伝統的表記を本文に採用した。神名の推定発音には不確実性があるため、それも脚注で示した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。律法文としての端正さを保ち、「その女」で直前の文脈上の指示対象を明確にした。
