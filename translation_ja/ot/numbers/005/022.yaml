source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: ja
  text: 「この呪いをもたらす水があなたの体内に入り、腹を膨れさせ、ももを衰えさせるように[a]。」女は「アーメン、アーメン」と言う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「腹を膨れさせ、ももを落とす」。このヘブライ語表現は解釈が難しく、生殖機能に及ぶ災いを婉曲に述べたものかもしれない。
    reason: 難解な慣用表現について、字義的な別訳と婉曲表現の可能性を示すため。
lexical_decisions:
- source_word: וּבָאוּ
  choice: 入るように
  rationale: 形は完了形だが、誓約と呪いの文脈では、これから効力を発する呪詛の願望的・遂行的な力を表す。「入るだろう」と単純な未来にせず、「入るように」とした。
- source_word: הַמַּיִם הַמְאָרְרִים
  choice: この呪いをもたらす水
  rationale: מְאָרְרִים は語根 ארר（呪う）に由来し、水が呪いを帯び、その効力をもたらすことを表す。「苦い水」とはせず、語義を明示した。ヘブライ語の複数形は、日本語では自然な集合名詞の単数形「水」で表した。
- source_word: בְּמֵעַיִךְ
  choice: あなたの内臓に
  rationale: מֵעֶה は体の内部、内臓を指す。「腹の中」より身体的な具体性を保ちつつ、過度に医学的な表現を避けた。
- source_word: לַצְבּוֹת בֶּטֶן
  choice: 腹を膨れさせ
  rationale: בֶּטֶן の基本的な身体語「腹」を保ち、結果を表す不定詞を自然な使役表現にした。「子宮」と限定せず、原文の幅を残した。
- source_word: וְלַנְפִּל יָרֵךְ
  choice: 腿を衰えさせる
  rationale: נפל の字義は「落ちる」だが、この定型句の正確な身体的意味は不明瞭である。不自然な逐語訳を避けつつ、יָרֵךְ の婉曲性と身体の損傷を示す曖昧さを保った。
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: 女は……と言う
  rationale: 儀式で定められた応答を簡潔に表す。日本語では文脈上、義務・規定の意味が明らかなため、「言わなければならない」と補わず原文に近くした。
- source_word: אָמֵן אָמֵן
  choice: アーメン、アーメン
  rationale: 二度繰り返される厳粛な同意の応答を、定着した典礼語のまま保持した。
theological_decisions:
- issue: 呪いによって生じる身体的影響の特定
  choice: 「腹を膨れさせ、腿を衰えさせる」とし、具体的な医学的結果を特定しない。
  alternative: 「流産させる」「不妊にする」「生殖器を萎えさせる」などと明示する。
  rationale: このヘブライ語句は難解で、生殖に関わる災いを婉曲に表している可能性が高いが、流産、不妊、脱出など特定の症状を一義的に示すとは断定できない。原文の神学的・身体的な緊張と曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、誓約・呪詛の厳粛さを保った。「腿」は「もも」と平仮名にせず漢字表記として儀礼文の格調を保ち、「アーメン」の反復もそのまま残した。
