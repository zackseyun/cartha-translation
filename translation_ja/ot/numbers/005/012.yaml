id: NUM.5.12
reference: Numbers 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֥ישׁ אִישׁ֙ כִּֽי תִשְׂטֶ֣ה אִשְׁתּ֔/וֹ וּ/מָעֲלָ֥ה ב֖/וֹ מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: ja
  text: 「イスラエルの子ら[a]に告げて、こう言いなさい。もし、ある人の妻が道を踏み外し、夫に対して不実を働いたなら[b]、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より自然な言い方では「イスラエルの人々」。ヘブライ語では字義的に「イスラエルの息子たち」。
    reason: lexical_alternative
  - marker: b
    text: 「不実を働く」に当たるヘブライ語では、同じ語根の動詞と名詞を重ねて、信義に背く行為が強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵהֶם
  choice: 告げて、こう言いなさい
  rationale: 二つの発話動詞を保ちつつ、日本語の律法導入句として自然で明瞭な形にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を本文に保った。ここではイスラエル民族全体を指すため、自然な言い換えを脚注に示した。
- source_word: אִישׁ אִישׁ
  choice: ある人
  rationale: 反復による不定・分配の意味を、条件法文に自然な日本語で表した。
- source_word: כִּי
  choice: もし…なら
  rationale: 事例を提示する法文上の条件節として訳した。
- source_word: תִשְׂטֶה
  choice: 道を踏み外し
  rationale: 語の比喩的な「それる」意味を残し、後続句より先に行為の内容を限定しすぎないようにした。
- source_word: וּמָעֲלָה בּוֹ מָעַל
  choice: 夫に対して不実を働いた
  rationale: 同根の動詞と名詞による強調を、関係上の裏切りを表す自然で格調ある日本語にした。בּוֹ が示す被害を受ける相手も「夫に対して」と明示した。
theological_decisions:
- issue: イスラエルへの性を伴う親族的呼称
  choice: イスラエルの子ら
  alternative: イスラエルの人々／イスラエル人
  rationale: ヘブライ語の「イスラエルの息子たち」に相当する親族的表現を本文で保ちつつ、文脈上は民全体への呼びかけであることを脚注で明らかにした。
- issue: מעל の関係的・宗教的含意
  choice: 不実を働いた
  alternative: 背信行為をした／夫を裏切った
  rationale: 婚姻上の不貞を含意しながらも、この節だけで具体的行為を先取りして限定せず、語が持つ信義違反の幅を保った。
translation_notes:
  register: 現代の読者に理解できる明瞭な標準語を用いながら、律法の告知にふさわしい簡潔で品位ある調子にした。「道を踏み外す」と「不実を働く」により、原文の比喩と関係的な背信を区別して保っている。
