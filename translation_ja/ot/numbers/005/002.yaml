source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: ja
  text: イスラエルの人々に命じなさい。皮膚の病のある者[a]、身体からの漏出がある者、死体によって儀礼上汚れた者[b]を、すべて宿営の外へ出させなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「らい病人」とも訳される。ヘブライ語は祭儀法の文脈で皮膚に現れるさまざまな病変を指し、現代医学上のハンセン病に限られない。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「人（いのち）によって汚れた者」。律法では、死体に起因する祭儀上の汚れを表す慣用句である。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: 命じなさい
  rationale: モーセに向けられた単数命令形の強さを保ち、現代日本語として明瞭に表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族・契約共同体の表現を保ちつつ、自然で格調ある日本語とした。
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: 宿営の外に出させなさい
  rationale: שלח の使役的な文脈と、宿営内から外への移動を明確に表した。
- source_word: כָּל צָרוּעַ
  choice: 皮膚の疾患がある者をすべて
  rationale: צָרוּעַ は祭儀法上の重い皮膚症状を指し得るが、現代医学のハンセン病に限定されないため、診断名を特定しない表現を選んだ。
- source_word: וְכָל זָב
  choice: 漏出のある者
  rationale: 祭儀法で身体からの異常な漏出がある者を指す。原文がこの節では部位や種類を明示しないため、訳でも限定しなかった。
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: 死体によって汚れた者
  rationale: נֶפֶשׁ を伴うこの定型句は死体に起因する祭儀上の汚れを表す。日本語で意味が通るよう慣用的意味を本文に示した。
theological_decisions:
- issue: 祭儀上の汚れを表す טָמֵא の訳語
  choice: 汚れた
  alternative: 不浄になった
  rationale: ここで扱われるのは宿営の聖さに関わる祭儀上の状態であり、必ずしも道徳的罪を意味しない。「汚れた」は律法用語として簡潔で、文脈上も理解可能である。
- issue: 死体による汚れの表現
  choice: 死体によって汚れた者
  alternative: 死者のために汚れた者
  rationale: 原文の נֶפֶשׁ は字義上「人／いのち／魂」だが、この祭儀法上の句では死体を指す。接触を明記する訳も可能だが、この節自体には接触を表す動詞がないため、「によって」として原因のみを示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令文としての厳粛さを保った。「宿営」「汚れた」は民数記の祭儀法文脈に適した一貫性ある語彙である。原文が列挙する三種類の者を並列に配置し、病気・身体状態と道徳的罪を混同しない表現とした。
