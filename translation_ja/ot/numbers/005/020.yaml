id: NUM.5.20
reference: Numbers 5:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: ja
  text: しかし、もしあなたが夫のもとにありながら道をそれ、身を汚し、夫以外の男があなたと寝たのなら――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂטִית
  choice: 道をそれ
  rationale: 婚姻上の忠実さから逸脱することを表す動詞の比喩を保ちつつ、現代日本語として理解できる表現にした。
- source_word: תַּחַת אִישֵׁךְ
  choice: 夫のもとにありながら
  rationale: 直訳的な「夫の下で」は日本語では不自然で誤解を招くため、婚姻関係にあることを示すヘブライ語の慣用的含意を自然に表した。
- source_word: נִטְמֵאת
  choice: 身を汚し
  rationale: この文脈における性的かつ儀礼・法的な汚れを簡潔に表し、単なる衛生上の「不潔」とはしなかった。
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: 男があなたと寝た
  rationale: 性交を指すヘブライ語の婉曲表現を、日本語でも明瞭で品位ある婉曲表現として訳した。
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: 夫以外の
  rationale: 夫を除く別の男性であることを、簡潔で曖昧さのない日本語で示した。
theological_decisions:
- issue: 婚姻上の背反を表す比喩と、性交を表す婉曲表現の扱い
  choice: 「道をそれ」で逸脱の比喩を保ち、「男があなたと寝た」で性的意味を明らかにする
  alternative: 全体を「夫を裏切り、姦淫した」と明示する
  rationale: 原文の比喩的・婉曲的な言い方を尊重し、原文以上に法的・道徳的な用語を加えずに文脈上の意味を伝えるため。
translation_notes:
  register: 現代標準日本語。祭司の宣誓文が次節へ続く構文を長音ダッシュで示した。厳粛さを保ちながら、日常語として理解可能な語彙を用いた。
