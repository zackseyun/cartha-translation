  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神名「YHWH」（יהוה）。
    reason: 原文が称号ではなく固有の神名を用いていることを示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: וַיְדַבֵּרは新しい神の発言単位を導入する定型表現。「語った」も可能だが、後続する託宣への導入として、現代日本語では「告げた」が自然で明確。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字יהוהを、日本語聖書で広く定着した敬称「主」で本文に表し、原文が固有の神名であることは脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: אֶלは発話の相手を示し、日本語では助詞「に」が自然。מֹשֶׁהは慣用表記「モーセ」とする。
- source_word: לֵאמֹר
  choice: 告げた（発言導入に統合）
  rationale: 直訳では「言って」だが、ヘブライ語の定型的な発言導入であり、日本語では「告げた。」と統合することで、次節以下に発言内容が続くことを自然に示せる。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主（脚注で「原文は神名YHWH」）
  alternative: ヤハウェ
  rationale: יהוהが称号ではなく固有の神名であることを脚注で保持しつつ、本文は明瞭で格調ある日本語の慣用表現とした。母音を含む発音の再構成には不確実性があるため、脚注では子音表記YHWHを示す。
translation_notes:
  register: 明快な現代標準日本語。ヘブライ語の「語って、言った」という重複的な定型句は、日本語として自然な一文「告げた」にまとめた。
