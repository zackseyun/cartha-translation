  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: ja
  text: 祭司はその穀物のささげ物から、その記念の分を一握り取り、祭壇の上で焼いて煙にする。その後、その女にその水[a]を飲ませる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その苦い水」。前後の文脈ではこの水がそのように呼ばれているが、この節自体には単に「その水」とある。
    reason: 文脈上の呼称を参照として示しつつ、本節のヘブライ語本文に「苦い」という語がないことを明示するため。
lexical_decisions:
- source_word: וְקָמַץ
  choice: 一握り取り
  rationale: 祭儀の文脈でקמץは、ささげ物から一握りの分を取る行為を指す。日本語として自然であり、儀礼上の具体的な動作も保つ。
- source_word: מִן הַמִּנְחָה
  choice: 穀物のささげ物から
  rationale: 祭司文書の祭儀的文脈におけるמִנְחָהは穀物のささげ物を指すため、単なる「ささげ物」より明確に訳した。
- source_word: אֶת אַזְכָּרָתָהּ
  choice: 記念としてささげる分
  rationale: אַזְכָּרָהは穀物のささげ物のうち祭壇で焼く部分を指す。「記念の分」という硬い直訳を避けつつ、記念という語義と部分を示す意味を保った。女性単数接尾辞は穀物のささげ物を受ける。
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: 祭壇の上で焼いて煙にする
  rationale: 祭儀用法のהקטירが、祭壇で焼いて煙を立ち上らせる行為を表すことを明示した。מִזְבֵּחָהの方向を示す語尾は、日本語では自然に「祭壇の上で」とした。
- source_word: וְאַחַר
  choice: その後
  rationale: 儀式の手順の時間的順序を簡潔かつ自然に示す。
- source_word: יַשְׁקֶה אֶת הָאִשָּׁה
  choice: 女に……飲ませる
  rationale: שׁקהのヒフィル形が持つ使役の意味を「飲ませる」で保持した。文脈で特定されている女性なので「女」とした。
- source_word: אֶת הַמָּיִם
  choice: その水
  rationale: ヘブライ語本文は形容語を伴わず、定冠詞付きで単に「水」とする。既出の水を指す日本語として「その水」と訳した。
theological_decisions:
- issue: 本文で水を「苦い水」と特定するか
  choice: 本文どおり「その水」とする
  alternative: 「苦い水」とする
  rationale: 周囲の文脈ではこの水が「苦い水」と呼ばれるが、本節のヘブライ語はהַמָּיִם（その水）とのみ記す。近接文脈の形容語を本文へ補わず、本節固有の表現を保った。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で dignified な祭儀法規の文体とした。「焼いて煙にする」により祭壇上の行為を具体的に表しつつ、専門語を増やしすぎないようにした。
