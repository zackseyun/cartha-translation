source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: ja
  text: 男も女も、宿営の外へ送り出しなさい。彼らが、わたしがそのただ中[b]に住んでいる自分たちの宿営[a]を汚さないように、彼らを送り出しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの宿営」に当たるヘブライ語は複数形で、「彼らの宿営地の数々」とも訳せる。宿営内の諸区分を指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「そのただ中」は、宿営を指すとも、宿営に属する人々を指すとも理解できる。後者なら、「わたしが彼らのただ中に住んでいる」となる。
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: 男も女も
  rationale: 「雄から雌まで」という範囲表現が男女双方を包含することを、現代日本語で自然かつ簡潔に示す。
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: 送り出しなさい／彼らを送り出しなさい
  rationale: שלח のピエル形が反復される原文を、日本語でも同じ動詞の反復によって保つ。「追放する」ほど処罰的な含みは加えない。
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: 宿営の境界外への移動を、簡潔で自然な日本語にした。
- source_word: יְטַמְּאוּ
  choice: 汚す
  rationale: 祭儀的な汚れを表す טמא の意味を保ちつつ、文脈上理解しやすい語を選んだ。単なる衛生上の「汚染」に限定しない。
- source_word: מַחֲנֵיהֶם
  choice: 彼らの宿営
  rationale: 日本語では数を明示せず自然に表現し、ヘブライ語の複数形は脚注で示した。これは宿営の諸区分を指す可能性がある。
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: わたしがそのただ中に住んでいる
  rationale: 神が宿営または民のただ中に臨在するという solemn な表現を保ち、「その」によって指示対象を過度に限定しないようにした。
theological_decisions:
- issue: בְּתוֹכָם（彼ら／それらのただ中に）の指示対象
  choice: 本文では「わたしがそのただ中に住んでいる」とし、宿営を指す読みを自然に残しつつ、脚注で民を指す可能性も明示する。
  alternative: 「わたしが彼らのただ中に住んでいる」として、イスラエルの民を直接の指示対象とする。
  rationale: 男性複数接尾辞は、複数形の「宿営」またはそれに属する人々のいずれとも関連づけ得るため、神の臨在の対象を本文だけで一方に決めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の反復と神の臨在を示す厳粛さを保った。「宿営」は民数記の荒野の陣営という文脈に適した語である。
