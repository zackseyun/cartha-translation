  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: ja
  text: ある男が彼女と性交し、精液を漏らし、そのことが夫の目から隠され、彼女が人目につかないまま汚れ、彼女について証人がおらず[b]、彼女が捕らえられていなかった場合には[c]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: または「彼女に不利な証人がおらず」。
    reason: alternative_reading
  - marker: c
    text: または「彼女が現場を押さえられていなかった」。これを「彼女が無理強いされていなかった」という意味に取る見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ שִׁכְבַת זֶרַע
  choice: ある男が彼女と寝て精を放った
  rationale: 性的な意味での שׁכב と、精液の放出を表す שִׁכְבַת זֶרַע の具体性を、現代日本語として明瞭かつ品位ある形で保った。
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: そのことが夫の目から隠され
  rationale: 受動の意味合いと、原文の「夫の目から」という比喩を保った。
- source_word: וְנִסְתְּרָה
  choice: 彼女が人目につかないまま
  rationale: ニファル形が持ちうる「隠された」と「身を隠した」の幅を、意図的な隠蔽と断定せず自然な日本語で表した。
- source_word: וְהִיא נִטְמָאָה
  choice: 汚れた
  rationale: 民数記5章の清浄・不浄に関する法的文脈を保ち、道徳的評価を過度に強めない表現とした。
- source_word: וְעֵד אֵין בָּהּ
  choice: 彼女について証人がおらず
  rationale: 前置詞 בָּהּ の関係・関与の意味を保ち、「彼女に不利な」とまで限定しなかった。
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: 彼女が現場を押さえられていなかった
  rationale: この法的文脈で有力な「行為を見つけられる、捕らえられる」という意味を自然な日本語で示した。別の可能性は脚注に残した。
theological_decisions:
- issue: נִטְמָאָה の清浄規定上の意味
  choice: 汚れた
  alternative: 身を汚した
  rationale: 「汚れた」は清浄・不浄のカテゴリーを保持しつつ、行為者性や道徳的非難を原文以上に加えない。
- issue: לֹא נִתְפָּשָׂה の解釈
  choice: 現場を押さえられていなかった
  alternative: 捕らえられなかった／無理強いされなかった
  rationale: 周囲の「夫に知られない」「証人がいない」という証拠不在の文脈には、発覚・現認されなかったという理解がよく合う。ただし、動詞には「捕らえる、つかむ」の意味もあり、強制を示すと取る解釈を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、法規定の連続文として末尾を「場合には、」とした。「寝る」は露骨さを避けつつ性的意味が明確になるよう「精を放った」と組み合わせた。
