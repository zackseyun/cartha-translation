base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: ja
  text: 祭司は土の器[b]に聖なる水[a]を取り、幕屋の床[c]にあるちりを少し取って、その水に入れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖別された水」。ヘブライ語は、儀式のために聖なるものとして取り分けられた水を意味する。
    reason: lexical_alternative
  - marker: b
    text: または「粘土の器」または「焼き物の器」。
    reason: lexical_alternative
  - marker: c
    text: または「幕屋の地面」。ヘブライ語は「地面」とも「床」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: 聖なる水
  rationale: 形容詞קְדֹשִׁיםの「聖なる、聖別された」という意味を直接表し、儀式のために取り分けられた水であることを示す。「聖水」は後代の教会用語との混同を招きうるため避けた。
- source_word: בִּכְלִי חָרֶשׂ
  choice: 土器に
  rationale: כְּלִיは容器、חָרֶשׂは粘土製の焼き物を指すため、現代日本語で簡潔かつ自然な「土器」とした。前置詞בְּは、水をその容器に入れて用いる意味として「に」と訳した。
- source_word: הֶעָפָר
  choice: ちり
  rationale: עָפָרはちり、乾いた土、細かな土を意味する。儀礼的な文脈に合い、原語の伝統的な像を保つ「ちり」を採用した。
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: 幕屋の床に
  rationale: קַרְקַעは地面または床面を指す。幕屋内部の表面という文脈では「床」が自然だが、「地面」の可能性も脚注に残した。מִשְׁכָּןは祭儀的文脈で定着した「幕屋」とした。
- source_word: מִן הֶעָפָר
  choice: ちりを少し
  rationale: מִןの部分を表す用法を日本語で明示し、ちりの全部ではなく一部を取ることを自然に表した。
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: 入れる。そして、…取り、…入れる
  rationale: 一連の動詞は儀式の規定として命令的・手順的な働きをする。日本語では規定文に自然な非過去形を用い、最初の「取る」は文脈上の動作を明確にするため「水を入れる」と表現した。
- source_word: הַמָּיִם
  choice: その水
  rationale: 先に述べた聖なる水を指す定冠詞付きの語なので、照応を明確にする「その水」とした。
