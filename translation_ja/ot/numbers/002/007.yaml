base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: ja
  text: ゼブルン部族。ゼブルンの子らの指導者[a]は、ヘロンの子エリアブ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ゼブルンの子らのための指導者」。ヘブライ語の前置詞は、この部族行政上の定型句で、互いに近い複数の関係を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: 部族
  rationale: 民数記の人口調査と宿営配置の文脈では、文字どおりの「杖」ではなく、イスラエルの部族単位を指すため。
- source_word: זְבוּלֻן
  choice: ゼブルン
  rationale: 部族名・人名として、現代日本語の聖書で通用する形に音写した。
- source_word: וְנָשִׂיא
  choice: また、…の指導者
  rationale: נָשִׂיא はこの行政的文脈で部族の公認の長を指す。「君主」などの王政的な含みを避け、明瞭な現代語の「指導者」とした。接続詞 וְ は「また」で表した。
- source_word: לִבְנֵי זְבוּלֻן
  choice: ゼブルンの子らの
  rationale: בְּנֵי の「子ら」という部族的表現を保持し、前置詞 לְ は所属・関係を示す「の」とした。その機能には「…のための」という近接した解釈の余地もあるため、脚注に残した。
- source_word: אֱלִיאָב
  choice: エリアブ
  rationale: 固有名詞として音写した。
- source_word: בֶּן חֵלֹן
  choice: ヘロンの子
  rationale: 標準的な父称表現として、自然かつ原文に即して訳した。
