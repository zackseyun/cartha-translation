source:
  edition: WLC
  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: ja
  text: 次に、会見の天幕が、レビ人の宿営とともに、諸宿営の中央を進む。彼らは宿営するときと同じように出発する。各自、それぞれの旗印に従い、自分の位置で進む。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַע
  choice: 次に……進む／出発し
  rationale: 宿営をたたんで移動を始めることを表す語。節前半では隊列が進むこと、後半では出発することが自然に伝わるよう文脈に応じて訳し分けた。接続詞は行進順序の進展を示す「次に」とした。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 「天幕」という具体的な施設と、そこで神と会うという名称の意味を保つ、明瞭で伝統的な表現。
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: レビ人の宿営
  rationale: ヘブライ語の連語を素直に反映し、レビ人の集団とその宿営を示した。
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: 諸宿営の中央
  rationale: בְּתוֹךְ の空間的な中心性を明示し、レビ人の宿営と会見の天幕が他の部隊の間の中央を進む配置を表した。
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: 彼らは宿営したとおりに出発し
  rationale: 宿営時の配置と行進時の配置が対応するという並行関係を、簡潔で自然な日本語にした。
- source_word: אִישׁ
  choice: それぞれ
  rationale: 単数男性形だが、ここでは各人または各部隊を配分的に指すため、性を不必要に限定しない「それぞれ」とした。
- source_word: עַל יָדוֹ
  choice: 自分の持ち場
  rationale: 直訳的には「自分の手／側に」だが、この行軍の文脈では割り当てられた位置を表す慣用句と理解し、「持ち場」とした。
- source_word: לְדִגְלֵיהֶם
  choice: それぞれの旗印に従って
  rationale: דֶּגֶל は部隊を識別し編成する旗・標識を指す。「旗印」は視覚的意味を保ち、「に従って」で編成上の基準であることを示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある叙述体とした。「会見の天幕」「宿営」「旗印」は民数記の祭儀的・隊列的背景を保つ語として用いた。前半の名詞列は、会見の天幕とレビ人の宿営が一体となって中央を進む関係が自然に伝わるよう「とともに」で補った。
