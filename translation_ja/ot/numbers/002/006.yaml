  text: その部隊、すなわちその登録者は、五万四千四百人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは軍勢を指し得るが、民数記1—2章では宿営内で編成された各部族の集団を表すため、現代日本語で自然かつ軍事的編成の含みを保つ「部隊」とした。3人称男性単数接尾辞は文脈上、直前の部族に対応する「その」で表した。
- source_word: וּפְקֻדָיו
  choice: すなわち登録された者
  rationale: פקדに由来し、人口調査で数えられ、名簿に登録された者たちを指す。「登録された者」は調査・登録の意味を保つ。前の「部隊」と別集団を加算するのではなく、その人数を説明する同格と理解し、二つ目の接続辞וּは日本語で説明を導く「すなわち」とした。
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万四千四百人
  rationale: 数量を正確に保ち、現代日本語の通常の数え方に整えた。人数なので助数詞「人」を添えた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。ヘブライ語の二つの接続辞を機械的に「そして……そして」とせず、同格関係が伝わる自然な構文にした。節単独でも日本語として成立するよう、名詞句に「であった」を補った。
