  text: また、その部隊の登録者は、四万六千五百人である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: その部隊
  rationale: 民数記の人口調査と宿営配置の文脈で、組織された部族の集団を指す。「軍勢」ほど戦闘を強調せず、現代日本語で自然な「部隊」とした。接尾代名詞は「その」で表した。
- source_word: פְקֻדָיו
  choice: その部隊のうち登録された者
  rationale: פקדの人口調査上の意味を踏まえ、数えられて名簿に入った者を「登録された者」とした。「のうち」により、この人数が当該部隊に属する登録者の総数であることを自然に示した。
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万六千五百人
  rationale: ヘブライ語の数詞を現代日本語の標準的な数の表し方に改め、人数であることを「人」で明示した。
