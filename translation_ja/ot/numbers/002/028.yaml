  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: ja
  text: その部隊[a]、すなわちその登録者[b]は、四万一千五百人である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軍勢」または「編成された集団」とも訳せる。ヘブライ語は、人口調査に基づいて宿営内に編成された軍事的集団を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼らの登録された者たち」。すなわち、数えられ、召集された者たち。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは宿営配置と人口調査の文脈で、軍務に就く者から成る組織的な集団を指す。「部隊」は軍事的含意と編成された集団という意味を簡潔に保つ。接尾辞の三人称男性単数は、直前の部族ないしその代表者を受けるものとして「その」とした。
- source_word: וּפְקֻדֵיהֶם
  choice: すなわち彼らのうち登録された者は
  rationale: פקדに由来するこの人口調査の定型表現は、数えられ、召集名簿に登録された者たちを表す。二つのוはここで同じ集団を言い換えて示す働きと理解し、自然な日本語として「すなわち」で関係を明示した。「者」は補ったが、「男子」とまでは本文に明示されないため避けた。
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万一千五百人
  rationale: ヘブライ語の数詞を現代日本語の通常の桁順で表した。人数であることが文脈上明白なため助数表現「人」を用いた。
