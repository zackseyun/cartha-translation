  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: ja
  text: これらが、父祖の家ごとに数え上げられたイスラエルの子ら[a]である。部隊[c]ごとの全宿営で数え上げられた者[b]は、六十万三千五百五十人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。直訳「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 「数え上げられた者」は、「登録された者」とも、文脈上「登録された男子」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「隊列ごとに」「軍団ごとに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: 登録された者
  rationale: פקד のこの形は、民数記1―2章の文脈では軍務に就くため人口調査で数えられ、名簿に載せられた者を指す。「登録された者」は単なる計数以上の含意を自然に表す。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の家族的・契約的表現を保つため直訳調を採用した。現代語としては「イスラエル人」も可能なので脚注に示す。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: 父系の氏族・家系単位を表す定型句。「父祖の家」は原文の構造を保ちつつ、「ごとに」で分類基準を明確にする。
- source_word: הַמַּחֲנֹת
  choice: 宿営
  rationale: 幕屋の周囲に配置された部族別の陣営を指す。「宿営」は軍事的配置と滞在地の双方を過度に限定せず表せる。
- source_word: לְצִבְאֹתָם
  choice: その部隊別に
  rationale: צבאות はここで軍務に備えた組織的集団を指す。「部隊」は秩序ある編成を示しつつ、実戦中であるとの意味を加えない。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 六十万三千五百五十人
  rationale: ヘブライ語の総数603,550を、日本語で自然かつ荘重に漢数字で表した。文脈上、人数なので助数詞「人」を補った。
theological_decisions:
- issue: 人口調査対象者の性別
  choice: 本文では「登録された者」とし、総数には「人」を用いる
  alternative: 「登録された男子」または「数えられた男たち」
  rationale: この節自体には「男」に当たる独立した語がないため、本文では原文の形を保つ。一方、民数記1―2章の直近の文脈では対象が軍務に就く成人男子と明示されており、その理解は失われない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「イスラエルの子ら」「父祖の家」によって原文の系譜的表現を保持した。数の集計文として読みやすい二文構成とし、同じ語根 פְּקוּדֵי／פְּקוּדֵי を「登録された」で反復した。
