  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: ja
  text: その部隊[a]、すなわち登録された者たち[b]は、五万七千四百人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「軍勢」「隊」。ヘブライ語は、この宿営と人口調査の文脈で、組織された軍事的集団を表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「数えられた者たち」「召集登録された者たち」。公式の人口調査で数え上げられた人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאはこの宿営配置と人口調査の文脈では、戦闘中の「軍隊」そのものより、組織された部族の軍事的集団を指す。「部隊」は現代日本語として自然で、組織的集団という意味を保つ。接続詞וּは、節が前文から続くことを「その」という流れの中で自然に表した。
- source_word: וּפְקֻדָיו
  choice: すなわち登録された者たち
  rationale: פקדに由来するこの語は、公式の人口調査で数え上げられた者を指す。前の「部隊」を構成する人数の説明として「すなわち」を補い、「登録された者たち」とした。
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万七千四百人
  rationale: ヘブライ語の数値を正確に保ち、現代日本語の標準的な数の表し方にした。人数であることを明確にするため助数詞「人」を付した。
