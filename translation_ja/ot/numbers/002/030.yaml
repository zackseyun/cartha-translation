  text: 'and his company[a], even those numbered of them: fifty-three thousand four hundred.'
translation:
  language: ja
  text: その部隊[a]、すなわち、その部族のうち登録された者は、五万三千四百人である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「軍勢」「軍団」。ヘブライ語は、軍事的に編成された部族集団を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは軍勢・軍団・組織された集団を表し得る。民数記2章の宿営配置と人口調査の文脈では、戦闘そのものを強調しすぎず、軍事的に編成された部族集団を自然に示す「部隊」とした。
- source_word: וּפְקֻדֵיהֶם
  choice: すなわち、その部族のうち登録された者
  rationale: פקדの調査・点呼の用法を「登録された者」で表した。複数接尾辞「彼らの」を日本語で明確にするため、文脈上の指示対象を「その部族」とした。「すなわち」は並列された句が部隊の人数を詳述している関係を示す。
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万三千四百人
  rationale: ヘブライ語の数値を現代日本語の自然な語順で正確に表した。人数であることが文脈上明らかなため、助数詞「人」を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「部隊」は宿営・人口調査の組織的、軍事的背景を保ちつつ、実際の戦闘中であるかのような印象を避ける。
