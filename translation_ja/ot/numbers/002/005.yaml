id: NUM.2.5
reference: Numbers 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה יִשָּׂשכָ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י יִשָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: ja
  text: その隣に宿営するのは、イッサカル部族である。イッサカルの子ら[a]の指導者は、ツアルの子ネタヌエルである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イッサカルの子ら」。ここではイッサカルの子孫、すなわちその部族に属する人々を指し、男性だけに限定する表現ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: 宿営するのは
  rationale: 定冠詞付き分詞を、そこに配置されて宿営する集団を指す表現として自然な現代日本語にした。
- source_word: עָלָיו
  choice: その隣に
  rationale: 宿営配置の文脈では空間的な隣接を示す。「その」とすることで、接尾辞の指示対象を過度に特定せず、原文にある参照上の余地を保った。
- source_word: מַטֵּה
  choice: 部族
  rationale: ここでは「杖」ではなく、イスラエルの部族を表す用法である。
- source_word: יִשָּׂשכָר
  choice: イッサカル
  rationale: 固有名詞を日本語聖書で広く用いられる形で音写した。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 各部族を代表する長を指す。現代日本語で王族を連想させやすい「君主」や「王子」を避け、役割が明確な語を選んだ。
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: イッサカルの子ら
  rationale: 部族の祖イッサカルに属する子孫・構成員を示すヘブライ語の親族表現を保持した。
- source_word: נְתַנְאֵל
  choice: ネタヌエル
  rationale: 固有名詞を日本語で慣用的な形に音写した。
- source_word: בֶּן צוּעָר
  choice: ツアルの子
  rationale: 父子関係を示す標準的なヘブライ語の父称表現を簡潔に訳した。
theological_decisions: []
