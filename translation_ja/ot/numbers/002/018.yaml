base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: ja
  text: エフライムの宿営の旗印は、その部隊ごとに西側に置かれる。エフライム族の指導者は、アミフドの子エリシャマである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: 旗印
  rationale: 部族の宿営を識別し、そのもとに整列するしるしを指す。「旗」だけより識別標識としての意味が明確で、現代日本語として自然である。
- source_word: מַחֲנֵה
  choice: 宿営
  rationale: ここではエフライム諸部族から成る組織的な宿営陣を指す。章全体の配置文脈に適する。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָאの軍事的・組織的な秩序を保ちつつ、実戦中であるとの印象を避ける。「ごとに」によって編成単位に従う意味を表す。
- source_word: יָמָּה
  choice: 西側に
  rationale: 語源的には海の方を指すが、イスラエルの地理的方位表現では西を意味する。宿営配置の定型に合わせた。
- source_word: וְנָשִׂיא
  choice: 指導者
  rationale: 部族を代表し率いる役職を表す。王族を連想させやすい「君主」より文脈に即して明瞭である。
- source_word: לִבְנֵי אֶפְרַיִם
  choice: エフライム族
  rationale: 直訳は「エフライムの子ら」だが、ここではエフライムの子孫から成る部族の名称であるため、自然で明確な部族呼称とした。
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: アミフドの子エリシャマ
  rationale: 固有名を日本語で音写し、בֶּןを系譜表現「の子」で直接表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。宿営の軍事的・組織的性格は「部隊」で示すが、戦闘そのものを過度に強調しない。ヘブライ語本文では「西側に置く」に相当する動詞が省略された名詞文なので、日本語では文脈上必要な「置く」を補った。
