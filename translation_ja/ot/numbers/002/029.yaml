lexical_decisions:
- source_word: מַטֵּה
  choice: 部族
  rationale: 民数記の宿営配置という文脈では、杖ではなくイスラエルの部族単位を指すため。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 各部族を代表する公認の長を指す。王族を連想させうる「君」より、現代日本語で明確な表現とした。
- source_word: לִבְנֵי
  choice: ナフタリの子らの
  rationale: 「子ら」というヘブライ語の定型的な部族呼称を保持しつつ、属格的な関係を自然な日本語で示した。
- source_word: נַפְתָּלִי
  choice: ナフタリ
  rationale: 固有名を慣用的な日本語表記で音写した。
- source_word: אֲחִירַע
  choice: アヒラ
  rationale: 固有名を音写した。
- source_word: בֶּן
  choice: 子
  rationale: 父称の定型句を「エナンの子アヒラ」と直接的かつ自然に訳した。
- source_word: עֵינָן
  choice: エナン
  rationale: 固有名を音写した。
