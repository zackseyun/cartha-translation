  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ja
  text: また、ベニヤミン部族については、ベニヤミン族の指導者[a]はギデオニの子アビダンである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ベニヤミン族のための指導者」。
    reason: 前置詞 לְ は、ここでは所属・関係を表すとも、対象・利益を表すとも理解でき、両者の意味は近い。
lexical_decisions:
- source_word: מַטֵּה
  choice: 部族
  rationale: 民数記の人口調査と宿営配置の文脈では、文字どおりの「杖」ではなく、イスラエルの部族単位を指す。
- source_word: בִּנְיָמִן
  choice: ベニヤミン
  rationale: 固有名詞として、日本語聖書で広く定着している表記を用いた。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 各部族を代表する長を指す。「君主」などの王制的な含みを避けつつ、その公的な役割を明確に表す。
- source_word: לִבְנֵי בִנְיָמִן
  choice: ベニヤミン族の
  rationale: 直訳は「ベニヤミンの子らの」だが、ここでは子孫から成る部族集団を指すため、自然で明瞭な日本語として「ベニヤミン族の」とした。前置詞 לְ の関係的な用法を本文に採り、目的・利益を表す可能性は脚注に示した。
- source_word: אֲבִידָן
  choice: アビダン
  rationale: 固有名詞として、日本語で一般的な音写を用いた。
- source_word: בֶּן גִּדְעֹנִי
  choice: ギデオニの子
  rationale: ヘブライ語の標準的な父称表現を、そのまま自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある列挙調とした。冒頭は前節から続く名簿形式を保つため「また、ベニヤミン部族」とし、原文の省略を説明的な動詞で埋めすぎないようにした。後半の名詞文には日本語として必要な「である」を補った。
