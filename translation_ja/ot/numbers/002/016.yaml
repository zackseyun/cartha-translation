  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: ja
  text: ルベンの宿営に登録された者の、部隊編成による総数は、十五万一千四百五十人であった。彼らは二番目に出発する。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 数えられた者は、…合計
  rationale: פקדの受動的意味で、人口調査において登録され数えられた者を指す。כָּלは日本語では人数の提示と合わせて「合計」とすることで、総数であることを自然に表した。
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: ルベンの宿営に属する
  rationale: 前置詞לְが示す所属関係を明確にし、מחנהを民数記の配置文脈に即して「宿営」とした。
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 十五万一千四百五十人
  rationale: ヘブライ語の数詞の総計を正確に示し、日本語の聖書本文として読みやすい漢数字表記とした。文脈上、人数なので「人」を補った。
- source_word: לְצִבְאֹתָם
  choice: 部隊ごとに
  rationale: צבאותはここでは各部族の軍事的に編成された集団を指す。「軍勢に従って」より自然で、組織単位の意味も伝わる「部隊ごとに」とした。
- source_word: וּשְׁנִיִּם
  choice: 二番目に
  rationale: 直訳的には「そして二番目に」。宿営の行進順序を示す序数として自然な日本語にした。
- source_word: יִסָּעוּ
  choice: 出発する
  rationale: נסעは荒野の旅の文脈で、宿営地を離れて進み始めることを表す。「旅をする」ではなく行進開始の意味が明確な「出発する」とした。
