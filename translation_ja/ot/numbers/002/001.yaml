  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンに語って、こう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神名を表す四文字יהוה（YHWH）。「ヤハウェ」はその推定発音であり、伝統的に「主」と訳されることもある。
    reason: 神名の原語表記と、発音および訳し方の幅を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語って
  rationale: דברの神による発話を表す定型句を、現代日本語として自然に訳した。接続形の働きは文脈上の出来事の進行として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名יהוהを称号に置き換えず、一般的な学術上の推定発音に基づいて音写した。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: 二度用いられた前置詞אֶלにより、モーセとアロンの双方が発話の相手であることを明確にした。日本語では「に」を共有させるのが自然である。
- source_word: לֵאמֹר
  choice: こう言われた
  rationale: 後続する発言内容を導入する定型表現。日本語で引用へのつながりが明確になるよう「こう」を補い、神の発話にふさわしい敬意を保った。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いていることを明示し、称号への置換を避けた。ただし正確な古代発音には不確かさがあるため、その点を脚注で示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「語って、こう言われた」により、原文の二つの発話表現を保ちながら次節の引用へ自然につなげた。
