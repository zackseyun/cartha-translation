base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: ja
  text: ルベンの宿営の旗印は、部隊ごとにその旗印のもとに編成されて、南側に置かれる。ルベン族の指導者は、シェデウルの子エリツルである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: 旗印
  rationale: 部族の宿営を識別し、そのもとに整列するための標識を指す。「旗」よりも識別標識としての含みを明確にできる。
- source_word: מַחֲנֵה רְאוּבֵן
  choice: ルベンの宿営
  rationale: מַחֲנֶה はここでは部族ごとに組織された宿営を表すため、簡潔で自然な「宿営」とした。
- source_word: תֵּימָנָה
  choice: 南側には
  rationale: 方向を示す語尾を伴い、宿営全体の南側における配置を示す。日本語では「南側には」が自然である。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָא の軍事的・組織的な意味を保ちつつ、民数記1―2章の整然と編成された集団という文脈を表す。
- source_word: וְנָשִׂיא
  choice: 指導者
  rationale: ここでは王侯ではなく、任命された部族の長を意味するため、現代日本語で中立的な「指導者」とした。
- source_word: לִבְנֵי רְאוּבֵן
  choice: ルベン族
  rationale: 直訳は「ルベンの子ら」だが、ここでは祖先ルベンに属する部族共同体を指すため、明瞭な「ルベン族」とした。
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: シェデウルの子エリツル
  rationale: ヘブライ語の父称構文をそのまま自然な日本語にし、固有名は原語に即して音写した。
