lexical_decisions:
- source_word: הַחֹנִים
  choice: 宿営するのは
  rationale: חנהの分詞が表す、そこに陣を敷く者たちという継続的・配置上の意味を、現代日本語として自然に表した。
- source_word: עָלָיו
  choice: その隣に
  rationale: 宿営配置の文脈では、עַל＋代名詞接尾辞は物理的な「その上」ではなく、隣接する位置を示す。直前の部隊との位置関係を「その隣に」とした。
- source_word: מַטֵּה
  choice: 部族
  rationale: 民数記の人口調査と宿営配置では、מַטֶּהはイスラエルの部族区分を指す。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: ここでは部族の公認された長を指す。王族的含意を避け、現代の読者に明瞭な語を選んだ。
- source_word: לִבְנֵי אָשֵׁר
  choice: アシェルの子らの
  rationale: 「アシェルの子ら」というヘブライ語の系譜的・共同体的表現を保持し、נָשִׂיאとの関係を自然な属格で示した。
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: オクランの子パグイエル
  rationale: 固有名を慣用的な聖書名表記で音写し、父子関係を原文どおり示した。
