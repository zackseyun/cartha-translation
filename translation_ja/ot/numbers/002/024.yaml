  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: ja
  text: エフライムの宿営に属して登録された者[a]の、部隊別の合計は[b]、十万八千百人であった。彼らは三番目に出発する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「召集された者」とも訳せる。ヘブライ語には、人口調査で数えられたことと、軍務のために登録されたことの両方の含みがあり得る。
    reason: lexical_alternative
  - marker: b
    text: 「その軍勢ごとに」または「その隊ごとに」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 登録された者は…合計
  rationale: פקדの人口調査と軍事的召集の両方を含み得る語感を「登録された者」で表し、כָּלが総数を導く働きは日本語として自然な「合計」に反映した。
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: エフライムの宿営に属して
  rationale: 前置詞לְが示す所属関係を明確にし、מַחֲנֶהを民数記の配置文脈に合う「宿営」とした。
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 十万八千百人
  rationale: ヘブライ語の数値108,100を正確に保ち、日本語の通常の数表記と文脈上の人数単位で示した。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָאの軍勢・部隊・組織集団という意味範囲のうち、この宿営と行進順の文脈に自然な「部隊」を採用した。
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: 彼らは三番目に出発する
  rationale: שְׁלִשִׁיםを行進順を示す序数として訳し、נסעは宿営地から移動を始める意味の「出発する」とした。
