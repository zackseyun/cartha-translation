  text: וְ/עָלָ֖י/ו מַטֵּ֣ה מְנַשֶּׁ֑ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י מְנַשֶּׁ֔ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ja
  text: その隣にはマナセ族が宿営する。マナセの子らの指導者は、ペダツルの子ガムリエルである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָיו
  choice: その隣には
  rationale: 民数記2章の宿営配置という文脈では、עַלに代名詞接尾辞が付いたこの表現は上下関係ではなく空間的な隣接を示す。現代日本語で自然かつ明瞭な「その隣には」とした。
- source_word: מַטֵּה
  choice: 族
  rationale: ここでは杖ではなく、イスラエルの部族単位を指す。後続する固有名と結び「マナセ族」とすることで簡潔かつ自然に表した。
- source_word: מְנַשֶּׁה
  choice: マナセ
  rationale: 人名および部族名として、日本語聖書で広く通用する形に音写した。
- source_word: וְנָשִׂיא
  choice: 指導者
  rationale: נָשִׂיאはここで任命された部族の長を指す。「君主」などの王族的含意を避け、現代の読者に役割が明瞭な「指導者」とした。
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: マナセの子らの
  rationale: בְנֵיの系譜的表現を保ちつつ、指導者との関係を自然な属格で表した。
- source_word: גַּמְלִיאֵל
  choice: ガムリエル
  rationale: 固有名を日本語で慣用的な形に音写した。
- source_word: בֶּן
  choice: 子
  rationale: ヘブライ語の父称構文を、日本語の標準的な「何々の子」で表した。
- source_word: פְּדָהצוּר
  choice: ペダツル
  rationale: 固有名を原語の子音構成に沿い、日本語で通用する形に音写した。
