id: NUM.2.12
reference: Numbers 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: ja
  text: その隣に[a]宿営するのはシメオン部族であり、シメオンの子らの指導者は、ツリシャダイの子シェルミエルである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「そのそばに」。ヘブライ語の前置詞は、この宿営配置では近接を表すことができる。
    reason: עָלָיו の空間的意味と代名詞接尾辞の指示対象に幅があるため。
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: 宿営するのは
  rationale: 動詞 חנה の分詞が名詞的に用いられ、宿営している者たちを指す。日本語では「宿営するのは」として継続的な配置を自然に表した。
- source_word: עָלָיו
  choice: その隣に
  rationale: この宿営配置の文脈では、עַל は「上に」ではなく近接を表す。接尾辞の指示対象を日本語で不自然に限定せず、直前の部隊またはその旗印に隣接する意味を表した。
- source_word: מַטֵּה שִׁמְעוֹן
  choice: シメオン部族
  rationale: מַטֶּה はこの人口調査・宿営配置の文脈で「杖」ではなく部族単位を意味する。明瞭な現代日本語として「シメオン部族」とした。
- source_word: וְנָשִׂיא
  choice: 指導者
  rationale: נָשִׂיא はここでは部族の公認の長を指す。「君主」という王権的な含意を避け、現代日本語で明確な「指導者」とした。
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: シメオンの子らの
  rationale: בְּנֵי の男性複数形による親族表現を保ち、「民」や「子孫」へ平板化せず「子ら」と訳した。
- source_word: שְׁלֻמִיאֵל
  choice: シェルミエル
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: ツリシャダイの子
  rationale: 父称構文をそのまま明瞭に訳し、父の名 צוּרִישַׁדָּי は一つの固有名として音写した。
theological_decisions:
- issue: לִבְנֵי שִׁמְעוֹן の性を伴う親族表現
  choice: シメオンの子ら
  alternative: シメオンの民／シメオンの子孫
  rationale: 原文の男性複数「子ら」を保持しても日本語で意味が通じるため、中性化せず、部族を親族集団として表す原文の言い方を残した。
- issue: עָלָיו の指示対象
  choice: その隣に
  alternative: 彼のそばに／そのそばに
  rationale: 男性単数接尾辞そのものは「彼／それ」を許すが、文脈上は人物、部隊、旗印のいずれを受けるかに余地がある。本文では自然な指示語「その」を用い、脚注で代案を示して曖昧さを過度に解消しないようにした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「宿営」「部族」「指導者」は民数記の配置記事に適した語彙である。文末を「である」とし、簡潔な名簿・配置規定の調子を保った。
