  text: 'and his division[b][a], those numbered from them: sixty-two thousand seven hundred.'
translation:
  language: ja
  text: その部隊[a]、すなわちその部族から数えられた者[b]は、六万二千七百人である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「軍勢」「軍団」。ヘブライ語は軍事的な集団を表すが、ここでは宿営における部族ごとの編成単位を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼らのうちで数えられた者たち」。その部族から人口調査で数えられた者の総数を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは軍勢・軍団を表し得るが、民数記1―2章の人口調査と宿営配置の文脈では、部族ごとに編成された軍事的集団を指す。「部隊」は組織上の単位という意味を自然な現代日本語で示す。3人称男性単数接尾辞は文脈上その部族を受けるものとして「その」とした。
- source_word: וּפְקֻדֵיהֶם
  choice: すなわち彼らのうちで数えられた者は
  rationale: פקדに由来するこの語形は、民数記の人口調査において登録・集計された者たちを指す。二つのוは単純な並列というより、部隊の人数を説明する関係と捉え、「すなわち」で自然に結んだ。「彼らのうちで」により接尾辞の関係も保持した。
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 六万二千七百人
  rationale: ヘブライ語の数量を正確に保ちつつ、現代日本語の標準的な数詞順序で表した。人数であることを明確にするため助数詞「人」を添えた。
