source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: ja
  text: 北側には、ダンの宿営の旗が、その部隊ごとに[a]置かれる。ダンの子らの指導者は、アミシャダイの子アヒエゼルである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その軍団ごとに」または「その軍勢ごとに」。
    reason: לְצִבְאֹתָם は、軍事的に組織された集団を表し、「部隊」「軍団」「軍勢」などと訳し得るため。
lexical_decisions:
- source_word: דֶּגֶל
  choice: 旗
  rationale: 宿営を編成する際の部族の旗印を指す。文脈に即し、現代日本語で簡潔な「旗」とした。
- source_word: מַחֲנֵה
  choice: 宿営
  rationale: 幕屋を中心に組織された部族の陣営を表すため、民数記2章の文脈に適した「宿営」とした。
- source_word: צָפֹנָה
  choice: 北側には
  rationale: 方向を示す語形だが、ここでは幕屋を基準とする配置場所を表すため、「北側には」とした。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: 部族内の軍事的に組織された集団に従う配置を表す。「部隊」は古風すぎず、秩序ある編成を明確に伝える。
- source_word: וְנָשִׂיא
  choice: 指導者
  rationale: 部族を代表する公的な長を指す。現代日本語で君主制を連想させる「君侯」などを避け、「指導者」とした。
- source_word: לִבְנֵי דָן
  choice: ダンの子ら
  rationale: 形式的な部族名称である男性複数形を保ちつつ、ヘブライ語の表現を自然な日本語に移した。
- source_word: אֲחִיעֶזֶר
  choice: アヒエゼル
  rationale: 人名を原語に基づいて音写した。
- source_word: בֶּן עַמִּישַׁדָּי
  choice: アミシャダイの子
  rationale: 父子関係を示す構文を日本語で自然に表し、人名は音写した。
theological_decisions:
- issue: 部族名称 בְנֵי の性を伴う表現
  choice: ダンの子ら
  alternative: ダン族／ダンの子孫
  rationale: 原文の「子ら」という男性複数の正式な部族表現を本文に残した。「ダン族」は自然だが原文の形を一般化し、「子孫」は意味を明示する解釈となるため採らなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宿営配置を告げる規定文として簡潔で格調ある調子にした。ヘブライ語の省略的な名詞文は、日本語として明確になるよう「配置される」を補った。
