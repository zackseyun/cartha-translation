  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: ja
  text: しかし、レビ人は、ヤハウェがモーセに命じたとおり、イスラエルの子ら[a]の中には数えられなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人」。伝統的には「イスラエルの子ら」または「イスラエルの子どもたち」。ヘブライ語は字義的には「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: しかし、レビ人は
  rationale: 接続詞וְは直前の人口調査の総数との対比を示すため、現代日本語で自然な「しかし」とした。הַלְוִיִּםは定冠詞を伴う集団名なので「レビ人」とした。
- source_word: לֹא הָתְפָּקְדוּ
  choice: 数えられなかった
  rationale: פקדのヒトパエル形は、この人口調査の文脈では登録・集計の対象となることを表す。「数えられなかった」は受動的な意味を保ち、平明である。
- source_word: בְּתוֹךְ
  choice: の中には
  rationale: より大きな集団への包含を表す。「には」によって、イスラエルの他の部族との対比も自然に示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義的な表現を保持した。「イスラエル人」は自然な代案だが、原文の「子ら」という表現を見えなくするため脚注に示した。
- source_word: כַּאֲשֶׁר
  choice: とおり
  rationale: 先に与えられた命令との一致を、自然な日本語で表す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 完了形は以前に与えられた命令を指す。日本語では従属節の過去形「命じた」によって時間関係が十分明確になる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を日本語で一般的な学術的音写により表した。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: 日本語の動詞「命じる」が要求する相手を示す助詞「に」を用いた。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、その固有名としての性格を保つ音写を採用した。
- issue: בני ישראלの範囲と表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの子孫
  rationale: 原文の男性複数名詞「子ら」を保持しつつ、この定型句が民族集団を指し得ることは脚注で示し、本文だけで範囲を狭く断定しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しかし」で直前の集計との対比を示し、「数えられなかった」で人口調査の文脈を平明に表現した。
