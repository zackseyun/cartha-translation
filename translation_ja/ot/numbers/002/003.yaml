id: NUM.2.3
reference: Numbers 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: ja
  text: 日の昇る東側には、ユダの宿営の旗印のもと、その部隊ごとに宿営する。ユダ族の指導者は、アミナダブの子ナフションである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵדְמָה מִזְרָחָה
  choice: 日の昇る東側には
  rationale: 二つの方向表現を重ねた原文を、自然な日本語で保ち、「東」と「日の昇る方」の双方を反映した。
- source_word: דֶּגֶל
  choice: 旗印
  rationale: 民数記2章で宿営集団を識別する旗・標識を表す語として、軍事的な含みと象徴性の両方を伝える。
- source_word: מַחֲנֵה יְהוּדָה
  choice: ユダの宿営
  rationale: 部族単独ではなく、ユダを中心とする宿営集団を指す構文を簡潔に表した。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָא の編成された集団・軍団という意味を、この人口調査と宿営配置の文脈に即して訳した。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 部族を代表し率いる者を指す。現代日本語で理解しやすく、王や祭司など特定の職制に限定しない。
- source_word: בְנֵי יְהוּדָה
  choice: ユダ族
  rationale: 字義は「ユダの子ら」だが、ここでは部族集団を指すため、自然な日本語で「ユダ族」とした。
theological_decisions: []
