lexical_decisions:
- source_word: וְ/מַטֵּה גָּד
  choice: また、ガド族
  rationale: מַטֶּהは宿営配置における部族単位を指すため、「杖」ではなく自然な「族」とした。接続詞וְは列挙の継続を示す「また」で表した。
- source_word: וְ/נָשִׂיא לִ/בְנֵי גָד
  choice: ガド族の指導者は
  rationale: נָשִׂיאはこの行政的文脈で部族を代表する者を指すため、現代日本語で明瞭な「指導者」とした。בְנֵיを逐語的に「子ら」とせず、部族集団を意味する自然な「ガド族」とした。
- source_word: אֶלְיָסָף
  choice: エルヤサフ
  rationale: ヘブライ語の人名を日本語聖書で通用する形に音写した。
- source_word: בֶּן רְעוּאֵל
  choice: レウエルの子
  rationale: בֶּןによる標準的な父称を日本語の自然な語順で表した。WLC本文のרְעוּאֵלを採用し、平行箇所の別形は脚注に残した。
