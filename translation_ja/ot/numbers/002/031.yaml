  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: ja
  text: ダンの陣営に属して数えられた者は、合わせて十五万七千六百人であった。彼らは彼らの旗印[a]に従って、最後に出発する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの旗のもとで」とも訳せる。ヘブライ語は、イスラエルの宿営編成において各部族集団を示す旗印、またその旗印を中心とする編成集団を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 数えられた者は、合わせて
  rationale: 受動分詞は人口調査で登録・集計された者を指す。「者」として、原文がこの節で明示していない「男子」を補わず、「合わせて」によって総数を示す構文を自然な日本語にした。
- source_word: לְמַחֲנֵה דָן
  choice: ダンの陣営で
  rationale: 前置詞が示す所属関係を、日本語の人口集計の文脈に自然な「陣営で」で表した。
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 十五万七千六百人
  rationale: 原文の総数157,600を正確に表し、人数であることが明瞭になるよう助数詞「人」を付した。
- source_word: לָאַחֲרֹנָה
  choice: 最後に
  rationale: 行軍順序の最後を示す副詞的表現を直接的に訳した。「後方で」という位置的な訳に限定しなかった。
- source_word: יִסְעוּ
  choice: 出発する
  rationale: 荒野の旅で宿営地から旅立つことを表す נסע を、明瞭で自然な現代日本語にした。未完了形はここでは定められた行軍順序を述べる。
- source_word: לְדִגְלֵיהֶם
  choice: それぞれの旗印に従って
  rationale: דגל が部族の旗印、またその旗を中心とする編成を指し得ることを保ちつつ、前置詞 לְ の編成・基準に沿う意味を自然に示した。
