  text: 'and his company[b][a], even those numbered from them: forty-five thousand six hundred and fifty.'
translation:
  language: ja
  text: その部隊[a]、すなわち、彼らのうち登録された者[b]は、四万五千六百五十人である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「軍勢」「軍団」。ヘブライ語は、軍務のために組織された集団を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「召集されて数えられた者」「彼らのうち数えられた者」。人口調査で登録された人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは、この宿営配置と人口調査の文脈では、組織された部族ごとの集団、特に軍務に就く部隊を指す。「部隊」は軍事的な含みを保ちつつ、現に戦闘中の軍隊であるとの印象を避けられる。接続詞וּは、前節から続く列挙として日本語の流れの中に反映した。
- source_word: וּפְקֻדֵיהֶם
  choice: すなわち、彼らのうち登録された者
  rationale: פקדの受動的な語義に基づき、人口調査で数えられ、名簿に載せられた者を表す。「彼らのうち」によって複数接尾辞הֶםを反映した。ヘブライ語ではוּで並置されるが、ここでは部隊の人数を説明する同格的関係が自然なため、「すなわち」とした。
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 四万五千六百五十人
  rationale: ヘブライ語の数詞を現代日本語の標準的な位取りで表し、数えられた人員であることを示す助数詞「人」を補った。
