  text: and his company[a], even those numbered from them, was thirty-five thousand four hundred.
translation:
  language: ja
  text: その部隊[a]、すなわち彼らのうち登録された者は、三万五千四百人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「軍勢」。ヘブライ語は、荒野で人口調査を受けた諸部族が軍隊式に編成されていたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは軍勢・部隊・組織された集団を表す。この宿営配置と人口調査の文脈では、戦闘そのものより、軍隊式に編成された部族集団を指すため、「部隊」とした。
- source_word: וּפְקֻדֵיהֶם
  choice: すなわち彼らのうち登録された者
  rationale: פקדの人口調査における用法を踏まえ、数えられ名簿に入れられた者を表す。「彼らのうち」により複数接尾辞の意味も保持した。接続詞は、部隊の人数を説明する同格的な関係として「すなわち」とした。
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 三万五千四百人
  rationale: ヘブライ語の数値を正確に保ち、現代日本語で自然な位取りにした。人数なので助数詞「人」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の簡潔な人口集計の文体を維持しつつ、וּפְקֻדֵיהֶםの関係が日本語で分かるよう「すなわち」を用いた。
