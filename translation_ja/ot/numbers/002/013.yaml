lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: 宿営と人口調査の文脈で、部族ごとに編成された軍務上の集団を指す。「軍勢」より現代的で、組織上の単位という意味を自然に表す。接続詞は日本語では文脈上あえて逐語的に重ねず、連続する名詞句として示した。
- source_word: וּפְקֻדֵיהֶם
  choice: すなわち彼らのうち登録された者
  rationale: פקד の人口調査における受動的な意味を「登録された者」とした。「彼らのうち」により3複数接尾辞を反映し、明示されていない「男子」をこの節だけに補わない。「すなわち」は、部隊と登録人数との同格的な関係を明瞭にする。
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 五万九千三百人
  rationale: ヘブライ語の数値を現代日本語の自然な桁順で正確に表し、人数であることを助数詞「人」で明示した。
