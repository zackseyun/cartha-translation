  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: ja
  text: イスラエルの子らは、それぞれ自分の旗のそばに、父祖の家ごとのしるしに従って宿営しなければならない。会見の天幕に向かい、その周囲に宿営しなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: それぞれ
  rationale: 単数形の分配的用法を、個々の者を指す自然な現代日本語で表した。文脈上は宿営に属する男子を念頭に置くが、日本語で「各人」と重ねて明示すると不自然になるため、簡潔にした。
- source_word: דִּגְלוֹ
  choice: 自分の旗
  rationale: 部族または軍団を識別する旗を指す。日本語では「旗」が明瞭で自然であり、接尾辞は「自分の」で表した。
- source_word: בְאֹתֹת
  choice: しるしに従って
  rationale: 各父祖の家を識別する標識・徽章を指す。前置詞を配置の基準として読み、「に従って」とした。具体的な形態は本文以上に限定しない。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家を示す
  rationale: 父系の家・氏族単位を表す句。「父祖の家」は原文の親族構造を保ち、「しるし」との関係が日本語で明瞭になるよう「を示す」とした。
- source_word: יַחֲנוּ
  choice: 宿営しなければならない
  rationale: 指示文脈における未完了形の命令的な力を、現代日本語の規定表現で示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の家族的・契約的表現を保持した。「イスラエル人」も可能だが、ここでは字義に近い言い方を採った。
- source_word: מִנֶּגֶד
  choice: 向き
  rationale: 会見の天幕と向かい合う位置関係を自然に表す。「離れて」の含意を積極的に加えず、位置上の曖昧さを保持した。
- source_word: סָבִיב
  choice: その周囲に
  rationale: 会見の天幕を中心として四方を囲む配置を簡潔に示した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 語句を直接的に訳し、伝統的な「幕屋」よりも原語の「天幕」と「会見」の要素を透明に示した。
theological_decisions:
- issue: 性別を含む代表的表現
  choice: イスラエルの子ら／それぞれ
  alternative: イスラエル人／一人一人
  rationale: בְּנֵי יִשְׂרָאֵל の家族的表現は保持しつつ、分配的な אִישׁ は日本語として過度に性別を反復しない自然な「それぞれ」で表した。
- issue: 礼拝施設を表す語
  choice: 会見の天幕
  alternative: 会見の幕屋／幕屋
  rationale: אֹהֶל מוֹעֵד の構成要素を直接示し、後代的または伝統的な専門語だけに依存しない訳とした。
- issue: מִנֶּגֶד の距離的含意
  choice: 向き
  alternative: 少し離れて／向かい側に
  rationale: 語は対面・反対側の位置を表し、距離を含意し得るが、この節だけで具体的な距離を確定せず、配置関係を中心に訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。民数記の宿営規定として命令的な調子を保ちつつ、古語的な「べし」は避けた。「旗のもとに」は所属・配置の意味が自然に伝わる表現とした。
