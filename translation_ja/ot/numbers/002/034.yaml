  source_fidelity: ヘブライ語の構文と語義をよく反映している。「イスラエルの子ら」はבְּנֵי יִשְׂרָאֵלを保ち、「ヤハウェ」「モーセに命じたすべてのとおりに」は原文の内容を正確に伝える。「旗印のもとに宿営し」「氏族ごと、父祖の家ごとに出発した」も、部族的な陣営編成と父系家系による移動の秩序を適切に表す。
