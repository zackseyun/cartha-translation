id: NUM.2.34
reference: Numbers 2:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: ja
  text: イスラエルの子らは、ヤハウェがモーセに命じたすべてのとおりに行った。彼らはそれぞれの旗印のもとに宿営し、またそれぞれの氏族ごと、父祖の家ごとに出発した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 行った
  rationale: 直前までの命令全体にイスラエルが従ったことを要約する動詞として、簡潔で自然な表現。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 民族全体を指す慣用句だが、原文の「子ら」という形を保ちつつ、現代日本語で理解できるようにした。
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのとおりに
  rationale: 命令の全内容との一致を表す包括的な力を自然に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名である四文字語を普通名詞の称号に置き換えず、固有名として音写した。
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: モーセに命じた
  rationale: ヘブライ語の目的語標識を日本語の間接目的語として自然に表した。
- source_word: כֵּן ... וְכֵן
  choice: そのとおりに……また
  rationale: 命令と行動の対応、および宿営と出発の並行性を日本語で明瞭に示す。冒頭節の「すべてのとおりに」と合わせて反復の力を伝えた。
- source_word: חָנוּ
  choice: 宿営し
  rationale: 民数記の荒野の陣営という文脈に適し、「キャンプした」より格調と正確さを備える。
- source_word: לְדִגְלֵיהֶם
  choice: それぞれの旗印のもとに
  rationale: דֶּגֶלが部族別の編成を示す旗・標識を指すことを表し、単なる装飾的な旗との誤解を抑える。
- source_word: נָסָעוּ
  choice: 出発した
  rationale: 宿営地から旅立つ動作を、自然で簡潔な現代日本語にした。
- source_word: אִישׁ
  choice: それぞれ
  rationale: ここでは個々の男性を強調するより、各人・各単位への配分を示す語なので、その分配的意味を表した。
- source_word: לְמִשְׁפְּחֹתָיו
  choice: それぞれの氏族ごと
  rationale: מִשְׁפָּחָהはこの人口調査・陣営文脈では核家族より大きい氏族的集団を指す。
- source_word: עַל בֵּית אֲבֹתָיו
  choice: 父祖の家ごとに
  rationale: 父系の祖先に基づく家系・集団という制度的意味を、過度に逐語的にならず保持する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は神名そのものを用いているため、称号「主」に置換せず音写する。母音の再構成には歴史的議論があるが、現代の標準的表記として「ヤハウェ」を採る。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法記事にふさわしい簡潔で端正な文体とした。「イスラエルの子ら」「旗印」「父祖の家」により原文の社会構造と表現を保ち、過度な説明は本文に加えていない。
