  language: ja
  text: その部隊[a]の登録者は、三万二千二百人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「軍勢」。ここで「部隊」と訳したヘブライ語は、宿営と行進のために編成された部族の集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: その部隊
  rationale: צָבָאは軍勢を表し得るが、民数記2章では宿営と行進のために編成された部族ごとの集団を指すため、現代日本語として自然な「部隊」とした。接続詞と三人称単数接尾辞は文脈に合わせて「その」に含めた。
- source_word: וּפְקֻדֵיהֶם
  choice: で登録された者
  rationale: פקדの受動的な名詞用法は、数えられ、召集名簿に登録された者たちを指す。「登録された者」により、後続の数字がその総数であることを明確にした。複数接尾辞「彼らの／彼らから」は、日本語では「その部隊で」と自然に表した。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 三万二千二百人
  rationale: ヘブライ語の数詞を現代日本語の通常の語順で示し、人数なので助数表現「人」を添えた。
