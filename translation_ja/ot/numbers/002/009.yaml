  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: ja
  text: ユダの宿営に属する登録者は、部隊ごとに数えると、全部で十八万六千四百人であった。彼らは最初に出発する。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: 登録された者は、…合わせて
  rationale: 全数を集計する句であるため、「すべて」を機械的に置かず、現代日本語で総計を明確に示す「合わせて」とした。הַפְּקֻדִים は人口調査と軍務のために登録・ شمارされた者を指し、「登録された者」が文脈に適する。
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: ユダの宿営に属する
  rationale: 前置詞 לְ が示す所属関係を自然な日本語で表した。
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 十八万六千四百人
  rationale: 原文の合計数を正確に示し、日本語の聖書本文として読みやすい漢数字表記とした。文脈上、人数なので「人」を補った。
- source_word: לְצִבְאֹתָם
  choice: 部隊ごとに
  rationale: צָבָא は軍勢・軍団・編成部隊を表し得る。ここでは宿営内の組織的な軍事編成を、現代の常備軍に限定せず明瞭に示す。
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: 彼らが最初に出発する
  rationale: נסע の宿営地から旅立つ意味と、行軍順を示す רִאשֹׁנָה を直接的かつ自然に表した。指示・規定の文脈だが、ヘブライ語の未完了形を過度に命令調へ限定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、人口調査と行軍編成の公的・荘重な調子を保った。「登録された者」「宿営」「部隊」「出発する」を用い、軍事性を消さず、現代軍制を過度に連想させない表現とした。
