  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: ja
  text: 'また、契約の箱がとどまるとき、モーセは言った。


    「お帰りください、ヤハウェよ、イスラエルの幾万もの千人のもとに。」[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イスラエルの幾万もの千人」。ヘブライ語では「お帰りください」とこの句との関係が簡潔に表されている。ここでは帰還する先として訳した。「幾万もの千人」は、イスラエルの非常に多くの民を強調する重ねられた大数表現。
    reason: 統語関係の簡潔さを示しつつ、大数表現の意味を説明する。
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: また、箱がとどまるとき
  rationale: 前節から主語である契約の箱を補い、不定詞構文の時間的意味を自然な日本語で表した。「休む」ではなく、移動していた箱が停止する文脈に合う「とどまる」とした。
- source_word: יֹאמַר
  choice: モーセは言った
  rationale: ヘブライ語の未完了形は反復的な行為とも理解できるが、この定型句の導入は日本語では簡潔な過去形が自然である。文脈から話者モーセを補った。
- source_word: שׁוּבָה
  choice: お戻りください
  rationale: שוב の命令形を、神への直接の願いにふさわしい敬意を保って訳した。「帰って来てください」ほど不在を強調せず、原文の簡潔さと曖昧さを保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: イスラエルの幾万もの千人のもとへ
  rationale: 二つの大数表現を重ねる原文の強調を保ちつつ、目的地・対象を示すように読める統語上の曖昧さを日本語で無理に解消しない表現とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が神名を明記しているため、称号「主」ではなく固有名を示す。
- issue: שׁוּבָה と後続句の関係
  choice: 「イスラエルの幾万もの千人のもとへ」を「お戻りください」に結び付ける
  alternative: 「イスラエルの幾万もの千人とともに、お戻りください」または「イスラエルの無数の千人の間にお戻りください」
  rationale: 前置詞が明示されない簡潔なヘブライ語であり、帰還の行き先・対象とも、民を伴う表現とも解されうる。本文では自然な行き先として示し、別解を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、モーセの祈願には敬意ある命令表現を採用した。詩的な発話として改行し、原文の大数表現を過度に平板化しないようにした。
