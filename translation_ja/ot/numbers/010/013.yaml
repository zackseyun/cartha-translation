source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: ja
  text: 彼らは初めて出発した。ヤハウェがモーセを通して命じられたとおりであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出発した
  rationale: נסעは旅程記事で、宿営を解いて次の場所へ移動し始めることを表す。「出発した」はその起動的な意味を自然な現代日本語で伝える。
- source_word: בָּרִאשֹׁנָה
  choice: 初めて
  rationale: 副詞的な女性形で「初めに」「初めて」を意味する。ここではシナイからの最初の出発を指すため、「初めて」が文脈に合う。
- source_word: עַל פִּי
  choice: 命令に従って
  rationale: 直訳は「口に基づいて」だが、「命令に従って」を意味する慣用句。神の指示への服従を明瞭に表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語音写で示す。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセの手を通して告げられた
  rationale: 「モーセの手によって」という原文の比喩を残しつつ、モーセが命令の媒介者であることを自然な日本語で示す。補った「告げられた」は文脈上の媒介内容を明示する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有名を用いているため、称号「主」に置換せず音写する。「エホバ」より原語の推定発音に近い慣用形「ヤハウェ」を採る。
- issue: モーセの媒介的役割
  choice: モーセの手を通して告げられた
  alternative: モーセによる／モーセの手による
  rationale: בְּיַד の代理・媒介の意味を保つが、モーセが命令の源であるかのようには表現せず、命令の源はヤハウェであることを明確にする。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「こうして」で物語の連続性を示し、二文構成にして「初めて」と命令への服従を読み取りやすくした。原文の「手」の比喩は本文と脚注の双方で保持した。
