  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: ja
  text: 続いて、ルベンの宿営の旗印[a]が、その部隊ごとに[b]進み出た。その部隊を率いたのは、シェデウルの子エリツルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旗」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その軍団ごとに」。ヘブライ語には、秩序立てられた軍事的編成という含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: 続いて……出発した
  rationale: 物語を順に進める接続形の働きを「続いて」で表し、נסעは宿営から移動を開始する文脈に自然な「出発した」とした。
- source_word: דֶּגֶל
  choice: 旗印
  rationale: 部族の宿営がその下で行進する具体的なしるしを指すため、現代日本語で明瞭な「旗印」とした。
- source_word: מַחֲנֵה רְאוּבֵן
  choice: ルベンの宿営
  rationale: 連語の所有・所属関係を簡潔に保った。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צבאの複数形と接尾辞を反映し、戦闘そのものに限定せず、秩序立てられた集団単位で進む意味を表した。
- source_word: וְעַל צְבָאוֹ
  choice: その部隊の指揮を執ったのは
  rationale: עלが示す統率・監督の関係を自然な日本語で明示し、צבאの単数形は「部隊」とした。
- source_word: אֱלִיצוּר
  choice: エリツル
  rationale: 人名を日本語の慣用的な聖書音写に従って表記した。
- source_word: בֶּן שְׁדֵיאוּר
  choice: シェデウルの子
  rationale: 父子関係を原文どおりに保ち、父名は音写した。
