translation:
  language: ja
  text: 出発の合図[a]を吹き鳴らすと、東側に宿営している諸陣営が出発する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「警報の吹奏」「合図の吹奏」。ヘブライ語はここで、宿営の移動を知らせるための特徴的なラッパの吹奏を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: 吹き鳴らすと
  rationale: תקעはラッパなどを「吹く、吹き鳴らす」の意。接続された二つの動作の関係を自然な日本語で示すため、後続する出発の合図として「すると」の形にした。
- source_word: תְּרוּעָה
  choice: 警報の音[a]
  rationale: ここでは宿営の移動を告げる特徴的なラッパの吹奏を指す。「警報の音」は語の警告的・信号的な性格を保ちつつ、別訳「合図の音」を脚注に示して意味域を保持する。
- source_word: וְנָסְעוּ
  choice: 出発する
  rationale: נסעは宿営地を離れて旅を開始することを表す。この規定に従って陣営が動き始めることを、明瞭で自然な「出発する」とした。
- source_word: הַמַּחֲנוֹת
  choice: 諸陣営
  rationale: 複数形で、幕屋の周囲に配置された部族ごとの宿営集団を指すため、複数性を明示する「諸陣営」とした。
- source_word: הַחֹנִים
  choice: 宿営している
  rationale: 分詞が諸陣営の配置状態を修飾しているため、その継続的な状態を表す「宿営している」とした。
- source_word: קֵדְמָה
  choice: 東側に
  rationale: 形の上では方向を表し得るが、ここでは陣営の位置を示しているため、「東へ」ではなく「東側に」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、規定文としての簡潔さと尊厳を保った。「諸陣営」で原文の複数形を示し、ラッパへの言及は文脈上明らかだが本文には補わず、脚注で説明した。
