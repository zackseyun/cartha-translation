source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: ja
  text: 続いて、聖なる物を運ぶケハト族が出発した。彼らが到着するまでに、幕屋は組み立てられていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: 続いて……出発した
  rationale: 接続詞 waw と נסע は旅程の叙述を先へ進める。「続いて」は文脈上の順次性を自然な日本語で示し、「出発した」は宿営地からの移動に適する。
- source_word: הַקְּהָתִים
  choice: ケハト族
  rationale: ケハトの子孫から成る氏族を指す複数の名称。現代日本語では「ケハト族」が簡潔で明瞭。
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: 聖なる物を運ぶ
  rationale: 字義的には「聖所を担う者たち」だが、直後に幕屋の構造物が区別されるため、文脈上はケハト族が運ぶ聖所の器具類を換喩的に指す。「聖なる物」は原語の聖性を保ちつつ、幕屋全体を運んだとの誤解を避ける。
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: 幕屋は組み立てられていた
  rationale: ヘブライ語の動詞は三人称男性複数だが主語が明示されない。先行したレビ人が幕屋を設営する文脈を踏まえ、ケハト族が組み立てたと誤読されないよう日本語では受動表現とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 荒野における移動式聖所を表す מִשְׁכָּן の定着した、文脈に即した訳語。
- source_word: עַד בֹּאָם
  choice: 彼らが到着するまでに
  rationale: 「彼らが来る時まで」を表す。幕屋がケハト族の到着に先立って設営済みとなる時間関係を、原文に近く自然に示す。
