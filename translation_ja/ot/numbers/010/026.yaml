id: NUM.10.26
reference: Numbers 10:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: ja
  text: アシェル族の部隊を率いるのは、オクランの子パグイエルであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」は「軍勢」「隊」とも訳せる。ヘブライ語は、イスラエルの宿営と行軍の秩序に組み込まれた組織的な集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: を率いるのは
  rationale: 前後に続く指揮者一覧の構文を自然な現代日本語で表し、עַל が示す「上に立つ、統率する」という関係を明確にした。接続詞は日本語では列挙の流れによって十分示されるため、独立した「そして」とはしなかった。
- source_word: צְבָא
  choice: 部隊
  rationale: 宿営と行軍の秩序に組み込まれた組織的集団を指す。「軍」と断定して戦闘性を強めすぎず、「隊」よりも組織された集団という意味が明瞭な語を選んだ。
- source_word: מַטֵּה
  choice: 族
  rationale: この文脈では物理的な「杖」ではなくイスラエルの部族単位を指す。後続の「アシェル」と合わせて自然な部族名「アシェル族」とした。
- source_word: בְּנֵי אָשֵׁר
  choice: アシェル族
  rationale: 字義的には「アシェルの子ら」だが、ここではアシェルの子孫から成る部族の定型的呼称である。日本語で自然かつ明確な部族名として訳した。
- source_word: פַּגְעִיאֵל
  choice: パグイエル
  rationale: ヘブライ語名の音を日本語で慣用的に転写した。
- source_word: בֶּן עָכְרָן
  choice: オクランの子
  rationale: 父称を自然かつ簡潔な日本語で保持し、父名は音写した。
theological_decisions: []
translation_notes:
  register: 簡潔な名簿形式を保ちつつ、現代の一般読者に自然な叙述とした。人名は「パグイエル」「オクラン」と音写し、「アシェルの子ら」は文脈上の部族名称として「アシェル族」とした。
