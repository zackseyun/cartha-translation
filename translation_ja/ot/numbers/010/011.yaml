source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: ja
  text: 第二年の第二の月の二十日に、証しの幕屋[a]の上から雲が上がった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「証しの住まい」。また「証しの天幕」とも訳される。
    reason: alternative_reading
  - marker: b
    text: また「昇った」とも訳せる。雲が幕屋の上方から移動したことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （時を示す表現に統合）
  rationale: 物語を次の出来事へ進める定型表現。日本語では「第二年の…二十日に」と直接始めることで、意味を保ちながら不自然な「そして、起こった」を避けた。
- source_word: בַּשָּׁנָה הַשֵּׁנִית בַּחֹדֶשׁ הַשֵּׁנִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: 第二年の第二の月、その月の二十日に
  rationale: 年・月・日の順序を保ち、ヘブライ語で省略されている「日」を日本語の日付表現に必要なものとして補った。
- source_word: נַעֲלָה
  choice: 上がった
  rationale: עלהの上方への移動を直接表す。雲が幕屋の上を離れ、出発の合図となる文脈にも自然に合うが、「離れた」という語自体は本文に加えなかった。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 荒野で民を導く既知の雲を指す。日本語ではこの文脈で定冠詞を明示する必要がない。
- source_word: מֵעַל
  choice: 上から
  rationale: 幕屋の上方にあった位置からの移動を簡潔かつ明確に表す。
- source_word: מִשְׁכַּן
  choice: 幕屋
  rationale: 荒野の移動式聖所を表す定着した聖書用語であり、「住まい」という語義と聖所としての文脈を保つ。
- source_word: הָעֵדֻת
  choice: 証し
  rationale: 聖所内に置かれた契約の証言・証拠を指す語を解釈的に「契約」と置き換えず、原語の語義と五書内の関連を保った。
theological_decisions:
- issue: מִשְׁכַּן הָעֵדֻת の聖所名称
  choice: 証しの幕屋
  alternative: 証しの天幕／契約の幕屋
  rationale: מִשְׁכָּןはここでは聖所としての幕屋を指し、עֵדוּתは字義上「証し」である。「契約」は文脈上関係するものの解釈を加えるため、本文では採らなかった。
translation_notes:
  register: 現代の一般読者に明瞭な簡潔さを優先しつつ、「幕屋」「証し」という五書の重要語を保持した。日付は自然な現代日本語に整え、文体は簡潔で荘重な物語調とした。
