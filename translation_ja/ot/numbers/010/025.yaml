revisions:
- from: それから、ダン族の宿営の旗印が、その部隊ごとに進むすべての宿営のしんがりを務めて出発した[a]。その軍団を率いるのは、アミシャダイの子アヒエゼルであった。
  to: それから、ダン族の宿営の旗印が出発した[a]。それは、すべての宿営のしんがりとして、それぞれの部隊に従って進んだ。その部隊の長は、アミシャダイの子アヒエゼルであった。
  rationale: 文を分けて、ダンの宿営が全宿営の後衛を担い、各部隊の編成に従う行軍順序の中で進んだことを明瞭にした。「軍団」を「部隊」に改め、原文の行軍組織という意味を保ちつつ、近代軍事的な規模の含意を避けた。
