  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: ja
  text: それから、ダン族の宿営の旗印が出発した[a]。それは、すべての宿営のしんがりとして、それぞれの部隊に従って進んだ。その部隊の長は、アミシャダイの子アヒエゼルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旗印」は「旗」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: それから……出発した
  rationale: 継続法の接続詞が物語の順序を進めているため、「それから」で連続性を示し、נסעは移動開始を自然に表す「出発した」とした。
- source_word: דֶּגֶל מַחֲנֵה בְנֵי דָן
  choice: ダン族の宿営の旗印
  rationale: דגלは部族宿営を識別する旗または標識を指す。「旗印」は現代日本語で意味が明瞭であり、宿営単位を表す構文も保持する。בני דןはこの定型的な部族表現では「ダン族」とするのが自然である。
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: すべての宿営のしんがりを務めて
  rationale: 分詞מְאַסֵּףは行軍の最後尾に位置する機能を表す。「しんがりを務めて」は、後方を守りつつ全体の最後を進むという文脈上の意味を簡潔に伝える。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに進む
  rationale: צבאותはここでは狭義の戦闘軍ではなく、行軍秩序に従う組織的集団を指す。「部隊ごとに」で編成単位を示し、直前の「すべての宿営」に自然に結び付けた。
- source_word: וְעַל צְבָאוֹ
  choice: その軍団を率いるのは
  rationale: עלは当該集団の上に立つ指揮関係を示すため「率いる」とした。צבאは同節内の複数形との不自然な反復を避けつつ、組織された一団を示す「軍団」とした。
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: アミシャダイの子アヒエゼル
  rationale: ヘブライ語の父称表現を保ち、人名は日本語で一般的な聖書音写に従った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、民数記の行軍記録にふさわしい端正さを保った。「しんがり」は一般に理解できる語で、מְאַסֵּףの機能を簡潔に表す。原文の語順を機械的に再現せず、לְצִבְאֹתָםが諸宿営の編成された行軍を修飾する関係を日本語で明確にした。
