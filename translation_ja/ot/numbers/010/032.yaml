  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: ja
  text: もしあなたが私たちと一緒に行くなら、ヤハウェが私たちにしてくださる良いことは何でも、私たちもあなたに良いことをします。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「ヤハウェが私たちに良くしてくださる、その良いことを、私たちもあなたにします」。
    reason: 原文では「良い」を意味する同根語が繰り返されており、本文より形式に近い言い方を示すため。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: もし～なら
  rationale: この句は条件を導く。「～となる、もし」と逐語的にせず、条件性を明確に保つ自然な現代日本語とした。「～するとき」では実現の確実性を強めすぎる。
- source_word: תֵלֵךְ עִמָּנוּ
  choice: あなたが私たちと一緒に行く
  rationale: הלך と עִם はここで旅に同行することを表す。文脈に即しつつ、原文の基本的な動詞に近い「行く」とした。
- source_word: הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: ヤハウェが私たちに与えてくださる幸い
  rationale: טוב／יטב の語義である良いもの・益を、日本語で自然に一まとまりとして表した。「幸い」は物質的利益だけに狭めず、神がイスラエルにもたらす良いものを広く指し得る。עִמָּנוּ は字義的には「私たちと共に」だが、この構文では「私たちに良くする」という受益の意味を表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で音写した。
- source_word: וְהֵטַבְנוּ לָךְ
  choice: 私たちもあなたに分かちます
  rationale: 直訳的な「あなたに良くします」は現代日本語では不自然になりやすい。直前の「幸い」を受け、イスラエルがその益に同行者をあずからせるという意味を「分かちます」で明確にした。原文の יטב の反復は脚注で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は固有の神名を用いているため、称号「主」への置換を避けて「ヤハウェ」とした。
- issue: 神の「良いこと」の範囲
  choice: 幸い
  alternative: 恵み、良いもの
  rationale: 文脈上の利益を表しながら、それを霊的恩恵や物質的祝福のいずれか一方に限定しない表現を選んだ。
translation_notes:
  register: 明快な現代標準日本語を用い、旅への同行を求める丁寧さを過度に補わず、条件文として簡潔かつ dignified な調子に整えた。
