  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: ja
  text: また、ゼブルン族の部隊を率いるのは、ヘロンの子エリアブであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」は「軍勢」または「隊」とも訳せる。ヘブライ語は、行進のために秩序立てて編成された部族の集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: を率いるのは
  rationale: 接続詞וְは前節から続く列挙の流れを受け、עַלは省略された権威・指揮の動詞を伴う定型表現である。日本語では「を率いるのは」として、自然に指揮関係を示した。
- source_word: צְבָא
  choice: 部隊
  rationale: 荒野を行進する、秩序立てて編成された部族の集団を指す。「軍」ほど常設軍的に限定せず、「隊」より編成単位であることが明確な「部隊」とした。
- source_word: מַטֵּה
  choice: 族
  rationale: ここでは物としての「杖」ではなく、イスラエルの社会的単位である部族を表す。固有名に続けて「ゼブルン族」とするのが明瞭で自然である。
- source_word: בְּנֵי זְבוּלֻן
  choice: ゼブルン族
  rationale: 直訳は「ゼブルンの子ら」だが、この行軍編成の定型句では祖先ゼブルンに属する部族の成員を指す。現代日本語で意味が明確になるよう「ゼブルン族」とした。
- source_word: אֱלִיאָב
  choice: エリアブ
  rationale: ヘブライ語の人名を日本語の聖書名として自然に音写した。
- source_word: בֶּן חֵלֹן
  choice: ヘロンの子
  rationale: ヘブライ語の標準的な父称表現を直接的かつ自然に訳した。
