  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: ja
  text: しかし、ラッパを一つだけ吹き鳴らすなら、イスラエルの千人の組[a]の長である指導者たちが、あなたのもとに集まる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの千の組」。イスラエルの千単位の長を指すと考えられる。一部の訳は、これを氏族の長と解釈して訳す。
    reason: 「千」の組織単位の性質を本文で固定せず、原文の語を保ちながら主要な解釈上の可能性を示すため。
lexical_decisions:
- source_word: וְ/אִם
  choice: しかし、…なら
  rationale: 前節の二本を吹く場合と対照をなす条件を、現代日本語で自然に示す。
- source_word: בְּ/אַחַת יִתְקָעוּ
  choice: 一つだけを吹き鳴らす
  rationale: 「一つ」は文脈上ラッパ一本を指す。「だけ」で前節の二本との対照を明確にし、「吹き鳴らす」でתקעの信号としての動作を表した。
- source_word: וְ/נוֹעֲדוּ אֵלֶי/ךָ
  choice: あなたのもとに集まる
  rationale: 召集に応じてモーセのところへ集合する意味を、簡潔で自然な日本語にした。
- source_word: הַ/נְּשִׂיאִים
  choice: 指導者たち
  rationale: 王族を連想させる「君侯」などを避け、共同体を率いる者という役割を明瞭に表す。
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: イスラエルの千人隊のかしら
  rationale: אלפיםを氏族と解釈し切らず、行政的・軍事的な千人単位を示す原文の表現を保持した。「かしら」はראשיと指導者との同格関係を自然に表す。
