  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: ja
  text: 祭司であるアロンの子らがラッパを吹く。このことは、あなたがたにとって代々にわたる永続の定め[a]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「永遠の定め」または「いつまでも続く定め」。
    reason: עוֹלָםは、文脈に応じて長期にわたる継続や永続性を表し得るため。
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: アロンの子らが
  rationale: בְּנֵי の家族的表現を保ちつつ、現代日本語として自然に訳した。冒頭の接続詞 וּ は、単独の節として不自然な「そして」を置かず、文脈上の連続性を損なわない形で訳出した。
- source_word: הַכֹּהֲנִים
  choice: 祭司である
  rationale: 「アロンの子ら」を同格的に説明する語として明示した。
- source_word: יִתְקְעוּ בַּחֲצֹצְרוֹת
  choice: ラッパを吹く
  rationale: תקע は חצצרות とともに用いられ、ラッパを吹くことを表す。命令・規定の文脈は日本語の非過去形で自然に示した。「銀」は直前の文脈にはあるが、本節自体にはないため補わなかった。
- source_word: וְהָיוּ לָכֶם
  choice: それらは、あなたがたにとって、…となる
  rationale: 複数形 הָיוּ を「それら」で保持し、直前のラッパを受ける文法上の形を明示した。同時に、定められた用法全体を指し得る含みは残した。
- source_word: לְחֻקַּת עוֹלָם
  choice: 永続の定め
  rationale: 法的な定型句の継続性を、現代日本語で過度に哲学的な絶対性へ限定せず表した。別訳は脚注に示した。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたる
  rationale: 後続する世代を通じて効力を持つことを自然な日本語で表現した。
theological_decisions:
- issue: חֻקַּת עוֹלָם の継続期間
  choice: 永続の定め
  alternative: 永遠の定め／いつまでも続く定め
  rationale: עוֹלָם は文脈により長期的継続または永続性を表し得る。「永続」は規定の継続的効力を保ちつつ、その範囲について本文以上の哲学的断定を加えない。
- issue: וְהָיוּ の複数形が指すもの
  choice: それらは
  alternative: これは
  rationale: 原文の複数形を保持し、直前の「ラッパ」を文法上の先行詞として読めるようにした。ただし、ラッパに関する規定全体を要約する読みも文脈上可能であるため、意味を狭く説明しすぎない表現とした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「子ら」は系譜的・祭司的な集団を示す聖書本文の表現として保持し、全体は規定文にふさわしい簡潔な叙述形とした。
