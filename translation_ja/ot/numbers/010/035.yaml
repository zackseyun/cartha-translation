base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: ja
  text: '箱が出発するたびに[a]、モーセは言った。


    「ヤハウェよ、立ち上がってください[b]。


    あなたの敵が散らされ、


    あなたを憎む者たちが、あなたの前から逃げ去りますように。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「箱が出発したとき、こうなった」。ヘブライ語をより形式的にはそのように訳せるが、ここでは「箱が出発するたびに」という反復の意味だと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「立ち上がってください」は、ヤハウェが力をもって行動するよう求める呼びかけであり、神が文字どおり何もせずにいたという意味ではない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: 箱が出発するたびに
  rationale: וַיְהִי と不定詞連語がここでは反復される状況を導入しているため、「出発したとき、こうなった」と一回の出来事に限定せず、「出発するたびに」とした。
- source_word: הָאָרֹן
  choice: 箱
  rationale: 原文は単に「箱」としており、「契約の箱」という文脈上の説明を本文へ補わない。民数記の文脈で神聖な箱を指すため、「箱」と表記した。
- source_word: קוּמָה
  choice: 立ち上がってください
  rationale: ヤハウェに向けられた命令形であり、力をもって行動するよう願う比喩的な呼びかけ。その像を保ちながら、現代日本語の祈願として自然な敬語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写して示した。
- source_word: וְיָפֻצוּ
  choice: 散らされ……ますように
  rationale: 命令形に続く未完了形を祈願の意を持つ指令形として捉え、受動態と「ますように」で願いを表した。
- source_word: אֹיְבֶיךָ
  choice: あなたの敵
  rationale: 二人称男性単数接尾辞を含む複数名詞を、ヤハウェへの直接の呼びかけとして簡潔に訳した。
- source_word: וְיָנֻסוּ
  choice: 逃げ去りますように
  rationale: 先行する祈願と並行する指令的な未完了形として訳し、「去る」によって退却の動きを明確にした。
- source_word: מְשַׂנְאֶיךָ
  choice: あなたを憎む者たち
  rationale: 分詞が示す継続的な特徴を自然な日本語で表し、ヤハウェに対する人格的な敵意を保持した。
- source_word: מִפָּנֶיךָ
  choice: あなたの前から
  rationale: מִן の起点と פָּנִים の面前・臨在の含みを保ち、敵がヤハウェの面前から退く軍事的な情景を自然に表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: エホバ、または「主」
  rationale: この節は四文字神名を直接用いている。称号で代替せず、イスラエルに示された固有の神名として音写した。
- issue: 「立ち上がってください」の意味
  choice: 神が力をもって行動することを求める比喩的な呼びかけ
  alternative: 神が文字どおり休止または着座していた状態から立つこと
  rationale: קוּמָה の鮮明な比喩は本文に残しつつ、神の無活動を文字どおり述べているとの不必要な解釈を避けるため注で説明した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、モーセの祈りにふさわしい荘重さを保った。後半の二つの未完了形は「ますように」で並行させ、祈願の響きを明示した。原文の詩的な行構成が伝わるよう改行した。
