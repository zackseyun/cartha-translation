source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: ja
  text: また、ベニヤミン族の部隊を率いるのは、ギデオニの子アビダンであった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」は「軍勢」または「隊」とも訳せる。ヘブライ語は、軍隊のように組織された編成を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: また、…を率いるのは
  rationale: 接続詞を「また」で表し、前置詞 עַל の統率・監督の関係を、一覧文として自然な日本語の「率いる」で示した。
- source_word: צְבָא
  choice: 部隊
  rationale: ここでは狭義の戦闘軍ではなく、秩序立てられた宿営・行軍編成を指すため、「軍」よりも文脈に適した「部隊」とした。
- source_word: מַטֵּה בְּנֵי בִנְיָמִן
  choice: ベニヤミン族
  rationale: מַטֶּה はここでは物としての「杖」ではなく部族を表す。בְּנֵי בִנְיָמִן は字義的には「ベニヤミンの子ら」だが、現代日本語では部族名として「ベニヤミン族」が明瞭で自然である。
- source_word: אֲבִידָן
  choice: アビダン
  rationale: 人名を日本語で慣用的に音写した。
- source_word: בֶּן גִּדְעוֹנִי
  choice: ギデオニの子
  rationale: 父称を簡潔かつ自然に表し、人物の同定関係を保持した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある叙述とした。前後に続く行軍指揮者の一覧との連続性を「また」で保ち、ヘブライ語の名詞的な構文は自然な日本語の「率いるのは」で表した。
