  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: ja
  text: ナフタリ族の部隊の指揮官は、エナンの子アヒラであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」は「軍勢」「軍」または「隊」とも訳せる。ヘブライ語は、宿営と行軍の編成に組み込まれた部族ごとの組織的集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: を率いたのは
  rationale: 前節から続く指揮官の列挙であり、עַל が部隊の上に立つ指揮関係を示すため、現代日本語として自然な「率いた」で表した。接続詞 וְ はこの継続的な列挙の中で日本語では明示しなくてもつながりが保たれる。
- source_word: צְבָא
  choice: 部隊
  rationale: 宿営と行軍の秩序に組み込まれた各部族の組織的集団を指す。「軍」ほど国家的な常備軍を連想させず、「部隊」が文脈に即している。
- source_word: מַטֵּה
  choice: 族
  rationale: ここでは物体としての「杖」ではなく、イスラエルの部族単位を表す。日本語聖書の文脈で自然な「族」とした。
- source_word: בְּנֵי נַפְתָּלִי
  choice: ナフタリ族
  rationale: 字義は「ナフタリの子ら」だが、定型的な部族名称として子孫から成るナフタリ部族を指す。直前の מַטֵּה と合わせ、重複を避けて自然に「ナフタリ族」とした。
- source_word: אֲחִירַע
  choice: アヒラ
  rationale: ヘブライ語の人名を日本語の慣用的な音写で示した。
- source_word: בֶּן עֵינָן
  choice: エナンの子
  rationale: 標準的な父称表現として、語順と親子関係を明確に保った。
theological_decisions: []
translation_notes:
  register: 反復される指揮官一覧の簡潔さを保ちつつ、現代の一般読者に自然で格調を失わない叙述とした。原文の名詞句的な構造は、日本語で明瞭な「率いたのは……であった」に整えた。
