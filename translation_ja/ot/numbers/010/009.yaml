id: NUM.10.9
reference: Numbers 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: ja
  text: あなたがたの地で、あなたがたを苦しめる敵と戦うことになったなら[a]、ラッパで警報を吹き鳴らしなさい。そうすれば、あなたがたの神ヤハウェの前で覚えられ[b][c]、敵から救われる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの地で敵と戦う時」。ヘブライ語の接続表現は、条件とも状況・時とも理解できる。
    reason: alternative_reading
  - marker: b
    text: 別訳「あなたがたの神ヤハウェの前で思い起こされ」または、意味を補って「あなたがたの神ヤハウェが、あなたがたを覚えてくださり」。
    reason: lexical_alternative
  - marker: c
    text: 「ヤハウェ」は、ヘブライ語で神の固有名を表す四文字 יהוה（YHWH）の音写。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 戦うことになったなら
  rationale: וְכִי は将来起こり得る状況を導入し、「時」とも「もし」とも取り得る。本文では自然な条件・状況表現とし、別訳を脚注に残した。
- source_word: תָבֹאוּ מִלְחָמָה
  choice: 戦うことになった
  rationale: 直訳的には「戦いに入る／来る」だが、戦争に従事することを表す慣用句なので、現代日本語として自然に訳した。
- source_word: בְּאַרְצְכֶם
  choice: あなたがたの地で
  rationale: イスラエルに属する領土を指すため、「国」よりも契約的・領土的な響きを保つ「地」とした。
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: あなたがたを苦しめる敵と
  rationale: צַר（敵、圧迫する者）と同語根の分詞 צֹרֵר の重なりを、簡潔ながら両方の意味が出るよう「苦しめる敵」とした。עַל は戦闘の相手を示すので日本語では「と」とした。
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: ラッパで警報を吹き鳴らしなさい
  rationale: רוע のヒフィル形はここでは軍事的な警報の合図を発することを表す。「警報を吹き鳴らす」により、単なる大音量ではなく合図としての機能を示した。
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: あなたがたの神ヤハウェの前で覚えられ
  rationale: זכר のニファル形の受動表現を保ち、神を明示的な能動主語に置き換えなかった。「御前」より平明な「前」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: 敵から救われる
  rationale: ישׁע のニファル形が表す救出・解放を、軍事的文脈にも広い救済的含意にも適合する「救われる」で訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に現れる契約の神の固有名を称号で代替せず、固有名として示した。
- issue: וֲנִזְכַּרְתֶּם の態と神学的含意
  choice: 神ヤハウェの前で覚えられ
  alternative: あなたがたの神ヤハウェが、あなたがたを覚えてくださり
  rationale: ヘブライ語の受動形と「御前で」という構文を保ち、誰がどのように覚えるのかを本文で説明しすぎないようにした。
- issue: ラッパの合図と救いの関係
  choice: そうすれば……覚えられ、……救われる
  alternative: その結果、神が必ず機械的に応答するとの説明を加える
  rationale: 原文の連続する動詞が示す約束の流れは保つ一方、儀式そのものが神を拘束するという解釈は付加しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたがた」で複数形を明示し、命令から約束への流れを「そうすれば」で自然につないだ。受動表現「覚えられ」はやや非日常的だが、原文の曖昧さと神学的緊張を保つため採用し、脚注で自然な解釈的別訳を示した。
