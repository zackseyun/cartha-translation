id: NUM.10.31
reference: Numbers 10:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: ja
  text: 彼は言った。「どうか、私たちから離れないでください。荒野で私たちがどこに宿営すべきかを、あなたは知っているのですから。あなたは私たちの目となるでしょう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたは私たちにとって目となるでしょう」。荒野についての知識を生かして、私たちを案内する者となることを意味する。
    reason: 「目となる」というヘブライ語の比喩を本文に保ち、その案内役としての意味を補足する。未来形である原文に合わせ、依頼ではなく将来への期待として説明する。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: 物語を進めて直接話法を導く標準的な表現。文脈上の話者を明示しつつ、余分な時間関係を加えない。
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: どうか、私たちから離れないでください
  rationale: אַלの禁止とנָאの懇願を、現代日本語の丁寧で切実な依頼として表した。עזבは旅の同行を求める文脈なので、「見捨てる」より中立的な「離れる」とした。
- source_word: כִּי עַל כֵּן
  choice: …のですから
  rationale: 願いの根拠を示す因果関係を自然に表し、訴えかける調子も保つ。
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: 荒野で私たちがどのように宿営すればよいか、あなたは知っている
  rationale: חֲנֹתֵנוּは「私たちの宿営」「私たちが宿営すること」を指し得るため、場所だけに限定せず、荒野での宿営の仕方に関する知識として訳した。
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: 私たちの目となってください
  rationale: 直訳的な「私たちにとって目となる」という比喩を保持した。文脈上は荒野で案内する役割を指すが、本文では比喩を説明語に置き換えない。
theological_decisions:
- issue: 人間の案内役と神の導きとの関係
  choice: ホバブに「私たちの目」となってほしいというモーセの依頼を、そのまま表現した
  alternative: 神の導きとの整合を図る説明を本文に加える
  rationale: 原文は人間の土地勘を頼る依頼と神による導きとの関係を明示的に解決していないため、その緊張を訳文でも保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、懇願の丁寧さと聖書本文としての品位を両立させた。「目となる」という原文の印象的な比喩は本文に残し、脚注で意味を補った。
