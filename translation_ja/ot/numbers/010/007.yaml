base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: ja
  text: しかし、会衆を召集するときには、ラッパを吹きなさい。警報の合図[a]を出してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「警報の吹奏をしてはならない」。ヘブライ語は、通常の吹奏と、周囲の文脈で出発の合図となる特有の警報吹奏とを区別している。
    reason: 語義上の別訳と、通常の吹奏と警報吹奏との文脈上の対比を示すため。
lexical_decisions:
- source_word: וּבְהַקְהִיל
  choice: しかし、…を召集するときには
  rationale: 接続詞、前置詞、קהלのヒフィル不定詞連語形から成り、「召集するとき」の意。前節の出発時の警報吹奏との対比を明確にするため、「しかし」と「には」を用いた。
- source_word: הַקָּהָל
  choice: 会衆
  rationale: ここでは召集されるイスラエルの共同体を指す。宗教的・共同体的な文脈にふさわしく、現代日本語でも理解しやすい。
- source_word: תִּתְקְעוּ
  choice: ラッパを吹き鳴らし
  rationale: תקעはこの文脈では銀のラッパを吹くこと。目的語は原文では省略されているが、日本語では文脈上の「ラッパ」を補うことで、次の特殊な吹奏法との対比が明瞭になる。
- source_word: וְלֹא
  choice: …は…てはならない
  rationale: 否定された指示を自然な現代日本語の規定表現で示した。対比を明確にするため助詞「は」を用いた。
- source_word: תָרִיעוּ
  choice: 警報の合図は吹いてはならない
  rationale: רועのヒフィル形は、ラッパの文脈では単に音を出すことではなく、出発などを知らせる特有の警報吹奏を指す。通常の吹奏との技術的な対比を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な規定文の調子を保ちつつ、共同体的な語として「会衆」を用いた。「ラッパ」は原文の当節では省略されているが、直前の文脈から明白であり、日本語として自然にするため補った。
