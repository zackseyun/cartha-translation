  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: ja
  text: また、イッサカル族の部隊[a]を率いるのは、ツアルの子ネタンエルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軍団」または「隊」とも訳せる。ヘブライ語は、行進の隊列を組んだ組織的な部族集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: また、…を率いるのは
  rationale: 接続詞によって前節から続く名簿形式を「また」で示し、עַלが表す部隊への指揮・統率関係を自然な現代日本語で表した。
- source_word: צְבָא
  choice: 部隊
  rationale: ここでは行進のために秩序立てられた部族集団を指す。「部隊」は組織的な集団という意味を保ちつつ、文脈に合う簡潔で自然な訳語である。
- source_word: מַטֵּה בְּנֵי יִשָׂשכָר
  choice: イッサカル族
  rationale: 直訳は「イッサカルの子らの部族」だが、この定型句ではイッサカルの子孫から成る部族を意味するため、明瞭で慣用的な「イッサカル族」とした。
- source_word: נְתַנְאֵל
  choice: ネタンエル
  rationale: ヘブライ語の人名を、日本語聖書で広く通用する形に音写した。
- source_word: בֶּן צוּעָר
  choice: ツアルの子
  rationale: 父子関係を示すヘブライ語の連語を簡潔にそのまま表した。
