  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו לֹ֣א אֵלֵ֑ךְ כִּ֧י אִם אֶל אַרְצִ֛/י וְ/אֶל מוֹלַדְתִּ֖/י אֵלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: ja
  text: しかし彼はモーセに言った。「私は行きません。むしろ、自分の国と自分の生まれ故郷へ行きます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֵלֵךְ
  choice: 私は行きません
  rationale: 単純な拒否を、文脈に合う自然で明確な現代日本語にした。
- source_word: כִּי אִם
  choice: （独立した次文として）…へ帰ります
  rationale: ここでは先行する否定と対照を成し、「そうではなく、むしろ」の意味を担う。日本語では文を分け、行き先を示すことで対照を自然に表した。
- source_word: אֶל אַרְצִי
  choice: 自分の国
  rationale: 一人称接尾辞を「自分の」と表し、故国・郷土を指し得る אֶרֶץ の基本的な意味を保った。
- source_word: וְאֶל מוֹלַדְתִּי
  choice: 自分の生まれ故郷
  rationale: מוֹלֶדֶת は出生地のほか親族・同族を含意し得るが、この文脈では土地を表す前句と並ぶため「生まれ故郷」とした。
- source_word: אֵלֵךְ
  choice: 帰ります
  rationale: 語義自体は「行く」だが、自国・出生地へ向かう文脈では日本語の「帰る」が自然であり、方向性を明確にする。
