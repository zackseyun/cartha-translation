source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: ja
  text: シメオン族の部隊[a]を率いるのは、ツリシャダイの子シェルミエルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軍勢」または「隊」とも訳せる。ヘブライ語は、行軍のために編成された部族の集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: を率いるのは
  rationale: 行軍隊列の文脈で、עַלは部隊の上に任じられた指揮者を示す。日本語では「を率いるのは」とすることで、その関係を明確かつ自然に表した。接続詞וְは節の連続性を担うが、単独の節として不自然な「そして」を置かず、文脈上の連続性に委ねた。
- source_word: צְבָא
  choice: 部隊
  rationale: ここでは戦闘中の軍隊というより、行軍のために編成された部族単位の集団を指す。「部隊」は組織性を保ちつつ、過度に戦闘的な意味に限定しない。
- source_word: מַטֵּה בְּנֵי שִׁמְעוֹן
  choice: シメオン族
  rationale: 直訳は「シメオンの子らの部族」だが、日本語では慣用的な部族名称「シメオン族」が同じ指示内容を簡潔かつ自然に伝える。
- source_word: שְׁלֻמִיאֵל
  choice: シェルミエル
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: בֶּן
  choice: の子
  rationale: 直接の父称を示す標準的で透明な訳語。
- source_word: צוּרִי שַׁדָּי
  choice: ツリシャダイ
  rationale: ヘブライ語では一つの人名として機能するため、日本語でも一語として音写した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。周辺節に繰り返される指揮者提示の構文を、日本語として自然な「部隊を率いるのは～であった」で表現した。
