  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: ja
  text: 二度目の警報[a]を吹き鳴らすと、南側に宿営している諸部隊が出発する。彼らの出発のために、警報を吹き鳴らさなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「警報」と訳したヘブライ語は、「（ラッパの）強い吹奏」「信号」とも訳せる。宿営する諸部隊に指示を与えるための、特定のラッパの吹き方を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: 吹き鳴らすと
  rationale: תקעはこの文脈ではラッパを吹くこと。二人称複数の命令的な手順を、前後関係が明瞭な現代日本語の条件表現で示した。
- source_word: תְּרוּעָה
  choice: 警報の合図
  rationale: 単なる音ではなく、宿営する諸部隊に移動を指示する特定のラッパ信号を表す。「警報」だけでは危険の告知に限定されやすいため、「合図」を添えた。
- source_word: שֵׁנִית
  choice: 二度目に
  rationale: 二回目の信号であることを自然な日本語で明示した。
- source_word: וְנָסְעוּ
  choice: 出発する
  rationale: נסעは宿営を解いて旅立つことを表す。この手順規定では簡潔な「出発する」が適切。
- source_word: הַמַּחֲנוֹת
  choice: 各部隊
  rationale: 複数の宿営集団、すなわち部族ごとの隊列を指すため、物理的な場所としての「宿営地」より「各部隊」が文脈に合う。
- source_word: הַחֹנִים תֵּימָנָה
  choice: 南側に宿営している
  rationale: 分詞の継続的な状態と、תֵּימָנָהがここでは移動方向より配置位置を示すことを保った。
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: 警報の合図を吹き鳴らさなければならない
  rationale: 能動形の三人称複数を保ち、規定としての意味を「なければならない」で示した。目的語を前置したヘブライ語の強調は、同じ表現の反復によって伝えた。
- source_word: לְמַסְעֵיהֶם
  choice: 彼らが出発する際には
  rationale: 接頭辞לְと複数形が示す、出発の機会・段階に対応する規定を自然な日本語にした。
