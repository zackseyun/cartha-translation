  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: ja
  text: マナセ族の部隊を率いるのは、ペダツルの子ガムリエルであった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」と訳したヘブライ語は、「軍勢」「軍隊」「隊」とも訳せる。ここでは、組織された部族の一団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: を率いるのは
  rationale: この行軍順序の定型句では、部族部隊の上に立つ指揮者を示す。日本語として自然になるよう、責任関係を「率いる」と表した。
- source_word: צְבָא
  choice: 部隊
  rationale: 荒野で組織され、行軍する部族単位を指す。戦闘だけに限定せず、組織された集団という文脈にも合う。
- source_word: מַטֵּה בְּנֵי מְנַשֶּׁה
  choice: マナセ族
  rationale: 直訳は「マナセの子らの部族」だが、ここではマナセの子孫から成る部族を指すため、明瞭で慣用的な「マナセ族」とした。
- source_word: גַּמְלִיאֵל
  choice: ガムリエル
  rationale: 固有名を日本語の一般的な聖書音写に従って表記した。
- source_word: בֶּן
  choice: の子
  rationale: 父子関係を示す標準的で簡潔な系譜表現。
- source_word: פְּדָה צוּר
  choice: ペダツル
  rationale: 本文上は二要素に分かれて見えるが、一つの人名として音写した。
