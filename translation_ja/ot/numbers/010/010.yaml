id: NUM.10.10
reference: Numbers 10:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: ja
  text: また、あなたがたの喜びの日、定められた時、月の初め[a]には、全焼のささげ物と平和のいけにえ[b]に添えて、ラッパを吹き鳴らしなさい。そのラッパの音は、あなたがたのために、あなたがたの神の前で記念となる。わたしはヤハウェ、あなたがたの神である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「新月の日」とも訳せる。ヘブライ語では直訳すると「あなたがたの月々の初め」。
    reason: lexical_alternative
  - marker: b
    text: 「交わりのいけにえ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: あなたがたの喜び
  rationale: 名詞の基本義である「喜び」を保ち、「喜びの日」という自然で荘重な表現にした。
- source_word: מוֹעֲדֵיכֶם
  choice: 定められた時
  rationale: 祭りに限定しすぎず、礼拝のために定められた時という語の広がりを保った。
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: 月の初め
  rationale: 直訳的な「月々の頭」を自然な日本語にしつつ、暦上の月初を示す原文を反映した。文脈上は新月の日を指し得るため脚注を付した。
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: ラッパを吹き鳴らしなさい
  rationale: 命令的な未完了形と、ラッパを吹く行為を明確で自然な日本語で表した。
- source_word: עַל עֹלֹתֵיכֶם וְעַל זִבְחֵי שַׁלְמֵיכֶם
  choice: 全焼のささげ物と交わりのいけにえをささげる際に
  rationale: עַל の空間的な直訳「〜の上で」は日本語では誤解を招くため、供犠に伴ってラッパを吹く儀礼的関係を「ささげる際に」で表した。
- source_word: עֹלֹתֵיכֶם
  choice: 全焼のささげ物
  rationale: 祭儀用語 עֹלָה が祭壇上で全て焼かれる供え物であることを、現代の読者にも分かる名称で示した。
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: 交わりのいけにえ
  rationale: שְׁלָמִים の共同の食事と交わりを伴う供犠という側面を表しつつ、「いけにえ」により祭儀的性格を保った。別訳を脚注に示した。
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן לִפְנֵי אֱלֹהֵיכֶם
  choice: それは、あなたがたの神の前で、あなたがたを覚えていただくためのしるしとなる
  rationale: זִכָּרוֹן の祭儀的な記念・想起の機能を示した。「それ」はラッパを吹くこと、またはその音を受ける集合的表現として扱い、神の前で民が覚えられるという文脈上の方向性を自然に表現した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語音写で示した。
theological_decisions:
- issue: לְזִכָּרוֹן の想起の主体と対象
  choice: あなたがたを覚えていただくためのしるし
  alternative: あなたがたのための記念
  rationale: 原文は字義的には「あなたがたのための記念として、あなたがたの神の前に」であり、誰が何を思い起こすかを完全には明示しない。直前の10:9と祭儀的用法を踏まえ、神の前で民が覚えられる機能を本文に表したが、語そのものの簡潔さには解釈の余地がある。
- issue: שְׁלָמִים の訳語
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平和のささげ物
  rationale: 語は平安・完全・交わりに関わる祭儀用語で、一つの日本語では全含意を表せない。共同の食事を伴う性格が伝わる訳を本文に採り、伝統的な別訳を脚注に残した。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を用いているため、称号「主」へ置換せず音写した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい荘重さを保った。「あなたがた」を一貫して用い、祭儀用語には理解しやすさと原語の含意の両立を図った。
