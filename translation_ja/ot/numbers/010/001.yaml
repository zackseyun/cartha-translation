source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の固有名「YHWH」。一般に「ヤハウェ」（または「ヤーウェ」）と読まれる。
    reason: 原文の四文字神名と、その推定される読みを示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: וַיְדַבֵּרは新たな叙述を始める神の発話定型。日本語では、後続のלֵאמֹרを不自然に重ねず、直接の語りかけを自然かつ格調を保って表す「告げた」とした。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 本文の神名は四文字神名יהוה。日本語聖書で広く定着した「主」を本文に置き、固有名であることと推定発音を脚注で明示した。
- source_word: אֶל
  choice: に
  rationale: 発話の相手を示す前置詞であり、現代日本語では「モーセに」が自然。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を採用した。
- source_word: לֵאמֹר
  choice: （「告げた」に含める）
  rationale: 直接話法の内容を導く定型的な不定詞。日本語で「語って言った」とすると冗長なため、発話導入の「告げた」に統合した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: 主[a]
  alternative: ヤハウェ／ヤーウェ
  rationale: יהוהが称号ではなく神の固有名であることは脚注で保持する一方、本文は明瞭で自然な現代標準日本語と日本語聖書の定着した用法を考慮して「主」とした。発音は確定不能なので脚注では推定形として示す。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。ヘブライ語の「語った、言って」という定型を逐語的に重ねず、日本語の発話導入として自然な一文にした。
