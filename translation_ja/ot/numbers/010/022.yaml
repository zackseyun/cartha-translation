source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: ja
  text: 次に、エフライム族の宿営の旗印[a]が、部隊ごとに[b]進み始めた。その部隊を率いていたのは、アミフドの子エリシャマであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旗」とも訳せる。ヘブライ語は、宿営集団がその下にまとまって行進した部族の標識を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「それぞれの部隊に従って」。ヘブライ語には、軍隊のように組織された宿営内の集団という含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: 次に……出発した
  rationale: 接続詞を伴う完了形が行進の物語を順に進めているため、「次に」で継起を示し、移動開始を自然な現代日本語の「出発した」で表した。
- source_word: דֶּגֶל
  choice: 旗印
  rationale: 単なる旗ではなく、各宿営集団がその下にまとまって行進する部族の標識を指すため、「旗印」とした。
- source_word: מַחֲנֵה
  choice: 宿営
  rationale: 荒野で陣営を組む集団とその宿営を表す語であり、この箇所では旗印に属する宿営集団を指す。「宿営」は文脈と民数記の用語に適する。
- source_word: בְנֵי אֶפְרַיִם
  choice: エフライム族
  rationale: 字義的には「エフライムの子ら」だが、ここでは祖先エフライムに属する部族全体の定型的呼称であるため、現代日本語で誤解の少ない「エフライム族」とした。
- source_word: לְצִבְאֹתָם
  choice: 部隊ごとに
  rationale: 戦闘そのものより、秩序立てて編成された複数の集団に従って進むことを表すため、「部隊ごとに」とした。軍隊的な編成の含みは脚注で補う。
- source_word: וְעַל צְבָאוֹ
  choice: その部隊を率いていたのは
  rationale: עַל はエリシャマが単数の部隊の上に立つ指導者であることを示す。日本語として自然にしつつ、その統率関係を明示した。
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: アミフドの子エリシャマ
  rationale: 固有名を標準的に音写し、בֶּן の父子関係を「……の子」で保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「エフライムの子ら」という逐語表現は実子だけを指すとの誤解を招きやすいため、部族呼称として「エフライム族」とした。前半の主語である「旗印」は、旗そのものだけでなくその下に属する宿営集団を代表する換喩として原文どおり保持した。
