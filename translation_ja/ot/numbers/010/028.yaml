  text: אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/צִבְאֹתָ֑/ם וַ/יִּסָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: ja
  text: 以上が、イスラエルの子らが部隊ごとに進んだ行程である。そして彼らは出発した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上が…である
  rationale: 複数指示詞による直前の記述の総括。ヘブライ語には明示的な連辞がないが、日本語では回顧的なまとめとして自然に表した。
- source_word: מַסְעֵי
  choice: 行程
  rationale: מסע の構成形複数で、旅の各段階または移動を指す。文脈上、複数回の出発をまとめた「行程」が簡潔で自然である。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保ち、「イスラエル人」と意訳せず原文の形を反映した。
- source_word: לְצִבְאֹתָם
  choice: 部隊ごとに
  rationale: צָבָא の複数形は、秩序立てて編成された集団を表す。実戦中との含みを強めず、行軍時の組織単位を明瞭に示す。
- source_word: וַיִּסָּעוּ
  choice: そして彼らは出発した
  rationale: נסע の物語的用法で、ある場所から移動を開始することを表す。現代日本語として自然な「出発した」を採用した。
