  text: וְ/עַל צְבָ֖א מַטֵּ֣ה בְנֵי גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: ja
  text: ガド族の部隊を率いるのは、デウエルの子エルヤサフであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」は「軍勢」または「隊」とも訳せる。ヘブライ語には軍事的な響きがあるが、ここでは秩序立って行進する部族ごとの集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: を率いるのは
  rationale: この反復される指揮者一覧の構文では、עַל は部隊の上に立つ指揮・監督関係を示す。日本語では文脈に即して「率いる」とした。接続詞 וְ は節の連続によって自然に表されるため、独立した「そして」は置かなかった。
- source_word: צְבָא
  choice: 部隊
  rationale: צָבָא には軍事的含意がある一方、ここでは秩序立って進む各部族の編成集団を指す。「部隊」はその組織性を簡潔に伝える。
- source_word: מַטֵּה בְנֵי גָד
  choice: ガド族
  rationale: מַטֶּה はここでは杖ではなく部族を意味し、בְנֵי גָד はガドの子孫から成る部族の慣用的呼称である。現代日本語として自然な「ガド族」とした。
- source_word: אֶלְיָסָף
  choice: エルヤサフ
  rationale: ヘブライ語名の音写として、日本語聖書で通用する形を用いた。
- source_word: בֶּן דְּעוּאֵל
  choice: デウエルの子
  rationale: ヘブライ語の父称表現を簡潔かつ直接的に再現した。
