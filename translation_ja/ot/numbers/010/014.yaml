    rationale: 第一文で出発する主体を旗印を掲げる宿営として明確にすれば、第二文の単数の『その部隊』がユダの行軍単位を指すことも明瞭になる。
  revised_text: 旗印を掲げるユダ族の宿営が、その部隊ごとに先頭で出発した。その部隊を率いる者は、アミナダブの子ナフションであった。
