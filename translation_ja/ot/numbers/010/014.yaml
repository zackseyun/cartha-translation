  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: ja
  text: 旗印を掲げるユダ族の宿営が、その部隊ごとに先頭で出発した。その部隊を率いる者は、アミナダブの子ナフションであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 出発した
  rationale: 荒野の旅で宿営をたたんで次へ進み始めることを表す。現代日本語として自然で、行進開始の文脈にも合う。
- source_word: דֶּגֶל מַחֲנֵה
  choice: 宿営の旗印の組
  rationale: דֶּגֶלは旗そのものだけでなく、その旗のもとに編成された宿営集団も指しうる。ここでは動詞の主語として集団が出発するため、「旗印の組」として両面を示した。
- source_word: בְנֵי יְהוּדָה
  choice: ユダ族
  rationale: 直訳は「ユダの子ら」だが、ここでは系譜上の個々の息子ではなく部族集団を指すため、明瞭な現代日本語の「ユダ族」とした。
- source_word: בָּרִאשֹׁנָה
  choice: 先頭に立って
  rationale: 行進順序の第一番を示す副詞。単なる時間的な「最初に」より、隊列の文脈を自然に表す。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָאの複数形は、ここでは秩序立てて編成された軍事的な集団を表す。「軍勢」よりも過度に戦闘を強調しない「部隊」が適切。
- source_word: וְעַל צְבָאוֹ
  choice: その部隊を率いるのは
  rationale: עַלはここで部隊に対する指揮・責任を表す。ヘブライ語の構造を日本語として自然な指導表現にした。
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: アミナダブの子ナフション
  rationale: 固有名を一般的な日本語聖書表記に沿って音写し、父子関係を原文どおり保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「旗印の組」により、旗と、そのもとに編成された宿営単位というדֶּגֶלの語義を本文内で自然に表現した。原文に明示されない「指導者」などの肩書きは補わず、指揮関係は動詞表現で示した。
