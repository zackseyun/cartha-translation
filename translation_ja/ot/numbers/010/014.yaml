    issue: 「ユダ族の宿営の旗印の組」の構文が不自然で指示対象が曖昧
    rationale: דֶּגֶל מַחֲנֵה בְנֵי יְהוּדָה はユダの子らの宿営に属する旗印／旗印のもとの行軍単位を指す。現行の名詞連結では「旗印の組」が何に属するかが読み取りにくい。
  - severity: low
