  source_fidelity: 原文は「ユダの子らの宿営の旗印（の部隊）が、その軍団／部隊ごとに最初に出発した。そしてその軍団の上にナフションがいた」と述べる。現行訳は全体の意味をおおむね伝えるが、「宿営の旗印の組」は係り受けが不自然で、原文の『ユダ族の宿営』との関係も曖昧になる。
  naturalness: 「ユダ族の宿営の旗印の組」は現代標準日本語として重なりが多く、何が出発したのか把握しにくい。「旗印を掲げるユダ族の宿営」のように、旗印のもとに組織された集団であることを明示するのが自然である。
  terminology: דֶּגֶלはこの文脈では旗印と、その下の行軍単位に関わる語であり、「旗印を掲げる…宿営」とすることで両義性を過度に限定しない。לְצִבְאֹתָם と צְבָאוֹ は同じ語根であるため、「部隊ごとに」および「その部隊を率いる者」と対応させる。人名はナフション、アミナダブでよい。
  issues:
