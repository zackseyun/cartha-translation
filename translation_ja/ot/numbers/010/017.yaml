  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: ja
  text: 幕屋が取り外され、幕屋を運ぶゲルションの子らとメラリの子らが出発した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  choice: 取り外され
  rationale: ホファル形の受動・使役的意味を保ちつつ、設営されていた幕屋を解体して運べる状態にする文脈を自然な現代日本語で表す。「降ろされ」ではこの場面で不自然であり、「解体され」は作業内容をやや限定しすぎる。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記・民数記でイスラエルの移動式聖所を指す定着した訳語である。二度目も原文どおり同じ語として受け止め、明記されていない「部材」は補わない。
- source_word: וְנָסְעוּ
  choice: 出発した
  rationale: נסע は宿営をたたんで移動を始めることを表す。ここでは簡潔で自然な「出発した」が適切である。
- source_word: בְנֵי גֵרְשׁוֹן
  choice: ゲルションの子ら
  rationale: 原文の氏族的表現「ゲルションの子ら」を保ち、「ゲルション族」と言い換えない。
- source_word: וּבְנֵי מְרָרִי
  choice: メラリの子ら
  rationale: 並行する原文の「メラリの子ら」をそのまま保ち、氏族名への意訳を避ける。
- source_word: נֹשְׂאֵי
  choice: 運ぶ
  rationale: 分詞が彼らの役割を説明していることを、連体修飾によって明快な現代日本語にする。
theological_decisions: []
translation_notes:
  register: 簡潔で品位ある現代標準日本語。原文では「幕屋」が二度現れるが、日本語では「幕屋を運ぶ」を氏族名の前に置くことで反復を保ちつつ自然な語順にした。「ゲルションの子ら」「メラリの子ら」は原文の系譜的・氏族的表現を維持した。
