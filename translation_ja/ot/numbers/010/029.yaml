revisions:
- from: モーセは、ミディアン人レウエルの子ホバブ、すなわちモーセのしゅうと[a]に言った。「私たちは、ヤハウェが『あなたがたに与える』と言われた場所へ旅立とうとしています。私たちと一緒に来てください。私たちはあなたに良くします。ヤハウェがイスラエルに良いことを告げておられるからです。」
  to: モーセは、ミディアン人レウエルの子ホバブ、モーセの義父[a]に言った。「私たちは、ヤハウェが『その場所をあなたがたに与える』と言われた場所へ旅立とうとしています。私たちと一緒に来てください。私たちはあなたに良いことをします。ヤハウェがイスラエルについて良いことを語られたからです。」
  rationale: 原文の完了形と「イスラエルについて」という関係を回復し、目的語「その場所」を明示しました。また、現代標準日本語として不自然な表現を改めつつ、ホバブとモーセの婚姻関係についての原文上の曖昧さは脚注に残しました。
