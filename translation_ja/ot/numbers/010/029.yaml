id: NUM.10.29
reference: Numbers 10:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: ja
  text: モーセは、ミディアン人レウエルの子ホバブ、モーセの義父[a]に言った。「私たちは、ヤハウェが『その場所をあなたがたに与える』と言われた場所へ旅立とうとしています。私たちと一緒に来てください。私たちはあなたに良いことをします。ヤハウェがイスラエルについて良いことを語られたからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の חֹתֵן は、婚姻による親族を広く指すことがあります。そのため、ここを「モーセの義兄弟」または「モーセの姻戚」と理解する見方もあります。
    reason: 本文では最も一般的な意味の「義父」を採る一方、原語が示す続柄の幅と、この箇所の系譜上の不確定さを保持するため。
lexical_decisions:
- source_word: חֹבָב
  choice: ホバブ
  rationale: 人名として、ヘブライ語の発音に基づく一般的な日本語表記を用いた。
- source_word: רְעוּאֵל
  choice: レウエル
  rationale: 人名として音写した。
- source_word: הַמִּדְיָנִי
  choice: ミディアン人
  rationale: 定冠詞を伴う民族呼称であり、現代日本語では簡潔に「ミディアン人」とするのが自然である。
- source_word: חֹתֵן מֹשֶׁה
  choice: モーセのしゅうと
  rationale: חֹתֵןは婚姻による親族、とりわけ義父を指し得る。「しゅうと」は文脈上もっとも一般的な理解を示しつつ、厳密な続柄の曖昧さは脚注に残した。
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: 私たちは……旅立とうとしています
  rationale: 分詞と独立代名詞が表す、進行中または目前に迫った出発を自然な日本語で示した。
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: ヤハウェが『あなたがたに与える』と言われた
  rationale: 「それ」を日本語では先行詞「場所」に含ませ、神の直接の約束と複数形の「あなたがた」を保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
- source_word: לְכָה אִתָּנוּ
  choice: 私たちと一緒に来てください
  rationale: 話者が同行を求める招きを、明瞭で自然な日本語にした。
- source_word: וְהֵטַבְנוּ לָךְ
  choice: 私たちはあなたに良くします
  rationale: יטבの使役形が表す、相手の益となる行為を、解釈を加えすぎずに保持した。
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: イスラエルに良いことを告げておられる
  rationale: 「語る」という原文の動詞と「良いこと」を保ちつつ、עַלをこの文脈で受益的な「イスラエルに」とした。「約束された」とまでは限定しなかった。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いているため、称号で代替せず「ヤハウェ」と音写した。
- issue: חֹתֵן מֹשֶׁה が示す続柄
  choice: モーセのしゅうと
  alternative: モーセの義兄弟、モーセの姻戚
  rationale: 語の一般的な意味として義父を本文に採ったが、婚姻関係にある親族を広く指し得るため、特定しきれない可能性を脚注で明示した。
- issue: דִּבֶּר טוֹב の含意
  choice: 良いことを告げておられる
  alternative: 良いことを約束された
  rationale: 文脈上は約束を含み得るが、原文は「語った」としているため、神学的含意を狭めず発話の表現を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、直接話法の丁寧な招きには「来てください」を採用した。「しゅうと」は日常的に理解可能だが表記上の続柄が曖昧になり得るため、平仮名表記と脚注を組み合わせた。全体は尊厳を保ちつつ、過度に古風な語尾や漢語を避けた。
