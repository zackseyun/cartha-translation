id: NUM.10.33
reference: Numbers 10:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: ja
  text: こうして彼らはヤハウェの山を出発し、三日間の道のりを進んだ[a]。ヤハウェの契約の箱は、彼らに先立って三日間の道のりを進み、彼らのために休む場所を探し出した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「三日の道」。三日を要する旅程、またはその距離を表す。
    reason: lexical_alternative
  - marker: b
    text: 「探し出す」は「偵察する」「捜し求める」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出発し、進んだ
  rationale: נסעは宿営をたたんで旅立つことを表す。日本語では「出発し」だけでは後続する道のりとの結び付きが弱いため、「進んだ」を添えて自然な移動描写とした。
- source_word: מֵהַר יְהוָה
  choice: ヤハウェの山を
  rationale: הַרを「山」、起点を示すמִןを日本語として自然な「山を出発し」で表した。神名は固有名として「ヤハウェ」とした。
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 三日間の道のり
  rationale: 時間の長さだけでなく、三日を要する旅程・距離を示す表現であるため、「三日間」だけでなく「道のり」を明示した。
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: ヤハウェの契約の箱
  rationale: 連語の関係を保ちつつ、日本語で自然な所有・所属関係として表現した。
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: 彼らの先に進んだ
  rationale: 分詞の継続的な移動を文脈に即して表し、לִפְנֵיהֶםの空間的意味を明確にした。
- source_word: לָתוּר
  choice: 探し出す
  rationale: תורには探索して適切なものを見いだす含意がある。軍事的な「偵察する」より、この文脈に適した表現とした。
- source_word: מְנוּחָה
  choice: 休む場所
  rationale: ここでは抽象的な安息よりも、旅の途中で宿営し休息できる具体的な場所を指すと判断した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名を保つ音写を採用した。
- issue: 契約の箱が先行することの表現
  choice: 彼らの先に進んだ
  alternative: 彼らに先立って進んでいた
  rationale: 箱が民より前方を進んだという本文の空間的叙述をそのまま示し、その神学的意味を訳文で説明しすぎないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書叙述にふさわしい簡潔で格調ある文体とした。同じ「三日間の道のり」を二度保ち、原文の反復を残した。
