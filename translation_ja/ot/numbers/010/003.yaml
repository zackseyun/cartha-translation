  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: ja
  text: 二本のラッパを吹き鳴らすと[a]、全会衆はあなたのもとへ、会見の天幕の入口に集まる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「彼らがそれらを吹き鳴らし、全会衆はあなたのもとへ集まる」。
    reason: 接続表現には、時を示す「吹き鳴らすと」のほか、動作を順に並べる訳し方も可能なため。
lexical_decisions:
- source_word: וְתָקְעוּ בָהֵן
  choice: 二本のラッパを吹き鳴らすと
  rationale: תקעはラッパについて「吹く、吹き鳴らす」の意。接続詞を伴う完了形は、この指示の流れでは次の動作が起こる時を示すと理解し、自然な日本語の条件・時の表現「吹き鳴らすと」とした。בָהֵןの女性複数代名詞は前節の二本の銀のラッパを指すため、指示対象を明示した。
- source_word: וְנוֹעֲדוּ
  choice: 集まる
  rationale: יעדのニファル形で、合図に応じて定められた場所に集合することを表す。現代日本語で明快な「集まる」を採用した。
- source_word: אֵלֶיךָ
  choice: あなたのもと
  rationale: 字義は「あなたへ」。モーセのいる所に会衆が集合する意味を、方向と対面性の双方を保つ「あなたのもと」で表した。
- source_word: כָּל הָעֵדָה
  choice: 全会衆
  rationale: עֵדָהはイスラエル共同体の会衆を指す。民数記での共同体的意味を簡潔に伝えるため「全会衆」とした。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口
  rationale: פֶּתַחは出入り口、אֹהֶל מוֹעֵדは神との定められた会見の場である天幕を指す。定着した聖書用語として理解しやすい「会見の天幕」を用いた。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、共同体の公的な召集にふさわしい簡潔で荘重な調子を保った。「あなたのもと、会見の天幕の入り口に」は、ヘブライ語の二つの方向・場所表現を統合しすぎず並置している。
