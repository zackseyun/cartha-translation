  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: ja
  text: 自分のために銀のラッパを二本作りなさい。それらを打ち出して作りなさい。それらは、会衆を召集するため[a]、また宿営を出発させるため[b]に、あなたのためのものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「会衆を呼び集めるため」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「宿営が出発するため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: あなたは……作りなさい
  rationale: לְךָには「自分のために／自分の用として」の含みがあるが、日本語では後半の用途表現と合わせ、命令の主体を明示する自然な形とした。
- source_word: שְׁתֵּי חֲצֽוֹצְרֹת כֶּסֶף
  choice: 銀のラッパを二本
  rationale: חֲצֹצְרָהは角笛ではなく金属製の直管状ラッパを指す。材質を表すכֶּסֶףを自然な日本語で「銀の」とした。
- source_word: מִקְשָׁה
  choice: 打ち出し細工
  rationale: 金属を槌で打って成形する製法を表す。「一枚作り」は結果を限定しすぎるため避けた。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: それらを作り
  rationale: 最初の命令を受ける指示的な未完了形。日本語では重複を保ちつつ、文を自然につなぐ連用形とした。
- source_word: וְהָיוּ לְךָ
  choice: ……に用いなさい
  rationale: 直訳的な「あなたのためのものとなる」より、続く二つの目的を明確に示す機能的な日本語とした。
- source_word: לְמִקְרָא הָעֵדָה
  choice: 会衆を召集するため
  rationale: מִקְרָאはここでは呼び集めること、הָעֵדָהはイスラエルの共同体を指す。「召集」はラッパの公的用途を簡潔に表す。
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: 宿営を出発させるため
  rationale: מַסַּעは出発・旅立ちを表し、目的を示す構文と目的語標識を踏まえて、各宿営に出発を開始させる合図という意味を表した。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用い、命令文としての威厳を保った。「ラッパ」は角笛との区別が文脈上明らかになるよう「銀の」と結びつけ、「打ち出し細工」で古代の金属加工法を簡潔に示した。
