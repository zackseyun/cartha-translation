  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: ja
  text: イスラエルの子ら[a]は、シナイの荒野を出て、行程を重ねて進んだ。そして、雲はパランの荒野にとどまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は「イスラエル人」とも訳せる。ヘブライ語では「イスラエルの息子たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出て、…進んだ
  rationale: נסעは宿営をたたんで出発し、移動することを表す。文脈に即して、現代日本語で自然な「出て、…進んだ」とした。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の男性複数の親族表現を明示的に保つ。「イスラエル人」は自然な集合表現だが、原文の比喩的な家族表現が見えにくくなる。
- source_word: לְמַסְעֵיהֶם
  choice: 行程を重ねて
  rationale: מַסָּעの複数形は旅の連続する区間や宿営地から宿営地への行程を指す。「行程を重ねて」は分節的な移動を自然に示す。
- source_word: מִמִּדְבַּר סִינָי
  choice: シナイの荒野を出て
  rationale: מִדְבָּרは未耕作の荒れ地を指し、必ずしも砂だけの砂漠ではないため「荒野」とした。前置詞מִןの起点も「を出て」で明示した。
- source_word: וַיִּשְׁכֹּן
  choice: とどまった
  rationale: שכןは住む、落ち着く意。ここでは導きの雲が移動を止めてその場所に留まることなので、「とどまった」が自然である。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 定冠詞付きで、荒野の旅を導く既知の雲を指す。日本語では文脈上「雲」で特定性が保たれる。
- source_word: בְּמִדְבַּר פָּארָן
  choice: パランの荒野に
  rationale: 地名פָּארָןを「パラン」と音写し、מִדְבָּרは一貫して「荒野」と訳した。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵלの訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 教理上の争点ではないが、原文の男性複数の家族的表現を本文に保った。現代日本語としてより慣用的な集合名詞は脚注に示した。
- issue: 雲の神学的同定
  choice: 単に「雲」と訳す
  alternative: 主の雲／神の臨在の雲
  rationale: 文脈上は神の導きの雲だが、この節の原文はהֶעָנָן「その雲」とだけ述べるため、説明的な神学語を本文に加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「旅程に従って」のような逐語的で硬い表現を避け、「行程を重ねて」で移動の段階性を表した。脚注記号は対応箇所を明確にするため節末ではなく「イスラエルの子ら」の直後に置くべきところ、提出本文では末尾にあるため要修正。
