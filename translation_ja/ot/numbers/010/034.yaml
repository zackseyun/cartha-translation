  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: ja
  text: 彼らが宿営地から出発するとき、昼の間、ヤハウェの雲が彼らの上にあった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲנַן יְהוָה
  choice: ヤハウェの雲
  rationale: עָנָןは「雲」。神名との連語を自然な日本語の属格で表し、文脈上特定された雲として訳した。冒頭の接続詞וַは、日本語では前後の連続性が明らかなため明示せず、自然な叙述とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語音写で示した。
- source_word: עֲלֵיהֶם
  choice: 彼らの上にあった
  rationale: 前置詞עַלの位置関係を素直に表し、守護という含意を訳文で断定せず、原文の空間的表現を保った。
- source_word: יוֹמָם
  choice: 昼の間
  rationale: 「昼に／昼間」を意味する副詞であり、雲が彼らの上にある時間帯を明確に示した。
- source_word: בְּנָסְעָם
  choice: 彼らが…出発するとき
  rationale: נסעの不定詞構文を時間節として訳し、宿営を解いて進み始める動作を自然な現代日本語で表した。
- source_word: מִן הַמַּחֲנֶה
  choice: 宿営地から
  rationale: מַחֲנֶהはここではイスラエルが宿営していた場所を指すため、「宿営地」とした。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いていることを保ち、称号への置換や別の伝統的音写を採用しなかった。
- issue: 雲とイスラエルとの位置関係
  choice: 彼らの上にあった
  alternative: 彼らを覆っていた／彼らを守っていた
  rationale: עַלが表す位置をそのまま示し、雲の守護的機能を本文以上に明示しないことで、原文の含意の幅を保った。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。荒野の旅程を語る叙述として落ち着いた格調を保ちつつ、古風な語順や過度な補足は避けた。
