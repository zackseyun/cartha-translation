  text: וַ/יִּֽחַר אַ֧ף יְהוָ֛ה בָּ֖/ם וַ/יֵּלַֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: ja
  text: ヤハウェの怒りは彼らに対して燃え上がり[a]、そしてヤハウェは去って行かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「ヤハウェの鼻が彼らに対して熱くなった」。これは、ヤハウェの怒りが彼らに対して燃え上がったことを表す慣用句。
    reason: 原文の身体表現と熱の比喩を示すため。
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒りは……燃え上がり
  rationale: 直訳では「鼻が熱くなる」だが、これは怒りを表すヘブライ語の慣用句。「怒り」と明示しつつ、「燃え上がる」によって原文の熱の比喩を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神の固有名を日本語で音写した。
- source_word: בָּם
  choice: 彼らに対して
  rationale: ここでは神の怒りが向けられる対象を示すため、自然な日本語で「彼らに対して」とした。
- source_word: וַיֵּלַךְ
  choice: そしてヤハウェは去って行かれた
  rationale: הלךはこの文脈でその場から離れることを表す。日本語では主語を補い、敬意を示す表現で明確にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有名を保持し、称号への置換や別の伝統的音写を採用しなかった。
- issue: 神が「去った」という描写
  choice: 去って行かれた
  alternative: 臨在を取り去られた
  rationale: 原文は単に「行った／去った」と述べており、臨在の性質について解釈を加えない表現とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の行為には自然な敬語を用いた。「燃え上がり」により原文の比喩的な力を保った。
