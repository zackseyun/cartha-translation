  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: ja
  text: モーセという人は、地上のどの人にもまさって、非常に謙遜であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאִישׁ מֹשֶׁה
  choice: モーセという人は
  rationale: 接続詞וְは文脈上の継続を示すが、日本語で機械的に「そして」とせず自然な叙述とした。הָאִישׁを省略せず、「モーセという人」としてヘブライ語の表現を保った。
- source_word: ענו
  choice: 謙遜な人
  rationale: 文脈ではモーセの性質を表し、「謙遜」が最も自然である。「柔和」も可能だが、ここでは自己を低くする態度をより明瞭に表す。述語として自然な日本語にするため「人」を補った。
- source_word: מְאֹד
  choice: 非常に
  rationale: 強意の副詞を現代標準語で明確に表した。
- source_word: מִכֹּל הָאָדָם
  choice: だれよりも
  rationale: מן＋כלの比較構文と、集合的・総称的なאָדָםを、性別を限定しない自然な日本語の比較表現で表した。
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: 地上の
  rationale: 直訳的な「大地の面にいる」より、日本語で定着した「地上の」を用い、全地に住む人々という範囲を簡潔に示した。
theological_decisions:
- issue: ענוが示すモーセの性質
  choice: 謙遜な
  alternative: 柔和な／苦しめられた
  rationale: 形容詞はこの文脈で内面的な低さやへりくだりを表すと理解するのが自然。ただし「柔和」という語義的可能性はあるため、訳語によって弱さや受動性を過度に含ませないようにした。
- issue: הָאָדָםの総称的範囲
  choice: だれ
  alternative: どの人／すべての人
  rationale: ここでは男性だけでなく人間一般を指す総称である。「だれよりも」は日本語でその包括的な比較を自然に伝える。
translation_notes:
  register: 明瞭で格調を保った現代日本語。「非常に謙遜な人」は原文の強意を明示し、「地上のだれよりも」によって比較の範囲を自然に示した。
