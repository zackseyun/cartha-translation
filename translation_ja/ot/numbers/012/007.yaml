  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: ja
  text: 「そうではない。わたしのしもべモーセは、わたしの家[a]全体において忠実である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの家」は、「わたしの家の者たち」または「わたしの領域全体」という意味にも取れる。ヘブライ語の「家」は、建物だけでなく、家族・家に属する者たち・その領域を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: そうではない
  rationale: 直前まで述べられた預言者一般との強い対比を、簡潔で自然な現代日本語で示す。原文に明示されない接続語は補わない。
- source_word: עַבְדִּי
  choice: わたしのしもべ
  rationale: ここでは隷属身分よりも、神に仕える者としてのモーセの尊称・職分が前面に出ている。「奴隷」ではなく、聖書文体として定着しつつ意味も明瞭な「しもべ」とする。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着した固有名表記を用いる。
- source_word: בְּכָל בֵּיתִי
  choice: わたしの家全体において
  rationale: 前置詞בְと「家」の比喩を保ち、「家」を家屋だけに限定せず、家に属する全領域を含み得る表現とした。「治める」などの役割は原文にないため補わない。
- source_word: נֶאֱמָן
  choice: 忠実である
  rationale: 信頼できること、任された務めに忠実であることを表す語であり、この文脈では「忠実」が最も自然で、後代の聖書内での響きも保持する。
- source_word: הוּא
  choice: 彼は
  rationale: 独立代名詞の主語を明示し、前文との区切りを保ちながら自然な日本語の叙述とする。
theological_decisions:
- issue: モーセの立場に関する「わたしの家」の意味
  choice: 本文では「わたしの家」という比喩を保持する。
  alternative: 「わたしの家の者たち全体」「わたしの民全体」「わたしの全領域」
  rationale: 原文のבֵּיתは家屋に限らず家族・家に属する者や領域を指し得るが、ここで一つに限定すると解釈を先取りする。比喩を残すことで、神の共同体や領域を含む意味の広がりと、後の聖書本文との相互的な響きを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そうではない」で原文の簡潔で強い対比を再現し、「家」の比喩と「忠実」という重要語を保持した。「において」はやや改まった表現だが、神の宣言として自然であり、בְの関係を過度に解釈せず伝える。
