  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: ja
  text: 雲が天幕の上から離れた。すると、なんと、ミリアムは皮膚病[a]に冒され、雪のように白くなっていた。アロンはミリアムの方を向いた。すると、なんと、彼女は皮膚病に冒されていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「皮膚病」と訳したヘブライ語は、深刻な皮膚の疾患や儀礼上の不浄に関わる皮膚の異常を広く指すことがあり、現代医学でいうハンセン病とは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: 雲
  rationale: 定冠詞付きの名詞で、文脈上、主の臨在に伴う特定の雲を指す。日本語では文脈により特定性が明らかなため「雲」とした。
- source_word: סָר
  choice: 離れた
  rationale: 上方にあった雲がそこから移り去る動きを、自然で簡潔な現代日本語で表した。
- source_word: מֵעַל הָאֹהֶל
  choice: 天幕の上から
  rationale: מֵעַל が表す、上方の位置から離れる方向を明示した。אֹהֶל はここでは会見の天幕を指すが、原文どおり簡潔に「天幕」とした。
- source_word: וְהִנֵּה
  choice: すると、なんと／なんと
  rationale: 突然目の前に現れた事態への驚きと注意喚起を、古風すぎない日本語で保持した。二度の反復も残した。
- source_word: מְצֹרַעַת
  choice: 皮膚病に冒されていた
  rationale: この語が指す状態は現代医学のハンセン病に限定できないため、「らい病」とせず、より広い「皮膚病」とした。状態の深刻さは「冒されていた」で表した。
- source_word: כַּשָּׁלֶג
  choice: 雪のような姿になっていた
  rationale: 原文の短い直喩「雪のように」を保ちつつ、日本語として何が雪のようなのか理解できる形にした。「白い」を明示的に補わず、比喩の含みを残した。
- source_word: וַיִּפֶן ... אֶל־מִרְיָם
  choice: アロンがミリアムの方を向くと
  rationale: פנה の身体的に向きを変える動作と、אֶל の方向性を自然に表した。
theological_decisions:
- issue: מְצֹרַעַת が示す病態の同定
  choice: 本文では「皮膚病」とし、注で語義の範囲を説明する
  alternative: 「らい病」「ハンセン病」と訳す
  rationale: 聖書ヘブライ語の語は儀礼上の皮膚の異常を含む広い範囲を指し得るため、現代医学上の特定疾患と同一視しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の荘重さを保った。「見よ」は避けて「なんと」とし、וְהִנֵּה の驚きと鮮明さを一般読者に伝わる形で二度とも再現した。
