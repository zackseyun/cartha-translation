  to: 雲が天幕の上から離れた。すると、なんと、ミリアムは皮膚病[a]に冒され、雪のように白くなっていた。アロンはミリアムの方を向いた。すると、なんと、彼女は皮膚病に冒されていた。
  rationale: 本文の病名の非限定的な訳と注は維持した。雪との比較については、文脈上の白さを明示して日本語として自然にし、「姿」という原文にない要素を除いた。また後半を二文に分け、原文の動作、提示、病状の反復を明瞭に再現した。
