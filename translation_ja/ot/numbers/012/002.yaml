  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: ja
  text: 彼らは言った。「ヤハウェは、ただモーセを通してだけ語ったのか。[a] 私たちを通しても語ったではないか。」ヤハウェはそれを聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェは、ただモーセにだけ語ったのか。私たちにも語ったではないか」。ヘブライ語の前置詞は、神が語りかける相手とも、神がことばを伝える際の媒介者とも理解できる。本文では、預言者としての権威が問題となっている文脈に基づき、「通して」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: 複数主語を保ちつつ、物語の進行を現代日本語で自然に示す。
- source_word: הֲרַק אַךְ
  choice: ただ…だけ…のか
  rationale: 二つの限定辞による強い排他的な問いかけを、「ただ」と「だけ」で表した。日本語では多少重なる表現だが、原文の強調を伝える。
- source_word: בְּמֹשֶׁה
  choice: モーセを通して
  rationale: 預言的発言の文脈で、前置詞 ב を神のことばの媒介者を示すものと理解した。ただし受け手を示す可能性も脚注に残した。
- source_word: דִּבֶּר יְהוָה
  choice: ヤハウェは…語った
  rationale: דבר を、啓示的な発言にふさわしい「語る」で訳し、神名は称号に置き換えず「ヤハウェ」とした。
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: 私たちを通しても語ったではないか
  rationale: 第一の問いと同じ構文を同じ「通して」で訳し、ミリアムとアロンが自分たちも神のことばの媒介者だと主張する文脈を示した。הֲלֹא の反語は「ではないか」で表した。
- source_word: וַיִּשְׁמַע יְהוָה
  choice: ヤハウェはそれを聞いていた
  rationale: 目的語は原文で明示されないが、日本語として自然になるよう、二人の発言を指す「それ」を補った。「聞いていた」は、二人の訴えが神に聞かれていたという叙述上の含みを自然に伝える。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有の神名を称号へ置き換えず、一般的な学術的音写で示した。
- issue: דבר とともに用いられる ב が受け手か媒介者か
  choice: モーセを通して／私たちを通して
  alternative: モーセに／私たちに
  rationale: この箇所の争点は、単に神のことばを受けたかではなく、誰が預言的権威をもって神のことばを伝えるかにあるため、媒介を表す読みを本文に採った。ヘブライ語自体が許す受け手の読みは脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、反語の鋭さと物語の厳粛さを保った。神に対する過度な敬語は加えず、原文の直接的な叙述を生かした。
