source:
  edition: WLC
  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: ja
  text: どうか彼女を、母の胎から出るとき、その肉の半分が食い尽くされている死んだ者[a]のようにしないでください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「母の胎から出るとき、その肉の半分が食い尽くされている死産児のようにしないでください」。ヘブライ語は直訳すれば「死んだ者のように」であり、後続の描写は出生時に死んでいる子の像を示唆している。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: どうか、…しないでください
  rationale: אַלは否定の願い・要請を表し、נָאは切実な懇願を添えるため、現代日本語の丁重で強い願いとして表した。
- source_word: תְהִי
  choice: 彼女を…のようにしないでください
  rationale: יהיהの女性単数形で、文脈上ミリアムを指す。否定辞とともに「そうならせないでほしい」という願いを表す。
- source_word: כַּמֵּת
  choice: 死者のように
  rationale: 字義的な比較を保ち、死産児という解釈は本文で断定せず脚注に示した。
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: 母の胎から出る時には
  rationale: 前置詞בを伴う不定詞の時間的意味を自然な日本語で表し、原文の出産の生々しい像を保持した。
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: 肉が半ば食い尽くされている
  rationale: אכלの「食う」という像とבשרの身体的な「肉」を残しつつ、出生時の結果状態として自然に読める形にした。
theological_decisions:
- issue: 女性単数形の指示対象
  choice: 「彼女」はミリアムを指す
  alternative: 主語を省略して曖昧さを残す
  rationale: 直前の文脈でアロンがミリアムのために願っており、ヘブライ語の女性単数形を日本語でも明示するのが適切である。
- issue: כַּמֵּתが示す像
  choice: 本文では字義的に「死者のように」とする
  alternative: 本文で「死産児のように」と明示する
  rationale: 後続句は死産の像を強く示唆するが、כַּמֵּת自体は「死者のように」であり、解釈を本文で限定しすぎないため脚注に代案を示す。
translation_notes:
  register: 切実な嘆願として丁重な「どうか…しないでください」を用いた。身体の損壊を示す原文の強烈な比喩は弱めず、「肉」「食い尽くされている」と訳した。
