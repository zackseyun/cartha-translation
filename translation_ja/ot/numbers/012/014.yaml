- from: 主はモーセに言われた。「もし彼女の父が彼女の顔につばを吐きかけたなら、彼女は七日間、恥を受けるのではないか。[a] 彼女を七日間、宿営の外に隔離し、その後、再び迎え入れなさい。[b]」
  to: ヤハウェはモーセに言われた。「もし彼女の父が彼女の顔につばを吐きかけたなら、彼女は七日間、恥を受けるのではないか。[a] 彼女を七日間、宿営の外に隔離し、その後、再び迎え入れなさい。[b]」
