base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「もし彼女の父が彼女の顔につばを吐きかけたなら、彼女は七日間、恥を受けるのではないか。[a] 彼女を七日間、宿営の外に隔離し、その後、再び迎え入れなさい。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼女は七日間、恥じ入るのではないか」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その後、彼女は再び受け入れられる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 日本語の聖書文体で神の固有名を示す慣用的な訳語。原語が称号ではなく神名であることに留意しつつ、明瞭で自然な本文とした。
- source_word: יָרֹק יָרַק
  choice: つばを吐きかけた
  rationale: 不定詞絶対形と定形動詞の組み合わせによる強意を、顔に向けた侮辱行為が明確になる自然な日本語で表した。仮定条件は「もし…なら」で保持した。
- source_word: בְּפָנֶיהָ
  choice: 彼女の顔に
  rationale: つばを吐く行為との結びつきにおいて、侮辱を表す直接的な意味を保った。
- source_word: תִכָּלֵם
  choice: 恥を受ける
  rationale: ニファル形が示す、恥辱を被るという受動的・社会的側面を表す。「恥じる」という内面的な読みも脚注に残した。
- source_word: תִּסָּגֵר
  choice: 隔離し
  rationale: 直訳的な「閉じ込める」より、宿営外への一定期間の排除を自然かつ明確に示す。受動命令の意味は日本語の使役的命令で表した。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外に
  rationale: イスラエルの野営共同体という文脈に合う、簡潔で標準的な訳語。
- source_word: תֵּאָסֵף
  choice: 再び迎え入れなさい
  rationale: אסףのニファル形が示す、排除後に共同体へ収容されることを自然な日本語で表した。より字義的な「集め入れられる」は脚注に示した。
theological_decisions:
- issue: 父が顔につばを吐く節の性質
  choice: 恥と排除の期間を説明する仮定的なたとえ
  alternative: 実際に起きた出来事への言及
  rationale: 接続詞と仮定的な文脈、および修辞疑問から、父による侮辱を類比として用いた発言と理解した。象徴的・教派的解釈は加えていない。
- issue: 神名 יְהוָה の日本語表記
  choice: 主
  alternative: ヤハウェ
  rationale: 現代日本語として読みやすく尊厳ある慣用表現を採用した。ただし原文が神の固有名である点を曖昧にし得るため、出版方針として神名音写を一貫採用する場合は「ヤハウェ」が可能。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発言としての威厳を保った。「宿営」「隔離」「迎え入れる」により、排除と復帰の動きを簡潔に示した。すべての脚注記号を本文中に配置した。
