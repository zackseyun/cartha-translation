  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: ja
  text: ヤハウェは突然、モーセとアロンとミリアムに言われた。「あなたがた三人とも、会見の天幕へ出て来なさい[a]。」そこで三人とも出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「出なさい」とも訳せる。この動詞は、ある場所の内から外へ移動することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示す。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 発言が予期せず即座になされたという副詞の物語的な力を自然な現代日本語で保つ。
- source_word: צְאוּ
  choice: 出て来なさい
  rationale: יצא の命令形は、ある場所の内から外へ移動することを表す。召し出す直接話法として自然な「出て来なさい」を採用したが、話者を基準にしない「出なさい」も可能なので脚注に示す。
- source_word: שְׁלָשְׁתְּכֶם
  choice: あなたがた三人とも
  rationale: 呼びかけられた三人全員を明示するヘブライ語の強調を、自然な日本語で再現する。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神がイスラエルと会われる幕屋を指す定型句として、簡潔で意味の通る訳語を用いる。
- source_word: וַיֵּצְאוּ
  choice: 出て行った
  rationale: 物語を進める連続形を過去の叙述として訳し、יצא の基本的な移動方向を保つ。
- source_word: שְׁלָשְׁתָּם
  choice: 三人
  rationale: 三人全員が命令に従ったという原文の反復を、冗長にならない自然な日本語で保持する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく神の固有名を明記しているため、その区別を保つ音写を採用する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。会話部分は直接的な命令として自然にしつつ、「言われた」によって聖書叙述にふさわしい敬意を示した。
