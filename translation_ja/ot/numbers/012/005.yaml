source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: ja
  text: すると、ヤハウェは雲の柱の中に降りて来て、天幕の入り口に立った。[a] そしてアロンとミリアムを呼ぶと、二人は進み出た。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天幕」は、文脈上、会見の天幕を指す。
    reason: cross_reference
  - marker: b
    text: 直訳は「二人は出た」または「二人は出て来た」。ここでは、ヤハウェの呼びかけに応じて前へ出たことを表すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 降り
  rationale: ירדの具体的な下降の動きを保ち、神が現れる場面の擬人的表現を弱めずに訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写を用いた。
- source_word: בְּעַמּוּד עָנָן
  choice: 雲の柱のうちに
  rationale: 前置詞בを、ヤハウェが雲の柱を伴うだけでなく、その中に現れるという態様として表した。冠詞のない表現なので「その雲の柱」とはしなかった。
- source_word: וַיַּעֲמֹד
  choice: 立った
  rationale: עמדの基本的で具体的な姿勢を、簡潔な物語表現で保持した。
- source_word: פֶּתַח הָאֹהֶל
  choice: 天幕の入り口
  rationale: פתחを自然な現代日本語の「入り口」とし、本文が単に「その天幕」と記すため、文脈上の会見の天幕を本文で明示的に補わなかった。
- source_word: וַיִּקְרָא
  choice: 呼ぶと
  rationale: קראの基本義「呼ぶ」を保ち、後続する二人の応答との関係が自然に伝わる接続にした。
- source_word: אַהֲרֹן וּמִרְיָם
  choice: アロンとミリアム
  rationale: 日本語聖書で理解されやすい標準的な人名表記を用いた。
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: 二人は進み出た
  rationale: יצאの字義は「出た」だが、この文脈では呼びかけに応じて御前へ出る動作を指すと考えられる。「二人」によりשְׁנֵיהֶםも明示した。字義的な訳は脚注に残した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文の固有名としての性格を保持し、称号への置換や特定の教派的慣用を避けた。
- issue: ヤハウェが「降る」という擬人的描写
  choice: 具体的な下降表現をそのまま保つ
  alternative: 「現れた」などの抽象的な言い換え
  rationale: 原文は明確にירדを用いるため、神の遍在との関係を訳文で説明せず、物語の神顕現の描写を保持した。
- issue: יצאが示す移動の方向
  choice: 文脈に即して「進み出た」とする
  alternative: 字義的に「出て来た」または「出た」
  rationale: 二人が呼ばれてヤハウェの前に出る場面として自然に読める一方、動詞自体の方向性には幅があるため、字義は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い連続動作を自然な物語文に整えつつ、神の下降や雲の柱という具体的な神顕現表現を保持した。脚注記号は対応する語句・表現の直後に置いた。
