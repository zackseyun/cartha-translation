  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: ja
  text: ミリアムとアロンは、モーセが妻に迎えた[b]クシュ人の女性[a]のことで、モーセを非難した。彼がクシュ人の女性を妻に迎えたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エチオピア人」とも訳される。ヘブライ語は「クシュ人」で、クシュ出身の女性を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「取った」。婚姻の文脈では、「妻に迎えた」または「結婚した」を意味するヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: モーセを非難した
  rationale: 動詞דבר自体は「語る」だが、前置詞בと文脈が敵対的な発言を示すため、日本語では「非難した」とした。単数女性形はミリアムの主導性を示す可能性があるが、明示的に補わず、並列された二人を主語として保持した。
- source_word: מִרְיָם וְאַהֲרֹן
  choice: ミリアムとアロン
  rationale: ヘブライ語の語順どおりミリアムを先に置き、日本語で一般的な聖書人名表記を用いた。
- source_word: עַל אֹדוֹת
  choice: のことで
  rationale: 発言の理由またはきっかけを示す句。後続の説明文との重複を保ちながら、自然な日本語にした。
- source_word: הָאִשָּׁה הַכֻּשִׁית / אִשָּׁה כֻשִׁית
  choice: クシュ人の女
  rationale: אִשָּׁהの「女／妻」という幅を一語で「妻」に限定せず、民族・地域名כֻשִׁיתは時代錯誤を避けて原語に透明な「クシュ人」とした。
- source_word: לָקָח
  choice: めとった
  rationale: 字義は「取った」だが、婚姻の文脈では「妻として迎えた／結婚した」を意味する。「めとった」は婚姻の意味を明確にしつつ、原語の慣用的な表現を反映する。
- source_word: כִּי
  choice: からである
  rationale: 先の理由を説明的に言い直す機能を表し、原文の反復を削らずに残した。
theological_decisions:
- issue: モーセの妻の民族的・地理的呼称と人物同定
  choice: 「クシュ人」と訳し、人物をツィポラと同定しない
  alternative: 「エチオピア人」と訳す、またはミディアン人ツィポラとの同一性を訳文で示す
  rationale: 本文は女性をクシュ人とだけ呼んでいる。伝統的な地理名称や他箇所との調和を訳文に持ち込まず、歴史的・人物同定上の曖昧さを保持した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「めとった」「からである」によって聖書本文としての簡潔さと品位を保った。原文末尾の説明的反復は意図的に保持した。
