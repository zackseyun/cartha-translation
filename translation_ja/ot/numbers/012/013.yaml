  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: ja
  text: そこでモーセはヤハウェに叫び求めた。「神よ、どうか彼女を癒やしてください。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「どうか」が二度繰り返され、モーセの切迫した願いを強めている。
    reason: 原文の二つのנָאの反復を、自然な日本語本文を損なわずに示すため。
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 叫び求めた
  rationale: צעקの強い叫びと切迫した嘆願の両面を、自然な現代日本語で表す。単なる「呼びかけた」より執り成しの緊迫感を保つ。
- source_word: אֶל יְהוָה
  choice: ヤハウェに
  rationale: 前置詞אֶלの方向性を「に」で表し、神名יהוהは称号に置き換えず「ヤハウェ」と音写する。
- source_word: לֵאמֹר
  choice: （直接話法で表現）
  rationale: 発言内容を導入する不定詞。日本語では「言った」を重ねず、引用を直接続けるほうが自然で簡潔である。
- source_word: אֵל
  choice: 神よ
  rationale: 祈りにおける直接呼格として、荘重かつ現代的な「神よ」とする。
- source_word: נָא … נָא
  choice: どうか……どうか
  rationale: 嘆願を表す小辞の反復を保持し、モーセの切迫した祈りを日本語でも明示する。
- source_word: רְפָא
  choice: 癒やしてください
  rationale: רפאの命令形を、神への嘆願にふさわしい丁寧な依頼形で表す。病や患いからの回復を直接示す。
- source_word: לָהּ
  choice: 彼女を
  rationale: 三人称女性単数接尾辞がミリアムを指すことを明示する。日本語の「癒やす」が取る自然な目的格にする。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名יהוהを用いているため、称号「主」に置換せず、一般的な学術的音写「ヤハウェ」で表す。
- issue: 二度のנָאをどう表すか
  choice: 「どうか」を二度とも本文に残す
  alternative: 一度だけ「どうか」として反復を脚注で示す
  rationale: 原文の反復は嘆願の切迫感を担う。日本語でも理解可能であり、神学的・修辞的な強調を平滑化しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、短い執り成しの祈りが持つ緊迫感と荘重さを保った。「彼女を、どうか癒やしてください」という語順は、原文の二度目のנָאを自然に際立たせる。
