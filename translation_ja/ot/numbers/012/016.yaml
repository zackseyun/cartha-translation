  text: וְ/אַחַ֛ר נָסְע֥וּ הָ/עָ֖ם מֵ/חֲצֵר֑וֹת וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּ֥ר פָּארָֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: ja
  text: その後、民はハツェロトを旅立ち、パランの荒野に宿営した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: その後
  rationale: 直前の出来事に続く時間的順序を示す。現代日本語として自然で、物語の進行を明確に保つ。
- source_word: נָסְעוּ
  choice: 旅立ち
  rationale: 荒野の旅において宿営地を離れて移動を開始することを表す נסע の文脈的意味を、簡潔で自然な日本語にした。
- source_word: הָעָם
  choice: 民
  rationale: ここではイスラエルの共同体全体を指す。聖書本文にふさわしい簡潔さと格調を保ちつつ、現代の読者にも理解しやすい。
- source_word: מֵחֲצֵרוֹת
  choice: ハツェロトを
  rationale: 地名 חֲצֵרוֹת を音写した。起点を表す מִן は、日本語では移動動詞「旅立つ」の目的語として「を」で自然に表した。
- source_word: וַיַּחֲנוּ
  choice: 宿営した
  rationale: חנה は一定の場所に陣営を設けて滞在することを指す。「宿営した」は単なる宿泊よりも荒野を移動する共同体の営みを的確に表す。
- source_word: בְּמִדְבַּר
  choice: 荒野に
  rationale: מִדְבָּר は人里離れた乾燥地・原野を指す。「荒野」は五書の地理的・物語的背景を保ち、日本語聖書の文脈でも明瞭である。
- source_word: פָּארָן
  choice: パラン
  rationale: 地名 פָּארָן を日本語の慣用的な形で音写した。
theological_decisions: []
