revisions:
- from: そして主は言われた。「さあ、わたしの言葉を聞け。あなたがたの中に預言者がいるなら[a]、わたし、ヤハウェは、幻の中でその者に自らを知らせ[b]、夢の中でその者に語る[c]。」
  to: ヤハウェは言われた。「どうか、わたしの言葉を聞きなさい。あなたがたの中に預言者がいるなら[a]、わたしヤハウェは、幻の中でその人に自らを知らせ[b]、夢の中でその人に語る[c]。」
