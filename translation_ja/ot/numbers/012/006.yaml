source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: ja
  text: ヤハウェは言われた。「どうか、わたしの言葉を聞きなさい。あなたがたの中に預言者がいるなら[a]、わたしヤハウェは、幻の中でその人に自らを知らせ[b]、夢の中でその人に語る[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの一人が預言者なら」。ヘブライ語は字義的には「あなたがたの預言者がいるなら」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その人に自らを現す」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「その人と語る」。ヘブライ語は字義的には「彼の内で／彼と語る」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そして主は言われた
  rationale: 物語を進める連続形。話者は直前の文脈ではヤハウェであり、日本語では主語を補うことで引用の導入を明確にした。
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: さあ、わたしの言葉を聞け
  rationale: 複数への命令と、訴え・促しを添える נָא を、荘重さを保ちつつ自然な現代日本語にした。
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: あなたがたの中に預言者がいるなら
  rationale: 字義的には「あなたがたの預言者がいるなら」に近いが、共同体の中の預言者を指す表現として自然に訳した。条件表現の曖昧さは保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: בַּמַּרְאָה אֵלָיו אֶתְוַדָּע
  choice: 幻の中でその者に自らを知らせ
  rationale: ידע の再帰的形が表す、神がご自身を知られるようにするという意味を保った。「現れる」と断定するより原文の認識・啓示の含みを直接に示す。
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: 夢の中でその者に語る
  rationale: 夢を啓示の場・手段として示す前置詞句を自然に訳した。דבר ב の構文は「その者に／その者と語る」と理解でき、本文では自然な「その者に語る」を採用した。
theological_decisions:
- issue: 神の名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、称号ではなく固有名として訳した。
- issue: 預言者への自己啓示
  choice: その者に自らを知らせ
  alternative: その者に自らを現す
  rationale: 再帰形 אֶתְוַדָּע の「自分を知られるようにする」という意味を保ち、幻が必ず可視的な出現であると限定しないようにした。
- issue: אֲדַבֶּר בּוֹ の相手関係
  choice: その者に語る
  alternative: その者と語る
  rationale: בּוֹ の字義は「彼の中で／彼と」だが、דבר と共に用いられる際は相手に語る意味になり得る。日本語本文では文脈上自然な方向性を採り、別解を注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の直接の発言にふさわしい荘重さを保った。複数への命令は、日本語の聖書的な公的呼びかけとして単数形と同形の「聞け」で表した。固有名は「ヤハウェ」とし、啓示の様態に関する原文の余地は脚注で保持した。
