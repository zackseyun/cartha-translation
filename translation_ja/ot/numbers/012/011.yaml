source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: ja
  text: アロンはモーセに言った。「どうか、わが主よ、私たちが愚かなことをし、罪を犯したからといって、私たちに罪を負わせないでください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちに罪責を負わせないでください」。
    reason: חַטָּאת はここで「罪」のほか、その罪に伴う責任、すなわち「罪責」を指す可能性があるため。
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: どうか、わが主よ
  rationale: בִּי を切実で丁重な願いを表す「どうか」とし、אֲדֹנִי はモーセへの敬称なので、神への呼称と断定せず、人に対する敬意を保つ「わが主」とした。
- source_word: אַל נָא תָשֵׁת עָלֵינוּ חַטָּאת
  choice: どうか私たちに罪を負わせないでください
  rationale: שׁית＋על の『上に置く』という比喩を、日本語で自然な「負わせる」により保った。חַטָּאת はここで罪そのものとも、その罪責とも理解できるため、本文では直接的な「罪」を採用し、別訳を注記した。
- source_word: אֲשֶׁר נוֹאַלְנוּ וַאֲשֶׁר חָטָאנוּ
  choice: 私たちが愚かなことをし、罪を犯したからといって
  rationale: 二つの אֲשֶׁר 節を、アロンの嘆願理由を示す自然な日本語としてまとめた。「からといって」は、自分たちの非を認めつつ、罪を負わせないよう願う文脈上の緊張を明確にする。נוֹאַלְנוּ と חָטָאנוּ の区別は「愚かなことをし」「罪を犯した」で保持した。
theological_decisions:
- issue: モーセに向けた אֲדֹנִי の訳
  choice: わが主よ
  alternative: ご主人様／あなた様
  rationale: ここでは神の称号ではなく、人に対する敬称である。その上下関係と嘆願の切実さを保ちつつ、固有の神名や神性を示す表現としては扱わない。
- issue: חַטָּאת の意味範囲
  choice: 罪
  alternative: 罪責
  rationale: 語の直接的な意味を本文に残した。一方、罪を『負わせる』という構文では責任・処罰に関わる「罪責」も文脈上可能なので、注で提示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、アロンの切実で丁重な嘆願にふさわしい荘重さを保った。「わが主」は現代の日常語より格調が高いが、モーセへの強い敬意を簡潔に表せる。
