  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: ja
  text: わたしは彼と直接語る[a]。明瞭に、謎によらずに。彼はヤハウェの姿を見る[b]。それなのに、なぜあなたがたは、わたしのしもべモーセに逆らって語ることを恐れなかったのか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「口と口で」。直接、明瞭に語ることを強調する表現。「顔と顔を合わせて」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「姿」は「形」「似姿」「現れ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: 口と口で
  rationale: 「口と口」が原文の具体的な表現であり、モーセに対する直接的な語りかけを強調する。日本語では注を添えて意味を明確にする。
- source_word: אֲדַבֶּר בּוֹ
  choice: 彼と……語る
  rationale: 動詞に前置詞 ב が続くため、一方向に「彼に語る」だけでなく、直接の交わりとして「彼と語る」とした。
- source_word: וּמַרְאֶה וְלֹא בְחִידֹת
  choice: 明らかに語り、謎によってではない
  rationale: מַרְאֶה は字義的には「現れ、見えるもの」を表し得るが、ここでは「謎」と対照され、伝達の明瞭さを示す。動詞「語る」を補って自然な日本語にした。
- source_word: וּתְמֻנַת יְהוָה
  choice: ヤハウェの姿
  rationale: תְּמוּנָה の「形、似姿、現れ」という幅を、過度に限定しない自然な語「姿」で表した。神名は固有名として「ヤハウェ」とした。
- source_word: יַבִּיט
  choice: 見つめる
  rationale: נבט のヒフィル形が示す、意識を向けて見る意味と文脈の荘重さを保った。
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: わたしのしもべ、モーセを非難する
  rationale: 文脈上、ב を伴う「語る」は敵対的な発言を指すため「非難する」とした。反復される対象は、日本語で自然な同格表現にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の神名を明示し、称号への置き換えを避けた。
- issue: モーセが見る תְּמוּנַת יְהוָה の性質
  choice: ヤハウェの姿
  alternative: ヤハウェの形、ヤハウェの似姿、ヤハウェの現れ
  rationale: 本文が肯定する特別で直接的な啓示を保ちつつ、それが神の本質そのものを完全に見ることなのか、神の現れを見ることなのかを訳文で断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の発言にふさわしい荘重さを保った。「口と口で」は意図的に原文の比喩を残し、脚注で補足した。
