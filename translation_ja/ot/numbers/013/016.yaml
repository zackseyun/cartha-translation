base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: ja
  text: これらは、モーセがその地を偵察するために遣わした男たちの名である[a]。モーセは、ヌンの子ホシェアをヨシュアと呼んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その地を探るために」とも訳せる。ヘブライ語の動詞は、土地を調べることや偵察することを表す。
    reason: lexical_alternative
  - marker: b
    text: ホシェアはヨシュアの以前の名であり、ここでモーセが彼をヨシュアと呼んでいる。
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: これらは……人々の名である
  rationale: 直前に列挙された男性代表者たちをまとめて指す表現。現代日本語として自然な提示文にした。
- source_word: שָׁלַח מֹשֶׁה
  choice: モーセが……遣わした
  rationale: שלח の通常の派遣の意味を、聖書本文にふさわしい明瞭な現代語で表した。
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: その地を偵察するために
  rationale: תור はこの文脈で土地の調査・偵察を指す。「探る」より目的が明確で、「スパイする」ほど敵対的意味に限定しない。
- source_word: וַיִּקְרָא
  choice: 呼んだ
  rationale: קרא の字義に近く、ここで新しい名を与える含意も文脈から伝わる。「改名した」と断定して原文以上に説明しない。
- source_word: הוֹשֵׁעַ בִּן נוּן
  choice: ヌンの子ホシェア
  rationale: ヘブライ語の父称関係を日本語の慣用的な語順で示し、名は原音に近い「ホシェア」とした。
- source_word: יְהוֹשֻׁעַ
  choice: ヨシュア
  rationale: 日本語聖書で広く認知される標準的な表記を採用した。
theological_decisions:
- issue: モーセの命名行為の明示度
  choice: 「ヨシュアと呼んだ」
  alternative: 「ヨシュアと名づけた／改名した」
  rationale: 原文の קרא を保ち、命名または改名という含意を過度に説明せず残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「人々」は文脈上、直前に名を挙げられた男性代表者たちを指す。英語固有の綴りの異読注は日本語訳には不要なため採用しなかった。
