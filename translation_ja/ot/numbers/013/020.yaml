source:
  edition: WLC
  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: ja
  text: また、その土地が肥えているか、やせているか、そこに木[a]があるかないかを見なさい。勇気を出して、その土地の実をいくらか取って来なさい。」そのころは、ぶどうが初めて熟す時期[b]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「木」は「木材」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「その日々は、初熟のぶどうの日々であった」。ぶどうの収穫期が始まるころを指す。
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: 肥えているか、やせているか
  rationale: 土地の生産力を表す「脂肪の多い／やせた」という対照を、日本語でも自然かつ原語に近い農耕表現で訳した。
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: そこに木があるかないか
  rationale: עֵץは「木」と「木材」の両義を持つ。本文では土地の様子を調べる文脈に最も素直な「木」を採り、別解を脚注に残した。
- source_word: וְהִתְחַזַּקְתֶּם
  choice: 勇気を出して
  rationale: 直訳的には「自らを強くせよ／強くあれ」。危険を伴う任務に臨むよう促す命令として、現代日本語で自然な表現を選んだ。
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: その土地の実をいくらか取って来なさい
  rationale: מִןの部分的な意味を「いくらか」で表した。偵察者が戻って報告する文脈上、日本語では「取って来る」が自然である。
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: ぶどうが初めて熟す時期
  rationale: ここでは祭儀的な「初物」より、ぶどうの実が熟し始める季節を示す物語上の時の注記として訳した。
- source_word: וְהַיָּמִים יְמֵי
  choice: そのころは、…時期であった
  rationale: ヘブライ語の反復的な時の表現を、意味を保ちながら明瞭な現代日本語に整えた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肥えている／やせている」で原文の比喩的な対照を保持し、命令は文脈に合わせて「見なさい」「勇気を出して」「取って来なさい」と自然につないだ。
