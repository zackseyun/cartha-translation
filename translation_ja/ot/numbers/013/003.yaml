source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: ja
  text: そこでモーセは、ヤハウェの命令に従って[a]、彼らをパランの荒野から遣わした。彼らは皆、イスラエルの子らの指導者である男たちだった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「ヤハウェの口に従って」。すなわち、ヤハウェのことば、または命令に従って、という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「イスラエルの子らのかしら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 遣わした
  rationale: שלחの物語形が表す過去の派遣を、聖書叙事にふさわしく自然な日本語で表した。
- source_word: מִמִּדְבַּר פָּארָן
  choice: パランの荒野から
  rationale: מִדְבָּרは耕作地外の荒れ野を指し得るため、「砂漠」より広い「荒野」とした。地名פָּארָןは「パラン」と音写した。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: 直訳的には「ヤハウェの口に基づいて」だが、命令・指示に従うというヘブライ語慣用句の意味を明瞭な日本語で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号への置換ではなく、本文の神名四文字を固有名として音写した。
- source_word: כֻּלָּם אֲנָשִׁים
  choice: 彼らは皆
  rationale: כֻּלָּםの全員性を明示した。אֲנָשִׁיםは男性を指すが、日本語では後続する「かしら」と主語「彼ら」によって人物集団であることが自然に伝わり、「皆、男たちで」と重ねる不自然さを避けた。
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのかしら
  rationale: רָאשֵׁיの身体比喩と指導者の意味、およびבְנֵי יִשְׂרָאֵלの家族的表現を保った。
- source_word: הֵמָּה
  choice: 彼らは…であった
  rationale: 独立代名詞の明示性を日本語の主題「彼らは」で反映した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有の神名を称号に置き換えず、一般的な学術的再構音に基づいて音写した。
- issue: אֲנָשִׁים と בְנֵי יִשְׂרָאֵל の性別・家族表現
  choice: 彼らは皆、イスラエルの子らのかしら
  alternative: 全員がイスラエル人の指導者
  rationale: 代表者が男性である文脈を「彼ら」で保ちつつ、「イスラエルの子ら」という原文の家族的表現と「かしら」という比喩を残した。日本語として冗長になるためאֲנָשִׁיםを独立した「男たち」とはしなかったが、意味は失われていない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「遣わす」「荒野」「かしら」によって聖書本文に適した端正さと原文の比喩を保った。
