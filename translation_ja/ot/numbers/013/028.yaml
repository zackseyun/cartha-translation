revisions:
- from: しかし、その地に住む民は強く、町々は堅固に守られ、非常に大きい。そのうえ、そこでアナクの子孫[a]も見た。
  to: しかし、その地に住む民は強く、町々は堅固な防備を備え、非常に大きい。そのうえ、私たちはそこでアナクの子孫[a]も見た。
  rationale: 防備を示すヘブライ語形容詞の意味を、受動的な『守られ』ではなく、町々が堅固な防備を備えるという表現でより直接に反映した。また、原文の一人称複数を補い、報告者の目撃証言であることを明確にした。その他の訳語と脚注は、原文および英語監査記録に照らして保持できる。
