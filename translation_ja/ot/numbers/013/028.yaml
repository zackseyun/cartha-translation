  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: ja
  text: しかし、その地に住む民は強く、町々は堅固な防備を備え、非常に大きい。そのうえ、私たちはそこでアナクの子孫[a]も見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「アナクの子ら」。アナクの子孫を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: しかし
  rationale: 前節の良い報告に強い留保を加える表現。現代日本語で自然に逆接を示す「しかし」とした。
- source_word: עַז
  choice: 強い
  rationale: その地の民が手ごわいほどの力を持つことを表す。「獰猛な」として敵意まで読み込まず、基本的な意味を保った。
- source_word: הַיֹּשֵׁב בָּאָרֶץ
  choice: その地に住む
  rationale: 分詞構文を自然な連体修飾として訳し、継続的な居住を表した。
- source_word: בְּצֻרוֹת
  choice: 堅固に守られ
  rationale: 町が防備を施されている軍事的意味を示す。「城壁で囲まれた」より広く、原語の意味を自然に伝える。
- source_word: גְּדֹלֹת מְאֹד
  choice: 非常に大きい
  rationale: 町々の規模の大きさと מְאֹד の強調を明確に表した。
- source_word: וְגַם
  choice: そのうえ、…も
  rationale: さらに警戒すべき事実を付け加える累加の働きを、日本語として自然に示した。
- source_word: יְלִדֵי הָעֲנָק
  choice: アナクの子孫
  rationale: 字義的には「アナクの子ら」だが、ここではアナクに連なる者たちを指すため、「子孫」とした。
- source_word: רָאִינוּ שָׁם
  choice: そこで…見た
  rationale: 完了形を報告中の過去の出来事として訳し、場所を示す שָׁם も保持した。
