id: NUM.13.32
reference: Numbers 13:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: ja
  text: そこで彼らは、自分たちが探った地について、イスラエルの子らに悪い報告を伝え[a]、こう言った。「私たちが探るために通った地は、そこに住む者たちを食い尽くす地[b]であり、その地で見た民は皆、並外れて大きな男たち[c]だった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その地についての悪い報告を持ち出して」。または「悪評を言い広めて」「その地を中傷して」。
    reason: lexical_alternative
  - marker: b
    text: または「そこに住む者たちをのみ込む地」。何が住民を滅ぼすのかは明示されていない。
    reason: lexical_alternative
  - marker: c
    text: 直訳では「寸法の男たち」。並外れて背が高い、または体格が大きい男たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: 悪い評判を広めて
  rationale: 「悪評を持ち出す」というヘブライ語の慣用表現を、現代日本語で自然に表した。「中傷した」まで強めず、否定的で害を及ぼす報告という含みを保つ。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 約束の地をめぐる物語の地理的・契約的な響きを保つ標準的な訳語。
- source_word: תָּרוּ / לָתוּר
  choice: 探った／探る
  rationale: 調査・偵察の意味を含みつつ、軍事的な諜報だけに限定しない語を選んだ。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに
  rationale: 原文の「イスラエルの息子たち」という定型的な民の呼称を見える形で保った。
- source_word: עָבַרְנוּ בָהּ
  choice: 通って来た
  rationale: 地の中を実際に通過して調べたという移動を、自然な日本語で示す。
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: そこに住む者たちを食い尽くす地
  rationale: אֹכֶלֶת の強烈な擬人的比喩を弱めず、「食い尽くす」で不吉な誇張表現を保持した。
- source_word: וְכָל הָעָם
  choice: 民は皆
  rationale: 集合名詞 עָם と כָל を簡潔で自然に表した。
- source_word: אַנְשֵׁי מִדּוֹת
  choice: 並外れて大きな男たち
  rationale: 直訳的な「寸法の男たち」が指す、目立って大柄な男性という身体的意味を明確にした。社会的地位の高さとは解されにくい表現を選んだ。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の性を伴う集合的呼称
  choice: イスラエルの子ら
  alternative: イスラエル人たち／イスラエルの民
  rationale: ここでは国民全体を指す定型句だが、原文の父祖イスラエルに由来する「子ら」という形を本文に残した。女性を除外するとの解釈は加えていない。
- issue: 斥候たちの報告が客観的描写か中傷か
  choice: 悪い評判を広めた
  alternative: その地を中傷した
  rationale: דִּבָּה は悪評や中傷を表し得るが、本文では虚偽と断定する強い訳を避け、語の否定的性格と物語上の緊張を保った。
- issue: 「住民を食い尽くす地」の意味
  choice: 比喩をそのまま保持
  alternative: 住民を滅ぼす地／住民が生きていけない地
  rationale: 地が住民を食うという原文の意図的に強烈で曖昧な比喩を、特定の原因（戦争、飢饉、自然災害など）に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、荒々しい報告の調子を「食い尽くす」「並外れて大きな」で保持した。「イスラエルの子ら」は日常語よりやや文語的だが、聖書の定型的呼称として意味が通り、原文の形も保てる。引用部は過度に古風にせず、語りとして自然な常体にした。
