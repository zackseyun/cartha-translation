  to: そこで彼らは、自分たちが探った地について、イスラエルの子らに悪い報告を伝え[a]、こう言った。「私たちが探るために通った地は、そこに住む者たちを食い尽くす地[b]であり、その地で見た民は皆、並外れて大きな男たち[c]だった。」
