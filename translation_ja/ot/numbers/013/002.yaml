id: NUM.13.2
reference: Numbers 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: ja
  text: 「あなたのために[a]、男たちを遣わし、わたしがイスラエルの子ら[c]に与えているカナンの地を偵察させなさい。[b] 父祖の部族ごとに一人ずつ遣わしなさい。遣わす者は皆、彼らの中の指導者[d]でなければならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたのために」に当たる語は、単なる強調とも、モーセへの許可や個人的な関与を示すとも解釈できる。
    reason: 原文の与格が持つ曖昧さを説明するため。
  - marker: b
    text: 「偵察する」は、「探る」「調査する」とも訳せる。
    reason: תור の語義上の選択肢を示すため。
  - marker: c
    text: 「イスラエルの子ら」は、女性を除外する語ではなく、イスラエルの民全体を指す原文の定型的な表現。
    reason: 家族的・契約的なヘブライ語表現について文化的に補足するため。
  - marker: d
    text: 「指導者」は、「首長」とも訳せる。
    reason: נָשִׂיא が部族の長や高位者を表し得るため。
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: あなたのために……遣わし
  rationale: 命令形「遣わせ」と与格 לְךָ を明示する。日本語ではやや異例な表現だが、許可、モーセ自身の関与、強調などの可能性を一つに決めず、原文の含みを残す。
- source_word: אֲנָשִׁים
  choice: 男たち
  rationale: ここでは各部族から選ばれる男性代表者を指すため、性別を曖昧にしない。
- source_word: וְיָתֻרוּ
  choice: 偵察させなさい
  rationale: תור はこの文脈で土地を巡って調べることを表す。「偵察する」は任務の性格を明確にしつつ、「探る」「調査する」という語義の幅は注で示す。
- source_word: אֶרֶץ כְּנַעַן
  choice: カナンの地
  rationale: 構文を自然な日本語で表しつつ、אֶרֶץ「地」を明示する。
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: わたしが……与えている
  rationale: 分詞 נֹתֵן の進行中または確実に進みつつある授与のニュアンスを保つ。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 民族名だけに置き換えず、原文の家族的・契約的な定型表現を保つ。共同体全体を指すことは注記する。
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: 一人ずつ
  rationale: 反復による配分の意味を、自然な現代日本語で表す。
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: それぞれの父祖の部族から
  rationale: מַטֶּה を「部族」、אֲבֹתָיו を祖先的・父系的帰属を示す「父祖」と訳す。
- source_word: תִּשְׁלָחוּ
  choice: 遣わしなさい
  rationale: 最初の命令に続く指示として、明確な命令表現にする。
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: 皆、その民の中の指導者
  rationale: נָשִׂיא は部族内の長、首長、君侯を指し得るが、現代の読者に広く通じる「指導者」を採用する。
theological_decisions:
- issue: 神の命令における לְךָ の含み
  choice: 本文で「あなたのために」と明示する
  alternative: 日本語では省略する／「あなた自身で」とする
  rationale: 原文にある与格を残し、それが許可、本人の関与、利益、単なる強調のいずれなのかを本文で断定しない。
- issue: בני ישראל の訳し方
  choice: 「イスラエルの子ら」
  alternative: 「イスラエル人」／「イスラエルの民」
  rationale: 原文の家族的・契約的表現を保つ。ただし男性だけを指す表現と誤解されないよう注を付す。
- issue: 約束の地を「与えている」という表現
  choice: 進行的な授与として訳す
  alternative: 「与える」／「与えようとしている」
  rationale: 神の授与が確実であり進行中であることを示す分詞の相を保ち、完了済みとも単なる未来とも限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の発話にふさわしい簡潔で端正な命令文とした。「あなたのために」は通常の日本語としてやや際立つが、原文の לְךָ を消さず、注でその解釈の幅を示した。
