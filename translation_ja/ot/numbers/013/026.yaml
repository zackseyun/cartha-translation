base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: ja
  text: 彼らは行って、モーセとアロン、またイスラエルの子らの全会衆[a]のもとへ、すなわちパランの荒野のカデシュへ来た。そして、彼らと全会衆に報告し、その地の実りを彼らに見せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人の全会衆」とも訳せる。ヘブライ語では直訳すると「イスラエルの子らの全会衆」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: 彼らは進んで行き、…来た
  rationale: 二つの連続する物語動詞を保ちつつ、日本語で移動と到着が自然に伝わるようにした。文脈上は帰還だが、最初の動詞自体に「戻る」を加えて意味を限定しなかった。
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの全会衆
  rationale: עֵדָהを「会衆」、בְּנֵי יִשְׂרָאֵלを「イスラエルの子ら」と訳し、原文の構成を保った。「全」はכָּלを反映する。
- source_word: מִדְבַּר פָּארָן
  choice: パランの荒野
  rationale: מִדְבָּרを、旅程記事にふさわしい定着した表現「荒野」で訳した。
- source_word: קָדֵשָׁה
  choice: カデシュまで
  rationale: 地名に付く方向を示す-הを反映し、到着点であることを自然な日本語で示した。
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: 二人…に報告し
  rationale: 「言葉を返す」というヘブライ語の慣用句を、偵察後の報告という文脈に即して自然に訳した。אוֹתָםの指示対象は直前のモーセとアロンと解し、「二人」と明示した。
- source_word: וְאֶת כָּל הָעֵדָה
  choice: 全会衆に
  rationale: 前節から目的語関係を補い、כָּלとעֵדָהをそれぞれ「全」「会衆」で表した。
- source_word: וַיַּרְאוּם
  choice: 彼らに見せた
  rationale: ראהのヒフィル形が表す使役的な意味を、自然な「見せた」で訳した。代名詞の複数形も「彼らに」で保持した。
- source_word: פְּרִי הָאָרֶץ
  choice: その地の実り
  rationale: פְּרִיの具体性と土地の豊かさを表しつつ、日本語として「その地の果実」より広く自然に理解できる「実り」を選んだ。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、旅程記事としての簡潔で格調ある調子を保った。「イスラエルの子ら」は原文に近い表現なので、より自然な代案を脚注に示した。
