base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: ja
  text: 彼らは上って行き、ツィンの荒野から、ハマトの入口にあるレホブまで、その地を偵察した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レボ・ハマトにあるレホブまで」とも訳せる。ヘブライ語の「レボ・ハマト」は、地名とも「ハマトの入口」という表現とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 彼らは上って行き
  rationale: עלהの上方への移動という意味を保ちつつ、旅程を述べる自然な現代日本語とした。
- source_word: וַיָּתֻרוּ
  choice: 偵察した
  rationale: תורはこの文脈では、任命された者たちが土地の状況を調べる行為を指す。「探った」より任務の性格が明確で、「スパイした」より自然で dignified な表現である。
- source_word: אֶת־הָאָרֶץ
  choice: その地を
  rationale: 文脈上、直前から対象となっているカナンの地を指すため、既知性を自然に示す「その地」とした。
- source_word: מִמִּדְבַּר צִן
  choice: ツィンの荒野から
  rationale: מִדְבָּרは必ずしも砂漠だけを意味しないため「荒野」とし、地名 צִן は「ツィン」と音写した。
- source_word: עַד רְחֹב
  choice: レホブ…まで
  rationale: עַדが偵察範囲の終点を示すことを「まで」で表した。רְחֹבは地名として音写した。
- source_word: לְבֹא חֲמָת
  choice: すなわちハマトの入り口
  rationale: この連語は独立した地名「レボ・ハマト」とも、レホブの位置を示す「ハマトの入り口」とも理解できる。本文では前置詞 לְ の方向・位置的な働きを反映できる記述的理解を採用し、地名としての読みを脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「上って行き」で原文の方向感覚を残し、「偵察した」で民数記13章の調査任務を簡潔に表現した。地理表現の構文上の曖昧さは本文で一つの自然な読みを採用し、別の可能性を脚注に明示した。
