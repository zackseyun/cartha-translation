  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: ja
  text: アマレク人はネゲブの地[a]に住み、ヒッタイト人、エブス人、アモリ人は山地に住み、カナン人は海辺とヨルダン川沿い[b]に住んでいる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ネゲブ」は「南の地方」とも訳せるが、ここではカナン南部の乾燥地域を指す地名と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「ヨルダン川の側に」。すなわち、ヨルダン川のそば、または川沿いを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: アマレク人
  rationale: ここでは地域に居住する民族集団を指すため、日本語で自然な民族名として「アマレク人」とした。
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: 住む／住んでいる
  rationale: ישב の分詞は定住・居住の状態を表す。文頭二箇所は並列を簡潔に「住み」とし、文末は継続的な居住を自然に示す「住んでいる」とした。
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: ネゲブの地に
  rationale: נֶגֶב をカナン南部の特定地域名「ネゲブ」とし、אֶרֶץ も「地」として保持した。
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: ヒッタイト人／エブス人／アモリ人／カナン人
  rationale: 文法上は単数形の集合名詞だが、諸民族を指す日本語として「〜人」とした。
- source_word: בָּהָר
  choice: 山地に
  rationale: הַר は山または山地を意味し、ここでは居住地域を指すため、地理的な表現「山地」が適切である。
- source_word: עַל הַיָּם
  choice: 海辺に
  rationale: 直訳的な「海のそばに」の意味を、自然で簡潔な地理表現にした。「沿岸」と断定するより原文の幅を保つ。
- source_word: עַל יַד הַיַּרְדֵּן
  choice: ヨルダン川沿いに
  rationale: 「ヨルダンの手／側に」という空間的慣用句を、川に隣接する地域を表す自然な日本語にした。
