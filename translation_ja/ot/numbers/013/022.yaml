source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בַ/נֶּגֶב֮ וַ/יָּבֹ֣א עַד חֶבְרוֹן֒ וְ/שָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְ/תַלְמַ֔י יְלִידֵ֖י הָ/עֲנָ֑ק וְ/חֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִ/פְנֵ֖י צֹ֥עַן מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: ja
  text: 彼らはネゲブへ上って行き、彼はヘブロンまで来た。そこには、アナクの子孫であるアヒマン、シェシャイ、タルマイがいた。ヘブロンは、エジプトのツォアンより七年前に建てられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: ネゲブ
  rationale: 固有の地域名として音写し、単に「南部」と一般化しない。
- source_word: יְלִידֵי הָעֲנָק
  choice: アナクの子孫
  rationale: יְלִידֵי は出自・血統を表すため、自然な日本語で「子孫」とした。
- source_word: צֹעַן מִצְרָיִם
  choice: エジプトのツォアン
  rationale: 地名ツォアンを音写し、属格関係を明瞭にした。
theological_decisions:
- issue: 複数主語から単数動詞への移行（וַיַּעֲלוּ… וַיָּבֹא）
  choice: 「彼らは…上って行き、彼は…来た」
  alternative: 「彼らは…上って行き、…まで来た」
  rationale: マソラ本文の数の不一致を均さず、その曖昧さを本文に保持した。単数の「彼」が誰を指すかは特定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、歴史叙述にふさわしい簡潔で端正な文体とした。固有名詞は日本語聖書で理解しやすい音写を用いた。
