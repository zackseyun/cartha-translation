base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: ja
  text: 彼らは彼に報告して言った。「私たちは、あなたが遣わした地に入りました。そこは確かに乳と蜜の流れる地です。そして、これがその実です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: 報告して
  rationale: ピエル形の「詳しく語る、報告する」という意味を、偵察の結果を正式に伝える文脈に即して自然に表した。
- source_word: לוֹ
  choice: 彼に
  rationale: 原文は固有名ではなく代名詞を用いるため、その形を保った。文脈上の指示対象はモーセである。
- source_word: וַיֹּאמְרוּ
  choice: 言った
  rationale: 物語を進める標準的な発話導入として、ヘブライ語の連続を簡潔に反映した。
- source_word: בָּאנוּ אֶל הָאָרֶץ
  choice: 地に入りました
  rationale: בוא は「来る」のほか「入る」を意味し、偵察者たちがその地へ実際に入ったことを明瞭かつ自然に表す。
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: あなたが遣わした
  rationale: 目的地を示す前置詞句との関係は日本語の「地に」で表し、関係節自体は簡潔に訳した。
- source_word: וְגַם
  choice: 確かに
  rationale: 単なる付加の「また」ではなく、その地の豊かさを肯定し強調する働きを自然な日本語で表した。
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: 乳と蜜の流れる地
  rationale: 農業的な豊かさを表す定型的なヘブライ語表現を、意味と聖書的イメージの双方が伝わる慣用的な日本語にした。
- source_word: הִוא
  choice: そこは…地です
  rationale: 女性単数代名詞が「地」を受けることを、日本語では場所を指す「そこ」と名詞述語によって自然に示した。
- source_word: וְזֶה פִּרְיָהּ
  choice: そして、これがその実です
  rationale: 持ち帰った実を目の前の証拠として示す指示的な表現を直接的に訳した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、報告場面にふさわしい丁寧体と聖書本文としての品位を保った。「乳と蜜の流れる地」は定着した比喩表現として保持した。原文の וְגַם の強調は本文中の「確かに」で十分に示せるため、異訳注は設けなかった。
