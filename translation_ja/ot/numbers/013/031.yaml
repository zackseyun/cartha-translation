  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: ja
  text: しかし、彼と一緒に上って行った男たちは言った。「私たちは、その民に攻め上ることはできない。彼らは私たちより強いからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: しかし、…者たちは
  rationale: 接続詞は直前のカレブの発言との対照を示すため「しかし」とした。文脈上は偵察に同行した男性たちを指すが、日本語では「彼と一緒に上って行った者たち」が自然で、指示対象も明確である。
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: 彼と一緒に上って行った
  rationale: עלה の基本義「上る」を保ち、カレブと共に先にその地へ赴いた者たちを指す関係節として自然に表現した。
- source_word: לֹא נוּכַל
  choice: 私たちは…ことはできない
  rationale: יכל が表す能力・可能性の否定を、明快な現代日本語で示した。
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: あの民に向かって攻め上る
  rationale: עלה の「上る」を「攻め上る」に残しつつ、אֶל の方向性と軍事的対決という文脈を「に向かって」で表した。「あの民」は直前に報告された土地の住民を指す。
- source_word: כִּי
  choice: …からだ
  rationale: 先行する不可能との主張の理由を導く因果関係を、自然な日本語で明示した。
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: 彼らは私たちより強い
  rationale: 文法上は単数の集合名詞「民」を単数代名詞で受けるが、日本語では構成員を指す「彼ら」が自然である。比較を表す מִן は「より」で保持した。
