  text: לַ/מָּק֣וֹם הַ/ה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽ/אֶשְׁכּ֔וֹל אֲשֶׁר כָּרְת֥וּ מִ/שָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: ja
  text: その場所は、イスラエルの子ら[c]がそこから切り取った房にちなんで、「エシュコルの谷」[a][b]と呼ばれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エシュコルの谷」の「谷」は、季節的に水が流れる川床や、その周囲の谷・峡谷を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 「エシュコル」は、ヘブライ語の「房」と同じ語である。この名は、そこで切り取られた房にちなんで付けられた。
    reason: cultural_note
  - marker: c
    text: 「イスラエルの子ら」は、「イスラエル人」または「イスラエルの子孫」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: その場所は
  rationale: 直前に述べられた場所を指す定冠詞付きの指示表現を、自然な現代日本語で表した。
- source_word: קָרָא
  choice: と呼ばれた
  rationale: 語形は三人称男性単数の能動形だが、名付ける者を明示しない慣用的構文であるため、日本語では受け身が自然である。
- source_word: נַחַל
  choice: 谷
  rationale: 季節的な川床、その周囲の谷、峡谷を指し得る語。地名として簡潔で一般読者にも理解しやすい「谷」を本文に採用し、意味の幅を脚注に示した。
- source_word: אֶשְׁכּוֹל
  choice: エシュコル
  rationale: ここでは地名を構成する固有名詞として音写した。同時に普通名詞「房」との語呂合わせがあるため、脚注で説明した。
- source_word: עַל אֹדוֹת
  choice: にちなんで
  rationale: 命名の理由を示す因果表現。日本語の地名命名文脈では「にちなんで」が明快で自然である。
- source_word: הָאֶשְׁכּוֹל
  choice: 房
  rationale: 直前の節からぶどうの房であることは明らかだが、この節のヘブライ語自体は単に「房」と述べるため、本文では補足せず簡潔に訳した。
- source_word: אֲשֶׁר כָּרְתוּ
  choice: 切り取った
  rationale: כרתの「切る、切り離す」という意味を、房の採取にふさわしい自然な日本語で表した。
- source_word: מִשָּׁם
  choice: そこで
  rationale: その場所から採ったという場所的関係を自然な日本語で表す。「そこから」も可能だが、「切り取った」との組み合わせでは「そこで」が滑らかである。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保ちつつ、複数であることを明確にした。標準的な民族呼称「イスラエル人」も可能である。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの子孫
  rationale: 教理上の大きな相違はないが、原文の家族的・契約共同体的な表現を残すため「イスラエルの子ら」とした。より慣用的な民族名も脚注で示した。
- issue: 命名者を明示しない קָרָא の扱い
  choice: と呼ばれた
  alternative: 彼は名付けた／人々は呼んだ
  rationale: 原文は文法上三人称男性単数だが主語を特定していない。特定人物や集団を補わず、日本語の受動表現で曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、地名の由来を簡潔かつ格調を保って表現した。「エシュコルの谷」を引用符で囲み、固有の地名であることを明確にした。すべての脚注マーカーを本文中の対応箇所に配置した。
