  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: ja
  text: また、彼らが住んでいる土地はどのような所か。良いか悪いか。彼らが住んでいる町々はどのような所か。宿営地か、それとも要塞か。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「宿営地にあるか、それとも要塞にあるか」。ヘブライ語は、宿営地の形態の集落と、防備を施した場所とを対比している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: また、…土地はどのようか
  rationale: וּמָה が土地の状態・性質を問う表現であることを、自然な現代日本語で示した。
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: 彼らが住んでいる
  rationale: 原文は単数形だが、文脈上はその地の住民を集合的に指す。日本語では複数として表すほうが自然で、指示対象も明確になる。
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: 良いか悪いか
  rationale: 土地の評価を広く問う原文を保ち、「肥沃かやせているか」のように農業面だけへ限定しなかった。
- source_word: הֶעָרִים
  choice: 町々
  rationale: 城壁の有無を問う文脈に合う包括的な語として「町々」を選んだ。
- source_word: הַבְּמַחֲנִים
  choice: 宿営地のような所
  rationale: מַחֲנֶה の宿営・野営地という基本義を示しつつ、恒久的な町についての問いとして理解できる表現にした。
- source_word: בְּמִבְצָרִים
  choice: 城壁で守られた所
  rationale: מִבְצָרִים の防備された場所という意味を、一般読者に明瞭な日本語で表した。
