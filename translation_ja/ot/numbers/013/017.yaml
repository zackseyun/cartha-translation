  text: וַ/יִּשְׁלַ֤ח אֹתָ/ם֙ מֹשֶׁ֔ה לָ/ת֖וּר אֶת אֶ֣רֶץ כְּנָ֑עַן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם עֲל֥וּ זֶה֙ בַּ/נֶּ֔גֶב וַ/עֲלִיתֶ֖ם אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: ja
  text: モーセは彼らを遣わしてカナンの地を探らせ[a]、こう言った。「こちらからネゲブ地方[b]に上り、それから山地[c]へ上って行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「偵察させる」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ネゲブは、カナン南部の乾燥した地域。
    reason: cultural_note
  - marker: c
    text: ヘブライ語は「その山」とも訳せる。文脈上、山の多い高地一帯を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 遣わして
  rationale: שלח の通常の派遣の意味を、聖書物語にふさわしい自然で格調ある日本語で表した。
- source_word: לָתוּר
  choice: 探らせ
  rationale: 土地を見て回り、状況を調査する偵察行為を表す。「偵察させる」より平明で、「探検させる」ほど未知地域の踏査に限定されない。密偵的な含みもあり得るため脚注で示した。
- source_word: אֶרֶץ כְּנָעַן
  choice: カナンの地
  rationale: 地名だけに縮めず、原文の「地」を保った定着した表現。
- source_word: עֲלוּ זֶה
  choice: こちらから……上り
  rationale: עלה の上昇・移動の意味を保ち、指示語 זה は経路を指す副詞的用法として自然な日本語にした。
- source_word: בַּנֶּגֶב
  choice: ネゲブ地方に
  rationale: ネゲブを地理的固有名として音写し、ב は移動の文脈に即して到達方向を示す「に」とした。地域の性格は脚注で補った。
- source_word: וַעֲלִיתֶם
  choice: それから……上って行きなさい
  rationale: 先行する命令を継続する指示として訳し、二度現れる עלה の反復も保った。
- source_word: הָהָר
  choice: 山地
  rationale: 単一の山ではなく、高地から成る地域を指す文脈的意味を簡潔に表した。「山々」という理解の余地は脚注に残した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、「遣わす」によって物語文としての品位を保った。地理的な移動を自然に示しつつ、原文にある「上る」の反復を残した。
