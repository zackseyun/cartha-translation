lexical_decisions:
- source_word: לְמַטֵּה
  choice: 族からは
  rationale: ここで מַטֶּה は文字どおりの「杖」ではなく部族を指す。לְ は代表者を部族ごとに挙げる一覧の関係を示しており、日本語では「ダン族からは」とするのが自然である。
- source_word: דָן
  choice: ダン
  rationale: 部族名として、日本語聖書で定着した表記を用いた。
- source_word: עַמִּיאֵל
  choice: アミエル
  rationale: 人名をヘブライ語の発音に即して、慣用的な日本語表記にした。
- source_word: בֶּן
  choice: ～の子
  rationale: ヘブライ語の標準的な父称表現であり、簡潔な名簿形式に合わせた。
- source_word: גְּמַלִּי
  choice: ゲマリ
  rationale: 人名をヘブライ語の発音に即して音写した。語頭の短母音と強勢のない語中音節を、日本語で自然な「ゲマリ」と表記した。
