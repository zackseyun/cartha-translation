lexical_decisions:
- source_word: לְמַטֵּה
  choice: 〜族からは
  rationale: מַטֶּהはこの部族代表者の一覧では「部族」を指す。前置詞לְは一覧中の所属・割り当てを示しており、日本語では文脈に即して「〜族からは」とするのが自然である。
- source_word: שִׁמְעוֹן
  choice: シメオン
  rationale: 部族名・族祖名として、現代日本語の聖書名で一般的な形に音写した。
- source_word: שָׁפָט
  choice: シャファト
  rationale: 人名なので意味を訳さず、ヘブライ語の発音に即して音写した。
- source_word: בֶּן
  choice: 〜の子
  rationale: 父子関係を示す標準的な系譜表現であり、日本語では「父名＋の子＋本人名」の順が自然である。
- source_word: חוֹרִי
  choice: ホリ
  rationale: 人名なので意味を訳さず、慣用的な形で音写した。
