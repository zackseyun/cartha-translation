  text: from the tribe of Ephraim[a], Hoshea son of Nun[b];
translation:
  language: ja
  text: エフライム部族からは、ヌンの子ホシェア[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ホシェアは、後にヨシュアと呼ばれる人物の以前の名である（民数記13章16節参照）。
    reason: cross_reference
  - marker: b
    text: この名は「ホセア」と表記されることもある。ここでは預言者ホセアと区別するため、「ホシェア」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: 部族からは
  rationale: 代表者を部族ごとに列挙する文脈で、所属・出所を示す לְ を自然な日本語で表した。「は」によって一覧の反復構造も明確になる。
- source_word: אֶפְרָיִם
  choice: エフライム
  rationale: ヘブライ語の固有名を、日本語聖書で一般的な形に従って音写した。
- source_word: הוֹשֵׁעַ
  choice: ホシェア
  rationale: ヘブライ語の発音に近い形で音写し、預言者ホセアとの混同を避ける。この人物は13章16節でヨシュアと名づけられる。
- source_word: בִּן
  choice: ～の子
  rationale: 系譜・父称を示すヘブライ語の定型表現を、簡潔で自然な日本語にした。
- source_word: נוּן
  choice: ヌン
  rationale: ヘブライ語の固有名を、日本語で定着した形に従って音写した。
