  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: ja
  text: 彼らは、四十日が終わると、その地の偵察から帰って来た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その地の調査から」または「その地を探る任務から」。ヘブライ語の動詞は、偵察のためにその地を調べて回ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 彼らは…帰って来た
  rationale: שוב のQal連続形で、物語の次の出来事を示す。日本語では接続詞を補わず、自然な叙述とした。
- source_word: מִתּוּר
  choice: 偵察から
  rationale: תור の不定詞構文は、その地を調べて回る任務から戻ったことを表す。文脈上、単なる旅行ではなく調査任務であるため「偵察」としたが、敵情を探る意味に限定される「スパイ」ほど否定的な含みは持たせていない。
- source_word: הָאָרֶץ
  choice: その地
  rationale: 調査対象として既に特定されている土地を指すため、「地球」や一般的な「国」ではなく「その地」とした。
- source_word: מִקֵּץ
  choice: …が終わると
  rationale: 期間の終点、すなわち四十日が満了した時点を表す。現代日本語で自然に時点を示す表現とした。
- source_word: אַרְבָּעִים יוֹם
  choice: 四十日
  rationale: 数詞と単数名詞によるヘブライ語の期間表現を、日本語の通常の数え方で訳した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語文とした。「偵察」は任務の性格を示しつつ、過度に否定的な含意を避ける語として選んだ。
