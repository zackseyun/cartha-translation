lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 次のとおりである
  rationale: 接続詞וは直前から続く名簿の流れに自然に含め、指示語אֵלֶּהは日本語の名簿導入表現「次のとおり」で表した。
- source_word: שְׁמוֹתָם
  choice: その名は
  rationale: 接尾辞の複数対象を受ける「彼らの名」を、現代日本語で自然な名簿見出しとなるよう「その名は」とした。
- source_word: לְמַטֵּה
  choice: 部族からは
  rationale: לְはここで各部族を代表する者の所属・選出元を示すため、「部族からは」と訳した。
- source_word: רְאוּבֵן
  choice: ルベン
  rationale: 聖書で定着した日本語表記に従って音写した。
- source_word: שַׁמּוּעַ
  choice: シャムア
  rationale: ヘブライ語の人名を、原音に配慮した一般的な日本語形で音写した。
- source_word: בֶּן
  choice: の子
  rationale: 系譜・父称を示す標準的で簡潔な日本語表現を用いた。
- source_word: זַכּוּר
  choice: ザクル
  rationale: ヘブライ語の人名を日本語で音写した。強勢や子音重複を不自然に表記せず、読みやすさを保った。
