  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進める連続形で、神の発言を導入する定型表現。日本語では、後続する発言内容への導入として「告げた」が自然であり、単なる「言った」よりも文体上の品位を保つ。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く理解される伝統的な代替表記「主」で示し、脚注で原文が固有名YHWHであることを明記する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を、自然な現代日本語の与格で表す。
- source_word: לֵאמֹר
  choice: （独立して訳出せず）
  rationale: 直訳は「言って」だが、「告げた」で発言導入の機能が十分に表されるため、日本語で冗長な「言って言われた」を避けた。次節の直接話法へ自然につなぐ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主[a]
  alternative: ヤハウェ／YHWH
  rationale: 原文は称号ではなく神名四文字を用いる。その事実を脚注で明示しつつ、本文では一般読者に最も通じる「主」を用いた。発音の再構成には不確実性があるため、本文で一つに固定しない。
translation_notes:
  register: 明快で簡潔な現代標準日本語。発言導入のヘブライ語定型句を、日本語として自然な一文に整えた。
