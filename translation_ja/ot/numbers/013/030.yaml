  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: ja
  text: すると、カレブはモーセの前で民を静め[a]、言った。「必ず上って行って[b]、その地を手に入れよう。私たちには、必ずそれができる[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民を黙らせ」とも訳せる。ヘブライ語の動詞には「静かにさせる」「静まらせる」「黙らせる」という意味がある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「上る、私たちは上る」という強調構文。
    reason: lexical_alternative
  - marker: c
    text: 「私たちは必ずそれに対して能力がある」とも直訳できる。ヘブライ語の強調構文であり、土地を手に入れることを必ず成し遂げられる、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: 静め
  rationale: 群衆を静かにさせることを表す動詞。文脈に合い、強圧的に「黙らせた」と断定しない自然な表現。
- source_word: אֶת־הָעָם
  choice: 民
  rationale: ここでは集まっているイスラエル共同体を指す。聖書本文として自然で簡潔な訳語。
- source_word: אֶל־מֹשֶׁה
  choice: モーセの前で
  rationale: 前置詞אֶלの基本義は「…へ」だが、ここではモーセの面前で民を静めたという場面上の関係を自然な日本語で表した。
- source_word: עָלֹה נַעֲלֶה
  choice: 必ず上って行き
  rationale: 不定詞絶対形と未完了形の組み合わせによる強い強調を「必ず」で示した。文脈上の勧誘の力は、後続する「占領しよう」と合わせて表現した。
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: その地を占領しよう
  rationale: ירשׁは文脈により「所有する」「相続する」「占領する」などを意味する。ここではカナンに進入して土地を自分たちのものとする行為を「占領する」で明確にした。女性単数接尾辞は土地を指すため「その地」とした。
- source_word: כִּי יָכוֹל נוּכַל
  choice: 私たちなら、必ず…成し遂げられる
  rationale: 不定詞絶対形による能力の強い断言を「必ず」で保持し、現代日本語として力強く自然に表した。
- source_word: לָהּ
  choice: それを
  rationale: 女性単数接尾辞は土地に関わる企てを受ける。日本語では直前の「その地を占領する」ことを指す「それを」として、過度な意味の限定を避けた。
