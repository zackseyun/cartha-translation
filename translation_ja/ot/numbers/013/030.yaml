  naturalness: 「必ず上って行き、その地を占領しよう」も理解できるが、「必ず上って行って、その地を手に入れよう」のほうが、共同の勧誘として自然である。「私たちには、必ずそれができる」は明快で、原文の強調を保つ。
  terminology: 「民」「モーセ」「カレブ」は適切である。「占領」は軍事的支配を前景化しうるため、ここでは土地を取得する意味の「手に入れる」を採る。
