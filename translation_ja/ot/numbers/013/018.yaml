source:
  edition: WLC
  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: ja
  text: その地がどのような所か[a]、また、そこに住む民が強いか弱いか、少ないか多いかを見てきなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「その地は何であるか」。ここでは、その地の性質や状態を見極めるという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: 見てきなさい
  rationale: 文脈上、偵察に遣わされる者たちへの指示である。単なる視認ではなく、実地に調べて報告する含みを、自然な日本語で簡潔に表した。
- source_word: הָאָרֶץ מַה הִוא
  choice: その地がどのような所か
  rationale: 直訳的には「その地は何であるか」だが、ここでは土地の性質や状態を見極める問いであるため、「どのような所か」とした。
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: そこに住む民
  rationale: עַלを字義どおり「その上に」とせず、土地の居住者を指す自然な日本語として「そこに住む」とした。עָםは集団としての住民を表すため、文体に合う「民」を用いた。
- source_word: הֶחָזָק הוּא הֲרָפֶה
  choice: 強いか弱いか
  rationale: חזקとרפהの明瞭な対比を、過度な軍事的限定を加えずそのまま保った。
- source_word: הַמְעַט הוּא אִם רָב
  choice: 少ないか多いか
  rationale: 住民の数についての対照的な間接疑問を、簡潔で自然な日本語にした。
theological_decisions: []
