source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: ja
  text: そこでは、ネフィリム[a]、すなわちネフィリムから出たアナクの子らを見た。私たちには、自分たちがバッタのように見えた。そして彼らの目にも、私たちはそう見えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「巨人」とも訳される。ヘブライ語の意味は確定していないため、本文では「ネフィリム」と音写した。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: ネフィリム
  rationale: 指示対象と語源が不確かであり、「巨人」や「堕ちた者」と解釈せず、固有の呼称として音写した。
- source_word: בְּנֵי עֲנָק
  choice: アナクの子ら
  rationale: 系譜・一族を表し得るヘブライ語の「子ら」という表現を保ちつつ、現代日本語でも理解できる形にした。
- source_word: מִן הַנְּפִלִים
  choice: ネフィリムの出である
  rationale: 前置詞 מִן が示す出自・所属関係を表しながら、その関係を「子孫」などに限定しすぎない訳とした。
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: 私たちは自分の目には……見えた
  rationale: 存在の変化ではなく、自己認識を表す慣用句として自然な日本語にした。
- source_word: כַּחֲגָבִים
  choice: いなごのように
  rationale: חָגָב はバッタ・いなご類を指し、ここでは人々の小ささを表す比喩である。日本語の聖書的文脈にもなじむ「いなご」を選んだ。
- source_word: וְכֵן הָיִינוּ בְּעֵינֵיהֶם
  choice: そして彼らの目にも、そう見えた
  rationale: 前半との修辞的な対応を保ち、相手から見ても同じだったという斥候たちの主張を簡潔に表した。
theological_decisions:
- issue: נְפִילִים の解釈
  choice: ネフィリム
  alternative: 巨人、堕ちた者
  rationale: 創世記6章4節にも現れる意味の定まらない語であるため、特定の起源論や存在理解を本文に持ち込まず、音写によって曖昧さを保持した。伝統的な「巨人」は脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「すなわち」を用いて原文の同格関係を示し、「自分の目には／彼らの目にも」の対称性を保った。
