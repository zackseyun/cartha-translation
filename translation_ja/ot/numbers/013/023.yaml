  text: וַ/יָּבֹ֜אוּ עַד נַ֣חַל אֶשְׁכֹּ֗ל וַ/יִּכְרְת֨וּ מִ/שָּׁ֤ם זְמוֹרָה֙ וְ/אֶשְׁכּ֤וֹל עֲנָבִים֙ אֶחָ֔ד וַ/יִּשָּׂאֻ֥/הוּ בַ/מּ֖וֹט בִּ/שְׁנָ֑יִם וּ/מִן הָ/רִמֹּנִ֖ים וּ/מִן הַ/תְּאֵנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: ja
  text: 彼らはエシュコルの谷[a]まで来た。そこで、ぶどう一房のついた枝を切り取り、それを棒に掛けて二人で担いだ[b]。また、ざくろといちじくもいくらか取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エシュコルの川床」または「エシュコルの涸れ谷」とも訳せる。ヘブライ語は、谷や峡谷のほか、季節によって水が流れる川床を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「一房のぶどうのついたぶどうの枝」とも訳せる。ヘブライ語の語は、特にぶどうの枝を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: エシュコルの谷
  rationale: נַחַל は谷、峡谷、季節的な水流の川床を指し得る。地名として自然で広く理解しやすい「谷」を本文に採用し、語義の幅は脚注に残した。
- source_word: זְמוֹרָה וְאֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: ぶどう一房のついた枝
  rationale: זְמוֹרָה はぶどうの枝を指し、後続句は一房のぶどうを表す。日本語では両者の関係を「一房のついた枝」とすることで簡潔かつ明瞭に示した。
- source_word: וַיִּשָּׂאֻהוּ בַמּוֹט בִּשְׁנָיִם
  choice: 二人でさおに担いだ
  rationale: בַמּוֹט は運搬用の棒を表し、בִּשְׁנָיִם は二人による運搬を示す。「さおに担いだ」は、切り取った枝と房を棒で運ぶ情景を自然な日本語で伝える。
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: ざくろといちじくもいくらか持ち帰った
  rationale: ヘブライ語では動詞が省略され、直前の採取・運搬の行為が引き継がれる。「持ち帰った」を補って日本語として明瞭にし、מִן の部分性を「いくらか」で表した。
