translation:
  language: ja
  text: 牛の群れからの雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、焼き尽くす献げ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרを自然な祭儀用語「雄牛」とし、בֶּן בָּקָרが示す牛類・群れへの所属を「牛の群れから」で表した。אֶחָדによる頭数も明示した。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは成長した雄の羊を指す標準的な祭儀用語であり、「雄羊」が明確で自然である。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一歳の雄の子羊一頭
  rationale: כֶּבֶשׂはこの祭儀的文脈では雄の子羊を指し、בֶּן שְׁנָתוֹは一歳であることを示す。「一歳の雄の子羊」で性別と年齢を明確にした。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえとして
  rationale: עֹלָהは祭壇で全体を焼く献げ物を指す。「焼き尽くすいけにえ」は意味を明確に伝え、接頭辞לְは「として」で表した。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物に繰り返される数詞を省略せず、日本語の動物の助数詞「頭」とともに表した。
