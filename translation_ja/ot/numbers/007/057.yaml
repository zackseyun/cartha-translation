translation:
  language: ja
  text: 若い雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、全焼のささげ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרは犠牲用の雄牛を指し、בֶּן בָּקָרは直訳では「牛の子」だが、牛の群れに属する個体を表す慣用句である。日本語では重複を抑えつつ分類上の意味を残した。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは成長した雄の羊を指す標準的な祭儀用語であり、「雄羊」が明確で自然である。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一歳の雄の子羊一頭
  rationale: כֶּבֶשׂはこの犠牲祭儀の文脈では雄の子羊を指し、בֶּן שְׁנָתוֹはその年齢が一歳であることを示す慣用表現である。
- source_word: לְעֹלָה
  choice: 全焼のささげ物として
  rationale: עֹלָהは祭壇で全体を焼いてささげる犠牲を指す。「全焼のささげ物」は意味を明示しつつ、現代日本語で理解しやすい表現である。
