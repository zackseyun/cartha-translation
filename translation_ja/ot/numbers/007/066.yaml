lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: 十日目には
  rationale: 前置詞בを伴う日付表現を、一覧の中で時を示す自然な現代日本語にした。序数「第十」を意味する語義も明確に保っている。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 部族を代表する公認の長を指す。王族を連想させやすい「君主」ではなく、役割を明瞭に表す語を選んだ。
- source_word: לִבְנֵי דָן
  choice: ダンの子らの
  rationale: לはここで、その指導者が代表する集団との関係を示す。「ダン族」と意訳せず、בניの家族的表現を保った。
- source_word: אֲחִיעֶזֶר
  choice: アヒエゼル
  rationale: 人名として音写した。
- source_word: בֶּן
  choice: 子
  rationale: 父称を表す標準的な構文として「〜の子」と訳した。
- source_word: עַמִּישַׁדָּי
  choice: アミシャダイ
  rationale: 人名として音写した。
