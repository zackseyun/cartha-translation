  text: one male goat for a sin offering;[a]
translation:
  language: ja
  text: 雄やぎ一匹を罪のためのささげ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 直訳的には「やぎのうちの毛深いもの」だが、ヘブライ語では雄のやぎを指す慣用表現である。現代日本語で自然かつ祭儀用動物の性別を明確に示す「雄やぎ」とした。
- source_word: אֶחָד
  choice: 一匹
  rationale: 民数記7章の反復的な目録形式を保つため、数詞を明示した。やぎを数える自然な助数詞として「匹」を用いた。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: この祭儀的文脈で חַטָּאת は抽象的な「罪」ではなく供え物の類型を指す。「罪のきよめ」は、罪に関わる祭儀的な清め・除去の機能を示しつつ、単なる抽象概念との混同を避ける。接頭辞 לְ は一覧中の用途を表す「として」とした。
theological_decisions:
- issue: 祭儀的文脈における חַטָּאת の訳語
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪祭
  rationale: 文脈上、語は罪そのものではなく犠牲の種類を表す。「罪のきよめのささげ物」は、その祭儀的機能を伝え、「罪祭」の専門語的で現代には不透明な響きを避ける。贖罪の仕組みについて本文以上の教理的説明は加えない。
translation_notes:
  register: 簡潔な奉献物一覧の文体を保ち、現代の一般読者に理解できる、落ち着いた標準語とした。原文の語順に沿って動物、数量、用途を順に示した。
