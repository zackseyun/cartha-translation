  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の大皿一枚[a]（重さ百三十シェケル）と、銀の鉢一つ[b]（重さ七十シェケル）であった。いずれも聖所のシェケル[c]による重さであった。どちらにも、穀物のささげ物のための、油を混ぜたきめ細かな小麦粉が満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大皿」と訳した語は、「皿」とも訳せる浅い器を指す。
    reason: lexical_alternative
  - marker: b
    text: 「鉢」と訳した語は、「盆」または「深鉢」とも訳せる、聖所の務めに用いられた器を指す。
    reason: lexical_alternative
  - marker: c
    text: 「聖所のシェケル」とは、聖所で定められた標準重量によるシェケルのこと。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物は…であった
  rationale: 祭儀の場で神に献じる物を指すため、「贈り物」より文脈に即した「ささげ物」とし、名詞句の列挙を自然な日本語の文にした。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の大皿一枚
  rationale: קַעֲרָה は比較的浅い皿状の器を指す。「大皿」は後出の鉢との違いを示しつつ、現代日本語で理解しやすい。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重さ百三十シェケル
  rationale: 原文の「その重さ」を明示し、度量衡の単位シェケルを保持した。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָק は聖所の務めで用いる容器。「鉢」は形状を断定しすぎず、大皿とも区別できる。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重さ七十シェケル
  rationale: 日本語では重量であることを補って明瞭にした。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルによる
  rationale: 祭儀上の標準重量に基づくことを表す定型句。本文では原語の制度的表現を保ち、脚注で意味を説明した。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: どちらにも…満たされていた
  rationale: 二つの器を明確に受け、満杯であったという状態を自然な日本語で表した。
- source_word: סֹלֶת
  choice: きめ細かな小麦粉
  rationale: 供え物に用いる精良で細かい小麦粉を、日常の読者にも分かる表現で訳した。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 受動分詞が示す、小麦粉と油が混ぜ合わされた状態を簡潔に表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物とする
  rationale: 祭司文書の文脈で מִנְחָה は穀物を用いるささげ物を指すため、一般的な「ささげ物」より具体的に訳した。
