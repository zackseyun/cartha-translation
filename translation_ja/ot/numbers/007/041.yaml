  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭[b]、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがツリシャダイの子シェルミエルのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平安のいけにえ」または「健全さのいけにえ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は雄牛に限定せず、広く「牛」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞を、ささげ物の一覧を続ける自然な日本語にした。שְׁלָמִיםは神との平和、交わり、健全な状態に関わる祭儀用語であり、その意味領域を過度に一つへ限定しないよう、本文では「交わりのいけにえ」とした。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָרは雄牛に限定されない集合的な「牛」を表すため、性別を付加せず、日本語として自然な助数詞「頭」を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִםが成長した雄羊を明示するため、性別を保って訳した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִיםは雄のやぎを指すため、性別を明示した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: כְּבָשִׂיםの雄性と、בְּנֵי שָׁנָהの年齢指定の双方を明示した。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 定型的なまとめの句として、文脈に合う過去形を用い、קָרְבַּןを一般的な祭儀用語「ささげ物」とした。
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: ツリシャダイの子シェルミエル
  rationale: ヘブライ語の親子関係をそのまま保ち、固有名詞は日本語で発音しやすい形に音写した。
theological_decisions:
- issue: שְׁלָמִיםの祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: この語は単に罪の後の「和解」だけを意味するとは限らず、平和、健全さ、神との交わりを含み得る。本文では祭儀的な共同性を伝える表現を選び、他の有力な訳語を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀一覧の簡潔で荘重な調子を保った。動物の性別と年齢は原文が明示する範囲で訳出し、固有名詞は一般読者が読みやすい音写とした。
