  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: ja
  text: 七日目には、エフライムの子らの指導者[a]は、アミフドの子エリシャマであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「エフライムの子らを代表する指導者」。ヘブライ語の前置詞は、所属・関係を示すとも、代表関係を示すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目には
  rationale: 前置詞 בְּ と「日」および序数から成る時を表す句を、文脈に即した自然な現代日本語で表した。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 民数記7章では、ささげ物を携えて来る部族の代表者を指す。「君主」や「族長」よりも役割を明瞭に伝える語を選んだ。
- source_word: לִבְנֵי אֶפְרָיִם
  choice: エフライムの子らの
  rationale: לְ が示し得る所属・関係を本文で簡潔に表し、「子ら」というヘブライ語の系譜的表現を保持した。代表関係としての理解も可能なため脚注に示した。
- source_word: אֱלִישָׁמָע
  choice: エリシャマ
  rationale: ヘブライ語の人名を日本語の慣用的な音写で示した。
- source_word: בֶּן עַמִּיהוּד
  choice: アミフドの子
  rationale: 父称を表す標準的なヘブライ語構文を、自然で簡潔な日本語にした。
