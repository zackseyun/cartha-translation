translation:
  language: ja
  text: 香で満たされた、重さ十シェケルの金の小皿一つ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は字義的には「金の小皿一つ、金十、香で満たされた」。この章の奉納品目録の定型に基づき、重量単位「シェケル」を補っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 小皿
  rationale: ここでは手のひらではなく、香を入れる小型の祭具を指す。「さじ」よりも容器としての性質が明確な「小皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する単純な基数詞であり、日本語では助数表現「一つ」とする。
- source_word: עֲשָׂרָה זָהָב
  choice: 重さ十シェケルの金の
  rationale: 直訳的には「金十」と省略された重量表現で、この章に反復される奉納品目録の定型から単位シェケルを補う。器の材質が金であることと重量を自然に示す。
- source_word: מְלֵאָה
  choice: 満たした
  rationale: 器に香がいっぱい入っている状態を、簡潔で自然な日本語として表す。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 幕屋・祭儀の文脈で焚く香料を指す標準的な訳語。
