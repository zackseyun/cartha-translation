  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ja
  text: 金の小皿一つ。重さは十シェケルで、香で満たされていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「金の小皿一つ、十、香で満たされたもの」。民数記7章で繰り返される奉納品の定型句に基づき、重量単位「シェケル」を補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 小皿
  rationale: 幕屋への奉納品という文脈では、香を入れる小型の儀式用容器を指す。「さじ」では現代日本語で食器を連想しやすいため、浅い容器を自然に表す「小皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する基数詞であり、容器が一つであることを表す。
- source_word: עֲשָׂרָה זָהָב
  choice: その重さは十シェケル
  rationale: ヘブライ語では重量単位が省略されているが、民数記7章で反復される奉納品の定型句から、金製容器の重量を示すと判断できる。明瞭な日本語にするため「重さ」と「シェケル」を補った。
- source_word: זָהָב
  choice: 金の
  rationale: 容器の材質を示しているため、自然な連体修飾として訳した。
- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 容器が内容物で満ちている状態を表す述語形容詞。文脈に合う自然で格調ある表現とした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝でたかれる芳香物質を指す。聖書の祭儀文脈で一般的かつ簡潔な訳語である。
theological_decisions: []
