- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 女性形の述語形容詞で容器の状態を述べる。日本語として自然に、内容物が入っていたことを表した。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝で焚く香料を指す語であり、聖書文脈で簡潔かつ自然な「香」とした。
