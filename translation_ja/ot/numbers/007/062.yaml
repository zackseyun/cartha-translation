lexical_decisions:
- source_word: כַּף
  choice: 皿
  rationale: 幕屋への奉納品の文脈では、香を入れる小型の容器を指す。「さじ」よりも現代日本語で自然な「皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 容器の数量を表す基本的な数詞として訳した。
- source_word: עֲשָׂרָה זָהָב
  choice: 重さは十シェケル
