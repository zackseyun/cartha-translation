  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: ja
  text: 「彼らから受け取り、それらを会見の天幕の奉仕に用いなさい。そして、それらを各人の奉仕に応じてレビ人に与えなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: 彼らからそれらを受け取り
  rationale: לקח の命令形は「取れ」だが、ここでは族長たちが献げた車と雄牛をモーセが受領する場面なので、現代日本語では「受け取り」が自然である。接尾辞の指示対象である品々も「それら」と明示した。
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: 奉仕に用いなさい
  rationale: 直訳的には「奉仕を行うためのものとせよ」。主語は無生物の車と雄牛であり、日本語では用途を表す「用いなさい」とすることで意味を自然に伝える。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルの荒野の聖所を指す定型表現として、מוֹעֵד の会合・会見の含意を保つ一般的な訳語を採用した。
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: それらをレビ人に…与えなさい
  rationale: נתן の基本義「与える」を保ち、品々を奉仕のために配分する文脈は後続句で示した。
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: その奉仕に応じてそれぞれ
  rationale: אִישׁ はここで分配を示し、כְּפִי は各人の担当する奉仕に応じた配分を表す。「それぞれ」を文末近くに置き、自然な日本語で分配の意味を明確にした。
