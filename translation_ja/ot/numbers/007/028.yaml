translation:
  language: ja
  text: 罪のためのささげ物として、雄やぎ一頭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 犠牲の文脈で、やぎの雄を指す。日本語では「雄やぎ」が性別と動物種を自然かつ明確に表す。
- source_word: אֶחָד
  choice: 一頭
  rationale: 供え物の明細なので、明示された数を保持し、動物に適した助数詞「頭」を用いる。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: この祭儀的文脈の חַטָּאת は抽象的な「罪」ではなく供え物を指す。「罪祭」より意味が伝わりやすく、罪に関わる清めの機能を示す表現とした。接頭辞 לְ はここでは用途を示す「として」と訳す。
theological_decisions:
- issue: 祭儀的文脈における חַטָּאת の訳語
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪祭
  rationale: 直近の文脈は供え物の一覧であるため、抽象的な「罪」ではなく祭儀上の供え物を意味する。一方で「罪祭」だけでは現代の一般読者に意味が伝わりにくいため、「罪のきよめのささげ物」とした。
translation_notes:
  register: 簡潔な供え物一覧の文体を保ち、現代の一般読者にも理解できる、自然で厳かな表現とした。
