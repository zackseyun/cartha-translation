  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ja
  text: 焼き尽くすささげ物として、若い雄牛一頭、雄羊一頭、一歳の雄の子羊一頭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרは雄牛を指し、בֶּן בָּקָרは字義的には「牛の子」だが、ここでは牛の群れに属する牛を表す慣用句。重複を避けつつ原文の指定を自然な日本語で保った。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは犠牲に用いる成長した雄羊を指す標準的な語である。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一歳の雄の子羊一頭
  rationale: כֶּבֶשׂはこの犠牲の文脈では雄の子羊を指し、בֶּן שְׁנָתוֹは「一歳」または「生後一年以内」を表す年齢表現である。簡潔で自然な「一歳の」とした。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえとして
  rationale: עֹלָהは祭壇で全体を焼くささげ物を指す。一般読者にも内容が伝わる、現代的で尊厳ある定訳を用いた。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物の数量を示す反復された数詞。日本語では動物に自然な助数詞を伴わせた。
