translation:
  language: ja
  text: 罪のためのささげ物として、雄やぎ一匹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: この連語は直訳すれば「やぎの中の毛深いもの」だが、慣用的に雄のやぎを指す。現代日本語で自然かつ祭儀用動物の性別を明確にするため「雄やぎ」とした。
- source_word: אֶחָד
  choice: 一匹
  rationale: 犠牲動物の数を表す単純な数詞である。民数記7章の反復的な目録形式を保ち、日本語では動物に自然な助数詞「匹」を添えた。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: 祭儀の文脈で חַטָּאת は罪そのものではなく、その対処ときよめのための犠牲を指す。「罪祭」は簡潔だが一般読者に意味が伝わりにくいため、機能を明確にする「罪のきよめのささげ物」を採用し、前置詞 לְ は目録文脈に自然な「として」で表した。
theological_decisions:
- issue: 祭儀的文脈における חַטָּאת の訳し方
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪祭／罪
  rationale: ここはささげ物の目録なので、抽象的な「罪」ではなく祭儀上の犠牲を指す。語が担う罪の除去・きよめという機能を伝えつつ、特定の教派的解釈を持ち込まない表現とした。
translation_notes:
  register: 民数記7章の簡潔で反復的な目録調を保った。一般読者に理解できる現代標準日本語を用い、「罪祭」のような説明を要する専門的な定訳は本文では避けた。
