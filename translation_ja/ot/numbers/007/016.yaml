translation:
  language: ja
  text: 罪のためのささげ物として、雄やぎ一匹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 字義的には「やぎの中の毛深いもの」で、雄のやぎを指す慣用表現。現代日本語で自然かつ明確な「雄やぎ」とした。
- source_word: אֶחָד
  choice: 一匹
  rationale: ささげ物の点数を列挙する文脈に合わせ、動物を数える自然な助数詞を用いて数詞を明示した。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: חַטָּאת は祭儀的文脈で、罪そのものではなく罪に関わる犠牲を指す。「罪のきよめのささげ物」は機能を明確にしつつ、「罪を取り除くためのささげ物」などと効果を過度に限定しない。前置詞 לְ はこの列挙では「として」と自然に表した。
theological_decisions:
- issue: חַטָּאת の祭儀用語としての訳
  choice: 罪のきよめのささげ物
  alternative: 罪のためのいけにえ／罪祭
  rationale: 伝統的な「罪祭」は簡潔だが一般読者には意味が伝わりにくく、「罪のためのいけにえ」は目的や効力を一方向に解釈しやすい。祭儀上の清めに関わるささげ物であることを、平明かつ過度に教派的でない表現で示した。
translation_notes:
  register: 民数記7章の供え物一覧に合う簡潔な名詞句とし、現代の一般読者に通じる、落ち着いた礼拝的文体を用いた。
