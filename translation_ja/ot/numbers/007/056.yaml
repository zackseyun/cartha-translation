lexical_decisions:
- source_word: כַּף
  choice: 皿
  rationale: 幕屋への献納品という文脈では、香を入れる小型の容器を指す。「さじ」よりも現代の読者に容器として自然に伝わる「皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する基数詞を、日本語では自然に「一つ」と表した。
- source_word: עֲשָׂרָה
  choice: 十シェケル
  rationale: ヘブライ語本文では重量単位が省略されているが、民数記7章で反復される献納品の定型表現と文脈から、重さ十シェケルの意味であるため単位を補った。
- source_word: זָהָב
  choice: 金の
  rationale: 容器の材質が金であることを明確かつ自然に表した。
- source_word: מְלֵאָה
  choice: 満たしていた
  rationale: 容器が香で満ちている状態を表す女性単数の形容詞。列挙文として読みやすい表現にした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝で焚く芳香物を指す定着した聖書用語として「香」を用いた。
