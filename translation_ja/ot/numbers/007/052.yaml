  text: one male goat for a sin offering;
translation:
  language: ja
  text: 罪のきよめのささげ物として、雄やぎ一匹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 犠牲についてのこの慣用的な連語は、一般的な「やぎ」ではなく雄のやぎを指す。現代日本語では「雄やぎ」が自然で、性別も明示できる。
- source_word: אֶחָד
  choice: 一匹
  rationale: 供え物を列挙する文脈で数量を明示する数詞。日本語では動物に用いる助数詞を添え、「一匹」とした。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: חַטָּאת は祭儀的文脈で、罪そのものではなく、罪を扱うための供え物を指す。「罪祭」より普通の読者に意味が伝わりやすく、単に「罪のため」として祭儀的意味を曖昧にすることも避けた。前置詞 לְ は、この動物の用途を示す「として」で表した。
theological_decisions:
- issue: חַטָּאת の訳語
  choice: 罪のきよめのささげ物
  alternative: 罪のためのいけにえ／罪祭
  rationale: 「罪のためのいけにえ」は意味が広く、「罪祭」は専門用語的で分かりにくい。「罪のきよめ」は、この供え物が罪とそれに伴う汚れを扱う祭儀であることを簡潔に示しつつ、特定の償罪理論に限定しない。
translation_notes:
  register: 供え物の目録として簡潔で格調ある体言止めを用いた。「ささげ物」は現代の一般読者にも理解しやすい表記とした。
