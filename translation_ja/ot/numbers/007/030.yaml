- source_word: בַּיּוֹם הָרְבִיעִי
  choice: 四日目には
  rationale: 日ごとに奉献物をささげる一連の叙述における時を示す表現として、自然な現代日本語にした。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 部族の公認された代表者・長を指す。王族を連想させやすい「君」よりも、現代の読者に明確な語を選んだ。
- source_word: לִבְנֵי רְאוּבֵן
  choice: ルベンの子らの
  rationale: 前置詞לはここでは所属・代表関係を示す。「ルベン人」ではなく、原文の家族的・部族的表現を保った。
- source_word: אֱלִיצוּר
  choice: エリツル
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: בֶּן
  choice: ～の子
  rationale: 人物を父名によって特定する標準的な父称表現として訳した。
- source_word: שְׁדֵיאוּר
  choice: シェデウル
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: '[implicit verb from context]'
  choice: ささげた
  rationale: 原文は名詞句のみだが、7:12以降の列挙では前文の「奉献物をささげた」が省略されている。日本語で独立した節として意味が通るよう、文脈上の動詞を補った。
