  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: そのささげ物は、重さ百三十シェケルの銀の皿[a]一枚と、重さ七十シェケルの銀の鉢[b]一つであり、いずれも聖所のシェケル[c]によるものであった。両方とも、穀物のささげ物のために、油を混ぜた上等の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」は「大皿」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「鉢」は「椀」とも訳せる。祭儀に用いる器を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳「聖所のシェケルで」。聖所で定められた標準重量を指す。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: そのささげ物は
  rationale: 祭儀の文脈におけるקָרְבָּןを、現代日本語で自然かつ広く理解できる「ささげ物」とした。ヘブライ語の無動詞節は文末の「ものであった」で自然に補った。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קְעָרָהは皿状の器を指すため「皿」とし、平たい器に自然な助数詞「枚」を用いた。別訳「大皿」も可能なので脚注に示した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: 明示された「重さ」を保持し、数詞は日本語の通常の順序で表した。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָקは祭儀に用いる容器だが、用途まで本文に織り込まず、器形を示す広い語「鉢」とした。別訳「椀」を脚注に示した。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: その重さは七十シェケル
  rationale: 省略されている重量関係を日本語で明確にし、先行する皿の表現とそろえた。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルによる
  rationale: 祭儀上の標準重量を表す定型句を直訳寄りに保ち、意味は脚注で明示した。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: どちらにも……満たされていた
  rationale: 二つの器を明示する双数的な指示を「どちらにも」で自然に表し、「満ちている」という状態を日本語では受動表現で滑らかにした。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 供え物に用いる精製度の高い良質な粉を、一般読者に分かりやすい定訳で表した。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 受動分詞の内容を日本語の連体修飾として簡潔かつ自然に表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物として
  rationale: 祭司文書の文脈でמִנְחָהが指す穀物の供え物という祭儀的な具体性を保持した。
theological_decisions: []
