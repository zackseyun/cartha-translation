revisions:
- from: そのささげ物は、銀の皿[a]一枚、その重さは百三十シェケル、銀の鉢[b]一つ、その重さは七十シェケルで、聖所のシェケル[c]によるものであった。どちらにも、穀物のささげ物として、油を混ぜた上等の小麦粉が満たされていた。
  to: そのささげ物は、重さ百三十シェケルの銀の皿[a]一枚と、重さ七十シェケルの銀の鉢[b]一つであり、いずれも聖所のシェケル[c]によるものであった。両方とも、穀物のささげ物のために、油を混ぜた上等の小麦粉で満たされていた。
