  - severity: low
    issue: 「穀物のささげ物として」は可能だが、目的を表す「ために」の方が器に満たされた粉の用途を自然に示す。
    rationale: לְמִנְחָהはここで油を混ぜた上等の小麦粉が穀物のささげ物のためのものであることを示す。
