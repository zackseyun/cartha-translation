source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: ja
  text: しかし、ケハトの子らには何も与えなかった。聖なるものを扱う務めが彼らに課されており、それらを肩に担いで運ばなければならなかったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: しかし、ケハトの子らには
  rationale: 前節で他のレビ人諸氏族に車と牛を与えたこととの対比を「しかし」で示す。「子ら」は氏族名としての表現を保つ。
- source_word: לֹא נָתָן
  choice: 何も与えなかった
  rationale: 直前に挙げられた車と牛を一つも与えなかったという、省略された目的語を文脈に沿って自然に表す。
- source_word: כִּי
  choice: からである
  rationale: ケハト族に車と牛を与えなかった理由を明示する。
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: 聖なるものを扱う務め
  rationale: עֲבֹדָהを「務め」、הַקֹּדֶשׁを文脈上ケハト族に委ねられた聖なる器物と理解する。ただし具体的な器物名までは補わない。
- source_word: עֲלֵיהֶם
  choice: 彼らにあり
  rationale: 直訳的な「彼らの上にあった」が表す責務・担当の意味を、自然な現代日本語で示す。
- source_word: בַּכָּתֵף
  choice: 肩に担いで
  rationale: 単数形「肩」の集合的・配分的用法を保ちつつ、運搬方法として自然な日本語にする。
- source_word: יִשָּׂאוּ
  choice: それらを……運ばなければならなかった
  rationale: 未完了形がこの文脈で表す規定上の義務を示す。目的語「それら」は、直前の「聖なるもの」を受けて補った。
theological_decisions:
- issue: הַקֹּדֶשׁ が指す範囲
  choice: ケハト族に託された「聖なるもの」すなわち聖なる器物を指す表現として訳す
  alternative: 「聖所の務め」または「聖なる務め」と訳す
  rationale: 民数記4章および本節の運搬の文脈では、ケハト族が肩で運ぶ聖なる器物を指す可能性が高い。一方、訳文では器物と限定しすぎず「聖なるもの」として原文の表現幅を残す。
translation_notes:
  register: 明快で現代的だが礼拝朗読にも適する端正な文体。「扱う」は単なる接触ではなく、世話・運搬を含む務めとして用いた。原文の因果関係が日本語で自然になるよう、理由節を後置した。
