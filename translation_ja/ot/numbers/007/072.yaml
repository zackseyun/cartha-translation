reference: Numbers 7:72
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: ja
  text: 第十一日には、アシェルの子らの指導者[a]は、オクランの子パグイエルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「指導者」は、アシェル族を代表する部族長を指す。
    reason: נָשִׂיאの文脈上の意味を明確にし、王族を意味する称号との誤解を避けるため。
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: 第十一日には
  rationale: ヘブライ語では「日」が反復されるが、民数記7章の定型的な日付表現であるため、自然な現代日本語の序数表現とした。助詞「には」によって、この献げ物の連続における時点と対比を示した。
- source_word: עַשְׁתֵּי עָשָׂר
  choice: 第十一
  rationale: 形の上では基数的な数詞構文だが、この文脈では奉献の日程を順に数える序数として機能するため、「第十一」と訳した。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: ここでは王族の称号ではなく、部族を代表する公認の長を指す。「君主」などの誤解を避け、明瞭な「指導者」とした。
- source_word: לִ/בְנֵי אָשֵׁר
  choice: アシェルの子らの
  rationale: 前置詞לは所属・代表関係を示す。部族名だけに平板化せず、原文の親族的表現「アシェルの子ら」を保持した。
- source_word: פַּגְעִיאֵל
  choice: パグイエル
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な音写にした。
- source_word: בֶּן עָכְרָן
  choice: オクランの子
  rationale: 父子関係を示すבֶּןを自然かつ簡潔な日本語の父称表現「〜の子」とした。עָכְרָןは「オクラン」と音写した。
theological_decisions:
- issue: 動詞のない名詞文の扱い
  choice: 「指導者は…であった」とし、人物を特定する名詞文として訳す
  alternative: 文脈から「…が献げ物をした」と補う
  rationale: 原文には「献げ物をした」に相当する動詞がなく、日付、役職、氏名だけが置かれている。前後の奉献記事から行為を補うことは可能だが、この節自体の曖昧さと簡潔さを保つため、最小限のコピュラだけを補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「アシェルの子ら」という親族的・部族的表現を残しつつ、動詞のないヘブライ語名詞文は日本語として自然な「であった」で結んだ。
