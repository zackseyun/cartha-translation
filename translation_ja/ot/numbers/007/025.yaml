  to: 彼のささげ物は、銀の皿[a]一枚――重さ百三十シェケル――と、銀の鉢[b]一つ――重さ七十シェケル――であり、いずれの重さも聖所のシェケルによるものであった[c]。その二つは、穀物のささげ物のための、油を混ぜた上質の小麦粉で満たされていた。
