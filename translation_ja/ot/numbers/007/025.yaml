  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の皿[a]一枚――重さ百三十シェケル――と、銀の鉢[b]一つ――重さ七十シェケル――であり、いずれの重さも聖所のシェケルによるものであった[c]。その二つは、穀物のささげ物のための、油を混ぜた上質の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀の大皿」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「銀の碗」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「聖所のシェケルによって」。聖所で定められた標準重量に従うという意味。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物は
  rationale: 祭儀の文脈で神にささげる物を指すため、「贈り物」ではなく、明瞭で一般的な「ささげ物」とした。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קַעֲרָה は比較的浅い器を指すため「皿」とし、日本語で自然な助数詞「枚」を用いた。器の厳密な形状には不確かさがあるため、脚注に別訳を示した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重さ百三十シェケル
  rationale: ヘブライ語の重量表示を、日本語として自然な数詞順に整えつつ、簡潔な目録調を保った。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָק は祭儀に用いる容器で、「鉢」は「皿」と区別しながら器の形を過度に限定しない。別訳「杯」を脚注に示した。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重さ七十シェケル
  rationale: 直前の器の重量であることを明示し、最初の器との並行を保った。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準とした
  rationale: 直訳的な「聖所のシェケルによって」が意味する公的な重量基準を、現代日本語で明瞭に表した。文化的背景は脚注で補った。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: その二つには…満たされていた
  rationale: 二つの器を明示し、内容物で満ちていたという述語関係を自然な日本語で表現した。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 祭儀用に精製された良質な粉を指す。日本語で内容が明瞭になるよう「小麦粉」とした。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 油と粉を混ぜ合わせた調製状態を、簡潔な現代日本語で表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物とする
  rationale: 祭司文書の文脈における מִנְחָה の特定の祭儀的意味を保ち、一般的な「ささげ物」と区別した。
