  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: ja
  text: 彼らはヤハウェの前に、自分たちのささげ物、すなわち覆いのある荷車六台[a]と牛十二頭を携えて来た。荷車は指導者二人につき一台、牛は指導者一人につき一頭であった。彼らはそれらを幕屋の前に差し出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「覆いのある荷車」と訳したヘブライ語の表現は、伝統的に覆いや天蓋を備えた運搬用の車を指すと理解されている。別訳「覆い付きの車」。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: 自分たちのささげ物
  rationale: 祭儀の場で神の前に携えて来る品を指すため、「贈り物」よりも文脈に即した「ささげ物」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵי の空間的・関係的意味を簡潔に保ち、神名 יְהוָה は称号に置き換えず固有名「ヤハウェ」とした。
- source_word: עֶגְלֹת צָב
  choice: 覆いのある荷車
  rationale: עֲגָלָה は運搬用の車、צָב は伝統的に覆いまたは天蓋を備えたものと理解される。語義の不確かさは脚注で示した。
- source_word: בָּקָר / שׁוֹר
  choice: 雄牛
  rationale: 運搬用の役畜という文脈と、後半の単数 שׁוֹר を踏まえ、両者を自然に対応させた。去勢の有無まで本文から確定できないため「去勢牛」とはしない。
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: 指導者二人につき荷車一台
  rationale: 一台を二人で分担する配分表現を、明瞭な現代日本語で再現した。נָשִׂיא は部族の代表者を指すため「指導者」とした。
- source_word: וְשׁוֹר לְאֶחָד
  choice: 各人につき雄牛一頭
  rationale: 各指導者に一頭ずつという配分を簡潔に表した。
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: 彼らはそれらを…差し出した
  rationale: קרב の使役形は祭儀的に近づける、差し出す意を持つが、荷車と牛について犠牲として屠ったと誤解されないよう「差し出した」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: מִשְׁכָּן の標準的で簡潔な日本語訳。אֹהֶל מוֹעֵד（会見の天幕）とは区別した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いていることを明示し、称号へ置換せず音写した。
- issue: 荷車と雄牛を「ささげた」の意味
  choice: 幕屋の前に差し出した
  alternative: 幕屋の前でいけにえとしてささげた
  rationale: 対象には荷車も含まれるため、動詞の祭儀的含意を保ちつつ、動物犠牲としての屠殺を本文に読み込まない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「携えて来た」「差し出した」により、冒頭と末尾の異なる動詞を訳し分けた。数と配分関係が即座に分かるよう、原文の同格的列挙を二文に整えた。
