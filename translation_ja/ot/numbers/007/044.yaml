  text: 金の皿一つ、重さ十シェケルで[a]、香料で満たされたもの。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「金の皿一つ、金十、香料で満たされた」。重量単位の「シェケル」は、この章で繰り返される重量の表現に基づいて補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 皿
  rationale: この章で香を入れる小型の容器を指す。現代日本語として自然で、形状を「さじ」などに限定しすぎない「皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する単純な基数詞。日本語では助数表現「一つ」で自然に示した。
- source_word: עֲשָׂרָה זָהָב
  choice: 重さは十シェケル
  rationale: ヘブライ語本文には重量単位が明記されていないが、この章で繰り返される献納品の重量表現からシェケルが補われる。「金」は容器の材質として直前に訳し、ここでは重量を明確にした。
- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 容器に内容物が満ちている状態を表す述語形容詞。日本語では自然な述語として訳した。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝でたく芳香物質を指す標準的な聖書用語として「香」を用いた。
