  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: ja
  text: 三日目には、ゼブルンの子孫の指導者[a]は、ヘロンの子エリアブであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ゼブルンの子孫を代表する指導者」。ヘブライ語の前置詞は、所属または代表関係を示すものと理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目には
  rationale: 前置詞בְּを時間を示す用法と取り、序数を自然な現代日本語の「三日目」で表した。係助詞「は」により、日ごとに進む献げ物の叙述とのつながりも示す。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 民数記では部族を代表する公的な長を指す。「君主」や「王子」という王族的な含意を避けつつ、その地位を明瞭に伝えるため「指導者」とした。
- source_word: לִבְנֵי זְבוּלֻן
  choice: ゼブルンの子孫の
  rationale: בְּנֵיの系譜的意味を「子孫」で表し、לְは所属を示すものとして本文に反映した。ただし、代表関係を示す「子孫のための」とも理解できるため脚注で示した。
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: ヘロンの子エリアブ
  rationale: ヘブライ語の標準的な父称表現を、日本語で自然な「父名の子、本人名」の順に訳した。
