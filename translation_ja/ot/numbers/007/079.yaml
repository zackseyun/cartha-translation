base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の大皿一枚[a]、その重さは百三十シェケル、銀の鉢一つ[b]、その重さは聖所のシェケルを基準にして七十シェケルであった。二つとも、穀物のささげ物のための、油を混ぜた上質の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀の鉢一つ」とも訳せる。ヘブライ語 קַעֲרָה は容器を指すが、その正確な形状は明らかでない。
    reason: lexical_alternative
  - marker: b
    text: 「銀の注ぎかけの鉢一つ」とも訳せる。ヘブライ語 מִזְרָק は、液体などを振りかけたり注ぎかけたりする祭儀上の用途を持つ器を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物
  rationale: 神に近づけて献げる物を指す祭儀用語として、現代日本語で明瞭かつ自然な「ささげ物」を用いた。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の大皿一枚
  rationale: קַעֲרָה は供物を載せる比較的浅い器と考えられるため「大皿」としたが、形状には不確かさがあるので脚注で「鉢」も示した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: 原文が器の重量を明示する名詞文であることを保ち、自然な日本語にした。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: 祭儀で用いる容器を指すが、具体的機能を本文で限定しすぎない一般的な「鉢」を採用した。脚注に「注ぎかけの鉢」という機能的訳を示した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準にして
  rationale: 祭儀上の公定重量基準を表す定型句として、意味が一般読者に伝わる表現にした。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: どちらにも…満たされていた
  rationale: 二つの器を明示的に受ける双数的な意味を保ちながら、日本語として自然に表現した。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 祭儀に用いる細かくひいた良質な穀粉を表す。日本語では原料を明確にする慣用的な聖書語彙を採用した。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 油を混ぜた
  rationale: 油と混ぜ合わせられた状態を表す受動分詞を、簡潔で現代的な日本語にした。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物とする
  rationale: 祭司文書の文脈では穀物を用いる特定の供犠を指すため、単なる「ささげ物」ではなく種類を明示した。
