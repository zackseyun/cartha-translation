  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: ja
  text: また、交わりのいけにえとして、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがヘロンの子エリアブのささげ物であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞が前節から続く供え物の一覧を導く。זֶבַחは祭儀的な「いけにえ」、שְׁלָמִיםは神との交わりや平安を伴う供犠を指すため、現代日本語で意味を捉えやすい「交わりのいけにえ」とした。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָרは性別を明示しない牛の集合名詞なので、「雄牛」と限定せず「牛」とした。日本語の自然な助数詞「頭」を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִםは明確に雄の羊を指すため、性別を保持して「雄羊」と訳した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִיםは雄のやぎを指すため、「雄やぎ」とした。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: בְּנֵי שָׁנָהは年齢を示す定型句なので「一歳の」とし、כְּבָשִׂיםの雄性を保ちながら自然に「雄の子羊」とした。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: קָרְבַּןは神の前に携えて来る供え物を広く指す。「ささげ物」は自然で包括的であり、物語上の一覧を締めくくるため過去形とした。
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: ヘロンの子エリアブ
  rationale: ヘブライ語の父称構文を、日本語で簡潔かつ自然な「ヘロンの子エリアブ」とした。
theological_decisions:
- issue: הַשְּׁלָמִים の祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 語は平安、健全、共同の食事や交わりに関わる意味領域を持つ。「交わり」は供犠の機能を理解しやすく示す一方、「和解」のように罪の贖いへ意味を狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は過度に古風にせず、「いけにえ」「ささげ物」を用いた。原文の簡潔な目録調を保持した。
