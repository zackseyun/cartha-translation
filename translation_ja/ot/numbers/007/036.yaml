lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: 五日目には
  rationale: 定冠詞を伴う序数の時を表す句。「奉献の」はこの節に明記されていないため補わず、自然な日本語にした。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: この文脈では部族を代表する長を指す。「君主」は王族的な意味を帯びやすいため避けた。
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: シメオンの子ら
  rationale: 所属・代表関係を示す לִ と בְנֵי の表現を保ちつつ、日本語で理解できる形にした。より自然な「シメオン族」も可能なので脚注に示した。
- source_word: שְׁלֻמִיאֵל
  choice: シェルミエル
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: בֶּן
  choice: 子
  rationale: 系譜的な父子関係を示す定型表現として「〜の子」と訳した。
- source_word: צוּרִישַׁדָּי
  choice: ツリシャダイ
  rationale: ヘブライ語の人名を日本語で音写した。
theological_decisions:
- issue: 動詞のない名詞句
  choice: 「であった」などの動詞を補わず、後続節へ続く提示構文として訳す
  alternative: 「指導者は…であった」と完結した文にする
  rationale: 原文には動詞がなく、供え物を述べる後続節へ続く列挙形式であるため、その構造を保った。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、原文の簡潔な列挙形式と語順をできるだけ保持した。人名は原語に基づいて音写した。
