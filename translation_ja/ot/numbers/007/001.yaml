source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: ja
  text: モーセが幕屋を建て終えた日、彼は幕屋に油を注ぎ、それを聖別した。それから、幕屋のすべての備品、祭壇とそのすべての器具に油を注ぎ、それらを聖別した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּיוֹם כַּלּוֹת
  choice: ……建て終えた日
  rationale: 物語導入の וַיְהִי と時間表現を、日本語で不自然な「そして、起こった」を置かず、明瞭な時間節として表した。בְּיוֹם は字義的には「その日に」だが、文脈上「……した時」と近い時間表現であり、「日」は保持した。
- source_word: לְהָקִים אֶת הַמִּשְׁכָּן
  choice: 幕屋を建て終えた
  rationale: הקים はここでは幕屋を設営すること。「建てる」は現代日本語で自然かつ具体的であり、כַּלּוֹת の完了相を「終えた」で示した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 荒野の聖所を指す定着した日本語訳で、住まいという語義と礼拝施設としての文脈を簡潔に伝える。
- source_word: וַיִּמְשַׁח
  choice: 油を注いで
  rationale: משׁח は聖別儀礼として油を塗る／注ぐことを指す。「油を注ぐ」は日本語聖書語彙として理解しやすく、単なる塗布以上の儀礼的含意を保つ。
- source_word: וַיְקַדֵּשׁ
  choice: 聖別した
  rationale: קדשׁ のピエル形は、この祭儀的文脈では聖なる用途のために取り分けること。「聖別」は物品に対する儀礼的行為を簡潔かつ正確に示す。
- source_word: כָּל כֵּלָיו（幕屋）
  choice: そのすべての備品
  rationale: 幕屋に属する כֵּלִים は広く礼拝用の調度・物品を指すため、「器具」より包括的な「備品」とした。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: מזבח の標準的で明確な訳語。
- source_word: כָּל כֵּלָיו（祭壇）
  choice: そのすべての器具
  rationale: 祭壇に付属して使用される用具を指すため、幕屋全体の「備品」より具体的な「器具」とした。
- source_word: וַיִּמְשָׁחֵם וַיְקַדֵּשׁ אֹתָם
  choice: にも油を注いで聖別した
  rationale: ヘブライ語の複数目的語を、直前の「祭壇とそのすべての器具」に自然につなげた。反復される二つの儀礼行為は省略せず保持した。
theological_decisions:
- issue: 祭儀的な聖さを表す用語
  choice: 聖別した
  alternative: 聖なるものとした／清めた
  rationale: ここでの קדשׁ は道徳的改善や汚れの除去よりも、聖なる用途のために取り分ける行為を指す。「聖別」はその祭儀的意味を保ち、「清めた」と同一視することを避ける。
- issue: 末尾の複数代名詞の指示範囲
  choice: 直前の祭壇とその器具を明示的な文法上の対象として訳す
  alternative: 幕屋、その備品、祭壇、その器具のすべてを総括すると解する
  rationale: 複数接尾辞は直前の「祭壇とそのすべての器具」を自然に受ける一方、節全体の総括とも理解し得る。日本語では直前の対象につなげつつ、幕屋側にも同じ行為が行われたことを前半で明記し、神学的な範囲を不当に狭めないようにした。
translation_notes:
  register: 明瞭で現代的かつ礼拝文書にふさわしい格調を保った。「幕屋」「祭壇」「聖別」は定着した語を用い、構文は日本語として自然になるよう再編した。注記を必要とするほど本文理解を左右す代替訳はないため、脚注は付していない。
