  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ja
  text: 牛の群れの雄牛一頭[a]、雄羊一頭、一歳の雄の子羊一頭[b]を、全焼のささげ物として。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「雄牛一頭、牛の子」。牛類に属する雄牛を表す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「子羊一頭」とも訳せる。ここで用いられているヘブライ語は、いけにえの文脈では雄の子羊を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: 雄牛
  rationale: いけにえの文脈で雄牛、または若い雄牛を指す。現代日本語として明確な「雄牛」とした。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物の数を個別に示す反復を保ち、日本語では動物を数える自然な助数詞「頭」を用いた。
- source_word: בֶּן בָּקָר
  choice: 牛の群れから
  rationale: 直訳すれば「牛の子」だが、牛類に属することを示すヘブライ語の慣用表現であるため、自然な日本語で出所・種類を表した。
- source_word: אַיִל
  choice: 雄羊
  rationale: 成長した雄の羊を指す標準的ないけにえ用語であり、「雄羊」が直接的で自然である。
- source_word: כֶּבֶשׂ
  choice: 雄の子羊
  rationale: 子羊を表し、いけにえの用語として雄を指すことが多い。性別を明示しつつ、語の基本的意味も保った。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 直訳的には「その年の子」だが、一年齢、または生後一年以内を表す定型的な年齢表現であり、簡潔な日本語にした。
- source_word: לְעֹלָה
  choice: 全焼のささげ物として
  rationale: 動物を祭壇で焼き尽くすささげ物を指す定着した祭儀用語であり、前置詞 לְ の用途・目的も「として」で表した。
