  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ja
  text: 九日目に、ベニヤミンの子らの指導者[a]は、ギデオニの子アビダンであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ベニヤミンの子らのための指導者」。ヘブライ語の前置詞は、この句で所属・関係または代表の意味を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: 九日目には
  rationale: 前置詞בְּを伴う日付表現を、自然な現代日本語の時間表現として訳した。文脈上、各日のささげ物の記述を導く句である。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 民数記7章では部族を代表してささげ物を携える公認の長を指す。「君主」などの王制的含意を避け、役割を明瞭に示す語を選んだ。
- source_word: לִבְנֵי בִנְיָמִן
  choice: ベニヤミンの子らの
  rationale: לְはここで指導者と部族集団との所属・関係を示す。「子ら」を保ち、祖先ベニヤミンに連なる部族というヘブライ語の家系的表現を反映した。
- source_word: אֲבִידָן
  choice: アビダン
  rationale: ヘブライ語の人名を日本語で慣用的に音写した。
- source_word: בֶּן
  choice: 子
  rationale: 父称を作る標準的な語であり、日本語では「ギデオニの子アビダン」と自然に表現した。
- source_word: גִּדְעֹנִי
  choice: ギデオニ
  rationale: ヘブライ語の人名を日本語で音写した。
theological_decisions:
- issue: 部族名を表すבְנֵיの性別・家系表現
  choice: ベニヤミンの子ら
  alternative: ベニヤミン族／ベニヤミンの民
  rationale: この男性複数形は祖先ベニヤミンに連なる部族集団を表すため、家系的な原文表現を保った。文脈上、個々の男性だけに限定する意味ではない。
- issue: לִבְנֵיが示す関係
  choice: ベニヤミンの子らの指導者
  alternative: ベニヤミンの子らのための指導者／ベニヤミンの子らを代表する指導者
  rationale: 前置詞לְには関係・所属と代表の含みがあり得るが、本文では簡潔な所属表現とした。特定の機能だけに意味を狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文は日付句に続く名詞句で、直前から続く定型的な献納記事の見出しとして動詞を省いているため、日本語でも「〜であった」を補わず簡潔な提示形を保った。
