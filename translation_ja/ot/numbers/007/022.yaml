  text: 罪のきよめのささげ物として、雄やぎ一匹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: この連語は、いけにえとして用いる雄のやぎを指す。日本語では二語を逐語的に分けず、「雄やぎ」とするのが自然で、性別も明示できる。
- source_word: אֶחָד
  choice: 一匹
  rationale: ささげ物の数量を示す語。動物を数える自然な助数詞を用い、列挙調を保った。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: 祭儀的文脈でחַטָּאתは所定の供え物の種類を表す。「罪」そのものではなく、罪をきよめるためのささげ物であることを明確にしつつ、原語の機能を自然な日本語で示した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳語
  choice: 罪のきよめのささげ物
  alternative: 罪のためのいけにえ／罪祭
  rationale: この箇所では抽象的な「罪」ではなく祭儀上の供え物を指す。「罪のきよめのささげ物」は、その祭儀的カテゴリーと罪への関係を示しながら、償いと浄化のどちらか一方だけに意味を限定しすぎない。
translation_notes:
  register: 民数記7章の献納品一覧に合う簡潔な列挙調とした。「雄山羊」のような硬い表記を避け、現代の一般読者に読みやすい「雄やぎ」を採用した。
