  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ja
  text: 四台の荷車と八頭の雄牛を、メラリの子らに、その務めに応じて、祭司アロンの子イタマルの指揮のもとで与えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: 荷車
  rationale: 幕屋の運搬に用いる車両を指すため、現代日本語で明瞭な「荷車」とした。
- source_word: הַבָּקָר
  choice: 雄牛
  rationale: 荷車を引く動物という文脈に即し、一般的な「牛」より具体的な「雄牛」とした。
- source_word: נָתַן
  choice: 与えた
  rationale: 公式な配分という含意は文脈に委ね、動詞の基本的意味を保った。
- source_word: לִבְנֵי מְרָרִי
  choice: メラリの子らに
  rationale: 氏族を表すヘブライ語の親族的表現を保持した。
- source_word: כְּפִי עֲבֹדָתָם
  choice: その務めに応じて
  rationale: כְּפִי の比例・対応の意味と、幕屋に関する עֲבֹדָה の職務的意味を自然な日本語で表した。
- source_word: בְּיַד אִיתָמָר
  choice: イタマルの指揮のもとに
  rationale: 直訳は「イタマルの手によって」だが、ここでは管理・監督を示す行政的な慣用句なので、その機能を明示した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: アロンを同格的に特定する称号として訳した。
theological_decisions: []
