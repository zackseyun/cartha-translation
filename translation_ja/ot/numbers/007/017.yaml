base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがアミナダブの子ナフションのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平安のいけにえ」または「健やかさを願ういけにえ」とも訳せる。ヘブライ語では、平安や健やかさ、また神の前で共に食事をする交わりに関わるいけにえを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞が供え物一覧の次の項目を導く。שְׁלָמִיםは共同の食事と平和・健全さに関わる祭儀用語であり、現代日本語で意味が伝わりやすい「交わりのいけにえ」とした。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָרは牛を指す集合名詞で、ここでは性別を明示しないため「牛」とした。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִםは成長した雄羊を明確に指す。
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתּוּדִיםは雄のやぎを指すため、性別を明示した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の子羊五匹
  rationale: בְּנֵי שָׁנָהは「一歳の」を意味する。כְּבָשִׂיםには雄を指し得る語義があるが、この定型的な供え物一覧では日本語として過剰に限定せず「子羊」とした。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 動詞のない指示文を、物語上の総括として自然な過去形で表した。קָרְבַּןは祭儀上の「ささげ物」。
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: アミナダブの子ナフション
  rationale: 父称関係を日本語の自然な語順で示し、固有名詞はヘブライ語に沿って音写した。
theological_decisions:
- issue: שְׁלָמִיםの訳語
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: この祭儀名には平和、健全さ、共同の食事という意味領域があり、一語で尽くせない。「交わり」は共同飲食の側面を伝え、脚注で主要な代案を明示して曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は本文で理解しやすくしつつ、訳し切れない意味領域を脚注で示した。数え方は、牛には「頭」、羊とやぎには一般的な「匹」を用いた。
