translation:
  language: ja
  text: 罪のためのささげ物として、雄やぎ一頭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: この連語は字義的には「やぎのうちの毛深いもの」ですが、祭儀文脈では雄のやぎを指します。「雄やぎ」は現代日本語で明確かつ自然で、いけにえの動物の性別も保持します。
- source_word: אֶחָד
  choice: 一頭
  rationale: ヘブライ語の数詞を明示し、動物に自然な助数詞「頭」を用いました。民数記7章の反復的な目録形式にも合います。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: חַטָּאת はこの祭儀文脈で特定のささげ物を表します。単に「罪」とせず祭儀的意味を明示しつつ、「罪祭」より一般読者に理解しやすい表現としました。接頭辞 לְ は用途・役割を示す「として」で表しました。
theological_decisions:
- issue: חַטָּאת の祭儀名称
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪祭
  rationale: この語は罪に関わるいけにえですが、罪責の処理だけでなく祭儀的な清めにも関わり得ます。「罪のきよめ」はその幅を保ち、「罪祭」の専門語的な分かりにくさを避けます。
translation_notes:
  register: 簡潔な目録調を保ち、文末の動詞を補わず、現代の一般読者にも分かる格調ある表現としました。
