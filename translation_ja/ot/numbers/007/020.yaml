lexical_decisions:
- source_word: כַּף
  choice: ひしゃく
  rationale: 幕屋の献納品を列挙する文脈では、手のひらではなく香を入れる小型の容器を指す。日本語では「ひしゃく」が器具として自然であり、単なる食器を連想させにくい。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する単純な基数詞。
- source_word: עֲשָׂרָה זָהָב
  choice: 金十シェケルの
  rationale: 原文には重量単位「シェケル」が明記されていないが、周囲の献納品の定型表現から重量単位が省略されていると判断し、意味を通すため本文で補った。
- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 容器の状態を表す述語的形容詞。日本語では文として自然になるよう叙述した。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 幕屋礼拝で用いる芳香物質を指す標準的な聖書用語として「香」を採用した。
