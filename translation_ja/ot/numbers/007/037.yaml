  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の皿[a]一枚――その重さは百三十シェケル――、銀の鉢[b]一つ――その重さは聖所のシェケル[c]で七十シェケル――であった。どちらにも、穀物のささげ物のための、油を混ぜた上等の小麦粉がいっぱいに入っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「浅い鉢」または「大皿」とも訳せる。ヘブライ語は、皿や浅い鉢を広く指し得る器物名。
    reason: lexical_alternative
  - marker: b
    text: 「注ぎかけ用の鉢」とも訳せる。このヘブライ語の器は、ほかの箇所では祭儀で血などを注ぎかけるために用いられる。
    reason: lexical_alternative
  - marker: c
    text: 「聖所のシェケル」とは、聖所で定められた標準重量によるシェケルのこと。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物
  rationale: 礼拝のために携えて来る供え物を表す。現代日本語で自然かつ祭儀的文脈にも適する「ささげ物」とした。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קַעֲרָה は皿、浅鉢などを指し得る器物名。本文では簡潔な「皿」とし、語義の幅を脚注に残した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: 原文の名詞的構文「その重さは百と三十」を、数値を保ちながら自然な日本語にした。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָק は祭儀で用いる鉢を指すが、この箇所では用途を明示していないため、機能を限定しない「鉢」とした。別訳は脚注に示した。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: その重さは…七十シェケル
  rationale: 鉢の重量を示すことが日本語で明確になるよう「その重さは」を補った。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルで
  rationale: 聖所で定められた重量基準によることを示す原文の祭儀的表現を簡潔に保持した。意味は脚注で説明した。
- source_word: שְׁנֵיהֶם
  choice: どちらにも
  rationale: 二つの器の双方を指す。後続の「いっぱいに入っていた」と自然につながる表現にした。
- source_word: מְלֵאִים
  choice: いっぱいに入っていた
  rationale: 二つの器が内容物で満ちていた状態を、明瞭で自然な現代日本語で表した。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 供犠に用いる精製された良質の穀粉を指す定型語。一般読者に理解しやすい表現とした。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 穀粉が油と混ぜ合わされている調製状態を自然な日本語で表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物とするための
  rationale: 祭司文書の文脈では穀類による供え物を指すため、単なる「ささげ物」より具体的に訳した。
