source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: ja
  text: そこでヤハウェはモーセに言った。「一日に指導者一人、一日に指導者一人が[a]、祭壇の奉献のために、それぞれ自分の供え物を献げなければならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「各部族の指導者が一日に一人ずつ」。ヘブライ語は「指導者一人、一日につき」という表現を繰り返し、ささげ物を献げる順序を強調している。
    reason: 「指導者」は文脈上、各部族の代表者を指す。また、原文の特徴的な反復とその配分的な意味を説明するため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……は……言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語の接続で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: ここでは各部族を代表する長を指す。「君主」などの王権的含意を避け、現代日本語で明瞭な語を選んだ。
- source_word: אֶחָד לַיּוֹם
  choice: 一日に一人
  rationale: 日ごとに一人ずつという配分的意味を示しつつ、原文の反復を保持した。
- source_word: יַקְרִיבוּ
  choice: 献げなければならない
  rationale: 祭儀的文脈におけるヒフィル形の「差し出す、献げる」を表し、神の指示としての命令的な力を自然な日本語で示した。
- source_word: קָרְבָּנָם
  choice: それぞれ自分のささげ物
  rationale: 複数主語に対応する接尾辞「彼らの」を配分的に訳し、各指導者が自分の供え物を献げる意味を明確にした。
- source_word: לַחֲנֻכַּת
  choice: 奉献のために
  rationale: 祭壇を正式に用い始める奉献の目的・機会を表す語として、祭儀的でありながら理解しやすい表現を選んだ。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲を献げる祭壇を表す標準的な訳語。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文に固有名として現れる四文字神名を称号で代替せず、一般的な推定発音に基づいて音写した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神の発言としての厳粛さを保ち、原文の「一日に一人」の反復を省略しなかった。
