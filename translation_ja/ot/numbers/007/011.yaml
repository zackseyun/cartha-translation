  naturalness: 「一日に一人の指導者、一日に一人の指導者が」は、最初の反復句が文中で浮いて聞こえる。「一日に指導者一人、一日に指導者一人が」として、原文の名詞・日ごとの反復を保ちながら自然に接続できる。
  terminology: 「ヤハウェ」「モーセ」「指導者」「祭壇」「奉献」は適切である。「供え物を献げる」は、原文の祭儀的な「ささげ物」と動詞の近さを不必要に重ねず、明瞭な現代日本語である。
