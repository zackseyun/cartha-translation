translation:
  language: ja
  text: 香で満たされた、重さ十シェケルの金の小皿一つ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小さな平鍋」「小鉢」とも訳せる。伝統的には「さじ」と訳されることも多いが、ヘブライ語はより広く、小型の祭儀用容器を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 小皿
  rationale: 幕屋の祭具目録という文脈では、手の「ひら」ではなく、香を入れる小型の儀礼用容器を指す。「さじ」よりも器としての広がりを保ちつつ、自然な現代日本語とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する単純な基数詞であり、日本語では「小皿一つ」とした。
- source_word: עֲשָׂרָה
  choice: 重さは十シェケル
  rationale: 原文には単位名が明記されていないが、民数記7章の反復される目録表現では重量単位シェケルが文脈上補われるため、意味を明確にした。
- source_word: זָהָב
  choice: 金の
  rationale: 容器の材質を示す語として簡潔に訳した。
- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 容器が香でいっぱいである状態を表す述語形容詞。自然で格調を保つ表現とした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝で焚く芳香物質を指す。聖書の祭儀文脈で一般的な日本語「香」を採用した。
