reference: Numbers 7:89
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: ja
  text: モーセが神と語るために会見の天幕に入ると、証しの箱の上にある贖いの蓋[a]の上方、二つのケルビム[b]の間から、モーセに語りかける声を聞いた。そして、彼はモーセに語りかけた。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの蓋」は、証しの箱を覆う祭儀用の蓋を指す。神はその上方、ケルビムの間から語られた。
    reason: cultural_note
  - marker: b
    text: ケルビムは、神の臨在と王座に結びつけられる天的な存在である。ここでは、二つのケルビムの像が箱の蓋の上に置かれていた。
    reason: cultural_note
  - marker: c
    text: 末尾の動詞には主語が明記されていない。「彼」は神を指すと理解でき、直前の「声」を主語と理解することもできる。より明示すれば「神はモーセに語りかけた」または「その声はモーセに語りかけた」と訳せる。また、「モーセに語りかける声」の「語りかける」に当たる分詞は、「モーセに語られている声」という含みをもつと理解されることもある。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: 入ると
  rationale: 前置詞 בְּ と不定詞 בֹּאによる時を表す節を、自然な日本語の「入ると」で表した。文脈上は反復的な「入るたびに」も可能だが、ここでは場面を描く基本的な読みを採った。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神が民と会う聖所を指す定着した表現であり、名称の意味と荘重さを保つ。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 神と語るために
  rationale: 直訳は「彼と語るために」。指示対象は文脈上、贖いの蓋の上方から語る神であるため、日本語で不自然な代名詞を避けて「神」とした。前置詞 אֵת は「と」の相互的・関係的な響きを持つ。
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: 声を聞いた
  rationale: קוֹל は音一般も表し得るが、後続する「語りかける」と聖所での啓示の文脈から「声」が適切である。
- source_word: מִדַּבֵּר
  choice: 語りかける
  rationale: 「声」を修飾する分詞として、モーセに向けられた発話を自然に表した。この形には「語っている」または受動的な含みを認める分析もあるため、脚注で示す。
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: 贖いの蓋の上方
  rationale: כַּפֹּרֶת は箱を覆う祭儀的な蓋で、贖いと結びつく語である。「贖いの蓋」は物体であることと神学的機能の双方を明確にする。
- source_word: אֲרֹן הָעֵדֻת
  choice: 証しの箱
  rationale: 契約の証しの板を納める箱を指す。「証し」は עֵדוּת の法的・契約的な意味を過度に説明せず保つ。
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: 二つのケルビムの間から
  rationale: כְּרוּבִים を固有の天的存在を指す伝統的な音写「ケルビム」で表した。
- source_word: וַיְדַבֵּר אֵלָיו
  choice: その声はモーセに語りかけた
  rationale: 動詞の主語は明示されていない。直前の「声」を文法上の受け手に分かりやすい主語として補ったが、実質的な語り手は神である。原文の可能性は脚注に残した。
theological_decisions:
- issue: 「彼と語る」の「彼」が誰を指すか
  choice: 神と語るために
  alternative: 彼と語るために／主と語るために
  rationale: 幕屋、贖いの蓋、ケルビムの間からの声という文脈から神を指す。「主」は意味として妥当だが、この節の当該箇所には神名 יהוה がないため、神名を明示するより「神」とした。
- issue: 末尾の וַיְדַבֵּר אֵלָיו の主語
  choice: その声はモーセに語りかけた
  alternative: 神はモーセに語りかけた／そして、彼に語りかけた／モーセは神に語った
  rationale: 直前の「声」と分詞の流れから、神から出る声がモーセに語るとの理解が最も自然である。ただし、ヘブライ語の動詞には主語となる名詞が明記されず、別の構文理解もあり得るため脚注で明示した。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で荘重な標準語を用いた。「会見の天幕」「証しの箱」「贖いの蓋」「ケルビム」は祭儀的な固有性を保ちつつ、過度に古風な言い回しを避けた。ヘブライ語にある反復的な「語る」の表現も省略せず残した。
