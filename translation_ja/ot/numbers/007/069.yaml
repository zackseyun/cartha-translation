  yaml_path: translation/ot/numbers/007/069.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ja
  text: 若い雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、焼き尽くす献げ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 若い雄牛一頭
  rationale: פַּרは雄牛、特に若い雄牛を指し、בֶּן בָּקָרは直訳では「牛の子」だが、祭儀用の牛を表す定型的な分類表現である。日本語では重複を避けつつ意味を自然に伝えるため「若い雄牛一頭」とした。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは祭儀文脈で成長した雄の羊を指すため、「雄羊」が明確で自然である。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一歳の雄の子羊一頭
  rationale: כֶּבֶשׂは子羊、とりわけ祭儀文脈では雄の子羊を指し、בֶּן שְׁנָתוֹは「一歳」または「生後一年以内」を表す定型句である。簡潔な献げ物一覧として「一歳の雄の子羊」とした。
- source_word: לְעֹלָה
  choice: 焼き尽くす献げ物として
  rationale: עֹלָהは祭壇上で全体を焼く献げ物を指す定着した祭儀用語であり、現代日本語で内容が伝わる「焼き尽くす献げ物」とした。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物に反復される数詞を、動物にふさわしい助数詞を伴う「一頭」で一貫して表し、原文の列挙構造を保った。
