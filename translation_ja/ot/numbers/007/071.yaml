base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭、雄羊五匹、雄やぎ五匹、一歳の子羊五匹。これが、アミシャダイの子アヒエゼルのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「平安のいけにえ」または「健やかさのいけにえ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、和解のいけにえとして
  rationale: 接続詞と前置詞を自然な日本語で表し、שְׁלָמִיםを伝統的で理解しやすい祭儀用語「和解のいけにえ」とした。語の意味には「交わり」や「平安・繁栄」の含意もあるため、脚注に別訳を示した。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָרは性別を限定しない牛類の総称なので、「雄牛」などとせず「牛」とした。
- source_word: אֵילִים חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִיםが雄羊を指すことを明示した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִיםは雄のやぎを指すため、現代日本語で明瞭な「雄やぎ」とした。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の子羊五匹
  rationale: 直訳的な「一年の子ら」を、犠牲動物の年齢指定が明確に伝わる自然な表現にした。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 完了した献納を列挙する文脈に合わせて過去形とし、קָרְבַּןを一般読者にも分かる「ささげ物」と訳した。
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: アミシャダイの子アヒエゼル
  rationale: 人名を音写し、בֶּןによる父子関係を日本語の自然な語順で表した。
theological_decisions:
- issue: שְׁלָמִיםの祭儀的意味
  choice: 和解のいけにえ
  alternative: 交わりのいけにえ／平安のいけにえ
  rationale: この語の語義を単一の神学的概念に限定せず、本文では定着した訳語を用いながら、別の含意を脚注で保持した。
