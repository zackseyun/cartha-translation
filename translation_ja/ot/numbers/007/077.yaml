  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭[b]、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがオクランの子パグイエルの献げ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「和解のいけにえ」「平安のいけにえ」。ヘブライ語は、平和、健全さ、交わりに関わる祭儀上の名称。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は性別を特定せず、集合的に「牛」を意味する。伝統的に「雄牛二頭」と訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞が献げ物の一覧に次の項目を加えていることを自然な日本語で示した。שְׁלָמִים は共同の食事、平安、健全さに関わる祭儀用語であり、「交わりのいけにえ」は意味を一つに限定しすぎず、現代の読者にも理解しやすい。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָר は牛を集合的に指し、この箇所自体は性別を明示しない。「二頭」により日本語として自然に数えた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִם は一般的な羊ではなく雄羊を指すため、性別を明示した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִים は雄のやぎを指す。常用的で読みやすい表記として「雄やぎ」とした。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: כְּבָשִׂים の雄の含意と、בְּנֵי שָׁנָה の年齢指定をともに保持した。
- source_word: זֶה קָרְבַּן
  choice: これが…の献げ物であった
  rationale: 繰り返される奉献目録の締めくくりとして、指示語を保持しつつ物語文脈に合う過去形にした。
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: オクランの子パグイエル
  rationale: 人名を日本語で音写し、בֶּן の父子関係を明示した。
theological_decisions:
- issue: שְׁלָמִים の祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ／健全さを祝ういけにえ
  rationale: 語は平和、健全さ、共同の交わりに関係する幅を持つ。「交わり」は祭儀に伴う共同性を伝える一方、神学的な「和解」だけに意味を固定しない。別訳は脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、祭儀用語には簡潔で品位ある「いけにえ」「献げ物」を用いた。動物の数え方は、牛に「頭」、羊とやぎに「匹」を用いて自然な日本語にした。英語相談訳では脚注記号と内容の位置にずれがあるため、原語上の対象に合わせて[a]をשְׁלָמִים、[b]をבָּקָרに付した。
