  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ja
  text: 焼き尽くすいけにえとして、牛の群れから雄牛一頭、雄羊一頭、一歳の雄の子羊一頭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרは祭儀文脈で雄牛を指し、בֶּן־בָּקָרは直訳すれば「牛の子」だが、牛の群れに属する牛を示すヘブライ語の慣用表現である。自然な日本語で意味を保った。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは成長した雄の羊を指す標準的な祭儀用語であり、「雄羊」が正確で自然である。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 雄の子羊一頭
  rationale: כֶּבֶשׂは子羊、とりわけ祭儀文脈では雄の子羊を指すため、性別を明示した。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 字義的には「その年の子」だが、その動物が生後一年以内または一歳であることを表す慣用句であり、簡潔な現代日本語とした。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえとして
  rationale: עֹלָהは祭壇で全体を焼くささげ物を指す。「焼き尽くすいけにえ」は儀礼の性格を明確に伝え、接頭辞לְは「として」で表した。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物の数量を示す反復を保ち、日本語で動物を数える自然な助数詞を用いた。
