  text: one male goat for a sin offering—[a]
translation:
  language: ja
  text: 罪のためのささげ物として、雄やぎ一匹——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 字義的には「やぎのうちの毛深いもの」だが、雄のやぎを指す慣用表現。現代日本語で自然かつ犠牲動物の性別を明確に示すため「雄やぎ」とした。
- source_word: אֶחָד
  choice: 一匹
  rationale: 供え物を列挙する文体に合わせ、数詞「一」を動物用の助数詞とともに直接表した。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: 祭儀的文脈の חַטָּאת は、罪そのものではなく罪に関わる犠牲を指す。「罪祭」より分かりやすく、罪からの清めという祭儀上の機能を示す表現とした。前置詞 לְ は、この動物の用途を表す「として」で訳した。
theological_decisions:
- issue: חַטָּאת の祭儀名称
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪祭
  rationale: 語が罪に関わる犠牲を指すことを保ちつつ、単に罪を供えるかのような誤解を避けるため。ただし、贖罪と清めのどちらか一方に意味を限定しすぎないよう、脚注に別訳を示した。
translation_notes:
  register: 供え物一覧の簡潔な調子を保ち、現代の一般読者にも理解しやすい、簡潔で品位ある表現とした。末尾のダッシュは原文が次節へ続く一覧の一項であることを示す。
