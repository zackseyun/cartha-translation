  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の皿[a]一枚で、その重さは百三十シェケル、銀の鉢[b]一つで、その重さは聖所のシェケル[c]で七十シェケルであった。二つとも、穀物のささげ物のための、油を混ぜた上質の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大皿」とも訳せる。ヘブライ語は祭儀に用いる皿状の容器を指す。
    reason: lexical_alternative
  - marker: b
    text: 「水盤」とも訳せる。ヘブライ語は、供え物に用いる器を指す。
    reason: lexical_alternative
  - marker: c
    text: 聖所で定められた標準重量による、という意味。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物は
  rationale: קָרְבָּןは祭儀のために差し出す物を指す。「ささげ物」は文脈に即し、現代日本語として明瞭である。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קְעָרָהは皿状の祭具を指す。「皿」は形状を簡潔に示し、助数詞「枚」も自然である。別訳の可能性は脚注に示す。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: 直訳的な「その重さ」を保ち、数値を明確に示した。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָקは犠牲奉献に用いられる容器。「鉢」は家庭用に限定されず、形状も想起しやすい。祭儀的機能は脚注で補う。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルで
  rationale: 祭儀上の標準重量によることを示す定型句。「聖所のシェケル」は原文の構造を保ち、意味は脚注で説明する。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: どちらにも…満たされていた
  rationale: 二つの容器を明示的に受けつつ、日本語として自然な受動表現にした。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 穀物奉献に用いる精製された良質の粉を表す。日本語では単なる「細かい粉」より用途と品質が伝わる。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 油と粉を混ぜ合わせた状態を、簡潔な現代日本語で表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物として
  rationale: 祭司文書の文脈でמִנְחָהは穀物による奉献を指すため、一般的な「ささげ物」と区別した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。列挙が読みにくくならないよう二文に分け、原文が明示する二つの器と各重量を保った。度量衡名シェケルは音写し、文化的意味を脚注で補った。
