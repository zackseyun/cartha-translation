  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ja
  text: 牛の群れから雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、全焼のささげ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרを「雄牛」、בֶּן בָּקָרを所属・分類を表すヘブライ語の慣用句と捉えて「牛の群れから」とした。逐語的な「牛の子」は現代日本語では年齢を不必要に限定しかねない。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは祭儀用動物としての成長した雄羊を指す標準的な語であり、「雄羊」が明確で自然である。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 雄の子羊一頭
  rationale: כֶּבֶשׂが示す雄の子羊という性別と種類を明示し、列挙中のאֶחָדを「一頭」で再現した。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 字義的には「その年の子」だが、犠牲動物の年齢を示す慣用表現であるため、明快な現代日本語の「一歳の」とした。
- source_word: לְעֹלָה
  choice: 全焼のささげ物として
  rationale: עֹלָהは祭壇で全体を焼いてささげる供え物を指す。「全焼のささげ物」はその祭儀的特徴を簡潔に伝え、「として」で列挙された動物の用途を示す。
theological_decisions: []
translation_notes:
  register: 祭儀の品目一覧として簡潔な体言止めを用い、原文で三度繰り返される「一」をそれぞれ「一頭」として保持した。現代標準日本語として明瞭かつ荘重さを損なわない表現にした。
