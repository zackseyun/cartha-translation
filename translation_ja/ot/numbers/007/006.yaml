  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: ja
  text: そこでモーセは、荷車と牛を受け取り、レビ人たちに与えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 受け取り
  rationale: לקחの基本義は「取る」だが、直前でささげられた品をモーセが受領する文脈なので、現代日本語では「受け取り」が自然であり、行為の方向も明確になる。
- source_word: הָעֲגָלֹת
  choice: 荷車
  rationale: עגלהは物資運搬用の車を指す。この幕屋奉仕の文脈では、現代日本語の「荷車」が用途を簡潔かつ自然に表す。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בקרは牛類を集合的に指す語である。章内の文脈では荷車を引く雄牛が想定されるが、この節自体の広い表現を不必要に狭めず、日本語で自然な集合表現「牛」とした。
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: נתןの基本的な意味をそのまま表す。「割り当てた」とすることも可能だが、行政的な含意を本文以上に強めない。
- source_word: אוֹתָם
  choice: （荷車と牛を目的語として明示）
  rationale: 男性複数目的語代名詞は荷車と牛をまとめて受ける。日本語では「それらを」を置くより、共有目的語として自然に省略できる。
- source_word: אֶל הַלְוִיִּם
  choice: レビ人たちに
  rationale: אֶלが示す移動・移譲の方向を、授与の相手を示す助詞「に」で直接表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の連続する物語叙述を「そこで」で受け、簡潔な一文にした。「レビ人」は集団であることが自然に伝わるよう「レビ人たち」とした。
