  naturalness: 全体として明瞭だが、「どちらにも…満たされていた」より「二つとも…で満たされていた」のほうが、主語・内容物・受動表現の対応が自然である。
  terminology: 「ささげ物」「シェケル」「穀物のささげ物」「上質の小麦粉」は適切である。「鉢」の別訳を「杯」とするのは、祭儀用の碗・鉢状の器であるמִזְרָקを狭く誤解させうるため、「ボウル」等とする。
