revisions:
- from: 彼のささげ物は、銀の皿一枚[a]、その重さは百三十シェケル、銀の鉢一つ、その重さは聖所のシェケルで七十シェケルであった。どちらにも、穀物のささげ物として、油を混ぜた上質の小麦粉が満たされていた。
  to: 彼のささげ物は、銀の皿一枚[a]、重さ百三十シェケル、銀の鉢一つ[b]、重さ七十シェケルであり、いずれも聖所のシェケルによる。二つとも、穀物のささげ物のために、油を混ぜた上質の小麦粉で満たされていた。
  rationale: 原文の目録的な列挙を維持しつつ、聖所のシェケルという重量基準が二つの器の双方に及ぶことを明示した。内容物については、原文の「二つとも満ちていた」という叙述に沿う自然な日本語へ整えた。脚注は各語の直後に対応するよう分け、מִזְרָקの別訳をより適切な語に改めた。
  reviewer_model: gpt-5.6-terra
