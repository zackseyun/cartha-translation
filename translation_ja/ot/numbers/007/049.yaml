  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の皿一枚[a]、重さ百三十シェケル、銀の鉢一つ[b]、重さ七十シェケルであり、いずれも聖所のシェケルによる。二つとも、穀物のささげ物のために、油を混ぜた上質の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」は「大皿」とも訳せる。
    reason: 原語קַעֲרָהは器の名称であり、具体的な形状を日本語の一語で確定しにくいため。
  - marker: b
    text: 「鉢」は「ボウル」とも訳せる。
    reason: 原語מִזְרָקは祭儀用の器の名称であり、具体的な形状を日本語の一語で確定しにくいため。
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物は
  rationale: 祭儀において神の前に携えて来る供え物を指すため、現代日本語で明瞭な「ささげ物」とした。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קַעֲרָה は比較的広く浅い器を指し得る。日本語では形状を自然に示す「皿」を採用し、別訳を脚注に残した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: 器に続いて重量を述べる原文の目録的な構造を、明瞭な日本語で保持した。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָק は祭儀に用いる鉢状の器。日本語で過度に用途を限定しない「鉢」とした。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: その重さは……七十シェケル
  rationale: 第二の器についても重量であることを明示し、日本語として自然に補った。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルで
  rationale: 重量が聖所で定められた基準によることを簡潔に表した。「聖なるシェケル」とはせず、基準との関係を保持した。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: どちらにも……満たされていた
  rationale: 二つの銀器の双方を指すことが明確になる自然な日本語とした。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 供え物用に精製された良質な粉を指す。日本語の聖書文脈で理解しやすい表現を選んだ。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 粉が油と混ぜ合わされている状態を、現代日本語で簡潔に表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物として
  rationale: 祭司文書の文脈では穀物を用いる特定のささげ物を表すため、一般的な「ささげ物」より具体的に訳した。
theological_decisions: []
translation_notes:
  register: 祭具目録の簡潔さを保ちつつ、重量の係り先が明確になるよう「その重さは」を補った。現代の一般読者に理解できる、平明で品位ある文体とした。シェケルは古代の重量単位として音写した。
