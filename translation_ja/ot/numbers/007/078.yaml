source:
  edition: WLC
  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: ja
  text: 十二日目には、ナフタリの子らの指導者、エナンの子アヒラ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר יוֹם
  choice: 十二日目には
  rationale: ヘブライ語では「十二の日」という形で序数を表す定型句。日本語では自然な序数表現「十二日目」とし、前置詞 בְּ の時間的用法を助詞「には」で表した。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 部族を代表する公認の長を指す。「君主」などの王族的な含意を避け、現代日本語で明瞭な「指導者」とした。
- source_word: לִבְנֵי נַפְתָּלִי
  choice: ナフタリの子らの
  rationale: לְ はここで指導者と部族集団との関係を示す。בְּנֵי の男性複数形を保ち、部族名として「ナフタリの子ら」と訳した。
- source_word: אֲחִירַע
  choice: アヒラ
  rationale: 人名を翻訳せず、ヘブライ語の発音に即して音写した。
- source_word: בֶּן עֵינָן
  choice: エナンの子
  rationale: 標準的な父称表現として、語順を日本語に合わせて「エナンの子」とした。
theological_decisions:
- issue: 部族呼称 בְּנֵי の性を伴う表現
  choice: ナフタリの子ら
  alternative: ナフタリの子孫／ナフタリ族
  rationale: 原文の男性複数形を明示しつつ、部族を指す定型的な呼称であることを保った。文脈上、性を中立化する必要はない。
- issue: 動詞を欠く名詞節
  choice: 「指導者、エナンの子アヒラ。」とし、動詞を補わない
  alternative: 「指導者は、エナンの子アヒラであった。」
  rationale: 原文には明示的な動詞がなく、前後の奉献者一覧に続く見出し的・提示的な構文である。その簡潔な形式を保ち、断定動詞を本文に加えなかった。
translation_notes:
  register: 祭壇奉献の各日を列挙する反復的な定型を保ちながら、明瞭で格調ある現代標準日本語とした。人名は一般的な聖書音写に合わせ、「アヒラ」「エナン」とした。
