base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: ja
  text: 全焼のささげ物のための牛は、合計で、雄牛十二頭、雄羊十二匹、一歳の子羊十二匹、それぞれに伴う穀物のささげ物であった。また、罪のためのささげ物[a]として、雄やぎ十二匹が献げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清めのささげ物」。ヘブライ語の語は、罪だけでなく、汚れからの清めに重点を置くこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: 牛は全部で
  rationale: הַבָּקָרは牛類を集合的に指し、続くפָּרִיםがその内訳を雄牛として示す。日本語では「牛は全部で」として集計表現を自然にした。
- source_word: לָעֹלָה
  choice: 全焼のささげ物の
  rationale: עֹלָהは祭壇で全焼させるささげ物を指す。目的を表すלְを、一覧を導く自然な日本語にした。
- source_word: פָּרִים
  choice: 雄牛
  rationale: 犠牲動物としてのפַּרの標準的で明確な訳語。
- source_word: אֵילִם
  choice: 雄羊
  rationale: 犠牲として献げる成獣の雄羊を明確に表す。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一歳の雄の子羊
  rationale: 年齢指定を保持し、文脈上の雄の子羊を現代日本語で明示した。
- source_word: וּמִנְחָתָם
  choice: それに伴う穀物のささげ物
  rationale: מִנְחָהはこの祭儀文脈では穀物のささげ物を指す。接尾辞の複数指示は、日本語では列挙された全焼のささげ物に「伴う」として自然に表した。
- source_word: וּשְׂעִירֵי עִזִּים
  choice: また、雄やぎ
  rationale: שְׂעִירֵי עִזִּיםは雄のやぎを明示するため、「雄やぎ」とした。
- source_word: לְחַטָּאת
  choice: 罪のためのささげ物として
  rationale: חַטָּאתの罪との関係を保ちつつ、祭儀上の供え物であることを明確にした。清めを強調する訳も可能なため脚注に示した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳し分け
  choice: 罪のためのささげ物
  alternative: 清めのささげ物
  rationale: この語は罪に関わるささげ物を指す一方、汚れからの清めに重点を置く場合もある。本文では一般読者に理解しやすい「罪のためのささげ物」を採用し、もう一つの重要な含意を脚注に残した。
translation_notes:
  register: 祭儀用語を一貫して「ささげ物」とし、現代の一般読者にも理解できる明瞭さと、律法の一覧にふさわしい簡潔で格調ある調子を両立させた。助数詞は牛に「頭」、羊とやぎに「匹」を用いた。
