  terminology: 「全焼のささげ物」「穀物のささげ物」「罪のためのささげ物」は、祭儀文脈に適した一貫した現代日本語である。חַטָּאת の「清めのささげ物」という有力な語義上の代案を脚注に残す方針も適切である。
