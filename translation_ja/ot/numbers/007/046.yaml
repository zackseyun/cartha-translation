lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: שְׂעִירは雄のやぎを指し、עִזִּיםが動物の種類を明示する。日本語では「雄やぎ」が自然で、原文に明示された性別も保てる。
- source_word: אֶחָד
  choice: 一匹
  rationale: 明示された数詞を残し、動物に自然な助数詞「匹」を用いることで、民数記7章の反復的な供え物一覧の文体を保つ。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: 祭儀的文脈のחַטָּאתは、罪そのものではなく、罪に関してささげる供え物を指す専門語として機能する。「罪のきよめのささげ物」は目的を分かりやすく示し、「として」は前置詞לְによる指定を自然に表す。
theological_decisions:
- issue: 祭儀的文脈におけるחַטָּאתの訳し方
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪のため
  rationale: 祭司資料の供え物一覧では、חַטָּאתは罪に関わる祭儀的な供え物を指す。「罪のきよめのささげ物」はその機能を示しつつ、後代の特定の教理を読み込まない。字義的な別訳の可能性は脚注で保持する。
translation_notes:
  register: 簡潔な供え物一覧として、述語を補わない体言止めを採用した。「雄やぎ一匹」は現代日本語として明瞭で、原文の性別と数量を保持する。「罪のきよめのささげ物」は一般読者に理解しやすく、祭儀用語としての意味を伝える表現とした。
