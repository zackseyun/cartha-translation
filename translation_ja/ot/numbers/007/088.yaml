revisions:
- from: 交わりのいけにえ[a]として献げられた牛は全部で雄牛二十四頭、雄羊六十匹、雄やぎ六十匹、一歳の雄の子羊六十匹であった。これが、祭壇に油が注がれた後に行われた祭壇の奉献である。
  to: 交わりのいけにえ[a]として献げられた家畜は、全部で雄牛二十四頭、雄羊六十匹、雄やぎ六十匹、一歳の雄の子羊六十匹であった。これが、祭壇に油が注がれた後の祭壇の奉献である。
  rationale: 冒頭を『家畜』に改め、一連の動物の総計を自然かつ正確に受けられるようにしました。奉献と油注ぎの時系列は維持しました。脚注は原語の意味範囲を反映する代替訳に限定し、『和解』を削除しました。
