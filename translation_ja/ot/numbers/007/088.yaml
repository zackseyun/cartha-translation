source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: ja
  text: 交わりのいけにえ[a]として献げられた家畜は、全部で雄牛二十四頭、雄羊六十匹、雄やぎ六十匹、一歳の雄の子羊六十匹であった。これが、祭壇に油が注がれた後の祭壇の奉献である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」または「幸いのいけにえ」とも訳せる。
    reason: שְׁלָמִיםには平和・健全さ・幸いに関わる意味の幅があり、「交わりのいけにえ」とは別の有力な訳し方もあるため。
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: 牛は全部で
  rationale: וְכֹלの総計を示す働きを自然な日本語で表し、בְּקַרは集合的な「牛」とした。後続の雄羊・雄やぎ・子羊も同じ一連の総計に含まれる。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: 祭儀上の供え物の種類として分かりやすく、語が含み得る神との平和・交わりの側面を表す。「平和のいけにえ」などの可能性は脚注に残した。
- source_word: פָּרִים
  choice: 雄牛
  rationale: 祭儀の文脈におけるפַּרの標準的な意味を表す。原文だけでは「若い」と限定する必要がない。
- source_word: אֵילִם
  choice: 雄羊
  rationale: 成熟した雄の羊を指す標準的な訳語。
- source_word: עַתֻּדִים
  choice: 雄やぎ
  rationale: 雄であることを明示しつつ、現代日本語として自然な表現にした。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一歳の雄の子羊
  rationale: 年齢の指定を保持し、この章の各奉献物の一覧で明示されている雄の子羊であることも反映した。
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: 祭壇の奉献
  rationale: 祭壇を正式に用い始める奉献の出来事を指す。原文にない「奉献の供え物」と限定せず、出来事と供え物のまとまりを含み得る表現にした。
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: 祭壇に油が注がれた後に
  rationale: 動作主が原文に明示されていないため受け身で表し、指示対象が祭壇であることを日本語で明確にした。
theological_decisions:
- issue: שְׁלָמִיםという祭儀用語の訳し方
  choice: 交わりのいけにえ
  alternative: 平和のいけにえ／和解のいけにえ／幸いのいけにえ
  rationale: 語根が示唆する平和・健全さ・関係的な交わりの幅を一語で尽くすことはできない。「交わり」は供え物に伴う共同の食事という文脈にも適し、他の有力な意味合いは脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。動物の助数詞は、牛に「頭」、羊・やぎに「匹」を用いた。列挙の簡潔さを保ちつつ、最後の文では奉献が油注ぎの後に行われたことを自然な日本語で示した。
