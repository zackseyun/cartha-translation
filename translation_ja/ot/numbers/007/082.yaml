translation:
  language: ja
  text: 罪のきよめのささげ物として、雄やぎ一匹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 直訳的には「やぎの中の毛深いもの」だが、ヘブライ語では雄のやぎを指す慣用表現である。現代日本語で自然かつ動物の性別を明示する「雄やぎ」とした。
- source_word: אֶחָד
  choice: 一匹
  rationale: 祭儀の品目を反復して列挙する民数記7章の文体と数量の明示を保ち、日本語で動物を数える自然な助数詞を用いた。
- source_word: לְחַטָּאת
  choice: 罪のきよめのささげ物として
  rationale: 祭儀文脈のחַטָּאתは、罪そのものではなく、その処理ときよめのための供え物を指す。「罪祭」より平明で、「罪のためのささげ物」より祭儀的なきよめの側面を伝える表現とした。接頭辞לְは「として」で表した。
theological_decisions:
- issue: חַטָּאתの祭儀的意味
  choice: 罪のきよめのささげ物
  alternative: 罪のためのささげ物／罪祭
  rationale: この語には罪への対処と祭儀的きよめの両面があり得るため、単に「罪」とせず供え物であることを明示した。「罪のきよめ」は機能を伝えつつ、贖罪の仕組みを特定の教派的理解に限定しない。
translation_notes:
  register: 簡潔な供え物目録として、現代標準日本語の明瞭さと厳粛さを保った。原文の語順に近く、同章の反復的な列挙にも適する体言止めとした。
