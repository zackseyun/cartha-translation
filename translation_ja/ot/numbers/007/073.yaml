  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、重さ百三十シェケルの銀の皿一枚[a]と、重さ七十シェケルの銀の鉢一つであり、その重量はいずれも聖所のシェケル[b]によった。二つとも、穀物のささげ物のために、油を混ぜた上質の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」は「鉢」または「大皿」とも訳せる。ヘブライ語は、聖所で用いられた浅い銀製の器を指す。
    reason: lexical_alternative
  - marker: b
    text: 「聖所で定められたシェケルによって」とも訳せる。ヘブライ語は、聖所で用いられた重量の基準を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物は
  rationale: 祭儀の文脈で神に献じる物を指すため、「贈り物」ではなく、明瞭で広く通じる「ささげ物」とした。ヘブライ語の名詞句を自然な日本語の提示文に整えた。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קְעָרָהは比較的浅い器を指すため「皿」とし、日本語の助数詞には「枚」を用いた。器種には「鉢」「大皿」の可能性もあるので脚注に示した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重さ百三十シェケル
  rationale: 直訳的な「その重さは百三十」を、目録調を保ちつつ日本語で読みやすい括弧表現にした。シェケルはここでは重量単位である。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָקは祭儀に用いる容器であり、家庭用の印象に限定されない「鉢」とした。「水盤」では用途や大きさを過度に特定するおそれがある。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重さ七十シェケル
  rationale: 前の銀皿と並行する重量表示として明示した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準とした重さ
  rationale: この句は貨幣価値よりも聖所で用いる重量基準を示す。「聖なるシェケル」と誤解されないよう、基準であることを本文に明示した。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: 二つとも…満たされていた
  rationale: 代名詞が銀の皿と銀の鉢の両方を明示的に指すことを保った。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 穀物のささげ物に用いる、よく精製された良質の粉を表す祭儀用語として、現代日本語で自然な表現を選んだ。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 受動分詞の意味を、簡潔で現代的な日本語にした。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物とするため
  rationale: 祭司文書の文脈ではמִנְחָהが穀物による供え物を指すため、一般的な「ささげ物」に平板化せず種類を明示した。
