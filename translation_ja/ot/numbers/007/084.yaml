source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: ja
  text: これは、祭壇に油が注がれた日に、イスラエルの指導者たち[b]が献げた、祭壇奉献のささげ物である[a]。銀の大皿十二枚、銀の鉢十二個、金のさじ十二個であった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これは祭壇の奉献である」。原文はより直訳的にはこのようにも訳せるが、ここでは直前まで列挙された奉献のささげ物を振り返っている。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの族長たち」とも訳せる。原語は各部族を代表する公認の指導者を指す。
    reason: lexical_alternative
  - marker: c
    text: 器物を表す原語の厳密な形状は確定しにくく、それぞれ「銀の皿」「銀のたらい」「金の小皿（またはさじ）」などとも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: これは……祭壇奉献のささげ物である
  rationale: חֲנֻכָּה自体は「奉献」を意味するが、直前まで列挙された品々をまとめる文脈なので、具体的な贈り物を指すことが分かるよう「ささげ物」を補った。זֹאתの指示の力は「これは」で保った。
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: 祭壇に油が注がれた日に
  rationale: 受動形の「それが油を注がれる」を自然な日本語にし、指示対象が祭壇であることを明示した。
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: イスラエルの指導者たちが献げた
  rationale: מֵאֵתは贈り物の出所を示す。日本語では動作主として表すのが自然である。נָשִׂיאは民数記で部族を代表する公認の指導者を指し、世襲王族を連想させる「君主」は避けた。
- source_word: קַעֲרֹת כֶּסֶף
  choice: 銀の大皿
  rationale: קְעָרָהは皿・鉢状の容器を指す。続くמִזְרָקと区別し、これまでの各奉献物の記述とも整合するよう「大皿」とした。
- source_word: מִזְרְקֵי כֶסֶף
  choice: 銀の鉢
  rationale: מִזְרָקは祭儀に用いる鉢・たらい状の器。現代日本語で自然かつ用途を限定しすぎない「鉢」とした。
- source_word: כַּפּוֹת זָהָב
  choice: 金のひしゃく
  rationale: כַּףは手のひらから派生して、さじ・ひしゃく・小容器状の器具を表す。この祭具一覧では、食卓用の印象が強い「スプーン」を避けて「ひしゃく」とした。
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: 十二
  rationale: 各器物の数をそのまま訳した。日本語では原文の文法上の性による数詞の形の違いは表れない。
theological_decisions:
- issue: חֲנֻכַּתを奉献そのものと取るか、奉献のためのささげ物と取るか
  choice: 祭壇奉献のささげ物
  alternative: 祭壇の奉献
  rationale: 語そのものは「奉献」だが、この節は指導者たちが差し出した器物を総括しているため、ここでは換喩的に奉献のささげ物を指すと判断した。ただし形式的な訳の可能性は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「奉献」「ささげ物」は礼拝文脈に適した一般的な聖書語彙として用い、文全体は名詞句が続く原文を読みやすい二文に整えた。助数詞は形状に応じて「枚」「個」を使い、「ひしゃく」には通常の器具として「個」を用いた。
