revisions:
- from: 彼のささげ物は、重さ百三十シェケルの銀の皿一枚[a]と、聖所のシェケルを基準にして重さ七十シェケルの銀の鉢一個[b]であった。どちらにも、穀物のささげ物とする、油を混ぜた上質の小麦粉がいっぱいに入っていた。
  to: 彼のささげ物は、銀の皿一枚[a]、重さ百三十シェケルと、銀の鉢一個[b]、重さ七十シェケルであった。いずれも聖所のシェケルによるものであった。どちらにも、穀物のささげ物のための、油を混ぜた上質の小麦粉がいっぱいに入っていた。
