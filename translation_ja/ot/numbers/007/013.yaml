base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の皿一枚[a]、重さ百三十シェケルと、銀の鉢一個[b]、重さ七十シェケルであった。いずれも聖所のシェケルによるものであった。どちらにも、穀物のささげ物のための、油を混ぜた上質の小麦粉がいっぱいに入っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」と訳した語は、浅い容器を指し、「大皿」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「鉢」と訳した語は祭儀用の容器を指し、「たらい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: 彼のささげ物は
  rationale: קָרְבָּןは祭儀の文脈で神に献じる物を指すため、現代日本語で明瞭な「ささげ物」とした。接続詞וְは、前後の連続が文脈上明らかなため独立した「そして」を置かず、自然な日本語に組み込んだ。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קַעֲרָהは比較的浅い容器を指す。「皿」は形状を簡潔に伝え、容器の数は日本語として自然な助数詞「枚」で表した。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重さ百三十シェケル
  rationale: 原文が示す器の重量を、日本語の自然な連体修飾として明示した。シェケルは古代の重量単位なので音写した。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一個
  rationale: מִזְרָקは祭儀用の容器だが、この節では具体的用途が明記されない。「鉢」は器の形を自然に示し、血を振りかける用途などを本文へ付加しない訳である。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重さ七十シェケル
  rationale: 省略された重量の関係を日本語で補い、最初の器との並行を明確にした。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準にして
  rationale: 祭儀上定められた標準重量によることを表す。「聖所のシェケル」という原文の表現を保ちつつ、「基準にして」で機能を明瞭にした。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: どちらにも……いっぱいに入っていた
  rationale: 二つの器の双方を明示する双数的表現を「どちらにも」で自然に再現した。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: סֹלֶתは供え物に用いる精製された良質の粉を指す。「上質の小麦粉」は祭儀用材料として普通の読者にも理解しやすい。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 油と混ぜ合わされた状態を示す受動分詞を、簡潔で自然な日本語にした。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物とする
  rationale: 祭司文書の文脈でמִנְחָהは穀物を材料とするささげ物を指すため、一般的な「ささげ物」より具体的に訳した。
