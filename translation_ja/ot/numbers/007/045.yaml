  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ja
  text: 雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、全焼のささげ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרは祭儀の文脈で雄牛を指し、בֶּן בָּקָרはそれが牛の群れに属する家畜であることを示す。日本語では「牛の群れから雄牛一頭」として原文の区別と列挙の形を自然に保った。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは成長した雄の羊を表す標準的な祭儀用語であり、「雄羊」と訳した。אֶחָדによる個体数も明示した。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 雄の子羊一頭
  rationale: כֶּבֶשׂは雄の子羊を指すため、性別を明示して「雄の子羊」とした。反復されるאֶחָדに対応して「一頭」を保った。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 直訳的には「その年の子」だが、祭儀規定における年齢指定を明瞭な現代日本語で表した。
- source_word: לְעֹלָה
  choice: 焼き尽くすささげ物として
  rationale: עֹלָהは祭壇上で全体を焼くささげ物を指す。「焼き尽くすささげ物」はその祭儀的特徴を伝えつつ、現代の読者にも理解しやすい。前置詞לְは列挙の目的・用途として「として」とした。
theological_decisions: []
translation_notes:
  register: 祭儀的な列挙の簡潔さと、אֶחָדの反復による一頭ずつの明示を保った。文脈上、前後の供え物一覧に続く句であるため、原文同様に完全文へ補わず体言止めに近い形とした。
