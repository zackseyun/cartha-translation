  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがギデオニの子アビダンのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」「健やかさのいけにえ」とも訳せる。
    reason: ヘブライ語 שְׁלָמִים の語彙的代替訳を示し、英語POB監査記録の脚注機能を反映するため。
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 前節から続く供え物の一覧であることを「また」で示した。זֶבַח は祭儀的な屠殺を伴う「いけにえ」、שְׁלָמִים は神との平和と交わりを表す祭儀用語であり、現代日本語で意味が伝わりやすい「交わりのいけにえ」とした。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָר は雌雄を明示しない牛類の集合名詞なので、性別を限定せず「牛」とし、日本語の自然な助数詞「頭」を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִם は雄羊を明示するため、その性別を保った。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִים は雄のやぎを指すため「雄やぎ」とした。表記は平易さを考慮して「やぎ」とした。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: כְּבָשִׂים の雄性と、בְּנֵי שָׁנָה の年齢指定をともに明示した。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 章内で繰り返される締めくくりの定型句として自然な日本語にした。ヘブライ語には明示的な時制標識がないが、物語上の回顧に合わせて過去形を採用した。
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: ギデオニの子アビダン
  rationale: 父称構文を日本語で自然な「ギデオニの子アビダン」とし、固有名は慣用的に音写した。
theological_decisions:
- issue: הַשְּׁלָמִים の祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／酬恩のいけにえ／平和のいけにえ
  rationale: 語は平和、健全、繁栄、神との交わりなど複数の含意を持つ。特定の機能だけに狭めず、供献者が食事にもあずかる祭儀の性格を現代の読者に伝えやすい表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。供え物の一覧として簡潔な名詞列を維持し、動物の性別・年齢は原文が明示する範囲で保持した。
