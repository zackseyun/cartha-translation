  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、銀の大皿[a]一枚、重さは百三十シェケル、銀の鉢[b]一つ、重さは七十シェケルで、いずれも聖所のシェケル[c]によるものであった。どちらにも、穀物のささげ物のために、油を混ぜた上質の小麦粉が満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大皿」と訳した語は、「浅い器」とも訳せる銀製の容器。
    reason: lexical_alternative
  - marker: b
    text: 「鉢」と訳した語は、「たらい形の器」とも訳せる、聖所の務めに用いられた祭儀用の容器。
    reason: lexical_alternative
  - marker: c
    text: 「聖所のシェケル」とは、聖所で定められた標準に基づく重さの単位。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物
  rationale: 祭儀の場で神に差し出す物を指すため、現代日本語で自然かつ文脈に適した「ささげ物」とした。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の大皿一枚
  rationale: קְעָרָהは比較的浅い器を指す。日本語では形状を伝えやすい「大皿」とし、器の助数詞には「枚」を用いた。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: ヘブライ語の名詞文の構造を明確な現代日本語にし、数の順序は日本語の慣用に従った。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָקは祭儀に用いる容器であり、広口の器を自然に表す「鉢」を採用した。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: その重さは七十シェケル
  rationale: 原文では重さを表す語が省略されているが、先行句との並行関係を日本語で明確にした。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルで
  rationale: 重量が聖所で定められた標準によることを示す。本文では簡潔に訳し、文化的背景を脚注で説明した。
- source_word: שְׁנֵיהֶם
  choice: どちらにも
  rationale: 二つの器の双方を指す代名詞を、後続する「満たされていた」と自然につながる形にした。
- source_word: מְלֵאִים
  choice: 満たされていた
  rationale: 二つの器が中身で満杯であったことを、明瞭で格調ある日本語で表した。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 祭儀用のよく精製された粉を指すため、「上質の小麦粉」とした。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 受動分詞が示す、粉と油を混ぜ合わせた状態を平明に表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物のための
  rationale: 祭司文書の文脈ではמִנְחָהは穀物を用いる特定のささげ物を指すため、一般的な「ささげ物」にせず具体化した。
