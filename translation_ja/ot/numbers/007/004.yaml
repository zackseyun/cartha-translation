  yaml_path: translation/ot/numbers/007/004.yaml
  text: Then the LORD said to Moses, saying,
translation:
  language: ja
  text: すると、主はモーセにこう言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 告げられた
  rationale: 文脈上、神がモーセに言葉を伝える導入句であり、現代日本語として自然で品位のある表現とした。接続要素は直前からの継続を示すが、日本語では独立した「すると」を置かなくても自然に連続性が伝わる。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字名。日本語聖書で広く定着した「主」を用いた。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 前置詞 אֶל の発話の受け手を示す機能を自然な日本語で表した。
- source_word: לֵאמֹר
  choice: （独立して訳出せず）
  rationale: 後続する直接発話を導く定型的不定詞であり、日本語では「告げられた」にその機能を含ませるのが自然である。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 原文では固有名だが、本文では日本語の伝統的な代用表記を採用した。特定の教派的解釈を加えず、英語相談層の LORD とも対応する。
- issue: לֵאמֹר の明示性
  choice: 「告げられた」に統合
  alternative: 「言われた。すなわち」または「こう言われた」
  rationale: この節は発話導入句のみで、後続節が内容を示す。ヘブライ語の定型句を逐語的に重ねるより、機能を保持した自然な日本語とした。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも耐える文体。「言われた」より伝達の導入として自然な「告げられた」を採用し、原文の敬語を含まない形式に対しては日本語の慣用に沿う尊敬表現を用いた。
