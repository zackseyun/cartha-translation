  terminology: 「交わりのいけにえ」はשְׁלָמִיםの可能な訳語であり、英語監査記録の“fellowship offerings”という代案とも整合する。贖罪・和解の意味へ限定しておらず、祭儀区分として適切である。「ささげ物」もקָרְבָּןに適切である。固有名の音写と父称の語順も問題ない。
