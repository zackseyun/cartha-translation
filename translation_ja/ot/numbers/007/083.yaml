  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: ja
  text: また、交わりのいけにえとして、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがエナンの子アヒラのささげ物であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞を「また」「として」で自然に表し、זֶבַחの犠牲祭儀としての性格を「いけにえ」で保持した。שְׁלָמִיםは祭儀用語として、神との平和や交わりを含意し得るが、その機能を一つに限定しない「交わりのいけにえ」とした。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָרは集合的に牛を指し、本文が明示しない性別を補わず、日本語で自然な助数詞を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִםが雄羊を特定することを明確に表した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִיםが雄のやぎを指すため、現代日本語で明瞭に訳した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: כְּבָשִׂיםの雄性と、בְּנֵי שָׁנָהが示す一歳という年齢をともに保持した。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 反復される締めくくりの同定句として訳し、物語文脈に合わせて過去形とした。קָרְבַּןは包括的な祭儀用語として「ささげ物」とした。
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: エナンの子アヒラ
  rationale: ヘブライ語の父称構造を自然な日本語の語順で表し、固有名は音写した。
theological_decisions:
- issue: הַשְּׁלָמִים の祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 語根が示す平和・健全さと、祭儀における交わりの側面の双方が論じられるため、特定の贖罪理論に限定せず、現代の読者にも祭儀区分として理解しやすい表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。列挙の簡潔さと原文の締めくくりの定型句を保持した。動物の性別は原文が示す箇所だけ明示し、牛については補わなかった。
