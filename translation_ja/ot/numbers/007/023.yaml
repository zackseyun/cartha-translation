  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがツアルの子ネタンエルのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「平和のいけにえ」「幸いのいけにえ」。ヘブライ語 שְׁלָמִים は、平和、交わり、幸いに関わる祭儀用語。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח
  choice: また、…いけにえとして
  rationale: 接続詞と前置詞が、ささげ物の一覧に次の項目を加えている。「また」で連続性を示し、「いけにえとして」で祭儀上の用法を自然な日本語にした。
- source_word: הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִים は神との平和、交わり、幸いに関わる祭儀用語。「交わりのいけにえ」は現代の読者に意味が伝わりやすく、特定の一面だけに限定しすぎない。別訳を脚注に示した。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָר は牛類を表す集合語で、性別は明示されていない。「牛」として過度な限定を避けた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִם は成長した雄羊を明確に指すため、「雄羊」とした。
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתּוּדִים は雄のやぎを指す。現代日本語として読みやすい表記を用いた。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: כְּבָשִׂים の雄という情報と、בְּנֵי שָׁנָה の年齢指定の両方を明示した。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 献げた品々を総括して持ち主を示す定型句。物語の過去時制に合わせた。
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: ツアルの子ネタンエル
  rationale: ヘブライ語名を日本語で音写し、בֶּן の父子関係を明示した。
theological_decisions:
- issue: שְׁלָמִים が表す祭儀区分の訳語
  choice: 交わりのいけにえ
  alternative: 平和のいけにえ／幸いのいけにえ
  rationale: この語には平和、健全、繁栄、神との交わりという意味領域が重なっており、日本語の一語で完全には表せない。本文では祭儀の共同性を伝えやすい訳を採り、他の可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。献げ物の列挙は原文の簡潔なリズムを維持し、動物の性別は原文が明示する場合にだけ訳出した。
