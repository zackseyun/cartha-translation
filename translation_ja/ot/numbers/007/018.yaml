  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: ja
  text: 二日目には、イサカル族の指導者、ツアルの子ネタヌエルが、ささげ物を献げた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は単に「献げた」と記す。「ささげ物を」は、各部族の指導者がささげ物を献げる民数記7章の反復される文脈から補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 二日目には
  rationale: 前置詞בと序数を伴う「日」の自然な時間表現。献納の何日目かは文脈で分かるため、この節に明記されていない語は加えない。
- source_word: הִקְרִיב
  choice: ささげ物を献げた
  rationale: קרבのヒフィル形は祭儀の文脈で、供え物を近づける、すなわち献げることを表す。目的語は原文では省略されているが、民数記7章の反復される文脈から「ささげ物」を補い、現代日本語として自然にした。
- source_word: נְתַנְאֵל
  choice: ネタヌエル
  rationale: ヘブライ語名を、日本語聖書で通用する形に音写した。
- source_word: בֶּן צוּעָר
  choice: ツアルの子
  rationale: 系譜的な父子関係を示す標準的な連語として訳した。
- source_word: נְשִׂיא
  choice: 指導者
  rationale: ここでは王族の称号ではなく、部族を代表する長を指すため、現代日本語で明確な「指導者」とした。
- source_word: יִשָּׂשכָר
  choice: イッサカル族
  rationale: 部族名としての用法を明確にするため「族」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ささげ物を献げた」は祭儀的意味を保ちつつ、目的語の補足を脚注で明示した。
