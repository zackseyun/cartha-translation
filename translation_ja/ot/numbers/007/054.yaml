  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ja
  text: 八日目に、マナセの子孫[a]の指導者は、ペダツルの子ガムリエルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「マナセの子ら」。マナセの子孫、すなわちマナセ部族を指す。
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 八日目は
  rationale: 前置詞בְּと「日」および序数詞から成る時の表現。「八日目に」も可能だが、この節は動詞のない名詞文なので、後続の人物を提示する自然な日本語として「八日目は」とした。奉献など、節中に明記されない内容は補わない。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: ここでは部族を代表する公認の長を指す。「君主」は王族的な含意を帯びやすく、「族長」は役職を狭く解釈しうるため、明瞭で幅のある「指導者」とした。
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: マナセの子孫
  rationale: בְּנֵיの家族的・部族的表現を保ちつつ、現代日本語で実子だけを意味すると誤解されないよう「子孫」とした。前置詞לְはここでは、その指導者が属し、代表する集団との関係を表す。
- source_word: מְנַשֶּׁה
  choice: マナセ
  rationale: 人名およびその子孫から成る部族名として、日本語聖書で広く認識される音写を用いた。
- source_word: גַּמְלִיאֵל
  choice: ガムリエル
  rationale: 固有名を日本語で慣用的な形に音写した。
- source_word: בֶּן
  choice: 子
  rationale: 系譜的な父子関係を示す標準的な父称表現として「～の子」とした。
- source_word: פְּדָה צוּר
  choice: ペダツル
  rationale: 複合的な固有名を一つの人名として音写した。
theological_decisions:
- issue: 動詞のないヘブライ語名詞文の扱い
  choice: 「ガムリエルであった」と名詞文として訳す
  alternative: 文脈から「ささげ物を携えて来た」などの動作を補う
  rationale: 原文の簡潔な人物提示を保ち、前後の文脈から推測できても本節に明記されていない奉献行為を本文へ加えないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文の簡潔な名詞文を自然な「～であった」で表し、部族を示す親族表現には理解を助ける脚注を付した。
