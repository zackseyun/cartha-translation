  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/021.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: ja
  text: 雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、全焼のささげ物として。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 雄牛一頭
  rationale: פַּרは祭儀でささげる雄牛を指し、בֶּן בָּקָרは牛の類に属することを示す慣用表現である。日本語では「雄牛一頭」とすれば意味が自然かつ十分に伝わる。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは成長した雄の羊を指す標準的な祭儀用語であり、「雄羊」が明確で自然である。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 雄の子羊一頭
  rationale: כֶּבֶשׂは子羊を指し、男性単数形であることを日本語でも「雄の子羊」と明示した。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 直訳的には「その年の子」で、最初の一年にあることを示す年齢表現。祭儀規定として簡潔で自然な「一歳の」とした。
- source_word: לְעֹלָה
  choice: 全焼のささげ物として
  rationale: עֹלָהは祭壇で全部を焼くささげ物を指す。「全焼のささげ物」は内容を明確に伝え、接頭辞לְは「として」で表した。
theological_decisions: []
translation_notes:
  register: 供え物の目録として、原文で反復されるאֶחָדを各動物の「一頭」で再現した。簡潔で端正な祭儀文体とし、節が前後の文に続く列挙句であることを保つため、文末は「として。」とした。
