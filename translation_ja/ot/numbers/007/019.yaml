source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: ja
  text: 彼は自分のささげ物を差し出した。銀の皿一枚[a]、その重さは百三十シェケル。銀の鉢一つ[b]、聖所のシェケルを基準にして[c]七十シェケル。この二つには、穀物のささげ物として、油を混ぜた上等の小麦粉がいっぱいに入っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀の大皿」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 祭儀に用いる器。「銀の深皿」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「聖所のシェケルによって」。聖所で用いられた標準重量を示す。
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: 差し出した
  rationale: 使役形は祭儀の文脈で「近づける、持って来る、供する」を表す。「差し出した」は、続く「ささげ物」と不自然に重複せず、儀礼的な提示を明確に伝える。
- source_word: קָרְבָּנוֹ
  choice: 自分のささげ物
  rationale: 神の前に携えて来る供物を指す標準的な祭儀用語。「ささげ物」は現代日本語で明瞭であり、文脈にも適する。
- source_word: קַעֲרַת כֶּסֶף
  choice: 銀の大皿
  rationale: 比較的浅い容器を指す語で、ここでは大量の上等の小麦粉を入れる器。「大皿」は重量と用途にもなじみ、「皿」より器の規模を自然に示す。別訳の可能性は脚注に示す。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: その重さは百三十シェケル
  rationale: 女性単数接尾辞が直前の大皿を指すことを明示し、原文の目録的な表現を保つ。
- source_word: מִזְרָק
  choice: 鉢
  rationale: 祭儀で用いる容器を指す。「鉢」は現代日本語で形状を過度に限定せず自然である。別訳として「たらい状の器」もあり得るが、本文では簡潔さを優先した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準にして
  rationale: 聖所で用いられた標準重量による計量であることを、現代日本語で明瞭に表す。直訳的な情報は脚注にも示す。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: この二つには…いっぱいに入っていた
  rationale: 二つの器の双方が満たされていたという原文を明示し、日本語として自然な容器構文にした。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 供え物に使う精製された良質の穀粉を指す。日本語では「上等の小麦粉」が意味を分かりやすく伝える。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 穀物のささげ物の調製法を、簡潔で自然な現代日本語で表す。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物として
  rationale: この祭儀文脈でמִנְחָהは一般的な贈り物ではなく穀物による供え物を指すため、その意味を明示する。
theological_decisions: []
translation_notes:
  register: 祭儀の目録らしい簡潔で格調ある調子を保ちつつ、現代の一般読者に理解しやすい語順と表現を採用した。重量単位「シェケル」は原語の文化的単位として音写し、聖所の基準重量であることを本文と脚注で示した。
