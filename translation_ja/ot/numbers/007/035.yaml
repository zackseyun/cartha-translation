  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]として、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これはシェデウルの子エリツルのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「平和のいけにえ」「健やかさのためのいけにえ」。
    reason: שְׁלָמִים の祭儀用語には「交わり」のほか、平和・健やかさ（well-being）に関わる訳し方があるため。
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞が供え物の列挙を続けていることを「また…として」で自然に示した。זֶבַח שְׁלָמִים は祭儀用語であり、神との交わりを伴ういけにえを表すため、「交わりのいけにえ」とした。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָר は牛類を集合的に指し、性別を限定しない。「牛二頭」は原文の範囲と日本語の自然な助数法を保つ。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִם は成長した雄の羊を明確に指す。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִים は雄のやぎを指すため、性別を明示した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の子羊五匹
  rationale: בְּנֵי שָׁנָה は「一歳の」の意。כְּבָשִׂים はここでは子羊を指し、本文では性別をことさらに補わず、原文の通常の語感を自然な日本語で示した。
- source_word: זֶה קָרְבַּן
  choice: これは…のささげ物であった
  rationale: זֶה の指示性と קָרְבַּן の一般的な祭儀語義を保ち、周囲の物語の時制に合わせた。
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: シェデウルの子エリツル
  rationale: ヘブライ語名を日本語で音写し、父称 בֶּן を「の子」で表した。
theological_decisions:
- issue: שְׁלָמִים の訳語
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 語根との関連から平安・健全さの含意はあるが、この祭儀の性格を現代日本語で理解しやすく示す「交わり」を採用した。特定の贖罪理論へ狭めない。
translation_notes:
  register: 現代の標準的な日本語で、祭儀目録らしい簡潔さと反復句の荘重さを保った。動物の助数詞は、牛には「頭」、羊とやぎには一般読者に自然な「匹」を用いた。
