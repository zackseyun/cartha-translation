  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: ja
  text: '族長たちは、祭壇に油が注がれた日に、祭壇奉献のためのささげ物[a]を差し出した。族長たちは、自分たちのささげ物を祭壇の前に差し出した。


    [a] 直訳では「祭壇の奉献」。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「祭壇の奉献」。
    reason: חֲנֻכַּת הַמִּזְבֵּחַは字義的には「祭壇の奉献」。この文脈では、族長たちが祭壇の奉献に関連して差し出すささげ物を指すと理解できるため、本文ではその意味を明示した。
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: 差し出した
  rationale: ヒフィル形の「近づける、ささげる」という祭儀的な意味を表す。二度の反復を保ちつつ、現代日本語として自然な表現とした。
- source_word: הַנְּשִׂאִים
  choice: 族長たち
  rationale: 民数記の文脈ではイスラエル各部族の長を指す。「君主」では王制的に響き、「指導者」だけでは部族との関係が弱いため、「族長」とした。
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: 祭壇奉献のためのささげ物
  rationale: 語自体は「祭壇の奉献」だが、「差し出した」の目的語として、奉献に伴って持参された品を文脈上明示した。字義的な形は脚注に残した。
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: 祭壇に油が注がれた日に
  rationale: 前置詞付き不定詞構文の時を表す機能を自然な日本語で示し、代名詞の指示対象である祭壇を明示した。
- source_word: קָרְבָּנָם
  choice: 自分たちのささげ物
  rationale: 祭儀の場で差し出される贈り物・供え物を表す一般語であり、「ささげ物」が文脈に適する。主語への帰属を「自分たちの」で明確にした。
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: 祭壇の前に
  rationale: 空間的かつ祭儀的な位置関係を簡潔に保つ訳とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「油を注ぐ」「奉献」「ささげ物」など、幕屋祭儀の文脈に定着した語を用いた。原文で繰り返される「族長たちは」「差し出した」は、叙述上の強調としておおむね保持した。
