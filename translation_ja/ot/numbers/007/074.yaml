translation:
  language: ja
  text: 香で満たされた、重さ十シェケル[a]の金の小皿一つ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を直訳すると、「金の小皿一つ、十〔シェケル分〕の金、香で満たされたもの」。重量単位の「シェケル」は、この文脈で繰り返される奉納品の定型句に基づいて補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 小皿
  rationale: 幕屋への奉納品の文脈では、手のひらではなく香を入れる小型の容器を指す。「さじ」では現代の食器を連想させやすいため、「小皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する単純な基数であり、日本語では助数表現「一つ」が自然である。
- source_word: עֲשָׂרָה זָהָב
  choice: 重さ十シェケルの金の
  rationale: ヘブライ語本文には重量単位が明記されていないが、直前から反復される奉納品の定型句によりシェケルが補われる。素材と重量の関係が明瞭になるよう自然な日本語にした。
- source_word: מְלֵאָה
  choice: 満たした
  rationale: 器の中身が香で満ちている状態を簡潔に表す。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 聖所の礼拝で用いる芳香物質を指す標準的で簡潔な訳語である。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調を保った奉納品目録の文体。「金の小皿」と「重さ十シェケル」の関係を自然な語順で示し、原文で省略された重量単位は脚注で明示した。
