  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: ja
  text: 初日に、自分のささげ物を献げたのは、ユダ族のアミナダブの子ナフションであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ～であった
  rationale: 物語を進める接続形を、前後の流れに自然につながる現代日本語の叙述として表した。
- source_word: הַמַּקְרִיב
  choice: 献げたのは
  rationale: ヒフィル分詞が指す、ささげ物を祭儀の場に差し出す者を自然な日本語で表現した。分詞の継続的・役割的な含みは脚注で補った。
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一日目に
  rationale: 献納の一連の日程における最初の日を明確に示す表現とした。
- source_word: אֶת קָרְבָּנוֹ
  choice: 自分のささげ物を
  rationale: קָרְבָּן の祭儀的意味を保ちつつ、一般の読者にも分かりやすい「ささげ物」を用いた。接尾辞の三人称単数は「自分の」で明示した。
- source_word: נַחְשׁוֹן
  choice: ナフション
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: בֶּן עַמִּינָדָב
  choice: アミナダブの子
  rationale: ヘブライ語の父称を簡潔かつ自然に訳した。
- source_word: לְמַטֵּה יְהוּדָה
  choice: ユダ族を代表する
  rationale: 前置詞 לְ がこの文脈で示す部族への所属・部族のための代表という関係を、奉献者の役割が分かる形で表した。別の理解も脚注に残した。
theological_decisions:
- issue: לְמַטֵּה יְהוּדָה が示す関係
  choice: ユダ族を代表する
  alternative: ユダ族の／ユダ族に属する
  rationale: 幕屋奉献において各部族の長が部族のためにささげ物をする文脈を反映した。ただし、前置詞 לְ は単純な所属とも取れるため、その幅を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献げる」は祭儀的な行為を示し、「ささげ物」は専門的すぎない語として選んだ。
