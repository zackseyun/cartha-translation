  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: ja
  text: 金の皿[a]が十二枚あり、香で満たされていた。一枚につき、聖所のシェケルを基準に十シェケルであった。皿の金は全部で百二十シェケルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鉢」「さじ」とも訳せる。ここでは香を入れる器を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: 皿
  rationale: 香を入れる小型の器を指す。現代日本語で自然であり、器の具体的な形を必要以上に限定しない。
- source_word: זָהָב
  choice: 金の
  rationale: 器の材質を示す素直な訳。
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: 十二枚
  rationale: 器の総数。日本語では平たい器に自然な助数詞「枚」を用いた。
- source_word: מְלֵאֹת קְטֹרֶת
  choice: 香が満たされていた
  rationale: 器が香で満ちていたことを明確かつ自然に表す。
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: 一枚につき……十シェケル
  rationale: 数詞の反復による分配の意味を自然な日本語で表した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準に
  rationale: 聖所で用いられる公定の重量基準を示す定型句として訳した。
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: 皿の金は全部で
  rationale: これらの器に用いられた金の重量の合計であることを簡潔に示す。
- source_word: עֶשְׂרִים וּמֵאָה
  choice: 百二十シェケル
  rationale: 原文の数値は120。単位は直前の重量表現から補って明示した。
