base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: ja
  text: 銀の大皿一枚の重さは百三十シェケル、鉢一つの重さは七十シェケルであった。これらの器の銀の総重量は二千四百シェケルで、聖所のシェケルによる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聖所のシェケルによれば」。重量を量る基準を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: 百三十
  rationale: ヘブライ語の数詞を、現代日本語で自然な数の順序にして訳した。
- source_word: הַקְּעָרָה הָאַחַת
  choice: 大皿は一枚につき
  rationale: 定冠詞を伴う単数形と数詞は、この一覧の文脈では各品の重量を示す配分的な用法である。קְעָרָה は供え物を載せる比較的大きな皿を指すため「大皿」とした。
- source_word: כֶּסֶף
  choice: 銀の／銀
  rationale: ここでは貨幣ではなく、器の材質である銀を指す。
- source_word: וְשִׁבְעִים
  choice: 七十
  rationale: 鉢一つの重量を表す基数として訳した。
- source_word: הַמִּזְרָק הָאֶחָד
  choice: 鉢は一つにつき
  rationale: מִזְרָק は祭儀に用いる鉢状の器を指す。単数形と数詞を文脈に即して配分的に訳した。
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: これらの器の銀は全部で
  rationale: כֹּל の総計の意味と、כֵּלִים が複数の器を指すことを明確で自然な日本語にした。
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: 二千四百
  rationale: ヘブライ語の合計数を標準的な日本語の数詞で表した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準とした
  rationale: 前置詞 בְּ は、ここでは重量を量る規準を示す。「聖所のシェケル」という原文の連語を保ちつつ、機能が分かる日本語とした。
theological_decisions: []
