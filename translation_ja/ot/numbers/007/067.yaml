  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ja
  text: 彼のささげ物は、重さ百三十シェケルの銀の皿一枚[a]と、重さ七十シェケルの銀の鉢一つ[b]であり、いずれも聖所のシェケルを基準とした[c]。この二つは、穀物のささげ物のために、油を混ぜた上質の小麦粉で満たされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」は「浅い器」とも訳せる。ささげ物に用いられた浅い容器。
    reason: lexical_alternative
  - marker: b
    text: 「鉢」は「大きな椀」とも訳せる。祭儀に用いられた容器。
    reason: lexical_alternative
  - marker: c
    text: すなわち、聖所で定められた重量基準による。
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: 彼のささげ物は
  rationale: 祭儀の文脈で神に差し出すものを指すため、現代日本語で明瞭な「ささげ物」とした。
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: 銀の皿一枚
  rationale: קַעֲרָה は浅い皿状の器を指す。器物目録として自然な助数詞「枚」を用いた。
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: 重さ百三十シェケル
  rationale: 原文の明示する重量を簡潔に保持した。
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: 銀の鉢一つ
  rationale: מִזְרָק は祭儀に用いる容器であり、広口の器を自然に表す「鉢」とした。
- source_word: שִׁבְעִים שֶׁקֶל
  choice: 重さ七十シェケル
  rationale: 省略された重量の関係を日本語で明示し、二つの器の数値を読み分けやすくした。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準とした重さ
  rationale: 単なる貨幣額ではなく、聖所で定められた重量基準によることを明瞭にした。
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: その二つには…満たされていた
  rationale: 二つの器の双方が満ちていたという原文の強調を保った。
- source_word: סֹלֶת
  choice: 上質の小麦粉
  rationale: 供え物に用いる精製された良質の穀粉を、一般読者に分かりやすく表した。
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 受動分詞の内容を自然な連体修飾で表した。
- source_word: לְמִנְחָה
  choice: 穀物のささげ物として
  rationale: 祭司資料の文脈における מִנְחָה の特定の供え物を明示した。
theological_decisions: []
