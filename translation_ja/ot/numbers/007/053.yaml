  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: ja
  text: また、平安のいけにえ[a]として、牛二頭、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがアミフドの子エリシャマのささげ物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「交わりのいけにえ」または「健やかさのいけにえ」とも訳せる。ヘブライ語は平安、完全さ、健やかさを表す語に由来し、共に食する祭儀に関わる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、和解のいけにえとして
  rationale: 接続詞と前置詞を、供え物の列挙を自然につなぐ「また、…として」とした。זֶבַח は祭儀的な「いけにえ」、שְׁלָמִים は伝統的な訳語である「和解のいけにえ」としつつ、語義の幅を脚注に示した。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָר は性別を特定しない集合的な「牛」を表すため、「雄牛」と限定せず、自然な日本語の助数詞を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִם は成長した雄羊を明確に指す。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִים の雄という区別を保持した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: כְּבָשִׂים を雄の子羊、בְּנֵי שָׁנָה を年齢指定の「一歳」と訳し、祭儀上の種類と年齢を明示した。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: 動詞のない同定文を、物語上の過去の列挙に合う自然な日本語で表した。
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: アミフドの子エリシャマ
  rationale: 父称を日本語で明瞭に表し、固有名詞を一般的な聖書名表記に従って音写した。
theological_decisions:
- issue: שְׁלָמִים の祭儀的意味
  choice: 和解のいけにえ
  alternative: 交わりのいけにえ／平安のいけにえ
  rationale: この語は平和、健全さ、交わりを含意し得るため、本文では簡潔で定着した表現を採用し、単一の神学的説明に限定しないよう脚注で代案を示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀の一覧にふさわしい簡潔で品位ある文体とした。動物の数には日本語として自然な助数詞を用い、原文の性別・年齢の指定を可能な限り保持した。
