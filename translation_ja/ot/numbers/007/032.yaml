  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: ja
  text: 香で満たされた、重さ十シェケルの金の小皿一つ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: 小皿
  rationale: 幕屋への奉納品目録では、人の「手のひら」ではなく香を入れる小型の容器を指す。「小皿」は現代日本語で自然であり、器の具体性も保つ。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する基数詞であり、そのまま数量を示す。
- source_word: עֲשָׂרָה
  choice: 重さ十シェケル
  rationale: ヘブライ語本文には単に「十」とあるが、周囲で反復される奉納品の定型句から重量単位シェケルが省略されていると理解できる。日本語で意味が明確になるよう補った。
- source_word: זָהָב
  choice: 金の
  rationale: 器の材質を表す語として自然な連体修飾にした。
- source_word: מְלֵאָה
  choice: 満たした
  rationale: 器が香で満ちている状態を簡潔に表す。品目を列挙する文脈に合わせて「もの」と結んだ。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 祭司的・幕屋の文脈で焚く芳香物質を指す標準的な聖書語彙。「香」は簡潔で格調があり、現代日本語でも理解できる。
