  naturalness: 現行の「香を満たしたもの」は、器が香を満たすという能動的な意味にも読め、また「もの」が何を指すかもやや不自然である。「香で満たされた」と受動形にして「金の小皿」に直接かけると、現代標準日本語として明瞭である。
