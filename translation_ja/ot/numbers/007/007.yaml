  text: אֵ֣ת שְׁתֵּ֣י הָ/עֲגָלֹ֗ת וְ/אֵת֙ אַרְבַּ֣עַת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י גֵרְשׁ֑וֹן כְּ/פִ֖י עֲבֹדָתָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: ja
  text: 二台の荷車[a]と四頭の牛[b]を、ゲルションの子らに、彼らの奉仕に応じて与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「荷車」は「運搬用の車」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では牛類を集合的に指す語が使われている。文脈上、荷車を引く牛と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: 荷車
  rationale: 運搬に用いる車を指す語であり、幕屋の運搬という文脈に合う自然な現代日本語とした。
- source_word: הַבָּקָר
  choice: 牛
  rationale: 牛類を集合的に指す語。荷車を引く文脈でも性別や去勢の有無を本文で限定しないよう、「雄牛」「去勢牛」ではなく広い「牛」とした。
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: ゲルションの子らに
  rationale: 字義どおりの親族表現を保ち、部族的集団を表す自然な日本語として訳した。
- source_word: כְּפִי עֲבֹדָתָם
  choice: 彼らの奉仕に応じて
  rationale: כְּפִי の配分・対応の含みを「応じて」で表し、עֲבֹדָה は幕屋に関する務めなので「奉仕」とした。
- source_word: נָתַן
  choice: 与えた
  rationale: 文脈上は割り当てを意味するが、動詞そのものの基本的な意味を保った。
