  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ja
  text: 焼き尽くすささげ物として、雄牛一頭、雄羊一頭、一歳の雄の子羊一頭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרは雄牛を指し、בֶּן בָּקָרはその牛が牛の群れに属することを示す慣用表現である。日本語で不自然な重複を避けつつ、原文の指定を保った。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは成長した雄の羊を表す標準的な語であり、祭儀の一覧として頭数も明示した。
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: 一歳の雄の子羊一頭
  rationale: כֶּבֶשׂは祭儀文脈では雄の子羊を指し、בֶּן שְׁנָתוֹは一歳、または生後一年以内を示す慣用句である。本文では簡潔で自然な「一歳」とした。
- source_word: לְעֹלָה
  choice: 焼き尽くすささげ物として
  rationale: עֹלָהは祭壇で全体を焼くささげ物を指す。「焼き尽くすささげ物」は行為の性質を明確にし、現代日本語でも理解しやすい。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物に繰り返される数量を、動物に自然な助数詞「頭」とともに一貫して訳した。
theological_decisions: []
translation_notes:
  register: 祭儀の目録らしい簡潔さと反復を保ちつつ、明瞭で格調のある現代標準日本語とした。原文では動物が先に並び、最後に用途が示されるが、日本語では修飾関係を明確にするため「焼き尽くすささげ物として」を文頭に置いた。
