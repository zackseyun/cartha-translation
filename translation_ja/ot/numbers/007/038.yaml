translation:
  language: ja
  text: 金の皿一つ、重さ十シェケルで、香で満たされていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: 皿
  rationale: 幕屋への献納品という文脈では、手や手のひらではなく、香を入れる小型の容器を指す。「さじ」では現代日本語で食器を連想させやすいため、「皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: כַּףを修飾する基数として、そのまま自然な日本語にした。
- source_word: עֲשָׂרָה זָהָב
  choice: 重さ十シェケル
  rationale: 原文は直訳すると「金、十」だが、民数記7章の反復される目録表現と直前の文脈から、金製容器の重量をシェケル単位で示す省略表現である。日本語では意味を明確にするため単位を補った。
- source_word: זָהָב
  choice: 金の
  rationale: 容器の材質を示す語として、自然で簡潔な連体修飾にした。
- source_word: מְלֵאָה
  choice: 満たした
  rationale: 容器の中身が香で満ちていることを表す。献納品の列挙として自然な「香を満たしたもの」とした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝で焚く芳香物質を指す聖書日本語として、簡潔で定着した「香」を採用した。
