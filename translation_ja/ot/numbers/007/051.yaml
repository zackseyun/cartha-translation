  language: en
  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ja
  text: 若い雄牛一頭、雄羊一頭、一歳の雄の子羊一頭を、焼き尽くすいけにえとして。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: 牛の群れから雄牛
  rationale: פַּרを「雄牛」とし、בֶּן־בָּקָרの牛類に属することを示す表現も自然な日本語で保持した。
- source_word: אַיִל
  choice: 雄羊
  rationale: いけにえの文脈で成長した雄の羊を指す標準的な語として訳した。
- source_word: כֶּבֶשׂ
  choice: 雄の子羊
  rationale: 子羊であることに加え、ヘブライ語名詞が示す雄性を明示した。
- source_word: בֶּן־שְׁנָתוֹ
  choice: 一歳の
  rationale: 直訳的には「その年の子」だが、いけにえの動物の年齢を表す自然な現代日本語とした。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえとして
  rationale: עֹלָהが祭壇で全体を焼くいけにえを指すことを、一般読者にも意味が伝わる表現で示した。
- source_word: אֶחָד
  choice: 一頭
  rationale: 各動物について繰り返される数量を、日本語の動物用助数詞で一貫して示した。
