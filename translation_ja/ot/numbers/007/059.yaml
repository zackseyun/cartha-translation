  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: ja
  text: また、交わりのいけにえ[a]としては、牛二頭[b]、雄羊五匹、雄やぎ五匹、一歳の雄の子羊五匹。これがペダツルの子ガムリエルのささげ物である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」または「安寧のいけにえ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、性別や役畜であることを限定せず「牛二頭」。伝統的には「雄牛二頭」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、和解のいけにえとして
  rationale: 接続詞と前置詞による献げ物一覧の継続を「また…として」で示した。זֶבַח は「いけにえ」、שְׁלָמִים は伝統的で理解しやすい「和解」としたが、語義には交わりや安寧の含みもあるため脚注を付した。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָר は牛類を表す集合名詞であり、原文が明示していない役畜性を加えず「牛」とした。大型家畜に自然な助数詞「頭」を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִם が成獣の雄羊を指すことを明確に訳した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִים の雄という指定を保持し、現代日本語として平明な表現にした。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の雄の子羊五匹
  rationale: 「一年の子ら」という年齢表現を自然な「一歳」とし、כֶּבֶשׂ が指す雄の子羊であることも明示した。
- source_word: זֶה קָרְבַּן
  choice: これが…のささげ物であった
  rationale: קָרְבַּן を宗教用語として明快な「ささげ物」とした。原文は動詞のない名詞文だが、一覧を回顧する日本語の叙述として過去形を用い、原文の形は脚注で示した。
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: ペダツルの子ガムリエル
  rationale: ヘブライ語の語順と父子関係を保ち、人名は原音に沿って日本語表記した。
theological_decisions:
- issue: שְׁלָמִים の祭儀的意味
  choice: 和解のいけにえ
  alternative: 交わりのいけにえ／安寧のいけにえ
  rationale: 単一の日本語では、平和、健全、交わりを含む語の幅を完全には表せない。「和解」は認知度と簡潔さを優先した選択であり、特定の贖罪理論に限定しないよう別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。反復される献げ物一覧の簡潔な調子を維持しつつ、動物の種類・性別・年齢を原文に即して示した。
