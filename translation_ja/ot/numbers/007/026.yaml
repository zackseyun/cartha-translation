- source_word: כַּף
  choice: 皿
  rationale: 幕屋の奉仕に用いる、香を入れる小型の器を指す。「さじ」よりも現代日本語で自然な「皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性形の基数詞で、器の数量をそのまま表した。
- source_word: עֲשָׂרָה
  choice: 重さ十シェケル
  rationale: 原文は「十」とだけ記す省略表現だが、直前から反復される奉献物の定型句により、金の重量をシェケルで示すことが明らかであるため補った。
- source_word: זָהָב
  choice: 金の
  rationale: 器の材質を示す語として、自然な日本語の連体修飾で表した。
- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 女性名詞である器に一致する形容詞であり、香が器いっぱいに入っている状態を表す。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 聖所の礼拝で焚く香料を指す、聖書文脈に適した簡潔な訳語。
