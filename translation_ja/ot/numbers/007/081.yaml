  register: 祭儀規定の列挙として簡潔で格調ある文体を用いた。原文ではלְעֹלָהが末尾にあるが、日本語では三種すべてにかかることを明瞭にするため文頭に置いた。反復されるאֶחָדは各動物に「一頭」として保持した。
