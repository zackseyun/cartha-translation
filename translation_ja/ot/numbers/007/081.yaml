translation:
  language: ja
  text: 焼き尽くすいけにえとして、牛の群れの雄牛一頭、雄羊一頭、一歳の雄の子羊一頭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 牛の群れから雄牛一頭
  rationale: פַּרは雄牛を指し、בֶּן בָּקָרはそれが牛の群れに属する家畜であることを表す慣用句。重複感を抑えつつ、原文の分類と頭数を保持した。
- source_word: אַיִל אֶחָד
  choice: 雄羊一頭
  rationale: אַיִלは供犠に用いる成長した雄羊を指す。反復されるאֶחָדは日本語の自然な数え方で「一頭」とした。
- source_word: כֶּבֶשׂ אֶחָד
  choice: 雄の子羊一頭
  rationale: כֶּבֶשׂは雄の子羊を指すため、性別を明示した。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一歳の
  rationale: 直訳的には「その年の子」だが、供犠動物の年齢を示す慣用表現なので、明瞭な現代日本語とした。
- source_word: לְעֹלָה
  choice: 焼き尽くすいけにえとして
  rationale: עֹלָהは祭壇で全体を焼く供犠を指す。「全焼のいけにえ」より行為の内容が一般読者に伝わる表現を採用した。
