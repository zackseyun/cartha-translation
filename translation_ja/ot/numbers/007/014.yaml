  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: ja
  text: 金の皿一つ、重さ十シェケル、香で満たされたもの。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「金の皿一つ、十、香で満たされたもの」。重量単位の「シェケル」は、周囲で繰り返される奉納品の定型句から補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: 皿
  rationale: 祭儀用の香を入れる小型の器を指す。現代日本語の「さじ」では食卓用具を連想させやすいため、「皿」とした。
- source_word: אַחַת
  choice: 一つ
  rationale: 女性名詞כַּףに一致する基数であり、器の個数を表す。
- source_word: עֲשָׂרָה
  choice: 十シェケル
  rationale: 原文には単位名が明記されず「十」とだけあるが、周囲で繰り返される奉納品の定型句から重量単位シェケルが補われる。自然で明瞭な日本語にするため本文で補った。
- source_word: זָהָב
  choice: 金の
  rationale: 器の材質を示すため、簡潔で自然な連体修飾とした。
- source_word: מְלֵאָה
  choice: 満たされていた
  rationale: 器が香で満ちた状態を表す女性単数の形容詞。奉納品の叙述として自然な日本語にした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 礼拝で用いる芳香物質を指す標準的な聖書用語として「香」を採用した。
theological_decisions: []
translation_notes:
  register: 簡潔な奉納品目録の調子を保ちつつ、単位が省略された原文の特徴は脚注で明示した。「香」は現代日本語でも通用する、簡潔で品位ある祭儀用語として用いた。
