source:
  edition: WLC
  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: ja
  text: そこで、イスラエルの指導者たち、すなわち父祖の家々の長たち[a]が、差し出した[b]。彼らは部族の指導者であり、数えられた者たちを監督する者であった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父祖の家々」とは、イスラエルにおける父系の親族集団、すなわち氏族や家族集団を指す。
    reason: cultural_note
  - marker: b
    text: 直訳すると「近くに持って来た」。この節では目的語が省かれているが、文脈上、幕屋奉献のための品々を差し出したことを指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「数えられた者たちの上に立つ者」。人口調査で数えられ、登録された者たちを統率する立場を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: ささげ物を差し出した
  rationale: ヒフィル形のקרבは字義的には「近くに持って来る」を意味し、祭儀や奉献の文脈では「差し出す、ささげる」の意になる。この節では目的語が明記されていないが、直後の文脈が幕屋奉献のささげ物を扱うため、自然な日本語として補った。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: イスラエルの指導者たち
  rationale: נָשִׂיאは部族共同体の長を指す。「君侯」などの王族を連想させる語を避け、現代の読者に明瞭な「指導者」とした。
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: 父祖の家々のかしらたち
  rationale: בֵּית אָבוֹתは父系の祖先を基礎とする親族集団を表す定型句。「父祖の家々」として原文の社会構造を保ち、「かしら」でרָאשִׁיםの指導的地位を示した。
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: 彼らは各部族の指導者であり
  rationale: מַטּוֹתの字義は「杖」だが、ここでは慣用的にイスラエルの諸部族を指すため、「各部族」と訳した。
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: 数えられた者たちを監督する者であった
  rationale: עמד עלは字義的には「～の上に立つ」だが、ここでは責任をもって統率・監督することを表す。הַפְּקֻדִיםは人口調査で数えられ、登録された者たちを指すため、原文の受動表現を保って「数えられた者たち」とした。
