source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: ja
  text: また、交わりのいけにえとして、牛二頭、雄羊五匹、雄やぎ五匹、一歳の子羊五匹。これがデウエルの子エルヤサフのささげ物であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: また、交わりのいけにえとして
  rationale: 接続詞と前置詞を、供え物の目録が続くことを示す自然な日本語にした。זֶבַחは祭儀上の屠殺を伴う「いけにえ」、שְׁלָמִיםは神との交わりを含む祭儀用語として訳した。
- source_word: בָּקָר שְׁנַיִם
  choice: 牛二頭
  rationale: בָּקָרは性別を特定しない牛類の集合名詞なので、簡潔に「牛」とし、日本語の助数詞「頭」を用いた。
- source_word: אֵילִם חֲמִשָּׁה
  choice: 雄羊五匹
  rationale: אֵילִםが雄羊を明示するため、性別を保持した。
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: 雄やぎ五匹
  rationale: עַתֻּדִיםは雄のやぎを指すため、その区別を明示した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: 一歳の子羊五匹
  rationale: 「一年の子ら」という年齢表現を、明瞭で自然な「一歳の子羊」とした。原文はここで性別を明示しない。
- source_word: זֶה קָרְבַּן
  choice: これが…ささげ物であった
  rationale: 指示表現を保ちつつ、反復される物語的目録に合う過去形とした。קָרְבַּןは包括的な祭儀用語なので「ささげ物」とした。
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: デウエルの子エルヤサフ
  rationale: ヘブライ語の父称関係をそのまま保ち、固有名は日本語聖書で理解しやすい音写とした。
theological_decisions:
- issue: הַשְּׁלָמִים の祭儀的意味
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 語根が示す平安・健全さと、供食を伴う祭儀の性格のいずれか一方に意味を限定しすぎない必要がある。「交わり」は機能を分かりやすく示すが、罪の赦しを得るための「和解」と断定する訳は避けた。
translation_notes:
  register: 明瞭な現代標準日本語。祭儀用語には一定の荘重さを残し、数量一覧は原文どおり簡潔にした。動物の性別は原文が示す箇所だけ明示した。
