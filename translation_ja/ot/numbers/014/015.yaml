  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: ja
  text: もしあなたがこの民を一人の人のように殺すなら[a]、あなたについての知らせを聞いた諸国民は、こう言うでしょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「一人の人のように」。民全体を一つのまとまりとして、あるいは一度に滅ぼすという意味。
    reason: lexical_alternative
  - marker: b
    text: 「あなたの評判を聞いた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: もし……殺してしまうなら
  rationale: מותのヒフィル形は「死なせる、殺す」の意。接続詞וְ自体は単純な「そして」だが、前節から続くモーセの訴えは仮定を表すため、日本語では「もし……なら」と明示した。「しまう」は民を滅ぼすことの決定的な結果と文脈上の懸念を自然に表す。
- source_word: הָעָם הַזֶּה
  choice: この民
  rationale: עָםはここでイスラエルを集合的に指す。「この民」は指示語の力を保ち、「国民」などより文脈に適する。
- source_word: כְּאִישׁ אֶחָד
  choice: 一人の人のように
  rationale: 字義どおりの比喩を本文に残し、民全体が一つのまとまりとして同じ運命に遭うという修辞を保持した。日本語では意味を誤解し得るため、脚注で慣用的な意味を示す。
- source_word: הַגּוֹיִם
  choice: 諸国の民
  rationale: גּוֹיִםはイスラエルの周囲の諸民族・諸国を指す。「異邦人」は後代の宗教的含意を帯びやすいため避けた。
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: あなたの評判を聞いた
  rationale: שֵׁמַעは「知らせ、うわさ、評判・名声」を表し得る。ここでは諸国が主の御業について聞いている文脈なので、自然な日本語の「あなたの評判」とした。「あなたについての知らせ」も可能であるため脚注に示す。
- source_word: לֵאמֹר
  choice: こう言うでしょう
  rationale: 次節に続く諸国民の発言内容を導く不定詞。日本語では未来的な帰結を自然に示すため「こう言うでしょう」とした。
theological_decisions:
- issue: 男性単数名詞を用いた集合的慣用句
  choice: 一人の人のように
  alternative: 一人残らず一度に
  rationale: אִישׁ אֶחָדは男性だけを指す教説ではなく、民全体を一つのまとまりとして描く慣用句である。本文では原文の像を保ち、その集合的意味を脚注で明らかにした。
- issue: 接続詞に含意される条件関係
  choice: もし……なら
  alternative: そして……殺し
  rationale: ヘブライ語のוְは形式上「そして」だが、前節から続く発言では、モーセが主による民の殺害を仮定し、その場合に諸国民がどう語るかを述べている。条件表現は文脈から補ったもので、出来事を断定するものではない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、モーセが主に訴える場面にふさわしい丁寧で重みのある文体とした。次節の引用へ続くことを「こう言うでしょう」で示した。
