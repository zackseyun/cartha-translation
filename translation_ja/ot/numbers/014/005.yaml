base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: ja
  text: その時、モーセとアロンは、イスラエルの子ら[a]の共同体の全会衆[b]の前で、顔を地に伏せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は、イスラエルの子孫である民、すなわち「イスラエル人」を指す。ヘブライ語は字義どおりには「イスラエルの息子たち」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、意味の近い二つの共同体語を重ねており、字義的には「共同体の会衆」。民が公に集まった全体が強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: 顔を地に伏せた
  rationale: נפלの基本義は「倒れる」だが、後続する「彼らの顔の上に」と一体のヘブライ語慣用表現を成す。日本語では、身体を低くしてひれ伏す動作を自然に示しつつ、その姿勢を明示する「顔を地に伏せた」とした。
- source_word: עַל־פְּנֵיהֶם
  choice: 顔を地に伏せた
  rationale: 深い謙卑や嘆願を表す定型的な姿勢。「顔を伏せた」だけでは立ったままにも読めるため、נפלとの結び付きを踏まえて「地に」を補い、身体的な伏し方を明確にした。
- source_word: לִפְנֵי
  choice: 前で
  rationale: 空間的・公的な面前を示す。現代日本語として簡潔であり、全共同体が見守る公の場面を保つ。
- source_word: כָּל
  choice: 全
  rationale: 集合体の全体を指すため、「全共同体」として総体性を簡潔に表した。
- source_word: קְהַל
  choice: 集会
  rationale: 招集され、集まった人々を指す語。עֲדַתと重なる共同体語を一語にまとめず、「共同体の集会」として表した。
- source_word: עֲדַת
  choice: 共同体
  rationale: 組織された民の集団を指す。現代日本語で理解しやすく、קְהַלとの二重表現も保持できる。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりには「イスラエルの息子たち」。ここでは民族全体を指す慣用句だが、原文の親族的表現を保つため「子ら」とした。日本語の「子ら」は文脈上、子孫・民を包括的に表し得る。
theological_decisions:
- issue: קְהַל עֲדַתという二つの共同体語を一語にまとめるか
  choice: 「共同体の集会」として両語を保持する
  alternative: 「全会衆」または「民の集まり」
  rationale: 原文は意味の近い二語を連ね、公的かつ厳粛な場を強調している。一語に平滑化せず、同時に日本語として理解可能な構文にした。
- issue: בְּנֵי יִשְׂרָאֵלを民族名として平滑化するか
  choice: 「イスラエルの子ら」とする
  alternative: 「イスラエル人」または「イスラエルの民」
  rationale: この句は共同体全体を指すが、原文の系譜的・親族的な言い方を残した。特定の教理的含意を付加せず、脚注で通常の意味を明示する。
- issue: 伏す動作を礼拝行為と断定するか
  choice: 身体動作として「顔を地に伏せた」と訳す
  alternative: 「ひれ伏して礼拝した」
  rationale: 文脈上、謙卑、悲嘆、嘆願など複数の含みがあり得る。原文は礼拝を意味する専用動詞を用いていないため、動作を訳し、動機や神学的意味を限定しない。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、叙事の厳粛さを保った。「顔を地に伏せた」は古風すぎず、姿勢を具体的に伝える表現。「全共同体の集会」は日常語よりやや改まった言い方だが、原文の二重の共同体表現を保つため採用した。
