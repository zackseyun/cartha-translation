base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: ja
  text: そして彼らは互いに言った。「さあ、指導者を立て[a]、エジプトへ帰ろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「頭を立てよう」。ここで「頭」は、集団の上に立つ指導者を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: そして彼らは言った
  rationale: 物語を進める接続形の単純な継起を、自然な日本語の「そして」で表した。
- source_word: אִישׁ אֶל־אָחִיו
  choice: 互いに
  rationale: 字義的には「人がその兄弟に」だが、ここでは集団内の相互的な発言を表す慣用句であり、「互いに」が明瞭で自然である。
- source_word: נִתְּנָה רֹאשׁ
  choice: 指導者を一人立てて
  rationale: 字義的には「頭を置こう」。רֹאשׁ は集団の上に立つ人物を指し、נתן の勧奨形と合わせて、指導者を選任して立てる意味を表す。「一人」は日本語で役割を担う人物を自然に示す補足である。
- source_word: וְנָשׁוּבָה
  choice: 帰ろう
  rationale: 一人称複数の勧奨形を、共同の意志・提案を表す「帰ろう」で再現した。
- source_word: מִצְרָיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾を、移動先を表す助詞「へ」で訳した。戻る意味は「帰ろう」に含まれる。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述とした。引用内の「さあ」と「帰ろう」によって、共同の提案を表す二つの勧奨形の力を自然な日本語で示した。
