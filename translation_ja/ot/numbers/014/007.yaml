  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: ja
  text: そして二人は、イスラエルの子らの全会衆[a]に言った。「私たちが偵察するために巡った地は、実に非常に良い地です。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人の全共同体」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「非常に、非常に良い地です」。または「この上なく良い地です」。
    reason: source_emphasis
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: そして二人は……言った
  rationale: 動詞は複数形で、直前の文脈ではヨシュアとカレブが話者であるため、日本語では主語を「二人」と補って明確にした。接続形は物語の継続を示す「そして」とした。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの全会衆
  rationale: עֵדָהの共同体・集会の意味を「会衆」で表し、בְּנֵי יִשְׂרָאֵלの形を「イスラエルの子ら」と比較的形式的に保持した。自然な代案は脚注に示した。
- source_word: לֵאמֹר
  choice: 独立した語としては訳出しない
  rationale: 発話を導くヘブライ語の定型表現であり、日本語では「言った」に続く直接話法によって機能が十分に表される。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 文脈上、偵察したカナンの土地を指す。聖書日本語として自然かつ簡潔な「地」を採用した。
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: 私たちが……巡った
  rationale: עבר בの通過・踏査の意味を、偵察行の文脈に自然な「巡った」で表した。目的を表す後続句と結び、単なる移動以上の現地踏査を伝える。
- source_word: לָתוּר אֹתָהּ
  choice: 偵察するために
  rationale: תורはこの物語では土地を調査する任務を指す。「偵察」は軍事的含意を持ち得る一方、「探る」「調べる」より文脈に適合する。代案を脚注に示した。
- source_word: טוֹבָה
  choice: 良い
  rationale: 基本的な評価語として「良い」を用い、強意は後続する副詞で表した。
- source_word: מְאֹד מְאֹד
  choice: 実に非常に
  rationale: מְאֹדの反復による強い強調を、現代日本語で不自然になりにくい「実に非常に」で表した。原文の反復をより直接に示す訳は脚注に掲げた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「会衆」「地」により聖書本文としての品位を保った。原文の強意を本文で自然に伝え、語の反復そのものは脚注で可視化した。脚注記号は該当箇所に置いた。
