id: NUM.14.9
reference: Numbers 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: ja
  text: ただし、ヤハウェに背いてはならない。この地の民を恐れてはならない。彼らは私たちのパンなのだから[a]。彼らを覆っていた陰は去り[b]、ヤハウェが私たちと共におられる。彼らを恐れてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らは私たちのパン」。彼らを容易に征服し、食べ物のように食い尽くせるという比喩。別訳「彼らは私たちの食べ物」。
    reason: 原文の比喩とその意味を明らかにし、可能な訳語を示すため。
  - marker: b
    text: 直訳的には「彼らの陰は彼らの上から去った」。「陰」は守りや庇護を表す比喩と考えられる。
    reason: 本文に保存したヘブライ語の比喩を現代の読者に説明するため。
lexical_decisions:
- source_word: אַךְ
  choice: ただ
  rationale: 直前の文脈を受けつつ、ここで最も重要な限定・強調を導く語として、簡潔で自然な「ただ」を採用した。
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: 主に背いてはならない
  rationale: מרד は権威に対する反逆を表す。「反逆してはならない」よりも自然でありながら、契約の主への反抗という強い意味を保つ「背いてはならない」とした。יהוה は日本語聖書の広く定着した敬虔な表記に従い「主」とした。
- source_word: עַם הָאָרֶץ
  choice: この地の民
  rationale: 直訳的な「地の民」では日本語で別の含意を帯びうるため、目前のカナンの住民を指すことが明瞭な「この地の民」とした。
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: 彼らは私たちのパンなのだから
  rationale: 原文の簡潔で鮮烈な比喩を解釈で置き換えず、そのまま本文に残した。容易に征服できる獲物という含意は脚注で示す。
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: 彼らを覆っていた陰は去り
  rationale: צֵל の字義「陰」を保ちつつ、מֵעֲלֵיהֶם の覆いのイメージを自然な日本語で表した。保護を意味する比喩である可能性は脚注に示す。
- source_word: וַיהוָה אִתָּנוּ
  choice: 主が私たちと共におられる
  rationale: 単純な接続を日本語の文脈で自然に処理し、神の臨在を明瞭に表した。
- source_word: אַל תִּירָאֻם
  choice: 彼らを恐れてはならない
  rationale: 節の前半と末尾にある反復を省略せず、勧告の強調を保持した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語で長く定着した敬虔な表記を採用した。原文が固有の契約名を用いている点を不必要に別の神学的表現へ置換しない。
- issue: כִּי לַחְמֵנוּ הֵם の征服比喩
  choice: 「彼らは私たちのパン」と比喩を本文に保存
  alternative: 「彼らは私たちの食べ物」「彼らをたやすく食い尽くせる」
  rationale: 「食べる・征服する」という含意を本文で一義的に説明せず、原文の大胆さと解釈上の余地を保った。
- issue: צִלָּם の比喩的意味
  choice: 字義的な「陰」を本文に置き、保護・庇護の意味を脚注で説明
  alternative: 本文で「守り」または「庇護」と訳す
  rationale: 古代近東的な陰の比喩を保持しながら、現代の読者に意味が伝わるよう脚注を付した。陰が神的保護を指すのか、一般的な庇護・優位を指すのかを断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保つため「〜てはならない」で統一した。原文の反復と二つの比喩を保持し、説明を脚注に分けた。
