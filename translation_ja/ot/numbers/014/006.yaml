id: NUM.14.6
reference: Numbers 14:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: ja
  text: その地を偵察した者たちのうち[a]、ヌンの子ヨシュアとエフネの子カレブは、自分たちの衣を引き裂いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の前置詞は、ヨシュアとカレブが偵察した者たちの一員だったことを示している。
    reason: lexical_note
  - marker: b
    text: 衣を引き裂くことは、深い悲しみ、恐れ、または強い苦悩を表す当時の慣習だった。
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: ヌンの子ヨシュア
  rationale: 系譜的な呼称を明確かつ自然な現代日本語で表した。文頭の接続詞は、日本語では文脈上なくても叙述の連続が明瞭なため、機械的には訳出しない。
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: エフネの子カレブ
  rationale: 接続詞を「と」で表し、二人を共同の主語として結んだ。父称は原文どおり保持した。
- source_word: מִן הַתָּרִים
  choice: 偵察した者たちのうち
  rationale: מִןを部分を表す用法と捉え、ヨシュアとカレブが偵察隊に属していたことを明示した。תריםは、この時点より前に行われた偵察を自然な日本語の連体節で表した。
- source_word: אֶת הָאָרֶץ
  choice: その地を
  rationale: 定冠詞付きの「地」は文脈ですでに話題となっている土地を指すため、「その地」とした。原文にない「カナン」は補わない。
- source_word: קָרְעוּ
  choice: 引き裂いた
  rationale: 衣を裂く動作を明確に表す現代語を選んだ。「裂いた」より意図的な身ぶりが伝わりやすい。
- source_word: בִּגְדֵיהֶם
  choice: 自分たちの衣
  rationale: 三人称複数の所有を、主語自身の衣であることが明瞭になるよう再帰的に表した。「衣」は儀礼的な身ぶりの文脈にふさわしく、かつ現代日本語でも理解できる語である。
theological_decisions: []
