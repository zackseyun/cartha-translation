  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: ja
  text: それにしても、なぜヤハウェは私たちをこの地に導き入れ、剣に倒れるために来させるのか。妻や幼い子どもたちは略奪物[a]になってしまうではないか。エジプトに戻るほうが、私たちにはよいのではないか。」「
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「敵の獲物」。ヘブライ語は、敵に略奪される戦利品を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: それなのに、なぜ
  rationale: 接続詞を保ち、直前から続く民の不平と反発の流れを自然な現代日本語で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写する。
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: 私たちをこの地に導き入れ
  rationale: 分詞の進行中・目前の動作と、目的地の内部へ向かう移動を表す。日本語では後続の目的表現に合わせて連用形とした。
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: 剣に倒れさせようとする
  rationale: 戦いで殺されることを指すヘブライ語の慣用表現を保ちつつ、使役を明示しない原文の目的構文を、日本語として自然な形で表した。
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: 妻や幼い子どもたち
  rationale: 家族についての文脈に即して נָשִׁים を「妻」、特に弱く幼い扶養家族を指す טַף を「幼い子どもたち」とした。
- source_word: יִהְיוּ לָבַז
  choice: 略奪物になってしまう
  rationale: 敵に戦利品として奪われる意味を具体的に表し、「しまう」で話者の危惧を自然に示す。
- source_word: הֲלוֹא טוֹב לָנוּ
  choice: 私たちにはよいのではないか
  rationale: 否定疑問による修辞的な提案を、断定しすぎない自然な日本語で表す。
- source_word: שׁוּב מִצְרָיְמָה
  choice: エジプトに戻る
  rationale: 方向を示す語尾を行き先として表し、引き返すという主題的意味を保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を直接用いているため、称号へ置換せず、一般的な学術的再構音に基づく「ヤハウェ」とした。
translation_notes:
  register: 明瞭で現代的ながら、民の恐れと神への非難が持つ緊張を保つ、品位ある口語寄りの文体。「剣に倒れる」という聖書的慣用表現を維持し、脚注で בַז の語義の幅を示した。
