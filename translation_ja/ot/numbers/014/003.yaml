  to: それにしても、なぜヤハウェは私たちをこの地に導き入れ、剣に倒れるために来させるのか。妻や幼い子どもたちは略奪物[a]になってしまうではないか。エジプトに戻るほうが、私たちにはよいのではないか。」「
  rationale: 原文の לִנְפֹּל（「倒れるために」）を、試みを含意する「倒れさせようとする」ではなく、目的を表す「剣に倒れるために来させる」として反映した。原文の「導き入れる」と目的表現の関係も日本語で明示した。なお、この節は前節から続く民の発言の終結部であるため、末尾の閉じ引用符を保持した。
