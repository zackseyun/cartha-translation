  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: ja
  text: すると、全会衆は声を上げて叫び[a]、民はその夜泣いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると、「（声を）上げ、彼らの声を出した」。共同体が大声で叫ぶことを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא כָּל־הָעֵדָה
  choice: 全会衆は声を上げて
  rationale: נשׂא の「上げる」という像を保ちつつ、後続の「声」と結びつけて、現代日本語の自然な慣用表現とした。כָּל־הָעֵדָה はイスラエルの共同体全体を指すため「全会衆」とした。
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: 叫び
  rationale: 直訳は「自分たちの声を与えた」だが、大勢が声を発して叫ぶことを表すヘブライ語の言い回しである。「声を上げて叫び」とすることで、原文の二つの動詞を保ちながら自然に伝えた。
- source_word: הָעָם
  choice: 民
  rationale: עָם の基本的な意味を反映し、先の「全会衆」と同じ人々を指しつつも、原文の語の変化を保持した。
- source_word: וַיִּבְכּוּ
  choice: 泣き明かした
  rationale: בכה は「泣く、嘆き泣く」の意。夜を示す時間表現と合わせ、「その夜ずっと泣いた」という文脈上自然な日本語にした。
- source_word: בַּלַּיְלָה הַהוּא
  choice: その夜
  rationale: 「あの夜に」の自然で簡潔な日本語訳。
