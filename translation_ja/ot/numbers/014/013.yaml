  to: しかしモーセはヤハウェに言った。「そうなれば、エジプト人は、あなたが御力によってこの民を彼らの中から導き上げられたことを聞くでしょう。」
  rationale: 本文では כִּי を、エジプト人が聞く事柄を示す内容節として「～ことを」と訳した。これにより、原文の統語関係と意味をより明瞭に保つ。将来的な解釈を本文に採りつつ、動詞形の過去的理解は脚注に残した。
