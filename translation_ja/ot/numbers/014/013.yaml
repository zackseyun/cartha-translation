  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: ja
  text: しかしモーセはヤハウェに言った。「そうなれば、エジプト人は、あなたが御力によってこの民を彼らの中から導き上げられたことを聞くでしょう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかしモーセは……言った
  rationale: 物語を進める接続形だが、直前に告げられた裁きに対してモーセが異議を申し立てる文脈上の対照を、自然な日本語の「しかし」で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: וְשָׁמְעוּ
  choice: そうなれば、……聞くでしょう
  rationale: 完了形は過去とも解し得るが、前節で告げられた裁きが実行された場合の結果を述べるモーセの訴えとして、ここでは将来的・結果的な意味を本文に採った。「そうなれば」は文脈上暗示された帰結を自然に表す。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 地名「エジプト」がその民を集合的に指しており、「聞く」の主体として自然な換喩表現を明示した。
- source_word: כִּי
  choice: ……からです
  rationale: エジプト人が聞くことの理由を導く説明の接続詞として解した。内容を示す「……ことを」と取る可能性は脚注の別訳に残した。
- source_word: הֶעֱלִיתָ
  choice: 導き上られた
  rationale: עלהのヒフィル形が持つ「上らせる、導き上る」という方向性を保ちつつ、出エジプトの救出行為として日本語で理解できる表現にした。
- source_word: בְכֹחֲךָ
  choice: 御力によって
  rationale: 前置詞בの手段・媒介の意味を「によって」で表し、神の力への敬意を自然な日本語の「御力」で示した。
- source_word: הָעָם הַזֶּה
  choice: この民
  rationale: 単数の集合名詞עםと指示詞を、政治的含意の強い「国民」ではなく「この民」と訳した。
- source_word: מִקִּרְבּוֹ
  choice: 彼らのただ中から
  rationale: 単数接尾辞は集合体としてのエジプトを受ける。日本語ではその住民を指す「彼ら」とし、קרבの空間的・共同体的な含みを「ただ中」で保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を明記しているため、神の固有名として音写し、称号への代置や別の伝統的音写を採らなかった。
- issue: וְשָׁמְעוּ の時制・アスペクト
  choice: 将来的な帰結として「聞くでしょう」
  alternative: 過去または現在完了的に「すでに聞いています」
  rationale: ヘブライ語の形だけでは過去の意味も可能だが、神がイスラエルを滅ぼした場合に諸国がどう受け止めるかを論じる14節へ続く訴えでは、将来的帰結がよく適合する。別の解釈は脚注に明記した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、モーセが神に訴える場面にふさわしい敬意と格調を保った。「そうなれば」で前節との論理的なつながりを補い、原文にある時制上の曖昧さは脚注に保存した。
