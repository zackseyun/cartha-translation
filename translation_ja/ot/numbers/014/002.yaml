base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: ja
  text: イスラエルの人々は皆[a]、モーセとアロンに不平を言った[b]。会衆全体が二人に言った。「エジプトの地で死んでいたらよかったのに！ あるいは、この荒野で死んでいたらよかったのに！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子らは皆」。ここではイスラエルの民全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「つぶやいた」「不満を述べた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: 不平を言った
  rationale: 共同体が指導者たちに向けて不満を表し、反抗的につぶやく意味を、明瞭で自然な現代日本語で表す。
- source_word: עַל
  choice: に
  rationale: 「不平を言う」と組み合わせ、モーセとアロンが不平の向けられた相手であることを自然な日本語で示す。敵対的な方向性は動詞句全体から伝わる。
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々は皆
  rationale: 直訳は「イスラエルの子らは皆」だが、ここでは国民共同体全体を指す慣用表現であるため、指示範囲を保ちつつ現代日本語として明瞭にした。字義は脚注に示す。
- source_word: כָּל הָעֵדָה
  choice: 会衆全体
  rationale: 民数記における、集められた契約共同体という עֵדָה の集団的な意味を保つ。
- source_word: לוּ
  choice: ああ、…たらよかったのに／それでなければ、…たらよかったのに
  rationale: 実現しなかった過去への強い願望を表す לוּ の反実仮想的な嘆きを、自然な日本語で再現する。二度目の אוֹ は「それでなければ」として選択肢を明示した。
- source_word: מַתְנוּ / מָתְנוּ
  choice: 死んでいたらよかったのに
  rationale: לוּ に続く完了形が表す、過去についての実現しなかった願いを表現する。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: 「地」を省かず、原文の地理的な表現を保つ。
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: この荒野で
  rationale: イスラエルの旅の舞台である מִדְבָּר を、五書の文脈に適した「荒野」と訳す。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל における男性形の国民呼称
  choice: 本文では「イスラエルの人々」、脚注で字義「イスラエルの子ら」を提示
  alternative: イスラエルの子ら
  rationale: ヘブライ語の形を隠さず脚注に残す一方、この定型句が男性だけでなく民全体を指す文脈上の意味を、自然で誤解の少ない現代日本語で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、共同体的・物語的な格調を保った。「ああ」と反復する「…たらよかったのに」により、民の激しい嘆きと反実仮想の願望を表した。
