base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: ja
  text: わたしは疫病で彼らを打ち、彼らから受け継ぐものを取り去る[a]。そして、あなたから彼らよりも大きく、強い国民を起こす。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らを相続から退ける」または「彼らをその地から追い払う」。ヘブライ語の動詞には、所有・相続を失わせる意味と、所有地から追い払う意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: 彼らを打ち
  rationale: נכהのヒフィル形は「打つ」を意味する。接尾辞は文法上は三人称男性単数だが、民としてのイスラエルを集合的に指すため、自然な現代日本語では複数の「彼ら」とした。
- source_word: בַדֶּבֶר
  choice: 疫病で
  rationale: דֶּבֶרは、とりわけ裁きの文脈で伝染性の疫病を表す。「疫病」は簡潔で現代的であり、意味を明確に伝える。
- source_word: וְאוֹרִשֶׁנּוּ
  choice: 彼らからその受け継ぐ地を取り上げる
  rationale: ירשׁのヒフィル形には「所有地から追い払う」「相続財産を奪う」という幅がある。日本語で単に「所有を奪う」とするより、約束の地を受け継ぐ文脈を示しつつ、語の含意を過度に限定しない表現とした。
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: あなたから……国民を起こす
  rationale: 直訳的には「あなたを国民にする」だが、この文脈ではモーセを祖とする国民を生じさせる意。「あなたから……起こす」は自然な日本語でその意味を伝える。
- source_word: גָּדוֹל וְעָצוּם
  choice: 大きく強い
  rationale: גָּדוֹלは規模・重要性、עָצוּםは強大さや数の多さを表し得る。比較を伴う文脈で「大きく強い」とし、意味の幅を保った。
- source_word: מִמֶּנּוּ
  choice: 彼らよりも
  rationale: 前置詞מןと三人称男性単数接尾辞による比較。指示対象は集合体としてのイスラエルだが、自然な日本語では「彼らよりも」とした。
theological_decisions:
- issue: 裁きの対象を示す単数接尾辞
  choice: 日本語本文では「彼ら」と複数で表す
  alternative: 「それ」または「彼」として集合的単数を形式的に保つ
  rationale: ヘブライ語はイスラエルの民を一つの集合体として男性単数で受けるが、日本語で「彼」とすると個人を指すように響く。複数形は指示対象を明確にし、集合的な民への裁きという意味を変えない。
- issue: ירשׁの使役形の意味
  choice: 「彼らからその受け継ぐ地を取り上げる」を本文とする
  alternative: 「彼らをその地から追い払う」または「彼らから相続権を奪う」
  rationale: この動詞には土地からの排除と相続財産の喪失の両面がある。本文では継承の含意を残し、別訳を脚注に示して genuine ambiguity を保った。
- issue: モーセと新しい国民の関係
  choice: 「あなたから……国民を起こす」
  alternative: 「あなたを……国民とする」
  rationale: 神がモーセ個人を一国民に変えるというより、彼を祖として新たな国民を生じさせる意味を自然に表す。特定の教派的理解は加えていない。
translation_notes:
  register: 神の厳粛な宣告にふさわしい簡潔で格調ある現代標準語とした。「打つ」「疫病」「国民」は一般読者にも明瞭な語である。ヘブライ語の集合的単数は、不自然な個人指示を避けて日本語では複数で表した。
