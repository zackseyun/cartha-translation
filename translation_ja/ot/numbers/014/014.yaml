id: NUM.14.14
reference: Numbers 14:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: ja
  text: そして彼らは、この地の住民に告げるでしょう。住民はすでに、あなたヤハウェがこの民のただ中におられ、あなたヤハウェが目と目で見られ[a]、あなたの雲が彼らの上にとどまり、昼は雲の柱のうちに、夜は火の柱のうちにあって、あなたが彼らの前を進まれることを聞いています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「目と目で見られ」。または「まのあたりに見られ」。
    reason: 「目と目」というヘブライ語の慣用的な像と、נראהを受動の「見られる」とも顕現の「現れる」とも取れる余地を示すため。
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: この地の住民
  rationale: 単数形の分詞を集合的に理解し、現代日本語で自然な集合名詞「住民」とした。
- source_word: שָׁמְעוּ
  choice: すでに…聞いています
  rationale: 過去に聞いて得た知識が現在もあることを表す完了的なニュアンスを、「すでに」と現在形で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で一般的な形に音写した。
- source_word: בְּקֶרֶב
  choice: ただ中に
  rationale: 民の間に臨在するという空間的な表現を保ちつつ、格調ある自然な日本語とした。
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: 目と目を合わせるようにして現れ
  rationale: 「目と目」という原文の像を本文に残しつつ、נראהが「見られる」と「現れる」の双方に理解し得ることを脚注で示した。
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: あなたの雲が彼らの上にとどまり
  rationale: עמדの持続的な位置を自然な日本語で表し、雲が民の上方にある具体的な像を保持した。
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: 彼らの前を進まれる
  rationale: 「導く」と解釈的に言い換えず、הלךとלפניの移動・位置の像を保った。
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: 雲の柱のうちに…火の柱のうちにあって
  rationale: 前置詞בを場所・様態として取り、神が柱によって導くという説明に限定せず、柱のうちにあって進むという原文の表現を反映した。
- source_word: יוֹמָם ... לָיְלָה
  choice: 昼は…夜は
  rationale: 時間を示す副詞句を簡潔で自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を直接用いているため、称号へ置換せず音写した。
- issue: עַיִן בְּעַיִן נִרְאָה の意味
  choice: 目と目を合わせるようにして現れ
  alternative: まのあたりに見られ、はっきりと現れ
  rationale: 直接的・明瞭な顕現を示す慣用句と考えられるが、「目と目」という原文の像と、נראהの受動・顕現の両義性を消さないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「ただ中」「柱のうちに」など原文の具体的な像を伝える箇所では、過度に古風にならない範囲で荘重さを保った。長い従属構造は二文に分け、主語「住民」を補って指示関係を明確にした。
