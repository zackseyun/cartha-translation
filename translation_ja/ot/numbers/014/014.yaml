  naturalness: 二文に分けて住民を補う構成は、長いヘブライ語の従属構造を明瞭な現代日本語にするうえで自然です。「彼ら」が住民を指すことも、直前の「住民」により十分に明確です。「目と目で見られ」はやや直訳調ですが、脚注を伴うことで原文の表現と曖昧さを損なわずに伝えられます。
  terminology: 「ヤハウェ」は原文の神名を適切に反映しています。「この民のただ中に」「あなたの雲が彼らの上にとどまり」「彼らの前を進まれる」も原文に忠実です。「雲の柱のうちに／火の柱のうちに」は、前置詞בの場所・様態の幅を保つ安全な訳です。
