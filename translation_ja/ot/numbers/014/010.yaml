source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: ja
  text: しかし、全会衆は彼らを石で打とうと言った。すると、ヤハウェの栄光が会見の天幕で、イスラエルのすべての人々[a]に現れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルのすべての子ら」。ここではイスラエル人全体を指す。
    reason: בְּנֵי יִשְׂרָאֵלという字義的な民族呼称と、日本語における慣用的な意味を示すため。
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: 全会衆
  rationale: イスラエルの共同体全体を集合的に指す表現であり、文脈の公的・集団的な響きを保った。
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: 彼らを石で打とう
  rationale: רגםの具体的な行為を「石で打つ」と訳した。「殺す」は文脈上含意され得るが、原文に明示されていないため加えなかった。代名詞「彼ら」も原文どおり保持した。
- source_word: כְבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: כבודを神の目に見える顕現として「栄光」とし、固有の神名יהוהを「ヤハウェ」と表記した。
- source_word: נִרְאָה
  choice: 現れ、…に示された
  rationale: ニファル形が表す可視的な顕現と、後続のאלが示す受け手の双方を自然な日本語で表した。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕に
  rationale: イスラエルが神と会う聖所を指す定型表現として「会見の天幕」を用い、בを顕現の場所を示す「に」とした。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルのすべての人々
  rationale: בני ישראלは字義上「イスラエルの子ら」だが、ここでは民族共同体全体を指す慣用的名称なので、現代日本語で自然な「イスラエルのすべての人々」とした。字義的な形は脚注に残した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 称号に置き換えず、原文に記された契約の神の固有名を日本語で一般的な学術的音写により示した。
- issue: בְּנֵי יִשְׂרָאֵלの民族的呼称
  choice: イスラエルのすべての人々
  alternative: イスラエルのすべての子ら
  rationale: 文法上の男性複数形を個々の男性だけに限定せず、共同体全体を指す定型的な民族名として訳した。字義的形も脚注で明示した。
- issue: רגםに死の結果を明示するか
  choice: 石で打つ
  alternative: 石で打ち殺す
  rationale: 石打ちによる死が意図される可能性は高いが、この節の動詞自体は死の結果を明記していないため、訳文で限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会見の天幕」「栄光」など聖書固有の語は維持しつつ、民族全体を指す表現は普通の読者に自然な形にした。
