  to: しかし、全会衆は彼らを石で打とうと言った。すると、ヤハウェの栄光が会見の天幕で、イスラエルのすべての人々[a]に現れた。
  rationale: 原文の単一の動詞נִרְאָהに対応して、「会見の天幕で」と「イスラエルのすべての人々に」の双方を「現れた」に係らせた。それ以外は、死の結果を明示せずに石打ちの行為を表すこと、代名詞を保持すること、神名を音写することを含め、現行訳の適切な選択を維持した。
