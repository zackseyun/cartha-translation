id: NUM.14.8
reference: Numbers 14:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: ja
  text: もしヤハウェが私たちを喜びとされるなら[a]、私たちをこの地に導き入れ、この地を私たちに与えてくださる。それは乳と蜜の流れる地である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちを気に入ってくださるなら」「私たちに好意を寄せてくださるなら」。
    reason: חפץは、喜びとすること、満足すること、好意を持つことを表し得るため。
lexical_decisions:
- source_word: אִם
  choice: もし～なら
  rationale: 後続するヤハウェの好意を条件として示す接続詞なので、自然な日本語の条件表現とした。
- source_word: חָפֵץ בָּנוּ
  choice: 私たちを喜んでくださる
  rationale: חפץの持つ喜び、満足、好意的な意向という人格的・情意的な含みを保つ。「好意を寄せる」も可能だが、本文では原語に近い「喜ぶ」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を日本語で音写した。
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: 私たちをこの地に導き入れ
  rationale: 文脈はカナンへの到着だけでなく入地を指すため、「連れて行く」より「導き入れる」が適切である。接続する完了形は条件の帰結として未来を表す。
- source_word: וּנְתָנָהּ לָנוּ
  choice: これを私たちに与えてくださる
  rationale: 接尾代名詞が「この地」を受けることを「これ」で明示し、神を主語とする文脈に応じて敬語を用いた。
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: そこは乳と蜜の流れる地である
  rationale: 土地の豊かさを表すヘブライ語の比喩を保持した。名詞「地」の反復は、日本語では独立した説明文にして自然に表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を明記しているため、称号へ置換せず「ヤハウェ」と音写した。
- issue: חָפֵץ בָּנוּ が表す神の態度
  choice: 私たちを喜んでくださる
  alternative: 私たちを気に入ってくださる／私たちに好意を寄せてくださる
  rationale: 神の喜びと好意の双方を含み得る原語の幅を一つの教義的説明に狭めず、主要な字義を本文に置き、別訳を脚注に示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文にふさわしい落ち着いた文体とした。神を主語とする動詞には自然な尊敬表現を用い、比喩「乳と蜜の流れる地」は保持した。
