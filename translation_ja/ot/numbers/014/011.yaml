  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「いつまで、この民はわたしを侮るのか。[a] わたしがこの民の中で行ったすべてのしるしにもかかわらず、いつまでわたしを信じないのか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしを軽蔑して退けるのか」とも訳せる。
    reason: נאץには、単に低く見るだけでなく、軽蔑して拒むという強い意味があるため。
  - marker: b
    text: 「いつまでわたしに信頼しないのか」とも訳せる。
    reason: אמןのヒフィル形に前置詞בが続く表現は、「信じる」と「信頼する」の両方の含みを持ち得るため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を日本語で一般的な音写にした。
- source_word: עַד־אָנָה
  choice: いつまで
  rationale: 非難を込めた時間的な修辞疑問を、自然な現代日本語で表した。同じ句の反復も保持した。
- source_word: יְנַאֲצֻנִי
  choice: わたしを侮る
  rationale: 動詞נאץが表す、軽蔑して退ける態度を簡潔かつ力のある日本語で表した。
- source_word: הָעָם הַזֶּה
  choice: この民
  rationale: 集合単数と、話者が距離を置くような指示表現の響きを保持した。
- source_word: לֹא יַאֲמִינוּ בִי
  choice: わたしを信じない
  rationale: אמןのヒフィル形と前置詞בが表し得る「信じる」と「信頼する」のうち、直接的な訳を本文に採用し、信頼の含意は脚注に残した。
- source_word: בְּכֹל הָאֹתוֹת
  choice: すべてのしるしにもかかわらず
  rationale: 前置詞בの文脈上の譲歩的関係を明示し、数々のしるしがあったのになお信じない、という対照を自然に表した。
- source_word: הָאֹתוֹת
  choice: しるし
  rationale: 神の働きを示す出来事を指す語を、原文にない「奇跡的な」という限定を加えずに訳した。
- source_word: בְּקִרְבּוֹ
  choice: そのただ中で
  rationale: 単数接尾辞が集合単数「この民」を受ける原文の形を反映しつつ、日本語として理解できる表現にした。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有名を用いているため、称号へ置換せず音写した。
- issue: לֹא יַאֲמִינוּ בִיにおける信仰と信頼の含み
  choice: わたしを信じない
  alternative: わたしに信頼しない
  rationale: この表現には知的な承認だけでなく信頼の含みもある。「信じる」を本文に置きつつ、もう一方の含みを脚注で示して曖昧さを残した。
translation_notes:
  register: 明快で現代的ながら、神の厳しい問いかけにふさわしい威厳を保った。「いつまで」を反復して原文の修辞的圧力を再現し、「この民」「そのただ中」によって集合単数のつながりも残した。
