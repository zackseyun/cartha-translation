  yaml_path: translation/ot/numbers/003/029.yaml
  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: ja
  text: ケハトの子孫の諸氏族は、幕屋の南側に宿営する。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 諸氏族
  rationale: 部族内の血縁集団を指すため、現代日本語の「家族」より範囲が広い「氏族」を用いた。複数形は「諸」で示した。
- source_word: בְּנֵי קְהָת
  choice: ケハトの子孫
  rationale: 字義的には「ケハトの息子たち」だが、ここでは後代を含む系譜集団を指すため、「子孫」が自然で正確である。
- source_word: יַחֲנוּ
  choice: 宿営する
  rationale: 未完了形は、宿営配置についての規定を表す。日本語では文脈上、簡潔な現在形が規定・指示として自然に機能する。
- source_word: עַל יֶרֶךְ
  choice: 側に
  rationale: 位置関係を表す句であり、「脇腹」という字義より、物の一方の面を示す「側」が明瞭で自然である。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 民数記における聖なる移動式聖所を指す、日本語聖書で定着した簡潔な訳語である。
- source_word: תֵּימָנָה
  choice: 南
  rationale: 方向を示す形であり、「側」と組み合わせて「南側」とすることで、位置指定を自然に表した。
