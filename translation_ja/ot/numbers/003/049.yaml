source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: ja
  text: モーセは、数がレビ人によって贖われた者たちを上回る人々から、贖いの代金[a]を受け取った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身代金」とも訳せる。ヘブライ語は、贖いのために支払う金銭を指す。
    reason: lexical_alternative
  - marker: b
    text: すなわち、贖いの人数算定において、レビ人に対応する人数を上回ったイスラエルの長子たちから受け取った。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 受け取った
  rationale: 基本義は「取った」だが、ここでは人々から代金を徴収して受領する場面なので、現代日本語として自然な「受け取った」とした。
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: 贖いの代金
  rationale: כֶּסֶף はここでは銀そのものより支払われる金銭を指し、הַפִּדְיוֹם は贖いのための支払いを表す。「贖い金」も可能だが、「贖いの代金」は意味を明瞭に伝える。
- source_word: מֵאֵת
  choice: から
  rationale: 金銭の出所を示す前置詞として、簡潔に「から」と訳した。
- source_word: הָעֹדְפִים
  choice: 数を超えた人々
  rationale: 分詞は基準となる人数を上回った者たちを指す。「余った者たち」では人への表現として不自然になり得るため、数的超過を明示した。
- source_word: עַל
  choice: を超えた
  rationale: ここでは人数の比較と超過を示すため、日本語では動詞句「数を超えた」に組み込んだ。
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: レビ人によって贖われる者
  rationale: レビ人がイスラエルの長子に代わる直前の文脈を踏まえつつ、受動分詞と属格関係を自然な日本語にした。完了した個々の行為というより、贖いの算定でレビ人に対応する者たちを指す。
theological_decisions:
- issue: レビ人と贖われる者との関係
  choice: レビ人によって贖われる者
  alternative: レビ人に属する贖われた者／レビ人が贖った者
  rationale: ヘブライ語の構文は簡潔で関係に幅があるが、文脈ではレビ人がイスラエルの長子に代わる。日本語本文では理解可能な形にし、脚注で人数算定上の意味を補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の数的比較を本文に保持し、祭儀的・法的背景は脚注で簡潔に補足した。
