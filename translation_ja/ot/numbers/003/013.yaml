  source_fidelity: ヘブライ語の反復する לִי（「わたしのもの／わたしのために／わたしのもの」）と、初子を聖別した歴史的根拠を適切に保っている。ただし、冒頭の「すべての初子はわたしのものだからである」は、理由を導く כִּי を日本語の独立した文として不自然に処理している。明示的に「なぜなら」を補うことで、前節への説明的接続を保てる。また、エジプトの初子に関する נכה はこの文脈では死に至らせる打撃を指すため、「打ち殺した」が明瞭である。
  naturalness: 「なぜなら、…だからである」として、前文脈を根拠づける神の宣言として自然な現代標準日本語にした。「それら」は人と家畜の双方を受けるため、「彼ら」より適切である。
  terminology: 「初子」「聖別した」「家畜」「ヤハウェ」はいずれも文脈と本文の格調に適する。「わたしのものとして聖別した」は所有と聖別の両面を過不足なく表す。
  issues:
