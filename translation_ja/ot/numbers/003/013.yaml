  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: ja
  text: なぜなら、すべての初子はわたしのものだからである[a]。わたしがエジプトの地ですべての初子を打ち殺した日に、イスラエルのすべての初子を、人から家畜に至るまで、わたしのものとして聖別した。それらはわたしのものとなる。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしに属する」とも訳せる。原文では、「わたしのもの」「わたしのものとして」「わたしのものとなる」に当たる表現が繰り返されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: だからである
  rationale: 直前のレビ人に関する宣言の理由を示す接続詞として、説明的な力を自然な日本語で保つ。
- source_word: לִי
  choice: わたしのもの／わたしのものとして
  rationale: 三度現れる神の所有権の強調を、文脈に応じた自然な形にしつつ反復して示す。
- source_word: כָּל בְּכוֹר
  choice: すべての初子
  rationale: בְּכוֹרは最初に生まれた子を指す。「男子」は本文に明示されていないため補わない。
- source_word: בְּיוֹם הַכֹּתִי
  choice: わたしが……打った日に
  rationale: 聖別が行われた歴史的時点との明確な時間的結び付きを保つ。נכהの致死的意味は文脈から明らかであり、「打った」で簡潔かつ厳粛に表す。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: 原文の「地」を省かず、物語の荘重さを保つ。
- source_word: הִקְדַּשְׁתִּי
  choice: 聖別した
  rationale: 神のために聖なるものとして取り分ける使役形の祭儀的・所有的意味を表す。
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: 人から家畜に至るまで
  rationale: 人間と動物の全範囲を表す定型的な両極表現を、現代日本語で明瞭に訳す。בְּהֵמָהはここではイスラエルの初子に関する文脈上「家畜」が適切。
- source_word: יִהְיוּ
  choice: 彼らは……ものとなる
  rationale: 神の継続的な所有権を宣言する未完了形を将来的・規定的に表す。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の固有名を音写し、締めくくりの権威ある自己宣言を保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を固有名として示し、一般名詞「主」と同一化しない。
- issue: מֵאָדָם עַד בְּהֵמָה の人間側の表現
  choice: 人から家畜に至るまで
  alternative: 人間から動物に至るまで
  rationale: אָדָםを性別限定せず集合的な「人」とし、人間と家畜の初子全体を含む原文の両極表現を保持する。
- issue: 聖別と所有の関係
  choice: わたしのものとして聖別した
  alternative: わたしのために聖別した
  rationale: לִיが繰り返して強調する神の所有権と、הִקְדַּשְׁתִּיの聖なる取り分けの双方を明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣言にふさわしい簡潔で荘重な文体と原文の所有表現の反復を保った。「初子」は聖書文脈で定着した語だが、性別を限定する「長男」は避けた。
