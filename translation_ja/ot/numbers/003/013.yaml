    issue: 冒頭の理由節の構文が不自然
    rationale: 「すべての初子はわたしのものだからである」だけでは、「だからである」が受ける前述内容が日本語上明示されず、独立した節として不自然である。כִּי の説明的機能は「なぜなら」で自然に示せる。
  - severity: low
    issue: 「打った」は死に至る出来事を十分明示しない
    rationale: エジプトの初子への打撃という定まった文脈では、הַכֹּתִי は致死的な打撃を指す。「打ち殺した」は不必要な神学的解釈を加えずに文脈上の意味を明確にする。
  - severity: low
    issue: 「彼ら」が家畜を含む先行詞にやや不適切
    rationale: 人と家畜の初子全体を指す複数形なので、「それら」のほうが両方の範囲を自然に受ける。
