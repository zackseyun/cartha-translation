  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: ja
  text: 生後一か月以上の男子は、数えて八千六百人であり、聖所[a]を守る務めを担っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖なるもの」。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: 男子は、数えて
  rationale: 民数記の人口調査の定型表現を、現代日本語として自然な形で表した。「男子」によって性別を限定する原文も保持している。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 生後一か月以上
  rationale: 年齢の下限を示すヘブライ語の定型句を、簡潔で明瞭な現代日本語にした。
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 八千六百人
  rationale: 人数であることが日本語で明確になるよう助数詞「人」を補った。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: 守る務めを担っていた
  rationale: 同語根を重ねた表現が示す継続的な監督・管理の責任を、自然な日本語で表した。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: 祭儀上の聖なる領域を指す文脈に適し、抽象的な「聖性」とせず場所として理解できる訳語を本文に採用した。ただし語自体には「聖なるもの」を指し得る幅があるため脚注に残した。
theological_decisions:
- issue: הַקֹּדֶשׁ が聖なる場所を指すか、聖なる物を指すか
  choice: 本文では「聖所」
  alternative: 「聖なるもの」
  rationale: 幕屋に関するレビ人の任務という文脈では聖なる領域・場所が最も自然だが、ヘブライ語の指示対象には幅があるため、別訳を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、人口調査の簡潔で荘重な調子を保った。分詞の継続的な職務性は「担っていた」で表現した。
