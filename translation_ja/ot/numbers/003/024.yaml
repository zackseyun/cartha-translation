  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לַ/גֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן לָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: ja
  text: ゲルション族の父祖の家[a]の長は、ラエルの子エルヤサフであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「父の家」。イスラエルにおける父系の親族集団、すなわち一族または氏族内の単位を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: 長は
  rationale: נָשִׂיאはこの部族組織上の文脈では、王侯ではなく公的な指導者・代表者を指すため、「長」とした。接続詞וּは、日本語では列挙の流れによって明らかなため独立した「そして」とせず、自然な文の連続性に含めた。
- source_word: בֵית אָב
  choice: 父祖の家
  rationale: 字義的な形を保ちつつ、イスラエルの父系親族集団を表す用語として「父祖の家」とした。現代日本語だけでは意味が十分明瞭でないため脚注を付した。
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: ゲルション族の
  rationale: לはここで所属・関連を表し、גֵּרְשֻׁנִּיはゲルションの子孫から成る集団を指すため、自然な集合表現「ゲルション族」とした。
- source_word: אֶלְיָסָף
  choice: エルヤサフ
  rationale: ヘブライ語の人名を日本語聖書で理解しやすい形に音写した。
- source_word: בֶּן
  choice: 子
  rationale: 系譜上の直接的な父子関係を示す標準的な訳語として「子」を用いた。
- source_word: לָאֵל
  choice: ラエル
  rationale: ヘブライ語の人名を音写した。語頭のラメドを日本語で自然に「ラ」と表した。
theological_decisions: []
