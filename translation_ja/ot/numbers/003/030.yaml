base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: ja
  text: ケハト人の諸氏族の父祖の家[b]の長[a]は、ウジエルの子エリツァファンであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「指導者」または「族長」とも訳せる（ヘブライ語 נָשִׂיא）。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「父の家」。父系の親族から成る家または氏族の単位を指す慣用表現。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: 長
  rationale: נָשִׂיאは指導的地位にある者を表す。ここでは王権を連想させず、部族組織における公的な権威を簡潔に示す「長」が適切。接続詞 וּは、名簿形式の文脈に沿って日本語では明示せず、文の連続性に委ねた。
- source_word: בֵית אָב
  choice: 父祖の家
  rationale: 字義的には「父の家」だが、父系の親族・氏族単位を指す慣用表現である。原文の親族構造を保ちつつ日本語で理解できるよう「父祖の家」とした。
- source_word: לְ/מִשְׁפְּחֹת
  choice: 諸氏族の
  rationale: מִשְׁפָּחוֹתは複数の家族集団ないし氏族を指す。בֵית אָבとの階層的な親族関係を保持するため「諸氏族の」とした。前置詞 לְはここでは所属・関係を表すものとして自然な属格で訳した。
- source_word: הַ/קְּהָתִי
  choice: ケハト人
  rationale: 定冠詞付きの単数形の民族・氏族形容詞が集合的にケハトの子孫集団を指すため、「ケハト人」とした。
- source_word: אֶלִיצָפָן
  choice: エリツァファン
  rationale: 人名として、ヘブライ語の発音に即して音写した。
- source_word: בֶּן עֻזִּיאֵל
  choice: ウジエルの子
  rationale: 標準的な系譜表現として自然な日本語にした。
- source_word: verbless identification clause
  choice: であった
  rationale: ヘブライ語の無動詞同定文を、名簿・叙述の文脈に合う自然で格調ある過去表現にした。
theological_decisions: []
