  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: ja
  text: そこでモーセは、ヤハウェの命令に従って[a]、命じられたとおりに彼らを数えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヤハウェの口に従って」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 数えた
  rationale: レビ人の人口調査という文脈で、人々の数を調べて登録することを表す。現代日本語では「数えた」が明瞭で自然。
- source_word: אֹתָם
  choice: 彼らを
  rationale: 直前の文脈にあるレビ人を指す直接目的語代名詞。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: 直訳は「ヤハウェの口に従って」だが、ここでは神の命令に基づいて行動するという慣用的意味。「命令に従って」は権威と服従の関係を自然な日本語で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語を、称号に置き換えず音写する。
- source_word: כַּאֲשֶׁר
  choice: とおりに
  rationale: 先に与えられた命令との一致を表す。日本語では「命じられたとおりに」が自然。
- source_word: צֻוָּה
  choice: 命じられた
  rationale: プアル受動形の意味を保つ。命令者は文脈上ヤハウェだが、原文同様ここでは明示しない。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神の固有名を保持し、称号への置換を避ける。
- issue: צֻוָּה の命令者
  choice: 命じられた
  alternative: ヤハウェが命じた
  rationale: 原文は受動態で命令者を明示していないため、その形を保ち、文脈から理解できるようにする。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「そこで」で物語の進行を示し、原文の語順に固執せず、「命令に従って」と「命じられたとおりに」の関係が自然に伝わるようにした。
