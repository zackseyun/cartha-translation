  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: ja
  text: メラリには、マフリ氏族とムシ氏族が属していた。これらがメラリの諸氏族である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: メラリには
  rationale: 前置詞 לְ は、この系譜的な列挙でメラリに属する集団を導入する。「メラリには」とすることで、分類上の所属を自然な日本語で示した。
- source_word: מִשְׁפַּחַת
  choice: 氏族
  rationale: מִשְׁפָּחָה は人口調査・系譜の文脈で、個々の家族より大きく部族より小さい血縁集団を指すため、「氏族」が適切である。
- source_word: הַמַּחְלִי
  choice: マフリ氏族
  rationale: マフリに由来する氏族名を表す形容詞的名称。日本語では「マフリ人」よりも、直前の מִשְׁפַּחַת と一体に「マフリ氏族」とするのが明瞭で自然である。
- source_word: וּמִשְׁפַּחַת
  choice: と…氏族
  rationale: 接続詞 וּ は二つ目の氏族を並列する。日本語では「氏族」を各名称に付け、「マフリ氏族とムシ氏族」と簡潔に表した。
- source_word: הַמּוּשִׁי
  choice: ムシ氏族
  rationale: ムシに由来する氏族名を表す形容詞的名称。「マフリ氏族」と同じ構造で訳した。
- source_word: אֵלֶּה הֵם
  choice: これらが…である
  rationale: 指示詞と代名詞による強調的な同定を、「これらが」という主格提示で保った。
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: メラリの諸氏族
  rationale: 直前に挙げた二氏族を複数形で総括している。「諸氏族」により複数を明示した。
theological_decisions: []
