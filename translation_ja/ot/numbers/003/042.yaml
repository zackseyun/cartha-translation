  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: ja
  text: モーセは、ヤハウェが彼に命じたとおり、イスラエルの子ら[a]のうちのすべての長子を数えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「イスラエルの子ら」。別訳「イスラエル人」「イスラエルの子どもたち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 数えた
  rationale: 人口調査の文脈で、人々を数えて人数を確認することを表す。現代日本語として明瞭である。
- source_word: כַּאֲשֶׁר
  choice: …とおり
  rationale: モーセの行動が神の命令に合致していたことを自然に表す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 完了形は、モーセが数えるより前に与えられた命令を指すが、日本語では従属節と主節の関係から前後関係が明らかなため、自然な過去形とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で音写した。
- source_word: אֹתוֹ
  choice: 彼に
  rationale: 命令を受けたモーセを指す代名詞を明示した。
- source_word: אֶת כָּל־בְּכוֹר
  choice: すべての長子
  rationale: 集合全体を漏れなく数えたことを表す。「男子」はこの節自体には明記されていないため補わない。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうち
  rationale: בניの親族的表現を保ちつつ、前置詞בがこの文脈で示す範囲を「のうち」で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有の神名を称号で代用せず、音写によって示した。
- issue: בְּנֵי יִשְׂרָאֵל の性を伴う親族表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の「子ら」という表現を本文に残し、その慣用的な民族名称としての意味は注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で前文からの物語の進行を示し、「彼に」を残して原文の代名詞を明示した。
