  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: ja
  text: あなたは、イスラエルの子らのうちのすべての長子に代えて、レビ人をわたしのものとして取りなさい。わたしはヤハウェである。また、イスラエルの子らの家畜のうちのすべての初子に代えて、レビ人の家畜を取りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 取り分けなさい
  rationale: 接続詞付き完了形がこの指示の文脈で命令的に機能する。単なる取得ではなく、ヤハウェのものとして選び分ける意味を自然な日本語で示す。
- source_word: הַלְוִיִּם לִי
  choice: レビ人をわたしのものとして
  rationale: לִי は所有・奉献を表すため、「わたしのために」よりも文脈上の帰属を明確に表現した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の自己宣言を独立した文として保ち、固有名である四文字神名を「ヤハウェ」と表記した。
- source_word: תַּחַת
  choice: ～に代えて
  rationale: ここではレビ人およびその家畜が長子・初子の代わりとなる置換関係を表す。
- source_word: כָּל בְּכֹר
  choice: すべての長子
  rationale: 人についての בְּכוֹר を、日本語聖書語彙として明瞭な「長子」で表し、כָּל の包括性を保持した。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうちの
  rationale: בְּנֵי の形を保持しつつ、前置詞 בְּ の範囲内という意味を「うちの」で自然に示した。
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: レビ人の家畜
  rationale: בְּהֵמָה はここで広く飼育動物を指す集合名詞なので「家畜」とした。
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの家畜のうちのすべての初子
  rationale: 動物の בְּכוֹר は「初子」とし、人の「長子」と区別した。家畜の中の初生を指す構造も保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名として音写した。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の系譜的・集合的表現を残した。「イスラエル人」も意味上可能だが、ここでは長子の代表関係が語られるため原文の形に近い表現を採用した。
- issue: レビ人と長子の関係
  choice: ～に代えて
  alternative: ～の代わりに
  rationale: 奉献された長子に対するレビ人の代理・置換という関係を明示しつつ、それ以上の教理的説明は加えなかった。
translation_notes:
  register: 現代標準日本語の荘重で明瞭な命令文。原文では一つの長い文だが、神の自己宣言を独立させて可読性を高めた。後半にも「取り分けなさい」を補い、日本語として係り受けを明確にした。
