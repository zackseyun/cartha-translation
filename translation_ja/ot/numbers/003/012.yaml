  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: ja
  text: 見よ、わたしはイスラエルの子ら[a]の中からレビ人を取り、イスラエルの子らのうち、胎を開くすべての長子の代わりとした。そして、レビ人はわたしのものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では字義的に「イスラエルの子ら」という定型表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: 見よ、わたしは
  rationale: 明示された一人称代名詞と הִנֵּה の注意喚起・強調を、荘重さを保ちつつ理解しやすい日本語で表した。接続詞は日本語の談話として不自然になるため独立には訳出していない。
- source_word: לָקַחְתִּי
  choice: 取り……代わりとした
  rationale: 完了形が示す、すでに定められ現在も効力を持つ選び取りを表す。תַּחַת と合わせ、レビ人を長子の代わりに取ったという関係を自然に示した。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: レビ族に属する者たちを指す定着した日本語表現。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの中から
  rationale: 集団内部から選び出す意味を保ち、בְּנֵי יִשְׂרָאֵל の定型的かつ字義的な表現も反映した。
- source_word: תַּחַת
  choice: 代わりとした
  rationale: この祭儀的・法的文脈での代替関係を明確に表す。
- source_word: כָּל בְּכוֹר פֶּטֶר רֶחֶם
  choice: 胎を開くすべての長子
  rationale: 初めて母胎を開く者というヘブライ語の具体的表現と、長子に関する祭儀的区分を保持した。
- source_word: וְהָיוּ לִי
  choice: そして、レビ人はわたしのものとなる
  rationale: 神への帰属を直接に表しつつ、未完了形の結果的・将来的な力を「となる」で保持した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数かつ定型的な契約共同体の呼称を本文に残し、自然な集合的表現を脚注に示した。
- issue: וְהָיוּ לִי におけるレビ人の神への関係
  choice: レビ人はわたしのものとなる
  alternative: レビ人はわたしに属することになる
  rationale: 奉献の文脈における神の所有・帰属の宣言を簡潔に訳し、後代の神学的カテゴリーを持ち込まないようにした。
translation_notes:
  register: 明快な現代標準語を基調とし、「見よ」「胎を開く」によって原文の荘重さと祭儀的な具体性を保持した。「イスラエルの子ら」は原文に近い表現だが、脚注で自然な代替訳を補った。
