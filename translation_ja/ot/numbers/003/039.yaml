  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: ja
  text: ヤハウェの命令に従って[a]、モーセとアロン[b]が氏族ごとに数えたレビ人、すなわち生後一か月以上の男子は、全部で二万二千人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヤハウェの口に従って」。これは「ヤハウェの命令に従って」という意味の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語本文では「とアロン」の文字の上に特別な点が付されている。これは古代の書記による注意記号と考えられるが、厳密な意味は不明。
    reason: textual_note
lexical_decisions:
- source_word: כָּל פְּקוּדֵי הַלְוִיִּם / פָּקַד
  choice: 数えたレビ人／全部で
  rationale: 人口調査における集計を表す。日本語では関係節の「数えた」と総数を示す「全部で」を組み合わせ、同語根の反復が担う意味を自然に表した。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: 部族名の標準的な日本語表記。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: 字義的には「ヤハウェの口に従って」だが、ここでは命令・指示に基づくことを表すヘブライ語の慣用句である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を普通名詞の「主」に置き換えず、固有名として音写した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָה はこの人口調査の文脈では核家族より広い親族集団を指すため、「家族」ではなく「氏族」とした。
- source_word: כָּל זָכָר
  choice: 男子
  rationale: 調査対象が男性であることを明確にし、年齢を問わない文脈にも自然に合う表現とした。
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: 生後一か月以上
  rationale: 年齢の下限を示す定型句を、明瞭で自然な現代日本語にした。
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: 二万二千人
  rationale: 基数をそのまま日本語の人数表現にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が四文字神名を明記しているため、その固有名としての性格を保つ音写を採用した。
- issue: 「アロン」に付された特別な点
  choice: 本文にアロンを含め、注で写本上の特徴を示す
  alternative: アロンを本文から除く
  rationale: WLCの子音本文には וְאַהֲרֹן（「とアロン」）があり、マソラ本文の特別な点だけから語を削除することはできない。一方、その点の意味は確定できないため、本文を保持して注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、人口調査の公的で荘重な調子を保った。「すなわち」によって、数えられたレビ人の範囲が生後一か月以上の男子であることを自然に示した。
