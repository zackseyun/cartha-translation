base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: ja
  text: ゲルション人の諸氏族は、幕屋の後ろ、西の方[a]に宿営する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「海の方」。聖書ヘブライ語で「西の方」を表す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 諸氏族
  rationale: 民数記の部族・人口調査の文脈では、より大きな部族またはレビ人集団の中の血縁集団を指す。「諸家族」よりも、系譜に基づく集団という意味を明確に表せる。
- source_word: הַגֵּרְשֻׁנִּי
  choice: ゲルション人
  rationale: 定冠詞を伴う単数の集団呼称で、ゲルションに属する子孫集団を集合的に指す。現代日本語で自然な「ゲルション人」とした。
- source_word: אַחֲרֵי
  choice: 後ろ
  rationale: ここでは時間的な「後」ではなく、宿営位置を示す空間的用法である。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: この文脈では聖なる天幕式の聖所を指す。日本語の聖書語として定着し、簡潔で明瞭な「幕屋」を用いた。
- source_word: יַחֲנוּ
  choice: 宿営する
  rationale: 未完了形はここで定められた宿営配置を示す。日本語では規定としても叙述としても自然な非過去形「宿営する」で表した。
- source_word: יָמָּה
  choice: 西の方
  rationale: 語源的には「海の方へ」だが、聖書ヘブライ語で西を表す定型的な方向表現である。本文では現代の読者に明瞭な方角を示し、字義は脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀的文脈で定着している「幕屋」と、血縁的下位集団を示す「氏族」を採用した。簡潔で格調を保った配置規定として訳した。
