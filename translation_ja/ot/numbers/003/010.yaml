  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: ja
  text: あなたはアロンとその子らを任命し、彼らに自分たちの祭司職を守らせなさい。しかし、近づく部外者[a]は死刑に処せられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「よそ者」。ここでは民族的な意味での外国人ではなく、祭司として近づく権限を持たない者を指す。別訳「権限のない者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: 任じなさい
  rationale: פקדは数える、割り当てる、任命するなど広い意味を持つが、ここではアロンとその子らに祭司職を担わせる文脈なので、職務への任命を表す「任じなさい」とした。
- source_word: וְשָׁמְרוּ
  choice: 守らなければならない
  rationale: שׁמרの「守る、見張る、遵守する」という意味を保ち、祭司職の務めと境界を責任をもって保持することを表した。
- source_word: כְּהֻנָּתָם
  choice: 自分たちの祭司職
  rationale: 単なる身分ではなく、彼らに属する祭司の職務・職分を指すため「祭司職」とした。再帰的な所属が明瞭になるよう「自分たちの」を添えた。
- source_word: הַזָּר
  choice: 部外者
  rationale: ここでのזָרは民族的な外国人ではなく、祭司職の領域に属さず、その務めに近づく権限を持たない者を指す。「部外者」は原語の簡潔さを保ち、具体的な意味は脚注で明示した。
- source_word: הַקָּרֵב
  choice: 近づくなら
  rationale: קרבの分詞は、制限された聖なる領域または祭司の務めへ接近する者を表す。具体的な接近の表現を保つため「近づく」とした。
- source_word: יוּמָת
  choice: 死刑に処せられる
  rationale: מותのホファル形は、単に死ぬとの予告ではなく、死に至らせられる受動的・法的処罰を示すため、「死刑に処せられる」とした。
theological_decisions:
- issue: 祭司職への接近が制限される範囲
  choice: アロンとその子らが祭司職を担って守り、その領域に属さない者が近づけば死刑に処せられる、という本文の警告をそのまま示した。
  alternative: 祭司でない者による聖所への接近全般を禁じる文とも読めるが、この一節だけでは接近が禁じられる儀礼上・空間上の厳密な境界までは特定されていない。
  rationale: 認可された祭司職の管理と、認可されない接近への刑罰を明確にしつつ、本文にない後代の制度的・教派的詳細は補わなかった。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある命令・法令調の日本語とした。「祭司職」「死刑に処せられる」により、職務上および法的な性格を明瞭にした。
