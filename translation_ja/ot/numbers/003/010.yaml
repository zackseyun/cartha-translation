  - severity: low
    issue: 任命と祭司職を守る責務の結び付きがやや弱い
    rationale: 「彼らは…守らなければならない」も誤訳ではないが、命令文の連続として「彼らに…守らせなさい」とすれば、任命された者がその職務を守るという原文の統語的関係をより自然に示せる。
