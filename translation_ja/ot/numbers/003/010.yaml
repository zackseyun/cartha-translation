- from: あなたはアロンとその子らを任じなさい。彼らは自分たちの祭司職を守らなければならない。しかし、部外者[a]が近づくなら、その者は死刑に処せられる。
  to: あなたはアロンとその子らを任命し、彼らに自分たちの祭司職を守らせなさい。しかし、近づく部外者[a]は死刑に処せられる。
  rationale: 本文を、ヘブライ語の一般規定としての「近づく者」と、アロンとその子らを任命して祭司職を守らせる命令のつながりが明瞭になるよう整えた。「部外者」は本文の簡潔さを保ち、文脈上の非民族的意味は脚注で示した。接近が禁じられる正確な儀礼的・空間的境界は本文で特定しないため、訳文・脚注ともにそれ以上の限定を加えていない。
