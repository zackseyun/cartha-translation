base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: ja
  text: 彼らの登録者――生後一か月以上のすべての男子の数に基づく登録者――は、七千五百人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 彼らのうち……登録された者／登録者
  rationale: 人口調査で数えられ、登録された者を指す語として訳した。ヘブライ語で同じ語が節の前後に反復されることも、日本語では「登録された者」「登録者」と対応させて示した。
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: 男子……を数えると
  rationale: 直訳的な「すべての男子の数によれば」の意味を、人口調査の文脈に合う自然な現代日本語で表した。
- source_word: כָּל זָכָר
  choice: 男子
  rationale: この人口調査の対象が男性であることを簡潔かつ明確に示す。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 生後一か月以上
  rationale: 年齢の下限を示す定型句を、明瞭で自然な日本語にした。
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 七千五百人
  rationale: 人数であることが明確になるよう助数詞「人」を添え、本文では漢数字で表記した。
