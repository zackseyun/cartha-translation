  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: ja
  text: また、イスラエルの子らの長子のうち、レビ人に対して余った二百七十三人の贖いの代価については、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「二百七十三人の贖われる者たちについては」。ヘブライ語はこのように、贖われる人々を指すとも読める。しかし直後の47–48節は、余った長子のために支払う代価を扱っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: 贖いの代価
  rationale: 語形はより直訳的には「贖われる者たち」とも取れるが、直後の47–48節では超過した長子一人につき支払う銀が命じられているため、文脈上の意味を自然に示す「贖いの代価」とした。語形上の別解は脚注に残した。
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: 二百七十三人
  rationale: ヘブライ語では加算式に表された数を、現代日本語で明瞭な通常の数表現にした。文脈上、人を数えているため「人」を補った。
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: レビ人の数を上回る
  rationale: レビ人を代わりとした後になお余る長子を指す比較的な意味を、自然な日本語で明示した。
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの長子のうち
  rationale: 前置詞מִןの部分を表す用法を「のうち」で示し、בְּנֵי יִשְׂרָאֵלは契約共同体を表す定型表現として「イスラエルの子ら」とした。
