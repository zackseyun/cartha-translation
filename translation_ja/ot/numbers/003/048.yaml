base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: ja
  text: その銀をアロンとその子らに、イスラエルの長子のうち余分となった者たちの贖い金として渡しなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「その中で余分となった者たちの贖いの代価」。ヘブライ語はこの関係を簡潔な構成連語で表している。本文では、「その中」が前節までに数えられたイスラエルの長子を指すことを明らかにした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 渡しなさい
  rationale: 接続詞を伴う完了形二人称男性単数は、ここでは前節に続く命令を表す。日本語では指示として自然な「渡しなさい」とした。文脈上の順序は語順によって十分に示されるため、接続詞を機械的には訳出しない。
- source_word: הַכֶּסֶף
  choice: その銀
  rationale: כֶּסֶף は銀そのもの、また銀貨・金銭を指す。この箇所では直前に徴収された銀を受けるため、物質名を保ちつつ既出性を示す「その銀」とした。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らに
  rationale: 受取人であるアロンとその息子たちを指す。ここでの「子ら」は祭司職にある具体的な男子を表すため、性別を曖昧にする表現には置き換えない。
- source_word: פְּדוּיֵי
  choice: 贖い金として
  rationale: 語形上は「贖われた者たち／贖われたもの」を表す構成形だが、目的語が「銀」であり、文脈では超過した初子の代価として渡す銀を指す。そこで意味関係を明確にする「贖い金として」とした一方、圧縮された原文の形は脚注に残した。
- source_word: הָעֹדְפִים
  choice: 人数を超えた者たち
  rationale: עודף の分詞は、対応するレビ人の人数を上回った者たちを指す。「余った者たち」よりも人口集計上の超過であることが明確になる表現を採用した。
- source_word: בָּהֶם
  choice: 彼らのうち
  rationale: 前置詞 ב と代名詞の組合せを、数えられた集団内の超過者を示す関係表現として訳した。
