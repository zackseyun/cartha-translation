base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: ja
  text: ケハトには、アムラム氏族、イツハル氏族、ヘブロン氏族、ウジエル氏族が属する。これらがケハト人の諸氏族である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: ケハトには
  rationale: 接続詞と前置詞によって、ケハトに属する氏族の列挙へ移る構文。現代日本語では「ケハトには」が分類関係を自然かつ簡潔に示す。
- source_word: מִשְׁפַּחַת
  choice: 氏族
  rationale: 人口調査・系譜の文脈で、部族より小さい血縁集団を指すため、「家族」よりも「氏族」が適切。
- source_word: הַֽ/עַמְרָמִי
  choice: アムラム氏族
  rationale: アムラムの子孫から成る集団を表す形容詞的民族名。日本語では祖名に「氏族」を付けて関係を明示する。
- source_word: הַ/יִּצְהָרִי
  choice: イツハル氏族
  rationale: イツハルの子孫集団を指す。ヘブライ語名 יִצְהָר の音写として「イツハル」を用いる。
- source_word: הַֽ/חֶבְרֹנִי
  choice: ヘブロン氏族
  rationale: ヘブロンの子孫集団を指し、周囲と同じ形式で訳す。
- source_word: הָֽ/עָזִּיאֵלִי
  choice: ウジエル氏族
  rationale: ウジエルの子孫集団を指す。日本語で通用する音写と「氏族」の組み合わせで表す。
- source_word: אֵלֶּה הֵם
  choice: これらが…である
  rationale: 指示詞と代名詞による同定文。列挙された諸集団をまとめる力を保つ。
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: ケハト人の諸氏族
  rationale: 複数形の「氏族」と、ケハトに属する者を示す形容詞的民族名を区別して表現する。
