  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: ja
  text: 会見の天幕でゲルションの子らが受け持つものは、幕屋、天幕とその覆い、そして会見の天幕の入り口の垂れ幕であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: 受け持つもの
  rationale: この文脈では、ゲルションの子らが管理し世話をするよう委ねられた物品を指す。後続する一覧を自然に導く表現とした。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ゲルションの子ら
  rationale: ヘブライ語の親族的表現を保ちつつ、現代日本語でも理解できる形にした。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: 前置詞を奉仕・職務の領域を示すものと捉え、定着した名称「会見の天幕」を用いた。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 祭儀的建造物を指す日本語聖書の定着した用語であり、後続の「天幕」との区別も保てる。
- source_word: וְהָאֹהֶל
  choice: 天幕
  rationale: 幕屋本体と区別される天幕部分を示す一覧の一項として簡潔に訳した。日本語では列挙を自然にするため接続詞を明示しない。
- source_word: מִכְסֵהוּ
  choice: その覆い
  rationale: 接尾代名詞を「その」で表し、天幕に属する保護用の覆いであることを簡潔に示した。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 入口に掛ける布を指すため、「仕切り」より具体的で自然な「垂れ幕」とした。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口
  rationale: 名詞連鎖の関係を自然な日本語の属格で表した。
