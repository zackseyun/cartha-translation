lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 次のとおりである
  rationale: 接続詞を伴う指示表現で一覧を導入している。日本語では文脈上のつながりを保ちつつ、自然な一覧導入表現とした。
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: アロンの息子たちの名
  rationale: 連語を明確で自然な現代日本語の所有表現にした。
- source_word: הַבְּכֹר
  choice: 長子
  rationale: 単なる年長者ではなく、家族内の第一子としての身分を表す語なので「長子」とした。ヘブライ語の語順に沿ってナダブの前に置いた。
- source_word: נָדָב
  choice: ナダブ
  rationale: 人名を日本語で一般的な聖書表記により音写した。
- source_word: וַאֲבִיהוּא
  choice: アビフ
  rationale: 人名を音写した。列挙の接続詞は、日本語では読点による並列で自然に表した。
- source_word: אֶלְעָזָר
  choice: エルアザル
  rationale: 人名を日本語で一般的な聖書表記により音写した。
- source_word: וְאִיתָמָר
  choice: イタマル
  rationale: 人名を音写した。最後の接続詞は、日本語の簡潔な名簿形式では読点による列挙に含めた。
