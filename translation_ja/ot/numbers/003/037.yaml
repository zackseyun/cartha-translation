  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: ja
  text: また、庭の周囲の柱、その台座、杭、綱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: 柱
  rationale: 庭の囲いを支える直立部材を指す。幕屋の建築的文脈に合い、現代日本語でも明瞭。
- source_word: הֶחָצֵר
  choice: 庭
  rationale: 幕屋を囲む区画を指す。簡潔で自然な聖書建築用語として訳した。
- source_word: סָבִיב
  choice: 周囲の
  rationale: 庭を取り巻く柱であることを自然な日本語で表す。
- source_word: אַדְנֵיהֶם
  choice: その台座
  rationale: 柱を据える構造上の基部ないし受け金具を指す。「台座」は一般読者に分かりやすく、文脈にも適する。
- source_word: יְתֵדֹתָם
  choice: 杭
  rationale: 構造物を固定するために打ち込む杭を指す。簡潔で具体的。
- source_word: מֵיתְרֵיהֶם
  choice: 綱
  rationale: 杭とともに構造物を固定する綱を指す。現代日本語として自然で、用途も想起しやすい。
- source_word: וְ
  choice: また／列挙の読点
  rationale: 節頭では前節から続く列挙を「また」で示し、後続の反復接続詞は日本語の自然な列挙として読点で表した。
theological_decisions: []
translation_notes:
  register: 幕屋の備品目録として、簡潔で格調を保ちながら現代の一般読者に理解しやすい表現とした。ヘブライ語の所有接尾辞は各項目に及ぶが、日本語では「その」を一度用いて過度な反復を避けた。
