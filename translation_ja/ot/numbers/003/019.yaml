  text: また、ケハトの子らは、その氏族ごとに、アムラム、イツハル、ヘブロン、ウジエルである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: また、ケハトの子らは
  rationale: 接続詞 וּ は続く一覧を示す「また」とし、בְנֵי は系譜的な広がりを持ち得るものの、原文の形を保つ「子ら」とした。固有名 קְהָת は日本語で定着した「ケハト」と表記した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָה はイスラエル社会における家族より大きな親族集団を指すため、「家族」ではなく「氏族」とした。前置詞 לְ の分類・区分の意味は「ごとに」で自然に表した。
- source_word: עַמְרָם וְיִצְהָר חֶבְרוֹן וְעֻזִּיאֵל
  choice: アムラム、イツハル、ヘブロン、ウジエル
  rationale: 人名として、日本語聖書で広く用いられる表記を採用した。接続詞は日本語の列挙に合わせて読点で表した。
