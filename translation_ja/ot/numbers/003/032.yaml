  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: ja
  text: レビ人の長たちの長、祭司アロンの子エルアザルは、聖所[a]の務めを守る者たちを監督する者であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖なる物」。ヘブライ語は、聖所そのものとも、そこに属する聖なる物とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: レビ人の族長たちを統率する長
  rationale: 直訳的には「レビ人の長たちの長」。נָשִׂיא の階層的な関係を、王侯の含意を避けつつ自然な現代日本語で表した。接続詞は、日本語の文脈では明示しなくても連続性が保たれるため省略した。
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの子エルアザル
  rationale: הַכֹּהֵן は直前のアロンを修飾すると取り、「祭司アロン」とした。系譜表現 בֶּן は「子」で保持した。
- source_word: פְּקֻדַּת
  choice: 監督した
  rationale: ここでは任命そのものより、担当者たちに対する監督・統轄の責任を示す。名詞句を日本語として自然な述語にした。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: 務めを守る者たち
  rationale: 同根語の反復による「託された任務を忠実に守る」という含みを保ち、「警備員」のように狭く限定しなかった。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: 幕屋の聖なる領域を指す語として簡潔で定着した「聖所」を採用した。ただし、聖なる器物・物品を指す可能性も脚注に残した。
