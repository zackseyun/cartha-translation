  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: ja
  text: そこでヤハウェはモーセに言った。「イスラエルの子らのうち、生後一か月以上のすべての男子の初子たちを数え、その名を記して人数を数えなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らの名の数を取りなさい」。名ごとに登録して人数を集計することをいう。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を普通名詞の「主」に置き換えず、日本語で広く用いられる音写によって固有名として示した。
- source_word: וַיֹּאמֶר
  choice: そこで……は……言った
  rationale: 物語を前へ進める接続形の働きを、自然な日本語の叙述として表した。
- source_word: פְּקֹד
  choice: 数え
  rationale: この文脈では人口調査として人数を数える命令を表すため、現代日本語で明快な語を選んだ。
- source_word: כָּל בְּכֹר זָכָר
  choice: すべての男子の初子
  rationale: בכורの「初子」とזכרの男性指定をともに保持した。「長男」では乳幼児を含む個々の男子という焦点が弱まり得るため避けた。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうち
  rationale: 「イスラエルの子ら」という原文の集団呼称を保ちつつ、数える対象がその集団内にいることを「うち」で自然に示した。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 生後一か月以上
  rationale: 数え始める年齢の下限を、簡潔で明確な現代日本語にした。
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: その名を一人ずつ数え上げなさい
  rationale: 字義的には「彼らの名の数を取る」に近い慣用表現であり、名ごとに人数を集計する意味を自然な日本語で示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保った。「初子」は聖書文脈で定着した語だが、直後の「男子」により意味が明確になる。
