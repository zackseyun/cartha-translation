base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに次のように告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神の発話を導入する定型句。日本語では引用内容が次節に続くため、「語って言われた」のような重複を避け、「告げられた」と自然かつ荘重に表現した。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神の固有名を表す四文字語（YHWH）。日本語聖書で広く定着した「主」を本文に用い、原語の情報と別表記は脚注に示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 前置詞 אֶל が発話の相手を示すため、現代日本語として自然な助詞「に」で表した。
- source_word: לֵאמֹר
  choice: （「告げられた」に統合）
  rationale: 後続する発言内容を導入する不定詞。「言われた。『……』」という日本語の慣用的な引用構文では独立して訳す必要がなく、主動詞に統合した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で「YHWH」および「ヤハウェ」「エホバ」）
  alternative: ヤハウェ／エホバ
  rationale: 本文の読みやすさと日本語聖書における慣用を保ちつつ、原文が称号ではなく神名の四文字語であることを脚注で明示し、推定発音を一つに断定しない。
translation_notes:
  register: 明瞭で現代的かつ礼拝的な品位を保つ文体。「そして」はヘブライ語の物語接続として機能するため、日本語では省略した。次節に発言内容が続くことを踏まえ、簡潔な発話導入とした。
