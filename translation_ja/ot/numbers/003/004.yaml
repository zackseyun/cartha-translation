revisions:
- from: しかし、ナダブとアビフは、シナイの荒野でヤハウェの前に異なる火[a]を献げたとき、ヤハウェの前で死んだ。彼らには息子がいなかった。そして、エルアザルとイタマルが、父アロンの前で[b]祭司として仕えた。
