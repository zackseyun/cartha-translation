reference: Numbers 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: ja
  text: しかし、ナダブとアビフは、シナイの荒野でヤハウェの前に不適切な火[a]を献げたとき、ヤハウェの前で死んだ。彼らには息子がいなかった。そして、エルアザルとイタマルが父アロンの前で[b]祭司として仕えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不適切な火」は、「異なる火」または「よそからの火」とも訳せる。ここでは、献げ物のために認められていない火を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「父アロンの前で」は、「父アロンの存命中に」という意味を含む可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死んだ
  rationale: מותのワイイクトル形による出来事の叙述を率直に訳した。ヘブライ語の動詞は単数形だが、主語はナダブとアビフの二人であり、日本語では数を明示する必要がない。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で／ヤハウェの前に
  rationale: 神の臨在の前というヘブライ語の空間的・関係的な表現を保った。動詞との自然な結びつきに応じて助詞を使い分けた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を日本語で一般的な音写にした。
- source_word: בְּהַקְרִבָם
  choice: 献げたとき
  rationale: 前置詞בを伴う不定詞構文の時・状況を表し、祭儀の文脈に即してקרבを「献げる」とした。
- source_word: אֵשׁ זָרָה
  choice: 異なる火
  rationale: זרהの基本的な異質性を残し、本文だけで「許可されていない」と断定しすぎない訳語を採用した。祭儀上認められていない火を指す可能性は脚注で示した。
- source_word: בְּמִדְבַּר סִינַי
  choice: シナイの荒野で
  rationale: 地理的名称を明確かつ自然な現代日本語で表した。
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: 彼らには息子がいなかった
  rationale: 祭司職の継承に関わる文脈を踏まえ、בניםを一般的な「子ども」ではなく「息子」と訳した。
- source_word: וַיְכַהֵן
  choice: 祭司として仕えた
  rationale: כהןの、祭司の務めを果たすという機能的意味を自然な日本語で表した。
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: 父アロンの前で
  rationale: עַל־פְּנֵיの像を保ち、アロンの存命中という時間的含意や監督下という意味に一義的に限定しなかった。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号「主」に置換せず音写した。
- issue: אֵשׁ זָרָהの祭儀的性格
  choice: 本文では「異なる火」とし、認可されていない火の可能性を脚注で示す
  alternative: 許されていない火
  rationale: 文脈上は不適切・無認可の火と考えられるが、זרה自体の表現が持つ幅を本文で残し、解釈を断定しすぎないようにした。
- issue: עַל־פְּנֵי אַהֲרֹןの含意
  choice: 父アロンの前で
  alternative: 父アロンの存命中に
  rationale: 空間的な「前で」と時間的な「存命中に」の両方があり得るため、本文では原文の比喩を保ち、別の理解を脚注に記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の反復「ヤハウェの前」を残し、祭司職の継承に重要な「息子」を明示した。接続詞を過度に因果化せず、「そして」で叙述の連続を表した。
