  text: לְ/גֵ֣רְשׁ֔וֹן מִשְׁפַּ֨חַת֙ הַ/לִּבְנִ֔י וּ/מִשְׁפַּ֖חַת הַ/שִּׁמְעִ֑י אֵ֣לֶּה הֵ֔ם מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: ja
  text: ゲルションには、リブニ氏族とシムイ氏族が属していた。これらがゲルション人の諸氏族である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: ゲルションには……が属していた
  rationale: 前置詞 לְ は、この系譜・人口調査の一覧では所属関係を示す。日本語では「ゲルションには……が属していた」とすることで、その関係を自然かつ明確に表せる。
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: 氏族／諸氏族
  rationale: מִשְׁפָּחָה はここで部族より小さく、現代語の「家族」より広い血縁集団を指すため、「氏族」が適切である。複数形は「諸氏族」とした。
- source_word: הַלִּבְנִי
  choice: リブニ氏族
  rationale: リブニに由来する集団を表す形容詞的民族名である。日本語では「リブニ人」よりも、直後の所属単位を明示する「リブニ氏族」が自然である。
- source_word: הַשִּׁמְעִי
  choice: シムイ氏族
  rationale: シムイに由来する集団を表す。並行する הַלִּבְנִי と同様に「シムイ氏族」と訳し、構文上の対応を保った。
- source_word: אֵלֶּה הֵם
  choice: これらが……である
  rationale: 一覧中の同定表現であり、「これらが……である」とすれば、原文の指示と同定の働きを簡潔に保てる。
- source_word: הַגֵּרְשֻׁנִּי
  choice: ゲルション人
  rationale: ゲルションに連なるレビ人の一支族を指す集団名である。「ゲルション人」は簡潔で、続く「諸氏族」とも自然につながる。
