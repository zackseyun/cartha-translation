  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: 名を…挙げると
  rationale: 接続詞を伴う名簿導入句の働きを、現代日本語で自然な列挙表現として示した。文脈とのつながりは保ちつつ、不自然な逐語訳「そして、これらが名である」は避けた。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ゲルションの息子たち
  rationale: ここでは直後に二人の男子名が列挙されるため、広義の「子孫」ではなく、字義どおり「息子たち」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: 民数記の人口調査・系譜の文脈における מִשְׁפָּחָה の集団区分を「氏族」で表し、前置詞 לְ の分類・対応の意味を「ごとに」で自然に示した。
- source_word: לִבְנִי
  choice: リブニ
  rationale: 人名を日本語で慣用的に音写した。
- source_word: וְשִׁמְעִי
  choice: とシムイ
  rationale: 人名を音写し、接続詞 וְ は日本語の列挙に自然な「と」で表した。
