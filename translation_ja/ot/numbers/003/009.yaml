  source_fidelity: 全体として命令、レビ人、アロンとその子らへの委任、イスラエルの民からの選出という原文の構造をよく反映している。ただし、נְתוּנִם נְתוּנִם は「与えられた」の反復による強い委任・割り当てを表すため、「完全に与えられた」よりも「全く委ねられた」とするほうが、日本語で意味が明瞭であり、原文の機能にも適合する。
  naturalness: 「イスラエルの子ら」は原文に近いが、明瞭な現代標準日本語としては「イスラエルの人々」のほうが自然であり、ここで指す共同体全体を適切に表せる。「アロンに全く委ねられた者たち」とすれば、不自然な所有物的響きを抑えつつ、祭司職のために割り当てられる文脈を自然に伝える。
  terminology: 「レビ人」「アロン」は定着した適切な表記である。「子ら」はアロンの息子たちを指すため維持できる。בְּנֵי יִשְׂרָאֵל は日本語では「イスラエルの人々」と訳し、脚注で直訳的な表現を補う。
  issues:
