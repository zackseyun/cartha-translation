  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: ja
  text: あなたはレビ人をアロンとその子らに与えなければならない。彼らはイスラエルの人々の中からアロンに全く委ねられた者たちである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「与えられた」が二度繰り返され、強調されている。直訳すると「与えられた、与えられた」。また「イスラエルの人々」は直訳では「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 与えなければならない
  rationale: 接続詞を伴う完了形は、この規定の文脈では命令の効力を持つ。現代日本語でその義務性を明確かつ自然に表した。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: レビ族に属し、聖所の務めのために取り分けられた者たちを指す定着した呼称。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らに
  rationale: 前置詞 ל の受け手・帰属先の意味を、נתן の授与表現に沿って訳した。
- source_word: נְתוּנִם נְתוּנִם
  choice: 完全に与えられた
  rationale: 受動分詞「与えられた」の反復による強意を、日本語として自然な副詞「完全に」で示した。原文の反復は脚注で明示した。
- source_word: הֵמָּה
  choice: 彼らは…者たちである
  rationale: 独立代名詞の強調を、主題を明示する構文と述語名詞によって表した。
- source_word: לוֹ
  choice: アロンに
  rationale: 直前のアロンを指す三人称単数代名詞。日本語では指示対象を明示したほうが誤解がなく自然である。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの中から
  rationale: 出所を示す מֵאֵת と、契約共同体を家族的に表す בְּנֵי יִשְׂרָאֵל の形を保ちつつ、集団から選び出される意味を「中から」で明確にした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数形による家族的・契約的表現を保持した。「イスラエル人」も自然だが、ここでは原文の比喩的親族表現を優先した。
- issue: נְתוּנִם נְתוּנִם の強意
  choice: 完全に与えられた
  alternative: 与えられ、与えられた
  rationale: 反復の神学的含意を特定の教理へ狭めず、献げ渡されたことの強調として訳した。日本語本文では自然さを保ち、形式的反復を脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令文の義務性を示しつつ、過度に古風な表現を避けた。「子ら」は原文の家族的表現を保つために用いた。
