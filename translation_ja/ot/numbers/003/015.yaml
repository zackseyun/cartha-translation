  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: ja
  text: レビの子らを、その父祖の家ごと、氏族ごとに数えなさい。一か月以上の男子をすべて数えなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レビの子ら」は「レビ人」とも訳せる。ヘブライ語は直訳すると「レビの子ら」で、レビからの系譜と氏族構造を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: 数えなさい
  rationale: この行政的な文脈では、人員を数えて登録することを表す。命令形と後半の強調的な反復を、明快な現代日本語で同じ表現により伝えた。
- source_word: בְּנֵי לֵוִי
  choice: レビの子ら
  rationale: 直訳的な系譜表現を保ち、続く父祖の家と氏族という構造につなげた。「レビ人」も意味上は可能である。
- source_word: לְבֵית אֲבֹתָם
  choice: その父祖の家ごと
  rationale: 父系の家系・家族集団を指す定型的な系譜表現。「父祖の家」は歴史的な社会構造を保ちつつ、日本語で理解できる。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 直前の「父祖の家」と区別される親族集団を表すため、「家族」ではなく「氏族」とした。
- source_word: כָּל זָכָר
  choice: 男子をすべて
  rationale: 成人男性だけでなく乳児も含まれるため、「男」や「成人男性」ではなく、性別を示す「男子」とした。
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: 一か月以上
  rationale: 数え始める年齢の下限を簡潔かつ正確に表す。「生後一か月以上」も可能だが、文脈上「一か月以上」で明瞭である。
