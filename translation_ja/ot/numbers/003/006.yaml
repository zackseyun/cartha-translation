  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: ja
  text: レビ族を近くに連れて来て、祭司アロンの前に立たせなさい。彼らはアロンに仕える。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アロンのために務めを行う」とも訳せる。ヘブライ語の動詞は、従者としての奉仕と祭儀上の奉仕の両方を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: 近くに連れて来て
  rationale: קרבのヒフィル命令形が表す「近くに来させる」という具体的な動きを保ちつつ、現代日本語として自然な表現にした。
- source_word: מַטֵּה לֵוִי
  choice: レビ族
  rationale: מַטֶּהは字義的には「杖」だが、ここでは部族集団を指すため、簡潔で一般的な「レビ族」とした。
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: 立たせなさい
  rationale: עמדのヒフィルが表す使役の意味を明示した。目的語は集合名詞「レビ族」なので、日本語では集団全体を前に立たせる意味として自然に読める。
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの前に
  rationale: לִפְנֵיの空間的・儀礼的な「前に」をそのまま保ち、アロンの祭司職も明示した。
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: 彼らはアロンに仕える
  rationale: שרתは従者としての奉仕にも祭儀上の奉仕にも用いられる。「仕える」は両方の含みを保てる。単数の集合名詞から複数動詞へ移るヘブライ語の数の変化を「彼ら」で反映し、代名詞の指示対象は曖昧にならないよう「アロン」とした。
theological_decisions:
- issue: レビ人の奉仕とアロンとの関係
  choice: レビ人は祭司アロンに仕える
  alternative: レビ人はアロンと共に仕える
  rationale: וְשֵׁרְתוּ אֹתוֹでは、直接目的語の代名詞が最も自然にはアロンを指す。したがって、奉仕の相手を明示する本文の関係を「共に仕える」へ弱めなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、命令文には品位のある「なさい」を採用した。「奉仕する」よりも「仕える」を選び、アロンが奉仕の直接の相手であることと、שרתが持つ従者的・祭儀的な幅を保った。
