id: NUM.3.38
reference: Numbers 3:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: ja
  text: 幕屋の前、すなわち会見の天幕の前の東側、日の昇る方に宿営していたのは、モーセとアロンとアロンの子らであった。彼らはイスラエルの子らに代わって、聖所を守る務めを果たしていた。しかし、許可なく近づく者[b]は死刑に処せられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ここでいう「許可なく近づく者」とは、民族的な意味での外国人ではなく、聖所の奉仕に近づくことを認められていない者を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: 宿営したのは
  rationale: 名詞的に用いられた分詞で、その場所に配置されて宿営する者たちを指す。文脈に合う自然な叙述とした。
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: 幕屋の前
  rationale: לִפְנֵי の空間的意味を明確にし、מִשְׁכָּן は民数記で定着した「幕屋」とした。
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: その東側……日の昇る方
  rationale: 関連する二つの東方表現を同一語に平板化せず、位置と日の出の方向という強調を保った。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と民の代表者が会うための聖所を表す名称として、幕屋との語の区別も保った。
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: モーセとアロンとアロンの子ら
  rationale: 「その子ら」では日本語でモーセを指すとも読めるため、単数接尾辞が直前のアロンを指すことを明示した。
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: 守る務めを果たしていた
  rationale: 同根語を重ねるヘブライ語が表す、委ねられた監督・警護の責任を自然な日本語で示した。
- source_word: הַמִּקְדָּשׁ
  choice: 聖所
  rationale: ここでは聖なる区域とその管理を広く指し得るため、特定の一室に限定しない伝統的で明瞭な語を選んだ。
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのために
  rationale: イスラエル共同体に関わる聖所の責任を彼らが担う関係を示しつつ、代表・代行の仕組みを本文で過度に限定しない表現とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 契約共同体を指す原文の家族的表現を保持した。
- source_word: וְהַזָּר הַקָּרֵב
  choice: しかし、許可なく近づく者
  rationale: זָר はこの祭儀的文脈では民族的な外国人ではなく、聖所への接近を認められていない者を指す。「許可なく」により誤解を避けた。
- source_word: יוּמָת
  choice: 死刑に処せられる
  rationale: ホファル形の使役受動を反映し、単に死ぬのではなく科される死刑であることを示した。
theological_decisions:
- issue: 「その子ら」の指示対象
  choice: アロンの子らを指すことを本文で明示
  alternative: モーセとアロン双方の家族、またはモーセの子らを含むと読む
  rationale: 男性単数接尾辞は直前のアロンを最も自然に指し、同章の聖所警護もアロンとその子らの祭司職に結び付いている。
- issue: 聖所規定における זָר の意味
  choice: 聖所への接近を許可されていない者
  alternative: 民族的な外国人、または一般的なよそ者
  rationale: 直接の文脈は民族ではなく、幕屋の奉仕と接近の権限を扱っているため。
- issue: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל の関係
  choice: 「イスラエルの子らのために」と訳し、共同体に関わる責任を表す
  alternative: 「イスラエルの子らに代わって」または「イスラエルの子らの務めとして」
  rationale: 前置詞句は共同体のための務め、または共同体に属する責任の代行という含みを持ち得るため、本文では一方に狭く固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖所、幕屋、会見の天幕などの聖書的名称には簡潔で品位ある語を採用した。東方を表す原文の反復は不自然にならない範囲で保持し、祭儀上の無資格者を民族的な「外国人」と誤読させないようにした。
