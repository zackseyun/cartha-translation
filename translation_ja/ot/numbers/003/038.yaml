revisions:
- from: 幕屋の前、その東側[a]、すなわち会見の天幕の前、日の昇る方に宿営したのは、モーセとアロンとアロンの子らであった。彼らはイスラエルの子らのために、聖所を守る務めを果たしていた。しかし、許可なく近づく者[b]は死刑に処せられる。
  to: 幕屋の前、すなわち会見の天幕の前の東側、日の昇る方に宿営していたのは、モーセとアロンとアロンの子らであった。彼らはイスラエルの子らに代わって、聖所を守る務めを果たしていた。しかし、許可なく近づく者[b]は死刑に処せられる。
  rationale: 本文に脚注 a のアンカーが欠けているため、東方表現の位置に [a] を復元する必要がある。あわせて、場所句を自然に整え、「イスラエルの子らに代わって」により共同体に属する聖所警護の責任を担うという原文の関係を明瞭にする。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:07:20Z'
review_pass:
  verdict: revise
  source_fidelity: 「イスラエルの子らのために」は לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל の、彼らに属する聖所警護の責任をモーセ、アロン、およびアロンの子らが担うという関係をやや弱めている。「イスラエルの子らに代わって」とするほうが文脈と英語監査記録の 'on behalf of' を適切に反映する。יוּמָת の処罰としての受動は「死刑に処せられる」で保たれている。
  naturalness: 原文の東方表現の反復を保とうとする意図はよいが、「幕屋の前、その東側、すなわち会見の天幕の前、日の昇る方に」は、「すなわち」が何を同格説明するかを不必要に曖昧にする。語順と読点を整え、同じ場所を指す二つの呼称と東方の反復が自然に読めるようにする。
  terminology: 「幕屋」「会見の天幕」「聖所」は適切であり、両者のヘブライ語上の語彙的区別も保たれている。「アロンの子ら」と明示することも、日本語での指示対象の曖昧さを避ける安全な明確化である。「許可なく近づく者」は、民族的外国人ではなく祭儀上の無資格者を指す זָר を自然に伝える。
  issues:
  - severity: medium
    issue: 「すなわち」を用いた場所句の連結が不明瞭
    rationale: 原文は「幕屋の前」と「会見の天幕の前」を重ね、東方を表す二つの副詞句を付している。現行文では「すなわち」が直前の「その東側」だけを説明するようにも読め、場所関係が曖昧になる。
  - severity: medium
    issue: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל の代表的責任が弱い
    rationale: 「イスラエルの子らのために」は受益一般にも読める。この文脈では、聖所に関するイスラエルの責任を彼らが担う意味合いがあり、「イスラエルの子らに代わって」がより明確である。
  revised_text: 幕屋の前、すなわち会見の天幕の前の東側、日の昇る方に宿営していたのは、モーセとアロンとアロンの子らであった。彼らはイスラエルの子らに代わって、聖所を守る務めを果たしていた。しかし、許可なく近づく者[b]は死刑に処せられる。
