id: NUM.3.14
reference: Numbers 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はシナイの荒野でモーセに語り、こう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語り
  rationale: דבר の継続法形による定型的な発言導入。続く לֵאמֹר と合わせ、神がモーセに言葉を伝えたことを自然な日本語で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語 YHWH を、称号「主」に置き換えず一般的な日本語表記で音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発言の相手を示す前置詞 אֶל を、日本語の自然な格助詞「に」で表した。
- source_word: בְּמִדְבַּר סִינַי
  choice: シナイの荒野で
  rationale: מִדְבָּר は人里離れた荒野を指し、構文上「シナイの荒野」となる。場所における発言なので助詞「で」を用いた。
- source_word: לֵאמֹר
  choice: こう言われた
  rationale: 後続する発言内容を導くヘブライ語の定型句。逐語的な「言って」より、日本語で引用の開始を明確かつ自然に示す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主（またはエホバ）
  rationale: 原文は称号ではなく四文字の固有名を用いているため、その区別を本文で保持した。伝統的な代読・訳語は脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「語り、こう言われた」により、原文の二重の発言導入を日本語として自然に保ち、次節に発言内容が続くことを示した。
