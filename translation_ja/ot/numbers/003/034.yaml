  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: ja
  text: 彼らのうち、登録された者[a]、すなわち生後一か月以上の男子は、六千二百人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの登録人数」。ヘブライ語は、この氏族について人口調査で登録された者、またはその総数を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: 彼らのうち、登録された者
  rationale: פקדに由来する受動・結果的な名詞形に三人称男性複数接尾辞が付き、この氏族に属する人口調査の登録者を指す。日本語では「登録された者」として、数そのものより数えられた人々を表す語感を保った。
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: すなわち…男子は
  rationale: 直訳的な「すべての男子の数によれば」は日本語では重く、文脈上、登録者の範囲を説明する句として自然に表した。「男子」により原文の性別指定を保持した。
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: 生後一か月以上の
  rationale: 年齢の下限を含む定型表現。「生後一か月以上」は現代日本語で簡潔かつ明確である。
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: 六千二百人
  rationale: 人数の合計を漢数字で示し、日本語として必要な助数詞「人」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述とした。原文の人口調査の定型句を逐語的に重ねず、「すなわち」で説明関係を示して自然な日本語に整えた。
