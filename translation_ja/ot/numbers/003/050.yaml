base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: ja
  text: 彼はイスラエルの子らの長子から、聖所のシェケルで千三百六十五シェケルの銀を受け取った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聖所のシェケルによれば」。ここでのシェケルは、聖所で用いられた重量の基準を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々の長子から
  rationale: בכור は単数形ながら集合的に用いられている。「イスラエルの子ら」を現代日本語で自然な「イスラエルの人々」とし、この箇所の長子の贖いという文脈を保った。
- source_word: לָקַח
  choice: 受け取った
  rationale: 基本義は「取る」だが、ここでは贖いの銀を徴収して受領する場面なので、「受け取った」が自然で、過度に強制的な含みも加えない。
- source_word: הַכָּסֶף
  choice: 銀
  rationale: כֶּסֶף の物質的な意味を保った。「金銭」とすることも可能だが、続くシェケルによる重量・価額表示ともよく合う。
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: 千三百六十五
  rationale: ヘブライ語の数詞を標準的で明瞭な日本語の数の順序で表した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準にして
  rationale: この句は聖所で定められた重量基準によることを示す。「聖なるシェケル」よりも、独特の硬貨名との誤解を避けやすい。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文では主語が動詞に含まれるだけだが、直前の文脈を受けて「彼」とした。銀の総額と重量基準の関係が読み取りやすいよう二文に分けた。
