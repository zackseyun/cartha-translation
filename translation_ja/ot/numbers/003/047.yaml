source:
  edition: WLC
  text: וְ/לָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַ/גֻּלְגֹּ֑לֶת בְּ/שֶׁ֤קֶל הַ/קֹּ֨דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַ/שָּֽׁקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: ja
  text: 一人につき五シェケルずつ[a]を、聖所のシェケル[b]を基準にして取りなさい。一シェケルは二十ゲラである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「頭ごとに五シェケルずつ」。
    reason: lexical_alternative
  - marker: b
    text: すなわち、聖所で用いられた重量基準による。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 取りなさい
  rationale: 接続詞を伴う完了形が、この指示の文脈では命令的な意味を持つ。現代日本語として明瞭でありつつ、規定の調子を保つ。
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: 五シェケルずつ
  rationale: 数詞「五」の反復が表す配分の意味を、日本語の「ずつ」で自然に示す。
- source_word: לַגֻּלְגֹּלֶת
  choice: 一人につき
  rationale: 字義は「頭ごとに」だが、人数ごとの徴収を意味する慣用表現なので、明瞭な現代日本語にした。字義的表現は脚注に残す。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準にして
  rationale: ここでのシェケルが、聖所に属する重量基準であることを明確にする。「聖なるシェケル」では、特別な硬貨を指すように誤解されうる。
- source_word: תִּקָּח
  choice: 取りなさい
  rationale: 同じ動詞が重量基準を指定する句と結びついており、日本語では前の目的語と合わせて一つの命令文にまとめるのが自然である。
- source_word: עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: 一シェケルは二十ゲラである
  rationale: 既出の標準単位とその換算関係を、原文の説明的な名詞節に即して明瞭に表す。
