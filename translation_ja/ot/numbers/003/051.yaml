  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: モーセは、贖いの代金[a]をアロンとその息子たちに渡した。これはヤハウェの命令に従い、ヤハウェがモーセに命じたとおりに、モーセがしたことである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「贖われた者たちの銀」。贖いのために徴収された支払いを指す。
    reason: 原文の字義的表現と、本文で採用した文脈上の意味との関係を示すため。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 渡した
  rationale: נתןの物語過去形。金銭を所定の受取人に引き渡す文脈なので、現代日本語では「与えた」より「渡した」が自然である。
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: 贖いの代金
  rationale: 字義的には「贖われた者たちの銀」。直前で徴収された贖いのための銀貨を指すため、法的・祭儀的意味と読みやすさを両立する「贖いの代金」とした。字義は脚注に残した。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその息子たちに
  rationale: בָנָיוはこの文脈ではアロンの実際の息子たちを指す。「その」により指示関係を明確にした。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従い
  rationale: 字義的には「ヤハウェの口に基づいて」だが、権威ある命令に従うことを表すヘブライ語の慣用句なので、日本語では意味を明瞭にした。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりに行ったのである
  rationale: 先に与えられた命令とモーセの行為との一致を表す。日本語で文を自然に完結させるため「行ったのである」を補った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく神名四文字を用いているため、その固有名としての性格を保つ「ヤハウェ」とした。特定の教派的呼称を本文へ持ち込まない。
- issue: כֶּסֶף הַפְּדֻיִם が指すもの
  choice: 贖いの代金
  alternative: 贖われた者たちの銀／身代金
  rationale: 原文の属格的な曖昧さを脚注で示しつつ、文脈上はレビ人の数を超えた初子の贖いとして徴収された支払いを指すため、本文では「贖いの代金」とした。「身代金」は刑事的・人質的連想が強いため避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「命令」が近接して反復される原文の構造を残しつつ、二文目を「行ったのである」で完結させて日本語としての自然さを確保した。
