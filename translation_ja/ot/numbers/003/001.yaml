  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: ja
  text: これは、ヤハウェがシナイ山でモーセに語られた時の、アロンとモーセの系譜である[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「系譜」は「子孫」とも訳せる。ヘブライ語のこの語は、家系、またはある人物から生じた事柄を導入する定型的な見出しである。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その日に」。ここでは「時に」または「時の」という意味の慣用表現。
    reason: lexical_alternative
  - marker: c
    text: 「ヤハウェがモーセと語られた」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: これは
  rationale: 新しい区分を導入する指示表現。接続詞を不自然に強調せず、現代日本語の見出し表現として訳した。
- source_word: תּוֹלְדֹת
  choice: 系譜
  rationale: 家系やそこから生じたものを導入する定型語。後続箇所がアロンの息子たちを列挙することを踏まえつつ、「子孫」と限定せず、モーセも含む原文の見出しを保持する。
- source_word: אַהֲרֹן וּ/מֹשֶׁה
  choice: アロンとモーセ
  rationale: 原文が両者を明記しているため、後続の列挙が主としてアロンの子らに集中していても双方をそのまま残した。
- source_word: בְּ/י֗וֹם
  choice: 時
  rationale: 字義的には「日に」だが、ここでは「時に／時の」という時間を示す慣用表現。自然な現代日本語にした。
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: モーセに語られた
  rationale: דבר と אֶת＋人は「その人に／と語る」を表し得る。日本語では神からモーセへの発話として「に語る」が自然であり、敬語は日本語聖書文体として主語への敬意を示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語転写で固有名として示した。
- source_word: בְּ/הַר סִינָי
  choice: シナイ山で
  rationale: 発話が行われた場所を表す自然で明確な日本語。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を称号へ置換せず、日本語で一般的な学術的転写を用いた。
- issue: アロンとモーセをともに掲げる תּוֹלְדֹת の範囲
  choice: アロンとモーセの系譜
  alternative: アロンとモーセの子孫／アロンの子孫
  rationale: 後続部分が主にアロンの息子たちを扱う一方、原文の表題はモーセも明記する。この緊張を狭義の言い換えによって解消しない。
- issue: דִּבֶּר ... אֶת מֹשֶׁה の関係
  choice: モーセに語られた
  alternative: モーセと語られた
  rationale: אֶת を伴う構文には「と」の理解もあり得るが、この文脈ではモーセを受け手とする「に」が自然である。別の可能性は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その日に」のような直訳調を避け、時間表現を自然にした。神の発話には日本語として自然な尊敬表現を用いた。
