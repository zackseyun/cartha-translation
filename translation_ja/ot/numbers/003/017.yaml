  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: ja
  text: レビの息子たちは、名を挙げると、ゲルション、ケハテ、メラリであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であった
  rationale: ここでは状態の変化ではなく、系図的な名簿を導入する過去の連結表現であるため。
- source_word: אֵלֶּה
  choice: （「レビの息子たちは」に含意）
  rationale: 指示語は後続する三名を指す。日本語では「これらはレビの息子たちであった」より、主題を直接示すほうが自然であり、指示機能は列挙によって保たれる。
- source_word: בְנֵי לֵוִי
  choice: レビの息子たち
  rationale: ここで挙げられるのはレビの直系の三人の息子なので、「子孫」ではなく「息子たち」とする。
- source_word: בִּשְׁמֹתָם
  choice: その名によれば
  rationale: 前置詞句の「その名に従って／その名によれば」という列挙公式を保ちつつ、現代日本語として読める形にした。
- source_word: גֵּרְשׁוֹן
  choice: ゲルション
  rationale: ヘブライ語音形に基づく、日本語聖書で理解可能な固有名表記。
- source_word: קְהָת
  choice: ケハテ
  rationale: ヘブライ語 קְהָת の音形を日本語で表す慣用的な表記。
- source_word: מְרָרִי
  choice: メラリ
  rationale: ヘブライ語音形に基づく慣用的な日本語表記。
