  naturalness: 「会見の天幕」「幕屋」「奉仕」は明瞭で自然である。「イスラエルの子らに属する務めを担い」は、原文の属格の幅を保ちながら現代日本語として読める。
  terminology: אֹהֶל מוֹעֵד を「会見の天幕」、מִשְׁכָּן を「幕屋」と区別することは適切である。כְּלֵי は「用具」でよい。
