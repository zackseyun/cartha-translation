  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: ja
  text: 彼らは会見の天幕のすべての用具を守り、イスラエルの子らに属する務めを担い、幕屋の奉仕を行う。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエルの子らのための務めに当たり」。
    reason: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל の属格関係は、イスラエルの子らに属する務めとも、イスラエルの子らのためにレビ人が担う務めとも理解されうる。
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: 管理し
  rationale: 祭儀的文脈で、単に見張るだけでなく、委ねられた物品を守り、その責任を負う意味を自然な日本語で表す。
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: 会見の天幕のすべての用具
  rationale: כְּלִים は器だけでなく備品や設備を広く指し得るため、「用具」として意味範囲を狭めすぎないようにした。אֹהֶל מוֹעֵד は慣用的で意味の明確な「会見の天幕」とした。
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに課せられた務め
  rationale: מִשְׁמֶרֶת の委ねられた責務という意味を「務め」で示し、レビ人がイスラエル共同体の負う務めを担うという文脈上の関係を表した。ただし属格の関係には幅があるため脚注に別訳を示した。
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: 幕屋の奉仕を行う
  rationale: עבד と עֲבֹדָה の語根反復が表す祭儀上の労務を、明瞭で dignified な現代日本語として表現した。מִשְׁכָּן は荒野の聖所を指す定着した訳語「幕屋」とした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の性を伴う集合表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の「イスラエルの息子たち／子ら」という形を保ちつつ、日本語で民族共同体を指す聖書的表現として理解できるようにした。文脈上は男性だけに限定する意図を断定しない。
- issue: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל の属格関係
  choice: イスラエルの子らに課せられた務めを担って
  alternative: イスラエルの子らのための務めに当たり
  rationale: レビ人が共同体に代わって幕屋の務めを果たす文脈を本文では明確にしたが、ヘブライ語の連語だけでは「彼らに属する務め」と「彼らのための務め」の区別が完全には固定されないため、脚注で曖昧さを保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖所に関する呼称は「会見の天幕」「幕屋」「奉仕」として荘重さと用語上の一貫性を保った。「管理し」は現代的だが、保管・警護・責任ある取り扱いを含む。
