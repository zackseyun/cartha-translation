- from: 彼らは会見の天幕のすべての用具を管理し、イスラエルの子らに課せられた務めを担って、幕屋の奉仕を行う。[a]
  to: 彼らは会見の天幕のすべての用具を守り、イスラエルの子らに属する務めを担い、幕屋の奉仕を行う。[a]
  rationale: 「守り」により שׁמר の守護と委託責任の含みを回復した。「イスラエルの子らに属する務めを担い」として、文脈上の代理的奉仕を不必要に否定せず、原文が明示しない属格関係の限定を避けた。脚注は代替的理解を明示し、曖昧さを保存する。
