source:
  edition: WLC
  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: ja
  text: メラリの子らに割り当てられた務めは、幕屋の枠板[a]、横木、柱、台座[b]、そのすべての用具、そしてそれに関わるすべての作業[c]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幕屋の板」。
    reason: lexical_alternative
  - marker: b
    text: または「受け台」。柱や枠板を差し込んで支える基礎部分。
    reason: lexical_alternative
  - marker: c
    text: または「それに関わるすべての奉仕」。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: 割り当てられた務め
  rationale: 二語の結びつきは、メラリの子らに正式に委ねられた責任・任務を表す。直訳調の重複を避けつつ、任命と責任の両面を保った。
- source_word: בְּנֵי מְרָרִי
  choice: メラリの子ら
  rationale: ヘブライ語の親族表現を保ち、「メラリ族」より原文に即した形とした。
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: 幕屋の枠板
  rationale: קֶרֶשׁは幕屋を構成する直立した構造材を指す。「板」だけより構造上の役割が明確で、現代日本語としても理解しやすい。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 聖所としての特定の構造物を指す、定着した日本語訳を用いた。
- source_word: בְרִיחָיו
  choice: 横木
  rationale: 枠板を連結する横方向の構造材を指すため、一般的な「棒」より機能が明確である。
- source_word: עַמֻּדָיו
  choice: 柱
  rationale: 構造を支える直立材を自然で簡潔な建築語で表した。
- source_word: אֲדָנָיו
  choice: 台座
  rationale: 柱や枠板を受ける基礎部分を指す。技術的には「受け台」「ほぞ穴のある台」も考えられるが、読みやすさを優先した。
- source_word: כָל כֵּלָיו
  choice: そのすべての用具
  rationale: כְּלִיは器具、道具、備品を広く含むため、範囲を狭めすぎない「用具」とした。
- source_word: כֹל עֲבֹדָתוֹ
  choice: それに関わるすべての作業
  rationale: עֲבֹדָהは奉仕と実務的な作業の双方を表し得るが、ここでは幕屋の構造部材と用具を扱う作業の総体を指すと理解できる。関連対象を補って自然な日本語にした。
theological_decisions:
- issue: עֲבֹדָהを祭儀的な「奉仕」とするか、実務的な「作業」とするか
  choice: 作業
  alternative: 奉仕
  rationale: 幕屋の部材と用具の列挙に続くため、運搬・組立て・管理などの実務を含む「作業」が文脈に合う。ただし語そのものには聖所での奉仕という含みもあり得るため、脚注で代案を示した。
translation_notes:
  register: 明快な現代標準日本語を用い、幕屋建築の一覧として簡潔かつ品位ある調子にした。「枠板」「横木」「台座」で構造上の機能が伝わるようにし、専門性が高すぎる語は脚注に回した。
