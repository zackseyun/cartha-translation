  text: וְ/קַלְעֵ֣י הֶֽ/חָצֵ֗ר וְ/אֶת מָסַךְ֙ פֶּ֣תַח הֶֽ/חָצֵ֔ר אֲשֶׁ֧ר עַל הַ/מִּשְׁכָּ֛ן וְ/עַל הַ/מִּזְבֵּ֖חַ סָבִ֑יב וְ/אֵת֙ מֵֽיתָרָ֔י/ו לְ/כֹ֖ל עֲבֹדָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: ja
  text: また、庭の掛け幕[a]、幕屋と祭壇を取り囲む庭の入り口の垂れ幕、その綱[b]、およびそれに関わるすべての務め。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「庭の幕」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「そのひも」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: 掛け幕
  rationale: 庭の囲いを形作る布製の幕を指すため。「掛け幕」は用途を具体的に示し、「幕」とする別訳の余地は脚注に残した。
- source_word: חָצֵר
  choice: 庭
  rationale: 幕屋を囲む区画を表す。現代日本語で簡潔かつ自然な聖所用語として「庭」を選んだ。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 入り口に設ける布製の仕切りを指す。「垂れ幕」により、庭を囲う「掛け幕」と区別した。
- source_word: פֶּתַח
  choice: 入り口
  rationale: 開口部または出入り口を意味し、硬い構造物である門を不必要に連想させない。
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: 幕屋と祭壇を取り囲む
  rationale: סָבִיבを生かし、庭が幕屋と祭壇の周囲に位置するという空間関係を自然な日本語で示した。
- source_word: מִשְׁכָּן
  choice: 幕屋
  rationale: イスラエルの聖なる移動式聖所を表す、日本語聖書で定着した明瞭な訳語。
- source_word: מִזְבֵּחַ
  choice: 祭壇
  rationale: いけにえを献げる設備を表す標準的な訳語。
- source_word: מֵיתָרָיו
  choice: その綱
  rationale: 構造物を固定する綱を指す。接尾辞の指示対象を過度に限定せず、「その」を保持した。
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: それに関わるすべての務め
  rationale: 祭儀上の奉仕・担当作業を表す עֲבֹדָה の含意を、現代日本語で自然に伝える。「それ」が何を受けるかを過度に確定しない表現とした。
