id: NUM.3.35
reference: Numbers 3:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: ja
  text: また、メラリの諸氏族の父祖の家[b]の長[a]は、アビハイルの子ツリエルであった。彼らは幕屋の北側に宿営することになっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「長」は「指導者」とも訳せる。ヘブライ語 נָשִׂיא は、公認された指導者や首長を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「父の家」。父系の親族から成る家系集団または氏族内の単位を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: また、…長
  rationale: 接続詞 ו は名簿の叙述を続ける「また」とし、נָשִׂיא はこの組織・宿営配置の文脈で、君主的な含みを避けつつ公認の指導者を表す「長」とした。
- source_word: בֵית אָב
  choice: 父祖の家
  rationale: 父系の親族集団・家系単位を指す慣用句であるため、単なる住居としての「父の家」ではなく、系譜的意味を保つ「父祖の家」とした。
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: メラリの諸氏族の
  rationale: מִשְׁפָּחוֹת はここでは部族内の複数の氏族単位を表す。לְ は日本語では属格関係として自然に処理した。
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: アビハイルの子ツリエル
  rationale: 固有名を日本語の慣用的な音写で示し、בֶּן は系譜表現として「…の子」と訳した。
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן … צָפֹנָה
  choice: 幕屋の北側に
  rationale: יֶרֶךְ の「側面、脇」という位置的意味と、צָפֹנָה の北方指定を、日本語で自然な一つの位置表現にまとめた。מִשְׁכָּן は文脈に即して「幕屋」とした。
- source_word: יַחֲנוּ
  choice: 彼らは…宿営することになっていた
  rationale: 未完了形はこの箇所で定められた宿営配置を示すため、単純な過去や未来ではなく、割り当て・規定の意味を伝える表現とした。複数形は「彼ら」で保持した。
theological_decisions: []
