  source_fidelity: ヘブライ語は、満一か月以上の「すべての男子の初子」を、個人名に基づく登録・計数によって集計し、その人数を二万二千三百七十三人とする。草案の数値・年齢・性別・出生順位は正確だが、「登録された者の総数で」は文法的にも意味の取り方としてもやや不自然であり、לִפְקֻדֵיהֶם（彼らの登録数／計数によれば）を明瞭に表しにくい。
  naturalness: 「名を一人ずつ数えると」と「登録された者の総数で」が一文の中で重なり、集計表現としてややぎこちない。「名前ごとに数えられた」と「その登録数によれば」に分けると、現代標準日本語として自然で、原文の反復的な人口調査用語も保てる。
  terminology: 「初子」は聖書文脈で「firstborn」を明瞭に表す語であり、「男子の初子」で性別指定も保持できる。「登録数」はפקדに由来する公式の計数・登録を、この文脈で過度に専門化せず表す。
