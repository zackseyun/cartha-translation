  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: ja
  text: 名前ごとに数えられた[a]、満一か月以上のすべての男子の初子は、その登録数によれば、二万二千三百七十三人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「名前ごとに数えられた」は、各人を名前によって登録し、数えたことを表す人口調査上の言い方である。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: …は…であった
  rationale: 人口調査の集計結果を示す文脈に合わせ、複数の対象の総数を現代日本語で自然に提示する。
- source_word: כָל בְּכוֹר זָכָר
  choice: すべての長子である男子
  rationale: בכור の出生順位と זכר の性別指定をともに明示し、『すべて』によって כָל の包括性を保つ。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を一人ずつ数えると
  rationale: 直訳的な『名の数によって』では伝わりにくい人口調査上の慣用表現を、個人ごとの記名・計数を示す自然な日本語にする。
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: 満一か月以上
  rationale: 年齢の下限を表す定型句を、現代日本語で簡潔かつ明確に表す。
- source_word: לִפְקֻדֵיהֶם
  choice: 登録された者の総数で
  rationale: פקד の人口調査における公式な登録・計数の意味を表し、単なる概算ではないことを示す。
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: 二万二千三百七十三人
  rationale: ヘブライ語の数詞全体を標準的な日本語の数の順序に直し、人数なので助数詞『人』を添える。
