  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセに告げて言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ヘブライ語: YHWH（神の固有名）。本文では「ヤハウェ」と表記した。'
    reason: 原文の四文字神名を明示し、本文の「ヤハウェ」という表記との対応を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進める接続形で、神がモーセに語る定型句。日本語では敬意を保ちつつ、後続する発言内容を自然に導く「告げられた」とした。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した神名の代替表記「主」を本文に用い、原文が固有の神名YHWHであることは脚注に明示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を、自然な現代日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: 告げられた（発言導入に含意）
  rationale: 直訳は「言って」であるが、日本語では「語って言われた」のような重複を避け、次節以降の発言を導く機能を述語「告げられた」に統合した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文では「主」、脚注で「YHWH（ヤハウェ）」
  alternative: 本文で「ヤハウェ」
  rationale: 原文が称号ではなく四文字神名である事実を脚注で保持しつつ、明瞭で格調ある日本語と一般的な読者への通用性を優先した。神名の推定発音には不確実性があるため、その点も脚注で示した。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。ヘブライ語の定型的な「語って言った」を逐語的に重ねず、日本語として自然な発言導入にした。
