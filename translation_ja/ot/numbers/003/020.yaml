  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: ja
  text: メラリの子らは、氏族ごとに言うと、マフリとムシである。これらが、父祖の家ごとのレビ人[a]の諸氏族である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「そのレビ人」。ヘブライ語は単数形で、集合的にレビ人全体を指すとも、部族の祖先レビを指すとも理解できる。後者なら「レビの諸氏族」となる。
    reason: 原文の単数の民族呼称が持つ集合的用法と、祖先名を指す可能性の両方を保持するため。
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: メラリの子ら
  rationale: 系譜上の定型表現「メラリの子ら」を保ちつつ、文頭の接続詞は日本語の項目列挙として不自然になるため明示しない。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: 部族内の血縁集団による分類を示すため、「家族」よりも制度的な単位が明確な「氏族」を用いた。
- source_word: מַחְלִי וּמוּשִׁי
  choice: マフリとムシ
  rationale: 固有名を原語の発音に即して音写した。
- source_word: אֵלֶּה הֵם
  choice: これらが…である
  rationale: 指示語と代名詞による同定文を、自然で明確な現代日本語にした。
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: レビ人の諸氏族
  rationale: 複数の氏族を指す文脈に合わせて自然に訳しつつ、原文の「レビ人」が単数形であることと、その解釈上の幅は注に残した。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに分けた
  rationale: בית אבותが表す父系の家・家系による編成を明示し、前置詞לの分類的な働きを「ごとに分けた」で表した。
theological_decisions:
- issue: הַלֵּוִי の単数形の指示対象
  choice: 本文では集合的に「レビ人」と訳す
  alternative: 祖先レビを指す「レビ」、または字義的な単数の「そのレビ人」
  rationale: 周囲の「諸氏族」と民数記3章の部族編成の文脈では集合的理解が自然だが、ヘブライ語の単数形が祖先レビを指す可能性も排除せず、注で示した。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある系譜・組織名簿の文体とした。「父祖の家」は聖書の父系的な社会単位を保つ表現であり、「氏族」と区別した。
