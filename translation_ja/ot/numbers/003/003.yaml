source:
  edition: WLC
  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: ja
  text: これらは、アロンの息子たち、すなわち油を注がれた祭司たちの名である。彼らは祭司として仕えるために任職された[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼が彼らの手を満たした」。祭司として仕える者に任命し、職に就かせることを表すヘブライ語の慣用句。ここでは動作主の名は明示されていない。
    reason: 原語の具体的な慣用表現と、本文で「任職された」と訳した根拠を示すため。
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: これらは、アロンの息子たち……の名である
  rationale: ヘブライ語の提示・同定の構文を、明瞭で自然な現代日本語にした。「息子たち」は男性の祭司的子孫を指すため具体性を保った。
- source_word: הַכֹּהֲנִים
  choice: 祭司たち
  rationale: 定冠詞を伴う職名で、アロンの息子たちを同格的に説明している。日本語では「すなわち」によって関係を明示した。
- source_word: הַמְּשֻׁחִים
  choice: 油を注がれた
  rationale: משׁח の受動分詞が示す具体的な儀礼行為を保ち、より広義の「聖別された」とはしなかった。
- source_word: מִלֵּא יָדָם
  choice: 任職された
  rationale: 直訳では「彼が彼らの手を満たした」だが、祭司職への任命・就任を表す慣用句である。本文では理解しやすい機能的表現を用い、具体的な原語表現を脚注に残した。
- source_word: לְכַהֵן
  choice: 祭司として仕えるために
  rationale: 祭司職に就く目的・働きを表す不定詞として、職務的な意味を明確にした。
theological_decisions:
- issue: מִלֵּא יָדָם という任職慣用句の訳し方
  choice: 本文では「任職された」とし、祭司として仕える目的を明記する
  alternative: 「彼らの手を満たした」または「彼らの手は満たされた」と直訳する
  rationale: 直訳は原語の比喩を可視化する一方、現代日本語だけでは意味が伝わりにくい。そこで本文の明瞭さを優先しつつ、脚注で字義と祭司任職の意味を示した。原文では動作主が明示されていないため、本文でも特定しなかった。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「任職」は日常語よりやや改まった語だが、祭司職への正式な任命を簡潔かつ正確に表せる。
