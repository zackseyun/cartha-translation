source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: ja
  text: 彼らは、会見の天幕の前で、彼の務め[a]と全会衆の務め[b]を守り、幕屋の奉仕を行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼」は文脈上、アロンを指すと考えられる。「務めを守る」というヘブライ語の表現には、委ねられた責任を管理することと、忠実に果たすことの両方の含みがある。
    reason: lexical_alternative
  - marker: b
    text: レビ人が、聖所に関して全会衆にかかわる責任を担うという意味。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ ... מִשְׁמַרְתּוֹ ... מִשְׁמֶרֶת
  choice: 務め……を守り
  rationale: 同根の動詞と名詞の組み合わせが表す、委ねられた務めを忠実に果たし、管理するという祭儀的な意味を保った。「警護する」だけに限定しない表現である。
- source_word: מִשְׁמַרְתּוֹ
  choice: 彼の務め
  rationale: 三人称男性単数の接尾辞を明示的に訳し、直前の文脈ではアロンを最も自然な先行詞としつつ、本文自体が名前を繰り返していないことも保持した。
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: 全会衆の務め
  rationale: 前の「彼の務め」との並行および מִשְׁמֶרֶת の反復を日本語でも保った。ここでは全会衆に属する、または全会衆のために担う責任を指す。
- source_word: הָעֵדָה
  choice: 会衆
  rationale: 民数記でイスラエル共同体を指す標準的な祭儀用語として、現代日本語でも通じる「会衆」を用いた。
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: 会見の天幕の前で
  rationale: לִפְנֵי の空間的・祭儀的方向性を保ち、אֹהֶל מוֹעֵד を慣用的な「会見の天幕」とした。
- source_word: לַעֲבֹד אֶת־עֲבֹדַת הַמִּשְׁכָּן
  choice: 幕屋の奉仕を行う
  rationale: 動詞 עבד と同根名詞 עֲבֹדָה の目的構文を、自然な日本語で祭儀的奉仕として表した。מִשְׁכָּן は荒野の聖所を指す慣用訳「幕屋」とした。
theological_decisions:
- issue: מִשְׁמַרְתּוֹ の三人称男性単数接尾辞が指すもの
  choice: 本文では「彼」とし、直前の文脈に基づいてアロンを最も自然な指示対象とする
  alternative: 幕屋の管理責任、または祭司職全体の務めを一般的に指すと解する
  rationale: 民数記3章の直前の文脈ではレビ人がアロンとその子らに与えられているため、アロンが最も自然な先行詞である。ただしヘブライ語本文はここでアロンの名を明記せず接尾辞だけを用いるので、日本語本文でも「彼」として形式上の含みを残した。
- issue: 「全会衆の務め」の関係
  choice: レビ人が全会衆にかかわる聖所上の責任を担う
  alternative: 全会衆が自ら直接行うべき一般的義務を指す
  rationale: アロンの務めとの並行と、会見の天幕および幕屋の奉仕という文脈から、レビ人が共同体に代わって担う聖所関連の責任と理解するのが自然である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「務め」と「奉仕」を使い分け、前者では委託された管理責任、後者では幕屋で行う祭儀的働きを表した。原文の並行表現と代名詞の曖昧さを可能な限り保持した。
