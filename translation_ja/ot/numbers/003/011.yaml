  yaml_path: translation/ot/numbers/003/011.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: それから、ヤハウェはモーセに次のように語られた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳：「そして、ヤハウェはモーセに語って言われた。」冒頭の接続語は、文脈により「それから」とも訳せる。
    reason: 原文の定型表現 לֵאמֹר と接続語 וַ の字義的な形および別訳を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから、…告げた
  rationale: 物語を進める接続形を自然な日本語の「それから」で表し、דבר の発話行為は、後続する神の言葉を導入する文脈に合う「告げた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な形に音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞 אֶל を、日本語として自然な助詞「に」で表した。
- source_word: לֵאמֹר
  choice: （独立には訳出せず、「告げた」に含める）
  rationale: 後続の直接話法を導く定型句であり、日本語では「告げた」の後に引用が続く形で機能が十分に伝わるため、冗長な「言って」を避けた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、その固有名としての性格を保つ音写を採用した。
translation_notes:
  register: 明瞭で現代的かつ尊厳ある叙述。「告げた」は神の発話を導入する定型句として自然であり、次節への連続性も保つ。
