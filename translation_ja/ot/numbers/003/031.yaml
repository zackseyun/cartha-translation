  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: ja
  text: 彼らが受け持つのは、箱、机、燭台、祭壇、奉仕に用いる聖所の器具[a]、入り口の垂れ幕[b]、およびそれに関わるすべての務め[c]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖なる器具」。ここでの「聖所の器具」は、聖所で用いる祭具を指す。
    reason: lexical_alternative
  - marker: b
    text: 幕屋の入り口に掛ける垂れ幕。至聖所を隔てる内側の垂れ幕とは別のもの。
    reason: cultural_note
  - marker: c
    text: 原文の「それ」が何を指すかは明示されていない。垂れ幕に関わる務め、またはここに列挙された聖所の品々に関わる務め、と理解できる。
    reason: ambiguity_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: 彼らが受け持つのは
  rationale: 幕屋に関して割り当てられた管理上の責任・務めを表す。日本語では、後続する品目の列挙につながりやすい「受け持つ」を用いた。
- source_word: הָאָרֹן
  choice: 箱
  rationale: 原文は単に「箱」としており、「あかしの箱」などの説明を補わない。文脈上、聖なる箱を指す。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 原文どおり簡潔に訳し、供えのパンなどの説明は加えない。
- source_word: הַמְּנֹרָה
  choice: 燭台
  rationale: 幕屋の灯火を置く祭具を指す伝統的かつ明瞭な日本語。固有名詞化せず、普通名詞として訳した。
- source_word: הַמִּזְבְּחֹת
  choice: 祭壇
  rationale: ヘブライ語は複数形で、幕屋に属する複数の祭壇を集合的に指す。日本語では「祭壇」が単複を明示せず自然に包含する。
- source_word: וּכְלֵי הַקֹּדֶשׁ אֲשֶׁר יְשָׁרְתוּ בָּהֶם
  choice: 奉仕に用いる聖所の器具
  rationale: כְּלִיםを広く「器具」とし、関係節は、それらを用いて聖所の奉仕を行うという道具的意味が明確になるようにまとめた。
- source_word: וְהַמָּסָךְ
  choice: 入り口の垂れ幕
  rationale: מָסָךְは幕屋の入り口を覆う掛け幕を指し、至聖所を隔てる内側の垂れ幕とは区別される。本文で必要最小限の説明を加えた。
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: およびそのためのすべての務め
  rationale: עֲבֹדָהの礼拝・幕屋奉仕の含みを「務め」で表した。三人称男性単数接尾辞の指示対象を本文で断定せず、「そのための」として原文の曖昧さを保った。
theological_decisions:
- issue: 幕屋における奉仕の用語
  choice: 「奉仕」「務め」を用いる
  alternative: 「仕える」「作業」を用いる
  rationale: 行政的な一覧である一方、語彙には聖所での奉仕という祭儀的含意があるため、後代の教会制度を持ち込まずにその含意を保った。
- issue: עֲבֹדָתוֹの接尾辞が指す対象
  choice: 本文では「そのための」とし、脚注で曖昧さを示す
  alternative: 「垂れ幕に関わるすべての務め」または「これらすべてに関わる奉仕」と特定する
  rationale: 男性単数接尾辞の指示対象は文法上ただ一つに確定しにくいため、特定の解釈に固定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、幕屋の記述にふさわしい端正な文体と祭儀的語感を保った。「彼らが受け持つのは」で一覧を自然に導き、原文にない説明は脚注に限定した。
