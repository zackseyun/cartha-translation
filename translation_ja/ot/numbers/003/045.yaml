reference: Numbers 3:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: ja
  text: レビ人を、イスラエルの子らのすべての長子に代えて、またレビ人の家畜を、イスラエルの子らの家畜に代えて取りなさい。レビ人はわたしのものとなる。わたしはヤハウェである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: 取りなさい
  rationale: לקחの命令形。ここではモーセに、レビ人とその家畜を身代わりとして取り分けるよう命じているため、簡潔な「取りなさい」とした。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: 部族・職分を表す標準的な日本語名称。
- source_word: תַּחַת
  choice: …に代えて
  rationale: 空間的な「下に」ではなく、長子とレビ人を対応させる代替・身代わりの意味。
- source_word: כָּל בְּכוֹר
  choice: すべての長子
  rationale: 単数形の「長子」に付くכָּלの包括的・分配的な意味を自然な日本語で表した。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうちの
  rationale: בの部分を示す意味と、בני ישראלという原文の系譜的表現を保持した。
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: レビ人の家畜
  rationale: בְּהֵמָהはここでは飼育される動物を集合的に指すため「家畜」とした。
- source_word: בְּהֶמְתָּם
  choice: 彼らの家畜
  rationale: 三人称男性複数の接尾辞を明示し、直前のイスラエルの子らを受ける表現とした。
- source_word: וְהָיוּ לִי הַלְוִיִּם
  choice: レビ人はわたしのものとなる
  rationale: 神への帰属を表す所有表現。命令に続く結果・規定として「となる」とした。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の自己宣言として簡潔で荘重な文体を用い、固有名YHWHを音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が明記されているため、称号に置き換えず一般的な学術的音写「ヤハウェ」を本文に採用した。伝統的な「主」は脚注で示した。
- issue: レビ人と長子の関係
  choice: 「…に代えて」として代替関係を明示
  alternative: 「…の代わりに」
  rationale: תַּחַתが表す祭儀的な代替を保持しつつ、その仕組みや贖罪的意味を本文に付加して解釈しすぎないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、命令と神の自己宣言には簡潔で荘重な調子を保った。「イスラエルの子ら」は原文の表現を映すため保持し、「家畜」は自然な集合名詞として用いた。
