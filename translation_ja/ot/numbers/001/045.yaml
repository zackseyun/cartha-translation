id: NUM.1.45
reference: Numbers 1:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: ja
  text: こうして、父祖の家ごとに数えられたイスラエルの子ら[a]、すなわち二十歳以上で、イスラエルにおいて従軍できる者[b]は皆、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。ヘブライ語は「イスラエルの子ら」。この人口調査が男子を軍事目的で数えるものであるため、本文では原文の表現を残した。
    reason: lexical_alternative
  - marker: b
    text: 別訳「軍務に就くことのできる者」。直訳は「軍勢へ出て行く者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: こうして、…は皆、
  rationale: 直前までの部族別集計を受けて総数を提示する継続・総括の働きを、「こうして」で表した。節の統語は次節の人数へ続くため、読点で結んだ。
- source_word: פְּקוּדֵי
  choice: 数えられた
  rationale: 人口調査・軍事的召集の文脈における受動的な結果を、過度に意味を限定せず自然な日本語で示す。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 軍事目的の男子人口調査という文脈で、原文の男性形を保った。一般的な民族名「イスラエル人」より形式上も近い。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: 父系の氏族的編成を示す表現として、現代日本語で理解でき、かつ社会構造を保つ訳とした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 年齢の下限を示す定型句を、簡潔で自然な現代日本語にした。
- source_word: כָּל יֹצֵא צָבָא
  choice: 従軍できる者は皆
  rationale: 字義は「軍勢へ出て行く者すべて」。文脈上の兵役適格性を自然に伝えつつ、「従軍」により軍事的意味を明示した。
- source_word: בְּיִשְׂרָאֵל
  choice: イスラエルにおいて
  rationale: 共同体の内部における資格を表す句として、原文の前置詞を保ちながら自然に訳した。
theological_decisions: []
