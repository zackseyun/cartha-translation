  register: 明瞭で格調のある現代標準日本語。45節はヘブライ語本文でも統語的に46節の総数へ続くため、独立した完全文にせず読点で終えた。「父祖の家」は父系集団を示す聖書的表現として保持し、脚注記号[a][b]は対応箇所に明示した。
