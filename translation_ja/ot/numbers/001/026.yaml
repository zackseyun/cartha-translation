- from: ユダ族の子らについて、その系譜により、氏族により、父祖の家ごとに、名を一人ずつ数え、二十歳以上で、すべて従軍する者[a]は、
  to: ユダ族の子らについて、その系譜により、氏族により、父祖の家ごとに、一人一人の名を数え、二十歳以上で、従軍する者はすべて、
  rationale: 本文の意味を変えずに、日本語の係り受けを整えた。「従軍する者はすべて」により כֹּל の全称を明確にし、「一人一人の名を数え」により名による個別計数を自然に表現した。節末の読点は、次節の人数の提示へ続く原文の構文を反映する。
