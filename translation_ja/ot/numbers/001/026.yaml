base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: ja
  text: ユダ族の子らについて、その系譜により、氏族により、父祖の家ごとに、一人一人の名を数え、二十歳以上で、従軍する者はすべて、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: ユダ族の子らについて
  rationale: 字義的な「ユダの子ら」を保ちつつ、ここではユダ部族に属する子孫を指すことが日本語で分かるよう「ユダ族」とした。前後に続く人口調査の列挙にも自然につながる。
- source_word: תּוֹלְדֹתָם
  choice: その系譜により
  rationale: 世代、家系、系譜記録を指し得る語である。人口調査では血統上の区分を示すため、「世代ごと」より明確で、文書としての記録に限定しない「系譜により」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族により
  rationale: 部族内部のまとまりを指すため、現代日本語の狭い「家族」ではなく「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: 字義は「彼らの父たちの家」。父系の家集団を表す慣用句なので、その社会構造を保ちながら日本語として通じる「父祖の家」とした。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を一人ずつ数え
  rationale: 字義は「名の数によって」。単なる総数ではなく、個々人を名によって数えることを自然な日本語で示した。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 人口調査における年齢の下限を、簡潔で現代的な日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: すべて従軍する者
  rationale: 字義は「軍へ出る者すべて」。本文では能力を表す語を補わず、軍務に出る者というヘブライ語の表現を簡潔に保った。軍役資格者という含意は注で示した。
theological_decisions:
- issue: 軍役人口の性別表現
  choice: すべて従軍する者
  alternative: 従軍できる男子はすべて
  rationale: 文脈上は軍役年齢の男性を数えているが、この句自体には「男子」や「できる」に直接対応する語がないため、本文ではそれらを補わない。男性を対象とすることは「二十歳以上の男子」を規定する1章2節および文脈から明らかであり、原文の簡潔さを保った。
translation_notes:
  register: 現代の一般読者に理解できる格調ある標準語。人口調査の定型的な区分を並行的に保ち、節が次節の人数へ続くことを読点で示した。
