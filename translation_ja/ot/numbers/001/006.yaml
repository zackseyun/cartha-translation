  text: シメオンからは、ツリシャダイの子シェルミエル。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: シメオンからは
  rationale: 前置詞 לְ はこの部族別代表者一覧において所属・割り当てを示す。日本語では「シメオンからは」とすることで、シメオン部族から選ばれた代表者という関係を簡潔かつ自然に表す。
- source_word: שְׁלֻמִיאֵל
  choice: シェルミエル
  rationale: 人名として音写する。ヘブライ語の子音と母音を踏まえつつ、日本語聖書で理解しやすい表記とした。
- source_word: בֶּן
  choice: の子
  rationale: この系譜的な人物特定の定型句では、直接的に「の子」と訳すのが自然である。
- source_word: צוּרִישַׁדָּי
  choice: ツリシャダイ
  rationale: 人名として音写する。語頭の צ を「ツ」で表し、原語の発音形を日本語で可能な範囲で保持した。
