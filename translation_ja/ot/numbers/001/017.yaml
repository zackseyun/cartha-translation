  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: ja
  text: そこでモーセとアロンは、名をもって指名されていたこれらの人々を集めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「取った」。ここでは、任務のために彼らを集めたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 集めた
  rationale: לקח の基本義は「取る」だが、この文脈では、先に名を示された各部族の代表者をモーセとアロンが任務のために集めたことを表す。日本語で「人々を取った」は不自然なため、文脈に即して「集めた」とした。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロン
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: これらの人々を
  rationale: 直前に列挙された特定の男性代表者たちを指す。「指導者たち」とすると本文に明示されない役割を訳文に加えるため避けた。
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: 名を挙げて指名されていた
  rationale: נקב のニファル形と בְּשֵׁמוֹת は、名によって明確に特定・指名されたことを表す。「名を挙げて」によりヘブライ語の表現を保ち、「指名されていた」によりこの行政的文脈での意味を自然に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「そこで」で物語の進行を示し、「名を挙げて指名されていた」は原文の明示的な名による特定を保った。
