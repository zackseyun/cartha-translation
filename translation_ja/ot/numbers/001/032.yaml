base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ja
  text: ヨセフの子孫、すなわちエフライムの子孫については、その系譜ごと、氏族ごと、父祖の家ごとに、名の数に従って、二十歳以上の、戦いに出るすべての者は、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: ヨセフの子孫のうち
  rationale: בניםはここでは部族を構成する子孫を指す。「子ら」より自然な「子孫」とし、前置詞לְは続くエフライム支族を導く見出しとして「のうち」と表した。
- source_word: לִבְנֵי אֶפְרַיִם
  choice: エフライムの子孫について
  rationale: ヨセフ族の中のエフライム系統を特定する行政的な見出しであるため、「子孫について」とした。
- source_word: תּוֹלְדֹתָם
  choice: その系譜ごと
  rationale: 人口調査の文脈では世代そのものより血統・系譜による区分を示すため、「系譜ごと」が明確で自然。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָהは現代の核家族より大きな部族内集団を指すので、「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: 父系の家系集団を指す定型的な親族表現。原文の構造を保ちつつ、日本語で理解しやすい「父祖の家」とした。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を数えられた
  rationale: 個人を名ごとに数え上げる人口調査を表す。直訳的な「名の数によって」より、日本語の文脈で明瞭な受動表現とした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 年齢の下限を示すヘブライ語の定型句を、簡潔で自然な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: すべて戦いに出る者
  rationale: 原文は直訳すれば「軍勢へ出る者／戦いに出る者」。軍務資格を指し得るが、能力を明示する語はないため、それを補わず軍事的慣用句を保った。
theological_decisions:
- issue: 軍事人口調査における性別表現
  choice: すべて戦いに出る者
  alternative: 戦いに出るすべての男子
  rationale: この調査が男性を対象とすることは1:2–3の文脈から明白だが、本節の当該句自体には「男子」に相当する名詞がない。日本語では「者」が文法的に性中立でも指示対象を女性へ拡張するとは限らないため、原文にない語を加えず、文脈に性別の特定を委ねた。
- issue: יֹצֵא צָבָאの軍事的含意
  choice: 戦いに出る者
  alternative: 兵役に就くことのできる者
  rationale: この慣用句は軍務への出動・従軍を表すが、「できる」という能力・適格性を明示する語はない。原文の具体的な軍事イメージと含みを保持した。
translation_notes:
  register: 民数記の人口調査一覧にふさわしい、簡潔で格調ある現代標準日本語。節末は次節の人数へ続く統語構造を反映して読点で終えた。英語資料の脚注標識は本文位置と内容が不整合であり、ヘブライ語本文から独立に判断して、本稿では脚注を設けていない。
