lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 登録された者
  rationale: פקדの数え上げられ、登録された者という受動的な意味を、人口調査の文脈に即して自然な現代日本語で表した。軍事的意味を必要以上に明示しない。
- source_word: לְמַטֵּה
  choice: 部族のうち
  rationale: この人口調査の定型句では部族への所属を示す。日本語では「ゼブルン部族のうち」とすることで、数えられた者がその部族に属することを明瞭に表せる。
- source_word: זְבוּלֻן
  choice: ゼブルン
  rationale: 日本語聖書で広く用いられる標準的な音写を採用した。
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万七千四百人
  rationale: ヘブライ語の合計数57,400を正確に保ち、人を数える日本語として助数詞「人」を添えた。本文の格調と読みやすさを考え、漢数字で表記した。
