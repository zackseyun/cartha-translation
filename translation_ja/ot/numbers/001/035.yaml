  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: ja
  text: マナセ部族の登録者は、三万二千二百人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדの受動分詞は、この人口調査の文脈では登録・集計の対象となった人々を指す。「数えられた者」は受動の意味と調査の文脈を明確に保つ。接尾辞「彼らの」は、日本語では部族を示す句と合わせると不自然に重複するため、文脈上明らかなものとして表面化しなかった。
- source_word: לְמַטֵּה
  choice: 部族から
  rationale: לְとמַטֶּהの組み合わせは、数えられた者の部族上の所属を示す。現代日本語では「部族から」が自然であり、所属集団の中から数えられたことを表せる。
- source_word: מְנַשֶּׁה
  choice: マナセ
  rationale: 日本語聖書で広く定着した固有名表記を用いた。
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 三万二千二百人
  rationale: ヘブライ語の数値を現代日本語の標準的な位取りに直し、正確な人数を示した。人数なので助数詞「人」を補った。
