  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: ja
  text: 幕屋を移動させるとき、レビ人はこれを解体し、宿営地に幕屋を据えるとき、レビ人はこれを建てる。資格のない者[a]が近づくなら、その者は死刑に処せられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「部外者」「よそ者」。ヘブライ語はここで、聖所に近づくことを許されていない者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: 出発するときには
  rationale: 前置詞 בְּ と不定詞連語 נסע は時を表す節を作る。ここでは幕屋が宿営地から移動を始める場面なので、「出発するとき」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 移動可能な聖所を指す定着した聖書用語であり、文脈上の祭儀的意味を明確に伝える。
- source_word: יוֹרִידוּ אֹתוֹ
  choice: これを取り外し
  rationale: ירד のヒフィル形は、この文脈では移動のために幕屋を解体することを指す。「取り外す」は実際の作業を自然に表しつつ、語義を過度に限定しない。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: 聖所を扱う権限を与えられた集団を指す標準的な訳語。
- source_word: וּבַחֲנֹת
  choice: 宿営するときには
  rationale: חנה は「宿営する」を意味する。原文では幕屋が主語として扱われ、出発との対照が作られているため、その表現を保った。
- source_word: יָקִימוּ אֹתוֹ
  choice: これを組み立てる
  rationale: קום のヒフィル形は、ここでは幕屋を立てることを指す。「組み立てる」は解体時の「取り外す」と対応し、移動式聖所の設営を明瞭に表す。
- source_word: וְהַזָּר
  choice: 権限のない者
  rationale: זָר はこの祭儀的文脈で、民族的な外国人ではなく、聖所の務めに近づく資格・権限を持たない者を指す。「権限のない者」はその機能的意味を明示する。
- source_word: הַקָּרֵב
  choice: 近づくなら
  rationale: קרב の分詞は、聖所またはその務めに近づく行為を表す。日本語では警告の条件を自然に示すため「近づくなら」とした。
- source_word: יוּמָת
  choice: 死刑に処せられる
  rationale: מות のホファル形は、単に死ぬことではなく、死を科される受動的・使役的意味を持つ。「死刑に処せられる」は法的制裁を表し、執行主体は特定しない。
theological_decisions:
- issue: יוּמָת が示す死の性質
  choice: 法的・受動的な刑罰として「死刑に処せられる」
  alternative: 結果の予告として「死ぬ」
  rationale: ホファル形は通常、死が科されることを表す。執行者が人間か神かは本文が明示しないため、その点は限定しない。
- issue: זָר の指示対象
  choice: 聖所の務めに近づく権限のない者
  alternative: 民族的な外国人、または例外なくすべての非レビ人
  rationale: 幕屋に関する祭司的文脈では、זָר は民族よりも祭儀上の資格の外にいることを示す。訳文と注でその意味を保ちつつ、範囲を不必要に狭めない。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調ある叙述とした。「幕屋」「レビ人」は定着した聖書用語を用い、文末は規定・警告にふさわしい表現にした。原文が幕屋を出発・宿営の主語として扱う構文も保持した。
