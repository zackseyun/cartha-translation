source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: ja
  text: ガドの子ら[a]について、その系譜に従い、氏族[b]ごと、父祖の家ごとに、名の数によって、二十歳以上の、戦いに出る者すべて[c]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「ガドの子ら」。ここでは人口調査の対象となるガド族の男子を指す。
    reason: cultural_note
  - marker: b
    text: または「家族」。ここでは部族内の血縁集団を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「軍勢に出る者はすべて」。または「軍務に出る者はすべて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: ガドの子らについて
  rationale: 前置詞לְは人口調査における部族別の見出しを導く。「子ら」というヘブライ語の表現を保ちつつ、ここではガド族に属する男子を指すことを脚注で明確にした。
- source_word: תּוֹלְדֹתָם
  choice: その系譜に従い
  rationale: 血統・出自による分類を表す語であり、文書化された「系図」と断定せず、人口調査の定型表現として自然に訳した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 部族内部の血縁集団を指すため、現代の核家族を連想しやすい「家族」より「氏族」が適切である。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: 父系の家系・世帯集団を表す人口調査上の用語であり、その社会構造を保持した。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を数えた
  rationale: 個々人を名前によって数え上げることを意味する。日本語では動詞表現にすることで、原文の機能を明瞭にした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 人口調査の年齢基準を、原文の意味に即した簡潔で自然な現代日本語で示した。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 軍務に就く者はすべて
  rationale: 直訳的には「軍勢に出る者すべて」。資格・該当者を数える文脈に合わせ、能力の有無を過度に補わず、軍務の対象者を示す表現とした。
