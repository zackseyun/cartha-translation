  rationale: 個人名に続く連語形であり、ここでは通常の父子関係を表すため「子」とした。
- source_word: עַמִּינָדָב
  choice: アミナダブ
  rationale: ヘブライ語の人名を、原音に配慮した日本語表記で音写した。
