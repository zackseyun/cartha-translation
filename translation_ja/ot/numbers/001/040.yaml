base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ja
  text: アシェルの子らについては、その系譜ごと、氏族ごと、父祖の家ごとに、名の数に従って、二十歳以上で戦いに出る者[a]はすべて、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「軍務へ出る者」。軍務のために招集される者を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: アシェルの子らについて
  rationale: 部族別の人口調査の見出しとしての לְ を「について」とし、בְּנֵי の親族・部族表現を保った。
- source_word: תּוֹלְדֹתָם
  choice: その系譜ごと
  rationale: この文脈では出生の記録そのものより、血統・系譜による区分を指すため、現代日本語として明瞭な「系譜」を用いた。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָה は部族内部の親族集団を表すため、広すぎる「家族」ではなく「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: 古代イスラエルの父系的な家集団という原文の社会的表現を、自然さを保ちながら訳した。
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: 名を数えられた
  rationale: 個々人を名によって数える人口調査の意味を簡潔な日本語で表した。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上の
  rationale: 年齢の下限を示す定型句を自然で正確な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 兵役に出る者はみな
  rationale: 字義的には「軍勢へ出る者すべて」であり、軍務に就く対象者を指す慣用表現として訳した。原文にない能力の概念は加えていない。
