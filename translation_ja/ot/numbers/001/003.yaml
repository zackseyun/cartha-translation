base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: ja
  text: 二十歳以上で、イスラエルにおいて戦いに出る男子[a]をすべて、あなたとアロンがその部隊ごとに[b]数えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「軍務に就くことのできる男子」。ヘブライ語の表現は、軍務の資格がある者を指す軍事的な慣用句。
    reason: lexical_alternative
  - marker: b
    text: または「軍団ごとに」「軍の編成単位ごとに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 兵役登録の下限年齢を示すヘブライ語の慣用表現を、簡潔で自然な現代日本語にした。
- source_word: כָּל יֹצֵא צָבָא
  choice: 戦いに出る男子をすべて
  rationale: 直訳的な「戦いに出る」という軍事表現を保ちつつ、この章で数えられる対象が男子であることを明示した。軍務に適する者という慣用的意味は注に示した。
- source_word: בְּיִשְׂרָאֵל
  choice: イスラエルにおいて
  rationale: 民の共同体の中で、という範囲を自然に示す。
- source_word: תִּפְקְדוּ אֹתָם
  choice: 数えなさい
  rationale: この人口調査の文脈では、登録のために数えることを指す。命令として明瞭な表現を選んだ。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: 軍務のための編成単位に従って数える意味を、古風にならない軍事語で表した。
- source_word: אַתָּה וְאַהֲרֹן
  choice: あなたとアロンが
  rationale: 数える任務を与えられた二人を明示する原文の強調を保った。
theological_decisions:
- issue: 軍務対象者を示す性別表現
  choice: 戦いに出る男子
  alternative: 戦いに出る者
  rationale: 当該章の人口調査は男子を対象としており、男性形もこの文脈では一般的な総称ではなく実際の対象を示すため、「男子」と明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。軍事的な具体性を残しながら、過度に古風な「軍勢」「万軍」などは避けた。
