source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: ja
  text: これらの人々は、会衆から召し出された者たち[a]であり、彼らの父祖の部族の指導者、イスラエルの諸千人隊の長たち[b]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「会衆に属する、召された者たち」または「会衆から招集された者たち」。ヘブライ語の分詞は、呼ばれた者、招集された者、指名された者を意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「千人隊」は、文字どおり千人から成る集団を指す場合も、イスラエルにおける氏族的または軍事的な編成単位を広く指す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: これらの人々
  rationale: 複数指示詞を、直前までに名を挙げられた人々を指す自然な日本語として表した。
- source_word: קריאי הָעֵדָה
  choice: 会衆から召し出された者たち
  rationale: קרא の受動分詞が持つ「呼ばれた／召集された／指名された」という幅を保ちつつ、文脈上、共同体の中から公的役割へ召された人々であることを自然に示した。構文は「会衆に属する召された者たち」とも取り得るため脚注を付した。
- source_word: נְשִׂיאֵי
  choice: 指導者
  rationale: 部族を代表する高位の者を指す語であり、現代日本語で明瞭かつ尊厳ある「指導者」とした。
- source_word: מַטּוֹת אֲבוֹתָם
  choice: 父祖以来の部族
  rationale: 父系の祖先に結び付く部族を意味する。日本語で不自然な逐語訳を避けながら、父祖との連続性を保持した。
- source_word: רָאשֵׁי
  choice: 長たち
  rationale: 身体の「頭」から転じた首長・責任者の意味を、日本語の役職表現として自然な「長」で表した。
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: イスラエルの諸千人隊
  rationale: אֶלֶף の基本義「千」と、氏族的または軍事的な編成単位であり得る含みを残すため、「諸千人隊」とし、意味の幅を脚注で明示した。
- source_word: הֵם
  choice: であった
  rationale: 節末の独立代名詞による同定・強調は、日本語では文全体を結ぶ述語として表した。
