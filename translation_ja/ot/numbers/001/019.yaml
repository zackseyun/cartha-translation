  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַֽ/יִּפְקְדֵ֖/ם בְּ/מִדְבַּ֥ר סִינָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: ja
  text: ヤハウェがモーセに命じたとおり、モーセはシナイの荒野で彼らを数えた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らを召集して登録した」「彼らの人数を調べた」とも訳せる。ヘブライ語の動詞は、人口調査のために人々を登録し、数えることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 〜したとおり
  rationale: 神の命令とモーセの行動が一致していることを、自然な現代日本語で示す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 基本義である「命じる」を簡潔に訳す。日本語では物語上の先行を過去完了形で明示しなくても文脈から理解できる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写する。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: אֶת は「命じる」の直接目的語を標示するが、日本語では命令を受ける相手を助詞「に」で表すのが自然である。
- source_word: וַיִּפְקְדֵם
  choice: モーセは彼らを数えた
  rationale: この人口調査の文脈では、פקד は人々を登録して数えることを指す。動詞の主語は文脈上モーセなので、曖昧さを避けるため名を補った。語の幅は脚注に残す。
- source_word: בְּמִדְבַּר סִינָי
  choice: シナイの荒野で
  rationale: ヘブライ語の連語関係と地理的表現を保ちつつ、自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文の固有名を称号へ置換せず音写し、契約の神名であることを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令への厳密な従順を「命じたとおり」で示し、人口調査という文脈に即して「数えた」を本文に採用した。
