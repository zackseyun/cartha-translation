- source_word: פְּקֻדֵיהֶם
  choice: 登録された者
  rationale: פקדに由来する語で、この人口調査において数えられ、名簿に載せられた者を指す。「登録された者」は、原文の受動的な意味を保ちつつ、現代日本語として自然である。
