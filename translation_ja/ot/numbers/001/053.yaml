  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: ja
  text: しかし、レビ人はあかしの幕屋の周囲に宿営しなければならない。そうすれば、怒りがイスラエルの子らの会衆に及ぶことはない。レビ人は、あかしの幕屋を守る務めを果たさなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: しかし、レビ人は
  rationale: 接続詞は、直前に述べられた他部族の配置とレビ人の特別な配置との対比を示すため、現代日本語では「しかし」とした。
- source_word: יַחֲנוּ סָבִיב
  choice: 周囲に宿営しなければならない
  rationale: 未完了形の指示・義務の力を「しなければならない」で表し、סָבִיב の空間的意味を「周囲に」とした。
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: あかしの幕屋
  rationale: מִשְׁכָּן は聖所としての「幕屋」、עֵדוּת は契約に関わる「あかし」を指す。対象を契約文書に限定せず、聖書用語として分かりやすい表現を採った。
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: 御怒りが下ることのないため
  rationale: 文脈上、聖なる境界が侵された際の神の裁きとしての怒りを指す。「御怒り」で神的主体を自然に示し、「下る」で עַל と災厄的な発現を日本語らしく表した。
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの会衆の上に
  rationale: עֵדָה を共同体的な「会衆」、בְּנֵי יִשְׂרָאֵל を原文の親族表現を保って「イスラエルの子ら」とした。עַל は「上に」として、怒りが及ぶ方向を保持した。
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: 守る務めを果たさなければならない
  rationale: שׁמר と מִשְׁמֶרֶת の語根上の結びつきを「守る務め」で反映しつつ、委ねられた責務を遂行する意味を「果たす」で自然に表現した。
theological_decisions:
- issue: קֶצֶף の性質
  choice: 聖所の秩序が守られない場合に共同体へ下る神の御怒り・裁き
  alternative: 一般的な怒り、または人間の憤り
  rationale: 幕屋の周囲をレビ人が守るという祭儀的文脈では、聖なる領域への侵犯による神の裁きが念頭にある。ただし、裁きの具体的形態は本文にないため補わなかった。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の父祖イスラエルとの親族的つながりを保つため「子ら」とした。ここでは共同体全体を指す表現だが、本文で性別や範囲を説明的に言い換えなかった。
translation_notes:
  register: 明瞭で格調ある現代標準語。「宿営」「幕屋」「会衆」「御怒り」は民数記の祭儀的・共同体的文脈を保つ用語として採用した。二つの指示を「しなければならない」でそろえ、規定としての力を明確にした。
