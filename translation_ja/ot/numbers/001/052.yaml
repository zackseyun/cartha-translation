  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: ja
  text: イスラエルの子らは、それぞれ自分の宿営のそばに、自分の旗印のもとに、その部隊ごとに宿営しなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: 宿営しなければならない
  rationale: 接続詞を伴う完了形は、この規定の文脈では将来の行動を指示する用法。単なる未来ではなく命令・規定としての力を自然な現代日本語で示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の「イスラエルの息子たち」という表現を保ちつつ、系譜的・共同体的呼称として格調ある日本語にした。「イスラエル人」も可能だが、形式上の対応が薄れる。
- source_word: אִישׁ ... וְאִישׁ
  choice: それぞれ自分の……自分の
  rationale: 反復された単数形の分配的意味を、日本語で不自然な重複を避けながら保持した。各人が割り当てに従うことを表す。
- source_word: עַל מַחֲנֵהוּ
  choice: 自分の宿営に
  rationale: עַל はここでは位置または所属を表す。「自分の宿営に」として、各人が属する宿営への配置を明確にした。
- source_word: דִּגְלוֹ
  choice: 自分の旗印のもとに
  rationale: דֶּגֶל は部族・軍団を示す旗または標識。「旗印」は象徴と集合地点の両方を自然に表し、「のもとに」によって配置関係を示した。
- source_word: לְצִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָא の軍事的に編成された集団という意味を保持しつつ、直ちに戦闘中の軍隊を連想させすぎない表現とした。לְ は編成・区分に従う意味として訳した。
