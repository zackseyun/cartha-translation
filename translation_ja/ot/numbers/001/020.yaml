  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: ja
  text: イスラエルの長子ルベンの子らについては、彼らの系譜に従い、氏族ごと、父祖の家ごとに、名の数に従って、一人ずつ[a]、二十歳以上のすべての男子、すなわち戦いに出る者は、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「彼らの頭（頭蓋骨）ごとに」。一人ひとりを個別に数えることを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: ルベンの子らは…数えられた
  rationale: וַיִּהְיוּ は後続する人口調査の定型句全体を導く。日本語では名詞句だけにせず、文脈上補われる受動表現「数えられた」で自然な文として表した。
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: イスラエルの長子
  rationale: ルベンを同格的に説明する句。「初子」よりも、現代日本語で身分と出生順位を明瞭に示す「長子」とした。
- source_word: תּוֹלְדֹתָם
  choice: その系譜
  rationale: 人口調査・系図の文脈で、世代ごとの血統・出自の区分を示す。「代々」より意味が明瞭な「系譜」を採用した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族
  rationale: 部族内の親族集団を指し、続く「父祖の家」と区別できる語として「氏族」を用いた。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家
  rationale: 父系の家族・家系単位を示す人口調査上の定型表現を、簡潔かつ歴史的背景の見える形で訳した。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を数え
  rationale: 個々人を名によって数え上げることを示す。直訳的な「名の数によって」より自然な日本語にした。
- source_word: לְגֻלְגְּלֹתָם
  choice: 一人ずつ
  rationale: 字義は「彼らの頭蓋骨ごとに」だが、各人を個別に数える慣用句。日本語では意味を明瞭に伝える「一人ずつ」とした。
- source_word: כָּל זָכָר
  choice: 男子
  rationale: 性別を指定する語であり、年齢条件が続くため、簡潔で自然な「男子」とした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上
  rationale: 字義的な「二十歳から上」を、現代日本語の年齢条件として自然に表した。
- source_word: כֹּל יֹצֵא צָבָא
  choice: すべて軍務に出る者
  rationale: 分詞 יֹצֵא の「出る」という表現を保ちつつ、צָבָא をこの人口調査の軍事的文脈に即して「軍務」とした。「出ることのできる」と能力を明示する解釈は加えなかった。
