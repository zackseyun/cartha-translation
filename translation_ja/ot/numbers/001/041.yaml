  text: Those counted from the tribe of Asher were forty-one thousand five hundred.
translation:
  language: ja
  text: アシェル部族に属する、数えられた者は、四万一千五百人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדに由来する語で、この人口調査において登録され、数に入れられた者たちを指す。本文自体にない「男子」をここで補わず、文脈上の人口調査の意味を自然な日本語で表した。
- source_word: לְמַטֵּה אָשֵׁר
  choice: アシェル部族で
  rationale: לְמַטֵּהはこの定型句で所属する部族を示す。「アシェル部族で」は、集計対象の所属を簡潔で自然に表す。固有名は慣用的な音写「アシェル」とした。
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万一千五百人
  rationale: ヘブライ語の数値を正確に保ち、現代日本語の通常の数詞順に整えた。人数であることが文脈上明白なので助数表現「人」を用いた。
