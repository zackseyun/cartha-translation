lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: しかし、レビ人は
  rationale: 接続詞 וְ は、直前までに数えられた諸部族とレビ人との対照を示すため、文脈上「しかし」と訳した。
- source_word: לְמַטֵּה אֲבֹתָם
  choice: 父祖の部族ごとには
  rationale: מַטֶּה はここでは「部族」、אֲבֹתָם は父系の祖先・系譜を指す。「父祖の部族」は原文の表現を保ち、「ごとには」によって人口調査の区分としての意味と対照を示した。
- source_word: לֹא הָתְפָּקְדוּ
  choice: 数えられなかった
  rationale: פקד のヒトパエル形は、この人口調査の文脈では名簿に登録して数えることを表す。本文では明瞭な現代日本語として「数えられなかった」とした。
- source_word: בְּתוֹכָם
  choice: 彼らの中に
  rationale: בְּתוֹךְ の基本的な空間・包含の意味を保ち、先に数えられたイスラエルの諸部族の中に含まれなかったことを表した。
