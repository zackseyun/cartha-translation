  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: ja
  text: しかし、レビ人は父祖の部族に従っては、彼らの中に数えられなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
