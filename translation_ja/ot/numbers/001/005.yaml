    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: 名は次のとおりである
  rationale: 名簿を提示するヘブライ語の定型表現を、現代日本語で自然かつ格調を保って表した。接続詞 וְ は文脈上の連続性を担うが、日本語では明示しない方が自然である。
- source_word: הָאֲנָשִׁים
  choice: 者たち
  rationale: ここでは人口調査を補佐する特定の男性代表者を指す。日本語の「者たち」は文脈上その人物群を明確に示し、過度に性別を反復せず自然である。
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: あなたがたと共に立つ
  rationale: עמד の基本的な「立つ」を保ちつつ、モーセとアロンに同行・協力する代表者という行政的含意も文脈から読める訳とした。二人称複数も「あなたがた」で保持した。
- source_word: לִרְאוּבֵן
  choice: ルベン族から
  rationale: 前置詞 לְ は部族への所属またはその部族の代表であることを示し得る。本文では日本語として自然な出身・所属表現を採り、別解を脚注に示した。
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: シェデウルの子エリツル
  rationale: ヘブライ語の父称表現を日本語で一般的な「父名の子・本人名」の順にした。固有名は原語音に基づき転写した。
