  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: ja
  text: そして、あなたがたと共に立つ男たちの名は次のとおりである。ルベンのためには[a]、シェデウルの子エリツル。
  philosophy: optimal-equivalence
  footnotes:
