review_pass:
  verdict: revise
  source_fidelity: יִהְיוּ is a future/directive specification that the appointed representatives are to be with Moses and Aaron; 「出なければならない」 adds an explicit obligation and 「出る」 can suggest coming forward or being dispatched, neither of which is stated. The distributive sense of אִישׁ אִישׁ לַמַּטֶּה and the representative's status as head of his father's house are otherwise retained.
  naturalness: 「各部族から一人ずつの者が加わる」 is clear modern standard Japanese and naturally expresses their presence alongside 「あなたがた」. 「父祖の家の長」 is readily intelligible while preserving the institutional phrase.
  terminology: 「部族」 appropriately renders מַטֶּה in this context. 「父祖の家」 preserves בֵּית אֲבֹתָיו; 「長」 naturally renders רֹאשׁ without importing a specific modern office. The explanatory note should be anchored to 「父祖の家」 rather than placed after the entire verse.
  issues:
  - severity: medium
    issue: 「出なければならない」
    rationale: This wording makes the statement an explicit necessity/command and introduces the idea of ‘going out.’ The Hebrew says that one man from each tribe ‘shall be with’ the addressees.
  - severity: low
    issue: Footnote placement and wording
    rationale: The note concerns 「父祖の家」 but its marker follows the full sentence. Its proposed ‘alternative’ repeats a larger clause and retains the overly strong 「でなければならない」.
