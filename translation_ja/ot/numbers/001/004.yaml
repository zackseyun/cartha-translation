  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: ja
  text: あなたがたと共に、各部族から一人ずつの者が加わる。その者は、自分の父祖の家[a]の長である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父祖の家」は、父系で結ばれた家族または氏族の集団を指す。別訳「父祖の家のかしら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתְּכֶם
  choice: あなたがたと共に
  rationale: モーセとアロンに同行して務めを担う者たちを示す前置詞句として、原文に近く自然な表現とした。
- source_word: יִהְיוּ
  choice: 出なければならない
  rationale: 文脈上、単なる未来ではなく、人口調査に加わる者を指定する指示的な未完了形であるため、その規定性を明示した。
- source_word: אִישׁ אִישׁ לַמַּטֶּה
  choice: 各部族から一人ずつ
  rationale: אִישׁ の反復が表す配分の意味、すなわち各部族につき一人の代表者という意味を、自然な現代日本語で示した。
- source_word: מַטֶּה
  choice: 部族
  rationale: 民数記の人口調査と編成の文脈では、物としての「杖」ではなくイスラエルの部族単位を指す。
- source_word: אִישׁ רֹאשׁ
  choice: その者はそれぞれ、…かしら
  rationale: 代表者一人一人が各父祖の家の指導者であることを示す同格表現を、日本語で明瞭に再構成した。
- source_word: בֵית אֲבֹתָיו
  choice: 自分の父祖の家
  rationale: 父系の家族・氏族集団を指す定型句であり、「父祖の家」はその社会構造を保ちつつ日本語の聖書文体でも理解可能である。
- source_word: הוּא
  choice: その者は
  rationale: 独立代名詞の再提示・強調の働きを、日本語では主題を改めて立てる「その者は」によって表した。
