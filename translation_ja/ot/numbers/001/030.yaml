  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ja
  text: ゼブルンの子らについては、その系譜により、氏族ごと、父祖の家ごとに、名の数に従って、二十歳以上の、戦いに出る者[a]をすべて。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兵役に就く者」。ヘブライ語では直訳すると「戦いに出る者」。
    reason: 軍事的慣用句の文脈上の意味を示しつつ、字義的説明を原語に即して訂正するため。
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: ゼブルンの子らについて
  rationale: לְ は部族別の人口調査の項目を導き、「子ら」は部族の子孫を指す。反復される行政的な表現を保ちつつ、現代日本語として理解できる形にした。
- source_word: תּוֹלְדֹתָם
  choice: その系譜
  rationale: 出生・血統による区分を表す語であり、この人口調査の文脈では「系譜」が簡潔かつ適切である。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族
  rationale: 部族内の親族集団を指すため、範囲の広い「家族」より「氏族」が適切である。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家
  rationale: 父系の家系集団を指す定型的な親族用語として、原文の構造を保った。
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: 名を数え
  rationale: 個々の名に基づいて人数を数えることを表す。直訳調の「名の数に従って」より自然な日本語にした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 年齢の下限を示す定型句を、簡潔で明確な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 戦いに出る者をすべて
  rationale: 軍勢として出陣する者というヘブライ語の軍事的表現を直接保った。文脈上は成人男性の軍役対象者を指すが、原文に明示されない「男」や能力を表す語を本文には補わなかった。
theological_decisions:
- issue: 軍事人口調査における性別と適格性
  choice: 戦いに出る者をすべて
  alternative: 兵役に就くことのできる男子をすべて
  rationale: 文脈上は軍役に適する成人男性が対象だが、כֹּל יֹצֵא צָבָא 自体には「男子」や「できる」に直接対応する語がない。そこで本文では原文の表現を保ち、機能的な意味は脚注で示した。
translation_notes:
  register: 民数記の反復的・行政的な人口調査文体を保ちながら、明瞭な現代標準日本語とした。次節の人数提示へ続く構文なので、文末は「数えると、」として継続を示した。
