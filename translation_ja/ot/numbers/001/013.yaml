- source_word: לְ/אָשֵׁר
  choice: アシェルからは
  rationale: 前置詞 לְ はこの部族別の名簿において所属・代表元を示す。日本語では列挙の流れを明確にする「アシェルからは」が自然である。
- source_word: פַּגְעִיאֵל
  choice: パグイエル
  rationale: ヘブライ語の人名を、現代日本語の聖書で理解しやすい慣用的な表記に音写した。
- source_word: בֶּן
  choice: の子
  rationale: 父子関係を示す標準的な系譜表現であり、日本語では簡潔で自然な「の子」とした。
- source_word: עָכְרָן
  choice: オクラン
  rationale: ヘブライ語の人名を日本語の慣用的な聖書表記に音写した。語頭の ע は日本語では独立した子音として表しにくいため、慣用に従った。
