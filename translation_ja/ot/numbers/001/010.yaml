  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: ja
  text: ヨセフの子らでは、エフライムにはアミフドの子エリシャマ、マナセにはペダツルの子ガマリエル。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: ヨセフの子らからは
  rationale: לְ はこの名簿で各部族から選ばれる代表者を示すため、日本語では「から」とした。בְנֵי יוֹסֵף は直訳的な「ヨセフの子ら」を保ち、続くエフライムとマナセがその二系統であることを示す。
- source_word: לְאֶפְרַיִם
  choice: エフライムから
  rationale: 名簿上の所属と選出元を簡潔に示すため「から」とした。「エフライム族」は文脈上明らかな語を補う意訳となるため本文では避けた。
- source_word: אֱלִישָׁמָע
  choice: エリシャマ
  rationale: ヘブライ語人名を、日本語聖書で理解しやすい慣用的な音写で表した。
- source_word: בֶּן
  choice: ～の子
  rationale: 父子関係を表すヘブライ語の連語を、自然な日本語の系譜表現で訳した。
- source_word: עַמִּיהוּד
  choice: アミフド
  rationale: ヘブライ語人名の音写。
- source_word: לִמְנַשֶּׁה
  choice: マナセから
  rationale: エフライムとの並行を保ち、所属・選出元を示す「から」とした。
- source_word: גַּמְלִיאֵל
  choice: ガマリエル
  rationale: ヘブライ語人名を、日本語で定着した形に音写した。
- source_word: פְּדָהצוּר
  choice: ペダツル
  rationale: 語中の צוּר の子音と母音を反映して音写した。
