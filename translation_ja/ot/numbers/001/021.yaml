lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדに由来する形で、この人口調査において登録され、数えられた者たちを指す。文脈上、兵役に就くことのできる男子であることは直前の規定から明らかなため、ここでは簡潔に「数えられた者」とした。
- source_word: לְמַטֵּה
  choice: 部族で
  rationale: 前置詞לְとמַטֶּהの組み合わせは、この定型句では部族への所属・区分を示す。自然な現代日本語の集計表現として「部族で」とした。
- source_word: רְאוּבֵן
  choice: ルベン
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 四万六千五百人
  rationale: 原文の総数46,500を現代日本語の標準的な数詞順で表し、人数であることを「人」で明示した。
