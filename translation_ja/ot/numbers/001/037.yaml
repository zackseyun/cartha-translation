  text: ベニヤミン部族のうち、数えられた者は三万五千四百人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדに由来する語で、この人口調査において数えられた者たちを指す。文脈上は兵役に就くことのできる男子だが、この節の語そのものに「男子」を加えず、原文の表現を保った。
- source_word: לְמַטֵּה
  choice: 部族のうち
  rationale: לְとמַטֶּהの組み合わせは、この定型句で部族への所属を示す。「部族のうち」は自然な日本語で、集計対象がその部族に属することを明確にする。
- source_word: בִנְיָמִן
  choice: ベニヤミン
  rationale: 日本語聖書で広く定着している固有名表記を用いた。
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 三万五千四百人
  rationale: ヘブライ語の数値35,400を現代日本語の標準的な数詞順で表し、人数であることを助数詞「人」で自然に示した。
