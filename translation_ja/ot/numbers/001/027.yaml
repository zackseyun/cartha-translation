  rationale: 日本語聖書で定着している部族名の表記。
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 七万四千六百人
  rationale: ヘブライ語の数詞を現代日本語の標準的な数の表し方に直した。人数であることを自然に示すため助数詞「人」を用いた。
