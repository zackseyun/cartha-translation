  language: ja
  text: そこで、登録された者は全部で六十万三千五百五十人であった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「数えられた者」または「召集名簿に載せられた者」。ヘブライ語は、人口調査で数えられ、登録された人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: そこで、…であった
  rationale: 物語を進めつつ人口調査の結果を総括する形を、自然な現代日本語で表した。
- source_word: כָּל
  choice: 全部で
  rationale: 総数を示す文脈に合わせ、包括的な意味を明瞭に表した。
- source_word: הַפְּקֻדִים
  choice: 登録された者
  rationale: פקדの受動分詞として、人口調査で数えられ登録された人々を指す。本文だけにはない「男子」を補わず、文脈上の軍務適齢男子という範囲も狭めずに保った。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 六十万三千五百五十人
  rationale: ヘブライ語の加算的な数詞表現を、日本語で通常用いられる自然な数の言い方にした。人数であることを明確にするため助数詞「人」を用いた。
