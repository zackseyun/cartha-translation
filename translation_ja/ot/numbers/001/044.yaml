source:
  edition: WLC
  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: ja
  text: 以上が、モーセとアロン、およびイスラエルの指導者たち、すなわち父祖の家[b]ごとに一人ずついた十二人が数えた、数えられた者たち[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「登録された者たち」とも訳せる。ここでのヘブライ語は、人口調査で数に入れられた人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 「父祖の家」は、イスラエルの部族制度における父系の一族または氏族の単位を指す。
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: 数えた者たち
  rationale: 人口調査の文脈にあるפקדの受動分詞であり、数えられ、登録された人々を指す。日本語では「数えた者たち」として人への言及を明確にした。
- source_word: פָּקַד
  choice: 数えた
  rationale: 民数記1章では人口調査のために人数を調べることを表す。「数えた」は現代日本語で明快であり、直前の分詞との語義上の対応も保つ。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: イスラエルの指導者たち
  rationale: ここでは各部族を率いる者を指す。「君主」や「族長」よりも、王族との誤解を避けつつ役割を自然に示せる。
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: 十二人
  rationale: 文脈上は男性十二人を指すが、日本語の「人」は性別を消去する表現ではなく、人数を数える自然な助数表現である。直前の男性の指導者たちを受けているため指示対象も明確である。
- source_word: אִישׁ אֶחָד
  choice: 一人ずつ
  rationale: 各父祖の家につき一人という配分的な意味を、簡潔で自然な日本語にした。
- source_word: לְבֵית אֲבֹתָיו
  choice: 父祖の家ごとに
  rationale: 父系の祖先に基づく家族・氏族単位を表す慣用句。「父祖の家」を保ち、前置詞לְの代表・対応関係を「ごとに」で自然に表した。
- source_word: הָיוּ
  choice: であった
  rationale: 十二人の指導者が各父祖の家に一人ずつ対応していたことを示す連結動詞を、独立した叙述として明示した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、「父祖の家」という文化的に重要な表現を保持した。原文後半の語順を日本語として自然な二文に分け、十二人の指導者が各父祖の家に一人ずつ対応する構造を明確にした。
