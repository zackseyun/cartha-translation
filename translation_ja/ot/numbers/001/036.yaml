base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ja
  text: ベニヤミンの子らについては、その系譜に従い、氏族ごと、父祖の家ごとに、名の数に従って、二十歳以上で、すべて戦に出る者[a]は、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「戦に出る者」は、軍務に就く資格のある者を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: ベニヤミンの子らについて
  rationale: לִבְנֵי は人口調査における部族別の見出しを導く。原文の父系的な表現を保ちつつ、日本語で一覧の項目として自然になるよう「について」とした。
- source_word: תּוֹלְדֹתָם
  choice: その家系により
  rationale: この人口調査の文脈では、世代そのものよりも系譜・血統による区分を表すため、「家系」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 部族の下位にある親族集団を指し、後続する「父祖の家」と区別するため「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: イスラエルの父系的な親族・家組織を表す定型句なので、その構造を明示する「父祖の家」を用いた。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を数えられた
  rationale: 個々人を名によって数え上げることを示す。日本語として不自然な「名の数に従って」を避けながら、原意を保った。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上の者
  rationale: 人口調査の年齢下限を示す定型表現を、簡潔で明瞭な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: すべて戦に出る者
  rationale: 原文の軍事的な慣用句をできるだけ直接に訳し、兵役資格を指す文脈上の意味は脚注で示した。
