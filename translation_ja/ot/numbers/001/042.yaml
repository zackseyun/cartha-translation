  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ja
  text: ナフタリの子ら、その系図により、氏族ごと、父祖の家ごとに、名の数に従って、二十歳以上の、軍務に就くことのできる者[a]は皆、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「戦いに出る者」または「軍勢に加わる者」。ここでは軍務に就く資格のある者を指す。
    reason: 軍役を表すヘブライ語の慣用句について、字義と文脈上の意味を示すため。
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: ナフタリの子ら
  rationale: 「子ら」という系譜的表現を保ち、この人口調査の対象であるナフタリ部族の男子を指す文脈にも適合させた。
- source_word: תּוֹלְדֹתָם
  choice: その系図に従い
  rationale: 家系・血統による登録区分を表す語であり、現代日本語で理解しやすい「系図」を用いた。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 現代の核家族ではなく、部族内の親族集団を指すため「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: 父系の家系集団を表すイスラエルの定型的な親族表現を、簡潔かつ明示的に訳した。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を一人ずつ数えた
  rationale: 個々人を名によって数え上げたことを自然な日本語で表した。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 人口調査における年齢の下限を、簡潔で自然な現代日本語で示した。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 軍務に就く者は皆
  rationale: 字義は「軍勢へ出る者／戦いに出る者」。ここでは軍役の対象者を数える慣用句であるため、その機能を明確にした。
theological_decisions:
- issue: כֹּל יֹצֵא צָבָא が能力、資格、または実際の出征のどれを強調するか
  choice: 本文では「軍務に就く者」とし、軍役対象者という人口調査上の意味を示す
  alternative: 「戦いに出る者」「軍勢に加わる者」
  rationale: ヘブライ語の軍事的意味を失わず、単に現に出征中の者だけを指すとの誤解を避ける。字義的な別訳は脚注に残した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文と同じく次節の人数提示へ続く未完の構文なので、末尾を読点とした。
