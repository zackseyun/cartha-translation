  language: ja
  text: ベニヤミンからは、ギデオニの子アビダン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: ベニヤミンからは
  rationale: 前置詞 לְ はこの名簿で各部族の代表者を導入している。「ベニヤミンからは」とすることで、簡潔な列挙の形を保ちながら、代表者がその部族から選ばれていることを自然な現代日本語で示す。「ベニヤミン族からは」は明確だが、原文にない「族」を補うため採らなかった。
- source_word: אֲבִידָן
  choice: アビダン
  rationale: ヘブライ語の人名を、日本語で一般的な聖書固有名詞の表記に従って音写した。
- source_word: בֶּן
  choice: 子
  rationale: 親子関係を示す連語であり、名簿にふさわしい簡潔な「～の子」と訳した。
- source_word: גִּדְעֹנִי
  choice: ギデオニ
  rationale: ヘブライ語の人名を、日本語で一般的な聖書固有名詞の表記に従って音写した。
