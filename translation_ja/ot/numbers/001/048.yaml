  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセに次のように語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の神名「YHWH」。一般に「主」と訳されてきた。古代における正確な発音は確定していない。
    reason: 本文の「ヤハウェ」がヘブライ語の四文字神名の音写であること、伝統的な代替表現、および発音の不確かさを示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: そこで、…告げて言われた
  rationale: 物語を進めるワウ継続法と דבר の発話の意味を、自然な現代日本語で表した。後続する לֵאמֹר との重なりも、定型的な導入句として保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名 YHWH を一般的な日本語表記で音写した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞 אֶל を、日本語で自然な格助詞「に」によって表した。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する直接話法を導く不定詞 לֵאמֹר を反映した。日本語としてぎこちない「言って」を避けつつ、ヘブライ語の定型句を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、神名であることを明示する音写を本文に採用した。母音の厳密な復元には不確かさがあるため、脚注でその点と伝統的訳語を示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「そこで」で直前の記述からの物語的進行を示し、「告げて言われた」によって וַיְדַבֵּר…לֵאמֹר の定型性を保った。脚注記号は神名「ヤハウェ」に関するものだが、日本語本文の流れを妨げないよう文末に置いた。
