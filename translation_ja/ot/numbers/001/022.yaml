  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: ja
  text: シメオンの子らについては、その系譜に従い、氏族ごと、父祖の家ごとに、名を挙げて一人ずつ[b]数えられた登録者[a]、すなわち二十歳以上で戦いに出る[c]すべての男子は、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「召集された者」とも訳せる。ヘブライ語の פקד には、この軍事的背景を持つ人口調査において、数えて登録する意味と召集する意味の両方の含みがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「頭蓋骨ごと」または「頭ごと」。一人一人を個別に数えることを表す慣用句。
    reason: cultural_note
  - marker: c
    text: 「軍務に就く者」とも訳せる。ヘブライ語の直訳は「軍勢へ出て行く者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: シメオンの子孫について
  rationale: בניはこの部族別人口調査の文脈では、祖先シメオンに属する男子の子孫、すなわち部族員を指す。「息子たち」より自然で、指示範囲も明確な「子孫」とした。
- source_word: תּוֹלְדֹתָם
  choice: その系図に従い
  rationale: 人口調査・系譜の文脈におけるתולדותは、世代そのものよりも血統・系譜上の記録を表すため、「系図」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: משפחהは部族の内部にある親族集団を指す。「家族」では規模が小さく聞こえるため、「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: בית אבותというイスラエルの社会的・系譜的単位を保ちつつ、現代日本語で理解できる表現とした。
- source_word: פְּקֻדָיו
  choice: 登録された者
  rationale: פקדの受動的な人口調査の意味を表す。軍事的な召集の含みもあり得るため、脚注で「召集された者」を示した。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を挙げて
  rationale: 個々の名に基づいて数えたことを、自然な日本語で簡潔に表した。
- source_word: לְגֻלְגְּלֹתָם
  choice: 一人ずつ
  rationale: 字義的には「彼らの頭蓋骨ごと／頭ごと」だが、個人単位の数え上げを意味する慣用句なので、本文では「一人ずつ」とした。
- source_word: כָּל זָכָר
  choice: 男子全員
  rationale: זכרは成人を意味する語ではなく性別を明示するため、「男子」とし、כלを「全員」で表した。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上
  rationale: 年齢の下限を示す定型句を、簡潔で自然な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 従軍する者
  rationale: 字義的には「軍勢へ出て行く者」。軍務の対象者を指すが、能力・適格性を明示する語は原文にないため、「従軍できる」とは断定しなかった。
