  text: from Gad[a], Eliasaph son of Deuel;
translation:
  language: ja
  text: ガド族からは、デウエル[a]の子エルヤサフ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: いくつかの写本および並行箇所では、この名を「レウエル」とする（民数記2章14節参照）。
    reason: textual_variant
lexical_decisions:
- source_word: לְ/גָד
  choice: ガド族からは
  rationale: 前置詞 לְ はこの人口調査の指導者一覧で部族への所属・代表関係を示す。日本語では「ガド族からは」とすることで、その部族から選ばれた人物であることを自然かつ明確に表せる。
- source_word: אֶלְיָסָף
  choice: エルヤサフ
  rationale: ヘブライ語の人名を、日本語で一般的な聖書固有名詞の音写に従って表記した。
- source_word: בֶּן
  choice: ～の子
  rationale: 系譜・父称を示す標準的なヘブライ語表現であり、日本語でも簡潔に「～の子」とした。
- source_word: דְּעוּאֵל
  choice: デウエル
  rationale: この節のWLC本文 דְּעוּאֵל を直接音写した。民数記2章14節などの「レウエル」という異読・別形は脚注で保持する。
theological_decisions: []
translation_notes:
  register: 簡潔な名簿形式を保ちつつ、現代日本語として自然な「ガド族からは」を用いた。文末は一覧の一項目であることが伝わる体言止めとし、固有名詞は明瞭で格調を損なわない標準的な音写とした。
