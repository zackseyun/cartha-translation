id: NUM.1.50
reference: Numbers 1:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: ja
  text: しかし、あなたはレビ人を、証しの幕屋[a]とそのすべての用具、またそれに属するすべてのものの管理に当たらせなさい。彼らは幕屋とそのすべての用具を運び、幕屋に仕え[b]、幕屋の周りに宿営しなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕屋」に当たるヘブライ語は、字義的には「住まい、住む所」を意味する。別訳「証しの住まい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「それに奉仕する」「それに仕える」または「その世話をする」。ここでの動詞は、聖所にかかわる奉仕を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: しかし、あなたは
  rationale: 前節までの他部族との対比を示す接続の働きを「しかし」で表し、強調された二人称代名詞も明示した。
- source_word: הַפְקֵד ... עַל
  choice: …の管理に当たらせなさい
  rationale: פקד のヒフィル命令形と עַל の組み合わせが示す、責任を委ねて担当させる意味を、現代日本語として自然に表した。単なる任命や人数の確認とはしなかった。
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: 証しの幕屋
  rationale: מִשְׁכָּן の移動式聖所としての専門的意味を「幕屋」で、הָעֵדֻת を解釈的に言い換えず「証し」で保った。
- source_word: כֵּלָיו
  choice: そのすべての用具
  rationale: 幕屋に属する祭儀上の器具・備品を広く含められる、明快で過度に限定しない語を選んだ。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: それに属するすべてのもの
  rationale: 幕屋に付属・帰属するもの全体を指す広い表現を、そのまま自然な日本語にした。
- source_word: יִשְׂאוּ
  choice: 運び
  rationale: 移動時に幕屋と用具を担いで運搬する具体的な任務を明瞭に表した。
- source_word: יְשָׁרְתֻהוּ
  choice: そこで奉仕し
  rationale: שרת のピエル形が聖所での奉仕を表すことを「奉仕」で示し、目的語接尾辞は日本語で不自然にならないよう場所との関係として表現した。別の取り方は脚注に残した。
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: 幕屋の周りに宿営しなければならない
  rationale: 周囲に陣を敷く位置関係と、指示文脈における未完了形の義務的・命令的効力を明示した。
theological_decisions:
- issue: מִשְׁכָּן の祭儀用語
  choice: 幕屋
  alternative: 住まい
  rationale: この文脈では携行可能な聖所を指すため、現代日本語の聖書用語として理解される「幕屋」を採用した。一方、語の基本的な「住まい」という含意は脚注で示した。
- issue: הָעֵדֻת の指示内容
  choice: 証し
  alternative: 契約の証し／契約の板
  rationale: 何を指すかを本文で限定せず、ヘブライ語の構造と曖昧さを保った。
- issue: שרת の聖所奉仕の含意
  choice: 奉仕する
  alternative: 仕える／世話をする
  rationale: 祭儀的な奉仕の含意を示しつつ、後代の特定の聖職制度を本文に持ち込まない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖所に関する文脈にふさわしい品位を保った。「管理に当たらせなさい」で任務委任を自然に示し、「宿営しなければならない」で指示の拘束力を表した。
