  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: ja
  text: ただし、レビ族については数えてはならない。また、イスラエルの子らの中に含めて、彼らの人数を数えてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: ただし、…だけは
  rationale: 直前までの人口調査の命令からレビ族を例外として除く限定・例外の力を、自然な日本語で明確に示す。
- source_word: מַטֵּה לֵוִי
  choice: レビ族
  rationale: מַטֶּה はこの人口調査の文脈では「杖」ではなく部族を指す。日本語では「レビ族」が簡潔で定着した表現。
- source_word: תִפְקֹד
  choice: 数えてはならない
  rationale: פקד はここで人口調査として数えることを表す。専門的な「召集する」より、文脈に即して明瞭。
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: 彼らの人数を数えてはならない
  rationale: 字義的には「彼らの頭を上げる」だが、人口調査で総数を取る慣用句。日本語では「人数を数える」とするのが自然で正確。
- source_word: בְּתוֹךְ
  choice: …の中で
  rationale: より大きな集団に含めて数えることを示すため、「イスラエルの子らの中で」と訳す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の男性複数形を保ちつつ、契約共同体を指す定型的呼称として現代日本語でも理解できる形にした。
theological_decisions:
- issue: 契約共同体の呼称 בְּנֵי יִשְׂרָאֵל の性を含む表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の「子ら」という形を保持し、単に中性的な民族名へ置き換えない。一方、この文脈では共同体全体を指す定型表現であるという含みは損なわない。
translation_notes:
  register: 明瞭な現代標準日本語。命令の反復を原文どおり保ち、「ただし、…だけは」でレビ族が人口調査から除外される例外性を示した。
