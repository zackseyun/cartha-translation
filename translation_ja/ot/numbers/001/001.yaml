  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: ja
  text: イスラエルの人々がエジプトの地を出てから二年目の第二の月の一日に、ヤハウェはシナイの荒野で、会見の天幕[a]においてモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「会見の天幕」は、伝統的に「幕屋」とも訳される。
    reason: 本文の字義的訳語を重複して説明せず、伝統的な訳語を補足するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 神の発話を導入する物語上の定型表現。文末の לֵאמֹר と合わせ、日本語では「こう告げた」とすることで、自然さを保ちながら後続する発言を明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語表記で示した。
- source_word: בְּמִדְבַּר סִינַי
  choice: シナイの荒野にある
  rationale: מִדְבָּר は、人里を離れた未開の土地を指すため「荒野」とした。また、語順を日本語として自然に整え、「会見の天幕」を修飾させた。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: אֹהֶל を「天幕」、מוֹעֵד をこの施設名に即して「会見」とし、伝統的な「幕屋」だけでは見えにくい原語の構成を示した。
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: 第二の月、その一日に
  rationale: ヘブライ語の暦日表現を、意味が明瞭な現代日本語にした。
- source_word: בַּשָּׁנָה הַשֵּׁנִית לְצֵאתָם
  choice: イスラエルの人々が…出て二年目
  rationale: 接尾辞「彼ら」が指す集団を日本語で明示し、出エジプトを基準とする年代表現として自然に訳した。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地を
  rationale: 原文にある אֶרֶץ「地」を省かず保持した。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後続する直接話法を導く機能を、日本語の発話導入表現「こう告げた」に組み込んだ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を用いていることを明示し、称号への置換や別系統の慣用的音写を避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。ヘブライ語の長い時間・場所表現は、日本語で理解しやすい順序に整えた。敬語によって原文以上の解釈を加えないよう、「仰せになった」ではなく「告げた」とした。
