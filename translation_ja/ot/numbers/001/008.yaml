lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: イッサカルからは
  rationale: 前置詞 לְ は、この部族代表者の一覧では所属・対応関係を示す。日本語では、各部族から選ばれる代表者を自然に導入する「イッサカルからは」とした。
- source_word: נְתַנְאֵל
  choice: ネタンエル
  rationale: 人名なので語義を訳さず、ヘブライ語の発音に即して音写した。
- source_word: בֶּן
  choice: ～の子
  rationale: ここでは人物の父を示す通常の系譜的用法であり、「子」とするのが自然である。
- source_word: צוּעָר
  choice: ツアル
  rationale: 人名なので語義を訳さず、ヘブライ語の子音 צ を「ツ」で表して音写した。
