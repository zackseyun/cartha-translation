id: NUM.1.54
reference: Numbers 1:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: ja
  text: イスラエルの子ら[a]は、ヤハウェがモーセに命じたことをすべて、そのとおりに行った。彼らはそのとおりに行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」または「イスラエルの民」。ヘブライ語の直訳は「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 行った
  rationale: עשהの広い意味を文脈に即して「行った」とし、命令を実行したことを自然な日本語で表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの表現を保ち、イスラエルに属する民を指すヘブライ語の定型句として訳した。日本語では男女を含む集団名としても読めるが、別訳を脚注に示した。
- source_word: כְּכֹל אֲשֶׁר
  choice: ことをすべて、そのとおりに
  rationale: 命じられた内容の全体と、それへの完全な適合の両方を表すため、「すべて」と「そのとおりに」を用いた。
- source_word: צִוָּה
  choice: 命じた
  rationale: 神の先行する命令を示す完了形。日本語では時間関係が文脈上明瞭なため、自然な過去形とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語表記で音写した。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: צוהが人を直接目的語に取るヘブライ語構文を、日本語で自然な「モーセに命じた」とした。
- source_word: כֵּן עָשׂוּ
  choice: 彼らはそのとおりに行った
  rationale: 命令との一致を強調するכֵּןと、עשהの反復を省かず、原文の強調された結びを保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として音写した。
- issue: בְּנֵי יִשְׂרָאֵל の集団表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の「子ら」という形を本文に残しつつ、この定型句が共同体全体を指し得ることを脚注で明示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、簡潔で荘重な叙述調とした。末尾の反復は日本語ではやや強く響くが、イスラエルが命令どおりに従ったことを強調する原文の文体として保持した。
