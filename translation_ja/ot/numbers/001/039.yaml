lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדに由来するこの語は、人口調査で登録・集計された者たちを指す。文脈上、対象が男子であることはすでに示されているため、ここでは原文にない語を補わず「数えられた者」とした。
- source_word: לְמַטֵּה דָן
  choice: ダン族から
  rationale: この人口調査の定型表現では、לְמַטֵּהが部族への所属を示す。現代日本語として自然な「ダン族から」とした。
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 六万二千七百人
  rationale: ヘブライ語の数詞の配列を、現代日本語の通常の数え方に置き換えた。人数であることを明確にするため助数詞「人」を用いた。
