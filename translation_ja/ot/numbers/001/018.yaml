base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: ja
  text: 彼らは第二の月の一日に全会衆を招集した。そして、氏族ごと、父祖の家ごとに、二十歳以上の者を名の数に従って一人ずつ[b]、自分たちの系譜を申告して登録した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの系譜を申告して登録した」は、「自分の家系を申告した」「系譜に基づいて登録した」とも訳せる。原語は、出自に基づく登録を表す稀な系譜上の表現。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「頭ごと」または「頭蓋骨ごと」。一人一人を個別に数えたことを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: 招集した
  rationale: 使役形の「集める、会集させる」を、共同体を公式に集める文脈に即して自然な日本語で表した。
- source_word: כָּל הָעֵדָה
  choice: 全会衆
  rationale: イスラエルの共同体全体を指す語であり、民数記での共同体的・公的な響きを保つ。
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: 第二の月の一日に
  rationale: 直訳的には「第二の月の一に」だが、ヘブライ語の標準的な暦表現として明瞭に訳した。
- source_word: וַיִּתְיַלְדוּ
  choice: 自らの系譜を登録した
  rationale: この稀な再帰形は、出自・血統に基づいて自らを届け出ることを表す。再帰性と人口調査における登録行為の双方を示した。
- source_word: עַל מִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 人口調査における親族集団の単位を表すため、「家族」より範囲の広い「氏族」とした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: イスラエルの父系的な親族組織を示す定型表現の形を保った。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を挙げて
  rationale: 名前に基づいて個々人を数える意味を、簡潔で自然な日本語にした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上の者
  rationale: 年齢の下限を示す定型句を、現代日本語で明確に表した。
- source_word: לְגֻלְגְּלֹתָם
  choice: 一人ずつ
  rationale: 字義は「頭蓋骨ごと／頭ごと」だが、各人を個別に数える慣用句として本文では意味を明瞭にし、原語の具体的表現は注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調ある現代標準語を用いた。「会衆」「氏族」「父祖の家」は民数記の組織的・公的な人口調査の語感を保つ。英語参照訳では注記号の位置と注の内容が対応していなかったため、日本語本文では[a]を系譜登録、[b]を一人ずつ数える表現の直後に置いた。
