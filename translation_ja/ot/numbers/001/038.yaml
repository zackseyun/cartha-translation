base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ja
  text: ダンの子らについて、その系譜に従い、氏族ごと、父祖の家ごとに、名の数に従って、二十歳以上で、戦いに出ることのできる男子はみな[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「軍務に就くことのできる男子はみな」。ヘブライ語の慣用表現は、直訳すると「軍勢に出る者はみな」。
    reason: 原文の具体的な軍事表現と、その文脈上の機能的意味の両方を示すため。
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: ダンの子らについて
  rationale: ל は人口調査における部族の見出しを示す。「子ら」は原文の男性形と反復される定型を保ち、ここでは軍務年齢の男性部族員を指す。
- source_word: תּוֹלְדֹתָם
  choice: その系譜に従い
  rationale: この文脈では単なる子孫ではなく、血統・系譜に基づく登録区分を表す。現代日本語で明瞭な「系譜」を用いた。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: イスラエルの部族組織における מִשְׁפָּחָה を「氏族」とし、続く「父祖の家」と区別した。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: 父系の親族単位を示す定型的表現であるため、その歴史的社会構造を保つ「父祖の家」とした。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を一人ずつ数えると
  rationale: 個々の名に基づく人数の算定を自然な日本語で表した。後続節が次節の人数へ続く構文であることも明確にする。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 人口調査の年齢基準を簡潔で現代的な日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 戦いに出ることのできる男子はみな
  rationale: 軍務に就く対象者を表す慣用句。直訳的な「軍勢に出る」より明瞭にしつつ、「戦いに出る」という原文の具体的表現を保った。男性への限定は、男性形と人口調査の文脈から明示した。
theological_decisions:
- issue: 軍事人口調査における性別表現
  choice: 戦いに出ることのできる男子はみな
  alternative: 軍務に就くことのできる者はみな
  rationale: 原文は男性形を用い、二十歳以上の軍務対象男性を数える文脈であるため、性別を中性化せず「男子」と明示した。一方、軍務適格性を表す解釈的な言い換えは脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。部族人口調査の定型的な反復を保ちながら、日本語として理解しやすい語順に整えた。文末の読点は、人数を示す次節へ構文が続くことを表す。
