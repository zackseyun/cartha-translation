- source_word: בֶּן
  choice: の子
  rationale: 父子関係を示す連語であり、日本語の系譜・人物同定表現として自然な「の子」とした。
- source_word: עַמִּישַׁדָּי
  choice: アミシャダイ
  rationale: ヘブライ語の人名を、日本語聖書で一般的な形に従って音写した。
