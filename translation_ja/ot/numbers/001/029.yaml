lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדに由来する語で、人口調査において登録され、数に入れられた者たちを指す。文脈上自然な日本語としつつ、この節自体には明示されない「男子」を補わない。
- source_word: לְמַטֵּה
  choice: 部族で
  rationale: この人口調査の定型句では、数えられた者の部族所属を示す。日本語では「イッサカル部族で数えられた者」とすることで自然に所属関係を表す。
- source_word: יִשָּׂשכָר
  choice: イッサカル
  rationale: 固有名を現代日本語で一般的な聖書表記に従って音写した。
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 五万四千四百人
  rationale: ヘブライ語の数詞が示す正確な人数を、現代日本語の標準的な数の語順で表した。人の総数なので助数表現「人」を添えた。
