source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ja
  text: イッサカルの子らについて、その系譜に従い、氏族ごと、父祖の家ごとに、二十歳以上で戦いに出る男子[a]を皆、一人一人、名を挙げて数えると、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「戦いに出る者すべて」。ヘブライ語の表現は字義的には「軍に出る者すべて」で、ここでは軍務に適する男子を指す。
    reason: 語句の字義的な訳と、人口調査の文脈における機能的意味の両方を示すため。
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: イッサカルの子らについて
  rationale: 前置詞לְは、この人口調査の定型句において部族別の項目を導く。「子ら」はבְּנֵיの系譜的かつ男性を指す表現を保ちつつ、ここではイッサカル部族の男性成員を意味する。
- source_word: תּוֹלְדֹתָם
  choice: その系譜に従い
  rationale: תּוֹלְדוֹתはここで世代ごとの血統・系統を指す。「系譜」は単なる年代区分よりも人口調査における系統分類を自然に表すが、文書化された名簿そのものに限定しない。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָהは部族内部の親族集団を表すため、現代日本語の狭い意味での「家族」より「氏族」が適切である。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: イスラエルの父系的な親族・家単位を示す定型表現。歴史的社会構造を保ち、「先祖の家」より原文のאָבוֹתの男性的要素を明示する。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 一人一人名を挙げて数えると
  rationale: 直訳的な「名の数によって」は日本語では不自然なため、名のある個々人を数えたという人口調査の意味を自然に表した。節全体が動詞を省略した名詞的構文なので、次節へ続く「数えると」で日本語の文を整えた。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上で
  rationale: 二十歳を下限として含む年齢条件を、簡潔で自然な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 戦いに出る男子を皆
  rationale: 字義的には「軍勢へ出る者すべて」。人口調査の文脈では軍務年齢の男性を指すため「男子」とし、צָבָאの軍事的意味を「戦いに出る」で表した。能力・適格性を明示する解釈は脚注で示す。
theological_decisions:
- issue: 人口調査の対象者を示す性別表現
  choice: 戦いに出る男子
  alternative: 戦いに出る者すべて
  rationale: 文法上の男性形と、父系の部族成員のうち軍務年齢にある男性を数える文脈を反映した。性別を中和せず、同時に「男子」が軍務対象者を指すことを明確にした。
- issue: יֹצֵא צָבָאに能力・適格性を含めるか
  choice: 本文では「戦いに出る」とし、軍務適格者という含意を脚注で説明
  alternative: 兵役に就くことのできる男子
  rationale: 原文の分詞は字義的には実際に「出る」者を表す一方、人口調査では軍務に適する者を分類する機能がある。本文で一方に確定しすぎず、語義と文脈的含意の両方を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文が次節の人数へ続く動詞省略の構文であることを踏まえ、読点と「数えると、」によって継続性を保った。「氏族」「父祖の家」は古代イスラエルの社会単位を区別して訳した。
