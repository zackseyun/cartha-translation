  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: ja
  text: イスラエルの子ら[b]の全会衆を、氏族ごと、父祖の家ごとに、名の数に従って、すべての男子を一人ずつ[c]数え上げなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「頭を上げよ」。ここでは、人口を数えて登録することを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエル人」とも訳せる。直訳は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「頭蓋骨ごと」または「頭ごと」。一人一人を個別に数えることを表すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: 人口調査を行いなさい
  rationale: 字義どおりには「頭を上げよ」だが、この行政的文脈では人口を数えて登録することを命じる慣用句である。現代日本語でその意味を明確かつ簡潔に示した。
- source_word: כָּל עֲדַת
  choice: 全会衆
  rationale: עֵדָה はイスラエルの共同体全体を指す。「全会衆」はその集合的・公的な性格を保つ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の父系的な表現を保持しつつ、現代日本語として理解できる形にした。一般的な意味は「イスラエル人」であるため脚注で補った。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: ここでの מִשְׁפָּחָה は部族内の血縁集団を指すため、現代語の「家族」より「氏族」が適切である。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: 父系の系譜によって構成される家・集団を表す。「父祖の家」は原文の社会構造を保ちながら日本語として明瞭である。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: 名を数え
  rationale: 名簿上の名によって人数を数えるという行政的表現を、過度に説明せず自然な日本語で表した。
- source_word: כָּל זָכָר
  choice: すべての男子
  rationale: זָכָר は性を明示する語であるため、年齢を限定しない文脈で日本語として自然な「男子」とした。
- source_word: לְגֻלְגְּלֹתָם
  choice: 一人ずつ
  rationale: 字義は「彼らの頭蓋骨ごと／頭ごと」で、各人を個別に数える慣用表現である。本文では自然な意味を示し、具体的な原語表現を脚注に残した。
