  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: ja
  text: マナセの子らは、その系譜に従い、氏族ごと、父祖の家ごとに、名の数によって、二十歳以上の、戦に出る男子はみな[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「軍勢に出る者はみな」。このヘブライ語表現は、この人口調査の文脈では軍務に就く資格のある者を指す。
    reason: 原文表現の直訳と、人口調査の文脈での意味範囲を示すため。
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: マナセの子らについて
  rationale: 前置詞לְは、この人口調査の定型句で部族別の項目を導入する。「子ら」は系譜上の子孫を表す聖書的用法として理解でき、原文のבניםを保っている。
- source_word: תּוֹלְדֹתָם
  choice: その系譜に従い
  rationale: ここでは出生の出来事ではなく、血統・系譜による区分を指す。現代日本語で意味が明確になるよう「系譜」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָהは部族内部の親族集団を指すため、現代の核家族を連想しやすい「家族」より「氏族」が適切である。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: イスラエルの父系的な親族単位を示す定型表現を、簡潔かつ格調ある日本語で保持した。
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: その名を数えられた
  rationale: 個々人を名によって数え上げる人口調査の表現。「名の数によって」という不自然な逐語訳を避けつつ、名に基づく集計という内容を保った。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上の者
  rationale: 年齢の下限を表すヘブライ語の慣用句を、明瞭な現代日本語にした。
- source_word: כֹּל יֹצֵא צָבָא
  choice: 兵役に出る男子はみな
  rationale: צָבָאはこの文脈では軍務・軍勢を指す。人口調査が二十歳以上の男性を対象とすることを明示しつつ、「出る」という原文の動きを残した。
theological_decisions:
- issue: 人口調査対象の性別
  choice: 兵役に出る男子はみな
  alternative: 兵役に出る者はみな
  rationale: この箇所は二十歳以上のイスラエル人男性を対象とする軍事人口調査であり、文脈上の男性限定を中性化せず明示した。
- issue: יֹצֵא צָבָאが実際の出征か兵役資格か
  choice: 本文では「兵役に出る」とし、資格を含む文脈上の意味を脚注で説明する
  alternative: 兵役に就くことのできる者
  rationale: 分詞表現の具体的な像を本文に残し、単に実際の出征者だけを指すのではなく軍務に就く資格のある者を数える表現であることを脚注で補った。
translation_notes:
  register: 民数記1章の反復的な人口調査文体を保ち、次節の人数につながる未完の列挙として読点で結んだ。語調は現代標準日本語を基本としつつ、「父祖の家」など古代イスラエルの社会構造を示す用語には適度な荘重さを残した。
