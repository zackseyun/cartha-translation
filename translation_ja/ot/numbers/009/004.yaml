  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/עֲשֹׂ֥ת הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/004.yaml
  text: So Moses told the sons of Israel to keep the Passover.
translation:
  language: ja
  text: そこでモーセは、イスラエルの人々に過越の祭りを行うよう告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの子ら」だが、共同体を指す自然な現代日本語として訳した。
- source_word: לַעֲשֹׂת
  choice: ささげる
  rationale: 一般には「行う／する」だが、過越については祭儀を執行すること、特に過越のいけにえをささげることを指す文脈なので、自然かつ具体的に表した。
- source_word: הַפָּסַח
  choice: 過越のいけにえ
  rationale: ここでは祭り全般というより、定められた時に執行する過越の祭儀・いけにえを指すため、このように訳した。
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 「語った」の意。命令内容をイスラエル共同体に伝達したことが明確になる、簡潔で自然な表現を採った。
theological_decisions: []
