  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: ja
  text: 二日間であれ、一か月であれ、あるいはさらに長い期間であれ、雲が幕屋の上にとどまり、その上に宿っている間、イスラエルの人々は宿営して出発しなかった。しかし、雲が上ると、彼らは出発した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: …であれ、…であれ、あるいは…であれ
  rationale: 反復される選言を保ち、期間の幅を示す自然で格調ある日本語とした。
- source_word: יֹמַיִם
  choice: 二日
  rationale: 双数形が明示する日数を正確に訳した。
- source_word: חֹדֶשׁ
  choice: 一か月
  rationale: 期間の列挙に合う不定の一か月を表した。
- source_word: יָמִים
  choice: 長い日々
  rationale: 字義的な「日々」を残しつつ、先行する「二日」「一か月」との対比から長期間を指す文脈的意味を示した。
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: 雲が…とどまり
  rationale: 雲の滞在が長引くことを、文脈に即して明瞭に表した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 荒野の移動式聖所を表す、定着した明瞭な訳語を用いた。
- source_word: לִשְׁכֹּן עָלָיו
  choice: そこに宿っている
  rationale: שכן の継続的で落ち着いた臨在を表し、「幕屋」との語根上の響きも日本語で可能な範囲で保った。
- source_word: יַחֲנוּ
  choice: 宿営したまま
  rationale: 反復的状況において、宿営を続ける意味を自然に表した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原語の親族表現を保ちながら、現代日本語で理解できる形にした。
- source_word: וְלֹא יִסָּעוּ
  choice: 旅立たなかった
  rationale: 宿営地を離れて行程を始める נסע の意味を簡潔に表した。
- source_word: וּבְהֵעָלֹתוֹ
  choice: しかし、雲が上がると
  rationale: 接尾辞の指示対象を「雲」と明示し、宿営との対照を自然に示した。
theological_decisions: []
