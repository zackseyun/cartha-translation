id: NUM.9.15
reference: Numbers 9:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: ja
  text: 幕屋が建てられた日、雲が幕屋、すなわち証しの天幕[a]を覆った。夕方には、雲は朝まで幕屋の上にあり、火のように見えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証し」は、幕屋に納められた契約の証しを指す。「証言」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הָקִים
  choice: 幕屋が建てられた日
  rationale: 定冠詞を伴う不定詞構文の時を表す働きを、自然な日本語の受動節で表した。語頭の接続詞は文脈との連続性を示すが、独立した「さて」などを補わなくても日本語で十分伝わる。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 荒野を移動したイスラエルの聖所を指す定着した訳語であり、「天幕」と区別することで同節の אֹהֶל も訳し分けられる。
- source_word: כִּסָּה הֶעָנָן
  choice: 雲が…覆った
  rationale: כסה の基本的な空間像をそのまま保ち、定冠詞付きの「雲」は文脈上知られている雲として訳した。
- source_word: לְאֹהֶל הָעֵדֻת
  choice: すなわち証しの天幕
  rationale: 前の「幕屋」を同格的に説明する句と理解した。עֵדוּת は契約にかかわる証しを指す祭儀的用語として「証し」とし、אֹהֶל は「天幕」と訳した。
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: 夕方には、雲は…あり
  rationale: 未完了形はこの場面で続く状態または習慣的な状況を表す。日本語では時の提示と状態表現によって自然に示した。また、指示対象を明確にするため主語を「雲」とした。
- source_word: עַל הַמִּשְׁכָּן
  choice: 幕屋の上に
  rationale: על の位置関係を、過度に接触を含意しない自然な表現で示した。
- source_word: כְּמַרְאֵה אֵשׁ
  choice: 火のように見えた
  rationale: 火そのものだと断定せず、外観についての比較であることを明確に保った。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 時間的な終点を簡潔で自然な現代日本語で表した。
theological_decisions:
- issue: 「幕屋」と「証しの天幕」の関係
  choice: 後者を前者の同格的説明として訳す
  alternative: לְ の方向・場所の含みを強く取り、「証しの天幕のところで」のように訳す
  rationale: この構文では、別の場所や物を示すよりも、「証しの天幕」が「幕屋」をさらに特定していると読むのが最も自然である。ただし原文の前置詞の特異さを踏まえ、解釈を必要以上に展開しなかった。
- issue: 夜の雲と火との関係
  choice: 雲が火のように見えたとする
  alternative: 雲が火になった、または火そのものが幕屋の上にあったとする
  rationale: כְּמַרְאֵה は外観の比較を示すため、同一性や実体の変化を断定しない訳とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「幕屋」「証し」は民数記の祭儀的文脈に定着した語として保持し、文全体は一般読者にも追いやすい語順に整えた。
