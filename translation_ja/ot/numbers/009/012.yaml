source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: ja
  text: それを朝まで少しも残してはならない。その骨を一本も折ってはならない[a][b]。過越の祭りに関するすべての定めに従って、過越の祭りを守らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その中で骨を折ってはならない」。単数の「骨」は、どの骨も折ってはならないという意味。
    reason: lexical_alternative
  - marker: b
    text: 骨を折らないという規定については、出エジプト記12章46節参照。
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: それを朝まで少しも残してはならない
  rationale: יַשְׁאִירוּは「残す」、מִמֶּנּוּは部分を示すため、否定文の中で「少しも」を補い、何一つ残してはならないという意味を自然な日本語で表した。עַד בֹּקֶרの時間的限界は「朝まで」とした。
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: その骨を一本も折ってはならない
  rationale: 単数のעֶצֶםはここでは配分的に用いられ、どの骨も折らないことを指す。בוֹはこの文脈で対象との関係を示すため、「その骨」と自然に表現した。
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: 過越の祭りに関するすべての定めに従って
  rationale: חֻקָּהは規定された「定め」を意味する。単数形にכָּלが付くことで、過越に関する規定全体を指すため、「すべての定め」とした。הַפֶּסַחは供え物だけに限定せず、儀礼・食事を含む広い意味を保つため「過越の祭り」とした。
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: それを行わなければならない
  rationale: 祭儀についてのעשהは「執り行う、守り行う」の意味を持つ。前文の過越の祭りを受ける代名詞を保ちつつ、現代日本語として自然な「それを行う」とした。
theological_decisions:
- issue: 骨を折らない規定が持つ後代の聖書内的関連
  choice: 本文では過越の祭りの規定として直接的に訳し、後代のキリスト論的解釈を訳文に加えない。
  alternative: 新約聖書における成就との関連が前面に出るような表現を本文に用いる。
  rationale: この節の直接の文脈は過越を行う際の規定である。後代の聖書本文との響き合いは認められるが、ヘブライ語本文が明示しない神学的解釈を訳文そのものに織り込むべきではない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、律法上の命令にふさわしい端正さを保った。「〜してはならない」「〜なければならない」により、ヘブライ語の命令的な未完了形の力を明確に表した。英語相談層では脚注[a]の位置と内容に不整合が見られるため、原文上の論点である骨の句に脚注記号を置いた。
