source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: ja
  text: 時には、雲が夕方から朝までとどまることもあった。朝、雲が上がると[a]、彼らは出発した。あるいは、雲が一日一夜とどまることもあった。雲が上がると、彼らは出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「雲が引き上げられると」。ヘブライ語の動詞は、雲が上方へ移ることを表し、ここではイスラエルが出発する合図となっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: また、…こともあった
  rationale: 前節までに述べられた行動様式の中の一例を導く慣用表現として、偶発的・反復的な場合を自然な日本語で示す。
- source_word: יִהְיֶה הֶעָנָן
  choice: 雲が…とどまる
  rationale: היה は字義的には「ある」だが、時間の範囲を伴うここでは、雲がその場に継続してあることを表す。
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: 夕方から朝まで
  rationale: 始点と終点を明確に示す自然で直接的な時間表現。
- source_word: וְנַעֲלָה הֶעָנָן
  choice: 雲が上がると
  rationale: עלה のニファル形を自然に表し、幕屋の上から雲が上がることが出発の合図となる文脈に合う。「引き上げられる」とも訳せるが、原文は行為主体を明示しない。
- source_word: בַּבֹּקֶר
  choice: 朝になって
  rationale: 時間を表す前置詞句を、出来事の順序が明瞭になる自然な日本語にした。
- source_word: וְנָסָעוּ
  choice: 彼らは出発した
  rationale: 荒野の旅の文脈で、宿営地を離れて進み始めることを簡潔に表す。
- source_word: אוֹ
  choice: …こともあり
  rationale: もう一つの事例を提示する接続を、日本語として滑らかに表現した。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼も夜も
  rationale: 原文の副詞的表現を直接反映しつつ、昼から夜にわたり雲がとどまる継続性を文脈によって示す。「一昼夜」と限定しすぎない。
theological_decisions:
- issue: 雲が上がる際の行為主体
  choice: 雲が上がる
  alternative: 雲が引き上げられる
  rationale: ニファル形には受動的な理解の余地があるが、行為主体は原文に明示されないため、日本語本文でもそれを補わず、雲の移動そのものを表した。
translation_notes:
  register: 現代の一般読者に明快な、簡潔で品位のある叙述。前後の反復的な行動規定に合うよう「こともあった」を用い、原文の時間表現と、雲が上がれば出発するという対応関係を保った。
