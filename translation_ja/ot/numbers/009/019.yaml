id: NUM.9.19
reference: Numbers 9:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: ja
  text: 雲が幕屋の上に長い間とどまると、イスラエルの子ら[a]はヤハウェの命じられた務め[b]を守り、旅立たなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。直訳は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: または「ヤハウェの定め」「ヤハウェの命令」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: 雲が……長い間とどまると
  rationale: ב＋不定詞構文を時の節として訳し、אָרַךְが示す継続した滞在を自然な現代日本語で表した。
- source_word: עַל הַמִּשְׁכָּן
  choice: 幕屋の上に
  rationale: 荒野における聖所を指す מִשְׁכָּן は、定着した聖書用語「幕屋」とし、עַל は雲の位置を表す「上に」とした。
- source_word: יָמִים רַבִּים
  choice: 長い間
  rationale: 字義的には「多くの日々」だが、継続期間を表す自然な日本語として「長い間」とした。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の家族的・契約的表現を保持した。文脈上はイスラエル共同体全体を指すため、別訳を脚注に示した。
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: ヤハウェの務め
  rationale: מִשְׁמֶרֶת は守るべき務め、責務、定めを表す。「務め」は שׁמר との語の結び付きを日本語で過度に不自然にせず保持する。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: וְלֹא יִסָּעוּ
  choice: 旅立たなかった
  rationale: נסע はこの文脈では宿営を離れて次の行程に出ることを指す。「旅立つ」は簡潔で明瞭である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号に置換せず、一般的な学術的再建音に基づく日本語表記を用いた。
- issue: בְנֵי יִשְׂרָאֵל の共同体的意味
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数形と家族的表現を本文に残しつつ、それが共同体全体を指す可能性を脚注で明示した。
- issue: מִשְׁמֶרֶת יְהוָה の意味範囲
  choice: ヤハウェの務め
  alternative: ヤハウェの定め／ヤハウェから命じられた責務
  rationale: 単一の命令だけでなく、神に従って待機する責務を含み得るため、意味を狭く限定しない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「幕屋」「ヤハウェ」は文脈上重要な聖書用語として保持し、それ以外は普通の読者に分かりやすい語順と語彙を用いた。
