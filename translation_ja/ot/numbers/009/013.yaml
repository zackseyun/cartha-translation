id: NUM.9.13
reference: Numbers 9:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: ja
  text: しかし、儀礼的に清く、旅の途中でもないのに、過越の祭りを行わない人は、自分の民から断ち切られる[a]。定められた時にヤハウェのささげ物を献げなかったからである。その人は自分の罪を負う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「断ち切られる」というヘブライ語の慣用表現が、この箇所で具体的にどのような裁きとして執行されるかは明示されていない。
    reason: 原文の司法的・契約的慣用表現が持つ曖昧さを説明するため。
  - marker: b
    text: 別訳「自分の罪責を負う」。
    reason: חֶטְאוֹ יִשָּׂא は、罪そのものだけでなく、その責任や結果を担う意味にも理解できるため。
lexical_decisions:
- source_word: טָהוֹר
  choice: 身が清い
  rationale: 道徳的な純粋さではなく、祭儀上の清さを表す文脈なので、「身が清い」とした。
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: 旅に出てもいない
  rationale: 直訳的な「道にいない」ではなく、前節までの旅行による不在という例外を自然な現代日本語で示した。
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: 過越の祭りを行わない
  rationale: חָדַל はここで行うべき務めを怠ることを表し、עָשָׂה הַפֶּסַח は過越のいけにえだけに限定せず、過越の行事を執り行うことを指す。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: その民の中から断ち切られる
  rationale: נֶפֶשׁ はここでは一人の人を指す。「断ち切られる」という契約的・司法的な慣用表現を保ち、刑罰の具体的な執行方法は本文で限定しない。
- source_word: קָרְבַּן יְהוָה
  choice: ヤハウェへのささげ物
  rationale: קָרְבָּן は神のもとへ携えるささげ物を指す。属格は日本語で自然な方向性を示す「への」とし、神名 יהוה は「ヤハウェ」とした。
- source_word: בְּמֹעֲדוֹ
  choice: 定められた時に
  rationale: מוֹעֵד が指す、規定された祭儀の時を簡潔かつ明確に表した。
- source_word: חֶטְאוֹ יִשָּׂא
  choice: 自分の罪を負う
  rationale: 罪について責任を負い、その結果を担うというヘブライ語の比喩を保持した。
theological_decisions:
- issue: 「断ち切られる」という刑罰の意味
  choice: 慣用表現を保ち、具体的な意味を本文で確定しない
  alternative: 共同体から追放される／死刑に処される／神の裁きを受ける
  rationale: この節だけでは、死、追放、子孫の断絶、神による裁きのいずれを具体的に指すか確定できないため、原文の重みと曖昧さを保った。
- issue: 「罪を負う」の射程
  choice: 罪とそれに伴う責任を含み得る表現として保持する
  alternative: 自分の罪責を負う
  rationale: חֵטְא は「罪」と「罪責」の両面を帯び得るため、本文では直截な「罪」を用い、別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「過越祭」より初見でも意味を取りやすい「過越の祭り」を採用した。男性名詞 אִישׁ は、日本語では性別を不必要に補わず自然に個人を指せる「人」とした。文を三つに分け、長い法文の論理関係を読み取りやすくした。
