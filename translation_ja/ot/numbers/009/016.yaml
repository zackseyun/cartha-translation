source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: ja
  text: いつもこのようであった。雲は幕屋を覆い、夜には火のような姿であった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「夜には火の姿であった」。
    reason: מַרְאֵה אֵשׁ の「火の姿／外観」という名詞句をより字義的に示す。本文の「火のような姿」は、火そのものと断定しない原文の含みを自然な日本語で表す。
lexical_decisions:
- source_word: כֵּן יִהְיֶה תָמִיד
  choice: いつもこのようであった
  rationale: 未完了形は荒野の旅の期間に繰り返し続いた状態を表すものと捉え、現代日本語で自然な過去の継続的表現とした。כֵּן の指示的な意味も「このよう」で保持した。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 直前の文脈で既に知られている、幕屋を覆う雲を指す。日本語では定冠詞を明示せずとも特定性が伝わる。
- source_word: יְכַסֶּנּוּ
  choice: 幕屋を覆い
  rationale: 動詞は「覆う」の意。男性単数接尾辞の指示対象は直前の文脈にある幕屋と判断し、単独でも分かりやすいよう名詞を補った。継続・反復の意味は文頭の「いつも」で示した。
- source_word: וּמַרְאֵה אֵשׁ לָיְלָה
  choice: 夜には火のように見えた
  rationale: מַרְאֶה は目に見える姿・様相を表す。火そのものだったと断定せず、火のような外観だったという原文の含みを自然な日本語で表した。ヘブライ語では動詞が省略された簡潔な句であるため、日本語では「見えた」を補った。
theological_decisions:
- issue: יְכַסֶּנּוּ の三人称男性単数接尾辞の指示対象
  choice: 幕屋
  alternative: 「それ」として指示対象を明示しない
  rationale: 直前の9章15節では雲が幕屋を覆ったと述べられており、ここでも同じ対象を受けるのが最も自然である。日本語の「それ」では参照先が不明瞭になるため「幕屋」と明示した。
- issue: מַרְאֵה אֵשׁ が実際の火を指すか、火のような外観を指すか
  choice: 火のように見えた
  alternative: 火の姿があった
  rationale: מַרְאֵה は「姿」「外観」「見えるもの」の幅を持つため、実体が火だったとは断定せず、視覚的な描写として訳した。別の直訳的表現は脚注に残した。
translation_notes:
  register: 平明な現代標準日本語を用いながら、簡潔で荘重な叙述調を保った。「絶えず」より日常的で理解しやすい「いつも」を選び、原文の反復・継続性を伝えた。
