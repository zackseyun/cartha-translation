  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: ja
  text: 彼らはヤハウェの命令に従って宿営し、ヤハウェの命令に従って出発した。彼らはヤハウェの務めを守った。それは、モーセを通して[a]与えられたヤハウェの命令に従ってのことであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「モーセの手によって」。モーセを仲介として、またはモーセによって、という意味のヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: 命令に従って
  rationale: 直訳は「口に従って」だが、ここでは権威ある指示に従うことを表す慣用句。三度の反復を生かしつつ、自然な現代日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を、一般的な学術的音写により明示した。
- source_word: יַחֲנוּ
  choice: 宿営した
  rationale: 陣営を設けてとどまることを表すため、荒野の旅の文脈に合う「宿営する」とした。
- source_word: יִסָּעוּ
  choice: 旅立った
  rationale: 宿営地を離れて出発する意味を、簡潔で自然な日本語で表した。
- source_word: מִשְׁמֶרֶת
  choice: 託された務め
  rationale: 守るべきもの、または委ねられた責務という意味を表す。「務め」だけでは委託の含意が弱いため「託された」を補った。
- source_word: שָׁמָרוּ
  choice: 守った
  rationale: 命令や委ねられた責務を忠実に保持し、履行するという語義を保った。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセを通して
  rationale: 直訳は「モーセの手によって」。ここではモーセが神の命令を仲介したことを示すヘブライ語の慣用表現なので、本文では自然な意味を示し、原文の比喩は脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が神の固有名を三度明記しているため、称号に置き換えず「ヤハウェ」と音写し、その反復も保った。
- issue: 「ヤハウェから託された務め」と命令への服従の関係
  choice: モーセを通して告げられた命令に従って、その務めを守った
  alternative: ヤハウェの定めを守った
  rationale: מִשְׁמֶרֶת の委託・責務の含意と、三度目の עַל־פִּי יְהוָה および בְּיַד מֹשֶׁה に示される神の命令とモーセの仲介を、ともに明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「宿営」「託された務め」により荒野の旅と委託された責任という文脈を保った。原文における「ヤハウェの命令」の三重の反復を維持し、後半は日本語として自然になるよう統語関係を明示した。
