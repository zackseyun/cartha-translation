source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: ja
  text: あなたがたのもとに寄留者が住んでいて、ヤハウェのために過越を守るなら、その人は過越の定めとその規定に従って行わなければならない。そのとおりに行わなければならない。あなたがたにも、寄留者[a]にも、この地に生まれた者[b]にも、定めは一つである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者」は、単に旅をしている人ではなく、イスラエルの民の間に住む外国出身者を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「この地の生え抜きの者」。寄留者と対照される、この地に生まれた者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: もし…なら
  rationale: 前節までの規定に続く条件文として、現代日本語で自然な形にした。
- source_word: יָגוּר ... גֵּר
  choice: 寄留者が…住んでいて
  rationale: גֵּרは単なる旅行者ではなく、イスラエルの民の間に居住する外国出身者を指す。「寄留者」はその法的・社会的含意を保つ。
- source_word: וְעָשָׂה פֶסַח
  choice: 過越を守ろうとする
  rationale: 直訳は「過越を行う」だが、祭儀を執り行い遵守するというヘブライ語の慣用表現を自然に示した。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 前置詞לの献身・方向性を「ために」で表し、神名יהוהを固有名「ヤハウェ」として明示した。
- source_word: כְּחֻקַּת הַפֶּסַח וּכְמִשְׁפָּטוֹ
  choice: 過越の定めとその規定に従って
  rationale: חֻקָּהとמִשְׁפָּטの近接しつつ異なる法的語感を「定め」「規定」で表し、祭儀の所定の仕方への適合を示した。
- source_word: כֵּן יַעֲשֶׂה
  choice: そのとおりに行うべきである
  rationale: 定められた方法への一致を強調する指示的な力を保った。
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: 定めは一つである
  rationale: 双方に同一の規範が適用されるという簡潔な法的宣言を再現した。
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: この地に生まれた者にも
  rationale: אֶזְרַחをגֵּרと対照される土地生まれの者として訳し、現代的な国籍概念を持つ「市民」は避けた。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有の契約名が明記されているため、称号に置き換えず「ヤハウェ」とした。
- issue: 寄留者と土地生まれの者に対する同一の定め
  choice: 過越の文脈で同じ定めが適用されることを明示
  alternative: 一般的・無制限な法的平等へ拡張して解釈する
  rationale: 「定めは一つ」という本文の強調を保ちつつ、その適用範囲をこの節の過越の規定以上に広げなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。法令的な調子を保ちながら、「過越を守る」など日本語の聖書文体として理解しやすい表現を用いた。すべての脚注記号を該当箇所に配置した。
