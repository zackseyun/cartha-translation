source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: ja
  text: 第二の月の十四日、夕暮れに[a]、彼らはそれを行わなければならない。種なしパンと苦菜とともに、それを食べなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夕暮れに」は、直訳では「二つの夕べの間に」。日没前後の時間帯を指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: 第二の月の
  rationale: 暦上の時を示す חֹדֶשׁ を通常の意味で「月」とし、定冠詞を伴う הַשֵּׁנִי を「第二の」と訳した。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: 十四日
  rationale: 基数詞と יוֹם の構文は日付を表すため、自然な現代日本語の日付表現とした。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 夕暮れに
  rationale: 直訳では「二つの夕べの間に」。日没前後の時間帯を示す慣用句として、本文では明瞭な「夕暮れに」とし、字義は脚注に残した。
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: 彼らはそれを行わなければならない
  rationale: 過越の儀礼を実施する文脈での עשה を「行う」とした。法的指示を未完了形が表すため「なければならない」で訳した。目的語「それ」は文脈上、過越のいけにえまたは儀式を指し得るため、明示的に限定しなかった。
- source_word: עַל מַצּוֹת
  choice: 種なしパンとともに
  rationale: 食事の文脈で עַל は随伴を示す。מַצּוֹת は酵母を入れないパンを指すため、一般に理解しやすい「種なしパン」とした。
- source_word: וּמְרֹרִים
  choice: 苦菜
  rationale: 過越の食事で用いる苦い植物を指す複数名詞を、日本語聖書で通用し簡潔な「苦菜」とした。
- source_word: יֹאכְלֻהוּ
  choice: それを食べなければならない
  rationale: 三人称男性単数接尾辞の指示対象を「それ」として保持し、法的指示のニュアンスを「なければならない」で表した。
theological_decisions:
- issue: אֹתוֹ／יֹאכְלֻהוּ の指示対象
  choice: 「それ」とし、本文中で「過越のいけにえ」「小羊」などに限定しない
  alternative: 「過越のいけにえを」「それを」または「小羊を」
  rationale: 男性単数接尾辞は直前の文脈にある過越のいけにえ・儀礼を受けるが、この節自体は名詞を繰り返さない。原文の照応と含みを保つため代名詞で訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。規定文としての力を「なければならない」で表し、祭儀用語は過度に専門的にしなかった。脚注記号は関連語の直後ではなく節末に置いたが、脚注内容は「夕暮れに」の説明である。
