base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: ja
  text: 雲が天幕の上から上がるたびに、その後、イスラエルの子らは旅立った。また、雲がとどまる場所で、そこにイスラエルの子らは宿営した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: 雲が…上がると
  rationale: לְפִי と不定詞の組み合わせが示す反復的な時の関係を、現代日本語で自然な「～すると／～と」で表した。עלה はここでは雲が天幕の上から上がることを指す。
- source_word: מֵעַל הָאֹהֶל
  choice: 天幕の上から
  rationale: מֵעַל の空間的意味と、אֹהֶל の字義「天幕」を保った。文脈上は幕屋の天幕を指すが、本文では限定を加えなかった。
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 雲が上がってから民が出発するという明示的な時間的順序を保った。
- source_word: יִסְעוּ
  choice: 旅立った
  rationale: נסע は宿営地を出て次へ進むことを表す。周囲の叙述が反復的な慣行を示すため、日本語の過去形でも習慣的叙述として自然に読める。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保ち、民全体を指す集合的用法として訳した。
- source_word: יִשְׁכָּן
  choice: とどまった
  rationale: שׁכן の「住む、落ち着く」という含みを踏まえつつ、雲について自然で、静止してその場にあることを示す表現とした。
- source_word: שָׁם ... שָׁם
  choice: …場所で
  rationale: ヘブライ語の対応関係は、日本語では「雲がとどまった場所で」という一体的な表現で明瞭に伝わるため、不自然な「そこに…そこで」の重複を避けた。
- source_word: יַחֲנוּ
  choice: 宿営した
  rationale: חנה の軍事的・旅程的な「陣を張る、宿営する」を、現代日本語で明確かつ品位ある語にした。
