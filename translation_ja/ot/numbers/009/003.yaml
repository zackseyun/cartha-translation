  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: ja
  text: この月の十四日、夕暮れ時[a]に、定められた時にこれを行いなさい。それに関するすべての掟とすべての定めに従って、これを行いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「二つの夕べの間」。日没前後の薄暮の時間帯を表す伝統的な言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: この月の十四日
  rationale: ヘブライ語の日付表現を、暦上の特定の日を明確に示す自然な現代日本語にした。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 夕暮れ時[a]
  rationale: 字義的には「二つの夕べの間」だが、儀礼上の時刻を示す慣用表現である。本文では理解しやすい「夕暮れ時」とし、原文の独特な表現と時間幅の曖昧さを脚注に残した。
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: これを行いなさい
  rationale: עשהは「行う、なす」の意で、ここでは直前の文脈にある過越の儀式を執り行うことを指す。「祝う」と限定せず、原文の広い動詞表現と反復を保った。
- source_word: בְּמוֹעֲדוֹ
  choice: 定められた時に
  rationale: מוֹעֵדが示す、暦および祭儀上の指定された時という意味を明確に表した。
- source_word: כְּכָל חֻקֹּתָיו
  choice: それに関するすべての掟に従って
  rationale: 接尾辞が過越の儀式を受けることを自然な日本語で明示し、חֻקּוֹתの規定・掟という法的祭儀的性格を保った。
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: すべての定めに従って
  rationale: מִשְׁפָּטִיםを「定め」とし、「掟」と区別しつつ、祭儀に関する規則という文脈に合う読みやすい表現にした。
