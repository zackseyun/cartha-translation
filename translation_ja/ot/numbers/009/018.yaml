id: NUM.9.18
reference: Numbers 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: ja
  text: ヤハウェの命令[a]に従ってイスラエルの人々は旅立ち、ヤハウェの命令に従って宿営した。雲が幕屋の上にとどまっている間はずっと、彼らは宿営していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヤハウェの口に従って」。これは「ヤハウェの命令に従って」という意味のヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: עַל־פִּי は直訳すれば「～の口に基づいて」だが、ここでは権威ある指示・命令に従うことを表す慣用句である。自然な現代日本語で、その意味を明確に伝える。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの子ら」だが、ここではイスラエル民族全体を指す定型表現であるため、性別を不必要に限定せず、現代日本語として明瞭な表現を選んだ。
- source_word: יִסְעוּ
  choice: 旅立ち
  rationale: נסע は宿営地を離れて移動を始めることを表す。「旅立つ」は出発の意味を簡潔かつ自然に伝える。
- source_word: יַחֲנוּ
  choice: 宿営した／宿営していた
  rationale: חנה の基本義「宿営する」を保持した。末尾では継続期間を示す文脈に合わせて「宿営していた」としたが、原文の同じ動詞であることは保った。
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: 間はずっと
  rationale: 「～であるすべての日々」という継続期間を、自然な日本語で過不足なく表す。
- source_word: יִשְׁכֹּן
  choice: とどまっている
  rationale: שׁכן は住む、宿る、留まることを表す。雲が幕屋の上に継続して存在する文脈では「とどまる」が自然である。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: מִשְׁכָּן は神の臨在のための聖なる移動式の住まいを指す。「幕屋」は日本語聖書で定着し、この箇所の対象を簡潔に示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 子音四文字の神名を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を明記しているため、称号の「主」へ置換せず音写した。「エホバ」よりもヘブライ語の推定発音を反映する一般的な形を採用した。
- issue: 雲の滞在と民の宿営との関係
  choice: 雲がとどまっている全期間、民も宿営していたという対応関係をそのまま示す
  alternative: 雲を神そのもの、または単なる自然現象と明示する
  rationale: 本文は雲の神学的実体をこの節だけでは定義せず、雲による導きと民の行動の対応を述べる。解釈を付加せず、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宿営する」「幕屋」は本文の荒野移動と祭儀的背景を正確に伝えるために用いた。文の反復は、民の出発と宿営がともにヤハウェの命令に従うという原文の強調を保持している。
