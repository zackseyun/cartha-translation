id: NUM.9.8
reference: Numbers 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: ja
  text: モーセは彼らに言った。「待っていなさい[a]。ヤハウェがあなたがたについて何を命じられるか、聞こう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「立っていなさい」。
    reason: עִמְדוּ の字義的な意味を示しつつ、本文では文脈に即した自然な表現を用いるため。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  choice: モーセは彼らに言った
  rationale: ヘブライ語の継起的な物語叙述を、日本語では自然な語順と過去形で表した。接続詞 וַ は文脈上、明示しなくても出来事の連続が伝わる。
- source_word: עִמְדוּ
  choice: 待っていなさい[a]
  rationale: 字義は「立て」だが、ここではモーセが答えを聞く間、その場にとどまるよう求める命令であるため、文脈上の意味を自然な現代日本語で表した。字義的な別訳は脚注に残した。
- source_word: וְאֶשְׁמְעָה
  choice: 聞こう
  rationale: 一人称の意志を示す形を簡潔に表し、ヤハウェから答えを聞くという原文の表現を保った。「尋ねてみよう」など、原文に明示されない行為は補わなかった。
- source_word: מַה יְצַוֶּה
  choice: 何を命じられるか
  rationale: 疑問詞 מַה と、צוה のピエル未完了形が表す命令内容への問いを直接表した。神への敬意を自然に示すため、主語敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、日本語で一般的な音写によって固有名として示した。
- source_word: לָכֶם
  choice: あなたがたについて
  rationale: 二人称男性複数を指す前置詞句。ここでは彼らの事例に関して下される命令を意味するため、「あなたがたについて」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を用いていることを保ち、称号への置換によって原文上の区別を失わせないため。
- issue: לָכֶם が示す命令の関係
  choice: あなたがたについて
  alternative: あなたがたに／あなたがたのために
  rationale: 命令が彼らに直接告げられるのか、彼らの事情について定められるのかには一定の幅があるが、直前の問題への裁定を求める文脈に合う「について」を採用した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。会話として自然な「待っていなさい」と意志形「聞こう」を用い、過度に古風な表現や教派固有の用語を避けた。
