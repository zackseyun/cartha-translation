source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: ja
  text: 時には、雲が数日の間、幕屋の上にとどまることもあった。彼らはヤハウェの命令[a]に従って宿営し、ヤハウェの命令に従って出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤハウェの口によって」。すなわち、ヤハウェの命令によって。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: 時には～こともあった
  rationale: さまざまな期間の事例を順に述べる文脈で、ある場合を取り上げるヘブライ語の慣用表現を、自然な現代日本語で示した。
- source_word: יִהְיֶה הֶעָנָן
  choice: 雲が～とどまる
  rationale: ここでの היה は雲の単なる存在ではなく、幕屋の上に継続してあることを表すため、「とどまる」とした。
- source_word: יָמִים מִסְפָּר
  choice: 数日の間
  rationale: 直訳的には「数えられる日々」で、限定された日数を指す。「数日」は日数を過度に限定せず、簡潔で自然である。
- source_word: עַל הַמִּשְׁכָּן
  choice: 幕屋の上に
  rationale: מִשְׁכָּן は荒野における聖所の構造物を指す標準的な語なので「幕屋」とし、עַל の位置関係を「上に」で表した。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: 字義は「ヤハウェの口に従って」だが、ここでは神の権威ある指示に従うことを意味する。字義的表現は脚注に残した。
- source_word: יַחֲנוּ
  choice: 宿営し
  rationale: 未完了形はこの文脈で繰り返される慣例的行動を示す。「宿営する」は民がその場に陣を置くことを明確に表す。
- source_word: יִסָּעוּ
  choice: 旅立った
  rationale: נסע は荒野の移動の文脈で宿営を解いて次へ進むことを表すため、「旅立つ」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語音写で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、神の固有名であることが分かるよう「ヤハウェ」と音写した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。反復される行動を自然に描きつつ、原文で二度繰り返される「ヤハウェの命令に従って」を保持した。
