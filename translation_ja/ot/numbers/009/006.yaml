  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: ja
  text: さて、人の死体に触れて汚れていたため、その日に過越の祭りを行うことのできない人たちがいた。彼らはその日、モーセとアロンの前に出た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: さて、……人たちがいた
  rationale: 物語に新たな状況を導入する構文。男性複数ではあるが、ここでは性別を不必要に強調せず、現代日本語として自然な「人たち」とした。「さて」は明示的な時間語ではなく、場面転換を示す語りの接続として用いた。
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: 人の死体に触れて汚れていた
  rationale: 直訳的には「人のנפשのために汚れていた」だが、祭儀的文脈では人の死体による汚れを表す慣用句。民数記の関連規定に即し、道徳的な罪ではなく死体との接触による儀礼上の汚れであることを明確にした。
- source_word: וְלֹא יָכְלוּ
  choice: ため、……ことのできない
  rationale: 直前の汚れが過越の祭りを行えない理由であるという文脈上の因果関係を、自然な日本語で示した。
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: 過越の祭りを行う
  rationale: 字義は「過越を行う」。過越の規定を守り実施する意味を保ちつつ、「祝う」による祝祭的含意の強調を避けた。
- source_word: בַּיּוֹם הַהוּא
  choice: その日に／その日
  rationale: 同じ句が二度現れることを訳文にも保持し、当日の実施不能と当日の申し出を対応させた。
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: 前に出た
  rationale: 「近づいて～の前に」という表現を、権威者の前に進み出る場面にふさわしい自然な日本語で表した。単なる物理的接近以上の請願行為までは訳語に付加していない。
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: モーセ……アロン
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions:
- issue: 汚れの性質
  choice: 人の死体との接触による祭儀上の汚れとして訳す
  alternative: 「人の魂のために汚れていた」などと字義的に訳す
  rationale: 五書の清浄規定におけるこの句は、道徳的罪ではなく死に関わる祭儀上の汚れを指す。神学的な罪責を付加せず、文脈上の意味を明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法物語にふさわしい落ち着いた語調とした。「過越の祭りを行う」「前に出た」は、原文の形式性を保ちながら過度に文語的にならない表現である。
