id: NUM.9.10
reference: Numbers 9:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: ja
  text: 「イスラエルの子ら[a]に告げなさい。『あなたがたのうちに、また後の世代において[c]、だれであれ、死体によって汚れている[b]か、遠い旅の途上にいるなら、その者はヤハウェのために過越を行わなければならない。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの息子たち」。ここではイスラエルの共同体全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「人〔ネフェシュ〕のために汚れている」。この祭儀法上の表現は、死者または死体に由来する汚れを指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「あなたがたの後の各世代にも」。この規定が後代にも及ぶことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに告げなさい
  rationale: 命令形 דַּבֵּר を自然な指示表現「告げなさい」とし、בְּנֵי יִשְׂרָאֵל の字義的な親族表現は「イスラエルの子ら」とした。共同体全体を指すことは脚注で明示する。
- source_word: אִישׁ אִישׁ
  choice: だれであれ
  rationale: 語の反復が表す分配的な意味、すなわち一人一人に例外なく適用されることを、現代日本語で自然に示す。ヘブライ語は男性単数形だが、ここでは法規の適用対象を代表的に表す。
- source_word: טָמֵא לָנֶפֶשׁ
  choice: 死体によって汚れている
  rationale: 祭儀法上、נֶפֶשׁ を伴うこの慣用句は死者・死体に由来する汚れを指す。「触れて」と限定せず、原因を表す原文の幅を保った。
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: 遠い旅に出ている
  rationale: 字義的には「遠い道にいる」だが、聖所から離れるほどの旅行中であるという実際の意味を自然な日本語で表した。
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: あなたがたのうちでも、代々にわたっても
  rationale: この規定が現在の共同体にも後代にも及ぶことを示す。日本語では「代々にわたって」が לְדֹרֹתֵיכֶם の継続的範囲を明瞭に伝える。
- source_word: וְעָשָׂה פֶסַח
  choice: 過越を行わなければならない
  rationale: עשה と פֶסַח の結び付きは過越の儀礼を執行・遵守することを意味する。「祝う」や「いけにえをささげる」の一面だけに限定せず、原文の包括性を保つため「行う」とした。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 神名 יהוה を固有名「ヤハウェ」として示し、前置詞 ל の方向・帰属の意味を「ために」で表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に明記された契約の神名を普通名詞的な称号に置き換えず、固有名として訳した。
- issue: אִישׁ אִישׁ の性と適用範囲
  choice: だれであれ
  alternative: どの男も
  rationale: 男性単数形を用いた分配表現だが、この法文では該当する者を一人ずつ取り上げる機能が中心である。日本語で不必要に成人男性だけへ限定せず、「だれであれ」で分配的効力を伝えた。
- issue: וְעָשָׂה の法的効力
  choice: 行わなければならない
  alternative: 行うことができる
  rationale: 接続完了形はこの規定の帰結として過越を行う義務を述べると理解した。英語相談層の「still」が示し得る譲歩性は原文に明示されないため本文へ加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語による、威厳を保った法令調。引用導入は「告げなさい」とし、規定本体は義務を示す「なければならない」で統一した。「過越祭を祝う」や「過越のいけにえをささげる」と狭く解釈せず、「過越を行う」によって儀礼全体を含み得る原文の幅を保った。
