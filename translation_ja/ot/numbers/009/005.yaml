id: NUM.9.5
reference: Numbers 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: ja
  text: こうして彼らは第一の月の十四日、夕暮れ時[a]に、シナイの荒野で過越を守った。ヤハウェがモーセに命じたすべてのとおりに、イスラエルの子らはそのようにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「二つの夕べの間」。夕暮れの時間帯を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: 過越を守った
  rationale: עָשָׂה は直訳すれば「行う」だが、פֶּסַח と結び付くここでは過越の儀礼を執り行い、遵守する意味。「祝った」よりも祭儀と命令への服従の両面を保つ。
- source_word: הַפֶּסַח
  choice: 過越
  rationale: 文脈上、犠牲だけでなく過越の祭儀全体を指すため、限定的な「過越のいけにえ」とはしない。
- source_word: בָּרִאשׁוֹן
  choice: 第一の月に
  rationale: 原文では「第一に」だが、直後の日付表現から「月」を補うのが日本語として明瞭。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: その月の十四日
  rationale: ヘブライ語の標準的な日付表現を自然で簡潔な日本語にした。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 夕暮れ時に
  rationale: 字義は「二つの夕べの間」。日没前後の薄暮の時間帯を示す慣用句として本文では自然に訳し、字義を注に残す。
- source_word: בְּמִדְבַּר סִינָי
  choice: シナイの荒野で
  rationale: מִדְבָּר は人の少ない荒れ地を指し、聖書文脈で定着した「荒野」が適切。
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのとおりに
  rationale: 命令の全内容に従ったという包括性を保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写する。
- source_word: צִוָּה
  choice: 命じた
  rationale: ヘブライ語の完了形は、過越の実施に先立つ命令を文脈上明らかにするため、日本語では単純過去で十分に自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保ちつつ、契約共同体を集合的に指す表現として訳す。
- source_word: כֵּן עָשׂוּ
  choice: 行った
  rationale: 節末の要約的な反復を保ち、冒頭の祭儀的用法「守った」と区別した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有名が明記されているため、称号で代替せず音写した。母音復元には一定の議論があるが、現代の標準的な学術的音写を採る。
- issue: בְּנֵי יִשְׂרָאֵל の集合的・男性形表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の「子ら」という比喩的・系譜的表現を保持する。一方、文脈では契約共同体全体を指す集合表現であり、成人男性だけに狭めない。
- issue: הַפֶּסַח の指示範囲
  choice: 過越
  alternative: 過越のいけにえ／過越祭
  rationale: この箇所では犠牲のみか祭全体かを不必要に限定せず、原語の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で格調ある調子と原文の反復を保持した。「過越」は日本語聖書で定着した簡潔な名称として用いた。
