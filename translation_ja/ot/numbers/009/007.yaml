language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: ja
  text: その人たちは彼に言った。「私たちは人の死体によって汚れています。[a] なぜ私たちは、定められた時にイスラエルの民[c]の中でヤハウェへのささげ物を献げることから除外されなければならないのでしょうか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「人のネフェシュのために」。祭儀法では、人の死体によって汚れたことを意味する慣用表現です。
    reason: lexical_alternative
  - marker: b
    text: または「なぜ私たちは、……ささげ物を献げることを妨げられなければならないのでしょうか」。
    reason: alternative_reading
  - marker: c
    text: ヘブライ語では「イスラエルの子ら」。ここではイスラエルの民を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: その人たちは彼に言った
  rationale: 物語を進める標準的な発話導入として自然に訳し、指示語による既出の人々への言及と、文脈上モーセを指す「彼」を保持した。
- source_word: טְמֵאִים
  choice: 汚れています
  rationale: ここでは祭儀上の汚れを表すため、日本語聖書で理解されやすい「汚れ」を用いた。
- source_word: לְנֶפֶשׁ אָדָם
  choice: 人の死体によって
  rationale: 直訳的には「人のネフェシュのために」だが、祭儀法の文脈では人の死体との接触による汚れを指す慣用句である。原因を明確にしつつ、本文にない接触行為そのものは補わなかった。
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: 除外され、……献げられない
  rationale: גרע のニファル形が表す、共同体の祭儀への参加から締め出される受動的な意味を自然な日本語で示した。
- source_word: קָרְבַּן יְהוָה
  choice: ヤハウェへのささげ物
  rationale: קרבן は神に差し出す祭儀上の供え物であり、属格関係は日本語で自然な方向性を示す「への」とした。神名は称号に置き換えず「ヤハウェ」と表記した。
- source_word: בְּמֹעֲדוֹ
  choice: 定められた時に
  rationale: 過越のささげ物について規定された固定の時を指すため、「定められた時」とした。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民と共に
  rationale: 字義は「イスラエルの子らの中で」だが、現代日本語では共同体と一緒に祭儀へ参加する意味を「民と共に」が明瞭に伝える。字義的表現は脚注に残した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有の神名が明記されているため、称号へ置換せず一般的な学術的音写を用いた。
- issue: לְנֶפֶשׁ אָדָם が示す汚れの原因
  choice: 人の死体によって
  alternative: 死んだ人のために／人の魂によって
  rationale: 民数記の祭儀法における定型的用法から死体による汚れを指す。ただし、具体的にどのように死体と関わったかは本文が述べないため、「触れた」とは断定しなかった。
- issue: נִגָּרַע の訴えの強さ
  choice: 除外され
  alternative: 妨げられ／権利を奪われ
  rationale: 彼らが祭儀参加から締め出されることへの抗議を表す一方、法的権利という概念を本文以上に強く持ち込まない訳語とした。
translation_notes:
  register: 明瞭な現代標準語を用い、祭儀上の用語には聖書文体としての品位を保った。「献げる」は神への祭儀行為を示すため漢字表記とし、質問文は切実な抗議を伝えながら過度に口語化しなかった。
