- from: その人たちは彼に言った。「私たちは人の死体によって汚れています。[a] なぜ私たちは除外され[b]、定められた時にイスラエルの民[c]と共に、ヤハウェへのささげ物を献げられないのでしょうか。」
  to: その人たちは彼に言った。「私たちは人の死体によって汚れています。[a] なぜ私たちは、定められた時にイスラエルの民[c]の中でヤハウェへのささげ物を献げることから除外されなければならないのでしょうか。[b]」
