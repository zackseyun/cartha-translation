id: NUM.9.1
reference: Numbers 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: ja
  text: ヤハウェは、彼らがエジプトの地を出て二年目の第一の月に、シナイの荒れ野[a]でモーセに次のように語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「シナイの砂漠」。
    reason: מִדְבָּר は「荒れ野」のほか、「砂漠」とも訳し得るため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神がモーセに語るという叙述を、現代日本語の聖書文体として自然かつ dignified に表す。「言われた」よりも、続く神の指示を導入する語感が明確である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: אֶל はここで発話の相手を示すため、自然な日本語で「モーセに」とした。
- source_word: בְּמִדְבַּר סִינַי
  choice: シナイの荒れ野で
  rationale: מִדְבָּר は人里離れた乾燥地・原野を指し得る。「荒れ野」は聖書的な品位を保ちつつ、単なる砂地に限定しない。
- source_word: בַּשָּׁנָה הַשֵּׁנִית לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: 彼らがエジプトの地を出てから第二年
  rationale: 出エジプトを起点とする時を明確にし、אֶרֶץ も「地」として反映した。接尾辞の三人称複数は、本文どおり「彼ら」とした。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: その第一の月に
  rationale: 第二年に属する第一の月であることが日本語で分かるよう「その」を補った。月名は原文にないため補わない。
- source_word: לֵאמֹר
  choice: こう告げられた
  rationale: 次節に続く発話内容を導入する機能を、日本語では「こう」によって自然に表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号へ置換せずに示す。発音の完全な確定には限界があるが、一般的な学術的音写を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話を導入する箇所として品位ある文体を保った。ヘブライ語の語順を機械的に再現せず、日本語で時間・場所・話者が自然に把握できる順序に整えた。
