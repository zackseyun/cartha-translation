  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう告げた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は神の名を表す四文字「YHWH」。通常「ヤハウェ」と読まれる。伝統的には「主」と訳される。
    reason: 本文の「ヤハウェ」が原文の四文字神名であること、および伝統的な「主」という訳語との関係を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進める連続形。日本語では文脈上の順序が明らかなため、「そして」を機械的に補わず、自然な叙述とした。דבר と後続の לֵאמֹר をまとめて、発言導入の定型句「告げた」と表した。
- source_word: יְהוָה
  choice: 主
  rationale: 神名を日本語聖書の伝統に沿う尊称「主」で本文に表し、原文が四文字神名YHWHであることを脚注で明示した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 方向・相手を示す前置詞 אֶל を自然な日本語の助詞「に」で表し、人名は慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （「告げた」に統合）
  rationale: 後続する発言内容を導入する不定詞。日本語で「言って言った」のような重複を避け、וַיְדַבֵּר と一体の定型句として「告げた」に統合した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 本文では「主」、脚注で「YHWH（ヤハウェ）」と明示
  alternative: 本文で「ヤハウェ」
  rationale: 原文の固有名としての性格を脚注に保存しつつ、明瞭で品位ある現代日本語と広く定着した聖書表現を用いた。神名の推定発音には一定の議論があるため、その情報も脚注に置いた。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。ヘブライ語の二重の発言導入を日本語として自然な「告げた」にまとめた。脚注記号[a]は本文中に配置した。
