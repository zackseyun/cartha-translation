  source_fidelity: ヘブライ語の接続詞、命令的未完了形、過越の指定時という要素は概ね反映されています。ただし、פֶּסַח はここで単に出来事としての「過越」ではなく、守り行うべき儀礼・祭りを指すため、「過越を行う」は意味がやや不明瞭です。
  naturalness: 「過越を行わなければならない」は現代日本語としてやや不自然で、何を行うのかが曖昧に響きます。「過越の祭りを守らなければならない」は自然で、儀礼を守るという עשה の慣用的意味を明瞭に表せます。
  terminology: בְנֵי יִשְׂרָאֵל は民族共同体を指す定型表現であり、明瞭な現代標準語本文では「イスラエルの人々」が適切です。脚注で逐語的表現「イスラエルの子ら」を示します。「過越の祭り」は、日本語の聖書用語として定着しており、この文脈の儀礼的指示に合致します。
