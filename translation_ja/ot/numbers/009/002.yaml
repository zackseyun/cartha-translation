  text: וְ/יַעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת הַ/פָּ֖סַח בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: ja
  text: また、イスラエルの人々[a]は、定められた時に過越の祭りを守らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子ら」。または「イスラエル人」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: また、…行わなければならない
  rationale: 接続詞 וְ を「また」で示した。עשה は直訳すれば「行う／作る」だが、過越を目的語とするここでは、その儀礼を執り行い、守ることを意味する。未完了形は文脈上、命令・義務の力を持つため、単なる未来ではなく「行わなければならない」とした。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の家族的表現を保つ直訳。「イスラエル人」は自然な代案だが、原文の「子ら」という形を本文に残した。
- source_word: הַפָּסַח
  choice: 過越
  rationale: 語は過越のいけにえ、儀礼、祭りを指し得る。この節だけでは意味を一つに限定せず、広く受け取れる「過越」とした。
- source_word: בְּמוֹעֲדוֹ
  choice: 定められた時に
  rationale: מוֹעֵד は定められた時・期を表し、接尾辞は過越に対応する。日本語では所有表現を明示しなくても関係が明らかなため、自然な「定められた時に」とした。
theological_decisions:
- issue: 未完了形の命令的な力
  choice: 義務を表す「行わなければならない」
  alternative: 「行わせなさい」または単純未来の「行う」
  rationale: 第三人称への命令・規定としての力を示しつつ、モーセが直接行為を引き起こすという使役の意味を原文以上に加えないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、律法の規定にふさわしい端正な文体とした。「過越の祭り」や「過越のいけにえ」と限定せず、原語の意味の幅を保った。
