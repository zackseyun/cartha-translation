    rationale: 日本語では「過越」だけでは儀礼・祭りを行うという目的語関係が明確でなく、不自然です。原文の פֶּסַח と עשה の組合せは、過越の儀礼を守り行うことを指します。
  - severity: low
    issue: 「イスラエルの子ら」を本文に置くこと
    rationale: 逐語的には可能ですが、現代日本語では血縁上の子ども・男性の子らとも受け取られ得ます。ここはイスラエル共同体を指す定型句なので、本文では「イスラエルの人々」とし、脚注に逐語訳を残すほうが明瞭です。
