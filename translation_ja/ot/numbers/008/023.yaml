base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の名を表す四文字語YHWH。伝統的に「主」と訳される。
    reason: 原文の神名を明示し、伝統的な代替表記を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語の次の出来事を導く wayyiqtol。日本語では後続する発言内容への導入として「告げられた」が自然であり、神を主語とする文にふさわしい敬意も表す。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神の固有名を表す四文字語 YHWH。日本語聖書で広く通用する伝統的な代替表記「主」を本文に用い、原文が固有名であることを脚注で明示する。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: אֶל は発話の相手を示し、מֹשֶׁה は標準的な日本語名「モーセ」とする。
- source_word: לֵאמֹר
  choice: （後続する直接話法への導入として「告げられた」に統合）
  rationale: ヘブライ語の定型句「語って言った」を逐語的に重ねると現代日本語では不自然なため、次節の直接話法を導く簡潔な表現に統合した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主（脚注で「原文は神の固有名YHWH」）
  alternative: ヤハウェ／エホバ
  rationale: 原文が称号ではなく神の固有名を記す事実を脚注で保ちつつ、本文は明瞭で格調ある現代標準日本語とし、特定の復元発音を断定しない。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。ヘブライ語の「語って言った」という定型的重複は、日本語の自然な発話導入に整えた。
