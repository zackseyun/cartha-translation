  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: ja
  text: 燭台の造りはこうであった。金の打ち出し細工であり[a]、その台座から花飾りに至るまで、打ち出し細工であった。ヤハウェがモーセに示した姿[b]のとおりに、燭台を造った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「打ちたたいて造ったもの」とも訳せる。このヘブライ語は、金属を打って成形したことを強調する。「一つの塊から造ったもの」という含みを認める解釈もある。
    reason: lexical_alternative
  - marker: b
    text: 文脈上、「示した型」または「示した手本」とも訳せる。また、「幻」または「幻視」と理解することもできる。ヘブライ語は基本的に、目に見える姿・外観を表す語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: 造り
  rationale: 燭台の製作法・仕上がりを指す語として、現代日本語で自然かつ職人仕事の文脈に合う。
- source_word: הַמְּנֹרָה
  choice: 燭台
  rationale: 祭儀用具の名称を音写せず、一般読者に明瞭な日本語で訳した。
- source_word: מִקְשָׁה
  choice: 打ち出して造ったもの／打ち出し細工
  rationale: 金属を打って成形することを強調する語。二度の出現を保ちつつ自然な日本語にした。「一つの塊から」は可能な含意だが本文では確定しない。
- source_word: זָהָב
  choice: 金
  rationale: 材質を表す直接的な訳。
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: その台座から花飾りに至るまで
  rationale: 燭台の下部から花形装飾まで全体に及ぶことを表す。「腿」の直訳は文脈に不適切であり、פֶּרַח はここでは花形の装飾を指す。
- source_word: כַּמַּרְאֶה
  choice: 示した形
  rationale: מַרְאֶה の「見える姿・外観」という語義を保ち、製作の手本として示された形を自然に表した。「型」「幻」も文脈上可能なため注記した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を固有名として表記した。
- source_word: כֵּן עָשָׂה
  choice: そのとおりに、彼は…造った
  rationale: 「…のように、そのように造った」という対応関係と能動態を保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を明示し、普通名詞・称号への置換を避けた。
- issue: עָשָׂה の省略された主語
  choice: 彼は燭台を造った
  alternative: 燭台は造られた
  rationale: ヘブライ語は能動態の三人称男性単数で、直前の文脈により製作者が暗黙に理解される。日本語でも「彼」として補ったが、特定の人物名や神学的主張は加えていない。
- issue: כַּמַּרְאֶה の解釈
  choice: 示した形
  alternative: 示した型／示した幻
  rationale: 製作物の外形を示されたという文脈を反映しつつ、語が持つ外観・幻視の幅を脚注で残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「燭台」「台座」「花飾り」により祭具の構造を具体的に示し、原文にある מִקְשָׁה の反復も保った。
