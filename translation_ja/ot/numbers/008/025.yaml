  text: וּ/מִ/בֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִ/צְּבָ֣א הָ/עֲבֹדָ֑ה וְ/לֹ֥א יַעֲבֹ֖ד עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: ja
  text: 五十歳からは、奉仕の務めから退き、もはや働いてはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奉仕の務めから戻る」。このヘブライ語動詞は字義的には「帰る、戻る」を意味するが、ここでは現役の務めから退く意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳になった者は
  rationale: 年齢の起点を示すヘブライ語の慣用表現を、自然な現代日本語で表した。文脈上の主語であるレビ人を「者」として示している。
- source_word: יָשׁוּב
  choice: 退き
  rationale: 基本義は「帰る、戻る」だが、ここでは前置詞 מִן（～から）を伴い、現役の務めから退くことを意味する。字義的な可能性は脚注に残した。
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: 奉仕の務めから
  rationale: צָבָא はここでは軍役でなく、レビ人に割り当てられた任務・勤務を指し、עֲבֹדָה は奉仕・働きを指す。「奉仕の務め」は両語の組み合わせを簡潔で自然に伝える。
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: もはや働いてはならない
  rationale: עבד の「働く、仕える」という意味と、否定命令的な規定の力を保った。「奉仕」との不必要な反復を避けつつ、現役の作業を続けないことを示す。
