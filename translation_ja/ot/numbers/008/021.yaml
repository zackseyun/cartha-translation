base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: ja
  text: レビ人たちは身を清め、衣服を洗った。アロンは彼らをヤハウェの前に揺祭としてささげ[a]、彼らを清めるために、彼らのために贖いを行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「揺祭」は、ヤハウェの前にささげる祭儀上の定型表現である。ヘブライ語は「揺り動かす」を語源とする語を用いるが、ここではレビ人を儀礼的にささげることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: 身を清め
  rationale: ヒトパエル形の再帰的意味と祭儀的な清めの文脈を自然な日本語で表す。「罪から」と明示することは、原文がここで明言していない要素を加えるため避けた。
- source_word: הַלְוִיִּם
  choice: レビ人たち
  rationale: 集団を指す定冠詞付きの名称を、現代日本語で明確に表した。
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: 衣服を洗った
  rationale: 祭儀的文脈にふさわしく、בגדを「衣服」とした。
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: 奉献物として……差し出し
  rationale: נוףとתְּנוּפָהの定型的な祭儀表現を、人そのものを物理的に振ったと断定せず、ヤハウェの前への奉献として自然に伝える。字義的な動作の可能性は脚注に残した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神名יהוהを固有名「ヤハウェ」として示し、לִפְנֵיを「前に」と訳した。
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: 彼らのために贖いを行った
  rationale: 祭司的文脈のכפרを、神学的意味を狭く限定せず、一般読者にも理解できる定型表現で訳した。
- source_word: לְטַהֲרָם
  choice: 彼らを清めるために
  rationale: 不定詞の目的を明示し、טהרの祭儀的な清めの意味を保った。
theological_decisions:
- issue: חטא・כפר・טהרという関連する祭儀用語の訳し分け
  choice: 「身を清め」「贖いを行った」「清めるために」と訳す
  alternative: すべてを「清める」中心の表現にそろえる、または最初を「罪から身を清める」とする
  rationale: 自己の清め、アロンによる贖いの行為、その目的としての清めという原文の区別を保つ。「罪から」は語根から連想され得るが、この節の表現として明示されていないため本文には補わない。
- issue: תְּנוּפָהの祭儀的表現
  choice: 「奉献物として差し出し」と本文で訳し、動作に即した訳を脚注で示す
  alternative: 「揺り動かす奉献物として彼らを揺り動かし」
  rationale: レビ人をヤハウェの前に儀礼的にささげる意味を明瞭にしつつ、実際の身体動作がどのようなものだったかを断定しない。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の神名を固有名として保持する。
translation_notes:
  register: 明快で格調ある現代標準日本語とした。長い接続構造を二文に分け、行為の順序を保った。祭儀用語は専門性を残しつつ、一般読者が文脈を追える表現を選んだ。
