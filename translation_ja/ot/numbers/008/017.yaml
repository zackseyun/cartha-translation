source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: ja
  text: なぜなら、イスラエルの子らのうち、人であれ家畜であれ、すべての初子はわたしのものである。エジプトの地ですべての初子を打った日に、わたしは彼らをわたしのために聖別した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしのために取り分けた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 〜からである
  rationale: 直前の主張の理由を示す接続詞。日本語では文末の「からである」によって説明・根拠の働きを自然に表せるが、独立提示された節として過度に補わず、本文全体の説明調を保った。
- source_word: לִי
  choice: わたしのものである
  rationale: 所有を表す前置詞句を、明確で自然な日本語の所有述語として訳した。
- source_word: כָל בְּכוֹר
  choice: すべての初子
  rationale: 集合的な単数表現を保ち、「雄」はこの節に明示されていないため補わない。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうち
  rationale: בני ישראל の家族的・契約的な言い回しを保ちつつ、現代日本語で理解できる形にした。
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: 人にも家畜にも
  rationale: אָדָם と בְּהֵמָה の集合的な対比、および反復される前置詞 ב を簡潔な並行表現で示した。בְּהֵמָה はこの初子に関する文脈では「家畜」が自然。
- source_word: בְּיוֹם הַכֹּתִי
  choice: 打った日に
  rationale: 歴史的な時点を示す時間表現と、נכה の直接的な意味を保つ。「打ち殺した」とは明示せず、文脈上の致死的裁きを読者に委ねる。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: 「地」を省かず、ヘブライ語の完全な地理表現を保持した。
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: 彼らをわたしのために聖別した
  rationale: ヒフィル形の「聖なるものとして取り分ける」という祭儀的・神学的含意を「聖別」で保持し、לִי を「わたしのために」と訳した。
theological_decisions:
- issue: אָדָם と בְּהֵמָה の対比
  choice: 人にも家畜にも
  alternative: 人間にも動物にも
  rationale: ここで אָדָם は男性個人ではなく人類の範疇を示すため「人」とした。בְּהֵמָה は広く動物を指し得るが、初子をめぐる律法的文脈では「家畜」が自然である。
- issue: הִקְדַּשְׁתִּי の神聖な意味
  choice: 聖別した
  alternative: 取り分けた
  rationale: 単なる分離ではなく、神に属する聖なるものとして定めたという意味を保つ。「取り分けた」も意味上可能なため脚注に示した。
- issue: 初子に対する神の所有権
  choice: わたしのものである
  alternative: わたしに属する
  rationale: לִי の所有の意味を明確にし、レビ人が初子に代わるという周辺文脈の根拠を示す。
translation_notes:
  register: 明確な現代標準日本語を用い、神の発話にふさわしい簡潔で荘重な調子とした。「初子」「聖別」は聖書文脈で必要な語だが、文構造は平易にした。冒頭の כִּי は前節への理由づけであり、単独節の提示では日本語本文に不自然な接続語を置かず、説明的な断定調に反映した。
