  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: ja
  text: そこで、モーセとアロン、そしてイスラエルの子ら[a]の全会衆は、ヤハウェがモーセにレビ人について命じたすべてのとおりに、レビ人に対してした。イスラエルの子らは、レビ人に対してそのようにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「イスラエルの子ら」。イスラエルの民、すなわち共同体全体を指す定型的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: 行った
  rationale: עשהの広い意味を保ち、前段で命じられた一連の儀礼を特定の動作に狭めない。日本語では目的語との関係がやや硬いが、原文の反復も保持できる。
- source_word: עֲדַת
  choice: 全会衆
  rationale: 契約共同体として集められた民を表す語であり、民数記の公的・共同体的な文脈にふさわしい。כָלも「全」によって明示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の家族的・契約共同体的表現を保持する。「イスラエル人」より字義に近く、現代日本語でも理解可能である。
- source_word: לַלְוִיִּם
  choice: レビ人に／レビ人について
  rationale: 最初の用例は行為の対象として「レビ人に」、命令の内容に関わる二つ目の用例は文脈上「レビ人について」とした。前置詞לの機能差を日本語で自然に表した。
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのとおり
  rationale: 神の命令への全面的かつ正確な従順を表すכֹלと比較・一致のכを簡潔に保持する。
- source_word: צִוָּה
  choice: 命じた
  rationale: 完了した先行命令を日本語の通常の過去形で自然に示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写して保持する。
- source_word: כֵּן
  choice: そのとおり
  rationale: 先に述べた命令との正確な一致を受け直す語として、単なる結果の「こうして」より明確である。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を用いているため、称号へ置換せず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の共同体表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数・家族的表現を保持し、契約共同体としての響きを不必要に平板化しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、律法叙述にふさわしい端正さを保った。原文にあるעשהの反復と「レビ人に」という関係を残したため、意図的にやや定型的な響きがある。脚注を要する実質的な異読はない。
