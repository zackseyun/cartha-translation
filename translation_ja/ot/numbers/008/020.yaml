revisions:
- from: そこで、モーセとアロンとイスラエルの子らの全会衆は、レビ人についてヤハウェがモーセに命じたすべてのとおり、レビ人に行った。イスラエルの子らは、そのとおり彼らに行った。
  to: そこで、モーセとアロン、そしてイスラエルの子ら[a]の全会衆は、ヤハウェがモーセにレビ人について命じたすべてのとおりに、レビ人に対してした。イスラエルの子らは、レビ人に対してそのようにした。
  rationale: 不自然で意味の取りにくい「〜に行った」を「〜に対してした」に改め、原文のעשהが具体的な行為を特定しない点と、その反復を保持した。命令内容を表す後半のלַלְוִיִּםは「レビ人について」とし、神名および命令への完全な一致も維持した。
