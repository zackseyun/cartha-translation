  naturalness: 現行訳の「レビ人に行った」「彼らに行った」は、現代標準日本語では「行く」の移動の意味に読まれやすく、他動的なעשהの行為を自然に表せていない。「レビ人に対して…した」とすれば、原文があえて具体化しない行為内容を保ったまま自然になる。
  terminology: 「ヤハウェ」「レビ人」「全会衆」は適切である。「イスラエルの子ら」は原文の慣用的な家族表現を反映するが、日本語では字義的な子どもだけを指すようにも受け取られうるため、初出に説明脚注を付す。
