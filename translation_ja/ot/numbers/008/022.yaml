  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: ja
  text: その後、レビ人は会見の天幕で、アロンとその子らの前で自分たちの務めを果たすために来た。ヤハウェがレビ人についてモーセに命じたとおり、彼らに対してそのように行った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、この節の主語と動詞の目的語は簡潔に表現されている。「彼らに対して」は「彼らのために」とも訳せる。レビ人に関して定められた儀式や手続きが実施されたことを指す可能性がある。
    reason: כֵּן עָשׂוּ לָהֶם は主語が明示されず、לָהֶם は「彼らに対して」または「彼らのために」と理解できるため。
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 直前の清めと奉献の儀式に続く時間的な展開を、自然な現代日本語で示す。接続の וְ は文脈上この表現に含めた。
- source_word: בָּאוּ הַלְוִיִּם לַעֲבֹד אֶת עֲבֹדָתָם
  choice: レビ人は……自分たちの務めを果たすようになった
  rationale: בוא＋不定詞は、ここでは単なる移動だけでなく、その奉仕を開始したことを表す。「務めを果たす」により、עבד／עֲבֹדָהの語根反復を不自然な日本語にせず、聖所での奉仕という意味を保った。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: イスラエルの礼拝施設を指す定着した表現を用い、前置詞 בְ を場所の「で」とした。
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: アロンとその子らの前に立って
  rationale: לִפְנֵי の空間的表現を保ちつつ、日本語として奉仕の関係が分かる形にした。監督下という含意はあり得るが、本文では断定しない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な形に音写した。
- source_word: עַל הַלְוִיִּם
  choice: レビ人について
  rationale: עַל を命令の対象・関係事項を示す表現として訳した。
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: 人々は彼らに行った
  rationale: 簡潔なヘブライ語の複数主語と לָהֶם を保ち、誰が何をしたかを本文で過度に補わない。「彼らのために」とも解し得るため注記した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を保持し、称号への置換や別の音写を本文に採用しなかった。
- issue: כֵּן עָשׂוּ לָהֶם の主体と行為
  choice: 人々は彼らに行った
  alternative: 彼らのためにそのとおりに行った／彼らに対して定められた儀式を行った
  rationale: 直前の文脈からモーセ、アロン、イスラエルの会衆などが関与したと推測できるが、この節自体は主語と行為内容を明示しないため、曖昧さを残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奉仕」より広く具体的職務を表せる「務め」を採用した。文末の曖昧な節は、不自然さを抑えながら原文の簡潔さと解釈上の余地を維持した。
