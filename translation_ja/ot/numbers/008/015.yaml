  naturalness: 「その後、レビ人は会見の天幕で奉仕する。」は明瞭で自然な現代標準日本語である。「彼らを揺祭としてささげなさい」も、儀礼文脈にふさわしく、直訳的すぎる「揺り動かしなさい」より自然である。
