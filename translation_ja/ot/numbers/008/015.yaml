source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: ja
  text: その後、レビ人は会見の天幕で奉仕する。あなたは彼らを清めなさい[a]。そして、彼らを揺祭としてささげなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「浄めなさい」とも訳せる。ヘブライ語は、ここでは儀礼上の清めを表す。
    reason: lexical_alternative
  - marker: b
    text: 揺祭とは、主の前に儀礼的にささげて示すことをいう。ここではレビ人自身がそのようにささげられる。
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 直前の聖別儀礼に続く段階を示す時間表現。簡潔で自然な現代日本語とした。
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: レビ人は…入る
  rationale: בוא は「来る」「入る」の双方を表し得るが、ここでは会見の天幕に関わる奉仕を始める文脈なので「入る」が自然。未来・指示的な意味は文脈に委ねた。
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: 会見の天幕で奉仕するために
  rationale: עבד の祭儀的用法を「奉仕する」とし、目的を示す不定詞を保持した。目的語標識を伴う「会見の天幕」は、日本語では場所・職務上の関係を自然に表す「で」とした。
- source_word: וְטִהַרְתָּ אֹתָם
  choice: あなたは彼らを清め
  rationale: טהר はこの文脈で儀礼上の清めを指す。「清める」は現代日本語として明瞭で、祭儀的含意も保つ。
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: 奉献物として揺り動かしなさい
  rationale: נוף のヒフィルと תְּנוּפָה の同根表現が示す祭儀的動作を「揺り動かす」で保持しつつ、レビ人自身が主の前に奉献されることが伝わるよう「奉献物として」とした。
theological_decisions:
- issue: レビ人の聖別に関する祭儀用語
  choice: 「清め」「奉献物として揺り動かす」という具体的な祭儀表現を残す。
  alternative: 「聖別してささげる」など、任命・奉献を一般化した表現。
  rationale: 本文は単なる任命ではなく、特定の清めと揺祭の儀礼を描く。後代の神学概念で一括せず、原文の具体性と、レビ人自身が揺り動かされるという印象的な表現を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「会見の天幕」「レビ人」は聖書用語として一般的な形を採用した。命令形は後半の二動詞に明示し、前半はヘブライ語の未完了形を自然な叙述として訳した。
