id: NUM.8.3
reference: Numbers 8:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: ja
  text: アロンはそのとおりにした。すなわち、ヤハウェがモーセに命じたとおり、燭台の正面に向けて[a]そのともしびを据えた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「燭台の正面と向かい合うように」または「燭台の正面のほうへ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「そのともしびを灯した」。ヘブライ語の動詞は直訳すると「上らせた」であり、ここでは灯火を据えることとも、灯すこととも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: アロンはそのとおりにした
  rationale: 直前の命令に従って行動したことを表す慣用句を、簡潔で自然な現代日本語にした。
- source_word: אֶל מוּל פְּנֵי
  choice: 正面に向けて
  rationale: 燭台の面・前方を基準とする方向性を示しつつ、厳密な位置関係を断定しない表現とした。
- source_word: הַמְּנוֹרָה
  choice: 燭台
  rationale: 幕屋の器具を指す一般名詞として、音写ではなく日本語で定着した具体的な名称を用いた。
- source_word: הֶעֱלָה
  choice: 据えた
  rationale: 使役形の基本的な『上げる』という意味を背景に、ここでは直前の節にある灯火の配置と方向を実行したこととして自然に表した。ただし『灯した』という解釈も脚注に残した。
- source_word: נֵרֹתֶיהָ
  choice: そのともしび
  rationale: 接尾辞が燭台を受けることを『その』で示し、נֵרを器具そのものにも光にも寄りすぎない『ともしび』とした。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 神の命令への正確な服従を示す比較表現を明確に保ち、文末を自然に整えた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で音写した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された固有の神名を称号へ置換せず、一般的な学術的音写で示した。
- issue: הֶעֱלָה と灯火の関係
  choice: 据えた
  alternative: 灯した
  rationale: 直前の命令が灯火の向きに焦点を置くため配置を本文に採ったが、この動詞は灯火をともす意味にも理解できるため、その可能性を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用具には一般読者にも理解しやすい「燭台」を用い、動詞と方向表現に残る原文の曖昧さは脚注で保持した。
