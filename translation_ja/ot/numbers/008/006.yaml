source:
  edition: WLC
  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: ja
  text: 「イスラエルの人々[a]の中からレビ人を取り、彼らを清めなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子ら」。または「イスラエル人」「イスラエルの民」。
    reason: בני ישראל の字義的な親族表現と、本文で採用した集合的・自然な日本語表現との関係を示すため。
lexical_decisions:
- source_word: קַח
  choice: 取り
  rationale: לקחの命令形で、モーセにレビ人をイスラエルの中から取り分けるよう命じている。後続する「中から」と自然につながり、原文の簡潔さも保つ。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: 幕屋の奉仕に任じられるレビ部族の人々を指す、日本語聖書で定着した明確な呼称。
- source_word: מִתּוֹךְ
  choice: 中から
  rationale: より大きな集団の内部から取り出すことを示す。「イスラエルの子らの中から」は分離・選出の意味を自然な日本語で表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの親族的・契約的表現を保った。「イスラエル人」「イスラエルの民」も文脈上可能だが、ここでは原文の形を明示できる。
- source_word: וְטִהַרְתָּ אֹתָם
  choice: 彼らを清めなさい
  rationale: טהרはこの文脈で儀礼上の清めを表す。「清める」は宗教的文脈にも適し、現代日本語として簡潔で理解しやすい。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 集合的な契約共同体を指す一方、ヘブライ語の親族的表現にも意味があるため、それを本文に残した。男性だけを限定的に指すと断定せず、原文の表現を保持する。
- issue: טהר の清めの性質
  choice: 清める
  alternative: きよめる／清くする
  rationale: レビ人の奉仕への任命に伴う儀礼的な清めを示すが、本文だけでその手順や神学的範囲を過度に限定しない表現とした。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。「取って」より命令の連続性が明瞭な「取り、…清めなさい」を採用した。「イスラエルの子ら」はやや聖書的な表現だが、原文の親族的ニュアンスを保ちつつ一般読者にも理解可能である。
