id: NUM.8.10
reference: Numbers 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: ja
  text: あなたはレビ人をヤハウェの前に連れて来る。イスラエルの子ら[a]は、レビ人の上に手を置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。ヘブライ語は「イスラエルの子ら」で、イスラエルの民を集合的に指す定型表現。
    reason: 語句の別訳と集合的意味の明示
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 連れて来る
  rationale: קרבのヒフィル形は「近くに来させる」「進み出させる」を意味する。ここでは儀礼のためにレビ人をヤハウェの前へ導くことを、明瞭で自然な日本語で表した。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: 部族・氏族名לויの定冠詞付き複数形に対応する、日本語聖書で定着した呼称。日本語では複数性を文脈上明らかなまま無標で表せる。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵיの空間的・臨在的な意味を保ち、儀礼的な場面にも自然な表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に記された契約の固有名יהוהを音写し、一般名詞的な称号へ置き換えなかった。
- source_word: וְסָמְכוּ
  choice: 手を置く
  rationale: סמךと「手」の組み合わせは、儀礼的に手を置く行為を表す定型表現である。日本語でも意味が明瞭な慣用表現を用いた。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な形を本文に保ちつつ、これがイスラエルの民を集合的に指すことを脚注で明示した。
- source_word: יְדֵיהֶם
  choice: 手
  rationale: 原文は接尾辞付き複数形「彼らの手」だが、日本語の「手を置く」は各人の手による行為を自然に表し、冗長な所有表現を避けられる。
- source_word: עַל הַלְוִיִּם
  choice: レビ人の上に
  rationale: עַלの位置関係を明示し、按手の身体的な行為を保った。
theological_decisions:
- issue: 契約名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の契約名を直接用いているため、その固有名としての性格を保つ音写を採用した。
- issue: בְנֵי יִשְׂרָאֵלの集合的表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の男性複数形による定型的表現を本文で可視化しながら、現代の読者が男性だけに限定された表現と誤解しないよう、集合的意味を脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、律法上の指示として簡潔で端正な文体にした。日本語では不要な複数標識や所有代名詞を避けつつ、「イスラエルの子ら」という原文特有の表現は脚注付きで保持した。
