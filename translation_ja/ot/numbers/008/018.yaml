  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: ja
  text: わたしは、イスラエルの子ら[a]のうちのすべての長子に代えて、レビ人を取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。ヘブライ語では「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: わたしは……取った
  rationale: לקחのQal・wayyiqtol一人称単数形。任務のために選び取る文脈だが、解釈を加えすぎず、基本的な動詞の意味を保った。接続の ו は、日本語では文脈上独立した「そして」を置かなくても連続性が伝わるため、明示しなかった。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: 定冠詞付き複数形で、レビ族に属する者たちを指す。日本語で定着した簡潔な呼称を用いた。
- source_word: תַּחַת
  choice: に代えて
  rationale: 空間的な「下に」ではなく、ここでは代替・代理を表すため。
- source_word: כָּל בְּכוֹר
  choice: すべての長子
  rationale: 単数形 בְּכוֹר に付く כָּל の分配的な意味を表す。「男子」は文脈上想定され得るが、この節の語形自体には明記されていないため補わなかった。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうち
  rationale: בְּנֵי יִשְׂרָאֵל の男性複数形を保ち、前置詞 בְּ は集団内の範囲を示す「のうち」とした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の「イスラエルの子ら」という形を本文に残しつつ、この慣用句が共同体としてのイスラエルを指し得ることを脚注で示した。
- issue: レビ人と長子の関係
  choice: 長子に代えてレビ人を取った
  alternative: 長子の代わりとしてレビ人を選んだ
  rationale: תַּחַת の代替関係を明確にしながら、動詞 לקח を「選んだ」と解釈的に限定せず「取った」とした。
translation_notes:
  register: 明瞭で現代的ながら、神の発言としての簡潔で荘重な調子を保った。「取った」は原文の具体的な語感を残すため採用した。
