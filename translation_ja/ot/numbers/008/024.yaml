  terminology: 「レビ人」「会見の天幕」は適切で一貫している。「出仕する」はここでは聖所の割り当てられた務めのために赴くことを表す、明瞭でやや格調ある現代日本語である。脚注の「奉仕の隊列に加わる」は原文の軍務的な含みを過度に具体化しており、「任務に就く」「務めを果たす」とするほうが安全である。
