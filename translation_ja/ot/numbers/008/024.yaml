  source_fidelity: 全体として規定の導入、二十五歳という年齢下限、会見の天幕に関する奉仕という内容を正しく伝えている。ただし、יָבוֹא は単に天幕の内部へ「入る」ことを明示する語ではなく、任務のために来る・出仕することを表すため、「入る」は場所的 प्रवेशを含意しうる。また、脚注が説明する לִצְבֹא צָבָא へのアンカーは文末ではなく該当句に置くべきである。
