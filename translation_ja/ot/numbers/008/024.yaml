base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: ja
  text: レビ人については、次のとおりである。二十五歳以上の者は、会見の天幕での奉仕の任務[a]に就くために出仕する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「任務に就く」「務めを果たす」とも訳せる。ヘブライ語の表現には軍務を思わせる響きがあり、定められた任務に就くことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: レビ人については、次のとおりである
  rationale: レビ人に適用される規定を導入する構文として、法規的な調子を保ちながら現代日本語で自然に表した。
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十五歳以上の者
  rationale: 奉仕を始める年齢の下限を示すヘブライ語の慣用表現を簡潔かつ正確に表した。
- source_word: יָבוֹא
  choice: 入る
  rationale: レビ人を集合的に扱いながら単数形を用いる原文を、日本語では「者」を受ける形で表した。ここでは務めに加わることを示す。
- source_word: לִצְבֹא צָבָא
  choice: 奉仕の任務に就く
  rationale: 軍務を思わせる語を重ねた奉仕・任務の慣用句であるため、祭儀的文脈に合う「奉仕」と、任務性を示す「任務に就く」を組み合わせた。軍事的な響きは注で示した。
- source_word: בַּעֲבֹדַת אֹהֶל מוֹעֵד
  choice: 会見の天幕で奉仕
  rationale: עֲבֹדָה の割り当てられた務め・奉仕という意味と、אֹהֶל מוֹעֵד の聖所名を明確で定着した日本語にした。
theological_decisions:
- issue: 集合的な主語に続く単数動詞
  choice: 二十五歳以上の者は……入る
  alternative: 二十五歳以上のレビ人たちは……加わる
  rationale: 原文はレビ人全体への規定の中で単数動詞を用いている。「者」を用いることで、個々のレビ人に適用される法規的な単数性と集合的な文脈の双方を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、規定文にふさわしい簡潔で荘重な調子とした。「奉仕の任務に就く」によって原文の奉仕と任務の両面を保ち、軍事的な含みは脚注で補った。
