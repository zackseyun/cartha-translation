  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は神の固有名「יהוה（YHWH）」。伝統的に「主」と訳される。
