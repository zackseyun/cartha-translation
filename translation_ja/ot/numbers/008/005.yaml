lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進めつつ神の発言を導入する定型表現。日本語では、後続する発言内容を自然に導く「告げた」が明瞭で品位もある。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語。現代日本語聖書で広く通用する伝統的な代読「主」を本文に用い、原語について脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞と固有名を、自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: （「告げた」に含める）
  rationale: 直後の直接話法を導く定型的な不定詞。独立して「言って」とすると日本語では冗長になるため、「告げた」に機能を含めた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主（脚注で「原文は神の固有名יהוה」）
  alternative: ヤハウェ
  rationale: 本文の自然さと日本語の伝統的な聖書用語を保ちながら、固有名であることを脚注で透明に示す。特定の発音再建を本文で断定しない。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。ヘブライ語の定型句「語って言った」を逐語的に重ねず、日本語の自然な発話導入としてまとめた。
