  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: ja
  text: ただし、会見の天幕で兄弟たちとともに務め、任務を果たすことはできる[a]。しかし、労役に従事してはならない[b]。レビ人については、その務めに関して、このようにしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「任務を果たす」は、委ねられた責任・持ち場を守り遂行することを意味する。狭い意味で「見張りの務めをする」と理解することもできる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「奉仕をしてはならない」。原文は、引き続き許される務めへの参与と、免除される通常の労役とを対照させている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת אֶת־אֶחָיו
  choice: 兄弟たちとともに務めに当たり
  rationale: שרתは聖所に関わる務めを表し、後半のעֲבֹדָה／עבדが指す通常の奉仕の仕事と区別される。אֶת־אֶחָיוは文脈上、仲間のレビ人とともに務めるという協働の意味に自然に表した。前節で通常の奉仕から退くことを命じた後の許容事項なので、「ことはできる」とした。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: イスラエルの聖所を指す定型表現として、明瞭で定着した訳語を用いた。
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: 任務を守る
  rationale: 同根語を重ねた表現で、委ねられた責任を果たし、維持することを意味する。「見張る」だけに狭めず、原文の責任・当番の幅を保った。
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: しかし、奉仕の仕事をしてはならない
  rationale: 名詞עֲבֹדָהと動詞עבדの反復による強調を自然な日本語で表した。前半で許される参与と、年齢により免除される通常の実務との対照を示すため、「務めに当たる」と訳し分けた。
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: レビ人…について、あなたはこのようにしなければならない
  rationale: 規定を締めくくる指示として、二人称単数と義務性を保った。
- source_word: בְּמִשְׁמְרֹתָם
  choice: それぞれの任務について
  rationale: 複数形接尾辞を踏まえ、レビ人に割り当てられた諸任務を指すことが分かるようにした。
theological_decisions:
- issue: 年齢の上限に達したレビ人に許される参与と禁じられる奉仕の区別
  choice: 仲間とともに任務を守る参与は認められるが、通常の奉仕の仕事には就かない。
  alternative: 年齢の上限に達した後は、あらゆる奉仕が全面的に禁じられる。
  rationale: 前半のשרתと後半のעֲבֹדָה／עבדの明示的な対照は、参与の全面禁止ではなく、許される務めと免除される仕事との区別を示す。訳文でも異なる表現を用いて、その緊張関係を残した。
- issue: לִשְׁמֹר מִשְׁמֶרֶתの範囲
  choice: 委ねられた任務を守り果たすことを広く指す。
  alternative: 狭義の警備・見張りだけを指す。
  rationale: この同根表現は割り当てられた責任の履行を表し得るため、警備だけに限定しなかった。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた規定文の文体とした。「会見の天幕」「レビ人」は聖書で定着した語を用い、שרתとעבדの違いは「務めに当たる」と「奉仕の仕事をする」で表した。
