  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: ja
  text: わたしは、イスラエルの子らの中からレビ人をアロンとその子らに与えた。[a] 彼らは、アロンとその子らに与えられた者である。それは、彼らが会見の天幕でイスラエルの子らの務めを行い、イスラエルの子らのために贖いを行うためである。こうして、イスラエルの子らが聖所に近づくとき、イスラエルの子らの間に災いが起こらないようにするのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、「わたしは……レビ人を、アロンとその子らに与えられた者として与えた」。ヘブライ語は「与える」と同じ語根を繰り返し、レビ人がアロンとその子らに与えられた者であることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: 与えられた者として与えた
  rationale: 同じ語根「与える」の反復を日本語でも明示し、レビ人自身がアロンとその子らに与えられたことを保つ。多少特徴的な表現だが、原文の強調を伝える。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの中から
  rationale: 集団内部からの選び出しを表す מִתּוֹךְ と、契約共同体を指す בְּנֵי יִשְׂרָאֵל の形を保った。
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: 務めを行い
  rationale: 動詞と同語根名詞の組み合わせが示す任務遂行の意味を、自然な現代日本語で表した。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: 幕屋の定型的名称として、神と会う場所という מוֹעֵד の文脈的意味を明瞭に示す。
- source_word: וּלְכַפֵּר עַל
  choice: のために贖いをする
  rationale: 祭儀的な כפר の意味を保ちつつ、その仕組みやレビ人の役割を本文以上に限定しない。
- source_word: נֶגֶף
  choice: 災い
  rationale: 神聖な領域への不適切な接近に伴う打撃・疫病を含み得る語なので、特定の病気に狭めない表現とした。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: この幕屋の文脈では具体的な神聖領域を指すため、日本語の祭儀用語として自然な「聖所」を採用した。
theological_decisions:
- issue: レビ人によるイスラエルのための贖い
  choice: レビ人がイスラエルの子らのために贖いをする
  alternative: レビ人は実務的奉仕のみを行い、贖いには関与しない
  rationale: 原文はレビ人の務めに וּלְכַפֵּר עַל を明示的に含める。後代の体系的区分によって弱めず、同時に贖いの具体的方法も補わなかった。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の男性複数形による契約共同体の呼称を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発話と祭儀的文脈にふさわしい格調を保った。「与えられた者として与えた」は通常より硬いが、原文の意図的な語根反復を本文に残すため採用し、脚注で説明した。
