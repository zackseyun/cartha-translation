  to: わたしは、イスラエルの子らの中からレビ人をアロンとその子らに与えた。[a] 彼らは、アロンとその子らに与えられた者である。それは、彼らが会見の天幕でイスラエルの子らの務めを行い、イスラエルの子らのために贖いを行うためである。こうして、イスラエルの子らが聖所に近づくとき、イスラエルの子らの間に災いが起こらないようにするのである。
