  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: ja
  text: 彼らはイスラエルの子らの中から、完全にわたしにゆだねられた者たちだからである。[a] イスラエルの子らのうち、胎を最初に開く者、すなわちイスラエルの子らのうちのすべての初子に代えて、[b][c] わたしは彼らをわたしのものとして取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「ゆだねられた」を繰り返して強調している。「確かにわたしにゆだねられた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「胎を最初に開く者」は、母胎から最初に生まれる者、すなわち初子を指すヘブライ語の表現。
    reason: lexical_alternative
  - marker: c
    text: 「イスラエルの子ら」は「イスラエルの民」または「イスラエル人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: 完全にわたしにささげられた
  rationale: 受動分詞の反復による強調を、不自然な反復を避けつつ「完全に」で表した。「ささげられた」は、レビ人が神に属する者として引き渡された意味を明確にする。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの中から
  rationale: מִתּוֹךְ の集団内部からの選び出しを「中から」で表し、בְּנֵי יִשְׂרָאֵל の親族的表現も保持した。
- source_word: תַּחַת
  choice: に代えて
  rationale: ここではレビ人が初子の代わりとされる代替関係を示す。
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: 胎を最初に開く者
  rationale: 初めて母胎から出る者を指すヘブライ語の比喩を保ちつつ、「最初に」を補って現代日本語で意味が伝わるようにした。
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうち、すべての初子
  rationale: 直前の「胎を最初に開く者」を同格的に説明する句として訳し、範囲を明確にした。
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: わたしは彼らをわたしのものとして取った
  rationale: 完了した神の取得と、末尾の לִי が示す帰属を明示した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の男性親族表現を保持した。ただし文脈上はイスラエル共同体を指すため、その点を脚注で示した。
- issue: レビ人と初子の関係
  choice: 「に代えて」により代替関係を明示
  alternative: 「の代わりに」
  rationale: תַּחַת の意味を保ち、レビ人がイスラエルの初子に代わって神のものとされたという本文の主張を、追加の教理的説明なしに表した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ささげられた」で宗教的献身と神への帰属を自然に示し、「わたしのものとして取った」で原文末尾の所有・専属のニュアンスを保持した。脚注記号は対応箇所にすべて配置した。
