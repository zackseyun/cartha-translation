  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: ja
  text: レビ人たちは二頭の雄牛の頭に手を置きなさい。あなたは、その一頭を罪のためのささげ物[a]として、もう一頭を全焼のささげ物としてヤハウェに献げ、レビ人たちのために贖いを行いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清めのためのささげ物」。ヘブライ語 חַטָּאת は、祭司的文脈では「罪のためのささげ物」を指すとともに、祭儀的な清めに関わるささげ物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: 手を置く
  rationale: 犠牲動物に手を当てる儀礼的行為を表す定型的な日本語。単なる接触ではなく、原語 סמך の具体的動作を保つ。
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: 二頭の雄牛の頭に
  rationale: 「雄牛」は複数であり、直前の文脈と後半の「一頭／もう一頭」から二頭と分かる。単数形の「頭」は各個体への分配的意味として自然に表した。
- source_word: וַעֲשֵׂה
  choice: 献げ
  rationale: 祭儀の文脈で עשה は供え物を『造る』のではなく、祭儀としてささげることを意味するため。命令の受け手が単数であることは「あなた」で保持した。
- source_word: חַטָּאת
  choice: 罪のきよめのささげ物
  rationale: חטאת が罪との関係と祭儀的な浄化の双方を帯び得ることを、現代日本語で過度に一方へ限定せず表した。簡潔な慣用訳「罪祭」は脚注の選択肢として示す。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 供え物全体を焼いて献げる祭儀を明瞭に示し、עֹלָה の専門的意味を普通の読者にも理解しやすくした。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に明記された神名 יהוה を称号に置き換えず、固有名として音写した。
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: レビ人たちのために贖いを行う
  rationale: 祭司的文脈における כפר の神学的・祭儀的な幅を「贖いを行う」で保ち、特定の贖罪理論に狭めない。על は受益・対象を「ために」で表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いているため、それを日本語で一般的な学術的音写により明示した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のきよめのささげ物
  alternative: 罪祭、きよめのささげ物
  rationale: この語には罪に関わる供え物という面と、祭儀的浄化の面がある。本文では両面を伝える表現を採り、脚注で伝統的な短い名称を示した。
- issue: כפר の意味
  choice: 贖いを行う
  alternative: 罪を贖う、きよめを行う
  rationale: 目的語はレビ人たちであり、本文だけでは贖いの作用を単一の理論に限定すべきでないため、祭儀的な包括性を持つ表現とした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ささげ物」はひらがなを交えて読みやすくし、祭儀用語は「全焼のささげ物」「贖いを行う」として意味を明示した。原文の命令形は、日本語の法令的で硬すぎる「〜しなければならない」を避け、文脈上の指示として簡潔に表した。
