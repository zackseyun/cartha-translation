  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセに語り、こう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、神の固有名を表す四文字語「YHWH」。伝統的には「主」と訳される。
    reason: 原文の神名を本文で音写し、伝統的な訳語との関係を明示するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語って言われた
  rationale: 接続形は物語を先へ進める。日本語では文頭の「そして」を置かずとも連続性が自然に伝わる。דבר と後続の לאמר の定型を、重すぎない形で保った。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神名を示す四文字語YHWH。日本語聖書の伝統と朗読時の自然さを考慮して「主」とし、原文が固有の神名であることを脚注で明示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す אֶל を自然な現代日本語の助詞「に」で表し、人名は定着した日本語表記とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する発言内容を導入する定型句。直訳的な「言って」より自然で格調ある日本語としつつ、次節に言葉が続く構造を示した。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: 主[a]
  alternative: ヤハウェ
  rationale: 本文では日本語として広く定着した「主」を用い、脚注に原文がYHWHであることを示すことで、称号としてのみ理解されないようにした。発音の再建には一定の不確かさがあるため、本文で「ヤハウェ」と断定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。ヘブライ語の発話導入定型をある程度保持しつつ、文頭の接続詞は日本語では冗長になるため省いた。
