    issue: 「語って言われた」 is stylistically and syntactically unnatural.
    rationale: The construction sounds redundant in modern Japanese. Recasting it as 「語り、こう言われた」 preserves the Hebrew speech-introduction formula while naturally introducing the following quotation.
