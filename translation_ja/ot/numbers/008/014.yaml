  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: ja
  text: こうして、あなたはレビ人をイスラエルの子らの中から取り分けなさい[a][b]。レビ人はわたしのものとなる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「取り分ける」は「分ける」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの子ら」は「イスラエル人」とも訳せる。ヘブライ語では「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: c
    text: または「レビ人はわたしに属する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: こうして、あなたは…分けなければならない
  rationale: ヒフィル形は「分ける、区別する」を意味する。文脈上の手順・帰結を接続部の「こうして」で示し、命令的な完了形の効力を「なければならない」で表した。
- source_word: אֶת הַלְוִיִּם
  choice: レビ人を
  rationale: 定冠詞付き複数名詞を、現代日本語で定着した民族・部族名称「レビ人」とした。
- source_word: מִתּוֹךְ
  choice: …の中から
  rationale: より大きな集団の内部から取り分ける意味を、自然な現代日本語で表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの親族的表現を保ち、単に「イスラエル人」と平板化しない。「子ら」は集団を指す自然で格調ある聖書語として用いた。
- source_word: וְהָיוּ לִי
  choice: わたしのものとなる
  rationale: היה＋לִי が示す所有・特別な帰属を表す。明示されていない「奉献する」などの祭儀的語彙は加えない。
- source_word: הַלְוִיִּם
  choice: レビ人は
  rationale: 原文の反復を代名詞に置き換えず、レビ人の帰属を強調する構造を保った。
theological_decisions:
- issue: レビ人の身分を単純な所有・帰属として訳すか、祭儀的な聖別として訳すか
  choice: レビ人はわたしのものとなる
  alternative: レビ人はわたしに属する／レビ人はわたしにささげられる
  rationale: לִי を伴う היה は直接には「わたしのものとなる、わたしに属する」という帰属を示す。周辺文脈には祭儀的な取り分けがあるが、この節自体に「聖別」「奉献」の明示的語彙はないため、解釈を本文へ織り込まない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「イスラエルの子ら」で原文の親族的表現を保持した。神の発話における一人称は「わたし」とした。原文の二つの節を日本語では二文に分け、反復と強調を読み取りやすくした。
