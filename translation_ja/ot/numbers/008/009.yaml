  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: ja
  text: それから、あなたはレビ人を会見の天幕の前に連れて来て、イスラエルの子ら[a]の全会衆を集めなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人」。ヘブライ語では「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: それから、あなたは……連れて来て
  rationale: קרבのヒフィル形は「近づける」「連れて来る」を意味する。ここではレビ人を聖所の前へ導く具体的な動作を、自然な現代日本語で表した。冒頭の「それから」は、手順の進行を示す接続のוְを反映する。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: レビ族に属し、聖所の務めのために取り分けられた人々を指す標準的な呼称。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 空間的に「面前に」「前方に」を表す語であり、会見の天幕の前という儀礼上の位置を簡潔に示す。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための聖所を指す定着した訳語で、語の祭儀的な意味を保つ。
- source_word: וְהִקְהַלְתָּ
  choice: 集めなければならない
  rationale: קהלのヒフィル形は共同体を招集することを意味する。命令的な手順を現代日本語で明確に表した。
- source_word: כָּל עֲדַת
  choice: 全会衆
  rationale: עֵדָהはイスラエルの共同体、特に招集された会衆を指す。כָּלは「全」で表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の父祖名に結びついた「イスラエルの子ら」という表現を保ちつつ、複数を「子ら」で明示した。文脈上はイスラエル人共同体全体を指す。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: この句は文法上、男性複数の「子ら」という形を取りながら、契約共同体を集合的に指す。本文では原文の系譜的表現を保持し、より自然な集合呼称を脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら、祭儀的な場面にふさわしい格調を保った。「会見の天幕」「全会衆」は民数記の文脈で一貫して理解しやすい用語である。脚注記号は、その説明対象である「イスラエルの子らの全会衆」の直後に置いた。
