    rationale: この連語は字義上「罪の水」であり、祭儀文脈では清めに用いる水を指す。本文で「罪を清める」とすると、儀礼的不浄との関係を含む語の幅が弱まり得る。
  - severity: low
    issue: 「全身にかみそりを当てさせ」がやや不自然
    rationale: 原文の「かみそりを全身に通らせる」という慣用表現が指す剃毛を、自然な現代日本語で明示できる。
  revised_text: 彼らを清めるために、彼らに次のようにしなさい。清めの水[a]を彼らに振りかけ、全身の毛をそらせ、衣服を洗わせなさい。そうすれば、彼らは清くなる。
