  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: ja
  text: 彼らを清めるために、彼らに次のようにしなさい。清めの水[a]を彼らに振りかけ、全身の毛をそらせ、衣服を洗わせなさい。そうすれば、彼らは清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪の水」。直訳は「罪の水」。חַטָּאת は「罪」のほか、罪や汚れを除くための清め、また罪のきよめの供え物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם לְטַהֲרָם
  choice: 彼らを清めるために、彼らに次のようにしなさい
  rationale: וְכֹה の手順を導入する働きと、תַעֲשֶׂה の単数命令の調子を明確な現代日本語で表した。טהר はここではレビ人の儀礼的な清めを指すため、「清める」とした。
- source_word: הַזֵּה עֲלֵיהֶם
  choice: 彼らに振りかけ
  rationale: הזה の使役形は儀礼において液体を振りかける行為を表す。「注ぐ」ではなく「振りかける」が具体的な動作に対応する。
- source_word: מֵי חַטָּאת
  choice: 罪を清めるための水
  rationale: 字義的には「罪の水」だが、חַטָּאת は罪、罪の除去・清め、罪のきよめの供え物に関わり得る。本文では水の儀礼上の目的を自然に示しつつ、「罪の供え物の水」とは断定しなかった。別の理解は脚注に残した。
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: 全身にかみそりを当てさせ
  rationale: 直訳的な「すべての肉の上にかみそりを通らせる」は日本語では不自然なため、全身の毛をそる儀礼的動作が分かる表現とした。使役的な形は「当てさせ」で保った。
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: 衣服を洗わせなさい
  rationale: כבס は特に衣類を洗うことを表す。前後と同じく、清められる者たちに行わせる指示として自然な日本語に整えた。
- source_word: וְהִטֶּהָרוּ
  choice: こうして彼らは身を清める
  rationale: 再帰的な形と、一連の行為の結果・完了を示す流れを「こうして」「身を清める」で表した。単なる衛生行為ではなく儀礼的清めであることも保たれる。
theological_decisions:
- issue: レビ人の任職における טהר と חטאת の性質
  choice: 具体的な儀礼上の清めとして訳し、道徳的な罪の赦しだけに限定しない
  alternative: טהר を一貫して専門的な「浄化」とし、מֵי חַטָּאת を「罪の供え物の水」と明示する
  rationale: 文脈はレビ人を奉仕のために清める儀礼である。חטאת の語義には幅があるため、後代の教理概念や特定の供え物との関係を本文で断定せず、語義上の曖昧さを脚注で示した。
translation_notes:
  register: 明確で品位ある現代標準日本語。儀礼の具体的な手順が一般読者に伝わるようにしつつ、「清め」という聖書的・祭儀的な語感を維持した。指示を受ける単数の「あなた」は日本語では明示せず、単数命令を「しなさい」で表した。
