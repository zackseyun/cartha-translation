base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: ja
  text: 彼らは若い雄牛一頭と、その穀物のささげ物、すなわち油を混ぜた上質の小麦粉を取る。そして、あなたは罪のためのささげ物[a]として、もう一頭の若い雄牛を取りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのためのささげ物」。ヘブライ語 חַטָּאת は、祭司制度の文脈では、罪のためのささげ物、または清めのためのささげ物を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: 彼らは……取る
  rationale: 儀礼上の指示が続く文脈で、接続詞を伴う完了形を指示の流れとして訳した。後半の二人称単数形との人称の違いも保った。
- source_word: פַּר בֶּן בָּקָר
  choice: 若い雄牛一頭
  rationale: 直訳的には「牛の子である雄牛」だが、自然な現代日本語で若い雄牛を指す表現とした。「一頭」は後に出る「もう一頭」との対応を明確にする。
- source_word: וּמִנְחָתוֹ
  choice: それに添える……穀物のささげ物
  rationale: 祭儀文脈の מִנְחָה を穀物のささげ物とし、三人称男性単数接尾辞が最初の雄牛を指すことを「それに添える」で明示した。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 供え物に用いる精製された良質の小麦粉を、一般読者に分かりやすい表現で示した。
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: 油を混ぜた
  rationale: 供え物の調製法を示す定型表現を、自然で明瞭な現代日本語にした。
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: そして、あなたは……もう一頭の若い雄牛を取りなさい
  rationale: 動詞が二人称男性単数に変わる点を「あなた」で保持し、שֵׁנִי は最初の雄牛に続く別の一頭として「もう一頭」と訳した。
- source_word: לְחַטָּאת
  choice: 罪のためのいけにえ
  rationale: 祭司文書における伝統的な「罪のためのささげ物」の意味を、現代の一般読者にも理解しやすく表した。清めの機能を強調する訳も脚注に残した。
theological_decisions:
- issue: 祭儀用語 חַטָּאת の訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのためのいけにえ
  rationale: この語は「罪」と、それに関わる祭儀的なささげ物の双方を表し得る。本文では伝統的で理解しやすい訳を採用しつつ、祭儀的な清めという機能を示す別訳を脚注に掲げ、意味を一方に限定しないようにした。
translation_notes:
  register: 明瞭で現代的ながら、祭儀規定にふさわしい落ち着いた文体とした。前半の三人称複数から後半の二人称単数への移行を保ち、「穀物のささげ物」「いけにえ」を用いて異なる供え物を区別した。
