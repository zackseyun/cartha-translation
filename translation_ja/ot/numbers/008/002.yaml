  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: ja
  text: アロンに告げて、こう言いなさい。「ともしびを据えるとき[a]、七つのともしびが燭台の前方に向けて光を放つようにしなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ともしびに火をともすとき」。ヘブライ語の動詞は字義的には「上らせる」を意味し、ここでは、ともしびを所定の位置に据えること、または火をともすことを指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֵלָיו
  choice: アロンに告げて、こう言いなさい
  rationale: 二つの発話動詞を完全には重複させず、命令とそれに続く直接話法を自然で格調ある現代日本語にした。
- source_word: בְּהַעֲלֹתְךָ
  choice: ともしびを据えるとき[a]
  rationale: 動詞は字義的には「上らせる」で、この文脈では灯火を所定の位置に据えることとも、火をともすこととも解し得る。本文では後続する照射方向とのつながりを重視し、「据える」としたうえで別解を脚注に残した。
- source_word: הַנֵּרֹת / שִׁבְעַת הַנֵּרוֹת
  choice: ともしび／七つのともしび
  rationale: נֵרはここでは燭台に置かれる個々の灯火を指す。「ともしび」は一般読者に分かりやすく、祭具としての文脈にもなじむ。
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: 燭台の前方を
  rationale: אֶל מוּל פְּנֵיが示す、燭台の正面ないし前方へ向かう方向性を簡潔に表した。単に「燭台の前で」とせず、光の向きを明示した。
- source_word: יָאִירוּ
  choice: 照らすようにしなさい
  rationale: 使役形の「光を与える、照らす」と、この発話が設備の配置に関する命令であることを自然な日本語で表した。
- source_word: הַמְּנוֹרָה
  choice: 燭台
  rationale: 音写せず、幕屋の照明用祭具であることが明瞭な一般的訳語を用いた。
