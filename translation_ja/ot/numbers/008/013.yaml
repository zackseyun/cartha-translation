  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: ja
  text: あなたはレビ人をアロンの前、またその息子たちの前に立たせ、彼らを奉献物としてヤハウェに差し出しなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「彼らをヤハウェへの揺り動かす奉献物として揺り動かしなさい」。原文は、儀礼的に揺り動かして提示することを表す動詞と、それと同根の名詞を重ねている。
    reason: 儀礼用語の字義と、原文における動詞と同根名詞の反復を、原文の構文により忠実な形で示すため。
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: 立たせ
  rationale: עמדのヒフィル形は「立つようにさせる」「所定の位置に立たせる」という使役の意味を表す。儀式のためにレビ人をアロンとその息子たちの前に置く場面を自然かつ具体的に示す。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: イスラエルのレビ部族に属する人々を指す標準的な日本語表記。
- source_word: לִפְנֵי
  choice: 〜の前に
  rationale: 空間的な位置と、儀式において相手の前に出されることの両方を保持する。原文で二度繰り返される語を「アロンの前、またその息子たちの前に」と反映した。
- source_word: בָנָיו
  choice: その息子たち
  rationale: 接尾辞はアロンを指し、בניםはこの祭司職の文脈では男性の子らを意味する。
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: 彼らを奉献物として……差し出しなさい
  rationale: נוףのヒフィル形と同根の名詞תנופהを用いた儀礼表現。人であるレビ人を実際に物のように振るとの誤解を避けつつ、ヤハウェへの正式な奉献・提示を明確にした。同根語の反復と動作の字義的可能性は脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: לは奉献の向かう相手を示す。יהוהは固有の神名として「ヤハウェ」と表記した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を普通名詞的な称号に置き換えず、神名として明示する。
- issue: レビ人に対する儀礼動作の表現
  choice: 奉献物としてヤハウェに差し出す
  alternative: 揺り動かす奉献物としてヤハウェに向かって揺り動かす
  rationale: 動詞נוףと名詞תנופהの組み合わせは儀礼的な提示を表す一方、具体的な揺動を含む可能性もある。本文では人に対する動作として明瞭な表現を採り、字義と語の反復は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の厳粛さを保った。「奉献物」は祭儀的な性格を示し、「差し出す」はレビ人をヤハウェのものとして正式に提示する動作を自然に表す。
