  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: ja
  text: アロンは、イスラエルの子らの中からレビ人を、ヤハウェの前に奉納物としてささげる[a][b]。こうして彼らは、ヤハウェの務めに当たる者となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「アロンはレビ人を、揺り動かしの奉納物として揺り動かす」。動詞と「奉納物」はヘブライ語で同じ語根に属する祭儀用語であり、神の前で儀礼的に提示する行為を表す。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの子らの中から」は、「イスラエルの子らに代わって」または「イスラエルの子らを代表して」という意味にも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: 揺り動かす奉献物として…差し出す
  rationale: 動詞 נוּף と同根の名詞 תְּנוּפָה が表す儀礼的な提示を、「差し出す」で自然に示しつつ、「揺り動かす奉献物」によって原文の祭儀用語と同根語の響きを保った。
- source_word: הַלְוִיִּם
  choice: レビ人
  rationale: イスラエルの部族集団を指す、現代日本語で定着した名称。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 神の臨在の前で行うことを表す定型句として、簡潔で原文に即した表現とした。神名 יהוה は「ヤハウェ」とした。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らから
  rationale: מֵאֵת の基本的な起点・出所の意味を保ち、בְּנֵי יִשְׂרָאֵל も字義に沿って訳した。代表関係を示す可能性は脚注に残した。
- source_word: לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: ヤハウェの務めに仕える者となる
  rationale: עבד の動詞と名詞の反復が示す奉仕への任命を、日本語として不自然な同語反復を避けながら明確に表した。
theological_decisions:
- issue: レビ人を תְּנוּפָה として扱う祭儀的表現
  choice: 「揺り動かす奉献物として…差し出す」とし、献げ物の比喩と儀礼的提示をともに保持する。
  alternative: 「レビ人を揺祭として揺り動かす」または単に「奉献する」。
  rationale: 原文はレビ人が犠牲として殺されるとは述べず、奉献物の言葉で彼らの聖別を描く。祭儀的緊張を消さず、同時に物理的に人を振るとの誤解を抑えた。
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל の関係
  choice: 本文では「イスラエルの子らから」として出所を示す。
  alternative: 「イスラエルの子らに代わって」または「イスラエルの子らを代表して」。
  rationale: 前置詞句は出所を表し得る一方、文脈上はレビ人がイスラエルを代表する意味も含み得るため、後者を脚注に示して曖昧さを保持した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、律法本文にふさわしい簡潔で荘重な調子と祭儀用語を保った。「揺祭」のような専門語だけに頼らず、「揺り動かす奉献物」として一般読者にも意味をたどりやすくした。
