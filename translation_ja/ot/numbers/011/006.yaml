  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: ja
  text: しかし今、私たちの食欲はすっかり失せてしまった[a]。目の前にあるのはマナだけだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの魂は干からびてしまった」。ヘブライ語ネフェシュは「魂」「命」を意味するほか、食物に関する文脈では「食欲」を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: しかし今
  rationale: 接続詞と時間副詞の組み合わせが、それまで述べた食物との対比を示すため、自然な日本語で逆接を表した。
- source_word: נַפְשֵׁנוּ
  choice: 私たちの食欲
  rationale: נֶפֶשׁ は「魂」「命」も意味するが、ここでは食物をめぐる不満の文脈なので、欲求、特に食欲を指す用法と判断した。語の幅は脚注に残した。
- source_word: יְבֵשָׁה
  choice: 干からびてしまった
  rationale: 乾き、衰えた状態を表す形容詞。食欲がすっかり失われたという比喩を保ちつつ、訴えの強さを自然に表した。
- source_word: אֵין כֹּל
  choice: 何もない
  rationale: 全称語を伴う否定を日本語の全面否定で表した。
- source_word: בִּלְתִּי אֶל
  choice: のほか
  rationale: マナだけを例外とする排他的な構文を簡潔に表した。
- source_word: הַמָּן
  choice: このマナ
  rationale: 定冠詞のある、彼らにとって既知のマナを指す。日本語では「この」により目前の特定物を示し、不満げな語調も自然に伝える。
- source_word: עֵינֵינוּ
  choice: 目の前には
  rationale: 直訳的な「私たちの目」を、日本語で視界にあるものを示す自然な表現にした。
