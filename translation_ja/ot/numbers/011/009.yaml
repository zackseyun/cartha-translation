  text: וּ/בְ/רֶ֧דֶת הַ/טַּ֛ל עַל הַֽ/מַּחֲנֶ֖ה לָ֑יְלָה יֵרֵ֥ד הַ/מָּ֖ן עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: ja
  text: 夜、露が宿営の上に降りると[a]、マナもその上に降りた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして夜、露が宿営の上に降りる時、マナもその上に降りた」。ヘブライ語では、露とマナのどちらにも同じ動詞「降りる」が使われ、両者の並行が強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: 降りると
  rationale: 接続詞・前置詞を伴う不定詞連語を時を表す節として訳した。文脈上、夜ごとに繰り返された出来事を自然な現代日本語で示す。
- source_word: הַטַּל
  choice: 露
  rationale: 定冠詞付きの名詞であり、文脈上特定される露を指す。日本語では通常、冠詞を明示しない。
- source_word: עַל הַמַּחֲנֶה
  choice: 宿営の上に
  rationale: עַל の空間的意味を保ちつつ、露が宿営一帯に降りる情景を自然に表した。
- source_word: לָיְלָה
  choice: 夜
  rationale: 時を示す副詞的用法。簡潔で自然な現代日本語とした。
- source_word: יֵרֵד
  choice: 降りた
  rationale: 物語文脈で習慣的な過去の出来事を表す未完了形。前半と同じ ירד を同じ動詞で訳し、露とマナの並行を保った。
- source_word: הַמָּן
  choice: マナ
  rationale: 既出の特定の食物を指す。日本語聖書で定着した表記を用いた。
- source_word: עָלָיו
  choice: その上に
  rationale: 男性単数代名詞接尾辞の指示対象を明示しすぎずに保持した。直前の宿営を受けるのが自然だが、露との位置的関係を読み取る余地も残る。
