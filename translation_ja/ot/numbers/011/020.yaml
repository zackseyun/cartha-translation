source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: ja
  text: 丸一か月の間、それがあなたがたの鼻から出て、あなたがたにとって吐き気を催すものとなる[a]までだ。なぜなら、あなたがたのただ中におられるヤハウェを退け、その御前で泣き、『なぜ私たちはエジプトから出て来たのか』と言ったからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたにとって忌まわしいものとなる」。ヘブライ語は強い嫌悪感を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: 丸一か月の間
  rationale: 直訳的には「一か月の日々まで」だが、満一か月にわたる期間を表すヘブライ語の言い回しなので、自然な現代日本語で期間の強調を保った。
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: それがあなたがたの鼻から出て
  rationale: אַף の具体的な身体部位としての意味を取り、肉が鼻から出るという原文の生々しい誇張表現を保持した。日本語では「鼻孔」より「鼻」が自然で明瞭である。
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: あなたがたには吐き気を催すものとなる
  rationale: זָרָא が表す強い嫌悪感を、文脈に合う自然な日本語で表した。「忌まわしいもの」とする可能性もあるため脚注で示した。
- source_word: יַעַן כִּי
  choice: からである
  rationale: 裁きの理由を導く表現として、因果関係を明瞭にした。
- source_word: מְאַסְתֶּם
  choice: 退け
  rationale: 単なる感情的な嫌悪だけでなく、ヤハウェを拒絶した行為を簡潔に表す。「蔑んだ」よりも意味を限定しすぎない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神名を日本語で一般的な音写によって示した。
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: あなたがたのただ中におられる
  rationale: 共同体の中に臨在することを表し、個々人の内面にいるとの誤解を避けた。
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: その御前で泣いて
  rationale: בכה の「泣く」と、神の前でなされたという関係的・空間的な表現の双方を保った。
- source_word: לָמָּה זֶּה
  choice: なぜ
  rationale: 不満を込めた疑問だが、日本語で不自然な強調を加えず簡潔に訳した。文脈が嘆きの調子を伝える。
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: 私たちはエジプトから出て来た
  rationale: יצא の「出る」を保ち、出エジプトを振り返る話者の視点に自然な「出て来た」とした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、その固有名としての性格を保つ音写を採用した。
- issue: מְאַסְתֶּם の含意
  choice: 退け
  alternative: 蔑んだ／嫌った
  rationale: 民が神の臨在を拒絶したという文脈を伝えつつ、動詞を感情的軽蔑だけに限定しない訳を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、裁きの宣告にふさわしい簡潔で厳粛な文体とした。二人称複数は「あなたがた」で一貫させ、原文の生々しい身体表現を弱めずに保持した。
