source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: ja
  text: しかし、モーセは言った。「私がその中にいる民は、徒歩の者が六十万人にのぼります[a]。それなのに、あなたは、『わたしは彼らに肉を与える。彼らは丸一か月[b]、それを食べる』とおっしゃいました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「徒歩の者」は「歩兵」とも訳せる。ヘブライ語は、徒歩で移動する者、または徒歩の兵士を指し得る。
    reason: alternative_reading
  - marker: b
    text: 「丸一か月」は、ヘブライ語では直訳すると「日々の一か月」。一か月の全期間を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、モーセは言った
  rationale: 接続形は物語を進めるが、ここでは直前の主の言葉に対するモーセの異議・困惑が表れているため、文脈上の対照を「しかし」で示した。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: 六十万人
  rationale: 基数表現をそのまま明確な現代日本語にした。
- source_word: רַגְלִי הָעָם
  choice: 民は、徒歩の者だけで六十万人
  rationale: רַגְלִיの「足で／徒歩の」という語感を保ちつつ、軍事的な「歩兵」に限定しない表現とした。「だけで」は、徒歩で数えられる集団の規模を自然に示す。
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: 私がそのただ中にいる
  rationale: בקרבの空間的な「ただ中に／その中に」を保ち、モーセが民の中にいることを明示した。
- source_word: וְאַתָּה אָמַרְתָּ
  choice: それなのに、あなたは……とおっしゃいました
  rationale: 明示された二人称代名詞の対照と、直前の約束に対するモーセの驚きを「それなのに」で表した。神への発言なので敬語を用いた。
- source_word: בָּשָׂר
  choice: 肉
  rationale: 文脈では食物としての動物の肉を指すため、自然で直接的な訳語とした。
- source_word: אֶתֵּן לָהֶם
  choice: わたしは彼らに肉を与える
  rationale: 一人称の将来の意思・約束を直接話法のまま保持した。
- source_word: וְאָכְלוּ
  choice: 彼らは……それを食べる
  rationale: 前の約束に続く結果を表す単純な並列として訳し、目的表現には限定しなかった。目的語の「それ」は、日本語で肉を受けて自然に理解できるよう補った。
- source_word: חֹדֶשׁ יָמִים
  choice: 丸一か月
  rationale: 字義的には「日々の一か月」だが、一か月の全期間を表すヘブライ語の慣用句として、自然な日本語の「丸一か月」とした。字義は脚注に示した。
theological_decisions:
- issue: モーセの言葉を疑問文として表すか
  choice: 平叙文のまま訳す
  alternative: 「……とおっしゃるのですか」と疑問文にする
  rationale: 文脈には驚きや疑念があるが、ヘブライ語本文には明示的な疑問標識がなく、動詞も「あなたは言った」となっているため、神学的・心理的含意を強めず平叙文を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、モーセが神に語る場面にふさわしく「おっしゃいました」と敬意を示した。原文の平叙文、明示された「あなた」、直接話法を保持し、驚きを疑問文へ変換しなかった。
