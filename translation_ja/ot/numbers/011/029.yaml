  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: ja
  text: しかしモーセは彼に言った。「あなたは私のために嫉妬しているのか。ヤハウェの民がみな預言者となり、ヤハウェがご自分の霊を彼らの上に置いてくださればよいのに。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: あなたは私のためにねたんでいるのか
  rationale: קנאの分詞は、モーセの立場を守ろうとするヨシュアの排他的な熱意を問う。日本語の「ねたむ」は嫉妬だけでなく、他者を容認しない思いも表し得るため、文脈に合い、原文の問いの鋭さも保つ。「私のために」でלִיの利害・擁護の方向を示した。
- source_word: וּמִי יִתֵּן
  choice: …ならよいのに
  rationale: 字義的な「だれが与えるだろう」ではなく、強い願望を表すヘブライ語の慣用句。現代日本語で自然な願望表現とした。
- source_word: כָּל עַם יְהוָה
  choice: ヤハウェの民がみな
  rationale: 「ヤハウェに属する民の全体」という構文を、自然で明瞭な日本語にした。
- source_word: נְבִיאִים
  choice: 預言者
  rationale: 語の通常の名詞的意味をそのまま保ち、「預言する者」と説明的に言い換えなかった。
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: ヤハウェがご自分の霊を彼らの上に置いてくだされば
  rationale: כִּי以下を願望の内容として読み、יִתֵּןの「与える」とעֲלֵיהֶםの「彼らの上に」という像を、日本語で理解可能な「上に置く」にまとめた。「くだされば」はモーセの願いを自然に表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: רוּחוֹ
  choice: ご自分の霊
  rationale: この文脈では預言を可能にする神の霊を指す。「ご自分の」は主語ヤハウェへの再帰的所属を明確にし、日本語として自然である。
theological_decisions:
- issue: רוּחוֹが指すもの
  choice: ご自分の霊
  alternative: ご自分の息／ご自分の風
  rationale: 直前の預言者となることと結び付いており、神による預言的な賦与を指すため「霊」が最も適切。ただし、人格論など後代の教理的説明は本文に加えない。
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有名が明記されているため、それを音写し、称号への代替を避けた。
- issue: כִּי節と願望表現の関係
  choice: ヤハウェが霊を置くことまでを一つの願望として表す
  alternative: 「なぜならヤハウェが…」と理由節にする
  rationale: וּמִי יִתֵּןが導く願望がכִּי節にも及ぶと読むのが文脈上自然であり、民全体が預言者となることと霊の賦与を切り離さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ねたんでいるのか」は原文の問いを率直に保ち、「…ならよいのに」で強い願望を自然に表現した。節内に説明的な補足を加えず、原文の簡潔さと神学的含意を維持した。
