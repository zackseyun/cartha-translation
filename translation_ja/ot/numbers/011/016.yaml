source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: ja
  text: そこでヤハウェはモーセに言われた。「イスラエルの長老たちの中から、あなたが民の長老であり、その役人[a]であると知っている者を七十人、わたしのために集めなさい。彼らを会見の天幕に連れて来て、そこであなたと共に立たせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「役人」は、行政や監督の務めを担う者を指す。「監督官」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を日本語で一般的な形に音写した。
- source_word: אֶסְפָה לִּי
  choice: わたしのために集めなさい
  rationale: 動詞の集合させる意味と、לִי が示す『わたしのために』という関係を保った。
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי יִשְׂרָאֵל
  choice: イスラエルの長老たちの中から……七十人
  rationale: מִן が集団からの選出を表すことと、指導者である成人男性七十人という意味を自然な日本語で示した。
- source_word: אֲשֶׁר יָדַעְתָּ כִּי
  choice: あなたが認めている者
  rationale: 単なる面識ではなく、彼らが長老と役人であるとモーセが知り、承認しているという文脈上の意味を簡潔に表した。
- source_word: וְשֹׁטְרָיו
  choice: その役人
  rationale: 接尾辞の指示先を『民』として明示し、行政上の職務を担う者を表す広い語を選んだ。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための聖所という名称を保ち、日本語聖書で理解されやすい表現とした。
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: そこであなたと共に立たせなさい
  rationale: 彼らが所定の場所に進み出て立つという התיצב の意味と、命令の流れを自然な日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を明記しているため、称号『主』に置き換えず音写した。『エホバ』ではなく、学術的に広く用いられる『ヤハウェ』を採用した。
- issue: 長老と役人の関係
  choice: 同じ選出対象者を『民の長老であり、その役人である』と描写
  alternative: 長老と役人を別々の集団とみなす
  rationale: 関係節は選ばれる七十人を二つの職務表現で特定している。原文どおり両者の厳密な制度的関係は断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言としての威厳を保った。長いヘブライ語文を二文に分け、選出条件と移動・整列の命令を読み取りやすくした。
