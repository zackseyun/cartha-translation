id: NUM.11.10
reference: Numbers 11:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: ja
  text: モーセは、民が氏族ごとに[a]、一人一人、自分の天幕の入口で泣いているのを聞いた。ヤハウェの怒りは激しく燃え上がった。そして、それはモーセの目に悪と映った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家族ごとに」とも訳せる。ヘブライ語は、家族またはより広い氏族集団を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「モーセには不快であった」とも訳せる。直訳は「モーセの目に悪かった」。何が悪かったのかは原文では明示されていない。
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 聞いた
  rationale: ここでは、民が泣いていることをモーセが知覚したことを表すため、自然な「聞いた」とした。
- source_word: בֹּכֶה
  choice: 泣いている
  rationale: 分詞による継続中の動作を、現代日本語で自然に表した。
- source_word: לְמִשְׁפְּחֹתָיו
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָה は家族またはより広い血縁集団を指し得る。荒野の共同体における集団単位として本文では「氏族」を採り、別訳を注記した。
- source_word: אִישׁ
  choice: 一人一人
  rationale: 男性単数形が分配的に用いられ、集団の各人を指す。日本語の「一人一人」はこの分配性を明確にし、文脈以上に男性だけへ限定することを避ける。
- source_word: לְפֶתַח אָהֳלוֹ
  choice: 自分の天幕の入口で
  rationale: 各人とその天幕との対応、および入口という空間的な情景を明瞭に保った。
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: ヤハウェの怒りは激しく燃え上がった
  rationale: חרה אף の「怒りが燃える」というヘブライ語の比喩と、מְאֹד の強い程度を、自然で力のある日本語で保った。
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: そして、それはモーセの目に悪と映った
  rationale: 「目に悪い」という原文の評価表現を保ちつつ、何が悪と映ったのかを原文同様に確定しないよう「それ」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 称号に置き換えず、本文に記された固有の神名を一般的な学術的再構音に基づいて音写した。
- issue: וּבְעֵינֵי מֹשֶׁה רָע の省略された主語・評価対象
  choice: 「それ」として指示内容を確定しない
  alternative: 民の行為がモーセには不快だった／ヤハウェの怒りがモーセには不快だった
  rationale: ヘブライ語は何がモーセの目に悪かったのかを明示しない。民の嘆き、全体の状況、直前のヤハウェの怒りなどに結び付ける余地があるため、一つに限定しなかった。
- issue: 分配的な אִישׁ の性別表現
  choice: 一人一人
  alternative: 男はそれぞれ
  rationale: 形態上は男性単数だが、ここでは民全体の各構成員を配分的に示す慣用的用法である。文脈が男性だけに限定しているとは断定せず、日本語で分配性を自然に表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「怒りが燃える」「目に悪と映る」という原文の比喩と評価表現を残した。「天幕」は聖書時代の移動生活の情景に適した、現代の読者にも理解可能な語として採用した。
