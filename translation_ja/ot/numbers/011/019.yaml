  text: לֹ֣א י֥וֹם אֶחָ֛ד תֹּאכְל֖וּ/ן וְ/לֹ֣א יוֹמָ֑יִם וְ/לֹ֣א חֲמִשָּׁ֣ה יָמִ֗ים וְ/לֹא֙ עֲשָׂרָ֣ה יָמִ֔ים וְ/לֹ֖א עֶשְׂרִ֥ים יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: ja
  text: あなたがたが食べるのは、一日でもなく、二日でもなく、五日でもなく、十日でもなく、二十日でもない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: ～でもなく／～でもない
  rationale: 各期間を順に否定する反復を、日本語で自然かつ明瞭な「一日でもなく、二日でもなく……」によって保持した。
- source_word: יוֹם אֶחָד
  choice: 一日
  rationale: 数え上げの最初の期間を簡潔に表し、後続の「二日、五日、十日、二十日」と対応させた。
- source_word: תֹּאכְלוּ/ן
  choice: あなたがたが食べる
  rationale: 二人称男性複数の未完了形。文脈上は将来の告知だが、日本語では「食べるのは……ない」という構文で将来の意味が自然に伝わる。
- source_word: יוֹמָיִם
  choice: 二日
  rationale: 双数形が明示する期間をそのまま訳した。
- source_word: חֲמִשָּׁה יָמִים
  choice: 五日
  rationale: 段階的な列挙を保つため、直接的に訳した。
- source_word: עֲשָׂרָה יָמִים
  choice: 十日
  rationale: 修辞的な積み上げを保持する直訳。
- source_word: עֶשְׂרִים יוֹם
  choice: 二十日
  rationale: ヘブライ語では数詞の後が単数形だが、意味は二十日間であり、日本語の通常の数え方で表した。
- source_word: וְ
  choice: 列挙を示す読点
  rationale: 反復される否定系列の接続辞。日本語では接続詞を逐一補わず、「～でもなく」を反復して並列関係を示すのが自然である。
