  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: ja
  text: こうしてモーセは、イスラエルの長老たちと共に宿営に戻った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「（モーセは）宿営に集められた」とも訳せる。ここで用いられているヘブライ語の動詞は、そのように字義的に訳すこともできるが、文脈ではモーセが宿営に戻ったことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: 戻った
  rationale: אסףのニファル形。字義的には「集められた」とも訳せるが、ここでは先の出来事の後に宿営へ帰る動きを表す慣用的な用法と判断した。「戻った」は文脈上の意味を自然な現代日本語で伝える。
- source_word: אֶל הַמַּחֲנֶה
  choice: 宿営に
  rationale: 前置詞אֶלの方向性を保ち、「宿営へ」とも可能だが、動詞「戻った」と自然につながる「宿営に」とした。
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: モーセとイスラエルの長老たちである
  rationale: 代名詞הוּאの同格的・強調的な働きを明示し、モーセだけでなく長老たちも共に戻ったことを保つ。日本語で指示対象が明瞭になるよう「彼」ではなく「モーセ」を補った。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: イスラエルの長老たち
  rationale: 構成形を標準的に訳した。物語の格調を保ちつつ、現代の読者にも明瞭な表現である。
