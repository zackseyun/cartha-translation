id: NUM.11.18
reference: Numbers 11:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: ja
  text: 民にはこう言いなさい。『明日のために身を聖別しなさい。[a] あなたがたは肉を食べる。あなたがたが、ヤハウェが聞いておられるところで泣き、「だれが私たちに肉を食べさせてくれるのか。エジプトでは私たちにはよかった」と言ったからだ。ヤハウェはあなたがたに肉を与え、あなたがたは肉を食べる。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「明日のために身を清めなさい」。原語には、ヤハウェの行為に備えて自分を聖なるものとして取り分ける、という意味がある。
    reason: 語義上の別訳と宗教的含意を示すため。
lexical_decisions:
- source_word: תֹּאמַר
  choice: こう言いなさい
  rationale: 未完了形二人称男性単数は、モーセへの指示として命令の力を持つため、自然な日本語の命令表現とした。
- source_word: הִתְקַדְּשׁוּ
  choice: 身を聖別しなさい
  rationale: קדשׁのヒトパエル命令形で、神の行為に備えて自らを聖なるものとして取り分ける意味を保つ。「準備しなさい」だけでは宗教的含意が薄れる。
- source_word: לְמָחָר
  choice: 明日に備えて
  rationale: 翌日に向けた準備を示す前置詞לְの機能を、日本語として自然に明示した。
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: あなたがたは肉を食べる
  rationale: בָּשָׂרはこの文脈では食用の肉を指す。命令に続く形は、結果として起こる将来の出来事を表す。
- source_word: בְּכִיתֶם
  choice: 泣き
  rationale: 民がすでにした行為であり、後続する神の応答の理由となっている。日本語では従属節として自然に接続した。
- source_word: בְּאָזְנֵי יְהוָה
  choice: ヤハウェの耳に届くように
  rationale: 直訳的な「耳に」を保ちつつ、ヤハウェが聞くところで訴えたというヘブライ語の慣用的意味が伝わる表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: 誰が私たちに肉を食べさせてくれるのか
  rationale: אכלのヒフィル形が持つ使役の意味「食べさせる」を保持した。「くれる」により民の要求として自然な日本語にした。
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: エジプトでは私たちは幸せだったのに
  rationale: 比較級を補わず、「私たちにとって良かった」という民の回想を自然な現代日本語で表した。「のに」は現在の不満を伴う発言の調子を示す。
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: ヤハウェはあなたがたに肉を与え
  rationale: 単純な接続詞וְを過度に因果化せず、直前の理由節との流れは日本語の文脈に委ねた。
- source_word: וַאֲכַלְתֶּם
  choice: あなたがたはそれを食べる
  rationale: 原文の「食べる」の反復を残し、続く節への強調を保った。「それを」は日本語で目的語を明確にするための補足。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を用いていることを保ち、称号への置換を避けた。
- issue: הִתְקַדְּשׁוּ の宗教的含意
  choice: 身を聖別しなさい
  alternative: 身を清めなさい／準備しなさい
  rationale: ここで明示される儀礼の詳細を補わず、神の行為に備えて自らを取り分けるという語の宗教的意味を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。民の不満と、それに応じるヤハウェの厳粛な告知という緊張を保った。命令・理由・応答の構造を簡潔にし、原文にない因果接続語は加えていない。
