  to: 民にはこう言いなさい。『明日のために身を聖別しなさい。[a] あなたがたは肉を食べる。あなたがたが、ヤハウェが聞いておられるところで泣き、「だれが私たちに肉を食べさせてくれるのか。エジプトでは私たちにはよかった」と言ったからだ。ヤハウェはあなたがたに肉を与え、あなたがたは肉を食べる。』
