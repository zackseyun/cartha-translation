revisions:
- from: どこから肉を手に入れて、この民すべてに与えればよいのでしょうか。彼らは私に泣きついて[a]、『肉を下さい。食べたいのです』と言っているのです。
  to: どこから肉を手に入れて、この民すべてに与えることができるでしょうか。彼らは私に向かって泣きながら訴え[a]、『肉をください。私たちが食べるためです』と言っているのです。
  rationale: 原文の入手不能を問う修辞疑問、民がモーセへ向けて泣き訴える表現の幅、そして肉を求める目的としてのコホルタティブを、自然な現代日本語で保つために改訂した。
