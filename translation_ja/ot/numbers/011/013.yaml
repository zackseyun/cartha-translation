  text: מֵ/אַ֤יִן לִ/י֙ בָּשָׂ֔ר לָ/תֵ֖ת לְ/כָל הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי יִבְכּ֤וּ עָלַ/י֙ לֵ/אמֹ֔ר תְּנָ/ה לָּ֥/נוּ בָשָׂ֖ר וְ/נֹאכֵֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: ja
  text: どこから肉を手に入れて、この民すべてに与えることができるでしょうか。彼らは私に向かって泣きながら訴え[a]、『肉をください。私たちが食べるためです』と言っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らは私の上で泣く」。 「私に向かって泣く」あるいは「泣いて私に迫る」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: どこから肉を手に入れて
  rationale: מֵאַיִןは入手先を問う表現であり、לִיは話者自身に入手の手段がないことを示す。自然な日本語でモーセの窮状も伝える。
- source_word: בָּשָׂר
  choice: 肉
  rationale: 食物としての動物の肉を指す文脈なので、現代日本語では「肉」が明確で自然。
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: この民すべてに与えればよい
  rationale: 目的を表す不定詞と、集合体としてのעָםを保ちつつ、日本語として自然な問いにした。
- source_word: כִּי
  choice: のです
  rationale: 後半が前半の問いの理由を示す関係を、日本語の説明表現で自然に表した。
- source_word: יִבְכּוּ עָלַי
  choice: 私に泣きついて
  rationale: 直訳は「私の上で／私に向かって泣く」。モーセに向けられた嘆願と重圧を表すが、敵意までは断定しない「泣きつく」を採った。
- source_word: לֵאמֹר
  choice: と言っている
  rationale: 引用内容を導く標準的な表現。継続的な訴えとして自然にした。
- source_word: תְּנָה לָּנוּ
  choice: 肉を下さい
  rationale: 命令形と一人称複数の受益者を、直接的な要求として自然に訳した。
- source_word: וְנֹאכֵלָה
  choice: 食べたいのです
  rationale: コホルタティブの意志・願望を自然な日本語で表した。単なる未来の「食べます」とはしない。
