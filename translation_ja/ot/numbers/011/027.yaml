  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: ja
  text: すると、一人の若者が走り、モーセに告げた[a]。「エルダドとメダドが宿営の中で預言しています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その若者が走り、モーセに報告した」。ヘブライ語では「若者」に定冠詞があり、「告げた」は「報告した」「知らせた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 走って来て
  rationale: רוּץは文字どおり「走る」を表す。モーセのもとへ向かう動きが文脈上明らかなため、自然な日本語として「走って来て」とした。
- source_word: הַנַּעַר
  choice: 一人の若者
  rationale: נַעַרは少年から若い男性までを指し得る。ここでは使者として行動する人物であり、日本語の物語で初めて登場する特定されていない人物として「一人の若者」が自然である。ヘブライ語の定冠詞を形式的に反映する「その若者」も可能なので脚注に示した。
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: モーセに告げた
  rationale: נגדのヒフィル形は「告げる、報告する」を意味する。続く直接話法が報告内容を示すので、簡潔で品位のある「告げた」とした。
- source_word: וַיֹּאמַר
  choice: 「……」
  rationale: אמרは発言を導入するが、日本語では直前の「告げた」に続けて直接話法を置けば意味が明瞭であるため、「そして言った」と重ねず自然な文にした。
- source_word: אֶלְדָּד וּמֵידָד
  choice: エルダドとメダド
  rationale: 固有名詞を日本語の一般的な聖書表記に沿って音写した。
- source_word: מִתְנַבְּאִים
  choice: 預言しています
  rationale: נבאのヒトパエル分詞は進行中の預言活動を表す。「預言しています」により継続的な側面と、若者が目撃した事態の報告らしさを保った。
- source_word: בַּמַּחֲנֶה
  choice: 宿営の中で
  rationale: מַחֲנֶהは荒野におけるイスラエルの宿営を指す。「宿営の中で」は場所を明確にし、「宿営で」より原文の前置詞בと定冠詞を丁寧に表す。
