  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: ja
  text: 私一人では、この民全体を担うことはできません。私には重すぎます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי לְבַדִּי
  choice: 私一人では、…できません
  rationale: 否定された能力表現と、独立代名詞 אָנֹכִי および לְבַדִּי による「私一人」の強調を、自然な現代日本語で保持した。
- source_word: לָשֵׂאת
  choice: 担う
  rationale: 基本義は「運ぶ、負う」。ここでは民全体への責任と重荷の比喩を含むため、「担う」が文脈に適する。
- source_word: אֶת כָּל הָעָם הַזֶּה
  choice: この民全体を
  rationale: כָּל の総体性と הַזֶּה の指示性を簡潔に再現した。
- source_word: כִּי כָבֵד מִמֶּנִּי
  choice: 私には重すぎます
  rationale: 「私に比して重い」、すなわち自分の力に余るという比較的意味を、日本語の「重すぎる」で明確に表した。
