  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「ヤハウェの手は短くなったというのか。[a] 今、わたしの言葉どおりのことがあなたに起こるかどうか[b]、あなたは見ることになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手が短くなる」とは、力や働く能力が限られることを表すヘブライ語の比喩。
    reason: cultural_note
  - marker: b
    text: 別訳「わたしが言ったことがあなたに起こるかどうか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって表した。
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: ヤハウェの手は短くなったというのか
  rationale: 神の力や働く能力を表す「手」と「短くなる」というヘブライ語の比喩を保ち、反語として自然な日本語にした。
- source_word: עַתָּה תִרְאֶה
  choice: 今、あなたは見ることになる
  rationale: これから直ちに事実によって確かめることになる、という未来の意味を明確にした。
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: わたしの言葉があなたに対して実現するかどうか
  rationale: קרהの「起こる、実現する」という意味と二人称接尾辞を反映しつつ、神の発言が成就するという文脈に合う自然な表現とした。
- source_word: אִם לֹא
  choice: かどうか
  rationale: 先行する疑問標識と結びつく間接疑問として、現代日本語で自然に表した。
theological_decisions:
- issue: 神の力を表す擬人的な「手」
  choice: 「ヤハウェの手」という比喩を本文に残す
  alternative: 「ヤハウェの力には限りがあるのか」と意味を直接表す
  rationale: 身体的比喩を平板化せず、モーセの疑いを鋭く問い返す原文の修辞的な力を保つため。
- issue: דְבָרִיとהֲיִקְרְךָの関係
  choice: 「わたしの言葉があなたに対して実現する」
  alternative: 「わたしが言ったことがあなたの身に起こる」
  rationale: 「言葉」を明示して原文の形を保ちながら、それが成就する意味を伝えた。「あなたに」の係り方には幅があるため、別訳を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の発言にふさわしい簡潔で重みのある語調と、原文の反語および身体的比喩を保った。
