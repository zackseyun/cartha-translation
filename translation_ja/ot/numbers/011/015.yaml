    rationale: 日本語では「恵みを得る」の場所として「あなたの目に」を置く言い方は不自然です。また、原文はモーセが神の目に好意を得ているかを問う慣用句であり、「あなたの目にかなっている」とすることで自然かつ忠実になります。
