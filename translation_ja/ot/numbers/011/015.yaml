  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: ja
  text: もしあなたがこのように私を扱われるのなら、どうか、いっそ私を殺してください。もし私があなたの目にかなっているのなら、私の苦しみ[a]を見ないようにしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の災い」または「私に降りかかる苦難」とも訳せる。ヘブライ語は道徳的な悪だけでなく、苦境や災難をも表す。
    reason: 語義の幅と解釈上の選択肢を示すため。
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: もし……このように……のなら
  rationale: 接続詞を日本語では明示せず、条件を表す自然な構文とした。כָּכָהの「このように」という指示的な意味を保持している。
- source_word: אַתְּ עֹשֶׂה לִּי
  choice: あなたが……私を扱われる
  rationale: עשה לを、神がモーセにどう対しているかを表す関係的な表現として訳した。神への呼びかけにふさわしい敬意を保ちつつ、現代日本語として自然にした。
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: どうか、いっそ私を殺してください
  rationale: נָאの嘆願を「どうか」で、命令形と不定詞絶対形の強調を「いっそ」で表した。「直ちに」と時間的意味に限定せず、徹底した願いとしての強意を保った。
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: もし私があなたの目に恵みを得ているのなら
  rationale: 「目に恵みを見いだす」というヘブライ語の慣用表現とその比喩をできるだけ保った。文脈上、好意を受けることを意味する。
- source_word: וְאַל אֶרְאֶה
  choice: 見ずに済むようにしてください
  rationale: אַלによる否定の願いを、神に向けた自然な日本語の嘆願として表した。単なる禁止ではなく、そうならないようにしてほしいという切実さを伝える。
- source_word: בְּרָעָתִי
  choice: 自分の悲惨なありさま
  rationale: רָעָהを道徳的な「悪」と限定せず、モーセ自身の苦境、破局、悲惨さを指す語として訳した。所有接尾辞の一人称的な関わりを「自分の」で保持した。
theological_decisions:
- issue: בְּרָעָתִיが指すもの
  choice: モーセ自身の悲惨な状態・苦境
  alternative: 私の悪／私に降りかかる災い／私の苦しみ
  rationale: 文脈は民を担う重圧に耐えかねたモーセの嘆きであり、本人の道徳的悪についての告白とは明示されていない。ただし語が持つ災難や苦しみの幅を脚注で示し、一つの解釈に狭めすぎないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神への嘆願としての敬意と切迫感を保った。「いっそ」は原文の強調を自然に示し、「悲惨なありさま」は道徳的な悪との不要な混同を避ける。
