- from: もしあなたがこのように私を扱われるのなら、どうか、いっそ私を殺してください。もし私があなたの目に恵みを得ているのなら、自分の悲惨なありさま[a]を見ずに済むようにしてください。
  to: もしあなたがこのように私を扱われるのなら、どうか、いっそ私を殺してください。もし私があなたの目にかなっているのなら、私の苦しみ[a]を見ないようにしてください。
  rationale: 原文の条件的で切迫した嘆願を保ちながら、「目に恵みを得る」という不自然な表現を、日本語の慣用的表現「目にかなう」へ修正した。また、最後の語を「苦しみ」として、災難・苦境・悲惨のいずれにも及び得る原語の幅を本文と脚注の組合せで保持した。
