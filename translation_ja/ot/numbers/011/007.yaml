base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: ja
  text: マナはコエンドロの種のようで、その見た目はベドラハ[a]の見た目のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベドラハ」が何を指すかは確かでない。香りのある樹脂または樹脂状の物質とされることが多いが、真珠や水晶のような宝石状の物質と理解する見方もある。
    reason: 語の同定に不確かさがあり、本文で一つの解釈に限定しないため。
lexical_decisions:
- source_word: הַמָּן
  choice: マナ
  rationale: 荒野で与えられた既知の食物を指す定冠詞付きの名詞。日本語では定冠詞を別に訳さず、慣用的な名称「マナ」とした。
- source_word: כִּזְרַע גַּד
  choice: コエンドロの種のよう
  rationale: 比較を表す כִּ を「のよう」とし、גַּד は一般的な同定に従って、現代日本語で分かりやすい植物名「コエンドロ」とした。
- source_word: וְעֵינוֹ
  choice: その見た目は
  rationale: עַיִן の字義は「目」だが、ここでは外から見た様子を意味するため、自然な日本語で「見た目」とした。
- source_word: כְּעֵין
  choice: の見た目のよう
  rationale: 原文で繰り返される עַיִן を訳文にも残し、視覚的な比較の構造を保った。
- source_word: הַבְּדֹלַח
  choice: ベドラハ
  rationale: 指示対象の同定が確実でないため、樹脂や宝石状の物質のいずれかに断定せず、ヘブライ語に基づく音写を採用して注で説明した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「見た目」を二度用いて原文の反復を保持した。注記は対象語「ベドラハ」の直後に置いた。
