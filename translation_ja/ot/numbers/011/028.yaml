source:
  edition: WLC
  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: ja
  text: すると、ヌンの子ヨシュア、若いころからモーセに仕えてきた者[a]が答えて言った。「わが主モーセよ、彼らをお止めください[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼の若いころから」。この句は文法上簡潔で、別の構文理解の可能性も指摘されている。
    reason: lexical_alternative
  - marker: b
    text: または「彼らに禁じてください」「彼らを抑えてください」。このヘブライ語動詞には、抑える、差し止める、禁じるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: すると、……が答えて言った
  rationale: 物語を進める接続辞と、応答を導入する二つの動詞を保ちつつ、現代日本語として自然な叙述にした。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: ヌンの子ヨシュア
  rationale: 聖書で一般的な日本語の固有名表記を用い、父子関係を原文どおり示した。
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: モーセに仕えてきた者
  rationale: מְשָׁרֵת は身近にいて補佐する奉仕者を指す。奴隷の含意を避けながら、継続的な奉仕を自然な日本語で表した。
- source_word: מִבְּחֻרָיו
  choice: 若い時から
  rationale: 文脈上、ヨシュアが若いころからモーセに仕えていたとの理解を本文に採用した。ただし、ヘブライ語は簡潔で形態的に曖昧さがあり、「彼の若者たちの中から」または「彼の選ばれた者たちの中から」とも取り得るため、脚注で保持した。
- source_word: אֲדֹנִי מֹשֶׁה
  choice: わが主モーセよ
  rationale: 人間の上位者に対する敬意ある呼びかけであることを、荘重だが理解しやすい表現で示した。
- source_word: כְּלָאֵם
  choice: 彼らをお止めください
  rationale: 語義には抑える、差し止める、禁じるなどが含まれる。「お止めください」は、預言をやめさせる要求を自然に表しつつ、物理的拘束に限定しない。
theological_decisions:
- issue: ヨシュアが求めた行為の強さ
  choice: 「お止めください」とし、具体的な手段を限定しない
  alternative: 「彼らに禁じてください」または「彼らを取り押さえてください」
  rationale: כלא は禁止にも拘束にもなり得る。本文ではいずれかに狭く確定せず、語義の幅を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、モーセへの敬意を「わが主モーセよ」で保った。「答えて言った」は原文の二動詞を反映するため残し、難解な語順は避けた。
