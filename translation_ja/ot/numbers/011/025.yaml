revisions:
- from: ヤハウェは雲のうちに降り、モーセに語られた。そして、モーセの上にあった霊の一部を取り分け、それを七十人の長老たちの上に置かれた。霊が彼らの上にとどまると、彼らは預言した。しかし、それを続けることはなかった。[a]
  to: ヤハウェは雲の中に降りて来られ、モーセに語られた。そして、モーセの上にあった霊の一部を取り分け、それを七十人の長老たちの上に置かれた。霊が彼らの上にとどまると、彼らは預言した。しかし、それを続けることはなかった。[a]
