id: NUM.11.25
reference: Numbers 11:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: ja
  text: ヤハウェは雲の中に降りて来られ、モーセに語られた。そして、モーセの上にあった霊の一部を取り分け、それを七十人の長老たちの上に置かれた。霊が彼らの上にとどまると、彼らは預言した。しかし、それを続けることはなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らは預言することをやめなかった」。このヘブライ語表現は簡潔で、複数の意味に理解されてきた。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語表記で音写した。
- source_word: וַיֵּרֶד
  choice: 降り
  rationale: 神の顕現に伴う下方への移動を、自然な現代日本語で表した。
- source_word: בֶּעָנָן
  choice: 雲のうちに
  rationale: 定冠詞を伴う、荒野物語で既知の神の臨在の雲を示す表現として訳した。
- source_word: וַיְדַבֵּר אֵלָיו
  choice: モーセに語られた
  rationale: 代名詞の指示対象を文脈から明示し、日本語での読みやすさを確保した。
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: モーセの上にあった霊の一部を取り分け
  rationale: 希少な動詞 אצלを、霊の分与を表しつつ、元の霊が減少したと断定しない表現にした。
- source_word: רוּחַ
  choice: 霊
  rationale: 長老たちに預言をもたらす神の力ある霊を指す。日本語では大文字・小文字の区別がないため、簡潔に「霊」とした。
- source_word: וַיִּתֵּן עַל
  choice: その上に置かれた
  rationale: 霊が人々の上に置かれ、のちにとどまるという原文の空間的イメージを保った。
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: 七十人の長老たち
  rationale: 「七十人」と「長老たち」の同格関係を、冗長にならない自然な日本語で表した。
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: 霊が彼らの上にとどまると
  rationale: נוח と על が示す、霊が人々の上に留まるイメージを保持した。
- source_word: וַיִּתְנַבְּאוּ
  choice: 彼らは預言した
  rationale: ここでは霊による預言活動を指すため、標準的で明瞭な訳語を用いた。
- source_word: וְלֹא יָסָפוּ
  choice: しかし、それを続けることはなかった
  rationale: 文脈上有力な、預言がその時だけで継続しなかったという理解を本文に置き、反対の伝統的理解は注に残した。
theological_decisions:
- issue: רוּחַ が神の霊を指すか、一般的な霊を指すか
  choice: 神の力ある「霊」を指すものとして訳す
  alternative: 人間の内的な「霊」
  rationale: モーセの上にあり、長老たちの上に置かれて預言を生じさせる文脈は、神から来る霊を強く示す。ただし日本語表記では英語の大文字化に相当する区別を設けない。
- issue: וְלֹא יָסָפוּ の意味
  choice: 彼らの預言は継続しなかった
  alternative: 彼らは預言することをやめなかった
  rationale: 簡潔なヘブライ語表現には相反する理解が伝わっている。文脈上有力な理解を本文に採り、真正な曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「語られた」「置かれた」により神への自然な敬意を示しつつ、過度に古風な文体は避けた。脚注記号は曖昧さの生じる末尾の節に置いた。
