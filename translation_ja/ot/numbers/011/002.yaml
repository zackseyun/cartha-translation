id: NUM.11.2
reference: Numbers 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: ja
  text: 民はモーセに向かって叫んだ。モーセがヤハウェに祈ると、火は静まった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「火は沈んだ」。ヘブライ語は、火勢が衰えて収まったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 叫んだ
  rationale: צעקは苦境の中で助けを求める切迫した叫びを表す。文脈が訴えの緊急性を示すため、自然で簡潔な「叫んだ」とした。
- source_word: הָעָם
  choice: 民
  rationale: ここではイスラエルの共同体を集合的に指す。聖書物語にふさわしい簡潔で格調ある「民」とした。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに向かって
  rationale: אֶלが示す人への方向を明確にし、叫びがモーセに向けられたことを自然な日本語で表した。
- source_word: וַיִּתְפַּלֵּל
  choice: 祈ると
  rationale: התפללの基本義である「祈る」を採用した。文脈上は執り成しだが、訳文でそれを明示して意味を限定しない。後続の出来事とのつながりは「と」で自然に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に記された神の固有名を称号に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
- source_word: וַתִּשְׁקַע
  choice: 静まった
  rationale: שקעは本来「沈む」を表し、ここでは火勢が衰えて収まる意味で用いられる。「消えた」と断定せず、火が弱まり収まった含みを保った。
- source_word: הָאֵשׁ
  choice: 火
  rationale: 直前の文脈にある神からの火を指す。日本語では既知性を冠詞で示す必要がないため、自然に「火」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名יהוהを明記しているため、称号の「主」に置き換えず音写した。「エホバ」よりもヘブライ語の推定発音に近く、現代日本語で広く用いられる「ヤハウェ」を採用した。
- issue: モーセの祈りを「執り成し」と明示するか
  choice: 祈ったという語義にとどめる
  alternative: 執り成した
  rationale: 民のための執り成しであることは文脈から理解できるが、原文の動詞は一般に「祈る」を意味する。神学的役割を訳文で過度に明示せず、原文の表現範囲を保った。
- issue: 火が完全に消えたと解するか
  choice: 火は静まった
  alternative: 火は消えた
  rationale: שקעは火が沈静化したことを示すが、完全な消火まで必ずしも断定しない。原文の含みを保つため「静まった」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「民」「ヤハウェ」により聖書本文としての簡潔さと品位を保った。前半を独立文とし、後半は「祈ると」で祈りと火の沈静化の連続を自然に示した。
