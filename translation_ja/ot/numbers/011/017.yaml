language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: ja
  text: わたしは降りて行き、そこであなたと語る。そして、あなたの上にある霊[a]をいくらか取り、彼らの上に置く。彼らはあなたとともに民の重荷を負う。こうして、あなたはそれを一人で負わずに済む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」と訳したヘブライ語רוּחַは、「風」や「息」を意味することもある。ここでは、民を導くためにモーセに力を与え、長老たちにも与えられる霊を指す。
    reason: 語義の幅と文脈上の意味を示し、日本語では表せない英語の大文字・小文字による区別に頼らず理解を助けるため。
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: わたしは降りて行き
  rationale: 神が「降りる」という原文の空間的・神顕現的な表現を保ちつつ、現代日本語として自然な「降りて行く」とした。
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: そこであなたと語る
  rationale: עםを伴うדברの相互的な「語る」の意味と、会見の場所を指す「そこで」を明示した。
- source_word: וְאָצַלְתִּי מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: あなたの上にある霊をいくらか取り
  rationale: 稀な動詞אצלと部分を示すמןを合わせ、モーセの上にある霊から取って長老たちに移すことを表した。「いくらか」は分与を示すが、モーセの霊が減少するかどうかまでは断定しない。
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: 彼らの上に置く
  rationale: שׂיםとעלの具体的な比喩を保ち、霊が人の上に置かれるという原文の表現をそのまま伝えた。
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: 彼らはあなたとともに民の重荷を負う
  rationale: נשאとמַשָּׂאの語の対応を「重荷を負う」で再現し、民を導く責任が分担されることを自然に示した。
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: こうして、あなたはそれを一人で負わずに済む
  rationale: 前節との結果的なつながりを「こうして」で示し、強調された「あなた」「一人で」を保ちながら現代日本語として明快にした。「それ」は直前の民の重荷を指す。
theological_decisions:
- issue: רוּחַを神の「霊」とするか、人間の「精神」とするか
  choice: 霊
  alternative: 精神、あるいは指導者としての資質
  rationale: 直後の11章25節を含む文脈では、神がモーセの上に置き、さらに長老たちの上に置く、指導のために力を与える霊を指す。「霊」と訳すことで神的な働きとの関係を保つ一方、日本語には大文字・小文字の区別がないため、後代の教理的精密さを本文に持ち込まない。
- issue: 霊の分与によってモーセの霊が減るかどうか
  choice: 明示しない
  alternative: モーセから霊の一部が失われると明示する
  rationale: מןとאצלはモーセの上にある霊から取って移すことを示すが、その結果モーセに与えられた霊が量的に減少したかどうかは本文が明言しないため、曖昧さを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「降りる」「上に置く」「重荷を負う」という原文の具体的な比喩を保持した。神の発話として簡潔で品位ある調子にし、過度に古風な言い回しや教派的な専門語を避けた。
