  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: ja
  text: そこで、彼はその場所をタブエラ[a]と名づけた。ヤハウェの火が彼らの間で燃えたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タブエラ」は、「燃える」を意味する語に由来する地名。
    reason: 地名תבערהと動詞בערの語源的・語義的な結び付きを示すため。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼ばれた
  rationale: 主語は文脈上明示されず、ヘブライ語の単数形を不特定の用法と捉えうるため、日本語では自然な受け身にして命名の事実を表した。
- source_word: שֵׁם הַמָּקוֹם הַהוּא
  choice: その場所の名
  rationale: ヘブライ語の命名定型を保ちつつ、現代日本語として簡潔にした。
- source_word: תַּבְעֵרָה
  choice: タブエラ
  rationale: 地名として音写し、בערとの語音・意味の結びつきは脚注で示した。
- source_word: כִּי
  choice: からである
  rationale: 命名理由を示す明確な因果関係として訳した。
- source_word: בָעֲרָה
  choice: 燃えた
  rationale: 火が燃えることを表す基本的な語義を選び、地名タブエラとの語源的連関も保った。
- source_word: בָם
  choice: 彼らの間で
  rationale: 共同体のただ中で火が燃えたという場所的意味を自然に表し、『彼らの中に』という誤解を避けた。
- source_word: אֵשׁ יְהוָה
  choice: ヤハウェの火
  rationale: 構文を率直に保ち、神の固有名יהוהを『ヤハウェ』と音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が契約の神名を直接用いているため、称号に置き換えず固有名として音写した。
- issue: וַיִּקְרָאの主語
  choice: 不特定の主語を反映する受け身『呼ばれた』
  alternative: 彼は呼んだ／モーセは名づけた
  rationale: 直前の文脈を含めても、この単数動詞の主語がモーセであるとは本文に明記されない。日本語で主語を補って曖昧さを解消せず、命名の事実を自然に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。因果説明は『からである』で簡潔に結び、原文で明示されない命名者を補わない。
