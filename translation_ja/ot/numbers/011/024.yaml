id: NUM.11.24
reference: Numbers 11:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: ja
  text: そこでモーセは出て行き、民にヤハウェの言葉を語った。そして、民の長老たちの中から七十人の男性を集め、彼らを天幕[a]の周りに立たせた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その天幕」。文脈上は会見の天幕を指すと考えられる。
    reason: cross_reference
  - marker: b
    text: 「配置した」とも訳せる。ヘブライ語は字義的には「彼らを立たせた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て行き
  rationale: יצא の基本的な移動の意味を保ち、直前の場所から外へ出たことを自然な現代日本語で表す。
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: 民にヤハウェの言葉を語った
  rationale: דבר אל の「〜に語る」と、具体的な複数形 דִּבְרֵי「言葉」を保った。日本語では目的語を先に置くことで自然な語順とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語音写で示す。
- source_word: וַיֶּאֱסֹף
  choice: 集め
  rationale: אסף の基本義を簡潔かつ自然に表す。
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי הָעָם
  choice: 民の長老たちの中から七十人
  rationale: מן の部分を表す用法と、זקנים が社会的役割としての長老を指すことを明示する。文脈上、七十人が長老であることは明らかなため、日本語では不自然な「七十人の男」を避けた。
- source_word: וַיַּעֲמֵד אֹתָם
  choice: 彼らを立たせた
  rationale: עמד のヒフィル形が持つ使役の意味「立たせる」を直接保つ。指定位置への配置という含みは文脈から読み取れる。
- source_word: סְבִיבֹת הָאֹהֶל
  choice: 天幕の周りに
  rationale: אהל を字義どおり「天幕」とし、סביבות の周囲を表す意味を自然な日本語で示す。本文自体には「会見の」という限定がないため補わない。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: ヘブライ語本文は称号ではなく四文字神名を用いているため、固有名として音写し、本文上の区別を保つ。
- issue: שִׁבְעִים אִישׁ の性別表現
  choice: 七十人
  alternative: 七十人の男
  rationale: איש は男性を指し、対象は民の長老たちである。ただし日本語の助数表現「七十人」は性別を否定せず、直後の「長老たちの中から」によって対象が特定されるため、冗長で不自然な明示を避けた。
- issue: הָאֹהֶל が指す天幕
  choice: 本文では「天幕」とし、会見の天幕である可能性を注記
  alternative: 会見の天幕
  rationale: 文脈上は会見の天幕と考えられるが、この節のヘブライ語は定冠詞付きの「天幕」とだけ記す。解釈を本文に織り込まず、注で説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の連続性を「そこで」「そして」で示し、原文の具体的な「言葉」と使役表現「立たせた」を保持した。
