id: NUM.11.26
reference: Numbers 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: ja
  text: 二人の男が宿営に残っていた。一人の名はエルダド、もう一人の名はメダドであった。霊が彼らの上にとどまった。二人は、記録されていた者たちの中にいた[a]が、天幕へは出て行かなかった[b]。そして、二人は宿営で預言した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「記された者たちの中にいた」。または「登録されていた者たちの中にいた」。
    reason: lexical_alternative
  - marker: b
    text: この出来事の文脈では、会見の天幕を指すと考えられる。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: 残っていた
  rationale: שׁארの「残る」という意味を自然に表し、二人が天幕へ行かなかった理由までは推測しない。
- source_word: בַּמַּחֲנֶה
  choice: 宿営に／宿営の中で
  rationale: מַחֲנֶהはイスラエルの宿営を指す。二つの出現箇所の統語に合わせ、日本語では「宿営に残る」「宿営の中で預言する」とした。
- source_word: שְׁנֵי אֲנָשִׁים
  choice: 二人の男
  rationale: 男性複数のאֲנָשִׁיםを具体的かつ明瞭に訳した。
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: 一人の名は…もう一人の名は…
  rationale: ヘブライ語の命名表現を保ちつつ、現代日本語として自然な形にした。
- source_word: אֶלְדָּד / מֵידָד
  choice: エルダド／メダド
  rationale: 人名を日本語の慣用的な音写で示した。
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: その霊が彼らの上にとどまった
  rationale: 定冠詞付きのרוּחַは直前の文脈でモーセに臨んでいた神の霊を指す。「その霊」により文脈上の指示を示し、נוחの「とどまる」を保持した。
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: 二人は名簿に記されていた
  rationale: 直訳は「記された者たちの中にいた」。七十人の長老として記録・登録されていたという文脈を、簡潔な日本語で表した。
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: 天幕へは出て行かなかった
  rationale: 方向を示す語尾を「へ」で表し、原文が単に「天幕」とする点を守った。「は」により、名簿には記されていたが天幕には行かなかったという対照を示した。
- source_word: וַיִּתְנַבְּאוּ
  choice: 預言した
  rationale: נבאのヒトパエル形が示す預言活動を直接訳し、「預言し始めた」のような明示されていない開始相は加えなかった。
theological_decisions:
- issue: הָרוּחַを神の霊としてどのように示すか
  choice: その霊
  alternative: 霊／御霊
  rationale: 文脈上は神から与えられる同じ霊を指すが、日本語では大文字・小文字の区別がない。「その霊」は定冠詞と先行文脈を反映しつつ、特定の教派的用語を持ち込まない。
- issue: הָאֹהֱלָהを「会見の天幕」と明示するか
  choice: 天幕
  alternative: 会見の天幕
  rationale: 文脈上は会見の天幕と考えられるが、この節の原文自体は「天幕」とだけ記すため、本文では明示化せず注で補った。
- issue: בַּכְּתֻבִיםの対象を名簿として表すか
  choice: 名簿に記されていた
  alternative: 記された者たちの中にいた
  rationale: 文脈は選ばれた長老たちの記録を指すと考えられる。「名簿」は意味を自然に伝えるが、原文の表現上の幅は注に残した。
translation_notes:
  register: 明瞭で現代的かつ格調を損なわない叙述体。「それでも」は、天幕へ出て行かなかったにもかかわらず宿営で預言したという文脈上の対照を自然に示す。人名は一般的な聖書日本語の音写を用いた。
