id: NUM.11.31
reference: Numbers 11:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: ja
  text: すると、ヤハウェのもとから風[a]が吹き出し、海からうずらを吹き寄せて、宿営の周囲に広げた。うずらは宿営の周囲に、こちらへ一日行程ほど、あちらへ一日行程ほど広がり、地面からおよそ二キュビトの高さにあった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」とも訳せる語。ただし、ここでは海からうずらを運ぶので、文脈上は「風」が適切である。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「地面の表面の上、およそ二キュビト」。これは、うずらが地面からその高さに広がっていた、または低く飛んでいたことを指すとも、地上にその深さまで積もったことを指すとも解釈できる。二キュビトは約九十センチ。
    reason: alternative_reading
lexical_decisions:
- source_word: וְר֜וּחַ
  choice: 風
  rationale: רוּחַには「風」「息」「霊」の意味があるが、ここでは海からうずらを運ぶ働きをするため、文脈上「風」が最も自然である。語義上の別の可能性は脚注に残した。
- source_word: נָסַע מֵאֵת יְהוָה
  choice: 主のもとから…吹き起こり
  rationale: נָסַעの移動・出発の意味とמֵאֵתによる起源を、風について自然な日本語で表した。神に由来することを明示しつつ、作用の仕組みを過度に説明しない。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される慣用に従い、神の固有名を示す語として「主」とした。
- source_word: וַיָּגָז שַׂלְוִים
  choice: うずらを運んで来て
  rationale: 稀な動詞גוזは、この文脈では風が海からうずらを移動させることを表す。「運んで来て」は風の作用と到来を明瞭に伝え、意味を不必要に限定しない。
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: 宿営の周りに降らせた
  rationale: נטשׁの「投げ出す、広げる、置き去る」という意味領域と、後続する宿営周辺の分布の描写を踏まえた。「周りに」により、天幕の真上だけに落ちたとの誤解を避ける。
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: こちら側にも向こう側にもそれぞれ一日行程ほど
  rationale: ヘブライ語の反復的な空間表現を保ち、宿営から両側へ及ぶ広がりとして自然に表した。
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: 宿営を囲んで
  rationale: 宿営の全周にわたる分布を簡潔に示す。
- source_word: וּכְאַמָּתַיִם
  choice: およそ二キュビト
  rationale: 接頭辞כの概数を「およそ」で表し、古代の尺度を保持した。
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: 地面から…の高さに
  rationale: 直訳は「地面の表面の上に」。二キュビトという尺度とのつながりを自然に示しつつ、鳥が地上に二キュビトの深さで積もった可能性や低く飛んでいた可能性を脚注で開示した。
theological_decisions:
- issue: 主に由来する風の働き
  choice: 主のもとから吹き起こった風が、うずらを運んだと訳す。
  alternative: 主が風によって直接うずらを送ったと、より説明的に訳す。
  rationale: 原文は風の起源を主に帰し、その風とうずらの移動を連続して描く。神の働きと自然的な手段をともに保ち、因果関係を原文以上に説明しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いヘブライ語文を自然な二文に分け、空間的な広がりを分かりやすくした。尺度と高さ・深さの曖昧さは本文と脚注で保持した。
