  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: ja
  text: 私たちは、エジプトでただで食べていた魚、きゅうり、メロン、リーキ（西洋ねぎ）、玉ねぎ、にんにくを思い出す[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「代価なしに」とも訳せる。これは民が不平を言う中でエジプトを回想した言葉であり、実際には彼らはそこで奴隷であった。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: 私たちは…思い出す
  rationale: 完了形一人称複数を、訴えの中で現在の回想を表すものとして訳した。現代日本語として自然で、発話時の切実な追憶を伝える。
- source_word: הַדָּגָה
  choice: 魚
  rationale: 食物としての魚を集合的に指す。魚介類などと意味を広げず、原語の範囲を保った。
- source_word: אֲשֶׁר נֹאכַל
  choice: 食べていた
  rationale: 過去の習慣を表す未完了形の文脈的用法を、日本語の継続・反復表現で明示した。
- source_word: בְּמִצְרַיִם
  choice: エジプトで
  rationale: 場所を表す前置詞句を自然な日本語で訳した。
- source_word: חִנָּם
  choice: ただで
  rationale: 代価を払わずに、という基本義を口語に寄りすぎない明快な現代日本語で表した。エジプトでの奴隷状態との皮肉は本文で解消せず、脚注で示した。
- source_word: הַקִּשֻּׁאִים
  choice: きゅうり
  rationale: この農産物の標準的な同定に従った。
- source_word: הָאֲבַטִּחִים
  choice: メロン
  rationale: 特定の品種を断定せず、ウリ科の果実を指す語として訳した。
- source_word: הֶחָצִיר
  choice: にら
  rationale: 食物一覧の文脈では草一般ではなく、ネギ属の野菜を指すと考えられる。日本語聖書読者にも理解しやすい伝統的な同定を採ったが、植物種の厳密な特定には不確かさがある。
- source_word: הַבְּצָלִים
  choice: 玉ねぎ
  rationale: 標準的な語義を現代の一般的表記で示した。
- source_word: הַשּׁוּמִים
  choice: にんにく
  rationale: 標準的な語義を現代の一般的表記で示した。
theological_decisions:
- issue: エジプトでの奴隷状態を踏まえた חִנָּם の訳し方
  choice: ただで
  alternative: 自由に／代価なしに
  rationale: これは民の不平における回想であり、エジプトでの境遇についての客観的評価ではない。基本義をそのまま訳し、奴隷生活との緊張と皮肉を本文中で説明的に修正しない。
translation_notes:
  register: 明快で自然な現代標準日本語とし、食物の列挙は二文に分けて読みやすくした。「ただで」は発話の率直さを保ちつつ、俗語的になりすぎない表現。「にら」は食物一覧に合う伝統的な植物同定として採用した。
