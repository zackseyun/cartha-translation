  text: וַ/יָּ֣קָם הָ/עָ֡ם כָּל הַ/יּוֹם֩ הַ/ה֨וּא וְ/כָל הַ/לַּ֜יְלָה וְ/כֹ֣ל י֣וֹם הַֽ/מָּחֳרָ֗ת וַ/יַּֽאַסְפוּ֙ אֶת הַ/שְּׂלָ֔ו הַ/מַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַ/יִּשְׁטְח֤וּ לָ/הֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽ/מַּחֲנֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: ja
  text: 民は立ち上がり、その日一日、夜通し、さらに翌日一日、うずらを集めた。最も少なく集めた者でも十ホメル[a][b]を集めた。彼らは自分たちのために、それを宿営の周り一帯に広げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ホメルは大きな乾量単位。現代の単位での正確な換算には不確かさがあるが、ここでは、最も少なく集めた者でさえ非常に大量だったことが強調されている。
    reason: cultural_note
  - marker: b
    text: 「ろば十頭分の荷」とも訳せる。ヘブライ語 חֳמָרִים を標準的な乾量単位「ホメル」ではなく、「ろば」との語源的な関連に基づいて解する場合。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: 民は立ち上がり
  rationale: קוםの物語上の勢いを保ちつつ、現代日本語で自然な表現とした。ここでは単なる起床ではなく、うずらを集める行動に移ったことを表す。
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: その日一日、夜通し、さらに翌日一日
  rationale: 三つの期間が切れ目なく続いた強調を、明瞭で自然な日本語のリズムで表した。
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: うずらを集めた
  rationale: אָסףを文脈に即して「集めた」とし、שְׂלָוは一般的な鳥名「うずら」とした。
- source_word: הַמַּמְעִיט
  choice: 最も少なく集めた者でも
  rationale: מעטの使役分詞を、直後のאָסַףと採集の文脈から補って訳した。「でも」により、最少量さえ非常に多かったという含意を自然に示す。
- source_word: עֲשָׂרָה חֳמָרִים
  choice: 十ホメル
  rationale: חֹמֶרを標準的な容量単位と解し、現代の単位へ不確実な換算をせず音写した。語源的に「ろばの荷」と取る可能性は脚注に残した。
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: 彼らは自分たちのために、それを…広げた
  rationale: שטחと同語根の不定詞による強調を簡潔な日本語で表し、לָהֶםも「自分たちのために」と明示した。乾燥などの目的は本文が明言しないため補わなかった。
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: 宿営の周り一帯に
  rationale: 単に周囲というだけでなく、宿営を取り巻く範囲に広く並べたというסְבִיבוֹתの広がりを表した。
