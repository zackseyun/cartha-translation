base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: ja
  text: 民の中にいた寄せ集めの群衆[a]は、激しい欲望を抱いた[b]。そして、イスラエルの人々も、再び泣いて言った。「だれが私たちに肉を食べさせてくれるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄せ集めの群衆」と訳したヘブライ語はまれな語で、イスラエルの民の中にいた周縁的な集団を軽蔑的に指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では同根の語を重ねて、直訳すると「欲望を欲した」。欲求の激しさを強調する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: 寄せ集めの群衆
  rationale: まれな集合名詞で、イスラエル共同体の中にいた周縁的な集団を軽蔑的に指す語。「寄せ集めの群衆」は、集合的意味と否定的な響きを保ちつつ、現代日本語で理解しやすい。
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: 民の中にいた
  rationale: 直訳的には「そのただ中にいた」。文脈上、イスラエルの民の内部にいたことを自然な日本語で明示した。
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: 激しい欲望に駆られた
  rationale: 同根の動詞と名詞を重ねる強意表現。「欲望を欲した」という不自然な逐語訳を避けながら、欲求の強さを保持した。
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: 再び泣いて
  rationale: שׁוּבはここでは動作の反復・再開を表すと理解し、「再び」で自然に表した。
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々もまた
  rationale: 字義は「イスラエルの子ら」だが、民族集団を指す定型表現なので、現代日本語として明瞭な「イスラエルの人々」とした。
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: だれが私たちに肉を食べさせてくれるのか
  rationale: אכלのヒフィル形「食べさせる」と、食物としてのבָּשָׂר「肉」を直接反映した。文脈上の切望を自然に示すため「くれる」を用いた。
