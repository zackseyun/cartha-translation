  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: ja
  text: 肉がまだ彼らの歯の間にあり、それを食べ終える前に[a]、ヤハウェの怒りが民に対して燃え上がった。ヤハウェは非常に激しい災厄で民を打った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「それが断たれる前に」。ここでは、肉がなくなる、つまり食べ終わる前という意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: うずらを食べる文脈なので、食物としての動物の肉を指す自然な現代日本語とした。
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: まだ彼らの歯の間にあり
  rationale: 肉がまだ飲み込まれていないという原文の生々しい描写を保った。
- source_word: טֶרֶם יִכָּרֵת
  choice: まだ食べ終わらないうちに
  rationale: כרת の字義は「断たれる」だが、食事の文脈では肉がなくなる、すなわち食べ終わることを表すと解した。ただし字義的な可能性は脚注に残した。
- source_word: וְאַף יְהוָה חָרָה
  choice: ヤハウェの怒りが民に対して燃え上がった
  rationale: חרה אף の燃える怒りという比喩を弱めず、自然な日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: וַיַּךְ
  choice: 打ち
  rationale: 神の裁きを表す נכה の力強さを保つ簡潔な訳語とした。
- source_word: מַכָּה רַבָּה מְאֹד
  choice: 非常に激しい災厄
  rationale: מַכָּה は文脈上、民全体を襲う破壊的な災いを指す。「災厄」は原因を病疫に限定せず、רַבָּה מְאֹד の甚大さも自然に伝える。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有の神名を保ち、称号への置換を避けた。
- issue: 神の怒りを表す擬人的比喩
  choice: 怒りが……燃え上がった
  alternative: 激しく怒った
  rationale: 原文の「鼻／怒りが燃える」という慣用的比喩を、日本語で理解可能な形にして保持した。
- issue: מַכָּה の性質
  choice: 災厄
  alternative: 疫病、打撃
  rationale: 語は打撃にも災害にもなり得るため、病気と断定せず、神の裁きとしての重大な災いを表す語を選んだ。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の時間的切迫感と神の怒りの比喩を保ちつつ、「食べ終わる」で文脈上の意味を自然に示した。
