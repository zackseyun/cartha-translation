base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: ja
  text: 羊や牛が彼らのために屠殺されても、彼らには足りるでしょうか。それとも、海の魚がすべて彼らのために集められても、彼らには足りるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに足りる」は、直訳すると「彼らに見いだされる」。ここでは「彼らにとって十分である」という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: ～のでしょうか
  rationale: 反語的な問いを導く疑問辞。仮定的な問いかけを、現代日本語で自然かつ重みのある形にした。
- source_word: צֹאן וּבָקָר
  choice: 羊や牛
  rationale: צֹאןは小家畜の群れを指し得るが、食用家畜を具体的かつ平明に表すため「羊」とし、בָקָרは「牛」とした。接続は列挙として自然な「や」を用いた。
- source_word: יִשָּׁחֵט
  choice: ほふれば
  rationale: שׁחטのニファル形で、食用となる家畜を屠殺する意味。「殺せば」より文脈に即し、「屠殺すれば」より一般読者に読みやすい。
- source_word: לָהֶם
  choice: 彼らのために
  rationale: 民への食物の供給を表す与格的用法を自然に示す。
- source_word: וּמָצָא לָהֶם
  choice: 彼らに足りる
  rationale: מצאのここでの慣用的意味は「見つかる」ではなく「十分である、間に合う」。逐語性より意味の明瞭さを優先した。
- source_word: אִם
  choice: それとも
  rationale: 二つ目の反語的な選択肢を導く機能を自然な日本語で明示した。後続節自体が条件形なので「もし」は省いた。
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: 海の魚をすべて
  rationale: כָּלの全体性を保ちつつ、現代日本語として自然な語順にした。
- source_word: יֵאָסֵף
  choice: 集めれば
  rationale: אסףのニファル形「集められる」を条件表現として自然に訳した。「捕る」という原文にない具体的手段は加えていない。
