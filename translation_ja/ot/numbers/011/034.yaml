  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: ja
  text: その場所をキブロト・ハタアワ[a]と名づけた。そこに、欲望を抱いた民を葬ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
