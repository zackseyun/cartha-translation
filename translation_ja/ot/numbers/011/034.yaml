lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: そこで、その場所の名は…と呼ばれた
  rationale: ヘブライ語の命名定型を保ちつつ、主語が明示されていないことを不自然に補わない日本語とした。וַיִּקְרָא の物語上の連続は「そこで」で表した。
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: キブロト・ハタアワ
  rationale: 固有地名として音写し、その語義は脚注に示した。
- source_word: כִּי שָׁם קָבְרוּ
  choice: そこで葬ったからである
  rationale: כִּי の理由説明と שָׁם の場所指示を、明瞭で格調ある現代日本語で表した。
- source_word: הָעָם הַמִּתְאַוִּים
  choice: 欲に駆られた民
  rationale: התאוה は文脈上、肉を求める貪欲な欲望を指す。「情欲」では性的意味に狭まりすぎるため避け、強い欲望に支配された含意を表した。
