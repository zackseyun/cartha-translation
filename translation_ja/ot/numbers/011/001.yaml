id: NUM.11.1
reference: Numbers 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: ja
  text: 民は、ヤハウェの聞くところで、苦難について不平を言う者たちのようであった[a]。ヤハウェはそれを聞き、その怒りは燃え上がった。すると、ヤハウェの火[b]が彼らの間で燃え上がり、宿営の端にいた者たちを焼き尽くした[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不平を言う者たちのように」に当たるヘブライ語は稀で解釈が難しく、「不平を言う者として」「不平を言っているかのように」とも訳せる。「苦難について」は、「悪く」「ひどく」と、不平の言い方を修飾する可能性もある。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェからの火」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 原文は直訳すると「宿営の端で焼き尽くした」で、何を焼き尽くしたかは明示されていない。本文の「者たち」は文脈から補った語である。「宿営の外れ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם
  choice: 民は……者たちのようになった
  rationale: וַיְהִי は新たな出来事の展開を示し、後続の分詞句と合わせて状態の発生を表し得る。日本語では明示的な「さて」を補わず、「なった」で自然に表した。
- source_word: כְּמִתְאֹנְנִים
  choice: 不平を言う者たちのように
  rationale: 稀で難解なヒトパエル分詞に付く比較の כְּ を保ち、単に「不平を言った」と断定せず、「者たちのように」とした。
- source_word: רַע
  choice: 苦難について
  rationale: ここでは民が訴えた災いや苦境を指すと理解した。ただし、苦情そのものを「悪い」と評価する副詞的用法の可能性もあるため、脚注で示した。
- source_word: בְּאָזְנֵי יְהוָה
  choice: ヤハウェに聞こえるところで
  rationale: 直訳的な「ヤハウェの耳に」を不自然にせず、聴覚の比喩と、訴えが神に届いたという意味を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を日本語で音写した。
- source_word: וַיִּשְׁמַע יְהוָה
  choice: ヤハウェはそれを聞き
  rationale: 目的語は文脈から補い、直前の「聞こえる」との語の連関を保った。
- source_word: וַיִּחַר אַפּוֹ
  choice: 怒りを燃やした
  rationale: 鼻が熱くなるというヘブライ語の慣用表現を、現代日本語で理解でき、かつ火の比喩を残す形にした。
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: ヤハウェの火が彼らの間で燃え上がり
  rationale: 属格表現「ヤハウェの火」を保ち、בָּם は文脈上「彼らの間で」とした。
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: 宿営の端を焼き尽くした
  rationale: 火を主語とする אָכַל を「焼き尽くす」と自然に表現した。בִּקְצֵה は場所を表すため直訳は「宿営の端で」だが、日本語本文では対象を明示しないまま自然に読める「端を」とし、脚注で構文上の幅を示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを読者に示すため、称号「主」ではなく音写を採用した。
- issue: אֵשׁ יְהוָה の関係
  choice: ヤハウェの火
  alternative: ヤハウェからの火
  rationale: 原文の属格的な結び付きをそのまま保ち、火の由来を明示する解釈は脚注に置いた。
- issue: 民の訴えに対する神の怒りと裁き
  choice: 怒りと火による裁きを直接的に表現
  alternative: 比喩または自然現象として弱める表現
  rationale: 本文は出来事をヤハウェの怒りと火に直接結び付けているため、その神学的緊張を緩和しなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の怒りと裁きを荘重に描いた。難解な冒頭句は本文を過度に直訳せず、比較表現と意味上の不確定性を脚注で保持した。
