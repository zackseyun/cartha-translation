base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: ja
  text: 民は歩き回ってそれを集め、ひき臼でひくか、臼でつき砕き、鍋で煮て、平たいパンにした。その味は油の濃厚な味のようであった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「新鮮な油の味」。ヘブライ語の「レシャド・ハッシェメン」は意味の取りにくい表現で、油の濃厚な滋味、または新鮮さを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: 歩き回って
  rationale: 一定の範囲を行き巡る動作を表す。マナを集めるため人々が各所を歩いたという文脈に自然に合う。
- source_word: לָקְטוּ
  choice: 集め
  rationale: 落ちているマナを拾い集める行為を、簡潔で自然な現代日本語で表す。
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: ひき臼でひく
  rationale: רֵחַיִם は臼石を用いるひき臼を指すため、具体的な道具を保ちつつ日本語として自然にした。
- source_word: דָכוּ בַּמְּדֹכָה
  choice: 臼でつき砕き
  rationale: 動詞の『つぶす、つき砕く』という意味と、מְדֹכָה が指す搗き臼を明確に表す。
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: 鍋で煮て
  rationale: 動詞は煮る・調理することを表し、器具 פָּרוּר は鍋として自然に訳せる。
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: 菓子にした
  rationale: עֻגוֹת は平たい丸形の焼き物を指し得るが、ここでは調理済みの食物として広く『菓子』とし、形状を本文に補わない。
- source_word: טַעְמוֹ
  choice: その味
  rationale: 味覚上の性質を指す直接的で一般的な訳語。
- source_word: לְשַׁד הַשָּׁמֶן
  choice: 濃厚な油の味
  rationale: 語義の難しい לְשַׁד が示す滋味・濃厚さを伝えつつ、油との結び付きを保持する。別解の可能性は脚注に示す。
