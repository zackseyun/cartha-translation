  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: ja
  text: 民はキブロト・ハタアワ[a]を出発してハツェロトへ行き、ハツェロトにとどまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キブロト・ハタアワ」は、「欲望の墓」または「むさぼりの墓」という意味。
    reason: 地名を構成する語 קִבְרוֹת（墓々）と הַתַּאֲוָה（その欲望、むさぼり）の透明な語義を示すため。本文では固有地名として音写した。
lexical_decisions:
- source_word: מִקִּבְרוֹת הַתַּאֲוָה
  choice: キブロト・ハタアワを
  rationale: 物語中では固有の地名として機能するため、意味を本文に訳し込まず音写した。起点を示す前置詞 מִן の意味は、動詞「旅立って」によって自然な日本語で表した。地名の語義は脚注に残した。
- source_word: נָסְעוּ
  choice: 旅立って
  rationale: נסע は旅程記事で、宿営を解いて次の場所へ出発することを表す。「旅立つ」は出発の含意を保ちつつ、現代日本語として自然である。
- source_word: הָעָם
  choice: 民
  rationale: ここではイスラエルの共同体を集合的に指す。聖書物語にふさわしい簡潔で格調ある日本語として「民」を選んだ。
- source_word: חֲצֵרוֹת
  choice: ハツェロト
  rationale: 固有地名なのでヘブライ語の子音に基づいて音写した。
- source_word: וַיִּהְיוּ בַּחֲצֵרוֹת
  choice: ハツェロトにとどまった
  rationale: 字義的には「彼らはハツェロトにいた」だが、旅程の文脈では、その場所に滞在したことを表す。「とどまった」はこの含意を簡潔に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、旅程記事の簡潔さを保った。「旅立って……へ行き」により、起点と目的地を自然に示した。地名は旧約聖書のヘブライ語に近い形で音写し、その意味は脚注で補った。
