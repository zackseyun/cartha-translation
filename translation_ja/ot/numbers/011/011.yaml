revisions:
- from: モーセはヤハウェ[a]に言った。「なぜ、あなたのしもべをひどい目に遭わせられたのですか。なぜ私は、あなたの目に恵みを得られなかったのですか[b]。この民全体の重荷を私に負わせられるとは[c]。」
  to: モーセはヤハウェ[a]に言った。「なぜ、あなたのしもべをひどい扱いになさったのですか。なぜ私は、あなたから好意を受けなかったのですか[b]。この民全体の重荷を私に負わせるためですか[c]。」
  rationale: 本文を現代標準日本語として自然にしつつ、モーセの神への強い訴え、好意を得るという慣用句の意味、重荷を負わせることと第二の問いとの連結を保ちました。「ひどい扱い」はモーセの苦境についての抗議を表すのであって、神が道徳的悪を行ったという訳者の断定を加えるものではありません。脚注アンカーはすべて対応しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:33Z'
review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実です。יַהוָה、しもべ、好意を得るという慣用句、民全体の重荷という主要要素は適切です。ただし末尾の「負わせられるとは」は、日本語では感嘆・非難の独立句となり、原文の「なぜ…好意を得られなかったのか――この民全体の重荷を私に負わせるために／負わせて」という問いとの連結をやや弱めます。
  naturalness: 「あなたの目に恵みを得る」は不自然で、「あなたの目に好意を得る」も日本語としては不適切です。「あなたの目に恵みを見いだす」は原語の比喩を保てますが、明瞭な現代標準日本語としては「あなたから好意を受ける」が自然です。「ひどい目に遭わせられた」は意味は通りますが受け身が重く、「ひどい扱いをなさった」がより自然です。
  terminology: 「ヤハウェ」「しもべ」「重荷」「民」は文脈に適しています。「恵み」は神学用語として使用可能ですが、この箇所のחןは対人関係上の「好意」であり、本文では「好意」が明確です。脚注で原文の「恵み／好意」の慣用表現を説明できます。
  issues:
  - severity: medium
    issue: 「あなたの目に恵みを得られなかった」
    rationale: ヘブライ語の「あなたの目に好意を見いだす」は、主語が好意を「得る」対象を「あなたの目に」とは通常結びません。原文の意味を自然な日本語にするため、「あなたから好意を受けなかった」とします。
  - severity: medium
    issue: 末尾の「私に負わせられるとは」
    rationale: 不定詞לשוםは直前の「なぜ好意を得られなかったのか」と結び付くため、日本語でも「この民全体の重荷を私に負わせるためですか」として問いの統語的連結を示すのが安全です。目的・結果の細かな解釈は脚注で固定しません。
  - severity: low
    issue: 「ひどい目に遭わせられた」
    rationale: 意味は可能ですが、現代日本語ではやや迂遠です。「ひどい扱いをなさった」はモーセの抗議の強さと神への呼びかけの敬意を自然に表します。
