source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: ja
  text: モーセはヤハウェ[a]に言った。「なぜ、あなたのしもべをひどい扱いになさったのですか。なぜ私は、あなたから好意を受けなかったのですか[b]。この民全体の重荷を私に負わせるためですか[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 神の名を表すヘブライ語四文字 יהוה（YHWH）の音写。伝統的に「主」と訳されることもあります。
    reason: divine_name
  - marker: b
    text: 直訳は「あなたの目に好意を見いださなかった」。人から好意を受けることを表すヘブライ語の慣用表現です。
    reason: cultural_note
  - marker: c
    text: 「この民全体」は、ヘブライ語では集合体を表す単数形の「民」です。
    reason: lexical_note
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示す。
- source_word: הֲרֵעֹתָ
  choice: ひどい目に遭わせられた
  rationale: ヒフィル形の「悪くする、害を与える」という訴えの強さを自然な現代日本語で表しつつ、神が道徳的悪を行ったとの断定にはしない。
- source_word: לְעַבְדֶּךָ
  choice: あなたのしもべ
  rationale: 神に対するモーセの謙譲的な自己呼称を表す。「奴隷」よりもこの文脈に適する。
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: あなたの目に恵みを得る
  rationale: 「好意を受ける」という意味のヘブライ語慣用句を、理解可能な形で保つ。
- source_word: מַשָּׂא
  choice: 重荷
  rationale: 実際の荷を比喩とする語感と、民を担う責任に対するモーセの苦悩の両方を表す。
- source_word: כָּל הָעָם הַזֶּה
  choice: この民全体
  rationale: 単数の集合名詞「民」を保ちながら、全体を指すことを自然な日本語で示す。
- source_word: לָשׂוּם ... עָלָי
  choice: 私に負わせる
  rationale: 「置く」と「重荷」の比喩的な結びつきを、日本語では自然な連語で表す。
theological_decisions:
- issue: 神を主語とする הֲרֵעֹתָ が道徳的悪を意味するように読まれる可能性
  choice: 「ひどい目に遭わせられた」
  alternative: 「あなたのしもべに悪を行われた」
  rationale: 原文にあるモーセの強い訴えは保つが、これはモーセの苦境についての抗議であり、神が道徳的悪を行ったとの訳者による断定にはしない。
- issue: 「恵みを得られなかった」と重荷を負わせたことの論理関係
  choice: 二つの疑問文に続けて「負わせられるとは」と訳す
  alternative: 「私に負わせるために、恵みを得られなかったのですか」
  rationale: 不定詞 לָשׂוּם の目的・結果・説明の含みを一義的に固定せず、重荷を負わせたことが直前の問いを説明する原文の緊張を保つ。
translation_notes:
  register: モーセの切迫した抗議を、現代の読者に明瞭でありながら神への語りかけとしての品位を失わない敬体で表現した。「しもべ」「恵み」「重荷」は聖書的な語感を保ちつつ一般にも理解可能な語として採用した。
