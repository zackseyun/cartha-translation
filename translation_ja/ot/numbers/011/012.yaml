id: NUM.11.12
reference: Numbers 11:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: ja
  text: この民全体を身ごもったのは、この私なのですか。私がこの民を産んだのですか。それなのに、あなたは私に、『養育する者[a]が乳飲み子を抱くように、この民[b]を懐に抱き、あなたがその父祖に誓った土地まで連れて行け』と言われるのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「養育する者」と訳した語は、子どもを世話し支える人を指し、「乳母」「守り役」「養父」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「この民」を集合体として単数で受け、ここを「彼を」、後の「その父祖」を「彼の父祖」としている。民全体を一人の乳飲み子になぞらす表現である。
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: 身ごもったのは、この私なのですか
  rationale: 疑問詞と独立人称代名詞による強調を「この私」で表し、הרהの妊娠・受胎の比喩を自然な現代日本語で保持した。
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: 私がこの民を産んだのですか
  rationale: ילדの出産の比喩を明示し、直前の「この民」を補って日本語として明瞭にした。
- source_word: כִּי תֹאמַר אֵלַי
  choice: それなのに、あなたは私に……と言われるのですか
  rationale: 二つの修辞疑問に続く訴えとして関係を自然に示し、神への敬語も過度に古風でない形にした。
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: この民を懐に抱き
  rationale: נשאの「運ぶ・担う」とחיקの「懐」を、乳飲み子の養育像が伝わる簡潔な表現にした。後続の目的地まで運ぶ意味は「連れて行け」で補った。
- source_word: הָאֹמֵן
  choice: 養育する者
  rationale: אמןの分詞は幼児を世話し支える者を指し、性別や授乳行為を限定しない訳語を選んだ。
- source_word: הַיֹּנֵק
  choice: 乳飲み子
  rationale: 授乳期の幼児という具体的意味を、現代日本語でも通用する簡潔で品位ある語で表した。
- source_word: עַל הָאֲדָמָה
  choice: 土地まで
  rationale: 移動の目的地を示す文脈に即して「土地まで」とし、約束の地への運搬を明確にした。
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: あなたがその父祖に誓った
  rationale: שבעの誓約の意味を保ち、אבותをイスラエルの先祖を指す「父祖」と訳した。
theological_decisions:
- issue: イスラエルを集合単数として一人の子のように語る表現
  choice: 本文では「この民」を繰り返し、単数・複数を明示しない日本語の特性を生かしつつ、出産と乳飲み子の比喩を保持する
  alternative: 「彼を」「彼の父祖」と形式的に単数化する、または「彼らを」「彼らの父祖」と複数化する
  rationale: ヘブライ語はעםを集合単数として単数接尾辞で受け、一人の子の像を作る。日本語で不自然な男性単数代名詞を置かず、「この民」と比喩の連続によって原文の像を伝え、文法上の特徴は脚注に示した。
- issue: הָאֹמֵןの担い手の役割と性別
  choice: 養育する者
  alternative: 乳母、守り役、養父
  rationale: 語は子どもを世話する者を指すが、ここで授乳する本人と断定する必要はない。役割と性別を過度に限定せず、語義の幅を脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。モーセの切迫した修辞疑問を保ち、妊娠・出産・養育という連続した比喩を自然に読める形にした。「懐」は原語の身体的な像と聖書的な響きを保つが、文全体は古語調にしていない。
