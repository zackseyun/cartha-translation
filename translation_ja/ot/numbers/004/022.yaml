  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: ja
  text: ゲルションの子らについても、父祖の家ごと、氏族ごとに人口を調べなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ゲルションの子らの頭を上げなさい」。これは人数を数える、または人口を調べることを意味するヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: 人口を調べなさい
  rationale: 字義どおりには「頭を上げる」だが、ここでは登録のために人数を数えるという行政的慣用句。現代日本語として自然な命令形にした。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ゲルションの子ら
  rationale: 「ゲルション人」ではなく、原文の系譜的な「子ら」という表現を保った。
- source_word: גַּם הֵם
  choice: も
  rationale: 先に数えられた集団に加えて、ゲルションの子らも対象に含まれることを簡潔に示す。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: 父系の祖先を基準とする家系的集団を表すため、「父の家」より意味の通じやすい「父祖の家」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 人口調査と部族組織の文脈では、現代的な核家族ではなく、より大きな血縁集団を指す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調ある現代標準日本語。系譜上の「子ら」と父系集団を示す「父祖の家」を保ちつつ、人口調査の慣用句は自然な日本語にした。原文では「父祖の家」「氏族」の順だが、日本語では修飾関係を読みやすくするため「氏族ごと、父祖の家ごと」とした。
