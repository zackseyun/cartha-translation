  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: 数えられた者は
  rationale: פקד の受動的な意味を保ち、直前までの人口調査・登録の文脈に即して表現した。接続詞 וּ は日本語では文脈上自然な形に統合した。
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ゲルションの子らのうち
  rationale: 系譜的集団を表す「子ら」を保持しつつ、列挙対象を示す日本語として「のうち」を補った。
- source_word: לְמִשְׁפְּחוֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָה を、部族内の親族集団を示す「氏族」と訳し、לְ の分類単位としての働きを「ごと」で表した。
- source_word: וּלְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: בֵּית אָבוֹת の家系・父系集団という慣用的意味を「父祖の家」で保ち、並列の וּ と לְ を自然な日本語の分類表現にした。
