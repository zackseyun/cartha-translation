  language: ja
  text: 氏族ごとに数えられた者は、二千七百五十人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 〜であった
  rationale: 物語を進める接続形を、日本語では文脈上不要な接続語を補わず、自然な叙述の過去形で表した。
- source_word: פְקֻדֵיהֶם
  choice: 数えられた者
  rationale: 人口調査・点呼の文脈におけるפקדの受動的・結果的な意味を保ち、原文にこの節では明記されない「男子」を補わなかった。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָהはイスラエルの部族内の親族集団を指すため、「家族」より制度的な集団区分を明確に示す「氏族」とした。前置詞לְは集計区分を示す「ごとに」で表した。
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: 二千七百五十人
  rationale: 原文の正確な総数を漢数字で示し、日本語では人数であることを自然に示す助数詞「人」を添えた。
