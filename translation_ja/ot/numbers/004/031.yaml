  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: ja
  text: また、これが会見の天幕での彼らのすべての奉仕において、彼らが担う運搬の務めである。すなわち、幕屋の枠板[a]、その横木、その柱、その台座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕屋の板」とも訳せる。ヘブライ語は、幕屋の骨組みを構成する板状の部材を指す。
    reason: lexical_alternative
  - marker: b
    text: 「受け台」とも訳せる。枠板や柱を差し込んで支える基礎部材。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: また、…次のとおりである
  rationale: 接続詞と指示語によって、前節から続く割り当ての具体的内容を提示しているため、自然な現代日本語で接続性と提示の働きを表した。
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: 彼らが運ぶべきものとして任されるのは
  rationale: מִשְׁמֶרֶת は割り当てられた責任、מַשָּׂא は実際に運搬する物を指す。直訳的な「彼らの荷の務め」よりも、両語の関係を明確で自然に表す。
- source_word: לְכָל עֲבֹדָתָם
  choice: 彼らのすべての奉仕のために
  rationale: 幕屋に関わる務め全体という範囲を表す。「奉仕」は礼拝施設における労務という文脈にふさわしく、過度に専門的でもない。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕における
  rationale: אֹהֶל מוֹעֵד の標準的で意味の明確な訳。「における」は、奉仕の領域を自然に示す。
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: 幕屋の枠板
  rationale: קֶרֶשׁ は幕屋を構成する板状の骨組み材を指す。「枠板」は板材であることと構造上の機能の双方を簡潔に伝える。
- source_word: בְרִיחָיו
  choice: その横木
  rationale: 枠板を横方向につなぐ部材であり、一般的な「棒」より構造上の役割が明確である。
- source_word: עַמּוּדָיו
  choice: 柱
  rationale: 直立した支持材を表す自然で定着した訳語。
- source_word: אֲדָנָיו
  choice: 台座
  rationale: 枠板や柱を受ける基礎部材を指す。「台座」は現代の読者に分かりやすく、技術的な「受け台」の意味も保つ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、幕屋の奉仕に関する目録としての簡潔で荘重な調子を保った。所有接尾辞はヘブライ語では各部材に付くが、日本語では冒頭の「幕屋の」と「その」により範囲が明らかなため、不要な反復を避けた。
