revisions:
- from: また、会見の天幕における彼らのすべての奉仕のために、彼らが運ぶべきものとして任されるのは、次のとおりである。幕屋の枠板[a]、その横木、柱、台座[b]。
  to: また、これが会見の天幕での彼らのすべての奉仕において、彼らが担う運搬の務めである。すなわち、幕屋の枠板[a]、その横木、その柱、その台座[b]。
  rationale: 原文の「彼らの運搬についての割り当てられた務め」という名詞句を、自然な日本語の「彼らが担う運搬の務め」とした。「会見の天幕での彼らのすべての奉仕において」により、奉仕の目的ではなく適用範囲を明示した。列挙は原文どおりに保ち、各部材が幕屋に属することを「その」で明確にした。
