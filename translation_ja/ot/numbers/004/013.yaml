base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: ja
  text: 彼らは祭壇から灰を取り除き、その上に紫色の布を広げる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭壇を清める」あるいは「祭壇から脂を含む灰を取り除く」。ヘブライ語の動詞は、祭儀の文脈で祭壇に残る灰を片づけることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: 灰を取り除き
  rationale: דשׁןのピエル形は、この祭儀的文脈では祭壇に残った脂を含む灰を片づけることを指す。現代日本語として明瞭な「灰を取り除く」とした。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 幕屋の祭儀におけるמִזְבֵּחַの標準的で自然な訳語。
- source_word: וּפָרְשׂוּ
  choice: 広げる
  rationale: פרשׂは広げる、広げて掛ける意。布で祭壇を覆う動作を自然に表す。
- source_word: עָלָיו
  choice: その上に
  rationale: עַלと三人称男性単数接尾辞は、祭壇の上を覆う位置関係を示す。
- source_word: בֶּגֶד
  choice: 布
  rationale: 通常は衣服も意味するが、ここでは祭具を覆う織物なので「布」が文脈に適する。
- source_word: אַרְגָּמָן
  choice: 紫色
  rationale: 紫に染めた素材を表す。בֶּגֶדを「布」と訳すため、合わせて「紫色の布」とした。
