base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: ja
  text: 三十歳から五十歳までの者、すなわち、会見の天幕で務め[a]に就き、奉仕を行う者をすべて数えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「任務に服し」。ヘブライ語は軍務にも使われる表現を、ここでは会見の天幕で行う組織的な奉仕について用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 三十歳以上五十歳までの者
  rationale: 年齢範囲を表すヘブライ語の慣用表現を、上限を含み得る自然な日本語で示した。
- source_word: תִּפְקֹד אֹתָם
  choice: その者を数えなさい／皆、数えなさい
  rationale: 人口調査・登録の文脈におけるפקדの基本的な行政上の意味を、平明な「数える」で表した。
- source_word: כָּל הַבָּא
  choice: …者を皆
  rationale: כלと分詞による包括的・分配的な意味を自然な日本語にした。
- source_word: לִצְבֹא צָבָא
  choice: 務めに就き
  rationale: 軍務にも用いられるצבאの組織的な任務という含みを保ちつつ、ここではレビ人の聖所奉仕を指すため、実際の戦闘を連想させない表現とした。
- source_word: לַעֲבֹד עֲבֹדָה
  choice: 仕事をする
  rationale: 同語根を重ねた「奉仕を行う／仕事をする」という意味を、簡潔で現代的な日本語にした。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: 神と会うための聖なる場所という名称を、旧約聖書で理解しやすい定訳に沿って表した。
theological_decisions:
- issue: צבאの語を明示的な軍事用語で訳すか
  choice: 務めに就く
  alternative: 軍務に就く／隊務に服する
  rationale: この箇所の対象は会見の天幕におけるレビ人の奉仕である。組織的任務という比喩的含意は脚注で示し、実際の戦闘を意味するとの誤解を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「数えなさい」を再度置き、長い修飾関係による曖昧さを避けた。脚注記号[a]は対応する「務めに就き」の直後に置いた。
