lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進める連続形で、後続の発言内容を導入する動詞。日本語では敬意を保ちつつ自然な定型表現とした。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神名を日本語聖書の広く認知された表記「主」で本文に示し、原文が固有名YHWHであることを脚注で明記した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を、自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: （独立には訳出せず、発言導入の「告げられた」に含める）
  rationale: ヘブライ語の発言導入定型句。「言って」と逐語的に重ねるより、次節から始まる直接話法を導く日本語として簡潔で自然である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文では「主」、脚注で「ヘブライ語ではYHWH（ヤハウェ）」と示す
  alternative: 本文で「ヤハウェ」
  rationale: 原文が称号ではなく四文字神名であることを隠さず脚注に保存しつつ、明瞭で品位ある現代日本語聖書の慣用に従った。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。次節の直接話法を自然に導くため、לֵאמֹרは独立した「言われた」とせず、発言導入表現に統合した。
