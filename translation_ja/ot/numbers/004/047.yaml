  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: ja
  text: 三十歳以上、五十歳までで、会見の天幕で、奉仕の務め[a]と荷を運ぶ務めを行うために来る者は皆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「務めの務め」。ヘブライ語では同じ語根の名詞が繰り返されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 三十歳以上
  rationale: 下限年齢を示すヘブライ語の慣用句を、簡潔で自然な現代日本語にした。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳まで
  rationale: 上限年齢を明確に示し、文脈上の年齢範囲を自然に表す。
- source_word: כָּל הַבָּא
  choice: 就く者は皆
  rationale: בוא の分詞はここでは務めに加わる者を指す。「来る者」より文脈に即して自然だが、資格認定などの意味は加えていない。
- source_word: לַעֲבֹד עֲבֹדַת עֲבֹדָה
  choice: 奉仕の務めに就く
  rationale: 動詞 עבד と反復的な名詞句 עֲבֹדַת עֲבֹדָה の関係を、日本語として過度に重複させずに保った。
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: 荷を運ぶ務め
  rationale: מַשָּׂא の具体的な「荷、運搬物」の意味を明示し、レビ人の運搬奉仕を自然に表した。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: 名称 אֹהֶל מוֹעֵד を「会見の天幕」とし、前置詞 בְּ は奉仕の場を表す「で」と訳した。
