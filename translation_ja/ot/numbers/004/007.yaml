- from: 臨在の机[a]の上には青い布を広げ、その上に大皿、杯、鉢、注ぎのささげ物のための水差しを置く。絶えず供えるパン[b]は、その上に置いておく。
  to: 臨在の机[a]の上に青い布を広げ、その上に大皿、杯、鉢、注ぎの献げ物用の水差しを置く。常に置かれるパン[b]も、その上に置かれる。
  rationale: 原文の継続的な状態を表す「常に置かれるパン」に改め、結びの「その上に置かれる」と対応させた。「注ぎのささげ物」は自然な現代表記の「注ぎの献げ物」に改めた。その他の訳語、脚注アンカー、および祭儀用具名の慎重な一般性は維持した。
