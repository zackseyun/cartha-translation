source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: ja
  text: 臨在の机[a]の上に青い布を広げ、その上に大皿、杯、鉢、注ぎの献げ物用の水差しを置く。常に置かれるパン[b]も、その上に置かれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「供えのパンの机」。ヘブライ語では、より直訳的に「臨在の机」。
    reason: alternative_reading
  - marker: b
    text: 別訳「絶えず置くパン」。主の前でこの机に常に置かれるパンを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: 臨在の机
  rationale: 直訳的には「顔／臨在の机」。祭儀的な意味を保ちつつ、伝統的だが説明的な「供えのパンの机」より原文の表現に近づけた。
- source_word: יִפְרְשׂוּ
  choice: 広げ
  rationale: 布を机の上に広げて掛ける動作を、自然な現代日本語で表した。
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 青い布
  rationale: 幕屋に用いられる青ないし青紫系の色を指すが、色調を必要以上に限定せず明快に訳した。
- source_word: הַקְּעָרֹת
  choice: 大皿
  rationale: 平たい供物用の器を表す語として、器具一覧の中で分かりやすい語を選んだ。
- source_word: הַכַּפֹּת
  choice: 杯
  rationale: 手のひら型の小器や匙状の器を指し得る語だが、形状を断定しすぎず食卓用祭具として理解しやすくした。
- source_word: הַמְּנַקִּיֹּת
  choice: 鉢
  rationale: 正確な形状と用途に不確かさがある器具名なので、古風で限定的な語を避け、一般的な容器名とした。
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: 注ぎのささげ物のための水差し
  rationale: 液体を注いでささげる祭儀上の用途を明示しながら、器の機能が伝わる自然な語を用いた。
- source_word: לֶחֶם הַתָּמִיד
  choice: 絶えず供えるパン
  rationale: תָּמִידの継続性と、主の前に規定どおり置かれるパンという祭儀的意味を簡潔に表した。
- source_word: עָלָיו יִהְיֶה
  choice: その上に置いておく
  rationale: 直訳は「その上にある」。この文脈ではパンが机上にある状態を保つ指示であることを、動作を過度に補わず自然な日本語にした。
theological_decisions:
- issue: שֻׁלְחַן הַפָּנִים における「臨在」の表現
  choice: 臨在の机
  alternative: 供えのパンの机
  rationale: 「顔／臨在」という原文の語を残し、神の臨在とパンとの関係を特定の解釈だけに狭めない。伝統的名称は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用具の専門語は形状が確定しないものを過度に特定せず、一般読者に理解できる器物名で訳した。脚注記号は対応する語句の直後に配置した。
