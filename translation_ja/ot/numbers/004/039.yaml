  text: 三十歳以上、五十歳までの者で、会見の天幕で働くために任務に就く者は皆――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 三十歳以上
  rationale: 年齢の下限を示すヘブライ語の慣用表現を、簡潔で自然な現代日本語にした。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳まで
  rationale: 上限を明確に示し、前の「三十歳以上」と自然な年齢範囲を成す。
- source_word: כָּל הַבָּא לַצָּבָא
  choice: 務めに就く者は皆
  rationale: בוא の参加・従事の含意と、ここでの צבא が軍隊ではなく組織されたレビ人の任務を指す文脈を自然に表した。
- source_word: לַעֲבֹדָה
  choice: 働く
  rationale: 直前の צבא と訳語を重ねず、実際の労務・奉仕を表す語として動詞化した。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: 聖所の名称を標準的に「会見の天幕」とし、前置詞 בְּ を「で」として務めが行われる場を示した。
