source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: ja
  text: また、庭の垂れ幕、幕屋と祭壇の周囲にある庭の門の入口の幕、それらの綱[a]、奉仕に用いるすべての用具、およびそれらを用いて行うべきすべてのこと[b]を行い、奉仕する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひも」。
    reason: lexical_alternative
  - marker: b
    text: 「それらを用いて行うべきすべてのこと」は、「それらのために行うべきすべてのこと」とも訳せる。ヘブライ語は、これらの品を用いる作業と、それらのために行う作業のどちらを指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: 垂れ幕
  rationale: 幕屋の庭を囲う布製の幕を指す。「垂れ幕」は内側の幕との区別を保ちつつ、現代日本語で形状が分かりやすい。
- source_word: חָצֵר
  choice: 庭
  rationale: 幕屋を囲む区画を指す。簡潔で自然な幕屋用語として「庭」を採用した。
- source_word: מָסַךְ
  choice: 幕
  rationale: 入口を覆う織物を指すため、日本語では機能が自然に伝わる「幕」とした。
- source_word: פֶּתַח שַׁעַר
  choice: 門の入り口
  rationale: 重なりのあるヘブライ語構文を保ちながら、日本語として理解できる表現とした。
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: 幕屋と祭壇の周囲にある
  rationale: 庭が幕屋と祭壇を取り囲む空間関係を簡潔に示す。関係節の係り先に形式上の曖昧さはあるが、文脈上は庭の位置を説明している。
- source_word: מֵיתְרֵיהֶם
  choice: その綱
  rationale: 垂れ幕や入口の幕に付属する綱を指す。「ひも」より設備としての用途が明確である。別訳「ひも」を脚注に示した。
- source_word: כְּלֵי עֲבֹדָתָם
  choice: 奉仕に用いるすべての用具
  rationale: כְּלִים の広い意味を「用具」で表し、עֲבֹדָה の幕屋における務めという含意を「奉仕」で保持した。
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: それらを用いて行うべきすべてのこと
  rationale: 前置詞 לָהֶם は、品々を用いて行う作業とも、それらのために行う作業とも理解できる。本文では文脈に合う前者を採り、後者を脚注に残した。
- source_word: וְעָבָדוּ
  choice: 受け持ち、奉仕する
  rationale: 動詞 עבד の務めを果たす意味を「奉仕する」で表した。直前まで続く目的語列を自然な日本語の述語に結ぶため、「受け持ち」を補った。
theological_decisions:
- issue: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם における לָהֶם の関係
  choice: それらを用いて行うべきすべてのこと
  alternative: それらのために行うべきすべてのこと
  rationale: 器具を扱う奉仕という文脈から手段的な理解を本文に採用したが、ヘブライ語は受益・対象の意味も許すため脚注で保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。4:25から続く列挙であることを踏まえて冒頭を「また」とし、長い目的語列を「受け持ち、奉仕する」に結び付けた。専門的すぎる語を避けつつ、幕屋奉仕の祭儀的な響きを保持した。
