  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: ja
  text: しかし彼らは、聖なるものをほんの一瞬でも[a]見るために中に入ってはならない。さもないと、彼らは死ぬ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なるものが覆われるときに」。このヘブライ語表現は解釈が難しく、見る時間がごく短いことを指すとも、聖なるものが覆われる時に見ることを指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: しかし……てはならない
  rationale: 接続詞と否定が、直前の務めとの対比を伴う禁止を表すため、現代日本語で自然な「しかし」と「てはならない」で訳した。
- source_word: יָבֹאוּ
  choice: 中に入る
  rationale: 文脈では、ケハト族が聖なる物に近づいて内部へ入ることを指す。「来る」よりも空間的な意味が明瞭である。
- source_word: לִרְאוֹת
  choice: 見るために
  rationale: 前置詞付き不定詞の目的を保った。「見ようとして」ほど意図性を強く限定せず、原文の「見る／目にする」の幅を残す。
- source_word: כְבַלַּע
  choice: ほんの一瞬でも
  rationale: 語義の確定が難しい慣用的表現であり、瞬時・短時間を表す解釈を本文に採用した。一方、「覆われている間に」という文脈的解釈を脚注に示した。
- source_word: אֶת־הַקֹּדֶשׁ
  choice: 聖なるもの
  rationale: 単数形だが、直前に述べられた幕屋の聖なる器具類を集合的に指すと考えられる。「聖所」として場所に限定することを避けた。
- source_word: וָמֵתוּ
  choice: さもないと死ぬ
  rationale: 禁止に背いた場合の結果を、警告の力を保つ明瞭な現代日本語で表した。
theological_decisions:
- issue: הַקֹּדֶשׁ の指示対象
  choice: 幕屋の聖なる器具類を集合的に指す「聖なるもの」
  alternative: 「聖所」または抽象的な「聖なるもの」
  rationale: 民数記4章の直前の文脈は、幕屋の備品を覆い、運搬する準備について述べているため、具体的な聖なる物々を指す読みが最も自然である。ただし日本語でも単数・集合の両方に開かれた表現を用いた。
- issue: כְבַלַּע の解釈
  choice: ごく短い時間を見ることへの禁止
  alternative: 聖なるものが覆われている最中に見ることへの禁止
  rationale: ヘブライ語表現には解釈上の難しさがある。本文では伝統的な慣用句理解に基づく「ほんの一瞬でも」を採り、文脈上有力な別解を脚注に残して曖昧さを明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼ら」を補い、禁止と死の警告を短く直接的に表現した。難解な כְבַלַּע は本文で自然に訳しつつ、別解を脚注に明示した。
