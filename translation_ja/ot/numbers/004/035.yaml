base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: ja
  text: 三十歳から五十歳までで、会見の天幕での仕事のために任務[a]に就く[b]者は皆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「任務」と訳した語は、組織された務めを表し、別の文脈では軍勢や兵役を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「任務に来る者」または「任務に入る者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 三十歳以上
  rationale: 年齢の起点と「それより上」を表すヘブライ語の慣用句を、自然で簡潔な現代日本語にした。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳まで
  rationale: עַד が示す年齢範囲の上限を明確に表した。
- source_word: כָּל הַבָּא
  choice: 就く者は皆
  rationale: בוא の分詞が、この任務に入る者を指す文脈上の用法を表す。「来る」と直訳するより日本語として自然だが、動作の含みは脚注に残した。
- source_word: לַצָּבָא
  choice: 任務に
  rationale: 幕屋奉仕の文脈では軍事行動ではなく、組織された一定の務めを指すため、「任務」とした。
- source_word: לַעֲבֹדָה
  choice: 仕事のために
  rationale: 直前の צָבָא と区別しつつ、実際に行う働き・作業を表した。「奉仕」は宗派的・教会的な響きを帯び得るため避けた。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: イスラエルの聖所を指す定型表現として、透明性の高い「会見の天幕」を用いた。בְ はここでは仕事が行われる場所・領域として「で」とした。
