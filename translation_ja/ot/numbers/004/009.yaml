  - severity: low
    issue: 「それに仕えるために用いる」は日本語として燭台を人格化して響く。
    rationale: 原語の祭儀的な仕え・奉仕の意味は、この文脈では燭台の整備・取り扱いとして現れる。「燭台の手入れに用いる」は自然で、道具を手段とするבָּהֶםにも合う。
