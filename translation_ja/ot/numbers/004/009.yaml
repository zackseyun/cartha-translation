base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: ja
  text: 彼らは青紫色の布[a]を取り、明かりのための燭台と、そのともしび、芯切りばさみ、火皿、また、燭台の手入れに用いるすべての油の器具を覆う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青い布」とも訳せる。ヘブライ語は、幕屋の調度品に用いられた特徴的な青系ないし青紫系の染色を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 青紫色の布
  rationale: בֶּגֶד はこの運搬規定では「衣」より「布」が自然。תְּכֵלֶת は幕屋で用いられる特徴的な青系ないし青紫系の染色を指し、日本語では伝統的かつ明瞭な「青紫色」とした。色調の幅は脚注で示す。
- source_word: מְנֹרַת הַמָּאוֹר
  choice: 明かりのための燭台
  rationale: מְנוֹרָה を「燭台」、הַמָּאוֹר の機能的な属格を「明かりのための」と訳した。「燭台」は油皿を載せる器具にも用いられる定着した聖書語である。
- source_word: נֵרֹתֶיהָ
  choice: そのともしび皿
  rationale: נֵר は個々の灯火または油を入れる灯器を指し得る。ここでは燭台の付属器具を列挙するため、現物を具体的に想像しやすい「ともしび皿」とした。
- source_word: מַלְקָחֶיהָ
  choice: 芯切りばさみ
  rationale: 語は灯火を手入れするための挟む道具を指す。「火ばさみ」より用途が明確で、文脈に即した「芯切りばさみ」とした。
- source_word: מַחְתֹּתֶיהָ
  choice: 火皿
  rationale: מַחְתָּה は火や燃えさしを扱う皿状の器具。ここでは香炉と断定せず、燭台の手入れに用いる「火皿」とした。
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: すべての油の用具
  rationale: כְּלִים は容器だけでなく器具一般を含み得るので、「油の器」より範囲を狭めない「油の用具」とした。
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: それに仕えるために用いる
  rationale: שׁרת の祭儀的な「仕える」を保持しつつ、בָּהֶם の複数の道具を手段として示す意味を自然な日本語で表した。不特定の複数主語は日本語では明示しない。
theological_decisions: []
translation_notes:
  register: 現代標準日本語を基調とし、祭儀の文脈にふさわしい品位を保った。「仕える」は聖所での奉仕という原語の含意を残し、「用いる」を添えて道具との文法関係を明確にした。
