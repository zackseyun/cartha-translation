base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: ja
  text: 氏族ごとに数えられた者は、三千二百人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: …であった
  rationale: 物語を先へ進めつつ集計結果を述べる形。日本語では独立した「そして」を置かず、文末の「であった」で自然に表した。
- source_word: פְקֻדֵיהֶם
  choice: 数えられた者
  rationale: 民数記の人口調査・登録の文脈におけるפקדの意味を表す。「登録された者」も可能だが、ここでは人数の集計を明確にする「数えられた者」とした。原文にこの節単独では明示されない「男」は補わない。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָהは部族内の家族的集団を指すため、「家族」より規模と社会的単位を明確に示す「氏族」を用いた。前置詞לְは分類・集計の基準として「ごとに」とした。
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: 三千二百人
  rationale: 基数の合計を現代日本語で自然に表し、人数であることが明確になるよう助数詞「人」を添えた。
