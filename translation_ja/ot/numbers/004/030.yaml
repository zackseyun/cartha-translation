base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: ja
  text: 三十歳から五十歳までの者で、会見の天幕の仕事をするための務め[a]に就く者を、すべて数えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「務め」に当たる語は「軍勢」や組織された「隊」を表すこともあるが、ここではレビ人に割り当てられた奉仕を指す。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 三十歳以上
  rationale: 年齢の下限を示すヘブライ語の慣用表現を、明瞭で自然な現代日本語にした。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳まで
  rationale: 年齢範囲の上限を明確に示し、וְעַד の意味を自然に表す。
- source_word: תִּפְקְדֵם
  choice: 数えなさい
  rationale: この人口調査の文脈では、奉仕の資格を持つ者を数えて登録することを指す。「召集しなさい」より軍事的含意を抑えつつ、基本義を保つ。
- source_word: כָּל הַבָּא
  choice: 就く者を、すべて
  rationale: 対象となる一人一人を含む分配的な意味を、日本語として自然に表した。
- source_word: לַצָּבָא
  choice: 務めに
  rationale: צָבָא には軍勢や組織された集団という語義もあるが、ここではレビ人が会見の天幕で担う定められた任務を指すため、「務め」とした。
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: 仕事をするために
  rationale: 同根語を重ねるヘブライ語表現を、冗長にならない自然な日本語で動作と任務内容が分かるように訳した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルの礼拝所を指す定着した名称として、原語の構成を保ちながら理解しやすく訳した。
theological_decisions:
- issue: לַצָּבָא に含まれ得る軍事的ニュアンス
  choice: 務め
  alternative: 軍勢／隊務／奉仕
  rationale: 本文は戦闘ではなく、レビ人による組織的な幕屋の奉仕を述べている。「務め」は定められた任務という含みを保ちつつ、軍事的意味を過度に持ち込まない。語の幅は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」によって、年齢範囲に該当する者のうち本文が数える対象を自然に説明した。命令形は簡潔な「数えなさい」とした。
