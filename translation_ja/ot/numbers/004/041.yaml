  source_fidelity: ヘブライ語は、ゲルションの子らの諸氏族に属し、会見の天幕で奉仕する者たちが数えられたこと、またその計数がモーセとアロンによりヤハウェの命令に従って行われたことを述べる。現行訳は全体として意味を伝えるが、「務めに当たる者として数えられた」は原文にない資格・目的の含みを加えうる。
  naturalness: 現行訳は読みやすいが、二文に分けたため、原文の「数えられた者たち」と、それを数えたモーセとアロンとの関係がやや反復的になる。関係を一文で明示すると、自然さと正確さがともに向上する。
  terminology: 「ゲルション」「会見の天幕」「ヤハウェ」は適切である。「諸氏族」もこの社会的区分を表す語として妥当である。「務めに当たる」は祭儀・運搬を含むレビ人の役務に適した中立的表現である。
