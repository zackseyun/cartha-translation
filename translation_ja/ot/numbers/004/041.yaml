  to: これらは、モーセとアロンがヤハウェの命令に従って数えた、ゲルションの子孫の諸氏族に属し、会見の天幕で務めに当たる者たちである。
  rationale: 「者として」を除き、原文の修飾関係を保持した一文に改めた。「これらは」に続く「数えた者たち」は פְּקוּדֵי と関係節 אֲשֶׁר פָּקַד を自然な現代日本語で再現し、「諸氏族に属し」「会見の天幕で務めに当たる」により各限定要素を明確にした。
