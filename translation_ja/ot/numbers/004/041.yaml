id: NUM.4.41
reference: Numbers 4:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: ja
  text: これらは、モーセとアロンがヤハウェの命令に従って数えた、ゲルションの子孫の諸氏族に属し、会見の天幕で務めに当たる者たちである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: これらは…数えられた人々である
  rationale: 人口調査の集計を示す表現として、指示語と פקד の受動的意味を自然な現代日本語で表した。ヘブライ語には時制の明示がないため、日本語では文脈に合う叙述形とした。
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: ゲルションの子孫の諸氏族
  rationale: בני はこの系譜的・部族的文脈では「息子たち」より「子孫」が自然であり、משפחת はイスラエル内部の集団区分を示すため「氏族」とした。
- source_word: כָּל הָעֹבֵד
  choice: 務めに当たる者
  rationale: 分詞の継続的な奉仕の意味を保ちつつ、聖所に関わる役務であることが明瞭になる表現を選んだ。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: אֹהֶל מוֹעֵד の慣用的かつ透明な訳。「で」は、その場所およびそれに関わる奉仕を自然に示す。
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロンが…彼らを数えた
  rationale: 関係節を独立文にして日本語の係り受けを明確にし、同じ語根 פקד を「数える」で反映した。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: 直訳では「ヤハウェの口に基づいて」だが、命令・指示に従うというヘブライ語慣用句の意味を明瞭に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を普通名詞や称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを読者に伝えるため、称号「主」ではなく「ヤハウェ」とした。
- issue: 会見の天幕における עבד の意味
  choice: 務めに当たる
  alternative: 働く／奉仕する
  rationale: 祭儀的奉仕だけに狭く限定せず、この箇所でレビ人に割り当てられた実務的な役務を含む表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、人口調査の総括文としての荘重さを保った。長い関係節は二文に分け、対象が曖昧にならないよう「彼ら」を補った。
