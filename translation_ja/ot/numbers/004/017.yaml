  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンにこう語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語はYHWH。イスラエルの神の固有名で、正確な古代の発音は確定していない。「主」とも訳される。
    reason: 神名の原語表記と発音上の不確かさ、および代表的な別訳を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進める接続形であり、ここでは神が二人に言葉を伝える発話を表す。日本語では、後続の直接話法を自然に導く「告げられた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語YHWHを、称号に置き換えず一般的な推定発音で音写した。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: 発話の相手がモーセとアロンの両者であることを、自然な現代日本語で明示した。ヘブライ語では前置詞אֶלがそれぞれの名の前に置かれている。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後に続く直接話法を導く定型表現。「こう告げられた」とすることで、発話内容が次節に続くことを簡潔かつ自然に示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく神の固有名YHWHを用いているため、その区別を保つ音写を本文に採用した。ただし正確な古代発音には不確かさがあるため、注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こう告げられた」により、原文の発話導入句を日本語として自然に表した。
