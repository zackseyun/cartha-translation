  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: ja
  text: モーセとアロン、およびイスラエルの指導者たちが、氏族ごと、父祖の家ごとにレビ人を数えた、その数えられた者たち[a]は皆――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「登録された者たち」とも訳せる。ヘブライ語では、人口調査で数え、登録することを表す語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: その数えられた者たちは皆
  rationale: 総数をまとめる表現であり、受動分詞の人口調査上の意味を保ちつつ、自然な日本語にした。
- source_word: פָּקַד
  choice: 数えた
  rationale: 民数記4章では、公的な人口調査・登録として数えることを指す。文脈上明瞭で、同根の分詞との対応も保てる。
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: イスラエルの指導者たち
  rationale: נשיאים は部族を代表する長を指す。「君主」などの誤解を避け、現代の読者に明瞭な表現とした。
- source_word: אֶת הַלְוִיִּם
  choice: レビ人を
  rationale: אֵת は直接目的語を示し、レビ人が数えられた集団であることを、そのまま簡潔に表した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָה はここでは人口調査の編成単位となる氏族を指す。
- source_word: וּלְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: בֵּית אָבוֹת は父系の祖先に基づく家族・親族集団を指す定型句であり、文化的背景を保ちながら理解しやすくした。
