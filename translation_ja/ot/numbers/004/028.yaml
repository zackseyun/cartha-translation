base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: ja
  text: これは、会見の天幕におけるゲルション族の諸氏族の奉仕である。彼らの務め[a]は、祭司アロンの子イタマルの監督のもとにある[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「任務」または「委ねられた責任」とも訳せる。ヘブライ語は、割り当てられた務めや責任を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「イタマルの手のもとに」。その監督または権限のもとにあることを示す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹדַת
  choice: 奉仕
  rationale: 会見の天幕に関して割り当てられた労務を表すため、礼拝施設での務めという文脈に合い、現代日本語でも自然な「奉仕」とした。
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: ゲルション族の諸氏族
  rationale: מִשְׁפְּחֹת の複数性と氏族的なまとまりを保ちつつ、直訳調の「ゲルション人の子らの諸家族」を避け、系譜上の集団を自然に示した。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕における
  rationale: 前置詞 בְ を奉仕の領域として捉え、天幕内部だけに場所を限定しない「における」とした。「会見の天幕」は אֹהֶל מוֹעֵד の定着した明瞭な訳語である。
- source_word: מִשְׁמַרְתָּם
  choice: 彼らの務め
  rationale: 任された責任、任務、守るべき務めを表す語であり、行政的な割り当てを平明に伝える「務め」を採用した。
- source_word: בְּיַד
  choice: 監督のもとに
  rationale: 字義は「手の中に／手によって」だが、ここでは権限・監督下にあることを示す慣用句であるため、意味を自然な日本語で表した。字義的表現は脚注に残した。
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの子イタマル
  rationale: הַכֹּהֵן は直近のアロンを「祭司」と特定すると読むのが自然で、ヘブライ語の語順と系譜的な特定を簡潔に保持した。
