revisions:
- from: 祭司アロンの子エルアザルが監督するもの[a]は、灯火用の油、香り高い香、常供の穀物のささげ物[b]、注ぎの油である。彼はまた、幕屋全体とその中にあるすべてのもの、すなわち聖所[c]とその用具[d]を監督する。
  to: 祭司アロンの子エルアザルに任された管理の責任は、灯火用の油[a]、香り高い香、常供の穀物のささげ物[b]、聖別の油、すなわち幕屋全体とその中にあるすべてのもの、聖所[c]とその用具[d]に関する管理である。
  rationale: 原文は動詞を伴わない名詞的構文で、二度のפְּקֻדָּתがエルアザルに委ねられた責任を、まず祭儀用の品々について、次いで幕屋とその内容全体について総括する。「管理の責任は…管理である」とすることで、この構造を自然な日本語で保った。後半のבְּの機能とקֹדֶשׁの範囲には議論の余地があるため、「…に関する」と訳し、脚注にも代案を明記した。
