  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: ja
  text: 祭司アロンの子エルアザルに任された管理の責任は、灯火用の油[a]、香り高い香、常供の穀物のささげ物[b]、聖別の油、すなわち幕屋全体とその中にあるすべてのもの、聖所[c]とその用具[d]に関する管理である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「任された管理の責任」は、「監督」「担当」または「管理の務め」とも訳せる。ヘブライ語は、割り当てられた監督・管理の責任を表す。
    reason: lexical_alternative
  - marker: b
    text: 「常供の穀物のささげ物」は、「絶えず献げる穀物のささげ物」または「定められた穀物のささげ物」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「聖所」は、「聖なる所」または「聖なるもの」とも訳せる。ここでは幕屋の聖なる区域、またはそこに属する聖なるものを広く指す可能性がある。
    reason: lexical_alternative
  - marker: d
    text: 「用具」は、「器具」「器」または「備品」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: 監督するもの／監督する
  rationale: この語は、任された管理・監督の責任を表す。日本語では「監督するもの」と動詞化することで、祭司職上の担当範囲を自然かつ明確に示した。
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: 灯火用の油
  rationale: 直訳的な「灯火の油」の用途を明確にしつつ、燭台と限定しすぎない表現とした。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香り高い香
  rationale: 香料を調合した香を指す句を、現代日本語で自然に表した。
- source_word: מִנְחַת הַתָּמִיד
  choice: 常供の穀物のささげ物
  rationale: מִנְחָהを穀物のささげ物、תָּמִידを規則的・継続的に献げられるものとして訳した。「日ごと」とは限定しない。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 聖別のために人や物へ注いで用いる油を指す、簡潔な祭儀用語とした。
- source_word: כָּל הַמִּשְׁכָּן
  choice: 幕屋全体
  rationale: 民数記の文脈に即してמִשְׁכָּןを「幕屋」とし、כָּלの全体性を明示した。
- source_word: בְּקֹדֶשׁ
  choice: 聖所
  rationale: ここでは抽象的な「聖さ」より、聖なる区域または聖なるものを指す祭儀的表現と理解した。ただし範囲には曖昧さがあるため脚注を付した。
- source_word: וּבְכֵלָיו
  choice: その用具
  rationale: כֵּלִיםは器、道具、備品を広く表し得るため、幕屋の祭儀用品を包括する「用具」とした。
theological_decisions:
- issue: 二度現れるפְקֻדַּתの関係と、動詞のない名詞文の処理
  choice: 列挙された品々と、より広い幕屋全体の双方をエルアザルの監督範囲として、二文で明示した。
  alternative: 後半を前半と同格の要約とし、「幕屋全体……の監督」と名詞句のまま訳すこともできる。
  rationale: ヘブライ語は名詞的で同格的な構造を保つが、日本語でそのまま連ねると関係が不明瞭になる。動詞「監督する」を補いながら、監督責任という意味と後半の総括性を保持した。
- issue: בְּקֹדֶשׁ וּבְכֵלָיוの統語的関係
  choice: 「幕屋全体とその中にあるすべてのもの」を具体化する同格的表現として「すなわち聖所とその用具」とした。
  alternative: 前置詞בְּを場所・領域として明示し、「聖所とその用具に関して」または「聖所の中とその用具において」と訳す余地がある。
  rationale: 文脈上は幕屋の聖なる区域と祭儀用具を監督対象として列挙する理解が自然だが、ヘブライ語の前置詞の働きとקֹדֶשׁの範囲は一義的でないため、脚注で代案を残した。
translation_notes:
  register: 明瞭で現代的ながら礼拝文書にふさわしい品位を保った。「常供」「幕屋」「聖所」は聖書の祭儀的文脈を簡潔に伝える語として用い、難解になり得る箇所は脚注で補った。
