  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: ja
  text: レビの子らのうち、ケハトの子らの人数を、氏族ごと、父祖の家ごとに数えなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「ケハトの子らの頭を上げなさい」。人数を数え、登録することを意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: 人数を……数えなさい
  rationale: 直訳は「頭を上げよ」だが、人口調査・登録の文脈では人数を数えることを表す慣用句。日本語では命令の意味が明確で自然な表現とした。
- source_word: בְּנֵי קְהָת
  choice: ケハトの子ら
  rationale: 系譜的な原文の形を保ちつつ、ケハトの子孫から成る集団を表す。
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: レビの子らのうち
  rationale: より大きなレビの子らの集団から、ケハトの子らを対象として取り出す関係を簡潔に表す。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: 民数調査における מִשְׁפָּחָה は、部族内部の氏族単位を指すため。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: 父系の祖先を軸とするイスラエルの親族・行政単位を示す定型表現。現代日本語で理解可能な形にしつつ、原文の構造を保った。
