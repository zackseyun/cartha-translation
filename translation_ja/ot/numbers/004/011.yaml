  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: ja
  text: また、金の祭壇の上には青い布を広げ、その上をタハシュの皮の覆い[a]で覆い、担ぎ棒を取り付ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」がどの動物、またはどの種類の皮を指すかは確定していない。「じゅごんの皮」「上質な革」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: 金の祭壇
  rationale: 定冠詞を伴う「金の祭壇」という表現。自然な日本語で、幕屋の器具を指す語として簡潔に訳した。
- source_word: יִפְרְשׂוּ בֶּגֶד תְּכֵלֶת
  choice: 青い布を広げ
  rationale: פרשׂは「広げる」、בגדは「布」、תכלתは幕屋で用いられる青系の染色を表す。古代の厳密な色調を過度に特定せず「青い布」とした。
- source_word: וְכִסּוּ אֹתוֹ בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: その上をじゅごんの皮の覆いで覆い
  rationale: מכסהは「覆い」、עורは「皮」。תחשが指す動物は不確かだが、語の不確実性を一般化した「上質な革」で隠さず、本文では有力な候補の一つ「じゅごん」を採り、注で不確かさを明示した。אֹתוֹの指示対象は祭壇だが、布の上に外側の覆いを掛ける手順が自然に伝わるよう「その上」とした。
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: 担ぎ棒を取り付ける
  rationale: בדיםは運搬用の棒。「置く」を機械的に訳すより、運搬に備えて所定の位置に据える動作を自然に表す「取り付ける」とした。
