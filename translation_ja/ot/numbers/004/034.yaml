base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: ja
  text: こうしてモーセとアロン、および会衆の指導者たちは、ケハテ族の者たちを、その氏族ごと、父祖の家ごとに数えた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「数えた」は、「人数を調べた」「人口調査をした」とも訳せる。ヘブライ語の動詞は別の文脈では「任命した」という意味にもなるが、ここでは奉仕のために人数を調べることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「父祖の家」は、祖先を同じくする世帯または家系上の区分を表す、古代イスラエルの伝統的な親族用語。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 数えた
  rationale: 民数記4章の人口調査の文脈では、פקדは任命ではなく、奉仕のために人数を調べて登録することを表す。「数えた」は簡潔で自然である。
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: 会衆の指導者たち
  rationale: נְשִׂיאִיםは共同体で公に認められた長たちを指す。「指導者たち」は現代日本語でその役割を明瞭に伝え、「会衆」は荒野の記事におけるעֵדָהの共同体的意味を保つ。
- source_word: בְּנֵי הַקְּהָתִי
  choice: ケハト族の者たち
  rationale: 字義的には「ケハト人の子ら」だが、ここではケハトの子孫から成る集団を指す。日本語で誤解なく自然に伝わるよう「ケハト族の者たち」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: その氏族ごと
  rationale: מִשְׁפָּחָהは人口調査・系譜の文脈で、部族内の血縁集団を指す。「氏族」はその社会的区分を保ち、接頭辞לְの分類の意味を「ごと」で表す。
- source_word: וּלְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: בֵית אָבוֹתはイスラエルの系譜上の家系・父系世帯を表す定型的な親族用語。「父祖の家」は原文の構造と古代イスラエルの制度的概念を保つ。
