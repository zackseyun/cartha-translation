  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: ja
  text: それらの上に緋色の布を広げ、それをタハシュの皮[a]の覆いで覆い、その担ぎ棒を取り付ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「タハシュ」。どの動物、またはどのような皮革を指すかは不明。伝統的には「じゅごんの皮」「あなぐまの皮」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: その上に……広げ
  rationale: 動詞 פרשׂ と前置詞 על の具体的な動作を自然な現代日本語で表した。「その」は前節にある複数の器具を受ける。
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: 緋色の布
  rationale: בגד はここでは衣服ではなく覆いに用いる布を指す。תולעת שני は緋色の染料・素材を表すが、「糸」は本文に明示されないため、簡潔に「緋色の布」とした。
- source_word: וְכִסּוּ אֹתוֹ
  choice: それを……覆い
  rationale: 単数の目的語接尾辞を「それ」とし、前節から続く食卓という一体物を指す原文の数の移行を保った。
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: タハシュの皮[a]の覆いで
  rationale: מכסה は覆い、עור は皮を意味する。תחש の同定は不確実なので、特定の動物名に断定せず音写した。
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: その担ぎ棒を取り付ける
  rationale: בדים は聖具運搬用の棒。「置く」では日本語として動作が曖昧なため、運搬準備の文脈に即して「取り付ける」とした。
