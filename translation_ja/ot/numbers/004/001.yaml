  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセとアロンに語り、こう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は神の名を表す四文字「YHWH」。一般に「ヤハウェ」と表記される。
    reason: 原文の神名を明示するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語って言われた
  rationale: 物語を進める連続形で、神が二人に言葉を告げることを表す。後続の לֵאמֹר と合わせ、日本語で自然な聖書的導入句とした。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 神の固有名を表す四文字語である。日本語本文では広く理解される「主」とし、脚注で原文が YHWH であり「ヤハウェ」とも表記されることを明示した。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: モーセとアロンに
  rationale: אֶל が各人の前に置かれ、両者がそれぞれ語りかけられた相手であることを示す。日本語では助詞「に」を共有させて自然に表現した。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直接話法を導く定型的な不定詞である。「語って言われた」として原文の発話導入の構造を保ちつつ、現代日本語で理解可能にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文「主」、脚注「原文はYHWH（ヤハウェ）」
  alternative: 本文で「ヤハウェ」
  rationale: 原文が称号ではなく神の固有名を用いている事実を脚注で保持しながら、本文は日本語聖書で広く通用する荘重で明瞭な表現とした。発音の再建には一定の不確かさがあるため、それも脚注表現に反映した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の二重の発話表現 וַיְדַבֵּר ... לֵאמֹר を、日本語として過度に冗長にならない範囲で「語って言われた」と表した。
