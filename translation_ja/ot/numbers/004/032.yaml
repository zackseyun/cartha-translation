  text: וְ/עַמּוּדֵי֩ הֶ/חָצֵ֨ר סָבִ֜יב וְ/אַדְנֵי/הֶ֗ם וִֽ/יתֵדֹתָ/ם֙ וּ/מֵ֣יתְרֵי/הֶ֔ם לְ/כָל כְּלֵי/הֶ֔ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/בְ/שֵׁמֹ֣ת תִּפְקְד֔וּ אֶת כְּלֵ֖י מִשְׁמֶ֥רֶת מַשָּׂאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: ja
  text: また、その運搬の務めには、庭の周囲の柱、その台座、杭、綱、それらに付属するすべての用具、およびそれに関するすべての務めが含まれる。あなたがたは、彼らの運搬の任務に属する用具を、一つ一つ名を挙げて割り当てなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「各人を名指しして、彼らの運搬の任務に属する用具を割り当てなければならない。」
    reason: 「名によって」を表す句は、用具を一つずつ名を挙げて指定する意味にも、担当者を名指しして責任を割り当てる意味にも理解できる。
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: 周囲の庭の柱
  rationale: 「柱」を意味する עַמּוּדִים と「庭」を意味する חָצֵר に、周囲を示す סָבִיב がかかる。幕屋を囲む庭の外周に立つ柱を、簡潔で自然な日本語で表した。
- source_word: אַדְנֵיהֶם
  choice: その台座
  rationale: 幕屋の構造物を支える台または受け口を指す。現代の一般読者に形状と機能が伝わりやすい「台座」とした。
- source_word: יְתֵדֹתָם
  choice: 杭
  rationale: 幕や構造物を固定するペグないし杭を指す。綱と組み合わせて用いられる器具として自然な「杭」を採用した。
- source_word: מֵיתְרֵיהֶם
  choice: 綱
  rationale: 幕屋を固定するひも・綱を指す。構造物を支える用途が明瞭になる「綱」とした。
- source_word: לְכָל כְּלֵיהֶם
  choice: そのすべての用具
  rationale: כְּלִים は器、品物、器具などを広く表す。ここでは柱などに付属する実用品を指すため「用具」が適切である。
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: それに関わるすべての作業
  rationale: עֲבֹדָה は奉仕、務め、作業を表す。ここでは列挙された設備に関する実際の奉仕作業を自然に示しつつ、担当された務めという含みも保った。
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: 名称を挙げて割り当てなければならない
  rationale: פקד は文脈上、数えるだけでなく、指定し担当させる意味を持つ。בְשֵׁמֹת の「名によって」を品々の個別指定として本文に反映したが、人を名指しして担当を定める理解も可能なため脚注に示した。
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: 彼らが運ぶ務めに属する品々
  rationale: 「品々・用具」「務め・責任」「荷・運ぶもの」が重なる圧縮された句である。各品が彼らの運搬責任に属することを示しながら、原文の結びつきに残る曖昧さを過度に解消しない表現とした。
