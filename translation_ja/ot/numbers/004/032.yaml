revisions:
- from: また、周囲の庭の柱とその台座、杭、綱、そのすべての用具と、それに関わるすべての作業である。あなたがたは、彼らが運ぶ務めに属する品々を、名称を挙げて割り当てなければならない。[a]
  to: また、その運搬の務めには、庭の周囲の柱、その台座、杭、綱、それらに付属するすべての用具、およびそれに関するすべての務めが含まれる。あなたがたは、彼らの運搬の任務に属する用具を、一つ一つ名を挙げて割り当てなければならない。[a]
  rationale: 原文の列挙が前節から続く運搬責任の内容であることを明示し、現行文の不自然な係り受けを解消した。「すべての作業」は「それに関するすべての務め」に改め、עֲבֹדָהの職務・奉仕の幅を保った。後半は、品目の個別指定という本文の理解を維持しつつ、担当者の名指しという可能な理解を脚注で示した。
