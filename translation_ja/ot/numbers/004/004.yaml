  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: ja
  text: これは、会見の天幕でコハトの子らが最も聖なるもの[a]について行う務めである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「至聖所」または「最も聖なる場所」。ここでは、内室という場所ではなく、最も聖なる祭具を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: これは……である
  rationale: 女性単数の指示詞による導入。ヘブライ語で省略されている繋辞を補い、現代日本語として自然な文にした。
- source_word: עֲבֹדַת
  choice: 務め
  rationale: ここでは、割り当てられた祭儀上の奉仕・職務を指す。「務め」は聖なる奉仕としての性格と任務性を簡潔に表す。
- source_word: בְּנֵי קְהָת
  choice: コハトの子ら
  rationale: ヘブライ語の親族表現を保った。「コハト族」も可能だが、原文の形を明確に伝える。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: בְּを奉仕が行われる領域・場所として「で」と訳した。「会見の天幕」は אֹהֶל מוֹעֵד の意味を明瞭に表す定訳的表現である。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 最も聖なるもの
  rationale: 民数記4章の文脈では、コハトの子らが扱う至聖の祭具を指す可能性が高い。場所だけを意味するよう限定せず、「もの」として訳した。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים־
  choice: 最も聖なるものについて
  rationale: 原文は名詞句を簡潔に並べるが、日本語では関係を明示しないと「務め」との同格に誤解されやすい。文脈上の対象関係を「について」で自然に示した。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים の指示対象
  choice: コハトの子らに委ねられた最も聖なる祭具を主に指すものとして「最も聖なるもの」と訳す
  alternative: 場所としての「至聖所」または「最も聖なる場所」
  rationale: 続く文脈は幕屋の調度品を覆い、運搬する務めを扱うため、ここでは祭具を集合的に指す理解が適切である。ただしヘブライ語の表現自体は至聖所にも用いられるため、脚注で別解を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奉仕」より任務性を自然に伝える「務め」を採用し、原文の簡潔さを保ちつつ、「について」を補って統語関係を明確にした。
