base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: ja
  text: メラリの子ら[a]を、その氏族ごと、父祖の家ごと[b]に数えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メラリの子孫」または「メラリ人」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「父祖の家」は、父系によって構成される家系上の集団を指すヘブライ語の表現。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: メラリの子ら
  rationale: 直訳的な親族表現を保つ。ここではメラリ本人の息子だけでなく、その系統に属する子孫たちを指す。
- source_word: לְמִשְׁפְּחֹתָם
  choice: その氏族ごと
  rationale: מִשְׁפָּחָה は人口調査の文脈で、部族内の血縁集団を表すため、「家族」よりも「氏族」が明確である。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: イスラエルの父系の家系・家族集団を表す定型的な系譜表現を保った。
- source_word: תִּפְקֹד אֹתָם
  choice: 数えなさい
  rationale: פקד はこの人口調査の文脈では、人数を調べて数に入れることを意味する。簡潔で自然な命令表現とした。
