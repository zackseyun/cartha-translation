  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: ja
  text: 三十歳以上、五十歳までの、会見の天幕での働きのために務めに就く者は皆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 三十歳以上
  rationale: 年齢を表す「בן＋数＋שנה」と下限を含む「ומעלה」を、現代日本語の自然な年齢範囲として表した。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳まで
  rationale: 上限を示す ועד を簡潔で自然な日本語にした。文脈上、範囲は三十歳から五十歳までを指す。
- source_word: כָּל הַבָּא לַצָּבָא
  choice: 務めに就く者は皆
  rationale: בוא の参与・加入の含意と、צבא の組織だった奉仕・任務の意味を一続きの自然な表現にした。軍事的な意味には限定しない。
- source_word: לַעֲבֹדָה
  choice: 働く
  rationale: עבודה の実際の仕事・労務という側面を表し、直前の צבא（務め）との語義上の違いを保った。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: 定型句 אהל מועד を「会見の天幕」とし、前置詞 ב を場所を示す「で」と訳した。
