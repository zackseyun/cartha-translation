  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: ja
  text: 彼らが生き、死ぬことのないよう、彼らのために次のようにしなさい。彼らが最も聖なるものに近づくとき、アロンとその子らは来て、彼ら一人一人に、それぞれの務めと運ぶべき荷を割り当てなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最も聖なるもの」は、「至聖所」または「最も聖なる場所」とも訳せる。ここでは運搬の務めが問題となっているため、最も聖なる祭具を指すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: 彼らのために次のようにしなさい
  rationale: 指示を導入する「これを行え」を、前後とのつながりと受益を示す לָהֶם を保ちつつ、自然な現代日本語にした。
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: 彼らが生き、死ぬことのないよう
  rationale: 命令された措置の目的・結果を表す連続として訳した。
- source_word: בְּגִשְׁתָּם
  choice: 彼らが……に近づくとき
  rationale: 前置詞 בְּ を伴う不定詞構文の時間的意味と、聖なるものへの祭儀的接近の含みを保持した。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 最も聖なるもの
  rationale: 運搬の文脈では至聖所という場所より、運ばれる最も聖なる祭具を集合的に指す可能性が高い。ただし語句自体の別の解釈は脚注に残した。
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: アロンとその子らが入り
  rationale: יָבֹאוּ の指示的用法を文全体の命令に組み込み、担当者たちのもとへ入って配置を行う動作として簡潔に表した。
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  choice: 一人一人を……割り当てなさい
  rationale: 「置く」と分配表現「人、人」を合わせ、各人を個別に任務へ配置する行政的意味を明確にした。
- source_word: עַל עֲבֹדָתוֹ
  choice: それぞれの務め
  rationale: レビ人に割り当てられた奉仕・任務を指すため、現代日本語で明瞭な「務め」とした。
- source_word: וְאֶל מַשָּׂאוֹ
  choice: 運ぶ荷
  rationale: 運搬文脈における具体的な荷物の意味を表し、「重荷」という比喩的な響きを避けた。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים の指示対象
  choice: 「最も聖なるもの」とし、聖なる祭具を集合的に指す読みを本文に採用した。
  alternative: 「至聖所」「最も聖なる場所」
  rationale: 直前まで祭具の覆いと運搬が扱われ、この節も務めと荷の割り当てを述べるため、物を指す読みが文脈に最も適する。ただし場所を指す可能性を排除せず脚注に示した。
- issue: אִישׁ אִישׁ の分配的・性別的表現
  choice: 「一人一人」
  alternative: 「各人」「一人ずつ」
  rationale: 男性レビ人が対象である文脈を損なわず、日本語では自然な分配表現である「一人一人」によって各個人への割り当てを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令のまとまりを自然に示しつつ、祭儀用語を過度に専門化しない。「一人一人」は原文の分配的反復を本文で明示するため、英語監査層の脚注に相当する情報を本文へ取り込んだ。
