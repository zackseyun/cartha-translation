revisions:
- from: 彼らが生き、死ぬことのないよう、彼らのために次のようにしなさい。彼らが最も聖なるものに近づくとき、アロンとその子らが入り、一人一人をそれぞれの務めと運ぶ荷に割り当てなさい。[a]
  to: 彼らが生き、死ぬことのないよう、彼らのために次のようにしなさい。彼らが最も聖なるものに近づくとき、アロンとその子らは来て、彼ら一人一人に、それぞれの務めと運ぶべき荷を割り当てなければならない。[a]
  rationale: 「入り」を原文の基本義である「来て」に改め、空間的な限定を加えないようにした。さらに、アロンとその子らが各コハテ人に個別の奉仕と運搬物を定めるという構文を、自然な現代日本語で明確にした。「一人一人」により אִישׁ אִישׁ の分配的反復を本文で保持している。
