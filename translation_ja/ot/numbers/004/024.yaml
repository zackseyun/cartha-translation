lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: これは…奉仕…に関するものである
  rationale: ヘブライ語の名詞文を自然な現代日本語にしつつ、指示語と「奉仕」の関係を明確にした。
- source_word: מִשְׁפְּחֹת הַגֵּרְשֻׁנִּי
  choice: ゲルション人の諸氏族
  rationale: מִשְׁפְּחֹת の複数形を「諸氏族」で表し、集合的な הַגֵּרְשֻׁנִּי をゲルションの子孫集団として訳した。
- source_word: לַעֲבֹד
  choice: 仕えること
  rationale: 目的・職務を示す不定詞であり、直前の「奉仕」と語根上の反復を保った。
- source_word: וּלְמַשָּׂא
  choice: 運搬
  rationale: מַשָּׂא は荷、担うこと、運搬を表し、幕屋の物品を運ぶ職務という文脈に自然な語を選んだ。目的語を本文に補わず、原文の簡潔さを保った。
