base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: ja
  text: 三十歳以上五十歳までで、会見の天幕で仕事をするために任務に就く者はすべて。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: 三十歳以上
  rationale: 「בן＋年数」は年齢を表し、וָמַעְלָה はその年齢以上を示す。現代日本語の年齢範囲として簡潔かつ自然に表現した。
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: 五十歳まで
  rationale: 上限を示す עַד を「まで」と訳し、五十歳を含む年齢範囲を自然に示した。
- source_word: כָּל בָּא לַצָּבָא
  choice: その奉仕に加わる者はすべて
  rationale: בָּא の「来る・入る」と צָבָא の組織的な任務・奉仕という文脈上の意味を合わせ、軍事的含意を避けつつ、任務に就くことを自然な日本語で表した。
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: 務めを果たすため
  rationale: 目的を示す不定詞句。מְלָאכָה は割り当てられた仕事を指すため、文脈に即して「務めを果たす」とした。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: אֹהֶל מוֹעֵד の意味を保つ慣用的な聖書用語として「会見の天幕」を採用し、בְּ は「で」として奉仕が行われる場を示した。
theological_decisions:
- issue: צָבָא の軍事的・組織的含意
  choice: 奉仕
  alternative: 軍務／部隊／任務
  rationale: レビ人が会見の天幕に関して行う組織的な務めを指し、軍事行動ではないため、「奉仕」が文脈に最も適する。
translation_notes:
  register: 明快な現代標準日本語。祭儀的文脈にふさわしい品位を保ちながら、直訳調の「上へ」「軍勢に入る」は避けた。節が前文の数え上げ命令に続く年齢・資格句であるため、原文同様、独立した完全文に補いすぎない形とした。
