  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: ja
  text: その上にタハシュの皮の覆い[a]をかけ、その上に青一色の布を広げ、担ぎ棒を所定の位置に据える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」が何を指すかは不明である。特定の動物の皮を指すと考えられ、伝統的には「ヤギの皮」「イルカの皮」「ジュゴンの皮」など、さまざまに訳されてきた。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: その上に…掛け
  rationale: 覆いを対象物の上に置く動作を、手順文として自然な現代日本語で表した。接続された完了形の指示的用法は、簡潔な非過去形で訳した。
- source_word: כְּסוּי
  choice: 覆い
  rationale: 対象を覆う物を指す名詞として、文脈に即した平明な語を選んだ。
- source_word: עוֹר תַּחַשׁ
  choice: タハシュの皮
  rationale: תַּחַשׁが指す動物または皮革の種類は不確かであるため、特定の動物名や品質を推定せず、音写して注記した。
- source_word: וּפָרְשׂוּ
  choice: 広げ
  rationale: 布を覆いとして広げる動作を自然に表す。
- source_word: בֶגֶד
  choice: 布
  rationale: 通常は衣服も意味するが、ここでは箱を覆うために広げる素材なので「布」が文脈に合う。
- source_word: כְּלִיל תְּכֵלֶת
  choice: 全体が青色の
  rationale: כְּלִילの完全性を「全体が」で明示し、תְּכֵלֶתは幕屋関連の染色名として一般読者に分かりやすい「青色」とした。
- source_word: מִלְמָעְלָה
  choice: さらにその上に
  rationale: 直訳的には「上方に／上から」だが、覆いを重ねる順序を示す文脈に沿って、青い布が最上層になることを自然に表した。
- source_word: וְשָׂמוּ בַּדָּיו
  choice: 担ぎ棒を取り付ける
  rationale: שׂיםは置く・据える、בַּדִּיםは運搬用の棒を指す。ここでは棒を所定の位置に据える手順として「取り付ける」とした。
