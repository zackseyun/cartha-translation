  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: ja
  text: 彼らはそれとそのすべての用具をタハシュ[a]の皮の覆いに入れ、それを担ぎ棒の上に載せる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「タハシュ（תַּחַשׁ）」が何を指すかは不明である。特定の動物の皮、または耐久性のある革の一種を指す可能性がある。伝統的には「じゅごんの皮」などとも訳されてきた。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: 入れ
  rationale: 手順を示す接続形の完了動詞。ここでは物を覆いの中に収める動作なので、自然な日本語の「入れ」とした。
- source_word: אֹתָהּ
  choice: それ
  rationale: 女性単数代名詞で、前節の燭台を受ける。本文にない名詞を補わず、照応を保った。
- source_word: כָּל כֵּלֶיהָ
  choice: そのすべての用具
  rationale: כֵּלִים は器具・備品を広く指す。幕屋の文脈で明瞭かつ自然な「用具」とした。
- source_word: אֶל מִכְסֵה
  choice: 覆いに入れ
  rationale: נתן とともに用いられた אֶל は、覆いの中へ収める動きを表しうる。日本語では「覆いに入れ」が簡潔で自然。
- source_word: עוֹר תַּחַשׁ
  choice: 上質な革
  rationale: תַּחַשׁ が指す動物または革の種類は不確かである。特定の動物名を断定せず、保護用の革という文脈を読みやすく表したうえで、不確実性を脚注に明記した。
- source_word: וְנָתְנוּ
  choice: 載せる
  rationale: 反復された動詞が次の手順を導く。包んだ物を担ぎ棒の上に置く動作として「載せる」が自然。
- source_word: עַל הַמּוֹט
  choice: 担ぎ棒の上に
  rationale: מוֹט は運搬に用いる棒・横木を指す。ヘブライ語の単数形と具体的な運搬機能を保つため「担ぎ棒」とした。
