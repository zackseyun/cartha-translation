  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: ja
  text: 彼らは、幕屋の幕、会見の天幕とその覆い、会見の天幕の上を覆うタハシュの覆い、また会見の天幕の入口の垂れ幕を運ぶ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: 彼らは……運ぶ
  rationale: 移動の際に聖所の資材を担って運ぶ文脈であり、現代日本語として自然な「運ぶ」とした。
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: 幕屋の幕
  rationale: יְרִיעֹת は幕屋を構成する布製の幕を指す。「幕屋の幕」は簡潔で、原語の関係も保つ。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 物理的な天幕であることと、そこで会うという名称の機能をともに表す、定着した訳語を用いた。
- source_word: מִכְסֵהוּ
  choice: その覆い
  rationale: 接尾辞が直前の会見の天幕を受けることを示しつつ、覆いの材質や層を本文以上に限定しない。
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: タハシュ革の覆い
  rationale: תַּחַשׁ の指す動物または素材は不確かであるため、特定の動物名や品質を断定せず音写し、「革」で覆いの素材であることを示した。
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: その上に掛ける
  rationale: 覆いが天幕の上部に位置することを、重複感の強い直訳を避けながら自然な日本語で表した。
- source_word: מָסַךְ פֶּתַח
  choice: 入り口の垂れ幕
  rationale: 幕屋の入口を仕切る掛け布を指すため、機能と形状が分かる「垂れ幕」とした。
