  text: וַ/יִּֽהְיוּ֙ פְּקֻ֣דֵי/הֶ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם אַלְפַּ֕יִם וְ/שֵׁ֥שׁ מֵא֖וֹת וּ/שְׁלֹשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: ja
  text: 氏族ごと、父祖の家ごとに数えられた者[a]は、二千六百三十人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「登録された者」または「点呼された者」。ヘブライ語は、人口調査で名簿に登録され、数えられた人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: …であった
  rationale: 人口調査の定型表現における連結・結果を表す動詞として、人数を自然に提示する現代日本語にした。
- source_word: פְּקֻדֵיהֶם
  choice: 数えられた者
  rationale: פקדの人口調査における受動的意味を反映し、登録・点呼の対象となった人々を指す表現とした。「人数」だけにすると、原文が指す数えられた人々という含みが弱まるため避けた。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָהはこの人口調査の文脈では親族集団の区分を指すため、「家族」よりも「氏族」が適切である。前置詞לְは分類の基準として「ごと」と訳した。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごと
  rationale: イスラエルの系譜・人口調査における社会的単位を示す定型句を保ちつつ、現代日本語でも理解できる表現にした。
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: 二千六百三十人
  rationale: 原文の基数を標準的な日本語の数表現で示し、数えられた人々の総数なので助数詞「人」を補った。
