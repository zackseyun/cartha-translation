  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: ja
  text: 宿営が出発するとき、アロンとその子らは来て、仕切りの幕を取り外し、それであかしの箱[a]を覆う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「契約の箱」とも訳されるが、ここでヘブライ語本文が用いている語は「契約」ではなく「あかし」である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: 中に入り
  rationale: 形は単数だが、主語は「アロンとその子ら」で、後続の動詞は複数形である。文脈上、聖所内に入って覆いを取り外す動作を表すため、「中に入り」とした。
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: 宿営が旅立つとき
  rationale: 前置詞בを伴う不定詞構文を時の状況として訳した。宿営全体が移動を開始する意味を、自然な現代日本語で表した。
- source_word: וְהוֹרִדוּ
  choice: 取り外し
  rationale: 幕屋を解体して運搬準備をする文脈では、単に「下ろす」より、所定の位置から外すことを示す「取り外す」が明瞭である。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 仕切りの垂れ幕
  rationale: פָּרֹכֶתの聖所を隔てる幕という祭儀的機能と、הַמָּסָךְの遮蔽・仕切りの意味を、過度に逐語的で不自然な表現にせず保持した。
- source_word: וְכִסּוּ בָהּ
  choice: それで…を覆う
  rationale: כסהの基本義「覆う」を保ち、女性単数代名詞が直前の垂れ幕を指し、手段を表すことを「それで」によって明示した。
- source_word: אֲרֹן הָעֵדֻת
  choice: あかしの箱
  rationale: 本文は「契約」を意味するבְּרִיתではなく、「あかし・証言」を意味するעֵדוּתを用いるため、伝統的な「契約の箱」に置き換えず原語の区別を保持した。
theological_decisions:
- issue: אֲרֹן הָעֵדֻתの伝統的訳語
  choice: あかしの箱
  alternative: 契約の箱
  rationale: 原文のעֵדוּת（あかし）とבְּרִית（契約）の語彙的区別を尊重した。「契約の箱」という広く知られた呼称との関係は脚注で示し、本文では原語を優先した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あかし」は聖書的な語感を残しつつ理解可能な表記とし、「証し」よりも固定的な祭儀用語としてのまとまりを持たせた。命令・規定の文脈は日本語の非過去形で自然に表現した。
