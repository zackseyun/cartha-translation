  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ja
  text: これは、会見の天幕におけるすべての務めに関してメラリの子らの諸氏族が行う奉仕であり、祭司アロンの子イタマルの監督[a]のもとにある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「イタマルの手によって」。ここでは、監督または職務上の管理を表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: これは……務め……である
  rationale: 女性単数の指示語で総括を導く構文。「務め」は、レビ人に割り当てられた礼拝施設での奉仕職務を表す。
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: メラリの子らの諸氏族
  rationale: בְּנֵי の系譜的な表現を保ちつつ、מִשְׁפְּחֹת が部族内の複数の氏族集団を指すことを明確にした。
- source_word: לְכָל עֲבֹדָתָם
  choice: すなわち彼らのすべての奉仕
  rationale: 前半の「務め」を、その職務全体という観点から言い換える総括と理解した。עֲבֹדָה の反復は、日本語では「務め／奉仕」と訳し分け、意味上のつながりと自然さを両立させた。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で行う
  rationale: בְּ を奉仕の場所・領域として訳した。「会見の天幕」は אֹהֶל מוֹעֵד の定着した意味を明瞭に伝える。
- source_word: בְּיַד
  choice: 指揮のもとで
  rationale: 字義は「手によって／手のもとで」だが、ここではイタマルによる監督・管理を表す慣用句である。現代日本語でその行政的な意味を自然に示した。
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの子イタマル
  rationale: הַכֹּהֵן は統語上アロンを直接修飾するため、「祭司アロン」とした。系譜関係を簡潔に保った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調ある現代標準日本語。レビ人の職務を表す語として「務め」と「奉仕」を用い、原文における עֲבֹדָה の反復を意味上保持した。脚注記号は、その説明対象である「指揮」に付した。
