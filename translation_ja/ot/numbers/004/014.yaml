id: NUM.4.14
reference: Numbers 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: ja
  text: それから彼らは、祭壇で務めを行うために用いるすべての用具、すなわち、火皿、フォーク、灰取り、鉢、すべての祭壇用具をその上に置く。その上にタハシュの皮[a]の覆いを広げ、担ぎ棒を取り付ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」が指す動物またはその皮の種類は不明である。「やぎの皮」「海獣の皮」、または特定しない「耐久性のある皮革」とも訳される。
    reason: 原語תַּחַשׁの動物学的同定および皮革の種類が不確かなため、本文では音写し、異なる可能な理解を示す。
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: それから彼らは……その上に置く
  rationale: 一連の手順を示す接続形の順次性を「それから」で表し、עָלָיוは文脈上の祭壇を指すため「その上に」とした。
- source_word: כָּל כֵּלָיו
  choice: すべての用具
  rationale: כְּלִיは器具・道具を広く指す。祭壇奉仕に使う複数種の品を自然に包括する語として「用具」を選んだ。
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: 祭壇で務めを行うために用いる
  rationale: שרתの祭儀的な奉仕の意味を「務めを行う」で保ち、道具を用いる関係が日本語で明瞭になるように表した。
- source_word: הַמַּחְתֹּת
  choice: 火皿
  rationale: 炭火を扱う皿状の器具を指すため、香炉と限定せず「火皿」とした。
- source_word: הַמִּזְלָגֹת
  choice: 肉刺し
  rationale: 祭壇奉仕で用いる叉状の器具を、現代日本語で機能が分かるよう「肉刺し」とした。ただし語そのものは一般に「叉、フォーク」を意味する。
- source_word: הַיָּעִים
  choice: 灰取り
  rationale: 祭壇の灰などをすくい取る器具であり、「シャベル」より用途が伝わる「灰取り」とした。
- source_word: הַמִּזְרָקֹת
  choice: 鉢
  rationale: 液体、とりわけ祭儀で血を受けたり注いだりする器を指すが、本文では用途を限定せず、形状を自然に示す「鉢」とした。
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: 祭壇のすべての用具
  rationale: 列挙を総括する同格表現として、前半と同じ「用具」を反復した。
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: その上に……覆いを広げ
  rationale: פרשׂの「広げる」という動作とכְּסוּיの「覆い」をそれぞれ明示した。
- source_word: עוֹר תַּחַשׁ
  choice: 丈夫な皮革[a]
  rationale: תַּחַשׁが指す動物または皮革の種類は不確かである。本文では保護用素材として自然な総称を用い、特定の動物名を断定せず、異訳の可能性を脚注に示した。
- source_word: וְשָׂמוּ בַדָּיו
  choice: 担ぎ棒を取り付ける
  rationale: שׂיםは「置く、据える」、בַּדִּיםは運搬用の棒を指す。祭壇を運ぶ準備という文脈に即して「取り付ける」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、幕屋運搬の規定にふさわしい簡潔で端正な文体とした。列挙は「すなわち」で導き、原文の総括句も残した。脚注記号は不確かな皮革語の直後に置いた。
