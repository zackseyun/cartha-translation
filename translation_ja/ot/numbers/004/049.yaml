source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: ja
  text: 'ヤハウェの命令により[a]、彼らはモーセを通して[b]、各自の務めと担う荷に応じて、一人ひとり数えられた。その登録は、ヤハウェがモーセに命じたとおりであった[c]。


    [a] 直訳「ヤハウェの口に基づいて」。ここでは「ヤハウェの命令により」という意味。


    [b] 直訳「モーセの手によって」。モーセを介することを表すヘブライ語の言い回し。


    [c] 末尾のヘブライ語は解釈が難しい。ここでは登録全体を指すものとして訳したが、「彼に属する登録された者たち」あるいは「彼の任命・割り当て」と理解することもできる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤハウェの口に基づいて」。ここでは「ヤハウェの命令により」という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳「モーセの手によって」。モーセを介することを表すヘブライ語の言い回し。
    reason: lexical_alternative
  - marker: c
    text: 末尾のヘブライ語は解釈が難しい。ここでは登録全体を指すものとして訳したが、「彼に属する登録された者たち」あるいは「彼の任命・割り当て」と理解することもできる。
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: ヤハウェの命令により
  rationale: 「～の口に基づいて」という慣用句を、命令への従属を表す自然な日本語にした。固有名יהוהは「ヤハウェ」とした。
- source_word: פָּקַד אֹתָם
  choice: 彼らは…数えられた
  rationale: פקדは数える、登録する、任命するなどの意味を持つが、民数記4章の奉仕者の人口調査という文脈を優先した。ヘブライ語は単数能動形だが、明示されない主語を補わず、日本語では受動形とした。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセを通して
  rationale: 直訳は「モーセの手によって」。人物を介した行為を示す慣用表現として、現代日本語で明瞭にした。
- source_word: אִישׁ אִישׁ
  choice: 一人ひとり
  rationale: 語の反復が持つ個別・配分の意味を自然に表した。文脈上は奉仕を担う男性を指すが、日本語では性別を不必要に重ねず個々人を示す。
- source_word: עַל עֲבֹדָתוֹ
  choice: それぞれの奉仕に応じて
  rationale: 幕屋に関する割り当てられた務めを表すため、「仕事」ではなく文脈に適した「奉仕」とした。
- source_word: וְעַל מַשָּׂאוֹ
  choice: 運ぶ荷に応じて
  rationale: מַשָּׂאは担って運ぶ物を指す。抽象的な「重荷」ではなく、幕屋の運搬物であることが伝わる表現とした。
- source_word: וּפְקֻדָיו
  choice: こうして彼らは…モーセによって登録された
  rationale: 形態と統語が難しい表現であり、פקדの受動的な意味を人口調査・登録の文脈に沿って再現した。接尾辞をモーセとの関係として示しつつ、別解を脚注に残した。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおり
  rationale: 省略を含む関係節を、直前の登録が神の命令どおりであったと理解できる自然な日本語にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に固有名として記された四文字神名を称号に置き換えず、一般的な学術的転写に基づく日本語表記を用いた。
- issue: וּפְקֻדָיוの解釈
  choice: モーセによって登録された
  alternative: 彼に属する、数えられた者たち／彼から任命を受けた者たち
  rationale: 人口調査を締めくくる文脈と語根פקדの反復を重視したが、任命・割り当ての含意を排除できないため脚注で保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「一人ひとり」で配分的な強調を保ち、「運ぶ荷」で幕屋運搬の具体性を示した。難解な末尾句は本文を過度に不自然にせず、真正な曖昧さを脚注に明記した。
