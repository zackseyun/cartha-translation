id: NUM.4.45
reference: Numbers 4:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: ja
  text: これらは、モーセとアロンが、ヤハウェの命令に従って[a]、モーセを通して[b]数えた、メラリの子孫の諸氏族の登録された者たちである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤハウェの口によって」。すなわち「ヤハウェの命令に従って」。
    reason: ヘブライ語の慣用表現の字義と意味を示すため。
  - marker: b
    text: 直訳「モーセの手によって」。すなわち「モーセを通して」。
    reason: ヘブライ語の媒介を表す慣用表現を示すため。
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: これは…数えられた者たちである
  rationale: 人口調査のまとめを示す表現として、提示の働きと受動的な意味を自然な現代日本語で表した。文脈上対象は奉仕に適格な男子だが、この節だけで「男たち」を補わず「者たち」とした。
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: メラリの子孫の諸氏族に属する
  rationale: בני の系譜的意味を「子孫」とし、משפחת の複数形を「諸氏族」として部族内の集団を明確にした。
- source_word: פָּקַד
  choice: 数えた
  rationale: 同節の פְקוּדֵי と語義上の対応を保ち、民数記4章の登録・点呼の文脈を平明に表す。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従い
  rationale: 直訳は「ヤハウェの口に基づいて」だが、ここでは命令を表す確立したヘブライ語慣用句であり、日本語本文ではその意味を自然に示した。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセを通して
  rationale: 直訳「モーセの手によって」が示す媒介・代理の意味を、自然で明瞭な日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号に置換せずに保持するため。
- issue: עַל פי יהוה と בְּיַד משה の関係
  choice: 神の命令とモーセの媒介をそれぞれ明示する
  alternative: 両方を単に「モーセによって」と意訳する
  rationale: 命令の源がヤハウェであり、その命令がモーセを通して伝達・実施されたという原文の二つの要素を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い関係節を二文に分け、同じ対象を指すことが分かるよう「者たち」を反復した。脚注記号は対応する語句の直後に置いた。
