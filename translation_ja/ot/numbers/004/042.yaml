lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: 登録された者は
  rationale: 名詞的な受動表現で、人口調査によって数えられ、登録された者たちを指す。日本語では文脈に即して自然に表現した。
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: メラリの子孫の諸氏族
  rationale: בני は系譜上の集団を表すため「子孫」とし、משפחת の複数形は「諸氏族」とした。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: לְ の分類・単位を示す用法を、日本語の「ごと」で明確にした。
- source_word: לְבֵית אֲבֹתָם
  choice: 父祖の家ごとに
  rationale: בית אבות は父系の家族集団を表す定型句であり、他の集団単位との区別を保つため「父祖の家」とした。
