  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: ja
  text: 彼らのうち登録された男子は、八千五百八十人であった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らのうち数えられた者たち」または「彼らの登録者」。ヘブライ語は、人口調査で数えられ、登録された者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であった
  rationale: ここでは人口調査の合計数を示す単純な繋辞として機能しているため、自然で格調ある過去表現とした。
- source_word: פְּקֻדֵיהֶם
  choice: 彼らのうち登録された男子
  rationale: פקדに由来し、この文脈では人口調査で数えられ、登録された者を指す。民数記4章の直前の文脈では幕屋の奉仕に適格なレビ人男子が対象なので、「男子」として実際の指示対象を明示した。
- source_word: שְׁמֹנַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וּשְׁמֹנִים
  choice: 八千五百八十人
  rationale: ヘブライ語の加算的な数詞表現を、現代日本語で通常用いるまとまった数の形にした。人の総数なので助数詞「人」を添えた。
theological_decisions:
- issue: 人口調査の対象者を表す性別表現
  choice: 登録された男子
  alternative: 登録された者たち／数えられた者たち
  rationale: ヘブライ語の語形自体は登録・点呼された者を表すが、民数記4章の文脈では一定年齢の男子が幕屋奉仕のために数えられている。「男子」は文脈上の実際の対象を正確に示し、性別を不必要に中立化しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、人口調査の集計を簡潔かつ荘重に表現した。「彼らのうち」によって接尾辞の所属関係を示し、文脈から明らかな男性という指示対象も保持した。
