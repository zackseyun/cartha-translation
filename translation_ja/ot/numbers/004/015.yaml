  to: アロンとその子らが、宿営が出発するときに、聖なるものとすべての聖具を覆い終えた後、ケハトの子らが来て、それらを運ぶ。しかし、彼らは聖なるものに触れてはならない。さもなければ死ぬ。[a] これらが、会見の天幕に関してケハトの子らが運ぶべきものである。[b]
  rationale: 原文の手順、すなわちアロンとその子らが聖なる物品を覆い終えた後にケハトの子らが運搬するという順序を明示した。第1の「聖なるもの」は建物としての「聖所」に限定せず、文脈に合う集合的表現に改めた。禁止違反に伴う死は、原文どおり直接的な結果として訳し、脚注で「聖所」と取る代替可能性を保持した。
