id: NUM.4.15
reference: Numbers 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: ja
  text: アロンとその子らが、宿営が出発するときに、聖なるものとすべての聖具を覆い終えた後、ケハトの子らが来て、それらを運ぶ。しかし、彼らは聖なるものに触れてはならない。さもなければ死ぬ。[a] これらが、会見の天幕に関してケハトの子らが運ぶべきものである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なるもの」は「聖所」とも訳せる。また、「触れてはならない。そして彼らは死ぬ」とも訳せる。原文は死という結果を直接述べている。
    reason: alternative_reading
  - marker: b
    text: 「運ぶべきもの」は、運搬する物と、それを運ぶ任務の両方を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: 覆い終えたなら
  rationale: 完了を表す動詞と不定詞の組み合わせを、手順の完了を明確にする自然な現代日本語で表した。
- source_word: הַקֹּדֶשׁ（最初の用例）
  choice: 聖所
  rationale: 続く「聖所のすべての用具」と区別しつつ、礼拝に関わる聖なる領域・設備を指す語として簡潔に訳した。
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: 聖所のすべての用具
  rationale: כְּלֵי は器具・備品・用具を意味する。ここでは運搬される設備を広く含む「用具」が明瞭である。
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: 宿営が出発するとき
  rationale: 時間を示す不定詞構文を保ち、移動開始の場面を自然に表した。
- source_word: בְנֵי קְהָת
  choice: ケハトの子ら
  rationale: 字義的な親族・氏族表現を保持した。「ケハト族」とすることも可能だが、原文の形を優先した。
- source_word: לָשֵׂאת
  choice: それらを運ばなければならない
  rationale: 目的語は直前の覆われた聖なる用具から補った。未完了形が規定する任務を「なければならない」で表した。
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: しかし、彼らは聖なるものに触れてはならない
  rationale: 文脈上、覆われた聖なる物品への直接接触を禁じる規定と理解した。ただし「聖所」を指す可能性も脚注で保持した。
- source_word: וָמֵתוּ
  choice: 触れるなら死ぬからである
  rationale: 原文は結果を「そして彼らは死ぬ」と直接述べる。日本語では警告としての因果関係を明瞭にしつつ、その確定的な結果を弱めない表現とした。
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: これらが、…ケハトの子らの担う荷である
  rationale: מַשָּׂא の具体的な「荷」と、担う任務という含意の双方が伝わる表現にした。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕における
  rationale: 前置詞 בְּ を奉仕・任務の領域として訳し、単なる物理的位置に限定しない自然な表現とした。
theological_decisions:
- issue: 禁止条項における הַקֹּדֶשׁ の指示対象
  choice: 聖なるもの（聖なる物品）
  alternative: 聖所
  rationale: 直前では覆われて運搬される用具が扱われているため、直接触れてはならない対象を聖なる物品と理解した。ただし、この名詞は聖所を指すこともできるため、脚注で曖昧さを示した。
- issue: וָמֵתוּ が示す死の結果
  choice: 触れるなら死ぬからである
  alternative: そして彼らは死ぬ
  rationale: 禁止に違反した結果として死が生じるという原文の強い警告を保持し、目的表現だけに弱めないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会見の天幕」「聖所」など民数記の祭儀的文脈に適した語を用い、手順と警告が普通の読者にも追いやすい文にした。
