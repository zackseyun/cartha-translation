base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: ja
  text: 'ゲルション族の子らのすべての奉仕は、彼らが運ぶすべての荷物と、彼らのすべての奉仕について、アロンとその子らの指示[a]に従って行われるものとする。あなたがたは、彼らが運ぶすべての荷物を、彼らの務め[b]として割り当てなければならない。


    [a] 直訳は「アロンとその子らの口に従って」。ここでは、その命令または指示に従うことを意味する。


    [b] 「責任として」とも訳せる。ヘブライ語は、割り当てられた責任や義務を表す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「アロンとその子らの口に従って」。ここでは、その命令または指示に従うことを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「責任として」とも訳せる。ヘブライ語は、割り当てられた責任や義務を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: 指示に従って
  rationale: 字義的には「口に従って」だが、人の命令・指図に従うというヘブライ語の慣用句。行政上の監督を自然な現代日本語で示す。
- source_word: תִּהְיֶה
  choice: 行われる
  rationale: 連結動詞の指示的用法を、主語「奉仕」と自然につながる日本語にした。規定としての響きも保つ。
- source_word: עֲבֹדַת
  choice: 奉仕
  rationale: 幕屋に関するレビ人の割り当てられた労務を指す。「奉仕」は宗教的任務と実際の作業の両面を表せる。
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: ゲルション族の子ら
  rationale: 「ゲルション人の子ら」という氏族的・系譜的表現を保ちつつ、日本語として所属関係を明確にした。
- source_word: לְכָל מַשָּׂאָם
  choice: その運ぶ物すべてについて
  rationale: מַשָּׂא はここでは幕屋の移動時に担う具体的な荷を指す。「重荷」の比喩的連想を避けた。接頭辞 לְ は後続の奉仕とともに監督の範囲を示すものと理解した。
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: その奉仕すべてについて
  rationale: 前半の עֲבֹדָה と訳語を統一し、アロンとその子らの指示が及ぶ範囲を示した。
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: あなたがたは、彼らに……割り当てなければならない
  rationale: פקד の幅広い意味のうち、目的語が「運ぶ物」である文脈から、各自に担当・責任を割り当てる意味を採った。二人称複数も明示した。
- source_word: בְּמִשְׁמֶרֶת
  choice: 務めとして
  rationale: 任された責任、義務、担当を表す語。「務め」はこの文脈で自然であり、単なる監視や保管に限定しない。
- source_word: אֵת כָּל מַשָּׂאָם
  choice: 彼らの運ぶ物すべてを
  rationale: 直接目的語として、彼らが運搬を担当する具体的な品々を示す。原文の反復も保持した。
