source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: ja
  text: これらは、ケハト人の諸氏族のうち、会見の天幕で務めに当たるすべての者で、ヤハウェがモーセを通して与えた命令に従い、モーセとアロンが登録した者たちである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקוּדֵי
  choice: 登録された人々
  rationale: פקדが人口調査・任務適格者の集計を表す文脈なので、単なる人数ではなく、数え上げて名簿に入れられた人々を自然な日本語で示した。
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: ケハト人の諸氏族
  rationale: מִשְׁפָּחָהはここでは拡大家族から成る氏族集団を指す。「諸氏族」により複数形と集団性を保った。
- source_word: כָּל הָעֹבֵד
  choice: 務めに当たる者
  rationale: עבדの分詞は継続的な奉仕・任務への従事を表す。文脈上のレビ人の奉仕を、現代日本語で明瞭に表現した。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕で
  rationale: אֹהֶל מוֹעֵדを、その機能を示す定着した聖書用語「会見の天幕」とし、前置詞בְּは奉仕の場を示す「で」とした。
- source_word: אֲשֶׁר פָּקַד
  choice: 登録した人々
  rationale: 関係節を日本語で独立した説明文として表し、פקדが任命ではなく数え上げ・登録を意味することを明確にした。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従い
  rationale: 直訳は「ヤハウェの口に従って」だが、命令への服従を表すヘブライ語慣用句として自然に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセを通して
  rationale: בְּיַדはここで手段・媒介を示す慣用句であり、日本語として自然な「モーセを通して」とした。字義的表現も脚注に示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の四文字神名を称号で代替せず、固有名として示した。
- issue: בְּיַד מֹשֶׁה が示す媒介
  choice: モーセを通して
  alternative: モーセの手によって
  rationale: 神の命令がモーセを媒介として伝えられたという原文の作用関係を自然に表した一方、字義的な像を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奉仕」より広く実務的な意味を保つため「務めに当たる」とし、人口調査上の数え上げには「登録」を用いた。原文の反復を保つため、二文目でも「登録した人々」と明示した。
