revisions:
- from: これらは、ケハト人の諸氏族のうち、会見の天幕で務めに当たる者として登録された人々である。モーセとアロンが、ヤハウェの命令に従い、モーセを通して[a]登録した人々である。
  to: これらは、ケハト人の諸氏族のうち、会見の天幕で務めに当たるすべての者で、ヤハウェがモーセを通して与えた命令に従い、モーセとアロンが登録した者たちである。
  rationale: 原文の「これらは…であり、モーセとアロンが…登録した者たち」という構造を一文で再現した。「モーセを通して」は、直前の「ヤハウェの命令」に係る形で表し、モーセとアロンが登録を行ったという明示された主語との不必要な混同を避けた。脚注アンカー[a]は本文の「モーセを通して」の直後に置くことが望ましい。
