base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: ja
  text: それから彼らは、聖所での務めに用いるすべての用具を取り、青い布で包み、その上にタハシュの皮の覆いをかけて、担ぎ棒の上に置く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: それから彼らは……取り
  rationale: 一連の運搬手順を示す接続形として、継起を自然な現代日本語の「それから」で表した。
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: 務めに用いるすべての用具
  rationale: כְּלִי は器具・用具、הַשָּׁרֵת は聖所での奉仕を表す。日本語では機能が明瞭になるよう「務めに用いる……用具」とした。
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם בַּקֹּדֶשׁ
  choice: 聖所での務めに用いる
  rationale: שרת の祭儀的な奉仕と、בם の「それらを用いて」という手段の意味を簡潔にまとめた。קֹדֶשׁ はここでは特定の奥の部屋に限定せず「聖所」とした。
- source_word: בֶּגֶד תְּכֵלֶת
  choice: 青い布
  rationale: בֶּגֶד はこの梱包の文脈では「衣」より「布」が自然で、תְּכֵלֶת の青系の色を明瞭に表す。
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: 丈夫な革の覆い
  rationale: תָּחַשׁ の指す動物または革の種類は不明である。特定の動物名を断定せず、運搬時の保護材という文脈に沿う訳とし、不確かさは脚注に示した。
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: 運搬台に載せる
  rationale: מוֹט は単数形で棒・横木を指し得るが、ここでは用具一式を載せて運ぶ装置を集合的に指す可能性があるため、「運搬台」とした。字義的な別訳は脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀上の文脈にふさわしい端正さを保った。「奉仕」よりも文中で自然な「務め」を採用し、原語上確定できない革の種類と運搬器具の形状は脚注で明示した。
