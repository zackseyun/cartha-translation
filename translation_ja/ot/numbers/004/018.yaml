  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: ja
  text: レビ人の中から、コハト人の諸氏族から成る部族を絶やしてはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レビ人の中から、コハト人の諸氏族の部族を断ち切ってはならない」または「滅ぼしてはならない」とも訳せる。ヘブライ語の動詞には「断ち切る」と「滅ぼす」の意味合いがあり、集団を表す語も「部族」または「氏族」と訳し分けることができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּכְרִיתוּ
  choice: 断ち滅ぼしてはならない
  rationale: 禁止を明確に表しつつ、使役形が持つ「断ち切らせる／滅ぼすに至らせる」という幅を保つ。「滅ぼす」だけに限定せず、集団がレビ人の中から絶たれる含みも伝える。
- source_word: שֵׁבֶט
  choice: 部族
  rationale: 系譜的集団を指す語として、現代日本語で理解しやすい標準的な訳語を用いた。
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: コハト人の諸氏族
  rationale: 複数形の「氏族」と、集合的にコハト系集団を示す形容詞的民族名の両方を表した。
- source_word: מִתּוֹךְ הַלְוִיִּם
  choice: レビ人の中から
  rationale: より大きな集団の内部から分離・除去される関係を、自然な日本語で保持した。
theological_decisions:
- issue: コハト人の集団に対する禁止の意味
  choice: レビ人の中からコハト人の集団が断ち滅ぼされる事態を引き起こしてはならない、という幅のある警告として訳した。
  alternative: 聖なる物の扱いを誤って彼らを死なせてはならない、という具体的意味に限定する。
  rationale: 周辺文脈は死の危険を説明するが、この節自体はその仕組みを明示していない。そのため、具体的な死因を本文へ補わず、原文の広い表現と緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、命令には厳粛さを残した。「諸氏族という部族」は原文に並ぶ二段階の集団名称を省略せず示すための表現である。
