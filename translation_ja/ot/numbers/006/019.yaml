  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: ja
  text: 祭司は、雄羊の煮た前脚を取り、かごから種なしパン一個と種なしの薄焼きパン一枚を取り、ナジル人がその聖別の髪をそった後[a]、それらをその人の両手のひらに載せる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼の聖別をそった後」。ここで「聖別」は、ナジル人としての聖別を示していた髪を指す。
    reason: 原文の נִזְרוֹ は字義的には「彼の聖別」である。文脈上そられるのは髪であるため本文では補って示し、脚注で原文の表現を保存する。
lexical_decisions:
- source_word: וְלָקַח
  choice: 祭司は……取り
  rationale: 儀礼手順を示す文脈なので、接続詞を機械的に「そして」とせず、後続する動作の順序が自然に伝わる形にした。
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: 煮た前脚
  rationale: זְרוֹעַ は犠牲動物の前脚部分を指し、בְּשֵׁלָה はそれが煮て調理されたものであることを示す。
- source_word: חַלַּת מַצָּה אַחַת
  choice: 種なしの輪形パンを一個
  rationale: חַלָּה はまとまりのある輪形または丸形のパンを表し、מַצָּה はパン種を入れないことを示す。薄い רָקִיק との違いも保った。
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: 種なしの薄焼きパンを一枚
  rationale: רָקִיק の薄いパンという特徴を明示し、日本語では平たく薄い食品に自然な助数詞「枚」を用いた。
- source_word: עַל כַּפֵּי הַנָּזִיר
  choice: ナジル人の両手のひらに
  rationale: כַּפֵּי は手全体よりも両方の手のひらを具体的に指す。נָזִיר はこの誓願によって聖別された人を表す慣用的な音写「ナジル人」とした。
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: そった後
  rationale: 主たる儀礼動作より前に、そる行為が完了しているという時間関係を自然な日本語で示した。
theological_decisions:
- issue: נִזְרוֹ の具体的指示対象
  choice: 聖別のしるしである髪
  alternative: 自分の聖別／自分の聖別された頭
  rationale: 語そのものは「彼の聖別（ナジル人としての身分・しるし）」を意味し得るが、この儀礼では実際にそる対象は髪である。本文では身体的な動作が明瞭になるようにしつつ、脚注で原文の抽象性と含意を保存した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある儀礼規定の文体とした。「前脚」「両手のひら」で身体部位を具体的に訳し、「輪形パン」と「薄焼きパン」の区別を保った。
