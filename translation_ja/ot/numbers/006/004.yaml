  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: ja
  text: ナジル人として聖別されている間、ぶどうの木から作られるものは、種から皮に至るまで[a]、何一つ食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「種から皮に至るまで」は、ぶどうのあらゆる部分を指す表現。
    reason: 原文の両端表現が禁止範囲の包括性を示すことを説明するため。
lexical_decisions:
- source_word: כֹּל יְמֵי נִזְרוֹ
  choice: ナジル人として身をささげている期間中は
  rationale: 直訳的には「彼の聖別のすべての日」。民数記6章の制度的文脈を明示しつつ、נִזְרוֹ が表す分離・奉献の状態とその全期間を自然な現代日本語で表した。原文には「誓願」に当たる נֶדֶר がないため、「誓願の期間」と限定しすぎなかった。
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: できるものを……何一つ
  rationale: מִן と כֹּל が示す禁止対象の全範囲を、後置された否定動詞と合わせ、日本語では「何一つ……ない」として明確に表した。
- source_word: מִגֶּפֶן הַיַּיִן
  choice: ぶどうの木から
  rationale: 字義的には「ぶどう酒のつるから」だが、ヘブライ語の慣用表現を日本語で明瞭な「ぶどうの木」とした。
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: 種から皮に至るまで
  rationale: ぶどうの両端的な部分を挙げて全体を示す表現を保持した。חַרְצַנִּים は種、זָג は皮と理解した。
- source_word: לֹא יֹאכֵל
  choice: 食べてはならない
  rationale: 律法文中の否定未完了形が持つ禁止の効力を、現代日本語の明瞭で格調ある規定表現で示した。
theological_decisions:
- issue: נִזְרוֹ を「誓願」と明示するか
  choice: ナジル人として身をささげている期間
  alternative: ナジル人としての誓願の期間
  rationale: 章全体では誓願に基づく状態だが、この節の名詞自体は分離・奉献を指す。制度上の意味を示しながら、原語以上に「誓願」という行為へ限定しない表現を採った。
translation_notes:
  register: 現代の一般読者に分かりやすい律法規定の文体とし、「何一つ……てはならない」で禁止の包括性と強さを保った。「ナジル人」はこの章の制度を示す固有の用語として用いた。
