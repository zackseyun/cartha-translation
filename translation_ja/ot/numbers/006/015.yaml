  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: ja
  text: また、種なしパン[a]の籠一つ、すなわち、油を混ぜた上質な小麦粉のパンと、油を塗った種なしの薄焼きパン[b]、およびそれらに添える穀物のささげ物と注ぎのささげ物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「種なしのパン」とも訳せる。ヘブライ語の語は広い意味を持ち、この節ではその内訳として、上質な小麦粉のパンと薄焼きパンが挙げられている。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「油を塗られた」。ここでは、薄焼きパンに油を施す調理法を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: 籠一つ
  rationale: 容器を表す語であり、ここでは種なしパン類を納める籠を指す。日本語では助数表現を添えると自然である。
- source_word: מַצּוֹת
  choice: 種なしパン
  rationale: パン種を入れないパン類全体を指す広い語で、その後に輪形パンと薄焼きパンが具体的に列挙されるため、総称として訳した。
- source_word: סֹלֶת
  choice: 上等の小麦粉
  rationale: 祭儀用に細かくひいた良質の穀粉を指す定型語。文脈上、小麦粉であることを明示する自然な訳とした。
- source_word: חַלֹּת
  choice: 輪形パン
  rationale: 祭儀規定における一定の形にしたパンを表す。現代日本語の「菓子」と誤解されやすい「菓子パン」を避け、伝統的な祭儀用語として明瞭な表現を選んだ。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 油を混ぜた
  rationale: 油と混ぜ合わせて調製したことを表す分詞句を、簡潔で自然な現代日本語にした。
- source_word: רְקִיקֵי מַצּוֹת
  choice: 種なしの薄焼きパン
  rationale: רְקִיקִים は薄く平たいパンを指す。「薄焼きパン」は形状を分かりやすく伝え、「種なし」で מַצּוֹת を明示する。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 油を塗った
  rationale: 動詞は通常「油を注ぐ／塗る、油を注いで任命する」に用いられるが、ここでは食品の調製を表すため、神学的含意を過度に持ち込まない「塗った」とした。
- source_word: מִנְחָתָם
  choice: それらに伴う穀物のささげ物
  rationale: 祭儀法で穀物のささげ物を指す語。複数接尾辞の指示対象は直前のパン類より広い文脈の犠牲である可能性が高いため、「それらに伴う」として関係を示しつつ曖昧さを残した。
- source_word: נִסְכֵּיהֶם
  choice: 注ぎのささげ物
  rationale: 液体を注ぐ供え物を指す。「注ぎのささげ物」は意味が透明で、一般の読者にも理解しやすい。
