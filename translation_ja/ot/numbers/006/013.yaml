  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: ja
  text: ナジル人に関する定めは次のとおりである。その人のナジル人としての聖別の期間が満了する日には[a]、その人を会見の天幕の入口へ連れて来なければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その人の聖別の日々が満ちる日に」。ここは「ナジル人としての誓願の期間が終わる日に」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語の動詞は能動形で、直訳は「その人を連れて来る」である。しかし、連れて来る者はこの節で明示されていない。そのため、「その人は……連れて来られる」とも訳せる。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת הַנָּזִיר
  choice: ナジル人についての定めは次のとおりである
  rationale: תּוֹרָהはここでは祭儀上の規定を指す。「定め」は法的な性格を保ちつつ、現代日本語として明瞭である。נָזִירはイスラエル固有の制度を示す専門語なので「ナジル人」とした。
- source_word: בְּיוֹם מְלֹאת
  choice: 満ちた日には
  rationale: מלאの「満ちる、完了する」という意味と、בְּיוֹםの明示的な時間表現を保った。
- source_word: יְמֵי נִזְרוֹ
  choice: その人が身を聖別する日々
  rationale: נֵזֶרが表す、特別に取り分けられた状態を「身を聖別する」と表現した。「日々」を残し、単に「期間」として平板化することを避けた。
- source_word: יָבִיא אֹתוֹ
  choice: その人を……連れて来る
  rationale: ヘブライ語の能動形を保ちつつ、日本語では主語を明示しないことで、本文が行為者を特定していない点を保持した。
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口に
  rationale: 幕屋を指す定型的名称と、פֶּתַחの空間的意味を自然な日本語で再現した。
theological_decisions:
- issue: נָזִיר／נֵזֶרの意味
  choice: 制度名は「ナジル人」とし、その状態は「身を聖別する」と表す
  alternative: 「誓願を立てた人」「ナジル人として身を分ける」とする
  rationale: 固有の制度名を保持しながら、神のために特別に取り分けられる意味を伝える。「誓願」だけに限定せず、語の持つ聖別と分離の重なりを残した。
- issue: יָבִיא אֹתוֹの行為者
  choice: 能動表現のまま主語を省略する
  alternative: 「その人は連れて来られる」と受動態にする、または「彼はその人を連れて来る」とする
  rationale: 動詞は能動形だが、節内で主語が明示されていない。日本語の主語省略を用いることで、行為者を補わずに原文の形と曖昧さをともに保てる。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある法規文の調子とした。「ナジル人」「会見の天幕」は文脈上重要な専門名称として保持した。
