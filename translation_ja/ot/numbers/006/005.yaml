source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: ja
  text: ナジル人としての誓願の期間中は[a]、かみそりを頭に当ててはならない。ヤハウェのために身を取り分ける期間が満ちるまで、彼は聖なる者でなければならない。頭髪を伸ばし続けなければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「身を取り分ける誓願の期間中」。ナジル人を表すヘブライ語は、分離や献身という意味を持つ語に由来する。
    reason: lexical_alternative
  - marker: b
    text: 原文は、切ったり整えたりせず、頭髪を伸ばすことを表す。
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: ナジル人として誓願を立てている間
  rationale: 「誓願」とナジル人としての分離・献身という制度上の意味を明確にしつつ、日本語として自然な期間表現にした。
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: かみそりを頭に当ててはならない
  rationale: 字義的には「かみそりが頭の上を通ってはならない」だが、日本語では剃ることの禁止を自然かつ具体的に表す。
- source_word: עַד מְלֹאת הַיָּמִים
  choice: 日々が満ちるまで
  rationale: מלא の「満ちる、完了する」という表現を保ち、誓願期間の満了を示した。
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: ヤハウェのために身を取り分けると定めた
  rationale: נזר の分離・献身という語根の意味を保ち、誓願によって定められた期間であることを明確にした。
- source_word: קָדֹשׁ יִהְיֶה
  choice: 彼は聖なる者でなければならない
  rationale: קדוש の神学的に重要な「聖なる」を保持し、法規の義務的な力を日本語で示した。
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: 頭の髪は伸びるままにしておかなければならない
  rationale: 髪を切り整えず、自然に長く伸ばすという פֶּרַע の含意を、分かりやすい現代日本語で表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の契約名を固有名として明示し、一般称号に置き換えなかった。
- issue: קָדֹשׁ の訳語
  choice: 聖なる者
  alternative: 聖別された者／取り分けられた者
  rationale: 文脈上は聖別を含むが、原文が明示する「聖なる」という神学的語彙を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法本文にふさわしい端正さと義務表現を保った。「身を取り分ける」と「聖なる者」を併置し、原文にある関連性と区別の双方を残した。
