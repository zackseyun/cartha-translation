source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: ja
  text: また、もし人が彼のそばで突然、思いがけず死に[a]、そのために彼の聖別された頭[b]が汚されたなら、彼は清めの日に頭をそらなければならない。七日目にそれをそるのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「死者が彼のそばで、突然、突如として死ぬ」。死を表す同根語の構文と、突然性を表す語の反復により、彼の間近で予期せず死が起こることを強調している。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「彼の聖別の頭」。ナジル人の聖別と、そのしるしである頭髪とを結び付けたヘブライ語表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: また、もし
  rationale: 前節から続く律法上の条件事例を示す接続詞と条件の意味を、自然な現代日本語で表した。
- source_word: יָמוּת מֵת
  choice: 人が…急死し
  rationale: 「死者が死ぬ」という同根語構文は、人が死ぬことを表すヘブライ語の語法なので、日本語では自然に「人が死ぬ」とした。急死の意味合いは後続の副詞句と合わせて表した。
- source_word: עָלָיו
  choice: 彼のそばで
  rationale: ここではナジル人の間近で死が起こり、死体による汚れが生じる状況を指す。「彼の上で」と狭く限定せず、近接を表す訳とした。
- source_word: בְּפֶתַע פִּתְאֹם
  choice: 思いがけず急死し
  rationale: 突然性と予期できなかったことを強める重ねた表現を、簡潔で自然な日本語にした。
- source_word: וְטִמֵּא
  choice: そのために…が汚されたなら
  rationale: 文法上は他動詞だが、死が突然そばで起きた結果として儀礼上の汚れが生じることを明確にし、死んだ本人が意図的に汚すかのような不自然さを避けた。
- source_word: רֹאשׁ נִזְרוֹ
  choice: 彼の聖別された頭
  rationale: נזרが指すナジル人としての奉献・聖別と、その状態を担う頭髪の儀礼的意味を保った。より逐語的には「彼の聖別の頭」となる。
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: 清めの日に
  rationale: 死体による汚れからの儀礼的な清めを表す。一般読者にも分かりやすく、文脈に適した表現とした。
- source_word: בַּיּוֹם הַשְּׁבִיעִי יְגַלְּחֶנּוּ
  choice: 七日目にそれをそるのである
  rationale: 七日目が直前の「清めの日」を具体的に示す構造と、原文における剃髪命令の反復を保った。「それ」は頭、実際には頭髪を指す。
theological_decisions:
- issue: ナジル人の汚れと聖別を表す語法
  choice: נזרを「聖別」と捉え、「聖別された頭」と訳す
  alternative: 「誓願の頭」「分離された頭」
  rationale: この節は、死体による儀礼的な汚れがナジル人の聖別状態を中断する場合を扱う。「聖別」は祭儀的な意味を保ちつつ、この句に明記されていない誓願という概念を過度に前面へ出さない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法文にふさわしい落ち着いた格調を保った。「そる」は常用的で分かりやすい表記とし、同じ七日目を指す二つの句を別文にして、原文の反復を残しつつ二度の剃髪と誤解されにくい形にした。
