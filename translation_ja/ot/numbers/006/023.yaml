source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: ja
  text: アロンとその子らに告げなさい。「あなたがたは、次のようにイスラエルの子ら[a]を祝福しなさい。彼らにこう言いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの人々」または「イスラエル人」とも訳せる。ヘブライ語は直訳すると「イスラエルの子ら」。
    reason: 原文の字義的な家族表現と、民族全体を指す慣用的な意味の両方を示すため。
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: 〜に告げなさい
  rationale: 命令形の直接性を保ちつつ、神がモーセに語る指示として自然で明瞭な現代日本語とした。
- source_word: אַהֲרֹן וְאֶל־בָּנָיו
  choice: アロンとその子ら
  rationale: 文脈上、祭司職にあるアロンの息子たちを指すため、「子どもたち」ではなく「子ら」とした。
- source_word: לֵאמֹר
  choice: 「…」
  rationale: 後続する発言内容を日本語の直接話法で導入し、ヘブライ語の引用導入句の機能を自然に表した。
- source_word: כֹּה
  choice: 次のように
  rationale: これから定められた祝福の文言が提示されることを、現代日本語で明確に示す。
- source_word: תְבָרֲכוּ
  choice: 祝福しなさい
  rationale: 二人称男性複数の指示的な未完了形を、祭司たちへの命令として明確に訳した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 慣用的な民族名でありながら、原文の家族的・契約的な表現を見える形で保った。
- source_word: אָמֹר לָהֶם
  choice: 彼らにこう言いなさい
  rationale: 次節から始まる祝福の正確な文言を導く命令として訳し、כֹּהとのつながりも明確にした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の集合的・契約的表現
  choice: イスラエルの子ら
  alternative: イスラエルの人々／イスラエル人
  rationale: この句が民全体を指す慣用表現であることを認めつつ、原文にある家族的・契約的な比喩を本文に残した。脚注で自然な意味を補った。
- issue: 祭司への祝福の指示
  choice: 次のように…祝福しなさい
  alternative: このように…祝福しなければならない
  rationale: 定められた祝福の形式であることと命令の力を保ちつつ、原文以上に義務の強さを加えない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令形は「〜なさい」で統一し、次節へ続く直接話法であるため、引用符は本節では閉じていない。
