source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: ja
  text: その人は、その雄羊を、種なしパンの籠とともに、ヤハウェに平和のいけにえ[a]として献げる。祭司は、その穀物のささげ物と注ぎのささげ物を献げる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「交わりのいけにえ」。ヘブライ語シェラミームは、「平和」に関わるこの種のいけにえを指す。
    reason: שְׁלָמִים の主要な訳語の違いを示しつつ、本文では原語の「平和」に関わる基本的な意味を保つため。
lexical_decisions:
- source_word: הָאַיִל
  choice: その雄羊
  rationale: 犠牲に用いる雄の羊を指すため「雄羊」とし、定冠詞を文脈上既知のものを示す「その」で表した。
- source_word: יַעֲשֶׂה / וְעָשָׂה
  choice: 献げる
  rationale: עשהの基本義は「行う、作る」だが、ここでは祭儀を執行して供え物を献げる意味なので、自然な祭儀用語とした。
- source_word: זֶבַח שְׁלָמִים
  choice: 交わりのいけにえ
  rationale: זֶבַחが犠牲、שְׁלָמִיםがその祭儀区分を示す。「交わり」は神との平和および供食を含み得る表現だが、語義を一つに限定しないため別訳を脚注に示した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: לְは献納の向かう相手を示すため「への」とし、神名יהוהは固有名「ヤハウェ」で表した。
- source_word: עַל סַל הַמַּצּוֹת
  choice: 種なしパンを入れた籠とともに
  rationale: עַלはここでは単なる空間的位置よりも祭儀上の随伴を表す。「種なしパンの籠」より内容関係が明確な自然な日本語にした。
- source_word: מִנְחָתוֹ
  choice: それに伴う穀物のささげ物
  rationale: 祭司資料におけるמִנְחָהは通常、穀物のささげ物を指す。接尾辞はこの犠牲に付随する供え物を示すため、性別を持たない日本語では「それに伴う」と明確にした。
- source_word: נִסְכּוֹ
  choice: 注ぎのささげ物
  rationale: 祭壇で注ぐ液体の供え物を指す。専門的な「灌祭」より、現代の一般読者に動作と祭儀性が伝わる表現を選んだ。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が記されていることを読者に示し、一般名詞・称号の「主」と区別した。
- issue: שְׁלָמִים の訳語
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ
  rationale: この祭儀名には平和、健全さ、神および共同体との交わりという語義的・祭儀的含みがある。「交わり」を本文に採ったが、「和解」も伝統的に可能な理解なので脚注に残し、一つの神学的説明に固定しない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。祭儀用語は必要な正確さを保ちつつ、一般読者にも分かる「穀物のささげ物」「注ぎのささげ物」を用いた。
