id: NUM.6.27
reference: Numbers 6:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: ja
  text: こうして彼らは、わたしの名をイスラエルの子ら[a]の上に置く[b]。わたし自身が彼らを祝福する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」または「イスラエルの民」とも訳せる。ヘブライ語では「イスラエルの子ら」。ここではイスラエルの民全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「わたしの名を……の上に置く」とは、主の契約の名を彼らの上に唱え、彼らが主に属する民であることを示す表現と考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: こうして彼らは……置く
  rationale: שׂוּם の基本義「置く」を保ちつつ、接続詞 וְ は直前の祭司の祝福に続く帰結として「こうして」とした。未完了形は、この文脈では命令に従って生じる行為を表す。
- source_word: אֶת שְׁמִי עַל
  choice: わたしの名を……の上に置く
  rationale: 神の名を民の上に置くという具体的な比喩を保持し、「名」を権威や所有などに言い換えて意味を限定しない。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義と五書における定型表現を反映する。ここでは男性だけでなく、契約共同体としてのイスラエル全体を指すことを脚注で明示する。
- source_word: וַאֲנִי
  choice: わたし自身が
  rationale: 独立人称代名詞 אֲנִי の強調を自然な日本語で示し、祝福の究極的な主体が神であることを本文どおり表す。
- source_word: אֲבָרֲכֵם
  choice: 彼らを祝福する
  rationale: ברך の意味を端的に訳した。日本語では非過去形により、祭司の行為に応じる神の約束を自然に表せる。
theological_decisions:
- issue: 神の名をイスラエルの上に置くことの意味
  choice: 「わたしの名を……の上に置く」という具体的な表現を本文に残す。
  alternative: 「わたしの名を唱える」「彼らがわたしに属することを示す」
  rationale: この句は主の契約の名を民の上に呼び、民が主に属することを示す含意を持ちうるが、本文はその多面的な意味を「名を置く」という比喩で表しているため、一つの解釈に限定しない。
- issue: בְּנֵי יִשְׂרָאֵל の範囲
  choice: 「イスラエルの子ら」と訳し、共同体全体を指すことを脚注で説明する。
  alternative: 「イスラエル人」「イスラエルの民」
  rationale: 原文の男性複数形を反映しながら、この定型的民族名称が男女を含むイスラエル共同体を指すことを明確にする。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の契約的な比喩と「わたし自身」の強調を保持した。脚注記号は、それぞれ説明対象の直後に配置した。
