  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: ja
  text: 祭司はそれらを、揺祭としてヤハウェの前で振り動かす。これは、揺祭の胸肉と奉納分のもも肉[a]に加えて、祭司に属する聖なるものである。その後、ナジル人はぶどう酒を飲んでもよい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奉納分」は、取り分けて神にささげるものを表すヘブライ語テゥルマー（תְּרוּמָה）の訳。伝統的には「挙祭」ともいう。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「ナジル人はぶどう酒を飲む」。ここでは、誓願を終えた後、再び飲むことが許されるという意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: 揺り動かす奉献物として…揺り動かす
  rationale: 祭儀におけるנוּףの使役形と同根名詞תְּנוּפָהを反映しつつ、動作と奉献物としての性格を明確にした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神名יהוהを固有名として音写し、祭儀的な定型句לִפְנֵיを自然な日本語で表した。
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: それは…祭司のための聖なる分となる
  rationale: 単数形הוּאを保ちつつ、祭司に割り当てられる聖別された部分であるという文脈上の意味を明瞭にした。
- source_word: עַל
  choice: …に加えて
  rationale: ここでは物理的位置ではなく、すでに祭司に属する胸肉ともも肉への追加を示す。
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 揺り動かす奉献物の胸肉
  rationale: 祭儀上の定型的な部位名を、前半のתְּנוּפָהと用語を統一して訳した。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 献納物のもも肉
  rationale: שׁוֹקを動物の上脚部である「もも肉」とし、תְּרוּמָהを取り分けて差し出すものという意味が伝わる「献納物」とした。
- source_word: יִשְׁתֶּה
  choice: 飲んでもよい
  rationale: 未完了形を命令ではなく、誓願終了後に禁酒が解かれることを示す許可として訳した。
- source_word: הַנָּזִיר
  choice: ナジル人
  rationale: 民数記6章の誓願を立てた者を指す定着した聖書用語を用いた。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の契約名を一般称号に置き換えず、現代日本語で広く認識される音写を用いた。
- issue: יִשְׁתֶּהの法的効力
  choice: ぶどう酒を飲んでもよい
  alternative: ぶどう酒を飲む
  rationale: 儀式後にナジル人へ飲酒を命じるのではなく、それまでの禁止が解除されるという文脈を表す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀用語の反復と法規文としての格調を保持した。「揺り動かす奉献物」は専門的だが、動作を同じ文中で明示することで理解しやすくした。
