  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: ja
  text: '祭司はそれらをヤハウェの前に差し出し[a]、その人の罪のためのいけにえ[b]と全焼のいけにえをささげる。


    [a] 別訳「ヤハウェの前に携えて来る」。このヘブライ語動詞は、実際にいけにえをささげる前に、それを神の前に携えて出ることを表し得る。


    [b] 「罪のためのいけにえ」は、祭儀に関する用語として「きよめのいけにえ」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェの前に携えて来る」。このヘブライ語動詞は、実際にいけにえをささげる前に、それを神の前に携えて出ることを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「罪のためのいけにえ」は、祭儀に関する用語として「きよめのいけにえ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: 差し出し
  rationale: קרב のヒフィル形は祭儀の文脈で「近づける、差し出す」を意味する。後続の וְעָשָׂה が実際にいけにえをささげる行為を表すため、ここでは準備として神の前に携えて出る動作と区別した。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 祭儀的文脈における כֹּהֵן の標準的で明瞭な訳語。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵי は礼拝の場で神の御前・臨在を表す。固有名 יהוה は音写して「ヤハウェ」とした。
- source_word: וְעָשָׂה
  choice: ささげる
  rationale: עשה の字義は「行う、作る」だが、いけにえを目的語とする祭儀的慣用では、祭儀を執行して「ささげる」の意となる。
- source_word: אֶת חַטָּאתוֹ
  choice: その人の罪のためのいけにえ
  rationale: חַטָּאת はここでは罪に関わる供犠を指す。「罪祭」よりも普通の読者に意味が伝わる表現を用い、浄化を強調する理解は脚注に残した。接尾辞は文脈上ナジル人を指すため「その人の」とした。
- source_word: וְאֶת עֹלָתוֹ
  choice: 全焼のいけにえ
  rationale: עֹלָה はいけにえ全体を焼く供犠を表す。「全焼のいけにえ」は内容を明確に示す。
- source_word: וְהִקְרִיב の省略された目的語
  choice: それらを
  rationale: 原文では目的語が明示されないが、直前の節にある供え物を受ける。日本語で自然かつ明瞭にするため、内容を過度に限定しない代名詞で補った。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の四文字神名を称号に置き換えず、イスラエルに示された固有名として音写した。
- issue: חַטָּאת の祭儀的意味
  choice: 罪のためのいけにえ
  alternative: きよめのいけにえ
  rationale: 罪との関係を保持する慣用的理解を本文に採りつつ、この供犠が祭儀的浄化を行うものだとする有力な語義を脚注で明示し、意味の幅を狭めなかった。
translation_notes:
  register: 現代の一般読者が理解できる、簡潔で品位ある文体とした。「罪祭」などの専門的な漢語は避け、「罪のためのいけにえ」「全焼のいけにえ」と意味が伝わる形で表現した。原文の二つの動詞の違いを「差し出す」と「ささげる」で保った。
