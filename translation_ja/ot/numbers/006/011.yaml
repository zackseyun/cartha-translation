language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: ja
  text: 祭司は、一羽を罪のための献げ物[a]として、もう一羽を全焼の献げ物として献げ、その人が死者[b]に関して罪を犯したことのために、その人のために贖いを行う。そして、その日にその人は自分の頭を聖別する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めの献げ物」とも訳せる。ヘブライ語 חַטָּאת は、特に祭儀上の汚れを扱う文脈では、清めのための献げ物を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「そのネフェシュに対して」。この文脈では、ナジル人を汚した死んだ人、すなわちその遺体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: 祭司は……献げ
  rationale: עָשָׂה は字義的には「行う、作る」だが、ここでは二種類の犠牲を執行する祭儀的文脈なので、自然な日本語の「献げる」とした。
- source_word: אֶחָד לְחַטָּאת
  choice: 一羽を罪のためのささげ物として
  rationale: חַטָּאת は罪に関わる犠牲を指す一方、特に祭儀的不浄の文脈では清めの機能が前面に出る。「罪のためのささげ物」は伝統的な祭儀区分を保ち、別訳を脚注に示した。
- source_word: וְאֶחָד לְעֹלָה
  choice: もう一羽を全焼のささげ物として
  rationale: עֹלָה は祭壇で全体を焼く犠牲を指す。「全焼のささげ物」は内容を明確に伝える。
- source_word: וְכִפֶּר עָלָיו
  choice: その人のために宥めを行う
  rationale: כפר の祭司文書における祭儀的・神学的な幅を保ち、特定の贖罪理論に限定しない表現とした。
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: 死者に関して罪を犯した
  rationale: נֶפֶשׁ は通常「人、いのち」だが、6章6～12節の文脈では死者、すなわち汚れをもたらした遺体を指す。עַל の関係性と、本文がこの出来事を חטא と表現する緊張を残した。
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: 自分の頭を聖別する
  rationale: ナジル人の頭髪が誓願による聖別を象徴する。文脈上は聖別の更新だが、原文の動詞自体に「再び」はないため補わなかった。
- source_word: בַּיּוֹם הַהוּא
  choice: その日に
  rationale: 時間句を簡潔かつ原文に即して訳した。
theological_decisions:
- issue: חַטָּאת の祭儀的意味
  choice: 罪のためのささげ物
  alternative: 清めのささげ物
  rationale: 死による汚れからの清めが直接の文脈だが、この語は罪に関わる犠牲祭儀の名称でもある。本文では広く認識可能な訳を採り、清めを強調する理解を脚注に残した。
- issue: הַנָּפֶשׁ の指示対象
  choice: 死者
  alternative: 遺体
  rationale: ここでは死んだ人の体を指す慣用的用法である。「死者」は人としての指示対象を保ち、「遺体」よりも原語の נֶפֶשׁ に近い。
- issue: 不慮の死による汚れと「罪を犯した」の関係
  choice: 死者に関して罪を犯した
  alternative: 死者のために汚れを受けた
  rationale: 直前の文脈では突然の死による意図しない汚れだが、本文は明確に חָטָא を用いる。罪を単なる汚れと言い換えず、原文の神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀法にふさわしい品位を保った。「献げる」「宥め」「聖別する」は文脈上必要な祭儀語として用い、文を二つに分けて読みやすくした。
