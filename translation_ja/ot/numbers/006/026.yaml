source:
  edition: WLC
  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: ja
  text: ヤハウェが御顔をあなたに向け、あなたに平安[a]を与えてくださるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平安」と訳したヘブライ語シャロームは、平和だけでなく、健やかさ、満ち足りた状態、全体的な幸いをも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: 向け
  rationale: נשׂא は基本的に「上げる」を意味するが、「顔」を目的語とするこの表現では、相手に好意ある関心を向けることを表す。日本語で「顔を上げる」とすると、伏せていた顔を物理的に上げる意味に偏りやすいため、比喩の中心を自然に伝える「向け」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な形に音写した。
- source_word: פָּנָיו
  choice: 御顔
  rationale: 原文の具体的な「顔」の比喩を保ちつつ、神について語る現代日本語として敬意のある「御顔」とした。抽象的な「臨在」や「好意」には言い換えていない。
- source_word: אֵלֶיךָ
  choice: あなたに
  rationale: 前置詞 אֶל の方向性を、「御顔を……向ける」という日本語の構文の中で自然に表した。
- source_word: וְיָשֵׂם
  choice: 与えてくださる
  rationale: שׂים の基本義は「置く、据える」だが、「あなたのために平安を置く」は日本語では不自然であるため、祝福としての結果を明確に表す「与える」とした。祈願文にふさわしく敬意を示す補助表現を添えた。
- source_word: לְךָ
  choice: あなたに
  rationale: 受益者・間接目的語を自然な日本語で明示した。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 争いがないことだけでなく、健全さ、満ち足りた状態、幸いを含み得る語である。祝福の文脈に適し、聖書語としても理解される「平安」を本文に採用し、意味の広がりは脚注で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に固有名が明記されているため、称号へ置換せず神名を音写した。
- issue: 「御顔を上げる」という擬人的慣用表現
  choice: 御顔をあなたに向け
  alternative: 御顔をあなたに上げ、あなたに好意を示し
  rationale: 「御顔」という原文の身体的比喩は保持した一方、「顔を上げる」をそのまま訳すと現代日本語では別の動作として受け取られやすい。「向け」は、この文脈における好意ある注視を過度に抽象化せず自然に伝える。
- issue: שָׁלוֹם の意味の幅
  choice: 平安
  alternative: 平和、健やかさ、全き幸い
  rationale: 一語で意味範囲のすべてを表すことはできないため、本文では中心的で伝統的な「平安」を用い、全体的な健やかさや幸いを含み得ることを脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で格調ある祝福の祈願文とした。「〜ように」でヘブライ語の祈願的用法を表し、「御顔」と「くださる」で神への敬意を示した。
