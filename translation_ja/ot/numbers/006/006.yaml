  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: ja
  text: 主のために身を聖別している期間中は[a]、人の死体[b]に近づいてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼が主のために身を取り分けているすべての日」。ナジル人として聖別されている期間、またはその誓願の期間を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「死んだネフェシュ」。ここでは人間の死体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: 期間中は
  rationale: 直訳は「すべての日」だが、ここでは聖別の全期間を漏れなく指すため、自然な現代日本語で包括性を保った。
- source_word: הַזִּירוֹ
  choice: 身を聖別している
  rationale: נזר に由来し、ナジル人として取り分けられている状態・期間を表す。「誓願」と限定せず、献身と聖別の意味を保った。
- source_word: לַיהוָה
  choice: 主のために
  rationale: 前置詞 לְ の奉献・帰属の方向を「ために」で表した。יהוה は本文では「主」とした。
- source_word: עַל נֶפֶשׁ מֵת לֹא יָבֹא
  choice: 死体に近づいてはならない
  rationale: 来ることを禁じる法的表現を、死体への接近禁止として自然かつ明確な日本語にした。
- source_word: נֶפֶשׁ מֵת
  choice: 死体
  rationale: 字義的には「死んだネフェシュ」だが、祭儀的清浄の文脈では人間の遺体を指す。
theological_decisions:
- issue: ナジル人に関する語をどこまで明示するか
  choice: 身を聖別している
  alternative: ナジル人の誓願を立てている／身を取り分けている
  rationale: この名詞はナジル人制度に属するが、ここでは誓願そのものより、取り分けられた状態または期間を直接表す。本文で「誓願」と限定せず、文脈上の含みを残した。
- issue: יהוה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語本文では神名を伝統的かつ明瞭な「主」で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。法的禁止は「近づいてはならない」とし、原文の包括的な期間表現とナジル人としての聖別の意味を保った。
