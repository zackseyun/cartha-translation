base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: ja
  text: ヤハウェが御顔をあなたに向けて輝かせ、あなたに恵みを与えてくださるように[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェが御顔をあなたに向けて輝かせ、あなたに好意を示してくださるように」。
    reason: אֵלֶיךָの「あなたに向けて」という方向性、およびחנןの「好意を示す」という語義を明示する別訳。
lexical_decisions:
- source_word: יָאֵר
  choice: 照らし……くださるように
  rationale: ヒフィル形の希求用法で、祝福として「光を照らす／輝かせる」ことを願う表現。日本語では「御顔を……照らす」という詩的比喩を保ちつつ、文末の「くださるように」で願いの力を表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、ヘブライ語の固有名を日本語で音写した。
- source_word: פָּנָיו
  choice: 御顔
  rationale: 直訳的な身体比喩を保持した。「臨在」や「好意」と抽象化せず、神の恵み深いまなざしを示す原文の詩的表現を残した。神への敬意を自然に示すため「御」を付した。
- source_word: אֵלֶיךָ
  choice: あなたに
  rationale: 前置詞 אֶל の方向性を自然な日本語で表した。「御顔をあなたに照らす」という構文により、祝福が受け手へ向けられることを示した。
- source_word: וִיחֻנֶּךָּ
  choice: あなたを恵んでくださる
  rationale: חנן は好意や恵みを与えることを表す。「憐れむ」では同情の含意が強くなり得るため、祝福の文脈に合う「恵む」を採用した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を用いていることを明示し、称号への置換を避けた。
- issue: 「御顔を照らす」という擬人的比喩
  choice: 比喩を本文に保持する
  alternative: 好意をもって顧みる、臨在を輝かせる
  rationale: 原文は神の好意を身体的かつ詩的な像によって語っている。意味を抽象的説明に置き換えず、その像と神学的余韻を保った。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調ある祝福の言葉とした。「御顔」は詩的・礼拝的な響きを保つが、古語的な語尾は避けた。
