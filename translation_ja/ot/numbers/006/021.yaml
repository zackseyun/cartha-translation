  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: ja
  text: これは、ナジル人としての誓願に関してヤハウェに献げる献げ物を誓願するナジル人についての律法である。これは、自分の力の及ぶものに加えてのことである[a]。彼は、自分が立てた誓願に従い、ナジル人としての誓願に関する律法に従って、そのように行わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の手が届くものに加えて」。ここで「手が届くもの」は、その人の資力・能力の範囲を表す慣用表現。
    reason: 原語の慣用表現と、「～に加えて」という修飾関係を示すため。
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: ナジル人についての律法
  rationale: תּוֹרָהはここでナジル人に関する規定を指すため、法的な文脈と章内の専門用語を保つ表現とした。נָזִירは定着した聖書用語として音写した。
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: ヤハウェに献げ物を献げる
  rationale: קָרְבָּןを一般的な祭儀用語「献げ物」とし、לの方向・献呈の意味を「に」で表した。日本語では動詞を補って構文を明瞭にした。
- source_word: עַל נִזְרוֹ
  choice: ナジル人としての誓願のために
  rationale: נֵזֶרはこの章ではナジル人としての分離・献身状態とその誓願を指す。単なる「献身」と断定せず、文脈上の誓願を明示した。
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: それとは別に、自分の力の及ぶものを
  rationale: 「手が届く」という原語の慣用句は資力・能力の範囲を表す。「力の及ぶもの」はその比喩を自然な日本語で残し、何を献げるかの省略を文脈から補える形にした。
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: 自分が立てた誓願に応じ
  rationale: כְּפִיの適合・対応の意味を「に応じ」で示し、反復する誓願表現も「自分が立てた」に保持した。
- source_word: כֵּן יַעֲשֶׂה
  choice: そのとおりに行わなければならない
  rationale: 未完了形が法規文脈で示す義務を、現代日本語の規範表現で明確にした。
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: ナジル人としての誓願についての律法に従って
  rationale: 前置詞עַלの関係性を文脈に即して「に従って」とし、冒頭のתּוֹרָהとの対応を保った。
theological_decisions:
- issue: 神名 יהוה の訳出
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の契約名が記されているため、称号に置き換えず「ヤハウェ」と音写した。
- issue: נִזְרוֹ が指すもの
  choice: ナジル人としての誓願
  alternative: 彼の献身／彼の分離
  rationale: 語は献身・分離の状態も含み得るが、この節ではנדר「誓願」と密接に結び付く。意味の幅を過度に狭めないよう「ナジル人としての」としつつ、法的対象を「誓願」と表した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で荘重な法規調とした。「ナジル人」は章の専門語として保持し、ヘブライ語の反復と義務性を可能な限り見える形にした。
