revisions:
- from: これは、誓願を立てるナジル人についての律法である。彼は、ナジル人としての誓願のためにヤハウェに献げ物を献げるが、それとは別に、自分の力の及ぶものを献げる[a]。彼は、自分が立てた誓願に応じ、ナジル人としての誓願についての律法に従って、そのとおりに行わなければならない。
  to: これは、ナジル人としての誓願に関してヤハウェに献げる献げ物を誓願するナジル人についての律法である。これは、自分の力の及ぶものに加えてのことである[a]。彼は、自分が立てた誓願に従い、ナジル人としての誓願に関する律法に従って、そのように行わなければならない。
  rationale: 原文は「ヤハウェへの献げ物を誓願する」ことと「自分の手の届くものに加えて」とを結び付けているため、その関係を日本語でも保持した。何が必須の献げ物で何が追加的な誓願の献げ物かを本文で過度に体系化せず、ヘブライ語構文の含みを残した。
