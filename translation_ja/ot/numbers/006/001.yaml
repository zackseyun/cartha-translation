  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げて言われた
  rationale: דבר のワイイクトル形は物語を進め、ここでは後続の לֵאמֹר とともに正式な神の発言を導入する。日本語では「告げて言われた」として両要素を自然に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字名を、称号に置き換えず日本語で一般的な音写にした。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞 אֶל と人名を、自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する発言内容を導入する定型句。日本語では前の「告げて」と組み合わせ、「告げて言われた」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を直接用いているため、その性格を保つ音写を採用した。伝統的な代替称号や別の音写もあることは脚注で示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。発言導入句の形式性を保ちつつ、過度に逐語的な「言って言われた」は避けた。
