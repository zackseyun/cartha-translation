  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: ja
  text: その人がナジル人として取り分けられている期間のすべてにおいて、彼はヤハウェに対して聖なる者である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: …間はずっと
  rationale: 期間全体を余すところなく指す表現として、現代日本語で自然かつ包括的な力を保つ。
- source_word: נִזְרוֹ
  choice: その人がナジル人として身をささげている
  rationale: 文脈上、単なる誓願の発話ではなく、ナジル人として取り分けられている状態と期間を指す。日本語では「離別」よりも意味が明瞭で、後続の「聖なる」との重複も抑えられる。
- source_word: קָדֹשׁ הוּא
  choice: 聖なる者である
  rationale: 形容詞の述語用法と独立代名詞による主語を反映し、聖別という神学的な重みを保持する。
- source_word: לַיהוָה
  choice: 主に対して
  rationale: לְ が示す献身・帰属の関係を自然な日本語で表す。神名の表記については脚注で原文を明示する。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: 主（脚注で「ヤハウェ」）
  alternative: ヤハウェ
  rationale: 本文では日本語聖書として自然で荘重な「主」を用いつつ、原文が一般名詞ではなく固有の神名יהוהであることを脚注で明示する。
- issue: נִזְרוֹ が指す内容
  choice: ナジル人として身をささげている状態・期間
  alternative: ナジル人の誓願／その聖別
  rationale: ここでは誓願そのものより、その誓願によって取り分けられた状態が続く全期間に焦点がある。状態と、それに伴う「聖なる者」という宣言を区別して訳す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法本文にふさわしい簡潔で荘重な調子とした。「身をささげている」はナジル人として取り分けられた継続的状態を一般読者に伝える表現。
