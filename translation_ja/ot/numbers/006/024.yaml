base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: ja
  text: ヤハウェ[a]があなたを祝福し、守ってくださいますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文では「יהוה」（YHWH）。伝統的には「主」と訳される。
    reason: 神名の原文表記と、そのラテン字転写および伝統的な代替訳を正確に示すため。
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: あなたを祝福し……くださるように
  rationale: ברךのピエル形・願望法的用法で、二人称男性単数接尾辞を伴う。祭司による祝福の文脈に即し、単純未来や命令ではなく、祈願・祝願の力を自然な現代日本語の「くださるように」で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語יהוהを、称号「主」に置き換えず、一般的な日本語音写「ヤハウェ」で示した。
- source_word: וְיִשְׁמְרֶךָ
  choice: 守ってくださる
  rationale: שמרのカル形・願望法的用法で、二人称男性単数接尾辞を伴う。保護し、無事に保つ意味を簡潔に伝えるため「守る」とした。前半と共有される「あなたを」は日本語では自然に省略したが、目的語は同じである。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく神の固有名を明記しているため、その区別を保つ音写を本文に採用した。伝統的な代読「主」は脚注で示した。
- issue: 二つの動詞の法的ニュアンス
  choice: 祝願として「くださるように」
  alternative: 「祝福し、守られる」「祝福し、守る」
  rationale: この祭司的祝福では両動詞が願望的な力を持つため、確定的な未来の断言にも、ヤハウェへの直接命令にも限定せず、祝願として訳した。
translation_notes:
  register: 簡潔で荘重な祝福の調子を保ちつつ、現代の一般読者に自然な「くださるように」を用いた。原文の「あなた」は男性単数形だが、文脈上イスラエルの一人一人に向けられた代表的な単数として、そのまま「あなた」とした。
