  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: דבר のワウ継続形は新たな叙述段階を導入する。後続する לֵאמֹר と合わせ、日本語では敬意を保った定型的な「告げられた」が自然である。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した神名四文字の伝統的な代用表記を本文に用い、原文が固有の神名 YHWH であることを脚注で明示する。
- source_word: אֶל
  choice: に
  rationale: 語りかけの相手を示す前置詞であり、現代日本語では「モーセに」とするのが自然である。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を採用する。
- source_word: לֵאמֹר
  choice: 告げられた（発話導入として統合）
  rationale: 直訳すれば「言って」であるが、次節から直接話法が始まるため、וַיְדַבֵּר と統合して「告げられた」とすることで、重複を避けつつ機能を保持する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で「原文は神の固有名YHWH」）
  alternative: ヤハウェ
  rationale: 原文が称号ではなく神名四文字であることを脚注で保ちつつ、本文では普通の日本語読者に定着した「主」を用いる。発音の再構成には不確かさがあるため、脚注では YHWH と示す。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。ヘブライ語の「語った、言って」という重なりは、日本語の自然な発話導入句「告げられた」にまとめた。
