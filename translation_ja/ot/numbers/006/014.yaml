id: NUM.6.14
reference: Numbers 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: ja
  text: そして、その人は自分の献げ物として、傷のない一歳の雄の子羊一頭を全焼のいけにえに、傷のない一歳の雌の子羊一頭を罪のためのいけにえ[a]に、また傷のない雄羊一頭を平安のいけにえ[b]として、ヤハウェに献げる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清めのいけにえ」とも訳せる。ヘブライ語חַטָּאתは「罪」を意味するとともに、罪や汚れからの清めに関わるいけにえを指すことがある。
    reason: alternative_reading
  - marker: b
    text: 「交わりのいけにえ」または「健やかさのいけにえ」とも訳せる。ヘブライ語שְׁלָמִיםは、平安、無事、健全さ、交わりに関わるいけにえを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב אֶת־קָרְבָּנוֹ
  choice: そして、その人は自分の献げ物として……献げる
  rationale: ヒフィル形のקרבは祭儀文脈で供え物を近づけ、差し出すことを表す。「献げる」は現代日本語で自然な祭儀表現であり、קָרְבָּנוֹとの重複は「自分の献げ物として」によって滑らかに表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に明記された神の固有名יהוהを音写し、普通名詞的な称号へ置き換えない。
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ ... אֶחָד
  choice: 一歳の雄の子羊一頭
  rationale: כֶּבֶשׂの雄、בֶּן־שְׁנָתוֹの年齢、אֶחָדの数をすべて明示した。
- source_word: תָמִים / תְּמִימָה
  choice: 傷のない
  rationale: 祭儀規定では、犠牲獣に欠陥がないことを指す。平明で正確な日本語とした。
- source_word: לְעֹלָה
  choice: 全焼のいけにえに
  rationale: עֹלָהは祭壇上で全体を焼く犠牲の類型。「全焼のいけにえ」は性質が伝わり、祭儀用語としても明確である。
- source_word: כַבְשָׂה אַחַת בַּת־שְׁנָתָהּ
  choice: 一歳の雌の子羊一頭
  rationale: 雌を示すכַבְשָׂהと、対応する年齢表現および数を明示した。
- source_word: לְחַטָּאת
  choice: 罪のためのいけにえ
  rationale: חַטָּאתの「罪」と祭儀的な供え物という両面を保ちつつ、一般読者にも分かる表現を採用した。清めの機能を強調する訳は脚注に残した。
- source_word: וְאַיִל אֶחָד
  choice: また傷のない雄羊一頭
  rationale: אַיִלは成長した雄羊を指し、אֶחָדの数も保持した。
- source_word: לִשְׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִיםが示す共同の食事・交わりの側面を、現代日本語で理解しやすく表した。ただし「和解のいけにえ」等の可能性も脚注に示す。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いるため、固有名として音写し、称号への置換を避けた。
- issue: חַטָּאתの祭儀的意味
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: 伝統的な「罪のいけにえ」に近い意味を本文で保ちながら、この語が汚れからの清めを担う祭儀を指し得る曖昧さを脚注に保存した。
- issue: שְׁלָמִיםの意味範囲
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ、平安のいけにえ
  rationale: 語根に関係する平安・健全さと、犠牲祭における交わりの両面があるため、一つの教理的理解に固定せず異訳を脚注に示した。
translation_notes:
  register: 律法の手順を述べる文として簡潔で dignified な現代標準日本語を用いた。節頭の接続詞וְは「そして」で保持し、動物の性別・年齢・頭数を明示した。「いけにえ」は一般読者に通じる表記とし、祭儀用語の意味の幅は脚注で保存した。
