source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: ja
  text: 「イスラエルの子らに告げて、こう言いなさい。男であれ女であれ、特別な誓願としてナジル人[b]の誓願を立て、ヤハウェのために身を聖別しようとするなら[a]、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「男であれ女であれ、身を取り分けるためにナジル人の誓願を立てるなら」。
    reason: lexical_alternative
  - marker: b
    text: 「ナジル人」とは、誓願によって特別にヤハウェのために取り分けられた人を指す。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の家族的表現を保ちつつ、現代日本語で理解できる形にした。
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: 男でも女でも
  rationale: 原文が男女を明示しているため、その法的な包括性をそのまま表した。
- source_word: כִּי
  choice: なら
  rationale: 法規の事例を導く条件的用法を自然な日本語で示した。「とき」も可能だが、ここでは条件性が明瞭である。
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: 特別な誓願をする
  rationale: פלא のヒフィルが示す特別な行為という含みと、同根語を重ねた「誓願を立てる」行為を、過度に逐語的にならない形で表した。
- source_word: נֶדֶר נָזִיר
  choice: ナジル人の誓願
  rationale: 制度上の専門語 נָזִיר を音写し、構文上の結びつきを明示した。
- source_word: לְהַזִּיר
  choice: 身を聖別し
  rationale: ヤハウェのために自らを取り分け、献げる意味を表す。「身を取り分ける」より宗教的文脈が明瞭だが、分離の側面は注で補った。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 契約の固有名 יהוה を音写し、前置詞 ל の献身の対象・目的を「ために」で表した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の契約名を訳文でも明示し、普通名詞的な称号へ置き換えなかった。
- issue: נזר の聖別と分離の両義性
  choice: 身を聖別し
  alternative: 身を取り分けて／身をささげて
  rationale: 献身という宗教的意味を自然に示しつつ、原語にある「分離する」側面を脚注で保持した。
- issue: 男女を明示する法文表現
  choice: 男でも女でも
  alternative: だれでも
  rationale: 原文が両性を個別に挙げる点を保持し、ナジル人の誓願が男女双方に開かれていることを曖昧にしなかった。
translation_notes:
  register: 現代標準日本語の法文として明瞭さを保ちつつ、命令の荘重さとナジル人制度の専門性を残した。脚注記号は対応する内容に近接させた。
