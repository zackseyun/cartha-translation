base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: ja
  text: 八日目に、その人は山鳩二羽、または家鳩のひな二羽を、会見の天幕の入口にいる祭司のもとへ携えて来なければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: 八日目に
  rationale: 接続詞を日本語で機械的に「そして」とせず、前の規定から続く時間的順序を自然に示した。
- source_word: יָבִא
  choice: 携えて来なければならない
  rationale: ヒフィル未完了形が律法上の指示として持つ義務的な力を、明瞭な現代日本語で表した。
- source_word: שְׁתֵּי תֹרִים
  choice: 山鳩二羽
  rationale: תֹר は犠牲に用いるキジバト類を指す。日本語聖書用語として分かりやすい「山鳩」を採用した。
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: 若い鳩二羽
  rationale: 字義的には「鳩の子ら」だが、若い鳩を意味するヘブライ語の慣用表現なので、自然な日本語にした。
- source_word: אֶל הַכֹּהֵן אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: 祭司のもと、会見の天幕の入口へ
  rationale: 二度の אֶל を保ちつつ、日本語では行き先と祭司への持参が無理なく理解できる語順にした。「会見の天幕」は אֹהֶל מוֹעֵד の定着した簡潔な訳語である。
theological_decisions: []
translation_notes:
  register: 律法の規定にふさわしい端正さを保ちながら、現代の一般読者に明確な義務表現を用いた。主語は直前の文脈で規定を受ける者を指すため、「その人」と明示した。
