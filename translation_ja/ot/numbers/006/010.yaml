- from: 八日目に、その人は山鳩二羽か、若い鳩二羽を祭司のもと、会見の天幕の入口へ携えて来なければならない。
  to: 八日目に、その人は山鳩二羽、または家鳩のひな二羽を、会見の天幕の入口にいる祭司のもとへ携えて来なければならない。
  rationale: 山鳩と家鳩のひなという供え物の区別を保ち、祭司と会見の天幕の入口の統語的関係を自然な現代日本語で明確にした。命令の法的・規定的な調子、選択肢を示す「または」、および原文の数量は維持している。
