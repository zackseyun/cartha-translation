  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: ja
  text: その人は、ナジル人としての聖別の日々を改めて主にささげ[a]、一歳の雄の子羊を償いのささげ物として献げなければならない。それまでの日々は無効となる[b]。その人のナジル人としての聖別が汚されたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「主に、その人の聖別の日々を改めて聖別する」。ナジル人として身を分かち、主にささげる期間を初めからやり直すことを指す。
    reason: 原語の「分離・奉献・聖別」という意味の幅と、再開始の含意を示すため。
  - marker: b
    text: 直訳では「初めの日々は落ちる」。すなわち、汚れを受ける前の日数は誓願の日数に数えられない。
    reason: ヘブライ語の比喩的表現と、その文脈上の法的意味を示すため。
lexical_decisions:
- source_word: וְהִזִּיר לַיהוָה אֶת יְמֵי נִזְרוֹ
  choice: 主のためにナジル人として身をささげる日々を改めて始め
  rationale: ヒフィル形と中断後の再開始という文脈を合わせて表現した。「再び聖別する」よりも、誓願期間を初めからやり直す意味が一般読者に明確になる。יהוהは日本語聖書で広く通用する「主」とした。
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: 一歳の雄の子羊
  rationale: 犠牲動物の年齢と性別を自然な日本語で明示した。
- source_word: לְאָשָׁם
  choice: 償いのささげ物として
  rationale: אָשָׁםの儀礼的区分を表しつつ、現代の一般読者にも意味をつかみやすい表現とした。
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: それまでの日々は無効となる
  rationale: 直訳は「初めの日々は落ちる」。ここでは汚れ以前に満たした日数が誓願期間に算入されない法的効果を示すため、「無効となる」と訳した。
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: その人のナジル人としての聖別が汚されたからである
  rationale: נִזְרוֹが誓願そのものだけでなく、聖別・分離された状態を指し得ることを保ち、「聖別が汚された」とした。
theological_decisions:
- issue: נזר／נזרוの訳し分け
  choice: 前半は「ナジル人として身をささげる日々」、後半は「ナジル人としての聖別」
  alternative: 「ナジル人の誓願（の期間）」で統一する
  rationale: 民数記6章の制度的意味を「ナジル人」で明示しながら、語根が含む分離・奉献・聖別の幅を後半で残した。
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語として自然で広く認知された表記を採用し、特定の発音再建を本文で断定しない。
- issue: יִפְּלוּの法的含意
  choice: 無効となる
  alternative: 失われる／落ちる
  rationale: 汚れ以前の日数が数えられなくなるという文脈上の効力を明瞭にしたうえで、脚注に字義を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀法にふさわしい格調を保った。「献げる」は供え物を差し出す行為、「身をささげる」は奉献を表すため表記を分けた。
