  text: לְ/אָבִ֣י/ו וּ/לְ/אִמּ֗/וֹ לְ/אָחִי/ו֙ וּ/לְ/אַ֣חֹת֔/וֹ לֹא יִטַּמָּ֥א לָ/הֶ֖ם בְּ/מֹתָ֑/ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖י/ו עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: ja
  text: 父のためにも、母のためにも、兄弟のためにも、姉妹のためにも、彼らが死んだとき、彼らのために身を汚してはならない[a]。彼の神への聖別のしるし[b]が、その頭にあるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの死に際して、彼らのために身を汚してはならない」。ここでいう「身を汚す」は、死者との接触などによって儀礼上汚れた状態になることを指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「ネゼル」。ナジル人については、神のために取り分けられた状態、またはそのしるしを表し、頭に伸ばした髪によって象徴された。
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: 父、母、兄弟、姉妹のためであっても
  rationale: 前置された親族の列挙が持つ強調を「であっても」で表した。各親族関係を簡潔に保ち、死者が近親者であっても例外にならないことを明確にした。
- source_word: לֹא יִטַּמָּא
  choice: 自分の身を汚してはならない
  rationale: 再帰的な形を「自分の身を」で示した。文脈上は死体との接触による儀礼上の汚れであり、道徳的な罪を意味する表現として読まれないようにした。
- source_word: לָהֶם בְּמֹתָם
  choice: 彼らが死んだとき、そのために
  rationale: לָהֶם が列挙された親族を指すことと、בְּמֹתָם が死を汚れの生じる機会として示すことの両方を、自然な日本語で表した。
- source_word: כִּי
  choice: からである
  rationale: 禁止の理由を導く因果関係を明確にした。
- source_word: נֵזֶר אֱלֹהָיו
  choice: 自分の神に身をささげているしるし
  rationale: ナジル人の文脈で נֵזֶר は、神のために取り分けられた状態と、その目に見えるしるしを指す。「冠」と限定せず、神への献身と頭髪の象徴性が伝わる表現にした。אֱלֹהָיו の接尾辞は「自分の神」として保持した。
- source_word: עַל רֹאשׁוֹ
  choice: その頭にある
  rationale: 頭上にあるという具体的な像を保ち、ナジル人の伸ばした髪への暗示を訳文で説明しすぎないようにした。
theological_decisions:
- issue: ナジル人の規定における「汚れ」の性質
  choice: 死者との関わりによる儀礼上の汚れを表す禁止として訳す。
  alternative: 道徳的な堕落や罪を直接意味する表現として訳す。
  rationale: この箇所は死体による汚れを扱う祭儀的規定であり、本文が述べていない道徳的罪責を加えるべきではない。
- issue: נֵזֶר の意味範囲
  choice: 神への献身の状態と、それを頭上に示すしるしの両面を保つ。
  alternative: 物理的な「冠」だけ、または抽象的な「聖別」だけに限定する。
  rationale: ナジル人の文脈では、語は神のために取り分けられた身分を示しつつ、伸ばした頭髪という目に見えるしるしとも結び付くため、どちらか一方に狭めない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法本文にふさわしい簡潔で荘重な調子を保った。「身をささげているしるし」は専門語だけに頼らず、一般読者にも נֵזֶר の意味が伝わるようにした。
