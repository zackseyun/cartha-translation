source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: ja
  text: そのナジル人は、会見の天幕の入口で、ナジル人としての献身のしるしである頭髪をそり、その頭髪を取って、平安のいけにえ[a]の下にある火の上に置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「交わりのいけにえ」または「健全を願ういけにえ」。
    reason: שְׁלָמִיםは平安・完全性・健全に関わる祭儀用語であり、交わりを強調する訳も可能である。
lexical_decisions:
- source_word: הַנָּזִיר
  choice: そのナジル人
  rationale: 民数記6章に規定された特定の誓願を立てた者を指す術語であるため、一般的な「献身した者」にせず、定着した音写を用いた。
- source_word: וְגִלַּח
  choice: そり
  rationale: 頭髪をそる儀礼上の手順を、文脈に即した簡潔な動作表現で示した。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口で
  rationale: פֶּתַחの場所的意味を直接示し、אֹהֶל מוֹעֵדには日本語聖書で理解されやすい術語を用いた。
- source_word: אֶת רֹאשׁ נִזְרוֹ
  choice: 献身のしるしである頭髪
  rationale: 直訳的な「彼の献身の頭」は日本語では意味が不明瞭になる。文脈上、そられる対象は頭髪であり、それがナジル人の献身を示すものであることを明示した。
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: その献身の頭髪
  rationale: 直前の表現との結びつきと原文の反復を保ちつつ、自然な日本語にした。
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: 下にある火の上に
  rationale: 空間関係を表す前置詞תַּחַתと、髪を火の上へ置く動作をそのまま保持した。
- source_word: זֶבַח הַשְּׁלָמִים
  choice: 交わりのいけにえ
  rationale: שְׁלָמִיםは平安・健全・共同の食事という幅を持つ祭儀用語であり、日本語として理解しやすく、共食の側面も伝える訳語を選んだ。別訳を脚注に示した。
theological_decisions:
- issue: 祭儀用語 שְׁלָמִים の訳し方
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ、平安のいけにえ
  rationale: 語義を「平和」だけに限定せず、神との和らぎや共食を含む祭儀的な交わりを伝えるため。ただし「和解」「平安」も伝統的かつ可能な訳なので脚注に保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀上の荘重さを保った。「献身の頭」という不自然な直訳は避け、頭髪が献身のしるしであることを本文で示した。
