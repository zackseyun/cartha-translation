  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: ja
  text: ぶどう酒と強い酒を避けなければならない。ぶどう酒からできた酢も、強い酒からできた酢も飲んではならない。また、ぶどうを浸して得たどのような液体[a]も飲んではならない。生のぶどうも干しぶどうも[b]食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぶどう汁」とも訳せる。ヘブライ語は、ぶどうを浸すなどして得た液体を広く指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「新鮮なぶどうも乾燥したぶどうも」。後者は干しぶどうを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: ぶどう酒と強い酒を断たなければならない
  rationale: נזר のヒフィル形は、このナジル人に関する規定では、指定された飲食物から身を遠ざけることを表す。「断つ」は、単なる飲酒禁止だけでなく、意図的に遠ざかる意味を明瞭に伝える。יַיִן は一般的なぶどう酒、שֵׁכָר はそれと区別される酩酊性の飲料であるため、「強い酒」とした。
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: ぶどう酒からできた酢も、強い酒からできた酢も
  rationale: חֹמֶץ は酸味を帯びた酒または酢を指す。二つの連語の並行性を保ち、何に由来する酢かを自然な日本語で明示した。
- source_word: כָל מִשְׁרַת עֲנָבִים
  choice: ぶどうから作ったどのような飲み物
  rationale: מִשְׁרָה は浸すことによって得た液体を指し得るため、単に搾った「ぶどう汁」と限定せず、ぶどう由来の飲み物を広く表す訳とした。語義上の幅は脚注に示した。
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: 生のぶどうも干しぶどうも
  rationale: 直訳は「新鮮なぶどうと乾燥したぶどう」。日本語では対比が自然かつ具体的に伝わるよう、「生のぶどう」「干しぶどう」とした。接続詞 וְ は否定文脈では両方を禁じるため「も…も」で表した。
- source_word: לֹא יִשְׁתֶּה / לֹא יֹאכֵל
  choice: 飲んではならない／食べてはならない
  rationale: 法律的な禁止を、現代日本語として明瞭で格調を損なわない表現にした。
theological_decisions: []
