  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: ja
  text: そしてモーセは民に言った。「三日間、備えをしていなさい。女性に近づいてはならない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「女性に近づく」は、備えの期間中、性的関係を控えるよう命じる婉曲表現。
    reason: 原文の婉曲表現を本文に保ちながら、文脈上の意味を明確にするため。
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־הָעָם
  choice: そしてモーセは民に言った
  rationale: ヘブライ語では主語が省略されているが、文脈上はモーセを指す。日本語で話者を明確にし、物語を自然につなげた。
- source_word: הֱיוּ נְכֹנִים
  choice: 備えをしなさい
  rationale: 「用意ができた状態でいなさい」という命令を、現代日本語で自然かつ簡潔に表した。
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: 三日間
  rationale: 前置詞句を準備の期間として訳した。文脈上「三日目に備えて」と理解する余地もあるため、その解釈に限定する表現は避けた。
- source_word: אַל־תִּגְּשׁוּ
  choice: 近づいてはならない
  rationale: אַלによる禁止と、נגשׁの基本的な「近づく」という意味を保持した。
- source_word: אֶל־אִשָּׁה
  choice: 女に
  rationale: 原文の婉曲表現を本文に残した。「妻」と限定せず、性的関係を指す文脈上の意味は脚注で明示した。
theological_decisions:
- issue: 清めの準備期間における禁止を、性的関係として本文で明示するか
  choice: 本文では原文の婉曲表現「女に近づいてはならない」を保持する
  alternative: 「女性と性的関係を持ってはならない」または「妻と交わってはならない」
  rationale: 原文は性的行為を表す動詞を直接用いず、慣用的な婉曲表現を用いている。その緊張を本文に残しつつ、意味は脚注で説明することで、明瞭さと原文への忠実さを両立させた。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、シナイ山での厳粛な準備命令にふさわしい簡潔で dignified な調子とした。
