base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: ja
  text: 角笛の音は、ますます強くなっていった[a]。モーセが語ると、神は声で彼に答えられた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ますます大きくなっていった」。ヘブライ語では、角笛の音が進みつつ非常に強くなっていくことを表している。
    reason: lexical_alternative
  - marker: b
    text: 「雷鳴の中で彼に答えられた」または「聞こえるように彼に答えられた」とも解釈できる。ヘブライ語は「声で」と述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: 角笛の音
  rationale: קוֹלはここでは角笛に属する音を指す。שׁוֹפָרは吹奏用の角であり、「角笛」は現代日本語で明瞭かつ原語の具体性も保つ。
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: ますます強くなっていった
  rationale: הוֹלֵךְを伴う表現は進行する増大を表す。「強く」は原文のחָזֵקを保ち、音量だけに限定しない。「なっていった」で継続的な展開を自然に示す。
- source_word: מֹשֶׁה יְדַבֵּר
  choice: モーセが語ると
  rationale: 未完了形は場面内の継続・反復的な応答関係を示し得る。日本語では「語ると」が、モーセの発話に神の応答が対応する構造を簡潔に表す。
- source_word: יַעֲנֶנּוּ
  choice: 彼に答えられた
  rationale: ענהと三人称男性単数接尾辞を直接反映する。神を主語とするため、現代日本語の聖書文体として自然な尊敬表現を用いた。
- source_word: בְקוֹל
  choice: 声をもって
  rationale: 前置詞בְּとקוֹלの広がりを保ち、雷鳴または単なる可聴性と断定しない。やや荘重だが明瞭な日本語である。
theological_decisions:
- issue: シナイでの神の応答の性質
  choice: 神は「声をもって」答えられた
  alternative: 神は雷鳴の中で答えられた／聞こえるように答えられた
  rationale: בְּקוֹלは「声で」「音をもって」を意味し得るが、この箇所自体は雷鳴と明記しない。本文では語義の幅と神学的緊張を残し、解釈的な可能性は脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神顕現の場面にふさわしい簡潔で荘重な調子とした。「角笛」は原語の具体性を優先し、「声をもって」は原文の曖昧さを保持するため意図的に残した。
