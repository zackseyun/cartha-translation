  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: ja
  text: 民は皆、声をそろえてこう答えた。「ヤハウェがお語りになったことはすべて、私たちは行います。」そこでモーセは、民の言葉をヤハウェのもとに持ち帰った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民の言葉をヤハウェに報告した」。
    reason: 使役形 שוב はここで、言葉を「持ち帰る」ことにも「報告する」ことにも理解できるため。
lexical_decisions:
- source_word: וַיַּעֲנוּ כָל־הָעָם יַחְדָּו וַיֹּאמְרוּ
  choice: 民は皆、声をそろえてこう答えた
  rationale: 「答えた」と後続する発言導入を日本語として自然にまとめつつ、כָל־הָעָם の全体性と יַחְדָּו の一致した応答を保った。
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェがお語りになったことはすべて
  rationale: כֹּל אֲשֶׁר を「ことはすべて」とし、דבר の発話を「語る」で表した。神名 יְהוָה は称号に置き換えず「ヤハウェ」と音写した。
- source_word: נַעֲשֶׂה
  choice: 私たちは行います
  rationale: 動詞 עשה の基本義「行う」を保ち、文脈上含意される「従う」と意訳して意味を狭めることを避けた。
- source_word: וַיָּשֶׁב מֹשֶׁה אֶת־דִּבְרֵי הָעָם אֶל־יְהוָה
  choice: そこでモーセは、民の言葉をヤハウェのもとに持ち帰った
  rationale: 使役形 שוב の「持ち帰る／報告する」という語感のうち、戻す動きを表す比喩を本文に残した。「言葉」も具体名詞のまま保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号「主」に置き換えず音写した。
- issue: נַעֲשֶׂה を服従の語で訳すか
  choice: 行います
  alternative: 従います
  rationale: 契約への服従は文脈上含意されるが、原語は直接には「行う」を意味するため、その表現を保った。
- issue: וַיָּשֶׁב の意味合い
  choice: 持ち帰った
  alternative: 報告した
  rationale: 原語の「戻す／持ち帰る」という像を本文に残し、文脈上可能な「報告した」は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、民の一致した応答には「声をそろえて」を採用した。神への敬意は「お語りになった」で自然に表しつつ、全体は簡潔で荘重な叙述調に整えた。
