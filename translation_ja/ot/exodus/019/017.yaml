id: EXO.19.17
reference: Exodus 19:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: ja
  text: そこでモーセは、神に会うため、民を宿営の外へ連れ出した。彼らは山のふもと[a]に立った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「山の下部」。山の基部、すなわちふもとを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 連れ出した
  rationale: ヒフィル形の使役的な意味を保ち、モーセが民を宿営の外へ出したことを自然な現代日本語で表す。「導き出した」ほど導き方を強調しない。
- source_word: לִקְרַאת
  choice: 会うため
  rationale: 相手との遭遇に向かう動きを表す語であり、ここでは目的を自然に示す。「迎えるため」は歓迎の含みを加えうるため避けた。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞を伴うが、文脈ではイスラエルの神を指す。日本語では「神」が自然であり、「その神」として不要な対比を持ち込まない。
- source_word: מִן הַמַּחֲנֶה
  choice: 宿営の外へ
  rationale: 出発点である宿営から外に出たことを、「連れ出した」と自然につながる形で明示する。
- source_word: וַיִּתְיַצְּבוּ
  choice: 立った
  rationale: 自ら定位置に立つという再帰的・意志的な含みを文脈上保ちつつ、過度に軍事的な「陣取った」や硬い「位置についた」を避けた。
- source_word: בְּתַחְתִּית הָהָר
  choice: 山のふもと
  rationale: 山の下部・基部を指す文脈上の意味を、誤解のない自然な日本語で表す。語形上は「山の下部」とも訳せるため脚注を付す。
theological_decisions:
- issue: シナイでの顕現における הָאֱלֹהִים の訳
  choice: 神
  alternative: その神
  rationale: 定冠詞の存在を不自然に逐語化せず、唯一の指示対象である神を普通の日本語で示す。神との出会いという本文の緊張を弱める言い換えはしない。
- issue: לִקְרַאת が示す神との対面
  choice: 神に会うため
  alternative: 神を迎えるため
  rationale: 民が神との遭遇へ向かうという意味を保持する。「迎える」は民が神を歓迎する側であるとの含みを生じさせうるため採らない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で物語の連続を示し、簡潔な二文構成とした。
