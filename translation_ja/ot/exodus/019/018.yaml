  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: ja
  text: シナイ山は全体が煙に包まれた。ヤハウェが火の中でその上に降りて来られたからである。その煙は炉[a]の煙のように立ち上り、山全体が激しく震えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「焼き窯の煙のように」とも訳せる。
    reason: כִּבְשָׁן は炉と焼き窯のいずれも指し得るため。
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: シナイ山は
  rationale: 接続詞 וְ の連続性は日本語の文脈に委ね、明示的な時間語を補わず、場面の主題を自然に提示した。
- source_word: עָשַׁן כֻּלּוֹ
  choice: 全体が煙に包まれた
  rationale: 山全体が煙に覆われた状態を、明瞭で自然な日本語で表した。単に「煙を上げた」とするより、כֻּלּוֹ の全体性を明確に保つ。
- source_word: מִפְּנֵי אֲשֶׁר
  choice: からである
  rationale: 後続節が煙の原因を示すことを明確にした。
- source_word: יָרַד עָלָיו יְהוָה
  choice: ヤハウェがその上に降りて来られた
  rationale: יָרַד の下降運動と עָלָיו の指示対象である山を保持した。神に対する日本語として自然な敬意を示すため「来られた」としたが、原文にない神学的意味は加えていない。
- source_word: בָּאֵשׁ
  choice: 火の中で
  rationale: 前置詞 בְּ を、降下の様態・顕現を表す「火の中で」と訳した。
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: その煙は立ち上り
  rationale: 男性単数接尾辞を直前の山に結びつけ、「その煙」とした。עלה の具体的な上昇を「立ち上る」で表現した。
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: 炉の煙のように
  rationale: כִּבְשָׁן は炉または焼き窯を指し得る。本文では強烈な煙の比喩として分かりやすい「炉」を採用し、「焼き窯」を注記した。
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: 山全体が激しく震えた
  rationale: חרד の物理的な震動と מְאֹד の強意を、過度な解釈を加えず自然に表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、その固有名としての性格を保つ音写「ヤハウェ」を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、シナイでの神の顕現にふさわしい簡潔で荘重な調子を保った。原因節を独立文にして読みやすくし、原文の描写の順序は維持した。
