  text: そこでモーセは民のところへ下り、彼らに言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下り
  rationale: 動詞 ירד の基本義を保ち、山上から民のいる場所への移動を自然な日本語で表した。
- source_word: הָעָם
  choice: 民
  rationale: 文脈上イスラエルの民を指す集合名詞であり、簡潔で聖書本文にふさわしい表現とした。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 彼らに告げた
  rationale: אמר は一般には「言う」だが、ここでは直前に命じられた警告を民に伝達する場面であり、「告げた」が目的語の省略された日本語として自然である。発言内容を本文に補わない。
theological_decisions:
- issue: モーセが民に伝えた内容の明示
  choice: 内容を補わず「彼らに告げた」とする
  alternative: 「彼らにこれらのことを告げた」または警告内容を明記する
  rationale: ヘブライ語本文は発言内容を記していないため、直前の命令から推測できる内容を本文へ追加せず、省略を保持した。
translation_notes:
  register: 明快で簡潔な現代標準日本語。物語の連続を示す וַ の流れを「そこで」で表し、荘重さを保ちつつ古風な言い回しは避けた。
