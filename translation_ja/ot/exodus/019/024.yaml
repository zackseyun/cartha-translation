base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: ja
  text: ヤハウェは彼に言われた。「下って行きなさい。それから、あなたはアロンを伴って上って来なさい。しかし、祭司たちと民は、ヤハウェのもとへ上ろうとして押し入ってはならない。さもないと、ヤハウェが彼らに向かって激しく襲いかかる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「押し入って」と「激しく襲いかかる」に当たるヘブライ語は、いずれも「破る、破れ出る」という関連した語である。民が強引に侵入することと、ヤハウェの裁きが突発的に及ぶこととを響き合わせている。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す四文字名。日本語聖書で広く定着した敬虔な表記「主」を用いる。
- source_word: לֶךְ רֵד
  choice: 下って行きなさい
  rationale: 二つの命令形を、日本語として自然な一続きの強い命令にした。
- source_word: וְעָלִיתָ
  choice: それから…上って来なさい
  rationale: 命令の連続の中で、完了形が指示・未来の意味を持つことを反映した。話し手のいる山へ戻る動きなので「上って来る」とした。
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: あなたはアロンを伴って
  rationale: 明示された代名詞によるモーセへの強調と、アロンの同行を自然な日本語で保持した。
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: 祭司たちと民
  rationale: 祭司の集団と一般の民との区別をそのまま示した。
- source_word: אַל יֶהֶרְסוּ
  choice: 境を破ってはならない
  rationale: הר ס がここで表す、設けられた境界を強引に突破する具体的な像を明確にした。
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: 主のもとへ上ろうとして
  rationale: 山を上って神の臨在へ近づく、禁止された行為を表した。
- source_word: פֶּן יִפְרָץ בָּם
  choice: 主が彼らに襲いかかることのないように
  rationale: 神の裁きが突然彼らに及ぶ意味を自然に表しつつ、原文の「破れ出る」という比喩は脚注で補った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語の公的朗読と一般読者への明瞭さを考慮し、伝統的かつ広く理解される「主」を採用した。固有名であることを否定するものではない。
- issue: יִפְרָץ の主語と裁きの描写
  choice: 主が彼らに襲いかかる
  alternative: 主が彼らの間に破れ出る
  rationale: 文法上の主語は直前の主であり、警告される神の裁きを表す。比喩を完全に平板化しないよう脚注に直訳的な像を残した。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、神の発言にふさわしい端正さを保った。「下って行きなさい」「上って来なさい」によって移動の順序を明示し、禁止命令は簡潔で強い表現にした。
