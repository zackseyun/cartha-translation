id: EXO.19.5
reference: Exodus 19:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: ja
  text: 今、もしあなたがたがわたしの声によく聞き従い[a]、わたしの契約を守るなら、あなたがたはあらゆる民の中から、わたしの宝の民となる[b][c]。全地はわたしのものだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「もし、聞くことにおいて、あなたがたが聞くなら」。強調された言い方で、注意深く聞き、従うことを含む。
    reason: 原語の不定詞絶対形と未完了形による強意、および契約的文脈での「聞く」の含意を示すため。
  - marker: b
    text: 「わたしの特別な所有」または「わたし自身の所有」とも訳せる。
    reason: סְגֻלָּהが、価値あるものという意味と特別な帰属の両方を表すことを補足するため。
  - marker: c
    text: 直訳では「あらゆる民の中から、わたしの特別な所有となる」。この句は、諸民族の中での特別な位置を表す。次の句は、全地が神のものであることを明らかにしている。
    reason: מִכָּל־הָעַמִּיםによる選別関係と、続く全地に対する神の普遍的所有との関係を示すため。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 今
  rationale: 接続を日本語で過度に重くせず、直前の文脈を受けて契約条件を提示する時間的・論理的推移を自然に表す。
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: わたしの声によく聞き従い
  rationale: 不定詞絶対形と未完了形による強意を「よく」で示し、שמע בקול が含む聞くことと従うことの両面を「聞き従う」で自然に表した。
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: わたしの契約を守る
  rationale: 契約の文脈におけるשמרの忠実な遵守という意味を、現代日本語で定着した表現にした。
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: わたしの宝となる
  rationale: סְגֻלָּהが表す、所有者が特別に大切にする財産という価値と帰属を、簡潔で dignified な日本語で表す。
- source_word: מִכָּל־הָעַמִּים
  choice: あらゆる民の中から選ばれた
  rationale: מןを比較の「すべての民にまさる」ではなく、諸民族の中からの選びとして明示した。ただし「選ばれた」は原文に独立した動詞としてはないため脚注で直訳を示す。
- source_word: כִּי־לִי כָּל־הָאָרֶץ
  choice: 全地はわたしのものだからである
  rationale: כיの理由提示と、לִיによる所有の強調を保つ。הָאָרֶץは諸民族全体への言及を根拠づけるため「土地」ではなく「全地」とした。
theological_decisions:
- issue: שמעを「聞く」と「従う」のどちらで表すか
  choice: 聞き従う
  alternative: わたしの声によく耳を傾け
  rationale: この慣用句には実際の聴取だけでなく応答的服従が含まれる。一方、具体的な「声」の比喩は保持し、単に「わたしに従う」とはしなかった。
- issue: מִכָּל־הָעַמִּיםが選択を表すか比較を表すか
  choice: あらゆる民の中から
  alternative: あらゆる民にまさって
  rationale: 続く「全地はわたしのもの」との関係から、神の普遍的所有の中でイスラエルが特別な所有として取り分けられる意味を優先した。比較的解釈を排除しすぎないよう脚注で原文に近い形を示す。
- issue: סְגֻלָּהの特別な帰属と価値
  choice: わたしの宝
  alternative: わたしの特別な所有
  rationale: 価値ある特有財産という語義を平易に伝えつつ、神の所有であることを「わたしの」で明確にした。全地も神のものであるという後半との緊張を保った。
translation_notes:
  register: 平易な現代標準日本語を用いつつ、シナイ契約の宣言にふさわしい荘重さを保った。「〜なら、〜となる」「だからである」により条件と根拠の構造を明確にした。すべての脚注記号を本文中に配置した。
