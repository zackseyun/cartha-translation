id: EXO.19.3
reference: Exodus 19:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: ja
  text: モーセは神のもとへ上って行った。するとヤハウェは山から彼に呼びかけ、こう言われた。「ヤコブの家にこう言い、イスラエルの子ら[a]に告げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「イスラエルの息子たち」。ここでは集合的に「イスラエルの子どもたち」または「イスラエルの民」とも訳せる。
    reason: 原文の男性形による集合表現と、その文脈上の範囲を示すため。
lexical_decisions:
- source_word: עָלָה
  choice: 上って行った
  rationale: 上方への移動を表す動詞であり、山へ上るという文脈を自然な現代日本語で明確にした。
- source_word: אֶל הָאֱלֹהִים
  choice: 神のもとへ
  rationale: 前置詞 אֶל の方向性を保ちつつ、定冠詞付きの אֱלֹהִים は、この文脈でイスラエルの神を指すため「神」とした。
- source_word: וַיִּקְרָא אֵלָיו
  choice: 彼に呼びかけ
  rationale: קרא と אֶל の組み合わせが示す「人に向かって声をかける」という意味を表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: מִן הָהָר
  choice: 山から
  rationale: 前置詞 מִן の起点と、文脈上シナイを指す הַר の意味を簡潔に保った。
- source_word: לֵאמֹר
  choice: こう言われた
  rationale: 直接話法を導く機能を自然な日本語で表し、直後の כֹּה の「こう」と一体化させた。
- source_word: כֹּה תֹאמַר
  choice: こう言い
  rationale: 神から託される定型的な伝言の導入を、明瞭で端正な命令表現として訳した。
- source_word: לְבֵית יַעֲקֹב
  choice: ヤコブの家に
  rationale: 「家」が一族・共同体を指す契約的、集合的な表現を保持した。
- source_word: וְתַגֵּיד
  choice: 告げなさい
  rationale: Hiphil形の「知らせる、告げる」という意味と命令の力を保ち、「言い」との並行にも変化を持たせた。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: בְּנֵי の字義的な親族表現と集合的意味をともに伝え、「息子たち」として男性だけに限定して聞こえることを避けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が称号ではなく四文字神名を用いているため、固有名として音写し、神名と称号の区別を保った。
- issue: לִבְנֵי יִשְׂרָאֵל の集合的・性別的含意
  choice: イスラエルの子ら
  alternative: イスラエルの息子たち／イスラエルの民
  rationale: ヘブライ語は文法上男性形だが、ここではイスラエル共同体全体を代表的に指し得る。「子ら」は原文の系譜的比喩を保ちながら、対象を男性だけに不必要に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の宣言を導く場面にふさわしい端正さを保った。「ヤコブの家」と「イスラエルの子ら」の並行表現を維持した。直接話法は次節へ続くため、閉じかぎ括弧を置いていない。
