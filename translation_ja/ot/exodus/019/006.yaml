  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: ja
  text: あなたがたは、わたしにとって祭司の王国[a]、聖なる国民となる。これらが、あなたがイスラエルの子ら[b]に語るべき言葉である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「祭司たちから成る王国」「祭司的な王国」。ヘブライ語の表現は、祭司たちから成る王国とも、祭司的な性格を持つ王国とも理解できる。第一ペトロ2章9節の関連表現「王なる祭司団」も参照。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの子ら」はヘブライ語の表現で、男性だけでなくイスラエルの民全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: となる
  rationale: 契約宣言の中の未完了形であり、将来の結果ないし約束の力を自然な現代日本語で表す。単なる命令には限定しない。
- source_word: לִי
  choice: わたしにとって
  rationale: 神との関係・帰属を示す לְ を保ちつつ、日本語として明瞭にした。「わたしの」とすると所有の意味に狭める可能性がある。
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: 祭司たちの王国
  rationale: 連語を最も直接的に訳し、「王国」と「祭司」の両名詞を保持する。構成員が祭司である王国か、祭司的性格を持つ王国かという幅は注で示す。
- source_word: גּוֹי קָדוֹשׁ
  choice: 聖なる国民
  rationale: 契約共同体を指す גּוֹי と、神のために取り分けられた性格を示す קָדוֹשׁ の神学的響きを保つ。
- source_word: אֵלֶּה הַדְּבָרִים
  choice: これが……言葉である
  rationale: 後続の「語る」と対応する דְּבָרִים を「言葉」と訳し、日本語では指示内容全体を受ける自然な単数表現「これが」を用いた。
- source_word: תְּדַבֵּר
  choice: 語るべき
  rationale: モーセに対する厳粛な指示を表す。日本語の「語るべき」は命令的責務を自然に伝える。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の「子ら」という系譜的・契約的表現を保持する。共同体全体を指すことは注で明示する。
theological_decisions:
- issue: イスラエルの契約上の共同体的召命
  choice: 祭司たちの王国
  alternative: 祭司の王国／祭司的な王国／王なる祭司団
  rationale: 原文の構成関係を保ち、イスラエルが祭司から成る王国なのか、祭司的性格を帯びた王国なのかを本文で一方に確定しない。後代の受容表現を本文へ逆輸入しない。
- issue: 契約共同体を表す性別を伴う呼称
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の男性複数形による親族的表現を見える形で残しつつ、実際の指示対象が男性だけでなくイスラエル共同体全体であることを注で説明する。
translation_notes:
  register: 明瞭で格調ある現代標準語。契約宣言の荘重さを保ちながら、古語的な「〜でなければならない」は避けた。脚注記号は該当語句の直後に配置した。
