  source_fidelity: 本文の主要な対応は原文に忠実である。אָתֶּם（複数）は「あなたがた」、לִיは「わたしにとって」、גּוֹי קָדוֹשׁは「聖なる国民」と適切に訳されている。ただし、מַמְלֶכֶת כֹּהֲנִיםは構文上「祭司たちの王国」より「祭司の王国」のほうが、所有・支配関係に狭めず、原文の構成関係の幅を保つ。
