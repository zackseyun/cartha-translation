base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: ja
  text: 彼らはレフィディムを出発してシナイの荒野に着き、その荒野に宿営した。イスラエルはそこで、山を前にして[a]宿営した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「山の向かい側に」。ヘブライ語は、ある物に面した位置、またはその正面・向かい側の位置を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵרְפִידִים
  choice: 彼らはレフィディムを出発して
  rationale: נסעは旅程記事では宿営地をたって進むことを表す。「出発する」は現代日本語として自然で、移動開始の意味を明確に伝える。地名רְפִידִיםは慣用的に「レフィディム」と音写した。
- source_word: וַיָּבֹאוּ מִדְבַּר סִינַי
  choice: シナイの荒野に入り
  rationale: בואは来る、入る、到着するの意を持つ。目的地を示す句との組み合わせでは「荒野に入り」が自然である。מִדְבָּרは人の定住しない荒れ野を指すため、聖書本文で定着し、砂漠に限定しない「荒野」とした。
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: その荒野に宿営した
  rationale: חנהは陣を張って滞在することを表すため「宿営した」とした。定冠詞を伴うמִדְבָּרは直前のシナイの荒野を指すので、日本語では「その荒野」として照応関係を明確にした。
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: イスラエルはそこで……宿営した
  rationale: 単数動詞וַיִּחַןは、集合体としてのイスラエルを一つの民として描く。日本語でも集合的固有名「イスラエル」を主語とし、שָׁםを「そこで」と訳した。
- source_word: נֶגֶד הָהָר
  choice: 山を前にして
  rationale: נֶגֶדは何かに面する、正面に位置する、向かい側にあるという空間関係を示す。「山を前にして」は位置関係を自然に表しつつ、厳密な方角や距離を特定しない。定冠詞付きהָהָרは文脈上の特定の山なので「山」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宿営する」は旅程記事に適した一般的な聖書用語として保持した。原文にある「荒野」と「宿営」の反復も残し、物語の段階的な動きを表した。注記記号は、内容上対応する「山を前にして」の直後に置いた。
