source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「見よ、わたしは、民がわたしがあなたと語るのを聞き、また、いつまでもあなたを信頼するために、濃い雲の中であなたのもとに来る[a]。」モーセは民の言葉をヤハウェに告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたを信じる」、または「あなたの言うことを信じる」とも訳せる。ヘブライ語は、モーセを神に認められた代言者として信頼することを表し得る。
    reason: בְּךָ יַאֲמִינוּ の人物に対する信頼・信用という語義の幅を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 発言への注意を促す談話標識の力と荘重さを、簡潔な現代日本語で保った。
- source_word: בָּא
  choice: 来る
  rationale: 分詞が表す切迫した到来を、直接話法の中で自然な非過去形により表現した。
- source_word: בְּעַב הֶעָנָן
  choice: 濃い雲の中で
  rationale: 雲の密度を示す表現を、情景が明瞭に伝わる日本語とした。
- source_word: בַּעֲבוּר
  choice: それは……ためである
  rationale: 後続節が目的を表すことを明確にした。
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: わたしがあなたと語るとき
  rationale: 前置詞付き不定詞の時間的な働きと、対話を表す「あなたと」を自然に再現した。
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: また、いつまでもあなたを信頼するようになる
  rationale: אמן のヒフィル形と ב が表す、モーセを神の認証された代言者として信頼する意味を示しつつ、崇拝の対象として『信じる』との誤解を避けた。
- source_word: לְעוֹלָם
  choice: いつまでも
  rationale: 継続的で長く保たれる信頼を、自然で格調ある日本語で表した。
- source_word: וַיַּגֵּד
  choice: 告げた
  rationale: 物語を進める動詞として、民の発言を神に報告する意味を簡潔に表した。
- source_word: דִּבְרֵי הָעָם
  choice: 民の言葉
  rationale: 原文の『言葉』を保持し、過度な言い換えを避けた。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された契約の神の固有名を保持し、称号への置換を避けた。
- issue: בְּךָ יַאֲמִינוּ が表すモーセへの態度
  choice: あなたを信頼する
  alternative: あなたを信じる／あなたの言うことを信じる
  rationale: ヘブライ語は人物への信頼を表し得る。ここではモーセが神の語りかけを伝える者として認証される文脈であるため『信頼する』としたが、語義上『信じる』も可能であることを脚注で保持した。
- issue: לְעוֹלָם の時間的範囲
  choice: いつまでも
  alternative: 永遠に
  rationale: 原語の持続性を保ちながら、モーセ個人の地上での生存期間を越える範囲について本文が明示しない点を不必要に決着させない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の直接話法には「見よ」「〜ためである」を用いて適度な荘重さを保った。二人称は文脈上明瞭な「あなた」とし、民は聖書物語にふさわしく簡潔に「民」とした。
