  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: ja
  text: モーセはヤハウェに言った。「民はシナイ山に登ることができません。あなたご自身が『山の周りに境を設け、これを聖別せよ[b]』と言って、私たちに厳しく警告された[a]からです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちに厳命された」または「私たちに証言された」とも訳せる。ヘブライ語の動詞には、正式に警告する、厳粛に命じる、証言するという意味合いがある。
    reason: lexical_alternative
  - marker: b
    text: あるいは「山に境界を定め、これを聖なるものとせよ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって表した。
- source_word: לֹא יוּכַל
  choice: 登ることができません
  rationale: 未完了形の動詞がここでは許可ではなく、現に課された制限のもとでの不可能を表すため。
- source_word: הָעָם
  choice: 民
  rationale: シナイ山のふもとに集められたイスラエルの共同体全体を指す、簡潔で聖書文体にもなじむ表現。
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: シナイ山に登る
  rationale: עלהの上方への移動を明示しつつ、自然な現代日本語とした。
- source_word: כִּי
  choice: からです
  rationale: モーセの直前の主張に対する理由を導入しているため。
- source_word: אַתָּה
  choice: あなたご自身が
  rationale: 動詞だけでも主語は示されるため、明示された代名詞の強調を反映した。
- source_word: הַעֵדֹתָה בָּנוּ
  choice: 私たちに固く警告し
  rationale: 使役語幹のעודは、ここでは境界を越えないよう正式かつ厳粛に警告する意味。語の持つ証言・厳命の含みは脚注に残した。
- source_word: לֵאמֹר
  choice: と言われた
  rationale: 直接話法を導く機能を、日本語の引用構文として自然に表した。
- source_word: הַגְבֵּל אֶת הָהָר
  choice: 山の周りに境を設け
  rationale: גבלの使役命令形が、山への接近を制限する境界を定めることを表すため。文脈上の空間的な意味を明確にした。
- source_word: וְקִדַּשְׁתּוֹ
  choice: これを聖別せよ
  rationale: קדשׁの強意語幹が、その山を聖なるものとして取り分ける宗教的行為を表すため。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: エホバ、または「主」
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写した。「主」とすると固有名と称号の区別が失われる。
- issue: הַעֵדֹתָה בָּנוּ の意味合い
  choice: 私たちに固く警告し
  alternative: 私たちに厳命し／私たちに証言し
  rationale: 境界設定を命じた直前の文脈では警告の意味が最も自然だが、語にある正式な証言・厳命の響きを断定的に排除せず脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、神への発言にふさわしい丁寧さと、命令の厳粛さを保った。「民」「聖別」は文脈上必要な聖書語彙として用い、構文自体は平明にした。
