  naturalness: 「固く警告し、…と言われた」も理解可能だが、「固く警告して」は現代標準語としてやや不自然であり、引用との関係もやや緩い。「『…』と言って、私たちに厳しく警告された」とすることで、自然で明瞭な日本語になる。
  terminology: 「ヤハウェ」「民」「シナイ山」「境」「聖別」は、本文の固有名・共同体表現・祭儀的語彙を適切に保っている。「聖別」は現代日本語の聖書翻訳として十分に明瞭であり、意味を弱めない。
