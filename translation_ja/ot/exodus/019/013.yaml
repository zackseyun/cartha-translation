  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: ja
  text: だれもそれに手を触れてはならない[a]。必ず石で打ち殺すか、射殺さなければならない[b]。動物であれ人であれ、生かしておいてはならない。雄羊の角笛が長く鳴り響くとき[c]、彼らは山に登ってよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれもその者に手を触れてはならない」とも訳せる。ヘブライ語の代名詞を人に限定して取る場合である。いずれにしても、違反者には直接触れず、離れた所から処刑する趣旨と考えられる。
    reason: alternative_reading
  - marker: b
    text: 「刺し貫かなければならない」とも訳せる。ヘブライ語の動詞は射ること、また射て貫くことを表し、この文脈では矢で射ることが想定されていると考えられる。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語では「ヨベルが引き延ばされるとき」。ここでの「ヨベル」は雄羊の角笛を指し、その音を長く響かせることを意味すると考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: だれもその者に手を触れてはならない
  rationale: 直訳的な「手がその者に触れてはならない」という非人称的表現を、現代日本語の法的禁止として自然に表した。男性単数接尾辞は、境界を越えた違反者を指すと理解した。
- source_word: סָקוֹל יִסָּקֵל
  choice: 必ず石で打ち殺される
  rationale: 不定詞絶対形と定形動詞の組み合わせによる強意を「必ず」で示し、処刑を意味することが明確になるよう「打ち殺される」とした。
- source_word: יָרֹה יִיָּרֶה
  choice: 射殺されなければならない
  rationale: ירה はこの文脈では、離れた所から矢などで射ることを表すと考えられる。強意と処刑の必然性を、日本語では「射殺されなければならない」で表した。
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: 家畜であれ人であれ
  rationale: 二つの範疇のどちらにも同じ規定が及ぶ構文を、簡潔で自然な対句として訳した。בְּהֵמָה はこの場面では人に属する動物を想定して「家畜」とした。
- source_word: לֹא יִחְיֶה
  choice: 生かしておいてはならない
  rationale: 単なる未来予告ではなく、違反した者または動物を生存させてはならないという法的帰結を明瞭にした。
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: 雄羊の角笛が長く鳴り響くとき
  rationale: 直訳は「ヨベルが引き延ばされるとき」。יוֹבֵל を雄羊の角笛、その『引き延ばし』を長い吹奏音と捉え、現代の読者に意味が通じる形にした。
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: 彼らは山に登ってよい
  rationale: 長い角笛の合図によって先の立入禁止が解除されるという文脈を踏まえ、単純未来形の含意を許可として表した。בָהָר は「山に」と訳した。
theological_decisions:
- issue: 「その者に手を触れてはならない」の男性単数接尾辞の指示対象
  choice: 山の境界を越えた違反者を指す
  alternative: 接触によって聖域の禁忌に触れたもの一般、または山そのものを指す
  rationale: 直前の文脈は山に触れた人または家畜への処罰を定めており、直接触れずに遠方から処刑するという法的流れに最もよく合う。ただし文法上の指示対象には一定の幅があるため脚注で示した。
- issue: 角笛の合図の後の יַעֲלוּ の機能
  choice: 立入禁止の解除を示す許可「登ってよい」
  alternative: 単純な未来または指示「彼らは山に登る／登らなければならない」
  rationale: 前後関係からは、角笛の長い合図を境に規制が解除される理解が自然である。ただしヘブライ語の動詞形そのものは単純未完了形である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神聖な境界を定める法的宣言の厳粛さを保った。「必ず」「〜てはならない」によって原文の強い命令性を示し、文化的に説明を要する角笛の表現は本文で自然に明示しつつ脚注に直訳を残した。
