  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: ja
  text: イスラエルの子ら[a]がエジプトの地を出た第三の月、この日[b]、彼らはシナイの荒野に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」または「イスラエルの子どもたち」とも訳せる。ヘブライ語は直訳すると「イスラエルの子ら」であり、民全体を指す呼称である。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「この日」。「まさにこの日」と、日付の一致を特に強調する表現とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: 三か月目
  rationale: חֹדֶשׁはこの年代表示では「月」を意味する。「第三の月」よりも「三か月目」が現代日本語として明瞭で、出エジプトを基準とする時点を自然に表す。
- source_word: לְצֵאת
  choice: 出てから
  rationale: 前置詞לを伴う不定詞構文は、出発を時間の基準点として示す。「出てから」は後続の「三か月目」との時間関係を簡潔に伝える。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの「イスラエルの子ら」を保ち、契約の民を指す伝統的な民族呼称であることを明示する。一般的な「イスラエル人」は脚注に示す。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地を
  rationale: 明記されているאֶרֶץ「地」を訳出し、起点を表すמִןは日本語の移動表現「地を出る」によって自然に示す。
- source_word: בַּיּוֹם הַזֶּה
  choice: その日
  rationale: 直訳的には「この日」。文脈上の特定の日を指すが、何と同一の日かを本文で補わず、原文の簡潔さと曖昧さを保つ。強意的な理解は脚注に示す。
- source_word: בָּאוּ
  choice: 着いた
  rationale: בואの基本義は「来る、入る」だが、目的地を示すこの文脈では日本語の「着いた」が自然である。
- source_word: מִדְבַּר סִינָי
  choice: シナイの荒野
  rationale: מִדְבָּרを「荒野」とし、連語の関係を「シナイの荒野」で保つ。「砂漠」ほど乾燥地形に限定しない。
theological_decisions:
- issue: 契約の民の呼称 בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの子孫
  rationale: 男性複数形を含む原文の民族的・契約的な定型呼称を透明に示すため「子ら」とした。ただし男性だけを指すとの意味に限定せず、民全体の呼称として読む余地を脚注で明らかにする。
- issue: בַּיּוֹם הַזֶּה の強意性
  choice: その日
  alternative: まさにその日／この日
  rationale: 指示詞は明示されているが、原文だけでは強意の程度や基準日が完全には説明されないため、本文では過度に強めず、可能な強意的理解を脚注に残す。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。年代表示は「第三の月」ではなく自然な「三か月目」とし、地名と民族呼称には聖書本文としての透明性を残した。
