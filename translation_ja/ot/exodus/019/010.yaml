source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: ja
  text: そこでヤハウェはモーセに言われた。「民のところへ行き、今日と明日、彼らを聖別し[a]、彼らに自分たちの衣服を洗わせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なるものとして取り分け、神との出会いに備えさせ」とも訳せる。
    reason: קדשׁのピエル形が持つ、聖なるものとして取り分けることと、神との出会いに向けて儀礼的に備えさせることの意味を明らかにするため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言われた
  rationale: 物語を前へ進めるワウ継続法の順接を、自然な現代日本語で表した。神の発言には品位ある敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で一般的な形に音写した。
- source_word: לֵךְ אֶל־הָעָם
  choice: 民のところへ行き
  rationale: 命令形と方向を率直に表し、עָםはシナイに集うイスラエル共同体を指す集合名詞として「民」とした。
- source_word: וְקִדַּשְׁתָּם
  choice: 彼らを聖別し
  rationale: ピエル形が示す、神との出会いに向けて民を聖なるものとして取り分け、備えさせる儀礼的意味を保った。
- source_word: הַיּוֹם וּמָחָר
  choice: 今日と明日
  rationale: 二日間にわたる準備期間を、原文の簡潔さを保って表した。
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: 衣服を洗わせなさい
  rationale: 複数主語である民が自分たちの衣服を洗うよう、モーセが取り計らうという命令の流れを自然な日本語にした。「衣服」は儀礼的文脈に適しつつ、衣類一般を指し得る。
theological_decisions:
- issue: קדשׁの儀礼的・神学的含意
  choice: 聖別する
  alternative: 聖なるものとして取り分ける／身を清めさせる
  rationale: ここでは内面的な道徳的変化だけに限定せず、シナイで神に会うための儀礼的・契約的な備えを表す。「身を清める」だけでは、神のために取り分ける意味が弱くなる。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いていることを明示し、称号への置換を避けた。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の発言にふさわしい簡潔で品位ある調子と、シナイ契約の厳粛な場面を保った。
