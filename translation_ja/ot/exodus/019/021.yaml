  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「下って行き、民に警告しなさい。民がヤハウェのもとへ押し入り、見ようとして、そのうち多くの者が倒れることのないように。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: רֵד
  choice: 下って行き
  rationale: 命令形の方向性を保ちつつ、現代日本語として自然に表現した。
- source_word: הָעֵד בָּעָם
  choice: 民に警告しなさい
  rationale: ここでのヒフィル形は、禁じられた接近について民に強く警告する意味を持つ。
- source_word: יֶהֶרְסוּ אֶל יְהוָה
  choice: 境を破って近づき
  rationale: 動詞は本来「壊す、突き破る」を表し、文脈上は山の周囲に設けられた境を越えて神の現れへ近づくことを指す。「境を」は文脈を明確にする補足である。
- source_word: לִרְאוֹת
  choice: 見ようとして
  rationale: 目的を表す不定詞として訳した。「見る」と「見ようとする」の幅を保ち、神の顕現をのぞき見ようとする行為を過度に解釈しない。
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: そのうち多くの者が倒れる
  rationale: נפל の基本義「倒れる」を保持し、死を含意し得る文脈であっても、原文以上に「死ぬ」と明示しない。מִמֶּנּוּ רָב は集団の中の多数を指す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が神の固有名を直接用いているため、称号「主」に置換せず音写した。
- issue: 「倒れる」が死を意味するか
  choice: 倒れる
  alternative: 死ぬ、滅びる
  rationale: 裁きによる死が含意される可能性は高いが、ヘブライ語本文は一般的な動詞 נפל を用いているため、その含みを明示化せず残した。
translation_notes:
  register: 明快で品位ある現代標準日本語を用いた。「境を」は直前の文脈にある立入境界を自然に示す補足。「〜ことのないように」により、פֶּן が導く警告の否定目的・回避結果を表した。
