id: EXO.19.11
reference: Exodus 19:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: ja
  text: 彼らは三日目に備えていなければならない。その三日目に、ヤハウェがすべての民の目の前で[a]シナイ山に降りて来るからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「すべての民が見ている前で」。
    reason: לְעֵינֵי の慣用表現について、より明示的な日本語訳を示すため。
lexical_decisions:
- source_word: וְהָיוּ
  choice: 彼らは～ていなければならない
  rationale: 完了形だが、先行する命令に続く指示として義務・命令の力を表す。現代日本語で自然にその効力を伝える。
- source_word: נְכֹנִים
  choice: 備えて
  rationale: ここでは、神の顕現に向けて準備が整った状態を指す。「備えて」は前後の儀礼的準備にも適合する。
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: 三日目に
  rationale: 前置詞 ל は、備えが向けられる時を示す。「三日目に備えて」とすることで、期限だけでなく、その日に向けた準備という含みを保つ。
- source_word: כִּי
  choice: ～からである
  rationale: 指示の理由を導入する用法を明確に表す。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: その三日目に
  rationale: 標準的な時の表現。直前の「三日目」を受ける関係が明瞭になるよう「その」を補った。
- source_word: יֵרֵד
  choice: 降りて来る
  rationale: ירד の下降の動きを保ちつつ、神が民のいるシナイ山へ近づく場面に即して「来る」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な形に音写した。
- source_word: לְעֵינֵי
  choice: 目の前で
  rationale: 字義的には「目の前に／目の前で」。神の降臨が民に公然と示されるという視覚的な表現を自然な日本語で保つ。
- source_word: כָל הָעָם
  choice: すべての民
  rationale: 集められた民の全体を指す簡潔で自然な表現。
- source_word: עַל הַר סִינָי
  choice: シナイ山に
  rationale: ירד とともに、降下の到達場所としての山を示す。日本語では「シナイ山に降りて来る」が自然である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、称号「主」に置き換えず音写し、契約の神の名を保った。
- issue: 神の降臨が民に見えることの表現
  choice: すべての民の目の前で
  alternative: すべての民が見ている前で
  rationale: לְעֵינֵי の視覚的で公然たる性質を保つ一方、民が神そのものをどの程度見るのかを本文以上に規定しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さと神の顕現の荘重さを保った。「降臨」のような専門的な教会語は避け、原文の動きを直接表す「降りて来る」とした。
