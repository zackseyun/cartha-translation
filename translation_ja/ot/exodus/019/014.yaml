  text: וַ/יֵּ֧רֶד מֹשֶׁ֛ה מִן הָ/הָ֖ר אֶל הָ/עָ֑ם וַ/יְקַדֵּשׁ֙ אֶת הָ/עָ֔ם וַֽ/יְכַבְּס֖וּ שִׂמְלֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: ja
  text: そこでモーセは山から民のところへ下り、民を聖別した。民は自分たちの衣服を洗った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下り
  rationale: ירדの下方への移動を自然な現代日本語で表し、山から民のもとへ向かう物語の流れを保つ。
- source_word: מִן הָהָר
  choice: 山から
  rationale: 文脈上シナイ山を指すため、簡潔で標準的な「山」とした。
- source_word: אֶל הָעָם
  choice: 民のところへ
  rationale: עםはここではイスラエルの民を指す。「民へ」よりも移動先として自然な日本語になるよう「民のところへ」とした。
- source_word: וַיְקַדֵּשׁ
  choice: 聖別した
  rationale: ピエル形のקדשׁが示す、神との会見に備えて民を聖なるものとして取り分け、整える行為を、簡潔な聖書語として表す。
- source_word: הָעָם
  choice: 民
  rationale: ヘブライ語で目的語が繰り返されているため、日本語でも明示して保持した。
- source_word: וַיְכַבְּסוּ
  choice: 洗った
  rationale: כבסは衣服を洗うことを指すため、過不足のない自然な表現とした。
- source_word: שִׂמְלֹתָם
  choice: 自分たちの衣服
  rationale: שִׂמְלָהは衣類を広く指す。「衣服」は儀礼的準備の文脈にふさわしい品位を保ち、「自分たちの」によって再帰的な所有関係を明確にする。
theological_decisions:
- issue: シナイでの神の顕現に備えるקדשׁの儀礼的な聖性表現
  choice: 民を聖別した
  alternative: 民を聖なるものとして取り分けた／民を清めた
  rationale: ここでの行為は単なる道徳的改善ではなく、神との会見に向けた儀礼的準備と聖なる取り分けを表す。「聖別」はその神学的含意を簡潔に保つ。「清めた」だけでは聖なる取り分けの要素が弱くなりうる。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、シナイ契約の荘厳な文脈に合う品位を保った。「聖別」は一般語よりやや専門的だが、原語の聖性と儀礼的準備の両面を最も簡潔に伝えるため採用した。
