source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֔ה וַ/יִּקְרָ֖א לְ/זִקְנֵ֣י הָ/עָ֑ם וַ/יָּ֣שֶׂם לִ/פְנֵי/הֶ֗ם אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: ja
  text: そこでモーセは戻って来て、民の長老たちを呼び寄せ[a]、ヤハウェが彼に命じたこれらの言葉[b]をすべて彼らの前に示した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民の長老たちに呼びかけ」とも訳せる。
    reason: קרא＋לは、長老たちを呼び寄せることとも、彼らに呼びかけることとも解し得るため。
  - marker: b
    text: 「これらの事柄」または「これらのこと」とも訳せる。ヘブライ語は、語られた言葉にも、話題となっている事柄にも用いられる。ここではモーセがヤハウェの告げた内容を伝えるため、「言葉」とした。
    reason: דבריםの意味範囲と、文脈に基づく本文訳の選択を示すため。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 戻って来ると
  rationale: בואは視点により「来る」「行く」のいずれにもなり得る。ここではモーセがヤハウェのもとから民のところへ戻る場面なので、文脈を自然に表す「戻って来ると」とした。
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: 民の長老たちを呼び寄せ
  rationale: קרא＋לは「呼びかける」「呼び寄せる」の両義があり得る。ここでは代表者たちを集めて告げる文脈に合わせ、「呼び寄せ」とした。
- source_word: זִקְנֵי הָעָם
  choice: 民の長老たち
  rationale: זקניםは年長者というだけでなく、民を代表する公認の長老たちを指す。「指導者たち」と一般化せず、社会的役割を保った。
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: 彼らの前に示した
  rationale: 直訳的には「彼らの前に置いた」。日本語では、命じられた言葉を提示する意味が自然に伝わる「前に示した」とした。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: これらの言葉をすべて
  rationale: דבריםは「言葉」「事柄」「物事」を意味し得るが、ここでは直前に神が語った内容をモーセが伝達するため、「言葉」を本文に採った。語順は自然な現代日本語に整えた。
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: ヤハウェが彼に命じた
  rationale: 関係節によって、その言葉の源と権威がヤハウェにあることを明確に表した。ヘブライ語の完了形は、ここでは先行する命令を指す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に現れる神の固有名である四文字神名を、称号に置き換えず「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、その固有名としての性格を保つ「ヤハウェ」を採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼らの前に示した」によって原文の「前に置く」という比喩を過度に直訳せず、神から受けた言葉を長老たちに提示する動作を自然に表した。
