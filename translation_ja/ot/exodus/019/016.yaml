source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: ja
  text: 三日目の朝になると、雷鳴[a]と稲妻が起こり、山の上に厚い雲がかかり、角笛[b]の音が非常に強く[c]響いた。宿営にいた民は皆、震えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「音」または「声」とも訳せるヘブライ語だが、ここでは稲妻と並んでいるため、雷鳴を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 角笛は、動物の角を用いた笛。
    reason: lexical_clarification
  - marker: c
    text: 直訳「非常に強かった」。ここでは角笛の音の強さを表し、「非常に大きく響いた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: 三日目の朝になると
  rationale: 二度の וַיְהִי と時間を表す不定詞構文の機能を、冗長さを避けた自然な現代日本語で表した。
- source_word: קֹלֹת
  choice: 雷鳴
  rationale: 語自体は「声」「音」も意味し得るが、稲妻と並ぶこの文脈では雷鳴を指す可能性が最も高い。意味の幅は脚注に残した。
- source_word: וּבְרָקִים
  choice: 稲妻
  rationale: 複数形が示す反復的な閃光を、日本語で自然な集合表現にした。
- source_word: עָנָן כָּבֵד
  choice: 厚い雲
  rationale: כָּבֵד は直訳すれば「重い」だが、雲については密度を示す「厚い」が明瞭で自然である。
- source_word: עַל הָהָר
  choice: 山の上には
  rationale: עַל の位置関係を保ちつつ、日本語の場面描写として自然にした。
- source_word: קֹל שֹׁפָר
  choice: 角笛の音
  rationale: שֹׁפָר は動物の角で作られる吹奏具を指すため、「ラッパ」より具体的な「角笛」とした。
- source_word: חָזָק מְאֹד
  choice: 非常に強く響いた
  rationale: 直訳的な「非常に強い」を保ちながら、音について自然に理解できるよう「響いた」を補った。「非常に大きく」も可能であるため脚注に示した。
- source_word: וַיֶּחֱרַד
  choice: 震えた
  rationale: 恐れや動揺による身体的な震えを表し、感情だけに限定しない訳語とした。
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: 宿営にいた民は皆
  rationale: 関係節の内容を自然な日本語の連体修飾として表した。
theological_decisions:
- issue: シナイ山における神顕現の現象
  choice: 雷鳴、稲妻、雲、角笛の音を感覚的な現象として記述する
  alternative: קֹלֹת を「声々」と訳して天上の声を示唆する
  rationale: 本文は畏怖を生じさせる現象を描くが、その由来や神学的意味をこの節だけで特定してはいない。文脈上もっとも自然な「雷鳴」を本文に置き、語義上の曖昧さを脚注で保持した。
translation_notes:
  register: 現代標準日本語による、明瞭で荘重な物語文。過度に古風な「すると、三日目に至り」などは避けた。神顕現の迫力を保つため、短い並列描写と「皆、震えた」という結びを用いた。
