  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: ja
  text: ヤハウェはシナイ山の頂に降り、モーセを山の頂へ呼んだ。モーセは登った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 降り
  rationale: ירדの下向きの移動を簡潔に表す。「降臨した」よりも解釈を加えず、現代日本語として自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名יהוהを称号に置き換えず、一般的な学術的音写で表した。
- source_word: הַר סִינַי
  choice: シナイ山
  rationale: 日本語で定着している簡潔な地名表記。
- source_word: אֶל רֹאשׁ הָהָר
  choice: 山の頂に／山の頂へ
  rationale: רֹאשׁは字義的には「頭」だが、ここでは山の最上部を指すため「頂」とした。前置詞אֶלの到達方向は、降下では「に」、呼びかけの目的地では「へ」と自然に訳し分けた。
- source_word: וַיִּקְרָא
  choice: 呼んだ
  rationale: קראの基本義を保ち、「召し寄せた」のような強い命令性を付加しない。
- source_word: לְמֹשֶׁה
  choice: モーセを
  rationale: 日本語の「人を場所へ呼ぶ」という構文に合わせた。「モーセ」は定着した人名表記。
- source_word: וַיַּעַל
  choice: 登って行った
  rationale: עלהの上向きの移動を表し、先の「降り」との対照を保つ。「登った」より移動の方向感が明確である。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、称号「主」に置換せず音写した。「エホバ」ではなく、ヘブライ語の推定発音に基づく一般的な表記「ヤハウェ」を採用した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文にある「山の頂」の反復を残し、ヤハウェの降下とモーセの上昇の対照を簡潔に表した。
