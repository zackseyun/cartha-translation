source:
  edition: WLC
  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: ja
  text: あなたがた自身は、わたしがエジプトに対して行ったこと、また、わたしがあなたがたを鷲の翼に乗せて[a][b]運び、わたしのもとへ[c]連れて来たことを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「鷲たちの翼の上に」。力強く守りながら救い出すことを描く比喩。
    reason: lexical_alternative
  - marker: b
    text: 「鷲」と訳したヘブライ語は、禿鷲を含む大型の猛禽を広く指すことがある。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「わたしへ」。
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: あなたがた自身が……見た
  rationale: 独立人称代名詞 אַתֶּם の強調を「あなたがた自身が」で表し、民自身が神の行為の目撃者であることを保った。完了した過去の経験なので、現代日本語では自然な過去形とした。
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: わたしがエジプトにしたこと
  rationale: 前置詞 לְ はここでは神の行為がエジプトに及んだことを示す。「エジプト」は国・民を集合的に指す原文の表現を保つ。
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: わたしはあなたがたを……運び
  rationale: נשא の基本的な「担う、運ぶ」を、保護と救出の文脈に合う自然な現代日本語で表した。
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: 鷲の翼に乗せて
  rationale: 力強く守りながら運ぶという鮮明な比喩を保持した。נְשָׁרִים は大型の猛禽を広く指し得るが、文脈と伝統的理解に即して「鷲」とした。
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: わたしのもとへ連れて来た
  rationale: אֵלָי の方向性を自然に表しつつ、単なる移動だけでなく神との関係へ招き入れる響きを過度に説明せずに伝える。
theological_decisions:
- issue: 救出の到達点が持つ関係的な含意
  choice: わたしのもとへ連れて来た
  alternative: わたしへ連れて来た
  rationale: אֵלָי は字義的には「わたしへ」だが、「わたしのもとへ」は、日本語で神の臨在と契約関係への接近を自然に示しながら、原文以上の教理的説明を加えない。
translation_notes:
  register: 明瞭で格調のある現代標準語。「あなたがた自身が」で原文の強調を保ち、「鷲の翼」という比喩は説明に置き換えず本文に残した。文の切れ目を補って日本語として読みやすくしつつ、神の二つの行為を並列のまま示した。
