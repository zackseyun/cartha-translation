id: EXO.19.22
reference: Exodus 19:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: ja
  text: また、ヤハウェに近づく祭司たちも[a]、自らを聖別しなければならない。そうしなければ、ヤハウェが彼らに襲いかかる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェに近寄る」または「ヤハウェのもとに進み出る」とも訳せる。神の臨在に近づいて仕えるという祭儀的な意味を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 「彼らに向かって突如ほとばしり出る」とも訳せる。ヘブライ語は、ヤハウェの裁きが抑えを破るように突然及ぶ様子を描く。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: また、…も
  rationale: 前の命令に付け加え、祭司も例外ではないという強調を自然な日本語で表す。
- source_word: הַכֹּהֲנִים
  choice: 祭司たち
  rationale: 祭儀的文脈における標準的な訳語。ヘブライ語の定冠詞は、日本語では文脈上特定されるため明示しない。
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: ヤハウェに近づく
  rationale: 分詞の継続的・特徴的な意味を保ち、神の臨在に近づいて仕える祭儀的含意を過度に限定せず表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず音写する。節末の反復も代名詞にせず保持する。
- source_word: יִתְקַדָּשׁוּ
  choice: 自らを聖別しなければならない
  rationale: ヒトパエル形の再帰的意味と、祭司が自分を聖なるものとして整える祭儀的意味を保持する。
- source_word: פֶּן
  choice: そうしなければ
  rationale: 避けるべき結果を示す警告を、明瞭で自然な現代日本語にする。
- source_word: יִפְרֹץ בָּהֶם
  choice: 彼らに襲いかかる
  rationale: פרץが描く、抑えが破れて突然及ぶような神の裁きの激しさを自然な日本語で表し、刑罰の具体的な形は付加しない。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文は四文字神名を二度明記しているため、契約の神の固有名として音写し、二度目も省略しない。
- issue: יִפְרֹץ בָּהֶם יְהוָה が示す警告の性質
  choice: 聖別しない祭司にヤハウェが突然、敵対的に襲いかかるという警告
  alternative: ヤハウェが彼らのところへ一般的な意味で押し出て来る
  rationale: 前後のシナイ山の境界と危険の文脈、および前置詞 בָּהֶם を踏まえ、神の裁きが彼らに及ぶ意味を示す。ただし死など特定の結果は本文に加えない。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、「祭司」「聖別」など文脈上必要な祭儀用語は保持した。「襲いかかる」により警告の切迫感を伝え、神の裁きの具体的な形は断定していない。
