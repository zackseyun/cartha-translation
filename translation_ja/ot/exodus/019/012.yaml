base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: ja
  text: 民のために山の周囲に境界を定め、こう言いなさい。『山に登ったり、その端に触れたりしないよう、気をつけなさい。山に触れる者はだれでも、必ず死刑に処せられる。[a]』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「必ず死ぬ」。ヘブライ語では「死」を用いる強調表現で、ここでは受動形と次節の処刑規定を踏まえて「必ず死刑に処せられる」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ אֶת־הָעָם סָבִיב
  choice: 民のために山の周囲に境を設け
  rationale: גבלのヒフィルは境界・制限を設けることを表す。日本語では対象である山を文脈から補い、「民のために」とすることで、民を囲うのではなく立入境界を設ける意味を明確にした。סָבִיבは「周囲に」とした。
- source_word: לֵאמֹר
  choice: こう言いなさい
  rationale: 後続する直接命令を自然な現代日本語で導入し、モーセへの命令の力を保つ。
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: 十分に気をつけなさい
  rationale: שׁמרのニファル命令形とלָכֶםから成る自己警戒の慣用句。単なる注意喚起ではなく強い警告であるため「十分に」を添えた。
- source_word: עֲלוֹת בָּהָר
  choice: 山に登ったり
  rationale: עלהとבの組み合わせを、自然かつ具体的な日本語で表した。
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: その麓に触れたり
  rationale: קָצֶהは端・末端を意味するが、山については立入禁止区域の下端を指すため「麓」が自然。ただし単なる山麓一般ではなく山の最端部にさえ触れてはならないという警告を表す。
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: 山に触れる者はだれでも
  rationale: כלと分詞の総称的・分配的な構文を「だれでも」で表した。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形מוֹתが確実性を強調し、יוּמָתはホファル形で他者によって死に至らされる受動を表す。次節の執行規定とも整合する。
theological_decisions:
- issue: מוֹת יוּמָתが自然死の確実性か、科される死刑か
  choice: 必ず死刑に処せられる
  alternative: 必ず死ぬ
  rationale: 動詞は使役受動形であり、直後の19:13には共同体による処刑方法が示されるため、ここでは刑罰としての死を本文に反映した。ただしヘブライ語の強調死刑定型句が字義的には「必ず死ぬ」とも訳せることを脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令と警告の強さを維持しつつ、古風な文語表現は避けた。脚注記号[a]は該当する死刑定型句の直後に置いた。
