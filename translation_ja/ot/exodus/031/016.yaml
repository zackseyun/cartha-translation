source:
  edition: WLC
  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: ja
  text: イスラエルの子ら[a]は安息日を守り、代々にわたって安息日を守り行わなければならない[b]。これは永遠の契約[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」または「イスラエルの民」とも訳せる。ヘブライ語では字義的に「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 字義的には「安息日を行う」。すなわち、安息日を守り、遵守すること。
    reason: lexical_alternative
  - marker: c
    text: 「永久の契約」または「とこしえの契約」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: 守り
  rationale: שׁמרの「守る、遵守する」という意味を保ち、続く不定詞句と自然につなげた。文脈上の契約的な義務は「行わなければならない」によって表した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの家族的・男性複数表現を保ちつつ、契約の民を集合的に指す表現として訳した。
- source_word: הַשַּׁבָּת
  choice: 安息日
  rationale: 一般的な休息ではなく、契約のしるしとして定められた安息日を指すため、定着した訳語を用いた。
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: 安息日を行わなければならない
  rationale: 字義的には「安息日を行う」。日本語でも原文の特徴をある程度残せる「行う」を採り、義務を示す文脈に合わせて自然な述語にした。
- source_word: לְדֹרֹתָם
  choice: 代々にわたって
  rationale: 後々の世代まで継続することを、明瞭で自然な現代日本語で表した。
- source_word: בְּרִית עוֹלָם
  choice: 永遠に続く契約
  rationale: עוֹלָםの長く持続する意味を保ちつつ、この節だけから後代の神学的結論を限定的に決めない表現とした。
theological_decisions:
- issue: 契約の民を表す בְנֵי יִשְׂרָאֵל の訳
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の家族的な男性複数表現を保持する一方、これは契約共同体全体を集合的に指す。
- issue: בְּרִית עוֹלָם の持続性
  choice: 永遠に続く契約
  alternative: 永遠の契約／永久の契約
  rationale: 契約とその持続性を明示しながら、עוֹלָם の時間的射程について本文以上の体系的解釈を持ち込まない。
- issue: וְשָׁמְרוּ と לַעֲשׂוֹת の規範的な力
  choice: 守り……行わなければならない
  alternative: 守り……行う
  rationale: 周辺文脈における命令・契約規定としての力を日本語で明確にしつつ、二つの動詞をともに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、契約規定にふさわしい端正さと義務性を保った。「安息日を行う」はやや特徴的だが、原文の反復と慣用表現を見える形で残し、脚注で意味を補った。
