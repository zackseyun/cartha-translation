source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: ja
  text: あなたはイスラエルの人々[a]にこう告げなさい。『ただ、あなたがたはわたしの安息日を必ず守りなさい。これは、代々にわたって、わたしとあなたがたとの間のしるしであり、わたしがあなたがたを聖なる者とするヤハウェ[b]であることを、あなたがたが知るためである。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「イスラエルの子ら」。イスラエルの民全体を指す契約上の呼称。
    reason: lexical_alternative
  - marker: b
    text: 原文は神の固有名YHWH（ヤハウェ）。
    reason: divine_name
lexical_decisions:
- source_word: וְאַתָּה
  choice: あなたは
  rationale: 前置された代名詞による話題転換と強調を自然な日本語で示す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義は「イスラエルの子ら」だが、ここでは契約共同体全体を指すため、現代日本語として明瞭な表現を採用し、直訳を脚注に示す。
- source_word: אַךְ
  choice: ただ…必ず
  rationale: 制限を表す「ただ」と強い強調を表す「必ず」を組み合わせ、文脈上の限定・強調の両面を保つ。
- source_word: שַׁבְּתֹתַי
  choice: わたしの安息日
  rationale: ヘブライ語は複数形だが、日本語では反復して巡る安息日の制度・日々を「安息日」で自然に包括できる。
- source_word: תִּשְׁמֹרוּ
  choice: 守りなさい
  rationale: שׁמר の契約的な「守る、遵守する」という命令の力を簡潔に表す。
- source_word: אוֹת
  choice: しるし
  rationale: 契約関係を目に見える形で示す標識という意味に合う標準的な訳語。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたって
  rationale: 世代を通じた継続性を自然な現代日本語で表す。
- source_word: מְקַדִּשְׁכֶם
  choice: あなたがたを聖なる者とする
  rationale: ピエル分詞の使役的・継続的意味を、一般読者に明瞭な表現で示す。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く認識される敬称を本文に用い、原文が神の固有名YHWHであることを脚注で明示する。
theological_decisions:
- issue: אַךְ の限定または強調
  choice: ただ…必ず
  alternative: ただ／確かに／それでも
  rationale: 幕屋造営の命令との関係で安息日遵守を特に限定・強調する語であり、一方だけに固定せず両方の含みを日本語で表した。
- issue: מְקַדִּשְׁכֶם の意味
  choice: あなたがたを聖なる者とする
  alternative: あなたがたを聖別する
  rationale: 神が民を御自分のために取り分け、聖なるものとする働きを表す。「聖別する」も可能だが、一般読者への明瞭さを優先した。
- issue: 神名 יְהוָה の表記
  choice: 主（脚注でYHWH／ヤハウェ）
  alternative: ヤハウェ
  rationale: 固有名であることを隠さないよう脚注に明示しつつ、本文では自然で広く理解される日本語表記を用いた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令の強さを保ちながら、ヘブライ語特有の反復的な引用導入は日本語として自然に整理した。すべての脚注記号を本文に配置した。
