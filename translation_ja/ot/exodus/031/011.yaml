    rationale: יַעֲשׂוּは「彼らが作る」という三人称男性複数であり、「作らせる」のような使役形ではない。さらに草案では前半だけが「作らせる」、後半が「彼らは…作らなければならない」となり、同じ動詞内容が不自然に重複している。
  - severity: low
    issue: 英語監査記録の語彙代案に対応する注のアンカーが必要である。
    rationale: 代案は香（קְטֹרֶת הַסַּמִּים）に関するものなので、日本語では当該語に注記を置くのが適切である。
