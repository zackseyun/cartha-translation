base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: ja
  text: また、彼らは注ぎの油と、聖所のための香り高い香[a]を、わたしがあなたに命じたすべてのとおりに作らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聖所のための香料の香」。
    reason: קְטֹרֶת הַסַּמִּיםの字義的な語彙代案を示す。
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 油を注ぐ儀式に用いる油を表す連語。文脈にない「聖なる」を補わず、祭儀上の用途を簡潔に伝える。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香り高い香
  rationale: 香料から調製された香を指す。日本語として自然でありつつ、芳香性を保つ。
- source_word: לַקֹּדֶשׁ
  choice: 聖所のための
  rationale: לְ の用途・目的の含みを保ち、הַקֹּדֶשׁを幕屋の聖所として訳した。「聖なる用途のため」とする余地もあるが、直前の幕屋調度品の列挙に照らして場所を指す表現が自然。
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: わたしがあなたに命じたすべてのとおりに
  rationale: כְּכֹל の包括性と、神からモーセへの直接の呼びかけを保持する。
- source_word: יַעֲשׂוּ
  choice: 彼らは…作らなければならない
  rationale: 三人称男性複数の主語を明示し、指示・命令の効力を現代日本語で自然に表す。前半にも日本語上自然な「作らせる」を補い、列挙された品々とのつながりを示す。
theological_decisions:
- issue: לַקֹּדֶשׁ が場所を指すか、聖なる用途を指すか
  choice: 聖所のための
  alternative: 聖なる用途のための
  rationale: 語形だけでは用途的理解も可能だが、幕屋の製作品を列挙する文脈では「聖所」が最も自然である。特定の宗派的解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語。祭儀用語としての品位を保ちながら、過度に古風な命令表現は避けた。節が前節から続く列挙であることを「また」で示した。
