  to: わたしは彼を、神の霊、すなわち知恵と理解力と知識、そしてあらゆる仕事の技量で満たした。
  rationale: 原文の「満たす」による一続きの賦与の表現を日本語でも保った。「すなわち」は、神の霊による賦与が続く能力の列挙として具体化される文脈上の関係を明瞭にするものであり、教理的な同一視を意図しない。「理解力」と「あらゆる仕事の技量」により、原語の語義と現代日本語の明瞭さを両立させた。
