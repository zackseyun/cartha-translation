  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: ja
  text: わたしは彼を、神の霊、すなわち知恵と理解力と知識、そしてあらゆる仕事の技量で満たした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: わたしは……満たし
  rationale: 語根 מלא の「満たす」を保った。文脈上、神がベツァルエルにすでに授けた賜物を、現在にも効力を持つものとして述べている。日本語では後続の「与えた」と一文に結び、自然な叙述にした。
- source_word: אֹתוֹ
  choice: 彼を
  rationale: 直前の文脈で指名されたベツァルエルを指す直接目的語代名詞である。
- source_word: רוּחַ אֱלֹהִים
  choice: 神の霊
  rationale: 幕屋の聖なる仕事のために神ご自身が力を授ける文脈を反映した。同時に、ヘブライ語句がより一般的な意味を取り得ることは脚注に示した。
- source_word: בְּחָכְמָה
  choice: 知恵
  rationale: חָכְמָה の基本的な意味を簡潔に保ち、続く「英知」「知識」との三語の並びを明瞭にした。
- source_word: וּבִתְבוּנָה
  choice: 英知
  rationale: תְּבוּנָה は理解力、洞察力、識別力を表す。「知恵」「知識」と重なりすぎず、職人に授けられた深い理解力を示す語として「英知」を選んだ。
- source_word: וּבְדַעַת
  choice: 知識
  rationale: דַּעַת の標準的な意味をそのまま表した。
- source_word: וּבְכָל מְלָאכָה
  choice: あらゆる工芸の技量
  rationale: מְלָאכָה は広く「仕事」を意味し得るが、ここでは幕屋製作の熟練した手仕事を指す。「工芸の技量」として直近の文脈を明確にし、כָּל を「あらゆる」で表した。
theological_decisions:
- issue: רוּחַ אֱלֹהִים を神ご自身の霊と取るか、より一般的な神的霊・神からの霊と取るか
  choice: 神の霊
  alternative: 神からの霊／神的な霊
  rationale: 神がベツァルエルを幕屋奉仕のために直接力づける文脈では、神ご自身の霊を指す理解が最も自然である。ただし、後代の教理的定式を本文に持ち込まず、原語に残る幅は脚注で明示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語とした。「授けた」も可能だが、一般読者に直接的な「与えた」を採用した。ヘブライ語では「満たす」が後続の知恵・英知・知識・仕事の技量にも関係し得るが、日本語で「すべてによって満たした」とすると不自然なため、「神の霊で満たし……与えた」として意味関係を自然に表現した。
