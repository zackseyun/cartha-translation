  terminology: 「神の霊」はרוּחַ אֱלֹהִיםに対する自然で確立した訳語である。脚注は、この句に残る「神からの霊／神的な霊」という解釈上の幅を適切に示しており、後代の教理を本文へ読み込んでいない。
