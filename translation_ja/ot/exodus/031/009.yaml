  text: また、全焼のいけにえの祭壇とそのすべての用具、洗盤とその台座、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のいけにえの祭壇
  rationale: 祭壇と、それにささげるעֹלָהとの関係を自然な日本語で示す。עֹלָהは供え物をすべて焼く祭儀なので、「全焼のいけにえ」とした。
- source_word: כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: 祭壇に付属し、その奉仕に用いる器具の総体を表す。現代日本語として分かりやすい「用具」を用いた。
- source_word: הַכִּיּוֹר
  choice: 洗盤
  rationale: 幕屋の庭で祭司が身を洗うための器を指す。一般的な「たらい」より祭具としての品位と文脈上の一貫性を保てる。
- source_word: כַּנּוֹ
  choice: その台座
  rationale: 洗盤を支える部分を指す語であり、「台」と「台座」の双方が可能だが、独立した支持構造を明確に示す「台座」を選んだ。
- source_word: וְאֶת
  choice: また
  rationale: 列挙される目的語を追加する接続表現。節の途中であることを踏まえ、自然な日本語の列挙として「また」でつないだ。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後に続く備品一覧の一部であるため、文末は読点とした。原文に実質的な異読や訳注を要する曖昧さはない。英語POBの脚注は本文中の語との対応が不整合であり、原語上も単に「台座／台」の語義選択なので、日本語草案では脚注を設けなかった。
