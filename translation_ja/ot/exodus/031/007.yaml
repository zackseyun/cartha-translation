  text: אֵ֣ת אֹ֣הֶל מוֹעֵ֗ד וְ/אֶת הָֽ/אָרֹן֙ לָֽ/עֵדֻ֔ת וְ/אֶת הַ/כַּפֹּ֖רֶת אֲשֶׁ֣ר עָלָ֑י/ו וְ/אֵ֖ת כָּל כְּלֵ֥י הָ/אֹֽהֶל׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: ja
  text: 会見の幕屋、証しの箱、その上にある贖いの蓋[a]、そして幕屋のすべての器具――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恵みの座」。箱を覆う金の蓋で、贖罪の儀式に用いられた。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の幕屋
  rationale: 神がイスラエルと会うために定められた聖所を指す定着した表現であり、ヘブライ語の意味と荘重さを保つ。
- source_word: הָאָרֹן לָעֵדֻת
  choice: 証しの箱
  rationale: לָעֵדֻת は箱と「証し」との関係・用途を示す。日本語では「証しの箱」が自然で、契約という語を本文に補わずに関係を保てる。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 箱の上に置かれた金の覆いを指し、同時に贖罪の働きとの語義的な結びつきも伝える。単なる「蓋」より文脈上の含意を保つ。
- source_word: אֲשֶׁר עָלָיו
  choice: その上にある
  rationale: 男性単数接尾辞は直前の箱を受ける。位置関係を簡潔かつ自然に表す。
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: 幕屋のすべての器具
  rationale: כְּלִים は幕屋で用いる各種の物品を広く指すため、「器」などに狭めず「器具」とした。
theological_decisions:
- issue: כַּפֹּרֶת の訳語
  choice: 贖いの蓋
  alternative: 恵みの座
  rationale: この語は箱の蓋という具体物を指す一方、贖罪儀礼との関連も持つ。「贖いの蓋」は双方を比較的明確に伝え、「恵みの座」は伝統的な別訳として注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖所の目録にふさわしい簡潔で荘重な調子を保った。本節は前節から続く列挙の途中なので、末尾をダッシュとした。英語相談層の脚注[a]は本文上の位置と内容が一致していないため採用せず、原文上実質的な訳語の幅がある כַּפֹּרֶת に脚注を付した。
