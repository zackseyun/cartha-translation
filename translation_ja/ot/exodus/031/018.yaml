source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: ja
  text: 神はシナイ山でモーセと語り終えると、二枚の証しの板、すなわち、神の指で[a]書かれた石の板を、モーセに授けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の指で」は、これらの板に書いたのが神ご自身であることを、生き生きと表す原文の表現。
    reason: 原文の擬人的表現と、神による直接の記銘という含意を示すため。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 授けた
  rationale: נתןの物語上の完了した行為を表す。神がモーセに契約の板を与えるという文脈にふさわしい、自然で格調ある表現。
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: 語り終えると
  rationale: כלהの不定詞構文が示す、発話の完了に続く時間関係を簡潔に保つ。
- source_word: אִתּוֹ
  choice: モーセと
  rationale: 代名詞の指示対象は文脈上モーセである。「と」により、一方的な「語りかける」へ限定せず、ヘブライ語の「彼と」を保つ。
- source_word: בְּהַר סִינַי
  choice: シナイ山で
  rationale: 出来事の場所を表す自然な現代日本語。
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: 二枚の証しの板
  rationale: עֵדוּתの「証言・証し」という契約的意味を保ち、「契約文書」などの説明的な限定を本文へ持ち込まない。板は平たい物として「枚」で数える。
- source_word: לֻחֹת אֶבֶן
  choice: 石の板
  rationale: 板の材質を表す構文を自然に訳し、直前の「証しの板」との同格関係を「すなわち」で明示する。
- source_word: כְּתֻבִים
  choice: 書かれた
  rationale: כתבの受動分詞の基本義をそのまま表す。「刻まれた」として方法を過度に特定しない。
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: 神の指で
  rationale: 道具・手段を示すבְּを「で」と訳し、神が直接書いたことを鮮明に示す擬人的表現を保持する。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ここではイスラエルの神を指す単数的用法であり、日本語では「神」が自然。
theological_decisions:
- issue: 神による記銘を表す擬人的表現
  choice: 神の指で
  alternative: 神ご自身によって／神の力によって
  rationale: 原文の具体的な比喩を抽象化せず、石の板への記銘が神に直接帰されていることと、その表現上の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「証し」「神の指」という原文の契約的・詩的表現を保持した。同格関係は「すなわち」で明確にし、長い一文でも読み違えにくくした。
