id: EXO.31.14
reference: Exodus 31:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: ja
  text: あなたがたは安息日を守らなければならない。それは、あなたがたにとって聖なるものだからである。これを汚す者は必ず死刑に処せられる。その日に仕事をする者はだれでも、その者は自分の民の中から断ち絶たれる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「断ち絶たれる」はヘブライ語の法的な定型表現で、ここでは、その裁きが具体的にどのように行われるかは明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守らなければならない
  rationale: שׁמרの「守る・遵守する」という契約法上の意味と、命令の拘束力を、明瞭な現代日本語で表した。
- source_word: הַשַּׁבָּת
  choice: 安息日
  rationale: שַׁבָּתが指す日・制度の標準的で広く理解される訳語。
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: あなたがたにとって聖なるもの
  rationale: קֹדֶשׁの「聖別されたもの」という名詞的含みと、לָכֶםの関係性を保った。
- source_word: מְחַלְלֶיהָ
  choice: これを汚す者
  rationale: ピエル形のחללが表す「聖なるものを俗なものとして扱い、冒す」という意味を、自然で理解しやすい日本語にした。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と定動詞による強調、およびמותホファル形の受動的な司法処罰の意味を表した。
- source_word: כָּל־הָעֹשֶׂה בָהּ מְלָאכָה
  choice: その日に仕事をする者はだれでも
  rationale: מְלָאכָהを一般的な仕事・作業として訳し、分詞句の一般的な適用範囲を「だれでも」で明示した。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: その者は……断ち絶たれる
  rationale: נֶפֶשׁをこの法的文脈では人格全体を指す「者」とし、כרתの受動形による定型表現を具体化しすぎず保持した。
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: 自分の民の中から
  rationale: 女性形接尾辞は文法上נֶפֶשׁを受けるもので、違反者の性別を女性に限定しないため、自然な再帰表現とした。
theological_decisions:
- issue: וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָという刑罰定型句の意味
  choice: 「自分の民の中から断ち絶たれる」と訳し、手段を特定しない
  alternative: 共同体から追放される／神の裁きによって命を断たれる
  rationale: この節は死刑を明言する一方、「断ち絶たれる」という定型句自体が指す具体的な執行主体や方法は明示していない。本文の法的・神学的緊張を保つため、一つの解釈に限定しなかった。
- issue: 法的文脈におけるנֶפֶשׁ
  choice: 「その者」
  alternative: 「その魂」
  rationale: ここでは違反した個人を指しており、人間の非物質的部分についての教理を述べているわけではないため。
translation_notes:
  register: 現代標準日本語による、明瞭で威厳のある法文調。「せよ」調を避けつつ、「守らなければならない」「必ず死刑に処せられる」によって命令と刑罰の強さを保持した。
