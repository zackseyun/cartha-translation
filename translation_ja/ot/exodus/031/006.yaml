  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: ja
  text: 見よ、わたしは彼とともに、ダン部族のアヒサマクの子オホリアブを任命した。また、すべて心に知恵のある者に、わたしは知恵を授けた[a]。それは、彼らがわたしがあなたに命じたすべてのものを造るためである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心に知恵のある者」はヘブライ語で文字どおりには「心の知恵ある者」。ここで「知恵」は、知的な知恵だけでなく製作の技能も含む。
    reason: cultural_note
  - marker: b
    text: または、「そして彼らは、わたしがあなたに命じたすべてのものを造る」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: 見よ、このわたしは
  rationale: 独立人称代名詞による強調と、注意を促す הִנֵּה の力を保つ。「このわたしは」は通常より強い表現だが、原文の有標性に対応する。
- source_word: נָתַתִּי אִתּוֹ
  choice: 彼とともに……任命した
  rationale: נתן の基本義は「与える／置く」だが、ここではベツァルエルと並べてオホリアブを務めに就かせる文脈なので「任命した」とした。אִתּוֹ は「彼とともに」と明示した。
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: アヒサマクの子オホリアブ
  rationale: 人名を日本語で音写し、ヘブライ語の系譜表現を自然な語順で示した。
- source_word: לְמַטֵּה דָן
  choice: ダン部族の
  rationale: מַטֶּה はここではイスラエルの部族を指すため、簡明な現代日本語で所属を表した。
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: 心に知恵のある者すべての心に
  rationale: לב の反復と、心を理解力・技能の座と見るヘブライ語の表現を保持した。日本語ではやや反復的だが、原文の比喩を伝えられる。
- source_word: נָתַתִּי חָכְמָה
  choice: わたしは知恵を授けた
  rationale: 幕屋製作の実際的な技能を含むが、חָכְמָה の広い意味と神からの賦与を保つため「知恵」とし、自然な日本語として「授けた」を用いた。
- source_word: וְעָשׂוּ
  choice: それは……彼らが造るためである
  rationale: 知恵を授けたことの目的・結果として読むのが文脈上自然である。ただし接続法的に「そして彼らは造る」とも取れるため、脚注でその可能性を示した。
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: わたしがあなたに命じたものをすべて
  rationale: 命令の対象全体を表す כָּל אֲשֶׁר を自然かつ包括的に訳した。
theological_decisions:
- issue: חֲכַם לֵב と חָכְמָה を職人の文脈でどう訳すか
  choice: 心に知恵のある／知恵
  alternative: 熟練した／技能
  rationale: 実際の製作技能を指す文脈だが、「知恵」を単なる技術から切り離さない原文の人間観と、神がそれを授けるという意味を保持した。
- issue: וְעָשׂוּ と先行節との論理関係
  choice: 造るためである
  alternative: そして彼らは造る
  rationale: 神が知恵を授けた目的を表す読みを本文に採用したが、ヘブライ語の接続形が持つ連接・結果の可能性を排除せず脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「見よ」「このわたしは」で原文の荘重さと強調を残した。職人の能力を「技能」だけに狭めず、「心」と「知恵」の反復を意識的に保持した。
