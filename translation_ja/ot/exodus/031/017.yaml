  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: ja
  text: これは、わたしとイスラエルの子ら[a]との間の永遠のしるしである。ヤハウェが六日の間に天と地を造り、七日目にはその働きをやめ[b]、息をつかれた[c]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「休まれた」。ヘブライ語の動詞は、より字義的には「やめる」「やむ」を意味する。
    reason: lexical_alternative
  - marker: c
    text: または「元気を取り戻された」。原文は「息をつく」とも訳せる、生き生きとした擬人的表現を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: わたしと…との間
  rationale: 二者の関係を示す相関的な前置詞を、自然な現代日本語で表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の家族的表現を本文に保持し、慣用的な訳語は脚注に示した。
- source_word: אוֹת
  choice: しるし
  rationale: 契約関係を示す標準的な語として、明瞭で定着した訳語を選んだ。
- source_word: לְעֹלָם
  choice: 永遠の
  rationale: しるしの持続性を簡潔かつ自然に表す。
- source_word: כִּי
  choice: …からである
  rationale: 安息日がしるしである根拠を導く因果関係を明示した。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日の間に
  rationale: 創造が行われた時間枠を日本語として自然に表した。
- source_word: עָשָׂה
  choice: 造り
  rationale: 天と地に対する神の創造行為を文脈に即して表した。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で神名を敬虔に示す定着した表記を採用し、原文の固有名であることを脚注で明示した。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天と地
  rationale: 被造世界全体を指すヘブライ語の対句を、日本語の定着した表現で訳した。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 七日目には
  rationale: 時間的な推移を自然に示し、「には」により前六日との対照も過度に強めず表した。
- source_word: שָׁבַת
  choice: その働きをやめ
  rationale: 動詞の基本義である『やむ、やめる』を保ち、何をやめたかを文脈上明らかにした。
- source_word: וַיִּנָּפַשׁ
  choice: 息をつかれた
  rationale: 『息をつく』という生き生きした擬人的表現を保持しつつ、現代日本語として理解できる形にした。
theological_decisions:
- issue: 安息日の表現における神の擬人化
  choice: その働きをやめ、息をつかれた
  alternative: 休み、元気を取り戻された
  rationale: שָׁבַת の『やめる』という意味と、וַיִּנָּפַשׁ の身体的で鮮明な比喩をともに残し、神の疲労を否定するために原文を抽象化しなかった。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性形を用いた家族的・代表的表現を本文に保持し、自然な集合名称を脚注に掲げた。
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で『ヤハウェ』）
  alternative: 本文でヤハウェ
  rationale: 日本語で定着した敬称を本文に用いながら、原文が普通名詞ではなく固有の神名であることを脚注で透明に示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の簡潔な宣言調を保ち、擬人的表現を説明的に弱めず本文に残した。
