lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: 加工／彫刻
  rationale: 同じ語が石と木について繰り返されている。素材に応じて「石の加工」「木の彫刻」と訳し、熟練した具体的な作業を自然な日本語で示した。
- source_word: אֶבֶן
  choice: 石
  rationale: 原語は石を表す一般的な語であり、宝石に限定していないため「石」とした。幕屋製作の文脈では宝石を含む可能性があることを脚注で示す。
- source_word: לְמַלֹּאת
  choice: はめ込むための
  rationale: 職人作業の文脈では、石を台座などにはめ込むことを指す。「満たす」という逐語訳よりも、この文脈での作業内容を明確に伝える。
- source_word: עֵץ
  choice: 木
  rationale: 加工材料を表す一般的な語として、現代日本語で自然な「木」を用いた。
- source_word: לַעֲשׂוֹת
  choice: 行う
  rationale: עשהの広い意味を保ちつつ、「工芸を行う」という自然で格調のある日本語にした。
- source_word: בְּכָל־מְלָאכָה
  choice: あらゆる工芸
  rationale: 文脈は熟練を要する製作作業であるため、「仕事」だけでなく職人的な意味を伝える「工芸」とした。「あらゆる」によって原文の包括性を保った。
