  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では神の名を表す四文字YHWH。伝統的に「主」と訳される。一般に「ヤハウェ」と読まれるが、古代の正確な発音は確定していない。
    reason: 原文の固有神名YHWHを示し、伝統的な訳し方と発音上の不確かさを説明するため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: 物語を進める接続形であり、神がモーセに言葉を語る定型表現。日本語では後続する発言内容を自然に導く「告げた」とした。
- source_word: יְהוָה
  choice: 主
  rationale: 神名を表す四文字語。日本語聖書で広く定着した敬称「主」を本文に用い、原文が固有の神名YHWHであることを脚注で明示する。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: אֶלはここで発話の相手を示す。固有名מֹשֶׁהは日本語で定着した「モーセ」とした。
- source_word: לֵאמֹר
  choice: （「告げた」に統合）
  rationale: 後続する直接話法を導く定型句。日本語では「言って言った」のような重複を避け、「告げた」に機能を統合した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文は「主」、脚注で「ヘブライ語ではYHWH（ヤハウェ）」と説明
  alternative: 本文で「ヤハウェ」
  rationale: 原文が称号ではなく固有の神名を用いる点を脚注で保持しつつ、明瞭で格調ある現代日本語と日本語読者への通用性を考慮した。発音の復元には一定の不確かさがあるため、それも脚注で示す。
translation_notes:
  register: 簡潔で格調のある現代標準日本語。ヘブライ語の発話導入句を日本語として自然な一文に整えた。
