source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: ja
  text: 六日の間は仕事をしてよい。しかし七日目は安息日、すなわちヤハウェのために聖別された完全な休みの日である。安息日に仕事をする者はだれでも、必ず死刑に処せられる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: 仕事をしてよい
  rationale: 受動形を直訳すれば「仕事がなされる」となるが、律法的文脈で許容を表す自然な現代日本語とした。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: しかし七日目は
  rationale: 接続詞וは「そして」とも訳せるが、六日間との対比を日本語で明瞭に示した。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全な安息の安息日
  rationale: שַׁבָּתוֹןによる休止・安息の強調を保ちつつ、שַׁבַּתを「安息日」として明示した。
- source_word: קֹדֶשׁ לַיהוָה
  choice: ヤハウェのために聖別された
  rationale: קֹדֶשׁの聖なる状態と、לַיהוָהが示す献身・帰属を自然な日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号への置換を避け、本文にある神の固有名を音写した。
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: 仕事をする者はだれでも
  rationale: כָּלと分詞による一般的・包括的な法的対象を表した。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 安息日に
  rationale: 日本語の「安息日」自体が日を表すため、冗長な「安息日の日に」を避けた。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形による強意と、ホファル形の処刑されるという受動的・法的意味をともに保持した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: シナイ契約の文脈に現れる固有名を、称号に置き換えず表記した。
- issue: שַׁבַּת שַׁבָּתוֹןの強さ
  choice: 完全な安息の安息日
  alternative: 厳かな休みの安息日、全き休み
  rationale: 後代の教派的理解を持ち込まず、ヘブライ語の重ねによる休止の強調を保持した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。法的な厳しさを保ちつつ、不要な古語は避けた。「聖別された」はקֹדֶשׁ לַיהוָהの献身・帰属を自然に示す。
