source:
  edition: WLC
  text: וְ/אֶת הַ/שֻּׁלְחָן֙ וְ/אֶת כֵּלָ֔י/ו וְ/אֶת הַ/מְּנֹרָ֥ה הַ/טְּהֹרָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: ja
  text: また、机とその器具、清い[b]燭台[a]とそのすべての器具、香の祭壇[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メノラー」。ヘブライ語は聖所の灯火を載せる台を指す。本文では音写せず、普通名詞として「燭台」と訳した。
    reason: lexical_alternative
  - marker: b
    text: 「清い」は儀礼的な清さを指す可能性があり、この幕屋の文脈では、関連箇所に記される燭台の純金という材質も響かせていると思われる。
    reason: cultural_note
  - marker: c
    text: 別訳「香をたく祭壇」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 通常「机」を意味する語であり、この節では供えのパンの机という詳しい名称を補わず、原文どおり簡潔に訳した。
- source_word: כֵּלָיו
  choice: その器具
  rationale: כְּלִי は器、道具、用具などを広く指す。ここでは聖所で机に付属して用いる品々を自然に表す「器具」とした。
- source_word: הַמְּנֹרָה
  choice: 燭台
  rationale: 灯火を載せる台を指す普通名詞なので、音写の「メノラー」ではなく、意味を明確に伝える「燭台」とした。
- source_word: הַטְּהֹרָה
  choice: 清い
  rationale: טָהוֹר の清浄・純粋という意味を保ち、聖所の文脈にふさわしい表現とした。儀礼的な清さと材質の純良さの響きを一方に限定しない。
- source_word: כָּל כֵּלֶיהָ
  choice: そのすべての器具
  rationale: כָּל の全体性を明示し、燭台に付属する品々を「器具」と訳した。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香の祭壇
  rationale: 「香」と「祭壇」の連語を簡潔に保ち、香をたくための祭壇を指す表現とした。
- source_word: וְאֶת
  choice: また（列挙は読点で接続）
  rationale: 対格標識 אֵת は訳語を立てず、וְ による列挙の継続を冒頭の「また」と読点によって日本語として自然に示した。
theological_decisions:
- issue: הַטְּהֹרָה が表す「清さ」の性格
  choice: 本文では「清い」とし、意味を限定しない
  alternative: 「純金の」または「儀礼的に清い」と明示する
  rationale: この形容詞自体は「清い／純粋な」を意味し、幕屋の文脈では儀礼的清浄と純金製であることの双方を響かせうる。本文でどちらか一方に解消せず、注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後に続く備品一覧の一部であるため、原文の列挙構造を簡潔な名詞句で再現した。「器具」を反復して机と燭台それぞれの付属品であることを明確にした。
