  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: ja
  text: また、精巧に織られた衣服[a]、祭司アロンのための聖なる衣服、および祭司として仕えるための彼の息子たちの衣服、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「奉仕のための衣服」「務めの衣服」「織られた衣服」。ヘブライ語の表現は意味の確定が難しく、衣服の作り方を強調するとも、幕屋での奉仕という用途を強調するとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: 精巧に織られた衣服
  rationale: בִּגְדֵי は「衣服」。意味の確定が難しい הַשְּׂרָד は、ここでは特別な織りや仕立てを施した衣服を指す可能性を本文に反映し、奉仕用の衣服を指す可能性は脚注に残した。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 聖なる衣服
  rationale: 「聖性の衣服／聖なる衣服」という構造を直接的かつ自然な日本語で表した。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンのための
  rationale: לְ の割り当て・用途を「ための」で表し、同格の称号 הַכֹּהֵן は日本語として自然な「祭司アロン」とした。
- source_word: בִּגְדֵי בָנָיו
  choice: 彼の息子たちの衣服
  rationale: 三人称男性単数接尾辞がアロンを指すことを明示しつつ、原文の所有関係を保った。
- source_word: לְכַהֵן
  choice: 祭司として仕えるための
  rationale: כהן の不定詞が表す、祭司の務めを果たすという職務的意味を、現代日本語で明瞭に表した。
- source_word: וְאֵת / וְאֶת
  choice: また／および
  rationale: 目的語標識 אֵת 自体は訳さず、接続詞 וְ を訳して前節から続く列挙構造を保った。
