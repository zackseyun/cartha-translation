  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: ja
  text: 私たちがエジプトであなたに言ったのは、このことではありませんか。『私たちに構わないで、エジプト人に仕えさせてください』と。荒野で死ぬより、エジプト人に仕えるほうが、私たちにはよかったのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַל מִמֶּנּוּ
  choice: 私たちに構わないで
  rationale: 直訳的には「私たちから手を引いて」。文脈上、モーセに介入をやめるよう求める自然な現代日本語とした。
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: エジプト人に仕えさせてください
  rationale: עבד はここでは隷属して労役することを指す。「エジプト」は住民・支配者を表す換喩なので、日本語では「エジプト人」とした。接続形は先行する要求の目的・帰結として表現した。
- source_word: כִּי טוֹב לָנוּ עֲבֹד אֶת־מִצְרַיִם
  choice: エジプト人に仕えるほうが、私たちにはよかったのです
  rationale: 比較構文を自然な日本語で示した。現在の逃亡状況から過去の選択を振り返る反実的な含みを「よかった」で保った。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: 出エジプト記の地理的・神学的文脈に定着した訳語「荒野」を採用した。
theological_decisions:
- issue: 民の発言の反実的な含み
  choice: 「仕えるほうが、私たちにはよかったのです」
  alternative: 「仕えるほうが、私たちにはよい」
  rationale: ヘブライ語には明示的な反実仮定の標識はないが、すでにエジプトを出た状況で過去の選択を比較しているため、日本語では過去形が自然。ただし解釈を強めすぎる「仕えていたほうがよかった」は避けた。
translation_notes:
  register: 民がモーセを責める切迫した口調を保ちつつ、現代の一般読者に明瞭で、過度に口語的にならない表現とした。
