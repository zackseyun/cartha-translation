  text: וַ/יְדַבֵּ֥ר יְהֹוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: それから、ヤハウェ[a]はモーセに次のように告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の名を表す四文字 יהוה（YHWH）。伝統的に「主」と訳されることがあり、音写には「エホバ」もある。
    reason: 神名の読みと訳し方に複数の伝統があるため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから…語って
  rationale: 接続法ワウを伴う形が物語を次の出来事へ進めるため、「それから」で順次性を示した。דבר はここで正式な神の発言を導くので、「語る」とした。
- source_word: יְהֹוָה
  choice: ヤハウェ
  rationale: 子音字 יהוה が示す神の固有名を音写した。日本語で広く見られる「主」とする伝統的表現は脚注で示す。
- source_word: אֶל
  choice: …に
  rationale: 発話の相手を示す前置詞として、自然な現代日本語の助詞「に」で表した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する発言内容を導く定型句。日本語では「語って言われた」とすることで原文の דבר と אמר の二重構造を保ちつつ、文を自然に次節へつないだ。
theological_decisions:
- issue: 神名 יהוה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が四文字神名を直接用いているため、固有名として「ヤハウェ」とした。母音の復元には不確実性があり、朗読上の伝統的代読「主」もあるため、その点を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の物語的な順次性と「語る／言う」の定型構造を残した。脚注記号[a]は神名「ヤハウェ」の直後に置くのが意味上は明確だが、提示された英語本文の配置に合わせる必要はなく、日本語本文では現状「語って」に付いてしまうため、出版時には「ヤハウェ[a]」へ移すことが望ましい。
