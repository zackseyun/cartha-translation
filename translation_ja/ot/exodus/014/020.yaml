source:
  edition: WLC
  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: ja
  text: それはエジプトの陣営とイスラエルの陣営との間に入り、雲と闇があった。だが、夜を照らした。[a] 一方の陣営は他方の陣営に、一晩中近づかなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「雲と闇があり、夜に光を与えた」。ヘブライ語は簡潔で、闇と光が二つの陣営にそれぞれどう関係したのかについて、古代訳や諸翻訳の理解は異なる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: それは……間に入り
  rationale: 直前の文脈には神の使いと雲の柱の双方があり、男性単数動詞の指示対象は一義的ではない。「それ」で曖昧さを保ちつつ、位置を移して両陣営の間に入った動きを自然な日本語で表した。
- source_word: בֵּין ... וּבֵין
  choice: ……と……との間に
  rationale: 二者の間という標準的な空間関係を、明瞭で自然な日本語にした。
- source_word: מַחֲנֵה מִצְרַיִם / מַחֲנֵה יִשְׂרָאֵל
  choice: エジプトの陣営／イスラエルの陣営
  rationale: 「陣営」は、軍勢と宿営地の両方を含み得る מַחֲנֶה の意味に適し、固有名詞を用いる原文の形も保つ。
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: 雲と闇
  rationale: 定冠詞付きの二つの名詞を簡潔に並置し、原文の緊張感ある表現を保った。日本語では既知性が文脈から明らかなため「その」を重ねなかった。
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: 夜を照らした
  rationale: אור の使役・発光の意味と、אֶת によって「夜」が直接目的語である構文を反映した。「が」により、直前の闇との対照を自然に示した。
- source_word: זֶה אֶל־זֶה
  choice: 一方の陣営は他方の陣営に
  rationale: 二つの陣営が互いに接近しなかったことを明確にするため、指示語をそのまま訳すより指示対象を補った。
- source_word: כָּל־הַלָּיְלָה
  choice: 一晩中
  rationale: 夜の全期間を表す慣用的で明瞭な訳。
theological_decisions:
- issue: 男性単数動詞 וַיָּבֹא と וַיָּאֶר の指示対象
  choice: 冒頭を「それは」とし、照明動詞では主語を明示しない
  alternative: 「神の使いが」または「雲の柱が」と明示する
  rationale: 直前の文脈には神の使いと雲の柱がともに登場するため、原文が許す指示対象の曖昧さを教義的に解消しない。日本語の主語省略も利用して曖昧さを保った。
- issue: 雲・闇・光が両陣営にどう関係したか
  choice: 「雲と闇があったが、夜を照らした」と本文に置き、解釈上の不確かさを脚注で示す
  alternative: 一方の側を暗くし、他方の側を照らしたと明示する
  rationale: ヘブライ語は簡潔で、どの現象がどちらの陣営に及んだかを明示していない。古代訳にも差があるため、本文に配分関係を補わなかった。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で格調を保った叙事文体。「宿営」より意味の広い「陣営」を用い、原文の反復と対照を可能な限り保持した。
