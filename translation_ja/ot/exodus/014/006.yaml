  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: ja
  text: そこでファラオは自分の戦車を用意し[a]、自分の民を連れて行った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の戦車を整え」。ヘブライ語の動詞は文字どおりには「縛る、つなぐ」という意味で、ここでは戦車を出発できるように整えることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「自分の民」は、ファラオに同行した部隊を指すと考えられるが、ヘブライ語は「軍隊」とは明記せず、「彼の民」としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: 用意し
  rationale: אסרは本来「縛る、つなぐ」を意味するが、戦車について用いられるここでは、馬具などを取り付けて出発できるようにすることを表す。本文では自然な現代日本語として「用意し」とし、具体的な語義は脚注に残した。
- source_word: רִכְבּוֹ
  choice: 自分の戦車
  rationale: 単数形に三人称男性単数の接尾辞が付いており、ここではファラオ自身の戦車を指すのが最も自然である。「戦車隊」と広く解さず、単数を保った。
- source_word: עַמּוֹ
  choice: 自分の民
  rationale: עםの基本義である「民」を保った。文脈上はファラオに同行する兵力を指す可能性が高いが、原文は「軍隊」と明記していないため、限定しすぎない訳とした。
- source_word: לָקַח עִמּוֹ
  choice: 伴って行った
  rationale: 直訳的には「彼と共に連れて行った」。日本語では「伴って行った」が簡潔で自然であり、同行させた意味を明確に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。主語は文脈上の指示対象を明確にするため「彼」ではなく「ファラオ」とした。「用意し」は具体性がやや弱いため、原語の字義と別訳を脚注で補った。
