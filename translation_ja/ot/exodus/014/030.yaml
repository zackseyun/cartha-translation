id: EXO.14.30
reference: Exodus 14:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: ja
  text: こうしてその日、ヤハウェはイスラエルをエジプトの手から[a]救った。イスラエルは、海辺で死んでいるエジプト人を見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「エジプトの手から」。「手」はここではエジプトの力や支配を表す。
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: 救った
  rationale: ישׁעのヒフィル形は、危機と支配から救い出すヤハウェの行為を表す。「救った」は、神による救出という意味を保ちつつ、現代日本語として明快である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名יהוהを日本語で音写した。
- source_word: בַּיּוֹם הַהוּא
  choice: その日
  rationale: 出来事の時を示す自然で簡潔な表現。前置詞בְּの意味も日本語の時間表現に含まれる。
- source_word: מִיַּד מִצְרָיִם
  choice: エジプトの手から
  rationale: 「手」は支配力・掌握を表すヘブライ語の比喩である。本文では比喩を残し、注で意味を明らかにした。מִצְרַיִםはここでは国家的な勢力としてのエジプトを指す。
- source_word: וַיַּרְא
  choice: 見た
  rationale: 物語文脈におけるראהの直接的で自然な訳。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 後半では死者として目に映った人々を指すため、国名の「エジプト」ではなく「エジプト人」とした。
- source_word: מֵת
  choice: 死んでいる
  rationale: 集合的にエジプト人の状態を述べる語。「死体」と名詞化せず、原文の述語的な性格を保った。
- source_word: עַל שְׂפַת הַיָּם
  choice: 海辺で
  rationale: 字義的には「海の縁（唇）の上に」。死んでいるエジプト人が見えた場所を、自然な現代日本語で表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文は称号ではなく四文字神名を明記しているため、その固有名としての性格を保つ音写を採用した。
- issue: 救いの主体
  choice: ヤハウェは……救った
  alternative: 受動表現「イスラエルは救われた」
  rationale: 原文はヤハウェを明示的な主語としており、救出の主体が神であることをそのまま示した。
translation_notes:
  register: 明快で格調を失わない現代標準日本語を用いた。「こうして」で物語上の帰結を示し、「エジプトの手」という原文の比喩は本文に保持して注記した。後半は簡潔な目撃描写として訳した。
