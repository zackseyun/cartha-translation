  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: ja
  text: イスラエルは、ヤハウェがエジプトに対して示された大いなる御手を見た。[a] 民はヤハウェを恐れ、ヤハウェとそのしもべモーセを信じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大いなる御手」は、ヤハウェの大きな力を表す言い方。「エジプトに対して」は、「エジプトで」または「エジプトに」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יִשְׂרָאֵל
  choice: イスラエルは……見た
  rationale: 集合体としての単数形「イスラエル」と、直前の出来事を目の当たりにしたことを表す ראה の基本的意味を保った。
- source_word: הַיָּד הַגְּדֹלָה
  choice: その大いなる御手
  rationale: 神の力を示す「手」という出エジプト記の反復的な比喩を保持しつつ、神についての尊敬を自然な日本語の「御手」で表した。גְּדֹלָה は「大いなる」とした。
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: ヤハウェがエジプトに対して振るわれた
  rationale: 字義どおりには「ヤハウェがエジプトに／対して行った」だが、日本語では「御手」と自然につながるよう「振るわれた」とした。前置詞 בְ の「エジプトで」「エジプトに対して」という幅は脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で示した。
- source_word: וַיִּירְאוּ הָעָם אֶת יְהוָה
  choice: 民はヤハウェを恐れ
  rationale: ירא の「恐れる」を直接訳し、畏敬を含み得る意味の広がりを狭めなかった。
- source_word: וַיַּאֲמִינוּ בַּיהוָה וּבְמֹשֶׁה
  choice: ヤハウェと、そのしもべモーセを信じた
  rationale: אמן のヒフィル形と בְ の組み合わせが示す信頼・信仰を「信じた」と訳した。日本語では「ヤハウェと……モーセを信じた」が自然であり、両者への同一の前置詞構造も反映する。
- source_word: עַבְדּוֹ
  choice: そのしもべ
  rationale: 接尾辞がヤハウェを指し、モーセがヤハウェに従属する奉仕者であることを示す。「僕」より読み違えにくい平仮名表記とした。
theological_decisions:
- issue: イスラエルがモーセを信じたことの意味
  choice: 民はヤハウェと、ヤハウェのしもべであるモーセを信じた
  alternative: ヤハウェを信頼し、さらにモーセ個人も信頼した／ヤハウェとモーセの言葉を信じた
  rationale: 原文はヤハウェとモーセの双方に אמן＋בְ を用いる一方、「そのしもべ」によってモーセの従属的立場を明示する。訳文はこの緊張をそのまま保ち、両者を同格とも、単に両者の言葉を信じたとも限定しない。
- issue: 民がヤハウェを「恐れた」ことの性質
  choice: 恐れ
  alternative: 畏れ敬った／畏敬の念を抱いた
  rationale: 文脈上は畏敬を含むが、ירא の持つ恐怖と崇敬の幅を「恐れ」で保持し、一方だけに限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「大いなる御手」で原文の比喩を残し、「恐れ」「信じた」は神学的な意味の幅を保持した。脚注標識 [a] は本文中に配置した。
