source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: ja
  text: モーセは民に言った。「恐れてはならない。しっかり立って、今日、主があなたがたのために行われる救いを見なさい。今日あなたがたが見ているエジプト人を、あなたがたはもう二度と見ることがない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: 恐れてはならない
  rationale: 否定命令を、威厳を保ちつつ現代日本語として明瞭に表した。
- source_word: הִתְיַצְבוּ
  choice: しっかり立って
  rationale: 物理的にその場に立つことと、動揺せず踏みとどまることの両方を含みうる語感を保った。
- source_word: יְשׁוּעַת יְהוָה
  choice: 主が…行われる救い
  rationale: 神名は日本語聖書で広く通用する「主」とし、属格の救済主体を後続の動詞と自然に結びつけた。
- source_word: עַד עוֹלָם
  choice: もう二度と…ない
  rationale: この文脈での永続的否定を自然な日本語で表し、「今後決して見ない」という意味を明確にした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名である点を踏まえつつ、日本語の公的・典礼的な聖書文体で広く理解される表記を採用した。特定の教派的読みを付加していない。
- issue: 「救い」の主体と民の役割
  choice: 主があなたがたのために行われる救いを見なさい
  alternative: 主の救いを見なさい。それを主は今日あなたがたのために行われる
  rationale: 原文どおり主を救出の主体として示し、民には恐れず立って見るよう命じられているという緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の力強さと物語の荘重さを保った。「エジプト」は国ではなく追撃する人々を指すため、「エジプト人」とした。
