  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: ja
  text: ファラオが近づいて来ると、イスラエルの人々[b]は目を上げた。すると、エジプト軍[a]が彼らの後を進んで来ていた。彼らは非常に恐れ、イスラエルの人々はヤハウェに叫んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は国名の「エジプト」。ここでは、彼らを追って来るエジプトの軍勢を集合的に指す。
    reason: lexical_alternative
  - marker: b
    text: 原文は字義的には「イスラエルの子ら」。ここではイスラエルの民全体を指す。別訳「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: 近づいて来た
  rationale: קרבのヒフィル形だが、ここではファラオを主語とする自動詞的な意味で、追撃軍が間近に迫る動きを表す。
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: 目を上げた
  rationale: 見るために目を上げるというヘブライ語の慣用表現を、自然な日本語で簡潔に再現した。
- source_word: וְהִנֵּה
  choice: すると、なんと
  rationale: 突然目に入った光景と物語上の緊迫感を示す談話標識の働きを、現代日本語で伝える。
- source_word: מִצְרַיִם
  choice: エジプト
  rationale: 原文の国名を保持しつつ、文脈では追撃するエジプト軍を集合的に指すことを脚注で明示した。
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: 彼らの後を進軍して来ていた
  rationale: נסעの移動するという語義を保ち、軍事的追撃の文脈に即して「進軍」とした。「追いつこうとしていた」など結果を先取りする表現は避けた。
- source_word: וַיִּירְאוּ מְאֹד
  choice: 非常に恐れ
  rationale: 動詞と強意語מְאֹדの強い恐怖を、明快で自然な日本語にした。
- source_word: וַיִּצְעֲקוּ
  choice: 叫んだ
  rationale: 危機の中で助けを求める切迫した叫びを表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文に記された神の固有名を音写した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の字義的な形と民族全体を指す慣用的な用法の双方を保った。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写した。
- issue: בְנֵי יִשְׂרָאֵלの集合的・性別表現
  choice: イスラエルの子ら
  alternative: イスラエル人たち
  rationale: 標準的な民族呼称としての集合的意味を認めながら、「子ら」という原文の形を本文に残した。
- issue: מִצְרַיִםが指す範囲
  choice: 本文では「エジプト」、脚注で追撃軍を指すと説明
  alternative: エジプト人たち／エジプト軍
  rationale: 国名によって軍勢を集合的に表す原文の換喩を保持し、読者の誤解は脚注で防いだ。
translation_notes:
  register: 明快な現代標準語を基調としつつ、「すると、なんと」でהִנֵּהの突然性と緊迫感を表した。「イスラエルの子ら」と神名「ヤハウェ」は原文の語形を意識した格調ある表現として保持した。
