language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: ja
  text: 水は元に戻り、戦車と騎兵[a]、すなわち彼らを追って海に入ったファラオの全軍を覆った。そのうち一人も残らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「馬に乗る者たち」。
    reason: הַפָּרָשִׁיםは軍事的な集合名詞「騎兵」とも、より字義的に「馬に乗る者たち」とも訳せるため。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: 水は元に戻り
  rationale: שׁובは、分けられていた水が以前の状態に戻ることを表す。「元に戻り」はその動きを明確かつ自然に伝える。
- source_word: וַיְכַסּוּ
  choice: 覆った
  rationale: כסהの基本義を保ち、「のみ込んだ」などの説明的な意味を加えない。
- source_word: הָרֶכֶב
  choice: 戦車
  rationale: 単数形だが集合的に戦車部隊を指す。日本語では文脈上「戦車」で自然に集合を表せる。
- source_word: הַפָּרָשִׁים
  choice: 騎兵
  rationale: 馬に乗って戦う者たちを表す簡潔で現代的な軍事用語。字義に近い別訳は脚注に示す。
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: ファラオの全軍
  rationale: חֵילの軍事的意味と、כֹלによる全体性を簡潔に保持する。
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: 彼らを追って海に入った
  rationale: 分詞を物語の時間関係に合う連体節として訳し、追跡して海へ入った動きを示す。代名詞「彼ら」を保ち、文脈上の指示対象を訳文で過度に補わない。
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: そのうち一人も残らなかった
  rationale: 一人に至るまで残らなかったというヘブライ語の強い全否定を、自然な日本語で表す。
theological_decisions:
- issue: 滅ぼされたファラオ軍の範囲
  choice: 一人も残らなかったという全滅の表現を、イスラエルを追って海に入ったファラオ軍に限定して訳す。
  alternative: エジプトの全兵力が例外なく滅ぼされたと広く解する。
  rationale: 関係節「彼らを追って海に入った」が「ファラオの全軍」を限定しているため、本文の強い全体性は保ちつつ、その範囲を本文が明示する追撃部隊より広げない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」によって「戦車と騎兵」と「ファラオの全軍」の同格関係を示し、原文の範囲を明確にした。
