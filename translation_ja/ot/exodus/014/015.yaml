id: EXO.14.15
reference: Exodus 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: ja
  text: すると、ヤハウェはモーセに言われた。「なぜわたしに叫んでいるのか。イスラエルの子らに、出発するよう[a]告げなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「前進するよう」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、…言われた
  rationale: 物語を前へ進めるワウ継続法の順接を、現代日本語の自然な叙述で表した。神を主語とするため敬語形を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を一般的な日本語表記で音写した。
- source_word: מַה תִּצְעַק אֵלָי
  choice: なぜあなたはわたしに向かって叫んでいるのか
  rationale: מַה と動詞による理由を問う表現を「なぜ」とし、צעק の切迫した叫びの意味と、現在の状況に対する直接的な問いを保った。
- source_word: דַּבֵּר אֶל
  choice: …に、…よう告げなさい
  rationale: 命令形の指示性を保ちつつ、「命じなさい」と過度に強めず、目的内容を伴う自然な日本語にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現と契約共同体の呼称を保った。「イスラエル人たち」という慣用的な理解も可能だが、原文の形を本文に残した。
- source_word: וְיִסָּעוּ
  choice: 出発する
  rationale: נסע は旅立つ、進み始めることを表す。直前まで宿営していた文脈にも合う簡潔な訳とし、「前進する」の可能性は脚注に示した。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有の神名を称号に置換せず音写し、原文にある契約の神の名を明示した。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的意味
  choice: イスラエルの子ら
  alternative: イスラエル人たち
  rationale: 原文の男性複数・親族的表現を保つ一方、この句が民族共同体全体を指すことを否定しない訳とした。
- issue: 神の問いの語調
  choice: なぜあなたは…叫んでいるのか
  alternative: どうして…叫ぶのか
  rationale: 叱責、促し、問いのいずれか一つに限定せず、原文の簡潔で緊迫した疑問の形を維持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。神名は「ヤハウェ」、神の発話導入は敬語とし、発話そのものは原文の直接性と緊迫感を保った。脚注記号[a]は該当する「出発するよう」の直後に置くことも可能だが、日本語の引用文全体への注として文末に配置した。
