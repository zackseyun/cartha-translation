  text: וַ/יָּ֗סַר אֵ֚ת אֹפַ֣ן מַרְכְּבֹתָ֔י/ו וַֽ/יְנַהֲגֵ֖/הוּ בִּ/כְבֵדֻ֑ת וַ/יֹּ֣אמֶר מִצְרַ֗יִם אָנ֨וּסָה֙ מִ/פְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֣י יְהוָ֔ה נִלְחָ֥ם לָ/הֶ֖ם בְּ/מִצְרָֽיִםפ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: ja
  text: 主は戦車の車輪を外し[a]、戦車の進行を困難にされた。そこでエジプト人は言った。「イスラエルの前から逃げよう。主が彼らのためにエジプトと戦っておられるからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外し」は、七十人訳などでは戦車の動きを妨げたという意味にも理解される。ヘブライ語本文の「彼の戦車」は、文脈上エジプト軍の戦車を指すと理解される。
    reason: 車輪に起きたことについて古代訳による理解の差があり、所有を表すヘブライ語の単数接尾辞も文脈上はエジプト軍を指すと解されるため。
lexical_decisions:
- source_word: וַיָּסַר
  choice: 外し
  rationale: 基本義は「取り除く、外す」。主語は直前の文脈に基づき「主」と明示した。
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: 戦車の車輪
  rationale: 単数形「車輪」は集合的に用いられていると理解した。接尾辞は文法上「彼の」だが、指示対象に曖昧さがあるため日本語本文では所有者を明示しない。
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: 進みにくくされた
  rationale: 直訳的には「それを重苦しく進ませた」。戦車の走行が困難になった結果を自然な日本語で表した。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 地名「エジプト」が軍勢を集合的に指す換喩であり、日本語では発言主体を自然に示した。
- source_word: אָנוסָה
  choice: 逃げよう
  rationale: 単数形の勧奨法だが、集合体としてのエジプト軍の発言。日本語の「逃げよう」は単複を確定せず、原文の形式と文脈上の集合性の緊張を保てる。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く理解される「主」とした。
theological_decisions:
- issue: 戦車を妨げた行為者
  choice: 「主」を主語として明示
  alternative: 代名詞的に「彼は」とする
  rationale: 直前節から主が行為者であることは明白であり、現代日本語では明示する方が自然で、神の介入という本文の主張も保持される。
- issue: 「彼らのために」の含意
  choice: 「彼らのために」
  alternative: 「彼らに代わって」
  rationale: לָהֶם は利益・味方を示すが、代理性まで一義的に限定せず、原文の幅を残した。
translation_notes:
  register: 明快な現代標準日本語を用い、叙事の緊迫感とエジプト軍の直接話法を簡潔に保った。「主」は神名を示す表記として用いた。
