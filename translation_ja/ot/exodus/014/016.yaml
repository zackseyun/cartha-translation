source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: ja
  text: しかし、あなたは杖を高く上げ、海の上に手を伸ばして、海を裂け。そうすれば、イスラエルの子ら[a]は海のただ中へ、乾いた地の上を進んで行く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イスラエルの息子たち」。ここでは「イスラエル人」または「イスラエルの民」全体を指す。
    reason: 原文の男性複数形と、文脈上の包括的な指示対象の両方を明確にするため。
lexical_decisions:
- source_word: וְאַתָּה
  choice: しかし、あなたは
  rationale: 接続詞と独立代名詞による対照的な強調を、直前に民へ命じられた行動とモーセ自身の行動との対比として表した。
- source_word: הָרֵם אֶת־מַטְּךָ
  choice: 杖を高く上げ
  rationale: רום のヒフィル命令形が示す、杖を持ち上げる具体的な動作を、自然な現代日本語で表した。
- source_word: וּנְטֵה אֶת־יָדְךָ עַל־הַיָּם
  choice: 海の上に手を伸ばして
  rationale: נטה と יָד の身体的な動作、および עַל が示す海に対する位置関係を明確に保った。
- source_word: וּבְקָעֵהוּ
  choice: 海を裂け
  rationale: בקע の「割る、裂く」という強い物理的意味を保ち、目的語を日本語で明示した。
- source_word: וְיָבֹאוּ
  choice: そうすれば……入って行く
  rationale: 命令に続く未完了形を、その行為の結果として自然に表した。目的とも結果とも取り得る連なりを過度に限定していない。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の「イスラエルの息子たち」という形を簡潔に反映しつつ、文脈上はイスラエルの民全体を指すことを脚注で示した。
- source_word: בְּתוֹךְ הַיָּם בַּיַּבָּשָׁה
  choice: 乾いた地を進み、海のただ中へ
  rationale: 「海の内部」と「乾いた地」という二つの空間的要素を保持し、日本語として理解しやすい順序に整えた。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の集団的指示と男性複数形
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の系譜的表現を本文に残した。ただし、文脈では成人男性だけでなく契約共同体全体を指すため、その範囲を脚注で明らかにした。
- issue: וְיָבֹאוּ が示す目的または結果
  choice: そうすれば……入って行く
  alternative: ……入って行くためである／……入って行くことができるように
  rationale: ヘブライ語の連続を結果として自然に示しつつ、能力や明示的な目的という意味を原文以上に加えないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の命令としての簡潔さと荘重さを保った。「裂け」は強い命令形だが、原文の命令の直接性に対応する。
