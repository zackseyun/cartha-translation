- from: しかし、あなたは杖を高く上げ、海の上に手を伸ばして、海を裂け。そうすれば、イスラエルの子ら[a]は乾いた地を進み、海のただ中へ入って行く。
  to: しかし、あなたは杖を高く上げ、海の上に手を伸ばして、海を裂け。そうすれば、イスラエルの子ら[a]は海のただ中へ、乾いた地の上を進んで行く。
