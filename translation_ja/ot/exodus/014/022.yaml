base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: ja
  text: イスラエルの子ら[a]は、乾いた地面の上を通って、海のただ中に入った。水は彼らの右にも左にも壁となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。ヘブライ語では字義どおりには「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 入った
  rationale: בוא の方向性を簡潔に表し、海の中へ移動したことが現代日本語で自然に伝わる。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの父祖名に基づく集団呼称を保つ。「イスラエル人」は自然な代案として脚注に示す。
- source_word: בְּתוֹךְ הַיָּם
  choice: 海のただ中に
  rationale: תּוֹךְ の「内部、ただ中」という空間的意味を保ち、単に海を渡ったとの意訳にはしない。
- source_word: בַּיַּבָּשָׁה
  choice: 乾いた地面を通って
  rationale: 水と対照される乾いた地面を表す。日本語では移動経路を示す「を通って」とすることで、海中の乾いた地面の上を進んだ情景を自然に表現する。
- source_word: וְהַמַּיִם
  choice: 水は
  rationale: ヘブライ語では形態上複数だが、日本語の「水」は通常、数を示さない集合的な名詞として自然である。
- source_word: חֹמָה
  choice: 壁
  rationale: 比較辞を補わず、原文どおり水が彼らにとって「壁」となったという直接的で鮮明な表現を保つ。
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: 彼らの右にも左にも
  rationale: 左右両側に水があったという対称的な位置関係を、簡潔で自然な日本語にする。
