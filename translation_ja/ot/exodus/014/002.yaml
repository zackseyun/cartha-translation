revisions:
- from: イスラエルの人々[a]に告げなさい。彼らは引き返して、ミグドルと海との間にあるピ・ハヒロテの前に宿営しなければならない。バアル・ツェフォンの前、その向かい[c]の海辺に宿営しなさい[b]。
  to: イスラエルの人々[a]に告げなさい。彼らは引き返し、ピ・ハヒロテの前、ミグドルと海との間に宿営しなければならない。バアル・ツェフォンの前、その向かい[c]、海辺に宿営しなさい[b]。
  rationale: 宿営地にかかる二つの位置指定を、地名や「海辺」への連体修飾ではなく、原文どおり「宿営する」行為にかかる並列の位置句として表した。命令・指示の流れ、地名、照応の不確定さを保持した。
