  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: ja
  text: イスラエルの人々[a]に告げなさい。彼らは引き返し、ピ・ハヒロテの前、ミグドルと海との間に宿営しなければならない。バアル・ツェフォンの前、その向かい[c]、海辺に宿営しなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの息子たち」。ここではイスラエル人全体を指す。
    reason: lexical_alternative
  - marker: b
    text: ピ・ハヒロテ、ミグドル、バアル・ツェフォンはいずれも地名として音写した。
    reason: cultural_note
  - marker: c
    text: 「その向かい」の「その」は、文脈上、バアル・ツェフォンを指す可能性が高い。あるいは「それに面して」。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: に告げなさい
  rationale: 命令形の直接性を保ちつつ、現代日本語で自然な伝達命令とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義は「イスラエルの息子たち」だが、民族共同体全体を指すため、性別を不必要に限定せず自然に表した。字義的表現は脚注に示した。
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: 彼らは引き返して…宿営しなければならない
  rationale: 命令に続く指示的な未完了形の力を表し、進路を逆にする意味の「引き返す」を保持した。
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: ピ・ハヒロテの前に
  rationale: פִּי הַחִירֹתを地名として音写し、לִפְנֵיの空間的意味を「前に」で表した。
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: ミグドルと海との間にある
  rationale: 二つの境界を示すבֵּין…וּבֵיןを自然な日本語の位置説明にした。
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: バアル・ツェフォンの前
  rationale: 固有地名を音写し、לִפְנֵיを一貫して「前」とした。
- source_word: נִכְחוֹ
  choice: その向かい
  rationale: 三人称男性単数接尾辞の指示対象を本文では断定せず、「その」で原文の照応上の余地を残した。文脈上はバアル・ツェフォンを指す可能性が高いことを脚注に示した。
- source_word: תַחֲנוּ עַל הַיָּם
  choice: 海辺に宿営しなさい
  rationale: 二人称複数への直接命令を明示し、עַלの位置的用法を自然な「海辺に」で表した。
