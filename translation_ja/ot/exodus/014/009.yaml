revisions:
- from: エジプト人は彼らを追跡し、海辺に宿営していた彼らに追いついた。ファラオの戦車の馬すべてと、その騎兵、軍勢が、ピ・ハヒロテのそば、バアル・ツェフォンの前[a]まで来たのである。
  to: エジプト人は、ファラオの戦車馬すべてとその騎兵、軍勢を伴い、海辺に宿営していた彼らを追跡し、ピ・ハヒロテ、バアル・ツェフォンの前[a]で彼らに追いついた。
  rationale: 軍勢の列挙を「エジプト人」の付随的説明として主文に統合し、エジプト軍がイスラエルに追いついたという原文の構文と叙述を明確にした。「伴い」は列挙された戦車馬・騎兵・軍勢をエジプト人の軍事的構成要素として自然に結ぶ表現であり、原文以上に特定の軍制を読み込まない。脚注は空間表現の可能な訳し分けに適切に付されているため維持した。
