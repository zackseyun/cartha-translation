  naturalness: 「海辺に宿営していた彼らに追いついた」は自然である一方、次文の「ファラオの戦車の馬すべてと、その騎兵、軍勢が、…まで来たのである」は係り受けと叙述の重複がぎこちない。列挙を「エジプト人」の同格として主文に組み込むと、明瞭な現代標準日本語になる。
  terminology: 「エジプト人」「ファラオ」「騎兵」「軍勢」「宿営」は文脈と文体に適切である。「ファラオの戦車馬すべて」は、圧縮されたヘブライ語の「ファラオの戦車の馬すべて」を自然に反映する。ピ・ハヒロテ、バアル・ツェフォンの表記も維持する。
