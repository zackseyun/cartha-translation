  text: וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֤יגוּ אוֹתָ/ם֙ חֹנִ֣ים עַל הַ/יָּ֔ם כָּל סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּ/פָרָשָׁ֖י/ו וְ/חֵיל֑/וֹ עַל פִּי֙ הַֽחִירֹ֔ת לִ/פְנֵ֖י בַּ֥עַל צְפֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: ja
  text: エジプト人は、ファラオの戦車馬すべてとその騎兵、軍勢を伴い、海辺に宿営していた彼らを追跡し、ピ・ハヒロテ、バアル・ツェフォンの前[a]で彼らに追いついた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バアル・ツェフォンの向かい」とも訳せる。ヘブライ語の表現は、目印となる場所に面した位置を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: 追跡し
  rationale: 軍事的な文脈での「後を追う」という意味を、簡潔で自然な現代日本語にした。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 複数動詞の主語であり、国土ではなくイスラエルを追うエジプト側の人々・勢力を指す。
- source_word: וַיַּשִּׂיגוּ
  choice: 追いついた
  rationale: נשׂג の「追って到達する、追いつく」という物語上の意味を自然に表す。
- source_word: חֹנִים עַל הַיָּם
  choice: 海辺に宿営していた
  rationale: 分詞の継続的な状態と、עַל の場所を示す用法を明瞭に表現した。
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: ファラオの戦車の馬すべて
  rationale: 圧縮されたヘブライ語の連語を、戦車隊に属する馬という関係を保ちながら日本語として明瞭にした。
- source_word: וּפָרָשָׁיו
  choice: その騎兵
  rationale: פָּרָשׁ は騎乗した兵を指すため、「騎兵」が簡潔で自然である。
- source_word: וְחֵילוֹ
  choice: 軍勢
  rationale: ここでの חַיִל は軍事力・部隊を指すため、文脈に合う包括的な語を選んだ。
- source_word: עַל פִּי הַחִירֹת
  choice: ピ・ハヒロテのそば
  rationale: 地名を伴う位置表現として理解しやすい日本語にした。
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: バアル・ツェフォンの前
  rationale: לִפְנֵי の基本的な空間表現を保持し、別の可能性は脚注に示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、物語文としての品位を保った。「宿営」「軍勢」は文脈に適した標準的な聖書語彙として用いた。脚注記号は、実際に語義の幅がある「バアル・ツェフォンの前」に付した。
