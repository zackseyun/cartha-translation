base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: ja
  text: 彼らはモーセに言った。「エジプトに墓がないから、私たちを荒野で死ぬために連れて来たのですか。私たちをエジプトから連れ出して、いったい私たちに何をしたのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: 彼らはモーセに言った
  rationale: אמרの物語上の標準的な用法と、発話の相手を示すאֶלを、自然な現代日本語で表した。
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: エジプトに墓がないから
  rationale: 墓がないことを理由として皮肉に問う修辞疑問を、簡潔で自然な日本語にした。疑問文全体によって非難と皮肉が明確になる。
- source_word: לְקַחְתָּנוּ לָמוּת בַּמִּדְבָּר
  choice: 私たちを荒野で死なせるために連れて来た
  rationale: לקחの「連れて行く／来る」と、לָמוּתの目的・結果の含みを保持した。話者の現在地を基準に「連れて来た」とし、מִדְבָּרは砂漠に限定されない「荒野」とした。
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: あなたは何ということをしてくれたのですか
  rationale: 直訳的な「これは何か」ではなく、驚きと非難を帯びた感嘆的疑問の力を現代日本語で再現した。「してくれた」は文脈上の強い不満を表す。
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: 私たちをエジプトから連れ出すとは
  rationale: יצאの使役形が表す「外へ連れ出す」を保ち、前の非難内容を説明する不定詞構文を「とは」で自然につないだ。
