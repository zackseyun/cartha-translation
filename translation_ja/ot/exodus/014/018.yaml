id: EXO.14.18
reference: Exodus 14:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: ja
  text: わたしがファラオとその戦車、騎兵を通して栄光を受けるとき[a]、エジプト人はわたしがヤハウェ[b]であることを知る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしがファラオとその戦車、騎兵を通して栄光を現すとき」。
    reason: בְּהִכָּבְדִי は直訳すると「わたしが栄光を受けるとき」「わたしがあがめられるとき」。文脈上、その栄光が明らかになるという含みもある。
  - marker: b
    text: 「ヤハウェ」は、ヘブライ語の神名 יהוה（YHWH）。伝統的に「主」と訳されることもある。
    reason: 称号と固有の神名を区別し、音写の根拠を読者に示すため。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 知る
  rationale: 接続詞を伴う完了形は、ここでは目前の出来事から生じる将来の結果を表す。日本語では時を示す従属節に続く「知る」で自然に将来の帰結が伝わる。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 地名「エジプト」ではなく、ヤハウェを認識する民を指す文脈なので「エジプト人」とした。
- source_word: כִּי אֲנִי יְהוָה
  choice: わたしがヤハウェであること
  rationale: 神の自己認識定式を明瞭な現代日本語で保ち、固有の神名も訳文に示した。
- source_word: בְּהִכָּבְדִי
  choice: 栄光を現すとき
  rationale: כבד のニファル不定詞構文は、ヤハウェの重んじられること、またはその栄光が明らかになることを表す。「栄光を現す」は文脈上の意味を自然に伝え、受動的な読みは脚注に残した。
- source_word: בְּפַרְעֹה בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: ファラオと、その戦車と騎兵によって
  rationale: 反復される前置詞 ב を「によって」でまとめ、ファラオとその軍勢がヤハウェの栄光の現れる手段・場となることを示した。
- source_word: רִכְבּוֹ
  choice: その戦車
  rationale: רכב は集合的な戦車隊も指し得るが、現代日本語では「その戦車」が簡潔で、軍事的対象を明瞭に表す。
- source_word: פָרָשָׁיו
  choice: 騎兵
  rationale: 馬に乗って戦う者たちを指す集合表現として、現代日本語で自然な「騎兵」を用いた。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として「ヤハウェ」と音写した。
- issue: בְּהִכָּבְדִי における神の栄光の表現
  choice: 栄光を現す
  alternative: 栄光を受ける／栄光ある者とされる
  rationale: ニファル形が持つ受動・中動的な含みと、出来事を通して神の栄光が顕現する文脈との緊張を、本文と脚注を合わせて保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ファラオ」「戦車」「騎兵」という具体語を維持し、過度に古風な語法は避けた。原文の因果・時間関係は「とき」で表し、神の栄光に関する態の幅は脚注で保持した。
