revisions:
- from: わたしがファラオと、その戦車と騎兵によって栄光を現すとき[a]、エジプト人は、わたしがヤハウェ[b]であることを知る。
  to: わたしがファラオとその戦車、騎兵を通して栄光を受けるとき[a]、エジプト人はわたしがヤハウェ[b]であることを知る。
  rationale: 主文をニファル形の「栄光を受ける」に改め、原文が表す神があがめられるという意味を保持した。また、ファラオとその軍勢との関係を「～を通して」として、彼らが栄光を現す主体であるとの不要な含意を避けた。神名表記と脚注アンカーは維持した。
