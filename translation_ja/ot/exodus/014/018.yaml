  timestamp: '2026-07-19T07:30:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'בְּהִכָּבְדִי is a Niphal infinitive construct with first-person suffix: literally, Yahweh''s being honored/glorified in connection with Pharaoh and his forces. The draft''s 「栄光を現す」 changes this to an active act of revelation, while 「ファラオと、その戦車と騎兵によって」 can imply that they themselves are the agents who reveal God''s glory. A rendering in which Yahweh receives glory through/over them better preserves the Hebrew form and context.'
  naturalness: The revised wording is clear, contemporary standard Japanese and retains the verse's temporal-result sequence. Omitting the comma after 「エジプト人は」 makes the sentence flow more naturally.
  terminology: 「ヤハウェ」 appropriately represents יהוה as a proper divine name; the explanatory note is accurate. 「ファラオ」「戦車」「騎兵」 are suitable and intelligible. The alternate in note a should identify the active ‘manifest glory’ wording as interpretive rather than present it as the primary lexical sense.
  issues:
  - severity: medium
    issue: 「栄光を現すとき」はニファル形の態を能動的に言い換えている。
    rationale: הִכָּבֵד means ‘be honored/be glorified’ here, not directly ‘manifest glory.’ The contextual result of glory being displayed may be expressed in a note, but the main text should retain Yahweh as the one honored/glorified.
  - severity: medium
    issue: 「ファラオと、その戦車と騎兵によって」は、ファラオ側が神の栄光を現す行為者であるようにも読める。
    rationale: The repeated בְּ phrases locate the glorification in relation to/through Pharaoh, his chariots, and his horsemen, within the setting of their defeat. 「～を通して、わたしが栄光を受ける」 preserves this relationship more appropriately.
  revised_text: わたしがファラオとその戦車、騎兵を通して栄光を受けるとき[a]、エジプト人はわたしがヤハウェ[b]であることを知る。
