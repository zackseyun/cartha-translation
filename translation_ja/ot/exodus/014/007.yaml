  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: ja
  text: 彼は、えり抜きの戦車六百両と、エジプトのすべての戦車を連れて行き、そのすべてに士官を付けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そのすべての上にシャーリーシュたちを置いた」とも訳せる。ヘブライ語の語は、戦車に関係する士官、精鋭の補佐官、または側近を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 彼は…率い
  rationale: 物を単に「取る」のではなく、ファラオが戦車部隊を動員して率いる文脈なので、自然な日本語で物語の進行を表した。
- source_word: שֵׁשׁ מֵאוֹת רֶכֶב בָּחוּר
  choice: えり抜きの戦車六百両
  rationale: רֶכֶבを数えられる戦車と捉え、בָּחוּרの選抜された精鋭という意味を「えり抜き」で表した。
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: エジプトのすべての戦車
  rationale: 六百両の選抜戦車に加え、エジプトの戦車隊全体を指す構文を明確に訳した。
- source_word: וְשָׁלִשִׁם
  choice: 戦車隊の指揮官
  rationale: 軍事的役職を示す語で、戦車に伴う高級軍人、側近、隊長などの可能性がある。本文では文脈上明快な「戦車隊の指揮官」とし、語義の幅は注で示した。
- source_word: עַל כֻּלּוֹ
  choice: それらすべてに…配置した
  rationale: 単数形の接尾辞は戦車部隊を集合的に受けると理解し、指揮官が全隊に付されていたことを自然な日本語で表した。
