  terminology: בָּחוּר を「えり抜き」とすること、רֶכֶב を「戦車」とすることは適切です。שָׁלִשִׁים は戦車隊の「指揮官」と断定せず、広い軍事的職掌を示す「士官」とし、脚注で可能な理解を示すのが安全です。
