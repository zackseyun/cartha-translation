  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: ja
  text: しかし、イスラエルの子らは、海のただ中を、乾いた地の上で歩いて進んだ[a]。水は彼らの右にも左にも壁となっていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人は乾いた地を通って海を渡った。」
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「水は彼らにとって壁であった」。これを「壁のようであった」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: しかし、イスラエルの子らは
  rationale: 接続詞וּは直前のエジプト人の滅亡とイスラエルの無事な通過との対照を示すため「しかし」とした。בְּנֵי יִשְׂרָאֵלの親族的・民族的表現は「イスラエルの子ら」として保持した。
- source_word: הָלְכוּ
  choice: 歩いて進んだ
  rationale: הלךの「歩く／進む」という意味と、海中を徒歩で進む物語の情景を自然な日本語で表した。
- source_word: בַיַּבָּשָׁה
  choice: 乾いた地の上を
  rationale: יַבָּשָׁהは「乾いた地」を指す。海底が乾いていたという本文の強調が伝わる表現とした。
- source_word: בְּתוֹךְ הַיָּם
  choice: 海のただ中を
  rationale: בְּתוֹךְの空間的な意味を保ち、海の内部を通過したという鮮明な描写を示した。
- source_word: וְהַמַּיִם
  choice: 水は
  rationale: מַיִםはヘブライ語では複数形だが、日本語では集合的に「水」とするのが自然である。接続は文を分けて表した。
- source_word: לָהֶם חֹמָה
  choice: 彼らのための壁となっていた
  rationale: לָהֶםは彼らとの関係・彼らにとっての機能を示し、חֹמָהは明示的な比較辞なしに「壁」と述べられている。本文では比喩を補わず直接的に訳した。実際の本文表現では自然さのため「彼らの右にも左にも壁となっていた」とした。
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: 彼らの右にも左にも
  rationale: 左右両側に水があったという均整の取れた原文表現を、簡潔で自然な日本語にした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵלの訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の親族的・民族的な呼称を保持した。「子ら」は民族全体を指し、男性だけに限定する意図ではない。
- issue: חֹמָהを直接表現とするか比較表現とするか
  choice: 壁となっていた
  alternative: 壁のようになっていた
  rationale: ヘブライ語本文には「〜のような」に当たる明示的な比較辞がないため、強い直接表現を本文に残した。比較的な理解も可能なので脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「海のただ中」「イスラエルの子ら」によって原文の荘重さと具体的な情景を保った。
