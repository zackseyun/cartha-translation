  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: ja
  text: 主はエジプトの王ファラオの心をかたくなにされた[a]。そこでファラオはイスラエルの子らを追跡した。その時、イスラエルの子らは堂々と進み出ていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心を強くされた」または「固くされた」。ヘブライ語の動詞は基本的に「強くする、堅くする」という意味だが、出エジプト記でファラオの心について用いられる時には、一般に「かたくなにする」という意味を帯びる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「高く上げた手で」。恐れず、力強く、公然と進む様子を表す。
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהֹוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く理解される尊称「主」で表した。
- source_word: וַיְחַזֵּק ... אֶת לֵב
  choice: 心をかたくなにされた
  rationale: חזקの基本義は「強くする、堅くする」だが、ファラオの心を目的語とする出エジプト記の反復表現では、意志を固くして譲らなくする意味を自然に伝える「かたくなにする」が適切である。基礎的な語義は脚注に残した。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: エジプトの王ファラオ
  rationale: ヘブライ語の同格的な表現を、明瞭で自然な日本語の語順にした。
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: 追跡した
  rationale: 軍事的に後を追うという敵対的な意味を簡潔に表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 同じ句が二度用いられる修辞的反復を保ちつつ、原文の具体的な表現を反映した。文脈上はイスラエルの民全体を指す。
- source_word: יֹצְאִים
  choice: 進み出ていた
  rationale: 分詞の継続的な相を「ていた」で表し、単なる出発ではなく、エジプトから外へ進み出る動きを示した。
- source_word: בְּיָד רָמָה
  choice: 堂々と
  rationale: 直訳は「高く上げた手で」。ここでは恐れず公然と、力強く出て行く様子を表す慣用句なので、本文では自然な日本語にし、具体的な比喩は脚注に示した。
theological_decisions:
- issue: ファラオの心をかたくなにする神の直接的行為
  choice: 主は……ファラオの心をかたくなにされた
  alternative: 主は……ファラオの心を強くされた／固くされた
  rationale: 原文はこの行為を主に直接帰しているため、その神学的緊張を弱めずに保った。一方、動詞חזק自体には「強くする、固くする」という語義もあるので、脚注で代案を明示した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「かたくなにされた」によって神の直接的行為を保持し、「堂々と」で慣用句の文脈的意味を自然に伝え、直訳は脚注に残した。
