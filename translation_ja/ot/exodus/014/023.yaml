  text: וַ/יִּרְדְּפ֤וּ מִצְרַ֨יִם֙ וַ/יָּבֹ֣אוּ אַחֲרֵי/הֶ֔ם כֹּ֚ל ס֣וּס פַּרְעֹ֔ה רִכְבּ֖/וֹ וּ/פָרָשָׁ֑י/ו אֶל תּ֖וֹךְ הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: ja
  text: エジプト人は彼らを追って海のただ中に入った。すなわち、ファラオの馬[a]、戦車、騎兵のすべてである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「ファラオの馬」を単数形で記していますが、ここでは馬の全体を集合的に指しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: 追跡し
  rationale: רדףの軍事的文脈における「追う、追跡する」という意味を、明瞭で自然な現代日本語で表す。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 複数動詞と物語の文脈から、国土ではなく追撃するエジプトの人々・軍勢を指す。
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: 彼らの後を追って……入った
  rationale: בואの移動とאַחֲרֵיהֶםの追随・追撃の意味を、日本語として自然につなげる。
- source_word: כֹּל סוּס פַּרְעֹה
  choice: ファラオの馬……のすべて
  rationale: סוּסは単数形だが、כֹּלに伴う集合的な用法であり、日本語でも「馬」を集合的に用いることで原文の形と意味を保つ。
- source_word: רִכְבּוֹ
  choice: 戦車
  rationale: רכבは戦車または戦車隊を指し得る。ここでは馬・騎兵と並ぶ軍事要素として、簡潔で具体的な「戦車」とする。
- source_word: וּפָרָשָׁיו
  choice: 騎兵
  rationale: פָּרָשׁは騎乗する兵士・騎兵を指すため、現代日本語で明瞭な「騎兵」とする。
- source_word: אֶל תּוֹךְ הַיָּם
  choice: 海のただ中に
  rationale: תּוֹךְが示す海の内部・中央部への進入を、「海に」だけに弱めず表現する。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼らの後を追って」は直前の「追跡し」と意味が重なるが、原文のרדףとאַחֲרֵיהֶםの双方を反映するため保持した。後半は日本語で列挙の係り先を明確にするため、「すべてが入ったのである」と補って文を整えた。
