source:
  edition: WLC
  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: ja
  text: エジプトの王に、民が逃げ去ったとの知らせが届いた。すると、ファラオとその家臣たちは民に対して心変わりし、彼らは言った。「われわれは何ということをしてしまったのか。イスラエルを去らせ、われわれに仕えるのをやめさせてしまったとは。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 知らせが届いた
  rationale: 行為者を示さないホファル形の受動表現を、自然な日本語で非人称的な報告として表した。
- source_word: כִּי בָרַח הָעָם
  choice: 民が逃げ去った
  rationale: ברח の「逃げる、逃亡する」という意味を明確にし、物語上すでに起きた出来事として自然に表現した。
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: ファラオとその家臣たちの心は……一変し
  rationale: לְבַב の「心」という比喩を保ちつつ、נהפך が示す態度の反転を現代日本語で表した。
- source_word: אֶל הָעָם
  choice: 民に対して
  rationale: 方向・対象を示す אֶל を訳し、敵対的な変化は文脈から伝わるようにして、語自体の幅を狭めすぎないようにした。
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: われわれは何ということをしてしまったのか
  rationale: 驚きと後悔を表すヘブライ語の慣用的な問いを、意味と調子を保った自然な日本語にした。
- source_word: שִׁלַּחְנוּ
  choice: 解放してしまう
  rationale: この文脈での שׁלח はイスラエルを去らせる、解放することを指す。後悔の含みは「しまう」で表した。
- source_word: מֵעָבְדֵנוּ
  choice: われわれに仕えることから
  rationale: עבד の動詞的意味を保ち、直ちに「奴隷」と言い換えて本文以上に限定することを避けた。
theological_decisions:
- issue: לְבַב が示す人間の内面
  choice: 心
  alternative: 考え、思い
  rationale: 思考と意志の座を表す語だが、原文の身体的・文学的比喩を保持し、現代心理学的な語に還元しなかった。
- issue: מֵעָבְדֵנוּ におけるイスラエルの境遇
  choice: われわれに仕えることから
  alternative: われわれの奴隷であることから
  rationale: 広い文脈では強制労働と隷属が明白だが、この句そのものの動詞的表現に沿い、本文では「仕える」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、王の報告場面と直接話法にふさわしい簡潔で品位ある調子とした。「ファラオ」「イスラエル」は一般的な聖書表記を採用し、原文の「心」の比喩と、仕えることを表す語の解釈幅を保持した。
