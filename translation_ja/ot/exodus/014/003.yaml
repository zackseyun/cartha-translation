  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: ja
  text: ファラオはイスラエルの子らについて、「彼らはその地で途方に暮れている。荒野が彼らを閉じ込めた」と言うだろう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: と言うだろう
  rationale: 後続の出来事に対するファラオの反応を神が予告している文脈なので、完了形を未来の意味で訳した。接続詞は、日本語では前節とのつながりの中で自然に理解できるため、明示しなかった。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らについて
  rationale: אמרに伴うלを発言の対象を示すものと捉え、「について」とした。「イスラエルの子ら」は原文の表現を保つ。
- source_word: נְבֻכִים
  choice: 途方に暮れている
  rationale: 方向を見失い、どうすべきか分からない状態を表す分詞。単なる心理的混乱にも物理的な行き詰まりにも限定せず、文脈に自然な日本語とした。
- source_word: בָּאָרֶץ
  choice: この地で
  rationale: 定冠詞付きの「地」を、ファラオが念頭に置く周辺地域を指す自然な日本語として訳した。エジプト国内か、より広い地域かは限定しない。
- source_word: סָגַר עֲלֵיהֶם
  choice: 彼らを閉じ込めた
  rationale: 荒野によって逃げ道を塞がれ、囲い込まれたという比喩を明瞭に保った。
- source_word: הַמִּדְבָּר
  choice: 荒野
  rationale: 砂漠だけに限定されない、耕作されていない乾燥地を指す語として、聖書文脈で自然な「荒野」を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「途方に暮れている」により、原語が含み得る混乱・方向喪失・行き詰まりの幅を保ち、原文に明示されない「さまよう」は加えなかった。
