source:
  edition: WLC
  text: וַ/יֵּט֩ מֹשֶׁ֨ה אֶת יָד֜/וֹ עַל הַ/יָּ֗ם וַ/יָּ֨שָׁב הַ/יָּ֜ם לִ/פְנ֥וֹת בֹּ֨קֶר֙ לְ/אֵ֣יתָנ֔/וֹ וּ/מִצְרַ֖יִם נָסִ֣ים לִ/קְרָאת֑/וֹ וַ/יְנַעֵ֧ר יְהוָ֛ה אֶת מִצְרַ֖יִם בְּ/ת֥וֹךְ הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: ja
  text: モーセが海の上に手を伸ばすと、夜明けごろ、海は元の状態に戻った[a]。エジプト人は海に向かって逃げていたが、ヤハウェは彼らを海のただ中に投げ込んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「元の勢いに戻った」または「本来の力を取り戻した」とも訳せる。ヘブライ語は、海がそれまでの安定した通常の状態を回復したことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「投げ込んだ」に当たるヘブライ語は、字義的には「振り落とした」または「振り出した」。ヤハウェがエジプト人を海中へ激しく放り出す様子を生き生きと描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ
  choice: 手を伸ばすと
  rationale: נטה と「手」の組み合わせが表す具体的な動作を、自然な現代日本語で示した。接続形は後続する出来事との連続を表すため「すると」とした。
- source_word: לִפְנוֹת בֹּקֶר
  choice: 夜明けごろ
  rationale: 直訳的には「朝が巡って来るころ」。時間帯を明快かつ自然に示した。
- source_word: לְאֵיתָנוֹ
  choice: 元の状態に
  rationale: אֵיתָן には持続する強さ、安定した状態、通常の勢いという意味幅がある。海が分かれる前の状態を回復したことを本文で自然に示し、より力感のある解釈は脚注に残した。
- source_word: נָסִים לִקְרָאתוֹ
  choice: 海に向かって逃げていた
  rationale: 分詞 נָסִים の継続的動作と、לִקְרָאתוֹ の「それに向かって／それを迎えるように」という方向性を保持した。指示対象は文脈上の海として明示した。
- source_word: וַיְנַעֵר
  choice: 投げ込んだ
  rationale: נער の字義は「振り落とす、振り出す」であり、ここではヤハウェがエジプト人を海中へ激しく放り出す vivid な動作を表す。本文では自然な日本語を優先し、原語の比喩を脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: בְּתוֹךְ הַיָּם
  choice: 海のただ中に
  rationale: תּוֹךְ の「内部、中央」という意味を明示し、動作の到達点として自然に表現した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写し、本文上の区別を保った。
- issue: 海が לְאֵיתָנוֹ に戻るという表現
  choice: 元の状態に戻った
  alternative: 元の勢いに戻った／本来の力を取り戻した
  rationale: 語が含み得る「強さ」と「安定した通常状態」の両面を一義的に限定せず、文脈に即した包括的表現を本文に置いた。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「ただ中」は聖書文としての荘重さを保ちながら一般読者にも理解できる表現。原文の継続的な「逃げていた」と、海へ向かうという意外な方向表現を解消せず保持した。
