source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: ja
  text: そのとき、ヤハウェはモーセに言われた。「水がエジプト人と、その戦車と騎兵の上に戻るように、海の上に手を伸ばしなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「海の上に手を伸ばしなさい。そうすれば、水はエジプト人と、その戦車と騎兵の上に戻る」。ヘブライ語の動詞は、モーセの動作によって意図された結果を表すとも、単純な未来・結果を表すとも取れる。
    reason: 語法上の別訳
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そのとき、…言われた
  rationale: 物語を先へ進めるワウ継続法の順次性を、現代日本語で自然な「そのとき」によって表した。神の発話には文脈にふさわしい敬語「言われた」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な学術的音写により示した。
- source_word: נְטֵה אֶת־יָדְךָ
  choice: 手を伸ばしなさい
  rationale: 男性単数への命令を、動作が明瞭で自然な現代日本語として訳した。
- source_word: עַל־הַיָּם
  choice: 海の上に
  rationale: 前置詞 עַל の空間的イメージを保ち、モーセが海に向けて手を差し伸べる場面を過度に限定しない表現とした。
- source_word: וְיָשֻׁבוּ
  choice: 戻るようにしなさい
  rationale: 命令に続く未完了形を、命令された動作の意図された結果として自然に表した。ただし単純な未来・結果とも読めるため脚注に別訳を示した。
- source_word: הַמַּיִם
  choice: 水
  rationale: ヘブライ語は複数形だが、日本語では集合的な物質名詞「水」が自然であり、複数性を不自然に明示しなかった。
- source_word: עַל־מִצְרַיִם
  choice: エジプト人の上に
  rationale: ここでの מִצְרַיִם は水に覆われる人々を集合的に指すため「エジプト人」とし、עַל の覆いかぶさる像を「上に」で保った。
- source_word: עַל־רִכְבּוֹ וְעַל־פָּרָשָׁיו
  choice: その戦車と騎兵の上に
  rationale: 単数接尾辞は集合的な「エジプト人」を受ける。日本語では「その」によって自然に結び、רֶכֶב を「戦車」、פָּרָשִׁים を直接的な「騎兵」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を直接用いているため、称号「主」に置換せず音写した。「エホバ」ではなく、原語研究で広く用いられる「ヤハウェ」を採用した。
- issue: וְיָשֻׁבוּ の命令との関係
  choice: 意図された結果として「戻るようにしなさい」
  alternative: 結果・未来として「そうすれば、水は戻る」
  rationale: 命令形に続く接続詞付き未完了形は目的または意図された結果を表し得る。本文ではそのつながりを示しつつ、単純な未来・結果の読みも脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の直接発話にふさわしい簡潔で荘重な調子を保った。「お伸ばしください」のような過度な敬語や古語は避けた。
