id: EXO.14.24
reference: Exodus 14:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: ja
  text: 明け方の見張りの時に、ヤハウェは火と雲の柱の中から[a]エジプト人の陣営を見下ろし、エジプト人の陣営を混乱に陥れた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「火と雲の柱を通して」。
    reason: 前置詞בְּは、柱の内部という場所を示すとも、柱を手段とすることを示すとも解釈できるため。
  - marker: b
    text: または「恐慌に陥れた」。
    reason: הוםは、混乱だけでなく、動揺や恐慌を引き起こす意味にもなり得るため。
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: 明け方の見張りの時間になると
  rationale: אַשְׁמֹרֶתが夜間を区切る見張りの時間帯を表すことを保ちつつ、הַבֹּקֶרを自然な現代日本語で「明け方」とした。
- source_word: וַיַּשְׁקֵף
  choice: 見下ろし
  rationale: שׁקףのこの語形が、高い位置または上方から外を望む含意を持つため。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: מַחֲנֵה מִצְרַיִם
  choice: エジプト人の陣営
  rationale: 軍事的な宿営を表すמַחֲנֶהと、属格的なמִצְרַיִםの関係を明瞭に表した。
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: 火と雲の柱の中から
  rationale: 前置詞בְּを場所・起点に近い意味に取り、ヤハウェが柱の内から陣営を見たという像を自然に表現した。ただし手段を示す可能性も脚注に残した。
- source_word: וַיָּהָם
  choice: 混乱に陥れた
  rationale: הוםの使役的な力と、騒乱・混乱を引き起こす意味を表し、後続文脈に先立って「敗走させた」とまでは限定しなかった。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく四文字神名を直接用いているため、固有名として音写した。
- issue: 火と雲の柱に対するヤハウェの位置または働き
  choice: 柱の中から
  alternative: 柱を通して
  rationale: בְּは場所とも手段とも解し得る。本文では場面的に自然な場所の解釈を採り、手段の解釈を脚注に示して曖昧さを保持した。
- issue: וַיָּהָםが示す混乱の強さ
  choice: 混乱に陥れた
  alternative: 恐慌に陥れた
  rationale: 語は混乱にも恐慌にも及び得るため、本文では意味範囲の広い表現を採り、より強い解釈を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「見張りの時間」で古代の夜間区分を分かりやすく示し、「陣営」「見下ろす」「混乱に陥れる」によって物語の軍事的・荘厳な調子を保った。
