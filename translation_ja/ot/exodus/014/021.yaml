language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת יָד/וֹ֮ עַל הַ/יָּם֒ וַ/יּ֣וֹלֶךְ יְהוָ֣ה אֶת הַ֠/יָּם בְּ/ר֨וּחַ קָדִ֤ים עַזָּה֙ כָּל הַ/לַּ֔יְלָה וַ/יָּ֥שֶׂם אֶת הַ/יָּ֖ם לֶ/חָרָבָ֑ה וַ/יִּבָּקְע֖וּ הַ/מָּֽיִם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: ja
  text: そこでモーセが海の上に手を伸ばすと、ヤハウェ[a]は一晩中、強い東風によって海を押し戻し[b]、海を乾いた地とした。こうして、水は裂けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 神の固有名 יהוה（YHWH）の音写。
    reason: 神名を称号に置き換えず音写したことを明示するため。
  - marker: b
    text: 直訳すると「海を行かせ」。ここでは、海を退かせるという使役の意味。
    reason: הלךのヒフィル形の字義と、文脈に即した自然な訳との関係を示すため。
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ עַל־הַיָּם
  choice: 海の上に手を伸ばすと
  rationale: נטהと「手」の組み合わせを自然な現代日本語で表し、עַלの空間的な意味も「海の上に」として保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名יהוהを一般的な日本語の形で音写した。
- source_word: וַיּוֹלֶךְ ... אֶת־הַיָּם
  choice: 海を押し戻し
  rationale: הלךのヒフィル形は字義的には「海を行かせた」だが、海が退いて乾いた地が現れる文脈上の使役的な動きを、過度に機序を補わず自然に表した。字義的な形は脚注で示した。
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: 強い東風によって
  rationale: 東からの風を手段として示すבְּを「によって」、עַזָּהを簡明に「強い」と訳した。
- source_word: כָּל־הַלַּיְלָה
  choice: 一晩中
  rationale: 全夜にわたる継続を簡潔で自然な日本語にした。
- source_word: וַיָּשֶׂם אֶת־הַיָּם לֶחָרָבָה
  choice: 海を乾いた地にされた
  rationale: יםを目的語として保ち、חרבהを「乾いた地」と訳して、海が乾いた地となったという原文の強い表現を維持した。
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: 水は裂けた
  rationale: בקעのニファル形が表す裂開を簡潔に表現した。「二つに」を補わず、原文の表現範囲を守った。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、神名そのものを音写した。発音の再建には不確実性があるので、その性質を脚注で簡潔に示した。
- issue: 海が退く際の神の働きと風の関係
  choice: ヤハウェが強い東風によって海を押し戻した
  alternative: 風を単なる自然現象として独立させる
  rationale: 原文はヤハウェを使役動詞の主語とし、風をその手段として明示する。その両方を保ち、神の行為と自然的手段のどちらも消去しなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語文にふさわしい簡潔さと品位を保った。「そこで」「こうして」で動作と結果の流れを示した。敬語的な「された」は神を主語とする日本語として自然だが、過度に古風な語調にはしていない。
