id: EXO.14.14
reference: Exodus 14:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: ja
  text: ヤハウェがあなたがたのために戦われる。あなたがたは黙っていなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたは黙っている」「静かにしていなさい」。
    reason: תַּחֲרִישׁוּן は文脈上、命令・勧告として理解できる一方、形態上は未完了形で、未来または継続を表す読みも可能であるため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: יִלָּחֵם
  choice: 戦われる
  rationale: לחםのニファル未完了形が表す、イスラエルのためにこれから戦うという軍事的行為を、自然で簡潔な日本語にした。主語への敬意を示すため尊敬表現を用いた。
- source_word: לָכֶם
  choice: あなたがたのために
  rationale: 前置詞לと二人称男性複数接尾辞が示す受益・代理の意味を明確にした。
- source_word: וְאַתֶּם
  choice: あなたがたは
  rationale: 独立代名詞による主語の強調を保ち、前文のヤハウェの行為との対照が自然に伝わる形とした。接続詞וは、日本語では文を分けることで関係が十分明らかなため明示しなかった。
- source_word: תַּחֲרִישׁוּן
  choice: 黙っていなさい
  rationale: חרשׁのヒフィル未完了形の『沈黙する、静かにしている』という意味を、文脈上の命令・勧告として自然に表した。ただし直説的な未来・継続の解釈も可能なので脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を直接用いているため、固有名として音写した。
- issue: תַּחֲרִישׁוּן の法的ニュアンス
  choice: 命令・勧告として「黙っていなさい」
  alternative: 直説的に「あなたがたは黙っている」または「静かにしている」
  rationale: モーセの励ましと指示の文脈では命令的に読むのが自然だが、形態上は未完了形であり、未来・結果を表す可能性も排除できないため、曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で現代的かつ礼拝・朗読にも耐える格調を保った。「戦われる」は神への敬意を自然に示す尊敬表現。「黙っていなさい」は古風な「沈黙せよ」より平易でありながら、軽すぎない表現である。
