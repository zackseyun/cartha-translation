  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: ja
  text: その時、それまでイスラエルの陣営の前を進んでいた神の御使い[a]が移動し、彼らの後ろへ行った。雲の柱も彼らの前から移動し、彼らの後ろに立った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神の使者」。ヘブライ語は「御使い」または「使者」を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 移動した
  rationale: נסע は「出発する」「宿営をたたむ」も意味するが、ここでは神の使いと雲の柱がイスラエルの前方から後方へ位置を変える動作を表すため、「移動した」が文脈に合う。
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: 神の使い
  rationale: מַלְאָךְ は「使者」と超自然的な「御使い」の両義を持つ。「神の使い」は存在の本質を断定せず、日本語として自然に両義性をある程度保てる。
- source_word: הַהֹלֵךְ
  choice: それまで…進んでいた
  rationale: 分詞が後続の出来事に先立つ継続的な動作を示すため、「それまで」と「進んでいた」で時間的・継続的な意味を表した。
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: イスラエルの陣営の前
  rationale: לִפְנֵי の空間的意味と מַחֲנֵה の具体的な「陣営」を明瞭に保った。
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: 彼らの後ろへ回った
  rationale: ここで מֵאַחֲרֵי は追跡ではなく後方の位置を示す。「後ろへ回った」は前方から後方への動きを自然な日本語で表す。
- source_word: עַמּוּד הֶעָנָן
  choice: 雲の柱
  rationale: 構成関係と具体的な視覚イメージを保つ、定着した明瞭な表現。
- source_word: מִפְּנֵיהֶם
  choice: 彼らの前から
  rationale: 空間的な起点を自然かつ明確に示し、節前半の「前」と対応させた。
- source_word: וַיַּעֲמֹד
  choice: 立った
  rationale: עמד の基本義を保ち、雲の柱が後方で定位置についたことを簡潔に表す。
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים の正体と本質
  choice: 「神の使い」とし、被造の天使、神の顕現、あるいはキリストの顕現のいずれかを特定しない。
  alternative: 「神の御使い」「神の使者」、または神顕現を明示する訳。
  rationale: 本文はこの存在を名指すが、その存在論的な正体をここで明示してはいない。後代の教理的結論を訳文に持ち込まず、本文の神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述体。「その時」で物語の進行を示し、「それまで」で分詞の継続性を自然に表現した。前方から後方への位置変化が読者に明確になるようにした。
