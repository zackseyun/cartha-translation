source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: ja
  text: 「わたしはファラオの心をかたくなにする[a]。彼は彼らを追う。こうして、わたしはファラオとその全軍を通して栄光を現す[b]。エジプト人は、わたしがヤハウェであることを知る。」彼らはそのとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心を強固にする」。ヘブライ語の動詞には「強くする、固くする」という意味があり、ここではその強固さが頑迷さとして表れている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ファラオとその全軍に対して、わたしは栄光を得る」。このヘブライ語表現は、これから起こることによって、ファラオとその軍勢との関わりの中でヤハウェの栄光と誉れが明らかになることを表す。
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי אֶת־לֵב פַּרְעֹה
  choice: わたしはファラオの心をかたくなにする
  rationale: חזק のヒフィル形は直訳的には「強くする／固くする」だが、ここではファラオの意志が頑迷になる文脈である。「心をかたくなにする」は、神が動作主体であることを保ちつつ、自然な日本語でその意味を表す。
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: 彼は彼らを追う
  rationale: רדף＋אחרי は追跡を表す。軍事的文脈にも合う簡潔な表現とした。
- source_word: וְאִכָּבְדָה בְּפַרְעֹה וּבְכָל־חֵילוֹ
  choice: こうして、わたしはファラオとその全軍を通して栄光を現す
  rationale: כבד のニファル形と בְּ の構文は、続く裁きを介してヤハウェの重み・誉れが明らかになることを表す。「栄光を現す」は日本語として自然であり、「を通して」はファラオ側が栄光の源であるとの誤解を避けつつ、手段・契機の意味を保つ。敵に対する勝利の含意は文脈に委ねる。
- source_word: חֵילוֹ
  choice: その全軍
  rationale: חַיִל はここではファラオの軍事力・軍勢を指すため、「全軍」が明確で自然である。
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: エジプト人は…知る
  rationale: 地名的な「エジプト」より、複数動詞に対応する民としての意味を明確にする。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を日本語で音写する。
- source_word: וַיַּעֲשׂוּ־כֵן
  choice: 彼らはそのとおりにした
  rationale: 直前までの命令を実行したことを示す、簡潔で自然な物語上の結語。
theological_decisions:
- issue: ファラオの心をかたくなにする行為の主体
  choice: 神の直接的な行為として「わたしは…かたくなにする」と訳す
  alternative: 「ファラオの心がかたくなになるのを許す」
  rationale: ヘブライ語の一人称ヒフィル形はヤハウェを明確な動作主体とする。単なる許容へ弱めず、本文の神学的緊張を保つ。
- issue: 裁きにおける כבד の意味
  choice: 「ファラオとその全軍を通して栄光を現す」
  alternative: 「ファラオとその全軍に対して栄光を得る」
  rationale: 神がファラオと軍勢に起こる出来事によって誉れを現すという意味を示す。בְּ が手段・領域・敵対的関係のいずれを強く帯びるかは一定の幅があるため、脚注で別訳を提示する。
translation_notes:
  register: 明快な現代標準日本語を用い、神の発言には簡潔で威厳ある調子を保った。「心」は聖書的比喩を維持し、「かたくなにする」で現代の読者にも意志の頑迷さが伝わるようにした。神名は「ヤハウェ」とした。
