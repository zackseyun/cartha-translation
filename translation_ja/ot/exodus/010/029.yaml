  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: ja
  text: モーセは言った。「おっしゃったとおりです[a]。私は二度とあなたのお顔を見ることはありません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがおっしゃるとおりです」「おっしゃったとおりになります」。
    reason: alternative_reading
  - marker: b
    text: ヘブライ語では直訳すると「私は再びあなたの顔を見ることを加えない」。これは「二度とあなたの顔を見ない」という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: モーセは言った
  rationale: ワウ継続法による物語の進行を、日本語では自然な叙述として表した。
- source_word: כֵּן דִּבַּרְתָּ
  choice: おっしゃったとおりです
  rationale: ファラオの直前の発言に同意する表現。二人称単数を保ちつつ、王への応答として自然で品位ある敬語にした。
- source_word: לֹא אֹסִף עוֹד רְאוֹת
  choice: 二度と……見ることはありません
  rationale: 「さらに加えて再び見ることはない」という構文を、反復がないことを明確に示す自然な日本語の慣用表現で訳した。
- source_word: פָּנֶיךָ
  choice: あなたのお顔
  rationale: 字義どおり「あなたの顔」。ここでは対面する意味を帯びるが、原文の具体的表現を保持した。
theological_decisions:
- issue: モーセの発言の確定性
  choice: 二度と……見ることはありません
  alternative: もう……お会いしません
  rationale: 未来の不再発を述べる原文を保持し、これが予告か決意かを日本語で過度に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準語。ファラオへの直接発話では敬語を用いるが、古風すぎる宮廷語は避けた。「お顔」は原文の具体性と発話場面の敬意を両立させる。
