revisions:
- from: ですから今、どうか今回だけは私の罪を赦し[a]、あなたがたの神ヤハウェに切に祈って、この死だけでも私から取り除いてくださるようにしてください[b]。
  to: ですから今、どうか今回だけ私の罪を赦してください。そして、あなたがたの神ヤハウェに切に祈り、この死だけを私から取り除いてくださるようにしてください[a]。
  rationale: 本文の脚注は、原文の「この死」を説明する注だけを実際の該当箇所に付しました。「罪を赦す」の語法に関する注は有用ですが、この短い本文では脚注アンカーを増やさず、注釈セットに保持しています。本文は、原文の二つの依頼を明確にし、רַק の限定を譲歩的な含みなく訳しました。
