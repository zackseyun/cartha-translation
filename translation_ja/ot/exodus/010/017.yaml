  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: ja
  text: ですから今、どうか今回だけ私の罪を赦してください。そして、あなたがたの神ヤハウェに切に祈り、この死だけを私から取り除いてくださるようにしてください[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「この死」。ファラオは、目の前の致命的ないなごの災いとその被害を指していると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ですから今
  rationale: 接続詞と時間副詞をともに反映し、直前の告白を受けた切迫した願いへの移行を自然な日本語で示す。
- source_word: שָׂא נָא חַטָּאתִי
  choice: どうか…私の罪を赦し
  rationale: נשא は「上げる、担う」が基本義だが、「罪」を目的語とするここでは赦すことを表す慣用句。נָא の懇願も「どうか」で表した。
- source_word: אַךְ הַפַּעַם
  choice: 今回だけは
  rationale: 限定を表す אַךְ と「この時」を、現代日本語で自然に、かつファラオの求めが今回に限られることが分かる形にした。
- source_word: וְהַעְתִּירוּ
  choice: 切に祈って
  rationale: עתר のヒフィル形が表す熱心な嘆願・執り成しを、宗教的文脈に明瞭な「切に祈る」で表現した。複数命令形は文脈上モーセとアロンへの呼びかけとして保たれる。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: あなたがたの神ヤハウェに
  rationale: 神名 יהוה を「ヤハウェ」とし、אֱלֹהֵיכֶם の複数二人称接尾辞を「あなたがたの」として、ファラオの距離を置いた言い方を保持した。
- source_word: וְיָסֵר מֵעָלַי
  choice: 私から取り除いてくださるようにしてください
  rationale: 祈りの目的・期待される結果を表す接続形を「ように」とし、神の行為について自然な敬語を用いた。末尾の「してください」はモーセらへの依頼としての文全体の構造を明確にする。
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: この死だけでも
  rationale: 原文の「この死」という比喩的で切迫した表現を解釈しすぎず保持し、רַק の限定を「だけでも」で自然に表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の契約名が明記されているため、称号に置き換えず音写した。
- issue: 「この死」が指すもの
  choice: この死
  alternative: この致命的な災い／この災害
  rationale: 文脈上はいなごの災いとその致死的影響を指すが、原文自体は הַמָּוֶת「死」と述べるため、その強い表現と解釈上の幅を残した。
- issue: 神への願いとモーセらへの依頼の関係
  choice: 取り除いてくださるようにしてください
  alternative: 取り除いてくださいますように
  rationale: וְהַעְתִּירוּ はモーセらへの複数命令で、וְיָסֵר はその祈りによって神が取り除くことを願う形。日本語でも両者を混同しない構文とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、ファラオの切迫した懇願にふさわしい品位を保った。「この死」は説明的に言い換えず本文に残し、脚注で文脈を示した。
