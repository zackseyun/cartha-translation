source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: ja
  text: そこでモーセは、エジプトの地に向けて杖を差し伸べた。するとヤハウェは、その日一日と一晩じゅう、東風[a]をその地の上に吹き渡らせた。朝になると、東風はいなごを運んできていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「東からの風」。
    reason: רוּחַ קָדִיםは「東風」とも「東からの風」とも訳せるため。
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸ばした
  rationale: נטהの基本的な意味である「伸ばす」を、杖を掲げる災害物語の反復表現に即して自然に訳した。
- source_word: מַטֵּהוּ
  choice: 杖
  rationale: מַטֶּהは「杖」「棒」を意味するが、モーセが用いるものとして現代日本語で明瞭な「杖」を選んだ。
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: エジプトの地の上に
  rationale: 杖を向けて伸ばす動作との関係を示すעַלを「上に」とし、אֶרֶץを「地」と訳した。
- source_word: נִהַג
  choice: 送り続けた
  rationale: נהגは「導く、駆り立てる」を意味する。風を目的語とし、昼夜にわたる継続も自然に表せる日本語とした。
- source_word: רוּחַ קָדִים
  choice: 東風
  rationale: 東から吹く風を指す定型的な表現として、簡潔で自然な「東風」を採用した。
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: その日一日と夜通し
  rationale: 昼も夜も全期間にわたったという、כָּלの反復による強調を自然な日本語で保持した。
- source_word: הַבֹּקֶר הָיָה
  choice: 朝になると
  rationale: 直訳的には「朝になった」であり、物語の時間的推移を明瞭に示した。
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: いなごを運んできていた
  rationale: נשאの「運ぶ」という像を残しつつ、夜通し吹いた風の結果が朝には成立していたという文脈上の時間関係を表した。
- source_word: הָאַרְבֶּה
  choice: いなご
  rationale: 形は単数だが集合的に用いられており、日本語の「いなご」で群れ全体を自然に指せる。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の契約名として記された四文字神名を、称号に置き換えず音写した。
translation_notes:
  register: 明瞭で現代的ながら品位のある物語文とした。「その日一日と夜通し」で継続時間を強調し、「運んできていた」で朝までに生じた結果を示した。
