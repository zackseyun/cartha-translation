revisions:
- from: そこでモーセはエジプトの地の上に杖を伸ばした。するとヤハウェは、その日一日と夜通し、その地に東風[a]を送り続けた。朝になると、東風がいなごを運んできていた。
  to: そこでモーセは、エジプトの地に向けて杖を差し伸べた。するとヤハウェは、その日一日と一晩じゅう、東風[a]をその地の上に吹き渡らせた。朝になると、東風はいなごを運んできていた。
  rationale: 杖を伸ばす方向を「エジプトの地に向けて」として明確にし、ヤハウェが東風を駆り立てて地を吹き渡らせたという因果関係を表しました。朝までにいなごが到来していたという叙述上の時間関係は維持しています。
