  - severity: medium
    issue: 後半の統語と数量の係り方
    rationale: 「イスラエル人は皆、その住む所に光があった」はややぎこちなく、「皆」が人々に、「その住む所」が個々の人にどう係るかが一読で明瞭ではない。原文どおり、イスラエルの人々すべての居住地に光があったことを明示する。
  revised_text: 人々は互いを見ることがなく[a]、三日間、だれも自分のいる場所から立ち上がらなかった。しかし、イスラエルの人々すべての住む所には、光があった[b]。
