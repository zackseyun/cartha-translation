  source_fidelity: 原文は「だれも互いを見ず、だれも三日間その場所から立ち上がらず、しかしイスラエルの子らすべてにはその住む所で光があった」という対照を述べる。現行訳は全体としてこの意味をよく保っている。「互いの姿」は暗闇の文脈には合うが、原文の目的語は単に「互い（兄弟）」であり、「姿」を補わないほうがより忠実である。
  naturalness: 前半は自然である一方、「イスラエル人は皆、その住む所に光があった」は、「皆」の係り先と「その住む所に」の関係がやや不自然である。居住地を主題化して「イスラエルの人々すべての住む所には、光があった」とすれば、自然な現代日本語で原文の範囲も明瞭になる。
  terminology: 「イスラエル人」は民族共同体を指す文脈に適切である。脚注で「イスラエルの子ら」という原語の形を示す方針も妥当である。「光」「住む所」も原文の語義範囲を不必要に限定しない。
