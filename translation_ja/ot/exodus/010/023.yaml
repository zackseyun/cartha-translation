source:
  edition: WLC
  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: ja
  text: 人々は互いを見ることがなく[a]、三日間、だれも自分のいる場所から立ち上がらなかった。しかし、イスラエルの人々すべての住む所には、光があった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「人は自分の兄弟を見なかった」。ここでは「互いを見なかった」という相互的な意味で、実の兄弟に限定されない。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、直訳すると「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת אָחִיו
  choice: 互いの姿を見ることがなく
  rationale: אִישׁ אֶת־אָחִיו は相互性を表す慣用表現であり、実の兄弟に限定されない。「見えなかった」と能力の不可能性を明示せず、ヘブライ語が述べる結果を自然な日本語で表した。
- source_word: אִישׁ
  choice: 人々／だれも
  rationale: 男性だけを指す語ではなく、前半では相互的、後半では分配的・一般的に用いられているため、文脈に即して訳し分けた。
- source_word: קָמוּ
  choice: 立ち上がらなかった
  rationale: קום の基本義「起きる、立ち上がる」を保ち、単なる移動に狭めなかった。
- source_word: מִתַּחְתָּיו
  choice: 自分のいる場所から
  rationale: 字義的には「自分の下から」だが、この文脈では各人がいた場所を離れることを指す慣用的表現である。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三日間
  rationale: 継続期間を明確で自然な日本語として表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエル人
  rationale: 字義は「イスラエルの子ら」だが、ここでは民族共同体全体を指すため、現代日本語で明瞭な呼称を本文に採用し、原語の形は脚注に示した。
- source_word: הָיָה אוֹר
  choice: 光があった
  rationale: 所有を強める「光を持っていた」ではなく、各居住地に光が存在したというヘブライ語の表現を自然に保った。
- source_word: בְּמֹשְׁבֹתָם
  choice: その住む所に
  rationale: מוֹשָׁב は住居または居住地を指し得るため、家屋だけにも集落だけにも限定しない表現を選んだ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、災いの重々しさにふさわしい簡潔で格調ある叙述とした。「互いの姿」は暗闇の場面で自然だが、原文以上に「見ることが不可能だった」と断定しない表現である。
