source:
  edition: WLC
  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: ja
  text: いなごは全土の地表[a]を覆い、地は暗くなった。そして、地の草木と、雹が残した木の実をことごとく食べた。エジプト全土で、木にも野の草にも、緑のものは何一つ残らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「全土の目」。目に見える地面、すなわち地表を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: いなごは…覆い
  rationale: 動詞は単数形で、文脈上、集合体としてのいなごの群れを受ける。日本語では指示対象を明確にするため「いなごは」と補った。
- source_word: עֵין כָּל הָאָרֶץ
  choice: 全土の地表
  rationale: 直訳は「全土の目」だが、見えている地面・表面を指す慣用表現。「地表」は現代日本語として明瞭である。
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: 地は暗くなった
  rationale: 動詞の「暗くなる」という変化の意味を自然に表した。
- source_word: וַיֹּאכַל
  choice: 食い尽くした
  rationale: 基本義は「食べた」だが、目的語の全称表現と、何も残らなかったという後続文から、完全に食べたことを自然な日本語で示した。
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: 地の草木…ことごとく
  rationale: עֵשֶׂבは草に限らず地上の植物を広く指す。木の実との区別を保ちつつ、全称の意味を「ことごとく」で表した。
- source_word: כָּל פְּרִי הָעֵץ
  choice: 木の実…ことごとく
  rationale: 単数形のעֵץは集合的に用いられている。「木の実」は果実全般を自然に表す。
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: 雹が残した
  rationale: 先の災害を生き残ったものを指す関係節を、原文に沿って簡潔に訳した。
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: 緑のものは何一つ残らなかった
  rationale: 強い否定と結果状態を自然な日本語で再現し、יֶרֶקの広い意味も保った。
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: 木にも野の草にも
  rationale: 集合的単数を日本語で自然に表し、樹木と野の植物の双方を示した。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土で
  rationale: 領域全体に及んだことを明瞭かつ簡潔に表した。
theological_decisions: []
