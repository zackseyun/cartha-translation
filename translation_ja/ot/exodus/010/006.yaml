base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: ja
  text: それらは、あなたの家々、あなたのすべての家臣の家々、そしてエジプト全土の家々を満たす。これは、あなたの先祖も、そのまた先祖も、地上に住むようになった日から今日まで見たことのないものだ。」モーセは身を翻し、ファラオのもとから出て行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: それらは……満たす
  rationale: 前節のいなごを受ける複数主語を「それら」で示し、完了形に接続詞が付いた形の未来的な継続を自然な日本語で表した。
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: あなたの家々、あなたのすべての家臣の家々、そして全エジプト人の家々
  rationale: 三つの複数形と、ファラオから家臣、全エジプトへと広がる範囲を保った。「全エジプト」は日本語では家の所有者として不自然なため、「全エジプト人」と明示した。
- source_word: עֲבָדֶיךָ
  choice: あなたのすべての家臣
  rationale: 王宮の文脈ではファラオに仕える者たちを指す。「奴隷」と限定せず、現代日本語で王に仕える者を自然に表す「家臣」とした。
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: これは……見たことのないものだ
  rationale: 関係節が直前に告げられたいなごの災厄の前例のなさを述べるため、指示語を補って日本語として明瞭にした。
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: あなたの先祖も、そのまた先祖も
  rationale: 世代を広く遡るヘブライ語表現を保ち、「父や祖父」のように範囲を狭めない自然な表現とした。
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: この地に存在するようになった日から
  rationale: היותם の存在・居住の開始を表す含みを保持した。「生まれた日」とは限定せず、「存在するようになった」とした。
- source_word: הָאֲדָמָה
  choice: この地
  rationale: 語は「地」「大地」「地面」の意味を持ちうる。ここでは先祖が存在してきた場所を表す自然な訳として「この地」を選んだ。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 今日まで
  rationale: 時間的範囲を示す定型表現を、荘重さを保ちつつ現代日本語として簡潔に訳した。
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: こう言って、モーセは身を翻し、ファラオのもとから出て行った
  rationale: 連続する動作を保った。主語は文脈上モーセであり、日本語での明瞭さのため補った。「こう言って」は発言から退去への自然な接続を示す。
