id: EXO.10.8
reference: Exodus 10:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יּוּשַׁ֞ב אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם מִ֥י וָ/מִ֖י הַ/הֹלְכִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: ja
  text: そこで、モーセとアロンはファラオのもとに呼び戻された。ファラオは二人に言った。「行って、あなたがたの神ヤハウェに仕えよ。行くのは、いったい誰と誰なのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「行く者たちは、誰と誰なのか」。誰が行くことを許されるのか、具体的に示すよう求める表現。
    reason: ヘブライ語מִי וָמִיの反復表現と定冠詞付き分詞のニュアンスを説明するため。
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: 呼び戻された
  rationale: שׁובのホファル形が示す使役受動を自然な日本語で表し、モーセとアロンが他者によって戻されたことを明示する。
- source_word: אֶל־פַּרְעֹה
  choice: ファラオのもとに
  rationale: 移動の方向を示すאֶלを、人物を目的地とする自然な日本語で表した。
- source_word: לְכוּ עִבְדוּ
  choice: 行って、…仕えよ
  rationale: 二つの命令形を保つ。עבדは礼拝を含み得るが意味を狭めず、「仕える」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: 二人称男性複数接尾辞を複数形の「あなたがた」で明示した。
- source_word: מִי וָמִי
  choice: いったい誰と誰なのか
  rationale: 原文の反復的な「誰と誰」を保持しつつ、具体的な参加者を問いただす語気を「いったい」で自然に示した。
- source_word: הַהֹלְכִים
  choice: 行くのは
  rationale: 定冠詞付き分詞の名詞的用法を、行く者たちの特定を求める日本語の焦点構文で表した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は神の固有名を直接用いているため、称号へ置換せず音写した。
- issue: עבדの意味範囲
  choice: 仕える
  alternative: 礼拝する
  rationale: この文脈には礼拝の含意があるが、語の基本的な「仕える」という意味と物語上の反復を保ち、祭儀だけに限定しなかった。
translation_notes:
  register: 現代の標準的な日本語を用いながら、ファラオの命令と問いの威圧的で簡潔な調子を保った。「呼び戻された」により原文の受動性を示し、「誰と誰」で原文特有の問い方も本文に残した。
