  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: ja
  text: しかし、ヤハウェはファラオの心をかたくなにされた[a]。ファラオは彼らを去らせることに同意しなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心を強くされた／堅くされた」。ヘブライ語の動詞には「強くする、堅くする」という意味があるが、ここでは「心」とともに用いられ、意志をかたくなにすることを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らを去らせることを拒んだ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: かたくなにされた
  rationale: חזקは本来「強くする、堅くする」を意味するが、出エジプト記で「心」を目的語とする反復表現では、意志を頑なにする意味を表す。日本語では文脈に即して「心をかたくなにする」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、一般的な日本語表記で音写した。
- source_word: לֵב
  choice: 心
  rationale: ヘブライ語では感情だけでなく、意志や判断を含む人の内面を指す。聖書の慣用表現を保ちつつ自然な「心」とした。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として定着している現代日本語表記を用いた。
- source_word: לֹא אָבָה
  choice: しようとはしなかった
  rationale: אָבָהが表す意志・同意の欠如を明示し、単に行動しなかったのではなく、そうする意思がなかったことを表した。
- source_word: לְשַׁלְּחָם
  choice: 彼らを去らせる
  rationale: 出エジプト物語の文脈で、イスラエルの民を出発させることを指す。日本語として自然で、反復される要求の表現にも適合する。
theological_decisions:
- issue: 神による心の強化・頑なさとファラオ自身の意志
  choice: 「ヤハウェはファラオの心をかたくなにされた」と「ファラオは……しようとはしなかった」を並列して訳す。
  alternative: 「ヤハウェがファラオの心を強くされたので、彼は彼らを去らせることを拒んだ」
  rationale: 原文は神の働きを明言した後、ファラオの意志の欠如も述べている。明示されていない因果接続を加えず、神の主体的な働きとファラオの意志との緊張をそのまま保った。
translation_notes:
  register: 明快な現代標準日本語を用い、神の固有名は「ヤハウェ」とした。二つの節を別文にして双方の主語を明示し、原文にない因果関係を補わずに神学的緊張を保持した。「かたくな」は読みやすさを優先して平仮名表記とした。
