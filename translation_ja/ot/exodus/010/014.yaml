source:
  edition: WLC
  text: וַ/יַּ֣עַל הָֽ/אַרְבֶּ֗ה עַ֚ל כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יָּ֕נַח בְּ/כֹ֖ל גְּב֣וּל מִצְרָ֑יִם כָּבֵ֣ד מְאֹ֔ד לְ֠/פָנָי/ו לֹא הָ֨יָה כֵ֤ן אַרְבֶּה֙ כָּמֹ֔/הוּ וְ/אַחֲרָ֖י/ו לֹ֥א יִֽהְיֶה כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: ja
  text: いなごはエジプト全土に押し寄せ、エジプトの全域にとどまった。その数は非常に多かった[a]。これほどのいなごは、これ以前にはなく、これ以後にもないであろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「非常に重く」。ここでは、いなごが非常に多く、密集していたこと、またその襲来が甚だしかったことを表す。
    reason: כָּבֵד（「重い」）の字義と、この文脈で数量・密度および災厄の甚だしさを表し得る用法との関係を示すため。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上って来て
  rationale: עלהの上昇のイメージを保ちつつ、いなごがエジプト全土へ押し寄せる場面に自然な日本語とした。
- source_word: הָאַרְבֶּה
  choice: いなご
  rationale: 単数形だが集合的に侵来したいなご全体を指す。日本語の「いなご」は無標の形で集合的にも理解できるため、「大群」を本文に補わなかった。
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: エジプト全土に
  rationale: 前置詞עַלと「エジプトの全地」を、侵入の広がりが明瞭になる簡潔な日本語で表した。
- source_word: וַיָּנַח
  choice: とどまった
  rationale: נוחの「休む、落ち着く」の意味を、いなごが各地に降りて居つく文脈に即して表した。
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: エジプトの領土の至る所に
  rationale: גְּבוּלは境界だけでなく領域を意味する。ここでは国境線ではなくエジプト領内全体への分布を表すため、この訳を採った。
- source_word: כָּבֵד מְאֹד
  choice: 極めてすさまじく
  rationale: 直訳の「非常に重い」は日本語では不自然であるため、襲来の規模と深刻さの双方を含み得る表現とした。数量だけに限定しないよう「おびただしい」とは断定しなかった。
- source_word: לְפָנָיו ... וְאַחֲרָיו
  choice: それ以前にもなく、それ以後にもない
  rationale: 前後を対にした未曾有性の表現を保ち、接尾辞はこのいなごの襲来を指すものとして自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての厳粛さを保った。「大群」や「被害」など原文に明示されない名詞は補わず、כָּבֵד מְאֹדの意味の幅は本文と脚注で示した。
