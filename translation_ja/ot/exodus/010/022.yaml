base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: ja
  text: そこでモーセは手を空に向けて伸ばした[a]。すると、エジプト全土に三日間、深い闇[b]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天に向けて」とも訳せる。ヘブライ語は文脈により「空」または「天」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「濃い闇」とも訳せる。原文では「闇」に、暗黒や深い闇を表す語を重ねて、その激しさを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸ばした
  rationale: נטה はこの身振りの文脈で、手をある方向へ「伸ばす」ことを表す。自然な現代日本語で動作を明確に伝える。
- source_word: יָדוֹ
  choice: 手を
  rationale: יָד の通常の意味である「手」をそのまま採用した。
- source_word: עַל הַשָּׁמָיִם
  choice: 空に向けて
  rationale: עַל はここでは手を伸ばす方向を示すと理解でき、שָּׁמַיִם は災いの場面では「空」が自然である。ただし「天」の可能性を脚注に残した。
- source_word: וַיְהִי
  choice: すると、…覆われた
  rationale: 結果として闇が生じたことを、日本語では自然な出来事の推移として表現した。
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: 深い闇
  rationale: 「闇」と、暗黒・濃い闇を表す語の重なりによる強調を、簡潔で格調ある「深い闇」で表した。別の表現可能性は脚注に示した。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: エジプト全土は…覆われた
  rationale: 直訳的な「エジプトの全地」を、意味を保ちながら自然な現代日本語の「エジプト全土」とした。「覆われた」は闇が全域に及んだ状態を明瞭にする。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三日間
  rationale: 期間を表す自然な日本語である。
