source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: ja
  text: しかしモーセは言った。「あなたも、いけにえと全焼のささげ物を私たちの手に渡さなければなりません。私たちはそれらを、私たちの神ヤハウェ[a]にささげます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文には、神の固有名を表す四文字יהוה（YHWH）が記されている。ここでは「ヤハウェ」と表記した。
    reason: 神名の原文表記と訳し方を読者に示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかしモーセは言った
  rationale: 接続形は物語を進めるが、ここではファラオが示した制限に対する反論なので、文脈上の対照を自然な日本語の「しかし」で表した。
- source_word: גַּם אַתָּה
  choice: あなたも
  rationale: גַּםの付加・強調と、独立代名詞אַתָּהの強意を簡潔に保ち、ファラオ自身も必要な供え物を渡すべきだという意味を示した。
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: 私たちの手に渡していただかなければなりません
  rationale: נתןの「与える」とבְּיָדֵנוּの具体的な「私たちの手に」という像を保った。「なければなりません」により、単なる未来予告ではなく文脈上の強い要求を表した。敬語はモーセが王に語る場面にふさわしい自然な日本語としたもので、要求の強さは弱めていない。
- source_word: זְבָחִים
  choice: いけにえ
  rationale: 屠ってささげる犠牲を広く指す語であり、現代日本語で理解しやすい伝統的な祭儀用語を用いた。
- source_word: וְעֹלֹת
  choice: 全焼のささげ物
  rationale: 祭壇で全体を焼くעֹלָהの特徴を明示し、「焼き尽くすささげ物」より簡潔で自然な表現とした。
- source_word: וְעָשִׂינוּ
  choice: 私たちはそれを…ささげます
  rationale: 直訳は「行う／作る」だが、祭儀の文脈では犠牲を執行してささげる意味である。「それを」を補い、日本語として対象との関係を明瞭にした。
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: 私たちの神ヤハウェに
  rationale: 前置詞לְの受け手・方向を「に」で表し、固有の神名יהוהを称号に置き換えず「ヤハウェ」と音写した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に記された四文字神名を固有名として保つ。「主」は伝統的な代読を表すが固有名を称号に置き換え、「エホバ」は後代の母音を組み合わせた形なので、本文では一般的な学術的音写「ヤハウェ」を用いた。
- issue: וְעָשִׂינוּの祭儀的意味
  choice: ささげます
  alternative: 行います／作ります
  rationale: 動詞自体は広い意味を持つが、目的語に「いけにえと全焼のささげ物」が置かれるため、ここでは祭儀を執行する意味が文脈上明らかである。特定の祭儀神学を付加せず、自然な日本語にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、王に対するモーセの発言として丁寧な語調を保った。「私たちの手に」で原文の具体的な表現を残し、「いけにえ」「全焼のささげ物」で二つの祭儀語を区別した。
