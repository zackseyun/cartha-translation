base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: ja
  text: そこでヤハウェはモーセに言われた。「イナゴに向けて[a]、エジプトの地の上に手を伸ばしなさい。イナゴがエジプトの地に上って来て、雹が残したエジプトの地のすべての草木を食べるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イナゴに向けて」と訳したヘブライ語の前置詞は解釈が難しく、「イナゴのために」「イナゴに対して」「イナゴの上に」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって表した。
- source_word: נְטֵה יָדְךָ
  choice: 手を伸ばしなさい
  rationale: 命令形と身体語を保ちつつ、現代日本語として自然に表した。
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: エジプトの地の上に
  rationale: אֶרֶץを「地」とし、עַלの空間的意味と句の反復を保持した。
- source_word: בָּאַרְבֶּה
  choice: イナゴのために
  rationale: 前置詞בְּの解釈が難しいため、イナゴを目的・対象とする表現を本文に採用し、他の可能性を脚注に示した。
- source_word: אַרְבֶּה
  choice: イナゴ
  rationale: ヘブライ語では単数形だが群れ全体を集合的に指す。日本語の「イナゴ」は数を明示せず自然に集合を表せる。
- source_word: וְיַעַל
  choice: 上って来て
  rationale: עלהの基本的な方向性を保ち、エジプトの地へ襲来する文脈に即して「来て」を補った。
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: この地のすべての草木
  rationale: עֵשֶׂבは草だけでなく植生を広く指し得るため、農作物を含む自然な総称として「草木」を選んだ。
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: すなわち、雹が残したものをことごとく
  rationale: 直前の「すべての草木」を具体化する同格的な関係と、先の雹の災害後に残ったものすべてという意味を明確にした。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名としての性格を保ち、称号への置換や特定の教派的伝統への依存を避けた。
- issue: イナゴを表す単数形の理解
  choice: 群れを集合的に指す「イナゴ」
  alternative: 一匹のイナゴ、イナゴの大群
  rationale: 後続の単数動詞との文法的一致を尊重しつつ、災害として多数のイナゴを指す集合名詞の用法を日本語で自然に表した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。神の命令としての簡潔さを保ち、原文の反復と災害の連続性をできる限り残した。「食い尽くす」は結果を強めるため避け、原語אכלに即して「食べる」とした。
