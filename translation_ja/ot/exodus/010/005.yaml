  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: ja
  text: いなごの群れが地の表面を覆い[a]、地が見えなくなる。それは、雹の害を免れてあなたがたに残っているものを食べ[b]、野にあなたがたのために生えているすべての木を食べる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「地の目」。地の見えている表面を指すヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「雹を逃れ、あなたがたに残っている、逃れたものの残りを食べる」。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: 覆い
  rationale: כסהの基本義「覆う」をそのまま用いる。文脈上、来たるいなごについての予告なので、日本語では前節から続く主語「いなご」を補って理解できる形とした。
- source_word: עֵין הָאָרֶץ
  choice: 地の表面
  rationale: 字義は「地の目」だが、見えている地表を指すヘブライ語の慣用表現であるため、自然で明瞭な「地の表面」とした。
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: 地面が見えなくなるほどになる
  rationale: 原文は不定人称的な単数「地を見ることができない」。日本語では受け身的な表現が自然であり、いなごが地表を覆う結果を明確に示す。
- source_word: וְאָכַל
  choice: 食い尽くし
  rationale: 基本義は「食べる」だが、災害として残存作物を食べる文脈では「食い尽くす」が自然で、被害の全面性も伝える。原文の集合単数は日本語で前節の複数的な「いなご」を受けて表した。
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת
  choice: 免れて…残されたもの
  rationale: 「逃れたものの残り、残っているもの」という重なりを、日本語として不自然にならない範囲で「免れて…残されたもの」と表した。文脈上、人ではなく雹を生き残った農作物を指す。
- source_word: לָכֶם מִן הַבָּרָד
  choice: 雹を免れてあなたがたに残された
  rationale: מןはここで雹の被害から残ったことを示す。「あなたがたに」はלכםを保持し、エジプト人のために残存していたものという関係を表す。
- source_word: כָּל הָעֵץ
  choice: 木をすべて
  rationale: עץは単数形だが集合的・配分的に用いられているため、「すべての木」に相当する自然な日本語とした。
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: 野に生えているあなたがたの木
  rationale: צמחは「芽生える、育つ」。מן השדהは字義的には「野から」だが、ここでは生育場所を自然な日本語の「野に」で示す。לכםは所有・受益関係を「あなたがたの」とした。
