  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: ja
  text: 彼は彼らに言った。[a]「私がおまえたちと幼い子どもたちを行かせるなら、ヤハウェが確かにおまえたちと共におられるように！　見よ。[b]災いがおまえたちの目の前にある。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「おまえたちと幼い子どもたちを行かせるとき、ヤハウェがおまえたちと共におられるように」。おそらく皮肉を込めた言葉。
    reason: alternative_reading
  - marker: b
    text: ヘブライ語は曖昧で、「災いがおまえたちを待ち受けている」とも、「おまえたちは悪事を企んでいる」とも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: ヤハウェが確かにおまえたちと共におられるように
  rationale: 願望を表す יְהִי と強調的な כֵן を反映しつつ、ファラオの皮肉は文脈から伝わる形にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を固有名として音写した。
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: 私が……行かせるというなら
  rationale: כַּאֲשֶׁר は通常「～するとき／～するように」だが、ここでは敵対的で皮肉な発言の条件的な含みを自然な日本語で表した。別の構文理解は脚注に示した。
- source_word: טַפְּכֶם
  choice: おまえたちの幼い子どもたち
  rationale: טַף が特に幼い子どもを指す語感を保持した。
- source_word: רְאוּ
  choice: 見よ
  rationale: 命令形を直接反映し、注意や警告を促す響きを持たせた。
- source_word: רָעָה נֶגֶד פְּנֵיכֶם
  choice: 災いがおまえたちの目の前にある
  rationale: רָעָה の「悪／災い」と נֶגֶד פְּנֵיכֶם の「顔の前に」を比較的直訳し、迫る災難と悪意の指摘との曖昧さを脚注で補った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名としての性格を明示するため、ヤハウェとした。
- issue: ファラオの警告における רָעָה の解釈
  choice: 災いがおまえたちの目の前にある
  alternative: おまえたちは悪事を企んでいる
  rationale: 原文は、災難が待ち受けるとの脅しとも、彼らの悪意が明白だとの非難とも取れるため、一方に限定せず脚注で両義性を示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ファラオの尊大で威圧的な口調を「おまえたち」で表した。本文は簡潔で格調ある語調とし、原文の皮肉と末尾の曖昧さを過度に解消しないようにした。
