  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: ja
  text: そこでファラオは急いでモーセとアロンを呼び寄せ、言った。「私はあなたがたの神、ヤハウェに対して、またあなたがたに対して罪を犯した。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急いで
  rationale: מהרの「急ぐ、素早く行動する」という意味と、事態の切迫感を自然な現代日本語で表す。
- source_word: לִקְרֹא לְמֹשֶׁה וּלְאַהֲרֹן
  choice: モーセとアロンを呼び寄せ
  rationale: ここでのקראは単に声をかけることではなく、二人を自分のもとへ来させることを指すため、「呼び寄せる」とした。
- source_word: חָטָאתִי
  choice: 私は…罪を犯した
  rationale: חטאの宗教的・道徳的な重みを弱めず、完了した行為についての告白として明確に訳した。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: あなたがたの神ヤハウェに対して
  rationale: לはここでは罪を犯した相手を示す。「あなたがたの」は複数二人称接尾辞を保ち、ファラオがヤハウェを自分の神とは呼んでいない点も維持した。
- source_word: וְלָכֶם
  choice: またあなたがたに対して
  rationale: 複数形がモーセとアロンの双方を指すことを明示し、先行する「に対して」との並行も保った。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の神名יהוהが明記されているため、称号に置き換えず、日本語で一般的な学術的音写「ヤハウェ」とした。
- issue: ファラオの告白におけるלの解釈
  choice: …に対して罪を犯した
  alternative: …に罪を犯した
  rationale: חטאに続くלは、罪によって害された、または背かれた相手を示す。日本語では「に対して」がその関係を明確かつ自然に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の進行を「そこで」でつなぎ、ファラオの切迫した行動と率直な告白を簡潔に表現した。
