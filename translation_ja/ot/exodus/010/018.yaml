  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ja
  text: そこでモーセはファラオのもとを出て、ヤハウェに切に祈った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェに嘆願した」「ヤハウェに懇願した」。ヘブライ語の動詞は、切実に願い求めることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て
  rationale: יצאのカル・ワイイクトルで、物語の進行に沿った具体的な退出を表す。現代日本語として自然な「出て」とした。
- source_word: מֵעִם פַּרְעֹה
  choice: ファラオのもとを
  rationale: מֵעִםはファラオと共にいる場から離れること、すなわちその面前から退出することを表す。「のもとを出て」でその関係と移動を自然に示した。
- source_word: וַיֶּעְתַּר
  choice: 切に祈った
  rationale: עתרは神に向けた真剣な嘆願・懇願を表す。この文脈では祈りであることを明示しつつ、その切実さを「切に」で保持した。
- source_word: אֶל
  choice: に
  rationale: 嘆願の向かう相手を示す前置詞であり、日本語では「ヤハウェに祈る」が自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を直接用いているため、その区別を保つ音写を採用した。
- issue: וַיֶּעְתַּר の祈りとしての明示
  choice: 切に祈った
  alternative: 嘆願した／懇願した
  rationale: 語には切実な嘆願の含みがあり、相手がヤハウェであるこの文脈では祈りを指す。「切に祈った」は行為の宗教的文脈と語の強さをともに伝える。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、神名と嘆願の切実さを保持した。「そこで」は前節を受ける物語上の連続を示す。
