source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: ja
  text: そこで、モーセとアロンはファラオのもとに行き、彼に言った。「ヘブライ人の神、ヤハウェはこう言われる。『いつまであなたは、わたしの前にへりくだることを拒むのか。[a] わたしの民を行かせ、わたしに仕えさせよ。[b]』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしに服する」とも訳せる。ヘブライ語の動詞には、神の前で低くされる、または自らへりくだるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「わたしを礼拝させよ」とも訳せる。この動詞は、礼拝としての奉仕をも含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: もとに行き
  rationale: בוא＋אֶלは人のもとへ行く、またはその面前に入ることを表す。日本語では宮廷への出頭を不自然に強調せず、「ファラオのもとに行き」とした。
- source_word: כֹּה אָמַר
  choice: こう言われる
  rationale: 神の使者が告げる定型句。日本語では引用導入として自然で、神への敬意も保つ現在的表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ヘブライ人の神
  rationale: エジプト側に対してヤハウェを民族との関係で示す連語を簡潔に再現した。
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: いつまで、あなたは…拒むのか
  rationale: 完了形は過去から続く拒絶を背景にした現在的な叱責であり、日本語の「いつまで…拒むのか」が継続性を自然に表す。
- source_word: לֵעָנֹת מִפָּנָי
  choice: わたしの前にへりくだる
  rationale: ענהのニファルが持つ、低くされる／自らを低くする／服するという幅を踏まえ、文脈上自然な自発的意味を本文に置いた。
- source_word: שַׁלַּח עַמִּי
  choice: わたしの民を去らせ
  rationale: 繰り返される出エジプトの要求として、拘束を解いて行かせる意味を自然な日本語で表した。
- source_word: וְיַעַבְדֻנִי
  choice: わたしに仕えさせよ
  rationale: עבדの広い「仕える」を保ちつつ、ここで含意される礼拝的奉仕を注で示した。前の命令との目的関係も日本語で明確にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文の固有名を称号に置換せず音写し、神名として提示した。
- issue: לֵעָנֹת の態の解釈
  choice: へりくだる
  alternative: 低くされる／服する
  rationale: ファラオの継続的拒絶を問う文脈では自発的に身を低くする意味が自然だが、ヘブライ語の態に残る幅は注記した。
- issue: וְיַעַבְדֻנִי の意味
  choice: わたしに仕える
  alternative: わたしを礼拝する
  rationale: 礼拝を含み得るが、それに限定されない「奉仕」の語義範囲を本文で保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、神の発言には自然で品位ある敬語「言われる」を採用した。ファラオへの二人称は「あなた」とし、命令は格調を保つ「去らせ…仕えさせよ」とした。
