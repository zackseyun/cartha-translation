source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: ja
  text: そこでファラオはモーセを呼び寄せて言った。「行って、ヤハウェに仕えよ。ただし、あなたがたの羊や山羊の群れと牛の群れは残しておけ[a]。幼い子どもたち[b]も、あなたがたと一緒に行ってよい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「そこに置かれたままにせよ」。または「残していけ」。
    reason: lexical_alternative
  - marker: b
    text: 「家族の幼い者たち」とも訳せる。ヘブライ語は、文脈によって扶養される者たちを広く含むことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: ファラオはモーセを呼び寄せて
  rationale: קרא אל はこの場面では、相手を呼んで話すことを表す。「呼び寄せて」は、直後にファラオがモーセへ告げる自然な物語の流れを示す。
- source_word: לְכוּ עִבְדוּ אֶת יְהוָה
  choice: 行って、ヤハウェに仕えよ
  rationale: עבד の基本的な「仕える」を保ち、イスラエルがファラオではなくヤハウェに仕えるという出エジプト記の反復主題も伝える。文脈上は礼拝を含むが、「礼拝せよ」だけに限定しない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で一般的な形に音写した。
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: あなたがたの羊や山羊の群れと牛の群れ
  rationale: צֹאן は主に羊と山羊から成る小型家畜、בקר は主に牛類を指す。日本語では家畜の種類を明示しつつ、両語の集合的意味を「群れ」で表した。
- source_word: יֻצָּג
  choice: 残しておけ
  rationale: יצג のホファル形は、家畜がその場に置かれたままになることを表す。ファラオの命令として自然な日本語にしたが、受動・結果的な意味は脚注で補った。
- source_word: גַּם טַפְּכֶם יֵלֵךְ עִמָּכֶם
  choice: 幼い子どもたちも、あなたがたと一緒に行ってよい
  rationale: טַף はとりわけ幼い子どもたちを指す集合名詞であり、単数動詞とも一致する。גַּם は、家畜を残すという制限の一方で、子どもたちの同行を認める追加的・譲歩的な意味として「も」とした。未完了形はこの許可の文脈で「行ってよい」と表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は固有の神名を用いているため、称号「主」に置き換えず音写し、本文における契約の神の個人名を保った。
- issue: עבד の意味範囲
  choice: 仕える
  alternative: 礼拝する
  rationale: この動詞は神への礼拝を含みうるが、出エジプト記ではファラオへの隷属とヤハウェへの奉仕の対照も担う。「仕える」はその幅と緊張を保持する。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ファラオの命令にふさわしい簡潔で威厳ある「〜せよ／〜おけ」を用いた。「羊や山羊の群れと牛の群れ」はやや明示的だが、二つの家畜語の区別を自然な日本語で保つ。脚注記号 [a]、[b] は該当語句の直後に配置した。
