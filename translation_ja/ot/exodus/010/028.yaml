language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: ja
  text: そこでファラオはモーセに言った。「私の前から立ち去れ。よく気をつけろ。二度と私の顔を見てはならない。おまえが私の顔を見る日には[a]、おまえは死ぬ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の顔を見る」は、「私の面前に出る」という意味にも取れる。原文では「顔」という語が繰り返されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: そこでファラオはモーセに言った
  rationale: 物語を進める接続形を「そこで」で表した。לוֹは字義的には「彼に」だが、文脈上の指示対象であるモーセを明示し、現代日本語として自然で分かりやすくした。
- source_word: לֵךְ מֵעָלַי
  choice: 私の前から立ち去れ
  rationale: 強い退去命令として自然な日本語にしつつ、「私のもとから離れよ」という原文の空間的・対人的な意味を保った。
- source_word: הִשָּׁמֶר לְךָ
  choice: よく気をつけろ
  rationale: 自分自身に注意せよという警告と、ファラオの威圧的な口調を明確に表した。
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: 二度と私の顔を見てはならない
  rationale: 「加えて見るな」というヘブライ語の慣用表現を、意味を損なわない自然な日本語で「二度と」と訳した。「顔」は後半との反復を保つため維持した。
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: おまえが私の顔を見る日には
  rationale: בְּיוֹםの「その日には」という厳粛な時間表現を保持し、単なる「見るとき」よりも原文の脅迫的な響きを残した。
- source_word: תָּמוּת
  choice: おまえは死ぬ
  rationale: 強い断定を伴う死の予告・脅迫として、簡潔な現代日本語で表した。
theological_decisions:
- issue: 「顔」が身体的な顔を見ることか、王の面前に出ることか
  choice: 本文では原文どおり「顔」を二度とも保持した
  alternative: 「私の前に出る」「私の面前に現れる」
  rationale: פָּנַיには「面前・臨在」の換喩的意味もあり得るが、原文が同じ語を反復する修辞を保ち、意味を一方に限定しないため。
translation_notes:
  register: ファラオの激しい退去命令と脅迫を示すため、引用内は「立ち去れ」「気をつけろ」「おまえ」と強い常体にした。古風すぎる表現は避けつつ、原文の「顔」の反復と「見る日には」という厳粛な言い回しを保持した。
