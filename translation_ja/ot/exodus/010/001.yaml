  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: ja
  text: ヤハウェはモーセに言った。「ファラオのもとへ行きなさい。わたしが彼の心とその家臣たちの心をかたくなにしたのは[a]、これらのわたしのしるしを彼のただ中に置くためである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の心を重くした」。これは、心を鈍くし、応じようとしない状態にしたことを表す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼のただ中に」。ここで「彼」がファラオだけを指すのか、家臣や宮廷を含むファラオの周囲を指すのかは、どちらとも取り得る。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ファラオのもとへ行きなさい
  rationale: בוא は「来る／行く」を表し得る。この場面では、モーセがファラオのもとへ赴くよう命じられているため、自然な日本語で方向を示した。
- source_word: הִכְבַּדְתִּי
  choice: かたくなにした
  rationale: 字義は「重くした」だが、心を反応しにくく頑なにするというヘブライ語の慣用表現を明瞭に伝える。神がそうしたという本文の直接的な帰属は弱めない。
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: 彼の心とその家臣たちの心
  rationale: לֵב は意志や思考を含む内面を指すが、ここでは慣用的で神学的響きも保つ「心」とした。עֲבָדָיו は王宮の文脈に即して「家臣たち」とした。
- source_word: לְמַעַן
  choice: ためである
  rationale: 目的を表す接続表現の力を保ち、神が心をかたくなにした目的へ明確につないだ。
- source_word: שִׁתִי
  choice: 置く
  rationale: שׂים の基本義「置く／据える」を保った。しるしを実現する意味も含み得るが、本文では過度に説明的な訳を避けた。
- source_word: אֹתֹתַי אֵלֶּה
  choice: これらのわたしのしるし
  rationale: 指示語と一人称所有接尾辞の双方を明示した。
- source_word: בְּקִרְבּוֹ
  choice: そのただ中に
  rationale: 単数形を直ちに複数へ解消せず、「彼／そのただ中」という原文の曖昧さを日本語でも可能な限り保持した。
theological_decisions:
- issue: 神がファラオの心をかたくなにしたこと
  choice: わたしが彼の心とその家臣たちの心をかたくなにした
  alternative: わたしが彼の心とその家臣たちの心を重くした
  rationale: 原文は行為をヤハウェに直接帰している。その表現を弱めず、神の主権と人間の責任の関係について、この節が明言しない説明を訳文へ加えない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、物語文としての簡潔さと威厳を保った。「そのただ中に」はやや改まった表現だが、単数形の指示対象にある原文の曖昧さを保つために採用した。
