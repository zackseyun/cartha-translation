id: EXO.10.7
reference: Exodus 10:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: ja
  text: そこで、ファラオの家臣たちは彼に言った。「いつまで、この男[a]は私たちのわな[b]となるのでしょうか。あの男たち[c]を行かせ、彼らの神ヤハウェ[e]に仕えさせてください[d]。エジプトが滅びたことが、まだお分かりにならないのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「これ」。文脈上、モーセを指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「仕掛け」。人を捕らえる「わな」の比喩。
    reason: lexical_alternative
  - marker: c
    text: 原文は「その男たち」。ここを「民」または「人々」と広く訳すこともある。
    reason: lexical_alternative
  - marker: d
    text: 「仕える」は、神への奉仕と礼拝の両方を含み得る。別訳「礼拝させてください」。
    reason: lexical_alternative
  - marker: e
    text: 原文は神の固有名יהוה（YHWH）。伝統的に「主」と訳されることもある。
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: ファラオの家臣たち
  rationale: 直訳的な「僕たち」よりも、王宮でファラオに進言する者たちという文脈が明確になる「家臣たち」を採用した。「役人たち」ほど職制を限定しない。
- source_word: עַד מָתַי
  choice: いつまで
  rationale: 継続する事態への苛立ちを表すヘブライ語の問いを、自然な現代日本語で表した。
- source_word: זֶה
  choice: この男
  rationale: 単独の指示詞「これ」は文脈上モーセを指す。日本語で人を指すことと厳しい語調を明確にするため「この男」とした。
- source_word: לְמוֹקֵשׁ
  choice: わな
  rationale: מוֹקֵשׁの具体的な比喩を保ち、「災いの種」などの説明的な意訳を避けた。
- source_word: שַׁלַּח
  choice: 行かせ
  rationale: ここでは拘束を解いて去らせる命令。「解放する」より文脈に自然で、「送り去る」ほど排斥的に限定しない。
- source_word: הָאֲנָשִׁים
  choice: あの男たち
  rationale: 原文は男性複数の名詞であり、「民」と一般化せず性別を保持した。日本語では既知の一団を指す自然な表現として「あの」を補った。
- source_word: וְיַעַבְדוּ
  choice: 仕えさせてください
  rationale: עבדは神を目的語とすると礼拝を含む奉仕を表し得る。「仕える」によって語義の幅を保ち、発話者が王に進言する日本語として丁寧な命令表現にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名יהוהを日本語で一般的な形に音写した。
- source_word: הֲטֶרֶם תֵּדַע
  choice: まだお分かりにならないのですか
  rationale: 単なる情報確認ではなくファラオをいさめる反語的な問いを、王への敬意を保つ自然な日本語で表した。
- source_word: אָבְדָה מִצְרָיִם
  choice: エジプトが滅びた
  rationale: 完了形が示す、災害によってすでに破滅的状態に陥ったという結果を簡潔に表した。完全消滅を必ずしも意味しない。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を用いていることを読者に示すため、称号「主」ではなく音写を採用した。
- issue: הָאֲנָשִׁיםの範囲と性別
  choice: あの男たち
  alternative: 民／人々
  rationale: 原文は明示的に男性複数であるため、その限定を保持した。より広いイスラエルの民全体を暗黙に読み込まない。
- issue: עבדの宗教的含意
  choice: 仕える
  alternative: 礼拝する
  rationale: この動詞は神への奉仕と礼拝の双方を含み得る。「仕える」として意味を一方に限定せず、注で別訳を示した。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある物語文とした。家臣から王への発言なので敬語を用いたが、切迫した非難の力は疑問文に残した。「この男」「わな」という原文の厳しい比喩と、「男たち」という男性複数の限定を保持した。
