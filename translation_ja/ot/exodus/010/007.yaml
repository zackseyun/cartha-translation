  terminology: 「ファラオ」「ヤハウェ」「仕える」は一貫して適切である。יַהוֶהの固有名を「ヤハウェ」とし、「男たち」によって אַנָשִׁים の男性複数を不必要に一般化していない。脚注は各アンカーに対応し、本文の選択を適切に補足している。
