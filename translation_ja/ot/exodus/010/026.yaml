source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: ja
  text: 私たちの家畜も一緒に行きます。ひづめ一つさえ残しません。その中から取って、私たちの神ヤハウェに仕えなければならないからです[a]。そこに着くまで、何をもってヤハウェに仕えるべきか、私たちには分からないのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの神ヤハウェを礼拝するためです」、また後半は「何をもってヤハウェを礼拝すべきか」とも訳せる。ヘブライ語の動詞には「仕える」と「礼拝する」の両方の意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: 私たちの家畜
  rationale: מִקְנֶהは所有される家畜全般を集合的に指すため、牛などに限定しない「家畜」とした。
- source_word: יֵלֵךְ עִמָּנוּ
  choice: 一緒に行きます
  rationale: 移動と同行を表す簡明な表現。文脈上の断固とした意思は後続の否定文からも明確である。
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: ひづめ一つさえ残しません
  rationale: פַּרְסָהの具体的な比喩を保ち、否定文中の単数形が持つ「一つたりとも」という強調を「さえ」で自然に表した。
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: その中から取って、…からです
  rationale: 原文では取る対象が明示されていないため、「必要なもの」などを補わず、家畜の中から取るという構造を保った。後続の目的句との関係は日本語の連用形で示した。
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: 私たちの神ヤハウェに仕えなければならない
  rationale: עבדの基本的な広がりと後半での反復を保つため「仕える」とした。文脈上の必要性を「なければならない」で示した。
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: 私たちには分からない
  rationale: 目的地に着くまで続く現在の認識不足を、自然な現代日本語で表した。
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: 何をもってヤハウェに仕えるべきか
  rationale: מַהを文脈上の道具・手段として取り、どの家畜等を用いるか分からないという具体性を保った。「どのように」と抽象化しなかった。
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: そこに着くまで
  rationale: בואと方向を示すשָׁמָּהを、目的地への到着を表す自然な日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、日本語で一般的な学術的音写によって示した。
theological_decisions:
- issue: 犠牲を伴う礼拝の文脈におけるעבדの訳
  choice: 仕える
  alternative: 礼拝する
  rationale: この文脈では「礼拝する」も可能だが、「仕える」は語のより広い意味と二度の反復を保ち、祭儀だけに意味を狭めない。脚注で文脈上の別訳を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ひづめ一つさえ」で原文の具体的で強い否定を残し、עבדの反復は二箇所とも「仕える」で統一した。
