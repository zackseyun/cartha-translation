source:
  edition: WLC
  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: ja
  text: 「いや、そうはいかない。今、男たちだけが行って、ヤハウェに仕えよ。[a] それが、あなたがたの求めていることなのだから。」すると、彼は彼らをファラオの前から追い出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「男たち」は男性を指す。ファラオは、女や子どもを含む民全体ではなく、男性だけが行くことを認めようとしている。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: いや、そうはいかない
  rationale: 直前の要求を退ける、ぶっきらぼうで強い拒絶。「いや」だけよりも כֵן を反映しつつ、現代日本語として自然にした。
- source_word: לְכוּ נָא
  choice: 今すぐ行き
  rationale: נָא は懇願、語調の緩和、促しを表し得るが、ここではファラオの切迫した命令口調に合わせて「今すぐ」とした。
- source_word: הַגְּבָרִים
  choice: 男たちだけで
  rationale: גְּבָרִים はここで、民全体ではなく男性に限定する。「だけで」は原文の名詞自体にはないが、直前の要求との対照による限定を日本語で明確にする。
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: ヤハウェに仕えよ
  rationale: עבד の礼拝と奉仕の両面を保つため「仕える」とし、神名は固有名として音写した。
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: それこそ、あなたがたが求めていたことではないか
  rationale: 女性単数代名詞の明示されない先行内容を「それ」で保ち、ファラオが相手の要求を限定的に言い換える語調を自然な日本語で示した。
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: 彼らは……追い出された
  rationale: ヘブライ語は単数の行為者を明示せず、文脈上ファラオまたはその命令による追放を指す。日本語では受動形にして、不必要に直接の行為者を確定しない。
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: ファラオの前から
  rationale: 宮廷でファラオの面前から退去させられたことを、原文の空間的表現に近く簡潔に表す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された契約の固有名を保持し、日本語で一般的な学術的音写を用いる。
- issue: ファラオが許可する者の性別上の限定
  choice: 男たちだけで
  alternative: 男たちは
  rationale: 原文の הַגְּבָרִים は男性を指し、家族全体を行かせる要求に対する部分的譲歩である。この物語上の緊張を曖昧にしない。
- issue: 追放の行為者
  choice: 受動形「追い出された」
  alternative: ファラオは彼らを追い出した
  rationale: 動詞は三人称男性単数だが主語名詞がなく、ファラオ自身の行為とも、その権威による行為とも理解できるため、直接の行為者を過度に特定しない。
translation_notes:
  register: ファラオの拒絶と命令は短く強い口調にしつつ、聖書本文としての品位を保った。「仕えよ」はやや格調のある命令形だが、現代の読者にも理解可能であり、עבד の奉仕・礼拝双方の含みを保つ。
