revisions:
- from: するとヤハウェは風向きを変え、非常に強い西風[a]を起こされた。その風はいなごを運び去り、葦の海[b]へ吹き落とした。エジプト全土には、いなごは一匹も残らなかった。
  to: するとヤハウェは風向きを変え、非常に強い西風[a]を起こした。その風はいなごを運び去り、葦の海[b]へ追いやった。エジプト全土には、いなごは一匹も残らなかった。
  rationale: 海へ向けていなごを強制的に移動させる原文の動作を、「吹き落とした」ではなく「追いやった」として過剰な意味を避けた。あわせて叙述の文体を統一した。西風という文脈的理解、神名、および地名の脚注は維持した。
