source:
  edition: WLC
  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: ja
  text: するとヤハウェは風向きを変え、非常に強い西風[a]を起こした。その風はいなごを運び去り、葦の海[b]へ追いやった。エジプト全土には、いなごは一匹も残らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「海の風」。この文脈では、海から吹く西風を指すと考えられる。
    reason: ヘブライ語の字義と、文脈に即した方角表現との関係を示すため。
  - marker: b
    text: ヘブライ語では「葦の海」。伝統的には「紅海」と訳される。
    reason: 原語に沿った地名と、広く知られた伝統的名称の対応を示すため。
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: 風向きを変え
  rationale: הפך の「向きを変える、転じる」という意味を、風について自然な現代日本語で表した。直前までの東風との転換も文脈上明瞭になる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: רוּחַ יָם חָזָק מְאֹד
  choice: 非常に強い西風
  rationale: רוּחַ יָם は字義的には「海の風」だが、エジプトでは海側から来る西風を指す。本文では意味を明瞭にし、字義は脚注に残した。חָזָק מְאֹד は自然に「非常に強い」とした。
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: その風はいなごを運び去り
  rationale: נשא の「持ち上げる、運ぶ」を、風がいなごの群れを一掃する場面に即して表した。
- source_word: וַיִּתְקָעֵהוּ
  choice: 吹き落とした
  rationale: תקע の「押し込む、追いやる」という強い動作を、風が群れを海へ追いやる文脈に合う日本語で表した。単数接尾辞は、集合体としてのいなごの群れを受ける。
- source_word: יָמָּה סּוּף
  choice: 葦の海へ
  rationale: יַם־סוּף のヘブライ語名を字義に沿って訳し、伝統的名称「紅海」は脚注に示した。方向を表す語尾 ה も「へ」に反映した。
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: いなごは一匹も残らなかった
  rationale: 「一匹のいなごも残らなかった」という全否定の強調を、自然で明快な日本語にした。
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: エジプト全土には
  rationale: גְּבוּל はここでは境界線そのものより、境界内の領域全体を指すため「全土」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号へ置き換えず、その人格的・契約的な神名を保つため。
- issue: 地名 יַם־סוּף の訳し方
  choice: 葦の海
  alternative: 紅海
  rationale: 伝統的呼称だけに依存せず、ヘブライ語の形を本文に反映した。読者になじみ深い「紅海」は脚注に残した。
translation_notes:
  register: 明快で格調のある現代標準日本語。物語の動きを簡潔に保ちつつ、原文の強調と地理的表現を読者に分かる形で示した。敬語は神の行為に対する日本語として「起こされた」を用いたが、過度に古風な語法は避けた。
