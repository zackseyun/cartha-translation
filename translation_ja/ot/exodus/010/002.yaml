  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: ja
  text: それは、あなたがあなたの息子と孫に、わたしがどのようにエジプトを厳しく扱ったか[a]、また、わたしのしるしを彼らの間に置いたことを語り聞かせ、あなたがたがわたしがヤハウェであることを知るためである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしがどのようにエジプトを辱めたか」または「翻弄したか」。ヘブライ語の動詞には、厳しく扱うことに加え、相手を辱める意味合いもある。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたは、わたしがヤハウェであることを知るようになる」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: それは～ためである
  rationale: 前節から続く目的を明確に示し、文末の目的表現と自然に呼応させる。
- source_word: תְּסַפֵּר בְּאָזְנֵי
  choice: 聞かせ
  rationale: 直訳は「耳に語る」だが、日本語では「聞かせる」がその慣用的意味と、後代へ語り伝える行為を簡潔に表す。
- source_word: בִנְךָ וּבֶן בִנְךָ
  choice: 自分の息子と孫
  rationale: 「あなたの息子と、あなたの息子の息子」という世代の連なりを自然な現代日本語で表す。
- source_word: הִתְעַלַּלְתִּי
  choice: どれほど厳しく扱ったか
  rationale: 災いによる厳しい処遇を本文で示しつつ、相手を辱め、翻弄する含意は脚注に残す。
- source_word: בְּמִצְרַיִם
  choice: エジプトを
  rationale: 日本語の「厳しく扱う」に合わせて対象を「を」で示す。ここでは国としてのエジプトと、その民・体制を含む表現である。
- source_word: אֹתֹתַי
  choice: わたしのしるし
  rationale: אותの基本義を保ち、「奇跡」などの説明を本文に加えない。
- source_word: שַׂמְתִּי בָם
  choice: 彼らの間に置いた
  rationale: 「置く」という原文の具体的な動詞を保ち、複数接尾辞をエジプトの人々を指す「彼ら」として表す。
- source_word: וִידַעְתֶּם
  choice: こうして、あなたがたが～知るため
  rationale: 冒頭の目的表現に連なる読みを本文に採用する。二人称複数であることも「あなたがた」で明示する。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、神の固有名を日本語で音写する。
theological_decisions:
- issue: הִתְעַלַּלְתִּי が表すエジプトへの神の行為
  choice: 厳しく扱った
  alternative: 辱めた／翻弄した
  rationale: 文脈上の厳しい裁きを明瞭に伝えながら、この動詞が持ちうる侮辱・翻弄の含意を脚注で保存する。
- issue: וִידַעְתֶּם の目的・結果のニュアンス
  choice: あなたがたが～知るため
  alternative: あなたがたは～知るようになる
  rationale: 冒頭のלְמַעַןから続く目的として読むのが文の構造に適うが、未来の結果を述べる読みも可能なので脚注に示す。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を保ち、称号への置換によって「わたしがヤハウェである」という自己啓示の形を弱めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聞かせる」によりヘブライ語の慣用句を自然に表し、「しるし」は聖書的な語感を保つため平仮名表記とした。単数の「あなた」から複数の「あなたがた」への原文上の移行を維持した。
