  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֤ה יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ֥/יהִי חֹ֖שֶׁךְ עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יָמֵ֖שׁ חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: ja
  text: すると、ヤハウェはモーセに言われた。「手を空に向かって伸ばしなさい。そうすれば、エジプトの地に闇が臨み、その闇は触れられるほどになる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾のヘブライ語は、直訳すれば「闇が感じられる（触れられる）ようになる」とも、「人が闇を感じるようになる」とも理解できる。ここで使われる動詞はまれで、闇が触知できるほど濃く圧倒的であることを表すと理解される。
    reason: まれな動詞の語義と、動詞の主語を闇と見るか一般的な人と見るかに解釈の幅があるため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を、ヘブライ語の子音に基づく一般的な日本語表記で示した。
- source_word: נְטֵה יָדְךָ
  choice: 手を……伸ばしなさい
  rationale: 命令形と二人称単数の所有接尾辞を明確に保ち、しるしを行う動作として自然な日本語にした。
- source_word: עַל הַשָּׁמַיִם
  choice: 空に向かって
  rationale: 前置詞はこの身振りの文脈では方向を表すため、字義的な「天の上に」ではなく自然な方向表現とした。
- source_word: וִיהִי חֹשֶׁךְ
  choice: そうすれば……闇が臨み
  rationale: 接続詞付き指示形の意図・結果の含みを「そうすれば」で示し、闇の到来を「臨む」で表した。
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: エジプトの地に
  rationale: אֶרֶץを省かず「地」と訳し、災いの及ぶ地理的範囲を保った。
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: その闇は手で触れられるほどになる
  rationale: まれな動詞が表す、触知できるほど濃く重い闇という文脈上の意味を自然に表し、別の構文理解は脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に固有名が明記されているため、称号に置き換えず音写した。
translation_notes:
  register: 明快な現代標準語を用いながら、神の発言には簡潔で荘重な調子を保った。「手で触れられるほど」は日本語として理解しやすく、原文の異様で圧迫感のある闇を伝える。
