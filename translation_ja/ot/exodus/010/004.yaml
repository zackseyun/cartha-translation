id: EXO.10.4
reference: Exodus 10:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: ja
  text: もしあなたがわたしの民を行かせることを拒むなら、見よ、わたしは明日、あなたの領内[b]にいなご[a]を送り込む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は単数形だが、ここでは集合的に用いられ、いなごの大群を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたの国境の内側に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: もし……なら
  rationale: 直前の警告を受けて条件を提示する表現。日本語では「もし……なら」が自然であり、כִּי の連続・根拠提示の働きは文脈に委ねた。
- source_word: מָאֵן
  choice: 拒む
  rationale: 単なるためらいや不可能ではなく、意志的に拒絶する意味を保つ。
- source_word: לְשַׁלֵּחַ
  choice: 行かせる
  rationale: 出エジプトの文脈における שׁלח の慣用的な意味を、明快で自然な日本語にした。
- source_word: עַמִּי
  choice: わたしの民
  rationale: 所有の強調と契約的な表現を簡潔に保つ。
- source_word: הִנְנִי
  choice: 見よ
  rationale: 差し迫った神の宣告を強調する語。現代日本語でも聖書の荘重な警告として理解できる「見よ」を用いた。
- source_word: מֵבִיא
  choice: 送り込む
  rationale: הִנְנִי とともに差し迫った未来の行為を表す。いなごが領域へ侵入する動きを、日本語として自然に示す。
- source_word: מָחָר
  choice: 明日
  rationale: 災いが起こる時を直接示す時間副詞。
- source_word: אַרְבֶּה
  choice: いなご
  rationale: 形は単数だが集合的に用いられており、日本語の「いなご」も個体と群れの双方を自然に表せる。
- source_word: בִּגְבֻלֶךָ
  choice: あなたの領内に
  rationale: גְּבוּל の境界・領域という意味と、動詞が示す侵入の方向を保つ。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を基本としつつ、神の厳粛な警告を示す「見よ」で原文の荘重さを保った。「行かせる」「送り込む」により、過度に逐語的にならない自然な表現とした。
