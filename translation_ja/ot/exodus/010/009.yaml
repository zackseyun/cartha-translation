  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ נֵלֵ֑ךְ בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג יְהוָ֖ה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: ja
  text: モーセは言った。「私たちは、若者も老人も一緒に行きます。息子も娘も、羊の群れも牛の群れも連れて行きます。私たちは主の祭りを祝うのですから。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: 若者も老人も一緒に
  rationale: 年齢層の両極を挙げて共同体全体を示す表現を、対句を保ちながら自然な日本語にした。前置詞 ב は同行を表すため「一緒に」で示した。
- source_word: בְּבָנֵינוּ וּבִבְנוֹתֵנוּ
  choice: 息子も娘も
  rationale: 家族の構成員を具体的に列挙する原文を簡潔に保持した。
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: 羊の群れも牛の群れも連れて
  rationale: צֹאן は小家畜の群れ、בָּקָר は牛の群れを指す。「連れて」は同行を表す前置詞 ב の意味を日本語で明確にする。
- source_word: חַג יְהוָה
  choice: 主の祭り
  rationale: חַג は巡礼祭・祝祭を表す。「主」は神名 יהוה に対する日本語聖書の慣用的で尊厳ある表記とした。
- source_word: כִּי
  choice: ですから
  rationale: 直前の要求の理由を示す接続詞として、因果関係を自然に表した。
theological_decisions:
- issue: 「主の祭り」が義務を明示するか
  choice: 「私たちは主の祭りを祝うのですから」
  alternative: 「私たちは主のために祭りを祝わなければならないのですから」
  rationale: 原文には英語の must に直接対応する義務表現がなく、「私たちには主の祭りがある」が字義的構造である。祭りを行う必要性は文脈から伝わるため、義務を過度に明示しなかった。
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では広く通用する「主」を用い、特定の発音再建を断定しない。
translation_notes:
  register: 明瞭な現代標準語。原文で二度繰り返される נֵלֵךְ（行きます）を二文に分けて保持し、列挙の力強さとモーセの包括的な要求を表した。
