  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: ja
  text: しかし、ヤハウェはファラオの心をかたくなにされた[a]。ファラオはイスラエルの子ら[b]を行かせなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心を固くされた」または「ファラオの心を強くされた」。ヘブライ語の動詞は字義的には「強くする、固くする」という意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イスラエル人」。伝統的には「イスラエルの子どもたち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: かたくなにされた
  rationale: חזקの基本義は「強くする、固くする」だが、出エジプト記で繰り返される定型表現では、ファラオの抵抗する意志が固められることを自然な現代日本語で表す「心をかたくなにする」が文脈に適する。使役的な神の働きを曖昧にしない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、一般的な日本語音写で表した。
- source_word: לֵב
  choice: 心
  rationale: ヘブライ語のלֵבは感情だけでなく意志や判断を含む内面を指す。「心」はその幅を保ち、聖書的表現としても自然である。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号を、現代日本語で広く用いられる音写で表した。
- source_word: שִׁלַּח
  choice: 去らせなかった
  rationale: שלחの「送り出す」という使役的意味を保ちつつ、イスラエルをエジプトから解放しないという文脈を明瞭にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 直訳的な親族表現を保持した。「子ら」は集団全体を指し、男性だけに限定しない。より自然な代案は「イスラエル人」である。
theological_decisions:
- issue: ファラオの心がかたくなになることへの神の関与
  choice: ヤハウェはファラオの心をかたくなにされた
  alternative: ヤハウェはファラオの心を固くされた／強くされた
  rationale: 本文はヤハウェを動作の主体として明示しているため、その神的作用を弱めずに訳した。同時に、人間の責任や予定について本文以上の説明を加えず、物語にある神学的緊張をそのまま残した。
translation_notes:
  register: 明快で格調ある現代標準日本語。「かたくな」は抽象的な心の抵抗を自然に表すため平仮名とした。原文の二つの節を二文に分け、「そのため」で論理的な連続を明示した。
