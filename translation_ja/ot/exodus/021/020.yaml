  naturalness: 条件節と法的帰結のつながりは概ね自然である。「彼の手にかかって死んだ」は、打撃の直接的結果という文脈には合うが、תחת ידו の「その者の手の下／支配・直接の加害のもとで」という表現の幅をやや狭める。より中立的な「その手の下で死んだ」を用いる。
