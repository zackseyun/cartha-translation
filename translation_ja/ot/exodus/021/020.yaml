source:
  edition: WLC
  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: ja
  text: 人が自分の男奴隷または女奴隷を杖で打ち、その手の下で死んだなら、必ず報復がなされる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「必ず罰せられる」。ヘブライ語では、直訳的には「必ず報復される」という強意の法的表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 人が……なら
  rationale: 後続する事例法の条件節として、接続辞を日本語で不自然に逐語化せず、条件構文に組み込んだ。
- source_word: יַכֶּה
  choice: 打ち
  rationale: נכה の広い意味を保ち、道具を示す「杖で」と自然につながる表現とした。
- source_word: אִישׁ
  choice: 人が
  rationale: 法文における不定の男性単数であり、日本語では「ある男が」より自然な一般条件を表す。原文上の行為者が男性であることは、所有代名詞に性を表示しない日本語でも文脈上失われない。
- source_word: עַבְדּוֹ
  choice: 自分の男奴隷
  rationale: この法的文脈の עבד は単なる使用人ではなく隷属身分を表す。「男」を添え、明示的に対置される女奴隷との並行を保った。
- source_word: אֲמָתוֹ
  choice: 女奴隷
  rationale: אָמָה の性別と隷属身分を、現代日本語で明確かつ並行的に示した。
- source_word: בַּשֵּׁבֶט
  choice: 杖で
  rationale: שבט は杖、棒、笏などを指し得るが、ここでは殴打の道具である。「杖」は語義を狭めすぎず、自然である。
- source_word: וּמֵת תַּחַת יָדוֹ
  choice: その奴隷が彼の手にかかって死んだ
  rationale: 死亡者を明示して日本語の代名詞の曖昧さを避けつつ、「彼の手にかかって」により תַּחַת יָדוֹ の直接的な加害・支配下という含みを保った。
- source_word: נָקֹם יִנָּקֵם
  choice: 必ずその死の報復がなされなければならない
  rationale: 不定詞絶対形と定動詞による強意を「必ず……なければならない」で表し、נקם の報復という語義を保った。誰がどの刑罰を執行するかは本文以上に限定しない。
theological_decisions:
- issue: נָקֹם יִנָּקֵם が定める法的結果の性質
  choice: 「必ずその死の報復がなされなければならない」とし、具体的刑罰を特定しない。
  alternative: 「必ず罰せられなければならない」
  rationale: 原文は報復・制裁が確実になされることを強く命じるが、この節自体はその司法的手段や刑罰を明示しない。「罰せられる」も文脈上可能だが、נקם の語感を一般化するため脚注に示した。
translation_notes:
  register: 現代標準日本語の法文調を用い、厳粛さと読みやすさを両立させた。「奴隷」は歴史的・法的身分を曖昧にしないため採用した。主節は受動的な非人称表現とし、原文が明示しない執行者や具体的刑罰を補わなかった。
