  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: ja
  text: もし彼女が主人の目にかなわず、主人が彼女を自分のために定めなかったなら[a]、主人は彼女の買い戻しを認めなければならない。主人には彼女を異国の民に売る権利はない。彼女に対して不実に振る舞ったからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主人が彼女を自分のために定めたのなら」または「主人が彼女を自分の婚約者としなかったのなら」。このヘブライ語の句は、本文上も解釈上も難しい。
    reason: textual_variant
  - marker: b
    text: 別訳「彼女を裏切ったからである」。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: 目にかなわず
  rationale: 直訳的な「目に悪い」ではなく、「気に入らない、受け入れがたい」というヘブライ語の慣用的意味を、自然な現代日本語で表した。
- source_word: אֲדֹנֶיהָ
  choice: 主人
  rationale: この法的文脈における少女の権限保持者・購入者を指す。神称号を連想させる「主」や、物としての側面を強める「所有者」より適切である。
- source_word: יְעָדָהּ
  choice: 自分のために定めなかった
  rationale: 婚姻相手として割り当てる含意はあるが、動詞自体の幅を保つため、本文では「定める」とした。否定辞 לא を本文に反映し、肯定読みおよび「婚約させる」という限定的訳は脚注に示した。
- source_word: וְהֶפְדָּהּ
  choice: 彼女が買い戻されるようにしなければならない
  rationale: 使役形が、主人自身による代価の支払いに限らず、身請け・買い戻しを許可または実現させる法的義務を表すことを明確にした。
- source_word: לְעַם נָכְרִי
  choice: 異国の民に
  rationale: 単独の外国人ではなく集合的な「よその民」を指す原文を保った。
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: 売る権利はない
  rationale: משל がここで表す法的な権限・権能を、明瞭な現代日本語で示した。
- source_word: בְּבִגְדוֹ בָהּ
  choice: 彼女を裏切ったからである
  rationale: בגד の背信的・不誠実な行為という意味を簡潔に表した。「不実に扱った」とする可能性は脚注に残した。
theological_decisions:
- issue: יְעָדָהּ と否定辞 לא をめぐる本文上・解釈上の難しさ
  choice: 主人が彼女を自分のために定めなかったのなら
  alternative: 主人が彼女を自分のために定めたのなら／主人が彼女を自分の婚約者としなかったのなら
  rationale: 提示された子音本文の否定辞を本文に反映した。ただし、マソラ本文の伝承と古代訳には肯定・否定および「定める」「婚約させる」をめぐる難しさがあるため、解釈を一つに固定せず脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。古代の法的・社会的関係を美化せず、同時に原文以上の現代的評価語も加えていない。「買い戻す」「権利」により法規定としての性格を自然に伝えた。
