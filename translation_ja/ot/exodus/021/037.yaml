base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: ja
  text: 人が牛または羊または山羊一頭[a]を盗み、それを屠殺するか売ったなら、その牛一頭に対して牛五頭を、その羊または山羊一頭に対して羊または山羊四頭を償わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊または山羊一頭」—ヘブライ語 שֶׂה は、羊または山羊のいずれか一頭を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִגְנֹב אִישׁ
  choice: 人が…盗み、…なら
  rationale: 事例法の条件節として、現代日本語の法規的表現に自然な形で訳した。אִישׁはここでは一般的な行為者を示すため、「人」とした。
- source_word: שׁוֹר
  choice: 牛
  rationale: 法的な家畜の文脈で、性別や去勢の有無を不必要に限定しない日本語として「牛」が適切である。
- source_word: שֶׂה
  choice: 羊や山羊の一頭
  rationale: שֶׂהは羊または山羊の小家畜一頭を指し得るため、原文の語義範囲を保った。
- source_word: וּטְבָחוֹ
  choice: それを屠る
  rationale: טבחは単なる殺害ではなく、食肉などのための屠殺を表す。「屠る」は簡潔で、この法的文脈にも合う。
- source_word: אוֹ מְכָרוֹ
  choice: か売った
  rationale: 二つの処分方法の選択関係を明確に表した。
- source_word: חֲמִשָּׁה בָקָר
  choice: 牛五頭
  rationale: בָקָרは牛類を表す集合名詞であり、日本語では助数詞を用いて自然に訳した。
- source_word: יְשַׁלֵּם
  choice: 償わなければならない
  rationale: שלםのピエル形がこの法的文脈で持つ賠償・弁償の意味を明確にした。
- source_word: תַּחַת
  choice: …一頭に対して
  rationale: 代替・賠償の対応関係を日本語で明瞭に示した。
- source_word: וְאַרְבַּע צֹאן
  choice: 羊または山羊四頭
  rationale: צֹאןは羊と山羊を含む小家畜の群れを指し得るため、特定の一種に狭めなかった。
