translation:
  language: ja
  text: 目には目[a]、歯には歯、手には手、足には足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「目の代わりに目、歯の代わりに歯、手の代わりに手、足の代わりに足」。
    reason: תַּחַת は、この文脈で「～の代わりに」という対応・代替を表し得るため。
lexical_decisions:
- source_word: עַיִן
  choice: 目
  rationale: 身体器官としての「目」を指す。簡潔な法的定式を保つため、不定性を補って「一つの目」などとはしない。
- source_word: תַּחַת
  choice: には
  rationale: ここでは空間的な「下に」ではなく、損傷に対応する代償・報いを表す。日本語で定着した「目には目」の形は、対応関係を簡潔に示す一方、その実施方法を本文以上に限定しない。別訳「目に代えて目」も可能なので脚注に示す。
- source_word: שֵׁן
  choice: 歯
  rationale: 身体器官としての「歯」。他の身体部位と並ぶ簡潔な反復を保つ。
- source_word: יָד
  choice: 手
  rationale: 通常の身体部位としての「手」を採用し、原文の対応とリズムを保つ。
- source_word: רֶגֶל
  choice: 足
  rationale: 文脈上は「足」が最も自然で、並列された身体部位の表現にも合う。「脚」とも訳し得るが、ここでは定式的な表現を優先する。
theological_decisions:
- issue: 法的定式の性質
  choice: 「目には目……足には足」という、対応する償いを簡潔に述べる表現として訳す。
  alternative: 「受けた傷害と同等の罰を科す」など、原則を説明する意訳。
  rationale: ヘブライ語本文は身体部位と תַּחַת の組み合わせだけから成る。刑罰の具体的な執行方法まで訳文で確定せず、原文の簡潔さと解釈上の余地を保つ。
translation_notes:
  register: 現代日本語として明瞭でありながら、法文の簡潔で格調ある反復を保持した。「目には目」は広く理解される定型表現で、原文のリズムにも対応する。脚注記号 [a] は該当する最初の句に置いた。
