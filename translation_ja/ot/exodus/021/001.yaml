  text: These are the judgments that you shall set before them:[a]
translation:
  language: ja
  text: 以下は、あなたが彼らの前に示すべき法規である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「法規」と訳したヘブライ語は、法的な判断、決定、または規定を指す。「定め」「規則」とも訳せる。
    reason: 語義の幅と法的・司法的なニュアンスを示すため。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下は
  rationale: 接続詞を伴う指示表現で、直前の文脈を受けつつ新しい法規集を導入する。日本語では「以下は」がその談話上の働きを自然に表す。
- source_word: הַמִּשְׁפָּטִים
  choice: 法規
  rationale: この複数名詞は、契約法の文脈で法的判断、規定、判例的な法を指す。「法規」は司法的・法的な含みを保ちながら、現代日本語で明瞭である。
- source_word: אֲשֶׁר
  choice: ～べき
  rationale: 関係節を導き、後続する動詞の指示的な力と合わせて「示すべき」と自然に表現する。
- source_word: תָּשִׂים
  choice: 示す
  rationale: 原義は「置く、据える」だが、「彼らの前に置く」はここでは民に提示することを意味するため、「示す」が自然で明瞭である。
- source_word: לִפְנֵיהֶם
  choice: 彼らの前に
  rationale: 「彼らの面前に、彼らに対して」を表す慣用句。対象となる民への公的な提示というニュアンスを保つ。
theological_decisions:
- issue: 契約法の文脈における מִשְׁפָּטִים の訳語
  choice: 法規
  alternative: 裁き／定め／規則
  rationale: 特定の教派的解釈を加えず、語の司法的背景と、これから示される具体的な法規という文脈の双方を表すため。「裁き」では日本語で処罰行為と誤解されやすく、「規則」では法的重みが弱い。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「以下は」で新しい法規集の開始を自然に示し、「あなた」「彼ら」は原文の人称を保持した。
