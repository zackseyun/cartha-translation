  source_fidelity: 原文は、前節に対する代替事例として、危険な性質が以前から知られていた牛について定める。下書きの「人や牛」は原文にない被害対象を補っており、また「しかし」は選言的な接続としてやや不正確である。賠償は「死んだ牛の代わりに牛一頭」と明示すると、שׁוֹר תַּחַת הַשּׁוֹרの代償関係を過不足なく示せる。
  naturalness: 修正文は現代標準語として自然で、簡潔な法規的文体を保つ。「以前から突く癖がある」「抑えておかなかった」は、原文の継続的な危険性と管理を怠った意味を明瞭に伝える。
  terminology: 「所有者」「償わなければならない」「死んだ牛」は法的文脈に適切である。「その所有者」と反復して、原文の代名詞が指す責任者を日本語で明確にした。
