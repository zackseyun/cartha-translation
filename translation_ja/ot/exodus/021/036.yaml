source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: ja
  text: また、もしその牛が以前から突く癖があることが知られていたのに、その所有者がそれを抑えておかなかったなら、その所有者は死んだ牛の代わりに牛一頭を必ず償わなければならない。死んだ牛はその所有者のものとなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֣וֹ
  choice: しかし、…場合は
  rationale: 直前の事例に対する別の場合を導入する接続語。日本語の法令調では、単独の「または」よりも、対照を示す「しかし」と条件表現の組み合わせが自然である。
- source_word: נוֹדַע כִּי
  choice: …ことが知られていた
  rationale: ידעのニファル形の受動的・法的な意味を保ち、危険な性質が既知であったことを示す。
- source_word: שׁוֹר נַגָּח
  choice: その牛に…人や牛を突く癖がある
  rationale: נגחは突く行動を特徴とする性質を表す。目的語は原文に明記されないが、日本語で「突く癖」を自然かつ明瞭にするため、被害対象を一般的に示した。
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: 前々から
  rationale: 直訳では「昨日から、その前の日から」。過去から繰り返し見られたことを表すヘブライ語慣用句を、明瞭な現代日本語で訳した。
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: 牛を閉じ込めておかなかった
  rationale: 危険な牛が害を及ぼさないよう拘束・管理するという文脈上の意味を具体的に表す。
- source_word: בְּעָלָיו
  choice: 所有者
  rationale: 法的な所有関係を表す、現代日本語で最も明瞭な語。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 必ず…償わなければならない
  rationale: 不定詞絶対形と未完了形の組み合わせによる強い義務を、「必ず」と義務表現で再現した。
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: 牛一頭をもって相手の牛を償う
  rationale: תחתの代替・賠償の意味を保ちつつ、どの牛に対する賠償かを日本語で明瞭にした。
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: 死んだ牛はその者のものとなる
  rationale: המתを文脈上の死んだ牛として訳し、לוの指示対象を原文同様「その者」として表現した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で dignified な法文調とした。「前々から」でヘブライ語の時間的慣用句を自然に伝え、賠償義務の強調は「必ず…なければならない」で保持した。
