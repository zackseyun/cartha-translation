  to: ただし、その奴隷が一日か二日生き延びるなら、その者のために報復は行われない[a]。その奴隷は主人の金銭だからである[b]。
  rationale: 本文の意味、法文調、および原文の厳しい経済的理由づけは維持した。「その者のために」を補い、受動の「報復されない」がこの文脈では殴打された奴隷についての報復であることを、日本語でも明瞭にした。これは主人を明示的な主語として処罰対象化することを避けつつ、原文の指示関係を保つ最小限の修正である。
