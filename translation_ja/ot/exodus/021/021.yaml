source:
  edition: WLC
  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: ja
  text: ただし、その奴隷が一日か二日生き延びるなら、その者のために報復は行われない[a]。その奴隷は主人の金銭だからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主人は処罰されない」とも訳せる。ヘブライ語は、より具体的には報復または法的制裁が加えられることを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼は彼の金銭だからである」。奴隷が主人にとって経済的価値を持つことを表す、原文の厳しい言い方。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 直前の規定に例外または限定を加える語。現代日本語の法的文脈に自然な「ただし」とした。
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: 一日か二日
  rationale: 原文の簡潔な時間表現をそのまま明瞭に示す。
- source_word: יַעֲמֹד
  choice: 生き延びる
  rationale: 字義的には「立つ／持ちこたえる」だが、殴打後も生存していることを指す。完全な回復を意味しない「生き延びる」が文脈に適する。
- source_word: לֹא יֻקַּם
  choice: 報復は行われない
  rationale: נקםのホファル形が表す受動的・司法的な報復の意味を保ち、原文で明示されていない行為者や対象を本文で断定しない表現とした。
- source_word: כִּי
  choice: だからである
  rationale: 判決の理由を導く接続語として、簡潔で自然な因果関係を示す。
- source_word: כַסְפּוֹ
  choice: 主人の金銭
  rationale: 字義どおりの「彼の銀／金銭」が奴隷の経済的価値を指す。より穏当な「財産」に置き換えず、原文の厳しい表現を保った。
- source_word: הוּא
  choice: その奴隷は
  rationale: 男性単数代名詞の指示対象を日本語で明確にし、直前の文脈にある奴隷を指すことを示した。
theological_decisions:
- issue: 奴隷法における経済的理由づけ
  choice: 「その奴隷は主人の金銭だからである」と原文の直接的な経済表現を保つ。
  alternative: 「損失は主人自身が負うからである」または「主人の財産だからである」
  rationale: 倫理的な不快さを和らげる解釈的言い換えを避け、原文が示す法的理由の厳しさをそのまま伝える。
- issue: לֹא יֻקַּם の構文と対象
  choice: 「報復は行われない」という非人称受動表現にする。
  alternative: 「主人は処罰されない」
  rationale: 文脈上は主人への法的処置を意味し得るが、ヘブライ語自体は報復がなされないことを受動形で述べる。本文ではその形を保ち、解釈的な訳は注に示した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で荘重な法文調。「ただし」で前節との限定関係を示し、「金銭」という意図的に直接的な語を用いて原文の緊張を弱めない。
