source:
  edition: WLC
  text: אִם כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑י/ו וְ/נָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔/וֹ כְּ/כֹ֥ל אֲשֶׁר יוּשַׁ֖ת עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: ja
  text: もしその人に身代金が課されるなら、その人は、自分の命を贖う代価を、その人に課された額に応じて支払わなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身代金」と「命を贖う代価」は、ヘブライ語では互いに関連する別の語（כֹּפֶר、פִּדְיֹן）である。後半は「その人に課されたとおりに、その命の贖いの代価を支払わなければならない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし～なら
  rationale: 直前の規定を受けて例外的な条件を導入するため、明確な条件表現とした。
- source_word: כֹּפֶר
  choice: 身代金
  rationale: 刑罰を免れて解放されるために課される金銭を表す。祭儀的な「贖罪」の意味を持ち込まず、法的文脈に合う語を選んだ。
- source_word: יוּשַׁת עָלָיו
  choice: その人に…課される
  rationale: שׁית の受動形と עַל が示す、法的義務が人に課されるという意味を自然な現代日本語で表した。
- source_word: וְנָתַן
  choice: 支払わなければならない
  rationale: 字義は「与える」だが、金銭的義務を定める法文の効力を明瞭かつ自然に示した。
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: 自分の命を贖う代価
  rationale: פִּדְיֹן を解放のための代価、נֶפֶשׁ をこの司法的文脈では「命」と解し、כֹּפֶר との関連を保ちつつ同一語に平板化しないようにした。
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: 課された額をすべて
  rationale: 課されたものへの完全な対応を示す כְּכֹל を保持し、金銭について述べる日本語として「額」を補って自然にした。
theological_decisions:
- issue: 死刑相当の責任がある文脈における支払いの性質
  choice: 法的な「身代金」と、命を「贖う代価」として訳した。
  alternative: 両語を単に「罰金」とする、または祭儀的な「贖罪金」とする。
  rationale: この支払いは、本来受けるべき刑罰から本人の命を解放するため司法的に課されるもの。ヘブライ語の法的・解放的な表現を保ちつつ、道徳的無罪や祭儀的贖罪を暗示しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法文としての義務性を「支払わなければならない」で表し、「身代金」と「贖う代価」の語彙的な区別を保った。脚注記号は本文末に置き、節全体の語彙説明を示す。
