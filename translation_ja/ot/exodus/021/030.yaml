  to: もしその人に身代金が課されるなら、その人は、自分の命を贖う代価を、その人に課された額に応じて支払わなければならない。[a]
  rationale: 本文後半を、支払う対象である「命を贖う代価」と、その額を定める基準である「その人に課された額に応じて」とに分けた。これにより、פִּדְיֹן נַפְשׁוֹ と כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו の関係を明確にしつつ、二つの法的・解放的な支払い語の区別を保った。
