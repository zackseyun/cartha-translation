base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: ja
  text: しかし、その奴隷が、「私は主人と妻と子どもたち[b]を愛している。自由の身として出て行かない」と、はっきりと[a]言うなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、不定詞絶対形を定動詞と重ねて発言を強調している。「確かに言う」「明言する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「息子たち」。ヘブライ語は男性複数形だが、この家族の文脈では子ども一般を指すこともあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、……なら
  rationale: 前節までに示された解放の原則に対する例外条件を導入するため、接続の対照性を「しかし」で表した。
- source_word: אָמֹר יֹאמַר
  choice: はっきりと言う
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を、意志の明確な表明として自然な現代日本語で表した。
- source_word: הָעֶבֶד
  choice: その奴隷
  rationale: 自由の身として解放されるかどうかを扱う法的文脈であり、拘束された身分が重要なので「奴隷」とした。定冠詞は文脈上既出の人物を指す「その」で表した。
- source_word: אָהַבְתִּי
  choice: 私は……愛している
  rationale: 完了形はここでは現在まで定まっている愛着を表すため、自然な現在の状態表現とした。
- source_word: אֲדֹנִי
  choice: 主人
  rationale: 家内法上の権威関係を表し、日本語で過度に尊称的にならない語を選んだ。
- source_word: אִשְׁתִּי
  choice: 妻
  rationale: 一人称所有は主語「私は」と文脈により明らかなため、列挙の自然さを優先して日本語では重複する「私の」を省いた。
- source_word: בָּנָי
  choice: 子どもたち
  rationale: 形態上は男性複数で「息子たち」だが、家族を指す文脈では子ども一般を含み得る。本文では自然な包括表現を採用し、字義的な可能性を脚注に残した。
- source_word: לֹא אֵצֵא חָפְשִׁי
  choice: 自由の身となって出て行くことはしない
  rationale: 「出る」という解放の慣用表現と、述語的な「自由な」を保ちつつ、単なる願望ではなく本人の明確な拒否・決定として訳した。
theological_decisions:
- issue: イスラエルの隷属法における עֶבֶד の訳語
  choice: 奴隷
  alternative: 僕／しもべ、奉公人
  rationale: 本節では拘束された労働身分と解放の放棄が中心であるため、その法的・社会的身分を曖昧にしない「奴隷」を用いた。ただし、後代の人種的動産奴隷制と完全に同一視する解釈を訳文自体に持ち込んではいない。
- issue: לֹא אֵצֵא の意志性
  choice: 出て行くことはしない
  alternative: 出て行きたくない／出て行かない
  rationale: 直接話法における未完了形と否定を、明確な決意として表した。「出て行きたくない」は願望を明示しすぎるため避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら法文としての重みを保つ文体とした。直接話法は簡潔にし、節が次節の帰結へ続く条件節であることを末尾の読点で示した。
