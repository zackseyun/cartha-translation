translation:
  language: ja
  text: やけどにはやけど、傷には傷、打ち傷には打ち傷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּוִיָּה
  choice: やけど
  rationale: 火や熱による損傷、またはその痕を指す。簡潔で現代の一般読者に明瞭な「やけど」とし、原文が特定していない焼き印などに限定しない。
- source_word: תַּחַת
  choice: には
  rationale: この法的な定型句では、損傷に対応する同等の償いを表す。日本語では各損傷名に「には」を添えることで、簡潔な対応関係と三項の反復を自然に示せる。
- source_word: פֶּצַע
  choice: 傷
  rationale: 身体に負わされた傷を広く指す語であり、切り傷に限定しない。一般的で具体性のある「傷」が適切。
- source_word: חַבּוּרָה
  choice: 打ち傷
  rationale: 打撃によって生じるあざ、腫れ、傷痕を指し得る。「打ち傷」は原因となる打撃の含意を保ちつつ、現代日本語で理解しやすく、単なる「傷」との区別も保てる。
theological_decisions: []
translation_notes:
  register: 簡潔な法文の三項並行を保ち、「XにはX」を反復した。格調を損なわず、現代の一般読者に分かりやすい語彙を用いた。節末のマソラ記号 ס は本文には訳出しない。
