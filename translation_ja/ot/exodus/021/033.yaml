  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: ja
  text: 人が穴を開けるか、または穴を掘り、それを覆わず、牛かろばがその中に落ちたなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: 人が…なら
  rationale: 前節に続く事例法の条件を、現代日本語で自然に示す。「また」は後続の選択肢に用いて接続関係も保った。
- source_word: יִפְתַּח
  choice: 開けたままにする
  rationale: 字義は「開く」。後半の「掘る」と区別し、既存の穴の覆いを外すなどして開放状態にする意味が伝わる表現とした。
- source_word: אִישׁ
  choice: 人
  rationale: 男性単数形の語だが、ここでは事例法における一般的な行為者を表すため、性別を限定しない自然な法的表現とした。
- source_word: בּוֹר
  choice: 穴
  rationale: 家畜が落ちる危険な掘削箇所を広く指せる語。「貯水槽」と限定する文脈上の根拠はない。
- source_word: א֠וֹ כִּי
  choice: または
  rationale: 最初の行為と並ぶ別の事例を明確に示す。
- source_word: יִכְרֶה
  choice: 掘る
  rationale: 新たに穴を掘削する行為を、簡潔で一般的な日本語で表した。
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: 覆いをせず
  rationale: 事故防止のため物理的に穴を覆うことを指す。条件節の流れに合う自然な表現とした。
- source_word: וְ/נָפַל
  choice: 落ちたなら
  rationale: 事例法の条件の一部として、起こり得る結果を日本語の条件形で表した。
- source_word: שָׁמָּה
  choice: そこに
  rationale: 方向を示す語であり、直前の「穴」を受けて、その中へ落ちることが自然に理解できる。
- source_word: שּׁוֹר
  choice: 牛
  rationale: 法規中の大型家畜を指す語。現代日本語で一般に理解しやすく、性や去勢の有無を不必要に限定しない。
- source_word: א֥וֹ חֲמוֹר
  choice: かろば
  rationale: 二種の家畜を選択的に並べる原文を簡潔に再現した。
