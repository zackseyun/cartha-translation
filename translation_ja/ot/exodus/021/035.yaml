  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: ja
  text: ある人の牛が隣人の牛を突き[a]、その牛が死んだなら、両者は生きている牛を売って、その代金[b]を分ける。また、死んだ牛[c]も分ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「打ち」とも訳せる。ヘブライ語の動詞は、牛が力強く打撃を加えることを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その銀（その金銭）」。ここでは、生きている牛を売って得た代金を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「死んだもの」。文脈上、死んだ牛を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ある人の…なら
  rationale: 事例法の条件を導く表現として、ヘブライ語の接続と条件の働きを自然な日本語の「なら」で示した。
- source_word: יִגֹּף
  choice: 突き
  rationale: 牛が力を加えて打つことを表す動詞。文脈上自然な「突く」を本文に採り、より広い「打つ」の可能性は脚注に残した。
- source_word: שׁוֹר אִישׁ
  choice: ある人の牛
  rationale: 所有関係と事例法の不特定の当事者を、明瞭で自然な日本語で表した。
- source_word: שׁוֹר רֵעֵהוּ
  choice: 隣人の牛
  rationale: רֵעַの「隣人、仲間、同胞」の意味領域を保ち、法的な当事者間の関係を簡潔に示した。
- source_word: וָמֵת
  choice: その牛が死んだ
  rationale: 打撃を受けた牛が死ぬという結果を明示し、日本語で指示対象が曖昧にならないよう「その牛」とした。
- source_word: וּמָכְרוּ
  choice: 両者は…売って
  rationale: 複数形の主語が二人の所有者を指すことを「両者」で明示し、続く分配行為との手順上のつながりを自然に表した。
- source_word: הַשּׁוֹר הַחַי
  choice: 生きている牛
  rationale: 死んだ牛との対照を明瞭にしつつ、現代日本語として自然に訳した。
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: その代金を分ける
  rationale: כֶּסֶףは字義的には「銀、金銭」だが、ここでは生きている牛を売って得る代金を指すため、文脈上の意味を本文に示した。
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: また、死んだ牛も分ける
  rationale: 「死んだもの」という原文の省略表現が牛を指すことを日本語で明確にし、死体の価値も両者で分配するという規定を保った。
theological_decisions: []
