  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: ja
  text: 雄牛が息子であれ娘であれ突いた場合、その所有者は、この定め[b]に従って扱われなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、雄牛が息子または娘を突いた場合にも、前節に定められたのと同じ法的処置がその所有者に適用される。
    reason: cross_reference
  - marker: b
    text: 「この裁定に従って」または「この規定に従って」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ ... אוֹ
  choice: …場合も、…場合も
  rationale: 通常は「または」を表すが、ここでは前節の法規が息子と娘のどちらにも当てはまることを示す選択的並列であるため、日本語の法的文脈に自然な形で表した。
- source_word: בֵן
  choice: 息子
  rationale: 語の基本的な意味を保ち、対になる「娘」との性別を明示した表現を維持した。
- source_word: יִגָּח
  choice: 雄牛が…を突いた
  rationale: נגחは角で突くことを表す。主語の雄牛は前文脈から補い、日本語で誤解なく読めるよう明示した。
- source_word: בַת
  choice: 娘
  rationale: 語の基本的な意味を保ち、「息子」と対になる原文の表現を維持した。
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: この定めに従って
  rationale: משפטはここで、先に述べられた法的判断・規定を指す。「定め」は「裁き」より現代日本語の法規文脈に自然であり、原文の指示性も保つ。
- source_word: יֵעָשֶׂה לּוֹ
  choice: その所有者に処置がなされなければならない
  rationale: 受動形を維持しつつ、לוֹが文脈上指す雄牛の所有者を明示した。「処置」は前節に定められた法的措置を指し、その具体的内容を本文で過度に補わない。
