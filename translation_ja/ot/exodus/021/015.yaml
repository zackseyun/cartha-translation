  text: וּ/מַכֵּ֥ה אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: ja
  text: 自分の父または母を打つ者は、必ず死刑に処せられる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「自分の父と母」。ここでは、父か母のどちらかを打つ場合を指す法的な意味に従い、「または」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: 打つ者
  rationale: 動詞 נכה の分詞で、父母に物理的な打撃を加える者を指す。「殴る」より広く、原文が行為の程度や手段を限定していないことを保つ。
- source_word: אָבִיו
  choice: 自分の父
  rationale: 原文は単数男性形で、父を明示している。「親」と一般化せず、母と並べる法文の形を保つ。
- source_word: אִמּוֹ
  choice: 母
  rationale: 原文は母を明示している。日本語では先行する「自分の」が父と母の双方に自然にかかる。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調と、法的処刑を示す受動表現をともに表す。「必ず死ぬ」ではなく、司法上の刑罰であることを明確にする。
- source_word: וּ / וְ
  choice: または
  rationale: 形式上は接続詞「そして」だが、この法的文脈では父か母のいずれかを打つ場合を対象とする選言的意味で理解される。「父と母」とすると両方を打った場合だけに限定されるとの誤解を招きうる。
theological_decisions:
- issue: 死刑規定の表現
  choice: 必ず死刑に処せられる
  alternative: 必ず殺される／必ず死ななければならない
  rationale: 原文の強調構文と受動の司法的な性格を保ち、単なる死の結果ではなく法定刑であることを示す。
- issue: 父と母を結ぶ接続詞
  choice: 父または母
  alternative: 父と母
  rationale: ヘブライ語の接続詞の形を注で明示しつつ、法の適用が両親を同時に打つ場合だけに限定されないよう、日本語本文では法的な選言として訳す。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で厳粛な法文調。「死刑に処せられる」によって司法的な受動表現を保ち、「打つ」は原文が打撃の程度や手段を特定しない点を反映する。
