id: EXO.21.29
reference: Exodus 21:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: ja
  text: しかし、その牛が以前から人を突く癖があり[a]、飼い主が警告を受けていたのに牛を管理せず、男または女を殺したなら、その牛は石で打ち殺されなければならず[b]、飼い主も死刑に処せられなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「昨日から、その前の日から」。以前から繰り返していた、よく知られた習性を表す慣用句。
    reason: cultural_note
  - marker: b
    text: 「石で打つ」は、ここでは石打ちによって処刑することを意味する。
    reason: clarification
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: この法規では家畜のウシを一般的に指しており、性別を強調する必要がないため、現代日本語で自然な「牛」とした。
- source_word: נַגָּח
  choice: 人を突く癖があり
  rationale: 分詞が表す反復的・習慣的な性質を、単発の行為と区別して明確に伝える。目的語の「人」は文脈から補った。
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: 以前から
  rationale: 直訳は「昨日から、その前の日から」だが、ここでは危険な行動が以前から確認されていたことを示すヘブライ語の慣用句なので、自然な日本語で表した。字義は脚注に示す。
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: 飼い主が警告を受けていた
  rationale: 法的文脈における受動形の意味を保ち、危険性について事前に正式な警告がなされたことを表す。
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: 牛を監視せず
  rationale: שׁמר の「見張る・管理する」という意味を直接保つ。「閉じ込めず」と限定せず、適切な管理を怠ったという幅を残した。
- source_word: וְהֵמִית
  choice: 死なせた
  rationale: 牛が人の死を引き起こしたという使役的な結果を、日本語の法規文として自然に表した。
- source_word: אִישׁ אֹו אִשָּׁה
  choice: 男または女
  rationale: 原文が被害者の男女を明示しているため、その区別を省略せず保持した。
- source_word: יִסָּקֵל
  choice: 石で打ち殺されなければならず
  rationale: 石打ちが処刑を意味することを明確にし、法規の義務的な効力も示した。
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: 飼い主も死刑に処せられなければならない
  rationale: יוּמָת は単なる死亡ではなく、司法的に死に処すことを命じる使役受動の法的定型句であるため。
theological_decisions:
- issue: 飼い主に科される刑の法的効力
  choice: 飼い主も死刑に処せられなければならない
  alternative: 飼い主も死ななければならない
  rationale: יוּמָת は司法的に科される死刑を表すため、自然死のようにも読める表現を避けた。
- issue: 被害者の性別表現
  choice: 男または女
  alternative: 人
  rationale: 原文は אִישׁ と אִשָּׁה を明示しており、いずれの場合にも同じ規定が適用されることを保持した。
- issue: 前節との関係で生じ得る身代金規定
  choice: 本節では死刑の規定をそのまま訳す
  alternative: 償いによって免れ得ることを本文に補う
  rationale: 続く30節が身代金を課された場合を扱うが、その内容を本節へ先取りせず、原文の法的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で格調を保った法規文とした。「～なら」「～なければならない」を用いて条件と処罰を明確にし、原文の反復的習性、事前警告、管理責任、男女双方への適用、司法的死刑を保持した。
