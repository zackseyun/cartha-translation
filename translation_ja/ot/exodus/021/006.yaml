  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: ja
  text: そこで主人は彼を神[a]の前に連れて行き、戸または戸柱のところに連れて行く。そして主人は、きりで彼の耳を刺し通す。彼はいつまでも主人に仕える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「裁判官たちの前に」。ヘブライ語の אֱלֹהִים（エロヒーム）は、一部の法的文脈では人間の裁判官または司法機関を指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגִּישׁוֹ
  choice: 彼を……の前に連れて行き
  rationale: ヒフィル形の「近づける、連れて行く」を、法的手続きとして権威者の前に出す意味が伝わる自然な日本語で表した。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: この奴隷法の文脈における社会的・法的関係を、現代日本語で簡潔に示す。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞付きの אֱלֹהִים を基本義に従って「神」とした。ただし、法的文脈で裁判官または司法機関を指す可能性を脚注に残した。
- source_word: הַדֶּלֶת
  choice: 戸
  rationale: 儀式の具体的な場所を簡潔かつ文字どおりに表す。
- source_word: הַמְּזוּזָה
  choice: 戸柱
  rationale: 建築用語として מזוזה の正確で一般的な訳語を採用した。
- source_word: רָצַע
  choice: 刺し通す
  rationale: 耳に錐で穴をあける動作を明確に示し、単なる浅い刺傷ではないことを伝える。
- source_word: בַּמַּרְצֵעַ
  choice: きりで
  rationale: 穴をあける尖った道具を指す。現代の一般読者に理解しやすい表記とした。
- source_word: וַעֲבָדוֹ
  choice: 主人に仕える
  rationale: עבד の動詞的意味を保ち、身分名へ言い換えず、継続する奉仕を表した。
- source_word: לְעֹלָם
  choice: 生涯
  rationale: この法的文脈では無限の時間ではなく、その人の残る一生にわたる恒久的な奉仕を意味すると判断した。日本語の「永遠に」が生む誤解を避けつつ、実際の時間的範囲を明確にした。
theological_decisions:
- issue: 法的文脈における הָאֱלֹהִים の意味
  choice: 神
  alternative: 裁判官たち、または司法機関
  rationale: 語の基本義である「神」を本文に置いた。一方、契約法の文脈で人間の裁判官や法廷を指すという伝統的で可能な解釈もあるため、曖昧さを脚注で明示した。
- issue: לְעֹלָם の時間的範囲
  choice: 生涯
  alternative: 永遠に／いつまでも
  rationale: この規定は人間の奉仕期間を扱っているため、実際には終身の意味となる。「生涯」は文脈上の意味を自然に伝えるが、より形式的には「いつまでも」と訳し得る。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法文としての簡潔さと厳粛さを保った。「戸」「戸柱」「きり」など具体的な語を選び、過度に古風な表現は避けた。
