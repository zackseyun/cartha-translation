language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: ja
  text: 牛が男または女を角で突き、その人が死んだなら、その牛は必ず石で打ち殺さなければならない。その肉を食べてはならない。しかし、牛の所有者は責めを負わない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「潔白である」、または「処罰を免れる」とも訳せる。ヘブライ語は、この場合に所有者が法的な責任や処罰から免れていることを表し得る語を用いている。
    reason: נָקִי の法的意味には幅があり、本文の「責めを負わない」だけでは見えにくい訳語の可能性を示すため。
lexical_decisions:
- source_word: וְכִי
  choice: 牛が……なら
  rationale: 条件を示す事例法の導入として、接続詞の働きを日本語では自然な条件構文に組み込んだ。
- source_word: יִגַּח
  choice: 角で突き
  rationale: 角を使って突くことを表す動詞なので、単なる「襲う」や「打つ」より具体的に訳した。
- source_word: שׁוֹר
  choice: 牛
  rationale: 性別や去勢の有無を不必要に限定せず、法文の対象となる家畜を明瞭に示す。
- source_word: אֶת־אִישׁ אוֹ אֶת־אִשָּׁה
  choice: 男または女を
  rationale: 原文が男女を明示しているため、その区別を保った。
- source_word: וָמֵת
  choice: その人が死んだ
  rationale: 文法上は男性単数形だが、先行する被害者は男にも女にもなり得るため、日本語では包括的に「その人」とした。
- source_word: סָקוֹל יִסָּקֵל
  choice: 必ず石で打ち殺さなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意と、死に至らせる法的命令の双方を明確にした。
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: その肉を食べてはならない
  rationale: 受動構文を日本語の自然な禁止表現にしつつ、肉の食用禁止を明確にした。
- source_word: וּבַעַל הַשּׁוֹר
  choice: しかし、牛の所有者は
  rationale: 牛に対する処置との対照を「しかし」で示し、בַּעַל は法的文脈に即して「所有者」とした。
- source_word: נָקִי
  choice: 責めを負わない
  rationale: 道徳的無罪、法的責任の不存在、処罰の免除のいずれか一つに狭めず、この事例では所有者が責任を追及されないという広がりを保つ表現を選んだ。
theological_decisions:
- issue: 末尾における牛の所有者の法的地位
  choice: この事例では所有者は「責めを負わない」とする。
  alternative: 「潔白である」「罪に問われない」「処罰を免れる」
  rationale: 原語 נָקִי は、潔白であること、責任がないこと、処罰を免れることを表し得る。後続節の過失に関する規定を先取りせず、免責の範囲を道徳的・民事的・刑事的のいずれかに限定しない訳とした。
translation_notes:
  register: 現代の一般読者に明瞭な法文調とした。「必ず」「なければならない」で原文の強い命令を保ち、「石で打ち殺す」は処刑の結果まで明確にする。脚注記号[a]は、その内容が説明する末尾の נָקִי に対応する位置に置いた。
