  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: ja
  text: もし彼が別の女を妻に迎えるなら、彼女の食べ物、衣服、夫婦の交わり[a]を減らしてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夫婦としての権利」。ヘブライ語のこの語は難しいが、夫が妻に対して負う夫婦の交わりに関する義務を指すと理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし～なら
  rationale: 判例法の条件を導く標準的な条件辞であり、日本語でも条件文として自然に表した。
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: 彼がほかの女を妻に迎える
  rationale: 直訳的には「自分のためにほかの女を取る」だが、婚姻の文脈を明確かつ自然に表すため「妻に迎える」とした。
- source_word: שְׁאֵרָהּ
  choice: 先の妻の食べ物
  rationale: 語義には難しさがあるが、この婚姻上の扶養義務の列挙では食物・糧を指すと解するのが文脈に適う。「先の妻の」は、三つの接尾辞が指す女性を日本語で明確にするため補った。
- source_word: כְּסוּתָהּ
  choice: 衣服
  rationale: 覆いまたは衣服を意味し、この法的文脈では「衣服」が明瞭で自然である。
- source_word: וְעֹנָתָהּ
  choice: 夫婦の交わり
  rationale: 夫が妻に負う婚姻上の性的な務めを指す難語である。露骨すぎず曖昧すぎない現代日本語として「夫婦の交わり」を選んだ。
- source_word: לֹא יִגְרָע
  choice: 減らしてはならない
  rationale: 「少なくする、減じる」という意味を保ち、三つの義務すべてにかかる禁止として自然に表した。
theological_decisions:
- issue: וְעֹנָתָהּ が示す婚姻上の義務
  choice: 夫婦の交わり
  alternative: 夫婦としての権利／同衾の務め
  rationale: 婚姻における親密な関係を指すことを示しつつ、権利の帰属や義務という側面を訳語だけで過度に規定しない表現を採った。別解を脚注で補った。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法文調。「妻」を二度重ねる不自然さを避けつつ指示対象を明確にするため、「先の妻」を補足した。
