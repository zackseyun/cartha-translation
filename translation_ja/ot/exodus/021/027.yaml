  terminology: 「男奴隷／女奴隷」は、原文の性別対照と当該法規における隷属身分を適切に反映する。「歯の償いとして」は תַּחַת שִׁנּוֹ の補償・対価の意味を自然に表す。脚注は男性単数接尾辞と適用範囲を適切に説明している。
