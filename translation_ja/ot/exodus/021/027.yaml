source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: ja
  text: また、もし人が自分の男奴隷の歯、あるいは女奴隷の歯を抜け落ちさせたなら、その歯の償いとして、その奴隷[a]を自由にしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、ここは男性単数の目的語接尾辞で「彼を」となっている。ただし、この規定は前に挙げられた男奴隷と女奴隷のどちらにも適用される。
    reason: 原文の文法上の男性単数形と、法規が男女双方を対象とすることの関係を示すため。
lexical_decisions:
- source_word: וְאִם
  choice: また、もし
  rationale: 前節から続く法的事例の条件節であることを、接続の力を保ちながら自然な現代日本語で示す。
- source_word: שֵׁן
  choice: 歯
  rationale: 一般的な身体部位の名称であり、ヘブライ語どおり単数で訳す。
- source_word: עַבְדּוֹ
  choice: 自分の男奴隷
  rationale: この奴隷法の文脈では、単なる使用人ではなく法的に隷属した者を指す。「男」を添えて、後続する女性形との対を明示する。
- source_word: אֲמָתוֹ
  choice: 女奴隷
  rationale: עבדに対応する女性形であり、原文の性別の区別と隷属身分を明確に保つ。
- source_word: יַפִּיל
  choice: 抜け落ちさせた
  rationale: נפלのヒフィル形で、歯を『落ちるようにする』ことを表す。負傷の結果を正確に示しつつ、原因となる行為を原文以上に限定しない。
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: その者を自由の身にして解放しなければならない
  rationale: 自由な身分として送り出すという法的帰結を、義務の力を保った自然な日本語で表す。
- source_word: תַּחַת שִׁנּוֹ
  choice: その歯の代償として
  rationale: תחתがここで表す、受けた損傷に対応する補償・償いの意味を明確にする。
theological_decisions:
- issue: 契約法典における隷属身分の用語
  choice: 男奴隷／女奴隷
  alternative: 男の僕／女の僕、下男／はしため
  rationale: 本節では隷属身分が法的規定の中心にあるため、「僕」や「使用人」よりも「奴隷」が社会的・法的実態を明確に伝える。原文が示す男女の区別も保持する。
- issue: 解放される者を指す男性単数接尾辞
  choice: その者
  alternative: 彼
  rationale: ヘブライ語の目的語接尾辞は男性単数だが、条件節には男奴隷と女奴隷の双方が明記されている。「その者」は文法上の形を性別限定として過剰解釈せず、法規の適用範囲を自然に示す。原文の文法的特徴は脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語による法文調。「奴隷」は歴史的・法的身分を曖昧にしないために用い、「解放しなければならない」で規定の義務性を表した。
