  to: また、もし人が自分の男奴隷の歯、あるいは女奴隷の歯を抜け落ちさせたなら、その歯の償いとして、その奴隷[a]を自由にしなければならない。
  rationale: 「自由の身にして解放」を「自由にし」に改め、原文の法的帰結を重複なく自然に表した。また、「その者」を「その奴隷」として、文脈上の被害を受けた隷属者を明確にした。その他の表現と脚注は原文および英語監査記録に照らして維持できる。
