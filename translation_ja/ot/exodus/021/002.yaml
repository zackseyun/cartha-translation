source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: ja
  text: あなたがヘブライ人の奴隷[a]を買うなら、その者は六年間仕え、七年目には何の代価も払わずに、自由の身として出て行く[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘブライ人の僕」とも訳せる。ここでの語は、購入されて拘束された労務に服する者を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「ただで、自由の身として出て行く」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: なら
  rationale: ここでは判例法の条件を導く。「もし」も可能だが、現代日本語の法的な条件表現として「なら」が自然である。
- source_word: תִקְנֶה
  choice: 買う
  rationale: קנה の商取引上の意味を明確かつ直接的に表す。
- source_word: עֶבֶד
  choice: 奴隷
  rationale: 購入され、一定期間拘束された労務に服する身分が問題となっているため、「僕」や「使用人」として弱めず「奴隷」とした。
- source_word: עִבְרִי
  choice: ヘブライ人の
  rationale: 原語の民族的呼称をそのまま保持し、「イスラエル人」へ一般化しない。
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: 六年間仕え
  rationale: 期間と עבד の「仕える、働く」という意味を簡潔に表す。奴隷身分は直前ですでに明示されている。
- source_word: וּבַשְּׁבִעִת
  choice: 七年目には
  rationale: 直前の六年間との対比を日本語の係助詞「は」で自然に示し、省略されている「年」を補った。
- source_word: יֵצֵא לַחָפְשִׁי
  choice: 自由の身となって出て行く
  rationale: 「出て行く」というヘブライ語の表現を保持しつつ、לַחָפְשִׁי が解放された身分への移行を示すことを明確にした。
- source_word: חִנָּם
  choice: 代価を払わずに
  rationale: 解放のための支払いなしに、という法的文脈での意味を自然な現代日本語で明示した。
theological_decisions:
- issue: 法的奴隷制の文脈における עֶבֶד の訳語
  choice: 奴隷
  alternative: 僕／使用人
  rationale: 本文は人が購入され拘束された奉仕に就く状況を扱う。「奴隷」は現代の読者にその身分を隠さず伝え、本文が規定する六年後の解放との緊張も保持する。
- issue: חִנָּם が指す無償性
  choice: 奴隷本人が解放の代価を払わないこととして表現
  alternative: 主人が何も与えずに送り出すこと
  rationale: この語は基本的に「ただで、代価なしに」を意味する。申命記15章の別規定をこの節に読み込まず、誰が誰に給付するかを過度に補わない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法規としての簡潔さと品位を保った。「その者」により男性単数形を不自然に強調せず受け、「七年目には」で六年間との対比を示した。すべての脚注記号を本文中に配置した。
