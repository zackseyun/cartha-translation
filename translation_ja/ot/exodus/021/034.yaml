  text: בַּ֤עַל הַ/בּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִ/בְעָלָ֑י/ו וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: ja
  text: 穴の所有者は償いをし、その家畜の所有者に金銭[a]を支払わなければならない。死んだ家畜[b]は穴の所有者のものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「銀」。ここでは賠償として支払う金銭を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「死骸」。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: 穴の所有者
  rationale: この法的文脈では、穴を所有し、その管理責任を負う者を指す。「穴の所有者」が明確で自然である。
- source_word: יְשַׁלֵּם
  choice: 償いをし
  rationale: 法的文脈におけるピエル形の意味である、損害を償うことを表す。後続の金銭支払いとは意味が重なるが、原文の二つの動詞を保った。
- source_word: כֶּסֶף
  choice: 金銭
  rationale: 字義的には「銀」だが、ここでは賠償として支払う通貨を意味するため、「金銭」とした。
- source_word: יָשִׁיב
  choice: 支払わなければならない
  rationale: 字義的には「返す、戻す」だが、ここでは失われた家畜の価値を所有者に金銭で返すことを意味する。日本語の法規的表現として自然にした。
- source_word: לִבְעָלָיו
  choice: その家畜の所有者に
  rationale: 接尾辞の指示対象は死んだ家畜である。日本語では対象を明示したほうが誤解がない。
- source_word: וְהַמֵּת
  choice: 死んだ家畜
  rationale: 原文は実質的に「死んだもの」だが、直前の文脈から家畜を指すため、それを補って明確にした。
- source_word: יִהְיֶה לוֹ
  choice: 穴の所有者のものとなる
  rationale: 代名詞「彼」を明示化し、死んだ家畜の所有権が穴の所有者に移るという法的意味を自然な日本語で表した。
theological_decisions: []
