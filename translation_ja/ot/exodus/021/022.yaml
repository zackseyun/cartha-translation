  terminology: 「裁判官たちの判断」はבִּפְלִלִיםの有力な理解を適切に示します。「女性の夫」はこの文脈でのבַּעַלの意味に合います。「重大な害」は、害の対象を母親・子ども・双方のいずれにも限定せず、語の重大性を保ちます。
