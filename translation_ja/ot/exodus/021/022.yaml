language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: ja
  text: 男たちが争って妊娠している女性を打ち、その子どもたちが出ることになっても[a]、重大な害が生じなければ[b]、その者は、女性の夫がその者に課す額を、裁判官たちの判断に従って必ず支払わなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼女の子どもたちが出る」。早産を指すとも、流産を指すとも解釈される。
    reason: lexical_alternative
  - marker: b
    text: この節だけでは、この「重大な害」が母親、子ども、またはその双方のどれに生じる害なのかは明示されていない。別訳「災い」「重大な傷害」。
    reason: alternative_reading
  - marker: c
    text: 別訳「司法の裁定によって」「法廷で」。このヘブライ語表現の厳密な意味には議論がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: …なら
  rationale: 法律上の事例を導入する条件表現。日本語の法令的な文脈に自然な形とした。
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: 男たちが争い
  rationale: אֲנָשִׁים の男性複数を保ち、נצה の身体的な争いを簡潔に表した。
- source_word: וְנָגְפוּ
  choice: 打って
  rationale: 具体的な打撃を表し、傷害の程度や故意・過失を本文で決めない訳語とした。
- source_word: אִשָּׁה הָרָה
  choice: 妊娠している女
  rationale: 明瞭な現代日本語で、法規定に関わる女性の状態をそのまま示した。
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: その子どもが出ても
  rationale: 直訳的な『彼女の子どもたちが出る』という表現を、日本語として理解できる形で保ち、早産か流産かを本文で断定しなかった。日本語では単複を明示しない『子ども』により、ヘブライ語の複数形を不自然に強調しすぎないようにした。
- source_word: אָסוֹן
  choice: 害
  rationale: 重大な災厄・傷害を指し得る語だが、この節だけでは程度や対象が明示されないため、広い語を選んだ。
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: 罰金を必ず科す
  rationale: 同根語の反復による強意を『必ず』で表し、後続する金額の賦課と支払いから金銭的処罰であることを明示した。
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: 女の夫が課す額
  rationale: שׁית על の賦課するという法的意味と、בעל がこの文脈で夫を指すことを自然な日本語で示した。
- source_word: וְנָתַן
  choice: 支払わなければならない
  rationale: 金銭的な法的文脈に即して、一般的な『与える』ではなく『支払う』とした。
- source_word: בִּפְלִלִים
  choice: 司法の裁定に従って
  rationale: 司法当局または法的審理を指す難語であるため、裁判上の決定に基づく支払いという意味を本文に採り、別案を注記した。
theological_decisions:
- issue: 妊婦とその子どもに関する傷害規定の解釈
  choice: 『その子どもが出る』と訳し、『害』が誰に生じる場合かを限定しない。
  alternative: 『流産する』または『早産する』と特定し、『害』を母親だけ、あるいは母子のいずれかに限定する。
  rationale: ヘブライ語は出産の結果や害の対象をこの節だけでは明示していない。生命倫理上・神学上の争点を翻訳によって先取りせず、原文の曖昧さを本文と注で保持した。
- issue: 罰金額と司法判断との関係
  choice: 夫が額を課し、支払いは司法の裁定に従うと表現する。
  alternative: 夫が要求した額を裁判官の前で支払う、または裁判官自身が額を決定すると明示する。
  rationale: בפללים の語義と統語関係には幅があるため、本文では司法的統制を示しつつ、誰が最終額を決めるかを必要以上に断定しなかった。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある法文調とした。『女』は原文の法的叙述を率直に保つために用い、古風な『身ごもった女』は避けた。争点の大きい出産結果と害の対象は本文で特定せず、注で主要な解釈可能性を示した。
