source:
  edition: WLC
  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: ja
  text: もし主人が彼に妻を与え、その妻が彼との間に息子または娘を産んだなら、妻とその子どもたちはその主人のものとなり、彼は一人で出て行く。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一人で出て行く」とは、奉仕期間中に主人から与えられた妻と、その子どもたちを伴わずに去ること。
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: もし……なら
  rationale: 法規の中で一つの条件付き事例を導入しているため、現代日本語の条件表現で表した。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: この隷属・法的関係における権限を表しつつ、神への称号を連想させる「主」を避けた。
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: 彼に妻を与え
  rationale: אִשָּׁה は「女」と「妻」の両義があるが、ここでは結婚関係と、その後に生まれる子どもが述べられるため「妻」が自然である。「与える」という原文の表現は保った。
- source_word: וְיָלְדָה לוֹ
  choice: その妻が彼との間に……産んだ
  rationale: 間接目的語 לוֹ の関係を、日本語として自然な「彼との間に」で示した。
- source_word: בָנִים אוֹ בָנוֹת
  choice: 息子または娘
  rationale: 原文が男女の子を明示しているため、一般化して単に「子ども」とせず区別を保った。
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: 妻とその子どもたち
  rationale: 前半の「妻」と用語を統一し、複数を含み得る יְלָדֶיהָ を「子どもたち」とした。
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: 妻の主人のものとなり
  rationale: 法的な帰属関係を曖昧にせず示した。主語が「妻とその子どもたち」であっても、ヘブライ語の動詞が女性単数形なのは、先頭の「妻」に一致したものと理解できる。
- source_word: וְהוּא יֵצֵא
  choice: 彼は……出て行かなければならない
  rationale: יצא の基本像である「出て行く」を保ち、法規としての効力を「なければならない」で表した。文脈上は奉仕期間終了時の解放を指す。
- source_word: בְגַפּוֹ
  choice: 一人で
  rationale: 同行者なしに出ることを意味する慣用表現であり、現代日本語で明瞭に表した。
theological_decisions:
- issue: 隷属制度における法的な帰属関係の表現
  choice: 「主人」「主人のものとなり」とし、原文の所有・帰属関係を明示する。
  alternative: 「雇い主」「主人のもとに残る」など、所有関係を弱める表現。
  rationale: 本文は古代の隷属関係を規定しているため、その厳しい法的現実を翻訳で和らげたり、逆に本文を超える評価を加えたりしない。
- issue: 妻子を伴わない解放の表現
  choice: 「彼は一人で出て行かなければならない」と訳し、具体的含意を脚注で説明する。
  alternative: 本文に「妻子を残して解放される」と全面的に説明し込む。
  rationale: בְגַפּוֹ の簡潔な慣用表現を本文で保ちながら、文脈上の意味は脚注で読者に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法文としての厳粛さを保った。「与える」「主人のものとなる」という現代には厳しく響く表現も、古代の法的関係を不当に和らげないため保持した。
