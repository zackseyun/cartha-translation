  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: ja
  text: また、自分の父または母を呪う者は、必ず死刑に処せられる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「自分の父と母」。この法文では、父母のどちらか一方を呪う場合を含む配分的な意味である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: また、…を呪う者
  rationale: 接続詞וּは前後の法規とのつながりを示すため「また」とした。分詞מְקַלֵּלは法文で一般的な違反者を指す名詞的用法なので「呪う者」と訳した。「呪う」は、相手に呪詛の言葉を向けるという語の法的文脈での意味を保つ。
- source_word: אָבִיו וְאִמּוֹ
  choice: 自分の父または母
  rationale: 三人称男性単数接尾辞は、日本語の一般的な法文として自然な「自分の」で表した。接続詞וְは字義上「と／そして」だが、ここでは父母のいずれかを呪う場合にも適用される配分的な並列なので、法の範囲を明確にする「または」とした。字義的形は脚注に示した。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形とホファル形の定動詞を重ねた強意表現であり、単に死ぬ結果ではなく、司法的に科される確定的な死刑を表す。「必ず」で強意を、「死刑に処せられる」で受動的な刑罰宣告を伝えた。
theological_decisions:
- issue: 父と母を結ぶ接続詞の法的範囲
  choice: 父母のどちらか一方への行為にも適用される意味を「父または母」と訳す。
  alternative: 字義どおり「父と母」とする。
  rationale: ヘブライ語の接続詞は形式上「と」だが、この決疑法的規定は父母双方を保護対象として列挙しており、両者を同時に呪った場合だけに限定するものではない。「または」はその配分的な法的意味を自然な現代日本語で明示する。
- issue: 死刑宣告の強意と受動性
  choice: 「必ず死刑に処せられる」とする。
  alternative: 「必ず死ななければならない」または「必ず死ぬ」とする。
  rationale: מוֹת יוּמָתは強意を伴う受動的な処刑規定であり、単なる死の予告ではない。訳文は司法的刑罰であることと、その確定的な強さをともに保つ。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、法文としての簡潔さと厳粛さを保った。「死刑に処せられる」は司法的な受動表現として自然で、原文の強意も「必ず」によって示した。
