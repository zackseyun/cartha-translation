  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: ja
  text: 牛が男の奴隷または女の奴隷を角で突いた場合、牛の持ち主はその奴隷の主人に銀三十シェケルを支払わなければならない。また、その牛は石で打ち殺されなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: 男の奴隷
  rationale: この奴隷制下の法的文脈と、女性を表す אָמָה との対句を明確に伝える。現代日本語の「僕」や「しもべ」では隷属身分が弱く受け取られ得るため、「奴隷」とした。
- source_word: אָמָה
  choice: 女の奴隷
  rationale: עֶבֶד と対をなす女性の奴隷を指す。性別と法的身分の双方を明確に保つ表現とした。
- source_word: יִגַּח
  choice: 角で突いた
  rationale: 牛に関して נגח は角で突くことを指す。「突いた」だけでなく「角で」を補い、動作を正確かつ自然に示した。
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: 銀三十シェケル
  rationale: 銀をシェケル重量で量った賠償額を、簡潔で慣用的な形で表した。
- source_word: יִתֵּן
  choice: 支払わなければならない
  rationale: この未完了形は判例法における法的義務を表す。賠償金の文脈に合わせて「支払う」とした。
- source_word: לַאדֹנָיו
  choice: その奴隷の主人に
  rationale: 接尾辞の指示対象は直前の奴隷と解するのが自然である。日本語で曖昧な「その主人」を避けつつ、奴隷所有関係を表す「主人」を用いた。
- source_word: יִסָּקֵל
  choice: 石で打ち殺されなければならない
  rationale: סקל のニファル形が石打ちによる処刑を表すことを明示した。単なる投石と誤解されないよう、死の結果を自然な日本語で示した。
