  text: וְ/אִם שְׁלָ֨שׁ אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑/הּ וְ/יָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: ja
  text: もし彼が彼女にこの三つのことをしないなら[a]、彼女は何の支払いもなく、自由の身となって出て行く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もし彼が彼女にこの三つを与えないなら」。ヘブライ語は直訳すると「彼女にこの三つを行わないなら」。前節の食物、衣服、夫婦としての権利を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: もし……なら
  rationale: 前節から続く条件規定として自然な現代日本語にした。接続関係は文脈上明らかなため、「そして」は明示しない。
- source_word: שְׁלָשׁ אֵלֶּה
  choice: この三つのこと
  rationale: 前節に挙げられた食物、衣服、夫婦としての権利という三つの義務を指す。原文の指示表現を保った。
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: 彼女に……しない
  rationale: עשהの広い意味を保ち、義務の内容を本文で解釈的に限定しすぎない表現とした。「与えない／備えない」も文脈上可能なので脚注に示した。
- source_word: וְיָצְאָה חִנָּם
  choice: 自由の身となって出て行くことができる
  rationale: 奴隷身分から解放される法的意味を明確にしつつ、יצאの「出て行く」という語感も残した。ヘブライ語の未完了形はここでは許可・権利を定める法文として訳した。
- source_word: אֵין כָּסֶף
  choice: 代金を払わず
  rationale: 解放のための金銭支払いが不要であることを、簡潔で自然な日本語で示した。誰が払うかは原文で明示されないため、主語を補わない構文にした。
theological_decisions:
- issue: וְיָצְאָה の法的ニュアンス
  choice: 出て行くことができる
  alternative: 出て行かなければならない／出て行く
  rationale: この規定は女性に解放される権利を与えるものと理解できるため、強制的な追放と受け取られにくい訳を選んだ。ただし、動詞形そのものは単純に「彼女は出て行く」とも訳せる。
translation_notes:
  register: 現代の一般読者に理解しやすい法文調。「自由の身となって」で身分からの解放を示し、「出て行く」で原文の慣用表現も保持した。
