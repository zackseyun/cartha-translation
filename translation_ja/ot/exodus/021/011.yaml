  terminology: 「自由の身」は奴隷身分からの解放という文脈を明確にする適切な表現である。脚注の「食物、衣服、夫婦としての権利」は前節への参照として有用であり、「与えない」は עשה の文脈的な訳語として別訳に置くのが適切である。
