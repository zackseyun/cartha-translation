id: EXO.21.7
reference: Exodus 21:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: ja
  text: 男が自分の娘を女奴隷として売る場合、その娘は男奴隷たちが解放されるのと同じ仕方で解放されることはない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、男奴隷たちと同じ条件・仕方で奴隷身分を離れるのではない。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִּי
  choice: 場合
  rationale: 連続する法規の条件節を自然な現代日本語で示す。接続の ו は文脈上、独立した「そして」とせず、条件提示の流れに含めた。
- source_word: יִמְכֹּר
  choice: 売る
  rationale: 未完了形はここでは個別事例を定める事例法の条件を表すため、一般的な条件表現「売る場合」とした。
- source_word: אִישׁ
  choice: 人
  rationale: この法的事例の主体を指す。日本語の「人」は性別を明示しないが、娘を売る父または男性家長という文脈を不自然に狭めず表せる。
- source_word: בִּתּוֹ
  choice: 自分の娘
  rationale: 名詞「娘」と三人称男性単数接尾辞を明確に表した。
- source_word: לְאָמָה
  choice: 女奴隷として
  rationale: אָמָה は拘束された身分にある女性を指す。この売買と解放を扱う法的文脈では「女中」などより「女奴隷」が身分を明確に伝える。前置詞 לְ は身分・役割を示す「として」とした。
- source_word: לֹא תֵצֵא
  choice: 解放されてはならない
  rationale: 直訳は「出てはならない」だが、この法的文脈では奴隷身分から出ること、すなわち解放を指す。日本語で意味が明瞭になるよう受動表現とした。
- source_word: כְּצֵאת הָעֲבָדִים
  choice: 男の奴隷たちが解放されるのと同じように
  rationale: 直前の女奴隷との対照、および前節の男性のヘブライ人奴隷に関する規定を踏まえ、עֲבָדִים の男性複数形を明示した。比較表現を自然な日本語にした。
theological_decisions:
- issue: 契約法における奴隷身分の用語
  choice: 「女奴隷」「男の奴隷たち」と訳す。
  alternative: 「女中」「召使い」「僕たち」
  rationale: この節では売買と解放という法的拘束身分が中心であるため、それを婉曲化せず明示する。
- issue: 「同じように解放されてはならない」の範囲
  choice: 男性奴隷と同一の条件・仕方で解放されるのではない、という比較を保持する。
  alternative: 女性は解放されることが一切ない、と絶対的に読む。
  rationale: 否定は比較句「男の奴隷たちが出るように」にかかる。続く規定は別の処遇や解放の可能性を扱うため、本節だけで全面的・永久的な不解放と断定しない。
translation_notes:
  register: 明瞭で現代的な法文調。「奴隷」は歴史的・法的身分を率直に示す語として用いた。「出る」というヘブライ語の反復は、日本語では意味が伝わりにくいため「解放される」とした。
