  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: ja
  text: しかし、もし害が生じたなら[a]、命には命をもって償わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「重大な傷害」または「死亡」とも訳せる。ヘブライ語は深刻な害や災厄を表し得るが、ここで一般的な傷害を指すのか、とりわけ死亡を指すのかについては解釈が分かれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 前節の事例と対照をなす条件を導くため、接続の対照性と条件性の両方を自然な日本語で示した。
- source_word: אָסוֹן
  choice: 害
  rationale: この語は重大な損傷、災厄、死亡事故を指し得るが、本節だけでは結果や対象が明示されないため、解釈を狭めない語を選んだ。
- source_word: יִהְיֶה
  choice: 生じたなら
  rationale: 単純な存在・発生を表す動詞を、法文の条件節として自然に訳した。
- source_word: וְנָתַתָּה
  choice: 償わなければならない
  rationale: 直訳は「与えなければならない」だが、ここでは法的な報償・応報を命じる用法であり、日本語では「償う」が意味を明瞭にする。金銭賠償に限定しない表現でもある。
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: 命には命をもって
  rationale: נֶפֶשׁはこの法的定型句では「魂」より「命」が適切であり、תַּחַתの代替・対応関係を「には…をもって」で示して、原文の反復と均衡を保った。
theological_decisions:
- issue: אָסוֹןが表す害の範囲と対象
  choice: 「害」と広く訳し、それが一般的な傷害か死亡か、また女性と胎児のどちらに及ぶかを本文で限定しない。
  alternative: 「重傷」または「死亡事故」と訳し、害の重大性ないし致死性を明示する。
  rationale: 本節の語そのものは重大な害や災厄を表し得るが、その程度と対象を明示していない。論争のある解釈を訳文に持ち込まず、原文の曖昧さと神学的緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法文としての義務を「償わなければならない」で示しつつ、金銭的支払いに限定せず、「命には命をもって」という対応関係を保持した。
