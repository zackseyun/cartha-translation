base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: ja
  text: もし彼が自分の息子のために彼女を定めるなら、娘たちに対する定めに従って、彼女を扱わなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「娘たちの権利に従って」または「娘たちについての慣例に従って」。ヘブライ語の表現は、娘たちに対する定められた法的取り扱いを指すことも、慣例的な扱いを指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: もし…なら
  rationale: 法規の連続の中で次の条件事例を導く。日本語では接続詞を加えずとも自然に条件と展開を示せる。
- source_word: לִבְנוֹ
  choice: 自分の息子のために
  rationale: ל はここで、婚姻関係を念頭に置いた指定の対象を表す。「息子に」よりも、息子の配偶者となるよう割り当てる含意を自然に表す。
- source_word: יִיעָדֶנָּה
  choice: その女を…定める
  rationale: יעד はこの文脈で、婚姻関係のために指定することを表す。「婚約させる」と断定せず、原文の法的で幅のある表現を保つ。
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  choice: 娘たちに認められている権利に従って
  rationale: מִשְׁפָּט の法的な意味を重視し、娘に当然与えられる扱いや権利を表す。ただし慣行・定めを指す可能性も脚注に残す。
- source_word: יַעֲשֶׂה לָּהּ
  choice: 彼女を扱わなければならない
  rationale: 直訳的には「彼女に対して行う」だが、ここでは規定された待遇を与える義務を自然な現代日本語で表す。
theological_decisions:
- issue: 息子のために定められた女性に負う義務の性質
  choice: 娘たちに認められている法的権利に従って扱う義務
  alternative: 娘を嫁がせる際の慣行または定めに従う義務
  rationale: כמשפט הבנות は法的権利・正当な待遇を示し得るため本文ではその力を明示する一方、婚姻に関する慣行を指す解釈も排除せず脚注に示す。
translation_notes:
  register: 明快な現代標準日本語を用い、法文としての端正さを保った。「その女」は直前の文脈にいる女性を指すための表現であり、侮蔑的な語感を避けつつ指示対象を明確にする。「定める」によって婚姻上の指定を示しながら、「婚約」と過度に限定しない。
