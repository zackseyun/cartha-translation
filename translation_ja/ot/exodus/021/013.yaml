id: EXO.21.13
reference: Exodus 21:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: ja
  text: しかし、その者が待ち伏せしたのではなく、神がその者の手によって事が起こるようにされた[a]のであれば、わたしはあなたのために、その者が逃げ込める場所を定める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「神がその者の手に（それを）起こらせた」。ヘブライ語は、計画的な待ち伏せではなかった一方、その者の手を通して出来事が起きたことを神の作用のもとに述べている。
    reason: ヘブライ語の慣用表現 אִנָּה לְיָדוֹ を説明し、原文で明示されない目的語を本文に補わないため。
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: しかし、…のであれば
  rationale: 前節の故意の殺人と対照をなす条件的な事例として、現代日本語で明確に表した。
- source_word: לֹא צָדָה
  choice: 待ち伏せしたのではなく
  rationale: この法的文脈では、文字どおりの狩猟ではなく、待ち伏せを含む計画的な殺意がなかったことを示す。
- source_word: וְהָאֱלֹהִים
  choice: 神が
  rationale: ここでは裁判官ではなく、意図されなかった出来事の背後にある神の摂理的な働きを表すと読むのが文脈に適う。
- source_word: אִנָּה לְיָדוֹ
  choice: 相手をその者の手に渡された
  rationale: 神の作用と、行為者の手を通して死が生じたことの両方を保つ。目的語は文脈から「相手」と補い、慣用句の不自然さを避けた。
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: わたしは…場所をあなたのために定める
  rationale: 逃れるための公的に指定された場所を設けるという法的意味を、簡潔で自然な日本語にした。
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: その者が逃げ込める場所
  rationale: יָנוּס の避難するために逃げる意味と、שָׁמָּה の方向性を自然な日本語で表した。
theological_decisions:
- issue: 意図しない殺人における神の作用
  choice: 神が相手をその者の手に渡された
  alternative: 神がその者の手によって事が起こるようにされた
  rationale: 本文が語る神の摂理的な作用を弱めず、同時に行為者には待ち伏せによる計画性がなかったという緊張をそのまま残した。神に殺人の道徳的責任を帰す説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語。法文としての厳粛さを保ちつつ、行為者と被害者を混同しないよう「その者」「相手」を用いた。
