base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: ja
  text: 男たちが争い、一人が石か拳で相手を打ち、その人が死なず、床についている場合[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「寝床に倒れる」。負傷して床についていることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 場合
  rationale: 個別の事例を提示する判例法の導入として、条件を自然な日本語で示す。
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: 男たちが争い
  rationale: ריב は口論から争いまでを表し得るため、暴力行為そのものに限定しすぎない「争い」とした。אֲנָשִׁים はこの事例の当事者である男性複数をそのまま示した。
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: 一人が……相手を打ち
  rationale: אִישׁ によって当事者の一人が特定される構造を保ち、רֵעֵהוּ はこの文脈で自然な「相手」とした。נכה は道具を用いた一撃にも合う「打つ」と訳した。
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: 石か拳で
  rationale: 前置詞 בְּ の道具用法を「で」で表し、אֶבֶן と אֶגְרֹף の基本義を簡潔に訳した。
- source_word: וְלֹא יָמוּת
  choice: その人が死なず
  rationale: 動詞の主語が打たれた相手であることを日本語で明確にしつつ、否定条件を保持した。
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: 床についている
  rationale: 直訳は「寝床に倒れる」だが、負傷のため臥床しているという慣用的意味を、過度に説明的にならない現代日本語で表した。
