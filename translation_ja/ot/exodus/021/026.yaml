  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: ja
  text: ある男が、自分の男奴隷の目、あるいは女奴隷の目を打って、それを損なって見えなくしたなら[a]、その奴隷の目の償いとして、その奴隷を自由にしなければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それを損なったなら」とも訳せる。原語は目を損壊することを表し、失明を含む恒久的な機能喪失を意味しうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その者を、その目の代わりに自由として送り出さなければならない」。前出の男奴隷にも女奴隷にも適用される。
    reason: lexical_and_grammar_note
lexical_decisions:
- source_word: וְכִי
  choice: 人が……なら
  rationale: 事例法を導入する条件節として、接続詞の働きを日本語の自然な法文調に組み込んだ。
- source_word: יַכֶּה
  choice: 打って
  rationale: נכה の基本義「打つ」を簡潔に表し、反復的な暴行までは含意させない。
- source_word: אִישׁ
  choice: 人
  rationale: ここでは事例法の主体を示す語であり、現代日本語では「ある男」より「人」が自然である。原文の文法上の男性形は、後続する所有者と奴隷の関係によって十分に保たれる。
- source_word: עַבְדּוֹ
  choice: 自分の男奴隷
  rationale: 所有・隷属関係と、対になる女性名詞との区別を明示する。単なる「僕」や「使用人」では法的身分を弱める。
- source_word: אֲמָתוֹ
  choice: 女奴隷
  rationale: 女性の隷属身分を明確にし、男奴隷との並行を保つ。
- source_word: וְשִׁחֲתָהּ
  choice: その目を損なった
  rationale: שחת は目を破壊して機能を失わせる重大な損傷を表すが、完全な失明だけに狭めないため「損なう」とした。
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: その奴隷を自由の身として解放しなければならない
  rationale: 自由への解放という法的結果と義務性を、指示対象の性別に偏らない自然な日本語で表した。
- source_word: תַּחַת עֵינוֹ
  choice: その目の償いとして
  rationale: תחת の代償・補償の意味を、この法的文脈に即して明示した。
theological_decisions:
- issue: イスラエルの事例法における隷属身分の訳語
  choice: 男奴隷／女奴隷
  alternative: 男の僕／女中、男の使用人／女の使用人
  rationale: この条文では所有者による傷害と解放が問題であり、隷属という法的・社会的身分を曖昧にしない訳語が必要である。
- issue: 条件節の主体 אִישׁ の性別表現
  choice: 人
  alternative: ある男
  rationale: אִישׁ は男性単数形だが、ここでは事例法の主体を導入する一般的用法である。日本語の「人」は原文の規定を不当に拡張せず、自然に主体を示す。
- issue: 男性単数目的語 יְשַׁלְּחֶנּוּ と男女いずれの奴隷への適用
  choice: その奴隷を
  alternative: 彼を
  rationale: 直前には男奴隷と女奴隷の双方が挙げられており、ヘブライ語の男性形は包括的に機能する。「彼を」では女奴隷への適用が見えにくくなるため、指示対象を明示した。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で格調を保った法文調。「奴隷」は歴史的な隷属身分を隠さず示し、「解放しなければならない」で規定の義務性を明確にした。
