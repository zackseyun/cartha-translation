base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: ja
  text: しかし、もし人が隣人を策略を用いて殺すために故意に行動するなら、死刑に処すために、その者をわたしの祭壇からでも連れ出さなければならない。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隣人を、策略を用いて殺すために、あえて行動するなら」とも訳せる。ここで「故意に」と訳したヘブライ語には、意図的・僭越に行動するという含みがある。「策略」には、狡猾さや欺きの含みがある。
    reason: lexical_alternative
  - marker: b
    text: 「死刑に処すために」は直訳すれば「死なせるために」。祭壇のもとに逃れて保護を求めた場合でも、策略を用いる故意の殺人者はそこから連れ出す、という意味。
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: しかし、もし
  rationale: 前節の偶発的な殺人と対照をなす条件を、自然な日本語で表した。
- source_word: יָזִד
  choice: 故意に…襲い
  rationale: このヒフィル形が示す、思い上がった、意図的で計画性のある行為を表す。文脈上、偶発的な殺害との対照が中心である。
- source_word: אִישׁ
  choice: 人
  rationale: 男性単数形を、日本語の法文として自然で包括的な「人」とした。
- source_word: עַל רֵעֵהוּ
  choice: 隣人を襲い
  rationale: רֵעַを「隣人」とし、敵対的な方向を示すעַלを動詞「襲う」に込めた。
- source_word: לְהָרְגוֹ
  choice: 殺したなら
  rationale: 目的を表す不定詞だが、後続する命令の対象が既遂の故意殺人者であることを日本語で明瞭にした。「殺すために」とする余地は脚注に示した。
- source_word: בְעָרְמָה
  choice: 策略を用いて
  rationale: 狡猾さ、欺き、計略を伴う態様を表し、単なる故意との重複を避けた。
- source_word: מֵעִם מִזְבְּחִי
  choice: わたしの祭壇のもとからでも
  rationale: 祭壇付近から引き離す意味を保ちつつ、そこに逃れていても保護されないという文脈上の含意を「でも」で自然に表した。
- source_word: תִּקָּחֶנּוּ
  choice: その者を…連れ出し
  rationale: 祭壇のもとから対象者を取るという具体的な動作を、自然な日本語で表した。
- source_word: לָמוּת
  choice: 死刑に処さなければならない
  rationale: 直訳は「死ぬために」だが、法規定における処刑目的を明瞭かつ自然に表した。
theological_decisions:
- issue: 故意の殺人者に祭壇の庇護が及ぶか
  choice: 祭壇のもとに逃れていても連れ出して処刑する規定として訳した。
  alternative: 祭壇は、庇護の含意を伴わず、単に被疑者を連れ出す場所として言及されている。
  rationale: 「わたしの祭壇のもとから取る」という表現は、聖所への逃避も計画的殺人者を保護しないことを強く示唆する。ただし、その制度的背景は本文に説明を加えず脚注に置いた。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で荘重な法文調とした。「死刑に処す」は原文の目的表現を解釈的に明示するため、語彙上の曖昧さは脚注で補った。
