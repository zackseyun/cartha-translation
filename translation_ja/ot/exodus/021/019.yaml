source:
  edition: WLC
  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: ja
  text: もしその人が起き上がり、杖をついて[a]外を歩けるようになれば、打った者は処罰を免れる。ただし、その人が働けなかった期間の損失を補償し[b]、完全に回復するまで治療を受けられるようにしなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「自分の杖の上で」。杖に支えられながら歩くことを指す。別訳「杖に頼って」。
    reason: lexical_alternative
  - marker: b
    text: 負傷した人が働けなかった期間、およびそのために生じた損失への補償を指す。
    reason: cultural_note
  - marker: c
    text: ヘブライ語は「治す」という動詞を重ねて強調している。加害者には、負傷者が十分な治療を受け、回復できるようにする義務がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם וְהִתְהַלֵּךְ בַּחוּץ
  choice: 起き上がり、外を歩けるようになれば
  rationale: 負傷後に起き上がり、屋外を歩けるまで回復した状態を、自然な現代日本語で表した。ヒトパエル形の継続的・反復的な歩行の含みを「歩けるようになる」で反映した。
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: 杖に頼って
  rationale: 字義的には「彼の杖の上で」。歩行を支える杖を用いていることが回復の証拠となる文脈なので、「頼って」と補って関係を明確にした。
- source_word: וְנִקָּה הַמַּכֶּה
  choice: 打った者は処罰を免れる
  rationale: נקהのニファル形が示す法的な免責を表す。ただし後半に補償義務が残るため、あらゆる責任から免れるとはせず、前節で問題となる致死に対する処罰を念頭に「処罰を免れる」とした。
- source_word: שִׁבְתּוֹ יִתֵּן
  choice: 働けなかった期間について償い
  rationale: שִׁבְתּוֹは字義的には休止・座している期間に関係する語だが、傷害法の文脈では就労不能期間とその損失への補償を指す。「償う」により法的な支払い義務を自然に示した。
- source_word: וְרַפֹּא יְרַפֵּא
  choice: 完全に回復するまで治療を受けさせなければならない
  rationale: 不定詞絶対形と定動詞の反復による強調を「完全に回復するまで」と義務表現で示した。加害者自身が治療するというより、治療を確実に受けさせ、その費用と責任を負う趣旨を表した。
theological_decisions:
- issue: 「免れる」の範囲
  choice: 「処罰を免れる」と訳し、後続の補償・治療義務を明記する
  alternative: 「責任を免れる」または「無罪となる」
  rationale: 本文は加害者を全面的に無責任とはしておらず、就労不能への補償と治療の義務を残す。「無罪」は近代的な刑事裁判の概念を過度に持ち込みうるため避けた。
translation_notes:
  register: 明快で現代的な法文調としつつ、命令の厳粛さを保った。「その人」「打った者」を用いて当事者関係を明瞭にし、過度に専門的な法律用語は避けた。
