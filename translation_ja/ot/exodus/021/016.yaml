  to: 人を誘拐してその人を売った者、または、その人がまだその者の手中にいるのが見つかった者は、必ず死刑に処せられなければならない。[a]
  rationale: 売却した者と、被害者がなおその者の支配下にいることが判明した者を、同じ主語構文の中で明確に並列した。「手中に」は原語の「手に」という慣用表現を保ちながら、現代日本語として自然に所有・支配の意味を表す。接続詞の解釈上の幅は脚注に保持した。
