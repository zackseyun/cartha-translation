base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: ja
  text: 人を誘拐してその人を売った者、または、その人がまだその者の手中にいるのが見つかった者は、必ず死刑に処せられなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「または」は「そして」とも訳せる。「手中に」は直訳では「その者の手に」で、所有または支配下にあることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב אִישׁ
  choice: 人を誘拐して
  rationale: 字義的には「人を盗む」だが、後続する売却または拘束下での発見という文脈から、人さらい・誘拐を指す。現代日本語で犯罪の内容を明瞭に伝えるため「誘拐する」とした。
- source_word: וּמְכָרוֹ
  choice: 売った
  rationale: 三人称男性単数の目的語接尾辞は、誘拐された人を指す。日本語では目的語が文脈上明らかなため、自然な形で「売った」とした。
- source_word: וְנִמְצָא בְיָדוֹ
  choice: あるいは、その人がなおその者の手もとにいるのが見つかったなら
  rationale: בְיָדוֹ は字義的に「彼の手に」で、所有・支配下にあることを示す慣用表現。「手もとにいる」により原語の比喩を保ちつつ、拘束下にある意味を伝えた。接続詞は、売却済みの場合と、まだ支配下に置いている場合という法的選択肢を表す「あるいは」とした。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を「必ず」で表し、ホファル形の司法的・受動的な処刑を「死刑に処せられなければならない」とした。
theological_decisions:
- issue: 法が対象とする犯罪の範囲
  choice: 誘拐した人をすでに売った場合も、その人をなお支配下に置いていることが判明した場合も、死刑の対象となる。
  alternative: 第二の節を選択肢ではなく付加的状況として、「売り、かつその手にいるのが見つかった」と読むことも文法上は可能。
  rationale: 接続詞 וְ は通常「そして」だが、法文の文脈では選択的な関係を表し得る。売却した場合と、まだ手もとに置いている場合の双方を扱う読みが文脈に適合する一方、接続詞自体の幅を注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な法文調とした。「人を盗む」という不自然になりやすい直訳を避け、「誘拐する」で実質を示した。刑罰規定は厳粛さを保つため「必ず死刑に処せられなければならない」とした。
