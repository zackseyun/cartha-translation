  text: אִם בְּ/גַפּ֥/וֹ יָבֹ֖א בְּ/גַפּ֣/וֹ יֵצֵ֑א אִם בַּ֤עַל אִשָּׁה֙ ה֔וּא וְ/יָצְאָ֥ה אִשְׁתּ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: ja
  text: もし彼が一人で入るなら、一人で出て行く。妻がいるなら、彼の妻も彼と共に出て行く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: 一人で
  rationale: 語源的な直訳ではなく、この法律文脈での慣用的意味「同伴者なしに」を自然な現代日本語で表した。前半と後半で同じ表現を反復し、原文の対応を保った。
- source_word: יָבֹא
  choice: 入った
  rationale: 奴隷として仕える状態に入ることを指す文脈上、「入った」とし、対になる יֵצֵא「出て行く」との構造を保った。
- source_word: יֵצֵא
  choice: 出て行く
  rationale: 奉仕の身分から解放されることを指すが、原文の出入りの比喩と反復を残すため「出て行く」とした。
- source_word: בַּעַל אִשָּׁה
  choice: 妻がいた
  rationale: 字義的には「妻の夫／妻を持つ者」だが、ここでは奉仕に入った時点で妻がいる男性を表す。「結婚していた」より後続の「その妻」と明確につながる表現を選んだ。
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: その妻も彼と一緒に出て行く
  rationale: 女性単数動詞の主語が「彼の妻」であることを明示し、「も」によって夫と共に退出する並行関係を自然に示した。
theological_decisions:
- issue: 妻が夫と共に出て行く条件の範囲
  choice: 本文には条件を補足せず、原文どおり妻が彼と共に出ると訳す
  alternative: 「妻も一緒に入ったのであれば」などの説明を本文に補う
  rationale: 周辺文脈から制度上の含意は考えられるが、本節そのものにはその条件が明記されていないため、本文で限定を加えなかった。
translation_notes:
  register: 簡潔な法文の調子を保ちつつ、現代の一般読者に自然な表現とした。「入る／出て行く」の対句を維持し、断定的な法規として「のであれば……出て行く」を用いた。
