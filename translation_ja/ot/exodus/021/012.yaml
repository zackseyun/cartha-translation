  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: ja
  text: 人を打って死なせた者は、必ず死刑に処せられる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より原文の形に即して訳すと、「人を打ち、その人が死んだ者は、必ず死刑に処せられる」。
    reason: 原文の接続構造と法的な定型表現を示すため。
lexical_decisions:
- source_word: מַכֵּה
  choice: 打って
  rationale: 動詞 נכה の分詞形で、判例法の条件となる行為者を示す。「打つ」は結果を動詞自体に織り込まず、原文の法的な事例提示を自然な現代日本語で表せる。
- source_word: אִישׁ
  choice: 人
  rationale: ここでは打撃を受ける一個人を指す。日本語の「人」は性別を不必要に限定せず、法規としての一般的適用範囲も自然に伝える。
- source_word: וָמֵת
  choice: 死なせた
  rationale: 接続詞と מות の完了形が、打撃の結果として被害者が死ぬことを示す。日本語では「打って死なせた」とすることで、その結果関係を簡潔かつ自然に表現する。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と受動態未完了形の組み合わせによる刑罰の強調を「必ず」で表し、受動の法的宣告を「死刑に処せられる」と明確に示す。
theological_decisions:
- issue: 死刑規定の法的表現
  choice: 死刑に処せられる
  alternative: 必ず殺される
  rationale: 原文の使役受動形は処刑の執行を規定する法的文脈にあるため、「死刑に処せられる」が現代日本語では明確である。ただし、執行主体は原文同様に明示しない。
translation_notes:
  register: 明快な現代標準日本語による、簡潔で厳粛な法規文。主文は結果関係を自然に表し、脚注でヘブライ語の連接的な構文を示した。
