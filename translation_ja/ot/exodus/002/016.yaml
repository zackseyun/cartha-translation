  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/כֹהֵ֥ן מִדְיָ֖ן שֶׁ֣בַע בָּנ֑וֹת וַ/תָּבֹ֣אנָה וַ/תִּדְלֶ֗נָה וַ/תְּמַלֶּ֨אנָה֙ אֶת הָ֣/רְהָטִ֔ים לְ/הַשְׁק֖וֹת צֹ֥אן אֲבִי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: ja
  text: ミディアンの祭司には七人の娘がいた[a]。娘たちはやって来て井戸の水をくみ[b]、父の羊と山羊の群れに水を飲ませるため、水おけを満たした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ミディアンのある祭司には」とも訳せる。ヘブライ語は、特定の祭司を指すとも、ミディアンに属する一人の祭司を指すとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「水をくみ」は、井戸から水をくみ上げることを表す動詞の訳。
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: ミディアンの祭司には
  rationale: לְを伴う所有構文を自然な日本語の「～には」とし、כֹהֵןは通常の意味で「祭司」、מִדְיָןは所属・地域的関連を示す「ミディアンの」と訳した。冒頭のוּは物語の連続・場面移行を示すが、現代日本語では接続語を加えず自然に表せる。
- source_word: שֶׁבַע בָּנוֹת
  choice: 七人の娘がいた
  rationale: 人を数える自然な助数詞を用い、ヘブライ語の所有を表す名詞文を「～には…がいた」とした。
- source_word: וַתָּבֹאנָה
  choice: 娘たちはやって来て
  rationale: בואの単純な移動を表す。女性複数形の主語を明示して、日本語で指示対象を明瞭にした。
- source_word: וַתִּדְלֶנָה
  choice: 井戸の水をくみ
  rationale: דלהは井戸などから水をくみ上げることを指す。原文で目的語は省略されているが、文脈上の水を補い、文化的状況を明瞭にするため「井戸の」を添えた。
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: 水おけを満たした
  rationale: רְהָטִיםは家畜に水を与えるための水おけ・水路状の設備を指す。この場面で最も明快な「水おけ」を選んだ。
- source_word: לְהַשְׁקוֹת
  choice: 水を飲ませるため
  rationale: שקהのヒフィルは「飲ませる」を意味する。「水をやる」より、家畜が飲むことを明確に表した。
- source_word: צֹאן
  choice: 羊と山羊の群れ
  rationale: צֹאןは羊だけでなく山羊も含み得る小家畜の集合語であるため、現代の読者に範囲が伝わるよう明示した。
- source_word: אֲבִיהֶן
  choice: 父の
  rationale: 女性複数の所有接尾辞を、直前の娘たちを受ける自然な日本語の所有表現にした。
theological_decisions:
- issue: כֹהֵן מִדְיָןが特定の祭司か不特定の祭司か
  choice: 本文では「ミディアンの祭司」とし、特定性を断定しない
  alternative: 「ミディアンのある祭司」
  rationale: ヘブライ語ではכֹהֵן自体に定冠詞がなく、構文と文脈から「その祭司」とも「一人の祭司」とも理解され得る。日本語の無冠詞的な「ミディアンの祭司」はこの曖昧さを比較的よく保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。短い物語文として流れを整えつつ、原文の動作の順序を保持した。「羊と山羊の群れ」はצֹאןの意味範囲を普通の読者に明示する訳。脚注記号は対応箇所に配置した。
