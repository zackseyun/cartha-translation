source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת נַאֲקָתָ֑/ם וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם אֶת יִצְחָ֥ק וְ/אֶֽת יַעֲקֹֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: ja
  text: 神は彼らのうめき声を聞いた[a]。そして神は、アブラハム、イサク、ヤコブとのご自分の契約を思い起こした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らのうめきを」。ヘブライ語の名詞は、圧迫の中で発するうめき、または苦悶の叫びを指し得る。
    reason: lexical_alternative
  - marker: b
    text: ここで「思い起こした」とは、神がそれまで忘れていたという意味ではない。契約に忠実に向き合い、それに基づいて行動されることを示す契約上の表現である。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 聞いた
  rationale: שׁמע の基本義を保ち、イスラエルの苦しみの声が神に届いたことを自然な現代日本語で表す。「耳を傾けた」では継続的・意志的な傾聴を強く含み得るため採らない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、ここでは単数の動詞を伴い、イスラエルの唯一の神を指す。原文で二度明示されるため、訳文でも「神」を繰り返した。
- source_word: נַאֲקָתָם
  choice: 彼らのうめき声
  rationale: נַאֲקָה は圧迫と苦痛の中で漏れるうめき、または苦悶の叫びを表す。「うめき声」は文脈に自然で、形式的な哀歌を連想させる「嘆き」より具体的である。
- source_word: וַיִּזְכֹּר
  choice: 思い起こした
  rationale: זכר の通常の語義を保つ。契約に基づく行動への含意はあるが、「契約を実行した」などと訳文内で説明せず、原文の神学的緊張を残す。
- source_word: בְּרִיתוֹ
  choice: ご自分の契約
  rationale: בְּרִית を標準的な「契約」とし、三人称男性単数接尾辞による神への帰属を、日本語で主語との照応が明確な「ご自分の」で示す。
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: アブラハム、イサク、ヤコブとの
  rationale: 「契約」と三族長との関係を日本語の助詞「との」で明示する。原文には各名の前に目的語標識が反復されるが、日本語で「と」を逐一反復すると不自然になるため、列挙のリズムを優先した。
theological_decisions:
- issue: 「神が思い起こした」という擬人的・契約的表現
  choice: 本文に「思い起こした」を残し、脚注で契約的含意を説明する。
  alternative: 「神は契約に従って行動を起こした」「神は契約に目を留めた」
  rationale: 原文は通常の記憶の語を用いながら、契約への忠実さとそれに続く行動を示唆する。神が忘れていたという意味を避けようとして本文を意訳すると、原文の表現と神学的緊張を先回りして解消してしまう。
translation_notes:
  register: 明快で格調を失わない現代標準日本語とした。原文で「神」が二度現れる構造を保つため二文に分け、「そして神は」と明示した。神への過度な敬語化は避けつつ、所有表現には自然な敬意を伴う「ご自分の」を用いた。脚注記号は該当語句の直後に置いた。
