  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: ja
  text: その女は身ごもって男の子を産んだ。その子が良い[a]のを見て、三か月の間、彼を隠した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「美しい」とも訳せる。ヘブライ語は直訳すると「良い」で、文脈によって、見た目が好ましい、またはすばらしいという意味にもなりうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: 身ごもって
  rationale: 妊娠する、受胎することを表す。現代日本語の物語として自然で、出来事の順序も明確に伝える。
- source_word: הָאִשָּׁה
  choice: その女
  rationale: 本文は明示的に「女」としており、この節では「妻」という関係語を補わない。定冠詞は文脈を受ける「その」で表した。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産んだ
  rationale: 出産を表す標準的な表現。現代日本語では「息子を産んだ」よりも、誕生時の子どもを指す「男の子」が自然である。
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: その子が良いのを見て
  rationale: 目的語とכִּי節による母親の認識を自然な日本語にした。「見て」は、実際に子を見たことと、そう認めたことの双方を保つ。
- source_word: כִּי טוֹב הוּא
  choice: その子が良い
  rationale: טוֹבの基本義「良い」を保ち、創世記1章との響きの可能性も残す。「美しい」は文脈上可能だが意味を限定するため脚注に置いた。
- source_word: וַתִּצְפְּנֵהוּ
  choice: 彼を隠した
  rationale: 隠す、ひそかに置くという意味を直接的に表す。「彼」により接尾代名詞の男性単数を保持した。
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: 三か月の間
  rationale: יֶרַחは月を意味する。期間であることを自然な日本語で明示した。
theological_decisions:
- issue: 乳児を表すטוֹבの意味
  choice: 良い
  alternative: 美しい、愛らしい、立派な
  rationale: ヘブライ語の基本的で広い意味を本文に残し、美的評価へ限定しない。また、創造物を「良い」と見る創世記の語法との文学的な響きも保持できる。一方、「美しい」は古くからある有力な文脈的理解なので脚注で示す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語文としての簡潔さと品位を保った。「良い」というやや幅のある表現は原文の語義的曖昧さを意図的に保持する。
