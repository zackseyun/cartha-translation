  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: ja
  text: しかし、その男は言った。「だれがおまえを私たちの上に立つ指導者や裁判官に任命したのか。あのエジプト人を殺したように、私を殺すつもりなのか。」そこでモーセは恐れ、「確かに、このことは知られてしまった」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: だれがおまえを…任命したのか
  rationale: שׂים はここでは権威ある地位に「置く、任命する」の意。挑戦的な問いの調子を保った。
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: 指導者や裁判官
  rationale: אִישׁ は後続する役割語を導く表現であり、日本語で「一人の男、指導者、裁判官」とすると不自然なため、役割を自然に示した。שַׂר は文脈上、支配権を持つ者を指すが、「支配者」より自然な「指導者」とした。接続詞は、二つの役割を並べる日本語として「や」を用いた。
- source_word: עָלֵינוּ
  choice: 私たちの上に立つ
  rationale: עַל が示す、話者たちに対する権威関係を明示した。
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: 私も殺すつもりなのか
  rationale: 直訳的には「私を殺そうとあなたは言っているのか」に近いが、אמר は意図を表す用法と理解できるため、自然な現代日本語で殺害の意図を問う表現とした。
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: あのエジプト人を殺したように
  rationale: 比較節をそのまま保ち、定冠詞は既出の人物を指す「あの」で表した。
- source_word: וַיִּירָא מֹשֶׁה
  choice: そこでモーセは恐れ
  rationale: 物語の連続を「そこで」で示し、ירא の恐怖を簡潔に表した。
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: 確かに、あのことは知られてしまった
  rationale: אָכֵן は認識・確信を示す「確かに」。דָּבָר は直前の殺害事件を指すため「あのこと」とし、完了的な露見とモーセにとって望ましくない結果を「知られてしまった」で自然に表した。
theological_decisions:
- issue: לְאִישׁ の男性名詞を訳文に明示するか
  choice: 独立した「男」は置かず、「指導者や裁判官」とする
  alternative: 「一人の男、指導者、裁判官」または「人物として、指導者また裁判官」
  rationale: אִישׁ はここで人物の性別を対比的に強調するより、שַׂר וְשֹׁפֵט を導く同格的表現として機能する。日本語で逐語的に重ねると意味が不明瞭になるため、文脈上の役割を明確にした。神学的含意を追加しない。
- issue: הַלְהָרְגֵנִי אַתָּה אֹמֵר の統語的曖昧さ
  choice: 殺害の意図を問う直接疑問として訳す
  alternative: 「私を殺すと、おまえは言うのか」
  rationale: אמר を「意図する」の意味で取るのが文脈に適し、日本語としても自然である。発言そのものを引用したと断定する入れ子の引用は避けた。
translation_notes:
  register: 現代の標準的な日本語による、明快で格調を保った物語文。「おまえ」は男の敵対的な問いに合うが、過度に古風な語尾は避けた。原文の緊張感とモーセの恐れを簡潔に保持した。
