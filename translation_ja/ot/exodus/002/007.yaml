base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: ja
  text: そこで、その子の姉はファラオの娘に言った。「私が行って、あなたのためにヘブライ人の女たちの中から乳母を呼んで来ましょうか。そうすれば、その人があなたのためにこの子に乳を飲ませてくれます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: そこで……言った
  rationale: 接続形による物語の進行を、自然な現代日本語で示す。
- source_word: אֲחֹתוֹ
  choice: その子の姉
  rationale: 直訳は「彼の姉」だが、日本語では指示対象を明確にしつつ、文脈上の幼子を指す。年齢関係から「姉」が自然。
- source_word: בַּת פַּרְעֹה
  choice: ファラオの娘
  rationale: ヘブライ語の連語を簡潔かつ自然に表す。
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: 私が行って……呼んで来ましょうか
  rationale: 疑問形の一人称未完了が表す申し出を「ましょうか」で表し、呼びに行く動作を自然な日本語の「呼んで来る」とした。
- source_word: אִשָּׁה מֵינֶקֶת
  choice: 乳母
  rationale: ここでは乳を与えられる女性を指すため、現代日本語で簡潔な「乳母」を採用した。
- source_word: מִן הָעִבְרִיֹּת
  choice: ヘブライ人の女たちの中から
  rationale: 前置詞が示す集団内からの選択を明示する。
- source_word: וְתֵינִק
  choice: 乳を飲ませてもらう
  rationale: 使役語幹の字義「吸わせる」を自然な日本語で表し、提案の目的として訳した。
- source_word: הַיָּלֶד
  choice: この子
  rationale: 場面にいる特定の幼子を指す定冠詞を、日本語の自然な指示表現で表した。
