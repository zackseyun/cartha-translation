base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: ja
  text: 彼女はそれを開け、その子を見た。すると、男の子が泣いていた。彼女はその子をかわいそうに思い、言った。「これはヘブライ人の子どもの一人だ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: 彼女がそれを開けると
  rationale: 動詞は「開ける」。目的語は直前の文脈にある籠を指すため、日本語では自然さと明瞭さのため「それ」を補った。連続する出来事は「〜すると」で表した。
- source_word: וַתִּרְאֵהוּ אֶת־הַיֶּלֶד
  choice: その子が見えた
  rationale: 動詞の男性単数接尾辞を、直後の「その子」が同格的に明示する。日本語で「彼を、その子を見た」とすると不自然なため、指示対象を明示して自然に訳した。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 見たものへ鮮明に注意を向ける提示辞。現代日本語で場面の発見と意外性を自然に示す「見ると」を採った。
- source_word: נַעַר
  choice: 男の子
  rationale: 年齢幅のある語だが、ここでは幼いモーセを男性として描写する。「少年」では年長に響くため「男の子」とした。
- source_word: בֹּכֶה
  choice: 泣いていた
  rationale: 分詞が、目にした時点で続いていた動作を表すため、継続を示す形で訳した。
- source_word: וַתַּחְמֹל עָלָיו
  choice: その子をかわいそうに思い
  rationale: חמל＋עַל は同情・憐れみを表す。「憐れんだ」より一般読者に明快で、感情の動きを自然に伝える表現とした。
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: ヘブライ人の子どもの一人
  rationale: מן の部分を表す用法を「〜の一人」で示し、その子がヘブライ人の子どもたちに属すると見抜いた意味を保持した。
- source_word: זֶה
  choice: これは
  rationale: 目の前の子を指す指示語を、直接話法で自然な「これは」とした。
