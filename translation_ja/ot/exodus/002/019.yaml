  text: וַ/תֹּאמַ֕רְןָ אִ֣ישׁ מִצְרִ֔י הִצִּילָ֖/נוּ מִ/יַּ֣ד הָ/רֹעִ֑ים וְ/גַם דָּלֹ֤ה דָלָה֙ לָ֔/נוּ וַ/יַּ֖שְׁקְ אֶת הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: ja
  text: 彼女たちは言った。「エジプト人の男が、羊飼いたちの手から私たちを救い出してくれました[a]。そのうえ、私たちのために水までくんで[b]、群れに水を飲ませてくれました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「羊飼いたちの手から」。「手」はここでは、その力や支配を表す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「くむ」という同じ語根が重ねられ、水をくむ行為が強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: 彼女たちは言った
  rationale: 三人称女性複数形を明示し、直前の娘たちを自然に受ける。接続の וַ は日本語では文脈上あえて「そして」と訳さない。
- source_word: אִישׁ מִצְרִי
  choice: エジプト人の男
  rationale: אִישׁ と מִצְרִי の両要素を保ちつつ、現代日本語で理解しやすい表現とした。
- source_word: הִצִּילָנוּ
  choice: 私たちを救い出してくれました
  rationale: נצל のヒフィルが表す、危険や支配から助け出す具体的な行為を「救い出す」で表し、娘たちの父への報告として授受補助動詞を用いた。
- source_word: מִיַּד הָרֹעִים
  choice: 羊飼いたちの手から
  rationale: 「手」が力・支配を指すヘブライ語の比喩を本文に残した。日本語でも意味を取れるが、字義と含意を脚注で補う。
- source_word: וְגַם
  choice: そのうえ……まで
  rationale: 救出だけでなく水をくむことまでした、という付加と強調を自然な日本語で表した。
- source_word: דָּלֹה דָלָה
  choice: 水までくんで
  rationale: 不定詞絶対形と定動詞の同語根反復による強調を、「まで」と脚注によって示した。「水」は動詞 דלה の文脈上の目的語として日本語では補う必要がある。
- source_word: וַיַּשְׁקְ אֶת הַצֹּאן
  choice: 群れに飲ませてくれました
  rationale: שקה の使役的意味を「飲ませる」で表し、צאן は羊や山羊を含み得る集合名詞なので、種類を限定しない「群れ」とした。
