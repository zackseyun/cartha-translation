id: EXO.2.5
reference: Exodus 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: ja
  text: ファラオの娘は、水浴びをするためナイル川へ下りた。一方、付き添いの若い女たちはナイル川の岸辺を歩いていた。彼女は葦の中に籠[c][a]を見つけ、女の召使い[b]を遣わして、それを取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「葦の間に」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「彼女の女の召使い」。伝統的には「彼女の腕」と訳す場合もある。
    reason: alternative_reading
  - marker: c
    text: ここで「籠」と訳したヘブライ語は、創世記6—9章でノアの「箱舟」を指す語と同じである。
    reason: cross_reference
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: 下りて来た
  rationale: ירדの下降の意味を保ちつつ、語りの場面へ近づく自然な日本語とした。
- source_word: בַּת פַּרְעֹה
  choice: ファラオの娘
  rationale: ヘブライ語の連語を簡潔で慣用的な日本語にした。
- source_word: לִרְחֹץ
  choice: 水浴びをしようと
  rationale: רחץは「洗う／水浴びする」を意味するが、ナイル川へ下る文脈では全身の水浴びが自然である。目的を表す不定詞も反映した。
- source_word: עַל הַיְאֹר
  choice: ナイル川へ
  rationale: 前置詞はここでは場所を表す。移動動詞と目的表現に合わせ、自然な日本語では「ナイル川へ」とした。
- source_word: וְנַעֲרֹתֶיהָ
  choice: 付き添いの若い女たち
  rationale: נַעֲרוֹתの年齢と性別を保ち、所有接尾辞と宮廷の文脈から同行者であることを自然に示した。
- source_word: הֹלְכֹת
  choice: 歩いていた
  rationale: 分詞が表す、主要な出来事と同時進行する背景的・継続的動作を反映した。
- source_word: עַל יַד הַיְאֹר
  choice: ナイル川の岸辺を
  rationale: 「手のそばに」という慣用句の空間的意味を、文脈に即して「岸辺」と明示した。
- source_word: הַתֵּבָה
  choice: 籠
  rationale: 乳児を入れた小さな容器という当面の文脈には「籠」が自然である。同じ語がノアの箱舟にも使われることは脚注で保持した。
- source_word: בְּתוֹךְ הַסּוּף
  choice: 葦の茂みの中に
  rationale: סוּףを「葦」、בְּתוֹךְを「中に」とし、情景が明確で自然な表現にした。
- source_word: וַתִּשְׁלַח
  choice: 遣わして
  rationale: שלחの通常の意味「遣わす」を採り、後続する目的語を人として読むマソラ本文の統語を反映した。
- source_word: אֲמָתָהּ
  choice: 女奴隷
  rationale: マソラ本文の母音に従い、אָמָהを女性の奴隷・召使いと解した。「侍女」より身分を明確に伝える一方、「腕」という伝統的別解は脚注に残した。
- source_word: וַתִּקָּחֶהָ
  choice: それを取って来させた
  rationale: 接尾辞が籠を指すことを明示し、女奴隷を遣わした結果として籠を手元に得たという一連の動作を自然な日本語で表した。
theological_decisions:
- issue: モーセ物語における תבה の訳語
  choice: 籠
  alternative: 箱舟
  rationale: この場面では葦の中に置かれた乳児用の小さな容器なので「籠」が最も明瞭である。ただし創世記6—9章のノアの箱舟と同じヘブライ語であるという文学的・神学的つながりは脚注で示した。
- issue: אֲמָתָהּ の解釈
  choice: 女奴隷
  alternative: 彼女の腕
  rationale: マソラ本文の母音と、שלחが人を目的語に取る自然な構文に従った。ただし古くからある「腕」という読みも本文上の伝統として脚注に保存した。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文とした。「女奴隷」は現代の読者に社会的身分を曖昧にせず伝えるために用いた。背景動作は「その間」「歩いていた」で区別し、主筋の進行を読みやすくした。脚注記号は該当語の直後に置き、英語相談層で位置が混乱していた[a]を「葦の茂み」に対応させた。
