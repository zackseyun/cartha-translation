  naturalness: 「水浴びをするため」「一方」「女の召使い」は、明瞭で現代標準的な物語文として自然です。「遣わして、それを取った」は、主語を保ちつつ日本語としても無理がありません。
  terminology: 「ファラオ」「ナイル川」「葦」「籠」は適切です。אָמָהは女性の奉仕者を指すため、本文は自然で意味を狭めすぎない「女の召使い」とし、「腕」という伝統的な別読は脚注に保持します。「籠」とノア物語の同語との関係を示す脚注も維持します。
