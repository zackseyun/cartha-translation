revisions:
- from: ファラオの娘が水浴びをしようとナイル川へ下りて来た。その間、付き添いの若い女たちはナイル川の岸辺を歩いていた。彼女は葦の茂みの中に籠[c][a]があるのを見つけ、女奴隷[b]を遣わして、それを取って来させた。
  to: ファラオの娘は、水浴びをするためナイル川へ下りた。一方、付き添いの若い女たちはナイル川の岸辺を歩いていた。彼女は葦の中に籠[c][a]を見つけ、女の召使い[b]を遣わして、それを取った。
  rationale: 原文の動作主と叙述順序を保つため、下降を「下りた」とし、最後の動詞をファラオの娘自身による「それを取った」と訳し直した。女性の奉仕者の訳語は、現代日本語として自然な「女の召使い」に調整し、別読と語の相互参照は脚注に保持した。
