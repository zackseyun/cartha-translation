id: EXO.2.15
reference: Exodus 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: ja
  text: ファラオはこのことを聞くと[a]、モーセを殺そうとした。しかしモーセはファラオのもとから逃れ、ミディアンの地に住んだ。そして、井戸のそばに腰を下ろした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この出来事を知ると」。
    reason: שׁמע は基本的には「聞く」だが、ここでは事件を知るという意味にも取れるため。
  - marker: b
    text: ヘブライ語では、「ミディアンの地に住んだ」と「井戸のそばに腰を下ろした」に同じ動詞が用いられている。
    reason: ישׁב の反復と、文脈による「住む」「座る」という意味の違いを示すため。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 聞くと
  rationale: שׁמע の基本義「聞く」を保ちつつ、出来事を知ったという文脈にも自然に通じる表現とした。
- source_word: הַדָּבָר הַזֶּה
  choice: このこと
  rationale: דבר の幅を狭めすぎず、直前の事件を指す自然な現代日本語とした。
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: 殺そうとした
  rationale: בקש＋不定詞が表す意図ないし企てを、自然で過不足のない日本語にした。実際に殺害を試みたとまでは限定しない。
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: ファラオのもとから逃れ
  rationale: מִפְּנֵי の「面前・支配圏から」という含みを保ちながら、日本語として自然に表した。
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: ミディアンの地に住んだ
  rationale: ישׁב の居住を表す用法を訳した。「定住した」ほど永続性を強く含ませない。
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: 井戸のそばに腰を下ろした
  rationale: 同じ ישׁב の具体的な「座る」という意味を表し、עַל はこの場面に即して「そばに」とした。
- source_word: הַבְּאֵר
  choice: 井戸
  rationale: ヘブライ語には定冠詞があるが、日本語では「その井戸」とすると既出性を不自然に強めるため、無標の「井戸」とした。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: 現代日本語で一般的な王号の音写を用いた。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明快で格調を失わない現代標準日本語。「しかし」で場面の転換を示し、「住んだ／腰を下ろした」によって原文の同一動詞の意味の移り変わりを自然に表現した。すべての脚注記号を本文中に配置した。
