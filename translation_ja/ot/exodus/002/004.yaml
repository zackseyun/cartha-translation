  text: וַ/תֵּתַצַּ֥ב אֲחֹת֖/וֹ מֵ/רָחֹ֑ק לְ/דֵעָ֕ה מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: ja
  text: その子の姉は、彼がどうされるのかを知ろうとして、遠く離れた所に立っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その子に何が起こるのかを見届けようとして、遠くから立っていた。」
    reason: 「知る」「なされる」「遠くから」に関する、より自然な出来事表現と位置表現の可能性を示すため。
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: 立っていた
  rationale: ヒトパエル形は、その場に身を置いて立つことを表す。文脈上は継続的に見守る姿なので、自然な現代日本語として「立っていた」とした。
- source_word: אֲחֹתוֹ
  choice: その子の姉
  rationale: 三人称男性単数接尾辞を伴う「彼の姉妹」。直前の幼子を明確に指し、日本語で自然になるよう「その子の姉」とした。姉か妹かは語形自体では限定されないが、この物語の人物関係と自然な叙述に従った。
- source_word: מֵרָחֹק
  choice: 遠く離れた所に
  rationale: 空間的な隔たりを示す。「遠くから」も可能だが、立っていた位置を明確に表すため「遠く離れた所に」とした。
- source_word: לְדֵעָה
  choice: 知ろうとして
  rationale: ידעの不定詞に目的を表すלְが付いた形。「知るために」を自然な目的表現にしつつ、原語の「知る」を保った。
- source_word: מַה
  choice: どう
  rationale: 後続する受動表現と合わせ、「何がなされるか」より自然な日本語となる「どうされるのか」とした。
- source_word: יֵּעָשֶׂה
  choice: されるのか
  rationale: עשהのニファル未完了形の受動を保持した。「どうなるのか」よりも、誰かの行為が幼子に及ぶという原文の受動性を残す。
- source_word: לוֹ
  choice: 彼が
  rationale: 原語は字義的には「彼に」だが、日本語の受動文では対象を主語として「彼がどうされる」とするのが自然である。
