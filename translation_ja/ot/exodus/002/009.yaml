  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: ja
  text: ファラオの娘は彼女に言った。「この子を連れて行き、私のために乳を飲ませて[a]ください。あなたには私が報酬を払いましょう。」そこで、その女はその子を連れて行き、乳を飲ませた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私のために授乳してください」。
    reason: 原語は、子どもに乳を与えて飲ませる行為を表す。
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: ファラオの娘
  rationale: 構成形による親子関係を、自然で簡潔な現代日本語で表した。
- source_word: הֵילִיכִי
  choice: 連れて行き
  rationale: הלכ のヒフィル命令形で、ここでは子どもを伴ってその場から行くよう命じる表現。「連れて行く」が文脈に即して自然である。
- source_word: הַיֶּלֶד הַזֶּה
  choice: この子
  rationale: יֶלֶד は子どもを指す一般的な語であり、乳児という文脈を保ちつつ原文以上に限定しない表現とした。
- source_word: וְהֵינִקִהוּ לִי
  choice: 私のために乳を飲ませて
  rationale: ינק のヒフィルは乳を与えて飲ませることを表し、לִי はファラオの娘のために行うことを示す。「乳を飲ませる」は明瞭で自然である。
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: あなたには私が報酬を払いましょう
  rationale: שָׂכָר は働きに対する賃金・報酬を意味する。「私が」という主語の明示も保ちつつ、日本語として自然にした。
- source_word: הָאִשָּׁה
  choice: その女
  rationale: 文脈上は子どもの母親だが、この節の原文は「女」とだけ記すため、その限定を加えなかった。
- source_word: וַתִּקַּח הָאִשָּׁה הַיֶּלֶד
  choice: その女はその子を引き取り
  rationale: לקח の基本的な「取る」を、この場面で子どもを託されて連れて行く意味が伝わる自然な日本語にした。
- source_word: וַתְּנִיקֵהוּ
  choice: 乳を飲ませた
  rationale: 前半と同じ語根の授乳行為を一貫して表し、母乳を与えたことが明確に伝わる訳とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準語を用いた。ファラオの娘の命令は、女性への直接の依頼・指示として「ください」とし、過度に尊大な調子を避けた。「その女」は原文の指示を保ち、文脈から分かる「母親」を本文に補わなかった。
