  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: ja
  text: ファラオの娘は彼女に、「行きなさい」と言った。そこで、その若い娘は行って、その子の母親を呼んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: ファラオの娘
  rationale: ヘブライ語の連語を自然な現代日本語の所有表現で訳し、人物関係を明確にした。
- source_word: לֵכִי
  choice: 行っておいで
  rationale: 女性単数への短い命令。文脈上、依頼を受けた年若い女性への発話として自然であり、命令形の簡潔さも保つ。
- source_word: הָעַלְמָה
  choice: その若い娘
  rationale: עַלְמָהは若い女性を指す。ここではモーセの姉を指し、「乙女」の古風さを避けつつ、文脈に適した年若さを表した。
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: その子の母親を呼んだ
  rationale: קראはここでは人を呼ぶ、連れて来るよう招く意。ヘブライ語の直接的な叙述に沿った自然な表現とした。
- source_word: הַיָּלֶד
  choice: その子
  rationale: יֶלֶדを過度に限定せず、直前から話題となっている幼子を自然に指し示す訳語とした。
