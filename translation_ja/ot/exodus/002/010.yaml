  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: ja
  text: その子が成長すると、彼女はその子をファラオの娘のもとへ連れて行った。その子は彼女の息子となった。[a] 彼女はその子をモーセ[b]と名づけた。「私が水から彼を引き上げたからです」と言ったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼女の息子となった」「彼女にとって息子のような存在となった」。ヘブライ語は親子としての関係を表すが、法的な養子縁組の手続きについては述べていない。
    reason: lexical_alternative
  - marker: b
    text: 「モーセ」という名は、ヘブライ語の「引き上げた」という表現を連想させる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: 成長すると
  rationale: גדלはここでは身分上の偉大さではなく、幼子が育ったことを表す。「成長する」は年齢的な成熟を自然かつ簡潔に伝える。
- source_word: הַיֶּלֶד
  choice: その子
  rationale: יֶלֶדは「子ども」「男の子」を意味し得る。直前までの幼児期とのつながりを保ち、日本語の物語として自然な「その子」とした。
- source_word: וַתְּבִאֵהוּ
  choice: その子を…のもとへ連れて行った
  rationale: בואのヒフィル形は「連れて来る／行く、持って来る」を表す。話者の視点を不自然に固定せず、母が子をファラオの娘のもとへ移したことを明確にした。
- source_word: לְבַת פַּרְעֹה
  choice: ファラオの娘のもとへ
  rationale: 構成関係をそのまま明瞭な現代日本語で表した。
- source_word: וַיְהִי לָהּ לְבֵן
  choice: ファラオの娘の息子となった
  rationale: 直訳的な関係表現を自然な日本語にし、養子としての息子の身分を示唆しつつ、本文にない法的手続きまでは補わない。代名詞の連続による曖昧さを避けるため「ファラオの娘」を明示した。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: その子を…と名づけた
  rationale: ヘブライ語の命名定型句を、自然な現代日本語の命名表現で訳した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している固有名表記を用いた。
- source_word: כִּי
  choice: …から
  rationale: 名の由来を説明する理由節として自然な日本語にした。
- source_word: מִן הַמַּיִם
  choice: 水の中から
  rationale: מַיִםは形態上複数だが、この文脈では集合的な「水」。救出の動きを自然に表すため「水の中から」とした。
- source_word: מְשִׁיתִהוּ
  choice: 私がこの子を…引き上げた
  rationale: 動詞משׁהの「引き出す、引き上げる」という意味を保ち、モーセの名との語呂合わせは脚注で示した。
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵןにおけるモーセとファラオの娘の関係
  choice: 「息子となった」とし、実質的な親子関係を本文で示す
  alternative: 「彼女にとって息子のようになった」として比喩的関係に弱める
  rationale: ヘブライ語はモーセが彼女に対して息子となったことを述べるが、正式な養子縁組の法的手続きは記さない。強い親子関係を保ちつつ、制度上の詳細は訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ファラオ」は一般読者にも通じる定着表記とした。母とファラオの娘を代名詞だけで示すと日本語では主語が曖昧になるため、後半では「ファラオの娘」を明示した。脚注記号は該当する「息子となった」と「モーセ」の直後に置いた。
