base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: ja
  text: しかし、もうその子を隠しておけなくなったので、母親はその子のためにパピルスの籠[a]を用意し、瀝青とピッチを塗った。そして、その中に子どもを入れ、ナイル川の岸辺の葦の茂みに置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「パピルスの箱舟」。ここで「籠」と訳したヘブライ語テーバーは、創世記でノアの「箱舟」に使われている語と同じであり、水を通した救いを想起させる文学的な響きがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: その子を隠しておく
  rationale: צפןのヒフィル形と三人称男性単数接尾辞を、継続して人目から隠す文脈に即して自然な現代日本語で表した。
- source_word: תֵּבַת גֹּמֶא
  choice: パピルスで編んだ籠
  rationale: גֹּמֶאを具体的に「パピルス」とし、乳児を収める小型の容器という文脈からתֵּבָהを「籠」とした。「編んだ」は素材から自然に補った表現であり、同語がノアの箱舟にも使われることは脚注で保持した。
- source_word: וַתַּחְמְרָה בַחֵמָר וּבַזָּפֶת
  choice: 瀝青と樹脂を塗った
  rationale: חֵמָרは防水材としての瀝青、זֶפֶתは樹脂質のピッチを指すため、両者を区別しつつ日本語で理解可能な語を選んだ。動詞は表面を覆う行為として「塗った」とした。
- source_word: הַיֶּלֶד
  choice: 子ども
  rationale: יֶלֶדの基本的な意味を保ち、「赤ん坊」と過度に限定しなかった。前半では日本語の指示関係を明瞭にするため「その子」とした。
- source_word: בַּסּוּף
  choice: 葦の茂みに
  rationale: סוּףは水辺の葦や水草を指す。単なる位置より、植物の中に置いた情景が自然に伝わるよう「茂みに」とした。
- source_word: עַל שְׂפַת הַיְאֹר
  choice: ナイル川の岸辺
  rationale: 出エジプト記のエジプト文脈ではיְאֹרはナイル川を指す。「唇」を原義とするשָׂפָהはここでは水際・岸を意味するため「岸辺」とした。
- source_word: לֹא יָכְלָה עוֹד
  choice: もう…できなくなると
  rationale: 限界に達してそれ以上続けられなくなったことを、簡潔で自然な日本語にした。
- source_word: לּוֹ
  choice: その子のために
  rationale: ヘブライ語の与格代名詞を明示し、容器が子どものために用意されたことを保持した。
theological_decisions:
- issue: תֵּבָהが創世記のノアの箱舟と共有する語彙的・文学的連関
  choice: 本文では文脈に合う「籠」とし、脚注で「箱舟」という訳語と水を通した救出の文学的響きを示す
  alternative: 本文を「パピルスの箱舟」とする
  rationale: 乳児用の容器としての即時的な理解を損なわず、同時に原語にある創世記との重要な連関を読者から隠さないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「瀝青」はやや専門的だが素材を正確に区別でき、文脈から防水材であることも理解できる。「母親」はヘブライ語の動詞が示す女性主語を前節の文脈に沿って明示した。
