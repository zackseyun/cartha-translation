  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: ja
  text: レビの家の一人の男が行き、レビの娘を妻に迎えた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レビ人の女性」とも訳せる。ヘブライ語では直訳すると「レビの娘」で、レビの子孫である女性を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 出て行き
  rationale: הלך の基本的な移動の意味と、物語を進める連続動作を保つ。「行き」も可能だが、日本語では「出て行き」が動作として自然であり、結婚の意味までこの語に含めない。
- source_word: אִישׁ
  choice: 一人の男
  rationale: 男性個人を指し、ここでまだ名を示さない原文の語り方を保つ。「夫」は婚姻関係を先取りする。
- source_word: מִבֵּית לֵוִי
  choice: レビの家の
  rationale: 「レビの家」という系譜的表現を保つ。「レビ族の」も意味として可能だが、原文の בֵּית（家）を明示する。
- source_word: וַיִּקַּח
  choice: 妻に迎えた
  rationale: לקח の字義は「取った」だが、女性を目的語とするこの文脈では婚姻を表す。「取った」では現代日本語で不自然かつ誤解を招くため、慣用的意味を自然に示す。
- source_word: אֶת
  choice: 訳出しない
  rationale: 定目的語を示す文法標識であり、日本語で対応する独立語を必要としない。
- source_word: בַּת לֵוִי
  choice: レビの娘
  rationale: 原文の系譜的な言い方を保つ。レビ本人の直接の娘ではなく、レビの女の子孫、すなわちレビ人の女性を意味するため脚注で説明する。
