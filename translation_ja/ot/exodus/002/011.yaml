  terminology: 「兄弟たち」は原文の家族語を保持しており、脚注によって同胞的な用法を明示する方針は適切である。後半は「モーセの兄弟たちの一人」として指示対象を明確にし、原文の反復と連帯のニュアンスを保つ。
