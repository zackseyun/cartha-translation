revisions:
- from: そのころのことであった。成人したモーセは、自分の兄弟たち[a]のところへ出て行き、彼らが負わされている重荷を目にした。そして、一人のエジプト人が、自分の兄弟の一人であるヘブライ人を打っているのを見た。
  to: そのころ、モーセは成長して、自分の兄弟たち[a]のもとへ出て行き、彼らが負っていた重荷を見た。すると、一人のエジプト人が、モーセの兄弟たちの一人であるヘブライ人を打っているのを見た。
  rationale: 安全な修正が必要である。後半の「自分の兄弟」の指示対象をモーセに明示して、エジプト人の兄弟と誤読される可能性を除いた。あわせて、「成人した」を原文の意味範囲を狭めない「成長して」に、「負わされている重荷」をより直接的な「負っていた重荷」に整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:45:51Z'
