source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יָּמִ֣ים הָ/הֵ֗ם וַ/יִּגְדַּ֤ל מֹשֶׁה֙ וַ/יֵּצֵ֣א אֶל אֶחָ֔י/ו וַ/יַּ֖רְא בְּ/סִבְלֹתָ֑/ם וַ/יַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ עִבְרִ֖י מֵ/אֶחָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: ja
  text: そのころ、モーセは成長して、自分の兄弟たち[a]のもとへ出て行き、彼らが負っていた重荷を見た。すると、一人のエジプト人が、モーセの兄弟たちの一人であるヘブライ人を打っているのを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」とは、実の兄弟だけでなく、同族の者たち、すなわちモーセと同じヘブライ人たちを指す。後半の「モーセの兄弟たちの一人」も同じ意味である。
    reason: 原文の家族語が表す連帯を本文で保ちながら、日本語で実の兄弟だけを指すとの誤解を避けるため。
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: そのころのことであった
  rationale: ヘブライ語の物語を進める定型句を、古風になりすぎない自然な日本語で表した。明示されていない「さて」などは加えていない。
- source_word: וַיִּגְדַּל
  choice: 成人した
  rationale: この文脈では、偉大になったことではなく、モーセが成長して大人になったことを示す。
- source_word: אֶל אֶחָיו
  choice: 自分の兄弟たちのところへ
  rationale: 同じヘブライ人に対するモーセの血縁的な連帯を示す原文の家族語を保持した。日本語では実の兄弟とも読めるため、脚注で意味を補った。
- source_word: בְּסִבְלֹתָם
  choice: 彼らが負わされている重荷
  rationale: 強制労働という文脈を「負わされている」で示しつつ、原語の具体的かつ経験的な「重荷」の表現を残した。
- source_word: אִישׁ מִצְרִי
  choice: 一人のエジプト人
  rationale: אִישׁを人数表現として自然に反映し、後続するヘブライ人との対照を保った。
- source_word: מַכֶּה
  choice: 打っている
  rationale: 分詞が表す進行中の身体的暴行を、強度を過度に限定せずに表した。
- source_word: אִישׁ עִבְרִי
  choice: ヘブライ人
  rationale: 自然な日本語を優先しつつ、エジプト人との民族的対照を明確にした。
- source_word: מֵאֶחָיו
  choice: 自分の兄弟の一人
  rationale: 前半の「兄弟たち」との語彙的なつながりを保ち、モーセとそのヘブライ人との連帯を示した。
theological_decisions:
- issue: אֶחָיו / מֵאֶחָיו の親族表現
  choice: 兄弟たち／兄弟の一人
  alternative: 同胞たち／同胞の一人
  rationale: 「同胞」のほうが対象範囲は明快だが、原文は家族語によってモーセとヘブライ人との結びつきを表しているため、本文では「兄弟」を保持し、脚注で集合的な意味を説明した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての品位を保った。「兄弟」という原文の反復を維持し、説明は脚注に置いた。
