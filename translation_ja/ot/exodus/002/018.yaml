  text: וַ/תָּבֹ֕אנָה אֶל רְעוּאֵ֖ל אֲבִי/הֶ֑ן וַ/יֹּ֕אמֶר מַדּ֛וּעַ מִהַרְתֶּ֥ן בֹּ֖א הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: ja
  text: 娘たちが父レウエルのもとに帰ると、父は言った。「今日はどうして、こんなに早く帰って来たのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל
  choice: 娘たちが……のもとに帰ると
  rationale: 女性複数形の主語を文脈から「娘たち」と明示し、父のもとへの移動であるため、בוא の基本義「来る」を自然な日本語の「帰る」で表した。接続形は、後続する父の発言との時間的連続を「～すると」で示した。
- source_word: רְעוּאֵל
  choice: レウエル
  rationale: ヘブライ語の人名 רְעוּאֵל に即して音写した。
- source_word: אֲבִיהֶן
  choice: 父
  rationale: אָב に女性複数所有接尾辞が付いた形で、文脈上、娘たちの父を指す。日本語では直前の「娘たち」との関係が明白なので、不自然な「彼女たちの父」を避けた。
- source_word: וַיֹּאמֶר
  choice: 父は言った
  rationale: 物語を進める אמר の接続形を、自然な発話導入として訳した。主語を「父」と補って話者を明確にした。
- source_word: מַדּוּעַ
  choice: どうして
  rationale: 理由を問う語。家族間の直接話法として自然であり、現代日本語で明瞭な「どうして」を選んだ。
- source_word: מִהַרְתֶּן בֹּא
  choice: こんなに早く帰って来た
  rationale: מהר のピエル完了形と בוא の不定詞による「急いで来る」を、日本語では結果として到着が早いことを問う自然な表現にした。「帰って来た」は、娘たちが父のもとへ戻った場面を表す。
- source_word: הַיּוֹם
  choice: 今日は
  rationale: 定冠詞付き יוֹם はここで「今日」を意味する。疑問の焦点が今日の早い帰宅にあることを自然な語順で示した。
