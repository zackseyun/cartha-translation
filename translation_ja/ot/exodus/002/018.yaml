translation_notes:
  register: 明瞭で現代的な標準日本語を用い、父娘の会話として自然でありながら、聖書物語にふさわしい落ち着いた文体とした。原文の女性複数形は「娘たち」と明示し、二つの連続する物語動詞の関係は「帰ると、父は言った」で再現した。
