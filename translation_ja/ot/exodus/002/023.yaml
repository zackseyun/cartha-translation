id: EXO.2.23
reference: Exodus 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: ja
  text: 長い年月の後に[a]、エジプトの王は死んだ。イスラエルの子ら[b]は奴隷労働[c]のためにうめき、叫び声を上げた。彼らの助けを求める叫びは、奴隷労働のために、神のもとへ上った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その長い日々の間に」。ここでは、長い期間がたった後に、という意味で用いられている。
    reason: ヘブライ語の時間句の直訳的な形を示しつつ、日本語本文の慣用的な表現との関係を明確にするため。
  - marker: b
    text: 「イスラエルの子ら」は、イスラエルの民全体を指す。
    reason: 原語の親族的表現と、その集合的な指示対象の関係を明確にするため。
  - marker: c
    text: 「奴隷労働」は「労働」「労役」とも訳せる語。ここでは強制される抑圧的な労働を指す。
    reason: 語の基本的な幅と、この文脈での意味を示すため。
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立した「さて」等を置かず、時間節を伴う物語文として表現）
  rationale: 物語の展開を導く wayyiqtol。現代日本語では、明示的な「今」を補わず、後続の時間句とともに自然な叙述にした。
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: 長い年月が過ぎるうちに
  rationale: 直訳的には「その多くの日々の間に」。長期間の経過を示す一方、厳密に「その後」と断定しない表現とした。
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: エジプトの王は死んだ
  rationale: 主語と出来事を簡潔に保つ直接的な訳。
- source_word: וַיֵּאָנְחוּ
  choice: うめき
  rationale: 圧迫下の苦しみから出る声を表すため、「ため息をつく」より重い「うめく」を選んだ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の形を見える形で保った。民族全体を集合的に指すことは注で明示する。
- source_word: מִן הָעֲבֹדָה
  choice: 奴隷労働のために
  rationale: עֲבֹדָה 自体は労働・奉仕を指し得るが、この文脈ではエジプトによる強制的で抑圧的な労役である。「奴隷労働」は労働の語義と隷属状況の双方を伝える。二度の反復も保持した。
- source_word: וַיִּזְעָקוּ
  choice: 叫び声を上げた
  rationale: 苦難の中から強く叫ぶ動作を表し、目的語を補わない原文の簡潔さも保つ。
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: 彼らの助けを求める叫びは、神のもとへ届いた
  rationale: שַׁוְעָה の救助を求める含意を示す。「上って行った」という垂直的比喩は日本語では不自然になりやすいため、「神のもとへ届いた」と自然に伝えた。
- source_word: אֶל הָאֱלֹהִים
  choice: 神のもとへ
  rationale: 定冠詞付き אֱלֹהִים を、文脈上の唯一の神として通常の日本語で訳した。
theological_decisions:
- issue: עֲבֹדָה が示すイスラエルの境遇
  choice: 奴隷労働
  alternative: 労働／労役／奴隷状態
  rationale: 直近の文脈は強制労働による抑圧を描く。「奴隷労働」は単なる一般労働に弱めず、同時に語の労働面も保持する。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原語の親族的表現を本文に保ちつつ、民族全体を指すことを脚注で説明する。特定の教派的含意は加えない。
- issue: 叫びが神へ上るという比喩
  choice: 神のもとへ届いた
  alternative: 神のもとへ上って行った
  rationale: 神が聞いたことを先取りして断言せず、原文の方向性を自然な日本語で表す。次節の明示的な「聞いた」とも区別する。
translation_notes:
  register: 明快な現代標準日本語を用い、叙事としての重みを保った。長い接続文を日本語として読みやすい三文に分け、原文における「労働」の反復と、うめき・叫び・助けを求める叫びという進展を維持した。
