base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: ja
  text: モーセは、その人と一緒に暮らすことを承知した[a]。その人は娘のツィポラをモーセに与えた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセは、その人と一緒に暮らすことを望んだ」。このヘブライ語動詞は、意志、同意、納得を表し得る。
    reason: lexical_alternative
  - marker: b
    text: すなわち、ツィポラをモーセの妻として与えた。
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: 承知した
  rationale: 動詞 יאל はここで、意志・同意・受諾を表す。「承知した」は、相手のもとで暮らすことへの同意を自然な現代日本語で示しつつ、「喜んで」など本文にない感情を加えない。語義の幅は脚注に残した。
- source_word: לָשֶׁבֶת
  choice: 一緒に暮らすこと
  rationale: ישׁב は文脈上、座ることではなく居住することを指す。前置詞 אֶת を伴う「その人と」を日本語として自然につなぐため、「一緒に暮らす」とした。
- source_word: הָאִישׁ
  choice: その人
  rationale: ヘブライ語は固有名ではなく普通名詞「その男／人」を用いる。直前の文脈で示された人物を指すため、自然な照応表現「その人」とし、本文にない名を補わない。
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: נתן の基本義を保持した。婚姻の意味は文脈上含意されるが、本文自体は単に「与えた」と述べるため、説明は脚注に置いた。
- source_word: צִפֹּרָה
  choice: ツィポラ
  rationale: ヘブライ語 צִפֹּרָה の子音と母音を踏まえた日本語音写。
- source_word: בִתּוֹ
  choice: 娘の
  rationale: 三人称男性単数の接尾辞を、主語である「その人」に属する娘として明確かつ自然に表した。
- source_word: לְמֹשֶׁה
  choice: モーセに
  rationale: 前置詞 לְ の受け手を示す基本的な機能をそのまま訳し、本文に明示されない「妻として」は脚注で説明した。
