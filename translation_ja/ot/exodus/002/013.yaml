source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וְ/הִנֵּ֛ה שְׁנֵֽי אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַ/יֹּ֨אמֶר֙ לָֽ/רָשָׁ֔ע לָ֥/מָּה תַכֶּ֖ה רֵעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: ja
  text: 翌日、モーセは出て行った。すると、二人のヘブライ人が争っていた。モーセは悪者[a]に言った。「なぜ仲間[b]を打つのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「不正を行っている者」「非のある者」。
    reason: lexical_alternative
  - marker: b
    text: または「同胞」「隣人」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: モーセが出て行くと
  rationale: 動詞の主語は直前の文脈にあるモーセ。日本語では主語を補うことで、場面の移行を明瞭にした。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 翌日
  rationale: 字義は「第二の日に」だが、連続する物語では「翌日」が自然で正確。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 突然目に入った光景を生き生きと提示する הִנֵּה の談話機能を、現代日本語の自然な物語表現で示した。
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: 二人のヘブライ人
  rationale: 人数と民族的呼称を保持する。「人」は日本語では文脈上、二人が男性であることを妨げない。
- source_word: נִצִּים
  choice: 争っていた
  rationale: 継続中の対立を表す分詞。続く「打つ」から身体的な争いを含み得るが、「争う」は語義の幅を保つ。
- source_word: לָרָשָׁע
  choice: 悪いほうの者
  rationale: רָשָׁע は「悪者」にも「非のある者」にもなり得る。ここでは人物の全人格を断定せず、この争いで相手を打っている側への道徳的判断を自然に表す。
- source_word: לָמָּה תַכֶּה
  choice: なぜ、…打つのか
  rationale: 未完了形は進行中または反復的な行為として理解できる。「打つのか」は現場での問いとして自然で、時制上の幅も保つ。
- source_word: רֵעֶךָ
  choice: 自分の仲間
  rationale: רֵעַ の「仲間、同胞、隣人」という意味領域のうち、同じヘブライ人同士という直接の文脈に適する。再帰的な「自分の」により日本語の指示関係を明瞭にした。
theological_decisions:
- issue: לָרָשָׁע が人物の固定的性質を指すか、この争いで非のある側を指すか
  choice: 悪いほうの者
  alternative: 悪者／非のある者
  rationale: 語の道徳的重みを残しつつ、文脈上は相手を打っている当事者を指すという状況的意味を過度に限定せず示した。
translation_notes:
  register: 明瞭な現代標準語を用い、物語として自然でありながら品位を保った。「見よ」は避けて הִנֵּה を「見ると」とした。「なぜ、自分の仲間を打つのか」は直接的だが過度に口語的ではない問いとして整えた。
