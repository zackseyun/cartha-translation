base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: ja
  text: 彼女は男の子を産んだ。モーセはその子をゲルショム[a]と名づけた。「私は異国の地で寄留者だった」と言ったからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ゲルショム」という名は、ヘブライ語の「寄留者がそこにいる」という表現に似た響きをもち、モーセによる命名の説明と結びついている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私は異国の地で寄留者として暮らしてきた」。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: 彼女は男の子を産んだ
  rationale: ילד の出産を表す用法と בן の男性の子という意味を、現代日本語で自然かつ明確に表した。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: モーセはその子を…と名づけた
  rationale: ヘブライ語では主語が三人称男性単数であり、文脈上モーセを指す。日本語では主語を明示し、命名定型句を自然に訳した。
- source_word: גֵּרְשֹׁם
  choice: ゲルショム
  rationale: ヘブライ語の人名を日本語の慣用的な音写で示した。
- source_word: כִּי אָמַר
  choice: 「…」と言ったからである
  rationale: כִּי が命名理由を導く説明的機能を明確に保った。
- source_word: גֵּר
  choice: 寄留者
  rationale: 自分の民や土地を離れ、他国人として滞在する者という語義を保つ。単なる旅行者ではなく、非在地民として暮らす含意を伝える。
- source_word: הָיִיתִי
  choice: …となった
  rationale: 完了形が示す、命名時点までに成立したモーセの境遇を自然な日本語で表した。「であった」も可能であるため脚注に示した。
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: 異国の地で
  rationale: נָכְרִיָּה の『自国ではない、よその』という意味を、明瞭で格調を損なわない現代日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、命名理由の簡潔さと叙述の品位を保った。日本語で不自然な「その名を呼んだ」という直訳は避けつつ、命名と語呂合わせのつながりを脚注で補った。
