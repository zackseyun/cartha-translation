lexical_decisions:
- source_word: וְאַיּוֹ
  choice: それで、その人はどこにいるのか
  rationale: 文脈を受ける接続詞と所在を問う表現を、自然な現代日本語で再現した。
- source_word: עֲזַבְתֶּן
  choice: 置いて帰ってきた
  rationale: 単なる「去る」ではなく、娘たちがその人をその場に残して帰宅した状況を明確に表す。
- source_word: קִרְאֶן לוֹ
  choice: 呼んできなさい
  rationale: ここでは、男を食事に招くため連れて来るよう命じる意味。
- source_word: וְיֹאכַל לָחֶם
  choice: 食事をしてもらおう
  rationale: 「パンを食べる」は食事をすることを表す慣用表現であり、勧誘・目的を自然な日本語にした。
