  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: ja
  text: 彼はあたりを見回し、だれもいないのを見て、そのエジプト人を打ち倒し、砂の中に隠した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: あたりを見回し
  rationale: 直訳的には「こちらとあちらを向き」だが、周囲を各方向に見て確認する動作を表す慣用句なので、自然な現代日本語で表した。
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: そこにだれもいないのを確かめると
  rationale: אִישׁ は字義的には「男／人」だが、この文脈では目撃者となる人物が一人もいないことを指す。「確かめると」は、見回した結果を認識したという וַיַּרְא の流れを自然に表す。
- source_word: וַיַּךְ
  choice: 打ち倒し
  rationale: נכה の基本義「打つ」を保ちつつ、この文脈で死に至ったことも含意できる。「殺し」より原語の表現に近い。
- source_word: הַמִּצְרִי
  choice: そのエジプト人
  rationale: 定冠詞を文脈上すでに言及された人物を指す日本語の「その」で自然に表した。
- source_word: וַיִּטְמְנֵהוּ
  choice: 隠した
  rationale: טמן の中心義は「隠す、覆い隠す」。砂に埋めた動作は文脈から分かるため、語義を過度に限定しない訳とした。
- source_word: בַּחוֹל
  choice: 砂の中に
  rationale: חוֹל の通常の意味「砂」をそのまま訳し、隠した場所を自然な日本語で示した。
