base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: ja
  text: すると羊飼いたちが来て、娘たちを追い払った。しかしモーセは立ち上がり、娘たちを救って[a]、彼女たちの群れに水を飲ませた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「助け出した」とも訳せる。ヘブライ語は、危険や圧迫から救うことを表す。ここでは、羊飼いたちの妨害から娘たちを救ったことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: 羊飼いたち
  rationale: רעהの分詞が名詞的に用いられ、羊や山羊の群れを飼う者たちを指す。文脈に自然な「羊飼い」とした。
- source_word: וַיְגָרְשׁוּם
  choice: 娘たちを追い払った
  rationale: גרשの「追い出す、追い払う」という強い動作を保った。目的語は直前の祭司の娘たちなので、日本語では明示した。
- source_word: וַיָּקָם
  choice: 立ち上がって
  rationale: קוםの基本義と、モーセが行動を起こす決然とした展開の両方を自然に表す。
- source_word: וַיּוֹשִׁעָן
  choice: 娘たちを救い
  rationale: ישעのヒフィル形が持つ「救う、救い出す」という意味の強さを保った。単に「助けた」と弱めず、ここでは羊飼いたちの妨害から救ったことを表す。
- source_word: וַיַּשְׁקְ
  choice: 水を飲ませた
  rationale: שקהは人や家畜に水を与えることを意味する。家畜について自然な現代日本語とした。
- source_word: צֹאנָם
  choice: その群れ
  rationale: צאןは羊や山羊などの小家畜を集合的に指すため、種類を限定しない「群れ」とした。日本語では所有関係を過度に明示せず、文脈上の娘たちの群れを「その群れ」と表した。
- source_word: וַיָּבֹאוּ
  choice: すると……来て
  rationale: 物語を前へ進めるワウ継続法の順次性を、機械的な「そして」ではなく自然な「すると」で表した。
theological_decisions:
- issue: וַיּוֹשִׁעָןにおける救済語の強さ
  choice: 「救い」と訳す
  alternative: 「助けて」または「助け出し」
  rationale: この語は神学的な救済にも日常的な救出にも用いられるが、ここでは羊飼いたちによる妨害から娘たちを救出する具体的行為を指す。語の強さは保ちつつ、文脈によって意味を限定した。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。連続する動作は「すると」「しかし」「立ち上がって」で自然につなぎ、原文の簡潔な物語調を保った。
