  text: וְ/עַמֻּדָ֣י/ו עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/010.yaml
  text: with its twenty pillars and their twenty bronze bases[b][a], and the hooks of the pillars and their bands shall be silver.
translation:
  language: ja
  text: また、その柱は二十本、その台座[a]も二十個で、青銅製とする。柱の鉤と帯金[b]は銀製とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「台座」は「受け座」とも訳せる。柱を支える部材を指す。
    reason: lexical_alternative
  - marker: b
    text: 「帯金」と訳したヘブライ語が具体的にどの部材を指すかは確かでない。「連結棒」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: その柱は二十本
  rationale: עַמּוּדは「柱」。三人称男性単数接尾辞は前節の南側の構造を受けるため、「その」で関係を示した。
- source_word: אַדְנֵיהֶם
  choice: その台座も二十個
  rationale: 幕屋建築で אֶדֶן は柱などを支える台座または受け座を指す。現代日本語で明瞭な「台座」を本文に採用した。
- source_word: נְחֹשֶׁת
  choice: 青銅製
  rationale: 銅または青銅を表し得る語だが、幕屋の器具・部材という文脈と慣用に従い「青銅」とした。
- source_word: וָוֵי
  choice: 鉤
  rationale: וָוは幕屋の構造では掛け具となるフックを指すため、簡潔で品位ある「鉤」とした。
- source_word: חֲשֻׁקֵיהֶם
  choice: 帯金
  rationale: 指示対象には不確かさがある。柱に取り付ける銀製の帯状部材という理解を保ちつつ、連結棒などと機能を限定しすぎない語を選んだ。
- source_word: כָּסֶף
  choice: 銀製
  rationale: 素材としての「銀」を表すため、鉤と帯金の材質を自然に示す「銀製」とした。
- source_word: וְ
  choice: また／も／と
  rationale: 冒頭では前節との連続を「また」で示し、列挙関係は日本語として自然な助詞で表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、建築部材の列挙として簡潔で格調ある文体にした。前節から続く統語関係を冒頭の「また」で保ち、ヘブライ語の名詞文は設計指示として自然な「製とする」で表した。
