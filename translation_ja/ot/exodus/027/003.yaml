base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: ja
  text: また、祭壇の灰を取り除くための容器[a]、シャベル、鉢、フォーク、火皿を作りなさい。祭壇の用具はすべて青銅[b]で作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の表現は字義的には「その脂灰を取り除くため」。祭壇の供え物によって生じる灰を取り除くことを指す。
    reason: lexical_alternative
  - marker: b
    text: 「銅」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 幕屋造営の指示としての未完了形を、現代日本語で自然かつ明確な命令表現にした。接続詞 וְ は文脈の連続性を示す「また」とした。
- source_word: סִּירֹתָיו לְדַשְּׁנוֹ
  choice: 祭壇の灰を取り除くためのつぼ
  rationale: סִירֹת は容器を指すため「つぼ」とし、続く目的表現を「灰を取り除くための」と訳した。接尾辞の指示対象は直前の祭壇なので、曖昧さを避けて「祭壇の」と明示した。
- source_word: יָעָיו
  choice: 十能
  rationale: 灰や炭を扱うシャベル状の道具を指す。祭壇用具として簡潔で具体的な日本語を選んだ。
- source_word: מִזְרְקֹתָיו
  choice: 鉢
  rationale: 液体、特に祭儀で血を受けたり振りかけたりするための容器を指すが、本文では用途を限定せず、器形を表す「鉢」とした。
- source_word: מִזְלְגֹתָיו
  choice: 肉刺し
  rationale: 祭壇で用いる叉状の器具を、現代の読者に用途と形が伝わる伝統的な名称で表した。
- source_word: מַחְתֹּתָיו
  choice: 火皿
  rationale: 炭火を扱うための平たい器を指す語として、祭具の文脈に合う「火皿」を採用した。香炉と限定することは避けた。
- source_word: לְכָל־כֵּלָיו
  choice: 祭壇の用具はすべて
  rationale: כְּלִי はここに列挙された各種の器具を包括するため「用具」とした。接尾辞は祭壇を指すので明示した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の造営記事における慣用と古代の金属利用を踏まえて「青銅」としたが、「銅」の可能性は脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭壇を指す三人称接尾辞は、日本語で参照先が明確になるよう「祭壇の」と明示した。器具名は簡潔で一般読者にも把握しやすい祭具用語を用いた。
