id: EXO.27.21
reference: Exodus 27:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בְּ/אֹ֣הֶל מוֹעֵד֩ מִ/ח֨וּץ לַ/פָּרֹ֜כֶת אֲשֶׁ֣ר עַל הָ/עֵדֻ֗ת יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֧ן וּ/בָנָ֛י/ו מֵ/עֶ֥רֶב עַד בֹּ֖קֶר לִ/פְנֵ֣י יְהוָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹ֣רֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: ja
  text: 会見の天幕の中、証し[a]の前にある垂れ幕の外で、アロンとその子らは、夕方から朝まで、ヤハウェの前でそれを整えなければならない[b]。これは、イスラエルの子らにとって、代々にわたる永続の定めである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証し」は、文脈上、契約の箱に納められた契約の板を指すと考えられる。原文は字義的には「証しの上にある」とも訳せるが、ここでは垂れ幕と箱との位置関係を「前にある」と表した。
    reason: 語義と空間表現の説明
  - marker: b
    text: 「整える」は、灯火を所定の状態に整え、保つ務めを表し得る。文脈上、「それ」は灯火、または灯火に関する務めを指す。
    reason: 語彙上の選択肢と代名詞の指示対象
  - marker: c
    text: 原文は直訳に近くは「イスラエルの子らからの、彼らの代々にわたる永続の定め」となる圧縮された法的表現である。ここでは、イスラエルの子らに関わる、世代を通じて有効な定めという意味に表した。
    reason: 原文の圧縮された法的表現の説明
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中
  rationale: 幕屋を指す定型的な祭儀用語として、מוֹעֵדの「会う／定められた時・場所」の含みを保ちつつ、現代日本語で通用する伝統的表現を用いた。
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: 垂れ幕の外側で
  rationale: פָּרֹכֶתは聖所内部を仕切る幕を指す。「垂れ幕」は「幕」より具体的で、「覆い」と誤解されにくい。
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: あかしの前にある
  rationale: עַלの基本義は「上に」だが、ここでは契約の板を納めた箱と垂れ幕との空間的位置関係を表す。「前にある」を本文に採り、直訳的可能性は脚注で示した。
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: それを整えなければならない
  rationale: ערךの「整える、順序立てて配置する」という意味を保った。「それ」は直前節から続く灯火ないし灯火の務めを受け、原文の単数代名詞が持つ簡潔さを保持する。
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: 夕方から朝まで
  rationale: 夜間を通じた務めの時間範囲を自然かつ直接的に表す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 契約名を音写し、לִפְנֵיの祭儀的・空間的表現も「前で」として保った。
- source_word: חֻקַּת עוֹלָם
  choice: 永続の定め
  rationale: עוֹלָםの継続性と、חֻקָּהの法的・祭儀的性格を簡潔に表す。絶対的な形而上学的永遠性まで断定しない表現とした。
- source_word: לְדֹרֹתָם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らが代々守る
  rationale: מֵאֵתが示す、イスラエル側から果たされる義務・務めという関係を自然な日本語にした。「イスラエルの子ら」は原文の民族的集合表現を保持する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に明記された契約名を固有名として示し、称号への置換を避けた。
- issue: חֻקַּת עוֹלָם の時間的効力
  choice: 永続の定め
  alternative: 永久の定め、とこしえの掟
  rationale: 祭儀法規の継続的拘束力を示しつつ、この語句だけから絶対的・無時間的な永遠性を読み込まない。
- issue: הָעֵדֻת の指示対象
  choice: あかし
  alternative: 契約の板、あかしの箱
  rationale: 語そのものは「あかし」であり、文脈上は契約の板を指す可能性が高いが、本文で箱や板と断定せず原文の換喩と曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調にしつつ、祭儀文書にふさわしい品位を保った。「会見の天幕」「あかし」「永続の定め」などの術語は文脈上必要な範囲で保持し、難解になり得る点は脚注で補った。
