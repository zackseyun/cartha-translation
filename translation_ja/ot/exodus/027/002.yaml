  text: וְ/עָשִׂ֣יתָ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ תִּהְיֶ֣יןָ קַרְנֹתָ֑י/ו וְ/צִפִּיתָ֥ אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: ja
  text: 祭壇の四隅に、それぞれ角を作る。その角は祭壇と一体のものとし[a]、祭壇を青銅で覆う[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その角はそれから出るものとなる」。角を別に取り付けるのではなく、祭壇本体と一続きに作るという意味。
    reason: lexical_alternative
  - marker: b
    text: 「青銅」と訳したヘブライ語は、銅を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作る
  rationale: 接続詞を伴う完了形は、ここでは一連の製作指示を表す。現代日本語では簡潔な指示形「作る」が自然である。
- source_word: קַרְנֹתָיו
  choice: 角
  rationale: 字義どおり「角」であり、祭壇の四隅から突き出す角状の部分を指す。具体的な祭儀用語を保った。
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: 祭壇の四隅に、それぞれ
  rationale: עַל はここでは位置を示す「に」。接尾辞が指す祭壇を明示し、四つの隅の各々に角があることを自然な日本語で示した。
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: その角は祭壇と一体のものとし
  rationale: 直訳は「その角はそれから出るものとなる」。製作指示として、角を別に取り付けるのではなく祭壇本体と一続きに造る意味を明確にした。
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: 祭壇を……覆う
  rationale: Piel形の צפה は材料を表面にかぶせる、すなわち覆う・張ることを表す。目的語の代名詞を「祭壇」と明示した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 銅または青銅を指し得る語だが、古代の祭壇製作という文脈では「青銅」が最も可能性の高い訳である。語義上の幅は脚注に残した。
