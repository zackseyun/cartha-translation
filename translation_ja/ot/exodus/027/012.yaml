  text: וְ/רֹ֤חַב הֶֽ/חָצֵר֙ לִ/פְאַת יָ֔ם קְלָעִ֖ים חֲמִשִּׁ֣ים אַמָּ֑ה עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: ja
  text: また、庭の西側[a]の幅には、五十キュビトの掛け幕を張る。その柱は十本、台座[b]も十個とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「海の側」。西を指す通常の方角表現。
    reason: lexical_alternative
  - marker: b
    text: 「台座」は柱を据える基部、または受け座とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶ/חָצֵר
  choice: また、庭の……幅には
  rationale: רֹחַבは「幅」。前後の設計指示との連続を接続詞「また」で示し、この側面についての規定として自然な日本語にした。חָצֵרは幕屋を囲む区画なので、簡潔で一般的な「庭」とした。
- source_word: לִ/פְאַת יָם
  choice: 西側
  rationale: יָםは字義的には「海」だが、方角を表す慣用では西を指す。本文では明瞭な「西側」とし、字義を脚注に残した。
- source_word: קְלָעִים
  choice: 掛け幕
  rationale: 幕屋の庭を囲うために張る布を指す。「幕」だけより設置形態が伝わり、「カーテン」よりも建築的・祭儀的文脈にふさわしい。
- source_word: חֲמִשִּׁים אַמָּה
  choice: 五十キュビト
  rationale: 原文の尺度を換算せず保持した。ここでは掛け幕の長さを示すが、「長さ」は文脈から明らかなため補わなかった。
- source_word: עַמֻּדֵי/הֶם עֲשָׂרָה
  choice: その柱は十本
  rationale: עַמּוּדは構造物を支える「柱」。三人称複数接尾辞の照応を「その」で保持し、日本語として自然な助数詞「本」を用いた。
- source_word: וְ/אַדְנֵי/הֶם עֲשָׂרָה
  choice: 台座も十個
  rationale: אֶדֶןは柱を据える基部または受け具を指す。一般読者に明瞭な「台座」を本文に採用し、構造を強調する「受け座」の可能性は脚注に示した。接尾辞の照応は直前の「その」が柱と台座の双方に及ぶ自然な日本語で表した。
