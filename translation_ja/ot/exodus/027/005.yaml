  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: ja
  text: その網を祭壇の張り出し[a]の下方に、下から取り付けなさい。網は祭壇の中ほどまで達するものとする。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「張り出し」と訳したヘブライ語は、祭壇の突き出た縁または枠を指すと考えられる。別訳「縁」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「そして網は祭壇の半ばまでとなる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: その網を……取り付けなさい
  rationale: נתןはここでは物を所定の位置に据えることを表す。目的語の女性単数代名詞は前節の青銅の網を指すため、現代日本語では指示対象を明示した。「取り付ける」は祭壇の構造物として配置する文脈に自然である。
- source_word: תַּחַת כַּרְכֹּב הַמִּזְבֵּחַ מִלְמָטָּה
  choice: 祭壇の張り出しの下側に
  rationale: תחתとמלמטהが示す下方・下側という位置関係を、重複感の少ない自然な日本語で表した。כַּרְכֹּבは祭壇から張り出す縁または枠を指す稀な語なので、「張り出し」とし、別訳を注記した。
- source_word: וְהָיְתָה הָרֶשֶׁת עַד חֲצִי הַמִּזְבֵּחַ
  choice: 網が祭壇の中ほどまで来るようにする
  rationale: 字義的には「そして網は祭壇の半ばまでとなる」。網の位置または広がりが祭壇の中間に達することを示すが、動きそのものを述べてはいないため、「伸びる」と断定せず「来る」とした。命令文の続きとして自然な指示表現に整えた。
