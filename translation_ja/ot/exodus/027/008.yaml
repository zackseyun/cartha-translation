  text: それを板を用いて中空に造りなさい。[a] 山であなたに示したとおりに、彼らはそれを造らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「板を用いた中空のものとして造りなさい」。ヘブライ語は、祭壇が板で造られた空洞構造であることを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: 板で中空に
  rationale: נְבוּבは内部が詰まっていない構造を、לֻחֹתはその材料である板を示す。「板で中空に」は、祭壇が板を用いた空洞構造であることを簡潔に伝える。
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: 造りなさい
  rationale: モーセに対する二人称男性単数の指示として、命令の力を自然な現代日本語で表す。目的語は文脈上明らかなため省略した。
- source_word: כַּאֲשֶׁר הֶרְאָה אֹתְךָ
  choice: あなたに示されたとおりに
  rationale: הֶרְאָהはホファル形で受動の意味を持つため、示した主体を補わず、原文どおり受動表現にした。
- source_word: בָּהָר
  choice: 山で
  rationale: 啓示が示された場所を表す日本語として自然であり、前置詞בְּの場所の意味を保つ。
- source_word: כֵּן יַעֲשׂוּ
  choice: 彼らはそれを造らなければならない
  rationale: 三人称男性複数の動詞を明示し、実際の製作に当たる者たちへの指示として訳した。כֵּןは前節の「とおりに」と対応させた。
