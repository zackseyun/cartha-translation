base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: ja
  text: また、庭の入口には、青、紫、緋色の糸と、撚った上質の亜麻糸を用いた、刺繍職人の仕事による二十キュビト[a]の垂れ幕[b]を設ける。その柱は四本、その台座[c]も四個とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一キュビトは、肘から指先までを基準とする古代の長さの単位。およそ四十五センチメートルとされるが、推定には幅がある。
    reason: ancient_measurement
  - marker: b
    text: 「幕」または「入口を覆う掛け布」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「受け台」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: また、庭の入口には
  rationale: שַׁעַר はここでは庭に出入りする開口部を指す。日本語の「門」は堅固な扉を連想させ得るため、垂れ幕を備えた箇所であることが明確な「入口」とした。חָצֵר は幕で囲まれた聖幕の庭なので、現代日本語で簡潔な「庭」とした。
- source_word: מָסָךְ
  choice: 垂れ幕
  rationale: 聖幕関係の文脈では入口を覆う掛け布を指す。固い仕切りではなく織物であることを自然に表すため「垂れ幕」とした。
- source_word: עֶשְׂרִים אַמָּה
  choice: 二十キュビト
  rationale: 原文は寸法を直訳すれば「二十キュビト」とだけ述べる。日本語でも文脈から幕の横方向の寸法と理解できるため、「長さ」などを補わず原文の簡潔さを保った。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の糸
  rationale: 三語は聖幕の織物に用いる染色素材を表す。末尾の「糸」を三色全体にかけ、明瞭で自然な日本語とした。
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: 撚った上質の亜麻糸
  rationale: שֵׁשׁ は上質の亜麻布またはその素材、מָשְׁזָר は撚り合わせた加工を表す。ここでは他の糸素材と並ぶため「亜麻糸」とした。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 刺繍職人が仕立てた
  rationale: 熟練した職人による多色の装飾的な織物仕事を表す句。個人的な行為者を保ちつつ、現代日本語として自然に表現した。
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה
  choice: その柱は四本
  rationale: 三人称複数の所有接尾辞を「その」で表し、入口の垂れ幕を支える柱との関係を保持した。
- source_word: וְאַדְנֵיהֶם אַרְבָּעָה
  choice: その台座も四個
  rationale: אֶדֶן は柱を受ける基部または受け金具を指す。「台座」は構造上の機能が一般読者に伝わりやすい。所有接尾辞は「その」で保持した。
