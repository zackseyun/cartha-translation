lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 十五キュビト
  rationale: 複合数詞と標準的な長さの単位をそのまま表した。
- source_word: קְלָעִים
  choice: 幕
  rationale: 幕屋の庭を囲うために張る布を指すため、現代日本語で明瞭な「幕」とした。
- source_word: לַכָּתֵף
  choice: 一方の側には
  rationale: 字義は「肩」だが、ここでは門口の片側を指す建築的用法であり、次節の反対側との対応も明確になる。
- source_word: עַמֻּדֵיהֶם
  choice: その柱は三本
  rationale: עַמּוּדを幕屋建築で一般的な「柱」と訳し、接尾辞の指示関係を自然な日本語の「その」で示した。
- source_word: אַדְנֵיהֶם
  choice: 台座も三個
  rationale: 柱を支える受け台を意味するため、明瞭な「台座」とした。数え方は物体として自然な「個」を用いた。
