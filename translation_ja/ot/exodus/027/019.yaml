  text: לְ/כֹל֙ כְּלֵ֣י הַ/מִּשְׁכָּ֔ן בְּ/כֹ֖ל עֲבֹדָת֑/וֹ וְ/כָל יְתֵדֹתָ֛י/ו וְ/כָל יִתְדֹ֥ת הֶ/חָצֵ֖ר נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: ja
  text: 幕屋のあらゆる務めに用いるすべての用具も、幕屋のすべての杭も、庭のすべての杭も、青銅[a]とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「銅」。ヘブライ語は、銅を主体とする金属を広く指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: 用具
  rationale: 器具・道具・品を広く指す語であり、幕屋の奉仕に用いる大小の物品を不必要に限定しない自然な表現。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 聖なる住まいを指す、この文脈で定着した明確な訳語。
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: 幕屋のあらゆる務めに用いる
  rationale: עֲבֹדָה の「務め・作業」の意味と、前置詞が示す用途を自然な日本語で表す。
- source_word: יְתֵדֹתָיו
  choice: 幕屋のすべての杭
  rationale: 代名詞の指示対象を日本語で明確にし、構造物を固定する杭を指すことを簡潔に示す。
- source_word: יִתְדֹת הֶחָצֵר
  choice: 庭のすべての杭
  rationale: 幕屋を囲む区画である חָצֵר を、文脈上自然で分かりやすい「庭」とした。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 銅または銅を主体とする合金を指し得る語。幕屋の材料一覧における慣用と蓋然性に従い「青銅」を本文に採用し、語義の幅は脚注に残した。
theological_decisions: []
