  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: ja
  text: あなたはイスラエルの子ら[a]に命じて、明かりのために、つぶして採った純粋なオリーブ油[b]をあなたのもとに持って来させなさい。それは灯火を絶えずともすためである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」または「イスラエルの民」とも訳せる。ヘブライ語では「イスラエルの子ら」。ここでは契約共同体全体を指す定型表現。
    reason: lexical_alternative
  - marker: b
    text: 「砕いて採った」とも訳せる。通常の圧搾ではなく、オリーブを打つ、または砕くことで得た上質な油を指す。
    reason: lexical_alternative
  - marker: c
    text: 幕屋に関する用法で「絶えず」は、必ずしも一瞬も途切れないという意味ではなく、規則正しく継続して維持することを指す場合がある。出エジプト記27章21節、レビ記24章2–4節参照。
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: あなたは
  rationale: 独立代名詞によるモーセへの強調された呼びかけを日本語の主題提示で表した。接続詞は文脈上不自然にならないよう明示しなかった。
- source_word: תְּצַוֶּה
  choice: 命じて
  rationale: ピエル形の「命じる」という指示的な力を保ち、後続の目的節と自然につないだ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を本文に残し、共同体全体を指す慣用的名称であることを脚注で補った。
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: あなたのもとに持って来させ
  rationale: לקח の基本義は「取る」だが、אֶל と供給の文脈により、ここではモーセのもとへ調達して持参する意味を自然な日本語で示した。
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: 純粋なオリーブ油
  rationale: זָךְ が示す不純物のない清澄・純良さを、祭儀用の油として自然な「純粋な」で表した。
- source_word: כָּתִית
  choice: つぶして採った
  rationale: オリーブを打つ、または砕く工程で得た油を指すため、現代日本語で製法が伝わる表現とした。
- source_word: לַמָּאוֹר
  choice: 明かりのために
  rationale: 名詞 מָאוֹר の照明・明かりという意味を保ち、器具を本文以上に特定しなかった。
- source_word: לְהַעֲלֹת נֵר
  choice: 灯火を…ともさせる
  rationale: 直訳的には「灯火を上らせる」だが、点火して燃焼を保つ慣用句として自然に訳した。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 継続性を簡潔に示しつつ、幕屋の用法では規則的・継続的な維持を指し得ることを脚注に残した。
theological_decisions:
- issue: 契約共同体の呼称 בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の男性形を含む定型的な親族呼称を保持した。ただし文脈上は女性を排除する教理的主張ではなく、契約共同体を指す慣用表現であるため、その点を脚注で明示した。
- issue: תָּמִיד の継続性
  choice: 絶えず
  alternative: いつも／常に、規則正しく
  rationale: 継続的な奉仕という力を本文で保ちながら、一瞬も途切れないことを必ず意味するとは限らない祭儀的用法を脚注で示し、曖昧さを解消しすぎないようにした。
translation_notes:
  register: 現代標準日本語による、明快で品位ある命令文。原文の強調、祭儀用語、継続性の幅を保ちつつ、「灯火をともす」など自然な日本語の慣用表現を用いた。
