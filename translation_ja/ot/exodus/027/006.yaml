  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: ja
  text: 祭壇のために、アカシア材の担ぎ棒を作り、それらを青銅[a]で覆いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青銅」は「銅」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作り……なさい
  rationale: 接続詞を伴う完了形二人称男性単数は、この指示文脈では命令の効力を持つ。現代日本語で明確かつ自然な指示表現とした。
- source_word: בַדִּים / בַּדֵּי
  choice: 担ぎ棒
  rationale: 幕屋の器具を運ぶための棒を指すため、単なる「棒」より用途が明確な「担ぎ棒」とした。
- source_word: לַמִּזְבֵּחַ
  choice: 祭壇のために
  rationale: 本文は単に「祭壇」としており、文脈上の名称である「全焼のささげ物の祭壇」などを補わなかった。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 材質を表す連語として、現代日本語で自然な名称を用いた。
- source_word: וְצִפִּיתָ
  choice: かぶせなさい
  rationale: 幕屋製作の文脈で、物体の表面を金属で覆うことを表す。加工法を過度に限定せず、平明な表現とした。
- source_word: אֹתָם
  choice: それらに
  rationale: 男性複数代名詞が複数の担ぎ棒を受けることを明示した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 祭具の文脈で慣用的な訳語を採用したが、語は銅を指し得るため、別訳を脚注に残した。
