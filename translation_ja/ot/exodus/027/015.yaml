source:
  edition: WLC
  text: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: ja
  text: もう一方の側には、長さ十五キュビト[a]の幕を張る。その柱は三本、台座[b]は三個とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文には単位の「キュビト」が明記されていないが、直前の節と同じ構文であり、長さの単位として補った。
    reason: implicit_measurement
  - marker: b
    text: 「受け台」とも訳せる。柱を据えるための基礎部材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית
  choice: もう一方の側には
  rationale: כָּתֵףは字義的には「肩」だが、幕屋の建築的文脈では側面を指す。הַשֵּׁנִיתは「第二の」だが、日本語では対応する反対側を自然に示す「もう一方の」とした。
- source_word: חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים
  choice: 長さ十五キュビトの幕
  rationale: 本文には単位語が明記されていないが、直前の27章14節との並行から十五キュビトの長さを示す。קְלָעִיםは庭を囲う織物であり、現代日本語で明瞭な「幕」とした。
- source_word: עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה
  choice: その柱は三本
  rationale: עַמּוּדは幕を支える構造物なので「柱」とし、接尾辞の所有関係を「その」で表した。
- source_word: וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה
  choice: 台座は三個
  rationale: אֶדֶןは柱の下部を支える基礎部材ないし受け具を指す。「台座」は一般読者に分かりやすく、構造上の機能も伝える。
