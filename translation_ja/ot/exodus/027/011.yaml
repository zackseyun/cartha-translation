source:
  edition: WLC
  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: ja
  text: 北側についても、長さ百キュビト[a]の掛け幕を設け、柱二十本とその青銅の台座二十個を置く。柱の鉤とその帯金具[b]は銀製とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は単に「長さ百」。単位の「キュビト」は、前後に記された幕屋の庭の寸法に基づいて補った。
    reason: cultural_note
  - marker: b
    text: 「帯金具」と訳したヘブライ語は、柱をつなぐ部材、または柱を取り巻く部材を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: 同じように
  rationale: 前節の南側の仕様と対応することを、自然な現代日本語で示す。
- source_word: לִפְאַת צָפוֹן
  choice: 北側も
  rationale: פאהを囲いの「側」と捉え、וְכֵןとの対応関係が明瞭になるよう助詞「も」を用いた。
- source_word: בָּאֹרֶךְ
  choice: 長さに沿って
  rationale: 北側の長辺方向についての寸法指定であることを保持した。
- source_word: קְלָעִים
  choice: 掛け幕
  rationale: 幕屋の庭を囲む布製の幕を指すため、「垂れ幕」より設営物として具体的な「掛け幕」とした。
- source_word: מֵאָה אֹרֶךְ
  choice: 長さ百キュビト
  rationale: ヘブライ語は直訳すれば「長さ百」だが、直前後の寸法体系から単位はキュビトであり、日本語で意味が通るよう補った。補足であることは脚注に示した。
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: 柱は二十本
  rationale: 接尾辞の指示対象を文脈上明らかな北側の設備として自然に表し、柱の助数詞には「本」を用いた。
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: その台座は二十個で、青銅製とする
  rationale: אדןは柱を受ける台座または受け座を指す。「台座」は一般読者に分かりやすく、נחשתはこの文脈で「青銅」とした。
- source_word: וָוֵי הָעַמֻּדִים
  choice: 柱の鉤
  rationale: 柱に取り付けられた掛け具を指すため、簡潔で具体的な「鉤」とした。
- source_word: וַחֲשֻׁקֵיהֶם
  choice: 帯金具
  rationale: 柱に関連する、巻くまたは連結する部材を指す語である。「帯金具」は形状をある程度示しつつ、用途を一つに限定しすぎない。語義の幅は脚注に残した。
- source_word: כָּסֶף
  choice: 銀製
  rationale: 材質を示す語として、現代日本語で自然な述語形にした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語。原文の簡潔な仕様一覧の調子を保ちつつ、日本語として読めるよう「製とする」を補った。助数詞を用いて具体性を出し、専門性の高い部材名は本文を簡潔にして脚注で語義の幅を示した。
