  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: ja
  text: 庭の長さは百キュビト、幅は五十キュビト[a]、高さは五キュビトとする。撚った上質の亜麻布を用い、台座[b]は青銅とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「五十で五十」と読める異例の表現。ここでは文脈に即して「五十キュビト」とした。
    reason: alternative_reading
  - marker: b
    text: 「受け座」とも訳せる。柱などを差し込んで支える部材。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: 庭は、長さ
  rationale: 幕屋を囲む区画を現代日本語で自然な「庭」とし、建築寸法としての אֹרֶךְ を「長さ」と訳した。
- source_word: מֵאָה בָאַמָּה
  choice: 百キュビト
  rationale: 古代の尺度を換算せず残し、幕屋の記事における用語の一貫性を保った。
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: 幅五十キュビト[a]
  rationale: 文脈上の寸法を明瞭な日本語にした一方、ヘブライ語の異例な「五十で五十」という形は脚注で示した。
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: 高さ五キュビト
  rationale: 垂れ幕の垂直方向の寸法として簡潔に訳した。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り糸で織った上質の亜麻布
  rationale: שֵׁשׁ の素材と מָשְׁזָר の撚りをともに表し、専門的すぎない自然な日本語とした。
- source_word: וְאַדְנֵיהֶם
  choice: その台座[b]
  rationale: 幕屋建築で支柱を受ける金属部品を、一般読者に分かりやすい「台座」とした。接尾辞の複数性は日本語では文脈上自然な単数形の総称で表した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の器具・部材の記事で慣用的な訳語を採用した。語義上は銅もあり得る。
