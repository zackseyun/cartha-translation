  text: וְ/עָשִׂ֤יתָ לּ/וֹ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת וְ/עָשִׂ֣יתָ עַל הָ/רֶ֗שֶׁת אַרְבַּע֙ טַבְּעֹ֣ת נְחֹ֔שֶׁת עַ֖ל אַרְבַּ֥ע קְצוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: ja
  text: また、祭壇のために青銅の網細工の格子[a]を作り、その網の四隅[b]に青銅の輪を四つ作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「青銅の、網の細工による格子」。または「青銅の網状格子」。
    reason: 原文は格子を表す語に「網の細工」という説明を重ねており、その構造と別訳を示すため。
  - marker: b
    text: または「四つの端」。
    reason: 原語は「端」「末端」を意味し、この形状では「四隅」と理解できるが、より字義的な訳も可能であるため。
lexical_decisions:
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: 網細工の格子
  rationale: מִכְבָּרは祭壇に用いる格子状の構造物を指し、続く「網の細工」という説明を「網細工」として保った。自然な日本語にしつつ、二つの語が示す格子・網のイメージを残している。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の祭具に関する文脈で定着している訳語であり、銅または銅合金を指し得る原語に適している。
- source_word: עַל הָרֶשֶׁת
  choice: その網の…に
  rationale: 前半のרֶשֶׁתとの語彙上のつながりを「網」で明示し、עַלは輪を設ける位置を表す「に」と自然に訳した。
- source_word: טַבְּעֹת
  choice: 輪
  rationale: 運搬用の棒や取り付けに用いるリングを表す、簡明で文脈に適した訳語である。
- source_word: אַרְבַּע קְצוֹתָיו
  choice: 四隅
  rationale: קָצֶהは端・末端を意味するが、四つある格子の外端については「四隅」が明瞭で自然である。原語どおり「四つの端」と取る余地は脚注に示した。
- source_word: לּוֹ
  choice: そのために
  rationale: 先行する祭壇を受ける代名詞であり、日本語では無生物を指す「そのために」が自然である。
- source_word: וְעָשִׂיתָ
  choice: 作りなさい
  rationale: 一連の祭壇製作の命令を継続する形であるため、現代日本語の明確な命令表現とした。二度目の動詞も訳出して原文の反復を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭壇製作の指示として簡潔にしながら、原文にある「格子」と「網」の重なり、および「作る」の反復を保持した。
