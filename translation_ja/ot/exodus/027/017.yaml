  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: ja
  text: 庭の周囲の柱にはすべて銀の帯を施し[a]、その鉤は銀製とし、台座[b]は青銅[c]製とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「銀の棒でつなぐ」。このヘブライ語は、柱に施した銀の帯、または柱をつなぐ銀の部材を指す。
    reason: lexical_alternative
  - marker: b
    text: 「台座」は「受け座」とも訳せる。柱を差し込んで支える金属製の部分。
    reason: lexical_alternative
  - marker: c
    text: 「青銅」は「銅」とも訳せる。ヘブライ語は古代の用法では、銅や銅合金を広く指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: 庭の周囲にある柱はすべて
  rationale: 全周に配置された庭の柱の総体を、自然な現代日本語で表した。חָצֵרは幕屋を囲む区域なので「庭」とした。
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: 銀の帯で巻き
  rationale: 語は柱に銀の帯状部材または連結材を施すことを指す。具体的な構造には幅があるため、本文では簡明な「帯で巻き」とし、別解を脚注に残した。
- source_word: וָוֵיהֶם
  choice: その鉤
  rationale: 幕を掛ける柱の金具を指す文脈に合う。「フック」よりも荘重で簡潔な「鉤」を採用した。
- source_word: אַדְנֵיהֶם
  choice: 台座
  rationale: 柱を据える金属製の受けを指す。一般読者に明瞭な「台座」を本文に置き、構造を強調する「受け座」を脚注の別訳とした。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の金属材料として慣用的かつ文脈に適した訳。古代語では銅または銅合金を広く指し得るため、その幅を脚注に示した。
