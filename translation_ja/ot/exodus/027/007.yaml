  text: וְ/הוּבָ֥א אֶת בַּדָּ֖י/ו בַּ/טַּבָּעֹ֑ת וְ/הָי֣וּ הַ/בַּדִּ֗ים עַל שְׁתֵּ֛י צַלְעֹ֥ת הַ/מִּזְבֵּ֖חַ בִּ/שְׂאֵ֥ת אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: ja
  text: その担ぎ棒は輪に通され[a]、祭壇を運ぶとき、棒は祭壇の両側[b]にあるようにする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「輪の中へ運び入れられ」。ヘブライ語の動詞は受動形で、運搬のために棒を輪に差し入れることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「両側」と訳したヘブライ語は、文脈によって「側面」「側板」「脇」なども意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: 通され
  rationale: ホファル形の受動・使役的な意味を保ちつつ、運搬用の棒を輪に差し入れる動作を自然な現代日本語で表した。
- source_word: בַדָּיו / הַבַּדִּים
  choice: その担ぎ棒／棒
  rationale: 聖具を運ぶための棒であることを初出で明示し、後半では重複を避けて「棒」とした。
- source_word: בַּטַּבָּעֹת
  choice: 輪に
  rationale: 前置詞 בְּ が示す、輪を受け口とした配置を簡潔に表現した。「通され」と合わせて挿入の状況が明確になる。
- source_word: וְהָיוּ
  choice: あるようにする
  rationale: 単なる未来の状態ではなく、運搬時に棒が所定の位置にあるべきだという指示の力を自然な日本語で表した。
- source_word: שְׁתֵּי צַלְעֹת
  choice: 両側
  rationale: צלעות の基本的な空間概念を保ち、祭壇の二つの側面を指す自然な日本語とした。より具体的な「側板」などには限定しなかった。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 祭儀的文脈における מזבח の標準的な訳語。
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: 祭壇を運ぶとき
  rationale: 前置詞 בְּ を伴う不定詞構文の時・状況を表す意味を「運ぶとき」とし、代名詞の指示対象を「祭壇」と明示して日本語の曖昧さを避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。祭具に関する指示としての品位を保ちながら、古風な「かつぎ竿」などは避け、「担ぎ棒」とした。ヘブライ語の受動表現と צלעות の語義の幅は脚注で保持した。
