base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: ja
  text: また、幕屋の庭を造りなさい。南の側、すなわち南に面する側には、庭のための、撚り合わせた上質の亜麻布の垂れ幕[a]を設けなさい。その一辺の長さは百キュビトとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕」とも訳せる。ヘブライ語は、庭の境界を形作る布の幕を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: 庭
  rationale: 幕屋に付属する、囲われた屋外の空間を指す。現代日本語で自然かつ簡潔な「庭」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる移動式の聖所を表す定着した訳語である。
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: 南側、すなわち南に向かう側には
  rationale: 「南側」と方向を示す「南に向かって」が重なるヘブライ語の強調を、冗長になりすぎない形で保持した。
- source_word: קְלָעִים
  choice: 垂れ幕
  rationale: 庭の境界を形作る吊り下げた布地を指す。「幕」だけより構造上の機能が明確である。別訳は脚注に示した。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻布
  rationale: 素材の質と、糸を撚り合わせる加工の双方を明示した。
- source_word: מֵאָה בָאַמָּה
  choice: 百キュビト
  rationale: 古代の尺度を換算せず、そのまま保持した。
- source_word: אֹרֶךְ
  choice: 長さ
  rationale: 寸法表現として自然な日本語にした。
- source_word: לַפֵּאָה הָאֶחָת
  choice: その一方
  rationale: 庭を囲む辺のうち、ここで規定される一つの側面を指すことを自然に表した。
