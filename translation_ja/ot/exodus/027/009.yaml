  naturalness: 「庭のために、…垂れ幕を作る」はやや不自然であり、先行する命令「造りなさい」とも文体がそろわない。「庭のための…垂れ幕を設けなさい」とするのが、境界用の布を配置する仕様として明瞭である。「その一方」も指示対象が不明瞭なので「その一辺」が自然である。
  terminology: 「幕屋」「庭」「垂れ幕」「亜麻布」「キュビト」は、この文脈にふさわしく、定着性と理解しやすさのバランスが取れている。脚注の「幕」は有効な語彙上の代案である。
