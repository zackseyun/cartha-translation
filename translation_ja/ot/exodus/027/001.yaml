source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: ja
  text: アカシア材で祭壇を造りなさい。長さ五キュビト、幅五キュビトで、祭壇は正方形とし、高さは三キュビトとする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 造りなさい
  rationale: 幕屋建設の指示という文脈における命令の力を、現代日本語で明確かつ自然に表す。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲をささげるための מִזְבֵּחַ の標準的で明瞭な訳語。日本語では文脈上、定冠詞を別個に訳出する必要がない。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 材料を表す連語。伝統的な音写よりも、現代の一般読者に分かりやすい樹木名を用いる。
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: 長さ五キュビト、幅五キュビト
  rationale: 二つの寸法を簡潔で自然な日本語にし、原文の並行構造も保つ。
- source_word: רָבוּעַ יִהְיֶה
  choice: 正方形とし
  rationale: רָבוּעַ は四辺が等しい形を表し、直前の縦横各五キュビトという寸法とも合致する。「正方形」が最も明瞭な現代語。
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: 高さは三キュビトとする
  rationale: 接尾辞の示す祭壇の高さを明示し、設計指示として自然な表現にする。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準語。設計指示として読みやすいよう二文に分けた。英語相談訳の脚注は「アカシア材」の後に置かれている一方、内容は רָבוּעַ の代替訳に関するものであり、位置が不整合である。また日本語では「正方形」が文脈上十分明確なため、本文には脚注を設けなかった。
