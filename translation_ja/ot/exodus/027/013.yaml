  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: ja
  text: また、庭の東側、日の昇る方の幅は、五十キュビトとする。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、庭の幅は、東の側、東に向かって、五十キュビトとする。」
    reason: ヘブライ語の語順と、東方を重ねて示す表現の係り方をより字義的に示す別訳。
lexical_decisions:
- source_word: וְרֹחַב
  choice: また、…幅は
  rationale: וְ の連続的な叙述を「また」で示し、רֹחַב の寸法上の意味を自然な現代日本語の「幅」で表した。
- source_word: הֶחָצֵר
  choice: 庭の
  rationale: 幕屋を囲む区画を指す。文脈上明確で簡潔な「庭」を用いた。
- source_word: לִפְאַת קֵדְמָה
  choice: 東側
  rationale: פֵאָה は側・縁を意味し、方向を示す קֵדְמָה と合わせて自然に「東側」とした。
- source_word: מִזְרָחָה
  choice: 日の昇る方に
  rationale: 直前の「東側」と重なる方向表現を省かず、מִזְרָח の日の出との語義的なつながりを保った。
- source_word: חֲמִשִּׁים אַמָּה
  choice: 五十キュビト
  rationale: 数値と古代の尺度をそのまま保持した。日本語では数詞の後でも単位名は変化しない。
