language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: ja
  text: こうして、男たちは女たちとともにやって来た[a]。心から進んでささげる者は皆、留め具、耳輪、指輪、飾り物など、あらゆる金の装身具を持って来た[b]。また、金の揺祭のささげ物としてヤハウェに差し出す男は皆、そのようにした[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「男たちは女たちの上に」。ここでは慣用的に、男たちが女たちと一緒に、または女たちに加わって来たという意味と考えられる。
    reason: alternative_reading
  - marker: b
    text: ここに挙げられた装身具の中には、正確な種類が不明なものがある。「留め具」はブローチや輪、「耳輪」は鼻輪、「飾り物」は首飾りの下げ飾りや腕輪を指す可能性もある。
    reason: lexical_alternative
  - marker: c
    text: 「揺祭」は、ささげ物をヤハウェの前で振る、または掲げて提示する祭儀的な献納を指す。具体的な動作の詳細は文脈上明らかでない。
    reason: terminology
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: こうして……やって来た
  rationale: 物語の進行を示す接続形を、前節からの流れが自然に伝わる現代日本語で表した。
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: 男たちも女たちとともにやって来た
  rationale: עַל の逐語的な空間表現ではなく、この文脈で有力な「女性たちと一緒に／女性たちに加わって」という慣用的意味を採った。「も」により、女性たちに加えて男性たちも参加した可能性を残した。
- source_word: כֹּל נְדִיב לֵב
  choice: 心から進んでささげる者は皆
  rationale: 自発性と惜しまず与える心を表す句であり、「心」というヘブライ語の表現を保ちながら自然な日本語にした。
- source_word: חָח
  choice: 留め具
  rationale: 装身具の一種だが厳密な形状は不確かであるため、比較的広く取れる語を選び、別の可能性を脚注に示した。
- source_word: נֶזֶם
  choice: 耳輪
  rationale: 耳または鼻に着ける輪を指し得る。本文ではこの装身具一覧で自然な「耳輪」とし、「鼻輪」の可能性を脚注に残した。
- source_word: טַבַּעַת
  choice: 指輪
  rationale: 一般に輪、特に指にはめる輪を表す。印章付きと限定せず、原文以上の特定を避けた。
- source_word: כוּמָז
  choice: 飾り物
  rationale: まれな語で具体的な品が確定できないため、偽りの精密さを避けた包括的な訳語とした。
- source_word: כָּל כְּלִי זָהָב
  choice: あらゆる金の装身具
  rationale: כְּלִי 自体は広く「品物、器具」を意味するが、直前に列挙された装飾品という文脈に即して自然に訳した。
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: 金を奉献のささげ物として……差し出す
  rationale: הֵנִיף／תְּנוּפָה の持ち上げる・振り動かして奉献する祭儀的含意を、「奉献のささげ物」で示した。日本語で単に「振った」とすると動作だけが不自然に強調されるため避けた。
- source_word: וְכָל אִישׁ
  choice: また……男は皆
  rationale: 原文の אִישׁ が明示する男性単数の表現を中性化せず保持した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に記された契約の固有名を普通名詞に置き換えず、現代日本語で一般的な音写によって示した。
- issue: וְכָל אִישׁ の性別表現
  choice: 男は皆
  alternative: すべての人は
  rationale: 直前の広い参加者集団とは別に、原文がここで אִישׁ と明記している緊張を保ち、中性化しなかった。
- issue: תְּנוּפָה の祭儀的意味
  choice: 奉献のささげ物
  alternative: 揺祭／振り動かすささげ物
  rationale: 祭儀的な奉献行為を保持しつつ、専門用語だけでは意味が伝わりにくい現代日本語を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ささげる」を平仮名にして一般読者への読みやすさを確保しつつ、「奉献」で祭儀的文脈を示した。脚注記号[a][b]は該当箇所の本文中に明示した。
