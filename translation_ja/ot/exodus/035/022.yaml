  to: こうして、男たちは女たちとともにやって来た[a]。心から進んでささげる者は皆、留め具、耳輪、指輪、飾り物など、あらゆる金の装身具を持って来た[b]。また、金の揺祭のささげ物としてヤハウェに差し出す男は皆、そのようにした[c]。
