lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 赤く染めた雄羊の皮
  rationale: עֹרֹת אֵילִם は「雄羊の皮」、受動・結果を表す מְאָדָּמִים は赤く加工された状態を示すため、自然な日本語で「赤く染めた」とした。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 丈夫な皮革
  rationale: תְּחָשִׁים が指す動物または皮革の種類は確定できない。特定の動物名を本文で断定せず、幕屋の覆いに用いる素材という文脈に即して「丈夫な皮革」とし、不確実性を脚注に明示した。
- source_word: עֲצֵי שִׂטִּים
  choice: アカシア材
  rationale: シッタの木から取る木材を指す。「アカシア材」は現代日本語で簡潔かつ明瞭である。
