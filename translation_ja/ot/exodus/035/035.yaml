source:
  edition: WLC
  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: ja
  text: 神は彼らを心の知恵で満たし[a]、職人[b]、意匠を考案する者、青・紫・緋色の糸と上質の亜麻布で刺繍する者、また織る者の、あらゆる仕事を行えるようにされた。彼らは、あらゆる仕事を行い、意匠を考案する者たちである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らを心の知恵で満たし」。これは、内面に根差した知恵、判断力、職人的な熟練を表すヘブライ語の言い回し。
    reason: cultural_note
  - marker: b
    text: 「職人」と訳したヘブライ語は、「彫刻師」とも訳せるが、より広く熟練した工人・職人を指すこともある。ここでは幕屋製作に携わる専門職の一つを指す。
    reason: lexical_alternative
  - marker: c
    text: 「意匠を考案する」の原文では、「考える」と「考案・意匠」に当たる同根の語が重ねて用いられている。別訳「巧みな意匠を考案する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם חָכְמַת־לֵב
  choice: 彼らの心を知恵で満たし
  rationale: 「彼らを心の知恵で満たした」というヘブライ語の構造と比喩を、自然な現代日本語に整えた。単なる技術だけでなく、内面的な知恵、判断力、熟練を含む表現である。
- source_word: לַעֲשׂוֹת כָּל־מְלֶאכֶת
  choice: あらゆる仕事を行えるように
  rationale: עשהの広い意味と、מלאכהが表す専門的・職人的な仕事の包括性を自然に伝える。
- source_word: חָרָשׁ
  choice: 彫刻師
  rationale: 幕屋製作における専門職の列挙として具体的に訳した。ただし語自体はより広く熟練した職人を指し得るため、脚注で示した。
- source_word: חֹשֵׁב
  choice: 意匠師
  rationale: 工芸の文脈で図柄や構成を考案する職人を指すため、簡潔な専門職名とした。
- source_word: רֹקֵם
  choice: 刺繍師
  rationale: 織物に装飾を施す職人を表す標準的で明瞭な訳語。
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי וּבַשֵּׁשׁ
  choice: 青糸、紫糸、緋色の糸、上質の亜麻布
  rationale: 色名だけでなく繊維素材を指す文脈を日本語で明確にした。ששは幕屋製作の文脈に即して上質の亜麻布とした。
- source_word: אֹרֵג
  choice: 織物師
  rationale: 織ることを専門とする職人を自然な日本語で表した。
- source_word: עֹשֵׂי כָּל־מְלָאכָה וְחֹשְׁבֵי מַחֲשָׁבֹת
  choice: あらゆる仕事をなし、意匠を考え出す者たち
  rationale: 分詞による総括を保持しつつ、חשבとמחשבותの同根語反復は不自然な直訳を避けて意味を明瞭にした。
theological_decisions:
- issue: 動詞מִלֵּאの主語
  choice: 「神は」と明示する
  alternative: 「彼は」または主語を省略する
  rationale: ヘブライ語では主語が動詞に含まれるが、直前の文脈では行為者は神である。単独でも理解できる自然な日本語とするため明示した。神学的内容を追加したものではない。
- issue: חָכְמַת־לֵבの意味範囲
  choice: 「心を知恵で満たす」という比喩を保持する
  alternative: 「優れた技能を授ける」と機能的に訳す
  rationale: 技能だけに限定せず、内面的な知恵、判断力、職人的熟練が結び付くヘブライ語の人間理解を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。職種の列挙は専門性を伝えつつ一般読者にも理解しやすい語を選び、結びの分詞句は独立文として整理して可読性を確保した。
