    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: 香料
  rationale: 芳香をもつ具体的な材料を指す語として、現代日本語で自然かつ文脈に適する。「香油」では油に限定し、「香辛料」では食用の印象が強いため避けた。
- source_word: הַשָּׁמֶן
  choice: 油
  rationale: 原文は油の種類を明示していないため、「オリーブ油」と限定せず、一般的な「油」とした。
- source_word: לְמָאוֹר
  choice: 明かりのため
  rationale: 幕屋で明かりをともす用途を表す。原文にない特定の「ともしび」や「燭台」まで補わず、用途を簡潔に示した。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 人や物に油を注いで聖別するための油を指す定型表現。「塗油」より一般読者に理解しやすく、動作の具体性も保つ。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香料の香
  rationale: 「香」と「香料」という二つの名詞を残し、香料から作る祭儀用の香という原文の構造を保った。
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: と、…また…と…のため
  rationale: 前節から続く品目列挙として、反復される接続関係と用途を日本語で読み取れる形にした。
theological_decisions: []
translation_notes:
  register: 前節から続く列挙の一部なので、原文どおり述語を補わず「を」で結んだ。祭儀的な内容にふさわしい端正さを保ちつつ、専門用語をできるだけ避けた。
