  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: ja
  text: そして神は、彼を神の霊[a]で満たし、知恵と理解力と知識、さらにあらゆる職人の技[b]を授けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神からの霊」または「神に由来する霊」とも訳せる。この箇所では、神ご自身の霊が働きのために力を与えることを指す可能性が高い。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「すべての仕事」。文脈上、さまざまな工芸の技能を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֹתוֹ
  choice: 神は、彼を……で満たし、……を授けた
  rationale: 動詞の主語「神」は前節から補い、目的語はベツァルエルを指す「彼」とした。ヘブライ語の「満たす」が霊と能力の双方に及ぶ構文を、日本語では自然に伝わるよう、霊には「満たし」、賜物には「授けた」を用いた。
- source_word: רוּחַ אֱלֹהִים
  choice: 神の霊
  rationale: 聖所建設のために神が力を与える文脈に即し、神ご自身の霊を指す可能性を保つ。日本語では大文字による人格性の表示がないため、過度に解釈を限定しない自然な表現とした。
- source_word: בְּחָכְמָה
  choice: 知恵
  rationale: חָכְמָהの基本義を保ちつつ、この文脈では神から与えられる熟練した判断力を含む。
- source_word: בִּתְבוּנָה
  choice: 英知
  rationale: 「知恵」「知識」との三語の区別を保ち、物事を理解し見分ける力を表す語として選んだ。
- source_word: וּבְדַעַת
  choice: 知識
  rationale: דַּעַתの基本的な認知的意味を保持し、単なる技術に狭めなかった。
- source_word: וּבְכָל מְלָאכָה
  choice: あらゆる職人の技
  rationale: מְלָאכָהは広く「仕事」を意味し得るが、幕屋製作の直近の文脈では専門的な手仕事・技能を表す。「あらゆる」によりכָּלを反映した。
theological_decisions:
- issue: רוּחַ אֱלֹהִיםが神ご自身の霊を指すのか、より一般的な神的賦与を指すのか
  choice: 神の霊
  alternative: 神からの霊／神に由来する霊
  rationale: 文脈上は神ご自身の霊による力づけが最も自然だが、ヘブライ語表現に一定の幅があるため、本文は簡潔な直訳とし、別の理解を脚注に示した。
translation_notes:
  register: 明瞭で格調ある現代標準語。原文の列挙を保ちながら、日本語として不自然な「知恵で満たす」を避けるため、「満たし」と「授けた」を組み合わせた。
