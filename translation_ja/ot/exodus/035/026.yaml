translation:
  language: ja
  text: また、心に促され、巧みな技を持つ女たちは皆、やぎの毛[a]を紡いだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「そのやぎたち」。ここでは、紡ぐ材料であるやぎの毛を指す省略表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: また、……女たちは皆
  rationale: 接続詞を「また」とし、כָּלと複数名詞の集合的意味を自然な日本語の「女たちは皆」で表した。
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: 心に促され
  rationale: 直訳的には「その心が彼女たちを持ち上げた」だが、自発的な内的動機を示すヘブライ語の慣用表現なので、意味を明瞭にする「心に促され」とした。
- source_word: בְּחָכְמָה
  choice: 巧みな技を持つ
  rationale: 幕屋の製作という文脈では抽象的な「知恵」よりも、実際の工芸上の熟練を指す。「巧みな技」でその職人的意味を表した。
- source_word: טָווּ
  choice: 紡いだ
  rationale: 繊維を糸にする動作を表すため、現代日本語で正確かつ簡潔な「紡いだ」とした。
- source_word: אֶת הָעִזִּים
  choice: やぎの毛
  rationale: 字義どおりには「やぎ」だが、紡績と幕屋材料の文脈では、紡ぐためのやぎの毛を省略的に指す。本文では誤解を避けて補足し、脚注で字義を示した。
theological_decisions: []
