reference: Exodus 35:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: ja
  text: 心に促された者は皆、やって来た[a]。また、霊に進んでささげようとする思いを起こされた者は皆、会見の天幕の製作と、そのすべての務めと、聖なる衣服のために、ヤハウェへのささげ物[b]を持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その人の心がその人を持ち上げた者」。内から奮い立たされ、行動へ促されたことを表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: または「ヤハウェのささげ物」。ここでは、ヤハウェにささげるために取り分けられた物という意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: やって来た
  rationale: 基本義「来る」を保ち、文脈から「進み出た」とまで明示しない自然な物語表現とした。
- source_word: כָּל אִישׁ
  choice: 者は皆
  rationale: 字義は「すべての人」だが、ここでは一人一人を包括的に指すため、性別を不必要に限定しない表現とした。
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: 心に促された者
  rationale: 字義的な「その人の心がその人を持ち上げた」という比喩が表す内的な奮起を、現代日本語で自然に伝える。比喩そのものは脚注に残した。
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: 自分の霊に促され、進んでささげようとした者は皆
  rationale: רוּחַによる内的な促しと、נדבが表す自発性・惜しまない心の双方を示した。「霊」を単なる「心」に置き換えず、原文の語彙上の区別を保った。
- source_word: הֵבִיאוּ
  choice: 持って来た
  rationale: 献納する物を実際に携えて来たという具体的な行為を表す。
- source_word: תְּרוּמַת יְהוָה
  choice: ヤハウェへの献納物
  rationale: תְּרוּמָהは取り分けて差し出す物を指す。属格は所属とも献呈先とも解し得るが、寄進の文脈に即して「ヤハウェへの」とし、別の可能性を脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号「主」に置き換えず音写した。
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: 会見の天幕の製作
  rationale: מְלָאכָהは広く「仕事」を意味するが、ここでは天幕と関連物を造る作業を指すため「製作」とした。אֹהֶל מוֹעֵדは定着した明瞭な訳語「会見の天幕」とした。
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: そのすべての務め
  rationale: עֲבֹדָהが礼拝施設に関わる奉仕・作業・機能を含み得るため、範囲を狭めすぎない「務め」とした。「その」は会見の天幕を受ける。
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: 聖なる装束
  rationale: 聖別された祭司の衣服を指す。「装束」は一式の儀礼用衣服として自然で、単なる日常着との違いも伝える。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を明記しているため、その区別を保つ音写を採用した。
- issue: תְּרוּמַת יְהוָה の属格関係
  choice: ヤハウェへの献納物
  alternative: ヤハウェの献納物
  rationale: 献納物がヤハウェにささげられるという文脈上の関係を本文に示したが、ヘブライ語の連語は所属・帰属を表す読みも許すため脚注で残した。
- issue: רוּחוֹ の主体
  choice: 自分の霊に促され
  alternative: 心から進んで
  rationale: 人間の内なる霊を指す原文を保持し、神の霊による直接的な働きと断定したり、単なる感情へ還元したりしないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、礼拝に関する文脈にふさわしい品位を保った。「心」と「霊」の語彙上の区別、自発的な献納という含意、神名を保持した。
