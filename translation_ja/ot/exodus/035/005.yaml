  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: ja
  text: あなたがたの中から、ヤハウェ[a]へのささげ物[b]を取りなさい。心から進んでささげようとする者は皆[c]、ヤハウェへのささげ物、すなわち金、銀、青銅[d]を持って来ることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語本文に記された神の固有名。伝統的に「主」とも訳される。
    reason: divine_name
  - marker: b
    text: または「奉納物」「献納物」。聖なる用途のために取り分けて差し出す物をいう。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「その心が進んでいる者は皆」。自発的にささげようとする内面の意志を表す。
    reason: idiom_clarification
  - marker: d
    text: ヘブライ語は「銅」または銅合金を広く指し得る。ここでは幕屋の資材の文脈に従い「青銅」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: あなたがたの中から…取りなさい
  rationale: 複数形の命令と、共同体内部を出所として示す前置詞句を保った。「集めなさい」も文脈上可能だが、原語の基本義に近い「取りなさい」とした。
- source_word: תְּרוּמָה
  choice: ささげ物
  rationale: 幕屋のために聖別して差し出す物資を指す。現代日本語で自然であり、「奉納物」ほど限定的でも、「献金」ほど金銭に偏ってもいない。
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: 心の進んでいる者は皆
  rationale: 自発的な内面の意志を表す「心」の比喩を残しつつ、性別を不必要に限定しない自然な日本語とした。
- source_word: יְבִיאֶהָ
  choice: 持って来なさい
  rationale: 女性単数の接尾辞は直前の「ささげ物」を受ける。日本語では目的語を続く同格表現と一体に読めるため、代名詞を明示せず自然に訳した。命令的な文脈を示しつつ、献納自体の自発性は前句で保持した。
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: ヤハウェへのささげ物
  rationale: 構成形は所有とも献呈先とも理解できる。この文脈では神に献じる物という関係が明瞭な「への」を本文に採用し、所有的な訳の可能性を注記した。
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: 金、銀、青銅
  rationale: 幕屋資材の列挙として伝統的かつ考古学的に妥当な「青銅」を採用したが、語自体は銅や銅合金を広く指し得るため注記した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の契約名を明記しているため、一般名詞的な称号へ置き換えず、「ヤハウェ」と音写した。
- issue: תְּרוּמַת יְהוָה の関係
  choice: ヤハウェへのささげ物
  alternative: ヤハウェのささげ物
  rationale: 献呈先を表す理解が文脈に適するが、ヘブライ語の構成形が持つ所有的な表現可能性も脚注で保持した。
- issue: 自発性と命令の緊張
  choice: 心の進んでいる者は皆…持って来なさい
  alternative: 心から進んでささげる者は皆…持って来るように
  rationale: 献納者の内面的な自発性と、モーセの指示としての命令性の双方を残し、どちらかを弱めすぎないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令文としての荘重さを保った。「心」の原語表現を残して自発性を示し、資材の列挙は簡潔な体言止めで原文の提示的なリズムを反映した。
