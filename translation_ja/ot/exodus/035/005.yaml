revisions:
- from: あなたがたの中から、ヤハウェ[a]へのささげ物[b]を取りなさい。心の進んでいる者は皆[c]、ヤハウェへのささげ物を持って来なさい。金、銀、青銅を。
  to: あなたがたの中から、ヤハウェ[a]へのささげ物[b]を取りなさい。心から進んでささげようとする者は皆[c]、ヤハウェへのささげ物、すなわち金、銀、青銅[d]を持って来ることになる。
  rationale: 原文の三人称未完了形を直接命令へ変更しないよう、「持って来ることになる」とした。これにより、モーセの指示という文脈を損なわず、ささげる者の自発性も保持する。また、「すなわち」を加えて、金・銀・青銅がヤハウェへのささげ物の内容である同格関係を明確にした。青銅の語義上の幅は脚注で示した。
