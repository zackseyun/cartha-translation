  language: ja
  text: オニキスの石[a]、およびエフォドと胸当てにはめ込むための宝石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ショハム。伝統的に「オニキス」と訳されるが、どの宝石を指すかは確定しておらず、「緑柱石」などとする見方もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: 縞めのう
  rationale: שֹׁהַם は宝石名で、伝統的には「オニキス」に相当する「縞めのう」と訳される。ただし鉱物の厳密な同定には不確かさがあるため、注で明示した。
- source_word: אַבְנֵי מִלֻּאִים
  choice: はめ込み用の宝石
  rationale: מִלֻּאִים は祭司装束にはめ込む石を指す。「はめ込み用」とすることで機能を自然な現代日本語で示し、אַבְנֵי は文脈上「宝石」とした。
- source_word: לָאֵפֹד
  choice: エフォドのための
  rationale: אֵפֹד は祭司の装束を指す専門語であり、解釈的な言い換えを避けて音写した。
- source_word: וְלַחֹשֶׁן
  choice: 胸当てのための
  rationale: חֹשֶׁן は宝石を取り付けた祭司の胸部装具を指す。軍用防具を連想させにくく、現代日本語として明瞭な「胸当て」を採用した。
