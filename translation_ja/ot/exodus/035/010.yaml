  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: ja
  text: あなたがたのうち、熟練した者は皆、来て、ヤハウェが命じられたすべてのものを造りなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「熟練した者」は直訳すると「心に知恵のある者」。この文脈では、特に工芸に必要な知恵と技量を備えた者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל חֲכַם לֵב בָּכֶם
  choice: あなたがたのうち、心に知恵のある者は皆
  rationale: חֲכַם לֵב は直訳的には「心に知恵のある」で、この幕屋建設の文脈では、知識だけでなく工芸上の知恵や技量を備えた者を指す。原文の比喩を保ちつつ、日本語として理解できる表現にした。כָל と単数形の句は個々の該当者を包括するため「者は皆」とした。文法上は男性単数形だが、ここでは分配的・代表的用法であり、日本語で性別を付加しない。
- source_word: יָבֹאוּ וְיַעֲשׂוּ
  choice: 来て、…造りなさい
  rationale: 未完了形はこの文脈で指示・呼びかけの力を持つ。עָשָׂה は広く「する／造る」を意味するが、幕屋とその器具の製作を列挙する直前なので「造る」が適切。
- source_word: אֵת כָּל אֲשֶׁר
  choice: ものをことごとく
  rationale: 関係節が指す命令内容の総体を表す。日本語では「ものをことごとく」として、כָּל の包括性を明確にした。
- source_word: צִוָּה יְהוָה
  choice: ヤハウェが命じられた
  rationale: 完了形は、これから行う製作に先立って命令が与えられたことを示す。神名 יְהוָה は固有名として「ヤハウェ」と音写した。敬意を示す自然な日本語として尊敬語を用いた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に明記された契約の神名を普通名詞的な称号へ置き換えず、固有名として示す。
- issue: חֲכַם לֵב の性と意味
  choice: 心に知恵のある者
  alternative: 熟練した者
  rationale: 文法上の男性単数形は分配的に用いられ、必ずしも男性だけを指すとは断定できない。「者」は性別を不必要に限定せず、同時に「心の知恵」という原文独特の表現を保持する。文脈上は工芸の技量を含むため、その点を脚注で明示した。
- issue: 複数形の述語が持つ指示の力
  choice: 皆、来て、…造りなさい
  alternative: 皆が来て、…造るように
  rationale: יָבֹאוּ וְיַעֲשׂוּ は預言的未来より、共同体への指示・招集として読むのが文脈に適う。日本語の命令表現でその力を自然に示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の「心に知恵のある」という比喩を本文に残し、文脈上の「熟練した」の意味を脚注で補った。節末のコロンは単独の日本語聖句として不自然なため句点としたが、後続する製作品一覧へのつながりは「ものをことごとく」で保っている。
