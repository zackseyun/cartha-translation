translation:
  language: ja
  text: また、明かりのための燭台[a]と、その用具と、そのともしびと、明かりのための油、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「明かりの燭台」。同じ表現に基づき、後半も「明かりの油」と訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: 明かりのための燭台
  rationale: מְנוֹרָהは幕屋の燭台を指し、構文上結び付くהַמָּאוֹרは「明かり、照明」を意味する。「明かりのための」として目的関係を自然な日本語で表した。
- source_word: כֵּלֶיהָ
  choice: その用具
  rationale: כְּלִיは器具、容器、道具などを広く指す。ここでは燭台に付属する品々を過度に限定しない「用具」が適切である。
- source_word: נֵרֹתֶיהָ
  choice: そのともしび皿
  rationale: נֵרは灯火または灯火をともす器を指す。ここでは燭台に据える個々の灯火用の器であり、燭台そのものとの混同を避けるため「ともしび皿」とした。
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: 明かりのための油
  rationale: 直訳的には「明かりの油」。前半のהַמָּאוֹרとの反復を保ちつつ、用途を自然に示す「明かりのための油」とした。
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: また、…と、…、…、…
  rationale: 接続詞を伴う目的語標識の反復は目録の列挙を形作る。日本語では冒頭の「また」と読点による並列で、重苦しくならない範囲でその構造を保った。
