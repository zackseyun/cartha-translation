base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: ja
  text: また、青糸、紫糸、緋色の糸、上質の亜麻布、やぎの毛、赤く染めた雄羊の皮、タハシュの皮[a]を持っていた男は皆、それらを持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」がどの動物または素材を指すかは不明。「上質の革」「イルカの皮」「ジュゴンの皮」などの訳が提案されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ אֲשֶׁר נִמְצָא אִתּוֹ
  choice: 持っていた者は皆
  rationale: 直訳は「それとともに見いだされたすべての人」だが、所有を表すヘブライ語の構文を、性別を不必要に限定せず自然な現代日本語で表した。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青糸、紫糸、緋色の糸
  rationale: 幕屋用資材の文脈にある染色繊維として具体化し、三つの色材を並行的に訳した。
- source_word: שֵׁשׁ
  choice: 上質の亜麻布
  rationale: 祭司・幕屋関連の用例で示される高品質の亜麻製品という含意を表した。
- source_word: עִזִּים
  choice: やぎの毛
  rationale: 字義上は「やぎ」だが、資材一覧と幕の製作という文脈では、織物に用いるやぎの毛を指す。
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 赤く染めた雄羊の皮
  rationale: 皮が赤く処理・染色されていることを示す分詞の意味を明確にした。
- source_word: עֹרֹת תְּחָשִׁים
  choice: タハシュの皮
  rationale: תחש が指す動物または皮革の種類は確定できないため、推測的な同定を避けて音写し、注で不確実性を示した。
- source_word: הֵבִיאוּ
  choice: それらを持って来た
  rationale: 複数動詞の主語を日本語では「者は皆」で示し、文脈上省略された目的語を補って自然に訳した。
