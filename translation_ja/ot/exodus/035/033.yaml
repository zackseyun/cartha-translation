  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: ja
  text: また、石をはめ込むために石を加工し、木を加工し、あらゆる意匠を凝らした[a]仕事を行うことにも秀でていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「さまざまな巧みな仕事」「あらゆる工夫を凝らした仕事」。ヘブライ語は、考案・設計された、熟練を要する仕事を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת אֶבֶן
  choice: 宝石を彫り
  rationale: חֲרֹשֶׁת は素材を巧みに加工することを表す。直前から続く能力付与の列挙として自然になるよう表現し、אֶבֶן は幕屋の工芸という文脈から、はめ込むための石、すなわち宝石とした。
- source_word: לְמַלֹּאת
  choice: はめ込む
  rationale: この幕屋工芸の文脈では、一般的な「満たす」ではなく、石を台座などにはめ込むことを指す。
- source_word: וּבַחֲרֹשֶׁת עֵץ
  choice: 木を彫刻し
  rationale: 同じ חֲרֹשֶׁת を木という素材に即して自然な日本語で表した。עֵץ はここでは生木ではなく材料としての木を指す。
- source_word: לַעֲשׂוֹת בְּכָל מְלֶאכֶת מַחֲשָׁבֶת
  choice: あらゆる意匠を凝らした細工をする
  rationale: מְלֶאכֶת מַחֲשָׁבֶת は、考案・設計・熟練を伴う工芸を意味する。「意匠を凝らした細工」は計画性と芸術性を保ちつつ、現代日本語として自然である。
- source_word: בְּכָל
  choice: あらゆる
  rationale: 工芸作業の全範囲を示す包括的・分配的な表現として訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文は前節から続く動詞のない並列句なので、日本語では文意を補って「技を授けられた」とした。「宝石」は幕屋の装飾品を作る文脈に基づく具体化であり、「意匠を凝らした」は מַחֲשָׁבֶת の設計性・芸術性を保持する。
