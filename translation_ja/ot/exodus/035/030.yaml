source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: ja
  text: モーセはイスラエルの子ら[a]に言った。「見なさい。ヤハウェは、フルの子ウリの子で、ユダ族に属するベツァルエルを、名を挙げて召された。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人」。ヘブライ語では直訳すると「イスラエルの子ら」。
    reason: 原文の親族的表現と、その民族全体を指す慣用的な意味の両方を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法は、日本語では文脈上の順序が明らかなため、簡潔な「言った」で自然に表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 民族全体を指す慣用表現である一方、原文の親族的な言い方を保つため「子ら」とした。現代日本語でより自然な「イスラエル人」は脚注に示した。
- source_word: רְאוּ
  choice: 見なさい
  rationale: 続く宣言へ注意を促す複数形の命令。古風すぎる「見よ」を避けつつ、命令の力を保った。
- source_word: קָרָא ... בְּשֵׁם
  choice: 名指しで召された
  rationale: 特定の人物を名によって選び、任務へ召すという句の力を表す。「名づけた」ではなく、文脈に即して召命・選任の意味を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
- source_word: בְּצַלְאֵל
  choice: ベツァルエル
  rationale: ヘブライ語名の音形に基づく日本語表記。
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: フルの子ウリの子ベツァルエル
  rationale: ベツァルエルがウリの子、ウリがフルの子である系譜関係を、日本語で誤解なく示した。
- source_word: לְמַטֵּה יְהוּדָה
  choice: ユダ族に属する
  rationale: ベツァルエルの部族的所属を示す句として、明確で自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を明記しているため、その固有名としての性格を保った。
- issue: בְּנֵי יִשְׂרָאֵל の性別を含む親族表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: この句は共同体全体を指し得るが、原文の「子ら」という親族的表現を本文に残し、より慣用的な民族名は脚注で示した。
- issue: קָרָא ... בְּשֵׁם が示す行為
  choice: 名指しで召された
  alternative: 名を挙げて選ばれた
  rationale: この表現には名前による特定と任務への召しの含意がある。「召された」は文脈に合うが、選任の側面も排除しない。
translation_notes:
  register: 明快な現代標準語を用い、神名と系譜表現には荘重さを保った。「見よ」のような過度に古風な語は避けた。
