lexical_decisions:
- source_word: שֶׁמֶן
  choice: 油
  rationale: 語自体は広く油を意味し、文脈上はオリーブ油と考えられるが、ヘブライ語に明示されていない限定を加えない。
- source_word: לַמָּאוֹר
  choice: 明かりのための
  rationale: 幕屋で明かりをともすために用いることを自然な現代日本語で示しつつ、原文の名詞的な表現を保つ。
- source_word: בְשָׂמִים
  choice: 香料
  rationale: 聖別された調合物に用いる芳香性の材料を指すため、現代日本語で広く理解できる「香料」とした。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 人や物を聖別するために注ぐ、定まった祭儀用の油を表す。簡潔で原語の構造にも近い。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 幕屋の文脈では、たいて香りを立たせる祭儀用の香を指す。「香」は自然で簡潔な訳語である。
- source_word: הַסַּמִּים
  choice: 香り高い
  rationale: 直訳的には「香料の」であるが、日本語として不自然な重複を避け、芳香性を自然に表した。別の構文理解は脚注に残した。
