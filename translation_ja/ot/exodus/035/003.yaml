  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: ja
  text: 安息日には、あなたがたの住むどの場所でも火をたいてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: 火をたいて
  rationale: בערのピエル形は、ここでは火を燃え立たせる、火を起こすことを指す。「火をたく」は自然な現代日本語で、単に火が燃えている状態ではなく、火を起こす行為を明確に表す。
- source_word: אֵשׁ
  choice: 火
  rationale: 単数名詞だが、日本語では不定冠詞に相当する表現を加えず「火」とするのが自然である。動詞と合わせて「火をたく」と訳した。
- source_word: בְּכֹל
  choice: どの場所でも
  rationale: כֹלの分配的な意味を表し、禁止が各々の居住場所すべてに及ぶことを自然な日本語で示す。
- source_word: מֹשְׁבֹתֵיכֶם
  choice: あなたがたの住む…場所
  rationale: מוֹשָׁבは住居、居住地、住む場所を意味し得る。「家」に限定せず、原語の広がりを保つため「住む場所」とした。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 安息日には
  rationale: 原語は直訳すれば「安息日の日に」だが、日本語の「安息日」自体が日を表すため、「安息日には」が明瞭で自然である。
theological_decisions:
- issue: 安息日における火に関する禁止の範囲
  choice: 火をたく行為そのものへの直接的な禁止として訳す。
  alternative: 火の維持や使用、熱を伴うすべての作業まで含むように敷衍する。
  rationale: ヘブライ語本文が明示するのは、安息日にイスラエル人の居住場所で火をたくことの禁止である。後代の解釈による適用範囲を訳文に持ち込まず、本文の命令をそのまま示す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、命令の厳粛さを保った。「あなたがたの住むどの場所でも」により、やや硬い「すべての住居で」を避けつつ原文の分配的な範囲を保持した。
