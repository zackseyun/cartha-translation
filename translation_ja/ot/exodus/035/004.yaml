source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: ja
  text: そこでモーセは、イスラエルの子らの全会衆[a]にこう言った。「ヤハウェが命じられたことは、次のとおりである。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全会衆」は「全集会」または「共同体全体」とも訳せる。ここで「イスラエルの子ら」は、伝統的には「イスラエルの子どもたち」、意味上は「イスラエル人」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは、「これは、ヤハウェが命じられた言葉（または事柄）であり、次のように、である」。最後の「次のように」は、次節以下に続く命令内容を導入する表現である。本文では自然な日本語として「次のとおりである」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: こう言った
  rationale: 物語を進める接続形を、現代日本語で自然な発話導入として表した。後続の לֵאמֹר の機能も「こう」によって示している。
- source_word: עֲדַת
  choice: 会衆
  rationale: イスラエルの共同体、とりわけ集められた集団を指す語であり、五書の文脈にふさわしい「会衆」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の男性複数形を保ちつつ、ヤコブすなわちイスラエルの子孫から成る民という表現を反映した。
- source_word: זֶה הַדָּבָר
  choice: ことは、次のとおりである
  rationale: דָּבָר の「言葉・事柄」という幅を保ちながら、次節から命令内容が続く導入句として自然な日本語にした。
- source_word: צִוָּה
  choice: 命じられた
  rationale: 完了した神の命令を表す。日本語では神への敬意を示す尊敬形が自然であり、受動の意味ではない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神の固有名である四文字名を音写した。
- source_word: לֵאמֹר
  choice: こう／次のとおり
  rationale: 二度現れる発話導入表現を、日本語の引用構文に合わせてそれぞれ「こう言った」と「次のとおりである」で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字の固有名を用いているため、その区別を保って「ヤハウェ」とした。
- issue: בְּנֵי יִשְׂרָאֵל の性と集団性
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの子孫
  rationale: 原文の男性複数の表現を透明に残した。ただし文脈上はイスラエル共同体全体への呼びかけであり、成人男性だけに限定するとは断定しない。
- issue: זֶה הַדָּבָר の意味範囲
  choice: こと
  alternative: 言葉、事柄
  rationale: דָּבָר は「言葉」と「事柄」の双方を表し得る。ここでは次に続く命令の内容を導くため、日本語として自然な「こと」を選び、別訳を注記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の反復的な「言う」構文は、日本語で不自然にならないよう引用導入として整理した。神名は「ヤハウェ」、共同体を指す原文の表現は「イスラエルの子ら」として保持した。
