base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: ja
  text: 心に知恵のある女たちは皆[a]、自分の手で糸を紡ぎ、紡いだもの、すなわち青糸、紫糸、緋色の糸、上質の亜麻糸[b]を持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「心に知恵のある」。内面的な知恵に根差した実際的な技能を表すヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「紡いだもの、すなわち青色、紫色、緋色、上質の亜麻を」。ヘブライ語は「紡いだもの」の後に素材を列挙している。
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: 心に知恵のある
  rationale: ヘブライ語の「心」と「知恵」の結び付きを残しつつ、内面的な知恵に根差した実際的な技能を表す慣用句として訳した。単に「熟練した」とすると心への言及が失われるため、注で意味を補った。
- source_word: בְּיָדֶיהָ
  choice: 自分の手で
  rationale: 手段を示す前置詞と「彼女の両手」を、自然な現代日本語で表し、手仕事であることを明確にした。
- source_word: טָוּוּ
  choice: 糸を紡ぎ
  rationale: 繊維を糸にする作業を指す動詞なので、日本語で自然かつ簡潔な「糸を紡ぐ」とした。
- source_word: וַיָּבִיאוּ
  choice: 持って来た
  rationale: 複数形を、前半の「女たちは皆」を受ける集合的な述語として表した。個々の女性を指す表現から集団を指す複数形へ移る原文の流れにも対応する。
- source_word: מַטְוֶה
  choice: 紡いだもの
  rationale: 紡いでできた糸または素材を指す名詞であり、後続の材料一覧を自然に導ける表現とした。
- source_word: תְּכֵלֶת
  choice: 青糸
  rationale: 幕屋の織物に使われる高価な青系染色の素材を指す。文脈上は紡いだ糸なので、「青糸」と簡潔に明示した。
- source_word: אַרְגָּמָן
  choice: 紫糸
  rationale: 幕屋の織物に用いる紫色に染めた素材を指すため、紡績の文脈に合わせて「紫糸」とした。
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: 緋色の糸
  rationale: 虫由来の染料と関連する緋色の染色素材を指す慣用表現である。語源を直訳せず、織物の文脈で明確な「緋色の糸」とした。
- source_word: שֵׁשׁ
  choice: 上質の亜麻糸
  rationale: 幕屋の記事では質の高い亜麻布・亜麻糸を指すため、「上質の亜麻糸」として素材と品質を示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準語。「心に知恵のある」という原文特有の表現を本文に残し、意味を脚注で説明した。色材は紡績の文脈に即して「糸」と明示し、文全体は女性たちの主体的な手仕事が自然に伝わる語順に整えた。
