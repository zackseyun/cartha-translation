  text: 幕屋の杭、庭の杭、およびそれらの綱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְדֹת
  choice: 杭
  rationale: 幕屋と庭の幕を固定するために地面へ打ち込む部材を指す。「杭」は簡潔で、現代日本語でも用途が明瞭である。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる住まいを指す定着した訳語であり、文脈上も明確である。
- source_word: הֶחָצֵר
  choice: 庭
  rationale: 幕屋を囲む外側の区画を指す。出エジプト記の祭儀的文脈で自然かつ簡潔な訳語である。
- source_word: מֵיתְרֵיהֶם
  choice: それらの綱
  rationale: 幕屋および庭の杭などに関連する固定用の綱を指す。「綱」は強度のある結索具を自然に表す。接尾辞の複数指示を「それらの」として保持する。
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: 幕屋の杭、庭の杭、およびそれらの綱
  rationale: 反復される目的語標識と接続詞による目録形式を、三項の並列として明確に再現した。
