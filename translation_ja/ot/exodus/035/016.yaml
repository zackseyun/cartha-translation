base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/016.yaml
  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: ja
  text: 全焼の献げ物をささげる祭壇、それに属する青銅の格子[a]、祭壇の担ぎ棒とすべての器具、水盤とその台[b]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青銅の網」または「青銅の網細工」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「その台」は「その台座」とも訳せる。伝統的には「洗盤とその台」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物を献げる祭壇
  rationale: 全焼のささげ物と祭壇との機能的な関係を明確にしつつ、現代日本語として自然に表現した。
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: 青銅の格子
  rationale: 祭壇に付属する網状の青銅製器具を指すため、「格子」とした。
- source_word: אֲשֶׁר לוֹ
  choice: それに属する
  rationale: 祭壇との所有・付属関係を示し、具体的な設置位置までは限定しない原文の幅を保った。
- source_word: בַּדָּיו
  choice: 祭壇の担ぎ棒
  rationale: 代名詞の指示対象を日本語で明確にし、運搬用の棒であることを自然に示した。
- source_word: כָּל כֵּלָיו
  choice: すべての器具
  rationale: 祭壇に付属する各種の用具を広く表す語として、明瞭で現代的な「器具」を用いた。
- source_word: הַכִּיֹּר
  choice: 水盤
  rationale: 幕屋の庭で用いる水を入れる容器を、古風な専門語を避けて簡潔に表した。
- source_word: כַּנּוֹ
  choice: その台
  rationale: 水盤を支える台または基部を指す語を、原文以上に形状を限定せず表現した。
