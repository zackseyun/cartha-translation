  yaml_path: translation/ot/exodus/035/017.yaml
  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: ja
  text: 庭を囲む幕、その柱と台座、また庭の門の垂れ幕――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי
  choice: 庭を囲む幕
  rationale: 庭の周囲を形作る布製の幕を指すため、単なる「幕」より機能が明確になるよう「庭を囲む幕」とした。入口用の מָסַךְ とは表現を分けた。
- source_word: הֶחָצֵר
  choice: 庭
  rationale: 幕屋を囲む区画を指す。文脈にない「幕屋の」を補わず、簡潔で定着した祭儀建築用語として「庭」とした。
- source_word: עַמֻּדָיו
  choice: その柱
  rationale: 囲いの幕を支える直立部材を指す。「支柱」も可能だが、幕屋関連の建築語として自然で格調も保てる「柱」を採用した。
- source_word: אֲדָנֶיהָ
  choice: 台座
  rationale: 柱の下部を支える受け台を指す。「受け座」より一般読者に分かりやすく、構造上の役割も伝わる「台座」とした。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 入口を覆う布製の仕切りを指す。周囲の קְלָעִים と区別しつつ、硬質な「扉」と誤解されないよう「垂れ幕」とした。
- source_word: שַׁעַר
  choice: 門
  rationale: 庭の出入り口を指す語を直接的に訳した。「入口」も可能だが、囲われた庭の開口部という構造を示す「門」が適切である。
theological_decisions: []
translation_notes:
