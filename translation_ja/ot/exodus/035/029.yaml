language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: ja
  text: イスラエルの人々[c]、すなわち、ヤハウェがモーセを通して[b]行うよう命じたすべての仕事のために、心に促されて[a]物を持参した男女は皆、ヤハウェに自発のささげ物を持参した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その心が彼らを進んでさせた」。内からの意欲や促しを表すヘブライ語の言い回し。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「モーセの手によって」。ここでは、モーセを仲介者として、という意味。
    reason: lexical_alternative
  - marker: c
    text: 原文は「イスラエルの子らが持参した」。これはイスラエルの民を指す慣用的な呼び方。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: 男女は皆
  rationale: 男女双方を明示する原文と、כָּל の包括的・分配的な力を、自然な現代日本語で保つ。
- source_word: נָדַב לִבָּם אֹתָם
  choice: 心を動かされて
  rationale: 心を意志の座とし、内側から自発的に促されたことを表すヘブライ語の慣用表現を簡潔に訳す。
- source_word: לְהָבִיא
  choice: 物を携えて来ようとした
  rationale: 動詞自体は「持って来る」だが、目的語は文脈上の資材・寄進物であるため「物」を補い、自発的な意志も自然に示す。
- source_word: לְכָל הַמְּלָאכָה
  choice: すべての仕事のために
  rationale: 幕屋とその備品の製作に関わる作業全般を指すため、広い意味を持つ「仕事」とする。
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: ヤハウェがモーセを通して行うよう命じた
  rationale: בְּיַד の字義は「モーセの手によって」だが、ここでは仲介・伝達を示す慣用句なので「モーセを通して」とする。לַעֲשׂוֹת は日本語で自然な「行うよう」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な音写により示す。
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: イスラエルの人々はこのようにした
  rationale: 原文は長い主語を受けて「イスラエルの子らが携えて来た」と結ぶ。日本語では同じ動作の不自然な重複を避けつつ、民全体を指す総称を独立文で明確にした。
- source_word: נְדָבָה
  choice: 自発のささげ物
  rationale: 強制ではなく、進んで差し出す贈り物・奉献物であることを明示する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いるため、称号の「主」に置換せず音写する。「エホバ」よりもヘブライ語の推定発音に近い一般的な日本語表記を採る。
- issue: ささげ物の自発性
  choice: 自発のささげ物
  alternative: 奉納物、供え物
  rationale: נְדָבָה と「心を動かされて」の組み合わせが示す、自ら進んで与える性格を保つ。律法上の強制か完全に無規定の行為かという範囲を本文以上に断定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。長いヘブライ語文の論理関係を保ちながら、日本語として主語と述語を追いやすくするため二文に分けた。「男女は皆」で参与者を明示し、「自発のささげ物」で中心的な自発性を保持した。
