id: EXO.35.24
reference: Exodus 35:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: ja
  text: 銀や青銅[a]を献納物として差し出す者は皆、それをヤハウェへの献納物として持って来た。また、奉仕のあらゆる作業のためのアカシア材が手元にある者[b]は皆、それを持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「銀と青銅」。ここでは、各自が銀または青銅のうち差し出せるものを持って来たという意味に取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「アカシア材がその人とともに見いだされた者」。アカシア材を所有していた、または使える状態で持っていたことを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: 差し出す者は皆
  rationale: רוּם の分詞は תְּרוּמָה とともに、献納物を差し出すことを表す。「差し出す」で動作を自然に示し、分詞の継続的・類型的な表現を保った。
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: 銀や青銅を献納物として
  rationale: תְּרוּמָה は聖なる用途のために取り分けて差し出す献納物。נְחֹשֶׁת は銅または青銅を指し得るが、幕屋の資材という文脈に従い「青銅」とした。接続詞 וְ は日本語では各人が銀か青銅の手持ちのものを差し出したという分配的意味が自然になるよう「や」とした。
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: それをヤハウェへの献納物として持って来た
  rationale: תְּרוּמַת יְהוָה は直訳すれば「ヤハウェの献納物」だが、ここではヤハウェにささげるために指定された献納物を表す。「への」によって目的・帰属を自然な日本語で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: ヘブライ語本文に記された神の固有名を音写し、普通名詞の称号に置き換えなかった。
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: また、…が手元にある者は皆
  rationale: 直訳は「彼とともに見いだされた者は皆」だが、これは所有または利用可能であることを示すヘブライ語の慣用表現。「手元にある」で意味を明瞭かつ自然に伝えた。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 幕屋の建材を指す標準的で分かりやすい訳語。「木」よりも加工用資材であることが伝わる「材」とした。
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: 奉仕のあらゆる作業に使う
  rationale: מְלָאכָה（作業・仕事）と עֲבֹדָה（奉仕・労働）の両語を訳出した。本文に明記されない「幕屋」は補わず、文脈に委ねた。
- source_word: הֵבִיאוּ
  choice: それを持って来た
  rationale: アカシア材を受ける目的語を日本語で明示し、自然な文として整えた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文の固有名を明示し、称号への置換や特定の教派的慣例を避けた。
- issue: תְּרוּמַת יְהוָה の関係
  choice: ヤハウェへの献納物
  alternative: ヤハウェの献納物
  rationale: 属格は所有・帰属・献呈先の幅を持つ。文脈上、民がヤハウェのために持参する献納物なので「への」としたが、神に属するものという含みも失われない表現を選んだ。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で格調を保った文体。「献納物」は聖なる用途のために取り分けて差し出す物という תְּרוּמָה の意味を保つために採用した。「ささげる」の反復を避けつつ、原文の「差し出す」と「持って来る」の動作を区別した。
