source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י יִהְיֶ֨ה לָ/כֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֥ה ב֛/וֹ מְלָאכָ֖ה יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: ja
  text: 六日間は仕事をしてよい。しかし七日目は、あなたがたにとって聖なる、ヤハウェのための完全な安息日である[a][b]。その日に仕事をする者はだれでも、死刑に処せられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「安息日、完全な休み」。同じ語根に属する語を重ねることで、仕事を完全にやめる安息が強調されている。別訳「全き安息の安息日」。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェのための」は、「ヤハウェにささげる」または「ヤハウェに属する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: 仕事をしてよい
  rationale: ニファル未完了形の非人称的な受動表現を、日本語の律法文として自然な許可表現にした。単純な未来や直接命令に限定しない。
- source_word: קֹדֶשׁ
  choice: 聖なる日
  rationale: 七日目が聖別されたものであるという述語的用法を、文脈に即して明瞭に表した。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全に休む安息日
  rationale: 同語根を重ねた強意を、仕事からの全面的な停止・休息として分かりやすく表現した。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 前置詞 ל が示す献身・帰属・方向づけの幅を保ちつつ、自然な日本語にした。
- source_word: כָּל הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: その日に仕事をする者はだれでも
  rationale: 一般的な法的対象を示す כָּל と、日を指す בּוֹ を明瞭に表した。
- source_word: יוּמָת
  choice: 死刑に処せられる
  rationale: מות のホファル形が表す使役受動の刑罰規定を保持した。本文には不定詞絶対形がないため、「必ず」は補わなかった。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の四文字神名を固有名として示し、シナイ契約の文脈にある神名を普通名詞的な称号へ置き換えない。
- issue: לַיהוָה の関係
  choice: ヤハウェのために
  alternative: ヤハウェにささげる／ヤハウェに属する
  rationale: ל の意味は献身、方向づけ、帰属のいずれにも理解し得るため、特定の一解釈に狭めすぎない表現を採用した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、律法規定としての簡潔さと厳粛さを保った。「完全に休む」は強意表現を自然に伝え、「死刑に処せられる」は原文にない強意語を加えず刑罰の確定性を示す。
