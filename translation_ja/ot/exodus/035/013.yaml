  text: אֶת הַ/שֻּׁלְחָ֥ן וְ/אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו וְ/אֵ֖ת לֶ֥חֶם הַ/פָּנִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/013.yaml
  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: ja
  text: 机、その担ぎ棒、そのすべての用具、臨在のパン[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「供えのパン」。直訳は「臨在のパン」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 語そのものは幕屋で用いる祭儀用の机を指す。用途は後の「臨在のパン」から分かるため、ここで説明を加えない。
- source_word: בַּדָּיו
  choice: その担ぎ棒
  rationale: 幕屋の文脈では聖なる備品を運ぶための棒を指す。「担ぎ棒」は用途を自然かつ簡潔に示す。
- source_word: כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: כְּלִי は器、道具、備品を広く表す。ここでは机に付属する品々を包括できる「用具」が自然である。
- source_word: לֶחֶם הַפָּנִים
  choice: 臨在のパン
  rationale: 字義的には「顔／臨在のパン」。祭儀的表現を保ちつつ、神の御前に置かれるパンという含意を過度に説明せず伝える。
theological_decisions:
- issue: לֶחֶם הַפָּנִים における「臨在」の主体
  choice: 本文では「臨在のパン」とし、主体を補わない
  alternative: 主の御前に供えるパン
  rationale: 原文にはこの句の中で神名が明記されていない。神の臨在を指す祭儀的含意を保ちながら、説明的な補足で曖昧さを解消しすぎないため。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、列挙を示す原文の接続構造と、節が文の途中で終わる形を読点で保った。「担ぎ棒」は単なる「棒」より文脈上の機能が明確で、「用具」は器類を含む付属品全般を自然に表す。
