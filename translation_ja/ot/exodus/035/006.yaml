lexical_decisions:
- source_word: תְכֵלֶת
  choice: 青紫色の糸
  rationale: 青から青紫の染料で染めた織物素材を指す。幕屋の材料の列挙であるため、色だけでなく「糸」を補い、現代日本語で具体的に示した。
- source_word: אַרְגָּמָן
  choice: 赤紫色の糸
  rationale: 紫系の染色素材を指し、תְכֵלֶתとの区別が伝わるよう「赤紫色」とした。文脈上の素材を「糸」で明示した。
- source_word: תוֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 昆虫由来の染料で染めた鮮やかな赤色の素材を表す慣用句であり、自然で品位ある「緋色の糸」とした。
- source_word: שֵׁשׁ
  choice: 上質の亜麻糸
  rationale: 幕屋に用いる良質な亜麻素材を指す。材料一覧の中で、織り上がった布と限定せず「亜麻糸」と訳した。
- source_word: עִזִּים
  choice: やぎの毛
  rationale: 字義は「やぎ」だが、この材料一覧では幕屋の覆いを織るためのやぎの毛を意味する。生きた動物との誤解を避けて含意を本文に示した。
- source_word: וְ
  choice: 、
  rationale: ヘブライ語では各項目が接続詞で結ばれるが、日本語では読点による列挙が最も自然で、連続する材料一覧のリズムも保てる。
