  text: וַ/יֵּֽצְא֛וּ כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/לִּ/פְנֵ֥י מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/020.yaml
  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: ja
  text: そこで、イスラエルの子らの全会衆[a]は、モーセの前から出て行った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全会衆」は「全集会」または「共同体全体」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「モーセの前から出て行った」とは、モーセのもとを退出したという意味。
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: そこで……出て行った
  rationale: 物語を進めるワイイクトル形の継起性を「そこで」で示し、יצאの基本的な空間移動の意味を「出て行った」と訳した。
- source_word: כָּל עֲדַת
  choice: 全会衆
  rationale: כָּלの全体性と、עֵדָהが指すイスラエルの共同体・集会の意味を簡潔に保った。「会衆」は幕屋建設の記事にも適した尊厳ある表現である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 直訳的な構造と民としての系譜的呼称を保った。文脈上、男性だけを指すとは限らないため、日本語の「子ら」で共同体全体を自然に表した。
- source_word: מִלִּפְנֵי
  choice: モーセの前から
  rationale: 「～の前から／面前から」というヘブライ語の空間的慣用表現を保持した。自然な意味は、モーセのもとを退出したということである。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着した固有名表記を用いた。
theological_decisions: []
