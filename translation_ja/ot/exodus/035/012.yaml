  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: ja
  text: 箱とその担ぎ棒、贖いの蓋[a]、仕切りの垂れ幕、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恵みの座」。
    reason: הַכַּפֹּרֶתは箱の蓋を指すと同時に、贖いに関わる祭儀的意味を持つため。
lexical_decisions:
- source_word: הָאָרֹן
  choice: 箱
  rationale: 幕屋の文脈で契約の箱を指す。日本語では「箱」が簡潔かつ定着した表現であり、聖なる調度品であることは文脈から明らかになる。
- source_word: בַּדָּיו
  choice: その担ぎ棒
  rationale: 聖具を運搬するための棒を指すため、用途が自然に伝わる現代日本語とした。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 箱の金の蓋という具体物と、語が持つ贖罪上の含意の双方を保つ。「贖罪蓋」より自然で、「恵みの座」より物体としての性格が明瞭である。別訳を脚注に示した。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 仕切りの垂れ幕
  rationale: פָּרֹכֶתの垂れ幕としての形態と、הַמָּסָךְが示す遮蔽・仕切りの働きを、重複感の少ない自然な日本語で表した。
- source_word: אֶת / וְאֶת
  choice: 訳出しない
  rationale: 定目的語標識であり、日本語では列挙と読点によって統語関係を表せる。
theological_decisions:
- issue: הַכַּפֹּרֶתの祭儀的意味
  choice: 贖いの蓋
  alternative: 恵みの座
  rationale: 蓋という具体的指示対象と贖いとの結びつきを同時に伝える一方、伝統的な理解を示す「恵みの座」も排除せず脚注に残した。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。節が前後の命令文に続く列挙の一部であるため、末尾を読点とした。
