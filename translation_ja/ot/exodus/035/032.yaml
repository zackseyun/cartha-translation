translation:
  language: ja
  text: 意匠を考案し[a]、金、銀、青銅[b]で細工をすること。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「考案を考案し」。ヘブライ語は同じ語根の動詞と名詞を重ね、熟練した芸術的な構想を強調している。「設計を立て」とも訳せる。
    reason: lexical_alternative
  - marker: b
