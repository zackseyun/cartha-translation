id: EXO.35.34
reference: Exodus 35:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת נָתַ֣ן בְּ/לִבּ֑/וֹ ה֕וּא וְ/אָֽהֳלִיאָ֥ב בֶּן אֲחִיסָמָ֖ךְ לְ/מַטֵּה דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: ja
  text: また、教える力[a]を、彼にも、ダン部族のアヒサマクの子オホリアブにも、心の内に授けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「指導する力」。ヘブライ語は広い意味で教えることを表し、ここでは熟練した仕事の仕方を教えることも含みます。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: 教える力
  rationale: ヒフィル形の不定詞は「教える、指導する」を意味する。ここでは職人としての技を他者に教える能力が内的に与えられたことを、自然な日本語で表した。
- source_word: נָתַן בְּלִבּוֹ
  choice: 心の内に授けた
  rationale: 「心に置いた」というヘブライ語の比喩を生かしつつ、能力や志を内面的に与えるという文脈上の意味が明瞭になる表現とした。
- source_word: הוּא וְאָהֳלִיאָב
  choice: 彼にも……オホリアブにも
  rationale: 明示された代名詞と並列関係を日本語で自然に示し、教える力が両者に与えられたことを保持した。
- source_word: בֶּן אֲחִיסָמָךְ
  choice: アヒサマクの子
  rationale: 系譜的な父子関係を簡潔かつ定型的に表した。
- source_word: לְמַטֵּה דָן
  choice: ダン部族の
  rationale: 前置詞 לְ がここで表す部族への所属を、明確で自然な日本語にした。
theological_decisions:
- issue: 「心に授けた」の主語
  choice: 日本語本文でも主語を明示せず、前文脈から受ける形にした
  alternative: 「神は」または「主は」を補う
  rationale: ヘブライ語本文では主語がこの節に明示されず、前文脈から理解される。神による賦与という文脈は保ちつつ、本文にない神名を補わないことで原文の連続性を尊重した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、「心の内に授けた」によって聖書的な内的賦与の表現を保った。固有名詞は一般的な日本語音写とした。
