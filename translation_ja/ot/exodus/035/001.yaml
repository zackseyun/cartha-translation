  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: ja
  text: モーセはイスラエルの子ら[a]の全会衆を集め、彼らに言った。「これらは、ヤハウェが行うように命じた事柄[b]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの息子たち」。イスラエルの契約共同体を表す呼称であり、ここでは男性だけでなく民全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「言葉」または「事」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: 集め
  rationale: 使役語幹の意味を踏まえ、モーセが民を一つの集団として招集したことを、自然で明瞭な現代日本語で表す。
- source_word: כָּל עֲדַת
  choice: 全会衆
  rationale: עֵדָהが示すイスラエルの共同体としてのまとまりを「会衆」で保ち、כָּלを「全」で表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の男性複数形を保ちつつ、日本語として理解できる表現とした。ここでは男性だけでなく、契約共同体であるイスラエルの民全体を指すため、脚注で明示する。
- source_word: אֵלֶּה הַדְּבָרִים
  choice: これらは……事柄である
  rationale: דְּבָרִיםには「言葉」「事柄」などの意味がある。後続する命令と行為を指す文脈から本文では「事柄」とし、語義の幅は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
- source_word: לַעֲשֹׂת אֹתָם
  choice: 行うよう命じた
  rationale: 命じられた諸事項が実行されるべきことを、目的語を不自然に重ねず簡潔な日本語で表した。原文に明示されない命令の受け手は補わなかった。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、その固有名としての性格を保つ音写を採用した。
- issue: בְּנֵי יִשְׂרָאֵל の性と指示範囲
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の男性複数形を保持する一方、この句が男性だけでなく民全体を代表的に指すことを脚注で説明し、文法形式と実際の指示範囲の両方を保った。
- issue: 命令の受け手
  choice: 本文では明示しない
  alternative: あなたがたが行うよう命じた
  rationale: 文脈上はイスラエル共同体が実行主体だが、この節のヘブライ語には命令の受け手が明示されていないため、本文で「あなたがた」を補わなかった。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。「全会衆」によって共同体としての性格を示し、直接話法は自然な叙述調とした。
