  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: ja
  text: 聖所で奉仕するための精巧に織られた衣服[a][b]、祭司アロンのための聖なる装束、また、祭司として仕えるアロンの息子たちのための装束。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奉仕のための衣服」。ヘブライ語の語は、特別に織られた衣服を指すとも、奉仕用の衣服を指すとも考えられます。
    reason: lexical_alternative
  - marker: b
    text: この句を、後に続くアロンとその息子たちの聖なる装束とは別の品目ではなく、その総称または同格的な説明と見ることもできます。
    reason: structural_ambiguity
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: 精巧に織られた衣服
  rationale: הַשְּׂרָד は幕屋に関する文脈で特殊な織物または奉仕用の衣服を指すと考えられるが、語義には不確かさがある。本文では自然な日本語で有力な織物解を示し、別解を脚注に残した。
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: 聖所で奉仕するための
  rationale: שרת の聖務的な奉仕の意味と、בַּקֹּדֶשׁ がこの文脈で聖なる区域・聖所を指すことを明確に表す。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 聖なる装束
  rationale: 直訳的な『聖なる衣服』も可能だが、祭司職のために聖別された一式の衣服であることを、現代日本語として格調を保ちながら表した。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンの
  rationale: アロンの職務を簡潔かつ自然に示す。
- source_word: בִּגְדֵי בָנָיו לְכַהֵן
  choice: 祭司として仕えるその息子たちの装束
  rationale: כהן の動詞的意味『祭司として務める』を保ち、単に祭司用であるという以上に、息子たちの奉仕目的を表した。
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד と בִּגְדֵי הַקֹּדֶשׁ の関係
  choice: 反復される目的格標識 אֶת に従い、前者を聖所での奉仕に用いる衣服、後者をアロンとその息子たちの聖なる装束として並列的に訳した。
  alternative: 前者を後続する祭司の聖なる装束の総称または同格の説明と見る。
  rationale: ヘブライ語の列挙は区別を支持する一方、両者が同じ祭司装束を異なる面から述べる可能性も排除できないため、本文では区別し、脚注で統語上の別解を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭司礼拝の文脈にふさわしい品位を保った。「衣服」と「装束」を使い分け、一般的な織物品と祭司の聖別された衣服の区別を読みやすく示した。
