base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: ja
  text: 香をたく祭壇とその担ぎ棒、注ぎの油、香料を調合した香[a]、幕屋の入り口の垂れ幕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「香料の香」。または「香り高い香」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香をたく祭壇
  rationale: 連語は香と結び付いた祭壇を指す。用途が明瞭で、現代日本語として自然な「香をたく祭壇」とした。
- source_word: בַּדָּיו
  choice: その担ぎ棒
  rationale: 幕屋の用具を運ぶために差し込む棒を指すため、単なる「棒」より用途が伝わる表現とした。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 聖別のために人や物に注ぐ儀礼用の油を指す、聖書本文にふさわしい簡潔な表現。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香料を調合した香
  rationale: סַמִּים は芳香性の材料・香料を指す。単に香りがよいことだけでなく、香料から調製された香であることを表した。
- source_word: מָסַךְ הַפֶּתַח
  choice: 入り口の垂れ幕
  rationale: 幕屋の出入り口に掛ける布製の仕切りを指すため、「覆い」や硬質な「仕切り」より具体的な「垂れ幕」とした。
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: 幕屋の入り口の
  rationale: 前の「垂れ幕」との用途・所属関係を自然な日本語の連体修飾で示した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 神の臨在する移動式聖所を指す、出エジプト記で定着した簡潔な訳語。
