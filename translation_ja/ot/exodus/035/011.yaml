translation:
  language: ja
  text: 幕屋とその天幕、その覆い、その留め金、その板[a]、その横木、その柱とその台座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「板」は「枠」とも訳せる。この語を無垢の板ではなく、枠状の構造材と理解する場合がある。
    reason: lexical_alternative
  - marker: b
