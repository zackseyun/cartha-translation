    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 聖所の文脈で、イスラエルのただ中に置かれる主の聖なる住まいを指す定着した訳語。
- source_word: אָהֳלוֹ
  choice: その天幕
  rationale: 幕屋に属する天幕部分を指す。הַמִּשְׁכָּןとの区別を保つ。
- source_word: מִכְסֵהוּ
  choice: 覆い
  rationale: 材質や層を本文以上に限定せず、保護する覆いを自然に表す。
- source_word: קְרָסָיו
  choice: 留め金
  rationale: 幕をつなぎ合わせる接続具の機能を、現代日本語で分かりやすく表す。
- source_word: קְרָשָׁיו
  choice: 板
  rationale: 幕屋を構成する木製部材を指す基本的な訳。枠状の部材だった可能性は脚注に残す。
- source_word: בְּרִיחָיו
  choice: 横木
  rationale: 板を横方向につなぎ支える部材であることを明確にし、日本語の建築語として自然に表す。
- source_word: עַמֻּדָיו
  choice: 柱
  rationale: 直立して支える構造材を表す、明瞭で格調を損なわない語。
- source_word: אֲדָנָיו
  choice: 台座
  rationale: 柱や板を受けて支える基部を自然に表す。受け口としての形状を強調する訳は脚注に示す。
