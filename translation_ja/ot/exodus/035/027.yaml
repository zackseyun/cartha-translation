  text: וְ/הַ/נְּשִׂאִ֣ם הֵבִ֔יאוּ אֵ֚ת אַבְנֵ֣י הַ/שֹּׁ֔הַם וְ/אֵ֖ת אַבְנֵ֣י הַ/מִּלֻּאִ֑ים לָ/אֵפ֖וֹד וְ/לַ/חֹֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: ja
  text: また、指導者たちは、エフォドと胸当てのために、縞めのう[a]と、はめ込み用の宝石を持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ショハム石」とも訳せる。どの宝石を指すかは確定していないが、「縞めのう」は伝統的な訳である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: また、指導者たちは
  rationale: נְשִׂיאִיםは共同体の長たちを指す。王族を連想させる「君たち」より、現代日本語で明瞭な「指導者たち」とした。接続詞וְは文脈上「また」とした。
- source_word: הֵבִיאוּ
  choice: 持って来た
  rationale: בואのヒフィル形はここでは、幕屋建設のための品を携えて来ることを表す。自然で直接的な表現を採った。
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: 縞めのう[a]
  rationale: שֹׁהַםの鉱物同定には不確実性があるが、祭司装束の文脈で伝統的かつ通用性の高い訳語を本文に置き、異同を脚注で示した。日本語では「オニキス」より聖書用語として定着した「縞めのう」を選んだ。
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: はめ込み用の宝石
  rationale: מִלֻּאִיםは装身具にはめ込まれる石、またはその据え付けに関わる語である。「満たしの石」という逐語訳を避け、用途が明確になるよう訳した。
- source_word: לָאֵפֹד
  choice: エフォドのために
  rationale: אֵפֹדに厳密に対応する日本語の衣服名はないため、定着した音写「エフォド」を用いた。前置詞לは用途を表す「ために」とした。
- source_word: וְלַחֹשֶׁן
  choice: 胸当てのために
  rationale: חֹשֶׁןはエフォドに取り付ける祭司の胸部装具を指し、防具ではない。「胸当て」は自然で、軍事的な「胸甲」より誤解が少ない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、幕屋と祭司装束に関する用語の品位を保った。「エフォド」は説明的に置き換えず、定着した聖書用語を維持した。語順は日本語として自然になるよう、用途を先に、持参した品々を後に配置した。
