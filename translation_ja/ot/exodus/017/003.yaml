source:
  edition: WLC
  text: וַ/יִּצְמָ֨א שָׁ֤ם הָ/עָם֙ לַ/מַּ֔יִם וַ/יָּ֥לֶן הָ/עָ֖ם עַל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר לָ֤/מָּה זֶּה֙ הֶעֱלִיתָ֣/נוּ מִ/מִּצְרַ֔יִם לְ/הָמִ֥ית אֹתִ֛/י וְ/אֶת בָּנַ֥/י וְ/אֶת מִקְנַ֖/י בַּ/צָּמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: ja
  text: そこで民は水を求めて渇き、民はモーセに不平を言って、言った。「いったいなぜ、あなたは私たちをエジプトから連れ上げたのか。私と私の子どもたちと私の家畜を、渇きで死なせるためなのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... לַמַּיִם
  choice: 水に渇き
  rationale: 民が水を必要として渇いたという原文の簡潔な表現を、自然な日本語で保持した。
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: モーセに不平を言った
  rationale: לוּן はここでは指導者に対する不平・抗議を表すため、「つぶやいた」より意味が明瞭な表現とした。
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: いったいなぜ、あなたは私たちを……連れ上ったのか
  rationale: לָמָּה זֶּה の強い詰問を「いったいなぜ」で表し、エジプトからの移動に用いられる「上る」の方向表現も残した。
- source_word: מִקְנַי
  choice: 家畜
  rationale: 所有される牧畜動物の総称として、現代日本語で簡潔かつ正確な語を選んだ。
- source_word: בַּצָּמָא
  choice: 渇きで
  rationale: 死の原因・手段を示す前置詞 ב を直接的に表現した。
theological_decisions:
- issue: 複数の民を受ける一人称単数形「私／私の」の保持
  choice: 私と私の子どもたちと家畜
  alternative: 私たちと、私たちの子どもたちや家畜
  rationale: 原文は民全体が語りながら אֹתִי、בָנַי、מִקְנַי と単数形を用いる。集合体を一人の話者のように表す修辞を平準化せず、その緊張を保持した。
- issue: 目的を表す לְהָמִית の解釈
  choice: 死なせるためなのか
  alternative: 死なせようというのか
  rationale: 民がモーセの意図を非難する目的表現をそのまま保ち、実際の神学的意図について本文以上の判断を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、詰問の激しさと、集合的な民が一人称単数で語る原文上の特徴を保持した。「連れ上った」はやや直訳的だが、出エジプトを語る定型的な方向表現を尊重している。
