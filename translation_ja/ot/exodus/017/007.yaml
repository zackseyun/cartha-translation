source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: ja
  text: 彼はその場所をマサ、またメリバと名づけた。[a] イスラエルの人々が争い、また「ヤハウェは私たちのただ中におられるのか、おられないのか」と言って、ヤハウェを試したからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マサ」は「試み」と、「メリバ」は「争い」「言い争い」と響き合う名である。
    reason: 二つの地名と、この節の命名理由を結ぶヘブライ語の語呂合わせを示すため。
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: 彼はその場所を…と名づけた
  rationale: 「その場所の名を…と呼んだ」というヘブライ語の命名表現を、意味を保ちつつ自然な現代日本語にした。主語は直前の文脈のモーセを受けるが、原文どおり代名詞にとどめた。
- source_word: מַסָּה וּמְרִיבָה
  choice: マサ、またメリバ
  rationale: 地名として音写し、語義と後続する「試す」「争う」との語呂合わせは脚注で示した。
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々が争い
  rationale: בְּנֵי יִשְׂרָאֵל は共同体全体を指す定型表現なので、現代日本語で自然かつ包括的な「イスラエルの人々」とした。רִיב はここでは争い・言い争いを表す。
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: ヤハウェを試した
  rationale: נסה のピエル形が示す「試す、試みにかける」を直接的に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: ヤハウェは私たちのただ中におられるのか、おられないのか
  rationale: בְּקִרְבֵּנוּ を共同体内部における臨在を表す「私たちのただ中に」とし、אִם אָיִן の二者択一的な問いを明示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を用いていることを明確にし、称号への置換を避けた。
- issue: 「ヤハウェがただ中にいる」という問いの性質
  choice: 臨在についての民の問いを、そのまま疑問文として保持した
  alternative: ヤハウェが助けてくださるかどうか
  rationale: 文脈上は救援への疑念を含みうるが、原文は神の臨在そのものを問うため、その神学的な緊張を説明的に狭めなかった。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的表現
  choice: イスラエルの人々
  alternative: イスラエルの息子たち
  rationale: この慣用句は男女を含む民全体を指す。字面的な男性表現より、原文の指示対象を明瞭に伝える訳を採った。
translation_notes:
  register: 平明で格調ある現代標準日本語。命名理由を一続きの因果文として読みやすくしつつ、「マサ／試す」「メリバ／争う」の対応と、ヤハウェの臨在をめぐる鋭い問いを保持した。
