source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: ja
  text: イスラエルの人々の全会衆は、シンの荒野を出発し、行程ごとに進み[a]、ヤハウェの命令に従って[b]、レフィディムに宿営した。しかし、民の飲み水はなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼らの行程に従って」。宿営を解きながら、段階を追って旅を進めたことを表す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では字義的に「ヤハウェの口に従って」。ここでは、ヤハウェの命令または指示に従うという意味の慣用表現。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出発し
  rationale: נסעは移動のために宿営を解いて旅立つことを表す。現代日本語として自然な「出発する」を用いた。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々の全会衆
  rationale: עֵדָהの共同体・集会としてのまとまりを「全会衆」で保ち、בְּנֵי יִשְׂרָאֵלは日本語で性別を不必要に限定しない自然な表現とした。
- source_word: מִמִּדְבַּר סִין
  choice: シンの荒野を
  rationale: מִדְבָּרを五書の旅物語にふさわしい「荒野」とし、地名סִיןは「シン」と音写した。起点を示すמִןは「荒野を出発し」によって表した。
- source_word: לְמַסְעֵיהֶם
  choice: 旅程に従って宿営地を一つずつ移り
  rationale: מַסָּעは旅の行程・各区間、また宿営を解いて進む段階を指す。単なる連続移動ではなく、定められた行程を段階的に進んだ意味を明示した。
- source_word: עַל פִּי יְהוָה
  choice: ヤハウェの命令に従って
  rationale: עַל־פִּיは字義的には「口に従って」だが、権威ある命令・指示に従うという慣用句である。神名は称号に置き換えず「ヤハウェ」とした。
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: レフィディムに宿営した
  rationale: חנהは宿営することを表し、רְפִידִיםは地名として「レフィディム」と音写した。
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: しかし、民が飲む水はなかった
  rationale: וְは到着後に生じた問題との対照を踏まえて「しかし」とした。לִשְׁתֹּת הָעָםは飲み手が民であることを自然な日本語で示した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名יהוהを用いているため、称号に置き換えず、一般的な学術的復元に基づく「ヤハウェ」と音写した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。旅程と神の命令という二つの「従って」が修飾関係を失わないよう語順を整えた。英語相談訳の脚注位置と内容には不整合があるため、ヘブライ語本文に即して脚注を再配置・再作成した。
