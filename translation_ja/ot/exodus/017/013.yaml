  text: וַ/יַּחֲלֹ֧שׁ יְהוֹשֻׁ֛עַ אֶת עֲמָלֵ֥ק וְ/אֶת עַמּ֖/וֹ לְ/פִי חָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/013.yaml
  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: ja
  text: こうしてヨシュアは、アマレクとその民を剣で打ち破った[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「弱らせた」または「圧倒した」とも訳せる。ここで用いられているヘブライ語の動詞には、相手を弱めて優勢になるという意味合いがある。
    reason: lexical_ambiguity
  - marker: b
    text: より直訳的には「剣の刃によって」。ヘブライ語では字義的に「剣の口によって」とあり、武器を用いた戦闘による敗北を表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: 打ち破った
  rationale: この動詞は「弱らせる」「圧倒する」を意味し得る。戦闘の結果を述べる文脈では「打ち破った」が自然であり、全滅させたという意味までは含めずに、相手を弱めて勝利したことを表せる。語義の幅は脚注に残した。
- source_word: יְהוֹשֻׁעַ
  choice: ヨシュア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: עֲמָלֵק
  choice: アマレク
  rationale: 祖先名であると同時に、ここではその名に代表される勢力を指す固有名として、日本語で定着した表記を保った。
- source_word: עַמּוֹ
  choice: その民
  rationale: עַם の基本義「民」を直接反映した。戦闘の文脈では実際には戦士たちを指す可能性が高いが、「軍勢」と限定せず原文の表現を保った。
- source_word: לְפִי חָרֶב
  choice: 剣で
  rationale: 字義的には「剣の口によって」というヘブライ語の慣用句で、剣を用いた戦闘による敗北を表す。本文では明瞭で自然な「剣で」とし、字義と形式的な訳を脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、物語文にふさわしい簡潔で品位ある調子を保った。冒頭の接続形は文脈上の展開を自然に示す「こうして」で表した。
