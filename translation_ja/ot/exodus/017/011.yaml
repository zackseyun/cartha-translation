  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: ja
  text: モーセが手を上げるたびに[a]、イスラエルが優勢になり、手を下ろすたびに[b]、アマレクが優勢になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「モーセが手を上げるとき」。この構文は、戦いの間に繰り返された状況を表していると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「下ろす」と訳した語には、「休ませる」「置く」という意味もある。ここでは「手を上げる」との対照から「下ろす」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: ～ている間は／～と
  rationale: 戦いの最中に繰り返された状況を表す構文として理解し、現代日本語で反復的な条件と対照が自然に伝わる形にした。
- source_word: יָרִים
  choice: 上げている
  rationale: רום のヒフィルは「上げる」。単に動作の開始だけでなく、次節の文脈から手が上がった状態が続く間の戦況を自然に示す表現とした。
- source_word: יָדוֹ
  choice: 手
  rationale: 原語 יָד の基本義を保ち、「腕」と意訳しなかった。単数形も維持した。
- source_word: וְגָבַר
  choice: 優勢になり／優勢になった
  rationale: גבר は「強くなる、勝る、優勢になる」の意。最終的な勝利や完全な打倒を意味させず、戦況が有利になったことを表した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 民の名称として標準的な日本語表記を用いた。
- source_word: יָנִיחַ
  choice: 下ろす
  rationale: נוח のヒフィルには「休ませる、置く」の語義もあるが、直前の「手を上げる」との対照から、ここでは「下ろす」が自然である。
- source_word: עֲמָלֵק
  choice: アマレク
  rationale: 民族名として標準的な日本語表記を用いた。
