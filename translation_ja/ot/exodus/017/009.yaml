source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: ja
  text: モーセはヨシュアに言った。「私たちのために男たちを選び、出て行って、アマレクと戦いなさい。明日、私は神の杖を手に持ち、丘の頂に立つ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める標準的なワイイクトール形。日本語では不自然な接続詞を補わず、「言った」とすることで自然な叙述の流れを保つ。
- source_word: יְהוֹשֻׁעַ
  choice: ヨシュア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: 私たちのために男たちを選び
  rationale: בחרの「選ぶ」とלנוの「私たちのために」を明示した。אנשיםはこの軍事的文脈では戦う成人男性を指すため、「男たち」とした。
- source_word: וְצֵא
  choice: 出て行って
  rationale: יצאの基本義「出て行く」を保ち、戦いに赴く動きを自然な日本語で表した。
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: アマレクと戦いなさい
  rationale: לחםのニファル命令形を軍事的文脈に即して「戦いなさい」とした。日本語では敵対者を「と」で示すのが自然である。
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: 明日、私は…立つ
  rationale: 分詞נצבは「明日」によって未来の意味を帯びるが、日本語の非過去形「立つ」が自然に未来を表す。
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: 丘の頂に
  rationale: ראשは字義的には「頭」だが、地形については「頂」を意味する慣用表現である。
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: 神の杖を手に持ち
  rationale: 動詞のない句をモーセが立つ際の状態として自然に結び付けた。「神の杖」という構成関係と「私の手に」という具体像を保つ。
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים における הָאֱלֹהִים の訳
  choice: 神の杖
  alternative: 神が授けた杖
  rationale: 原文の構成句をそのまま保ち、杖の由来や所有関係について原文以上の説明を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。命令の強さと軍事的文脈を保ちつつ、ヘブライ語の語順を機械的に写さず自然な日本語に整えた。
