source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: ja
  text: そこでモーセはヤハウェに向かって叫んだ。「私はこの民をどうすればよいのでしょう。もう少しすれば[a]、彼らは私を石打ちにするでしょう！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「なお少しすれば、彼らは私を石打ちにする」。脅威が目前に迫っていることを表す。
    reason: 原文の慣用的な切迫表現と、その字義的な形を示すため。
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 叫んだ
  rationale: צעקは、単に呼びかけることではなく、苦境の中で助けを求めて強く叫ぶことを表す。モーセの切迫した訴えを簡潔に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に記された神の固有名である四文字神名を、称号に置き換えず音写する。
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: 私はこの民をどうすればよいのでしょう
  rationale: לを伴うעשהは、ここではこの民にどう対処すべきかを問う表現。現代日本語として自然にしつつ、モーセの切迫した自問を保つ。
- source_word: עֹד מְעַט
  choice: もう少しすれば
  rationale: 字義的には「なお少し」で、危険が間近に迫っていることを示す。後続する石打ちが目前であるという意味を自然な日本語で表した。
- source_word: וּסְקָלֻנִי
  choice: 彼らは私を石打ちにするでしょう
  rationale: סקלの通常の意味である、石を投げつけて殺そうとする行為を「石打ち」とした。ここではעֹד מְעַטに続き、間近に予想される結果を表すため「でしょう」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として「ヤハウェ」と音写し、本文上の区別を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、モーセの切迫感と神への訴えを保った。「どうすればよいのでしょう」は敬意ある祈りの語調として自然でありながら、過度に古風にはしていない。
