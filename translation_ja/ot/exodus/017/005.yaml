base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「民の先に進み、イスラエルの長老たちの中から何人かをあなたと共に連れて行きなさい。あなたがナイル川[a]を打ったあなたの杖を手に取り、行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は一般に「川」を意味し得る語。しかし出エジプト記のエジプトの文脈では、ナイル川を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書として自然で荘重な慣用に従い、神の固有名を示す四文字語を「主」とした。
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: 民の前を通り
  rationale: עברの移動の意味と、לִפְנֵי הָעָםの空間的表現を保ち、「先に行く」と解釈し切らない訳とした。
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: イスラエルの長老たちのうち何人かを連れて行きなさい
  rationale: מןの部分・選択の意味を自然な日本語で明示した。
- source_word: וּמַטְּךָ
  choice: あの杖
  rationale: מַטֶּהを文脈に適した「杖」とし、後続する関係節で特定されることを「あの」で自然に示した。
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: あなたがナイル川を打った
  rationale: בּוֹの道具用法は日本語では修飾先の「杖」によって明らかになる。יְאֹרは出エジプト記のエジプト文脈でナイル川を指す。
- source_word: קַח בְּיָדְךָ
  choice: 手に取り
  rationale: 反復されるקחと「手に」の表現を簡潔で自然な命令の連続として訳した。
- source_word: וְהָלָכְתָּ
  choice: 行きなさい
  rationale: 完了形に接続詞が付いた命令的継続として、単純な命令に訳した。
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める定型句を自然な日本語とし、神に対する敬意を表す尊敬形を用いた。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 現代日本語で広く理解される聖書的な代称を用いた。ただし原文が称号ではなく神名יהוהである点は翻訳上の重要事項である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔で荘重な調子を保った。原文の命令の連続と、長老の一部を選ぶ部分構文を明確にした。
