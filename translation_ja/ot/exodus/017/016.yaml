  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: ja
  text: 彼は言った。「手がヤハの王座の上にある[a]。ヤハウェは世代から世代へ、アマレクと戦う。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は省略が多く、意味を確定しにくい。直訳は「手がヤハの王座の上にある」。また、「手がヤハの王座に敵対している」とも理解できる。可能性は低いが、「王座」に当たる語を「旗」と取る解釈もある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: 物語を継続する標準的なワウ継続法で、主語は三人称男性単数。本文が名を再提示していないため「彼」とする。
- source_word: כִּי
  choice: 訳文には明示せず、直接話法を導入
  rationale: 発言内容を導く語と理解できるが、後続節が省略的で難解なため、「なぜなら」などを補って統語関係を限定しない。
- source_word: יָד
  choice: 手
  rationale: 冠詞がなく、所有者も示されていない。日本語では不自然な「一つの手」を避けつつ、誰の手かを補わない。
- source_word: עַל
  choice: 上に
  rationale: 基本義の「上に」を保ち、「敵対して」という解釈は本文に織り込まず脚注に示す。
- source_word: כֵּס
  choice: 王座
  rationale: 異例の形だが、通常はכִּסֵּא「王座」の短縮形または欠 defective spelling と理解される。「旗」は語彙的に可能性が低い。
- source_word: יָהּ
  choice: ヤハ
  rationale: 短縮形の神名を、完全形יהוהと区別して音写する。
- source_word: מִלְחָמָה לַיהוָה
  choice: ヤハウェは……戦われる
  rationale: 動詞のない名詞節が表す、ヤハウェに属する継続的な戦いを自然な日本語にする。文脈上の将来的・継続的含意を保つ。
- source_word: בַּעֲמָלֵק
  choice: アマレクと
  rationale: 戦争の文脈でבは敵対する相手を示す。「戦う」と組み合わせた「アマレクと」が自然である。
- source_word: מִדֹּר דֹּר
  choice: 代々にわたって
  rationale: 世代から世代へ継続することを表す慣用句を、明瞭で自然な現代日本語にする。
theological_decisions:
- issue: 同じ節に現れるיָהּとיהוהの訳し分け
  choice: それぞれ「ヤハ」「ヤハウェ」とする
  alternative: 両方を「主」とする、または双方の違いを示さない
  rationale: 原文が短縮形と四文字神名を使い分けていることを保ち、同一節内の語形上の対照を明示する。
- issue: כִּי יָד עַל כֵּס יָהּという省略的で難解な句
  choice: 「手がヤハの王座の上にある」と保守的に訳し、別解を脚注に置く
  alternative: 「手がヤハの王座に敵対している」または「手がヤハの旗の上にある」
  rationale: 誰の手か、עַלが位置か敵対か、כֵּסが王座か旗かについて原文が明確でないため、本文で解釈を確定せず、真正な曖昧さを保持する。
- issue: מִלְחָמָה לַיהוָהの名詞節
  choice: 「ヤハウェは……戦われる」
  alternative: 「戦いはヤハウェのもの」「ヤハウェには戦いがある」
  rationale: 直訳的な名詞表現の関係性を、文脈に即して自然な日本語の継続的行為として表す。ただし戦いの主体がヤハウェである点以上の神学的説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神名と難解な省略表現には原文の荘重さを残した。「戦われる」は神に対する敬意を自然に示す一方、過度に古風な文語表現は避けた。
