  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַ/יִּקְרָ֥א שְׁמ֖/וֹ יְהוָ֥ה נִסִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: ja
  text: モーセは祭壇を築き、それを「ヤハウェは私の旗」と名づけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「ヤハウェ、私の旗」。ここでいう「旗」は、人々がそのもとに集まる旗印や目印を意味し、イスラエルの勝利がヤハウェによることを表していると考えられる。
    reason: 原語の簡潔な祭壇名と「旗」の比喩的含意を示すため。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 築き
  rationale: בנהの具体的な建造行為を表し、祭壇との自然な結びつきを保つ。
- source_word: מִזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲や礼拝に用いる場所を指す標準的な訳語。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: それを…と名づけた
  rationale: 直訳は「その名を呼んだ」だが、現代日本語では命名の意味を明確かつ自然に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: נִסִּי
  choice: 私の旗
  rationale: נֵסは人々を集める目印となる旗・旗印を指す。接尾辞一人称単数を「私の」と訳し、名詞文に必要な「は」を補った。
theological_decisions:
- issue: 祭壇名に含まれる神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を直接用いているため、固有名として示す。
- issue: יְהוָה נִסִּי の名詞文の理解
  choice: ヤハウェは私の旗
  alternative: ヤハウェ、私の旗
  rationale: ヘブライ語には連結辞が明示されないため、日本語として自然な判断文になるよう「は」を補う。ただし「旗」が結集の目印や勝利の旗印を含意する比喩であることは注で示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「その名を呼んだ」という不自然な逐語訳は避けつつ、祭壇に神学的な名を付ける命名行為を保持した。
