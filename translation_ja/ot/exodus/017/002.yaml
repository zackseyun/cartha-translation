source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: ja
  text: そこで民はモーセと言い争い、「私たちが飲めるように、水を与えよ」と言った。モーセは彼らに言った。「なぜ私と言い争うのか。なぜヤハウェを試すのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶב הָעָם עִם מֹשֶׁה
  choice: 民はモーセと言い争い
  rationale: ריב の争論・対立の力を「言い争う」で自然に表し、עִם は日本語の「と」によって相手との対立を示した。הָעָם に「イスラエル」を補わず、原文どおり「民」とした。
- source_word: תְּנוּ לָנוּ מַיִם
  choice: 私たちに、飲む水を与えよ
  rationale: 命令形 נתן と間接目的語を率直に訳した。後続の וְנִשְׁתֶּה を日本語では水を修飾する形にまとめ、要求の意味を明瞭かつ簡潔にした。
- source_word: וְנִשְׁתֶּה
  choice: 飲む水
  rationale: コホータティブが命令に続いて目的を表すため、「私たちが飲めるように」という意味を自然な日本語の「飲む水」に凝縮した。
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: なぜ私と言い争うのか
  rationale: מַה を叱責における「なぜ」とし、冒頭と同じ「言い争う」を反復して ריב の語のつながりを保った。
- source_word: מַה תְּנַסּוּן אֶת־יְהוָה
  choice: なぜヤハウェを試すのか
  rationale: נסה のピエルを「試す」と訳し、神の臨在と備えを試験にかけるという厳しい含意を弱めずに残した。神名 יהוה は固有名として「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に固有の契約名が明記されているため、それを称号へ置き換えず音写した。
- issue: 民の行為を נסה と呼ぶことの神学的な力
  choice: ヤハウェを試す
  alternative: ヤハウェを試みにかける
  rationale: 簡潔な「試す」で、民がモーセと争うことがヤハウェへの挑戦でもあるという本文の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令とモーセの二重の問いの厳しい調子を保った。「与えよ」は要求の強さに合う簡潔で格調ある命令表現。
