  text: וִ/ידֵ֤י מֹשֶׁה֙ כְּבֵדִ֔ים וַ/יִּקְחוּ אֶ֛בֶן וַ/יָּשִׂ֥ימוּ תַחְתָּ֖י/ו וַ/יֵּ֣שֶׁב עָלֶ֑י/הָ וְ/אַהֲרֹ֨ן וְ/ח֜וּר תָּֽמְכ֣וּ בְ/יָדָ֗י/ו מִ/זֶּ֤ה אֶחָד֙ וּ/מִ/זֶּ֣ה אֶחָ֔ד וַ/יְהִ֥י יָדָ֛י/ו אֱמוּנָ֖ה עַד בֹּ֥א הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: ja
  text: しかし、モーセの両手は重くなっていた。そこで彼らは石を取って彼の下に置き、彼はその上に座った。アロンとフルは、一人が片側から、もう一人が反対側から、モーセの両手を支えた。こうして、その両手は日が沈むまで安定していた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「安定していた」と訳したヘブライ語は、「堅固であった」「揺るがなかった」とも訳せる。また、「忠実さ」を表すこともあるが、ここでは支えられたモーセの両手が物理的に安定していたことを指す。
    reason: אֱמוּנָהの語義の幅を示しつつ、この箇所での身体的・文脈的意味を明確にするため。
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה
  choice: モーセの両手
  rationale: יָדの複数形を具体的に保ち、日本語で自然な「両手」とした。文脈上「腕」とも表現できるが、原文で繰り返される「手」のイメージを維持した。
- source_word: כְּבֵדִים
  choice: 重くなっていた
  rationale: 「重い」という原文の具体的表現を保ちつつ、疲労によってその状態に至っていたという文脈を自然な日本語で示した。
- source_word: וַיִּקְחוּ
  choice: 彼らは石を取って
  rationale: 三人称複数をそのまま「彼ら」とし、原文が明示していない行為者をアロンとフルだけに限定しなかった。
- source_word: אֶבֶן
  choice: 石
  rationale: 座るために下へ置かれた物を指す一般的な語として、אֶבֶןの通常の意味を採った。
- source_word: תָּמְכוּ בְיָדָיו
  choice: モーセの両手を支えた
  rationale: תמךの物理的に支える意味を明確に表し、代名詞の連続による曖昧さを避けるため「モーセ」を補った。
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: 一人がこちら側から、もう一人があちら側から
  rationale: 二人が左右からそれぞれ支えたという分配的な構造を自然に表した。
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: その両手は…しっかりしていた
  rationale: אֱמוּנָהの「確かさ、堅固さ、忠実さ」という意味領域を踏まえ、この場面では身体的な安定を示す「しっかりしていた」とした。「上げられていた」は文脈上理解できるが、この句自体には明示されないため本文に加えなかった。
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: 日が沈むまで
  rationale: 直訳的意味を保ちながら、現代日本語で自然な時間表現とした。
theological_decisions:
- issue: モーセの手について用いられた אֱמוּנָה の意味
  choice: 身体的に「しっかりしていた」
  alternative: 「堅く保たれた」「揺るがなかった」「忠実であった」
  rationale: 直前には手の疲労とアロン、フルによる物理的な支えが描かれているため、中心的意味は手の安定と判断した。ただし、אֱמוּנָהが持つ堅固さや忠実さとの語義的な重なりは脚注で残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の簡潔な連続性を優先しつつ、原文の反復される「手」と左右対称の描写を保持した。
