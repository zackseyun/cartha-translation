source:
  edition: WLC
  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: ja
  text: 見よ[a]、わたしはそこで、ホレブの岩の上に、あなたの前に立つ。あなたはその岩を打ちなさい。すると、そこから水が出て、民は飲む。モーセはイスラエルの長老たちの目の前で、そのとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見よ、わたしはそこで、ホレブの岩の上に、あなたの前に立っている」とも訳せる。ヘブライ語の分詞は現在の意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 見よ
  rationale: 神の厳粛な宣言へ注意を向ける提示表現。現代日本語でも聖書本文の品位を保ちつつ理解できる。
- source_word: עֹמֵד
  choice: 立つ
  rationale: 形態上は分詞であり、文脈上は間近に起こる行為を示し得る。日本語の非過去形は現在・未来の両方に開かれており、原文の幅を自然に保てる。
- source_word: לְפָנֶיךָ
  choice: あなたの前に
  rationale: モーセの前方、または面前という位置関係を簡潔に表す。
- source_word: עַל הַצּוּר
  choice: 岩の上で
  rationale: 前置詞 עַל の通常の空間的意味を保ち、神が岩の上に立つという原文の印象的な描写を弱めない。
- source_word: בְּחֹרֵב
  choice: ホレブの
  rationale: 日本語では「ホレブの岩」とすることで場所にある特定の岩を自然に示せる。
- source_word: וְהִכִּיתָ בַצּוּר
  choice: あなたはその岩を打ちなさい
  rationale: 指示文脈における命令的な力を明確にし、動詞の強さを「打つ」で表す。
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: すると、そこから水が出て
  rationale: 岩を打つことに続く結果を自然に示しつつ、「流れ出る」など原文に明示されない様態は加えない。
- source_word: וְשָׁתָה הָעָם
  choice: 民は飲むことができる
  rationale: 水が出る結果として民が飲めるようになることを自然な日本語で示す。目的だけに限定せず、結果の流れを保つ。
- source_word: וַיַּעַשׂ כֵּן
  choice: そのとおりにした
  rationale: ヘブライ語の定型的な実行報告を明瞭で自然な日本語にする。
- source_word: לְעֵינֵי
  choice: 目の前で
  rationale: イスラエルの長老たちが公に目撃したことを、原文の「目」を生かして自然に表す。
theological_decisions:
- issue: 神の自己提示に用いられた分詞の時制的含み
  choice: わたしは……立つ
  alternative: わたしは……立っている／わたしは……立とう
  rationale: עֹמֵד は形態上分詞で、現在の状態にも間近な未来にも解し得る。日本語の「立つ」はこの場面で未来を自然に示しながら、現在的な含みも完全には排除しない。脚注で現在訳の可能性を明示する。
- issue: 「あなたの前に」と「岩の上で」の関係
  choice: 神がホレブの岩の上でモーセの前に立つ
  alternative: 神がモーセの前、ホレブの岩のそばに立つ
  rationale: 統語上、עַל הַצּוּר は神が立つ位置を示すと読むのが自然である。印象的な描写を比喩化したり、「そば」と弱めたりしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の発言には簡潔で厳かな調子を保った。「民」「長老」は聖書文脈で広く理解される語として採用した。
