  text: その時、アマレクがやって来て、レフィディムでイスラエルと戦った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルに対して戦った」。ヘブライ語の前置詞は直訳すると「～と」だが、戦闘の文脈では敵対する相手を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: その時、…がやって来て
  rationale: 物語を進めるワウ連続法を、直前の出来事に続く展開として自然な現代日本語で表した。בוא の基本義「来る」は「やって来る」とした。
- source_word: עֲמָלֵק
  choice: アマレク
  rationale: 固有名を慣用的に音写した。文脈上は祖先名によって総称されるアマレク人を指し得るが、原文の単数固有名を保持した。
- source_word: וַיִּלָּחֶם
  choice: 戦った
  rationale: לחם のニファル形がこの文脈で表す「戦う、交戦する」を、簡潔で自然な語にした。
- source_word: עִם
  choice: と
  rationale: 前置詞の基本義「～と」を保持した。戦闘の文脈では相手・敵対関係を表し、日本語の「～と戦う」も自然である。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 民または民族を表す固有名として標準的に音写した。
- source_word: בִּרְפִידִם
  choice: レフィディムで
  rationale: 場所を示す ב を、出来事の行われた地点を表す自然な日本語の助詞「で」で訳した。
