  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「これを記念として書物[a]に書き記し、ヨシュアに聞かせよ[b]。わたしは必ず[c]、アマレクの記憶を天の下から消し去る。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ある書物に」または「その巻物に」とも訳せる。ヘブライ語は定冠詞を伴い、直訳すると「その書物に」。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「ヨシュアの耳に置け」。すなわち、ヨシュアに聞かせよ、または語り聞かせよという意味。
    reason: lexical_alternative
  - marker: c
    text: 「必ず」は、同じ語根の不定詞と動詞を重ねたヘブライ語の強調を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、現代日本語で一般的な音写によって示した。
- source_word: כְּתֹב זֹאת זִכָּרוֹן
  choice: 記念として、このことを…書き記し
  rationale: 命令の直接性と、出来事を後代のために記録するזִכָּרוֹןの目的的な意味を自然な日本語で表した。
- source_word: בַּסֵּפֶר
  choice: その書物
  rationale: 定冠詞を「その」で反映した。「巻物」は当時の媒体を明示する解釈となるため本文では避け、別訳を脚注に示した。
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: ヨシュアの耳に入れよ
  rationale: 直訳的な身体表現を、日本語でも理解できる慣用表現として保持した。単に知らせるだけでなく、確実に聞かせる命令であることを脚注で補った。
- source_word: מָחֹה אֶמְחֶה
  choice: わたしは必ず…消し去る
  rationale: 不定詞絶対形と定動詞の組み合わせが表す強調と確実性を「必ず」で示した。
- source_word: זֵכֶר עֲמָלֵק
  choice: アマレクの記憶
  rationale: זֵכֶרの「記憶・記念」の意味を保ち、前半の「記念」との意図的な対照も伝わるようにした。アマレクが人物・民・共同体のいずれを指すかは本文で限定しなかった。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 天の下から
  rationale: 全地的な範囲を表すヘブライ語の定型表現を、簡潔で格調ある日本語にした。
theological_decisions:
- issue: 神名の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字の神名を用いているため、その区別を保つ音写を採用した。
- issue: アマレクの指示対象
  choice: アマレク
  alternative: アマレク人／アマレク民族
  rationale: 原文は固有名だけを置いており、個人名とそこから出た民を表し得るため、本文では解釈を限定する語を加えなかった。
- issue: 消去の確実性
  choice: 必ず…消し去る
  alternative: 完全に消し去る
  rationale: 原文の構文は行為の程度だけでなく宣言の強い確実性を表し得るため、「必ず」を採用し、神の宣言の力点を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の直接命令にふさわしい簡潔さと威厳を保った。「耳に入れよ」は原文の比喩を残すためやや改まった表現とし、意味を脚注で明確にした。
