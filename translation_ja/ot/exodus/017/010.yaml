base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: ja
  text: そこでヨシュアは、モーセが言ったとおり、アマレク[a]と戦った。モーセとアロンとフルは丘の頂上に登った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「アマレク」。ここでは、アマレクの子孫であるアマレク人を指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: モーセが言ったとおり
  rationale: 直訳的な意味を保ちながら、ヨシュアがモーセの先の指示に従ったことを自然な現代日本語で表す。
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  choice: アマレクと戦った
  rationale: לחםのニファル形を明瞭な「戦う」とし、敵対する相手を日本語で自然な助詞「と」によって示す。本文の固有名「アマレク」は解釈的に「アマレク人」とせず保持する。
- source_word: עָלוּ
  choice: 登った
  rationale: 丘の頂上へ上がる動きを、簡潔で自然な日本語で表す。
- source_word: רֹאשׁ הַגִּבְעָה
  choice: 丘の頂上
  rationale: 字義は「丘の頭」だが、場所を指す自然な日本語の慣用表現を用いる。
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: ヨシュア／モーセ／アロン／フル
  rationale: 日本語聖書で広く定着している人名表記を用いる。
