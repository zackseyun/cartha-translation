  yaml_path: translation/ot/exodus/036/020.yaml
  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: ja
  text: 彼は幕屋のために、アカシア材で、直立させる板を作った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作り
  rationale: 物語を進める連続形。文脈上の主語を「彼」とし、単純な製作を表す自然な日本語にした。
- source_word: הַקְּרָשִׁים
  choice: 板
  rationale: 幕屋を構成する構造材を指す。現代日本語で分かりやすく、過度に具体的な構造を想定しない語を選んだ。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋のために
  rationale: מִשְׁכָּןは出エジプト記における聖なる住まいを指す定着した用語なので、「幕屋」とした。前置詞לは用途を示す「ために」で表した。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材で
  rationale: シッタ材という伝統的音写より、現代の読者に植物と材料が分かりやすい「アカシア材」を採用した。
- source_word: עֹמְדִים
  choice: それらをまっすぐに立てた
  rationale: 男性複数分詞は板の直立した配置を表す。日本語では叙述全体を自然にするため、製作に続く配置として動詞的に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は直前の文脈における製作者を受ける。原文の簡潔な施工記述を保ちつつ、「立っている」という不自然な直訳を避けた。
