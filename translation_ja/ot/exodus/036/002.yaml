source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל בְּצַלְאֵ֘ל וְ/אֶל אָֽהֳלִיאָב֒ וְ/אֶל֙ כָּל אִ֣ישׁ חֲכַם לֵ֔ב אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה חָכְמָ֖ה בְּ/לִבּ֑/וֹ כֹּ֚ל אֲשֶׁ֣ר נְשָׂא֣/וֹ לִבּ֔/וֹ לְ/קָרְבָ֥ה אֶל הַ/מְּלָאכָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: ja
  text: そこでモーセは、ベツァルエルとオホリアブ、および、ヤハウェがその心に知恵を授けたすべての心に知恵のある者[b]、すなわち、その仕事に取りかかってそれを行うために心が彼を奮い立たせた者[a]を、皆呼び寄せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心が彼を奮い立たせた」は、直訳すれば「その心が彼を持ち上げた」。内なる意欲や促しを表すヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「心に知恵のある者」は、知恵や技能を備えていることを表すヘブライ語の表現。ここでは特に幕屋造りに必要な技能を含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せた
  rationale: קרא אל は、特定の務めのために人々を呼ぶことを表す。「呼び寄せた」は現代日本語として自然で、召集の含意も伝える。
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: ベツァルエルとオホリアブ
  rationale: 人名をヘブライ語の発音に沿って音写した。
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: 心に知恵のある人をみな
  rationale: 直訳的な「心の賢い人」では不自然なため、心を知恵や技能の座とするヘブライ語の比喩を保ちつつ明瞭にした。文脈上、職人としての技能も含むが、それだけに限定しない。
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: ヤハウェが心に知恵を授けた
  rationale: 知恵が神から与えられたことと、原文の「心」の表現を保持した。נתן はここでは自然な敬体的語感の「授けた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: 心を動かされた人々
  rationale: 「心が彼を持ち上げた」という原語の慣用句が表す内なる自発的な促しを、自然な日本語で表した。能動的な「志した」よりも、原文の心からの促しを残す。
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: その仕事に携わって
  rationale: 字義は仕事へ「近づく」ことだが、この文脈では仕事に加わり従事することを意味する。「携わって」は目的節とのつながりが自然である。
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: それを行おうと
  rationale: 女性単数代名詞は「仕事」を受ける。「行う」は幕屋建設の一連の作業を広く表せる。意志を示す目的構文として「行おうと」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、その区別を保つ音写を採用した。
- issue: 職人の知恵の由来
  choice: ヤハウェが心に知恵を授けた
  alternative: ヤハウェによって技能を得た
  rationale: 神からの賜物であることを明示しながら、原文の「知恵」と「心」を技能だけに狭めず保持した。
- issue: 仕事に加わる動機
  choice: 心を動かされた
  alternative: 自ら志願した
  rationale: 自発性は伝えるが、単なる自己決定と断定せず、原文が描く内面からの促しという含みを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で前文からの展開を示し、長い原文を二文に分けて理解しやすくした。ヘブライ語の「心」という重要な比喩は本文に残し、慣用句の字義と含意を脚注で補った。
