base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: ja
  text: 枠板[a]は八枚で、その銀の台座[b]は十六個、すなわち各枠板の下に二個ずつであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「板」。ヘブライ語は、幕屋を構成する直立した構造部材を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「受け台」。枠板を下から支える銀製の基部を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: …は…であった
  rationale: 構造部材とその数量を列挙する文脈に合わせ、接続詞を不自然に逐語化せず、現代日本語の叙述として表した。
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: 枠板
  rationale: 幕屋を構成する直立した部材を指す語であるため、「板」だけより構造上の役割が伝わり、かつ「枠」だけより具体性のある「枠板」とした。
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: 台座
  rationale: 枠板の下で支える銀製の基部ないし受けを指す。一般読者に明瞭な「台座」を採用し、より構造的な「受け台」の可能性は脚注に示した。
- source_word: כֶּסֶף
  choice: 銀の
  rationale: 台座の材質を示す語として、そのまま明瞭に表した。
- source_word: שִׁשָּׁה עָשָׂר
  choice: 十六個
  rationale: 台座の数量を、現代日本語で自然な助数詞とともに示した。
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: 一枚の枠板の下に二個ずつ
  rationale: ヘブライ語は「二つの台座、二つの台座」と反復して各枠板への配分を表す。日本語では「二個ずつ」とすることで、その分配的な意味を簡潔かつ明確に保った。
- source_word: תַּחַת
  choice: 下に
  rationale: 建築構造における位置関係を自然で直接的な日本語で表した。
