  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: ja
  text: そこでモーセは命じ、彼らは宿営の中に次のような告知を行き渡らせた[a]。「男も女も、聖所への奉納物[b]のために、これ以上仕事をしてはならない。」こうして民は、それ以上持って来ることを差し止められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「宿営の中に声を通らせて」。公の知らせを宿営全体に伝えたことを表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: 「聖所への奉納物」は、「聖なる奉納物」または「聖所のためのささげ物」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じ
  rationale: צוהの権威ある指示という力を保ち、物語文として簡潔で自然な表現とした。
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: 告知を行き渡らせて
  rationale: 直訳的には「声を通らせる」という使役表現であり、宿営全体に公の知らせを伝達したことを自然な日本語で示した。
- source_word: בַּמַּחֲנֶה
  choice: 宿営中に
  rationale: 前置詞の基本的な意味「中で」を保ちつつ、告知が宿営全体に及んだ文脈を「宿営中」で表した。
- source_word: אִישׁ וְאִשָּׁה
  choice: 男も女も
  rationale: 男女を明示する原文を保ち、禁止文に自然に続く日本語とした。
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: これ以上仕事をしてはならない
  rationale: מְלָאכָהの「仕事・作業」という広がりを保ち、幕屋のための制作だけに狭く限定しなかった。
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: 聖所への奉納物のために
  rationale: תְּרוּמָהを聖なる用途のために取り分けて差し出す物として「奉納物」とし、הַקֹּדֶשׁは文脈上の聖所を指すものとして訳した。別の構文理解も脚注に示した。
- source_word: וַיִּכָּלֵא
  choice: 差し止められた
  rationale: כלאのニファル形が表す受動的な抑止・制止を保ち、民が不承不承だったとは含意しない表現を選んだ。
- source_word: מֵהָבִיא
  choice: それ以上持って来ること
  rationale: מן＋不定詞の「その行為を妨げる」という構文を反映し、文脈から追加の奉納物を持参することだと明示した。
theological_decisions:
- issue: הַקֹּדֶשׁが奉納物の性質を示すか、奉納先である聖所を示すか
  choice: 「聖所への奉納物」
  alternative: 「聖なる奉納物」
  rationale: 幕屋建設のための献納という直近の文脈には「聖所への」がよく合うが、ヘブライ語の連語には「聖なる奉納物」と取る余地もあるため、脚注で残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令と公的告知の厳粛さを保った。「奉納物」は宗派固有の用語を避けつつ、聖なる目的のために取り分けて差し出す物を表す語として採用した。
