revisions:
- from: そこでモーセは命じ、宿営中に告知を行き渡らせて[a]、こう言わせた。「男も女も、聖所への奉納物[b]のために、これ以上仕事をしてはならない。」こうして民は、それ以上持って来ることを差し止められた。
  to: そこでモーセは命じ、彼らは宿営の中に次のような告知を行き渡らせた[a]。「男も女も、聖所への奉納物[b]のために、これ以上仕事をしてはならない。」こうして民は、それ以上持って来ることを差し止められた。
  rationale: 告知の内容を導く箇所を、「告知を行き渡らせて、こう言わせた」から「次のような告知を行き渡らせた」に改めました。これにより、ヘブライ語の公的告知の慣用表現と、その後に続く引用との関係を自然に表せます。その他の訳文と脚注は原文の意味と許容される構文上の幅を保っているため維持しました。
