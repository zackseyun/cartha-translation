    rationale: ヘブライ語は「幕屋を、十枚の幕として／すなわち十枚の幕を」として作ったと述べる。幕は完成した幕屋の構成要素であり、別に完成した幕を用いて幕屋を作ったという工程を明示してはいない。
  - severity: medium
    issue: 節末の単数動詞の対象と動作が「ケルビムを織り出し、それらの幕を仕立てた」に分割されている
    rationale: 原文の「巧みな意匠によるケルビムを織り出して、それらを造った」という関係を、より直接に保つべきである。現行訳の「仕立てた」は可能な語ではあるが、原文の一般的な「造った」を狭める。
