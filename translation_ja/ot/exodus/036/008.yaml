source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ כָל חֲכַם לֵ֜ב בְּ/עֹשֵׂ֧י הַ/מְּלָאכָ֛ה אֶת הַ/מִּשְׁכָּ֖ן עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב עָשָׂ֥ה אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: ja
  text: 仕事に携わる、心に知恵のある者たちは皆[a]、幕屋を、撚り合わせた上質の亜麻糸、青、紫、緋色の糸から成る十枚の幕として造った。彼は、それらに巧みな意匠でケルビムを織り出して造った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心に知恵のある」はヘブライ語の直訳。この文脈では、工芸の知恵と技能を備えた職人を意味する。
    reason: lexical_alternative
  - marker: b
    text: この節は初めに複数形の動詞を用いるが、ヘブライ語本文の最後の動詞は単数形で、「彼はそれらを造った」となる。訳によっては「彼らはそれらを造った」と整える。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: 心に知恵のある者
  rationale: 直訳的な比喩表現を保ちつつ、この文脈では工芸の技能を授けられた職人を指すことが脚注で分かるようにした。
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: 仕事に携わる者たちのうち
  rationale: 前置詞が示す集団内の所属関係と、分詞が示す継続的な従事を自然な日本語で表した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所建築を指す、日本語聖書で定着した明確な訳語。
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋を構成する大きな布製の覆いを簡潔かつ自然に示す。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻素材と、מָשְׁזָרの撚り合わせた加工をともに明示した。
- source_word: תְכֵלֶת
  choice: 青の糸
  rationale: 高価な青色染料で染めた繊維素材を指すため、文脈上補われる「糸」を明示した。
- source_word: אַרְגָּמָן
  choice: 紫の糸
  rationale: 幕屋の織物に用いる紫色に染めた素材として訳した。
- source_word: תוֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 鮮やかな赤に染めた繊維素材を表す伝統的で理解しやすい日本語とした。
- source_word: כְּרֻבִים
  choice: ケルビム
  rationale: 聖所に表された天的存在を指す固有の聖書用語として、複数形を含む伝統的な音写を用いた。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠によって
  rationale: 単なる刺繍と限定せず、熟練した設計と織りの技による意匠という語義を自然に表した。
- source_word: עָשָׂה אֹתָם
  choice: その者は、それらの幕を仕立てた
  rationale: 節末の動詞が単数形であることを「その者は」で可視化し、目的語の複数も「それらの幕」で保持した。
theological_decisions:
- issue: חֲכַם לֵבの慣用表現と職人の性別表現
  choice: 心に知恵のある者
  alternative: 熟練した男／熟練した職人
  rationale: ヘブライ語の男性形を日本語で不必要に「男」と限定せず、同時に原文の「心に知恵のある」という神学的・文学的表現を保持した。「者」は文脈上、代表的・総称的な職人を表せる。
- issue: 節末の単数動詞
  choice: その者は、それらの幕を仕立てた
  alternative: 彼らはそれらの幕を仕立てた
  rationale: 冒頭の複数動詞と節末の単数動詞の緊張を均さず、個々の職人を配分的に指す可能性を残した。
translation_notes:
  register: 現代の一般読者に分かる文体を基本とし、「幕屋」「ケルビム」など文脈上必要な聖書用語は保持した。織物制作の工程が想像できるよう素材と技法を明示しつつ、原文の比喩と数の不一致は本文および脚注で残した。
