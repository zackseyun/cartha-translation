base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: ja
  text: 彼は、つなぎ合わせた第一の組[a]の端の幕の縁に輪を五十個作り、第二のつなぎ合わせた組の幕の縁にも輪を五十個作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つなぎ目に」または「一つ目のつなぎ合わせた部分に」とも訳せる。ヘブライ語は、つなぎ合わせた幕の一組、またはその連結部を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: 輪
  rationale: 幕同士を留め合わせるための布製の輪を指す。本文にない色などは補わず、簡潔で自然な語とした。
- source_word: שְׂפַת
  choice: 縁
  rationale: 布である幕の端部を指すため、現代日本語で自然な「縁」とした。
- source_word: יְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する大きな布を指す文脈に合い、簡潔で定着した訳語である。
- source_word: הַקִּיצֹנָה
  choice: 端の
  rationale: 一組の中で最も外側、すなわち端に位置する幕を表す。日本語では「端の幕」が自然である。
- source_word: בַּמַּחְבָּרֶת
  choice: つなぎ合わせた一方の組
  rationale: מַחְבָּרֶת は、つなぎ合わせた幕の一組、または連結部を表しうる。後半の「もう一方」との対比が分かるよう「一方の組」と訳し、語義上の幅は脚注に残した。
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: もう一方の組
  rationale: 分詞の「つなぎ合わされた」という含みと「第二の」という対比を、前半との関係が自然に伝わる表現にした。日本語で不自然な重複を避けつつ、二つの連結された幕の組という構造を保った。
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: 作り……作った
  rationale: 同じ動詞の反復を保ち、二つの縁に同数の輪を作ったという対応関係を示した。
