  text: וְ/אַרְבָּעִ֥ים אַדְנֵי/הֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/026.yaml
  text: 'and their forty silver bases: two bases under the one frame[a], and two bases under the one frame.'
translation:
  language: ja
  text: また、銀の台座四十個を作った。すなわち、一つの枠[a]の下に二個、また一つの枠の下に二個。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「その一つの枠の下に二個、またその一つの枠の下に二個」。ヘブライ語は両方の句で「その一つの枠」を同じ形で繰り返している。
    reason: 原文の反復を保持した本文の「一つの枠」の意味を明示し、「もう一つの枠」という対比を原文が明示していないことを示すため。
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: また、その四十個
  rationale: 接続詞は製作物の列挙を続けるものとして「また」とし、数は自然な日本語で「四十個」とした。動詞は前後の文脈から補った。
- source_word: אַדְנֵי/הֶם כָּסֶף
  choice: その四十個の銀の台座
  rationale: אֲדָנִים は幕屋の枠を支える受け台を指すため、現代日本語で明瞭な「台座」とし、כָּסֶף は材質を表す「銀の」とした。接尾辞「彼らの」は日本語では対象を受けて「その」と表した。
- source_word: שְׁנֵי אֲדָנִים
  choice: 二個の台座
  rationale: 同じ語を一貫して「台座」と訳し、個数を明示した。
- source_word: תַּחַת
  choice: 下に
  rationale: 各枠と台座の位置関係を直接かつ自然に示す。
- source_word: הַ/קֶּרֶשׁ
  choice: 枠
  rationale: קֶרֶשׁ は幕屋を構成する直立部材であり、単なる板材より構造上の役割を伝える「枠」を採用した。
- source_word: הָ/אֶחָד ... הָ/אֶחָד
  choice: 一枚の枠……もう一枚の枠
  rationale: ヘブライ語は両句で字義的に「その一つの枠」を反復するが、ここでは各枠に二個ずつという配分を表す。本文では自然な日本語で対になる二枚を示し、原文の反復は脚注で明示した。
theological_decisions: []
translation_notes:
  register: 幕屋の製作記録にふさわしい簡潔で端正な叙述とした。「板」ではなく構造部材としての意味が伝わる「枠」、「受け台」より簡潔な「台座」を用いた。節単独でも文として成立するよう、文脈上省略された動詞「作った」と、配置を表す「置いた」を補った。
