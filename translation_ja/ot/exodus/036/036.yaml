base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: ja
  text: その[a]ために、アカシア材の柱を四本作り、それらに金をかぶせた。柱の鉤も金であった。また、それらのために銀の台座を四個鋳造した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その」は、前の節で述べられた垂れ幕を指す。
    reason: cross_reference
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: 柱
  rationale: 幕屋の構造を支える直立部材を指すため、現代日本語で自然かつ明確な「柱」とした。
- source_word: שִׁטִּים
  choice: アカシヤ材
  rationale: 幕屋の材料として用いられるアカシヤ属の木材を指す。「アカシヤ材」は聖書用語として通用しつつ、材木であることも明確にする。
- source_word: וַיְצַפֵּם
  choice: 金をかぶせた
  rationale: 柱の表面を金で覆う加工を表す。「金をかぶせた」は専門的すぎず、動作を正確に伝える。
- source_word: וָוֵיהֶם
  choice: 柱の鉤
  rationale: 幕を柱に取り付ける金具を指す文脈なので「鉤」とした。日本語では「彼らの」に当たる表現を避け、指示対象の柱を明示した。
- source_word: אַדְנֵי
  choice: 台座
  rationale: 柱を据える金属製の基礎部品を指す。「受け台」も可能だが、「台座」が明快で自然である。
- source_word: כָסֶף
  choice: 銀
  rationale: 材質を表す通常の語として、そのまま「銀」と訳した。
- source_word: לָהּ
  choice: それのために
  rationale: 女性単数代名詞を過度に本文で具体化せず、直前の垂れ幕を受ける指示表現として訳した。指示対象は脚注で明示する。
- source_word: וַיִּצֹק
  choice: 鋳造した
  rationale: 銀製の台座を鋳型で作る文脈なので、単なる「注いだ」ではなく金属加工を表す「鋳造した」とした。
