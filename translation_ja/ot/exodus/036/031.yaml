  text: וַ/יַּ֥עַשׂ בְּרִיחֵ֖י עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: ja
  text: 彼は、幕屋の一方の側面の枠[a]のために、アカシア材で五本の横木を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直立した構造部材を指す語。「板」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は…作った
  rationale: 物語を進める接続ワウ付き未完了形。日本語では文脈上、接続語を補わず自然な叙述とした。
- source_word: בְּרִיחֵי
  choice: 横木
  rationale: 幕屋の直立部材を横方向につなぐ部材を指すため、「棒」より建築上の機能が明確な「横木」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材で
  rationale: アカシアの木から得た材料を表す連語であり、現代日本語で自然な材質表現とした。
- source_word: חֲמִשָּׁה
  choice: 五本
  rationale: 横木を数える基数であり、日本語に適切な助数詞「本」を用いた。
- source_word: לְקַרְשֵׁי
  choice: 枠のために
  rationale: קֶרֶשׁ は幕屋を構成する直立した構造部材を指す。「板」も可能だが、機能を伝える「枠」を本文に採った。
- source_word: צֶלַע
  choice: 側面
  rationale: 建築物について用いられているため、身体的な「肋骨」ではなく構造物の一側を表す。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所構造を指す定着した訳語であり、文脈上明確である。
- source_word: הָאֶחָת
  choice: 一方の
  rationale: 女性単数形で「側面」に一致し、対をなす側面のうち一方を示す。序数の「第一の」とは限定しない。
