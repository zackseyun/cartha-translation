base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: ja
  text: 彼は一方の幕に輪を五十個作り、第二の組を成す幕の端にも輪を五十個作った[a]。輪はそれぞれ向かい合っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「第二の連結部分」。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「輪は一つが一つに向かい合っていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: 輪
  rationale: 幕を連結するため布地に設けた輪を指す。金属製の留め具とは区別されるため、「輪」が簡潔で正確。
- source_word: יְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する大きな布を指す文脈に合い、現代日本語でも自然。
- source_word: בִּקְצֵה
  choice: 端に
  rationale: 輪が幕の縁に沿って取り付けられたことを明瞭に表す。
- source_word: מַחְבֶּרֶת
  choice: 一組
  rationale: 複数の幕をつなぎ合わせてできたまとまりを指すため、本文では自然な「一組」とした。語そのものには「連結したもの／連結部分」という含みもあるため脚注で示した。
- source_word: הַשֵּׁנִית
  choice: 第二の
  rationale: 序数の意味を保ち、二つ目の連結された幕のまとまりを示す。
- source_word: מַקְבִּילֹת
  choice: 向かい合っていた
  rationale: 両側の輪が互いに対応する位置に並んでいたことを表す。単なる類似より、空間的な配置を明確に伝える。
- source_word: אַחַת אֶל אֶחָת
  choice: 一つ一つ
  rationale: 各々の輪が相手側の輪と一対一で対応していたという相互関係を自然な日本語で表す。
- source_word: עָשָׂה
  choice: 作った
  rationale: 一般的な製作動詞であり、反復される施工記述に適した平明な訳。
