  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים צִפָּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹתָ/ם֙ עָשָׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וַ/יְצַ֥ף אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: ja
  text: 彼は枠板に金をかぶせ[a]、横木を通すための受けとなるそれらの輪を金で作り[b]、横木に金をかぶせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「枠板」は「板」とも訳せる。ヘブライ語は、幕屋の骨組みをなす木製の構造材を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「横木のための家々」。ここでは、横木を通して保持するための受け・保持箇所を指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: 枠板
  rationale: 幕屋を構成する直立した木製部材を指す。構造材としての役割と板状の実体の両方を、現代日本語で簡潔に表す。
- source_word: צִפָּה / וַיְצַף
  choice: 金をかぶせた
  rationale: 物体の表面を金の層で覆うことを表すため、自然で具体的な「金をかぶせる」とした。原文の二度の用例も同じ表現で訳した。
- source_word: זָהָב
  choice: 金
  rationale: 素材を表す基本語。原文で三度繰り返される強調を保ち、すべて明示した。
- source_word: טַבְּעֹתָם
  choice: その輪
  rationale: 接尾辞が指す枠板に取り付けられた複数の輪を表す。日本語では集合的な「その輪」が自然である。
- source_word: עָשָׂה
  choice: 作り
  rationale: 一般的な「作る」の意味を、文の連続に合わせて連用形で表した。
- source_word: בָּתִּים
  choice: 受け具
  rationale: 直訳は「家々」だが、ここでは横木を受け入れて保持する箇所を機能的に指す。「受け具」は不自然な直訳を避けつつ具体的な機能を伝える。
- source_word: לַבְּרִיחִם
  choice: 横木を通す
  rationale: בְּרִיחִים は枠板を連結する横方向の棒材。輪の用途が明瞭になるよう、前置詞を「横木を通す」と自然に表した。
