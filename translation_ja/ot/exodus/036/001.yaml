reference: Exodus 36:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: ja
  text: ベツァルエルとオホリアブ、および心に知恵のあるすべての者[a]、すなわち、ヤハウェが彼らに知恵と英知を授け、聖所での奉仕のためのあらゆる仕事を行うすべを知るようにされた者たちは、ヤハウェが命じたすべてに従って仕事を行う。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「心に知恵のあるすべての人」。ここでは、神から知恵と理解力を与えられた働き手を指す。
    reason: ヘブライ語の慣用表現と、この文脈での技能を含む意味を示すため。
  - marker: b
    text: 「ヤハウェ」は、原文の神名YHWHを音写したもの。「聖所での奉仕のためのあらゆる仕事」は、「聖なる奉仕のあらゆる仕事」とも訳せる。
    reason: 神名を本文で明示したことを補足し、כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ の構文上の別解を保存するため。
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 仕事をしなければならない
  rationale: 接続詞付き完了形を、直前までの指示を受ける義務・帰結として解した。日本語で自然に命令的な力を示す。
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: ベツァルエルとオホリアブ
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: 心に知恵のあるすべての者
  rationale: 「心の知恵ある人」というヘブライ語の慣用表現を保ちつつ、現代日本語として理解できる形にした。職人としての技能を含むが、単に「熟練した者」として意味を狭めなかった。
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: 主が知恵と英知を授け
  rationale: נתןを「授ける」とし、神から与えられた資質であることを自然に表現した。בָהֵמָּהは複数の人々を集合的に指すため、日本語では目的語を明示せず自然に処理した。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く理解される尊称を用いた。原文が固有の神名YHWHであることは脚注で明示した。
- source_word: חָכְמָה וּתְבוּנָה
  choice: 知恵と英知
  rationale: 二つの近接概念を区別し、職人としての能力を含む幅広い知的・実践的資質を表した。
- source_word: לָדַעַת לַעֲשֹׂת
  choice: どのように行うかをわきまえさせた
  rationale: 実践的な知識・能力を表す不定詞の連なりを、自然な日本語で示した。
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: 聖所の奉仕に必要なあらゆる仕事
  rationale: מְלֶאכֶתとעֲבֹדַתの重なりを「仕事」と「奉仕」で表し、הַקֹּדֶשׁを文脈上「聖所」と解した。
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: 主が命じたすべてのことに従って
  rationale: 前置詞לを、命令内容との一致・準拠を示すものとして訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文では「主」、脚注で「原文は神名YHWH」とする
  alternative: ヤハウェ
  rationale: 日本語として明瞭で礼節ある伝統的表現を採用しつつ、原文が一般名詞ではなく神名であることを隠さない。
- issue: אִישׁ חֲכַם לֵב の性と範囲
  choice: 「心に知恵のあるすべての者」
  alternative: 「心に知恵のあるすべての男」または「すべての熟練した職人」
  rationale: אִישׁは男性単数形だが、כֹלを伴うこの句は該当する働き手を総称する。日本語の「者」は性を断定せず、原文の総称性と技能以上の「知恵」の含意を保つ。
- issue: הַקֹּדֶשׁ の指示対象
  choice: 聖所
  alternative: 聖なる奉仕
  rationale: 幕屋製作の文脈では場所・聖域を指す解釈が自然だが、連語には「聖なる奉仕」という読みの余地もあるため脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。職人仕事の文脈を伝えながら、「心」「知恵」というヘブライ語特有の表現を過度に技能語へ置き換えない。
