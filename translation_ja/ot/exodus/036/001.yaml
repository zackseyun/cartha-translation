revisions:
- from: ベツァルエルとオホリアブ、また、主が知恵と英知を授け、聖所の奉仕に必要なあらゆる仕事をどのように行うかをわきまえさせた、心に知恵のあるすべての者[a]は、主が命じたすべてのことに従って仕事をしなければならない。[b]
  to: ベツァルエルとオホリアブ、および心に知恵のあるすべての者[a]、すなわち、ヤハウェが彼らに知恵と英知を授け、聖所での奉仕のためのあらゆる仕事を行うすべを知るようにされた者たちは、ヤハウェが命じたすべてに従って仕事を行う。[b]
  rationale: 神名を本文で「ヤハウェ」とし、原文とプロジェクト方針に合わせた。さらに「彼らに」と「行うすべを知るようにされた」を補って、複数の受け手と実践的能力を示す不定詞句を明瞭にした。「必要な」という解釈的な語は避け、原文の目的関係に近い「奉仕のための」を用いた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:41:48Z'
