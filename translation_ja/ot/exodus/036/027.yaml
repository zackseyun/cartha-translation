    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: また、…の後ろ…のために
  rationale: 接続詞と前置詞の働きを保ちつつ、יַרְכְּתֵיが示す建物の奥・後部を、現代日本語として自然な「後ろ」で表した。形は複数形だが、ここでは幕屋の後部全体を指す集合的表現と理解できるため、不自然な「後ろの部分々」とはしない。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所の構造物を指す定着した訳語であり、文脈上明確である。
- source_word: יָמָּה
  choice: すなわち西側
  rationale: 語源的には「海の方へ」だが、聖書ヘブライ語の方位表現として西を指す。前の「後ろ」を具体的に示す同格的な方向指定として自然に訳した。
- source_word: עָשָׂה
  choice: 作った
  rationale: 一般的な動詞עשהを直接的に訳し、反復的な建設記事の簡潔な文体を保った。
- source_word: שִׁשָּׁה
  choice: 六枚
  rationale: 数量「六」を示し、日本語では板状の構造材を数える自然な助数詞「枚」を補った。
- source_word: קְרָשִׁים
  choice: 枠板
  rationale: 幕屋を構成する直立した構造部材を指す。単なる平板との印象を避けながら、板または枠という語義上・構造上の不確実性を一語である程度保持するため「枠板」とした。脚注で別訳を示す。
