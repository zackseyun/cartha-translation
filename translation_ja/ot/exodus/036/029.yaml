base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: ja
  text: それらは下の方で対になっており、共に、その上端にある一つの環のところまで完全にそろっていた[b]。二つの隅については、その両方をこのように作った[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直訳に近くは「共に完全なものとなって、その上端、一つの環にまで」。二つの部材が上端にある一つの環のところまで、完全にそろっていたことを指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「二つの隅の部材について」とも理解できる。ヘブライ語は字義どおりには「二つの隅について」と述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: 対をなし
  rationale: 二つの部材が互いに対応して一組になる構造を、簡潔で自然な現代日本語で表した。
- source_word: מִלְּמַטָּה
  choice: 下で
  rationale: 対になる位置またはその構造の起点が下部であることを示す。
- source_word: יַחְדָּו
  choice: 共に
  rationale: 原文の副詞を明示し、二つの部材が一緒になることを保った。
- source_word: תַמִּים
  choice: 一体となって
  rationale: この建築文脈では、二つの部材が上まで完全に合わさる状態を指すと考えられる。「完全な」という形容詞的な含みは脚注にも残した。
- source_word: אֶל רֹאשׁוֹ
  choice: その上端の…にまで
  rationale: 下から上へ至る方向と範囲を表し、接尾辞の単数形も「その」によって過度に特定せず保持した。
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: 一つの環
  rationale: 定冠詞と数詞を踏まえ、「第一の環」と解釈せず、原文どおり一つの環とした。
- source_word: כֵּן עָשָׂה
  choice: このように作った
  rationale: 製作方法を総括する原文の表現を、自然で格調のある日本語にした。
- source_word: לִשְׁנֵיהֶם
  choice: その両方を
  rationale: 二つあるものの双方に同じ加工を施したことを明確にした。
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: 二つの隅について
  rationale: 「隅」という原文の語義を保ち、「隅の部材」とまでは本文で限定しなかった。
