  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: ja
  text: その資材は、すべての作業を行うのに十分であり、なお余りがあった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: その資材
  rationale: מְלָאכָה の通常の意味は「仕事・作業」だが、直前の文脈では民が持って来た物を指すため、ここでは自然な日本語として「資材」とした。
- source_word: הָיְתָה דַיָּם
  choice: 十分であり
  rationale: דַּי は必要を満たすだけの十分さを表し、接尾辞は文脈上、持ち寄られた資材を受ける。
- source_word: לְכָל הַמְּלָאכָה לַעֲשׂוֹת אֹתָהּ
  choice: すべての作業を行うのに
  rationale: 二度目の מְלָאכָה は実施される仕事全体を指す。日本語では目的・必要量の関係が明瞭になるよう「行うのに」とした。
- source_word: וְהוֹתֵר
  choice: なお余りがあった
  rationale: יתר のヒフィル形が示す、必要量を超えて残る余剰を自然かつ簡潔に表す。「なお」により、十分であるだけでなく残余も生じたことを示した。
