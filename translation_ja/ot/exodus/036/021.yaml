lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ
  choice: 長さ十キュビト
  rationale: 寸法を示す名詞構文を保ち、古代の単位 אַמָּה は換算せず「キュビト」とした。
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ הָאֶחָד
  choice: それぞれの枠板
  rationale: קֶרֶשׁ は幕屋を構成する直立の構造材を指す。「枠板」は構造材としての役割と板状部材という語義をともに伝え、הָאֶחָד の分配的な意味は「それぞれ」で表した。
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: 一キュビト半
  rationale: 直訳的には「一キュビトと、そのキュビトの半分」だが、日本語で自然な寸法表現にした。
- source_word: רֹחַב
  choice: 幅
  rationale: 部材の横方向の寸法を表す明瞭な現代日本語。
