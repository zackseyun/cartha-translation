  register: 明瞭で品位ある現代標準日本語。幕屋の製作工程が視覚的に理解できるよう語順を整えつつ、מַחְבָּרֶת が「つなぐ場所」と「つなぎ合わされた組」の双方を指し得る曖昧さは脚注で保持した。
