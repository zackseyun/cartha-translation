base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: ja
  text: 彼は、つなぎ合わせた第一の組[a]の端にある幕の縁に、青い糸で輪を作った。同じように、つなぎ合わせた第二の組のいちばん外側の幕の縁にも輪を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「つなぎ目に」。ヘブライ語は、幕をつなぎ合わせる場所、またはつなぎ合わされたまとまりを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: 輪
  rationale: 幕同士を留めるための布製のループを指すため、簡潔で自然な「輪」とした。
- source_word: תְּכֵלֶת
  choice: 青い撚り糸
  rationale: 幕屋本文では青色に染めた繊維・糸を指す。「青い糸」より素材としての意味を明確にし、幕屋用語として自然な「撚り糸」とした。
- source_word: שְׂפַת
  choice: 縁
  rationale: 幕の端の辺・縁を表すので、現代日本語で自然な「縁」とした。
- source_word: הַיְרִיעָה
  choice: 幕
  rationale: 幕屋を覆う一枚ごとの布を指す。文脈に適し、簡潔で伝統的にも理解しやすい「幕」とした。
- source_word: הָאֶחָת
  choice: 一方の
  rationale: 字義は「一つの」だが、後半の「第二」と対をなし、二組のうち一方を示す。日本語では「一方の」が自然である。
- source_word: מִקָּצָה
  choice: 端にある
  rationale: 輪を付ける幕が、つなぎ合わせた組の端に位置することを示すため、空間関係を自然に表した。
- source_word: בַּמַּחְבָּרֶת
  choice: つなぎ合わせた…組
  rationale: 幕が結合された状態またはそのまとまりを指す。単に「継ぎ目」と限定せず、「つなぎ合わせた組」として機能を明示した。
- source_word: כֵּן עָשָׂה
  choice: 同じように…輪を作った
  rationale: 前半と対応する行為を明示し、日本語で主語・目的語の関係が分かりやすい形にした。
- source_word: הַקִּיצוֹנָה
  choice: いちばん外側の
  rationale: 組の末端に位置する幕という空間的意味を明確に表す。
- source_word: הַשֵּׁנִית
  choice: もう一方の
  rationale: 字義は「第二の」だが、二つの幕の組を対比する文脈では「もう一方の」が自然で、順序を不必要に強調しない。
theological_decisions: []
