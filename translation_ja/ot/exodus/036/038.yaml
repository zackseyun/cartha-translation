translation:
  language: ja
  text: また、その五本の柱と、それらの鉤を作った。柱の上部と帯[a]を金で覆い、その五つの台座は青銅製だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帯」と訳したヘブライ語は、柱に付けられた帯状の装飾、または柱をつなぐ部材を指すと考えられるが、正確な形状は不明。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: その五本の柱
  rationale: עַמּוּד は幕屋建設の文脈で垂直の支柱を指すため、現代日本語で自然かつ標準的な「柱」とした。接尾辞は直前の入口の垂れ幕に関係する柱であることを示す。
- source_word: וָוֵיהֶם
  choice: 鉤
  rationale: וָו は柱に幕を掛けるための金具を指すので、「鉤」とした。「留め金」も可能だが、形状を過度に限定せず、幕屋用語としても通用する。
- source_word: וְצִפָּה
  choice: 金で覆い
  rationale: צפה（ピエル）は金属を表面にかぶせることを表す。「覆う」は現代日本語で分かりやすく、金張りの工作を自然に伝える。
- source_word: רָאשֵׁיהֶם
  choice: 柱の上部
  rationale: 直訳は「それらの頭」だが、建築物の柱については「上部」が明瞭であり、「柱頭」ほど専門的な形状を断定しない。
- source_word: חֲשֻׁקֵיהֶם
  choice: 帯
  rationale: 柱に取り付けられた帯状または連結用の部材と考えられるが、厳密な形状は不確かであるため、簡潔な「帯」とし、その不確かさを脚注で示した。
- source_word: אַדְנֵיהֶם
  choice: 台座
  rationale: אֶדֶן は柱や板を支える基部または受け具を指す。「台座」は一般読者に分かりやすい。「受け台」も可能だが、本文では構造を過度に限定しない語を選んだ。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 古代の銅系金属を指し、幕屋建設の文脈では伝統的かつ標準的に「青銅」と訳される。正確な合金組成までは断定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準語を用いた。節頭の目的語は前節から続く「作った」に支配されるため、日本語では動詞を補って独立した文として自然にした。「柱頭」「柱間横木」などの専門的・限定的な語は避け、原文に残る部材形状の不確かさを保った。
