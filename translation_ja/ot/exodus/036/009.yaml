base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: ja
  text: 一枚の幕は長さ二十八キュビト[a]、幅四キュビトで、すべての幕は同じ寸法であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一キュビトは、およそ四十五センチメートル。
    reason: 古代の尺度を現代の読者が把握するための換算目安。
lexical_decisions:
- source_word: אֹרֶךְ
  choice: 長さ
  rationale: 物の寸法を表す標準的で自然な現代日本語。
- source_word: יְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する布を指す文脈に適し、「覆い」や「布」より具体的で簡潔。
- source_word: הָאַחַת / הָאֶחָת
  choice: 一枚の／すべての幕は同じ
  rationale: 字義は「一つの」だが、前半では各幕一枚ごとの寸法、後半では全幕の均一性を自然な日本語で示す。
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: 二十八
  rationale: ヘブライ語の数値を現代日本語の通常の語順で表した。
- source_word: אַמָּה
  choice: キュビト
  rationale: 古代の尺度を換算せず保持し、原文への透明性を確保する。
- source_word: רֹחַב
  choice: 幅
  rationale: 長さと対になる寸法語として自然で明確。
- source_word: אַרְבַּע
  choice: 四
  rationale: 数値を直接訳した。
- source_word: מִדָּה אַחַת
  choice: 同じ寸法
  rationale: 字義的には「一つの尺度」だが、全幕が同一の長さと幅であることを明瞭かつ自然に表す。
- source_word: לְכָל הַיְרִיעֹת
  choice: すべての幕
  rationale: 寸法の均一性が全ての幕に及ぶことを正確に示す。
