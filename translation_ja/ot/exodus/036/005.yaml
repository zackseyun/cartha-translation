  text: וַ/יֹּאמְרוּ֙ אֶל מֹשֶׁ֣ה לֵּ/אמֹ֔ר מַרְבִּ֥ים הָ/עָ֖ם לְ/הָבִ֑יא מִ/דֵּ֤י הָֽ/עֲבֹדָה֙ לַ/מְּלָאכָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: ja
  text: 彼らはモーセに言った。「民は、ヤハウェが行うよう命じた仕事のために必要な量以上の物を持って来ています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民は、その仕事のために必要な分以上の物を持って来ています」。ヘブライ語の表現は、持ち寄られる物が必要量を超えていることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: 彼らはモーセに言った
  rationale: 物語を進める連続形と直接話法の導入を自然な現代日本語で表した。לֵאמֹר に相当する重複的な「言って」は省略した。
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: 必要な量を、はるかに超える物を持って来ています
  rationale: 民が継続して持参しており、その量が必要十分量を超過しているという רבה のヒフィル分詞と מִדֵּי の組み合わせを明確にした。
- source_word: הָעָם
  choice: 民
  rationale: イスラエルの共同体を指す集合名詞として、聖書文脈に自然で簡潔な「民」とした。
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: 仕事に必要な量
  rationale: עֲבֹדָה と מְלָאכָה はともに作業・仕事の領域を表す。日本語で「仕事の作業」と不自然に重ねず、資材がその仕事の遂行に必要な分を超えたという関係を表した。
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: ヤハウェが行えと命じた仕事
  rationale: 関係節を簡潔に保ち、命令された仕事を実行する意味を表した。神名は固有名として音写した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: ヘブライ語本文の四文字神名を、称号に置き換えず固有名として示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が明示する契約の神名を固有名として保持し、称号との区別を示した。
- issue: 命じられた仕事の実行主体
  choice: ヤハウェが行えと命じた仕事
  alternative: ヤハウェが行われるよう命じた仕事
  rationale: 原文では実行主体が明示されないが、文脈上は民の職人たちが行う仕事である。「行え」はその省略された対象を過度に特定せず、日本語として命令の内容を自然に伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、直接話法と神名によって聖書本文としての格調を保った。「はるかに超える」は寄贈物の著しい余剰を自然に伝える。
