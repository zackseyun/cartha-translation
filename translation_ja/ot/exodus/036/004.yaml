  text: וַ/יָּבֹ֨אוּ֙ כָּל הַ֣/חֲכָמִ֔ים הָ/עֹשִׂ֕ים אֵ֖ת כָּל מְלֶ֣אכֶת הַ/קֹּ֑דֶשׁ אִֽישׁ אִ֥ישׁ מִ/מְּלַאכְתּ֖/וֹ אֲשֶׁר הֵ֥מָּה עֹשִֽׂים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/004.yaml
  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: ja
  text: そこで、聖所のすべての仕事に携わっていた熟練した者たちは皆、それぞれ自分がしていた仕事を離れてやって来た。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「一人一人」を用いる配分表現で、続く「彼の仕事」は単数形、関係節の主語は複数形である。各人がそれぞれ従事していた仕事を離れたことを表す。
    reason: 原文に見られる単数形と複数形の組み合わせを、誤解を招く逐語的な日本語にせず明確に示すため。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: やって来た
  rationale: 物語を進める接続形であり、בואの移動の意味を自然な日本語で表す。「来た」よりも、各自の作業場所から集まって来る動きが明瞭になる。
- source_word: כָּל הַחֲכָמִים
  choice: 熟練した者たちは皆
  rationale: この文脈のחכמיםは知的な「賢者」ではなく、幕屋建設の技能を授けられた作業者を指す。日本語では性別を不必要に補わず、職能を明確にした。
- source_word: הָעֹשִׂים
  choice: 携わっていた
  rationale: 分詞が表す継続中の作業を自然に示し、直後の「仕事」との不自然な反復も避ける。
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: 聖所のすべての仕事
  rationale: מְלֶאכֶתは制作・作業を、הַקֹּדֶשׁはこの幕屋の文脈で聖なる領域、すなわち聖所を指す。抽象的な「聖なる仕事」より文脈に即している。
- source_word: אִישׁ אִישׁ
  choice: それぞれ
  rationale: 名詞の反復による配分表現を、明快で自然な現代日本語にした。
- source_word: מִמְּלַאכְתּוֹ
  choice: 自分がしていた仕事を離れて
  rationale: 前置詞מִןが示す、各自の作業から離れて来る動きを明示した。三人称男性単数接尾辞は配分的用法なので「自分」とした。
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: 自分がしていた
  rationale: 代名詞は複数形だが、直前のאִישׁ אִישׁが各人を配分的に捉えているため、日本語では個々の作業を示す「自分が」とするのが自然である。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用いつつ、幕屋の文脈にふさわしい端正な語調を保った。「熟練した者」は原語の職能的意味を伝え、性別を日本語で過度に強調しない。
