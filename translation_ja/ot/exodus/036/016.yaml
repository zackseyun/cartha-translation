  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: ja
  text: 彼は、五枚の幕を一組として[a]つなぎ合わせ、六枚の幕も別の一組としてつなぎ合わせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「別々に」または「それぞれ別に」とも訳せる。五枚の幕を一つのまとまりにし、六枚の幕をもう一つのまとまりにしたという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: つなぎ合わせた
  rationale: חָבַרの「結合する、つなぐ」という意味を、幕を組み合わせる建設文脈に即して自然に表した。結合方法までは特定しない。
- source_word: הַיְרִיעֹת
  choice: 幕
  rationale: 幕屋を構成する大きな布を指す語であり、文脈上定着した「幕」が簡潔で適切である。
- source_word: לְבָד
  choice: 一組として／別の一組として
  rationale: 五枚と六枚が互いに別個のまとまりとして結合されたことを、現代日本語で誤解なく示す。
- source_word: חֲמֵשׁ / שֵׁשׁ
  choice: 五枚／六枚
  rationale: 布状の幕に自然な助数詞「枚」を用い、基数をそのまま訳した。
- source_word: אֶת ... וְאֶת
  choice: 五枚の幕を…六枚の幕も
  rationale: 二つの並列された目的語を、日本語では助詞「を」と並列を示す「も」によって自然に表した。
