  text: וַ/יְחַבֵּר֙ אֶת חֲמֵ֣שׁ הַ/יְרִיעֹ֔ת אַחַ֖ת אֶל אֶחָ֑ת וְ/חָמֵ֤שׁ יְרִיעֹת֙ חִבַּ֔ר אַחַ֖ת אֶל אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/010.yaml
  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: ja
  text: 彼は五枚の幕を互いにつなぎ合わせ、もう五枚の幕も互いにつなぎ合わせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: つなぎ合わせた
  rationale: חברは「結び合わせる、連結する」の意。幕を一つのまとまりにする建設文脈に自然で、具体的な接合方法までは限定しない。
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋を覆う大きな布を指す。現代日本語で簡潔かつ文脈に適した語として「幕」を用いた。
- source_word: חֲמֵשׁ
  choice: 五枚
  rationale: 基数「五」に、布状の幕を数える自然な助数詞「枚」を添えた。
- source_word: אַחַת אֶל אֶחָת
  choice: 互いに
  rationale: 各組の幕を一枚ずつ相互につなぐ反復的・相互的な関係を、自然な日本語で表した。
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: もう五枚の幕
  rationale: ヘブライ語は直訳すると「そして五枚の幕」だが、並行構造から第二の五枚一組を指すことが明白であるため、日本語では「もう五枚」と自然に明示した。
