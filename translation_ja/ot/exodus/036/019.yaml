  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: ja
  text: 彼は、赤く染めた雄羊の皮で天幕の覆いを作り、その上に、タハシュの皮[a]で覆いを作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」に当たるヘブライ語の意味は不確か。海牛、イルカ、ジュゴン、アナグマなどの皮とする説があり、「上質な革」と解することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は…作った
  rationale: 物語を順に進める wayyiqtol。日本語では単純過去で自然に表した。
- source_word: מִכְסֶה לָאֹהֶל
  choice: 天幕の覆い
  rationale: מִכְסֶה は覆う層、אֹהֶל は通常「天幕」を意味する。文脈上の専門語に置き換えず、原語の基本義を保った。
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: 赤く染めた雄羊の皮
  rationale: מְאָדָּמִים は皮が赤くされたことを示すため、「赤い」ではなく「赤く染めた」とした。
- source_word: וּמִכְסֵה
  choice: …覆いを作った
  rationale: 原文が「覆い」を繰り返すため、日本語でも反復を残した。「第二の」は原文に明示されないので加えなかった。
- source_word: עֹרֹת תְּחָשִׁים
  choice: タハシュの皮[a]
  rationale: תְּחָשִׁים が指す動物または皮革の種類は確定できない。特定の動物や「上質な革」と断定せず音写し、不確実性を注で示した。
- source_word: מִלְמָעְלָה
  choice: その上に
  rationale: 外側ないし最上層に置かれた位置関係を、自然な日本語で明示した。
