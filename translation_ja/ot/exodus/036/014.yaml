    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: 作った
  rationale: עשהの基本義を自然な現代日本語で表す。原文で動詞が反復されているため、日本語でも「作った」を二度用いて強調と構文を保った。
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋の文脈では、大きな織物の覆いを指す。「布」より用途が明確で、「幕」はこの建造物の文脈にふさわしい。
- source_word: עִזִּים
  choice: やぎの毛の
  rationale: 字面では「やぎの」だが、幕屋の織物という文脈では、やぎの毛を素材とする幕を指すと考えられる。皮を意味する語ではないため「やぎ皮」とはしない。
- source_word: לְאֹהֶל
  choice: 天幕とするため
  rationale: 接頭辞לの目的・機能を示す用法を表し、これらの幕が幕屋の上の天幕を構成することを明確にした。
- source_word: עַל
  choice: 覆う
  rationale: 空間的には「上に」だが、幕の機能を自然な日本語で示すため「幕屋を覆う」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所構造物の術語として定着し、上に置かれる天幕との区別も保てる。
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: 十一枚
  rationale: 数詞をそのまま訳し、幕を数える自然な助数詞「枚」を補った。
- source_word: אֹתָם
  choice: 幕は十一枚作った
  rationale: 目的語接尾辞は先行する幕を受ける。日本語では「それらを」と直訳せず、話題化した「幕は」によって自然に指示関係を表した。
