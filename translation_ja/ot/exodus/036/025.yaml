  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עָשָׂ֖ה עֶשְׂרִ֥ים קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: ja
  text: 幕屋の第二の側、すなわち北側には、板[a]を二十枚作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「枠」とも訳せる。ヘブライ語は構造用の板または枠を指し得るため、幕屋のこの部材がどのような形であったかについては見解が分かれている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: 側には
  rationale: צֶלַעはここでは身体の「肋骨」ではなく、幕屋の構造上の「側」を指す。接続詞と前置詞は、日本語の文脈に合わせて「側には」と自然に表した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 荒野の聖所を指す定着した訳語であり、文脈に適する。
- source_word: הַשֵּׁנִית
  choice: 第二の
  rationale: 対応するもう一方の側を順序立てて示す語なので、「もう一方の」だけに弱めず、原文の序数を保持した。
- source_word: לִפְאַת צָפוֹן
  choice: すなわち北側には
  rationale: פֵאָהとצָפוֹןが方角を指定している。「すなわち」を補い、「第二の側」が北側であることを明瞭かつ自然に示した。
- source_word: עָשָׂה
  choice: 作った
  rationale: עשהの広い意味に即した簡潔で自然な訳。主語は直前の文脈から明らかなため、日本語では明示しない。
- source_word: עֶשְׂרִים
  choice: 二十枚
  rationale: 基数をそのまま訳し、板状部材を数える自然な助数詞「枚」を用いた。
- source_word: קְרָשִׁים
  choice: 板
  rationale: 幕屋を構成する木製部材を指す伝統的で理解しやすい訳。ただし、その正確な形状が板か枠かは確定しないため、別訳を脚注に残した。
