base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: ja
  text: 彼は、青、紫、緋色の糸と、撚り合わせた上質の亜麻布を用い、刺繍職人の手による、天幕の入り口のための幕[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「垂れ幕」とも訳せる。ヘブライ語では入り口に掛ける幕を指し、内部を隔てる「仕切り幕」（פָּרֹכֶת）とは別の語が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は…作った
  rationale: 物語を進めるワウ継続法を、自然な日本語の叙述として表した。文脈上明らかな主語を保持した。
- source_word: מָסָךְ
  choice: 垂れ幕
  rationale: 入り口に掛ける幕を指す語であり、内部を隔てる פָּרֹכֶת とは区別される。「垂れ幕」は用途と形状を自然に示す。
- source_word: לְפֶתַח הָאֹהֶל
  choice: 天幕の入り口のための
  rationale: פֶּתַח を「入り口」、一般名詞 אֹהֶל を「天幕」と訳し、幕の設置目的を示す לְ の意味を保った。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の撚り糸
  rationale: 三種の染色素材を色名で示し、織物制作の文脈から素材が糸であることを明示した。「緋色」は תוֹלַעַת שָׁנִי の鮮明な赤色を表す伝統的かつ理解しやすい表現である。
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: 撚った上質の亜麻布
  rationale: שֵׁשׁ の良質な亜麻素材と、מָשְׁזָר の撚りをかけた加工の両方を表した。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 刺繍職人の仕事によって
  rationale: 専門職人による刺繍加工を示す構文を保ち、ほかの織物技法と区別した。
