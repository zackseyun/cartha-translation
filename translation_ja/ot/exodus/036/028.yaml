translation:
  language: ja
  text: また、幕屋の後方の両隅に用いる板を二枚作った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幕屋の隅を成す部材として、後方の両側に」。ヘブライ語は建物の後方の端や隅を表し、隅の位置を指すとも、そこで接合される特別な隅板を指すとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: また、…二枚
  rationale: 接続詞は製作項目の連続を示すため「また」とし、板を数える自然な助数詞「枚」で二を明示した。
- source_word: קְרָשִׁים
  choice: 板
  rationale: 幕屋の骨組みを構成する木製部材を指す。この段落で自然かつ一貫して理解できる「板」とした。
- source_word: עָשָׂה
  choice: 作った
  rationale: 一般的な製作動詞であり、ヘブライ語の簡潔な叙述を現代日本語で素直に表す。
- source_word: לִ/מְקֻצְעֹת
  choice: 両隅のために
  rationale: 隅の位置または隅を成す接合部材を表し得る語である。本文では位置として自然に訳し、部材自体を指す可能性は脚注に残した。
- source_word: הַ/מִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所を指す定着した日本語であり、語の「住まい」という背景を保ちつつ指示対象を明確にする。
- source_word: בַּ/יַּרְכָתָיִם
  choice: 後ろの両隅
  rationale: 後方の二つの端・側を示す双数形を、幕屋の構造に即して明瞭に表した。直前の「隅」と意味が重なるが、原文の後方かつ二地点という情報を自然に統合している。
