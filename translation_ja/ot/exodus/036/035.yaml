translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「彼はまた」で文脈上の継続を示し、素材の列挙は簡潔に保った。「巧みな意匠で」は原文の芸術的・熟練的な含意を伝えつつ、刺繍か織り込みかを本文で過度に断定しない表現とし、技法上の幅は脚注で明示した。
