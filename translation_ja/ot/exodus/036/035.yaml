base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: ja
  text: 彼はまた、青糸、紫糸、緋色の糸[b]、撚り合わせた上質の亜麻糸で仕切り幕[a]を作り、巧みな意匠を凝らして、ケルビムの模様を施した[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「垂れ幕」とも訳せる。幕屋の聖所と至聖所を隔てる幕。
    reason: lexical_alternative
  - marker: b
    text: 「緋色」は、字義的には緋色に染めた素材または糸を表す語句。「深紅の糸」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: または「熟練した職人の仕事としてケルビムを施した」「意匠的な模様仕事を施した」。原文は、意匠を凝らした芸術的な仕事を指すが、織り込みや刺繍などの具体的な技法は特定しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: 垂れ幕
  rationale: 幕屋の内部を仕切る幕を指す。現代日本語として明瞭で、祭儀的な文脈にもふさわしい。「隔ての幕」も可能だが、本文では簡潔さを優先した。
- source_word: תְּכֵלֶת
  choice: 青糸
  rationale: 幕屋の織物に用いる青く染めた素材を表すため、色だけでなく繊維素材であることを明示した。
- source_word: אַרְגָּמָן
  choice: 紫糸
  rationale: 高価な紫染めの繊維素材を表す標準的で自然な訳語。
- source_word: תוֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 緋色に染めた素材ないし糸を指す表現であり、織物の文脈に即して「糸」を補った。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻と、מָשְׁזָרの撚った加工の双方を明示し、ほかの色糸と並ぶ素材として自然に表現した。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠で
  rationale: 計画された芸術的な模様仕事を簡潔に表す。特定の技法だけに限定せず、熟練した職人による意匠性を保持した。
- source_word: כְּרֻבִים
  choice: ケルビム
  rationale: 聖所の幕に表された天上の存在を指す、定着した聖書用語を用いた。
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: ケルビムを織り出した
  rationale: ケルビムの像が垂れ幕の模様として組み込まれたことを自然な日本語で示した。ただし、原文は具体的な制作技法を厳密には特定しないため、その幅を脚注に残した。
