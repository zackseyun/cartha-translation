  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: ja
  text: 彼は、中央の横木が板材の中を端から端まで通るように作った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「板材の中を、一方の端からもう一方の端まで延びるように」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: עשהのワウ継続法・カル形で、物語を進める単純な過去の行為を表す。日本語では文脈上、接続語を補わず自然に訳した。
- source_word: הַבְּרִיחַ הַתִּיכֹן
  choice: 中央の横木
  rationale: בְּרִיחַは幕屋の板材を結合する横方向の棒、הַתִּיכֹןは中央・中ほどを表すため、構造上の位置と機能が明瞭な「中央の横木」とした。
- source_word: לִבְרֹחַ
  choice: 通るように
  rationale: 建築文脈で、横木が板材の内部を貫通または延伸することを表す。不定詞の目的・結果の含みを自然な日本語で示した。
- source_word: בְּתוֹךְ הַקְּרָשִׁים
  choice: 板材の中を
  rationale: בְּתוֹךְは内部・ただ中、קֶרֶשׁは幕屋を構成する板または枠を指す。「板材」とすることで、単なる薄い板ではなく構造部材であることを示した。
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: 端から端まで
  rationale: 全長にわたることを表す慣用句を、簡潔で自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、幕屋建設の記事にふさわしい簡潔で格調ある叙述とした。「板材」は構造部材としてのקֶרֶשׁを表し、「通る」には貫通する意味と内部を延びる意味の双方を残した。
