  yaml_path: translation/ot/exodus/036/018.yaml
  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: ja
  text: 幕屋[a]が一つとなるよう、彼は青銅の留め金を五十個作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天幕」。ヘブライ語では「天幕」だが、ここでは幕屋の構造を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は…作り
  rationale: 物語を進めるワイイクトル形。日本語では連用形を用い、後続する目的・結果と自然につないだ。
- source_word: קַרְסֵי
  choice: 留め金
  rationale: 幕を相互に接合する金具を指す。現代日本語として明瞭で、単なる「鉤」より機能が伝わる。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の材料という文脈での慣用的かつ歴史的に妥当な訳語。
- source_word: חֲמִשִּׁים
  choice: 五十個
  rationale: 留め金という具体物を数えるため、基数に助数詞「個」を添えた。
- source_word: לְחַבֵּר
  choice: つなぎ合わせて
  rationale: 接合する目的を表す不定詞。複数部分を一体にする具体的な働きを自然な日本語で示す。
- source_word: אֶת הָאֹהֶל
  choice: 幕屋
  rationale: אֹהֶלの字義は「天幕」だが、ここでは聖所の幕屋構造を指す。本文では文脈上明瞭な「幕屋」とし、字義的な別訳を脚注に示した。
- source_word: לִהְיוֹת אֶחָד
  choice: 一つにした
  rationale: 接合の結果、構造全体が一体となることを簡潔で自然な日本語にした。原文の「一つ」を保持している。
theological_decisions: []
