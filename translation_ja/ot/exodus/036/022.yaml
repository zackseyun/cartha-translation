  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: ja
  text: 各板には二つのほぞ[a]を設け、それらが互いに対応するようにした[b]。幕屋のすべての板を、このように造った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「手」。ヘブライ語は、板から突き出した接合部分を日常語の「手」で比喩的に表している。
    reason: lexical_alternative
  - marker: b
    text: 「互いに向かい合わせた」とも訳せる。二つのほぞが対応して並ぶ配置を強調する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: 二つのほぞ
  rationale: יָדֹת は字義的には「手」だが、幕屋建築の文脈では板から突き出して接合に用いる部分を指すため、現代日本語で具体的な「ほぞ」とした。
- source_word: קֶּרֶשׁ
  choice: 板
  rationale: 幕屋の骨組みを成す木製の構造材を指す。簡潔で分かりやすく、文脈にも適する。
- source_word: מְשֻׁלָּבֹת אַחַת אֶל אֶחָת
  choice: 互いに対応させた
  rationale: 二つのほぞが相互に対応する配置であることを示す。「組み合わせた」とすると、ほぞ同士が直接かみ合う構造だと限定しかねないため、配置上の対応を保つ表現とした。
- source_word: כֵּן עָשָׂה
  choice: このように造った
  rationale: 方法を指す כֵּן と製作を表す עָשָׂה を、自然で直接的な日本語にした。
- source_word: מִשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所構造物を指す定着した訳語であり、一般的な聖書読者にも理解される。
