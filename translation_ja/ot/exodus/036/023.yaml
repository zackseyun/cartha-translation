  text: וַ/יַּ֥עַשׂ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קְרָשִׁ֔ים לִ/פְאַ֖ת נֶ֥גֶב תֵּימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: ja
  text: 彼は幕屋のために枠板を作った。南側、すなわち南に当たる側のために、二十枚の枠板を作った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「南側のために、南の方へ」。ヘブライ語では南を表す語が重ねて用いられ、方向が強調または特定されている。קֶרֶשׁは「板」とも訳せる。
    reason: 語義上の別訳と、原文にある方向表現の重複を示すため。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は作った
  rationale: עשהのワッイקטル形で、物語の進行に伴う過去の行為を表す。文脈上の単数主語を「彼」で明示した。
- source_word: הַקְּרָשִׁים
  choice: 枠板
  rationale: קֶרֶשׁは幕屋を構成する直立部材を指す。「板」だけより構造上の役割を示しつつ、具体的な板材であることも保つ。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋のために
  rationale: מִשְׁכָּןは出エジプト記における聖所構造物の定着した名称であり、現代日本語の聖書用語として「幕屋」が明瞭である。
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: 二十枚の枠板
  rationale: 数詞と反復された名詞をそのまま表し、建築資材の列挙調を保った。日本語の助数詞は板状部材に自然な「枚」とした。
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: 南側、すなわち南に面する側のために
  rationale: פֵאָהを建築上の「側」、נֶגֶבとתֵּימָנָהを方向として訳し、南を示す語の重なりを不自然な逐語反復にせず保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の名詞反復を生かし、「枠板」を二度記した。南を表す二重表現は本文で「南側、すなわち南に面する側」と自然に表し、直訳的な形は脚注に残した。
