  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: ja
  text: また、二十枚の枠の下に銀の台座を四十個作った。すなわち、一枚の枠の二つのほぞのために二個、別の一枚の枠の二つのほぞのために二個である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: 銀の台座
  rationale: אַדְנִיםは幕屋の枠を下から受ける基部を指すため、現代日本語で形と機能が伝わる「台座」とした。כֶסֶףは素直に「銀」と訳した。
- source_word: הַקְּרָשִׁים
  choice: 枠
  rationale: קֶרֶשׁは幕屋を構成する木製部材。単なる板とも訳せるが、組み立て構造を担う部材であることを簡潔に示す「枠」を採用した。
- source_word: יְדֹתָיו
  choice: その二つのほぞ
  rationale: 直訳は「その手」だが、ここでは枠の下端から出て台座にはまる突起を指す建築用語的比喩なので、「ほぞ」が自然で正確。
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: 一枚の枠…もう一枚の枠
  rationale: 同じ表現の反復は、各枠に台座二個ずつという配分を示す。日本語では対になる反復を自然に表すため、後者を「もう一枚」とした。
- source_word: עָשָׂה
  choice: 作った／置いた
  rationale: 節の主動詞は「作った」。後続の「枠の下に」は省略された配置関係を示すため、日本語では末尾に「置いた」を補い、台座の配置を明確にした。
theological_decisions: []
translation_notes:
  register: 現代標準日本語による、簡潔で格調を保った叙述。「台座」「ほぞ」は幕屋の構造を具体的に伝える一般的な建築語として用いた。原文の数と配分を保持しつつ、日本語の不自然な反復を避けた。
