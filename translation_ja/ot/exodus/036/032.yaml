  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: ja
  text: また、幕屋の第二の側面の板のために横木[a]を五本、幕屋の後方、西側の板のために横木を五本作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「横木」は「貫（ぬき）」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: 横木
  rationale: 幕屋の板を横方向につなぎ留める部材を指すため、現代日本語で明瞭な「横木」とした。
- source_word: קַרְשֵׁי
  choice: 板
  rationale: 幕屋を構成する木製の構造材を指す。形状について「枠」と断定せず、伝統的かつ簡潔な「板」とした。
- source_word: צֶלַע
  choice: 側
  rationale: 構造物の一方の側面を表す語であり、建築形状を過度に限定しない「側」とした。
- source_word: הַשֵּׁנִית
  choice: 第二の
  rationale: 直前に述べられた側に続く側を示す原文の序数表現を保った。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記で聖所となる構造物を指す定着した訳語であり、文脈上の指示対象を明確に伝える。
- source_word: לַיַּרְכָתַיִם
  choice: 最奥部
  rationale: 単なる背面だけでなく、遠い端・奥まった部分という語の空間的な力を表した。
- source_word: יָמָּה
  choice: 西側
  rationale: 海の方向、すなわち西を示す方向表現を、幕屋の配置に即して自然な日本語にした。
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: また……五本、……五本
  rationale: 原文の並列的な列挙を保ちつつ、日本語として過度に反復的にならない形にした。
