source:
  edition: WLC
  text: וַ/יַּ֕עַשׂ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וַ/יְחַבֵּ֨ר אֶת הַ/יְרִעֹ֜ת אַחַ֤ת אֶל אַחַת֙ בַּ/קְּרָסִ֔ים וַֽ/יְהִ֥י הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: ja
  text: 彼は金の留め金を五十個作り、その留め金で幕を互いにつなぎ合わせた。こうして幕屋は一つになった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「そして幕屋は一つであった」とも訳せる。ここでは、幕をつないだ結果を表すものとして訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作り
  rationale: עשהの基本義「作る」を自然な現代日本語で表した。連続する物語の流れは連用形で示した。
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: 金の留め金を五十個
  rationale: קֶרֶסは幕同士を接合する金具を指すため、形状を限定しすぎず機能が明瞭な「留め金」とした。
- source_word: וַיְחַבֵּר אֶת הַיְרִעֹת אַחַת אֶל אַחַת
  choice: 幕を互いにつなぎ合わせた
  rationale: חברの接合の意味と、אַחַת אֶל אַחַתの相互的な関係を、自然な日本語で保持した。יְרִיעֹתは幕屋を構成する布なので簡潔に「幕」とした。
- source_word: בַּקְּרָסִים
  choice: その留め金で
  rationale: 前置詞בの手段用法を「で」で表し、既出の留め金であることを「その」で明示した。
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: こうして幕屋は一つになった
  rationale: 接合の結果として統一体となったことを自然に示す。「こうして」は文脈上の結果関係を表すが、形式的には「そして幕屋は一つであった」とも訳せるため脚注に示した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所構造を指す定着した日本語聖書用語であり、簡潔で理解しやすい。
