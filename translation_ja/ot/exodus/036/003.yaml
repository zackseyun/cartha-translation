  to: 彼らは、イスラエルの子らが聖所での奉仕に関わる仕事を行うために持って来た、すべての奉納物をモーセのもとから受け取った[a]。イスラエルの子らはなお、朝ごとに自発的なささげ物を彼のもとへ持って来た。
  rationale: 本文を明瞭な現代標準日本語に整えつつ、材料の受け渡し、聖所に関わる奉仕の仕事、自発的な献納、朝ごとの反復という原文の要点を保持した。「なお」により継続の含みを示すが、原文に明示されない逆接は加えなかった。後半の主語を「イスラエルの子ら」と明示して、前半の「彼ら」（受領者）との指示対象の混同を避けた。
