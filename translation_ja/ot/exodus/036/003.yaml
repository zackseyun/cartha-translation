base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: ja
  text: 彼らは、イスラエルの子らが聖所での奉仕に関わる仕事を行うために持って来た、すべての奉納物をモーセのもとから受け取った[a]。イスラエルの子らはなお、朝ごとに自発的なささげ物を彼のもとへ持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「モーセの前から取った」。または「モーセの前から受け取った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 受け取った
  rationale: 基本義は「取る」だが、職人たちがモーセの管理下にあった資材を引き取る文脈なので、現代日本語では「受け取った」が自然である。
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: モーセの前から
  rationale: 「モーセの前／面前から」という原文の空間的表現を保ち、モーセの手元・管理下から移されたことを示す。別解を脚注に示す。
- source_word: הַתְּרוּמָה
  choice: 奉納物
  rationale: 聖なる用途のために取り分けて差し出された建設資材を指すため、犠牲そのものを連想しやすい「供え物」より「奉納物」が適切である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の定型的な集合呼称を保持する。「民」と平板化せず、男女を含むイスラエル共同体の名称として訳す。
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: 聖所の奉仕の仕事を
  rationale: 「仕事」「奉仕」「聖なる所」という重なった名詞表現を、理解可能な日本語の範囲で保つ。文脈上 הַקֹּדֶשׁ は聖所を指す。
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: 行うために
  rationale: עשה の広い意味と、女性接尾辞が前述の仕事・務めを受けることを自然な日本語で表す。
- source_word: וְהֵם הֵבִיאוּ
  choice: それでも民は…持って来続けた
  rationale: 独立代名詞 הֵם の強調と、材料を職人が受け取る一方で民の搬入が継続したという流れを表す。「それでも」は文脈的対照を示すが、強い逆接にはしない。
- source_word: אֵלָיו
  choice: 彼のもとへ
  rationale: 代名詞の先行詞をモーセと理解しつつ、原文どおり代名詞で表した。
- source_word: נְדָבָה
  choice: 自発のささげ物
  rationale: 自ら進んで差し出す贈り物という語義を明示する。継続的な搬入を日本語で自然に表すため集合的に単数形を用いる。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 朝ごとに
  rationale: 語の反復が示す反復・継続を、簡潔で自然な現代日本語で表す。
theological_decisions: []
translation_notes:
