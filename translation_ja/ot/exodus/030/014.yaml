base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: ja
  text: 二十歳以上で、数えられる者たちの中に入る者は皆[a]、ヤハウェへの献納物を納めなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「数えられる者たちの間を通る者は皆」。ヘブライ語は、数えられる者たちとの関係で「通る」と表現しており、人口調査の手続きを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: 入る者は皆
  rationale: כֹּל が後続する分詞句を包括する構文を、自然な日本語で分配的に表した。עֹבֵר の移動のイメージも「入る」に残している。
- source_word: עַל הַפְּקֻדִים
  choice: 数えられる者たちの中に
  rationale: פְּקֻדִים はこの文脈で人口調査において数えられ、登録される者を指す。עַל と עבר の結び付きは慣用的であり、「中に」として集団への加入を明確にした。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: 二十歳以上で
  rationale: 年齢の下限を示す定型句を、簡潔で現代的な日本語にした。
- source_word: יִתֵּן
  choice: ささげなければならない
  rationale: 未完了形がここでは法的な命令・義務を表すため、その拘束力を自然な日本語で示した。
- source_word: תְּרוּמַת
  choice: 献納物
  rationale: ヤハウェのために取り分けて差し出すものを指す。単なる任意の「寄付」より奉献性を保ちつつ、特定の祭儀動作を暗示する訳語は避けた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号に置換せず、そのまま音写している。
- issue: 人口調査に関する慣用表現をどこまで明示するか
  choice: 数えられる者たちの中に入る
  alternative: 登録される、数えられる者たちの間を通る
  rationale: 人口調査の意味を伝えながら、עבר が持つ移動・加入のイメージを残し、原文の曖昧さを注で示した。
translation_notes:
  register: 現代標準日本語による、簡潔で威厳のある法令調。原文の人口調査上の慣用表現は本文で過度に平板化せず、代替的な理解を脚注に残した。
