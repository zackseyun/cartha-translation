  yaml_path: translation/ot/exodus/030/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに次のように語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げた
  rationale: דברのワイイクトル形は物語を進める。後続のלֵאמֹרと一体になった定型的な発話導入として、現代日本語では「告げた」が自然である。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語YHWH。日本語聖書で広く通用する伝統的な代用表記「主」を本文に置き、原語について脚注で明示する。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 前置詞אֶלは発話の相手を示し、日本語では助詞「に」が自然である。מֹשֶׁהは標準的に「モーセ」と音写する。
- source_word: לֵאמֹר
  choice: （「告げた」に統合）
  rationale: 直訳は「言って」だが、日本語では「告げて言った」が冗長になりやすい。次節から直接話法が始まるため、発話導入を「告げた」にまとめた。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: 本文では「主」、脚注で「原文は神の名YHWH」
  alternative: ヤハウェ
  rationale: 原文が称号ではなく固有名を用いる事実を脚注に保ちつつ、普通の現代日本語読者に定着した本文表記を採用した。発音の再構成には幅があるため、脚注ではYHWHと示す。
translation_notes:
  register: 簡潔で品位ある現代標準日本語。ヘブライ語の「語って、言った」という発話公式は、日本語として不自然な重複を避けて「告げた」とした。
