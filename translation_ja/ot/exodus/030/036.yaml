source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: ja
  text: その一部を、ごく細かくすりつぶし、その一部を、わたしがそこであなたと会う会見の天幕の中で、証しの前に置きなさい。それは、あなたがたにとって最も聖なるもの[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字義的には「聖なるものの聖なるもの」。
    reason: ヘブライ語の重畳による最上級的表現の形を示すため。
lexical_decisions:
- source_word: וְשָׁחַקְתָּ מִמֶּנָּה הָדֵק
  choice: その一部を、ごく細かくすりつぶし
  rationale: שׁחקは香料を粉状にする動作を表し、הָדֵקはその細かさを強める。日本語では「ごく細かくすりつぶす」とすることで、動作と仕上がりを自然に伝える。מִמֶּנָּהは部分を示すため「その一部を」とした。
- source_word: וְנָתַתָּה מִמֶּנָּה
  choice: その一部を…置きなさい
  rationale: נתןはここでは儀礼的に所定の場所へ置くことを表す。二度目のמִמֶּנָּהも部分を示すので、原文の反復を保った。
- source_word: לִפְנֵי הָעֵדֻת
  choice: 証しの前
  rationale: 原文は箱や石板と明示せず「証し」とだけ述べるため、指示対象を訳文で限定しなかった。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中
  rationale: 幕屋に関する定型的な名称として、מוֹעֵדが表す神との会見という意味を保った。
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: すなわち、わたしがあなたと会う場所
  rationale: יעדのニファル形は、定められた場所で会うことを表す。「すなわち」を補い、直前の位置指定との関係を日本語で明確にした。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同じ名詞を重ねるヘブライ語の最上級的表現を、明瞭な現代日本語で示した。香料を指すため「もの」を補った。
- source_word: תִּהְיֶה לָכֶם
  choice: あなたがたにとって…である
  rationale: 単なる所有と限定せず、香料が共同体に対して持つ聖なる地位を表す。ここで二人称が単数から複数に移ることも訳し分けた。
theological_decisions:
- issue: 「証し」が指すもの
  choice: 原文どおり「証し」とし、箱または石板とは明示しない。
  alternative: 「証しの箱の前」／「契約の板の前」
  rationale: この節自体はהָעֵדֻתとだけ記している。文脈上の具体的な指示対象を一つに決めず、原文の表現範囲を保つ。
- issue: 聖性を表す重畳表現
  choice: 本文では「最も聖なるもの」とする。
  alternative: 「聖なるものの中で聖なるもの」
  rationale: קֹדֶשׁ קָדָשִׁיםの最上級的な力を自然な日本語で伝えつつ、字義に近い形は脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「置きなさい」で命令を自然に示し、儀礼用語の「証し」「会見の天幕」は簡潔に保持した。脚注記号は対応する「最も聖なるもの」の直後に置いた。
