revisions:
- from: その一部を、ごく細かくすりつぶし、その一部を会見の天幕の中の証しの前、すなわち、わたしがあなたと会う場所に置きなさい。それは、あなたがたにとって最も聖なるもの[a]である。
  to: その一部を、ごく細かくすりつぶし、その一部を、わたしがそこであなたと会う会見の天幕の中で、証しの前に置きなさい。それは、あなたがたにとって最も聖なるもの[a]である。
  rationale: 原文の関係節が会見の天幕を修飾することを日本語で明確にし、「証し」と会見の場所とを同格化しないよう改めた。香料、証し、会見の天幕、聖性の最上級表現に関する原文の曖昧さと用語を保った。脚注は直訳表示に整合する字義的な表現へ修正した。
