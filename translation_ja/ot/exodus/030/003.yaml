  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: ja
  text: その上面と周囲の側面と角に純金をかぶせなさい。また、その周囲に金の縁飾り[a]を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「金の飾り帯」または「金の冠」。ヘブライ語は、周囲を巡る縁、飾り帯、冠状の造作を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: かぶせなさい
  rationale: צפהは、物に金属の表面を施すことを表す。現代日本語として自然で、単に覆う以上の意味も文脈から伝わる「かぶせる」とした。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 高い純度の金を表す定着した自然な訳語。
- source_word: גַּגּוֹ
  choice: その上面
  rationale: 通常は「屋根」も意味するが、ここでは香の祭壇という小型の祭具の上部表面なので「上面」が適切。
- source_word: קִירֹתָיו
  choice: 周囲の側面
  rationale: 字義的には「壁」だが、小型の祭壇については「側面」が自然で、垂直面を明確に示す。続くסָבִיבを「周囲の」に反映した。
- source_word: קַרְנֹתָיו
  choice: 角
  rationale: 祭壇の四隅に突き出た角状部分を指す祭儀用語。日本語では文脈上簡潔で定着した「角」を保持した。
- source_word: זֵר זָהָב
  choice: 金の縁飾り
  rationale: 祭具を取り巻く装飾的な縁または帯状の造作を示す。「縁飾り」は物理的形状と装飾性を自然に伝え、「冠」という比喩的印象を本文に持ち込まない。
- source_word: סָבִיב
  choice: 周囲に／周囲の
  rationale: 祭壇を取り巻く全周性を表し、原文で二度繰り返される語を訳文でもそれぞれ反映した。
theological_decisions:
- issue: 祭具用語の訳し分け
  choice: קַרְנֹתָיוは「角」、זֵרは「縁飾り」とする。
  alternative: זֵרを「冠」または「金の冠」とする。
  rationale: 本節は幕屋の祭具の構造を記述している。「角」は祭壇の重要な形状を保ち、「縁飾り」はזֵרの物理的機能を現代の読者に明確に伝える。「冠」も語義上可能なので脚注に残し、王権的含意を本文で不必要に強めない。
translation_notes:
  register: 明確で格調ある現代標準日本語。命令形は律法・製作指示として自然な「〜なさい」を用いた。原文の反復と祭具の具体的形状を保ちつつ、小型家具に不自然な「壁」「屋根」は避けた。
