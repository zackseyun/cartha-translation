base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: ja
  text: また、その飾り縁の下に金の輪を二つ作りなさい。[a] その二つの側面に、すなわちその両側に、それらを作りなさい。それらは担ぎ棒を通す受け具となり、その棒によってこれを運ぶためのものとなる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「飾り縁」は「縁」または「へり」とも訳せる。ヘブライ語は、祭壇の周囲に設ける装飾的な縁を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は直訳すると「その二つの側面に……その二つの側に」と反復しており、両側への配置を強調している。また「受け具」は直訳では「家々」で、担ぎ棒を通す箇所を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: 金の輪
  rationale: 材質と形状を明確かつ自然な現代日本語で表す。
- source_word: מִתַּחַת לְזֵרוֹ
  choice: その飾り縁の下に
  rationale: זֵרは祭壇を取り巻く装飾的な縁を指すため、「飾り縁」とした。
- source_word: צַלְעֹתָיו ... צִדָּיו
  choice: その両側面、すなわち二つの側に
  rationale: 二つの語による反復を残しつつ、同じ両側への配置を説明する文として読める形にした。
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: 担ぎ棒を通す受け具とし
  rationale: 「棒のための家々」という直訳的表現の機能を、輪が棒の受け具となることとして明瞭に表した。
- source_word: בַדִּים
  choice: 担ぎ棒
  rationale: 幕屋の器具を運搬するための棒であることを簡潔に示す。
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: その棒でこれを運べるようにする
  rationale: 目的と、棒を手段とする意味の双方を自然な日本語で保持した。
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: 作る……作り
  rationale: ヘブライ語の命令的な未完了形と動詞の反復を、日本語の指示文として自然な形で反映した。
