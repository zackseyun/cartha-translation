id: EXO.30.16
reference: Exodus 30:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: ja
  text: あなたはイスラエルの子ら[a]から贖罪の銀を受け取り、それを会見の天幕での務めのために用いなさい。それはイスラエルの子らにとって、ヤハウェの前で記念となり、あなたがたの命[b]のために贖罪を行うためのものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では直訳すると「イスラエルの子ら」。ここではイスラエルの民を共同体として指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「あなたがたのネフェシュ」（複数形）。ここでは「あなたがたの命」または「あなたがた自身」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: 贖いの金
  rationale: כֶּסֶףは「銀」または「金銭」を意味し、ここでは直前に規定された人口調査時の支払いを指す。הַכִּפֻּרִיםの贖罪・償いの意味を保ちつつ、現代日本語として明瞭な「贖いの金」とした。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らから
  rationale: בְּנֵי יִשְׂרָאֵלの形を反映し、契約共同体を表す伝統的な呼称として訳した。自然な「イスラエル人から」も可能なので脚注に示した。
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: 会見の天幕の奉仕のために充てなさい
  rationale: עַלはここでは用途・配分を表し、עֲבֹדָהは聖所にかかわる務めを指す。「充てる」により、受け取った金をその奉仕の用途に回す意味を明確にした。
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: 覚えのしるしとなり
  rationale: זִכָּרוֹןは記憶を呼び起こす記念・しるしを意味する。「覚えのしるし」は、神の前に置かれる記念という祭儀的な意味を、過度に抽象化せず表す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の臨在の前という標準的な祭儀表現を保ち、固有名יהוהは「ヤハウェ」と音写した。
- source_word: לְכַפֵּר
  choice: 贖う
  rationale: כפרのピエル形が表す贖い・償いの働きを、一般読者に理解しやすい動詞で訳した。祭儀的含意は「贖いの金」との反復によっても保持される。
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: あなたがたのいのちを
  rationale: נֶפֶשׁはここで人の生命または人自身を指し、身体と区別された「魂」に限定されない。人口調査に伴う贖いという文脈から「いのち」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された契約の固有名を明示し、普通名詞的な称号へ置き換えないため。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的・男性形の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数形を形式的に反映しつつ、ここでは契約共同体全体を指す表現として保持した。性別を男性のみに限定する意図は文脈上ないため、その点を脚注で補った。
- issue: 贖いの対象を表す נַפְשֹׁתֵיכֶם
  choice: あなたがたのいのち
  alternative: あなたがた自身／あなたがたの魂
  rationale: ここでのנֶפֶשׁは人の生命・本人を指す。後代の心身二元論を持ち込む「魂」を避けながら、「自身」と断定せず生命の含意を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「会見の天幕」「贖い」は聖書固有の祭儀的語彙として保持し、「奉仕のために充てる」によって金銭の用途を自然に示した。原文の節構造と目的関係を保ちながら、日本語として読みやすい語順に整えた。
