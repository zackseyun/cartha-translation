  source_fidelity: 「贖いの金」は文脈上理解可能ですが、כֶּסֶף（銀）とכפרの祭儀的な「贖罪」をより明確に反映するため、「贖罪の銀」としました。また、末尾のלְכַפֵּר עַל נַפְשֹׁתֵיכֶםは「命を贖う」よりも「命のために贖罪を行う」とするほうが、כפרの語義を保ちます。
