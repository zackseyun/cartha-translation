    rationale: この箇所のכפר（ピエル）は、身代金・献金の文脈における祭儀的な贖罪・宥めを表す。「贖う」は救出・買い戻しの意味にも広がるため、「贖罪を行う」のほうが原語の機能を明確に保つ。
  - severity: low
    issue: 末尾の目的節の接続がやや不自然
    rationale: 「覚えのしるしとなり、…贖うためである」は、日本語では主語と目的関係が取りにくい。原文の「記念となる／贖罪のため」を保って文を整える必要がある。
