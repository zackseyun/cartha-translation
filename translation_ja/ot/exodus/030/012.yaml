language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: ja
  text: 「あなたがイスラエルの子らを登録して数えるとき[a]、一人一人は、彼らを数える際に、自分の命のための贖い金[b]をヤハウェに納めなければならない。そうすれば、彼らを数える際、彼らの間に災いは起こらない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イスラエルの子らの頭を、その登録に従って上げるとき」。これは人口を登録して数えることを表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 「自分自身のための贖い金」とも訳せる。ヘブライ語ネフェシュは、ここでは「魂」だけでなく、「命」または「その人自身」を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 〜とき
  rationale: この法的指示では、人口調査が行われる場合を時・条件の両面から示す。「もし」より自然に、想定された機会を表す。
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: 人口を調べ
  rationale: 字義は「頭を上げる」だが、ここでは人数を登録・集計する慣用表現。「人口を調べる」として行政的文脈を明瞭にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の家族的・男性形の表現を保ちつつ、現代日本語として理解できる形にした。
- source_word: לִפְקֻדֵיהֶם
  choice: 彼らを数える
  rationale: פקד の登録・点呼・人口調査の語義を、前句とのつながりが分かる自然な日本語で表した。
- source_word: וְנָתְנוּ אִישׁ
  choice: 数えられる者はそれぞれ…納めなければならない
  rationale: אִישׁ の個別・分配的な意味を「それぞれ」で表し、人口調査の対象者を明示した。
- source_word: כֹּפֶר
  choice: 贖い金
  rationale: 裁きを免れるために差し出す代価・補償金を指すため、日本語聖書語として通用しつつ金銭的性格も明確な「贖い金」とした。
- source_word: נַפְשׁוֹ
  choice: 自分の命のための
  rationale: נפש はここで非物質的な「魂」に限定されず、人自身または命を指す。文脈上「命」が最も適切。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 契約の神名 יהוה を音写し、与える・納める行為の受け手として助詞「に」を用いた。
- source_word: נֶגֶף
  choice: 災い
  rationale: 打撃、疫病、致命的災厄を含み得る語であるため、「疫病」と狭く限定せず、原語の幅を保つ「災い」とした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に明記された契約の神名を普通名詞や称号に置き換えず、現代日本語で一般的な音写を用いた。
- issue: נַפְשׁוֹ の意味
  choice: 自分の命のための
  alternative: 自分自身のための、自分の魂のための
  rationale: 後代の霊魂観を持ち込まず、人口調査に伴う身代金という文脈で人の命を指すものとして訳した。ただし「自分自身」も語義上可能であることを注記した。
- issue: נֶגֶף の範囲
  choice: 災い
  alternative: 疫病、打撃
  rationale: 人口調査に伴う神の裁きを具体的な疫病だけに限定せず、原語が持つ災厄・打撃の幅を残した。
- issue: 男性形 אִישׁ の扱い
  choice: 数えられる者はそれぞれ
  alternative: 一人一人の男は
  rationale: אִישׁ の分配的単数を「それぞれ」で保ち、直近の文脈で義務を負うのが登録対象者であることを示した。性別の範囲を本文以上に断定する表現は避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文に三度現れる「数える」の反復を可能な限り保ち、法的命令とその目的を明確にした。「贖い金」は宗教的意味と実際の支払いの両面を伝える語として採用した。
