source:
  edition: WLC
  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: ja
  text: これと同じものを調合する者、またはその一部を資格のない者[a]に塗る者は、だれでも自分の民の中から断たれる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「資格のない者」は、ここでは民族的な意味での外国人ではなく、この聖なる油を受けることを認められていない者を指す。別訳「部外者」「一般の者」。
    reason: lexical_alternative
  - marker: b
    text: 「民の中から断たれる」は契約法上の定型表現。ここでは、その刑罰がどのように実行されるかは明記されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: 者はだれでも
  rationale: 個々の男性に限定せず、一般的な法規の「だれでも」という効力を自然な日本語で表す。
- source_word: יִרְקַח
  choice: 調合する
  rationale: 香料や油を所定の配合で作ることを指す専門的な語であり、単なる「混ぜる」より文脈に適する。
- source_word: כָּמֹהוּ
  choice: これと同じもの
  rationale: 直前に規定された聖なる注ぎの油と同種のものを指す。配合の完全な同一性まで本文以上に明示せず、類似を表す原文の幅を保つ。
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: または、そのいくらかを…に塗る
  rationale: 油の一部を人の上に置く、すなわち塗布する行為を、文脈に即した自然な日本語で表す。接続は禁じられた二つの行為の選言として訳す。
- source_word: עַל זָר
  choice: 資格のない者に
  rationale: 祭儀的文脈の זָר は民族的な外国人というより、聖なる油を受ける権限・資格を持たない者を指すため。
- source_word: וְנִכְרַת מֵעַמָּיו
  choice: 自分の民の中から断たれる
  rationale: 契約法上の定型表現を保ち、共同体からの排除、神による処罰、死刑など具体的な執行方法を本文以上に限定しない。
theological_decisions:
- issue: 祭儀法における זָר の意味
  choice: 資格のない者
  alternative: 部外者、一般の者、よそ者
  rationale: ここでの境界は民族ではなく、聖なる注ぎの油を受けることを許されているかどうかにある。「資格のない者」はその祭儀的制限を明確にしつつ、特定の教派的制度を持ち込まない。
- issue: וְנִכְרַת מֵעַמָּיו の刑罰の性質
  choice: 自分の民の中から断たれる
  alternative: 民から追放される、死刑に処せられる
  rationale: 原文は刑罰の具体的な方法をここでは特定していないため、定型句の比喩と法的・神学的な緊張を保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭儀法としての厳粛さを保った。「者はだれでも」により一般的な法規の調子を示し、「断たれる」は原文の定型的かつ未確定な刑罰表現を維持した。
