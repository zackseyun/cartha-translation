  text: また、担ぎ棒をアカシア材で作り、金をかぶせなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作り
  rationale: 接続詞を伴う完了形は、一連の製作指示を続ける命令として機能する。日本語では「また」と連用形を用い、前後との連続性と指示の力を自然に表した。
- source_word: הַבַּדִּים
  choice: 担ぎ棒
  rationale: 聖具を運ぶための棒を指すため、単なる「棒」より用途が明確な「担ぎ棒」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: アカシアの木材を表す構文。現代日本語の製作指示として簡潔で自然な「アカシア材」とした。
- source_word: וְצִפִּיתָ
  choice: 金をかぶせなさい
  rationale: 工芸の文脈で、表面を金で覆うことを意味する。「金をかぶせる」は専門的すぎず、製作工程を明確に伝える。
- source_word: אֹתָם
  choice: （担ぎ棒に）
  rationale: 目的語代名詞は担ぎ棒を受ける。日本語では同一文中の目的語を繰り返さず、「金をかぶせる」の対象として自然に理解できるため省略した。
- source_word: זָהָב
  choice: 金を
  rationale: 被覆に用いる素材を表す。日本語では「金をかぶせる」とするのが自然である。
