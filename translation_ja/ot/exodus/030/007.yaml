  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: ja
  text: 'アロンは朝ごとに[a]、その上で香り高い香をたかなければならない。灯火を整えるとき[b]、その香をたく。


    [a] 「毎朝」とも訳せる。ヘブライ語では「朝」が繰り返され、日ごとに欠かさず行うことが強調されている。

    [b] 「灯火の手入れをするとき」とも訳せる。この語は、灯心を切りそろえることを含め、灯火を使える状態に整えることを指す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「毎朝」とも訳せる。ヘブライ語では「朝」が繰り返され、日ごとに欠かさず行うことが強調されている。
    reason: lexical_alternative
  - marker: b
    text: 「灯火の手入れをするとき」とも訳せる。この語は、灯心を切りそろえることを含め、灯火を使える状態に整えることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: たかなければならない
  rationale: קטרのヒフィル形は祭儀の文脈で、香を燃やして煙を立ち上らせることを表す。「香をたく」は現代日本語で自然かつ明確であり、動詞の義務的な未完了形は「なければならない」で表した。
- source_word: עָלָיו
  choice: その上で
  rationale: 直前の文脈にある香の祭壇を受ける。「その上で」は指示対象と場所の意味を簡潔に保つ。
- source_word: קְטֹרֶת סַמִּים
  choice: 香り高い香
  rationale: קְטֹרֶתは祭儀でたく香、סַמִּיםはその芳香性の香料を示す。「香り高い香」は、香料から調合された芳香のある香という意味を自然な日本語で伝える。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 朝ごとに
  rationale: 「朝」の反復による分配的な意味と、日々繰り返す規則性を保つ。「毎朝」も可能なため脚注に示した。
- source_word: בְּהֵיטִיבוֹ
  choice: 整えるとき
  rationale: יטבのヒフィル形はここでは灯火を良い状態にし、使用に備えることを指す。灯心の処置だけに限定せず、文脈上の手入れ全般を含められる表現とした。
- source_word: הַנֵּרֹת
  choice: 灯火
  rationale: 聖所の燭台のともしびを指す。「灯火」は器具そのものだけでなく、燃えている明かりを整える祭儀行為にも自然に結びつく。
- source_word: יַקְטִירֶנָּה
  choice: その香をたく
  rationale: 女性単数接尾辞はקְטֹרֶתを受ける。日本語で単に「それ」とすると指示が曖昧になりやすいため、「その香」として指示対象を明示した。
