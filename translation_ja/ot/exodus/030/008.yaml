base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: ja
  text: また、アロンが夕暮れ[a]に灯火を整えるとき、彼はヤハウェの前で、あなたがたの代々にわたって常に[b]香をたかなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「二つの夕べの間」。夕方から薄暮にかけての時間帯を指す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 「常に」は「絶えず」「継続して」とも訳せる。ここでは、香が朝夕の定めに従い、代々にわたって規則的にささげられることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: また、……整えるときにも
  rationale: 前置詞付き不定詞は時を表す節を導く。עלהのヒフィル形は灯火を燃え上がらせることを表し得るが、幕屋の儀礼という文脈では、点火だけに限定せず、灯火を整えて燃えるようにする一連の動作を指す表現とした。冒頭のוּは、朝の務めを述べる前節との対応を踏まえて「また」「にも」で表した。
- source_word: הַנֵּרֹת
  choice: 灯火
  rationale: 幕屋の燭台に備えられたともしびを指す。「ランプ」よりも祭儀文脈にふさわしく、器具とその明かりの双方を自然に含み得る語を選んだ。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 夕暮れ
  rationale: 字義は「二つの夕べの間」であり、夕方から薄暮にかけての時間帯を指す慣用句。本文は明快な現代日本語とし、直訳は脚注に残した。
- source_word: יַקְטִירֶנָּה קְטֹרֶת
  choice: 香をたく
  rationale: קטרのヒフィル形は、香を煙として立ち上らせる祭儀行為を表す。女性単数接尾辞は後続のקְטֹרֶתを受けるため、日本語では重複を避けて「香をたく」と自然に表した。
- source_word: תָּמִיד
  choice: いつも
  rationale: ここでは一瞬も途切れない状態というより、朝夕に規定どおり繰り返される継続的・恒常的な祭儀を表す。平明な「いつも」を用い、別の理解を脚注で示した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 祭儀が神の臨在のもとで行われることを示す。לִפְנֵיは「前で」、神名は音写して表した。
- source_word: לְדֹרֹתֵיכֶם
  choice: あなたがたが代々にわたって
  rationale: イスラエルの後代にわたり規定が継続することを示す。二人称複数接尾辞を「あなたがた」で明示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を記しているため、固有名として一般的な学術的再構音に基づく「ヤハウェ」を採用した。
translation_notes:
  register: 明快で現代的な標準日本語を用いつつ、幕屋の祭儀にふさわしい品位を保った。「灯火を整える」は、点火だけでなく芯や油を整える儀礼的動作を含み得る表現。「いつも」は無休・無停止と断定せず、定期的継続性を保つ。
