base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに告げられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神の固有名「YHWH」。伝統的には「主」と訳されるが、「ヤハウェ」と音写することもできる。
    reason: 原語の神名と伝統的な代替表記を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 神の発話を導入する定型表現として、דבר の「語る」を自然で格調ある現代日本語にした。後続の לֵאמֹר と一体の導入句として扱った。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着している神名の代替表記を本文に用い、原文が固有名を記すことは脚注で明示した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句を自然な日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: 告げられた（発話導入句に統合）
  rationale: 直訳すれば「言って」だが、日本語では「語って言われた」が冗長になるため、次節の直接話法を導く機能を「告げられた」に統合した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 本文は「主」、脚注で「YHWH（ヤハウェ）」
  alternative: 本文で「ヤハウェ」
  rationale: 原文の固有名であることを隠さず脚注に示しつつ、本文では日本語読者に定着した尊称を用いた。神名の推定発音には不確実性があるため、その情報も脚注に保持した。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。ヘブライ語の「語って、言った」という定型的な重複は、日本語として自然な発話導入「告げられた」にまとめた。
