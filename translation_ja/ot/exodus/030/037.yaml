  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/קְּטֹ֨רֶת֙ אֲשֶׁ֣ר תַּעֲשֶׂ֔ה בְּ/מַ֨תְכֻּנְתָּ֔/הּ לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם קֹ֛דֶשׁ תִּהְיֶ֥ה לְ/ךָ֖ לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: ja
  text: あなたが作るその香については、その配合どおりに[a]、自分たちのために作ってはならない[b]。それを、あなたはヤハウェのための聖なるものとしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その調合法どおり」または「その割合どおり」。
    reason: lexical_alternative
  - marker: b
    text: この聖なる香と同じ配合のものを、日常の私用のために作ってはならない、という意味。
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: 香
  rationale: 直前に規定された聖なる香料を指す。「香」は祭儀的文脈にふさわしく、原文にない「芳しい」などを加えない簡潔な訳語である。
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: あなたが作る
  rationale: 単数形の動詞を保ちつつ、自然な現代日本語の関係節とした。
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: その配合どおり
  rationale: 定められた材料の割合や調合法を表す語であり、文脈上「配合」が明瞭である。語の幅は脚注に残した。
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: 自分たちのために作ってはならない
  rationale: 複数形への移行と、利益・所有・使用を示し得る לָכֶם の関係を保持した。私用を禁じる含意は脚注で説明する。
- source_word: קֹדֶשׁ
  choice: 聖なるもの
  rationale: 祭儀のために取り分けられた神聖な性質を示す。「最も聖なる」は原文以上に強めるため避けた。
- source_word: תִּהְיֶה לְךָ
  choice: それは、あなたにとって…聖なるものである
  rationale: 単数の受け手に対する関係を示す לְךָ を「あなたにとって」と訳し、イスラエルまたはモーセがそれを聖なるものと見なすべきことを表した。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 神名を固有名「ヤハウェ」として示し、前置詞 לְ の献納・帰属の意味を「のために」で表した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を固有名として明示し、普通名詞的な称号に置き換えない。
- issue: 香の聖別の向き
  choice: あなたにとってヤハウェのために聖なるもの
  alternative: ヤハウェに対してあなたに聖なるもの
  rationale: 二つの לְ 句の関係を過度に解釈せず、民が聖なるものとして扱うことと、ヤハウェに属し献げられることの双方を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「香」は祭儀的な文脈を簡潔に示す。原文の単数「あなたが／あなたに」と複数「自分たち」を訳文にも反映した。
