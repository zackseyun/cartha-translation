- from: あなたが作る香[a]は、その配合どおりのものを自分たちのために作ってはならない[b]。それは、あなたにとってヤハウェのために聖なるものである。
  to: あなたが作るその香については、その配合どおりに[a]、自分たちのために作ってはならない[b]。それを、あなたはヤハウェのための聖なるものとしなければならない。
  rationale: 脚注aを「その配合どおりに」に移し、原文の語義注として正しく機能させた。前半を「香については」として、香そのものではなくその規定の配合による私用の製造が禁じられることを明瞭にした。後半は、原文の「あなたにとって」「ヤハウェのために」という二つの関係を、自然な現代日本語で保持した。
