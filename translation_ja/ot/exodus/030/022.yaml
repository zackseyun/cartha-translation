  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから、…語った
  rationale: ワウ継続法による物語の進展を「それから」で示し、דבר は定型的な神の発話表現として「語った」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名יהוהを一般的な推定発音に基づいて音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞 אֶל を、自然な現代日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: （独立には訳出しない）
  rationale: 後続する発言内容を導く定型句であり、日本語では「語った」で自然に導入できるため、冗長な「言って」を加えなかった。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: ヘブライ語本文が称号ではなく四文字神名を用いていることを明示しつつ、伝統的な代替表記は脚注で知らせた。母音の厳密な確定には限界があるため、一般的な学術上の推定発音を採用した。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。次節の直接話法へ続く導入句として自然になるよう、לֵאמֹר は日本語で重ねて訳さなかった。
