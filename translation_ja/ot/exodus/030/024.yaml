lexical_decisions:
- source_word: קִדָּה
  choice: カシア
  rationale: 香料に用いる芳香性の樹皮を指す語であり、材料名として簡潔な標準名称を採用した。
- source_word: חֲמֵשׁ מֵאוֹת
  choice: 五百シェケル
  rationale: 数量は五百であり、後続の重量基準から単位シェケルを日本語では明示すると自然である。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルで
  rationale: 聖所で定められたシェケルを重量基準とする意味を保った。
- source_word: שֶׁמֶן זַיִת
  choice: オリーブ油
  rationale: ヘブライ語の連語を自然な現代日本語の材料名で表した。
- source_word: הִין
  choice: 一ヒン
  rationale: 古代の特定の液量単位を近代単位に置き換えず音写し、注で概量を示した。
- source_word: וְ
  choice: また／、
  rationale: 前節から続く材料一覧の接続関係を冒頭の「また」と並列構文で表した。
