  edition: WLC
  text: אַמָּ֨ה אָרְכּ֜/וֹ וְ/אַמָּ֤ה רָחְבּ/וֹ֙ רָב֣וּעַ יִהְיֶ֔ה וְ/אַמָּתַ֖יִם קֹמָת֑/וֹ מִמֶּ֖/נּוּ קַרְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: ja
  text: 長さは一キュビト[a]、幅も一キュビトで、正方形とし、高さは二キュビトとする。祭壇の角（つの）は、祭壇本体と一体に造る[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: キュビトは古代の長さの単位であり、その正確な長さには時代や地域による幅がある。
    reason: 古代の度量衡を説明しつつ、本文にない単一の換算値による過度な精密さを避けるため。
  - marker: b
    text: 直訳は「それ（祭壇）から」。角（つの）を別に取り付けるのではなく、祭壇本体から一続きに造ることを意味する。
    reason: 原文の前置詞句の指示対象を明確にし、造作上の意味を示すため。
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: 一キュビト／二キュビト
  rationale: 古代の長さの単位を換算せずに残し、数値の不確かな精密化を避けた。双数形 אַמָּתַיִם は明確に「二キュビト」とした。
- source_word: אָרְכּוֹ / רָחְבּוֹ / קֹמָתוֹ
  choice: 長さ／幅／高さ
  rationale: 祭壇の寸法を示す語として、現代日本語で自然かつ明瞭な建築・造作上の表現を用いた。
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 縦横が各一キュビトであるという直前の寸法指定を踏まえ、四辺が等しい形を明瞭に表した。
- source_word: יִהְיֶה
  choice: ～とする
  rationale: 幕屋造営に関する規定・仕様を示す未完了形の機能を、現代日本語の指示表現で示した。
- source_word: קַרְנֹתָיו
  choice: 祭壇の角（つの）
  rationale: 祭壇から突き出た角状部分を指す祭儀用語として「角」を保持し、読みと形状が分かるよう「つの」を添えた。文脈上の指示対象である祭壇を明示した。
- source_word: מִמֶּנּוּ
  choice: 祭壇本体と一体に造る
  rationale: 字義は「それから」だが、造作の文脈では角を別に取り付けず、祭壇自体から連続して造ることを表すため、自然な日本語で意味を明示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある仕様文の文体とした。「～とする」を用いて規定としての調子を保ち、古代単位と祭壇の「角」という聖書固有の語彙は残した。
