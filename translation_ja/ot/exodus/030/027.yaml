  yaml_path: translation/ot/exodus/030/027.yaml
  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: ja
  text: また、机とそのすべての用具、ともしび台とその用具、香の祭壇[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「香をたく祭壇」。
    reason: ヘブライ語の連語 מִזְבַּח הַקְּטֹרֶת を、簡潔な名詞句としても、用途を明示しても訳せるため。
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 語自体は単に「机」を意味する。幕屋の聖具を指す文脈だが、原文にない詳しい名称は補わない。
- source_word: כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: כְּלִי は器具・容器・用具を広く表す。ここでは机に付属する品々を自然かつ包括的に示す「用具」とした。
- source_word: הַמְּנֹרָה
  choice: ともしび台
  rationale: 複数のともしびを載せる聖具の機能を、音訳に頼らず現代日本語で明確に表す。
- source_word: כֵּלֶיהָ
  choice: その用具
  rationale: 女性単数の接尾辞が「ともしび台」を受けることを明瞭にし、同じ語 כְּלִי を前半と一貫して訳した。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香の祭壇
  rationale: 「香」と「祭壇」の連語を簡潔に保った。「香をたく祭壇」とも表せるため、その説明的な訳を脚注に示した。
theological_decisions: []
translation_notes:
  register: 列挙が前後の節から続く構文なので、冒頭を「また」とし、末尾も読点で次項への連続性を保った。語調は簡潔で荘重さを損なわない現代標準日本語とした。
