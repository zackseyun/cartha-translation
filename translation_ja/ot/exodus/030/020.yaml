language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: ja
  text: 彼らが会見の天幕に入るときは、水で洗わなければならない。そうすれば死ぬことはない[a]。また、祭壇に近づいて仕え、ヤハウェへの火によるささげ物[b]を焼いて煙にするときも、水で洗わなければならない、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「そして彼らは死なない」。文脈上、「死なないために」とも訳せる。
    reason: 原文は接続詞で結ばれた表現であり、洗浄の結果または目的を示す含みがあるため。
  - marker: b
    text: 「食物としてのささげ物」と理解する訳もある。ヘブライ語の厳密な語義には議論がある。
    reason: אִשֶּׁהは火で供える祭儀的供え物を指すが、その語源と正確な語義の説明には幅があるため。
lexical_decisions:
- source_word: בְּבֹאָם
  choice: 彼らが……入るとき
  rationale: 前置詞בְּと接尾辞付き不定詞連語が表す時を、自然な現代日本語の条件的な時の表現で示した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神が民と会う聖所を指す定着した呼称として、意味と祭儀的文脈を保った。
- source_word: יִרְחֲצוּ מַיִם
  choice: 水で洗わなければならない
  rationale: רחץとמיםによる水洗いを明示した。洗う対象は前節の「手と足」であるため、この節だけで「身」と補わず、原文同様に目的語を省いた。
- source_word: וְלֹא יָמֻתוּ
  choice: そうすれば死ぬことはない
  rationale: 形式上の並列をある程度保ちつつ、洗浄と死の回避との結果的関係を明瞭にした。目的・警告として読む可能性は脚注に示した。
- source_word: אוֹ
  choice: あるいは
  rationale: 第二の状況を導く選言接続詞を明示し、原文の構文上のつながりを保った。
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: 祭壇に近づいて
  rationale: נגשׁの物理的かつ祭儀的な「近づく」という意味を簡潔に表した。
- source_word: לְשָׁרֵת
  choice: 仕え
  rationale: 祭司としての聖なる奉仕を示しつつ、一般読者にも分かる語を選んだ。
- source_word: לְהַקְטִיר
  choice: 焼いて煙にする
  rationale: קטרのヒフィルが示す、供え物を祭壇で焼いて煙を立ち上らせる祭儀的動作を明示した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 語の祭儀的意味を保ち、「食物のささげ物」という解釈に限定しなかった。別訳は脚注に示した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 四文字神名יהוהを普通名詞の称号に置き換えず、固有の契約名として音写した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に明記された固有名を固有名として示し、称号への置換や特定の伝統的読みを本文に持ち込まないため。
- issue: וְלֹא יָמֻתוּが表す関係
  choice: そうすれば死ぬことはない
  alternative: 死なないために／さもないと死ぬ
  rationale: 祭儀上の洗浄に伴う現実の死の制裁を弱めず、同時に原文の形式的な並列と文脈上の目的・結果の幅を脚注によって保った。
- issue: אִשֶּׁהの意味範囲
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 火で処理される供え物という祭儀的意味を本文に置き、語源・機能に関する一つの理解へ限定するのを避けた。
translation_notes:
  register: 明瞭で現代的だが礼拝文にも耐える格調を保った。「会見の天幕」「祭壇」「ささげ物」は一般読者に理解可能な標準的聖書語彙を用いた。原文が次節へ続くため、末尾を読点で終えて未完の構文を示した。
