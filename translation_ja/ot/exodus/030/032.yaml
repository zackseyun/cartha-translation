id: EXO.30.32
reference: Exodus 30:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: ja
  text: 人の体[a]にこれを注いではならない。また、これと同じ配合のものを作ってはならない。これは聖なるものであり、あなたがたにとって聖なるものでなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「人の肉」。ここでの「人」は人間一般を指す。
    reason: 原文の בְּשַׂר（肉）と אָדָם（人間一般）の語感を示すため。
lexical_decisions:
- source_word: יִיסָךְ
  choice: 注いではならない
  rationale: 受動形の具体的な動作を保ち、特別な油を人体に注ぐことの禁止として訳した。「塗る」「油を注いで任職する」とまで意味を限定しない。
- source_word: עַל בְּשַׂר אָדָם
  choice: 人の体
  rationale: בָּשָׂר は字義的には「肉」だが、ここでは油を施す人体を指す。אָדָם は特定の男性ではなく人間一般なので、現代日本語として自然な「人の体」とした。
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: これと同じ配合
  rationale: מַתְכֹּנֶת が表す、材料の割合を含む調合・組成を簡潔に表した。
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: ものを作ってはならない
  rationale: 直前の「これと同じ配合」と合わせ、聖別された油と同様のものを再製する禁止を自然な日本語で表した。
- source_word: קֹדֶשׁ הוּא
  choice: これは聖なるものであり
  rationale: קֹדֶשׁ の基本的な聖性を、聖書用語として定着した「聖なる」で保持した。
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: あなたがたにとって聖なるものでなければならない
  rationale: イスラエルがこの油を聖なるものとして扱うべきことを表す未来・規範的な響きを保持した。
theological_decisions:
- issue: אָדָם の一般的人間としての意味
  choice: 人
  alternative: 男／人間
  rationale: ここでの אָדָם は性別を限定する語ではなく人間一般を指すため、「人」とした。
- issue: קֹדֶשׁ の反復
  choice: 二つの節で「聖なる」を反復
  alternative: 後半を「特別に取り分けなければならない」と説明的に訳す
  rationale: 原文が同じ語を反復して油そのものの聖性と共同体に対する規範を並べるため、その神学的な強調を省略しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令の厳粛さを保ちつつ、不自然な直訳調を避けた。
source_grounding:
  english_pob_role: consult_only
