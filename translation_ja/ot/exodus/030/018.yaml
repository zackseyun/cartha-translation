  - severity: low
    issue: 「そこに水を入れ」が場所を不自然に曖昧化する。
    rationale: שָׁמָּה は直訳すれば「そこに」だが、洗盤の設置と水の用途という直近の文脈では洗盤に水を入れることを指す。日本語では「その中に」として器への注入を示すほうが自然で、意味を実質的に追加しない。
