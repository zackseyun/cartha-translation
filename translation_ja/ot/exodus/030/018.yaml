source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: ja
  text: あなたは、洗うための青銅の洗盤[a]とその青銅の台[b]を作り、洗盤を会見の天幕と祭壇との間に置き、その中に水を入れなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「洗盤」は、幕屋で洗うための水を入れた大きな器。
    reason: 一般読者にはなじみの薄い祭儀用語を説明するため。
  - marker: b
    text: 「台」は「土台」とも訳せる。
    reason: כַּן の可能な訳語を示すため。
lexical_decisions:
- source_word: כִּיּוֹר
  choice: 洗盤
  rationale: 幕屋で洗浄用の水を蓄える大きな器を指す。「洗盤」は用途を簡潔に示し、祭儀用具としての性格も保つ。現代語ではやや特殊な語なので脚注で説明する。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 銅または銅合金を表し得る語だが、幕屋の器具という文脈と日本語聖書での通例に沿って「青銅」とする。
- source_word: כַּן
  choice: 台
  rationale: 洗盤を支える構造物を指す。簡潔で自然な日本語として「台」を採用する。
- source_word: לְרָחְצָה
  choice: 洗うための
  rationale: 目的を表す不定詞を訳し、誰が何を洗うかはこの節に明示されていないため補わない。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神との定められた会見の場所を表す名称として、正確さと日本語での定着度を考慮した。
- source_word: מִזְבֵּחַ
  choice: 祭壇
  rationale: 文脈上の祭儀用の壇を直接的に表す。
- source_word: שָׁמָּה
  choice: そこに
  rationale: ヘブライ語の場所を示す副詞をそのまま保つ。文脈上は洗盤を置いた場所を受けるが、「その中に」と明示して原文以上に限定しない。
- source_word: מַיִם
  choice: 水
  rationale: 日本語で物質名として自然な単数形を用いる。
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: あなたは……作り、……置き、……入れなければならない
  rationale: 祭儀規定における二人称単数の指示の拘束力を保ちつつ、連続する動作を自然な現代日本語の一文にまとめる。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令の拘束力は「なければならない」で表し、原文にない洗う主体や対象は補わない。
