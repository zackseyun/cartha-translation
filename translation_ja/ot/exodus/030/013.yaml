  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: ja
  text: 人口調査に登録される者[a]は皆、次のものを献げなければならない。聖所のシェケルを基準とする半シェケル（一シェケルは二十ゲラ）、ヤハウェへの奉納物として半シェケルを。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「数えられた者たちの間を通る者は皆」。人口調査で正式な数に加わる者を指す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: 次のものを献げなければならない
  rationale: 指示代名詞による導入と、法的規定を表す未完了形の指示性を、明瞭で自然な現代日本語にした。
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: 数えられて登録される者は皆
  rationale: 字義的には「数えられた者たちのところを通る者は皆」だが、人口調査の公式な登録に加わることを表す慣用句であるため、その意味を本文で明確にした。字義的表現は脚注に残した。
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: 半シェケル
  rationale: 原文の貨幣・重量単位を換算せず、そのまま音写して金額を保持した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準とする
  rationale: 前置詞בְּが示す度量衡の基準を明示し、「聖所のシェケル」が公的な標準単位であることを伝えた。
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: 一シェケルは二十ゲラ
  rationale: 単位を定義する挿入的説明として、簡潔で自然な日本語にした。
- source_word: תְּרוּמָה לַיהוָה
  choice: ヤハウェへの奉納物
  rationale: תְּרוּמָהは神のために取り分けて差し出す物を指す。「奉納物」は祭儀的含意を保ちつつ、「揺祭」のような過度に限定的な訳を避ける。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文にある神の固有名を一般的な日本語表記で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、その区別を保持した。
- issue: תְּרוּמָה の祭儀的意味
  choice: 奉納物
  alternative: 献げ物／寄進
  rationale: 神に属するものとして取り分ける意味を保ちながら、特定の動作方式や教派的理解に限定しない表現を選んだ。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で威厳ある法令調の日本語とした。「シェケル」「ゲラ」は古代の単位として音写し、説明句と脚注で理解を補った。
