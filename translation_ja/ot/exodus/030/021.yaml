  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: ja
  text: 彼らは、死なないように、手と足を洗わなければならない。これは彼らにとって、彼とその子孫にとって、代々にわたる永続の定め[a]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永続の定め」は、「とこしえの定め」または「永久の定め」とも訳せる。ヘブライ語 חָק עוֹלָם は、継続的な効力をもつ規定を表す律法上の定型句である。本文の「彼」は、直前の文脈ではアロンを指す。
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: 洗わなければならない
  rationale: 律法上の指示としての命令的な効力を、現代日本語で自然かつ明確に表した。
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: 手と足
  rationale: 祭司が洗うべき身体部位を原文どおり具体的に示した。
- source_word: וְלֹא יָמֻתוּ
  choice: そうすれば、死ぬことはない
  rationale: 洗うことに結びつく結果・警告を明瞭にしつつ、目的とも結果とも取り得る関係を過度に限定しない表現とした。
- source_word: וְהָיְתָה לָהֶם
  choice: これは彼らにとって……となる
  rationale: 日本語では文脈上の指示対象を「これ」で補い、直前の洗浄規定を指すことを自然に示した。
- source_word: חָק עוֹלָם
  choice: 永続の定め
  rationale: 祭儀・律法の定型句として、長く継続する拘束力を表しつつ、現代日本語として理解しやすくした。
- source_word: לּוֹ וּלְזַרְעוֹ
  choice: 彼とその子孫にとって
  rationale: 単数代名詞を「彼」として保持し、זֶרַע は家系としての後代を自然な日本語「子孫」で表した。
- source_word: לְדֹרֹתָם
  choice: 代々にわたる
  rationale: 世代を越えて継続することを簡潔で自然な日本語で示した。
theological_decisions:
- issue: חָק עוֹלָם が示す規定の継続期間
  choice: 永続の定め
  alternative: とこしえの定め／永久の定め
  rationale: 原語は長期にわたる継続的効力を表すが、その時間的射程を哲学的な意味での無限と断定しない。「永続」は法的定型句の力を保ちながら、契約・祭儀上の文脈に開かれた表現である。
- issue: 単数形 לּוֹ の指示対象
  choice: 本文では「彼」とし、脚注でアロンを示す
  alternative: 本文で「アロン」と明示する
  rationale: 直前の文脈ではアロンを指すのが自然だが、原文の代名詞を本文に残し、解釈上の明示は脚注に置いた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法文としての厳粛さを保った。「すなわち」によって複数の「彼ら」と単数の「彼」およびその子孫との同格的関係を読みやすく示した。
