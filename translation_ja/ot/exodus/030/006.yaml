source:
  edition: WLC
  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: ja
  text: あなたはそれを、証しの箱[a]の前にある垂れ幕の前、すなわち、証しの上にある贖いの蓋[b]の前に置きなさい。そこで、わたしはあなたと会う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一般に「契約の箱」とも訳されるが、ここで用いられているヘブライ語は「証し」である。
    reason: lexical_alternative
  - marker: b
    text: 「贖罪所」とも訳される。箱の上を覆う金の蓋を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 置かなければならない
  rationale: נתןは広く「与える、置く、据える」を意味する。ここでは祭具の配置を命じる文脈なので、現代日本語として明確な「置く」を用い、指示の力を「なければならない」で表した。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 二度現れる空間的な表現を、明瞭で自然な「前に」で一貫して訳した。
- source_word: הַפָּרֹכֶת
  choice: 垂れ幕
  rationale: 聖所の内部を仕切る幕を指す。単なる「幕」より用途が分かりやすく、「ベール」より幕屋の文脈にふさわしい。
- source_word: אֲרֹן הָעֵדֻת
  choice: 証しの箱
  rationale: 原文は「契約」ではなく「証し」と明記しているため、伝統的な「契約の箱」に置き換えず、語の対応を保った。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 箱の上に置かれる金の覆いであり、贖いに関わる祭儀的意味を持つ。「蓋」によって物としての指示対象を明確にしつつ、「贖い」によって語の祭儀的含意を保った。伝統的な別訳は脚注に示した。
- source_word: הָעֵדֻת
  choice: 証し
  rationale: この節で繰り返されるעֵדוּתを同じ語で訳し、原文にない「契約」への調和を避けた。文脈上、箱に納められた証しの板を指す。
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: そこで、わたしはあなたと会う
  rationale: יעדのニファル形は定められた会見を表す。「そこで」によりשָׁמָּהの場所の指示を明示し、自然な現代日本語で訳した。
theological_decisions:
- issue: הַכַּפֹּרֶתの訳語
  choice: 贖いの蓋
  alternative: 贖罪所
  rationale: この語は箱の蓋という具体物を指すと同時に、贖いに関わる祭儀的含意を持つ。「贖いの蓋」は両面を保ち、特定の教理的説明に狭めない。伝統的な「贖罪所」は脚注に残した。
- issue: 箱の名称におけるעֵדוּתの訳語
  choice: 証し
  alternative: 契約
  rationale: 原文はこの節で「証し」を二度用いる。「契約の箱」はよく知られた名称だが、ここで別のヘブライ語を読み込まず、原文の語彙を透明に示した。
- issue: 神との会見を表すיעדのニファル形
  choice: わたしはあなたと会う
  alternative: わたしはあなたと会うことにする
  rationale: 定められた会見という含みは文脈に認められるが、本文で予定・任命の意味を過度に説明せず、原文の簡潔さと対人的表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、幕屋の祭儀にふさわしい品位を保った。「証し」「贖い」など必要な聖書用語は残し、具体物としての意味が伝わるよう「箱」「蓋」を組み合わせた。原文の二つのלִפְנֵיはともに「前に」とし、配置関係を明確にした。
