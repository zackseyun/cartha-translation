base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: ja
  text: あなたは、最上の香料を取りなさい。自然に流れ出る没薬[a]五百シェケル[c]、香り高いシナモンをその半分、すなわち二百五十シェケル、香り高い葦[b]を二百五十シェケル、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「純粋な没薬」とも訳せる。ヘブライ語は、自然の状態で流れ出る没薬を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「香り高い菖蒲」とも訳される。ヘブライ語は、より広く芳香のある葦や茎を表す。
    reason: lexical_alternative
  - marker: c
    text: 「シェケル」は原文では省かれているが、この処方の文脈と24節に基づいて補った。
    reason: implicit_unit
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: 最上の香料
  rationale: בְּשָׂמִים は香料、רֹאשׁ はここでは「主要な、最良の」という質的意味を表す。「最上の香料」はその慣用的な意味を明確で自然な日本語にする。
- source_word: מָר דְּרוֹר
  choice: 自然に流れ出る没薬
  rationale: מָר は没薬。דְּרוֹר は自由、自然に流れることを示し、加工品でなく自然に流出する状態の没薬を指す可能性が高い。「純粋な没薬」と断定せず、原語の像を保つ。
- source_word: חֲמֵשׁ מֵאוֹת
  choice: 五百シェケル
  rationale: 原文には数だけが記されているが、直後の処方と24節から重量単位はシェケルと理解される。量であることを明確にするため補った。
- source_word: קִנְּמָן בֶּשֶׂם
  choice: 香り高い肉桂
  rationale: קִנְּמָן は肉桂、בֶּשֶׂם は芳香性を示す。「甘い」では味を連想させやすいため、香りを明示した。
- source_word: מַחֲצִיתוֹ
  choice: その半分
  rationale: 接尾辞は先の五百という量を受ける。続く二百五十を同格の説明として示し、ヘブライ語の構造を保った。
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: 二百五十
  rationale: 先の五百の「半分」を具体的な数値で言い直す原文をそのまま反映した。
- source_word: קְנֵה בֹשֶׂם
  choice: 香り高い葦
  rationale: קָנֶה は葦または茎、בֹשֶׂם は芳香性を示す。「菖蒲」と植物を特定する伝統的訳もあるが、原語より限定的なので避けた。
