  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: ja
  text: アロンは年に一度、その角々の上で贖いを行う。贖罪のための罪のいけにえの血を用いて[a]、あなたがたの代々にわたり、年に一度、その祭壇のために贖いを行う。これは主にとって最も聖なるものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「贖い〔複数形〕の罪のいけにえの血から」。ここでは「贖罪のための罪のいけにえの血を用いて」と訳した。
    reason: מִן の字義的には「〜から」である前置詞と、הַכִּפֻּרִים の複数形を含む圧縮された祭儀表現について、自然な本文訳と原語の形を示すため。
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: 贖いの儀式を行う
  rationale: 祭司による祭儀的行為を表すため、抽象的な「贖う」だけでなく、儀式を執行する意味が明確になる表現とした。
- source_word: קַרְנֹתָיו
  choice: その角
  rationale: 接尾辞は直前の文脈にある香の祭壇を指す。祭壇の四隅にある角を自然な日本語で示した。
- source_word: אַחַת בַּשָּׁנָה
  choice: 年に一度
  rationale: 儀式の頻度を明瞭かつ自然に表す。
- source_word: מִדַּם
  choice: 血を用いて
  rationale: 前置詞מִןは字義上「～から」だが、ここでは贖いの儀式に用いる手段・材料を示すため、日本語では「用いて」が自然である。
- source_word: חַטַּאת
  choice: 罪のいけにえ
  rationale: 祭儀の文脈では抽象的な罪ではなく供え物を指す。一般読者に分かりやすい伝統的な祭儀用語を採った。
- source_word: הַכִּפֻּרִים
  choice: 贖罪のための
  rationale: ヘブライ語は複数形を含むが、日本語で字義どおり「贖いたちの」とすると意味が不明瞭になるため、目的・関連を示す自然な表現とし、原文の構造は脚注で示した。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたり
  rationale: イスラエルの後続世代に継続して適用されることを自然な現代日本語で表した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同語反復によるヘブライ語の最上級を表す。「至聖所」と誤解されないよう、聖性の最高度を示す表現にした。
- source_word: לַיהוָה
  choice: 主にとって
  rationale: 前置詞לְが示す帰属・関係を自然に表した。神名יהוהは、日本語聖書で広く理解される敬称「主」で訳した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: ユダヤ教の朗読伝統と日本語聖書の慣用に沿い、契約の神名を「主」と表した。特定の発音再建を本文で断定しない。
- issue: כפר の祭儀的意味
  choice: 贖いの儀式を行う
  alternative: 清める
  rationale: この語は祭壇の汚れを除く側面を含み得るが、本文は罪のいけにえの血による祭司的贖罪儀礼を述べるため、意味を清めだけに限定しなかった。
- issue: 贖いの対象
  choice: その祭壇のために
  alternative: その祭壇の上で
  rationale: עָלָיוは場所または対象・関係を表し得る。前半の「その角の上で」と区別し、後半では祭壇について贖いを行う意味を本文に採ったが、祭儀が祭壇上で行われる含意は保持される。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「贖いの儀式」は祭司的行為を明示しつつ、祭壇の清めと贖罪の関係を一方に限定しない。「その祭壇」は日本語で指示対象を明確にするため補った。
