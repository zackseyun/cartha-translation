  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: ja
  text: アロンとその息子たちは、そこから取った水で[a]、手と足を洗わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「そこから」。直前に述べられた洗盤から取った水を指す。
    reason: 原文の簡潔な前置詞句と、本文で明示した意味との対応を示すため。
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: 洗わなければならない
  rationale: 祭儀上の指示という文脈における、接続詞を伴う完了形の命令的効力を、現代日本語で明確かつ自然に表した。
- source_word: אַהֲרֹן
  choice: アロン
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: וּבָנָיו
  choice: とその子ら
  rationale: ここでは祭司として仕えるアロンの男子を指すため、性別を不必要に中和せず、簡潔な「子ら」とした。
- source_word: מִמֶּנּוּ
  choice: そこから取った水で
  rationale: 直訳は「それから」だが、日本語では洗う手段が不明瞭になりやすい。文脈上、直前の洗盤から取った水を指すことを明示しつつ、指示対象は「そこ」として保った。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: アロンとその子らに共通する身体部位として、日本語では所有代名詞を省くのが自然である。
- source_word: וְאֶת רַגְלֵיהֶם
  choice: と足
  rationale: 二つ目の直接目的語を原文どおり並列し、自然な日本語にした。
theological_decisions:
- issue: 祭司職に関する性別を伴う表現
  choice: その子ら
  alternative: その子どもたち
  rationale: 文脈ではアロンと共に祭司職を担う男子を指す。「子ら」は原語の父子関係を保ち、現代日本語でも過度に性別を曖昧にしない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、祭儀規定としての厳粛さは「洗わなければならない」で保った。「その手とその足」のような不自然な所有表現は避けた。
