id: EXO.30.15
reference: Exodus 30:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: ja
  text: 富む者は半シェケルを超えて納めてはならず、貧しい者は半シェケルに満たない額を納めてはならない。あなたがたのいのち[a]のために贖いを行うため、ヤハウェへの献納を納めるのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがた自身のため」。ヘブライ語ネフェシュは、「いのち」「人自身」「人」、また文脈によっては「魂」を意味する。ここでは、人口調査で数えられた人々のいのち、またはその人自身を指すと考えられる。
    reason: נֶפֶשׁの語義の幅と、この文脈での具体的な意味を示すため。
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: 富む者
  rationale: 定冠詞付き形容詞が人の類型を表す。対句の「貧しい者」と釣り合う、明瞭で品位ある表現とした。
- source_word: יַרְבֶּה / יַמְעִיט
  choice: 多く納めてはならず／少なく納めてはならない
  rationale: 定額の献納という文脈で、単なる増減ではなく規定額より多く、または少なく支払うことを禁じる意味を自然な日本語で示した。
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: 半シェケルより
  rationale: 比較を表す前置詞מןを、日本語の「より」で表現し、前後の多寡の両方にかかる基準額として訳した。
- source_word: תְּרוּמַת יְהוָה
  choice: ヤハウェへの献納物
  rationale: תְּרוּמָהは聖なる用途のために取り分けて差し出す物を指す。人口調査に伴う定額の納付という文脈に合わせ、「ささげ物」より具体的な「献納物」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: ヘブライ語本文にある神の固有名を音写し、称号への置換を避けた。
- source_word: לְכַפֵּר
  choice: 贖いをするため
  rationale: כפרの祭儀的・代償的な重みを保ちつつ、特定の贖罪理論に限定しない表現とした。直前の30:12の「贖い金」との文脈的連続も示す。
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: あなたがたのいのちのために
  rationale: נֶפֶשׁはここでは人口調査で数えられる各人の生命・本人を指し、非物質的な「魂」に限定されない。本文では具体的な「いのち」とし、語義の幅を注で示した。
- source_word: לָתֵת
  choice: 納めるときには
  rationale: 不定詞を献納行為の時・状況として自然に表し、固定額を納める規定との結び付きを明確にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を保持し、称号への置換によって原文上の区別を失わせないため。
- issue: נֶפֶשׁの意味
  choice: いのち
  alternative: 魂／あなたがた自身
  rationale: 人口調査と贖い金の文脈では、人間の構成要素について断定するより、数えられる者の生命・本人を指すと理解するのが適切である。
- issue: כפרの訳語
  choice: 贖いをする
  alternative: 贖罪をする／償いをする
  rationale: 祭儀的意味と30:12の贖い金との関係を保ちながら、作用の仕組みを過度に限定しないため。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある法令調を採用した。原文の富者と貧者の均衡した対句を保ち、神名は「ヤハウェ」、古代の重量・貨幣単位は「シェケル」と表記した。
