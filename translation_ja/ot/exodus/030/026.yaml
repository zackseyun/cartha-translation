  text: וּ/מָשַׁחְתָּ֥ ב֖/וֹ אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֖ת אֲר֥וֹן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: ja
  text: その油を用いて、会見の天幕とあかしの箱[a]に油を注ぎなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「契約の箱」とも訳される。ヘブライ語本文は「あかし」と記している。
    reason: 原語に即した本文訳と、広く知られた伝統的名称との違いを示すため。
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 油を注ぎなさい
  rationale: 接続詞を伴う完了形二人称男性単数は、一連の指示の中で命令として機能する。משׁחの祭儀的行為を、現代日本語で明確な「油を注ぐ」とした。
- source_word: בּוֹ
  choice: その油を用いて
  rationale: 男性単数接尾辞は直前の文脈にある聖なる注ぎの油を指し、前置詞בの道具的意味を自然な日本語で表す。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための聖所を表す定着した名称であり、構成語句の意味を簡潔に保つ。
- source_word: אֲרוֹן
  choice: 箱
  rationale: 幕屋に置かれる聖なる容器を指す。日本語聖書で認知度の高い「箱」を用いた。
- source_word: הָעֵדֻת
  choice: あかし
  rationale: 原語は「契約」ではなく「証言・あかし」を意味するため、その語彙上の区別を保った。硬さを避けつつ聖書用語として通じる表記にした。
theological_decisions:
- issue: אֲרוֹן הָעֵדֻת の訳し方
  choice: あかしの箱
  alternative: 契約の箱／証言の箱
  rationale: 本文の原語は「契約」ではなく「あかし」であるため、伝統的に知られた別称へ置き換えず、原文の語彙を保持した。「証言の箱」も直訳として可能だが、祭儀的名称としては「あかしの箱」のほうが自然である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。指示文として自然な命令形を用い、祭儀用語は日本語読者に認知されやすい表現を選んだ。
