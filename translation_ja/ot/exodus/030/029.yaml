base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: ja
  text: これらを聖別しなさい。これらは最も聖なるものとなる。これらに触れるものはすべて、聖なるものとなる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別される」。ヘブライ語は、接触によって聖なる状態になることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: 聖別しなさい
  rationale: ピエル形のקדשׁは、礼拝のために聖なるものとして取り分けることを表す。「聖別する」は祭儀的文脈に適し、現代日本語でも意味が明確である。
- source_word: אֹתָם
  choice: これらを
  rationale: 直前の文脈で列挙された幕屋の祭具などを指す。日本語では「彼ら」ではなく、物を受ける「これら」が自然である。
- source_word: וְהָיוּ
  choice: そうすれば、これらは……となる
  rationale: 先行する聖別行為の結果を示す文脈として自然に表現した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 「聖の聖」という最上級的構文を、空間名の「至聖所」と混同させず、述語として自然に訳した。
- source_word: כָּל הַנֹּגֵעַ
  choice: 触れるものはすべて
  rationale: 冠詞付き分詞による一般的表現であり、人にも物にも限定しない原文の幅を保つ。
- source_word: בָּהֶם
  choice: これらに
  rationale: 聖別された複数の祭具を受ける前置詞付き代名詞を明示した。
- source_word: יִקְדָּשׁ
  choice: 聖なるものとなる
  rationale: קדשׁのカル未完了形を変化・結果を表すものとして訳し、接触によって聖なる状態になるという含みを示した。
theological_decisions:
- issue: 接触によって生じる聖性の意味
  choice: 接触するものが聖なるものとなる、とだけ述べる
  alternative: 積極的に聖別される、または聖性の危険や制約の下に置かれると説明する
  rationale: ヘブライ語本文は、その聖性が恵み、危険、制約のいずれを意味するかを明示しないため、解釈上の緊張を本文で解消しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「聖別」は祭儀的な専門性を保ちつつ一般読者にも理解可能な語として採用した。原文の広い主語範囲と、接触による聖性の曖昧さを保持した。
