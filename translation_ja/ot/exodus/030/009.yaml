  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: ja
  text: その上で、規定外の香[a]をたいてはならない。全焼のささげ物も穀物のささげ物も、その上にささげてはならない。注ぎのささげ物を、その上に注いではならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「異質な香」「外国の香」。ヘブライ語の形容詞は、この祭儀の文脈では、許可または規定された範囲外のものを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: ささげる
  rationale: ヒフィル形は字義的には「上らせる」だが、祭儀の文脈では祭壇に供物をささげることを表す。現代日本語として自然な祭儀用語を採った。
- source_word: עָלָיו
  choice: その上に
  rationale: 文脈上、香の祭壇を指す。指示対象を本文に補わず、原文の代名詞と空間的関係を保った。
- source_word: קְטֹרֶת זָרָה
  choice: 規定外の香
  rationale: זָרָה はこの祭儀的文脈で、定められたものの範囲外にあることを示す。「異質な」「外国の」と限定せず、許可・規定に適合しない意味を明確にした。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 供物を祭壇で全焼させる祭儀を、一般読者にも意味が伝わる表現で示した。
- source_word: מִנְחָה
  choice: 穀物のささげ物
  rationale: 祭司文書の祭儀的用法では穀物による供物を指すため、広義の「供え物」ではなく具体的に訳した。
- source_word: נֵסֶךְ
  choice: 注ぎのささげ物
  rationale: 液体を注ぐ供儀を指す。専門的な「灌祭」を避け、動作とのつながりが明瞭な現代語にした。
- source_word: תִסְּכוּ
  choice: 注ぐ
  rationale: この文脈では液体の供物を注ぐ祭儀行為を表す。נֵסֶךְとの語根上・意味上の結びつきが日本語でも分かるようにした。
theological_decisions:
- issue: 香を修飾する זָרָה の祭儀上の意味
  choice: 規定外の香
  alternative: 異なる香／よその香
  rationale: 祭壇での正しい礼拝を規制する文脈に即し、民族的な「外国の」という意味に狭めず、定められたものではないという法的・祭儀的含意を示した。ただし語の別訳は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「供え物」より祭儀行為を明確にする「ささげ物」を用い、各禁止対象を読み違えないよう二文に分けた。
