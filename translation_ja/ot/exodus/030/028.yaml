translation:
  language: ja
  text: 焼き尽くすいけにえの祭壇と、そのすべての祭具、洗いのための水盤とその台。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 焼き尽くすいけにえの祭壇
  rationale: מִזְבַּחは「祭壇」、הָעֹלָהは全体を焼いてささげるいけにえを指す。祭儀用語としての意味を保ちつつ、現代の読者にも内容が伝わる表現とした。
- source_word: כָּל כֵּלָיו
  choice: そのすべての祭具
  rationale: כְּלִיは器具、用具、容器などを広く指す。ここでは祭壇に属する祭儀用の器具なので、「祭具」が簡潔で文脈に適する。接尾辞は祭壇を受けて「その」とした。
- source_word: הַכִּיֹּר
  choice: 洗盤
  rationale: כִּיּוֹרは聖所で洗い清めに用いる水盤を指す。「洗盤」は用途を示しながら、幕屋の祭具としての品位も保つ。
- source_word: כַּנּוֹ
  choice: その台
  rationale: כֵּןは洗盤を支える台または基部を指す。日本語では機能と形状を過度に限定しない「台」が自然である。
- source_word: וְאֶת
  choice: と
  rationale: 接続詞と目的語標識の反復によって列挙が続く。日本語では目的語標識を訳出せず、「と」で各項目を並列した。
