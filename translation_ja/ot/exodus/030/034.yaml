  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: ja
  text: ヤハウェはモーセに言った。「自分のために香料、すなわちナタフ香、シェヘレト香、ヘルベナ香という香料、また純粋な乳香を取りなさい。それぞれを同じ分量にしなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を日本語で一般的な形に音写した。
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める連続形。日本語では文脈上、接続語を補わなくても順次性が明確で自然である。
- source_word: קַח לְךָ
  choice: 自分のために……取りなさい
  rationale: 命令形と לְךָ の個人的・再帰的なニュアンスを保った。
- source_word: סַמִּים
  choice: 香料
  rationale: 香を調合する材料の総称として、文脈に即した明瞭で自然な語を選んだ。
- source_word: נָטָף
  choice: ナタフ香
  rationale: 物質の厳密な同定には不確かさがあるため、特定の樹脂名に断定せずヘブライ語名を音写した。
- source_word: שְׁחֵלֶת
  choice: シェヘレト香
  rationale: 物質の正確な同定が不確かなため、伝統的な推定名に限定せずヘブライ語名を音写した。
- source_word: חֶלְבְּנָה
  choice: ヘルベナ香
  rationale: 一般にガルバヌムと同定される香料だが、原語との対応を見えやすくするためヘブライ語名を音写した。
- source_word: לְבֹנָה זַכָּה
  choice: 純粋な乳香
  rationale: לְבֹנָה を定着した日本語の「乳香」、זַכָּה を「純粋な」と訳した。
- source_word: בַּד בְּבַד
  choice: それぞれを同じ分量に
  rationale: 各材料を等量にすることを示す慣用句として、現代日本語で明確に表現した。
- source_word: יִהְיֶה
  choice: しなければならない
  rationale: 単数形の動詞が列挙された材料を集合的に受ける構文を、命令に続く規定として自然な日本語にした。
theological_decisions:
- issue: 四文字神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 固有名を称号で代替せず、本文に示された神の名を保持するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「香料」という総称の後に材料を列挙し、原文の反復は日本語で冗長にならないよう一覧の構造に統合した。不確かな香料名はヘブライ語音写と脚注で示した。
