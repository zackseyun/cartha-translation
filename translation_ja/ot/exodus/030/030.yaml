  text: וְ/אֶת אַהֲרֹ֥ן וְ/אֶת בָּנָ֖י/ו תִּמְשָׁ֑ח וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם לְ/כַהֵ֥ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: ja
  text: また、アロンとその息子たちに油を注ぎ、彼らを聖別して、わたしに仕える祭司としなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: 油を注ぎ
  rationale: משׁחは、聖なる務めへの任命に際して油を注ぐ儀礼を表す。「油を注ぐ」は、その具体的な行為と宗教的含意を自然な現代日本語で保つ。
- source_word: וְקִדַּשְׁתָּ
  choice: 聖別して
  rationale: קדשׁのピエル形で、聖なるものとして取り分けることを意味する。祭司任職の文脈に適した「聖別する」を採用した。
- source_word: לְכַהֵן
  choice: 仕える祭司としなさい
  rationale: כהןの動詞形は祭司として務めることを表す。日本語では目的を示すלְと使役的な文脈を合わせ、「祭司として仕えさせなさい」より自然で格調ある表現とした。
- source_word: לִי
  choice: わたしに仕える
  rationale: 一人称接尾辞を伴う前置詞לְは、祭司の奉仕が語り手である主に向けられることを示す。「わたしに仕える」として関係を明確にした。
- source_word: בָּנָיו
  choice: その息子たち
  rationale: 本文は明確に男性複数の「息子たち」を指し、アロンの祭司家系という文脈にも合致するため、性別を中立化しない。
theological_decisions:
- issue: קדשׁとכהןの祭儀的文脈
  choice: 「聖別して、わたしに仕える祭司としなさい」
  alternative: 「聖なるものとし、わたしのために祭司として務めさせなさい」
  rationale: 祭司職への任命と、その務めが主に向けられることの両方を明瞭に表す。後代の教会制度に由来する用語は持ち込まない。
- issue: בָּנָיוの性別表現
  choice: 「その息子たち」
  alternative: 「その子どもたち」
  rationale: 原文と祭司任職の文脈が男性を明示しているため、その限定を保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭司任職の厳粛さを保った。「また」は直前から続く命令を示し、二つの動詞を日本語として自然な一連の命令にまとめた。
