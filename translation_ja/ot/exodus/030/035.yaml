source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: ja
  text: それを、香料を調合する職人の技によって調合した香、すなわち塩を加えた純粋で聖なるものにしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: それを……にしなさい
  rationale: 接続詞を伴う完了形は、この指示の文脈では命令として機能する。目的語の女性単数代名詞は前節の材料を指すため、自然な日本語で「それを」とした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 祭儀でたく香を指す標準的で簡潔な語。文脈上、香料を調合して作る聖所用の香である。
- source_word: רֹקַח מַעֲשֵׂה רוֹקֵחַ
  choice: 香料調合師の技で調合した香料
  rationale: 語根の反復と「調合する者の仕事」という職人的な含意を、重すぎない現代日本語で表した。「技」により熟練した製法であることも示した。
- source_word: מְמֻלָּח
  choice: 塩を加えた
  rationale: 塩を表す語根から成る受動分詞として、具体的な意味を保った。「塩漬けの」は香について不自然なので避けた。
- source_word: טָהוֹר
  choice: 純粋
  rationale: 物質的・祭儀的な純正さを表し、一般的な「清い」よりこの香料の文脈に適する。
- source_word: קֹדֶשׁ
  choice: 聖なる
  rationale: 神のために取り分けられた性質を直接表す。「最も聖なる」は本文にない強意を加えるため採らない。
theological_decisions:
- issue: 香の祭儀上の聖性
  choice: 聖なる
  alternative: 神聖な／最も聖なる
  rationale: ヘブライ語は単に קֹדֶשׁ と述べ、ここでは「最も聖なる」に相当する強意構文を用いていない。本文が明示する強さを越えない訳とした。
- issue: מְמֻלָּח の解釈
  choice: 塩を加えた
  alternative: よく混ぜ合わせた
  rationale: 塩に由来する通常の語義を本文に採りつつ、調合を指すとする解釈上の可能性は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「香料調合師」は古代の専門職を一般読者にも分かる形で示す語として用い、命令文は「しなさい」で統一した。
