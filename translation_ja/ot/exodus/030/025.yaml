lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: あなたはそれを…としなければならない
  rationale: 接続詞付き完了形は、この規定の文脈では命令として機能する。目的語代名詞は前節の材料から作る混合物を指す。
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: 聖なる注ぎの油
  rationale: 「聖別された注ぎのための油」という構造を、自然で格調ある日本語にした。節末の反復も同じ訳語で保った。
- source_word: רֹקַח מִרְקַחַת
  choice: 香り高い調合品
  rationale: 同根語の重なりが示す、芳香性と調合された製品という両面を簡潔に表した。
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: 香料を調合する者の技による
  rationale: 字義的な「調合する者の仕事」を、熟練した職人の技を含意する自然な日本語で表した。
- source_word: יִהְיֶה
  choice: …となる
  rationale: 調製後の結果的な状態を示す未完了形として訳した。
