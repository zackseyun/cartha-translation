  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: ja
  text: これと同じものを、その香りを嗅ぐために作る者はだれでも、その民から断たれる[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「それを嗅ぐために」。または「その香りを楽しむために」。個人的にこの香を嗅ぐ、あるいはその芳香を味わう目的を表す。
    reason: lexical_alternative
  - marker: b
    text: 「その民から断たれる」は法規定で用いられる定型句。死、共同体からの排除、または神による除去を意味し得るが、ここではその方法が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: 者はだれでも
  rationale: 直訳的には「…する人」だが、法規定における一般的・条件的な適用を、自然な現代日本語で示す。
- source_word: יַעֲשֶׂה
  choice: 作る
  rationale: 基本義「行う、作る」を保ち、香料を調合する文脈にも自然に合う。
- source_word: כָמֹהָ
  choice: これと同じもの
  rationale: 直前に定められた聖なる香の調合法を指す。単なる類似品か完全に同一の配合かには幅があるが、文脈上の禁止を明瞭に伝える。
- source_word: לְהָרִיחַ בָּהּ
  choice: 香りを楽しむために
  rationale: 字義的には「それを嗅ぐために」。ここでは個人的にその芳香を味わう目的を表すので、自然な日本語とした。字義的な別訳は脚注に残す。
- source_word: וְנִכְרַת
  choice: 断たれる
  rationale: ニファル形の法的定型句を受動表現で保持し、死、共同体からの排除、神による除去のいずれかに限定しない。
- source_word: מֵעַמָּיו
  choice: その民から
  rationale: עם は所属する民・共同体を表す。「その民から」は原文の簡潔さと契約法的な響きを保つ。
theological_decisions:
- issue: 「その民から断たれる」という刑罰句の意味
  choice: 意味を特定せず「その民から断たれる」とする。
  alternative: 「死刑に処せられる」「共同体から追放される」「神によって取り除かれる」
  rationale: このヘブライ語の法的定型句は重大な処罰を示すが、その執行形態は文脈によって議論がある。本文では神学的・法的な含みを保ち、脚注で可能性を示す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「香りを楽しむ」は目的を自然に表しつつ、字義的表現を脚注に併記した。「断たれる」は法的定型句の重さと曖昧さを保持する。
