  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: ja
  text: わたしの栄光が通り過ぎるとき、わたしはあなたを岩の裂け目に入れ、わたしが通り過ぎるまで、わたしの手であなたを覆う。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: 通り過ぎるとき
  rationale: 接続詞を伴う היה と、前置詞 בְּ を伴う不定詞連語は、後続する行為が起こる時を示す。日本語では自然な時の従属節として表した。
- source_word: כְּבֹדִי
  choice: わたしの栄光
  rationale: この神顕現の文脈では、כָּבוֹד は神の現れとしての栄光を指す。「栄光」は意味と文脈上の重みを保つ。
- source_word: וְשַׂמְתִּיךָ
  choice: わたしはあなたを…入れ
  rationale: שׂים は「置く、据える」を意味するが、場所が岩の裂け目であるため、日本語では「裂け目に入れる」が具体的で自然である。
- source_word: בְּנִקְרַת הַצּוּר
  choice: 岩の裂け目に
  rationale: נִקְרָה は岩の割れ目・裂け目を表す。日本語には英語の冠詞に相当する区別がないため、ヘブライ語の連語を自然に「岩の裂け目」とした。
- source_word: וְשַׂכֹּתִי
  choice: 覆う
  rationale: סכך の、覆って遮るという具体的な像を保持した。
- source_word: כַּפִּי עָלֶיךָ
  choice: わたしの手であなたを
  rationale: כַּף は厳密には「手のひら」も表し得るが、ここでは身体的比喩を過度に細分化せず、自然な「手」とした。עַל の関係は日本語の「覆う」の目的語によって自然に表される。
- source_word: עַד עָבְרִי
  choice: わたしが通り過ぎるまで
  rationale: עַד と一人称接尾辞付き不定詞は、覆う行為の終点を示す。日本語では完了性を文脈に委ねるこの表現が明瞭である。
theological_decisions:
- issue: 神についての擬人的表現「わたしの手」
  choice: 具体的な表現「わたしの手」を本文に残す。
  alternative: 「わたしの守り」または「わたしの力」と抽象化する。
  rationale: 原文は身体的な像を直接用いているため、神の身体性について本文以上の判断を加えず、その物語的・神顕現的な表現を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔で荘重な調子を保った。「岩の裂け目」は日本語では定・不定を明示しないため、英語訳にある冠詞上の異読注は不要と判断した。
