source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: ja
  text: するとモーセは言った。「どうか、あなたの栄光を私に見せてください。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どうか、あなたの輝きを私に見させてください」。「見せて」は字義的には「見るようにさせて」であり、「栄光」は、現れた輝きや威光を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: するとモーセは言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語の「すると」で表した。主語は直前の文脈からモーセであり、日本語では明示することで発話者を分かりやすくした。
- source_word: הַרְאֵנִי
  choice: 私に見せてください
  rationale: ראהのヒフィル命令形と一人称単数接尾辞で、字義的には「私に見させてください／私が見るようにしてください」。現代日本語では「私に見せてください」が使役的な願いを自然かつ正確に伝える。
- source_word: נָא
  choice: どうか、〜ください
  rationale: 願いや懇請を示す語気を、丁寧で切実な「どうか」と依頼表現「ください」で表した。
- source_word: אֶת
  choice: 訳語を置かない
  rationale: 定目的語を示す標識であり、日本語で独立した訳語を必要としない。
- source_word: כְּבֹדֶךָ
  choice: あなたの栄光
  rationale: כבודが持つ栄光、威光、現れた輝きという意味の広がりを保つ。「輝き」だけに限定せず、文脈上の神の顕現に関する含みを残す。
theological_decisions:
- issue: モーセが求めた「あなたの栄光」の意味
  choice: 「あなたの栄光」とし、具体性を保ちながら意味を限定しない
  alternative: 「あなたの輝き」「あなたの臨在のすべて」
  rationale: ヘブライ語は、目に見える輝き、神の威光、神の臨在の現れのどれを指すかを明示していない。「栄光」はこの神学的な幅と緊張を保ち、解釈による過度な限定を避ける。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いつつ、神に対するモーセの切実で丁寧な願いを「どうか」「ください」で表した。「栄光」は聖書語として定着しているが、現代の一般読者にも理解可能であり、原語の意味の広がりを最もよく保つ。
