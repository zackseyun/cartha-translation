revisions:
- from: それから、ヤハウェ[a]はモーセに言われた。「あなたは、あなたがエジプトの地から連れ上った民とともに、ここを出て、わたしがアブラハム、イサク、ヤコブに『あなたの子孫[b]にそれを与える』と言って誓った地へ上って行け。」
  to: それから、ヤハウェ[a]はモーセに言われた。「あなたは、あなたがエジプトの地から連れ上げた民とともに、ここから、わたしがアブラハム、イサク、ヤコブに『あなたの子孫[b]にこの地を与える』と言って誓った地へ上って行け。」
  rationale: 原文の意味と文脈上の緊張を変えず、現代日本語としての自然さを整えた。「ここから」は原文の「ここから」に対応し、「連れ上げた」は使役的な意味を保つ。「この地」は、約束の引用内で原文の女性単数目的語が指す土地を明確にする。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:39:38Z'
