id: EXO.33.1
reference: Exodus 33:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: ja
  text: それから、ヤハウェ[a]はモーセに言われた。「あなたは、あなたがエジプトの地から連れ上げた民とともに、ここから、わたしがアブラハム、イサク、ヤコブに『あなたの子孫[b]にこの地を与える』と言って誓った地へ上って行け。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な代替訳を示すため。
  - marker: b
    text: 直訳は「あなたの種」。ヘブライ語では単数形で、集合的に子孫または後代の人々を指す。
    reason: 集合単数である原語の語形と訳語の幅を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから、…言われた
  rationale: 物語を進める接続形を「それから」で表し、直接話法を導く דִּבֵּר は現代日本語として自然な「言われた」とした。神を主語とするため敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な形に音写した。
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: ここを出て、…上って行け
  rationale: 二つの命令形が示す出発と上行の両方を、自然な日本語の一続きの命令として保持した。
- source_word: אַתָּה וְהָעָם
  choice: あなたは、…民とともに
  rationale: 日本語として明瞭な同行表現にしつつ、モーセと民の双方が命令の対象であることを保った。
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: あなたが…連れ上った
  rationale: ヒフィル形の使役的意味を表し、直前の「上って行け」との語根上の響きも残した。この言い方がモーセに帰している責任の含みを弱めないようにした。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 前置詞と地名句を簡潔かつ直接的に訳した。
- source_word: נִשְׁבַּעְתִּי
  choice: わたしが…誓った
  rationale: 一人称の誓約を明確に表し、原文にない強調語は加えなかった。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: アブラハム、イサク、ヤコブに
  rationale: 三人それぞれを列挙する誓約の定型的なリズムを、自然な日本語で保った。
- source_word: לְזַרְעֲךָ
  choice: あなたの子孫
  rationale: זֶרַע は形態上は単数だが集合的に後代の子孫を指し得るため、現代日本語で明瞭な「子孫」とした。
- source_word: אֶתְּנֶנָּה
  choice: それを与える
  rationale: 女性単数接尾辞が指す「地」を受ける代名詞を用い、約束の内容を簡潔に保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として音写した。伝統的な代替表記は脚注に示した。
- issue: 「あなたが連れ上った」が示す責任の帰属
  choice: モーセを主語とする原文どおりに訳す
  alternative: 神が導き出したことを明示する言い換え
  rationale: この文脈にある神とモーセの緊張を解消せず、原文がモーセに向けて用いる二人称単数の動詞をそのまま保った。
- issue: זֶרַע の数と範囲
  choice: 集合的な「子孫」
  alternative: 単数形を字義的に示す「種」
  rationale: 語の集合単数としての通常の意味を明瞭に伝えつつ、形態上の特徴は脚注で説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言には威厳を保つ常体を採用した。「ここを出て、…上って行け」により重なる命令形を不自然に逐語化せず再現し、「あなたが…連れ上った」は文脈上の神学的緊張を保持した。固有名は一般的な聖書表記に従い、全体を朗読にも適した簡潔な文に整えた。
