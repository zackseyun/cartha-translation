  source_fidelity: 内容はヘブライ語に忠実である。二つの命令「行け、上れ」は「ここから…上って行け」に保たれ、モーセがエジプトから民を「連れ上げた」という二人称単数の表現も維持されている。約束の対象である土地は、引用内で「この地」と明示して女性単数の目的語が指す内容を自然に示した。
  naturalness: 原案の「連れ上った」は現代標準日本語では「連れ上げた」のほうが自然で読みやすい。また、「ここを出て」より「ここから」のほうが מִזֶּה に直接対応し、文の流れも滑らかである。
  terminology: 「ヤハウェ」「モーセ」「アブラハム」「イサク」「ヤコブ」は適切である。「子孫」は זֶרַע の集合的用法を明瞭に伝える。神名の脚注と「子孫」の集合単数に関する脚注も適切である。
  issues:
