  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: ja
  text: ヤハウェはモーセに言った。「あなたが語ったこのこと[a]も、わたしは行おう。あなたはわたしの目にかなっており[b]、わたしはあなたを名によって知っているからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この事柄」または「この言葉」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「わたしの目に恵みを得ている」。好意をもって受け入れられていることを表すヘブライ語の慣用句。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を、称号に置き換えず日本語で一般的な音写として示した。
- source_word: גַּם
  choice: も
  rationale: 直前までのモーセの願いに加えて、この願いにも応じるという付加の意味を自然な日本語で表した。
- source_word: הַדָּבָר הַזֶּה
  choice: このこと
  rationale: דָּבָרには「言葉」「事柄」「こと」の幅がある。ここではモーセが述べた願いの内容を指すため、「このこと」が自然で、意味を狭めすぎない。
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: あなたが語った
  rationale: モーセの発言を指す動詞のつながりを保ちつつ、明快な現代日本語とした。
- source_word: אֶעֱשֶׂה
  choice: わたしは行おう
  rationale: 神がその願いを実行すると約束する意志を表す。日本語では目的語「このこと」と自然につながる。
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: あなたはわたしの目に恵みを得ており
  rationale: 好意的に受け入れられていることを表すヘブライ語の慣用句について、「目」の比喩とחֵןの「恵み／好意」の両方を保った。
- source_word: וָאֵדָעֲךָ
  choice: わたしはあなたを知っている
  rationale: 単なる情報ではなく、神による個人的な認知を表す。日本語では現在形が文脈上の継続的な関係を自然に示す。
- source_word: בְּשֵׁם
  choice: 名によって
  rationale: モーセを個人として特定し、認めているという原文の簡潔な表現を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が神の固有名を明記しているため、その区別を保つ音写を採用した。
- issue: 「名によって知る」の関係的含意
  choice: わたしはあなたを名によって知っている
  alternative: わたしはあなたを個人的に認めている
  rationale: 神による親密で特定的な認知という含意を保ちながら、原文の「知る」と「名」の表現を解釈的に言い換えすぎないようにした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の発言にふさわしい簡潔で厳かな調子を保った。「わたし」は発話者である神を指す。原文の反復と因果関係を崩さず、一文が過度に重くならないよう二文に分けた。
