  text: וַ/יִּֽתְנַצְּל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת עֶדְיָ֖/ם מֵ/הַ֥ר חוֹרֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: ja
  text: そこでイスラエルの人々は、ホレブ山以後、身に着けていた飾りを外した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの人々は、ホレブ山で、身に着けていた飾りを外した」。ヘブライ語の句は、飾りを外した場所を示すとも、ホレブ山を起点に以後は飾りを身に着けなくなったことを示すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: 身に着けていた…を外した
  rationale: 再帰的なヒトパエル形を、現代日本語で自然に、自分の身から取り外す行為として表した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの子ら」だが、ここでは民族全体を指す慣用表現なので、明瞭で自然な日本語とした。
- source_word: עֶדְיָם
  choice: 身に着けていた飾り
  rationale: עֲדִי は装身具・飾りを広く指し、材質を宝石などに限定しない。「身に着けていた」を補って動詞との関係を明確にした。
- source_word: מֵהַר חוֹרֵב
  choice: ホレブ山を後にしてから
  rationale: מן を、ホレブ山を起点として以後その状態が続いたことを示す表現として訳した。ただし場所を示す「ホレブ山で」も文法上可能なので脚注に残した。
theological_decisions:
- issue: מֵהַר חוֹרֵב の解釈
  choice: ホレブ山を後にしてから
  alternative: ホレブ山で
  rationale: 前後の文脈では、飾りを着けない状態がホレブ以後続いたとの理解が可能である一方、句を取り外した場所の表示と取る余地もあるため、本文と脚注で曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イスラエルの子ら」という直訳調を避け、普通の読者に自然な「イスラエルの人々」とした。
