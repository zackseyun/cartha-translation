revisions:
- from: ヤハウェ[a]はモーセに言われた。「イスラエルの人々に言いなさい。『あなたがたは、うなじのこわい民である[b]。もしわたしが一瞬でもあなたがたのただ中を上って行けば[c]、あなたがたを滅ぼし尽くすだろう[d]。だから今、身に着けている飾りを外しなさい[e]。そして、あなたがたをどうするか、わたしは知ろう[f]。』」
  to: ヤハウェ[a]はモーセに言われた。「イスラエルの人々に言いなさい。『あなたがたは、うなじのこわい民である[b]。もしわたしが一瞬でもあなたがたのただ中を上って行けば[c]、あなたがたを滅ぼし尽くすだろう[d]。だから今、身に着けている飾りを外しなさい[e]。そのうえで、わたしがあなたがたをどうするかを知ろう[f]。』」
  rationale: 末尾の節だけを、明瞭な現代標準日本語として自然な語順に改めた。「そのうえで」は、装身具を外す命令に続く וְאֵדְעָה の接続を表しつつ、「決める」「見定める」といった解釈的な言い換えを避ける。「知ろう」とすることで、原文の擬人的・関係的表現と、何を行うかを開いたままにする語り方を保持した。
