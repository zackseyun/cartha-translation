  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: ja
  text: ヤハウェ[a]はモーセに言われた。「イスラエルの人々に言いなさい。『あなたがたは、うなじのこわい民である[b]。もしわたしが一瞬でもあなたがたのただ中を上って行けば[c]、あなたがたを滅ぼし尽くすだろう[d]。だから今、身に着けている飾りを外しなさい[e]。そのうえで、わたしがあなたがたをどうするかを知ろう[f]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語で記された神の固有名 יהוה の音写。伝統的に「主」と訳されることもある。
    reason: divine_name
  - marker: b
    text: 「うなじのこわい」は、頑固で従おうとしないことを表す比喩。「強情な民」とも訳せる。
    reason: idiom
  - marker: c
    text: 原文には「もし」に当たる語が明記されていない。「わたしが一瞬あなたがたのただ中を上って行き」と読むこともできる。
    reason: syntactic_ambiguity
  - marker: d
    text: 「滅ぼし尽くす」は、完全に終わらせることを表す。「滅ぼす」とも訳せる。
    reason: lexical_alternative
  - marker: e
    text: 「飾り」は、装身具や装飾品を指す。「装身具を身から取り外しなさい」とも訳せる。
    reason: lexical_alternative
  - marker: f
    text: 原文は直訳すると「そして、わたしはあなたがたをどうするかを知ろう」。神が「知る」という表現を、「決める」と言い換えずに残している。
    reason: theological_tension
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号の「主」で置き換えず、日本語で一般的な音写によって示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの息子たち」だが、ここでは民全体を指すため、現代日本語で自然かつ包摂的な表現とした。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: うなじのこわい民
  rationale: 頑固さと反抗を表すヘブライ語の身体的比喩を保持した。「強情な民」と意訳することもできる。
- source_word: רֶגַע אֶחָד
  choice: 一瞬でも
  rationale: 時間の極端な短さと、その間だけでも神が民のただ中に上れば裁きが及ぶという文脈上の条件的含みを自然な日本語で表した。
- source_word: אֶעֱלֶה בְקִרְבְּךָ
  choice: わたしが……あなたがたのただ中を上って行けば
  rationale: 「上る」という移動表現と、神の臨在に関わる「ただ中」の語を保持した。単数接尾辞は、集合体としてのイスラエルへの呼びかけである。
- source_word: וְכִלִּיתִיךָ
  choice: あなたがたを滅ぼし尽くすだろう
  rationale: כלהの「完全に終わらせる」という裁きの強さを示しつつ、日本語で明瞭にした。
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: 身に着けている飾りを外しなさい
  rationale: עֲדִיを宝石類だけに限定せず「飾り」とし、מֵעָלֶיךָの身から取り外す意味を自然に表した。
- source_word: וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ
  choice: そして、あなたがたをどうするか、わたしは知ろう
  rationale: 「知る」という原文の擬人的・関係的表現を保ち、「決めよう」などと解釈的に言い換えなかった。לְの開かれた意味を「どうするか」で保ち、処罰だけに限定しなかった。
theological_decisions:
- issue: 神が「知る」と語る擬人的表現
  choice: 「わたしは知ろう」を本文に保持
  alternative: 「わたしは決めよう」または「どうすべきか見定めよう」
  rationale: 原文はידע「知る」を用いる。神の全知との関係を翻訳で解消せず、本文固有の神学的緊張と関係的表現を残した。
- issue: イスラエルに対する集合的単数の呼びかけ
  choice: 日本語では「あなたがた」として民全体への呼びかけを明示
  alternative: 単数形に合わせて「あなた」とする
  rationale: ヘブライ語ではイスラエルを一つの集合体として単数接尾辞で受けるが、日本語の「あなた」では個人への呼びかけと誤解されやすいため、指示対象を明瞭にした。
- issue: 神が民のただ中を上る場合の条件性
  choice: 「もし……一瞬でも……上って行けば」と訳す
  alternative: 「わたしが一瞬あなたがたのただ中を上って行き、あなたがたを滅ぼし尽くす」
  rationale: 原文には明示的な条件接続詞がないものの、直前の33:3と発話の論理から仮定・条件の含みが強い。脚注で形式上の別解を示し、曖昧さを隠さないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の直接話法には簡潔で荘重な響きを持たせた。「うなじのこわい」「ただ中」「知ろう」は日常語よりやや文語的だが、原文の比喩、臨在の語感、擬人的表現を保つために採用した。
