  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: ja
  text: モーセはヤハウェに言った。「ご覧ください。あなたは私に、『この民を連れて上って行け』と言われます。しかし、だれを私と共に遣わされるのか、私には知らせておられません。それなのに、あなたは、『わたしはあなたを名によって知っている[a]。また、あなたはわたしの目にかなっている[b]』と言われました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「名によって知っている」は、その人を個人的に知っていること、また好意を寄せていることを表す言い回し。
    reason: cultural_note
  - marker: b
    text: 直訳すると「あなたはわたしの目に恵みを見いだした」。わたしの好意を得ている、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を日本語で音写した。
- source_word: רְאֵה
  choice: ご覧ください
  rationale: モーセが訴えを切り出す命令形の直接性を保ちつつ、神への発話として自然な敬意を示した。
- source_word: הַעַל אֶת הָעָם הַזֶּה
  choice: この民を連れ上れ
  rationale: ヒフィル形の使役的・方向的意味を保ちながら、日本語として不自然な「上らせよ」を避け、旅の文脈に合う表現とした。
- source_word: לֹא הוֹדַעְתַּנִי
  choice: 私に知らせておられません
  rationale: ידעのヒフィル形「知らせる」を反映し、単なる「言う」より原文の使役的意味を保った。
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: だれを私と共に遣わすのか
  rationale: אֲשֶׁרの指示対象を同行者と理解しつつ、具体的な人物を補わず、「共に」によってעִםの同行の意味を保持した。
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: わたしはあなたを名によって知っている
  rationale: 個人的な認知と顧みを表す慣用句を解釈的に言い換えず、「名によって」を明示した。
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: あなたはわたしの目に恵みを得た
  rationale: 「目に」と「恵みを得る」というヘブライ語の比喩を残し、神の好意を受けたという意味が分かる表現にした。
- source_word: וְגַם
  choice: また
  rationale: 二つ目の言明を加える原文の付加的強調を明示した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、称号へ置換せず音写し、契約の神の名であることを保持した。
- issue: 「名によって知っている」の含意
  choice: 慣用句を本文に残し、脚注で個人的な認知と顧みを説明する
  alternative: 「あなたを個人的に知っている」「あなたを選んだ」
  rationale: 原文には親しい認知と好意の含みがあるが、「選び」を明示するところまでは述べていないため、神学的な意味を過度に限定しなかった。
- issue: חֵןの訳語
  choice: 恵み
  alternative: 好意
  rationale: 神から受ける好意という意味を保ちつつ、聖書文体として自然な「恵み」を採用した。脚注で慣用句全体の意味を補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、モーセが神に訴える場面にふさわしい敬意と厳粛さを保った。神の引用部分では一人称を「わたし」とし、話者の切り替わりを分かりやすくした。
