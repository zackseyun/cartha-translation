    issue: 「あなたはわたしの目に恵みを得た」
    rationale: 原文の「わたしの目に恵みを見いだした」は好意を得る慣用句だが、現行訳は日本語の格関係と連語としてぎこちない。「わたしの目にかなっている」として意味を自然に伝え、脚注で原文の比喩と「好意を得た」の意味を補う。
