- from: モーセはヤハウェに言った。「ご覧ください。あなたは私に、『この民を連れ上れ』と言われます。しかし、だれを私と共に遣わすのか、私に知らせておられません。それなのに、あなたは、『わたしはあなたを名によって知っている[a]。また、あなたはわたしの目に恵みを得た[b]』と言われました。」
  to: モーセはヤハウェに言った。「ご覧ください。あなたは私に、『この民を連れて上って行け』と言われます。しかし、だれを私と共に遣わされるのか、私には知らせておられません。それなのに、あなたは、『わたしはあなたを名によって知っている[a]。また、あなたはわたしの目にかなっている[b]』と言われました。」
  rationale: 現行訳の神名、話者区分、原文の反復と対比は維持した。その上で、עלהの方向性を「連れて上って行け」で自然に表し、מצא חן בעיניのヘブライ語慣用句を現代日本語として自然な「わたしの目にかなっている」に改めた。脚注は本文の慣用的な訳を補い、原文の比喩と個人的な認知・好意の含意を示す。
