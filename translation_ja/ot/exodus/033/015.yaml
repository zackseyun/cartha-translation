  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אִם אֵ֤ין פָּנֶ֨י/ךָ֙ הֹלְכִ֔ים אַֽל תַּעֲלֵ֖/נוּ מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: ja
  text: モーセは主に言った。「もしあなたご自身[a]が共に行ってくださらないのなら、私たちをここから上らせないでください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたご自身」は、直訳では「あなたの顔」。ヘブライ語では「顔」がその人自身の臨在を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: モーセは主に言った
  rationale: ヘブライ語は代名詞で「彼は彼に言った」とするが、直前の文脈上、話者はモーセ、相手は主である。日本語で指示対象を明確にし、自然な物語文とした。接続辞の継起性は文脈で十分に表されるため、機械的な「それから」は置かない。
- source_word: אִם אֵין
  choice: もし…くださらないのなら
  rationale: 条件を導く אִם と否定存在辞 אֵין の組み合わせを、丁重な依頼に自然につながる日本語の否定条件で表した。
- source_word: פָּנֶיךָ
  choice: あなたご自身
  rationale: 字義は「あなたの顔」だが、ここでは神の人格的な臨在を指す。「あなたご自身」は単なる抽象概念としての「臨在」より関係的な力を保ち、現代の一般読者にも理解しやすい。字義的表現は脚注に示す。
- source_word: הֹלְכִים
  choice: 共に行ってくださらない
  rationale: 分詞が表す同行の継続的な動きを文脈に即して表現した。「共に」はこの節の願いの中心である神の同行を明確にする補足であり、敬語はモーセが神に直接語る日本語として自然である。
- source_word: אַל תַּעֲלֵנוּ
  choice: 私たちを…上らせないでください
  rationale: אַל と未完了形による否定の願いを、丁重だが切実な依頼として訳した。עלה のヒフィルの使役的意味と移動表現を「上らせる」で保持した。
- source_word: מִזֶּה
  choice: ここから
  rationale: 現在地を指す前置詞付き指示語を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 神について用いられる פָּנֶיךָ の訳し方
  choice: あなたご自身
  alternative: あなたの御顔／あなたの臨在
  rationale: 原語の「顔」は神の人格的な臨在を表す慣用表現である。「あなたご自身」と訳して神が民と同行するという関係的意味を伝えつつ、身体的な顔だけを意味するとの誤解を避けた。原語の比喩は脚注で開示した。
- issue: 神の同行を表す הֹלְכִים
  choice: 共に行ってくださらない
  alternative: 行かれない／進まれない
  rationale: 文脈上の焦点は、神が単に移動することではなくイスラエルに同行することである。「共に」を補ってその含意を明確にしたが、同行の仕方や神学的機序までは規定していない。
translation_notes:
  register: 明瞭な現代標準日本語。神への直接話法には「くださる」「ください」を用いて敬意と切実な願いを表した。「臨在」のような教会用語を本文では避け、一般読者にも分かる「あなたご自身」を採用した。脚注記号 [a] は本文末に置き、該当する比喩の説明へ導いた。
