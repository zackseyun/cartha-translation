id: EXO.33.10
reference: Exodus 33:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: ja
  text: 民は皆、雲の柱が天幕の入り口に立っているのを見ると、立ち上がり、それぞれ自分の天幕の入り口でひれ伏した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「礼拝した」。ヘブライ語の動詞は、敬意を表して身を低くする身体的な動作を指し、しばしば礼拝行為を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: 見ると
  rationale: 後続する動作との時間的なつながりを自然な日本語で表し、物語の進行を示す。
- source_word: כָל הָעָם
  choice: 民は皆
  rationale: イスラエルを文中に補わず、集団全体を指す原文を簡潔かつ自然に表す。
- source_word: עַמּוּד הֶעָנָן
  choice: 雲の柱
  rationale: 目に見える神の臨在のしるしという具体的な比喩を保つ、定着した訳語である。
- source_word: עֹמֵד
  choice: 立っている
  rationale: 柱が入り口に位置している光景を、原文の分詞に即して直接的に表す。
- source_word: פֶּתַח הָאֹהֶל
  choice: 天幕の入り口
  rationale: この節に明記されない「会見の」を補わず、文脈上の特定の天幕を定冠詞相当の文脈で示す。
- source_word: וְקָם
  choice: 立ち上がり
  rationale: 民が応答して身を起こす動作を、現代日本語として自然かつ格調を損なわず表す。
- source_word: וְהִשְׁתַּחֲווּ
  choice: ひれ伏した
  rationale: 礼拝を意味し得ると同時に、原語が表す身体的な敬意の動作を保持し、意味を一方に限定しない。
- source_word: אִישׁ
  choice: それぞれ
  rationale: 男性単数の分配的用法を、日本語で不自然に性別を強調せず、一人一人という構図を正確に表す。
- source_word: פֶּתַח אָהֳלוֹ
  choice: それぞれ自分の天幕の入り口で
  rationale: 各人が自分の天幕の入り口にいたという分配的な情景と所有関係を明確に表す。
theological_decisions:
- issue: 神の臨在のしるしに対する民の応答
  choice: ひれ伏した
  alternative: 礼拝した
  rationale: この動詞は礼拝行為を指し得るが、身体を低くする動作そのものも表す。本文では具体的動作を保持し、宗教的意味を脚注で示すことで、語義上の幅と文脈上の敬虔な応答の双方を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文にふさわしい品位を保った。「天幕」を用いて幕屋時代の具体的情景を示し、「それぞれ」によって分配的な表現を自然に再現した。
