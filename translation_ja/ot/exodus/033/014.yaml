  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: ja
  text: 主は言われた。[a]「わたしの臨在があなたと共に行き、わたしがあなたに安息を与える。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語で直訳すると「わたしの顔が行く」。「顔」はここでは主の臨在を表す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 主は言われた
  rationale: 主語は直前の文脈にある主（ヤハウェ）。日本語では主語を明示することで話者を分かりやすくし、連続叙述の接続辞וַは不自然に直訳しない。
- source_word: פָּנַי
  choice: わたし自身
  rationale: 字義は「わたしの顔」だが、この文脈では神ご自身の臨在を表す。「わたし自身」は同行する主体が主ご自身であることを自然に示し、元の比喩は脚注に残す。
- source_word: יֵלֵכוּ
  choice: 共に行き
  rationale: 動詞は字義的には「行く」。文脈上、モーセと民への同行を意味するため、日本語では「共に」を補って関係を明確にする。
- source_word: וַהֲנִחֹתִי
  choice: 安息を与える
  rationale: נוחのヒフィル形が持つ「休ませる、安息を与える」という使役的意味を、約束の語調を保つ自然な日本語で表す。
- source_word: לָךְ
  choice: あなたに
  rationale: 二人称男性単数を保持し、この発言が直接にはモーセ一人に向けられていることを示す。
theological_decisions:
- issue: פָּנַיの擬人的表現
  choice: わたし自身
  alternative: わたしの顔／わたしの臨在
  rationale: 「顔」というヘブライ語の像は重要だが、日本語本文で「わたしの顔が行く」とすると意味が伝わりにくい。「わたし自身」は、抽象的な力ではなく主ご自身が同行するという意味を保つ。字義は脚注で示す。
- issue: לָךְの単数性
  choice: あなたに
  alternative: あなたがたに
  rationale: 語形は単数であり、直接の聞き手であるモーセを指す。共同体への含意を本文で複数形に広げず、原文の形式を保つ。
- issue: וַהֲנִחֹתִיが指す安息の性質
  choice: 安息を与える
  alternative: 休ませる／安住の地へ導く
  rationale: 語は休息・安住の含みを持ちうるが、この短い発言だけで目的地や具体的状況に限定しない。「安息」として意味の広がりと神学的緊張を保つ。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で荘重な神の約束の語調とした。「安息」は日常語の「休み」より広い意味を保てる聖書的な標準語として用いた。
