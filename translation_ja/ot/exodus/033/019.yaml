revisions:
- from: すると、彼は言った。「このわたしが、わたしのすべての善をあなたの前を通らせ、あなたの前でヤハウェという名を宣言する。わたしは、恵もうとする者を恵み、あわれもうとする者をあわれむ[a]。」
  to: すると、彼は言った。「わたし自身が、わたしのすべての善をあなたの前を通らせ、あなたの前でヤハウェという名を宣言する。わたしは、わたしが恵みを与える者に恵みを与え、わたしがあわれみを示す者にあわれみを示す[a]。」
