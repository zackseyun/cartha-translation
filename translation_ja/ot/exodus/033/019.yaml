source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: ja
  text: すると、彼は言った。「わたし自身が、わたしのすべての善をあなたの前を通らせ、あなたの前でヤハウェという名を宣言する。わたしは、わたしが恵みを与える者に恵みを与え、わたしがあわれみを示す者にあわれみを示す[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「わたしが深いあわれみを示す者に、深いあわれみを示す」。
    reason: רחםは「あわれみを示す」のほか、深い同情・慈しみを表し得る。原文の同語根反復と、神を主語とする関係節を保つ。
lexical_decisions:
- source_word: אֲנִי
  choice: このわたしが
  rationale: 動詞の人称表示に加えて明示された代名詞の強調を表す。「わたしだけが」として排他性を加えることは避けた。
- source_word: אַעֲבִיר
  choice: 通らせ
  rationale: עברのヒフィル形が持つ使役の意味を保ち、神がご自身の善をモーセの前に通らせることを自然な日本語で表した。
- source_word: כָּל טוּבִי
  choice: わたしのすべての善
  rationale: טוּבは善良さ、恵み深い性質、そこから現れる良きものを含み得る。外見上の美や賜物だけに狭めず、神の自己顕示という文脈に合う「善」とした。
- source_word: עַל פָּנֶיךָ
  choice: あなたの前を
  rationale: 字義的な顔への言及を不自然に持ち込まず、顕現の空間的な動きを表す日本語の慣用表現とした。
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: ヤハウェという名を宣言する
  rationale: この文脈のקרא בשםは祈り求めることではなく、神の名と、その名によって示されるご性質を告げることを指す。「という名」により、ヤハウェご自身が宣言の主体であることとの混同も避けた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号の「主」に置き換えず、本文に記された神の固有名を音写した。
- source_word: לְפָנֶיךָ
  choice: あなたの前で
  rationale: モーセの面前で名が宣言されるという場所・臨在の意味を、自然な日本語で保った。
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: 恵もうとする者を恵み
  rationale: 同じ語根を反復するヘブライ語の強調を、「恵む」の反復によって保った。
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: あわれもうとする者をあわれむ
  rationale: רחםの「深くあわれむ、憐れみを示す」という意味を表し、原文の同語根反復も維持した。
theological_decisions:
- issue: 恵みとあわれみに関する神の自己宣言
  choice: 「恵もうとする者を恵み、あわれもうとする者をあわれむ」と一人称の反復をそのまま保つ
  alternative: 一般的な神の慈愛の原則として意訳する、または後代の決定論的体系を明示する
  rationale: 原文は、神が恵みとあわれみを示す自由を強調的な反復で語る。後代の教理論争を本文に持ち込まず、その主権性と未解消の緊張を保持した。
translation_notes:
  register: 明快な現代標準語を用いながら、神の厳かな自己宣言にふさわしい格調を保った。「このわたしが」で明示代名詞の強調を示し、二つの同語根反復は日本語でも対応する動詞を繰り返して再現した。
