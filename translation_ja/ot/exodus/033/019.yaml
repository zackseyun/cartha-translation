  naturalness: 「このわたしが」は不自然ではありませんが、明快な現代標準語としては「わたし自身が」のほうが強調を自然に表せます。「わたしのすべての善」はやや抽象的ながら、神の自己顕現の文脈では許容されます。
  terminology: 「ヤハウェ」は四文字神名の方針に適合しています。「恵みを与える」「あわれみを示す」は、両節で同じ語を反復でき、חןとרחםの区別も明瞭です。脚注の代案も、原文の反復に対応する形へ整える必要があります。
