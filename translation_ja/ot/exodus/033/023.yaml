source:
  edition: WLC
  text: וַ/הֲסִרֹתִי֙ אֶת כַּפִּ֔/י וְ/רָאִ֖יתָ אֶת אֲחֹרָ֑/י וּ/פָנַ֖/י לֹ֥א יֵרָאֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: ja
  text: それから、わたしは手を退ける。あなたはわたしの背[a]を見る。しかし、わたしの顔は見られない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの後ろ」「わたしの後方の部分」。ヘブライ語は、背面または後方の側面を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: それから、わたしの手を退けると
  rationale: 使役形の「取り除く、退ける」と、前節から続く順次的な働きを自然な日本語で表した。後続する結果とのつながりも「と」で示した。
- source_word: כַּפִּי
  choice: わたしの手
  rationale: כַּף は「手のひら」または「手」を意味する。前節の覆い守る描写に合い、日本語として自然な「手」を採った。
- source_word: וְרָאִיתָ
  choice: あなたは…見る
  rationale: 未来的文脈に続く結果を表すものとして訳した。
- source_word: אֲחֹרָי
  choice: わたしの後ろ
  rationale: 「背、後部、後方」を表しうる語の幅を保つため、「背中」に限定せず「後ろ」とした。身体的比喩を残しつつ、原語の曖昧さを保っている。
- source_word: וּפָנַי
  choice: しかし、わたしの顔は
  rationale: 接続詞は、見ることのできるものとできないものとの対照を明示するため逆接で訳した。פָּנִים の具体的な「顔」は保持した。
- source_word: לֹא יֵרָאוּ
  choice: 見ることができない
  rationale: ニファル形の「見られない」を、日本語で自然な可能表現として訳した。神の顔が人の視界に入ることはない、という受動的な意味を保つ。
theological_decisions:
- issue: 神についての擬人的表現
  choice: 「手」「後ろ」「顔」という具体的表現を本文に残す。
  alternative: 「臨在」「残光」などの抽象的表現に置き換える。
  rationale: ヘブライ語本文の擬人的イメージと、神の自己啓示をめぐる神学的緊張を説明的に解消せず、そのまま伝えるため。
- issue: אֲחֹרָי の指示内容
  choice: 「わたしの後ろ」と訳し、何を意味するかを限定しない。
  alternative: 「わたしの背中」と身体部位に限定して訳す。
  rationale: 原語は背面・後方・後部を指しうるため、具体性を保ちながらも意味を狭めすぎない表現を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の発話にふさわしい簡潔で荘重な文体とした。身体的比喩は弱めず、「見ることができない」は不自然な直訳調を避けた。
