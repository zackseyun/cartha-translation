source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: ja
  text: しかし、神は言われた。「あなたはわたしの顔[a]を見ることはできない。人[b]はわたしを見て、生きたままでいることはできないからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの臨在」。ヘブライ語では直訳すると「わたしの顔」。
    reason: lexical_alternative
  - marker: b
    text: ここでの「人」は、性別を問わず、すべての人間を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、言われた
  rationale: 接続詞は物語を進めるが、直前のモーセの願いに対する対照的な応答なので「しかし」とした。文脈上、話者は明らかであり、原文にない名を補わず、日本語として自然な敬語表現にした。
- source_word: לֹא תוּכַל
  choice: あなたは…できない
  rationale: יכלはここでは許可ではなく能力・可能性を表すため、「してはならない」ではなく「できない」とした。
- source_word: לִרְאֹת
  choice: 見る
  rationale: ראהの基本的な視覚認知の意味を、明瞭な現代日本語で表した。
- source_word: אֶת־פָּנַי
  choice: わたしの顔
  rationale: פָּנִיםの具体的な表現を保った。「臨在」と解釈的に置き換えず、その可能性は脚注に示した。
- source_word: כִּי
  choice: …からである
  rationale: 直前の不可能性に対する理由を導く説明的用法を明確にした。
- source_word: לֹא יִרְאַנִי
  choice: わたしを見て…できない
  rationale: 未完了形が表す一般的原則を、後続の生存という結果と一続きの自然な日本語で表した。
- source_word: הָאָדָם
  choice: 人
  rationale: 定冠詞付き単数形だが、ここでは特定の男性ではなく人類一般を指す。日本語の「人」は単数的な形と包括的意味の双方を自然に保てる。
- source_word: וָחָי
  choice: なお生きている
  rationale: 神を見た後も生き続けるという結果・継続を「なお」で明確にし、単なる一時的な生存ではない含意を自然に表した。
theological_decisions:
- issue: 神についての「わたしの顔」という擬人的表現
  choice: 本文では「わたしの顔」を保持する
  alternative: わたしの臨在
  rationale: 原文の具体的表現と、その表現がもつ神学的緊張を解消せずに残した。「臨在」は可能な意味合いとして脚注に示す。
- issue: הָאָדָםの総称的意味
  choice: 「人」と訳し、人類一般を指すことを脚注で明示する
  alternative: 人間／人類
  rationale: 原文の単数形を過度に抽象化せず、日本語で性別を限定しない総称表現とした。
- issue: 神を見ることと生存できないことの関係
  choice: 「見て、なお生きていることはできない」と訳す
  alternative: わたしを見る者は生きられない
  rationale: 原文が述べる一般的な不可能性と結果を保ち、その理由や仕組みを本文に付加しない。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、神の発言にふさわしい簡潔で荘重な調子を保った。原文の擬人的表現は本文に残し、解釈的な言い換えは脚注に限定した。
