  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: ja
  text: ですから、今、もし私があなたの目にかなっているなら、私があなたを知り、あなたの目にかなうように、どうかあなたの道[a]を私に知らせてください。そして、この国民があなたの民であることを心に留めてください。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「あなたの道」を複数形でいう。神の行動のあり方、また取り扱いを指しうる。
    reason: lexical_alternative
  - marker: b
    text: 「心に留めてください」は直訳すれば「見てください」。ここでは、この事実をよく認め、配慮するよう求める表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ですから今
  rationale: 時間的な「今」と、直前の文脈を受ける推論・移行の力をともに表す。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 私があなたの目に恵みを得ている
  rationale: 「あなたの目に」というヘブライ語の比喩を保ちつつ、好意を受けているという意味が通じる表現とした。
- source_word: הוֹדִעֵנִי נָא אֶת דְּרָכֶךָ
  choice: どうかあなたの道々を私に知らせてください
  rationale: 使役形の「知らせる」と、複数形「道々」を反映する。「道々」は神の行動の仕方・取り扱いを指しうる。
- source_word: וְאֵדָעֲךָ
  choice: そうすれば、私はあなたを知り
  rationale: 文脈上の目的・結果を自然に示しながら、単なる情報ではない人格的な「知る」を保つ。
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: あなたの目に恵みを得ることができます
  rationale: 目的を表す לְמַעַן と、前半と同じ「恵みを得る」という反復を保持する。
- source_word: וּרְאֵה
  choice: 心に留めてください
  rationale: 字義は「見てください」だが、ここでは相手に事実を認識し配慮するよう求める慣用的な命令として訳した。
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: この国民があなたの民であること
  rationale: גּוֹי を「国民」、עַם を「民」と訳し、民族・国家的表現と契約関係を示す表現の双方を保つ。
theological_decisions:
- issue: 結びの句における契約的含意
  choice: この国民があなたの民であること
  alternative: この民があなたの民であること
  rationale: 原文が用いる גּוֹי（国民）と עַם（民）を別々に訳し、モーセの訴えに含まれる両面を平板化せずに残した。
- issue: 神を「知る」という表現
  choice: 私はあなたを知り
  alternative: 私はあなたについて知り
  rationale: 目的語が神自身であることを保ち、認識だけに限定せず人格的・関係的な幅を残した。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、祈願の厳粛さを保つ文体とした。「道々」は原文の複数形を明示するための意図的な表現。
