source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: ja
  text: ヤハウェは、人が友と語るように、モーセと顔と顔を合わせて[a]語られた。モーセは宿営に戻ったが、モーセに仕えるヌンの子ヨシュアという若者は、天幕の中から離れなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「直接に」または「親しく」。ヘブライ語の「顔と顔を合わせて」は、きわめて直接的な対話・会見を表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: この「天幕」は会見の天幕を指す。
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: 語られた
  rationale: この文脈では、会見の天幕で繰り返されていた習慣的な行為を表す。日本語では不自然な反復表現を避け、前後の叙述の中で慣習性が伝わる簡潔な過去形とした。
- source_word: יְהוָה
  choice: 主
  rationale: 現代日本語の聖書文体で神名を明瞭かつ自然に示す定着した表現を用いた。
- source_word: פָּנִים אֶל־פָּנִים
  choice: 顔と顔を合わせて
  rationale: 直接で親しい対話を示すヘブライ語の比喩を保持し、文字どおり神の顔を見たとの解釈に限定しない表現とした。
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: 人が友と語るように
  rationale: אִישׁ の一般的な用法と רֵעַ の親しい関係性を、自然な現代日本語で表した。
- source_word: וְשָׁב אֶל־הַמַּחֲנֶה
  choice: モーセは宿営に戻った
  rationale: 主語を補って曖昧さを避け、イスラエルの陣営を指す הַמַּחֲנֶה を「宿営」とした。文脈上は反復的な行為だが、日本語では単純過去でもその流れを自然に表せる。
- source_word: וּמְשָׁרְתוֹ
  choice: 彼に仕える
  rationale: 補佐役として仕える関係を表し、奴隷的な含意を避けた。
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: ヌンの子ヨシュア
  rationale: ヘブライ語の父称を日本語の聖書文体として自然な語順で示した。
- source_word: נַעַר
  choice: 若者
  rationale: 年若い男性または若い従者を表し得る語だが、奉仕の役割は直前ですでに示されているため、年齢面を簡潔に表した。
- source_word: לֹא יָמִישׁ מִתּוֹךְ הָאֹהֶל
  choice: 天幕の中から離れなかった
  rationale: מוּשׁ の「立ち去る、離れる」と מִתּוֹךְ の内部からという空間表現を保った。
- source_word: הָאֹהֶל
  choice: 天幕
  rationale: 直前の文脈にある会見の天幕を指す。本文では原語どおり簡潔に「天幕」とし、脚注で指示対象を明示した。
theological_decisions:
- issue: 主がモーセと「顔と顔を合わせて」語るという擬人的表現
  choice: 「顔と顔を合わせて」を本文に保持し、直接で親しい出会いを表す表現とした
  alternative: 「直接に」または「親しく」と意訳する
  rationale: 神を見ることに関する他の箇所との緊張を翻訳で解消せず、原文の比喩と神学的な含みを保つため。
- issue: יְהוָה の訳出
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語として自然で尊厳ある定着表現を採用したが、これは固有の神名を表す語である。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい簡潔さと品位を保った。「顔と顔を合わせて」は原文の印象と神学的緊張を残し、脚注で慣用的意味を補った。
