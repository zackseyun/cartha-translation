base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: ja
  text: 主は言われた。「見よ、わたしのそばに場所がある。あなたはその岩の上に立ちなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く理解される伝統的な表記で示した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 注意を促す提示表現の力を保ちつつ、簡潔で dignified な聖書日本語とした。
- source_word: מָקוֹם אִתִּי
  choice: わたしのそばに場所がある
  rationale: אִתִּי の近接・同伴の意味を自然に表し、場所が主の近くにあるという原文の曖昧さを保った。
- source_word: וְנִצַּבְתָּ
  choice: あなたは…立ちなさい
  rationale: 接続完了形を文脈上の指示として訳し、モーセに求められる行為を明確にした。
- source_word: הַצּוּר
  choice: その岩
  rationale: 定冠詞を「その」で表し、特定の岩を指すことを保持した。
theological_decisions:
- issue: 神の近くにある「場所」の性質
  choice: わたしのそばに場所がある
  alternative: わたしと共にいるための場所がある
  rationale: 原文は場所の神学的性質を説明していないため、神との交わり等の解釈を付加せず、空間的・関係的な含みを残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、「見よ」「主」など簡潔で荘重な聖書語彙を用いた。発話者の威厳と直接的な命令を保っている。
