revisions:
- from: 乳と蜜の流れる地へ。だが、わたしはあなたのただ中にあって上って行くことはしない[a]。あなたはうなじのこわい民なので、道中でわたしがあなたを滅ぼし尽くすことのないためである[b]。
  to: 乳と蜜の流れる地へ。というのも、わたしはあなたがたのただ中にあって上って行かない[a]。あなたがたは強情な民なので、道中であなたがたを滅ぼし尽くしてしまわないようにするためである[b]。
  rationale: 原文の二つの כִּי による説明・理由の関係を「というのも」「ので」で明示した。「あなたがた」は集合的単数の二人称接尾辞がイスラエル全体を指すことを自然な日本語で表す。「ただ中にあって」は神の内在的臨在の含意を保ち、פֶּן の避けるべき結果は「〜してしまわないようにするため」で表した。さらに、両脚注をそれぞれが説明する本文箇所へ正しく移動した。
