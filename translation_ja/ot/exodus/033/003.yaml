id: EXO.33.3
reference: Exodus 33:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: ja
  text: 乳と蜜の流れる地へ。というのも、わたしはあなたがたのただ中にあって上って行かない[a]。あなたがたは強情な民なので、道中であなたがたを滅ぼし尽くしてしまわないようにするためである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの中で」「あなたがたと共に」。
    reason: בְּקִרְבְּךָ は直訳すると「あなたのただ中に」であり、民の内における神の臨在を示す。文脈上、「あなたがたと共に」と訳すこともできる。
  - marker: b
    text: 「滅ぼし尽くす」は「滅ぼす」「絶やす」とも訳せる。
    reason: כלה のピエル形には、完全に終わらせる、滅ぼす、絶やすという意味の幅がある。
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: 地へ
  rationale: 前節から続く行き先を示す句として、方向を表す אֶל を簡潔に訳した。文脈上は約束の地を指すが、原文に定冠詞がないため「その地」とはしなかった。
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: 乳と蜜の流れる
  rationale: 土地の豊かさを表す定型的な比喩を、現代日本語でも自然で聖書的な表現として保持した。
- source_word: כִּי לֹא אֶעֱלֶה
  choice: だが、わたしは…上って行くことはしない
  rationale: 最初の כִּי は目的地の約束と神の同行拒否との強い対照を示すものとして「だが」とした。עלה の移動と上昇の含みを「上って行く」で保った。
- source_word: בְּקִרְבְּךָ
  choice: あなたのただ中にあって
  rationale: イスラエルを集合的な単数で呼ぶ表現を保ち、単なる同行以上に、民の内部に臨在するという空間的・契約的含意を示した。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: うなじのこわい民
  rationale: 頑固に抵抗する姿を表すヘブライ語の身体的比喩を平板化せず、日本語で定着した表現にした。
- source_word: פֶּן
  choice: …ことのないため
  rationale: 神が民のただ中に上らない理由として、避けるべき結果を導く פֶּן の含みを自然な日本語で表した。
- source_word: אֲכֶלְךָ
  choice: あなたを滅ぼし尽くす
  rationale: כלה のピエル形が表す「完全に終わらせる、滅ぼす」という厳しさを明確にしつつ、裁きの具体的手段は付加しなかった。単数目的語は民全体を指す。
- source_word: בַּדָּרֶךְ
  choice: 道中で
  rationale: 約束の地へ向かう旅の途中を指す簡潔で自然な表現とした。
theological_decisions:
- issue: 神の臨在を表す בְּקִרְבְּךָ
  choice: あなたのただ中にあって上って行くことはしない
  alternative: あなたと一緒に上って行くことはしない
  rationale: 聖なる神が反抗的な民の内部に臨在することの危険という緊張を保ち、単なる同行の拒否へ弱めないため。
- issue: אֲכֶלְךָ が表す神の裁きの厳しさ
  choice: あなたを滅ぼし尽くす
  alternative: あなたを焼き尽くす／あなたを滅ぼす
  rationale: 民を完全に終わらせる可能性を表す語義を保ちながら、原文に明示されない火のイメージは持ち込まないため。
- issue: 二つの כִּי の関係
  choice: 最初を対照の「だが」、二つ目を理由の「ので」とする
  alternative: 最初を理由の「というのは」とする
  rationale: 目的地の約束と神の臨在拒否との対照を自然に示しつつ、後半では民の頑迷さが拒否の理由であることを明示した。接続詞の談話機能には幅があるため、脚注で別解を示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「うなじのこわい」は比喩を保持するための聖書的表現であり、全体は過度に文語的にならないよう整えた。節頭は前節から続く断片であるため、原文の構造を尊重して「地へ」とした。
