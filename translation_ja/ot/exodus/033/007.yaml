  text: וּ/מֹשֶׁה֩ יִקַּ֨ח אֶת הָ/אֹ֜הֶל וְ/נָֽטָה ל֣/וֹ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֗ה הַרְחֵק֙ מִן הַֽ/מַּחֲנֶ֔ה וְ/קָ֥רָא ל֖/וֹ אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֙ כָּל מְבַקֵּ֣שׁ יְהוָ֔ה יֵצֵא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִ/ח֥וּץ לַֽ/מַּחֲנֶֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: ja
  text: モーセは天幕[a]を取り、宿営の外、それも宿営から遠く離れた所に、自分のために張るのを常としていた[b]。彼はそれを「会見の天幕」と呼んだ。ヤハウェを求める者は皆、宿営の外にある会見の天幕へ出て行くのが常だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「その天幕」。それがモーセ自身の天幕なのか、この目的のために用いた別の天幕なのかは明記されていない。
    reason: lexical_alternative
  - marker: b
    text: 「取る」と、後半の「出て行く」に用いられたヘブライ語の動詞形は、ここでは習慣的な行為を表すと考えられる。「取った」「出て行った」と単純過去に訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: 取るのを常としていた
  rationale: 物語中の未完了形を、ここでは反復的・習慣的な行為として表した。単発の過去「取った」とする余地は注で示す。
- source_word: הָאֹהֶל
  choice: 天幕
  rationale: 定冠詞を伴う「その天幕」だが、日本語では文脈上自然な「天幕」とした。本文は「モーセの天幕」と明示していないため、所有者を限定しない。
- source_word: וְנָטָה לוֹ
  choice: 自分のために張る
  rationale: נטה は天幕について「張る」、לוֹ は受益・用途を示すものとして「自分のために」と訳し、モーセ自身の所有物だと断定することは避けた。
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: 宿営から遠く離れた所に
  rationale: 直前の「宿営の外」を強め、宿営との距離を強調する表現を保った。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: מוֹעֵד が表す定められた会合・出会いの場という意味を、定着した明瞭な日本語で示した。
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: ヤハウェを求める者は皆
  rationale: בקש の、神を求めることと神に伺いを立てることの双方を含み得る広がりを「求める」で保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: יֵצֵא
  choice: 出て行ったものだった
  rationale: 未完了形の習慣的・反復的な意味を自然な日本語の回想的表現で示した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を用いているため、そのことを読者に見える形で保ち、称号への置換や別の伝統的音写を採らなかった。
- issue: 「ヤハウェを求める」の意味範囲
  choice: 求める
  alternative: 伺いを立てる
  rationale: 礼拝的に神を求めることと、神の指示を尋ね求めることのどちらにも解し得るため、意味を一方に限定しない語を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文として落ち着きのある文体とした。「宿営」「天幕」「会見の天幕」は文脈上の重要語として統一し、原文の反復と距離の強調を保った。
