base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: ja
  text: わたしはあなたの前に御使い[a]を遣わし、カナン人、アモリ人、ヒッタイト人、ペリジ人、ヒビ人、エブス人を追い出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「使者」。ヘブライ語は、天上の使いにも人間の使者にも用いられる。ここでは文脈から「御使い」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: わたしは…遣わし
  rationale: 接続詞を伴う完了形は、ここでは神の発言における将来の行為を表す。後続の動詞と自然につながるよう連用形で訳した。
- source_word: לְפָנֶיךָ
  choice: あなたの前に
  rationale: 直訳的な意味と、先立って行くというヘブライ語の慣用的意味の双方を保つ、明瞭で格調ある表現。
- source_word: מַלְאָךְ
  choice: 御使い
  rationale: 人間の使者にも天的な使者にも用いうる語だが、この文脈では天的な存在が適切。「御使い」は日本語聖書として自然でありつつ、その身元を特定しない。語の幅は脚注に示した。
- source_word: וְגֵרַשְׁתִּי
  choice: 追い払う
  rationale: גרשׁが表す、土地から住民を退去させる行為を、現代日本語で明瞭に表す。
- source_word: הַכְּנַעֲנִי הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: カナン人、アモリ人、ヒッタイト人、ペリジ人、ヒビ人、エブス人
  rationale: 定冠詞付き単数の民族名は集合的用法であるため、日本語では各民族全体を指す「～人」とした。列挙順を原文どおり保持した。
theological_decisions:
- issue: מַלְאָךְ の身元
  choice: 「御使い」と一般的に訳し、特定の御使いまたは「主の使い」とは断定しない。
  alternative: 「使者」、または「その御使い」と訳す。
  rationale: この節はמַלְאָךְの身元を明示していない。天的存在という文脈上の理解を本文に反映しながらも、定冠詞や固有の称号を補わず、神学的同定を未決のまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発言にふさわしい簡潔で dignified な調子とした。「御使い」は伝統的な聖書用語だが一般読者にも理解可能であり、脚注で語義上の曖昧さを明示した。
