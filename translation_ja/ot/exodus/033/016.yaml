language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: ja
  text: それでは、いったい何によって、私とあなたの民があなたから好意を受けていることが分かるのでしょうか。あなたが私たちとともに行ってくださり、その結果、私とあなたの民が、地の上にいるすべての民と区別される[a]ことによってではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「特別なものとされる」または「分けられる」。このヘブライ語動詞は、他とは異なる際立ったものとして示されることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה ... אֵפוֹא
  choice: それでは、いったい何によって
  rationale: 接続、推論・強調、手段を問う疑問を一続きの自然な日本語で表し、直前の文脈を受ける議論の流れを保った。
- source_word: יִוָּדַע
  choice: 分かるのでしょうか
  rationale: ニファル形の「知られる」を、受動的な意味を損なわず、現代日本語の修辞疑問として自然に表した。
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 私とあなたの民があなたの目に好意を得ていること
  rationale: 「目に恵みを見いだす」というヘブライ語慣用句を、神から好意的に見られ受け入れられているという関係的意味が伝わるようにした。「私とあなたの民」は原文では節の後に置かれるが、日本語では従属節内に組み込んだ。
- source_word: אֲנִי וְעַמֶּךָ
  choice: 私とあなたの民
  rationale: モーセ自身と民との明示的な組み合わせを二度とも保持した。
- source_word: הֲלוֹא
  choice: ことによってではありませんか
  rationale: 肯定の答えを予期する修辞疑問の形を保った。
- source_word: בְּלֶכְתְּךָ עִמָּנוּ
  choice: あなたが私たちとともに行ってくださり
  rationale: 神の同行が、その好意を認識させる手段であることを表した。「行ってくださり」は日本語として自然に神の恩恵的な同行を示すが、原文にない具体的な導き方は加えていない。
- source_word: וְנִפְלֵינוּ
  choice: 区別される[a]
  rationale: ニファル形の、他と異なるものとして際立たされる、あるいは分けられる意味を簡潔に表した。語の含む「特別なものとされる」という含意は脚注で示した。
- source_word: מִכָּל הָעָם
  choice: すべての民と
  rationale: 集合的・分配的な意味を日本語の「すべての民」で表した。比較・分離を示す מִן は「と区別される」という自然な構文に組み込んだ。
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: 地の面にいる
  rationale: 世界に住む諸民族を指す定型表現を、原文の比喩を保ちながら理解できる日本語にした。
theological_decisions:
- issue: イスラエルを他の民と区別するもの
  choice: 神が民とともに行くことが、その民を他のすべての民と区別するしるしであると訳した。
  alternative: 律法、土地、民族的出自などを区別の主因として補う。
  rationale: 本文は区別を神の同行に直接結び付けているため、その因果・手段関係を保持し、別の神学的要素を補わなかった。
- issue: וְנִפְלֵינוּ の意味の幅
  choice: 本文では「区別される」とし、特別なものとされる含意を脚注に残した。
  alternative: 「特別なものとされる」または「分けられる」と本文で訳す。
  rationale: 語は単なる分離以上に際立ったものとなる意味を帯び得るが、ここでは諸民族との対比が明示されるため、「区別される」が最も明確で、意味の幅も過度に限定しない。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用いつつ、モーセの切実な修辞疑問と神への敬意を保った。「地の面」は原文の定型表現を映すため保持した。英語参照文では脚注記号が「好意」の後に置かれていたが、脚注内容が説明する語は וְנִפְלֵינוּ であるため、日本語本文では「区別される」の後に付した。
