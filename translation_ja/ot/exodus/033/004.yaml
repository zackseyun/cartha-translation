  text: וַ/יִּשְׁמַ֣ע הָ/עָ֗ם אֶת הַ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה וַ/יִּתְאַבָּ֑לוּ וְ/לֹא שָׁ֛תוּ אִ֥ישׁ עֶדְי֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: ja
  text: 民はこの悪い知らせ[a]を聞いて嘆き悲しみ、だれ一人、飾り[b]を身に着けなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この悪い言葉」または「この悪い事柄」。ここでは、直前に告げられた内容を指す。
    reason: lexical_alternative
  - marker: b
    text: 「装身具」または「身を飾る物」とも訳せる。ヘブライ語は装飾のために身に着ける物を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: 民は……を聞いて
  rationale: 集合名詞「民」を自然な日本語の単数的主語として扱い、שׁמעは直前の告知を耳にする文脈に即して「聞く」とした。
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: この悪い知らせ
  rationale: דברの基本義は「言葉／事柄」だが、ここでは直前に告げられた内容を指すため、日本語では「知らせ」が自然である。רָעの否定的評価を「悪い」で保持した。より字義的な表現は脚注に示した。
- source_word: וַיִּתְאַבָּלוּ
  choice: 嘆き悲しみ
  rationale: אבלのヒトパエル形は深い悲嘆と服喪の行為を表す。「嘆き悲しむ」は感情面を明瞭に伝え、続く装身具を外す服喪的行動にも自然につながる。
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: だれ一人……身に着けなかった
  rationale: אישの分配的用法を、現代日本語で明確な「だれ一人……なかった」によって再現した。שׂיםとעליוはこの目的語との組み合わせでは「身に着ける」が自然である。
- source_word: עֶדְיוֹ
  choice: 飾り
  rationale: עֲדִיは装身具や装飾品を広く指し、特定の種類の宝飾品に限定されないため、包括的で平明な「飾り」とした。各人の持ち物を指す単数接尾辞の分配的意味は文全体で表した。
