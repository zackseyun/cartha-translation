  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: ja
  text: モーセがその天幕[a]へ出て行くたびに、民は皆立ち上がり、一人一人[b]が自分の天幕の入り口に立って、モーセが天幕に入るまで、その後を目で追った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は単に「天幕」とある。文脈上、前後の節で述べられる会見の天幕を指す。
    reason: lexical_alternative
  - marker: b
    text: 原文は「男（人）」の単数形。この形は、民の一人一人を指して配分的に用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּצֵאת
  choice: 出て行くたびに
  rationale: וְהָיָה と未完了形が反復される慣例的な出来事を表し、כְּ＋不定詞構文が時を示すため、自然な現代日本語で反復性を明示した。
- source_word: הָאֹהֶל
  choice: その天幕
  rationale: 定冠詞付きの「天幕」を訳した。ここでは文脈上、宿営の外に設けられた会見の天幕を指すが、原文にはこの節で「会見の」という語はないため本文に補わなかった。
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: 立ち上がり、…立って
  rationale: קוםは起立する動作、נצבはその場に立つことを表す。日本語では反復性を前の「たびに」に担わせ、簡潔に訳した。
- source_word: אִישׁ
  choice: 一人一人
  rationale: 男性単数形が民の構成員それぞれを指して配分的に用いられている。「一人一人」はその機能を自然な日本語で表す。原文の男性形については脚注に示した。
- source_word: פֶּתַח אָהֳלוֹ
  choice: 自分の天幕の入り口
  rationale: 接尾代名詞を配分的な主語に合わせて「自分の」とし、פתחを明瞭な「入り口」と訳した。
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: モーセの後を目で追った
  rationale: אַחֲרֵיを伴う表現は、遠ざかるモーセの方を見続けることを示す。「後を目で追う」は、追随するとの誤解を避けつつ方向性を自然に伝える。
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: 天幕に入るまで
  rationale: 方向を示す語尾を伴う הָאֹהֱלָה と בוא が天幕の中への移動を表すため、「入る」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「出て行くたびに」によって一連の動作が習慣的に繰り返されたことを示し、後続の動詞を不自然な「ものだった」の反復なしにまとめた。
