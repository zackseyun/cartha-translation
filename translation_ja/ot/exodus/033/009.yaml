source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: ja
  text: モーセが幕屋に入るたびに、雲の柱が降りて来て、幕屋の入り口に立った。そして、彼はモーセと語った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より明示的には、「主がモーセと語った」。ヘブライ語ではこの句の主語が省略されているが、文脈上は主を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: 入るたびに
  rationale: וְהָיָה と כְּ＋不定詞構文が示す、過去に繰り返された出来事を、自然な現代日本語で表した。
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: 幕屋
  rationale: この節のヘブライ語は「会見の幕屋」という完全な名称ではなく、既出の「幕屋」を指すため、語を補わず「幕屋」とした。
- source_word: יֵרֵד
  choice: 降りて来て
  rationale: 話者の視点から地上へ下る動きを自然に表し、反復的な文脈は「入るたびに」で示した。
- source_word: עַמּוּד הֶעָנָן
  choice: 雲の柱
  rationale: 連語の具体的な比喩を保ち、日本語の聖書語としても明瞭な表現を用いた。
- source_word: וְעָמַד
  choice: 立った
  rationale: 雲の柱が幕屋の入り口にとどまって位置する様子を、原文の動詞に即して表した。反復性は前の時間節が文全体に及ぶ。
- source_word: פֶּתַח הָאֹהֶל
  choice: 幕屋の入り口
  rationale: פתח の空間的意味を、現代日本語で分かりやすく表した。
- source_word: וְדִבֶּר
  choice: 語った
  rationale: 原文では男性単数の動詞だけがあり、主語は明示されていない。日本語でも主語を補わず、その形式上の含みを保った。
- source_word: עִם מֹשֶׁה
  choice: モーセと
  rationale: עם の「～と／～と共に」という相互的・人格的な語感を保ち、「モーセに」よりも原文に近くした。
theological_decisions:
- issue: 「モーセと語った」の主語
  choice: 本文では主語を明示せず、「語った」とした。
  alternative: 「主がモーセと語った」と明示する。
  rationale: 文脈上は主が語ることを指すが、ヘブライ語本文はこの節で主語を明記していない。日本語の主語省略を用いて原文の形式を保ち、文脈上の指示対象は脚注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「幕屋」は文脈上すでに特定されている天幕を表す語として用いた。反復的な出来事は「入るたびに」で明示し、最後の動詞の主語は原文に合わせて補わなかった。
