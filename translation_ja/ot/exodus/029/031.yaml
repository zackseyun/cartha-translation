base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: ja
  text: あなたは任職のための雄羊[a]を取り、その肉を聖なる場所[b]で煮なさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別のための雄羊」。ヘブライ語のこの語は、祭司を務めに就かせる儀式を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖所」。ただし、ヘブライ語はより直訳的には「聖なる場所」とある。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: 雄羊
  rationale: 犠牲動物を指す標準的な意味を、自然で簡潔な日本語で表した。
- source_word: הַמִּלֻּאִים
  choice: 任職の
  rationale: 祭司を務めに就かせる儀式を指す専門語であり、「手を満たす」という語源的表現を逐語訳せず、文脈上の機能を明確にした。
- source_word: תִּקָּח
  choice: 取り
  rationale: 二人称単数への指示を、後続の命令と自然につながる連用形で表した。
- source_word: וּבִשַּׁלְתָּ
  choice: 煮なさい
  rationale: בשׁל がこの文脈で液体を用いて煮ることを表すため、一般的な「料理する」より具体的に訳した。
- source_word: בְּשָׂרוֹ
  choice: その肉
  rationale: 日本語では食用・犠牲動物の בשר を「肉」とするのが自然であり、指示対象が雄羊であることも明瞭である。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 聖なる場所で
  rationale: 名詞と形容詞に定冠詞がなく、特定の幕屋内部の区画に限定せず、原文どおり聖別された場所を表した。
theological_decisions:
- issue: 祭司就任儀礼を表す הַמִּלֻּאִים の訳語
  choice: 任職の雄羊
  alternative: 聖別の雄羊
  rationale: この語には聖別の側面もあるが、ここでは祭司をその務めに就かせる儀礼上の機能を「任職」がより明確に示す。別訳は脚注に残した。
- issue: בְּמָקוֹם קָדֹשׁ が一般的な聖なる場所か、固有の区画「聖所」か
  choice: 聖なる場所
  alternative: 聖所
  rationale: 原文は無冠詞であり、幕屋の特定区画を必ずしも指さない。本文では限定を避け、可能な特定的理解を脚注で示した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある命令文とした。「あなた」は単数のモーセを指す。祭儀上の専門性は「任職」で保ちつつ、脚注で別訳を提示した。
