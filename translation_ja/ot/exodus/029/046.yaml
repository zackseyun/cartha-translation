  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: ja
  text: 彼らは、わたしがヤハウェ、彼らの神であり、彼らをエジプトの地から導き出したのは彼らのただ中に住むためであったことを知る。わたしはヤハウェ、彼らの神である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 彼らは……知る
  rationale: 接続詞を伴う完了形は、ここでは先行する約束の結果として将来に実現する認識を表す。日本語では文脈上、非過去形で自然にその将来・結果の意味を伝えられる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、一般的な学術的音写で示す。
- source_word: אֱלֹהֵיהֶם
  choice: 彼らの神
  rationale: 形態上は複数形に見える語だが、神名と結びつく契約的文脈ではイスラエルの唯一の神を指す。
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: 彼らをエジプトの地から導き出した
  rationale: 出エジプトを表す定型的な使役表現を、原文の起点「から」を保ちながら自然な日本語にした。
- source_word: לְשָׁכְנִי
  choice: 住むために
  rationale: 前置詞לְを伴う不定詞連語の目的の意味を明示する。「宿る」よりも、神が民の間に継続して臨在する文脈に適した平明な「住む」を用いる。
- source_word: בְתוֹכָם
  choice: 彼らのただ中に
  rationale: 字義的な空間性と、契約共同体の中における神の臨在を保つ。単なる近接とも読める「彼らと共に」より原文に近い。
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: わたしは彼らの神ヤハウェである
  rationale: 原文の自己宣言と契約定式を簡潔で荘重な現代日本語として保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、その区別を保つ音写とし、称号への置換や別の伝統的発音を採らない。
- issue: 出エジプトの目的を示す句
  choice: 彼らのただ中に住むために
  alternative: 彼らのただ中に住むべく／彼らのただ中に住むことによって
  rationale: לְשָׁכְנִי はここで目的を表すのが最も自然であり、救出が神の臨在を目的としているという本文の関係を明確にする。ただし、それ以上の教義的含意は付加しない。
- issue: 関係節の係り先
  choice: 「彼らの神ヤハウェ」を説明する一続きの関係節として訳す
  alternative: 「彼らは、わたしが彼らの神ヤハウェであることを知る。わたしは……導き出した」と区切る
  rationale: אֲשֶׁר は直前の「わたしはヤハウェ、彼らの神」に続き、その神が出エジプトを行った方であることを説明する。日本語でも統語関係を明確に保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の自己宣言には「である」体を用いて荘重さを保った。「ただ中」は原文 בְּתוֹכָם の空間的・共同体的含意を自然に伝える。注記を必要とするほどの本文上の異読や不可避の多義性はないため、脚注は付していない。
