revisions:
- from: 彼らは、わたしが彼らの神ヤハウェであり、彼らのただ中に住むために、彼らをエジプトの地から導き出した者であることを知る。わたしは彼らの神ヤハウェである。
  to: 彼らは、わたしがヤハウェ、彼らの神であり、彼らをエジプトの地から導き出したのは彼らのただ中に住むためであったことを知る。わたしはヤハウェ、彼らの神である。
  rationale: 神名と「彼らの神」の同格関係を自然な日本語の語順に改めた。また、לְשָׁכְנִיの目的を「導き出したのは……ため」として明示し、救出行為と神の居住の目的関係を曖昧にせず保持した。意味の追加や教義的解釈は行っていない。
