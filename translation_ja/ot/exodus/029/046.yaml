  naturalness: 現行の「彼らの神ヤハウェ」は現代標準日本語ではやや不自然で、神名と同格の関係が直ちに分かりにくい。「ヤハウェ、彼らの神」とすることで、原文の定型を自然かつ明瞭に示せる。
  terminology: 神名は原文および英語POBの方針に従い、一貫して「ヤハウェ」とする。「神」「導き出す」「ただ中に住む」は本文の意味と荘重で明瞭な文体に適合する。
