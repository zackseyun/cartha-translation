  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ja
  text: 次に、二匹目の雄羊を取り、アロンとその息子たちは、その雄羊の頭に手を置く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 次に、…を取り
  rationale: 接続詞付き完了形は一連の儀式手順における指示を表す。「次に」で手順の進行を示し、連用形「取り」で後続の指示へ自然につなげた。
- source_word: הָאַיִל הַשֵּׁנִי
  choice: 二匹目の雄羊
  rationale: אַיִל は「雄羊」、הַשֵּׁנִי は順序を示す「第二の」。現代日本語として自然で、先に出た雄羊との順序関係も明確な「二匹目」とした。
- source_word: וְסָמַךְ
  choice: 手を置く
  rationale: 犠牲の儀礼における סמך は、手を動物の上に置く行為を指す。「押しつける」と強さを限定せず、定着した明瞭な表現を採った。
- source_word: אַהֲרֹן וּבָנָיו
  choice: アロンとその息子たち
  rationale: בָנָיו はこの祭司任職の文脈ではアロンの男子を指すため、「息子たち」とした。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: ヘブライ語は複数形だが、日本語では複数の人が各自の手を置く場合も通常「手」と表現する。人数を明示する必要はなく、原文の集団的行為を自然に伝える。
- source_word: עַל רֹאשׁ הָאָיִל
  choice: その雄羊の頭に
  rationale: עַל の位置関係を自然な日本語の助詞「に」で表し、既出の二匹目の雄羊を「その雄羊」と受けた。
theological_decisions:
- issue: 按手の儀礼に後代の神学的意味を持ち込まないこと
  choice: その雄羊の頭に手を置く
  alternative: その雄羊の頭に手を押しつける
  rationale: 本文は儀礼行為を記すだけで、その象徴的意味を説明していない。罪の移転、同一化、任職など特定の解釈を訳文に加えず、具体的な動作のみを示した。
translation_notes:
  register: 明瞭で現代的ながら、儀礼規定にふさわしい簡潔で品位ある文体。「次に」によって前後する奉献手順との連続性を示した。
