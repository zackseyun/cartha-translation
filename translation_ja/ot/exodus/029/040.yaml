  source_fidelity: 内容はヘブライ語本文にほぼ忠実である。供え物用の上質の小麦粉、その小麦粉に混ぜる四分の一ヒンのカーティート油、ならびに四分の一ヒンのぶどう酒による注ぎのささげ物を、一匹の子羊に対応させる構造を正しく伝えている。ただし「十分の一エファ」は日本語では量の係り方がやや不明瞭であり、原文で暗黙のエファを補うなら「一エファの十分の一」とするのが明確である。
