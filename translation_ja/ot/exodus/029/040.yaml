  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: ja
  text: また、一エファの十分の一の上質の小麦粉を、オリーブを砕いて得た油四分の一ヒンと混ぜ、四分の一ヒンのぶどう酒を注ぎのささげ物として、一匹の子羊に添える。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִשָּׂרֹן סֹלֶת
  choice: また、上質の小麦粉十分の一エファ
  rationale: עִשָּׂרוֹןは祭儀用量として一エファの十分の一を指す。日本語では単に「十分の一」では単位が不明瞭なため、「エファ」を補って明確にした。סֹלֶתは供え物に用いる精製度の高い小麦粉を表す。
- source_word: בָּלוּל בְּשֶׁמֶן כָּתִית
  choice: 砕いたオリーブから採った油と混ぜ
  rationale: בָּלוּל בְּは「…と混ぜた」の意。כָּתִיתはオリーブを砕く、または打つ製法を表すため、油そのものを「砕いた」と誤解させない自然な表現にした。
- source_word: רֶבַע הַהִין
  choice: 四分の一ヒン
  rationale: 古代の液量単位を換算せず保持し、分数を明瞭に示した。
- source_word: וְנֵסֶךְ רְבִעִית הַהִין יָיִן
  choice: ぶどう酒四分の一ヒンを注ぎのささげ物として
  rationale: נֶסֶךְは祭壇に注ぐ供え物を指す祭儀用語。「注ぎのささげ物」は行為と用途が現代の読者にも分かる。
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: 一匹の子羊に
  rationale: 冠詞付きの「一」は文脈上、二匹のうち一方、特に先の一匹を指し得るが、本文では解釈を限定せずヘブライ語の表現を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀単位「エファ」「ヒン」は保持し、כָּתִיתは日本語で油自体を砕くとの誤読を避けるため製法を明示した。主節は周辺節から続く規定なので、自然な命令・規定文として「添える」で結んだ。
