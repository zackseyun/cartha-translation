  text: וְ/שָׁחַטְתָּ֥ אֶת הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ja
  text: あなたは会見の天幕の入り口で、ヤハウェ[a]の前にその雄牛を屠りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文では、神名を表す四文字「YHWH」（יהוה）。その正確な古代の発音は確定していない。伝統的には「主」と訳され、ほかに「エホバ」という表記もある。
    reason: 神名の読みと訳し方に複数の伝統があるため。
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: 屠りなさい
  rationale: 接続詞を伴う完了形は、一連の祭儀指示における命令として機能する。「屠る」は単なる「殺す」よりも犠牲をささげる文脈に即している。
- source_word: הַפָּר
  choice: その雄牛
  rationale: פַּרは祭儀文脈で雄牛を指す。「その」は直前までに指定された雄牛を受ける定冠詞を表す。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵיの空間的・祭儀的意味を保ち、神の御前で行うことを自然な現代日本語で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に記された神名四文字を称号に置き換えず、一般的な推定発音で音写する。
- source_word: פֶּתַח
  choice: 入り口で
  rationale: 行為が行われる場所を示すため、自然な日本語の場所格「で」を用いる。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルの聖所を表す定型名称として、מוֹעֵדの「会見・定められた集まり」の含みを保つ、明瞭で定着した訳語を採る。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が称号ではなく固有の神名を用いていることを明示する。発音は確定不能であるため、その点を脚注で示す。
translation_notes:
  register: 祭儀上の厳粛さを保ちつつ、現代の一般読者に明瞭な命令文とした。「屠りなさい」は犠牲祭儀に適した語だが、過度に古風ではない。「会見の天幕」は出エジプト記における施設名として統一的に用いる。
