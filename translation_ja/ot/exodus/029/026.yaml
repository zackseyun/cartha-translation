  to: あなたは、アロンの任職儀式のための雄羊[a]から胸の部分を取り、それをヤハウェの前で揺祭として揺り動かしなさい。それはあなたの受ける分となる。
  rationale: 揺祭を表す名詞 תְּנוּפָה の祭儀行為としての機能を本文に反映させ、「奉献物として」を「揺祭として」に改めた。また、「任職の雄羊」を自然で意味の明確な「任職儀式のための雄羊」とした。その他の語順、神名、割当分の表現は原文に忠実であり、変更を要しない。
