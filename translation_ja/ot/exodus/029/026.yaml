base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: ja
  text: あなたは、アロンの任職儀式のための雄羊[a]から胸の部分を取り、それをヤハウェの前で揺祭として揺り動かしなさい。それはあなたの受ける分となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別の雄羊」。ヘブライ語の専門語は、祭司職に就ける儀式で用いる雄羊を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: 胸の部分
  rationale: 犠牲動物の胸部として祭司に割り当てられる特定の部位を指すため、自然で明確な「胸の部分」とした。
- source_word: אֵיל הַמִּלֻּאִים
  choice: 任職の雄羊
  rationale: מִלֻּאִים は祭司職に就ける儀式を指す専門語であり、日本語では「任職」が職務への就任という文脈を簡潔に伝える。
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: アロンのための
  rationale: לְ の関係を所有と断定せず、この雄羊がアロンの任職儀礼のためのものであることを表した。
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: それを奉献物として……揺り動かしなさい
  rationale: 動詞 נוּף の動作を「揺り動かす」で保持しつつ、名詞 תְּנוּפָה が儀礼上の奉献物を表すことが分かるようにした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 祭儀的な「御前で」の意味を明瞭にし、神名 יְהוָה は固有名「ヤハウェ」とした。
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: それはあなたの受ける分となる
  rationale: מָנָה の割り当てられた取り分という意味を、現代日本語で自然に表現した。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号に置き換えず、一般的な学術的音写によって示した。
- issue: הַמִּלֻּאִים の祭儀的意味
  choice: 任職
  alternative: 聖別、充足
  rationale: アロンを祭司職に就ける儀礼という職務上の側面を表す。「聖別」も可能なので脚注に残した。
- issue: תְּנוּפָה の訳し方
  choice: 奉献物として揺り動かす
  alternative: 揺祭として揺り動かす、奉献のしるしとして差し出す
  rationale: 実際の動作を原文どおり保持しながら、その行為が祭儀的な奉献であることも伝えた。動きの厳密な様態は原文から確定しないため詳述しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令文として訳し、祭儀用語は過度に専門的にならないよう本文で意味を示した。「ヤハウェ」は原文の神名を音写した。
