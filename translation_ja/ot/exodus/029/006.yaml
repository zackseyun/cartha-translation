  text: וְ/שַׂמְתָּ֥ הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וְ/נָתַתָּ֛ אֶת נֵ֥זֶר הַ/קֹּ֖דֶשׁ עַל הַ/מִּצְנָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: ja
  text: 彼の頭にターバンをかぶせ、そのターバンの上に聖なる冠飾り[a]を付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なる冠」。ヘブライ語ネーゼルは、聖別された冠状の標章を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: かぶせ
  rationale: שׂיםは「置く、据える」を意味するが、頭にターバンを置く動作は、現代日本語では「かぶせる」が自然であり、具体的な儀礼行為を明確に表す。
- source_word: הַמִּצְנֶפֶת
  choice: ターバン
  rationale: מִצְנֶפֶתは祭司が頭に巻くかぶり物を指す。「ターバン」は現代の一般読者に分かりやすく、「冠」などとの混同も避けられる。
- source_word: עַל רֹאשׁוֹ
  choice: その頭に
  rationale: 前後の文脈で指示対象となる人物を受けつつ、עַלの位置関係を簡潔に保持する。
- source_word: וְנָתַתָּ
  choice: 付ける
  rationale: נתןは広く「与える、置く、据える」を意味する。ここでは額飾りをターバン上に装着する儀礼なので、「付ける」が自然で具体的である。
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: 聖なる額飾り
  rationale: נֵזֶרは献別や聖別を示す冠状のしるしを表し得る。出エジプト記28章36–38節の金の札との関係と装着位置を踏まえ、「額飾り」とすることで王冠を連想させすぎず、祭司の頭飾りとして自然に伝える。「聖なる」はהַקֹּדֶשׁの聖性を保持する。
- source_word: עַל הַמִּצְנָפֶת
  choice: そのターバンの上に
  rationale: עַלが示す、額飾りをターバン上に置く位置関係をそのまま保つ。日本語で対象を明確にするため「その」を補った。
theological_decisions:
- issue: נֵזֶרを王権的な「冠」と訳すか、祭司装束の飾りとして訳すか
  choice: 本文では「額飾り」とし、注で「聖なる冠」の可能性を示す
  alternative: 聖なる冠
  rationale: נֵזֶרには「冠、聖別のしるし」という意味幅がある。文脈上は祭司のターバンに付ける品であるため「額飾り」が具体的だが、「冠」という語義も排除せず脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、祭司任職の儀礼命令にふさわしい簡潔で品位ある調子にした。連続する二つの動作は「かぶせ」「付ける」で自然に表現した。
