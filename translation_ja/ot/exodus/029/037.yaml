  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: ja
  text: 七日間にわたって、祭壇のために贖いを行い、それを聖別しなければならない。祭壇は最も聖なるものとなる。祭壇に触れるものはすべて、聖なるものとなる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭壇に触れるものはすべて、聖でなければならない」。ヘブライ語は、接触によって聖性が及ぶとも、聖なる者またはものだけが祭壇に触れなければならないとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: 贖いの儀式を行い
  rationale: 祭司儀礼の文脈で、祭壇を清めて聖別するための贖いの行為を指す。「贖う」だけでは対象や儀礼性が伝わりにくいため、この表現とした。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇のために
  rationale: 前置詞 עַל はここでは כפר の対象を示し、祭壇のために贖いの儀式を行うという祭儀的用法である。
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: これを聖別しなければならない
  rationale: 祭壇を聖なる用途のために取り分ける行為を、現代日本語の祭儀用語として明確に表した。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 同語根を重ねるヘブライ語の最上級的表現を自然な日本語で示した。「至聖のもの」より一般読者に分かりやすい。
- source_word: כָּל הַנֹּגֵעַ
  choice: 触れるものはすべて
  rationale: この分詞表現は人にも物にも適用し得るため、「人」や「物」の一方に限定しない訳とした。
- source_word: יִקְדָּשׁ
  choice: 聖なるものとなる
  rationale: 接触の結果として聖なる状態になるという受動的・起動的な意味を本文に反映した。単に既存の状態を述べる「聖である」にはしなかった。
theological_decisions:
- issue: 祭壇との接触によって生じる聖性の意味
  choice: 祭壇に触れるものが聖なるものとなる
  alternative: 祭壇に触れる者は聖でなければならない、または聖なる者だけが触れることができる
  rationale: יִקְדָּשׁ の素直な文法的意味は、接触したものが聖なる状態になるというものである。ただし、聖なるものだけが祭壇に触れ得るという規定として理解する余地もあるため、脚注で解釈上の緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「贖いの儀式」「聖別」は祭儀的文脈に必要な用語として用い、文脈から意味を把握しやすい形にした。原文の二人称単数は「あなた」で明示した。
