source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: ja
  text: 祭壇の上にある血の一部と、聖別のための油の一部を取り、それらをアロンとその衣服、彼と共にいる息子たちとその息子たちの衣服に振りかけなさい。こうして、アロンとその衣服、彼と共にいる息子たちとその息子たちの衣服は、聖なるものとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別される」。ヘブライ語は直訳すると「聖なるものとなる」で、儀式の後に生じる聖なる状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: 取り
  rationale: 接続詞を伴う完了形が祭儀手順の命令的連続を表すため、現代日本語では後続の「振りかけなさい」と一続きの指示として訳した。
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 祭壇の上にある血の一部
  rationale: מןの部分を取り分ける意味を「一部」で明示し、関係節אֲשֶׁר עַלも保持した。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: משׁחの儀礼的な塗油・注油の用途を簡潔に表し、後代の教派的用語を避けた。
- source_word: הִזֵּיתָ
  choice: 振りかけなさい
  rationale: 祭儀文脈におけるנזהのヒフィル形は液体を振りかける行為を表す。命令的な手順として自然な形にした。
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: その衣服／その衣服
  rationale: בגדの一般的意味を保ち、特定の教会制度を連想させる専門語を避けた。文脈上、後者が息子たちの衣服であることは明瞭である。
- source_word: בָּנָיו
  choice: 彼の息子たち
  rationale: 男性複数形であり、文脈では祭司となるアロンの息子たちを指すため、性を特定しない「子どもたち」とはしなかった。
- source_word: אִתּוֹ
  choice: 彼とともにいる
  rationale: アロンとの共同関係を明示し、二度目のאִתּוֹを結果節で自然に保持した。
- source_word: וְקָדַשׁ
  choice: 聖なるものとなる
  rationale: 儀礼行為の結果として生じる聖別された状態を表しつつ、קדשׁの「聖」の語義を直接保った。
- source_word: הוּא
  choice: アロン
  rationale: 日本語で「彼」とすると直前の複数の人物との関係が曖昧になりやすいため、指示対象を明示した。
theological_decisions:
- issue: 儀礼によって生じる聖なる状態の表現
  choice: 聖なるものとなる
  alternative: 聖別される
  rationale: קדשׁが表す結果的な聖の状態を保ち、「聖別」という技術的表現だけに狭めない。「となる」により、振りかける行為の結果であることも自然に示した。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位ある祭儀上の指示文。「衣服」を用いて後代の教会用語を避け、前半の反復は保ちつつ、結果節では日本語として指示対象が明確になるよう「アロン」を補った。
