  to: 祭壇の上にある血の一部と、聖別のための油の一部を取り、それらをアロンとその衣服、彼と共にいる息子たちとその息子たちの衣服に振りかけなさい。こうして、アロンとその衣服、彼と共にいる息子たちとその息子たちの衣服は、聖なるものとなる[a]。
