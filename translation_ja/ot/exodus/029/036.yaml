revisions:
- from: あなたは毎日、罪のきよめのささげ物[a]として雄牛一頭を献げ、祭壇のために贖いを行うとき、祭壇をきよめなければならない。また、祭壇に油を注いで、これを聖別しなければならない。
  to: あなたは毎日、贖いのために、罪のためのささげ物[a]として雄牛一頭を献げなさい。祭壇のために贖いを行うとき、祭壇をきよめなさい。また、それに油を塗って聖別しなさい。
