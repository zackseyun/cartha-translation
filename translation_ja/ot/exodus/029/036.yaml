  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: ja
  text: あなたは毎日、贖いのために、罪のためのささげ物[a]として雄牛一頭を献げなさい。祭壇のために贖いを行うとき、祭壇をきよめなさい。また、それに油を塗って聖別しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「きよめのためのささげ物」。ヘブライ語 חַטָּאת は、祭儀の文脈では「罪のためのささげ物」を指すとともに、罪や汚れからのきよめのためのささげ物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: 雄牛一頭
  rationale: פַרは雄牛を指す。年齢を明示する語ではないため、「若い」を補わず、自然な日本語として助数表現を添えた。
- source_word: חַטָּאת
  choice: 罪のきよめのささげ物
  rationale: 祭儀文脈では、罪や汚れを除くための供え物を表す。「罪のささげ物」という伝統的表現と「きよめのささげ物」という機能的表現の双方の含意を保つ訳語とした。
- source_word: לַיּוֹם
  choice: 毎日
  rationale: 一連の任職儀礼における日ごとの反復を、簡潔で自然な日本語で示す。
- source_word: עַל הַכִּפֻּרִים
  choice: 贖いのために
  rationale: 複数形はここでは贖いの儀礼を指すと理解し、日本語では自然な抽象表現にした。
- source_word: וְחִטֵּאתָ
  choice: きよめなければならない
  rationale: חטאのピエル形は祭儀的に対象を罪・汚れから除ききよめることを表す。祭壇が道徳的な罪を犯したかのように響かない訳とした。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 幕屋の祭儀文脈における標準的で明瞭な訳語。
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: 祭壇のために贖いを行うとき
  rationale: ב＋不定詞を時間的に取り、עָלָיוの指示対象を祭壇と明示した。ただし前置詞句には手段的理解の余地もある。
- source_word: וּמָשַׁחְתָּ
  choice: 油を注いで
  rationale: משׁחは聖別のため油を塗る行為を表す。日本語では儀礼的な塗油を自然に伝える表現とした。
- source_word: לְקַדְּשׁוֹ
  choice: これを聖別しなければならない
  rationale: 祭壇を聖なる用途のために取り分ける意味を、「聖別する」で簡潔に表した。
theological_decisions:
- issue: 祭儀的な罪・汚れの除去と贖いを、後代の教理で狭く限定せずに表すこと
  choice: 「罪のきよめのささげ物」「祭壇をきよめる」「祭壇のために贖いを行う」と訳す
  alternative: 「罪のためのいけにえ」「祭壇の罪を除く」、または一律に「清めのささげ物」と訳す
  rationale: 本文は祭壇の奉献に伴う祭儀的な浄化と贖いを述べる。祭壇の道徳的罪を示唆せず、חַטָּאתが持つ罪と浄化の両面を保持した。
- issue: בְּכַפֶּרְךָ עָלָיוの関係
  choice: 「祭壇のために贖いを行うとき」と時間的に訳す
  alternative: 「祭壇のために贖いを行うことによって」と手段的に訳す
  rationale: ב＋不定詞は時間・手段の双方を表し得る。儀礼動作の流れに合う時間的訳を本文に採りつつ、手段的含意を排除しない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある祭儀文体とした。「贖い」「聖別」は聖書語として定着しており、文脈上必要な専門性を保つ。「あなた」を明示し、命令的未完了の反復義務を「なければならない」で表した。
