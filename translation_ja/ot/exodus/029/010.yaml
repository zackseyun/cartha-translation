  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: ja
  text: あなたは雄牛を会見の天幕の前に連れて来なければならない[a]。そして、アロンとその息子たちは、その雄牛の頭に手を置かなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雄牛を会見の天幕の前に差し出さなければならない」、または「雄牛を会見の天幕の前に近づけなければならない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 連れて来なければならない
  rationale: קרבのヒフィル形は、いけにえの文脈で「近くに連れて来る」「差し出す」を意味する。ここでは目的地を示す「会見の天幕の前に」と合わせ、自然で明瞭な「連れて来る」とした。
- source_word: הַפָּר
  choice: 雄牛
  rationale: פַּרは、いけにえに用いる雄牛（しばしば若い雄牛）を指す。年齢を本文以上に限定せず「雄牛」とした。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 場所の正面またはその場の前にいることを表すため、簡潔な「前に」とした。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための聖所を指す定型的名称として、意味を保ちつつ現代日本語で理解しやすい「会見の天幕」とした。
- source_word: וְסָמַךְ
  choice: 手を置かなければならない
  rationale: סמךは、いけにえの頭に手を当てる儀礼的動作を表す。押しつける強さまでは明示せず、自然な「手を置く」とした。
- source_word: יְדֵיהֶם
  choice: 手
  rationale: 原文は複数形で、アロンとその子らがそれぞれ手を置く集合的な動作を示す。日本語では所有者が複数であることが文脈上明らかなため、自然な単数形「手」で表した。
- source_word: עַל רֹאשׁ הַפָּר
  choice: その雄牛の頭に
  rationale: 具体的な接触箇所を原文どおり保ち、前出の雄牛を指すことを「その」で明確にした。
- source_word: אַהֲרֹן וּבָנָיו
  choice: アロンとその子ら
  rationale: 祭司任職の文脈で、בניםはアロンの息子たちを指す。「子どもたち」より荘重で簡潔な「子ら」とした。
theological_decisions:
- issue: いけにえの動物への按手の意味
  choice: その雄牛の頭に手を置かなければならない
  alternative: その雄牛の頭に手を押し当てなければならない
  rationale: 本文は儀礼的動作を述べるだけで、その象徴的・神学的意味を説明していない。罪責の転嫁などの解釈を訳文に加えず、具体的な動作のみを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令的な未完了形を「なければならない」で表し、祭儀用語は説明を加えすぎず原文の具体性を保った。
