    rationale: 「近くに」は基準点が明示されず、日本語として少し不明瞭である。祭儀文脈のקרבヒフィルの代案としては「雄牛を会見の天幕の前に近づけなければならない」が明確である。
  revised_text: あなたは雄牛を会見の天幕の前に連れて来なければならない[a]。そして、アロンとその息子たちは、その雄牛の頭に手を置かなければならない。
