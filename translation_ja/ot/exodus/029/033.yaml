  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: ja
  text: 彼らは、彼らを祭司として任職させ、聖別するために、それらを用いて贖いがなされた供え物を食べなければならない。しかし、部外者[c]はそれを食べてはならない。それらは聖なるものだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ここでの「部外者」は民族的な意味での外国人ではなく、この祭司儀礼に参与する資格のない者を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: 彼らは……それらを食べなければならない
  rationale: 祭司任職の儀礼における指示として、未完了形の規定的な力を自然な現代日本語で示した。目的語は直前の文脈にある祭儀の食物を指す。
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: それらによって贖いがなされたもの
  rationale: בָּהֶם の手段・媒介の意味を「それらによって」で明示し、受動形の כפר は祭儀的な重みを保つ「贖いがなされた」とした。
- source_word: לְמַלֵּא אֶת יָדָם
  choice: 自分たちを任職し
  rationale: 字義は「彼らの手を満たす」だが、ここでは祭司職への就任を表す定型的なヘブライ語表現であるため、機能的に「任職する」と訳した。
- source_word: לְקַדֵּשׁ אֹתָם
  choice: 聖別する
  rationale: 聖なる務めのために取り分けるという祭司儀礼上の意味を、簡潔で品位ある語で表した。
- source_word: וְזָר
  choice: しかし、部外者
  rationale: 民族的な外国人ではなく、この祭司儀礼に参与する資格を持たない者を指すため、「部外者」とした。
- source_word: לֹא יֹאכַל
  choice: 食べてはならない
  rationale: 祭儀法上の明確な禁止として自然な日本語にした。目的語「それ」は文脈から補った。
- source_word: כִּי קֹדֶשׁ הֵם
  choice: それらは聖なるものだからである
  rationale: 禁止の理由を示す כִּי を「だから」とし、קֹדֶשׁ の祭儀的意味を「聖なるもの」で保った。
theological_decisions:
- issue: 祭儀的文脈における כפר の訳
  choice: 贖いがなされた
  alternative: 罪の償いがなされた／償いがなされた
  rationale: כפר の祭儀的な広がりと神学的緊張を保ちつつ、特定の贖罪理論に限定しない定着した表現を採用した。
- issue: לְמַלֵּא אֶת יָדָם の祭司任職表現
  choice: 任職する
  alternative: 彼らの手を満たす／職に就ける
  rationale: 原文の身体的表現を直訳すると現代日本語では意味が伝わらないため、祭司として正式に職に就ける意味を本文に置き、字義を脚注に残した。
- issue: 不定詞句の関係
  choice: 自分たちを任職し、聖別するために……贖いがなされた
  alternative: 彼らは、それを食べることによって任職され、聖別される
  rationale: 原文では贖い、任職、聖別の祭儀的連関が密接である。本文は לְ 不定詞を贖いの目的として自然に結びつけつつ、食べる行為だけが任職を成立させると断定する読みを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司儀礼にふさわしい簡潔で荘重な調子を保った。「任職」「聖別」「贖い」は必要な祭儀用語として残し、意味上の補足は脚注に置いた。
