  naturalness: 現行文は「自分たちを任職し」が現代日本語として不自然であり、任職する主体と任職される者の関係が曖昧になる。語順を整え、「供え物」を補って関係節の対象を明確にすると、明瞭な現代標準日本語になる。
  terminology: 「贖い」「聖別」は祭儀文脈に適切である。「任職」は維持できるが、本文では「祭司として任職させる」として慣用句の機能的意味を明示する。「部外者」は脚注により民族的外国人ではないことが適切に限定されている。
