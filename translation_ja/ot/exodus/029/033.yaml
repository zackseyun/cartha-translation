revisions:
- from: 彼らは、自分たちを任職し[b]、聖別するために、それらによって贖いがなされた[a]ものを食べなければならない。しかし、部外者[c]はそれを食べてはならない。それらは聖なるものだからである。
  to: 彼らは、彼らを祭司として任職させ、聖別するために、それらを用いて贖いがなされた供え物を食べなければならない。しかし、部外者[c]はそれを食べてはならない。それらは聖なるものだからである。
  rationale: 本文の「贖いがなされた供え物」は、ヘブライ語の「それらによって贖いがなされた［もの］」という関係を保ちながら、日本語で対象を明確にする。「彼らを祭司として任職させ、聖別するために」は任職慣用句の対象と機能を自然に示す。脚注 a・b は本文中にアンカーがなく構造上孤立しているため、本文に不要な注記記号を付加せず、脚注セットは情報として保持する。
