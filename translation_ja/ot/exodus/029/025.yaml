source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: ja
  text: それから、彼らの手からそれらを受け取り、祭壇の上で全焼のささげ物の上に載せて、焼いて煙にしなさい。それはヤハウェの前に喜ばしい香りとなる。これはヤハウェへの火によるささげ物[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火の供え物」とも訳せる。
    reason: אִשֶּׁהは、火を用いてささげる供え物を指す祭儀用語であり、日本語では「火によるささげ物」「火の供え物」のように表現できる。
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: それから、…取り
  rationale: 接続詞を伴う完了形が一連の儀式手順における命令を表すため、「それから」で順序を示し、命令形として訳した。
- source_word: מִיָּדָם
  choice: 彼らの手から
  rationale: 祭司たちの手に載せられていた部分を取り上げる具体的な儀式動作を、そのまま明確に表した。
- source_word: וְהִקְטַרְתָּ
  choice: 焼いて煙にしなさい
  rationale: קטר のヒフィル形は祭壇上で焼いて煙を立ち上らせることを表す。「焼く」だけでなく「煙にする」を加え、祭儀的意味を明示した。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上に
  rationale: 方向を示す語尾を、犠牲を祭壇上に置いて焼く文脈に即して自然な日本語にした。
- source_word: עַל הָעֹלָה
  choice: 全焼のささげ物の上で
  rationale: עַל の位置関係を保ち、すでに祭壇上にある全焼のささげ物の上で焼くという重なりを示した。עֹלָה は全体を焼く犠牲であるため「全焼のささげ物」とした。
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: 喜ばれる香りとなるため
  rationale: 定型的な祭儀表現が、単なる芳香ではなく神に受け入れられ喜ばれることを示す点を自然な現代日本語で表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵי の臨在・関係的な意味を「前に」で保ち、神名 יהוה は固有名として「ヤハウェ」と表記した。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 祭儀用語として、火を介して献げる供え物という伝統的かつ文脈に適した理解を採った。ただし語義には議論があるため別訳を脚注に示した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: לְ が示す献納の向かう先・帰属を、日本語として自然な「への」で表した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が神の固有名を明記しているため、その区別を保つ音写を採用した。
- issue: 祭儀用語 אִשֶּׁה の解釈
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: この文脈では祭壇で焼いて煙にする動作が直前にあるため「火によるささげ物」が最も直接的である。一方、祭司文書における神への「食物」という供え物の比喩との関連を重視する理解もあるため、脚注で保持した。
translation_notes:
  register: 明瞭で威厳のある現代標準日本語を用いた。儀式の順序と具体的な身体動作を見失わないようにしつつ、「焼いて煙にする」「全焼のささげ物」など、一般読者にも祭儀内容が伝わる表現を選んだ。
