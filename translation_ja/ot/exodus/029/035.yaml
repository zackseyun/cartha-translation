  text: וְ/עָשִׂ֜יתָ לְ/אַהֲרֹ֤ן וּ/לְ/בָנָי/ו֙ כָּ֔כָה כְּ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֹתָ֑/כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: ja
  text: あなたは、わたしが命じたすべてのことに従って、アロンとその子らに対してこのように行いなさい。七日間、彼らを祭司として任命しなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らの手を満たしなさい」。祭司として任命し、職に就けることを表すヘブライ語の慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 行いなさい
  rationale: 接続詞を伴う完了形は、一連の儀礼的指示の中で命令の働きをする。現代日本語でその指示性を明確にした。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らのために
  rationale: 反復された לְ は、行為がアロンとその息子たちに関して、また彼らのためになされることを示す。
- source_word: כָּכָה
  choice: このように
  rationale: 直前までに規定された儀礼の手順を指し示す副詞として、自然で明瞭に訳した。
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: わたしが命じたすべてのことに従って
  rationale: כְּכֹל と関係節が表す、先の命令全体への全面的な一致を保持した。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を示す対格を、簡潔で自然な日本語で表した。
- source_word: תְּמַלֵּא יָדָם
  choice: 彼らを祭司として任命しなさい
  rationale: 字義は「彼らの手を満たす」だが、祭司職に就ける儀礼を表す慣用句である。「祭司として任命する」は文脈上の意味を明瞭にしつつ、後代の特定教派の用語に限定しない。字義は脚注に残した。
theological_decisions:
- issue: 祭司就任を表す慣用句 מלא יד の訳し方
  choice: 彼らを祭司として任命しなさい
  alternative: 彼らの手を満たしなさい／彼らを聖別して職に就けなさい
  rationale: この句は祭司として正式に職に就けることを意味する。「任命」は職務付与を明確に伝え、「祭司として」を補うことで文脈を明示する一方、特定教派の按手礼などを読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語。神の直接命令として品位を保ちつつ、古風すぎる表現は避けた。「その子ら」は複数の息子を指す聖書的文脈に適した簡潔な表現。
