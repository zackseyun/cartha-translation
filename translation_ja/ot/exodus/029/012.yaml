source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/נָתַתָּ֛ה עַל קַרְנֹ֥ת הַ/מִּזְבֵּ֖חַ בְּ/אֶצְבָּעֶ֑/ךָ וְ/אֶת כָּל הַ/דָּ֣ם תִּשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: ja
  text: あなたは雄牛の血を少し取って[a]、指で祭壇の角[b]に塗り、血をすべて祭壇の土台に[c]注ぎ出しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「雄牛の血から取る」。ここでは、その血の一部を取るという意味。
    reason: lexical_alternative
  - marker: b
    text: 「角」は、祭壇の四隅に設けられた角状の突起。
    reason: cultural_note
  - marker: c
    text: 別訳「祭壇の土台のところに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: あなたは……取り
  rationale: 接続詞を伴う完了形は、一連の儀礼手順における命令として理解した。日本語では文脈上明らかな接続辞を省き、自然な命令文にまとめた。
- source_word: מִדַּם הַפָּר
  choice: 雄牛の血を少し
  rationale: 前置詞 מִן の部分を表す用法を明示し、血の一部を取ることを自然な現代日本語で示した。
- source_word: וְנָתַתָּה
  choice: 塗り
  rationale: נתן の基本義は「置く、与える」だが、血を指で祭壇の角につける儀礼動作として、日本語では「塗る」が明瞭かつ自然である。
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: 祭壇の角に
  rationale: 祭壇の四隅にある角状の突起を指す具体的な祭儀用語「角」を保持した。
- source_word: בְּאֶצְבָּעֶךָ
  choice: 指で
  rationale: 前置詞 בְּ の手段用法を、簡潔で自然な日本語にした。
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: 残りの血をすべて……注ぎなさい
  rationale: 直訳は「すべての血を注げ」だが、直前に一部を取って角に塗るため、ここでは残った血の全量を指す。「残りの」を補うことで手順を明確にした。שׁפך は意図的な儀礼動作なので「こぼす」ではなく「注ぐ」とした。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 祭壇の土台に
  rationale: יְסוֹד の基本的な意味である「基礎、土台」を保った。אֶל は方向・到達点を表すため「に」と訳した。
theological_decisions:
- issue: 祭壇の構造を表す祭儀用語
  choice: 「角」「土台」という具体的表現を保持する。
  alternative: 「祭壇の隅」「祭壇の下部」など一般化する。
  rationale: この節は祭司任職のための具体的な儀礼手順を述べる。祭壇の物理的特徴を保つことで、祭儀本文の具体性を損なわず、後代の教理的解釈も持ち込まない。
- issue: 「すべての血」の指示範囲
  choice: 文脈に即して「残りの血をすべて」とする。
  alternative: 形式的に「血をすべて」と訳す。
  rationale: すでに血の一部を祭壇の角に用いているため、ここで注ぐのは残余の全量である。この補足は儀礼の順序を明確にするもので、神学的意味を付加するものではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。モーセへの二人称命令を「あなたは……なさい」で示し、儀礼の連続動作を一文にまとめた。専門的な祭儀用語は具体性を保ちつつ、脚注で簡潔に説明した。
