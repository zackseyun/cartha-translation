id: EXO.29.44
reference: Exodus 29:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: ja
  text: わたしは会見の天幕と祭壇を聖別する[a]。また、アロンとその息子たちを聖別し、わたしに仕える祭司とする[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なるものとする」「聖なるものとして取り分ける」。後半の「聖別し」も同じ。
    reason: lexical_alternative
  - marker: b
    text: 直訳「わたしのために祭司を務めさせる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: 聖別する
  rationale: ピエル形の קדשׁ は、聖なるものとして取り分けることを表す。この祭儀的文脈では「聖別する」が簡潔で自然であり、二つの用例も同じ語で訳した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神が民と会うために定められた天幕を指す、聖書日本語として定着しつつ意味も理解しやすい表現。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲をささげる祭儀用の壇を表す標準的な訳語。
- source_word: אַהֲרֹן
  choice: アロン
  rationale: 日本語聖書で広く用いられる固有名の音写。
- source_word: בָּנָיו
  choice: その息子たち
  rationale: 原文は男性複数を明示し、この文脈ではアロンの息子たちの祭司職を指すため、一般化せずに訳した。
- source_word: לְכַהֵן לִי
  choice: わたしに仕える祭司とする
  rationale: כהן の動詞は祭司として務めることを表し、לִי はその奉仕が神に向けられることを示す。自然な現代日本語で両方の要素を保った。
theological_decisions:
- issue: 祭儀的な聖性を表す קדשׁ の訳
  choice: 聖別する
  alternative: 聖なるものとする／聖なるものとして取り分ける
  rationale: 場所・祭具と祭司となる人物を神のために聖なるものとして取り分ける文脈であり、「聖別する」が原語の祭儀的意味を過不足なく伝える。
- issue: アロンの子らの性別表現
  choice: その息子たち
  alternative: その子どもたち
  rationale: בָּנָיו はここでアロンの男性の子らを指し、祭司職に関する歴史的文脈でも性別が意味を持つため、原文どおりに訳した。
- issue: לְכַהֵן לִי の目的・関係
  choice: わたしに仕える祭司とする
  alternative: わたしのために祭司を務めさせる
  rationale: 神への奉仕という関係と、彼らが祭司として立てられることを自然な日本語で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会見の天幕」「祭壇」「聖別」「祭司」は祭儀的文脈に適した定着語を用いた。原文の二度の קדשׁ を対応する二度の「聖別」で保持し、後半は目的を自然に示すため「祭司とする」とした。
