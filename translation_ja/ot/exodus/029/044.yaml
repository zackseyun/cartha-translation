  terminology: 固有名「アロン」、男性複数を保つ「その息子たち」、祭儀的קדשׁの「聖別する」は適切である。脚注aは二度の動詞に及ぶことを明記し、脚注bも原語の「わたしのために／わたしに」という関係を補足しており、アンカー位置も適切である。
