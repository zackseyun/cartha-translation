reference: Exodus 29:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: ja
  text: わたしはイスラエルの子ら[b]の間に住み[a]、彼らの神となる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの子らのただ中に住み」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では字義的に「イスラエルの息子たち」。伝統的には、イスラエルの民を指す表現。
    reason: lexical_alternative
  - marker: c
    text: または「彼らにとって神となる」。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: わたしは……住み
  rationale: שׁכןは、ある場所に住む、そこを住まいとすることを表す。「住む」は現代日本語として自然であり、神が民の中に臨在するという意味を保ちつつ、「幕屋を張る」のような解釈的表現を本文に持ち込まない。
- source_word: בְּתוֹךְ
  choice: の間に
  rationale: 民の集団を目的語とするבְּתוֹךְは、単なる中央位置ではなく、その共同体の中にいることを表す。「の間に」は自然で明瞭である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の家族的表現「イスラエルの子ら」を保つ。「イスラエル人」や「イスラエルの民」より字義に近い一方、日本語の「子ら」は文脈上、民全体を指しうる。
- source_word: וְהָיִיתִי
  choice: 神となる
  rationale: היהはここで契約関係を表す。日本語の契約定型として「彼らの神となる」は自然であり、文脈上、単なる状態変化ではなく、神と民との関係を示す。
- source_word: לָהֶם
  choice: 彼らの
  rationale: 字義的には「彼らに／彼らにとって」だが、日本語では所有形を用いた「彼らの神」が契約関係を自然に表す。
- source_word: לֵאלֹהִים
  choice: 神
  rationale: 神ご自身がイスラエルとの関係を語る契約定型であるため、不定の「一人の神」ではなく「神」と訳す。
theological_decisions:
- issue: 契約定型の訳し方
  choice: 彼らの神となる
  alternative: 彼らにとって神となる
  rationale: וְהָיִיתִי לָהֶם לֵאלֹהִיםの関係的・契約的な力を、現代日本語で自然な定型によって示す。字義的な与格構文も脚注に残す。
- issue: イスラエルを指す家族的・性別を伴う表現
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文のבְּנֵי（字義的には「息子たち」）が持つ家族的比喩を本文に残す。ただし、日本語の「子ら」自体は男性だけを明示する語ではないため、原語の形は脚注で説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「住む」「神となる」により契約的な臨在と関係を簡潔に示し、「イスラエルの子ら」で原文の家族的表現を保持した。
