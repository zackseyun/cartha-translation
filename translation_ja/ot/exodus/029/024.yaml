source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: ja
  text: そのすべてをアロンの手のひらにも、その子らの手のひらにも載せ[a]、それらを揺祭としてヤハウェの前で揺り動かしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「アロンの手のひらの上に、またその子らの手のひらの上に」。ここで用いられているヘブライ語は「手」とも訳せますが、より具体的には「手のひら」を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 載せ
  rationale: 祭儀の品々を開いた手のひらに置く動作を、自然な現代日本語で具体的に表す。接続詞付き完了形は一連の指示を示すため、命令形とした。
- source_word: הַכֹּל
  choice: そのすべて
  rationale: 直前の節で集められた複数の部分をまとめて指す再述表現を保つ。
- source_word: עַל כַּפֵּי
  choice: 手のひらに
  rationale: כַּף は手全体を指し得るが、ここでは品々を載せる面としての『手のひら』という具体像が文脈に適する。
- source_word: בָנָיו
  choice: その子ら
  rationale: ここでは祭司任職に加わるアロンの息子たちを指す。現代日本語として簡潔な『子ら』を用いた。
- source_word: וְהֵנַפְתָּ
  choice: 揺り動かしなさい
  rationale: ヒフィル形 נוף が祭儀における振揺・奉呈の動作を示すことを明示する。
- source_word: אֹתָם
  choice: それらを
  rationale: 男性複数の目的語代名詞を、直前までに挙げられた複数の祭儀用品に対応させる。
- source_word: תְּנוּפָה
  choice: 奉献物として
  rationale: 振揺によってヤハウェの前に差し出す祭儀上の機能を自然な日本語で示す。動作自体は『揺り動かす』で保持した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 祭儀が神の御前で行われることを表し、固有の神名 יְהוָה は『ヤハウェ』と音写した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に明記された固有の契約名を固有名として保持し、日本語で一般的な学術的音写を用いる。
- issue: תְּנוּפָה の祭儀的意味
  choice: 奉献物として
  alternative: 揺祭として／振揺のささげ物として
  rationale: 特定教派の術語に寄りすぎず、物を揺り動かして神の前に差し出すという祭儀的性格を、動詞と名詞句の組み合わせで表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀の具体的な動作を保持しつつ、過度に専門的な術語は避けた。
