  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ja
  text: 雄羊を丸ごと祭壇の上で焼いて煙にしなさい。これはヤハウェへの焼き尽くす供え物であり、なだめの香り[a]、ヤハウェへの火による供え物[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「安らぎの香り」とも訳せる。供え物がヤハウェに受け入れられることを表す祭儀上の定型表現。
    reason: lexical_alternative
  - marker: b
    text: 「燃やして献げる供え物」とも訳せる。原語の正確な語源と語義には議論がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: 焼いて煙にしなさい
  rationale: 祭儀の文脈におけるקטרのヒフィル形は、祭壇で焼いて煙を立ち上らせることを表す。「焼く」だけでなく「煙にする」を添え、原語の祭儀的な動作を明確にした。
- source_word: כָּל הָאַיִל
  choice: 雄羊を丸ごと
  rationale: כָּלは、雄羊の一部ではなく全体をささげることを強調する。אַיִלは一般的な羊ではなく雄羊を指す。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を示す語尾を伴う形だが、ここでは供え物を祭壇へ運び、そこで焼くことを意味するため、自然な日本語では「祭壇の上で」とした。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 供え物全体を焼く祭儀を表す定着した意味を、現代の読者にも分かる形で示した。「焼き尽くすいけにえ」も可能だが、「ささげ物」は動物以外にも用いられる祭儀用語として一貫性がある。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לは献納の向き先・帰属を表す。神名יהוהは称号に置き換えず「ヤハウェ」と音写した。
- source_word: רֵיחַ נִיחוֹחַ
  choice: 芳しい香り
  rationale: 神に受け入れられる供え物を表す定型的な祭儀表現。「心をなだめる香り」と断定せず、原文の比喩と神学的含みを保った。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 語義・語源には議論があるが、この文脈では火を介して献げる祭儀的供え物を指す伝統的理解が適切である。「食物のささげ物」と限定せず、語の曖昧さを保持した。
- source_word: הוּא
  choice: これは…である
  rationale: 供えられる雄羊ないしその祭儀全体を、全焼のささげ物および火によるささげ物と同定する述語的用法として訳した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の契約名יהוהが明記されているため、称号「主」に置き換えず、一般的な学術的音写「ヤハウェ」を用いた。
- issue: רֵיחַ נִיחוֹחַが示す神への作用
  choice: 芳しい香り
  alternative: 心をなだめる香り／安らぎの香り
  rationale: この定型句は供え物が神に受け入れられることを示すが、神が文字どおり鎮静されるという解釈までは原文だけでは確定しないため、比喩的表現を保った。
- issue: אִשֶּׁהの祭儀的意味
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 「食物」とする理解も提案されるが、本節では焼いて煙にする行為が明示されている。特定の語源説に依存せず、火を介するささげ物という広い意味を採った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いけにえ」より包括的な「ささげ物」を基本語とし、祭儀的動作は「焼いて煙にする」と具体的に表現した。二つの名詞句を「であり」で結び、原文の同定的な構文と反復を自然な日本語の範囲で保持した。
