- source_word: וְאֶת בָּנָיו
  choice: また、彼の息子たちを
  rationale: 接続詞と目的語標識を、前の命令に続く自然な日本語の「また」で表した。בָּנָיו は祭司職に任じられるアロンの男子を指すため、「息子たち」とした。
- source_word: תַּקְרִיב
  choice: 近くに進み出させ
  rationale: קרב のヒフィル形が持つ「近づける、前に出させる」という使役的意味と、儀式のために神の前へ出させる含意を保った。
- source_word: וְהִלְבַּשְׁתָּם
  choice: 彼らに……着せなさい
  rationale: 使役的な「着せる」を用い、二つの命令を日本語として自然に連結した。
- source_word: כֻּתֳּנֹת
  choice: 長衣
  rationale: 身体に着る基本的な衣である כֻּתֹּנֶת を、祭司服の文脈にふさわしく、現代日本語で通じる「長衣」とした。「上着」では丈や古代衣服としての性格が不明瞭になりやすい。
