id: EXO.29.23
reference: Exodus 29:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: ja
  text: また、ヤハウェ[a]の前にある種なしパンの籠から、丸いパン一個、油を用いたパン一個、薄焼きパン一個を取り、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は神名「YHWH」（ヤハウェ）。伝統的には「主」とも訳される。
    reason: 本文の神名表記を明示し、伝統的な代替訳を示すため。
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: 丸いパン
  rationale: כִּכָּרには丸い形のパンという含意があり、続くחַלָּהと区別しながら自然な日本語にした。
- source_word: אַחַת / אֶחָד
  choice: 一個
  rationale: 祭儀の指示における各品目の数量を明確に保った。
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: 油を使ったパン菓子
  rationale: 油を用いたパン類を指すが、油を混ぜたのか塗ったのかを本文だけで断定せず、原文の簡潔さと曖昧さを保った。
- source_word: רָקִיק
  choice: 薄焼きパン
  rationale: 薄い無酵母のパンを指す語であり、「ウエハース」より祭儀用のパンとして自然で明瞭な表現を選んだ。
- source_word: מִסַּל הַמַּצּוֹת
  choice: 種なしパンの籠から
  rationale: מִןの起点とסַלの具体的な容器を保ち、מַצּוֹתを日本語で一般的な「種なしパン」とした。
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: ヤハウェの前にある
  rationale: לִפְנֵיの空間的・祭儀的意味を、解釈を加えず直接的に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、日本語で一般的な音写によって示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いていることを明示し、称号への置換を避けた。発音の完全な確定には限界があるため脚注を付した。
- issue: לֶחֶם שֶׁמֶן における油の用い方
  choice: 油を使った
  alternative: 油を混ぜた、油を塗った
  rationale: この句自体は調理法を細部まで明示しないため、特定の工程に限定しない訳を採用した。
translation_notes:
  register: 祭儀規定にふさわしい簡潔で端正な現代標準語。前後の命令文に続く一節なので、原文冒頭の接続詞を「また」、文末を連用形「取り、」として統語上の連続性を保った。
