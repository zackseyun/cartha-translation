source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: ja
  text: 彼の子らのうち、彼の後を継いで祭司となる者[b]は、会見の天幕に入って聖所[a]で仕えるとき、七日間それらを身に着ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖域で」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼の子らのうちの、彼の後を継ぐ祭司」。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す対格であり、祭司の装束を着用する期間として自然かつ簡潔に訳した。
- source_word: יִלְבָּשָׁם
  choice: それらを身に着ける
  rationale: לבש は「着る／身に着ける」を意味する。直前の祭司の装束を受ける複数目的語を「それら」で保持し、着用行為と継続状態の双方を自然に含み得る表現とした。
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: 彼に代わって祭司となる者
  rationale: 直訳的には「彼の代わりの祭司」。ここでは職務の継承を指すため、後継関係が明瞭になる現代日本語とした。
- source_word: מִבָּנָיו
  choice: 彼の子らのうち
  rationale: 前置詞 מִן の部分を表す意味を保ち、後継者が息子たちの中から出ることを示した。
- source_word: אֲשֶׁר יָבֹא
  choice: 入って……とき
  rationale: 形式上は関係節だが、祭司が装束を着用する機会を示す文脈上の時間的関係を自然な日本語で表した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神と会うための幕屋を指す定型的な聖所名称として、語義と旧約祭儀の文脈を保った。
- source_word: לְשָׁרֵת
  choice: 仕える
  rationale: 祭司としての聖務を表す語だが、原語の基本的な「仕える」という意味を保ち、過度に専門化しない表現とした。
- source_word: בַּקֹּדֶשׁ
  choice: 聖所で
  rationale: קֹדֶשׁ はここで祭司が奉仕する聖なる区域を指す。「聖所」は祭儀上の場所を簡潔に示す。
theological_decisions:
- issue: 祭司職の継承を表す תַּחְתָּיו
  choice: 彼に代わって祭司となる者
  alternative: 彼の代わりの祭司
  rationale: 単なる位置の交代ではなく、アロンの子らの中から祭司職を継ぐ者を指す文脈を明示する一方、後代の教理的な継承概念は持ち込まない。
- issue: בַּקֹּדֶשׁ が指す祭儀上の場所
  choice: 聖所で
  alternative: 聖域で
  rationale: 幕屋における具体的な聖なる奉仕場所を示す訳を採用した。ただしヘブライ語自体は「聖なる所／聖域」とも訳し得るため、その幅を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は直前のアロンを指し、「それら」は前節までの祭司の装束を指す。脚注記号は該当する句の直後ではなく節末にまとめつつ、本文中にすべて明示した。
