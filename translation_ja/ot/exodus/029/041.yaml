reference: Exodus 29:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ja
  text: もう一匹の子羊は夕暮れ時に献げなさい[a]。朝の穀物のささげ物とその注ぎのささげ物と同じように、それに添える穀物のささげ物と注ぎのささげ物を献げなさい。これは、ヤハウェに喜ばれる香りとなる、火によるささげ物[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「二つの夕べの間に」。夕方から薄暮にかけての時間を指す慣用句。
    reason: lexical_alternative
  - marker: b
    text: または「食物のささげ物」。ヘブライ語の祭儀用語の解釈には幅がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: もう一匹の子羊
  rationale: 直訳は「第二の子羊」だが、前節の一匹目に続く対となる一匹を指すため、自然な現代日本語で「もう一匹」とした。
- source_word: תַּעֲשֶׂה
  choice: 献げなさい
  rationale: 字義は「行う、作る」だが、ここでは祭儀上の献納を表すため「献げる」が文脈に即している。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 夕暮れ時に
  rationale: 字義的には「二つの夕べの間に」という慣用句で、夕方から薄暮の時間帯を指す。本文では明瞭な表現を用い、字義を脚注に残した。
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: 朝の場合と同じ穀物のささげ物
  rationale: מִנְחָה はこの祭儀文脈では動物の犠牲に伴う穀物のささげ物を指す。「朝の場合と同じ」により、前節までに定められた朝の献げ物との対応を示した。
- source_word: וּכְנִסְכָּהּ
  choice: 注ぎのささげ物
  rationale: נֶסֶךְ は液体を注いで献げるものを指す。「注ぎのささげ物」は動作と祭儀上の機能の双方を明確にする。
- source_word: לָּהּ
  choice: それに添えて
  rationale: 明示された代名詞を落とさず、穀物と注ぎのささげ物が子羊に伴うことを自然な日本語で表した。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ヤハウェに喜ばれる香りとなる
  rationale: 定型的な祭儀表現であり、神に受け入れられることを香りの比喩で示す。比喩を保ちつつ、誰に喜ばれるのかを日本語で明瞭にした。
- source_word: אִשֶּׁה
  choice: 火によるささげ物
  rationale: 伝統的かつ文脈に即した理解を本文に採用した。語義には「食物のささげ物」とする理解もあるため脚注で示した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 原文の固有の神名 יהוה を称号に置き換えず、契約の名として音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、「主」という称号ではなく「ヤハウェ」として神名を保持した。
- issue: לְרֵיחַ נִיחֹחַ の主体と意味
  choice: ヤハウェに喜ばれる香りとなる
  alternative: 心安らぐ香りとなる
  rationale: 神が文字どおり香りによって鎮められると断定せず、祭儀的な受容を表す定型句として訳した一方、原文の香りの比喩は保持した。
- issue: אִשֶּׁה の祭儀的分類
  choice: 火によるささげ物
  alternative: 食物のささげ物
  rationale: 火との関連を示す伝統的理解を本文に採りつつ、語義上の別解を脚注に残し、解釈を一つに固定しすぎないようにした。
translation_notes:
  register: 命令部分には明快な「献げなさい」を用い、祭儀文としての厳粛さを保ちながら、現代の一般読者にも理解できる語順と語彙にした。「供え物」ではなく「ささげ物」で用語を統一し、香りの比喩と神名を原文どおり保持した。
