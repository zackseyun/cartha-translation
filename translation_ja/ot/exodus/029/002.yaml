base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: ja
  text: また、種なしパンと、油を混ぜた種なしのパン菓子[a]と、油を塗った種なしの薄焼きパンを用意すること。これらはいずれも上質の小麦粉で作ること。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「種なしのパン」とも訳せる。ヘブライ語は、一般的なパンとは区別される、焼いたパンまたは菓子状のパンを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: 種なしパン
  rationale: パン種を用いない祭儀上のパンを指す定着した自然な表現。
- source_word: חַלֹּת מַצֹּת
  choice: 種なしの輪形パン
  rationale: חַלָּה はパン、特に輪形またはまとまりのあるパンを指し得る。一般的な「種なしパン」および薄い רָקִיק との違いを示すため「輪形パン」とした。形状を広く捉えるなら「種なしのパン菓子」も可能。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 油を混ぜた
  rationale: בלל の受動分詞が、油を素材に混ぜ合わせた調理法を表すため。
- source_word: רְקִיקֵי מַצּוֹת
  choice: 種なしの薄焼きパン
  rationale: רָקִיק は薄いパン状の食品を指す。「ウエハース」より古代のパンとして誤解が少なく、חַלּוֹת との厚さの違いも表せる。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 油を塗った
  rationale: משׁח は通常「油を注ぐ／塗る（油を注いで任命する）」を意味するが、ここでは薄焼きパンの調理を述べるため、具体的で自然な「油を塗った」とした。
- source_word: סֹלֶת חִטִּים
  choice: 上質の小麦粉
  rationale: סֹלֶת は精製された上質の粉、חִטִּים は小麦を表す。現代日本語で自然な語順とした。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: これらは…作ること
  rationale: 祭儀規定における未完了形の指示・命令の力を、現代日本語の簡潔な規定表現で示した。
theological_decisions: []
translation_notes:
  register: 祭儀規定としての品位を保ちつつ、現代の一般読者に明瞭な表現を採用した。文頭の接続詞を「また」で表し、列挙を自然な日本語に整えた。「油を塗った」は調理文脈での意味を明確にする一方、原語が任命のための『油を注ぐ／塗る』にも用いられる語であることは語彙判断に記録した。
