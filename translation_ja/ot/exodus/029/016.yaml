- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 祭壇の周囲に
  rationale: עַלはここでは血を祭壇に施す対象関係を示し、סָבִיבは祭壇の四周を意味する。自然な日本語としてまとめた。
