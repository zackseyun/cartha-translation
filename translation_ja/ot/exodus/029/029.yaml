base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: ja
  text: アロンの聖なる衣服は、アロンの後にはその子らのものとなり、彼らがそれを着て油注ぎを受け、祭司職に任じられるためのものである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「それらの中で彼らの手を満たす」。「手を満たす」は、祭司として職に就けることを表すヘブライ語の慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: 聖なる衣服
  rationale: 祭司の務めのために聖別された衣服を指す。「聖なる衣服」は原語の構造と聖別の意味を保ちつつ、現代日本語として明瞭である。
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: アロンの
  rationale: ここで前置詞 לְ は所属・帰属を表すため、簡潔で自然な所有表現とした。
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: 彼の後、その子らのものとなる
  rationale: アロンの死後、祭司職を継ぐ子らへ衣服が受け継がれることを表す。原文の「彼の後」を保持した。
- source_word: לְמָשְׁחָה בָהֶם
  choice: 彼らはそれを着て油を注がれ
  rationale: בָהֶם は衣服を油注ぎの道具とするのではなく、それを身に着けた状態を示す。「それを着て」により、日本語で誤解なく表した。受動の意味は文脈上、任職される息子たちに向けられる。
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: それを着て祭司職に任じられる
  rationale: מלא את־יד は直訳では「手を満たす」だが、祭司として職に就けることを表す儀礼的慣用句である。本文は自然で機能的な訳とし、原語の比喩を脚注に残した。
theological_decisions:
- issue: 祭司任職の慣用句 מלא את־יד の訳し方
  choice: 祭司職に任じられる
  alternative: 彼らの手を満たす／聖別される
  rationale: 直訳の「手を満たす」は現代日本語では意味が伝わらないため、祭司への就任という文脈上の機能を明示した。「任職」だけでは何の職か曖昧なので「祭司職」とした一方、原語特有の表現は脚注で示した。
- issue: בָהֶם／בָם が示す衣服との関係
  choice: それを着て
  alternative: その衣服によって／その中で
  rationale: 衣服を手段と断定せず、油注ぎと任職の際にその衣服を身に着けているという状況的意味を自然に表した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。前半は原文の継承関係を簡潔に保ち、後半の二つの目的表現は日本語として自然な受動文に展開した。「衣服」は集合的に受けて「それ」とし、着用の意味を明示した。
