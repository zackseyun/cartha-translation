  text: וְ/לָֽקַחְתָּ֗ אֶֽת כָּל הַ/חֵלֶב֮ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּרֶב֒ וְ/אֵ֗ת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֖לֶב אֲשֶׁ֣ר עֲלֵי/הֶ֑ן וְ/הִקְטַרְתָּ֖ הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: ja
  text: あなたは、内臓を覆う脂肪をすべて、肝臓に付いている部分[a]、二つの腎臓、およびその上の脂肪を取り、祭壇の上で焼いて煙にしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の葉」とも訳せる。ヘブライ語は肝臓に付いている特定の部位を指すが、厳密にどの部位かは明らかでない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: あなたは……取り
  rationale: 接続詞を伴う完了形は、一連の祭儀手順の中で命令を表す。日本語では後続の「しなさい」に統合し、自然な手順文とした。
- source_word: כָּל הַחֵלֶב
  choice: 脂肪をすべて
  rationale: חֵלֶב は犠牲動物の脂肪部分を指す。「脂肪」が明瞭で、現代日本語として広く理解できる。
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 内臓を覆う
  rationale: קֶרֶב はここでは動物の体内の諸器官ないし内側部分を指す。「内臓」は具体的で自然である。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝臓に付いている部分[a]
  rationale: יוֹתֶרֶת は肝臓に関連する特定部位を表すが、現代解剖学上の厳密な同定には不確かさがある。「部分」として断定を避け、עַל の位置・付着関係も表した。
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 二つの腎臓
  rationale: 明確な解剖学的表現であり、原文の数も保持した。
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: その上の脂肪
  rationale: עֲלֵיהֶן を直接的に表し、直前の二つの腎臓を受ける自然な日本語とした。
- source_word: וְהִקְטַרְתָּ
  choice: 焼いて煙にしなさい
  rationale: 祭儀文脈における קטר のヒフィル形は、祭壇で焼いて煙を立ち上らせることを表す。単なる「焼く」より祭儀動作を明確にする。
- source_word: הַמִּזְבֵּחָה
  choice: 祭壇の上で
  rationale: 方向を表す語尾を伴い、祭壇へ載せて焼く動作を示す。日本語では「祭壇の上で」が自然である。
theological_decisions: []
