  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תַּקְרִ֔יב אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: ja
  text: アロンとその息子たちを会見の天幕の入口に連れて行き、水で彼らを洗いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּקְרִיב
  choice: 連れて来て
  rationale: קרבのヒフィル形は「近づける、連れて来る、差し出す」を意味する。ここでは人を儀式の場へ移動させる指示なので、現代日本語として自然な「連れて来て」とし、祭儀的な「進み出させる／差し出す」の可能性は脚注に残した。
- source_word: אֶל פֶּתַח
  choice: 入り口まで
  rationale: אֶלは目的地への方向を示し、פֶּתַחは開口部・入り口を指す。「まで」により、天幕の内部ではなく入り口が移動の到達点であることを自然に表した。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神が定められた場で会うための幕屋を指す定型的名称として、明瞭で荘重な「会見の天幕」を採用した。
- source_word: וְרָחַצְתָּ
  choice: 洗いなさい
  rationale: רחץは「洗う、身を洗わせる」の意。手順を示す命令として、現代日本語の明確な指示表現にした。
- source_word: בַּמָּיִם
  choice: 水で
  rationale: 前置詞בはここでは洗浄の手段を示すと理解し、日本語で自然な「水で」とした。
- source_word: אַהֲרֹן וְאֶת בָּנָיו
  choice: アロンとその息子たち
  rationale: 固有名は日本語で定着した「アロン」とし、בניםは祭司任職の文脈に即して性別を明示する「息子たち」と訳した。
- source_word: אֹתָם
  choice: 彼らを
  rationale: アロンとその息子たち全員を受ける複数男性目的語であり、簡潔に「彼らを」とした。
theological_decisions:
- issue: 祭司任職の文脈におけるקרבの祭儀的含意
  choice: 本文では「連れて来て」とし、脚注で「進み出させて」を示す
  alternative: アロンとその息子たちを進み出させて／差し出して
  rationale: 原語は単なる移動だけでなく、祭儀のために人を近づけ、正式に立たせる含みを持ち得る。ただし本文で「差し出す」とすると供え物のような意味を過度に強めかねないため、自然な移動表現を用い、祭儀的可能性を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語による祭儀手順の命令文。「会見の天幕」は聖所の名称としての荘重さを保ちつつ、文全体は一般読者にも理解しやすい語順にした。
