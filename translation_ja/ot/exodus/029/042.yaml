  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: ja
  text: これは、代々にわたり、会見の天幕の入口でヤハウェの前にささげる、常にささげる全焼の供え物[a]である。そこで、わたしはあなたがたと会い、そこであなた[b]に語る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「継続的な全焼の供え物」「恒久の全焼の供え物」。ここでの語は、絶え間ない動作というより、定めに従って継続してささげられる供え物を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、「あなたがたと」は複数形だが、「あなたに」は単数形である。後者は特にモーセを指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: 常供の全焼のささげ物
  rationale: עֹלָהを祭儀用語として「全焼のささげ物」とし、תָּמִידは絶え間ない動作というより、規定に従って継続的・定期的にささげる性格を示すため「常供の」とした。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたり
  rationale: ' successive generations に及ぶ継続的な適用を、自然な現代日本語で表した。'
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口で
  rationale: פֶּתַחの場所を示す用法を「入り口で」とし、אֹהֶל מוֹעֵדは神が人と会う場所という語義を保つ慣用的表現「会見の天幕」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 祭儀的・空間的なלִפְנֵיを「前に」とし、神名יהוהは称号に置き換えず「ヤハウェ」と音写した。
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: そこで、わたしはあなたがたと会い
  rationale: Nifal形אִוָּעֵדの、定められた場所で会う意味を簡潔に表した。לָכֶםが複数形であることを「あなたがた」によって明示した。
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: そこであなたに語る
  rationale: 目的を示す不定詞を文脈上自然な並列述語として表し、אֵלֶיךָの単数形を「あなた」によって保持した。שָׁםも「そこで」と明示した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を称号へ置換せず、現代日本語で一般的な音写によって示した。
- issue: 節内での二人称の数の交替
  choice: 「あなたがたと会い」（複数）と「あなたに語る」（単数）を区別する
  alternative: 両方を複数または単数にそろえる
  rationale: 原文はלָכֶם（複数）からאֵלֶיךָ（単数）へ移る。この交替は、より広い共同体と、直接語りかけられるモーセとの区別を示す可能性があるため、調和させず保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀用語は理解可能性を保ちながら原文の専門性を残し、「常供」「全焼のささげ物」「会見の天幕」を用いた。二人称の単複の違いは日本語でも明示した。
