source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/אַ֔יִל תְּנַתֵּ֖חַ לִ/נְתָחָ֑י/ו וְ/רָחַצְתָּ֤ קִרְבּ/וֹ֙ וּ/כְרָעָ֔י/ו וְ/נָתַתָּ֥ עַל נְתָחָ֖י/ו וְ/עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: ja
  text: 雄羊を部位ごとに切り分け、その内臓[a]と脚を洗い、それらを、切り分けた部分と頭の上に置きなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「内臓」と訳した語は、より広く動物の「内部」または「内側の部分」を指すこともあります。
    reason: lexical_alternative
  - marker: b
    text: 「上に」は直訳です。ここでは、洗った内臓と脚を、切り分けた部分や頭と一緒に並べるという意味とも考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: 雄羊
  rationale: 祭儀の文脈における אַיִל は、成長した雄の羊を指すため、日本語で自然かつ正確な「雄羊」とした。
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: 部位ごとに切り分け
  rationale: נתח のピエル形と נְתָחִים は、いけにえを所定の部分に切り分ける行為を表す。「部位ごとに切り分け」は祭儀上の手順を明瞭に伝える。
- source_word: קִרְבּוֹ
  choice: その内臓
  rationale: קֶרֶב は広く「内部」を意味し得るが、動物を洗うこの祭儀的文脈では内臓・内側の部分を指す。「内臓」は現代日本語で具体的かつ自然であるが、語義の幅は脚注に残した。
- source_word: כְרָעָיו
  choice: 脚
  rationale: כְּרָעַיִם は動物の脚、特に下脚部を指す。「すね」より範囲を限定しすぎず、一般読者にも分かりやすい「脚」とした。
- source_word: וְנָתַתָּ עַל
  choice: 上に置きなさい
  rationale: עַל の基本的な空間関係「上に」を本文で保持した。祭壇上で他の部位と一緒に配置する意味である可能性は脚注に示した。
- source_word: רֹאשׁוֹ
  choice: 頭
  rationale: 身体部位を指す直接的で自然な訳語である。
theological_decisions:
- issue: 洗った内臓と脚を置く位置を表す עַל の解釈
  choice: 切り分けた部分と頭の「上に」置く
  alternative: 切り分けた部分や頭と「一緒に」置く
  rationale: עַל の通常の意味を本文に保ちつつ、祭儀上の配置を表して「一緒に」の意味合いを持つ可能性も排除せず、脚注で提示した。特定の祭儀理解に決め打ちしない。
translation_notes:
  register: 明瞭な現代標準日本語による祭儀規定の命令文。「置きなさい」で原文の二人称単数命令的表現を自然に示し、「それらを」によって洗った内臓と脚が目的語であることを明確にした。
