base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: ja
  text: 祭壇の上に献げる[a]べきものは、次のとおりである。一歳の子羊[b]二匹を、日ごとに絶えず[c]献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭壇の上で行う」。ヘブライ語の動詞は広く「行う／造る」を意味するが、ここでは犠牲を献げる祭儀を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「一年の子ら」で、ここでは一歳の子羊を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「毎日、絶えず」。日ごとに規則正しく献げ続けることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר
  choice: 次のとおりである
  rationale: 後続する祭壇での務めを導入する表現として、接続詞の働きも含め、現代日本語で明瞭かつ自然に表した。
- source_word: תַּעֲשֶׂה עַל הַמִּזְבֵּחַ
  choice: 祭壇の上に献げるべき
  rationale: 動詞 עשה 自体は広く「行う／造る」を意味するが、祭壇と犠牲獣が続く文脈では、祭儀上の行為を示す「献げる」が自然である。原語の広い語義は脚注に残した。
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: 一歳の子羊
  rationale: 「一年の子ら」というヘブライ語の年齢表現を、意味を保った自然な日本語にした。כְּבָשִׂים はここでは「子羊」と訳すのが簡潔で文脈に適う。
- source_word: שְׁנַיִם לַיּוֹם
  choice: 二匹を、日ごとに
  rationale: 数と一日ごとの反復を明確に示す。動物の助数詞には現代標準語として「匹」を用いた。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 祭儀的文脈における、日々規則正しく継続される務めを表す。中断のない単一動作とも読める語感を避けるため、「日ごとに」と組み合わせた。
