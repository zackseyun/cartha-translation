base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: ja
  text: あなたは衣服を取り、アロンに長衣、エフォドの上衣、エフォド、胸当て[b]を着せ、エフォドを彼の身に、エフォドの織り帯で留めなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エフォドの織り帯で彼の身に締めなさい」とも訳せる。ここで使われるヘブライ語の動詞はまれで、エフォドを身に締める、または取り付けることを表すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 伝統的に「胸当て」または「胸飾り」と訳される。ヘブライ語は胸に着ける装具を指すが、武具とは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: あなたは衣服を取り
  rationale: 手順を示す連続した命令として自然な日本語にした。「衣服」は一般語בְּגָדִיםの意味を保ち、後代の教会用語を持ち込まない。
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: アロンに…を着せ
  rationale: לבשのヒフィル形が表す使役、すなわちアロンに衣服を着用させることを簡潔に表す。
- source_word: הַכֻּתֹּנֶת
  choice: 長衣
  rationale: 体の近くに着る基本的な衣を指す語であり、祭司の衣服を扱う文脈で分かりやすい慣用的訳語を用いた。
- source_word: מְעִיל הָאֵפֹד
  choice: エフォドの上着
  rationale: エフォドと結び付いたמְעִילを指す連語。「上着」は衣服として自然で、構文上の関連も保つ。
- source_word: הָאֵפֹד
  choice: エフォド
  rationale: 正確に対応する日本語のない祭司特有の装具なので、誤解を招く意訳を避けて音写した。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 胸に着ける祭司の装具を表す。「胸当て」は武具と断定せず、位置と形状を明瞭に伝える。
- source_word: וְאָפַדְתָּ לוֹ
  choice: それを彼の身に留めなさい
  rationale: まれな動詞אפדがこの文脈で表す、エフォドを身に締め付けて装着する行為を自然に表現した。目的語「それ」は直前の装具の中心であるエフォドを受ける。語義の幅は脚注に残した。
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: エフォドの織り帯で
  rationale: חֵשֶׁבはここではエフォドに付属してそれを固定する織物の帯を指す。簡潔で具体的な「織り帯」とした。
