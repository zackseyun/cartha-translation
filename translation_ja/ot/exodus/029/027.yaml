  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: ja
  text: あなたは、任職の雄羊[b]、すなわちアロンに属するものとその子らに属するものから、揺り動かすささげ物の胸肉と、持ち上げるささげ物[a]のもも肉、すなわち揺り動かされた胸肉と持ち上げられたもも肉を聖別しなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「持ち上げるささげ物」は、取り分けてささげる物を指す祭儀用語。伝統的には「挙祭」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「満たしの雄羊」。祭司を務めに就ける任職の儀式で用いる雄羊を指す。
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: 聖別しなければならない
  rationale: ピエル形が表す「聖なるものとして取り分ける」という祭儀的意味を保ち、命令的な法規文として自然な日本語にした。
- source_word: חֲזֵה
  choice: 胸肉
  rationale: 犠牲動物の胸の部位を指すため、食肉の部位として分かりやすい「胸肉」とした。
- source_word: תְּנוּפָה
  choice: 揺り動かす奉献物
  rationale: 関連動詞 נוף との語のつながりを保ち、主の前で揺り動かす祭儀動作と奉献物としての性格をともに示した。
- source_word: שׁוֹק
  choice: もも肉
  rationale: 犠牲動物の脚の上部を指す祭儀上の部位名として、現代日本語で明瞭な表現を選んだ。
- source_word: תְּרוּמָה
  choice: 持ち上げる奉納物
  rationale: 取り分けてささげる物という祭儀的性格を「奉納物」で示し、関連動詞 רום との対応を「持ち上げる」で保った。
- source_word: הוּנַף
  choice: 揺り動かされた
  rationale: ホファル形の受動態を反映し、תְּנוּפָה と同じ動作語を用いた。
- source_word: הוּרָם
  choice: 持ち上げられた
  rationale: ホファル形の受動態を反映し、תְּרוּמָה の語源的な祭儀動作との対応を示した。
- source_word: אֵיל הַמִּלֻּאִים
  choice: 任職の雄羊
  rationale: 直訳的な「満たしの雄羊」では意味が伝わりにくいため、祭司を務めに就ける儀式で用いる雄羊であることを簡潔に表した。
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: アロンの分とその子らの分から
  rationale: 各人に割り当てられた部分を示す所有・配分の構文を、過度に解釈せず自然な日本語で表した。
theological_decisions:
- issue: 祭儀用語と関連動詞の対応
  choice: 「揺り動かす奉献物／揺り動かされた」「持ち上げる奉納物／持ち上げられた」と、名詞と動詞の対応が見える訳にした。
  alternative: 「ささげ物」「取り分けた物」などの一般的な表現に平準化する。
  rationale: 祭司任職の手順を述べる本文は二つの祭儀動作を明示的に対応させているため、その具体性を残し、後代の教派的解釈を加えないようにした。
- issue: מִלֻּאִים の訳
  choice: 本文では慣用的意味を示す「任職」とし、字義は脚注に残した。
  alternative: 「聖別」「就任」または直訳の「満たし」を本文に置く。
  rationale: この文脈では祭司職に就ける儀式を指すが、ヘブライ語固有の表現も失わないよう脚注で補った。
translation_notes:
  register: 現代の一般読者に理解できる荘重な法規文とした。「奉献物」「奉納物」で祭儀的区別を示しつつ、関連する動作を平易な「揺り動かす」「持ち上げる」で明示した。原文の長い一文構造は保ちながら、「すなわち」で二つの受動表現の対応を分かりやすくした。
