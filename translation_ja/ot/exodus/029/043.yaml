source:
  edition: WLC
  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: ja
  text: そこで、わたしはイスラエルの子ら[a]と会う。そこは、わたしの栄光によって聖なるものとされる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では「イスラエルの子ら」で、イスラエルの民を指す定型表現。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「聖なるものとされる」の主語が明示されていない。文脈上、聖所の区域全般、より具体的には会見の幕屋または祭壇を指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: わたしは……と会う
  rationale: נפעל形のיעדは、幕屋の文脈では定められた場所で会うことを表す。「会う」は、神との出会いという意味を過度に説明せず、現代日本語で明瞭に伝える。
- source_word: שָׁמָּה
  choice: そこで
  rationale: 直前まで述べられている聖所の場所を指す場所の副詞。「そこで」とすることで文脈上のつながりを自然に示す。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らと
  rationale: יעדと結び付く前置詞לはここでは会う相手を示す。「イスラエルの子ら」は原語の契約共同体を指す定型表現を保ち、「イスラエル人」という慣用的な意味は脚注で示す。
- source_word: וְנִקְדַּשׁ
  choice: 聖なるものとされる
  rationale: קדשのニファル形が持つ受動の意味を明示する。「聖別される」より一般読者に分かりやすく、しかも聖なる状態にされるという意味を保つ。
- source_word: בִּכְבֹדִי
  choice: わたしの栄光によって
  rationale: 前置詞בを手段・作用者として取り、神の栄光が聖なるものとする働きを担うことを表す。כבודはここで神の現れとしての「栄光」を指す。
theological_decisions:
- issue: 「聖なるものとされる」の暗黙の主語
  choice: 本文では広く場所を指す「そこ」を主語として補い、具体的対象は限定しない。
  alternative: 会見の幕屋、祭壇、または聖所の区域を明示する。別案としてアロンを主語と見る。
  rationale: ヘブライ語の動詞は三人称男性単数だが、明示された主語がない。日本語本文では誤読を避けるため「そこは」と補う一方、幕屋や祭壇のいずれかに限定せず、原文の曖昧さを脚注に残す。
- issue: בְּנֵי יִשְׂרָאֵלの表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原語の形を見える形で保ちつつ、これが男女を含むイスラエルの民全体を指す定型的民族・契約共同体表現であることを脚注で説明する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「イスラエルの子ら」「栄光」「聖なるものとされる」によって原文の契約的・祭儀的な格調を保った。二文に分け、暗黙の主語を「そこは」と最小限補って日本語としての誤読を避けた。
