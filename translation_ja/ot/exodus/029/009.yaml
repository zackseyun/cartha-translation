  text: וְ/חָגַרְתָּ֩ אֹתָ֨/ם אַבְנֵ֜ט אַהֲרֹ֣ן וּ/בָנָ֗י/ו וְ/חָבַשְׁתָּ֤ לָ/הֶם֙ מִגְבָּעֹ֔ת וְ/הָיְתָ֥ה לָ/הֶ֛ם כְּהֻנָּ֖ה לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מִלֵּאתָ֥ יַֽד אַהֲרֹ֖ן וְ/יַד בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: ja
  text: アロンとその子らに帯を締めさせ、彼らにかぶり物をかぶせなさい。祭司職は、永続する定めとして彼らのものとなる。こうして、アロンとその子らを祭司として任職させなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「アロンの手と、その子らの手を満たしなさい」。祭司職に正式に就けることを表すヘブライ語の慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: 帯を締め
  rationale: 祭司の装束である帯を身に着けさせる動作を、明瞭で自然な現代日本語で表した。
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: 彼らにかぶり物をかぶせ
  rationale: חבש は頭に巻く、または着ける動作を表し、מִגְבָּעוֹת は大祭司の冠とは区別される祭司たちの頭の装具である。「かぶり物」は形状を過度に特定しない。
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: 祭司職は…彼らのものとなる
  rationale: לָהֶם による所属・付与を日本語で明確にし、祭司としての務めだけでなく職そのものを示した。
- source_word: לְחֻקַּת עוֹלָם
  choice: 永続する定めとして
  rationale: עוֹלָם の長期にわたる継続性を保ちつつ、文脈を越えて哲学的な絶対永遠を断定しない表現とした。
- source_word: וּמִלֵּאתָ יַד
  choice: 祭司として任職させなさい
  rationale: 直訳では「手を満たす」だが、ここでは祭司職に正式に就けることを表す専門的な慣用句である。意味を本文で明示し、字義は脚注に残した。
theological_decisions:
- issue: לְחֻקַּת עוֹלָם が示す祭司職の継続期間
  choice: 永続する定めとして
  alternative: 永遠の定めとして
  rationale: イスラエルの契約的・祭儀的秩序における継続的効力を表しながら、後代の神学的結論を訳文に持ち込まないため。
- issue: וּמִלֵּאתָ יַד の祭司任職慣用句
  choice: 祭司として任職させなさい
  alternative: アロンとその子らの手を満たしなさい
  rationale: 現代の読者に行為の機能を明瞭に伝えつつ、重要なヘブライ語の比喩は脚注で開示するため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀用語は必要な範囲で保持し、「かぶり物」によって頭装具の形状を不必要に限定しない。「任職」は文脈上「祭司として」を添えて理解しやすくした。
