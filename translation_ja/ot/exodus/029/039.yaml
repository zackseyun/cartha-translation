  text: אֶת הַ/כֶּ֥בֶשׂ הָ/אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ja
  text: 一頭の子羊を朝に献げ、二頭目の子羊を二つの夕べの間に[a]献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「二つの夕べの間に」。伝統的な表現で、一般に「夕暮れ時」、または午後遅くから日没までの時間帯を指すと理解されるが、厳密な時間については解釈が分かれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: 子羊
  rationale: いけにえに用いる若い羊を指す語として、現代日本語で自然かつ具体的な「子羊」を選んだ。
- source_word: הָאֶחָד
  choice: 一頭の
  rationale: 直訳的な「その一つ」を、日本語で羊を数える助数詞を用いて自然に表した。後半の「二頭目」との対応も保たれる。
- source_word: תַּעֲשֶׂה
  choice: 献げなさい
  rationale: 基本義は「行う、作る」だが、ここでは祭儀上いけにえをささげることを意味するため、文脈に即して「献げる」とした。
- source_word: בַבֹּקֶר
  choice: 朝に
  rationale: 時間を表す前置詞句を、簡潔で自然な現代日本語にした。
- source_word: הַשֵּׁנִי
  choice: 二頭目の
  rationale: 序数「第二の」を、羊を数える日本語として自然に表し、二つの日ごとの献げ物の順序を明確にした。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 二つの夕べの間に
  rationale: 字義どおりには「二つの夕べの間に」であり、具体的な時間帯には解釈上の幅があるため、本文では独特な表現を保持し、脚注で一般的な理解を示した。
