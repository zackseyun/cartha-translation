id: EXO.29.28
reference: Exodus 29:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: ja
  text: これは、イスラエルの人々が負う永続する定めとして、アロンとその子らのものとなる。それは奉納物であり、イスラエルの人々が自分たちの平和のいけにえ[a]から主にささげる奉納物となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和のいけにえ」は、「交わりのいけにえ」または「健やかさのいけにえ」とも訳せる。ヘブライ語は平和、完全さ、健やかさ、回復された関係に関わる意味合いをもつ。
    reason: שְׁלָמִיםという祭儀用語の意味領域と、本文訳がその全てを限定的に表すものではないことを示すため。
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らのための……となる
  rationale: היה の基本的な「～となる／～である」を保ちつつ、לְ が示す受益・帰属を自然な日本語で表した。
- source_word: לְחָק עוֹלָם
  choice: 永遠の定め
  rationale: חק の法的・祭儀的な「定め」と、עולם の継続性を簡潔に表す。文脈上は恒久的な規定を意味し、哲学的な無限性を断定しない。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らから受ける
  rationale: מֵאֵת の起点を「から」で示し、前半の帰属関係が明確になるよう「受ける」を補った。בני ישראל は原文の契約共同体的表現を保って「イスラエルの子ら」とした。
- source_word: תְרוּמָה
  choice: 奉納物
  rationale: 神のために取り分けて差し出す物という祭儀的意味を、現代日本語で理解しやすく表す。「献納物」より平明で、「供え物」ほど広すぎない。
- source_word: וּתְרוּמָה יִהְיֶה
  choice: すなわち……奉納物である
  rationale: 前文を受けてその内容を具体化する反復として訳し、ヘブライ語の強調を保ちながら日本語の重複感を整えた。
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: 自分たちの交わりのいけにえ
  rationale: זבח の犠牲祭儀を「いけにえ」で表し、שלמים の平和・健全・交わりに関わる意味領域のうち、祭儀の共同性が伝わる表現を本文に採用した。別訳を脚注に示す。
- source_word: תְּרוּמָתָם לַיהוָה
  choice: 主にささげる奉納物
  rationale: 接尾辞の主体を「イスラエルの子らが」で示し、לְ の方向性を「主にささげる」と自然に表した。
- source_word: יהוה
  choice: 主
  rationale: 日本語聖書で広く認識される敬虔な慣用に従い、神名を「主」とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 神名そのものを音写する可能性はあるが、本文ではユダヤ教以来の朗読伝統と日本語聖書の慣用に沿う「主」を採用した。
- issue: 祭儀用語 שְׁלָמִים
  choice: 交わりのいけにえ
  alternative: 和解のいけにえ／平安のいけにえ
  rationale: 語は平和、健全、繁栄、神との交わりを含み得るため、一つの教理的意味に限定せず、主要な別訳を脚注に残した。
- issue: חק עולם の時間的範囲
  choice: 永遠の定め
  alternative: 代々変わらない定め
  rationale: 原語の定型的な継続性を保つため「永遠」としたが、ここで哲学的無限性を明示的に読み込むものではない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調ある法令・祭儀文体。「奉納物」を反復して原文の語彙的一貫性を保ち、脚注記号[a]を該当語の直後に置いた。
