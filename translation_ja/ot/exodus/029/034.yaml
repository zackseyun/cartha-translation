source:
  edition: WLC
  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: ja
  text: もし、祭司の任職のささげ物[a]の肉やパンが朝まで残ったなら、残ったものを火で焼きなさい。それを食べてはならない。それは聖なるものだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別のささげ物」とも訳せる。ヘブライ語は、祭司をその務めに就ける任職の儀礼を指す。
    reason: 祭儀用語 הַמִּלֻּאִים の訳語の幅と文脈上の意味を示すため。
lexical_decisions:
- source_word: יִוָּתֵר / הַנּוֹתָר
  choice: 残ったなら／残ったもの
  rationale: יתרのニファル形と分詞形が表す「残る、残される」という意味を、条件文とその受けとなる表現で自然に対応させた。
- source_word: בְּשַׂר
  choice: 肉
  rationale: 祭儀で用いられる動物の肉を指すため、現代日本語で明瞭な「肉」とした。
- source_word: הַמִּלֻּאִים
  choice: 祭司任職のささげ物
  rationale: 語義の背景にある「手を満たす」儀礼、すなわち祭司を職に就ける任職式を示す。文脈上、肉を伴う供え物を指すため「ささげ物」を補った。
- source_word: לֶּחֶם
  choice: パン
  rationale: 通常の語義をそのまま明瞭に訳した。
- source_word: עַד הַבֹּקֶר
  choice: 朝まで
  rationale: עַדが示す時間的な限界を簡潔に保持した。
- source_word: וְשָׂרַפְתָּ ... בָּאֵשׁ
  choice: 火で焼きなさい
  rationale: 条件節に続く命令の機能と、火を手段とする表現を自然な日本語で示した。
- source_word: לֹא יֵאָכֵל
  choice: それを食べてはならない
  rationale: 受動形による禁止を、日本語の法令的で明瞭な禁止表現にした。
- source_word: קֹדֶשׁ
  choice: 聖なるもの
  rationale: 祭儀上、神に取り分けられた性質を示す標準的な訳語とした。名詞述語のニュアンスを「もの」で表した。
theological_decisions:
- issue: 祭司任職儀礼を指す הַמִּלֻּאִים の訳し方
  choice: 祭司任職のささげ物
  alternative: 聖別のささげ物／任職式のささげ物
  rationale: 出エジプト記29章の文脈では祭司を職に就ける儀礼を指すため、「祭司任職」が最も具体的である。一方、「聖別」も可能なので脚注で語の範囲を示し、特定の教派的理解には限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、命令と禁止には「焼きなさい」「食べてはならない」という dignified な法的・祭儀的調子を保った。脚注記号は、説明対象である「祭司任職のささげ物」の直後に置いた。
