  text: וְ/נָתַתָּ֤ אוֹתָ/ם֙ עַל סַ֣ל אֶחָ֔ד וְ/הִקְרַבְתָּ֥ אֹתָ֖/ם בַּ/סָּ֑ל וְ/אֶ֨ת הַ/פָּ֔ר וְ/אֵ֖ת שְׁנֵ֥י הָ/אֵילִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: ja
  text: それらを一つの籠に入れ[a]、その籠に入れたまま、雄牛と二頭の雄羊とともに近づけなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「一つの籠の上に」。ここでは、品々を一つの籠の中に入れるという意味。
    reason: lexical_alternative
  - marker: b
    text: 「近づけなさい」は、「差し出しなさい」または「献げなさい」とも訳せる。原語は祭儀の文脈で用いられる「近づける」という動詞。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 入れ
  rationale: נתןは「与える、置く」を意味するが、籠を容器として用いるこの文脈では、現代日本語の「入れる」が自然である。
- source_word: אוֹתָם
  choice: それらを
  rationale: 前節に列挙されたパン類を受ける男性複数の目的語代名詞。指示関係を保つため「それら」とした。
- source_word: עַל סַל אֶחָד
  choice: 一つの籠に
  rationale: עלの基本義は「上に」だが、נתןと容器を表す名詞との組み合わせでは、中に収める意味と理解するのが自然である。אֶחָדは「一つ」と明示した。
- source_word: וְהִקְרַבְתָּ
  choice: 近くに携えて来なさい
  rationale: קרבのヒフィル形は祭儀文脈で「近づける、ささげる、差し出す」を意味する。パン類だけでなく動物も目的語なので、特定の奉献動作に限定せず、語の基本像を残した。
- source_word: בַּסָּל
  choice: 籠に入れたまま
  rationale: בはここではパン類が籠の中にある状態を示す。単なる同伴とせず、容器内に収められた状態を明確にした。
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: 雄牛と二匹の雄羊とともに
  rationale: 反復される目的語標識は、雄牛と二匹の雄羊も「携えて来る」対象であることを示す。「とともに」で日本語の関係を明瞭にした。
- source_word: הַפָּר
  choice: 雄牛
  rationale: פַּרの通常の意味を簡潔に表した。文脈上すでに特定されているが、日本語では冠詞を明示する必要がない。
- source_word: שְׁנֵי הָאֵילִם
  choice: 二匹の雄羊
  rationale: 数詞と定冠詞付き名詞の構文を自然な日本語で表した。動物の助数詞には「匹」を用いた。
theological_decisions:
- issue: וְהִקְרַבְתָּを祭儀用語としてどこまで特定するか
  choice: 近くに携えて来なさい
  alternative: ささげなさい／差し出しなさい
  rationale: この段階では籠のパン類と動物を祭壇付近へ連れて来ることが中心であり、「ささげる」とすると後続する具体的な奉献・屠殺の行為まで先取りする可能性があるため、原語の「近づける」という像を保った。
translation_notes:
  register: 祭司任職の手順を述べる命令文として、明瞭で品位ある現代標準日本語を用いた。「携えて来なさい」により、籠の中の品々と動物を聖所へ近づける動作を自然に表しつつ、祭儀用語の幅を脚注に残した。
