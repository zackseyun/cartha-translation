  text: וְ/אָכַ֨ל אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת בְּשַׂ֣ר הָ/אַ֔יִל וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר בַּ/סָּ֑ל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: ja
  text: アロンとその息子たちは、会見の天幕の入口で、雄羊の肉と、かごの中のパンを食べなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַל
  choice: 食べなければならない
  rationale: 接続詞を伴う完了形は、この祭儀規定の文脈では過去の叙述ではなく、規定・指示の効力を表す。現代日本語でその義務的な力を自然に示した。
- source_word: אַהֲרֹן וּבָנָיו
  choice: アロンとその子ら
  rationale: 祭司任職の文脈で、アロンと祭司職に就く息子たちを指す。「子どもたち」よりも原文の男性複数と具体的指示対象を正確に保つ。
- source_word: בְּשַׂר הָאַיִל
  choice: 雄羊の肉
  rationale: בשר は字義的に「肉、肉体」だが、犠牲動物を食べるこの文脈では日本語の「肉」が具体的かつ自然であり、食用の肉という意味も十分に伝える。אַיִל は雄羊を指す。
- source_word: הַלֶּחֶם אֲשֶׁר בַּסָּל
  choice: かごの中のパン
  rationale: 関係節を簡潔な連体修飾にし、パンが祭儀用のかごの中にあることを明確にした。לֶחֶם の単数形はここでは集合的に「パン」を指す。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入口で
  rationale: פתח は「入口」、אֹהֶל מוֹעֵד は神と会う場所としての祭儀用天幕を表す定型句である。句末の場所表現は食べる行為が行われる場所として訳した。
theological_decisions:
- issue: 祭儀規定における動詞の効力
  choice: 食べなければならない
  alternative: 食べる／食べるものとする
  rationale: 単純な未来や叙述ではなく、任職儀礼についての拘束的な規定であることを示す。ただし、原文にない命令法へ変えることは避けた。
- issue: 祭司職の文脈における男性を指す表現
  choice: その子ら
  alternative: その子どもたち
  rationale: ここで בָנָיו は一般的な家族全体ではなく、任職儀礼に加わるアロンの息子たちを指すため、指示対象の限定を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の語順を機械的に写さず、場所句を動詞の前に置いて自然な日本語にした。「会見の天幕」は祭儀用語として一貫性を保つ表現である。
