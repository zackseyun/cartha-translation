  text: וְ/שָׁחַטְתָּ֣ אֶת הָ/אַ֗יִל וְ/לָקַחְתָּ֤ מִ/דָּמ/וֹ֙ וְ/נָֽתַתָּ֡ה עַל תְּנוּךְ֩ אֹ֨זֶן אַהֲרֹ֜ן וְ/עַל תְּנ֨וּךְ אֹ֤זֶן בָּנָי/ו֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וְ/זָרַקְתָּ֧ אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: ja
  text: 次に、あなたはその雄羊を屠り、その血の一部を取って、アロンの右の耳たぶ[a]と、その息子たちの右の耳たぶ、また彼らの右手の親指と右足の親指につけなさい。そして、その血を祭壇の周囲に勢いよく振りかけなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「右の耳の先」とも訳せる。ヘブライ語は耳の端の部分を広く指しうるが、この儀式の文脈では「耳たぶ」の可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 「その血を祭壇の周囲に浴びせなさい」とも訳せる。このヘブライ語動詞は、軽く水滴を散らすというより、血を勢いよく祭壇に施す儀式的な動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: 屠る
  rationale: いけにえとして動物を殺す行為を明確に表し、祭儀的文脈に適した現代日本語である。
- source_word: אַיִל
  choice: 雄羊
  rationale: いけにえの動物の種類と性別を簡潔かつ正確に示す。
- source_word: מִדָּמוֹ
  choice: その血を取って
  rationale: 原文は字義的には「その血から取って」だが、日本語では一部を取ることが文脈上明らかなため、自然な表現とした。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳たぶ
  rationale: 祭司任職の儀式において耳の端部を指す語であり、「耳たぶ」が最も具体的で自然。ただし語義には「耳の先」の可能性があるため脚注で示す。
- source_word: הַיְמָנִית
  choice: 右の
  rationale: 耳・手・足の右側を指定する形容詞を、日本語の自然な連体修飾で表した。
- source_word: בֹּהֶן יָד
  choice: 手の親指
  rationale: 手についての בֹּהֶן は親指を指す。
- source_word: בֹּהֶן רֶגֶל
  choice: 足の親指
  rationale: 足についての בֹּהֶן は最も大きな指を指し、現代日本語では「足の親指」が明瞭である。
- source_word: זָרַק
  choice: 振りかける
  rationale: 血を祭壇に勢いを伴って施す祭儀的動作を表す。日本語では「振りかける」が自然だが、軽い散布と誤解されうるため、力のある動作であることを脚注で補う。
- source_word: סָבִיב
  choice: 祭壇の周囲に
  rationale: 祭壇の各側面を巡るように血を施す分布的意味を自然な日本語で示す。
- source_word: וְ
  choice: 次に／そして／また
  rationale: 連続する祭儀手順を、原文の進行を保ちながら自然な日本語の接続表現で示す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、祭儀規定にふさわしい厳粛さを保った。「屠る」は専門性と可読性の均衡を取り、「祭壇」「雄羊」など一般的な聖書語彙を用いた。原文の命令と手順の連続性を保持している。
