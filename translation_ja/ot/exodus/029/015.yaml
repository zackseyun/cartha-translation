  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ja
  text: 次に、その一頭の雄羊[a]を取り、アロンとその子らは、その雄羊の頭に手を置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「その一頭の雄羊」。任職の儀式に用いる二頭の雄羊のうち、この雄羊をもう一頭と区別している。「第一の雄羊」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 次に
  rationale: 接続詞と目的語標識が儀式の次の手順を導入しているため、現代日本語で手順の進行を自然に示す「次に」とした。
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: もう一頭の雄羊
  rationale: 直訳的には「その一頭の雄羊」だが、二頭の雄羊が提示された直前の文脈（29:1, 3）では、そのうちの一頭を指す。「もう一頭」は他方との区別を自然に表す一方、「第一の」と順序を明示する解釈は本文に持ち込まない。
- source_word: תִּקָּח
  choice: 取る
  rationale: 男性単数の未完了形で、モーセに向けた規定上の指示。周辺の命令的な手順に合う簡潔な日本語とした。
- source_word: וְ/סָמְכוּ
  choice: 置く
  rationale: סמךは犠牲儀礼では手を動物の上に置く行為を表し、場合によっては体重をかける含意もある。「両手を置く」は日本語として明瞭で、本文にない儀礼の神学的意味を付加しない。
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: アロンとその子ら
  rationale: 祭司として任職されるアロンの息子たちを指す。「子ら」は簡潔で格調を保ち、文脈上男性であることも明らかである。
- source_word: אֶת יְדֵי/הֶם
  choice: 両手
  rationale: ヘブライ語は複数形「彼らの手」。各人が手を置く儀礼動作を、日本語で自然な「両手」とした。
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: その雄羊の頭に
  rationale: 前に挙げた雄羊を再度指す定冠詞を「その」で示し、עַלの位置関係を自然な「頭に」で表した。
theological_decisions:
- issue: 犠牲獣への按手を表す用語
  choice: 両手を置く
  alternative: 両手を押し当てる／両手をもたせかける
  rationale: 動詞סמךには支える、寄りかかるという語感があり得るが、この節は儀礼行為の意味や圧力の程度を説明していない。「置く」は行為を明確にしつつ、罪の転嫁などの神学的説明を本文へ持ち込まない。
- issue: הָאֶחָדを基数と序数のどちらで表すか
  choice: もう一頭の雄羊
  alternative: 第一の雄羊
  rationale: ヘブライ語は字義的には「その一頭」であり、「第一の」と明示してはいない。二頭のうち一頭を他方と区別する表現として訳し、儀式上先に扱われる事実を序数として本文に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で格調ある祭儀規定の文体。モーセへの指示は日本語で不自然な「あなたは」を補わず、連続する手順として表現した。
