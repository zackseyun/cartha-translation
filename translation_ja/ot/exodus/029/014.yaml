  text: וְ/אֶת בְּשַׂ֤ר הַ/פָּר֙ וְ/אֶת עֹר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ תִּשְׂרֹ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: ja
  text: しかし、その雄牛の肉と皮と糞は、宿営の外で火で焼かなければならない。それは罪のためのいけにえ[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清めのいけにえ」。ヘブライ語は「罪」と、罪に関してささげる犠牲の両方を表し得る。このような祭儀の文脈では一般に「罪のためのいけにえ」と訳されるが、儀式による清めの働きを強調して「清めのいけにえ」とすることもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: その雄牛の肉
  rationale: בָּשָׂרの具体的な身体的意味を保ちつつ、日本語の動物・犠牲に関する文脈で自然な「肉」とした。פַּרはここでは犠牲としてささげる雄牛を指す。
- source_word: עֹרוֹ
  choice: 皮
  rationale: 動物の体を覆う皮を指す語として、明瞭で自然な訳語を用いた。
- source_word: פִּרְשׁוֹ
  choice: 糞
  rationale: פֶּרֶשׁは内臓ではなく排泄物を指すため、意味を和らげず「糞」とした。
- source_word: תִּשְׂרֹף
  choice: 焼かなければならない
  rationale: 二人称単数形だが、日本語では主語を明示せず、祭儀上の命令としての拘束力を自然に表した。
- source_word: בָּאֵשׁ
  choice: 火で
  rationale: 前置詞בְּを手段として捉え、簡潔で自然な日本語にした。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 宿営の外で
  rationale: 荒野に設けられたイスラエルの宿営区域の外側を指す標準的な表現とした。
- source_word: חַטָּאת
  choice: 罪のためのいけにえ
  rationale: 祭儀文脈で罪に関わる犠牲を指すことを明示しつつ、一般読者にも理解しやすい表現とした。清めの機能を強調する別訳は脚注に残した。
- source_word: הוּא
  choice: それは…である
  rationale: 当該の雄牛ないしその祭儀的性格を同定するヘブライ語の断定を保持した。
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: 肉と皮と糞
  rationale: 列挙される三要素をすべて保持し、日本語では反復が過度に重くならない自然な並列表現とした。
theological_decisions:
- issue: 祭儀規定におけるחַטָּאתの訳し方
  choice: 罪のためのいけにえ
  alternative: 清めのいけにえ
  rationale: 直近の文脈では抽象的な「罪」ではなく犠牲を指す。本文では罪との関係を保つ認知しやすい訳を採り、儀式の清めの働きを前面に出す解釈も可能であることを脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祭儀規定にふさわしい簡潔で格調ある命令表現とした。「糞」は原語の具体性を保ち、「いけにえ」は一般読者への分かりやすさを優先して平仮名表記とした。
