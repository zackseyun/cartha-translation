  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: ja
  text: 次に、聖別のための油を取り、彼の頭に注ぎ、彼に油を塗りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 次に、…を取り
  rationale: 接続詞付き完了形が祭儀手順の次の動作を示すため、「次に」で順序を自然に表し、「取り」で後続する命令へつなげた。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 塗油・聖別に用いる特定の油を指す構文。現代日本語で簡潔に祭儀的用途を示す表現とした。
- source_word: וְיָצַקְתָּ
  choice: 注いで
  rationale: יצק の基本義である液体を「注ぐ」を採用し、最終命令へ自然に接続した。
- source_word: עַל רֹאשׁוֹ
  choice: 彼の頭に
  rationale: 前置詞句を明確かつ自然に訳し、油を注ぐ位置を保持した。
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: 彼に油を注ぎなさい
  rationale: משׁח の祭儀的行為を、日本語聖書で理解可能な「油を注ぐ」で表し、単なる聖別という抽象的な言い換えを避けた。
theological_decisions:
- issue: 油を頭に注ぐ行為と、彼に油を注ぐ行為との関係
  choice: 「彼の頭に注いで、彼に油を注ぎなさい」と二つの動詞を区別して訳す。
  alternative: 「彼の頭に油を注いで任職しなさい」のように、一方を解釈的な結果へ置き換える。
  rationale: ヘブライ語は「注ぐ」と「油を注ぐ」という二つの動詞を並置している。物理的動作と祭儀的行為の双方を保ち、その関係を訳文で一つに限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、祭儀命令としての簡潔さと品位を保った。「塗油」は専門的で硬いため本文では避け、「油を注ぐ」を採用した。
