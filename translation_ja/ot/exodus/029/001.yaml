  source_fidelity: ヘブライ語の構文と内容を正確に反映している。「彼らに行うこと」は לָהֶם を保ち、「聖別し、わたしのために祭司として仕えさせるために」は לְקַדֵּשׁ אֹתָם לְכַהֵן לִי の目的を適切に表す。雄牛一頭と、傷のない雄羊二匹という供え物の指定も忠実である。
  naturalness: 明瞭な現代標準日本語であり、儀式規定にふさわしい端正な文体である。「次のとおりである」から命令「取れ」への展開も自然である。
