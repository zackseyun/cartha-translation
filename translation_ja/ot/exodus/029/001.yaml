id: EXO.29.1
reference: Exodus 29:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: ja
  text: 彼らを聖別し、わたしのために祭司として仕えさせるために、あなたが彼らに行うことは次のとおりである。群れの中から雄牛一頭[a]と、傷のない雄羊二匹[b]を取れ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「若い雄牛一頭」。ヘブライ語は直訳すると「雄牛一頭、牛の群れの子」で、牛の群れに属する個体を表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 別訳「欠陥のない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: こと
  rationale: 儀式についてこれから示される内容・手順を指す。日本語では「こと」が原意の広さを保ちつつ自然であり、「事柄」より明瞭である。
- source_word: תַּעֲשֶׂה
  choice: あなたが…行う
  rationale: 未完了形の指示的用法を、後続の命令と区別しつつ、荘重で自然な日本語にした。
- source_word: לְקַדֵּשׁ
  choice: 聖別し
  rationale: 祭司職のために聖なるものとして取り分けるという祭儀的意味を表す標準的な訳語。
- source_word: לְכַהֵן לִי
  choice: わたしのために祭司として仕えさせる
  rationale: כהן の祭司職を果たす意味と、לי の神に向けられた奉仕をともに明示する。
- source_word: לְקַח
  choice: 取れ
  rationale: 直接的な命令形を簡潔に再現する。「連れて来い」までを本文だけから確定しない。
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 群れの中から雄牛一頭
  rationale: 字義的には「雄牛一頭、牛の子」で、牛の群れに属する個体を表す慣用句。年齢の含意を本文で断定しない。
- source_word: אֵילִם שְׁנַיִם
  choice: 雄羊二匹
  rationale: 名詞と明示された数を自然な日本語でそのまま表した。
- source_word: תְּמִימִם
  choice: 傷のない
  rationale: いけにえとなる動物に欠陥がないことを指す祭儀的用法。「完全な」より誤解が少なく、現代日本語として明瞭。
theological_decisions:
- issue: 祭司職を表す לְכַהֵן לִי
  choice: わたしのために祭司として仕えさせる
  alternative: わたしに祭司として仕えさせる
  rationale: アロン系祭司の職務を述べる文脈を保ちつつ、後代の教派的な職制概念を持ち込まない。「ために」は לי の受益・所属・奉仕の方向を自然に表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀規定にふさわしい端正さを保った。「次のとおりである」で導入部を自然に整理し、命令「取れ」の力を維持した。脚注記号は該当語句の直後に配置した。
