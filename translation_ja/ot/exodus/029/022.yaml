source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: ja
  text: また、その雄羊から、脂肪、脂肪の多い尾、内臓を覆う脂肪、肝臓の付属物[a]、二つの腎臓とその上の脂肪、さらに右のももを取りなさい。これは任職の雄羊[b]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肝臓の小葉」とも訳される。原語が指す厳密な部位については見解が分かれる。
    reason: 原語の解剖学的な曖昧さを示すため。
  - marker: b
    text: 別訳「聖別の雄羊」または「就任の雄羊」。祭司を務めに就ける儀式に用いる雄羊を指す。
    reason: 祭司就任儀礼を表すヘブライ語慣用句に複数の自然な訳し方があるため。
lexical_decisions:
- source_word: חֵלֶב
  choice: 脂肪
  rationale: いけにえの規定で、ささげるものとして指定された脂肪部分を指す。直接的で、同じ節における反復も保持できる。
- source_word: אַלְיָה
  choice: 脂肪の多い尾
  rationale: 羊に特有の脂肪を蓄えた尾を指すため、単なる「尾」より解剖学的な特徴を明確にした。
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: 内臓を覆う
  rationale: 分詞句の具体的な意味を自然な現代日本語で表した。
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: 肝臓の付属物
  rationale: どの部位を指すかには議論があるため、「肝臓の小葉」などと断定せず、原語の解剖学的な曖昧さを保った。
- source_word: כְּלָיֹת
  choice: 腎臓
  rationale: 文脈上、文字どおりの臓器を指す。
- source_word: שׁוֹק הַיָּמִין
  choice: 右のもも
  rationale: 祭儀で切り分けられる脚の上部を指す語として、自然で具体的な表現を選んだ。
- source_word: אֵיל מִלֻּאִים
  choice: 任職の雄羊
  rationale: 祭司として職務に就ける儀式に用いられる雄羊であることを簡潔に示す。
- source_word: וְלָקַחְתָּ
  choice: また、…取りなさい
  rationale: 一連の祭儀指示を続ける接続辞と完了形の命令的用法を、自然な手順表現として訳した。
theological_decisions:
- issue: אֵיל מִלֻּאִים における祭司就任儀礼の表現
  choice: 任職の雄羊
  alternative: 聖別の雄羊／就任の雄羊
  rationale: 文脈はアロンとその子らを祭司の務めに就ける儀式である。「任職」はその職務への就任を明確にしつつ、後代の特定教派の按手礼制度を読み込まない。原語は字義的には「満たすこと」と関係する慣用句なので、別訳を脚注に残した。
- issue: יֹתֶרֶת הַכָּבֵד の解剖学的同定
  choice: 肝臓の付属物
  alternative: 肝臓の小葉
  rationale: 祭儀で取り分ける部位だが、厳密な解剖学的同定には不確かさがあるため、本文では過度に限定しない表現を採用した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祭儀文としての簡潔さと品位を保った。「脂尾」のような専門語は避けて「脂肪の多い尾」とし、一般読者にも像が伝わるようにした。
