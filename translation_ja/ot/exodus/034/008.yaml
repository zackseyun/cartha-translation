base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/008.yaml
  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: ja
  text: モーセは急いで地に向かって身をかがめ、礼拝した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ひれ伏した」「伏し拝んだ」。ヘブライ語の動詞は、敬意や礼拝を表して身を伏せることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急いで
  rationale: 動作を速やかに行うことを表す動詞であり、モーセの即座の応答を自然な日本語で示す。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着している人名表記。
- source_word: וַיִּקֹּד
  choice: 身をかがめ
  rationale: 体を低く曲げる動作を表す。後続の動詞と同一視せず、まず身体的な動作として訳した。
- source_word: אַרְצָה
  choice: 地に向かって
  rationale: 「地、地面」を表す語の方向を示す形であり、身をかがめる方向を明確にする。
- source_word: וַיִּשְׁתָּחוּ
  choice: 礼拝した
  rationale: ひれ伏して敬意を表す動作を指し、この文脈では主の自己啓示に対する礼拝の意味を帯びる。直前の動詞が身体をかがめる動作をすでに述べているため、「礼拝した」として二つの動詞の区別を保った。
theological_decisions:
- issue: 最後の動詞を身体的な伏礼として訳すか、礼拝として訳すか
  choice: 礼拝した
  alternative: ひれ伏した／伏し拝んだ
  rationale: 語そのものは身体をひれ伏す行為を表し得るが、ここでは主の宣言に応答するモーセの畏敬の行為である。前の動詞が身体的な屈身を明示しているため、本文では文脈上の礼拝の意味を示しつつ、脚注で身体動作を前面に出す訳も提示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神への厳粛な応答にふさわしい簡潔で格調ある調子とした。「地に向かって身をかがめる」と「礼拝する」を分け、原文の連続する二動作を保持した。
