  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: ja
  text: あなたは、自分のために鋳物の神々[a]を造ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「溶かした金属の神々」または「鋳造された神々」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: 神々
  rationale: 複数形の連語形であり、偶像製作を禁じる文脈では、具体的な複数の「神々」とするのが自然である。
- source_word: מַסֵּכָה
  choice: 鋳造した
  rationale: 溶かした金属を型に流して造る物、特に像を指す語である。「鋳造した」は製法と金属像の含意を簡潔に伝え、「神々」を不要に「像」へ置き換えない。
- source_word: לֹא תַעֲשֶׂה
  choice: 造ってはならない
  rationale: 律法上の禁止命令として、現代日本語で明確かつ厳粛な表現とした。
- source_word: לָּךְ
  choice: 自分のために
  rationale: 前置詞と二人称単数接尾辞が示す本人のためという関係を保つ。
theological_decisions:
- issue: 禁止される対象の性質
  choice: 鋳造した神々を造ることの禁止
  alternative: 鋳像を造ることの禁止
  rationale: ヘブライ語は「神々」と鋳造物を表す語を結び付けているため、偶像という指示対象と鋳造という製法の両方を保持した。本文にない一般的な偶像禁止へ意味を拡張しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、禁止命令の厳粛さを保った。「鋳造した神々」はやや硬質だが、原文の「神々」と金属の鋳造という二つの要素を自然に保持する。
