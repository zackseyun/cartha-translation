source:
  edition: WLC
  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: ja
  text: モーセは、初めのものと同じように、石の板を二枚切り出した[a]。そして朝早く起き、ヤハウェが命じたとおりにシナイ山へ登った。彼は二枚の石の板を手に取った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「刻んだ」「削って作った」とも訳せる。
    reason: פסל は石を切り、削り、形作る動作を表しうるため。
  - marker: b
    text: 原文は単数形で「彼の手に」。ここでは両手を排除せず、慣用的に用いられている可能性がある。
    reason: ヘブライ語の単数形を示しつつ、日本語の「手」が同様に数を確定しないことを説明するため。
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: 切り出した
  rationale: פסל はここで石を削って板の形にする行為を表す。「切り出す」は現代日本語として自然で、石を加工する具体的な動作を伝える。
- source_word: לֻחֹת אֲבָנִים
  choice: 石の板
  rationale: 契約の文言が記される石製の板を指す。「石の板」は明瞭で自然であり、「石板」よりも一般読者に読みやすい。
- source_word: כָּרִאשֹׁנִים
  choice: 初めのものと同じような
  rationale: 比較を表す כ と「初めの／以前の」を意味する語に基づき、先の二枚と同様であることを明示する。形状などの完全な同一性を過度に断定しない表現でもある。
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: 朝早く起き
  rationale: 「朝早く行動を起こす」というヘブライ語の慣用表現を、簡潔で自然な日本語にした。
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: シナイ山へ登った
  rationale: עלה の上向きの移動を「登った」で明示し、אֶל は自然な日本語の方向表現「へ」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語表記で示す。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: ヤハウェが命じたとおりに
  rationale: כַּאֲשֶׁר が示す命令との一致を「とおりに」で自然かつ明確に表す。
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: その手には……持っていた
  rationale: 原文の単数形「彼の手に」を保ちつつ、日本語で不自然にならないよう状態表現にした。日本語ではこの表現が片手だけで持ったことを必ずしも意味しない。
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: 二枚の石の板
  rationale: 既出の交換用の二枚を再度明示する原文の反復を保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名として音写し、契約の神の名であることを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔で品位のある調子にした。ヘブライ語の接続詞の連続は日本語で冗長にならないよう整理したが、行為の展開と石の板の反復は保持した。
