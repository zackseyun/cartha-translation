  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「これらの言葉をあなたのために書き記しなさい。これらの言葉に従って、わたしはあなたとイスラエルと契約を結んだ[a]からである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「契約を結んだ」は、ヘブライ語では直訳すると「契約を切った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す四文字語である。現代日本語の聖書文体として自然で広く理解される「主」を採用し、固有名であることは語彙判断上保持する。
- source_word: כְּתָב לְךָ
  choice: あなたのために書き記しなさい
  rationale: 命令形 כתב の直接性と、与格 לְךָ が表すモーセ自身の関与をともに保持する。「書き記す」は記録する文脈に自然である。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: これらの言葉
  rationale: 契約および書記の文脈では דברים を「言葉」とするのが適切で、節内の反復もそのまま保持できる。
- source_word: כִּי עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: これらの言葉に基づいて……からである
  rationale: כִּי の理由提示と、עַל־פִּי の規範・根拠を表す慣用的意味を、明瞭な現代日本語で示す。
- source_word: כָּרַתִּי ... בְּרִית
  choice: 契約を結んだ
  rationale: 直訳は「契約を切った」だが、日本語で定着した自然な対応表現「契約を結ぶ」を用いる。完了した行為は日本語の過去形で十分に表せる。
- source_word: אִתְּךָ וְאֶת־יִשְׂרָאֵל
  choice: あなたおよびイスラエルと
  rationale: モーセとイスラエルの双方が契約の相手であることを明確に示しつつ、重い反復を避けた。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語本文としての明瞭さと一般的な聖書語法を優先した。ただし原文が称号ではなく神の固有名であることは認識しており、「ヤハウェ」も可能である。
- issue: 契約慣用句 כּרת ברית
  choice: 契約を結んだ
  alternative: 契約を切った
  rationale: 原語の字義的比喩を不自然な日本語で再現せず、意味を正確に伝える定着表現を選んだ。字義は脚注で示す。
- issue: 契約の根拠を表す עַל־פִּי
  choice: これらの言葉に基づいて
  alternative: これらの言葉に従って
  rationale: 契約が当該の言葉を基礎として結ばれたという関係を示す。「従って」も可能だが、服従の含意を強めるおそれがある。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。命令と理由節の論理関係を明示し、契約用語は一般読者に自然な表現とした。脚注記号は契約慣用句の直後ではなく文末に置き、文全体の可読性を保った。
