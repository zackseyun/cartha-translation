source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: ja
  text: 'そのとき、ヤハウェは彼の前を通り過ぎ、こう宣言した。


    「ヤハウェ、ヤハウェ、憐れみ深く、恵み深い神。怒るのに遅く、揺るぎない愛と誠実[a]に満ちている。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「揺るぎない愛と真実に満ちている」。
    reason: אֱמֶת はこの文脈では「誠実」「忠実」を表し得る一方、「真実」と訳すこともできるため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、一般的な日本語音写で示した。原文どおり二度の反復も保った。
- source_word: וַיַּעֲבֹר עַל־פָּנָיו
  choice: 彼の前を通り過ぎ
  rationale: 空間的な移動を表す自然な日本語とし、「顔の上を」という不自然な逐語訳を避けた。
- source_word: וַיִּקְרָא
  choice: こう宣言した
  rationale: ここでは単に呼ぶのではなく、神の名と性質を厳かに告げる行為を表すため。
- source_word: אֵל
  choice: 神
  rationale: 反復された神名に同格的に続き、その性質を述べ始める名詞として簡潔に訳した。
- source_word: רַחוּם
  choice: 憐れみ深く
  rationale: 苦しむ者に向けられる深い憐れみを、現代日本語で明瞭に表した。
- source_word: חַנּוּן
  choice: 恵みに富む
  rationale: 好意や恵みを与える性質を表し、רַחוּםとの意味の違いも保った。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 怒るのに遅く
  rationale: 直訳では「鼻が長い」となるヘブライ語慣用句を、その比喩的意味に即して訳した。
- source_word: רַב
  choice: 満ちる
  rationale: 後続する抽象名詞が豊かに備わっていることを、簡潔で自然な日本語で示した。
- source_word: חֶסֶד
  choice: 揺るぎない愛
  rationale: 愛、慈しみ、忠実さを含む語の広がりを、持続性が伝わる表現で示した。
- source_word: אֱמֶת
  choice: 誠実
  rationale: この対句では信頼できる忠実な性質を指すと理解した。ただし「真実」も有力なので脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の反復
  choice: 「ヤハウェ、ヤハウェ」と反復する
  alternative: 「主なる神」など一つの表現にまとめる
  rationale: 原文は契約の神名を二度繰り返して強調している。これを平滑化せず、そのまま保持した。
- issue: חֶסֶד וֶאֱמֶת の意味
  choice: 「揺るぎない愛と誠実」
  alternative: 「揺るぎない愛と真実」
  rationale: 神の信頼できる性質を述べる文脈から「誠実」を本文に採ったが、אֱמֶת の基本的な語義である「真実」も正当なため脚注で示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。神の自己宣言の荘重さを短い句と改行で表しつつ、古語的な言い回しは避けた。「彼」は直前の文脈におけるモーセを指す。
