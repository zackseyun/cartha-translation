source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: ja
  text: ヤハウェは雲の中に降り、そこでモーセとともに立ち、ヤハウェの名を宣言した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、（モーセが）「ヤハウェの名を呼び求めた」、あるいは「ヤハウェの名によって宣言した」。ヘブライ語では「名」に「〜によって／〜において」を表し得る前置詞が付いている。
    reason: בְשֵׁםの前置詞的な意味とקראの語義により生じる別訳、および「呼び求めた」と読む場合に伴う主語の理解を保持するため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、現代日本語で一般的な音写によって示した。
- source_word: וַיֵּרֶד
  choice: 降り
  rationale: 動詞ירדの具体的な下向きの移動を、自然で簡潔な日本語で表した。
- source_word: בֶּעָנָן
  choice: 雲の中に
  rationale: 定冠詞を伴う既知の雲を指すため「その雲」も可能だが、文脈上の神顕現の雲を自然に示す「雲の中に」とした。前置詞בの場所の意味を保持している。
- source_word: וַיִּתְיַצֵּב
  choice: 立ち
  rationale: התפעל形が表す「身を置く・立つ」を、過度に硬くせず簡潔に訳した。
- source_word: עִמּוֹ שָׁם
  choice: そこでモーセとともに
  rationale: עםは「ともに」、שםは「そこで」とした。代名詞の指示対象は直前の文脈にあるモーセなので、現代日本語で明瞭になるよう固有名を補った。
- source_word: וַיִּקְרָא
  choice: 宣言した
  rationale: 次節に続く神の自己宣言を踏まえ、קראの公に告げる意味を表した。ただし「呼んだ」という語義の可能性は脚注に残した。
- source_word: בְשֵׁם יְהוָה
  choice: ヤハウェの名を
  rationale: 日本語では「名を宣言する」が自然であり、文脈にもよく合う。ヘブライ語の前置詞בを明示する別解は脚注に示した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が神の固有名を明記しているため、称号への置換を避け、固有名として音写した。
- issue: וַיִּקְרָאの主語と意味
  choice: ヤハウェが「宣言した」
  alternative: モーセが「呼び求めた」、またはヤハウェが「呼んだ」
  rationale: 連続する動詞の主語は最も自然にはヤハウェのままであり、次節の内容も神による自己宣言を支持する。ただしבְשֵׁםを含む句の語義上の幅は脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の簡潔な動作の連なりを維持しつつ、代名詞の指示対象を「モーセ」と明示した。
