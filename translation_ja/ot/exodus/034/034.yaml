source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: ja
  text: しかし、モーセはヤハウェのもとに入り、ヤハウェと語るたびに、出るまで覆いを外していた。彼は出ると、命じられたことをイスラエルの子ら[a]に告げていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの民」または「イスラエル人」とも訳せる。ヘブライ語では「イスラエルの子ら」。
    reason: 原文の字義的表現と、その慣用的な共同体指示の両方を示すため。
lexical_decisions:
- source_word: וּבְבֹא מֹשֶׁה
  choice: しかし、モーセは……入って……たびに
  rationale: 接続詞と前置詞בְּを伴う不定詞構文が、文脈上、繰り返される状況を表すため。「たびに」で反復性を示し、「しかし」で前節との緩やかな対照を保った。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵיの「前に／御前に」という空間的・臨在的表現を保ち、固有の神名יהוהは「ヤハウェ」とした。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 語る
  rationale: 目的を表す不定詞で、אִתּוֹは「彼と」を意味する。日本語では直前の「ヤハウェの前に」と合わせて相手が明らかなため、重い代名詞を避けて「語る」としたが、対話的な含みは文脈に残る。
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: 覆いを外していた
  rationale: 未完了形はこの文脈で習慣的な過去の行為を示す。מַסְוֶהはモーセの顔を覆う物であり、「覆い」は意味を限定しすぎず自然である。
- source_word: עַד־צֵאתוֹ
  choice: 出て来るまで
  rationale: עַדと不定詞構文が、モーセが退出する時までの継続を表す。
- source_word: וְיָצָא וְדִבֶּר
  choice: そして出て来ると、……告げた
  rationale: 反復される一連の行為を自然な日本語で示した。「告げた」は、受けた命令をイスラエルに伝達するという文脈でדברの機能を明確にする。
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義的な表現を保った。これは慣用的にイスラエルの民全体を指し得るため、脚注で説明した。
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: 命じられたこと
  rationale: プアル形の受動態を保ち、命令の主体や内容を本文以上に補わない表現とした。文脈上、モーセが命じられた事柄を指す。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の契約名יהוהを用いているため、称号に置き換えず「ヤハウェ」と音写した。
- issue: בְּנֵי יִשְׂרָאֵלの性を伴う慣用表現
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の形を見える形で残しつつ、この定型句が共同体全体を指し得ることを脚注に示した。
- issue: אֲשֶׁר יְצֻוֶּהの受動表現
  choice: 命じられたこと
  alternative: ヤハウェから命じられたこと
  rationale: 命令者は文脈上ヤハウェだが、この句自体は命令者を明示しないため、本文では補足せず原文の受動表現を保った。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で品位ある叙述体とした。反復される行為は「たびに」「外していた」で表し、原文の時間関係を自然な日本語にした。
