  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: ja
  text: また、あなたがその地の民の娘たちを、あなたの息子たちの妻として迎えると、その娘たちは自分たちの神々の後を追って淫行し[a]、あなたの息子たちにも彼女たちの神々の後を追って淫行させることになる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「淫行する」は、ほかの神々の後を追うことを性的な不貞になぞらえた表現。別訳「娼婦のように振る舞う」。
    reason: lexical_alternative
  - marker: b
    text: 「淫行させる」は使役形で、その娘たちが息子たちにも自分たちの神々の後を追って淫行するよう仕向けることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ מִבְּנֹתָיו לְבָנֶיךָ
  choice: 彼の娘たちの中から、あなたの息子たちのために迎える
  rationale: לקחの基本義「取る」を踏まえつつ、息子のために娘を迎えるという婚姻の文脈を、過度に補足せず自然な日本語で表した。מןの部分を示す意味は「娘たちの中から」に保持した。
- source_word: וְזָנוּ
  choice: 淫行し
  rationale: זנהが偶像礼拝を性的な不貞になぞらえる強い比喩を保つため、「偶像礼拝をする」と平板化せず「淫行する」とした。
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: 自分たちの神々を慕って
  rationale: אַחֲרֵיの「後を追う」という追随の像を、日本語として理解できる形で示した。最初の主語との対応では再帰的な「自分たち」を用いた。
- source_word: וְהִזְנוּ אֶת בָּנֶיךָ
  choice: あなたの息子たちにも…淫行させる
  rationale: ヒフィル形の使役の意味を明示し、娘たちが息子たちを同じ背教へ導く因果関係を保持した。
- source_word: אֱלֹהֵיהֶן
  choice: 彼女たちの神々
  rationale: 三人称女性複数接尾辞を明示し、異民族の娘たちが拝む複数の神々を指すことを保持した。
theological_decisions:
- issue: 偶像礼拝の文脈における זנה の訳し方
  choice: 性的な不貞の比喩を「淫行する」として保持する。
  alternative: 「偶像礼拝をする」または「不忠実になる」とする。
  rationale: 原文は他の神々への追随を意図的に性的な不貞の語で描いている。その契約的不忠実を示す緊張を、説明的な訳で解消しないため。
- issue: 娘たちと息子たちという性別表現
  choice: 「娘たち」「息子たち」と具体的に訳す。
  alternative: 「子どもたち」などの包括的表現にする。
  rationale: 原文は婚姻関係の警告として両者を明確に区別しており、その具体性を保持するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「迎える」は婚姻の文脈を自然に示し、「淫行する」は原文の強い比喩を保持する。長い因果関係は一文のまま保ちつつ、読点で構造を明確にした。
