id: EXO.34.15
reference: Exodus 34:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: ja
  text: あなたは、その地の住民と契約を結ばないようにしなさい。そうしないと、彼らは自分たちの神々を慕って淫行を行い[a]、その神々にいけにえをささげ、彼らの一人があなたを招き、あなたはその人のいけにえを食べることになる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「淫行を行う」は、偶像礼拝を性的な不貞になぞらえたヘブライ語の比喩。別訳「自分たちの神々を慕って遊女のように振る舞う」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたは彼のいけにえから食べる」。神々にささげられたいけにえに由来する食物を食べることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 〜してはならない。さもないと
  rationale: 警告と、それに続く危険な結果を自然な現代日本語で明示する。単なる禁止だけでなく、ヘブライ語の懸念・防止の含みを保つ。
- source_word: תִּכְרֹת בְּרִית
  choice: 契約を結ぶ
  rationale: 字義的には「契約を切る」という慣用句だが、日本語では「契約を結ぶ」が自然で、契約概念も正確に伝える。
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: この地に住む者たちと
  rationale: 集合的単数を複数として自然に表し、文脈上の「その地」を日本語では「この地」とした。
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: 自分たちの神々を慕って淫行にふけり
  rationale: זנה の性的背信の比喩を明示的に保持する。「慕って」は אַחֲרֵי の追随・傾倒を表し、「淫行にふける」によって偶像礼拝を性的背信になぞらえる原文の強さを残す。
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: その神々にいけにえをささげ
  rationale: 祭儀的行為であることを、一般読者に明瞭な表現で伝える。
- source_word: וְקָרָא לְךָ
  choice: 彼らの一人があなたを招き
  rationale: 複数の先行詞に続く単数形を分配的・不定的な用法と捉え、個々の住民の一人による招待という場面を自然に示す。
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: あなたはそのいけにえを食べることになる
  rationale: מִן を「そのいけにえの一部を」の意味に理解しつつ、簡潔に訳した。警告される結果であることを「ことになる」で表す。
theological_decisions:
- issue: 偶像礼拝を性的背信として描く比喩
  choice: 「神々を慕って淫行にふける」として比喩を保持する
  alternative: 「神々に従って偶像礼拝をする」「神々を慕って背信する」
  rationale: 原文は זנה により、偶像礼拝を契約上の不貞として衝撃的に描く。この神学的・文学的緊張を弱めず、同時に文字どおりの性行為だけを指すとの誤解を脚注で補う。
- issue: 複数の住民に続く単数の招待者
  choice: 「彼らの一人があなたを招き」
  alternative: 「彼があなたを招き」「彼らがあなたを招き」
  rationale: 単数形を消さず、分配的な意味を明示することで、誰か一人からの具体的な誘いを通して祭儀に加わる危険を表す。
- issue: いけにえを食べることの含意
  choice: 祭儀との関係を過度に説明せず「そのいけにえを食べる」とする
  alternative: 「いけにえの肉を食べる」「供犠の食事に加わる」
  rationale: 原文は食べる対象を「彼のいけにえ」と述べるだけなので、祭儀参加という含意は保ちつつ、本文では解釈を付加しすぎない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「いけにえ」は一般読者にも通じる表記とし、偶像礼拝を性的背信として描く原文の強い比喩は本文に残した。長いヘブライ語の一文は、警告の論理を明確にするため二文に分けた。
