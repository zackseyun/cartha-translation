source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּ/חָרִ֥ישׁ וּ/בַ/קָּצִ֖יר תִּשְׁבֹּֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: ja
  text: 六日間は働きなさい。第七日には、働くのをやめなさい[a]。耕す時にも刈り入れる時にも、働くのをやめなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「休みなさい」。ヘブライ語の動詞は「やめる、停止する」を意味し、そこから「休む」という意味にもなる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日間
  rationale: 期間を表す簡潔な表現であり、ヘブライ語の「六日」と日本語として自然な時間幅の両方を伝える。
- source_word: תַּעֲבֹד
  choice: 働き
  rationale: 契約上の指示としての未完了形を、後続する第七日の停止との対照が明瞭になる自然な日本語で表した。「働いてよい」として許可の意味に限定しない。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 第七日には
  rationale: 接続詞の対照的な働きは助詞「は」によって自然に示されるため、不自然な「しかし」を加えず、六日間との対比を保った。
- source_word: תִּשְׁבֹּת
  choice: 働くのをやめなければならない
  rationale: שׁבת の中心義である「やめる、停止する」を保ちつつ、何をやめるのかを文脈に即して明示した。「休む」だけに狭めず、労働の停止という意味を伝える。
- source_word: בֶּחָרִישׁ
  choice: 耕作の時にも
  rationale: חרישׁ が表す耕作または耕作期を、農作業の時期という時間的意味が分かるように訳した。
- source_word: וּבַקָּצִיר
  choice: 収穫の時にも
  rationale: קציר の「収穫、収穫期」という意味を自然に表し、前句との並行を保った。
- source_word: תִּשְׁבֹּת（第二の用例）
  choice: 働くのをやめなければならない
  rationale: 原文の反復をそのまま保ち、忙しい耕作期や収穫期にも第七日の停止が必要であることを強調した。
theological_decisions:
- issue: 安息日に関係する動詞 שׁבת の訳し方
  choice: 二つの用例をともに「働くのをやめなければならない」とする
  alternative: 「休まなければならない」とする
  rationale: この節の焦点は、重要な農作業の時期であっても労働を停止することにある。「やめる」は שׁבת の中心義を保ち、「休む」が含み得る身体的休養だけに意味を限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令の重みは「なければならない」で表した。原文における同じ動詞の反復を保持し、耕作と収穫の並行も日本語でそろえた。
