source:
  edition: WLC
  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: ja
  text: あなたは、小麦の収穫の初物の七週の祭りを祝いなさい。また、年の巡りの時[a]には、取り入れの祭りを祝いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「年の終わりに」。ヘブライ語の表現は字義的には、年の巡り、または周期を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: 祭り
  rationale: 巡礼を伴う宗教的な祝祭を指す。現代日本語で明瞭かつ自然な「祭り」とした。
- source_word: שָׁבֻעֹת
  choice: 七週
  rationale: 祭りの固有名が字義どおり「週々」を意味するため、後代の名称に置き換えず「七週の祭り」とした。
- source_word: תַּעֲשֶׂה לְךָ
  choice: あなたは……祝わなければならない
  rationale: 直訳は「自分のために行う」だが、祭りを守り行う義務を表す慣用表現として、自然な義務表現で訳した。לְךָは日本語で明示すると不自然になるため、主語「あなた」に含めた。
- source_word: בִּכּוּרֵי
  choice: 初物をささげる
  rationale: 収穫の最初の産物、特に祭儀で献げる初物を指す。この文脈上の意味を明瞭にするため「ささげる」を補った。
- source_word: קְצִיר חִטִּים
  choice: 小麦の収穫
  rationale: 「小麦の刈り入れ／収穫」を意味する連語を、自然な現代日本語で表した。
- source_word: הָאָסִיף
  choice: 取り入れ
  rationale: 農産物を集め入れることを指す祭りの名称であり、「取り入れの祭り」として語義を透明に保った。
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: 年が巡る時
  rationale: 年の回転・周期を表す語句であり、単に暦年の最終日を意味するとは限らないため、「年が巡る時」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭りの名称は意味が分かる形で訳し、後代の伝統的名称「ペンテコステ」は用いなかった。英語資料では脚注記号が「七週の祭り」の後に置かれているが、脚注内容が説明するヘブライ語句に合わせ、日本語本文では「年が巡る時」の直後に置いた。
