translation:
  language: ja
  text: しかし、モーセは彼らに呼びかけた。すると、アロンと会衆のすべての指導者たちは彼のもとに戻ってきた。モーセは彼らに語った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: 彼らに呼びかけると
  rationale: קרא と אֶל の組み合わせを、相手に声をかけたことが明確な自然な日本語で表した。「呼び寄せる」では命令や召集の意味を強めすぎるため避けた。
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: 彼のもとに戻って来た
  rationale: שׁוב の「戻る」という意味を保ちつつ、モーセのもとへ近づく動きを自然な日本語で示した。
- source_word: הַנְּשִׂיאִים
  choice: 指導者たち
  rationale: נָשִׂיא はここで共同体を代表する者たちを指す。「君主」や「高官」よりも、役割を明確かつ現代的に伝える。
- source_word: בָּעֵדָה
  choice: 会衆の
  rationale: עֵדָה はイスラエルの集合的共同体を表す。文脈上、指導者たちが属し代表する集団として「会衆の」とした。
- source_word: וַיְדַבֵּר
  choice: 語った
  rationale: דבר（ピエル）の標準的な発話の意味を、尊厳を保つ簡潔な日本語で表した。
- source_word: וַ
  choice: しかし／そこで
  rationale: 冒頭の接続は前節で人々が近づくのを恐れたこととの穏やかな対照を「しかし」で示し、後半の継起は日本語として自然な「そこで」で表した。
