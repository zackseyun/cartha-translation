  text: כָּל פֶּ֥טֶר רֶ֖חֶם לִ֑/י וְ/כָֽל מִקְנְ/ךָ֙ תִּזָּכָ֔ר פֶּ֖טֶר שׁ֥וֹר וָ/שֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: ja
  text: 胎から最初に生まれるものはすべて、わたしのものである[a]。また、あなたの家畜、すなわち牛や羊・山羊の雄の初子[b]もすべて、わたしのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「胎を開くものはすべて」。最初に生まれる子を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語のこの語形は、ここでは家畜のうち雄を指定するものと理解される。「羊・山羊」とした語は、いずれも指し得る。
    reason: textual_ambiguity
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: 母胎から最初に生まれるものはすべて
  rationale: 直訳的には「胎を開くものすべて」だが、初めて生まれる子を指すヘブライ語の慣用表現である。意味を明確にしつつ、その範囲を狭めない表現とした。
- source_word: לִי
  choice: わたしのものである
  rationale: 所有または権利の主張を表す簡潔な表現。本文にない奉献や犠牲の概念までは加えない。
- source_word: מִקְנְךָ
  choice: あなたの家畜
  rationale: 群れとして所有される牛や羊などを指す包括的な語なので、現代日本語の「家畜」が自然である。
- source_word: תִּזָּכָר
  choice: 雄の初子
  rationale: この形は難解だが、ここでは家畜のうち雄を指定する表現と理解した。「覚えられる」などの機械的な訳は文脈に合わないため、法規定上の意味を明示した。
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: 牛であれ羊であれ、雄の初子
  rationale: 牛と羊を家畜の種類として示す同格的表現を、自然な日本語で表した。שֶׂה は羊または山羊を含み得るが、ここでは伝統的かつ文脈上自然な「羊」とした。
theological_decisions:
- issue: 初子に対する神の所有権の主張
  choice: 初子が神のものであるという法的・契約的主張として訳す。
  alternative: 奉献される、または犠牲としてささげられると本文で明示する。
  rationale: この節が直接述べるのは「わたしのもの」という主張であり、その実施方法や神学的意味を本文に補わない。
- issue: 前半の「母胎から最初に生まれるもの」の範囲
  choice: 原文どおり、前半では性別を明示せず、後半の家畜について雄を明示する。
  alternative: 前半にも「雄」を補って「すべての男子の初子」とする。
  rationale: 雄を表す難解な語は後半の家畜に結び付いており、前半の表現自体には性別が明記されていないため、その構造上の緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「初子」は聖書の法規定に適した簡潔な語として用い、読者の理解のため前半では「最初に生まれるもの」と言い換えた。神の発話として常体を採用した。
