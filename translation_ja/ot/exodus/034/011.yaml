  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: ja
  text: 今日、わたしがあなたに命じることを守りなさい。[a] 見よ、わたしはあなたの前から、アモリ人、カナン人、ヒッタイト人、ペリジ人、ヒビ人、エブス人を追い払う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今日、わたしがあなたに命じることに注意しなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: 守りなさい
  rationale: 命令形 שְׁמָר は「守る」「遵守する」「心に留める」の意味を持つ。לְךָ はここで命令を強め、注意深く従うことを促すが、日本語で「自分のために」を加えると不自然かつ過度に限定的になるため、簡潔に「守りなさい」とした。
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 今日、わたしがあなたに命じること
  rationale: 関係節の構造を保ち、分詞 מְצַוְּךָ の現在的な働きを自然な現代日本語で表した。
- source_word: הִנְנִי
  choice: 見よ
  rationale: 神の確実で目前に迫った行為へ注意を向ける提示表現。現代語でも聖書本文にふさわしい簡潔で荘重な語として「見よ」を用いた。
- source_word: גֹרֵשׁ
  choice: 追い払う
  rationale: גרש の基本義である「追い出す、追放する」を表す。הִנְנִי と分詞の組み合わせは目前の、また確実な行為を示し、日本語では「追い払う」が自然である。
- source_word: מִפָּנֶיךָ
  choice: あなたの前から
  rationale: 直訳的な空間表現を保ちつつ、彼らをイスラエルの進む前方から除くという文脈に合う自然な日本語とした。
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: アモリ人、カナン人、ヒッタイト人、ペリジ人、ヒビ人、エブス人
  rationale: ヘブライ語の集合的単数の民族名を、日本語で民族集団を表す慣用的な「〜人」として訳した。
theological_decisions:
- issue: 契約の文脈における שׁמר の命令の含意
  choice: 神が命じる事柄を「守る」よう命じる表現とする
  alternative: 「わたしが命じることに注意しなさい」または「注意して行いなさい」
  rationale: 語は注意深く保つことと遵守することの双方を含み得る。「守りなさい」は契約上の命令への服従を表しつつ、原文に明示されない「行いなさい」を補わず、意味の幅を保つ。
- issue: הִנְנִי＋分詞が示す行為の時制・様相
  choice: 「見よ、わたしは……追い払う」
  alternative: 「今、わたしは……追い払っている」または「追い払おうとしている」
  rationale: この構文は進行中、目前、確実な未来の行為を表し得る。日本語の非過去形によって、特定の時間的解釈に狭めず、神の確実な行為を表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の直接発話にふさわしい簡潔で荘重な調子を保った。「見よ」は提示表現の力を残すため採用し、民族名は日本語聖書で広く通用する形にした。
