  source_fidelity: 本文は、נֹצֵר（保つ）、חֶסֶד（変わらない愛）、罪の三語を赦すこと、強い否定を伴う無罪放免しないこと、そして父たちの咎を後続世代に「問う」という一連の内容を適切に伝えている。「罰を免れさせず」は、原文で目的語が明示されない点を保ちつつ、נקהの司法的文脈を自然に表せている。末尾では、子・孫と第三・第四世代が同列に続くことを明示するため、「さらに」を補う。
  naturalness: 全体として明瞭な現代標準日本語である。「変わらない愛」は「変わらぬ愛」よりわずかに平明であり、本文の登録に合う。「さらに」を加えることで、「三代、四代」が直前の「子と孫」の言い換えではなく、後続する世代の列挙であることが読み取りやすくなる。
  terminology: 「咎」「背き」「罪」は原文の重ねられた罪の語彙を過度に均質化せずに表す。「父たち」は男性形の原文を保持し、「子と孫」は世代的子孫を自然な日本語で表す。脚注は主文の曖昧さと代替可能性を適切に補足している。
