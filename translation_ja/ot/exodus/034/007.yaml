reference: Exodus 34:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: ja
  text: 幾千にわたって変わらない愛を保ち[a]、咎と背きと罪を赦す。しかし、決して罰を免れさせず[b]、父たちの咎を子と孫に、さらに三代、四代に至るまで問う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「千代にわたって」。ヘブライ語は直訳すると単に「幾千に」であり、神の長く続く愛と「三代、四代」までの裁きとを対照していると考えられる。
    reason: alternative_reading
  - marker: b
    text: または「決して潔白とはしない」「決して罰せずにはおかない」。原文は同じ語根を重ねて否定を強めている。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: 保ち
  rationale: 守る、保つという継続的な働きを表す分詞。神の変わらない姿勢を自然な現代日本語で示す。
- source_word: חֶסֶד
  choice: 変わらぬ愛
  rationale: 愛情と忠実さを併せ持つ契約的な語。一般読者にも明瞭で、単なる感情的な愛に狭めない表現とした。
- source_word: לָאֲלָפִים
  choice: 幾千にわたって
  rationale: 原文は対象を明示せず、字義的には「幾千に」。本文では「世代」や「人々」を補わず、その広がりと曖昧さを保つ。
- source_word: נֹשֵׂא
  choice: 赦す
  rationale: 字義的には「担う、運ぶ」だが、罪を表す語との結び付きでは「赦す」という慣用的意味になる。
- source_word: עָוֺן
  choice: 咎
  rationale: 悪そのものと、それに伴う責任・結果の双方を含み得る語として、道徳的・法的な重みを保つ。
- source_word: פֶשַׁע
  choice: 背き
  rationale: 規範への違反だけでなく反逆の含意を持つため、「違反」より人格的な反抗を示せる「背き」とした。
- source_word: חַטָּאָה
  choice: 罪
  rationale: 三つの罪語を重ねる表現の締めとして、直接的で標準的な訳語。
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: しかし、決して罰を免れさせず
  rationale: 同根語を重ねた強い否定を「決して」で表現した。「罰を免れさせない」は司法的な含意を自然に伝えるが、原文に明示されない「罪ある者」を本文に補わない。
- source_word: פֹּקֵד
  choice: 問う
  rationale: 顧みる、取り扱う、責任を問うなどの幅を持つ語。裁きの文脈を示しつつ、単純に「罰する」と狭く確定しない表現。
- source_word: עֲוֺן אָבוֹת
  choice: 父たちの咎
  rationale: 原文の男性複数形を保持し、同節内の עָוֺן も一貫して「咎」と訳す。
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: 子と孫に
  rationale: 字義的には「子らと子らの子」。世代的な子孫関係を簡潔で自然な日本語にする。
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: 三代、四代に至るまで
  rationale: 原文では「代」が省略されているが、直前の親族系列から明らかなため、日本語で必要な語を補った。
theological_decisions:
- issue: 神の赦しと裁きの緊張をどう表すか
  choice: 「赦す」と「決して罰を免れさせず」をともに明確に述べる。
  alternative: 「赦すが、決して潔白とはしない」と、より形式的に訳す。
  rationale: 本文が並置する憐れみと正義のどちらも弱めず、両者の関係を訳文で解消しないため。
- issue: 「幾千」の対象を世代と明示するか
  choice: 本文では「幾千にわたって」とし、対象を特定しない。
  alternative: 「千代にわたって」または「幾千の世代に」。
  rationale: この節のヘブライ語には「世代」が明記されていないため、並行箇所の表現を本文へ持ち込まない。可能な世代的理解は脚注に示す。
- issue: 先祖の咎が子孫に及ぶ表現
  choice: 因果関係を説明的に限定せず、「咎を……問う」とする。
  alternative: 「父たちの咎の罰を子孫に下す」と明示する。
  rationale: פֹּקֵד と עָוֺן は責任、処罰、結果を含み得るが、その仕組みを本文以上に限定せず、原文の厳しい世代的表現を保持する。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った宣言調。節が前節から続く分詞構文であることを踏まえつつ、日本語として読みやすい連用表現にした。「変わらぬ愛」「咎」「背き」は神学的な重みを保ちながら、過度に古風な語調を避ける選択である。
