  naturalness: 「あなたの目に恵みを得ている」は直訳調で不自然ではないものの、明瞭な現代日本語としては「あなたの目にかなっている」のほうが自然である。「うなじのこわい」は現代では「恐ろしいうなじ」のようにも読めるため、本文には平明な語を用いるのが適切である。
  terminology: 「主」「民」「咎と罪」は適切である。「相続財産」は原文の重要な嗣業語彙を反映するため維持できる。反復される「うなじのこわい」という出エジプト記の比喩は、本文では「かたくな」とし、脚注で直訳を示して保持する。
