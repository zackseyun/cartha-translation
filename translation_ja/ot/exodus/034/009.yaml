language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: ja
  text: 彼は言った。「主よ、もし私があなたの目にかなっているなら、どうか主が私たちのただ中を進んでくださいますように[a]。この民はかたくなな民ですが、私たちの咎と罪を赦し、私たちをあなたの相続財産としてください[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「主が私たちのただ中を進まれますように」。文脈上、「私たちの間にいてください」「私たちと共に進んでください」とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「私たちをご自分のものとしてください」とも訳せる。ヘブライ語の動詞には、相続分または所有として取るという意味がある。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: 恵み
  rationale: 「目に恵みを得る」というヘブライ語の定型表現を保ち、相手からの好意・受容を表す。日本語では文脈上、後代の教理的意味に限定されない自然な語である。
- source_word: בְּעֵינֶיךָ
  choice: あなたの目に
  rationale: 原文の身体的比喩を保った定型的な表現。「あなたから見て」より形式対応が明確で、意味も理解できる。
- source_word: אֲדֹנָי
  choice: 主
  rationale: ここでは神名 יהוה ではなく、呼びかけと敬称としての「主」。二度目も同じ相手を指すため、一貫して「主」とした。
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: どうか主が私たちのただ中を進んでくださいますように
  rationale: הלך の移動・同行の意味と、בקרב の「ただ中」という空間的イメージをともに保つ。
- source_word: קְשֵׁה עֹרֶף
  choice: うなじのこわい
  rationale: 頑固さを表すヘブライ語の身体的比喩を保持する。単に「頑固な」とすると出エジプト記で反復される比喩が失われる。
- source_word: עַם
  choice: 民
  rationale: 国家というより、契約共同体としてのイスラエルを指す文脈に適する。
- source_word: עָוֹן
  choice: 咎
  rationale: 道徳的な過ちとその責任の重みを表し、後続の חַטָּאת「罪」と一定の区別を保つ。
- source_word: חַטָּאת
  choice: 罪
  rationale: 一般的で直接的な対応語であり、「咎」と並ぶ原文の表現を簡潔に再現する。
- source_word: וּנְחַלְתָּנוּ
  choice: 私たちをあなたの相続財産として受け入れてください
  rationale: נחל が表す、相続分・所有として取るという契約的な所属の意味を保つ。「相続財産」はやや非日常的だが原文の比喩を明示し、「受け入れる」で日本語として整えた。
theological_decisions:
- issue: 祈りの中の אֲדֹנָי の訳し方
  choice: 主
  alternative: わが主／主なる神
  rationale: 原文は神名そのものではなく主権を示す敬称を用いる。「主なる神」と補わず、呼びかけと三人称的用法の双方を「主」で統一した。
- issue: כִּי עַם קְשֵׁה עֹרֶף הוּא の論理関係
  choice: この民はうなじのこわい民ですが
  alternative: この民はうなじのこわい民だからです
  rationale: כִּי は理由を示し得るが、この祈りの文脈では「そのような民であるにもかかわらず」という譲歩的な関係として自然に理解できる。「ですが」とすることで、神の同行と赦しを求める緊張を保った。
- issue: וּנְחַלְתָּנוּ の契約的意味
  choice: 私たちをあなたの相続財産として受け入れてください
  alternative: 私たちをご自分のものとしてください
  rationale: イスラエルが神に属する民として取られることを表す一方、単なる所有へと言い換えず、原文の相続・嗣業の比喩を残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祈りにふさわしい丁寧で格調ある文体とした。「うなじのこわい」「相続財産」は原文の重要な比喩を残すため採用し、理解を助けるため脚注を付した。
