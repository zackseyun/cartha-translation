revisions:
- from: 彼は言った。「主よ、もし私があなたの目に恵みを得ているのでしたら、どうか主が私たちのただ中を進んでくださいますように[a]。この民はうなじのこわい民ですが、私たちの咎と罪を赦し、私たちをあなたの相続財産として受け入れてください[b]。」
  to: 彼は言った。「主よ、もし私があなたの目にかなっているなら、どうか主が私たちのただ中を進んでくださいますように[a]。この民はかたくなな民ですが、私たちの咎と罪を赦し、私たちをあなたの相続財産としてください[b]。」
  rationale: 原文の祈願文、主への呼びかけ、民の強情さにもかかわらず同行・赦し・所属を願う流れを維持した。「あなたの目にかなっている」により「目に見いだす好意」の慣用句を自然な日本語で表現した。「かたくなな民」は「うなじのこわい」の比喩的意味を明瞭にし、その直訳的な空間・比喩表現の一部は脚注で補う必要があるが、ここでは既存脚注の対象が同行句であり、本文の明瞭さを優先した。「相続財産としてください」は、原文の所有・嗣業の含意を保ちながら「受け入れる」の付加的含意を除く。
