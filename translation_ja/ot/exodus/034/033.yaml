base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: ja
  text: モーセは彼らと話し終えると[a]、顔に覆いを掛けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らと話すのをやめると」。
    reason: כלהは行為を「終える」ことのほか、「やめる」こととしても表現できるため。
lexical_decisions:
- source_word: וַיְכַל מִדַּבֵּר
  choice: 話し終えると
  rationale: כלהにמを伴う不定詞が続き、話す行為の完了を表す。現代日本語では「話し終えると」が自然であり、後続の行為との時間的関係も明確になる。
- source_word: אִתָּם
  choice: 彼らと
  rationale: 前置詞אתはここでは共同・相互的な「～と」を素直に表す。文脈上は彼らに語りかけているが、原文の表現を保つため「彼らと」とした。
- source_word: וַיִּתֵּן עַל־פָּנָיו
  choice: 顔に……掛けた
  rationale: נתן＋עלは置くことを表し、対象が顔の覆いなので、日本語として自然な「顔に……掛けた」とした。
- source_word: מַסְוֶה
  choice: 覆い
  rationale: この語は文脈上、輝く顔を覆う物を指す。「覆い」は機能を明確にしつつ、材質や形状を原文以上に限定しない。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。「顔の覆い」ではなく「覆いを掛けた」として自然な動作表現にした。
