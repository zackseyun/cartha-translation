id: EXO.34.14
reference: Exodus 34:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: ja
  text: あなたがほかの神にひれ伏してはならないのは[a]、ヤハウェ――その名は「ねたむ者」――が、ねたむ神だからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ひれ伏す」は、身をかがめる動作を表し、ここでは礼拝することを意味する。別訳「ほかの神を礼拝してはならない」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは、「ヤハウェ――その名は『ねたむ者』――は、ねたむ神である」。「ねたむ」はここでは、罪深い羨望ではなく、ご自分の民の礼拝をほかの神に渡さないという、ヤハウェの契約上の排他的な要求を表す。
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: ひれ伏してはならない
  rationale: שׁחה の具体的な動作である身をかがめること、ひれ伏すことを保ちつつ、文脈上の礼拝行為も自然に伝える。単に「礼拝してはならない」とすると動作の像が失われる。
- source_word: לְאֵל אַחֵר
  choice: ほかの神に
  rationale: אֵל は「神」、אַחֵר は「ほかの／別の」。ここでは「異国の神」と限定せず、直接的に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号「主」に置き換えず、固有名として音写した。
- source_word: קַנָּא
  choice: ねたむ者／ねたむ
  rationale: 神名としての用法と属性としての用法を同じ語根の表現で対応させ、ヤハウェがご自分の民の礼拝を排他的に要求するという修辞的反復を保った。
- source_word: שְׁמוֹ
  choice: その名を「ねたむ者」という
  rationale: 直訳的な「その名は『ねたむ者』」の意味を、現代日本語として自然な命名表現で示した。
- source_word: אֵל קַנָּא הוּא
  choice: ねたむ神だからである
  rationale: ヘブライ語の名詞述語を明瞭な日本語にし、直前の神名を説明する構造を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく神名四文字を用いるため、固有名を保持した。
- issue: קַנָּא を神名および属性としてどう表すか
  choice: 「ねたむ者」／ねたむ
  alternative: 熱情の神／熱心な
  rationale: 原文の同語反復と、競合する礼拝を許さない契約上の排他的要求を保つ。「熱心」は意味を穏当化しすぎるため採らなかった。ただし、日本語の「ねたむ」が罪深い羨望と誤解されうるため脚注で説明した。
- issue: 冒頭の כִּי の機能
  choice: 前文への理由説明を示す「だからである」を文末に置く
  alternative: 「なぜなら」で始める
  rationale: 単独節としても自然な日本語にしながら、原文が理由を提示する従属的な性格を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ひれ伏す」で原文の具体性を保ち、「ねたむ者／ねたむ」の反復でヘブライ語の修辞を再現した。読点と引用符により、神名に関する挿入的な説明を読みやすくした。
