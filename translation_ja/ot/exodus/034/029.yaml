id: EXO.34.29
reference: Exodus 34:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: ja
  text: モーセがシナイ山から下りたとき、モーセの手には二枚の証しの板があった。山から下りて来たモーセは、主[a]と語ったために[c]自分の顔の肌が光を放っていた[b]ことを知らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「彼と」。文脈上、「彼」は主を指す。
    reason: 原文の代名詞と、その文脈上の指示対象を示すため。
  - marker: b
    text: 別訳「輝いていた」。ヘブライ語の動詞は「光線を放つ」という意味を表しうる。歴史的には「角が生えている」とも訳された。
    reason: קָרַן の語義の幅と歴史的な別訳を示すため。
  - marker: c
    text: 「主と語ったときに」とも訳せる。
    reason: בְּ＋不定詞が因果的にも時間的にも理解できるという原文の曖昧さを保持するため。
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立した「そして、こうなった」とせず、時の従属節として表現）
  rationale: ここでは後続する時間表現と主節を結ぶ物語上の導入であり、現代日本語では「モーセが…下りたとき」と統合するのが自然である。
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: 下りたとき…下りて来た
  rationale: 二度の ירד を保持しつつ、日本語として自然な時間表現にした。
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: 二枚のあかしの板
  rationale: לֻחֹת を板、עֵדוּת を契約にかかわる「あかし」と訳し、解釈を加えすぎない表現とした。
- source_word: בְּיַד מֹשֶׁה
  choice: その手には…あった
  rationale: 原文の単数「手」を保持し、所持を表す自然な日本語にした。
- source_word: לֹא יָדַע
  choice: 知らなかった
  rationale: ידע の単純な否定を直接的に訳した。
- source_word: קָרַן
  choice: 光を放っている
  rationale: 文脈上、角が生えたことではなく光線・輝きを発することを指す。「輝いている」よりも放射の語感を保つ。
- source_word: עוֹר פָּנָיו
  choice: 自分の顔の肌
  rationale: 単なる「顔」ではなく、原文が明記する עוֹר（肌、皮膚）を保持した。
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: 主と語ったために
  rationale: בְּ＋不定詞の因果的理解を本文に採用した。ただし時間的にも理解できるため、脚注で別訳を示した。
- source_word: אִתּוֹ
  choice: 主
  rationale: 日本語の「彼と」では指示が不自然かつ曖昧になりやすいため、文脈上の指示対象である主を明示し、脚注で原文が代名詞であることを示した。
theological_decisions:
- issue: קָרַן が表すモーセの顔の状態
  choice: 光を放っている
  alternative: 輝いている／角が生えている
  rationale: 語根は「角」と関連しうるが、この動詞はここで光線を発することを表し、後続文脈も可視的な輝きを示す。「角が生えている」は歴史的訳として知られるものの、文脈に適合しにくい。
- issue: אִתּוֹ の指示対象
  choice: 本文で「主」と明示
  alternative: 「彼」と代名詞のまま訳す
  rationale: 原文は代名詞だが、出エジプト記34章の直前の文脈では主を指す。日本語では「彼」が別人を指すように響くため、意味を明瞭にしつつ原文形を脚注で開示した。
- issue: בְּדַבְּרוֹ の関係
  choice: 因果的に「語ったために」
  alternative: 時間的に「語ったとき」
  rationale: 輝きが主との対話に由来するという文脈的関係を自然に示すが、前置詞 בְּ の時間的解釈も可能なので脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あかし」は聖書的な契約文書の意味を保つため平仮名表記とし、「顔の肌」は原文の具体性を残した。ヘブライ語の反復も日本語として過度に重くならない範囲で保持した。
