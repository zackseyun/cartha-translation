reference: Exodus 34:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: ja
  text: あなたの土地から取れた初物のうち、最初のものを、あなたの神ヤハウェの家に携えて来なければならない[a]。子やぎをその母親の乳で煮てはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「初物のうち、最上のもの」とも訳せる。
    reason: רֵאשִׁיתは「最初」を基本義とするが、この供え物の文脈では「最良・選り抜き」の含みを持つ可能性があるため。
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: 初物のうち、最初のもの
  rationale: רֵאשִׁיתの基本的な時間的・順位的意味を保ちつつ、בִּכּוּרֵיとの重なりもあえて残した。文脈上「最上のもの」という含みもあり得るため脚注に示した。
- source_word: אַדְמָתְךָ
  choice: あなたの土地から取れた
  rationale: אֲדָמָהは作物を生じさせる耕地・土を指す。日本語では「土地の初物」より「土地から取れた初物」のほうが自然で、農産物という意味も明瞭になる。
- source_word: תָּבִיא
  choice: 携えて来なければならない
  rationale: 法文におけるヒフィル未完了形の命令的用法を、現代日本語の明確で厳粛な義務表現で示した。
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: あなたの神ヤハウェの家
  rationale: בֵּיתを「家」と訳し、後代の建造物を想起させやすい「神殿」を避けた。語順も原文の所有関係を自然な日本語で保っている。
- source_word: לֹא תְבַשֵּׁל
  choice: 煮てはならない
  rationale: בשלの具体的な調理行為を示す「煮る」を採り、禁止命令を法文調の「てはならない」で表した。
- source_word: גְּדִי
  choice: 子やぎ
  rationale: 若いやぎを指す語を、現代の一般読者に直ちに分かる表現で訳した。
- source_word: בַּחֲלֵב אִמּוֹ
  choice: その母親の乳で
  rationale: 前置詞בְּの手段・状況を「で」で表し、母子関係と原文の具体的な像をそのまま保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の契約名を音写し、称号への置き換えを避けた。
- issue: בֵּיתを指す施設
  choice: 家
  alternative: 神殿／聖所
  rationale: 出エジプト記の文脈で後代の恒久的神殿に限定せず、原語の比喩と歴史的な開放性を保った。
- issue: רֵאשִׁיתの意味合い
  choice: 最初のもの
  alternative: 最上のもの
  rationale: 第一義的な「初め・最初」を本文に置き、最初ゆえに最良・選り抜きという含意を持つ可能性は脚注で保持した。
translation_notes:
  register: 現代標準日本語による簡潔で厳粛な法文調。「携えて来なければならない」「煮てはならない」により二つの規定を並行させた。「ヤハウェの家」は原文に近い表現を保ちつつ、一般読者にも理解可能な語彙とした。
