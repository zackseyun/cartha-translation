  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: ja
  text: むしろ[a]、彼らの祭壇を打ち壊し、彼らの石柱を砕き、彼らのアシェラ[b]を切り倒さなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜなら、彼らの祭壇を……」。ヘブライ語の接続詞は「なぜなら」とも訳せるが、ここでは前節の禁止を受け、それとは反対に行うべきことを示すと理解した。
    reason: lexical_alternative
  - marker: b
    text: 「アシェラ」は、女神アシェラに関連する祭儀用の物体を指す。正確な形状は明らかでなく、「アシェラ柱」または「アシェリム」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: むしろ
  rationale: 前節の「契約を結ばないようにせよ」という禁止を受け、それとは反対に取るべき行動を示す文脈上の対比として訳した。ただし、理由を示す「なぜなら」も可能なので脚注に残した。
- source_word: מִזְבְּחֹתָם
  choice: 彼らの祭壇
  rationale: 祭儀的文脈における מִזְבֵּחַ の標準的な意味を採り、三人称男性複数接尾辞も「彼らの」として保持した。
- source_word: תִּתֹּצוּן
  choice: 打ち壊し
  rationale: 建造物などを取り壊す נתץ の意味を、祭壇に自然な現代日本語で表した。
- source_word: מַצֵּבֹתָם
  choice: 石の柱
  rationale: מַצֵּבָה は立てられた石、特に祭儀用の石柱を指す。素材と形を明確にしつつ、「聖柱」ほど解釈的にならない表現とした。
- source_word: תְּשַׁבֵּרוּן
  choice: 砕き
  rationale: ピエル形が示す強い破壊行為を簡潔に表した。
- source_word: אֲשֵׁרָיו
  choice: アシェラ像
  rationale: アシェラに結び付く祭儀用の物体を指すと理解した。「像」は日本語で祭儀物を自然に示すが、形状を厳密には特定できないため、脚注で別訳を提示した。
- source_word: תִּכְרֹתוּן
  choice: 切り倒さなければならない
  rationale: כרת の切断を表す意味と、木製と考えられるアシェラ祭儀物に対する動作を自然に表現した。三つの未完了形が命じる義務も文末で示した。
theological_decisions:
- issue: אֲשֵׁרָיו の指示対象
  choice: アシェラに関連する祭儀物として「アシェラ像」
  alternative: 「アシェラ柱」「アシェリム」またはアシェラ神に関連する像・祭具
  rationale: 祭壇、石柱と並ぶ破壊対象であり、「切り倒す」という動詞から、女神自身ではなく、おそらく木製の祭儀物を指す。ただし、その正確な形状は本文だけでは確定できないため脚注で曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜せよ」の連続よりも自然な義務表現「〜なければならない」を用い、三つの命令を一文にまとめた。
