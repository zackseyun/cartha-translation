  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: ja
  text: アロン、そしてイスラエルの子らは皆、モーセを見ると、彼の顔の皮膚が光を放っていた[a]。彼らは恐れて、モーセに近づくのを恐れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「輝いていた」または「光線を発していた」とも訳せる。このヘブライ語動詞はまれで、歴史的には「角が生えていた」とも訳されたが、文脈は光を放つことを示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見ると
  rationale: 物語を進める「見た」を、後続する発見と自然につながる現代日本語の条件表現で訳した。
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らが皆
  rationale: בְּנֵי יִשְׂרָאֵל の家族的・民族的呼称を保ちつつ、כָל を自然に「皆」と表した。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 目の前の意外な光景へ注意を向ける語用論的な働きを、明瞭な現代日本語で示した。
- source_word: קָרַן
  choice: 光を放っていた
  rationale: まれな動詞だが、この文脈では顔の皮膚が光線または輝きを発する意味と判断した。語根と「角」との関連に基づく歴史的異訳は脚注に残した。
- source_word: עוֹר פָּנָיו
  choice: 彼の顔の皮膚
  rationale: 単に「顔」とせず、原文に明記された עוֹר（皮膚）を具体的に保持した。
- source_word: וַיִּירְאוּ
  choice: 彼らは恐れて
  rationale: 接近をためらわせた恐れを、自然な日本語で表した。
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: モーセに近づくことができなかった
  rationale: מן と不定詞の組み合わせが表す、恐れのため接近を差し控えた結果を日本語として明確にした。代名詞の指示対象はモーセであるため固有名を補った。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の家族的な民族呼称を保持した。「イスラエル人」はより平易だが、原文の比喩的・系譜的表現を平板化する。
- issue: モーセの顔についての קָרַן の解釈
  choice: 光を放っていた
  alternative: 輝いていた／光線を発していた／角が生えていた
  rationale: 直後の人々の恐れと同章の文脈は可視的な輝きを示す。「角が生えていた」は歴史的に重要な異訳だが、ここでは文脈上採用せず、語の稀少性とともに脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「なんと」で וְהִנֵּה の驚きと注意喚起を示し、「顔の皮膚」という原文の具体性を保持した。
