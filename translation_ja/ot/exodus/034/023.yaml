  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: ja
  text: 年に三度、あなたがたの男子は皆、主ヤハウェ[a]、イスラエルの神の御前[b]に出なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、称号「主」（ハ・アドン）に神の名ヤハウェ（YHWH）が続く。伝統的な日本語訳では「主なる神」などと訳されることがある。
    reason: alternative_reading
  - marker: b
    text: 直訳は「顔の前に」。ここでは「前に」「臨在のもとに」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 年に三度
  rationale: 一年の周期の中で三回という頻度を、簡潔で自然な現代日本語で表した。
- source_word: יֵרָאֶה
  choice: 出なければならない
  rationale: ニファル形は祭儀的文脈で神の前に出ることを表す定型表現である。規定としての義務を日本語で明確にし、受け身の「見られる」という誤解を避けた。
- source_word: כָּל זְכוּרְךָ
  choice: あなたがたのうち、男子は皆
  rationale: זָכוּר が明示する男性を保持しつつ、イスラエル共同体への呼びかけとして自然な日本語にした。性別を中立化していない。
- source_word: אֶת פְּנֵי
  choice: 御前に
  rationale: 直訳は「顔の前に」だが、人物の臨在の前に出るというヘブライ語慣用句であるため、自然で荘重な「御前に」とした。
- source_word: הָאָדֹן
  choice: 主
  rationale: 定冠詞を伴う אָדוֹן はここで神への称号として用いられている。後続する固有名ヤハウェと区別できる「主」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写して示した。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: イスラエルの神
  rationale: 連語の関係を明瞭かつ標準的な日本語で表した。
theological_decisions:
- issue: 称号 הָאָדֹן と神名 יְהוָה が連続する表現
  choice: 主ヤハウェ
  alternative: 主なる神／神である主
  rationale: 原文が称号「主」と神名YHWHの二つを明確に用いていることを保ち、両者を一つの称号に融合させなかった。
- issue: 祭りへの参加義務を負う者の性別表現
  choice: 男子は皆
  alternative: すべての人／男は皆
  rationale: 原文の זָכוּר は男性を明示するため、その限定を保持した。「男子」は年齢を成人男性だけに狭めず、家に属する男性成員を表し得る。
- issue: יֵרָאֶה の態と規定としての効力
  choice: 御前に出なければならない
  alternative: 御前に現れる／御前で見られる
  rationale: 形態上の受け身らしさを不自然に再現せず、巡礼祭に神の前へ出るという定型的意味と法規的文脈を表した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「御前」で神の臨在にふさわしい品位を保った。「あなたがたのうち」は単数接尾辞を共同体への集合的呼びかけとして自然に表す。
