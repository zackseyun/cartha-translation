- from: 朝までに準備を整えなさい。そして朝、シナイ山に登り[a]、山の頂で、そこにわたしの前に立ちなさい[b]。
  to: 朝までに準備を整えなさい。そして朝、シナイ山に登り[a]、そこで、その山の頂に、わたしの前に立ちなさい[b]。
  rationale: 本文の意味は維持したまま、場所表現の日本語としての重なりを解消した。脚注bは、נִצַּבְתָּ לִי の文脈に即した「わたしのもとに立つ」という代替表現に改め、指示語と山頂という場所の情報も保持した。
