  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: ja
  text: 朝までに準備を整えなさい。そして朝、シナイ山に登り[a]、そこで、その山の頂に、わたしの前に立ちなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シナイ山へ上って来て」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「そこで、その山の頂で、わたしのもとに立ちなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: 準備を整えなさい
  rationale: היה と נָכוֹן の組み合わせは、この文脈では存在や成立ではなく、命令として「準備ができた状態でいなさい」を意味する。現代日本語として自然な命令表現にした。
- source_word: לַבֹּקֶר
  choice: 朝までに
  rationale: 来たる朝を準備の期限として示す ל の働きを表し、後続の בַבֹּקֶר「朝」と区別した。
- source_word: וְעָלִיתָ
  choice: 登り
  rationale: עלה の基本的な上昇の意味を明確に表す。「上って来る／上って行く」という視点の違いを日本語本文で不必要に固定しない表現を選んだ。
- source_word: בַבֹּקֶר
  choice: 朝
  rationale: 登山を行う時を示す時間表現。先の「朝までに」との順序を保った。
- source_word: אֶל הַר סִינַי
  choice: シナイ山に
  rationale: 固有地名を一般的な日本語表記で示し、方向を自然な助詞「に」で表した。
- source_word: וְנִצַּבְתָּ
  choice: 立ちなさい
  rationale: נצב のニファル形が表す「立つ、立って自らを示す」を簡潔に訳した。神への正式な出頭という文脈は「わたしの前に」によって伝わる。
- source_word: לִי
  choice: わたしの前に
  rationale: 字義的には「わたしに／わたしのために」だが、נצב と結びついて神の前に立つことを指すため、日本語では「わたしの前に」が自然である。
- source_word: שָׁם
  choice: そこに
  rationale: 指定された山頂を指す場所の副詞として明示した。
- source_word: עַל רֹאשׁ הָהָר
  choice: 山の頂で
  rationale: רֹאשׁ の地形上の意味「頂」を保ちつつ、立つ場所を示す自然な日本語にした。
theological_decisions:
- issue: עלה における話者を基準とした方向性
  choice: 登り
  alternative: 上って来て／上って行き
  rationale: ヘブライ語の動詞は上昇を表すが、日本語で「来る」か「行く」かを明示すると視点を限定する。神が山上から語っているという理解と両立しつつ、原文の語彙的な幅を保つため、中立的な「登る」を用いた。
- issue: נצב לִי が表す神の前への出頭
  choice: わたしの前に立ちなさい
  alternative: わたしのために、そこに立ちなさい
  rationale: לִי の字義を機械的に「わたしのために」とすると目的が曖昧になる。神の前に立って自らを示すという関係を自然に表しつつ、脚注で形式的に近い別訳を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、神の命令としての威厳を保った。「朝までに」と「朝」を訳し分け、準備と登山の時間的な順序を明確にした。
