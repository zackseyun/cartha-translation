id: EXO.34.18
reference: Exodus 34:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: ja
  text: あなたは種なしパンの祭り[a]を守りなさい。わたしが命じたとおり、アビブの月[b]の定められた時に、七日間、種なしパンを食べなさい。あなたがエジプトから出たのは、アビブの月だったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「除酵祭」とも訳される。ヘブライ語の חַג は、特に定められた聖なる祭りを指し、巡礼を伴う祭りを表すこともある。
    reason: lexical_alternative
  - marker: b
    text: 「アビブ」は、エジプト脱出と結び付けられた春先の月の呼び名。
    reason: cultural_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: 種なしパンの祭り
  rationale: חַגの聖なる祭りという意味と、מַצּוֹתの「種を入れないパン」という意味を、一般の読者に分かる自然な日本語で表す。定着した「除酵祭」より意味が直ちに伝わる表現を本文に採用した。
- source_word: תִּשְׁמֹר
  choice: 守りなさい
  rationale: 祭りや契約上の規定を忠実に守り行うというשׁמרの意味を保ち、文脈上の命令として明確に訳した。
- source_word: תֹּאכַל מַצּוֹת
  choice: 種なしパンを食べなさい
  rationale: מַצּוֹתは形態上複数だが、日本語では集合的に「パン」とするのが自然である。命令の力も明示した。
- source_word: לְמוֹעֵד
  choice: 定められた時に
  rationale: מוֹעֵדが示す、神によって定められた時期・時点という意味を、祭儀的な含みを失わず明瞭に表した。
- source_word: חֹדֶשׁ הָאָבִיב
  choice: アビブの月
  rationale: אָבִיבをこの暦月の伝統的な呼称として音写し、季節的背景は脚注で補った。
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: あなたがエジプトから出た
  rationale: יצאの基本的な移動の意味を、日本語では方向視点を過度に限定しない「出た」で表した。前置詞מִןの起点は「から」で明示した。
theological_decisions:
- issue: 契約上の祭りの名称
  choice: 本文では「種なしパンの祭り」とし、正式な聖なる祭りとして表現する
  alternative: 「除酵祭」または「種なしパンの巡礼祭」
  rationale: 神が定めた祭りとしての重みを保ちながら、後代の制度的・教派的理解を持ち込まず、現代の一般読者にも内容が伝わる訳語を選んだ。
- issue: 二人称男性単数によるイスラエルへの呼びかけ
  choice: 「あなた」を用いて単数形を保つ
  alternative: 「あなたがた」または「イスラエル」
  rationale: 原文はイスラエルを集合的に単数で呼びかけている。対象を説明的に置き換えず、原文の語りかけの形を保った。
- issue: 出エジプトを命令の根拠とするכִּי
  choice: 「…からである」と訳し、理由を明示する
  alternative: 「実に」など、理由以外の接続として訳す
  rationale: ここではアビブの月に祭りを守る根拠として、同じ月にエジプトを出たことが述べられているため、理由を表す接続が最も自然である。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の命令としての格調を保つため「守りなさい」「食べなさい」とした。「あなた」は初めと理由節に明示し、中間では日本語として不自然な反復を避けた。
