id: EXO.34.25
reference: Exodus 34:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: ja
  text: パン種のあるものと一緒に[a]、わたしのいけにえの血を流してはならない。また、過越祭のいけにえ[b]を朝まで残してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「パン種のあるところで」。原文は、パン種の存在下で、またはパン種を含むものとともに、という意味に取れる。
    reason: lexical_alternative
  - marker: b
    text: 原文は簡潔で、「過越の祭りのいけにえ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט ... דַּם
  choice: 血を流して
  rationale: 直訳的な「血を屠る」は現代日本語では不自然なため、犠牲獣を屠って血を流すことを表すヘブライ語の祭儀的表現を、血を明示した自然な日本語にした。
- source_word: עַל חָמֵץ
  choice: パン種のあるものと一緒に
  rationale: עַל の厳密な祭儀上の関係は簡潔な原文だけでは限定しにくい。「一緒に」は、パン種の存在下で、またはパン種を含むものとともに、という意味を過度に特定せず表す。
- source_word: זִבְחִי
  choice: わたしのいけにえ
  rationale: 一人称単数接尾辞を「わたしの」と明示し、זֶבַח の祭儀的意味を一般に理解しやすい「いけにえ」で表した。
- source_word: יָלִין לַבֹּקֶר
  choice: 朝まで残してはならない
  rationale: 一晩を越えて朝まで残存させることの禁止を、冗長にならない自然な日本語で表した。
- source_word: זֶבַח חַג הַפָּסַח
  choice: 過越祭のいけにえ
  rationale: 三語の緊密な名詞連鎖を、日本語で自然かつ簡潔に表した。「祭」と「いけにえ」の双方を保持している。
- source_word: הַפָּסַח
  choice: 過越祭
  rationale: 日本語聖書で定着し、文脈上のイスラエルの祭りを明確に示す訳語を用いた。
theological_decisions:
- issue: 契約祭儀の用語を後代の教理的意味で限定しないこと
  choice: 過越祭
  alternative: ペサハ
  rationale: モーセ契約下の祭儀という直接の文脈を保ちつつ、後代の神学的解釈を本文に加えない、一般読者に明瞭な訳語を選んだ。
- issue: パン種と犠牲との関係の曖昧さ
  choice: パン種のあるものと一緒に
  alternative: パン種のあるところで
  rationale: 原文の前置詞 עַל は、パン種を含むものとの併置またはパン種の存在下を示し得るため、特定の儀礼手順に狭く固定せず、脚注で別訳を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜してはならない」で契約法規の禁止を端的に表現した。原文の「血」を保持しつつ、日本語で不自然な「血を屠る」は避けた。
