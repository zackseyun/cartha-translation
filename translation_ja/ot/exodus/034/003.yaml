  source_fidelity: 原文の三つの禁止を正確に反映している。「あなたと一緒に登る」はיַעֲלֶה עִמָּךְの上行と同行を保ち、「山のどこにも、だれ一人姿を現してはならない」はאַל יֵרָאのニファル形（見られる／現れる）と山全域の範囲を自然に表す。家畜についても、羊・牛があの山の前方で草を食べることを禁じる原文の内容を保っている。
