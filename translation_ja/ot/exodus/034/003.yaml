  text: וְ/אִישׁ֙ לֹֽא יַעֲלֶ֣ה עִמָּ֔/ךְ וְ/גַם אִ֥ישׁ אַל יֵרָ֖א בְּ/כָל הָ/הָ֑ר גַּם הַ/צֹּ֤אן וְ/הַ/בָּקָר֙ אַל יִרְע֔וּ אֶל מ֖וּל הָ/הָ֥ר הַ/הֽוּא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: ja
  text: だれもあなたと一緒に登ってはならない。また、山のどこにも、だれ一人姿を現してはならない。羊や牛も、あの山の前で草を食べてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: だれも／だれ一人
  rationale: 文法上は男性単数だが、この禁止では人を一般的に指す。現代日本語でその包括的な意味を自然に表した。
- source_word: יַעֲלֶה עִמָּךְ
  choice: あなたと一緒に登ってはならない
  rationale: עלהの上方への移動を「登る」で保ち、עִמָּךְを「あなたと一緒に」と明示した。
- source_word: וְגַם
  choice: また
  rationale: 前の禁止にさらに禁止を加える継続・強調の働きを、自然な日本語の「また」で示した。
- source_word: אַל יֵרָא
  choice: 姿を現してはならない
  rationale: ראהのニファル形が持つ「見られる／現れる」という幅のうち、主体への禁止として自然な「姿を現す」を採った。単に「見るな」とはしなかった。
- source_word: בְּכָל הָהָר
  choice: 山のどこにも
  rationale: 山全域を対象とする分配的な意味を、明瞭な現代日本語で表した。
- source_word: הַצֹּאן וְהַבָּקָר
  choice: 羊や牛
  rationale: 小家畜と大型家畜の代表的な組み合わせを、一般読者に分かりやすい具体的な語で訳した。接続詞は日本語として自然な「や」とした。
- source_word: אַל יִרְעוּ
  choice: 草を食べてはならない
  rationale: 家畜を主語とするרעהの「放牧される／草を食べる」という意味を、平明な表現で示した。
- source_word: אֶל מוּל
  choice: 前で
  rationale: 対象に向かい合う位置・正面の空間関係を、簡潔な日本語で表した。
- source_word: הָהָר הַהוּא
  choice: あの山
  rationale: 指示語הַהוּאの特定性と話者からの距離感を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三つの禁止を並行的な「〜てはならない」で統一した。原文のאִישׁは包括的な文脈のため「人」や「男」に限定せず「だれも／だれ一人」とした。אַל יֵרָאの受動・再帰的な含みは「姿を現す」で保持した。
