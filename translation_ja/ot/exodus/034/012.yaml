  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: ja
  text: あなたが入って行く地の住民と契約を結ばないよう、十分に気をつけなさい[a]。その住民があなたの間で罠とならないように[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分自身によく注意しなさい」。
    reason: הִשָּׁמֶר לְךָ の再帰的な警告表現を示すため。
  - marker: b
    text: 「落とし穴」とも訳せる。最後の動詞は男性単数形で、女性名詞の「契約」ではなく、集合的に用いられた「住民」を指すと理解される。ここでは、その住民が人を巻き込み、不忠実へ導く危険を表す比喩。
    reason: מוֹקֵשׁ の語義と比喩的用法、および最後の動詞の文法上の先行詞を示すため。
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 十分に気をつけなさい
  rationale: ニファル命令形と לְךָ から成る、自分自身への警戒を促す表現。現代日本語として自然な警告にしつつ、強い注意の意味を保った。
- source_word: פֶּן ... פֶּן
  choice: …ないよう…、…ならないように
  rationale: 危険を避けるための警告を導く語。二度の反復を日本語でも保ち、原文の段階的な警告を表した。
- source_word: תִּכְרֹת בְּרִית
  choice: 契約を結ぶ
  rationale: 字義的には「契約を切る」だが、契約締結を意味する定型句であり、日本語の自然な対応表現を用いた。
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: その地の住民と
  rationale: 単数形の分詞は集合的に、その地に住む人々を指すため、「住民」とした。
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: あなたが入って行く地
  rationale: イスラエルがこれからその地へ進み入ることを、簡潔で自然な日本語で表した。
- source_word: לְמוֹקֵשׁ
  choice: 罠
  rationale: 実際の仕掛けと比喩的な陥穽の双方を表し得る語であり、ここでは契約による束縛や不忠実への危険を示す比喩を保った。
- source_word: בְּקִרְבֶּךָ
  choice: あなたのただ中で
  rationale: 二人称単数で一つの民としてのイスラエルに語りかける形を保ち、内面的な意味だけに限定しなかった。
theological_decisions:
- issue: 最後の単数動詞 יִהְיֶה の主語
  choice: 「それ」とし、指示対象を本文で明示しすぎない
  alternative: 「その契約が」と明示する／「住民が」と解する／状況全体を指すと解する
  rationale: 文脈上は直前の契約が罠となるとの理解が自然だが、ヘブライ語では主語が明示されず、男性単数形は集合的な「住民」を受ける可能性もある。日本語の「それ」で原文の緊張を残し、注で説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の厳粛さを保った。二度の פֶּן に対応する警告構造を残し、「ただ中」で共同体に向けた単数呼びかけを表した。
