  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: ja
  text: 主は言われた。「見よ、わたしは契約を結ぶ。あなたの民すべての前で、全地においても、どの国民の間でも、いまだ造り出されたことのない驚くべきことを行う。あなたがそのただ中にいる民は皆、主のわざを見る。わたしがあなたと共に行うことは、畏れを抱かせるものだからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 見よ
  rationale: 発話への注意を促す提示表現。現代日本語でも聖書本文にふさわしい簡潔で荘重な語として保持した。
- source_word: כֹּרֵת בְּרִית
  choice: 契約を結ぶ
  rationale: 字義的には「契約を切る」だが、日本語の定着した自然な表現を用いた。分詞形の進行・切迫感は文脈上、日本語現在形で表した。
- source_word: נִפְלָאֹת
  choice: 驚くべきこと
  rationale: 神による並外れた不思議な行為を指す。単に「奇跡」と限定せず、語の広がりを残した。
- source_word: לֹא נִבְרְאוּ
  choice: いまだ造り出されたことのない
  rationale: ברא の受動形を反映し、前例のない業であることを明示した。「創造された」では日本語として対象との結びつきが不自然なため「造り出された」とした。
- source_word: מַעֲשֵׂה יְהוָה
  choice: 主のわざ
  rationale: 神名 יהוה は日本語聖書で広く理解される「主」とし、מַעֲשֵׂה は神の働きを表す「わざ」とした。
- source_word: נוֹרָא
  choice: 畏れを抱かせる
  rationale: 「恐ろしい」だけでなく畏敬・圧倒を引き起こす意味を含むため、この表現で意味幅を保った。
- source_word: עֹשֶׂה עִמָּךְ
  choice: あなたと共に行う
  rationale: עִם の基本的な共同・随伴の意味を保持した。「あなたのために」や「あなたに対して」と一義化しなかった。
theological_decisions:
- issue: 契約を結ぶ主体と相手
  choice: 「わたしは契約を結ぶ」とし、相手を本文に補わない
  alternative: 「わたしはあなたと契約を結ぶ」
  rationale: ヘブライ語の当該節では契約相手が明示されていないため、文脈からの補足を本文へ持ち込まなかった。
- issue: 神の行為とモーセ／イスラエルとの関係
  choice: 「あなたと共に行う」
  alternative: 「あなたのために行う」「あなたに対して行う」
  rationale: עִמָּךְ の関係性にある曖昧さを保ち、恩恵または対抗という方向へ神学的に限定しない。
- issue: יהוה の表記
  choice: 「主」
  alternative: 「ヤハウェ」
  rationale: 固有名を示す伝統的な代替表記として、一般読者に理解しやすい「主」を採用した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「見よ」「わざ」「畏れ」により適度な荘重さを保った。長文は原文の論理の流れを維持し、過度な説明的補足を避けた。
