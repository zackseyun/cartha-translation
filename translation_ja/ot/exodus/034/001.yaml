source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: ja
  text: ヤハウェはモーセに言った。「最初のものと同じ石の板を二枚、自分で切り出しなさい。[a] わたしはその板に、あなたが砕いた最初の板にあった言葉を書き記す。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「切り出しなさい」は、「刻んで作りなさい」とも訳せる。
    reason: 石板を形作る動詞 פּסל には、切る、彫る、刻むという意味領域があるため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: פְּסָל לְךָ
  choice: 自分で切り出しなさい
  rationale: 石を加工して板を作る命令を自然な現代日本語で表し、לְךָによるモーセ自身の関与も「自分で」と明示した。
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: 石の板を二枚
  rationale: 材質と数量を明確にしつつ、現代日本語として自然な語順にした。
- source_word: כָּרִאשֹׁנִים
  choice: 前のものと同じような
  rationale: 最初の二枚を基準とする類似を表す比較表現として訳した。
- source_word: וְכָתַבְתִּי
  choice: わたしは……書き記す
  rationale: 一人称の約束を簡潔に表し、板への記載であることが分かる動詞を選んだ。
- source_word: הַדְּבָרִים
  choice: 言葉
  rationale: 文脈上は契約の規定を指すが、原語の広い意味を保ち、「戒め」と限定しなかった。
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: あなたが砕いた
  rationale: שׁברが示す石板の破壊を、具体的で自然な表現にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に固有名があることを保持し、称号への置換や別の伝統的音写を採らなかった。
- issue: הַדְּבָרִים の内容
  choice: 言葉
  alternative: 戒め
  rationale: 十戒を指す文脈は保ちつつ、原語が直接には「言葉」を意味するため、解釈を狭めなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「石板」一語よりも原文の構造が見える「石の板」を用い、直接話法は自然な命令表現にした。
