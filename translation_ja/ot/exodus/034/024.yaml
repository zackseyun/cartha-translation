  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּֽי אוֹרִ֤ישׁ גּוֹיִם֙ מִ/פָּנֶ֔י/ךָ וְ/הִרְחַבְתִּ֖י אֶת גְּבוּלֶ֑/ךָ וְ/לֹא יַחְמֹ֥ד אִישׁ֙ אֶֽת אַרְצְ/ךָ֔ בַּ/עֲלֹֽתְ/ךָ֗ לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: ja
  text: わたしが諸国の民をあなたの前から追い払い、あなたの領土を広げるからである。年に三度、あなたが上って、あなたの神ヤハウェの御前に出る[a]とき、だれもあなたの土地を欲しがることはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御前に出る」は、ヘブライ語の本文の読みでは神の前に現れることを表す。子音綴りは字義的に「（神の）顔を見る」とも読めるが、ここでは礼拝のため神の前に参上することを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: からである
  rationale: 直前の巡礼祭についての命令を守れる根拠を示す接続詞として、説明・理由の働きを自然な日本語で表した。
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: 諸国の民をあなたの前から追い払い
  rationale: ヒフィル形の除去・放逐の意味と、מִפָּנֶיךָ の空間的な慣用表現を保った。גּוֹיִם はこの文脈では政治的集団だけでなく人々も指すため「諸国の民」とした。
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: あなたの領土を広げる
  rationale: גְּבוּל は境界線だけでなく境界内の領域も表す。日本語では「境を広げる」より「領土を広げる」が自然で、約束された領域の拡張を明確に伝える。
- source_word: וְלֹא יַחְמֹד אִישׁ אֶת־אַרְצְךָ
  choice: だれもあなたの土地を欲しがることはない
  rationale: אִישׁ は男性単数形だが、この否定構文では代表的・一般的に「だれも」の意味となる。חמד は不当に手に入れようとする欲望を含み得るが、日本語の「むさぼる」は土地を直接目的語にすると不自然なため、「欲しがる」として文脈上の脅威を保った。
- source_word: בַּעֲלֹתְךָ
  choice: あなたが上って
  rationale: 聖所への巡礼を表す עלה の慣用的な方向性を、そのまま自然な日本語で示した。
- source_word: לֵרָאוֹת אֶת־פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: あなたの神ヤハウェの御前に出る
  rationale: 子音本文の形は字義的には「顔を見る」と読めるが、祭儀的文脈では神の前に参上することを表す。「御前に出る」はその意味を自然かつ敬意ある日本語で伝える。
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 年に三度
  rationale: 回数と期間の関係を簡潔で自然な現代日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、日本語で一般的な学術的音写によって固有名として示した。
theological_decisions:
- issue: לֵרָאוֹת אֶת־פְּנֵי の解釈
  choice: 御前に出る
  alternative: 御顔を見る
  rationale: 子音綴りは「見る」と「見られる／現れる」に関わる伝承上の論点を含むが、巡礼祭の定型表現としては神の前に参上する意味が文脈に最も適する。字義的形は脚注で示した。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の四文字神名があるため、称号「主」に置換せず音写した。
- issue: אִישׁ の代表的用法
  choice: だれも
  alternative: どの男も
  rationale: 文法上は男性単数だが、לֹא ... אִישׁ は否定極性の一般表現で「だれも〜ない」を意味する。さらに直後の二人称単数はイスラエルを集合的に指しており、土地を狙う者を男性に限定することが主眼ではない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、契約文書としての荘重さを保った。「あなた」は文法上単数で、民を集合的に指す。語順は日本語として自然になるよう整えつつ、理由提示、領土拡張、安全の約束、年三度の巡礼という論理関係を保持した。
