  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: ja
  text: 彼はそこでヤハウェと共に四十日四十夜を過ごした。パンは食べず、水も飲まなかった。そして、契約の言葉、すなわち十の言葉[b]を板に書き記した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェが書き記した」とも取れる。ほかの箇所では、板に書いたのはヤハウェだとされている（出エジプト記34:1、申命記10:4参照）。
    reason: alternative_reading
  - marker: b
    text: ヘブライ語では「十の言葉」。伝統的には「十戒」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を、称号の「主」に置き換えず、日本語で一般的な形に音写した。
- source_word: וַיְהִי שָׁם עִם
  choice: 彼はそこで…と共に…過ごした
  rationale: 所在を表すヘブライ語を、四十日四十夜という期間表現に自然につながる現代日本語にした。「彼」は文脈上モーセを指す。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: 四十日四十夜
  rationale: 期間を表す定型的かつ簡潔な日本語表現。
- source_word: לֶחֶם לֹא אָכַל
  choice: パンは食べず
  rationale: לֶחֶם の具体語「パン」を保ち、「食物」と一般化しなかった。
- source_word: וּמַיִם לֹא שָׁתָה
  choice: 水も飲まなかった
  rationale: 前句との並行を保ちながら、自然な日本語にした。
- source_word: וַיִּכְתֹּב
  choice: 書き記した
  rationale: 「書く」を意味する動詞を、石の板への記載に適した自然で格調ある語にした。原文に明示されていない主語は本文でも補わず、解釈上の問題を脚注に示した。
- source_word: עַל הַלֻּחֹת
  choice: 石の板に
  rationale: 「板」に加え、直前の34:1および物語の文脈から材質を明示した、日本語聖書で理解しやすい表現。
- source_word: דִּבְרֵי הַבְּרִית
  choice: 契約の言葉
  rationale: 連語の関係を直接保ち、契約との結び付きを明瞭にした。
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: 十の言葉
  rationale: 原文の「言葉」をそのまま保ち、伝統的な「十戒」という解釈的名称は脚注に示した。
theological_decisions:
- issue: 「書き記した」の主語
  choice: 主語を明示せず、直前までの主語であるモーセがそのまま続くと自然に読める形にした。
  alternative: 「ヤハウェが書き記した」と明示する。
  rationale: この動詞は三人称男性単数だが、主語を明記していない。直近の統語の流れではモーセが主語と読める一方、出エジプト記34:1と申命記10:4はヤハウェが板に書いたとしている。この緊張を本文で一方的に解消せず、別解を脚注に残した。
- issue: עֲשֶׂרֶת הַדְּבָרִים の訳
  choice: 十の言葉
  alternative: 十戒
  rationale: ヘブライ語の字義を本文に保った。「十戒」は広く定着した呼称であるため、読者の理解を助ける別訳として脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「共に」「書き記した」など、聖書本文にふさわしい落ち着いた語調を保った。原文の反復と具体語を尊重しつつ、日本語として不自然な逐語調は避けた。
