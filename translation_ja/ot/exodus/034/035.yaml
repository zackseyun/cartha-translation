  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: ja
  text: イスラエルの子ら[a]はモーセの顔を見た。その顔の皮膚が光を放っていた[b]。モーセは、彼[c]と話すために中へ入るまで、覆いを再び顔に掛け直していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子ら」。一般には「イスラエル人」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: このヘブライ語動詞は「輝く」「光を放つ」という意味。伝統的な「角が生えていた」という訳は、語の古い誤解に由来する。
    reason: lexical_alternative
  - marker: c
    text: 「彼」は、直前の文脈では主を指す。
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: 見た
  rationale: 物語を進める接続形として単純過去で訳した。文脈には反復的な行為が含まれるが、日本語では後半の「掛けていた」と周辺文脈によってその性質が自然に伝わる。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の家族的な表現を保った。「イスラエル人」も自然な訳だが、原文の比喩を明示するため直訳寄りの表現を採用した。
- source_word: פְּנֵי מֹשֶׁה
  choice: モーセの顔
  rationale: 構成連語を自然な現代日本語の所有表現で訳した。
- source_word: כִּי
  choice: その顔の皮膚は……ていた
  rationale: 見た内容を示す כִּי の働きを、独立した日本語文によって明確に表した。因果を示す「なぜなら」とは訳さなかった。
- source_word: קָרַן
  choice: 光を放っていた
  rationale: 語義は光線を発する、輝くことである。「角が生えていた」という古い誤解を避けつつ、放射のイメージを保った。
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: その顔の皮膚
  rationale: עוֹר の具体的な意味「皮膚」を省かず、直前のモーセを「その」で受けて日本語の不自然な反復を避けた。
- source_word: וְהֵשִׁיב
  choice: 再び……掛けていた
  rationale: 使役形の「元に戻す」を、覆いを顔へ戻す反復的行為として自然に表現した。
- source_word: הַמַּסְוֶה
  choice: 覆い
  rationale: 顔を覆う物を指す語として明瞭であり、「ベール」よりも性別や服飾に関する余分な連想が少ない。
- source_word: עַל־פָּנָיו
  choice: 顔に
  rationale: 日本語では「覆いを顔に掛ける」が、顔を覆う機能を自然に表す。
- source_word: עַד בֹּאוֹ
  choice: 中へ入る時まで
  rationale: 行為の継続期限を示す עַד と、不定詞構文の移動を自然な日本語で表した。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 彼と語るために
  rationale: 原文の代名詞を本文でも保持し、その指示対象は注で明らかにした。
theological_decisions:
- issue: 「彼と」の指示対象
  choice: 本文では原文どおり代名詞「彼」を残し、注で主を指すと説明した。
  alternative: 本文で「主と語るために」と明示する。
  rationale: 直前の文脈から指示対象は主と理解されるが、この節自体は神名ではなく代名詞を用いるため、その形式を保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。原文の具体語「皮膚」と代名詞を保持しつつ、構文は日本語として読みやすい三文に整えた。反復的な場面描写は「掛けていた」で示した。
