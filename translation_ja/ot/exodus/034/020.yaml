  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: ja
  text: ろばの初子は、羊一匹[a]で贖わなければならない。もし贖わないなら、その首を折らなければならない。あなたの息子たちの初子はみな、贖わなければならない。だれも手ぶらで[c]わたしの前に[b]出てはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでのヘブライ語は、羊または山羊を含む「群れの一頭」という広い意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「わたしの顔の前に」。神の前に出ることを表すヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: c
    text: すなわち、贈り物や供え物を何も持たずに、ということ。
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: ろばの初子
  rationale: פֶטֶר は最初に胎を開くものを指す。祭儀法の文脈に即して、簡潔で伝統的かつ理解可能な「初子」とした。
- source_word: תִּפְדֶּה
  choice: 贖わなければならない
  rationale: פדה は代価または代わりのものによって取り戻すことを表す祭儀的・法的用語である。「贖う」はその意味を保ち、文脈上の義務は「なければならない」で自然に示した。
- source_word: בְשֶׂה
  choice: 羊一匹で
  rationale: שֶׂה は羊または山羊を含む群れの一頭を指し得る。本文では簡潔な「羊一匹」とし、語の広がりを脚注に残した。
- source_word: וַעֲרַפְתּוֹ
  choice: その首を折らなければならない
  rationale: ערף はここでは動物の首を折ることを明確に指すため、具体的で自然な表現とした。
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: あなたの息子のうち、初子はみな
  rationale: בָּנֶיךָ は明示的に「あなたの息子たち」を指すため性別を一般化せず、כֹּל の包括性を「みな」で表した。
- source_word: יֵרָאוּ פָנַי
  choice: わたしの前に出る
  rationale: 字義的には「わたしの顔の前に現れる」だが、神の臨在のもとに礼拝のため出ることを表すヘブライ語の慣用句なので、自然な日本語にした。
- source_word: רֵיקָם
  choice: 手ぶらで
  rationale: 巡礼・礼拝の文脈では、供え物を持たずに来ることを含意する。「手ぶらで」はその慣用的意味を簡潔に伝える。
theological_decisions:
- issue: 末尾にある神の一人称表現
  choice: わたしの前に
  alternative: わたしの顔の前に／わたしの臨在の前に
  rationale: 「顔」を字義どおり残すよりも、神の前に出るという慣用的意味を自然に示しつつ、神の直接話法を保持した。
- issue: בָּנֶיךָ の性別表現
  choice: あなたの息子
  alternative: あなたの子ども
  rationale: 原文は一般的な子どもではなく明示的に息子を指すため、その限定を保持した。
- issue: רֵיקָם が含意する礼拝上の義務
  choice: 本文は「手ぶらで」とし、供え物の含意を脚注で示す
  alternative: 供え物なしに
  rationale: 原文の比喩的・慣用的表現を保ちながら、文脈上の意味を過度に限定せず補足した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で dignified な法令調とした。「初子」「贖う」は本文の祭儀的性格を保つため用い、義務表現は硬すぎる「べし」を避けて「なければならない」で統一した。
