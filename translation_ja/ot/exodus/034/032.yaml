    rationale: 意味は正しいが、対象とする明瞭な現代標準日本語では「子らは皆」「すべてのこと」の方が自然である。
  revised_text: その後、イスラエルの子らは皆、近づいて来た。モーセは、シナイ山でヤハウェがモーセに語ったすべてのことを、彼らに命じた。
