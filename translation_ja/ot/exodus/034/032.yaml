  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: ja
  text: その後、イスラエルの子らは皆、近づいて来た。モーセは、シナイ山でヤハウェがモーセに語ったすべてのことを、彼らに命じた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: その後
  rationale: 先行する出来事に続く時間的推移を、簡潔で自然な現代日本語で示す。
- source_word: נִגְּשׁוּ
  choice: 近寄って来た
  rationale: נגשׁのニファル形が表す具体的な接近を保ち、直前までモーセを恐れていた民が近づく場面にも適合する。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルのすべての子ら
  rationale: בְּנֵיの男性複数形と国民的・契約的表現を保つ。「イスラエル人全員」も自然だが、原文の親族表現が失われる。
- source_word: וַיְצַוֵּם
  choice: 彼らに命じた
  rationale: צוהが持つ命令・指示の強さを保つ。「教えた」では命令性が弱まる。主語は文脈上モーセなので、日本語では明示した。
- source_word: אֵת כָּל אֲשֶׁר
  choice: ことを、ことごとく
  rationale: 語られた内容の全体を残らず民に命じたという範囲を、自然で格調ある日本語で表す。
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: ヤハウェが自分に語られた
  rationale: אִתּוֹの「彼と」の対話的含みを日本語の自然さの範囲で「自分に語られた」と表し、出来事がモーセへの先行する発言であることは文脈と連体節で示す。神への敬意を表すため主語尊敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写する。
- source_word: בְּ/הַר סִינָי
  choice: シナイ山で
  rationale: 山上で語られた出来事を表す、日本語として自然な場所表現。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を直接用いているため、称号で代替せず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルのすべての子ら
  alternative: イスラエル人全員／イスラエルのすべての子どもたち
  rationale: 国民全体を指す定型表現である一方、原文の男性複数の親族語を消さないよう「子ら」とした。「子どもたち」は年少者との誤解を招きやすい。
- issue: וַיְצַוֵּם の主語
  choice: モーセは
  alternative: 彼は
  rationale: ヘブライ語では動詞の男性単数形に主語が含まれ、文脈上モーセを指す。日本語で曖昧さを生じさせないため固有名を補った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「子ら」「ことごとく」により聖書本文としての品位と原文の形を保った。過度に古風な語尾や漢文調は避けた。
