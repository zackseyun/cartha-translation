  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: ja
  text: しかし今、もし彼らの罪を赦してくださるなら[a]……。もしそうでないなら、どうか、あなたがお書きになった書[b]から私を消し去ってください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「彼らの罪を担う／取り去る」。ここでは「罪を赦す」という意味の慣用表現です。
    reason: lexical_alternative
  - marker: b
    text: 「書」が何を指すかは、ヘブライ語本文では明示されていません。生きている者についての神の記録、あるいは広い意味で「いのちの書」を指す可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: しかし今
  rationale: 直前の執り成しを受けて、モーセの切迫した願いへ転じる文脈上の対照を自然な現代日本語で表す。
- source_word: תִּשָּׂא חַטָּאתָם
  choice: 彼らの罪を赦してくださる
  rationale: נשׂא は字義的には「上げる、担う」だが、「罪」を目的語とする慣用表現としては「赦す」が明瞭で自然。未完の条件文が途中で切れる原文の緊張はダッシュで保持した。
- source_word: וְאִם אַיִן
  choice: けれども、もしそうでないなら
  rationale: 省略を含む否定条件を、先行する願いとの強い対照が伝わる形で訳した。
- source_word: מְחֵנִי נָא
  choice: どうか、私を消し去ってください
  rationale: מחה の記録から抹消する比喩を「消し去る」で保ち、נָא の嘆願の調子を「どうか」で表した。
- source_word: מִסִּפְרְךָ אֲשֶׁר כָּתָבְתָּ
  choice: あなたがお書きになった書から
  rationale: סֵפֶר を具体的に「いのちの書」などと限定せず、「書」として原文の曖昧さを保持した。神に対する敬意は尊敬表現で自然に示した。
theological_decisions:
- issue: 「あなたの書」が指すもの
  choice: あなたがお書きになった書
  alternative: いのちの書／生きている者の名簿／あなたの記録
  rationale: ヘブライ語はこの書の性質を特定していないため、神の記録、生者の名簿、いのちの書のいずれかに解釈を固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神への呼びかけには過度に古風な敬語を避けつつ、「くださる」「お書きになった」で嘆願にふさわしい敬意を示した。原文の第一条件節が帰結を明示せず中断される構文は、補わずダッシュで再現した。
