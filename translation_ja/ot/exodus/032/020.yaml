  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: ja
  text: 彼は、彼らが造った子牛を取って火で焼き、細かくなるまですり砕き、それを水面にまき散らし、イスラエルの子ら[a]にそれを飲ませた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの民」とも訳せる。ヘブライ語は直訳すると「イスラエルの子ら」で、ここでは民全体を指す定型的な呼び名。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: 子牛
  rationale: עֵגֶלは若い牛を指し、この文脈では金の子牛の像である。日本語で定着し、明瞭な「子牛」とした。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 彼らが造った
  rationale: 関係節が、民によってすでに造られた子牛を特定している。「造った」は偶像の製作にも自然である。
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: 火で焼き
  rationale: 前置詞בְּを手段として自然に表し、火によって焼いたという具体的な動作を保った。
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: 細かくなるまですり砕き
  rationale: טחןの「ひく、すり砕く」とדקの「細かい」を表す。原文が明示しない「粉」は本文に補わない。
- source_word: וַיִּזֶר
  choice: まき散らして
  rationale: 細かくされたものを水面に広く散布する動作を、現代日本語で明瞭に表した。
- source_word: עַל פְּנֵי הַמַּיִם
  choice: 水の面に
  rationale: פְּנֵיの「面、表面」という具体的な像を簡潔に保った。
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに飲ませた
  rationale: שׁקהの使役形を「飲ませた」とし、בְּנֵי יִשְׂרָאֵלの形を本文で保った。日本語では目的語が文脈から明白なので「それを飲ませた」とは重ねなかった。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵלの表現
  choice: イスラエルの子ら
  alternative: イスラエルの民
  rationale: 原文の字義的な形を本文に残しつつ、これは共同体全体を指す定型的呼称であることを脚注で明確にした。男性だけに限定する解釈は採らない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。連続する動作を一文で保ち、原文の簡潔な物語調を再現した。「すり砕く」はטחןの粉砕動作を自然に示し、「粉になるまで」と過度に限定することを避けた。
