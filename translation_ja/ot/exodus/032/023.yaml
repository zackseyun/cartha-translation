  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ja
  text: 彼らは私に言いました。[a]「私たちのために、私たちの前を進む神々を造ってくれ。私たちをエジプトの地から連れ上げた、あのモーセという人がどうなったのか、私たちには分からないからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちのために、私たちの前を進む神を造ってくれ」。この節では「神々」に当たるヘブライ語名詞に、複数形のヘブライ語動詞（「進む」）が伴うが、前後の文脈では一体の子牛像が語られるため、単数の意味に訳すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: 彼らは私に言いました
  rationale: 物語を進める接続形を、日本語で自然な順接として表現する。アロンがモーセに説明している文脈に合わせて丁寧体とした。
- source_word: עֲשֵׂה לָנוּ
  choice: 私たちのために…造ってください
  rationale: 命令形と受益を表す לָנוּ の双方を明確にし、引用内では自然な依頼表現とした。
- source_word: אֱלֹהִים
  choice: 神々
  rationale: 語形自体には単数・複数の可能性があるが、ここでは関係節の動詞 יֵלְכוּ が複数形なので、本文では複数とする。
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: 私たちの先に立って進む
  rationale: לְפָנֵינוּ の『前を』と、先導するという文脈上の含意を自然な現代日本語で表した。
- source_word: כִּי
  choice: …からです
  rationale: 依頼の理由を導く因果関係を明瞭に示す。
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: あのモーセという人
  rationale: 直示表現の距離を置く調子と הָאִישׁ を保ちつつ、不自然な逐語訳を避けた。
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: 私たちをエジプトの地から連れ上った
  rationale: ヒフィル形の『上らせる／連れ上る』を保ち、『エジプトの地』も明示した。
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: どうなったのか、私たちには分からない
  rationale: 人の消息や成り行きを尋ねるヘブライ語の慣用表現を、自然で明瞭な日本語にした。
theological_decisions:
- issue: אֱלֹהִים を単数と複数のどちらで訳すか
  choice: 複数の「神々」
  alternative: 単数の「神」
  rationale: この節では後続する יֵלְכוּ が複数形であり、文法上は複数が強く支持される。周囲の物語が一体の子牛像に焦点を当てることによって生じる緊張は、脚注で示して保持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。アロンのモーセへの応答として地の文を丁寧体にし、引用内も自然な依頼表現とした。原文の複数表現と文脈上の単数像との緊張を本文と脚注で保持した。
