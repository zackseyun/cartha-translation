- from: 彼らは私に言いました。[a]『私たちのために、私たちの先に立って進む神々を造ってください。私たちをエジプトの地から連れ上った、あのモーセという人がどうなったのか、私たちには分からないからです。』
  to: 彼らは私に言いました。[a]「私たちのために、私たちの前を進む神々を造ってくれ。私たちをエジプトの地から連れ上げた、あのモーセという人がどうなったのか、私たちには分からないからだ。」
  rationale: 複数の「神々」という本文の読みは維持し、周辺文脈との緊張も脚注で保持した。原文の命令形をより直接的な現代日本語にし、自然な表記に整えた。さらに、脚注が複数形の根拠を日本語動詞ではなくヘブライ語原文の動詞として正確に説明するよう訂正した。
