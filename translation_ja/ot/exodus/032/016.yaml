base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: ja
  text: その板は神が造ったものであり、板に刻まれた文字は神が記したものであった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「その書かれたものは神の書かれたもの」。原文は「書かれたもの」に当たる語を繰り返し、文字が神に由来することを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: その板
  rationale: 文脈上、契約の石の板を指す。「石」はこの節には明記されていないため補わず、自然な日本語で「その板」とした。
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: 神が造ったもの
  rationale: 直訳的には「神の業／作品」。日本語で「神の作品」は芸術作品を連想させやすいため、神による制作を明確にする自然な表現とした。
- source_word: הֵמָּה
  choice: ものであり
  rationale: 独立代名詞による強調を、主題を明示した判断文の形で自然に表した。
- source_word: הַמִּכְתָּב
  choice: そこにある文字
  rationale: 板に記された書字・銘文を指す。後続の「神が書いたもの」との関係が分かるよう、指示範囲を明確にした。
- source_word: מִכְתַּב אֱלֹהִים
  choice: 神が書いたもの
  rationale: 「神の書いたもの／神の書字」という名詞的表現が示す、文字そのものの神的起源を明確に保った。
- source_word: חָרוּת
  choice: 刻まれていた
  rationale: 石板上の文字が彫り刻まれていたことを表す語であり、「刻まれていた」が明瞭で自然。
- source_word: עַל הַלֻּחֹת
  choice: 板の上に
  rationale: 前置詞 עַל の位置関係をそのまま明確に表した。
- source_word: וְ
  choice: であり／で
  rationale: 二つの叙述を接続する機能を日本語の連用的な接続で表し、原文にない時間副詞は加えなかった。
theological_decisions:
- issue: 板と文字の由来・行為主体
  choice: 板を造ったのも文字を書いたのも神であると明示した。
  alternative: 「板は神の業、文字は神の書いたもの」と名詞句をより直訳的に並べる。
  rationale: ヘブライ語はどちらも神に直接帰属させている。日本語では動詞節にすることで自然さを保ちつつ、その強い帰属を曖昧にしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「御業」など教会内で主に用いられる語を本文では避け、神による制作と記 inscription の双方を平易かつ荘重に示した。
