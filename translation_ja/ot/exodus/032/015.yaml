id: EXO.32.15
reference: Exodus 32:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: ja
  text: モーセは向きを変えて山を下った。その手には、証しの二枚の板があった。板はその両面に文字が書かれ、こちら側にもあちら側にも[a]書かれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一方の面にも、もう一方の面にも」。
    reason: מִזֶּה וּמִזֶּהの指示的・分配的表現に可能な日本語表現を示すため。
lexical_decisions:
- source_word: וַיִּפֶן
  choice: 向きを変えて
  rationale: פנהが示す進行方向の転換を、過度に具体化せず自然な現代日本語で表した。
- source_word: וַיֵּרֶד
  choice: 下った
  rationale: ירדの基本義「下る」を簡潔に表し、語り手の位置を不必要に示唆しない。
- source_word: הָהָר
  choice: 山
  rationale: シナイの文脈に即し、הַרの通常の意味を採った。
- source_word: שְׁנֵי לֻחֹת
  choice: 二枚の板
  rationale: לֻחֹתを文字を記す平板として「板」とした。「石」はこの節に明記されていないため補わなかった。
- source_word: הָעֵדֻת
  choice: 証し
  rationale: עֵדוּתの証言・証しという語義と契約的な響きを保ち、「契約文書」などに限定しなかった。
- source_word: בְּיָדוֹ
  choice: その手には
  rationale: 原文の単数形を保ちつつ、日本語で自然な携行表現とした。
- source_word: לֻחֹת כְּתֻבִים
  choice: 板は…文字が書かれ
  rationale: 受動分詞כְּתֻבִיםの単純な「書かれている」という意味を保ち、「刻まれた」とは限定しなかった。
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: その両面に
  rationale: 二つの側・面の双方に文字があることを、明瞭で自然な日本語にした。
- source_word: מִזֶּה וּמִזֶּה
  choice: こちら側にもあちら側にも
  rationale: 指示語を反復する原文の釣り合いと強調を残した。
- source_word: הֵם כְּתֻבִים
  choice: 書かれていた
  rationale: 直前の「書かれ」と重なる原文の反復を省かず、両面に書かれていたことを強調した。
theological_decisions:
- issue: 「証しの板」におけるעֵדוּתの訳
  choice: 証し
  alternative: 契約／証言
  rationale: 契約に関わる専門的な響きを残しながら、原語以上に意味を「契約」へ限定しないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「証し」は文脈上の重要語として保持し、原文にない「石」は補わなかった。原文の「書かれ」の反復も残した。
