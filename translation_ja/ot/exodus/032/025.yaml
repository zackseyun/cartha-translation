id: EXO.32.25
reference: Exodus 32:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: ja
  text: モーセが見ると、民は歯止めが利かなくなっていた。アロンが彼らを野放しにした[a]ため、敵対する者たちの間で物笑いの種となっていた[b]のである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「歯止めが利かなくなっていた」と「野放しにした」は、ヘブライ語では同じ語根の反復。「抑えが利かない」「束縛を解かれた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「物笑いの種となって」は、「嘲りの的となるために」または「敵対者たちの間で辱めとなって」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: モーセが見ると
  rationale: 物語を進める接続形を、後続の行動につながる自然な時間表現として訳した。
- source_word: כִּי פָרֻעַ הוּא
  choice: 民は歯止めが利かなくなっていた
  rationale: פרע の、抑制が解かれて秩序を失った状態を、現代日本語で明瞭に表した。
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: アロンが彼らを野放しにしたため
  rationale: 同じ語根 פרע の反復を関連する日本語表現で示しつつ、アロンが抑制しなかった責任を、故意とまでは断定せずに表した。
- source_word: לְשִׁמְצָה
  choice: 物笑いの種となって
  rationale: 嘲り、侮蔑、悪評の対象となる意味を、自然で理解しやすい日本語にした。
- source_word: בְּקָמֵיהֶם
  choice: 敵対する者たちの間で
  rationale: 直訳的には『彼らに立ち向かう者たちの間で』であり、ここではイスラエルに敵対する者たちを指す。
theological_decisions:
- issue: פרע の社会的・道徳的含意
  choice: 秩序と抑制を失った状態として「歯止めが利かなくなっていた／野放しにした」と訳す
  alternative: 「裸になっていた」「慎みを失っていた」「解き放たれていた」
  rationale: この語根には緩めることや露出の含意もあり得るが、この文脈では集団の無秩序と抑制の喪失が中心である。「裸」と限定すると、本文が明示しない特定の理解に狭めるおそれがある。
- issue: לְשִׁמְצָה の結果・目的のニュアンス
  choice: 敵対者の間で「物笑いの種となっていた」
  alternative: 敵対者の間で「嘲りの的となるために」
  rationale: 前置詞 לְ は目的または結果を表し得る。日本語本文では文脈上自然な結果として表し、目的・結果の幅は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙事文としての品位を保った。פרע の反復は日本語で完全に同語反復すると不自然になるため、「歯止めが利かない」と「野放しにする」という意味的に対応する表現を採用し、原文の反復は脚注で明示した。
