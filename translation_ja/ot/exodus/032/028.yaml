base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: ja
  text: レビの子らは、モーセの言葉どおりにした。その日、民のうち、およそ三千人の男が倒れた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「倒れた」。死んだ、または討たれたことを表す一般的な言い方。「殺された」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 行った
  rationale: עשהの広い意味を保ちつつ、「モーセの言葉どおりに」と自然につながる表現とした。文脈上は命令の実行を指すが、原文以上に限定しない。
- source_word: בְנֵי לֵוִי
  choice: レビの子ら
  rationale: 原文の親族的表現を保持した。「レビ人たち」も可能だが、ここでは語形に即した表現を採った。
- source_word: כִּדְבַר מֹשֶׁה
  choice: モーセの言葉どおりに
  rationale: דברを「言葉」として残しながら、ここでは命令・指示を意味することが文脈から伝わる自然な日本語とした。
- source_word: וַיִּפֹּל
  choice: 倒れた
  rationale: 死または討たれることを表す慣用的な「倒れる」を保持し、「殺された」と原因を明示する訳に限定しなかった。集合的な単数動詞は日本語では人数を主語として自然に表した。
- source_word: מִן הָעָם
  choice: 民のうち
  rationale: מןの部分を示す用法、すなわち倒れた者が民の一部であることを簡潔に表した。
- source_word: בַּיּוֹם הַהוּא
  choice: その日
  rationale: 時間表現を明瞭で自然な現代日本語にした。
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: およそ三千人の男
  rationale: 数詞に付くכの概数を「およそ」で表し、אישの男性を指す語義を「男」として保持した。
theological_decisions:
- issue: 裁きの文脈における死者の記述
  choice: およそ三千人の男が倒れた
  alternative: およそ三千人の男が殺された／死んだ
  rationale: ヘブライ語は「殺す」や「死ぬ」を直接用いず、「倒れる」という慣用表現を用いる。本文ではその表現を保ち、行為の結果と主体を原文以上に明示しない。脚注で意味を補う。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「レビの子ら」は原文の表現を意識したやや聖書的な語調だが、意味は平易。脚注記号[a]は該当する「倒れた」の直後に置いた。
