  text: וְ/עַתָּה֙ הַנִּ֣יחָ/ה לִּ֔/י וְ/יִֽחַר אַפִּ֥/י בָ/הֶ֖ם וַ/אֲכַלֵּ֑/ם וְ/אֶֽעֱשֶׂ֥ה אוֹתְ/ךָ֖ לְ/ג֥וֹי גָּדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: ja
  text: 今、わたしを放っておけ[a]。わたしの怒りが彼らに向かって燃え上がり、わたしが彼らを滅ぼし尽くすために[b]。わたしはあなたを大いなる国民としよう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしをそのままにしておけ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「わたしの憤りが彼らに対して燃え上がり、わたしが彼らを滅ぼすために」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 今
  rationale: 談話を進め、直ちに命令を導入する標識として、簡潔で自然な「今」とした。
- source_word: הַנִּיחָה לִּי
  choice: わたしをそのままにしておけ
  rationale: 使役形の命令がこの慣用句では、相手を放置し、制止をやめるよう求める意味になる。命令の強さと、モーセの介入を退ける含みを保つ。
- source_word: וְיִחַר אַפִּי
  choice: そうすれば、わたしの怒りは…燃え上がり
  rationale: חרה אף の「怒りが燃える」という比喩を保持した。接続詞は、先行する命令に続く結果・目的の関係として自然な日本語にした。
- source_word: בָהֶם
  choice: 彼らに向かって
  rationale: 怒りがイスラエルへ向けられる敵対的方向を、日本語として明確に表した。
- source_word: וַאֲכַלֵּם
  choice: わたしは彼らを滅ぼし尽くす
  rationale: כלה のピエル形が表す「終わらせる、完全に滅ぼす」を訳出した。「滅ぼす」だけでなく「尽くす」によって完遂のニュアンスを保った。
- source_word: וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי גָּדוֹל
  choice: しかし、あなたを大いなる国民としよう
  rationale: 「あなたを大きな民へとする」という構文を自然に訳した。前の滅びとの対照が日本語で明確になるよう「しかし」とした。「大いなる国民」は族長への約束との響きを保つ。
theological_decisions:
- issue: 神の怒りを表す擬人的比喩
  choice: 「怒りは…燃え上がり」として、燃える怒りの比喩を保持する。
  alternative: 「彼らに憤る」など、抽象化して訳す。
  rationale: 原文の鮮烈な表現と、神の聖さおよび裁きをめぐる神学的緊張を弱めないため。
- issue: 「わたしをそのままにしておけ」という命令とモーセの執り成しとの関係
  choice: 実際の命令として率直に訳し、その意図を本文中で説明しない。
  alternative: モーセへの暗黙の執り成しの招きとして訳文に織り込む。
  rationale: この節自体は直接命令と裁きの宣告を提示する。執り成しへの招きかどうかは解釈に属するため、訳文で決着させない。
- issue: 接続詞 וְ の論理関係
  choice: 前半は「そうすれば」で結果・目的を示し、後半は「しかし」で裁かれる民とモーセへの約束の対照を示す。
  alternative: すべてを単純な「そして」で並列する。
  rationale: ヘブライ語の接続詞は文脈に応じた関係を担う。ここでは日本語として命令後の帰結と、滅びに対する新たな国民形成の対照を明示するのが自然である。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の直接話法にふさわしい威厳を保った。「大いなる国民」は聖書的な約束の響きを残すため、平板な「大きな国」とはしなかった。
