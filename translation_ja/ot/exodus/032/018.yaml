source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: ja
  text: 彼は言った。「勝利の叫び声ではない。敗北の叫び声でもない。私に聞こえるのは、歌声だ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私に聞こえるのは、叫び声だ」。ここで用いられているヘブライ語は、応答する声、叫び声、また歌声を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: 叫び声／歌声
  rationale: 同じ語根に由来する形は、声を上げることや応答する声を表し得る。前半では「勝利」「敗北」と結びつくため戦いの叫び声とし、最後は金の子牛を囲む祝宴という文脈に即して「歌声」とした。ただし「叫び声」という一般的な意味も脚注に残した。
- source_word: גְּבוּרָה
  choice: 勝利
  rationale: 基本的には「力、勇敢さ」だが、戦場の物音を見分ける対句では、勝者側の叫びを表す「勝利」が自然である。
- source_word: חֲלוּשָׁה
  choice: 敗北
  rationale: 字義的には弱さに関係する語だが、「勝利」と対照され、戦いに敗れた側の叫びを指すため「敗北」とした。
- source_word: קוֹל
  choice: 声
  rationale: 三度とも人々が発する聞こえる音を指す。「声」は日本語で「叫び声」「歌声」と自然に結びつき、単なる物音より原文の発声性をよく示す。
- source_word: אֵין
  choice: ではない
  rationale: 反復される否定構文を、簡潔で自然な日本語の「～ではない」で表した。
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: 私に聞こえるのは
  rationale: 独立代名詞と分詞による現在の知覚を自然な日本語で表し、最後の「歌声」を焦点化する原文の語順もある程度保った。
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: ヘブライ語の物語を進める標準的な発話導入として訳した。直前の文脈で話者が明らかなため、固有名は補わない。
theological_decisions: []
