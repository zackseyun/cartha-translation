base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: ja
  text: 彼が宿営に近づき、その子牛と踊り[a]を目にすると、モーセの怒りは燃え上がった。彼は手から石板を投げ、山のふもとでそれらを打ち砕いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は複数形。「踊りの数々」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 彼が……すると
  rationale: ヘブライ語の物語を進める定型句と時間的関係を、現代日本語で自然な「すると」の構文にした。
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: 宿営に近づき
  rationale: קָרַב の空間的な意味「近づく」を簡潔に保った。
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: あの子牛……を目にすると
  rationale: רָאָה の通常の意味「見る」を表し、既出の特定の像を指す定冠詞は、文脈上自然な「あの」で示した。
- source_word: וּמְחֹלֹת
  choice: 踊り
  rationale: 複数形の名詞は踊りまたは踊りの数々を指す。「乱痴気騒ぎ」などの評価的な語を避け、日本語で自然な集合的表現「踊り」とした。
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: モーセの怒りは燃え上がった
  rationale: 怒りが燃えるというヘブライ語の鮮明な慣用表現を、明瞭で格調ある日本語として保持した。
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: 彼は手から……投げ捨て
  rationale: 単数形の「彼の手から」を保ちつつ、שׁלך の強い動作を自然な日本語の「投げ捨て」で表した。
- source_word: הַלֻּחֹת
  choice: 石板
  rationale: 語自体は「板、書字板」だが、直前の32:16により石の板であることが明示されているため、日本語では対象を明確にする「石板」とした。
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: それを打ち砕いた
  rationale: שׁבר の破壊の強さを「打ち砕く」で表現した。複数の石板を受ける日本語の代名詞は自然な「それ」とした。
- source_word: תַּחַת הָהָר
  choice: 山のふもとで
  rationale: 地形を表す תַּחַת の文脈的意味を、現代日本語で自然な「山のふもと」とした。
theological_decisions: []
