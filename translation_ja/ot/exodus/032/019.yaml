revisions:
- from: 彼が宿営に近づき、あの子牛と踊り[a]を目にすると、モーセの怒りは燃え上がった。彼は手から石板を投げ捨て、山のふもとでそれを打ち砕いた。
  to: 彼が宿営に近づき、その子牛と踊り[a]を目にすると、モーセの怒りは燃え上がった。彼は手から石板を投げ、山のふもとでそれらを打ち砕いた。
  rationale: 定冠詞の指示性を自然な日本語で保つため「あの子牛」を「その子牛」に改めた。また、原語の動作を余分な含意なく表すため「投げ捨て」を「投げ」にし、複数の石板を受ける代名詞を「それら」と明示した。脚注は複数形という原文上の事項を正確に説明するよう整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:39:24Z'
