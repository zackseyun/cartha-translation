id: EXO.32.13
reference: Exodus 32:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: ja
  text: あなたのしもべであるアブラハム、イサク、イスラエル[a]を思い起こしてください。あなたは彼らに、ご自身にかけて誓い、こう言われました。「わたしはあなたがたの子孫を天の星のように増やす。わたしが語ったこの地をすべて、あなたがたの子孫に与える。彼らはそれを永遠に受け継ぐ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤコブ」とも呼ばれる族長。後にイスラエルという名を与えられた。ヘブライ語本文ではここに「イスラエル」とある。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: 思い起こしてください
  rationale: 神に向けられた男性単数の命令形。契約に基づくモーセの訴えを保ちつつ、現代日本語で自然な敬語表現とした。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: アブラハム、イサク、イスラエル
  rationale: 固有名を音写し、ヘブライ語本文どおり「ヤコブ」ではなく「イスラエル」を採用した。
- source_word: עֲבָדֶיךָ
  choice: あなたのしもべ
  rationale: ここでは社会的な奴隷身分より、神に属して仕える契約上の立場が中心であるため、「しもべ」とした。
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: あなたは彼らに、ご自身にかけて誓い
  rationale: בָּךְ が示す、神ご自身を保証として立てる誓いの再帰的な意味を明示した。
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: こう言われました
  rationale: 直接話法を自然に導入しながら、神への敬語を用いた。
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: わたしはあなたがたの子孫を…増やす
  rationale: רבה の増加させる意味と、集合的な זרע を現代日本語で明瞭に表した。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: 天の星のように
  rationale: 比喩を簡潔かつ荘重な日本語で保持した。
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: この地をすべて
  rationale: 指示性と全体性を保ち、約束の地を指す文脈に即して「地」とした。
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: わたしが語った
  rationale: 直訳的な「わたしが言った」より自然でありつつ、後続の「与える」を関係節へ取り込まず、原文の二つの節を分けて保った。
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: あなたがたの子孫に与える
  rationale: 未完了形の将来的な約束と、זרת の集合的意味を明瞭に表した。
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: 彼らはそれを永遠に受け継ぐ
  rationale: 日本語で必要な目的語「それ」を土地の文脈から補い、נחל の相続・継承の意味と לְעֹלָם の継続性を保った。
theological_decisions:
- issue: 族長の名を「イスラエル」とするか「ヤコブ」とするか
  choice: 本文では「イスラエル」を保持
  alternative: ヤコブ
  rationale: ヘブライ語本文は明確に「イスラエル」と記しており、契約名としての響きを翻訳上の置換で弱めないため。別名であることは脚注で説明した。
- issue: 誓いの表現 בָּךְ
  choice: ご自身にかけて
  alternative: あなたにかけて
  rationale: 神がご自身を誓いの保証とされたという再帰的意味を、日本語で誤解なく伝えるため。
- issue: אֲשֶׁר אָמַרְתִּי と אֶתֵּן の関係
  choice: 「わたしが語った」と「与える」を別の述語として保持
  alternative: わたしが与えると言った
  rationale: 後続節の内容を関係節に融合せず、原文の統語上の区別とわずかな不自然さを過度に解消しないため。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神への呼びかけには敬語を用い、契約上の語感を保つため「しもべ」「受け継ぐ」を採用した。引用内では神の一人称を「わたし」とした。脚注記号は説明対象である「イスラエル」の直後に置いた。
