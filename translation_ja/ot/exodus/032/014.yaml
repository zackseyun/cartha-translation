  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: ja
  text: そこで、ヤハウェは、ご自分の民に下すと告げておられた災いを下すことを、思いとどまられた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「思いを変えられた」「悔やまれた」とも訳せる。ここでは、先に告げた行動を取りやめる方向へ転じたことを表す。
    reason: alternative_reading
  - marker: b
    text: 直訳では「その悪」。ここでいう「悪」は道徳的な悪ではなく、下すと告げられた災厄を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: 思い直された
  rationale: ニファル形の נחם は、告げていた行動を取りやめる方向への転換を表す。「思い直す」は物語上の変化を明確にしつつ、後悔や誤りまでを断定しない自然な現代日本語である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を、称号に置き換えず音写する。
- source_word: עַל הָרָעָה
  choice: 災いを
  rationale: この文脈の רָעָה は道徳的な悪ではなく、民に下すと告げられた災厄を指す。日本語では「思い直す」の対象として助詞「を」を用いるのが自然である。
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: 下すと告げていた
  rationale: 直訳的には「行うと語っていた」。災いとの組み合わせでは「下す」が自然であり、先に告げられた行為であることを「告げていた」で表した。
- source_word: לְעַמּוֹ
  choice: ご自分の民に
  rationale: 脅かされた災いの被作用者を表す。「ご自分」は神への敬意を保ちながら所有関係を明確にする。
theological_decisions:
- issue: נחם による神の擬人的・情意的描写
  choice: 本文を「思い直された」とする。
  alternative: 「思いを変えられた」「悔やまれた」「災いを取りやめられた」
  rationale: 執り成しを受けて、告げられた行動に実際の転換が生じたという物語の緊張を保持する。神の可変性または不変性について本文以上の教理的説明を加えず、語の幅は脚注に示す。
- issue: הָרָעָה を神の道徳的悪と誤解する可能性
  choice: 「災い」と訳す。
  alternative: 「害」「悪」
  rationale: ここでは神がイスラエルに下すと告げた災厄を指し、神の道徳的悪を意味しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」により直前のモーセの執り成しへの応答を示した。敬語は過度に重くせず、「思い直された」「ご自分」で自然な敬意を表した。
