  text: וַ/יִּתְפָּֽרְקוּ֙ כָּל הָ/עָ֔ם אֶת נִזְמֵ֥י הַ/זָּהָ֖ב אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יָּבִ֖יאוּ אֶֽל אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: ja
  text: そこで、民は皆、耳に着けていた金の耳輪を外し、アロンのもとへ持って来た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外し」は、「引き外し」または「もぎ取って」とも訳せる。ヘブライ語の動詞には、力を加えて取り外す意味合いが含まれる場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: 外し
  rationale: ヒトパエル形が、自分たちの身に着けている装身具を取り外すことを表す。現代日本語として自然であり、文脈にもよく合う。語根には強く外す含みがあり得るため、脚注で補足する。
- source_word: כָּל הָעָם
  choice: 民は皆
  rationale: 集まった共同体の全体を集合的に指す。簡潔で自然な現代日本語とした。
- source_word: נִזְמֵי הַזָּהָב אֲשֶׁר בְּאָזְנֵיהֶם
  choice: 耳に着けていた金の耳輪
  rationale: נֶזֶם は耳や鼻に着ける輪形の装身具を指し得るが、ここでは「彼らの耳に」と明記されているため、「耳輪」が文脈上明確である。
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: アロンのもとへ持って来た
  rationale: 目的地を表す אֶל と「持って来る」を自然に表現した。目的語は日本語では文脈から明白なので繰り返さない。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で直前の命令に対する民の応答を示す。原語で一語の נֶזֶם と耳にあるという限定を、自然な「耳輪」にまとめた。
