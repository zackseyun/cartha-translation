  text: וַ/יִּקַּ֣ח מִ/יָּדָ֗/ם וַ/יָּ֤צַר אֹת/וֹ֙ בַּ/חֶ֔רֶט וַֽ/יַּעֲשֵׂ֖/הוּ עֵ֣גֶל מַסֵּכָ֑ה וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: ja
  text: アロンは彼らの手からそれを受け取り、刻む道具でそれを形作り[a]、鋳物の子牛像にした。すると彼らは言った[b]。「イスラエルよ、これらは、エジプトの地からあなたを導き上げたあなたの神々である[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「刻む道具で」と訳したヘブライ語の正確な意味については議論があり、「彫刻用の道具で」「鉄筆で」「のみで」などとも訳される。
    reason: lexical_alternative
  - marker: b
    text: 一部の本文伝承は「彼は言った」と読む。
    reason: textual_variant
  - marker: c
    text: ヘブライ語は複数形で「これらはあなたの神々である」。単一の子牛像に合わせて、伝統的に「これがあなたの神である」と訳されることも多い。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: 彼らの手からそれを受け取り
  rationale: לקח は「取る／受け取る」を意味する。目的語は前節の金を指すため「それ」とし、מִיָּדָם の表現も保った。
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: 彫刻用の道具で形作り
  rationale: יצר の意図的な造形を「形作る」で表した。חֶרֶט が指す具体的な道具は確定できないため、本文では過度に限定せず、注で異説を示した。
- source_word: עֵגֶל מַסֵּכָה
  choice: 鋳物の子牛像
  rationale: עֵגֶל は「子牛」、מַסֵּכָה は金属を鋳て作った像を表す。「鋳物の子牛像」は素材・製法と偶像としての性格を自然な日本語で伝える。
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: WLCのマソラ本文は複数形であり、民を主語とする読みを本文に採用した。単数形の異読は注に残した。
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: これらが、あなたの神々である
  rationale: 指示詞 אֵלֶּה、名詞形 אֱלֹהֶיךָ、後続の動詞はいずれも複数として読める形であるため、その緊張を単数の子牛像に合わせて解消せず、複数で訳した。
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地からあなたを導き上った
  rationale: עלה の使役形が持つ「上らせる／導き上る」という方向性と、מֵאֶרֶץ מִצְרָיִם の完全な表現を保った。
theological_decisions:
- issue: 単一の子牛像に対する複数形の宣言
  choice: 「これらが…あなたの神々である」と複数で訳す
  alternative: 「これが…あなたの神である」
  rationale: マソラ本文の複数形を優先し、単一の像との不一致を翻訳者が調和させない。これにより、本文にある修辞的・神学的緊張を保持する。
- issue: 偶像制作におけるアロンの主体性
  choice: 受け取り、形作り、子牛像にした主体をアロンとする
  alternative: アロンは金を集めただけ、または制作を監督しただけと含意する
  rationale: 一連の単数形動詞はアロンに直接行為を帰しているため、その責任を弱めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、語りの厳粛さを保った。「イスラエルよ」は呼びかけとして自然に配置した。ヘブライ語の動作順序を維持し、単一の像と複数形の宣言との緊張も本文に残した。
