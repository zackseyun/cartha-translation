  to: アロンは彼らの手からそれを受け取り、刻む道具でそれを形作り[a]、鋳物の子牛像にした。すると彼らは言った[b]。「イスラエルよ、これらは、エジプトの地からあなたを導き上げたあなたの神々である[c]。」
  rationale: 本文の統語順序、アロンの直接的な行為、そして偶像宣言の複数形を維持したまま、現代日本語としてより明確な『導き上げた』へ改めた。道具名は、争いのある חֶרֶט を特定の現代工具に固定しない『刻む道具』とし、可能な具体化は注に残した。注記アンカーは、それぞれ道具・発話者の異読・複数形宣言に対応している。
