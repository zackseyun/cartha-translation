revisions:
- from: しかしモーセは、自分の神ヤハウェに懇願して言った[a]。「ヤハウェよ、なぜあなたの怒りが、ご自分の民に向かって燃えるのですか。あなたが大いなる力と強い御手[b]をもってエジプトの地から導き出された民ではありませんか。」
  to: しかしモーセは、自分の神、ヤハウェに懇願し[a]、言った。「ヤハウェよ、なぜあなたの怒りが、大いなる力と強い御手[b]をもってエジプトの地からあなたが導き出された、あなたの民に向かって燃えるのですか。」
  rationale: 原文にない反語的な一文を削除し、「あなたが……導き出された」を「あなたの民」にかかる関係節として復した。これにより、モーセの問いの修辞性を保ちながら、ヘブライ語の統語と意味範囲を過不足なく反映する。脚注aのアンカーも、説明対象である「懇願し」に移した。
