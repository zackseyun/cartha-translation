source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: ja
  text: しかしモーセは、自分の神、ヤハウェに懇願し[a]、言った。「ヤハウェよ、なぜあなたの怒りが、大いなる力と強い御手[b]をもってエジプトの地からあなたが導き出された、あなたの民に向かって燃えるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「ヤハウェの顔を求めた」。好意を求めて切実に訴えることを表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 直訳「強い手」。「力ある御手」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: 懇願して
  rationale: 字義的には「顔を求めた」だが、相手の好意を切実に求めて訴える慣用句であるため、現代日本語として自然な「懇願して」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: אֱלֹהָיו
  choice: 自分の神
  rationale: 接尾辞がモーセを指すことを自然な日本語で明示し、単数の意味を保持した。
- source_word: יֶחֱרֶה אַפְּךָ
  choice: あなたの怒りが……燃える
  rationale: ヘブライ語の怒りを熱として表す比喩を保ちつつ、「鼻が燃える」という過度に字義的な表現は避けた。
- source_word: בְּעַמֶּךָ
  choice: ご自分の民に向かって
  rationale: 怒りの対象を示す前置詞を自然に表し、モーセが訴える契約的な帰属を強調した。
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: あなたが……導き出された民
  rationale: 神が民をエジプトから外へ出された救出行為を表す。日本語の関係節を後続の反語的表現に自然につないだ。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 「地」を省かず、原文の地理的表現と荘重な響きを保持した。
- source_word: בְּכֹחַ גָּדוֹל
  choice: 大いなる力をもって
  rationale: 手段を示す בְּ を「もって」で表し、גָּדוֹל の強調を「大いなる」によって保持した。
- source_word: וּבְיָד חֲזָקָה
  choice: 強い御手
  rationale: חֲזָקָה を「強い」と直接的に訳し、神の「手」は敬意を伴う慣用的な「御手」とした。
theological_decisions:
- issue: 神の怒りに関する擬人的比喩
  choice: 「あなたの怒りが……燃える」
  alternative: 「あなたがお怒りになる」
  rationale: 原文の熱の比喩と訴えの切迫感を残し、神の怒りを抽象化しすぎないようにした。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号に置換せず、読者に見える形で保持した。
- issue: לָמָה を用いたモーセの訴え
  choice: 「なぜ……燃えるのですか。……民ではありませんか」
  alternative: 単純な理由の質問として「なぜ怒るのですか」
  rationale: 文脈上の執り成しと修辞的な訴えを自然な日本語で表しつつ、モーセと神の応答関係が持つ神学的緊張を解消しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神への呼びかけと出エジプトの定型表現には「大いなる」「御手」「もって」を用いて適度な威厳を保った。モーセの問いは自然な敬語と反語で表した。
