  terminology: ヤハウェ、自分の神、怒りが燃える、エジプトの地、大いなる力、強い御手はいずれも原文とプロジェクトの語彙方針に適合する。脚注aは慣用句全体、脚注bは「強い御手」の代替訳を適切に示す。
