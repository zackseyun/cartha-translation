source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַהֲרֹ֔ן אַל יִ֥חַר אַ֖ף אֲדֹנִ֑/י אַתָּה֙ יָדַ֣עְתָּ אֶת הָ/עָ֔ם כִּ֥י בְ/רָ֖ע הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: ja
  text: アロンは言った。「わが主人よ、どうか怒りを燃え上がらせないでください。あなたは、この民が悪に傾いていることをご存じです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪に染まっている」または「悪に走りやすい」。ヘブライ語は慣用的な表現で、この民が悪によって特徴づけられていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: アロンは言った
  rationale: ヘブライ語の物語叙述に沿って、応答を自然な現代日本語で表した。接続詞וַは文脈上、日本語では明示しなくても流れが保たれる。
- source_word: אַל יִחַר אַף
  choice: どうかお怒りを燃え上がらせないでください
  rationale: 怒りが燃えるという原文の比喩を保ちつつ、嘆願として自然で丁重な日本語にした。
- source_word: אֲדֹנִי
  choice: わが主よ
  rationale: ここでは神への称号ではなく、アロンがモーセに向けた敬意ある呼びかけ。神的称号との混同を避けつつ、上下関係を伴う敬称を保持した。
- source_word: אַתָּה יָדַעְתָּ
  choice: あなたは……ご存じです
  rationale: 独立代名詞אַתָּהによる主語の明示を「あなたは」で反映し、モーセへの敬意に合う敬語を用いた。強意を過度に加える「あなたご自身」は避けた。
- source_word: הָעָם
  choice: この民
  rationale: 定冠詞付きの集合名詞で、直前から問題となっているイスラエルの民を指すため、日本語では文脈指示を明確にする「この民」とした。
- source_word: כִּי בְרָע הוּא
  choice: 悪に傾いていること
  rationale: 字義的には「それは悪の中にある」に近い慣用的表現。民を集合的単数で捉え、その悪への性向・特徴を自然な日本語で表した。
theological_decisions:
- issue: אֲדֹנִיが人間への呼びかけであること
  choice: わが主よ
  alternative: ご主人様／あなた様
  rationale: 呼びかけの相手はモーセであり、神を指す固有の称号としては訳さない。一方で、単なる「あなた」より原文の敬意と服従的な響きを保つ。
- issue: 民と悪との関係を表す慣用句בְרָע הוּא
  choice: 悪に傾いている
  alternative: 悪に染まっている／悪を行おうとしている
  rationale: 原文は具体的な一行為だけでなく民の特徴的傾向を述べるが、生得的性質などの教理的断定までは明示しないため、その幅を保った。
translation_notes:
  register: 明瞭で現代的ながら威厳ある標準日本語。アロンからモーセへの敬意は「わが主よ」「ご存じです」で示し、怒りが燃えるというヘブライ語の比喩を保持した。
