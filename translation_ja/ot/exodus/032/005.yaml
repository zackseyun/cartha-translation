base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: ja
  text: アロンはそれを見ると[a]、その前に祭壇を築いた。そしてアロンは呼びかけて言った。「明日はヤハウェへの祭りである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アロンが見ると」とも訳せる。原文では「見た」の目的語は明記されておらず、本文の「それ」は文脈から補った。また、「その前に」の「その」は、文法上はアロンを指す可能性もあるが、文脈上は子牛を指すと考えられる。
    reason: 原文で省略された目的語と、男性単数接尾辞の指示対象に関する曖昧さを示すため。
lexical_decisions:
- source_word: וַיַּרְא
  choice: アロンはそれを見ると
  rationale: 動詞の基本義「見る」を保ち、目的語は直前の文脈にある子牛を指すものとして「それ」を補った。接続形の物語的・時間的な流れは「見ると」で自然に表した。
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: 祭壇を築いた
  rationale: בנהとמזבחの通常の組み合わせを、現代日本語で自然かつ荘重な「祭壇を築く」とした。
- source_word: לְפָנָיו
  choice: その前に
  rationale: 男性単数接尾辞の指示対象を日本語でも明示しすぎず、文脈上は子牛を指す「その」とした。文法上アロンを指す可能性は脚注に残した。
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: 呼びかけて言った
  rationale: קראの公的な告知の含みと、後続するאמרをともに反映した。日本語では多少重なりがあるが、原文の二動詞を保持する。
- source_word: חַג
  choice: 祭り
  rationale: 礼拝・祭儀的なחַגを、一般読者に明瞭で自然な「祭り」とした。「巡礼祭」は本文だけでは限定が強すぎる。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לの献献・帰属の関係を「への」で表し、神名יהוהは固有名として「ヤハウェ」と音写した。
- source_word: מָחָר
  choice: 明日は
  rationale: 動詞のない名詞文を、日本語で簡潔な「明日は……である」として告知の内容を明瞭にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が四文字神名を直接用いているため、称号へ置き換えず、広く用いられる学術的な音写「ヤハウェ」とした。
- issue: לְפָנָיוの代名詞の指示対象
  choice: 文脈上、子牛を指す「その前に」
  alternative: アロンの前に
  rationale: 接尾辞は文法上アロンを指すことも可能だが、直前に造られた子牛の前に祭壇を築くという理解が物語の流れに最もよく合う。別の可能性は脚注で明示した。
- issue: ヤハウェへの祭りと子牛像との緊張
  choice: 原文どおり「ヤハウェへの祭り」
  alternative: 偶像への祭りなどと解釈的に言い換える
  rationale: アロン自身の告知はヤハウェの名を用いており、子牛像を前にしながらヤハウェへの祭りと称する本文の神学的緊張を解消せずに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「祭壇を築いた」「である」によって聖書本文にふさわしい落ち着いた格調を保った。原文の「呼びかけて言った」は簡略化せず、告知行為と発言導入の双方を反映した。
