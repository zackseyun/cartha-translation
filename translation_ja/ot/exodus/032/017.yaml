  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: ja
  text: ヨシュアは、民が叫ぶ声を聞くと[a]、モーセに言った。「宿営で戦いの音がする。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民の騒ぐ音を聞くと」。ヘブライ語は、民が上げる大きな叫び声、または騒然とした物音を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 聞くと
  rationale: 物語の進行の中で、耳に入った音を知覚したことを表す。後続の発言へ自然につなぐため「聞くと」とした。
- source_word: יְהוֹשֻׁעַ
  choice: ヨシュア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: קוֹל הָעָם בְּרֵעֹה
  choice: 民が叫ぶ声
  rationale: קוֹלはここでは発話内容より聞こえる声・物音を指し、בְּרֵעֹהは大声を上げることを表す。集合名詞עָםと単数形の接尾辞との対応を、日本語では自然な主語述語関係にした。騒然とした物音という解釈も可能なので脚注を付した。
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: モーセに言った
  rationale: 標準的な物語上の発話導入として訳した。人名は日本語で定着した表記による。
- source_word: קוֹל מִלְחָמָה
  choice: 戦いの音
  rationale: 構文を保ちつつ、מִלְחָמָהをこの場面で聞こえる戦闘の響きとして自然な「戦い」とした。
- source_word: בַּמַּחֲנֶה
  choice: 宿営の中から
  rationale: 場所を表すבְּを、ヨシュアが外から音を聞いている場面に即して、日本語では音の発生源を自然に示す「中から」と訳した。
