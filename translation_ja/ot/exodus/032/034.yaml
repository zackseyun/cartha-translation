  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: ja
  text: しかし今、行って、わたしがあなたに告げた所へ民を導け。見よ、わたしの使いがあなたの前を行く。だが、わたしが彼らに責任を問う日には、彼らの罪について責任を問う。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: しかし今
  rationale: 直前の執り成しへの応答としての転換を「しかし」で示しつつ、「今」を保持した。
- source_word: נְחֵה
  choice: 導け
  rationale: 民を目的地へ率いることを命じる使役的な意味を、自然で端的な命令形で表した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 後続の約束に注意を促す提示表現を、聖書的な威厳を保ちながら明示した。
- source_word: מַלְאָכִי
  choice: わたしの使い
  rationale: 語義上は「使者」と「御使い」の幅があるため、存在の性格を過度に限定しない「使い」とした。
- source_word: פָּקַדְתִּי / פָקְדִי
  choice: 問いただす／問いただす
  rationale: פקד は訪れる、顧みる、処罰する、責任を問う等の幅を持つ。ここでは罪に関する裁きの文脈を示しつつ、単純に「罰する」と限定しすぎない表現を選び、同語反復も保持した。
theological_decisions:
- issue: 「わたしの使い」の正体
  choice: 「わたしの使い」とし、特定の天使・神的顕現・別の存在とは断定しない
  alternative: 「わたしの御使い」「わたしの天使」
  rationale: 原文は מַלְאָכִי とだけ述べ、その存在の詳しい正体をこの節では確定していないため、曖昧さを保った。
- issue: פקד の裁きの強さ
  choice: 「問いただす」
  alternative: 「罰する」「報いる」
  rationale: 罪への裁きと責任追及を伝えつつ、語の意味領域を処罰だけに狭めない。反復による厳粛さも残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の直接命令と裁きの宣言にふさわしい簡潔で荘重な調子を保った。「見よ」は提示表現として残し、文全体は一般読者にも理解できる語彙にした。
