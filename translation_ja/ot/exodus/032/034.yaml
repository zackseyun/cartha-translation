  to: しかし今、行って、わたしがあなたに告げた所へ民を導け。見よ、わたしの使いがあなたの前を行く。だが、わたしが彼らに責任を問う日には、彼らの罪について責任を問う。
  rationale: 後半の反復を「責任を問う」で統一し、פקדがこの文脈で担う裁き・責任追及の意味を明瞭にした。「罰する」として処罰に限定せず、原文および英語監査訳の意図する意味の幅を保つ。他の箇所は原文に忠実で自然なため維持した。
