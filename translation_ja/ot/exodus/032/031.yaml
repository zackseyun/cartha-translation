  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: ja
  text: モーセはヤハウェのもとに戻り、言った。「どうか、この民は大きな罪を犯し、自分たちのために金の神々[a]を造りました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちのために金の神を造りました」とも訳せる。ヘブライ語は字義どおりには複数形で「金の神々」だが、前後の文脈から、一体の金の子牛を指すものとして単数に理解する人もいる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 戻って
  rationale: שׁוב の方向性と、民のもとからヤハウェのもとへ再び行くという文脈を、自然な現代日本語で表した。
- source_word: אֶל יְהוָה
  choice: ヤハウェのもとに
  rationale: 前置詞 אֶל の方向性を「のもとに」で表し、固有の神名 יְהוָה はヤハウェと音写した。
- source_word: אָנָּא
  choice: ああ
  rationale: 嘆願を帯びた間投詞であり、次節へ続くモーセの切実な執り成しの調子を保つ。「どうか」だけでは日本語の文が不自然に宙づりになるため、ここでは「ああ」とした。
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: この民は大きな罪を犯し
  rationale: 動詞 חטא と同根の名詞 חטאה を用いる強意的な表現を、日本語として自然な「大きな罪を犯す」で表した。הָעָם は集合的単数なので「この民」とした。
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: 自分たちのために…造りました
  rationale: לָהֶם の受益・再帰的な含みを「自分たちのために」で明示し、モーセがヤハウェに語る敬意を丁寧体で表した。
- source_word: אֱלֹהֵי זָהָב
  choice: 金の神々
  rationale: 原文の複数構文をそのまま保った。周囲の物語では一体の金の子牛が中心だが、その文脈によって本文の複数形を黙って単数化しない。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に現れる契約の神名を固有名として示し、一般名詞・称号である「主」へ置き換えなかった。
- issue: אֱלֹהֵי זָהָב の数
  choice: 金の神々（複数）
  alternative: 金の神（一体）
  rationale: 物語の広い文脈は金の子牛一体を指すように読める一方、当該句の文法形式は複数である。その緊張を本文と脚注によって保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。モーセの発言はヤハウェへの呼びかけなので丁寧体とし、本文の簡潔さ、嘆願の調子、原文にある複数形と文脈上の単数理解との緊張を保った。
