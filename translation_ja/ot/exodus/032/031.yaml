    issue: אָנָּא is rendered 「ああ」.
    rationale: אָנָּא functions here as an entreaty, equivalent to 'please' or 'I pray.' 「ああ」 can mark emotion but does not convey Moses' plea. 「どうか」 is both faithful and idiomatic.
  - severity: low
