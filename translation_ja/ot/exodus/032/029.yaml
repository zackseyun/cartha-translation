source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה מִלְא֨וּ יֶדְ/כֶ֤ם הַ/יּוֹם֙ לַֽ/יהוָ֔ה כִּ֛י אִ֥ישׁ בִּ/בְנ֖/וֹ וּ/בְ/אָחִ֑י/ו וְ/לָ/תֵ֧ת עֲלֵי/כֶ֛ם הַ/יּ֖וֹם בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: ja
  text: モーセは言った。「今日、主に身をささげなさい。[a] あなたがたはそれぞれ、自分の息子や兄弟に立ち向かったのだから。こうして今日、あなたがたに祝福が授けられる。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「今日、主のためにあなたがたの手を満たしなさい」。これは任職や聖別に関わるヘブライ語の慣用句であり、ここでは主の務めのために身をささげることを指すとも理解される。
    reason: 原文の慣用句を示しつつ、正式な職への任命に限定されない解釈の幅を保つため。
  - marker: b
    text: 「こうして」は「そうすれば」または「そのために」とも訳しうる。祝福を与える主体は原文では明示されていないが、文脈上は主と理解される。
    reason: 接続関係と、不定詞「与える」の主語に関する原文上の曖昧さを保存するため。
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: 自らを任職しなさい
  rationale: 直訳は「あなたがたの手を満たしなさい」だが、祭司職への任命・聖別を表すヘブライ語の慣用句として理解される。ここではレビ人が主の務めに身をささげる文脈を、現代日本語で簡潔に示した。
- source_word: לַיהוָה
  choice: 主のために
  rationale: 前置詞 ל の献身・奉仕の方向を「ために」で表し、神名 יהוה は日本語聖書で広く通用する「主」とした。
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: あなたがたはそれぞれ、自分の息子や兄弟にさえ立ち向かったのだから
  rationale: 動詞が省略された簡潔な句を直前の行為から補い、ב の対抗的用法を「立ち向かった」とした。「さえ」は肉親を相手にした厳しさを自然な日本語で示す。
- source_word: בְּרָכָה
  choice: 祝福
  rationale: 神から授けられる恩恵を指す通常の訳語を用いた。
theological_decisions:
- issue: 「手を満たす」という表現が正式な祭司叙任を意味するか、主への献身を意味するか
  choice: 「任職」と訳し、注で直訳と献身の含意を示す
  alternative: 「今日、主に身をささげなさい」または「あなたがたの手を満たしなさい」
  rationale: 同じ慣用句は出エジプト記で祭司の任職に使われる一方、この箇所がレビ人全体の正式な祭司叙任を述べるかは断定しにくい。本文は慣用的意味を取りつつ、注で幅を保った。
- issue: 祝福を授ける主体
  choice: 受動表現「祝福が授けられる」で明示しない
  alternative: 「主があなたがたに祝福を授けてくださる」
  rationale: 原文の不定詞 לָתֵת には明示された主語がない。文脈上は主が主体と理解されるが、訳文では原文の省略を保った。
- issue: 息子や兄弟に対する行為の評価
  choice: 「立ち向かった」として行為を描写する
  alternative: 「息子や兄弟を殺した」
  rationale: 原文自体にはこの節で「殺す」という動詞がなく、前節の行為を受けた省略表現であるため、明示的な語を過剰に補わなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「任職」はやや専門的だが、祭司的文脈を損なわないため本文に採用し、脚注で平易に説明した。「にさえ立ち向かった」により、肉親より主への忠誠を優先した文脈を示しつつ、原文にない「殺した」を本文へ補わないようにした。
