  terminology: 「ヤハウェ」「宿営」「剣を腰に帯びよ」は適切です。「兄弟」「仲間」は原語の関係語の並列を自然に保っています。קְרֹבוֹ は「近しい者」とし、脚注で「近親者」等の語義可能性を明示します。
