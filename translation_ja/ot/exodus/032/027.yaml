id: EXO.32.27
reference: Exodus 32:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: ja
  text: モーセは彼らに言った。「イスラエルの神ヤハウェはこう言われる。各自、剣を腰に帯びよ。宿営の中を門から門へ行き来し、おのおの自分の兄弟を、自分の仲間を、自分の近しい者[a]を殺せ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「近い者」。『近親者』『近い親族』とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: モーセは彼らに言った
  rationale: 日本語では主語を補うと文脈が明確になる。直前の話者であるモーセを明示し、物語の連続を自然に表した。
- source_word: כֹּה אָמַר
  choice: こう言われる
  rationale: 神の権威ある告知を示す定型句。引用内の現在的な宣言として、自然で荘重な日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、神の固有名を音写した。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: イスラエルの神
  rationale: 連語を簡潔かつ直接的に訳した。
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: 各自、剣を腰に帯びよ
  rationale: 字義的な『腿の上に置く』は武装することを表す慣用句であり、日本語では『腰に帯びる』が自然で正確。分配的な אִישׁ は『各自』で保持した。
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: 行き巡り
  rationale: 二つの命令は宿営内を往来する動作を表す。機械的な『通って戻れ』より、文脈上の反復的な移動を自然に示す。
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: 宿営の中を門から門へ
  rationale: 移動の範囲と経路を日本語の自然な語順で表した。
- source_word: וְהִרְגוּ
  choice: 殺せ
  rationale: 動詞の直接的で厳しい意味を弱めずに訳した。
- source_word: אִישׁ אֶת אָחִיו
  choice: それぞれ自分の兄弟を
  rationale: 分配的な אִישׁ と、身近な関係にある者への命令の衝撃を保持した。
- source_word: רֵעֵהוּ
  choice: 自分の仲間を
  rationale: 友人だけに限定せず、身近な同伴者・同輩を表し得る語として『仲間』を選んだ。
- source_word: קְרֹבוֹ
  choice: 自分の近親者を
  rationale: קרב に由来し、『近い者』、特に血縁上近い者を指し得るため、文脈では『近親者』が適切。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有名が明記されているため、称号へ置換せず音写した。
- issue: אִישׁ の反復と分配性
  choice: 各自／それぞれ自分の
  alternative: みな／互いに
  rationale: 命令が一人ひとりに課される原文の分配的意味を保持し、『互いに』のような相互性を加えなかった。
- issue: קְרֹבוֹ の関係範囲
  choice: 近親者
  alternative: 近しい者／隣人
  rationale: 語義には近い者一般の幅があるが、『兄弟』『仲間』に続く列挙では血縁的に近い者という理解が有力。意味範囲を注で過度に固定する必要はないと判断した。
translation_notes:
  register: 現代標準日本語による、明瞭で荘重な命令文。暴力的内容は原文どおり直接表現し、婉曲化しない。神名は『ヤハウェ』、武装の慣用句は自然な『剣を腰に帯びよ』とした。
