revisions:
- from: モーセは彼らに言った。「イスラエルの神、ヤハウェはこう言われる。各自、剣を腰に帯びよ。宿営の中を門から門へ行き巡り、それぞれ自分の兄弟を、自分の仲間を、自分の近親者を殺せ。」
  to: モーセは彼らに言った。「イスラエルの神ヤハウェはこう言われる。各自、剣を腰に帯びよ。宿営の中を門から門へ行き来し、おのおの自分の兄弟を、自分の仲間を、自分の近しい者[a]を殺せ。」
  rationale: 神名、武装の慣用表現、命令の直接性、そして分配的な「各自／おのおの」は維持した。「近親者」をより広い「近しい者」に改め、原語の語義範囲は注で示した。また、移動命令を「行き来し」として往復の意味を明確にした。
