    text: 別訳「引きちぎって外しなさい」。ヘブライ語の動詞は、装飾品を力ずくで外す、または引きちぎることを示す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: アロンは彼らに言った
  rationale: 物語を進める接続形は、日本語では文脈上自然なため接続語を補わず、明示された代名詞 אֲלֵהֶם は「彼らに」と保持した。
- source_word: פָּרְקוּ
  choice: 外し
  rationale: 身に着けた装飾品を取り外す文脈に合う自然な表現。「引きちぎる」にもなり得る強い語感は脚注に残した。
- source_word: נִזְמֵי הַזָּהָב
  choice: 金の耳輪
  rationale: נֶזֶם は鼻輪または耳輪を指し得るが、直後に「耳にある」と明記されるため、ここでは日本語として明瞭な「耳輪」とした。素材を表す הַזָּהָב は「金の」と訳した。
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: 耳にある
  rationale: 前置詞 בְּ の位置関係を簡潔かつ自然に表し、装飾品が耳に着けられていることを示した。
- source_word: נְשֵׁיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: あなたがたの妻、息子、娘たち
  rationale: 家族関係と、息子・娘を明示する原文の区別を保持した。
- source_word: וְהָבִיאוּ אֵלָי
  choice: 私のところへ持って来なさい
  rationale: 命令の力を保ち、目的地を表す אֵלַי を自然な現代日本語で表現した。目的語は先行する「耳輪」から明白なので省略した。
