  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: ja
  text: 民は、モーセが山からなかなか下りて来ないのを見て、アロンのもとに集まり、彼に言った。「さあ、私たちのために、私たちの先に立って進む神々[a]を造ってくれ。私たちをエジプトの地から導き上げた、あのモーセという人がどうなったのか、私たちには分からないからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの先に立って進む神」とも訳せる。この後の物語が一体の子牛像に焦点を当てるため、「神」を単数と理解する見方もある。しかし、ヘブライ語では「神々」に当たる語も、それに続く「進む」という動詞も複数形である。
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: なかなか下りて来ない
  rationale: 遅れている、長くかかっているという民の認識を、自然な現代日本語で表す。
- source_word: לָרֶדֶת מִן הָהָר
  choice: 山から下りて来る
  rationale: 山上にいるモーセが民のいる所へ下るという方向性を明確にした。
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: アロンのもとに集まり
  rationale: עַל が帯び得る圧力の含みを過度に敵対的な表現へ限定せず、集合の場面を自然に示す。
- source_word: קוּם
  choice: さあ
  rationale: 直訳的な「立て」よりも、相手に行動を迫る談話上の機能を自然な日本語で表す。
- source_word: עֲשֵׂה לָנוּ
  choice: 私たちのために造ってください
  rationale: 受益者を示す לָנוּ を明示しつつ、民がアロンに要求する発話として日本語を整えた。
- source_word: אֱלֹהִים אֲשֶׁר יֵלְכוּ
  choice: 先立って進む神々
  rationale: 名詞の複数形と、それを受ける動詞の複数形を主本文に反映した。
- source_word: הָאִישׁ
  choice: あのモーセという人
  rationale: זֶה מֹשֶׁה הָאִישׁ の距離を置いた、やや突き放す響きを自然な日本語で保った。
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: 私たちをエジプトの地から導き上った
  rationale: עלה の上昇方向を「上った」で保ちつつ、使役形を自然な他動表現にした。
- source_word: מֶה הָיָה לוֹ
  choice: どうなったのか
  rationale: モーセの身に起きたことや消息を問うヘブライ語の慣用句を、簡潔な現代日本語で表した。
theological_decisions:
- issue: אֱלֹהִים を単数と複数のどちらで訳すか
  choice: 複数の「神々」
  alternative: 単数の「神」
  rationale: 直後の動詞 יֵלְכוּ も複数形であるため、本文は文法的一致に従う。一方、物語が一体の子牛像に焦点を当てることから単数に理解する余地もあり、脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ格調を保った標準日本語。「神々／神」の真正な曖昧さは主本文で文法上の複数を採り、脚注で単数解釈を示した。
