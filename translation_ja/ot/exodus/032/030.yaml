source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: ja
  text: 翌日、モーセは民に言った。「あなたがたは大きな罪を犯した。[a] 今、私はヤハウェのもとへ上って行く。もしかすると、あなたがたの罪のために贖いができるかもしれない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「罪を犯す」という動詞と「罪」という名詞が同じ語根で重ねられており、罪の重大さが強調されている。
    reason: 原文の同語根目的語による強調を、無理な逐語訳を用いず明瞭な現代日本語で説明するため。
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 翌日
  rationale: ヘブライ語の物語進行と時間的連続を、現代日本語で自然かつ簡潔に表す。וַיְהִיを独立して「そして、起こった」と訳すより、日本語では「翌日」と場面を始めるほうが自然である。
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: モーセは民に言った
  rationale: אמר אלの標準的な発話表現を、明瞭で自然な日本語にした。
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: あなたがたは大きな罪を犯した
  rationale: 明示された二人称複数אַתֶּםを「あなたがた」で保ち、同語根を重ねる強調表現は、自然な日本語の「大きな罪を犯した」で重大性を伝える。
- source_word: וְעַתָּה
  choice: そこで今
  rationale: 告発からモーセの次の行動への移行を示す接続性と時間性の双方を表す。
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: 私はヤハウェのもとへ上って行く
  rationale: עלהの上方への移動を「上って行く」で示し、אלは単なる方向だけでなく相手のもとへ向かうこととして自然に表現した。神名יהוהは固有名「ヤハウェ」とした。
- source_word: אוּלַי
  choice: もしかすると…かもしれない
  rationale: モーセの期待を伴う不確実性を明確に保ち、結果を保証する表現を避ける。
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: あなたがたの罪のために贖いをすることができる
  rationale: כפרのピエル形を、この祭儀的・執り成し的文脈にふさわしい「贖いをする」とし、בעדを「…のために」と訳した。אוּלַיとの組み合わせによる可能性を「ことができるかもしれない」で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された四文字神名を称号に置き換えず、固有名として音写する。
- issue: モーセによる贖いの成否
  choice: もしかすると…贖いをすることができるかもしれない
  alternative: 贖いをすることができよう
  rationale: אוּלַיが示す不確実性を保ち、モーセの執り成しが必ず有効になるとは断定しない。
- issue: כפרの意味
  choice: 贖いをする
  alternative: 罪を償う／赦しを得る
  rationale: モーセ自身が罪の代価を償う、または赦しを確実に獲得する、と本文以上に限定せず、כפרの祭儀的・神学的広がりを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法の厳粛さを保った。「贖い」は一般語よりやや宗教的だが、כפרの文脈上の重みと曖昧さを保持するため採用した。
