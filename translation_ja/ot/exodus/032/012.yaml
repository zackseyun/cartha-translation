  - severity: low
    issue: 「災いを思い直してください」の結び付き
    rationale: 日本語では「災いについて思い直してください」または「災いを下すことを思い直してください」のほうが自然であり、עַל הָרָעָהの「その災いに関して」の関係を明確にする。
