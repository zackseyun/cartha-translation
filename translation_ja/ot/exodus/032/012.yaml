base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: ja
  text: なぜエジプト人に、「彼が悪意をもって彼らを連れ出したのは、山々で彼らを殺し、地の上から彼らを滅ぼし尽くすためだったのだ」と言わせるのですか。[a] 燃える怒りから立ち返り、あなたの民に下そうとしている災いについて思い直してください。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「なぜエジプト人が言うのでしょうか」。ここでは、そう言う機会を与えないでほしいというモーセの訴えを表しています。
    reason: 原文の修辞疑問と日本語本文の使役的表現の関係を示すため。
  - marker: b
    text: 「災いを下すのをやめてください」、または「その災いについて翻意してください」とも訳せます。原文は、モーセが神に思い直すよう願う、人間的な関係表現を用いています。
    reason: 神について用いられたנחםの意味の幅と神学的緊張を明示するため。
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: なぜエジプト人にこう言わせるのですか
  rationale: 文脈上の修辞的な訴えを自然な現代日本語で表し、未完了形の含意も保つ。
- source_word: בְּרָעָה
  choice: 悪意をもって
  rationale: エジプト人が神に帰する悪しき意図・目的を明確に表す。
- source_word: הוֹצִיאָם
  choice: 彼らを連れ出し
  rationale: 使役形と出エジプトの文脈を簡潔に表す。
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: 山々で殺し
  rationale: 目的を示す不定詞と複数形の「山々」を直接的に訳す。
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: 地の面から彼らを滅ぼし尽くそうとした
  rationale: כלהの徹底的な滅亡という意味と、ヘブライ語の慣用表現を保持する。
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: 燃える怒りから立ち返り
  rationale: 怒りの熱を表す比喩と、進路を転じるよう求める命令の力を保つ。
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: あなたの民に下そうとしている災いを思い直してください
  rationale: נחםの人間関係的な訴えを自然に表し、רעהを道徳的悪ではなく迫る災厄として訳す。לְは災いの対象を示す。
theological_decisions:
- issue: וְהִנָּחֵםによる神についての擬人的・情意的表現
  choice: 思い直してください
  alternative: 翻意してください／災いを下すのをやめてください
  rationale: モーセの訴えの実質を弱めず、神が道徳的過ちを悔いるとの含意は避ける。「思い直す」は原文の緊張を残す。
- issue: 神が下そうとするהָרָעָהの意味
  choice: 災い
  alternative: 害／わざわい／悪
  rationale: 裁きとしての破局を示しつつ、神に道徳的悪を帰すとの誤解を避ける。前半のבְּרָעָהは意図を指すため「悪意」と訳し分ける。
translation_notes:
  register: 明瞭で現代的ながら礼節ある祈願調。「滅ぼし尽くす」「地の面」など、原文の強さと比喩は保った。引用内の主語「彼」はエジプト人が語る神を指す。
