revisions:
- from: なぜエジプト人にこう言わせるのですか。[a]『彼は悪意をもって彼らを連れ出し、山々で殺し、地の面から彼らを滅ぼし尽くそうとしたのだ』と。燃える怒りから立ち返り、あなたの民に下そうとしている災いを思い直してください。[b]
  to: なぜエジプト人に、「彼が悪意をもって彼らを連れ出したのは、山々で彼らを殺し、地の上から彼らを滅ぼし尽くすためだったのだ」と言わせるのですか。[a] 燃える怒りから立ち返り、あなたの民に下そうとしている災いについて思い直してください。[b]
  rationale: 目的を表すヘブライ語不定詞を「…ためだった」と明示し、過去の未遂を示し得る含意を除きました。後半は「災いについて思い直してください」として、原文の「その災いに関して撤回する／思い直す」という訴えを自然な現代日本語で保ちました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:39:23Z'
