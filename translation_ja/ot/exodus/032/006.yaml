base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: ja
  text: 翌日、彼らは早く起きて、全焼のささげ物を献げ、平和のいけにえを差し出した。それから民は座って食べ、飲み、立ち上がって戯れた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「遊んだ」「騒ぎ楽しんだ」。ヘブライ語の動詞は、笑う、遊ぶ、戯れるなどを意味しうる。ここでは金の子牛をめぐる文脈から、無邪気な遊びではなく、無秩序な祝祭を含む可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: 翌朝、彼らは早く起き
  rationale: שׁכםのヒフィル形が示す「早く起きる」と、מִמָּחֳרָתの「翌日」を、自然な現代日本語で時間的強調を保って表した。
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: 全焼のささげ物を献げ
  rationale: עֹלָהは祭儀用語として、全体を焼いて献げる犠牲を指す。「全焼のささげ物」は内容が分かりやすく、עלהとの結びつきも「献げる」で自然に表せる。
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: 会食のいけにえを差し出した
  rationale: נגשׁの「近づける、差し出す」を保ちつつ、שְׁלָמִיםを、献げた者も共に食する犠牲祭儀として分かりやすく表した。「和解のいけにえ」より、語源的意味を過度に限定しない。
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: 民は座って食べたり飲んだりし
  rationale: ישׁבの「座る」と、二つの不定詞が表す飲食の活動を、物語の流れに合う自然な日本語にした。
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: 立って戯れた
  rationale: צחקは「笑う、遊ぶ、戯れる、騒ぎ楽しむ」など幅がある。「戯れる」は意図的な乱痴気騒ぎや性的行為まで本文だけで断定せず、文脈上の不穏な含みも残す。脚注で語義の幅を示した。
theological_decisions:
- issue: 金の子牛の場面における לְצַחֵק の含意
  choice: 本文を「戯れた」とし、文脈上は放縦な祝祭を含み得ることを脚注で示す
  alternative: 「騒ぎ楽しんだ」「遊んだ」「乱痴気騒ぎをした」
  rationale: 偶像祭儀とその後の裁きは無邪気な遊び以上の含みを示唆する一方、この節だけから性的乱行などを明示するのは解釈過剰となる。曖昧さと否定的緊張を保った。
- issue: שְׁלָמִים の祭儀名称
  choice: 会食のいけにえ
  alternative: 和解のいけにえ／交わりのささげ物／酬恩祭
  rationale: 語が指す祭儀の共同飲食的性格を普通の読者に伝えつつ、「和解」という特定の神学的意味に限定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀語は意味が一般読者に伝わる表現を選び、צחקの語義的・神学的曖昧さは本文と脚注の組み合わせで保持した。
