  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: ja
  text: そこでヤハウェは、アロンが造った子牛をめぐって民が行ったことのために、民を打った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこでヤハウェは、アロンが造った子牛をめぐって民が行ったことのために、民に災いを下した」。ヘブライ語の動詞は一般に「打つ」と訳せるが、災厄的な打撃を表すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: 災いで打った
  rationale: נָגַףは「打つ、災いを下す」の意味を持ち、ここでは神の裁きとしての災厄を表す。「災いで打った」は、死者が出たとまでは限定せず、動詞の打撃性と災厄の含意を自然な日本語で示す。ただし原文には「災い」に当たる独立した名詞がないため、脚注により一般的な訳も示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写する。
- source_word: הָעָם
  choice: 民
  rationale: ここではイスラエルの共同体を集合的に指すため、簡潔で聖書本文にふさわしい現代日本語の「民」とする。
- source_word: עַל אֲשֶׁר
  choice: …ことのゆえに
  rationale: 前置詞と関係節が示す原因・理由を保ち、格調を保ちながら理解しやすく表す。
- source_word: עָשׂוּ
  choice: 行った
  rationale: 動詞עָשָׂהは「造る」とも訳せるが、後続節ではアロンが子牛を造ったことが明記される。複数主語である民の責任を、子牛に関して「行ったこと」と訳して不自然な重複と、民自身が子牛を製作したとの過度な限定を避ける。
- source_word: הָעֵגֶל
  choice: 子牛
  rationale: 語の直接的な意味を採る。「金の」は周辺文脈では明らかだが、この節にはないため補わない。
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: アロンが造った
  rationale: 子牛を特定する関係節として素直に訳し、アロンが製作したという本文の責任帰属を保つ。
theological_decisions:
- issue: וַיִּגֹּףが表す神の裁きの性質
  choice: 「災いで打った」とし、災厄を伴う神の打撃として表す。
  alternative: 「打った」または「災いを下した」
  rationale: この動詞は神による疫病・災厄的な打撃に用いられ得るが、ここでは手段を表す名詞が明記されていない。本文では自然な意味を示しつつ、より一般的な訳の可能性を脚注に残して曖昧さを保つ。
- issue: 民の罪を表すעָשׂוּの理解
  choice: 子牛に関して民が「行ったこと」とする。
  alternative: 「子牛を造ったため」
  rationale: 同じ節が子牛を造った者をアロンと明記しているため、複数形のעָשׂוּを民による製作だけに限定せず、子牛をめぐる彼らの行為と理解する。これにより民の責任とアロンの製作責任の双方を保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「民」「ことのゆえに」により簡潔で dignified な聖書本文の調子を保った。神名は「ヤハウェ」とし、原文にない「金の」は加えていない。脚注記号[a]は本文中に配置した。
