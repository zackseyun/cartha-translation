  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן מֶֽה עָשָׂ֥ה לְ/ךָ֖ הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי הֵבֵ֥אתָ עָלָ֖י/ו חֲטָאָ֥ה גְדֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: ja
  text: モーセはアロンに言った。「この民はあなたに何をしたので、あなたは彼らに大きな罪をもたらしたのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める標準的なワウ継続法であり、現代日本語では接続詞を明示せず過去形で自然に表す。
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: この民はあなたに何をしたので
  rationale: מֶהを「何」、עשה לְを「人に何かをする」、העם הזהを指示の響きを保って「この民」とした。後続のכי節とのつながりは「ので」で自然に示す。
- source_word: כִּי
  choice: ので
  rationale: 民がアロンに何をしたために彼がこの結果を招いたのか、という問いの因果・帰結関係を表す。独立した「なぜなら」より日本語の疑問文として自然である。
- source_word: הֵבֵאתָ עָלָיו
  choice: あなたは彼らに…負わせた
  rationale: בואのヒフィルは「もたらす」。罪を民の上にもたらすという表現を、責任を弱めず自然な日本語の「罪を負わせる」で表した。עָלָיוは形態上単数だが、集合名詞העםを受けるため意味上の複数「彼ら」とした。
- source_word: חֲטָאָה גְדֹלָה
  choice: 大きな罪
  rationale: 罪・違反を表すחטאהと、その重大さを示すגדלהを簡潔かつ直接的に訳した。原文にない強意を加えない。
theological_decisions:
- issue: アロンの責任の性質
  choice: あなたは彼らに大きな罪を負わせた
  alternative: あなたは彼らを大きな罪に陥らせた／彼らに大きな罪責を負わせた
  rationale: アロンが民の上に重大な罪をもたらしたという原文の道徳的非難を保つ一方、「罪に導いた」や「罪責」と意味を限定しすぎない。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述。「この民」により指示語の距離感を残し、モーセの厳しい問いかけを簡潔に表した。
