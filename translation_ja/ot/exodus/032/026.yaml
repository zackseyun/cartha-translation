id: EXO.32.26
reference: Exodus 32:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: ja
  text: モーセは宿営の門のところに立ち、言った。「ヤハウェにつく者は、私のもとへ[a]。」すると、レビの子らは皆[b]、彼のもとに集まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「だれがヤハウェの側にいるのか。私のもとへ！」。動詞を省いた召集の言葉です。
    reason: lexical_alternative
  - marker: b
    text: 「レビ人は皆」とも訳せます。直訳は「レビの子らは皆」です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 立ち
  rationale: עמד の基本的な意味を保ち、特別に儀礼的・軍事的な姿勢を読み込まない自然な表現とした。
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: 宿営の門のところに
  rationale: שַׁעַר の具体的な「門」という像を保ちつつ、場所を示す בְּ を自然な現代日本語で表した。
- source_word: מִי לַיהוָה
  choice: ヤハウェにつく者は
  rationale: 直訳的には「だれがヤハウェの側にいるのか」。ここでは情報を求める疑問というより忠誠を呼びかける表現なので、「つく者は」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語表記で示した。
- source_word: אֵלַי
  choice: 私のもとへ
  rationale: 原文どおり動詞を明示しない簡潔で力強い召集の言葉とした。日本語でもこの省略は自然に成立する。
- source_word: וַיֵּאָסְפוּ אֵלָיו
  choice: 彼のもとに集まった
  rationale: Nifal 形の「集まる」と、אֶל が示す移動の方向を簡潔に表した。
- source_word: כָּל בְּנֵי לֵוִי
  choice: レビの子らは皆
  rationale: 「レビ人」と一般化せず、原文の系譜的・部族的表現「レビの子ら」を保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名である四文字神名を用いているため、称号へ置換せず音写した。
- issue: מִי לַיהוָה が示す帰属・忠誠
  choice: ヤハウェにつく者は
  alternative: ヤハウェのものはだれか／ヤハウェの側にいる者は
  rationale: לְ がここで示し得る帰属と支持の幅を完全には限定せず、文脈上の忠誠の呼びかけが伝わる表現を選んだ。
- issue: בְּנֵי לֵוִי の集団名称
  choice: レビの子ら
  alternative: レビ人
  rationale: 男性複数の親族・部族表現を保持し、単なる一般的集団名へ平滑化しなかった。
translation_notes:
  register: 明快で dignified な現代標準日本語。モーセの呼びかけは原文の省略と切迫感を生かし、「来なさい」を補わず「私のもとへ」とした。「宿営」「レビの子ら」により聖書本文に適した格調を保ちながら、難解な古語は避けた。
