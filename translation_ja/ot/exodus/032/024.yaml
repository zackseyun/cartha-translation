base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: ja
  text: 私は彼らに言った[a]。『金を持っている者は、それを外しなさい。』そこで彼らはそれを私に渡した。私はそれを火の中に投げ入れた。すると、この子牛が出て来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は彼らに言った。『だれが金を持っているのか。それを外しなさい』」。ヘブライ語を直訳すると、「だれに金があるか。取り外せ」となる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לָהֶם
  choice: 私は彼らに言った
  rationale: アロンの報告の順序を保ちつつ、現代日本語として自然な直接話法の導入とした。
- source_word: לְמִי זָהָב
  choice: 金を持っている者
  rationale: 直訳的には「だれに金があるか」だが、不特定の所有者を指すヘブライ語表現を自然な日本語にした。
- source_word: הִתְפָּרָקוּ
  choice: それを外しなさい
  rationale: ヒトパエル形は、この文脈では身に着けた金の飾りを自分から取り外すことを表す。目的語は直前の「金」から補った。
- source_word: וַיִּתְּנוּ לִי
  choice: そこで彼らはそれを私に渡した
  rationale: 暗黙の目的語である金を「それ」として補い、物を手渡す文脈に自然な「渡した」を用いた。
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: 私がそれを火の中に投げ入れると
  rationale: שלך の投擲の意味と、火へ入る方向性を明瞭に表した。接続は後続結果との自然な関係を示す「と」とした。
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: この子牛が出て来た
  rationale: アロンの弁明が持つ不自然さや皮肉を解説で補わず、原文どおり単純な出来事として述べる形を保った。עגל は文脈に即して「子牛」とした。
theological_decisions:
- issue: 偶像の成立についてのアロンの回避的な説明
  choice: 「この子牛が出て来た」と、評価語を加えずそのまま訳す。
  alternative: 「なぜかこの子牛が出来上がった」「奇跡的に出て来た」など、欺瞞や超自然性を明示する。
  rationale: 本文はアロンの言葉を提示するにとどまるため、その弁明に含まれる皮肉や緊張は文脈に委ね、訳文では解釈を付加しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての落ち着きを保つ文体とした。アロンの弁明の不自然さを説明的に強調せず、原文の簡潔さを維持した。
