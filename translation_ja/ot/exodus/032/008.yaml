id: EXO.32.8
reference: Exodus 32:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: ja
  text: 彼らは、わたしが命じた道から早くもそれてしまった。彼らは自分たちのために鋳物の子牛を造り、それにひれ伏し、いけにえをささげて、『イスラエルよ、これらが、エジプトの地からあなたを導き上げた、あなたの神々だ』[a]と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルよ、これが、エジプトの地からあなたを導き上げた、あなたの神だ」。ヘブライ語は字義的には「これらがあなたの神々だ」と複数形だが、文脈では一体の子牛を指している。
    reason: 単一の指示対象と複数形の文法との間にある原文の曖昧さを示すため。
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: 早くもそれてしまった
  rationale: 道から外れるという比喩を「それる」で保ち、מַהֵרが表す背反の早さを、自然な現代日本語の「早くも」で示した。完了した背反は「てしまった」で表した。
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: わたしが命じた道から
  rationale: 「道」という服従の歩みを示す比喩を保つ。日本語では「彼らに」を補わなくても意味が明瞭であり、簡潔にした。
- source_word: עָשׂוּ לָהֶם
  choice: 彼らは自分たちのために…造り
  rationale: לָהֶםの再帰的な含み、すなわち偶像を自らのために設けたことを明示した。
- source_word: עֵגֶל מַסֵּכָה
  choice: 鋳物の子牛
  rationale: מַסֵּכָהが鋳造された像を指すことを「鋳物」で示し、עֵגֶלは簡潔に「子牛」とした。像であることは「鋳物」と製作動詞「造る」から明瞭である。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: それにひれ伏し
  rationale: 礼拝という抽象的な総称にせず、原語が描く身体的な伏拝行為を保った。
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: いけにえをささげて
  rationale: 祭儀的な犠牲行為を、一般読者に明瞭な現代日本語で表した。
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: これらが…あなたの神々だ
  rationale: 指示語と名詞の明白な複数形を本文に残し、単一の子牛との緊張を解消しなかった。
- source_word: יִשְׂרָאֵל
  choice: イスラエルよ
  rationale: 呼びかけであることを日本語として明瞭に示した。
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地からあなたを導き上った
  rationale: עלהの「上らせる／導き上る」という方向性と、出エジプト定型句とのつながりを保った。「エジプトの地」も原文のאֶרֶץを反映する。
theological_decisions:
- issue: 単一の子牛に対するאֵלֶּה אֱלֹהֶיךָの数
  choice: 本文を複数形の「これらが…あなたの神々だ」とする
  alternative: 文脈に合わせて単数形の「これが…あなたの神だ」とする
  rationale: ヘブライ語は指示語אֵלֶּהとאֱלֹהֶיךָがともに形態上複数である。一方、直前の対象は単一の子牛なので、本文では文法上の複数を保ち、文脈に即した単数理解を脚注に示して、原文の緊張を保持した。
- issue: וַיִּשְׁתַּחֲווּの祭儀的意味
  choice: 「ひれ伏し」と訳す
  alternative: 「礼拝し」と訳す
  rationale: 原語が直接表す身体動作を残すことで、ひれ伏す、いけにえをささげる、宣言する、という一連の行為を区別した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。古風な「汝」「拝した」などを避けつつ、「ひれ伏す」「いけにえ」「エジプトの地」によって聖書叙述としての品位と原文の具体性を保った。
