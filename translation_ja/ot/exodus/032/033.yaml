base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: ja
  text: ヤハウェはモーセに言った。「わたしに罪を犯した者はだれでも、わたしはその者をわたしの書[a]から消し去る。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの書」が何を指すかは、本文では明示されていない。神のもとに記されている者の記録を指すと考えられ、「いのちの書」と理解されることもある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ワウ継続法による物語の進行を、現代日本語として自然な叙述で表した。前後関係は語順と文脈で明らかなため、接続語を機械的には加えない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず一般的な日本語音写で示した。
- source_word: מִי אֲשֶׁר
  choice: 罪を犯した者
  rationale: 不定関係節の意味を自然な日本語で表し、特定の一人に限定しない一般化の力を保った。
- source_word: חָטָא לִי
  choice: わたしに対して罪を犯した
  rationale: 完了した行為を示す חָטָא と、罪が神に向けられたことを示す לִי を明確に表した。
- source_word: אֶמְחֶנּוּ
  choice: その者を……消し去る
  rationale: מחה の、記録から拭い消すという比喩を保った。日本語では目的語を関係節に組み込み、「罪を犯した者を」として自然に示した。
- source_word: מִסִּפְרִי
  choice: 自分の書から
  rationale: סֵפֶר を特定の種類の台帳や『いのちの書』と断定せず、『書』という原文の比喩を維持した。主語との関係が自然に伝わるよう一人称所有を『自分の』と表した。
theological_decisions:
- issue: 「わたしの書」の性質
  choice: 本文では「自分の書」とし、指示対象を限定しない
  alternative: 「いのちの書」「生きている者の名簿」「契約共同体の登録簿」
  rationale: ヘブライ語本文は単に סִפְרִי（わたしの書）と述べるだけで、その正確な性質を明示していない。解釈上の幅と神学的緊張を保つため、具体化は注にとどめた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の宣告にふさわしい簡潔で厳粛な調子を保った。「書」は現代語ではやや格調のある語だが、神の記録という比喩を曖昧なまま保持するのに適している。
