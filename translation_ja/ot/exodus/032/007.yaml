  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「行って、下りなさい。あなたがエジプトの地から導き上げたあなたの民は、堕落してしまった[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「腐敗した行いをした」。ヘブライ語の動詞は、堕落した状態だけでなく、腐敗した行動を強調して訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 言われた
  rationale: 物語を進める接続形は、日本語では文脈上自然な継起として表し、神の発言には敬意を保つ「言われた」を用いた。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語の聖書文体で定着し、一般読者にも自然な「主」を用いた。これは本文の固有名יהוהを伝統的に示す表記である。
- source_word: לֶךְ רֵד
  choice: さあ、下って行け
  rationale: 二つの命令形を機械的に重ねず、לֶךְの促しとרֵדの具体的命令を、自然な現代日本語でともに表した。
- source_word: כִּי
  choice: （後続文による理由提示）
  rationale: 命令の理由を導く接続詞。日本語では独立した次文を続けることで因果関係が明瞭なため、「なぜなら」を補わなかった。
- source_word: שִׁחֵת
  choice: 堕落してしまった
  rationale: 偶像礼拝による道徳的な腐敗と、その結果に至った完了的ニュアンスを簡潔に表す。行為面を強調する訳も可能なので脚注に示した。
- source_word: עַמְּךָ
  choice: あなたの民
  rationale: 二人称所有を明示し、主がイスラエルをモーセに対して「あなたの民」と呼ぶ修辞的な緊張を保持した。
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: あなたが…導き上った
  rationale: 使役形の「上らせた／連れ上った」を、出エジプトの導きを自然に示す表現とした。主語がモーセである点を明示した。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: מֵאֶרֶץを省略せず、「地から」として原文の表現を保った。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名であることは認めつつ、日本語本文では広く定着した敬称的代替表記「主」を採用した。特定教派の読みや発音再建を本文で断定しない。
- issue: שִׁחֵתの態と意味
  choice: 堕落してしまった
  alternative: 腐敗した行いをした／自らを堕落させた
  rationale: 原語は対象を明示せず、腐敗した状態と破壊的な行為の両面を含み得る。本文では自然な結果状態を示し、行為を強調する可能性を脚注に残した。
- issue: 「あなたの民」という呼称
  choice: あなたの民
  alternative: 民
  rationale: 罪によって生じた関係上の緊張を含む原文の二人称所有を、神学的に言い換えず保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「さあ、下って行け」で二命令形の機能を自然に反映し、「あなたの民」の反復による修辞的緊張を保持した。
