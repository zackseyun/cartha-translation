source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「わたしはこの民を見た。見よ、この民はうなじの固い民だ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「うなじの固い民」。頑固で、従おうとしないことを表す比喩。
    reason: ヘブライ語の身体的比喩の直訳と意味を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進めるワイイクトール形。日本語では不必要な接続語を加えず、自然な叙述とした。神からモーセへの発言なので、現代の聖書文体として敬意を表す形を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を普通名詞の称号に置き換えず、固有名として音写した。
- source_word: רָאִיתִי
  choice: わたしは…見た
  rationale: 完了した観察に基づく現在の評価を述べる完了形。日本語では簡潔な過去形でそのつながりを自然に表した。
- source_word: הָעָם הַזֶּה
  choice: この民
  rationale: 単数の集合名詞と指示詞を保ち、神が対象としてこの民を指し示す語調を伝えた。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 聞き手の注意を後続の判断へ向ける談話標識の力を保った。
- source_word: קְשֵׁה עֹרֶף
  choice: 首をこわばらせる
  rationale: 頑迷さや従おうとしない態度を示すヘブライ語の身体的比喩を、意味の分かる現代日本語で保持した。
- source_word: הוּא
  choice: これは…民だ
  rationale: 集合名詞「この民」を受ける単数代名詞の指示的な力を「これは」で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が四文字神名を明記しているため、称号「主」に置換せず固有名として示した。発音の完全な確実性には限界があるが、現代の学術的に一般的な再建音を採用した。
- issue: קְשֵׁה עֹרֶף の比喩を残すか
  choice: 首をこわばらせる民
  alternative: 強情な民／かたくなな民
  rationale: 単なる性格評価に平板化せず、神に従うことへの抵抗を描く原文の比喩を保った。脚注で直訳と意味を補足する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」によって原文の荘重な注意喚起を残した。「うなじのこわい」のような古風で伝わりにくい定型句は避け、比喩を理解できる形に整えた。
