base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: ja
  text: ファラオに語った時、モーセは八十歳[a]、アロンは八十三歳であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を直訳すると、年齢は「八十年の子」「三と八十年の子」と表される。これは年齢を表すヘブライ語の言い方。
    reason: 原文の年齢表現の形式を示すため。
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: …歳であった
  rationale: ヘブライ語では年齢を「…年の子」と表す慣用句だが、現代日本語では「…歳であった」が自然で正確である。
- source_word: שְׁמֹנִים שָׁנָה
  choice: 八十歳
  rationale: 年齢を表す通常の数詞表現として、現代日本語の語順と形式で訳した。
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: 八十三歳
  rationale: 原文の数詞は「三と八十」の順だが、日本語で通常用いる「八十三」とした。
- source_word: בְּדַבְּרָם
  choice: 彼らが…語った時
  rationale: 前置詞 בְּ と接尾辞付き不定詞連語は、ここでは発話が行われた時を示す時間表現である。主語の「彼ら」は日本語本文ではモーセとアロンが直後に明示されるため省略した。
- source_word: אֶל פַּרְעֹה
  choice: ファラオに
  rationale: 発話の相手を示す אֶל は日本語では助詞「に」が自然であり、פַּרְעֹה は定着した表記「ファラオ」とした。
- source_word: וּ
  choice: （明示せず）
  rationale: 節頭のワウは物語の連続を示す。日本語では文脈上、接続語を補わなくても自然に連続性が伝わるため、独立した語としては訳出しなかった。
