  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: ja
  text: ヤハウェはこう言われる。「これによって、あなたは、わたしがヤハウェであることを知る。見よ、わたしはわたしの手にある杖で、ナイル川の水を打つ。その水[a]は血に変わる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「ナイル川にある水々を……それらは血に変わる」と複数形になっている。日本語では自然な集合表現として「水」「その水」とした。
    reason: 原文の文法上の複数形と、日本語訳での集合的な単数表現の違いを示すため。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: ヤハウェはこう言われる
  rationale: 預言者的な使者の定型句を、荘重さを保ちつつ現代日本語として自然に表現した。神名は称号に置き換えず、固有名として「ヤハウェ」とした。
- source_word: בְּזֹאת תֵּדַע
  choice: このことによって、あなたは…知る
  rationale: 前置詞 בְּ の手段・根拠の意味と、未完了形の将来的な力を明確にした。
- source_word: כִּי אֲנִי יְהוָה
  choice: わたしがヤハウェであることを
  rationale: 災いの物語で中心となる神の自己同定をそのまま保持した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 注意を喚起し、目前の行為を劇的に提示する語の働きを、簡潔で格調ある日本語で表した。
- source_word: אָנֹכִי מַכֶּה
  choice: わたしは…打つ
  rationale: 独立人称代名詞による強調を「わたしは」で示し、分詞が表す目前の生々しい行為を、文脈に自然な現在形で訳した。
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: 手にある杖で
  rationale: 道具を示す בְּ と関係節の内容を保ちつつ、冗長にならない自然な日本語とした。
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: ナイル川の水を
  rationale: יְאֹר はこの文脈ではナイル川を指す。עַל は「打つ」と組み合わせ、日本語で自然な目的語として表現した。
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: その水は血に変わる
  rationale: 結果としての変化を明確に表した。ヘブライ語では「水」が複数形で、動詞も複数形だが、日本語では集合的な「水」を単数的に扱うのが自然である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文の四文字神名を称号で代用せず、イスラエルに示された固有名として音写した。
- issue: 「わたしは…打つ」における行為主体と杖を持つ者
  choice: 原文どおり「わたしは手にある杖で…打つ」とした
  alternative: モーセを明示して「あなたは手にある杖で…打つ」とする
  rationale: 文法上の一人称表現を保持し、神の行為と人間の代理行為との関係を訳文で一方的に解消しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣言にふさわしい簡潔で格調ある調子を保った。「見よ」は原文の注意喚起を伝えるために残し、それ以外は過度に古風な言い回しを避けた。
