  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: ja
  text: あなたは、わたしがあなたに命じることをすべて語りなさい。あなたの兄アロンはファラオに語り、ファラオがイスラエルの子ら[a]をその国から去らせるようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では直訳すると「イスラエルの息子たち」。ここではイスラエルの民を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה תְדַבֵּר
  choice: あなたは……語りなさい
  rationale: 二人称代名詞による主語の強調を「あなたは」で示し、未完了形がこの任命の文脈で持つ指示の力を、自然で明確な命令表現にした。
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: わたしがあなたに命じることをすべて
  rationale: כָּל の包括性と、אֲשֶׁר が導く関係節を保った。「命じる」は継続的に与えられる指示を表し得る未完了形に対応する。
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: あなたの兄アロンは
  rationale: 日本語として自然な語順を採用しつつ、אָחִיךָ の家族関係を明示した。
- source_word: יְדַבֵּר אֶל פַּרְעֹה
  choice: ファラオに語り
  rationale: דבר と אֶל の基本的な意味を保ち、伝える内容を「命令」などに限定しなかった。後続節とのつながりを自然に示すため連用形とした。
- source_word: וְשִׁלַּח
  choice: ファラオは……去らせる
  rationale: ピエル形の使役的意味を「去らせる」で表した。接続詞を目的だけに限定せず、アロンの発言に続く事態として読める形を採用した。代名詞の指示対象は日本語で曖昧になりやすいため「ファラオ」と明示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 直訳的な系譜表現を本文に残した。「子ら」は年少者だけを指すのではなく、イスラエルに属する子孫・民を表す。現代日本語で分かりやすい「イスラエル人」という代案を脚注に示した。
- source_word: מֵאַרְצוֹ
  choice: 自分の国から
  rationale: מִן の起点・離脱を「から」で示した。三人称接尾辞は直前のファラオを受けるため、日本語では「自分の国」とした。
theological_decisions:
- issue: וְשִׁלַּח が目的・結果・継起のどれを表すか
  choice: 「ファラオは……去らせる」と続け、継起または予告として表現する
  alternative: 「ファラオが……去らせるように」または「そうすれば、ファラオは……去らせる」
  rationale: ヘブライ語には目的を明示する専用表現がなく、接続詞付き動詞は文脈上、継起・結果・意図の幅を持ち得る。本文では「ように」や「そうすれば」を補わず、関係を過度に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の任命としての厳粛さを保った。「語りなさい」で指示を明確にし、後半は断定形としてヘブライ語の簡潔さを維持した。
