source:
  edition: WLC
  text: וַ/אֲנִ֥י אַקְשֶׁ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/הִרְבֵּיתִ֧י אֶת אֹתֹתַ֛/י וְ/אֶת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: ja
  text: しかし、わたしはファラオの心を頑なにする。そして、エジプトの地で、わたしのしるしと不思議を数多く行う。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: しかし、わたしは
  rationale: 接続詞と明示された一人称代名詞の組み合わせは、直前の委任の言葉を受けた対照と強調を示すため、自然な日本語で「しかし、わたしは」とした。
- source_word: אַקְשֶׁה
  choice: かたくする
  rationale: קשׁהのヒフィル形が表す直接的な使役の意味を保った。「頑なにする」も可能だが、「心をかたくする」は原文の比喩をよりそのまま伝える。
- source_word: לֵב פַּרְעֹה
  choice: ファラオの心
  rationale: ヘブライ語の連語を自然な所有表現で訳した。「心」は意志や思考を含みうるが、本文では解釈的に言い換えず比喩を保持した。
- source_word: וְהִרְבֵּיתִי
  choice: 数多く行う
  rationale: רבהの使役形が表す「多くする」という意味を、目的語である「しるしと不思議」に合う自然な日本語で表した。個数だけでなく、それらの出来事を多く起こすことを示す。
- source_word: אֹתֹתַי
  choice: わたしのしるし
  rationale: אוֹתの基本義「しるし」を採用し、神の力とことばを示す出来事という含みを過度に説明せず保持した。
- source_word: מוֹפְתַי
  choice: 不思議
  rationale: מוֹפֵתには驚異・兆しの意味がある。「不思議」は「しるし」と自然に対をなし、奇異な出来事という意味を過度に限定しない。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地で
  rationale: 原文に明記された「地」を保持しつつ、現代日本語として自然な形にした。
theological_decisions:
- issue: ファラオの心をかたくする神の働き
  choice: わたしはファラオの心をかたくする
  alternative: わたしはファラオの心がかたくなるのを許す
  rationale: ヘブライ語のヒフィル形は神の能動的かつ直接的な働きを示す。単なる許容へ弱めず、本文が持つ神学的緊張をそのまま残した。
- issue: 「心をかたくする」の語義
  choice: 心をかたくする
  alternative: 心を頑なにする
  rationale: どちらも文脈上可能だが、主要訳では「心」という原文の比喩と「かたくする」という使役性を明瞭に保った。別訳は脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら威厳のある文体とした。「しるし」は聖書的な語感を保ちながら一般読者にも理解できるよう平仮名表記とし、「不思議」と対にした。神の直接的な発言として簡潔さを優先した。
