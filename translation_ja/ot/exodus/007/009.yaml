source:
  edition: WLC
  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: ja
  text: ファラオがあなたがたに、「しるしを見せよ」と言うとき、あなたはアロンに言いなさい。「あなたの杖を取り、ファラオの前に投げなさい。それが蛇[a]になるようにせよ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「竜」。ヘブライ語の「タンニーン」は、文脈により、蛇、海の生き物、または竜のような生き物を指す。
    reason: תַנִּין の広い語義を示し、本文の「蛇」だけに意味を限定しないため。
lexical_decisions:
- source_word: כִּי
  choice: ～とき
  rationale: ここでは原因ではなく、予想される将来の状況を導くため、時間・条件の意味を自然に表した。
- source_word: מוֹפֵת
  choice: しるし
  rationale: 超自然的な証拠や前兆を指す語であり、この文脈では要求された実演を明瞭に表す。
- source_word: תְּנוּ לָכֶם
  choice: 自分たちのために、しるしを示せ
  rationale: 直訳的には「自分たちのために与えよ」。複数形と再帰的なニュアンスを保ちつつ、ファラオの要求として自然な日本語にした。
- source_word: מַטְּךָ
  choice: あなたの杖
  rationale: מַטֶּה は杖または棒を意味するが、携える物として現代日本語で自然な「杖」を採用した。
- source_word: וְהַשְׁלֵךְ
  choice: 投げなさい
  rationale: 投げる、放るという動作を簡潔に表し、命令形を保持した。
- source_word: לִפְנֵי פַרְעֹה
  choice: ファラオの前に
  rationale: 空間的意味と、王の面前で行うという公的な場面の両方を保つ表現である。
- source_word: יְהִי
  choice: それを～にせよ
  rationale: 単なる未来ではなく、命令に伴う意図された結果を表す指示・願望的用法を反映した。
- source_word: תַנִּין
  choice: 蛇
  rationale: 語義は蛇、海の生き物、竜のような生き物に及ぶが、杖が変化するこの場面では「蛇」が最も理解しやすい。より広い語義は脚注に残した。
theological_decisions:
- issue: 杖のしるしにおける תַנִּין の訳
  choice: 蛇
  alternative: 竜、海の生き物、竜のような生き物
  rationale: この語は נָחָשׁ より広い意味範囲を持つため一義的に狭め切るべきではないが、物語上は蛇状の生き物が最も自然である。本文の明瞭さを保ちつつ、別の可能性を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の指示にふさわしい簡潔で格調ある命令表現とした。「あなたがた」はファラオが語りかける複数の相手を、「あなた」はアロンに命じる話者を指す単数形を反映している。
