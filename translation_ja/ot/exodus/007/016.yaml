source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: ja
  text: そして彼に言いなさい。「ヘブライ人の神ヤハウェが、私をあなたのもとに遣わし、こう言われた。『私の民を行かせ、荒野で私に仕えさせよ[a]。』だが、見よ、あなたは今に至るまで聞き入れなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「荒野で私を礼拝させよ」。ヘブライ語の動詞は、一般的に「仕える」ことも、宗教的な意味で「礼拝する」ことも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ヘブライ人の神
  rationale: 原文の民族呼称「ヘブライ人」を保ち、「イスラエル人」へ言い換えなかった。
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: 私をあなたのもとに遣わして
  rationale: 完了した派遣と、その結果としてモーセがファラオの前にいることを自然な日本語で表した。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: 私の民を去らせ
  rationale: 解放を要求する命令を簡潔に表し、目的を示す後続節へ自然につないだ。
- source_word: וְיַעַבְדֻנִי
  choice: 私に仕えさせよ
  rationale: עבדの広い意味を保ち、宗教的礼拝だけに限定しなかった。命令に続く目的・結果の関係を日本語の使役表現で示した。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: 人里離れた未開の地を表す語として、聖書文脈で自然な「荒野」を採用した。
- source_word: וְהִנֵּה
  choice: だが、見よ
  rationale: 文脈上の対比と、目前の事実に注意を促す談話標識の力を保った。
- source_word: לֹא שָׁמַעְתָּ עַד כֹּה
  choice: あなたは今に至るまで聞き入れなかった
  rationale: 単に音を聞かなかったのではなく、要求に耳を貸さなかった意味を表しつつ、「従わなかった」と断定して語義を狭めることを避けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を直接用いているため、称号への代替を避けて固有名として音写した。
- issue: וְיַעַבְדֻנִי における עבד の意味
  choice: 私に仕えさせよ
  alternative: 私を礼拝させよ
  rationale: この奉仕には礼拝の含意があるが、語そのものはより広い奉仕も表し得るため、本文では意味を限定せず、別訳を脚注に示した。
- issue: לֹא שָׁמַעְתָּ における聞くことと従うことの関係
  choice: 聞き入れなかった
  alternative: 従わなかった
  rationale: ファラオが要求を聞きながら受け入れなかった文脈を示しつつ、שׁמעを明示的な服従だけに限定しなかった。
translation_notes:
  register: 明瞭な現代標準語を基本としながら、神の宣告にふさわしい威厳を保った。「見よ」は日常語より荘重だが、הִנֵּהの注意喚起を明示するため採用した。引用の階層を鉤括弧と二重鉤括弧で区別した。
