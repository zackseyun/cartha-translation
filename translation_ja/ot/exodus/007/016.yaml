revisions:
- from: そして、彼に言いなさい。「ヘブライ人の神ヤハウェが、私をあなたのもとに遣わして、こう言われる。『私の民を去らせ、荒野で私に仕えさせよ[a]。』だが、見よ、あなたは今に至るまで聞き入れなかった。」
  to: そして彼に言いなさい。「ヘブライ人の神ヤハウェが、私をあなたのもとに遣わし、こう言われた。『私の民を行かせ、荒野で私に仕えさせよ[a]。』だが、見よ、あなたは今に至るまで聞き入れなかった。」
