reference: Exodus 7:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: ja
  text: モーセとアロンは、ヤハウェが命じたとおりに行った。杖を上げ、ファラオの目の前、またその家臣たちの目の前で、ナイル川[a]の水を打つと、ナイル川にある水はことごとく血に変わった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「川」。出エジプト記では、この語は通常ナイル川を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: そのとおりに行った
  rationale: 直前の命令に従って実行したことを表す「עשה＋כן」を、自然な現代日本語で示した。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 命じたとおりに
  rationale: 比較・一致を表す構文の力を保ち、命令どおりの行動だったことを明確にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を、称号に置き換えず音写した。
- source_word: וַיָּרֶם בַּמַּטֶּה
  choice: 杖を振り上げ
  rationale: רוםの使役形による動作を自然に表した。ヘブライ語の動詞は単数だが、直前の二人のうち誰かという主語を本文だけで断定しないよう、日本語では主語を補わなかった。
- source_word: וַיַּךְ אֶת הַמַּיִם
  choice: 水を打つと
  rationale: נכהの具体的な打撃動作を簡潔に表し、続く変化との時間的連続も自然に示した。
- source_word: הַיְאֹר
  choice: ナイル川
  rationale: 出エジプト記のエジプト場面では通常ナイル川を指すため、指示対象を本文に示しつつ、字義は脚注に残した。
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: ファラオの目の前、またその家臣たちの目の前で
  rationale: 「目の前で」という表現の反復を保ち、出来事が公然と行われたことを伝えた。
- source_word: עֲבָדָיו
  choice: その家臣たち
  rationale: 王に仕える者という文脈を自然な日本語で表した。「しもべ」より現代の読者に理解しやすく、官位までは特定しない。
- source_word: וַיֵּהָפְכוּ כָּל הַמַּיִם
  choice: 水はことごとく血に変わった
  rationale: כָּלの全体性を「ことごとく」で表し、הפךの変化の結果を自然な日本語にした。
- source_word: לְדָם
  choice: 血に
  rationale: 結果を示す前置詞לְを、日本語の変化表現「血に変わった」で直接的に訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を用いているため、一般的な称号へ置換せず、契約の神名として音写した。
- issue: 杖を上げて水を打った人物
  choice: 主語を明示しない
  alternative: アロンが
  rationale: ヘブライ語は単数動詞を用い、直前の命令からアロンと理解できる一方、この節では固有名を明示していない。日本語の主語省略を用いて原文の含みを保った。
- issue: 血への変化の表現
  choice: 血に変わった
  alternative: 血のようになった
  rationale: 原文は לְדָם と直接述べており、「血のように」とする比喩標識はないため、比喩化せず訳した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。叙事の簡潔さと、原文にある「目の前」の反復を保持した。
