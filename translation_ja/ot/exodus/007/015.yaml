source:
  edition: WLC
  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: ja
  text: 朝、ファラオのところへ行きなさい。見よ、彼は水の方へ出て行く。あなたは彼に会うために、ナイル川[a]の岸に立ちなさい。そして、蛇[b]に変わった杖を手に取りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「川」。ここで用いられるヘブライ語 יְאֹר は、出エジプト記では通常ナイル川を指す。
    reason: lexical_alternative
  - marker: b
    text: 「へび」とも表記する。ヘブライ語 נָחָשׁ は、蛇を指す一般的な語。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה בַּבֹּקֶר
  choice: 朝、ファラオのところへ行きなさい
  rationale: 命令形の直接性を保ちつつ、時間句を日本語として自然な文頭に置いた。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 後続の状況へ注意を促す談話機能を、簡潔で dignified な現代日本語として保持した。
- source_word: יֹצֵא הַמַּיְמָה
  choice: 彼は水辺へ出て来る
  rationale: 分詞の進行的・目前的な性格と、方向を示す語尾を表す。「水へ」より自然な「水辺へ」としたが、目的行為までは補わない。
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: 立って彼を迎え
  rationale: נצב の『位置を取る／立つ』と、לקראת の『会うために向かう』を自然な命令の連鎖として表した。敵対的な『立ちはだかる』とは限定しない。
- source_word: עַל שְׂפַת הַיְאֹר
  choice: ナイル川の岸に
  rationale: שׂפה はここでは岸、יאור は出エジプト記のエジプト的文脈ではナイル川を指す。
- source_word: הַמַּטֶּה
  choice: あの杖
  rationale: מַטֶּה を現代日本語で自然な『杖』とし、後続の関係節で特定される既知の杖であることを『あの』で明確にした。
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: 蛇に変わった
  rationale: נֶהְפַּךְ の状態変化を自然に表し、נָחָשׁ は一般的で文体上も適切な『蛇』とした。
- source_word: תִּקַּח בְּיָדֶךָ
  choice: 手に取りなさい
  rationale: 命令的な未完了形と具体的な『手に』を保持し、日本語では自然な命令表現にした。
theological_decisions:
- issue: יְאֹר の指示対象
  choice: ナイル川
  alternative: 川
  rationale: 出エジプト記のエジプト場面では特定のナイル川を指すため、歴史的・物語的な明瞭さを優先した。一般名詞的な訳も脚注に残した。
- issue: לִקְרָאתוֹ の含意
  choice: 彼を迎え
  alternative: 彼に立ち向かう
  rationale: 原語は会うために相手の方へ出ることを表し得るが、敵対や対決の含意を必須とはしないため、中立的な表現を選んだ。
translation_notes:
  register: 明快な現代標準日本語を用い、命令の力を保った。『見よ』は日常会話より荘重だが、注意喚起の機能を簡潔に伝える聖書本文の文体として採用した。
