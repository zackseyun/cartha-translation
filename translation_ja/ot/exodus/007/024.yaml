source:
  edition: WLC
  text: וַ/יַּחְפְּר֧וּ כָל מִצְרַ֛יִם סְבִיבֹ֥ת הַ/יְאֹ֖ר מַ֣יִם לִ/שְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִ/שְׁתֹּ֔ת מִ/מֵּימֵ֖י הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: ja
  text: エジプト人は皆、飲み水を求めてナイル川[a]の周りを掘った。ナイル川の水を飲むことができなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「川」（エオル）。出エジプト記では特にナイル川を指す。
    reason: 原語の一般名詞と文脈上の具体的な指示対象の両方を示すため。
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: 掘った
  rationale: חפרの基本義である「掘る」を直接かつ自然に表す。原文には井戸を明示する語がないため、「井戸を掘った」とはしない。
- source_word: כָל מִצְרַיִם
  choice: エジプト人は皆
  rationale: 字義的には「全エジプト」だが、文脈では災害に対応したエジプトの人々を集合的に指すため、自然な日本語で表した。
- source_word: סְבִיבֹת הַיְאֹר
  choice: ナイル川の周り
  rationale: סְבִיבֹתの周辺・周囲という意味を保ち、出エジプト記でיְאֹרが指す具体的な川を明示した。
- source_word: מַיִם לִשְׁתּוֹת
  choice: 飲み水を求めて
  rationale: 字義は「飲むための水」。掘る行為の目的を日本語として自然に示しつつ、水を得ようとしたという文脈を表す。
- source_word: כִּי לֹא יָכְלוּ
  choice: できなかったからである
  rationale: כִּיを理由を示す接続として訳し、能力・可能性の否定を明確にした。
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: ナイル川の水を飲むこと
  rationale: 日本語では水源を表すמןを逐語的に「から」とすると不自然になりやすいため、目的語として自然に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「掘った」として原文にない「井戸」を補わなかった。理由節は独立した文とし、簡潔で dignified な叙述調に整えた。
