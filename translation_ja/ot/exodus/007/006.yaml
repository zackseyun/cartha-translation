  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: ja
  text: モーセとアロンは、ヤハウェ[a]が彼らに命じたとおりにした。そのとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な代替訳を示すため。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: 動詞 עשה は「する、行う」を意味する。ここでは命令への服従を表し、節末の同じ動詞との反復も保てる「行った」が自然である。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロン
  rationale: 人名の標準的な日本語表記を用い、接続関係をそのまま示した。
- source_word: כַּאֲשֶׁר
  choice: …とおりに
  rationale: 命令と行動との一致を表す比較・対応の表現であり、現代日本語では「…とおりに」が明確で自然である。
- source_word: צִוָּה
  choice: 命じた
  rationale: צוה の命令するという意味を直接表す。日本語では文脈上、先行する命令であることが自然に理解できるため、過去完了を補わない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示す。
- source_word: אֹתָם
  choice: 彼らに
  rationale: 目的語標識に三人称男性複数接尾辞が付き、モーセとアロンを指す。日本語の「命じる」の自然な格として「彼らに」とした。
- source_word: כֵּן עָשׂוּ
  choice: そのとおりに行った
  rationale: 前文を受ける כֵּן と反復された עשה をともに反映し、彼らが命令どおりに従ったことを強調するヘブライ語の反復を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として音写した。伝統的な代替表記は脚注で示す。
- issue: 末尾の反復 כֵּן עָשׂוּ
  choice: 独立した文として「そのとおりに行った」と訳す
  alternative: 省略する、または前文に統合する
  rationale: 原文の反復はモーセとアロンの従順を強調している。日本語でも不自然になりすぎない範囲で、その修辞的な強調を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の簡潔な叙述と、冒頭・末尾に置かれた עשה の意図的な反復を保持した。
