source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「ファラオのもとに行き、彼にこう言いなさい。『ヤハウェはこう言われる。わたしの民を行かせ、わたしに仕えさせよ[a]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「わたしを礼拝させよ」。ヘブライ語の動詞は、礼拝を含む神への奉仕を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 日本語の聖書文体で神の固有名を示す慣用的な訳語を用いる。本文中で繰り返される同一名を一貫して「主」とした。
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める叙述形。日本語では接続詞を補わずとも流れが明確であり、神への敬意を表す自然な敬語とした。
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ファラオのもとに行き
  rationale: בוא は視点により「来る／行く／入る」を表す。ここではモーセがファラオの前へ赴く命令として自然に訳した。
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: 彼にこう言いなさい
  rationale: 連続する命令の力を保ち、続く伝言定型句へ自然につないだ。
- source_word: כֹּה אָמַר יְהוָה
  choice: 主はこう言われる
  rationale: 権威ある使者の伝言定型句を、明瞭で格調のある現代日本語にした。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: わたしの民を去らせ
  rationale: 解放を要求する使役命令として訳し、単なる派遣ではなく拘束から行かせる文脈を示した。
- source_word: וְיַעַבְדֻנִי
  choice: わたしに仕えさせよ
  rationale: עבד の広い意味である奉仕を保持しつつ、前の使役命令に続く目的を日本語の命令表現で明確にした。神への奉仕には礼拝も含まれ得るため脚注で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語として広く理解される伝統的な神名表記を採用した。ただし原文は称号ではなく四文字神名である。
- issue: וְיַעַבְדֻנִי が示すイスラエルの目的
  choice: わたしに仕えさせよ
  alternative: わたしを礼拝させよ
  rationale: עבד は神への礼拝を含み得るが、それだけに限定されない。「仕える」により、ファラオへの隷属から神への奉仕へ移されるという広い意味と神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言と伝言定型句には簡潔で格調ある調子を保った。引用の階層を鉤括弧と二重鉤括弧で明示した。
