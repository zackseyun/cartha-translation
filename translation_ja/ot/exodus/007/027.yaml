lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 直前の解放要求に対する拒絶を条件として示すため、接続辞の文脈上の対照性を自然な日本語で表した。
- source_word: מָאֵן
  choice: 拒む
  rationale: 単なる不能ではなく、意志的に拒絶する意味を簡潔かつ明確に表す。
- source_word: לְשַׁלֵּחַ
  choice: 彼らを去らせる
  rationale: 目的語は文脈からイスラエルの民を指す。使役的な「行かせる／解放する」の意味を、原語の表現に近い形で示した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 迫る裁きに注意を向けさせる厳粛な提示表現を保持した。
- source_word: אָנֹכִי
  choice: わたしは
  rationale: 独立代名詞による主語の明示と強調を日本語でも保った。
- source_word: נֹגֵף
  choice: 打つ
  rationale: 打撃・災厄を加える比喩を保持した。הִנֵּהを伴う分詞には切迫性または未来の含意があり得るが、本文では日本語の非過去形でその幅を残した。
- source_word: כָּל גְּבוּלְךָ
  choice: あなたの領土全域
  rationale: ここでגְּבוּלは境界線だけでなく、ファラオの支配する国土・領域全体を指す。
- source_word: בַּצְפַרְדְּעִים
  choice: 蛙で
  rationale: 前置詞בの手段を表す用法を、「蛙で打つ」として原文の裁きの比喩とともに保持した。
