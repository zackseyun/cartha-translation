source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: ja
  text: わたしがエジプトに対して手を伸ばし、イスラエルの子ら[a]をエジプト人の中から導き出すとき、エジプト人は、わたしがヤハウェ[b]であることを知る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」または「イスラエルの民」とも訳せる。ヘブライ語は直訳すると「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェ」は、ヘブライ語本文に記された神の名YHWHの音写。日本語訳では伝統的に「主」と訳されることもある。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 知る
  rationale: 接続詞を伴う完了形は、この将来を予告する文脈では未来の結果を表す。神の行為を通してエジプト人がその正体を認識するという定型的な表現を、簡潔に「知る」とした。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: ここでは複数の主体として扱われており、国土ではなく人々を指すため。
- source_word: כִּי
  choice: ～であること
  rationale: エジプト人が知る内容を導く接続詞なので、日本語では内容節として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名YHWHを日本語で一般的な音写にした。
- source_word: בִּנְטֹתִי
  choice: わたしが～手を伸ばし…とき
  rationale: 前置詞בְּを伴う不定詞連語を時間の意味に取り、手を伸ばすという具体的な比喩を保持した。
- source_word: יָדִי
  choice: わたしの手
  rationale: 神の力を示唆する擬人的な原語表現を、抽象化せずそのまま保った。
- source_word: עַל מִצְרָיִם
  choice: エジプトに向かって
  rationale: 裁きのために手を伸ばす敵対的な方向性を自然な日本語で示しつつ、過度に説明的な「攻撃するために」は避けた。
- source_word: וְהוֹצֵאתִי
  choice: 導き出す
  rationale: ヒフィル形の使役的意味を表し、イスラエルをエジプト人のただ中から外へ連れ出す行為として自然に訳した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の家族的表現を保持した。「イスラエル人」も意味上可能だが、原語の形を見えるようにした。
- source_word: מִתּוֹכָם
  choice: 彼らの中から
  rationale: 接尾代名詞が直前のエジプト人を受け、そのただ中から分離して連れ出す意味を簡潔に表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、またはエホバ
  rationale: 本文は称号ではなく四文字神名を用いているため、神の固有名を音写して保持した。
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: ヘブライ語の家族的な言い回しを残しながら、現代日本語でも理解できる形にした。ここで共同体全体を指し得ることは脚注で示した。
- issue: 神が「手を伸ばす」という表現
  choice: 具体的な比喩を保持
  alternative: 力を振るう
  rationale: 原文の擬人的表現には神の裁きと力が含意されるが、本文自体の「手」という像を抽象的な解釈に置き換えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の具体的な「手」と家族的表現「イスラエルの子ら」を残し、長い文でも因果と時間関係が追いやすい語順に整えた。
