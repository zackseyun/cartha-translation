  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: ja
  text: ナイル川にいる魚は死に、ナイル川は悪臭を放つようになる。エジプト人はナイル川から水を飲もうとして疲れ果てる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エジプト人はナイル川の水を飲むことができなくなる」。ヘブライ語の動詞は、疲れ果てることと、その結果できなくなることの両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: 魚
  rationale: 単数形の集合名詞で、川にいる魚全体を指す。日本語では「魚」が自然である。
- source_word: יְאֹר
  choice: ナイル川
  rationale: 出エジプト記の文脈では、一般的な川ではなくナイル川を指す。二度目は日本語の自然さのため「川」とした。
- source_word: תָּמוּת
  choice: 死に
  rationale: מותの基本的で直接的な意味を保つ。
- source_word: וּבָאַשׁ
  choice: 悪臭を放つようになる
  rationale: באשは臭くなる、腐臭を放つことを表す。現代日本語で明瞭かつ品位を保った表現とした。
- source_word: וְנִלְאוּ
  choice: 疲れ果ててしまう
  rationale: לאהのニファル形が持つ、努力の末に疲弊する意味を直接反映し、単に「飲めなくなる」と結果だけに限定しない。
- source_word: לִשְׁתּוֹת מַיִם
  choice: 水を飲もうとしても
  rationale: 不定詞と明示された目的語「水」を保持しつつ、וְנִלְאוּとの関係を自然な日本語で表した。
- source_word: מִן הַיְאֹר
  choice: ナイル川の水を
  rationale: 日本語では「ナイル川から水を飲む」より「ナイル川の水を飲む」が自然で、起点を示すמןの意味も文脈上明確である。
