id: EXO.7.13
reference: Exodus 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: ja
  text: しかし、ファラオの心はかたくなになり[a]、彼は二人の言うことを聞かなかった。ヤハウェが語られたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「強く（固く）なり」。ここでは、意志が固くなって聞き入れない、すなわち「かたくなになる」という意味。誰がそうしたかは、この動詞自体には明示されていない。
    reason: 語義上の別訳と、行為主体が明示されていないことを説明するため。
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: かたくなになり
  rationale: חזקの基本的な「強くなる、固くなる」という意味を、この文脈で心が頑なになることとして自然に表した。ヘブライ語の形は明示的な受動態ではなく、行為者も示していないため、「かたくなにされた」として主体を暗示することを避けた。
- source_word: לֵב פַּרְעֹה
  choice: ファラオの心
  rationale: לֵבは意志や思考を含む内面を指す慣用的な「心」とし、פַּרְעֹהは一般的な日本語表記「ファラオ」とした。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 彼は二人の言うことを聞かなかった
  rationale: שׁמע אֶלは単なる聴覚ではなく、相手の言葉を聞き入れる意味を持つ。代名詞の複数形は直前の文脈にいるモーセとアロンを指すため、日本語では「二人」と明示した。
- source_word: כַּאֲשֶׁר
  choice: とおり
  rationale: 先に語られたヤハウェの言葉と出来事との一致を自然な日本語で示す。
- source_word: דִּבֶּר
  choice: 語られた
  rationale: 神の発言を dignified かつ自然に表すため尊敬表現を用いた。日本語では文脈上、先行する発言であることが明らかなため、過去完了を形式的に補わない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として日本語で一般的な形に音写した。
theological_decisions:
- issue: ファラオの心がかたくなになったことの行為主体
  choice: 「心はかたくなになり」と自動詞的に訳し、行為主体を明示しない。
  alternative: 「心はかたくなにされた」または「ファラオは自分の心をかたくなにした」
  rationale: וַיֶּחֱזַקはここでは明示的な受動形でも、ファラオを他動詞の主語とする形でもない。この節だけで神またはファラオを直接の行為主体と断定せず、出エジプト記全体にある神の主権とファラオの責任との緊張を保持する。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「彼ら」では指示対象が曖昧になりやすいため、文脈上のモーセとアロンを「二人」とした。神名は「ヤハウェ」と表記した。
