base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: ja
  text: カエルは、あなたの上にも、あなたの民の上にも、あなたのすべての家臣の上にも、はい上がって来る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの民の間にも、あなたのすべての家臣の間にも」とも訳せる。ヘブライ語では三つの句に同じ前置詞が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: あなたの上にも
  rationale: 前置詞 בְּ と動詞 עָלָה の組み合わせを、災いとしてファラオ本人にまで及ぶ敵対的な侵入として表した。「上に」は三つの句に共通する前置詞を保つ。
- source_word: וּבְעַמְּךָ
  choice: あなたの民の上にも
  rationale: 反復される בְּ の並行性と、カエルが民を襲う災いの強さを保った。日本語では「民の間にも」も可能だが、ここでは前後との対応を優先した。
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: あなたのすべての家臣の上にも
  rationale: עֶבֶד は奴隷、僕、臣下、役人などを指し得るが、ファラオへの王宮的な呼びかけなので「家臣」が自然であり、身分を「奴隷」と限定しすぎない。
- source_word: יַעֲלוּ
  choice: はい上がって来る
  rationale: עָלָה の上昇運動と、カエルが水辺から人々のところへ迫る動きを自然な日本語で表した。
- source_word: הַצְפַרְדְּעִים
  choice: カエルは
  rationale: 定冠詞のある既知の災厄としてのカエルの群れを指す。日本語では複数や定性を形態的に明示せずとも文脈上明確である。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。「這い上がる」は漢字を避けて読みやすくしつつ、カエルの具体的な動きと原語の上昇方向を保った。「家臣」は王宮の文脈に適した、尊厳があり一般読者にも分かりやすい語。
