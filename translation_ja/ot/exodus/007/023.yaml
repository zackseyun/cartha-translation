base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/023.yaml
  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: ja
  text: ファラオは向きを変えて自分の家に入り、このことさえ心に留めなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことにさえ心を向けなかった」、または「このことさえ気に留めなかった」。
    reason: לבを用いるヘブライ語の慣用表現には、心を向ける、注意を払う、真剣に受け止めるという意味の幅があるため。
lexical_decisions:
- source_word: וַיִּפֶן
  choice: 向きを変えて
  rationale: פנהの基本的な動作を保ちつつ、続く「入った」と自然につながる表現。文脈から推測される「背を向けて」までを本文に明示しない。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: 出エジプト記におけるエジプト王の称号として、現代日本語で一般的な表記を用いた。
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: 自分の家に入り
  rationale: בואとאֶלが示す、住居へ向かって中に入る動きを簡潔な日本語で表した。
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: 心に留めなかった
  rationale: 直訳的な「心を置く」という身体語を生かしながら、注意を払い真剣に受け止めるという慣用的意味を自然な現代日本語で表す。
- source_word: גַּם לָזֹאת
  choice: このことさえ
  rationale: גַּםの強調を「さえ」で示し、לָזֹאתが直前の出来事を指すことを「このこと」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「向きを変えて」は原文の動作を保持し、「心に留めなかった」は心を表す原語の比喩と日本語としての自然さを両立させた。脚注記号[a]を本文に付した。
