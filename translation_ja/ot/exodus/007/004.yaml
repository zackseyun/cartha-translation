source:
  edition: WLC
  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: ja
  text: ファラオはあなたがたの言うことを聞かない。わたしはエジプトに手を下し、大いなるさばきの数々をもって、わたしの軍勢[a]、すなわちわたしの民、イスラエルの子ら[b]をエジプトの地から導き出す[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの軍勢」は、「わたしの部隊」または「わたしの諸隊」とも訳せる。原語は、しばしば軍事的な含みを持つ、組織された集団を指す。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの子ら」は、「イスラエル人」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「大いなるさばきの数々をもって」は、「大いなるさばきによって」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: あなたがたの言うことを聞かない
  rationale: שׁמעに前置詞אֶלが続く構文は「耳を傾ける、聞き入れる」を表す。「従わない」とまで明示せず、拒絶の含みを自然な日本語で保った。
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: わたしはエジプトに手を下し
  rationale: 直訳的な「手を置く」よりも、裁きとしての決定的な介入を表す日本語の慣用句を採用した。ただし、本文にない「伸ばす」は補わなかった。
- source_word: צִבְאֹתַי
  choice: わたしの軍勢
  rationale: צָבָאが持つ、統率された集団または軍勢という比喩を保つ。「軍隊」よりも軍事的意味に限定されにくく、ここでイスラエルの民全体を指す表現として自然である。
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: わたしの民イスラエルの子ら
  rationale: 「わたしの民」を「イスラエルの子ら」が同格的に説明する構造を保った。「イスラエル人」という慣用的な訳も脚注に示した。
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: 大いなるさばきによって
  rationale: 複数形は一連の裁きの行為を集合的に表し得るため、日本語では自然な単数的総称とした。司法的・神学的な響きを保つため「さばき」を採用した。
theological_decisions:
- issue: צִבְאֹתַיによるイスラエルの呼称
  choice: わたしの軍勢
  alternative: わたしの部隊／わたしの諸隊
  rationale: 神の統率のもとにある組織された民という軍事的・共同体的な比喩を保持しつつ、実戦部隊だけを意味するとは断定しない訳語とした。
- issue: בְנֵי יִשְׂרָאֵלの表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の父祖名に基づく親族的表現を本文に残し、現代日本語でより慣用的な民族名は脚注に示した。
- issue: בִּשְׁפָטִים גְּדֹלִיםの数と手段性
  choice: 大いなるさばきによって
  alternative: 数々の大いなるさばきをもって
  rationale: 前置詞בの手段的意味を「によって」で示した。ヘブライ語の複数は複数の裁きの行為とも読めるため、その読みを脚注に残した。
translation_notes:
  register: 現代標準日本語による、明瞭で格調ある叙述。「ファラオ」「エジプト」は一般的な聖書用語を採用し、「さばき」は神の司法的行為という含意を保つため平仮名表記とした。原文の同格関係は読点を重ねず「すなわち」で明示した。
