  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: ja
  text: ヤハウェがナイル川を打ってから、七日が過ぎた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤハウェがナイル川を打ってから、七日が満ちた」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「ナイル川」。文脈によっては、より一般的に「川」と訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: 満ちた
  rationale: 時間の一区切りが満了したことを表すニファル形の結果的な意味を保ちつつ、簡潔で格調ある日本語とした。日常的には「過ぎた」とも訳せる。
- source_word: שִׁבְעַת יָמִים
  choice: 七日
  rationale: 七日間という期間を示す素直な数詞句。日本語では文脈上「七日」で期間を明確に表せる。
- source_word: אַחֲרֵי
  choice: してから
  rationale: 後続する時を示す時間的関係を、自然な日本語の接続表現で示した。
- source_word: הַכּוֹת
  choice: 打って
  rationale: נכהの不定詞連語形。「打つ」は災いとして川を打つという裁きの文脈を保ち、古語調に偏らない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: הַיְאֹר
  choice: ナイル川
  rationale: 出エジプト記の文脈では一般的な川ではなくナイル川を指すため、指示対象を明確にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を称号へ置換せずに示す。「エホバ」は別の慣用的音写だが、ここでは原語の推定発音により近い「ヤハウェ」を採った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、物語本文にふさわしい簡潔で格調ある文体とした。「七日が満ちた」により原文の表現を保ち、より慣用的な読みは脚注に示した。
