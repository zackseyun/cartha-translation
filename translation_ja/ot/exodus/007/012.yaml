  text: וַ/יַּשְׁלִ֨יכוּ֙ אִ֣ישׁ מַטֵּ֔/הוּ וַ/יִּהְי֖וּ לְ/תַנִּינִ֑ם וַ/יִּבְלַ֥ע מַטֵּֽה אַהֲרֹ֖ן אֶת מַטֹּתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/012.yaml
  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: ja
  text: 彼らがそれぞれ自分の杖を投げ下ろすと、それらは大蛇[a]になった。しかし、アロンの杖は彼らの杖をのみ込んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「竜」または「巨大な爬虫類」。ヘブライ語タンニーンは、通常の「蛇」を表す語よりも広く、蛇に似た生き物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: 投げ下ろすと
  rationale: שׁלךの投げる動作と場面上の下向きの動きを自然な現代日本語で表した。後続する変化とのつながりも明瞭になる。
- source_word: אִישׁ מַטֵּהוּ
  choice: それぞれ自分の杖を
  rationale: אִישׁの分配的な意味と、単数の所有接尾辞「彼の」を、日本語で自然な「それぞれ自分の」によって保持した。
- source_word: מַטֶּה / מַטֹּתָם
  choice: 杖／彼らの杖
  rationale: מַטֶּהの具体的な携行物としての意味を「杖」で表し、原文の単数・複数の区別は日本語の文脈と「彼らの」によって示した。
- source_word: וַיִּהְיוּ
  choice: それらは……になった
  rationale: היהがここで表す変化・結果を、過度に説明せず明確に訳した。
- source_word: לְתַנִּינִם
  choice: 大蛇
  rationale: תַּנִּיןは通常の「蛇」より広く、大型の蛇状生物や怪物的爬虫類を指し得る。文脈に即して理解しやすい「大蛇」を本文に置き、語義の幅を脚注に残した。
- source_word: וַיִּבְלַע
  choice: のみ込んだ
  rationale: בלעの「呑み込む、飲み尽くす」という具体的動作を、自然で簡潔な日本語にした。
- source_word: אֶת
  choice: （目的語標識のため訳語なし）
  rationale: 定目的語を示す文法標識であり、日本語では語順と助詞「を」によって統語的に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位のある物語文とした。「それぞれ自分の」で原文の分配性を保ち、接続詞וַの連続は日本語として自然な「すると」「しかし」で整理した。脚注記号[a]は該当語の直後に置いた。
