base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: ja
  text: ナイル川[a]の魚は死に、ナイル川は悪臭を放った。そのため、エジプト人はナイル川の水を飲むことができなかった。また、エジプト全土に血があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「イェオル」は川や水路を指す語で、出エジプト記では特にナイル川を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: 魚
  rationale: 単数形ながら集合的に川の魚全体を指すため、日本語では自然な総称として「魚」とした。
- source_word: יְאֹר
  choice: ナイル川
  rationale: 出エジプト記の文脈ではエジプトのナイル川を指す。最初の箇所で固有の指示対象を明示し、続く箇所では文脈に応じて「川」または「ナイル川」とした。
- source_word: מֵתָה
  choice: 死に
  rationale: 物語の出来事の連続を表す完了した動作として、簡潔に訳した。
- source_word: וַיִּבְאַשׁ
  choice: 悪臭を放った
  rationale: 腐敗して臭くなる、または悪臭を放つ意味を、明瞭で品位ある現代日本語で表した。
- source_word: וְלֹא יָכְלוּ
  choice: 飲むことができなかった
  rationale: 能力・可能性の否定を明確に表した。
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: ナイル川の水を飲む
  rationale: 原文に明示された「水」を省かず、日本語として自然な形にした。
- source_word: וַיְהִי הַדָּם בְּכָל אֶרֶץ מִצְרָיִם
  choice: 血はエジプト全土に及んだ
  rationale: 血がエジプトの地の至る所に存在したという範囲を自然に表しつつ、「満たした」「覆った」など原文以上に強い像は避けた。
