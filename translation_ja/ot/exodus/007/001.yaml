id: EXO.7.1
reference: Exodus 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: ja
  text: すると、ヤハウェはモーセに言った。「見よ。わたしはあなたをファラオに対して神とした[a]。あなたの兄弟アロンは、あなたの預言者となる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神のような者とした」とも理解できる。ヘブライ語は直訳すると「あなたをファラオに対して神とした」。モーセがファラオの前で神を代表する権威を持ち、アロンがその預言者として語ることを表している。
    reason: 原文の直訳的な強さと、文脈上の代表的役割の両方を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: וַיֹּאמֶר
  choice: すると、…言った
  rationale: 物語を進める接続形の順次性を、自然な現代日本語で示した。
- source_word: רְאֵה
  choice: 見よ
  rationale: 後に続く宣言へ注意を向けさせる命令形。簡潔で威厳のある表現を保った。
- source_word: נְתַתִּיךָ
  choice: わたしはあなたを…とした
  rationale: 字義は「与えた」だが、補語を伴って地位・役割を定める結果的な意味を自然に表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ヘブライ語の直接的で強い述語表現を保ち、「神のような者」と解釈的に弱めなかった。文脈上、ファラオに対する代表的権威を指すが、その説明は注に置いた。
- source_word: לְפַרְעֹה
  choice: ファラオに対して
  rationale: 関係・対象を示す前置詞の働きを、日本語で明瞭に表した。
- source_word: נְבִיאֶךָ
  choice: あなたの預言者
  rationale: 通常の「預言者」という語を保ち、「代弁者」などの説明的言い換えを避けた。
- source_word: יִהְיֶה
  choice: となる
  rationale: 文脈に即して、将来の役割を自然な日本語で示した。
theological_decisions:
- issue: モーセがファラオに対して אֱלֹהִים とされる表現
  choice: 神
  alternative: 神のような者
  rationale: 原文は比較を明示せず、モーセを「神」と述語的に表現する。神そのものへの本質的な変化ではなく、神を代表する権威ある役割だと文脈から理解できるため、本文では原文の緊張を保ち、注で意味を説明した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見よ」「預言者」は聖書文体として定着しており、一般読者にも理解可能なため保持した。
