revisions:
- from: ヤハウェはモーセに言われた。「アロンにこう言いなさい。『あなたの杖を取り、エジプトの水の上に、すなわち、その川々、ナイルの水路、池、そして水の集まるあらゆる所の上に手を伸ばしなさい。水は血となる。こうしてエジプト全土に、木の器にも石の器にも[a]、血があるようになる。』」
  to: ヤハウェはモーセに言われた。「アロンにこう言いなさい。『あなたの杖を取り、エジプトの水の上に、すなわち、その川々、ナイルの水路、池、そして水の集まるあらゆる所の上に手を伸ばしなさい。そうすれば、それらは血となる。エジプト全土に、また木の器にも石の器にも[a]、血がある。』」
  rationale: 後半を原文の存在表現に近い簡潔な日本語へ改め、「ようになる」による不必要な迂遠さを除いた。さらに、複数の水域を受ける主語を「それら」として明確化した。木と石が容器を指すという文脈的補いと、その補いの不確実性を示す脚注は維持した。
