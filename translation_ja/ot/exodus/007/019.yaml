  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「アロンにこう言いなさい。『あなたの杖を取り、エジプトの水の上に、すなわち、その川々、ナイルの水路、池、そして水の集まるあらゆる所の上に手を伸ばしなさい。そうすれば、それらは血となる。エジプト全土に、また木の器にも石の器にも[a]、血がある。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「木にも石にも」。木製や石製の器を指すと考えられるが、原文に「器」という語はない。
    reason: 原文の省略表現と解釈上の曖昧さを示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: מַטְּךָ
  choice: あなたの杖
  rationale: מַטֶּה の具体的な道具としての意味を、自然で明瞭な日本語で表した。
- source_word: וּנְטֵה יָדְךָ
  choice: 手を伸ばしなさい
  rationale: 命令形と象徴的な動作を、原文に即した自然な表現で訳した。
- source_word: נַהֲרֹתָם
  choice: その川々
  rationale: 複数形と接尾辞を保ちつつ、広義の河川を示した。
- source_word: יְאֹרֵיהֶם
  choice: ナイルの水路
  rationale: יְאֹר はエジプトの文脈でナイル川に属する水路を指しうるため、נָהָר との区別も伝わるようにした。
- source_word: אַגְמֵיהֶם
  choice: 池
  rationale: たまり水や湿地性の水域を表す語を、列挙の中で理解しやすい語にした。
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: 水の集まるあらゆる所
  rationale: מִקְוֶה の『水が集められた所・水の集まり』という幅を保ち、人工の貯水池だけに限定しなかった。
- source_word: וְיִהְיוּ דָם
  choice: 水は血となる
  rationale: 直前に列挙された水を自然に受け、命令の結果を明確に示した。
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: 木の器にも石の器にも
  rationale: 文脈上は木製・石製の容器を指す省略表現と考えられるため本文では意味を補ったが、原文の簡潔さと曖昧さは脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を称号へ置換せず、神がイスラエルに示した名として訳文に保持した。
- issue: וּבָעֵצִים וּבָאֲבָנִים の解釈
  choice: 木の器にも石の器にも
  alternative: 木にも石にも
  rationale: 節全体が水の所在を列挙しているため、素材名を容器の換喩と理解するのが文脈に適う。ただし原文には『器』が明記されていないため、直訳を脚注で示して解釈上の余地を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の命令にふさわしい簡潔で品位ある文体とした。水域の列挙は反復を適度に整理しつつ、原文の包括性を保った。
