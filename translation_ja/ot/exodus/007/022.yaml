language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: ja
  text: しかし、エジプトの呪術師たちも、自分たちの秘術によって同じことを行った[a]。ファラオの心はかたくなになり[b]、彼らの言うことを聞き入れなかった。ヤハウェが語られたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの呪文によって」または「自分たちの魔術によって」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「ファラオの心は強情になった」とも訳せる。この節のヘブライ語は、心をかたくなにした者を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 同じことを行った
  rationale: 直訳的には「そのように行った」。直前のしるしと同じことを呪術師たちが行ったというつながりを、自然な日本語で明確にした。
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: エジプトの呪術師たち
  rationale: ファラオに仕え、儀礼や秘術によってしるしをまねる専門家を指す。文脈に即し、現代の読者にも理解しやすい「呪術師」とした。
- source_word: בְּלָטֵיהֶם
  choice: 自分たちの秘術によって
  rationale: 前置詞の手段を示す意味と、隠された魔術的技法という語感を保つ。「自分たちの」は主語との対応を自然に示す。
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: ファラオの心はかたくなになり
  rationale: この節のヘブライ語は、心が強固になった結果を述べるが、その作用者を明示しない。「かたくなになり」は、神またはファラオ自身を作用者として補わず、曖昧さを保つ。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 彼らの言うことを聞き入れなかった
  rationale: שׁמע אֶל は「耳を傾ける、聞き入れる」の意。「聞き入れなかった」は、単に音声を聞かなかったのではなく、モーセとアロンの言葉に応じなかったことを自然に表す。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェが語られたとおりであった
  rationale: すでに告げられていた言葉が実現したことを示す定型句として訳した。日本語では神への敬意を表す尊敬表現を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
theological_decisions:
- issue: ファラオの心がかたくなになったことの作用者
  choice: 「ファラオの心はかたくなになり」とし、作用者を明示しない。
  alternative: 「神がファラオの心をかたくなにした」または「ファラオが自分の心をかたくなにした」。
  rationale: この節自体は、誰が心をかたくなにしたのかを明示していない。周辺箇所に基づいて作用者を補わず、原文の神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語本文にふさわしい落ち着いた格調を保った。「呪術師」「秘術」は古すぎず軽すぎない語を選び、「聞き入れなかった」で文脈上の拒絶を自然に示した。
