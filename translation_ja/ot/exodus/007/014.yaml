  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: ja
  text: そこで、ヤハウェはモーセに言った。「ファラオの心は重い[a]。彼は民を行かせることを拒んでいる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心はかたい」。ヘブライ語の形容詞は字義的には「重い」で、ここでは頑なさや反応の鈍さを表す比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで、…言った
  rationale: ワウ継続法による物語の進行を、現代日本語で自然な順接として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語表記で音写した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している人名表記を用いた。
- source_word: כָּבֵד
  choice: 重く
  rationale: 字義的な「重い」という比喩を本文に残し、頑なさ・鈍さという含意を解釈だけで置き換えないようにした。
- source_word: לֵב פַּרְעֹה
  choice: ファラオの心
  rationale: ヘブライ語の連語関係を自然な日本語の所有表現で示した。
- source_word: מֵאֵן
  choice: 拒んでいる
  rationale: 分詞が表す継続的な拒否の状態を「拒んでいる」で表した。
- source_word: לְשַׁלַּח
  choice: 去らせる
  rationale: 使役的な「送り出す、行かせる」を簡潔に表し、出発を許さない文脈にも適合させた。
- source_word: הָעָם
  choice: 民
  rationale: 原文どおり対象を明示的にイスラエルと補わず、文脈上特定された集団として訳した。
theological_decisions:
- issue: ファラオの心の状態と「心をかたくする」主題
  choice: ファラオの心は重く
  alternative: ファラオの心はかたく
  rationale: この節の כָּבֵד は字義的には「重い」であり、出エジプト記の心をかたくする記事に現れる語彙の違いを保つため、「かたい」に統一しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神名は「ヤハウェ」、王号は文脈と定着度を考慮して「ファラオ」とした。字義的比喩「心は重い」は保持し、脚注で意味を補った。
