source:
  edition: WLC
  text: וְ/שָׁרַ֣ץ הַ/יְאֹר֮ צְפַרְדְּעִים֒ וְ/עָלוּ֙ וּ/בָ֣אוּ בְּ/בֵיתֶ֔/ךָ וּ/בַ/חֲדַ֥ר מִשְׁכָּבְ/ךָ֖ וְ/עַל מִטָּתֶ֑/ךָ וּ/בְ/בֵ֤ית עֲבָדֶ֨י/ךָ֙ וּ/בְ/עַמֶּ֔/ךָ וּ/בְ/תַנּוּרֶ֖י/ךָ וּ/בְ/מִשְׁאֲרוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: ja
  text: ナイル川はカエルで満ちあふれ、カエルはそこから上がって来て、あなたの家、寝室、寝床の上に入り込み、あなたの家来たちの家々、あなたの民の間、あなたのかまど、こね鉢[a]にも入り込む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「こね桶」。
    reason: מִשְׁאֲרוֹת は生地をこねる容器を指すが、その形状は特定できず、「鉢」と「桶（こね舟・こね槽）」のいずれの訳語も可能である。
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: 群がり
  rationale: 小動物が大量に発生して満ちるという שׁרץ の生き生きとした意味を自然な日本語で表す。災害予告の文脈による未来の意味は文全体で伝わる。
- source_word: הַיְאֹר
  choice: ナイル川
  rationale: 出エジプト記のエジプトという文脈では יְאֹר はナイル川を指すため、単なる「川」より明確である。
- source_word: צְפַרְדְּעִים
  choice: カエル
  rationale: 複数形だが、日本語では集合的に「カエル」とするのが自然である。
- source_word: וְעָלוּ
  choice: そこから上がって来て
  rationale: 川から陸上や家屋へ上がる動きを明示し、話し手側への方向感を自然に表す。
- source_word: וּבָאוּ
  choice: 入り／入り込む
  rationale: 後続する ב 句とともに各所への侵入を表す。列挙を自然に結びつつ、侵入の印象を保つ。
- source_word: בְּבֵיתֶךָ
  choice: あなたの家
  rationale: ここでは一連の具体的な場所の一つとして、ファラオの住居を指す。
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: 寝室
  rationale: 直訳的には「あなたが寝る部屋」であり、現代日本語の「寝室」が簡潔で明確である。
- source_word: וְעַל מִטָּתֶךָ
  choice: 寝床
  rationale: על の「上に」という関係は侵入先の列挙の中で自然に含意される。「寝床」は身近でありつつ品位を保つ。
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: あなたの家臣たちの家
  rationale: 単数形の בית は複数の家臣それぞれの家を分配的に指すと理解できる。עֲבָדִים はここではファラオに仕える者たちなので「家臣たち」とした。
- source_word: וּבְעַמֶּךָ
  choice: あなたの民のところ
  rationale: 直訳的な「あなたの民に」だけでは日本語で侵入先として不自然なため、「ところ」を補って民の生活圏に及ぶ意味を示す。
- source_word: וּבְתַנּוּרֶיךָ
  choice: あなたのかまど
  rationale: תַּנּוּר はパンなどを焼く家庭用の炉を指す。「かまど」は古代の設備に適し、一般読者にも理解しやすい。
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: こね鉢
  rationale: パン生地をこねるための容器を指す語として、簡潔で理解しやすい。「こね桶」も可能だが、容器の厳密な形状は確定しない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、原文の畳みかける列挙とカエルの侵入の生々しさを保った。「寝室」「寝床」、「家」「家臣たちの家」の反復は原文の具体性を優先した。英語相談訳の脚注は本文中の位置と内容が対応していないため継承せず、ヘブライ語本文に即して脚注なしとした。
