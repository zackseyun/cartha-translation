    rationale: בְעַמֶּךָ は直訳すれば「あなたの民の中に／間に」であり、「あなたの民の間にも」が自然かつ簡潔である。
  - severity: low
    issue: 「家臣たち」は עֲבָדֶיךָ を公的な家臣に狭めうる。
    rationale: この語はファラオに属する僕・仕える者を広く指し、「家来たち」は文脈に合い、過度の限定を避ける。
