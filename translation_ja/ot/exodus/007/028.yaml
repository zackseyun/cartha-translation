revisions:
- from: ナイル川にはカエルが群がり、カエルはそこから上がって来て、あなたの家、寝室、寝床に入り、また、あなたの家臣たちの家、あなたの民のところ、あなたのかまど、こね鉢にも入り込む。
  to: ナイル川はカエルで満ちあふれ、カエルはそこから上がって来て、あなたの家、寝室、寝床の上に入り込み、あなたの家来たちの家々、あなたの民の間、あなたのかまど、こね鉢[a]にも入り込む。
  rationale: 原文の場所を示す前置詞を保つため、「寝床の上に」を明記した。「民のところ」を「民の間」に改め、侵入が民全体に及ぶことを自然に表した。また、עֲבָדֶיךָ の意味を不必要に官僚・廷臣へ限定しないよう「家来たち」とし、分配的な単数の בית を「家々」と訳した。容器名の語義の幅は脚注で示した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:00Z'
