  source_fidelity: 要修正です。原文の וְעַל מִטָּתֶךָ は「あなたの寝床の上に」であり、現行の「寝床に入り」は前置詞 על（～の上に）を弱めています。また、בְעַמֶּךָ は民の生活圏への侵入をいうため、「あなたの民の間にも」とするほうが自然で原文に即しています。
  naturalness: 全体として明瞭な現代日本語ですが、「ナイル川にはカエルが群がり」は「ナイル川はカエルで満ちあふれ」とすると、川がカエルで一面になる災厄の描写をより自然に伝えます。「家臣たち」は官僚・廷臣に限定して響きうるため、「家来たち」が עֲבָדֶיךָ の広い意味により適します。
  terminology: 「ナイル川」「カエル」「寝室」「かまど」は適切です。מִשְׁאֲרוֹתֶיךָ の容器の形状には幅があるため、本文を「こね鉢」とし、代替訳「こね桶」を脚注で示すのが安全です。
  issues:
