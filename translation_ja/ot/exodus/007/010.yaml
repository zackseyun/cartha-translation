  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: ja
  text: こうして、モーセとアロンはファラオのもとに行き、ヤハウェが命じたとおりに行った。アロンが自分の杖をファラオの前、またその家臣たちの前に投げると、それは蛇[a]になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「蛇」と訳したヘブライ語は、竜のような生き物や大型の爬虫類を指すこともある。ここでは、ファラオの前で行われたしるしとしての蛇を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 行き
  rationale: 動詞は形の上では単数だが、後に続く複合主語「モーセとアロン」をまとめて受けている。ファラオのいる所へ向かう動きを、自然な現代日本語で表した。
- source_word: וַיַּעַשׂוּ כֵן
  choice: そのとおりに行った
  rationale: 命令されたことをそのとおり実行したというヘブライ語の慣用的な意味を明瞭に表す。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 命じたとおりに
  rationale: 先に与えられた命令との正確な一致を示す構文の意味を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: וַיַּשְׁלֵךְ
  choice: 投げ下ろすと
  rationale: 杖をしるしとして人々の前に投げる動作を、明確で自然な表現にした。
- source_word: מַטֵּהוּ
  choice: 自分の杖
  rationale: 接尾辞がアロンを指すことを明示し、מַטֶּהを現代日本語で一般的な「杖」と訳した。
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: ファラオとその家臣たちの前に
  rationale: 日本語では並列をまとめて自然に表しつつ、この行為がファラオと家臣たちの面前で公然と行われた意味を保持した。
- source_word: עֲבָדָיו
  choice: その家臣たち
  rationale: 語の基本義は「しもべ、僕」だが、王宮の文脈では王に仕える者たちを指すため、「家臣」が自然で正確である。
- source_word: וַיְהִי לְתַנִּין
  choice: それは大蛇になった
  rationale: תַנִּיןは文脈により蛇、竜のような生き物、大型の爬虫類などを指し得る。このしるしの場面では「大蛇」が自然だが、語義の広がりは脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を直接用いているため、称号で代用せず「ヤハウェ」と音写した。
- issue: תַנִּין の訳し方
  choice: 大蛇
  alternative: 竜のような生き物／大型の爬虫類
  rationale: 杖が変化するこの場面では「大蛇」が最も理解しやすい。一方、語そのものの意味範囲はより広いため、別の可能性を脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で物語の展開をつなぎ、「ファラオ」「ヤハウェ」は本文全体で統一しやすい表記とした。逐語的な反復は日本語として不自然にならない範囲で整理したが、命令への服従と、公の面前で行われたしるしという要点は保持した。
