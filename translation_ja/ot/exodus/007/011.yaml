base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: ja
  text: そこでファラオも、知恵のある者たちと呪術師たちを呼び寄せた。彼ら、すなわちエジプトの魔術師たちも、自分たちの秘術[a]によって同じことを行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「秘術によって」は「呪文によって」とも訳せる。このヘブライ語は呪術的な技や呪文を指すと考えられるが、正確なニュアンスは不確かである。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せた
  rationale: この文脈のקראは、人々を自分のもとへ召集することを表す。「呼び寄せた」はその指示的な意味を自然な現代日本語で伝える。
- source_word: גַּם
  choice: も
  rationale: ファラオも先の出来事に応じて行動したことを示す付加の意味を簡潔に表す。
- source_word: חֲכָמִים
  choice: 知恵ある者たち
  rationale: 宮廷の学識者・専門家を指す語であり、原語の「賢い者」という広がりを保ちつつ平明に訳した。
- source_word: מְכַשְּׁפִים
  choice: 呪術師たち
  rationale: כשׁףに由来し、呪術を行う者を指す。後に出るחַרְטֻמִּיםとの語の区別を保つため、「魔術師」と訳し分けた。
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: 同じことを行った
  rationale: כֵּןは直前のしるしを指し、その再現を表す。「同じことを行った」が自然で明確である。
- source_word: גַם הֵם
  choice: 彼ら…も
  rationale: ファラオ側の専門家も同様に行ったという強調を保持する。
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: エジプトの魔術師たち
  rationale: 出エジプト記でファラオに仕える儀礼的専門家を指す定型的な語。「エジプトの」により連語関係も保った。
- source_word: בְּלַהֲטֵיהֶם
  choice: 自分たちの秘術によって
  rationale: 行為の手段を表す。לַהַטの正確なニュアンスには不確かさがあるため、特定の技法に限定せず、秘教的・呪術的な術を示せる「秘術」を採用した。
theological_decisions:
- issue: エジプトの魔術師たちの力の性質
  choice: 「秘術によって同じことを行った」と現象を記述するにとどめる
  alternative: 超自然的な力による実在の奇跡、または手品や欺きだったと明示する
  rationale: ヘブライ語本文は彼らが同じことを行ったと述べるが、その仕組みが悪霊的な力、幻術、手品のいずれだったかは説明していないため、解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「呪術師」と「魔術師」を訳し分けて原語二語の区別を保持し、「彼ら、すなわち」によって後者が前述の集団を説明する同格表現であることを示した。
