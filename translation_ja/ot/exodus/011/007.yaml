  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: ja
  text: しかし、イスラエルの子らのだれに対しても、人にも家畜にも、犬一匹も舌を鋭くすることはない[a]。それは、ヤハウェがエジプトとイスラエルとの間に区別をつけられることを、あなたがたが知るためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「犬一匹ほえかかることはない」。犬が人や家畜にほえかかることさえない、すなわちイスラエルが害を受けず安全であることを表す慣用的な言い回し。
    reason: 「舌を鋭くする」というヘブライ語の比喩は日本語では意味が伝わりにくいため、その慣用的な意味を示す。
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: しかし、イスラエルの子らに対しては
  rationale: 接続詞を前節との強い対照として「しかし」とし、לְ を敵対的な作用の向かう先を示す「に対して」とした。בְּנֵי יִשְׂרָאֵל は原文の系譜的・共同体的表現を保って「イスラエルの子ら」と訳した。
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: 犬一匹、その舌を鋭くすることはない
  rationale: חרץ と「舌」の鮮明な比喩を本文に残した。犬がほえる、あるいは威嚇することを表す慣用句と考えられるため、自然な意味は脚注で示した。
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: 人にも家畜にも
  rationale: 人間から家畜までを包含する全範囲を、現代日本語で簡潔に表した。前置詞句が犬の行為の対象を示すことも明瞭になる。
- source_word: לְמַעַן תֵּדְעוּן
  choice: あなたがたが知るためである
  rationale: לְמַעַן の目的を明示し、二人称複数形も「あなたがた」で保持した。
- source_word: יַפְלֶה
  choice: 区別を設けられる
  rationale: この文脈のヒフィル形は、驚異を行うことよりも、二者を分けて異なる扱いをすることを表す。「区別を設ける」はその関係的な対照を明確にする。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文に記された神の固有名を日本語で一般的な音写により示した。
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: エジプトとイスラエルとの間に
  rationale: 原文どおり二つの国民共同体の名称を保ち、両者の対照を表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が四文字神名を直接用いているため、称号「主」への代替を避け、固有名として音写した。「エホバ」は伝統的形だが、原語の推定発音により近い「ヤハウェ」を採用した。
- issue: יַפְלֶה が示す神の行為
  choice: エジプトとイスラエルとの間に区別を設けられる
  alternative: 不思議を行われる
  rationale: 語根には「驚くべきこと」の語義領域もあるが、בֵּין ... וּבֵין ... という構文と災いの文脈は、ここでは両者を分けて異なる扱いをする意味を強く示す。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、神名と目的節を含む宣言の荘重さを保った。「犬一匹、その舌を鋭くする」は意図的に原文の像を残し、読者の理解を脚注で補う。神への敬意は「設けられる」で自然に表したが、原文にない神学的説明は加えていない。
