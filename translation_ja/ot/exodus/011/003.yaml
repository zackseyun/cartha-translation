  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: ja
  text: ヤハウェは、エジプト人が民に好意を抱くようにされた。[a] また、モーセという人[b]は、エジプトの地で、ファラオの家臣たち[c]にも民[d]にも、非常に偉大な人物と見なされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「ヤハウェは、エジプト人の目に民に好意を与えた」。これは、エジプト人が民を好意的に見るようになったことを表す。
    reason: lexical_alternative
  - marker: b
    text: 原文は「その人モーセ」または「人物モーセ」とも訳せる強調された言い方。
    reason: lexical_alternative
  - marker: c
    text: 原語は字義的には「ファラオの僕たち」。ここではファラオに仕える役人や側近を指す。
    reason: lexical_alternative
  - marker: d
    text: ここでの「民」は、ファラオの家臣たちと対比される、エジプトのより広い一般民衆を指す可能性が高い。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、現代日本語で一般的な音写によって示した。
- source_word: וַיִּתֵּן ... חֵן
  choice: 好意を得るようにされた
  rationale: 直訳は「好意を与えた」だが、この構文は他者から好意的に扱われるようにすることを表す。神の働きを保ちつつ自然な日本語にした。
- source_word: הָעָם
  choice: 民
  rationale: 文脈上はイスラエルの民を指すが、原文は民族名を明記せず「民」としているため、その表現を保った。
- source_word: הָאִישׁ מֹשֶׁה
  choice: モーセという人物
  rationale: 固有名の前に「人・人物」を表す語が明記されている。その強調を不自然にならない日本語で残した。
- source_word: גָּדוֹל מְאֹד
  choice: 非常に偉大な者
  rationale: 「大きい、偉大な」の意味の広がりを保ち、「高官」「有力者」など特定の社会的地位に狭めなかった。
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: ファラオの家臣たちにも
  rationale: עבדは字義的には「僕、仕える者」だが、王宮の文脈では官僚や側近を含むため、現代日本語では「家臣」が自然である。
- source_word: וּבְעֵינֵי הָעָם
  choice: 民にも
  rationale: 原文の「民」をそのまま保ち、それがエジプトの一般民衆を指すという蓋然性は注で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある神の固有名を称号で代替せず音写した。特定の教派的解釈を付加するものではない。
- issue: モーセの「偉大さ」の性質
  choice: 非常に偉大な者と見られていた
  alternative: 非常に重んじられていた／非常に有力であった
  rationale: 原文はモーセの偉大さが名声、評価、権勢のどれに限られるかを明示しないため、その幅を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「民」「エジプトの地」など原文の反復と語感を残しつつ、ヘブライ語の慣用句「目に」を日本語として自然な評価表現にした。
