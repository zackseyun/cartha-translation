  to: ヤハウェはモーセに言った[a]。「ファラオはあなたがたに耳を傾けない[b]。それは、わたしの不思議なわざをエジプトの地で増し加えるためである[c]。」
  rationale: 目的を表す לְמַעַן を「ためである」で保ちつつ、רְבוֹת の『増加する／増し加える』という意味を本文に明示した。「増し加える」は、神がご自身の不思議・しるしを増やすという文脈上の含意を保つが、硬化に関する神学的説明を追加しない。
