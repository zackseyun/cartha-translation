  terminology: 「ヤハウェ」「モーセ」「ファラオ」は一貫して適切である。מוֹפֵת に対する「不思議なわざ」は可能だが、「数多く行う」は『増える／増し加わる』という語義を弱めるため修正する。脚注は代替訳と複数形の説明を適切に示している。
