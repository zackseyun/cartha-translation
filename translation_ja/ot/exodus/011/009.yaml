reference: Exodus 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: ja
  text: ヤハウェはモーセに言った[a]。「ファラオはあなたがたに耳を傾けない[b]。それは、わたしの不思議なわざをエジプトの地で増し加えるためである[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈とのつながりを示すため、「モーセに以前こう言っていた」と訳すこともできる。ただし、ヘブライ語の動詞形自体は通常の物語過去である。
    reason: alternative_reading
  - marker: b
    text: 別訳「あなたがたの言うことを聞き入れない」。ここでの「あなたがた」は複数で、モーセとアロンを指す。
    reason: lexical_alternative
  - marker: c
    text: 「不思議なわざ」は「しるし」または「驚くべきしるし」とも訳せる。ヘブライ語は、驚異、しるし、前兆を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって表した。
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 標準的な物語叙述の過去として訳した。文脈上「以前に言っていた」と理解する余地はあるが、ヘブライ語の形自体は過去完了を明示しない。
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: あなたがたに耳を傾けない
  rationale: שׁמע אֶל の「聞く、聞き入れる」という意味を自然な日本語で表し、単なる聴覚ではなく応答を拒む含みを保った。複数接尾辞を「あなたがた」として明示した。
- source_word: לְמַעַן
  choice: それは、…ためである
  rationale: 目的を示す力を明確にしつつ、結果だけを述べる訳には弱めなかった。
- source_word: רְבוֹת מוֹפְתַי
  choice: わたしの不思議な業を…数多く行う
  rationale: 直訳的な「わたしの不思議が増える」を、使役的・結果的な含意が伝わる自然な日本語にした。מוֹפֵת の驚異的な出来事という面を「不思議な業」で表した。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: אֶרֶץ を省略せず、簡潔で自然な日本語にした。
theological_decisions:
- issue: ファラオの拒絶と神の目的との関係
  choice: 「それは、…ためである」と目的を示す
  alternative: 「その結果、…数多く行われる」と結果を示す
  rationale: לְמַעַן はここでは目的を表すのが最も自然である。ファラオの拒絶と神の目的を並存させ、かたくなさに関する体系的説明を本文へ補わなかった。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。「ファラオ」「ヤハウェ」は一般読者にも識別しやすい表記を採用した。目的を示す神学的緊張を保ち、説明的な教義を付加していない。
