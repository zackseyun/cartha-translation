base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: ja
  text: すると、あなたの家臣たちは皆、私のところに下って来て、私の前にひれ伏し、『あなたも、あなたに従う民も皆、出て行ってください』と言うでしょう。その後で、私は出て行きます。」こうしてモーセは、激しい怒りに燃えてファラオのもとを立ち去った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: 下って来て
  rationale: ירדの下降の方向性を保ちつつ、話者モーセの視点へ向かう動きを自然な日本語で表した。
- source_word: עֲבָדֶיךָ
  choice: あなたの家臣たち
  rationale: ここではファラオに仕える宮廷の臣下・役人を指すため、「僕」や「奴隷」より文脈に適した「家臣」とした。
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: 私の前にひれ伏し
  rationale: 身体を低くして敬意や服従を示す動作を表し、この宮廷場面で礼拝の意味に限定しない訳語とした。
- source_word: צֵא אַתָּה
  choice: あなたも……出て行ってください
  rationale: 命令形と強調された代名詞אַתָּהを反映した。家臣がモーセに懇願する場面として、命令の内容を丁寧な直接話法で自然に表現した。
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: あなたに従う民も皆
  rationale: 直訳では「あなたの足もとにいる民すべて」だが、随行・追従する者を指す慣用表現の意味を明瞭にした。
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: その後で、私は出て行きます
  rationale: 時間的順序をそのまま保ち、同じיצאには「出て行く」を一貫して用いた。
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: こうしてモーセは……ファラオのもとを立ち去った
  rationale: ヘブライ語では主語が省略されているが、文脈上モーセであることを日本語で明示した。「立ち去った」はמֵעִםの離脱を自然に表す。
- source_word: בָּחֳרִי אָף
  choice: 激しい怒りに燃えて
  rationale: 怒りの熱さを表す比喩と、その強烈さの双方を自然な日本語で保持した。
theological_decisions:
- issue: וְהִשְׁתַּחֲוּוּの行為の性格
  choice: ひれ伏す
  alternative: 礼拝する
  rationale: この文脈ではファラオの家臣がモーセに服従・懇願の姿勢を取ることであり、神への礼拝に限定する根拠はない。
- issue: אֲשֶׁר בְּרַגְלֶיךָの関係
  choice: あなたに従う
  alternative: あなたの足もとにいる
  rationale: 原文の身体的比喩を字義通り固定せず、モーセに同行し従う民という慣用的意味を本文で明らかにした。
translation_notes:
  register: 明瞭で現代的ながら、対決場面の荘重さを保つ文体とした。直接話法では家臣からモーセへの懇願を日本語として自然な丁寧表現にした。英語相談層の脚注記号は本文内容との対応が崩れていたため踏襲せず、原文に基づき脚注なしとした。
