  to: すると、あなたの家臣たちは皆、私のところに下って来て、私の前にひれ伏し、『あなたも、あなたに従う民も皆、出て行ってください』と言うでしょう。その後で、私は出て行きます。」こうしてモーセは、激しい怒りに燃えてファラオのもとを立ち去った。
