source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: ja
  text: エジプトの地の初子はみな死ぬ。王座についているファラオの初子から、ひき臼の後ろにいる女奴隷[a]の初子に至るまで、また家畜の初子もみな死ぬ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女の召使い」とも訳せるが、ヘブライ語は隷属的身分にある女性を指す。「ひき臼の後ろ」は、穀物をひく低い身分の労働を描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: 死ぬ
  rationale: 預言的告知に用いられた完了形であり、文脈上は来る災いを確実なこととして述べている。日本語では非過去形「死ぬ」が自然にその確定的な未来を表す。
- source_word: כָּל בְּכוֹר
  choice: 初子はみな
  rationale: כָּל の分配的・包括的な意味を自然な日本語で示しつつ、人にも家畜にも用いられる בְּכוֹר を一貫して「初子」とした。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地の
  rationale: 地理的表現を省略せず、現代日本語として明瞭な形で保った。
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: 初子から……初子に至るまで
  rationale: 最高位の王家から最下層の労働者までという社会的全範囲を示す構文を保った。
- source_word: הַשִּׁפְחָה
  choice: 女奴隷
  rationale: この語が示す隷属的身分を曖昧にせず、ファラオとの強い社会的対照を現代日本語で明示した。
- source_word: אַחַר הָרֵחָיִם
  choice: ひき臼の後ろにいる
  rationale: 穀物をひく低い身分の労働を描く具体的な空間表現を保った。
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: また家畜の初子もみな死ぬ
  rationale: בְּהֵמָה を特定の畜種に限定せず「家畜」とし、原文では前半の動詞が後半にも及ぶことを日本語では明示して読みやすくした。
theological_decisions:
- issue: שִׁפְחָה が表す社会的身分
  choice: 女奴隷
  alternative: 女の召使い／下女
  rationale: 身分的拘束を弱める語を避け、災いが王家から隷属労働者にまで及ぶという原文の修辞的・社会的対照を保った。
- issue: הַיֹּשֵׁב עַל כִּסְאוֹ の係り先
  choice: 本文では「王座についているファラオ」と読める語順にし、別の係り方を脚注で示す
  alternative: 王座につくファラオの初子／王座についているファラオの初子
  rationale: 男性単数の分詞句は文法上、ファラオまたはその初子に関連づけて理解し得るため、一方だけを無言で排除せず脚注で曖昧さを開示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「初子」は聖書語として定着しており、人間と家畜の双方に適用できるため採用した。原文の社会的両極と、ひき臼という具体的な像を保持した。
