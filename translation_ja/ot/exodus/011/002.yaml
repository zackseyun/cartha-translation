source:
  edition: WLC
  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: ja
  text: さあ、民に聞こえるように語りなさい。男はそれぞれ自分の隣人に、女はそれぞれ自分の隣人に、銀の品と金の品を求める[a]ように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「借りる」とも訳される。ヘブライ語の動詞は「求める、頼む」を意味し、それ自体は品物を返すことを示さない。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: さあ、…語りなさい
  rationale: דַּבֶּר は直接的な命令「語れ」。נָא は文脈上、丁寧な懇願よりも促しや切迫感を表すため、現代日本語で自然な「さあ」とした。
- source_word: בְּאָזְנֵי הָעָם
  choice: 民に聞こえるように
  rationale: 直訳は「民の耳に」だが、公に、民が聞くように告げるというヘブライ語の慣用的意味を明確で自然な日本語にした。
- source_word: וְיִשְׁאֲלוּ
  choice: 求める…ように
  rationale: 命令に続く指令的な未完了形の力を保った。「求める」は שאל の「求める、頼む」を表し、返却を前提とする「借りる」に意味を限定しない。
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: 男はそれぞれ隣の男に
  rationale: אִישׁ の分配的な単数と、後続する女性との対句を保持した。רֵעַ は友人・仲間・隣人を広く指し得るが、ここでは生活圏の近い相手を自然に示す「隣の男」とした。
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: 女はそれぞれ隣の女に
  rationale: 男性句と対応する女性形および分配的表現を明示し、原文の平行構造を保った。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 銀の品と金の品
  rationale: כְּלִי は器、道具、装身具などを含み得る広い語なので、種類を不必要に限定しない「品」とした。
theological_decisions:
- issue: イスラエル人が周囲の者から貴重品を受ける場面における שאל の訳
  choice: 求める
  alternative: 借りる
  rationale: שאל 自体は「求める、頼む」を意味し、返却義務を含意しない。伝統的な「借りる」は解釈に影響するため本文では採らず、訳の伝統として脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、神の命令としての品位を保った。「民の耳に」という直訳調は避けつつ聴覚的な含意を残し、男女を並べる原文の対句も維持した。
