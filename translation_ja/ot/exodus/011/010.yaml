source:
  edition: WLC
  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: ja
  text: モーセとアロンは、ファラオの前でこれらすべてのしるし[a]を行った。そしてヤハウェはファラオの心をかたくなにされた。そしてファラオはイスラエルの子ら[c]を自分の国から去らせなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらすべての不思議」。ヘブライ語は、奇跡的な「しるし」と「不思議」のどちらも表し得る。
    reason: lexical_alternative
  - marker: c
    text: 「イスラエル人」または「イスラエルの民」とも訳せる。字義的には「イスラエルの息子たち」だが、ここではイスラエル民族全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロン
  rationale: 両人名の日本語で定着した表記を用いた。
- source_word: עָשׂוּ
  choice: 行った
  rationale: עשהの広い意味を保ちつつ、「しるし」と自然に結び付く現代日本語とした。
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: これらすべてのしるし
  rationale: מוֹפֵתには超自然的な「しるし」と「不思議」の両義がある。ここでは神の力を示す行為としての機能を表す「しるし」を本文に採用し、別訳を脚注に残した。
- source_word: לִפְנֵי פַרְעֹה
  choice: ファラオの前で
  rationale: 空間的・関係的な意味を簡潔に保つ表現であり、「ファラオの面前で」の意味にも自然に読める。
- source_word: וַיְחַזֵּק יְהוָה אֶת לֵב פַּרְעֹה
  choice: そしてヤハウェはファラオの心をかたくなにされた
  rationale: 接続詞を「そして」とし、主語である神の能動的行為を保持した。חזקの語像は「強くする・固くする」だが、この反復句の文脈上の頑迷さを自然に示す「かたくなにする」を採用した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、四文字神名を日本語で一般的な学術的音写により示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な「イスラエルの息子たち／子ら」という原文の表現を保った。ここではイスラエル民族を集合的に指すため、その意味を脚注で明示した。
- source_word: וְלֹא שִׁלַּח ... מֵאַרְצוֹ
  choice: ファラオは……自分の国から去らせなかった
  rationale: שלחの使役的な解放・送り出しの意味と、מןによる出発点を自然な日本語で表した。主語を「ファラオ」と補い、指示関係を明瞭にした。
theological_decisions:
- issue: 神がファラオの心に働きかけたことの表現
  choice: ヤハウェはファラオの心をかたくなにされた
  alternative: ヤハウェはファラオの心を強くされた／固くされた
  rationale: 原文は神を明確な主語とするヒフィル形であるため、神の行為を弱めたり、ファラオ自身の行為に置き換えたりしなかった。一方、חזקの字義的な語像を脚注に残し、神の主権と人間の責任をめぐる本文の緊張を解消しないようにした。
- issue: בְּנֵי יִשְׂרָאֵלの集合的範囲
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の親族的表現を本文に残しつつ、文脈では男女を含む民族全体を指すことを脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の連続する接続詞を「そして」「ので」で自然に整理しつつ、因果関係と物語の流れを保持した。「心をかたくなにされた」は敬語ではなく、神を主語とする際の慣用的な尊敬表現である。
