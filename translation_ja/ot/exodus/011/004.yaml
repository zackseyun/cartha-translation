id: EXO.11.4
reference: Exodus 11:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: ja
  text: そこでモーセは言った。「ヤハウェはこう言われる。『真夜中ごろ[a]、わたしはエジプトのただ中に出て行く。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「真夜中に」。ヘブライ語の表現には、時刻がおおよそであることを示し得る接頭辞が付いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……は言った
  rationale: 物語を先へ進めるワウ継続法の働きを、現代日本語で自然な順接として表した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: כֹּה אָמַר
  choice: こう言われる
  rationale: 預言者的な使者の定型句を保ちつつ、直接引用の導入として自然で品位ある日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: 真夜中ごろ
  rationale: 接頭辞 כが示し得る概数のニュアンスを本文に反映した。厳密な時点を指す「真夜中に」も脚注に残した。
- source_word: אֲנִי
  choice: わたしは
  rationale: 明示された一人称代名詞を訳出し、行為者である神への強調を保った。
- source_word: יוֹצֵא
  choice: 出て行く
  rationale: 分詞がここで表す差し迫った行為を、日本語では文脈上明瞭な非過去形で表した。
- source_word: בְּתוֹךְ
  choice: ただ中に
  rationale: エジプト内部への移動を表すと同時に、国の中枢に臨む響きを保った。
- source_word: מִצְרָיִם
  choice: エジプト
  rationale: 現代日本語で標準的な地名表記を用いた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 称号で代替せず、ヘブライ語本文の神名を明示するため、一般的な学術的音写を採用した。
- issue: כַּחֲצֹת הַלַּיְלָה の時刻表現
  choice: 真夜中ごろ
  alternative: 真夜中に
  rationale: 前置された כ の近似的用法を反映しながら、時点を厳密に示す解釈も脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を基調とし、神の告知には簡潔で品位ある表現を用いた。モーセの発言の中にヤハウェの直接話法がある構造を、二重かぎ括弧で明示した。
