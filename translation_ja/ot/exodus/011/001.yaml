  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「わたしは、あと一つの災い[a]をファラオとエジプトに下す。その後、彼はあなたがたをここから送り出す。彼があなたがたを送り出すとき、彼はあなたがたを完全にここから必ず追い出す[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「災い」は、「打撃」「災厄」「苦難」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「追い出す」に不定詞絶対形と未完了形を用い、追放が確実で徹底したものであることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず日本語で音写した。
- source_word: נֶגַע
  choice: 災い
  rationale: 基本的には打撃・災厄・苦難を表す語であり、エジプトへの神の裁きという文脈に自然に合う。より限定的な「疫病」より広い原語の意味を保つ。
- source_word: אָבִיא עַל
  choice: …に下す
  rationale: 使役形の「来させる、もたらす」と前置詞の裁きの方向性を、自然な日本語で表した。
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: あなたがたをここから去らせる
  rationale: שלח の「送り出す／去らせる」を訳し、後続のより強い「追い出す」との段階差を保った。
- source_word: כָּלָה
  choice: 一人残らず
  rationale: 副詞的な全体性・徹底性を、この文脈では民全体を残さず追放する意味として自然に表現した。
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: 必ず追い出す
  rationale: 不定詞絶対形と未完了形の同語反復による強調を「必ず」で示し、שלח より強い追放の語感を「追い出す」で保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文が固有名を用いているため、称号「主」に置換せず、一般的な学術的再建に基づく「ヤハウェ」とした。
translation_notes:
  register: 明瞭で現代的かつ威厳のある標準日本語。「去らせる」から「追い出す」への語勢の強まりを保ち、原文の強調構文は本文と脚注の双方で示した。
