- from: ヤハウェはモーセに言われた。「わたしは、あと一つの災い[a]をファラオとエジプトに下す。その後、彼はあなたがたをここから去らせる。彼があなたがたを去らせるとき、あなたがたを一人残らずここから必ず追い出す[b]。」
  to: ヤハウェはモーセに言われた。「わたしは、あと一つの災い[a]をファラオとエジプトに下す。その後、彼はあなたがたをここから送り出す。彼があなたがたを送り出すとき、彼はあなたがたを完全にここから必ず追い出す[b]。」
  rationale: 前半の שׁלח を自然な「送り出す」とし、後半の גרש をより強い「追い出す」とした。これにより、ファラオが民を去らせることから、最終的には完全に追放することへ至る原文の語勢を明確にした。「完全に」と「必ず」により、כָּלָה と不定詞絶対形＋未完了形の強調を示す。脚注bは反復という説明を文法的に正確な不定詞絶対形＋未完了形へ改めた。
