lexical_decisions:
- source_word: וְהָיְתָה
  choice: 上がる
  rationale: 預言的告知における未来の出来事として表し、צְעָקָה と自然に結び付く現代日本語にした。
- source_word: צְעָקָה גְדֹלָה
  choice: 大きな叫び声
  rationale: צְעָקָה は苦痛や悲嘆から発する大声を指し得る。「大きな」により גְדֹלָה の規模の強調を保つ。具体的な悲嘆の様態は本文で限定せず、脚注に代替表現を示した。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土に
  rationale: 国土全体に及ぶ包括的範囲を、簡潔で自然な日本語で表した。
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: そのようなことは、かつてなく
  rationale: 比較対象がこの叫びそのもの、またはその出来事であるというヘブライ語の表現を、不自然な逐語訳を避けつつ保持した。
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: 二度とない
  rationale: 否定を伴う יסף の「再び起こらない」という絶対的な将来比較を簡潔に表した。
