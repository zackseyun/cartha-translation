  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: ja
  text: 彼らは、長衣の裾に、青、紫、緋色の撚り糸でざくろの飾り[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は単に「ざくろ」と言う。この文脈では、ざくろの実そのものではなく、ざくろの形をした織物の装飾を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 彼らは…作り
  rationale: 物語を進める通常の形で、「彼らは作った」を自然な日本語の連用形で表した。
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: 上着の裾に付けた
  rationale: עַל は位置を示す。日本語では「裾に作った」より、装飾品の配置を明示する「裾に付けた」が自然である。
- source_word: רִמּוֹנֵי
  choice: ざくろの飾り
  rationale: 原文は単に「ざくろ」と呼ぶが、祭司の衣服に付ける、ざくろ形の織物装飾を指すため、誤解を避けて「飾り」を補った。原文の簡潔な呼称は脚注に示した。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の…糸
  rationale: 幕屋関連の織物を表す慣用的な三色として訳した。素材名の省略を日本語で明瞭にするため「糸」を補った。
- source_word: מָשְׁזָר
  choice: 撚り糸
  rationale: 糸を撚り合わせた織物素材を表す語であり、現代日本語で簡潔かつ具体的な「撚り糸」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。祭司の衣を指す מְעִיל は、この一節だけでも理解しやすい「上着」とした。「撚り」は常用的な表記として漢字を用いた。
