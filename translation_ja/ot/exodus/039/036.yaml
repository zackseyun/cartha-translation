  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: ja
  text: 机と、そのすべての用具と、臨在のパン[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「供えのパン」。
    reason: לֶחֶם הַפָּנִים の伝統的な訳語を示しつつ、本文では原語の「臨在」の含みを保持するため。
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 定冠詞を伴う שֻׁלְחָן は、文脈上すでに特定されている幕屋の「机」を指す。原文にない説明を加えず、簡潔に訳した。
- source_word: כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: כְּלִי は器、道具、用具などを広く表す。ここでは机に付属する品々を自然かつ包括的に示す「用具」とした。接尾辞 ו は「その」で表した。
- source_word: לֶחֶם הַפָּנִים
  choice: 臨在のパン
  rationale: 直訳的には「顔／臨在のパン」。神の御前に置かれるパンというヘブライ語の含みを保ち、伝統的名称だけに置き換えない表現とした。
- source_word: אֶת ... אֶת ... וְאֵת
  choice: 目的語を並べる読点と「と」で表現
  rationale: אֶת は目的語標識なので独立した語としては訳さず、列挙の構造を日本語の語順、読点、助詞で示した。
theological_decisions: []
translation_notes:
  register: 幕屋の備品を列挙する前後の構文につながるよう、完結文にせず読点で終えた。現代の一般読者に明瞭でありながら、礼拝文脈にふさわしい簡潔で格調ある表現とした。
