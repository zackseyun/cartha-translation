lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 彼らは…作り
  rationale: עשהの複数形ワイイクトール。物語の連続を自然な連用形で表した。
- source_word: מִשְׁבְּצֹת
  choice: 留め具
  rationale: 祭司装束の金細工に用いる取付部品を指す語。形状や技法を断定せず、現代日本語で機能が伝わる表現とした。
- source_word: זָהָב
  choice: 金の
  rationale: 材質を示す標準的な訳。原文どおり二つの品目それぞれに付した。
- source_word: טַבְּעֹת
  choice: 輪
  rationale: 装束の各部をつなぐためのリング状の部品を表す一般的な語。
- source_word: וַיִּתְּנוּ
  choice: 取り付けた
  rationale: נתןはここでは置く・据える意。胸当ての端に輪を装着する製作文脈に即して自然に訳した。
- source_word: שְׁנֵי קְצוֹת
  choice: 両端
  rationale: 直訳的な「二つの端」を、同じ意味を明瞭に表す自然な日本語にした。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 大祭司の祭服の一部を指す文脈上の定訳。ここでは「裁きの胸当て」などの補足を加えない。
