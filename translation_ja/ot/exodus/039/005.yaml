  text: וְ/חֵ֨שֶׁב אֲפֻדָּת֜/וֹ אֲשֶׁ֣ר עָלָ֗י/ו מִמֶּ֣/נּוּ הוּא֮ כְּ/מַעֲשֵׂ/הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: ja
  text: その上にあるエフォドの巧みに織られた帯は、エフォドと一体で、同じ作りであった。すなわち、金糸、青・紫・緋色の糸、撚り糸の上質な亜麻布で作られていた。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: エフォドの巧みに織った帯
  rationale: 祭司装束の文脈で、エフォドに付属する技巧的に織られた帯を指す。現代日本語で織物と職人技の両面を明確にした。
- source_word: אֲשֶׁר עָלָיו
  choice: エフォドの上にある
  rationale: 前置詞 עַל の位置関係を直接表し、本文が明言しない固定方法までは補わない。
- source_word: מִמֶּנּוּ הוּא
  choice: エフォドと一続きで
  rationale: 帯が別部品ではなくエフォド自体から成るという構造的一体性を自然な日本語で表した。
- source_word: כְּמַעֲשֵׂהוּ
  choice: 同じ作りであった
  rationale: エフォドと帯の workmanship が対応していることを簡潔に保持した。
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי וְשֵׁשׁ מָשְׁזָר
  choice: 金、青、紫、緋色の撚り糸、撚った上質の亜麻布
  rationale: 幕屋織物の材料・色彩の列挙として訳した。ヘブライ語に「糸」が明示されない色彩語には、織物の文脈から自然な補足として「撚り糸」を添えた。שֵׁשׁ מָשְׁזָר は品質と撚り加工をともに示した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 命令への忠実な履行を示す定型句として訳し、神名は固有名として音写した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有の契約名を一般名詞的な称号に置き換えず、日本語で広く認識される音写によって示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。衣服の構造を理解しやすくするため指示語を「エフォド」と明示した。「巧みに織った」は חֵשֶׁב の工芸的含意を表し、「一続き」と「同じ作り」を分けて、構造的一体性と仕上げの対応の双方を保持した。
