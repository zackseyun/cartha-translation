  source_fidelity: 概ね原文に忠実であり、帯がエフォドの上にあり、それと一体で同じ workmanship をもち、指定の材料から作られたことを伝えている。ただし現行の「緋色の撚り糸」は、撚り（מָשְׁזָר）が緋色だけに係るかのように読め、ヘブライ語の「上質の亜麻布、撚り糸」という修飾関係を反映していない。
