revisions:
- from: エフォドの上にある巧みに織った帯は、エフォドと一続きで、同じ作りであった。すなわち、金、青、紫、緋色の撚り糸、撚った上質の亜麻布で作られていた。ヤハウェがモーセに命じたとおりである。
  to: その上にあるエフォドの巧みに織られた帯は、エフォドと一体で、同じ作りであった。すなわち、金糸、青・紫・緋色の糸、撚り糸の上質な亜麻布で作られていた。ヤハウェがモーセに命じたとおりである。
  rationale: 材料句の統語関係を是正し、מָשְׁזָרを「上質な亜麻布」に結び付けた。また、「一続き」を「一体で」に改めて、帯がエフォドと不可分であることを明瞭にした。本文が示す位置関係は「その上にある」と保ち、固定方法などは補っていない。
