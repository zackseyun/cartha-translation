  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: ja
  text: 彼らは、アロンとその子らのために、織り手の手による上質の亜麻布の長衣を作った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 彼らは作った
  rationale: עשהのQal・ワイイクトル形。前節から続く行為を示す接続詞は、日本語の自然な叙述の流れに含めた。
- source_word: הַכָּתְנֹת
  choice: 長衣
  rationale: כֻּתֹּנֶתの複数形で、身体を覆う衣を指す。祭司の衣服という文脈に即し、現代日本語で分かりやすい「長衣」とした。
- source_word: שֵׁשׁ
  choice: 上質の亜麻布
  rationale: 幕屋と祭司装束の文脈では、質の高い亜麻布を指すため、その素材と品質を明示した。
- source_word: מַעֲשֵׂה אֹרֵג
  choice: 織り手の仕事によって
  rationale: 織る技法による職人の仕事を表す構文。単に素材を述べるのではなく、織りによって作られたことを保持した。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: アロンとその子らのために
  rationale: 反復される前置詞לְの受益・目的を自然な日本語で表し、祭司職に就くアロンの息子たちを「その子ら」と訳した。
