translation:
  language: ja
  text: 金の祭壇、油注ぎのための油、香り高い香、そして天幕の入口の垂れ幕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: 金の祭壇
  rationale: 名詞「金」が祭壇の材質を示すヘブライ語の構造を、自然で簡潔な日本語にした。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油
  rationale: 任職や聖別のために注ぐ儀礼用の油を指す定型的な表現として、簡潔で分かりやすい。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香り高い香
  rationale: קְטֹרֶת は「香」、הַסַּמִּים は芳香性の香料を指すため、その性質を自然な日本語で表した。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 幕屋の入口を覆う掛け布を指す語であり、内部の「垂れ幕」と区別しつつ、現代日本語で具体像が伝わる語を選んだ。
- source_word: פֶּתַח הָאֹהֶל
  choice: 天幕の入口
  rationale: 「天幕」はこの文脈では幕屋本体を指し、פֶּתַח の「入口、開口部」を素直に訳した。
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: 読点で列挙し、最後を「そして」で結ぶ
  rationale: ヘブライ語では接続詞と目的格標識が各項目に反復されるが、日本語では列挙として整える方が自然で、四項目すべてを保持できる。
