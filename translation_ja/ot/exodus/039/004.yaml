  text: They made for it shoulder pieces[a], joined to it; at its two ends it was joined.
translation:
  language: ja
  text: 彼らはエフォドのために、つなぎ合わせた肩の部分[a]を作った。エフォドはその両端でつなぎ合わされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肩ひも」とも訳せる。ヘブライ語は、肩の上に置かれ、エフォドの部分をつなぐ部材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: 肩当て
  rationale: 字義的には「肩」に関わる複数形で、ここではエフォドの肩に載り、その部分をつなぐ部材を指す。「肩当て」は衣服の具体的な部分として自然であり、「肩ひも」と断定するより形状上の曖昧さを保てる。
- source_word: עָשׂוּ
  choice: 彼らは…作り
  rationale: עשהのカル完了形3人称男性複数。祭服製作の叙述に即し、標準的な「作る」とした。
- source_word: לוֹ
  choice: エフォドのために
  rationale: 男性単数接尾辞の指示対象は文脈上、男性名詞エフォド。日本語では代名詞を避けて指示対象を明示する方が自然である。
- source_word: חֹבְרֹת
  choice: それに接合した
  rationale: חבר「結ぶ、つなぐ」に由来し、肩当てがエフォドに取り付けられた状態を表す。「接合」は構造物の接続を明確にし、後半の同語根との反復も保つ。
- source_word: עַל שְׁנֵי קצוותו
  choice: その両端で
  rationale: עַלはこの構文では接合箇所を示し、קצוותは二つの端部を指す。「その両端で」が簡潔で自然。
- source_word: חֻבָּר
  choice: 接合された
  rationale: חברのプアル完了形3人称男性単数で受動を表す。前半と同じ「接合」を用い、原文の語根反復を保持した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある祭服製作の叙述とした。原文の「接合する」という語根の反復を日本語でも保ち、指示対象の混乱を避けるため後半では「エフォド」を補った。
