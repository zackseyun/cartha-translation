  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: ja
  text: その宝石はイスラエルの子らの名に対応する十二個であり[a]、それぞれには、印章を彫るように、その名が一つずつ刻まれていた[b]。それは十二部族のためのものであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの子らの名を帯びる」。ヘブライ語の前置詞は、密接な関連や対応を表すことができる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「印章の彫刻」または「印章のような彫刻」。印章の文字を彫るような方法で刻むことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: その宝石
  rationale: 語そのものは「石」だが、胸当てにはめ込まれた装飾石という文脈を明瞭にするため「宝石」とした。定冠詞は日本語では文脈を受ける「その」で表した。
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの名に対応し
  rationale: עַל はここでは単なる位置ではなく、石と名との対応・関連を示す。原文の「イスラエルの子ら」を保った。
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: その名に従って十二個であった
  rationale: 代名詞と数詞による個数の明示を「十二個」で表し、反復される עַל の対応関係を「その名に従って」と訳した。
- source_word: פִּתּוּחֵי חֹתָם
  choice: 印章を彫るように刻まれ
  rationale: 印章そのものではなく、印章彫刻の様式・仕方を指す句として自然な日本語にした。
- source_word: אִישׁ עַל שְׁמוֹ
  choice: それぞれに一人の名が
  rationale: אִישׁ の配分的用法を「それぞれに」で表し、一つの石に一人分の名が対応する構造を明確にした。
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: 十二部族を表していた
  rationale: לְ の関係・代表機能を文脈に即して「表していた」とした。単なる目的の「ため」より、石と部族との対応を自然に伝える。
