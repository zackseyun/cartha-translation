source:
  edition: WLC
  text: אֵת֩ קַלְעֵ֨י הֶ/חָצֵ֜ר אֶת עַמֻּדֶ֣י/הָ וְ/אֶת אֲדָנֶ֗י/הָ וְ/אֶת הַ/מָּסָךְ֙ לְ/שַׁ֣עַר הֶֽ/חָצֵ֔ר אֶת מֵיתָרָ֖י/ו וִ/יתֵדֹתֶ֑י/הָ וְ/אֵ֗ת כָּל כְּלֵ֛י עֲבֹדַ֥ת הַ/מִּשְׁכָּ֖ן לְ/אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: ja
  text: 庭[a]の掛け幕、その柱と台座[b]、庭の門に掛ける垂れ幕、その綱[c]と杭、そして幕屋、すなわち会見の天幕の奉仕に用いるすべての用具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「中庭」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 柱を差し込む「受け台」のこと。
    reason: lexical_clarification
  - marker: c
    text: 「縄」とも訳せる。原文では、綱と杭が何に属するかは明示されていない。
    reason: lexical_alternative_and_ambiguity
lexical_decisions:
- source_word: קַלְעֵי
  choice: 掛け幕
  rationale: 庭を囲む織物の幕を指す。入口の הַמָּסָךְ（「垂れ幕」）との語の違いも保てる。
- source_word: חָצֵר
  choice: 庭
  rationale: 幕屋を囲む聖域内の囲われた外部空間を、現代日本語で簡潔に表す。「中庭」も可能。
- source_word: עַמֻּדֶיהָ
  choice: その柱
  rationale: 庭の囲いを支える直立材を指す。目録調の文脈に適した語。
- source_word: אֲדָנֶיהָ
  choice: 台座
  rationale: 柱を差し込んで支える基礎部品を指す。「受け台」とも訳せるが、「台座」が明快で自然。
- source_word: הַמָּסָךְ
  choice: 垂れ幕
  rationale: 入口に掛ける幕を表し、庭を囲む קַלְעִים（「掛け幕」）と区別する。
- source_word: לְשַׁעַר הֶחָצֵר
  choice: 庭の門のための
  rationale: 前置詞 לְ の用途・所属の意味を自然に表し、その垂れ幕が庭の入口用であることを示す。
- source_word: מֵיתָרָיו
  choice: その綱
  rationale: 構造物を固定する綱を指す。接尾辞の指示対象を訳文で限定せず、原文の曖昧さを保つ。
- source_word: וִיתֵדֹתֶיהָ
  choice: 杭
  rationale: 綱を地面に固定するための杭を指す。日本語では所有表現を重ねず、「その綱と杭」と自然にまとめた。
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: 奉仕に用いるすべての用具
  rationale: כְּלִים の広い集合的意味と、聖所に関わる עֲבֹדָה の務め・奉仕の意味を明瞭に表す。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 神の臨在する移動式聖所を指す定着した日本語訳で、語の宗教的・建築的な特定性を保つ。
- source_word: לְאֹהֶל מוֹעֵד
  choice: 会見の天幕である
  rationale: 「幕屋」と「会見の天幕」を同一の聖所を指す表現として自然につなぐ。לְ の関係には幅があるが、用具が会見の天幕に属する奉仕用であるという文脈を明確にする。
theological_decisions:
- issue: הַמִּשְׁכָּן と אֹהֶל מוֹעֵד の関係
  choice: 「会見の天幕である幕屋」と同格的に表現
  alternative: 「幕屋の奉仕に用いる、会見の天幕のためのすべての用具」
  rationale: 原文の לְ は用途・所属を表し得るが、この目録では両名称が同じ聖所を指す。同格的な日本語は不自然な重複を避けつつ、両方の名称を保持する。
translation_notes:
  register: 現代の一般読者に明瞭な語を用いながら、聖所の目録にふさわしい簡潔で格調ある列挙調を保った。「掛け幕」と「垂れ幕」を訳し分け、原語の区別を反映した。
