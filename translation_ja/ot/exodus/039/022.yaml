  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: ja
  text: また彼は、織り手の仕事による、すべて青い糸で織ったエフォドの上着を作った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青い糸」と訳したヘブライ語は、幕屋や祭司の衣服に用いられた、貴重な青い染料で染めた繊維素材を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: また彼は……作った
  rationale: 物語の連続を示す接続形を「また」で表し、עשהの基本的な意味を自然な日本語の「作った」で訳した。
- source_word: מְעִיל הָאֵפֹד
  choice: エフォドの上着
  rationale: מְעִילは祭司が身に着ける衣を指すため「上着」とし、אֵפֹדは単純な現代語の対応語がない祭司装束の専門語なので音写した。属格関係もそのまま保った。
- source_word: מַעֲשֵׂה אֹרֵג
  choice: 織って作った
  rationale: 直訳は「織り手の仕事」だが、ここでは製法を表すため、意味を加えず現代日本語として明瞭な動詞表現にした。「熟練した」は原文に明記されていないので加えない。
- source_word: כְּלִיל
  choice: すべて……でできていた
  rationale: 衣全体に及ぶ完全性を自然な日本語で示した。
- source_word: תְּכֵלֶת
  choice: 青色の糸
  rationale: 単なる抽象的な色名ではなく、幕屋と祭司装束に用いられた青く染めた繊維素材を指す文脈なので「青色の糸」とした。
