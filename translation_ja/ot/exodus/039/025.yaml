base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: ja
  text: 彼らは純金の鈴を作り、その鈴をざくろの間[a]に、上着の裾の周りに、ざくろの間に取り付けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ざくろのただ中に」。ヘブライ語の表現は直訳すると「ざくろのただ中に」で、鈴とざくろ形の飾りとの位置関係を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 彼らは…作り
  rationale: 物語を進める通常のワウ継続法。日本語では前節からの順接を自然に示す連用形とした。
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: 純金の鈴
  rationale: 素材とその純度を明示し、簡潔で自然な日本語にした。原文には大きさを示す語がないため「小さな」は補わない。
- source_word: וַיִּתְּנוּ
  choice: 取り付けた
  rationale: 基本義は「置いた」だが、衣の裾に装飾を配置する文脈では「取り付けた」が自然であり、固定された配置も明確になる。
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: ざくろの間に
  rationale: 直訳は「ざくろのただ中に」。装飾の配置関係を現代日本語で明瞭に表すため「間に」としたが、語義の幅は脚注に残した。
- source_word: הָרִמֹּנִים
  choice: ざくろ
  rationale: 文脈上はざくろ形の飾りだが、原文は単に「ざくろ」と述べるため、本文では説明を加えずその表現を保った。
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: 上着の裾
  rationale: שׁוּלִים は衣の裾または下縁を指し、מְעִיל は祭司の上着を指す。平明で自然な表現を選んだ。
- source_word: סָבִיב
  choice: 周囲にわたって
  rationale: 鈴とざくろが裾を一周して配置されたことを自然な日本語で示す。
- source_word: בְּתוֹךְ הָרִמֹּנִים（反復）
  choice: ざくろの間に
  rationale: 原文が同じ句を反復して配置を強調しているため、日本語でも省略せず残した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司の衣装を扱う箇所にふさわしい簡潔で品位ある叙述とした。原文にある「ざくろの間」の反復は、多少重なりを感じさせても構造上の特徴として保持した。
