source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: ja
  text: ヤハウェがモーセに命じたすべてのとおりに、イスラエルの子ら[a]はすべての仕事を行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの民」または「イスラエル人」とも訳せる。ヘブライ語の直訳は「イスラエルの子ら」で、イスラエルの民を指す契約共同体の定型的な呼称。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのとおりに
  rationale: כְּ と כֹל の組み合わせが表す、命令内容との全面的な一致を、自然な日本語で示す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 動詞の基本義「命じる」を保持する。ヘブライ語の完了形は文脈上、後続する作業の遂行に先立つ命令を表すが、日本語では単純過去が自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写する。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: צוה は命令を受ける相手を直接目的語として取るが、日本語では「モーセに命じた」が自然である。
- source_word: כֵּן
  choice: そのとおりに
  rationale: 冒頭の「すべてのとおりに」と対応し、イスラエルが命令に従って実行したことを明確にする。日本語では重複を避けるため、文全体を「すべてのとおりに……行った」とまとめた。
- source_word: עָשׂוּ
  choice: 行った
  rationale: 製作だけに限定せず、命じられた作業全体を遂行したという広い意味を表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの表現を保ちつつ、イスラエルの契約共同体全体を指す定型的呼称として訳す。
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: すべての仕事
  rationale: 幕屋製作の文脈における作業全体を指すため、「奉仕」よりも「仕事」が明瞭で自然である。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文の固有名を称号に置換せず、そのまま音写して保持する。
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエルの民、イスラエル人
  rationale: 原文の形を保持しながら、この表現が男性だけではなくイスラエル共同体を集合的に指すことは脚注で明示する。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語とし、命令と遂行の対応関係を自然な語順で表した。荘重さを保ちつつ、古風な文末表現は避けた。脚注記号は説明対象である「イスラエルの子ら」の直後に置いた。
