base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: ja
  text: 彼らは幕屋、すなわち天幕とそのすべての用具――その留め金、枠板[a]、横木、柱、台座[b]――をモーセのもとに持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「板」とも訳せる。ヘブライ語は、幕屋を形作る直立した構造材を指す。
    reason: lexical_alternative
  - marker: b
    text: 「受け台」とも訳せる。枠板や柱を差し込む土台部分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 彼らは……運んで来た
  rationale: ヒフィル形の物語叙述で、次の行為として物をモーセのもとへ持って来たことを表す。現代日本語として自然な「運んで来た」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる住まいの構造物を指す定着した訳語であり、後続する「天幕」とも区別できる。
- source_word: אֶל מֹשֶׁה
  choice: モーセのもとに
  rationale: 方向・到達先を表す אֶל の素直な意味を、自然な日本語で示した。
- source_word: הָאֹהֶל
  choice: 天幕
  rationale: אֹהֶל の基本義を保ち、幕屋全体に対する天幕部分として理解できる表現にした。
- source_word: כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: כֵּלִים は器具・装備・部材を広く指し得るため、列挙される構造部品も含められる広い表現を選んだ。
- source_word: קְרָסָיו
  choice: 留め金
  rationale: 幕をつなぎ合わせる接合具を指すため、機能が分かる現代日本語とした。
- source_word: קְרָשָׁיו
  choice: 枠板
  rationale: 幕屋を形作る直立した構造材であることを示しつつ、「板」という伝統的な理解も保持する表現とした。
- source_word: בריחו
  choice: 横木
  rationale: 枠板を横方向につなぎ、固定する部材を指す。文脈上は複数の部材の列挙として訳した。
- source_word: עַמֻּדָיו
  choice: 柱
  rationale: 幕屋の垂直な支持材を指す、明瞭で一般的な語を選んだ。
- source_word: אֲדָנָיו
  choice: 台座
  rationale: 枠板や柱を差し込んで支える基礎部品を指すため、一般読者に理解しやすい「台座」とした。
theological_decisions: []
