  text: וַ/יַּ֨רְא מֹשֶׁ֜ה אֶת כָּל הַ/מְּלָאכָ֗ה וְ/הִנֵּה֙ עָשׂ֣וּ אֹתָ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה כֵּ֣ן עָשׂ֑וּ וַ/יְבָ֥רֶךְ אֹתָ֖/ם מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: ja
  text: モーセはすべての仕事を見た。すると、彼らはそれを、ヤハウェが命じたとおりに行っていた。まさにそのとおりに行っていた。そしてモーセは彼らを祝福した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見た
  rationale: ראהの基本義を保つ。文脈上は完成した仕事を確認する行為だが、「調べた」として評価的意味を加えすぎない。
- source_word: כָּל הַמְּלָאכָה
  choice: すべての仕事
  rationale: 幕屋製作に関わる仕事全体を指す。現代日本語として明瞭であり、「細工」よりも範囲を狭めない。
- source_word: וְהִנֵּה
  choice: すると
  rationale: 発見と注目を促す談話機能を自然な日本語で表す。「見よ」は荘重だが、この叙述では不自然になりやすい。
- source_word: עָשׂוּ אֹתָהּ
  choice: 彼らは…行っていた
  rationale: עשהの広い意味と、先行する仕事全体への照応を保つ。「作った」だけに限定せず、完了した仕事をモーセが確認した時間関係も示す。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: まさにヤハウェが命じたとおりに
  rationale: כַּאֲשֶׁרが示す正確な一致を「まさに…とおりに」で表し、神名は称号に置き換えず「ヤハウェ」とする。
- source_word: כֵּן עָשׂוּ
  choice: そのとおりに彼らは行っていた
  rationale: 原文がעשהを繰り返して完全な従順を強調する構造を、日本語でも独立した反復として保持する。
- source_word: וַיְבָרֶךְ אֹתָם
  choice: モーセは彼らを祝福した
  rationale: ברךのピエル形を簡潔かつ自然に訳し、祝福の具体的内容を原文以上に補わない。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有の神名を称号へ置換せず、一般的な学術的再構音に基づく「ヤハウェ」で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、原文の反復と荘重さを保持した。「見よ」の直訳は避け、וְהִנֵּהの注意喚起・発見の機能を「すると」で自然に表した。
