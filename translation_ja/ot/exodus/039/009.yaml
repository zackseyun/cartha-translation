  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: ja
  text: 胸当ては正方形で、二重にして作られた[a]。二重にした状態で、その長さも幅も一手幅であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「二つ折りにして作られた」。ヘブライ語は、胸当てが二重、または折り重ねた形に作られたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 四辺が等しい形を表す文脈なので、現代日本語で自然かつ明確な「正方形」とした。
- source_word: הָיָה
  choice: それは〜であった
  rationale: ここでは胸当ての形状を述べる連結動詞として理解した。
- source_word: כָּפוּל
  choice: 二重に／二重にした状態で
  rationale: 二層または折り重ねた構造を示す語である。最初は作り方、末尾は寸法がその二重の状態におけるものであることを自然に示した。具体的に「折った」と断定せず、原文の幅を保った。
- source_word: עָשׂוּ
  choice: 作った
  rationale: 一般的な動詞の素直な訳であり、不要な技巧的含意を加えない。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 祭司装束の文脈における標準的で分かりやすい名称。「裁きの胸当て」は本節にない語を補うため採らなかった。
- source_word: זֶרֶת
  choice: 一あたり
  rationale: 古代の身体尺を換算せず保持した。「あたり」は親指と小指を広げた幅を基準とする長さの単位である。
- source_word: אָרְכּוֹ
  choice: 長さ
  rationale: 三人称男性単数接尾辞の指示対象は胸当てであり、日本語では文脈上明らかなため「その」を省いて自然にした。
- source_word: רָחְבּוֹ
  choice: 幅
  rationale: 現代日本語で最も自然な寸法表現を用いた。
