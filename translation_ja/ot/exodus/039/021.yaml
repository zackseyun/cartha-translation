  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼らは青いひもで胸当ての環をエフォドの環に結び付け、胸当てがエフォドの巧みに織られた帯の上にあり、エフォドからずれないようにした[a]。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「胸当てがエフォドの上から離れないようにした」。
    reason: 原文の מֵעַל が持つ「上から」という空間的ニュアンスを示すため。
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: 結び付けた
  rationale: 衣服の各部をひもで固定する動作を表すため、現代日本語で自然な「結び付けた」とした。単に「縛った」よりも、この祭司服の構造に適している。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 祭司が胸に着け、宝石を取り付けた装具を指す。武具を連想させやすい「胸当て板」や「胸甲」より、この文脈に適した簡潔な訳語である。
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: 胸当ての環をエフォドの環に
  rationale: 前置詞が示す、胸当て側の環からエフォド側の環への接続関係を、日本語として自然に表した。
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: 青いひもで
  rationale: פְתִילは固定に用いるひもを指し、תְּכֵלֶתは青系の染色を表す。「青いひも」は意味を明瞭かつ自然に伝える。
- source_word: חֵשֶׁב הָאֵפֹד
  choice: エフォドの巧みに織った帯
  rationale: ここではエフォドに付属する装飾的な織り帯を指す。「巧みに織った」により、職人技を伴う織物という文脈上の含意を示した。
- source_word: וְלֹא יִזַּח
  choice: ずれないようにした
  rationale: 所定の位置から離れたり滑ったりしないことを表す。固定具についての自然な現代日本語として「ずれない」を選んだ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を明記しているため、その区別を保って「ヤハウェ」とした。
- issue: מֵעַל הָאֵפֹד の空間的ニュアンス
  choice: エフォドからずれない
  alternative: エフォドの上から外れない
  rationale: 原文には「上から離れる」という空間的含みがあるが、直前で胸当てが帯の上にあることを明示しているため、本文では日本語として自然な「ずれない」とし、別訳を脚注に残した。
translation_notes:
  register: 祭司の装束を扱う文章として品位を保ちつつ、動作と各部の関係が普通の読者にも分かる現代標準日本語とした。「エフォド」は固有の祭司服を指す慣用的な音写として保持した。
