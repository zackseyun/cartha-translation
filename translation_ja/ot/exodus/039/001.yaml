base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 青、紫、緋色の糸を用いて、聖所で仕えるための精巧に織り上げた衣[a]を作った。また、ヤハウェがモーセに命じたとおり、アロンのための聖なる装束を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奉仕のための衣」。このヘブライ語表現は特殊なもので、幕屋での奉仕という衣の用途を強調するとも、精巧な織りや仕立てを強調するとも考えられる。
    reason: בִגְדֵי שְׂרָד の語義には、機能を示すのか製作上の特徴を示すのかという真正な曖昧さがあるため。
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: 青糸、紫糸、緋色の糸を用いて
  rationale: 幕屋の織物に用いる色糸を指す文脈を明示しつつ、古代染料の厳密な色調までは限定しない。「緋色」は聖書の祭儀的文脈にもなじむ自然な色名である。
- source_word: בִגְדֵי שְׂרָד
  choice: 精巧に織った衣
  rationale: שְׂרָד は意味に議論のある専門的表現で、織りの仕上がりを表す可能性を本文に採った。ただし奉仕用という機能を表す可能性も脚注に残した。
- source_word: לְשָׁרֵת
  choice: 仕えるための
  rationale: 聖所における正式な祭儀奉仕を、平易で自然な日本語で表す。
- source_word: בַּקֹּדֶשׁ
  choice: 聖所で
  rationale: 抽象的な「聖」ではなく、幕屋に属する聖なる領域での奉仕を指す。特定の一区画だけに狭く限定しない。
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: 聖なる装束
  rationale: アロンの祭司服を指す正式な表現として、「衣」との語調上の区別も保ちながら神聖な用途を示す。
- source_word: לְאַהֲרֹן
  choice: アロンのための
  rationale: 所有そのものより、アロンの着用に供する指定・目的を自然に表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を音写して保持する。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおり
  rationale: 先に与えられた命令への忠実な実行を示す定型句を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を用いているため、称号「主」に置換せず音写し、契約の神の名としての性格を保つ。
- issue: בִגְדֵי שְׂרָד の意味
  choice: 精巧に織った衣
  alternative: 奉仕のための衣
  rationale: 語の形態・用例には不確かさがあり、構造や仕立てを強調する解釈を本文に置いたが、祭儀的機能を強調する解釈も排除せず脚注で明示する。
translation_notes:
  register: 明瞭な現代標準語を用い、祭儀的な尊厳を保った。「仕える」は一般読者に理解しやすく、「装束」はアロンの正式な祭司服を自然に示す。脚注記号は曖昧な表現そのものの直後に置いた。
