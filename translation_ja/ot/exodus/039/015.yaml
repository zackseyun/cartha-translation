  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: ja
  text: また彼らは、胸当てに、純金の、撚りひも状に編んだ鎖[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「より合わせて作った鎖」または「ひも状に作った鎖」。ヘブライ語は、編んだもの、あるいは綱のような形に作られた鎖を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: また彼らは…作った
  rationale: 接続形による物語の継続を「また」で示し、一般的な動詞 עשה を自然に訳した。
- source_word: עַל הַחֹשֶׁן
  choice: 胸当ての上に
  rationale: עַל の空間的・付着的な意味を保ち、高祭司の装具 חֹשֶׁן を文脈上明瞭な「胸当て」とした。
- source_word: שַׁרְשְׁרֹת
  choice: 鎖
  rationale: 複数形の名詞は複数の鎖を指すが、日本語では個数を明示しない「鎖」が自然である。
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: よりひものように編んだ
  rationale: 語義に不確かさのある גַּבְלֻת と、太いひも・綱状の細工を表す מַעֲשֵׂה עֲבֹת を合わせ、鎖の編まれた、ひも状の作りを明瞭に表した。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 材料を示す標準的な表現として簡潔かつ自然に訳した。
