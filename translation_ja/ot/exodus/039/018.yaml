  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָֽ/עֲבֹתֹ֔ת נָתְנ֖וּ עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצֹ֑ת וַֽ/יִּתְּנֻ֛/ם עַל כִּתְפֹ֥ת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: ja
  text: 二本の編み鎖[a]の二つの端を二つの受け枠[b]に付け、それらをエフォドの肩当ての前側に取り付けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「撚り鎖」。撚る、あるいは編むように作った鎖を指す。
    reason: lexical_alternative
  - marker: b
    text: または「台座」「はめ枠」。宝飾品を受ける金製の枠を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: それぞれの端
  rationale: 二本の鎖に対応する二つの末端を指すため、日本語では「それぞれの端」とすると関係が明瞭になる。
- source_word: הָעֲבֹתֹת
  choice: 組み鎖
  rationale: 幕屋の装身具の文脈で、より合わせる、または編むように作った鎖を指す。「組み鎖」は工芸的な形状と鎖であることを簡潔に伝える。
- source_word: מִּשְׁבְּצֹת
  choice: 受け枠
  rationale: 胸当てに用いられた金製の枠・台座を指す語。「受け枠」は部品を受けて固定する工芸品として自然に理解できる。
- source_word: וַיִּתְּנֻם
  choice: それらを…取り付けた
  rationale: 語義は「置く、付ける」であり、この製作工程では「取り付けた」が自然。ただし固定方法までは特定しない。
- source_word: כִּתְפֹת
  choice: 肩当て
  rationale: 身体の肩そのものではなく、エフォドの肩に当たる構成部分を指すため。
- source_word: אֶל מוּל פָּנָיו
  choice: 前側に
  rationale: エフォドの正面を向く側への配置を表す。接尾辞の指示対象をエフォドと理解し、簡潔な日本語にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある製作記述とした。「エフォド」は祭司服の固有の用語として音写し、「肩当て」「受け枠」で各部品の関係を明確にした。原文の二度の נתן は、日本語で不自然な反復を避けつつ、最初を「付け」、次を「取り付けた」として工程の順序を保った。
