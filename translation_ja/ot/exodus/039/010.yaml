  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: ja
  text: 彼らは胸当てに宝石を四列にはめ込んだ。第一列は、赤めのう、トパーズ、エメラルドであった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: これらの宝石の種類を厳密に特定することは難しい。「赤めのう」は「ルビー」と訳されることもあり、「トパーズ」は「かんらん石」とされることもある。「エメラルド」も、別の緑色の石、または輝く石を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: はめ込んだ
  rationale: 字義的には「満たした」だが、胸当ての台座に宝石を配置する文脈では「はめ込んだ」が自然で、具体的な動作を適切に表す。
- source_word: בּוֹ
  choice: そこに
  rationale: 前文の胸当てを受ける。日本語では同じ名詞を繰り返すより「そこに」とするのが自然である。
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: 宝石を四列に
  rationale: אָבֶןはここでは集合的に宝石を指し、טוּרֵיは列を意味する。「宝石を四列に」で簡潔かつ明瞭に配置を示す。
- source_word: טוּר ... הַטּוּר הָאֶחָד
  choice: 第一列をなす宝石は
  rationale: 直訳的な「一つの列」は、四列を順に列挙する文脈では第一列を指す。「第一列をなす宝石は」として日本語の一覧表現を整えた。
- source_word: אֹדֶם
  choice: 赤めのう
  rationale: 赤色の宝石を指す語で、カーネリアンに相当する可能性が高い。ただし厳密な同定は不確かなので脚注でその点を示す。
- source_word: פִּטְדָה
  choice: トパーズ
  rationale: 伝統的で広く理解される訳語を採用したが、古代の鉱物名との厳密な対応は不確かである。
- source_word: בָרֶקֶת
  choice: エメラルド
  rationale: 伝統的な訳語である。輝きや閃光を連想させる語源を持つ可能性があるが、具体的な石の種類は確定できない。
