lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: 物語を進める接続ワウ付き未完了形を、現代日本語で自然な単純過去として表した。
- source_word: הָאֵפֹד
  choice: エフォド
  rationale: 祭司の特定の装束を指す専門語であり、意味を狭く決める意訳を避け、定着した音写を用いた。
- source_word: זָהָב
  choice: 金糸
  rationale: 語そのものは「金」だが、材料を列挙する織物製作の文脈と直後の39:3により、ここでは糸状に加工した金を指す。日本語では素材の形を明示するほうが自然である。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青糸、紫糸、緋色の糸
  rationale: 聖所の織物に用いる染色素材を示す色彩語群。日本語では並列関係と織物の文脈が明瞭になるよう、それぞれを糸として表した。תּוֹלַעַת שָׁנִי は緋色に染めた素材を指す。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁ の上質な亜麻素材と、מָשְׁזָר の撚った状態の両方を、明瞭で自然な現代日本語で表した。
