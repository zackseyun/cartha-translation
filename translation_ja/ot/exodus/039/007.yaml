  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼はそれらを、イスラエルの子ら[b]のための記念の石[a]として、エフォドの肩当てに据えた。彼は、ヤハウェがモーセに命じたとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「記憶の石」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「イスラエルの子ら」。イスラエルの民を指す定型表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 据えた
  rationale: שׂוּםは「置く、据える」を意味する。ここでは宝石を祭服の所定の位置に設置する文脈なので、「据えた」が具体的な動作を自然に表す。
- source_word: אֹתָם
  choice: それらを
  rationale: 前節の二つのしまめのうを受ける複数の目的語代名詞であり、その指示関係を保った。
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: エフォドの肩当てに
  rationale: כָּתֵףは字義的には「肩」だが、ここではエフォドの肩の部分を指す。「肩当て」は祭服の構造を明確にしつつ原文に近い。
- source_word: אַבְנֵי זִכָּרוֹן
  choice: 記念の石
  rationale: 字義は「記念／想起の石」。簡潔で自然な日本語とし、その役割を過度に説明しない表現を選んだ。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのための
  rationale: 定型表現בְּנֵי יִשְׂרָאֵלの形を見えるように保った。文脈上はイスラエルの民全体を指すため、その点を脚注で示す。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: כַּאֲשֶׁרの一致・準拠の意味を「とおり」で表し、神名יהוהは固有名として「ヤハウェ」とした。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として明示し、称号へ置き換えない。
- issue: בְּנֵי יִשְׂרָאֵלの性と指示範囲
  choice: 本文では「イスラエルの子ら」とし、民全体を指すことを脚注で説明する
  alternative: イスラエル人／イスラエルの民
  rationale: 原文の男性複数を含む定型句を形式上保ちながら、実際の包括的な指示範囲を誤解させないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「据えた」「肩当て」により祭服製作の具体的な文脈を表し、後半は簡潔な完結文として命令への忠実な実行を示した。
