base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: ja
  text: 彼らは金の輪を二つ作り、それをエフォドの二つの肩当ての下方、エフォドの前面の、つなぎ目に対応する位置、エフォドの巧みに織られた帯の上に取り付けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: 輪
  rationale: 幕屋と祭司の装束に用いる金属製の取り付け具を指すため、自然で文脈に即した「輪」とした。
- source_word: כִתְפֹת
  choice: 肩当て
  rationale: 身体の肩そのものではなく、エフォドの肩の部分を指すため、衣服の構成部分であることが分かる「肩当て」とした。
- source_word: מִלְמַטָּה
  choice: 下部
  rationale: 肩当ての低い位置を示す空間表現として簡潔に訳した。
- source_word: מִמּוּל פָּנָיו
  choice: 前側に
  rationale: 直訳的には「その面の前から」であり、物であるエフォドの向きを自然な日本語で示した。
- source_word: לְעֻמַּת
  choice: 向かい合う位置で
  rationale: 位置上の対応または対向を表す語であり、その空間関係を明示した。
- source_word: מֶחְבַּרְתּוֹ
  choice: つなぎ目
  rationale: 衣服の部分どうしが接合される箇所を指す。縫い目に限定せず、原語の幅を保つため「つなぎ目」とした。
- source_word: חֵשֶׁב
  choice: 巧みに織った帯
  rationale: エフォドと一体をなす帯状の締め具を指し、周辺文脈に見られる精巧な織物としての性格も伝えた。
- source_word: אֵפֹד
  choice: エフォド
  rationale: 大祭司の特殊な祭服であり、対応する一般的な日本語の衣服名がないため音写した。
- source_word: וַיִּתְּנֻם
  choice: 取り付けた
  rationale: 単なる配置ではなく、金の輪を祭服の所定の箇所に据える文脈に自然な表現とした。
theological_decisions: []
