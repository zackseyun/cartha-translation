  register: 現代の一般読者に理解できる、簡潔で品位ある叙述。「つなぎ目」は接合方法を縫製に限定せず、原文の曖昧さを保持した。複数の位置表現は、一つの取り付け位置を順に限定する日本語としてまとめた。
