  text: פַּעֲמֹ֤ן וְ/רִמֹּן֙ פַּעֲמֹ֣ן וְ/רִמֹּ֔ן עַל שׁוּלֵ֥י הַ/מְּעִ֖יל סָבִ֑יב לְ/שָׁרֵ֕ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 鈴とざくろ、鈴とざくろを、衣の裾の周りに付けた。務めを行うためである[a]。ヤハウェがモーセに命じたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「奉仕のため」「仕えるため」。原文は、祭司の務めに用いる目的を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: 鈴
  rationale: 語義をそのまま明瞭に表す。「金」は前節の文脈で示されるが、本節には明記されていないため補わない。
- source_word: רִמֹּן
  choice: ざくろ
  rationale: 字義は「ざくろ」。ここではざくろ形の飾りを指すが、周辺文脈から分かるため簡潔な語を用いる。
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: 衣の裾をぐるりと取り巻くように
  rationale: שׁוּלֵי は衣の下端・裾、סָבִיב は全周にわたる配置を表す。「ぐるりと」で周囲一帯という強調を自然な日本語にした。
- source_word: לְשָׁרֵת
  choice: 務めを行うため
  rationale: 目的を示す不定詞で、幕屋における祭司の奉仕を指す。現代日本語で自然かつ、一般的な奉仕との区別も文脈上保てる表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおり
  rationale: 完成した制作が先の命令に従ったことを示す定型句として自然に訳した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を直接用いているため、称号に代えず音写し、契約の神の名であることを保持した。
- issue: לְשָׁרֵת が示す目的
  choice: こうして務めを行うため
  alternative: 奉仕のため／仕えるため
  rationale: 祭司の務めを指す一方、文法上は簡潔な目的表現であり、具体的な行為や主体を原文以上に限定しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「鈴一つ、ざくろ一つ」の反復によって、原文の交互配置とリズムを再現した。原文は前節から続く構文だが、単独の節としても読めるよう述語を補い、補足が解釈を狭めないようにした。
