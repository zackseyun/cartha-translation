translation:
  language: ja
  text: 上質の亜麻布のターバン、上質の亜麻布の装飾的な帽子、そして、より合わせた上質の亜麻布の下着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「亜麻布の下着、すなわち、より合わせた上質の亜麻布のもの」。ヘブライ語の語順では、末尾の「上質の亜麻布、より合わせたもの」は特に直前の下着にかかるとも読めるが、祭司の衣服全体に繰り返される素材の説明とも響き合っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: ターバン
  rationale: 大祭司のための巻く形の頭覆いを指す祭儀用語であり、現代日本語でも形状を明確に伝えられる。
- source_word: שֵׁשׁ
  choice: 上質の亜麻布
  rationale: 単なる亜麻布ではなく、祭司の衣服に用いる質のよい亜麻布を表すため。
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: 飾りのある帽子
  rationale: פַּאֲרֵי の華美・装飾の含意を、帽子とは別個の装飾品とせず、帽子の特徴として自然に表した。
- source_word: מִכְנְסֵי הַבָּד
  choice: 亜麻布で作った下着
  rationale: 祭司が下半身に着ける衣類を指す。古風な衣服名を避け、用途と素材が分かる現代語とした。
- source_word: מָשְׁזָר
  choice: より合わせた
  rationale: 糸をより合わせる織物製作上の特徴を簡潔に示す。
