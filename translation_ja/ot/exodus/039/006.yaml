source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: ja
  text: 彼らは縞めのうの石[a]を加工し、金の枠で囲み、印章に彫るように、イスラエルの息子たちの名に従って刻んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ショハム石」とも訳せる。どの宝石を指すかは確定していないが、伝統的には縞めのうとされる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 彼らは…作り
  rationale: עשהの広い意味を保ちつつ、祭具製作の文脈に自然な「作る」を用いた。
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: 縞めのうの石
  rationale: שֹׁהַםの伝統的な同定に従うが、鉱物の厳密な同定には不確かさがあるため脚注を付した。
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: 金の台座で囲み
  rationale: 石が金製のはめ込み台ないし枠に囲まれているという構造を、細工の形状を過度に限定せず表した。
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: 印章を彫るように…彫った
  rationale: 同根語の反復と、印章式の彫刻という比喩を、明瞭な現代日本語で再現した。
- source_word: עַל שְׁמוֹת
  choice: 名に従って
  rationale: עַלがここで名前との対応関係を示すと理解し、原文の関係性を保った。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たち
  rationale: 男性複数形と族長の十二人の息子を指す契約的・部族的表現を明示的に保った。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の性を伴う契約的呼称
  choice: イスラエルの息子たち
  alternative: イスラエルの子ら／イスラエル人
  rationale: この箇所では石に刻む部族名の起源であるヤコブ（イスラエル）の息子たちが念頭にあるため、原文の男性形を中性化せず訳した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「台座」は宝石を受ける金製の枠を指し、具体的な細工法までは限定しない。「印章を彫るように」は原文の彫刻表現を自然に伝える。
