base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼らはその札に青いひも[a]を付け、それをかぶり物の上部に取り付けた。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青紫色のひも」「紫がかった青いひも」とも訳せる。ヘブライ語テヘーレトは、幕屋で用いられた特徴的な青系の染色素材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: 彼らはそれに……を取り付け
  rationale: נתן の基本義は「置く」だが、עַל と目的節を伴うここでは、前節の聖別の札にひもを取り付ける動作を表す。文脈上の機能を明確にしつつ過度に説明しない訳とした。
- source_word: פְּתִיל
  choice: ひも
  rationale: 撚った糸または細いひもを指す。札をかぶり物に留める用途に合い、現代日本語として自然である。
- source_word: תְּכֵלֶת
  choice: 青色
  rationale: 幕屋の織物などに用いられた特徴的な青系の染色素材を指す。色調や素材の厳密な特定には不確かさがあるため、本文では簡潔に「青色」とし、別訳を脚注に示した。
- source_word: הַמִּצְנֶפֶת
  choice: かぶり物
  rationale: 大祭司が頭に巻く祭儀用の装身具を指す。「ターバン」も可能だが、特定の現代文化を強く連想させず、平明に理解できる表現を選んだ。
- source_word: מִלְמָעְלָה
  choice: 上に
  rationale: 上方または上部への配置を表す。具体的な位置を「前面」などと限定せず、原文の空間表現を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された固有の神名を保持し、称号への置換を避けた。
- issue: עָלָיו が指す対象
  choice: 「それ」として前節の聖別の札を受ける
  alternative: 対象を本文中で「札」と明示する
  rationale: 文脈上は前節の札を指すが、この節自体の代名詞表現を保つため「それ」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭具の専門語を増やしすぎず、前節とのつながりと原文の簡潔さを保持した。
