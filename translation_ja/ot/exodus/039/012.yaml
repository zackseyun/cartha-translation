translation:
  language: ja
  text: 第三列は、レシェム[a]、めのう[b]、紫水晶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代の宝石名には正確な同定が難しいものがある。「レシェム」は、ヒヤシンス石、琥珀、または古い訳語ではリグレなどと考えられてきた。
    reason: lexical_alternative
  - marker: b
    text: または「オニキス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הַשְּׁלִישִׁי
  choice: 第三列は
  rationale: 胸当ての宝石の配列を示す טוּר を自然な日本語で「列」とし、文脈上の列挙を示す接続詞 וְ は日本語では明示せず、主題提示の「は」で滑らかに表した。
- source_word: לֶשֶׁם
  choice: レシェム
  rationale: 古代の宝石名の正確な同定が不確かなため、特定の現代宝石名に断定せず、ヘブライ語名を音写した。候補は脚注に示した。
- source_word: שְׁבוֹ
  choice: めのう
  rationale: この文脈で伝統的かつ広く用いられる同定を採用したが、「縞めのう（オニキス）」の可能性を脚注で保持した。
- source_word: וְאַחְלָמָה
  choice: 紫水晶
  rationale: אַחְלָמָה は胸当ての宝石一覧で一般にアメシストと同定されるため、分かりやすい現代日本語の宝石名「紫水晶」とした。接続詞は読点による列挙で自然に表現した。
