  text: אֶת הַ/מְּנֹרָ֨ה הַ/טְּהֹרָ֜ה אֶת נֵרֹתֶ֗י/הָ נֵרֹ֛ת הַ/מַּֽעֲרָכָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת שֶׁ֥מֶן הַ/מָּאֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/037.yaml
  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: ja
  text: 純粋な燭台、そのともしび、すなわち整えられたともしび、そのすべての用具、明かりのための油、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרָה הַטְּהֹרָה
  choice: 純金の燭台
  rationale: 直訳は「清い燭台」だが、幕屋の備品について טָהוֹר は材質である純金を指す用法があり（出エジプト記25:31、37:17参照）、現代日本語では「純金の燭台」が対象を明確かつ自然に表す。
- source_word: נֵרֹתֶיהָ
  choice: そのともしび皿
  rationale: ここで נֵר は燭台に載せて油を入れる個々の灯火容器を指す。「ともしび」だけでは炎そのものとも取れるため、「ともしび皿」として器具であることを示した。
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: 定められたとおりに並べるともしび皿
  rationale: מַעֲרָכָה は整然と配置すること、またその配置を表す。祭儀上の所定の配列という含みを、過度に説明的にならない形で表した。
- source_word: כָּל כֵּלֶיהָ
  choice: そのすべての用具
  rationale: כְּלִי は器、道具、備品を広く指す。この文脈では燭台に付属する品々を包括する「用具」が自然である。
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: 明かりのための油
  rationale: 構文どおり、照明に用いる油を指す。「灯油」は現代日本語で石油製品を連想させるため避けた。
theological_decisions:
- issue: הַטְּהֹרָה が儀礼的な清さを指すか、純金という材質を指すか
  choice: 純金の
  alternative: 清い／純粋な
  rationale: 幕屋の燭台は純金製と明記され、聖所の器具に付く「純粋な」は純金を表すことが多い。ただし語自体は「清い／純粋な」であり、材質を明示しない解釈も可能である。
translation_notes:
  register: 幕屋の完成品目を列挙する文脈に合わせ、簡潔で格調のある名詞句とした。本節は前後に続く一覧の一部なので、末尾を読点とした。「燭台」は聖書日本語として定着しつつ、現代の読者にも理解可能な語である。
