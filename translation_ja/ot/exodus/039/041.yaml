  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: ja
  text: 聖所で務めを行うための、精巧に織られた衣服[a]、祭司アロンのための聖なる装束、またその子らが祭司として仕えるための衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「務めのための衣服」。このヘブライ語表現は、聖所での務めに用いるため特別に作られた織物を指すと考えられる。
    reason: שְׂרָדには「織物」に関わる理解と「奉仕・務め」に関わる伝統的理解があり、語義の幅を示すため。
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: 精巧に織られた衣服
  rationale: שְׂרָדは幕屋に関する文脈で、特別に作られた織物または奉仕用の衣服を指すと考えられる。本文では製作・織物の含意を自然な日本語で示し、語義の不確かさは脚注に残した。
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: 聖所で務めを行うための
  rationale: שׁרתの公的・祭儀的な奉仕の意味を「務めを行う」で表し、קֹדֶשׁはこの文脈では聖別された幕屋の領域を指すため「聖所」とした。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 聖なる装束
  rationale: 祭司のために聖別された特別な衣服であることを示す。「装束」は通常の衣服より儀礼的な服装に適しつつ、後代の特定教派の用語を持ち込まない。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 祭司アロンのための
  rationale: 冠詞付きの称号הַכֹּהֵןを、自然な日本語の同格表現「祭司アロン」で示した。
- source_word: בִּגְדֵי בָנָיו
  choice: その子らの衣服
  rationale: 接尾辞の指示対象をアロンとして保ち、複数形を「子ら」で明示した。
- source_word: לְכַהֵן
  choice: 祭司として仕える
  rationale: כֹּהֵןから派生した動詞で、祭司の職務を果たすことを意味するため、役割と奉仕の両面が伝わる表現とした。
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָדとבִּגְדֵי הַקֹּדֶשׁの関係
  choice: 前者を聖所での務めに用いる特別な織り仕立ての衣服、後者をアロンの聖なる装束として、反復と区別を保って訳した。
  alternative: 両者をほぼ同義と見て、前者を「奉仕用の衣服」と訳す。
  rationale: ヘブライ語本文は二つの表現を反復して列挙している。両者を同一視せず、かといって機能上の差を本文以上に限定しない訳とした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀的文脈にふさわしい端正な文体とした。原文が前節から続く列挙の一部であるため、日本語でも名詞句の列挙として訳した。
