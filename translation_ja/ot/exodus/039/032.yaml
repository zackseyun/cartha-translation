- from: こうして、会見の天幕である幕屋のすべての工事が完了した。イスラエルの子らは、ヤハウェ[a]がモーセに命じたすべてのとおりに行った。そのように彼らは行った。
  to: こうして、幕屋、すなわち会見の天幕に関するすべての作業が完了した。イスラエルの人々は、ヤハウェ[a]がモーセに命じたすべてのとおりに行った。彼らはそのとおりに行った。
