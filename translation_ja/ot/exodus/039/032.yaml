  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: ja
  text: こうして、幕屋、すなわち会見の天幕に関するすべての作業が完了した。イスラエルの人々は、ヤハウェ[a]がモーセに命じたすべてのとおりに行った。彼らはそのとおりに行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」はヘブライ語の神名 יהוה（YHWH）。伝統的には「主」と訳される。
    reason: divine_name
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: 完了した
  rationale: 動詞 כלה はここで一連の製作作業が完遂されたことを表す。日本語では主語を「工事」とした自動詞表現が自然で、明示されていない行為者も補わない。
- source_word: כָּל עֲבֹדַת
  choice: すべての工事
  rationale: כָּל の包括性を保ちつつ、עֲבֹדָה は直前まで述べられた幕屋製作の作業を指すため、「奉仕」ではなく「工事」とした。
- source_word: מִשְׁכַּן
  choice: 幕屋
  rationale: 移動式聖所を指す日本語聖書の定着語であり、「住まい」という語源的意味より文脈上の指示対象が明瞭である。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神との定められた出会いの場所という名称を保つ定着した表現。מִשְׁכַּן との連結を「である」で示した。
- source_word: וַיַּעֲשׂוּ
  choice: 行った
  rationale: ここでは製作だけでなく、命令全体への服従を総括するため、「造った」より広い「行った」が適切である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の父祖に由来する集団呼称を可視化しつつ、複数の集団を自然に表す。「イスラエル人」という慣用訳も可能だが、原文の比喩的・系譜的形を保持した。
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのとおりに
  rationale: 命令との完全な一致を簡潔な現代日本語で表す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 日本語では時制関係が文脈から明白なため、過去完了を過度に明示せず、先行する命令を自然に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文の神名四文字を称号「主」に置換せず、一般的な日本語音写で示した。
- source_word: כֵּן עָשׂוּ
  choice: そのように彼らは行った
  rationale: 完全な服従を強調する原文末尾の反復を、省略せず独立文として保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文は称号ではなく固有の神名を用いているため、その区別を保つ。発音の再構成には不確実性があるので脚注で伝統的代替訳も示す。
- issue: בְּנֵי יִשְׂרָאֵל の集団的範囲
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 男性複数形の系譜的表現を形式上保持する一方、文脈ではイスラエル共同体を集合的に指す。性別や参加者の範囲を本文以上に限定する解釈は加えない。
- issue: כֵּן עָשׂוּ の反復
  choice: そのように彼らは行った
  alternative: 前文に統合して省略する
  rationale: この反復は命令への厳密な従順を修辞的に強調しているため、滑らかさのために削除しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」で段落の総括性を示し、原文の二重の עשה は日本語でも反復して強調を保持した。英語POBの脚注配置には内容上の不整合が見られるため、WLC本文に基づいて神名の箇所にのみ脚注を置いた。
