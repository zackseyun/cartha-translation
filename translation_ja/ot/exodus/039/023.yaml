base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: ja
  text: 上衣には、中央に首を通す口があり、それはよろいの開き口のようであった[a]。その口の周囲には縁取りが施され、裂けないようになっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よろい」に当たるヘブライ語 תַחְרָא はまれな語で、防護用の衣類を指す。具体的には「鎖かたびら」や「胸当て」のようなものとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי
  choice: 首を通す口
  rationale: 衣服について用いられているため、字義どおりの「口」だけではなく、上衣の首を通す開口部であることを明確にした。
- source_word: הַמְּעִיל
  choice: 上衣
  rationale: 祭司が着る外衣を指す語として、現代日本語で明瞭かつ文脈に適した「上衣」を採用した。
- source_word: בְּתוֹכוֹ
  choice: 中央に
  rationale: 開口部が衣服の中央部に位置するという空間的意味を自然な日本語で表した。
- source_word: כְּפִי תַחְרָא
  choice: よろいの口のよう
  rationale: תַחְרָא は防護用の武具を指すまれな語だが、その具体的な種類は確定しにくいため、本文では広い意味の「よろい」とし、不確かさを注で示した。
- source_word: שָׂפָה לְפִיו סָבִיב
  choice: その口の周囲には縁取りが施され
  rationale: 直訳的には「その口の周囲に縁」であり、開口部を補強する縁を衣服として自然に描写した。
- source_word: לֹא יִקָּרֵעַ
  choice: 裂けないようになっていた
  rationale: 補強された縁の目的または結果を表す未完了形として、機能を自然に伝えた。
