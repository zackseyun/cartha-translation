  text: וְ/אֶת מִכְסֵ֞ה עוֹרֹ֤ת הָֽ/אֵילִם֙ הַ/מְאָדָּמִ֔ים וְ/אֶת מִכְסֵ֖ה עֹרֹ֣ת הַ/תְּחָשִׁ֑ים וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/034.yaml
  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: ja
  text: 赤く染めた雄羊の皮の覆い、タハシュの皮の覆い[a]、そして仕切りの垂れ幕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」が何を指すかは不明。特定の動物の皮（伝統的にはイルカ、ジュゴンなどの皮）を指すとも、ある種の上質な革を指すとも考えられている。
    reason: 語義が不確かなため、本文では音写し、主な解釈を示した。
lexical_decisions:
- source_word: מִכְסֵה
  choice: 覆い
  rationale: 幕屋を覆う物を指す名詞として、形と意味を過度に限定せず簡潔に表した。
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: 赤く染めた雄羊の皮
  rationale: הַמְאָדָּמִים は単に赤い色であることより、皮が赤く加工・染色されたことを表すと考えられるため。
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: タハシュの皮[a]
  rationale: תְּחָשִׁים が指す動物または革の種類は不明であり、特定の動物名や品質を本文で断定せず、音写して不確かさを保持した。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 仕切りの垂れ幕
  rationale: פָּרֹכֶת の幕屋内部を隔てる機能と、מָסָךְ の遮蔽・仕切りという意味を、自然な現代日本語で表した。属格的な関係は「の」で保持した。
