    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: 金の輪
  rationale: 祭司の装束を留めるための環を指す。素材を明示しつつ、現代日本語として自然な表現にした。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 祭司が胸に着ける装具を指す。武具を強く連想させる語を避け、装束の一部として分かりやすい訳語を採った。
- source_word: שְׂפָתוֹ
  choice: その縁
  rationale: 字義は「唇」だが、製作物については「縁」が自然で正確である。
- source_word: שְׁנֵי קְצוֹת
  choice: 両端
  rationale: 形状を「角」と限定せず、קָצֶה の基本的な意味である端・末端を簡潔に表した。
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: エフォドに向いた内側の
  rationale: בָּיְתָה の「内へ／内側に」と、אֶל עֵבֶר の方向・位置関係を合わせ、胸当てのうちエフォド側にある面を示す表現とした。ただし「向いた／向かい合った」という解釈の幅は注で保持した。
- source_word: וַיָּשִׂימוּ עַל
  choice: 取り付けた
  rationale: 直訳は「置いた」だが、装束の製作工程で輪を縁に固定する文脈に即し、自然な日本語とした。
