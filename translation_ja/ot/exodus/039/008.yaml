base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: ja
  text: 彼は、エフォドと同じように作り、巧みな意匠を凝らした仕事として胸当て[a]を作った[b]。金、青糸、紫糸、緋色の糸、より合わせた上質の亜麻糸を用いて作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胸飾り」とも訳せる。ここでいう胸当ては祭司の装具であり、金属製の防具を意味しない。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「意匠を凝らす者の仕事として」。図柄を伴う熟練した細工を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: 物語を進めるワイッイクトール形。日本語では文脈上明らかな接続辞を補わず、自然な過去形で表した。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: エフォドに結び付けられる祭司の胸部装具を指す。金属製の防具とは限らないが、簡潔で理解しやすい訳語として採用し、別訳を脚注に示した。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠を施した
  rationale: 単なる製作ではなく、図柄や意匠を伴う熟練した細工を表す句。職人そのものより細工の性質に焦点を当てた自然な日本語とした。
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: エフォドと同じ作り方で
  rationale: 胸当ての細工と材料がエフォドの製作に対応することを、明瞭な日本語で表した。
- source_word: אֵפֹד
  choice: エフォド
  rationale: 正確に対応する一般的な日本語がない祭司装束の専門語なので、慣用的な音写を用いた。
- source_word: זָהָב
  choice: 金糸
  rationale: 語自体は「金」だが、この製作文脈では金が糸状に加工されて織り込まれていることが直前の39章3節に明記されるため、「金糸」とした。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青色、紫色、緋色の糸
  rationale: 幕屋の織物に用いられる染色糸の並列。現代日本語で色と素材の関係が明確になるよう「糸」を補った。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: より合わせた上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻布・亜麻糸と、מָשְׁזָרの撚り合わせた状態の双方を保った。
