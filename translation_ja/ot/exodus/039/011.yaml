  text: 第二列には、トルコ石[a]、サファイア、ダイヤモンド。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代の宝石名には、正確な同定が難しいものがある。「トルコ石」は「エメラルド」または「カーバンクル」、「ダイヤモンド」は「ヒヤシンス石」または「碧玉」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר הַ/שֵּׁנִי
  choice: 第二列には
  rationale: טוּרは胸当てに並べられた宝石の「列」を指す。接続詞וְは連続する列挙という文脈に自然に含め、助詞「には」で前後とのつながりを示した。
- source_word: נֹפֶךְ
  choice: トルコ石
  rationale: 古代の宝石名の同定には不確かさがあるが、現代の有力な訳語の一つを本文に採用し、別案を注記した。
- source_word: סַפִּיר
  choice: サファイア
  rationale: 標準的な対応語。古代の鉱物が現代のサファイアと厳密に同一かは断定できないが、一般読者に通じる定着した訳語である。
- source_word: וְ/יָהֲלֹם
  choice: ダイヤモンド
  rationale: 同定に不確かさのある宝石名だが、伝統的で広く通用する訳語を本文に置き、別案を注記した。語頭の接続詞וְは日本語の並列構文に反映した。
