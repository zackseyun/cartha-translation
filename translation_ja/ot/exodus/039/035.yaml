  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: ja
  text: あかしの箱と、その担ぎ棒、贖いの蓋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「贖罪所」。これは箱の蓋を指し、贖いに関わる意味を帯びるヘブライ語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן הָעֵדֻת
  choice: あかしの箱
  rationale: אֲרוֹןは聖なる収納具である「箱」を指し、עֵדוּתは契約の石板を神の「あかし」として示す語である。「契約の箱」は広く知られた呼称だが、ここでは原語の表現をより直接に保った。
- source_word: בַּדָּיו
  choice: その担ぎ棒
  rationale: 幕屋の用具を運ぶために取り付ける棒を指す。単なる「棒」より用途が明確で、現代日本語として自然である。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 箱の上に置かれる蓋という具体的な物体と、語が帯びる贖いの含意をともに伝える。「贖罪所」より形状が分かりやすく、祭儀的意味も失わない。
theological_decisions:
- issue: כַּפֹּרֶתの祭儀的意味と具体的形状をどう表すか
  choice: 贖いの蓋
  alternative: 贖罪所／蓋
  rationale: 原語は箱の蓋を指すと同時に、贖いに関わる祭儀的な含意を持つ。「贖いの蓋」は両面を保ち、後代の特定の教理体系に限定しない。別訳の可能性は脚注で示した。
translation_notes:
  register: 簡潔な列挙表現を保ち、現代の一般読者に分かる語を用いた。「あかし」は聖書文脈での術語性を保つため平仮名とし、「担ぎ棒」で用途を明示した。
