reference: Exodus 39:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: ja
  text: 彼らは純金で額当て、すなわち聖なる冠を作り、その上に、印章の彫刻のように、「ヤハウェに聖なるもの」と刻んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェへの聖別」。
    reason: ヘブライ語 קֹדֶשׁ は、ここで「聖なるもの」とも抽象名詞「聖別」とも訳し得るため。
lexical_decisions:
- source_word: צִיץ
  choice: 額当て
  rationale: 祭司の装束という文脈では、花飾りではなく、ターバンの前面に付ける金の板を指す。現代日本語で位置と用途を明瞭に示すため「額当て」とした。
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: 聖なる冠
  rationale: נֵזֶר の冠・冠飾りという意味と、聖別された性格を保つ。「額当て、すなわち聖なる冠」と同格に訳し、二つの名詞表現を残した。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 素材を自然な日本語で示し、金の純粋さと上質さを保持する。
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: その上に……と刻んだ
  rationale: 基本義は「書く」だが、金板への記載であり、後続する印章彫刻の句を踏まえて、日本語では「刻んだ」が最も自然で具体的である。
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: 印章を彫るように
  rationale: 銘文が印章の彫刻と同様の仕方で施されたことを、簡潔で自然な日本語にした。
- source_word: קֹדֶשׁ לַיהוָה
  choice: ヤハウェに聖なるもの
  rationale: 簡潔な奉献銘を維持し、קֹדֶשׁ の「聖なるもの／聖別」という幅を過度に限定しない。抽象名詞的な理解は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で一般的な音写により示した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の神名を用いているため、称号「主」で代用せず音写した。
- issue: 銘文 קֹדֶשׁ לַיהוָה の文法的含意
  choice: 「ヤハウェに聖なるもの」
  alternative: 「ヤハウェへの聖別」
  rationale: קֹדֶשׁ は、対象がヤハウェに属する聖なるものだという奉献的表現にも、抽象名詞「聖別」とも理解できる。本文では簡潔な奉献の意味を示し、別の可能性を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭司装束と奉献銘にふさわしい荘重さを保った。「すなわち」により「額当て」と「聖なる冠」の同格関係を明示した。
