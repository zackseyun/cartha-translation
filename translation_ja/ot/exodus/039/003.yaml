  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: ja
  text: 彼らは金の薄板[a]を打ち延ばし、それを細い糸状に切り[b]、青糸、紫糸、緋色の糸、上質の亜麻糸の中に織り込んだ。これは意匠を凝らした仕事であった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金の板」とも訳せる。ヘブライ語は、打ち延ばした薄い金属片を指す。
    reason: lexical_alternative
  - marker: b
    text: 「細い帯状に切り」とも訳せる。金を織物に組み入れられる細い糸状のものに加工したという意味。
    reason: lexical_alternative
  - marker: c
    text: 「熟練した職人の仕事」または「巧みな織り手の仕事」とも訳せる。原語は、意匠を凝らした高度な職人仕事を表す専門的な言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ
  choice: 打ち延ばし
  rationale: 金属を打って薄く広げる作業を表す動詞であり、現代日本語の金工表現として自然である。
- source_word: פַּחֵי הַזָּהָב
  choice: 金の薄板
  rationale: פַּחִים は薄く打ち延ばした金属片を指す。「薄板」は後続する切断工程にもよくつながる。
- source_word: וְקִצֵּץ פְּתִילִם
  choice: それを細糸に切って
  rationale: 金の薄板を織り込み用の細い糸状のものに切ったという文脈を明示した。「細い帯状に切って」も可能であるため注記した。ヘブライ語では直前の複数動詞に対してここだけ単数形だが、主語交替が意図されたかは不明であり、日本語では主語を明示せず自然に訳した。
- source_word: בְּתוֹךְ
  choice: 中に織り込んだ
  rationale: 色糸と亜麻糸の内部に金糸を組み入れる織物工程を、文脈に即して自然に表現した。
- source_word: הַתְּכֵלֶת
  choice: 青糸
  rationale: 青く染めた織物素材を指す。日本語では織り込みの対象であることが明瞭になるよう「糸」を補った。
- source_word: הָאַרְגָּמָן
  choice: 紫糸
  rationale: 紫に染めた織物素材を指す。並列表現を整えるため「糸」を補った。
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: 緋色の糸
  rationale: 緋色に染めた糸または素材を指す伝統的な色彩表現を、理解しやすい現代日本語で示した。
- source_word: הַשֵּׁשׁ
  choice: 上質の亜麻糸
  rationale: 幕屋の織物に用いる良質な亜麻素材を指す。織物工程に合わせて「糸」とした。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠による仕事
  rationale: 計画的で高度な意匠を伴う職人仕事を表す技術的表現。特定の職種に限定せず、芸術的設計と熟練した制作の両面を保った。
