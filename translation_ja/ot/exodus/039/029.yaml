base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: また、撚り合わせた上質の亜麻糸と、青、紫、緋色[b]の糸を使い、刺繍職人の手で腰帯[a]を作った。ヤハウェがモーセに命じたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帯」または「腰ひも」とも訳せる。祭司が衣服の上から締める帯を指す。
    reason: lexical_alternative
  - marker: b
    text: 「深紅」とも訳せる。ヘブライ語は、緋色ないし深紅に染めた素材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: 腰帯
  rationale: 祭司の衣服の一部として腰に締める帯を指すため、現代日本語で具体的かつ自然な「腰帯」とした。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻布・亜麻糸という素材と、מָשְׁזָרの撚り合わせた加工の両方を明示した。文脈上、色糸とともに腰帯を作る材料なので「糸」と表現した。
- source_word: תְכֵלֶת
  choice: 青
  rationale: 幕屋の織物に用いられる高価な青色の染色素材を表す。後続の「糸」が三つの色すべてにかかる自然な日本語とした。
- source_word: אַרְגָּמָן
  choice: 紫
  rationale: 幕屋の織物に用いられる紫色の染色素材を表す標準的で簡潔な訳語。
- source_word: תוֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 緋色に染めた繊維素材を指すため、「糸」を補って織物の文脈を明確にした。色調には幅があり得るので脚注を付した。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 刺繍職人の手で
  rationale: 熟練した職人による装飾的な織り・刺繍の仕事を表す。職人への言及を保ちつつ、日本語として自然にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を音写した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりであった
  rationale: 神の命令への正確な服従を示す、出エジプト記で反復される定型句を明瞭に再現した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された固有の神名を称号で代替せず、一般的な学術的再建に基づく音写で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。節が直前から続く材料列挙であることを踏まえ、日本語では文脈上補われる「作った」を明示した。脚注記号は該当語の直後に置いた。
