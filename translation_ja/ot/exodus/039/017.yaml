  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: ja
  text: 彼らは金のよりひも二本を、胸当ての両端にある二つの輪に取り付けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金の鎖二本」とも訳せる。ヘブライ語は、より合わせたひも、または鎖状のものを指し得る。ここでは金で作られ、胸当ての端にある輪に付けられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 取り付けた
  rationale: נתןはここでは物を輪の上に置く、すなわち装着する動作を表す。製作手順として自然な日本語にした。
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: 二本の金の組みひも
  rationale: עֲבֹתֹתは撚ったひも、または鎖状のものを指し得る。金製であることを保ちつつ、基本的な撚りの像を「組みひも」で表した。
- source_word: שְׁתֵּי הַטַּבָּעֹת
  choice: 二つの輪
  rationale: 個数を明示し、幕屋の器具をつなぐ金具として一般読者にも分かりやすい「輪」を用いた。
- source_word: קְצוֹת הַחֹשֶׁן
  choice: 胸当ての両端
  rationale: קְצוֹתは複数の端を表す。この箇所では二つの輪との対応があるため、自然な日本語の「両端」とした。חֹשֶׁןは祭司の装具である「胸当て」とした。
