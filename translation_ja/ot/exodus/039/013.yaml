  yaml_path: translation/ot/exodus/039/013.yaml
  text: 'and the fourth row: beryl[a], onyx, and jasper[b], mounted in settings of gold in their mountings.'
translation:
  language: ja
  text: 第四列は、緑柱石[a]、オニキス、碧玉であった。これらは金の枠にはめ込まれていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 胸当てに用いられた宝石のうち、いくつかは正確に同定できない。「緑柱石」「オニキス」「碧玉」は、広く用いられてきた対応語である。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「金の枠に、それぞれのはめ込みに従って取り囲まれていた」。末尾のヘブライ語は細工に関する専門的な表現で、石が所定の受け枠にはめられていたことを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: 第四列は
  rationale: 胸当ての宝石を並べた文脈なので、טוּרを自然な「列」とした。接続詞は、日本語では列挙の流れによって十分示されるため独立した「そして」とはしなかった。
- source_word: תַּרְשִׁישׁ
  choice: 緑柱石
  rationale: 鉱物の同定には不確かさがあるが、古代の宝石名として有力で伝統的な対応語の一つである。脚注で不確かさを明示した。
- source_word: שֹׁהַם
  choice: 縞めのう
  rationale: 祭司装束の文脈で伝統的にオニキスとされる語を、一般読者にも意味の伝わる現代日本語の宝石名で表した。厳密な鉱物同定の不確かさは脚注に含めた。
- source_word: וְיָשְׁפֵה
  choice: 碧玉
  rationale: יָשְׁפֵהの一般的な対応語であり、日本語として確立した宝石名を用いた。
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: 金の台座にはめ込まれていた
  rationale: 受動的に囲まれ、金の宝石枠に据えられた状態を、細工物の文脈に合う明瞭な日本語で表した。
- source_word: בְּמִלֻּאֹתָם
  choice: はめ込まれていた
  rationale: 石が所定の枠や受けに収められたことを指す技術的表現と理解し、直前の語句との重複を避けつつ自然に統合した。解釈の幅は脚注で示した。
