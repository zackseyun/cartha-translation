  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: ja
  text: 彼は、祭壇のすべての用具、すなわち、鍋[a]、シャベル、鉢、フォーク、火皿を作った。彼は祭壇の用具をすべて青銅[b]で作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この「鍋」は、灰を取り除くための容器だった可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「銅」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: 祭壇のすべての用具
  rationale: כְּלִי は器や道具を広く指す。ここでは祭壇で用いる多様な器具の総称なので、現代日本語として明瞭な「用具」とした。
- source_word: הַסִּירֹת
  choice: 鍋
  rationale: סִירוֹת の基本的な意味を保った。祭壇では灰を扱う容器だった可能性があるため、脚注で補った。
- source_word: הַיָּעִים
  choice: 十能
  rationale: יַעִים は灰や燃えさしをすくう道具を指す。祭壇の文脈に合い、一般的な「シャベル」より用途を的確に表す「十能」を採った。
- source_word: הַמִּזְרָקֹת
  choice: 鉢
  rationale: מִזְרָקוֹת は祭儀で液体を受けたり振りかけたりする器。「鉢」は形状を限定しすぎず自然である。
- source_word: הַמִּזְלָגֹת
  choice: 肉刺し
  rationale: מִזְלָגוֹת は先が分かれた祭壇用の道具。単なる食卓用の「フォーク」という印象を避け、祭儀で肉を扱う器具として理解しやすい「肉刺し」とした。
- source_word: הַמַּחְתֹּת
  choice: 火皿
  rationale: מַחְתָּה は炭火や燃えさしを扱う皿状の器具を指す。「香炉」と限定せず、機能を明瞭に示す「火皿」とした。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: נְחֹשֶׁת は銅または銅合金を指し得るが、幕屋の用具について定着し、古代の金属使用にも適合する「青銅」を本文に採用した。語義上の別案「銅」は脚注に示した。
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: 作った……作った
  rationale: 原文は עשה を二度用いており、最初に個々の用具を列挙し、最後に材質をまとめて述べる。この反復構造を日本語でも保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」で列挙を自然につなぎ、原文の二度の「作った」を保持した。脚注記号は該当語の直後に配置した。
