  source_fidelity: 主要な語句は適切に反映されている。もっとも、פֻּקַּד はここで会計・集計（פקודי）に対応する公式の算定を表すため、「調べられ」より「集計された」が正確である。また、原文は「幕屋そのものが調べられ、記録が作成された」と二段階の行為を明示しているのではない。
  naturalness: 現行の「これは…調べられ、…作成された」は、第二文の「これは」が幕屋を指すようにも読め、「会計記録」が作成されたという補足も原文以上に具体化している。会計記録を主題として「集計された」とする方が、現代標準日本語として自然で簡潔である。
  terminology: 「幕屋」「証し」「祭司」「レビ人」「イタマル」は適切である。「監督のもと」はבְּיַדの文脈上の監督・管理の意味を自然に表す。「契約の箱」は注で石の板の所在を説明する際の標準的で明確な表現である。
