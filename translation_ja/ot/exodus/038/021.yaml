revisions:
- from: これは、幕屋、すなわち証しの幕屋[b]についての会計記録[a]である。これはモーセの命令に従って調べられ、祭司アロンの子イタマルの指揮[c]のもと、レビ人の奉仕によって作成された。
  to: これは、幕屋、すなわち証しの幕屋[b]についての会計記録[a]である。この会計記録は、モーセの命令により、祭司アロンの子イタマルの監督のもとで、レビ人の奉仕として集計された。
  rationale: 会計・算定を表す名詞と受動動詞の対応を日本語でも保つため、「調べられ、…作成された」を「会計記録は…集計された」に改めた。「レビ人の奉仕として」は、レビ人に割り当てられた務めと、そのもとで行われた集計という原文の関係を、過度に制度化せずに表す。注a・cは原文の語義上の選択肢を保持し、注bのみ、石の板の所在を明確にするため「契約の箱」とした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:26:27Z'
