  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: ja
  text: これは、幕屋、すなわち証しの幕屋[b]についての会計記録[a]である。この会計記録は、モーセの命令により、祭司アロンの子イタマルの監督のもとで、レビ人の奉仕として集計された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「会計」「目録」とも訳せる。ヘブライ語は、公式に調べて数えた記録を指す。
    reason: lexical_alternative
  - marker: b
    text: 「証し」は、契約の証し、特に契約の箱に納められた石の板を指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: פְקוּדֵי
  choice: 会計記録
  rationale: 公式に資材を調べ、数え、記録した結果を指す語である。単なる「数」ではなく、幕屋建設に関する公的な勘定・記録という文脈を明確にする。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記で聖所の構造物を指す定着した訳語であり、現代日本語でも文脈上理解できる。
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: 証しの幕屋
  rationale: 同格的な反復を保ち、「証し」を本文で契約文書や石板と断定せず、ヘブライ語の含みを残す。
- source_word: פֻּקַּד
  choice: 調べられ
  rationale: פְקוּדֵי と呼応する受動形として、資材や記録が公式に点検・集計されたことを表す。後続の「作成された」で日本語の文意を補う。
- source_word: עַל פִּי מֹשֶׁה
  choice: モーセの命令に従って
  rationale: 直訳の「モーセの口に従って」ではなく、命令・指示に基づくことを表すヘブライ語の慣用句として訳す。
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: レビ人の奉仕によって
  rationale: 幕屋に関して割り当てられた労務・奉仕を表し、後代の教会用語を持ち込まずに祭儀的かつ実務的な働きを示す。
- source_word: בְּיַד אִיתָמָר
  choice: イタマルの指揮のもと
  rationale: 字義は「イタマルの手によって」だが、ここではレビ人の働きに対する監督・指揮を示す慣用表現として自然に訳す。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: アロンの職名を示す定冠詞付きの語であり、「祭司アロン」と自然な日本語で表した。
theological_decisions:
- issue: 「証し」（הָעֵדֻת）が具体的に何を指すか
  choice: 本文では「証し」と訳し、対象を限定しない
  alternative: 「契約の板」または「契約文書」と明示する
  rationale: 契約の証し、とりわけ箱に納められた石板を指す可能性が高いが、原文自体はここでそれを明示していないため、本文では解釈上の余地を保ち、注で背景を示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「幕屋」「証し」「祭司」「レビ人」は聖書文脈で定着した語として保持した。原文の長い名詞的構文は二文に分け、公式記録の性格と、レビ人およびイタマルの役割が自然に伝わるようにした。
