revisions:
- from: 彼は祭壇のために、青銅の網細工の格子[a]を作り、その張り出し[b]の下に、下方から祭壇の中ほどまで取り付けた[c]。
  to: 彼は祭壇のために、青銅製の網状の格子[a]を作った。これは祭壇の張り出し[b]の下にあり、下から祭壇の中ほどまで達していた[c]。
