  - severity: low
    issue: 「網細工の格子」はやや不自然である。
    rationale: 格子そのものが網状であることを示す表現として、「網状の格子」のほうが明瞭で自然である。
  revised_text: 彼は祭壇のために、青銅製の網状の格子[a]を作った。これは祭壇の張り出し[b]の下にあり、下から祭壇の中ほどまで達していた[c]。
