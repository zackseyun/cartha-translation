  text: וַ/יַּ֤עַשׂ לַ/מִּזְבֵּ֨חַ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת תַּ֧חַת כַּרְכֻּבּ֛/וֹ מִ/לְּ/מַ֖טָּה עַד חֶצְיֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: ja
  text: 彼は祭壇のために、青銅製の網状の格子[a]を作った。これは祭壇の張り出し[b]の下にあり、下から祭壇の中ほどまで達していた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「青銅で網状に作った格子」。
    reason: lexical_alternative
  - marker: b
    text: 祭壇のこの構造部分を指すヘブライ語は、「縁」「棚」「取り巻く部分」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 原文は直訳すると「その張り出しの下、下からその中ほどまで」。
    reason: translation_clarity
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作り
  rationale: 物語を進めるワイイクトール。日本語では後続動作につながる連用形で自然に表した。
- source_word: לַמִּזְבֵּחַ
  choice: 祭壇のために
  rationale: ל は用途・対象を示し、格子が祭壇用に作られたことを表す。
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: 網細工の格子
  rationale: 「網の作りによる格子」という構造を、重複感を避けつつ明瞭な現代日本語で表した。
- source_word: נְחֹשֶׁת
  choice: 青銅の
  rationale: 幕屋関連の器具における慣用的かつ文脈上妥当な訳。字義的には銅も可能。
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: その張り出しの下に
  rationale: כַּרְכֻּבּוֹ は祭壇の突き出た縁または棚状部分を指すとみられるため、「張り出し」とした。
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: 下方から祭壇の中ほどまで
  rationale: 起点を示す מִן と限界を示す עַד を保ち、指示対象が祭壇であることを日本語で明確にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祭具の描写にふさわしい簡潔で品位ある文体とした。「取り付けた」は空間関係を自然に示すための最小限の補足であり、脚注で明示した。
