  text: וְ/הָ/אֲדָנִ֣ים לָֽ/עַמֻּדִים֮ נְחֹשֶׁת֒ וָוֵ֨י הָֽ/עַמּוּדִ֜ים וַ/חֲשׁוּקֵי/הֶם֙ כֶּ֔סֶף וְ/צִפּ֥וּי רָאשֵׁי/הֶ֖ם כָּ֑סֶף וְ/הֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: ja
  text: 柱の台座[a]は青銅、柱の鉤とその帯金具[b]は銀、その頂部の覆いも銀であった。また、庭のすべての柱には銀の帯金具が取り付けられていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「台座」は「受け台」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「帯金具」と訳したヘブライ語が示す建築部材の正確な形状は不明だが、柱に取り付けられた銀製の金具を指す。
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: 台座
  rationale: 柱を支える基部または受け台を指す。現代日本語で明瞭な「台座」を本文に採用し、「受け台」という可能性は脚注に残した。
- source_word: עַמֻּדִים
  choice: 柱
  rationale: 構造物を垂直に支える部材を指し、文脈に即した自然な建築用語である。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋関連の金属表現として慣用的であり、当時の合金を指す可能性にも適する。
- source_word: וָוֵי
  choice: 鉤
  rationale: 柱に付属する引っ掛け用の金具を簡潔に表す。
- source_word: חֲשׁוּקֵיהֶם / מְחֻשָּׁקִים
  choice: 帯金具／帯金具を取り付けてあった
  rationale: 同根語のつながりを保ちつつ、柱に伴う銀製の締め具・装着物であることを示す。部材の厳密な形状は確定できないため、過度に特定しない表現とした。
- source_word: צִפּוּי
  choice: 覆い
  rationale: 表面を覆う金属層を表し、「めっき」ほど製法を限定しない。
- source_word: רָאשֵׁיהֶם
  choice: その頂部
  rationale: 直訳的な「頭」に相当する柱の上端を、自然な現代日本語で表した。
- source_word: חָצֵר
  choice: 庭
  rationale: 囲われた外庭を指す文脈で、簡潔かつ一般読者に理解しやすい。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の並列を保ちながら、日本語として過度に冗長にならないよう二文に整えた。同根語 חֲשׁוּקֵיהֶם と מְחֻשָּׁקִים は「帯金具」で対応させ、語彙的連関を保持した。
