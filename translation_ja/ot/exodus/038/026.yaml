base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: ja
  text: 一人につき一ベカ[a]、すなわち聖所のシェケルによる半シェケルであった。これは、二十歳以上で人口調査に登録されたすべての者[b]、六十万三千五百五十人の分である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一ベカは、聖所の基準による半シェケルに相当した。
    reason: cultural_note
  - marker: b
    text: 直訳は「登録者のもとを通るすべての者」。人口調査に加わり、登録・計上される者を指す表現。別訳「登録された者たちの間を通るすべての者」。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: 一ベカ
  rationale: 特定の重量単位なので音写し、直後の「半シェケル」がその値を説明する形を保持した。
- source_word: לַגֻּלְגֹּלֶת
  choice: 一人につき
  rationale: 字義は「頭蓋骨につき」だが、人口を一人ずつ数える慣用表現であり、現代日本語では意味を自然に伝える訳とした。
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: 半シェケル
  rationale: ベカの重量を明示する単純な連語として訳した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準として
  rationale: 聖所で用いる標準重量に照らした値であることを明確にした。
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: 数えられた者の中に加わったすべての者
  rationale: 登録のため列を通るという人口調査上の表現を、動きの含意をある程度残しつつ自然な日本語にした。別の直訳的理解は脚注に示した。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十歳以上
  rationale: 年齢の下限を表す定型句を簡潔な現代日本語で表した。
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 六十万三千五百五十人
  rationale: ヘブライ語の総数を、日本語本文に適した漢数字と助数詞で示した。
