source:
  edition: WLC
  text: כָּל הַ/זָּהָ֗ב הֶֽ/עָשׂוּי֙ לַ/מְּלָאכָ֔ה בְּ/כֹ֖ל מְלֶ֣אכֶת הַ/קֹּ֑דֶשׁ וַ/יְהִ֣י זְהַ֣ב הַ/תְּנוּפָ֗ה תֵּ֤שַׁע וְ/עֶשְׂרִים֙ כִּכָּ֔ר וּ/שְׁבַ֨ע מֵא֧וֹת וּ/שְׁלֹשִׁ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: ja
  text: 聖所に関わるすべての作業に用いられた金、すなわち振揺のささげ物として献げられた金[a]は、聖所の標準シェケルによれば、二十九キカルと七百三十シェケル[b]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「振揺のささげ物」は、主の前で儀礼的に揺り動かして差し出すささげ物を表すヘブライ語の祭儀用語。
    reason: cultural_note
  - marker: b
    text: キカルとシェケルは重量の単位。ここでは一キカルは三千シェケルに相当する（出エジプト記38章26節参照）。
    reason: measurement_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: 工事に用いられた
  rationale: 受動分詞 הֶעָשׂוּי は、金そのものが「作られた」というより、幕屋建設のために使用されたことを表す。מְלָאכָה はこの文脈では製作・建設の仕事を指すため、「工事」とした。
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: 聖所のあらゆる工事に
  rationale: הַקֹּדֶשׁ をこの幕屋会計の文脈に即して「聖所」とし、聖所に関わる製作作業全体を自然な日本語で表した。
- source_word: זְהַב הַתְּנוּפָה
  choice: 振揺のささげ物として献げられた金
  rationale: תְּנוּפָה は主の前で儀礼的に動かして差し出すささげ物を指す祭儀用語である。「振揺」という伝統的な語を保ちつつ、構文を補って金がそのささげ物であったことを明確にした。
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: 二十九キカルと七百三十シェケル
  rationale: 原文の重量単位を音写して保持し、数詞は現代日本語の自然な語順にした。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準にして
  rationale: 前置詞 בְּ はここで計量基準を示す。「聖所で定められたシェケル重量によって」という意味を、簡潔で明確な日本語にした。
theological_decisions: []
