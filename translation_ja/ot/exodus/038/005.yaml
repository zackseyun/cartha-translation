  text: וַ/יִּצֹ֞ק אַרְבַּ֧ע טַבָּעֹ֛ת בְּ/אַרְבַּ֥ע הַ/קְּצָוֺ֖ת לְ/מִכְבַּ֣ר הַ/נְּחֹ֑שֶׁת בָּתִּ֖ים לַ/בַּדִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/005.yaml
  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: ja
  text: 彼は青銅の格子の四隅[a]に四つの輪を鋳造し、担ぎ棒を通す受け具[b]とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「四つの端に」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「担ぎ棒のための家」。すなわち、棒を差し入れる受け具や取り付け部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 鋳造し
  rationale: יצק は金属を溶かして型に流し込むことを表す。幕屋製作の文脈に即して、現代日本語で明確な「鋳造する」とした。
- source_word: אַרְבַּע טַבָּעֹת
  choice: 四つの輪
  rationale: טַבָּעֹת は器具の運搬用の棒を通す金属製の輪を指すため、素直に「輪」と訳した。
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: 四隅に
  rationale: קָצֶה は端、縁、末端を意味し得るが、方形の格子に四つ配置される文脈では「四隅」が自然である。語義上の別案は脚注に残した。
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: 青銅の格子の
  rationale: מִכְבָּר は網状の格子を指す。נְחֹשֶׁת はこの金属製祭壇の文脈で「青銅」とした。前置詞 לְ はここでは輪が格子に属し、取り付けられる関係として自然な日本語にした。
- source_word: בָּתִּים
  choice: 受け具
  rationale: 字義は「家」だが、ここでは棒を受け入れて保持する部分を表す。「受け具」は機能を明確にしつつ、過度に専門的でない。
- source_word: לַבַּדִּים
  choice: 担ぎ棒を通す
  rationale: בַּדִּים は幕屋の器具を運搬する棒である。「担ぎ棒」として用途を示し、受け具との関係が自然に伝わるよう「通す」を補った。
