translation:
  language: ja
  text: 庭の周囲の台座[a]、庭の門の台座、幕屋のすべての杭[b]、および庭の周囲のすべての杭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け台」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「留め杭」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: 台座
  rationale: 幕屋建設の文脈では、柱などを据える金属製の基礎部品を指す。「台座」は現代日本語で明瞭であり、庭と門の双方に自然に用いられる。
- source_word: חָצֵר
  choice: 庭
  rationale: 幕屋を囲む聖域の外庭を指す。文脈上明確で、簡潔かつ自然な現代日本語として「庭」を選んだ。
- source_word: סָבִיב
  choice: 周囲の
  rationale: 庭が四方を囲むこと、またその外周に属する物品であることを簡潔に示す。節末の用例でも「周囲の庭」として反復を保持した。
- source_word: שַׁעַר
  choice: 門
  rationale: 庭の出入口を指す直接的で慣用的な訳語。
- source_word: יִתְדֹת
  choice: 杭
  rationale: 幕屋と庭を固定するための留め具を指す。「杭」は携帯式聖所の構造物として自然で具体的である。
- source_word: מִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる天幕式聖所の定着した呼称であり、一般的な「住まい」よりも文脈上の特定性を保つ。
- source_word: כָּל
  choice: すべての
  rationale: 複数の杭を漏れなく含む総称表現として原文の包括性を保つ。
- source_word: וְאֵת / וְאֶת
  choice: 列挙（読点）／および
  rationale: 接続詞付き目的語標識が続く目録形式を、日本語では読点による列挙と最後の「および」で自然に表した。
