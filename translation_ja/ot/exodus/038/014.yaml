  text: קְלָעִ֛ים חֲמֵשׁ עֶשְׂרֵ֥ה אַמָּ֖ה אֶל הַ/כָּתֵ֑ף עַמּוּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/014.yaml
  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: ja
  text: 一方の側には、十五キュビトの幕があり、柱は三本、台座は三個であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְלָעִים
  choice: 幕
  rationale: 幕屋の庭を囲む亜麻布の垂れ幕を指す。現代日本語で簡潔かつ文脈に即した表現とした。
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 十五キュビト
  rationale: 原文には長さを示す形容表現がなく、計量句をそのまま自然に訳した。
- source_word: אֶל הַכָּתֵף
  choice: 一方の側には
  rationale: כָּתֵף は字義的には「肩」だが、ここでは門口の片側・脇を指す。直前の節と次節との対応も踏まえ、空間関係を明瞭にした。
- source_word: עַמּוּדֵיהֶם
  choice: 柱は三本
  rationale: 庭の幕を支える構造物なので「柱」とし、日本語の助数詞「本」を用いた。複数接尾辞は日本語で不自然な「それらの」を避け、文脈上の所属を含意させた。
- source_word: אַדְנֵיהֶם
  choice: 台座は三個
  rationale: 柱を受けて支える基部を指すため、一般読者に明瞭な「台座」とした。構造上は「受け座」とも訳し得る。
