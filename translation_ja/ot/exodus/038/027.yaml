base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: ja
  text: 銀百キカルは、聖所のための台座[a]と、垂れ幕[b]のための台座を鋳造するために用いられた。百キカルで百個の台座、すなわち台座一個につき一キカルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「受け台」。幕屋を構成する板や柱の下に置かれた金属製の基礎部品を指す。
    reason: lexical_alternative
  - marker: b
    text: 「垂れ幕」は、聖所と至聖所を隔てていた内側の幕を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: 用いられた
  rationale: この会計報告の文脈では、銀の用途を示す表現として自然に訳した。
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: 銀百キカル
  rationale: 特定の銀の総量を示す簡潔な計量表現とした。単位名キカルを保持し、原文の数量を正確に伝える。
- source_word: לָצֶקֶת
  choice: 鋳造するために
  rationale: 目的を表す不定詞であり、金属加工の文脈なので、単なる『注ぐ』ではなく『鋳造する』とした。
- source_word: אַדְנֵי
  choice: 台座
  rationale: 幕屋の板や柱を支える金属製の基礎部品を指す。現代日本語で分かりやすい『台座』を採用し、別訳を脚注に示した。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: ここでは垂れ幕と区別して、幕屋という聖なる構造物を指す語として『聖所』とした。
- source_word: הַפָּרֹכֶת
  choice: 垂れ幕
  rationale: 聖所と至聖所を隔てる内側の幕を指すため、一般的な『幕』より機能と形状が伝わる『垂れ幕』とした。
- source_word: מְאַת אֲדָנִים לִמְאַת הַכִּכָּר
  choice: 百キカルで百個の台座
  rationale: 百個の台座と百キカルの銀との数量的な対応を、自然な日本語で明示した。
- source_word: כִּכָּר לָאָדֶן
  choice: 台座一個につき一キカル
  rationale: 原文の配分比率を明瞭かつ簡潔に表した。
theological_decisions: []
