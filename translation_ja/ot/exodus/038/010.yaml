  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: ja
  text: 柱は二十本で、その台座二十個は青銅製であった。柱の鉤とその帯[a]は銀製であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帯」は、柱をつなぐ横木または連結部材を指す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: 柱は
  rationale: עַמּוּדִיםは幕を支える構造物を指す。日本語では文脈上明らかな接尾辞を逐語的に「それらの」とせず、自然に「柱は」とした。
- source_word: עֶשְׂרִים
  choice: 二十本／二十個
  rationale: 同じ基数「二十」を保ち、柱と台座に自然な助数詞を用いた。
- source_word: אַדְנֵיהֶם
  choice: その台座
  rationale: 幕屋の文脈で柱を受ける基部または受け金具を指す。現代日本語で明瞭な「台座」を本文に採用した。
- source_word: נְחֹשֶׁת
  choice: 青銅製
  rationale: 銅または青銅を表し得る語だが、幕屋用具の文脈と慣用に沿って「青銅」とした。
- source_word: וָוֵי הָעַמֻּדִים
  choice: 柱の鉤
  rationale: 幕を柱に取り付けるための鉤状の金具と理解し、簡潔で具体的な「鉤」とした。
- source_word: חֲשֻׁקֵיהֶם
  choice: 帯
  rationale: 柱に付属する帯状または連結用の部材を指す難語。形状を比較的よく保つ「帯」を本文に置き、別の理解を注記した。
- source_word: כָּסֶף
  choice: 銀製
  rationale: 材質を示す語なので、自然な叙述として「銀製」とした。
