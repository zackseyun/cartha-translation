  text: וַ/יַּ֣עַשׂ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ הָי֣וּ קַרְנֹתָ֑י/ו וַ/יְצַ֥ף אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: ja
  text: 彼はその四隅に角を作った。その角は祭壇と一体であった[a]。そして祭壇を青銅で覆った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その角はそれから出ていた」。角が別に作られて取り付けられたのではなく、祭壇本体と一体であったことを示す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語ネホシェトは「青銅」とも「銅」とも訳し得る。幕屋に関する文脈では、慣例に従って「青銅」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は…作った
  rationale: עשהのワイイクトル形による継続的な物語叙述。現代日本語として自然に動作を表す。
- source_word: קַרְנֹתָיו
  choice: その角
  rationale: קֶרֶןの具体的な像を保ち、祭壇の四隅にある角状の突起を表す聖所用語として「角」を用いた。
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: その四隅に
  rationale: עַלによる位置関係を、日本語で自然な「四隅に」とした。
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: その角は祭壇と一体であった
  rationale: 直訳は「その角はそれから出ていた」。別に作って取り付けたのではなく、祭壇本体から成る構造を自然な日本語で示す。
- source_word: וַיְצַף אֹתוֹ
  choice: そして祭壇を…覆った
  rationale: צפהは建造物・器具に金属をかぶせることを表す。「覆った」は簡明であり、金属による被覆を文脈とともに伝える。曖昧な代名詞を避けるため、指示対象を「祭壇」と明示した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: この語は銅または青銅を指し得るが、幕屋の器具の文脈で慣用的かつ妥当な「青銅」を本文に採用し、語義上の幅は脚注に残した。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、祭壇の「角」という具体的で伝統的な祭儀用語を保持した。前後関係のない単独節でも指示対象が分かるよう、二度目以降の代名詞を「祭壇」と明示した。
