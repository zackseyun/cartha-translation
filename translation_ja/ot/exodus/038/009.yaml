  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: ja
  text: 彼は庭を造った。南側、すなわち南に向かう側の庭の垂れ幕[a]は、より合わせた上質の亜麻布で、長さは百キュビトであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「庭の幕」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……造った
  rationale: 物語を進めるwayyiqtol形。日本語では接続詞を補わず、簡潔な過去形で自然に表した。
- source_word: הֶחָצֵר
  choice: 庭
  rationale: 幕屋を囲む外庭を指す。現代日本語で明快かつ簡潔な「庭」とした。
- source_word: לִפְאַת
  choice: ……側
  rationale: 方角によって区分される辺・側面を表すため、「側」と訳した。
- source_word: נֶגֶב תֵּימָנָה
  choice: 南側、すなわち南の方
  rationale: 南を示す二つの表現を一つに畳まず、原文の重ねた方向表現を保った。
- source_word: קַלְעֵי הֶחָצֵר
  choice: 庭の垂れ幕
  rationale: 庭の境界を形作る布製の幕を指す。「垂れ幕」は用途と形状を自然に伝える。「幕」も可能なため脚注に示した。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: より合わせた上質の亜麻布
  rationale: שֵׁשׁの上質な亜麻布と、מָשְׁזָרの撚り合わせた加工の両方を明示した。
- source_word: מֵאָה בָּאַמָּה
  choice: 長さは百キュビト
  rationale: 原文の尺度を保持し、文脈上暗示される長さを日本語で補った。
