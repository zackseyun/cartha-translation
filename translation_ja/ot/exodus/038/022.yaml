id: EXO.38.22
reference: Exodus 38:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: ja
  text: ユダ族に属する、フルの子ウリの子ベツァルエルは、ヤハウェ[a]がモーセに命じたすべてのものを造った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「YHWH」。伝統的には「主」と訳される。
    reason: 神名四文字の原語表記と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: ベツァルエルは
  rationale: 接続詞 וּ は前後の叙述を結ぶが、日本語では文頭の「そして」を置かないほうが自然であり、物語上の連続性は文脈から明らかである。人名は慣用的に音写した。
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: フルの子ウリの子
  rationale: 系譜表現 בֶּן を一貫して「子」とし、ベツァルエルがウリの子、ウリがフルの子である関係を原文どおり保持した。
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: ユダ族に属する
  rationale: מַטֶּה はここでは部族を指し、接頭辞 לְ は所属関係を示す。現代日本語で明瞭な表現とした。
- source_word: עָשָׂה
  choice: 造った
  rationale: 幕屋建設の文脈における具体的な製作を表しつつ、広い意味を持つ עשה に過度な専門性を加えない訳語とした。
- source_word: אֵת כָּל אֲשֶׁר
  choice: すべてのものを
  rationale: 関係節が示す対象の総体を自然な日本語で表した。
- source_word: צִוָּה
  choice: 命じた
  rationale: ヘブライ語の完了形を単純過去として訳した。命令が製作に先立つことは文脈と従属節の関係から明らかで、過去完了に相当する説明を補わない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語音写で示した。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: צוה + אֶת が命令を受ける人物を示す構文なので、日本語では「モーセに命じた」と自然に表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを本文に保持するため音写し、伝統的な代替表記は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、系譜と部族所属を一読して把握できる語順にした。文体は簡潔で格調を保ち、神名以外に不要な注釈を加えていない。
