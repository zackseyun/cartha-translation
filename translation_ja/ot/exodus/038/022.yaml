  terminology: 固有名は「ベツァルエル」「ウリ」「フル」「モーセ」として一貫して音写されている。「ユダ族」および神名「ヤハウェ」は適切である。脚注は本文の神名表記と対応し、原語の子音表記および伝統的訳語を過不足なく示している。
