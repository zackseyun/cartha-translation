base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: ja
  text: 会衆のうち数えられた人々[a]の銀は、聖所のシェケルを基準として、百タラントと千七百七十五シェケルであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「会衆の登録者」。
    reason: lexical_alternative
  - marker: b
    text: すなわち、聖所の標準重量に従って量った。
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: 銀
  rationale: この会計の文脈では、抽象的な貨幣ではなく、集められた金属としての銀を指す。
- source_word: פְּקוּדֵי הָעֵדָה
  choice: 会衆のうち、数えられた人々から集められた
  rationale: פְּקוּדֵי は人口調査で登録・計数された人々を表し、属格の כֶסֶף は文脈上、その人々に対応して集められた銀を指す。日本語では関係を明瞭にするため「から集められた」とした。
- source_word: מְאַת כִּכָּר
  choice: 百タラント
  rationale: 古代の大きな重量単位 ככר を慣用的な音訳「タラント」で示した。
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: 千七百七十五シェケル
  rationale: ヘブライ語の加算的な数詞列を、現代日本語の通常の数表現で明瞭に訳した。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 聖所のシェケルを基準として
  rationale: 重量が聖所で用いられる標準に従って量られたことを自然な日本語で表した。
