base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: ja
  text: 彼は担ぎ棒を祭壇の側面にある輪に通し[a]、それで祭壇を運べるようにした。彼はそれを、板で作った中空のものとした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「担ぎ棒を輪の中へ持って来た」。ここでは、担ぎ棒を輪に入れて所定の位置に置いたことを意味する。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「中空、板」。板を用いた中空の構造に造った、という意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 通し
  rationale: ヒフィル形はここで、担ぎ棒を輪の中の所定の位置に入れる動作を表す。「通す」は日本語として自然で、目的物と輪の関係を明確にする。
- source_word: הַבַּדִּים
  choice: 担ぎ棒
  rationale: 幕屋関連の文脈では、聖具を運ぶための棒を指す。「担ぎ棒」は用途が明瞭で、現代日本語として理解しやすい。
- source_word: בַּטַּבָּעֹת
  choice: 輪に
  rationale: 前置詞 ב はここでは棒を輪の中へ位置づけることを示す。「通す」と組み合わせて自然に表現した。
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: 祭壇の側面にある
  rationale: צלעות は祭壇の「側面」を指す。輪の位置を自然な日本語で示し、必要以上に構造を限定しない。
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: それで祭壇を運べるようにした
  rationale: 不定詞句の目的を明示した。「それ」は担ぎ棒を指し、目的語の接尾辞は日本語で曖昧にならないよう「祭壇」とした。
- source_word: נְבוּב
  choice: 中空に
  rationale: 祭壇の内部が詰まっておらず、空洞の構造であることを表す。建造物について自然な現代日本語である。
- source_word: לֻחֹת
  choice: 板で
  rationale: 「中空、板」という簡潔で省略的なヘブライ語句を、板を材料とする中空構造として自然に表した。
- source_word: עָשָׂה אֹתוֹ
  choice: 祭壇は……造った
  rationale: עשה の基本義を「造った」とした。日本語では目的語を前に置いて話題化し、原文の主語である製作者は文脈から補える形にした。
