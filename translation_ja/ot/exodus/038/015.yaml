revisions:
- from: もう一方の脇にも、庭の門のこちら側とあちら側に[a]、十五キュビトの掛け幕があり、柱は三本、台座[b]は三個であった。
  to: 庭の門の両側の、もう一方の側には[a]、十五キュビトの掛け幕があり、柱は三本、台座[b]は三個であった。
  rationale: 原文の「第二の側」と、門を挟む位置を示す句との結び付きは圧縮されており、日本語で完全に一義化しないようにした。その上で、現行訳の「もう一方」と「こちら側とあちら側」の不自然な連結を改め、前節との対照と建築的配置を読み取れる文に整えた。
