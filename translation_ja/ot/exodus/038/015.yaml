  text: וְ/לַ/כָּתֵ֣ף הַ/שֵּׁנִ֗ית מִ/זֶּ֤ה וּ/מִ/זֶּה֙ לְ/שַׁ֣עַר הֶֽ/חָצֵ֔ר קְלָעִ֕ים חֲמֵ֥שׁ עֶשְׂרֵ֖ה אַמָּ֑ה עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: ja
  text: 庭の門の両側の、もう一方の側には[a]、十五キュビトの掛け幕があり、柱は三本、台座[b]は三個であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「庭の門のもう一方の側には」。原文は、前節の「一方の側」に対する「もう一方の側」と、門のこちら側・あちら側という位置関係を簡潔に表している。
    reason: syntactic_ambiguity
  - marker: b
    text: または「受け座」。柱を据えるための基部。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: もう一方の脇にも
  rationale: כָּתֵף は字義的には「肩」だが、ここでは門に隣接する区画の「脇、側」を指す。「もう一方」は הַשֵּׁנִית の対照的な用法を自然な日本語で表す。
- source_word: מִזֶּה וּמִזֶּה
  choice: こちら側とあちら側に
  rationale: 門を挟む二つの側を示す分配的・空間的表現を保った。前後の語との係り方には曖昧さがあるため脚注を付した。
- source_word: לְשַׁעַר הֶחָצֵר
  choice: 庭の門の
  rationale: לְ を門との位置的・構造的な関係として捉え、掛け幕が庭の門の両脇にあることを自然に示した。
- source_word: קְלָעִים
  choice: 掛け幕
  rationale: 幕屋の庭を囲う布製の幕を指す語であり、現代日本語で構造と用途を理解しやすい「掛け幕」とした。
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 十五キュビト
  rationale: 古代の尺度を換算せず保持した。原文は寸法を直接示し、「長さ」は明記しないため補わなかった。
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: 柱は三本
  rationale: 目録的な無動詞文を明瞭な現代日本語に整えた。עַמּוּד はこの建築文脈では「柱」が適切である。
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: 台座は三個
  rationale: אֶדֶן は柱を支える基部または受け具を指す。「台座」は一般読者に理解しやすく、「受け座」という別訳も脚注に残した。
theological_decisions: []
