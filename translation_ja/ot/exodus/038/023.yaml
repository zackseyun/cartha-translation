base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: ja
  text: 彼とともにいたのは、ダン部族に属するアヒサマクの子オホリアブ[a]であった。彼は工芸の職人、意匠を考案する者、また青、紫、緋色の糸[b]と上質の亜麻布に刺繍を施す者であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アホリアブ」とも表記される。ヘブライ語人名の音写には揺れがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「緋色」。緋色に染めた繊維材料を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: 彼とともにいたのは
  rationale: 前節のベツァルエルと行動を共にするオホリアブを、ヘブライ語の無動詞文を補って自然な日本語で導入した。
- source_word: אָהֳלִיאָב
  choice: オホリアブ
  rationale: ヘブライ語の人名を、日本語の聖書で広く用いられる形に音写した。
- source_word: בֶּן אֲחִיסָמָךְ
  choice: アヒサマクの子
  rationale: 父子関係を示す連語を簡潔に保持した。
- source_word: לְמַטֵּה דָן
  choice: ダン部族に属する
  rationale: 所属を表す לְ の意味を自然で明確な日本語にした。
- source_word: חָרָשׁ
  choice: 工芸職人
  rationale: 語は熟練した職人を広く指し得るため、文脈上可能な「彫刻師」に限定せず、工芸に携わる職人として訳した。
- source_word: וְחֹשֵׁב
  choice: 意匠を考案する者
  rationale: 幕屋の工芸、とりわけ織物の模様や意匠を考案する働きを表しつつ、織り方そのものに意味を限定しなかった。
- source_word: וְרֹקֵם
  choice: 刺繍を施す者
  rationale: 色糸などを用いた刺繍の技能を明確で現代的な日本語で表した。
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן
  choice: 青、紫
  rationale: 幕屋の材料として繰り返される色彩語を簡潔に訳した。材料の厳密な形状は本文で不必要に限定しなかった。
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: 緋色の糸
  rationale: 緋色に染めた繊維材料を指す表現として、刺繍の文脈に即して「糸」を補った。
- source_word: וּבַשֵּׁשׁ
  choice: 上質の亜麻布
  rationale: 幕屋・祭司関連の文脈で שֵׁשׁ が指す良質な亜麻布を、一般読者に分かる語で表した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、職能の並列を保った。חָרָשׁ は意味を「彫刻師」に狭めず「工芸職人」とし、חֹשֵׁב と רֹקֵם の違いを「意匠を考案する者」と「刺繍を施す者」で示した。
