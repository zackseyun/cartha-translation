  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: ja
  text: 東側、すなわち日の昇る方は、五十キュビト。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: 東側…は
  rationale: פֵּאָהは境・端・側面を表す。幕屋の庭の寸法を列挙する文脈では「側」が自然であり、接続詞と前置詞は日本語の並列的な提示「…は」に含めた。
- source_word: קֵדְמָ/ה
  choice: 東側
  rationale: 「東」または「前方」を表し得るが、続くמִזְרָחָהが日の昇る方向を明示するため、ここでは方角として「東側」とした。
- source_word: מִזְרָחָ/ה
  choice: 日の昇る方
  rationale: מִזְרָחは日の昇る所、すなわち東を指す。先行する「東側」との重なりを消さず、ヘブライ語の対句的な方向表現を自然な日本語で保った。
- source_word: חֲמִשִּׁים
  choice: 五十
  rationale: 基数をそのまま訳した。
- source_word: אַמָּה
  choice: キュビト
  rationale: 古代の標準的な長さの単位であり、単位名を音写した。
