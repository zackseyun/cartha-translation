translation:
  language: ja
  text: 揺り動かして奉納された青銅[a]は、七十タラントと二千四百シェケルであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青銅」は「銅」とも訳せる。ヘブライ語は文脈により、銅または青銅を指す。
    reason: lexical_alternative
  - marker: b
    text: 「揺り動かして奉納された」は、主の前で揺り動かしてささげる祭儀的な奉納を表す。より一般的に「ささげられた奉納物」と訳すこともある。タラントとシェケルは重量の単位。
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の器具に用いる加工金属という文脈に合い、日本語聖書でも理解されやすい。語自体は銅または青銅を指し得るため、別訳を脚注に示した。
- source_word: הַתְּנוּפָה
  choice: 奉献物として揺り動かしてささげられた
  rationale: 定型的な直訳語だけに頼らず、主の前で揺り動かして差し出す儀礼的な奉献を自然な現代日本語で表した。
- source_word: שִׁבְעִים כִּכָּר
  choice: 七十タラント
  rationale: 古代の重量単位を換算せず保持し、原文の表現を透明に伝えた。
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: 二千四百シェケル
  rationale: 原文の重量単位シェケルを保持し、数量を明瞭な現代日本語で示した。
- source_word: וְ
  choice: （日本語では明示せず）
  rationale: 前節との連続は文脈から明らかであり、冒頭の接続詞を機械的に訳すより自然な日本語となる。
theological_decisions:
- issue: תְּנוּפָה の儀礼的意味
  choice: 揺り動かしてささげる行為を本文に明示する
  alternative: 単に「奉納物」「献納物」とする
  rationale: 一般的な献納へ意味を狭めず、原語が含む儀礼的動作を保持するため。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「揺り動かしてささげられた」により専門的な祭儀用語の内容を本文で分かるようにし、古代の重量単位は保持した。
