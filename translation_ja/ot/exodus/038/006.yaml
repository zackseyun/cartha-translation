  text: וַ/יַּ֥עַשׂ אֶת הַ/בַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וַ/יְצַ֥ף אֹתָ֖/ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/006.yaml
  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: ja
  text: 彼はアカシア材で担ぎ棒を作り、それらに青銅[a]をかぶせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「銅」。
    reason: נְחֹשֶׁתは「青銅」と「銅」のいずれをも指し得るため。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は…作り
  rationale: עשהのワイイクトール形。物語の連続を、日本語では連用形「作り」で自然に表した。
- source_word: הַבַּדִּים
  choice: 担ぎ棒
  rationale: 幕屋の用具を運ぶための棒を指すため、単なる「棒」より用途が明確な「担ぎ棒」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材で
  rationale: 樹種を示す連語を、現代日本語の建築・工芸表現として自然な「アカシア材」と訳した。
- source_word: וַיְצַף
  choice: かぶせた
  rationale: 工芸の文脈で、物体の表面を金属で覆うことを意味する。平明で自然な「かぶせた」とした。
- source_word: אֹתָם
  choice: それらに
  rationale: 複数の担ぎ棒を受ける目的語接尾辞。日本語では金属を表面に施す対象として「それらに」と表した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 銅または青銅を指し得る語。幕屋用具の伝統的かつ文脈上妥当な訳として「青銅」を本文に置き、「銅」の可能性を脚注に残した。
