base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: ja
  text: 庭の門の垂れ幕は、青、紫、緋色の撚り糸と、撚った上質の亜麻布を用いた、刺繍職人の仕事であった[a]。長さは二十キュビトで、庭の幕に合わせて、高さは五キュビトであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「刺繍職人の仕事」は、「色模様を織る職人の仕事」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「高さは、幅において五キュビト、庭の幕に対応していた」。このヘブライ語の寸法表現はやや不明確だが、門の垂れ幕が庭の幕の高さに合わせられていたことを示すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: 庭の門の垂れ幕
  rationale: מָסַךְは入口を覆う織物の仕切りを指す。「垂れ幕」は周囲の幕との区別を保ちつつ、門に設けられた布製の覆いであることを自然な現代日本語で示す。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 刺繍職人の仕事
  rationale: 職人による色模様のある織物・刺繍の技法を表す構文であり、職人を明示する原文の表現を保った。技法を狭く断定しすぎる可能性は脚注で示す。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の撚り糸
  rationale: 三つの色彩語が染色された繊維素材を指す文脈に合わせ、「撚り糸」を補って日本語として意味を明瞭にした。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚った上質の亜麻布
  rationale: שֵׁשׁは上質な亜麻素材、מָשְׁזָרは撚り合わせた加工を表す。幕の材料として自然に理解できるよう「亜麻布」とした。
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: 長さは二十キュビト
  rationale: 古代の尺度を換算せず保持し、寸法表現を自然な日本語にした。
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: 高さは五キュビトで、庭の幕と同じ高さであった
  rationale: 直訳しにくい「高さにおいて／幅において」の寸法構文を、門の幕が周囲の庭の幕と五キュビトの高さで対応するという文脈上もっとも自然な理解で訳した。ただし構文上の不透明さを脚注に残した。
theological_decisions: []
