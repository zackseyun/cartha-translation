  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: ja
  text: 幕屋と、その周囲の庭に用いる杭は、すべて青銅[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銅」とも訳せる。ヘブライ語 נְחֹשֶׁת は、文脈により銅または青銅を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַיְתֵדֹת
  choice: 杭は、すべて
  rationale: 複数形の杭を集合的に指す כָל の意味を、自然な現代日本語で表した。יָתֵד は幕屋や庭を固定する杭を指す。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋に用いる
  rationale: מִשְׁכָּן は出エジプト記で聖所としての幕屋を指す定着した用語であり、前置詞 ל は杭の用途を示す。
- source_word: וְלֶחָצֵר סָבִיב
  choice: その周囲の庭に用いる
  rationale: חָצֵר は幕屋を囲む庭、סָבִיב は周囲を表す。文脈上、幕屋の周囲にある庭であることを自然に示した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の材料を列挙する文脈で一般的な訳語を採用した。ただし、このヘブライ語は銅を指す可能性もあるため脚注で保持した。
