base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: ja
  text: 彼は焼き尽くすいけにえの祭壇をアカシア材で作った。長さ五キュビト、幅五キュビトの正方形で、高さは三キュビトであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は作った
  rationale: 物語を進めるワウ継続法を自然な現代日本語の過去形で表した。文脈上の主語を「彼」として明示した。
- source_word: מִזְבַּח הָעֹלָה
  choice: 焼き尽くすいけにえの祭壇
  rationale: עֹלָהは祭壇上で全体を焼くささげ物を指すため、その特徴を伝える定訳的で分かりやすい表現を用いた。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 樹種を現代日本語で明瞭に示し、建材の文脈に自然な「材」とした。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五キュビト
  rationale: 幕屋の寸法体系との一貫性と古代の尺度を保つため、現代単位に換算せず音訳した。
- source_word: אָרְכּוֹ / רָחְבּוֹ
  choice: 長さは／幅は
  rationale: 祭壇の寸法を示す所有接尾辞を、日本語では対象が明白なので簡潔な寸法表現で訳した。
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 長さと幅が等しいという直前の寸法記述に合い、形状を現代日本語で明確に表す。
- source_word: קֹמָתוֹ
  choice: 高さは
  rationale: 建造物の寸法を述べる文脈なので、自然で明確な「高さ」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の寸法順序を維持しつつ、日本語として読みやすい二文構成にした。英語相談層の脚注「Or 'four-square.'」は、ヘブライ語 רָבוּעַ の実質的な別訳ではあるが、日本語では「四角形」より「正方形」が文脈上正確であり、本文理解に必要な曖昧さを生まないため採用しなかった。
