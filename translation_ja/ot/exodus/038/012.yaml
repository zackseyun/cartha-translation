  text: וְ/לִ/פְאַת יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֥ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשׁוּקֵי/הֶ֖ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: ja
  text: 西側には、長さ五十キュビトの幕布があり、柱は十本、台座は十個であった。柱の鉤と帯金具[a]は銀製であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帯金具」は、「飾り帯」「棒状の部材」または「連結部材」とも訳せる。ヘブライ語は柱に付属する部材を指す専門語で、正確な形状や機能は明らかでない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: 西側には
  rationale: יָםは字義的には「海」だが、この幕屋建設の方角表現では西を指す。日本語では自然な方向表現として「西側」とした。
- source_word: קְלָעִים
  choice: 幕
  rationale: 幕屋の庭を囲む布製の垂れ幕を指す。簡潔で一般読者にも分かりやすい「幕」とした。
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: 長さ五十キュビト
  rationale: 原文は寸法を直接示す。日本語では何の寸法かを明確にするため「長さ」を補い、古代の単位 אַמָּה は「キュビト」とした。
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: 柱は十本
  rationale: 一覧的な原文の構造を保ちつつ、助数詞を用いた自然な日本語にした。
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: 台座は十個
  rationale: אֶדֶןは柱を受ける台座または受け口を表す。専門的すぎない「台座」を採用した。
- source_word: וָוֵי הָעַמֻּדִים
  choice: 柱の鉤
  rationale: וָוִיםは柱に取り付ける鉤状の金具を指すため、「鉤」と訳した。
- source_word: וַחֲשׁוּקֵיהֶם
  choice: 横桟
  rationale: 柱に付属する金具を表す専門語で、帯状の金具、棒、連結材など解釈に幅がある。本文では構造物として理解しやすい「横桟」を用い、不確かさは脚注に示した。
- source_word: כָּסֶף
  choice: 銀製であった
  rationale: 文末の名詞が鉤と横桟の材質を述べているため、自然な日本語の述語にした。
theological_decisions: []
