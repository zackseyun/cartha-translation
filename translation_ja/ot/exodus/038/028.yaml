  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: ja
  text: 千七百七十五シェケルの銀を用いて、柱の鉤を作り、柱の上端を覆い、柱に帯金を取り付けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「柱を帯金でつないだ」とも訳せる。ここのヘブライ語は、柱に帯状の金具を施すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: 残りの千七百七十五シェケルの銀で
  rationale: 前節から続く銀の重量収支であり、数値の単位と材料は文脈から補う。「残りの」は百キカルを除いた端数であることを明確にし、「で」はこの銀が材料として用いられたことを自然な日本語で示す。
- source_word: עָשָׂה
  choice: 作り
  rationale: 製作記事に適した、明快で一般的な表現。後続する動作と連ねた。
- source_word: וָוִים
  choice: 鉤
  rationale: 幕屋の柱に付ける金属製のフックを指す。建築・器具の文脈に合う簡潔な語を選んだ。
- source_word: לָעַמּוּדִים
  choice: 柱のための
  rationale: 前置詞 ל の用途・帰属を自然に表し、鉤が柱に用いられることを示す。
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: 柱の上端を覆い
  rationale: רָאשֵׁיהֶם は直訳すれば「それらの頭」だが、柱については「上端」が明瞭。צפה は金属をかぶせる意味だが、材料は直前の文脈で銀と分かるため、本文では簡潔に「覆う」とした。
- source_word: וְחִשַּׁק אֹתָם
  choice: 柱に帯輪を取り付けた
  rationale: חִשַּׁק はこの建築文脈で、柱に帯状の金具を施すことを表すと考えられる。「帯輪」は部材の形状と機能を比較的簡潔に伝えるが、語義には不確かさがあるため脚注を付した。
