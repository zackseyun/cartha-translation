  text: וְ/עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֥ם אַרְבָּעָ֖ה נְחֹ֑שֶׁת וָוֵי/הֶ֣ם כֶּ֔סֶף וְ/צִפּ֧וּי רָאשֵׁי/הֶ֛ם וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: ja
  text: 柱は四本、その青銅の台座[a]も四個であった。柱の鉤は銀、その上端の覆い[b]と帯[c]も銀であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け」とも訳せる。柱の足元を支える金属部品。
    reason: lexical_alternative
  - marker: b
    text: 「上端のめっき」とも訳せる。ヘブライ語では直訳すると「その頭の覆い」。
    reason: lexical_alternative
  - marker: c
    text: この銀製部材の正確な形状は不明。「帯」は形状を限定しすぎない訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: 柱
  rationale: 幕屋の庭の構造を支える部材を指すため、現代日本語で自然な建築用語「柱」とした。
- source_word: אַדְנֵיהֶם
  choice: 台座
  rationale: 柱の足元を支える金属部品を指す。「受け」も可能だが、形状を過度に限定せず機能を明確に示す「台座」を採用した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 語は銅または銅合金を広く指し得るが、幕屋の材料としての慣用と文脈に従い「青銅」とした。
- source_word: וָוֵיהֶם
  choice: 鉤
  rationale: 幕や部材を掛ける金具を表す語として、文脈に合い簡潔な「鉤」を用いた。
- source_word: כֶּסֶף
  choice: 銀
  rationale: この箇所では材質としての銀を明確に指す。
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: その上端の覆い
  rationale: 「彼らの頭の覆い」という名詞句を、柱を受ける自然な日本語にして「上端の覆い」とした。「めっき」と断定せず、צִפּוּי の被覆という意味を保った。
- source_word: חֲשֻׁקֵיהֶם
  choice: 帯
  rationale: 柱に付随する銀製部材だが正確な形状は不確かであるため、伝統的な理解を保ちつつ過度に具体化しない「帯」とした。
