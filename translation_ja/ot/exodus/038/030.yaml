  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: ja
  text: 彼はそれで、会見の天幕の入り口の台座[a]、青銅の祭壇、それに付属する青銅の格子[b]、および祭壇のすべての用具を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「受け台」。柱などを差し込み、支える部分。
    reason: lexical_alternative
  - marker: b
    text: または「網」。祭壇に付属する網状の器具。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: 物品製作を述べる物語文脈で、一般的な動詞 עשה を自然で明快な現代日本語にした。
- source_word: בָּהּ
  choice: それで
  rationale: 前節で数えられた青銅を受ける女性単数代名詞で、ここでは材料・手段を表す。「それを用いて」という意味を簡潔に示す。
- source_word: אַדְנֵי
  choice: 台座
  rationale: 幕屋の柱などを支える金属製の受け部を指す。本文では分かりやすい「台座」を採り、技術的な別訳を脚注に示した。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口
  rationale: 構文上の連結関係を保ちつつ、פתח を自然な「入り口」とした。אהל מועד は本書の祭儀的用語として「会見の天幕」とした。
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 青銅の祭壇
  rationale: נְחֹשֶׁת は当該時代の器具材料として通常「青銅」と訳されるが、金属組成には幅がありうる。日本語聖書として明瞭で慣用的な表現を採用した。
- source_word: מִכְבַּר הַנְּחֹשֶׁת אֲשֶׁר לוֹ
  choice: それに付属する青銅の格子
  rationale: מכבר は祭壇に伴う網状・格子状の器具。אשר לו は祭壇との所属・関連を示すため、位置を断定せず「付属する」とした。
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: 祭壇のすべての用具
  rationale: כלים は器、道具、備品を広く表す。「用具」は祭壇に用いる一式を自然に包括する。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀用具については厳粛さを保ちながら過度に古風・専門的にならない語を選んだ。ヘブライ語の列挙構造を維持しつつ、「それに付属する」によって修飾先が祭壇であることを自然に示した。
