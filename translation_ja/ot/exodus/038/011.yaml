base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: ja
  text: 北側は長さ百キュビトで、その柱は二十本、その台座は二十個で青銅製、柱の鉤と帯金具[a]は銀製であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帯」または「連結棒」とも訳せる。ヘブライ語は柱に付属する銀製の建築金具を指すが、その正確な形状は不明である。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: 北側は
  rationale: פאהは「側、縁」を意味し、צפוןとともに庭の北側を指す。周辺の寸法記述に合う簡潔な表現とした。
- source_word: מֵאָה בָאַמָּה
  choice: 長さ百キュビト
  rationale: 測定された辺の長さであることを日本語で明確にした。אַמָּהは古代の長さの単位なので、換算値を本文に持ち込まず「キュビト」とした。
- source_word: עַמּוּדֵיהֶם
  choice: その柱は二十本
  rationale: עַמּוּדִיםは幕屋の庭を構成する柱を指す。日本語では柱を数える自然な助数詞「本」を用いた。
- source_word: אַדְנֵיהֶם
  choice: その台座は二十個
  rationale: אדןは柱を支える受け台・台座を指す。「台座」は「受け口」より一般読者に構造が伝わりやすい。
- source_word: נְחֹשֶׁת
  choice: 青銅製
  rationale: 幕屋の材料を表すנחשתの慣用的な訳。古代には銅との材質上の境界が必ずしも明確でないが、文脈に定着した「青銅」を採用した。
- source_word: וָוֵי הָעַמּוּדִים
  choice: 柱の鉤
  rationale: וויםはこの文脈では柱に取り付けられたフック状の部品を指す。「杭」とせず、部材として自然な「鉤」とした。
- source_word: חֲשֻׁקֵיהֶם
  choice: 帯金具
  rationale: 柱に付属する銀製の建築金具だが、具体的な形状は確定しにくい。חׁשקの締める・巻くという語感を保ちつつ、現代日本語で理解しやすい「帯金具」とした。
- source_word: כָּסֶף
  choice: 銀製
  rationale: 材質を表す標準的な語であり、鉤と帯金具の双方にかかるよう訳した。
