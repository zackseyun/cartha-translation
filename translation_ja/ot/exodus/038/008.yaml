language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: ja
  text: 彼は青銅の洗盤とその台を、会見の天幕の入り口で仕えていた女たちの鏡で作った[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「会見の天幕の入り口に集まっていた女たち」。ヘブライ語は、組織的に集まることと奉仕することの両方を含意し得る。
    reason: alternative_reading
  - marker: b
    text: 古代の鏡は通常、ガラスではなく、磨いた青銅などの金属で作られていた。
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: 洗盤
  rationale: 幕屋で洗浄に用いる大きな器を指す。「洗盤」は用途を明確にしつつ、祭具としての品位も保つ。
- source_word: כַּן
  choice: 台
  rationale: 洗盤を支える台座を指す。簡潔で自然な現代日本語。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 銅または青銅を広く指し得るが、幕屋の祭具という文脈と慣用に従い「青銅」とした。
- source_word: בְּמַרְאֹת
  choice: 鏡で
  rationale: 前置詞はここでは材料・由来を示すと理解し、鏡を材料として作ったことを自然に表した。
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: 仕えていた女たち
  rationale: צבא の反復には、組織的に集まることと務めに携わることの双方が含まれ得る。本文では目的ある奉仕を示しつつ、祭司的職務まで意味すると断定しない表現を選んだ。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会見の天幕の入り口で
  rationale: 幕屋に関する定型句を、明瞭で自然な現代日本語にした。
- source_word: וַיַּעַשׂ
  choice: 彼は…作った
  rationale: ヘブライ語物語の連続形を、日本語の自然な叙述として表現した。文脈上の単数主語は明示するが、固有名は補わない。
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ が示す女性たちの役割
  choice: 会見の天幕の入り口で仕えていた女たち
  alternative: 会見の天幕の入り口に集まっていた女たち
  rationale: 語根 צבא は、務めのために集まることや組織的に奉仕することを表し得る。本文は具体的な祭儀上の職位を説明していないため、「仕えていた」と訳して目的ある活動を示しつつ、祭司職などを読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔でありながら聖書本文としての品位を保った。「洗盤」は一般語の「鉢」より祭具の用途を示しやすく、「洗盤とその台」によって原文の二つの物体を明確に区別した。
