  text: שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑/הוּ וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: ja
  text: 六日間、あなたがたはそれを集めなさい。しかし、七日目は安息日であり、その日にはそれはない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、その日にはマナがない。直訳すると、「それはその日にない」。
    reason: implicit_referent
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日の間
  rationale: 期間を表すヘブライ語の句を、指示の継続期間が明確になる自然な日本語で表した。
- source_word: תִּלְקְטֻהוּ
  choice: あなたがたはそれを集めなさい
  rationale: לקט はここではマナを拾い集めることを指す。二人称男性複数と三人称男性単数の目的語接尾辞を明示し、文脈上の命令的な力を保った。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: しかし七日目は
  rationale: 接続詞 waw は「そして」とも訳せるが、六日間との対比が文脈上明らかなため「しかし」とした。日本語では主題提示の「は」で自然に対比を示した。
- source_word: שַׁבָּת
  choice: 安息日であり
  rationale: 無冠詞の名詞が「七日目」に同格的に続く構造を、過度に説明せず自然な日本語で示した。定着した聖書語「安息日」を用いた。
- source_word: לֹא יִהְיֶה בּוֹ
  choice: そこには何もない
  rationale: 字義的には「その中に／その日に、それはない」。בּוֹ が七日目を受けることを「そこには」で保ち、文脈上省略されているマナを本文で明示せず、存在しないことを自然に表した。
theological_decisions:
- issue: シナイ契約以前の文脈における שַׁבָּת の表現
  choice: 安息日
  alternative: 休みの日／その安息日
  rationale: 原語は無冠詞だが、日本語の「安息日」は冠詞性を必ずしも含意しないため、制度の発展段階を余分に規定せず語彙上の意味を保てる。「休みの日」は説明的すぎ、「その安息日」は原語にない限定を加えうる。
- issue: לֹא יִהְיֶה בּוֹ の省略された主語
  choice: 本文では「何もない」とし、注でマナを指すことを示す
  alternative: マナはない
  rationale: 文脈上の指示対象はマナだが、ヘブライ語本文は名詞を明示していない。省略を保ちながら、日本語として理解可能な形にした。
translation_notes:
  register: 現代の一般読者に明快でありながら、命令の重みと聖書本文としての品位を保つ文体。「あなたがた」で複数形を示し、原文の省略と対比を可能な限り保持した。
