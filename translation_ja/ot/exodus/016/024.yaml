  text: וַ/יַּנִּ֤יחוּ אֹת/וֹ֙ עַד הַ/בֹּ֔קֶר כַּ/אֲשֶׁ֖ר צִוָּ֣ה מֹשֶׁ֑ה וְ/לֹ֣א הִבְאִ֔ישׁ וְ/רִמָּ֖ה לֹא הָ֥יְתָה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: ja
  text: 彼らは、モーセが命じたとおり、それを朝まで取っておいた。それは臭くならず、中に虫[a]もいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「うじ」。ヘブライ語は、腐敗物に生じる虫状の生き物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ עַד הַבֹּקֶר
  choice: それを朝まで取っておいた
  rationale: 翌朝まで保存しておくという文脈を、自然な現代日本語で表した。「それ」は単数形の目的語を保ち、マナの取り分を指す。
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: モーセが命じたとおり
  rationale: 比較を示す כַּאֲשֶׁר と、先に与えられた命令との関係を簡潔に保った。
- source_word: וְלֹא הִבְאִישׁ
  choice: それは臭くならず
  rationale: 腐敗して悪臭を発する意味を、前節との対照が伝わる平明で直接的な表現にした。
- source_word: וְרִמָּה לֹא הָיְתָה בּוֹ
  choice: 中に虫[a]もいなかった
  rationale: ヘブライ語の存在表現を保ちつつ、日本語として自然にした。רִמָּה は腐敗物に生じるうじを指し得るが、より広い「虫」を本文に置き、具体的な訳語を脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語とし、叙事文にふさわしい簡潔で落ち着いた調子を保った。英語資料では脚注記号が「朝」に付いているが、脚注内容は רִמָּה（虫／うじ）に関するため、日本語本文では「虫」に付した。
