  source_fidelity: 原文は、モーセがアロンに一つの器を取り、その中に一オメルの満量のマナを入れ、その器をヤハウェの前に置いて、後代にわたる保存のためとするよう命じる。訳文は器・マナ・満量としての一オメル・ヤハウェの前・継続的保存という主要要素を保っている。「その中に」は文脈上の指示対象を自然に明確化しており、「それ」は器を指すものとして適切である。
  naturalness: 明瞭な現代標準日本語であり、命令の連続も自然である。「一オメルいっぱい」は計量単位と満量の意味を簡潔に伝える。「代々にわたって」は原文の『あなたがたの世代のために』を日本語として自然に表しており、文脈上その対象がイスラエルの後代であることも明らかである。
  terminology: 「モーセ」「アロン」「マナ」「オメル」「ヤハウェ」は一貫して適切である。神名を「ヤハウェ」とする選択は原文のテトラグラマトンを反映する。「壺」は自然な本文表現であり、器の形状・材質を確定できない点を脚注が適切に補っている。
