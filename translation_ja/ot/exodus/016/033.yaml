  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: ja
  text: モーセはアロンに言った。「壺[a]を一つ取り、その中に一オメルいっぱいのマナを入れなさい。そして、それをヤハウェの前に置き、代々にわたって保存しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「容器」。この語が指す器の正確な形状や材質は分からない。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: 壺
  rationale: 中にマナを収めて保存する器を指す。「壺」は自然で簡潔だが、器の材質や形状は本文から確定できないため脚注で幅を示した。
- source_word: מְלֹא הָעֹמֶר
  choice: 一オメルいっぱい
  rationale: מְלֹא の「満量」と、乾量単位 עֹמֶר の双方を明示する表現。
- source_word: מָן
  choice: マナ
  rationale: 文脈中の食物の名称として、日本語で定着した音写を用いた。
- source_word: וְתֶן שָׁמָּה
  choice: その中に…入れなさい
  rationale: 字義的には「そこに置け」だが、直前の器を指すことが文脈上明白なので、現代日本語として自然な形で明示した。
- source_word: וְהַנַּח אֹתוֹ
  choice: それを…置き
  rationale: 器とその中身をヤハウェの前に据える動作を、簡潔で自然に表した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵי の空間的・礼拝的な含みを保ち、「前に」と訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を日本語で一般的な形に音写した。
- source_word: לְמִשְׁמֶרֶת
  choice: 保存しなさい
  rationale: 保管・保存を目的とする表現を、命令の流れに沿う自然な日本語にした。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたって
  rationale: イスラエルの後続する諸世代にわたる継続性を明確に表した。
- source_word: קַח ... אַחַת
  choice: 壺を一つ取り
  rationale: 数詞による単一の器という指定を保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、それを称号で代替せず音写した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令文としての厳粛さを保った。「一オメルいっぱい」は古代の計量単位を保存しつつ、満量であることも伝える。
