language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: ja
  text: 主はモーセに言われた。「見よ、わたしはあなたがたのために、天からパンを降らせる[a]。民は出て行き、その日に必要な分を日ごとに集める[b]。これは、彼らがわたしの教え[c]に従って歩むかどうかを、わたしが試すためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天からパンを降らせよう」とも訳せる。ヘブライ語の分詞は、間近に起こる未来を表し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「一日の事をその日に」。各日に必要な分を、その日に集めるという意味。
    reason: lexical_alternative
  - marker: c
    text: 「わたしの律法」とも訳せる。ここでの「教え」は、神から与えられる指示を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す日本語聖書の定着した表記を用い、本文の格調と可読性を保つ。
- source_word: הִנְנִי
  choice: 見よ
  rationale: 神の宣言に注意を促す語の力を、簡潔で格調ある現代日本語で示す。
- source_word: מַמְטִיר
  choice: 降らせる
  rationale: 使役形分詞の生き生きとした切迫感を保つ。文脈上は間近な未来とも理解できるため、脚注で示す。
- source_word: לֶחֶם מִן הַשָּׁמָיִם
  choice: 天からパン
  rationale: לֶחֶם を一般的な「食べ物」に広げず、具体的な「パン」として訳す。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: その日に必要な分を日ごとに
  rationale: 直訳的な「一日の事をその日に」が表す、一日分をその日に集めるという慣用的意味を自然に伝える。
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: わたしが試すため
  rationale: 単数接尾辞の指示対象は集合名詞「民」であり、日本語では文脈に即して「彼ら」と受ける。試みの目的を明確にする。
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: わたしの教えに従って歩むかどうか
  rationale: 「歩む」という行動の比喩を残しつつ、תּוֹרָה の基本義である神の指示・教えを、シナイ契約以前の文脈に自然に表す。
theological_decisions:
- issue: シナイ契約以前の תּוֹרָה の訳語
  choice: わたしの教え
  alternative: わたしの律法
  rationale: ここでは、日々の糧を集めることについて今まさに与えられる神の指示が焦点であるため、「教え」が語義と文脈に適する。ただし「律法」も契約的な重みを示す正当な訳であり、脚注に残す。
- issue: 神が民を試す目的
  choice: 従って歩むかどうかを試す
  alternative: 従うかどうかを明らかにする
  rationale: 神の知識に関する含意を訳文で付加せず、原文の「試す」と「歩む」の緊張をそのまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の宣言には「見よ」を用いて聖書本文としての格調を保った。「パン」「試す」「歩む」という原文の具体語と比喩は保持し、不必要な神学的解釈を本文に加えていない。
