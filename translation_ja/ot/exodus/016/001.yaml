  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: ja
  text: 彼らはエリムを出発し、イスラエルの民の全会衆は、エリムとシナイの間にあるシンの荒野[a]に着いた。それは、彼らがエジプトの地を出てから第二の月の十五日のことであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シン」は地名であり、「シナイ」とは別の名称である。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵילִם
  choice: エリムを出発し
  rationale: נסעは荒野の旅の文脈で、宿営を解いて次の場所へ向かうことを表す。「出発する」はその移動の含みを自然な現代日本語で伝える。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民の全会衆
  rationale: בני ישראלは直訳すれば「イスラエルの子ら」だが、ここでは男性だけでなくイスラエル民族全体を指す標準的名称であるため「イスラエルの民」とした。עדהの共同体としてのまとまりは「会衆」で保持した。
- source_word: וַיָּבֹאוּ
  choice: 着いた
  rationale: בואは一般的な移動動詞だが、出発に続いて目的地へ至る文脈では「着いた」が自然で、到着という物語上の推移を明確にする。
- source_word: אֶל מִדְבַּר סִין
  choice: シンの荒野に
  rationale: מדברは人の定住地から離れた荒涼地を指し、聖書地理の表現として「荒野」が適切である。סיןは地名なので「シン」と音写した。
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: エリムとシナイの間にある
  rationale: 荒野の位置を示す関係節を、意味を加えず自然な日本語で表した。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: 第二の月の十五日
  rationale: ヘブライ語の暦日表現を簡潔で格調ある日本語の日付表現にした。月名は本文にないため補わない。
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: 彼らがエジプトの地を出てから
  rationale: 不定詞構文が日付の基準点として出エジプトを示すため、「出てから」として時間関係を明確にした。「エジプトの地」は原文のארץを保持する。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書叙述にふさわしい品位を保った。「全会衆」によって原文の共同体的表現を残し、「イスラエルの民」によって民族全体を指す意味を自然に示した。地名「シン」には誤解を避けるため脚注を付した。
