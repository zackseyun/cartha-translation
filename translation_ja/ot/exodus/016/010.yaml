source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: ja
  text: アロンがイスラエルの子らの全会衆[a]に語っていると、彼らは荒野の方を向いた。見ると、ヤハウェの栄光が雲の中に現れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人の全会衆」。直訳は「イスラエルの子らの全会衆」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: 語っていると
  rationale: וַיְהִי は物語の進行を示し、כ＋不定詞連語は同時性を表す。日本語では「語っていると」とすることで、出来事の展開と、アロンが語っている最中であったことを自然に示せる。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの全会衆
  rationale: עֵדָה の共同体的な意味を「会衆」で表し、בְּנֵי יִשְׂרָאֵל の親族表現を「イスラエルの子ら」として保持した。自然な別訳は脚注に示した。
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: 彼らは荒野の方を向いた
  rationale: פנה と אֶל の組み合わせが表す方向転換を、「荒野の方を向いた」と明確かつ自然に訳した。
- source_word: וְהִנֵּה
  choice: すると、見よ
  rationale: הִנֵּה は読者の注意を突然の光景へ向ける提示辞。「すると」で物語の推移を示しつつ、「見よ」によって原文の強い注意喚起と荘重さを残した。
- source_word: כְּבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: כָּבוֹד はここでは目に見える神の威光・臨在を指すため「栄光」とし、神名 יְהוָה は称号に置き換えず「ヤハウェ」と音写した。
- source_word: נִרְאָה בֶּעָנָן
  choice: 雲の中に現れた
  rationale: ראה のニファル形を文脈に即して自動詞的な「現れた」と訳した。定冠詞のある עָנָן は既知の特定の雲を示すため「雲」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、人格的な固有名として「ヤハウェ」と音写した。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の親族的・系譜的な表現を本文に残した。ただし、この句が共同体としてのイスラエル人全体を指すことは脚注で明らかにした。
- issue: כְּבוֹד の現れの表現
  choice: ヤハウェの栄光が雲の中に現れた
  alternative: ヤハウェの栄光が雲の中に見えた
  rationale: נִרְאָה は「見られた」とも取り得るが、ここでは神の栄光の顕現を述べる自動詞的な「現れた」が自然である。何がどのような形で見えたかは本文以上に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の顕現場面の荘重さを保つため「見よ」を用いた。「イスラエルの子ら」はやや原文透過的な表現なので、自然な日本語の別訳を脚注に示した。
