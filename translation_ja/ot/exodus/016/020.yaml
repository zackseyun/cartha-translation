  to: しかし、彼らはモーセの言うことを聞かず[a]、ある男たちはその一部を朝まで残しておいた。すると、そこに虫がわき、悪臭を放った[b]。モーセは彼らに腹を立てた。
  rationale: 原語の語義幅を保つため「うじ」を「虫」に改め、男性複数の אֲנָשִׁים を「ある男たち」とした。注bは、臭くなったのが虫ではなく残しておかれたもの（マナ）であることが分かる直訳へ修正した。その他の表現と句読点は、原文の意味と自然な現代日本語をよく保っている。
