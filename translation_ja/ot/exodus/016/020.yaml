base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: ja
  text: しかし、彼らはモーセの言うことを聞かず[a]、ある男たちはその一部を朝まで残しておいた。すると、そこに虫がわき、悪臭を放った[b]。モーセは彼らに腹を立てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセに聞き従わず」。ヘブライ語には、聞き入れず従わないという含みがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「虫が生じ、それは臭くなった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: モーセの言うことを聞かず
  rationale: שׁמע אל は、人の言葉を聞き入れる、従う含みを持つ。「言うことを聞く」は日本語でその両面を自然に表し、本文で「従わなかった」と解釈を強めすぎない。
- source_word: וַיּוֹתִרוּ אֲנָשִׁים מִמֶּנּוּ עַד בֹּקֶר
  choice: ある者たちはその一部を朝まで残しておいた
  rationale: יתר のヒフィルは「残しておく」。אֲנָשִׁים は文脈上、不特定の一部の者を指すため、現代日本語では性を不必要に際立たせない「ある者たち」とした。מִמֶּנּוּ はマナを受ける「その一部」と明示した。
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: それにうじがわき
  rationale: 字義的には「虫がその中に生じた」。腐敗した食物の文脈に即して תּוֹלָעִים を「うじ」、動作を自然な日本語の「わく」で表した。
- source_word: וַיִּבְאַשׁ
  choice: 悪臭を放った
  rationale: באש は「臭くなる、悪臭を放つ」。物語の明瞭さと品位を保ちながら、腐敗の強い臭いを直接表す。
- source_word: וַיִּקְצֹף עֲלֵהֶם מֹשֶׁה
  choice: モーセは彼らに腹を立てた
  rationale: קצף は怒ることを表す。「腹を立てた」は自然な現代日本語であり、「激怒した」ほど強度を限定しない。
theological_decisions: []
