id: EXO.16.28
reference: Exodus 16:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: ja
  text: すると、ヤハウェはモーセに言われた。「あなたがたは、いつまでわたしの命令と律法[a]を守ることを拒むのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「教え」。ヘブライ語「トーロート」（「トーラー」の複数形）は、律法だけでなく、権威ある教えや指示を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、……言われた
  rationale: ワウ継続法による物語の進行を、現代日本語で自然な順接として表した。神の発言には文脈にふさわしい敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: עַד אָנָה
  choice: いつまで
  rationale: 継続する不従順を責める修辞疑問として自然であり、原文の期間を問う表現を保つ。
- source_word: מֵאַנְתֶּם
  choice: 拒むのか
  rationale: 単なる不履行ではなく、意志的に拒絶するという動詞の意味を保持した。継続性は「いつまで」によって示される。
- source_word: לִשְׁמֹר
  choice: 守ること
  rationale: 命令や律法を遵守するという שׁמר の通常の用法を、明快な日本語で表した。
- source_word: מִצְוֺתַי
  choice: わたしの命令
  rationale: 神が命じた事柄という直接的意味と規範的な語調を保つ。
- source_word: וְתוֹרֹתָי
  choice: 律法
  rationale: 命令と並ぶ規範的・法的な力を本文で示した。語の持つ「教え、指示」という幅は脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が神の固有名を明記しているため、称号へ置換せず音写した。
- issue: 複数形 תוֹרֹתָי の意味範囲
  choice: わたしの律法
  alternative: わたしの教え／指示
  rationale: この叱責の文脈と「命令」との並行関係から、本文では規範的な力を示す「律法」とした。一方、トーラーには権威ある教えや指示という意味もあるため、その曖昧さを脚注で明示した。
translation_notes:
  register: 明快で現代的な標準語を用いつつ、神の叱責にふさわしい厳粛さを保った。「あなたがた」で複数形を明示し、修辞疑問の鋭さを自然な日本語の語順で表した。脚注記号は該当語「律法」の直後に置いた。
