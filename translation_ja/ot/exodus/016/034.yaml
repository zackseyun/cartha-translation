base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: ja
  text: ヤハウェがモーセに命じたとおり、アロンはそれを保管するために、証し[a]の前に置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証し」は幕屋に関する専門用語で、より具体的には契約の石板、またはそれに結びつくものを指すことがある。そのため、「契約の証しの前に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 〜したとおり
  rationale: 先の命令への厳密な従順・一致を示す比較表現を、自然な現代日本語で表した。
- source_word: צִוָּה
  choice: 命じられた
  rationale: 神の命令が持つ権威を保ちつつ、日本語では主語への敬意を示す自然な形とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に明記された神の固有名を音写し、一般名詞の「主」に置き換えなかった。
- source_word: וַיַּנִּיחֵהוּ
  choice: アロンはそれを……置いた
  rationale: アロンが指定された場所にそれを置く動作を、明瞭で自然な日本語にした。接尾代名詞は文脈上のマナを入れた容器を指すが、原文どおり「それ」としている。
- source_word: לִפְנֵי
  choice: 〜の前に
  rationale: 空間的・祭儀的な位置関係を過度に解釈せずに保持した。
- source_word: הָעֵדֻת
  choice: 証し
  rationale: 幕屋に関する専門語としての含みを残し、契約の石板だけに意味を限定しなかった。訳語だけでは指示対象が分かりにくいため注を付した。
- source_word: לְמִשְׁמָרֶת
  choice: 保存するため
  rationale: 保管・保持という目的を平明に表し、本文に明示されない「記念」の概念は加えなかった。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: ヘブライ語本文に固有名が記されているため、その契約的な固有名としての性格を保持した。
- issue: הָעֵדֻת の指示対象
  choice: 証し
  alternative: 契約の証し、契約の石板
  rationale: この語は幕屋の文脈で契約の石板、またはそれに関連するものを指し得るが、本節だけで指示対象を一つに限定せず、原文の簡潔さと含みを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の命令への服従を示す簡潔で荘重な文調を保った。「証し」は説明的に言い換えず、専門語として注で補った。
