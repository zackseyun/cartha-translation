  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: ja
  text: モーセは言った。「今日はそれを食べなさい。今日は主にささげられた安息日だからだ。今日は野でそれを見つけることはない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבָּת
  choice: 安息日
  rationale: イスラエルの定められた休息の日を指す語として、日本語聖書で定着し、文脈にも明確な訳語。
- source_word: לַיהוָה
  choice: 主のための
  rationale: 前置詞 לְ の献身・帰属の含みを保ちつつ、神名 יהוה は日本語の一般的な聖書表記「主」で示した。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 原文で三度反復される時間表現をすべて訳出し、当日の安息とマナを見つけられないことの結びつきを保持した。
- source_word: בַּשָּׂדֶה
  choice: 野で
  rationale: マナを探しに出る開けた場所を自然かつ簡潔に表す。
theological_decisions:
- issue: יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 神名そのものを一般的な日本語聖書の慣例に従って「主」と表記し、特定の発音再建に依存しない。
- issue: לַיהוָה の関係
  choice: 主のための安息日
  alternative: 主に対する安息日／主の安息日
  rationale: 原文の לְ が示す方向・献身の関係を保ち、「主の安息日」として所有関係だけに狭めない。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。原文で反復される「今日」を省かず、命令、理由、結果の三部構成を明瞭にした。
