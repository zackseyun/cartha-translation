    issue: 「オメル升」
    rationale: עֹמֶר は古代イスラエルの乾量単位であり、「升」を添えると日本の伝統的な升・升目を指すかのような不正確な含みを加える。単に「オメル」とするのが原文の具体的単位を保つ。
  - severity: low
    issue: 末尾の「集めていた」
    rationale: לָקָטוּ はこの叙述では完了した採集を述べる形であり、継続相を示す「～ていた」を補う必要はない。「集めた」が原文の叙述としてより直接的である。
