  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: ja
  text: 彼らがオメルで量ると、多く集めた者にも余りはなく、少なく集めた者にも不足はなかった。[a] 一人一人が、自分の食べる分に応じて集めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多く持つ者にも余分はなく、少なく持つ者にも欠けるものはなかった。」
    reason: ヘブライ語の分詞は文脈上「多く／少なく集めた者」を指すが、採集行為を明示せず、より形式的に訳すこともできるため。
lexical_decisions:
- source_word: וַיָּמֹדּוּ בָעֹמֶר
  choice: 彼らがオメル升で量ると
  rationale: 物語を進める接続形を、続く結果への時間的導入として自然な日本語の「～すると」で表した。בָעֹמֶר はオメルという乾量単位を用いて量ったことを示すため、単位名を保持しつつ「升」を添えた。
- source_word: הַמַּרְבֶּה לֹא הֶעְדִּיף
  choice: 多く集めた者にも余りはなく
  rationale: 分詞 הַמַּרְבֶּה の省略された動作を、マナを集める文脈から「集めた」と明示した。הֶעְדִּיף は量った後に余剰が生じなかったことを「余りはなく」と簡潔に表した。
- source_word: הַמַּמְעִיט לֹא הֶחְסִיר
  choice: 少なく集めた者にも不足はなかった
  rationale: 前半との対句を保ち、הֶחְסִיר の欠乏・不足の意味を自然な現代日本語で表した。
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: 一人一人が、自分の食べる分に応じて
  rationale: אִישׁ の配分的な用法を、男性だけに限定しない「一人一人」で表した。「その食べることの口に従って」という直訳的表現は避け、必要な食事量に応じるという慣用的意味を保持した。
- source_word: לָקָטוּ
  choice: 集めていた
  rationale: マナの記事で反復される採集行為を「集める」で訳した。文脈上の継続的・配分的な行為として自然になるよう「集めていた」とした。
theological_decisions:
- issue: אִישׁ ... אָכְלוֹ の男性単数による配分表現
  choice: 「一人一人が、自分の食べる分」と訳す
  alternative: 「各人が、その人の食べる分」または男性形を表面上保つ「男はそれぞれ、自分の食べる分」
  rationale: この箇所の男性単数形は集団内の各人を配分的に指し、成人男性だけに限定する趣旨ではない。日本語では性別を不必要に補わず、単数配分の意味を明確にした。
- issue: 多く集めた者と少なく集めた者についての表現の範囲
  choice: 採集量を指す「多く集めた者」「少なく集めた者」とする
  alternative: より形式的な「多く持つ者」「少なく持つ者」
  rationale: ヘブライ語の分詞自体は「多くする者／少なくする者」とも取れるが、直前から続くマナ採集の文脈により、採集量を指す読みが最も自然である。ただし形式的な別訳を脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「オメル」は古代の乾量単位として音写を保ち、「升」を添えて量器・単位であることを文中から理解できるようにした。対句の均衡を保ちながら、逐語的すぎる不自然な表現は避けた。
