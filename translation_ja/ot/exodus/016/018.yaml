revisions:
- from: 彼らがオメル升で量ると、多く集めた者にも余りはなく、少なく集めた者にも不足はなかった。[a] 一人一人が、自分の食べる分に応じて集めていた。
  to: 彼らがオメルで量ると、多く集めた者にも余りはなく、少なく集めた者にも不足はなかった。[a] 一人一人が、自分の食べる分に応じて集めた。
  rationale: 「オメル升」を「オメル」に改め、日本の単位を重ねることなく原文の古代乾量単位を保持した。最後の動詞を「集めた」として、物語叙述の完了した行為を自然に表した。それ以外は、採集量に関する対句と、各人の必要に応じた採集という意味を正確かつ明瞭に伝えているため維持した。
