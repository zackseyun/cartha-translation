  text: וַ/יִּשְׁבְּת֥וּ הָ/עָ֖ם בַּ/יּ֥וֹם הַ/שְּׁבִעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/030.yaml
  text: So the people rested on the seventh day[a].
translation:
  language: ja
  text: こうして民は七日目に休んだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「やめた」。この動詞は「安息」と関係する語であるが、「安息日を守った」は解釈を加えた訳となる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: 休んだ
  rationale: שׁבת のカル形で、基本義は「やめる、休む」。安息日の文脈を自然に伝えつつ、「安息日を守った」という解釈的な明示は避けた。
- source_word: הָעָם
  choice: 民
  rationale: 荒野物語におけるイスラエルの共同体を指す集合名詞として、簡潔で聖書本文にふさわしい現代日本語。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目に
  rationale: 特定の日を表す前置詞句を、日本語で自然かつ正確に表現した。
- source_word: וַ
  choice: こうして
  rationale: 物語を進める接続であると同時に、直前の命令を受けた結果の流れを自然に示す。単純な「そして」も可能だが、ここでは文脈上の帰結が伝わりやすい。
theological_decisions:
- issue: 動詞に安息日の遵守を明示するか
  choice: 「休んだ」と訳す
  alternative: 「安息日を守った」または「やめた」
  rationale: ヘブライ語の動詞が直接述べるのは、活動をやめて休んだことである。安息日の意味は周囲の文脈と「七日目」から明らかなため、礼典的・教理的な表現を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「民」は物語上の共同体を簡潔に示す。「こうして」により直前の出来事との帰結的なつながりを表した。
