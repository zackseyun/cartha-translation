base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: ja
  text: 六日目には、彼らが持ち帰るものを整えると、それは日ごとに集める量の二倍になる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「日ごとに集める量に加えて、同量となる」。
    reason: מִשְׁנֶה עַל אֲשֶׁר の表現は、通常量の二倍、すなわち通常量に同量が加わることとしても表現できるため。
lexical_decisions:
- source_word: וְהָיָה֙ בַּיּ֣וֹם הַשִּׁשִּׁ֔י
  choice: 六日目には
  rationale: 未来の状況を導く表現を、文脈に自然な日本語の時の句として訳した。「週の」は原文に明示されていないため補わない。
- source_word: וְהֵכִ֖ינוּ
  choice: 整えてみると
  rationale: 準備する、整えるという動作が、持ち帰った量の確認にもつながる文脈を自然に表す。接続形の時間的・状況的関係も「〜てみると」で示した。
- source_word: אֵ֣ת אֲשֶׁר יָבִ֑יאוּ
  choice: 持ち帰ったものを
  rationale: 集めたマナを宿営へ持ち帰る文脈に即し、目的語を明確で自然に表した。
- source_word: וְהָיָ֣ה מִשְׁנֶ֔ה
  choice: その量は……二倍になる
  rationale: מִשְׁנֶהが示す二重の量を明確にし、日本語では暗黙になりうる比較対象を「量」で自然に補った。
- source_word: עַ֥ל אֲשֶֽׁר יִלְקְט֖וּ
  choice: 集める量の二倍
  rationale: עַלを量の比較関係として捉え、逐語的な「上に」ではなく自然な倍数表現にした。
- source_word: י֥וֹם יֽוֹם
  choice: 日ごとに
  rationale: 反復による配分的・習慣的意味を、明瞭な現代日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令的文脈にふさわしい落ち着いた格調を保った。原文の未来的な趣旨は「〜になる」で示し、「週の」など原文にない限定は加えていない。
