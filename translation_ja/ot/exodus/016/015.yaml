  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: ja
  text: イスラエルの人々はそれを見ると、互いに[a]「これは何だ[b]」と言った。それが何なのか分からなかったからである。モーセは彼らに言った。「これは、ヤハウェがあなたがたに食べるものとして与えたパンである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「人がその兄弟に」。ここでは「互いに」を意味する慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「これは何だ」に当たるヘブライ語の表現は、伝統的に「マナ」という名と結び付けられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 直訳は「イスラエルの子ら」だが、ここではイスラエル共同体を指す自然な現代日本語として「イスラエルの人々」とした。
- source_word: אִישׁ אֶל אָחִיו
  choice: 互いに
  rationale: 字義的には「人がその兄弟に」だが、相互に言い合うことを表すヘブライ語の慣用表現なので、日本語では「互いに」とした。
- source_word: מָן הוּא
  choice: これは何だ
  rationale: 直後の「それが何なのか分からなかった」が示すとおり、ここでは問いとして訳した。後に定着する「マナ」という名称を本文へ先取りせず、語の結び付きは脚注に残した。
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: それが何なのか分からなかった
  rationale: 物の正体を知らなかったという説明を、明快で自然な日本語にした。
- source_word: הוּא הַלֶּחֶם
  choice: これは……パンである
  rationale: 代名詞と名詞によって目の前の物をパンと同定する構文を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: לְאָכְלָה
  choice: 食べるものとして
  rationale: 食用に与えられたという目的を、自然な日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が神の固有名を明記しているため、称号へ置換せず「ヤハウェ」とした。
- issue: מָן を本文で固有名詞「マナ」とするか
  choice: 問いとして「これは何だ」と訳す
  alternative: 「マナだ」または「これはマナだ」と訳す
  rationale: 続く理由節が、彼らがその正体を知らなかったために尋ねたことを明示する。物語上の問いと後の名称との緊張を保ち、名称との伝統的な関連は脚注で示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、語りの簡潔さとモーセの宣言の格調を保った。「である」を用いて説明と宣言を引き締め、神名は固有名として示した。脚注記号は、それぞれが説明する表現の直後に配置した。
