source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: ja
  text: モーセは言った。「ヤハウェが命じられたことはこうである。そのうち一オメルいっぱい[a]を、代々にわたって保存しておきなさい。それは、わたしがあなたがたをエジプトの地から導き出したとき、荒野であなたがたに食べさせたパンを、後の世代の人々が見るためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一オメルいっぱい」とは、オメルという容量単位の満量を指す。
    reason: 古代の度量衡についての文化的注記。
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: モーセは言った
  rationale: 物語を進める標準的な表現として、現代日本語で自然かつ簡潔に訳した。
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: ヤハウェが命じられたことはこうである
  rationale: דָּבָר はここでは具体的な命令内容を導入するため「こと」とし、提示表現 זֶה を自然な日本語の「こうである」で表した。
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: そのうち一オメルいっぱい
  rationale: מִמֶּנּוּ が直前のマナを指すことを「そのうち」で示し、古代の容量単位オメルを換算せず保持した。מְלֹא の「満量」を「いっぱい」で表した。
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: 代々にわたって保存しておきなさい
  rationale: 保管・保存を表す לְמִשְׁמֶרֶת と、後続する諸世代を表す לְדֹרֹתֵיכֶם を、命令の継続的目的が明瞭になる自然な日本語にした。
- source_word: לְמַעַן יִרְאוּ
  choice: 後の世代の人々が見るため
  rationale: 目的節として訳し、動詞の暗黙の主語が直前の「あなたがたの諸世代」であることを日本語で明示した。
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: わたしがあなたがたに食べさせたパン
  rationale: לֶחֶם を一般化して「食物」とせず「パン」と訳し、אכל のヒフィル形の使役的意味を「食べさせた」で保持した。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: 出エジプト記の地理的・物語的背景に合う標準的な訳語を用いた。
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: わたしがあなたがたをエジプトの地から導き出したとき
  rationale: 前置詞 בְּ を伴う不定詞構文を時間節として訳し、יצא のヒフィル形を「導き出した」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に明示された固有の神名を普通名詞的な称号へ置き換えず、現代日本語で広く認識される音写で示した。
- issue: 引用中の一人称「わたし」の話者
  choice: 神の直接発話として一人称を保持
  alternative: ヤハウェが彼らに食べさせた、という三人称化
  rationale: 「ヤハウェが命じられたこと」に続く命令文の中で、原文は הֶאֱכַלְתִּי と בְּהוֹצִיאִי により神ご自身の一人称を用いる。その話者の移行を説明的に解消せず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「こうである」「保存しておきなさい」によって命令の厳粛さと自然さを両立させ、後半の神の一人称発話も原文どおり保持した。
