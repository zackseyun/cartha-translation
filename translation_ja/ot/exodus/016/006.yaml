source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: ja
  text: そこで、モーセとアロンはイスラエルの民全体[a]に言った。「夕方には、あなたがたは、ヤハウェこそがあなたがたをエジプトの地から導き出されたことを知ることになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルのすべての息子たち」。または「すべてのイスラエル人」。ここではイスラエルの民全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで、…言った
  rationale: 物語を先へ進める接続形の働きを、自然な現代日本語で表した。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロン
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルのすべての子ら
  rationale: בְּנֵי の『子ら』という形を保ちつつ、民全体を指すヘブライ語の定型表現として訳した。自然な代案は『すべてのイスラエル人』。
- source_word: עֶרֶב
  choice: 夕方には
  rationale: 時間を示す副詞的用法を明瞭かつ自然に表した。文脈上『今夕』とも解し得るが、原文自体は指示語を伴わない。
- source_word: וִידַעְתֶּם
  choice: あなたがたは知る
  rationale: 後続する認識を表す完了形ワウ接続を、文脈に即して未来として訳した。
- source_word: כִּי
  choice: …ことを
  rationale: 知る内容を導く接続詞として、日本語では名詞化構文にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、四文字神名を固有名として音写した。
- source_word: הוֹצִיא אֶתְכֶם
  choice: あなたがたを…導き出した
  rationale: יצא のヒフィル形の使役的意味『外へ出す、導き出す』を自然な日本語で表した。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: אֶרֶץ を省略せず、原文の表現を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有の神名が明記されているため、称号『主』に置換せず音写した。日本語で歴史的に用いられる『エホバ』は別の慣用表記だが、ここではヘブライ語の推定発音に近い『ヤハウェ』を採用した。
- issue: 出エジプトの主体を示す構文
  choice: 導き出したのがヤハウェであること
  alternative: ヤハウェが導き出したこと
  rationale: ヘブライ語の語順では主語 יְהוָה が動詞に先立って強調されているため、日本語でも『…のがヤハウェ』として主体への焦点を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、荘重さを保ちながら古語的な言い回しは避けた。神名は『ヤハウェ』、人名は定着した『モーセ』『アロン』とした。
