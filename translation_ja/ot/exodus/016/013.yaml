  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: ja
  text: 夕方になると、うずらがやって来て宿営を覆った。朝になると、宿営の周りに露の層があった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: 夕方になると
  rationale: 物語の次の出来事が起きる時を示す表現。直訳調の「夕方にこうなった」よりも、現代日本語として自然に時の推移を表す。
- source_word: וַתַּעַל הַשְּׂלָו
  choice: うずらがやって来て
  rationale: עלהの上昇・到来のイメージを踏まえつつ、鳥が宿営へ到来したことを自然な日本語で表した。שְׂלָוは集合的に「うずら」とした。
- source_word: וַתְּכַס אֶת הַמַּחֲנֶה
  choice: 宿営を覆った
  rationale: כסהの「覆う」を保ち、מַחֲנֶהは文脈に適した「宿営」と訳した。
- source_word: וּבַבֹּקֶר
  choice: 朝になると
  rationale: 夕方との対応と物語上の時間の推移が明確になる自然な表現。
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: 露が層をなして降りていた
  rationale: שִׁכְבַתの具体的な「層」の意味を保持しながら、日本語で露の存在を自然に描写した。
- source_word: סָבִיב לַמַּחֲנֶה
  choice: 宿営の周りには
  rationale: 宿営を取り囲む位置関係を簡潔かつ明確に表した。
