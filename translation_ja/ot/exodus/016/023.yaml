id: EXO.16.23
reference: Exodus 16:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: ja
  text: 彼は彼らに言った。「これはヤハウェが語られたことです。明日は、完全に休む日、ヤハウェのための聖なる安息日です[a]。焼くものは焼き、煮るものは煮なさい[b]。残ったものはすべて、自分たちのために朝まで保管しておきなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「ヤハウェに対して聖なる安息日」。また「ヤハウェにささげられた聖なる安息日」とも訳せる。
    reason: לַיהוָהが表す方向づけ・所属・献呈の幅を残すため。
  - marker: b
    text: ヘブライ語は「焼くものは焼け、煮るものは煮よ」と同じ動詞を繰り返して強調している。「煮る」は、より広く「調理する」とも訳せる。
    reason: 原文の動詞反復とבשלの語義の幅を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 彼は彼らに言った
  rationale: 物語を進めるワウ継続法と直接話法への導入を簡潔に保つ。本文だけから固有名を補わず、代名詞を維持した。
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェが語られたのは、このことです
  rationale: הוּא の指示・同定機能を「このこと」で示し、直前までの事柄を受ける構文を自然な日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文の神名יהוהを称号に置き換えず、現代日本語で一般的な音写を用いた。
- source_word: שַׁבָּתוֹן
  choice: 全き休みの日
  rationale: 通常の休息より強い、労働をやめて休む特別な日という意味を表す。「厳かな」は原語に明示されない情緒的含意を加えうるため避けた。
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: ヤハウェにささげる聖なる安息日
  rationale: 「聖なる安息日」と、その日がヤハウェに属し向けられていることの双方を明示した。
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: 焼くものは焼き
  rationale: 同じ語根の動詞を関係節と命令で反復する原文の強調を、日本語でも同じ動詞の反復によって保った。
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: 煮るものは煮なさい
  rationale: בשלの具体的な調理義「煮る」を採り、前句と並行する動詞反復を保った。より広く「調理する」とも訳しうる。
- source_word: כָּל הָעֹדֵף
  choice: 残ったものはすべて
  rationale: 分量が余って残るものを指す分詞を、平明で文脈に適した日本語にした。
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת
  choice: 取っておくために、自分たちのために取り分けておきなさい
  rationale: 意図的に別にして保存すること、לָכֶםの受益、自ら管理して保つ目的をそれぞれ表した。
- source_word: עַד הַבֹּקֶר
  choice: 朝まで
  rationale: 保存の期限を簡潔で自然な日本語で示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を直接用いているため、称号「主」への置換を避けて音写した。
- issue: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָהの関係
  choice: 全き休みの日、ヤハウェにささげる聖なる安息日
  alternative: ヤハウェにとって聖なる安息の安息日
  rationale: 二つの名詞句を同格として読みつつ、特別な休止と聖別の両面を保った。לַיהוָהは所属・方向づけを表しうるので「ささげる」としたが、神に対する聖別という幅を脚注で示した。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある敬体の直接話法とした。命令は強圧的になりすぎない「なさい」を用い、安息日の聖性を表す箇所ではやや荘重な語調を保った。
