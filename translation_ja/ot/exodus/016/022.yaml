base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: ja
  text: 六日目になると、彼らはパンを二倍の量、すなわち一人につき二オメル[a]集めた。そして、会衆の指導者たちは皆、モーセのもとに来て、彼に告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: オメルは、古代イスラエルで用いられた乾量の単位である。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: 六日目になると
  rationale: 物語の進行と時を示す表現を、古風にならない自然な現代日本語で表した。
- source_word: לָקְטוּ לֶחֶם מִשְׁנֶה
  choice: パンを二倍……集めた
  rationale: לֶחֶםを「食物」や「マナ」と言い換えず「パン」とし、מִשְׁנֶהの倍量の意味を保持した。
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: 一人につき二オメルずつ
  rationale: לָאֶחָדの配分的な意味を明確にし、古代の容量単位オメルは音写した。
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: 会衆の指導者たちは皆
  rationale: נְשִׂיאִיםを現代語として明瞭な「指導者たち」、עֵדָהを共同体としての「会衆」と訳した。
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: モーセのもとに来て、そのことを報告した
  rationale: 来訪と報告という動作の順序を保ち、日本語で目的語を補って自然にした。
