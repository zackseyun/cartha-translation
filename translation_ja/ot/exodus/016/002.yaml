  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: ja
  text: イスラエルの子ら[a]の全会衆は、荒野でモーセとアロンに対して不平を言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人」。伝統的には「イスラエルの子孫」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: 不平を言った
  rationale: この文脈のלון／ליןは、指導者に向けた集団的な不満や抗議を表す。「不平を言った」は否定的な含みを保ちつつ、現代日本語として自然である。
- source_word: כָּל עֲדַת
  choice: 全会衆
  rationale: כָּלは集合名詞עֵדָהの全体性を強調する。出エジプト記におけるイスラエル共同体のまとまりを簡潔に表すため「全会衆」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の男性複数構文を保ち、ヤコブすなわちイスラエルの子孫から成る契約共同体という表現を訳出した。自然な民族名「イスラエル人」は脚注に示す。
- source_word: עַל
  choice: に対して
  rationale: 人を目的語とする不平の文脈で、敵対的・対抗的な方向を示す。「に対して」は日本語で自然にその関係を表せる。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: מִדְבָּרは必ずしも砂地の砂漠ではなく、人里から離れた荒れ地を指すため、聖書文脈でも明瞭な「荒野」とした。
theological_decisions:
- issue: 共同体の呼称בְּנֵי יִשְׂרָאֵלの訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの子孫
  rationale: 原文の系譜的かつ男性複数の形を本文で保ちつつ、この句が共同体全体を指すことを脚注の自然な代替訳で明らかにした。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述体。「全会衆」「荒野」は五書の共同体的・地理的語感を保ち、「不平を言った」で古風すぎない自然な表現とした。
