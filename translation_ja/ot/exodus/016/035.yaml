  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: ja
  text: イスラエルの民[a]は、人の住む地[b]に着くまで四十年間、マナを食べた。彼らはカナンの地の境界[c]に着くまで、マナを食べた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イスラエルの子ら」。イスラエルの民を指す定型的な呼び名。
    reason: lexical_alternative
  - marker: b
    text: または「人々が定住している地」。荒野とは対照的な、実際に人が居住している土地を指す。
    reason: lexical_alternative
  - marker: c
    text: または「端」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの民
  rationale: 直訳は「イスラエルの子ら」だが、ここではイスラエル民族全体を指す定型的な呼称である。現代日本語で自然かつ包括的に伝えるため「イスラエルの民」とし、原語の形は脚注に示した。
- source_word: אָכְלוּ
  choice: 食べた
  rationale: אכל の完了形で、過去を総括する叙述として素直に「食べた」と訳した。
- source_word: הַמָּן
  choice: マナ
  rationale: この文脈で定着している名称を用いた。日本語では固有の食物名として冠詞を明示する必要がない。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年間
  rationale: 期間を表す句であるため、自然な日本語として「四十年間」とした。
- source_word: עַד בֹּאָם
  choice: 着くまで
  rationale: 前置詞 עַד と接尾辞付き不定詞が到着までの時間的限界を示す。「入るまで」ほど解釈を加えず、文脈に自然な「着くまで」とした。
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: 人の住む地に
  rationale: נוֹשָׁבֶת は「人が住んでいる、定住されている」を表し、荒野との対照をなす。「人の住む地」は明瞭で自然な表現である。
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: カナンの地の境に
  rationale: קְצֵה には「端、果て、境」の意味がある。地理的な到達点を述べるここでは「境」が自然だが、「端」という語義も脚注に残した。
