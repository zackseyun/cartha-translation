source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: ja
  text: 「ヤハウェが命じたことはこうである。『あなたがたは、各自が食べる量に応じて、それを集めなさい。あなたがたの人数に従い、一人[a]につき一オメルを取りなさい。各自、自分の天幕にいる者たちのために取りなさい。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「頭ごとに」。
    reason: לַגֻּלְגֹּלֶתの字義的表現を示し、本文では自然な配分表現「一人につき」としたことを明らかにするため。
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: 命じられたことはこうである
  rationale: דָּבָרは「言葉」「事柄」の両義を持つが、この命令導入句では、日本語として自然でありつつ、これから命令内容を提示する働きを示す「ことはこうである」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: あなたがたはそれを…集めなさい
  rationale: לקטの食物を拾い集める意味と、共同体に対する二人称複数の命令を明確にした。מִמֶּנּוּは文脈上マナを指すため、日本語では自然な目的語「それを」とした。
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: それぞれが食べる分だけ
  rationale: 男性単数形אִישׁの配分的用法を「それぞれ」で表し、直訳的で不自然な「その食べることに応じて」を、必要な摂取量を表す自然な日本語にした。
- source_word: עֹמֶר
  choice: オメル
  rationale: 古代の特定の乾量単位であり、現代の単位への不確かな換算を避けて音写した。
- source_word: עֹמֶר לַגֻּלְגֹּלֶת
  choice: 一人につき一オメル
  rationale: לַגֻּלְגֹּלֶתは字義的には「頭蓋骨／頭ごとに」だが、ここでは人数を数える配分表現なので「一人につき」と自然に訳し、字義は脚注に残した。
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: あなたがたの人数に応じて
  rationale: נֶפֶשׁはここで非物質的な「魂」ではなく、数えられる個々の人を指すため、「人数」とした。
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: 自分の天幕にいる者たちの分
  rationale: 具体的な「天幕」の像を保ち、「家族」だけに限定せず、その天幕にいる人々を指す表現とした。
- source_word: תִּקָּחוּ
  choice: 取りなさい
  rationale: 二人称男性複数の指示・命令の力を、現代日本語の明瞭な命令表現で示した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名としての性格を保つ音写を採用した。
- issue: נֶפֶשׁの意味
  choice: 人数
  alternative: 魂の数
  rationale: この箇所では食糧配分の対象となる人を数えており、霊魂についての主張ではないため、文脈上の人称的意味を採った。
translation_notes:
  register: 明快な現代標準語を用い、命令としての厳粛さを保った。「各人」より日常的な「それぞれ」を選び、古代の具体的生活像である「天幕」と度量名「オメル」は保持した。
