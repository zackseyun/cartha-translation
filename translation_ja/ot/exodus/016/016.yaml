revisions:
- from: 「ヤハウェが命じられたことはこうである。『あなたがたはそれを、それぞれが食べる分だけ集めなさい。あなたがたの人数に応じて、一人[a]につき一オメルである。それぞれ、自分の天幕にいる者たちの分を取りなさい。』」
  to: 「ヤハウェが命じたことはこうである。『あなたがたは、各自が食べる量に応じて、それを集めなさい。あなたがたの人数に従い、一人[a]につき一オメルを取りなさい。各自、自分の天幕にいる者たちのために取りなさい。』」
  rationale: 命令導入句を能動形の「ヤハウェが命じたこと」として原文に即して明瞭にし、オメルの規定を「取りなさい」という命令として訳した。「人数に従い」をその命令に接続して修飾関係を明確にした。マナを指す代名詞、食べる必要に応じる配分、天幕にいる者たちという具体像は維持した。
