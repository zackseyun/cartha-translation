base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: ja
  text: さて、七日目になると、民のうちの何人かが集めに出て行ったが、何も見つからなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: さて、～になると
  rationale: 物語の次の出来事を導く継続的な語法。逐語的な「そして、起こった」ではなく、現代日本語で自然に物語の進行を示す。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目になると
  rationale: 原文どおり「七日目」とし、「週の」は補わない。וַיְהִי と合わせ、自然な時間表現にした。
- source_word: יָצְאוּ
  choice: 出て行った
  rationale: 宿営などから外へ向かう移動を表す、自然で明確な訳語。
- source_word: מִן הָעָם
  choice: 民のうちの何人か
  rationale: מן の部分を示す用法を明示し、民全体ではなく、その一部が行動したことを伝える。
- source_word: לִלְקֹט
  choice: 集めに
  rationale: 目的を表す不定詞。何を集めるかは直前の文脈から明らかなため、「マナ」は補わない。
- source_word: וְלֹא מָצָאוּ
  choice: が、何も見つからなかった
  rationale: 直訳は「そして彼らは見つけなかった」。目的が果たされなかった対照を「が」で自然に示し、目的語を明示しない原文に対応して「何も」と訳す。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。物語文として簡潔さと品位を保ち、原文が明示しない「マナ」や「週の」を本文に補わない。部分を表す מִן הָעָם は日本語本文で明確に表せるため、注は付さない。
