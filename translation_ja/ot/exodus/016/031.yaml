base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: ja
  text: イスラエルの家は、それを「マナ」[a]と名づけた。それは白いコリアンダーの種のようで[b]、その味は蜜を入れた薄焼き菓子のようだった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「マン」。日本語では伝統的に「マナ」と訳される。
    reason: lexical_alternative
  - marker: b
    text: 別訳「コリアンダー（コエンドロ）の種のようで、白く」。
    reason: lexical_alternative
  - marker: c
    text: 「薄焼き菓子」に当たるヘブライ語の正確な意味は不確か。「蜜を加えた薄いパン菓子」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל אֶת־שְׁמוֹ
  choice: イスラエルの家は、それを…と名づけた
  rationale: 「イスラエルの家」という共同体を表すヘブライ語の言い回しを保ちつつ、「その名を…と呼んだ」を自然な現代日本語にした。
- source_word: מָן
  choice: マナ
  rationale: ヘブライ語では man。荒野で与えられた食物を指す、日本語聖書で定着した音写を用いた。
- source_word: כְּזֶרַע גַּד לָבָן
  choice: 白いコエンドロの種のよう
  rationale: גַּד は一般にコエンドロ（コリアンダー）と同定される。לָבָן を種の外観を表す「白い」として、自然な語順にした。
- source_word: וְטַעְמוֹ
  choice: その味
  rationale: טַעַם の食品についての基本的な意味を明瞭に表した。
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: 蜜を入れた薄焼き菓子のよう
  rationale: צַפִּיחִת は薄い焼き菓子を指すと考えられるが、正確な形状は不確かである。בְּדְבָשׁ は材料または付加物を示す表現として訳した。
