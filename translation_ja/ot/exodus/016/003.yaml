revisions:
- from: イスラエルの人々は彼らに言った。「エジプトの地で、肉の鍋のそばに座り、パンを満腹するまで食べていた時に、私たちはヤハウェの手によって死んでいたならよかったのに。あなたがたは、この荒野に私たちを連れ出し、この全集会を飢え死にさせようとしている。」
  to: イスラエルの人々は彼らに言った。「エジプトの地で、肉の鍋のそばに座って、パンを満腹するまで食べていた時に、私たちはヤハウェの手によって死んでいたならよかったのに。あなたがたは、この共同体全体を飢えで死なせるために、私たちをこの荒野に連れ出したのだ。」
  rationale: 原文の願望表現、神名、および「肉の鍋」「満腹するまでパンを食べる」という具体像は保持した。後半は לְהָמִית の目的用法を明確にし、話者たちの非難としての完了した連れ出し行為を反映した。
  reviewer_model: gpt-5.6-terra
