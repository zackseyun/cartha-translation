source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: ja
  text: イスラエルの人々は彼らに言った。「エジプトの地で、肉の鍋のそばに座って、パンを満腹するまで食べていた時に、私たちはヤハウェの手によって死んでいたならよかったのに。あなたがたは、この共同体全体を飢えで死なせるために、私たちをこの荒野に連れ出したのだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの息子たち」だが、ここでは民全体を指す慣用的・系譜的表現であり、現代日本語として明瞭な「イスラエルの人々」とした。
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: 私たちは…死んでいたならよかったのに
  rationale: 直訳的な疑問ではなく、実現しなかった過去への強い願望を表すヘブライ語の慣用句として訳した。
- source_word: בְיַד יְהוָה
  choice: ヤハウェの手によって
  rationale: 神の直接的な働き・介入を示す「手」の比喩を保持し、神名 יהוה は「ヤハウェ」と音写した。
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: 肉の鍋のそばに座り
  rationale: עַל はこの文脈で鍋の近くにいたことを表すものと理解し、具体的な情景を保った。
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: パンを満腹するまで食べていた
  rationale: לָשֹׂבַע の満ち足りるほど食べるという意味を、自然で明瞭な日本語にした。
- source_word: הַמִּדְבָּר הַזֶּה
  choice: この荒野
  rationale: 出エジプト記における地理的・物語的モチーフを保つ標準的な訳語を用いた。
- source_word: לְהָמִית
  choice: 飢え死にさせようとしている
  rationale: 目的を表す不定詞を、話者たちの非難として自然に表現した。
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: この全集会
  rationale: קָהָל の召集された共同体という集合的意味を保ち、「会衆」より一般読者に通じやすい表現とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく四文字神名を用いているため、神の固有名を明示する音写を採用した。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的用法
  choice: イスラエルの人々
  alternative: イスラエルの息子たち
  rationale: 男性複数形の字面よりも、この定型句が男女を含むイスラエル共同体を指す語用論的意味を優先した。
- issue: 「ヤハウェの手によって死ぬ」の含意
  choice: 比喩を保持し、死の具体的手段は特定しない
  alternative: ヤハウェに打たれて死ぬ
  rationale: 原文は神の作用を表すが、その具体的な死因や裁きの形態までは明示していないため、曖昧さを残した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある直接話法。民の誇張された回想とモーセ、アロンへの鋭い非難を弱めず、同時に原文にない説明は加えない。
