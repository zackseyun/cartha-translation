  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: ja
  text: モーセは彼らに言った。「だれも、朝までそれを少しも残しておいてはならない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ワウ継続法によって物語が進行する。日本語では文脈上、接続語を補わず「言った」とするのが自然である。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着している人名表記。
- source_word: אֲלֵהֶם
  choice: 彼らに
  rationale: 前置詞 אֶל と三人称男性複数接尾辞を直接反映し、対象を「民」と特定する解釈的な補足を避けた。
- source_word: אִישׁ אַל
  choice: だれも……てはならない
  rationale: אִישׁ はここでは各人に及ぶ分配的・一般的用法であり、אַل の禁止と合わせて、現代日本語で自然な全面禁止として表した。性別を限定する「男は」とはしない。
- source_word: יוֹתֵר
  choice: 残しておいてはならない
  rationale: יתר の使役形は、ここではマナの一部を残存させる、取っておくことを意味する。「残しておく」が文脈に即した自然な表現である。
- source_word: מִמֶּנּוּ
  choice: それを少しも
  rationale: 接尾辞は直前の文脈にあるマナを指す。「少しも」は מן の部分的な意味と否定の射程を自然に表し、何も残してはならないことを明確にする。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 期限を示す句を簡潔かつ直接的に訳した。
