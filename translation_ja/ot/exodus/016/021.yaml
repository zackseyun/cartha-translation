  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: ja
  text: 彼らは朝ごとに、それぞれ自分が食べる分に応じて、それを集めた。太陽が熱くなると、それは溶けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: 集めた
  rationale: לקט は食物などを拾い集めることを表す。「集めた」は具体的な行為を自然な日本語で伝える。
- source_word: אֹתוֹ
  choice: それを
  rationale: 直前の文脈にあるマナを指す目的語代名詞であり、本文どおり名詞を補わず代名詞で訳した。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 朝ごとに
  rationale: 「朝、朝」という反復は、朝ごとの反復・分配を表す。日本語では「朝ごとに」が簡潔で自然である。
- source_word: אִישׁ
  choice: それぞれ
  rationale: 単数男性形だが、ここでは共同体の各人を分配的に示す。現代日本語の「それぞれ」はその働きを自然に保つ。
- source_word: כְּפִי אָכְלוֹ
  choice: 自分が食べる分に応じて
  rationale: 字義的には「彼の食べることの口に応じて」。各人の食べる必要量・分量に応じるという慣用的意味を明確にした。
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: 日が熱くなると
  rationale: 太陽が熱くなるという叙述を、後続の出来事との時間的関係が自然に伝わる形で訳した。
- source_word: וְנָמָס
  choice: それは溶けた
  rationale: מסס は「溶ける、融解する」を意味し、熱を受けたマナの描写として「溶けた」が適切である。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。ヘブライ語の反復 בַּבֹּקֶר בַּבֹּקֶר は、逐語的な「朝、朝」ではなく、反復の意味を自然に表す「朝ごとに」とした。節中に注記を要するほどの曖昧さはない。
