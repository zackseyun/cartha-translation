- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの家族的表現「イスラエルの子ら」を保ちつつ、現代日本語として理解できる形にした。
- source_word: וַיִּלְקְטוּ
  choice: 集めた
  rationale: לקטは食物などを拾い集めることを表す。マナの文脈では「集めた」が簡潔で自然。
- source_word: הַמַּרְבֶּה וְהַמַּמְעִיט
  choice: ある者は多く、ある者は少なく
  rationale: 定冠詞付きの分詞を実質的な名詞として理解し、集めた量の多い者と少ない者の対照を自然に表した。
