source:
  edition: WLC
  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: ja
  text: 朝には、あなたがたはヤハウェの栄光を見る。ヤハウェが、ヤハウェに対するあなたがたの不平を聞かれたからである。[a] そして、私たちは何者だというのか。あなたがたが私たちに不平を言うとは。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェが、ヤハウェに対するあなたがたの不平を聞かれるとき」とも訳せる。ヘブライ語の構文は、理由とも時とも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: 朝には
  rationale: 接続詞と名詞から成る時を示す表現。前節からの流れは文脈に委ね、現代日本語として自然に時点を示した。
- source_word: וּ/רְאִיתֶם
  choice: あなたがたは…見る
  rationale: この予告の文脈では未来の意味を表す。日本語では時を示す「朝には」によって未来性が明らかなため、自然な非過去形とした。
- source_word: כְּבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: 神の威光と現れを含む「栄光」という聖書的な語を保ち、固有名を明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写した。
- source_word: בְּ/שָׁמְע/וֹ
  choice: 聞かれたからである
  rationale: 前置詞付き不定詞構文を、この文脈では栄光を見る理由を示す因果表現として訳した。時間的解釈も可能なので脚注に残した。
- source_word: תְּלֻנֹּתֵיכֶם
  choice: あなたがたの不平
  rationale: 単なる中立的な訴えではなく、不満を募らせて反抗的にこぼす意味合いを、平明な現代語「不平」で表した。
- source_word: עַל יְהוָה
  choice: ご自分に対する
  rationale: 不平がヤハウェに向けられているという敵対的・方向的な関係を示し、同一文中で主語もヤハウェであるため自然な再帰表現とした。
- source_word: וְנַחְנוּ מָה
  choice: 私たちは何者だというのか
  rationale: モーセとアロンの立場の小ささを示す修辞疑問として、明瞭で自然な日本語にした。接続詞は日本語で不自然な連続を避けるため明示しなかった。
- source_word: כִּי תלונו עָלֵינוּ
  choice: あなたがたが私たちに不平を言うとは
  rationale: כִּי を修辞疑問の内容・帰結を導く表現として捉え、驚きと非難を含む自然な日本語の「とは」で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を用いていることを可視化し、称号への置換を避けた。
- issue: בְּשָׁמְעוֹ の因果的・時間的解釈
  choice: ヤハウェが…聞かれたからである
  alternative: ヤハウェが…聞かれるとき
  rationale: 文脈上、民の不平を聞いたことが栄光の顕現の理由として示される読みを本文に採用した。ただしヘブライ語構文には時間的な読みもあるため、脚注で明示した。
- issue: 民の不平の最終的な向かう先
  choice: ヤハウェに対する不平と明示する
  alternative: ヤハウェについての不平
  rationale: עַל と不平を表す語の組み合わせは、単なる話題ではなくヤハウェに向けられた反抗を示す。後半でモーセとアロンへの不平が対比される緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神名と「栄光」の荘重さを保った。「不平」は同じ語根に由来する名詞と動詞の連関が読者に伝わるよう、前後で統一した。脚注記号は該当する因果節の直後に置いた。
