id: EXO.16.12
reference: Exodus 16:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: ja
  text: わたしはイスラエルの子らの不平を聞いた。彼らにこう告げなさい。『夕暮れ時[a]、あなたがたは肉を食べ、朝にはパンで満ち足りる。こうして、わたしがヤハウェ、あなたがたの神であることを知る。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「二つの夕べの間」。夕暮れの時間帯を指すヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: 聞いた
  rationale: 完了形が表す、すでに聞き届けた事実を自然な現代日本語で示す。文脈上、その結果は現在の応答につながっている。
- source_word: תְּלוּנֹּת
  choice: 不平
  rationale: 荒野で繰り返される不満の訴えという否定的な含みを保ち、「苦情」よりも文脈に適する。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の「イスラエルの子ら」という形を比較的明瞭に保ちつつ、共同体全体を指す表現として読める日本語にした。
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: 彼らにこう告げなさい
  rationale: 命令と発話導入を自然な日本語で一体化し、後続の直接話法を明確に導く。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 夕暮れ時
  rationale: 字義的には「二つの夕べの間」である慣用句の時間的意味を本文で明瞭にし、直訳は脚注に残す。
- source_word: תֹּאכְלוּ בָשָׂר
  choice: 肉を食べ
  rationale: 食物の文脈における בָשָׂר を自然に「肉」とし、未完了形の予告・約束の意味を表す。
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: パンで満ち足りる
  rationale: 「パンによって十分に満たされる」という具体的な充足を保ち、供給の豊かさを示す。
- source_word: וִידַעְתֶּם
  choice: こうして…知る
  rationale: 前述の出来事の結果として認識に至る流れを、日本語で明確に示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写する。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: イスラエルの神を指す単数の意味と、二人称複数の契約的関係を明確に表す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を用いているため、称号「主」に置換せず、一般的な学術的音写「ヤハウェ」を採用した。
- issue: בְּנֵי יִשְׂרָאֵל の共同体表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの息子たち
  rationale: 原文の親族的表現を保つ一方、「息子たち」として男性だけに限定する含意を不必要に加えず、イスラエル共同体を指す原文の用法を保持した。
- issue: וִידַעְתֶּם の結果的関係
  choice: こうして…知る
  alternative: そして…知る
  rationale: 食物の供給を通して神の自己同定を認識するという文脈上の結果関係を示しつつ、認識の内容自体は限定的に解釈しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神の発話は尊大な古語調にせず、一人称「わたし」と命令形「告げなさい」で自然に表した。
