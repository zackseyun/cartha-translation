  choice: 十分の一
  rationale: 分量の比率を表す語であり、現代日本語で簡潔かつ正確な「十分の一」とした。
- source_word: הָאֵיפָה
  choice: 一エファの
  rationale: 古代ヘブライの乾量単位なので音写し、基準となる一単位を明確にするため「一」を添えた。
- source_word: הוּא
  choice: である
  rationale: 名詞文の繋辞的機能を、簡潔な定義表現「である」で示した。
- source_word: וְ
  choice: （訳出せず）
  rationale: ここでは補足説明を導く接続辞だが、日本語では明示しないほうが自然であり、節の定義的・説明的機能も保たれる。
