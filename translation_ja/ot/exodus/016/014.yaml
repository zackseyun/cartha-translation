  text: וַ/תַּ֖עַל שִׁכְבַ֣ת הַ/טָּ֑ל וְ/הִנֵּ֞ה עַל פְּנֵ֤י הַ/מִּדְבָּר֙ דַּ֣ק מְחֻסְפָּ֔ס דַּ֥ק כַּ/כְּפֹ֖ר עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: ja
  text: 露の層が上がると、見よ、荒野の地表には、細かく薄片状のもの[a]があった。それは地面の上の霜のように細かかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「薄片状」と訳したヘブライ語はまれな語で、詳しい意味は確かではない。質感または外見を表し、「粒状」とも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: 上がると
  rationale: עלהの基本的な上昇の像を保った。文脈上は露が消えることを指すが、「蒸発する」と説明的に限定しない。
- source_word: שִׁכְבַת הַטָּל
  choice: 露の層
  rationale: שִׁכְבָהが表す、横たわる層・覆いという物理的な像を簡潔に伝える。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 突然目の前に現れたものへ注意を向ける談話標識の力を保つ。
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: 荒野の表面に
  rationale: פְּנֵיの「面、表面」を明示し、מִדְבָּרは出エジプト記の文脈に適した「荒野」とした。
- source_word: דַּק
  choice: 細かな／細かかった
  rationale: 二度の反復を日本語でも保ち、小ささ・薄さを含み得る語を文脈に自然な形で訳した。
- source_word: מְחֻסְפָּס
  choice: 薄片状のもの
  rationale: 一度しか現れず意味の確定が難しい語であるため、推定される形状を示しつつ、名詞が省略されたヘブライ語を日本語として補った。
- source_word: דַּק כַּכְּפֹר
  choice: 霜のように細かかった
  rationale: כפרとの比較と、דקの反復を明確に保った。
- source_word: עַל הָאָרֶץ
  choice: 地面の
  rationale: この場面ではאֶרֶץは広い意味の「地、国」ではなく、物が載っている地面を指す。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に通じる簡潔で格調ある叙述とした。「見よ」は原文の注意喚起と場面の鮮やかさを保つために用いた。「露の層が上がる」は日本語ではやや異例だが、原文の上昇表現を保ち、「蒸発した」と解釈を固定しなかった。英語POBの脚注記号は「had gone up」の後に置かれている一方、脚注本文は希少語מְחֻסְפָּסを説明しているため、日本語では説明対象の「薄片状のもの」に付した。
