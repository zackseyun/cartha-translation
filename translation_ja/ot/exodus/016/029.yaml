id: EXO.16.29
reference: Exodus 16:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: ja
  text: 見なさい。ヤハウェがあなたがたに安息日を与えたのです。だから六日目には、二日分のパンをあなたがたに与えるのです。各自、そのいる所にとどまり、七日目にはだれも自分の場所から出てはなりません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: 見なさい
  rationale: 複数への命令で、見ることと認識することの両方を含みうる。後続の説明を受けて事実を認識するよう促す直接的な表現として訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: あなたがたに安息日を与えた
  rationale: 完了形と目的語を素直に反映し、安息日がイスラエルに与えられた賜物であることを保った。
- source_word: עַל כֵּן
  choice: だから
  rationale: 前文を理由として後続の備えを示す結果関係を、明瞭な現代日本語で表した。
- source_word: נֹתֵן
  choice: 与えるのです
  rationale: 分詞が示す現在的・習慣的な備えを表し、説明の流れを自然にした。
- source_word: לֶחֶם יוֹמָיִם
  choice: 二日分のパン
  rationale: 直訳的な『二日のパン』の意味を自然な日本語で表し、具体語『パン』を保持した。
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: 各自、そのいる所にとどまり
  rationale: ישב はここでは『座る』より『とどまる』、תחתיו は『そのいる所に』という慣用的意味。分配的な אִישׁ は日本語で自然な『各自』とした。
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: だれも自分の場所から出てはなりません
  rationale: 否定命令を明確に表し、מקום の『場所』を保持した。日本語では代表的男性形を機械的に『男』とせず、共同体の一人一人に及ぶ分配的意味を自然に示した。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目には
  rationale: 文脈上の安息日を、原文どおり週の順序による『七日目』として訳した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文の固有名を称号に置き換えず音写し、契約の神名であることを保った。
- issue: אִישׁ の分配的用法
  choice: 各自／だれも
  alternative: 各々の男／男はだれも
  rationale: 文法上は男性単数形だが、ここでは共同体の一人一人を分配的に指す。日本語で『男』とすると成人男性に限定する含意が生じやすいため、原文の適用範囲を自然かつ正確に示した。
- issue: 安息日の性格
  choice: 安息日を与えた
  alternative: 安息日を定めた
  rationale: נתן の基本的な『与える』を保持し、制度の制定だけでなく、民への賜物・備えという本文の含みを残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令と説明の厳粛さを保った。前半は『見なさい』で直接性を出し、後半は共同体への命令として自然な敬体の禁止表現にした。原文にない性別限定を日本語へ持ち込まないため、分配的 אִישׁ は『各自』『だれも』と訳した。
