revisions:
- from: モーセは言った。「ヤハウェは、あなたがたがご自分に向かって繰り返している不平[a]を聞いておられるので、夕方には食べる肉を、朝には満腹になるほどのパンを、あなたがたに与えてくださる。いったい私たちは何者なのか。あなたがたの不平は私たちに対するものではなく、ヤハウェに対するものなのだ。」
  to: モーセは言った。「ヤハウェが、あなたがたがヤハウェに対して不平を言っている、その不平を聞かれ、夕方には食べるための肉を、朝には満腹になるためのパンをあなたがたに与えられるとき、私たちはいったい何者なのか。あなたがたの不平は私たちに対するものではなく、ヤハウェに対するものなのだ。」
  rationale: 本文に「不平を言っている、その不平」と置くことで、原文の同根語の名詞・動詞反復を日本語でも可能な限り保った。「ヤハウェが…与えられるとき」により冒頭の時間的構文を示し、「ヤハウェに対して」と明示して不平の対象を曖昧にしないようにした。
