source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: ja
  text: モーセは言った。「ヤハウェが、あなたがたがヤハウェに対して不平を言っている、その不平を聞かれ、夕方には食べるための肉を、朝には満腹になるためのパンをあなたがたに与えられるとき、私たちはいったい何者なのか。あなたがたの不平は私たちに対するものではなく、ヤハウェに対するものなのだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּתֵת
  choice: 与えてくださる
  rationale: 前置詞בを伴う不定詞構文を、文脈上の出来事を自然に示す日本語の述語として訳した。神による供給を表すため、明瞭で品位ある表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: בָּשָׂר לֶאֱכֹל
  choice: 食べる肉
  rationale: 食物の文脈なのでבָּשָׂרは「肉」とし、目的を表す不定詞も簡潔に保った。
- source_word: לֶחֶם ... לִשְׂבֹּעַ
  choice: 満腹になるほどのパン
  rationale: לֶחֶםの具体的な像を「パン」として保ち、שׂבעが表す十分な満足・飽食を自然な日本語で示した。
- source_word: בִּשְׁמֹעַ
  choice: 聞いておられるので
  rationale: ここではヤハウェが供給される理由を示す因果的な用法と理解した。継続的に不平を聞いておられる含みも表した。
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: 繰り返している不平
  rationale: 同根の名詞と動詞による強調を、日本語では「繰り返している」によって表し、不満に満ちた反復的な訴えを示した。
- source_word: וְנַחְנוּ מָה
  choice: いったい私たちは何者なのか
  rationale: 直訳的な「私たちは何か」では不自然なため、「何者なのか」とし、モーセとアロンが不平の真の対象ではないという自己の卑小さを保った。
- source_word: לֹא עָלֵינוּ ... כִּי עַל יְהוָה
  choice: 私たちに対するものではなく、ヤハウェに対するもの
  rationale: 対比を明示し、不平の向けられた相手を自然な現代日本語で表した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文の固有名を称号で代替せずに示すため。
- issue: 民の不平の究極的な対象
  choice: モーセたちではなくヤハウェに対する不平
  alternative: モーセたちへの不平でもあると補足する
  rationale: 節末の明瞭な対比をそのまま保ち、解釈的な限定や補足を加えなかった。
- issue: בִּשְׁמֹעַの関係
  choice: 供給の理由として「聞いておられるので」
  alternative: 時を表す「聞かれるとき」
  rationale: 文脈では肉とパンの供給が民の不平を聞かれたことへの応答として語られている。ただし形態上は時間的にも取り得るため、過度な神学的説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神名とモーセの叱責にふさわしい品位を保った。「いったい私たちは何者なのか」で原文の修辞的な問いを自然に再現した。
