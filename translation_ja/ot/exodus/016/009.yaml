  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: ja
  text: そこでモーセはアロンに言った。「イスラエルの民の全会衆にこう言いなさい。『ヤハウェの前に近づきなさい。ヤハウェがあなたがたの不平を聞かれたからだ。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、文脈上の順序を自然に示す現代日本語で表した。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民の全会衆
  rationale: עֵדָהの共同体・集会としての意味を「会衆」で保ち、בְּנֵי יִשְׂרָאֵלは日本語で自然な「イスラエルの民」とした。
- source_word: קִרְבוּ
  choice: 近づきなさい
  rationale: 複数形命令であり、主の御前へ接近するよう求める語義を簡潔に表す。
- source_word: לִפְנֵי יְהוָה
  choice: 主の前に
  rationale: לִפְנֵיの空間的・臨在的な意味を「前に」で保持し、神名は日本語聖書で広く理解される「主」とした。
- source_word: שָׁמַע
  choice: 聞かれた
  rationale: 完了した行為が現在の召集理由となっていることを、自然な日本語の過去形と尊敬表現で示した。
- source_word: תְּלֻנֹּתֵיכֶם
  choice: あなたがたの不平
  rationale: 荒野での不満やつぶやきを表す語であり、反抗的な含みを過度に強めず、現代語として明瞭な「不平」を選んだ。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主（脚注で「ヤハウェ」）
  alternative: ヤハウェ
  rationale: 本文では日本語読者に定着した「主」を用いながら、原文が称号ではなく固有の神名יהוהであることを脚注で明示した。
