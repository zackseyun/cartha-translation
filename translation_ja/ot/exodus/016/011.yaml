base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェ[a]はモーセにこう語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な代替訳を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語られた
  rationale: דברの発話を表す意味を保ちつつ、神を主語とする文にふさわしい、自然で品位ある現代日本語とした。接続形は物語の次の出来事として文脈上自然に続くため、機械的に「そして」を加えなかった。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名YHWHを一般的な日本語表記で示した。伝統的訳語は脚注に掲げた。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 前置詞אֶלが示す発話の相手を、自然な日本語の助詞「に」で表した。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後続する直接話法を導く定型句であるため、日本語では「こう」によって簡潔かつ自然に示した。「言って」と重ねるよりも現代日本語として明瞭である。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を直接用いているため、本文では固有名として音写した。一方、日本語聖書で伝統的な「主」という訳し方も脚注で明示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「こう語られた」により、発話動詞と後続の引用を導くלֵאמֹרを、日本語で冗長にならない形にまとめた。
