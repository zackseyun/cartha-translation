base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: ja
  text: そこにあかしの箱[b]を置き、垂れ幕[a]でその箱を覆い隠しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隔ての幕」とも訳せる。ヘブライ語は、幕屋の内部であかしの箱を隔てて見えなくする幕を指す。
    reason: lexical_alternative
  - marker: b
    text: 「契約の箱」と訳されることもあるが、ここのヘブライ語は直訳すると「あかしの箱」。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ שָׁם
  choice: そこに……を置き
  rationale: 幕屋を組み立てる一連の指示として、接続詞付き完了形を自然な命令形で訳した。「そこに」は直前の文脈が示す場所を限定せずに保つ。
- source_word: אֲרוֹן הָעֵדוּת
  choice: あかしの箱
  rationale: עֵדוּת はここでは「契約」ではなく「あかし」を意味するため、原文の語を保った。「箱」は אֲרוֹן の具体的意味を明瞭に伝える。
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: その箱を仕切り
  rationale: סכך は覆う、遮るという意味を持つが、この箇所では垂れ幕を箱の上に掛けるのではなく、垂れ幕によって箱を隔てて見えなくする空間的機能を表すため、「仕切る」とした。
- source_word: הַפָּרֹכֶת
  choice: 垂れ幕
  rationale: 幕屋内部であかしの箱を隔てる幕を指す。現代日本語で具体物と機能が分かりやすい「垂れ幕」を本文に採用し、伝統的な「垂れ幕／幕」に関わる説明を脚注に示した。
theological_decisions:
- issue: אֲרוֹן הָעֵדוּת の訳語
  choice: あかしの箱
  alternative: 契約の箱
  rationale: ヘブライ語本文は עֵדוּת（あかし）と明記しているため、よく知られた「契約の箱」に調和させず、原文の表現を保持した。
- issue: פָּרֹכֶת の訳語
  choice: 垂れ幕
  alternative: 幕、隔ての幕
  rationale: 伝統的・神学的連想を一つの訳語で固定せず、幕屋内部を隔てる物という具体的意味を、現代の読者に理解しやすく示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。命令の連続性を「置き、……なさい」で自然に示した。「あかし」は聖書用語としての連続性を保つため平仮名表記とし、「仕切る」によって垂れ幕の空間的機能を明示した。
