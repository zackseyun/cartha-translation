  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: ja
  text: また、その周囲に庭を設け、庭の門に垂れ幕[a]を掛けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「仕切り幕」。ヘブライ語 מָסָךְ は、庭の入口に掛ける布を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 設け
  rationale: שׂים は広く「置く、据える」を意味するが、幕屋の庭を組み立てて配置する文脈では、「設ける」が自然であり、構造物を設置する意味を明確に伝える。
- source_word: הֶחָצֵר
  choice: 庭
  rationale: חָצֵר はここでは幕屋を囲む区画を指す。現代日本語では「庭」が簡潔で理解しやすく、幕屋に関する用語としても自然である。
- source_word: סָבִיב
  choice: 周囲に
  rationale: 幕屋の周りを取り囲む配置を表す副詞。「周囲に」によって包括的な取り囲みを簡潔に示す。
- source_word: וְנָתַתָּ
  choice: 掛けなさい
  rationale: נתן の基本義は「置く、据える」だが、入口の布製の仕切りを設置する文脈では、日本語の「掛ける」が対象物と自然に結びつく。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 幕屋関連の文脈で入口に掛ける布製の覆い・仕切りを指す。「垂れ幕」は形状と用途を過度に限定せず、現代日本語で具体的に伝える。
- source_word: שַׁעַר
  choice: 門
  rationale: שַׁעַר は庭への出入り口を指す。実体が布の仕切りであっても、入口の位置・構造を示す語として「門」が原語に直接対応する。
- source_word: שַׁעַר הֶחָצֵר
  choice: 庭の門
  rationale: 連語を自然な日本語の属格構文で表し、どの門であるかを明示する。
