  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: ja
  text: 第一の月の一日に、あなたは幕屋である会見の天幕[a]を建てなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には「会見の天幕の幕屋」とも訳せる。ヘブライ語は二つの聖所名称を直接結びつけており、同格とも、より緊密な属格的表現とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַחֹדֶשׁ הָרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: 第一の月の一日に
  rationale: ヘブライ語の日付表現を、意味を保ちながら自然な現代日本語にした。「第一の月」は暦年の最初の月、「一日」は月の第一日を指す。
- source_word: תָּקִים
  choice: 組み立てなさい
  rationale: קוםのヒフィル形は、ここでは幕屋を立てて設営することを命じる。「組み立てなさい」は携帯式聖所の設営を自然かつ明確に表す。
- source_word: מִשְׁכַּן
  choice: 幕屋
  rationale: 出エジプト記における携帯式聖所の定着した日本語訳であり、「住まい」という語源的含意を背景に持ちつつ、文脈上の施設を簡潔に示す。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神がモーセおよび民と会うための聖所という標準的な名称を表す。「会見の天幕」は意味が明確で、聖書用語としても認識しやすい。
theological_decisions:
- issue: מִשְׁכַּן と אֹהֶל מוֹעֵד の関係
  choice: 同格として「幕屋、すなわち会見の天幕」
  alternative: 結合の緊密さを反映して「会見の天幕の幕屋」
  rationale: 原文は二つの聖所名称を明示的な接続語なしに並べており、同格とも、属格的に緊密な表現とも取り得る。本文では同一の聖所を指すことが明瞭な同格表現を採り、別の構文理解を脚注に残した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、神の命令にふさわしい簡潔で端正な文体とした。「すなわち」により二つの名称が別個の建造物ではないことを明示しつつ、原文の構文上の曖昧さは脚注で保持した。
