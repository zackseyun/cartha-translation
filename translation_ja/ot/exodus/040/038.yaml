id: EXO.40.38
reference: Exodus 40:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: ja
  text: なぜなら、彼らのすべての旅程を通じて、昼にはヤハウェの雲が幕屋の上にあり、夜にはその中に火があり、イスラエルの全家の目の前にあったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: というのも……からである
  rationale: 直前の叙述を説明し締めくくる接続表現として、因果を過度に強めず、現代日本語で自然な説明構文とした。
- source_word: עֲנַן יְהוָה
  choice: ヤハウェの雲
  rationale: 構成関係を明確に示し、この雲がヤハウェの臨在と結び付いていることを、意味を付加せずに保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文の神名四文字を称号に置き換えず、一般的な日本語表記で音写した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における移動式の聖所を指す定着した訳語であり、文脈上も明確である。
- source_word: יוֹמָם / לַיְלָה
  choice: 昼には／夜には
  rationale: 原文の時間的対比と並行関係を、簡潔で自然な日本語で再現した。
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: 夜にはその中に火があって
  rationale: 前置詞 בְ の内在的な意味を保った。「その」が何を指すかは原文上確定しきれないため、本文では曖昧さを残した。
- source_word: לְעֵינֵי
  choice: 目の前に
  rationale: 「目に見えるところで」というヘブライ語の具体的な慣用表現を、自然な日本語として保った。
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: イスラエルの全家
  rationale: イスラエルを契約共同体として表す「家」という集合的表現を省略せずに残した。
- source_word: בְּכָל מַסְעֵיהֶם
  choice: 彼らの旅の全行程を通じて
  rationale: 個々の移動段階を含む מַסָּע の複数形と、全期間にわたる継続性を明確に表した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 称号へ置換せず、原文に記された契約の神名を音写した。
- issue: 夜の火がどこにあったか
  choice: 「その中」とし、指示対象を本文で限定しない
  alternative: 雲の中、幕屋の中（または上）
  rationale: 接尾代名詞 בּוֹ は文法上、男性名詞である「雲」と「幕屋」のいずれにも結び付き得る。文脈から雲を指す可能性は高いが、本文で断定せず原文の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書文体としての品位を保った。「イスラエルの全家」はやや荘重だが、原文の共同体的表現を保持するため採用した。
