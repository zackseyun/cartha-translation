  naturalness: 明瞭で自然な現代標準日本語である。「幕屋」「祭壇」「垂れ幕」は文脈にふさわしい、格調を保った語彙である。「こうして」の反復も不自然ではなく、叙述の連続と結語を表している。
  terminology: 「幕屋」はמִשְׁכָּןの定着した訳語、「祭壇」はמִזְבֵּחַの標準訳として適切である。「垂れ幕」はמָסַךְの織物の入口覆いという性格を伝え、扉状の固体物と誤解させない。「庭」は外庭を簡潔に表すが、当該文脈では十分明確である。
