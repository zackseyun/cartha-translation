base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: ja
  text: こうして彼は、幕屋と祭壇の周りに庭を設け、庭の門に垂れ幕を掛けた。こうしてモーセはその仕事を終えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 設け
  rationale: ヒフィル形は建造物などを立てる、設置する意。庭は幕そのものではなく囲われた区域全体を指すため、自然な日本語として「庭を設け」とした。
- source_word: הֶחָצֵר
  choice: 庭
  rationale: 幕屋と祭壇を囲む外庭を指す。文脈上明確で、現代日本語として簡潔な「庭」を採用した。
- source_word: סָבִיב לַמִּשְׁכָּן וְלַמִּזְבֵּחַ
  choice: 幕屋と祭壇の周りに
  rationale: 二つの対象を庭が取り囲む位置関係を、原文の構造に沿って明瞭に表した。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における移動式聖所を表す定着した日本語の宗教用語。
- source_word: וְלַמִּזְבֵּחַ
  choice: と祭壇
  rationale: מִזְבֵּחַ の標準的な訳語であり、幕屋と並ぶ庭の内部の対象として接続した。
- source_word: וַיִּתֵּן
  choice: 掛けた
  rationale: 字義的には「置いた」だが、入口の織物を所定の位置に取り付ける動作なので、日本語では「掛けた」が自然。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 入口を覆う織物を指す。「垂れ幕」は素材と機能の双方を自然に伝え、内側の「垂れ幕」との用語上の対応も保てる。
- source_word: שַׁעַר הֶחָצֵר
  choice: 庭の門
  rationale: 構文を素直に反映した。「門」は扉そのものに限定せず、庭への出入口を表す。
- source_word: וַיְכַל
  choice: 終えた
  rationale: 作業が完了したことを示す完了表現。現代日本語で簡潔かつ自然。
- source_word: הַמְּלָאכָה
  choice: その仕事
  rationale: 幕屋建設に関する一連の作業全体を指す。既知の作業であることを「その」で明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」を反復し、連続する動作と物語の締めくくりを表現した。原文に人名が現れるのは後半のみなので、前半は「彼」として照応関係を保った。
