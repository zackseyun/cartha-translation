  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: ja
  text: それから、あなたは聖別の油を取り、幕屋とその中にあるすべてのものに油を塗り、幕屋とそのすべての用具を聖別しなさい。こうして幕屋は聖なるものとなる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「聖なるもの」。ここでは「最も聖なるもの」とは記されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: それから、あなたは……を取り
  rationale: 接続詞を伴う完了形が一連の設営指示の次の手順を示すため、「それから」で順序を表し、日本語では後続の命令形にまとめた。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 油注ぎの油
  rationale: 「油」と「油注ぎ」を組み合わせた構文を明確に表し、聖所を聖別するための特定の油であることを保った。
- source_word: וּמָשַׁחְתָּ
  choice: 油を注ぎ
  rationale: 祭儀的な משׁח の行為を、現代日本語で理解しやすい「油を注ぐ」とした。単なる塗布ではなく、聖なる用途への指定に伴う行為を表す。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 荒野の聖所を指す定着した訳語であり、「住まい」よりも文脈上明確である。
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: その中にあるすべてのもの
  rationale: 幕屋内のものを包括的に指す原文を、範囲を狭めず自然に表した。
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: 幕屋……を聖別しなさい
  rationale: קדשׁ のピエル形が示す、聖なるものとして取り分ける行為を「聖別する」で表した。代名詞の指示対象を日本語で明瞭にするため「幕屋」を補い直した。
- source_word: וְאֶת כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: כְּלִי は器、道具、備品を広く指し得るため、幕屋に属する祭儀用品全般を含められる「用具」とした。
- source_word: וְהָיָה קֹדֶשׁ
  choice: こうして幕屋は聖なるものとなる
  rationale: 前段の聖別の結果を示す表現として訳した。קֹדֶשׁ は単に「聖なるもの」であり、最上級にはしなかった。
theological_decisions:
- issue: 油注ぎと聖別の後に示される幕屋の祭儀的身分
  choice: 幕屋は「聖なるもの」となる
  alternative: 幕屋は「最も聖なるもの」となる
  rationale: この節のヘブライ語は קֹדֶשׁ（聖なるもの）であり、קֹדֶשׁ קָדָשִׁים（最も聖なるもの）ではない。近接箇所や翻訳伝統から強意を持ち込まず、この節自体の表現を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。一連の指示を一つの命令文として自然にまとめ、祭儀用語は「幕屋」「聖別」を用いた。「油注ぎの油」は原語の構造と行為とのつながりを見える形で保つ訳語とした。
