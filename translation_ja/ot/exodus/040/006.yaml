  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: ja
  text: また、焼き尽くすささげ物の祭壇を、幕屋、すなわち会見の天幕の入口の前に置きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: また、…置きなさい
  rationale: נתןは広く「与える／置く／据える」を意味する。ここでは祭壇の配置を命じる文脈なので、現代日本語として自然な「置く」とし、接続詞וְは「また」で表した。
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物の祭壇
  rationale: מִזְבַּחは「祭壇」、עֹלָהは祭物をすべて焼き尽くすささげ物を指す。「全焼のささげ物」は祭儀的意味を明確にしつつ、単なる「焼いた供え物」との誤解を避ける。
- source_word: לִפְנֵי פֶּתַח
  choice: 入り口の前に
  rationale: לִפְנֵיの空間的意味「前に／正面に」と、פֶּתַחの「入り口／開口部」を簡潔で自然な日本語にした。
- source_word: מִשְׁכַּן
  choice: 幕屋
  rationale: 出エジプト記の聖所構造を指す定着した用語として「幕屋」を用いた。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神がモーセおよび民と会う場所を表す固定表現として、意味と聖書用語としての定着性を兼ねる「会見の天幕」とした。
theological_decisions:
- issue: מִשְׁכַּןとאֹהֶל מוֹעֵדの関係
  choice: 会見の天幕である幕屋
  alternative: 会見の天幕の幕屋
  rationale: 二つの聖所名称を同一の構造物を指す同格的表現として自然に読める形にした。ただし、ヘブライ語の連語をより形式的に取る余地を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令文は文脈に即して「置きなさい」とし、祭儀用語は説明的になりすぎない範囲で意味が伝わる表現を採用した。
