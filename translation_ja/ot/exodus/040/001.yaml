    issue: 「告げて言われた」は日本語として重複的で不自然である。
    rationale: 「告げる」と「言う」が同一の発話行為を重ねており、原文のדבר＋לֵאמֹרという定型を逐語的に二重化している。לֵאמֹרは後続の発話を導く機能なので、「こう」によって自然に表せる。
  - severity: low
    issue: 脚注の「エホバ」とも表記されるは、その性格をやや不正確に示す。
    rationale: 「エホバ」は単なる表記の異同というより、伝統的な読み・音写である。また、古代の正確な発音が確定していない点は保持するのが適切である。
  revised_text: ヤハウェはモーセにこう告げられた。
