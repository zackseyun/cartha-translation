lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: その時、…告げて
  rationale: ワウ継続法による物語の進行を「その時」で示し、דבר の定型的な神の発話導入を自然な日本語の「告げて」で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語יהוהを、称号に置き換えず一般的な推定発音で音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞אֶלを、日本語で自然な助詞「に」によって表した。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する直接話法を導く定型句。ヘブライ語の「言って」に近い構造を踏まえつつ、敬意を保った自然な日本語の発話導入とした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字の神名を用いていることを明示するため、本文では「ヤハウェ」とした。ただし正確な古代の発音は確定できないため、脚注でその点と別表記を示した。
translation_notes:
  register: 明瞭で現代的かつ荘重な叙述体。「告げて言われた」によりדברとלאמרの重なりを保持し、後続する神の直接話法への導入であることを示した。
