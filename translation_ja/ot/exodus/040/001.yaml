  rationale: 原文の定型的な「話して／言って」を、日本語で不自然な重複にせず、「こう告げられた」として後続する直接話法への導入を明示した。冒頭のワウは日本語で必ずしも「その時」と明示する必要がなく、余分な時間的限定を避けた。脚注は神名の原語表記と発音上の不確実性を保ちつつ、「エホバ」の位置づけを明確にした。
