lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 近づかせ
  rationale: קרבのヒフィル形が持つ使役の意味「近くに来させる」を保ち、祭儀の場へ進み出させる動作を簡潔に表す。
- source_word: אַהֲרֹן
  choice: アロン
  rationale: 日本語聖書で広く定着している人名表記を用いる。
- source_word: בָּנָיו
  choice: その子ら
  rationale: 文脈上はアロンの息子たちを指す。「子ら」は祭司として任命される一団を自然かつ簡潔に示す。
- source_word: פֶּתַח
  choice: 入り口
  rationale: 天幕へ出入りする開口部を、現代日本語で明確に表す。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: 神がご自身の民と会うために定められた聖所という語の機能を保ちつつ、日本語で定着した表現を採る。
- source_word: וְרָחַצְתָּ
  choice: 洗いなさい
  rationale: רחץの基本義を過度に限定せず、ここで命じられる祭儀的な洗浄を明確に表す。
- source_word: אֹתָם
  choice: 彼らを
  rationale: アロンとその子ら全員を受ける複数目的語であることを明示する。
- source_word: בַּמָּיִם
  choice: 水で
  rationale: 前置詞בを手段として捉え、水を用いて洗うことを自然な日本語で示す。
