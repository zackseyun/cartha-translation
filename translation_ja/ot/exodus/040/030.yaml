source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וַ/יִּתֵּ֥ן שָׁ֛מָּ/ה מַ֖יִם לְ/רָחְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/030.yaml
  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: ja
  text: 彼は、会見の天幕と祭壇との間に洗盤[a]を置き、洗うための水をそこに入れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「洗盤」は、幕屋で洗浄に用いられた大型の水盤を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 彼は……置き
  rationale: שׂוּםは物を所定の位置に据えることを表す。現代日本語として自然な「置く」を採用した。
- source_word: הַכִּיֹּר
  choice: 洗盤
  rationale: 幕屋での洗浄に用いる大型の水盤を指す。祭具としての性格と用語上の簡潔さを保つため「洗盤」とした。
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: 会見の天幕と祭壇との間に
  rationale: אֹהֶל מוֹעֵדを字義に即して「会見の天幕」とし、反復されるבֵּיןを自然な日本語の「AとBとの間」で表した。
- source_word: וַיִּתֵּן
  choice: 入れた
  rationale: נָתַןはここでは水を置く・入れる意。日本語では容器との関係を自然に示す「入れた」が適切である。
- source_word: שָׁמָּה
  choice: そこに
  rationale: 場所を示す副詞の意味をそのまま保ち、文脈上、洗盤を指す「そこに」とした。「その中に」よりも原文の表現に近い。
- source_word: מַיִם
  choice: 水
  rationale: 物質名詞として通常の「水」と訳した。
- source_word: לְרָחְצָה
  choice: 洗うための
  rationale: רָחַץの不定詞による目的表現。原文が洗う主体や対象を明示しないため、それらを補わず「洗うため」とした。
