source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אֶת הָ/אֹ֨הֶל֙ עַל הַ/מִּשְׁכָּ֔ן וַ/יָּ֜שֶׂם אֶת מִכְסֵ֥ה הָ/אֹ֛הֶל עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: そして彼は幕屋の上に天幕を広げ、その上に天幕の覆いを上から掛けた。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: 広げた
  rationale: פרשׂの基本的な動作である「広げる」を自然な日本語で表し、天幕を張るという解釈を過度に加えない。
- source_word: הָאֹהֶל
  choice: 天幕
  rationale: אֹהֶלの通常の意味を保ち、後続するמִכְסֶה「覆い」と区別する。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる住まいを指す定着した訳語で、אֹהֶל「天幕」との語彙上の区別も保てる。
- source_word: וַיָּשֶׂם
  choice: 掛けた
  rationale: 基本義は「置く」だが、構造物の上に覆いを設置する場面では「掛けた」が明瞭で自然である。
- source_word: מִכְסֵה הָאֹהֶל
  choice: 天幕の覆い
  rationale: 構文を素直に反映し、天幕そのものと、その外側の覆いとを区別する。
- source_word: עָלָיו מִלְמָעְלָה
  choice: その上を……上から
  rationale: עָלָיוの位置関係とמִלְמָעְלָהの「上から」をともに残す。日本語ではやや反復的だが、原文の空間表現を明示できる。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおり
  rationale: כַּאֲשֶׁרが示す命令との正確な一致を「とおり」で表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を称号に置き換えず、日本語で一般的な音写によって示す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いていることを明示し、称号への置換を避ける。「ヤハウェ」は現代日本語で広く認識される音写である。
translation_notes:
  register: 現代標準日本語による簡潔で格調ある叙述。「幕屋」と「天幕」と「覆い」の語彙的区別を保った。主語の「彼」は直前文脈のモーセを受けるが、この一節だけで固有名に置き換えず、原文の代名詞を維持した。
