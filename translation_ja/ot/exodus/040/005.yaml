  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: ja
  text: また、香をたくための金の祭壇[a]を証しの箱[b]の前に置き、幕屋の入口の幕を掛けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「香をたく金の祭壇」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「証しの箱」。伝統的には「契約の箱」とも訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 置きなさい
  rationale: נתןはここでは祭具を所定の位置に据えることを表す。現代日本語として自然な「置く」を用いた。
- source_word: מִזְבַּח הַזָּהָב
  choice: 金の祭壇
  rationale: 直訳的には「金の祭壇」。材質を明確に示しつつ、日本語で自然な表現とした。
- source_word: לִקְטֹרֶת
  choice: 香をたくための
  rationale: 前置詞לによる目的・用途を明示し、「香の祭壇」という慣用名だけに置き換えないようにした。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 祭壇と箱の空間的位置関係を簡潔に表す。
- source_word: אֲרוֹן הָעֵדֻת
  choice: あかしの箱
  rationale: עֵדֻתを「契約」ではなく原語どおり「あかし」と訳し、伝統的な別称を本文へ持ち込まない。
- source_word: וְשַׂמְתָּ
  choice: 掛けなさい
  rationale: מָסַךְが入口に設ける垂れ幕であるため、日本語では単なる「置く」よりも設置動作を自然に表す「掛ける」とした。
- source_word: מָסַךְ הַפֶּתַח
  choice: 入口の垂れ幕
  rationale: מָסַךְは幕屋の入口を覆う掛け布を指す。「垂れ幕」は奥の仕切りの幕と区別しながら形状と用途を伝える。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋の
  rationale: 句全体の関係を自然な日本語の連体修飾「幕屋の入口」として表した。
theological_decisions:
- issue: אֲרוֹן הָעֵדֻתにおけるעֵדֻתの訳
  choice: あかしの箱
  alternative: 契約の箱
  rationale: この節のヘブライ語はבְּרִית（契約）ではなくעֵדֻת（あかし）を用いるため、原語の名称を本文に保持した。伝統的な名称は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令の継続を「また」で示し、二つの動作を「置き」「掛けなさい」で自然につないだ。「あかし」は幕屋用語としての連続性を保つため平仮名表記とした。
