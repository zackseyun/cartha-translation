  naturalness: 「会見の天幕に入るたび、また祭壇に近づくたびに、身を洗った」は明瞭で自然な現代標準日本語であり、反復する二つの状況の並行も保たれている。後半を独立文にした「ヤハウェがモーセに命じたとおりであった」も、祭儀規定に沿う叙述として自然である。
  terminology: 「会見の天幕」「祭壇」「ヤハウェ」「モーセ」は一貫して適切である。神名を「ヤハウェ」とする方針は原文のיהוהを固有名として保持している。
