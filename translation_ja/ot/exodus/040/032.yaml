  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼らは、会見の天幕に入るたび、また祭壇に近づくたびに、身を洗った。ヤハウェがモーセに命じたとおりであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: 彼らは、会見の天幕に入るたび
  rationale: 前置詞בְּと不定詞連語に三人称男性複数接尾辞が付いた時間表現。文脈上、祭司たちの反復される行為を示すため「入るたび」とした。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: イスラエルと神との会見の場である幕屋を指す定着した明瞭な表現。
- source_word: וּבְקָרְבָתָם
  choice: また祭壇に近づくたびに
  rationale: בְּとקרבの不定詞連語による時間表現で、祭壇へ近寄る反復的な動作を表す。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: 定冠詞を伴い、幕屋に属する特定の祭壇を指す。日本語では文脈上、冠詞相当語を加えなくても特定性が明らかである。
- source_word: יִרְחָצוּ
  choice: 身を洗った
  rationale: 未完了形は過去の物語における習慣的行為を表す。「身を」は再帰的な洗浄を自然な日本語で示し、具体的な身体部位は本文に補わない。
- source_word: כַּאֲשֶׁר
  choice: とおりであった
  rationale: 先に与えられた命令への一致を自然かつ明確に示す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 洗浄が、すでにモーセに与えられていた命令に従う行為であることを文脈が示す。日本語では単純過去が自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名יהוהを音写して保持する。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: צוהの構文ではאֶתが命令を受ける人物を示すため、日本語では「モーセに命じた」と表す。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名יהוהを用いているため、称号「主」に置換せず「ヤハウェ」と音写した。「エホバ」よりも原語の推定発音を反映する一般的な形を採った。
- issue: 洗った対象の明示
  choice: 身を洗った
  alternative: 手と足を洗った／洗った
  rationale: 直前の文脈では手足が対象だが、本節自体は目的語を明示しない。そのため具体的な部位を補わず、動詞の再帰的な意味を自然な日本語で表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀的文脈にふさわしい簡潔で格調ある叙述とした。「入るたび」「近づくたび」により反復性を明示し、二つの時間節の並行性を保った。
