  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: ja
  text: モーセは、ヤハウェ[a]が彼に命じたすべてのことを行った。そのとおりに行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。
    reason: 神名の原語表記と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: עשהは「する／作る」を広く意味するが、ここでは命令への服従を述べるため、「行った」が自然である。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着している人名表記。
- source_word: כְּכֹל
  choice: すべてのことに従って
  rationale: 前置詞כとכֹלの組み合わせが表す、命じられた内容全体との一致を明確にする。
- source_word: אֲשֶׁר צִוָּה
  choice: 命じた
  rationale: 関係節として命令の内容を導く。ヘブライ語の完了形を日本語では自然な過去形で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: אֹתוֹ
  choice: 彼に
  rationale: צוהが人を直接目的語に取り「彼に命じる」という意味になるため、日本語では「彼に」と表す。指示対象はモーセ。
- source_word: כֵּן עָשָׂה
  choice: そのとおりに行った
  rationale: 命令と実行の完全な対応を再確認する反復表現を保つ。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名YHWHを用いていることを本文で示しつつ、伝統的な代替表記は脚注で知らせる。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文のעשהの反復を「行った……行った」と保持し、モーセが命令のすべてをそのとおり実行したという強調を再現した。
