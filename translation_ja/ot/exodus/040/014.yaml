  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: ja
  text: また、彼の息子たちを連れて来て、彼らに長い衣服[a]を着せなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「チュニック」「下着」とも訳せる。身体に着る基本的な衣服を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: また
  rationale: 接続詞と目的語標識が、前の命令に続く新たな指示を導入する。日本語では目的語標識を独立して訳さず、「また」で命令の連続を示した。
- source_word: בָּנָיו
  choice: 彼の息子たち
  rationale: 男性の子を指し、祭司職に就くアロンの息子たちという文脈にも合う。「子どもたち」と一般化しない。
- source_word: תַּקְרִיב
  choice: 近くに進ませ
  rationale: קרבのヒフィル形が持つ「近づける、近くに連れて来る」という使役的意味と、聖所での奉仕へ正式に進み出させる祭儀的含意を保つ。日本語として不自然になりすぎないよう「進ませ」とした。
- source_word: וְהִלְבַּשְׁתָּ
  choice: 着せなさい
  rationale: 「着るようにさせる」という使役の意味を、明瞭で自然な現代日本語で表す。
- source_word: אֹתָם
  choice: 彼らに
  rationale: 先行する「彼の息子たち」を受ける複数代名詞。日本語の「着せる」が取る対象として助詞「に」を用いた。
- source_word: כֻּתֳּנֹת
  choice: 長衣
  rationale: 身体に着る基本的な衣服を指す語。祭司の衣服という文脈に適した「長衣」とし、この節に明記されていない「亜麻布」を補わない。
theological_decisions:
- issue: קרבの祭儀的含意
  choice: 近くに進ませ
  alternative: 連れて来る／前に進み出させる
  rationale: 単なる移動とも正式な奉仕への提示とも読める語の幅を残しつつ、神の臨在に近づけて祭司として立たせる文脈上の響きを保持した。
- issue: כֻּתֳּנֹתの材質
  choice: 材質を補わず「長衣」とする
  alternative: 亜麻布の長衣
  rationale: この節自体には材質が明記されていないため、周辺文脈から「亜麻布」を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司任職の厳かな命令調を保った。「近くに進ませ」は原語の使役性と祭儀的な響きを両立させる表現である。
