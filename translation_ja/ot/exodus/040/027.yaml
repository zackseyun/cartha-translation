  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼はその上で香り高い香をたいた[a]。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「香料で作った香」または「芳しい香」。ヘブライ語は、香りのよい香料から作られた香を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: 香をたいた
  rationale: ヒフィル形は祭壇上で香や供え物を焼いて煙を立ち上らせる行為を表す。日本語では目的語と合わせて「香をたいた」が自然で明確。
- source_word: עָלָיו
  choice: その上で
  rationale: 男性単数の接尾辞は文脈上、直前に据えられた香の祭壇を指す。「その上で」は祭壇上で香をたくことを自然に示す。
- source_word: קְטֹרֶת סַמִּים
  choice: 香り高い香
  rationale: קְטֹרֶת は礼拝用の香、סַמִּים は芳香性の香料を指す。この連語を、原料の芳香性を保ちつつ自然な日本語で表した。
- source_word: כַּאֲשֶׁר
  choice: とおり
  rationale: 行為が神の命令に一致していたことを簡潔に示す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 先行する命令を指すが、日本語では過去完了を明示せず「命じた」で時間関係が自然に伝わる。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した、神聖四文字を示す尊称として用いる。本文の可読性と荘重さを保つ。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語で定着している固有名の表記。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 原文には神聖四文字がある。「主」は日本語聖書で広く認知された表記であり、特定の発音再建を本文で確定せず、尊称として自然に読める。一方、固有名を明示する訳として「ヤハウェ」も可能。
translation_notes:
  register: 明瞭で現代的かつ礼拝文にふさわしい格調を保った。「香り高い香」は多少同語反復に見えるが、קְטֹרֶת と סַמִּים の両要素を自然に保持する。
