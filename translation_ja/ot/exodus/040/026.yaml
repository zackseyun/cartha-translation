  text: וַ/יָּ֛שֶׂם אֶת מִזְבַּ֥ח הַ/זָּהָ֖ב בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵ֖י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: ja
  text: 彼は金の祭壇を会見の天幕の中、垂れ幕[a]の前に置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕切りの幕」とも訳せる。ヘブライ語では、幕屋の内部を仕切る幕を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 彼は……置いた
  rationale: 接続法ワウを伴う未完了形が、物語上の次の動作を示す。日本語では過去形「置いた」とし、動作主を「彼」で受けた。
- source_word: מִזְבַּח הַזָּהָב
  choice: 金の祭壇
  rationale: 直訳的には「金の祭壇」。自然な日本語であり、祭具の材質を明確に示す。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中
  rationale: אֹהֶל מוֹעֵד は神が民と会う聖所を指す定型表現。「会見の天幕」は語義と聖書内の用法を簡潔に保ち、בְּ の位置関係を「中」で明示する。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 垂れ幕を基準とする空間的位置を示すため、簡潔で自然な「前に」とした。
- source_word: הַפָּרֹכֶת
  choice: 垂れ幕
  rationale: 幕屋内部を仕切る特定の幕を指す。「垂れ幕」は物としての性質を自然に表しつつ、祭儀的な仕切りであることを文脈に委ねる。
theological_decisions:
- issue: הַפָּרֹכֶת の祭儀的用語
  choice: 垂れ幕
  alternative: 仕切りの幕
  rationale: 後代の聖書本文でも神の臨在への隔てとして重要になる語だが、ここではまず幕屋内部の具体的な幕を指す。「垂れ幕」はその物理的意味を保ち、神学的含意を説明的に加えすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の簡潔な叙述順序を維持し、祭具名には過度な言い換えを加えていない。
