  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: ja
  text: そして彼は、幕屋の入口に垂れ幕を掛けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幕屋の入口の幕」。
    reason: מָסַךְと、הַפֶּתַח לַמִּשְׁכָּןの関係を、入口に属する幕として表す別の自然な訳し方を示すため。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: そして彼は……掛けた
  rationale: שׂוּםは「置く、据える」を意味するが、入口の垂れ幕を目的語とする文脈では、設置する動作を自然な日本語で「掛けた」と表した。
- source_word: מָסַךְ
  choice: 垂れ幕
  rationale: 幕屋の入口に用いる掛け布を指す。奥を隔てる「垂れ幕」（פָּרֹכֶת）との語彙上の違いを意識しつつ、入口を覆う布であることが伝わる現代日本語を選んだ。
- source_word: הַפֶּתַח
  choice: 入口
  rationale: פֶּתַחは開口部または入口を指し、ここでは幕屋に入る場所なので「入口」が自然である。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋の
  rationale: 前置詞לはここでは「入口」と幕屋との関係を示すため、日本語では自然な連体修飾「幕屋の入口」とした。
