  text: וְ/נָֽתַתָּ֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וְ/נָתַתָּ֥ שָׁ֖ם מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: ja
  text: 洗盤を会見の天幕と祭壇との間に置き、そこに水を入れなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 置き
  rationale: נתןは広く「与える、置く、据える」を意味する。祭具の位置を定める指示なので、現代日本語として自然な「置く」とした。
- source_word: הַכִּיֹּר
  choice: 洗盤
  rationale: כִּיּוֹרは幕屋で洗い清めに用いる水を入れる器を指す。単なる「たらい」より祭具としての用途が明確で、日本語聖書で理解されやすい「洗盤」とした。
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: 会見の天幕と祭壇との間に
  rationale: בֵּין...וּבֵיןの二者間を示す構文をそのまま反映した。「会見の天幕」はאֹהֶל מוֹעֵדの語義を透明に伝える。
- source_word: הַמִּזְבֵּחַ
  choice: 祭壇
  rationale: מִזְבֵּחַの通常の意味。本文には祭壇の種類をさらに限定する表現がないため、補足を加えない。
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: そこに水を入れなさい
  rationale: 直訳的には「そこに水を置け」だが、日本語では容器に水を供える動作を「水を入れる」と表すのが自然である。「そこに」によりשָׁםを明示し、文脈上は洗盤を指すことを保った。
theological_decisions: []
translation_notes:
  register: 律法上の指示にふさわしい簡潔で端正な命令文とした。接続する二つのוְנָתַתָּは、日本語では「置き、…入れなさい」と一文にまとめ、反復的な指示の流れを自然に表した。
