source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: ja
  text: 全焼のささげ物の祭壇と、そのすべての用具に油を注ぎ、祭壇を聖別しなさい。祭壇は最も聖なるもの[a]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「聖なるものの中の聖なるもの」。最高度の聖性を表す最上級的な言い回し。
    reason: 原語の慣用表現と直訳を示すため。
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 油を注ぎ
  rationale: 幕屋祭儀の文脈における משׁח は、聖別のために油を用いる行為を指す。現代日本語で自然かつ具体的な表現とした。
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のささげ物の祭壇
  rationale: עֹלָה はささげ物を全体として焼く犠牲を指す。「全焼のささげ物」はその性格を明確にし、構文上も祭壇との関係を保つ。
- source_word: כָּל כֵּלָיו
  choice: そのすべての用具
  rationale: כֵּלִים は祭壇に付属する器具類の総称であり、「用具」は特定の材質や形状に限定せず、平明に表せる。
- source_word: וְקִדַּשְׁתָּ
  choice: 聖別しなければならない
  rationale: קדשׁ の使役的意味、すなわち祭儀のために聖なるものとして取り分けることを表す。命令的な完了形の連続を、日本語では義務表現で示した。
- source_word: וְהָיָה
  choice: こうして……となる
  rationale: 油注ぎと聖別の結果として生じる状態を示すため、単なる未来よりも結果関係が自然に伝わる表現を採った。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 最も聖なるもの
  rationale: 字義的には「聖なるものの中の聖なるもの」という最上級的表現である。場所としての至聖所との混同を避けつつ、最高度の聖性を示す。
theological_decisions:
- issue: 祭儀的聖性を表す קֹדֶשׁ קָדָשִׁים の訳し方
  choice: 最も聖なるもの
  alternative: 至聖のもの／聖なるものの中の聖なるもの
  rationale: ここでは内陣の名称ではなく、祭壇が帯びる最高度の聖性を述べている。「最も聖なるもの」はその意味を明確にし、空間的な意味を不必要に持ち込まない。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある祭儀文体とした。「全焼のささげ物」は意味の透明性を優先し、「燔祭」のような古語は避けた。原文の二つの動作と、その結果としての祭壇の聖性を文の流れに反映した。
