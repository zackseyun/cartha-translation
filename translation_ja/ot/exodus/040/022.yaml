  text: וַ/יִּתֵּ֤ן אֶת הַ/שֻּׁלְחָן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן צָפֹ֑נָ/ה מִ/ח֖וּץ לַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: ja
  text: 彼は机を会見の天幕の中、幕屋の北側、垂れ幕[a]の外に置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「垂れ幕」は、至聖所を仕切って見えないようにする内側の幕。別訳「仕切り幕」。
    reason: פָּרֹכֶתが一般的な幕ではなく、至聖所を隔てる内側の仕切りを指すことを明らかにし、可能な訳語も示すため。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 置いた
  rationale: נתןは広く「与える、置く」を意味するが、ここでは祭具の配置を述べるため、「置いた」が自然で正確。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 原文は定冠詞付きの「机」とだけ記しており、パンなどの説明を本文に補わない。「机」は幕屋の祭具を指す語として明瞭。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中
  rationale: אֹהֶל מוֹעֵדという聖所の名称を簡潔に保ち、בְּの内部位置を「中」で明示する。
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: 幕屋の北側
  rationale: יֶרֶךְの「側、わき」と、方向を示すצָפֹנָהを自然な日本語の位置表現にまとめた。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所建築を指すמִשְׁכָּןの定着した訳語であり、「住まい」という語源的意味より、この文脈での具体的な指示対象が明瞭。
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: 垂れ幕の外
  rationale: מִחוּץの空間的な「外」をそのまま示す。פָּרֹכֶתは至聖所を隔てる内側の幕であり、「垂れ幕」は具体物を自然に表す。
