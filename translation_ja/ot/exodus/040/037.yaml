  text: וְ/אִם לֹ֥א יֵעָלֶ֖ה הֶ/עָנָ֑ן וְ/לֹ֣א יִסְע֔וּ עַד י֖וֹם הֵעָלֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/037.yaml
  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: ja
  text: しかし、雲が上がらないときは、彼らは雲が上がる日まで[a]出発しなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その上る日まで」。「その」は雲を指す。
    reason: 原文の不定詞構文と三人称男性単数接尾辞が雲を指すことを示すため。
lexical_decisions:
- source_word: וְאִם
  choice: しかし、～ときは
  rationale: 前節の「雲が上がると旅立った」という場合と対照をなす条件を、自然な現代日本語で示した。
- source_word: לֹא יֵעָלֶה הֶעָנָן
  choice: 雲が上がらない
  rationale: עלהは「上る、上がる」の意。幕屋の上から雲が移動の合図として上昇する文脈に即し、雲について自然な「上がる」とした。受動的な「取り上げられる」という意味までは加えていない。
- source_word: וְלֹא יִסְעוּ
  choice: 彼らは旅立たなかった
  rationale: נסעは宿営地から移動を開始することを表すため、「旅をした」ではなく、出発の動作が明確な「旅立った」とした。接続詞は日本語では明示せず、自然な帰結として表現した。
- source_word: עַד יוֹם הֵעָלֹתוֹ
  choice: 雲が上がる日まで
  rationale: 「その上がる日まで」に相当する表現。三人称男性単数の接尾辞が指す対象を「雲」と明示し、自然で誤解のない日本語にした。「日」は原文どおり保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節との対照を「しかし」で示し、同じ動詞を反復して、雲の上昇が出発の条件であるという原文の構造を保った。
