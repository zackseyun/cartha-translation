  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: ja
  text: 洗盤とその台に油を注ぎ、それを聖別しなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 油を注ぎ
  rationale: משׁחは幕屋の祭儀的文脈で、聖なる用途のために油を注ぐ行為を表す。「油を注ぐ」は現代日本語で動作を明確に伝える。語頭の接続詞は、命令が連続する日本語の自然な表現に含めた。
- source_word: הַכִּיֹּר
  choice: 洗盤
  rationale: כִּיּוֹרは幕屋で洗浄に用いる大型の器を指す。「洗盤」は一般的な「たらい」より祭具としての性格を保ちつつ、簡潔に表せる。
- source_word: כַּנּוֹ
  choice: その台
  rationale: כֵּןはここでは洗盤を支える構造物を指す。「台」が明瞭で自然であり、「台座」も可能だが、本文では簡潔な語を採った。
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: それを聖別しなさい
  rationale: קדשׁのピエル形は、祭儀において聖なる用途のために取り分けることを表す。「聖別する」は道徳的変化ではなく祭具の奉献を適切に示す。単数代名詞は原文どおり「それ」とし、指示範囲を過度に限定しない。
theological_decisions:
- issue: 幕屋の祭儀的文脈における קדשׁ の訳
  choice: 聖別する
  alternative: 聖なるものとする／清めてささげる
  rationale: ここで扱われるのは祭具を聖なる用途のために取り分ける行為であり、道徳的変容ではない。「聖別する」はこの祭儀的意味を簡潔に保つ。
- issue: 単数代名詞 אֹתוֹ の指示範囲
  choice: 原文どおり単数の「それ」とする
  alternative: 洗盤とその台を聖別しなさい
  rationale: 文法上は単数で、中心となる洗盤、または台を伴う一体の祭具を指し得る。日本語でも単数表現を保ち、原文にない複数化によって曖昧さを解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭具名には「洗盤」、祭儀用語には「聖別する」を用い、古語的な命令形を避けて「しなさい」とした。
