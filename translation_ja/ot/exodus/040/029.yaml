    issue: 冒頭の「また彼は」
    rationale: 誤訳ではないが、現代標準日本語の語順としては「彼はまた」のほうが自然で、叙述の流れも明瞭になる。
  - severity: low
    issue: 末尾の「ヤハウェがモーセに命じたとおりである」
    rationale: 原文の「〜が命じたとおりに」という、直前の設置・献供行為を修飾する機能をより明示するため、「…とおりにした」とする。
