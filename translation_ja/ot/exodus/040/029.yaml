  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼はまた、全焼のいけにえの祭壇を会見の天幕である幕屋の入口に据え、その上に全焼のいけにえと穀物のささげ物を献げた。ヤハウェがモーセに命じたとおりにした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 全焼のいけにえの祭壇
  rationale: 祭壇を主な用途によって特定する連語。עֹלָהの祭儀的意味を保ちつつ、現代日本語で明確に表した。
- source_word: שָׂם
  choice: 据え
  rationale: 幕屋の備品を所定の場所に設置する文脈に合い、「置く」よりも固定的な設置を自然に示す。
- source_word: פֶּתַח
  choice: 入口に
  rationale: 開口部・入口を指す語であり、祭壇の位置を簡潔かつ自然に表す。
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: 会見の天幕である幕屋
  rationale: 連続する二つの聖所名称を保持し、ここでは同一施設を示す関係として自然な日本語にした。
- source_word: וַיַּעַל עָלָיו
  choice: その上に……を献げた
  rationale: עלהは祭儀文脈で供え物を献げることを表す。「その上に」によって祭壇が献供の場所であることも保持した。
- source_word: הָעֹלָה
  choice: 全焼のいけにえ
  rationale: 供え物を全体として焼く祭儀を示す専門語として、意味の分かる日本語を選んだ。
- source_word: הַמִּנְחָה
  choice: 穀物のささげ物
  rationale: מִנְחָהは一般には贈り物も意味するが、祭司文書のこの文脈では穀物による供え物を指す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 先に与えられた命令への正確な服従を示す定型句として訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: ヘブライ語本文が固有名を明記しているため、称号「主」で代替せず音写した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祭儀用語は普通の読者にも意味が伝わる表現を用い、原文の二つの聖所名称と動作の順序を保持した。
