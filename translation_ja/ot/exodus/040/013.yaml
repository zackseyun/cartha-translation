  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: ja
  text: アロンに聖なる衣服を着せ、彼に油を注いで聖別しなさい。こうして彼は、わたしに祭司として仕える[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「そして彼は、わたしに祭司として仕える」。文脈上、先行する行為の結果、または目的を表すとも理解できる。ヘブライ語の動詞は、祭司の務めを果たすことを意味する。
    reason: 三人称の原文表現を保持しつつ、接続詞が取り得る結果・目的の関係と、כהןの職務的意味を示すため。
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: 着せ
  rationale: לבשׁのヒフィル形は、モーセがアロンに衣服を着用させることを表す。「着せる」は現代日本語で自然な使役表現である。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 聖なる装束
  rationale: 直訳的には「聖の衣服」。「聖なる」は祭儀のために取り分けられた性格を保ち、「装束」は祭司の一式の衣服にふさわしい格調と分かりやすさを備える。
- source_word: וּמָשַׁחְתָּ
  choice: 油を注いで
  rationale: משׁחは祭司任職の儀礼として油を用いることを指す。目的語を補った「油を注ぐ」は日本語で明確であり、後続の聖別とは区別している。
- source_word: וְקִדַּשְׁתָּ
  choice: 聖別しなさい
  rationale: קדשׁのピエル形は、聖なる務めのために取り分けることを表す。「聖別する」は儀礼的任命の意味を保ち、「任命する」へ一般化しない。
- source_word: וְכִהֵן
  choice: 祭司として仕える
  rationale: כהןは単に祭司の身分になることより、祭司職を務める・祭司として奉仕することを表す。
- source_word: לִי
  choice: わたしに
  rationale: 奉仕が主に向けられることを示す与格的な前置詞を、直接的に「わたしに」と訳した。
theological_decisions:
- issue: 祭司任職を表す一連の行為
  choice: 着衣、油注ぎ、聖別、祭司としての奉仕をそれぞれ区別して訳す。
  alternative: 一連の行為を「祭司に任命する」などにまとめる。
  rationale: ヘブライ語が個別に挙げる儀礼行為とその結果を保ち、後代の教会的な任職概念を持ち込まないため。
- issue: וְכִהֵן לִי の統語的な力
  choice: 「こうして彼は、わたしに祭司として仕える」と、先行する行為の結果を帯びた並列的叙述として訳す。
  alternative: 「彼がわたしに祭司として仕えるようにしなさい」と、目的を明示して訳す。
  rationale: 三つの二人称動詞から三人称動詞への移行を保ちつつ、接続詞が示し得る結果関係を「こうして」で自然に表した。目的・結果の読みも可能なので脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「衣」より具体的で祭儀的一式を想起させる「装束」を用い、命令の連鎖は読点と文の区切りで読みやすくした。神の一人称は「わたし」とした。
