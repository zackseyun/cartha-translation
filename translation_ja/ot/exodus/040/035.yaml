  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: ja
  text: モーセは会見の天幕に入ることができなかった。雲がその上にとどまり[a]、ヤハウェの栄光が幕屋を満たしていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宿っていた」とも訳せる。ヘブライ語の動詞には、ある所に落ち着くことや、そこに宿ることの含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל מֹשֶׁה
  choice: モーセは…入ることができなかった
  rationale: 能力の否定を明示しつつ、現代日本語として自然な形にした。文頭の接続詞は、日本語では前後関係が明らかなため逐語的に「そして」とせず、自然な物語の継続として表した。
- source_word: לָבוֹא אֶל אֹהֶל מוֹעֵד
  choice: 会見の天幕に入る
  rationale: 構造物の内部へ行く意味を「入る」で表し、אֹהֶל מוֹעֵדは幕屋内の特定の天幕を指す伝統的かつ明瞭な「会見の天幕」とした。
- source_word: כִּי
  choice: …からである
  rationale: モーセが入れなかった理由を示す因果関係を、明瞭な現代日本語で表した。
- source_word: שָׁכַן עָלָיו הֶעָנָן
  choice: 雲がその上にとどまり
  rationale: 雲が天幕の上に落ち着いて留まる具体的な情景を表す。「宿る」「住む」という含意もあるため脚注で示した。
- source_word: וּכְבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: כָּבוֹדの神学的重みを「栄光」で保ち、יהוהは称号に置き換えず固有名「ヤハウェ」とした。
- source_word: מָלֵא אֶת הַמִּשְׁכָּן
  choice: 幕屋を満たしていた
  rationale: モーセが入れない理由となっている、その時点での充満した状態を自然な日本語で表した。מִשְׁכָּןは出エジプト記の移動式聖所を指す定着した訳語「幕屋」とした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された契約の神の固有名を、称号へ置き換えず音写して保持した。
- issue: שָׁכַןと神の臨在・居住という主題との関係
  choice: とどまり
  alternative: 宿り、住み
  rationale: 後の「住まう」という神学的響きを排除はしないが、ここではまず雲が天幕の上に落ち着いて留まる目に見える情景を優先した。別の含意は脚注に残した。
- issue: 「栄光が幕屋を満たした」の時制・相
  choice: 満たしていた
  alternative: 満たした
  rationale: ヘブライ語の完了形は出来事として「満たした」とも訳せるが、この節ではモーセが入れなかった理由となる結果状態が前景化されているため、日本語では「満たしていた」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「会見の天幕」と「幕屋」を区別し、原文の二つの呼称を保った。脚注記号は該当語句の直後に置いた。
