source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: ja
  text: すると、雲が会見の天幕を覆い、ヤハウェ[a]の栄光が幕屋に満ちた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「主」と訳される。ヘブライ語には神の名 יהוה（YHWH）がある。
    reason: 神名の表記と伝統的な代替訳を示すため。
lexical_decisions:
- source_word: וַיְכַס
  choice: すると、……覆い
  rationale: 動詞 כסה の基本義「覆う」を保ち、物語を進める接続形 וַ־ は、直前の出来事を受ける自然な日本語「すると」で表した。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 定冠詞を伴い、出エジプト記の文脈ですでに知られている特定の雲を指す。日本語では文脈上明確なため、冠詞に相当する語を加えず「雲」とした。
- source_word: אֹהֶל מוֹעֵד
  choice: 会見の天幕
  rationale: אֹהֶל「天幕」と מוֹעֵד「定められた時・会合」の連語を、礼拝のため神と会う場所という機能を保って訳した。後半の מִשְׁכָּן「幕屋」との語の違いも保持した。
- source_word: כְבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: כָּבוֹד が表す、神の威光と現臨が目に見える形で現れたという含みを、簡潔で定着した「栄光」で表した。神名は称号に置き換えず音写した。
- source_word: מָלֵא
  choice: 満ちた
  rationale: ここではヤハウェの栄光が幕屋全体を満たしたことを表す。日本語では自動詞「満ちた」が自然であり、ヘブライ語の叙述の簡潔さも保つ。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所の構造物を指す術語として「幕屋」を用いた。「会見の天幕」と関連しつつも、原文の別語を訳し分けた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を明記しているため、主本文では固有名として「ヤハウェ」と音写した。伝統的な代替表記「主」があることは脚注で示し、神名と称号の区別を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会見の天幕」と「幕屋」を訳し分け、原文の具体的な雲の描写と、ヤハウェの栄光が満ちるという神学的表現を説明的に言い換えず保持した。
