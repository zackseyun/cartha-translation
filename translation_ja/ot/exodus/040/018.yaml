  text: וַ/יָּ֨קֶם מֹשֶׁ֜ה אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּתֵּן֙ אֶת אֲדָנָ֔י/ו וַ/יָּ֨שֶׂם֙ אֶת קְרָשָׁ֔י/ו וַ/יִּתֵּ֖ן אֶת בְּרִיחָ֑י/ו וַ/יָּ֖קֶם אֶת עַמּוּדָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: ja
  text: こうしてモーセは幕屋を組み立て、その台座[a]を据え、枠板[b]を立て、横木を取り付け、その柱[c]を立てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「台座」は、幕屋の枠板をはめ込んで支える基礎部材。「受け台」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「板」とも訳せるが、ここでは幕屋を形作る直立した構造部材を指す。
    reason: lexical_alternative
  - marker: c
    text: 「柱」は「支柱」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 組み立てた／立てた
  rationale: ヒフィル形で「立たせる、設置する」の意。幕屋全体には自然な「組み立てた」を用い、柱には「立てた」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 語義は「住まい、住む所」だが、出エジプト記では移動式の聖所を指す定着した訳語「幕屋」が明確である。
- source_word: אֲדָנָיו
  choice: その台座
  rationale: 枠板を支え、はめ込む基礎部材を指す。「台座」は機能が分かりやすく、過度に専門的でない。
- source_word: קְרָשָׁיו
  choice: 枠板
  rationale: 語自体は「板」と訳せるが、ここでは幕屋の直立した構造部材。「枠板」は板状の形と骨組みとしての役割の双方を伝える。
- source_word: בְּרִיחָיו
  choice: 横木
  rationale: 枠板同士をつなぎ留める横方向の棒材を指すため、日本語の建築語として明瞭な「横木」とした。
- source_word: עַמּוּדָיו
  choice: その柱
  rationale: 直立した支持材を表す標準的で品位ある語。「支柱」や「柱材」より簡潔である。
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: 据え／立て／取り付け
  rationale: いずれも文脈上、構造部材を所定の位置に置く動作。各部材に即した自然な日本語を使い分け、組み立ての順序を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、幕屋建設の工程を示す一連の動詞を保った。「据える」「取り付ける」により、直訳調の反復を避けつつ各部材の設置方法を自然に表現した。
