  text: וַ/יַּ֥עַל הַ/נֵּרֹ֖ת לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼はヤハウェの前で、ともしびをともした[a]。ヤハウェがモーセに命じたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ともしびを上らせた」。ともしびを備えること、または火をともすことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ともした
  rationale: עלהのヒフィル形は字義的には「上らせた」だが、נרותを目的語とする祭儀的文脈では、ともしびをともして炎を上げることを表し得る。直前の40:24で燭台の設置がすでに述べられているため、ここでは点灯を指すと理解するのが文脈上最も自然。ただし語そのものが持つ表現を脚注に残す。
- source_word: הַנֵּרֹת
  choice: ともしび
  rationale: נֵרֹתは燭台に備わる個々の灯火・ランプを指す。日本語では点灯という動作と自然に結びつき、祭儀的な品位も保つ「ともしび」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵיの空間的・祭儀的意味である「〜の前で／御前で」を保持しつつ、明瞭な現代日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
- source_word: כַּאֲשֶׁר
  choice: 〜とおり
  rationale: 先の命令への一致・順守を自然な日本語で明確に表す。
- source_word: צִוָּה
  choice: 命じた
  rationale: 完了形は物語中の行為に先立つ命令を指すが、日本語では「命じたとおり」で時間関係が自然に伝わるため、過度に説明的な過去完了表現を避けた。
- source_word: אֶת מֹשֶׁה
  choice: モーセに
  rationale: אֵתは形式上直接目的語を示すが、日本語の「命じる」は命令を受ける人物を助詞「に」で示すのが自然。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を用いていることを明示し、称号への置換を避ける。
- issue: וַיַּעַל הַנֵּרֹת が設置か点灯か
  choice: ともしびをともした
  alternative: ともしびを備えた／上らせた
  rationale: 直前の40:24ですでに燭台の設置が記されており、本節はその灯火を点じる行為と読むのが文脈上自然。ただしヘブライ語の字義と解釈の幅は脚注で明示する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。文脈上の点灯を本文に採りつつ、原語の字義と曖昧さを脚注に保持した。
