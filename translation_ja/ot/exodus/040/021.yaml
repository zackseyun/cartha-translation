  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼は箱を幕屋の中に運び入れ、仕切り幕[a]を掛けて、あかしの箱を見えないように仕切った[b]。ヤハウェがモーセに命じたとおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「覆いの垂れ幕」または「仕切る垂れ幕」。垂れ幕そのものと、それが内部を遮って見えないようにする働きの両方を表す語が重ねられている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「覆った」「あかしの箱を覆い隠した」。原語の動詞は、垂れ幕によって箱を覆い、または見えないように遮ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֶת־הָאָרֹן אֶל־הַמִּשְׁכָּן
  choice: 彼は箱を幕屋の中に運び入れ
  rationale: 使役形のבואと方向を示すאֶלを、「運び入れ」によって簡潔かつ自然に表した。文脈上、主語はモーセであるが、ヘブライ語どおり代名詞で受けた。
- source_word: הָאָרֹן
  choice: 箱
  rationale: 祭儀用の聖なる箱を指す。日本語では「箱」が明快であり、後半の「あかしの箱」とも対応する。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における移動式聖所の慣用的で簡潔な訳語。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 仕切りの垂れ幕
  rationale: פָּרֹכֶתの垂れ幕と、מָסָךְが示す遮蔽・仕切りの機能を、自然な日本語で併せて表した。
- source_word: וַיָּשֶׂם
  choice: 掛け
  rationale: 一般には「置く」だが、垂れ幕を所定の位置に設置する動作として日本語では「掛け」が自然。
- source_word: וַיָּסֶךְ עַל
  choice: その垂れ幕で……覆い隠した
  rationale: 動詞が示す覆う・遮る働きと、עַלの空間的関係を保ちつつ、直前の垂れ幕が手段であることを日本語で明確にした。
- source_word: אֲרוֹן הָעֵדוּת
  choice: あかしの箱
  rationale: הָעֵדוּתを解釈的に「契約の板」などへ限定せず、出エジプト記の用語を「あかし」として保持した。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 反復される服従の定型句を端正な現代日本語で表し、神名は固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の四文字神名を称号に置き換えず、一般的な学術的再建に基づく固有名の音写で示した。
- issue: הָעֵדוּת の意味範囲
  choice: あかし
  alternative: 契約の板、証し
  rationale: この語は契約文書を指しうるが、本文自体の簡潔な呼称と神学的含意の幅を保つため、解釈を広げすぎない訳語を選んだ。
translation_notes:
  register: 明快な現代標準語を用いながら、聖所の叙述にふさわしい端正さを保った。「覆い隠した」により、垂れ幕と遮蔽する動詞との原文上の語義的な響き合いを自然な日本語で再現した。
