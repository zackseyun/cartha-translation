  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: ja
  text: 机を運び入れ、その上に置くものを整えなさい。また、燭台を運び入れ、そのランプを据えなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その灯火をともしなさい」。ヘブライ語の動詞は字義的には「上らせる」を意味し、炎を上らせる、すなわち灯火をともすことを指し得る。この節では幕屋を設営する一連の指示であるため、ランプを所定の位置に据える意味に取ることができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: 運び入れ
  rationale: בואのヒフィル形で、幕屋の設営という文脈では、備品を中へ運び込む動作を表す。日本語では「運び入れる」が方向と使役的な動きを自然に示す。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 語自体は一般名詞「机、食卓」であり、この節には供えのパンへの明示的な限定がないため、文脈上の情報を本文へ付加しない。
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: その上に置くものを整えなさい
  rationale: 動詞と同根名詞による「その配列を配列する」という構文を、机に属する規定の品々を秩序立てて置く意味として自然な日本語にした。具体的に「パン」と限定せず、原文の表現範囲を保った。
- source_word: הַמְּנֹרָה
  choice: 燭台
  rationale: 複数の灯火を載せる祭具を表す一般名詞として、音写ではなく、現代日本語で意味の通る伝統的かつ簡潔な訳語を用いた。
- source_word: וְהַעֲלֵיתָ
  choice: ともレしなさい
  rationale: עלהのヒフィル形は直訳すれば「上らせる」で、灯火については炎を上らせる、すなわち点火する意味に用いられる。40:25の実行記事もこの理解を支持する一方、設営の流れから灯器を据える意味に取る余地は脚注に残した。
- source_word: נֵרֹתֶיהָ
  choice: その灯火
  rationale: נֵרは灯器またはその炎を指し得る。点火を表す動詞との組み合わせに合わせて「灯火」とし、燭台に属する複数の灯りを日本語で自然に表した。
