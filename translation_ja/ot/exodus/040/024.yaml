  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: ja
  text: 彼は、会見の天幕の中、机の向かい側[a]、幕屋の南側に燭台を置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「机に面して」。ヘブライ語 נֹכַח は、何かの向かい、またはその正面に位置することを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 置いた
  rationale: שׂים の完了した叙述上の動作を、備品の配置に自然な現代日本語で表した。
- source_word: הַמְּנֹרָה
  choice: 燭台
  rationale: 単なるともしびではなく、聖所で用いる灯火用の台を指すため。日本語の聖書用語としても明瞭である。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 会見の天幕の中
  rationale: 神と人との会見の場所を表す定型的な聖所名称であり、מִשְׁכָּן（幕屋）との語の違いも保った。
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: 机の向かい
  rationale: נֹכַח が示す、机と相対する空間的位置を簡潔に表す。「机に面して」という含みも脚注に残した。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 原文は単に「机」としており、供えのパンとの関係を本文に補わない。
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן נֶגְבָּה
  choice: 幕屋の南側に
  rationale: יֶרֶךְ の「側面」と方向形 נֶגְבָּה の「南」を、日本語で自然な位置表現にまとめた。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所構造物の名称として定着しており、「会見の天幕」との原語上の区別も保てる。
