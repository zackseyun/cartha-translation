  text: וּ/בְ/הֵעָל֤וֹת הֶֽ/עָנָן֙ מֵ/עַ֣ל הַ/מִּשְׁכָּ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/כֹ֖ל מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: ja
  text: 雲が幕屋の上から上がるたびに、イスラエルの子ら[a]は、彼らのすべての旅程において出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人」。ヘブライ語では直訳「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלוֹת
  choice: 上がるたびに
  rationale: 接続詞と前置詞を伴う不定詞連語は時を表す。文脈では繰り返される状況を指すため、「上がると」より「上がるたびに」が反復の意味を明確に伝える。עלהはここでは雲が上方へ移動することを表す。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 直前まで語られている神の臨在を示す特定の雲を指す。日本語では文脈上、定冠詞を明示せず「雲」とするのが自然。
- source_word: מֵעַל
  choice: 上から
  rationale: 幕屋の上方にあった位置から離れる動きを簡潔かつ自然に表す。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における移動式聖所を指す מִשְׁכָּן の定着した日本語訳であり、簡潔で文脈にも適する。
- source_word: יִסְעוּ
  choice: 出発した
  rationale: נסע は宿営地を離れて旅に出ることを表す。未完了形の習慣的意味は「上がるたびに」という従属節によって自然に示される。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義的な形を保ちつつ、イスラエルに属する民全体を指す伝統的な集合表現として訳す。別訳は脚注に示す。
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: その旅の全行程で
  rationale: 彼らの荒野の旅におけるすべての移動段階を包括する表現として、自然な日本語にした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の集合的呼称
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の「子ら」という形を本文に残しながら、この表現が民全体を集合的に指し得ることを脚注で示す。男性だけに限定するとも、原文の形を無意味なものとして消すとも断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての簡潔さと品位を保った。「上がるたびに」で反復性を示し、「その旅の全行程で」によって荒野の旅全体にわたる習慣を表した。
