base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: ja
  text: 彼は証し[a]を取って箱に納め、棒を箱に取り付け、その上に贖いの蓋[b]を載せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「証し」。ここでは箱に納められた契約の証し、すなわち石の板を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「贖罪の蓋」とも訳せる。箱の上に置かれた金製の蓋。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: 証しの書板
  rationale: 語そのものは「証し」だが、ここでは箱に納められる具体物、すなわち契約の証しを記した石の板を指す。「証し」だけでは現代日本語で物体だと伝わりにくいため、文脈上の指示対象を示しつつ脚注で原語の表現を明記した。
- source_word: הָאָרֹן
  choice: 箱
  rationale: אָרוֹןの基本義は「箱」であり、この文脈では聖なる契約の箱を指す。節内にない「契約の」を本文へ補わず、明快な現代語とした。
- source_word: הַבַּדִּים
  choice: 棒
  rationale: 箱を担ぐための棒を指す。前後の幕屋記事によって用途が明らかなので、簡潔で自然な「棒」とした。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 箱の上に置かれる金製の蓋であり、贖いの儀礼的意義を持つ特定の器具を指す。「蓋」だけに還元せず、機能と形状の双方が伝わる表現とした。
- source_word: מִלְמָעְלָה
  choice: その上から
  rationale: 箱の上側への配置を表す。日本語では「その上から箱に……載せた」とすることで、上部への設置を自然に示した。
- source_word: וַיִּתֵּן ... אֶל
  choice: 箱の中に納め
  rationale: 物を箱の内部へ置く動作なので、「納める」が神聖な器具を扱う文脈にも合い、自然である。
- source_word: וַיָּשֶׂם ... עַל
  choice: 箱に取り付け
  rationale: 担ぎ棒を所定の位置に据える動作を、現代日本語で誤解なく表した。「上に置く」では箱の天面に載せたようにも読めるため避けた。
theological_decisions:
- issue: 「証し」の指示対象
  choice: 本文では物体であることが分かる「証しの書板」とし、原語が定型的に「証し」とだけ述べることを脚注に示す。
  alternative: 「証し」または「契約の証し」と抽象度を保って訳す。
  rationale: 物理的に箱へ納める対象は石の板と理解される一方、ヘブライ語は板を明示せず「証し」という祭儀上の名称を用いる。本文の理解可能性を確保しながら、脚注で原文の簡潔さと曖昧さを保持した。
- issue: כַּפֹּרֶת の訳語
  choice: 贖いの蓋
  alternative: 贖罪所／宥めの蓋／蓋
  rationale: 単なる構造物としての蓋ではなく、贖いに関わる祭儀的器具であることを示す。ただし特定の贖罪理論を本文へ持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用い、幕屋の荘重な文脈に合わせて「入れた」ではなく「納めた」、「置いた」ではなく「載せた」とした。「箱」は節にない限定を加えない原語寄りの表現である。
