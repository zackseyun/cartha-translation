  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: ja
  text: 彼らにも、彼らの父に油を注いだのと同じように油を注ぎなさい。そうすれば、彼らはわたしに祭司として仕える。彼らが受ける油注ぎによって、彼らは代々にわたる永続する祭司職に就く[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永遠の祭司職」とも訳せる。ヘブライ語は、契約の文脈において、世代を超えて持続することを表し得る。
    reason: עוֹלָם の時間的範囲にある語義上の幅を示し、無限性を一義的に断定しないため。
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: 彼らにも……油を注ぎ
  rationale: 接続詞を伴う完了形は一連の指示の中で命令的な意味を持つ。日本語では後続の命令「仕えさせなさい」につなげ、自然に指示の力を表した。「にも」は、直前に油を注がれる父アロンとの対応を示す。
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: その父に油を注いだのと同じように
  rationale: כַּאֲשֶׁר の明確な比較を「のと同じように」で表し、「その父」は彼らの父アロンを指す単数形を保った。
- source_word: וְכִהֲנוּ לִי
  choice: わたしに祭司として仕えさせなさい
  rationale: 動詞 כהן は祭司として務めることを表す。「祭司として仕える」により職務的意味と、奉仕の向かう相手が神であることを明示した。文脈上の指示として自然な使役表現にした。
- source_word: מָשְׁחָתָם
  choice: 彼らへの油注ぎ
  rationale: ここでは油そのものではなく、彼らが油を注がれること、またその聖別を指すため、「油注ぎ」とした。
- source_word: לִכְהֻנַּת עוֹלָם
  choice: 永遠の祭司職
  rationale: כְּהֻנָּה は祭司の職務・身分を表すので「祭司職」とした。עוֹלָם は契約・制度の文脈で長く持続することを表し得るが、その強い時間的表現を本文では「永遠の」と訳し、別訳を注記した。
- source_word: לְדֹרֹתָם
  choice: 代々にわたり
  rationale: アロンの子孫の各世代を通じた継続を、明快で自然な現代日本語で表した。
theological_decisions:
- issue: 祭司職の継続期間を表す עוֹלָם の意味
  choice: 永遠の祭司職
  alternative: 永続する祭司職
  rationale: עוֹלָם はここで祭司職の長期的・世代的継続を示すが、抽象的な意味で無限の時間を必ず断定するとは限らない。本文では語の強さを保つ「永遠の」を採り、契約的文脈での「永続する」という理解も脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の指示としての厳粛さを保った。「油注ぎ」「祭司職」は聖所奉仕の文脈に必要な用語として保持し、文全体は一般読者にも追いやすい構文にした。脚注記号は該当する「永遠の祭司職」の文末に置いた。
