  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: ja
  text: モーセとアロン、およびアロンの子らは、その水盤の水で手と足を洗った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「そこから、手と足を洗った」。ヘブライ語は洗盤を指し、水の出所を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: 洗った
  rationale: רחץのカル・ワイイクトルで、物語の連続した過去の行為を表す。次節が反復的な状況を説明するため、ここでは自然な過去形とした。
- source_word: מִמֶּנּוּ
  choice: そこから水をくみ
  rationale: מן＋三人称男性単数接尾辞は、直前の洗盤を指して「それから」を意味する。日本語で単に「そこから洗った」とすると不自然なため、水源を示す意味を保ちながら、洗盤から水を取ったことを明示した。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: וְאַהֲרֹן
  choice: とアロン
  rationale: 接続を保ち、日本語で定着している人名表記を用いた。
- source_word: וּבָנָיו
  choice: とその子ら
  rationale: 祭司の文脈でアロンの息子たちを指す。単数接尾辞が直前のアロンを受けることを、「その」によって自然に示した。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: 複数主語に共有される身体部位として、日本語では「彼らの両手」より「手」が自然である。
- source_word: וְאֶת רַגְלֵיהֶם
  choice: と足
  rationale: 原文の一対の目的語「手と足」を簡潔かつ自然に保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「そこから水をくみ」は原文の水源を示す מן を自然な日本語で表し、洗盤そのものの中で洗ったとの誤解を避ける。
