source:
  edition: WLC
  text: וַ/יַּעֲרֹ֥ךְ עָלָ֛י/ו עֵ֥רֶךְ לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: ja
  text: 彼は、ヤハウェの前に、その上へパンを順序どおりに並べた[a]。ヤハウェがモーセに命じたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「パンの配列」。伝統的には「臨在のパン」。
    reason: עֵרֶךְ לֶחֶם は字義的には「パンの配列」「整えられたパン」を表す。この節自体は定型句「臨在のパン」を用いていないため、伝統的訳語は脚注にとどめる。
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: 並べた
  rationale: ערךの「整えて並べる、順序立てて配置する」という意味を、祭儀の文脈に合う自然な現代日本語で表した。
- source_word: עָלָיו
  choice: その上に
  rationale: 代名詞は前節の「机」を指す。「その上に」として指示関係と位置を簡潔に保った。
- source_word: עֵרֶךְ לֶחֶם
  choice: パンを順序どおりに
  rationale: 直訳的には「パンの配列」であり、パンが定められた並びに整えられたことを表す。日本語では動詞「並べた」と組み合わせて自然にした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: 祭儀的な表現の空間的・臨在的な含みを解釈しすぎずに保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な音写にした。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ヤハウェがモーセに命じたとおりである
  rationale: 行為が神の命令に正確に従ったことを示す従属節を、明瞭で格調ある日本語の独立文として表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: ヘブライ語本文が固有名を明記しているため、称号で代替せずに音写し、契約の神の名としての性格を保った。
- issue: עֵרֶךְ לֶחֶם の祭儀的理解
  choice: パンを順序どおりに
  alternative: 臨在のパンを
  rationale: この節は定型句 לֶחֶם הַפָּנִים ではなく、パンの配列を表す עֵרֶךְ לֶחֶם を用いるため、伝統的名称を本文に読み込まず、記述的な表現を採った。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語を用いた。「供えた」は祭儀的意味を明示しすぎるため避け、原文の「並べた」を保持した。反復される神名も省略せず、命令への忠実な服従を示す定型的な結びを保った。
