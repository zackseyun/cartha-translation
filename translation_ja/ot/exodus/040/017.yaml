base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: ja
  text: 第二年の第一の月、その月の一日に、幕屋が建てられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立した語としては訳出せず、文全体の叙述で表現）
  rationale: 物語を進める定型的な叙述形であり、日本語では「そして、こうなった」と直訳するより、日付に続けて出来事を述べるほうが自然で、機能も保てる。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 第一の月
  rationale: 暦上の月を示すחֹדֶשׁと序数を、明確で簡潔な日本語にした。
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: 第二年の
  rationale: 日付公式の一部として、後続する「第一の月」を修飾する自然な日本語にした。何を起点とする第二年かは本文で補わない。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: その月の一日に
  rationale: 字義的には「月の一に」だが、ヘブライ語の慣用的な日付表現なので「一日」と明示した。
- source_word: הוּקַם
  choice: 建てられた
  rationale: קוםのホファル形が表す受動の意味を保持し、幕屋の設営について現代日本語で自然な表現を選んだ。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記で造られる移動式聖所を指す、日本語聖書で定着した簡潔な用語である。
