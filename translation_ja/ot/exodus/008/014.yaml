id: EXO.8.14
reference: Exodus 8:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: ja
  text: 呪術師たちも秘術を使って同じようにし、ぶよ[a]を出そうとしたが、できなかった。ぶよは人にも家畜にもついていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しらみ」とも訳せる。この虫を指すヘブライ語の意味は確定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: 呪術師たち
  rationale: ファラオに仕える儀礼・呪術の専門家を指す語。「魔術師」も可能だが、現代日本語では手品師との誤解を避けつつ、文脈上の役割を明確にするため「呪術師」とした。
- source_word: בְּלָטֵיהֶם
  choice: 秘術を使って
  rationale: 秘密の、または呪術的な技法を表す。隠された術という含みを自然な現代日本語で保つ。
- source_word: לְהוֹצִיא
  choice: 出そうとした
  rationale: 字義的には「出すために」。ここでは災いの虫を生じさせようとする試みを指すため、目的と未遂が自然に伝わる表現とした。
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: ぶよ
  rationale: 虫の正確な種類は不確か。「ぶよ」は有力で定着した訳語の一つだが、「しらみ」の可能性を脚注に残した。
- source_word: וְלֹא יָכֹלוּ
  choice: できなかった
  rationale: 彼らにその能力がなかったことを簡潔で自然な日本語で示す。
- source_word: בָּאָדָם
  choice: 人にも
  rationale: אָדָםはここで人類を集合的に指す。日本語の「人」は性別を限定せず、後続の「家畜」との対比も自然に保つ。
- source_word: וּבַבְּהֵמָה
  choice: 家畜にも
  rationale: בְּהֵמָהは大型の飼育動物・家畜を指しうる集合名詞。出エジプト記の災害文脈に適した自然な訳語とした。
theological_decisions:
- issue: 集合的な אָדָם の訳し方
  choice: 人
  alternative: 人間／人類
  rationale: 男性個人ではなく人々一般を指す集合用法であるため、日本語では簡潔な「人」が原文の範囲と「家畜」との対比を最も自然に表す。
- issue: 呪術師たちの行為と失敗の関係
  choice: 彼らは秘術で虫を出そうとしたが、できなかった
  alternative: 彼らも同じことをしたが、虫を出すことはできなかった
  rationale: וַיַּעֲשׂוּ כֵן は試みを導入し、後の「できなかった」が成功を否定する。彼らが実際に虫を生じさせたかのような矛盾を避けつつ、原文の叙述順序を保った。
translation_notes:
  register: 明快で品位ある現代標準日本語。原文の反復は保ちつつ、「同じようにし、…出そうとした」として日本語で行為の試みと失敗の関係を明確にした。
