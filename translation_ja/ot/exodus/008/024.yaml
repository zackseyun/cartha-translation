revisions:
- from: そこでファラオは言った。「私はおまえたちを行かせよう。荒野で、おまえたちの神ヤハウェにいけにえを献げるがよい。ただし、決して遠くまで行ってはならない。私のために祈り求めてくれ。」
  to: そこでファラオは言った。「私はおまえたちを行かせよう。荒野で、おまえたちの神ヤハウェにいけにえを献げるがよい。ただし、あまり遠くまで行ってはならない。私のために切に祈ってくれ。」
  rationale: 距離に関する禁止を「あまり遠くまで」として、原文の強調を保ちつつ「遠くへ行くこと自体の絶対的禁止」とはしないよう調整した。末尾は、ファラオ自身の利益のために熱心な祈願を求める表現として明確化した。その他の語順、神名、呼称、および犠牲の語彙は原文に忠実で自然であるため保持した。
