  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: ja
  text: そこでファラオは言った。「私はおまえたちを行かせよう。荒野で、おまえたちの神ヤハウェにいけにえを献げるがよい。ただし、あまり遠くまで行ってはならない。私のために切に祈ってくれ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……は言った
  rationale: ワウ連続法による物語の進行を、自然な現代日本語の接続で表した。
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: 私はおまえたちを行かせよう
  rationale: この交渉の文脈でשׁלחは、イスラエルの出発を許すことを表す。明示された一人称代名詞も「私は」で保持した。
- source_word: וּזְבַחְתֶּם
  choice: いけにえを献げるがよい
  rationale: 先行する許可を受け、その目的として犠牲を献げることを認める発言として自然に表現した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名יהוהを称号に置き換えず、固有名として音写した。
- source_word: אֱלֹהֵיכֶם
  choice: おまえたちの神
  rationale: 二人称複数の所有関係を明確に保った。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: מִדְבָּרの、人里を離れた未開の地という出エジプト記の文脈に適した定訳を用いた。
- source_word: רַק
  choice: ただし
  rationale: ファラオが許可に制限を付す転換を自然に示した。
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: 決して遠くまで行ってはならない
  rationale: 同根の不定詞絶対形と定動詞による禁止の強調を「決して」で反映した。
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: 私のために祈り求めてくれ
  rationale: עתרのヒフィルが表す切実な祈願と、בעדיの代理・利益の意味を、分かりやすい現代日本語で表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に現れる四文字神名を固有名として保持し、称号へ置き換えないため。
translation_notes:
  register: ファラオの権威的な許可と制限を示すため、イスラエル側への呼称は「おまえたち」とした。一方、末尾は災厄からの救済を求める依頼なので「祈り求めてくれ」とし、尊大さと切迫感が併存する語調を保った。全体は明瞭で格調を失わない現代標準日本語とした。
