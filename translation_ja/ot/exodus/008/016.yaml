  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: ja
  text: 主はモーセに言われた。「朝早く起きて、ファラオの前に立ちなさい。見よ、彼は水辺へ出て行く。あなたは彼にこう言いなさい。『主はこう言われる。わたしの民を去らせ、わたしに仕えさせよ。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字語を、日本語聖書で広く通用する敬称「主」で示した。
- source_word: הִתְיַצֵּב
  choice: 立ちなさい
  rationale: 単に居合わせるのでなく、相手の前に進み出て立つことを命じる語であり、文脈上自然で簡潔な表現とした。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 目前の事柄へ注意を促す談話標識の力を保った。
- source_word: הַמָּיְמָה
  choice: 水辺へ
  rationale: 方向を示す接尾要素を反映しつつ、ナイル川と明示されていない原文の表現を保った。
- source_word: שַׁלַּח
  choice: 去らせ
  rationale: 民を拘束から解いて行かせる命令を表し、この箇所で反復される要求の意味を自然な日本語で示した。
- source_word: יַעַבְדֻנִי
  choice: わたしに仕えさせよ
  rationale: עבד が礼拝と奉仕の双方を含み得るため、「礼拝する」だけに限定せず、原語の幅を保った。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名であることを踏まえつつ、日本語で公的朗読にも適した伝統的表記を採用した。特定の発音再建を本文で断定しない。
- issue: עבד の宗教的含意
  choice: 仕える
  alternative: 礼拝する
  rationale: ファラオへの隷属と主への奉仕という出エジプト記の緊張を保持し、語義を祭儀的礼拝だけに狭めないため。
translation_notes:
  register: 明快な現代標準日本語を用い、命令と神託の厳粛さを保った。「見よ」は日常語より格調があるが、原文の注意喚起を簡潔に再現するため採用した。
