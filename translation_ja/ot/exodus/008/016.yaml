revisions:
- from: 主はモーセに言われた。「朝早く起きて、ファラオの前に立ちなさい。見よ、彼は水辺へ出て来る。あなたは彼にこう言いなさい。『主はこう言われる。わたしの民を去らせ、わたしに仕えさせよ。』」
  to: 主はモーセに言われた。「朝早く起きて、ファラオの前に立ちなさい。見よ、彼は水辺へ出て行く。あなたは彼にこう言いなさい。『主はこう言われる。わたしの民を去らせ、わたしに仕えさせよ。』」
  rationale: 移動動詞を、原文の「出る」という方向性に合わせて「出て来る」から「出て行く」へ修正した。それ以外は、原文の構文、神名の方針、命令の調子、および עבד の意味の幅を適切に保っているため変更しない。
