id: EXO.8.19
reference: Exodus 8:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י פְדֻ֔ת בֵּ֥ין עַמִּ֖/י וּ/בֵ֣ין עַמֶּ֑/ךָ לְ/מָחָ֥ר יִהְיֶ֖ה הָ/אֹ֥ת הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: ja
  text: わたしは、わたしの民とあなたの民との間に区別を設ける[a]。明日、このしるしが起こる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「贖い」または「救い」。ヘブライ語は神による贖い、救出を意味することがあり、ここではイスラエルとエジプトを区別して扱うこととして表されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: わたしは…設ける
  rationale: שׂים は基本的に「置く、据える」だが、抽象名詞 פְדֻת と「…と…との間に」という構文では、日本語の「区別を設ける」が自然であり、神がその区別を生じさせるという能動的な意味も保つ。
- source_word: פְדֻת
  choice: 区別
  rationale: この語は「贖い、救出」を表し得るが、直後の「わたしの民とあなたの民との間に」という枠組みでは、両者を異なる扱いにすることが前面に出る。「区別」は文脈上の意味を明瞭にし、救済的な語義は脚注に残す。
- source_word: בֵּין ... וּבֵין
  choice: …と…との間に
  rationale: 二者の間の隔たり・区別を示す相関的な前置詞構文を、自然な日本語で表す。
- source_word: עַמִּי
  choice: わたしの民
  rationale: 神に属する民、ここではイスラエルを指す所有表現をそのまま訳す。
- source_word: עַמֶּךָ
  choice: あなたの民
  rationale: ファラオに属する民、すなわちエジプト人を指す所有表現をそのまま訳す。
- source_word: לְמָחָר
  choice: 明日
  rationale: 翌日を示す時間表現。原文と同様、後半の文頭に置いて強調を保つ。
- source_word: יִהְיֶה
  choice: 起こる
  rationale: 基本義は「ある、なる」だが、「このしるし」を主語とする未来の出来事を、現代日本語で無理なく表すため「起こる」とする。
- source_word: הָאֹת הַזֶּה
  choice: このしるし
  rationale: אוֹת は、神の働きを示し確認する出来事としての「しるし」を意味する。平明で聖書文脈にもなじむ表記を採る。
theological_decisions:
- issue: פְדֻת を救済用語として訳すか、文脈上の区別として訳すか
  choice: 本文では「区別」とする
  alternative: 「贖い」または「救い」
  rationale: 疫病の中で神がイスラエルとエジプトを異なる扱いにすることが、בֵּין ... וּבֵין の構文によって直接示されている。一方、この区別が神の救いの行為であるという原語の含みを失わないよう、別の語義を脚注に示す。
translation_notes:
  register: 明瞭で現代的だが、神の宣言にふさわしい簡潔で威厳ある文体とした。「しるし」は聖書で定着した語を平仮名表記にし、「区別を設ける」によって原文の能動性と自然な日本語を両立させた。
