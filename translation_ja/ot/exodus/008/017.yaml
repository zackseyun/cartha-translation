revisions:
- from: もしあなたがわたしの民を去らせないなら、見よ、わたしはあなたと、あなたの家臣たちと、あなたの民と、あなたの家々に、虫の大群[a]を送り込む。エジプトの家々は虫の大群で満ち、彼らがいる地面[b]も満ちる。
  to: もしあなたがわたしの民を行かせないなら、見よ、わたしはあなたに、あなたの家臣たちに、あなたの民に、またあなたの家々に、虫の大群[a]を送り込む。エジプトの家々は虫の大群で満ち、エジプトの人々がいる地面[b]も虫の大群で満ちる。
