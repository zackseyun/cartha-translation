source:
  edition: WLC
  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: ja
  text: もしあなたがわたしの民を行かせないなら、見よ、わたしはあなたに、あなたの家臣たちに、あなたの民に、またあなたの家々に、虫の大群[a]を送り込む。エジプトの家々は虫の大群で満ち、エジプトの人々がいる地面[b]も虫の大群で満ちる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「はえ」または「あぶ」とも訳される。ヘブライ語がどの虫を指すかは確定できず、伝統的には、はえやあぶの類と理解されてきた。
    reason: lexical_alternative
  - marker: b
    text: 「土地」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: もし……なら
  rationale: 直前の警告を受ける条件節として、現代日本語で自然に表した。
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: あなたがわたしの民を去らせない
  rationale: 出エジプト記で反復される解放要求を表し、単なる派遣ではなく支配下から行かせる意味を保つ。
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: 見よ、わたしは……送り込む
  rationale: הִנְנִי の厳粛な告知の力と、分詞が示す切迫し確実な行為を表した。
- source_word: הֶעָרֹב
  choice: 虫の大群
  rationale: 何らかの群がる生物を指すが、種の特定には不確かさがある。日本語では「大群」だけでは対象が曖昧すぎるため「虫の大群」とし、「あぶ」とする伝統的理解は脚注に示した。
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ וּבְבָתֶּיךָ
  choice: あなたと、あなたの家臣たちと、あなたの民と、あなたの家々に
  rationale: 前置詞の反復による対象の積み重ねを保ちつつ、家々については動く災厄が内部へ入ることが伝わるよう後続の「送り込む」と結びつけた。
- source_word: עֲבָדֶיךָ
  choice: あなたの家臣たち
  rationale: ファラオに仕える者たちを指す文脈なので、一般的な「奴隷」ではなく宮廷・行政上の従者を含む「家臣」とした。
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: エジプトの家々は……満ち
  rationale: ヘブライ語の結果を表す動詞を自然な日本語で再現し、エジプト全域の家々という広がりを保った。
- source_word: הָאֲדָמָה
  choice: 地面
  rationale: 家々との対照から、ここでは物理的な地表を第一義とした。ただし「土地」も可能なので脚注に残した。
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: 彼らがいる
  rationale: 代名詞「彼ら」の指示を明示的に特定せず、原文の表現を保った。
