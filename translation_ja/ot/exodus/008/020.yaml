revisions:
- from: ヤハウェはそのとおりに行われた。すると、おびただしい虫の群れ[a]がファラオの家とその家臣たちの家々に押し寄せた。エジプト全土で、虫の群れのために地は荒れ果てた。
  to: ヤハウェはそのとおりに行った。すると、おびただしい虫の群れ[a]がファラオの家とその家来たちの家々に入り込んだ。エジプト全土で、虫の群れのために地は荒れ果てた。
  rationale: 能動の動詞を「行った」に改め、ヤハウェが告げたことを実行したという原文の意味を回復した。「入り込んだ」により、群れがファラオとその家来たちの家へ来たという方向性を自然に表した。脚注は本文の「虫の群れ」に正しく付されており、種の不確定性を保持するため変更しない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:11Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭の וַיַּעַשׂ（「行った／そうした」）は主語ヤハウェによる能動の行為であるが、現行の「ヤハウェはそのとおりに行われた」は受け身に読め、原文の文法的関係を損なう。ほかは、עָרֹבの種の不確定性、כָּבֵדの規模の強調、家々への到来、全エジプトに及ぶ被害、および原因の קשרをおおむね適切に保っている。
  naturalness: 「そのとおりに行われた」は、現代標準日本語ではヤハウェが行為者でなく被行為者であるかのように響く。「そのとおりに行った」とすれば、明瞭で自然な物語文になる。「入り込んだ」は、群れが家の中へ来たという方向性を明示しつつ、「押し寄せた」より原文の単純な到来動詞に近い。
  terminology: 「ヤハウェ」は神名の音写として一貫している。「虫の群れ」は עָרֹב を「はえ」と断定せずに訳しており、脚注もその曖昧さを適切に説明する。「家臣たち」は עֲבָדָיו の可能な文脈的表現だが、身分を過度に限定しない「家来たち」のほうが原語の広さをより保つ。
