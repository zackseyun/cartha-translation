  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: ja
  text: ヤハウェはそのとおりに行った。すると、おびただしい虫の群れ[a]がファラオの家とその家来たちの家々に入り込んだ。エジプト全土で、虫の群れのために地は荒れ果てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このヘブライ語が指す生物の種類は明確ではない。大量の虫の群れを意味すると考えられ、伝統的には「はえ」と理解されてきた。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語表記で音写した。
- source_word: וַיַּעַשׂ ... כֵּן
  choice: そのとおりに行われた
  rationale: 告げられたことを実行したという意味を、明瞭で品位ある現代日本語で表した。
- source_word: עָרֹב כָּבֵד
  choice: おびただしい虫の群れ
  rationale: עָרֹבが指す生物の種類は確定できないため「はえ」と限定せず、כָּבֵדによる規模の強調を「おびただしい」で自然に表した。
- source_word: בֵּיתָה פַרְעֹה
  choice: ファラオの家に押し寄せた
  rationale: 方向を示す語形を反映しつつ、群れが建物内へ入ったことを自然な日本語で示した。「宮殿」とは限定しなかった。
- source_word: וּבֵית עֲבָדָיו
  choice: その家臣たちの家々
  rationale: 単数形の「家」を複数の人物に配分して理解した。王に仕える者という文脈に即してעֲבָדִיםを「家臣」としたが、官職だけに狭めてはいない。
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: エジプト全土で
  rationale: 災いがエジプトの地の全域に及んだことを簡潔に表した。
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: 地は荒れ果てた
  rationale: שׁחתのニファル形が示す深刻な損壊を表しつつ、完全な消滅を意味する「滅ぼされた」は避けた。
- source_word: מִפְּנֵי הֶעָרֹב
  choice: 虫の群れのために
  rationale: ここでのמִפְּנֵיを原因を示す表現として自然に訳した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された神の固有名を保ち、称号への置換や特定の伝統的読みへの依存を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の進行を自然にするため文を分け、曖昧な虫の種類は本文で特定しない。脚注記号[a]は該当語句の直後に置いた。
