    rationale: 原文 וַיַּעַשׂ は「ヤハウェ」を主語とする能動の「（そのように）行った」である。現行文は日本語では受け身として理解され、意味関係が逆転し得る。
  - severity: low
    issue: 「押し寄せた」は原文よりやや描写的である。
    rationale: וַיָּבֹא は基本的に「来た／入った」であり、「入り込んだ」は家への方向性を保ちながら、追加的な勢いの含みを避けられる。
