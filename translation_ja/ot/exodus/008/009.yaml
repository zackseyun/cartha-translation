  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: ja
  text: 主はモーセの言葉どおりにされた。蛙は家々から、中庭から、畑から死んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す四文字名を、日本語聖書で広く定着している「主」で表した。
- source_word: כִּדְבַר מֹשֶׁה
  choice: モーセの言葉どおりに
  rationale: 前置詞 כְּ の「〜に従って／〜どおりに」と דָּבָר の「言葉」を自然かつ簡潔に保持した。
- source_word: וַיָּמֻתוּ
  choice: 死に絶えた
  rationale: 単に「死んだ」だけでなく、各所にいた蛙が死んでいなくなったという文脈上の結果を、日本語として自然に示した。
- source_word: הַחֲצֵרֹת
  choice: 中庭
  rationale: 家屋に付属する囲われた空間を指す語として、現代日本語で理解しやすい「中庭」を採用した。
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: 家々からも、中庭からも、畑からも
  rationale: 三度反復される מִן の列挙と強調を「〜からも」で再現した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文の意味を損なわず、日本語聖書の一般的で尊厳ある慣用に従った。特定の教派的解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語。叙述の簡潔さと、原文にある場所の反復的列挙を保った。
