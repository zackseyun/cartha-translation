  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: ja
  text: 彼らはそのとおりにした。アロンは杖を持つ手を伸ばし、地の塵を打った。すると、小さな虫[a]が人にも家畜にも生じた。エジプト全土で、地の塵はことごとく小さな虫になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぶよ」または「しらみ」とも訳される。ヘブライ語の指す虫の厳密な種類は不明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 彼らはそのとおりにした
  rationale: 直前の命令を実行したことを示す定型的な物語表現。複数形を保ちつつ、現代日本語として自然にした。
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: アロンが杖を持った手を伸ばして
  rationale: בְמַטֵּהוּ は随伴または手段を表し得る。「杖を持った手」とすることで、アロンが手と杖を伸ばした場面を過度に説明せず明瞭に表した。
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: 地のちりを打つと
  rationale: נכה の打撃の意味と עפר の「ちり」を保った。「すると」に相当する出来事の連続は接続助詞「と」で自然に示した。
- source_word: הַכִּנָּם / כִנִּים
  choice: ぶよ
  rationale: 小型の害虫を指す語だが、厳密な動物学的同定は不確かである。本文では日本語で理解しやすい伝統的な候補「ぶよ」を採り、不確かさを脚注に残した。
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: 人にも家畜にも
  rationale: אָדָם はここでは人間を集合的に指し、בְּהֵמָה は文脈上、広く家畜を指す。「人にも家畜にも」は対句と双方への被害を明瞭に表す。
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: 地のちりはことごとくぶよになった
  rationale: כָּל の全体性と היה の結果的な意味を、日本語として自然な「ことごとく～になった」で表した。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土で
  rationale: 災いがエジプトの地全体に及んだという範囲を簡潔かつ自然に表す。
theological_decisions:
- issue: אָדָם の集合的用法
  choice: 人
  alternative: 人間／人々
  rationale: 男性個人ではなく人類一般を集合的に指すため、現代日本語で包括的かつ自然な「人」とした。家畜との対比も保たれる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の簡潔な物語進行と、「地のちり」の反復を維持した。虫の同定に関する真正の語彙的不確かさは脚注で明示した。
