source:
  edition: WLC
  text: דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים נֵלֵ֖ךְ בַּ/מִּדְבָּ֑ר וְ/זָבַ֨חְנוּ֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/אֲשֶׁ֖ר יֹאמַ֥ר אֵלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: ja
  text: 私たちは荒野へ三日間の旅をし[a]、神が私たちに言われるとおりに[b]、私たちの神ヤハウェにいけにえをささげます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「荒野へ三日の道のりを進み」。
    reason: דֶּרֶךְ שְׁלֹשֶׁת יָמִים は、三日を要する旅程、またはその距離を表す慣用表現である。
  - marker: b
    text: または「神が私たちに言われるであろうとおり」。
    reason: יֹאמַר は未完了形であり、将来の発言としても、神の指示を一般的に述べる表現としても理解できる。
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 三日の道のり
  rationale: דֶּרֶךְ に時間の尺度が伴い、その日数を要する旅程・距離を表す慣用表現。簡潔で自然な日本語としつつ、具体的な距離を本文以上に限定しない。
- source_word: נֵלֵךְ
  choice: 私たちは……進み
  rationale: Qal未完了形一人称複数を、文脈上の将来の行動として表現。「行きます」も可能だが、「道のり」と自然につながる「進み」を採用した。
- source_word: בַּמִּדְבָּר
  choice: 荒野へ
  rationale: מִדְבָּר は砂漠に限らない、人里を離れた荒れ野・原野を指す。「へ」により נֵלֵךְ の移動方向を自然に示す。
- source_word: וְזָבַחְנוּ
  choice: いけにえを献げます
  rationale: זבח の祭儀的な意味を明示し、現代日本語で自然に理解できる表現とした。単に「犠牲をささげる」より具体的で、宗教的文脈にもふさわしい。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 固有の神名 יהוה を称号に置き換えず、音写して保持する。
- source_word: אֱלֹהֵינוּ
  choice: 私たちの神
  rationale: 一人称複数接尾辞をそのまま反映し、神との帰属関係を保持する。
- source_word: כַּאֲשֶׁר
  choice: ……とおり
  rationale: 比較・一致を表す כַּאֲשֶׁר を、神の告げる内容に従って行うという意味が自然に伝わる形で表した。
- source_word: יֹאמַר אֵלֵינוּ
  choice: 神が私たちにお告げになる
  rationale: 未完了形の時制・相の幅を保ちつつ、主語を日本語で補って明瞭にした。「命じる」と限定せず、原文の一般的な אמר の意味を保持する。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名 יהוה を用いているため、契約の神名を本文で明示する音写を採用した。
- issue: יֹאמַר を命令として訳すか
  choice: お告げになる
  alternative: 命じられる
  rationale: いけにえの方法についての神の指示という文脈はあるが、אמר 自体は「言う、告げる」であり、「命じる」と語義を狭めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝文としての品位も保った。「いけにえ」は平仮名表記とし、一般読者への読みやすさを優先した。原文の語順を機械的に再現せず、「神が私たちにお告げになるとおり」を献げ物の動作の前に置いて係り受けを明確にした。
