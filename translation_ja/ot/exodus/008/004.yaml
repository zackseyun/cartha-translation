source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: ja
  text: そこでファラオはモーセとアロンを呼び寄せて言った。「ヤハウェがカエルを私と私の民から取り除いてくださるよう、ヤハウェに切に願ってください[a]。そうすれば、私は民を行かせ、彼らがヤハウェにいけにえをささげられるようにします[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「切に願う」と訳した語には、熱心に嘆願する、または執り成すという意味がある。単に通常の祈りをささげる以上の切迫感を帯びうる。
    reason: lexical_alternative
  - marker: b
    text: 後半は、「私は民を行かせ、彼らはヤハウェにいけにえをささげる」とも訳せる。ヘブライ語は単純な並列にも読めるが、ここでは民を行かせる目的を表すものと理解した。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: モーセとアロンを呼び寄せて
  rationale: קרא＋לְは人を呼ぶ、または召し出す意味。ファラオが二人を自分のもとへ来させた文脈を、自然な現代日本語で表した。
- source_word: הַעְתִּירוּ
  choice: 切に願ってください
  rationale: עתרのヒフィル形は、祈りの文脈で熱心に嘆願する、または執り成す意味を持つ。「祈ってください」より強い切迫感を本文に反映した。
- source_word: אֶל יְהוָה
  choice: ヤハウェに
  rationale: 固有の神名יהוהを音写し、前置詞אֶלを願いの向かう相手を示す「に」とした。
- source_word: וְיָסֵר הַצְפַרְדְּעִים
  choice: カエルを……取り除いてくださるよう
  rationale: סורのヒフィル形の使役的な意味「取り除く」を保ち、命令形に続く願いの内容として自然な日本語にした。
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: 私と私の民から
  rationale: 反復されるמִןが示す二つの対象を明確にし、ファラオ自身とその民の双方から災いを除く願いを表した。
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: 私はこの民を去らせましょう
  rationale: コホータティブが示すファラオの表明・約束を「ましょう」で表した。שלחは出エジプト記で民を解放して行かせる意味を持つため、「去らせる」とした。指示対象を明確にするためהָעָםを「この民」と訳した。
- source_word: וְיִזְבְּחוּ לַיהוָה
  choice: 彼らがヤハウェにいけにえをささげられるように
  rationale: זבחの祭儀的意味を「いけにえをささげる」で表した。接続詞וְと未完了形は、ここでは民を去らせる目的として読むのが文脈上自然だが、単純な並列の可能性は脚注に残した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を用いていることを明示し、一般に有力な再構音「ヤハウェ」を採用した。称号への置換は避けた。
- issue: ファラオの最後の句וְיִזְבְּחוּの関係
  choice: 目的を表す「彼らが……ささげられるように」
  alternative: 単純な並列を表す「そして彼らは……ささげる」
  rationale: 民を去らせるという表明に続く未完了形は、その意図された目的・結果を表すと理解できる。ただし接続詞וְ自体は単純な並列にも読めるため、別訳を脚注で示した。
- issue: ファラオの発言を約束としてどう表すか
  choice: 去らせましょう
  alternative: 去らせる
  rationale: コホータティブ形の意志的な力を保ちつつ、実際に履行されたかどうかを本文で先取りせず、発言時点の意向として表した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「切に願う」「いけにえをささげる」は聖書文脈に適した語彙だが、一般読者にも理解できる表現とした。ファラオの発言には丁寧な依頼と意志表明を用い、切迫した状況を自然に伝えた。
