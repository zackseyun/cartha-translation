  to: モーセとアロンはファラオのもとを出て行き、モーセは、ファラオに下された蛙[a]のことでヤハウェに叫び求めた。
  rationale: 受動表現の「ファラオに下された蛙」により、原文の文脈上の意味を保ちながら、日本語でモーセが蛙を下したかのように読める曖昧さを除いた。脚注は、ヘブライ語動詞に三人称男性単数の主語が形態上含まれる点を正確に記述するよう改めた。
