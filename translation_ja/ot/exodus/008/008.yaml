id: EXO.8.8
reference: Exodus 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֔ה עַל דְּבַ֥ר הַֽ/צְפַרְדְּעִ֖ים אֲשֶׁר שָׂ֥ם לְ/פַרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: ja
  text: モーセとアロンはファラオのもとを出て行き、モーセは、ファラオに下された蛙[a]のことでヤハウェに叫び求めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「下された」は直訳すれば「（彼が）置いた」「据えた」。ヘブライ語の動詞は三人称男性単数であるが、その指示対象は名詞としては示されておらず、文脈上はヤハウェと理解される。
    reason: 動詞 שׂים の字義と、動詞に含まれる主語の指示対象が本文中で名詞として示されていないことを明確にするため。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 去った
  rationale: יצאの、相手のもとから外へ出て離れる動きを、現代日本語で自然に表した。
- source_word: מֵעִם פַּרְעֹה
  choice: ファラオのもとを
  rationale: 直訳的な「ファラオと共にいる所から」という意味を、ファラオの面前・所在から立ち去ることとして簡潔に表した。
- source_word: וַיִּצְעַק
  choice: 叫び求めた
  rationale: צעקが表す切迫した強い呼びかけを保ち、単なる「祈った」より原文の強さを伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
- source_word: עַל דְּבַר הַצְפַרְדְּעִים
  choice: かえるのことで
  rationale: עַל דְּבַרの「～に関して」という意味を、明瞭で自然な日本語にした。
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: ファラオに下した
  rationale: שׂיםの基本義は「置く、据える」だが、災いとしてかえるをファラオに及ぼす文脈を自然な日本語で表した。動詞の主語は訳文でも明示せず、原文の省略を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号の「主」に置換せず音写した。
- issue: אֲשֶׁר שָׂם の省略された主語
  choice: 訳文でも主語を明示しない
  alternative: 「ヤハウェがファラオに下した」と明示する
  rationale: 文脈上はヤハウェを指すと考えられるが、ヘブライ語本文には主語が明記されていないため、その形式上の余地を残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、物語文としての品位を保った。「叫び求めた」によって祈願の切迫感を表し、神名は「ヤハウェ」とした。
