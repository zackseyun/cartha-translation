  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: ja
  text: しかし、ファラオはこの時も自分の心をかたくなにし[a]、民を行かせなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「自分の心を重くし」。心を頑固にして、応じようとしなかったことを表すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: かたくなにし
  rationale: 語根 כבד は本来「重くする」を表すが、「心」を目的語とするここでは、意志を頑固にして応じようとしないことを意味する。日本語では「心をかたくなにする」が自然であり、ファラオ自身の能動的な抵抗も保つ。
- source_word: לִבּוֹ
  choice: 自分の心
  rationale: ファラオが主語で、その心が目的語であることを自然な日本語で明確にする。「心」は意志や態度の中心を指すヘブライ語表現を保っている。
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: この時も
  rationale: 今回も以前と同じ行動を繰り返したという付加・反復の意味を、簡潔で自然な日本語で示す。
- source_word: וְלֹא שִׁלַּח
  choice: 去らせなかった
  rationale: שלח の使役的な意味を保ち、民が出て行くことを許さなかったという文脈に合う。「解放しなかった」より原文の「行かせる／去らせる」に近い。
- source_word: הָעָם
  choice: 民
  rationale: 定冠詞を伴う集合名詞で、文脈上イスラエルの民を指す。聖書本文として簡潔で自然な「民」とした。
- source_word: וַ
  choice: しかし
  rationale: 物語を進める接続辞だが、災いが除かれた後のファラオの反応が期待に反することを日本語で自然に示す。
theological_decisions:
- issue: ファラオの心がかたくなになった主体
  choice: ファラオは自分の心をかたくなにした
  alternative: ファラオの心はかたくなになった／ファラオは自分の心を重くした
  rationale: 原文ではファラオが明示的な主語で、動詞も能動形であるため、彼自身の行為として訳した。出エジプト記中には神がファラオの心をかたくなにする箇所もあるが、本節の主体を曖昧にせず、物語全体の神学的緊張も解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文にふさわしい簡潔で格調ある調子と、原文が示すファラオ自身の主体性を保った。
