  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: ja
  text: 彼らはそれらを山また山と積み上げた[a]。すると、その地は悪臭を放った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幾つもの山に」または「山々に」。ヘブライ語では「山」という名詞を繰り返して強調している。
