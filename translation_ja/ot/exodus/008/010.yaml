lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: 積み上げた
  rationale: צברは集めて塊や山にする具体的な動作を表す。文脈では死んだ蛙を幾つもの山にしたことなので、「積み上げた」が自然で明確。
- source_word: אֹתָם
  choice: それらを
  rationale: 直前の文脈にある蛙を指す男性複数の直接目的語代名詞。日本語では指示対象を保ちつつ「それらを」とした。
- source_word: חֳמָרִם חֳמָרִם
  choice: 山また山と
  rationale: 名詞「山、堆積」を反復することで、多数の山が次々とできたことを分配的・強調的に表す。「山また山と」は反復の効果を簡潔に保つ。
- source_word: וַתִּבְאַשׁ
  choice: 悪臭を放った
  rationale: באשは臭くなる、悪臭を発する意。現代日本語で力強く自然な「悪臭を放った」とした。
- source_word: הָאָרֶץ
  choice: その地
  rationale: ここでは全世界ではなく、災いを受けた地域、すなわちエジプトの地を指す。文脈的な限定を「その地」で示した。
