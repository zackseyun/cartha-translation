  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: ja
  text: そこでヤハウェはモーセに言った。「アロンに言いなさい。『あなたの杖を差し伸べて地のちりを打ちなさい。すると、それがエジプト全土で小さな虫[a]となる。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しらみ」「ぶよ」などとも訳せる。ヘブライ語は小さな害虫を指すが、正確にどの虫を指すかは確定できない。
    reason: כִּנִּיםの指示対象は不確定であるため、本文では虫種を特定せず、脚注で代表的な訳語候補を示す。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、現代日本語で自然な順接として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず一般的な日本語音写で示した。
- source_word: אֱמֹר
  choice: 言いなさい
  rationale: モーセに対する命令を、直接話法を導く自然で明瞭な日本語にした。
- source_word: נְטֵה אֶת־מַטְּךָ
  choice: あなたの杖を伸ばして
  rationale: 動作を表す「伸ばす」と所有を明示し、原文の命令の流れを自然な連用形でつないだ。
- source_word: וְהַךְ אֶת־עֲפַר הָאָרֶץ
  choice: 地のちりを打て
  rationale: נכהの力を伴う動作を「打つ」で表し、עֲפַר הָאָרֶץの簡潔で具体的な表現を保った。
- source_word: וְהָיָה לְכִנִּם
  choice: すると、それは……ぶよとなる
  rationale: 結果を示す文脈に即して「となる」とし、指示語で変化する対象が地のちりであることを保った。כִּנִּיםは同定が不確かなため、本文では慣用的な「ぶよ」を用い、脚注で別訳と不確実性を示した。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土で
  rationale: בְּכָלの包括的な範囲を、簡潔で自然な現代日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 「主」、または「エホバ」
  rationale: 原文が固有名を明記しているため、その区別を保つ音写を採用し、称号への置換を避けた。
- issue: כִּנִּיםが指す虫の同定
  choice: 本文を「ぶよ」とし、脚注で不確実性を明記
  alternative: 「しらみ」または他の小さな吸血・刺激性の虫
  rationale: 古代語の指示対象を特定できないため、本文で一つの訳語を用いつつ、特定の虫であると断定しないよう脚注で幅を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「打て」の簡潔な命令形により原文の直接性を保ち、「すると」で結果関係を自然に示した。脚注記号[a]は該当語「ぶよ」の直後に置いた。
