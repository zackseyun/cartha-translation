source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: ja
  text: 呪術師たちも秘術によって同じことを行い[a]、エジプトの地に蛙を上がらせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らのまじないによって」または「彼らの魔術によって」。
    reason: בְּלָטֵיהֶם は、隠された秘儀的な術や呪術を指し得るため。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 同じことを行い
  rationale: עשה＋כֵן の慣用的な比較の意味を保ち、直前の行為と同様にしたことを自然な現代日本語で示す。
- source_word: הַחֲרְטֻמִּים
  choice: 呪術師たち
  rationale: ファラオの宮廷で秘術を用いてしるしをまねる者たちを指す文脈に合い、単なる奇術師という印象を避けつつ明瞭に表す。
- source_word: בְּלָטֵיהֶם
  choice: 秘術によって
  rationale: 隠された、あるいは秘儀的な術という語感と、手段を示す前置詞の働きを簡潔に保つ。具体的な技法は本文が特定していないため、訳でも限定しない。
- source_word: וַיַּעֲלוּ
  choice: 上がらせた
  rationale: עלה のヒフィル形が持つ使役の意味を保ち、蛙を上って来させたという叙述を表す。
- source_word: אֶת הַצְפַרְדְּעִים
  choice: 蛙を
  rationale: 定冠詞を伴う複数名詞である。日本語では文脈上特定された群れを無標で自然に表せるため、「蛙を」とする。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: エジプトの地に
  rationale: עַל の場所的意味を自然な日本語で表し、蛙がエジプト全土へ上がった文脈にも適合させる。
theological_decisions:
- issue: 呪術師たちの行為の性質
  choice: 呪術師たちも実際に蛙を上がらせたと、本文どおり限定を加えず訳す。
  alternative: 見せかけ、模倣、または手品だったと明示する。
  rationale: ヘブライ語本文はその行為を留保なく叙述しており、その仕組みや実在性を説明していない。訳文も自然主義的または教派的な解釈を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「蛙」は常用的な表記として漢字を用いる。脚注記号[a]は該当語句の直後に置いた。
