reference: Exodus 8:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: ja
  text: しかしモーセは言った。「そのようにするのは適切ではありません。私たちが、エジプト人が忌み嫌うもの[a]を私たちの神ヤハウェにいけにえとしてささげるのは、そのためです。もし私たちがエジプト人が忌み嫌うものを彼らの目の前でいけにえとしてささげるなら、彼らは私たちを石で打ち殺すのではありませんか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「エジプトの忌むべきもの」。ここでは、エジプト人が忌み嫌うものを意味すると考えられる。
    reason: 属格表現 תּוֹעֲבַת מִצְרַיִם には逐語的な別訳の余地があるため。
lexical_decisions:
- source_word: נָכוֹן
  choice: 適切ではありません
  rationale: ここでは、行為として正当・妥当・ふさわしいことを表す。文脈には宗教的反感による現実的危険もあるため、道徳面だけに限定しない「適切」が合う。
- source_word: לַעֲשׂוֹת כֵּן
  choice: そのようにする
  rationale: 「このように行う」というヘブライ語の定型的表現を、自然な現代日本語で簡潔に表した。
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: エジプト人が忌み嫌うもの
  rationale: 構文上は「エジプトの忌むべきもの」とも取れるが、文脈ではエジプト人の宗教感情に反する犠牲を指す可能性が高い。本文では客体的意味を明確にし、逐語的な別訳を脚注に残した。
- source_word: נִזְבַּח
  choice: いけにえとして献げることになる／いけにえとして献げるなら
  rationale: 未完了形は、ファラオの提案に従った場合に意図される、または想定される行為を表す。日本語では各節の論理関係に応じて条件的に訳した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 原文の固有の神名יהוהを音写し、契約の神名を明示した。
- source_word: אֱלֹהֵינוּ
  choice: 私たちの神
  rationale: 一人称複数の所有関係を明示し、イスラエルと神との関係を原文どおり保持した。
- source_word: הֵן
  choice: もし
  rationale: ここでは、続く修辞疑問のための仮定を導く語として機能するため、自然な条件表現とした。
- source_word: לְעֵינֵיהֶם
  choice: 彼らの目の前で
  rationale: 原文の視覚的で強い表現を保ちながら、自然な日本語にした。
- source_word: יִסְקְלֻנוּ
  choice: 私たちを石で打ち殺そうとする
  rationale: 動詞は石打ち、または石を投げつけて殺す行為を表す。ここでは予想される暴力的反応として自然に伝わるよう訳した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文が固有の神名を直接用いているため、一般名詞的な称号に置き換えず「ヤハウェ」とした。
- issue: תּוֹעֲבַת מִצְרַיִםの意味
  choice: エジプト人が忌み嫌うもの
  alternative: エジプトの忌むべきもの
  rationale: エジプト人の目の前で犠牲を献げれば石打ちにされる、という論理から、エジプト人が宗教的に忌避する対象を指すと判断した。ただし属格表現の曖昧さは脚注で保持した。
- issue: 石打ちの結果性
  choice: 石で打ち殺そうとする
  alternative: 石を投げつける／石で打ち殺す
  rationale: סקלは石打ちを表すが、ここで必ず正式な刑罰制度を意味するとは限らない。「殺そうとする」により危険の深刻さを示しつつ、制度的処刑と断定することを避けた。
translation_notes:
  register: モーセがファラオに語る場面にふさわしく丁寧体を用いた。語調は明瞭で現代的にしつつ、「いけにえとして献げる」「石で打ち殺す」など原文の宗教的・暴力的な具体性を保った。
