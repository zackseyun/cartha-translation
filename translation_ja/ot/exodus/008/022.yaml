  terminology: יַהוֶהは方針どおり「ヤハウェ」とする。זבחは「いけにえとしてささげる」とし、具体的な祭儀行為を保つ。「エジプト人が忌み嫌うもの」は本文に適切であり、属格の曖昧さは脚注で保持する。
