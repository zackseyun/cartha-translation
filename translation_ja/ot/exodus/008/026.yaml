source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ja
  text: そこで、モーセはファラオのもとを出て、ヤハウェに切に願った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェに熱心に祈り求めた」。ヘブライ語の動詞には、切迫して嘆願するという意味合いがある。
    reason: עתרの「祈る」と「切に嘆願する」の両面を示すため。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て
  rationale: יצאのカル形・物語叙述形で、実際にその場から退出したことを表す。文脈に即して自然な現代日本語とした。
- source_word: מֵעִם פַּרְעֹה
  choice: ファラオのもとを
  rationale: מֵעִםは、相手のそばや面前から離れることを表す。「ファラオのもとを出て」により、その臨在から退出する含みを自然に伝える。
- source_word: וַיֶּעְתַּר
  choice: 切に願った
  rationale: עתרは単なる祈りではなく、熱心な懇願・嘆願を表す。「切に願った」はその強さを保ちつつ、現代日本語として明瞭である。
- source_word: אֶל
  choice: に
  rationale: 願いの向けられる相手を示す前置詞であり、日本語では「ヤハウェに」が自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が神の固有名を明記しているため、称号「主」に置き換えず音写し、原文上の区別を保った。
- issue: モーセの行為の強さ
  choice: 切に願った
  alternative: 祈った
  rationale: עתרに含まれる熱心な嘆願の意味を保持した。モーセの取りなしの性格を過度に詳説せず、動詞自体の強さを訳出した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で物語の継起を示し、「ファラオのもとを出て」によって離脱のニュアンスを自然に表現した。
