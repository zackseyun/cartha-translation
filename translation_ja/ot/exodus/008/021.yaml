translation_notes:
  register: 明快な現代標準日本語を用いながら、王の命令にふさわしい簡潔で dignified な調子を保った。「いけにえ」は一般読者に通じる表記とし、「この国の中で」によってエジプト国外への出立を許さない対比を自然に伝えた。
