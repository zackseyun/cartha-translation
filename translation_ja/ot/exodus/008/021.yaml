  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: ja
  text: そこでファラオはモーセとアロンを呼び寄せて言った。「行って、この地で、あなたがたの神にいけにえを献げよ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せて
  rationale: この文脈の קרא は、相手を自分のもとへ呼ぶことを表す。「呼び寄せる」は、公式な召喚という意味を過度に強めず、動作を自然な日本語で明示する。
- source_word: פַרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として、現代日本語の聖書文体で理解しやすい標準的な音写を用いた。
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める אמר の通常の訳。発言の相手は直前のモーセとアロンから明らかである。
- source_word: לְכוּ
  choice: 行って
  rationale: הלך の男性複数命令形。「行け」も可能だが、後続の命令と滑らかにつながる連用的な命令として「行って」とした。
- source_word: זִבְחוּ
  choice: いけにえを献げよ
  rationale: זבח は犠牲祭儀を行うことを表す。日本語では「いけにえを献げる」が自然で、単に「犠牲にする」と誤解されにくい。
- source_word: לֵאלֹהֵיכֶם
  choice: あなたがたの神に
  rationale: 接尾辞の複数二人称を「あなたがた」と明示し、לְ を犠牲を献げる相手・受け手として「神に」と訳した。
- source_word: בָּאָרֶץ
  choice: この国の中で
  rationale: 直訳は「その地で／国で」。ここではファラオが荒野へ出ることを認めず、エジプト国内で献げるよう命じているため、「この国の中で」として文脈上の指示範囲を自然に示した。
