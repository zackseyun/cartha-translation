source:
  edition: WLC
  text: וַ/יֵּ֤ט אַהֲרֹן֙ אֶת יָד֔/וֹ עַ֖ל מֵימֵ֣י מִצְרָ֑יִם וַ/תַּ֨עַל֙ הַ/צְּפַרְדֵּ֔עַ וַ/תְּכַ֖ס אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: ja
  text: そこでアロンがエジプトの水の上に手を伸ばすと、かえる[a]が上って来て、エジプトの地を覆った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では単数形の「かえる」だが、ここでは群れ全体を指す集合的な用法と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸ばすと
  rationale: נטהはこのしるしの動作において、手を差し伸べることを表す。「手を伸ばす」は自然な現代日本語で、原文の具体的な動作を保つ。
- source_word: יָדוֹ
  choice: 手
  rationale: 原文は「腕」ではなく明確に「彼の手」と述べる。日本語では主語のアロンから所有者が明らかなため、「手」とした。
- source_word: עַל
  choice: 上に
  rationale: 水に対する手の空間的位置を素直に表し、原文の関係を過度に解釈しない。
- source_word: מֵימֵי מִצְרָיִם
  choice: エジプトの水
  rationale: 複数形の מַיִם は、ここではエジプトにある水域を集合的に指す。日本語では「水」が自然であり、複数性を不自然に明示しない。
- source_word: וַתַּעַל
  choice: 上って来て
  rationale: עלהは、かえるが水域から陸へ現れ出る上向きの動きを表す。「上って来る」は視点を含めて自然にその動きを伝える。
- source_word: הַצְּפַרְדֵּעַ
  choice: かえる
  rationale: 形態上は定冠詞付き単数だが、文脈上は集合的単数と考えられる。日本語の「かえる」は単複を形で区別しないため、原文の形と集合的意味の双方を自然に保持できる。
- source_word: וַתְּכַס
  choice: 覆った
  rationale: כסהの基本義である「覆う」を直接表し、過度な比喩的色彩を加えない。
- source_word: אֶרֶץ מִצְרָיִם
  choice: エジプトの地
  rationale: אֶרֶץはここでエジプトの領土・土地を指す。「エジプトの地」は聖書本文として自然で、全世界という意味には取られない。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で物語の連続を示し、「手を伸ばすと」によって動作とその結果のつながりを自然に表した。日本語では「かえる」自体が単複を区別しないため本文は簡潔にし、原文の単数形と集合的解釈は脚注で示した。
