id: EXO.8.6
reference: Exodus 8:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: ja
  text: ファラオは「明日」と答えた。モーセは言った。「あなたの言葉どおりにしましょう。あなたが私たちの神ヤハウェ[a]のような方はほかにいないと知るためです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語で神の固有名を表す四文字יהוה（YHWH）の音写。伝統的に「主」と訳されることもある。
    reason: 神名の原語と伝統的な別訳を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: ファラオは…答えた。モーセは言った
  rationale: ヘブライ語では両方とも「言った」だが、文脈上の話者を明示し、最初を返答として自然な日本語にした。接続詞וַは逐語的に反復せず、会話の順序で表した。
- source_word: לְמָחָר
  choice: 明日
  rationale: ファラオが指定した時を簡潔な直接話法で表した。前置詞לְを日本語で不自然に直訳しない。
- source_word: כִּדְבָרְךָ
  choice: あなたの言葉どおりにしましょう
  rationale: 直訳は「あなたの言葉どおりに」。日本語では述語を補い、モーセがファラオの指定した時に従うという文脈上の意味を明確にした。
- source_word: לְמַעַן תֵּדַע
  choice: あなたが…知るためです
  rationale: לְמַעַןが示す目的を保持し、二人称単数の相手であるファラオへの言葉として訳した。
- source_word: אֵין כַּיהוָה
  choice: ヤハウェのような方はほかにいない
  rationale: 存在否定אֵיןと比較のכְּを自然な日本語で表現し、神を指すため「方」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字YHWHを称号に置き換えず、一般的な日本語音写で示した。
- source_word: אֱלֹהֵינוּ
  choice: 私たちの神
  rationale: 語形は複数形に見えるが、この文脈ではイスラエルの唯一の神を指し、一人称複数接尾辞を「私たちの」と訳した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を直接用いているため、それを称号「主」に置換せず音写した。「エホバ」は後代の母音の組み合わせに由来する形なので採用しなかった。
- issue: 「ヤハウェのような方はほかにいない」の範囲
  choice: 比較表現をそのまま保持
  alternative: ヤハウェだけが神である
  rationale: 原文はאֵין כַּיהוָהという比較表現であり、より明示的な唯一神告白へと言い換えず、原文の表現と神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、神への言及には「方」を用いて品位を保った。原文で省略されている「あなたの言葉どおりに」の述語は、文脈に即して「しましょう」と補った。
