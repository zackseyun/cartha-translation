base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: ja
  text: ヤハウェはモーセの言葉どおりに事を行い、その群れ[a]をファラオからも、その家臣たちからも、その民からも取り除いた。一つも残らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あぶの群れ」とも訳される。ヘブライ語はこの災いをもたらした群れを指すが、どの生物の群れかは、その語自体では特定されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וַיַּעַשׂ ... כִּדְבַר מֹשֶׁה
  choice: モーセの言葉どおりに行い
  rationale: 「行う／する」という広い意味の動詞と、「モーセの言葉に従って」という構文を、原文との対応を保ちながら自然な日本語にした。
- source_word: וַיָּסַר
  choice: 取り除いた
  rationale: 使役形がここで表す、災いの群れをその場から除去する意味を明確にした。
- source_word: הֶעָרֹב
  choice: 群がるもの[a]
  rationale: この語は災いをなす群れを指すが、生物の種類を語自体では特定しないため、「あぶ」「はえ」などに限定しなかった。
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: ファラオ、その家臣たち、その民から
  rationale: 三者のそれぞれから取り除かれたことを明瞭に示しつつ、日本語では前置詞相当語の不自然な反復を避けた。
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: 一つも残らなかった
  rationale: אֶחָדの単数による強調を保ち、「群がるもの」の種類を虫に限定する助数詞は避けた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が称号ではなく神の固有名を用いているため、その区別を保つ音写を採用した。
translation_notes:
  register: 明快で現代的な標準日本語を用いた。「群がるもの」は生物種を特定しない原文の曖昧さを保つ表現であり、脚注で伝統的な訳の可能性を示した。
