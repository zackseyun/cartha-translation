id: EXO.8.15
reference: Exodus 8:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: ja
  text: そこで呪術師たちはファラオに言った。「これは神の指です[a]。」しかし、ファラオの心はかたくなになり[b]、彼らの言うことを聞かなかった。ヤハウェが語られたとおりであった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の指」は、神の力が直接働いていることを表す言い回し。
    reason: cultural_note
  - marker: b
    text: 別訳「ファラオの心は強固になった」。原文は、誰がその心をかたくなにしたのかをこの箇所では明示していない。
    reason: lexical_alternative
  - marker: c
    text: 原文は神の固有名YHWH。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: 呪術師たち
  rationale: ファラオに仕える祭儀・呪術の専門家を指す。現代日本語で役割を明確にしつつ、「魔術師」よりも娯楽的な連想を避ける。
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: これは神の指です
  rationale: 動詞のないヘブライ語節を自然な日本語にし、「神の指」という比喩を本文に保持した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数にもなり得るが、この文脈ではイスラエルの神の直接的な力を認める単数の意味が最も自然である。
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: ファラオの心はかたくなになり
  rationale: 動詞חזקは心が強固になることを表す。この節では硬化の行為者を明示しないため、日本語でも神またはファラオを明示的な行為者にせず、状態変化として訳した。
- source_word: שָׁמַע אֲלֵהֶם
  choice: 彼らの言うことを聞かなかった
  rationale: 単に音を聞かないのではなく、彼らの言葉を受け入れず従わなかった意味を、明快な現代日本語で表した。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェが語られたとおりであった
  rationale: 先に告げられた神の言葉との一致を示す定型句として訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、一般的な日本語音写で固有名として示した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文の固有名を本文で保持する。「ヤハウェ」は学術的に広く用いられる再建音に基づく日本語表記である。
- issue: ファラオの心がかたくなになる際の行為主体
  choice: 行為主体を明示せず、「心はかたくなになり」とする
  alternative: 「神がファラオの心をかたくなにした」または「ファラオは自分の心をかたくなにした」
  rationale: この節のヘブライ語は硬化の行為主体を明示していないため、神学的緊張と曖昧さを保った。
- issue: אֱלֹהִיםの数と指示対象
  choice: 神
  alternative: 「ある神」または「神々」
  rationale: 出エジプト記の対決という文脈と「指」の単数表現から、ここでは単数の神を指す読みが最も自然である。
translation_notes:
  register: 明快で格調を保った現代標準日本語。直接話法では、ファラオに対する呪術師たちの発言として丁寧体を用いた。「かたくな」は聖書的文脈で定着しつつ現代の一般読者にも理解可能な語。すべての脚注記号を対応箇所に配置した。
