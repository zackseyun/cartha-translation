base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: ja
  text: かえるは、あなたのもとから、あなたの家々から、あなたに仕える者たちから、あなたの民から去り、ナイル川[a]にだけ残る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「川」。ヘブライ語 יְאֹר は「川」を意味することもあるが、出エジプト記では通常、特にナイル川を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: 去り
  rationale: סוּרの「離れる、去る」という意味を、災いのかえるがいなくなる文脈に即して自然に表した。直接「滅ぼされる」とはせず、原文の表現を保った。
- source_word: הַצְפַרְדְּעִים
  choice: かえる
  rationale: 定冠詞の付いた複数名詞。日本語では数を明示せずとも群れ全体を自然に表せるため、「かえる」とした。
- source_word: מִמְּךָ
  choice: あなたのもとから
  rationale: 直訳的な「あなたから」より自然でありつつ、ファラオ本人のところから離れる意味を保持した。
- source_word: וּמִבָּתֶּיךָ
  choice: またあなたの家々
  rationale: 原文の複数形を「家々」で明示した。後続の「のもとから」が並列全体にかかる構文とした。
- source_word: וּמֵעֲבָדֶיךָ
  choice: 家来たち
  rationale: עֶבֶדは奴隷、しもべ、官僚などを指し得る。ここではファラオに仕える者たちを広く指すため、身分を奴隷に限定しない「家来たち」とした。
- source_word: וּמֵעַמֶּךָ
  choice: 民のもとから
  rationale: ファラオに属する民衆を指す広い語として「民」を用いた。
- source_word: רַק
  choice: だけ
  rationale: ナイル川を唯一の例外として限定する機能を、自然な現代日本語で示した。
- source_word: בַּיְאֹר
  choice: ナイル川[a]に
  rationale: יְאֹרは一般に「川」も意味し得るが、出エジプト記のエジプトを舞台とする文脈では通常ナイル川を指すため、本文では固有名で明確にした。
- source_word: תִּשָּׁאַרְנָה
  choice: 残る
  rationale: שׁארのニファル形が表す「残る、残される」のうち、ここでは状態を簡潔に表す自動詞「残る」が自然である。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。原文の列挙と「ナイル川だけ」という限定を保ちつつ、重すぎる反復を避けるため、二度目の「のもとから」を並列句全体にかかる形にした。
