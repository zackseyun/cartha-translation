base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: ja
  text: モーセはファラオに言った。「どうぞ私にまさる栄誉をお取りください[a]。あなたとあなたの家臣たちと民のために、あなたとあなたの家々から蛙を取り除くように、私はいつ祈り求めましょうか。蛙が残るのはナイル川だけです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は難解な慣用表現で、直訳的には「私にまさって自らを誇ってください」の意。文脈上、モーセは自分が執り成す時をファラオ自身に指定させている。「私に時を指定してください」と意訳することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: 私に対して誇ってよい
  rationale: 「私に対して自らを誇る」という難解なヘブライ語の表現を可能な限り保った。文脈上は、ファラオに執り成しの時を指定する特権を与える言葉であり、その説明を脚注に置いた。
- source_word: לְמָתַי
  choice: いつ
  rationale: モーセが祈り求める時をファラオに選ばせる疑問表現として、簡潔で自然な「いつ」とした。
- source_word: אַעְתִּיר
  choice: 私が……祈り求め
  rationale: 神への切実な嘆願を表す使役語幹の動詞。目的語である神は本文に明示されないため補わず、「祈り求める」とした。
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: あなたとあなたの家臣たちと民のために
  rationale: 反復される前置詞の及ぶ三者を明確に示し、嘆願の対象範囲を保った。עֲבָדִים は宮廷の文脈に合わせて「家臣たち」とした。
- source_word: לְהַכְרִית
  choice: 絶つように
  rationale: כרת の「断つ、絶つ」という像を保ちつつ、蛙をファラオと家々から除去する文脈に通じる表現とした。
- source_word: הַצֲפַרְדְּעִים
  choice: 蛙
  rationale: 災いをもたらした動物を通常の現代日本語で訳した。
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: あなたとあなたの家々から
  rationale: ファラオ本人と複数の家を区別し、二度の起点表現の意味を明確にした。
- source_word: רַק
  choice: ……だけ
  rationale: 蛙が残る唯一の場所を示す限定・例外の機能を自然な日本語で表した。
- source_word: בַּיְאֹר
  choice: ナイル川
  rationale: 出エジプト記のエジプト的文脈で יְאֹר はナイル川を指すため、単なる「川」とせず固有名で示した。
- source_word: תִּשָּׁאַרְנָה
  choice: 蛙が残る
  rationale: 女性複数形の主語である蛙を日本語では明示し、存続・残存を表す受動語幹を自然に訳した。
