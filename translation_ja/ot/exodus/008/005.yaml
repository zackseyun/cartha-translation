- from: モーセはファラオに言った。「私に対して誇ってよい[a]。あなたとあなたの家臣たちと民のために、私がいつ祈り求め、あなたとあなたの家々から蛙を絶つようにしようか。蛙が残るのはナイル川だけである。」
  to: モーセはファラオに言った。「どうぞ私にまさる栄誉をお取りください[a]。あなたとあなたの家臣たちと民のために、あなたとあなたの家々から蛙を取り除くように、私はいつ祈り求めましょうか。蛙が残るのはナイル川だけです。」
  rationale: 難解な冒頭表現を過度に解釈して本文から消すことは避けつつ、命令形と栄誉の語感を自然な日本語で表した。脚注は直訳的な意味、慣用句としての不確定性、ならびに文脈上の「時を指定する」という理解を併記する。蛙については、原文が示す「ファラオとその家々からの除去」を明確にした。
