    rationale: 原文は עַל אֶרֶץ מִצְרָיִם であり、前の水域に対する עַל と同じく「エジプトの地の上に」を表す。「へ」は方向・到達点へ意味を寄せ、地の上への出現・拡がりを弱める。
  - severity: low
    issue: 「杖を持った手を」
    rationale: 意味は大きく外していないが、原文は「手」と「杖」を伴う行為を明示する。「杖を手にして、手を…伸ばし」とするほうが、両要素を保ちつつ誤解が少ない。
