revisions:
- from: そこでヤハウェはモーセに言われた。「アロンにこう言いなさい。『杖を持った手を、川々と運河[a]と池の上に伸ばし、カエルをエジプトの地へ上がらせなさい。』」
  to: そこでヤハウェはモーセに言われた。「アロンにこう言いなさい。『杖を手にして、手を川々と運河[a]と池の上に伸ばし、カエルをエジプトの地の上に上がらせなさい。』」
  rationale: 末尾を「エジプトの地の上に」と改め、原文の עַל と、水域から地上へカエルが出現して広がる描写を保持した。「杖を手にして、手を」として、手と杖の双方を明確にした。脚注の位置と内容は原文語義および英語監査記録に照らして適切なため維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:59Z'
