base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: ja
  text: そこでヤハウェはモーセに言われた。「アロンにこう言いなさい。『杖を手にして、手を川々と運河[a]と池の上に伸ばし、カエルをエジプトの地の上に上がらせなさい。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ナイル川の水路」とも訳せる。ここで用いられているヘブライ語は、エジプトの文脈ではしばしばナイル川に連なる水路を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず日本語で音写した。
- source_word: וַיֹּאמֶר
  choice: そこで……言われた
  rationale: 物語を進める接続形の順次性を、自然な現代日本語で表した。神の発言には敬意を示す「言われた」を用いた。
- source_word: אֱמֹר
  choice: こう言いなさい
  rationale: 命令形と、直後に続く直接話法への導入を明確にした。
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: 杖を持った手を……伸ばし
  rationale: 「手」と「杖」の双方を保ちつつ、道具を伴って手を伸ばす動作として自然に表現した。
- source_word: הַנְּהָרֹת
  choice: 川々
  rationale: 複数形を示し、後続する運河と池との三項列挙を保った。
- source_word: הַיְאֹרִים
  choice: 運河
  rationale: エジプトの文脈ではナイル川に連なる水路を指し得る語であり、「川々」と区別できる簡潔な表現を選んだ。
- source_word: הָאֲגַמִּים
  choice: 池
  rationale: 水のたまった場所を表す語として、川や運河と区別される自然な日本語を用いた。
- source_word: וְהַעַל
  choice: 上がらせなさい
  rationale: עלהの使役形が表す「上って来させる」という意味を保持した。
- source_word: הַצְפַרְדְּעִים
  choice: カエル
  rationale: 対象となる動物を現代日本語で明瞭に示した。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: エジプトの地へ
  rationale: 水域から地上へ上がる動きに合う方向表現とし、「エジプトの地」という原文の言い方を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を明記しているため、称号「主」に置換せず音写した。「エホバ」よりもヘブライ語の推定発音に近い一般的な表記を採用した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神の発言には「言われた」を用いて節度ある格調を保った。命令内の三種類の水域と、使役形の意味を明示した。
