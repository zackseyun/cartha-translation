id: EXO.8.25
reference: Exodus 8:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: ja
  text: モーセは言った。「見なさい。私はあなたのもとを出て、ヤハウェに願い求める。明日、その群れ[a]はファラオから、その家臣たちから、その民から去る。ただし、ファラオは民をヤハウェにいけにえを献げるために行かせないことで、これ以上欺いてはならない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「群れ」に当たるヘブライ語が具体的に何を指すかは確定できない。ハエやアブなどの群がる昆虫を指す可能性があるが、他の群がる生き物を指す可能性もある。
    reason: עָרֹב の指示対象に関する語義上の不確定性を示すため。
  - marker: b
    text: 「欺く」と訳した語には、「もてあそぶ」「愚弄する」という含みもあり得る。
    reason: הָתֵל の意味の幅を示すため。
lexical_decisions:
- source_word: הִנֵּה
  choice: 今
  rationale: 注意を促しつつ、直後の行動を示す文脈に合う自然な現代日本語とした。
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: あなたのもとを去り
  rationale: יצאの移動とמֵעִמָּךְの『あなたのところから』という意味を、自然に表した。
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: ヤハウェに願い求めます
  rationale: עתרがここで表す切実な執り成しを、一般的な『祈る』より具体的に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名である四文字語を音写した。
- source_word: וְסָר
  choice: 去るでしょう
  rationale: 主語である群れが離れていくという自動詞的意味を保った。
- source_word: הֶעָרֹב
  choice: 群れ
  rationale: 生物種を特定できないため、『あぶ』や『はえ』に限定せず曖昧さを保った。
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: ファラオから、その家臣たちから、その民から
  rationale: 原文で反復される前置詞を残し、災いが去る範囲を強調した。
- source_word: מָחָר
  choice: 明日
  rationale: 単純な時の副詞として直接訳した。
- source_word: רַק
  choice: ただし
  rationale: 約束に続く制限および警告を自然に導く。
- source_word: אַל יֹסֵף ... הָתֵל
  choice: これ以上欺いてはなりません
  rationale: יסףが示す反復・継続と、התלが含む欺瞞の意味を簡潔に表した。
- source_word: לְבִלְתִּי שַׁלַּח
  choice: 行かせず
  rationale: ファラオの欺きの具体的内容が、民を解放しないことだと分かる形にした。
- source_word: לִזְבֹּחַ
  choice: いけにえを献げに
  rationale: 一般的な礼拝ではなく、זבחの祭儀的な意味を明示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を明記しているため、その区別を保つ音写を採用した。
- issue: עָרֹב の具体的同定
  choice: 群れ
  alternative: あぶの群れ／はえの群れ／混成の獣群
  rationale: 何の群れかは語義上確定できないため、本文では特定せず、原文の曖昧さを保持した。
- issue: הָתֵל のニュアンス
  choice: 欺く
  alternative: もてあそぶ／あざける
  rationale: 文脈では、解放を約束しながら履行しない欺瞞が中心である一方、相手を軽んじる含みもあり得る。その含みは脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。ファラオへの直接の警告は、文脈に合う丁寧体で表現した。脚注記号は本文末に配置し、語義上の二つの留意点を一注にまとめた。
