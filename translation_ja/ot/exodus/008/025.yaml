  to: モーセは言った。「見なさい。私はあなたのもとを出て、ヤハウェに願い求める。明日、その群れ[a]はファラオから、その家臣たちから、その民から去る。ただし、ファラオは民をヤハウェにいけにえを献げるために行かせないことで、これ以上欺いてはならない[b]。」
