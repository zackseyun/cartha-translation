    rationale: この語は時間を示すというより、発言に注意を向けさせる「見よ／見なさい」に相当する。
  - severity: medium
    issue: 「欺いてはなりません」の具体的内容との係り方がやや曖昧である。
    rationale: לְבִלְתִּי שַׁלַּח は、ファラオの欺きが民を行かせないことにあることを示す。日本語でも「行かせないことで」と明示するのがよい。
  - severity: low
