language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: ja
  text: しかし、その日、わたしは、わたしの民が住んでいるゴシェンの地を他と区別し、そこに虫の群れ[a]がいないようにする。それは、わたしがヤハウェであり、その地[b]のただ中にいることを、あなたが知るためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「群れ」または「虫の大群」とも訳せる。ヘブライ語 עָרֹב が具体的にどの生物を指すかは確定できず、ハエに限らない可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「大地のただ中にいる」とも訳せる。文脈ではエジプトの地を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: 別に扱い
  rationale: ヒフィル形は、区別して異なる扱いをすることを表す。災いからゴシェンを守るという文脈を自然な日本語で示した。
- source_word: אֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地
  rationale: אֶרֶץ は土地・地域を指し、ここでは地名と結び付いた領域を表す。
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: わたしの民が住んでいる
  rationale: 字義的には「立っている」だが、土地との関係では、そこにとどまり居住していることを意味する。
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: そこには…がいないようにする
  rationale: 不在を目的または結果として表す不定詞構文を、自然な目的表現にした。
- source_word: עָרֹב
  choice: 群がる虫
  rationale: 何らかの群れを指すが、具体的な生物の同定には議論がある。文脈上の害虫の襲来を明瞭にしつつ、「ハエ」と限定しなかった。
- source_word: לְמַעַן תֵּדַע
  choice: あなたが知るためである
  rationale: ファラオに向けた二人称男性単数の動詞と、明示された目的を保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な形に音写した。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: この地のただ中にいる
  rationale: בְּקֶרֶב の位置的な意味を保ち、文脈上はエジプトの地を指すと理解できるようにした。ただし הָאָרֶץ のより広い読みは脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が神名そのものを用いているため、称号へ置換せず音写した。
- issue: בְּקֶרֶב הָאָרֶץ の範囲
  choice: この地のただ中にいる
  alternative: 地のただ中にいる／全地のただ中にいる
  rationale: 直近の災いの物語ではエジプトの地を指す可能性が高いが、הָאָרֶץ 自体が「地」または「大地」を意味し得るため、広い解釈を脚注に示した。
- issue: 「わたしがヤハウェであり」と「ヤハウェであるわたしが」の統語関係
  choice: わたしがヤハウェであり、この地のただ中にいる
  alternative: わたしヤハウェが、この地のただ中にいる
  rationale: כִּי אֲנִי יְהוָה בְּקֶרֶב הָאָרֶץ は神名の自己同定と所在を一続きに述べる。日本語では両方を明瞭にしつつ、過度な教理的補足を避けた。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神の宣言にふさわしい簡潔で厳かな調子を保った。「別に扱う」「ただ中」など、原文の区別と位置を示す表現を残した。
