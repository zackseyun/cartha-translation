  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: ja
  text: しかし、ファラオは安堵が得られた[a]のを見ると、自分の心をかたくし、彼らに耳を傾けなかった。ヤハウェが語られたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「猶予ができた」「一息つける状態になった」。ヘブライ語は、圧迫が和らぎ、安堵や余裕が生じることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見ると
  rationale: 基本義の「見る」を保ちつつ、状況の変化を認めたという文脈上の意味も自然に表す。
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: 一息つけるようになった
  rationale: הָרְוָחָה が表す圧迫の緩和、安堵、猶予という含みを、災いが収まった文脈に即した自然な日本語で表現した。別訳は脚注に示す。
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: 自分の心をかたくなにし
  rationale: כבד のヒフィル形と「心」の慣用表現を、ファラオ自身の能動的な頑迷さが明確になるよう訳した。「心を重くした」という直訳より現代日本語で意味が伝わる。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 彼らの言うことを聞かなかった
  rationale: שׁמע אֶל の「耳を傾ける、聞き従う」を自然に表し、「従わなかった」とまで意味を限定しない。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェが語られたとおりである
  rationale: 先に告げられた神の言葉との一致を示す。דבר は「語る」とし、物語の締めくくりとして自然な現在的叙述にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
theological_decisions:
- issue: ファラオの心がかたくなになることの主体
  choice: この節では、ファラオが自分の心をかたくなにしたと訳す。
  alternative: 心がかたくなになったという受動的表現、または神がそうさせたとの含意を加える。
  rationale: ヘブライ語はファラオを主語とする能動的な使役形であり、この節では責任をファラオ自身に帰している。出エジプト記の他箇所にある神の働きとの緊張関係は解消せず、この節にない原因を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「一息つける」は理解しやすい口語性を持つが、文全体を「かたくなにし」「語られたとおりである」で整え、聖書本文としての品位を保った。
