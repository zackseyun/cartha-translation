  terminology: 「ファラオ」「心をかたくする」「ヤハウェ」は適切である。「彼らの言うことを聞かなかった」も意味は通るが、אַלへの応答としては「彼らに耳を傾けなかった」がより直接的で、命令への不服従という意味を過度に限定しない。
