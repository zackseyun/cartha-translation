  to: 一方の端から一体のケルビムを、もう一方の端からもう一体のケルビムを造った。贖いの蓋[a]の両端から、二体のケルビムを造った。
  rationale: 「から」を前半・後半に保ち、ケルビムが贖いの蓋の両端から造られたという原文の材料的・構造的関係を直接表した。「一体にし」という、原文に明示されない結合動作を避けた。数量と原文の反復は維持し、脚注は現代日本語として明瞭な代案へ整えた。
