source:
  edition: WLC
  text: כְּרוּב אֶחָ֤ד מִ/קָּצָה֙ מִ/זֶּ֔ה וּ/כְרוּב אֶחָ֥ד מִ/קָּצָ֖ה מִ/זֶּ֑ה מִן הַ/כַּפֹּ֛רֶת עָשָׂ֥ה אֶת הַ/כְּרֻבִ֖ים מִ/שְּׁנֵ֥י קצוות/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: ja
  text: 一方の端から一体のケルビムを、もう一方の端からもう一体のケルビムを造った。贖いの蓋[a]の両端から、二体のケルビムを造った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「覆い」または「贖いのための蓋」とも訳せる。ヘブライ語「カッポーレト」は、契約の箱を覆う金の蓋を指す。
    reason: カッポーレトは契約の箱の物理的な蓋を指す専門語であり、祭儀的含意を含む訳と、より中立的な訳の両方を示すため。
lexical_decisions:
- source_word: כְּרוּב / הַכְּרֻבִים
  choice: ケルビム
  rationale: 契約の箱に結び付く特定の天的存在を指す伝統的な名称を保った。日本語では「一体」「二体」によって単数と複数を明示した。
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: 一方の端に……もう一方の端に
  rationale: 対になった表現が示す両端の対照を、自然で明瞭な現代日本語にした。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱の金の蓋を指す祭儀上の専門語であり、物としての蓋と贖いに関わる含意の両方を保つため、この訳語を採用した。語義上の別訳は脚注に示した。
- source_word: עָשָׂה
  choice: 造った
  rationale: 製作物について用いられる一般的な動詞として、原文の簡潔さを保った。
- source_word: מִן הַכַּפֹּרֶת ... מִשְּׁנֵי קְצֹוֹתָיו
  choice: 贖いの蓋と一体にし、その両端に
  rationale: ケルビムが蓋から作り出され、その両端に連続する構造であることを、日本語で誤解なく表した。
theological_decisions:
- issue: הַכַּפֹּרֶת の祭儀的意味
  choice: 贖いの蓋
  alternative: 蓋／宥めの蓋
  rationale: 単なる物理的な覆いに限定せず、語が持つ贖い・宥めとの関連を残した。ただし意味を一つに固定しすぎないよう、別訳を脚注に掲げた。
- issue: ケルビムと贖いの蓋の構造的関係
  choice: 蓋と一体に造られたと表現
  alternative: 蓋から造った
  rationale: 前置詞 מִן の起点・材料的なニュアンスを踏まえ、別部品を後から置いたのではなく、蓋から連続して作られたという文脈上の意味を自然な日本語で示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「一体／二体」で数量を自然に示し、原文の反復も保った。
