    rationale: 語は燭台の丸い隆起・こぶ状の装飾（knobs）を指す。「節」は現代日本語ではこの形状を十分に表さず、意味が曖昧になる。
  - severity: low
    issue: 原文の名詞列挙が「あり」「もあった」によって二段の叙述になっている。
    rationale: 誤訳ではないが、原文は杯、こぶ状の装飾、花を並列に述べるため、列挙として訳す方が対応が明瞭である。
  revised_text: また、燭台には、アーモンドの花の形をした杯が四つ[a]、そのこぶ状の飾りと花があった。
