  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: ja
  text: また、燭台には、アーモンドの花の形をした杯が四つ[a]、そのこぶ状の飾りと花があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アーモンド形の杯が四つ、そのこぶ状の飾りと花があった。」
    reason: מְשֻׁקָּדִים はアーモンドを模した意匠を表すため、「アーモンドの花の形をした」のほか「アーモンド形の」とも訳せる。
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: また、燭台には
  rationale: 接続詞と前置詞を自然な日本語の導入および場所の提示として訳した。装飾は燭台に付属するため、「中には」ではなく「には」とした。
- source_word: אַרְבָּעָה
  choice: 四つ
  rationale: 後続する複数名詞の数量をそのまま表した。
- source_word: גְבִעִים
  choice: 杯
  rationale: 燭台の杯状の装飾部分を指す語であり、形状を明確に伝える「杯」を採用した。「鉢」も可能だが、ここではやや広すぎる。
- source_word: מְשֻׁקָּדִים
  choice: アーモンドの花の形をした
  rationale: アーモンドに似せて作られた意匠を表す分詞として理解し、現代日本語で形状が明瞭になるように訳した。アーモンドの実そのものか花の意匠かという表現上の幅は脚注で示した。
- source_word: כַּפְתֹּרֶי/הָ
  choice: その節
  rationale: 燭台に付いた丸い隆起状の装飾を指す。植物意匠とのつながりと日本語の祭具用語としての簡潔さを考慮し、「節」とした。「こぶ」も形状を直接表す訳として可能である。
- source_word: וּ/פְרָחֶי/הָ
  choice: と花も
  rationale: 花または花飾りを指す語を、簡潔で自然な「花」とした。接尾辞は燭台を受けるため、「その」で関係を保った。
