  to: また、燭台には、アーモンドの花の形をした杯が四つ[a]、そのこぶ状の飾りと花があった。
  rationale: 「節」を、כַּפְתֹּר の形状と燭台装飾としての機能を伝える「こぶ状の飾り」に改めた。また、ヘブライ語の簡潔な並列構造により近づけるため、後半を名詞列挙として整えた。アーモンドの花という文脈上の理解は維持し、脚注でより簡潔な形状表現の可能性を示した。
