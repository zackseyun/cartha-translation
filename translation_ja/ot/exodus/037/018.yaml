base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: ja
  text: また、六本の枝がその両側から伸び出ていた。燭台の一方の側から三本の枝が、もう一方の側から三本の枝が伸びていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その一方の側から……その第二の側から」。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: 枝
  rationale: 燭台から左右に伸びる、枝状の部分を指す。現代日本語では「枝」が形状を自然かつ明確に伝える。
- source_word: יֹצְאִים
  choice: 伸び出ていた
  rationale: 燭台から外へ出ている状態を描く分詞の意味を保ちつつ、物体の形状を述べる日本語として自然にした。
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: その両側から／一方の側から／もう一方の側から
  rationale: 複数形の「その側面」を「両側」とし、後続する左右二側の対比を明瞭に表した。
- source_word: מְנֹרָה
  choice: 燭台
  rationale: 幕屋の灯火を支える器具を表す一般名詞として、簡潔で定着した日本語を用いた。
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: 一方の側……もう一方の側
  rationale: 直訳的な「一つの側……第二の側」より自然な日本語で、二つの側の対比を正確に示す。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準語。「伸び出ていた」により、枝が燭台から外へ出るという原文の描写性を保った。
