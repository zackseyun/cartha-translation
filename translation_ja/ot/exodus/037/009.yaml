base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: ja
  text: ケルビムは翼を上方に広げ、翼で贖いの蓋[a]を覆うようにしていた。彼らの顔は互いに向き合い、ケルビムの顔は贖いの蓋の方を向いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「覆い」または「蓋」。祭儀上、契約の箱を覆うものを指す。
    reason: הַכַּפֹּרֶת の字義的な意味と祭儀文脈での指示対象を示すため。
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: ケルビム
  rationale: 契約の箱の上に造られた天的存在を指す定着した音写を用い、複数形も日本語では同形で表した。
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: 翼を上方に広げ
  rationale: 翼が上向きに伸ばされた姿勢を、現代日本語で自然かつ具体的に表した。
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: その翼で……を覆っていた
  rationale: 分詞の継続的な姿勢と、בְּ の手段の意味を明示した。「覆う」は上から覆いかぶさる造形を表し、完全に見えなくするとの含意は必須としない。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱の蓋という具体物と、その祭儀的機能の双方を伝える表現とした。原語が技術的名称であることを踏まえ、単なる「蓋」という別訳を脚注に示した。
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: その顔は互いに向き合い
  rationale: 直訳的な「それぞれ兄弟に向け」を、日本語の相互表現に置き換え、二体が向き合う配置を明確にした。
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: ケルビムの顔は贖いの蓋に向けられていた
  rationale: 原文が「顔」と「贖いの蓋」を反復する構造を保ち、互いに向き合うと同時に蓋の方にも顔を向ける造形上の緊張を解消せずに残した。
theological_decisions:
- issue: 幕屋祭儀の文脈における הַכַּפֹּרֶת の訳語
  choice: 贖いの蓋
  alternative: 蓋／贖罪の座
  rationale: 物理的には契約の箱を覆う蓋でありながら、祭儀上の特別な役割を持つ名称であるため、具体性と神学的含意を併せ持つ「贖いの蓋」とした。「蓋」という字義的な別訳は脚注で保持し、「座」は原語に直接含まれないため本文には採らなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。造形を自然に描写しつつ、原文にある「顔」と「贖いの蓋」の反復、および顔が互いと蓋の双方に向く表現を保持した。
