base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: ja
  text: 彼は、純金一タラントで、燭台とそのすべての器具を作った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「器具」は「用具」「付属品」とも訳せる。ヘブライ語 כֵּלִים は、燭台に伴うさまざまな物品を広く指す語。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: 一タラント
  rationale: 幕屋造営の文脈では重量単位を指す。日本語の聖書用語として定着している「タラント」を用い、数量を明確にするため「一」を添えた。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 素材として純度の高い金を表す、簡潔で自然な現代日本語。
- source_word: עָשָׂה
  choice: 作った
  rationale: 一般的な動詞「作る／行う」の意味を、工芸・造営の文脈に即して直接的に訳した。
- source_word: אֹתָהּ
  choice: 燭台
  rationale: 女性単数代名詞の先行詞は前文脈の燭台。日本語で「それ」とするより、節単独でも指示対象が明瞭になるよう名詞を補った。
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: とそのすべての器具
  rationale: כֵּלִים は器、道具、用具などを広く指す。燭台に付属する品々を自然に表す語として「器具」を選んだ。
theological_decisions: []
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の語順よりも、日本語として材料と目的語の関係が自然に伝わる構文を採用した。「燭台」は直前の文脈から補った明示的な先行詞。
