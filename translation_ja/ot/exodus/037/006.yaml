  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: ja
  text: 彼は純金で贖いの蓋[a]を作った。長さは二キュビト半、幅は一キュビト半であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖罪所」または「贖罪の蓋」とも訳せる。ヘブライ語は契約の箱を覆う金の蓋を指し、贖いに関わる語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: 接続ワウを伴う未完了形が、物語中の継起的な過去の行為を表す。現代日本語では文頭の接続語を省いても流れが自然に保たれる。
- source_word: כַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱を覆う金製の物体であることと、贖いの儀式との結びつきの両方を、現代日本語で明確に伝える。語義を単なる「蓋」に限定せず、伝統的な「贖罪所」のように物体性が見えにくくなる表現も避けた。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 材料を示すヘブライ語表現を、自然な日本語の助詞「で」によって表した。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二キュビト半
  rationale: 原文の「二アンマと半分」という寸法を、日本語の聖書用度量単位を用いて簡潔に表した。
- source_word: אָרְכָּהּ
  choice: 長さは
  rationale: 女性単数接尾辞が贖いの蓋を指すことを文脈上明らかにしつつ、日本語では代名詞を重ねず自然な寸法表現とした。
- source_word: וְאַמָּה וָחֵצִי
  choice: 幅は一キュビト半
  rationale: 原文の「一アンマと半分」を自然な日本語の寸法表現にした。
- source_word: רָחְבָּהּ
  choice: 幅
  rationale: 寸法を示す語として、現代日本語で明瞭な「幅」を採用した。
theological_decisions:
- issue: 祭儀的文脈における כַּפֹּרֶת の訳語
  choice: 贖いの蓋
  alternative: 贖罪所／宥めの蓋／蓋
  rationale: この語は契約の箱の上に置く金の覆いを指すと同時に、贖いの儀式と密接に結びつく。「贖いの蓋」は物体としての性質と祭儀的含意をともに保持し、特定の贖罪理論に意味を狭めない。語の含意と別訳の可能性は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「キュビト」は聖書で定着した古代の長さの単位として音写し、原文にない現代換算値は本文へ加えなかった。寸法の並行構造を保ちつつ、日本語として簡潔に整えた。
