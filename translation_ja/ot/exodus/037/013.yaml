  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: ja
  text: 彼はその机のために金の輪を四つ鋳造し、その輪を四本の脚のところにある四隅に取り付けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「四本の脚に属する四隅に」。
    reason: ヘブライ語の לְ は、四隅が四本の脚のところにあるという位置関係とも、脚に属するという関係とも理解できる。
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 鋳造し
  rationale: 金属製の輪を作る幕屋建設の文脈なので、一般的な「注ぐ」ではなく、溶かした金属を型に流して作ることを表す。
- source_word: לוֹ
  choice: そのために
  rationale: 直前の文脈にある机を指す。日本語では無生物の代名詞を避け、「そのために」として自然に示した。
- source_word: טַבְּעֹת זָהָב
  choice: 金の輪
  rationale: 担ぎ棒を通すための金製の環を、明瞭で一般的な語で表した。
- source_word: וַיִּתֵּן
  choice: 取り付けた
  rationale: 家具に輪を配置して固定する製作場面では、直訳的な「置いた」より「取り付けた」が自然で具体的である。
- source_word: פֵּאֹת
  choice: 四隅
  rationale: 机の四つの端部を指す文脈に適し、輪が一つずつ付く位置を明瞭に表す。
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: 四本の脚のところにある
  rationale: 隅と脚との空間的関係を示す読みを本文に採用しつつ、所属関係として理解する余地を脚注に残した。
theological_decisions: []
