  text: 輪は枠のそばにあり、机を運ぶための棒を通すための受けとなっていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: 枠のすぐそばに
  rationale: לְעֻמַּת は位置関係を表し、ここでは平行記事（出エジプト記25:27）の「枠の近くに」に対応するため、輪が枠に隣接していたことを自然な日本語で示した。
- source_word: בָּתִּים לַבַּדִּים
  choice: 棒を通す受け
  rationale: בָּתִּים（直訳「家、容器」）は、ここでは運搬用の棒を差し通して保持する輪の機能を指す。「受け」によって器具としての役割を明確にした。
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: 机を担ぐ
  rationale: נשא は物を持ち上げて運ぶ意。棒を用いた運搬なので、簡潔で具体的な「担ぐ」とした。
