  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: ja
  text: 彼は、その上面、周囲の側面、角を純金で覆い、その周りに金の縁飾り[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その周りに巡らせた金の冠」。ヘブライ語は、物の周囲に巡らせた装飾的な縁または帯を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: かぶせた
  rationale: 幕屋の調度品である木製の物体を金で覆う工芸的な行為を、自然で簡潔な日本語で表す。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 金の純度と材質を端的に示す、現代日本語で定着した表現。
- source_word: גַּגּוֹ
  choice: その上面
  rationale: 通常は「屋根」を意味し得る語だが、小型の祭壇では上の表面を指すため、「上面」とした。
- source_word: קִירֹתָיו
  choice: 周囲の側面
  rationale: 直訳的な「壁」より、調度品の垂直面を指す「側面」が自然であり、סָבִיבの全周性も合わせて示す。
- source_word: קַרְנֹתָיו
  choice: 角
  rationale: 祭壇から突き出た角を指す祭儀用語であり、具体的な形状を保って訳した。
- source_word: זֵר
  choice: 縁飾り
  rationale: 物体を巡る装飾的な帯または縁を指す語として、現代の一般読者に形状と機能が伝わりやすい。「冠」という伝統的な別訳は脚注に残した。
- source_word: סָבִיב
  choice: 周囲／周り
  rationale: 対象を取り巻く全周の広がりを、文脈に応じて自然な日本語で表した。
