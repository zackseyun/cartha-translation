  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: ja
  text: そのつぼみと枝は、燭台と一体になっていた[a]。全体が、純金を打ち出して造られた一つの細工物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つぼみ」は「飾りのこぶ」とも訳せる。ヘブライ語は丸みのある装飾部分を指し、ここでは花を模した装飾として描かれている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: その飾りのこぶ
  rationale: כַּפְתּוֹרは燭台の花を模した装飾に属する丸い部分を指す。「つぼみ」と断定せず、形状と装飾性を自然な日本語で表した。
- source_word: וּקְנֹתָם
  choice: と枝
  rationale: קָנֶהは本来「葦、茎」を指し、この燭台では左右に伸びる部分なので「枝」が最も自然である。
- source_word: מִמֶּנָּה הָיוּ
  choice: 燭台と一体になっていた
  rationale: 直訳は「それから出ていた／それから成っていた」。別部品ではなく本体と同じ素材から一体に造られた意味を明確にした。
- source_word: כֻּלָּהּ
  choice: その全体が
  rationale: 女性単数の接尾辞が指す燭台全体を包括的に表す。
- source_word: מִקְשָׁה אַחַת
  choice: 打ち出して一つに造られていた
  rationale: מִקְשָׁהは金属を槌で打ち延ばして成形した細工、אַחַתはその一体性を示すため、製法と一体構造の双方を表した。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 幕屋の記事における標準的かつ簡潔な訳語。
