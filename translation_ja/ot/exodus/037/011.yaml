  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: ja
  text: 彼はそれに純金をかぶせ、その周囲に金の縁飾り[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「金の縁」または伝統的に「金の冠」。
    reason: זֵרは、周囲をめぐる装飾的な縁、帯、冠状部分などを指し得るため。
lexical_decisions:
- source_word: וַיְצַף אֹתוֹ
  choice: 彼はそれに……をかぶせ
  rationale: צפהは、幕屋の調度品に金属の薄板をかぶせる加工を指す。「かぶせる」は職人仕事の文脈に合い、対象を表すאֹתוֹも「それに」として保持する。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 高い純度の金を表す定着した自然な日本語。
- source_word: וַיַּעַשׂ לוֹ
  choice: その……に……を作った
  rationale: לֹוが示す、先行する机のために付属物を作ったという関係を、日本語では「その周囲に」によって自然に表す。
- source_word: זֵר זָהָב
  choice: 金の縁飾り
  rationale: זֵרはここでは机を囲む装飾的な縁または帯状部分を指す。「縁飾り」は形状と装飾性を自然に伝えつつ、具体的構造を断定しすぎない。
- source_word: סָבִיב
  choice: 周囲に
  rationale: 対象を全周にわたって囲む意味を簡潔な現代日本語で表す。
