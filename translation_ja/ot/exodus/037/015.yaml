  text: 彼は、机を運ぶための棒をアカシア材で作り、金をかぶせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作り
  rationale: ワウ継続法によって次の制作工程を述べる。日本語では主語を補い、後続動作へ自然につなげた。
- source_word: הַבַּדִּים
  choice: 棒
  rationale: 聖所の備品を担いで運ぶための長い棒を指す。現代日本語で簡潔かつ明瞭な「棒」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 樹種と材料であることを自然に表す。
- source_word: וַיְצַף אֹתָם זָהָב
  choice: 金をかぶせた
  rationale: 工芸の文脈で、表面を金で覆うことを表す。平明な現代語として「金をかぶせた」を採用した。
- source_word: לָשֵׂאת
  choice: 運ぶための
  rationale: 不定詞が棒の用途・目的を示すため、その関係が明確になる形で訳した。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 幕屋の備品である שֻׁלְחָן を、現代日本語で自然な「机」とした。文脈上の限定を加えず、定冠詞は既知の対象として表現した。
