  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: ja
  text: 彼はアカシア材で担ぎ棒を作り、それらに金をかぶせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作り
  rationale: עשהのワッイックトール形で、連続する過去の行為を表す。日本語では文脈上の主語を「彼」として示し、後続動作へ自然につなぐため連用形とした。
- source_word: הַבַּדִּים
  choice: 担ぎ棒
  rationale: 幕屋の祭具を運ぶための棒を指すため、単なる「棒」より用途が明確な「担ぎ棒」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材で
  rationale: 材料を示す構文であり、現代日本語の木工表現として自然な「アカシア材で」とした。
- source_word: וַיְצַף
  choice: かぶせた
  rationale: 工芸の文脈でצפהは素材を表面に施すことを表す。「覆った」より金属加工として自然で、一般読者にも分かりやすい。
- source_word: אֹתָם
  choice: それらに
  rationale: 複数の担ぎ棒を受ける目的語代名詞。日本語では、金を施す対象を自然に示すため「それらに」とした。
- source_word: זָהָב
  choice: 金を
  rationale: צפהで表面に施す素材を示す。日本語では「金をかぶせた」と表現するのが自然である。
