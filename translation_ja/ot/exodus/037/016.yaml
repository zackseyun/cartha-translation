  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: ja
  text: 彼は、机の上にある器具、すなわち、その皿[a]、杯、注ぎ器、および注ぎの供え物を注ぐために用いる鉢を、純金で作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」「杯」「注ぎ器」「鉢」と訳した器名の幾つかは、用例が少ないか文脈に特有の語であり、正確な形状や用途は確定できない。別訳「大皿、小鉢、瓶、鉢」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: 器具
  rationale: 広く道具や器を指す語。ここでは机に属する複数種の祭具を自然に総称できる。
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: 机の上に置く
  rationale: 直訳は「机の上にある」。日本語では用途を示す連体修飾として自然に表しつつ、「机の上」という原文の像を保った。
- source_word: קְעָרֹתָיו
  choice: その皿
  rationale: 皿または浅い器を指す語であり、食卓用の器という文脈に合う。接尾辞の単数男性所有を「その」で表した。
- source_word: כַּפֹּתָיו
  choice: 杯
  rationale: 本来「手のひら」に関連し、文脈により匙や小鉢なども表し得る。ここでは机の祭具としての小型容器を、簡潔で理解しやすい「杯」とした。
- source_word: מְנַקִּיֹּתָיו
  choice: 水差し
  rationale: まれな器名で厳密な形状は不確かだが、液体を入れたり注いだりする器を表す語と考えられるため、現代日本語で明瞭な「水差し」とした。
- source_word: הַקְּשָׂוֹת
  choice: 鉢
  rationale: 注ぎの供え物に関係する容器。ほかの器名との区別を保ち、ある程度広い形状を許す語として「鉢」を選んだ。
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: 注ぎの供え物を注ぐための
  rationale: נסך のホファル形は注ぎ出す祭儀を表す。日本語では用途表現にして自然に訳し、「注ぎの供え物」を補って祭儀的意味を明示した。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 列挙された器具の材質を示す句。日本語の製作表現として自然な「純金で作った」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祭具の列挙には簡潔で品位ある語を選んだ。器名の不確かさは本文で過度に限定せず、脚注で明示した。
