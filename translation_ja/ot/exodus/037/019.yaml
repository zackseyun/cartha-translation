base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: ja
  text: ある枝には、アーモンドの花をかたどった杯が三つ、こぶと花があった。また、別の枝にも、アーモンドの花をかたどった杯が三つ、こぶと花があった[a]。燭台から伸び出る六本の枝は、すべてこのようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「こぶ」は、燭台に施された丸い装飾部分を指す。「節」とも訳されることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: 杯
  rationale: 燭台に施された杯状の装飾を指す。現代日本語で形状を簡潔に伝え、過度に専門的な語を避けた。
- source_word: מְשֻׁקָּדִים
  choice: アーモンドの花の形をした
  rationale: アーモンドを模した意匠を表す語。文脈上の花模様を自然かつ明確に示した。
- source_word: קָנֶה
  choice: 枝
  rationale: 燭台の中央部から左右へ伸びる部分を指すため、「管」よりも形状と文脈に即した「枝」とした。
- source_word: כַּפְתֹּר
  choice: 節
  rationale: 丸く膨らんだ装飾部分を指す。植物を模した燭台の描写とのつながりを保つため「節」としたが、「こぶ」とも訳し得る。
- source_word: פֶרַח
  choice: 花
  rationale: 花形の装飾を指す一般的で明瞭な語として採用した。
- source_word: כֵּן
  choice: みなこのように作られていた
  rationale: 先に述べた意匠が六本すべてに共通することを、自然な日本語で明示した。
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: 燭台から出る
  rationale: 枝が燭台本体から伸び出ているという原文の空間的イメージを簡潔に保った。
- source_word: מְנֹרָה
  choice: 燭台
  rationale: 一般読者に理解しやすい定着した訳語であり、音写の「メノラー」より本文の器具を直接伝える。
