  to: ある枝には、アーモンドの花をかたどった杯が三つ、こぶと花があった。また、別の枝にも、アーモンドの花をかたどった杯が三つ、こぶと花があった[a]。燭台から伸び出る六本の枝は、すべてこのようであった。
