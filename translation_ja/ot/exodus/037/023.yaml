  text: また、その七つのともしび皿、芯を扱うはさみ[a]、および受け皿[b]を、純金で作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「芯切りばさみ」とも訳せる。ヘブライ語は、灯火の芯を扱うための器具を指す。
    reason: lexical_alternative
  - marker: b
    text: 「火皿」とも訳せる。この文脈では、燭台に付属する小さな容器または皿を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: また、作った
  rationale: 継続する物語を示す接続辞付き未完了形。日本語では文脈の連続性を「また」で示し、動詞は自然な過去形とした。
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: その七つのともしび皿
  rationale: נֵרוֹתは燭台そのものではなく、油を入れて灯す器を指す。女性単数接尾辞は直前の燭台を受けるため「その」とし、数詞は自然な日本語の語順にした。
- source_word: מַלְקָחֶיהָ
  choice: 芯を扱う火ばさみ
  rationale: 灯火の芯を扱うための器具を指す語。「火ばさみ」だけより用途が伝わりやすく、芯切りばさみという限定的解釈は脚注に残した。
- source_word: מַחְתֹּתֶיהָ
  choice: 受け皿
  rationale: 語義には火皿、炭入れ、受け皿などがあるが、ここでは燭台に付属する小型の容器と考えられるため、祭壇用具を連想させすぎない「受け皿」とした。語義の幅は脚注で示した。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 器具の材質を表す句。日本語では製作動詞に自然につながる「純金で」とした。
