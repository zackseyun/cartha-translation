  naturalness: 「こぶ」は日常語では身体の腫れや衝突でできた隆起を強く連想させ、燭台の意匠の記述としてはやや不自然である。「丸い飾り」は明快で、物品の描写として自然である。また、名詞句の反復を「…が一つあった」として日本語の文として整える。
