  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: ja
  text: 燭台から出る二本の枝の下に丸い飾りが一つあり、燭台から出る二本の枝の下に丸い飾りが一つあり、燭台から出る二本の枝の下に丸い飾りが一つあった。これは、燭台から出る六本の枝のためのものであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: こぶ
  rationale: 燭台に施された丸く膨らんだ装飾部分を指す。現代日本語では形状を簡潔に伝えられ、「節」より装飾的な隆起であることが明確である。
- source_word: תַּחַת
  choice: 下に
  rationale: 二本ずつ一組の枝に対する装飾の位置を直接的かつ自然に示す。
- source_word: שְׁנֵי הַקָּנִים
  choice: 二本の枝
  rationale: מְנֹרָהから左右へ伸びる部分を指し、植物を思わせる造形にも合う定着した表現である。
- source_word: מִמֶּנָּה
  choice: そこから出る
  rationale: 女性単数代名詞の指示対象を燭台と理解しつつ、直前の文脈を受ける「そこ」で過度な明示化を避けた。日本語では分詞句と合わせて枝の由来を自然に表す。
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: 六本の枝に対応する
  rationale: 三つのこぶが二本ずつの枝に対応するという総括的・配分的関係を明確にする。単なる目的を表す「六本の枝のため」より文脈に即している。
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: そこから出る
  rationale: 枝が燭台本体から張り出す動きを平明に保つ。
