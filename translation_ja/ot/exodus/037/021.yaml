translation_notes:
  register: 幕屋の製作記録にふさわしい簡潔で品位ある叙述とした。ヘブライ語の三度の反復は保持しつつ、日本語で各二本が別の組であることが分かるよう「別の」を補った。節末の総括句は独立文にして関係を明瞭にした。
