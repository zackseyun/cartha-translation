  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: ja
  text: ベツァルエルはアカシア材で箱[a]を作った。長さは二キュビト半、幅は一キュビト半、高さは一キュビト半であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「櫃」とも訳せる。ヘブライ語は一般に箱や櫃を指すが、ここでは幕屋に置かれる聖なる箱を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 作った
  rationale: 動詞 עשה の基本的な意味を、余分な技巧の含意を加えず自然な現代日本語で表した。
- source_word: בְּצַלְאֵל
  choice: ベツァルエル
  rationale: ヘブライ語の人名を、日本語で読みやすい形に音写した。
- source_word: הָאָרֹן
  choice: 箱
  rationale: אָרוֹן は箱・櫃を指す語であり、この幕屋の文脈では聖なる箱を指す。「聖櫃」より一般の読者に明瞭で、原語の語義も保つ「箱」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材で
  rationale: 材料を表す構文として自然な日本語にし、木材であることを明確にした。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二キュビト半
  rationale: 古代の尺度を換算せず保持し、数量表現を簡潔で自然な日本語にした。
- source_word: אָרְכּוֹ
  choice: 長さは
  rationale: 接尾代名詞が指す箱を日本語では文脈上省略し、寸法の列挙として自然に表した。
- source_word: וְאַמָּה וָחֵצִי
  choice: 一キュビト半
  rationale: 幅と高さの双方について、原文の同一の寸法を自然な日本語で表した。
- source_word: רָחְבּוֹ
  choice: 幅は
  rationale: 物体の横方向の寸法を表す現代日本語として明瞭である。
- source_word: קֹמָתוֹ
  choice: 高さは
  rationale: 物体の垂直方向の寸法を文脈に即して明瞭に表した。
