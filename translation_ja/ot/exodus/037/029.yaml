  text: וַ/יַּ֜עַשׂ אֶת שֶׁ֤מֶן הַ/מִּשְׁחָה֙ קֹ֔דֶשׁ וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים טָה֑וֹר מַעֲשֵׂ֖ה רֹקֵֽחַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: ja
  text: 彼は、聖なる注ぎの油と、香料で作った純粋な香[a]を、調合師の仕事として作った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「香料の香、純粋なもの」。香料となる芳香物から作られる香を指す。「香料の香」「香り高い香」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「調合師の技によって」または「調合師が調合した」。原文は、専門の職人による巧みな調製を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: 完了した出来事を続けて語るワイイクトール形。日本語では自然な過去形とし、物語の順序は文脈に委ねた。
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: 聖なる注ぎの油
  rationale: 聖別のために注ぐ油であり、קֹדֶשׁ が示す神聖な用途を、明瞭で簡潔な表現にした。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香料の香
  rationale: 字義は香料・芳香物から作る香を指す。「香料の香」は原文の構造と芳香物の要素を保つ。
- source_word: טָהוֹר
  choice: 純粋な
  rationale: 祭儀用の物の純正さ・清さを表す語であり、この文脈では「純粋な」が自然である。
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: 調香師の技によって
  rationale: 香料を専門的に調合する職人の仕事を表す。名詞句を自然な日本語にしつつ、熟練した技による製作という含みを保った。
theological_decisions:
- issue: מַעֲשֵׂה רֹקֵחַ が修飾する範囲
  choice: 注ぎの油と香の両方を、調香師の技によって作ったと読める語順にした。
  alternative: 直前の香だけを「調香師の技によるもの」と限定する。
  rationale: 原文では二つの目的語の後にこの句が置かれており、両方にかかる読みが自然だが、明示的な「いずれも」は加えず、原文の統語上の余地を狭めないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、幕屋製作の記事にふさわしい簡潔で格調ある文体とした。「香」は祭儀でたく香を指し、「調香師」は香料を専門に混ぜ合わせる職人を表す。
