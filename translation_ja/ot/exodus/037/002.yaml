source:
  edition: WLC
  text: וַ/יְצַפֵּ֛/הוּ זָהָ֥ב טָה֖וֹר מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/002.yaml
  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: ja
  text: 彼はその内側にも外側にも純金をかぶせ、その周囲に金の縁飾り[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「周囲を巡る金の縁」または「周囲の金の飾り縁」とも訳せる。ヘブライ語の זֵר は、物体の周囲を巡る装飾的な縁を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: 彼は…純金をかぶせ
  rationale: ピエル形の צפה は、工芸の文脈で物体の表面を金属で覆うことを表す。「かぶせる」は、単なる一般的な覆いではなく金張りの施工を自然な現代日本語で伝える。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 金の純粋さを表す定着した自然な訳語であり、幕屋の工芸品という文脈にも適する。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 内側にも外側にも
  rationale: 対象物の内面と外面の双方を明確に表す。助詞「にも」を反復し、両方を覆ったことを自然に強調した。
- source_word: וַיַּעַשׂ לוֹ
  choice: その…に…を作った
  rationale: לֹו の間接目的語を、日本語では対象物を指す「その周囲に」に組み込み、何のため・どこに作ったかを明確にした。
- source_word: זֵר זָהָב
  choice: 金の縁飾り
  rationale: זֵר はこの工芸文脈で物体を巡る装飾的な縁を指す。「縁飾り」は単なる境界線より立体的・装飾的な部材であることを示しつつ、「冠」と過度に限定しない。
- source_word: סָבִיב
  choice: その周囲に
  rationale: 対象物をぐるりと取り囲む配置を簡潔で自然な日本語で表した。
