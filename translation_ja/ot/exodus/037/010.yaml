  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: ja
  text: 彼はアカシア材で机を作った。長さは二アンマ[a]、幅は一アンマ、高さは一アンマ半であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一アンマは、およそ四十五センチ。
    reason: 古代の尺度を現代の読者が概算できるようにするため。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作った
  rationale: 物語を進めるワウ継続法を自然な現代日本語の過去形で表した。文脈上の動作主を「彼」として明示した。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 幕屋の備品としての卓を指す。現代日本語で明瞭な「机」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: シッティームの木を指す構文を、樹種と材料の両方が自然に伝わる表現にした。
- source_word: אַמָּתַיִם
  choice: 二アンマ
  rationale: 古代の尺度を近代単位へ換算せず、原文の歴史的単位を保持した。単位の概略は脚注で示した。
- source_word: אָרְכּוֹ
  choice: 長さ
  rationale: 机の長辺方向の寸法を示す語として自然で正確である。
- source_word: וְאַמָּה רָחְבּוֹ
  choice: 幅は一アンマ
  rationale: 接尾辞が机を指すことを、日本語では主題提示によって自然に表した。
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: 高さは一アンマ半
  rationale: 原文の「一アンマと半分」という寸法を、意味を変えず簡潔な現代日本語にした。
theological_decisions: []
translation_notes:
  register: 簡潔な製作記録としての調子を保ち、寸法を並列的で読みやすい現代標準日本語にした。「アンマ」は原語に即した歴史的尺度として保持し、初出箇所に換算の目安を付した。英語相談層の脚注は付置位置と内容が一致していないため、そのまま継承せず、ヘブライ語本文に基づく有用な尺度注に改めた。
