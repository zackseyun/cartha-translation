  text: וַ/יַּ֥עַשׂ אֶת הַ/מְּנֹרָ֖ה זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה עָשָׂ֤ה אֶת הַ/מְּנֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: ja
  text: 彼は純金で燭台を作った。彼はその燭台を打ち出し細工[a]で作った。その台座と軸、杯、つぼみ[b]、花は、燭台と一体であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「槌で打って作った」。ヘブライ語は、金属を打って形作る細工を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「飾り玉」。ヘブライ語は、丸く突き出た装飾を指す。燭台全体の植物的な意匠に合わせて、本文では「つぼみ」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: 燭台
  rationale: 単独のともしびではなく、枝を持つ祭儀用の灯火台全体を指すため、日本語聖書で定着し、形状も簡潔に示す「燭台」とした。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 物質についての טָהוֹר は精錬された純粋さを表すため、自然で正確な「純金」とした。
- source_word: מִקְשָׁה
  choice: 打ち出し細工
  rationale: 金属を槌で打って形作る製法を表す語であり、取り付け部品を組み合わせた物ではないことを示す表現として選んだ。
- source_word: יְרֵכָהּ
  choice: その台座
  rationale: 字義的には「腿、側面」だが、この器具では下部の支えを指すため「台座」とした。
- source_word: קָנָהּ
  choice: その軸
  rationale: ここでは燭台中央の構造部分を指す単数形なので、枝と混同しない「軸」とした。
- source_word: גְּבִיעֶיהָ
  choice: 杯
  rationale: 杯形の装飾部分を指すため、簡潔な「杯」とした。
- source_word: כַּפְתֹּרֶיהָ
  choice: つぼみ
  rationale: 丸く突き出た装飾を指す語。植物を模した全体意匠とのつながりを保つため「つぼみ」とし、「飾り玉」という形状中心の訳も注記した。
- source_word: פְרָחֶיהָ
  choice: 花
  rationale: 植物意匠の開花部分を指し、「つぼみ」と自然に対になる明快な語を用いた。
- source_word: מִמֶּנָּה הָיוּ
  choice: 燭台と一体であった
  rationale: 各部分が別に取り付けられたのではなく、本体から一体として作られたことを自然な日本語で示した。
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: 作った……作った
  rationale: 原文における עשה の反復を保ち、不要な言い換えを避けた。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭具の記述にふさわしい簡潔で格調ある調子を保った。「打ち出し細工」はやや専門的なため脚注で平明に説明し、原文の二度の「作った」と部品列挙の構造を保持した。
