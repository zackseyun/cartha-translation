lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は……作り
  rationale: עשהのQalワイイクトルで、物語を進める「そして彼は作った」。日本語では文脈上、連続動作として「作り」とするのが自然である。
- source_word: בַּדֵּי
  choice: 担ぎ棒
  rationale: 幕屋関連の文脈では、聖具を運ぶための棒を指す。単なる「棒」より用途が明確で、現代日本語として理解しやすい。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: アカシアの木材を表す連語。「アカシア材」は簡潔で自然な現代日本語である。
- source_word: וַיְצַף
  choice: かぶせた
  rationale: 工芸の文脈で、ある素材の表面を金で覆うことを表す。「金をかぶせる」は自然で分かりやすく、鍍金という特定技法までは断定しない。
- source_word: אֹתָם
  choice: それらに
  rationale: 複数形の目的語代名詞で、直前の複数の担ぎ棒を受ける。日本語でも指示対象を保つため「それらに」と明示した。
- source_word: זָהָב
  choice: 金
  rationale: 表面を覆う材料である金を指す。「金をかぶせた」という日本語の構文で自然に表した。
