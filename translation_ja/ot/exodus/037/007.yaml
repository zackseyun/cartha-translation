- source_word: עָשָׂה אֹתָם
  choice: これらを作った
  rationale: 原文における動詞「作る」の反復を保ち、後半が製法と位置を説明していることを示した。
- source_word: מִשְּׁנֵי קְצוֹת
  choice: 両端から
  rationale: 前置詞מִןの起点・由来の意味を保ち、ケルビムが蓋の両端から打ち出されたことを表した。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱を覆う物であり、贖いと結びつく祭儀用語であることを、現代の読者に分かる形で表した。
theological_decisions:
- issue: 幕屋の文脈におけるהַכַּפֹּרֶתの訳語
  choice: 贖いの蓋
  alternative: 贖いの座、贖罪所
  rationale: 実物が契約の箱の蓋であることと、贖いに関わる祭儀的な意味の双方を明示した。「座」「所」という伝統的表現も可能なので脚注に残し、特定の教派的解釈に限定しなかった。
