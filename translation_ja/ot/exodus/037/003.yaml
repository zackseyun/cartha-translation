  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: ja
  text: 彼はそのために金の輪を四つ鋳造した。それはその四つの脚[a]の上にあり、一方の側に二つ、もう一方の側に二つあった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「四隅」または「四つの支え」とも訳せる。ヘブライ語は、足、下端部、支えとなる箇所を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 鋳造し
  rationale: 金属加工の文脈で、溶かした金属を型に流して作ることを表すため、「鋳造する」が正確で自然。
- source_word: לוֹ
  choice: そのために
  rationale: 接尾辞は文脈上、直前の契約の箱を指す。日本語では性を示さず「そのために」とするのが自然。
- source_word: טַבְּעֹת זָהָב
  choice: 金の輪
  rationale: 素材を示す自然な現代日本語で、ヘブライ語の意味を簡潔に伝える。
- source_word: פַּעֲמֹתָיו
  choice: その四つの脚
  rationale: 語は足・下端・支持点を意味し得る。この家具の下部にある取り付け箇所として「脚」を本文に採用し、曖昧さは脚注に残す。
- source_word: צַלְעוֹ
  choice: 側
  rationale: 物体の面または側部を表す一般的で自然な訳語。
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: 一方の側……もう一方の側
  rationale: 字義的には「一つの側……第二の側」だが、対になる二側を自然な日本語で表す。
