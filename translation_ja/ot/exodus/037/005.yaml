  language: ja
  text: 彼は、箱を運ぶために、箱の側面にある輪に棒を通した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 通した
  rationale: 基本義は「来る／持って来る」だが、ここでは棒を輪の中に入れる動作を表す使役形であり、日本語では「輪に棒を通した」が自然で具体的である。
- source_word: הַבַּדִּים
  choice: 棒
  rationale: 聖なる調度を運ぶための棒を指す。現代日本語で明瞭な「棒」とした。
- source_word: בַּטַּבָּעֹת
  choice: 輪に
  rationale: 前置詞 ב はこの文脈で、棒を輪の内部へ通すことを示す。「輪に」とすれば「通した」と自然に結びつく。
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: 箱の両側にある
  rationale: צְלָעוֹת は箱の側面を指す。複数形と構造上の配置を自然に表すため「両側」とした。
- source_word: הָאָרֹן
  choice: 箱
  rationale: אָרוֹן はここでは幕屋の聖なる箱を指す。日本語では簡潔で内容を直接示す「箱」を採用した。
- source_word: לָשֵׂאת
  choice: 担ぐため
  rationale: 不定詞は目的を表す。棒を用いて肩で運ぶ構造を踏まえ、「運ぶ」より具体的な「担ぐ」とした。
