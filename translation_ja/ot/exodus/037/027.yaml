  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: ja
  text: また彼は、その縁飾り[a]の下、その二つの側板の上、その二つの側[b]に、金の輪を二つ、棒を通してこれを運ぶための受けとして作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その飾り縁」。ヘブライ語は、上部を巡る装飾的な縁を指します。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、「その二つの側板の上、その二つの側に」という近い表現が重ねられています。両句の厳密な関係は明示されていないため、本文でも反復を保っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: また……金の輪を二つ
  rationale: 接続詞を「また」とし、幕屋の備品製作が続く叙述を自然に示した。טבעת は運搬用の金具として通常の「輪」、זהב は材質を表す「金の」とした。
- source_word: עָשָׂה לוֹ
  choice: これに……作った
  rationale: 接尾辞は文脈上、香の祭壇を指す。日本語では目的物を明瞭にするため「これに」と表現した。
- source_word: מִתַּחַת לְזֵרוֹ
  choice: その縁飾りの下
  rationale: זֵר は祭具上部を巡る装飾的な縁を指す。「冠」では別個の王冠を連想させうるため、形状と装飾性を伝える「縁飾り」を採用した。
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: その二つの側板の上
  rationale: צלע は「脇、側面、肋、側部材」を表しうる。ここでは祭壇の構造部分とみて「側板」とし、後続の צד「側」との語の違いも保った。前置詞 עַל は位置関係を過度に解釈せず「上」とした。
- source_word: עַל שְׁנֵי צִדָּיו
  choice: すなわちその両側に
  rationale: 直訳的には「その二つの側に」。直前の類似表現を消さず、同じ配置を言い換えて明確にする反復と理解して「すなわち」を補った。
- source_word: לְבָתִּים לְבַדִּים
  choice: 棒を通す受け
  rationale: בַּיִת の複数形は字義的には「家々」だが、ここでは棒を収める受け・差し込み部を意味する。日本語では機能が明瞭な「受け」とした。בַּדִּים は祭具運搬用の「棒」。
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: これを担ぐための
  rationale: 不定詞の目的と בָּהֶם の手段を自然な日本語にまとめた。「これ」は祭壇を指し、運搬の動作には「担ぐ」を用いた。
