  register: 明快で格調を保った現代標準日本語。寸法の列挙は原文の順序を保ちながら、日本語として読みやすい一文に整えた。「角」は祭壇の四隅に設けられた突起を指す。英語相談層の脚注は本文中の位置と内容が対応していないため採用せず、原文理解に有用な尺度注を付した。
