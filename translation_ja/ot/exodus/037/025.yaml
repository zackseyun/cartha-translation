base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: ja
  text: 彼は香の祭壇をアカシア材で作った。長さ一キュビト、幅一キュビトの正方形で、高さは二キュビトであった。その角は祭壇と一体になっていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 彼は作った
  rationale: 物語を進めるワウ継続法を自然な日本語の過去形で表した。主語は文脈上、幕屋の器具を製作している人物を指す。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香の祭壇
  rationale: 直訳的には「香の祭壇」。簡潔で自然な表現にしつつ、香をたくための祭壇という祭儀上の用途を保った。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 現代の読者に分かりやすい一般的な樹種名を用い、複合的な材料表現として自然な「材」とした。
- source_word: אַמָּה
  choice: キュビト
  rationale: 古代の尺度を換算値に置き換えず保持し、概算は脚注で示した。
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 長さと幅が等しいという寸法記述に即し、平面形状を自然な日本語で明示した。
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: その角は祭壇と一体になっていた
  rationale: 角が別に取り付けられたのではなく、祭壇本体から連続して作られていたという構造を明瞭に表した。
theological_decisions: []
