  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: ja
  text: というのも、ファラオの馬[a]が、その戦車と騎兵とともに海に入り、ヤハウェが海の水を彼らの上に戻したからである。一方[b]、イスラエルの人々は海の中の乾いた地を歩いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「馬」と「戦車」は原文では単数形ですが、ファラオの騎馬・戦車部隊を集合的に指している可能性があります。
    reason: lexical_alternative
  - marker: b
    text: 「一方」と訳した語は、原文では単に「そして」です。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 〜すると
  rationale: 直前の歌の内容を出来事によって説明する接続語。日本語では文頭の「なぜなら」より、出来事の展開を示す「〜すると」が自然である。
- source_word: סוּס פַּרְעֹה
  choice: ファラオの馬
  rationale: 原文の単数形を保ちつつ、文脈上はファラオ軍の馬を集合的に指し得る表現として訳した。
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: その戦車と騎兵とともに
  rationale: 「戦車」は形態上単数だが戦車隊を集合的に表し得る。「騎兵」は馬に乗る戦士を簡潔に示す。
- source_word: וַיָּשֶׁב יְהוָה
  choice: ヤハウェは…戻された
  rationale: 使役形による神の働きを明示し、敬意ある現代日本語として尊敬表現を用いた。
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: 海の水を彼らの上に
  rationale: 水がエジプト軍を覆う具体的な位置関係を原文に沿って表した。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 一方、イスラエルの人々は
  rationale: 接続詞は直訳すれば「そして」だが、前半との明確な対照を自然な日本語で示した。「イスラエルの子ら」より現代の一般読者に分かりやすい。
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: 海の中の乾いた地面を歩いた
  rationale: 「歩いた」という通常の動詞と、乾いた海底という具体的な情景を保持した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を音写し、普通名詞的な称号へ置き換えなかった。
- issue: 接続詞 וּ の対照的理解
  choice: 一方
  alternative: そして
  rationale: 原語自体は単純な接続を示すため、その曖昧さを脚注で明示しつつ、本文ではエジプト軍とイスラエルの人々の対照を自然に表した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の集合的単数と接続詞の幅を脚注に残し、本文では情景と対照が自然に伝わるようにした。
