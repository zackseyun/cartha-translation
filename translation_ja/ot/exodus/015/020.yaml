  text: וַ/תִּקַּח֩ מִרְיָ֨ם הַ/נְּבִיאָ֜ה אֲח֧וֹת אַהֲרֹ֛ן אֶת הַ/תֹּ֖ף בְּ/יָדָ֑/הּ וַ/תֵּצֶ֤אןָ כָֽל הַ/נָּשִׁים֙ אַחֲרֶ֔י/הָ בְּ/תֻפִּ֖ים וּ/בִ/מְחֹלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: ja
  text: そこで、アロンの姉妹である女預言者ミリアムは、タンバリンを手に取った。すると、女たちは皆、タンバリンを手に、踊りながら[a]彼女の後について出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「踊りとともに」。ヘブライ語の名詞は、踊る活動とも、複数の踊りとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: その時、…手に取った
  rationale: ワウ継続法による物語の進展を、現代日本語で自然な順接として表した。
- source_word: מִרְיָם
  choice: ミリアム
  rationale: ヘブライ語名の日本語における一般的な音写を用いた。
- source_word: הַנְּבִיאָה
  choice: 預言者である
  rationale: 女性形の名詞だが、現代日本語の「預言者」は男女を問わず用いられる。ミリアムが女性であることは固有名と文脈から明確であり、不自然な「女性預言者」は避けた。
- source_word: אֲחוֹת אַהֲרֹן
  choice: アロンの姉
  rationale: ヘブライ語は年長・年少を区別しない「姉妹」だが、ミリアムがアロンより年長であるという物語上の理解に沿い、日本語として自然な「姉」とした。原文どおり、モーセではなくアロンとの関係を保持した。
- source_word: הַתֹּף
  choice: タンバリン
  rationale: תֹףは手に持つ枠太鼓類を指す。「タンバリン」は現代の一般読者に最も理解しやすいが、現代楽器と細部まで同一とは限らない。
- source_word: בְּיָדָהּ
  choice: 手に
  rationale: 位置・保持を表す前置詞句を簡潔で自然な日本語にした。
- source_word: וַתֵּצֶאןָ
  choice: 出て行った
  rationale: יצאの基本的な移動の意味と、語り手から見た方向を保持した。
- source_word: כָל הַנָּשִׁים
  choice: 女たちは皆
  rationale: 原文が明示する女性の集団と全体性をそのまま表した。
- source_word: אַחֲרֶיהָ
  choice: 彼女の後について
  rationale: 単なる位置関係だけでなく、ミリアムに従って進む行列の含意を自然に表した。
- source_word: בְּתֻפִּים
  choice: タンバリンを鳴らし
  rationale: 道具を伴うことを表す前置詞句を、日本語では楽器の通常の動作を補って自然に表現した。
- source_word: וּבִמְחֹלֹת
  choice: 踊りながら
  rationale: מְחֹלֹתは祝祭的な踊り、または踊る活動を表す。日本語では動作として表すのが自然である。
