  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: ja
  text: 'ヤハウェよ、あなたの右の手は、力において威厳に満ちている[b]。


    ヤハウェよ、あなたの右の手は、敵を打ち砕く[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「力において栄光に輝く」または「力において壮麗である」。
    reason: lexical_alternative
  - marker: c
    text: または「敵を押しつぶす」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: あなたの右の手
  rationale: 「右手／右側」を表す語。神の力と勝利の働きを示す詩的比喩を、具体的な身体像のまま保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。呼びかけなので「ヤハウェよ」とした。
- source_word: נֶאְדָּרִי
  choice: 威厳に満ちている
  rationale: 威厳、栄光、壮麗さを表す語。「力において」と自然につながり、格調ある詩的表現となるようにした。
- source_word: בַּכֹּחַ
  choice: 力において
  rationale: 前置詞בを伴う「力／強さ」。力という点で右手が威厳に満ちるという関係を明示し、道具的な意味に限定しなかった。
- source_word: תִּרְעַץ
  choice: 打ち砕く
  rationale: 砕く、押しつぶすという激しく決定的な動作を表す。勝利の歌にふさわしい力強さと、未完了形の描写的な響きを保った。
- source_word: אוֹיֵב
  choice: 敵
  rationale: 形は単数であり、文脈ではエジプトという敵対勢力を集合的にも指し得る。日本語の「敵」はその両方を無理なく含む。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を直接用いているため、固有名として音写した。伝統的な代替表現も注で示した。
- issue: 神の「右の手」の比喩
  choice: 身体像を保って「右の手」と訳す
  alternative: 御力
  rationale: 神の勝利の力を意味する比喩だが、抽象語に置き換えず、歌の並行法と具体的な詩的イメージを保持した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、勝利の歌にふさわしい格調を保った。原文の二行にわたる「あなたの右の手は、ヤハウェよ」という反復をそのまま生かし、説明的な言い換えは避けた。
