base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: ja
  text: 彼らはマラ[a]に着いたが、マラの水が苦かったので、飲むことができなかった。そこで、その場所はマラと名づけられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マラ」という名は、ヘブライ語の「苦い」という語にかけている。
    reason: 地名マラと、水が「苦い」という説明とのヘブライ語の語呂合わせを示すため。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 一行が…着いた
  rationale: 物語を進める連続形を、自然な日本語の叙述で表した。直前までの集団を受ける複数主語は「一行」で明示した。
- source_word: מָרָתָה
  choice: マラに
  rationale: 方向を示す語尾を、日本語では到着点を示す助詞「に」で自然に表した。地名は音写した。
- source_word: וְלֹא יָכְלוּ לִשְׁתֹּת
  choice: 飲むことができなかった
  rationale: יכולתの不可能の意味を明確に表し、接続詞は到着との対照を示す「が」とした。
- source_word: מַיִם מִמָּרָה
  choice: マラの水
  rationale: מןは水の出所を示すが、日本語では「マラの水」が簡潔で自然であり、その場所にある水を指すことも明瞭である。
- source_word: כִּי מָרִים הֵם
  choice: 水は苦くて
  rationale: מַיִםを受ける複数表現を、日本語の集合的な「水」に合わせて表した。כִּיの理由関係は、自然な因果接続「苦くて」で保持した。
- source_word: עַל כֵּן
  choice: それで
  rationale: 命名の理由を導く推論・結果を、明快な現代日本語で表した。
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: その場所はマラと名づけられた
  rationale: 動詞の主語が明示されない命名表現を受動形で訳した。接尾辞の女性単数が指す場所を「その場所」と明示し、不自然な「その名を呼んだ」を避けた。
- source_word: מָרָה / מָרִים
  choice: マラ／苦い
  rationale: 固有名は「マラ」と音写し、形容詞は「苦い」と訳した。語呂合わせは脚注で説明する。
