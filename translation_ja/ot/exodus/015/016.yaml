reference: Exodus 15:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: ja
  text: '恐怖とおののきが彼らに襲いかかる。


    あなたの力強い腕によって、


    彼らは石のように動かなくなる[a]。


    あなたの民が通り過ぎるまで[b]、ヤハウェよ、


    あなたが得たこの民[c]が通り過ぎるまで。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「黙る」または「静止する」。
    reason: lexical_alternative
  - marker: b
    text: 「通り過ぎる」は「渡る」とも訳せる。後半も同じ。
    reason: lexical_alternative
  - marker: c
    text: 「得た」は、「買い取った」、または広い契約的な意味で「ご自分のものとした」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם
  choice: 彼らに襲いかかる
  rationale: 直訳的には「彼らの上に落ちる」だが、日本語では恐怖が圧倒的に臨むことを自然に表す「襲いかかる」とした。未完了形は歌の中の予告として表現した。
- source_word: אֵימָתָה וָפַחַד
  choice: 恐怖とおののき
  rationale: 近義語を二語で重ねる詩的な強調を保ちつつ、同じ日本語にまとめず、それぞれの響きを区別した。
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: あなたの腕の大いなる力によって
  rationale: 「腕」という聖書的な力の比喩を残し、「大きさ／偉大さ」が示す強大な力を自然な日本語で表した。
- source_word: יִדְּמוּ
  choice: 動かなくなる
  rationale: 語は「静まる」「黙る」「動かなくなる」の幅を持つ。「石のように」という直後の比喩との結びつきから、身動きできない状態を本文に採用し、別の可能性を脚注に残した。
- source_word: כָּאָבֶן
  choice: 石のように
  rationale: ヘブライ語の直喩をそのまま明瞭に保った。
- source_word: עַד יַעֲבֹר
  choice: 通り過ぎるまで
  rationale: עברの一般的な移動の意味を表し、同じ句の反復を訳文でも保持した。「渡る」という可能性は脚注に示した。
- source_word: עַמְּךָ
  choice: あなたの民
  rationale: 神とイスラエルとの関係を示す所有表現をそのまま保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。呼びかけなので「ヤハウェよ」とした。
- source_word: עַם זוּ
  choice: この民
  rationale: זוּの指示的な強調を「この」で明示した。
- source_word: קָנִיתָ
  choice: あなたが得た
  rationale: קנהの基本的な意味である「得る、取得する」を簡潔に表し、「贖った」や「造った」と限定せず、文脈上の契約的な含みを残した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を称号に置き換えずに示すため。
- issue: קָנִיתָ が示す神と民との関係
  choice: あなたが得た
  alternative: あなたが買い取った／あなたがご自分のものとした／あなたが造った
  rationale: この動詞の取得・所有の語義を保ちつつ、原文にない特定の贖罪概念や創造の意味へ一義的に限定しないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、歌の並行法と反復を改行によって見える形にした。「腕」「石」の比喩は保持し、過度に古風な語法や教派固有の表現は避けた。
