  text: תְּהֹמֹ֖ת יְכַסְיֻ֑/מוּ יָרְד֥וּ בִ/מְצוֹלֹ֖ת כְּמוֹ אָֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/005.yaml
  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: ja
  text: '深い水が彼らを覆い、

    彼らは石のように深みへ下って行った。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: 深い水
  rationale: 複数形で海の深淵・深い水を指す。日本語では「深い水」が自然で、直後の別語 מְצוֹלֹת との語彙上の違いも保てる。
- source_word: יְכַסְיֻמוּ
  choice: 彼らを覆い
  rationale: 動詞 כסה と三人称男性複数接尾辞を直接反映し、海水がエジプト人たちを覆ったことを明瞭に表す。
- source_word: יָרְדוּ
  choice: 沈んだ
  rationale: 基本義は「下る」だが、水中へ下っていく文脈と石の比喩において「沈んだ」が自然で正確である。
- source_word: בִמְצוֹלֹת
  choice: 海の底へ
  rationale: מְצוֹלָה は特に海の深所を指す。移動を表す יָרְדוּ と結びつく前置詞 ב を、日本語では方向を示す「へ」で自然に訳した。
- source_word: כְּמוֹ
  choice: のように
  rationale: 比較を表す標準的で明瞭な現代日本語。
- source_word: אָבֶן
  choice: 石
  rationale: 一般名詞「石」を、冠詞を必要としない日本語の自然な直喩として訳した。
theological_decisions: []
translation_notes:
  register: 二行の詩形を用い、簡潔で荘重ながら現代の一般読者に理解しやすい表現とした。「深い水」と「海の底」により、原文の異なる二語 תְּהֹמֹת と מְצוֹלֹת を区別した。
