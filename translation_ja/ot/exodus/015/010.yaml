  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: ja
  text: あなたが風[a]を吹き出すと、海は彼らを覆った。彼らは鉛のように、力強い大水の中に沈んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「息」。ヘブライ語は「風」「息」「霊」を意味し得るが、ここでは海を渡る場面なので「風」が最もよく合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: 吹きつけると
  rationale: 「吹く、息を吐く」を表す動詞。海に対する神の直接的な働きを、詩的な力強さを保ちつつ自然な現代日本語で表した。
- source_word: בְרוּחֲךָ
  choice: ご自分の風
  rationale: רוּחַには「風、息、霊」の意味があるが、海を渡る出来事と「吹く」という動詞の組み合わせから、本文では「風」が最も適切。「ご自分の」により二人称単数の所有接尾辞を明示した。
- source_word: כִּסָּמוֹ יָם
  choice: 海は彼らを覆った
  rationale: כסהの基本義「覆う」と三人称男性複数の接尾辞を直接反映し、「圧倒した」などの解釈を加えなかった。
- source_word: צָלֲלוּ
  choice: 沈んだ
  rationale: 水中へ下っていく動きを明瞭かつ自然に表し、続く鉛の比喩ともよく対応する。
- source_word: כָּעוֹפֶרֶת
  choice: 鉛のように
  rationale: 金属の鉛が持つ重さのイメージと、ヘブライ語の直喩をそのまま保持した。
- source_word: בְּמַיִם אַדִּירִים
  choice: 力強い大水の中へ
  rationale: אַדִּירִיםの「強大な、力ある」という含意を「力強い」で保ち、複数形のמַיִםが示す豊かで圧倒的な水を日本語として自然な「大水」で表した。方向性を伴う「沈んだ」に合わせて「中へ」とした。
theological_decisions:
- issue: 神の詩的顕現の文脈におけるרוּחַの意味
  choice: 風
  alternative: 息（または霊）
  rationale: 海でのエジプト軍の敗北という直近の文脈と、「吹く」を意味する動詞との結びつきは物理的な「風」を強く示す。一方、「息」という神の擬人的な描写も語義上可能なので脚注に残し、「霊」を本文へ読み込むことは避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ご自分の風」で原文の所有表現を保ち、「力強い大水」で詩的な勢いを伝えた。
