source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: ja
  text: 主よ、神々の中で、だれがあなたのようでしょうか。だれがあなたのように、聖さにおいて威厳に満ち、賛美の中で畏れられ、驚くべきことを行う方でしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: 神々の中で
  rationale: אֵלִם の複数形をそのまま保ち、比較の範囲を明示した。文脈上の存在論的判断を訳文で先取りしない。
- source_word: יְהוָה
  choice: 主よ
  rationale: 神名を、日本語聖書で広く理解される敬称「主」で表し、呼格として自然な「主よ」とした。
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: 聖さにおいて威厳に満ち
  rationale: נֶאְדָּר の荘厳さ・威光と、בַּקֹּדֶשׁ の領域的表現を保った。
- source_word: נוֹרָא תְהִלֹּת
  choice: 賛美の中で畏れられ
  rationale: נוֹרָא の『恐るべき／畏れられる』という受動的含意と、複数形 תְהִלֹּת を反映した。詩的な結びつきの曖昧さを解消しすぎない。
- source_word: עֹשֵׂה פֶלֶא
  choice: 驚くべきことを行う方
  rationale: 分詞による継続的・特徴的な行為を「行う方」とし、פֶלֶא の驚異性を自然な現代日本語で表した。
theological_decisions:
- issue: 「神々」の解釈
  choice: 神々
  alternative: 力ある者たち／天上の者たち
  rationale: 原語の複数名詞を保持し、それらの実在性や性質について本文以上の限定を加えない。
- issue: 「賛美の中で畏れられ」の関係
  choice: 原語に近い簡潔な連結を維持
  alternative: 賛美されるほど恐るべき方／畏敬をもって賛美される方
  rationale: ヘブライ語の詩的表現には解釈の幅があるため、因果・程度・主体を訳文で固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、賛歌としての荘重さと二重の修辞疑問を保った。「あなたのようでしょうか」を反復し、原文の並行法を示した。
