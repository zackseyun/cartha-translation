  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: ja
  text: あなたは、変わらぬ愛によって、あなたが贖ったこの民[a]を率い、御力によって、あなたの聖なる住まい[b]へ彼らを導かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「あなたが贖ったこの民」。זוּ の指示性を明示しない場合は「あなたが贖った民」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたの聖なる住まい」は、神の聖なる臨在の場所を広く指し得る。シナイ、約束の地、またはシオン／神殿を指すという理解がある。
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: 率い
  rationale: 使役形の「導く、率いる」を、後半の נֵהַלְתָּ と訳し分けつつ自然な日本語で表した。完了形は、詩の中で成し遂げられた神の行為として訳した。
- source_word: בְחַסְדְּךָ
  choice: あなたの変わらぬ愛によって
  rationale: חֶסֶד が含む忠実さ、慈しみ、契約に根差す愛を、特定の教派用語に限定せず表す。「によって」は ב の手段的な働きを明確にする。
- source_word: עַם זוּ
  choice: この民
  rationale: זוּ の指示的な意味を保ち、「この民」とした。関係節に相当する「あなたが贖った」がその民を特定する。
- source_word: גָּאָלְתָּ
  choice: あなたが贖った
  rationale: גאל の、代価を払って取り戻すことや身内として救い出すことを含む重要な意味を、「贖う」で簡潔に保持した。
- source_word: נֵהַלְתָּ
  choice: 彼らを導かれた
  rationale: 世話をしながら導く含みを持つ語であり、「導く」とした。前半は「率いる」として、二つの動詞の違いを可能な範囲で示した。
- source_word: בְעָזְּךָ
  choice: 御力によって
  rationale: עֹז の「力、威力」を自然で敬意ある日本語にし、前半の「愛によって」との詩的な並行も保った。
- source_word: אֶל
  choice: へ
  rationale: 目的地への方向を示す。到着や内部への進入を必要以上に断定しない「へ」が適切である。
- source_word: נְוֵה קָדְשֶׁךָ
  choice: あなたの聖なる住まい
  rationale: נָוֶה の「住まい、居所、牧場」の語義のうち、神の聖なる臨在の場所を広く示せる「住まい」を採用した。場所をシナイ、約束の地、シオンなどの一つに限定しない。
theological_decisions:
- issue: 「あなたの聖なる住まい」が指す場所
  choice: 神の聖なる臨在の場所を広く指す表現として訳し、特定の場所に限定しない。
  alternative: シナイ、約束の地、シオン／神殿のいずれかを明示する。
  rationale: ヘブライ語本文だけでは場所が一義的に定まらず、この歌が神の救いの到達点を詩的に先取りしている可能性もあるため、曖昧さと神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、歌としての並行表現と荘重さを保った。「御力」と文末の「導かれた」によって神への敬意を示すが、古風な文語にはしていない。
