  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: ja
  text: 'ヤハウェ[a]は戦士[b]。


    その名はヤハウェ。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語はיהוה（YHWH）。伝統的には「主」と訳され、「エホバ」と音写されることもある。
    reason: 神名の表記と伝統的な別訳を示すため。
  - marker: b
    text: 直訳すると「戦いの人」。
    reason: 原文の比喩的な語形を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語יהוהを、称号の「主」に置き換えず、一般的な推定発音に基づいて音写した。
- source_word: אִישׁ מִלְחָמָה
  choice: 戦いの勇士
  rationale: 字義的には「戦いの人」だが、この連語は戦いに秀でた者を表す。「戦士」よりも原文の「人＋戦い」という詩的構造をいくらか保ちつつ、現代日本語として自然な表現にした。
- source_word: שְׁמוֹ
  choice: その名である
  rationale: 「彼の名」を意味する接尾辞付き名詞による無動詞文。先頭に置かれたיהוהの強調を保つため、「ヤハウェがその名である」とした。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文が称号ではなく神の固有名を用いていることを明示するため音写した。発音の再構成には不確実性があるので注で示した。
- issue: אִישׁ מִלְחָמָהの擬人的・軍事的比喩
  choice: 戦いの勇士
  alternative: 戦士／戦いの人
  rationale: 神を戦う者として描く原文の強い比喩を弱めずに保つ一方、「戦いの人」という不自然な逐語訳は避けた。「勇士」は戦闘者としての意味を明確にするが、神の本質を人間に限定する表現とはしていない。
translation_notes:
  register: 歌の一節らしい簡潔さと二行の並行性を保ち、荘重だが現代の読者にも明瞭な文体とした。「ヤハウェがその名である」により、後半の前置された神名の強調を再現した。
