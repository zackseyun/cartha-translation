    issue: 脚注aの「彼らを思う存分むさぼる」
    rationale: 原文はネフェシュ（欲求・自己）が『彼らによって満たされる』という表現であり、「むさぼる」は摂食の比喩を強く具体化している。
  - severity: medium
    issue: 脚注bの「彼らからすべてを奪い取ろう」
    rationale: תּוֹרִישֵׁמוֹは『彼らを追い出す／立ち退かせる』『滅ぼす』等に理解されうるが、「すべてを」という限定は原文にない。
