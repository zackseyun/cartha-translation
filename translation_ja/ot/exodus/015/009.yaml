base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: ja
  text: '敵は言った。


    「追いかけて追いつき、


    戦利品を分けよう。


    彼らを相手に欲望を満たそう。[a]


    剣を抜き、


    この手で彼らを追い払おう。[b]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私の欲求（ネフェシュ）は彼らによって満たされる」。または「私は彼らで飽きるほど満たされよう」。
    reason: lexical_alternative
  - marker: b
    text: あるいは「この手で彼らを滅ぼそう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: 敵は言った
  rationale: 歌の中で敵の高慢な企てを振り返る発言導入として、自然な単純過去にした。単数形の「敵」は、文脈上、追撃するエジプト側を代表的・集合的に指す。
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: 追いかけて追いつき
  rationale: 追跡と捕捉が畳みかけるように並ぶ原文の勢いを保ち、意図された行動として訳した。
- source_word: אֲחַלֵּק שָׁלָל
  choice: 戦利品を分けよう
  rationale: 戦争で得た略奪品を分配するという定型的な意味を、現代日本語で明瞭に表した。
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: 彼らを相手に、思う存分、欲望を満たそう
  rationale: 直訳は「私のネフェシュが彼らによって満たされる」。ここで נֶפֶשׁ は人の内なる欲求・貪欲な思いを表すため、「魂」という専門的に響きやすい語を避けつつ、敵意に満ちた欲望を示した。
- source_word: אָרִיק חַרְבִּי
  choice: 剣を抜き
  rationale: 「空にする」を基本義とする動詞が剣を目的語に取る慣用表現であり、鞘から剣を抜くことを指す。
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: この手で彼らを追い払おう
  rationale: ירשׁ の使役形が持つ「立ち退かせる、追い払う」の中心的な意味を採用した。「私の手」を自然な日本語の「この手で」とし、敵自身の力への誇りも残した。文脈上は「滅ぼす」と理解する余地があるため脚注に示した。
