  text: שָֽׁמְע֥וּ עַמִּ֖ים יִרְגָּז֑וּ/ן חִ֣יל אָחַ֔ז יֹשְׁבֵ֖י פְּלָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: ja
  text: '諸国の民は聞いて、おののいた。[a]

    苦しみがペリシテの地に住む者たちを捕らえた。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国の民は聞き、おののく。苦しみがペリシテの地に住む者たちを捕らえた。」ヘブライ語の詩では、過去の出来事を生々しく現在のことのように、またはこれから起こることのように表す響きもあり得る。
    reason: 動詞形が許容する詩的な時制・相の幅を保持するため。
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: 聞いて
  rationale: Qal完了形3人称複数。「聞いた」が基本だが、後続する反応と自然につなぐため、日本語では連用形「聞いて」とした。
- source_word: עַמִּים
  choice: 諸国の民
  rationale: עםの複数形。単なる個々人ではなく周辺の諸民族を指すため、複数性と詩的な集合性を自然な現代日本語で表した。
- source_word: יִרְגָּזוּ/ן
  choice: おののいた
  rationale: רגזは震え、動揺することを表す。恐怖による身体的・心理的反応を、格調を保ちつつ理解しやすく表現した。未完了形が持ち得る現在的・未来的な響きは脚注で保持した。
- source_word: חִיל
  choice: 苦しみ
  rationale: 身もだえ、産みの苦しみのような痛み、震えを含み得る語。ここでは出産の比喩に限定せず、身体と心を圧倒する苦痛を広く表す訳語とした。
- source_word: אָחַז
  choice: 捕らえた
  rationale: אחזはつかむ、捕らえるの意。苦しみが人々を逃れられない状態に置く強い擬人的表現を保った。
- source_word: יֹשְׁבֵי
  choice: 住む者たち
  rationale: ישׁבの分詞の名詞的用法。「住民」よりも原文の『住んでいる者』という形を見えるようにしつつ、自然な日本語とした。
- source_word: פְּלָשֶׁת
  choice: ペリシテの地
  rationale: ペリシテ人の領域を指す地名。日本語では地域名として明確になるよう「の地」を補った。
theological_decisions:
- issue: 詩における動詞の時間的な響き
  choice: 本文では過去の出来事として「聞いて、おののいた」「捕らえた」と訳す
  alternative: 「聞き、おののく。苦しみが……を捕らえた」または未来として訳す
  rationale: 完了形と未完了形が交錯する勝利の歌の詩的表現であり、過去・現在的な生々しさ・予告的な響きが重なり得る。本文は文脈上自然な過去形とし、曖昧さを脚注に明示した。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、歌の格調と簡潔な並行表現を保った。「おののく」「捕らえる」により、恐怖が諸民族を圧倒する詩的な力を再現した。
