base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ja
  text: 'ミリアムは彼らに応えて歌った。[a]


    「ヤハウェに歌え。


    まことに輝かしく勝利されたからだ。[b]


    馬とその乗り手を、海へ投げ込まれた。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「応えて歌った」は、この歌の場面では「応唱した」「応じて歌った」とも訳し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は字義的には「大いに高くなられた」または「威厳高くそびえ立たれた」。ここでは勝利の歌の文脈に沿って訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן לָהֶם
  choice: 一同に応えて言った
  rationale: ענהの基本義「答える、応じる」を保ちつつ、歌の場面では応唱を表し得る余地を脚注に残した。לָהֶםは男性複数形だが、直前の女性たちだけを指すか、より広い集団を指すかを日本語で限定しないよう「一同」とした。
- source_word: שִׁירוּ
  choice: 歌え
  rationale: 複数への命令形を簡潔に訳した。「賛美せよ」という解釈は動詞自体に加えず、歌う対象を示す後続句に委ねた。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 神名יהוהを称号に置き換えず、固有名として「ヤハウェ」と表記した。
- source_word: גָאֹה גָּאָה
  choice: まことに輝かしく勝利された
  rationale: 同根の不定詞絶対形と定動詞による強意を「まことに」で表し、海の歌という勝利の文脈に即してגאהの威容と高揚を「輝かしく勝利された」と自然な日本語にした。字義的な可能性は脚注に示した。
- source_word: סוּס וְרֹכְבוֹ
  choice: 馬とその乗り手
  rationale: 単数形による集合的・代表的表現を保ち、接尾辞が馬を受けることを「その」で明示した。
- source_word: רָמָה בַיָּם
  choice: 海へ投げ込まれた
  rationale: רמהの「投げる、放り込む」を直接的に訳し、移動の到達点として日本語では自然な「海へ」を用いた。主語は直前のヤハウェとして敬語形で受けた。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が契約の神名を明示しているため、称号へ置換せず「ヤハウェ」とした。
- issue: גָאֹה גָּאָהの意味
  choice: まことに輝かしく勝利された
  alternative: 大いに高く上げられた／威厳高くそびえ立たれた
  rationale: 勝利の歌における神の圧倒的な威容と勝利を本文で伝えつつ、「高くなる／高く上がる」という字義的な含みを脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準語。詩として行分けし、命令と勝利宣言の力強さを保った。「一同」は性別や範囲を不必要に限定せず、原文の複数対象を自然に表す。
