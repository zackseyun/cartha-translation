- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着した人名表記。
- source_word: לֵאמֹר
  choice: 「……」と言った
  rationale: 直接話法を導く定型句。日本語では文末の発話動詞として表すのが自然。
- source_word: מַה
  choice: 何を
  rationale: 問いを導く単純な疑問代名詞。
- source_word: נִּשְׁתֶּה
  choice: 飲めばよいのか
  rationale: 飲むことを表す未完了形一人称複数。差し迫った必要のもとでの問いを、過度に可能・義務へ限定せず自然な日本語で表す。
