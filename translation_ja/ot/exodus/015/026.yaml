id: EXO.15.26
reference: Exodus 15:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: ja
  text: 彼は言った。「もしあなたが、あなたの神ヤハウェの声によく聞き従い、その目に正しいことを行い、その命令に耳を傾け、そのすべての定めを守るなら、わたしがエジプトに下した病を一つもあなたには下さない。わたしはヤハウェ、あなたを癒やす者だからである[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしはヤハウェ、あなたの癒やし手だからである」。
    reason: רֹפְאֶךָは「あなたを癒やす者」と動詞的にも、「あなたの癒やし手」と名詞的にも訳せるため。
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: よく聞き従い
  rationale: 不定詞絶対形と定動詞の重なりによる強調を「よく」で表し、שׁמעの「聞く」という感覚と、注意深く従う含意の両方を保った。
- source_word: לְקוֹל יְהוָה אֱלֹהֶיךָ
  choice: あなたの神ヤハウェの声に
  rationale: קוֹלを「声」としてヘブライ語の表現を保ち、神名יהוהは固有名として「ヤハウェ」とした。二人称単数も「あなた」で明示した。
- source_word: וְהַיָּשָׁר בְּעֵינָיו תַּעֲשֶׂה
  choice: その目に正しいことを行い
  rationale: 「彼の目に正しい」という原文の慣用表現と道徳的意味を保ち、「喜ばれること」のような解釈的言い換えを避けた。
- source_word: וְהַאֲזַנְתָּ לְמִצְוֺתָיו
  choice: その命令に耳を傾け
  rationale: אזןの注意深く聞く意味を「耳を傾け」で表し、前半のשׁמעとの語感の違いも示した。
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: そのすべての定めを守る
  rationale: 法的文脈におけるשׁמרを「守る」、חֻקִּיםを固定された規定を表す「定め」とした。
- source_word: כָּל הַמַּחֲלָה
  choice: 病を一つも
  rationale: 単数集合名詞と否定表現を、自然な日本語で全否定となる「病を一つも……ない」とした。特定の疫病だけに狭めない。
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם / לֹא אָשִׂים עָלֶיךָ
  choice: わたしがエジプトに下した／あなたには下さない
  rationale: 同じ動詞שׂיםを両箇所とも「下す」で対応させ、裁きとして病を置くという文脈を自然な日本語で表した。
- source_word: רֹפְאֶךָ
  choice: あなたを癒やす者
  rationale: 分詞の継続的・特徴的な働きを自然に表しつつ、「癒やし手」という名詞的理解も脚注で残した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に明記された契約の固有名を音写し、一般名詞「主」へ置き換えなかった。
- issue: 病に関する約束の性格
  choice: 従順を条件とし、エジプトに下した病をイスラエルには下さないという契約上の約束
  alternative: あらゆる状況で個人の身体的癒やしを無条件に保証する言葉、または霊的回復だけを指す比喩
  rationale: 原文の条件節とエジプトへの歴史的言及をそのまま示し、後代の教理的結論を訳文へ持ち込まなかった。
- issue: רֹפְאֶךָの名詞的・動詞的ニュアンス
  choice: あなたを癒やす者
  alternative: あなたの癒やし手
  rationale: 分詞は「癒やす者」とも「癒やし手」とも理解できるため、本文では自然な動詞的表現を採り、名詞的な可能性を脚注に残した。
translation_notes:
  register: 現代の一般読者に理解しやすい、明瞭で格調を保った文体とした。「聞き従う」「耳を傾け」「定め」など、契約と命令の文脈に適した語を用いつつ、過度に古風な言い回しは避けた。
