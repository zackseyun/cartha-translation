  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: ja
  text: 'ヤハは私の力、私の歌。

    ヤハは私の救いともなった。


    この方こそ私の神。私はこの方をたたえる[a]。


    私の父の神。私はこの方をあがめる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私はこの方のために住まいを備える」とも訳せる。ここのヘブライ語の動詞は解釈が難しく、「住まいを設ける」、または「美しくする、栄光を帰す」という意味に取ることができる。
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: 私の力
  rationale: עֹז は「力、強さ」を表す。簡潔で自然な日本語とし、詩の並行表現を保った。
- source_word: וְזִמְרָת יָהּ
  choice: ヤハは私の力、私の歌
  rationale: זִמְרָה は「歌」または歌による賛美を表す。ここでは勝利の歌という文脈と定型的な詩句を踏まえ、「私の歌」とした。יָהּ はこの句の主語として訳した。
- source_word: יָהּ
  choice: ヤハ
  rationale: יהוה ではなく、その短縮形である固有の神名 יָהּ が用いられているため、「主」に同化させず、音写して区別を保った。
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: 私の救いとなった
  rationale: היה と ל を用いる構文の「私にとって救いとなった」という結果的意味を、簡潔で自然な日本語にした。
- source_word: זֶה אֵלִי
  choice: この方こそ私の神
  rationale: 指示詞 זֶה の強い指し示しを「この方こそ」で表し、神を指す日本語として品位ある表現にした。
- source_word: וְאַנְוֵהוּ
  choice: 私はこの方をたたえる
  rationale: 語義には議論があるが、後続の「私はこの方をあがめる」との詩的並行および賛歌の文脈から「たたえる」を本文に採用した。住まいを備えるという解釈は脚注に残した。
- source_word: אֱלֹהֵי אָבִי
  choice: 私の父の神
  rationale: 単数形の「父」と一人称接尾辞をそのまま保ち、簡潔に訳した。
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: 私はこの方をあがめる
  rationale: רומם の「高くする、高く上げる」という比喩的意味を、礼拝の文脈に自然な「あがめる」で表した。
theological_decisions:
- issue: 神名 יָהּ の訳し方
  choice: ヤハ
  alternative: 主
  rationale: 原文は四文字神名 יהוה ではなく短縮形 יָהּ を用いている。その形と詩的な響きの相違を保持するため、一般的な代替表記「主」ではなく音写した。
- issue: וְאַנְוֵהוּ の解釈
  choice: 私はこの方をたたえる
  alternative: 私はこの方のために住まいを備える
  rationale: 語源と語義には不確かさがある。本文では詩的並行と賛歌の文脈に合う賛美の意味を採ったが、住まいを設けるという有力な別解を脚注に明示し、曖昧さを保存した。
translation_notes:
  register: 現代の一般読者に明瞭な語彙を用いつつ、歌としての簡潔さと格調を保った。「この方」を反復して指示詞の強調と敬意を表し、二つの賛美動詞は「たたえる／あがめる」と訳し分けた。
