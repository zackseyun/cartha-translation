language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ja
  text: 'その時、モーセとイスラエルの民はこの歌をヤハウェ[a]に歌い、こう言った。


    「私はヤハウェに歌おう。

    　まことに、ヤハウェは輝かしく勝利を収められ、

    　馬とその乗り手を海に投げ込まれた。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳され、「ヤハウェ」はその推定発音。
    reason: 神名の原語形と伝統的な訳し方を示すため。
lexical_decisions:
- source_word: אָז
  choice: その時
  rationale: 海を渡った出来事に続いて歌が始まることを示す時間・物語上の接続として、明瞭で自然な現代日本語にした。
- source_word: יָשִׁיר
  choice: 歌い
  rationale: 形は未完了形だが、אָזを伴う物語文では過去の出来事を表すため、日本語では後続の「こう言った」につなぐ連用形で表した。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの民
  rationale: 字義的には「イスラエルの子ら」だが、ここではイスラエルの子孫である共同体を指す。年少者との誤解を避け、現代日本語として自然な表現を選んだ。
- source_word: הַשִּׁירָה הַזֹּאת
  choice: この歌
  rationale: 指示語を含む簡潔な原文を、そのまま自然に表した。
- source_word: לַיהוָה
  choice: ヤハウェに向かって
  rationale: 歌の向けられる相手を自然な日本語で示し、神名YHWHは音写した。
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: こう言った
  rationale: ヘブライ語の発話導入定型句を、意味を保ちながら冗長さのない現代日本語にした。
- source_word: אָשִׁירָה
  choice: 私は…歌おう
  rationale: 一人称単数の勧奨形が示す意志を「歌おう」で表し、共同体による導入から単数の詩的話者への移行も保持した。
- source_word: כִּי
  choice: まことに
  rationale: 歌う理由を示す「なぜなら」も可能だが、ここでは賛美の根拠を力強く宣言する詩的用法に合う表現を選んだ。
- source_word: גָאֹה גָּאָה
  choice: 輝かしく勝利を収められた
  rationale: 不定詞絶対形と定動詞の反復による強意を表し、海での勝利という文脈に即して自然に訳した。ただし「大いに高く上げられた」という語義上の可能性は脚注に残した。
- source_word: סוּס וְרֹכְבוֹ
  choice: 馬とその乗り手
  rationale: 集合的な単数表現と所有接尾辞を保った。
- source_word: רָמָה בַיָּם
  choice: 海へ投げ込まれた
  rationale: 力をもって海中へ投じる動作を表し、方向を示す自然な日本語とした。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文に記された契約の神名YHWHを固有名として示す。伝統的な代読表現も脚注で明示し、特定の教派的含意を加えない。
- issue: גָאֹה גָּאָהの解釈
  choice: 輝かしく勝利を収められた
  alternative: 大いに高く上げられた
  rationale: 直後の馬と乗り手の滅亡により勝利の含意が強い一方、語根の「高くなる／高く上がる」という像も失わないよう、別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、改行と簡潔な並行表現によって歌の荘重さを保った。神への敬意は「収められた」「投げ込まれた」で表し、過度に古風な語法は避けた。
