revisions:
- from: 'その時、モーセとイスラエルの民は、この歌をヤハウェ[a]に向かって歌い、こう言った。


    「私はヤハウェに歌おう。

    　まことに、ヤハウェは輝かしく勝利を収められた[b]。

    　馬とその乗り手を海へ投げ込まれた。」'
  to: 'その時、モーセとイスラエルの民はこの歌をヤハウェ[a]に歌い、こう言った。


    「私はヤハウェに歌おう。

    　まことに、ヤハウェは輝かしく勝利を収められ、

    　馬とその乗り手を海に投げ込まれた。」'
  rationale: ヤハウェを「投げ込む」動詞の明示的な主語として置き、原文の能動的な意味を明確にしました。「海へ」は「海に」として、投げ込む行為の到達点を自然に表しました。脚注bは、原文にない受動的含意を避けつつ、語根の高揚・高く立つイメージを保存するよう改めました。その他の訳語、単数の詩的話者、神名表記、詩的な強意は維持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:05Z'
review_pass:
  verdict: revise
  source_fidelity: 本文末尾の「馬とその乗り手を海へ投げ込まれた」は、明示された主語がないため、馬と乗り手が投げ込まれたという受動態にも読めます。原文はヤハウェを主語とする能動の「（彼が）投げ込んだ」です。神名を主語として補い、原文の統語関係を明確にする必要があります。
  naturalness: 全体として明瞭な現代標準日本語です。「ヤハウェに向かって歌い」は不自然ではありませんが、「ヤハウェにこの歌を歌い」のほうが簡潔です。詩行を二文にまとめると、原文の単一の歌唱発話としても自然になります。
  terminology: 「ヤハウェ」「イスラエルの民」は適切です。「輝かしく勝利を収められた」は文脈にかなう意訳であり、強意と語義上の別可能性を脚注で示す方針も適切です。ただし脚注の「大いに高く上げられた」は受動態を示唆するため、「大いに高くそびえ立たれた」として原語の能動・状態的な語感をよりよく保ちます。
  issues:
  - severity: high
    issue: 末行でヤハウェが馬と乗り手を海へ投げ込んだという能動的行為が統語的に明示されていない。
    rationale: רָמָהは単数男性の能動動詞で、歌の主語であるヤハウェを指す。日本語の「馬とその乗り手を海へ投げ込まれた」だけでは、尊敬語として読める一方、馬と乗り手を主語とする受動表現とも読め、原文の主語関係が不明瞭になる。
  - severity: medium
    issue: 脚注bの別訳が「高く上げられた」と受動態になっている。
    rationale: גָאֹה גָּאָהは同語根の強意表現であり、ここではヤハウェが高くそびえ立つ／大いに高められるという意味領域を持つが、受動態の「上げられた」は原文にない行為者を含意しうる。
