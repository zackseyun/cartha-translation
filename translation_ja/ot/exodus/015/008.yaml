source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: ja
  text: あなたの鼻から吹き出す息で[a]、水は積み上がり、流れる水は積み重なった塊のように立った[b]。深い水は海のただ中で凝り固まった[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの鼻から吹く風で」。ヘブライ語の רוּחַ は「息」とも「風」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「積み重なった塊」は、積み上がったものを指すヘブライ語による。渡海の関連描写を踏まえて「壁のように」と訳す場合もある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「凍りついた」。この動詞は、濃くなること、または凝固することを表しうる。
    reason: lexical_alternative
  - marker: d
    text: 直訳「海の心で」。すなわち、海のただ中で。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: あなたの鼻から吹きつける息で
  rationale: רוּחַは「風」「息」を表し、אַףはここでは神の「鼻」を指す。力強い呼気という擬人的な詩的描写を、現代日本語で自然かつ具体的に保った。
- source_word: נֶעֶרְמוּ מַיִם
  choice: 水は積み上がり
  rationale: נֶעֶרְמוּの、水が重なって山積みになる像を簡潔に表した。
- source_word: נִצְּבוּ כְמוֹ נֵד נֹזְלִים
  choice: 流れる水は山のように立った
  rationale: נֹזְלִיםの分詞的な「流れるもの」と、נֵדの「積み上がった塊、山」の像を保った。「壁」は渡海物語の並行表現には合うが、この語自体の第一義ではない。
- source_word: קָפְאוּ תְהֹמֹת
  choice: 深い水は…凝り固まった
  rationale: תְהֹמֹתを海の深層の水として明確にし、קָפְאוּは単なる「凍結」に限定せず、濃くなって固まる意味を含む「凝り固まった」とした。
- source_word: בְּלֶב יָם
  choice: 海のただ中で
  rationale: 直訳は「海の心で」だが、日本語で意味が明瞭になるよう、同じ中心・内部の意味を「ただ中」で表し、直訳的な比喩は脚注に残した。
theological_decisions:
- issue: 神を身体的に描く擬人表現
  choice: 神の鼻から息が吹きつけるという具体的な像を保持する
  alternative: 「あなたの怒りによって」のように抽象化する
  rationale: 本文は神の力強い介入を身体的な詩的表現で描いている。これを抽象化せず、原文の緊張と迫力を保った。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、海の歌にふさわしい簡潔で荘重な調子を保った。「鼻から吹きつける息」「水は山のように立った」により、原文の擬人的・詩的な力強さを残している。
