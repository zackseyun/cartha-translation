reference: Exodus 15:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵילִ֔מָ/ה וְ/שָׁ֗ם שְׁתֵּ֥ים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם וְ/שִׁבְעִ֣ים תְּמָרִ֑ים וַ/יַּחֲנוּ שָׁ֖ם עַל הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: ja
  text: それから彼らはエリムに着いた。そこには十二の泉と七十本のなつめやし[a]があり、彼らはその水辺[b]に宿営した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「やしの木」とも訳せる。ここで用いられている語は、一般に、なつめやしを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その水のそば」。ヘブライ語の「水」は複数形だが、ひとまとまりの水を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: それから彼らは……に着いた
  rationale: 物語を次の出来事へ進める接続形の働きを、現代日本語として自然な「それから」で表した。בוא はここでは目的地への到着を示すため「着いた」とした。
- source_word: אֵילִמָה
  choice: エリムに
  rationale: 地名を「エリム」と音写し、語尾の方向を示す ה を助詞「に」で表した。
- source_word: שָׁם
  choice: そこには……があり
  rationale: 場所を指す「そこ」の意味を保ちつつ、後続する泉と木の存在を自然な日本語で示した。
- source_word: עֵינֹת מַיִם
  choice: 泉
  rationale: עַיִן はここでは水が湧き出る場所を指す。「水の泉」とすると日本語では冗長なので「泉」とした。
- source_word: תְּמָרִים
  choice: なつめやし
  rationale: この語が指す木を具体的かつ一般読者にも理解できる名称で訳した。「やしの木」も可能なので脚注に示した。
- source_word: וַיַּחֲנוּ
  choice: 彼らは……宿営した
  rationale: חנה の、旅の途上で陣を張ってとどまる意味を、簡潔で品位のある現代語「宿営した」で表した。
- source_word: עַל הַמָּיִם
  choice: その水辺に
  rationale: עַל はこの文脈では水の上ではなく水のそばを表す。「水辺」は宿営地との位置関係を自然に伝える。定冠詞の指示性は「その」で表した。
theological_decisions: []
