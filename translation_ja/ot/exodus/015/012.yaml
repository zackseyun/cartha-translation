base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: ja
  text: あなたは右の手を伸ばされた。大地[a]は彼らをのみ込んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地」または「地面」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: 伸ばされた
  rationale: נטהのカル完了形二人称男性単数。神への直接の呼びかけであることを保ち、具体的な動作を自然な現代日本語で表した。
- source_word: יְמִינְךָ
  choice: あなたの右の手
  rationale: 原文どおり身体部位の比喩を残した。「力」などと抽象化せず、詩的な神の力の表現を保持した。
- source_word: תִּבְלָעֵמוֹ
  choice: 彼らをのみ込んだ
  rationale: בלעの「のみ込む、包み込む」という鮮明な比喩を保持した。接尾辞は三人称男性複数目的語を示し、後続する女性単数名詞「大地」が主語である。
- source_word: אָרֶץ
  choice: 大地
  rationale: אֶרֶץには「地、土地、地面」などの語義がある。この詩的文脈では、敵をのみ込む壮大で劇的な像を自然に伝える「大地」を本文に採用した。
theological_decisions:
- issue: 神の行為を表す擬人的表現
  choice: 「あなたの右の手」という具体的な表現を保持する
  alternative: 「あなたの力」または「あなたの力強い御手」と解釈的に訳す
  rationale: 原文は賛歌の中で身体的な像を用いている。抽象化や意味の付加を避けることで、その文学的・神学的な力を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神への敬意は動詞「伸ばされた」で示しつつ、過度に古風な語法は避けた。二つの詩的節を句点で区切り、ヘブライ語の簡潔で力強い並行的な運びを保った。
