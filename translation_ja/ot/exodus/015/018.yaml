id: EXO.15.18
reference: Exodus 15:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יְהוָ֥ה יִמְלֹ֖ךְ לְ/עֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: ja
  text: ヤハウェ[a]は、世々限りなく王として治める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（יהוה）。伝統的には「主」、別の音写では「エホバ」とも表記される。ここでは「ヤハウェ」とした。
    reason: 神名の伝統的な訳し方と別表記を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字の神名（YHWH）を、称号「主」に置き換えず、日本語で一般的な音写「ヤハウェ」とした。
- source_word: יִמְלֹךְ
  choice: 王として治める
  rationale: מלךの王権を明確に表し、この勝利の歌におけるヤハウェの永続的な統治の宣言として訳した。未完了形の将来的含意は文脈に認められるが、日本語では普遍的・継続的な宣言として自然に読める現在形を用いた。
- source_word: לְעֹלָם וָעֶד
  choice: 世々限りなく
  rationale: 二語から成る強意的な定型表現を、終わりのない継続を表す自然で荘重な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、またはエホバ
  rationale: 原文が称号ではなく四文字の神名そのものを用いているため、固有名として音写した。発音の再構成には不確かさがあることを脚注で示した。
- issue: יִמְלֹךְ の時制・相
  choice: 王として治める
  alternative: 王として治めるだろう／王として治められる
  rationale: ヘブライ語未完了形は将来または継続的・一般的な統治を表し得る。ここでは永遠の王権を宣言する詩的文脈を尊重し、日本語で時を限定しすぎない形にした。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、歌の結びにふさわしい簡潔で荘重な調子とした。「世々限りなく」により、原文の強意的な永続表現を自然に再現した。
