source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: ja
  text: 'あなたは彼らを導き入れ、

    あなたの受け継ぎである山に彼らを植えられる[a][b]。


    ヤハウェよ、そこはあなたが御住まいのために造られた場所。

    主よ[c]、あなたの御手が据えた聖所。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「植えられる」。民をその地に堅く住まわせることを、植物を植える姿で表している。別訳「住み着かせられる」。
    reason: lexical_alternative
  - marker: b
    text: 「あなたの受け継ぎである山」は、神が民に与える地を広く指すとも、より具体的に神の聖所がある山を指すとも考えられる。
    reason: alternative_reading
  - marker: c
    text: この節の原文では、神の固有名「ヤハウェ」と、称号「主」の両方が用いられている。
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: 彼らを導き入れ
  rationale: בואのヒフィル形と三人称男性複数接尾辞を、目的地への使役的な移動が明確になる自然な日本語で表した。
- source_word: וְתִטָּעֵמוֹ
  choice: 植えられる
  rationale: נטעの具体的な「植える」という詩的比喩を保ち、民を安住させる含意は脚注で示した。
- source_word: בְּהַר נַחֲלָתְךָ
  choice: あなたの受け継ぎの山に
  rationale: 神に属する受け継ぎとしての山という属格関係を保持し、土地全体か聖所の山かを本文で限定しなかった。
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: あなたが住まいとして造られた場所
  rationale: מָכוֹןを確立された場所・場所として明瞭に訳し、続くפעלתとの結び付きを自然な日本語にした。
- source_word: פָּעַלְתָּ
  choice: 造られた
  rationale: פעלの広い「行う・造る」の意味を、住まいの場所という文脈に即して訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名יהוהを称号に置き換えず、音写によって後続のאֲדֹנָיとの区別を保った。
- source_word: מִקְּדָשׁ
  choice: 聖所
  rationale: 神に属する聖なる場所を指す語として、現代日本語の聖書文体で明瞭な「聖所」を用いた。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 神への称号として「主」と訳し、固有名「ヤハウェ」と区別した。
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: あなたの御手が据えられた
  rationale: כוןの確立する・堅く据える意味と「手」の擬人的表現を保持した。
theological_decisions:
- issue: 同じ節にあるיהוהとאֲדֹנָיの訳し分け
  choice: יהוהを「ヤハウェ」、אֲדֹנָיを「主」とする
  alternative: 両方を「主」とする
  rationale: 原文にある固有の神名と称号の違いを読者に見える形で保つため。
- issue: 「あなたの受け継ぎの山」と「聖所」の指示対象
  choice: 地理的な指示対象を特定せず、原文の詩的な重なりを保つ
  alternative: シオンまたは神殿の山と明示する、あるいはカナン全土と明示する
  rationale: この表現はイスラエルが与えられる地を広く見渡しつつ、神の聖所の山をより具体的に指し得るため、訳文で一方に限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。歌の並行法が伝わるよう改行し、過度な古語を避けた。「御手」のみ、神への敬意と原文の身体比喩を自然に保つ語として用いた。
