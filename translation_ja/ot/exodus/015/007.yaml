  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: ja
  text: 'あなたは、その大いなる威厳によって[a]、

    あなたに立ち向かう者たちを打ち倒す。

    あなたの燃える怒りを放ち[b]、

    それは彼らをわらのように食い尽くす。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの満ちあふれる威厳のうちに」。ヘブライ語の前置詞は、手段とも領域とも取ることができる。
    reason: lexical_alternative
  - marker: b
    text: 「燃える怒り」は「激しい憤り」とも訳せる。ヘブライ語は、文字どおりには怒りの燃えるさまを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: あなたは、大いなる威厳によって
  rationale: בְּは手段または領域を表し得るが、ここでは神の圧倒的な威厳が敵を倒す力として描かれていると捉え、「によって」とした。רֹבの量的な強さは「大いなる」で自然に表し、גָּאוֹןは勝利の歌にふさわしく「威厳」とした。接続詞וְは日本語の詩行では明示しなくても連続性が保たれるため訳出しなかった。
- source_word: תַּהֲרֹס
  choice: 打ち倒す
  rationale: 基本義は「壊す、取り壊す」だが、目的語が人物である軍事的・詩的文脈に合わせ、破壊の強さを保ちつつ自然な「打ち倒す」とした。
- source_word: קָמֶיךָ
  choice: あなたに立ち向かう者たち
  rationale: קוםの分詞が持つ「立ち上がる」という動きを残し、単なる「敵」よりも神に敵対して立つ姿を明示した。
- source_word: תְּשַׁלַּח
  choice: 放てば
  rationale: שׁלחの「送る、放つ」を保持した。「怒り」を目的語とする詩的表現として自然であり、後続文との関係は日本語では条件・時間的な「ば」で滑らかに表した。
- source_word: חֲרֹנְךָ
  choice: 燃える怒り
  rationale: חָרוֹןに含まれる熱の比喩を保持した。単に「憤り」とせず、続く刈り株の消尽像との結びつきも伝える。
- source_word: יֹאכְלֵמוֹ
  choice: それは彼らを…食い尽くす
  rationale: 単数動詞の主語が直前の「燃える怒り」であることを「それは」で明確にした。אכלの「食べる、食い尽くす」という擬人的な力を保ち、火を明示的に補わなかった。
- source_word: כַּקַּשׁ
  choice: 刈り株のように
  rationale: קַשׁは収穫後に残る乾いた穀物の茎・刈り株を指す。すぐに燃え尽きるものという聖書的な比喩を日本語で具体的に伝えるため「刈り株」とした。
theological_decisions:
- issue: 神の裁きと怒りの破壊的な比喩
  choice: 燃える怒りを放てば、それは彼らを刈り株のように食い尽くす
  alternative: 激しい憤りを送り、彼らをわらのように焼き尽くす
  rationale: 原文が神の怒りによる敵の滅びを直接描く緊張を弱めずに保持した。一方、「焼き尽くす」は文脈上自然でも、原文の動詞אכלが直接には「食う」であるため、火を説明的に補わず「食い尽くす」とした。
- issue: 神への二人称の呼びかけ
  choice: あなたの威厳／あなたに立ち向かう／燃える怒り
  alternative: 主の威厳／主に立ち向かう／主の怒り
  rationale: この歌が神を直接「あなた」と呼ぶ賛歌であることを保ち、叙述的な三人称へ変えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、出エジプト記15章の勝利の歌にふさわしい簡潔で格調ある詩行とした。「打ち倒す」「食い尽くす」により原文の力強さを保ち、過度に古風な語法や教派固有の表現は避けた。
