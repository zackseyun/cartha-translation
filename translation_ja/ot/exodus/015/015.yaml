  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: ja
  text: その時、エドムの族長たちは恐怖におののき、モアブの有力者たち[a]は震えに襲われた。カナンの住民は皆、溶け去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「モアブの雄羊たち」。強さや卓越性を表す比喩で、「モアブの勇士たち」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: その時
  rationale: 前節までに歌われた主の救いを受け、その結果として諸国に恐れが広がる時を示す時間副詞。現代日本語として自然で、詩の展開も明確にする。
- source_word: נִבְהֲלוּ
  choice: 恐れおののき
  rationale: בהל のニファル形が表す、突然の恐怖に動揺し、うろたえる様子を、勝利の歌にふさわしい簡潔な表現で訳した。
- source_word: אַלּוּפֵי אֱדוֹם
  choice: エドムの族長たち
  rationale: אַלּוּף は氏族や部族の首長を指し得る。王侯のような制度的地位を過度に示さず、集団の指導者という意味を保つため「族長」とした。
- source_word: אֵילֵי מוֹאָב
  choice: モアブの有力者たち
  rationale: אֵילֵי は字義的には「雄羊たち」とも取れるが、ここでは強さや卓越性を比喩的に表し、モアブの主だった者たちを指す。本文では文脈上の意味を明瞭にし、字義と別訳は脚注に残した。
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: 震えに襲われた
  rationale: 「震えが彼らを捕らえる」という擬人化された恐怖の描写を、日本語でも力強く自然な受動表現で再現した。
- source_word: נָמֹגוּ
  choice: 溶けるように力を失った
  rationale: מוג の「溶ける」という比喩を残しつつ、恐怖のため勇気や力を失うという文脈上の意味が現代の読者に伝わるよう補った。
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: カナンの住民は皆
  rationale: 分詞形の「住んでいる者たち」と全体を示す כֹּל を、簡潔で自然な現代日本語にした。
