  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: ja
  text: モーセはイスラエルを葦の海[a]から出発させた。彼らはシュルの荒野へ出て、荒野で三日間進んだが、水を見つけることができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「紅海」と訳される。ヘブライ語は「葦の海」。
    reason: 原語に即した訳と伝統的な呼称の違いを示すため。
lexical_decisions:
- source_word: וַיַּסַּע
  choice: 出発させた
  rationale: ヒフィル形の使役的な意味を保ち、モーセがイスラエルをそこから進ませたことを、自然な現代日本語で表す。
- source_word: מִיַּם סוּף
  choice: 葦の海
  rationale: סוּף の通常の語義「葦」を反映し、伝統的呼称より原文の表現を優先する。
- source_word: מִדְבַּר שׁוּר
  choice: シュルの荒野
  rationale: מִדְבָּר は必ずしも砂漠だけを指さないため、聖書文脈で自然かつ範囲の広い「荒野」とする。
- source_word: וַיֵּצְאוּ
  choice: 出て
  rationale: יצא の基本義である「出る」を保ち、葦の海の地域からシュルの荒野へ移った叙述として表す。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三日間
  rationale: 期間を表す対格を、日本語で自然な継続時間として訳す。
- source_word: בַּמִּדְבָּר
  choice: 荒野を
  rationale: ヘブライ語の前置詞 ב は場所を示すが、移動動詞とともに日本語では経路を表す「を」が自然であり、荒野の中を歩いた意味を過不足なく伝える。
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: 水を見つけられなかった
  rationale: 原文の否定を明確に保つ自然な日本語。三日間探した含みは文脈上生じるが、原文以上に「探した」とは明記しない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての簡潔さと品位を保った。「出発させた」により使役形を明示し、「葦の海」には伝統的訳を示す脚注を付した。
