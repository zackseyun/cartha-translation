base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: ja
  text: そこでモーセは主に叫び求めた。主は彼に一本の木を示された。モーセがそれを水に投げ入れると、水は甘くなった。そこで主は民のために掟と定めを設け、そこで民を試みられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵץ
  choice: 一本の木
  rationale: 通常は「木」を意味する。文脈上「木片」も考えられるが、原文自体は限定していないため、具体化しすぎない訳とした。
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: 水は甘くなった
  rationale: 「甘くなる」という原文の比喩的表現を保ち、苦くて飲めなかった水が飲める状態になったことを示す。
- source_word: חֹק וּמִשְׁפָּט
  choice: 掟と定め
  rationale: 二つの法的語を区別して訳した。「定め」は מִשְׁפָּט の裁き・規定という意味領域を文脈に即して表す。
- source_word: נִסָּהוּ
  choice: 民を試みた
  rationale: 単数代名詞が集合体としてのイスラエルの民を指すため、自然な日本語で明示した。
theological_decisions:
- issue: שָׂם の主語
  choice: 主は
  alternative: 彼は／モーセは
  rationale: 直前の明示的主語である主と、続く神による試みという文脈から、主を主語と判断した。ただしヘブライ語の動詞形だけでは主語名は明記されていない。
- issue: 民に対する代名詞の数
  choice: 民のために／民を
  alternative: 彼のために／彼を
  rationale: 単数接尾辞を、集合単数として扱われるイスラエルの民への指示と解した。直後の複数形による語り（次節）とも整合する。
translation_notes:
  register: 明快で dignified な現代標準日本語とした。神名 יהוה は日本語聖書で広く通用する「主」とし、モーセと民は文脈上の指示対象を明確にするため名詞で補った。
