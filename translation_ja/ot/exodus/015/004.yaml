  to: ファラオの戦車と軍勢を、主は海に投げ込んだ。選り抜きの将校たちも、葦の海[a]に沈められた。
  rationale: 第一節の動詞を能動形「投げ込んだ」に改め、文脈上の主語である主がファラオの戦車と軍勢を海へ投げ込んだというヘブライ語の構文と意味を正確に反映した。第二節の受動表現と「葦の海」の訳および脚注は維持した。
