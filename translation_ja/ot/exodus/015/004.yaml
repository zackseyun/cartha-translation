review_pass:
  verdict: revise
  source_fidelity: 'יַרָה is a Qal perfect with the LORD as its contextually supplied subject (from v. 3), and it is active: “he hurled/cast.” The draft’s 「主は…投げ込まれた」 incorrectly uses a passive verb while retaining 主 as the grammatical subject. The second clause appropriately reflects the passive טֻבְּעוּ (“were sunk”). 「葦の海」 accurately renders יַם־סוּף, while the note appropriately records the traditional designation.'
  naturalness: Apart from the active/passive mismatch in the first clause, the Japanese is clear, dignified, and suitably concise for the poetic context. Changing the first verb to 「投げ込んだ」 yields natural modern standard Japanese and preserves the parallel structure.
  terminology: 「ファラオ」「戦車」「軍勢」「将校たち」 are suitable. 「選り抜きの将校たち」 conveys מִבְחַר שָׁלִישָׁיו without over-specifying the precise military office. 「主」 is warranted by the immediate context and is a standard rendering of the divine name in this translation register.
  issues:
  - severity: high
    issue: First-clause verb is passive despite an active Hebrew verb and an explicit Japanese subject.
    rationale: 「主は…投げ込まれた」 makes 主 the subject of a passive predicate, whereas the Hebrew means that the LORD cast Pharaoh’s chariots and army into the sea. 「主は…投げ込んだ」 restores both grammar and source meaning.
  revised_text: ファラオの戦車と軍勢を、主は海に投げ込んだ。選り抜きの将校たちも、葦の海[a]に沈められた。
  revised_footnotes:
  - marker: a
    text: 伝統的には「紅海」と訳される。ヘブライ語では「葦の海」。
    reason: lexical_alternative
  revision_rationale: 第一節の動詞を能動形「投げ込んだ」に改め、文脈上の主語である主がファラオの戦車と軍勢を海へ投げ込んだというヘブライ語の構文と意味を正確に反映した。第二節の受動表現と「葦の海」の訳および脚注は維持した。
