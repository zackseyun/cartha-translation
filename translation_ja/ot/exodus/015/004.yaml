id: EXO.15.4
reference: Exodus 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: ja
  text: ファラオの戦車と軍勢を、主は海に投げ込んだ。選り抜きの将校たちも、葦の海[a]に沈められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「紅海」と訳される。ヘブライ語では「葦の海」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: 戦車
  rationale: ファラオの軍用戦車を具体的に指す複数名詞。日本語では集合的に「戦車」とするのが自然である。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語の聖書・歴史用語に定着した表記。
- source_word: וְחֵילוֹ
  choice: と軍勢
  rationale: חַיִלはここでは富や能力ではなく軍事力を指す。「軍勢」は詩的な格調を保ちつつ明瞭である。
- source_word: יָרָה
  choice: 投げ込まれた
  rationale: 投げる、放つという動作を表す語。海への方向を自然に示し、詩の力強さを保つ。ヘブライ語では主語が明示されないが、直前の賛歌の文脈上「主」を補った。
- source_word: וּמִבְחַר
  choice: 選り抜きの
  rationale: 選ばれた最良の者という意味を、自然な現代日本語で表す。
- source_word: שָׁלִשָׁיו
  choice: 将校たち
  rationale: 戦車部隊との関係も考えられる高位の軍人を指すが、具体的階級は確定しにくいため、過度に限定しない「将校」とした。
- source_word: טֻבְּעוּ
  choice: 沈められた
  rationale: 受動形を保ち、水中に沈められたという像を表す。「溺れ死んだ」として死因だけに狭めない。
- source_word: בְיַם סוּף
  choice: 葦の海
  rationale: יַםは海、סוּףは葦を意味するため、原語の語義を優先した。伝統的な「紅海」は脚注に示す。
theological_decisions:
- issue: יַם סוּףの訳語
  choice: 葦の海
  alternative: 紅海
  rationale: 原語の字義を本文で保持し、日本語で広く知られる伝統的名称は読者の便宜のため脚注に残した。
- issue: יָרָהの主語の明示
  choice: 「主は」を補う
  alternative: 主語を省略して「海に投げ込まれた」とする
  rationale: ヘブライ語本文のこの節には主語名詞がないが、前節の「主」を受ける三人称単数動詞である。日本語で行為者を明確にしつつ、文脈上の指示を変えないため「主は」と補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、出エジプト記の歌にふさわしい簡潔で格調ある調子と、二行の詩的並行性を保った。
