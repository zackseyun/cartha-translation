  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: ja
  text: モーセは義父を迎えに出て行き、身をかがめ、口づけをした。それから、二人は互いの安否を尋ね合い[a]、天幕に入った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「互いに平安について尋ねた」。ここでの「平安」は、無事や健康を含む暮らしの状態を指す。
    reason: ヘブライ語の慣用表現שאל לשלוםと、その基礎にある「平安」の語義を示すため。
lexical_decisions:
- source_word: לִקְרַאת
  choice: 出迎えに
  rationale: יצאと結びつき、到着した親族を迎えるために外へ出ることを自然に表す。偶然の遭遇ではない。
- source_word: חֹתְנוֹ
  choice: しゅうと
  rationale: この文脈では、モーセの妻の父エトロを指す。現代日本語で理解しやすい具体的な姻族関係を示した。
- source_word: וַיִּשְׁתַּחוּ
  choice: ひれ伏して
  rationale: 深く身をかがめる敬意の所作を表す。礼拝と断定する語は加えず、原語の身体動作を保った。
- source_word: וַיִּשַּׁק לוֹ
  choice: 彼に口づけした
  rationale: 親族を迎える際の慣習的な接吻を、対象を明示して簡潔に訳した。
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: 二人は互いの安否を尋ね合い
  rationale: איש לרעהוの相互性と、שאל לשלוםという『無事・健康状態を尋ねる』慣用句の意味を自然な日本語で表した。שלוםの字義的な『平安』は脚注に残した。
- source_word: הָאֹהֱלָה
  choice: 天幕に入った
  rationale: 方向を示す語尾を移動表現『入った』に反映した。定冠詞は日本語では自然に無標とし、原文にない『モーセの』は補わなかった。
theological_decisions:
- issue: モーセがエトロの前でひれ伏した行為の意味
  choice: 敬意を示す身体的所作として訳す
  alternative: 礼拝行為と解する
  rationale: この動詞は礼拝にも用いられるが、ここでは人間であるしゅうとを迎えて口づけする一連の挨拶の中にある。訳文では動作そのものを示し、礼拝との神学的解釈を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。『義父』より物語文に自然な『しゅうと』を用い、『天幕』で古代の住居形態を簡潔に示した。主語の複数形を『二人』として明示し、誰が天幕に入ったかを自然に伝えた。
