  naturalness: 「彼に口づけした」は意味は通るが、「口づけをした」のほうが自然である。「義父を迎えに出て行き」は、出て迎えるという原文の移動を簡潔かつ自然に表す。
  terminology: 「義父」は親族関係を明確にし、「天幕」は古代の住居を指す文脈に適した語である。「安否を尋ね合う」はשאל לשלוםの慣用的意味を自然に伝える。脚注では「平安」の字義と、ここでの慣用的意味を区別して示す。
