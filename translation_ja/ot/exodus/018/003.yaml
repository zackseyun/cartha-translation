source:
  edition: WLC
  text: וְ/אֵ֖ת שְׁנֵ֣י בָנֶ֑י/הָ אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אֶחָד֙ גֵּֽרְשֹׁ֔ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: ja
  text: また、彼女の二人の息子を連れて来た[a]。その一人の名はゲルショムであった。モーセが「私は異国の地で寄留者であった」と言ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「連れて来た」は前節の動詞を補ったもの。直訳では「また、彼女の二人の息子を」。ヘブライ語の「寄留者」は、よそ者、外国人、仮住まいの者を指し得る。
    reason: 前節から補われる動詞と、גֵּר の訳語上の幅を示すため。
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: また、彼女の二人の息子を連れて来た
  rationale: וְאֵת は前節の動詞と結びつく目的語を導く。日本語では文脈上の動作を補い、「また…を連れて来た」として継続する構文を明瞭にした。בָנֶיהָ は性別を保って「息子」とした。
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: その一人の名は
  rationale: 二人のうち一人を指す表現であり、出生順を明示する「最初の」ではなく「その一人」とした。
- source_word: גֵּרְשֹׁם
  choice: ゲルショム
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な形に音写した。
- source_word: כִּי אָמַר
  choice: モーセが…と言ったからである
  rationale: כִּי の命名理由を示す説明機能を「からである」で表した。ヘブライ語では主語が省略されているが、文脈上の発言者を明確にするため「モーセ」を補った。
- source_word: גֵּר
  choice: 寄留者
  rationale: 自国ではない土地に滞在する外来者という意味を保つ。「外国人」よりも、一時的・非本国的な居住者という含意を伝えやすい。
- source_word: הָיִיתִי
  choice: となった
  rationale: 完了形の過去的意味を自然な日本語で表した。単なる身分の叙述として「であった」とする可能性も脚注に示した。
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: 異国の地で
  rationale: 「自分に属さない外国の土地」という意味を、簡潔で自然かつ格調を保つ日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、命名理由の格調を保った。「寄留者」は日常語よりやや文語的だが、גֵּר の社会的・居住的な含意を「外国人」より正確に保てる。
