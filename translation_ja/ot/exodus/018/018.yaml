lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: 必ず疲れ果ててしまう
  rationale: 不定詞絶対形と未完了形による強調を「必ず」で表し、過重な働きによる消耗という文脈上の意味を自然な現代日本語で示した。
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: あなたも、あなたと共にいるこの民も
  rationale: 反復される גַּם がモーセと民の双方を含むことを「も……も」で明確にした。עָם は集合的単数なので「この民」とした。
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: この務めはあなたには重すぎて
  rationale: כָבֵד の「重い」という比喩を保持しつつ、直前の裁きの働きを指す דָּבָר を過度に限定しない範囲で「務め」とした。מִמְּךָ の比較的用法は「あなたには重すぎる」と表した。
- source_word: לֹא תוּכַל עֲשֹׂהוּ לְבַדֶּךָ
  choice: あなた一人では果たせない
  rationale: 能力の否定と単独で行うことの不可能性を簡潔に表した。「果たす」は עשה の対象が務めである文脈に自然に対応する。
