id: EXO.18.21
reference: Exodus 18:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: ja
  text: しかし、あなたは民全体の中から、有能な男たち[a]、神を畏れる者たち、誠実な男たち[b]、不正な利益を憎む者たち[c]を選び出し、彼らを民の上に、千人の長、百人の長、五十人の長、十人の長として任命しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力量のある男たち」または「勇敢な男たち」とも訳せる。ヘブライ語は、文脈により力、能力、勇気などを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「真実の男たち」。ここでは「信頼できる男たち」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「不当な利得を憎む者たち」とも訳せる。腐敗した手段で得る利益を退けることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: 選び出し
  rationale: 基本義は「見る」だが、ここでは資格を見極めて選ぶことを表す。「選び出す」は文脈上の実際的な意味を自然に伝える。
- source_word: מִכָּל־הָעָם
  choice: 民全体の中から
  rationale: 部分を示す前置詞句を自然な日本語で表し、候補者が民全体から選ばれることを明確にする。
- source_word: אַנְשֵׁי חַיִל
  choice: 有能な男たち
  rationale: חַיִל は力、勇気、能力、力量を含み得る。司法・行政を担う者の資格という文脈では「有能な」が適切であり、אִישׁ の男性表現も保持する。
- source_word: יִרְאֵי אֱלֹהִים
  choice: 神を畏れる者たち
  rationale: 単なる恐怖ではなく、神への畏敬を伴う倫理的資質を表すため「畏れる」とした。
- source_word: אַנְשֵׁי אֱמֶת
  choice: 誠実な男たち
  rationale: 直訳は「真実の男たち」だが、אֱמֶת がここで表す真実さ、信頼性、忠実さを現代日本語で自然に伝える。
- source_word: שֹׂנְאֵי בָצַע
  choice: 不正な利益を憎む者たち
  rationale: בֶּצַע は不当に得る利益や利得への貪欲を指し得る。「賄賂」だけに限定せず、腐敗した利得を退ける意味を保つ。
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: 彼らを民の上に…任命しなさい
  rationale: 二つの代名詞の指示対象を日本語で明確にし、選ばれた者を民の監督者として置く意味を表す。
- source_word: שָׂרֵי
  choice: ～人の長
  rationale: שַׂר の指導者・役人という行政的意味を簡潔に表し、不要な軍事的含意を避ける。
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: 千人…百人…五十人…十人
  rationale: 段階的な監督単位を表すヘブライ語の数詞を、日本語で慣用的な「千人の長」等として直接表現する。
theological_decisions:
- issue: 指導者の資格における性別表現
  choice: 有能な男たち…誠実な男たち
  alternative: 有能な人々…信頼できる人々
  rationale: 原文の אַנְשֵׁי は男性複数を明示するため、その形を本文に保持する。ただし、この節の文言を越えた一般的な教理的主張は加えない。
- issue: 「神を畏れる」の意味
  choice: 神を畏れる者たち
  alternative: 神を恐れる者たち
  rationale: יִרְאֵי אֱלֹהִים は神への畏敬と、それに基づく倫理的姿勢を資格として挙げる表現である。「畏れる」はその含みを保つ。
translation_notes:
  register: 明瞭で現代的かつ dignified な標準日本語を用いた。「民」「畏れる」「長」は聖書文体として自然でありながら、一般の読者にも理解しやすい語である。原文の資格列挙を保ちつつ、日本語では各要素の関係が明確になるよう「者たち」を補った。
