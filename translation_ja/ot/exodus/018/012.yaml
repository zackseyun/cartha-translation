source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: ja
  text: その後、モーセのしゅうとであるイテロは、神にささげる全焼のささげ物といけにえを取り、アロンとイスラエルの長老たちは皆、モーセのしゅうとと共に、神の前で食事をする[a]ためにやって来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「パンを食べるために」。この表現は「食事をする」という意味でも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 携えて来た
  rationale: 基本義は「取る」だが、ここでは神への供え物を用意して携える行為を表す。「ささげた」と断定して動作を補いすぎず、日本語として自然な「携えて来た」とした。
- source_word: חֹתֵן מֹשֶׁה
  choice: モーセのしゅうと
  rationale: この物語ではモーセとイテロの姻族関係を示す。「しゅうと」は現代日本語では通常、妻または夫の父を指し、文脈に適する。
- source_word: עֹלָה
  choice: 全焼のささげ物
  rationale: 祭儀用語として、全体を焼いてささげる供え物を明確に表す。「焼き尽くすささげ物」より簡潔で、意味も伝わりやすい。
- source_word: זְבָחִים
  choice: いけにえ
  rationale: עֹלָהとは区別された複数の犠牲を表す一般的な祭儀語として、自然で定着した「いけにえ」を用いた。
- source_word: לֵאלֹהִים
  choice: 神への
  rationale: 前置詞לの献呈先・目的を自然な日本語で示し、供え物が神に向けられたものであることを表す。
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: アロンとイスラエルの長老たちは皆……やって来た
  rationale: ヘブライ語では先行する動詞が単数形だが、アロンと全長老を複合主語として自然な複数相当の日本語にした。
- source_word: לֶאֱכָל לֶחֶם
  choice: 食事をするために
  rationale: 字義は「パンを食べる」だが、ヘブライ語では食事をすることを表す慣用句になり得る。本文では自然な意味を示し、字義を脚注に残した。
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: モーセのしゅうとと共に
  rationale: 原文がイテロの名ではなく姻族関係を繰り返すため、その談話上の特徴を保持した。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 神の前で
  rationale: 「神の臨在のもとで」という荘厳な祭儀的含意を保ちつつ、簡潔で原文に近い表現とした。
theological_decisions:
- issue: 犠牲奉献の文脈における食事の意味
  choice: 供え物に続き、神の前で共にする祭儀的な食事として読める表現を保持する。
  alternative: 単に普通のパンまたは日常の食事を共にしたと読む。
  rationale: いけにえ、アロンと長老たちの参加、「神の前で」という表現の組み合わせは聖なる共同の食事を示唆する。ただし本文に「契約の食事」などの解釈語は加えず、性格を断定しない。
- issue: אֱלֹהִיםの指示対象
  choice: 神
  alternative: 神々
  rationale: イスラエルの神について語る物語文脈と、定冠詞を伴う後半の用例から、単数の「神」が適切である。
translation_notes:
  register: 現代標準日本語の、平明で品位ある聖書文体を採用した。「しゅうと」は漢字を避けて読みやすくし、祭儀語は「全焼のささげ物」「いけにえ」とした。本文では慣用句の意味を自然に訳し、原文の具体的表現は脚注で示した。
