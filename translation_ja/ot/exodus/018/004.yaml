source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: ja
  text: もう一人の名はエリエゼル[a]であった。私の父の神は私の助けであり、ファラオの剣から私を救い出してくださったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エリエゼル」は「私の神は助け」という意味。ヘブライ語本文には「彼は言った」に当たる語はなく、そのまま「私の父の神は私の助けであり……」と続く。
    reason: 固有名の語義と、名づけの理由を示す句に発話動詞が明示されないことを説明するため。
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: もう一人の名は
  rationale: 直前に挙げられた一人に対する「もう一人」を自然な日本語で表し、接続詞וְによる物語の連続も文脈に含ませた。
- source_word: אֱלִיעֶזֶר
  choice: エリエゼル
  rationale: 固有名を日本語の一般的な聖書表記に従って音写した。後続の説明との語義上の響きは、説明文自体によって保たれる。
- source_word: כִּי
  choice: からである
  rationale: 名づけの理由を導く説明的・因果的用法を明確で格調ある現代日本語にした。
- source_word: אֱלֹהֵי אָבִי
  choice: 私の父の神
  rationale: 構文を近く保ち、「父が信じた神」と限定的に言い換えず、原文の簡潔さと含意を維持した。
- source_word: בְּעֶזְרִי
  choice: 私の助けであり
  rationale: 名詞עֵזֶרを「助け」として保持し、エリエゼルという名との語の響きを伝える。文脈上の回顧を示す一方、ヘブライ語の名詞節には時制が明示されないため、日本語では説明句として自然な「であり」を選んだ。
- source_word: וַיַּצִּלֵנִי
  choice: 私を救い出してくださった
  rationale: נצלの具体的な救出の意味を表し、神を主語とする日本語として自然な敬意を添えた。
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: ファラオの剣から
  rationale: 原文の比喩的にも具体的にも読める表現をそのまま保ち、単に「脅威」や「権力」と解釈し切らないようにした。
theological_decisions:
- issue: 名づけの説明に発話動詞がないこと
  choice: 「彼は言った」を補わず、説明内容を引用符で示した
  alternative: 「彼は言った。『……』」と発話動詞を補う／引用符を用いず地の文として続ける
  rationale: 原文には発話動詞がないため補わない。日本語では引用符によって名づけの根拠となる言葉であることを読みやすく示すが、誰がいつ発言したかまでは断定しない。
- issue: בְּעֶזְרִי の時間的含意
  choice: 「私の助けであり」
  alternative: 「私の助けであった」
  rationale: ヘブライ語は無動詞節で時制を明示しない。救出は過去の出来事だが、神が助けであるという継続的な告白としても読める余地を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、名づけの由来を述べる文としての格調を保った。「救い出してくださった」は神への敬意を自然に表す。「ファラオ」は現代日本語で広く通用する表記とした。
