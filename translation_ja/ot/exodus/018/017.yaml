  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: ja
  text: モーセのしゅうとは彼に言った。「あなたがしていることは良くない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法は、日本語では通常、接続詞を明示せず、自然な発話導入として訳す。
- source_word: חֹתֵן מֹשֶׁה
  choice: モーセのしゅうと
  rationale: 連語形が表す姻族関係を簡潔に保持する。「しゅうと」は漢字表記では性別や関係の区別が読者に分かりにくいため、平仮名とした。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 代名詞の指示先であるモーセを、不必要に固有名詞へ置き換えずに表す。
- source_word: לֹא טוֹב
  choice: 良くない
  rationale: טוֹב の基本的な評価語義を保ち、「正しくない」「有益でない」などへ狭めない。
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: あなたがしていること
  rationale: 直訳的な「あなたが行っているその事柄」より自然な現代日本語で、定冠詞付き名詞と関係節の意味を一体として伝える。
- source_word: עֹשֶׂה
  choice: している
  rationale: 分詞が示す継続中の行為を、日本語の進行・継続表現で示す。
