  language: en
  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: ja
  text: それから、モーセは義父を送り出した[a]。義父は自分の土地へ帰って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセは義父を去らせた」。
    reason: שׁלח のピエル形は、人を送り出すことにも、去らせることにも訳し得るため。
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 送り出した
  rationale: ピエル形で人を目的語に取り、その人を送り去る、または退出させることを表す。「送り出した」は、モーセがしゅうとの出立を正式に見送ったという文脈に自然に合い、強制的に追い払ったとの含みを避ける。
- source_word: חֹתְנוֹ
  choice: しゅうと
  rationale: חֹתֵן は婚姻による男性親族を指し得るが、この文脈ではモーセの妻の父エトロを指す。「しゅうと」はその関係を簡潔かつ明確に表す。
- source_word: וַיֵּלֶךְ לוֹ
  choice: 去って行った
  rationale: לוֹ はここでは慣用的な与格であり、日本語で独立して訳し出す必要はない。「去って行った」は出立の動きを自然に表す。
- source_word: אֶל אַרְצוֹ
  choice: 自分の土地へ
  rationale: אֶרֶץ は「土地」「国」を意味し得る。「自分の土地」は所有の意味を明示しつつ、近代的な国家概念を不必要に持ち込まない。
theological_decisions: []
translation_notes:
  register: 明瞭で簡潔な現代標準日本語とし、物語文としての品位を保った。「しゅうと」は日常的に理解できる表記を採用し、原文の二つの継続的な動作を二文で自然に示した。
