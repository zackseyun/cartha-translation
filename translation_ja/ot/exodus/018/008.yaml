reference: Exodus 18:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: ja
  text: モーセは義父に、ヤハウェがイスラエルのために[a]ファラオとエジプトに対してなさったすべてのこと、道中で彼らに降りかかったあらゆる苦難[b]、そしてヤハウェが彼らを救い出されたことを語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルのゆえに」「イスラエルに関して」。
    reason: 原語の句は、イスラエルに関わる理由・事情・関係を表し得るため。
  - marker: b
    text: 「苦難」は「困難」「災難」とも訳せる。
    reason: 原語は旅の途上で経験した苦しみ、困難、災難を広く表し得るため。
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 語った
  rationale: ピエル形の「詳しく語る、物語る」という意味を、自然で格調ある現代日本語で表した。
- source_word: חֹתְנוֹ
  choice: しゅうと
  rationale: 文脈上はモーセの妻の父エテロを指す。漢字表記による意味の限定や読みにくさを避け、平仮名とした。
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: ヤハウェがファラオとエジプトに行われたすべてのこと
  rationale: 前置詞 לְ を過度に解釈して「敵対して」とせず、「に」によって原文の関係を保った。尊敬語の「行われた」は神の行為を自然に述べる。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: イスラエルのために
  rationale: 原因・関わり・利益を表し得る句を、この文脈で自然な「のために」とした。別の因果的な理解は脚注に示した。
- source_word: הַתְּלָאָה
  choice: 苦難
  rationale: 旅の途上で経験した困苦や難儀を含む語として、簡潔で格調ある集合的表現を選んだ。
- source_word: מְצָאָתַם
  choice: 彼らに降りかかった
  rationale: 直訳は苦難が彼らを「見いだした」だが、日本語では「降りかかった」が擬人的な迫り来る感覚を自然に伝える。
- source_word: בַּדֶּרֶךְ
  choice: 道中で
  rationale: 出エジプト後の移動途上を、簡潔で自然な日本語で表した。
- source_word: וַיַּצִּלֵם
  choice: 彼らを救い出された
  rationale: 危険や苦難から解放する נצל の意味を保ち、文脈に即して具体的に表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有の神名があるため、称号で代替せず音写した。
- issue: עַל אֹדוֹת יִשְׂרָאֵל の意味関係
  choice: イスラエルのために
  alternative: イスラエルのゆえに／イスラエルに関して
  rationale: イスラエルの益を念頭に置いた行為という文脈的含意を自然に表しつつ、句の因果的解釈を脚注に残した。
- issue: וַיַּצִּלֵם の救出の性格
  choice: 救い出された
  alternative: 助け出された
  rationale: ここでは旅の苦難や危険からの具体的な救出を指し、後代の教理的意味に限定しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文としての品位を保った。「しゅうと」は一般読者の読みやすさを優先して平仮名表記とし、神名は一貫して「ヤハウェ」とした。
