  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: ja
  text: モーセのしゅうとイテロは、モーセの息子たちと妻[a]を伴って、荒野にいるモーセのもとへ来た。モーセはそこで、神の山[b]で宿営していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「彼の息子たちと彼の妻」。文脈上はモーセの家族を指すと考えられるが、文法上はイテロの家族を指す可能性もある。
    reason: 指示対象の曖昧さ
  - marker: b
    text: 「神の山」は、シナイまたはホレブと結び付けられている呼称。
    reason: 呼称の背景
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来た
  rationale: 物語を進めるワイイクトル形。日本語では文脈上、接続語を加えなくても自然に出来事の進行を表せる。
- source_word: יִתְרוֹ חֹתֵן מֹשֶׁה
  choice: モーセのしゅうとイテロ
  rationale: חֹתֵןはここでは婚姻による父、すなわち「しゅうと」を指す。現代の一般読者に通じる語順とした。
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: モーセの息子たちと妻を伴い
  rationale: 接尾代名詞は直訳すれば「彼の」だが、18章2節以下の文脈ではモーセを指すのが最も自然である。「伴い」により、彼らがイテロと共に来たことを明確にした。文法上あり得る別の係り方は脚注に残した。
- source_word: אֶל־מֹשֶׁה אֶל־הַמִּדְבָּר
  choice: 荒野にいるモーセのもとへ
  rationale: 二つのאֶלを機械的に反復せず、移動の到着先が荒野にいるモーセであることを自然な日本語で示した。
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: モーセはそこで……宿営していた
  rationale: 関係節の主語「彼」はモーセを指す。日本語で指示関係を明確にするため独立した文に分けた。
- source_word: הַר הָאֱלֹהִים
  choice: 神の山
  rationale: 本文の呼称をそのまま保ち、この節にない「シナイ」または「ホレブ」という固有名を本文へ持ち込まなかった。
theological_decisions:
- issue: 「その息子たちとその妻」に付く接尾代名詞の指示対象
  choice: 本文ではモーセの息子たちと妻とした。
  alternative: イテロの息子たちと妻と取ることも、文法上は可能である。
  rationale: 直前の18章2–4節では、イテロがモーセの妻ツィポラと二人の息子を引き取ったと述べられており、5節はその一行の到着を続けて記すと読むのが文脈上自然である。ただしヘブライ語の接尾代名詞自体は単に「彼の」であるため、別の係り方を脚注で明示した。
- issue: 「神の山」の同定
  choice: 「神の山」という記述的呼称を保持した。
  alternative: 「シナイ山」または「ホレブ」と明示する。
  rationale: この節のヘブライ語はהַר הָאֱלֹהִיםであり、山の固有名を明記していない。関連する同定は脚注にとどめ、本文の表現を保存した。
translation_notes:
  register: 明快で品位のある現代標準語。「岳父」より一般的な「しゅうと」を用いた。長いヘブライ語文を二文に分け、場所と同行者の関係が誤読されないようにした。
