  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: ja
  text: 翌日、モーセは民を裁くために座った。民は朝から夕方までモーセの前に立っていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセの周りに立っていた」。ヘブライ語の前置詞はより字義的にこのようにも理解できるが、文脈上は、民が裁きを受けるためモーセの前で待っていたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 翌日
  rationale: 物語を進める定型句と時を示す表現を、現代日本語で簡潔かつ自然に表した。וַיְהִי の機能は文の叙述形式に反映されている。
- source_word: וַיֵּשֶׁב מֹשֶׁה לִשְׁפֹּט
  choice: モーセは民を裁くために座り
  rationale: ישׁב の具体的な着座の描写と、לִשְׁפֹּט が示す司法的な目的の両方を保持した。
- source_word: הָעָם
  choice: 民
  rationale: ここではイスラエルの共同体全体を指すため、聖書本文として自然で簡潔な「民」とした。
- source_word: וַיַּעֲמֹד הָעָם
  choice: 民は…立っていた
  rationale: עמד の姿勢を示す基本義を保ちつつ、朝から夕方まで続いた状態を日本語の継続表現で示した。
- source_word: עַל מֹשֶׁה
  choice: モーセの前に
  rationale: 前置詞 עַל は字義的には「上に、そばに」などの幅があるが、この司法的場面では裁きを待ってモーセの前にいることを表すと解した。別の空間的理解は脚注に残した。
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: 朝から夕方まで
  rationale: 一日の長い時間幅を示す原文を、自然で直接的な日本語にした。
