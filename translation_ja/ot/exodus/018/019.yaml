base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: ja
  text: さあ、私の言うことを聞きなさい。私はあなたに助言しよう。神があなたとともにいてくださるように。[a] あなたは民のために神の前に立ち、[b]事柄[c]を神のもとに持って行きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神があなたとともにいてくださる」。ヘブライ語は願いや祝福を表す形と理解できる。
    reason: lexical_alternative
  - marker: b
    text: または「あなたは神の前で民を代表する者となり」。
    reason: alternative_reading
  - marker: c
    text: ここでの「事柄」は、判断を求めて持ち込まれる民の訴えや争いを指す。
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: さあ
  rationale: 時間だけでなく、次の勧告へ移る談話標識として自然な現代日本語にした。
- source_word: שְׁמַע בְּקֹלִי
  choice: 私の言うことを聞きなさい
  rationale: 直訳的な「私の声を聞け」より自然であり、文脈上の勧告を示しつつ、強い「従え」とまでは限定しない。
- source_word: אִיעָצְךָ
  choice: 私はあなたに助言しよう
  rationale: יעץの「助言する、忠告する」を明確かつ格調を保って表した。
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: 神があなたとともにいてくださるように
  rationale: 意志・願望を表す形を、祝福または願いとして自然な日本語で明示した。
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: あなたは民のために神の前に立ち
  rationale: 「民のために、神の前にいなさい」という構造を自然に表し、モーセの代表的役割を過度に専門用語化しないようにした。
- source_word: וְהֵבֵאתָ
  choice: 持って行きなさい
  rationale: 先行する命令に続く指示として機能する形を、日本語の命令表現で明確にした。
- source_word: הַדְּבָרִים
  choice: さまざまな事柄
  rationale: דברの幅広さを保ち、裁判上の「案件」だけに狭めない訳とした。
- source_word: אֶל הָאֱלֹהִים
  choice: 神のもとに
  rationale: 方向を表す前置詞を自然な日本語で表した。
theological_decisions:
- issue: אֱלֹהִיםの訳語
  choice: 神
  alternative: まことの神
  rationale: この文脈ではイスラエルの神を指す単数的用法であり、説明を加えず標準的に「神」とした。
- issue: モーセの仲介・代表的役割の表現
  choice: 民のために神の前に立ち
  alternative: 神の前で民を代表し
  rationale: 代表機能は文脈上明らかだが、本文では原文の関係表現を保ち、解釈を脚注で補った。
- issue: וִיהִיの様態
  choice: 神があなたとともにいてくださるように
  alternative: そうすれば、神があなたとともにいてくださる
  rationale: ヘブライ語の意志・願望的ニュアンスを祝福の願いとして訳し、結果を断定する読みは代案として脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、助言と祝福を含むエテロの発言にふさわしい落ち着いた格調を保った。「聞きなさい」「持って行きなさい」で指示の流れを明確にし、原文にある代表的役割と願望表現の解釈幅は脚注に残した。
