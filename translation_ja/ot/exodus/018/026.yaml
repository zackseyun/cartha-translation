  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: ja
  text: 彼らはいつでも民を裁いていた。難しい案件はすべてモーセのもとへ持って行っていたが、小さな案件はすべて彼ら自身で裁いていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: 彼らは…裁いた
  rationale: שׁפטのカル形は、任命された者たちが継続的に担った裁判の働きを表す。物語の要約として自然な過去形にした。
- source_word: אֶת הָעָם
  choice: 民を
  rationale: עםは出エジプト記において共同体としてのイスラエルを指し、簡潔で聖書文体にもなじむ「民」が適切。
- source_word: בְּכָל עֵת
  choice: いつでも
  rationale: 一度限りではなく、常時裁きに応じる体制を示す。現代日本語として明瞭な「いつでも」とした。
- source_word: אֶת הַדָּבָר הַקָּשֶׁה
  choice: 難しい案件はすべて
  rationale: 司法的文脈でדברは判断を要する事柄・案件を指す。קשהとの組み合わせを、自然かつ明確に「難しい案件」と訳した。定冠詞付き単数は種類全体を指す総称的用法として「すべて」を補った。
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: モーセのもとに持って行き
  rationale: 反復的・慣常的な対応を表す。日本語では前文の「いつでも」と文脈により反復性が十分に伝わるため、自然な連用形とした。
- source_word: וְכָל הַדָּבָר הַקָּטֹן
  choice: 小さな案件はすべて
  rationale: קטןはקשהと対照され、より軽微または簡単な案件を表す。「小さな」は原語の比喩を保ち、「案件」で司法的文脈を明示した。
- source_word: יִשְׁפּוּטוּ הֵם
  choice: 彼ら自身で裁いた
  rationale: 独立代名詞הםの強調を「彼ら自身で」によって保持し、難しい案件を扱うモーセとの役割の対照を示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、司法的文脈と原文の対照構造を保持した。「案件」は日常語としても理解でき、かつ「事柄」より裁判上の意味が明確である。「彼ら自身で」により原文の代名詞の強調を再現した。
