  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: ja
  text: 彼はモーセに言った。「私、あなたの義父エテロが、あなたの妻と、彼女と一緒にいる二人の息子[a]とともに、あなたのところへ向かっています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「彼女の二人の息子」。マソラ本文では三人称女性単数の接尾辞が用いられており、モーセの妻を指す。「あなたの二人の息子」と訳す翻訳もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: 彼はモーセに言った
  rationale: וַיֹּאמֶרを物語を進める通常の過去表現とし、אֶל־מֹשֶׁהの方向性を自然な日本語で示した。文脈から推測して「使いを送って知らせた」と補わず、原文の「言った」を保った。
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: あなたのしゅうとエテロである私が
  rationale: 独立代名詞אֲנִיの明示と強調を残し、חֹתֵןは文脈上、妻の父を指すため「しゅうと」とした。現代日本語で関係が明確になる語順に整えた。
- source_word: בָּא אֵלֶיךָ
  choice: あなたのところへ向かっています
  rationale: 分詞בָּאが表す進行中または目前の到来を、「来ました」と完了させずに表した。
- source_word: וְאִשְׁתְּךָ
  choice: あなたの妻も
  rationale: 接続詞は同行者を加える働きとして「も」で表し、後続文との自然なつながりを確保した。
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: 彼女の二人の息子[a]
  rationale: 三人称女性単数接尾辞をそのまま「彼女の」と訳し、モーセの妻を指す読みを保った。「あなたの二人の息子」と調和させなかった。
- source_word: עִמָּהּ
  choice: 伴っています
  rationale: 息子たちが彼女と一緒にいるという明示的な情報を、自然な日本語の動詞表現で保持した。
