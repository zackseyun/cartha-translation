reference: Exodus 18:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: ja
  text: もしあなたがこのことを行い[a]、神があなたにそう命じるなら、あなたは持ちこたえることができ[b]、この民も皆、それぞれ自分の場所へ平安のうちに帰る[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この事柄」または「この方策」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「立つことができる」。ここでは、重い務めの下で「耐える」「持ちこたえる」という意味。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「この民も皆、彼の場所へ平安のうちに来る」。集合名詞に対応する単数形は、一人一人が自分の場所へ戻ることを表すと理解できる。「自分の場所へ来る」とも訳せる。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אִם
  choice: もし…なら
  rationale: 後続する二つの条件を導く表現として、現代日本語で明瞭な条件構文とした。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: このこと
  rationale: דָּבָר は「こと・事柄・計画」を表し得る。ここでは直前に提案された方策を指すため、「このこと」が自然でありつつ語義の広さも保つ。
- source_word: תַּעֲשֶׂה
  choice: 行い
  rationale: עשה の基本義を保ち、条件節に自然に接続した。
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: 神もあなたにそう命じられるなら
  rationale: 神の命令を、エトロの提案とは別の必要条件として明示した。「そう」は命令内容が先の提案に対応することを示す。
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: あなたは持ちこたえることができ
  rationale: עמד の字義は「立つ」だが、文脈では重い務めの下で耐え続ける意味。「持ちこたえる」は比喩的含意を自然に伝える。
- source_word: וְגַם כָּל־הָעָם הַזֶּה
  choice: この民も皆
  rationale: 単数の集合名詞 עָם と添加を表す וְגַם を、日本語として自然な語順で保持した。
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: それぞれ自分の場所へ…帰ることができる
  rationale: 字義は「彼の場所へ来る／行く」。集合名詞を受ける単数形を分配的に理解し、「それぞれ自分の場所へ」と明示した。前半の וְיָכָלְתָּ が後半にも意味上及ぶ可能性を日本語で表した。
- source_word: בְשָׁלוֹם
  choice: 無事に
  rationale: שָׁלוֹם は平安だけでなく安全・安寧・良好な状態を含む。人々が裁きを終えて戻る文脈では「無事に」が自然。
theological_decisions:
- issue: エトロの助言と神の命令との関係
  choice: 提案の実行と神の命令をともに条件として訳す
  alternative: 「神があなたに命じてくださるだろう」と結果または願望として訳す
  rationale: וְצִוְּךָ אֱלֹהִים は構文上、冒頭の אִם に続く追加条件と読むのが自然であり、エトロの助言が神の承認から独立した権威を持つとは示さない。
- issue: וְיָכָלְתָּ の作用域
  choice: 後半にも意味上及ぶものとして「帰ることができる」と訳す
  alternative: 前半だけに限定し、「この民も皆…帰る」と訳す
  rationale: ヘブライ語は後半で能力表現を反復しないため構文上の余地がある。文脈上はモーセと民の双方に生じる可能な結果を述べると理解できるが、断定的な教義化は避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「持ちこたえる」で文脈上の比喩を伝え、「この民も皆」で原文の集合的表現を自然に保持した。脚注で直訳と主要な語義・構文上の別案を示した。
