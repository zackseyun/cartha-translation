source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: ja
  text: ミディアンの祭司で、モーセの義父であるエテロは、神がモーセのため、またイスラエル、すなわちその民のためになさったすべてのこと、すなわち、ヤハウェがイスラエルをエジプトから導き出されたことを聞いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 聞いた
  rationale: 物語を進める動詞として簡潔に訳し、原文に明示されない「さて」「その時」などの時間・談話標識は加えない。
- source_word: כֹהֵן מִדְיָן
  choice: ミディアンの祭司
  rationale: 連語を、エテロの職務と所属を示す自然な日本語で表した。
- source_word: חֹתֵן מֹשֶׁה
  choice: モーセのしゅうと
  rationale: 婚姻による関係を指し、この文脈ではモーセの妻の父を意味する。「しゅうと」は現代日本語で簡潔にその関係を表す。
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: 神が……なさったすべてのこと
  rationale: כָּל אֲשֶׁר の包括性を保ちつつ、神の行為にふさわしい自然で敬意ある述語とした。
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: モーセと……イスラエルのために
  rationale: 前置詞 לְ はここでは受益を示すため、「～のために」と訳した。
- source_word: עַמּוֹ
  choice: ご自分の民
  rationale: 文脈上もっとも自然な指示対象を神と見て再帰的に表した。ただし、文法上モーセを指す可能性は脚注に残した。
- source_word: כִּי
  choice: すなわち
  rationale: 後続節を、エテロが聞いた内容の具体的説明としてつなぐ用法を明瞭に示した。
- source_word: הוֹצִיא
  choice: 導き出された
  rationale: ヒフィル形の「外へ出させる、連れ出す」を、出エジプトの文脈に即して自然に表した。単なる移動でなく、神による解放と先導を含み得る日本語である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を称号に置き換えず、ヘブライ語の固有名を日本語で音写した。
- source_word: מִמִּצְרָיִם
  choice: エジプトから
  rationale: הוֹצִיא とともに、エジプトの内から外へ連れ出した起点を自然な日本語で示す。
theological_decisions:
- issue: עַמּוֹ の代名詞接尾辞が誰を指すか
  choice: 「ご自分の民イスラエル」＝神の民イスラエル
  alternative: 「その民イスラエル」＝モーセの民イスラエル
  rationale: 先行する אֱלֹהִים と、続くヤハウェによる救出という文脈から、神を指すと取るのが最も自然である。一方、文法上はモーセを指す解釈も可能なので、本文の明瞭さを保ちながら脚注でその緊張を明示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文としての品位を保つ文体とした。「しゅうと」は常用的で簡潔な親族呼称を採用し、神名は「ヤハウェ」と表記した。説明節は「すなわち」で結び、内容関係を読み取りやすくした。
