revisions:
- from: ミディアンの祭司で、モーセのしゅうとであるエテロは、神がモーセと、ご自分の民イスラエル[a]のためになさったすべてのこと、すなわち、ヤハウェがイスラエルをエジプトから導き出されたことを聞いた。
  to: ミディアンの祭司で、モーセの義父であるエテロは、神がモーセのため、またイスラエル、すなわちその民のためになさったすべてのこと、すなわち、ヤハウェがイスラエルをエジプトから導き出されたことを聞いた。
  rationale: 原文と英語監査記録が保持する עַמּוֹ の曖昧さを本文でも保つため、「ご自分の民」を「その民」に改めた。また、明瞭な現代標準語として「しゅうと」を「義父」に改めた。脚注のアンカーと内容は維持し、代替解釈を明示する。
  reviewer_model: gpt-5.6-terra
