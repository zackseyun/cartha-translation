source:
  edition: WLC
  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: ja
  text: モーセの義父イテロは、モーセの妻ツィポラを、彼女が送り返された後に引き取った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「彼女を送り去ることの後」で、誰が送り返したのかを明示していない。文脈からは、「モーセが彼女を送り返した後」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 引き取った
  rationale: 基本義は「取る」だが、この文脈で単に「取った」とすると日本語では不自然で、婚姻の意味にも誤解されうる。「引き取った」は、イテロがツィポラを自分のもとに受け入れたという文脈上の意味を自然に表しつつ、後に彼女を伴って行くことまで動詞自体に読み込まない。
- source_word: יִתְרוֹ
  choice: イテロ
  rationale: ヘブライ語名 יִתְרוֹ の音に沿った、明瞭な日本語表記。
- source_word: חֹתֵן מֹשֶׁה
  choice: モーセの義父
  rationale: חֹתֵן は婚姻による親族関係を表し、ここではモーセの妻の父を指す。「義父」は現代日本語で自然かつ理解しやすい。
- source_word: צִפֹּרָה
  choice: ツィポラ
  rationale: ヘブライ語 צִפֹּרָה の発音に沿って固有名を音写した。
- source_word: אֵשֶׁת מֹשֶׁה
  choice: モーセが妻ツィポラを
  rationale: 原文の「モーセの妻」を、日本語の文の流れに合わせて「モーセが妻ツィポラを送り返した」と組み替えた。ツィポラがモーセの妻であるという関係は明確に保持している。
- source_word: אַחַר
  choice: 後
  rationale: 先行する出来事との時間的な順序を簡潔に示す。
- source_word: שִׁלּוּחֶיהָ
  choice: 送り返した
  rationale: 名詞形は字義的には「彼女を送り去ること／彼女が送り去られたこと」。本文では文脈上もっとも自然なモーセを動作主として補ったが、原文では動作主が明示されないため脚注で曖昧さを保存した。
theological_decisions:
- issue: 「彼女を送り去ること」の動作主
  choice: 本文ではモーセを暗黙の動作主とし、「モーセが……送り返した」とした。
  alternative: 「彼女が送り返された後」または「彼女を送り返した後」として動作主を明示しない。
  rationale: שִׁלּוּחֶיהָ は女性単数の接尾辞を伴う名詞表現で、誰が送り返したかを明示しない。周囲の文脈からモーセが最も自然な動作主だが、原文の曖昧さは真正なものなので脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、簡潔で品位ある物語調とした。「義父」は「舅」より理解しやすく、「引き取った」は不自然な直訳を避けながら、לקח の文脈上の幅をできるだけ保つ。
