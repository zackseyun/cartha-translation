  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: ja
  text: イトロは言った。「ヤハウェがほめたたえられますように。[a] ヤハウェは、あなたがたをエジプト人の手とファラオの手から救い出され、民をエジプト人の手の下から救い出された。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の祝福の定型句。「ヤハウェはほめたたえられるべき方だ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「エジプト人の手」「エジプト人の手の下」は、彼らの力や支配を表すヘブライ語の比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語の次の出来事を示す標準的な表現とし、接続辞וは日本語で不自然な「そして」を加えず文脈の流れに委ねた。
- source_word: יִתְרוֹ
  choice: イトロ
  rationale: ヘブライ語名יִתְרוֹの発音に沿った日本語表記とした。
- source_word: בָּרוּךְ יְהוָה
  choice: ヤハウェがほめたたえられますように
  rationale: 受動分詞による祝福・頌栄の定型句を、現代日本語で自然な祈願表現として訳した。断定的にも理解できる原文の幅は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を音写した。
- source_word: הִצִּיל
  choice: 救い出した／救い出された
  rationale: 敵対的な力や支配から逃れさせる使役形の意味を表す。主語がヤハウェであるため、後半は日本語の敬語として「救い出された」とした。
- source_word: אֶתְכֶם
  choice: あなたがた
  rationale: 男性複数の二人称目的語を明示した。
- source_word: מִיַּד
  choice: 手から
  rationale: 権力・支配を表すヘブライ語の具体的な比喩を保持した。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: ここでは「手」の主体となる圧迫者を指す集合的用法として、日本語では人々を表す形が自然である。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: 王の称号の標準的な日本語表記を用いた。
- source_word: הָעָם
  choice: 民
  rationale: 文脈上、集合体としてのイスラエルを指す簡潔で格調ある表現とした。
- source_word: מִתַּחַת יַד
  choice: 手の下から
  rationale: エジプト人の支配下に置かれていた状態を示す原文の空間的比喩を保持した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、その固有名としての性格を保つ音写を採用した。
- issue: בָּרוּךְ יְהוָהの発話の力
  choice: 祈願的な「ヤハウェがほめたたえられますように」
  alternative: 断定的な「ヤハウェはほめたたえられるべき方だ」
  rationale: この定型句は祈願・宣言・頌栄の含みを持ちうる。本文では自然な祈願表現を採り、断定的理解も脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「民」と反復表現によって聖書物語にふさわしい簡潔な品位を保った。原文に二度ある「救い出す」と「エジプト人の手」の反復、および後半の「手の下」という強められた比喩を維持した。
