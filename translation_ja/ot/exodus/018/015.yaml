base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: ja
  text: モーセは義父に言った。「民が神を求めて[a]、私のところに来るからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神に伺いを立てるために」または「神の裁定を求めて」。このヘブライ語表現には、導きや判断を求めて神に問い合わせる意味も含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める אמר のワイイクトル形を、現代日本語で自然な過去形として訳した。文脈上は問いへの返答だが、「答えた」と限定する必要はない。
- source_word: לְחֹתְנוֹ
  choice: しゅうとに
  rationale: この文脈では、モーセと婚姻関係にあるエトロを指す。日本語の「しゅうと」は現代では表記による意味の揺れがあり得るため、読みやすさを優先して平仮名とした。
- source_word: כִּי
  choice: からです
  rationale: エトロの問いに対する理由を示す因果関係を、自然な日本語の文末表現で明確にした。
- source_word: יָבֹא אֵלַי הָעָם
  choice: 民が……私のところに来る
  rationale: בוא＋אֶל の移動方向を素直に表し、反復・習慣的な行為を日本語の非過去形で示した。
- source_word: לִדְרֹשׁ
  choice: 求めて
  rationale: דרש はここで神を求めることにも、神に伺いを立てて導きや裁定を求めることにもなり得る。本文では広い語義を保ち、文脈上の具体的な可能性を脚注に示した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ヘブライ語の明示的な目的語をそのまま保ち、「神の御心」「神の裁定」などと解釈的に置き換えなかった。
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים の慣用表現
  choice: 神を求めて
  alternative: 神に伺いを立てるために／神の裁定を求めて
  rationale: 争いの裁定という文脈では神への問い合わせや判断の要請を含み得るが、ヘブライ語自体の幅を狭めないよう、本文ではより広い「神を求める」を採用し、限定的な読みは脚注に残した。
translation_notes:
  register: 明快で現代的かつ品位ある会話文とした。「民」は出エジプト記の共同体を指す簡潔な聖書語として保持した。脚注記号[a]は、曖昧さのある「神を求めて」の直後に置いた。
