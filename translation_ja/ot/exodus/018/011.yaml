id: EXO.18.11
reference: Exodus 18:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: ja
  text: 今、私はヤハウェがすべての神々よりも偉大であることを知った。彼らが彼らに対して傲慢に振る舞ったその事において、ヤハウェは彼らにまさっておられたからだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最後の句のヘブライ語は難解で、直訳に近くは「彼らが彼らに対して傲慢に振る舞ったその事において」となる。本文の「ヤハウェは彼らにまさっておられた」は、前半の「すべての神々よりも偉大」を受けて補った理解である。代名詞の指示対象には異説があるが、文脈上、傲慢に振る舞った者をエジプト人、その相手をイスラエルの民と見る解釈がある。
    reason: 原文の圧縮された構文、補われた述語、および代名詞の指示対象に関する曖昧さを保持しつつ、有力な文脈的理解を示すため。
lexical_decisions:
- source_word: עַתָּה
  choice: 今
  rationale: 直前に聞いた救出の出来事を受けて、エトロが現在到達した認識を示す時間副詞として、簡潔で自然な「今」とした。
- source_word: יָדַעְתִּי
  choice: 私は……知った
  rationale: 完了形が新たな経験によって得た認識を表しているため、日本語では到達点を明確にする「知った」とした。
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: ヤハウェがすべての神々より偉大である
  rationale: מִןを伴う比較を「より偉大」と表し、יהוהは称号に置き換えず固有の神名「ヤハウェ」とした。הָאֱלֹהִיםは文脈上、諸民族の神々との対比なので複数の「神々」とした。
- source_word: בַדָּבָר
  choice: まさにその事において
  rationale: 問題となった出来事・事柄を指すדָּבָרの意味を保ちつつ、神の優越がエジプト人の傲慢と同じ局面で示されたという文脈上の強調を自然な日本語で表した。
- source_word: זָדוּ
  choice: 傲慢に振る舞った
  rationale: זיד／זודが示す思い上がった、尊大な行動を、現代日本語で明瞭かつ品位ある表現にした。
- source_word: עֲלֵיהֶם
  choice: イスラエルの民に対して
  rationale: 前置詞עַלを敵対的な「に対して」と捉え、代名詞の指示対象は直前の文脈に基づきイスラエルの民と明示した。ただし難解な節であるため脚注で解釈性を示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いていることを明示し、称号への置換を避けるため「ヤハウェ」と音写した。
- issue: 難解な最終節כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶםの解釈
  choice: エジプト人がイスラエルの民に対して傲慢に振る舞った、まさにその事において、ヤハウェは彼らにまさっておられた
  alternative: 彼らが彼らに対して傲慢に振る舞った、まさにその事によってである
  rationale: ヘブライ語は圧縮され、明示的な主動詞を欠くように見える。文脈上の行為者をエジプト人、被害者をイスラエルとし、前半の「すべての神々より偉大」を受けてヤハウェの優越を補った。ただし原文の曖昧さを隠さないよう脚注を付した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、告白としての荘重さを保った。「傲慢に振る舞った」は古風な「高ぶって扱った」より理解しやすい。難解な末尾は本文を読める形に整えつつ、補足と代名詞解釈を脚注で明示した。
