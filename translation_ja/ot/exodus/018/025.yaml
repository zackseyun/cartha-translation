  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: ja
  text: モーセは全イスラエルの中から有能な人々を選び、民の上に立つかしらとして任命した。すなわち、千人の長、百人の長、五十人の長、十人の長である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: 選び
  rationale: בחרの基本義「選ぶ」を、ヘブライ語の物語叙述の簡潔さを保つ自然な現代日本語で表した。
- source_word: אַנְשֵׁי חַיִל
  choice: 有能な人々
  rationale: חילは力、能力、資質を表し得る。ここでは裁判・行政を担う者の選任なので、軍事的な「勇士」ではなく、適任者としての能力を示す「有能な人々」とした。
- source_word: מִכָּל יִשְׂרָאֵל
  choice: 全イスラエルの中から
  rationale: 民全体を選出母体としたことを明確かつ自然に表す。
- source_word: וַיִּתֵּן אֹתָם
  choice: 任命した
  rationale: נתןの字義は「置く、与える」だが、役職に就けるこの文脈では「任命した」が機能的意味を正確に伝える。
- source_word: רָאשִׁים עַל הָעָם
  choice: 民の上に立つかしら
  rationale: רֹאשׁの「頭」から派生した権威者の比喩を「かしら」で保持し、עַלが示す民に対する統轄関係を「上に立つ」で表した。
- source_word: שָׂרֵי
  choice: 長
  rationale: שַׂרは統轄権を持つ役職者を指す。軍事組織に限定しない行政・司法的文脈に適し、人数区分とも自然に結び付く「長」を採用した。
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: 千人、百人、五十人、十人
  rationale: 各役職者が受け持つ集団の人数区分を、そのまま明瞭に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「かしら」は原文の身体比喩を残しつつ現代でも理解可能であり、各階層には日本語聖書で定着し、非軍事的な統治職にも使える「長」を用いた。
