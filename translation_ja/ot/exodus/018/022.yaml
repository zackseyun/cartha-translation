base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: ja
  text: 彼らがいつでも民を裁くようにしなさい。大きな事柄[a]はすべてあなたのもとへ持って来させ、小さな事柄はすべて彼ら自身に裁かせなさい。こうして、あなたの負担を軽くしなさい[b]。彼らはあなたと共にそれを担うことになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな案件」と「小さな案件」とも訳せる。ヘブライ語は、裁きに持ち込まれる事柄を「大きい」「小さい」と表現している。
    reason: lexical_alternative
  - marker: b
    text: 「負担」はヘブライ語本文に明記されていないが、民を裁く務めが文脈上含意されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: 彼らが民を裁くようにしなさい
  rationale: שׁפטはここでは民の争いを裁定すること。エテロの指示という文脈を踏まえ、自然な命令表現とした。
- source_word: בְּכָל־עֵת
  choice: いつでも
  rationale: 直訳的な「すべての時に」の意味を、継続的に裁判へ対応することを示す自然な日本語で表した。
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: 大きな事柄はすべて
  rationale: דברは裁きに持ち込まれる案件を指すが、「事柄」として原文の語義の広さを保ち、גדולとの直截な対比も残した。
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: あなたのもとに持って来させ
  rationale: 案件をモーセに持ち込ませる意。前後の指示に合わせ、日本語では使役の命令的連鎖として表現した。
- source_word: כָּל־הַדָּבָר הַקָּטֹן
  choice: 小さな事柄はすべて
  rationale: 「大きな事柄」と対をなす原文の「小さい」を保った。「軽微な案件」も可能だが、法的に限定しすぎない表現を選んだ。
- source_word: יִשְׁפְּטוּ הֵם
  choice: 彼ら自身に裁かせなさい
  rationale: 独立代名詞הֵםの対比的強調を「彼ら自身」で表した。
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: こうして、あなたの負担を軽くしなさい
  rationale: הָקֵלはヒフィル命令形なので、結果の叙述ではなく命令として訳した。原文に明示されない目的語は、מֵעָלֶיךָの荷重の比喩と文脈から「負担」と補った。
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: 彼らがあなたと共に担ってくれます
  rationale: נשׂאの「担う」を保った。目的語は原文では省略されているため、本文では重ねて明示せず、直前の「負担」から自然に補える形にした。
