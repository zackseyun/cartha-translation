source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: ja
  text: 彼らに争い事[a]があると、その件は私のところに持ち込まれます。私はある人とその隣人との間を裁き[b]、神の掟とその教え[c]を知らせます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「訴え」または「案件」とも訳せる。原語は広く「事柄」を意味するが、ここでは争いの案件を指す。
    reason: lexical_alternative
  - marker: b
    text: 原文は「ある人とその隣人との間」。個々の争いの当事者を代表的な単数形で表している。
    reason: cultural_note
  - marker: c
    text: 「その法」とも訳せる。原語は広く「教え、指示」を意味し、ここでは法的な文脈で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ～があると
  rationale: ここでは、モーセが通常どのように対処しているかを説明する条件・時の意味を表す。現代日本語の習慣的表現として自然にした。
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: 彼らに争い事がある
  rationale: דָּבָר は広く「事柄」を意味するが、ここでは裁判・紛争の文脈にあるため「争い事」とした。語の広がりは脚注に残した。
- source_word: בָּא אֵלַי
  choice: その件は私のところに持ち込まれます
  rationale: ヘブライ語では単数形で、直前の「事柄」を受けると理解できる。日本語で「その件が私のところに来る」は不自然なため、意味を保って受け身にした。
- source_word: וְשָׁפַטְתִּי
  choice: 私は…間を裁き
  rationale: שׁפט の司法的な判断を直接表し、単なる仲裁や助言に狭めない表現とした。
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: 一人の人とその隣人との間
  rationale: 原文の代表的な単数表現をできるだけ保った。「隣人」は רֵעַ の社会的・法的関係を表し得る。
- source_word: וְהוֹדַעְתִּי
  choice: 知らせます
  rationale: ידע のヒフィル形の使役的意味「知るようにする」を、明瞭で自然な日本語にした。
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: 神の掟
  rationale: 定められた規定・法令を指す חֹק の意味を、格調を保ちつつ一般読者に分かる語で表した。
- source_word: תּוֹרֹתָיו
  choice: その教え
  rationale: תּוֹרָה の基本義である「教え・指示」を保った。ここでは法的効力を帯びるが、「律法」と固定するより原語の意味の幅を残せる。
theological_decisions:
- issue: אִישׁ ... רֵעֵהוּ の代表的単数表現
  choice: 一人の人とその隣人
  alternative: 当事者同士／一方と他方
  rationale: 原文の単数形と対人的関係を可視化しつつ、日本語で不必要に男性だけへ限定しない表現とした。代表的用法であることを脚注で明示する。
- issue: תּוֹרֹתָיו の法的文脈における訳
  choice: その教え
  alternative: その法／その律法
  rationale: 直前の「掟」と司法的文脈から規範性は明らかである一方、תּוֹרָה が持つより広い「教え・指示」の意味を保持した。法的な訳の可能性は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、モーセの司法的役割と神の規範を伝える荘重さを保った。原文の単数主語は「その件は…持ち込まれます」として自然に再現し、語義上の幅は脚注に残した。
