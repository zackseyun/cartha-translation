  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: ja
  text: エトロは、ヤハウェがエジプトの手[a]から救い出したイスラエルのためになさった、すべての良いことを喜んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エジプトの手から」は、エジプトの支配や力から救い出されたことを表すヘブライ語の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: 喜んだ
  rationale: この動詞は喜びやうれしさを表す。文脈に合い、現代日本語として自然な「喜んだ」とした。
- source_word: עַל כָּל הַטּוֹבָה
  choice: すべての良いことを
  rationale: 感情の契機を示す עַל を日本語では目的語として自然に表し、単数集合的な הַטּוֹבָה は「良いこと」と訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、一般的な日本語音写で示した。
- source_word: לְיִשְׂרָאֵל
  choice: イスラエルのために
  rationale: 前置詞 ל はここでは受益を表し、ヤハウェの行為がイスラエルのためであったことを示す。
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: ヤハウェがイスラエルを……救い出されたからである
  rationale: 関係節は直前の良いことの内容・理由を説明すると理解した。男性単数接尾辞は集合体としてのイスラエルを指すため、日本語では名詞を補った。
- source_word: מִיַּד מִצְרָיִם
  choice: エジプトの手から
  rationale: 支配や権力を表すヘブライ語の「手」という比喩を本文に保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を用いているため、称号へ置換せず音写した。
- issue: אֲשֶׁר הִצִּילוֹ の統語的関係
  choice: 「すべての良いこと」の内容または理由を説明する節
  alternative: 「イスラエル」を先行詞とする関係節
  rationale: ヘブライ語は複数の係り受けを許しうるが、節全体を「救出されたからである」と訳すと自然で、救出が喜びの中心的理由であることも保てる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「なさった」と「救い出された」で神の行為への自然な敬意を示すが、過度な古語は避けた。
