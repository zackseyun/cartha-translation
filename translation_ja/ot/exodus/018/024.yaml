lexical_decisions:
- source_word: וַיִּשְׁמַע לְקוֹל
  choice: 声に耳を傾け
  rationale: 「声を聞く」にとどまらず、相手の言葉を受け入れることを表すヘブライ語の慣用表現。本文では「声」を残しつつ、続く「すべて行った」が服従の実行面を明示するようにした。
- source_word: חֹתְנוֹ
  choice: しゅうと
  rationale: 文脈上、モーセの妻の父エトロを指す。現代日本語で明確かつ簡潔な表現とした。
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: עשה の基本義「行う」を直接表し、後続する内容節と自然につながる。
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: その言ったことをすべて
  rationale: 原文の「彼が言ったすべて」を自然な日本語の語順で表し、原文に明示されない時制的含意は加えなかった。
