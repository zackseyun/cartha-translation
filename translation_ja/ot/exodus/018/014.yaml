  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: ja
  text: モーセの義父は、モーセが民のためにしていることをすべて見て、言った。「あなたが民のためにしているこのことは何ですか。なぜ、あなた一人だけが座り、民は皆、朝から夕方まであなたの前に立っているのですか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの前に立っている」は、直訳では「あなたの上に立っている」。ここでは、民が裁きを求めてモーセの前に出て待っていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: モーセのしゅうと
  rationale: חֹתֵןは婚姻による男性親族を指し、文脈ではモーセの妻の父エテロを指す。「しゅうと」は関係を簡潔に表し、固有名を本文に補わない。
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה לָעָם
  choice: モーセが民のためにしていることをすべて
  rationale: 分詞עֹשֶׂהの継続中の行為を「している」で表し、לָעָםは民のための奉仕を示すものとして訳した。代名詞「彼」ではなく「モーセ」として、日本語で指示対象を明確にした。
- source_word: מָה הַדָּבָר הַזֶּה
  choice: このことは、いったい何ですか
  rationale: דָּבָרはここでは物体ではなく、行為・事態を指す。「このこと」とし、「いったい」で問いの強さを自然に表した。
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: あなた一人だけが座り
  rationale: ישׁבの物理的な「座る」と、裁きを行うため席に着く機能的含意の両方を保った。「一人だけ」でלְבַדֶּךָの対比を明確にした。
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: 民は皆、あなたの前に立っている
  rationale: נצבは「立つ」。עַלは字義的には「上に／そばに」だが、ここでは権威者のもとに出頭して待つ状況を指すため、自然な日本語の「前に」とした。字義は脚注に残した。
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: 朝から夕方まで
  rationale: 一日を通した時間の幅を示す定型的な表現として、簡潔で自然な日本語にした。
theological_decisions: []
