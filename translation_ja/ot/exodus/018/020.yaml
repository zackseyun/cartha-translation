  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: ja
  text: あなたは彼らに、掟と教え[a]について警告し、彼らが歩むべき道と、彼らが行うべきことを知らせなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教え」は「律法」とも訳せる。ヘブライ語トーロートは広く教えや指示を意味し得るが、ここでは法的な文脈に置かれている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: あなたは……戒め
  rationale: זהרのヒフィル形は、注意を伴って教え諭すことを表す。司法・行政上の文脈にふさわしい厳粛さと責任の含意を保つため、「戒め」とした。
- source_word: הַחֻקִּים
  choice: 掟
  rationale: חֻקִּיםは定められた規定・法令を指す。「掟」は法的な性格を保ちつつ、現代日本語でも理解しやすい。
- source_word: הַתּוֹרֹת
  choice: 教え
  rationale: תּוֹרָהの複数形で、法的指示を含む幅広い「教え」を表し得る。חֻקִּיםとの並行関係にある法的文脈を踏まえながらも、語本来の意味の広がりを残した。
- source_word: וְהוֹדַעְתָּ
  choice: 知らせなさい
  rationale: ידעのヒフィル形「知るようにする」を、自然な現代日本語で因果的意味を保って表した。
- source_word: הַדֶּרֶךְ יֵלְכוּ בָהּ
  choice: 彼らが歩むべき道
  rationale: 直訳的な「彼らがその中を歩む道」の比喩を、日本語として自然な「歩むべき道」にまとめ、生活・行動のあり方を道と歩みによって表すヘブライ語の比喩を保持した。
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: 行うべき務め
  rationale: מַעֲשֶׂהは行為・なすべき事を指す。ここでは具体的な責務を表すため「務め」とし、後続の動詞との語根反復を「行う」で可能な限り示した。
