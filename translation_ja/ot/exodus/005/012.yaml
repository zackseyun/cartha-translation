lexical_decisions:
- source_word: וַיָּפֶץ
  choice: 散って行った
  rationale: פוץの広範囲への分散という意味を保ちつつ、この文脈では民が強制された状況のもと各地へ散ったことを、自然な日本語で表す。
- source_word: הָעָם
  choice: 民
  rationale: イスラエルの労働者集団を指すעםを、簡潔で聖書本文にふさわしい現代日本語として訳す。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土に
  rationale: בכלの全域にわたる分布を、日本語で自然かつ簡潔に表す。
- source_word: לְקֹשֵׁשׁ
  choice: 集めるため
  rationale: קששが表す、散在する細かな材料を拾い集める行為と、不定詞の目的用法を明確にする。
- source_word: קַשׁ
  choice: 刈り株
  rationale: תבןとの語彙的対比を保つため、畑に残った乾いた茎を示す「刈り株」とした。
- source_word: לַתֶּבֶן
  choice: わらの代わりに
  rationale: לの目的・代用の含みを文脈に即して表し、集めた刈り株が通常支給されるわらの代用品であったことを自然に示す。
