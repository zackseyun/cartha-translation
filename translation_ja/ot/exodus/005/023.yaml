source:
  edition: WLC
  text: וּ/מֵ/אָ֞ז בָּ֤אתִי אֶל פַּרְעֹה֙ לְ/דַבֵּ֣ר בִּ/שְׁמֶ֔/ךָ הֵרַ֖ע לָ/עָ֣ם הַ/זֶּ֑ה וְ/הַצֵּ֥ל לֹא הִצַּ֖לְתָּ אֶת עַמֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: ja
  text: 私がファラオのもとに行き、あなたの名によって[a]語って以来、彼はこの民をひどい目に遭わせてきました[b]。それなのに、あなたはご自分の民を少しも救い出しておられません[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの名によって」は、「あなたの権威を帯びて」または「あなたに代わって」という意味を含む。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼はこの民の状況を悪化させてきました」または「彼はこの民に害を加えてきました」。
    reason: lexical_alternative
  - marker: c
    text: 原文では、「救い出す」という動詞の不定詞絶対形と定動詞を重ねて、否定を強めている。「決して救い出しておられません」または「少しも救い出しておられません」という意味。
    reason: source_form
lexical_decisions:
- source_word: וּמֵאָז בָּאתִי
  choice: 私が……行って以来
  rationale: מֵאָזの起点から現在まで続く時間的意味を「以来」で表した。בואはファラオを目指す移動なので、日本語では自然な「行く」とした。
- source_word: אֶל־פַּרְעֹה
  choice: ファラオのもとに
  rationale: אֶלの方向性を保ちつつ、人物を訪ねる場面に自然な現代日本語とした。
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: あなたの名によって語る
  rationale: 不定詞の目的を表し、בִּשְׁמֶךָの「名を帯び、その権威のもとで」という含みを、神学的重みを失わない定着した表現で訳した。
- source_word: הֵרַע לָעָם הַזֶּה
  choice: 彼はこの民をひどい目に遭わせました
  rationale: רעעの使役形が表す加害と状況の悪化を、明瞭で自然な日本語にした。文法上の三人称男性単数の主語は直前のファラオを指すものとして「彼」とした。
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: それなのに、あなたは……少しも救い出しておられません
  rationale: 不定詞絶対形と定動詞の組み合わせによる否定の強調を「少しも……ない」で表し、文脈上の逆接を「それなのに」で明示した。
- source_word: אֶת־עַמֶּךָ
  choice: ご自分の民
  rationale: 二人称所有を自然な日本語で示し、神に属する民という関係を保った。
theological_decisions:
- issue: モーセの訴えにおける強い否定
  choice: 少しも救い出しておられません
  alternative: まったく救い出してくださっていません
  rationale: ヘブライ語の不定詞絶対形による強調を明確にしつつ、神が最終的に救わないという断定ではなく、その時点まで救出が実現していないという訴えとして表した。
- issue: בִּשְׁמֶךָの訳し方
  choice: あなたの名によって
  alternative: あなたの権威を帯びて／あなたに代わって
  rationale: 神の名による委任と権威の含みを残し、単なる代理行為へ狭めないため、原文に近い表現を本文に採用した。
- issue: הֵרַעの意味範囲
  choice: ひどい目に遭わせました
  alternative: この民の状況を悪化させました／この民に害を加えました
  rationale: ファラオの行為が道徳的悪であることと、実際に民へ害を及ぼしたことの双方を含み得る原語の幅を、本文と脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神への発言には節度ある敬語を用いた。モーセの大胆な訴えは弱めず、「それなのに」「少しも」によって原文の緊張と強調を保った。
