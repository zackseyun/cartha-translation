id: EXO.5.22
reference: Exodus 5:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: ja
  text: そこでモーセはヤハウェのもとに戻って言った。「主よ、なぜこの民に災いをもたらされたのですか。いったいなぜ私を遣わされたのですか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「なぜ、これ、あなたは私を遣わしたのか」。ここで「なぜ、これ」は問いを強める表現。
    reason: 原文の強意的な慣用表現 לָמָּה זֶּה を説明するため。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 戻って
  rationale: שׁוב の語義と、ファラオとの会見後にモーセが神のもとへ戻る文脈を自然な現代日本語で表す。
- source_word: אֶל־יְהוָה
  choice: ヤハウェのもとに
  rationale: 前置詞 אֶל の方向性を「のもとに」で自然に示し、固有の神名 יהוה は「ヤハウェ」とする。
- source_word: אֲדֹנָי
  choice: 主よ
  rationale: 神への敬意ある直接の呼びかけであることを、簡潔で格調ある日本語にする。
- source_word: הֲרֵעֹתָה
  choice: 災いをもたらされた
  rationale: רעע のヒフィル形が表す「害悪・災いを生じさせる」という使役的意味を保ちつつ、神が道徳的悪を行ったと解釈を限定しない表現とする。
- source_word: לָעָם הַזֶּה
  choice: この民に
  rationale: עָם を集合体としてのイスラエルを指す「民」と訳す。
- source_word: לָמָּה זֶּה
  choice: いったいなぜ
  rationale: 字義的には「なぜ、これ」となる強意的な慣用句を、問いの切実さを保つ自然な日本語にする。
- source_word: שְׁלַחְתָּנִי
  choice: 私を遣わされた
  rationale: 二人称男性単数と一人称単数目的語を正確に反映し、神から使命を与えて送り出す意味の「遣わす」を用いる。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の契約の神名を明記しているため、称号「主」と置き換えず音写する。一方、直後の אֲדֹנָי は称号として「主よ」と訳し、両者を区別する。
- issue: הֲרֵעֹתָה が神の行為について含む意味
  choice: 災いをもたらされた
  alternative: 悪を行われた／ひどい目に遭わせた
  rationale: モーセの鋭い訴えと神学的緊張を残しながら、語形の使役的意味を表す。道徳的悪という一義的な解釈には限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、モーセが神に向ける切実で大胆な訴えの調子を保った。神への直接話法では敬語を用いるが、過度に古風な語尾は避けた。
