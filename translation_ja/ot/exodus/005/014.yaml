  text: וַ/יֻּכּ֗וּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר שָׂ֣מוּ עֲלֵ/הֶ֔ם נֹגְשֵׂ֥י פַרְעֹ֖ה לֵ/אמֹ֑ר מַדּ֡וּעַ לֹא֩ כִלִּיתֶ֨ם חָקְ/כֶ֤ם לִ/לְבֹּן֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם גַּם תְּמ֖וֹל גַּם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: ja
  text: ファラオの労役監督たちがイスラエル人を監督するよう任命していたイスラエル人の現場監督たちは、打たれ、こう言われた。「なぜ、おまえたちは以前と同じ[a]れんが作りの割り当てを、昨日も今日も果たさなかったのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「昨日、一昨日のように」。従来どおり、以前と同じように、という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: 打たれて
  rationale: נכה の受動複数形。身体的な処罰を明確にしつつ、殴打や鞭打ちなど方法を原文以上に限定しない。
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: イスラエル人の現場監督たち
  rationale: 強制労働の現場で同胞を取りまとめる下位監督者を指すため、「役人」より文脈に即した表現とした。
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: ファラオの労役監督たちがイスラエル人の上に立てていた
  rationale: נֹגְשִׂים は強制労働を駆り立てる上位監督者。「労役監督」で役割を示し、עֲלֵהֶם の指示対象も日本語で明示した。
- source_word: לֵאמֹר
  choice: こう責められた
  rationale: 引用を導く語だが、受動の「打たれた」に続く発話者は労役監督たちである。日本語では叱責の機能を自然に示した。
- source_word: מַדּוּעַ
  choice: なぜ
  rationale: 直接疑問を簡潔に再現した。
- source_word: לֹא כִלִּיתֶם
  choice: 果たさなかった
  rationale: כלה はここで定められた作業量を完遂する意。「割り当て」と自然に結びつく表現とした。
- source_word: חָקְכֶם
  choice: おまえたちの割り当て
  rationale: 定められた分量を指す。労働文脈で明瞭な「割り当て」を採用した。
- source_word: לִלְבֹּן
  choice: れんが作りの
  rationale: れんがを作る行為を表す不定詞であり、数量だけでなく作業上の割り当てであることを保った。
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: 以前と同じ
  rationale: 字義的には過去の日々を挙げる慣用句で、ここでは従来どおりの意。直後の「昨日も今日も」との不自然な重複を避けた。
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: 昨日も今日も
  rationale: גַּם…גַּם の並列と強調を自然な日本語で保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、強制労働現場の上下関係が分かるよう上位の נֹגְשִׂים を「労役監督」、イスラエル人側の שֹׁטְרִים を「現場監督」と訳し分けた。叱責の直接話法には権力関係を反映して「おまえたち」を用いた。
