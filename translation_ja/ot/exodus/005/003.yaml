- from: 彼らは言った[a]。「ヘブライ人の神が私たちにお会いになりました。どうか私たちを荒野へ三日の道のりを行かせ、私たちの神ヤハウェにいけにえを献げさせてください。そうしなければ、神は疫病か剣によって私たちを打たれるかもしれません。」
  to: 彼らは言った[a]。「ヘブライ人の神が私たちに会われました。どうか、私たちが荒野へ三日の旅をして、私たちの神ヤハウェにいけにえを献げることをお許しください。そうしなければ、神は疫病か剣によって私たちを打たれるかもしれません。」
  rationale: ファラオへの願いを「…することをお許しください」として、外出と犠牲奉献という二つのコホータティブを自然な一続きの許可願いとして表した。「三日の旅」は原文の旅程を保ち、「荒野へ」と合わせても自然である。本文と脚注のどちらにも、神との出会いと召命の両解釈可能性を保持した。
