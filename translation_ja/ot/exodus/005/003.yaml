id: EXO.5.3
reference: Exodus 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: ja
  text: 彼らは言った[a]。「ヘブライ人の神が私たちに会われました。どうか、私たちが荒野へ三日の旅をして、私たちの神ヤハウェにいけにえを献げることをお許しください。そうしなければ、神は疫病か剣によって私たちを打たれるかもしれません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヘブライ人の神が私たちをお召しになりました」。このヘブライ語は、神が彼らに会われたこととも、彼らを召されたこととも理解できる。
    reason: נִקְרָא עָלֵינוּ の語義上の幅を保持するため。
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ヘブライ人の神
  rationale: 構文と物語中の民族的・社会的呼称を保ち、「イスラエル人」と言い換えない。
- source_word: נִקְרָא עָלֵינוּ
  choice: 私たちにお会いになりました
  rationale: קרא のニファル形と עַל の組み合わせが表し得る神との遭遇を、自然で敬意ある日本語にした。召命の意味もあり得るため脚注に残す。
- source_word: נֵלֲכָה נָּא
  choice: どうか私たちを…行かせ
  rationale: 願望・意志を表すコホータティブと、懇願を示す נָא を、ファラオへの許可願いとして自然に表現した。
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 三日の道のり
  rationale: 移動に要する時間または距離を示すヘブライ語の慣用句を簡潔に保った。
- source_word: בַּמִּדְבָּר
  choice: 荒野へ
  rationale: מִדְבָּר は必ずしも砂漠ではなく、人里離れた放牧地を含むため「荒野」とした。
- source_word: וְנִזְבְּחָה
  choice: いけにえを献げさせてください
  rationale: 第二のコホータティブを、外出の目的とファラオへの一続きの願いが明瞭になるよう表した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文にある固有の神名 יהוה を音写し、一般名詞や称号に置き換えない。
- source_word: פֶּן יִפְגָּעֵנוּ
  choice: そうしなければ、神は…私たちを打たれるかもしれません
  rationale: פֶּן の危惧・警告と、ここでの פגע の敵対的・懲罰的な意味を明確な現代日本語で表した。日本語では主語を「神」と補って指示対象を明瞭にした。
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: 疫病か剣によって
  rationale: דֶּבֶר を現代的な「疫病」とし、בְּ の手段的用法を「によって」で両語に及ぼした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を明記しているため、契約の神名を音写して保持した。
- issue: 警告の主体 יִפְגָּעֵנוּ の明示
  choice: 神は…私たちを打たれる
  alternative: 私たちが…打たれる
  rationale: ヘブライ語の三人称単数の主体は直前の「私たちの神ヤハウェ」を受ける。日本語で誤解を避けるため「神」を補ったが、災いが起こるという発言の緊張は保持した。
- issue: וְנִזְבְּחָה の関係
  choice: 行かせ、…献げさせてください
  alternative: 行かせてください。そうすれば…献げます
  rationale: 並列するコホータティブを一続きの願いとして訳しつつ、犠牲奉献が荒野へ行く目的であるという文脈上の関係も自然に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、ファラオへの懇願には「どうか」「ください」を置いた。神への敬意を示す尊敬表現を用いたが、過度に古風な文語は避けた。「いけにえ」は一般読者に通じる表記とした。
