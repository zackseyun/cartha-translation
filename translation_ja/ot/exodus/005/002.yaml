  naturalness: 「ヤハウェとは何者で、私が……なければならないのか」とすれば、ファラオの反抗的な問いを自然な現代標準日本語で表しつつ、原文の「誰なのか、その声に従うとは」という連結を保てる。「イスラエルを行かせる」は日本語の聖書文脈でも明瞭で自然である。
  terminology: 神名は本文で一貫して「ヤハウェ」とし、イスラエル、ファラオも標準的である。「聞き従う」はשמע בְּקוֹלの服従の含意を適切に表す。脚注は四文字神名の原語表記と伝統的な代替表記を過不足なく示している。
