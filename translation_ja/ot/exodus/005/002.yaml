source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: ja
  text: ファラオは言った。「ヤハウェ[a]とは何者で、私がその声に聞き従って、イスラエルを行かせなければならないのか。私はヤハウェを知らない。しかも、イスラエルを行かせない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では神の名「YHWH」。伝統的に「主」と訳され、「エホバ」と表記されることもある。
    reason: 神名の原語表記と主要な伝統的代替表記を示すため。
lexical_decisions:
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語で定着している表記を用いた。
- source_word: מִי יְהוָה
  choice: ヤハウェとは何者だ
  rationale: מִי は身元を問う疑問詞であり、ここではファラオの侮蔑的な挑戦を保つため「何者だ」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文に記された神の固有名を音写した。日本語で広く用いられる「ヤハウェ」を採用し、伝統的表記は脚注に示した。
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: なぜ私がその声に聞き従って……なければならないのか
  rationale: שׁמע בְּקוֹל の「声を聞いて従う」という意味を「声に聞き従う」で表した。疑問文に続く אֲשֶׁר 節の反語的な力は、自然な日本語の「なぜ……なければならないのか」で再現した。
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: イスラエルを去らせる
  rationale: שׁלח の使役的な意味を保ちつつ、民を解放して出て行かせる文脈に合う簡潔な表現とした。
- source_word: לֹא יָדַעְתִּי
  choice: 私は……を知らない
  rationale: 完了形はここでファラオの現在の認識と態度を表す。「認めない」という含意を限定せず、原文同様「知らない」とした。
- source_word: וְגַם
  choice: そのうえ
  rationale: 前言に強い拒絶を付け加える累加の力を自然な日本語で示した。
- source_word: לֹא אֲשַׁלֵּחַ
  choice: 去らせるつもりもない
  rationale: 未完了形が示す目前の決意を、断固とした意志を表す日本語で訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文が称号ではなく四文字神名を直接用いているため、固有名として音写した。ただし正確な古代の発音には不確実性があるので、伝統的な代替表記を脚注に示した。
- issue: 「私はヤハウェを知らない」の意味
  choice: 意味を限定せず「知らない」と訳す
  alternative: 「ヤハウェを認めない」
  rationale: ידע は単なる情報不足だけでなく承認や関係的認識を含み得るが、ここで「認めない」と断定すると原文の意味の幅を狭めるため、曖昧さを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、王の高圧的で侮蔑的な口調を保った。「声に聞き従う」は原文の身体的な比喩を残しつつ、現代の読者にも理解できる表現である。
