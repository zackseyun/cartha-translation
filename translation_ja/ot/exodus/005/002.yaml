revisions:
- from: ファラオは言った。「ヤハウェ[a]とは何者だ。なぜ私がその声に聞き従って、イスラエルを去らせなければならないのか。私はヤハウェを知らない。そのうえ、イスラエルを去らせるつもりもない。」
  to: ファラオは言った。「ヤハウェ[a]とは何者で、私がその声に聞き従って、イスラエルを行かせなければならないのか。私はヤハウェを知らない。しかも、イスラエルを行かせない。」
  rationale: 「なぜ」を除いて、問いの焦点をヤハウェの身元と、それゆえに従うことへのファラオの拒絶に戻した。「去らせる」を「行かせる」に改め、出エジプトの文脈における「手放して出て行かせる」という意味を、現代日本語として自然に表した。神名の音写と脚注は維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:22Z'
