  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: ja
  text: イスラエル人の監督たちは、「おまえたちは、れんがの日ごとの割当量を減らしてはならない」と言われて、自分たちが苦境に陥ったことを悟った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 悟った
  rationale: 基本義は「見る」だが、ここでは命令の内容から自分たちの苦境を認識したという文脈上の意味を、自然な現代日本語で表す。
- source_word: שֹׁטְרֵי בְנֵי יִשְׂרָאֵל
  choice: イスラエルの監督たち
  rationale: שֹׁטְרִים はエジプトの権威の下で同胞の労働を管理する下級役人を指す。「監督たち」は文脈上の役割を明確にし、「イスラエル」は民族集団を表す自然な日本語とした。
- source_word: אֹתָם בְּרָע
  choice: 自分たちが苦境に陥った
  rationale: אֹתָם は監督たち自身を指し、בְּרָע は道徳的悪ではなく不利で困難な状況を意味する。再帰的な指示を明示しつつ自然に訳した。
- source_word: לֵאמֹר
  choice: と言われて
  rationale: 後続の発言内容を導入し、それによって彼らが苦境を悟った関係を自然に示す受動表現とした。
- source_word: לֹא תִגְרְעוּ
  choice: 減らしてはならない
  rationale: גרע の「減らす、差し引く」という意味と、否定命令の強い拘束を明確に表す。
- source_word: מִלִּבְנֵיכֶם דְּבַר יוֹם בְּיוֹמוֹ
  choice: 日ごとに定められたれんがの数
  rationale: 直訳的には「あなたがたのれんがから、その日の分をその日に」であり、毎日課された数量を減らしてはならないという意味を、簡潔で自然な日本語にまとめた。
