  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: ja
  text: そこで、民を駆り立てる監督たちと民の役人たちは出て行き、民に告げた[a]。ファラオはこう言っている。『あなたがたに、わらは与えない。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民の役人たち」は「民の現場監督たち」とも訳せる。ヘブライ語は、民の中に置かれた下級役人を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: 民を駆り立てる監督たち
  rationale: 強制労働の割り当てを厳しく取り立てる者を指すため、単なる「監督」よりも抑圧的な職務が伝わる表現とした。
- source_word: שֹׁטְרָיו
  choice: 民の役人たち
  rationale: 接尾辞は民を指すと理解し、民の中から立てられた下級役人という行政的な意味を保った。文脈上「現場監督たち」も可能である。
- source_word: וַיֵּצְאוּ
  choice: 出て行き
  rationale: ファラオのもとから民のところへ移動する物語上の動きを自然に表した。
- source_word: הָעָם
  choice: 民
  rationale: イスラエルの労働に従事する民を指す集合名詞として簡潔に訳した。
- source_word: לֵאמֹר
  choice: 告げた
  rationale: 直訳的な「言って」ではなく、布告を伝達する場面に合う自然な日本語とした。
- source_word: כֹּה אָמַר
  choice: こう言っている
  rationale: 使者の定型句を現代日本語で自然に表し、ファラオの現在の命令としての効力も保った。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: 王の称号として日本語聖書で広く理解される標準的な音写を用いた。
- source_word: אֵינֶנִּי נֹתֵן
  choice: 与えない
  rationale: 分詞構文の現在的・継続的な拒絶を簡潔に表現した。「今後は与えない」も文脈上可能だが、未来だけに限定しない形を選んだ。
- source_word: תֶּבֶן
  choice: わら
  rationale: れんが作りに用いる材料を指す標準的で平易な訳語。
