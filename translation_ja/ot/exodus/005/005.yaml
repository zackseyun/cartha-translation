  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה הֵן רַבִּ֥ים עַתָּ֖ה עַ֣ם הָ/אָ֑רֶץ וְ/הִשְׁבַּתֶּ֥ם אֹתָ֖/ם מִ/סִּבְלֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: ja
  text: ファラオは言った。「見よ、今やこの国の民は大勢いる。それなのに、おまえたちは彼らを重労働から休ませている[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「おまえたちは彼らに労役をやめさせている」または「おまえたちは彼らに労役をやめさせた」。原語の動詞は「やめさせる、休ませる」という使役の意味で、文脈上、進行中のこととも完了したこととも理解され得る。
    reason: 語義および時制・相の代替訳
lexical_decisions:
- source_word: הֵן
  choice: 見よ
  rationale: ファラオが目の前の状況を強く指摘する語。現代語としてやや荘重だが、発言の強調と聖書本文の品位を保つ。
- source_word: רַבִּים
  choice: 大勢になっている
  rationale: 数量の多さを述べる述語用法。日本語では「大勢いる」よりも、文脈上の増加を自然に感じさせる表現とした。
- source_word: עַם הָאָרֶץ
  choice: この地の民
  rationale: 字義的には「その地の民」。ここではエジプト国内のイスラエル人労働者を指すが、「庶民」などと限定的に解釈せず、原語の表現を保った。
- source_word: עַתָּה
  choice: 今や
  rationale: 現在の状況を強調する時間副詞。ファラオの危機感を自然に表す。
- source_word: וְהִשְׁבַּתֶּם
  choice: 休ませようとしている
  rationale: שׁבת のヒフィル形が持つ「やめさせる、休ませる」という使役の意味を示す。前後の文脈に即して進行中の企てに対する非難として訳したが、完了的にも理解できるため脚注で示した。
- source_word: מִסִּבְלֹתָם
  choice: 彼らを重労働から
  rationale: סִבְלֹת は負わされた荷や労役を指す。ここではイスラエル人に課された労働という文脈を明確にしつつ、「苦役」ほど解釈を強めない「重労働」とした。
