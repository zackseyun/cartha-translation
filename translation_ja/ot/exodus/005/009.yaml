  text: תִּכְבַּ֧ד הָ/עֲבֹדָ֛ה עַל הָ/אֲנָשִׁ֖ים וְ/יַעֲשׂוּ בָ֑/הּ וְ/אַל יִשְׁע֖וּ בְּ/דִבְרֵי שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: ja
  text: 男たちに課される労役を重くして、彼らがそれに従事し、偽りの言葉に心を向けないようにせよ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心を向けない」は、「注意を払わない」「顧みない」とも訳せる。ヘブライ語の動詞には、目や心を向け、重く受け止めるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: 重くし
  rationale: 動詞は「重い、重くなる」を表す。ここではファラオの命令として、労役の負担を重くするという文脈上の意味を、自然な日本語で表した。
- source_word: הָעֲבֹדָה
  choice: 労役
  rationale: れんが作りを伴う強制労働の文脈なので、一般的な「仕事」よりも負担と拘束を示す「労役」が適切である。
- source_word: עַל הָאֲנָשִׁים
  choice: 男たちに課す
  rationale: 前置詞 עַל が負担を人々の上に置く像を示すため、「課す」とした。הָאֲנָשִׁים は文脈上、労働に従事する男たちを指すので、その具体性を保った。
- source_word: וְיַעֲשׂוּ בָהּ
  choice: 彼らがそれに従事して
  rationale: 直訳的には「彼らがそれを行い」で、בָהּ は労役を受ける。「それに従事する」とすることで、対象を明確にしつつ、目的・結果の流れを自然に表した。
- source_word: יִשְׁעוּ
  choice: 心を向ける
  rationale: שעה には「目を向ける、注意を払う、顧みる」の意味がある。「心を向ける」は、単に聞く以上に重く受け止める含みを保つ。
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: 偽りの言葉に
  rationale: דִּבְרֵי は「言葉」、שָׁקֶר は「偽り、虚偽」を意味する。ファラオによるモーセとアロンの言葉への否定的評価を、そのまま引用者の見方として保った。
theological_decisions:
- issue: 「偽りの言葉」の話者視点
  choice: ファラオの発言として「偽りの言葉」をそのまま訳す
  alternative: 「彼が偽りと呼ぶ言葉」などと説明を加える
  rationale: 本文はその言葉が客観的に偽りだと確定するのではなく、ファラオがそう断じている発言である。説明を本文に加えず、物語上の緊張を保った。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で威厳のある命令文とした。「労役」で強制労働の文脈を示し、「心を向ける」によって原語の視線・注意・関心の幅を保った。
