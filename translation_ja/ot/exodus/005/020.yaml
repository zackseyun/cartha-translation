source:
  edition: WLC
  text: וַֽ/יִּפְגְּעוּ֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן נִצָּבִ֖ים לִ/קְרָאתָ֑/ם בְּ/צֵאתָ֖/ם מֵ/אֵ֥ת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: ja
  text: 彼らがファラオのもとから出て来ると、彼らを迎えるために立っていたモーセとアロンに出会った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「出くわした」とも訳せる。この動詞は文脈によっては「立ち向かった」という敵対的な含みを持つこともあるが、ここではより広い意味の「出会った」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: 出会った
  rationale: פגעは「会う、出会う」を基本義とし、文脈によっては敵対的な遭遇も表し得る。次節の厳しい言葉から緊張はうかがえるが、この動詞自体に「詰め寄った」などの敵意を明示させず、広い意味を保った。
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: モーセとアロンに
  rationale: 目的語標識は日本語では独立して訳さず、「出会う」に自然な助詞「に」を用いた。固有名詞は現代日本語で定着した形とした。
- source_word: נִצָּבִים
  choice: 立っていた
  rationale: 分詞が表す継続的な状態を自然な日本語で示し、モーセとアロンが待ち受けていた場面を伝える。
- source_word: לִקְרָאתָם
  choice: 彼らを迎えるために
  rationale: לקראתは相手の方へ出て会うこと、または会うためにその場にいることを表す。「迎えるために」は、彼らを待って立っていたという位置と目的を自然に表し、敵対性を不必要に加えない。
- source_word: בְּצֵאתָם
  choice: 彼らが…出て来ると
  rationale: 前置詞בを伴う不定詞構文の時間的関係を、現代日本語の自然な接続で表した。
- source_word: מֵאֵת פַּרְעֹה
  choice: ファラオのもとから
  rationale: מֵאֵתが示す人物の居所・面前からの退出を明確にし、単なる所有や起点と誤解されにくい自然な表現とした。
theological_decisions: []
