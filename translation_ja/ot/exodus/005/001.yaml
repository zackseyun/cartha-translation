  to: その後、モーセとアロンはファラオのもとに行き、こう言った。「イスラエルの神、ヤハウェはこう言う。『わたしの民を行かせ、荒野でわたしのために祭りを行わせよ。』」
  rationale: 神名を固有名「ヤハウェ」として保ち、神の使者による宣言の定型句を自然な現代日本語に整えた。「行かせよ」により、民を解放して出発させる命令を明瞭にした。「祭りを行わせよ」は、荒野においてヤハウェのために祭りを挙行するという חגג の意味を保つ。
