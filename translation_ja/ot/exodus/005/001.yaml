base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: ja
  text: その後、モーセとアロンはファラオのもとに行き、こう言った。「イスラエルの神、ヤハウェはこう言う。『わたしの民を行かせ、荒野でわたしのために祭りを行わせよ。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: その後
  rationale: 物語の出来事が次の段階へ進むことを示す時間表現として、間隔を限定しすぎない自然な訳。
- source_word: בָּאוּ
  choice: ファラオのもとに行き
  rationale: 王の前に出るために赴いたという文脈上の意味を、現代日本語で自然に表した。単なる到着や建物への入場には限定しない。
- source_word: כֹּה אָמַר
  choice: こう言われる
  rationale: 権威ある使者の定型句としての調子を保ちつつ、現代日本語として自然な形にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語音写で示した。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: イスラエルの神
  rationale: 連語の関係を簡潔かつ明瞭に再現した。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: わたしの民を去らせ
  rationale: ファラオにイスラエルを解放して出発させるよう命じる使役的な意味を保った。
- source_word: וְיָחֹגּוּ לִי
  choice: わたしのために祭りを祝わせよ
  rationale: חגגが一般的な礼拝ではなく、祭りを執り行い祝うことを表す点を明示し、前の命令との目的関係も自然に示した。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: 砂漠に限定せず、人里離れた未開の地域を指す聖書的用法に合う。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を明記しているため、固有名として音写し、本文上の区別を保持した。
- issue: 祭りの行為の表現
  choice: 祭りを祝わせよ
  alternative: わたしを礼拝させよ
  rationale: 原語は広い意味の礼拝ではなく祭りの挙行を表すため、その具体性を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ファラオへの神の命令にふさわしい厳粛さを保った。「ファラオ」は称号として無冠詞的に扱い、「ヤハウェはこう言われる」で使者定型句の権威を表した。
