  text: וַ/יְצַ֥ו פַּרְעֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֶת הַ/נֹּגְשִׂ֣ים בָּ/עָ֔ם וְ/אֶת שֹׁטְרָ֖י/ו לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/006.yaml
  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: ja
  text: その日[a]、ファラオは、民に労役を課す監督たち[b]と民の役人たち[c]に命じて、こう言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その日のうちに」とも訳せる。この時間表現は、その命令が直ちに出されたことを示し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「民に対する取り立てる者たち」。ここでは、民に労役を課し、その遂行を取り立てる監督者を指す。
    reason: lexical_alternative
  - marker: c
    text: 「民の下役たち」「民の職員たち」とも訳せる。ここでは、労役制度のもとで民に関わる下位の担当者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じて言った
  rationale: צוהの権威ある命令を「命じる」で表し、後続のלֵאמֹרを自然な日本語の発話導入として結びつけた。
- source_word: בַּיּוֹם הַהוּא
  choice: その日
  rationale: ヘブライ語の時間表現を簡潔に直訳した。文脈上の即時性を強める「その日のうちに」も可能なので脚注に示した。
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: 民を使役する監督たち
  rationale: נגשׂはここで労働を厳しく取り立てる者を指す。「監督たち」だけでは労役との関係が弱いため、「民を使役する」を添えつつ、בָּעָםとの関係を自然な日本語で表した。
- source_word: שֹׁטְרָיו
  choice: 民の役人たち
  rationale: שׁטריםは労役制度における下位の行政担当者を指す広い語である。接尾辞の最も近い先行詞である「民」を受ける訳を本文に採ったが、ファラオに属する役人と読む余地も脚注に残した。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 次節の直接話法を導く定型表現。日本語では「言って」より「命じて言った」が明瞭で格調も保てる。
theological_decisions:
- issue: שֹׁטְרָיו の三人称男性単数接尾辞が誰を指すか
  choice: 「民」を受けて「民の役人たち」とした
  alternative: ファラオを受けて「ファラオの役人たち」とする
  rationale: 直前の単数集合名詞 הָעָם が文法上自然な先行詞であり、後続文脈でもイスラエル人の下役が想定される。ただし形態だけではファラオを指す可能性を完全には排除できないため、脚注で曖昧さを明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔かつ荘重な調子を保った。「労役監督」という専門的な複合語に固定せず、「民を使役する監督たち」として役割を普通の読者にも分かるようにした。
