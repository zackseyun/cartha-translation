- source_word: אַתֶּם
  choice: おまえたち自身で
  rationale: 独立人称代名詞による強調を保ち、わらの調達を彼ら自身に命じる語気を明確にした。
- source_word: לְכוּ קְחוּ
  choice: 行き、…取って来い
  rationale: 二つの複数命令を自然な日本語の連続動作として表した。קְחוּ は文脈上、わらを確保して持って来ることを指す。
- source_word: לָכֶם
  choice: 自身で
  rationale: 利益・関与を示す与格の力を、強調された主語と合わせて、自力で調達する意味として表した。
- source_word: תֶּבֶן
  choice: わら
  rationale: れんが作りの材料を指す文脈に最も適した現代日本語である。
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: 見つかる所から
  rationale: 入手先を限定しない原文の表現を簡潔に保った。
- source_word: כִּי
  choice: …のだから
  rationale: 基本的な理由・根拠を示す接続として訳しつつ、命令の厳しい条件を自然に結び付けた。
- source_word: אֵין נִגְרָע
  choice: 減らされない
  rationale: גרע の受動的意味と、削減が認められないという命令文脈を保持した。
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: おまえたちの仕事は何一つ
  rationale: עֲבֹדָה を過度に『割り当て量』へ限定せず、『何一つ』で דָּבָר を伴う全面否定を表した。
