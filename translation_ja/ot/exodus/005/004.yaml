base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: ja
  text: しかし、エジプトの王は彼らに言った。「モーセとアロン、なぜおまえたちは民を仕事から離れさせるのか。[a] 自分たちの苦役のもとへ行け。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜおまえたちは民の仕事を中断させるのか」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自分たちの重荷のもとへ行け」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、…言った
  rationale: 物語を進める接続形であるが、直前のモーセとアロンの要求に対する王の反発を自然な日本語で示すため、「しかし」とした。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: エジプトの王
  rationale: ヘブライ語の連語を明瞭で標準的な日本語にした。
- source_word: לָמָּה
  choice: なぜ
  rationale: 理由を問う直接疑問を簡潔に保った。
- source_word: תַּפְרִיעוּ
  choice: 離れさせる
  rationale: פרע のヒフィル形がここでは、民に仕事を中断・放棄させるという使役的意味を持つことを表す。
- source_word: הָעָם
  choice: 民
  rationale: 文脈上は労働者を指すが、原文のより広い呼称を保った。
- source_word: מִמַּעֲשָׂיו
  choice: 仕事から
  rationale: 単数の集合名詞「民」を受ける三人称単数接尾辞を、日本語では自然に「民を仕事から」と表現した。
- source_word: לְכוּ
  choice: 戻れ
  rationale: 直訳は「行け」だが、王がモーセとアロンに課された労役へ戻るよう命じる文脈を自然に示した。原語の命令の強さは保っている。
- source_word: לְסִבְלֹתֵיכֶם
  choice: 自分たちの苦役に
  rationale: סְבָלוֹת は荷や重荷、また過酷な労働義務を指す。ここでは文脈上の抑圧性を明確にする「苦役」を採用した。
