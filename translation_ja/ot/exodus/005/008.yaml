  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: ja
  text: 彼らが昨日も一昨日も作っていたれんがの割り当て量を、彼らに課せ[a]。少しも減らしてはならない。彼らは怠けている。だから、『行こう、私たちの神にいけにえをささげよう』と叫んでいるのだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「昨日と一昨日」。文脈によっては「以前と同じように」「従来どおり」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת הַלְּבֵנִים
  choice: れんがの割り当て量
  rationale: 労役の文脈で、作るよう定められたれんがの数量を指す。「割り当て量」は、後続の「減らす」とも自然につながる。
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: これまで……以前と同じように
  rationale: 字義的には「昨日、一昨日」だが、この対句は過去の慣行を指して「以前」「これまで」の意味でも用いられる。ここでは日本語として自然に、従来の生産量を維持せよという趣旨を表した。
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: 彼らに課せ
  rationale: 数量上の義務を労働者に負わせる行政的・強制的な命令を簡潔に表す。
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: 少しも減らしてはならない
  rationale: 割り当て量のどの部分も削減してはならないという全面的な禁止を明確にする。
- source_word: נִרְפִּים
  choice: 怠けている
  rationale: ファラオがイスラエル人を、仕事を十分にしていないと非難する語。「怠けている」は発言者の敵対的な評価を自然に示す。
- source_word: צֹעֲקִים
  choice: 叫んでいる
  rationale: 強い声で訴え求める継続的な行為を表す。
- source_word: נֵלְכָה נִזְבְּחָה
  choice: 行って……いけにえをささげさせてください
  rationale: 二つの一人称複数勧奨形を、ファラオ側が引用する民の要請として自然な日本語にした。
- source_word: לֵאלֹהֵינוּ
  choice: 私たちの神に
  rationale: いけにえをささげる相手を示す単純な前置詞句として訳した。
