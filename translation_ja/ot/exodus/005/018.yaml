  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: ja
  text: 今すぐ、行って働け。わらはおまえたちには与えられない。しかし、定められた数量[a]のれんがを納めよ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「れんがの割当量」とも訳せる。ヘブライ語の「トーケン」は、労働者に要求された、定められた量または計量された量を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: ファラオが結論として命令を突きつける転換と強調を、自然で力のある現代日本語で表した。
- source_word: לְכוּ
  choice: 行って
  rationale: הלךの命令形を簡潔に訳し、後続の命令「働け」へ自然につないだ。
- source_word: עִבְדוּ
  choice: 働け
  rationale: ここでは礼拝上の「仕える」ではなく、強制労働を続けるよう命じているため。
- source_word: וְתֶבֶן
  choice: わらは
  rationale: 接続詞の対照的な働きは、前後を別文にし、後続の「それでも」と組み合わせて文脈上明確にした。
- source_word: יִנָּתֵן לָכֶם
  choice: おまえたちに与えられない
  rationale: 否定を伴うנתןの受動形を、原文に近く明瞭に表した。ファラオの高圧的な発言に合わせて「おまえたち」とした。
- source_word: תֹכֶן
  choice: 定められた数量
  rationale: 労働者に要求された、計量・固定された量を指す。日本語では「定められた数量」が意味を明確に保つ。
- source_word: לְבֵנִים
  choice: れんがは
  rationale: תֹכֶןとの構成関係を、日本語では主題化した「れんがは」と数量表現によって自然に示した。
- source_word: תִּתֵּנוּ
  choice: 納めよ
  rationale: 字義は「与えよ」だが、文脈では要求された生産量を提出する意味なので、「納めよ」が義務と引き渡しの両方を簡潔に表す。
