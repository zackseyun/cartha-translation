source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: ja
  text: 彼らは二人に言った。「ヤハウェがあなたがたを見て、裁きを下されるように。あなたがたは、ファラオとその家臣たちの目に、私たちをひどく不快で忌まわしい者と思わせ[a]、彼らに私たちを殺すための剣を与えたのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたは、ファラオとその家臣たちの目に、私たちのにおいを悪臭にした」。つまり、私たちを不快で忌まわしい者と思わせた、という意味。
    reason: 原文の「におい／悪臭」という鮮明な比喩と、その慣用的な意味を示すため。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: 彼らは二人に言った
  rationale: 物語を進める動詞を簡潔な過去形で訳した。אֲלֵהֶם は文脈上モーセとアロンを指す複数代名詞なので、固有名を補わず「二人」とした。
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: ヤハウェがあなたがたを見て、裁きを下されるように
  rationale: 二つの未完了形の祈願・呪詛的な用法を「〜ように」で表した。「裁きを下す」は、神による判定を求める意味を自然な現代日本語で伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を音写した。
- source_word: אֲשֶׁר
  choice: 〜のだから
  rationale: 先行する裁きの願いの理由を示す因果関係として訳した。
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: 私たちが忌み嫌われるようにし
  rationale: 直訳は「私たちのにおいを悪臭にした」。日本語で意味の通る形にしつつ、他者から嫌悪される状態にしたという比喩の趣旨を保った。直訳的イメージは脚注に示した。
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: ファラオとその家臣たちから
  rationale: 直訳の「目に」を機械的に残さず、彼らの評価において嫌悪の対象となったという意味を自然な日本語で表した。עֲבָדָיו はこの場面の王に仕える者たちとして「家臣たち」とした。
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: 彼らの手に、私たちを殺すための剣を渡した
  rationale: 単数の「剣」を保ち、殺害の手段・機会を与えたという比喩を日本語でも明瞭に表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: ヘブライ語本文が固有の神名を用いているため、その区別を保つ音写を採用した。
- issue: וְיִשְׁפֹּט の裁きの対象
  choice: 裁きを下されるように
  alternative: あなたがたを裁かれるように
  rationale: 文脈上はモーセとアロンに不利な裁きを求める言葉だが、ヘブライ語ではこの動詞に目的語が明示されていないため、日本語でも対象を補いすぎず、発言の緊張を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「裁きを下されるように」で厳しい訴えの調子を保ち、悪臭の比喩は本文を不自然にせず脚注で提示した。
