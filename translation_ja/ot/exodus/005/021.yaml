revisions:
- from: 彼らは二人に言った。「ヤハウェがあなたがたを見て、裁きを下されるように。あなたがたは、ファラオとその家臣たちから私たちが忌み嫌われるようにし[a]、彼らの手に、私たちを殺すための剣を渡したのだから。」
  to: 彼らは二人に言った。「ヤハウェがあなたがたを見て、裁きを下されるように。あなたがたは、ファラオとその家臣たちの目に、私たちをひどく不快で忌まわしい者と思わせ[a]、彼らに私たちを殺すための剣を与えたのだから。」
  rationale: 本文の意味を変えずに、悪臭の比喩が指す社会的な嫌悪・忌避を本文でも明瞭にした。「二人」は原文の複数代名詞を不必要に固有名化せずに保つ。「彼ら」は直前のファラオと家臣たちを指し、剣を与える相手を明示するため「彼らに」とした。
