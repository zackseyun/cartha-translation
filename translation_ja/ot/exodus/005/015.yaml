id: EXO.5.15
reference: Exodus 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: ja
  text: そこで、イスラエル人[a]の監督たちはファラオのもとに行き、叫んで訴えた。「なぜ、あなたのしもべたち[b]にこのようなことをなさるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 「あなたの奴隷たち」とも訳せる。ここではファラオへの嘆願におけるへりくだった自称と理解して「しもべたち」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: そこで……行き
  rationale: 物語を進めるワウ継続法を「そこで」で示し、ファラオのもとへの移動を自然な日本語で「行き」とした。
- source_word: שֹׁטְרֵי
  choice: 監督たち
  rationale: エジプト側の権威の下で同胞の労働を管理していたイスラエル人の下級監督者を指す。「役人」より労働現場での役割が伝わり、「現場監督」ほど意味を限定しすぎない。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエル人
  rationale: 字義は「イスラエルの子ら」だが、ここでは民族集団を表すため、明瞭で現代的な「イスラエル人」とし、字義的表現は脚注に残した。
- source_word: וַיִּצְעֲקוּ
  choice: 叫んで訴えた
  rationale: 単なる発言や正式な陳情ではなく、切迫した叫びと訴えを表す動詞の力を保持した。
- source_word: אֶל־פַּרְעֹה
  choice: ファラオのもとに
  rationale: 方向を表す前置詞を、謁見して訴える場面に自然な日本語で表現した。
- source_word: לֵאמֹר
  choice: （直接話法への移行として表現）
  rationale: ヘブライ語の定型的な発話導入句は、日本語では引用符によって十分明確になるため、冗長な「言って」を置かなかった。
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: なぜ……このようなことをなさるのですか
  rationale: כֹהの「このように」という意味を保ちつつ、目的語を補う日本語として自然に整えた。敬語はファラオへの嘆願という発話状況を反映する。
- source_word: לַעֲבָדֶיךָ
  choice: あなたのしもべたち
  rationale: עבדには「奴隷」と「しもべ」の両義がある。ここではファラオに対する自己卑下を伴う嘆願の呼称として「しもべ」を本文に採り、社会的身分を強調する訳は脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、ファラオへの切迫した訴えと宮廷的な敬意がともに伝わるようにした。「しもべ」はやや改まった語だが、この発話の社会的・礼儀的な距離を保つために適切である。
