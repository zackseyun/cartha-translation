  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: ja
  text: そして、労働監督官たちは彼らをせき立てて言った。「わらがあった時と同じように、毎日定められた仕事量[a]を果たせ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「一日の事をその日に」。日ごとに課された仕事の割当て、または必要量を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: 労働を取り立てる者たち
  rationale: 強制労働の現場で、労働や割当量を厳しく取り立てる役人を指す。一般的な「監督」よりも נגשׂ の強圧的な含みを明確に伝える。
- source_word: אָצִים
  choice: せき立てて
  rationale: 分詞が示す継続的かつ強制的な催促を、自然な現代日本語で表す。
- source_word: כַּלּוּ
  choice: 仕上げよ
  rationale: 割り当てられた作業を完了するよう命じる、直接的な命令を表す。
- source_word: מַעֲשֵׂיכֶם
  choice: 仕事
  rationale: 文脈上はれんが作りの労働を指すが、ヘブライ語の広さを保って「仕事」とした。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: その日の分の仕事はその日のうちに
  rationale: 字義的には「一日の事をその日に」。ここでは日ごとに課された作業量を意味するため、数量を過度に明示せず、慣用句の意味を自然に伝える。
- source_word: כַּאֲשֶׁר בִּהְיוֹת הַתֶּבֶן
  choice: わらがあった時と同じように
  rationale: 以前わらが用意されていた状況との比較を簡潔に表す。「支給された」は文脈上含意されるが、本文では明示しない。
