lexical_decisions:
- source_word: לֹא תֹאסִפוּן
  choice: 今後……与えてはならない
  rationale: 否定を伴うיסףのヒフィル形は、これまで続けていた行為を以後やめることを表す。「今後……してはならない」で、その停止命令を自然な日本語にした。
- source_word: תֶּבֶן
  choice: わら
  rationale: れんが作りで粘土に混ぜる材料を指す標準的な訳語であり、節内の二箇所を同じ語で訳した。
- source_word: לָעָם
  choice: 民に
  rationale: עםの通常の意味を保った。文脈上はイスラエル人の労働者たちを指すが、本文以上に限定しない。
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: れんがを作るための
  rationale: 不定詞と目的語が示す目的を、明瞭で自然な日本語で表した。
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: 以前のように
  rationale: 字義的には「昨日、一昨日のように」に当たる慣用句で、従来・以前を意味するため、本文では自然な意味を示した。
- source_word: הֵם יֵלְכוּ וְקֹשְׁשׁוּ
  choice: 彼ら自身に行かせ、自分たちで……集めさせよ
  rationale: 独立代名詞による対照的な強調と、文脈上の命令的な未完了形を反映した。「自身」「自分たちで」により、支給せず彼らにさせる対比を明確にした。
- source_word: לָהֶם
  choice: 自分たちで
  rationale: 彼らが自分たちのために、自力でわらを確保するという与格の含意を、文脈に即して簡潔に表した。
