translation:
  language: ja
  text: あなたがたは今後、以前のように[a]、れんがを作るためのわらを民に与えてはならない。彼らを行かせ、自分たちでわらを集めさせよ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
