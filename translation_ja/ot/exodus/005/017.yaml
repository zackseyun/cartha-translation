source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: ja
  text: しかしファラオは言った。「おまえたちは怠けている。怠けているのだ！ だから、『行って、ヤハウェにいけにえをささげよう』と言っているのだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかしファラオは言った
  rationale: 動詞自体は「彼は言った」だが、直前の訴えに対する反論なので、וַの文脈上の対立を「しかし」で示した。日本語では指示対象を明確にするため、文脈上の話者「ファラオ」を補った。
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: おまえたちは怠けている。怠けているのだ！
  rationale: נרפיםはここではファラオによる「怠惰だ」との非難。原文の反復を残しつつ、現代日本語で強い断定として自然に響く形にした。
- source_word: עַל כֵּן
  choice: だから
  rationale: ファラオが彼らの要求を怠惰の結果だと決めつける因果関係を、簡潔で自然な日本語で表した。
- source_word: אֹמְרִים
  choice: と言っているのだ
  rationale: 分詞の継続的・現在的な発言を表し、非難の調子に合う日本語の説明的断定を用いた。
- source_word: נֵלְכָה נִזְבְּחָה
  choice: 行って、…いけにえをささげよう
  rationale: 二つの一人称複数コホータティブの勧誘・決意の力を「～よう」でまとめ、連続する行為として自然に訳した。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 前置詞לは犠牲の受け手を示す。神名יהוהは称号に置き換えず、本文の固有名として音写した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が四文字神名を明記しているため、固有名として「ヤハウェ」とした。母音の歴史的再建には一定の不確実性があるが、現代の学術的慣用に沿う表記であり、称号「主」への置換は避けた。
- issue: ファラオの発言の評価
  choice: 彼の非難を発言としてそのまま提示する
  alternative: 語り手による事実認定として表現する
  rationale: 「怠けている」はファラオの आरोप आरोप accusationであり、本文はその真偽をここで承認していない。引用内に保ち、訳文で正当化しない。
translation_notes:
  register: 明瞭で現代的かつ威厳のある叙述。ファラオの侮蔑的で強圧的な口調を示すため二人称は「おまえたち」とし、原文の反復を保持した。「いけにえをささげる」は一般読者にも分かりやすい祭儀表現とした。
