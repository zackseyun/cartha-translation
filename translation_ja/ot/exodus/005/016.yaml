  text: תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְבֵנִ֛ים אֹמְרִ֥ים לָ֖/נוּ עֲשׂ֑וּ וְ/הִנֵּ֧ה עֲבָדֶ֛י/ךָ מֻכִּ֖ים וְ/חָטָ֥את עַמֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: ja
  text: わらは、あなたのしもべである私たちに与えられないのに、私たちには『れんがを作れ』と言うのです。しかし、ご覧ください、あなたのしもべたちは打たれています。責任はあなたの民にあります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の末尾は圧縮された表現で、より字義的には「あなたの民の罪」または「あなたの民の過ち」とも訳せる。文脈では、責任がファラオ側の者たちにあるという意味だと考えられる。
    reason: 原文にない指示語や述語を補わず、圧縮された構文と文脈に基づく本文訳との違いを示すため。
lexical_decisions:
- source_word: תֶּבֶן
  choice: わら
  rationale: 粘土に混ぜてれんがを作る材料を指す、この文脈での標準的で分かりやすい訳語。
- source_word: אֵין נִתָּן לַעֲבָדֶיךָ
  choice: あなたのしもべである私たちに与えられない
  rationale: 否定存在表現と受動分詞が、わらが供給されていない状況を表す。עבדはここではファラオへの恭しい自己呼称なので、「奴隷」ではなく「しもべ」とした。また日本語では話者自身を指すことが明確になるよう「である私たち」を補った。
- source_word: וּלְבֵנִים אֹמְרִים לָנוּ עֲשׂוּ
  choice: 私たちには『れんがを作れ』と言うのです
  rationale: 直前の「れんが」を命令の目的語として自然に示し、直接話法と命令の強さを保った。主語は原文同様に特定しない。
- source_word: וְהִנֵּה
  choice: しかも、ご覧ください
  rationale: 目の前の不正な事態へ注意を促す強調を、現代日本語の丁重な訴えとして表した。
- source_word: עֲבָדֶיךָ מֻכִּים
  choice: あなたのしもべたちは打たれています
  rationale: 受動分詞が示す継続中の虐待を「打たれています」で表し、原文の敬語的自己呼称を保持した。
- source_word: וְחָטָאת עַמֶּךָ
  choice: 責任はあなたの民にあります
  rationale: マソラ本文の末尾は圧縮された名詞句で、字義的には「あなたの民の罪」と読める。文脈上は、れんがを作れない責任がイスラエル人ではなくファラオ側の者たちにある、という訴えとして自然に訳した。曖昧さは脚注に残した。
theological_decisions:
- issue: וְחָטָאת עַמֶּךָ の圧縮された構文と責任の所在
  choice: 本文では「責任はあなたの民にあります」とした。
  alternative: 「そして、これはあなたの民の罪です」または「あなたの民が罪を犯したのです」
  rationale: 直前までの訴えの論理では、材料を与えず労働者を打つファラオ側の者たちに非がある。しかしヘブライ語は簡潔で解釈上の幅があるため、本文で文脈的意味を示しつつ脚注でより字義的な理解を明記した。
translation_notes:
  register: ファラオへの訴えにふさわしい丁重さを保ちながら、一般の読者に明瞭な現代標準日本語とした。「しもべ」は宮廷的な自己卑下を表し、「しかも、ご覧ください」で הִנֵּה の切迫した注意喚起を自然に表現した。
