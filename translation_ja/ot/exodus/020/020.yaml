reference: Exodus 20:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: ja
  text: モーセは民に言った。「恐れてはならない[a]。神が来られたのは、あなたがたを試すため、また、あなたがたが罪を犯さないよう、神への恐れ[b]がいつもあなたがたの前にある[c]ためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「おびえてはならない」とも訳せる。ヘブライ語では、後半の「恐れ」と同じ語根が用いられ、目の前の出来事への恐慌と、神に対して持つべき恐れとが対照されている。
    reason: lexical_alternative
  - marker: b
    text: 「神への畏敬」とも訳せる。ヘブライ語の名詞は、恐怖だけでなく、畏れ敬う思いを表すこともある。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「あなたがたの顔の上にある」。いつも目の前に置かれ、意識されていることを表す言い回し。
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: 恐れてはならない
  rationale: 動詞 ירא の「恐れる」という意味を率直に表し、後半の יִרְאָתוֹ（神への「恐れ」）との意図的な語の響きと緊張関係を保った。文脈上は目の前の顕現に対するおびえを禁じている。
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: あなたがたを試すため
  rationale: לְבַעֲבוּר の目的を明示し、נסה は善悪への誘惑という含みを加えず、吟味することを表す自然な現代語「試す」とした。
- source_word: בָּא הָאֱלֹהִים
  choice: 神が来られた
  rationale: この場面に現在も関わる神の到来を表す。הָאֱלֹהִים はイスラエルの神を指すため「神」とし、日本語として敬意を示す自然な形にした。
- source_word: וּבַעֲבוּר
  choice: また、…ため
  rationale: 二度目の לְבַעֲבוּר も目的を示す。日本語で重くなりすぎないよう、並列する目的節として表した。
- source_word: יִרְאָתוֹ
  choice: 神への恐れ
  rationale: 代名詞の指示対象を日本語で明確にしつつ、前半の「恐れて」と同じ語を用いて、恐慌と神に対する正しい恐れとの対照を解釈で消さないようにした。
- source_word: עַל־פְּנֵיכֶם
  choice: いつもあなたがたの前にある
  rationale: 字義は「あなたがたの顔の上に」。継続して目の前に置かれ、意識されるという慣用的な意味を読み取れる日本語にした一方、「前にある」という原文の像も残した。
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: あなたがたが罪を犯さないよう
  rationale: 否定を伴う目的を、明快で自然な現代日本語で表した。
theological_decisions:
- issue: 「恐れてはならない」と「神への恐れ」の見かけ上の緊張
  choice: 本文の両方で「恐れ」を用いる
  alternative: 前半を「おびえてはならない」、後半を「神への畏敬」とする
  rationale: ヘブライ語は同じ語根を用いながら、禁じられる恐慌と保つべき神への恐れを対照させている。その神学的緊張を訳文で先回りして解消しないため、同じ日本語の語を保った。
- issue: 神による「試し」の性質
  choice: 「試す」と訳し、道徳的誘惑の意味を加えない
  alternative: 「吟味する」「証明する」
  rationale: נסה はここで民を試し、そのあり方を明らかにすることを示す。本文自体が述べない、悪へ誘うという意味や特定の教理的説明は加えなかった。
translation_notes:
  register: 明快な現代標準日本語を用い、神の顕現にふさわしい品位を保った。「恐れ」の反復はやや強く響くが、原文の意図的な語根の反復と神学的緊張を伝えるために保持した。目的を示す二つの לְבַעֲבוּר は「…ため、また…ため」と対応させ、文の論理構造を見失わない形にした。
