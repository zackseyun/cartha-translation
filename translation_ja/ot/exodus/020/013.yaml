lexical_decisions:
- source_word: לֹא
  choice: 〜してはならない
  rationale: 否定辞לֹאは、未完了形とともに十戒の明確な禁止を表す。現代日本語では「〜してはならない」が簡潔で厳粛な命令として自然である。
- source_word: תִּרְצָח
  choice: 殺す
  rationale: רצחは多くの場合、不法な殺害や殺人を指す。ただし日本語の「殺人を犯してはならない」は法的分類を前面に出しすぎるため、本文では直接的な「殺してはならない」とし、語の範囲を脚注で明示する。
theological_decisions:
- issue: 十戒における禁止の範囲
  choice: 本文を「殺してはならない」とし、不法な殺害・殺人が中心的意味であることを脚注で示す
  alternative: 「殺人を犯してはならない」
  rationale: ヘブライ語רצחは、あらゆる生命剝奪を無差別に表す一般動詞ではなく、通常は不法な殺害を指す。一方、本文を「殺人」とだけ訳すと、近代法上の狭い犯罪類型に限定して読まれるおそれがあるため、原文の簡潔さと意味上の緊張を本文と脚注の組み合わせで保つ。
translation_notes:
  register: 簡潔で厳粛な十戒の文体を保ちつつ、普通の現代日本語として明瞭な表現とした。脚注記号[a]を本文に付した。
