base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: ja
  text: あなたは、自分のために、彫って作った像[a]も、上の天にあるもの、下の地にあるもの、地の下の水の中にあるものの、どのような形[b]も作ってはならない。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「刻んだ像」とも訳せる。ヘブライ語は彫って作られた像を指す。「偶像」と訳すと、礼拝対象であるという解釈が加わる。
    reason: lexical_alternative
  - marker: b
    text: 「似姿」または「表象」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: この節は、上の天、下の地、地の下の水という、古代の宇宙観に見られる領域表現を用いている。
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: 作ってはならない
  rationale: לֹאを伴う未完了形による直接的な禁止を、現代日本語で明確かつ荘重な禁止表現として示した。
- source_word: לְךָ
  choice: 自分のために
  rationale: 当人のため、または当人に関わるものとして作るという与格の含みを自然な日本語で表した。
- source_word: פֶסֶל
  choice: 彫った像
  rationale: 語が基本的に彫って作られた像を指すことを保ち、「偶像」として礼拝目的を訳文に先取りして限定することを避けた。
- source_word: וְכָל תְּמוּנָה
  choice: また、いかなる形も
  rationale: תְּמוּנָהの「形・似姿・表象」という意味幅を保つため「形」とした。וְは列挙を自然につなぐ「また」と訳した。
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: 上の天にあるもの
  rationale: מִמַּעַלとの上下対照を保持しつつ、שָׁמַיִםを日本語の聖書的・宇宙論的表現である「天」とした。
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: 下の地にあるもの
  rationale: 上の天との垂直的な対照を簡潔に保った。בְּはここでは存在領域を表す「に」とした。
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: 地の下の水の中にあるもの
  rationale: 三層的な空間描写を説明で置き換えず、原文の位置関係をそのまま伝えた。
theological_decisions:
- issue: 第二の戒めにおける禁止の範囲
  choice: 彫った像と、被造世界にあるもののいかなる形をも作ることへの禁止として訳し、礼拝目的などの限定を本文に補わない。
  alternative: 「偶像」または「礼拝するための像」と訳して、禁止を宗教的用途に明示的に限定する。
  rationale: この節自体は像と形を作ることを禁じ、拝むことや仕えることは次節で述べる。したがって「偶像」や「礼拝するため」を補わず、同時にあらゆる美術を禁じるとの解釈も訳文へ加えないことで、本文と文脈の緊張を保持した。
translation_notes:
  register: 十戒の法的な重みを保つため「作ってはならない」を用いた。語彙は現代の一般読者に分かりやすくしつつ、「上の天」「下の地」という原文の荘重な上下対照と古代的な空間像を保持した。
