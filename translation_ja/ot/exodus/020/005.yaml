  to: それらにひれ伏してはならない。また、それらに仕えてはならない[a]。あなたの神、ヤハウェであるわたしは、ねたむ神だからである。わたしを憎む者については、父たちの咎を子どもたちに問う。それは三代、四代にまで及ぶ[b][c]。
