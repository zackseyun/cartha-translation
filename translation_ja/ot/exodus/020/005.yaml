id: EXO.20.5
reference: Exodus 20:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: ja
  text: それらにひれ伏してはならない。また、それらに仕えてはならない[a]。あなたの神、ヤハウェであるわたしは、ねたむ神だからである。わたしを憎む者については、父たちの咎を子どもたちに問う。それは三代、四代にまで及ぶ[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕える」は、ここでは偶像にささげる祭儀的な奉仕、すなわち礼拝を指しうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「父たちの咎を子どもたちの上に訪れる」。「問う」は、神が咎を顧みて責任を追及することを表す。申命記24:16、エゼキエル書18章も参照。
    reason: cross_reference
  - marker: c
    text: 別訳「わたしを憎む者たちの三代、四代に至るまで」。
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: ひれ伏す
  rationale: 敬意や崇拝を示して身を低くする具体的動作を表し、後続の「仕える」との語義上の区別も保つ。
- source_word: תָעָבְדֵם
  choice: それらに仕える
  rationale: 基本義「仕える」を保ちつつ、偶像への祭儀的奉仕を文脈から伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で示す。
- source_word: אֵל קַנָּא
  choice: ねたむ神
  rationale: 契約関係において他の神々への崇拝を許さない、正当で排他的な要求を表す。
- source_word: פֹּקֵד
  choice: 問う
  rationale: 顧みて責任を追及する司法的含意を自然な日本語で表しつつ、単純に「罰する」と限定しすぎない。
- source_word: עֲוֺן
  choice: 咎
  rationale: 罪そのもの、罪責、その帰結を含みうる語の幅と重みを比較的よく保つ。
- source_word: אָבֹת
  choice: 父たち
  rationale: 原文の男性複数形を保持し、定型的な世代間の警告を不必要に中性化しない。
- source_word: בָּנִים
  choice: 子どもたち
  rationale: この世代継承の文脈では、男性だけに限定せず子孫を指しうる語として自然である。
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: 三代、四代にまで及ぼす
  rationale: 原文で省略されている「代」を補い、日本語として明瞭にしながら段階的な範囲を示す。
- source_word: לְשֹׂנְאָי
  choice: わたしを憎む者については
  rationale: 世代間の警告を神に敵対する者たちに関係づける限定を明示し、原文の統語的な曖昧さは脚注で補う。
theological_decisions:
- issue: 神のねたみの表現
  choice: ねたむ神
  alternative: 熱情の神
  rationale: 偶像礼拝禁止の文脈にある契約上の排他的要求を保ち、「熱心さ」だけに弱めない。
- issue: 世代を超える裁きの表現
  choice: 父たちの咎を子どもたちに問い、三代、四代にまで及ぼす
  alternative: 父たちの罪のために子どもたちを三代、四代まで罰する
  rationale: 原文の「顧みる／責任を問う」という表現と神学的緊張を保ち、子どもが父の罪だけで機械的に処罰されるという解釈に狭めない。
- issue: 「わたしを憎む者」の係り方
  choice: わたしを憎む者については
  alternative: わたしを憎む者の三代、四代に至るまで
  rationale: この句が警告全体を限定する読みを本文に採る一方、第三代・第四代との結びつきも可能なため脚注に示す。
translation_notes:
  register: 現代標準日本語の簡潔で荘重な命令文とした。「ひれ伏す」「仕える」で二つの動詞を区別し、「ねたむ神」「咎を問う」によって原文の契約的・司法的緊張を保った。
