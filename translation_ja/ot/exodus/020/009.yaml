  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: ja
  text: 六日間働き、あなたのすべての仕事をしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「六日の間、あなたは働き、あなたのすべての仕事をしなさい。」
    reason: שֵׁשֶׁת יָמִים の期間表現には、日本語で「六日間」と「六日の間」の両方が可能なため。
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日間
  rationale: 前置詞のない数詞＋名詞の時間表現を、現代日本語で自然な期間表現として訳した。「六日の間」も可能だが、「六日間」が明瞭で簡潔。
- source_word: תַּעֲבֹד
  choice: あなたは働き
  rationale: עבד の基本義「働く、仕える」のうち、安息日の戒めという文脈では「働く」が自然。未完了形の指示的な力は、後続する「しなさい」によって節全体に表した。
- source_word: וְעָשִׂיתָ
  choice: しなさい
  rationale: עשה は広く「する、作る」を意味するが、מְלָאכָה を目的語とするここでは「仕事をする」が日本語として自然。接続詞 וְ は「働き、」で表した。
- source_word: כָּל
  choice: すべての
  rationale: 包括性をそのまま明示する標準的な対応語。
- source_word: מְלַאכְתֶּךָ
  choice: あなたの仕事
  rationale: מְלָאכָה は仕事、作業、職務を表す。安息日規定の文脈で広い意味を保つ「仕事」を採用し、二人称単数の接尾辞を「あなたの」と明示した。
theological_decisions:
- issue: 安息日法における未完了形の指示的効力
  choice: 節全体を「働き、すべての仕事をしなさい」と命令的に訳す
  alternative: 「働いてよい」「働くことになる」
  rationale: 十戒の契約的命令という文脈では、単なる予測や許可ではなく指示を表す。ただし、日本語で二つの動詞をともに命令形にすると不自然に重くなるため、連用形と「しなさい」で一つの指示として表現した。
translation_notes:
  register: 現代標準日本語の明瞭で品位ある命令文。「せよ」より一般読者に自然な「しなさい」を採用し、原文の単数二人称を「あなた」で保持した。
