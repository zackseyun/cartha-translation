language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: ja
  text: なぜなら、ヤハウェは六日の間に天と地と海、そしてその中にあるすべてのものを造り、七日目に休まれた[a]からである。それゆえ、ヤハウェは安息の日を祝福し、それを聖別された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「やめられた」。ヘブライ語の動詞は、休息することにも、活動をやめることにも重点を置きうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: それは〜からである
  rationale: 直前の安息日の命令に対する根拠を示す接続表現として、説明的な関係を明確にする。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日のうちに
  rationale: 創造の業が行われた時間的範囲を表す。日本語として自然でありつつ、六日間という枠を保持する。
- source_word: עָשָׂה
  choice: 造り
  rationale: 広義には「する、作る」だが、天地創造の文脈では「造る」が自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天と地
  rationale: 創造世界全体を示す定型的な対句として、明瞭で格調ある日本語にした。
- source_word: הַיָּם
  choice: 海
  rationale: ヘブライ語の単数形をそのまま自然な日本語で表す。
- source_word: כָּל אֲשֶׁר בָּם
  choice: その中にあるすべてのもの
  rationale: 天、地、海に含まれるものを包括する関係節を明確に再現する。
- source_word: וַיָּנַח
  choice: 休まれた
  rationale: 安息日の根拠を述べる文脈で自然な訳。「やめた、休止した」という含意も脚注で保持する。
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 創造と第七日の休みから、安息日の祝福と聖別へ至る論理的帰結を示す。
- source_word: בֵּרַךְ
  choice: 祝福し
  rationale: 神がその日に祝福を与えたことを簡潔に表す。
- source_word: וַיְקַדְּשֵׁהוּ
  choice: これを聖なるものとされた
  rationale: 使役的な意味を明確にし、安息日が神によって聖別されたことを表す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号で代替せず、一般的な学術的音写で示す。
- issue: 第七日における神の וַיָּנַח
  choice: 休まれた
  alternative: 仕事をやめられた／休止された
  rationale: 安息日の文脈に最も自然な「休む」を本文に採用しつつ、疲労を必然的に意味しない原語の「活動をやめる」可能性を脚注で残す。
translation_notes:
  register: 現代の一般読者に明瞭で、十戒の文脈にふさわしい簡潔で格調ある文体とした。神への敬意を日本語の尊敬表現で示し、原文の因果関係と並列構造を保った。
