  naturalness: 敬意を保つ文体は十戒の文脈に適しています。「なぜなら」で前節への根拠づけを自然に示し、列挙は「天と地と海」と接続することで読みやすくします。
  terminology: 神名「ヤハウェ」は原文の固有名を保持しています。「安息の日」「聖別する」はこの文脈で明瞭かつ定着した表現です。脚注は וַיָּנַח の「休む／活動をやめる」という語義の幅を、本文の意味を不必要に限定せずに示します。
