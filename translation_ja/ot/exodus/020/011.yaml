revisions:
- from: それは、六日のうちにヤハウェが天と地、海、そしてその中にあるすべてのものを造り、七日目に休まれた[a]からである。それゆえ、ヤハウェは安息日を祝福し、これを聖なるものとされた。
  to: なぜなら、ヤハウェは六日の間に天と地と海、そしてその中にあるすべてのものを造り、七日目に休まれた[a]からである。それゆえ、ヤハウェは安息の日を祝福し、それを聖別された。
  rationale: 安全で小規模な文体・語彙上の修正です。「六日の間に」により時間表現を自然にし、「聖別された」により原文の קדש を直接反映しました。脚注の代替訳は本文の「休まれた」に対応する位置に置き、原文に明示されない「仕事」を補わない表現へ改めました。
