  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: ja
  text: あなたの神、ヤハウェの名を、むなしいことのために担ってはならない[a]。ヤハウェは、ご自分の名をむなしいことのために担う者を、罰せずにはおかれないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「あなたの神、主の名をみだりに唱えてはならない」と訳される。ヘブライ語は直訳すると「名をむなしいこと／偽りのために担う」であり、偽りの誓い、空疎な呼び求め、神の名を掲げて不当に振る舞うことなどを含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: 担う／担う
  rationale: 基本義である「持ち上げる、運ぶ、担う」を保ち、禁止とその理由の節で同じ動詞を反復する。「みだりに唱える」や「悪用する」よりも意味の幅が広く、神の名による偽りの誓い、空疎な呼び求め、神を不当に代表することなどを含み得る。
- source_word: שֵׁם / שְׁמוֹ
  choice: 名／ご自分の名
  rationale: 単なる発音だけでなく、ヤハウェの啓示された人格、名誉、契約上の権威を指し得る。「ご自分の」は指示対象を明確にし、現代日本語として自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号「主」で置き換えず、ヘブライ語の四文字神名を音写する。
- source_word: אֱלֹהֶיךָ
  choice: あなたの神
  rationale: 二人称単数への直接的で契約的な呼びかけを保持する。
- source_word: לַשָּׁוְא
  choice: 偽りのために
  rationale: שָׁוְא は空虚、虚偽、無価値を含む。本節では法的・宗教的な誤用を自然な日本語で示しつつ、単なる不用意な発言だけに限定しない。「ために」を残すことで目的・帰着を表す לְ の構造もある程度保持する。意味の広がりは脚注で補う。
- source_word: כִּי
  choice: からである
  rationale: 禁止の根拠を導く因果関係を明確に示す。
- source_word: יְנַקֶּה (נקה)
  choice: 罰せずにはおかれない
  rationale: ここでのピエル形が表す、罪責や処罰を免れさせないという司法的な意味を、明瞭で格調ある現代日本語にする。「無罪とはしない」より、警告としての処罰の含意が伝わりやすい。
- source_word: אֲשֶׁר
  choice: …者
  rationale: 該当する者一般を指す関係節を簡潔な日本語で表す。
theological_decisions:
- issue: 神の名に関する禁止の範囲
  choice: ヤハウェの名を偽り、空虚、または不当な目的のために担うことへの広い禁止
  alternative: 偽誓だけへの限定、または冒瀆的・軽率な発言だけへの限定
  rationale: נשא「担う」と שם「名」と שוא「空虚・偽り」の組み合わせは、発音上の不敬だけでなく、偽誓、空疎な祈願、神の権威をかたる不当な代表行為などを含み得る。本文は「担う」を用いてこの広さを保持し、脚注で伝統的訳と含意を説明する。
- issue: 神名 YHWH の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有名としての性格を保ち、称号への置換を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、十戒にふさわしい簡潔で厳粛な調子と、原文における「担う」の反復を保持した。「偽りのために」はやや異化的だが、伝統的な「みだりに唱える」より原文の広い射程を保つ。
