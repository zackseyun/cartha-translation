source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: ja
  text: また、わたしのために石の祭壇を造るなら、切り石[a]を用いてそれを築いてはならない。あなたの剣をそれに振るえば[b]、それを冒瀆することになるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「切り石」は、「切り出した石」「加工した石」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「剣」は、文脈上、石を加工するために用いる金属製の刃物・道具を指す可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: また、…なら
  rationale: 直前の指示とのつながりを「また」で保ち、条件を自然な現代日本語の「なら」で表した。
- source_word: מִזְבַּח אֲבָנִים
  choice: 石の祭壇
  rationale: 「石でできた祭壇」を簡潔かつ自然に表し、素材としての石を明確にした。
- source_word: תַּעֲשֶׂה לִּי
  choice: わたしのために…造る
  rationale: לִּי の与格的関係を過度に解釈せず、そのまま「わたしのために」とした。
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: それを切り石で築いてはならない
  rationale: 法的命令を「してはならない」で表し、גָּזִית は加工された石を指すため、明瞭な「切り石」とした。接尾辞は石々を受ける複数形だが、日本語では祭壇全体を受ける「それ」が自然である。
- source_word: חַרְבְּךָ
  choice: あなたの剣
  rationale: 語の通常の意味である「剣」を本文に保持した。文脈上は石を加工する金属製の刃物・道具を指し得ることを脚注で示した。
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: その上に振るえば
  rationale: 「持ち上げる／振るう」という動作を保ちつつ、道具を石に用いる文脈にも通じる表現とした。
- source_word: וַתְּחַלְלֶהָ
  choice: それを汚すことになる
  rationale: 聖なるものを俗なるものにして損なうという祭儀的意味を、一般読者に分かりやすい「汚す」で表した。単なる物理的な汚れではないことは文脈で示される。
theological_decisions:
- issue: 祭壇が汚されることの性質
  choice: 石に剣を用いる行為が祭壇を祭儀的に汚す、と訳す。
  alternative: 武器や暴力との連想を避けること、または装飾や人為的加工を避けることが主眼だと明示する。
  rationale: חלל は聖性を損ない、俗にする意味を持つが、節そのものは禁令の背後にある象徴的理由を詳述していない。そのため、祭儀的な「汚す」を保ちながら、それ以上の神学的説明は本文に加えない。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。神の一人称は「わたし」、命令は「してはならない」とし、聖書本文にふさわしい格調を保った。
