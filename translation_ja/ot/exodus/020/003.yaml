lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: あなたには……あってはならない
  rationale: 直訳的な存在・関係表現「あなたにとってあってはならない」を、単数の聞き手への禁止として自然な現代日本語にした。「持ってはならない」よりも、ヘブライ語の存在動詞を保つ。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ほかの神々
  rationale: 複数形と「ほかの」という限定をそのまま反映し、本文にない「異国の」などの意味を加えない。
- source_word: עַל פָּנָי
  choice: わたしの前に
  rationale: 字義的な「わたしの顔の前に」に近く、神の臨在と排他性の双方を含み得る表現として曖昧さを保つ。
theological_decisions:
- issue: עַל פָּנָי の意味
  choice: わたしの前に
  alternative: わたしのほかに／わたしのいるところで
  rationale: この句は空間的・臨在的な意味と、契約上の排他性を示す意味の双方を帯び得る。本文では一方に限定せず、代案を注に示す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「あってはならない」により戒めの禁止の力を示しつつ、原文の存在構文を保った。
