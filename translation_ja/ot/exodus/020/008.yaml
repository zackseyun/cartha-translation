  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: ja
  text: 安息日を覚えて、これを聖なる日とせよ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これを聖別せよ」または「これを聖なるものとして取り分けよ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: 覚えて
  rationale: זכרのカル命令形・男性単数。単に思い出すだけでなく、契約上の命令として心に留め、それに即して行動する含みを保つ。
- source_word: יוֹם הַשַּׁבָּת
  choice: 安息日
  rationale: 特定の、契約において定められた安息の日を指す。日本語聖書で定着し、一般にも理解可能な「安息日」とした。定冠詞の限定性は語としての「安息日」によって自然に表される。
- source_word: לְקַדְּשׁוֹ
  choice: これを聖なる日とせよ
  rationale: קדשׁのピエル不定詞連語形に三人称男性単数接尾辞が付き、安息日を聖別する目的を示す。「聖なる日とする」は、単なる遵守に狭めず、聖なるものとして取り分け、扱う意味を明瞭に伝える。文脈に合わせ、目的を表すヘブライ語不定詞を日本語の並列的命令として自然に表した。
theological_decisions:
- issue: 安息日に関するקדשׁの表現
  choice: これを聖なる日とせよ
  alternative: これを聖別せよ／これを聖なるものとして取り分けよ
  rationale: 原文は、その日を聖なるものとし、聖なるものとして扱うことを命じる。「聖なる日とせよ」は神学的な「聖」の概念を保ちながら、現代日本語として理解しやすい。具体的な遵守方法までは本文に付加しない。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。命令の力を保つため「覚えて」「せよ」を用いた。「これ」は直前の安息日を明確に受ける。
