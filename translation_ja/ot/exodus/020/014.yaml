lexical_decisions:
- source_word: לֹא
  choice: ～してはならない
  rationale: 否定辞לֹאと未完了形の組み合わせが表す、十戒における明確で継続的な禁止を、現代日本語の簡潔で厳粛な禁止表現で示す。
- source_word: תִּנְאָף
  choice: 姦淫する
  rationale: 動詞נאףのカル形は姦淫を行うことを意味する。「姦淫する」は法的・倫理的文脈で意味が明確であり、十戒の簡潔さも保つ。
theological_decisions:
- issue: 十戒の禁止命令の文体
  choice: 姦淫してはならない。
  alternative: 姦淫するな。
  rationale: 「～してはならない」は、לֹא＋未完了形による契約法上の恒久的な禁止の重みを保ちつつ、現代標準日本語として自然である。
- issue: 男性単数形の適用範囲
  choice: 主語を明示しない一般的な禁止表現
  alternative: 男性を明示して「あなたは姦淫してはならない」とする
  rationale: 原文の動詞は二人称男性単数形だが、十戒では契約共同体の一員に代表的に語りかける形式である。日本語では主語を補わず、性別を不必要に限定しない形が原文の機能を自然に伝える。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。「姦淫」は日常語より硬いが、この戒めの法的・倫理的意味を正確に示す定着語であり、文脈に適する。
