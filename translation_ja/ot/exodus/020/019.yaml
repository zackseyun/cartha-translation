base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: ja
  text: 彼らはモーセに言った。「あなたが私たちに語ってください。私たちは聞きます[a]。しかし、神が私たちに語られることがありませんように。そうでなければ、私たちは死んでしまいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聞き従います」。ヘブライ語の動詞には、注意して聞くことや、聞いて応答することまで含まれる場合があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: 彼らはモーセに言った
  rationale: 物語を進めるワイイクトルを、日本語で自然な単純過去として表した。אֶל は発言の相手を示すため「モーセに」とした。
- source_word: דַּבֵּר אַתָּה עִמָּנוּ
  choice: あなたが私たちに語ってください
  rationale: 命令形に明示された代名詞 אַתָּה の対比的強調を、主格の「あなたが」で表した。עִם は字義的には「共に／と」だが、日本語の発話表現として自然な「私たちに語る」を採用した。
- source_word: וְנִשְׁמָעָה
  choice: そうすれば、私たちは聞き従います
  rationale: 語根 שׁמע は単なる聴覚的な「聞く」だけでなく、注意して聞き、応答する含みを持ち得る。命令に続く意志・応答のニュアンスを「そうすれば……ます」で自然に示した。
- source_word: וְאַל־יְדַבֵּר עִמָּנוּ אֱלֹהִים
  choice: しかし、神が私たちに語ることのないようにしてください
  rationale: אַל と未完了形による否定的願望・禁止の力を、「ことのないようにしてください」で表した。前半との対照は「しかし」で明示した。אֱלֹהִים は単数動詞と文脈に従い「神」とした。
- source_word: פֶּן־נָמוּת
  choice: さもないと、私たちは死んでしまいます
  rationale: פֶּן が導く恐れられた結果を、現代日本語で明瞭な「さもないと」で表した。「死んでしまいます」は、話者たちの切迫した恐れを自然に伝える。
theological_decisions:
- issue: אֱלֹהִים の指示対象と数
  choice: 単数の「神」
  alternative: 複数の「神々」
  rationale: 形態上は複数形だが、この箇所では単数形の動詞 יְדַבֵּר とシナイ契約の文脈により、イスラエルの神を単数で指す。
- issue: וְנִשְׁמָעָה における応答・服従の含意
  choice: 聞き従います
  alternative: 聞きます
  rationale: שׁמע は文脈により、注意深く聞いて応答することを含み得る。ただし単なる「聞く」も語彙上可能なので、脚注で幅を示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、シナイでの民の恐れにふさわしい簡潔で厳粛な調子を保った。「あなたが」により、神ではなくモーセに語ってほしいという対比を示した。
