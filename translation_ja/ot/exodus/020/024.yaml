source:
  edition: WLC
  text: מִזְבַּ֣ח אֲדָמָה֮ תַּעֲשֶׂה לִּ/י֒ וְ/זָבַחְתָּ֣ עָלָ֗י/ו אֶת עֹלֹתֶ֨י/ךָ֙ וְ/אֶת שְׁלָמֶ֔י/ךָ אֶת צֹֽאנְ/ךָ֖ וְ/אֶת בְּקָרֶ֑/ךָ בְּ/כָל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אַזְכִּ֣יר אֶת שְׁמִ֔/י אָב֥וֹא אֵלֶ֖י/ךָ וּ/בֵרַכְתִּֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: ja
  text: あなたはわたしのために土の祭壇を造り、その上で、あなたの全焼のささげ物と交わりのささげ物、羊や山羊と牛を献げなさい。わたしが自分の名が覚えられるようにする[a]すべての場所で、わたしはあなたのもとに来て、あなたを祝福する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしが自分の名を告げ知らせる」「わたしの名が唱えられるようにする」、または「わたしが自分の名を記念する」とも訳せる。ヘブライ語の動詞は使役形で、神の名が覚えられ、口にされ、あるいは記念されるようにすることを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: 土の祭壇
  rationale: 祭壇が土で造られることを示す構文を、簡潔で自然な日本語にした。
- source_word: תַּעֲשֶׂה לִּי
  choice: わたしのために……造りなさい
  rationale: 律法的指示としての未完了形を命令形で表し、לִי の献納・帰属の意味を「わたしのために」で保持した。
- source_word: וְזָבַחְתָּ עָלָיו
  choice: その上で……献げなさい
  rationale: 祭儀の文脈に即して זבח を単なる屠殺ではなく「献げる」と訳し、祭壇を指す עָלָיו も明示した。
- source_word: עֹלֹתֶיךָ
  choice: あなたの焼き尽くすささげ物
  rationale: 全体を焼く献げ物であることが一般読者にも分かる表現を採った。
- source_word: שְׁלָמֶיךָ
  choice: 会食のささげ物
  rationale: 祭儀に伴う共食を示す分かりやすい名称とし、「和解」など一つの神学的含意だけに限定することを避けた。
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: 羊や山羊と牛
  rationale: צֹאן は羊だけでなく山羊を含む小家畜、בָּקָר は牛類を指すため、動物の範囲を具体的に示した。
- source_word: בְּכָל הַמָּקוֹם
  choice: すべての場所で
  rationale: 場所ごとの広がりを表す分配的な意味を保った。
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: わたしが自分の名を覚えさせる
  rationale: זכר のヒフィル形が持つ使役性と神の主体的行為を保持しつつ、具体的な仕方を一つに決めない訳とした。
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: わたしはあなたのもとに来て、あなたを祝福する
  rationale: 神の接近と祝福という二つの行為を、自然で荘重な日本語で明示した。
theological_decisions:
- issue: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי における神の行為
  choice: わたしが自分の名を覚えさせる
  alternative: わたしが自分の名を告げ知らせる／唱えさせる／記念させる
  rationale: 使役形を正面から表し、神の名が知られ、言及され、記念される仕方を「宣言」や「記録」だけに限定せず、原文の曖昧さと神学的緊張を保った。
- issue: שְׁלָמִים の名称
  choice: 会食のささげ物
  alternative: 交わりのささげ物／平和のささげ物／和解のささげ物
  rationale: この祭儀の共食的側面を一般読者に伝えつつ、「和解」など特定の神学的理解への限定を避けた。語源的な平安・充足との関連は一語で尽くせないため、本文では祭儀上の分かりやすさを優先した。
translation_notes:
  register: 現代の一般読者に理解できる明瞭な標準語を用いながら、神の直接話法にふさわしい簡潔で格調ある文体とした。「いけにえ」の反復を避けて「ささげ物」を用い、家畜の種類は「羊や山羊と牛」と具体化した。
