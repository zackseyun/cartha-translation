    issue: שְׁלָמֶיךָ を「会食のささげ物」としている。
    rationale: 共食はこの種の献げ物の重要な祭儀的特徴となりえますが、ヘブライ語の名称自体を「会食」に限定するのは狭すぎます。本文ではより包括的な名称を用い、必要なら注で語義の幅を示すのが安全です。
  - severity: low
    issue: אַזְכִּיר אֶת־שְׁמִי の訳語「自分の名を覚えさせる」が不自然である。
    rationale: ヒフィルの使役性は保たれていますが、日本語では誰が名を覚えるのかが即座に分かりにくいです。「名が覚えられるようにする」は、原文の因果的表現を保ちながら自然です。
