  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「イスラエルの子ら[a]にこう言いなさい。『あなたがた自身、わたしが天からあなたがたに語った[b]のを見た。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では直訳すると「イスラエルの子ら」で、ここでは共同体としてのイスラエルを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「あなたがたと語った」。ヘブライ語の前置詞は、神が民に直接語られたことを強調し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く定着し、自然で荘重な「主」と訳した。固有名の音写よりも、一般読者に理解しやすい慣用を優先した。
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める接続形。日本語では文脈上、明示的な「それから」を置かずとも順序が伝わり、神への敬意を示す敬語が自然である。
- source_word: כֹּה תֹאמַר
  choice: こう言いなさい
  rationale: 使者への定型命令を、現代日本語で明瞭かつ威厳ある形にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な男性複数形を保ちつつ、日本語で共同体全体を指す聖書的表現とした。代替となる自然な集合表現は脚注に示した。
- source_word: אַתֶּם רְאִיתֶם
  choice: あなたがた自身が見たとおり
  rationale: 独立代名詞の強調を「自身が」で表した。כִּי以下は見た内容を導くが、日本語では「見たとおり」とすることで直前の出来事への証言性を自然に示せる。
- source_word: מִן הַשָּׁמַיִם
  choice: 天から
  rationale: ヘブライ語は形態上複数だが、この意味で日本語は通常「天」とする。
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: あなたがたに語りかけた
  rationale: עִםの「共に／相手として」の含みを、一方的な伝達だけでなく直接の呼びかけを表す自然な日本語にした。より字義的な代案を脚注に示した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では現代日本語の聖書慣用として広く理解される「主」を採用した。原文が固有の神名であることは認識しつつ、特定の音価再建を本文で確定しない。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的範囲
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の親族的・契約共同体的な表現を保持した。ただし文脈上は成人男性だけでなくイスラエル共同体を指し得るため、その点を脚注で明示した。
- issue: דבר עם の対人的ニュアンス
  choice: 語りかけた
  alternative: 語った／共に語った
  rationale: 神が天から民に直接語った出来事を表しつつ、相互的会話だったと過度に限定しない訳語を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発話には自然な敬語を採用した。使者定型句とシナイでの直接啓示の荘重さを保ちながら、過度な文語調は避けた。
