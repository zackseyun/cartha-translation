  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: ja
  text: あなたがたは、わたしと並ぶものとして、銀の神々を造ってはならない[a]。また、自分たちのために金の神々を造ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「わたしとともに」。または「わたしのそばに」。
    reason: אִתִּיの字義的な意味と、文脈に応じた訳語の幅を示すため。
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: 造ってはならない
  rationale: עשהはここでは礼拝対象となる像を製作することを指す。「造る」は物の製作を自然に表し、禁止命令の直接性も保つ。
- source_word: אִתִּי
  choice: わたしと並べて
  rationale: 字義は「わたしとともに」。文脈上は主と並ぶ礼拝対象を造ることへの禁止なので、自然な日本語として「わたしと並べて」とした。ただし解釈を一つに固定しないよう、字義的な別訳を脚注に示す。
- source_word: אֱלֹהֵי כֶסֶף
  choice: 銀の神々
  rationale: 構成形を簡潔に反映し、銀で作られた不法な礼拝対象を表す。「偶像」と意訳せず、原文の「神々」を保つ。
- source_word: וֵאלֹהֵי זָהָב
  choice: 金の神々
  rationale: 前半の「銀の神々」との並行を保ち、原文の反復を明確にする。
- source_word: לָכֶם
  choice: 自分たちのために
  rationale: 二人称複数接尾辞を伴う ל の受益・所有の含みを自然な日本語で表す。
- source_word: לֹא ... לֹא
  choice: …てはならない。また、…てはならない
  rationale: 二つの否定命令をそれぞれ明示し、契約規定にふさわしい端的で荘重な調子を保つ。
theological_decisions:
- issue: אִתִּיを、排他的礼拝を強調する「わたしと並べて」とするか、字義的な「わたしとともに」とするか
  choice: 本文は「わたしと並べて」、字義的な表現は脚注
  alternative: わたしとともに／わたしのそばに
  rationale: 前後の文脈では主と競合する神々を造ることが禁じられているため、「並べて」は日本語として意味が通りやすい。一方、前置詞そのものは字義的には「ともに」であり、その幅を脚注で保持した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、「造ってはならない」という法的で荘重な禁止表現を採用した。複数形の「神々」と銀・金の並行構造を明示し、原文の反復を保った。
