  source_fidelity: ヘブライ語の禁止命令、列挙される対象、神名、および安息日のヤハウェへの献呈は、全体として正しく反映されている。ただし、「あなたの門の内にいる」は日本語では物理的に門の内側にいる意味に取られやすく、בִּשְׁעָרֶיךָが指す町・共同体の領域という文脈上の意味を十分に伝えない。
