language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽ֣א תַעֲשֶׂ֨ה כָל מְלָאכָ֜ה אַתָּ֣ה וּ/בִנְ/ךָֽ֣ וּ/בִתֶּ֗/ךָ עַבְדְּ/ךָ֤ וַ/אֲמָֽתְ/ךָ֙ וּ/בְהֶמְתֶּ֔/ךָ וְ/גֵרְ/ךָ֖ אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: ja
  text: しかし、第七日は、ヤハウェ、あなたの神のための安息日である。[a] あなたは、いかなる仕事もしてはならない。あなたも、あなたの息子も、あなたの娘も、あなたの男奴隷も女奴隷も[b]、あなたの家畜も、あなたの町にいる寄留者も[c]、してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「そして、第七日は」。ヘブライ語の接続詞はどちらにも訳せるが、「しかし」は前節の六日間の労働との対比を明確にする。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「男のしもべ、女のしもべ」とも訳される。ヘブライ語は、ここでは世帯に属する男女の奴隷を指す。
    reason: lexical_alternative
  - marker: c
    text: 「居住外国人」とも訳せる。ヘブライ語のゲールは、イスラエル人の共同体に住む非イスラエル人を指す。直訳すると「あなたの門の中にいる者」であり、ここでの「門」は町・共同体の領域を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: しかし、第七日は
  rationale: 接続詞 וְ は通常「そして」だが、前節の六日間の労働と第七日を対比しているため、現代日本語では「しかし」が文脈上の働きを自然に示す。字義的には「そして、第七日は」も可能。
- source_word: שַׁבָּת
  choice: 安息日
  rationale: 単なる「休みの日」と言い換えず、制度的・契約的な含意を持つ名詞を、日本語聖書で広く理解される「安息日」で表した。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: あなたの神ヤハウェのための
  rationale: 前置詞 לְ の帰属・献呈の意味を「ための」で表し、この日がヤハウェにささげられ、ヤハウェに属する日であることを保った。
- source_word: יהוה
  choice: ヤハウェ
  rationale: 本文に記された四文字神名を称号に置き換えず、神の契約名として音写した。
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: いかなる仕事もしてはならない
  rationale: לֹא を伴う法的命令の禁止の力を「してはならない」で示し、כָל の包括性を「いかなる……も」で表した。מְלָאכָה は一般的な作業・労働を指すため「仕事」とした。
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: 男奴隷も女奴隷も
  rationale: 対になった語が示す拘束された家内身分を曖昧にせず、「しもべ」より社会的実態が明確な「奴隷」を用いた。性別の区別も保持した。
- source_word: וּבְהֶמְתֶּךָ
  choice: 家畜も
  rationale: בְּהֵמָה はここでは世帯に属する飼育動物を集合的に指すため、狭すぎる「牛」ではなく「家畜」とした。
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: あなたの門の内にいる寄留者も
  rationale: גֵּר はイスラエルの共同体内に居住する非出身者を指すので「寄留者」とし、בִּשְׁעָרֶיךָ の町・共同体領域を表す門の表現も保持した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の契約名を明記しているため、称号「主」で代替せず音写した。
- issue: 安息日の禁止が及ぶ範囲
  choice: 本人、子ども、男女の奴隷、家畜、寄留者をすべて明示する
  alternative: 世帯全体などと一括して表現する
  rationale: 原文の列挙は、家長本人だけでなく世帯とその領域にいる弱い立場の者や動物にまで休止が及ぶことを明示しているため、省略せず保持した。
- issue: שַׁבָּת の意味
  choice: 安息日
  alternative: 休みの日
  rationale: 休息という一般概念だけに還元せず、ヤハウェのために区別された第七日という制度的・神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令の法的な強さは「してはならない」で表し、列挙では「も」を反復して禁止の適用範囲を自然に示した。「あなたの門の内」は古代都市の共同体領域を表す原文の比喩を保つため、平板な「町の中」に置き換えなかった。
