  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ja
  text: しかし、わたしを愛し、わたしの戒めを守る幾千の者に[a]、変わらぬ愛を示す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「幾千代にわたって」。申命記5章10節参照。ヘブライ語本文は直訳すると単に「幾千に」。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: しかし、…示す
  rationale: 分詞は前節から続く神の行為を表す。接続詞 וְ は形式上「そして」だが、前節の裁きとの明確な対照を自然な日本語で示すため「しかし」とした。
- source_word: חֶסֶד
  choice: 変わらぬ愛
  rationale: 契約に根差す忠実な愛と慈しみを表す語である。「変わらぬ愛」は、単なる憐れみに狭めず、忠実さと愛の両面を明瞭に伝える。
- source_word: לַאֲלָפִים
  choice: 幾千の者に
  rationale: 本文には「世代」に当たる語がなく、字義どおり複数の「千」を保った。日本語として対象を示すため「者」を補ったが、世代を指す可能性は脚注に残した。
- source_word: לְאֹהֲבַי
  choice: わたしを愛し
  rationale: 分詞と一人称接尾辞を、継続的な関係的忠実さが自然に伝わる連体的表現とした。
- source_word: וּלְשֹׁמְרֵי
  choice: 守る
  rationale: 命令を目的語とする שׁמר は「守る、遵守する」の意味であり、十戒の文脈に適した自然な表現である。
- source_word: מִצְוֺתָי
  choice: わたしの戒め
  rationale: 契約と法の文脈を保つ標準的な訳語として「戒め」を用いた。
theological_decisions:
- issue: לַאֲלָפִים の範囲
  choice: 幾千の者に
  alternative: 幾千代にわたって／千代に至るまで
  rationale: この節のヘブライ語本文には「世代」という名詞が明記されていないため、本文では数詞の複数形を優先した。一方、前節との対比や申命記5章10節との並行から世代を含意すると理解する余地があるので、脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、十戒にふさわしい簡潔で荘重な文体とした。「変わらぬ愛」により חֶסֶד の忠実さと慈愛を両立させた。
