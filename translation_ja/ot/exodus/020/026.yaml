  text: וְ/לֹֽא תַעֲלֶ֥ה בְ/מַעֲלֹ֖ת עַֽל מִזְבְּחִ֑/י אֲשֶׁ֛ר לֹֽא תִגָּלֶ֥ה עֶרְוָתְ/ךָ֖ עָלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: ja
  text: また、あなたの裸がその上であらわにならないよう、階段を使ってわたしの祭壇に上ってはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲלֶה
  choice: 上ってはならない
  rationale: עלהの方向性「上る」を保ち、לֹאを伴う禁止を自然な現代日本語で表した。
- source_word: בְמַעֲלֹת
  choice: 階段を使って
  rationale: מַעֲלוֹתは段・階段を指す。手段を示す前置詞בְּを、日本語として明瞭な「使って」で表した。
- source_word: מִזְבְּחִי
  choice: わたしの祭壇
  rationale: מִזְבֵּחַに一人称単数接尾辞が付いた形を標準的に訳した。
- source_word: אֲשֶׁר לֹא
  choice: ……ないためである
  rationale: 先行する禁止の目的・理由を示す節として訳し、現代日本語で関係を明確にした。
- source_word: תִּגָּלֶה
  choice: あらわにならない
  rationale: גלהのニファル形が表す受動的な「覆いが取れて見える」意味を、身体の露出という文脈に合う自然な表現で示した。
- source_word: עֶרְוָתְךָ
  choice: あなたの裸
  rationale: עֶרְוָהの身体的・慎みを要する含意を保ちつつ、特定の身体部位に狭めず訳した。
- source_word: עָלָיו
  choice: その上で
  rationale: 男性単数代名詞の指示対象を祭壇と取り、祭壇との位置的関係を明示した。
theological_decisions:
- issue: 祭壇に階段で上ることを禁じる理由
  choice: 聖所で裸があらわになることを避けるためという、本文に明記された理由だけを示した。
  alternative: 神の前での謙遜の象徴とする解釈、または祭司の衣服に特有の問題とする解釈。
  rationale: ヘブライ語本文は身体の露出を直接の理由として述べるが、それ以上の象徴的意味や衣服の事情までは明示していないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「階段を使って」は手段を自然に示し、「裸」「あらわになる」は原文の直接さを保ちながら過度に露骨な表現を避けている。
