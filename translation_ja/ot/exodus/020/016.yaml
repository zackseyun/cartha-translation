  language: ja
  text: あなたの隣人に対して、偽りの証言をしてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの隣人に不利な偽証をしてはならない。」
    reason: תַעֲנֶהとבְרֵעֲךָの法廷的な含意を、より明示的に表す訳。
lexical_decisions:
- source_word: לֹא
  choice: してはならない
  rationale: 十戒の禁止命令として、現代日本語で明確かつ厳粛な表現を用いた。
- source_word: תַעֲנֶה
  choice: 証言をする
  rationale: ここでは法廷・司法の文脈における「答える、証言する」の意味が自然であり、「証言をする」と訳した。
- source_word: בְרֵעֲךָ
  choice: あなたの隣人に対して
  rationale: רֵעַは「隣人、仲間」を指す。「に対して」は、証言がその人に関して、特に不利に向けられる司法的関係を自然に表す。
- source_word: עֵד שָׁקֶר
  choice: 偽りの証言
  rationale: 直訳的な「偽りの証人」ではなく、この構文で禁じられている行為の内容が日本語で明瞭になるよう「偽りの証言」とした。שָׁקֶרの虚偽・欺瞞の意味も保っている。
