  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: ja
  text: 民は皆、雷鳴[a]と火のひらめき[b]、角笛の音、そして煙を上げている山を見ていた[c]。民はこれを見て震え、遠く離れて立った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「音々」または「声々」。ここでは雷鳴を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では字義的に「たいまつ」。ここでは稲妻のような火のひらめきを指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語は、雷鳴や角笛の音を含むこれらの現象を民が「見ていた」と表現し、圧倒的な光景の中で感覚が交錯する描写を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: 見ていた
  rationale: 分詞の継続的な情景描写を表し、後続の完了的な反応との違いも保つ。聴覚的現象まで「見る」とする原文の感覚表現をあえて残した。
- source_word: הַקּוֹלֹת
  choice: 雷鳴
  rationale: 字義的には「音々／声々」だが、シナイ山の顕現と火のひらめきという文脈では雷鳴を指すと考えるのが自然である。字義は脚注に示した。
- source_word: הַלַּפִּידִם
  choice: 火のひらめき
  rationale: 基本義は「たいまつ」だが、この顕現の文脈では稲妻のような火の閃光を表す。「稲妻」と限定しすぎず、具体的な火の像を保った。
- source_word: קוֹל הַשֹּׁפָר
  choice: 角笛の音
  rationale: שׁוֹפָרは角で作る楽器を指すため、現代日本語で理解でき、原語にも近い「角笛」とした。構文上の「音」も明示した。
- source_word: הָהָר עָשֵׁן
  choice: 煙を上げている山
  rationale: 山が煙っているという述語的な描写を、自然で鮮明な日本語にした。
- source_word: וַיַּרְא הָעָם
  choice: 民はこれを見て
  rationale: 列挙された現象全体を受ける目的語を日本語で補い、その目撃から反応へ進む流れを示した。
- source_word: וַיָּנֻעוּ
  choice: 震え
  rationale: 恐れによって揺れ動く反応を、簡潔で自然な日本語で表した。
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: 遠く離れて立った
  rationale: 恐れから距離を取って立つという空間的な動きを、原文に近く明瞭に表した。
- source_word: וְכָל הָעָם
  choice: 民は皆
  rationale: 集まっていたイスラエルの民全体を指す表現として、自然で簡潔な日本語を選んだ。
theological_decisions:
- issue: 聴覚的現象を含むものを民が「見ていた」とする感覚表現
  choice: 「雷鳴…角笛の音…を見ていた」とし、原文の混合感覚的な表現を保持する
  alternative: 「雷鳴と角笛の音を聞き、火のひらめきと山を見た」または「すべてを感じ取った」と感覚別に整理する
  rationale: 原文は圧倒的な神顕現を、聴覚と視覚が交錯する表現で描く。日本語として異例でも理解可能であり、この緊張を解消せず脚注で説明する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神顕現にふさわしい簡潔で荘重な調子を保った。「人々」ではなく文脈上の共同体を示す「民」、「ラッパ」より原語の具体像を伝える「角笛」を採用した。
