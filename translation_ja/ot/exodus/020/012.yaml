  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ja
  text: あなたの父と母を敬いなさい。そうすれば、あなたの神ヤハウェがあなたに与えている土地で[a]、あなたの日々が長く続く[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「土地の上で」。ここでは自然な日本語として「土地で」とした。
    reason: lexical_alternative
  - marker: b
    text: 「日々が長く続く」は、長生きすることを表すヘブライ語の慣用表現。
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: 敬いなさい
  rationale: ピエル形の命令が表す、父母を重んじ、ふさわしい敬意をもって扱うという倫理的な強さを、自然で格調ある現代日本語で表した。
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: あなたの父と母
  rationale: 二人称男性単数接尾辞を含む対句を、直接的で自然な家族語彙によって訳した。
- source_word: לְמַעַן
  choice: そうすれば
  rationale: 目的と結果の双方を帯びうる接続を、命令と約束の結びつきが明瞭になる自然な日本語で表した。
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: あなたの日々は長くなる
  rationale: 長寿を意味するヘブライ語の比喩的慣用表現を保持し、その意味は脚注で明らかにした。
- source_word: עַל הָאֲדָמָה
  choice: 土地で
  rationale: אֲדָמָהは文脈上、単なる土壌や全地ではなく、神がイスラエルに与える土地を指す。日本語では場所を表す「で」が自然であり、ヘブライ語のעַלに近い「土地の上で」も脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な音写によって示した。
- source_word: אֱלֹהֶיךָ
  choice: あなたの神
  rationale: 構成形と二人称男性単数接尾辞を簡潔かつ直接的に訳した。
- source_word: נֹתֵן לָךְ
  choice: あなたに与えている
  rationale: 分詞が示す継続中または実現へ向かう行為を保持し、シナイで土地が約束されている文脈にも適合させた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を明記しているため、称号へ代替せず神名として音写した。
- issue: הָאֲדָמָה が指す範囲
  choice: 土地
  alternative: 地面／大地
  rationale: 「あなたに与えている」という句と十戒の歴史的文脈から、イスラエルに与えられる土地を指す。ただし、本文にない「約束の地」という説明までは加えなかった。
- issue: לְמַעַן の目的・結果の関係
  choice: そうすれば
  alternative: ～するためである
  rationale: 命令に続く約束として自然に読める形を採用したが、原語が目的と結果の両方を表しうる緊張を不必要に教理化していない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令には簡潔で格調のある「敬いなさい」を採用した。神名は「ヤハウェ」とし、長寿を表す原文の比喩表現は本文に残して脚注で補った。
