  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: ja
  text: 民は遠く離れた所に立っていた。モーセは、神がおられた濃い闇[a]に近づいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「暗雲」または「暗がり」とも訳せる。ヘブライ語は、神の顕現に伴う深い闇を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 立っていた
  rationale: 単純な過去の動作だけでなく、民がその場にとどまった状態も自然に表す。
- source_word: הָעָם
  choice: 民
  rationale: 文脈上、シナイ山に集まったイスラエルの民を指す。「イスラエル」は原文にないため補わない。
- source_word: מֵרָחֹק
  choice: 遠く離れた所に
  rationale: 空間的な隔たりを、明瞭で自然な現代日本語で表す。
- source_word: נִגַּשׁ
  choice: 近づいて行った
  rationale: נגשׁの「近づく」という動きを明確に伝え、直前の民との対照も保つ。
- source_word: הָעֲרָפֶל
  choice: 濃い闇
  rationale: 神の顕現に伴う深い暗さ・視界を遮る闇を表し、「暗雲」と限定しすぎない。
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: 神がおられる
  rationale: 場所を示す関係節を自然な日本語にしつつ、原文が述べる神の所在を過度に説明しない。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: この文脈ではイスラエルの神を指す単数的用法である。
theological_decisions:
- issue: 闇の中における神の顕現
  choice: 「神がおられる濃い闇」と具体的に訳し、神の臨在と近づき難い暗さの緊張を保つ。
  alternative: 「神がおられる暗雲」または「神の臨在する暗がり」
  rationale: עֲרָפֶלを単なる気象現象や象徴に限定せず、神が闇の中におられるという原文の逆説的な描写をそのまま伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「民」「濃い闇」により簡潔で荘重な調子を保った。二文に分け、民が遠くにとどまる姿とモーセが近づく姿の対照を読み取りやすくした。
