source:
  edition: WLC
  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: ja
  text: 隣人の家[a]を欲してはならない。隣人の妻、男奴隷、女奴隷、牛、ろば、また隣人に属するものを何一つ欲してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隣人の家の者・世帯」とも訳せる。ヘブライ語の「家」は家屋だけでなく、家の者や世帯を指すこともあるが、ここでは妻、奴隷、家畜が続いて別々に挙げられているため、本文では「家」とした。
    reason: 語義上の別訳
lexical_decisions:
- source_word: תַחְמֹד
  choice: 欲しがってはならない
  rationale: חמדは広く「望む」を意味し得るが、この禁止命令では他人に属するものを自分のものにしたいと欲することを指す。現代日本語として明瞭で、原語以上に特定の行為へ限定しない表現とした。
- source_word: בֵּית רֵעֶךָ
  choice: 隣人の家
  rationale: בַּיִתには「家屋」と「家の者・家族」の両義があるが、続いて妻、奴隷、家畜が個別に列挙されるため、本文では建物としての「家」を採った。別の可能性は注に残した。
- source_word: רֵעֶךָ
  choice: 隣人
  rationale: רֵעַは共同体内の他者、仲間を指す語であり、十戒の対人的文脈に定着し、かつ現代にも通じる「隣人」とした。
- source_word: אֵשֶׁת רֵעֶךָ
  choice: 隣人の妻
  rationale: 構文どおり、関係性を明確に表した。
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: その男奴隷、女奴隷
  rationale: この所有物の列挙では拘束された身分が前面に出るため、「使用人」ではなく「奴隷」とした。男性形と女性形の区別も保持した。
- source_word: שׁוֹרוֹ
  choice: 牛
  rationale: שׁוֹרは牛科の家畜、とりわけ役畜を指す。日本語の「雄牛」や「去勢牛」は原語の範囲を狭め得るため、包括的な「牛」とした。
- source_word: חֲמֹרוֹ
  choice: ろば
  rationale: 現代日本語で明瞭な一般名称を用いた。
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: また隣人のものは何一つ
  rationale: 隣人に属する一切を含む総括句であることを、自然な日本語で明確にした。
- source_word: לֹא ... לֹא
  choice: 欲しがってはならない……欲しがってはならない
  rationale: 原文で繰り返される禁止を統合せず、二度明示して強調と構造を保った。
theological_decisions:
- issue: 最初の בֵּית を「家」とするか「家の者・家族」とするか
  choice: 家
  alternative: 家の者／家族
  rationale: 語自体には両義があるが、直後に妻、奴隷、家畜が別々に挙げられるため、「家」とするのが文脈上自然である。ただし語義上の曖昧さは脚注に示した。
- issue: עֶבֶד と אָמָה の社会的身分をどう表すか
  choice: 男奴隷／女奴隷
  alternative: 男の使用人／女の使用人
  rationale: 法的・所有的な列挙の中では拘束身分が重要であるため、婉曲化せず「奴隷」と訳した。これは制度を肯定するためではなく、本文が前提とする古代社会の身分を明示するためである。
translation_notes:
  register: 明瞭な現代標準語を用い、十戒としての荘重さを「～てはならない」で保った。列挙は簡潔にしつつ、原文の二重の禁止を保持した。「奴隷」は歴史的身分を曖昧にしないための訳語である。
