source:
  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: ja
  text: 「わたしはあなたの神、ヤハウェ[a]である。わたしはあなたをエジプトの地から、奴隷の家[b]から導き出した。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語はYHWH（יהוה）。伝統的には「主」と訳される。ここでは神名を「ヤハウェ」と音写したが、古代の正確な発音は確定していない。
    reason: alternative_reading
  - marker: b
    text: 直訳は「奴隷たちの家」。文脈に即して「奴隷の家」または「奴隷状態に置かれた所」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: わたしは〜である
  rationale: 独立人称代名詞による強調を保ちつつ、動詞のない名詞文を現代日本語の荘重で自然な自己宣言として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号「主」に置き換えず、本文に記された神の固有名YHWHを一般的な日本語表記で音写した。
- source_word: אֱלֹהֶיךָ
  choice: あなたの神
  rationale: 語形は複数形に由来するが、ここでは単数の接尾辞と文脈によりイスラエルの神を単数で指す。二人称単数も「あなた」で保持した。
- source_word: הוֹצֵאתִיךָ
  choice: あなたを〜から導き出した
  rationale: יצאのヒフィル形が表す使役的な「外へ出す」を、出エジプトの救出行為が明瞭になる自然な日本語で表した。「連れ出した」も可能だが、「導き出した」は神の主体的な働きを簡潔に示す。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 前置詞מןの起点と、אֶרֶץを含む地理的表現を保持した。
- source_word: מִבֵּית עֲבָדִים
  choice: 奴隷たちの家から
  rationale: 直訳的な具体像「奴隷たちの家」を保持し、前の「〜から」と並行させた。日本語としてより慣用的な「奴隷の家」「奴隷状態の家」よりも、複数名詞עֲבָדִיםの形を見える形で残した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が神名そのものを用いているため、称号への置換を避けて音写した。母音の復元には不確実性があることを脚注で示した。
- issue: エジプトにおけるעֲבָדִיםの身分
  choice: 奴隷たち
  alternative: 僕たち、仕える者たち、奴隷状態
  rationale: 強制労働と隷属が文脈の中心なので「僕」では弱すぎる。「奴隷たち」として具体的な複数名詞を保持した。
- issue: 関係節と自己宣言の統語関係
  choice: 導き出した、あなたの神ヤハウェである
  alternative: わたしはあなたの神ヤハウェである。わたしがあなたを導き出した
  rationale: אֲשֶׁר以下が神を限定・描写する原文の一文構造を保ち、救出した方と「あなたの神」との同一性を明示した。
translation_notes:
  register: 現代標準日本語による、明瞭で荘重な宣言調。「わたし」「あなた」は読みやすい平仮名とし、神名は固有名として片仮名表記した。原文の二つの起点句「〜から、〜から」の並行と、「奴隷たちの家」という具体的比喩を保持した。
