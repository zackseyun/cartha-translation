source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: ja
  text: それから、モーセにこう言われた。「あなたは、アロン、ナダブ、アビフ、およびイスラエルの長老たちのうち七十人と共に、ヤハウェ[a]のもとへ上って来なさい。遠く離れた所からひれ伏しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文では、話者がヤハウェであると見られるにもかかわらず、「ヤハウェのもとへ上って来なさい」となっている。「わたしのもとへ」などとは言い換えず、原文の表現をそのまま残した。
    reason: 原文の異例な三人称表現と、それに伴う曖昧さを示すため。
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: それから、モーセに言われた
  rationale: ヘブライ語の語順と、直前から続く新たな発話単位を自然な現代日本語で表した。動詞は三人称男性単数だが主語は明示されていないため、神を指す日本語の敬語表現「言われた」を用い、本文にない固有の主語は補わなかった。
- source_word: עֲלֵה
  choice: 上って来なさい
  rationale: עלה の命令形は「上れ」を意味し、神の臨在への接近を命じる直接話法として、日本語では「上って来なさい」が自然である。
- source_word: אֶל יְהוָה
  choice: ヤハウェのもとへ
  rationale: 前置詞 אֶל の方向性を「のもとへ」で示し、神名 יהוה は固有名として「ヤハウェ」とした。話者がヤハウェであると見られるのに「ヤハウェのもとへ」と三人称で述べる原文の異例な表現を保った。
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: あなたは、アロン、ナダブ、アビフ…と共に
  rationale: 明示された「あなた」を保ちつつ、同行者の列挙が自然に読めるよう「と共に」でまとめた。固有名は日本語聖書で理解されやすい慣用形を採用した。
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: イスラエルの長老たちのうち七十人
  rationale: מן の部分を表す用法を「のうち」で明示し、長老集団から選ばれた七十人というニュアンスを保持した。
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: そして…ひれ伏しなさい
  rationale: この動詞は敬意を込めて身をかがめ、ひれ伏す身体動作を表す。「礼拝しなさい」と解釈を狭めず、現代日本語で明瞭な「ひれ伏す」とした。複数形の命令は文脈上同行者全員に及ぶ。
- source_word: מֵ/רָחֹק
  choice: 遠く離れた所から
  rationale: 神の臨在との空間的隔たりを示す語句を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された契約の神名を固有名として表し、「ヤハウェ」とした。
- issue: ヤハウェが話者と見られる中で「ヤハウェのもとへ」と命じる異例な表現
  choice: 原文どおり三人称表現を本文に残す
  alternative: 「わたしのもとへ」または「ヤハウェの前へ」と平滑化する
  rationale: אֶל יְהוָה を明示的に保ち、本文が内包する話者同定上の曖昧さと神学的緊張を翻訳者の判断で解消しないため。脚注で異例な原文表現を説明した。
- issue: השתחוה の宗教的含意
  choice: ひれ伏す
  alternative: 礼拝する
  rationale: 原語が示す身体的な伏礼を保ち、ここで語の意味を特定の礼拝概念だけに限定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令表現には威厳を損なわない「なさい」を用い、「ひれ伏す」など一般読者にも理解できる語を選んだ。
