source:
  edition: WLC
  text: וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הָ/הָ֑ר וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: ja
  text: それから、モーセは山に登った[a]。雲が山を覆った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセは山へ登って行った」。ヘブライ語の接続表現は単に「そして」とも訳せる。また、前置詞は山への方向を示し、山の上に進んだことを含意し得る。
    reason: 接続表現と方向を示す前置詞の訳し方に幅があるため。
lexical_decisions:
- source_word: וַיַּעַל
  choice: それから、…登った
  rationale: עלהの上方への移動を自然な現代日本語の「登った」で表し、接頭辞וַは物語の進行を示す「それから」とした。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で定着した人名表記。
- source_word: אֶל־הָהָר
  choice: 山に
  rationale: אֶלは「へ／に」を表し、עלהとの組み合わせでは山へ上って行くことを示す。「山に登る」は日本語として、山へ向かうことと登攀の双方を自然に含むが、到達の範囲には曖昧さがあるため注記した。
- source_word: וַיְכַס
  choice: 覆った
  rationale: כסהの基本義「覆う」を直接的に訳し、「包んだ」などの文脈的な具体化を避けた。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 定冠詞付きの名詞を、文脈上すでに知られている雲として自然な日本語で表した。神の栄光や主の雲とは明示しない。
- source_word: אֵת
  choice: 訳出しない
  rationale: ヘブライ語の定目的語標識であり、日本語では語順と助詞によって目的語関係を表すため。
- source_word: הָהָר
  choice: 山
  rationale: シナイの文脈ではהַרの通常かつ適切な訳語は「山」である。
theological_decisions:
- issue: 雲の性質
  choice: 本文では単に「雲」とする。
  alternative: 「栄光の雲」または「主の雲」
  rationale: 広い文脈では神の臨在と結びつくが、この節のヘブライ語は「雲」とだけ述べるため、本文に説明を加えず、その抑制を保った。
- issue: モーセが山のどこまで進んだか
  choice: 「山に登った」とし、山へ上る動きを表す。
  alternative: 「山の上に登った」または「山へ登って行った」
  rationale: אֶלは目的地への方向を示し得るが、この表現だけで山頂への到達を断定する必要はない。「山に登った」は自然さを保ちつつ、到達点を過度に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い二つの動作を二文に分け、ヘブライ語の物語進行を読みやすく示した。「雲」は不必要な神学的説明を加えず、原文どおり簡潔にした。
