  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: ja
  text: そこでモーセはその血を取り、民に振りかけ[a]、言った。「見よ、これは、ヤハウェがこれらすべての言葉に基づいてあなたがたと結んだ[b]契約の血である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「民の上に投げた」。この動詞は、祭儀において血を施す行為にも用いられる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では契約を「切る」と表現するが、これは「契約を結ぶ」という意味の慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取った
  rationale: לקחの物語叙述における通常の意味を、自然な現代日本語で表した。
- source_word: הַדָּם
  choice: その血
  rationale: 定冠詞があり、直前の文脈で言及された犠牲の血を指すため。
- source_word: וַיִּזְרֹק
  choice: 振りかけた
  rationale: זרקは基本的に「投げる、放つ」を意味するが、ここでは血を儀礼的に民へ施す行為を表す。「投げつける」より自然で文脈に適しつつ、原語の具体性は脚注で示した。
- source_word: עַל הָעָם
  choice: 民に
  rationale: 血が民の上に施されたことを、自然な日本語の格助詞で表した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 厳粛な提示を示す指示詞の力を保つ、簡潔で格調ある表現。
- source_word: דַם הַבְּרִית
  choice: 契約の血
  rationale: 構成形を直接的に訳し、後代の聖書的響きと神学的重要性を保った。
- source_word: כָּרַת
  choice: 結ばれた
  rationale: 直訳は契約を「切る」だが、日本語では「契約を結ぶ」が対応する定着した慣用表現であり、祭儀的背景を過度に説明せず意味を正確に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: עִמָּכֶם
  choice: あなたがたと
  rationale: 二人称男性複数接尾辞を明示し、契約の相手が民全体であることを保った。
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: これらのすべての言葉に基づいて
  rationale: דבריםを「言葉」として保ち、עַלが契約と直前に語られた規定との根拠・関連を示すことを自然に表した。
theological_decisions:
- issue: 契約締結の慣用句 כָּרַת ... בְּרִית
  choice: 契約を結ぶ
  alternative: 契約を切る
  rationale: ヘブライ語は字義的には契約を「切る」と言うが、日本語で字義訳すると意味が伝わりにくい。「契約を結ぶ」は意味を正確に伝え、犠牲による批准との関連を断定的に付加しない。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を用いているため、その区別を保って音写した。
- issue: 血を民に施す行為 וַיִּזְרֹק
  choice: 振りかける
  alternative: 投げる／浴びせかける
  rationale: 語の具体的な「投げる」性質と祭儀的な血の適用の双方を考慮し、本文では自然で誤解の少ない表現を採り、語義の幅を脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を基調とし、「見よ」「契約の血」によって節の厳粛さと聖書内での重要な響きを保った。神名は「ヤハウェ」とした。脚注記号は該当表現の直後に置いた。
