  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: ja
  text: そこでモーセは、従者[a]ヨシュアと共に立ち上がった。そしてモーセは神の山へ登って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「仕える者」または「助手」。ヘブライ語は、身近に付き添って仕える者を表す。ここではヨシュアがモーセに仕える従者であることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 立ち上がった
  rationale: קוםの基本的な動作と物語の進行を保つ。「出発した」と限定せず、続く登山との区別も残す。
- source_word: וִיהוֹשֻׁעַ
  choice: ヨシュア
  rationale: 日本語聖書で広く定着している人名表記を用いる。
- source_word: מְשָׁרְתוֹ
  choice: 従者
  rationale: שׁרתは身近に仕える者を表す。ここでは奴隷的含意や祭儀的な役職を持ち込まず、モーセに仕えるヨシュアの立場を簡潔に示す。接尾辞「彼の」が指すモーセとの関係は、日本語では語順により明らかである。
- source_word: וַיַּעַל
  choice: 登って行った
  rationale: עלהが表す山への上方移動を、自然な現代日本語で明示する。
- source_word: הַר הָאֱלֹהִים
  choice: 神の山
  rationale: ヘブライ語の属格関係をそのまま保ち、特定の山が神に属する、または神と特別に結び付くという表現上の余地を残す。
theological_decisions:
- issue: מְשָׁרְתוֹにおけるモーセとヨシュアの関係
  choice: ヨシュアをモーセの「従者」とする。
  alternative: 「僕」「奉仕者」「助手」
  rationale: 文脈はモーセの身近に仕える者を指す。「僕」は隷属の印象を与え得て、「奉仕者」は宗教的職務を連想させ得る。「助手」は分かりやすいが、原語の「仕える」という関係性を弱めるため、本文では「従者」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で物語の連続を示し、二つの動詞を分けて原文の主語反復も保持した。
