  text: וַ/יָּבֹ֥א מֹשֶׁ֛ה בְּ/ת֥וֹךְ הֶ/עָנָ֖ן וַ/יַּ֣עַל אֶל הָ/הָ֑ר וַ/יְהִ֤י מֹשֶׁה֙ בָּ/הָ֔ר אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָֽיְלָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: ja
  text: モーセは雲のただ中に入り[a]、山に登った。モーセは四十日四十夜、山にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雲の中に入り」とも訳せる。ヘブライ語は、モーセが雲そのものの内部に入ったことを強く印象づける。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 入り
  rationale: この文脈のבואは、モーセが雲の内部へ移動したことを表す。「入る」は方向性を自然な日本語で明確に伝える。
- source_word: בְּתוֹךְ
  choice: ただ中に
  rationale: תּוֹךְが示す内部・中央という意味を保ち、モーセが雲のそばではなく、その内部に入ったことを鮮明に表す。
- source_word: הֶעָנָן
  choice: 雲
  rationale: 定冠詞付きのעָנָןを、文脈ですでに示されている神の臨在に伴う雲として簡潔に訳した。原文にない「厚い」などの説明は加えない。
- source_word: וַיַּעַל
  choice: 登った
  rationale: עלהの上方への移動を、山を目的地とする自然な現代日本語で表す。
- source_word: אֶל הָהָר
  choice: 山に
  rationale: אֶלは方向・到達点を示す。עלהと組み合わせて「山に登った」とすることで、簡潔で自然な日本語にした。
- source_word: וַיְהִי
  choice: いた
  rationale: ここでは一定期間にわたるモーセの所在・状態を示す。「とどまった」ではなく「いた」とし、原文に明示されない継続の含意を加えない。
- source_word: בָּהָר
  choice: 山に
  rationale: この文脈の前置詞בは山上での所在を示す。日本語では「山にいた」が自然である。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: 四十日四十夜
  rationale: 日数と夜数を対にしたヘブライ語の期間表現を、日本語で定着した簡潔な形にした。
theological_decisions:
- issue: 神の臨在に伴う雲の描写
  choice: 雲
  alternative: 厚い雲
  rationale: 原文は定冠詞付きの通常の名詞עָנָןを用い、「厚い」に当たる形容語を伴わない。神顕現の意味を説明的に拡張せず、物語の表現をそのまま保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「雲のただ中」はやや荘重だが理解しやすく、原文の空間的な鮮明さを伝える。後半では原文の「モーセ」の反復を保持した。
