source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: ja
  text: また、長老たちにはこう言った。「私たちがあなたがたのところに戻るまで、ここにとどまっていなさい。見なさい、アロンとフルがあなたがたと共にいる。訴えのある者[a]は、彼らのもとへ行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「争い事のある者」。
    reason: בַעַל דְּבָרִים は、法的な訴え・案件を持つ者とも、争い事の当事者とも理解できるため。
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: 長老たち
  rationale: 共同体で公的役割を担う長老・指導者を指すため、日本語聖書で定着し、文脈にも適する「長老たち」とした。
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: ここにとどまっていなさい
  rationale: ישׁב の基本的な「座る・住む・とどまる」のうち、この命令ではその場に残ることが要点である。「私たちが…戻るまで」という後続句と合わせ、לָנוּ の関係性も自然に伝わるようにした。
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: 私たちがあなたがたのところに戻るまで
  rationale: שוב の「戻る」と、複数の話者および長老たちへの帰着を明示した。
- source_word: וְהִנֵּה
  choice: 見なさい
  rationale: 後続内容へ注意を促す談話機能を保ちつつ、現代日本語で理解しやすい命令表現とした。
- source_word: עִמָּכֶם
  choice: あなたがたと共にいる
  rationale: עִם が表す同伴・臨在を直接的に訳した。
- source_word: מִי בַעַל דְּבָרִים
  choice: 訴えのある者
  rationale: בַעַל דְּבָרִים は法的な案件、主張、争いに関わる者を表す慣用句である。「訴え」は司法的文脈を自然に示しつつ、具体的な争いに限定しすぎない。
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: 彼らのもとへ出なさい
  rationale: 未完了形の指示・勧告の力を命令形で表し、アロンとフルのもとへ案件を持って行く行為を自然な日本語にした。
theological_decisions:
- issue: 法的指示における不定の単数形
  choice: 訴えのある者は、彼らのもとへ出なさい
  alternative: 訴えのある人々は、彼らのもとへ出なさい
  rationale: ヘブライ語の מִי … יִגַּשׁ は不定の単数を用いている。日本語では「者」によって性別を付加せず、単数的な一般指示を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、長老への公的な指示にふさわしい落ち着いた格調を保った。「見よ」のような文語的表現は避け、「見なさい」とした。
