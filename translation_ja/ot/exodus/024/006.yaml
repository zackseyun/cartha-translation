translation:
  language: ja
  text: モーセは血の半分を取って鉢に入れ、血の半分を祭壇に振りかけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祭壇に浴びせかけた」、または「祭壇にまいた」とも訳せる。ヘブライ語の動詞は、祭儀の文脈では血を勢いよく祭壇にかける動作を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取って
  rationale: לקחの通常の物語用法を、後続する動作と自然につながる現代日本語で表した。
- source_word: חֲצִי הַדָּם
  choice: 血の半分
  rationale: 定冠詞を伴う部分表現の意味を簡潔に保った。二度目は日本語として明確になるよう「残りの半分」とした。
- source_word: וַיָּשֶׂם
  choice: 入れ
  rationale: 容器に液体を置く場面なので、広義の配置動詞שׂיםを自然な日本語の「入れる」で表した。
- source_word: בָּאַגָּנֹת
  choice: 鉢に
  rationale: אַגָּנֹתは液体を受ける複数の容器を指す。「鉢」は祭儀の場面でも理解しやすく、「盆」より血を収める容器として自然である。ヘブライ語の複数性は、日本語では数を明示しなくても保持可能なため無理に「複数の」としなかった。
- source_word: זָרַק
  choice: 振りかけた
  rationale: 祭儀において血を勢いを伴って適用する動作を指す。日本語の「振りかける」は「振りまく」ほど散乱を強調せず、「注ぐ」や繊細な「振り注ぐ」とも異なり、自然で明確である。動作の強さには幅があるため脚注で代案を示した。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 祭壇に
  rationale: עלはここでは血が祭壇の表面に適用されることを示す。日本語では「祭壇に」が最も自然で、接触先を明確に伝える。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着した固有名詞表記。
theological_decisions:
- issue: 契約の祭儀における血の適用動作
  choice: 「祭壇に振りかけた」と訳し、血を祭壇へ投じる祭儀的動作を自然な日本語で示した。
  alternative: 「祭壇に浴びせかけた」「祭壇に振り注いだ」「祭壇にまいた」
  rationale: זרקは単なる静かな滴下ではなく、投げかける勢いを含み得る一方、日本語で字義的に「投げつけた」とすると血そのものより物体を投げるような不自然さが生じる。「振りかけた」は動作を明瞭にしつつ、その強さを過度に限定しない。特定の祭儀神学を付加せず、語の幅は脚注で保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「血の半分」の反復は二度目を「残りの半分」として指示関係を自然にした。脚注記号[a]を該当動詞の直後に置いた。
