id: EXO.24.16
reference: Exodus 24:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: ja
  text: ヤハウェの栄光はシナイ山の上にとどまり、雲がその山を六日間覆った[a]。七日目に、ヤハウェは雲のただ中から[b]モーセを呼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雲がヤハウェの栄光を覆った」とも訳せる。原文の「それを」に当たる接尾辞は、「シナイ山」と「ヤハウェの栄光」のどちらを指すとも取り得る。
    reason: alternative_reading
  - marker: b
    text: または「雲の中から」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: とどまり
  rationale: שׁכן が表す、ある場所に落ち着いて存在するという具体的な意味を保ちつつ、現代日本語として自然で荘重な表現とした。
- source_word: כְּבוֹד יְהוָה
  choice: ヤハウェの栄光
  rationale: כָּבוֹד を神の顕現する威光と臨在を示す「栄光」とし、連語関係を自然な日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で一般的な形に音写した。
- source_word: עַל הַר סִינַי
  choice: シナイ山の上に
  rationale: 山を顕現の場所として示す עַל の空間的意味を明確に表した。
- source_word: וַיְכַסֵּהוּ
  choice: その山を……覆った
  rationale: 三人称男性単数接尾辞の指示対象として、文脈上もっとも自然な「シナイ山」を本文に採用した。ただし「栄光」を指す可能性は脚注に残した。
- source_word: הֶעָנָן
  choice: 雲
  rationale: シナイでの神の顕現に伴う、文脈上既知の雲を指す。日本語ではこの箇所で「その雲」とせずとも特定性が自然に伝わる。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日間
  rationale: 期間を示すヘブライ語の時間対格を、自然な日本語の期間表現で訳した。
- source_word: וַיִּקְרָא אֶל מֹשֶׁה
  choice: ヤハウェは……モーセを呼んだ
  rationale: קרא אל を自然な日本語で表した。主語は原文では明示されないが、物語の流れからヤハウェと理解した。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 七日目に
  rationale: 定冠詞を伴う序数表現を、簡潔で自然な日本語の時の表現にした。
- source_word: מִתּוֹךְ הֶעָנָן
  choice: 雲のただ中から
  rationale: מִתּוֹךְ が示す内部・中央からという空間感覚を保つため、「ただ中から」とした。
theological_decisions:
- issue: 「呼んだ」の主語
  choice: ヤハウェ
  alternative: 「ヤハウェの栄光」を換喩的な主語として理解する
  rationale: 直前にはヤハウェの栄光が述べられるが、シナイ顕現の物語全体ではモーセを呼ぶ方はヤハウェご自身である。日本語では主語の混乱を避けるため、ヤハウェを明示した。
- issue: וַיְכַסֵּהוּ の目的語接尾辞が指すもの
  choice: シナイ山
  alternative: ヤハウェの栄光
  rationale: 文法上はいずれも男性単数であり得るが、場面描写と文脈からは雲が山を覆ったと読むのが自然である。別解は genuine な曖昧さとして脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神名は「ヤハウェ」とした。「とどまり」「ただ中」など、読みやすさを保ちながら顕現場面にふさわしい落ち着いた荘重さのある語を選んだ。脚注記号は、それぞれが説明する語句の直後に配置した。
