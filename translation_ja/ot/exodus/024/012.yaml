  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: ja
  text: ヤハウェはモーセに言われた。「山に登って、わたしのもとに来なさい。そこにとどまりなさい。わたしはあなたに、石の板と、律法[a]と戒め[b]を与える。これらは、彼らを教えるために、わたしが書いたものである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法」は「教え」または「教示」とも訳せる。ヘブライ語トーラーは、法規だけでなく、広く教えを意味することがある。
    reason: lexical_alternative
  - marker: b
    text: 「律法と戒め」は、石の板とともに与えられる契約上の教えを指すとも、石の板に書かれた内容をさらに説明する表現とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: 山のわたしのもとへ登って来て
  rationale: עלהの上方への移動、אֵלַיの「わたしのもとへ」、方向を表すהָהָרָהを、自然な日本語の一続きの命令として表した。
- source_word: וֶהְיֵה שָׁם
  choice: そこにとどまりなさい
  rationale: 直訳的な「そこにいなさい」よりも、文脈上の継続的滞在を明瞭に表す。
- source_word: וְאֶתְּנָה לְךָ
  choice: わたしはあなたに…与える
  rationale: 命令に続く一人称の意志・約束として自然に訳した。
- source_word: לֻחֹת הָאֶבֶן
  choice: 石の板
  rationale: 素材を明示しつつ、契約の文字が記される平板を簡潔な現代日本語で表した。
- source_word: וְהַתּוֹרָה
  choice: 律法
  rationale: シナイ契約の文脈で認知度の高い訳語を用い、語の持つ「教え・教示」の幅は脚注に残した。
- source_word: וְהַמִּצְוָה
  choice: 戒め
  rationale: ヘブライ語の単数形を保ち、日本語聖書語彙として自然で理解しやすい表現を選んだ。
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: わたしが書いたものである
  rationale: 完了した神の執筆行為を明示し、関係節を自然な日本語にした。
- source_word: לְהוֹרֹתָם
  choice: 彼らに教えるために
  rationale: ירהのヒフィル形が表す「教える・教示する」と、目的を示す不定詞を保った。三人称複数接尾辞は「彼ら」とした。
theological_decisions:
- issue: 「律法と戒め」と「石の板」との関係
  choice: 三つの名詞句を「石の板と、律法と戒め」と並列のまま訳し、両者の関係を本文で限定しない。
  alternative: 「律法と戒め」を石の板の内容を説明する同格表現とみなす、または全体を十戒だけを指す一まとまりの表現とみなす。
  rationale: ヘブライ語は接続された名詞を並べており、それらが別個の授与物なのか、石の板をさらに説明するものなのかを文法だけで確定できないため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、神の発言にふさわしい簡潔で品位ある文体とした。「言われた」「とどまりなさい」「ものである」により過度に口語化せず、一般読者にも理解しやすい調子を保った。
