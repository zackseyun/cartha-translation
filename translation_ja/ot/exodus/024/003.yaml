  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: ja
  text: モーセは民のもとに来て、民にヤハウェのすべてのことばと、すべての定め[a]を告げた。すると民は皆、声を一つにして答えた。「ヤハウェが語られたすべてのことばを、私たちは行います。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定め」は、法的な「裁定」または「規定」とも訳せる。ヘブライ語ミシュパティーム。
    reason: 原語が持つ法的裁定と契約上の規定という意味範囲を示すため。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 戻って来て
  rationale: בוא の基本義「来る」を保ちつつ、直前にモーセが民のもとへ下った文脈を自然な日本語で示す。
- source_word: וַיְסַפֵּר
  choice: 告げた
  rationale: ピエル形の「詳しく語る、告げる」に対応し、公に伝達する場面にふさわしい自然で簡潔な表現。
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: ヤハウェのすべてのことば
  rationale: דברים を一般化せず「ことば」とし、後半の כָּל הַדְּבָרִים との語の連関も保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号へ置き換えず、本文に記された神の固有名を日本語で音写する。
- source_word: הַמִּשְׁפָּטִים
  choice: 定め
  rationale: ここでは契約に伴う法的規定を指すため、「裁き」よりも自然で文脈に適する「定め」とした。法的裁定という原語の含みは脚注で補う。
- source_word: וַיַּעַן כָּל הָעָם קוֹל אֶחָד
  choice: 民は皆、声を一つにして答えた
  rationale: קוֹל אֶחָד の一致した応答を表すヘブライ語の比喩を、明瞭で自然な日本語として保持する。
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェが語られたことはすべて
  rationale: 前半の「ことば」との意味的連関を保ちながら、日本語の発話として不自然な重複を避ける。神への敬意を示すため「語られた」とした。
- source_word: נַעֲשֶׂה
  choice: 私たちは行います
  rationale: עשה の直接的な意味「行う」を保持し、「従う」と解釈的に言い換えない。意志を示す未完了形を丁寧な宣言として表す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を明記しているため、それを称号に置換せず音写し、契約の神の名としての性格を保持する。
- issue: נַעֲשֶׂה の契約的意味
  choice: 私たちは行います
  alternative: 私たちは従います
  rationale: 服従は文脈上含意されるが、原語の「行う」という表現を保ち、解釈を本文へ過度に織り込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、契約締結場面にふさわしい簡潔で品位ある調子とした。民の応答は集団の一致と厳粛な意志表明が伝わるようにした。
