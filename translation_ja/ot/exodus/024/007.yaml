  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: ja
  text: それから彼は契約の書を取り、民に聞こえるように読み上げた。民は言った。「ヤハウェが語られたことはすべて、私たちは行い、耳を傾けます[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聞き従います」または「従います」とも訳せる。ヘブライ語の動詞は「聞く、耳を傾ける」という意味のほか、契約の文脈では「従う」という意味にもなる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: それから彼は……取り
  rationale: 物語を順に進める接続形の働きを、自然な日本語の「それから」で表した。主語は原文どおり固有名を補わず「彼」とした。
- source_word: סֵפֶר הַבְּרִית
  choice: 契約の書
  rationale: 書き記された具体的な契約文書を指す表現として、簡潔で伝統的かつ明瞭な訳語を採用した。
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: 民に聞こえるように読み上げた
  rationale: 書かれた文書を声に出して民の前で読むという意味を、ヘブライ語の「民の耳に」という聴覚的な含みを保ちながら自然な現代日本語で表した。
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: ヤハウェが語られたことはすべて
  rationale: כֹּל אֲשֶׁר の包括性を「ことはすべて」で保ち、神名 יהוה は称号に置き換えず「ヤハウェ」とした。
- source_word: נַעֲשֶׂה
  choice: 私たちは行い
  rationale: עשה の広く具体的な意味を保ち、「従う」と解釈し切らず「行う」と訳した。
- source_word: וְנִשְׁמָע
  choice: 耳を傾けます
  rationale: שׁמע の基本的な聴覚の意味と、進んで受け入れる含みを日本語で保った。契約上の「従う」という意味もあり得るため脚注で示した。
theological_decisions:
- issue: 契約への応答 וְנִשְׁמָע の訳し方
  choice: 耳を傾けます
  alternative: 聞き従います／従います
  rationale: שׁמע は「聞く、耳を傾ける」と「従う」の双方を表し得る。直前に契約の書が読み上げられたため聴覚的意味を本文に残しつつ、契約的服従の意味を脚注で明示して、原文の含意を一方に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、契約の場面にふさわしい簡潔で荘重な調子を保った。「民に聞こえるように読み上げた」は古風な直訳を避けつつ、公開朗読の情景を伝える表現である。
