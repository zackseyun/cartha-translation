  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: ja
  text: 彼らはイスラエルの神を見た。その足もとには、サファイア[a]の敷石の細工[b]のようなものがあり、澄みきった大空そのもののようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ラピスラズリ」とも考えられる。古代におけるヘブライ語「サッピール」の鉱物学的な同定は確かではない。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「サファイアの敷石の細工のようなもの」。神の足もとに、れんがやタイルを敷いたような加工面があるという像。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 彼らは……見た
  rationale: ראהのQal連続形を、視覚による知覚を明言する自然な現代日本語で訳した。本文の強い叙述を「仰ぎ見た」などで弱めない。
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: イスラエルの神を
  rationale: 目的語標識を伴う連語をそのまま目的語として示し、見た対象がイスラエルの神であることを明確に保った。
- source_word: וְתַחַת רַגְלָיו
  choice: その足もとには
  rationale: תַחַתは「下に」を表す。「足もと」は日本語として自然であり、三人称男性単数接尾辞と擬人的な幻の描写を保つ。
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: 敷石細工のようなもの
  rationale: מַעֲשֶׂהの「作り、細工」とלִבְנָהのれんが・敷石状の面という像を合わせ、足の下に広がる加工された面として表した。比較のכְּは「ようなもの」で保持した。
- source_word: הַסַּפִּיר
  choice: サファイア
  rationale: 伝統的な対応語を本文に採用したが、古代の鉱物名としてはラピスラズリの可能性もあるため注記した。
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: 大空そのもののよう
  rationale: עֶצֶםをここでは強意表現と捉え、「大空そのもの」とした。「骨」などの字義訳は文脈に合わない。
- source_word: לָטֹהַר
  choice: 澄みきった
  rationale: טֹהַרの清浄・透明・明澄の意味を、視覚的な描写として自然な「澄みきった」で表した。
theological_decisions:
- issue: 神を見ることと身体的表現
  choice: 「イスラエルの神を見た」「その足もと」と直接的に訳す
  alternative: 「イスラエルの神の現れを見た」「神が立つ場所を見た」
  rationale: ヘブライ語本文は、彼らが神を見たと明言し、その足の下にあるものを描く。「現れ」などの説明語を補わず、神を見ることをめぐる聖書内の緊張と擬人的表現をそのまま残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「見た」と「足もと」を率直に用い、神の幻をめぐる本文の緊張を解説的に処理しない。「大空」は視覚的で理解しやすく、「澄みきった」と組み合わせてטֹהַרの明澄さを表した。
