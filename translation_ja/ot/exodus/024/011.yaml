reference: Exodus 24:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: ja
  text: しかし、神はイスラエルの人々の有力者たちに手を出して危害を加えることはなさらなかった。彼らは神を見た[a]。そして、食べ、飲んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神を目の当たりにした」。この動詞には、じっと見る、目の当たりにする、という意味合いもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֲצִילֵי בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの高官たちに
  rationale: אֲצִילֵי は共同体の中の有力者・選ばれた代表者を指すため「高官たち」とした。בְּנֵי יִשְׂרָאֵל は原文の家族的表現を保って「イスラエルの子ら」とした。אֶל の敵対的な含みは、日本語では後続の「手を下す」によって自然に表される。
- source_word: לֹא שָׁלַח יָדוֹ
  choice: 手を下されなかった
  rationale: 直訳的な「手を伸ばさなかった」では日本語で意味が不明瞭になりやすい。裁きや危害を加えるという慣用的意味と手の比喩をともに保つため、「手を下す」を用いた。
- source_word: וַיֶּחֱזוּ
  choice: 見た
  rationale: 基本的な意味を明瞭な現代日本語で示した。この動詞にあり得る、じっと見る・目の当たりにするという強いニュアンスは脚注に残した。
- source_word: אֶת הָאֱלֹהִים
  choice: 神を
  rationale: 原文は神との遭遇を直接「神を」と述べているため、「神の現れ」などと説明的に弱めず、そのまま訳した。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: そして、食べ、飲んだ
  rationale: 二つの継起動詞を簡潔に再現し、神を見た後にも食事をしたという原文の際立った叙述を保った。
theological_decisions:
- issue: 「手を下されなかった」の主語
  choice: 神を明示する
  alternative: 日本語でも主語を明示しない
  rationale: ヘブライ語の主語は暗黙だが、文脈上は神が最も自然な指示対象である。日本語で主語を省くと高官たちが主語とも取れかねないため、解釈を過度に加えず明瞭にする目的で「神は」と補った。
- issue: 神を見るという遭遇の表現
  choice: 彼らは神を見た
  alternative: 彼らは神の現れを見た
  rationale: 原文が直接述べる神との遭遇を、他の聖書箇所との調和を図るために弱めたり説明し直したりせず、神を見ることをめぐる神学的緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「高官」は代表者としての地位を簡潔に表し、「手を下す」は原文の手の比喩と危害・裁きの含意を自然な日本語で両立させる。脚注記号[a]は該当箇所に付した。
