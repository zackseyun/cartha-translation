source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: ja
  text: モーセだけがヤハウェ[a]に近づかなければならない。ほかの者たちは近づいてはならず、民も彼とともに上ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の神名יהוה（YHWH）。伝統的に「主」と訳すこともある。
    reason: 神名の音写と伝統的な代替訳を示すため。
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: 近づかなければならない
  rationale: נגשׁの「近づく」を保ちつつ、この文脈で未完了形が持つ命令・指示の力を明確な現代日本語で表した。
- source_word: מֹשֶׁה לְבַדּוֹ
  choice: モーセだけが
  rationale: לְבַדּוֹが示す排他性、すなわち近づくことを許されるのはモーセのみであることを自然に表す。
- source_word: אֶל יְהוָה
  choice: ヤハウェに
  rationale: 前置詞אֶלの方向性を助詞「に」で示し、神名יהוהは固有名として「ヤハウェ」と音写した。
- source_word: וְהֵם
  choice: ほかの者たちは
  rationale: 直訳は「彼ら」だが、直前の文脈に登場するモーセ以外の者たちを指すことが日本語で明瞭になるよう補った。新たな集団名は加えていない。
- source_word: לֹא יִגָּשׁוּ
  choice: 近づいてはならず
  rationale: 前半と同じ語根נגשׁを同じ「近づく」で訳し、モーセとの対照を保った。
- source_word: וְהָעָם
  choice: 民も
  rationale: עםを簡潔に「民」とし、原文にない「イスラエルの」は補わなかった。接続詞は文脈上の追加・並列を「も」で自然に示した。
- source_word: לֹא יַעֲלוּ
  choice: 上ってはならない
  rationale: עלהが表す山への上方移動と、否定命令の力を保った。
- source_word: עִמּוֹ
  choice: 彼と一緒に
  rationale: 代名詞はモーセを指す。「一緒に」により同行の意味を自然な日本語で示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は普通名詞や称号ではなく四文字神名を明記しているため、固有名として音写した。日本語で伝統的な「主」とする選択肢もあるため、注で示した。
- issue: 近づく者の区別
  choice: モーセだけが近づき、ほかの者たちと民には禁じられる
  alternative: 「彼ら」の具体的な身分を本文中で明示する
  rationale: 前節を踏まえれば「彼ら」の指示対象は理解できるが、本節自体は名称を繰り返さない。そのため、祭司・長老などの身分を本文へ補わず、原文の指示関係を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三つの指示を二文に分け、命令的な未完了形は「なければならない／てはならない」で統一した。
