id: EXO.24.4
reference: Exodus 24:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: ja
  text: モーセはヤハウェのすべての言葉を書き記した。そして朝早く起き、山のふもと[a]に祭壇を築き、イスラエルの十二部族のために十二本の石柱[b]を立てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「山の下」。ここでは山のふもとを指す。
    reason: lexical_alternative
  - marker: b
    text: 「十二個の立石」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 書き記した
  rationale: כתבの基本義「書く」を保ちつつ、語られた内容を文字にしたことを自然な日本語で表す。
- source_word: דִּבְרֵי
  choice: 言葉
  rationale: 文脈上、直前に告げられた契約の規定を指すが、「命令」と限定せず、דברの直接的な意味と広がりを保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な学術的音写により示す。
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 朝早く起き
  rationale: שׁכםのヒフィル形が表す「早く起きる」と、בבקרの「朝に」の両方を簡潔に反映する。
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: 祭壇を築き
  rationale: בנהとמזבחを、意味にも日本語の慣用にも忠実に訳す。
- source_word: תַּחַת הָהָר
  choice: 山のふもと
  rationale: 字義的には「山の下」だが、この空間表現は山麓を指すため、誤解のない自然な日本語とする。
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: 十二本の石柱を立てた
  rationale: מַצֵּבָהは立てられた石または柱を表す。「石柱」として材質と形を示し、ヘブライ語で省略された動作を日本語では「立てた」と明示する。
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: イスラエルの十二部族のために
  rationale: לが示す対応・代表関係を過度に説明せず、「ために」で自然に表す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、その固有名としての性格を保つ。
- issue: 十二本の石柱と部族との関係
  choice: 十二部族のために
  alternative: 十二部族を表すものとして
  rationale: 前置詞לは対応または代表を示し得るが、本文はその象徴性を詳説していないため、解釈を狭めない表現を採る。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「書き記した」「祭壇を築く」は聖書本文として自然でありながら古語的になりすぎない表現とした。英語相談層では脚注記号と内容の対応にずれが見られるため、原文上の該当語に従い、[a]を「山のふもと」、[b]を「石柱」に付した。
