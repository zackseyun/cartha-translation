source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: ja
  text: 彼はイスラエルの子らの若者たちを遣わした。彼らは全焼の献げ物をささげ、雄牛をヤハウェに平安のいけにえ[a]としてささげた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「交わりのいけにえ」または「健全さのためのいけにえ」。
    reason: שְׁלָמִים は平安・無事・健全さに関係する祭儀名であり、日本語の一語ではその意味範囲を尽くしにくい。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 彼は……遣わした
  rationale: 物語を進める連続形を自然な現代日本語で表した。主語は原文どおり代名詞にとどめ、文脈上の人物名を本文に補わなかった。
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: イスラエル人の若者たち
  rationale: נַעַר の男性複数を「若者たち」で表し、בְּנֵי יִשְׂרָאֵל は日本語で自然な民族呼称「イスラエル人」とした。
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: 焼き尽くす献げ物を献げ
  rationale: עֹלָה が全体を祭壇で焼く献げ物であることを分かりやすく示し、עלהとの語の結びつきは自然な祭儀表現「献げる」で訳した。
- source_word: וַיִּזְבְּחוּ
  choice: 屠った
  rationale: זבח がここで祭儀的に動物を屠る行為を指すことを明示し、「献げる」の重複も避けた。
- source_word: זְבָחִים שְׁלָמִים
  choice: 交わりのいけにえ
  rationale: 神との平安や会食的交わりに関わる祭儀区分として訳した。ただし שְׁלָמִים の含意は一語に限定しにくいため、別訳を脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞 לְ の方向・受益関係を「への」で表し、固有の神名 יהוה は称号に置き換えず「ヤハウェ」と音写した。
- source_word: פָּרִים
  choice: 雄牛を
  rationale: 祭儀に用いられた動物が雄牛であることを明示し、動詞「屠った」の直接目的語として自然に配置した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の契約名を用いているため、称号「主」に置き換えず、一般的な学術的再構音に基づく「ヤハウェ」とした。
- issue: זְבָחִים שְׁלָמִים の意味範囲
  choice: 交わりのいけにえ
  alternative: 平安のいけにえ／和解のいけにえ
  rationale: この祭儀名には平安、健全さ、神との交わりなどが関わり得る。「交わり」を本文に採用したが、語義を教理的な「和解」だけに限定せず、別訳を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、祭儀用語には荘重さを保った。「焼き尽くす献げ物」は意味が直感的に伝わる表現とし、「屠った」によって実際の祭儀行為を具体的に示した。
