  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: ja
  text: ヤハウェの栄光の現れは、イスラエルの子ら[b]の目には、山の頂にある焼き尽くす火[a]のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食い尽くす火」。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの子ら」は、「イスラエルの民」または「イスラエル人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: 現れ
  rationale: 目に見える姿・様相を表す語であり、預言的な「幻」を意味すると限定せず、神の栄光が視覚的に示されたことを自然に表す。
- source_word: כְּבוֹד
  choice: 栄光
  rationale: ここではヤハウェの目に見える輝かしい臨在を指し、文脈と聖書用語として最も適切である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を日本語で音写した。
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: 焼き尽くす火のよう
  rationale: כְּ の明示的な比喩を「よう」で保ち、אֹכֶלֶת が火について表す、物を食い尽くすような激しい作用を自然な日本語で示した。
- source_word: בְּרֹאשׁ הָהָר
  choice: 山の頂にある
  rationale: 山の最上部に位置することを明確かつ自然に表す。
- source_word: לְעֵינֵי
  choice: 目には
  rationale: 直訳的な「目の前で」の視覚的強調を保ちながら、日本語の文として自然にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の「子ら」という契約共同体の呼称を保つ。ここでは成人男性だけに限定せず、イスラエルに属する人々を指す表現として理解できる。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を明記しているため、称号へ置き換えず音写し、契約の神の名を保持した。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的・性別的含意
  choice: イスラエルの子ら
  alternative: イスラエルの民、イスラエル人
  rationale: 原文の男性複数形と「子ら」という系譜的・契約的表現を見える形で残した。ただし文脈上、男性だけを指すと断定せず、共同体全体を指し得る曖昧さを注で示した。
- issue: 栄光と火の関係
  choice: 栄光の現れは……火のようであった
  alternative: 栄光そのものが火であった
  rationale: 原文は כְּ による比較であり、ヤハウェの栄光を火そのものと同一視せず、見え方が焼き尽くす火に似ていたという比喩を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「焼き尽くす火」で原語の強さを保ち、「現れ」と「目には」によって節全体の視覚的性格を明確にした。
