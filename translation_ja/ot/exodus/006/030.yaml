source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: ja
  text: そこで、モーセは主の前で言った。「ご承知のとおり、私は唇に割礼を受けていない者です[a]。どうしてファラオが私の言うことを聞くでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳。「唇に割礼を受けていない」は、話しにくさ、または話す資格・適性の欠如を表す比喩と考えられる。
    reason: 原文の特徴的で解釈の難しい比喩を本文に保ちつつ、その可能な意味を限定しすぎずに示すため。
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: 主の前で
  rationale: לִפְנֵי（「〜の前で」）を明示し、神名 יהוה は日本語聖書で広く通用する「主」とした。
- source_word: הֵן
  choice: ご覧ください
  rationale: 注意を促す間投詞の力を保ちつつ、神に向けた発言として自然で丁重な表現にした。
- source_word: עֲרַל שְׂפָתַיִם
  choice: 唇に割礼のない者
  rationale: 直訳的な身体比喩を保持し、その解釈を本文で一義的に「口下手」と断定しないことで、原文の強い表現と曖昧さを残した。
- source_word: יִשְׁמַע אֵלַי
  choice: 私の言うことを聞く
  rationale: 単なる音声知覚ではなく、モーセの訴えを聞き入れるという文脈上の意味を自然な日本語で表した。
theological_decisions:
- issue: 「唇に割礼がない」という比喩の解釈
  choice: 比喩を本文に残し、脚注で可能な意味を示す
  alternative: 「私は口下手です」と解釈して本文に置く
  rationale: この句は発話能力や語る資格・適性の欠如を表すと考えられるが、比喩そのものが持つ契約的・儀礼的な響きを一つの説明に還元しないため。
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語で広く認知された敬虔な表記を用い、特定の発音再構成を本文で確定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神への発言には「ご覧ください」を用いて丁重さを保った。「唇に割礼のない者」という異質感のある比喩は、原文の神学的・修辞的な緊張を尊重して維持した。
