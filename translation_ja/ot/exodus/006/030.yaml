revisions:
- from: しかし、モーセは主の前で言った。「ご覧ください。私は唇に割礼のない者です[a]。どうしてファラオが私の言うことを聞くでしょうか。」
  to: そこで、モーセは主の前で言った。「ご承知のとおり、私は唇に割礼を受けていない者です[a]。どうしてファラオが私の言うことを聞くでしょうか。」
  rationale: 原文の וְ に対して不必要な逆接を避け、「そこで」とした。比喩は保持したまま、「割礼を受けていない者」として自然な日本語に整えた。強調の הֵן は、神への発言として自然な「ご承知のとおり」で表し、脚注は解釈の幅を保つように修正した。
  reviewer_model: gpt-5.6-terra
