source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: ja
  text: 「行って、エジプトの王ファラオに、イスラエルの子ら[a]を彼の国から送り出すように言いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの民」または「イスラエル人」とも訳せる。ヘブライ語では字義どおりには「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: 行って
  rationale: 命令形。話者のもとへ「来る」ではなく、モーセがファラオのもとへ赴く文脈なので、現代日本語では「行って」が自然である。
- source_word: דַבֵּר אֶל
  choice: ～に……言いなさい
  rationale: 直訳的には「～に語れ」だが、後続する要求内容と自然につながる日本語として「～するように言いなさい」とした。命令の直接性は保たれている。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: エジプトの王ファラオ
  rationale: 同格関係を明確で簡潔な日本語にした。
- source_word: וִישַׁלַּח
  choice: 送り出すように
  rationale: 命令に続く接続法的な動詞で、ファラオに求める行為または意図された結果を表す。「解放する」よりも原語の שלח の移動・派遣の語感を保ち、出エジプトの文脈に合う。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの家族的・系譜的表現を保持した。「イスラエルの民」も文脈上正しいため脚注に示す。
- source_word: מֵאַרְצוֹ
  choice: その国から
  rationale: 接尾辞はファラオを指すが、日本語で「彼の国」とすると所有の響きが強いため、統治領を自然に示す「その国」とした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 民族集団を指す慣用表現だが、原文の系譜的な言い方を本文に残した。特定の教派的解釈は含まない。
- issue: וִישַׁלַּח の統語的な力
  choice: 送り出すように言いなさい
  alternative: そうすれば彼は送り出すだろう
  rationale: 命令に続く形を、単なる未来予告ではなく、ファラオに伝えるべき要求内容として解した。ただし目的・結果の含みを過度に細分化していない。
translation_notes:
  register: 簡潔で威厳のある現代標準語。神の命令としての直接性を「行って」「言いなさい」で保ちつつ、不自然な逐語訳を避けた。
