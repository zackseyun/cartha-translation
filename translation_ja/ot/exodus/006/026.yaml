source:
  edition: WLC
  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: ja
  text: このアロンとモーセこそ[a]、ヤハウェから「イスラエルの子ら[b]を、その部隊ごとに[c]エジプトの地から導き出せ」と言われた者たちである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この二人がアロンとモーセである」。原文は、直前に挙げられた二人を指し示して同定する表現。
    reason: lexical_alternative
  - marker: b
    text: 文脈的には「イスラエル人」。原文は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「その集団ごとに」「その軍勢ごとに」。原語は、軍隊を含む、組織された集団を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: このアロンとモーセこそ
  rationale: 独立代名詞 הוּא が、直前の系図に挙げられた二人を指し示して強調する同定表現であることを、自然な日本語の「この…こそ」で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず一般的な日本語表記で音写した。
- source_word: הוֹצִיאוּ
  choice: 導き出せ
  rationale: יצא のヒフィル複数命令形が持つ「外へ出させる」という使役の意味を保ちつつ、民を率いて出す文脈に合う自然な表現とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族表現を保った。文脈上はイスラエル民族全体を指すため、別訳を脚注に示した。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 起点を表す前置詞と「地」を明示する原文の形を簡潔な日本語で保持した。
- source_word: עַל צִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָא が表す、秩序立って編成された集団という意味を示しつつ、軍勢をも連想させる語感を残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく神の固有名を用いているため、その区別を保った。
- issue: בְּנֵי יִשְׂרָאֵל の範囲
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の家族的表現を本文に残しつつ、民族全体を指す文脈的意味は脚注で明らかにした。
- issue: עַל צִבְאֹתָם の組織的・軍事的含意
  choice: その部隊ごとに
  alternative: その集団ごとに
  rationale: 軍事的な意味だけに限定せず、組織された一団ごとの出発という意味を表した。「軍勢」と断定して原文の意味幅を狭めることは避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、系図を受けた厳かな同定文として「こそ」「者たちである」を用いた。命令は簡潔な「導き出せ」とし、原文の直接性を保った。
