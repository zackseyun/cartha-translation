base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: ja
  text: わたしはあなたがたをわたしの民とし、あなたがたの神となる。あなたがたは、わたしが、あなたがたの神、ヤハウェであり、あなたがたをエジプトの重荷[b]の下から連れ出す者[a]であることを知るようになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「連れ出した者」。ヘブライ語は分詞であり、ヤハウェを救出する方として特徴づけるとも、成就した救出を指すとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「重荷」は「苦役」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: あなたがたをわたしの民とし
  rationale: 直訳的な「わたしのために民として取る」は不自然なため、所属と契約関係を簡潔に表す現代日本語とした。
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: あなたがたの神となる
  rationale: 定型的な契約表現を自然な日本語で示す。「神である」より、約束の連続における将来的な関係の成立を明確に表す。
- source_word: וִידַעְתֶּם
  choice: 知るようになる
  rationale: 単なる知識だけでなく、救出を通して認識するという含みを保ちつつ、未来の結果を自然に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を音写した。
- source_word: הַמּוֹצִיא
  choice: 連れ出す者
  rationale: 定冠詞付き分詞の継続的・特徴的な響きを日本語の非過去形で保った。文脈上、完了した救出を回顧する「連れ出した者」も可能なので注記した。
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: エジプトの重荷の下から
  rationale: 抑圧の下にあるという空間的比喩を保った。「重荷」は荷役と苦役の両方を含み得る。
theological_decisions:
- issue: 契約定式の訳し方
  choice: 「わたしの民とし、あなたがたの神となる」
  alternative: 「わたしの民として取り、あなたがたにとって神となる」
  rationale: 所有と相互的な契約関係を自然に示しながら、後代の神学体系を訳文に持ち込まないため。
- issue: 神名の表記
  choice: 「ヤハウェ」
  alternative: 「主」または「エホバ」
  rationale: 本文に固有名יהוהがあるため、称号へ置換せず音写した。
- issue: הַמּוֹצִיאの時間的含意
  choice: 「連れ出す者」
  alternative: 「連れ出した者」
  rationale: ヘブライ語分詞の特徴的・進行的な力を本文に残し、未来の約束が成就した時点からの回顧という読みも脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神の直接話法として「わたし」を用い、契約定式の簡潔さと反復を保った。
