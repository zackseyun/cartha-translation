  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: ja
  text: ヤハウェはモーセとアロンに語り、イスラエルの子らとエジプトの王ファラオについて、イスラエルの子らをエジプトの地から連れ出すよう、二人に命じた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子らとエジプトの王ファラオに対して、二人に命じた」とも訳せる。ヘブライ語の前置詞は、命令が関わる相手を示すとも、命令の受け手を示すとも解される。
    reason: 前置詞 אֶל の統語的な別解を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語り
  rationale: ワウ継続法による物語の進行は日本語の文脈で自然に示されるため、機械的に「そして」を加えず、連用形で次の動作につないだ。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した敬虔な代替表記を用いた。固有名の形については脚注で明示した。
- source_word: וַיְצַוֵּם
  choice: 二人に命じられた
  rationale: צוהの権威ある命令の力を保ち、接尾代名詞がモーセとアロンを指すことを「二人」で明確にした。主語への敬意を表すため主体敬語を用いた。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: イスラエルの子らとエジプトの王ファラオについて
  rationale: צוהに続く אֶל は命令の直接の受け手とも、命令が関わる相手とも解し得る。文脈上、命じられた者はモーセとアロンなので、本文では後者を採った。
- source_word: לְהוֹצִיא
  choice: 連れ出すよう
  rationale: יצאのヒフィル不定詞の使役的意味「出させる」を、出エジプトの文脈に即した自然な日本語で表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 民族名として自然な「イスラエル人」も可能だが、原文の家族的・民族的表現を透明に保った。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: אֶרֶץ の具体的な地理表現を省略せず保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 明瞭で品位ある現代日本語として定着した「主」を本文に置き、原文が神の固有名であることを脚注で透明に示した。
- issue: 命令に続く二つの אֶל の解釈
  choice: イスラエルとファラオについての命令
  alternative: イスラエルとファラオに対する命令
  rationale: 統語上はどちらも可能だが、直前の複数目的語接尾辞がモーセとアロンを命令の受け手として示すため、本文では関係・対象を示す読みを採用し、別解を脚注に残した。
- issue: בְּנֵי יִשְׂרָאֵל の訳
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 集合的な民族呼称でありながら、「子ら」という原文の形を保持して神学的・文学的含意を狭めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「命じられた」で神の権威と文章の品位を保った。「イスラエルの子ら」は意図的に原文寄りの表現とし、全体は朗読にも適する簡潔な一文とした。
