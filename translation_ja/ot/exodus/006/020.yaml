  text: וַ/יִּקַּ֨ח עַמְרָ֜ם אֶת יוֹכֶ֤בֶד דֹּֽדָת/וֹ֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶֽת אַהֲרֹ֖ן וְ/אֶת מֹשֶׁ֑ה וּ/שְׁנֵי֙ חַיֵּ֣י עַמְרָ֔ם שֶׁ֧בַע וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: ja
  text: アムラムは、おば[a]のヨケベドを妻に迎えた。彼女は彼にアロンとモーセを産んだ。アムラムの生涯は百三十七年であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より限定して「父の姉妹」とも訳せる。
    reason: 親族語 דֹּדָתוֹ は「おば」を指し、この文脈では父方の姉妹と解することができるため。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 妻に迎えた
  rationale: 字義は「取った」だが、婚姻の文脈では「妻に迎えた」がヘブライ語の構文を自然で品位ある現代日本語にする。
- source_word: דֹּדָתוֹ
  choice: おば
  rationale: 女性の近親者を指す語で、ここでは簡潔な「おば」とした。父方の姉妹と特定する理解もあり得るため、脚注で示した。
- source_word: לְאִשָּׁה
  choice: 妻に
  rationale: 婚姻関係を表す句であり、「妻に迎えた」の一部として自然に訳した。
- source_word: וַתֵּלֶד לוֹ
  choice: 彼女は彼に…を産んだ
  rationale: לוֹの間接目的語を保ちつつ、系譜記事にふさわしい簡潔な表現とした。
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: アムラムの生涯
  rationale: 直訳的には「アムラムの生涯の年々」だが、寿命を述べる自然な日本語として「生涯」とした。
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 百三十七年
  rationale: ヘブライ語の数値を正確に、現代日本語の通常の数詞順で示した。
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: アムラム／ヨケベド／アロン／モーセ
  rationale: 日本語聖書で広く通用する人名表記を採用した。
theological_decisions:
- issue: 後の律法で禁じられる近親婚を述べる親族語の訳し方
  choice: おば
  alternative: 父の姉妹
  rationale: 本文は系譜上の事実を道徳的評価なしに記しているため、関係を弱めも強めもせず、原語の一般的な親族呼称を本文に置いた。より限定的な理解は脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用い、系譜記事にふさわしい簡潔で落ち着いた文体とした。「妻に迎えた」「生涯」は字義と自然さの均衡を図った表現である。
