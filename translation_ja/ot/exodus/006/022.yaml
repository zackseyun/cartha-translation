  text: 'And the sons of Uzziel: Mishael[a], Elzaphan[b], and Sithri.'
translation:
  language: ja
  text: また、ウジエルの息子たちは、ミシャエル、エルツァファン、シトリである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: の子らは
  rationale: 系図の列挙を自然な現代日本語で示した。接続詞וּは前後の連続性を担うが、日本語では文脈上明らかなため独立した「また」を置かず、主題提示の「は」で滑らかにつないだ。בְנֵיは男性複数の系図表現なので「子ら」とした。
- source_word: עֻזִּיאֵל
  choice: ウジエル
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な形に音写した。
- source_word: מִישָׁאֵל
  choice: ミシャエル
  rationale: ヘブライ語の人名を音写した。
- source_word: וְ/אֶלְצָפָן
  choice: エルツァファン
  rationale: 人名אֶלְצָפָןを原語の子音と母音に即して音写した。接続詞וְは日本語の列挙形式によって表した。
- source_word: וְ/סִתְרִי
  choice: シトリ
  rationale: 人名סִתְרִיを原語に即して音写した。接続詞וְは読点と「である」による日本語の列挙形式で表した。
