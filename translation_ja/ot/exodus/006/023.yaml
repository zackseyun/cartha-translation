  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן אֶת אֱלִישֶׁ֧בַע בַּת עַמִּינָדָ֛ב אֲח֥וֹת נַחְשׁ֖וֹן ל֣/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֣לֶד ל֗/וֹ אֶת נָדָב֙ וְ/אֶת אֲבִיה֔וּא אֶת אֶלְעָזָ֖ר וְ/אֶת אִֽיתָמָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: ja
  text: アロンは、アミナダブの娘でナフションの姉妹であるエリシェバを妻に迎えた。彼女はアロンに、ナダブ、アビフ、エルアザル、イタマルを産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 妻に迎えた
  rationale: לקחの基本義は「取る」だが、לְאִשָּׁה（妻として）を伴う婚姻表現なので、現代日本語で自然かつ明確な「妻に迎えた」とした。
- source_word: אֱלִישֶׁבַע
  choice: エリシェバ
  rationale: ヘブライ語の語形に即して固有名を音写した。
- source_word: בַּת עַמִּינָדָב
  choice: アミナダブの娘
  rationale: 構成形による直接の親子関係を、簡潔で自然な日本語にした。
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: ナフションの姉妹
  rationale: 原文は姉か妹かを特定しないため、曖昧さを保つ「姉妹」とした。
- source_word: וַתֵּלֶד לוֹ
  choice: 彼女はアロンに……を産んだ
  rationale: ילדと間接目的語לוֹの関係を保持しつつ、日本語で誰に対して子を産んだのか明確になるよう代名詞ではなく「アロン」を補った。
- source_word: נָדָב וְאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: ナダブ、アビフ、エルアザル、イタマル
  rationale: 四人の固有名をヘブライ語の発音に沿って音写した。
theological_decisions: []
