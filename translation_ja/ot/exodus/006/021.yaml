lexical_decisions:
- source_word: וּ/בְנֵי
  choice: の子らは
  rationale: בְּנֵיは「子」の構文形複数であり、ここでは直系の三人を挙げる系図なので「子ら」とした。接続詞וּは、独立した日本語の節として不自然にならないよう、列挙を示す主題提示「は」によって文脈上のつながりを表した。
- source_word: יִצְהָר
  choice: イツハル
  rationale: ヘブライ語の固有名יִצְהָרを、日本語で原音に比較的近い形に音写した。
- source_word: קֹרַח
  choice: コラ
  rationale: ヘブライ語の固有名קֹרַחを、日本語で読みやすく音写した。語末の喉音は日本語表記では通常明示しない。
- source_word: וָ/נֶפֶג
  choice: ネフェグ
  rationale: ヘブライ語の固有名נֶפֶגを音写した。前置された接続詞וは、日本語の名列では読点と末尾の「、」による並列構造で自然に表した。
- source_word: וְ/זִכְרִי
  choice: ジクリ
  rationale: ヘブライ語の固有名זִכְרִיを音写した。接続詞וְは、日本語では最後の項にも接続詞を置かず読点で列挙するのが自然なため、明示しなかった。
