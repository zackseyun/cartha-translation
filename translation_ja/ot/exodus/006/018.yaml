  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: ja
  text: ケハトの子は、アムラム、イツハル、ヘブロン、ウジエル。ケハトが生きた年数は百三十三年であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: ケハトの子は
  rationale: בְנֵי はここでは直後に名を挙げられるケハトの実子を指すため、「子」とした。語頭の接続詞 waw は、系図の項目を自然な日本語で提示するため独立した「そして」とせず、文脈上の連続性に含めた。
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: アムラム、イツハル、ヘブロン、ウジエル
  rationale: 四つの固有名を、ヘブライ語の発音に配慮した日本語の慣用的な聖書名表記で音写した。各 waw は日本語の列挙では読点で自然に表した。
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: ケハトが生きた年月は
  rationale: 直訳的には「ケハトの生涯の年々」。意味を保ちつつ現代日本語として自然で明瞭な「生きた年月」とした。「寿命」は期間を概念化する語なので避け、原文の「年」の要素を残した。
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 百三十三年
  rationale: 原文の数詞は「三と三十と百」の順だが、日本語の通常の数え方に並べ替え、「百三十三年」とした。
theological_decisions: []
translation_notes:
