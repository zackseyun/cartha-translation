revisions:
- from: そこでヤハウェはモーセに言われた。「今に、わたしがファラオに何をするか、あなたは見る。強い手によって、彼は彼らを去らせ、強い手によって、彼らを自分の国から追い出すからである。」[a]
  to: そこでヤハウェはモーセに言われた。「今、あなたは、わたしがファラオに何をするかを見ることになる。強い手によって、彼は彼らを行かせ、強い手によって、彼らを自分の土地から追い出すことになるからである。」[a]
  rationale: 本文は「強い手によって」を二度保ち、その力が誰の手かを確定しない。これにより、ファラオの行為に係るヘブライ語の句の構文上・文脈上の含意を解釈的に固定しない。「行かせる」はשׁלחの文脈上の意味を自然な現代日本語で表し、「追い出す」はגרשのより強い放逐の語感を維持する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:34Z'
review_pass:
  verdict: revise
  source_fidelity: ヘブライ語の語順・反復・将来の予告をおおむね忠実に反映している。「強い手によって」の力の主体を明示しない処理も、原文の曖昧さを保っている。ただし「去らせ」はこの文脈ではやや不自然で、שׁלחの『行かせる／解放する』を明瞭に伝えにくい。
  naturalness: 「今に」は理解できるものの、明瞭な現代標準語としては「今、…見ることになる」のほうが自然である。「彼らを去らせ」も現代日本語として硬く不自然なので、「彼らを行かせ」に改める。
  terminology: 神名「ヤハウェ」、人名「モーセ」「ファラオ」は適切である。「強い手」の反復を維持する。אֶרֶץには「国」も可能だが、英語監査記録および原語の地理的・領域的な広がりを踏まえ、「土地」とする。
  issues:
  - severity: medium
    issue: 「彼らを去らせ」
    rationale: 『去らせる』は現代日本語では通常、本人が去ることを許容・促進する意味合いが強く、ファラオが民を放出するשׁלחの文脈において不自然である。「彼らを行かせる」が自然であり、出エジプト文脈の解放・出発を明瞭に表す。
  - severity: low
    issue: 「今に」
    rationale: 誤訳ではないが、予告としてやや文語的・慣用的である。「今、あなたは…見ることになる」は現代標準語で将来の実現を明確に示す。
