  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: ja
  text: そこでヤハウェはモーセに言われた。「今、あなたは、わたしがファラオに何をするかを見ることになる。強い手によって、彼は彼らを行かせ、強い手によって、彼らを自分の土地から追い出すことになるからである。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「強いられて、彼は彼らを行かせ、強いられて、彼らを自分の土地から追い出す」とも訳せる。繰り返される「強い手によって」は、ファラオが圧倒的な力、究極的には神の力に迫られて行動することを示している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示す。
- source_word: וַיֹּאמֶר
  choice: そこで…言われた
  rationale: 物語を進める接続を自然な日本語で表し、神の発言には敬意を示す表現を用いる。
- source_word: עַתָּה תִרְאֶה
  choice: 今に…あなたは見る
  rationale: 目前に迫った神の行為を強調する時間的・予告的な響きを保つ。
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: わたしがファラオに何をするか
  rationale: לְ の関係を過度に敵対的と限定せず、原文の関係節を自然に表す。
- source_word: בְיָד חֲזָקָה
  choice: 強い手によって
  rationale: 二度反復されるヘブライ語の比喩を保持し、神の圧倒的な力による強制という含みを本文で一義的に解消しない。
- source_word: יְשַׁלְּחֵם
  choice: 彼らを去らせ
  rationale: ファラオがイスラエルを解放して行かせる文脈を簡潔に表す。
- source_word: יְגָרְשֵׁם
  choice: 彼らを…追い出す
  rationale: 単に送り出すより強い、強制的な放逐の意味を伝える。
- source_word: מֵאַרְצוֹ
  choice: 自分の国から
  rationale: ここではファラオの支配領域であるエジプトを指すため、現代日本語として自然な「国」を選ぶ。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 契約の神の固有名を称号で代替せず、特定の教派的慣用にも依存しない音写を用いる。
- issue: 「強い手」の力の主体
  choice: 「強い手によって」という比喩を本文に保持する
  alternative: 「強いられて」「圧倒的な力のために」
  rationale: この句はファラオの行動に結び付く一方、文脈上は神の力による強制を含意する。主体を本文で明示せず、原文の曖昧さと神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「強い手」の反復を保ち、後半の動詞を「去らせる」から「追い出す」へ強めて原文の並行と進展を示した。脚注記号[a]は引用文全体に関わるため文末に置いた。
