base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: ja
  text: モーセはヤハウェの前で言った。「見てください。イスラエルの人々は私の言うことを聞かなかったのに、どうしてファラオが私の言うことを聞くでしょうか。私は割礼を受けていない唇を持つ者なのです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「割礼を受けていない唇を持つ者」。話すことに妨げがあること、または話す者として不十分であることを表す比喩。出エジプト記4章10節参照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: しかし、モーセは言った
  rationale: 物語を進める接続形だが、直前の神の命令に対するモーセの異議との対照を示すため、「しかし」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: לִפְנֵי の「前で／面前で」という空間的・関係的表現を保ち、神名 יְהוָה は固有名「ヤハウェ」とした。
- source_word: הֵן
  choice: ご覧ください
  rationale: 注意を促す談話標識。現代日本語として明瞭でありながら、神への発言にふさわしい敬意を表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 契約共同体を家族的に表すヘブライ語の形を残した。「イスラエル人」も可能だが、原文の比喩を優先した。
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: 私の言うことを聞かなかった
  rationale: שׁמע と אֶל の組み合わせが表す「耳を傾ける／聞き入れる」を自然な日本語で示し、「従う」と強く限定しなかった。
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: どうしてファラオが私の言うことを聞くでしょうか
  rationale: 先行節からの推論を表す修辞疑問として訳し、同じ語根 שׁמע の反復を日本語でも保った。
- source_word: עֲרַל שְׂפָתָיִם
  choice: 唇に割礼のない者
  rationale: 発話上の妨げ、不適格さ、あるいは不得手を示す鮮烈なヘブライ語の比喩を、診断的な言い換えに解消せず保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が称号ではなく四文字神名を用いているため、固有名として音写し、契約の神の名を明示した。
- issue: עֲרַל שְׂפָתָיִם の比喩
  choice: 唇に割礼のない者
  alternative: 口下手な者／言葉がうまく話せない者
  rationale: モーセが自らを発話において妨げられた、または不適格な者と述べる比喩を保ち、その正確な含意を一つに決めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神への呼びかけには「ご覧ください」「でしょうか」「なのです」を用いて敬意と格調を保った。原文の家族的表現と「割礼のない唇」という比喩は、注を添えて本文に残した。
