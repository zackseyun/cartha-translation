source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: ja
  text: モーセはこのようにイスラエルの人々に語った。しかし彼らは、心がくじけていたことと、過酷な労働のために、モーセの言うことを聞かなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心がくじけていたこと」は、直訳すると「霊が短かったこと」。圧迫による落胆、気力の喪失、息の詰まるような苦しさを表す語句と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語った
  rationale: ピエル形の基本義「語る」を、物語文にふさわしい自然で格調ある日本語で表した。
- source_word: כֵּן
  choice: このように
  rationale: 直前に神がモーセへ告げた内容を指し戻す語であり、日本語では「このように」が明確で自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの息子たち」だが、ここでは共同体全体を指す慣用表現なので、現代日本語で自然かつ包括的な「イスラエルの人々」とした。
- source_word: שָׁמְעוּ אֶל
  choice: モーセの言うことを聞かなかった
  rationale: 単なる聴覚ではなく、語りかけを受け入れて従う意味を含む。日本語の慣用的な表現でその含意を保った。
- source_word: מִקֹּצֶר רוּחַ
  choice: 心がくじけていたこと
  rationale: 字義は「霊の短さ」で、圧迫による内面的な萎縮、落胆、気力の喪失を表す。「心がくじける」は文脈上の情感を自然に伝える。
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: 過酷な労働
  rationale: עֲבֹדָהは労働・奉仕・隷属を意味し得る。エジプトでの強制労働という文脈を踏まえつつ、原語の語彙的広がりを保つため「労働」とした。
theological_decisions:
- issue: עֲבֹדָה קָשָׁהを「過酷な奴隷状態」と明示するか
  choice: 過酷な労働
  alternative: 過酷な奴隷労働
  rationale: 出エジプト記の文脈では奴隷的強制労働であることは明らかだが、この節の名詞自体は「労働／奉仕」を表すため、本文では意味を狭めすぎず、歴史的文脈も伝わる表現を選んだ。
- issue: מִקֹּצֶר רוּחַの心理状態
  choice: 心がくじけていたこと
  alternative: 息が詰まる思い／短気
  rationale: この句は字義的に「霊の短さ」で、落胆、焦燥、息苦しさなどの含みがある。苛酷な境遇によって希望を失った文脈を踏まえつつ、注で原語の比喩と幅を示した。
translation_notes:
  register: 明瞭な現代標準語を用い、物語文としての簡潔さと尊厳を保った。「イスラエルの人々」は共同体全体を自然に指し、「過酷な労働」は原語の幅を不必要に狭めない表現とした。
