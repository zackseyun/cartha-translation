- source_word: וְשִׁמְעִי
  choice: とシムイ
  rationale: 接続詞וְを「と」で表し、固有名詞を音写した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָהは部族内の親族集団を指す系譜上の語であり、現代日本語の「家族」より広い社会単位を明確にするため「氏族」とした。前置詞לְを伴う分類の意味は「ごとに」で自然に表した。
