- source_word: בְּנֵי
  choice: 息子たち
  rationale: בֵּןの複数構文形で、直後に実子名を挙げる系譜表現であるため、広義の「子孫」ではなく「息子たち」とした。
- source_word: גֵרְשׁוֹן
  choice: ゲルション
