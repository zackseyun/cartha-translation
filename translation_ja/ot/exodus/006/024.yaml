base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: ja
  text: コラの子らは、アシル、エルカナ、アビアサフ。これらがコラ人の諸氏族である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「コラ人の諸家族」とも訳せる。ヘブライ語は、部族内の拡大家族的な親族集団を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי קֹרַח
  choice: コラの子らは
  rationale: בְנֵי は構成形複数で、直後に三人の名が列挙されるため「子ら」とした。語頭の接続詞 וּ は、系譜の新しい項目として自然な日本語にするため明示しない。
- source_word: אַסִּיר
  choice: アシル
  rationale: ここでは普通名詞ではなく人名。ヘブライ語の音形に基づき、日本語で読みやすく転写した。
- source_word: וְאֶלְקָנָה
  choice: エルカナ
  rationale: 人名として転写した。接続詞は日本語の列挙形式で表した。
- source_word: וַאֲבִיאָסָף
  choice: アビアサフ
  rationale: 人名として、原語の構成音を保ちつつ日本語で通用する形に転写した。
- source_word: מִשְׁפְּחֹת
  choice: 諸氏族
  rationale: 部族内の拡大家族的な親族集団を指す系譜上の語であり、現代日本語の「家族」より広いまとまりを示すため「氏族」とした。複数形も「諸」で反映した。
- source_word: הַקָּרְחִי
  choice: コラ人
  rationale: コラに属する系統の人々を表す所属形容詞であり、簡潔な集団名として「コラ人」とした。
theological_decisions: []
translation_notes:
  register: 簡潔な系譜文として、現代標準語の明瞭さと聖書本文にふさわしい端正さを両立させた。固有名は原語に即して転写し、系譜上の社会単位は「諸氏族」とした。
