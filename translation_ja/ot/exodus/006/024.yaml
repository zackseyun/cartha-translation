  verdict: approve
  source_fidelity: ヘブライ語の系譜文を正確に反映している。「コラの子ら」は וּבְנֵי קֹרַח、「アシル、エルカナ、アビアサフ」は列挙された三人名、「これらがコラ人の諸氏族である」は אֵלֶּה מִשְׁפְּחֹת הַקָּרְחִי に忠実である。冒頭の接続詞は日本語の独立した系譜項目では省略して自然であり、意味の欠落には当たらない。
  naturalness: 簡潔な系譜文として自然で端正な現代標準語である。「子らは、…。」という列挙の文体も聖書の系譜文として明瞭である。
