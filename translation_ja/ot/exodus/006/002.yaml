id: EXO.6.2
reference: Exodus 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: ja
  text: 神はモーセに語り、こう言われた。「わたしはヤハウェ[a]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文はYHWH（四文字神名）。「ヤハウェ」はその推定発音で、伝統的に「主」と訳されることもある。
    reason: 神名の原語表記と発音上の不確実さ、および伝統的な代替訳を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語り
  rationale: 神の発言を導入する通常の物語表現。後続するוַיֹּאמֶרとの区別も保った。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、ここでは単数動詞と結び、イスラエルの神を指す。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞句として、現代日本語で自然に訳した。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: こう言われた
  rationale: אמרを「言われた」とし、אֵלָיוの指す相手は直前の「モーセに」から明白なので重複を避けた。「こう」は後続する直接話法を自然に導く。
- source_word: אֲנִי
  choice: わたしは…である
  rationale: 代名詞が明示された自己同定の強調を保ち、日本語の名詞述語として自然に表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名YHWHを称号に置き換えず、一般的な日本語表記で音写した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主／YHWH（四文字神名）
  rationale: 本文は称号ではなく神の固有名を直接用いているため、固有名として音写した。推定される古代の発音には不確実さがあることを脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「語り、こう言われた」として、ヘブライ語にある二つの発話動詞を保ちつつ、日本語として過度に冗長にならない形にした。
