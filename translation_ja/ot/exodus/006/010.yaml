  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセに[a]、次のように語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神名を表す四文字「YHWH」。正確な古代発音は確定しておらず、「エホバ」とも表記される。
    reason: 神名の原語表記と発音・別表記に関する情報を示すため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから、…語って言われた
  rationale: ワウ継続法による物語の進行を「それから」で示し、דבר の「語る」という意味を保った。日本語の聖書叙述として自然になるよう、後続の לֵאמֹר と合わせて表現した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を称号に置き換えず、四文字神名YHWHの一般的な学術的再構音を日本語で音写した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 発話の向かう相手を示す אֶל を自然な現代日本語の助詞「に」で表し、人名 מֹשֶׁה は慣用的に「モーセ」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直後の直接話法を導く不定詞である。単独の「言って」では不自然なため、וַיְדַבֵּר と一体の定型句「語って言われた」とし、原文の二つの発話表現を残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いていることを明示するため、神名を音写した。ただし古代の正確な発音は確定していないため、脚注でその点と別表記を示した。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。物語の順次性を「それから」で示し、原文の定型句 וַיְדַבֵּר…לֵאמֹר の形式も可能な範囲で保持した。
