  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: ja
  text: わたしは全能の神としてアブラハム、イサク、ヤコブに現れた。しかし、わたしの名ヤハウェとしては、彼らに知られていなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、わたしは自分の名ヤハウェによって、彼らに自らを知らせなかった」。ヘブライ語は、族長たちが神の名そのものを知らなかったという意味ではなく、その名が示す契約上の意味をまだ十分には知らなかったことを指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: わたしは……現れた
  rationale: ראהのニファル態一人称単数を、族長たちへの神の顕現という文脈に即して直接的に訳した。「自らを現した」も可能だが、本文では簡潔な表現を採った。
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  choice: アブラハムに、イサクに、またヤコブに
  rationale: 原文で反復される前置詞אֶלを日本語でも「に」の反復によって示し、列挙のリズムと強調を保った。
- source_word: בְּאֵל שַׁדָּי
  choice: 全能の神として
  rationale: בְּをここでは身分・名を表す「として」と理解した。אֵל שַׁדָּיは伝統的かつ一般に理解しやすい「全能の神」と訳し、音写は避けた。
- source_word: וּשְׁמִי יְהוָה
  choice: しかし、わたしの名ヤハウェによっては
  rationale: וּを文脈上の対照として「しかし」とし、「わたしの名」と固有名「ヤハウェ」の関係を明示した。後続の受動表現とのつながりを保つため、בְּの含意を補って「によっては」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、現代日本語で一般的な音写を用いた。
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: 彼らに知られていなかった
  rationale: ידעのニファル態が持つ受動・状態的な形を保ち、単なる名称の不知か、名の意味を十分に経験していなかったことかを本文で決着させない訳とした。
theological_decisions:
- issue: 族長たちが神の名を知らなかったという句の意味
  choice: 「わたしの名ヤハウェによっては、彼らに知られていなかった」と形式的な緊張を残す
  alternative: 「わたしの名ヤハウェによって、わたしは彼らに自らを知らせなかった」または「ヤハウェという名の契約的意味においては知られていなかった」
  rationale: 創世記の族長物語には神名ヤハウェが現れる一方、この節のヘブライ語は「知られなかった」と述べる。名称そのものの不知と、契約の成就を通した十分な認識とのどちらかに本文だけで限定せず、注で解釈の可能性を示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「わたし」を用いて神の発話を自然に示した。原文の前置詞反復を適度に残しつつ、日本語として読める語順に整えた。神名は「ヤハウェ」と音写し、解釈上の緊張は本文と脚注の組み合わせで保持した。
