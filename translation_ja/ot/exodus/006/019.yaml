base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: ja
  text: メラリの子はマフリとムシ。これらが、その家系によるレビ人[a]の諸氏族である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「そのレビ人」。ここでは集合的にレビの家系を指すと考えられる。「レビの諸氏族」または「レビ族の諸氏族」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: メラリの子は
  rationale: 系譜の文脈で בְּנֵי を「子」とし、接続詞 ו は日本語の列挙として自然になるよう明示せず、提示の助詞「は」で文を整えた。
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: マフリとムシ
  rationale: 固有名を原語の発音に即して音写し、接続詞を「と」で表した。
- source_word: אֵלֶּה
  choice: 以上が
  rationale: 直前までに列挙されたレビの諸家系を総括する指示語なので、現代日本語の系譜として自然な「以上が」とした。
- source_word: מִשְׁפְּחֹת
  choice: 諸氏族
  rationale: 部族内部の血縁集団を指す系譜用語であり、「家族」よりも「氏族」が適切。複数形は「諸」で示した。
- source_word: הַ/לֵּוִי
  choice: レビ人
  rationale: 定冠詞付き単数の民族・所属呼称を集合的に理解し、日本語でも個人と集団の両方を表し得る「レビ人」とした。原文の曖昧さは脚注に示した。
- source_word: לְ/תֹלְדֹתָם
  choice: 家系ごとに見た
  rationale: תּוֹלְדוֹת はここでは世代そのものより系譜・家系上の区分を表す。「その世代に従って」という不自然な直訳を避けつつ、分類基準を示す לְ を保持した。
theological_decisions:
- issue: הַלֵּוִי の単数形を個人・祖先レビと取るか、レビ系集団の集合的呼称と取るか
  choice: 本文では集合的な「レビ人」とした
  alternative: 「レビの諸氏族」または「レビ族の諸氏族」
  rationale: 文脈はレビの子孫に属する氏族の総括であり、単数の所属呼称が集合的に機能している可能性が高い。ただし、祖先レビとの関係を前面に出す読みも排除せず脚注に残した。
translation_notes:
  register: 簡潔な系譜一覧の調子を保ちつつ、現代の一般読者に通じる格調ある標準語とした。「諸氏族」で部族内の血縁集団を明確にし、「家系ごとに見た」で系譜上の分類を自然に表現した。
