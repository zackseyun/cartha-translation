  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: ja
  text: また、わたしは彼らとわたしの契約を立て、カナンの地、すなわち彼らが寄留していた地を彼らに与えるためにそうした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼らの寄留の地、彼らがそこで寄留した地」。
    reason: 原文では「寄留」に関係する名詞と動詞が反復されていることを示すため。
lexical_decisions:
- source_word: וְגַם
  choice: また
  rationale: 前節との付加的なつながりを、自然な現代日本語で示す。
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: わたしの契約を立てた
  rationale: קוםとבְּרִיתの結び付きを、日本語の聖書的・契約的表現として明瞭な「契約を立てる」で表した。所有は文中の「わたしは」と契約内容によって明らかであり、「わたしの」を重ねず自然な日本語とした。
- source_word: אִתָּם
  choice: 彼らと
  rationale: 文脈上の族長たちを指す関係表現をそのまま保持した。
- source_word: לָתֵת לָהֶם
  choice: 彼らに与えるという
  rationale: 目的を表す不定詞を、契約内容として自然に理解できる日本語の連体構文で表した。
- source_word: אֶרֶץ כְּנָעַן
  choice: カナンの地
  rationale: 「地」と固有名の双方を保持した標準的な訳語。
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: 彼らが寄留していた地
  rationale: מָגוּרとגורが示す、定住権を持たない者として滞在する意味を「寄留」で表し、ヘブライ語の反復は本文では自然な日本語に整えた。
theological_decisions:
- issue: קום＋בריתの契約表現
  choice: 契約を立てた
  alternative: 契約を確立した／契約を堅く保った
  rationale: 神が族長たちに対して負った拘束力ある契約を示しつつ、後代の特定の神学的区分を持ち込まない表現とした。
- issue: לָתֵתが示す契約と土地授与の関係
  choice: 土地を与えるという契約
  alternative: 土地を与えるために契約を立てた
  rationale: 目的・内容のどちらにも読める関係を不必要に細分化せず、日本語で契約の趣旨が明瞭になる形にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「寄留」は日常語よりやや文語的だが、異国人・一時滞在者として住むという原語の社会的含意を簡潔に保てるため採用した。
