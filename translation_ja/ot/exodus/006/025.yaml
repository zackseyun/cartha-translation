revisions:
- from: アロンの子エルアザルは、プティエルの娘たちの中から一人を妻に迎え[a]、彼女はエルアザルとの間にピネハスを産んだ。以上が、レビ人の諸氏族ごとの父祖の家のかしらたちである。[b]
  to: アロンの子エルアザルは、プティエルの娘たちの中から妻を迎え[a]、彼女はエルアザルとの間にピネハスを産んだ。これらの者が、レビ人の諸氏族ごとの父祖の家の長たちである。[b]
  rationale: 「一人」を本文から除いて、מִבְּנוֹת（娘たちから）が示す出自・集団所属の表現を保ち、どの娘かを特定しない点は脚注で説明しました。また、「かしらたち」を「長たち」にして、原語の親族集団における指導者という意味を維持しつつ、現代日本語としての明瞭さを高めました。
