  text: וְ/אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן לָקַֽח ל֨/וֹ מִ/בְּנ֤וֹת פּֽוּטִיאֵל֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת פִּֽינְחָ֑ס אֵ֗לֶּה רָאשֵׁ֛י אֲב֥וֹת הַ/לְוִיִּ֖ם לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: ja
  text: アロンの子エルアザルは、プティエルの娘たちの中から妻を迎え[a]、彼女はエルアザルとの間にピネハスを産んだ。これらの者が、レビ人の諸氏族ごとの父祖の家の長たちである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「プティエルの娘たちから、自分のために妻として迎えた」。プティエルの家の娘との結婚を指すが、どの娘かは示されていない。
    reason: lexical_alternative
  - marker: b
    text: 「父祖の家の長たち」は、レビ人の各氏族を構成する祖先以来の家系的集団の代表者を指す系譜上の表現。
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: 妻に迎え
  rationale: 「自分のために……を妻として取る」というヘブライ語の婚姻表現を、意味を保ちながら自然で dignified な現代日本語にした。
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: プティエルの娘たちの中から一人を
  rationale: 前置詞 מִן の出所・集団所属の意味を表しつつ、日本語では婚姻相手が一人であることを自然に示した。原文が具体的にどの娘かを特定しない点は脚注で明示した。
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: 彼女はエルアザルとの間にピネハスを産んだ
  rationale: 女性単数動詞の主語を「彼女」と明示し、לוֹ が示す父との関係も、誤解の少ない自然な日本語で表した。
- source_word: רָאשֵׁי אֲבוֹת
  choice: 父祖の家のかしらたち
  rationale: 単なる父親ではなく、祖先を同じくする家系的集団の指導者を指す社会・系譜上の表現として訳した。
- source_word: הַלְוִיִּם לְמִשְׁפְּחֹתָם
  choice: レビ人の諸氏族ごとの
  rationale: מִשְׁפָּחָה を系譜文脈における氏族と捉え、לְ の分類・対応関係を「ごとの」で表した。
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: エルアザル／アロン／プティエル／ピネハス
  rationale: 聖書の固有名として日本語で理解しやすい慣用的な音写を用いた。
