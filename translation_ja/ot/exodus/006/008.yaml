source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: ja
  text: わたしは、アブラハム、イサク、ヤコブに与えると誓った[a]地へ、あなたがたを導き入れる。そして、その地をあなたがたの所有地として与える。わたしはヤハウェである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「与えるためにわたしが手を上げた」。これは、誓いを立てることを表す慣用句。
    reason: ヘブライ語の誓約慣用句が持つ具体的な表現を示すため。
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: 導き入れる
  rationale: בואのヒフィル形の使役的な意味を表す。「連れて行く」よりも、民を約束の地の中へ入れるという到達点を明確に示す。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 文脈上、全世界ではなく、族長たちに約束された特定の土地を指す。日本語の聖書文体として自然で簡潔な「地」とした。
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: 与えると誓った
  rationale: 直訳は「わたしが手を上げた」だが、これは誓約を表すヘブライ語の慣用句である。本文では意味を自然に示し、具体的な原語表現は脚注に残す。
- source_word: לָתֵת אֹתָהּ
  choice: 与える
  rationale: נתןの基本的で直接的な意味を保つ。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: アブラハム、イサク、ヤコブに
  rationale: 固有名詞は現代日本語で定着した表記を用い、反復される前置詞は日本語として自然にまとめた。
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: その地をあなたがたに与える
  rationale: 目的語を「その地」と明示し、約束の直接性を保ちながら日本語での参照を明瞭にした。
- source_word: מוֹרָשָׁה
  choice: 所有として
  rationale: 相続によって保持される恒久的な所有地という含意を持つ語だが、ここでは神がイスラエルに与える所有地である点が前面に出るため、「相続財産」より広く自然な表現とした。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の固有名יהוהを「ヤハウェ」と音写し、契約における厳粛な自己宣言を「である」で表した。
theological_decisions:
- issue: 誓約の慣用句 נָשָׂאתִי אֶת יָדִי の訳し方
  choice: 与えると誓った
  alternative: 与えるために手を上げた
  rationale: 原語の比喩的表現をそのまま本文に置くと、現代日本語では単なる身ぶりと誤解され得る。誓約という機能を本文に示し、原語の具体的な像は脚注で保存した。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の契約名を用いていることを明示するため、一般名詞的な称号に置き換えず音写した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、神の厳粛な約束にふさわしい格調を保った。「あなたがた」を用いて複数の受け手を明示し、神の発言は常体で統一した。
