  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֨ל וְ/יָמִ֤ין וְ/אֹ֨הַד֙ וְ/יָכִ֣ין וְ/צֹ֔חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִ֑ית אֵ֖לֶּה מִשְׁפְּחֹ֥ת שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: ja
  text: シメオンの息子たちは、エムエル、ヤミン、オハド、ヤキン、ツォハル、およびカナン人女性の子シャウル[a]である。これらがシメオンの諸氏族である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シャウル」は伝統的に「サウル」とも表記される。ヘブライ語形は שָׁאוּל（シャウル）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: シメオンの息子たちは
  rationale: בְנֵיを系譜上の実子を示す「息子たち」とし、接続詞וּは前後の系譜との連続が日本語でも自然に伝わる文脈的な形にした。
- source_word: יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר
  choice: エムエル、ヤミン、オハド、ヤキン、ツォハル
  rationale: ヘブライ語の固有名を、現代日本語で読める形に音写した。列挙中の反復されるוְは、過度に不自然にならないよう読点で表した。
- source_word: וְשָׁאוּל
  choice: そして…シャウル
  rationale: שָׁאוּלのヘブライ語形を「シャウル」と音写し、列挙の最後であることを「そして」で明示した。
- source_word: בֶּן הַכְּנַעֲנִית
  choice: カナン人の女の息子
  rationale: הַכְּנַעֲנִיתは女性単数形なので、「カナン人」だけで性別を曖昧にせず、「カナン人の女」と明示した。
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: これらがシメオンの諸氏族である
  rationale: 動詞のない同定文を自然な日本語にし、מִשְׁפְּחֹתは部族内の血縁集団を指すため「諸氏族」とした。
theological_decisions: []
translation_notes:
  register: 簡潔な系譜文として、現代標準日本語の明瞭さと格調を両立させた。ヘブライ語の接続詞を一語ずつ機械的に「そして」とせず、列挙として自然な読点を用いつつ、最後の項目では「そして」を残した。英語相談層では脚注記号がJemuelに付いていたが、脚注内容はShaulに関するため、日本語本文では該当する「シャウル」に付した。
