id: EXO.6.29
reference: Exodus 6:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: ja
  text: その時、ヤハウェはモーセに語った。「わたしはヤハウェである。エジプトの王ファラオに、わたしがあなたに語ることをすべて[a]語れ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしがあなたに語っていることをすべて」とも訳せる。
    reason: ヘブライ語の分詞 דֹּבֵר は、進行中の発話を表す可能性がある。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: その時、…語った
  rationale: 物語を進める接続形の働きを自然な現代日本語で表しつつ、דבר の「語る」という意味を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: לֵאמֹר
  choice: 直接話法で表現
  rationale: 後続の発言を導く不定詞であり、日本語では独立した「言って」を重ねず、引用符による直接話法で自然に示した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 動詞のない自己同定文を、日本語として明確で荘重な判断文にした。
- source_word: דַּבֵּר
  choice: 語れ
  rationale: 命令形を保ち、同節内で繰り返される דבר と同じ語を用いた。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: エジプトの王ファラオ
  rationale: ヘブライ語の同格関係を、簡潔で自然な日本語の名詞句として表した。
- source_word: אֵת כָּל אֲשֶׁר
  choice: ことをすべて
  rationale: 伝えるべき内容の全体を指す表現として、自然な日本語にした。
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: わたしがあなたに語る
  rationale: 分詞の継続的・進行的な含みを限定しすぎず、神がモーセに告げる内容を包括的に表した。進行相も可能なため脚注で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、神の自己同定を保持する音写を採用した。
- issue: אֲנִי דֹּבֵר の時制・相
  choice: わたしがあなたに語る
  alternative: わたしが今あなたに語っている
  rationale: 分詞は進行中の発話とも継続的な発話とも理解できる。本文では曖昧さを保てる簡潔な表現を採り、より明示的な進行相を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の自己宣言と命令には「である」「語れ」を用いて簡潔で dignified な調子を保った。דבר の反復は「語る／語れ」で再現した。
