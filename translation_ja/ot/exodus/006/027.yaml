  text: הֵ֗ם הַֽ/מְדַבְּרִים֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: ja
  text: 彼らこそ、イスラエルの子らをエジプトから連れ出すために、エジプトの王ファラオに語った者たちである。この二人がモーセとアロンである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「語った者たち」は、直訳的には「語っていた者たち」。ヘブライ語は分詞を用い、彼らをその働きによって特徴づけている。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: 彼らこそ
  rationale: 独立代名詞による強調と、直前に名を挙げられた二人を改めて指し示す働きを、自然な日本語で表した。
- source_word: הַמְדַבְּרִים
  choice: 語った者たち
  rationale: 実体詞的な分詞で、モーセとアロンをファラオに語る者として特徴づけている。文脈上の出来事を自然に示すため過去形とし、分詞の継続的・特徴づけの含みは注で示した。
- source_word: אֶל
  choice: に
  rationale: 「語る」の相手を示す標準的な方向・対象の用法。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: エジプトの王ファラオ
  rationale: 同格関係を、日本語として明瞭で自然な語順で表した。
- source_word: לְהוֹצִיא
  choice: 連れ出すために
  rationale: יצאのヒフィル形の使役的意味「外へ出させる」を保ちつつ、人々を対象とする自然な日本語にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 「イスラエルの息子たち」というヘブライ語表現を透明に保ちながら、集団全体を指す日本語として「子ら」を用いた。
- source_word: מִמִּצְרָיִם
  choice: エジプトから
  rationale: 起点を示す前置詞 מן を自然に表し、「連れ出す」と組み合わせて脱出の意味を明確にした。
- source_word: הוּא
  choice: すなわち、…である
  rationale: 単数代名詞による再同定の結びを、日本語では数の不一致を不自然に露出させず、強調的な同定として表した。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロン
  rationale: 日本語聖書で広く認知される標準的な固有名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、系譜的な反復と強調を保つため、前半を「彼らこそ」、後半を「すなわち」で再同定した。「イスラエルの子ら」は原文の系譜的表現を保ちつつ、現代日本語で男女を含む集団として読める形にした。
