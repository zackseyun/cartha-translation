id: EXO.6.5
reference: Exodus 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: ja
  text: また、わたしは、エジプト人が奴隷として働かせているイスラエルの子ら[a]のうめきを聞き、わたしの契約を思い起こした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの人々」または「イスラエル人」とも訳せる。ヘブライ語では直訳すると「イスラエルの子ら」。ここでは民全体を指す。
    reason: lexical_alternative
  - marker: b
    text: ここで「思い起こした」とは、神が忘れていたという意味ではなく、契約を顧みて、それに基づいて行動へ向かうことを表す契約上の言い方。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: また、わたしは
  rationale: 前の神の発言に付け加える意味と、明示された一人称代名詞の強調を、自然な現代日本語で表した。
- source_word: שָׁמַעְתִּי
  choice: 聞き
  rationale: 完了した行為と、その結果が現在の神の応答につながる文脈を保つ。日本語では後続の「思い起こした」と一続きにした。
- source_word: נַאֲקַת
  choice: うめき
  rationale: 圧迫の下で発せられる苦痛の声を、古風になりすぎない簡潔な語で表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義的表現を保ちつつ、共同体全体を指す用法であることを脚注で明示する。
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: エジプト人が奴隷として働かせている
  rationale: 「エジプト」は複数分詞の主体としてエジプト人を表す。使役形の עבד が示す強制的な隷属労働を明確にした。
- source_word: וָאֶזְכֹּר
  choice: 思い起こした
  rationale: 原文の「覚える／思い起こす」という契約上の表現を言い換えずに残し、神が契約に基づいて行動へ向かう含みは脚注で説明する。
- source_word: בְּרִיתִי
  choice: わたしの契約
  rationale: 出エジプト記の中心的な契約用語として、標準的かつ明瞭に訳した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の共同体的意味
  choice: イスラエルの子ら
  alternative: イスラエルの人々／イスラエル人
  rationale: 男性だけに限定せず契約共同体全体を指すが、本文では原文の比喩的・系譜的表現を保持し、自然な代案を脚注に示した。
- issue: 神が契約を「思い起こす」ことの意味
  choice: わたしの契約を思い起こした
  alternative: わたしの契約に基づいて行動を起こした
  rationale: 神が忘れていたという意味に限定せず、契約を顧みて行動へ向かう聖書固有の緊張を保つため、本文では原語の慣用表現を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奴隷として働かせている」により圧迫の強制性を明示しつつ、「思い起こした」は説明的に言い換えず、原文の契約的表現を保持した。
