  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: ja
  text: ヤハウェがエジプトの地でモーセに語った日に、こういうことがあった——[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「そして、…の日にこういうことがあった」または「…の日に起こった」。物語をつなぎ、再開する表現。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は四文字神名「YHWH」。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ～日のことである
  rationale: 物語を再開する移行表現として、古風な「そして、…となった」を避けつつ、出来事の導入であることを自然な現代日本語で示す。後続節へ続く原文の未完結感はダッシュで保った。
- source_word: בְּיוֹם
  choice: ～日
  rationale: 直訳的な「日に」に相当する時間表現。関係節と組み合わせて「語られた日」とし、日本語として自然にした。
- source_word: דִּבֶּר
  choice: 語られた
  rationale: דבר の基本義「語る」を保持する。ヤハウェを主語とするため、神への敬意を表す自然な尊敬表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を音写して示す。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: דבר אל の方向・相手を示す構文を、自然な日本語の「モーセに語る」で表した。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地で
  rationale: 原文に明示された אֶרֶץ「地」を省略せず、簡潔で自然な形にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、神名であることを明示する音写を採用した。母音の正確な古代発音には不確かさがあるため、伝統的代替表記は脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文が次節へ続く移行句であることを長いダッシュで示し、独立した完結文に見せないようにした。
