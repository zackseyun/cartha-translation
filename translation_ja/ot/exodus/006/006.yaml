revisions:
- from: それゆえ、イスラエルの子ら[a]に言いなさい。『わたしはヤハウェである。わたしはあなたがたをエジプト人の重荷の下から連れ出し、彼らの奴隷労働から救い出す。また、伸ばした腕と大いなる裁き[b]によって、あなたがたを贖う。』
  to: それゆえ、イスラエルの子ら[a]に言いなさい。『わたしはヤハウェである。わたしはあなたがたをエジプトの重荷の下から連れ出し、エジプト人による奴隷状態から救い出す。また、伸ばされた腕と大いなる裁きの数々[b]をもって、あなたがたを贖う。』
  rationale: エジプトとイスラエルの関係を日本語で誤解なく示すため、重荷の帰属と隷属の加害主体を明確にした。さらに、「裁き」の複数性を本文に反映した。神名、家族的呼称、救出・贖いという原文の語彙と荘重な宣言調は保持している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:37Z'
