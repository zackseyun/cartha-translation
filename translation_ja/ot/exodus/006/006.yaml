id: EXO.6.6
reference: Exodus 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: ja
  text: それゆえ、イスラエルの子ら[a]に言いなさい。『わたしはヤハウェである。わたしはあなたがたをエジプトの重荷の下から連れ出し、エジプト人による奴隷状態から救い出す。また、伸ばされた腕と大いなる裁きの数々[b]をもって、あなたがたを贖う。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」または「イスラエルの民」。ヘブライ語の字義は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「大いなる裁きの行為」。ヘブライ語は複数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: それゆえ
  rationale: 直前の神の言葉を受けた推論的なつながりを明確に示す。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 契約の民を家族的に表すヘブライ語の字義を保つ。現代日本語では「イスラエル人」も自然だが、ここでは原文の表現を見える形で残した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神の契約名による自己宣言を、称号に置き換えず固有名として表した。
- source_word: וְהוֹצֵאתִי
  choice: 連れ出し
  rationale: יצאのヒフィル形が示す、抑圧下から外へ出させる行為を自然な日本語で表す。
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: エジプト人の重荷の下から
  rationale: 「下から」という空間的比喩と、課された荷・苦役を指す「重荷」の具体性を保つ。מִצְרַיִםはここでは支配主体を指すため「エジプト人」とした。
- source_word: וְהִצַּלְתִּי
  choice: 救い出す
  rationale: 危険や支配から脱出させる נצל の使役的意味を明瞭に伝える。
- source_word: מֵעֲבֹדָתָם
  choice: 彼らの奴隷労働から
  rationale: עֲבֹדָהの「労働・奉仕」という語感を残しつつ、この文脈での強制的隷属を明示する。接尾辞「彼らの」はエジプト人を指す。
- source_word: וְגָאַלְתִּי
  choice: 贖う
  rationale: 近親者による権利回復・解放という法的背景と、神学的含意の双方を保持する。
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: 伸ばした腕によって
  rationale: ヤハウェの力強い介入を示す擬人的な定型表現を保つ。
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: 大いなる裁きによって
  rationale: エジプトに対する複数の司法的行為を集合的な「裁き」として自然に表し、脚注で別訳を示す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の四文字神名を称号へ置き換えず、契約名として音写する。
- issue: לִבְנֵי יִשְׂרָאֵל の字義性
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 現代日本語として理解可能な範囲で、契約共同体を家族として描く原文の表現を保つ。
- issue: עֲבֹדָה の文脈的意味
  choice: 奴隷労働
  alternative: 労役、隷属
  rationale: 中立的な奉仕ではなく、エジプト支配下の強制労働を指すことを明確にしつつ、語の労働面も残す。
- issue: שְׁפָטִים の数と意味
  choice: 大いなる裁き
  alternative: 大いなる数々の裁きの業
  rationale: 複数形はエジプトに対する一連の司法的行為を示し得るが、日本語本文では集合的単数が自然であるため、複数性を脚注で補う。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の宣言にふさわしい荘重さを保った。「である」と将来の断固とした動詞表現により、約束の確実さを示す。原文の反復される一人称主語は、日本語で過度に省略せず二度示し、神が行為の主体であることを明確にした。
