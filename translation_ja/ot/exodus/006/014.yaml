  source_fidelity: 原文は「彼らの父祖の家のかしら」を系譜見出しとして掲げ、続いてイスラエルの長子ルベンの息子四名を挙げ、それらをルベンの諸氏族と結ぶ。訳文はこの構成、ルベンの「イスラエルの長子」という同格説明、四名の固有名、及びמִשְׁפְּחֹתの複数的・部族内親族集団の意味を適切に保持している。
