  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: ja
  text: 彼らの父祖の家のかしらは次のとおりである。イスラエルの長子ルベンの息子たちは、ハノク、パル、ヘツロン、カルミ。これらがルベンの諸氏族である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי בֵית אֲבֹתָם
  choice: 彼らの父祖の家のかしらは次のとおりである
  rationale: 系譜の見出しとして自然な日本語にしつつ、「父祖の家」と「かしら」という原文の家系的・代表者的表現を保った。
- source_word: בְּנֵי רְאוּבֵן
  choice: ルベンの息子たち
  rationale: ここでは直後に実子の名が列挙されるため、広義の「子孫」ではなく直接的に訳した。
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: イスラエルの長子
  rationale: ルベンを同格的に説明する句として、簡潔で格調ある定訳を用いた。
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: ハノク、パル、ヘツロン、カルミ
  rationale: 現代日本語聖書で理解しやすい慣用的な固有名表記を採用した。接続詞の反復は日本語の列挙として自然な読点に整えた。
- source_word: מִשְׁפְּחֹת
  choice: 諸氏族
  rationale: 部族内の血縁集団を指すため、現代語の「家族」より範囲が明確な「氏族」を選んだ。複数形も「諸」で示した。
