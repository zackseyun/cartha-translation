  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: ja
  text: あなたの収穫の実りと、搾り出される液状の産物を、献げるのに遅れてはならない[a]。あなたの息子たちのうちの初子を、わたしに献げなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたの満ちたものと、あなたの滴るもの」。収穫物と、搾って得る液状の産物を指すと考えられる。具体的には穀物とぶどう酒とも考えられるが、より広く固形と液状の産物を指す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: あなたの収穫の実り
  rationale: 語の基本的な意味である「満ちたもの、豊かな実り」を踏まえつつ、この律法の農業的文脈で収穫物を指すことが自然に伝わる表現とした。
- source_word: וְדִמְעֲךָ
  choice: 搾り場から流れ出るもの
  rationale: 字義的には「涙」とも関連する語だが、ここでは搾って得る液状の産物を指す。「ぶどう酒」や「油」に限定せず、原文の液体のイメージを保った。
- source_word: לֹא תְאַחֵר
  choice: 献げるのに遅れてはならない
  rationale: 動詞の「遅らせる、延期する」という禁止の意味を明確にした。「献げる」は文脈上補っているが、何を遅らせてはならないかを日本語で自然に示す。
- source_word: בְּכוֹר בָּנֶיךָ
  choice: あなたの息子たちの初子
  rationale: בָּנֶיךָの男性を示す意味を保ち、בְּכוֹרは聖書の法的・祭儀的用語として定着している「初子」で訳した。
- source_word: תִּתֶּן לִּי
  choice: わたしに献げなければならない
  rationale: 字義は「わたしに与える」だが、神への奉献を命じる文脈なので、現代日本語で意味が明確な「献げる」とした。法的命令の力は「なければならない」で表した。
theological_decisions:
- issue: מְלֵאָהとדִמְעָהから成る農産物の組み合わせ
  choice: 固形の収穫物と、搾って得る液状の産物を速やかに献げる命令として訳す
  alternative: 穀物とぶどう酒に限定する、または両方を区別せず広く初物とする
  rationale: 原文は収穫の実りと流れ出る液状の産物を対にしていると考えられるが、後者がぶどう酒か油かは明示しない。そのため特定の農産物に限定せず、原文の具体的な対比を残した。
- issue: בָּנֶיךָの範囲
  choice: 息子たち
  alternative: 子どもたち
  rationale: 原文は一般的な「子ども」ではなく男性複数形を用い、初子に関する法を述べているため、性別を曖昧にしなかった。
- issue: תִּתֶּן לִּיにおける奉献の含意
  choice: わたしに献げる
  alternative: わたしに与える
  rationale: 神が話者であり、初子を神に帰する法的・祭儀的文脈であるため「献げる」が自然である。ただし、初子を具体的にどう扱うかはこの節だけでは説明せず、訳文にも付加しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「初子」は律法文脈に適した聖書用語として保持した。二つの命令を簡潔に並べ、原文にない祭儀の詳細は補っていない。
