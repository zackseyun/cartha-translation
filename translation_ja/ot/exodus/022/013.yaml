  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: ja
  text: 人が隣人から何かを借り、それが壊れ[a]、または死んだ場合、その持ち主がそれと一緒にいなければ、必ず弁償しなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「壊れ」は、直訳では「砕かれる／壊される」。借りたものが動物である場合には、負傷することを指す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 人が……場合
  rationale: 法規集の中で新たな条件事例を導入する表現として、接続の流れを保ちつつ自然な現代日本語にした。
- source_word: יִשְׁאַל
  choice: 借り
  rationale: この法的文脈では、単に求めることではなく、他人の所有物を借用することを指す。
- source_word: אִישׁ
  choice: 人
  rationale: ヘブライ語は男性単数形だが、事例法における一般的な当事者を表すため、日本語では自然な総称の「人」とした。
- source_word: מֵעִם רֵעֵהוּ
  choice: 隣人から
  rationale: רֵעַ は友人・仲間・隣人を意味し得るが、共同体内の法規という文脈に適した「隣人」を採用した。
- source_word: וְנִשְׁבַּר
  choice: 壊れる
  rationale: 字義は「壊される／壊れる」。物品の破損にも動物の負傷にも用い得る語であるため、本文では原語に近い表現を保ち、その幅を脚注で示した。
- source_word: אוֹ מֵת
  choice: か死んだ
  rationale: 借りたものが動物である場合の死亡を、原文どおり簡潔に表した。
- source_word: בְּעָלָיו
  choice: その持ち主
  rationale: 形態上は複数形だが、ここでは慣用的に単数の所有者を指す。借りたものとの関係が明確になる表現とした。
- source_word: אֵין עִמּוֹ
  choice: そばにいなかった
  rationale: 所有者が借用品または動物と共にいなかった、すなわち不在だったという責任条件を自然な日本語で示した。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 必ず弁償しなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を「必ず」で示し、法的な補償義務を「弁償する」で表した。
theological_decisions: []
