  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: ja
  text: もしあなたが、わたしの民、すなわちあなたの間にいる貧しい者に金[c]を貸すなら[a]、その者に対して取り立てる者のようになってはならない。その者に利息を課してはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたが……金を貸すときは」とも訳せる。ヘブライ語は事例法で一般的な条件形式を用いている。
    reason: alternative_reading
  - marker: b
    text: ヘブライ語はここで、過大な利息だけでなく利息一般を指している。
    reason: lexical_clarification
  - marker: c
    text: 直訳は「銀」。ここでは貨幣を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし…なら
  rationale: 条件法的律法の定型を保つ。文脈上「…するとき」とも理解できるため、脚注で示した。
- source_word: כֶּסֶף
  choice: 金
  rationale: 字義は「銀」だが、ここでは貸付に用いる貨幣を指すため、現代日本語の「金」とした。
- source_word: תַּלְוֶה
  choice: 貸す
  rationale: לוה のヒフィル形で、金銭を貸すことを表す。簡潔で自然な訳語を採用した。
- source_word: עַמִּי
  choice: わたしの民
  rationale: 一人称単数接尾辞をそのまま反映し、本文にない「イスラエル」は補わなかった。
- source_word: הֶעָנִי
  choice: 貧しい者
  rationale: 男性単数形だが、日本語では性を付加せず個人を表せる「者」が自然で、原文にも「男」という名詞はない。
- source_word: עִמָּךְ
  choice: あなたのもとにいる
  rationale: 字義的な「あなたとともに」を、共同体内にいる貧しい者という関係が明瞭になるよう自然な日本語にした。二人称は女性単数形だが、集合としてのイスラエルへの呼びかけと理解した。
- source_word: כְּנֹשֶׁה
  choice: 取り立てる者のように
  rationale: 単なる中立的な「債権者」より、債務者に返済を迫る נשה の含意を伝える。
- source_word: תְשִׂימוּן עָלָיו נֶשֶׁךְ
  choice: 利息を課してはならない
  rationale: 字義的には「彼の上に利息を置く」だが、日本語の経済表現として自然に訳した。
- source_word: נֶשֶׁךְ
  choice: 利息
  rationale: ここでは貸付に伴って徴収する利息を指す。「高利」とすると過度な利率だけを禁じる意味を加えかねないため避けた。
theological_decisions:
- issue: 条件辞 אִם の法的効力
  choice: もし…貸すなら
  alternative: …貸すときは
  rationale: 原文の条件形式を本文で保持しつつ、事例法では現実に生じる場合を示す「とき」の意味にもなり得ることを脚注に残した。
- issue: 利息禁止の範囲
  choice: 貧しい同胞への貸付に利息を課すことを禁じる表現
  alternative: 過大な利息だけを禁じる表現
  rationale: נֶשֶׁךְ 自体はここで利息を指し、本文はその率を限定していない。「高利貸し」や「暴利」と訳して禁止範囲を狭めなかった。
- issue: הֶעָנִי の性別表現
  choice: 貧しい者
  alternative: 貧しい男
  rationale: ヘブライ語は文法上男性単数だが「男」という語はなく、日本語の「者」は単数の個人を自然に表し、不要な性別情報を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二人称単数への呼びかけを「あなた」で表し、二つの禁止命令を分けて読みやすくした。「金」は「かね」と読む日常的な貨幣表現である。
