  text: אִם בְּעָלָ֥י/ו עִמּ֖/וֹ לֹ֣א יְשַׁלֵּ֑ם אִם שָׂכִ֣יר ה֔וּא בָּ֖א בִּ/שְׂכָרֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: ja
  text: その所有者がそれと共にいたなら、その人は賠償する必要はない。それが雇い物であれば、その損失はその借り賃に含まれている。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別解「もし彼が雇われ人なら、その損失は彼の賃金に含まれている」。ヘブライ語は簡潔で、「雇い物である家畜・物」を指すとも、「雇われ人」を指すとも理解できる。ここでは、借りた物の賠償責任を扱う文脈から、前者を本文に採った。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: その所有者
  rationale: בעלはこの財産法の文脈では、借りられた家畜または物の所有者を指す。「主人」よりも現代日本語の法的関係が明確である。
- source_word: עִמּוֹ
  choice: それと一緒にいた
  rationale: 接尾辞は文脈上、借りられた家畜または物を受けると解した。所有者がその物に付き添っていた場合という法的状況を自然に表す。
- source_word: לֹא יְשַׁלֵּם
  choice: 償いをする必要はない
  rationale: ピエル形のשלםは法的文脈で損害の賠償・弁償を意味する。日本語では義務の免除を明瞭に示すため、この表現とした。
- source_word: שָׂכִיר
  choice: 賃借りしたもの
  rationale: 通常は「雇われ人」も意味するが、直前から続く借用物の責任を扱う文脈では、賃借りされた家畜または物を省略的に指すと解した。家畜に限定しないよう「もの」とした。
- source_word: בָּא בִּשְׂכָרוֹ
  choice: その借り賃に含まれている
  rationale: 直訳的には「その賃金とともに来た／その賃金のために来た」という簡潔で省略のある句。賃貸の場合の危険負担が借り賃に織り込み済みであるという文脈上の意味を、自然な日本語で表した。
theological_decisions:
- issue: שָׂכִירと接尾辞を物として読むか、人として読むか
  choice: 賃借りした物を指す読みを本文に採用
  alternative: 「もし彼が雇われ人なら、それは彼の賃金のために来た」
  rationale: ヘブライ語は簡潔で両様に理解されてきたが、借用・賃借りされた財物への賠償責任という直近の法的文脈には物を指す読みがよく適合する。別解は脚注で保持した。
translation_notes:
  register: 現代の標準的な日本語による簡潔な法文調。「その借り賃に含まれている」は原文の省略を補って意味を通じさせつつ、脚注で別解と原文の曖昧さを明示した。
