  text: しかし、もしそれが彼のもとから実際に盗まれたなら[a]、その所有者に償わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「盗む」という語根の不定詞絶対形と受動動詞を重ねる強調表現。字義的には「彼のもとから、盗まれることが盗まれるなら」のような形で、「彼が預かっている間に実際に盗まれたなら」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 一連の判例法の中で対照的な条件を導く接続表現として、文脈上の転換を自然な日本語で示した。
- source_word: גָּנֹב יִגָּנֵב
  choice: 実際に盗まれたなら
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調と受動の意味を表す。「実際に」により、単なる可能性ではなく盗難が事実として生じた場合という法的条件を示した。
- source_word: מֵעִמּוֹ
  choice: 彼のもとから
  rationale: 字義は「彼と共にあるところから」。預かっている間という文脈上の含みを保ちつつ、原文に近く自然に訳した。
- source_word: יְשַׁלֵּם
  choice: 償わなければならない
  rationale: 法的文脈におけるピエル形の、損失を弁償・賠償する意味と義務性を明確に表した。
- source_word: לִבְעָלָיו
  choice: その所有者に
  rationale: בעל の複数接尾辞付き形はここでは預けられた物または動物の所有者を指すため、現代日本語で自然な単数表現とした。
