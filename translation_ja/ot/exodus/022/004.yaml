  text: כִּ֤י יַבְעֶר אִישׁ֙ שָׂדֶ֣ה אוֹ כֶ֔רֶם וְ/שִׁלַּח֙ אֶת בעיר/ה וּ/בִעֵ֖ר בִּ/שְׂדֵ֣ה אַחֵ֑ר מֵיטַ֥ב שָׂדֵ֛/הוּ וּ/מֵיטַ֥ב כַּרְמ֖/וֹ יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: ja
  text: ある人が畑またはぶどう園を家畜に食べさせ[a]、自分の家畜を放して、それが別の人の畑[b]で食べたなら、自分の畑の最良のものと、自分のぶどう園の最良のものをもって償わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「畑またはぶどう園を焼き」。ヘブライ語の動詞 בער は文脈によって「焼く」を意味することがあるが、ここでは直後に家畜を放すことが述べられているため、家畜に食べさせる意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「別の畑」。ここでは、別の人が所有する畑という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: なら
  rationale: 個別の事例を示す法文の条件表現として、現代日本語で自然な「なら」とした。
- source_word: יַבְעֶר
  choice: 家畜に食べさせ
  rationale: ヒフィル形の使役的な意味を表した。בערには「焼く」の語義もあるが、直後に家畜を放すことが述べられるため、ここでは放牧して食べさせる意味が文脈に最も合う。
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: 畑またはぶどう園
  rationale: 農地を表す単数形を保ち、明瞭な現代語にした。
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: 自分の家畜を放して
  rationale: שׁלחの「放つ」と、בְּעִירの文脈上の意味である飼育動物を、自然な日本語で表した。単数形は種類全体を代表する用法として「家畜」とした。
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: それが他人の畑を食い荒らした
  rationale: 反復されるבערを家畜による採食・損害として訳した。「食い荒らす」は被害を伴う法律上の状況を明確にする。אַחֵרは字義的には「別の」だが、文脈上は所有者の異なる畑を指す。
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: 自分の畑の最良のものと、自分のぶどう園の最良のもの
  rationale: מֵיטַבの「最良の部分、最上の産物」という意味を保ち、接尾辞による加害者自身の所有を「自分の」で明示した。
- source_word: יְשַׁלֵּם
  choice: 償わなければならない
  rationale: ピエル形の法律的な賠償・弁償の意味を、現代日本語の法規的表現で示した。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語の法文調とした。「食い荒らす」は口語的すぎない範囲で、家畜による作物被害を一般読者に明確に伝える。原文に明示されない最初の畑・ぶどう園の所有者は補わず、後半の אַחֵר のみ文脈上「他人の」とした。
