source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: ja
  text: 人が隣人に金銭[a]または品物[b]を保管するよう預け、それがその隣人の家から盗まれた場合、盗人が見つかったなら、その盗人は二倍にして償わなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「銀」。ここでは貨幣、すなわち金銭の意味。
    reason: lexical_alternative
  - marker: b
    text: または「器具」「物品」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「二倍を償う」。二倍の賠償をすること。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 場合
  rationale: 規定法の事例を導く接続詞として、条件を自然な現代日本語で示す。後続の אִם は「もし」で区別した。
- source_word: יִתֵּן אִישׁ
  choice: 人が…預け
  rationale: 直訳は「男が与える」だが、ここでは保管を目的として財物を他者に託す行為である。「人」はヘブライ語法上の代表的男性単数を日本語で過度に性別限定せず表し、「預ける」で文脈上の機能を明確にした。
- source_word: אֶל רֵעֵהוּ
  choice: 隣人に
  rationale: רֵעַ は法的文脈で共同体内の他者を指す。「隣人」は聖書的連続性を保ちつつ理解しやすい。
- source_word: כֶּסֶף
  choice: 金銭
  rationale: 語義は「銀」だが、この経済・法的文脈では貨幣を指すため「金銭」とした。字義は脚注に示した。
- source_word: אוֹ כֵלִים
  choice: や品物
  rationale: כֵלִים は器具、物品などを広く指す。「品物」は特定の種類に狭めず、現代日本語として自然である。
- source_word: לִשְׁמֹר
  choice: 保管してもらうために
  rationale: 目的を表す不定詞であり、財物を守って保持するよう委託する意味を自然に表した。
- source_word: וְגֻנַּב
  choice: それが…盗まれた
  rationale: 受動形を保ち、「それ」は預けられた金銭または品物を包括的に受ける。
- source_word: מִבֵּית הָאִישׁ
  choice: その人の家から
  rationale: 財物を預かった先行の人物の家を指すことが明確になるよう「その人」とした。
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: もし盗人が見つかったなら
  rationale: מצא のニファル形を解釈的な「捕らえられる」ではなく、字義に近い「見つかる」で訳した。
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: 盗人は二倍にして償わなければならない
  rationale: 文脈上の主語「盗人」を日本語では補い、賠償義務を示す法文として訳した。「二倍」という原文の簡潔さを保ち、字義を脚注で補足した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。規定法の条件構文を「…場合、もし…なら」で示し、法的義務は「…なければならない」とした。原文の曖昧さを不必要に解消せず、ただし日本語で主語が誤解されないよう、最後の動詞の主語として「盗人」を補った。
