- from: 人が隣人に、保管してもらうために金銭[a]や品物[b]を預け、それがその人の家から盗まれた場合、もし盗人が見つかったなら、盗人は二倍にして償わなければならない[c]。
  to: 人が隣人に金銭[a]または品物[b]を保管するよう預け、それがその隣人の家から盗まれた場合、盗人が見つかったなら、その盗人は二倍にして償わなければならない[c]。
  rationale: 受託保管という法的場面を自然な日本語で表し、盗難が起きた家の所有者を受託者である隣人として明確にした。賠償の脚注は、ヘブライ語の慣用表現が示す二倍賠償を正確かつ自然に説明するよう改めた。
