  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ חֲמ֨וֹר אוֹ שׁ֥וֹר אוֹ שֶׂ֛ה וְ/כָל בְּהֵמָ֖ה לִ/שְׁמֹ֑ר וּ/מֵ֛ת אוֹ נִשְׁבַּ֥ר אוֹ נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: ja
  text: 人が隣人に、ろば、牛、羊一頭[a]、または何らかの家畜を預けて、その管理を任せたとする。その家畜が死ぬか、けがをするか[b]、連れ去られるかし、しかもそれを見た者がいない場合[c]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊または山羊の一頭」とも訳せる。ヘブライ語は、群れに属する羊または山羊を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「折れる」または「壊れる」。
    reason: lexical_alternative
  - marker: c
    text: すなわち、何が起きたかを目撃した者がいないということ。
    reason: clarification
lexical_decisions:
- source_word: כִּי
  choice: 〜とする／〜場合
  rationale: 個別事例を示す法文の条件節を導く語であるため、現代日本語の法的な事例提示として自然に表した。
- source_word: יִתֵּן ... לִשְׁמֹר
  choice: 預けて、その世話を頼む
  rationale: 字義的には「与える……守るために」だが、ここでは家畜を他人の管理に委ねる状況を指すため、預託の意味を明確にした。
- source_word: אִישׁ
  choice: 人
  rationale: ヘブライ語は男性単数形だが、事例法では一般の当事者を代表する用法である。日本語の「人」は原文の一般的効力を自然に伝える。
- source_word: אֶל רֵעֵהוּ
  choice: 隣人に
  rationale: רֵעַ は社会的関係にある相手を指す。「隣人」は法律・倫理的文脈で定着した、簡潔で過度に親密さを含まない訳語である。
- source_word: חֲמוֹר
  choice: ろば
  rationale: 現代日本語で明瞭な一般名称を用いた。
- source_word: שׁוֹר
  choice: 牛
  rationale: 法的な家畜一覧におけるウシ類を指す。日本語では性別や去勢の有無を不必要に限定しない「牛」が自然である。
- source_word: שֶׂה
  choice: 羊一頭
  rationale: 羊または山羊を含み得る群れの小家畜一頭を指すが、本文では代表的な「羊」とし、語義の幅を脚注に残した。
- source_word: וְכָל בְּהֵמָה
  choice: または何らかの家畜
  rationale: ここでは所有され飼育される動物一般を指すため、「動物」より文脈に即した「家畜」とした。
- source_word: וּמֵת
  choice: 死ぬ
  rationale: 事例中の動物に生じる出来事を、簡潔な自動詞で表した。
- source_word: נִשְׁבַּר
  choice: けがをする
  rationale: 字義的には「壊される／折れる」だが、動物については身体的損傷を表す自然な日本語とした。字義は脚注に示した。
- source_word: נִשְׁבָּה
  choice: 連れ去られ
  rationale: 捕らえられる、略奪されるという意味を持ち、単なる窃盗に限定しない受動表現を選んだ。
- source_word: אֵין רֹאֶה
  choice: それを見た者がいない
  rationale: 直訳に近く、出来事について証言できる目撃者がいないという法的状況を表す。
theological_decisions:
- issue: 事例法における男性単数 אִישׁ の扱い
  choice: 一般的な「人」
  alternative: 「男」
  rationale: 原文の文法上は男性単数だが、規定の適用対象を男性だけに限定する神学的・法的判断を訳文へ持ち込まず、代表的単数としての機能を自然な日本語で表した。
translation_notes:
  register: 現代の一般読者に分かる簡潔で品位ある法文調とした。原文は次節へ続く条件節なので、末尾を読点で閉じ、文の継続を示した。列挙は日本語として明瞭になるよう整えつつ、原文の事例順を保持した。
