  to: 人が隣人に、ろば、牛、羊一頭[a]、または何らかの家畜を預けて、その管理を任せたとする。その家畜が死ぬか、けがをするか[b]、連れ去られるかし、しかもそれを見た者がいない場合[c]、
  rationale: 原文の意味と条件節の継続を保ったまま、家畜に生じる三事態の並列を整え、損傷を表す脚注から不必要な行為者の含意を除いた。「管理を任せた」は、預けられた財産を守るという לִשְׁמֹר の法的文脈を明瞭にする。
