source:
  edition: WLC
  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: ja
  text: ヤハウェだけに献げるのでなければ、いかなる神にいけにえを献げる者も、聖絶されなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖絶される」は、神にささげられたものとして取り消し不能に滅びへ引き渡されることを表す。「完全に滅ぼされる」とも訳せる。
    reason: חרםの、神への奉献と不可逆的な滅びを含む法的・祭儀的意味を説明し、主要な訳語の選択肢を示すため。
lexical_decisions:
- source_word: זֹבֵחַ
  choice: いけにえを献げる者
  rationale: Qal分詞の名詞的用法を「～する者」で表した。「いけにえを献げる」は、屠って供える祭儀的意味を自然な現代日本語で伝える。
- source_word: לָאֱלֹהִים
  choice: 神々に
  rationale: אֱלֹהִיםの形態上の複数形を保ちつつ、文脈上はヤハウェ以外の神を一般的に指す。日本語では「神々に」が偶像礼拝の対象を簡潔に示す。
- source_word: יָחֳרָם
  choice: 聖絶されなければならない
  rationale: חרםのHophil形が表す、禁令のもとに置かれ、取り消し不能な仕方で滅びに渡されるという祭儀的・刑罰的含意を、「滅ぼされる」だけに平板化せず表した。
- source_word: בִּלְתִּי
  choice: ～場合を除き
  rationale: ここでは例外を導く語であり、現代日本語として明確な表現を用いた。
- source_word: לַיהוָה
  choice: ヤハウェに
  rationale: 本文に現れる契約の神名יהוהを音写し、普通名詞的な称号に置き換えなかった。
- source_word: לְבַדּוֹ
  choice: ただ～だけに
  rationale: いけにえを献げる対象がヤハウェに限定される排他的意味を自然に表した。
theological_decisions:
- issue: 偶像への犠牲に対する罰を表すחרםの訳
  choice: 聖絶されなければならない
  alternative: 完全に滅ぼされなければならない／禁令のもとに置かれなければならない
  rationale: 単なる処刑以上に、神に属するものとして滅びへ引き渡すという法的・祭儀的な重みを保つため。「聖絶」は説明を要し得るため脚注を付した。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が神名を直接用いていることを読者に示し、シナイ契約の文脈を保持するため。
- issue: לָאֱלֹהִיםの数と一般性
  choice: 神々に
  alternative: ほかの神に／いかなる神にでも
  rationale: 形態上の複数を尊重しながら、例外句によってヤハウェ以外の神々が禁じられていることを示した。
translation_notes:
  register: 明快な現代標準日本語を用い、法文としての厳粛さを保った。「聖絶」は一般語ではないが、原語の奉献と滅びの両面を保持するため本文に採用し、脚注で説明した。
