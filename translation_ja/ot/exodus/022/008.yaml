  terminology: 「不正の事件」「双方の案件」「有罪とする」「二倍を支払う」は、法的文脈を保ちつつ明瞭な現代日本語です。שֶׂהは本文を「羊」とし、そのより広い語義（山羊を含み得る）を脚注で示します。
