language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: ja
  text: あらゆる不正の事件、すなわち牛、ろば、羊[a]、衣服、またはあらゆる紛失物について、だれかが「これはその物だ」と言う場合、双方の案件は神[b]の前に持ち出されなければならない。神が有罪とする者は、相手に二倍を支払わなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、羊または山羊を指し得る小家畜一頭を表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「裁判官たち」または「法廷」。ヘブライ語 אֱלֹהִים は、神を直接指すほか、法的文脈では神の権威のもとで裁く人間の裁判官を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: 背信の件
  rationale: דָּבָרはここでは法的な「件・訴え」を表し、פֶּשַׁעは単なる過失より強い違反・背信を指す。「背信の件」は法的文脈と語の強さを保つ。
- source_word: שׁוֹר
  choice: 牛
  rationale: 法的な財産目録における大型家畜の単数を、現代日本語で自然かつ広く表す。
- source_word: חֲמוֹר
  choice: ろば
  rationale: 明瞭な現代日本語の家畜名。
- source_word: שֶׂה
  choice: 羊や山羊
  rationale: שֶׂהは羊だけでなく山羊を含み得る小家畜一頭を指すため、その語義の幅を本文で示す。
- source_word: שַׂלְמָה
  choice: 衣服
  rationale: 特定の外套に限定せず、衣類一般を指す語の広さを保つ。
- source_word: אֲבֵדָה
  choice: 紛失物
  rationale: 失われた物・財産を簡潔な法的日本語で表す。
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: だれかが「これがそれだ」と言う場合
  rationale: 争われている物の同定または所有の主張を示す可能性があるが、指示表現の曖昧さを解消せずに保つ。
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: 神
  rationale: 語の直接的な意味を本文に採用する。法的文脈で「裁判官たち／法廷」を指す可能性は脚注に残す。
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: 双方の訴えは……前に持ち出されなければならない
  rationale: 両者の法的案件が審理の場へ出されることを、自然な日本語で表現する。
- source_word: יַרְשִׁיעֻן
  choice: 有罪とされる
  rationale: רשעのヒフィル形が持つ法廷的な「有罪と宣告する」を受動表現で明確にする。
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: 二倍を償う
  rationale: 二重の賠償・返還を命じる法的慣用句を簡潔に表す。
- source_word: לְרֵעֵהוּ
  choice: 相手に
  rationale: この法的争いにおけるもう一方の当事者を指すため、「隣人」より文脈に即して明瞭。
theological_decisions:
- issue: 法的文脈における אֱלֹהִים の意味
  choice: 神
  alternative: 裁判官たち／法廷
  rationale: ヘブライ語の通常の意味を本文に保ちつつ、人間の裁判官が神の権威のもとで裁く法的制度を指すという古くからの有力な理解を脚注で明示し、曖昧さを解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。古風な法令調を避けながら、「持ち出されなければならない」「償わなければならない」で規定の強さを示した。本文中の脚注記号は該当語の直後に置いた。
