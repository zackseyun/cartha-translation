revisions:
- from: どのような背信の件でも、牛、ろば、羊や山羊[a]、衣服、あるいは何であれ紛失物について、だれかが「これがそれだ」と言う場合、双方の訴えは神[b]の前に持ち出されなければならない。神が有罪とされる者は、相手に二倍を償わなければならない。
  to: あらゆる不正の事件、すなわち牛、ろば、羊[a]、衣服、またはあらゆる紛失物について、だれかが「これはその物だ」と言う場合、双方の案件は神[b]の前に持ち出されなければならない。神が有罪とする者は、相手に二倍を支払わなければならない。
  rationale: 不必要に限定的な「背信」を中立的な「不正」に改め、שֶׂהの語義幅は本文の累加的表現ではなく脚注で保持しました。さらに、所有・同定の主張、双方の法的案件、有罪宣告、二倍の支払いを自然かつ原文に沿う日本語で明確にしました。脚注記号と脚注内容の対応も維持しています。
