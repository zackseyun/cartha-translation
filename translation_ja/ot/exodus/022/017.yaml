  text: You shall not let a sorceress live[a].
translation:
  language: ja
  text: 呪術を行う女を生かしておいてはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「魔女」。ヘブライ語の名詞は女性単数形で、呪術を行う女性を特に指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: 呪術を行う女
  rationale: 女性単数形で、呪術や魔術を行う女性を指す。現代日本語として意味が明確であり、原文の性別も保持する。
- source_word: לֹא
  choice: ならない
  rationale: 否定辞。後続する動詞と合わせ、法的な禁止を自然な日本語で表す。
- source_word: תְחַיֶּה
  choice: 生かしておいては
  rationale: חיהのピエル未完了二人称男性単数形で、ここでは「生かしておく」「生存を許す」という使役的・結果的な意味を持つ。処刑方法を補わず、原文の表現を保つ。
theological_decisions:
- issue: 違反者の性別を明示するか
  choice: 女性を明示して「呪術を行う女」と訳す。
  alternative: 「呪術師」または「呪術を行う者」と一般化する。
  rationale: ヘブライ語名詞は明確に女性単数形であるため、その標示を訳文でも保持する。
- issue: 法的禁止の強さ
  choice: 「生かしておいてはならない」と訳す。
  alternative: 「必ず死刑にしなければならない」と明示的に訳す。
  rationale: 文脈上は死刑を含意するが、原文は直訳すれば「生かしておいてはならない」である。原文にない刑罰執行の定型句や方法を補わない。
translation_notes:
  register: 簡潔で厳粛な法文の調子を保ちつつ、現代の一般読者に明確な表現とした。「女呪術師」のような不自然さを避け、「呪術を行う女」とした。
