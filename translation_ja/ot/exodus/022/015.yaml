  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: ja
  text: 男が婚約していない処女を誘惑して彼女と寝たなら、必ず花嫁料[a]を支払い、彼女を自分の妻としなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「花嫁料」は、花嫁を妻とするために、婚姻に際して花婿側が支払う金品を指す。花嫁が持参する財産をいう「持参金」とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: 誘惑し
  rationale: ピエル形は、ここでは性的関係へ誘い込むことを表す。「誘惑する」は文脈に合い、原文に明記されていない暴力や強制を付け加えない。
- source_word: אִישׁ
  choice: 男
  rationale: 単数男性を指す語であり、この法規の当事者を明確に表す。
- source_word: בְּתוּלָה
  choice: 処女
  rationale: この婚姻・性関係に関する法的文脈では、女性の性的・婚姻上の状態を示す語として「処女」が適切である。
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: 婚約していない
  rationale: 正式に婚姻を約束されていない状態を、現代日本語で明瞭かつ自然に表す。
- source_word: וְשָׁכַב עִמָּהּ
  choice: 彼女と寝た
  rationale: 性関係を表すヘブライ語の慣用表現を、婉曲性と品位を保ちながら自然な日本語にした。
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: 必ず婚資を納め
  rationale: 不定詞絶対形と未完了形の組み合わせによる義務の強調を「必ず」で示した。מֹהַר は花嫁側へ支払われる婚姻に伴う金品なので、「持参金」ではなく「婚資」とした。
- source_word: לּוֹ לְאִשָּׁה
  choice: 彼女を妻としなければならない
  rationale: 婚資を納める目的・結果として、その女性を自分の妻とする義務を自然な法文調で示した。
theological_decisions:
- issue: פתה が示す性行為の性質
  choice: 暴力的な強姦とは断定せず、「誘惑する」と訳す
  alternative: 犯す／辱める
  rationale: פתה のピエル形は誘う、言いくるめるという意味を持つ。本文に明示されない暴力を訳文へ加えず、強制性交を扱う他の法規との区別と、誘惑に含まれ得る力関係の曖昧さをともに保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法規としての簡潔さと尊厳を保った。「婚資」は一般語よりやや専門的だが、「持参金」との混同を避けて原語の制度を正確に示すため採用し、脚注で説明した。
