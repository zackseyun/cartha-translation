  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: ja
  text: ヤハウェにかけての誓いが、両者の間でなされる。すなわち、その者が隣人の財産に手を出していないという誓いである。所有者はその誓いを受け入れ、預かった者は賠償しなくてよい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: 主の誓い
  rationale: 構文どおり「主の誓い」とし、法的な宣誓を表す。日本語では神名を伝統的な表記「主」で示す。
- source_word: בֵּין שְׁנֵיהֶם
  choice: 二人の間に
  rationale: 紛争当事者が二者であることを明示する。
- source_word: אִם לֹא
  choice: …なかったことを誓う
  rationale: 単純な条件ではなく、誓いの内容を導く定型句として自然な日本語にした。
- source_word: שָׁלַח יָדוֹ בִּמְלֶאכֶת רֵעֵהוּ
  choice: 隣人の所有物に手をつけなかった
  rationale: 他人の物を不正に使用・横領することを指すヘブライ語の比喩を、日本語でも理解可能な形で保った。
- source_word: וְלָקַח בְּעָלָיו
  choice: その所有者はその誓いを受け入れ
  rationale: 目的語は明示されていないが、文脈上、所有者が宣誓を十分なものとして受理する意味である。
- source_word: וְלֹא יְשַׁלֵּם
  choice: 相手は償いをしなくてよい
  rationale: 法的文脈における補償・賠償の不必要を、主語を補って明瞭に表した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語聖書で広く理解される伝統的な代替表記を用いた。神名を称号で表すという翻訳上の判断は本文の法的意味を変えない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で厳粛な法文調とした。「手をつける」で原文の比喩を保ちつつ、「所有物」「償い」によって法的文脈を明瞭にした。
