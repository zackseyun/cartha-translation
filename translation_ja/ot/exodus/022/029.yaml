base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: ja
  text: あなたの牛と羊や山羊の群れについても、同じようにしなければならない。[a] 七日間、その子を母親のもとに置いておき、八日目にわたしにささげなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この命令は、直前の節にある初子をささげる命令を受けています。この節のヘブライ語には、「初子」という語は繰り返されていません。
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: 同じようにしなければならない
  rationale: 直前の初子についての命令を受ける比較・継続の意味と、法的命令の力を自然な現代日本語で示す。
- source_word: לְשֹׁרְךָ לְצֹאנֶךָ
  choice: あなたの牛と羊の群れにも
  rationale: 前置詞 לְ の適用対象を「にも」で表した。שׁוֹר は大型家畜の牛、צֹאן は羊・山羊を含み得る小家畜の集合語だが、日本語では簡潔で自然な「羊の群れ」とした。
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: 七日間、その子は母親と共にいさせ
  rationale: 字義は「七日間、それは母親と共にいる」である。命令の文脈を踏まえて使役形により自然に表しつつ、母親のもとに置く継続的意味を保った。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 八日目に
  rationale: 標準的な時を示す表現として簡潔かつ正確に訳した。
- source_word: תִּתְּנוֹ לִי
  choice: わたしに献げなければならない
  rationale: נתן の基本義は「与える」だが、神への初子の奉献という文脈では、日本語の「献げる」が対象と行為を自然に伝える。原文にない犠牲方法までは明示しない。
theological_decisions:
- issue: 命令の対象が初子であること
  choice: 本文には「初子」を補わず、直前の文脈との連続を「同じように」で示す。
  alternative: 「牛や羊の初子にも」と明示する。
  rationale: この節のヘブライ語は「初子」を反復せず、כֵּן によって前節の命令を受けている。補足によって解釈を本文へ織り込むより、原文の省略と文脈依存性を保つ。
- issue: תִּתְּנוֹ לִי の奉献的含意
  choice: 「わたしに献げなければならない」と訳す。
  alternative: 「わたしに与えなければならない」と字義的に訳す。
  rationale: 語そのものは「与える」だが、神が語り手であり初子を求める祭儀的文脈なので、「献げる」は意味を過度に限定せず、自然な日本語で関係を表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法的命令には「しなければならない」を用い、神への行為には自然な宗教語彙「献げる」を採用した。脚注記号は該当する命令全体の後に置いた。
