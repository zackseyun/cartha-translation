    rationale: אִם לֹא שָׁלַח יָדוֹ は「彼が手を出していないか（どうか）」という審理対象を示すが、「確認してもらう」という依頼・受益の表現は明示しない。法的手続の機能を説明的に確定せず、出頭と問いの関係をそのまま訳す必要がある。
  - severity: low
    issue: 「神のもとに出て」は意味を伝えるが、法的な出頭・接近としては「神の前に進み出る」の方が明確である。
    rationale: נִקְרַב はニファルで、本人が近づくとも連れて来られるとも取り得る。主体・手続の細部を固定せず、「進み出る」はこの曖昧さと法的文脈を比較的よく保つ。
  revised_text: もし盗人が見つからなければ、家の所有者は、隣人の財産に手をつけなかったかどうかについて、神の前に進み出る[a]。
