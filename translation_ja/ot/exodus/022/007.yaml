  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: ja
  text: もし盗人が見つからなければ、家の所有者は、隣人の財産に手をつけなかったかどうかについて、神の前に進み出る[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「裁判官たちの前に進み出る」。ヘブライ語は字義的には「神のもとに」と読むが、法的文脈では、神の権威のもとで裁く裁判官たちを指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: 盗人が見つからなければ
  rationale: מצאのニファル形を受動的に訳し、盗人が特定されたのか捕らえられたのかは限定しない。
- source_word: וְנִקְרַב
  choice: 出て
  rationale: קרבのニファル形は「近づく」または「近くに連れて来られる」の意を持ち得る。ここでは法的な場に進み出ることを自然な現代日本語で表した。
- source_word: בַּעַל הַבַּיִת
  choice: 家の所有者
  rationale: 家を所有し管理する当事者を指すため、現代の法的文脈でも明確な表現を選んだ。
- source_word: אֶל הָאֱלֹהִים
  choice: 神のもとに
  rationale: ヘブライ語の直接的な語義である「神」を本文に残す。法的文脈で「裁判官たち」を指す可能性は脚注に示した。
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: 手をつけなかったかどうか
  rationale: 不正な取得や使用を表すヘブライ語の身体的比喩を、日本語として理解できる慣用表現で保った。「盗んだ」と限定することは避けた。
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: 隣人の財産
  rationale: מְלָאכָהは通常「仕事・営み」だが、ここでは前節で預けられた物品を含む所有物を指す。「財産」は文脈上の範囲を自然に表す。
theological_decisions:
- issue: 法的文脈における אֱלֹהִים の意味
  choice: 神のもとに
  alternative: 裁判官たちのもとに／裁判官たちの前に
  rationale: 本文の語は字義的には「神」であり、その読みを本文に保持した。一方、契約法の文脈では神の権威のもとで裁く裁判官を指す可能性があるため、脚注で明示し、曖昧さを解消しすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「盗人」は法文として簡潔で、「手をつける」は原文の比喩を自然に伝える。「確かめてもらう」は原文に明示されないものの、後続の間接疑問が示す法的審理の機能を日本語で補った。
