id: EXO.22.20
reference: Exodus 22:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: ja
  text: 寄留者を不当に扱ったり、虐げたりしてはならない[a]。あなたがたもエジプトの地で寄留者だったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者」は、自国を離れ、イスラエルの民の中に住んでいる人を指す。「在留外国人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: 寄留者
  rationale: 自国民ではなく、イスラエルの共同体の中に住む者を指す。同じ語の単数形と複数形を同じ訳語で表し、単なる旅行者ではない居住者という意味を保った。
- source_word: תוֹנֶה
  choice: 不当に扱う
  rationale: 不正を行い、不利益を与えるという広い意味を持つため、経済的搾取だけに限定しない自然な表現とした。
- source_word: תִלְחָצֶנּוּ
  choice: 虐げる
  rationale: 強く圧迫し、抑圧することを表す語であり、法的命令の重みを保つ。日本語では目的語を繰り返さなくても、先行する「寄留者」を自然に受けられる。
- source_word: כִּי
  choice: からである
  rationale: 先の命令の根拠を示す接続表現として、簡潔で格調ある現代日本語にした。
- source_word: הֱיִיתֶם
  choice: あなたがたも…だった
  rationale: イスラエルの民がエジプトで置かれていた過去の境遇を直接表す。「も」により、命令の対象となる寄留者との対応を自然に示した。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地で
  rationale: 原文に明示される「地」を残しつつ、日本語として自然な形にした。
theological_decisions:
- issue: 単数男性形で表された寄留者の一般的指示
  choice: 「寄留者」という単数の総称を保ち、後続の目的語は日本語で省略する
  alternative: 「外国人たちを…彼らを」のように複数化する、または「彼を」と明示する
  rationale: ヘブライ語は単数形と三人称男性単数接尾辞を用いるが、法文では一般的な一人を指す。日本語の「彼を」は男性に限定する印象が生じやすいため、数を変えず、自然な目的語省略によって原文の一般性を保った。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で格調ある法文調。「寄留者」は聖書文脈で定着した語だが、意味が伝わるよう脚注で説明した。二つの禁止動詞の違いを「不当に扱う」「虐げる」として保持した。
