  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: ja
  text: 動物と性行為をする者は、必ず死刑に処せられる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「必ず殺される」。このヘブライ語の法的定型句は、死刑が確実に執行されることを強く表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: 寝る者
  rationale: כָּלと分詞の組み合わせは一般化された「～する者」を表す。שׁכב עִםの性的な婉曲表現を、日本語でも簡潔な「～と寝る」で保った。
- source_word: עִם בְּהֵמָה
  choice: 動物と
  rationale: בְּהֵמָהはここでは特定の家畜に限定せず、一般的な「動物」とするのが明瞭である。עִםは相手を示す「と」と訳した。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形と受動形の組み合わせによる強調を「必ず」で示し、法的・受動的な刑罰の意味を「死刑に処せられる」で明確にした。
theological_decisions:
- issue: 死刑を定める法的定型句の訳し方
  choice: 必ず死刑に処せられる
  alternative: 必ず死ななければならない／必ず殺される
  rationale: ヘブライ語は文字どおりには死の確実性を強調するが、文脈上は司法的な死刑宣告である。本文ではその法的性格を明示し、より直訳的な可能性を脚注に残した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「寝る」は原文の性的婉曲表現と厳粛さを保ち、「死刑に処せられる」は法文として自然で、受動的・司法的な意味を伝える。
