source:
  edition: WLC
  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: ja
  text: それは彼のただ一つの覆いであり、彼の肌を覆う衣だからである。彼は何を掛けて寝るのか。彼がわたしに叫び求めるなら、わたしは聞く。わたしはあわれみ深い[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵み深い」または「慈悲深い」とも訳せる。
    reason: חַנּוּן の有力な訳語の幅を示すため。
lexical_decisions:
- source_word: כְּסוּתָהּ לְבַדָּהּ
  choice: 彼のただ一つの覆い
  rationale: 「覆い」と「それだけ／ただ一つ」を一続きにし、ほかに夜具となる物がないという文脈上の意味を自然な日本語で表した。接尾辞の文法上の女性形は、先行する衣を指すものとして理解した。
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: 肌を包む上着
  rationale: שִׂמְלָה は身にまとう衣、特に外衣を指しうる。לְעֹרוֹ の具体的な「肌」の像を保ちつつ、日本語として不自然な「肌のための上着」を避けた。
- source_word: בַּמֶּה יִשְׁכָּב
  choice: 彼は何を掛けて寝るのか
  rationale: 直訳的には「何をもって横たわるのか」。衣が夜には寝具となる状況を踏まえ、修辞疑問の切迫感が伝わる表現とした。
- source_word: יִצְעַק אֵלַי
  choice: わたしに叫び求める
  rationale: צעק が表す、苦境から助けを求める叫びを明示した。
- source_word: וְשָׁמַעְתִּי
  choice: わたしは聞く
  rationale: 神が訴えを聞き届ける含みを持つが、原文どおり簡潔な「聞く」とし、その応答の仕方を過度に明示しなかった。
- source_word: חַנּוּן
  choice: あわれみ深い
  rationale: 弱い立場の者の叫びに応じる神の恵みと慈しみを、現代の読者に明瞭な語で表した。
theological_decisions:
- issue: 神の自己描写 חַנּוּן の訳語
  choice: あわれみ深い
  alternative: 恵み深い／慈悲深い
  rationale: この語は、苦しむ者に好意とあわれみをもって応じる神の性質を表す。「あわれみ深い」は当該の法的・倫理的文脈に適するが、「恵み深い」「慈悲深い」も語義上可能なため、脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。衣が昼は上着、夜は掛け物になる具体像を「肌を包む」「何を掛けて寝るのか」で自然に示した。
