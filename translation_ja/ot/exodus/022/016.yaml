  register: 現代の一般読者に理解できる、簡潔で格調ある法文調とした。「断固として」でヘブライ語の強意を保持し、「嫁がせる」で婚姻文脈を明確化した。「銀を量って支払う」は古代の支払い方法と法的義務の双方を伝える。脚注記号は該当表現の直後に配置した。
