base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: ja
  text: もし彼女の父親が、彼女を彼に嫁がせることを断固として拒むなら[b]、彼は処女に対して定められた花嫁料と同額の銀を量って支払わなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう支払いは、硬貨ではなく、重さを量った銀によるものである。原文は直訳すると「銀を量る」。
    reason: cultural_note
  - marker: b
    text: 直訳すると「彼女を彼に与える」。この文脈では、父親が彼女と彼との結婚を認めることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし……なら
  rationale: 判例法の条件を導く標準的な条件表現として訳した。
- source_word: מָאֵן יְמָאֵן
  choice: 断固として拒む
  rationale: 不定詞絶対形と定動詞の重複による強意を、現代日本語の副詞的表現で明示した。
- source_word: אָבִיהָ
  choice: 彼女の父親
  rationale: 三人称女性単数接尾辞を明示し、自然で誤解のない日本語とした。
- source_word: לְתִתָּהּ לוֹ
  choice: 彼女を彼に嫁がせる
  rationale: 字義は「彼女を彼に与える」だが、この婚姻法規の文脈で表す父親の婚姻同意を、日本語で自然かつ明確に示した。字義的表現は脚注に残した。
- source_word: כֶּסֶף
  choice: 銀
  rationale: 貨幣一般に抽象化せず、原文の具体的な「銀」を保持した。
- source_word: יִשְׁקֹל
  choice: 量って支払わなければならない
  rationale: 動詞の字義である「量る」を保持しつつ、法的な支払い義務であることが日本語で明確になるようにした。
- source_word: כְּמֹהַר
  choice: 婚資に相当する
  rationale: מֹהַרは婚姻に際して花嫁側の家族に納める財を指す。「婚資」は簡潔で比較的中立的な訳語であり、前置詞כְの基準・相当の意味も表した。
- source_word: הַבְּתוּלֹת
  choice: 処女の
  rationale: 定冠詞付き複数形による一般的な類型、すなわち処女について定められた婚資を簡潔に表した。
theological_decisions: []
