id: EXO.22.27
reference: Exodus 22:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: ja
  text: 神[a]をののしってはならない。また、あなたの民の中の指導者を呪ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「裁判官たち」。אֱלֹהִים（エロヒーム）は、文脈によっては人間の権威者を指すことがある。ただし、ここでは後半との並行関係から「神」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 文脈では単数の「神」と理解するのが自然で、後半の人間の指導者に対する禁令との並行も保たれる。ただし「裁判官たち」とする歴史的に重要な解釈は脚注に残した。
- source_word: תְקַלֵּל
  choice: ののしる
  rationale: קללのピエル形は、呪う、侮辱する、軽んじるという意味を持つ。ここでは侮蔑的な発言を自然な現代日本語で表し、後半のארר「呪う」との語彙上の違いも保つ。
- source_word: נָשִׂיא
  choice: 指導者
  rationale: 共同体の中で高い地位に置かれた長・統治者を指す。「君主」ほど制度を限定せず、現代の読者にも明瞭である。
- source_word: בְעַמְּךָ
  choice: あなたの民の中の
  rationale: 前置詞בを所属する共同体内の人物という意味に取り、自然な日本語で表した。
- source_word: תָאֹר
  choice: 呪う
  rationale: אררは人に災いを呼び求める意味で用いられる標準的な「呪う」に相当し、前半の「ののしる」と区別できる。
theological_decisions:
- issue: אֱלֹהִיםの指示対象
  choice: 神
  alternative: 裁判官たち（または神々）
  rationale: 直近の法的文脈と「民の中の指導者」との並行関係から、主文ではイスラエルの神を指すと判断した。一方、אֱלֹהִיםが人間の権威者を指し得ることから、「裁判官たち」という解釈を脚注で明示し、曖昧さを保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ののしる」と「呪う」を使い分け、原文の二つの動詞の差を反映した。
