  register: 現代の一般読者に分かりやすい法文調を用い、「ろば」「償う」など聖書本文にふさわしい落ち着いた語彙を選んだ。条件、対象となる家畜の列挙、生存状態、二倍賠償という原文の論理順序を保った。
