source:
  edition: WLC
  text: אִֽם הִמָּצֵא֩ תִמָּצֵ֨א בְ/יָד֜/וֹ הַ/גְּנֵבָ֗ה מִ/שּׁ֧וֹר עַד חֲמ֛וֹר עַד שֶׂ֖ה חַיִּ֑ים שְׁנַ֖יִם יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: ja
  text: もし盗まれた物が、牛、ろば、羊のいずれであっても、生きたまま彼の手元で[a]確かに見つかったなら、彼は二倍の賠償をしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「盗まれた物が彼の手に確かに見つかるなら」。ヘブライ語では「見つかる」という動詞を重ねて発見を強調しており、「彼の手に」はその者の所有または支配下にあることを表す。
    reason: 原文の強意構文と、占有・支配を表す「手」の慣用句を示すため。
lexical_decisions:
- source_word: אִם
  choice: もし…なら
  rationale: 判例法の条件を導入する標準的な条件表現として自然な現代日本語にした。
- source_word: הִמָּצֵא תִמָּצֵא
  choice: 確かに…見つかった
  rationale: 不定詞絶対形とニファル完了形の組み合わせによる強意を、「確かに」で明示した。
- source_word: בְיָדוֹ
  choice: 彼の所有のもとで
  rationale: 字義は「彼の手に」だが、ここでは支配・占有を示す法的な慣用句であるため、その意味を明確にした。
- source_word: הַגְּנֵבָה
  choice: 盗まれた物
  rationale: 盗む行為ではなく、盗まれた対象物を指すため、簡潔で自然な表現を選んだ。
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: 牛であれ、ろばであれ、羊であれ
  rationale: 列挙された家畜のいずれの場合にも当てはまるという法的な分配の意味を自然に表した。
- source_word: חַיִּים
  choice: 生きたまま
  rationale: 盗まれた家畜が屠られず、生存した状態で発見されたことを明瞭に示す。ヘブライ語では列挙された動物を集合的に受けて複数形となっている。
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: 二倍にして償わなければならない
  rationale: 二倍の賠償を命じる法的義務を、明瞭で格調を保った現代日本語で表した。
theological_decisions: []
