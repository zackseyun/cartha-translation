base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: ja
  text: あなたがたは、わたしにとって聖なる者[a]でなければならない。野で引き裂かれた肉を食べてはならない。それは犬に投げ与えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる者」に当たるヘブライ語は、直訳すると「聖なる男たち」です。文法上は男性複数形ですが、契約共同体を代表して指している可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: 聖なる者たち
  rationale: 直訳は「聖なる男たち／聖なる者たち」。男性複数形であることは注で明示しつつ、共同体への呼びかけとして自然な現代日本語にした。
- source_word: תִּהְיוּן לִי
  choice: わたしに属する……でなければならない
  rationale: לִי の契約的な帰属関係と、法文における義務の力を自然な日本語で表した。
- source_word: וּבָשָׂר בַּשָּׂדֶה טְרֵפָה
  choice: 野で引き裂かれた獣の肉
  rationale: בָשָׂר は食用規定の文脈で「肉」、בַּשָּׂדֶה は「野で」、טְרֵפָה は行為者を明示せず「引き裂かれた」と訳した。「獣」は肉の由来を示す日本語上の補足で、引き裂いた行為者を指すものではない。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならない
  rationale: 禁止を表す未完了形を、明快な現代日本語の法文調で訳した。
- source_word: לַכֶּלֶב
  choice: 犬に
  rationale: 原文の単数形を保持した。ここでは種類を一般的に指す総称的単数と理解できる。
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: それは……投げ与えなさい
  rationale: 「投げる」の意味を保ちつつ、犬に処分するという文脈で自然な「投げ与える」とした。
theological_decisions:
- issue: 契約法における聖さと神への帰属
  choice: 「わたしに属する聖なる者たち」と訳す
  alternative: 「わたしにとって聖なる男たち」「わたしの聖なる民」
  rationale: 「聖」を直接保ち、לִי が示す神との帰属関係も明示した。男性形を本文で「男たち」に限定すると共同体への代表的呼びかけである可能性を狭めるため、原文の文法情報は注に残した。
translation_notes:
  register: 明快な現代標準日本語。法文としての厳粛さを保ちながら、過度に古風な表現を避けた。原文の「引き裂かれた」は行為者を明示しないため、「野獣に引き裂かれた」とは限定しなかった。
