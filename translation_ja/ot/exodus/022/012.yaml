  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: ja
  text: しかし、もしそれが獣に確かに引き裂かれたなら、彼はそれを証拠として持って来なければならない。引き裂かれたものについては、償わなくてよい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: しかし、もし
  rationale: 直前の法的事例と対照をなす条件節として、自然な現代日本語の「しかし、もし」とした。
- source_word: טָרֹף יִטָּרֵף
  choice: 獣に引き裂かれたのであれば
  rationale: 不定詞絶対形と定動詞の組み合わせが示す確実性・強調を条件表現全体で表した。טרףが動物に襲われて裂かれる場面を指し得ることを本文に示しつつ、別の直訳的理解は脚注に残した。
- source_word: יְבִאֵהוּ עֵד
  choice: その証拠を持って来なければならない
  rationale: 接尾辞を引き裂かれた動物またはその残骸を指すものと理解し、עֵדの法的機能を自然な日本語で「証拠」と表現した。義務を示す法文として「なければならない」を用いた。
- source_word: הַטְּרֵפָה
  choice: 引き裂かれたもの
  rationale: 動物の死骸や残骸と限定しすぎず、ヘブライ語の簡潔で包括的な名詞表現を保った。
- source_word: לֹא יְשַׁלֵּם
  choice: 償わなくてよい
  rationale: Piel形の法的な補償・弁償の意味を「償う」で表し、この場合には賠償義務がないことを明瞭にした。
