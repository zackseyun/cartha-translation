  text: כָּל אַלְמָנָ֥ה וְ/יָת֖וֹם לֹ֥א תְעַנּֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/021.yaml
  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: ja
  text: どのやもめも、父のいない子も[a]、苦しめてはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「孤児」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「虐げてはならない」または「不当に扱ってはならない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: どの…も
  rationale: 単数名詞を伴う禁止文での分配的・包括的な意味を、自然な現代日本語で表す。
- source_word: אַלְמָנָה
  choice: やもめ
  rationale: 配偶者を失った女性を指す標準的な語義。聖書本文として簡潔で明確な表現を採用した。
- source_word: יָתוֹם
  choice: 父のいない子
  rationale: 古代ヘブライ語の法的・社会的文脈では、特に父を失って保護を欠く子を指し得るため、そのニュアンスを本文に保った。「孤児」も可能なので脚注に示す。
- source_word: לֹא
  choice: …てはならない
  rationale: 禁止命令として自然で明確な日本語にした。
- source_word: תְעַנּוּן
  choice: 苦しめる
  rationale: ピエル形の「苦痛を与える、ひどく扱う」という広い意味を保ち、経済的・社会的な圧迫だけに限定しない。「虐げる」「不当に扱う」も文脈上可能なため脚注に示す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の包括性を「どの…も」で示し、保護を必要とする者への加害を禁じる動詞の幅を「苦しめる」で保った。
