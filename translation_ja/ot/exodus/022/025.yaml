  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: ja
  text: もし隣人の上着を担保に取るなら、日が沈むまでにそれを隣人に返さなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: もし～なら
  rationale: 条件法の形式を保つ自然な現代日本語。事例法として「～するとき」も可能だが、原文の条件表現を明示した。
- source_word: חָבֹל תַּחְבֹּל
  choice: 担保に取る
  rationale: 不定詞絶対形と未完了形の組み合わせは行為を強調するが、日本語で語を重ねると不自然になるため、法的行為を明瞭に表した。
- source_word: שַׂלְמַת
  choice: 上着
  rationale: 夜間の覆いにもなる外衣を指す。現代日本語で分かりやすく、単なる衣服より範囲を適切に限定する。
- source_word: רֵעֶךָ
  choice: 隣人
  rationale: 社会的・契約共同体的文脈における相手を表す、簡潔で定着した訳語。
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: 日が沈むまでに
  rationale: 字義的には「太陽が来るまで」だが、文脈上は日没を表す慣用句。「までに」により返却期限を自然に示す。
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: それを返さなければならない
  rationale: 使役形の「戻す、返す」と法的義務を、明瞭な現代日本語で表した。対象と受取人は前半から明白なので、日本語では「隣人に」を重ねず自然さを優先した。
