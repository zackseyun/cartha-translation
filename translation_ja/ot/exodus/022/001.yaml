  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: ja
  text: 盗人が侵入しているところを見つかり、打たれて死んだなら、その盗人を打った者に血の罪はない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼に血はない」。ここでの「血」は、流血に関する法的責任、すなわち血の罪を意味する。「彼」は盗人を打った者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: 押し入っているところ
  rationale: 語義は、壁を掘り破るなどして密かに侵入する行為を指す。現代日本語では、侵入の具体的方法を限定しすぎない「押し入っているところ」が法的状況を自然に表す。
- source_word: יִמָּצֵא
  choice: 見つけられ
  rationale: ニファル形の受動的意味を保ち、条件法の文脈で「見つけられ」とした。
- source_word: הַגַּנָּב
  choice: 盗人
  rationale: גנב の基本義を表す。「泥棒」よりも法文として品位があり、「強盗」のように暴力を含意しない。
- source_word: וְהֻכָּה
  choice: 打たれて
  rationale: נכה の受動形を直接反映する。反復を含意しやすい「殴られて」は避けた。
- source_word: וָמֵת
  choice: 死んだ場合
  rationale: 打撃の結果として死に至る連続を、条件法として自然な日本語にした。故意や目的までは読み込まない。
- source_word: אֵין לוֹ דָּמִים
  choice: その人を打った者に血の罪はない
  rationale: דמים の法的な意味である、流血に対する責任・血責を「血の罪」として保持した。曖昧になり得る代名詞の指示対象は、法判断を受ける打撃者であることが日本語で明確になるよう補った。
theological_decisions:
- issue: 侵入中の盗人が死亡した場合の法的判断
  choice: この場合、盗人を打った者には「血の罪はない」と訳す。
  alternative: 「殺人罪には問われない」と訳す。
  rationale: ヘブライ語はこの特定状況における流血責任の不存在を述べている。現代刑法上の「殺人罪」に狭めたり、殺害一般への道徳的承認へ広げたりせず、契約法的な緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語による簡潔な法文調。「盗人」は日常的な「泥棒」よりやや格調があり、原語の一般的な『盗む者』という意味も保つ。「押し入る」は、壁を掘り破る方法に限定せず、密かな不法侵入を自然に示す。
