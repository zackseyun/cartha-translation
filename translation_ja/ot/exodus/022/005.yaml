base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: ja
  text: 火が出て、いばらに燃え移り[a]、積み上げられた穀物、畑に立っている穀物、あるいは畑が焼けたなら、火をつけた者は必ず損害を賠償しなければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「いばらを見いだし」。文脈上、火がいばらに達して燃え移ることをいう。
    reason: lexical_alternative
  - marker: b
    text: 「必ず損害を賠償しなければならない」に当たるヘブライ語は、同じ語根の不定詞絶対形と定動詞を重ねて、賠償義務を強調している。
    reason: source_emphasis
lexical_decisions:
- source_word: כִּי
  choice: なら
  rationale: 個別の事例を提示する法文の条件表現として、現代日本語で自然な「なら」とした。
- source_word: תֵצֵא אֵשׁ
  choice: 火が燃え広がって
  rationale: 直訳的には「火が出て」であるが、後続する延焼の文脈を明瞭にし、火が制御を離れて広がる意味を自然に表した。
- source_word: וּמָצְאָה קֹצִים
  choice: いばらに燃え移り
  rationale: 字義は「いばらを見いだし」。火がいばらに達して着火する状況を、原文の進行を保ちながら自然な日本語で表した。別の直訳寄りの理解は脚注に示した。
- source_word: קֹצִים
  choice: いばら
  rationale: 原語の植物像を保持する簡潔で一般的な訳語とした。文脈上は火を運ぶ乾燥したいばらや茂みを指し得る。
- source_word: וְנֶאֱכַל
  choice: 焼けた
  rationale: 火によって「食い尽くされる、焼き尽くされる」という受動表現。日本語では被害の発生を簡潔に表す「焼けた」が自然である。
- source_word: גָּדִישׁ
  choice: 積み上げた穀物
  rationale: 収穫後に集めて積んだ穀物を指すため、立ち穂との対照が分かる表現とした。
- source_word: הַקָּמָה
  choice: 立ち穂
  rationale: まだ畑に立っている穀物を簡潔な農耕語彙で表し、収穫済みの穀物との対照を保持した。
- source_word: הַשָּׂדֶה
  choice: 畑
  rationale: 被害を受ける耕作地を指す文脈に即した、明瞭で一般的な訳語。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 必ず償わなければならない
  rationale: 不定詞絶対形と定動詞の組み合わせによる義務の強調を、「必ず」と義務表現で示した。
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: 火をつけた者
  rationale: 火災の原因となる火を起こした責任主体を、現代日本語で簡潔かつ明確に表した。
