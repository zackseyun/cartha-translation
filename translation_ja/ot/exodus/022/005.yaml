  to: 火が出て、いばらに燃え移り[a]、積み上げられた穀物、畑に立っている穀物、あるいは畑が焼けたなら、火をつけた者は必ず損害を賠償しなければならない[b]。
  rationale: 原文の事例法としての条件構造と、火がいばらに達した後に穀物または畑を焼くという進行を保ったまま、「立ち穂」をより包括的で明確な「畑に立っている穀物」に改めた。「火が出て」により、火の発生と延焼を重複なく表した。賠償の対象は原文で明示されないため、「損害を賠償する」として日本語の法的表現を自然に補った。
