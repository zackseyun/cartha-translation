  text: וְ/חָרָ֣ה אַפִּ֔/י וְ/הָרַגְתִּ֥י אֶתְ/כֶ֖ם בֶּ/חָ֑רֶב וְ/הָי֤וּ נְשֵׁי/כֶם֙ אַלְמָנ֔וֹת וּ/בְנֵי/כֶ֖ם יְתֹמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: ja
  text: そのとき、わたしの怒りは燃え上がり、わたしは剣であなたがたを殺す。あなたがたの妻たちはやもめとなり、あなたがたの息子たちは父のいない子となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: わたしの怒りは燃え上がり
  rationale: חרה と אף の慣用表現を、怒りが激しく起こるという意味と「燃える」比喩の双方が自然に伝わる現代日本語で表した。
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: わたしは……あなたがたを殺す
  rationale: הרג は通常の「殺す」を意味し、二人称男性複数の目的語を「あなたがた」として明示した。
- source_word: בֶּחָרֶב
  choice: 剣で
  rationale: 前置詞 בְּ が手段を示すため、具体的な裁きの手段を簡潔に保持した。
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: あなたがたの妻はやもめとなり
  rationale: היה は結果として生じる状態を表すので「となる」とし、נָשִׁים はこの家族関係の文脈で「妻」、אַלְמָנוֹת は「やもめ」と訳した。
- source_word: וּבְנֵיכֶם יְתֹמִים
  choice: あなたがたの息子は父のない者となる
  rationale: בנים の男性を示す語義を「息子」で保ち、יתומים は父を失って社会的保護を欠く状態を明確にするため「父のない者」とした。
theological_decisions:
- issue: 神の怒りを表す身体的慣用句
  choice: 「わたしの怒りは燃え上がり」と訳す
  alternative: 「わたしの鼻は熱くなり」「わたしの憤りは燃え」
  rationale: 「鼻」を直訳すると現代日本語では意味が不明瞭になるため、「怒り」と明示しつつ、原文の熱・燃焼の比喩を残した。
- issue: בנים の性別を伴う表現
  choice: 「息子」とする
  alternative: 「子ども」
  rationale: 原文は男性複数形を用いており、この文脈で中性化を必要とする根拠がないため、その限定を保持した。
- issue: יתומים が示す欠損の範囲
  choice: 「父のない者」とする
  alternative: 「孤児」とする
  rationale: 直前に夫たちが剣で殺されて妻がやもめになる因果関係が示されているため、両親を失ったことまで含意し得る「孤児」より、父を失った状態を明示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の裁きの厳しさと原文の並行構造を保持した。「やもめ」は現在も聖書・法的社会的文脈で理解可能な語として採用し、文末は断定的な預言・警告の調子に整えた。
