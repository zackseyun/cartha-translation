source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: ja
  text: しかし、もし太陽がその盗人の上に昇っていたなら[a]、殺した者には血を流した罪がある[b]。盗人は必ず償わなければならない。もし賠償する資力がなければ、その盗みのために売られる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「もし太陽が彼の上に昇っていたなら」。法的な意味は、日の出後、すなわち明るい時に起きた場合。
    reason: lexical_alternative
  - marker: b
    text: この場合、盗人を殺した者が流血について責任を負う。
    reason: referent_clarification
  - marker: c
    text: これは、盗人に賠償する資力がない場合、その債務を償うために売られることを指す。
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: しかし、もしその盗人の上に太陽が昇っていたなら
  rationale: 前節の夜間の事例と対照をなす条件として「しかし」を補い、ヘブライ語の具体的な表現「太陽が彼の上に昇る」を保った。「その盗人」は文脈上の指示対象を明確にするための補足。
- source_word: דָּמִים לוֹ
  choice: 殺した者には流血の罪がある
  rationale: 法的文脈の複数形 דָּמִים を、殺害についての責任・血責を表す「流血の罪」とした。日本語で指示対象が不明瞭にならないよう「殺した者」を明示した。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 盗人は必ず償わなければならない
  rationale: 不定詞絶対形と未完了形の組み合わせによる強調を「必ず…なければならない」で表し、金銭の支払いに限定しない賠償の意味を「償う」で示した。文脈上の主語である盗人を明示した。
- source_word: אִם אֵין לוֹ
  choice: もし償うものがなければ
  rationale: 直訳の「彼に何もなければ」が指す、賠償に充てる資力がない状態を簡潔で自然な日本語にした。
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: その盗みのために売られる
  rationale: 受動形を保持し、売られることが盗みから生じた賠償債務に基づくことを表した。本文だけでは明示されない制度的詳細は脚注に置いた。
theological_decisions:
- issue: 日中に盗人を殺した場合の法的含意
  choice: 太陽が昇っていた場合、殺した者には流血の罪があると訳す。
  alternative: 日の出を、危険の有無が明確になった状況一般の比喩・原則として解釈する。
  rationale: 本文の具体的な昼夜の対照を保ち、それを本文が明言しない一般倫理へ拡張しなかった。
- issue: 「償う」者の主語
  choice: 文脈に即して盗人を主語として明示する。
  alternative: 主語を省略し、直前の「殺した者」が償うとも読める形を残す。
  rationale: 後続の「もし彼に何もなければ」「売られる」と盗みの賠償規定から、償う主体は盗人である。日本語では主語転換を明示しないと誤読が生じるため補った。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で厳粛な法文調とした。「血責」のような専門的・古風な語は避け、「流血の罪」とした。原文の具体的な日の出の表現は本文に残し、意味上の説明を脚注に置いた。
