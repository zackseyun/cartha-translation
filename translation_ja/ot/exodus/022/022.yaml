id: EXO.22.22
reference: Exodus 22:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: ja
  text: もしあなたがその人[a]を苦しめ、その人がわたしに向かって叫ぶなら、わたしは必ずその叫びを聞く[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「その人」「その叫び」に男性単数形が使われているが、ここでは前節に挙げられたやもめまたはみなしごの一人一人を指す。
    reason: cultural_note
  - marker: b
    text: 原文では「苦しめる」「叫ぶ」「聞く」のそれぞれで、同じ語根の不定詞絶対形と定動詞を重ね、行為や確実性を強く表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし
  rationale: 明確な条件を導く語として、自然な現代日本語の「もし」で表した。
- source_word: עַנֵּה תְעַנֶּה
  choice: 苦しめ
  rationale: ענהの加害的な意味を文脈に即して表した。「虐げる」も可能だが、「苦しめる」は身体的・社会的な加害の双方を含み、原語の意味の広がりを保つ。原語の強意構文については脚注で明示した。
- source_word: אֹתוֹ
  choice: その人
  rationale: 接尾辞は男性単数だが、前節の「やもめ、みなしご」の一人一人を受ける総称的単数である。日本語で「彼」とすると、やもめを不自然に男性化するため、「その人」とした。
- source_word: כִּי אִם
  choice: その人が…なら
  rationale: 前の条件に続いて、叫びが神の応答を招く条件を示す。日本語では一つの自然な条件文にまとめたが、二段階の論理関係は保持した。
- source_word: צָעֹק יִצְעַק
  choice: 叫ぶ
  rationale: 助けを求める切迫した声を自然に表す。強意は原語の反復構文に由来するため、過度に感情を補わず脚注で説明した。
- source_word: אֵלַי
  choice: わたしに向かって
  rationale: 叫びの向かう相手が神であることを明確かつ自然に示す。
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: わたしは必ず…聞く
  rationale: 不定詞絶対形と定動詞による強い確言を、日本語の「必ず」で明瞭に表した。
- source_word: צַעֲקָתוֹ
  choice: その叫び
  rationale: 同節のצעקとの語根上のつながりが伝わる自然な訳語とした。
theological_decisions:
- issue: 苦しめられる者を指す男性単数形
  choice: その人／その叫び
  alternative: 彼／彼の叫び
  rationale: ヘブライ語は男性単数形だが、前節で挙げられたやもめまたはみなしごの個々人を総称的に指す。日本語の「彼」は男性に限定する響きが強いため、形態情報を脚注に残しつつ、本文では性別を限定しない単数表現を用いた。
- issue: 三つの強意構文
  choice: 神の応答には「必ず」を明示し、三箇所すべての強意を脚注で説明
  alternative: 「まことに苦しめ、まことに叫び、必ず聞く」と各箇所に副詞を置く
  rationale: 原文の強調を省略せず伝える一方、日本語本文で同じ副詞を機械的に反復して不自然になることを避けた。特に結論である神の応答の確実性は「必ず」と明示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神の発言としての簡潔さと重みを保った。「わたし」は神の一人称として平仮名表記とし、「みなしご」など前節の語は脚注内で一般読者に分かりやすい形にした。
