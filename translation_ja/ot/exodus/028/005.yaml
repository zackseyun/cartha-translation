  yaml_path: translation/ot/exodus/028/005.yaml
  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: ja
  text: 彼らは、金、青糸、紫糸、緋色の糸[a]、上質の亜麻布を受け取る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「緋色の虫」。虫から得た染料で染めた緋色の素材を指す慣用表現。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: 彼らは
  rationale: 独立代名詞による主語の明示を保ちつつ、日本語で不自然に強調しない表現とした。
- source_word: יִקְחוּ
  choice: 受け取る
  rationale: 祭司の装束を作る者たちが、指定された材料を受領するという文脈に合う。未完了形の指示的な力は、簡潔な現在形で表した。
- source_word: הַזָּהָב
  choice: 金
  rationale: 装束に用いる指定材料としての金を指す。日本語では定冠詞を別に表さなくても特定性が文脈から明らかである。
- source_word: הַתְּכֵלֶת
  choice: 青糸
  rationale: 抽象的な色名だけでなく、青く染めた繊維素材を指す語であり、装束製作の文脈では「青糸」が明瞭で自然である。
- source_word: הָאַרְגָּמָן
  choice: 紫糸
  rationale: 紫に染めた繊維素材を指す語として、並列する材料名を自然に表した。
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: 緋色の糸
  rationale: 虫由来の染料で緋色に染めた素材を指す慣用表現である。本文では衣服製作用の糸として明示し、由来は脚注に残した。
- source_word: הַשֵּׁשׁ
  choice: 上質の亜麻布
  rationale: 幕屋関連の文脈で上質な亜麻素材を指すため、品質と素材を明確にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、祭具製作の指示にふさわしい簡潔で品位ある文体とした。色名だけではなく繊維材料を指すことが伝わるよう、「青糸」「紫糸」「緋色の糸」と訳した。
