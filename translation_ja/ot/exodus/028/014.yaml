  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: ja
  text: また、純金の鎖二本を、より合わせた綱のような細工で作り[a]、そのより合わせた鎖を留め枠[b]に取り付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、ねじる、より合わせる、または綱状に作ることを示すと思われる関連表現が二つ用いられている。別訳「ねじった綱状の細工で作り」。
    reason: lexical_alternative
  - marker: b
    text: 「留め枠」は「台座」または「飾り枠」とも訳せる。祭司装束に取り付ける金製の枠を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת זָהָב טָהוֹר
  choice: 純金の鎖二本
  rationale: 数量、品物、材質を明確に示す自然な日本語。שַׁרְשְׁרֹת は祭司装束に用いる金製の鎖を指す。
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: より合わせた綱のような細工で
  rationale: 二つの関連表現が、ねじる・より合わせる・綱状にする加工を重ねて描写している。日本語では重複を保ちすぎず、形状と細工法の両方が伝わるようにした。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: 作り
  rationale: 文脈上モーセへの製作命令であり、簡潔な「作る」が適切。
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: その綱状の鎖
  rationale: 鎖が綱のようにより合わされた作りであることを、前半と対応させて表した。
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: 留め枠に
  rationale: 祭司装束に付属する金製の枠・台座を指す。日本語では、鎖を取り付ける金具として理解しやすい「留め枠」を採用した。
