  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: ja
  text: 頭を通す開口部は、衣の中央に設ける。その開口部の周囲には、織り手の仕事による縁を付ける。これをよろいの襟口のようにして、裂けないようにする[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よろいの開口部のように」、または「胴鎧の襟口のように」とも訳せる。ここで「よろい」としたヘブライ語 תַּחְרָא（タフラー）は用例の少ない語である。裂けないようにするという文脈から、首の開口部の周囲を丈夫に仕上げることとの比較と理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: 頭を通す口
  rationale: פֶּה は直訳すれば「口」だが、衣服については開口部を指す。רֹאשׁוֹ と合わせ、着用者の頭を通す箇所であることを自然な日本語で示した。
- source_word: בְּתוֹכוֹ
  choice: その中央に
  rationale: 衣の内部ないし中央部に位置することを表す。ここでは衣の中央に設ける頭用の開口部という具体的な意味を明確にした。
- source_word: שָׂפָה
  choice: 縁
  rationale: 基本義は「唇」「端」で、ここでは開口部を囲む仕上げられた縁を指す。「縁」は素材や工法を過度に限定せず、原語に近い。
- source_word: לְפִיו סָבִיב
  choice: その口の周囲には
  rationale: 繰り返される פֶּה を「口」とし、סָבִיב の周囲全体を囲む意味を表した。
- source_word: מַעֲשֵׂה אֹרֵג
  choice: 織り仕事で
  rationale: 直訳的には「織る者の仕事」。縁が織る工程によって作られることを、現代日本語として簡潔に表現した。
- source_word: כְּפִי תַחְרָא
  choice: よろいの襟口のように
  rationale: תַּחְרָא はまれな語で、よろい、胴鎧、武装用の上衣などと解される。比較の焦点である補強された首の開口部を「襟口」で示し、語自体の不確かさは脚注に残した。
- source_word: לֹא יִקָּרֵעַ
  choice: 裂けないようにする
  rationale: ニファル形の受動・結果的な意味を保ちつつ、前述の縁を設ける目的または結果として自然に読める形にした。
