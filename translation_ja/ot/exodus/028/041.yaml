  text: וְ/הִלְבַּשְׁתָּ֤ אֹתָ/ם֙ אֶת אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/אֶת בָּנָ֖י/ו אִתּ֑/וֹ וּ/מָשַׁחְתָּ֨ אֹתָ֜/ם וּ/מִלֵּאתָ֧ אֶת יָדָ֛/ם וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם וְ/כִהֲנ֥וּ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: ja
  text: あなたの兄弟アロンとその息子たちに、これらの衣服を着せなさい。彼らに油を注ぎ、祭司の務めに就かせ[a]、聖別しなさい。彼らがわたしに仕える祭司として務めるようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らの手を満たし」。祭司の務めに正式に就かせることを表すヘブライ語の慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: 彼らに、これらの衣服を着せなさい
  rationale: לבשׁのヒフィル形は「着せる」を意味する。衣服は直前の文脈から明らかなため、日本語では「これらの衣服」を補って自然かつ明確にした。
- source_word: אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: あなたの兄弟アロンと、彼とともにいるその子ら
  rationale: אִתּוֹの「彼とともに」を保持し、アロンとその子らが一緒に儀礼を受けることを明示した。אָחִיךָは親族関係をそのまま「あなたの兄弟」とした。
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: 彼らに油を注ぎ
  rationale: משׁחは祭司任職の文脈で油を注ぐ儀礼を指すため、現代日本語で分かりやすい「油を注ぐ」とした。
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: 祭司職に就かせ
  rationale: 字義は「彼らの手を満たす」だが、祭司として正式に任じることを表すヘブライ語の慣用句である。特定教派の制度用語に寄せず、文脈上の職務を明示した。字義は脚注に残した。
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: 聖別しなさい
  rationale: קדשׁは彼らを聖なる務めのために取り分けることを表す。「聖別する」は祭儀的意味を簡潔に保つ。
- source_word: וְכִהֲנוּ לִי
  choice: こうして彼らは、わたしに仕える祭司となる
  rationale: כהןのピエル形が祭司として務めることを示すため、「わたしに仕える祭司」とした。「こうして」により、先行する任職・聖別の結果である流れを自然に示した。
theological_decisions:
- issue: מִלֵּא אֶת־יָדという祭司任職の慣用句
  choice: 本文では「祭司職に就かせ」と機能的に訳す
  alternative: 「彼らの手を満たし」または「任職し」
  rationale: 字義訳だけでは現代の読者に意味が伝わりにくい。一方、「按手」など後代の特定儀礼を連想させる表現は避け、祭司として正式に職に就けるという文脈上の意味を示した。字義は脚注で透明性を確保した。
- issue: וְכִהֲנוּ לִיの関係
  choice: 任職と聖別の結果として「こうして…祭司となる」と訳す
  alternative: 「彼らはわたしに祭司として仕えなければならない」
  rationale: 接続された完了形は先行する命令に続く帰結として自然に理解できるが、奉仕の継続的役割も「仕える祭司」で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の荘重さは「なさい」で保った。「任職」のようなやや専門的な単語を本文では避け、「祭司職に就かせ」と具体化した。
