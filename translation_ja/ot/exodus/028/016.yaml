  yaml_path: translation/ot/exodus/028/016.yaml
  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: ja
  text: 正方形にし、二重にする[a]。長さは一ゼレト、幅も一ゼレトとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「折り重ねて二重にする」とも訳せる。ヘブライ語は胸当てが二重の形に作られることを表し、おそらく折り重ねたものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 四辺が等しい形を表す語であり、現代日本語では「正方形」が明確で自然。
- source_word: יִהְיֶה
  choice: ～とする
  rationale: 製作上の規定を示す未完了形の指示的な力を、自然な規定文の形で表した。
- source_word: כָּפוּל
  choice: 二重にする
  rationale: 二重にされた状態を表す受動分詞。折り重ねることを含み得るが、本文ではその方法まで断定せず、語の曖昧さを保った。
- source_word: זֶרֶת
  choice: ゼレト
  rationale: 手を広げたときの幅に由来する古代の長さの単位。別の単位との混同や不確かな現代換算を避けるため音写した。
- source_word: אָרְכּוֹ
  choice: 長さ
  rationale: 男性単数接尾辞は文脈上、胸当てを指す。日本語では所有代名詞を明示せずとも自然に理解できる。
- source_word: וְזֶרֶת
  choice: 幅も一ゼレト
  rationale: 接続詞を「も」で表し、同じ測定単位が長さと幅の双方に適用されることを自然に示した。
- source_word: רָחְבּוֹ
  choice: 幅
  rationale: 長さと対になる寸法を、現代日本語で一般的な「幅」とした。
