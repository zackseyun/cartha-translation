  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: ja
  text: あなたは、わたしが知恵の霊[b]で満たした、心に知恵のあるすべての者[a]に語りなさい。彼らは、アロンがわたしに祭司として仕えるよう、彼を聖別するために、アロンの衣を作る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「心に知恵のある者」。理解力と巧みな技能を備えた者を指すヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「知恵を与える霊」とも訳せる。ここでは、神から与えられた知恵の性向や力を指し得るが、聖霊への直接的な言及に限定されない。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: 語りなさい
  rationale: ピエル未完了形がこの指示の文脈で命令的に用いられているため、現代日本語として明確な指示を表す。
- source_word: חַכְמֵי לֵב
  choice: 心に知恵のある者
  rationale: 「心」と「知恵」の比喩を保ちつつ、理解力と実際的な技能を備えた者を指すヘブライ語の慣用表現として読める形にした。
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: わたしが知恵の霊で満たした
  rationale: מלא の「満たす」という比喩と、無冠詞の רוּחַ חָכְמָה を保持し、聖霊への明示的な限定も、単なる技能への平板化も避けた。
- source_word: בִּגְדֵי אַהֲרֹן
  choice: アロンの衣
  rationale: 連語をそのまま簡潔に訳し、原文に明示されていない「祭司の」を補わなかった。
- source_word: לְקַדְּשׁוֹ
  choice: アロンを聖別し
  rationale: 祭司職のために聖なる務めへ取り分ける意味を、「聖別する」で正確に表した。
- source_word: לְכַהֲנוֹ לִי
  choice: わたしに祭司として仕えさせる
  rationale: 動詞 כהן の「祭司として務める」と לִי の神に対する奉仕の向きをともに明示した。
- source_word: וְעָשׂוּ
  choice: 彼らは……作る
  rationale: 指示の連続に置かれた完了形を、日本語では先行する命令を受けた遂行内容として簡潔に表した。
theological_decisions:
- issue: רוּחַ חָכְמָה を聖霊への直接的言及と特定するか
  choice: 知恵の霊
  alternative: 知恵を授ける御霊／知恵
  rationale: 原文は無冠詞であり、神から与えられる霊または性向を表し得る。したがって、聖霊への明示的言及に限定せず、同時に神的な賦与を単なる人間的技能へ還元しない表現を採った。
- issue: 二つの目的不定詞 לְקַדְּשׁוֹ לְכַהֲנוֹ の関係
  choice: 聖別し、わたしに祭司として仕えさせるために
  alternative: 聖別するため、すなわち、わたしに祭司として仕えさせるために
  rationale: 祭司として仕えることが聖別の目的であるという密接な関係を自然に示しつつ、二つの目的表現の区別も残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、祭司制度の文脈にふさわしい荘重さを保った。「心」「満たす」「知恵の霊」という原文の比喩は残し、必要な説明は脚注に置いた。
