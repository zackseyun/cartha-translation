  text: וְ/עָשִׂ֛יתָ אֶת מְעִ֥יל הָ/אֵפ֖וֹד כְּלִ֥יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/031.yaml
  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: ja
  text: エフォドの上着を、全体を青色の布で作りなさい。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべて青色で」。上着全体が青色の素材で作られることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「青色」と訳したヘブライ語は、青から青紫の範囲に染めた高価な布地を指すことがある。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作りなさい
  rationale: 接続詞を伴う完了形は、一連の製作指示の中で命令として機能する。現代日本語で明確かつ自然な指示表現とした。
- source_word: מְעִיל
  choice: 上着
  rationale: 祭司が身に着ける衣服を指す。「外套」よりも一般読者に分かりやすく、文脈上の衣服として自然である。
- source_word: הָאֵפֹד
  choice: エフォド
  rationale: 祭司の装束を表す専門用語であり、形状を断定する意訳を避けて音写した。連語全体はエフォドに伴う上着を意味する。
- source_word: כְּלִיל
  choice: すべて
  rationale: 全体性・完全性を表し、上着全体が指定された素材ないし色であることを示す。
- source_word: תְּכֵלֶת
  choice: 青色の染め糸
  rationale: 幕屋と祭司装束に用いられる、青から青紫の範囲の高価な染色素材を指す。単なる抽象的な色名ではなく製作材料であることが分かる表現とした。
theological_decisions: []
