id: EXO.28.4
reference: Exodus 28:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: ja
  text: 彼らが作るべき衣服は次のとおりである。胸飾り[a]、エフォド[b]、上衣、織り模様の長衣[c]、ターバン、帯である。彼らは、あなたの兄弟アロンとその息子たちのために聖なる衣服[d]を作り、アロンが祭司としてわたしに仕えるためにそうしなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胸当て」とも訳される。ここでは武具ではなく、祭司が胸に着ける祭儀用具を指す。
    reason: lexical_alternative
  - marker: b
    text: 「エフォド」は、正確に対応する日本語名のない、祭司特有の衣服。
    reason: cultural_note
  - marker: c
    text: 「格子模様の長衣」とも訳し得る。ヘブライ語は、模様または特殊な織り加工を施した衣を指すと考えられる。
    reason: lexical_alternative
  - marker: d
    text: 「聖なる装束」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: 衣服
  rationale: 祭司の装いを指す一般的で明瞭な語。教会用語に偏りやすい「祭服」より原文の広い表現を保つ。
- source_word: יַעֲשׂוּ
  choice: 作るべき／作らなければならない
  rationale: 命令文脈における未完了形の指示的な力を、現代日本語で自然に表す。
- source_word: חֹשֶׁן
  choice: 胸飾り
  rationale: 祭司が胸に着ける祭儀用具であり、武具を連想させる「胸当て」よりも文脈に合う。
- source_word: אֵפוֹד
  choice: エフォド
  rationale: 正確に対応する日本語がない独特の祭司用衣服なので、音写して文化的固有性を保つ。
- source_word: מְעִיל
  choice: 上衣
  rationale: 祭司が着る外側の衣を、簡潔で理解しやすい現代日本語で示す。
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: 織り模様の長衣
  rationale: כְתֹנֶתを「長衣」、織物の加工や模様を示すと考えられるתַּשְׁבֵּץを「織り模様」とし、格子柄など特定の意匠に断定しない。
- source_word: מִצְנֶפֶת
  choice: ターバン
  rationale: 頭に巻く祭司のかぶり物を、現代の読者に明瞭な語で表す。
- source_word: אַבְנֵט
  choice: 帯
  rationale: 腰に巻く布製の帯を表す簡潔な日本語で、現代的な革製ベルトの連想を避ける。
- source_word: בִגְדֵי קֹדֶשׁ
  choice: 聖なる衣服
  rationale: 祭司職のために取り分けられた衣服であることを示す「聖」の語を直接保つ。
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: あなたの兄弟アロンとその息子たちのために
  rationale: モーセとの兄弟関係と、原文が明示する男性の子らをそのまま表す。
- source_word: לְכַהֲנוֹ לִי
  choice: アロンがわたしに祭司として仕えることができるように
  rationale: 三人称男性単数接尾辞をアロンに結び付け、祭司として務めるという動詞的意味と目的を自然な日本語で表す。
theological_decisions:
- issue: 祭司の衣服に関する専門語をどう表すか
  choice: 一般的な品目は明瞭な日本語に訳し、固有の専門語אֵפוֹדだけは「エフォド」と音写する。
  alternative: すべてを伝統的な祭儀用語で訳す、またはエフォドを説明的に「祭司の前掛け」と訳す。
  rationale: 幕屋祭儀の固有性を保ちつつ、後代の教会制度に由来する含意や不確かな形状の断定を避ける。
- issue: תַּשְׁבֵּץが示す織り方・模様
  choice: 「織り模様」とし、加工された織物であることを示す。
  alternative: 「格子模様」「市松模様」「綾織り」と特定する。
  rationale: 語は模様または特殊な織り加工を示す可能性があるが、具体的な意匠には不確実性があるため、その曖昧さを残す。
- issue: לְכַהֲנוֹの単数接尾辞の指示対象
  choice: 単数形に従い、アロンが祭司として仕える目的を明示する。
  alternative: アロンと息子たち全員が祭司として仕えるため、と複数に一般化する。
  rationale: 文脈上、息子たちも祭司の衣服を受けるが、この節のヘブライ語接尾辞自体は男性単数であるため、数の緊張を解消せず文法に即した。
- issue: וּלְבָנָיוの性別
  choice: 「その息子たち」と訳す。
  alternative: 「その子どもたち」「その子孫」と中性化する。
  rationale: 原文は明示的に「息子たち」と述べ、アロン系祭司職の当該人物を指すため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。列挙は短い名詞句で読みやすくし、命令の調子は「作るべき」「作らなければならない」で保持した。専門語は必要な場合だけ音写し、脚注で補った。
