base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: ja
  text: アロンとその子らは、会見の天幕に入るとき、また聖所で仕えるために祭壇に近づくとき、それらを身に着けていなければならない。罪責を負って死ぬことがないようにするためである。これは、彼と彼の後の子孫のための永続する定めである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ עַל אַהֲרֹן וְעַל בָּנָיו
  choice: アロンとその子らは、それらを身に着けていなければならない
  rationale: 直訳は「それらはアロンとその子らの上になければならない」。複数形の「それら」は直前の祭司用の衣服を指すため、日本語では着用義務を明示して自然に表現した。
- source_word: בְּבֹאָם אֶל אֹהֶל מוֹעֵד
  choice: 会見の天幕に入るとき
  rationale: ב＋不定詞構文の時間的意味を明確にした。「会見の天幕」は אֹהֶל מוֹעֵד の祭儀的名称を保つ。
- source_word: אוֹ בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: または祭壇に近づくとき
  rationale: נגשׁ は祭司が聖なる務めのために近づく行為を表す。「近づく」は原文の空間的・祭儀的含意を保つ。
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: 聖所で仕えるために
  rationale: שרת の祭司的奉仕を「仕える」で表し、בַּקֹּדֶשׁ は聖なる区域を指すものとして「聖所で」とした。
- source_word: וְלֹא יִשְׂאוּ עָוֹן וָמֵתוּ
  choice: 罪責を負い、死ぬことのないためである
  rationale: נשׂא עון の法的・祭儀的な慣用表現を「罪責を負う」として保持し、違反に伴う死という重大な帰結を弱めずに示した。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: עוֹלָם の長期にわたり継続する効力を、現代日本語で理解しやすく、かつ断定を過度に拡張しない表現にした。
- source_word: לֹו וּלְזַרְעוֹ אַחֲרָיו
  choice: 彼と彼の後の子孫に対する
  rationale: זֶרַע の集合的単数を自然な日本語の「子孫」とし、規定がアロン本人と後代に及ぶことを表した。
theological_decisions:
- issue: 不適切な祭司的接近に伴う刑罰条項
  choice: 定められた衣服を着用しなければ、祭司が罪責を負い、死に至り得るという実在の帰結として訳す。
  alternative: 「罪を犯して死なないため」または「咎を招いて死なないため」と意訳する。
  rationale: 原文は聖なる務めにおける違反と罪責・死を直接結び付ける。その緊張を単なる儀礼上の不適切さへ弱めず、同時に因果関係を本文以上に詳しく説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀法としての厳粛さを保った。「会見の天幕」「祭壇」「聖所」「定め」は文脈上必要な祭儀用語として統一した。原文の複数代名詞は前節の衣服を受けるため「それら」とし、日本語では主語を祭司側に組み替えて着用義務を明確にした。
