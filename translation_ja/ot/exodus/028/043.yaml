  to: アロンとその子らは、会見の天幕に入るとき、また聖所で仕えるために祭壇に近づくとき、それらを身に着けていなければならない。罪責を負って死ぬことがないようにするためである。これは、彼と彼の後の子孫のための永続する定めである。
