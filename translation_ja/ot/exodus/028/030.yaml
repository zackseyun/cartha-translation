  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: ja
  text: あなたは、裁きの胸当て[a]の中にウリムとトンミム[b]を入れなければならない。それらは、アロンがヤハウェの前に入るとき、アロンの胸の上にある。アロンは、イスラエルの子ら[c]の裁きを、絶えずヤハウェの前で胸に担う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裁きの胸当て」は、「判定のための胸当て」または「正義の胸当て」とも訳せる。ヘブライ語の「ミシュパート」には、裁き、判定、正義などの意味がある。
    reason: alternative_reading
  - marker: b
    text: ウリムとトンミムは、祭司による判定に関係した聖なる物のヘブライ語名。その形状や用い方は明らかでない。語源に基づいて「光」と「完全」とする説もある。
    reason: lexical_alternative
  - marker: c
    text: 「イスラエルの子ら」はヘブライ語の表現で、イスラエルの契約の民を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: 裁きの胸当て
  rationale: חֹשֶׁןは祭司が胸に着ける装具を指すため「胸当て」とし、מִשְׁפָּטは同節後半との語彙的連関を保って「裁き」とした。
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ウリムとトンミム
  rationale: 形状、用法、語源的意味に不確かさがある祭儀上の固有名称なので、推測的に訳出せず音写した。
- source_word: אֶל
  choice: の中に
  rationale: נתןとの組み合わせと胸当てが収納部を備える文脈から、内部への配置を自然な日本語で示した。
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: それらは……その心の上にある
  rationale: 胸部に着ける物理的位置と、代表して心に担う象徴性の双方を残すため、עַל לֵבの具体的な比喩を保持した。
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: アロンがヤハウェの前に入るとき
  rationale: 聖所への進入を示すבואの含意を保ち、「前に来る」よりも進入のニュアンスが明確な表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として日本語で一般的な形に音写した。
- source_word: וְנָשָׂא
  choice: 担う
  rationale: 物理的に身に帯びる意味と、祭司として代表的責任を負う意味をともに表せる。
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの裁き
  rationale: מִשְׁפָּטを前半と同じ「裁き」として反復を保ち、決定、判定、正義という意味の幅を一つに狭めすぎないようにした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の慣用的な契約共同体名を形式上保持しつつ、注で民全体を指すことを明らかにした。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 祭司職における継続的・恒常的な務めを表し、各瞬間に途切れなく行うという過度に物理的な理解を要求しない。
theological_decisions:
- issue: ウリムとトンミムを意味訳するか音写するか
  choice: 「ウリム」「トンミム」と音写する
  alternative: 「光」と「完全」などと意味訳する
  rationale: 語源と具体的な形状・機能が確定していないため、意味訳によって一説を確定事項として提示することを避けた。
- issue: מִשְׁפָּטの意味
  choice: 二箇所とも「裁き」とする
  alternative: 「決定」または「正義」とする
  rationale: 神の前で与えられる権威ある判定の含意と原文の反復を保ちつつ、神託の仕組みを過度に限定しない。
- issue: בְּנֵי יִשְׂרָאֵלの表現
  choice: 本文で「イスラエルの子ら」とする
  alternative: 「イスラエル人」または「イスラエルの民」とする
  rationale: 原文の表現と契約共同体としての呼称を保持し、実際の指示範囲は注で説明した。
- issue: עַל לֵבを物理的表現として残すか
  choice: 「心の上に」とする
  alternative: 「胸に」または「心にかけて」と意訳する
  rationale: 胸当ての位置と、民の裁きを代表して担う象徴性が重なる原文の緊張を保つため。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。「あなたは……なければならない」で命令の強さを示し、祭儀用語は過度に説明的にせず本文を簡潔にした。「心の上」は日本語としてやや非日常的だが、胸当ての物理的位置と象徴的意味を同時に保つため意図的に残した。
