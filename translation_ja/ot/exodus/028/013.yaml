lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞 וְ を前後の指示を結ぶ「また」とし、祭具製作の命令の連続に置かれた二人称男性単数完了形を、現代日本語で自然な指示表現「作りなさい」と訳した。
- source_word: מִשְׁבְּצֹת
  choice: 飾り枠
  rationale: 宝石や鎖を取り付けるための装飾的な枠・台座を指す語と考えられる。「飾り枠」は装飾性と取り付け用の枠という機能を簡潔に表しつつ、細工の具体的な技法までは限定しない。
- source_word: זָהָב
  choice: 金の
  rationale: 素材を表す名詞であり、日本語では名詞を修飾する「金の」が明快で自然である。
