  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: ja
  text: また、その石はイスラエルの息子たちの名に従うものとし、十二個とする。彼らの名に従い、印章に彫るように、一つの石ごとにその名を刻む。これらは十二部族のためのものとする。[a][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの息子たちの名を記す」。ヘブライ語は字義的には、「石はイスラエルの息子たちの名に従ってある」と述べる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「印章の彫刻を施し」または「印章の彫り方で彫り」。
    reason: lexical_alternative
  - marker: c
    text: 「イスラエルの息子たち」はヘブライ語の表現。ここでは、イスラエルの十二人の息子に由来する十二部族を指す。「イスラエルの子ら」または「イスラエル人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: また、その石は
  rationale: 接続詞、定冠詞、複数名詞を踏まえ、前節からのつながりと、すでに述べられた石を指すことを自然な日本語で示した。日本語では文脈上、複数性を後続の「十二個」で明示できる。
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たちの名に対応して……とし
  rationale: 動詞は字義的には「ある／なる」、עַל はここでは名との関係・対応を示す。「対応して」とすることで、不自然な直訳を避けつつ関係的な意味を保持した。
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: 十二個とし、それぞれの名に対応させる
  rationale: 十二という数と、各名に対応するという原文の反復を保った。「個」を補って日本語として明瞭にした。
- source_word: פִּתּוּחֵי חוֹתָם
  choice: 印章のように彫り刻む
  rationale: 印章に施す彫刻様式を表す構文として理解し、名詞的なヘブライ語表現を自然な日本語の動詞表現にした。別の構文理解は脚注に残した。
- source_word: אִישׁ עַל שְׁמוֹ
  choice: 一つ一つにその名を
  rationale: אִישׁ の配分的用法を「一つ一つ」とし、各石に対応する名が刻まれることを明確にした。
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: 十二部族のために
  rationale: לְ が示す目的・関係を簡潔に表し、石が十二部族を表すためのものであることを伝えた。
theological_decisions:
- issue: 契約的表現 בְּנֵי יִשְׂרָאֵל の性別を含む語義
  choice: イスラエルの息子たち
  alternative: イスラエルの子ら／イスラエル人
  rationale: ヘブライ語の字義と、ヤコブ（イスラエル）の息子たちに由来する十二部族という文脈を保った。より包括的・慣用的な訳も可能であるため脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準的文体を用いながら、祭司の装具に関する規定にふさわしい簡潔で格調ある調子と、原文にある対応関係および反復を保った。
