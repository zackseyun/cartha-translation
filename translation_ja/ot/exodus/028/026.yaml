  text: וְ/עָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְ/שַׂמְתָּ֣ אֹתָ֔/ם עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: ja
  text: また、金の輪を二つ作り、胸当ての両端の、エフォドに向く内側の縁に取り付けなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「胸当ての両端にある、エフォドの内側に面する縁に取り付けなさい。」
    reason: 「エフォドに向く」と「内側へ（内向きに）」の係り方に、原文の語順上わずかな解釈の幅があるため。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、……作り
  rationale: 接続詞を伴う完了形は、一連の製作指示を続ける命令として機能する。「また」で前節からの連続性を示し、「作り……取り付けなさい」と日本語として自然な命令文にした。
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: 金の輪を二つ
  rationale: 材質と個数を明確に示す、自然な現代日本語。器具を留める金具という文脈では「輪」が簡潔で分かりやすい。
- source_word: וְשַׂמְתָּ אֹתָם
  choice: 取り付けなさい
  rationale: שׂים の基本義は「置く、付ける」だが、祭服に輪を配置する製作工程なので「取り付ける」が具体的かつ自然。
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: 胸当ての両端
  rationale: קָצֶה は物の端・末端を指す。חֹשֶׁן は祭司装束の文脈に即して「胸当て」とした。
- source_word: עַל שְׂפָתוֹ
  choice: その縁に相当する「縁」
  rationale: שָׂפָה は直訳では「唇」だが、物体については「縁、へり」を意味する。本文では前句との同格的関係を「すなわち」で示した。
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: エフォドに面する内側の
  rationale: עֵבֶר は向き・側を、בָּיְתָה は内向き・内側を表す。空間関係を過度に特定せず、胸当てのうちエフォド側に面する内側の縁を指す表現とした。
