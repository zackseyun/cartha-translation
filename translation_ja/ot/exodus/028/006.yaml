revisions:
- from: 彼らは、金[a]、青、紫、緋色の撚り糸、撚った上質の亜麻糸を用い、巧みな意匠によってエフォドを作る。
  to: 彼らは、金[a]、青、紫、緋色の糸、撚り合わせた上質の亜麻糸を用い、巧みな意匠を施して[b]エフォドを作る。
  rationale: 緋色の材料から原文に明示されない「撚り」を除き、撚り合わせた性質を上質の亜麻に限定した。「巧みな意匠を施して」として、意匠性と熟練した製作技術の双方を自然な日本語で表した。脚注bを追加し、原語句の訳し分けの余地を保持した。
