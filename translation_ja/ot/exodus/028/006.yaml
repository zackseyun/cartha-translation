  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: ja
  text: 彼らは、金[a]、青、紫、緋色の糸、撚り合わせた上質の亜麻糸を用い、巧みな意匠を施して[b]エフォドを作る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「金糸」。ヘブライ語本文は単に「金」とするが、この製作の文脈では、織物に織り込むため加工された金を指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: または「意匠家の仕事として」または「熟練した職人の仕事として」。ヘブライ語は、意匠を伴う熟練した工芸的な仕事を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 彼らは…作る
  rationale: 接続詞を伴う完了形は、この一連の製作指示では命令的な未来を表す。日本語では文脈上、簡潔な非過去形で指示を表した。
- source_word: הָאֵפֹד
  choice: エフォド
  rationale: 祭司の特定の装束を指す専門語であり、形状を訳語で限定しすぎないよう音写した。
- source_word: זָהָב
  choice: 金
  rationale: ヘブライ語は単に「金」とだけ述べる。織物製作の文脈では金糸などに加工した金を指し得るが、本文では明示されないため「金」とした。
- source_word: תְּכֵלֶת
  choice: 青
  rationale: 幕屋関連の材料一覧で用いられる伝統的な色彩語。染めた糸または素材が含意されるが、原文同様、色名で示した。
- source_word: וְאַרְגָּמָן
  choice: 紫
  rationale: 幕屋関連の文脈における標準的な色彩語として訳した。
- source_word: תּוֹלַעַת שָׁנִי
  choice: 緋色の撚り糸
  rationale: 緋色に染めた繊維素材を指す表現である。製作材料として自然かつ明確になるよう「撚り糸」を補った。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚った上質の亜麻糸
  rationale: שֵׁשׁ は上質の亜麻素材、מָשְׁזָר は撚り合わせた性質を示すため、双方を明示した。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠によって
  rationale: 考案された模様を伴う熟練した工芸を表す。刺繍に限定せず、意匠性と技能の双方を自然な日本語で示した。
