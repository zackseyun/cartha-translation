source:
  edition: WLC
  text: וְ/יִרְכְּס֣וּ אֶת הַ֠/חֹשֶׁן מ/טבעת/ו אֶל טַבְּעֹ֤ת הָ/אֵפֹד֙ בִּ/פְתִ֣יל תְּכֵ֔לֶת לִֽ/הְי֖וֹת עַל חֵ֣שֶׁב הָ/אֵפ֑וֹד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: ja
  text: 胸当て[a]の輪を、青色のひも[b]でエフォドの輪に結び付け、胸当てがエフォドの巧みに織った帯の上にあるようにする。こうして、胸当てがエフォドからずれない[c]ようにする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胸当て」は祭司がエフォドに取り付けて胸に着けた装具を指し、武具ではない。別訳「胸飾り」。
    reason: lexical_alternative
  - marker: b
    text: 原語は、幕屋や祭服の織物に用いられた青系の染色素材を指す。
    reason: lexical_clarification
  - marker: c
    text: 別訳「エフォドから外れない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: 結び付け
  rationale: 輪とひもを用いて二つを固定する動作を表すため、方法を過度に限定せず、衣服の文脈にも自然な表現とした。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 祭司が胸に着ける装具を指し、武具ではない。「胸当て」は簡潔で、現代日本語でも位置と機能を理解しやすい。
- source_word: מִטַּבְּעֹתָיו
  choice: 胸当ての輪を
  rationale: 前置詞מはここで胸当て側の輪を取り付けの起点・手段として示す。日本語では「輪を……輪に結び付ける」とするのが明瞭で自然。
- source_word: טַבְּעֹת הָאֵפֹד
  choice: エフォドの輪
  rationale: 連語の関係をそのまま保ち、祭服の各部の接続を明確にした。
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: 青色のひもで
  rationale: פְּתִילは糸またはひも、תְּכֵלֶתは幕屋と祭服に用いる青系の染色素材を表す。輪を固定する用途に合う自然な日本語として「青色のひも」とした。
- source_word: לִהְיוֹת עַל
  choice: 上にあるようにする
  rationale: 目的・結果を示す不定詞句と位置関係を、余分な動作の含意を加えずに表した。
- source_word: חֵשֶׁב הָאֵפֹד
  choice: エフォドの巧みに織った帯
  rationale: חֵשֶׁבはこの文脈でエフォドに付属する織り帯を指す。周辺記述に即して、精巧な織り仕事であることも伝えた。
- source_word: וְלֹא יִזַּח
  choice: ずれないようにする
  rationale: 胸当てが本来の位置から動いたり外れたりしないことを表す。固定具の目的として自然であり、「外す」という意図的動作には限定しない。
- source_word: מֵעַל הָאֵפֹד
  choice: エフォドから
  rationale: エフォド上の位置から離れることを簡潔に示した。
