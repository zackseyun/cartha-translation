  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: ja
  text: 金の鈴とざくろ[a]、金の鈴とざくろを上衣の裾に沿ってぐるりと[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「ざくろ」は、鈴と鈴の間に付けられた、ざくろの形の飾りを指すと考えられる。
    reason: cultural_note
  - marker: b
    text: 直訳では「上衣の裾の上に、周りに」。裾の全周に配置することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: 鈴
  rationale: 祭司の衣に取り付ける小型の鳴り物を指すため、現代日本語で自然かつ簡潔な「鈴」とした。
- source_word: זָהָב
  choice: 金の
  rationale: 素材が金であることを明確にし、ヘブライ語の名詞連語を自然な日本語で表した。
- source_word: רִמּוֹן
  choice: ざくろ
  rationale: 通常の語義をそのまま保った。ここではざくろの実そのものではなく、その形をした飾りを指すと考えられるため、注で補った。
- source_word: עַל
  choice: 裾に沿って
  rationale: 基本義は「上に」だが、衣の裾と סָבִיב を伴うこの文脈では、裾を巡る配置を表す。「に沿って」は位置関係を自然に伝える。
- source_word: שׁוּלֵי
  choice: 裾
  rationale: 衣服の下端を指す語として、現代日本語で最も自然である。
- source_word: מְעִיל
  choice: 上衣
  rationale: 祭司が着る袖なしの長い衣を指す。一般的な「衣」より種類を示しつつ、「外套」ほど防寒着の印象を与えない。
- source_word: סָבִיב
  choice: ぐるりと
  rationale: 裾の全周にわたる配置を示す副詞の強調を、簡潔で分かりやすい日本語で表した。
