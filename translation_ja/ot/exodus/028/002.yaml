  text: וְ/עָשִׂ֥יתָ בִגְדֵי קֹ֖דֶשׁ לְ/אַהֲרֹ֣ן אָחִ֑י/ךָ לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: ja
  text: また、あなたの兄アロンのために、栄光と美しさのための聖なる衣服を作りなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誉れと美しさのために」または「栄光と輝きのために」。
    reason: כָּבוֹד は「栄光、誉れ」、תִּפְאֶרֶת は「美しさ、麗しさ、輝き」などの意味を持つため。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作り、…ものとしなさい
  rationale: 接続詞付き完了形二人称男性単数を、連続する指示の文脈に即して命令として訳した。日本語では「作り…ものとしなさい」として目的句まで自然につないだ。
- source_word: בִגְדֵי קֹדֶשׁ
  choice: 聖なる衣服
  rationale: 構成形の句を、聖別され祭儀のために取り分けられた衣服という意味を保って訳した。「祭服」より原語の一般的な語感を残す。
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: あなたの兄アロンのために
  rationale: モーセとの実際の家族関係を明示する語句をそのまま保持し、人名は日本語聖書で広く定着した「アロン」とした。
- source_word: לְכָבוֹד
  choice: 栄光
  rationale: כָּבוֹדが持つ栄誉・威厳・輝かしさの幅を保つため「栄光」を採用した。誰の栄光かを本文で限定しない。
- source_word: וּלְתִפְאָרֶת
  choice: 美しさ
  rationale: תִּפְאֶרֶתの美、麗しさ、華麗さという意味領域のうち、現代日本語で明瞭な「美しさ」を選んだ。
theological_decisions:
- issue: 祭司の衣服についての目的句 לְכָבוֹד וּלְתִפְאָרֶת
  choice: 「栄光と美しさを表すもの」とし、祭司職の威厳と衣服の美的な輝きの双方を示す。
  alternative: 「誉れと麗しさのため」「栄光と輝きのため」
  rationale: この二語は意味領域が広く、栄光の帰属先を神またはアロンだけに限定できない。本文ではその緊張を保ち、注で自然な別訳を示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令の力を保ちつつ、「ために」を重ねる不自然さを避けるため、後半を「表すものとしなさい」とした。脚注記号[a]は本文中に明示した。
