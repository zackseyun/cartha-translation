  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ֙ עַל הַ/חֹ֔שֶׁן שְׁתֵּ֖י טַבְּע֣וֹת זָהָ֑ב וְ/נָתַתָּ֗ אֶת שְׁתֵּי֙ הַ/טַּבָּע֔וֹת עַל שְׁנֵ֖י קְצ֥וֹת הַ/חֹֽשֶׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/023.yaml
  text: You shall make two gold rings on the breastpiece[b][a], and put the two rings on the two ends of the breastpiece.
translation:
  language: ja
  text: 胸当てに金の輪を二つ[a]作り、その二つの輪を胸当ての両端に[b]付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二つの金の輪を」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「胸当ての二つの端の上に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作り
  rationale: 接続詞を伴う完了形は、この製作指示の連続の中で命令の働きをする。後半の「付けなさい」へ自然につながる連用形とした。
- source_word: עַל הַחֹשֶׁן
  choice: 胸当てに
  rationale: 物を胸当てへ取り付けるという文脈で、עַל の位置・接触の意味を自然な日本語の助詞「に」で表した。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 出エジプト記28章では祭司の装具を指す。「裁きの胸当て」に当たる語句全体が明記されていないため、ここでは簡潔に「胸当て」とした。
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: 金の輪を二つ
  rationale: 輪の材質と数を明確に示し、製作手順として自然な現代日本語にした。
- source_word: וְנָתַתָּ
  choice: 付けなさい
  rationale: 基本義は「置く」だが、装具に輪を配置する文脈では「付ける」が具体的で自然である。命令としての力も明示した。
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: その二つの輪を
  rationale: 定冠詞を伴う既出の輪を指すため、「その」を補って指示関係を明確にした。
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: 胸当ての両端に
  rationale: קָצֶה は端・末端を表す。ヘブライ語の「二つの端」は、日本語では同じ意味を自然に表す「両端」とした。
theological_decisions: []
