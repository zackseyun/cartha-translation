  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: ja
  text: エフォドの上にある、巧みに織られた帯は、エフォドと同じ作りで、エフォドと一体となるようにしなければならない[a]。金、青、紫、緋色の糸[b]、撚り合わせた上質の亜麻糸で作る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「その作りのように、それから成るものとする」。帯はエフォドと同じ仕立てで、別の部品ではなく一体に作られることが強調されている。
    reason: lexical_alternative
  - marker: b
    text: 「青、紫、緋色」は、幕屋と祭司の装束に用いられた、それぞれの色に染めた繊維材料を指す。
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: エフォドの巧みに織った帯
  rationale: 祭司装束の文脈でחֵשֶׁבは、エフォドを締めるための織物の帯を指す。「巧みに織った」は、その織物としての性質と精巧な作りを自然な日本語で表す。
- source_word: אֲשֶׁר עָלָיו
  choice: エフォドについている
  rationale: 接尾辞の最も自然な先行詞をエフォドと取り、帯がエフォド上にあることを示す。ただし、物理的な取り付け方までは断定しない。
- source_word: כְּמַעֲשֵׂהוּ
  choice: エフォドと同じ作りで
  rationale: 帯の製作法・仕立てがエフォドのものと対応するという原文を明示する。
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: これと一体になるように
  rationale: 直訳は「それから、それはなる」。ここでは帯を別個の部品とせず、エフォドと一体に作る趣旨を表す。原文の簡潔さと解釈上の幅は脚注で補う。
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 金、青、紫、緋色の糸
  rationale: 幕屋と祭司装束に用いられる金および染色された繊維材料の列挙として表した。「糸」は色彩語にかかるものとして自然に補った。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚った上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻布・亜麻糸と、מָשְׁזָרの撚り合わせた性質の両方を保持する。
