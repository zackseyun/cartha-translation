id: EXO.28.17
reference: Exodus 28:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מִלֵּאתָ֥ ב/וֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: ja
  text: また、その胸当てに宝石をはめ込み、四列に並べなさい。第一列は、ルビー、トパーズ、エメラルドとする。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: これらの宝石が具体的にどの鉱物を指すかは確定していない。「ルビー」は「紅玉髄」、「トパーズ」は「クリソライト」または「ペリドット」、「エメラルド」は「緑柱石」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: その胸当てに宝石をはめ込み
  rationale: מלא は直訳すれば「満たす」だが、宝石細工の文脈では、宝石を器具に取り付ける「はめ込む」が自然である。בּוֹ の指示対象は前節の胸当てとして明示した。
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: 四列に並べなさい
  rationale: טוּר はここでは宝石の配列を表すため「列」とした。אֶבֶן は集合的に用いられており、前句の「宝石」と合わせて自然な日本語にした。
- source_word: טוּר ... הָאֶחָד
  choice: 第一列
  rationale: 四列のうち最初の列を示す順序表現として、簡潔で明瞭な「第一列」とした。
- source_word: אֹדֶם
  choice: ルビー
  rationale: 赤色の宝石を指す語だが鉱物の厳密な同定は不確かである。伝統的で広く理解される「ルビー」を本文に採用し、別案を注記した。
- source_word: פִּטְדָה
  choice: トパーズ
  rationale: 宝石の厳密な同定は不確かである。伝統的で分かりやすい「トパーズ」を本文に置き、別案を注記した。
- source_word: בָרֶקֶת
  choice: エメラルド
  rationale: 輝きに関連する名称と考えられるが、鉱物の同定は不確かである。慣用的な「エメラルド」を採用し、別案を注記した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祭司装束の製作指示にふさわしい簡潔で dignified な命令調とした。前節からの指示対象を「その胸当て」と明示して理解しやすくした。
