source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: ja
  text: また、純金の飾り板を作り、印章の彫刻のように、その上に「ヤハウェに聖別されたもの」[a]と刻みなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェへの聖別」。
    reason: קֹדֶשׁは、聖別されたものを指す語としても、「聖さ」「聖別」という抽象名詞としても理解できるため。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作り
  rationale: 接続詞付きの動詞が祭司装束製作の一連の命令を続けているため、「また」で連続性を示し、後半の「刻みなさい」と合わせて自然な日本語の命令文にした。
- source_word: צִּיץ
  choice: 飾り板
  rationale: この語は他の文脈では花や花形の飾りを指し得るが、ここでは大祭司のかぶり物に付ける金製品である。「板」だけより装飾品であることが明確で、「額当て」ほど装着位置を語に持ち込まない。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 素材とその純良さを、現代日本語で簡潔かつ自然に表す。
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: その上に…刻みなさい
  rationale: 金属製品に文字を彫り刻む行為を表す文脈なので、「刻む」が適切である。
- source_word: פִּתּוּחֵי חֹתָם
  choice: 印章を彫るように
  rationale: 印章に施す彫刻と同じ仕方で銘を刻むという意味を、専門的すぎない自然な表現で示した。ヘブライ語の複数形は彫刻の技法・作業を表す慣用的な用法として処理した。
- source_word: קֹדֶשׁ לַיהוָה
  choice: ヤハウェのための聖なるもの
  rationale: 簡潔な銘文の性格を保ちつつ、קֹדֶשׁの聖性とלの献呈・帰属の含みを日本語で理解できる形にした。名詞的な「聖別」という訳も可能なため脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文に記された神の固有名を称号へ置き換えず、日本語で一般的な音写によって示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として明示した。
- issue: 銘文 קֹדֶשׁ לַיהוָה の文法的含み
  choice: ヤハウェのための聖なるもの
  alternative: ヤハウェへの聖別
  rationale: קֹדֶשׁは「聖なるもの」とも抽象名詞「聖さ・聖別」とも理解できる。本文では献呈を表す簡潔な銘として読める訳を採り、抽象名詞としての可能性を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭具に刻まれる銘文には簡潔で厳かな調子を保った。「飾り板」は物体の形状と装飾的機能をともに伝え、「印章を彫るように」は古代の加工法を一般読者にも分かる表現にした。
