source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: ja
  text: 石を彫る職人の仕事のように、印章の彫刻のように、二つの石にイスラエルの子らの名を彫り刻みなさい[a]。それらを金の枠にはめ込んで作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」とは、ここでは石に名を刻まれる、イスラエルの子孫である諸部族を指す。
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: 石を彫る職人の仕事にならい
  rationale: 石を加工する職人の技法・仕事ぶりを基準とする表現。文脈上は宝石への刻字なので、「石工」よりも具体的な「石を彫る職人」とした。
- source_word: פִּתּוּחֵי חֹתָם
  choice: 印章を彫るように
  rationale: 印章に施す彫刻の様式を表す。日本語では名詞を重ねるより、方法を示す表現が自然である。
- source_word: תְּפַתַּח
  choice: 彫り刻みなさい
  rationale: 石に名を刻む行為を明確に表し、命令形を保持した。
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: 二つの石
  rationale: 原文の一般語「石」を保ち、文脈から宝石と分かるため過度に限定しない。
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: 二つの石にイスラエルの子らの名を
  rationale: עַל を刻字の位置として自然な日本語の「石に」で表現し、系譜的な名称「イスラエルの子ら」を保持した。
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: 金の台座で囲むように
  rationale: 石が金製の受け枠・据え台に囲まれている状態を表す。「台座」は装身具の石を留める部分として理解しやすい。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: それらを……作りなさい
  rationale: 二つの石をそのような形に仕立てる命令として訳した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の性別を伴う家族的表現
  choice: イスラエルの子ら
  alternative: イスラエルの人々／イスラエルの子孫
  rationale: ここでは十二部族の祖となるイスラエルの息子たちの名が問題であるため、原文の家族・系譜的表現を保った。「息子たち」と限定すると後代の部族名との関係を狭く受け取られ得るので、「子ら」とした。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調ある命令文とした。「印章」「台座」は祭司装束の工芸的文脈に合う語。原文の二つの比較表現は「仕事にならい」「彫るように」で自然につないだ。
