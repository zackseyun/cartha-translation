  terminology: 「イスラエルの子ら」は、原文の家族的・系譜的呼称を保つ適切な訳語である。「印章」はחותםの文脈に適切である。מִשְׁבְּצוֹת זָהָבは技法を過度に特定せず「金の枠」とするのが安全である。
