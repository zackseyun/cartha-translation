  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָשִׂיתָ֮ שְׁתֵּ֣י טַבְּע֣וֹת זָהָב֒ וְ/נָתַתָּ֣ה אֹתָ֡/ם עַל שְׁתֵּי֩ כִתְפ֨וֹת הָ/אֵפ֤וֹד מִ/לְּ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: ja
  text: また、金の輪を二つ作り、それをエフォドの二つの肩当ての下部、その前側で、つなぎ目[a]に対応する位置、エフォドの巧みに織った帯[b]の上に付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「接合部」「取り付け箇所」。ヘブライ語は、エフォドがつなぎ合わされる箇所を広く指す。
    reason: lexical_alternative
  - marker: b
    text: または「エフォドの織った腰帯」。ヘブライ語は、エフォドに付属する特別に作られた帯状の部分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹות
  choice: 輪
  rationale: 幕屋と祭司の装束において、留め具として用いる金属製の輪を指す通常の語であるため。
- source_word: כִתְפֹות
  choice: 肩当て
  rationale: 字義的には「肩」に関係するが、ここではエフォドを構成する肩の部分を指すため、衣服の部材として自然な訳語を選んだ。
- source_word: הָאֵפוֹד
  choice: エフォド
  rationale: 祭司の特定の装束を指す専門語であり、一語の説明的な日本語に置き換えず慣用的な音写を用いた。
- source_word: מִלְּמַטָּה
  choice: 下部
  rationale: 肩当ての低い側または下側への配置を表す。日本語では構造上の位置として「下部」が明瞭である。
- source_word: מִמּוּל פָּנָיו
  choice: その前側で
  rationale: 物の「顔」に当たる側、すなわち前面を示すヘブライ語の空間表現を自然な日本語にした。
- source_word: לְעֻמַּת
  choice: 対応する位置
  rationale: 向かい合うこと、位置がそろうこと、または対応関係を示し得るため、「真向かい」と狭く限定せず空間的対応を保った。
- source_word: מֶחְבַּרְתּוֹ
  choice: つなぎ目
  rationale: 縫い目だけでなく、部材が結合・接続される箇所を広く指す語なので、「縫い目」より意味範囲の広い「つなぎ目」とした。
- source_word: מִמַּעַל
  choice: 上に
  rationale: 後続する帯を基準として、それより上方にある位置を示す。
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: エフォドの巧みに織った帯
  rationale: エフォドに付属する、特別に作られた帯状または締め具状の部分を指す。文脈にある精巧な織物としての性格も表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かる、簡潔で dignified な命令文とした。祭司装束の専門語「エフォド」は保持し、複雑な位置関係は読点で区切って示した。「つなぎ目」と「帯」は原語の意味幅を狭めすぎないよう脚注を付した。
