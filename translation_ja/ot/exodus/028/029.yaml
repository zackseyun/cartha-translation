id: EXO.28.29
reference: Exodus 28:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: ja
  text: アロンは、聖所に入るとき、イスラエルの子ら[c]の名を胸の上の裁きの胸当て[b]に帯びる[a]。ヤハウェの前で絶えず記念とするために[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「担う」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「判定のための胸当て」とも訳せる。このヘブライ語の名称は、神の前で裁きや判定を求める祭司の務めと関係すると考えられる。
    reason: alternative_reading
  - marker: c
    text: 直訳「イスラエルの息子たち」。ここではイスラエルから出た諸部族を指す系譜的表現。
    reason: lexical_alternative
  - marker: d
    text: 「ヤハウェの前で絶えず記念となるために」とも訳せる。原文は、誰が思い起こすのかを明示していない。
    reason: ambiguity
lexical_decisions:
- source_word: וְנָשָׂא
  choice: 担い
  rationale: 「運ぶ、担う」を表す語。祭司が名を身に帯びて代表するという具体的・象徴的な意味を保つため、「担う」とした。
- source_word: שְׁמוֹת
  choice: 名
  rationale: 胸当ての宝石に刻まれた名を指すため、抽象的に部族と言い換えず、原文どおり「名」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの系譜的表現を保った。文脈上はイスラエルから出た諸部族を集合的に指す。
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: 裁きの胸当て
  rationale: חֹשֶׁןを祭司装束の「胸当て」、מִשְׁפָּטを「裁き」と訳した。判断や託宣との関係を一義的に限定しない表現である。
- source_word: עַל לִבּוֹ
  choice: 胸の上に
  rationale: לֵבは「心、心臓」を表すが、ここでは胸当てを着ける身体上の位置と象徴性の双方が関わるため、自然な日本語で「胸の上に」とした。
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: 聖所に入るとき
  rationale: 前置詞בְּを伴う不定詞構文の時間的意味を「入るとき」とし、הַקֹּדֶשׁは幕屋の聖なる空間を指す「聖所」とした。
- source_word: לְזִכָּרוֹן
  choice: 記念とする
  rationale: 「記念、想起」を表す語に目的を示すלְが付く。誰が思い起こすかを明示せず、原文の余地を保った。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 「～の前で、～の面前で」という定型句を自然に訳し、神名は「ヤハウェ」と音写した。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 祭儀における継続的・反復的なあり方を表すため「絶えず」とした。
theological_decisions:
- issue: בְּחֹשֶׁן הַמִּשְׁפָּטの祭儀的名称
  choice: 裁きの胸当て
  alternative: 判定のための胸当て
  rationale: この胸当てと神の裁き・判定との関係を保ちつつ、その具体的な機能を本文だけで狭く確定しないため。
- issue: בְּנֵי יִשְׂרָאֵלの系譜的表現
  choice: イスラエルの子ら
  alternative: イスラエルの子孫／イスラエル人
  rationale: 原文の男性複数かつ系譜的な形を保った。ここでは個々の男性だけでなく、イスラエルから出た諸部族を代表する表現である。
- issue: לְזִכָּרוֹן לִפְנֵי יְהוָהの主体
  choice: ヤハウェの前で絶えず記念とする
  alternative: ヤハウェに絶えず覚えていただくため
  rationale: 原文は「記念」が誰の想起を指すかを明示しないため、神が思い起こすという解釈に限定しなかった。
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を明示し、普通名詞的な称号へ置き換えないため。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭司文書らしい荘重さを保った。「胸当て」「聖所」など既に文脈で定まる祭儀用語を簡潔に用い、「記念」の主体に関する原文の曖昧さは解消しなかった。
