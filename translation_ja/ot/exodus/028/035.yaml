source:
  edition: WLC
  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: ja
  text: これは、アロンが祭司として仕えるときに身に着けるものである。その音[a]が、彼がヤハウェの前の聖所[b]に入るときにも、そこから出るときにも聞こえるようにしなければならない。彼が死ぬことのないようにするためである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直前の文脈では、上着の裾につけられた鈴の音を指す。直訳は「その音」。
    reason: referent_clarification
  - marker: b
    text: 「聖なる所」とも訳せる。ここでは幕屋の聖なる空間を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳的には「そして彼は死なない」。文脈上、「死なないために」「死ぬことのないように」、または「そうすれば彼は死なない」という目的・結果・警告の意味に理解できる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: アロンが……この上着を身に着ける
  rationale: 直訳的には「それはアロンの上にある」。直前に述べられた祭司の上着を指すため、日本語では自然に「この上着を身に着ける」とした。
- source_word: לְשָׁרֵת
  choice: 祭司の務めをするとき
  rationale: לְ を伴う不定詞は目的または状況を表す。ここでは祭司として奉仕する際の規定なので、文脈を明確にしつつ「祭司の務めをするとき」とした。
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: その音は……聞こえるようにする
  rationale: 接尾辞は文法上男性単数で、直前の上着（מְעִיל）を受けるのが自然。33–34節の鈴の音を指すが、本文では原文どおり「その音」として文脈とのつながりを保った。
- source_word: בְּבֹאוֹ ... וּבְצֵאתוֹ
  choice: 入るときにも、そこから出るときにも
  rationale: 前置詞 בְּ を伴う不定詞構文の時間的用法を自然な日本語で表し、対句関係も維持した。
- source_word: אֶל הַקֹּדֶשׁ
  choice: 聖所に
  rationale: 幕屋の聖なる空間を指す定冠詞付きの語。具体的範囲には文脈上の幅があるため、過度に限定せず「聖所」とした。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前
  rationale: 神の臨在の前で仕えることを表す定型句。神名 יהוה は固有名として「ヤハウェ」と表記した。
- source_word: וְלֹא יָמוּת
  choice: こうして、彼が死ぬことのないようにする
  rationale: 形式上は「そして彼は死なない」だが、祭儀規定の文脈では予防的な目的・結果を表す。現代日本語でその関係が明確になるように訳した。
theological_decisions:
- issue: 聞こえる「音」が何を指すか
  choice: 上着につけられた鈴の音を指すものと理解し、本文では「その音」とした
  alternative: アロン自身の動きや存在が発する音を広く指す
  rationale: 直前の33–34節が上着の裾につける鈴を述べており、また「音」の接尾辞は男性単数の「上着」を自然に受ける。ただし本文には「鈴」という名詞がないため、訳文で補いすぎないようにした。
- issue: וְלֹא יָמוּת の論理関係
  choice: 規定を守ることによる予防的な目的・結果として訳す
  alternative: 単純な帰結として「そうすれば彼は死なない」、または警告として「死ぬことのないように」
  rationale: 接続詞と否定未完了形だけでは目的・結果・警告の境界を厳密に一つへ限定できない。本文は自然な目的表現とし、脚注で直訳的な可能性を示した。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を固有名として明示し、一般名詞的な称号との区別を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀規定にふさわしい簡潔で厳粛な調子を保った。「奉仕する」だけでは対象が曖昧になりやすいため「祭司の務めをする」とした。原文で明示されない「鈴」は本文に補わず脚注で説明し、接尾辞の指示対象と終結句の目的・結果の幅を保持した。
