  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: ja
  text: その名のうち六つを一方の石に、残る六つの名を第二の石に、生まれた順に[a]刻む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生まれた順に」と訳した語は、系譜または世代に従って、という意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: その名のうち六つ
  rationale: 部分を示す前置詞 מִן を「〜のうち」と表し、十二の名から六つを配する意味を明確にした。
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: 一方の石に
  rationale: הָאֶחָת は後半の「第二の石」と対をなす。日本語では「一方の石」が自然で、必ずしも序数を明示しない原文の形も保てる。
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: 残る六つ
  rationale: נוֹתָרִים の「残っている」という意味を簡潔な現代日本語で表した。
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: もう一方の石に
  rationale: 直訳は「第二の石に」だが、前半の「一方」と対応させることで二つの石への配分を自然に表した。順序そのものが重要だと断定することは避けた。
- source_word: כְּתוֹלְדֹתָם
  choice: 生まれた順に
  rationale: תּוֹלְדוֹת は系譜・出生・世代を表し得るが、イスラエルの子らの名を六つずつ配置する文脈では出生順を指すと理解するのが最も自然である。
- source_word: （前節から補った動詞）
  choice: 刻む
  rationale: この節はヘブライ語では前節に依存する断片的な命令内容である。日本語で独立して読めるよう、28:9の「名を彫る／刻む」を文末に補った。
