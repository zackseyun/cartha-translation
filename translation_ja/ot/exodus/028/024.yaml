  terminology: 「胸当て」は חֹשֶׁן の祭司装束として自然であり、継続使用に適する。「より綱」は金属製の鎖であることがやや伝わりにくいため、「編み鎖」に改める。現行脚注bは「胸当て」を重複しており、代替訳の説明として機能していない。
