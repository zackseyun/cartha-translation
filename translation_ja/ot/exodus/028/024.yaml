  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: ja
  text: 金の編み鎖[a]二本を、胸当て[b]の両端にある二つの輪に取り付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「編み鎖」は「より合わせた鎖」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「胸当て」は、伝統的に「胸甲」とも訳される祭司の装束の一部を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: また、…取り付けなさい
  rationale: 命令・指示が連続する文脈で、金の綱を輪に固定する動作を自然な現代日本語で表した。
- source_word: עֲבֹתֹת הַזָּהָב
  choice: 金のより綱
  rationale: עֲבֹתֹת は、より合わせた、または編んだ綱状の細工を指す。金製であることと、その構造の両方を簡潔に表した。
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: 二つの輪に
  rationale: עַל はここでは輪への装着を示すため、日本語では助詞「に」が自然である。טַבָּעֹת は装着用の輪を指す。
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: 胸当ての両端にある
  rationale: 直訳的には「胸当ての端々の方に」だが、文脈上、二つの輪の位置を胸当ての両端と明示する表現が自然である。
- source_word: הַחֹשֶׁן
  choice: 胸当て
  rationale: 祭司の装束の一部であり、防具を連想させる「胸甲」よりも、形状と用途について余分な限定を加えない「胸当て」が適切である。
