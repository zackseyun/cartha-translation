  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: ja
  text: あなたは、イスラエルの子ら[a]の中から、あなたの兄アロンと共にその子らをあなたのもとに近づけ、わたしに仕える祭司としなさい。すなわち、アロンと、その子ナダブ、アビフ、エルアザル、イタマルである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は「イスラエル人」とも訳せる。ヘブライ語では、契約の民を指す定型的な呼び名である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: あなたは
  rationale: 独立代名詞によるモーセへの強調を保ちつつ、日本語では主題提示によって自然に表した。
- source_word: הַקְרֵב אֵלֶיךָ
  choice: あなたのもとに近づかせ
  rationale: קרבのヒフィル形の具体的な『近づける』という意味と、אֵלֶיךָが示すモーセへの方向を保持した。ここでは『任命する』と意訳して祭司聖別の全過程を先取りしない。
- source_word: אָחִיךָ
  choice: 兄
  rationale: アロンがモーセより年長であるという物語上の関係を踏まえ、現代日本語で自然な親族呼称とした。
- source_word: בָּנָיו אִתּוֹ
  choice: その息子たちを彼とともに
  rationale: 同行・同伴を示すאִתּוֹを明示し、アロンと息子たちが一緒に選び出されることを保った。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの中から
  rationale: 契約共同体を表す定型的呼称בְּנֵי יִשְׂרָאֵלの形を残し、選び出す範囲を示すמִתּוֹךְを『中から』とした。
- source_word: לְכַהֲנוֹ לִי
  choice: わたしのために祭司として仕えさせなさい
  rationale: כהןの祭司職として奉仕する意味と、לִיの『わたしのために』を明示した。日本語では前の使役命令に目的を連結して自然に表現した。
- source_word: בְּנֵי אַהֲרֹן
  choice: アロンの息子である
  rationale: 列挙された四人がアロンの息子であることを自然な日本語で明示した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵלという共同体呼称
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の『イスラエルの子ら』という契約共同体の定型表現を本文に保持した。一方、現代日本語で共同体全体を指す意味は『イスラエル人』とも表せるため脚注に示した。
- issue: הַקְרֵבの祭儀的含意
  choice: 近づかせ
  alternative: 任命し／聖別し
  rationale: この命令は祭司任職の文脈にあるが、語そのものは『近づける』であり、任命や聖別という後続の行為まで語義に取り込まないようにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令文の長さを整えるため、氏名の列挙を「すなわち」で受けた。原文冒頭の強調された『あなた』、モーセへの方向、祭司奉仕の目的を明示した。
