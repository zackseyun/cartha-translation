source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: ja
  text: また、裁きの胸当て[a]を、巧みに意匠を凝らした細工として作りなさい。エフォドと同じように作りなさい。すなわち、金、青糸、紫糸、緋色の糸、撚り合わせた上質の亜麻糸を用いて、これを作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「裁きのための胸当て」「決定の胸当て」。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: 胸当て
  rationale: 大祭司が胸に着ける祭儀用装身具を指す。「胸当て」は、武具を連想させやすい「胸甲」よりも文脈に適している。
- source_word: מִשְׁפָּט
  choice: 裁きの
  rationale: 構文上の結び付きを保ちつつ、司法的判断または祭司による決定との関係を限定しすぎない表現とした。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠の細工
  rationale: 考案された模様を熟練の技で仕上げる職人仕事を表す句として、設計性と技量の両方を伝える。
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: エフォドと同じ作り方で
  rationale: エフォドと同種の技法・仕立てによるという比較を、自然な現代日本語で表した。
- source_word: אֵפֹד
  choice: エフォド
  rationale: 固有の祭司装束であり、簡潔で正確な日本語の対応語がないため音写した。
- source_word: זָהָב
  choice: 金
  rationale: 材料名をそのまま明確に訳した。
- source_word: תְּכֵלֶת
  choice: 青糸
  rationale: 幕屋の織物に用いる染色糸という文脈を明示した。色調を青紫などに狭めず、慣用的な「青」とした。
- source_word: אַרְגָּמָן
  choice: 紫糸
  rationale: 高価な紫染めの繊維材料を指すため、材料列に合わせて「糸」を補った。
- source_word: תוֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 緋色に染めた繊維材料を指す慣用句として、自然で格調ある表現を選んだ。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻布・亜麻糸と、מָשְׁזָרの撚り合わせた状態をともに明示した。
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: 作りなさい……これを作りなさい
  rationale: ヘブライ語の反復を残し、指示文の強調とリズムを保った。
theological_decisions:
- issue: חֹשֶׁן מִשְׁפָּט の機能
  choice: 「裁きの胸当て」と形式的に訳し、その機能を本文以上に特定しない。
  alternative: 「裁きのための胸当て」「決定の胸当て」
  rationale: 祭司による判断や決定との祭儀的関係が考えられるが、この節自体は具体的な仕組みを説明していないため、曖昧さと神学的含意を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭具製作の指示にふさわしい簡潔で格調ある命令調とした。「エフォド」は専門的な祭司装束名として音写し、「裁きの胸当て」は原文の曖昧さを保つため注を付した。
