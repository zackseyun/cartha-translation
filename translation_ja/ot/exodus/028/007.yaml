  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: ja
  text: それには、両端に結び付けられる二つの肩にかかる部分[a]があり、それは一つに接合される[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「二つの肩ひも」。ヘブライ語は、文字どおりの肩ではなく、衣服の肩にかかる部分を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「そして、それは接合される」。最後の句は、肩にかかる部分によってエフォドが接合されることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: 二つの肩当て
  rationale: כְתֵפֹת はここでは人体の「肩」そのものではなく、エフォドの肩にかかる部分を指す。「肩当て」は衣服の構造として理解しやすく、原語の身体部位との関連も保つ。
- source_word: חֹבְרֹת
  choice: つなぐ
  rationale: חבר の分詞で、二つの肩当てが衣の両端を接続する働きを表す。日本語では連体的に「両端をつなぐ」とすると自然である。
- source_word: יִהְיֶה לּוֹ
  choice: それには…を付ける
  rationale: ל を伴う存在構文は所有を表す。祭服製作の指示として、直訳的な「それには…がある」より「…を付ける」が自然である。
- source_word: אֶל שְׁנֵי קְצוֹתָיו
  choice: 両端を
  rationale: קָצֶה は端・末端を意味する。接続動作を自然な日本語で表すため、אֶל の関係を動詞「つなぐ」の目的語として示した。
- source_word: וְחֻבָּר
  choice: こうして、それは一つにつながる
  rationale: חבר の受動形を保ちつつ、前節の構造によって衣が接合される結果を自然な日本語で示す。「一つに」は「ともに接合される」という文脈上の意味を明確にする。
