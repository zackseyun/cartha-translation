  text: וְ/עָשִׂ֣יתָ עַל שׁוּלָ֗י/ו רִמֹּנֵי֙ תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י עַל שׁוּלָ֖י/ו סָבִ֑יב וּ/פַעֲמֹנֵ֥י זָהָ֛ב בְּ/תוֹכָ֖/ם סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: ja
  text: その裾の周りに、青、紫、緋色の糸でざくろを作り、その間に金の鈴を、その周りを巡るように付けなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 付けなさい
  rationale: 祭服製作の指示における命令として訳した。目的語は装飾物であり、日本語では「作る」だけでなく裾への配置まで含めて「付ける」とするのが自然である。
- source_word: עַל שׁוּלָיו
  choice: その裾の周りに／裾の周りに
  rationale: שׁוּלָיו は上着の下端、すなわち裾を指す。סָבִיב と合わせ、全周に配置することを明確にした。
- source_word: רִמֹּנֵי
  choice: ざくろ
  rationale: ヘブライ語は字義どおり「ざくろ」と言う。文脈上はざくろ形の飾りを指す可能性が高いが、本文では原文の簡潔な表現を保持し、補足を脚注に置いた。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の糸
  rationale: 幕屋の織物に用いられる三種の色材を表す。日本語で素材関係を明瞭にするため「糸」を補った。
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: 金の鈴
  rationale: 金製の鈴を簡潔かつ自然な日本語で表した。接続詞は文の構造に合わせて「ざくろの間には」と統合した。
- source_word: בְּתוֹכָם
  choice: ざくろの間には
  rationale: 直訳は「それらの中に／間に」。代名詞の指示対象を明示し、鈴がざくろの間に配置される空間関係を自然に表した。
- source_word: סָבִיב
  choice: 周りに
  rationale: 装飾が裾を一周して配置されることを示す。原文で二度現れるため、本文でも配置対象ごとに反映した。
