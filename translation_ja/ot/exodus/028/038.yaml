id: EXO.28.38
reference: Exodus 28:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: ja
  text: それはアロンの額にあり、アロンは、イスラエルの人々が彼らの聖なる献げ物すべてに関して聖別する聖なるものの咎を負う[a][b]。それは常に彼の額にあり、彼らがヤハウェの前で受け入れられるようにする[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「咎を負う」は「罪責を担う」とも訳せる。ここでのヘブライ語の慣用句は、聖なる奉献物に関わる咎について責任を負うことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「聖なるもの」と「彼らの聖なる献げ物すべて」の関係を示す原文の構文は解釈が難しい。「彼らの聖なる献げ物すべてのために聖別する聖なるものの咎」または「彼らの聖なる献げ物すべてに関する咎」とも訳せる。
    reason: textual_ambiguity
  - marker: c
    text: 直訳すると「彼らのための好意となるように」。また「彼らがヤハウェの前で好意を受けるため」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: 額
  rationale: 頭部の前面を指す語であり、現代日本語では「額」が明瞭で自然である。
- source_word: נָשָׂא ... עֲוֺן
  choice: 咎を負う
  rationale: 祭司的・法的文脈において、罪責または責任を担うことを表す慣用句である。「咎を負う」は、その意味を保ちつつ、除去や赦しまで明示しない。
- source_word: הַקֳּדָשִׁים
  choice: 聖なるもの
  rationale: 礼拝のために取り分けられた奉献物などを指す複数形であり、祭儀上の範疇を限定しすぎずに表す。
- source_word: יַקְדִּישׁוּ
  choice: 聖別する
  rationale: 神のために聖なるものとして取り分け、献げる行為を表すため、「聖別する」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: イスラエルの民を表す契約的な呼称について、原文の形を保った。
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: 彼らの聖なる贈り物すべてに伴う
  rationale: 統語関係に難しさがあるため、「聖なるもの」と「贈り物」の関係を示しつつ、咎がそれらに関連することを自然な日本語で表した。
- source_word: תָּמִיד
  choice: 常に
  rationale: 継続して額にあるべきことを、簡潔で自然な現代日本語で表す。
- source_word: לְרָצוֹן לָהֶם
  choice: 彼らが…受け入れられるため
  rationale: 目的または結果を示す句として読み、礼拝者がその奉献物との関係において神の前に受け入れられることを表した。奉献物だけに指示対象を限定してはいない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写して示す。
theological_decisions:
- issue: アロンが「聖なるものの咎を負う」ことの意味
  choice: 聖なる奉献物に伴う咎または罪責を、祭司として負う
  alternative: その罪を直接取り除く、またはイスラエルの罪の記憶を象徴的に担う
  rationale: נָשָׂא עָוֺן は罪責や責任を負うことを表し得る。訳文は、贖いの仕組みをこの節以上に説明せず、祭司的な代表性と罪責の緊張を残す。
- issue: 「彼らが受け入れられる」の指示対象
  choice: 奉献物との関係において、イスラエルの民がヤハウェの前で受け入れられる
  alternative: 奉献物だけが受け入れられる
  rationale: 「彼らに」は自然には礼拝者を指すが、文脈上は彼らの奉献物も関わる。訳文では民を文法上の主語としつつ、脚注で「好意」の意味も示して狭く断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司的・礼拝的文脈にふさわしい端正さを保った。「咎」「聖別」「ヤハウェ」など、本文の神学的・祭儀的語彙は平易化しすぎず保持した。
