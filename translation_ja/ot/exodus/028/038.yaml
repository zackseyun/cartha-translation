revisions:
- from: それはアロンの額に付ける。アロンは、イスラエルの子らが聖別する聖なるもの、すなわち彼らの聖なる贈り物すべてに伴う咎を負う[a][b]。それは常に彼の額にあり、彼らがヤハウェの前で受け入れられるためである[c]。
  to: それはアロンの額にあり、アロンは、イスラエルの人々が彼らの聖なる献げ物すべてに関して聖別する聖なるものの咎を負う[a][b]。それは常に彼の額にあり、彼らがヤハウェの前で受け入れられるようにする[c]。
  rationale: 冒頭を原文どおり冠板の所在を述べる表現に改めた。「すなわち」を削除し、難しいヘブライ語構文を日本語本文で同格として確定しないようにした。受容の対象は礼拝者を主に指すが奉献物との関係も含意するため、その広さを本文と脚注で保っている。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:57Z'
