    rationale: 原文の וְשִׁבַּצְתָּ、וְעָשִׂיתָ、תַּעֲשֶׂה はいずれも文脈上の命令である。現行文は第一節を「作り」として後続節につなげる一方、第二・三節を終止形「作る」としており、日本語の指示文として不自然である。
  - severity: low
    issue: 「かぶり物」がミツネフェトの語義をやや一般化している。
    rationale: מִצְנֶפֶת は祭司の巻き付ける頭部装具を指す。「ターバン」は現代日本語で明瞭であり、過度に曖昧にしない。
  - severity: low
    issue: 「刺繍の技法で」は職人を表す構文を技法へ言い換えている。
    rationale: מַעֲשֵׂה רֹקֵם は字義的には刺繍師・装飾織りの職人の仕事であるため、「刺繍師の仕事による」として構文上の職人性を保つ。
