  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: ja
  text: 上質な亜麻布の長衣を格子模様に織りなさい[a]。上質な亜麻布でターバンを作りなさい。また、刺繍師の仕事による飾り帯を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「上質な亜麻布で、格子模様の長衣を作りなさい」。ヘブライ語の動詞は、模様のある織物を作ることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ הַכְּתֹנֶת שֵׁשׁ
  choice: 上質の亜麻布で、格子模様に織った長衣を作り
  rationale: שׁבץ は祭司衣装の文脈では模様のある織物を作ることを指す可能性が高い。日本語では完成した模様と織物技法の双方が伝わる表現とした。כְּתֹנֶת は体を覆う衣であり、祭司衣装として自然な「長衣」を採用した。שֵׁשׁ は幕屋関連の文脈で上質な亜麻布を指す。
- source_word: מִצְנֶפֶת
  choice: かぶり物
  rationale: 頭に巻いて着ける祭司用の装具を指す。「ターバン」より文化的な連想を抑えつつ、現代日本語で明瞭な表現とした。
- source_word: אַבְנֵט
  choice: 飾り帯
  rationale: 祭司が腰に締める装飾的な長い帯であり、単なるベルトではないことを示すため「飾り帯」とした。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 刺繍の技法で
  rationale: 熟練した職人による装飾的な織り・刺繍の仕事を表す。日本語として自然に製法を示す表現を採用した。
