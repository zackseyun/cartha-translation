source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י אַהֲרֹן֙ תַּעֲשֶׂ֣ה כֻתֳּנֹ֔ת וְ/עָשִׂ֥יתָ לָ/הֶ֖ם אַבְנֵטִ֑ים וּ/מִגְבָּעוֹת֙ תַּעֲשֶׂ֣ה לָ/הֶ֔ם לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: ja
  text: アロンの子らのために長衣を作り、彼らのために帯を作り、また彼らのためにかぶり物[a]を作りなさい。これらは栄光と美しさのためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帽子」「ターバン」または「頭巾」とも訳せる。祭司用の頭部装具を指す。
    reason: 原語が指す祭司用頭部装具の正確な形状には不確かさがあり、複数の訳語が可能なため。
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: アロンの子らのためには
  rationale: 直接の父子関係をそのまま示し、「子孫」へ意味を広げない。日本語としても自然な表現とした。
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: 作りなさい
  rationale: 祭司の衣服についての指示・命令であることを、明確で品位ある現代日本語で表す。
- source_word: כֻתֳּנֹת
  choice: 長衣
  rationale: 体を覆う基本的な衣服であるチュニックを指す。「上着」や「外套」より形状を誤解させにくく、祭司装束の文脈にも適する。
- source_word: אַבְנֵטִים
  choice: 帯
  rationale: 腰に巻く布製の帯を指す。現代的で硬質なベルトを連想させず、日本語で簡潔かつ自然である。
- source_word: מִגְבָּעוֹת
  choice: 頭巾
  rationale: アロンの子らが着ける祭司用の被り物を示す。具体的な形状は確定しにくいため、「帽子」や「ターバン」と断定せず、巻いて頭を覆う装具を表し得る語を選んだ。
- source_word: לְכָבוֹד
  choice: 栄光のため
  rationale: 威厳、誉れ、輝かしさを含む語の幅を保つため「栄光」とした。祭服の目的を単に実用性へ限定しない。
- source_word: וּלְתִפְאָרֶת
  choice: 美しさのため
  rationale: 美、麗しさ、華やかさを表す語を、一般の読者に明瞭な「美しさ」で訳した。
theological_decisions:
- issue: 祭司の衣服を作る目的を表す句
  choice: これらは栄光と美しさのためである
  alternative: これらは威厳と華やかさを添えるためである
  rationale: 原文の簡潔な目的句と、「栄光／誉れ」「美／華麗さ」という意味の幅を保った。衣服が何に、または誰に栄光を帰するかを本文以上に特定せず、後代の象徴解釈も加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祭儀上の指示にふさわしい簡潔で品位ある調子とした。反復される「彼らのために」を適度に保持し、原文の構造を見える形にしている。
