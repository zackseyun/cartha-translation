  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָ/עֲבֹתֹ֔ת תִּתֵּ֖ן עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצ֑וֹת וְ/נָתַתָּ֛ה עַל כִּתְפ֥וֹת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: ja
  text: 二本の組みひもの、もう一方の端を二つの台座[a]に取り付け、それらをエフォドの肩当ての前側に付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二つの飾り座」とも訳せる。金製の取り付け部分を指す語だが、その具体的な形は確定しにくい。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: 両端
  rationale: 二本の組みひもの末端を指す。日本語では「両端」が自然で、構造も明確になる。
- source_word: הָעֲבֹתֹת
  choice: 組みひも
  rationale: 語は太いひもや編んだ鎖状のものを表し得る。直前の金細工の文脈を踏まえつつ、材質や構造を過度に限定しない訳語とした。
- source_word: הַמִּשְׁבְּצֹת
  choice: 台座
  rationale: エフォドに付く金製の取り付け部分を指す。「飾り座」など形状を限定する表現を避け、現代日本語で分かりやすくした。
- source_word: כִתְפֹת
  choice: 肩当て
  rationale: 字義は「肩」だが、衣服の構造を示す文脈なので、身体部位ではなくエフォドの肩部分であることを明示した。
- source_word: אֵפֹד
  choice: エフォド
  rationale: 対応する一般的な日本語名称がない祭司の特殊な装束なので、音写を用いた。
- source_word: אֶל מוּל פָּנָיו
  choice: 前側に
  rationale: エフォドの正面を向く側への配置を表す。所有接尾辞の指示対象を文脈からエフォドと捉え、簡潔に表現した。
- source_word: וְנָתַתָּה
  choice: それを…付けなさい
  rationale: 文脈上、台座に取り付けられた組みひもの端を含む一式を肩当てに配置する指示。日本語で対象を曖昧に増やさないよう単数的な「それ」で受けた。
