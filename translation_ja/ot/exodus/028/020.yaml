  text: 第四の列は、緑柱石[a]、オニキス、碧玉。これらを金の枠にはめ込む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 祭司の胸当てに用いられた宝石のうち、いくつかは正確な種類が分かっていない。תַּרְשִׁישׁは伝統的に「緑柱石」、שֹׁהַםは「オニキス」などと訳されるが、ほかの見解もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: 第四の列は
  rationale: 胸当てに並べる宝石の四つの列の最後を示すため、טּוּרを文脈に即して「列」とした。接続詞は、日本語では列挙の流れが明らかなため独立した「そして」を置かずに表した。
- source_word: תַּרְשִׁישׁ
  choice: 緑柱石
  rationale: 鉱物の同定には不確かさがあるが、伝統的な候補の一つであるベリルを現代日本語の名称「緑柱石」で示した。不確かさは脚注に明記した。
- source_word: וְשֹׁהַם
  choice: しまめのう
  rationale: 伝統的な「オニキス」に相当する分かりやすい日本語名を採用した。ただし古代の石の厳密な同定は不確かなため脚注で留保した。
- source_word: וְיָשְׁפֵה
  choice: 碧玉
  rationale: יָשְׁפֵהの標準的な宝石名として「碧玉」を用いた。
- source_word: מְשֻׁבָּצִים זָהָב
  choice: 金の台座にはめ込む
  rationale: 宝石が金に据えられるという受動分詞の内容を、製作指示として自然な現代日本語にした。
- source_word: יִהְיוּ בְּמִלּוּאֹתָם
  choice: 台座にはめ込む
  rationale: יִהְיוּの規定・指示の力を「〜込む」で表し、מִלּוּאֹתָםは宝石を固定する受け枠を指すものとして「台座」とした。מְשֻׁבָּצִיםと意味が重なるため、日本語では一つの簡潔な表現にまとめた。
