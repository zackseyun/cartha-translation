  yaml_path: translation/ot/exodus/028/022.yaml
  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: ja
  text: また、胸当てに、純金で縄のように編んだ鎖[a]を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ねじった鎖」あるいは「縄状の鎖」とも訳せる。ヘブライ語は、縄のようにねじる、または編む仕方で作られた鎖を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、……作りなさい
  rationale: 接続詞を伴う完了形は、一連の製作指示の中で命令の働きをする。「作りなさい」によって規定としての力を明確にし、וְは文脈に自然な「また」で表した。
- source_word: עַל הַחֹשֶׁן
  choice: 胸当てに
  rationale: עַלの基本的な位置・付着の意味を保ち、鎖が胸当てに取り付けられることを自然な現代日本語で示した。
- source_word: שַׁרְשֹׁת
  choice: 鎖
  rationale: 装身具・祭具の文脈で、連なった鎖を指す標準的で明快な語を選んだ。ヘブライ語は複数形だが、日本語では「鎖」が数を特定せず自然に用いられる。
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: 縄のように編んだ
  rationale: 束ねる、ねじる、編むという形状と、縄状の細工を表す難解な句を、「縄のように編んだ」として具体的かつ自然に表した。語義には「ねじった」「縄状の」などの幅があるため脚注で保持した。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 幕屋製作の記事における標準的な素材表現として、意味に忠実で現代日本語にも自然な「純金」を用いた。助詞「で」により材料であることを明示した。
