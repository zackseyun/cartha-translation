translation:
  language: ja
  text: 第二の列は、トルコ石[a]、サファイア、ダイヤモンド。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代の宝石名のいくつかは、正確な同定が確定していない。「トルコ石」は「エメラルド」または「カーバンクル」、「サファイア」は「ラピスラズリ」、「ダイヤモンド」は「ヒヤシンス石」または「碧玉」を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר הַ/שֵּׁנִי
  choice: 第二の列は
  rationale: טוּרは胸当てに宝石を並べる文脈で「列」を意味し、הַשֵּׁנִיはその列を「第二の」と限定する。接続詞וְは、続く列挙であることが日本語の文脈から明らかなため、独立した「そして」とせず自然な題述にまとめた。
- source_word: נֹפֶךְ
  choice: トルコ石
  rationale: 古代の宝石名の正確な同定には不確かさがあるが、現代の読者に通じる有力な対応語として採用し、他の可能性は脚注に残した。
- source_word: סַפִּיר
  choice: サファイア
  rationale: 伝統的で理解しやすい訳語を採用した。ただし、現代のサファイアではなくラピスラズリを指す可能性があるため、脚注で示した。
- source_word: וְ/יָהֲלֹם
  choice: ダイヤモンド
  rationale: 一般的な伝統訳を用いたが、古代語の指示対象は確定できず、ヒヤシンス石または碧玉とする可能性を脚注に残した。語頭のוְは日本語の並列読点によって表した。
theological_decisions: []
