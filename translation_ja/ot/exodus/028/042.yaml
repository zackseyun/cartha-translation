  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: ja
  text: 彼らのために、裸の身体を覆うための亜麻布の下着[a]を作りなさい。それらは腰からももまでを覆うものとしなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「亜麻布の短いズボン」とも訳せる。祭司の装束の下に着ける、下半身用の衣類を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「腰からももまで、それらはあるものとする」。衣服が覆う範囲を示している。
    reason: translation_clarity
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: 作り……しなさい
  rationale: 接続詞を伴う命令形。前後の指示との連続性を保ちつつ、現代日本語の自然な命令文とした。
- source_word: לָהֶם
  choice: 彼らのために
  rationale: 直前までに述べられた祭司たちを指す受益の表現。
- source_word: מִכְנְסֵי בָד
  choice: 亜麻布の下着
  rationale: 祭司の装束の下に着ける下半身用衣類を指すため、古風になりすぎず機能も明確な「下着」とした。בָד は祭司衣装の素材として亜麻布を表す。
- source_word: לְכַסּוֹת
  choice: 覆うように
  rationale: 目的を表す不定詞であり、下着を作る目的として自然に表現した。
- source_word: בְּשַׂר עֶרְוָה
  choice: 裸の部分
  rationale: 直訳は「裸の肉」だが、ここでは露出してはならない身体部分を指す。「裸の部分」は具体性を残しながら、不自然な逐語訳や過度な限定を避ける。
- source_word: מִמָּתְנַיִם
  choice: 腰から
  rationale: מָתְנַיִם は腰・腰部・臀部周辺を指し得る。衣服の上端を述べる文脈で自然な「腰」を採用した。
- source_word: וְעַד יְרֵכַיִם
  choice: ももまで
  rationale: יָרֵךְ の基本的意味である「もも」を用い、衣服の下端を示した。
- source_word: יִהְיוּ
  choice: 覆うものとする
  rationale: 直訳は「それらは……である」。日本語では範囲だけを「腰からももまでである」とすると不自然なため、衣服がその範囲を覆うという文脈上の意味を補い、規定文として表した。
