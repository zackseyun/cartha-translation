  text: וְ/לָ֣קַחְתָּ֔ אֶת שְׁתֵּ֖י אַבְנֵי שֹׁ֑הַם וּ/פִתַּחְתָּ֣ עֲלֵי/הֶ֔ם שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/009.yaml
  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: ja
  text: また、二つの縞めのう[a]を取り、その上にイスラエルの息子たちの名を彫り刻みなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「ショハム」がどの宝石を指すかは確定していない。伝統的には「縞めのう（オニキス）」と訳されるが、サードオニキスや緑柱石などとする説もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: また、…取り
  rationale: 接続詞を伴う完了形は、一連の指示の中で命令の働きをする。「また」で前文からの継続を示し、「取りなさい」に相当する指示を後続動詞と自然にまとめた。
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: 二つの縞めのう
  rationale: שֹׁהַם の鉱物学的同定には不確かさがあるが、伝統的な「onyx」に対応し、現代日本語で宝石名として通用する「縞めのう」を本文に採用した。不確かさは脚注で明示する。
- source_word: וּפִתַּחְתָּ
  choice: 彫り刻みなさい
  rationale: 宝石の表面に人名を刻み込む行為を表すため、単なる「書き記す」ではなく、具体的な加工を示す「彫り刻む」とした。指示の力も明確にした。
- source_word: עֲלֵיהֶם
  choice: その上に
  rationale: 複数の石を受ける代名詞を、日本語で自然かつ明瞭な「その上に」と訳した。
- source_word: שְׁמוֹת
  choice: 名
  rationale: 刻む対象である固有の名前を簡潔に表す。日本語では文脈上、定冠詞に相当する要素を明示する必要がない。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たち
  rationale: ここでは民族一般ではなく、部族の祖となるヤコブ（イスラエル）の息子たちを指すため、「イスラエル人」ではなく原文の親子関係を保った。
theological_decisions: []
translation_notes:
  register: 祭司の装束についての指示として、明確で格調を保ちつつ、現代の一般読者に理解しやすい命令表現を用いた。原文の連続する指示は「また」でつなぎ、「取って…彫り刻みなさい」という自然な日本語の構文にした。
