  text: וְ/שַׂמְתָּ֤ אֹת/וֹ֙ עַל פְּתִ֣יל תְּכֵ֔לֶת וְ/הָיָ֖ה עַל הַ/מִּצְנָ֑פֶת אֶל מ֥וּל פְּנֵֽי הַ/מִּצְנֶ֖פֶת יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: ja
  text: それを青いひも[a]に付け、ターバンの上に置く。それはターバンの正面に来るようにする[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青い糸」または「青い綱」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は直訳すると「ターバンの正面に向かって」となり、その前側に配置することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: それを…に付け
  rationale: שׂיםは「置く、据える」の意だが、ひもとの関係を自然な日本語で表すため、取り付ける意味合いの「付ける」とした。
- source_word: פְּתִיל
  choice: ひも
  rationale: 留めるための糸・ひもを指す。日本語では太さを限定しすぎず、用途にも適する「ひも」が明瞭である。
- source_word: תְּכֵלֶת
  choice: 青い
  rationale: 幕屋の材料に用いられる高価な青系の染色を指す。具体的な色相には不確実性があるため、簡潔に「青い」とした。
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: ターバンの上に置く
  rationale: מִצְנֶפֶתは大祭司の巻き物状のかぶり物。「ターバン」は現代日本語で形状を明確に伝える。עַלはここでは装着位置を示す。
- source_word: אֶל מוּל פְּנֵי
  choice: 正面に来るように
  rationale: 対象の前面に向いた配置を示す表現。直訳的な「正面に向かい合って」より、配置指示として自然で明瞭な表現を選んだ。
- source_word: יִהְיֶה
  choice: 来るようにする
  rationale: 最後の未完了形が位置を重ねて指定する点を保ちつつ、自然な日本語の指示文とした。
