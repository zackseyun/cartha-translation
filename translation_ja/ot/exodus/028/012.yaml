language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: ja
  text: あなたはその二つの石を、イスラエルの子ら[b]のための記念の石[a]として、エフォドの肩当てに据えなさい。アロンは、覚えのために、ヤハウェの前で自分の両肩に彼らの名を負う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「覚えの石」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「イスラエルの息子たち」。ここでは、イスラエルの民全体を指す家族的・契約的な表現。
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 据えなさい
  rationale: שׂיםの「置く、据える」を、祭服に宝石を固定する文脈に合う自然な命令表現で訳した。
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: その二つの石
  rationale: 定冠詞を文脈照応の「その」で表し、この節にない石の種類は補わなかった。
- source_word: כִּתְפֹת הָאֵפֹד
  choice: エフォドの肩当て
  rationale: ここでのכָּתֵףは人体の肩ではなく、エフォドの肩部分を指すため「肩当て」とした。
- source_word: אַבְנֵי זִכָּרֹן
  choice: 記念の石
  rationale: 構文を明瞭に保ちつつ、זִכָּרוֹןの記念・想起の機能を自然な日本語で表した。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: בְּנֵיの家族的・契約的表現を保持した。イスラエルの民全体を指し得る点は脚注で説明した。
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: 彼らの名を……担う
  rationale: נשׂאの具体的な「載せて運ぶ」と祭司の代表的役割の双方を伝える「担う」を採用した。
- source_word: לִפְנֵי יְהוָה
  choice: ヤハウェの前に
  rationale: לִפְנֵיを「前に」と訳し、固有の神名יהוהは「ヤハウェ」と音写した。
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: 自分の両肩に載せて
  rationale: 前半の祭服の肩当てと区別し、ここではアロン自身の二つの肩を指すことを明確にした。
- source_word: לְזִכָּרֹן
  choice: 覚えのために
  rationale: 前半のזִכָּרֹןとの語彙上の連関を保ちながら、誰が覚えるのかを限定しない表現とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有の契約名を普通名詞的な称号に置き換えず、現代日本語で一般的な音写を用いた。
- issue: בְּנֵי יִשְׂרָאֵל の範囲
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の家族的表現を本文に残した。ただし文脈上は男性だけに限定されず、契約共同体であるイスラエル全体を代表し得るため、その点を脚注で示した。
- issue: לְזִכָּרֹן において誰が覚えるか
  choice: 覚えのために
  alternative: ヤハウェに思い起こしていただくため／イスラエルに覚えさせるため
  rationale: 原文は想起の主体を明示していないため、神または民のどちらかに限定する解釈を本文へ持ち込まなかった。
translation_notes:
  register: 明瞭で現代的ながら礼拝文書にふさわしい格調を保った。「エフォド」は祭司の装束を指す定着した聖書用語として音写し、前半の「肩当て」と後半のアロン自身の「両肩」を訳し分けた。
