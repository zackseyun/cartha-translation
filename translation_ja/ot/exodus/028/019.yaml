  text: 第三列は、ヒヤシンス石[a]、めのう[b]、紫水晶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここに挙げられる宝石の正確な同定には不確かな点がある。「ヒヤシンス石」はלֶשֶׁםの訳で、伝統的には「リグリア石」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: שְׁבוֹは「オニキス」の可能性もある。古代の宝石名は、現代の鉱物名と必ずしも正確には対応しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הַשְּׁלִישִׁי
  choice: 第三列は
  rationale: 胸当てに並べる宝石の列を指す。接続詞וְは前節から続く列挙として、日本語では文脈上自然に省略した。
- source_word: לֶשֶׁם
  choice: ヒヤシンス石
  rationale: 正確な鉱物の同定は不確かだが、現代の読者にも比較的理解しやすい伝統的な近似訳を採り、不確実性を脚注に示した。
- source_word: שְׁבוֹ
  choice: めのう
  rationale: 古くから広く用いられる訳語であり、宝石名として分かりやすい。ただしオニキスの可能性もあるため脚注を付した。
- source_word: וְאַחְלָמָה
  choice: 紫水晶
  rationale: אַחְלָמָהの一般的かつ有力な同定であり、自然で明瞭な現代日本語の名称を用いた。
