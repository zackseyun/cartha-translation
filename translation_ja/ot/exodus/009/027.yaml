  terminology: 神名は方針どおり「ヤハウェ」と音写されている。「正しく／悪い」は צַדִּיק と רְשָׁעִים の道徳的・法的対照を過度に神学化せずに表す。脚注は「義」「罪ある者」などの有効な代替可能性を示している。
