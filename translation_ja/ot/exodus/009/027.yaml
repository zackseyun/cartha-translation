  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֗ה וַ/יִּקְרָא֙ לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֔ן וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם חָטָ֣אתִי הַ/פָּ֑עַם יְהוָה֙ הַ/צַּדִּ֔יק וַ/אֲנִ֥י וְ/עַמִּ֖/י הָ/רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: ja
  text: そこでファラオは人を遣わしてモーセとアロンを呼び寄せ、彼らに言った。「今度は私が罪を犯した。ヤハウェが正しく[a]、私と私の民が悪いのだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェは正しい方であり」または「ヤハウェは義であり」。
    reason: הַצַּדִּיק は、文脈上「正しい」のほか「義である」「正しい方である」とも訳せる。
  - marker: b
    text: 別訳「私と私の民は悪い者だ」または「罪ある者だ」。
    reason: הָרְשָׁעִים は、単に判断が誤っているというより、道徳的・法的な罪責を帯びた「悪い者／不正な者」を表し得る。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 人を遣わして
  rationale: 原文の「遣わした」を保ちつつ、日本語では目的語として使者を補うことで、続く「呼び寄せた」との動作の連続を自然に示す。
- source_word: וַיִּקְרָא לְ
  choice: 呼び寄せ
  rationale: 前置詞 לְ を伴うこの用法は、人を自分のもとへ召すことを表す。「呼び寄せる」は文脈に即した明瞭な現代日本語である。
- source_word: חָטָאתִי
  choice: 私が罪を犯した
  rationale: ファラオが自らの罪責を認める完了形を、簡潔で自然な日本語として表す。
- source_word: הַפָּעַם
  choice: 今度は
  rationale: 「この時／今回」を意味する慣用表現。これまでの災害時との対比を含み得る自然な表現として「今度は」を採る。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を一般的な日本語音写で示す。
- source_word: הַצַּדִּיק
  choice: 正しく
  rationale: 「正しい、義である」を意味する形容詞。直後の「悪い」との道徳的・法廷的な対照が日本語で明確になる。
- source_word: הָרְשָׁעִים
  choice: 悪いのだ
  rationale: 複数形の形容詞はファラオと民の道徳的罪責を示す。「悪い」は対句を明瞭にする一方、「間違っている」ほど意味を弱めない。別訳は脚注に示す。
- source_word: וַאֲנִי וְעַמִּי
  choice: 私と私の民
  rationale: 原文の語順を保ち、ファラオ自身が第一に罪責を負うとの告白を際立たせる。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文は四文字神名を直接用いているため、称号へ置換せず音写し、固有名としての性格を保つ。
- issue: ファラオの告白における正邪の対照
  choice: ヤハウェが正しく、私と私の民が悪い
  alternative: ヤハウェは義であり、私と私の民は悪者である
  rationale: 原文の道徳的・法廷的な対照を保ちながら、神の属性について本文以上の体系的含意を加えず、現代日本語で直接的に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で物語の進行を示し、「人を遣わして…呼び寄せ」で原文の二つの動詞を保った。発話は過度に古風な語尾を避けつつ、告白の厳粛さが伝わる形にした。
