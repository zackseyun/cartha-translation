  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: ja
  text: 「ヤハウェに祈ってくれ。神の雷鳴[a]と雹は、もう十分だ。そうすれば、私はおまえたちを行かせよう。おまえたちは、もうこれ以上とどまることはない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「神の声々と雹」。ここで「声々」は、嵐の雷鳴を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: 祈ってくれ
  rationale: עתרのヒフィル命令形複数は、ここでは切実に祈り求めることを表す。ファラオがモーセとアロンに依頼する自然な口調として「祈ってくれ」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で示した。
- source_word: וְרַב מִהְיֹת
  choice: もう十分だ
  rationale: 直訳的には「あることから多い」という充足・過剰を表す慣用句であり、災いの終息を願う文脈に即して簡潔に訳した。
- source_word: קֹלֹת אֱלֹהִים
  choice: 神の雷鳴
  rationale: קֹלֹתは字義的には「声々／音々」だが、雹を伴う嵐の文脈では雷鳴を指す。אֱלֹהִיםとの属格関係を保ち「神の雷鳴」とした。
- source_word: וּבָרָד
  choice: と雹
  rationale: בָּרָדの通常の意味をそのまま「雹」とした。
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: そうすれば、私はおまえたちを去らせる
  rationale: 出エジプト記でשלח＋民は解放して行かせる意味を持つ。条件的な流れを「そうすれば」で示し、目的地を本文以上に限定しない「去らせる」とした。
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: おまえたちは、これ以上ここにとどまることはない
  rationale: 「加えて立つことはない」という慣用表現を、現在地にこれ以上残らないという約束として自然な日本語にした。「ここに」は文脈上のエジプト滞在を明確にする補足である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある固有名を称号で代替せず、現代日本語で広く認識される音写を採用した。
- issue: קֹלֹת אֱלֹהִים の意味
  choice: 神の雷鳴
  alternative: 神の声々／神々しい雷鳴
  rationale: 字義上の「声／音」という含みは注に残しつつ、雹の災いという気象的文脈に従って本文では「雷鳴」とした。אֱלֹהִיםを強意と決めつけず、「神の」という構文を保持した。
translation_notes:
  register: ファラオからモーセとアロンへの発言として、切迫した依頼と支配者らしい口調がともに伝わるようにした。全体は明快な現代標準日本語とし、「雹」には一般的な漢字を用いた。
