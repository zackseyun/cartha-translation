base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: ja
  text: しかし、ヤハウェの言葉を心に留めなかった者は、自分の使用人たちと家畜を畑に残した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤハウェの言葉に心を向けなかった」。すなわち、その言葉を心に留めず、真剣に受け止めなかった。
    reason: ヘブライ語の慣用句 לֹא שָׂם לִבּוֹ אֶל の字義と文脈上の意味を示すため。
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: しかし、…者は
  rationale: 前節で警告に従った者たちとの対照を示す接続として「しかし」を用い、不定関係詞の意味を「…者は」で自然に表した。
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: 心に留めなかった
  rationale: 直訳的な「心を…に置かなかった」というヘブライ語の慣用句を踏まえ、警告を真剣に受け止めなかった意味を、現代日本語で自然かつ比喩をある程度保つ表現にした。
- source_word: דְּבַר יְהוָה
  choice: ヤハウェのことば
  rationale: דָּבָר の「ことば／告知」の幅を保ちつつ、ここでは神が告げた警告を指す定型的な表現として訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
- source_word: וַיַּעֲזֹב
  choice: 残した
  rationale: しもべと家畜を野にとどめ、雹にさらした具体的行為を自然に表す。「見捨てた」ほど強い含意は加えない。
- source_word: עֲבָדָיו
  choice: そのしもべたち
  rationale: עֶבֶד は奴隷または奉仕者を指し得るが、この文脈では身分を限定しすぎない伝統的かつ広い語「しもべ」を採った。
- source_word: מִקְנֵהוּ
  choice: 家畜
  rationale: 所有される群れの動物を広く指す集合名詞なので、現代日本語の包括的な語を用いた。
- source_word: בַּשָּׂדֶה
  choice: 野に
  rationale: 屋外の耕地・野原を表す簡潔で自然な聖書文体とし、雹への露出は文脈に委ねた。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有の神名を称号へ置換せず、一般的な学術的再構音に基づいて音写した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「ヤハウェのことば」「しもべ」「野」により簡潔で品位ある聖書文体を保った。原文の心に関する比喩は本文と脚注で保持した。
