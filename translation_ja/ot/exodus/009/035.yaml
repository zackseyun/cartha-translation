reference: Exodus 9:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: ja
  text: こうして、ファラオの心はかたくなになり[a]、ファラオはイスラエルの子ら[b]を去らせなかった。ヤハウェがモーセを通して[c]語ったとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心は強固になり」。ヘブライ語の動詞は「強くなる、固くなる」を意味し、ここでは頑なな態度を表す。
    reason: alternative_reading
  - marker: b
    text: 「イスラエルの子ら」はイスラエル人全体を指す。別訳「イスラエル人」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「モーセの手によって」。これは「モーセを通して」という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: かたくなになり
  rationale: חזקは基本的に「強くなる、強固になる」を表すが、ここではファラオの抵抗する意志が固くなることを指す。「かたくなになる」は現代日本語で自然にその文脈的意味を伝え、誰がそうさせたかを本文以上に特定しない。
- source_word: לֵב פַּרְעֹה
  choice: ファラオの心
  rationale: ヘブライ語の連語を自然な日本語の所有表現で訳し、意志や内的態度に焦点を置く原文の比喩を保った。
- source_word: שִׁלַּח
  choice: 去らせなかった
  rationale: この文脈では、イスラエルが出て行くのをファラオが許すことを意味する。「解放しなかった」よりも、出発を許可しないという反復される要求に即している。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの表現を保ちつつ、「子ら」によって集団を指す聖書的表現として簡潔に訳した。ここでは男性だけでなくイスラエルの民全体を指す。
- source_word: כַּאֲשֶׁר
  choice: とおりであった
  rationale: 出来事が先に語られたヤハウェの言葉と一致したことを明確に示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を日本語で一般的な形に音写した。
- source_word: בְּיַד מֹשֶׁה
  choice: モーセを通して
  rationale: 字義は「モーセの手によって」だが、使者・仲介者による伝達を表すヘブライ語の慣用句であるため、明瞭な現代日本語にした。
theological_decisions:
- issue: ファラオの心がかたくなる際の主体・原因
  choice: ファラオの心はかたくなになり
  alternative: ファラオは自分の心をかたくなにした／ファラオの心はかたくなにされた
  rationale: 原文の動詞はここで、心が強固になったことを述べるが、ファラオ自身または神を明示的な作用者として立ててはいない。そのため、神の直接的作用にもファラオの自己作用にも限定せず、物語にある神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「かたくな」は通常ひらがなで表し、古風すぎる「頑なとなった」は避けた。後半は「とおりであった」として、先行する神の言葉と出来事の対応を自然に示した。
