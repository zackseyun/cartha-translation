  to: だから今、急いで使いを出し、あなたの家畜と、野にあるあなたのすべてのものを安全な場所へ移しなさい。[a] 野にいて家の中に集め入れられないすべての人と家畜の上に雹が降り、彼らは死ぬ。
  rationale: 原文の「遣わす」と「安全な所へ逃れさせる」の並列した命令を保持しつつ、第一動詞の省略された目的語を文脈上自然な「使い」として補いました。その補いは脚注で明示しました。後半は、野に残され家へ集め入れられない者すべてが雹の対象となるという修飾関係を明確にし、現代標準日本語として自然な表現に整えました。
