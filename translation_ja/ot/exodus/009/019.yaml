source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: ja
  text: だから今、急いで使いを出し、あなたの家畜と、野にあるあなたのすべてのものを安全な場所へ移しなさい。[a] 野にいて家の中に集め入れられないすべての人と家畜の上に雹が降り、彼らは死ぬ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「急いで使いを出し」は、二つの命令を訳したもの。第一の動詞は「遣わす」で、誰を遣わすかは原文では明示されない。第二の動詞は、家畜などを危険から逃れさせ、安全な所へ移すよう命じている。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: だから今
  rationale: 接続辞と時を示す副詞を合わせ、直前の警告を受けた帰結と、直ちに行動すべき時点を自然な日本語で示す。
- source_word: שְׁלַח הָעֵז
  choice: 人を遣わして…安全な場所に避難させなさい
  rationale: שׁלחは文脈上、家畜などを移すために人を遣わすことを含意する。הָעֵזは「急げ」ではなく、ヒフィル命令形として「安全な所へ移す、避難させる」と理解し、その使役的な意味を訳文に明示した。
- source_word: מִקְנְךָ
  choice: あなたの家畜
  rationale: 所有され飼育されている動物を表す一般的で明瞭な現代日本語。
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: 野にあるあなたのすべてのもの
  rationale: 屋外にある所有物全般を指す広い表現を保った。
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: 人も家畜もみな
  rationale: אָדָםはここでは性別を限定しない総称的な「人」。בְּהֵמָהは文脈上、飼育動物を指すため「家畜」とした。両者を包括する分配的なכָּלは「みな」で表した。
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: 野にいて
  rationale: 日本語では「野に見いだされる」よりも自然であり、屋外に残っている状態を簡潔に示す。
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: 家の中に収容されない
  rationale: נאסףの受動的な「集め入れられる」という意味と、הביתהの方向性を保ちつつ、人と家畜の双方に使える表現とした。
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד וָמֵתוּ
  choice: その上に雹が降り、死ぬことになる
  rationale: 雹が上から彼らを襲う動きと、その確実な結果としての死を自然な日本語で表した。
theological_decisions:
- issue: אָדָםを総称としてどう訳すか
  choice: 人
  alternative: 男／人間
  rationale: この警告は野にいる人間一般を対象としており、語彙上も文脈上も男性に限定されない。「人」は原文の総称性を過不足なく保つ。
- issue: 警告される死の確実性
  choice: 死ぬことになる
  alternative: 死ぬだろう／死ななければならない
  rationale: 原文は雹が降ることによる結果を断定している。「ことになる」は結果の確実性を表しつつ、義務を示す「なければならない」や不確実に響く「だろう」を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ファラオへの厳粛で切迫した警告としての格調を保った。「野」は聖書文体に適度になじみつつ、「畑」より屋外の広がりを自然に示す。
