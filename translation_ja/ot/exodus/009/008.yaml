  source_fidelity: 主節の複数命令、モーセ個人への行為者の切替、炉のすす、上方への方向、ファラオが目撃する状況は、全体として原文に忠実です。ただし「まき上げよ」は、粉を散らしながら上がる動きを強く含み、זרקの基本義である「投げる」をやや限定しています。
  naturalness: 「モーセは……まき上げよ」は、主題提示の「は」と命令形の組合せが現代標準日本語ではやや不自然です。「モーセが……投げなさい」とすれば、聞き手はモーセとアロンのまま、行為者だけがモーセに指定される原文の構文を自然に表せます。
