revisions:
- from: そこでヤハウェはモーセとアロンに言われた。「あなたがたは、炉のすすを両手いっぱいずつ[a][b]取り、モーセはファラオの目の前で、それを空に向かって[c]まき上げよ。」
  to: そこでヤハウェはモーセとアロンに言われた。「あなたがたは、両手にいっぱいの炉のすすを[a][b]取り、モーセがファラオの目の前でそれを空に向かって[c]投げなさい。」
  rationale: モーセを単独の行為者とする原文の切替を保ちながら、現代日本語として自然な命令構文に改めました。また、動詞を「投げる」として原語の動作を過度に具体化せず、量表現と注記を原文の「両手のひらを満たす量」により近く整えました。
