  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: ja
  text: そこでヤハウェはモーセとアロンに言われた。「あなたがたは、両手にいっぱいの炉のすすを[a][b]取り、モーセがファラオの目の前でそれを空に向かって[c]投げなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの両手のひらを満たす量」。
    reason: lexical_alternative
  - marker: b
    text: 「すす」は「細かなすす」、より広く「灰」とも訳せるが、ここでのヘブライ語は特に炉から出るすすを指す。
    reason: lexical_alternative
  - marker: c
    text: 「天に向かって」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、一般的な日本語音写で表した。
- source_word: קְחוּ לָכֶם
  choice: あなたがたは……取り
  rationale: 複数命令であり、モーセとアロンの二人への指示であることを明示した。לָכֶםの再帰的・与格的な含みは、日本語では文脈上自然な命令に収めた。
- source_word: מְלֹא חָפְנֵיכֶם
  choice: 両手いっぱいずつ
  rationale: חֹפֶןは手のくぼみ、特に両手ですくえる量を指し、複数接尾辞は二人それぞれの量を示す。「ずつ」によってその配分を自然に表した。
- source_word: פִּיחַ
  choice: すす
  rationale: 一般的な灰よりも、炉から出る細かな黒い粉状の残留物を具体的に表す語である。
- source_word: כִּבְשָׁן
  choice: 炉
  rationale: かまど、窯、溶鉱炉などを指し得るため、用途を限定しすぎない簡潔な語を選んだ。
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: モーセは……それを……まき上げよ
  rationale: 最初の複数命令から、実行者をモーセ一人に切り替える原文を保持した。זרקの投げる・まき散らす動作を、粉状のすすを上方へ放つ場面に合う日本語で表した。
- source_word: הַשָּׁמַיְמָה
  choice: 空に向かって
  rationale: 方向を示す語尾を反映し、物理的に上方へ投げる動作として自然にした。「天」の可能性は注記した。
- source_word: לְעֵינֵי פַרְעֹה
  choice: ファラオの目の前で
  rationale: 直訳的な身体語の鮮明さと、ファラオが目撃するところで行うという意味を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく神の固有名を明記しているため、その区別を保つ音写を採用した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で威厳のある命令文とした。「言われた」で神の発話に丁寧さを持たせつつ、引用内は「まき上げよ」として直接的な命令の力を保った。
