  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: ja
  text: そこで彼らは、炉のすす[a]を取り、ファラオの前に立った。モーセがそれを空に向かって投げ上げると、水疱を伴う腫れ物が、人にも家畜にも[b]生じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「炉の灰」とも訳せるが、ヘブライ語は、炉や窯から出るすす、または細かな黒い粉をより具体的に指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「人に、また家畜に」。それぞれ単数形を集合的に用い、人間と家畜の双方を指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: すす
  rationale: 一般的な灰ではなく、かまどから出る細かな黒い粉を指す語なので、「すす」とした。
- source_word: הַכִּבְשָׁן
  choice: かまど
  rationale: 焼成や加熱に用いる炉を表す。現代日本語で具体的かつ分かりやすい「かまど」を採用した。
- source_word: לִפְנֵי פַרְעֹה
  choice: ファラオの前に
  rationale: ファラオの面前に立ったことを簡潔に表す。
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: モーセがそれを……投げ上げると
  rationale: 単数の目的語は集合的な物質名詞である「すす」を受ける。動作の方向を日本語で自然に示すため「投げ上げる」とした。
- source_word: הַשָּׁמָיְמָה
  choice: 空に向かって
  rationale: 方向を示す語尾を反映し、ここでは物理的な上方を指すため、神学的含意を加えない「空」を用いた。
- source_word: שְׁחִין
  choice: 腫れ物
  rationale: 炎症を起こした皮膚の腫れやできものを指す。疫病の文脈で自然な「腫れ物」とした。
- source_word: אֲבַעְבֻּעֹת
  choice: 水疱を伴う
  rationale: 腫れ物に生じる水疱または膿疱を表す名詞であり、その関係を明確にするため「水疱を伴う」とした。
- source_word: פֹּרֵחַ
  choice: 吹き出した
  rationale: 皮膚症状が盛んに現れ出るという分詞の動的な意味を、自然な日本語で表した。
- source_word: בָּאָדָם
  choice: 人にも
  rationale: 単数集合名詞として人間一般を指す。日本語では性別を限定せず自然な「人」とした。
- source_word: וּבַבְּהֵמָה
  choice: 家畜にも
  rationale: 人と対比される集合的な動物を指す。この災害物語の文脈では「家畜」が自然である。
theological_decisions:
- issue: אָדָםとבְּהֵמָהの集合的対比
  choice: 人にも家畜にも
  alternative: 人間にも動物にも
  rationale: ヘブライ語の単数形がそれぞれ集団全体を指すことを保ちつつ、現代日本語で自然に、人間と家畜の双方が被害を受けたことを示した。男性だけを指す表現にはしなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。冒頭の複数主語は直前の文脈にいるモーセとアロンを受けるため「二人」と明示した。病変は専門的になりすぎない範囲で「水疱を伴う腫れ物」とし、פֹּרֵחַの進行的・動的な像を「吹き出した」で保持した。
