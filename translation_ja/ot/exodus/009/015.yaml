id: EXO.9.15
reference: Exodus 9:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: ja
  text: というのも、今ごろには、わたしが手を伸ばして疫病であなたとあなたの民を打っていたなら、あなたは地上から絶たれていただろう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には、「というのも、今、わたしは手を伸ばして疫病であなたとあなたの民を打った。そして、あなたは地上から絶たれた」とも訳せる。ヘブライ語の動詞形は形式上は過去を表すが、文脈は反実仮想の意味を強く示している。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 実際
  rationale: 直前の発言を根拠づける説明の働きを持つ。日本語では「実際」が文脈上自然で、発言の強調も保てる。
- source_word: עַתָּה
  choice: 今ごろ
  rationale: 反実仮想の文脈で、すでに起こり得た時点を自然に表す。
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: わたしが手を伸ばし
  rationale: 神が裁きの力を行使するというヘブライ語の慣用表現を保つ。「送る」より自然である。反実仮想性は条件構文全体で示した。
- source_word: וָאַךְ
  choice: 打っていたなら
  rationale: נכה の裁き・災厄の文脈における強い作用を、現代日本語として格調を保って表す。
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: あなたとあなたの民
  rationale: 目的語を直接かつ明瞭に訳した。
- source_word: בַּדָּבֶר
  choice: 疫病で
  rationale: דֶּבֶר はここで致死的な疫病を指す。「災い」より具体的で、災厄全体を意味し得る「災害」とも区別できる。
- source_word: וַתִּכָּחֵד
  choice: あなたは……絶たれていただろう
  rationale: כחד のニファル形が表す消滅・根絶の厳しさを保ち、文脈上の反実仮想を「だろう」で表した。
- source_word: מִן־הָאָרֶץ
  choice: 地上から
  rationale: אֶרֶץ の広い意味を取り、エジプトの領土からの排除ではなく、地上からの根絶を表す。
theological_decisions:
- issue: 動詞連鎖の反実仮想的な意味
  choice: 「打っていたなら……絶たれていただろう」と反実仮想で訳す。
  alternative: 形式上の完了形に沿って「今、わたしは手を伸ばして……打った。そして、あなたは地上から絶たれた」と過去の事実として訳す。
  rationale: 直後の16節は、ファラオがなお生かされている理由を述べる。したがって15節は、実際には行われなかった裁きについて述べる反実仮想と理解するのが談話の流れに最も適合する。ただし形式上は過去形であるため、脚注に直訳的な可能性を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の裁きの厳粛さにふさわしい格調を保った。「今ごろ」と条件構文によって反実仮想を自然に示し、原文の形式的な曖昧さは脚注で明記した。
