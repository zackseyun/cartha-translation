source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: ja
  text: そのとき、ヤハウェはモーセに言われた。「手を空[a]に向かって伸ばしなさい。そうすれば、エジプト全土に雹が降り、エジプトの地で、人にも家畜にも、野のすべての草[c]にも降りかかる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天」とも訳せる。ヘブライ語は「空」と「天」の両方を意味し得るが、ここでは雹が降ってくる、目に見える空を指す。
    reason: lexical_alternative
  - marker: c
    text: 「草」は、草本や作物など、野に生える植物を広く指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で示した。
- source_word: נְטֵה אֶת יָדְךָ
  choice: 手を……伸ばしなさい
  rationale: 命令形と「手」の通常の意味を、自然で明瞭な日本語で保持した。
- source_word: עַל הַשָּׁמַיִם
  choice: 空に向かって
  rationale: 方向を表す עַל と、雹が生じる気象的文脈に即して訳した。「天」の可能性は脚注に残した。
- source_word: וִיהִי בָרָד
  choice: そうすれば……雹が降り
  rationale: 命令に続く希求・結果の関係を「そうすれば」で表し、日本語では雹について自然な「降る」を用いた。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: エジプト全土に
  rationale: בְּכָל の包括的な範囲を簡潔に表した。
- source_word: הָאָדָם
  choice: 人
  rationale: 定冠詞付き単数形の集合的・一般的意味を、家畜との対比が明瞭になる日本語で表した。
- source_word: הַבְּהֵמָה
  choice: 家畜
  rationale: 災害物語の文脈では、人に飼われる動物を指す語として「家畜」が最も自然で具体的である。
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: 野のすべての草
  rationale: עֵשֶׂב を木とは区別される草本・作物を含む野の植物として訳し、語順と包括性を保った。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地の
  rationale: 原文末尾で反復される地理的範囲を省略せず保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有名を称号で代用せず、原文にある契約の神の名を明示するため。母音の歴史的再構成には一定の不確かさがあるが、日本語で広く用いられる音写を採用した。
- issue: הָאָדָם の一般的意味
  choice: 人
  alternative: 人間、人類
  rationale: ここでは特定の男性ではなく、人を家畜と対比して集合的に指す。「人」は性別を限定せず、原文の簡潔さも保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい端正さを保った。「エジプト全土」と「エジプトの地」の反復は原文の範囲強調を尊重して残した。
