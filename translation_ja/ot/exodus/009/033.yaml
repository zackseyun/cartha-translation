language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: ja
  text: そこでモーセはファラオのもとを離れ、町の外へ出た。そしてヤハウェに向かって両手を広げた。すると、雷鳴[a]と雹はやみ、雨ももはや地上に降り注がなくなった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「声々」。ここでは嵐の雷鳴を指す。
    reason: lexical_alternative
  - marker: b
    text: または「雨は地面に降り注がなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: モーセはファラオのもとを離れ、町の外へ出た
  rationale: מֵעִםはファラオのいる所から離れることを表し、אֶת הָעִירは移動動詞に伴って町を出る経路・領域を示す。日本語では二段階の動きが明瞭になるように訳した。
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: 両手を広げた
  rationale: כַּפָּיוは直訳すれば「彼の手のひら」だが、祈りの姿勢を表す慣用表現として、身体的イメージを保ちつつ自然な日本語にした。
- source_word: אֶל יְהוָה
  choice: ヤハウェに向かって
  rationale: אֶלの方向性を示し、神名יהוהは固有名として「ヤハウェ」と表記した。
- source_word: הַקֹּלוֹת
  choice: 雷鳴
  rationale: 字義は「声々／音々」だが、この嵐の文脈では雷の音を指す。本文では自然な気象語を用い、字義を脚注に残した。
- source_word: וַיַּחְדְּלוּ הַקֹּלוֹת וְהַבָּרָד
  choice: 雷鳴と雹はやみ
  rationale: חדלは停止・終息を表す。「やむ」は雷鳴と雹の双方に自然に用いられ、嵐の終息を簡潔に示す。
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: 雨ももはや地上に降り注がなくなった
  rationale: נתךの受動形は雨が注がれることを表し、אָרְצָהには地面へ向かう方向性がある。文脈上は降雨の停止なので「もはや…なくなった」としたが、単純な否定としても読めるため脚注に示した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が契約の神名יהוהを明記しているため、称号に置き換えず、一般的な学術的再構音に基づく「ヤハウェ」とした。
- issue: 両手を広げる行為の意味
  choice: 動作のみを本文に記す
  alternative: 祈った、と意訳する
  rationale: 文脈上は祈りの動作だが、原文は祈りという語を明示せず身体動作を描くため、その含意を説明に置き換えなかった。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、物語文としての品位を保つ文体とした。「そこで」「すると」で出来事の連続と結果を自然に示した。
