base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: ja
  text: 亜麻と大麦は打ち倒された。大麦は穂が出ており[a]、亜麻はつぼみをつけていた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大麦は実りかけており」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「亜麻は花を咲かせていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: 亜麻
  rationale: 亜麻布の原料となる作物を指すため、現代日本語で直接的かつ簡潔な「亜麻」とした。
- source_word: הַשְּׂעֹרָה
  choice: 大麦
  rationale: 雹の被害を受けた穀物である大麦を明確に指す。
- source_word: נֻכָּתָה
  choice: 打ち倒された
  rationale: נכה の受動形として、雹に打たれて作物が倒されたことを表す。複合主語を受ける自然な日本語表現とした。
- source_word: כִּי
  choice: からである
  rationale: 後半が亜麻と大麦の被害の理由を示す構文であることを明瞭に表す。
- source_word: אָבִיב
  choice: 穂が出ており
  rationale: 穀物の穂が形成され、まだ若く熟しつつある生育段階を、具体的で分かりやすい日本語で表した。
- source_word: גִּבְעֹל
  choice: つぼみをつけていた
  rationale: 亜麻の進んだ生育段階を示す語だが、厳密には開花・蒴果形成などの解釈幅があるため、本文では過度に限定しない具体表現を採った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、農作物の生育段階を具体的に表現した。原文の因果関係を保ちつつ、אָבִיב と גִּבְעֹל の語義上の幅は脚注で示した。
