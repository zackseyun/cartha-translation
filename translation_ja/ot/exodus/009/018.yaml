id: EXO.9.18
reference: Exodus 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: ja
  text: 見よ、明日の今ごろ[a]、わたしは非常に激しい雹を降らせる。それは、エジプトが建国された日から[b]今に至るまで、一度もなかったほどのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「明日のこの時刻に」。
    reason: כָּעֵתは、おおよその同じ時刻とも、対応する時刻そのものとも理解できる。
  - marker: b
    text: 直訳「それが据えられた（確立された）日から」。
    reason: הִוָּסְדָהは受動形で、エジプトが築かれ、確立されたことを表す。「建国」は文脈に即した自然な訳。
lexical_decisions:
- source_word: הִנְנִי
  choice: 見よ
  rationale: 神による厳粛な告知を導く指示的な強調を保つ。現代日本語ではやや荘重だが、文脈上明瞭である。
- source_word: מַמְטִיר
  choice: わたしは…降らせる
  rationale: 使役形と一人称主語を反映し、雹が神の直接的な働きによって降ることを明示する。
- source_word: כָּעֵת מָחָר
  choice: 明日の今ごろ
  rationale: 前置詞כְּが持ち得る近似の含みを自然な日本語で表す。同時に「明日のこの時刻に」という厳密な時点の理解も脚注に残す。
- source_word: בָּרָד כָּבֵד מְאֹד
  choice: 非常に激しい雹
  rationale: כָּבֵדの基本義は「重い」だが、気象現象について日本語で「重い雹」は不自然なため、甚大さ・苛烈さを表す「激しい」を用いる。מְאֹדの強意は「非常に」で保持する。
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: 一度もなかったほどのものである
  rationale: これまで同類のものが存在しなかったという比較最上級的な意味を、自然で明瞭な日本語にする。
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: エジプトが建国された日から
  rationale: 女性単数の受動形の主語を文脈上エジプトと取り、その成立・確立を国家について自然な「建国された」で表す。
- source_word: וְעַד עָתָּה
  choice: 今に至るまで
  rationale: 起点から発話時点まで続く時間範囲を、荘重ながら現代語として自然に表す。
theological_decisions:
- issue: 災害における神の主体性
  choice: 「わたしは…雹を降らせる」とし、神の直接的な作用を明示する。
  alternative: 「雹が降る」のような非人称的表現。
  rationale: 一人称を主語とする使役形מַמְטִירが、来る雹を神の行為として明確に告知しているため、その主体性を弱めない。
- issue: 未曾有性の範囲
  choice: エジプトの建国時から現在までに限定して、前例のない雹とする。
  alternative: 世界史全体で絶対的に前例がないと一般化する。
  rationale: 原文は「エジプトで」「それが建てられた日から今まで」と範囲を明示しており、それを越えて一般化しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の宣告にふさわしい荘重さを「見よ」「今に至るまで」で保った。「雹」には一般的な読みを想定し、過度な古語や教派固有の表現は避けた。
