language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: ja
  text: モーセは杖を空に向けて伸ばした。すると、ヤハウェは雷鳴と雹を送り、火が地へと走った[a]。ヤハウェはエジプトの地に雹を降らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「火」は、文脈上、稲妻を指すと考えられる。原文は字義どおりには「火が地の方へ進んだ」。
    reason: 原文の「火」という表現を保ちつつ、嵐の文脈で想定される指示対象と直訳を示すため。
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸ばした
  rationale: נטהの「伸ばす、差し伸べる」という意味を、杖を空へ向ける動作として自然に表した。
- source_word: מַטֵּהוּ
  choice: 杖
  rationale: מַטֶּהの標準的な意味であり、出エジプト記におけるモーセの持ち物として明瞭である。
- source_word: עַל הַשָּׁמַיִם
  choice: 空に向けて
  rationale: 直訳的には「空の上に」だが、この動作では方向を示す表現として理解するのが自然である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: 雷鳴と雹を送り
  rationale: נתןは直訳では「与えた」だが、嵐を生じさせる文脈に即して「送る」とした。קֹלוֹתは嵐の文脈で雷の音を指すため「雷鳴」とした。
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: 火が地に向かって走った
  rationale: 「火」という原文の像と、地の方へ進む鮮明な動きを保った。文脈上は稲妻を指す可能性が高いが、本文では解釈語に置き換えていない。
- source_word: וַיַּמְטֵר
  choice: 降らせた
  rationale: מטרの使役形が表す「雨のように降らせる」を、雹を目的語として自然な日本語にした。
- source_word: אֶרֶץ מִצְרָיִם
  choice: エジプトの地
  rationale: 単に「エジプト」とせず、原文のאֶרֶץを保持して災害の地理的範囲を示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、称号の「主」に置き換えず音写した。
- issue: 嵐の中の אֵשׁ の解釈
  choice: 火
  alternative: 稲妻
  rationale: 文脈上は稲妻を指すと考えられるが、原語は明確に「火」であるため、その比喩的・現象描写的な緊張を本文に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、災害の描写にふさわしい簡潔で荘重な調子を保った。「雹」「雷鳴」は一般読者にも理解でき、原文の嵐の描写を正確に伝える語として採用した。
