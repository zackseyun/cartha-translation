source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: ja
  text: ヤハウェは時を定めて[a]、こう言われた。「明日、ヤハウェはこの地でこのことを行う。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「定められた時を設けて」「時を指定して」。
    reason: מוֹעֵד は単なる時点だけでなく、指定または確定された時を表し得るため。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 定めて
  rationale: שׂוּם はここで、時を設定することを表す。「定める」は מוֹעֵד との組み合わせに自然で、確定する意味も保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写する。
- source_word: מוֹעֵד
  choice: 時
  rationale: 定められた時・指定された時を意味する。動詞「定める」と後続の「明日」によって指定性が明確になるため、本文では簡潔に「時」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直接話法を導く定型表現。日本語では主語ヤハウェに合わせ、自然で敬意ある「言われた」とする。
- source_word: מָחָר
  choice: 明日
  rationale: 発話時点の翌日を直接示す副詞であり、簡潔に訳す。
- source_word: יַעֲשֶׂה
  choice: 行う
  rationale: עשה の広い意味を保ちつつ、この文脈で神が告げた出来事を実行することを自然に表す。
- source_word: הַדָּבָר הַזֶּה
  choice: このこと
  rationale: דָּבָר の「事・物・出来事」という幅を過度に限定せず、現代日本語として自然に表す。
- source_word: בָּאָרֶץ
  choice: この地で
  rationale: 冠詞付き אֶרֶץ は文脈上エジプトの地を指すが、原文どおり固有名を補わず、談話上特定された土地として訳す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある契約の神の固有名を称号へ置換せず、日本語で一般的な学術的音写によって示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「時を定めて言われた」はヘブライ語の構造を適度に残しつつ自然な叙述とした。神名は一貫して「ヤハウェ」と表記する。
