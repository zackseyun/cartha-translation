  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: ja
  text: それはエジプト全土に広がる細かなちりとなり、エジプト全土で、人にも獣にも、水ぶくれ[a]を生じて吹き出す腫れ物となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「水ぶくれ」と訳したヘブライ語は、膨れ上がった皮膚症状を指し、「水疱」または「膿疱」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: 細かなちりとなり
  rationale: היה はここでは状態の変化を表し、אָבָק は空中に散る細かな粉じんを指す。前節のすすが変化する流れを自然な日本語で示した。
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: エジプト全土を覆う
  rationale: עַל の空間的な広がりと、災いが国土全体に及ぶことを明瞭に表した。
- source_word: עַל הָאָדָם וְעַל הַבְּהֵמָה
  choice: 人にも獣にも
  rationale: אָדָם はここでは人類を集合的に指し、בְּהֵמָה と対置される。「人にも獣にも」は単数集合的な対比を簡潔に保つ。
- source_word: לִשְׁחִין
  choice: 腫れ物
  rationale: שְׁחִין は皮膚に生じる炎症性の患部を指す。「腫れ物」は一般読者に分かりやすく、後続する水ぶくれとの重複も避けられる。
- source_word: פֹּרֵחַ
  choice: 吹き出す
  rationale: 字義的には「芽を出す、花開く」だが、ここでは皮膚症状が発現するさまを表すため、自然な疾病表現とした。
- source_word: אֲבַעְבֻּעֹת
  choice: 水ぶくれ
  rationale: 腫れ物に伴う膨れた皮膚症状を、過度に専門的にならない現代日本語で表した。
theological_decisions:
- issue: אָדָם の集合的人間指示
  choice: 人
  alternative: 人類
  rationale: ここでは特定の男性ではなく、人間を獣と対比して集合的に指す。「人」は日本語でその包括的意味を自然に担える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二度の「エジプト全土」と、人と獣の対句を保持し、皮膚症状を表す三要素も省略せず訳した。
