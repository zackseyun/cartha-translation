  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: ja
  text: なぜなら、今度は、わたしのすべての災いを、あなたの心[a]と、あなたの家臣たちと、あなたの民に下す。これは、全地[b]にわたしのような者はいないことを、あなたが知るためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの心に」とも訳せる。この表現は、災いがファラオ本人、すなわち存在の核心に向けられることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「全地」は「全土」または「国中」とも訳せる。ヘブライ語には「地」と「土地・国」の両方の意味がある。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: それは（文脈上の理由説明）
  rationale: 直前の警告と神の行動の理由を結ぶ語。日本語では冒頭に機械的に「なぜなら」を置かず、後半の目的節を「それは」で受けることで論理関係を自然に示した。
- source_word: בַּפַּעַם הַזֹּאת
  choice: 今度は
  rationale: 現在の一連の行動を指す時の表現。「この時」より自然でありつつ、今回の局面という意味を保つ。
- source_word: שֹׁלֵחַ
  choice: 下す
  rationale: 直訳は「送る」だが、目的語が災いであるため、日本語では「災いを下す」が自然。分詞の切迫した行動性も文脈上保たれる。
- source_word: כָּל מַגֵּפֹתַי
  choice: わたしのすべての災い
  rationale: מַגֵּפָה の打撃・疫災・災厄という幅を、出エジプト記の文脈に即して「災い」とした。「すべて」を残し、表現の強さを弱めない。
- source_word: אֶל לִבְּךָ
  choice: あなたの心に
  rationale: 「心へ／心に」というヘブライ語の比喩を保持し、単に「あなたに」と平板化しない。日本語本文では後続語と並列させるため助詞を共有した。
- source_word: וּבַעֲבָדֶיךָ
  choice: あなたの家臣たちに
  rationale: ここではファラオに仕える官吏・臣下を指すため、「奴隷」ではなく「家臣」とした。
- source_word: וּבְעַמֶּךָ
  choice: あなたの民に
  rationale: ファラオの支配下にあるエジプトの民を指す。並列構造を明確に保った。
- source_word: בַּעֲבוּר תֵּדַע
  choice: あなたが知るためである
  rationale: בַּעֲבוּר の目的の意味と、それに続く未完了形を目的節として明確に表した。単純な未来として断定しない。
- source_word: אֵין כָּמֹנִי
  choice: わたしのような者はいない
  rationale: 比較不能性を表す定型的なヘブライ語を、簡潔で自然な日本語にした。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地に
  rationale: אֶרֶץ には「地」と「国／土地」の両義がある。ここでは神の比類なさを広く宣言する文脈により「全地」とし、地域的な可能性は脚注に残した。
theological_decisions:
- issue: 神の比類なさの範囲
  choice: 普遍的な範囲を示す「全地」
  alternative: 地域的な「この国全体／全土」
  rationale: 災害物語における主の比類なさの宣言はエジプトだけに限定されないと理解できる。ただし אֶרֶץ の語義上の曖昧さは脚注で明示した。
- issue: 「あなたの心に」の意味
  choice: 心という比喩を本文に保持する
  alternative: 「あなた自身に」「あなたを直撃する」と解釈的に言い換える
  rationale: 原文は明示的に「心」と述べ、ファラオの心をめぐる物語上の緊張とも響き合う。対象が内面または本人そのものを指す可能性を一つに決めず、脚注で説明した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の宣告としての簡潔さと威厳を保った。「心」と「全地」は原文の神学的な重みと語義上の幅を残し、必要な説明を脚注に置いた。
