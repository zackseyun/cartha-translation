base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: ja
  text: ファラオは遣わした[a]。すると、なんと、イスラエルの家畜は一頭も死んでいなかった。しかし、ファラオの心はかたくなになり[b]、民を出て行かせなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「遣わした」とだけあり、誰を遣わしたかは明記されていない。文脈上、家畜の状況を確かめるための派遣を指す。
    reason: implicit_object
  - marker: b
    text: 直訳「ファラオの心は重くなった」。ここでは、心が頑迷・強情になったことを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 人を遣わした
  rationale: 動詞は字義どおり「遣わした」。ヘブライ語では目的語が省略されているが、日本語として自然にするため「人を」を補った。文脈上、イスラエルの家畜の状況を確かめるための派遣である。
- source_word: וְהִנֵּה
  choice: すると、なんと
  rationale: 調査によって判明した意外な事実に注意を向ける談話標識の働きを、現代日本語で自然に表した。
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: イスラエルの家畜は一頭も死んでいなかった
  rationale: עַד אֶחָד は「一つに至るまでない」、すなわち「一頭も……ない」という強調。調査時点で判明した結果なので「死んでいなかった」とした。
- source_word: מִקְנֶה
  choice: 家畜
  rationale: 牛だけでなく、飼育される動物を広く指す語なので、包括的な「家畜」とした。
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: ファラオの心は重くなり
  rationale: 原文の「ファラオの心が重くなった」という比喩を保ち、頑迷になったという含意は脚注で示した。外部から心を固くされたという受動表現や、ファラオが自ら心を固くしたという使役表現を避け、原文が明示しない作用主体を補わない。
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: 民を去らせなかった
  rationale: この文脈の שׁלח は、民を解放して出発させることを意味する。「去らせなかった」は簡潔で自然にその意味を伝える。
theological_decisions:
- issue: ファラオの心が頑迷になったことの作用主体
  choice: ファラオの心は重くなり
  alternative: ファラオの心はかたくなになり／ファラオは自分の心をかたくなにし
  rationale: この節では「ファラオの心」が主語であり、誰かがその心を固くしたとは明記されていない。字義的な比喩を保つことで、神の働きとファラオ自身の責任をめぐる出エジプト記の緊張を、この節だけで一方に決着させない。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、物語の簡潔さと重みを保った。「なんと」で הִנֵּה の発見と驚きの効果を伝え、「心は重くなり」は原文の比喩と作用主体の曖昧さを維持した。
