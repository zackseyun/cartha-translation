  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: ja
  text: もしあなたが彼らを行かせることを拒み、なおも彼らを引き止めているなら、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なおも彼らを手放さずにいるなら」。
    reason: מַחֲזִיק בָּם は、彼らの出発を妨げて引き留めること、また彼らを手元に保持し続けることのいずれとしても表現できるため。
lexical_decisions:
- source_word: כִּי אִם
  choice: もし……なら
  rationale: 直前の宣告に続く条件節を導く。日本語では「もし」で条件関係を自然に表せるため、説明的な כִּי は独立には訳出しない。
- source_word: מָאֵן
  choice: 拒み
  rationale: 単なる不可能や消極的態度ではなく、意志的な拒絶を表す。
- source_word: לְשַׁלֵּחַ
  choice: 去らせること
  rationale: 民の出発をファラオが許すという文脈を、明瞭で自然な日本語にした。
- source_word: וְעוֹדְךָ
  choice: なおも
  rationale: ファラオの行為が継続していることを簡潔に示す。
- source_word: מַחֲזִיק בָּם
  choice: 彼らを引き止めている
  rationale: חזק の使役形分詞と בָּם がここで表す、民を手放さず拘束し続ける意味を自然に表現した。原語の継続的な含みは「ている」で保持した。
