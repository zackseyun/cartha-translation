  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: ja
  text: 主はモーセに言われた。「ファラオのもとに行き、彼にこう告げなさい。『ヘブライ人の神である主はこう言われる。わたしの民を去らせ、彼らがわたしに仕えるようにせよ。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ファラオのもとに行き
  rationale: 字義的には「ファラオのところへ入れ」だが、謁見に赴くことを表す自然な現代日本語とした。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を、日本語聖書で広く通用する尊称「主」で表した。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: わたしの民を去らせ
  rationale: 使役形の命令が示す、拘束を解いて立ち去ることを許せという意味を簡潔に表した。
- source_word: וְיַעַבְדֻנִי
  choice: わたしに仕えさせよ
  rationale: עבד は礼拝だけでなく奉仕・服従を含み得るため、意味の幅を保つ「仕える」を用い、接続された目的・結果のニュアンスを使役表現で示した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名であることを踏まえつつ、日本語の公的な聖書文体として理解されやすい慣用表記を採用した。
- issue: עבד の意味範囲
  choice: 仕える
  alternative: 礼拝する
  rationale: この語が持つ奉仕、服従、礼拝の重なりを「礼拝」に限定せず保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用内引用を句括弧で区別し、命令の力強さを保った。
