  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: ja
  text: モーセは彼に言った。「私が町を出たらすぐに、ヤハウェに向かって両手を広げます。すると、雷[a]はやみ、雹はもう降らなくなります。それは、あなたが『地はヤハウェのものだ』と知るためです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「声々」。ここでは嵐の中で響く雷鳴を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: 私が町を出たら
  rationale: כְּ＋不定詞構文が示す時を、自然な現代日本語の条件・時間表現で示した。文脈上、町を出た直後に祈ることを意味する。
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: 両手を広げます
  rationale: 祈願の際に手のひらを差し伸べる動作を表す。日本語では身体動作として自然な「両手を広げる」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 原文の神名を普通名詞の称号に置き換えず、固有名として音写した。
- source_word: הַקֹּלוֹת
  choice: 雷
  rationale: 字義的には「声々／音々」だが、雹を伴う嵐の文脈では雷鳴を指すため「雷」とした。字義は注に残した。
- source_word: יֶחְדָּלוּן
  choice: やみ
  rationale: חדלの「止む、終わる」という意味を、雷に自然に用いられる動詞で表した。
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: 雹ももう降らなくなります
  rationale: 直訳的な「雹はもはや存在しない」を、日本語の気象表現として自然にした。「もう」によって継続の終了を保持した。
- source_word: לְמַעַן תֵּדַע
  choice: あなたが……知るためです
  rationale: למעןの目的を明示し、神の行為の目的としてファラオが認識に至ることを表した。
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: 大地はヤハウェのものである
  rationale: לְを所有として訳し、הָאָרֶץはここではヤハウェの広範な主権を示す「大地」とした。ただし「土地／国土」の可能性は注に残した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、その区別を保って音写した。
- issue: הָאָרֶץ の範囲
  choice: 大地
  alternative: 土地、この国
  rationale: ファラオとの対決の中でヤハウェの主権を広く宣言する文脈に合う一方、ヘブライ語自体は地域的な「土地」も意味し得るため、その曖昧さを脚注で示した。
- issue: לְמַעַן תֵּדַע の目的表現
  choice: あなたが……知るためです
  alternative: そうすれば、あなたは……知るでしょう
  rationale: 結果だけでなく、災いをやませることの目的を示す原文の構文を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら威厳を保った。「雹」は常用的な表記として漢字を用い、祈りの身ぶりは説明を加えず簡潔に訳した。
