  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: ja
  text: 雹はエジプト全土で、野にいたすべてのものを、人から家畜に至るまで打った。雹は野の草をことごとく打ち、野の木をことごとく打ち砕いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: 打った
  rationale: נכהの反復を同じ語で表し、雹が人・家畜・植物を襲った強さを、現代日本語で自然かつ簡潔に伝える。
- source_word: הַבָּרָד
  choice: 雹
  rationale: 気象現象を直接表す標準的な訳語。原文での反復も保持した。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: エジプト全土で
  rationale: בְּכָלの領域全体に及ぶ意味を、自然な日本語で表した。
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: 野にいたすべてのものを
  rationale: 包括性を保ちつつ、後続の人と家畜を受けるため、存在を表す「いた」を用いた。שָׂדֶהは文脈上、戸外の農地を指す「野」とした。
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: 人から家畜に至るまで
  rationale: 人間から動物までの全範囲を示す両極表現を保持した。אָדָםは集合的な「人」、בְּהֵמָהは飼育動物を指す文脈に適した「家畜」とした。
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: 野の草木
  rationale: עֵשֶׂבは草、作物、低い植生を広く指し得る。「草木」は自然な包括表現だが、直後のעֵץ「木」と意味が一部重なるため、より直訳的には「野の草」とも訳せる。
- source_word: עֵץ הַשָּׂדֶה
  choice: 野の木
  rationale: עֵץを標準的な「木」とし、原文の「野」の反復も残した。
- source_word: שִׁבֵּר
  choice: 打ち砕いた
  rationale: שברのピエル形が表す激しい破壊を伝え、単なる「折った」より広い損壊を表した。
theological_decisions:
- issue: אָדָםの集合的用法
  choice: 人
  alternative: 人間／男
  rationale: ここでは性別を限定する個人ではなく、家畜と対をなす人類一般を指すため、「人」が最も自然で正確である。
- issue: מֵאָדָם וְעַד בְּהֵמָהの範囲表現
  choice: 人から家畜に至るまで
  alternative: 人も家畜も
  rationale: 原文の「〜から〜まで」という両極表現を保持し、被害が野にいた生き物全般に及んだことを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「雹」「野」「ことごとく」による反復と包括性を生かし、古風すぎる語法は避けた。
