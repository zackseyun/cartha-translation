id: EXO.9.34
reference: Exodus 9:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: ja
  text: しかしファラオは、雨と雹と雷[a]がやんだのを見ると、再び罪を犯し、彼もその家臣たちも心をかたくなにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「声々」。この嵐の文脈では雷鳴を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見ると
  rationale: ראהの基本義「見る」を保ちつつ、状況を認めたことを自然な日本語の時間節で表す。
- source_word: חָדַל
  choice: やんだ
  rationale: 雨・雹・雷という気象現象が止むことを表す、明瞭で自然な現代日本語。
- source_word: הַקֹּלֹת
  choice: 雷
  rationale: 字義は「声々／音々」だが、この嵐の文脈では雷鳴を指す。本文では自然な「雷」とし、字義を脚注に示す。
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: 再び罪を犯し
  rationale: יסף＋不定詞は反復または継続を表す。直前に示された態度の後で罪を重ねたという物語上の動きを明確に伝える。
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: 心をかたくなにした
  rationale: כבדの字義は「重くする」だが、ここでは応答を拒む頑迷さを表す定型的表現。「心をかたくなにする」は出エジプト記の主題的連関を保つ。
- source_word: הוּא וַעֲבָדָיו
  choice: 彼もその家臣たちも
  rationale: 王宮文脈のעבדיםはファラオに仕える者たちを指すため「家臣たち」とする。後置された主語句の強調を、日本語では「も……も」で表す。
- source_word: וַ
  choice: しかし
  rationale: 単なる物語の継続だけでなく、直前のファラオの悔いを示す言葉との対照を自然に示す。
theological_decisions:
- issue: 心をかたくなにした主体と範囲
  choice: ファラオ自身の行為として述べつつ、後置された「彼もその家臣たちも」を硬化の主体として自然に結び付ける。
  alternative: 「彼もその家臣たちも」を節全体への付加的強調とし、特に心をかたくなにした行為との結び付きを限定しない。
  rationale: ヘブライ語はまず単数形でファラオが「自分の心」をかたくなにしたと述べ、その後に「彼とその家臣たち」を加える。日本語では不自然さを避けながら共同関与を示すが、神的・人的主体性について本文以上の体系的結論は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「雹」には一般的な表記を用い、ファラオの王宮に属するעבדיםは「家臣たち」とした。
