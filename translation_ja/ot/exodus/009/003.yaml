source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: ja
  text: 見よ、ヤハウェの手が、野にいるあなたの家畜、すなわち馬、ろば、らくだ、牛、羊や山羊の群れの上に下る。それは非常に激しい疫病である[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「疫病」は、ここでは家畜を襲う致死的な伝染病を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 見よ
  rationale: 差し迫った宣告に注意を促す指示的な力を保ちつつ、聖書本文として自然で簡潔な現代日本語とした。
- source_word: יַד יְהוָה
  choice: ヤハウェの手
  rationale: 神の力と裁きを表すヘブライ語の比喩を平板化せず保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に明記された神名を固有名として音写した。
- source_word: הוֹיָה
  choice: 臨み
  rationale: 間近に迫る神の働きを表す文脈上の予告として訳した。日本語では後続の疫病の発生と一続きにすることで、原文の簡潔な述語構造を自然に表現した。
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: 野にいるあなたの家畜
  rationale: מִקְנֶהを牛だけに限定せず、後続の動物全体を含む「家畜」とした。「野にいる」という限定も保持した。
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: 馬、ろば、らくだ、牛、羊や山羊の群れ
  rationale: 各家畜の区分を現代日本語で明確に列挙した。צֹאןは羊だけでなく山羊を含み得る小家畜の集合語なので、「羊や山羊の群れ」とした。
- source_word: דֶּבֶר
  choice: 疫病
  rationale: この文脈では家畜を襲う致死的な流行病を指すため、現代日本語で明確な「疫病」を選んだ。
- source_word: כָּבֵד מְאֹד
  choice: 非常に激しい
  rationale: 字義的な「非常に重い」ではなく、疫病の深刻さを自然に表す日本語とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを読者に示し、一般名詞・称号である「主」へ置き換えなかった。
- issue: 「ヤハウェの手」という表現
  choice: 比喩を保持する
  alternative: ヤハウェが罰を下す
  rationale: 原文は神の力と裁きを「手」によって表しているため、その神学的に重みのある比喩を説明的な表現に解消しなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「見よ」「ヤハウェの手」「臨む」によって宣告の緊迫感と尊厳を保った。動物名は日常的な表記とし、原文の集合語צֹאןの範囲を「羊や山羊の群れ」で明示した。
