- from: あなたはなおも、わたしの民に対して高ぶり、彼らを去らせまいとするのか。[a]
  to: あなたはなおも、わたしの民に対して高ぶり、彼らを行かせようとしないのか。[a]
  rationale: 「去らせまいとする」を、原文の使役動詞と解放の文脈を直接表す「行かせようとしない」に改めた。それ以外は、原文の継続、神の民という所有表現、自己高揚の非難、および文脈上の修辞疑問を保っている。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:21Z'
review_pass:
  verdict: revise
  source_fidelity: 「なおも」「わたしの民」「高ぶる」は、עוֹד、בְּעַמִּי、מִסְתּוֹלֵלの継続的で尊大な自己高揚をよく伝えている。修辞疑問として読むことも文脈上十分に可能である。ただし「去らせまいとする」は、彼ら自身が去ることを阻止しようとする、という含みと「試みる」の含みを帯び、לְבִלְתִּי שַׁלְּחָם（彼らを行かせない／解放しないこと）の表現としてやや間接的である。
  naturalness: 「彼らを行かせようとしない」は現代標準日本語として自然であり、ファラオが民を解放・出発させることを拒むという出エジプト記の定型的文脈を明瞭に表す。
  terminology: 「わたしの民」は神の直接の所有・関係の表現を保持している。「高ぶる」も、ここでの自己を高くするという傲慢な態度を適切に表す。
  issues:
  - severity: medium
    issue: 「彼らを去らせまいとする」
    rationale: 原文のPiel שַׁלְּחָםは、民を『行かせる』『解放する』という使役的行為である。「去らせまいとする」は不自然さに加え、阻止の試みという余分な語感を生じうるため、「彼らを行かせようとしない」とするのがより正確で明快である。
  revised_text: あなたはなおも、わたしの民に対して高ぶり、彼らを行かせようとしないのか。[a]
