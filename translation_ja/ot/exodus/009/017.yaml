  revision_rationale: 「去らせまいとする」を、原文の使役動詞と解放の文脈を直接表す「行かせようとしない」に改めた。それ以外は、原文の継続、神の民という所有表現、自己高揚の非難、および文脈上の修辞疑問を保っている。
