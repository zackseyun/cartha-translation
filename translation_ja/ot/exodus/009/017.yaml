  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: ja
  text: あなたはなおも、わたしの民に対して高ぶり、彼らを行かせようとしないのか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの民の上に自分を高くして」、または「わたしの民に対して尊大に振る舞い」とも訳せる。
    reason: מִסְתּוֹלֵלと前置詞בの組み合わせには、自己を高くすること、尊大に振る舞うこと、民の上に立とうとすることという重なり合う含みがあるため。
lexical_decisions:
- source_word: עוֹדְךָ
  choice: あなたはなおも
  rationale: עוֹדの継続の意味と二人称男性単数への直接的な呼びかけを保った。文脈上の修辞疑問として、文末の「のか」と組み合わせた。
- source_word: מִסְתּוֹלֵל
  choice: 高ぶり
  rationale: סללのHitpolel分詞が表す、自己を高くすること、傲慢に振る舞うことという再帰的・尊大な含みを、自然な現代日本語で伝える。
- source_word: בְּעַמִּי
  choice: わたしの民に対して
  rationale: 前置詞בをここでは敵対ないし優越の対象を示すものと捉えた。「わたしの民」という一人称所有表現はそのまま保持した。
- source_word: לְבִלְתִּי
  choice: 去らせまいとする
  rationale: 否定の不定詞句が、ファラオの高ぶりの具体的な現れないし意図を示すことを自然な日本語で表した。
- source_word: שַׁלְּחָם
  choice: 彼らを去らせる
  rationale: 出エジプト記の災害物語で繰り返されるשלחのPiel形を、イスラエルを拘束から解放して行かせるという文脈的意味で訳した。
theological_decisions:
- issue: 「わたしの民」という神の所有表現
  choice: 「わたしの民」を保持する
  alternative: 「民」または「イスラエル」
  rationale: 一人称接尾辞は、イスラエルに対する主の直接的な権利と、ファラオの行為が主への対抗でもあることを示すため、省略も一般化もしない。
- issue: 疑問文としての表現
  choice: 修辞疑問「のか」とする
  alternative: 「あなたはなおも……している」という断定文
  rationale: ヘブライ語本文には明示的な疑問詞がないため断定形も文法上可能だが、直後の警告を含む文脈と古くからの句読理解に沿い、問いただす修辞疑問として訳した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神がファラオを直接問いただす場面にふさわしい威厳を保った。「高ぶる」は一般読者にも通じ、原語の自己高揚と傲慢さを簡潔に伝える。
