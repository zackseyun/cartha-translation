  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: ja
  text: そこでヤハウェはモーセに言った。「朝早く起きてファラオの前に立ち、彼にこう言いなさい。『ヘブライ人の神、ヤハウェはこう言われる。わたしに仕えるために、わたしの民を行かせよ[a]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしを礼拝するために」とも訳せる。ヘブライ語の動詞は、礼拝を含め、神に仕えることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: 朝早く起きて
  rationale: שׁכם のヒフィル命令形が表す「早く起きる」という慣用的意味と、בַּבֹּקֶר の時を自然な日本語で一体として表した。
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: 前に立ち
  rationale: 自ら所定の位置に立つという意味を保ちつつ、ファラオへの出頭を簡潔で自然な日本語にした。
- source_word: כֹּה אָמַר
  choice: こう言われる
  rationale: 神から託された宣言を導く使者定型句として、現代日本語で明瞭かつ威厳のある表現を用いた。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ヘブライ人の神
  rationale: 構成関係を直接かつ自然に訳した。
- source_word: שַׁלַּח אֶת עַמִּי
  choice: わたしの民を行かせよ
  rationale: この文脈での解放要求を表す命令として、明瞭で定着した日本語表現を選んだ。
- source_word: וְיַעַבְדֻנִי
  choice: わたしに仕えるために
  rationale: 接続詞付き未完了形の目的の含みを明示し、עבד の礼拝を含む広い奉仕の意味を保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、称号への置換を避け、神名を音写した。
- issue: וְיַעַבְדֻנִי における עבד の意味
  choice: わたしに仕えるために
  alternative: わたしを礼拝するために
  rationale: この語は神への礼拝を含むが、それだけに限定されない奉仕を表し得るため、本文では広い意味を保持した。目的を表す文脈上の関係も日本語で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣言にふさわしい簡潔さと威厳を保った。「ファラオ」は称号として定着した表記を採用した。
