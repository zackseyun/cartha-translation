id: EXO.9.6
reference: Exodus 9:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: ja
  text: 翌日、ヤハウェはこのことを行われた。エジプトの家畜はすべて死んだが、イスラエルの子ら[a]の家畜は一頭も死ななかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。ヘブライ語では「イスラエルの子ら」。
    reason: 民族呼称の字義的表現と自然な日本語の代案を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וַיַּעַשׂ ... אֶת הַדָּבָר הַזֶּה
  choice: このことを行われた
  rationale: עשהとדברから成る具体的な表現を保ちつつ、現代日本語として自然にした。神を主語とするため敬語を用いた。
- source_word: מִמָּחֳרָת
  choice: 翌日
  rationale: 直前に告げられた時点から見た次の日を表す、簡潔で自然な訳語。
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: エジプトの家畜はすべて
  rationale: מִקְנֶהは牛だけでなく群れとして飼育される家畜を広く指すため、「家畜」とした。כֹּלの全面性も明示した。
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל לֹא מֵת אֶחָד
  choice: イスラエルの子らの家畜は一頭も死ななかった
  rationale: ヘブライ語の部分を示すמןは、日本語では主題化と「一頭も」の組み合わせで自然に表した。אֶחָדの強調を「一頭も」で保持した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な民族呼称を本文に残し、より自然な「イスラエル人」は脚注で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有名を明記しているため、称号への置換を避け、神名を音写した。
- issue: בְנֵי יִשְׂרָאֵל の集団的意味
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の形を見える形で保ちながら、この表現が男性だけでなく民全体を指し得ることを脚注で明らかにした。
- issue: エジプトの家畜が「すべて」死んだという表現
  choice: すべて死んだ
  alternative: ことごとく死んだ
  rationale: כֹּלを弱めずに訳し、後続箇所との関係を解釈によって先回りして限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。簡潔な物語文とし、神を主語とする動詞には自然な敬語を用いた。原文の「すべて」と「一頭も」の対照を明確に保持した。
