revisions:
- from: ファラオの家臣たちのうち、ヤハウェの言葉を恐れた者は、自分の僕たちと家畜を家々へ逃れさせた。[a]
  to: ファラオに仕える者たちのうち、ヤハウェの言葉を恐れた者は、自分の使用人たちと家畜を家々に逃げ込ませた。[a]
  rationale: 原文の部分的な主語、神名、「恐れる」、使役動詞、および複数の「家」を保った。「逃げ込ませた」は、使役の移動を自然な現代日本語で表す。脚注から原文に明示されない「危険から」という補足を除き、語義上の情報に限定した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:29Z'
review_pass:
  verdict: revise
  source_fidelity: ヘブライ語は「ファラオの僕・臣下たちのうち、ヤハウェの言葉を恐れた者」が、自分の従者と家畜を建物の中へ逃がしたことを述べる。現行訳は全体としてこれをよく反映するが、「避難させた」という注釈の説明は安全確保という文脈上の結果を明示しており、語そのものの「逃げさせた／逃がした」より一歩解釈的である。
  naturalness: 「僕たち」は現代標準日本語としてやや文語的であり、また「逃れさせた」より「逃げ込ませた」のほうが、人と家畜を建物内へ移動させる使役表現として自然である。
  terminology: 「ヤハウェ」は原文の神名を適切に反映する。「ファラオに仕える者たち」と「使用人たち」により、ファラオに属する者とその者自身に属する労働者・従者の区別を、現代語で不必要に身分関係を限定せず表せる。
  issues:
