    rationale: עֲבָדָיוは当該のファラオの臣下・仕える者が所有・管理する従者を指す。明瞭な現代語として「使用人たち」が適切である。
  - severity: low
    issue: 脚注が「危険から避難させた」と説明している。
    rationale: 文脈からはもっともだが、הֵנִיסの語義は「逃げさせた／逃がした」であり、「危険から」は本文に明示されない解釈である。
  revised_text: ファラオに仕える者たちのうち、ヤハウェの言葉を恐れた者は、自分の使用人たちと家畜を家々に逃げ込ませた。[a]
