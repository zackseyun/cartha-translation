  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: ja
  text: ファラオに仕える者たちのうち、ヤハウェの言葉を恐れた者は、自分の使用人たちと家畜を家々に逃げ込ませた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「逃げさせた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: 恐れた者
  rationale: 定冠詞を伴う分詞の名詞的用法を反映し、ファラオの家臣たちの中の該当者を自然な日本語で表す。
- source_word: דְּבַר יְהוָה
  choice: ヤハウェの言葉
  rationale: דָּבָר の基本的な意味と聖書的表現を保ち、「警告」と限定的に解釈することを避ける。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: ファラオの家臣たちのうち
  rationale: מִן の部分を示す用法を明確にし、ファラオに仕える者たちの中の一部であることを表す。
- source_word: הֵנִיס
  choice: 逃れさせた
  rationale: נוּס のヒフィル形「逃げさせる、避難させる」を比較的形式的に保ち、単なる「急がせた」より原語の移動と危険回避の含意を伝える。
- source_word: עֲבָדָיו
  choice: 自分の僕たち
  rationale: 所有者を明確にしつつ、עֶבֶד の使用人・僕という広い意味を保つ。
- source_word: מִקְנֵהוּ
  choice: 家畜
  rationale: 特定の動物種に限定されない所有家畜の総称として自然で正確。
- source_word: אֶל הַבָּתִּים
  choice: 家々へ
  rationale: 複数形を保ちながら、避難先となる建物への方向・移動を自然な日本語で示す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号に置き換えずに示す。発音の完全な確定には限界があるが、現代の標準的な学術的音写を採用する。
- issue: 「ヤハウェの言葉を恐れる」の意味
  choice: 恐れた
  alternative: 警告を重大に受け止めた
  rationale: 原文の「恐れる」をそのまま保ち、畏敬、恐怖、警告への信頼といった含意を一つに限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「家臣」はファラオに仕える者、「僕」はその家臣に属する働き手を区別するために用いた。「家々」で原文の複数形を保持した。
