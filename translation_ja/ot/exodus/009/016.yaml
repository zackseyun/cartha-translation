  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: ja
  text: しかし、わたしがあなたを立たせ続けているのは、このためである。わたしの力をあなたに示し、わたしの名が全地に告げ知らされるためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたを立たせた」または「あなたを起こした」とも訳せる。ヘブライ語は、ファラオを立たせる、または立ったままにしておくことを意味しうる。この文脈では、直ちに滅ぼさず存続させたという意味が有力である。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: しかし
  rationale: 直前の「地から断ち滅ぼされていた」との強い対照を、自然な現代日本語で示す。
- source_word: בַּעֲבוּר זֹאת
  choice: このためである
  rationale: 後続する二つの目的節を導く表現として、単なる原因ではなく目的を明確にする。
- source_word: הֶעֱמַדְתִּיךָ
  choice: あなたを立たせておいた
  rationale: עמדのヒフィル形が持つ「立たせる、存続させる」という像を保ちつつ、文脈上、ファラオを直ちに滅ぼさず生き長らえさせた意味を伝える。
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: わたしの力をあなたに示し
  rationale: 接尾代名詞を目的語として明示し、神の力がファラオ本人に示されるという原文の目的構文を自然に表す。
- source_word: כֹּחִי
  choice: わたしの力
  rationale: 災いを通して示される神の強さ・威力を表す標準的で広い訳語。
- source_word: וּלְמַעַן
  choice: …ためである
  rationale: 第一の目的と並ぶ第二の目的を示す。日本語では「すなわち」の後に二つの述語を並列させ、一つの結びで受ける。
- source_word: סַפֵּר
  choice: 告げ知らされる
  rationale: ピエル形の「語り伝える、宣べ知らせる」という公的な伝達の含意を表し、原文で行為者が明示されない点も保つ。
- source_word: שְׁמִי
  choice: わたしの名
  rationale: 神の名がその名声と啓示された自己同一性を含むという聖書的表現を、そのまま保持する。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地に
  rationale: כָּלを伴うהָאָרֶץの広い範囲を簡潔に表し、特定の地方だけに限定しない。
theological_decisions:
- issue: הֶעֱמַדְתִּיךָがファラオについて意味すること
  choice: 神がファラオを直ちに滅ぼさず、立たせておいたこと
  alternative: 神がこの目的のためにファラオを王として起こしたこと、または災いの間ずっと生かしておいたこと
  rationale: 直前の節では神がファラオをすでに地から断ち滅ぼすこともできたと述べられており、ここではその反対に、なお存続させたことが中心と考えられる。ただし「立たせる」という原文の像を残し、より広い神の主権の含意を訳文で限定しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣言にふさわしい端正さを保った。「立たせておいた」はやや直訳的だが、原文の比喩と解釈上の幅を保持するために採用した。脚注記号は該当する節末に置いた。
