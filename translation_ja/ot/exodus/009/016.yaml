- from: しかし、わたしがあなたを立たせておいたのは、このためである。すなわち、わたしの力をあなたに示し、わたしの名が全地に告げ知らされるためである。[a]
  to: しかし、わたしがあなたを立たせ続けているのは、このためである。わたしの力をあなたに示し、わたしの名が全地に告げ知らされるためである。[a]
  rationale: 本文を「立たせ続けている」として、原文の「立たせる」という表現を残しながら、直前の文脈が示す保全・存続の意味を自然な現代日本語で表した。「すなわち」を削除して、二つの目的を明瞭に連結した。脚注は「起こした」だけに偏らず、原文の基本的な像と伝統的な代替訳を示し、文脈に基づく理解を限定的に説明した。
