  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: ja
  text: ただ、イスラエルの子ら[a]がいたゴシェンの地にだけは、雹が降らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語は字義的には「イスラエルの息子たち」。
    reason: 原文の系譜的・男性複数形の表現と、自然な集合的理解の両方を示すため。
lexical_decisions:
- source_word: רַק
  choice: ただ……だけは
  rationale: 文頭の限定・除外を、日本語として自然な呼応表現で明確にした。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地に
  rationale: בְּ と אֶרֶץ の場所表現を保ち、地名 גֹּשֶׁן は慣用的に音写した。
- source_word: אֲשֶׁר שָׁם
  choice: ……がいた
  rationale: 場所を示す関係表現を、日本語では修飾節として自然に表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な親族・子孫表現を残しつつ、現代日本語で集団を表す簡潔で格調ある言い方とした。
- source_word: לֹא הָיָה בָּרָד
  choice: 雹が降らなかった
  rationale: 字義的には「雹がなかった」だが、気象現象としての不在を明瞭で自然な日本語にした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの息子たち
  rationale: 原文の系譜的表現を保持し、単なる民族名への平板化を避けた。一方、「息子たち」は日本語では個々の男性に限定して聞こえやすいため、「子ら」とした。
translation_notes:
  register: 明瞭な現代標準日本語。文頭の限定を「ただ……だけは」で再現し、災厄の記事にふさわしい簡潔で落ち着いた文体とした。
