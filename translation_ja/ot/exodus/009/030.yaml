  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: ja
  text: しかし、あなたとあなたの臣下たちについては、まだ神であるヤハウェを恐れていないことを、私は知っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「今なお、神であるヤハウェを恐れていない」。ヘブライ語のこの表現は、文脈上「まだ…ない」とも、「神であるヤハウェを恐れる前だ」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה וַעֲבָדֶיךָ
  choice: しかし、あなたとあなたの家臣たちについては
  rationale: 独立代名詞と接続詞が示す対比・主題化を「しかし…については」で表した。עֲבָדֶיךָ はファラオの宮廷に仕える者たちを指す文脈なので、現代日本語では「家臣たち」が自然である。
- source_word: יָדַעְתִּי כִּי
  choice: …ことを、私は知っています
  rationale: 完了形はここでモーセの現在の確信・認識を表し、כִּי はその認識内容を導く。
- source_word: טֶרֶם
  choice: まだ…いない
  rationale: 後続する未完了形とともに「まだ～していない」と理解した。ただし「～する前に」という時間的先行の意味も可能なため、脚注に残した。
- source_word: תִּירְאוּן מִפְּנֵי
  choice: …を恐れていない
  rationale: ירא が持つ恐怖と畏敬の幅を「恐れる」で保った。מִפְּנֵי はこの構文では日本語に独立して訳すより、目的語を「を」で示すのが自然である。
- source_word: יְהוָה אֱלֹהִים
  choice: 神ヤハウェ
  rationale: 固有名 יְהוָה と同格的な אֱלֹהִים を、日本語として明瞭な「神ヤハウェ」とした。神名を称号に置き換えず音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号で置き換えず、「ヤハウェ」と音写して保持した。
- issue: 神に対する ירא の意味の幅
  choice: 恐れる
  alternative: 畏れる、畏敬する、怖がる
  rationale: 裁きへの恐怖と神への畏敬のどちらか一方に限定せず、原語の神学的な緊張を保つため「恐れる」とした。
- issue: טֶרֶם の時間的ニュアンス
  choice: まだ…いない
  alternative: 神ヤハウェを恐れる前である
  rationale: 文脈上は未だ畏れに至っていないとの意味が自然だが、「前に」という語義上の可能性を脚注で明示した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位のある語調。ファラオへの発言なので「知っています」と丁寧体を用いた。原文の対比、神名、ならびに「恐れる」が含む恐怖と畏敬の両義性を保持した。
