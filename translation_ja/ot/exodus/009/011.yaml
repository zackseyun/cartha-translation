  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: ja
  text: 呪術師たちは、腫れ物のためにモーセの前に立つことができなかった。腫れ物が呪術師たちにも、エジプト全土の人々にも生じていた[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「呪術師たちに、また全エジプトに」。ここでは、直前の「呪術師たちに」との並列および文脈に従い、腫れ物がエジプト全土の人々に生じていたことを表した。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: 呪術師たち
  rationale: 出エジプト記では、ファラオに仕えてモーセとアロンに対抗し、そのしるしをまねる祭儀的・秘術的専門家を指す。「呪術師」は現代日本語でその役割を明確に伝え、「魔術師」よりも娯楽的な連想を避けられる。
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: モーセの前に立つ
  rationale: 原文の慣用句を保ちつつ、日本語でもその面前に出て立つという意味が自然に通じる。単に身体的に立てなかったのか、面前に出られなかったのかという含みを限定しすぎない。
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: 腫れ物のために
  rationale: מִפְּנֵי はここでは原因を示す。שְׁחִין は炎症を伴う皮膚の腫れ物を指し、集合的な単数なので、日本語では「腫れ物」として災厄全体と個々の症状の双方を表す。
- source_word: בַּחֲרְטֻמִּם
  choice: 呪術師たちにも
  rationale: 身体に腫れ物が生じたことを表す文脈であり、日本語では並列を明確にするため「にも」とした。
- source_word: וּבְכָל מִצְרָיִם
  choice: エジプト全土にも広がっていた
  rationale: 字義的には「全エジプトに／で」。直前の人を表す語との並列だけで「全エジプト人」と限定せず、地理的な表現を保ちながら、腫れ物が国中に及んだという自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「立つ」は原文の表現と意味の幅を保持し、「エジプト全土」はヘブライ語の地理的表現を残した。脚注標識[a]は本文中に明示した。
