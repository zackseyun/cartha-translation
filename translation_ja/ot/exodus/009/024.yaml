base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: ja
  text: 非常に激しい雹が降り、そのただ中で火がひらめいていた[a]。エジプトが国となって以来、エジプト全土で、このようなことは一度もなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その雹のただ中で火が飛び交っていた」。ヘブライ語は文字どおり「火」といい、嵐の中でひらめく稲妻のような現象を描いていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: 雹が降り
  rationale: 存在・発生を告げる物語表現を、日本語で気象現象として自然に表した。
- source_word: וְאֵשׁ
  choice: 火
  rationale: 嵐の中の稲妻を指す可能性は高いが、原文の語は文字どおり「火」であるため、その鮮烈な表象を本文に残した。
- source_word: מִתְלַקַּחַת
  choice: ひらめいていた
  rationale: 雹の中を火が動き、明滅する継続的な様子を、現代日本語で自然かつ鮮明に表現した。
- source_word: בְּתוֹךְ הַבָּרָד
  choice: その雹のただ中で
  rationale: 火が雹の内部・ただ中にあるという原文の印象的な位置関係を保持した。
- source_word: כָּבֵד מְאֹד
  choice: 非常に激しく
  rationale: 字義は「非常に重い」だが、ここでは嵐の甚だしさを表すため、気象について自然な「激しい」とした。
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: このようなことは一度もなかった
  rationale: 前例のない規模であったという比較・最上級的意味を明瞭に伝えた。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: エジプト全土で
  rationale: 領域全体を指す表現を簡潔で自然な現代日本語にした。
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: エジプトが国となって以来
  rationale: 女性形の主語を文脈上エジプトと明示し、לְגוֹי の国家成立という歴史的基準点を保持した。
