base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: ja
  text: しかし、小麦とスペルト小麦[a]は打たれなかった。まだ十分に育っていなかったからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「スペルト小麦」に当たるヘブライ語は、エンマー小麦など近縁の麦を指す可能性もある。
    reason: cultural_note
  - marker: b
    text: 別訳「生育が遅れていたからである」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: しかし、小麦
  rationale: חִטָּהは「小麦」。接続詞וְは形式上「そして」だが、前節で被害を受けた作物との対比を明確にするため、自然な日本語の「しかし」とした。
- source_word: וְהַכֻּסֶּמֶת
  choice: とスペルト小麦[a]
  rationale: כֻּסֶּמֶתは古代の麦類を指し、スペルト小麦または近縁のエンマー小麦と考えられる。本文では比較的通用する「スペルト小麦」を採用し、同定の不確かさを脚注に示した。
- source_word: לֹא נֻכּוּ
  choice: は打たれなかった
  rationale: נכהの受動形で、雹に打たれなかったことを表す。「被害を受けなかった」より原文の打撃の比喩と災害・裁きの響きを保つ。
- source_word: כִּי
  choice: からである
  rationale: 前半の理由を導く用法。現代日本語で因果関係が明瞭になる表現を選んだ。
- source_word: אֲפִילֹת הֵנָּה
  choice: まだ生育が遅れていた
  rationale: 女性複数の述語で、小麦と麦類がまだ発育の遅い段階にあり、雹害を免れたことを表すと解した。「晩生だった」「まだ穂が出ていなかった」も可能だが、原語が熟期か発育段階かを厳密には限定しないため、自然で幅を残す表現とした。
