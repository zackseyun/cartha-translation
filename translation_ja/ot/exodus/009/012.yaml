source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: ja
  text: しかし、ヤハウェはファラオの心をかたくなにした[a]。ファラオは彼らに耳を傾けなかった。ヤハウェがモーセに語ったとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオの心を固くした」または「ファラオの心を強くした」。ヘブライ語の動詞は、より字義的には「強くする、固くする」を意味するが、ここではファラオが頑強に抵抗することを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 心をかたくなにした
  rationale: חזקの基本義は「強くする、堅くする」だが、「心」を目的語とする出エジプト記の反復表現では、抵抗する意志を固くすることを表す。現代日本語で文脈上の意味が明確な「心をかたくなにした」を本文に採用し、字義に近い選択肢は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として一般的な日本語音写で表した。
- source_word: לֵב פַּרְעֹה
  choice: ファラオの心
  rationale: 連語を自然な所有表現で訳した。「心」は意志や性向の中心を指すが、本文では説明的な言い換えを加えなかった。
- source_word: שָׁמַע אֲלֵהֶם
  choice: 彼らに耳を傾けなかった
  rationale: שׁמע＋אֶלの「聞く、耳を傾ける」という関係的意味を自然な日本語で表した。「従わなかった」では服従の意味を限定しすぎるため避けた。
- source_word: אֲלֵהֶם
  choice: 彼らに
  rationale: 文脈上はモーセとアロンを指すが、原文どおり代名詞に相当する表現を保った。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: ヤハウェがモーセに語っていたとおりである
  rationale: כַּאֲשֶׁרの一致・成就の意味を「とおり」で示し、物語時点に先立つ神の発言を「語っていた」で自然に表した。
theological_decisions:
- issue: ファラオの心がかたくなにされたことにおける神の主体性
  choice: ヤハウェはファラオの心をかたくなにした
  alternative: ヤハウェはファラオの心を強くした／固くした
  rationale: ヘブライ語はヤハウェを動詞の主語、ファラオの心を目的語として明示している。その直接的な主体性を、許可や放任を表す言い換えで弱めなかった。一方、חזקの字義的な幅は脚注に示し、本文だけで語義上の緊張を隠さないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神名は「ヤハウェ」と音写した。「耳を傾けなかった」により、古風すぎる「聞き入れなかった」や意味を限定する「従わなかった」を避けた。日本語で指示対象を明確にするため、二文目の主語は代名詞ではなく「ファラオ」とした。
