  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: ja
  text: しかし、ヤハウェはイスラエルの家畜とエジプトの家畜とを区別する。イスラエルの子らの家畜は、一頭も死なない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְלָה
  choice: 区別する
  rationale: ヒフィル形が表す、二つの集団を明確に分けて扱う意味を、自然で簡潔な日本語で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: בֵּין ... וּבֵין
  choice: …と…とを
  rationale: 二者の対比を表す相関的な前置詞句を、日本語の自然な対比構文で表す。
- source_word: מִקְנֵה
  choice: 家畜
  rationale: 牛だけでなく飼育される動物全般を指し得るため、広い意味を保つ。
- source_word: מִצְרַיִם
  choice: エジプト
  rationale: 原文どおり国名を用い、「エジプトの家畜」とする。
- source_word: וְלֹא יָמוּת
  choice: 死なない
  rationale: 接続詞を目的・結果に限定せず、原文の並列的な断言を保つ。
- source_word: מִכָּל ... דָּבָר
  choice: 一頭も
  rationale: 直訳的な「一つのものも」ではなく、文脈上の家畜を受けて、日本語で個体を数える自然な表現にする。全く死なないという強調も保つ。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに属する
  rationale: לְ の所有・帰属関係と、בְּנֵי יִשְׂרָאֵל の家族的・民族的表現をともに保持する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有名を用いているため、称号で代替せず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 慣用的な民族名称としての意味を認めつつ、原文の家族的表現を本文に残した。
- issue: וְ の論理関係
  choice: 独立した第二文として並列
  alternative: そのため、…死なない
  rationale: 結果の含意は文脈上あり得るが、接続詞自体は単純な連結でも読めるため、因果関係を本文で明示しすぎない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神名と「イスラエルの子ら」という原文の重要な表現を保持した。「一頭も」によって、家畜について述べていることを自然に明確化した。節末の閉じかぎ括弧は、引用文脈に属する発話の一部であることを示す。
