  naturalness: 全体として明瞭な現代標準日本語である。「そのため」は原文の単純な物語接続をやや強い因果・目的関係にするため、「そこで」とするほうが節の進行に即す。また、主語を「エジプト人」と明示すれば、「彼ら」の指示が文単位でも明確になる。
  terminology: 「イスラエルの民」は בְּנֵי יִשְׂרָאֵל の民族共同体としての指示を自然に伝える。「苦しめる」も ענה（ピエル）の文脈上の意味に適切である。
