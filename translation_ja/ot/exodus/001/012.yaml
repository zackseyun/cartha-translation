revisions:
- from: しかし、彼らがイスラエルの民を苦しめれば苦しめるほど、民はますます増え、ますます広がっていった。そのため、エジプト人はイスラエルの民を恐れ、忌み嫌った[a]。
  to: しかし、エジプト人がイスラエルの民を苦しめれば苦しめるほど、民はますます増え、ますます広がっていった。そこでエジプト人は、イスラエルの民を恐れた[a]。
  rationale: 本文では文脈に最もよく合う「恐れた」を採用し、語義上可能な「忌み嫌った」は脚注に保持した。これにより、論争のある語義を消去せず、二つの意味を同時に断定することも避けた。接続表現を「そこで」とし、原文の物語的な進行をより直接に反映した。
