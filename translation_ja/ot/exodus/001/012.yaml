source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: ja
  text: しかし、エジプト人がイスラエルの民を苦しめれば苦しめるほど、民はますます増え、ますます広がっていった。そこでエジプト人は、イスラエルの民を恐れた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恐れた」と訳したヘブライ語は、「忌み嫌った」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: 苦しめれば苦しめるほど、ますます……ますます……
  rationale: 比例相関を表す構文を、現代日本語で自然な「～すればするほど、ますます」で再現した。文脈上の逆接は冒頭の「しかし」で示した。
- source_word: יְעַנּוּ
  choice: 苦しめる
  rationale: ピエル形の「虐げる、苦しめる」という意味を表す。強制労働を含む文脈だが、手段を本文で限定しすぎない語を選んだ。
- source_word: אֹתוֹ / יִרְבֶּה / יִפְרֹץ
  choice: イスラエルの民／民は増え、広がっていった
  rationale: 原文はイスラエルを一つの集合体として単数で受ける。日本語では指示対象を明示し、集合的な「民」で自然に表現した。
- source_word: יִרְבֶּה
  choice: 増え
  rationale: 人口が多くなるという רבה の基本的な意味を簡潔に示した。
- source_word: יִפְרֹץ
  choice: 広がっていった
  rationale: פרץ の、境を越えて勢いよく拡大する含みを、人口と居住範囲の双方に通じる自然な表現で示した。
- source_word: וַיָּקֻצוּ
  choice: 恐れ、忌み嫌った
  rationale: קוץ は強い嫌悪にも恐怖・不安にも解し得る。どちらか一方に狭めず、文脈に適合する二つの側面を併記した。
- source_word: מִפְּנֵי
  choice: イスラエルの民を
  rationale: קוץ と結びつき、その存在を恐れ、嫌悪したことを日本語の目的語構文で自然に表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民
  rationale: 民族集団を指す定型表現であり、日本語では男女を含む共同体として明瞭で自然。「イスラエルの息子たち」という逐語訳が招く誤解を避けた。
theological_decisions:
- issue: קוץ が表す反応の幅
  choice: 恐れ、忌み嫌った
  alternative: 恐れた／忌み嫌った
  rationale: 語が恐怖・不安と嫌悪の両方を帯び得るため、本文で意味の緊張を保持し、一方だけに決めなかった。
- issue: בְּנֵי יִשְׂרָאֵל の共同体的意味
  choice: イスラエルの民
  alternative: イスラエルの子ら／イスラエル人
  rationale: ヤコブ（イスラエル）の子孫から成る民族共同体を指す。現代日本語で性別を不必要に限定せず、原文の共同体的指示を伝える。
- issue: וַיָּקֻצוּ の主語
  choice: エジプト人
  alternative: 彼ら
  rationale: 直前の文脈で行為者はエジプト人である。原文では動詞の三人称複数に含まれる主語を、日本語で誤解なく読めるよう明示した。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で品位ある物語文とし、比例構文の勢いを保った。「イスラエルの民」を反復して指示対象を明確にし、語義上の重要な曖昧さは脚注でも示した。
