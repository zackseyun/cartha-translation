  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: ja
  text: 「さあ、彼ら[a]に対して抜け目なく事を運ぼう[b]。そうしなければ、彼らは増え、もし戦争が起これば、彼らもわれわれの敵に加わって、われわれと戦い、この地から出て行くかもしれない[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「彼に対して」。単数形は、集合体としてのイスラエルを指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らに対して賢く振る舞おう」。原語は賢明に行動することも巧妙に立ち回ることも表し得るが、ここでは打算的な含みが強い。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語では字義的に「その地から上って行く」。文脈上は「この地を去る」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: さあ
  rationale: 直ちに共同の行動を促す間投詞として、現代日本語で自然かつ簡潔な「さあ」を用いた。
- source_word: נִתְחַכְּמָה
  choice: 抜け目なく事を運ぼう
  rationale: חכם のヒトパエル形は、ここでは道徳的な知恵というより、脅威と見なした相手への巧妙で打算的な政策を表す。「抜け目なく」によって文脈上の不穏な含みを保った。
- source_word: לוֹ
  choice: 彼らに対して
  rationale: 形態上は男性単数だが、集合体としてのイスラエルを指す。日本語では文脈に即して複数の「彼ら」とした。
- source_word: פֶּן
  choice: そうしなければ
  rationale: 避けようとしている結果を導く語であり、日本語の因果関係が明瞭になるよう「そうしなければ」とした。
- source_word: יִרְבֶּה
  choice: 彼らは増え
  rationale: 動詞は集合体に対応する単数形だが、日本語では民を複数として自然に表した。文脈に続く人口増加の主題も保持している。
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: 戦争が起これば
  rationale: 戦争の発生を想定する条件節として、簡潔で自然な現代日本語にした。
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: 彼らもわれわれの敵に加わって
  rationale: יסף と על の組み合わせを、ある陣営に身を加える意味として訳した。גם הוא の「彼らも」により、集合的な指示対象と追加の含意を示した。
- source_word: וְנִלְחַם בָּנוּ
  choice: われわれと戦い
  rationale: בְּ が示す敵対関係を、日本語で自然な「われわれと戦う」によって表した。
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: この地から出て行くだろう
  rationale: עלה の上昇方向を逐語的に出すより、מן הארץ と合わせた文脈上の移動を明瞭にした。ただし原文の「上る」という像は脚注に残した。
theological_decisions:
- issue: וְעָלָה מִן הָאָרֶץ の意味と方向性
  choice: この地から出て行くだろう
  alternative: この地から上って行くだろう
  rationale: 原文は字義的には「その地から上る」であり、脱出・離脱を指す可能性が高いが、表現自体には方向的な像が残る。本文では自然な意味を示し、脚注で字義を明記して曖昧さを隠さないようにした。
translation_notes:
  register: ファラオの政策的な呼びかけとして、簡潔で命令的な調子を保ちつつ、古風すぎない標準的な現代日本語とした。「われわれ」は公的な発言にふさわしい格調を保つために用いた。
