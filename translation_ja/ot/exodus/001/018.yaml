  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: ja
  text: そこで、エジプトの王は助産婦たちを呼び、彼女たちに言った。「なぜこのようなことをして、子どもたちを生かしておいたのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜこのようなことをして、男の子たちを生かしておいたのか」。ヘブライ語の動詞は、生かす、生存させる、あるいは殺さずに生かしておくことを表し得る。直前の文脈では男の子たちが念頭にある。
    reason: 語義と文脈上の指示対象に関する別訳
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼びつけて
  rationale: קרא＋לは人を呼び出す、召喚する意。王が助産婦たちを自分の前に呼び出した文脈を、自然な日本語で表した。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: エジプトの王
  rationale: 属格関係を明確かつ自然に保つ標準的な訳。
- source_word: לַמְיַלְּדֹת
  choice: 助産婦たち
  rationale: 出産を助ける女性を指す分詞形であり、現代日本語で意味が明確な語を用いた。
- source_word: וַיֹּאמֶר לָהֶן
  choice: 言った
  rationale: 女性複数の相手を示す代名詞は直前の「助産婦たち」で明白なため、日本語では不自然な重複を避けた。
- source_word: מַדּוּעַ
  choice: なぜ
  rationale: 理由を問う疑問語を簡潔で自然に訳した。
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: このようなことをして
  rationale: 直訳的な「このことを行って」より自然でありながら、王が彼女たちの行為を問いただす意味を保つ。
- source_word: וַתְּחַיֶּיןָ
  choice: 生かしておいた
  rationale: חיהのこの形は、生きさせる、生存させる、殺さずにおくという幅を持つ。「生かしておいた」は文脈に適しつつ使役・存続の含意を保つ。
- source_word: הַיְלָדִים
  choice: あの子どもたち
  rationale: 語そのものは「子どもたち」を意味し、直前の文脈では男児を指す。「あの」により既知の対象であることを自然に示し、本文では語の広さを保った。
