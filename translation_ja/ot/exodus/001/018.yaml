  naturalness: 「そこで、エジプトの王は助産婦たちを呼び、彼女たちに言った」は明瞭で自然な現代標準日本語であり、引用内の詰問調にも合う。「なぜ、このようなことをして」は意味を保つが、読点を除いた「なぜこのようなことをして」のほうが自然である。
  terminology: 「エジプトの王」「助産婦たち」「生かしておいた」は適切である。「子どもたち」はיְלָדִיםの語義上の広さを保ち、直前の文脈で対象が男児である点は注記で扱う。神学用語上の問題はない。
