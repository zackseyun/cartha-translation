  text: וַ/יְהִ֕י כִּֽי יָֽרְא֥וּ הַֽ/מְיַלְּדֹ֖ת אֶת הָ/אֱלֹהִ֑ים וַ/יַּ֥עַשׂ לָ/הֶ֖ם בָּתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: ja
  text: 助産婦たちが神を恐れたので、神は彼女たちに家庭を与えられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女たちのために家々を造られた」。ここで「家々」は、建物ではなく、家庭や家系を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: 〜ので
  rationale: この構文は後続する結果の理由を導く。日本語では「〜ので」とすることで、ヘブライ語の因果関係を自然かつ明確に表せる。
- source_word: יָרְאוּ
  choice: 恐れていた
  rationale: 神に対する畏れと敬意の双方を含み得る語であり、聖書的な表現と神学的な重みを保つため「恐れる」とした。
- source_word: הַמְיַלְּדֹת
  choice: 助産婦たち
  rationale: 前の文脈ですでに登場している女性たちを指す定冠詞付きの分詞であり、現代日本語で明瞭に表した。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞を伴うが、ここでは文脈上イスラエルの神を指すため、日本語では自然に「神」と訳す。
- source_word: וַיַּעַשׂ
  choice: 興された
  rationale: 基本義は「造る、なす」だが、目的語「家」が家系・家庭を意味する場合には、その成立を表す「興す」が自然である。主語が神であることを明示した。
- source_word: לָהֶם
  choice: 彼女たちに
  rationale: 接尾代名詞は男性複数形だが、文脈上は助産婦たちを受ける。日本語では女性を指すことを明確にした。
- source_word: בָּתִּים
  choice: 家
  rationale: 物理的建物だけでなく、家庭・家系・一族を指し得るヘブライ語の比喩を保つため「家」とした。意味の幅は脚注で示す。
theological_decisions:
- issue: 「彼女たちに家を興された」の意味
  choice: 神が助産婦たちに家庭または家系を与え、確立されたという意味を本文で示唆する。
  alternative: 神が彼女たちのために物理的な家屋を造られた。
  rationale: עשׂה ... בתים は家族・家系を確立する意味になり得て、文脈では助産婦たちへの神の祝福として読むのが自然である。ただし「家」という語が持つ原文の曖昧さを本文と脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「家を興す」によって原文の「家」という比喩を残しつつ、家庭・家系の確立という有力な意味を自然に伝えた。主語の曖昧さを避けるため、後半では「神」を補った。
