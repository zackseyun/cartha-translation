source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: ja
  text: そして彼は言った。「ヘブライ人の女たちの出産を助け、産み台[a]の上で見るとき、もし男の子なら、その子を殺しなさい。しかし、女の子なら、生かしておきなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「二つの石の上で」。出産に用いる台や腰掛けを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: 出産を助け
  rationale: ピエル形で助産行為を表す。現代日本語で自然かつ直接的に、産婦の出産を介助する意味を示した。
- source_word: הָעִבְרִיּוֹת
  choice: ヘブライ人の女たち
  rationale: 女性複数形の名詞的用法をそのまま明示した。
- source_word: וּרְאִיתֶן
  choice: 見るとき
  rationale: 単純な「見る」を保ちつつ、前の時間節に自然につないだ。何を見るかは原文にも明示されず曖昧なので補わなかった。
- source_word: עַל הָאָבְנָיִם
  choice: 産み台
  rationale: 字義的には「二つの石」だが、出産の文脈で用いる設備を指す可能性が高い。本文では理解しやすい慣用的訳を採り、字義を脚注に残した。
- source_word: אִם בֵּן הוּא
  choice: もし男の子なら
  rationale: 新生児の性別を述べる日本語として自然であり、בןの意味を明確に伝える。
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: その子を殺しなさい
  rationale: מותのヒフィル命令形の直接的な殺害命令を明瞭に表した。「死なせなさい」より意図性が明確で、現代日本語として自然。
- source_word: וְאִם בַּת הִיא
  choice: しかし、女の子なら
  rationale: בןとの対照を自然な「男の子／女の子」で示し、接続詞は文脈上の対比を表す「しかし」とした。
- source_word: וָחָיָה
  choice: 生かしておきなさい
  rationale: 完了形にワウが付いた命令的文脈で、女児を殺さず生存させる指示を自然に表した。「生きるだろう」として命令性を弱めないようにした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、ファラオの命令の厳しさを婉曲化せずに表現した。「産み台」は一般読者に意味が通じる簡潔な語として採用し、原語の特殊な表現は脚注で保持した。
