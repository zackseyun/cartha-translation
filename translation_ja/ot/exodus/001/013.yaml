source:
  edition: WLC
  text: וַ/יַּעֲבִ֧דוּ מִצְרַ֛יִם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/פָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: ja
  text: エジプト人は、イスラエルの子ら[a]を過酷に働かせた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち「イスラエル人」。直訳では「イスラエルの息子たち」で、ここではイスラエルの民全体を指す。
    reason: lexical_alternative
  - marker: b
    text: または「容赦なく」「苛烈に」。ヘブライ語は、強制労働における押しつぶすような厳しさを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: 働かせた
  rationale: עבדのヒフィル形が表す使役の意味「仕えさせる／働かせる」を自然な現代日本語で示す。「奴隷にした」は文脈には合うが、この動詞単独よりも意味を限定するため避けた。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: 地名「エジプト」とも取り得る形だが、ここでは複数の行為者を指す主語として「エジプト人」が自然である。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 直訳的な家族的・共同体的表現を保ち、ヤコブ（イスラエル）の子孫から成る民という響きを伝える。単に未成年者を指すのではないことは脚注で明示する。
- source_word: בְּפָרֶךְ
  choice: 過酷に
  rationale: 強制労働における苛烈で打ち砕くような厳しさを表す語を、簡潔で自然な現代日本語にした。前置詞בが示す行為の仕方も副詞として保っている。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵלという契約共同体の呼称
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 民族名だけに平板化せず、イスラエルを祖とする子孫・共同体という原文の系譜的な響きを保つ。「子ら」が未成年者だけを意味しないことは脚注で補う。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「働かせた」によって使役を自然に表し、「過酷に」で強制労働の苛烈さを簡潔に示した。読点は長い主語と目的語の関係を読み取りやすくするために置いた。
