  naturalness: 「ヤコブとともにエジプトへ来たイスラエルの息子たちの名は、次のとおりである」は、人名一覧を導入する明瞭で格調を保った現代標準日本語である。第二文も不自然な逐語訳にならず、原文の反復を保持している。
  terminology: 人名・地名の表記は標準的である。「家族」はこの文脈のבַּיִת（世帯・一家）を一般読者に明瞭に伝える妥当な表現であり、教派的な含意もない。脚注は文頭の接続詞の談話上の働きを適切に説明している。
