reference: Exodus 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל הַ/בָּאִ֖ים מִצְרָ֑יְמָ/ה אֵ֣ת יַעֲקֹ֔ב אִ֥ישׁ וּ/בֵית֖/וֹ בָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: ja
  text: ヤコブとともにエジプトへ来たイスラエルの息子たちの名は、次のとおりである[a]。彼らはそれぞれ、自分の家族を伴って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「そして、これらは……名である」。ヘブライ語は接続詞で始まり、出エジプト記の物語を創世記の物語に結びつけている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 名は、次のとおりである
  rationale: 指示語 אֵלֶּה の提示機能を、一覧を導入する自然な現代日本語で表した。冒頭の接続詞 וְ は創世記から物語が続くことを示すが、本文で機械的に「そして」とすると不自然になりやすいため、脚注で明示した。
- source_word: שְׁמוֹת
  choice: 名
  rationale: 基本義をそのまま表し、本書のヘブライ語名にもつながる語を保持した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たち
  rationale: ここではヤコブの男子たちを指し、後続の人名一覧とも合うため、「子孫」や「イスラエル人」ではなく具体的に訳した。
- source_word: הַבָּאִים
  choice: 来た
  rationale: 形態上は分詞だが、過去にエジプトへ移住した者たちを限定する働きがあるため、自然な連体節とした。
- source_word: מִצְרָיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾を、日本語の方向助詞「へ」で表した。
- source_word: אֵת יַעֲקֹב
  choice: ヤコブとともに
  rationale: אֵת はここでは目的語標識ではなく同伴を示すため、その関係を明確に訳した。
- source_word: אִישׁ וּבֵיתוֹ
  choice: それぞれ、自分の家族を伴って
  rationale: אִישׁ の配分的な意味を「それぞれ」で示し、בַּיִת は建物ではなく一家・家族を指すため「家族」とした。
- source_word: בָּאוּ
  choice: 来た
  rationale: 節末の定動詞を第二文に残し、先行する分詞との反復を保持した。日本語では「伴って来た」とすることで自然さも確保した。
theological_decisions: []
