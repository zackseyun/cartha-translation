base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: ja
  text: そこでファラオは民すべてに命じた。「生まれた男の子[b]はみな、ナイル川[a]に投げ込め。しかし[c]、女の子はみな生かしておけ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「川」。出エジプト記では、通常ナイル川を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「息子」。ここでは、生まれた男子一般を指す。
    reason: lexical_alternative
  - marker: c
    text: 「しかし」に当たる語は、直訳すると「そして」。ここでは、男子と女子に対する命令の対照を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じた
  rationale: 王が民に強制力のある命令を下す文脈に合い、צוהの意味を明確かつ自然に表す。
- source_word: לְכָל עַמּוֹ
  choice: 自分の民すべてに
  rationale: עַםを基本義どおり「民」とし、接尾辞によるファラオとの関係とכָּלの全体性を保った。「臣民」と限定的に解釈することは避けた。
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: 生まれた男の子はみな
  rationale: בֵּןは字義的には「息子」だが、ここでは生まれる男子一般を指すため、現代日本語で自然な「男の子」とした。分詞הַיִּלּוֹדの受動的意味は「生まれた」で保持した。
- source_word: הַיְאֹרָה
  choice: ナイル川に
  rationale: יְאֹרは字義上「川」だが、出エジプト記のエジプトという文脈ではナイル川を指す。方向を示す語尾־ָהは助詞「に」で表した。
- source_word: תַּשְׁלִיכֻהוּ
  choice: 投げ込め
  rationale: שלךの使役形による強い命令を簡潔な命令形で表した。目的語接尾辞「彼を」は、主題「男の子はみな」によって日本語では明示されるため重ねなかった。
- source_word: וְכָל הַבַּת
  choice: しかし、女の子はみな
  rationale: וְの基本義は「そして」だが、男子への命令との明白な対照を自然な日本語の「しかし」で示した。בַּתはこの文脈で女子一般を指すため「女の子」とした。
- source_word: תְּחַיּוּן
  choice: 生かしておけ
  rationale: חיהのピエル形が表す「生かしておく、命を保たせる」という意味と、継続を伴う命令の力を自然な日本語で示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。王の布告の厳しさを命令形「投げ込め」「生かしておけ」で表しつつ、古風すぎる語法は避けた。接続の対照性は本文で自然に示し、字義的な形は脚注に残した。
