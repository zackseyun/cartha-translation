id: EXO.1.17
reference: Exodus 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: ja
  text: しかし、助産婦たちは神を畏れ、エジプトの王が彼女たちに命じたとおりにはせず、子どもたちを生かしておいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子どもたちを生きたままにしておいた」とも訳せる。
    reason: וַתְּחַיֶּיןָ は、単に生きることを許すだけでなく、命を保たせるという意味にも取れるため。
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: 畏れ
  rationale: ירא は神に対する恐れと崇敬の両面を含む。「畏れる」は、聖書に特徴的な表現を保ちつつ、単なる恐怖にも単なる尊敬にも限定しない。
- source_word: הַמְיַלְּדֹת
  choice: 助産婦たち
  rationale: ילד の分詞が女性の職務名として用いられている。現代日本語で明確かつ自然な対応語。
- source_word: אֶת־הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞を伴うが、ここでは物語中のまことの神を指すため、日本語では自然に「神」とした。
- source_word: וְלֹא עָשׂוּ
  choice: とおりにはせず
  rationale: 否定された עשׂה を、後続する比較節と一体にして自然な日本語で表した。
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: 彼女たちに命じたとおり
  rationale: דבר は字義的には「語った」だが、直前の王命を受ける文脈なので「命じた」が発話の機能を明確に伝える。
- source_word: מֶלֶךְ מִצְרָיִם
  choice: エジプトの王
  rationale: 連語の意味を明瞭で標準的な日本語にした。
- source_word: וַתְּחַיֶּיןָ
  choice: 生かしておいた
  rationale: חיה のピエル形が持つ、命を保たせる・生きたままにしておくという使役的意味を自然に表す。殺せとの命令との対照も明確になる。
- source_word: הַיְלָדִים
  choice: 子どもたち
  rationale: 語そのものは「男の子」に限定されないため「子どもたち」とした。対象が男児であることは直前の文脈から分かる。
theological_decisions:
- issue: 「神を畏れる」における אֱלֹהִים の訳
  choice: 神
  alternative: その神
  rationale: ヘブライ語には定冠詞があるが、日本語で「その神」とすると不自然で、複数の神々の中の一神という含みを生じかねない。物語上の指示対象を保ちつつ、教理的説明は付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文としての簡潔さと品位を保った。「畏れ」は神への恐れと崇敬の緊張を残すため漢字表記とした。
