  text: וַ/תֹּאמַ֤רְןָ הַֽ/מְיַלְּדֹת֙ אֶל פַּרְעֹ֔ה כִּ֣י לֹ֧א כַ/נָּשִׁ֛ים הַ/מִּצְרִיֹּ֖ת הָֽ/עִבְרִיֹּ֑ת כִּֽי חָי֣וֹת הֵ֔נָּה בְּ/טֶ֨רֶם תָּב֧וֹא אֲלֵ/הֶ֛ן הַ/מְיַלֶּ֖דֶת וְ/יָלָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: ja
  text: 助産婦たちはファラオに答えた。「ヘブライ人の女たちはエジプト人の女たちとは違って、丈夫なのです。[a] 助産婦が彼女たちのところへ来る前に、すでに産んでいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「元気である」「たくましい」とも訳せる。ヘブライ語は、出産時の体力や産む早さを強調している可能性がある。「動物のようだ」という意味に取る解釈もある。
    reason: חָיוֹתの意味には幅があり、産婦の活力を指す理解と、より字義的に動物との類似を示す理解があるため。
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: 答えた
  rationale: אמרは基本的に「言った」だが、ここではファラオの問いただし（前節）への返答なので、文脈上自然な「答えた」とした。
- source_word: הַמְיַלְּדֹת
  choice: 助産婦たち
  rationale: 出産を助ける女性たちを指す定着した日本語。現代では「助産師」が一般的だが、古代の物語の職分を表す語として「助産婦」が自然である。
- source_word: אֶל־פַּרְעֹה
  choice: ファラオに
  rationale: אֶלは発話の相手を示す。固有の称号は日本語で広く定着した「ファラオ」とした。
- source_word: כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: ヘブライ人の女たちはエジプト人の女たちとは違い
  rationale: 最初のכִּיが導く説明を日本語では引用全体と文脈によって自然に示し、無動詞の比較表現を「～とは違い」とした。
- source_word: חָיוֹת
  choice: 丈夫
  rationale: חיהに関係する形容詞で、ここでは産婦の活力や出産の早さを表すと解した。「元気」「たくましい」も可能で、動物との比較と取る解釈もあるため脚注に示した。
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: 助産婦が着く前に
  rationale: בטרםは先行する時を表す。単数の「助産婦」は総称的であり、日本語では無冠詞のまま自然に表した。「彼女たちの所へ来る」を簡潔に「着く」とした。
- source_word: וְיָלָדוּ
  choice: 産んでしまいます
  rationale: 助産婦の到着より先に出産が完了していることを表す。日本語の「～てしまう」はここでは意外性よりも先行完了を自然に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な物語文としつつ、古代の職分には「助産婦」を用いた。直接話法は、ファラオへの返答として丁寧語にした。脚注記号[a]は曖昧な語「丈夫」の直後に置いた。
