lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そして彼は……言った
  rationale: 物語を進めるワウ連続法の通常の機能を保ちつつ、現代日本語として自然な叙述にした。
- source_word: אֶל עַמּוֹ
  choice: 自分の民に
  rationale: עַםはここで王に属する民衆・国民を集合的に指す。「自分の」により三人称男性単数接尾辞を自然に示した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 注意を強く促す提示辞の機能を、簡潔で品位ある日本語として保持した。
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの民
  rationale: 連語の字義的構造と、בְּנֵי יִשְׂרָאֵלにある系譜的・民族的呼称を本文で保持した。より自然な表現は脚注に示した。
- source_word: רַב
  choice: 数が多く
  rationale: מִמֶּנּוּとの比較関係の中で、人口・人数の多さを表す意味が文脈に最も適する。
- source_word: וְעָצוּם
  choice: 強い
  rationale: עָצוּםが表す強大さ・力強さを簡潔に訳し、前項と並ぶ比較述語として読める形にした。
- source_word: מִמֶּנּוּ
  choice: われわれよりも
  rationale: 前置詞מןと一人称複数接尾辞による比較を明示した。ヘブライ語では話者側との比較であり、日本語では「われわれよりも」が自然である。
