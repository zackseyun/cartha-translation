  yaml_path: translation/ot/exodus/001/006.yaml
  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: ja
  text: そして、ヨセフも、その兄弟たちも、その世代の人々もみな死んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: そして……死んだ
  rationale: 物語を先へ進めるワウ継続法を、現代日本語で自然な順接として表した。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: וְכָל אֶחָיו
  choice: その兄弟たちも
  rationale: אֶחָיו は三人称男性単数接尾辞を伴う複数形で、文脈上ヨセフの兄弟たちを指す。כָל の包括性は助詞「も」と、後続する「みな」によって自然に表した。
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: その世代の人々もみな
  rationale: דּוֹר は同時代を生きる人々の世代を指すため、「その世代の人々」と明示した。כֹל の包括性を「みな」で保持した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔でありながら物語文としての品位を保った。「その世代」だけでは世代そのものが死ぬという不自然さが生じるため、「の人々」を補って意味を明確にした。
