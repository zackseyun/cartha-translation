base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: ja
  text: 'こうして、神は助産婦たちによくしてくださった[a]。民は増え、非常に強くなった。


    [a] 別訳「助産婦たちに良いことをされた」。「助産婦たちを祝福された」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「助産婦たちに良いことをされた」。「助産婦たちを祝福された」とも訳せる。
    reason: וַיֵּיטֶבの受益的意味には複数の自然な訳し方があり、「祝福」は文脈上可能だが、語そのものよりやや解釈的であるため。
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: よくしてくださった
  rationale: יטבのヒフィル形にלが続き、相手のために良いことをする、よく待遇するという受益的な意味を表す。自然な現代日本語としつつ、具体的な恩恵の内容は限定しない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この物語ではイスラエルの神を指し、動詞も単数形であるため、標準的に「神」とした。
- source_word: לַמְיַלְּדֹת
  choice: 助産婦たちに
  rationale: 前置詞לの受益・対象の関係を、日本語の「〜に」で自然に表した。
- source_word: וַיִּרֶב
  choice: 増え
  rationale: 民の人数が多くなることを表すため、簡潔に「増え」とした。
- source_word: הָעָם
  choice: 民
  rationale: 原文は単に「民」と記しており、文脈からイスラエルの民と分かるため、説明を加えなかった。
- source_word: וַיַּעַצְמוּ
  choice: 強くなった
  rationale: עצםが表す、勢力や力が増大する動的な意味を保持した。
- source_word: מְאֹד
  choice: 非常に
  rationale: 直前の動詞を強く修飾する語として、明瞭で現代的な「非常に」を用いた。
theological_decisions:
- issue: 神の助産婦たちへの行為を「祝福した」と明示するか
  choice: よくしてくださった
  alternative: 祝福された
  rationale: יטבは神が彼女たちに良いことをしたことを示すが、その恩恵の様態までは特定しない。本文では中立的な表現を用い、具体的な報いを述べる次節との区別を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「よくしてくださった」は神の行為への敬意を自然に示しながら、原語が明示しない恩恵の内容を補わない。「民」「非常に強くなった」により、簡潔で dignified な物語調を保った。
