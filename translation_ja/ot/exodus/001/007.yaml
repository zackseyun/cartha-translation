  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: ja
  text: しかし[a]、イスラエルの子らは実を結び、おびただしく増え[b]、数を増し、きわめて強大になった。そして、その地は彼らで満ちた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして」。ヘブライ語の接続詞は単に「そして」とも訳せるが、ここでは前節との対照を表している。
    reason: alternative_reading
  - marker: b
    text: 別訳「群がるほど増え」。ヘブライ語の動詞は、群がり、満ちあふれるように増える様子を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: しかし、イスラエルの子らは
  rationale: בני ישראל の家族的・民族的表現を保ち、「子ら」とした。接続詞は前節でヨセフの世代が死んだこととの対照を表す文脈により「しかし」と訳した。
- source_word: פָּרוּ
  choice: 実を結び
  rationale: פרה の生殖・繁栄を表す比喩を保ち、創世記の祝福の言葉との響きも自然に残す。
- source_word: וַיִּשְׁרְצוּ
  choice: おびただしく増え
  rationale: שׁרץ が持つ、群がる生き物のように大量に生じる強いイメージを、人物を指す日本語として不自然にならない形で表した。別訳は脚注に示した。
- source_word: וַיִּרְבּוּ
  choice: 数を増し
  rationale: רבה の「多くなる」という基本義を明確にし、前後の増殖表現を畳みかける原文の連続性を保った。
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: 非常に強くなった
  rationale: עצם の中心的な意味である強大化を保ち、二重の מאד による強調を「非常に」で表した。文脈上は人口による勢力の増大も含み得るが、「数が増えた」だけには限定しなかった。
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: そのため、その地は彼らで満ちた
  rationale: הארץ を当地の領域として「その地」とし、מלא の受動的構文を保った。「そのため」は一連の増加の結果を自然な日本語で示すが、単純な継起として読む余地を脚注に残した。
theological_decisions:
- issue: 多産の表現にある創造・祝福の言葉との共鳴
  choice: 「実を結び」「数を増し」という語句で共鳴を保つが、本文ではその暗示を説明しない
  alternative: 創世記の祝福への言及を訳文に明示する
  rationale: 原文には創世記の祝福を思わせる語彙がある一方、明示的な引用説明はないため、訳語によって響きを残し、解釈を付加しない。
- issue: וַיַּעַצְמוּ が表す強さと人数の関係
  choice: 「非常に強くなった」とし、強大さを中心に訳す
  alternative: 「非常に数が多くなった」または「非常に勢力を増した」
  rationale: 文脈上、人数による勢力を含み得るが、語の意味を数量だけに限定せず、原文の幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の増加を表す四つの動詞の畳みかけを可能な限り維持しつつ、「群がった」のように人間について過度に奇異または侮蔑的に響く表現は避けた。脚注記号は対応箇所の本文中に配置した。
