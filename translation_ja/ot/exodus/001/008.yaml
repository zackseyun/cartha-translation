  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: ja
  text: エジプトを治める新しい王[a]が現れた。彼はヨセフを知らなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「別の王」。ヘブライ語は文字どおりには「新しい」だが、別の王朝や政権に属する王を指すと理解することもできる。
    reason: lexical_alternative
  - marker: b
    text: または「ヨセフを認めなかった」。ここでの「知る」は、単にヨセフについての情報がなかったという意味だけでなく、ヨセフを認める、あるいは彼を考慮に入れるという意味を含む場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: が立った
  rationale: קוםの物語を進める用法を、王が現れて権力の座に就いたことを自然に表す「立った」で訳した。原文に明示的な「さて」「その後」はないため加えない。
- source_word: מֶלֶךְ חָדָשׁ
  choice: 新しい王
  rationale: חָדָשׁの基本的な語義「新しい」を保ち、王朝交代などの解釈を本文に持ち込まない。
- source_word: עַל מִצְרָיִם
  choice: エジプトを治める
  rationale: 支配者と領域を結ぶעַלが示す統治・支配の関係を、現代日本語として自然に表した。
- source_word: אֲשֶׁר לֹא יָדַע
  choice: この王は…を知らなかった
  rationale: ידעの基本義「知る」を保ちつつ、関係節を独立文にして明瞭な日本語とした。承認しない、功績を顧みないという含意の可能性は注に残す。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions:
- issue: 「新しい王」が王朝交代を意味するか
  choice: 本文では「新しい王」とする
  alternative: 「別の王」「別王朝の王」
  rationale: 原文のחָדָשׁは文字どおり「新しい」であり、異なる王朝・政権だった可能性はあるが、この節だけでは確定しないため。
- issue: 王がヨセフを「知らなかった」の意味
  choice: 本文では「知らなかった」とする
  alternative: 「認めなかった」「ヨセフの功績を顧みなかった」
  rationale: ידעはここで単なる情報不足だけでなく、承認や配慮の欠如を含み得る。しかし原文の意味の幅を狭めないよう、基本義を本文に置き、別解を注記する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「エジプトの上に王が立った」という不自然な直訳を避け、עַלの支配関係を「エジプトを治める」で示した。関係節は二文に分け、普通の読者に読みやすくした。
