  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: ja
  text: ヤコブの腰から出た者は、全部で七十人であった[a]。ヨセフはすでにエジプトにいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヤコブの腰から出た者」。ヤコブの直接の子孫を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  choice: 者は、全部で七十人であった
  rationale: 物語をつなぐ וַיְהִי を日本語で不自然に直訳せず、人数を述べる文として表現した。נֶפֶשׁ はここでは人数を数える語なので「魂」ではなく「者／人」とした。
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: ヤコブの腰から出た者
  rationale: 「ヤコブの直接の子孫」を意味する身体的なヘブライ語慣用句の像を本文に残した。「腿」よりも日本語で生殖・子孫との関連が伝わりやすい「腰」を選んだ。
- source_word: שִׁבְעִים
  choice: 七十人
  rationale: 基数をそのまま訳し、日本語の人数助数詞を用いた。
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: ヨセフはすでにエジプトにいた
  rationale: 独立した付加説明として訳した。「すでに」は、家族の人数が語られる時点より前からヨセフがエジプトにいたという文脈上の時間関係を自然に示す。
