- source_word: הָעִבְרִיֹּת
  choice: ヘブライ人の
  rationale: 「助産婦たち」を修飾し、助産婦自身がヘブライ人であると読む自然な解釈を本文に採った。ただし、ヘブライ人女性に仕える助産婦という可能性も脚注に残した。
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: 一人の名は…、もう一人の名は…であった
  rationale: 二人をそれぞれ名前で特定する原文の分配的な表現を、自然で明瞭な日本語にした。
- source_word: שִׁפְרָה
  choice: シフラ
  rationale: ヘブライ語の人名を日本語の慣用的な音写で表した。
- source_word: פּוּעָה
  choice: プア
  rationale: ヘブライ語の人名を日本語の慣用的な音写で表した。
