- source_word: וַיֹּאמֶר
  choice: さて、…言った
  rationale: 物語の進行を示す接続形を、現代日本語として自然な「さて」で受け、発話動詞は簡潔に「言った」とした。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: エジプトの王
