id: EXO.1.11
reference: Exodus 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: ja
  text: そこで彼らは、イスラエルの民を重い労役で苦しめるため、その上に強制労働の監督官たちを置いた。民はファラオのために、貯蔵都市[b]ピトムとラメセス[c]を建てた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「その上に」「民は」に当たる箇所が男性単数形で、イスラエルを一つの民として集合的に指している。
    reason: alternative_reading
  - marker: b
    text: 別訳「倉庫の町」。物資を蓄えるための町を指す。
    reason: lexical_alternative
  - marker: c
    text: 「ラアムセス」とも表記される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 置いた
  rationale: שׂיםの使役的な配置の意味を自然な現代日本語で表し、監督官を任命・配置したことを示す。
- source_word: עָלָיו
  choice: その上に
  rationale: 男性単数接尾辞を直訳調の「彼の上に」とせず、集合体としてのイスラエルを受ける表現にした。ヘブライ語の単数形については脚注[a]で明示する。
- source_word: שָׂרֵי מִסִּים
  choice: 強制労働の監督官たち
  rationale: מַסִּיםがここで指す賦役・強制労働と、שָׂרֵיの役人・監督者としての機能を、一般読者に明確に伝える。
- source_word: לְמַעַן עַנֹּתוֹ
  choice: 苦しめるため
  rationale: ピエル形ענהの圧迫し苦しめる意味を、文脈に即して簡潔に表す。
- source_word: בְּסִבְלֹתָם
  choice: 重い労役で
  rationale: סִבְלֹתが荷や負担だけでなく課された労役を指しうるため、出エジプト記1章の強制労働の文脈を自然に表現する。
- source_word: וַיִּבֶן
  choice: 民は…建てた
  rationale: 動詞は三人称男性単数だが、集合体イスラエルを指すため、日本語では数を不自然に明示せず「民」を主語とした。原文の集合単数は脚注[a]に残す。
- source_word: עָרֵי מִסְכְּנוֹת
  choice: 貯蔵都市
  rationale: 物資を蓄える拠点となる町を指す簡潔で理解しやすい訳。別訳「倉庫の町」を脚注に示す。
- source_word: לְפַרְעֹה
  choice: ファラオのために
  rationale: 王のための建設であることを自然に表す。
- source_word: פִּתֹם
  choice: ピトム
  rationale: 地名を日本語で一般的な形に音写した。
- source_word: רַעַמְסֵס
  choice: ラメセス
  rationale: 地名を原語の子音構成に近い形で音写した。日本語訳で見られる異表記を脚注に示す。
theological_decisions:
- issue: イスラエルを指す集合単数
  choice: 本文では「イスラエルの民」「民」と自然に訳し、原文の単数形を脚注で示す。
  alternative: 「彼」「彼は」と単数代名詞を逐語的に用いる。
  rationale: ヘブライ語の単数形はイスラエルを一つの民として指す集合的用法であり、日本語で「彼」とすると個人を指すとの誤解が強い。意味を明確にしつつ、原文の形式と含意を脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。強制労働と抑圧の関係を読み取りやすくしつつ、ヘブライ語の集合単数という形式上の特徴は脚注で保存した。
