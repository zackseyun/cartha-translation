base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: ja
  text: エジプト人は、粘土とれんがの重労働、また野でのあらゆる労働によって、イスラエルの人々の生活を苦しいものにした。すなわち、イスラエルの人々に課したすべての労働を、過酷に行わせたのである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「容赦なく」とも訳せる。ヘブライ語は、人を押しつぶすような苛烈な強制を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: イスラエルの人々の生活を苦しいものにした
  rationale: מררの「苦くする」という比喩を踏まえつつ、日本語で生活全体を悲惨にした意味が自然に伝わる表現とした。主語と代名詞の指示対象の混同を避けるため、目的語を文脈上の「イスラエルの人々」と明示した。
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: 重労働
  rationale: עֲבֹדָהとקָשָׁהが表す、厳しく困難な労働を簡潔で自然な現代日本語にした。
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: 粘土とれんがを扱う
  rationale: חֹמֶרはこの建築労働の文脈では粘土またはモルタルを指し得る。古代のれんが作りとの結びつきが自然な「粘土」を採り、לְבֵנִיםの複数は日本語で集合的な「れんが」とした。補った「扱う」は労働との統語関係を明瞭にする。
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: 野でのあらゆる労働
  rationale: כָלの包括性とבַּשָּׂדֶהの場所的意味を保ち、農作業だけに限定しない訳とした。
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: 彼らに課したすべての労働を……行わせた
  rationale: 原文の語根עבדの反復と再述的な構文を、日本語として理解可能な使役表現に整えた。エジプト人がイスラエル人に労働を強制した関係を示す。
- source_word: בְּפָרֶךְ
  choice: 過酷に
  rationale: פָרֶךְが示す苛烈で人を打ち砕くような扱いを、本文では自然かつ抑制のある「過酷に」とした。より強い語感は脚注で示す。
