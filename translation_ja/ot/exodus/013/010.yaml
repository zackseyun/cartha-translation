  yaml_path: translation/ot/exodus/013/010.yaml
  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: ja
  text: あなたは、この定めを定められた時に、年ごとに守らなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「日々から日々へ」。ここでは一般に「年ごとに」という意味に理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: 守らなければならない
  rationale: שׁמר は法的・祭儀的文脈で、規定を継続して遵守することを表す。現代日本語では「守る」が自然であり、義務を示す接続完了形は「守らなければならない」とした。
- source_word: הַחֻקָּה הַזֹּאת
  choice: この定め
  rationale: חֻקָּה は固定された規定・法令を指す。「定め」は、過度に専門的または宗派的な響きを避けつつ、契約法規としての格調を保つ。
- source_word: לְמוֹעֲדָהּ
  choice: その定められた時に
  rationale: מוֹעֵד は定められた時・期を表し、接尾辞はこの遵守事項に属する時を示す。日本語で意味が明確になるよう「その定められた時に」とした。
- source_word: מִיָּמִים יָמִימָה
  choice: 年ごとに
  rationale: 字義的には「日々から日々へ」に近いが、年ごとの祭儀を扱う文脈では反復する年次を表す慣用句と理解される。本文では自然な意味を示し、字義を脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、法規としての厳粛さを保った。「条例」より日常的に理解しやすい「定め」を選び、ヘブライ語の慣用表現が持つ字義と文脈上の意味の両方を本文と脚注で示した。
