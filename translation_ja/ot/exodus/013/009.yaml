language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: ja
  text: これは、あなたの手の上のしるしとなり、あなたの両目の間の記念となる[a]。それは、ヤハウェの教え[b]があなたの口にあるようになるためである。ヤハウェが強い手によってあなたをエジプトから導き出されたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「両目の間」は「額」を指す表現とも理解できる。本文ではヘブライ語の言い方を保った。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェの律法」とも訳せる。ヘブライ語「トーラー」は、文脈により「教え」「指示」「律法」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: それは…となる
  rationale: 接続詞を伴う完了形は、この指示の文脈では将来の役割・結果を表す。「となる」は現代日本語として自然で、その趣旨を明確にする。
- source_word: לְאוֹת
  choice: しるし
  rationale: 記号、証拠、識別の印という幅を保ち、物理的な標識だけに限定しない。
- source_word: עַל יָדְךָ
  choice: あなたの手の上
  rationale: 原文の具体的な像を保持し、「腕」や後代の装具と解釈して訳すことを避ける。
- source_word: וּלְזִכָּרוֹן
  choice: 記念
  rationale: 単なる注意喚起よりも、出来事を覚えておくための記念という名詞の重みを保つ。
- source_word: בֵּין עֵינֶיךָ
  choice: あなたの目と目の間
  rationale: ヘブライ語の字義的表現を保持する。「額」は自然な意味理解だが、本文では解釈を確定せず脚注に示す。
- source_word: תּוֹרַת יְהוָה
  choice: ヤハウェの教え
  rationale: תּוֹרָהは律法を含む指示・教えを意味し得る。この節では口に置くべき神の指示という広い意味を自然な日本語で表す。「律法」も可能なため脚注に残す。
- source_word: בְּפִיךָ
  choice: あなたの口にある
  rationale: 原文の身体的比喩をそのまま保ち、唱えること、語ること、常に言える状態などの含意を限定しない。
- source_word: בְּיָד חֲזָקָה
  choice: 強い手によって
  rationale: חֲזָקָהの基本義に近く、ヤハウェの力強い救出を表す出エジプト記の定型的な像も保持する。
- source_word: הוֹצִאֲךָ
  choice: あなたを…から導き出された
  rationale: יצאのヒフィル形「外へ出す」を、目的語と起点を伴う自然で格調ある日本語にする。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写する。
theological_decisions:
- issue: 手と目の間についての表現を、後代の装具として明示するか
  choice: 「手の上」「目と目の間」という原文の像を本文に残す。
  alternative: 「腕に結ぶ」「額に付ける」と訳し、テフィリンを明示または暗示する。
  rationale: 原文は具体的な像を用いるが、後代の儀礼用具を名指ししてはいない。字義的表現により、物理的実践と比喩的理解の双方に対する本文の開かれ方を保つ。
- issue: תּוֹרָהの訳語
  choice: 本文では「教え」とする。
  alternative: 「律法」または「トーラー」。
  rationale: この語は法規だけでなく指示・教示も表す。「教え」は意味範囲を不必要に狭めず、現代日本語として明瞭である一方、「律法」も契約文脈では正当なので脚注に示す。
- issue: 「あなたの口にある」の意味を説明的に訳すか
  choice: 身体的比喩を保持する。
  alternative: 「いつも唱える」「語り伝える」と明示する。
  rationale: 口にあることは朗誦、告白、教示などを含み得るため、一つの行為だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、反復される「あなた」と身体的な像を保持した。「御手」のような伝統的敬語化は避け、原文の「手」を簡潔に訳した。神の行為には日本語として自然な尊敬表現「導き出された」を用いた。
