  to: ヤハウェがあなたを、カナン人、ヒッタイト人、アモリ人、ヒビ人、エブス人の地へ導き入れるとき、その地は、ヤハウェがあなたの父祖たちにあなたに与えると誓った、乳と蜜の流れる地です。あなたはこの月に、この務めを果たしなさい。
