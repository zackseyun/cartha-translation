  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: ja
  text: ヤハウェがあなたを、カナン人、ヒッタイト人、アモリ人、ヒビ人、エブス人の地へ導き入れるとき、その地は、ヤハウェがあなたの父祖たちにあなたに与えると誓った、乳と蜜の流れる地です。あなたはこの月に、この務めを果たしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: ～とき
  rationale: 将来の時を示す構文を、自然な現代日本語の時間節として訳した。
- source_word: יְבִיאֲךָ
  choice: あなたを導き入れる
  rationale: בוא のヒフィル形が表す「入らせる、連れて入る」という移動の意味を明確にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: カナン人、ヒッタイト人、アモリ人、ヒビ人、エブス人
  rationale: 単数形の民族名を、日本語で土地の住民集団を自然に表す名称として訳した。
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: あなたに与えるとあなたの父祖たちに誓った
  rationale: 土地にかかる関係節として、神の誓いと受益者を明示しつつ簡潔に訳した。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 乳と蜜の流れる地
  rationale: 土地の豊かさを表すヘブライ語の比喩を保ち、日本語聖書文体にもなじむ表現とした。
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: この礼拝の務めを行いなさい
  rationale: 動詞と同語根の名詞による「務めを務める」という構造を、不自然な重複を避けながら、規定された礼拝行為という文脈上の意味が伝わるようにした。
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: この月に
  rationale: 指示語を保ち、定められた月に行うという時間指定を直接に訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文の固有名を称号に置換せず、一般的な推定発音に基づいて音写した。
- issue: עֲבֹדָה の祭儀的含意
  choice: 礼拝の務め
  alternative: 儀式、祭儀、務め
  rationale: この語は一般的な労働や奉仕も意味し得るが、ここでは過越と種なしパンの規定された宗教的実践を指す。「礼拝の務め」は奉仕と祭儀の両方の含みを保ち、特定の典礼形式に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、契約の誓いと礼拝命令にふさわしい簡潔で格調ある文体とした。「父祖たち」は世代的・契約的な含意を保つために用いた。
