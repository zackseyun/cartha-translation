source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: ja
  text: ヤハウェは、昼には雲の柱によって彼らの前を進み、道を進むよう彼らを導かれた。夜には火の柱によって彼らに光を与え、彼らが昼も夜も進めるようにされた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: 主
  rationale: 神の固有名を表す四文字名。日本語聖書で広く定着し、朗読にも適する「主」とし、原語情報を脚注に示した。
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: 彼らの前を進み
  rationale: 分詞の継続的な動作と、民に先立つ空間的・指導的な意味を自然な日本語で表した。
- source_word: יוֹמָם בְּעַמּוּד עָנָן
  choice: 昼は雲の柱のうちにあって
  rationale: בְּを神が目に見える柱の形のうちに現臨する表現として訳し、「昼は」と「夜は」の並行を保った。
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: 道を導き
  rationale: נחהの導く意味を簡潔に表し、הַדֶּרֶךְを旅路として過度に限定せず「道」とした。
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: 夜は火の柱のうちにあって
  rationale: 前半との構文的な並行と、火の柱という具体的な像を保持した。
- source_word: לְהָאִיר לָהֶם
  choice: 彼らを照らされた
  rationale: 使役形の「光を与える、照らす」を自然な日本語で表現した。
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: こうして彼らは昼も夜も進むことができた
  rationale: 不定詞の目的・結果の含みを「こうして」で結び、旅の文脈に即してהלךを「進む」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: 主（脚注で「ヤハウェ」とも表記されることを明示）
  alternative: ヤハウェ
  rationale: 固有名であることを隠さないよう脚注を付しつつ、本文では現代日本語聖書で定着した敬虔で読みやすい表記を採用した。発音の再建には一定の不確実性がある。
- issue: 雲と火の柱に対する神の関係
  choice: 柱のうちにあって
  alternative: 柱によって
  rationale: 前置詞בְּは位置・手段の双方を表し得るが、主自身が民の前を進むという主節とのつながりを保つため、現臨を示唆する位置的表現を採った。ただし神を柱そのものと同一視する表現は避けた。
translation_notes:
  register: 明快な現代標準日本語を用い、雲の柱と火の柱の並行構造を保持した。主語を後半でも補って自然な文にし、神への敬意を表すため述語に敬語を用いた。
