- from: 主[a]は昼は雲の柱のうちにあって彼らの前を進み、道を導き、夜は火の柱のうちにあって彼らを照らされた。こうして彼らは昼も夜も進むことができた。
  to: ヤハウェは、昼には雲の柱によって彼らの前を進み、道を進むよう彼らを導かれた。夜には火の柱によって彼らに光を与え、彼らが昼も夜も進めるようにされた。
  rationale: 神名を本文に「ヤハウェ」と明記し、不要となる神名脚注を削除しました。「雲の柱／火の柱によって」は、原文の前置詞の意味の幅を保ちながら自然な現代標準日本語にしています。後半は「光を与え」として目的節「彼らが昼も夜も進めるようにされた」へつなぎ、原文の目的・結果関係を明確にしました。
