  naturalness: 「柱のうちにあって」は現代日本語ではやや不自然で、神が柱の内部にいるという不要な限定も招き得ます。「雲の柱によって／火の柱によって」は、文脈上の現れ・手段の含みを自然に表します。
  terminology: יהוהは本文で「ヤハウェ」とします。「雲の柱」「火の柱」は定着した訳語として維持します。「光を与え」はヘブライ語の使役形に適切です。
