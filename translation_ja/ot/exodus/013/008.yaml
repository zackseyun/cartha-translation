id: EXO.13.8
reference: Exodus 13:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: ja
  text: その日、あなたは自分の息子にこう告げなさい。「私がエジプトから出たとき、ヤハウェが私のために行われたのは、このためである[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私がエジプトから出たとき、ヤハウェが私のためにこのことを行われたからである。」ヘブライ語の「この」は、祭りを守る理由にも、ヤハウェが行われたことにも結び付けて理解できる。
    reason: 原文の統語的・語彙的な曖昧さを保持するため。
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: 告げなさい
  rationale: נגדのヒフィル形は「告げる、知らせる」を意味する。親が子に説明して伝えるという文脈に合い、命令として自然な現代日本語とした。
- source_word: לְבִנְךָ
  choice: 自分の息子に
  rationale: לְは間接目的語を示し、בִנְךָは単数男性の「あなたの息子」。原文の性と数を保った。
- source_word: בַּיּוֹם הַהוּא
  choice: その日
  rationale: 指示語を伴う標準的な時の表現。「その日」が簡潔で自然である。
- source_word: לֵאמֹר
  choice: こう
  rationale: 後続する直接話法を導く不定詞。「言って」を機械的に重ねず、「こう告げなさい」として機能を自然に表した。
- source_word: בַּעֲבוּר זֶה
  choice: このためである
  rationale: 理由・根拠を表す句。זֶהが過越の行為を指す読みを本文に採りつつ、後続のעשהの内容と結び付けることもできる統語的曖昧さを脚注に示した。
- source_word: עָשָׂה יְהוָה לִי
  choice: ヤハウェが私のために行われた
  rationale: עשהには明示された目的語がなく、「行う」という広い意味を保つ。「私のために」によりלִיの受益的な意味を表した。尊敬を示す慣用により「行われた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、神の固有名を一般的な日本語音写で示した。
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: 私がエジプトから出たとき
  rationale: בְּを伴う不定詞構文の時間的意味と、一人称単数の視点をそのまま表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有名יהוהがあるため、称号へ代替せず音写した。
- issue: בֵּןの性を明示するか
  choice: 息子
  alternative: 子ども
  rationale: 原文が単数男性であり、この箇所ではそれを一般化すべき文脈上の必然がないため、「息子」とした。
- issue: בַּעֲבוּר זֶהとעשהの統語的関係
  choice: 「このため」を祭儀を行う理由として前置する読み
  alternative: 「ヤハウェが私のためにこのことを行われた」と、זֶהをעשהの内容に近く結び付ける読み
  rationale: ヘブライ語の語順は両方の理解を許す。本文では因果表現を保ち、別の自然な区切り方を脚注で明示して、祭儀と救出の関係を一義的に固定しないようにした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「告げなさい」で契約教育の命令性を保ち、引用内の一人称は各世代が出エジプトを自らの救いとして語る原文の形を維持した。
