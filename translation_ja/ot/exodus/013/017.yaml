  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: ja
  text: ファラオが民を行かせたとき、神は、ペリシテ人の地を通る道が近かったにもかかわらず[a]、その道に民を導かなかった。民が戦いを目にして考えを変え[b]、エジプトへ戻ることがないようにと、神が言われたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その道が近かったから」。ここで用いられているヘブライ語の接続詞は、理由にも譲歩にも取ることができる。
    reason: lexical_alternative
  - marker: b
    text: または「心変わりして」「後悔して」。ここでは、戦いを前にして決意を変えることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: ファラオが民を行かせたとき
  rationale: בを伴う不定詞構文の時間的意味を「〜とき」で表した。שׁלחは出エジプト記で繰り返される「民を行かせる」という表現に合わせ、釈放の意味を自然に伝えた。
- source_word: נָחָם
  choice: 導かなかった
  rationale: נחהは道を進ませる、導くという意味であり、旅程を述べる文脈に即している。
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: ペリシテ人の地を通る道
  rationale: 地名へ単純化せず、ペリシテ人という民とその地を示すヘブライ語の地理的表現を、自然な日本語で保った。
- source_word: כִּי קָרוֹב הוּא
  choice: その道が近かったにもかかわらず
  rationale: כִּיには原因を示す読みと譲歩を示す読みの余地がある。本文では文脈上自然な譲歩として訳し、別の可能性を脚注に示した。
- source_word: פֶּן
  choice: 〜かもしれない
  rationale: 望ましくない事態への懸念を表すפֶּןを、神の発言として自然な現代日本語にした。
- source_word: יִנָּחֵם
  choice: 思い直して
  rationale: נחםのニファル形は、ここでは道徳的な悔い改めではなく、戦いを前に決意を変えることを指す。
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: 戦いを目にすると
  rationale: בを伴う不定詞構文の状況的・時間的意味と、מִלְחָמָהの武力衝突という意味を明瞭に表した。
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: エジプトへ戻る
  rationale: שׁובの「戻る」と、מִצְרָיְמָהの方向を示す語尾をそのまま反映した。
- source_word: וַיְהִי
  choice: （独立した訳語を置かない）
  rationale: 物語を進める連結形式の働きは日本語の文脈と「〜とき」の構文で十分に表されるため、原文にない「さて」などを加えなかった。
theological_decisions:
- issue: 神がペリシテ人の地を通る道を避けた理由
  choice: 神ご自身の発言として、民が戦いを見て決意を変え、エジプトへ戻る可能性を理由に示す
  alternative: 語り手による神の動機の推測、または神が事後的に計画を変更したという読み
  rationale: 原文のכִּי אָמַר אֱלֹהִיםは理由を神の発言として明示する。本文以上の摂理論的説明は加えず、語られている懸念をそのまま保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、神の直接話法には「言われた」を用いて品位を保った。「民」は集合的な呼称として統一し、過度に説明的な語句や教派的解釈を加えていない。
