id: EXO.13.18
reference: Exodus 13:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: ja
  text: そこで神は、民を葦の海[a]に通じる荒野の道へ回らせた。イスラエルの子らは、武装して[b]エジプトの地から上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「紅海」。ヘブライ語の名称は字義的には「葦の海」。
    reason: alternative_reading
  - marker: b
    text: 「武装して」と訳したヘブライ語の意味は確定しにくい。「戦いの備えをして」「戦闘隊形で」、また広く「隊列を整えて」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: 回り道させた
  rationale: ヒフィル形が示す使役と、直行せず迂回させたという文脈上の意味を、自然な日本語で表す。
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: 荒野の道を通って
  rationale: דֶּרֶךְ の経路の意味を保ちつつ、現代日本語として明瞭にした。
- source_word: יַם סוּף
  choice: 葦の海
  rationale: סוּף の通常の語義に基づき、伝統的な地名表現より原語の字義を優先した。
- source_word: וַחֲמֻשִׁים
  choice: 武装して
  rationale: 軍事的装備または隊列を指す可能性がある難語であり、簡潔で有力な意味を本文に採り、語義の不確かさを脚注に残した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の形を可視化しつつ、日本語で集合的な呼称として理解できる表現とした。
- source_word: עָלוּ
  choice: 上って行った
  rationale: עלה の方向性を保持し、エジプト脱出を描く物語表現として自然に訳した。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: 前置詞と名詞を直接的に反映した。
theological_decisions:
- issue: יַם סוּף の訳語
  choice: 葦の海
  alternative: 紅海
  rationale: 原語の字義を本文で優先し、長い翻訳伝統を持つ「紅海」は脚注に示した。
- issue: בְנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の男性複数形を保持する一方、この句が契約の民を集合的に指すという含みを変えないようにした。
- issue: וַחֲמֻשִׁים の解釈
  choice: 武装して
  alternative: 戦いの備えをして／隊列を整えて
  rationale: 語義を軍事的準備に限定しすぎないよう、異なる可能性を脚注で明示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の使役、経路表現、地名の字義、難語の曖昧さを保持した。脚注記号は該当語の直後に配置した。
