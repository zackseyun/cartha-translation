  text: לֹֽא יָמִ֞ישׁ עַמּ֤וּד הֶֽ/עָנָן֙ יוֹמָ֔ם וְ/עַמּ֥וּד הָ/אֵ֖שׁ לָ֑יְלָה לִ/פְנֵ֖י הָ/עָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: ja
  text: 昼は雲の柱が、夜は火の柱が、民の前から離れることはなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民の前から退くことはなかった」。ヘブライ語の動詞は、導く二つの柱が絶えずそこにあったことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: 離れることはなかった
  rationale: מוּשׁの使役形は、ある位置から取り去る、退かせるという意味を持つ。ここでは主語である二つの柱が民の前から退かず、絶えずそこにあったことを、自然な日本語で表す。
- source_word: עַמּוּד
  choice: 柱
  rationale: 垂直に立つ柱状の現れを指す語であり、この物語で定着した明瞭な訳語。
- source_word: הֶעָנָן
  choice: 雲
  rationale: עָנָןの直接的な訳。定冠詞を含む連語עַמּוּד הֶעָנָןを「雲の柱」とした。
- source_word: יוֹמָם
  choice: 昼は
  rationale: 昼の時間を表す副詞。対になるלָיְלָהとの均衡を保ちながら、現代日本語として自然にした。
- source_word: וְעַמּוּד הָאֵשׁ
  choice: 夜は火の柱が
  rationale: 「雲の柱」との並行構造と火という具体的な像を保つ。日本語では時間句を各主語の前に置いて対照を明確にした。
- source_word: לָיְלָה
  choice: 夜は
  rationale: 夜の時間を表す語。יוֹמָםの「昼は」と対応させた。
- source_word: לִפְנֵי
  choice: 前から
  rationale: יָמִישׁとともに、民の前方という位置から離れる動きを示す。「前から」により空間関係を簡潔に保つ。
- source_word: הָעָם
  choice: 民
  rationale: イスラエルを一つの共同体として指す定冠詞付き集合名詞。聖書本文にふさわしく、現代日本語でも理解しやすい「民」とした。
