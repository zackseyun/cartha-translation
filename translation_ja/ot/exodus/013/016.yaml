  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: ja
  text: これは、あなたの手の上のしるしとなり、あなたの両目の間の額飾りとなる。ヤハウェが力強い手によって、私たちをエジプトから導き出されたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: これは……となる
  rationale: 接続詞付き完了形が、この規定の継続的な意味を示す未来的・帰結的表現として用いられている。「これは」を補い、自然な日本語にした。
- source_word: לְאוֹת
  choice: しるし
  rationale: אוֹת は広く「しるし、証しとなるもの」を表す。ここでは具体性と象徴性の双方を保てる「しるし」が適切である。
- source_word: עַל יָדְכָה
  choice: あなたの手の上
  rationale: 原文は「腕」ではなく「手」であるため、その具体的な像を保持した。
- source_word: וּלְטוֹטָפֹת
  choice: 額飾り
  rationale: טוֹטָפֹת はまれな語で、額に着ける物を指すと考えられる。「額飾り」は後代の特定の儀礼用語に限定せず、想定される具体物を現代日本語で示す。語義の不確かさは脚注に残した。
- source_word: בֵּין עֵינֶיךָ
  choice: あなたの両目の間
  rationale: ヘブライ語の像をそのまま保った。「額に」は自然な慣用的解釈として脚注に示した。
- source_word: כִּי
  choice: ……からである
  rationale: 前半のしるしの根拠を導く理由節として明確に表した。
- source_word: בְּחֹזֶק יָד
  choice: 力強い御手によって
  rationale: 神の強力な働きを表す慣用句。「御手」は神に対する自然で格調ある日本語であり、「によって」は手段を明示する。
- source_word: הוֹצִיאָנוּ
  choice: 私たちを……から導き出された
  rationale: יצא のヒフィル形は「外へ出させる、連れ出す」の意。日本語では「導き出す」が救出を伴う移動を自然に表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: מִמִּצְרַיִם
  choice: エジプトから
  rationale: 起点を表す מִן を、「導き出す」と自然に結びつく「から」で訳した。
theological_decisions:
- issue: 手と目の間に関する表現を、後代の儀礼用具として特定するか
  choice: 「手の上」「両目の間」という原文の具体的な像を本文に保持する
  alternative: 本文で「聖句箱」など後代のフィラクテリーを明示する、または比喩的な「心に留めるもの」と意訳する
  rationale: 原文は後代の儀礼用具を明示せず、文字どおりの装着、象徴的な記念、またはその両方という解釈の余地を残している。その緊張を訳文でも保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。神の働きには「御手」「導き出された」を用いた一方、まれな語 טוֹטָפֹת の不確かさと「両目の間」という原文の表現は脚注を伴って保持した。
