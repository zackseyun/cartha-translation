  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: ja
  text: ヤハウェが、あなたとあなたの父祖たち[b]に誓ったとおり、あなたをカナン人の地へ導き入れ、その地をあなたに与える時[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「そして、…時にはそうなる」。ここでは日本語として自然に「…時」とした。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では字義的に「あなたの父たち」。文脈上は「あなたの先祖たち」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: そして……時には
  rationale: 未来の状況を導入するヘブライ語の定型表現。字義的な「そして、……すると、そのようになる」ではなく、時間的・前向きな意味を自然な日本語で表した。後続節へ続く構文であるため、文末を読点とした。
- source_word: יְבִיאֲךָ
  choice: あなたを……導き入れ
  rationale: בוא のヒフィル形は「来させる、連れて来る」の意。目的地が土地であるため、「導き入れる」が方向性と使役的意味を自然に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって表した。
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: カナン人の地に
  rationale: 民を表す単数の集合的呼称 הַכְּנַעֲנִי を「カナン人」とし、「カナン」と地名だけに言い換えず原文の表現を保った。אֶל の移動方向は「導き入れ」によって示した。
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: 誓ったとおり
  rationale: 比較・対応を示す כַּאֲשֶׁר と、誓いを立てることを表す נִשְׁבַּע を、簡潔で自然な日本語にした。
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: あなたとあなたの父祖たちに
  rationale: 反復される前置詞の関係を明示しつつ、אבות の男性形を「父祖たち」で保った。「父たち」では日本語で直近の父親を連想しやすいため、先祖を指す文脈を明確にした。
- source_word: וּנְתָנָהּ לָךְ
  choice: その地をあなたに与える
  rationale: 女性単数接尾辞は אֶרֶץ（地）を受けるため、日本語では指示対象を「その地」と明示した。未来の状況を述べる文脈に合わせて「与える」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いていることを保ち、固有名として音写した。
- issue: 「父たち」の指示範囲
  choice: 父祖たち
  alternative: 父たち、先祖たち
  rationale: 字義上の男性複数形を保ちながら、ここで歴代の祖先を指すことが現代日本語で明確になる表現を採った。「先祖たち」も意味上は可能だが、原文の父系的表現が弱まる。
translation_notes:
  register: 明瞭で現代的ながら、律法の告知にふさわしい格調を保った。節が次節へ続く従属節なので、独立した文として閉じず読点で終えた。
