base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: ja
  text: モーセはヨセフの骨を携えて行った。ヨセフがイスラエルの子らに固く誓わせて、こう言っていたからである。「神は必ずあなたがたを顧みてくださる[a]。あなたがたは私の骨をここから、あなたがたと共に携え上らなければならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「神は必ずあなたがたを訪れる」。このヘブライ語表現は、神がご自分の民のために決定的に働かれることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 携えて行った
  rationale: 物語を進める「取る」を、出エジプトの旅に伴って運ぶ文脈に即して、自然な現代日本語で表した。
- source_word: עַצְמוֹת יוֹסֵף
  choice: ヨセフの骨
  rationale: 「遺骸」と一般化せず、原文の具体的な「骨」を保った。
- source_word: עִמּוֹ
  choice: 携えて行った
  rationale: 日本語では動詞「携える」に同行の意味を含ませることで、「彼と共に」を不自然に重ねずに表現した。
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: 固く誓わせて
  rationale: ヒフィルの使役と、不定詞絶対形による強意の双方を簡潔に表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 単に「イスラエル人」とせず、原文の家族的な表現を、現代日本語でも理解できる形で残した。
- source_word: פָּקֹד יִפְקֹד
  choice: 必ず……顧みてくださる
  rationale: 不定詞絶対形による確実性を「必ず」で表し、פקדがこの文脈で示す、神が民に目を留めて決定的に働かれる含みを「顧みる」で保った。
- source_word: וְהַעֲלִיתֶם
  choice: 携え上らなければならない
  rationale: 誓いに基づく義務の力を表しつつ、エジプトから「上る」という方向性も残した。
- source_word: מִזֶּה אִתְּכֶם
  choice: ここから一緒に
  rationale: 現在地を指す「ここから」と、民が自分たちと共に骨を運ぶ同行の意味を自然に表した。
theological_decisions:
- issue: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם の意味
  choice: 神は必ずあなたがたを顧みてくださる
  alternative: 神は必ずあなたがたを訪れる
  rationale: 「訪れる」だけでは現代日本語で意図が曖昧になりやすい。「顧みる」は神の配慮と介入を示しつつ、その具体的な仕方を訳文で限定しすぎない。脚注で「訪れる」という語義も示した。
- issue: 誓いの中の וְהַעֲלִיתֶם の法的・義務的な力
  choice: 携え上らなければならない
  alternative: 携え上るだろう
  rationale: 単なる未来予告ではなく、ヨセフが誓わせた内容としての義務を明確にした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「骨」「イスラエルの子ら」「携え上る」など原文の具体性と方向性を保持した。引用部は厳粛さを保ち、過度に古風な語尾は避けた。
