review_pass:
  verdict: revise
  source_fidelity: 全体として原文の構文と祭儀上の対比をよく保持している。ただし「私たちを去らせようとしなかった」は、ファラオが主体的に去るかのようにも読め、日本語としては「去らせることを…拒んだ」とする方が、לְשַׁלְּחֵנוּ（われわれを行かせる／解放する）を正確に表す。また、בָּנַיは複数なので「私の息子たち」と明示する。
  naturalness: 「殺された」は敬意を示す用法として成立するが、明快な現代標準日本語では、行為主体を明瞭にする「殺した」がより直接的で自然である。「胎を開く雄の初子」は原文の慣用句を保ちながら、現行の「胎を最初に開く雄」より自然に読める。
  terminology: 「ヤハウェ」「初子」「いけにえとして献げる」「贖う」は、神名・祭儀・法的文脈を適切に保つ。「初子」は人と家畜の双方に用いる反復も原文に忠実である。
  issues:
  - severity: medium
    issue: 「私たちを去らせようとしなかった」の主語・使役関係
    rationale: 「去らせようとする」は、文脈上はファラオがイスラエルを去らせる意味に理解できるものの、自然な日本語としては使役の対象関係がやや不明瞭である。原文の「われわれを送り出すことを頑迷に拒んだ」を明示する必要がある。
  - severity: low
    issue: בָּנַי の複数性
    rationale: 原文は「私の息子たち」であり、「私の息子の初子」は日本語では単数の息子の初子とも読める。複数を明示する。
  - severity: low
    issue: 神の行為を表す「殺された」
    rationale: 敬語としては可能だが、現代日本語では受け身にも見えうる。原文の能動態を透明に示すため「殺した」とする。
  revised_text: ファラオが私たちを去らせることをかたくなに拒んだとき、ヤハウェはエジプトの地のすべての初子を、人の初子から家畜の初子に至るまで殺した。それゆえ私は、胎を開く雄の初子をすべてヤハウェにいけにえとして献げ、私の息子たちの初子はすべて贖う。
