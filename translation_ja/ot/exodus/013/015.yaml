revisions:
- from: ファラオがかたくなに私たちを去らせようとしなかったとき、ヤハウェはエジプトの地のすべての初子を、人の初子から家畜の初子に至るまで殺された。それゆえ私は、胎を最初に開く雄をすべてヤハウェにいけにえとして献げ、私の息子の初子はすべて贖う。
  to: ファラオが私たちを去らせることをかたくなに拒んだとき、ヤハウェはエジプトの地のすべての初子を、人の初子から家畜の初子に至るまで殺した。それゆえ私は、胎を開く雄の初子をすべてヤハウェにいけにえとして献げ、私の息子たちの初子はすべて贖う。
  rationale: 原文の因果関係、ファラオの頑迷な拒絶、エジプトの人と家畜の初子への災い、雄の胎を開く初子の献げ物と息子たちの初子の贖いという対比を維持した。変更は、使役関係・複数性・能動態を明確にし、現代標準日本語としての自然さを高めるために限った。
