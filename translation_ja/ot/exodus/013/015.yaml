language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: ja
  text: ファラオが私たちを去らせることをかたくなに拒んだとき、ヤハウェはエジプトの地のすべての初子を、人の初子から家畜の初子に至るまで殺した。それゆえ私は、胎を開く雄の初子をすべてヤハウェにいけにえとして献げ、私の息子たちの初子はすべて贖う。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: かたくなに私たちを去らせようとしなかった
  rationale: 使役形のקשׁהがこの文脈で表す頑強な拒絶を、שלחの「去らせる」と結びつけて自然な日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を普通名詞的な称号に置き換えず、固有の契約の名として音写した。
- source_word: בְּכוֹר
  choice: 初子
  rationale: 出生順で最初の子・仔を指す語を、人にも家畜にも適用でき、祭儀的文脈にも合う「初子」で一貫して訳した。
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: 人の初子から家畜の初子に至るまで
  rationale: אָדָםとבְּהֵמָהの対照を、現代日本語で明確な「人」と「家畜」によって保持した。
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 初子の災いと、その後の献納・贖いの慣行との因果的なつながりを示す。
- source_word: זֹבֵחַ
  choice: いけにえとして献げる
  rationale: 単なる贈与ではなく、屠殺を伴いうる祭儀的な奉献であることを自然かつ明確に表した。
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: 胎を最初に開く雄
  rationale: 「胎を開く」という原文の身体的・法的な慣用表現と、雄に限定する語を保持した。
- source_word: בָּנַי
  choice: 私の息子
  rationale: 原文が性別を明示して「息子たち」と述べる点を保持し、日本語では「すべて」との組み合わせに自然な単数形を用いた。
- source_word: אֶפְדֶּה
  choice: 贖う
  rationale: 代価または身代わりによって初子を祭儀的義務から取り戻す意味を、定着した語「贖う」で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有名を明示し、称号への置換によって契約名であることを不明瞭にしないため。
- issue: 人間の初子と家畜の初子に対する異なる扱い
  choice: 雄の家畜は献げ、息子の初子は贖うという対比をそのまま示す
  alternative: 「献げる」を非殺傷的な奉献と広く解する
  rationale: זבחは犠牲として献げることを示す一方、人の初子についてはפדהが明示されるため、原文の祭儀的対比を解消しない。
- issue: 神がエジプトの初子を殺したという叙述
  choice: 「ヤハウェは…殺された」と直接的に訳す
  alternative: 「打たれた」「死なせられた」と婉曲化する
  rationale: וַיַּהֲרֹגの行為主体と強い意味を保持し、本文の神学的緊張を婉曲表現で弱めない。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、祭儀・法的文脈に適した「初子」「贖う」「いけにえとして献げる」を用いた。「殺された」は尊敬ではなく、神を主語とする日本語聖書文体での敬意を示す補助動詞用法。原文に実質的な異読・訳語上の曖昧さを示す必要がないため、脚注は設けていない。
