  text: ヤハウェ[a]はモーセにこう語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」（神名四文字）。「ヤーウェ」とも表記され、伝統的には「主」または「エホバ」と訳されることもある。
    reason: 神名の発音と日本語表記には複数の慣例があるため。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: それから、…語って言われた
  rationale: 接続形が物語の進行を示すため「それから」で順次性を表し、דבר の発話行為を「語って」で反映した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、日本語で一般的な音写の一つによって固有名として示した。
- source_word: אֶל־מֹשֶׁה
  choice: モーセに
  rationale: 方向・相手を示す前置詞 אֶל を自然な現代日本語の助詞「に」で表し、人名は慣用表記とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する直接話法を導く定型句。日本語では敬意を保ちつつ自然に引用を導けるよう、「語って言われた」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が固有の神名を用いていることを保持し、称号「主」へ置換しなかった。ただし正確な古代の発音には不確かさがあるため、脚注で原綴りと別表記を示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ヘブライ語の発話導入句をある程度保持しつつ、日本語として過度に硬直しない表現にした。
