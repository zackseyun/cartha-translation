lexical_decisions:
- source_word: הַיּוֹם
  choice: 今日
  rationale: 定冠詞付きの名詞が副詞的に働き、出エジプトが起こる当日を指す。現代日本語で自然に切迫感を保つ。
- source_word: אַתֶּם
  choice: あなたがた
  rationale: イスラエルに向けた二人称男性複数を明示する。
- source_word: יֹצְאִים
  choice: 出て行く
  rationale: יצאのカル分詞で、進行中または目前の行為を表す。文脈上、エジプトから外へ出る動きを自然に示す。
- source_word: בְּחֹדֶשׁ
  choice: 月に
  rationale: 前置詞בְּと「月」の組み合わせによる暦上の時を、簡潔で自然な日本語にした。
- source_word: הָאָבִיב
  choice: アビブ
  rationale: 月の名称・呼称として音写し、熟した穀物や春という説明的意味は脚注に置く。
