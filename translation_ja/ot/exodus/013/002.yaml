source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: ja
  text: 「イスラエルの人々の間で、人であれ家畜であれ、母の胎を最初に開くすべての初子を、わたしのために聖別しなさい。これはわたしのものである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: 聖別せよ
  rationale: 神のために聖なるものとして取り分けることを命じるピエル形の命令であり、祭儀的な意味を保ちつつ現代日本語でも通用する表現。
- source_word: לִי
  choice: わたしのために
  rationale: 神への奉献・帰属を表す ל。日本語では「聖別せよ」と自然につながる「わたしのために」とした。
- source_word: כָל בְּכוֹר
  choice: すべての初子
  rationale: בכור は「初子、最初に生まれたもの」。本文に明示されない「雄」を補わず、人と家畜の双方に用いうる語を選んだ。
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: すなわち、すべて最初に母の胎を開くもの
  rationale: 直前の「初子」を詳しく説明する同格句。פטר רחם の慣用的な意味を明確にし、「母」は日本語で胎の意味を自然に示すための補足。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らのうち
  rationale: 原文の בני ישראל の形を保ち、共同体全体を指す表現として訳した。
- source_word: בָּאָדָם
  choice: 人であれ
  rationale: אָדָם はここで家畜と対照される人間一般を表す集合的単数。日本語の「人」は性別を限定せず、この対比を自然に表せる。
- source_word: וּבַבְּהֵמָה
  choice: 家畜であれ
  rationale: בְּהֵמָה は動物一般も指しうるが、この法的・祭儀的文脈では飼育される家畜が中心であるため「家畜」とした。
- source_word: לִי הוּא
  choice: それはわたしのものである
  rationale: 神への帰属を断定する簡潔な節。指示代名詞の単数は、初子という種類を集合的に受ける。
theological_decisions:
- issue: אָדָם と בְּהֵמָה の対照
  choice: 人であれ家畜であれ
  alternative: 人にも動物にも
  rationale: 原文の各名詞に付く前置詞 בְּ の並行を、日本語では範囲を示す「〜であれ〜であれ」で自然に表した。אָדָם を男性に限定せず、人間という類を表す語として保持した。
- issue: 初子の性別
  choice: 雄を本文に補わない
  alternative: すべての初子の雄
  rationale: 後続文脈では雄が明示される箇所があるが、本節の כָל־בְּכוֹר 自体には「雄」に当たる語がないため、ここでは解釈を先取りしない。
- issue: 神への奉献と所有
  choice: 「わたしのために聖別せよ」と「わたしのものである」をともに保持
  alternative: 「わたしのものとしてささげよ」と一体化する
  rationale: 命令と、それを根拠づける神の所有宣言との区別を原文どおり保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔で荘重な調子とした。「初子」「聖別」は聖書文脈で必要な用語だが、構文を平明にして理解しやすくした。
