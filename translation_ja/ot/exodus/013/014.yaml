  to: 後になって、あなたの息子が「これは何ですか」と尋ねるとき、あなたは彼にこう答えなさい。「主は力強い御手によって、私たちをエジプトから、奴隷の家から導き出された。」
  rationale: 将来の問いかけという原文の構文を明瞭にし、子の直接の問いを原文どおり簡潔にした。神名、神の御手という比喩、一人称複数、ならびに「奴隷の家」という比喩は維持した。
