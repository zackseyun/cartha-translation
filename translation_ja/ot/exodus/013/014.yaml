  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: ja
  text: 後になって、あなたの息子が「これは何ですか」と尋ねるとき、あなたは彼にこう答えなさい。「主は力強い御手によって、私たちをエジプトから、奴隷の家から導き出された。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: 後になって
  rationale: 字義は「明日」だが、ここでは次の世代が将来問いかける時を指す慣用的用法であるため、自然な現代日本語で表した。
- source_word: בְּחֹזֶק יָד
  choice: 力強い御手によって
  rationale: 神の圧倒的な力を表す「手」の比喩を保ちつつ、神への敬意を示す日本語として「御手」とした。
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字名を、日本語聖書で広く理解される伝統的な表記「主」で示した。
- source_word: מִבֵּית עֲבָדִים
  choice: 奴隷の家から
  rationale: エジプトを隷属の場所として表す原文の簡潔で強い比喩を保持した。
theological_decisions:
- issue: 出エジプトを語る世代の一体性
  choice: 私たちを
  alternative: 私たちの先祖を
  rationale: 原文の一人称複数接尾辞「נוּ」をそのまま保ち、後代のイスラエルも救出の出来事を共同体自身の物語として告白する表現を弱めないため。
- issue: 神の名の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 固有名であることを認識しつつ、本文では一般読者に明瞭で礼拝的伝統にも定着した表記を用いた。特定の発音再建を本文で断定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「尋ねたなら／答えなさい」で律法的な指示の調子を保ち、子どもの問いは自然な直接話法とした。「奴隷の家」は原文の比喩をあえて残している。
