review_pass:
  verdict: revise
  source_fidelity: 原文の基本内容（将来、息子が問い、父が主によるエジプトからの救出を告げること）は保たれている。「私たち」「奴隷の家」もヘブライ語の表現を適切に反映している。ただし、יִשְׁאָלְךָ（「あなたに尋ねる」）の将来・反復的な条件は、「尋ねたなら」より「尋ねるとき」とする方が明確である。また、子の問いは単純な「これは何ですか」であり、「どういうことですか」は説明要求へ少し意味を広げる。
  naturalness: 全体として自然で明瞭である。「後になって…尋ねるとき」は、מָחָרの「将来に」を自然な日本語で示す。直接話法内の「これは何ですか」は、子どもの問いとしても原文に忠実で分かりやすい。
  terminology: 「主」は本文中の神名の慣用的表記として一貫している。「力強い御手」はיַדの比喩と敬意ある文体を保つ。「奴隷の家」は比喩を保持しており、בֵּית עֲבָדִיםに対応する。
  issues:
  - severity: low
    issue: 子の問いが「これはどういうことですか」となっている。
    rationale: מַה זֹּאתは字義的には「これは何ですか」である。「どういうことですか」は、その物の意味・理由を尋ねる響きを加えるため、より簡潔な問いに改めるのが安全である。
  - severity: low
    issue: 「尋ねたなら」は完了した問いへの条件のようにも読める。
    rationale: יִשְׁאָלְךָは将来の場面を導く未完了形であり、「後になって」とも呼応する「尋ねるとき」が、将来・反復可能な教えの場面をより自然に示す。
  revised_text: 後になって、あなたの息子が「これは何ですか」と尋ねるとき、あなたは彼にこう答えなさい。「主は力強い御手によって、私たちをエジプトから、奴隷の家から導き出された。」
