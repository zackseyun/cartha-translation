base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: ja
  text: ろばの初子はすべて、羊またはやぎ一頭で贖わなければならない。もし贖わないなら、その首を折らなければならない。また、あなたの息子たちのうちの初子はすべて贖わなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: ろばの初子
  rationale: פֶּטֶרは文字どおりには「胎を最初に開くもの」を指すが、この法規の文脈では、日本語の「初子」が簡潔に初めて生まれた子を表す。חֲמֹרは「ろば」とした。
- source_word: תִּפְדֶּה
  choice: 贖わなければならない
  rationale: פדהは、代価または代わりのものによって解放する法的・祭儀的行為を表す。「贖う」はその意味を保ち、ここでの未完了形の規定的な効力は「なければならない」で明確にした。
- source_word: בְשֶׂה
  choice: 羊またはやぎ一頭で
  rationale: שֶׂהは羊に限らず、やぎを含む小家畜一頭を指し得る。日本語には同じ範囲を自然に表す単一の一般語がないため、原語の幅を本文で明示した。
- source_word: וַעֲרַפְתּוֹ
  choice: その首を折らなければならない
  rationale: ערףは通常の屠殺ではなく、うなじ側から首を折ることを表す。「首を折る」が明瞭で自然である。
- source_word: בְּכוֹר אָדָם
  choice: 人の初子
  rationale: אָדָםはここで動物に対する人間という種類を表す。「人の初子」は成人男性に限定せず、動物の初子との対比を保つ。
- source_word: בְּבָנֶיךָ
  choice: あなたの息子たちのうち
  rationale: בָּנִיםはここでは明示的に「息子たち」であり、初子となる男子を扱う法規なので、性別を中和せずに訳した。
theological_decisions:
- issue: אָדָםの範囲
  choice: 動物と対比される人間という種類を示す「人」
  alternative: 人間／人類
  rationale: この語を成人男性という意味に狭めず、ろばの初子と人の初子との法的対比を保った。同時に、בְּבָנֶיךָは別に「あなたの息子たち」と明示した。
- issue: שֶׂהの犠牲動物としての範囲
  choice: 羊またはやぎ一頭
  alternative: 子羊／羊一頭
  rationale: 特定の動物種や年齢に狭める神学的含意を避け、原語が持つ小家畜一頭という範囲を保った。
translation_notes:
  register: 現代標準語による明瞭で格調ある法規文とした。「初子」「贖う」は日常語よりやや聖書的だが、この箇所の祭儀的・法的意味を簡潔に保つため採用した。義務規定は一貫して「なければならない」で表した。
