  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: ja
  text: 彼らはスコトを出発し、荒野の端にあるエタムで宿営した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 彼らは…出発し
  rationale: 動詞 נסע の物語叙述形・複数で、宿営地をたたんで次の場所へ旅立つ動作を示す。現代日本語として自然な「出発する」を採用した。
- source_word: מִסֻּכֹּת
  choice: スコトを
  rationale: 前置詞 מִן は出発点を表す。日本語では移動動詞「出発する」とともに起点を「を」で示すのが自然である。地名 סֻכּוֹת は「スコト」と音写した。
- source_word: וַיַּחֲנוּ
  choice: 宿営した
  rationale: חנה は旅の途中で陣を張って滞在することを表す。「宿営した」は「キャンプした」よりも聖書の移動集団にふさわしく、かつ現代日本語で明瞭である。
- source_word: בְאֵתָם
  choice: エタムで
  rationale: 前置詞 בְּ の場所を示す用法を、日本語の動作場所を表す「で」で訳した。地名 אֵתָם は「エタム」と音写した。
- source_word: בִּקְצֵה
  choice: …の端にある
  rationale: קָצֶה は末端、縁、境を意味する。ここでは地理的位置を自然に示す「端」を採用し、エタムを修飾する形にした。
- source_word: הַמִּדְבָּר
  choice: 荒野
  rationale: מִדְבָּר は必ずしも砂砂漠に限定されず、人里離れた乾燥地・放牧地を指し得るため、聖書文脈で広く通用する「荒野」とした。
