  source_fidelity: 原文は「彼らはスコトから出発し、エタムに宿営した。そこは荒野の端であった」という移動と宿営の順序、およびエタムの地理的限定を述べる。訳文は「スコトを出発し」「エタムで宿営した」により、出発点・到着地・行為を正確に表している。「荒野の端にあるエタム」は、原文の「荒野の端に（ある）エタム」を自然な日本語の連体修飾として保持している。
