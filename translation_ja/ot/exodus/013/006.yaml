  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: ja
  text: 七日間、種なしパンを食べなければならない。七日目には、ヤハウェ[a]への祭りがある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は神名「YHWH」。ここでは「ヤハウェ」と表記した。古代の正確な発音は確定しておらず、伝統的には「主」と訳される。
    reason: 神名の表記と発音上の不確かさを説明するため。
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す連語であり、現代日本語では「七日間」が簡潔かつ自然に継続期間を示す。
- source_word: תֹּאכַל
  choice: あなたは……食べなければならない
  rationale: 律法的・指示的文脈における未完了形二人称男性単数の命令的効力を、明確な現代日本語で表す。
- source_word: מַצֹּת
  choice: 種なしパン
  rationale: 過越祭と祭りの文脈で、パン種を入れないパンを指す。一般読者にも理解しやすい標準的な訳語を採った。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: そして七日目には
  rationale: 接続詞וを素直に「そして」とし、前置詞句の時点を「七日目には」で示した。
- source_word: חַג
  choice: 祭りを行う
  rationale: חַגは宗教的な祝祭を指す。ヘブライ語の名詞文を自然な日本語にするため、存在を補うよりも祭儀の実施を表す「祭りを行う」とした。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לの奉献・方向性を「への」で保ち、神名יהוהは音写して訳した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有の契約名יהוהを直接用いているため、一般的に復元される発音に基づく「ヤハウェ」とし、称号「主」への置換を避けた。正確な古代の発音には不確かさがあることを脚注で明示する。
- issue: חַג לַיהוָהの統語的表現
  choice: ヤハウェへの祭りを行う
  alternative: ヤハウェのための祭りがある
  rationale: 動詞のない名詞句の簡潔さを保ちつつ自然な日本語にした。祭りがヤハウェにささげられ、ヤハウェに向けられる関係を示し、特定の宗派的祭儀理解は加えない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。律法上の指示としての力を明示しつつ、過度に古風な「べし」は避けた。
