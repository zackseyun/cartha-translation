base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: ja
  text: 七日間にわたって、種なしパンを食べなければならない[a]。あなたのところには、パン種を入れたものがあってはならず[b]、あなたの領域のどこにもパン種があってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「七日間、種なしパンが食べられる」。原文は受動形で、七日間の規定を表している。
    reason: translation_form
  - marker: b
    text: 直訳では「あなたのもとで見られてはならない」。パン種を入れたものを所有下や領域内に置いてはならない、という意味。
    reason: idiom
lexical_decisions:
- source_word: מַצּוֹת
  choice: 種なしパン
  rationale: 過越の祭りで食べる、パン種を用いないパンを指す。現代日本語で意味が明確で、祭儀的な用法にも適している。
- source_word: יֵאָכֵל
  choice: 食べなければならない
  rationale: 原文はニファル未完了形で、直訳すれば受動の「食べられる」。日本語では規定としての効力を自然に伝えるため、義務表現としたが、脚注で原文の受動形を示した。
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: 七日間にわたって
  rationale: 期間を示す対格であり、祭りの七日間全体に及ぶことを明確に表す。
- source_word: יֵרָאֶה לְךָ
  choice: あなたのところには……あってはならない
  rationale: 字義は「あなたのもとで見られてはならない」。所有下・支配領域内に存在させてはならないという法的文脈の意味を、自然な日本語で表した。
- source_word: חָמֵץ
  choice: パン種を入れたもの
  rationale: 次の שְׂאֹר が発酵のもととなるパン種そのものを指すのに対し、חָמֵץ はパン種で発酵させた物を広く指し得る。この区別を日本語でも保持した。
- source_word: שְׂאֹר
  choice: パン種
  rationale: 発酵させるために用いる種を指す。古代の実態と聖書文脈に合い、現代日本語でも理解可能な表現である。
- source_word: בְּכָל גְּבֻלֶךָ
  choice: あなたの領土のどこにも
  rationale: 境界内の全域を表す句。包括的な範囲を自然な日本語で明示した。
