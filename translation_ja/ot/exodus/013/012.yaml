source:
  edition: WLC
  text: וְ/הַעֲבַרְתָּ֥ כָל פֶּֽטֶר רֶ֖חֶם לַֽ/יהֹוָ֑ה וְ/כָל פֶּ֣טֶר שֶׁ֣גֶר בְּהֵמָ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ הַ/זְּכָרִ֖ים לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: ja
  text: あなたは、すべて胎を開くもの[a]をヤハウェのために取り分けなければならない。また、あなたが所有する家畜に生まれる最初の子はすべて、そのうち雄のものはヤハウェのものである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「すべて胎を開くもの」。胎から最初に生まれる子を指す。
    reason: lexical_alternative
  - marker: b
    text: 「家畜に生まれる最初の子」は、家畜の胎から最初に生まれる子を指す。そのうち雄のものがヤハウェのものとされる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: 取り分けなければならない
  rationale: ヒフィル形の字義は「通らせる、移す」だが、ここではヤハウェに移して聖別する祭儀的行為を指す。「取り分ける」は、その意味を明瞭かつ過度な意訳なしに伝える。
- source_word: כָל פֶּטֶר רֶחֶם
  choice: すべて胎を開くもの
  rationale: 字義的な「胎を開くもの」というヘブライ語の慣用表現を保ち、胎から最初に出る子を指す法的・祭儀的な表現を再現した。
- source_word: לַיהוָה
  choice: ヤハウェのために／ヤハウェのもの
  rationale: 契約の固有名 יהוה を音写し、前半では奉献の方向、後半では帰属を文脈に応じて表した。
- source_word: כָל פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: あなたの家畜が産む最初の子はすべて
  rationale: שֶׁגֶר は特に動物の産む子を指す。日本語として自然にしつつ、家畜の胎から最初に生まれる子という意味を保持した。
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: あなたの家畜
  rationale: 所有を表す節を、日本語では名詞句に組み込み、簡潔で自然に表現した。
- source_word: הַזְּכָרִים
  choice: 雄であれば
  rationale: 定冠詞付き複数形は該当する子のうち雄のものを指定する。「雄であれば」として、性別による限定を明示した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に現れる契約の固有名を固有名として示し、一般名詞・称号で置き換えない。
- issue: 家畜の初子と雄の限定との統語関係
  choice: 家畜が産む最初の子のうち、雄がヤハウェに属する
  alternative: 家畜の初子はすべて雄であるかのように訳す
  rationale: 文末の הַזְּכָרִים は雄を指定しており、その限定関係を明瞭にした。ただし原文の分節を大きく崩さないよう、条件節の形で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、律法本文にふさわしい簡潔で厳粛な調子とした。「胎を開くもの」は原文特有の法的・祭儀的表現として保持し、脚注で意味を補った。
