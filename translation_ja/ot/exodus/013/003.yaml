reference: Exodus 13:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: ja
  text: モーセは民に言った。「あなたがたがエジプト、すなわち奴隷の家[a]から出たこの日を覚えていなさい。ヤハウェが力強い御手[b]によって、あなたがたをそこから連れ出したからである。パン種を入れたものは何も食べてはならない[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「奴隷たちの家」。エジプトを、人々が奴隷にされていた場所として表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「強い手によって」。また「力ある御手によって」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: また「パン種を入れたパンは食べてはならない」とも訳せる。ヘブライ語は、パン種を入れたものを広く指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: 覚えていなさい
  rationale: 単数命令形で、民全体を一つの共同体として呼びかけている。単に思い出すだけでなく、記念し続ける含意を自然な現代日本語で表す。
- source_word: הַיּוֹם הַזֶּה
  choice: この日
  rationale: 定冠詞付き名詞と指示詞の組み合わせを簡潔に反映する。原文にない強調は加えない。
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: あなたがたがエジプトから出た
  rationale: יצא の基本的な移動の意味と、複数形の聞き手を明確に保つ。
- source_word: מִבֵּית עֲבָדִים
  choice: 奴隷の家から
  rationale: 字義的な具体性を保ちつつ、エジプトが隷属の場であったことを表すヘブライ語の慣用表現として自然に読める。
- source_word: כִּי
  choice: からである
  rationale: この日を覚えるべき理由を示す因果関係を明確にする。
- source_word: בְּחֹזֶק יָד
  choice: 力強い御手によって
  rationale: 神の圧倒的な力ある働きを表す慣用句。『御手』は擬人的表現を保ちながら、神を指す文脈にふさわしい品位を持つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名四文字を日本語で一般的な形に音写する。
- source_word: הוֹצִיא ... אֶתְכֶם
  choice: あなたがたを導き出した
  rationale: יצא のヒフィル形の使役的意味『外へ出す』を表す。『導き出す』は主体的な救出を自然に示すが、道案内だけを意味するものではない。
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: パン種を入れたものは何も食べてはならない
  rationale: 受動形による一般的な禁止を自然な日本語で表し、חָמֵץ をパンだけに狭めず、パン種を入れた食物全般を指し得る広さを保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を直接用いているため、称号『主』への代替を避け、神名として示す。
- issue: עֲבָדִים の社会的状態
  choice: 奴隷
  alternative: しもべ／隷属
  rationale: この出エジプト定型句はイスラエルが実際に奴隷状態に置かれていたことを指すため、意味を弱めない具体的な語を選ぶ。
- issue: חָמֵץ の指示範囲
  choice: パン種を入れたもの
  alternative: パン種を入れたパン
  rationale: 語は発酵させた食物・パン種入りのものを広く指し得るため、パンだけに限定せず、原文の範囲を保持する。
translation_notes:
  register: 明快な現代標準日本語を用い、命令と理由づけの流れを保った。神への敬意を示すため「御手」を用いたが、全体は過度に古風にしていない。「すなわち」はエジプトと「奴隷の家」が同格であることを日本語で明確にする。
