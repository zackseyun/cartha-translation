id: EXO.23.32
reference: Exodus 23:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תִכְרֹ֥ת לָ/הֶ֛ם וְ/לֵ/אלֹֽהֵי/הֶ֖ם בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: ja
  text: 彼らとも、彼らの神々とも契約を結んではならない[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「契約を切る」。
    reason: lexical_alternative
  - marker: b
    text: より形式的には、「彼らと、また彼らの神々と」。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: 〜てはならない
  rationale: 法的な文脈における明確な禁止として、現代日本語で自然かつ厳粛に表した。
- source_word: תִכְרֹת … בְּרִית
  choice: 契約を結ぶ
  rationale: 直訳すれば「契約を切る」だが、これは契約締結を意味するヘブライ語の定型表現である。日本語の対応する自然な慣用表現「契約を結ぶ」を用いた。
- source_word: לָהֶם
  choice: 彼らとも
  rationale: 契約の相手を示すため「彼らと」とし、後続するもう一つの相手と合わせて禁止されることを明確にする「も」を添えた。
- source_word: וְלֵאלֹהֵיהֶם
  choice: 彼らの神々とも
  rationale: 複数形を保って「神々」とした。接続詞 ו は形式上「そして／また」だが、否定文中の二つの契約相手を日本語で自然に示すため「〜とも、〜とも」と表現した。
- source_word: בְּרִית
  choice: 契約
  rationale: 政治的な条約に限定せず、宗教的・関係的な重みも保つ標準的な訳語である。
theological_decisions:
- issue: כרת ברית という契約締結の慣用句
  choice: 契約を結ぶ
  alternative: 契約を切る
  rationale: 原文の字義的な比喩を注で示しつつ、本文では意味を正確に伝える自然な現代日本語を採用した。
- issue: 「彼らの神々」の前の ו の働き
  choice: 彼らとも、彼らの神々とも
  alternative: 彼らと、また彼らの神々と
  rationale: ו の基本的な加算の働きを損なわず、禁止が両方の相手に及ぶことを日本語で明瞭にした。形式的な「また」による訳も注に残した。
translation_notes:
  register: 明快な現代標準日本語。法的な禁止の厳粛さを「〜てはならない」で保ち、ヘブライ語の慣用句は自然な日本語に置き換えた。
