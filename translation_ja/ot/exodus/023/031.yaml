language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: ja
  text: わたしは、あなたの境界を、葦の海[a]からペリシテ人の海まで、また荒野から大河[b]までと定める。わたしがその地の住民をあなたがたの手に渡し、あなたは彼らを自分の前から追い払う。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「紅海」と訳される。
    reason: lexical_alternative
  - marker: b
    text: ユーフラテス川を指す。
    reason: cultural_note
  - marker: c
    text: 原文では、「あなたの境界」「あなたは……追い払う」は単数形、「あなたがたの手」は複数形である。
    reason: textual_feature
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: わたしは……とする
  rationale: 神の約束を表す未来の意味を保ちつつ、領域の境を定める文脈に自然な現代日本語とした。
- source_word: גְּבֻלְךָ
  choice: あなたの境
  rationale: גְּבוּל の基本義である境界を簡潔に表す。「領土」まで意味を広げず、原文の地理的な表現を保った。
- source_word: מִיַּם סוּף
  choice: 葦の海
  rationale: סוּף の字義を見える形で残した。伝統的な呼称「紅海」は脚注に示し、地理的同定を本文で断定しすぎないようにした。
- source_word: יָם פְּלִשְׁתִּים
  choice: ペリシテ人の海
  rationale: 原文の民族・地理的呼称をそのまま伝え、「地中海」と解釈的に置き換えることを避けた。
- source_word: וּמִמִּדְבָּר
  choice: また荒野から
  rationale: מִדְבָּר を出エジプト記で自然かつ慣用的な「荒野」とした。
- source_word: הַנָּהָר
  choice: あの川
  rationale: 定冠詞付きの「川」という原文表現を保ちつつ、日本語で特定の川を指すことが分かる形にした。指示対象は脚注で説明した。
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: あなたがたの手に渡し
  rationale: 「手に与える」というヘブライ語の具体的な比喩を、日本語として自然な「手に渡す」で表した。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: その地の住民
  rationale: 「その地に住む者たち」を簡潔で明瞭な現代日本語にした。
- source_word: וְגֵרַשְׁתָּמוֹ מִפָּנֶיךָ
  choice: あなたは彼らを自分の前から追い払う
  rationale: גרשׁ の強い排除の意味と、מִפָּנֶיךָ の「あなたの前から」という空間的表現を保った。
theological_decisions:
- issue: יַם סוּף の地理的呼称
  choice: 本文を「葦の海」とする
  alternative: 紅海
  rationale: 原語の語形に透明な訳を本文に置き、伝統的な地理名称は脚注に残すことで、語義と同定の両方を読者に示した。
- issue: 語りかける相手の単数・複数の交替
  choice: 「あなた」と「あなたがた」の交替を本文に反映する
  alternative: すべて「あなたがた」に統一する
  rationale: 原文は「あなたの境」「あなたは追い払う」では単数形、「あなたがたの手」では複数形を用いる。共同体を一体として語る表現上の緊張を均さずに残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名は原文に近い形を優先し、必要な同定を脚注に置いた。原文にある二人称の単数・複数の交替も意図的に保持した。
