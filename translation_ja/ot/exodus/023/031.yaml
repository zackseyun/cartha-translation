  to: わたしは、あなたの境界を、葦の海[a]からペリシテ人の海まで、また荒野から大河[b]までと定める。わたしがその地の住民をあなたがたの手に渡し、あなたは彼らを自分の前から追い払う。[c]
  rationale: 脚注aを、本文の「葦の海」と対照される実際の代替訳「紅海」を示す内容に改めた。「あの川」を「大河」に改め、原文の定冠詞付きの慣用的地理表現と、明瞭な現代日本語との両方を保った。それ以外の本文は原文の内容、語りかけの単数・複数の交替、および追放の表現を適切に伝えている。
