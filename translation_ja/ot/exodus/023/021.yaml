source:
  edition: WLC
  text: הִשָּׁ֧מֶר מִ/פָּנָ֛י/ו וּ/שְׁמַ֥ע בְּ/קֹל֖/וֹ אַל תַּמֵּ֣ר בּ֑/וֹ כִּ֣י לֹ֤א יִשָּׂא֙ לְ/פִשְׁעֲ/כֶ֔ם כִּ֥י שְׁמִ֖/י בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: ja
  text: 彼の前で身を慎み[a]、その声に聞き従いなさい。彼に逆らってはならない。彼はあなたがたの背きを赦さないからである。わたしの名が彼の内にある[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼の顔の前で自分を守れ」。ここでは、彼の前で慎重にし、その権威を軽んじないようにとの警告。
    reason: lexical_alternative
  - marker: b
    text: または「わたしの名が彼の中にある」「彼はわたしの名を帯びている」。この句は使者が神の権威と特別に結びつくことを示すが、その正体をこの節だけで明示するものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: 彼の前で自分を戒め
  rationale: 再帰的な警戒を命じるニファル命令形と、直訳すれば「彼の顔の前で」を意味する前置詞句を合わせ、使者の臨在において慎重に振る舞うよう求める警告として表現した。「彼に気をつけ」は、使者自身を危険視する意味にも取られ得るため避けた。
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: その声に聞き従いなさい
  rationale: שׁמע בְּקוֹל は声を聞くだけでなく、それに従うことを通常含む。「声」を残しつつ、文脈上の服従の含意が現代日本語で明確になるよう「聞き従う」とした。
- source_word: אַל תַּמֵּר בּוֹ
  choice: 彼に逆らってはならない
  rationale: מרה の反抗・不服従の意味を自然な現代日本語で表す。「反逆する」より広く、神の権威を帯びた使者への意図的な反抗を示せる。
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: 彼はあなたがたの背きを赦さない
  rationale: 罪を目的語とする נשׂא の慣用的な赦免の意味を「赦す」で表した。פשע は故意の違反・反逆を含むため「背き」とし、複数接尾辞を「あなたがたの」で明示した。
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: わたしの名が彼の内にある
  rationale: בְּקִרְבּוֹ の「彼の内に／彼の中に」を近く保ち、神の名と使者との強い結びつきを示しながら、その存在論的な意味を説明し切らない訳とした。
theological_decisions:
- issue: 使者の本性と「わたしの名が彼の内にある」の意味
  choice: 原文に近い「わたしの名が彼の内にある」を本文に残し、使者の正体を断定しない。
  alternative: 「彼はわたしの名を帯びている」として、委任された神的権威を前面に出す。
  rationale: この句は使者が神の権威と特別に結びついていることを示すが、この節だけでは、被造の使者なのか神の臨在の顕現なのかを明示していないため、神学的緊張を保持した。
- issue: 「彼は赦さない」という警告の主体性
  choice: 主語を「彼」と明示し、使者についての本文の強い言明をそのまま保つ。
  alternative: 「その背きは赦されない」と受動化して、赦しにおける使者の役割を弱める。
  rationale: ヘブライ語は使者を明確な主語としており、続く「わたしの名が彼の内にある」がその権威の根拠を示す。受動化は原文の神学的な強さを減じる。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語。命令と警告の強さを保ちつつ、古風すぎる語を避けた。「彼」が直前の節の使者を指すことを前提に、原文どおり代名詞を維持した。
