  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: ja
  text: 六日間は自分の仕事をし、七日目には仕事をやめなさい。それは、あなたの牛やろばが休み、女奴隷の息子と寄留者[b]が息をつけるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「寄留者」とは、イスラエルの民の中に住み、その社会的・法的秩序の下で暮らす外国出身者を指す。
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日の間は
  rationale: 期間を表す対格として理解し、六日間という継続期間を自然な日本語で示す。
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: 自分の仕事をし
  rationale: 法的命令の文脈にある未完了形を命令として読み、מַעֲשֶׂיךָの広い意味を「仕事」で表す。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת
  choice: 七日目には仕事をやめなければならない
  rationale: שׁבתの基本義である「やめる、停止する」を明示し、何をやめるかを直前の「仕事」から補って自然な日本語にした。
- source_word: לְמַעַן יָנוּחַ
  choice: それは、…が休み、…ようにするためである
  rationale: לְמַעַןの目的を明確にし、נוחを動物について自然な「休む」とした。
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: あなたの牛とろば
  rationale: 農作業用の家畜を指す語を、現代の一般読者に明瞭な語で訳した。שׁוֹרは文脈上「牛」とし、性別や去勢の有無を不必要に限定しない。
- source_word: וְיִנָּפֵשׁ
  choice: 息をつける
  rationale: נפשׁのニファル形が表す、労働を離れて息を取り戻す・元気を回復するという具体的な含意を自然に伝える。
- source_word: בֶּן אֲמָתְךָ
  choice: あなたの女奴隷の息子
  rationale: 直訳的な社会関係を保つ。אָמָהは単なる雇用人ではなく隷属的身分を表し得るため、「女奴隷」とした。
- source_word: הַגֵּר
  choice: 寄留者
  rationale: イスラエル共同体の中に居住し、その社会的・法的秩序の下にある非イスラエル人という制度的区分を簡潔に保つ。
theological_decisions:
- issue: 安息日規定におけるשׁבתの訳
  choice: 仕事をやめなければならない
  alternative: 休まなければならない
  rationale: 動詞の中心義である労働の停止を優先し、続く目的節の「休む」「息をつける」との意味上の区別も保った。
- issue: גרの社会的・法的意味
  choice: 寄留者
  alternative: 在留外国人
  rationale: 単なる旅行者や見知らぬ人ではなく、イスラエルの中に住む外来者という聖書本文の法的カテゴリーを保持するため。
- issue: אמהが示す身分
  choice: 女奴隷
  alternative: 女使用人
  rationale: 古代社会における隷属的な身分を曖昧にせず、同時に本文以上の制度的詳細は加えないため。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、契約法の命令としての重みを保った。「ろば」は一般読者に読みやすい表記とし、「息をつける」で人に及ぶ安息の人道的目的を具体的に表した。
