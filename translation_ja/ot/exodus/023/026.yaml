  text: לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַ/עֲקָרָ֖ה בְּ/אַרְצֶ֑/ךָ אֶת מִסְפַּ֥ר יָמֶ֖י/ךָ אֲמַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: ja
  text: あなたの地には、流産する者も、子を産めない者もいない[a]。わたしは、あなたの生涯の日数を満たす[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子を失う者も、子を産めない者もいない」。最初の語は広く子を失うことを指し得るが、ここでは「子を産めない者」と並ぶため、流産を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 直訳「わたしは、あなたの日数を満たす」。すなわち、定められた生涯の日数が満ちるまで生きることをいう。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: 流産する者
  rationale: שׁכל の使役語幹の分詞形。עֲקָרָה と並び、土地における出生の祝福が語られる文脈なので、ここでは子を失うことのうち特に流産を指すと解するのが自然である。分詞的な表現も保った。
- source_word: עֲקָרָה
  choice: 子を産めない者
  rationale: 不妊の状態を指す語。「不妊の者」よりも日常語として明瞭で、原文が女性形であることも文脈上自然に伝わる表現とした。
- source_word: בְּאַרְצֶךָ
  choice: あなたの地には
  rationale: イスラエルが住むことになる契約の土地を指すため、「国」ではなく「地」とした。日本語の存在文に合わせて助詞「には」を用いた。
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: あなたの日数を
  rationale: 直訳的な「あなたの日々の数」を簡潔な日本語にしつつ、寿命を日数の総計として表すヘブライ語の比喩を残した。
- source_word: אֲמַלֵּא
  choice: 満たす
  rationale: מלא の「満たす、いっぱいにする」という基本的な比喩を保持した。ここでは定められた生涯を十分な長さまで全うさせる意味である。
- source_word: לֹא תִהְיֶה
  choice: いない
  rationale: 存在を否定する節を、現代日本語として自然かつ明確に表した。
theological_decisions:
- issue: 出生と長寿の約束の適用範囲
  choice: 土地についてイスラエルに与えられた契約上の祝福として訳し、その内容を流産、不妊、寿命の充足としてそのまま示す。
  alternative: 時代や契約の文脈を問わず、すべての信仰者個人に流産、不妊、早世が決してないことを保証する普遍的約束とする。
  rationale: 直前から続く主の契約の約束は、イスラエルがその地で受ける祝福を扱っている。訳文では約束を弱めない一方、本文が明示しない普遍的適用も付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、契約の約束にふさわしい簡潔で格調ある調子とした。「流産する者」「子を産めない者」は原文の女性形の二語を不自然な性別説明なしに伝える。「日数を満たす」はヘブライ語の充満の比喩を保持する。
