  yaml_path: translation/ot/exodus/023/010.yaml
  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: ja
  text: 六年の間、あなたは自分の土地に種をまき、その産物を取り入れなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その収穫を」。
    reason: תְּבוּאָהは土地の「産物」のほか、文脈上「収穫」とも訳せるため。
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: 六年の間
  rationale: 文頭の接続詞を直訳的に「そして」とせず、期間を示す自然な時間表現とした。
- source_word: תִּזְרַע
  choice: 種をまき
  rationale: 農耕を表す基本義を明確に伝える。後続の動詞と合わせ、法的文脈の規定として表現した。
- source_word: אַרְצֶךָ
  choice: 自分の土地
  rationale: ここでは地球や地面一般ではなく、耕作する土地を指す。「自分の」は二人称単数の所有接尾辞を自然に示す。
- source_word: וְאָסַפְתָּ
  choice: 取り入れ
  rationale: 農産物を集めて収穫する行為を、過度に限定せず自然な日本語で表した。
- source_word: תְּבוּאָתָהּ
  choice: その産物
  rationale: 土地から得られる農業上の産出物を広く指す語として選び、女性単数接尾辞が土地を受けることを「その」で示した。
