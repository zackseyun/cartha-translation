source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: ja
  text: わたしの御使い[a]があなたの前を行き、あなたをアモリ人、ヒッタイト人、ペリジ人、カナン人、ヒビ人、エブス人のもとへ導き、わたしは彼ら[b]を滅ぼし尽くすからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの使者」とも訳せる。ヘブライ語の מַלְאָךְ は、人間の使者にも天上の御使いにも用いられる。ここでは神による導きの文脈から「御使い」とした。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「彼を」または「それを」に当たる単数形だが、列挙された諸民族を集合的に指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: からである
  rationale: 直前の命令と約束の根拠を示す接続詞として、説明の働きを保つ。節全体を受ける日本語として文末で表現した。
- source_word: יֵלֵךְ
  choice: 行き
  rationale: 文脈上、将来についての神の約束を表す未完了形。後続する動作と自然につないだ。
- source_word: מַלְאָכִי
  choice: わたしの御使い
  rationale: מַלְאָךְは人間または天上の使者を指し得るが、ここでは神による超自然的な導きの文脈に即して「御使い」とした。人物の神学的な正体は特定しない。
- source_word: לְפָנֶיךָ
  choice: あなたの前を
  rationale: 先立って進み、導くことを表す原文の空間的表現を自然な日本語で保持した。
- source_word: וֶהֱבִיאֲךָ
  choice: あなたを…のもとへ導き
  rationale: בואのヒフィル形が表す「来させる、連れて行く」に対応する。「導く」は御使いが先立つ文脈に自然であり、目的地は後続の民族名で示した。
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: アモリ人、ヒッタイト人、ペリジ人、カナン人、ヒビ人、エブス人
  rationale: ヘブライ語では単数形の民族呼称だが、それぞれの民族を表す標準的な日本語名称を用いた。
- source_word: וְהִכְחַדְתִּיו
  choice: わたしは彼らを滅ぼし尽くす
  rationale: כחדのヒフィル形が表す、消滅させる・滅ぼすという強い意味を示す。接尾辞は単数形だが、列挙された諸民族を集合的に受けるため、日本語では「彼ら」とした。
theological_decisions:
- issue: מַלְאָכִיが指す存在の性質
  choice: 「わたしの御使い」と訳し、その存在を原文以上に特定しない。
  alternative: 「わたしの使者」、神顕現、受肉前の御子と解する立場。
  rationale: この節自体はその存在を神の御使い／使者とだけ呼ぶ。訳文では、神顕現やキリスト論上の特定を行わず、解釈上の余地を残した。
- issue: וְהִכְחַדְתִּיוの目的語の数
  choice: 単数接尾辞を集合的と捉え、日本語では複数の「彼ら」とした。
  alternative: 形態どおりに「彼／それ」とする、または諸民族全体を「その民」として単数で表す。
  rationale: 直前に列挙された複数の民族が集合的な対象である。日本語で意味を明瞭かつ自然に伝えるため複数表現とし、形態上の単数は注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の宣言にふさわしい簡潔で品位ある文体とした。「御使い」は現代日本語の聖書語として理解可能で、注により「使者」という語義も示した。
