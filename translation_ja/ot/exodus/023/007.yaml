  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: ja
  text: 偽りの事柄には近づかないようにしなさい。[a] 罪のない人と正しい人を殺してはならない。私は悪人を正しいとは認めないからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「偽りの訴えから」「偽りから」。ヘブライ語の「事柄／言葉」は意味が広く、偽証や欺瞞的な裁判案件を含み得る。
    reason: lexical_alternative
  - marker: b
    text: または「私は有罪の者を無罪とはしない」。ここで用いられているヘブライ語動詞は法廷的な意味を持ち、「正しいと宣告する」「正しいと認める」「無罪とする」と訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: 偽りのことから
  rationale: דָּבָר は「言葉」「事柄」「案件」などを広く表す。法的文脈を保ちつつ「偽りの訴え」に限定しすぎないよう、「こと」と訳した。
- source_word: תִּרְחָק
  choice: 遠ざかりなさい
  rationale: 能動的に距離を置くよう命じる二人称単数の指示を、明確で自然な現代日本語で表した。
- source_word: וְנָקִי
  choice: 罪のない人
  rationale: 法的・道徳的な罪責を負わない者という意味を、一般読者に明瞭な表現で示した。
- source_word: וְצַדִּיק
  choice: 正しい人
  rationale: 司法的文脈で「正当な側にある人」を指しつつ、後半の אַצְדִּיק との語根上のつながりを「正しい」で保った。
- source_word: אַל תַּהֲרֹג
  choice: 殺してはならない
  rationale: הרג は広く「殺す」を意味するため、動機を限定する「殺害する」や「謀殺する」ではなく、広い禁止として訳した。
- source_word: לֹא אַצְדִּיק
  choice: 正しいとは認めない
  rationale: צדק のヒフィル形が持つ法廷的な「正しいと宣告する、無罪とする」の意味を表し、צַדִּיק との語のつながりも保った。
- source_word: רָשָׁע
  choice: 悪しき者
  rationale: 法的な「有罪の者」と道徳的な「悪しき者」の両面を持つため、意味を狭めない表現を選んだ。
theological_decisions:
- issue: 神の発言の法廷的意味
  choice: 私は悪しき者を正しいとは認めない
  alternative: 私は有罪の者を無罪とはしない
  rationale: 神が悪しき者を正しいと宣告しないという司法的意味を示しながら、צַדִּיק と אַצְדִּיק の語根上の結びつきを日本語でも可能な限り保った。より明確な法廷用語による別訳は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「偽りのこと」は原語の広さを残し、「罪のない人と正しい人」「悪しき者を正しいとは認めない」によって司法的文脈と語のつながりを示した。
