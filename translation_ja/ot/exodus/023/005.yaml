  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: ja
  text: もし、あなたを憎む者のろばが荷の下に伏しているのを見て、彼を助ける[b]のを差し控えようとしても、必ず彼と共に[a]そのろばを助けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼と共に」と訳した語は、「それと共に」、すなわちろばの荷を解くために助ける、という意味にも理解できる。ヘブライ語の男性単数の代名詞は、所有者とろばのどちらを指すとも取れる。
    reason: alternative_reading
  - marker: b
    text: ここで「助ける」と訳したヘブライ語は、通常は「放置する」「見捨てる」を意味するが、この文脈では援助する、特に荷の下に伏したろばを扱うのを手伝う、という意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: …のを見て
  rationale: כִּי は法文上の条件を導くが、日本語では「…のを見て」と続けることで、条件的な場面設定を自然に表せる。ראה の直接的な意味「見る」も保持した。
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: あなたを憎む者のろば
  rationale: שֹׂנַאֲךָ は「敵」と一般化せず、分詞の字義に即して「あなたを憎む者」とした。חֲמוֹר は現代日本語の「ろば」とした。
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: 荷物の下で倒れ伏している
  rationale: רבץ は動物が伏すことを表す。重荷のため動けない文脈を自然に伝えつつ、「押しつぶされている」など本文以上の説明は加えない。מַשָּׂא はここでは「荷物」とした。
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: 彼を助けるのを差し控えたいと思っても
  rationale: חדל מן は「…するのをやめる、差し控える」。難解な構文が示す、援助を控えようとする状況・意向を「…たいと思っても」で自然に表した。לוֹ は本文では所有者を指す「彼」と理解した。
- source_word: עָזֹב תַּעֲזֹב
  choice: 必ず…助けなければならない
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意と義務を「必ず…なければならない」で表した。עזב の通常義は「去る、放置する」だが、この文脈では荷を解くことを含む援助の意味と判断した。
- source_word: עִמּוֹ
  choice: 彼と一緒に
  rationale: 男性単数接尾辞を本文ではろばの所有者に結び付け、共同して助ける意味に取った。ただし、ろばを指す可能性は脚注に残した。
theological_decisions:
- issue: עִמּוֹ の指示対象
  choice: 彼と一緒に（あなたを憎む所有者と一緒に）
  alternative: それと一緒に／それを助ける（ろばを指す）
  rationale: 男性単数形は所有者にもろばにも文法上対応し得る。本文では、憎む者であってもその人と共同して援助するという法の対人的な力点に沿って所有者を指すとしたが、真正な曖昧さを脚注に明示した。
- issue: עזב の文脈上の意味
  choice: 助ける
  alternative: 荷を解く／放置する
  rationale: この語の通常義は「去る、放置する」だが、本節の反復表現は文脈上、荷を下ろすなどして援助する命令を表す。具体的動作を一つに限定しないため本文は「助ける」とした。
translation_notes:
  register: 明瞭な現代標準日本語の法的命令文とした。「ろば」は常用的な表記を採用し、相手への敵意を「敵」と要約せず「あなたを憎む者」と表した。命令の強意は「必ず…なければならない」で保持した。脚注マーカーは対応箇所が重なるため文末に連続して置いた。
