  source_fidelity: 原文は、憎む者のろばが荷の下に伏している場合にも援助を差し控えてはならず、強意をもって援助するよう命じる。草案の基本理解はこれに沿っている。ただし、終結部の「彼と一緒に助けなければならない」は、日本語では誰を／何を助けるのかが不自然に不明瞭であり、「彼を助ける」との直前の表現とも意味上つながりにくい。暗示される対象であるろばを補って明示するのが安全である。
  naturalness: 「彼と一緒に助けなければならない」は現代標準日本語として不自然である。また「倒れ伏している」は、原文の「伏している／うずくまっている」よりも、倒れたことを強く示す。本文を自然な条件文・命令文に整え、脚注マーカーを該当箇所に置く。
  terminology: 「ろば」「あなたを憎む者」「荷」「必ず」は適切である。「助ける」はこの文脈で許容されるが、脚注では通常義を「去る」ではなく他動詞としての「放置する／見捨てる」とし、文脈上の援助義を説明する。
