source:
  edition: WLC
  text: אֶת אֵֽימָתִ/י֙ אֲשַׁלַּ֣ח לְ/פָנֶ֔י/ךָ וְ/הַמֹּתִי֙ אֶת כָּל הָ/עָ֔ם אֲשֶׁ֥ר תָּבֹ֖א בָּ/הֶ֑ם וְ/נָתַתִּ֧י אֶת כָּל אֹיְבֶ֛י/ךָ אֵלֶ֖י/ךָ עֹֽרֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: ja
  text: わたしは、あなたに先立って、わたしがもたらす恐怖[a]を送り、あなたがその中に入って行く民をことごとく混乱に陥れ[b]、あなたの敵をすべて、あなたに背を向けさせる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの恐怖」とも訳せる。または「わたしのもたらすおののき」。
    reason: lexical_alternative
  - marker: b
    text: 「恐慌に陥れ」、「大混乱に陥れ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語では直訳すると、「あなたのすべての敵を、あなたの前に背（または、うなじ）として与える」。敵が背を向けて退くことを表す慣用句。
    reason: idiom_explanation
lexical_decisions:
- source_word: אֵימָתִי
  choice: わたしの恐怖
  rationale: 接尾辞の一人称所有を保ちつつ、אֵימָהが表す強い恐れ、おののき、恐慌を「恐怖」で表した。神自身が恐れるという意味ではなく、神に属し、神が送り出す恐怖という文脈上の意味であるが、その関係を本文で一義的に言い換えず、原文の簡潔さを保った。
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: あなたに先立って……送り
  rationale: לְפָנֶיךָの空間的・先行的な意味を、現代日本語として自然な「あなたに先立って」で表した。
- source_word: וְהַמֹּתִי
  choice: 混乱に陥れ
  rationale: המםの使役的な意味、すなわち敵を混乱、恐慌、騒乱に陥れることを表す。単に打ち破るとせず、軍事的敗走までをこの動詞だけに読み込まないようにした。
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: あなたがその中に入って行くすべての民
  rationale: בָהֶםを「その中に」と訳し、敵対を明示する「攻めて行く」は避けた。עָםは単数形だが、行く先で出会う人々を集合的に指すため「すべての民」とした。
- source_word: וְנָתַתִּי אֶת כָּל אֹיְבֶיךָ אֵלֶיךָ עֹרֶף
  choice: あなたの敵をことごとく、あなたに背を向けさせる
  rationale: 直訳的には敵を「背／うなじ」として与えるというヘブライ語の慣用表現であり、敵が背を見せて退く情景を、日本語で理解できる形にしつつ保持した。
theological_decisions:
- issue: 戦いにおける恐怖、混乱、敵の退却に対する神の主体的関与
  choice: 「わたしは……送り」「混乱に陥れ」「背を向けさせる」と、神を直接の行為主体として訳す。
  alternative: 神の関与を間接化し、「恐怖が先立つ」「民は混乱する」「敵は逃げる」と訳す。
  rationale: 原文はいずれも一人称単数の動詞によって神の直接的な働きを明示しているため、その主張を弱めずに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の一人称による宣言の力強さと、「背を向ける」という原文の身体的イメージを保持した。「ことごとく」は格調を保ちつつ、כָּלの包括性を自然に示す。
