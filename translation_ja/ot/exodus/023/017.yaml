  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: ja
  text: 年に三度、あなたがたの男子は皆、主ヤハウェ[a]の前に出なければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、称号「主」と神名「ヤハウェ」を続けて「主ヤハウェ」としている。
    reason: 原文にある称号と神名の組み合わせを明示するため。
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 年に三度
  rationale: 一年の祭儀周期の中で三回という意味を、簡潔で自然な日本語にした。
- source_word: יֵרָאֶה
  choice: 前に出なければならない
  rationale: ニファル形はここでは、神の御前に参上することを表す慣用表現。「見られる」と直訳せず、義務を示す文脈も反映した。
- source_word: כָּל זְכוּרְךָ
  choice: あなたのもとにいる男子は皆
  rationale: 男性を明示する原文を保ちつつ、二人称単数接尾辞を不自然な所有表現にせず表した。
- source_word: אֶל פְּנֵי
  choice: 前に
  rationale: 目上の者や神の臨在へ出ることを示す一般的なヘブライ語表現に対応する、自然で簡潔な訳。
- source_word: הָאָדֹן
  choice: 主
  rationale: 神に用いられた称号として、現代日本語の聖書文体で自然な「主」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文にある神名を音写した。
theological_decisions:
- issue: הָאָדֹן יְהוָה における称号と神名の組み合わせ
  choice: 主ヤハウェ
  alternative: 主なる神／主なるヤハウェ
  rationale: הָאָדֹן を称号「主」、יְהוָה を固有名「ヤハウェ」としてそれぞれ保持し、原文の称号と神名の併置を解消しなかった。
translation_notes:
  register: 明快な現代標準語を用いながら、命令規定としての荘重さを保った。「御前」は避け、原文に対応する簡潔な「前に」とした。
