base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: ja
  text: 賄賂を受け取ってはならない。賄賂は見識のある人々の目をくらまし、正しい人々の言葉をねじ曲げるからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しい人々の言葉」は、司法の文脈では「正当な側にいる人々の陳述」または「その訴え」という意味にも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: 賄賂
  rationale: 裁きを不正に左右するための金品を指すため、現代日本語で明確な「賄賂」とした。
- source_word: לֹא תִקָּח
  choice: 受け取ってはならない
  rationale: 法規における二人称単数の禁止を、自然で格調を保つ現代日本語で表した。
- source_word: כִּי
  choice: からである
  rationale: 禁止の理由を導く接続詞として、文末で簡潔に因果関係を示した。
- source_word: יְעַוֵּר
  choice: 目をくらませ
  rationale: 判断力を損なうという比喩を示しつつ、原文の視覚的イメージを保持した。
- source_word: פִּקְחִים
  choice: 物事を見抜く人
  rationale: 目が開かれているという原義と、的確に判断できる人という文脈上の意味の双方が伝わる表現を選んだ。
- source_word: וִיסַלֵּף
  choice: ねじ曲げる
  rationale: 曲げる、ゆがめるという強い比喩を、自然で分かりやすい日本語にした。
- source_word: דִּבְרֵי
  choice: 言葉
  rationale: 司法的文脈では陳述や訴えを指し得るが、原語の広さを保つため「言葉」とした。
- source_word: צַדִּיקִים
  choice: 正しい人々
  rationale: 道徳的に正しい者とも、訴訟で正当な側にいる者とも読める原語の幅を保持した。
theological_decisions:
- issue: דִּבְרֵי צַדִּיקִים の司法的含意
  choice: 本文では「正しい人々の言葉」とし、語義の広さを保つ
  alternative: 「正当な側にいる人々の陳述」または「正しい者の訴え」
  rationale: 周囲は司法の文脈だが、原文は「言葉／事柄」と「正しい者／正当な者」の双方に幅があるため、一義的に限定しなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、法規としての厳粛さを保った。「目をくらませ」と「ねじ曲げる」により、原文の二つの鮮明な比喩を残した。
