source:
  edition: WLC
  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: ja
  text: 彼らはあなたの地に住んではならない。彼らがあなたに、わたしに対して罪を犯させることがないように[a]。もしあなたが彼らの神々に仕えるなら[b]、それはあなたにとって罠となる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らがあなたを、わたしに対する罪へと導くことがないように」。
    reason: lexical_alternative
  - marker: b
    text: または「あなたは彼らの神々に仕えることになるからだ」。ヘブライ語の接続詞は説明を表すとも取れ、この節を単純な条件ではなく、起こり得る結果として読むことができる。
    reason: alternative_reading
  - marker: c
    text: 「罠」はヘブライ語モーケーシュの訳。人を捕らえる仕掛けを比喩として用い、破滅や神への背信に導くものを表す。
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: 住んではならない
  rationale: ישׁב は「住む、居住する」を表す。この文脈では、土地に継続して居住することを禁じる表現として、明瞭で自然な日本語にした。
- source_word: בְּאַרְצְךָ
  choice: あなたの地に
  rationale: אֶרֶץ の領土的・契約的な含意を保つため、「国」ではなく「地」とした。
- source_word: פֶּן
  choice: …ことのないためである
  rationale: 望ましくない結果を避ける警告の力を表し、前の禁止の目的・理由として自然につないだ。
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: あなたを、わたしに対して罪を犯すように仕向ける
  rationale: חטא のヒフィル形が持つ使役の意味を保ち、לִי は倫理的関係を表す「わたしに対して」と訳した。「仕向ける」は強制と誘惑の両方を断定せず、罪へ導く働きを示す。
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: もしあなたが彼らの神々に仕えるなら
  rationale: עבד は神々を目的語とすると、礼拝と忠誠を含む「仕える」を意味する。条件文として訳したが、כִּי の説明的な読みも脚注に残した。
- source_word: אֱלֹהֵיהֶם
  choice: 彼らの神々
  rationale: 多神教的な崇拝対象を直接示す、平明で原文に近い表現である。
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: それはあなたにとって罠となる
  rationale: מוֹקֵשׁ の罠の比喩を保持した。「それ」は直前の、彼らの神々に仕えることを受ける。原文に独立した強意語がないため、「必ず」は補わなかった。
theological_decisions:
- issue: 警告されている罪の性質
  choice: 他の神々に仕えることによる、神への罪と契約的不忠実を明示する。
  alternative: 異民族との共住による一般的な道徳的堕落への警告と広く解する。
  rationale: 直後の「彼らの神々に仕える」が問題となる罪を具体化している。民族的分離それ自体を目的とする文にはせず、偶像礼拝との明示的な結び付きを保った。
- issue: 二つ目の כִּי の統語的理解
  choice: 「もし…なら」と条件的に訳す。
  alternative: 「あなたは彼らの神々に仕えることになるからだ」と、起こり得る結果を説明する節として読む。
  rationale: 後続の「罠となる」と自然な条件・結果の関係を作る一方、כִּי の説明的用法も可能なので脚注で別解を示し、断定を避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の直接話法にふさわしい簡潔で格調ある文体とした。「わたし」は神の一人称として平仮名表記を用いた。原文の罠の比喩と、כִּי の条件的・説明的な曖昧さを保持した。
