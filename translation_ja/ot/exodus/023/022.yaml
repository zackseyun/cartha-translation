id: EXO.23.22
reference: Exodus 23:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: ja
  text: しかし、もしあなたが確かに彼の声に聞き従い[a]、わたしが語ることをすべて行うなら[b]、わたしはあなたの敵には敵となり、あなたに敵対する者には敵対する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の声を確かに聞くなら」。ヘブライ語では不定詞絶対形を定動詞と重ねて強調している。また、ここで「聞く」には従うことも含まれる。
    reason: lexical_alternative
  - marker: b
    text: 本文は「彼の声」から「わたしが語ること」へと移る。これは、この文脈における使者と主との密接な結びつきを保っている。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: しかし、もし
  rationale: 直前の警告を受ける強い条件的対比を、自然な現代日本語で表す。
- source_word: שָׁמֹעַ תִּשְׁמַע בְּקֹלוֹ
  choice: 確かに彼の声に聞き従い
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「確かに」で示し、שׁמע בְּקוֹל が含む、聞いて従うという意味を「聞き従う」で表した。
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: わたしが語ることをすべて行う
  rationale: 「彼の声」から神の一人称「わたしが語る」への移行をそのまま保ち、行為を求める文意も明確にした。
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: わたしはあなたの敵には敵となり
  rationale: 動詞 איב と名詞 אֹיֵב の語根上の響きと関係的な敵対を、「敵には敵となる」で保持した。
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: あなたに敵対する者には敵対する
  rationale: צרר の動詞と分詞の同根反復を日本語でも「敵対する」の反復で示し、前半との語彙上の違いを残した。
theological_decisions:
- issue: 「彼の声」から「わたしが語る」への指示主体の移行
  choice: 使者を指す三人称と、主の一人称の移行を調和させずに保持する。
  alternative: 両方を使者または主だけの発言として統一する。
  rationale: 原文は文脈上、使者の声と主自身の語りを密接に結びつけながらも、文法上の移行を残しているため、その神学的緊張を解消しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「聞き従う」は聴取と服従の両義を自然に伝える。「敵には敵となり」と「敵対する者には敵対する」により、ヘブライ語の二組の同根語による並行表現を可能な範囲で再現した。
