source:
  edition: WLC
  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: ja
  text: もし、あなたの敵の牛またはろばが迷っているのを見かけたなら、必ずその人のもとに連れ戻しなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: もし〜なら
  rationale: 法規の条件節を導く用法として、現代日本語で自然な「もし〜なら」とした。「〜するとき」も文脈上可能だが、個別事例法の条件構造を明確にした。
- source_word: תִפְגַּע
  choice: 出会った
  rationale: 偶然に遭遇するという פגע の文脈上の意味を、簡潔で自然な日本語で表した。
- source_word: שׁוֹר
  choice: 牛
  rationale: 農耕社会の牛を指す一般的な語であり、日本語では性別や去勢の有無を不必要に限定しない「牛」が明瞭である。
- source_word: אֹיִבְךָ
  choice: あなたの敵の
  rationale: 原文の「敵」を弱めずにそのまま保ち、敵対者にも正しい行いを求める倫理的緊張を維持した。
- source_word: חֲמֹרוֹ
  choice: ろば
  rationale: חֲמוֹר の通常の意味を、現代日本語で明瞭な動物名として表した。所有は前出の「あなたの敵の」が「牛またはろば」の双方にかかる構文で示した。
- source_word: תֹּעֶה
  choice: 迷っている
  rationale: 本来の場所や道からそれている状態を表す分詞を、過度に「失われた」と断定せず自然に表現した。
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: 必ず…連れ戻しなさい
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調と命令の力を「必ず」と命令形で表した。動物を人のもとへ戻すため、「返しなさい」より「連れ戻しなさい」が自然である。
- source_word: לוֹ
  choice: その人のもとに
  rationale: 代名詞が敵である所有者を指すことを明確にしつつ、「持ち主」と言い換えて原文以上に説明的になることを避けた。
theological_decisions:
- issue: 敵に対する倫理的義務
  choice: 「あなたの敵」を明記し、その人の動物を必ず連れ戻す命令として訳す。
  alternative: 「隣人」などの中立的な関係語に弱める。
  rationale: ヘブライ語は明確に「あなたの敵」と述べている。敵対関係にあっても正義と実際的な慈しみを行うよう求める本文の緊張を解消せずに保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法の命令としての簡潔さと品位を保った。「ろば」は一般的な聖書用語として平仮名表記とした。原文上の主要な意味は本文で十分に伝わるため、脚注は設けていない。
