  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: ja
  text: 貧しい者の争いにおいて、その者に対する裁きを曲げてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「貧しい者の訴訟において、その者の正当な権利を損なってはならない。」
    reason: מִשְׁפָּטは「裁き」のほか、この法的文脈では「正当な権利」とも訳せる。רִיבは「争い」のほか「訴訟」とも訳せる。
lexical_decisions:
- source_word: לֹא תַטֶּה
  choice: 曲げてはならない
  rationale: נטהのヒフィル形が司法的文脈で表す「曲げる、ゆがめる」を、禁止法として自然で格調ある日本語にした。
- source_word: מִשְׁפַּט
  choice: 公正な裁き
  rationale: ここでは抽象的な正義だけでなく、訴訟において与えられるべき正当な司法判断を指す。「裁き」に「公正な」を添えて含意を明確にした。
- source_word: אֶבְיֹנְךָ
  choice: 貧しい者
  rationale: אֶבְיוֹןは貧困または困窮状態にある者を指す。ヘブライ語の二人称単数接尾辞は字義的には「あなたの」だが、日本語で「あなたの貧しい者」とすると所有関係を不自然に強調するため、直接の呼びかけを含む法文全体でその関係を保持した。
- source_word: בְּרִיבוֹ
  choice: 争いの当事者であるとき
  rationale: רִיבは争い、係争、訴訟を表しうる。接尾辞を日本語で自然に反映しつつ、司法的場面を明確にした。
theological_decisions:
- issue: 貧しい者への不利な偏りを禁じるのか、貧しい者への一般的配慮を命じるのか
  choice: 係争中の貧しい者に対する公正な裁きをゆがめることの禁止
  alternative: 「貧しい者の正義を拒んではならない」という一般化した表現
  rationale: ヘブライ語ではמִשְׁפַּטが曲げてはならない対象であり、בְּרִיבוֹが法的争いの場面を示す。したがって、一般的な慈善命令ではなく司法上の公正を中心に訳した。
translation_notes:
  register: 現代の一般読者に分かりやすい法文調。「公正な裁き」「曲げてはならない」により原文の司法的焦点と厳粛さを保った。
