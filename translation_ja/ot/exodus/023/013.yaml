  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בְ/כֹ֛ל אֲשֶׁר אָמַ֥רְתִּי אֲלֵי/כֶ֖ם תִּשָּׁמֵ֑רוּ וְ/שֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל פִּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: ja
  text: わたしがあなたがたに告げたすべてのことに、よく注意しなさい。ほかの神々の名を口にしてはならない[a]。その名があなたの口から聞かれることがあってはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ほかの神々の名を呼び求めてはならない」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「それがあなたの口の上で聞かれてはならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: わたしがあなたがたに告げたすべてのことを
  rationale: בְכֹל は命令の及ぶ包括的な範囲を示す。日本語では目的語としてまとめることで自然にしつつ、直前までに告げられた規定全体を指す力を保った。
- source_word: תִּשָּׁמֵרוּ
  choice: 注意深く守りなさい
  rationale: שׁמר のニファル形が持つ「自ら気をつける」という勧告と、告げられた規定を遵守する文脈の双方を表す。単に「注意しなさい」とするより対象との関係が明確である。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ほかの神々
  rationale: イスラエルの神以外の神々を直接指す表現として、存在論的評価を付け加えずに訳した。
- source_word: לֹא תַזְכִּירוּ
  choice: 口にしてはならない
  rationale: זכר のヒフィル形は「言及する」「思い起こさせる」の意を持ち、ここでは名を発声する禁止を自然な現代日本語で表した。「呼び求める」は可能だが意味を祭儀的な行為に狭めるため本文には採らない。
- source_word: לֹא יִשָּׁמַע
  choice: 聞かれることがあってはならない
  rationale: ニファル未完了形の禁止的な力を保ち、直前の「名」を受ける日本語として整えた。
- source_word: עַל פִּיךָ
  choice: あなたの口から
  rationale: 字義的には「あなたの口の上で」。日本語では発話の出所を表す「口から」が自然で、口頭に上るという比喩を保てる。単数形は共同体の各人への呼びかけとして「あなた」とした。
theological_decisions:
- issue: ほかの神々の名に関する禁止の範囲
  choice: 本文では、ほかの神々の名を口にすることへの禁止として訳す。
  alternative: 「ほかの神々の名を呼び求めてはならない」とし、祭儀的な祈願や宣誓に限定する。
  rationale: תַזְכִּירוּ は一般的な「言及する」と、文脈上より限定された「唱える／呼び求める」の両方を許す。原文はここで禁止の範囲を明示的に限定していないため、本文では広い語義を保ち、限定的な可能性を脚注に示した。
- issue: 「ほかの神々」という表現の存在論的含意
  choice: 原文どおり「ほかの神々」とし、その存在または非存在について説明を加えない。
  alternative: 「異教の神々」または「偽りの神々」と訳す。
  rationale: この節はそれらの名を語ることを禁じるが、その存在論的地位をここで定義してはいない。評価語を加えず、本文の神学的緊張を保持した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「御名」など宗派的・礼拝的な含みを強める語は避けた。前半は日本語として自然な目的語構文にし、後半は原文の二重の禁止を二文で保持した。脚注記号 [a] と [b] は該当箇所の本文中に明示した。
