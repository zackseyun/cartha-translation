source:
  edition: WLC
  text: לֹֽא תִזְבַּ֥ח עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹֽא יָלִ֥ין חֵֽלֶב חַגִּ֖/י עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: ja
  text: あなたは、パン種を入れたものと一緒に、わたしのいけにえの血をささげてはならない[a]。また、わたしの祭り[b]の脂肪を朝まで残してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「パン種を入れたものの上に」。ここでは、パン種を入れたものと関連させてささげることを禁じる意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「祭り」は、神聖な祝祭、特に巡礼祭を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: תִזְבַּח
  choice: ささげてはならない
  rationale: זבח のQal未完了形二人称男性単数に否定辞 לֹא が付く法的禁止。日本語では祭儀的な意味が自然に伝わる「ささげてはならない」とした。
- source_word: עַל חָמֵץ
  choice: パン種を入れたものと一緒に
  rationale: עַל は字義的には「〜の上に」だが、ここでは祭儀上の関連・併存を表すと考えられる。「パン種」だけでなく חָמֵץ の発酵したものという意味を明確にした。
- source_word: דַּם זִבְחִי
  choice: わたしへのいけにえの血
  rationale: 一人称単数接尾辞を保持しつつ、日本語で所有関係を神への奉献と誤解なく読める形にした。本文が明記する「血」は省略しない。
- source_word: יָלִין
  choice: 残してはならない
  rationale: לין は「夜を越してとどまる」の意。続く「朝まで」によって時間範囲が明示されるため、冗長な「一晩」を加えず自然な禁止表現とした。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 祭儀でささげる脂肪部分を指すが、原文の語彙を保って「脂肪」とした。
- source_word: חַגִּי
  choice: わたしの祭り
  rationale: חַג は聖なる巡礼祭・祝祭を表す。「宴」より祭儀的意味が明確な「祭り」を採用した。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 標準的な時間表現として簡潔かつ自然に訳した。
theological_decisions:
- issue: 「わたしのいけにえ」「わたしの祭り」の一人称接尾辞
  choice: 前半を「わたしへのいけにえ」、後半を「わたしの祭り」とした
  alternative: 両方を形式的に「わたしのいけにえ」「わたしの祭り」とする
  rationale: 神の一人称発話を保持する。「わたしへの」は זִבְחִי の所属・関係を日本語で自然に示す最小限の明示であり、特定の教派的解釈は加えない。
- issue: עַל חָמֵץ の関係
  choice: パン種を入れたものと一緒に
  alternative: パン種を入れたものの上に
  rationale: 字義的空間関係か祭儀上の併存かに幅があるため、本文では文脈上自然な関連の意味を採り、字義的代案を脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、律法本文にふさわしい簡潔で荘重な文体とした。「いけにえ」「パン種」は聖書的文脈で定着した語として用い、曖昧さが残る前置詞は脚注で示した。
