id: EXO.23.25
reference: Exodus 23:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: ja
  text: あなたがたの神ヤハウェに仕えなさい。そうすれば、ヤハウェはあなたがたのパン[a]と水を祝福し、わたしはあなたがたの中から病[b]を取り除く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「パン」は、食物や日々の糧全般を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「病気」「疾病」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: 仕えなさい
  rationale: עבדはここでは神への礼拝を含む契約上の奉仕を表す。「礼拝しなさい」より意味の幅が広い「仕えなさい」とし、文脈上の命令の力を明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: אֱלֹהֵיכֶם
  choice: あなたがたの神
  rationale: ヤハウェを指す単数の「神」であり、二人称複数接尾辞を「あなたがたの」と表した。
- source_word: וּבֵרַךְ
  choice: ヤハウェは……祝福し
  rationale: 三人称単数の動作主は直前のヤハウェである。日本語で指示対象を明瞭にするため、固有名を補って表した。
- source_word: לַחְמְךָ
  choice: あなたがたのパン
  rationale: 基本義である「パン」を保持した。文脈によって食物一般を表し得ることは脚注で示した。単数接尾辞はイスラエル共同体への集合的呼びかけとして訳した。
- source_word: מֵימֶיךָ
  choice: 水
  rationale: מיםは形態上複数だが、水を集合的・物質的に指すため、日本語では自然な単数表現「水」とした。
- source_word: וַהֲסִרֹתִי
  choice: わたしは……取り除く
  rationale: 使役語幹の「除く、取り去る」という意味を直接表した。原文が三人称「ヤハウェは」から一人称「わたしは」へ移る点も保持した。
- source_word: מַחֲלָה
  choice: 病
  rationale: 病気・疾病を広く表す語として、簡潔で自然かつ荘重な「病」を選んだ。
- source_word: מִקִּרְבֶּךָ
  choice: あなたがたの中から
  rationale: 共同体のただ中から病を除くという集合的な意味を保ち、身体内部だけに限定される表現を避けた。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号へ置換せず、契約の神の名として音写した。
- issue: 二人称の数の移行
  choice: 全体を共同体への呼びかけとして「あなたがた」で表す
  alternative: 後半を字面どおり単数の「あなた」とする
  rationale: 冒頭の動詞は二人称男性複数だが、後続の所有接尾辞は単数である。これはイスラエルを一つの共同体として扱う集合的呼びかけと理解でき、日本語では不自然な数の揺れを作らず「あなたがた」で統一した。
- issue: 三人称から一人称への主語の移行
  choice: 「ヤハウェは……わたしは」と保持する
  alternative: 両方を「ヤハウェは」に統一する
  rationale: 原文は祝福について三人称を用い、病を除く約束では神の一人称に移る。この語りの移行を調整せず残した。
translation_notes:
  register: 現代の一般読者に明瞭な標準日本語を用いつつ、命令と約束の荘重さを保った。「そうすれば」で命令に続く祝福の帰結を自然に示し、原文の主語の移行は明示的に保存した。
