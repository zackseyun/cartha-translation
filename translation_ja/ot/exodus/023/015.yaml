id: EXO.23.15
reference: Exodus 23:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: ja
  text: 種なしパンの祭りを守りなさい。七日間、わたしがあなたに命じたとおり、アビブの月の定められた時に種なしパンを食べなさい。その月に、あなたはエジプトから出たからである。だれも手ぶらでわたしの前に出てはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、ここで二人称単数への語りかけから三人称複数の動詞に移り、直訳すると「彼らは手ぶらでわたしの前に出てはならない」となる。
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: 「種なしパンの祭り」
  rationale: חַגの祭儀的な「祭り」と、מַצּוֹתの具体的な意味「種なしパン」を、現代日本語で明瞭に表した。
- source_word: תִּשְׁמֹר
  choice: 守りなさい
  rationale: 祭儀・律法の文脈におけるשׁמרの「遵守する」という命令の力を保ちつつ、平明な表現とした。
- source_word: תֹּאכַל מַצּוֹת
  choice: 種なしパンを食べなさい
  rationale: מַצּוֹתを説明的に言い換えすぎず、食品として自然な日本語で表した。
- source_word: לְמוֹעֵד
  choice: 定められた時に
  rationale: מוֹעֵדがここでは祭りのために定められた暦上の時を指すため、その固定性を表した。
- source_word: חֹדֶשׁ הָאָבִיב
  choice: アビブの月
  rationale: אָבִיבはここで暦上の名称として機能するため、語義による意訳ではなく音写した。
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: その月に、あなたはエジプトから出たからである
  rationale: בוֹの指示対象を直前の「月」と自然に示し、出エジプトの出来事との因果関係を保った。
- source_word: וְלֹא יֵרָאוּ פָנַי
  choice: だれも……わたしの前に出てはならない
  rationale: 直訳的な「わたしの顔の前に現れる」ではなく、神の前に出ることを表すヘブライ語の慣用句として訳した。三人称複数形の不特定な意味は「だれも」で自然に表した。
- source_word: רֵיקָם
  choice: 手ぶらで
  rationale: 「空のまま」、すなわち献げ物を持たずに来るという含意を、具体的な献げ物の種類まで限定せずに表した。
theological_decisions:
- issue: 神の「顔」の前に現れるという表現
  choice: わたしの前に出る
  alternative: わたしの顔の前に現れる
  rationale: פָנַיは字義的には「わたしの顔」だが、ここでは神の臨在の前に出ることを表す慣用句である。自然な日本語を用い、神への直接的な謁見という意味を保持した。
- issue: 最終節の人称の変化
  choice: だれも……出てはならない
  alternative: 彼らは……出てはならない
  rationale: 本文は二人称単数の命令から三人称複数の動詞へ移る。この変化を注で明示しつつ、本文では不特定多数への禁止として自然な日本語にした。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調ある律法文の調子を採用した。「祭り」「守りなさい」「定められた時」など、礼拝規定としての性格が伝わる語を用いた。
