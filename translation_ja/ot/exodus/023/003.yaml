  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: ja
  text: また、貧しい人だからといって、その人の訴訟でえこひいきしてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「貧しい人を、その人の訴訟において重んじてはならない」。ヘブライ語の動詞は字義的には「重んじる、敬う」を意味し得るが、ここでは司法上のえこひいきを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָל
  choice: 貧しい人
  rationale: 社会的・経済的に弱い立場にある人を指す男性単数形。現代日本語では性別を不必要に強調せず、「貧しい人」とするのが自然である。
- source_word: תֶהְדַּר
  choice: えこひいきする
  rationale: 字義的には「重んじる、敬う」だが、司法の文脈では不当に優遇することを意味する。「えこひいきする」は禁止される偏った扱いを明確に伝える。
- source_word: בְּרִיבוֹ
  choice: その訴訟で
  rationale: רִיבは争い、訴え、法的事件を表し、三人称男性単数接尾辞を「その」に反映した。周囲の司法規定に即して「訴訟」とした。
- source_word: וְ
  choice: また
  rationale: 前後の規定を結ぶ単純な接続を、自然な日本語で示す。
- source_word: לֹא
  choice: してはならない
  rationale: 法規における明確な禁止として、現代日本語の格調ある定型表現を用いた。
theological_decisions:
- issue: 貧しい人への配慮と司法上のえこひいきの区別
  choice: 貧しい人であることを理由に、その訴訟で有利に扱うことを禁じる。
  alternative: 貧しい人を一般に尊重してはならない、または尊重せよという意味に取る。
  rationale: 「その訴訟で」という限定と司法規定の文脈から、公正な裁きを求める命令である。貧しい人への一般的な慈しみを否定する意味は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法規としての厳粛さを保った。「貧しい人だからといって」により、貧困を理由とする偏りが禁じられていることを自然に示した。
