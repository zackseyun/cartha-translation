  to: また、あなたが畑にまくものから得る、あなたの働きの実りの初物に当たる刈り入れの祭り[a]を守りなさい。さらに、年の終わり[b]、畑からあなたの働きの実りを取り入れる時には、取り入れの祭り[c]を守りなさい。
