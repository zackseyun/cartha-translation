source:
  edition: WLC
  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: ja
  text: また、あなたが畑にまくものから得る、あなたの働きの実りの初物に当たる刈り入れの祭り[a]を守りなさい。さらに、年の終わり[b]、畑からあなたの働きの実りを取り入れる時には、取り入れの祭り[c]を守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祭り」は「祝祭」とも訳せる。以下の「取り入れの祭り」も同じ。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語を直訳すると「年が出て行く時」。
    reason: lexical_alternative
  - marker: c
    text: 「取り入れ」は、畑の産物を集め入れることを指し、この祭りはその時期を祝うものである。
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: 祭り
  rationale: 祝祭として定められた宗教的行事を、現代日本語で自然かつ荘重に表す。「祝祭」も可能だが、本文では名称として分かりやすい「祭り」とした。
- source_word: הַקָּצִיר
  choice: 刈り入れ
  rationale: 穀物を刈り取る収穫作業を指すため、祭りの名称として農作業の具体性を保つ「刈り入れ」とした。
- source_word: בִּכּוּרֵי
  choice: 初物
  rationale: 収穫の最初の産物という意味を簡潔に表し、神にささげるものとしての祭儀的含意も保てる語を選んだ。
- source_word: מַעֲשֶׂיךָ
  choice: あなたの働きの実り
  rationale: 字義は「あなたの業・働き」だが、ここでは農作業によって得られた産物を指す。「働き」を残しつつ農業的結果が伝わるよう「働きの実り」とし、二つの出現箇所で統一した。
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: あなたが畑に種をまいて得た
  rationale: 畑にまいたものから初物が得られる関係を、直接の二人称を保ちながら自然な日本語で示した。
- source_word: הָאָסִף
  choice: 取り入れ
  rationale: 畑の産物を集めて収蔵することを指す祭名として、平明で農業的意味の明確な「取り入れ」を採用した。
- source_word: בְּצֵאת הַשָּׁנָה
  choice: 年の終わり
  rationale: 字義は「年が出て行く時」だが、時間表現として自然な「年の終わり」とした。直訳は脚注に示した。
- source_word: בְּאָסְפְּךָ
  choice: あなたが……取り入れる
  rationale: 前置詞付き不定詞を時を表す節として読み、農産物を集める動作が自然に伝わる形にした。
- source_word: מִן הַשָּׂדֶה
  choice: 畑から
  rationale: 産物が集められる場所的起点を簡潔に訳した。
theological_decisions:
- issue: 原文が前節から続く並列的な祭りの規定で、当該節には独立した命令動詞が明示されていないこと
  choice: 日本語では祭りの遵守を「祝う」と補って文を成立させた
  alternative: 名詞句のまま「また、刈り入れの祭り……、また、取り入れの祭り……」とする
  rationale: 前節から続く規定の力を明確にしつつ、特定の祭儀内容や教派的解釈は加えない。「守る」よりも חַג の祝祭性が伝わる「祝う」を用いた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭りの名称は「刈り入れの祭り」「取り入れの祭り」と平行させた。農業的背景を保ちながら、「働きの実り」によって מַעֲשֶׂיךָ の人間の労働とその産物という両面を表した。
