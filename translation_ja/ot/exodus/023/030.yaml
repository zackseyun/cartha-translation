base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: ja
  text: あなたが増え、この土地を受け継ぐまで、わたしは少しずつ彼ら[a]をあなたの前から追い払う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「彼」を意味する男性単数形。土地の住民または諸民族を集合的に指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: 少しずつ
  rationale: 「少し」を反復して段階的な進行を表すヘブライ語の慣用表現を、自然な現代日本語で再現した。
- source_word: אֲגָרְשֶׁנּוּ
  choice: わたしは彼らを……追い払う
  rationale: גרשׁ は「追い払う、追放する」の意。目的語接尾辞は文法上は男性単数だが、文脈上は土地の住民を集合的に指すため、本文では自然な日本語の複数形とし、原文の単数形は脚注に示した。
- source_word: מִפָּנֶיךָ
  choice: あなたの前から
  rationale: 「顔、面前」を用いる原文の表現を保ちつつ、日本語として理解できる形にした。
- source_word: עַד אֲשֶׁר
  choice: ……まで
  rationale: 徐々に追い払う行為が続く終点を示す表現として訳した。
- source_word: תִּפְרֶה
  choice: あなたが増え広がり
  rationale: פרה は「実を結ぶ、増える」を意味し、ここでは民の数が土地を占有できるほど増加することを表す。「実を結ぶ」より文脈に即して明瞭な表現を選んだ。
- source_word: וְנָחַלְתָּ
  choice: この地を所有する
  rationale: נחל は「受け継ぐ、相続する、所有する」の意味領域を持つ。ここでは土地を実際に取得して占有する文脈に合わせて「所有する」とし、「受け継ぐ」の可能性を脚注に残した。
- source_word: אֶת הָאָרֶץ
  choice: この地
  rationale: 文脈で示されている約束の土地を指すため、日本語では指示性を明らかにして「この地」とした。
theological_decisions:
- issue: 追い払われる者を指す目的語接尾辞の集合的単数
  choice: 本文では文脈上の複数の住民を指す「彼ら」とし、原文が単数形であることを脚注に明記する。
  alternative: 原文の文法的単数をそのまま「彼」と訳す。
  rationale: ヘブライ語の形態は男性単数だが、周辺文脈では土地の諸民族ないし住民を集合的に指す。日本語本文の不自然さを避けながら、原文の数の曖昧さを脚注で保持した。
- issue: נחל の相続と占有の意味合い
  choice: 本文では「所有する」と訳す。
  alternative: 「受け継ぐ」と訳す。
  rationale: 土地取得の具体的文脈では「所有する」が明瞭だが、神から賜る嗣業という含意を持ちうるため、別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」は神の発話として平仮名表記とし、「少しずつ」で原文の反復表現を自然に伝えた。
