  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: ja
  text: 偽りのうわさを言い広めてはならない。[a] 悪しき者に手を貸し、不正な証人となってはならない。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「偽りのうわさを運んではならない」とも訳せる。原語の動詞は字義どおりには「持ち上げる、運ぶ」で、ここではうわさを流布することを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「悪しき者と手を組み、害をもたらす証人となってはならない」とも訳せる。原文は字義的には「悪しき者と共に手を置く」であり、「不正な」と訳した語は「暴力、害悪」をも意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: 言い広める
  rationale: נשא は本来「持ち上げる、運ぶ」だが、שֵׁמַע（聞いたこと、うわさ）を目的語とするここでは、報告やうわさを受け売りして流布する意味と理解できる。現代日本語では「言い広める」が自然である。
- source_word: שֵׁמַע שָׁוְא
  choice: 偽りのうわさ
  rationale: שֵׁמַע は「聞いたこと、知らせ、うわさ」、שָׁוְא は「虚偽、むなしさ、不正」を表す。ここでは根拠のない、または偽りの情報を指すため「偽りのうわさ」とした。
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: 手を貸す
  rationale: 字義は「あなたの手を～と共に置く」。悪しき者に加担・協力することを表す慣用句として、手の比喩を保ちつつ自然な「手を貸す」とした。
- source_word: רָשָׁע
  choice: 悪しき者
  rationale: 法的・道徳的文脈で「悪い者、罪ある者」を意味する。男性単数形だが、この一般的な法規では日本語の「者」が原文の単数性を保ちつつ性別を不必要に限定しない。
- source_word: לִהְיוֹת עֵד חָמָס
  choice: 不正な証人となる
  rationale: עֵד は「証人」、חָמָס は「暴力、害悪、不正」を意味する。裁判の文脈では正義を損なう証言者を指すため、「暴力的な証人」という不自然で狭い表現を避け、「不正な証人」とした。
- source_word: לֹא / אַל
  choice: ～てはならない
  rationale: いずれもここでは禁止を表す。法文としての厳粛さと現代日本語の明瞭さを両立する「～てはならない」で統一した。
theological_decisions:
- issue: עֵד חָמָס の解釈
  choice: 不正な証人
  alternative: 暴力を振るう証人／悪意ある証人／偽証人
  rationale: חָמָס の「暴力・害悪」の強さを背景に残しつつ、証言と司法の文脈で最も自然な「不正」を採用した。「偽証人」だけに限定すると、原語が含み得る悪意や司法上の害を狭めるため避けた。
- issue: 男性単数形の表現
  choice: 「悪しき者」とし、一般法規として表現する
  alternative: 「悪い男」として文法上の男性形を明示する
  rationale: ヘブライ語の男性単数形はこの法規の代表的な当事者を示す。日本語では文法的性がなく、「者」が単数の人物を自然に表し、規定の適用範囲を男性だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語による法的・訓戒的文体。「偽りのうわさ」「手を貸す」で具体的な像と自然さを両立し、二つの禁止を「～てはならない」で整えた。
