base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: ja
  text: 見よ、わたしはあなたの前に御使い[a]を遣わす。あなたを道中で守り、わたしが備えた場所へあなたを連れて行くためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「使者」。ヘブライ語 מַלְאָךְ は、人間の使者にも天使にもなり得る。ここでは文脈上、「御使い」が最も適切である。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 見よ
  rationale: 神の発言における厳かな注意喚起と指示的な力を保つ。現代日本語ではやや格調があるが、聖書本文として明瞭である。
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: わたしは…遣わす
  rationale: 独立代名詞による主語の明示と、分詞が示す切迫した行為を自然な日本語で表す。「わたし自身が」とすると強調しすぎるため避けた。
- source_word: מַלְאָךְ
  choice: 一人の御使い
  rationale: 語自体は人間の使者にも天的な使者にもなり得るが、イスラエルに先立って守り導く文脈では天的な使者が最も自然である。語義上の別案は脚注に残した。
- source_word: לְפָנֶיךָ
  choice: あなたの前に
  rationale: 先行するという意味を保ちつつ、原文の空間的表現に対応する自然な訳。
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: 道中あなたを守り
  rationale: שׁמר の保護する意味と、בדרך の旅路を表す慣用的意味を簡潔に伝える。
- source_word: וְלַהֲבִיאֲךָ
  choice: あなたを導き入れる
  rationale: בוא のヒフィル形は「来させる、連れて行く」を意味する。目的地への到着までを含む使役的な意味を自然な日本語で表した。
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: わたしが備えた場所
  rationale: כון のヒフィル形を、神が目的地をあらかじめ用意したという文脈に即して「備えた」とした。完了の意味は日本語の過去形で自然に表した。
theological_decisions:
- issue: מַלְאָךְ の存在の身分と正体
  choice: 本文では「御使い」と訳し、それが被造された天使なのか、主の特別な現れなのかは特定しない。
  alternative: 「使者」と訳す、または「主の御使い」として独自の神的身分を明示する。
  rationale: この節はその存在を מַלְאָךְ とだけ呼ぶ。後続文脈はその身分について神学的な緊張を生むため、本文で解釈を確定せず、原文の余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の直接話法にふさわしい簡潔で格調ある文体とした。「見よ」「御使い」は聖書的な荘重さを保つが、一般読者にも理解可能な語である。
