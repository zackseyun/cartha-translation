  text: שָׁלֹ֣שׁ רְגָלִ֔ים תָּחֹ֥ג לִ֖/י בַּ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/014.yaml
  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: ja
  text: 年に三度、あなたはわたしのために祭りを祝わなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「三つの足」。これは、一年に三回行われる巡礼祭を指すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: 年に三度
  rationale: 字義的には「三つの足」だが、ここでは年ごとの三回の巡礼祭を指すヘブライ語の慣用表現。本文では自然な日本語で回数を示し、原語の表現と巡礼祭の含意は脚注に残した。
- source_word: תָּחֹג
  choice: 祭りを祝わなければならない
  rationale: חגג は宗教的な祭りを執り行い祝うことを表す。法文としての命令の力を保ちつつ、現代日本語として明瞭にした。
- source_word: לִי
  choice: わたしのために
  rationale: 前置詞 ל は祭りが神に向けて行われることを示す。「わたしのために」は自然な日本語で、その方向性を保つ。
- source_word: בַּשָּׁנָה
  choice: 年に
  rationale: 字義は「その年に／年のうちに」。שָׁלֹשׁ רְגָלִים と合わせ、日本語では「年に三度」と簡潔に訳した。
