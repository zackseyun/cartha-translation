id: EXO.23.24
reference: Exodus 23:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: ja
  text: あなたは彼らの神々にひれ伏してはならない。それらに仕えてはならず、彼らの行いにならってはならない。むしろ、それらを必ず打ち倒し、彼らの石柱[a]をことごとく打ち砕かなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「石柱」は、礼拝に用いられた立石、または祭儀的な石の記念物を指す。
    reason: מַצֵּבָה の形状と祭儀的用法を補足し、「柱」だけでは伝わりにくい文化的背景を示すため。
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: ひれ伏す
  rationale: 身体を低くして敬意や崇敬を表す具体的な動作を保ち、広い意味の「礼拝する」へ一語でまとめないため。
- source_word: לֵאלֹהֵיהֶם
  choice: 彼らの神々に
  rationale: 前置詞 ל を「ひれ伏す」の相手として自然に表し、諸民族の神々を指す複数形を維持した。
- source_word: תָעָבְדֵם
  choice: それらに仕える
  rationale: עבד の基本的な「仕える」を保ちつつ、文脈上の祭儀的奉仕を含ませた。「ひれ伏す」と同じ語に統合せず、二つの禁止を区別した。
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: 彼らの行いにならう
  rationale: 直訳的な「彼らの行いのように行う」を、意味を狭めすぎず自然な現代日本語にした。文脈上は諸民族の宗教的慣行を含む。
- source_word: כִּי
  choice: むしろ
  rationale: ここでは理由よりも、先行する禁止と後続する命令との強い対照を示す用法と判断した。
- source_word: הָרֵס תְּהָרְסֵם
  choice: それらを必ず打ち倒す
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「必ず」で表した。目的語の代名詞は形式上「神々」を受け得るため「それら」として表現を保ち、具体的な破壊対象が祭儀物であることを訳文で過度に補わなかった。
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: ことごとく打ち砕く
  rationale: 反復構文の強い命令を「ことごとく」で表し、石造の対象に適した「打ち砕く」を用いた。
- source_word: מַצֵּבֹתֵיהֶם
  choice: 彼らの石柱
  rationale: מַצֵּבָה は立てられた石または柱、とりわけ祭儀に関係する石造記念物を指す。「石柱」で形状を明示し、祭儀的含意は脚注に示した。
theological_decisions:
- issue: 異国の神々に対して禁じられる行為
  choice: 「ひれ伏す」と「仕える」を別々に訳す。
  alternative: 両方を「礼拝する」などの礼拝用語にまとめる。
  rationale: ヘブライ語は身体的な崇敬行為と継続的な奉仕を表す異なる二動詞を用いているため、その修辞的・神学的な広がりを保った。
- issue: 破壊命令の目的語
  choice: 代名詞を「それら」とし、文法上のつながりと文脈上の祭儀物への指示の緊張を残す。
  alternative: 「偶像」または「祭儀物」と明示して曖昧さを解消する。
  rationale: 接尾代名詞は直前の「神々」を受け得る一方、破壊動詞と後続の「石柱」は具体的な祭儀物を示唆する。訳文で一方だけに確定しなかった。
- issue: 命令の強調
  choice: 「必ず」「ことごとく」によって二つの強意構文を表す。
  alternative: 通常の命令として「打ち倒し、打ち砕け」とする。
  rationale: 原文の不定詞絶対形を伴う反復的な強調を日本語でも認識できる形で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、禁止と破壊命令の厳粛さを保った。「してはいけない」より格調のある「してはならない」を採用し、強意表現は過度に古風にならない語で示した。
