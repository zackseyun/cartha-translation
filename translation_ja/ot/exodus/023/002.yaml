source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: ja
  text: 悪を行うために、多数に従ってはならない。また、係争に関して、多数に従って裁きを曲げるような証言をしてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、係争に関して、多数に従って偏り、裁きを曲げるような答えをしてはならない。」
    reason: תַעֲנֶה は「証言する」のほか「答える」とも訳せ、נטה の反復は「偏る」「曲げる」と表すこともできるため。
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: 多数の者に従う
  rationale: היה אחרי は慣用的に「後について行く、従う」を表す。רַבִּים は「多数の者」を指し、集団の圧力に流されることへの警告を自然な日本語で保った。
- source_word: לְרָעֹת
  choice: 悪を行うために
  rationale: 前置詞 לְ を伴う形が目的・結果を示すため、強い倫理的意味を保って訳した。
- source_word: תַעֲנֶה
  choice: 証言をする
  rationale: רִיב と結びつく法的文脈では、単に「答える」よりも、証人として発言する意味が適切である。
- source_word: עַל רִיב
  choice: 争いにおいて
  rationale: רִיב は争い、訴訟、係争中の事件を表し得る。「争い」は語義の幅を保ちつつ、文脈上の司法的性格も伝える。
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: 多数の者に追随して
  rationale: נטה の「傾く、逸れる」という含みと、אַחֲרֵי רַבִּים の反復を、日本語として自然な「追随して」で表した。
- source_word: לְהַטֹּת
  choice: 正義を曲げる
  rationale: 法的文脈における נטה の使役形は、裁判や正義を歪めることを表す。目的語は原文では明示されないが、文脈から「正義」を補った。
theological_decisions:
- issue: 末尾の使役形 לְהַטֹּת の法的対象
  choice: 「正義を曲げる」として、文脈上暗示される対象を補う
  alternative: 「裁きを曲げる」または目的語を補わず「曲げる」
  rationale: 原文は簡潔で対象を明示しないが、争いにおける証言という直前の法的文脈から、司法上の公正を歪める意味である。「正義」は特定の教派的解釈を持ち込まず、倫理的・司法的力を明確にする。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で威厳ある禁止命令とした。「群衆」や「多数派」より原文に近い「多数の者」を用い、同語句の反復も保った。
