base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: ja
  text: しかし、七年目には、その土地を休ませ、手をつけずにおきなさい[a]。そうすれば、あなたの民の貧しい人々がそこから食べ、その食べ残したものを野の動物も食べる[b]。あなたのぶどう畑とオリーブ畑にも、同じようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その土地を解放し、放置しなさい」。ヘブライ語の二つの動詞は、七年目には通常の耕作をやめ、土地をそのままにしておくことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 直訳「野の生き物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: しかし、七年目には
  rationale: 前節の六年間との対比を自然な日本語で示し、安息年を指す時間表現として訳した。
- source_word: תִּשְׁמְטֶנָּה
  choice: その土地を休ませ
  rationale: 女性単数接尾辞が前節の土地を受けることを明示し、耕作をやめて土地を解放する農業上の意味を平明に表した。
- source_word: וּנְטַשְׁתָּהּ
  choice: 手をつけずにおきなさい
  rationale: 通常の耕作や収穫をせず放置する趣旨を表しつつ、永久に見捨てるという過度な含意を避けた。
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: あなたの民の貧しい人々
  rationale: אביוןの貧困・困窮の意味と、עםに付く所有関係を明確に保った。
- source_word: וְיִתְרָם
  choice: その食べ残したもの
  rationale: 三人称男性複数接尾辞を貧しい人々に結びつけ、彼らが食べた後に残るものという文脈上の意味を自然に示した。
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: 野の動物が食べることができる
  rationale: חית השדהを現代日本語の定型的な表現で訳し、文脈上の許容・結果の意味合いを示した。
- source_word: כֵּן תַּעֲשֶׂה
  choice: 同じようにしなさい
  rationale: 先の規定を後続の作物にも適用する法的命令を、簡潔で自然な日本語にした。
- source_word: לְכַרְמְךָ
  choice: あなたのぶどう畑にも
  rationale: 同じ規定が適用される対象として、לְの関係を助詞「にも」で自然に示した。
- source_word: לְזֵיתֶךָ
  choice: オリーブ畑
  rationale: 単数集合名詞としてのזיתを、ぶどう畑と並行する栽培地として自然に表した。
