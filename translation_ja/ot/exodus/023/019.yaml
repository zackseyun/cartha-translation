  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: ja
  text: あなたの土地の初物の中から最初の分を[a]、あなたの神、ヤハウェの家へ持って来なければならない。子やぎ[b]をその母の乳で煮てはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの土地の初物を」または「あなたの土地の最上の初物を」。ヘブライ語は直訳すると「初物の最初（の分）」となる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語 גְּדִי は通常「子やぎ」を指すが、文脈によっては若い家畜を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי אַדְמָתְךָ
  choice: あなたの土地の初物のうち、最初のもの
  rationale: רֵאשִׁית と בִּכּוּרֵי の重なりを消さず、最初に実った産物の最初の分という具体的な意味を保った。「最上のもの」と断定せず、語句の含みを脚注に残した。אַדְמָה はここでは耕作地とその産物を指すため、自然な日本語の「土地」とした。
- source_word: תָּבִיא
  choice: 携えて来なければならない
  rationale: 法的命令としての未完了形の指示力を、明瞭な現代日本語で表した。供え物を所定の場所へ持参する文脈なので「携えて来る」とした。
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: あなたの神ヤハウェの家
  rationale: בַּיִת を後代の固定的な神殿建築に限定せず、「家」と訳した。神名 יְהוָה は固有名として「ヤハウェ」とした。
- source_word: גְּדִי
  choice: 子やぎ
  rationale: 通常の意味である若いやぎを、現代日本語で明確に表した。語が文脈によって若い家畜を指し得る点は脚注に示した。
- source_word: לֹא תְבַשֵּׁל ... בַּחֲלֵב אִמּוֹ
  choice: その母の乳で煮てはならない
  rationale: בשל の具体的な調理法を「煮る」と訳し、前置詞句の像をそのまま保った。「乳」は母乳そのものを指し、この規定の簡潔な表現に適する。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文に記された契約の固有名を、一般的な学術的再建に基づく日本語表記で示した。
- issue: 子やぎを母の乳で煮ることへの禁止の解釈
  choice: 禁止を字義どおり訳し、その理由を本文に補わない
  alternative: カナンの祭儀、動物への配慮、または食物規定に関する説明を訳文へ加える
  rationale: 原文は禁令の理由を説明していないため、特定の歴史的・神学的解釈で曖昧さを解消しなかった。
- issue: רֵאשִׁית בִּכּוּרֵי の関係
  choice: 「初物のうち、最初のもの」として語の重なりを保持する
  alternative: 「初物」または「最上の初物」と簡略化する
  rationale: 「最初」と「初物」の重なりは原文に実在する。「最上」とする理解もあり得るが、本文だけでは断定せず脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法の命令は「なければならない」「てはならない」で明確にしつつ、古風な文語表現は避けた。原文の簡潔さと、禁令の理由が明示されない緊張を保持した。
