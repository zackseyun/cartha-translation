base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: ja
  text: 寄留者[a]を虐げてはならない。あなたがた自身も、寄留者の思い[b]を知っている。あなたがたもエジプトの地で寄留者だったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「在留異国人」「外国人」「よそ者」とも訳せる。ヘブライ語「ゲール」は、ある民の中に住む、その地の出身ではない者を指し、しばしば社会的に弱い立場に置かれた。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「寄留者のネフェシュを知っている」。「ネフェシュ」は人の生や内面を指す語で、ここでは寄留者の思いと、その置かれた境遇を実感として知ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: 寄留者
  rationale: 一時的な旅人ではなく、他民族の中に住み、社会的に弱い立場に置かれやすい非在来者を指す。聖書の法的・社会的区分を比較的簡潔に保てる。
- source_word: תִלְחָץ
  choice: 虐げてはならない
  rationale: この法的文脈では、圧迫、搾取、抑圧を加えることを意味するため、命令の社会倫理的な強さを保つ「虐げる」とした。
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: あなたがた自身、…知っている
  rationale: 独立代名詞による強調と、エジプトでの体験に基づく実感を表す。
- source_word: נֶפֶשׁ הַגֵּר
  choice: 寄留者の心境
  rationale: 直訳的な「寄留者のネフェシュ」は、その内面や身にしみた境遇を指す慣用的表現。「心境」は日本語として自然で、内的経験への理解を示す。
- source_word: כִּי
  choice: …からである
  rationale: 命令と共感的理解の根拠を示す因果関係を明確にする。
- source_word: גֵרִים הֱיִיתֶם
  choice: 寄留者だった
  rationale: 前半と同じ訳語を用い、イスラエル自身の過去を倫理的根拠とする修辞的対応を保持する。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地で
  rationale: 「地」を明示するヘブライ語の表現を保ちつつ、自然な日本語とした。
theological_decisions:
- issue: 契約法における גֵר の訳し方
  choice: 寄留者
  alternative: 在留異国人／外国人／よそ者
  rationale: 民族的な外国人一般や通過中の旅人ではなく、他の民の中に居住する社会的・法的立場を表す。イスラエルがエジプトで同じ立場にあったという本節の対応関係も保てる。
- issue: נֶפֶשׁ を含む慣用表現
  choice: 寄留者の心境
  alternative: 寄留者の魂／寄留者として生きることがどのようなものか
  rationale: 「魂」として人間を二分する含意を持ち込まず、寄留者の内面と実際の境遇を体験的に知るという幅を自然な日本語で示す。脚注で原文の字義と意味領域を明記する。
translation_notes:
  register: 現代標準日本語による、簡潔で威厳のある法文調。「〜してはならない」で禁止命令を明確にし、後半は「〜からである」で理由を端的に示した。
