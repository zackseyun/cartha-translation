  text: וְ/שָׁלַחְתִּ֥י אֶת הַ/צִּרְעָ֖ה לְ/פָנֶ֑י/ךָ וְ/גֵרְשָׁ֗ה אֶת הַ/חִוִּ֧י אֶת הַֽ/כְּנַעֲנִ֛י וְ/אֶת הַ/חִתִּ֖י מִ/לְּ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: ja
  text: わたしはあなたに先立って、すずめばち[a]を遣わす。それは、ヒビ人、カナン人、ヒッタイト人をあなたの前から追い払う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、イスラエルに先立って送られる恐怖や、神が加える何らかの圧力を比喩的に表している可能性もある。ヘブライ語は通常「すずめばち」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: わたしは……遣わす
  rationale: 接続詞を伴う完了形一人称単数は、文脈上、神による将来の約束を表す。日本語では簡潔な非過去形で確実な約束を自然に示した。
- source_word: הַצִּרְעָה
  choice: すずめばち
  rationale: この語は通常、すずめばち類の刺す昆虫を指す。定冠詞付き単数形の代表的・集合的な含みは日本語でも「すずめばち」で保てる。比喩的解釈は本文に入れず脚注に示した。
- source_word: לְפָנֶיךָ
  choice: あなたに先立って
  rationale: 字義は「あなたの前に」だが、ここではイスラエルより先に遣わされることを表すため、自然で明確な表現とした。
- source_word: וְגֵרְשָׁה
  choice: それは……追い払う
  rationale: גרשׁの意味「追い出す、追い払う」を保持した。女性単数形の主語が「すずめばち」であることを明確にするため「それは」を補った。
- source_word: הַחִוִּי
  choice: ヒビ人
  rationale: 民族名として、日本語聖書で広く認識される音写を用いた。
- source_word: הַכְּנַעֲנִי
  choice: カナン人
  rationale: 民族名として定着した日本語表記を用いた。
- source_word: הַחִתִּי
  choice: ヒッタイト人
  rationale: 民族名として明瞭で一般的な日本語表記を用いた。
- source_word: מִלְּפָנֶיךָ
  choice: あなたの前から
  rationale: 直前の空間表現との対応を保ちつつ、彼らが進路または目前から除かれる意味を自然な日本語で表した。
theological_decisions:
- issue: הַצִּרְעָהを文字どおりに訳すか、比喩として解釈するか
  choice: 本文では「すずめばち」と訳す
  alternative: 「恐怖」「パニック」、または神が加える別の圧力の比喩と解する
  rationale: ヘブライ語の通常の語義は刺す昆虫であり、本文だけでは比喩と断定できない。原文の具体的表現を保持し、比喩的理解の可能性は脚注で示すことで曖昧さを保った。
translation_notes:
  register: 明瞭で現代的ながら、神の宣言にふさわしい簡潔で dignified な文体とした。「あなたに先立って」と「あなたの前から」を使い分け、原文の二つの לְפָנֶיךָ 系表現の機能差を自然な日本語で示した。
