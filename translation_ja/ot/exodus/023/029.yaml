  text: לֹ֧א אֲגָרְשֶׁ֛/נּוּ מִ/פָּנֶ֖י/ךָ בְּ/שָׁנָ֣ה אֶחָ֑ת פֶּן תִּהְיֶ֤ה הָ/אָ֨רֶץ֙ שְׁמָמָ֔ה וְ/רַבָּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: ja
  text: わたしは一年のうちに彼らをあなたの前から追い払うことはしない。[a] 土地が荒れ果て、野の獣[b]が増えてあなたを脅かすことがないように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら」に当たるヘブライ語の接尾辞は単数形で、直訳すれば「彼を」となる。ここでは住民または敵を集合的に指していると考えられる。
    reason: lexical_alternative
  - marker: b
    text: または「野生の動物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: 彼らを……追い払う
  rationale: גרשは「追い払う、追放する」の意。目的語接尾辞は文法上単数だが、文脈上は先に述べられた住民を集合的に指すため、日本語では自然で明確な複数表現とした。単数形については脚注で示す。
- source_word: מִפָּנֶיךָ
  choice: あなたの前から
  rationale: 空間的・対峙的な意味を保ちつつ、日本語として理解できる直訳的表現。
- source_word: בְּשָׁנָה אֶחָת
  choice: 一年で
  rationale: 「一年の間に、一年以内に」という時間幅を簡潔な現代日本語で表す。
- source_word: פֶּן
  choice: ……ことのないため
  rationale: 望ましくない結果を避ける目的・懸念を示す接続辞の働きを保持した。
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: この地が荒れ果て
  rationale: שְׁמָמָהの荒廃・無人化の含意を、自然で格調ある表現で示す。定冠詞付きの「地」は文脈上の約束の地を指すため「この地」とした。
- source_word: וְרַבָּה עָלֶיךָ
  choice: 増えて、あなたを脅かす
  rationale: רבהの「増える」と、עליךがこの文脈で示す不利・脅威の関係を明確にしつつ、具体的な襲撃などを過度に補わない。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 野の獣
  rationale: 野に生息する動物を表す簡潔で定着した日本語。現代的な「野生の動物」という訳も可能なため脚注に示す。
