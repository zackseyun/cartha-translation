  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: ja
  text: 天幕の幕の長さで余る分、すなわち、こちら側の一キュビトと向こう側の一キュビト[a]は、幕屋[b]の両側に垂れ下がり、それを覆う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「一キュビト」を両側について繰り返しており、左右それぞれに余る長さを指す。
    reason: lexical_alternative
  - marker: b
    text: 「幕屋」はヘブライ語ミシュカンの訳で、天幕の覆いの下にある聖なる住まいの構造物を指す。
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה מִזֶּה וְהָאַמָּה מִזֶּה
  choice: こちら側の一キュビトと向こう側の一キュビト
  rationale: 定冠詞を伴う「キュビト」と二つの指示表現を、前節から続く左右それぞれの余りとして自然に表した。
- source_word: בָּעֹדֵף
  choice: 余る分
  rationale: 幕の長さが幕屋の寸法を超えて残る部分を指すため、建築描写に合う平明な表現とした。
- source_word: אֹרֶךְ יְרִיעֹת הָאֹהֶל
  choice: 天幕の幕の長さ
  rationale: 属格関係を保ち、幕が天幕を構成する布であることを明確にした。
- source_word: יִהְיֶה סָרוּחַ
  choice: 垂らし
  rationale: 余った布が両側へ下がって覆いとなる物理的な像を簡潔に伝える。
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: 幕屋の両側
  rationale: 複数形「側面」を文脈上の左右両側として表し、מִשְׁכָּןには日本語聖書で定着した「幕屋」を用いた。
- source_word: לְכַסֹּתוֹ
  choice: これを覆うようにする
  rationale: 目的を表す不定詞として訳し、代名詞の指示対象である幕屋を「これ」で受けた。
