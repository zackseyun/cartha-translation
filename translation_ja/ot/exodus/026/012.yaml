base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: ja
  text: 天幕[a]の幕に余る部分、すなわち余った一枚の幕の半分は、幕屋の後ろを覆って垂れ下がる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天幕」は覆いの層を、「幕屋」はその住居構造を指し、ヘブライ語では別の語が用いられている。
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: 垂れの部分
  rationale: 余分に突き出して垂れる部分を指す建築的な文脈を、自然な日本語で表す。
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: 余る／余った
  rationale: 必要な長さを超えて残る布を指す分詞の意味を簡潔に保つ。
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋を覆う大きな布地を指す、この文脈で定着した明瞭な訳語。
- source_word: הָאֹהֶל
  choice: 天幕
  rationale: 後半のמִשְׁכָּן（幕屋）と区別される覆いの層を示すため、「天幕」と訳す。
- source_word: חֲצִי הַיְרִיעָה
  choice: 幕の半分
  rationale: 一枚の幕の半幅を指す構文を明確かつ自然に表す。
- source_word: תִּסְרַח
  choice: 垂らす
  rationale: 余った布が後方へ垂れ下がる物理的な像を表し、指示文として自然な能動形にする。
- source_word: עַל אֲחֹרֵי
  choice: 後ろに
  rationale: 幕が構造物の後部を覆う位置関係を、過度に説明せず自然に示す。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 神の住まいとなる構造物を指す定着した訳語であり、天幕の覆いとの語彙上の区別も保てる。
theological_decisions:
- issue: אֹהֶלとמִשְׁכָּןの区別
  choice: 「天幕」と「幕屋」を訳し分ける
  alternative: 両方を「幕屋」とする
  rationale: 原文は覆いとしての天幕と、その下の住居構造を異なる語で表しているため、その区別を保持する。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある指示文。原文の反復をある程度保ちつつ、「すなわち」で同格関係を明確にした。
