  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: ja
  text: あなたは留め金の下に垂れ幕を掛け、そこ、すなわち垂れ幕の内側に、証しの箱[a]を運び入れなさい。その垂れ幕は、あなたがたのために、聖所と至聖所[b]とを隔てるものとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「契約の箱」と訳されることもある。ここでヘブライ語本文は「契約」ではなく「証し」としている。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「聖なるものの中の聖なるもの」（「聖の聖」）。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: 垂れ幕
  rationale: 幕屋の最も奥の空間を仕切る内側の幕を指す。「垂れ幕」は、吊り下げられた仕切りとしての形状と機能を自然な日本語で表す。
- source_word: קְרָסִים
  choice: 留め金
  rationale: 幕屋の幕を連結する部品を指す。具体的な現代の構造を過度に限定せず、接合具としての働きを明確に表せる。
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: 垂れ幕の内側に
  rationale: 直訳的には「垂れ幕の内側から／内側に」であり、文脈上は箱を置く、幕の向こう側の空間を示す。「内側に」はその空間関係を明瞭に伝える。
- source_word: אֲרוֹן הָעֵדוּת
  choice: あかしの箱
  rationale: 原文は「契約」ではなく עֵדוּת（あかし）を用いるため、その語を保持する。「あかし」は宗教的な指示物を指す語として読みやすく、伝統的な用語との連続性もある。
- source_word: וְהִבְדִּילָה
  choice: 隔てるものとなる
  rationale: ヒフィル形が表す、二つの空間を分離する機能を自然な日本語で示す。幕そのものが主語であることも保つ。
- source_word: לָכֶם
  choice: あなたがたのために
  rationale: 原文の複数二人称与格を省略せず保持する。前半の単数命令「あなたは」との人称数の移行も原文どおり残す。
- source_word: הַקֹּדֶשׁ
  choice: 聖所
  rationale: ここでは至聖所の外側にある聖なる区画を指す。幕屋の空間を表す定着した簡潔な用語である。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至聖所
  rationale: ヘブライ語の「聖の中の聖」という最上級的表現を、現代日本語で明瞭かつ荘重に表し、内側の最も聖なる区画を示す。
theological_decisions:
- issue: 内奥の聖域を表す伝統的な祭儀用語
  choice: 至聖所
  alternative: 聖の中の聖なる所
  rationale: 原文の最上級的な意味を明瞭に伝えつつ、幕屋の区画として理解しやすい用語を採用した。直訳的な形は脚注で示す。
- issue: 箱の名称における עֵדוּת の訳
  choice: あかしの箱
  alternative: 契約の箱
  rationale: この節の原文は「契約」ではなく「あかし」と明記しているため、伝統的に広く知られた別称へ同化させず、原文の語彙上の区別を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、幕屋の指示にふさわしい簡潔で荘重な調子とした。単数形の命令「あなたは」と、後半の複数形「あなたがた」の切り替えを原文に従って保持した。
