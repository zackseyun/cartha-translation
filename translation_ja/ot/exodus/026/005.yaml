base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: ja
  text: 一方の幕に輪を五十個作り、第二の組にある幕の端にも輪を五十個作る。輪と輪が互いに向かい合うようにする。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「女がその姉妹に」。対応する物どうしが、そろって向かい合うことを表すヘブライ語の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: 輪
  rationale: 幕を連結するための輪状の取り付け部分を指す。次節の金の留め金とは区別されるため、「輪」が簡潔で正確。
- source_word: יְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する大きな布を指す文脈に合い、現代日本語の聖書用語としても自然。
- source_word: הָאֶחָת
  choice: 一方の
  rationale: 原文は「その一つ」であり、順序を明示する「第一の」よりも、対応する二つを区別する「一方の」が適切。
- source_word: קְצֵה
  choice: 端
  rationale: 布の外縁、特に連結する側を指す語として自然で明瞭。
- source_word: מַחְבֶּרֶת
  choice: 組
  rationale: 前後の文脈で、複数の幕をつなぎ合わせてできた一まとまりを指すため、「組」が簡潔で分かりやすい。
- source_word: הַשֵּׁנִית
  choice: もう一方の
  rationale: 字義は「第二の」だが、ここでは二組のうち対応する側を表す。「もう一方の」は不必要に時間的・序列的な意味を持たせず、文脈上明瞭。
- source_word: מַקְבִּילֹת
  choice: 向かい合う
  rationale: 二組の輪が対応する位置に並ぶ空間的関係を自然に表す。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 互いに
  rationale: 字義は「女がその姉妹に」で、対応する物どうしを表すヘブライ語の慣用句。本文では自然な日本語にし、字義は脚注に残す。
