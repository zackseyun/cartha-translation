  text: וְ/עָשִׂ֤יתָ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵילִ֖ם מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: ja
  text: また、天幕のために、赤く染めた雄羊の皮で覆いを作り、その上にタハシュの皮[a]で覆いを作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タハシュ」に当たるヘブライ語が何を指すかは確かでない。特定の動物、または丈夫な革の一種を指す可能性があり、「上質な革」「ネズミイルカの皮」「ジュゴンの皮」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞を伴う完了形は、一連の製作指示の中で命令の働きをする。現代日本語で明確な指示となるよう「作りなさい」とした。
- source_word: מִכְסֶה לָאֹהֶל
  choice: 天幕のために…覆い
  rationale: אֹהֶל の基本義「天幕」を保ち、מִכְסֶה は保護する覆いの層を表すため「覆い」とした。前置詞 ל は文脈に即して「ために」と訳した。
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 赤く染めた雄羊の皮
  rationale: 雄羊の皮が赤く加工されたことを示す表現として、自然で具体的な「赤く染めた」を採用した。
- source_word: וּמִכְסֵה
  choice: …で覆いを作り
  rationale: 第二の覆いの層を示す反復を日本語でも「覆い」として明示した。動詞は前半から補って自然な指示文にした。
- source_word: עֹרֹת תְּחָשִׁים
  choice: タハシュの皮[a]
  rationale: תְּחָשִׁים が指す動物または革の種類は確定できないため、特定の動物名に決めず音写し、脚注で不確かさと代表的な訳語を示した。
- source_word: מִלְמָעְלָה
  choice: その上に
  rationale: 第二の覆いが先の覆いより上に置かれる層構造を、過度に説明せず明瞭に表した。日本語では指示対象を自然に示すため「その」を補った。
theological_decisions: []
