  text: וְ/יִֽהְי֣וּ תֹֽאֲמִים֮ מִ/לְּ/מַטָּה֒ וְ/יַחְדָּ֗ו יִהְי֤וּ תַמִּים֙ עַל רֹאשׁ֔/וֹ אֶל הַ/טַּבַּ֖עַת הָ/אֶחָ֑ת כֵּ֚ן יִהְיֶ֣ה לִ/שְׁנֵי/הֶ֔ם לִ/שְׁנֵ֥י הַ/מִּקְצֹעֹ֖ת יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: ja
  text: それらは下端で一対になり[a]、上端では一つの輪まで、ともに完全なものとなる[b][c]。このように二枚ともを造り、二つの隅のためのものとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに対応するように」または「対を成すように」とも訳せる。ヘブライ語は、二枚が組になっていることを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「ともに完全なものとなり」。ここでは道徳的な完全さではなく、構造上、完全に整うことを指す。
    reason: lexical_alternative
  - marker: c
    text: 「一つの輪まで」。この輪は、対になった板を上部で結ぶ輪を指す可能性がある。「第一の輪」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: 一対になり
  rationale: 語根が示す「対を成す、対応する」という意味を、建築構造の文脈に即して自然に表した。具体的な接合方法までは限定しない。
- source_word: מִלְּמַטָּה
  choice: 下端で
  rationale: 板材の下側の端を指す空間表現として、簡潔で明確な訳を採った。
- source_word: וְיַחְדָּו
  choice: 一つに合わさって
  rationale: 二つの板が共同して一体となることを示す。単なる位置的な「一緒に」より構造上の関係が伝わる。
- source_word: תַמִּים
  choice: 合わさって
  rationale: ここでは道徳的な「完全」ではなく、構造的に一体となり整う意味と判断した。ただし接合技法の詳細は補わない。
- source_word: עַל רֹאשׁוֹ
  choice: 上端でも
  rationale: רֹאשׁ の身体語的な直訳を避け、板の上部を指す建築文脈に自然な表現とした。単数接尾辞の指示対象には曖昧さがあるため、所有表現を明示しなかった。
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: 一つの輪に達するように
  rationale: אֶל を到達点として表し、הָאֶחָת は順序を断定する「第一の」ではなく、字義に近い「一つの」とした。
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: 二つとも同じようにし
  rationale: 直前の構造を二つの部材双方に適用する指示として、現代日本語の命令文に自然に表した。
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: 二つの隅のために用いる
  rationale: מִקְצֹעֹת の基本的な空間義「隅」を保持し、「隅の部材」などの解釈的補足は避けた。
