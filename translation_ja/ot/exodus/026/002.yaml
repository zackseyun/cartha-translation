  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: ja
  text: 各幕の長さは二十八キュビト[a]、幅は四キュビトとする。すべての幕は同じ寸法とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一キュビトは、ひじから中指の先までを基準とした古代の長さの単位。実際の長さには幅があるが、およそ四十五センチ。
    reason: measurement_clarification
lexical_decisions:
- source_word: אֹרֶךְ
  choice: 長さ
  rationale: 幕の寸法を示す標準的で自然な現代日本語。
- source_word: הַיְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する大きな布を指す語であり、文脈に即した簡潔な訳語。
- source_word: הָאַחַת / הָאֶחָת
  choice: 一枚の
  rationale: 字義的には「その一つ」だが、個々の幕について寸法を規定する分配的な表現として自然に訳した。
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: 二十八
  rationale: 基数の直接的な訳。
- source_word: בָּאַמָּה
  choice: キュビト
  rationale: 古代の長さの単位を固有の単位名として保持し、現代の単位へ不確実な換算をしない。
- source_word: וְרֹחַב
  choice: 幅
  rationale: 「長さ」と対をなす寸法用語として自然な現代日本語。
- source_word: אַרְבַּע
  choice: 四
  rationale: 基数の直接的な訳。
- source_word: מִדָּה אַחַת
  choice: 同じ寸法
  rationale: 字義は「一つの寸法」。すべての幕に共通する規格を示す意味を明瞭に表す。
- source_word: לְכָל הַיְרִיעֹת
  choice: すべての幕
  rationale: 単一の寸法が幕全体に適用されるという集合的範囲を保持する。
