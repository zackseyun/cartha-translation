base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: ja
  text: また、この垂れ幕[a]のためにアカシア材の柱を五本作りなさい。それらを金で覆い、それらの鉤も金で作りなさい。柱のために青銅の台座を五個鋳造しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「入口の幕」とも訳せる。ここで使われているヘブライ語は、至聖所を仕切る内側の垂れ幕を指す語とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: 垂れ幕
  rationale: 幕屋の入口を覆う掛け布を指す。至聖所を仕切る内側の「垂れ幕」とはヘブライ語が異なるが、日本語では「垂れ幕」が形状と機能を自然に表すため、脚注で区別を明示した。
- source_word: עַמּוּדֵי שִׁטִּים
  choice: アカシア材の柱
  rationale: עַמּוּדִים は幕を支える柱、שִׁטִּים は幕屋の造営に用いられるアカシア材を表す。
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: 金をかぶせる
  rationale: צפה は物の表面を金属で覆うことを表す。「金をかぶせる」は現代日本語で明瞭かつ自然である。
- source_word: וָוֵיהֶם
  choice: その掛け金
  rationale: וָוִים は幕を柱に掛けるための金具を指す可能性が高い。「鉤」よりも一般読者に分かりやすい「掛け金」とした。
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: 青銅の台座
  rationale: אַדָן は柱を支える基部または受け座を指す。「台座」は構造上の役割を自然に伝える。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 古代の幕屋資材の文脈では「青銅」が適切であり、「真鍮」は冶金学的に誤解を招く。
- source_word: וְיָצַקְתָּ לָהֶם
  choice: 柱のために…鋳造する
  rationale: יצק は金属を鋳ること、לָהֶם は台座が五本の柱のためのものであることを示す。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。連続する命令形は、日本語の造営指示として自然な「作り」「かぶせる」「金とし」「鋳造する」で統一した。原文の材料、数量、各部材の関係を明示しつつ、専門的すぎる語を避けた。
