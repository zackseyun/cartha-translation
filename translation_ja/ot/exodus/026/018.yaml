  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: ja
  text: 幕屋のために枠[a]を作りなさい。南側、すなわち南に面する側には、二十本の枠を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「板」とも訳せる。ヘブライ語は幕屋を構成する構造材を指し、その形状を「枠」と見るか「板」と見るかには幅がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作りなさい
  rationale: 接続詞を伴う完了形は、この施工指示の文脈では命令の働きをする。現代日本語で明確かつ自然な指示表現とした。
- source_word: הַקְּרָשִׁים
  choice: 枠
  rationale: 幕屋を構成する直立した構造材を指す語である。「枠」はその構造上の役割を示しつつ、「板」とも理解し得る語義上の幅を脚注に残せる。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋のために
  rationale: מִשְׁכָּןは出エジプト記における聖所の構造物を指す定着した語であり、日本語では「幕屋」が文脈に即している。前置詞לは用途を表す「ために」とした。
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: 二十本の枠
  rationale: ヘブライ語では数詞の後に単数形が置かれる通常の数え方である。日本語では細長い構造材として自然な助数詞「本」を用いた。
- source_word: לִפְאַת
  choice: 側には
  rationale: פֵאָהには端・側面などの意味があるが、建築物の方位を述べるここでは「側」が最も自然である。
- source_word: נֶגְבָּה תֵימָנָה
  choice: 南側、すなわち南に面する側
  rationale: 二つの南方を示す表現を一語に畳み込まず、後半が方角を明確にするヘブライ語の重なりを自然な日本語で保った。
