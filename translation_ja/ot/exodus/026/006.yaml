  text: וְ/עָשִׂ֕יתָ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וְ/חִבַּרְתָּ֨ אֶת הַ/יְרִיעֹ֜ת אִשָּׁ֤ה אֶל אֲחֹתָ/הּ֙ בַּ/קְּרָסִ֔ים וְ/הָיָ֥ה הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: ja
  text: 金の留め具を五十個作り、その留め具で幕を互いにつなぎ合わせなさい[a]。こうして、幕屋は一つになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「幕を、それぞれその姉妹へ」。対応する幕どうしをつなぐことを表すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作り
  rationale: 接続詞を伴う完了形は、一連の製作指示の中で命令の力を持つ。後続の「なさい」と合わせ、自然な日本語の指示文とした。
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: 金の留め具を五十個
  rationale: קֶרֶסは幕を接合する器具を指すが、具体的な形状までは断定できないため、「鉤」より包括的で分かりやすい「留め具」とした。
- source_word: וְחִבַּרְתָּ
  choice: つなぎ合わせなさい
  rationale: חברの接合する意味と、製作指示としての命令の力を、現代日本語で明確に表した。
- source_word: הַיְרִיעֹת
  choice: 幕
  rationale: 幕屋を構成する布製の幕を指す。文脈上明瞭で、幕屋関連の用語として自然な「幕」を採用した。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 互いに
  rationale: 直訳は「一人の女をその姉妹へ」だが、無生物が対応して隣り合うことを表すヘブライ語の慣用句であるため、日本語では「互いに」とした。
- source_word: בַּקְּרָסִים
  choice: その留め具で
  rationale: 前置詞בはここでは手段を示す。既出の留め具を用いることを自然に表した。
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: こうして幕屋は一つになる
  rationale: 接合の結果、幕屋全体が一体となることを示す節として訳した。「一つ」という原文の表現を保持した。
theological_decisions:
- issue: הַמִּשְׁכָּןの訳語
  choice: 幕屋
  alternative: 住まい／住まいの所
  rationale: 語義の根底には「住まい」があるが、出エジプト記の聖所構造を指す技術的文脈では、定着し理解しやすい「幕屋」が適切である。
- issue: 結果節 וְהָיָה הַמִּשְׁכָּן אֶחָד の関係
  choice: こうして幕屋は一つになる
  alternative: 幕屋は一つでなければならない／一つとなるように
  rationale: 前の接合作業から生じる結果として読むのが文脈に自然である。目的だけ、または独立した義務命令だけに限定せず、原文の連続性を保った。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。幕屋製作の指示として dignified な命令形を用い、器具の形状を過度に特定せず、原文の「一つ」を保持した。
