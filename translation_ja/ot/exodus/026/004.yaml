base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: ja
  text: つなぎ合わせた第一の組[b]の端に来る一枚の幕の縁に、青色の輪[a]を作りなさい。同じように、つなぎ合わせた第二の組の端にある幕[c]の縁にも輪を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青色」は「青紫色」または「紫がかった青色」とも訳せる。ヘブライ語は、幕屋に用いられた特徴的な青系の染色素材を指す。
    reason: lexical_alternative
  - marker: b
    text: 「つなぎ合わせた組」に当たるヘブライ語は、複数の幕を接合して一つにしたまとまりを指す。伝統的には「つなぎ」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: 「端にある幕」は「最も外側の幕」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: 輪
  rationale: 幕どうしを留め合わせるための輪状の付属部分を指す。建造指示として簡潔で自然な「輪」とした。
- source_word: תְּכֵלֶת
  choice: 青色の糸
  rationale: 幕屋の織物に用いられる特徴的な青系の染色素材を指す。日本語では輪の材料であることが自然に伝わるよう「青色の糸」としたが、色調には幅があるため脚注を付した。
- source_word: שְׂפַת
  choice: 縁
  rationale: 布である幕の端の部分を表す語として、現代日本語で最も自然な「縁」を用いた。
- source_word: יְרִיעָה
  choice: 幕
  rationale: 出エジプト記26章の幕屋を構成する布を指す。文脈に即し、簡潔で定着した「幕」とした。
- source_word: הָאֶחָת
  choice: 一枚の
  rationale: ヘブライ語の「その一つ」を、幕を数える自然な日本語として「一枚の」と訳し、「第一の幕」とは限定しなかった。
- source_word: מִקָּצָה
  choice: 端に来る
  rationale: その幕が、つなぎ合わせた組全体の端に位置することを明瞭に表した。
- source_word: חֹבָרֶת
  choice: つなぎ合わせた第一の組
  rationale: 複数の幕を接合して一単位としたものを表す。「第一の」は後半の「第二の」との対比から文脈上補った。
- source_word: וְכֵן
  choice: 同じように
  rationale: 後半にも同一の施工を命じる対応関係を、自然で明瞭な日本語にした。
- source_word: הַקִּיצוֹנָה
  choice: 最も外側の
  rationale: 組の外端または末端に位置する幕という空間的意味を明確にした。
- source_word: מַחְבֶּרֶת
  choice: つなぎ合わせた組
  rationale: חֹבָרֶתと同様、接合されて一単位となった幕のまとまりを指すため、対応する表現を用いた。
- source_word: הַשֵּׁנִית
  choice: 第二の
  rationale: 二つの接合された組のうち後者を明示する語を、そのまま「第二の」とした。
