  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: ja
  text: 青銅[a]の留め金を五十個作り、その留め金を輪に差し入れて、幕屋をつなぎ合わせなさい。そうすれば、それは一つとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銅」とも訳せる。ヘブライ語 נְחֹשֶׁת は、文脈によって銅または青銅を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: 青銅の留め金
  rationale: קַרְסִיםは幕を連結する金具を指すため、「留め金」とした。נְחֹשֶׁתは銅または青銅を意味し得るが、幕屋の金属製品という文脈と慣用に従い「青銅」とした。
- source_word: חֲמִשִּׁים
  choice: 五十個
  rationale: 留め金の数量を表す基数であり、日本語では助数詞「個」を添えるのが自然である。
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: その留め金を輪に差し入れて
  rationale: בואのヒフィル形は、ここでは留め金を輪の中へ入れる動作を表す。「差し入れる」は構造上の具体的な操作を明瞭に示す。
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: 幕屋を一つにつなぎ合わせなさい
  rationale: חברは結合することを表し、הָאֹהֶלはこの覆いによって形作られる幕屋を指す。後続のוְהָיָה אֶחָדを合わせ、「一つにつなぎ合わせる」と自然に表現した。
- source_word: וְהָיָה אֶחָד
  choice: 一つに
  rationale: 直訳は「そして、それは一つとなる」。先行する命令の結果として、別々の部分が一体となることを示すため、日本語では「一つにつなぎ合わせなさい」と統合した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある命令文とした。「幕屋」は出エジプト記の聖所構造を指す定着した訳語として用い、個々の幕が一体化する結果を「一つにつなぎ合わせる」で表した。
