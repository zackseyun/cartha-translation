base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: ja
  text: 中ほどの横木は、枠材[a]の間を、一方の端から他方の端まで延びるようにする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「板」とも訳せる。ヘブライ語は、幕屋を構成する直立した構造部材を指す。ここでは単純な平板と受け取られないよう「枠材」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: 横木
  rationale: 幕屋の直立部材を横方向につなぎ留める構造材を指すため、現代日本語の建築用語として自然な「横木」とした。
- source_word: הַתִּיכֹן
  choice: 中ほどの
  rationale: 複数の横木のうち中間に位置するものを示す。「中央の」よりも、配置を自然に表す「中ほどの」とした。
- source_word: בְּתוֹךְ
  choice: 枠材の間を
  rationale: 部材の内部または間に位置するという空間関係を示す。穴を貫通する仕組みまで断定せず、「間を」として曖昧さを保った。
- source_word: הַקְּרָשִׁים
  choice: 枠材
  rationale: 幕屋を構成する直立した構造部材を指す。「板」では単純な薄板を連想させやすいため、「枠材」とした。
- source_word: מַבְרִחַ
  choice: 延びるようにする
  rationale: ヒフィル分詞が横木の全長にわたる配置を描く。開口部を「貫通する」と過度に具体化せず、施工指示として自然に表した。
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: 一方の端から他方の端まで
  rationale: 全幅にわたることを明確かつ自然な日本語で表す。
