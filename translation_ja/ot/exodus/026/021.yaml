  text: וְ/אַרְבָּעִ֥ים אַדְנֵי/הֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָֽ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: ja
  text: その四十個の台座[a]は銀で作る。それぞれの枠[b]の下に、台座を二個ずつ置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け座」とも訳せる。ヘブライ語は、幕屋の枠を差し込んで支える銀製の部分を指す。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「板」とも訳される。ここでは幕屋を構成する直立した構造部材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: その四十個の台座
  rationale: 接続詞は前節からの連続を示すが、日本語では「その」によって既出の枠とのつながりを自然に表した。אֶדֶן は幕屋の枠を受ける銀製の支持部材を指すため、「台座」とした。
- source_word: כָּסֶף
  choice: 銀で作る
  rationale: 材料を示す名詞であり、現代日本語の建築指示として自然な「銀で作る」とした。
- source_word: שְׁנֵי אֲדָנִים
  choice: 台座を二個ずつ
  rationale: 各枠の下に置く支持部材の数を示す。前半と同じ語を「台座」と訳し、反復構文の配分的意味を「ずつ」で明示した。
- source_word: תַּחַת
  choice: 下に
  rationale: 各枠に対する台座の物理的位置を直接的に表す。
- source_word: הַ/קֶּרֶשׁ
  choice: 枠
  rationale: 幕屋を構成する直立部材を指す。「板」も可能だが、単なる平板ではなく構造部材であることが伝わる「枠」を採用した。
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: それぞれの枠
  rationale: ヘブライ語は同じ「一つの枠の下に」という句を二度繰り返す。この文脈では各枠に二個ずつ配する意味なので、日本語では誤解を避けつつ配分的意味を保つ「それぞれの枠」とした。
theological_decisions: []
translation_notes:
  register: 簡潔で明瞭な現代標準日本語とし、幕屋建設の指示文にふさわしい端正な文体を用いた。原文の逐語的な反復は日本語では同じ枠に四個置くようにも読めるため、その配分的機能を「それぞれ」「二個ずつ」で自然に表した。
