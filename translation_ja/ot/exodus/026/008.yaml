base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: ja
  text: 各幕[a]の長さは三十キュビト、幅は四キュビトとする。十一枚の幕はすべて同じ寸法とする。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「一枚の幕」。ここでは各々の幕を指す分配的な表現である。
    reason: lexical_alternative
  - marker: b
    text: 直訳「一つの寸法」。十一枚すべてが同一の寸法であることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: 長さ
  rationale: רֹחַב（幅）と対になった寸法用語であり、現代日本語で自然かつ明確である。
- source_word: יְרִיעָה
  choice: 幕
  rationale: 幕屋を覆う大きな布を指す文脈であり、「幕」は簡潔で定着した訳語である。
- source_word: הָאַחַת / הָאֶחָת
  choice: 一枚ごとに
  rationale: 字義的には「その一枚」だが、ここでは各々の幕に同じ寸法を指定する分配的用法なので、その意味を自然な日本語で表した。
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: 三十キュビト
  rationale: 古代の長さの単位 אַמָּה を換算せず保持し、原文の尺度を透明に示した。
- source_word: רֹחַב
  choice: 幅
  rationale: 「長さ」と対になる明確な現代日本語である。
- source_word: אַרְבַּע בָּאַמָּה
  choice: 四キュビト
  rationale: 原文の古代単位を保持して寸法をそのまま示した。
- source_word: מִדָּה אַחַת
  choice: 同じ寸法
  rationale: 字義的には「一つの寸法」で、十一枚すべての寸法が統一されていることを自然な日本語で表す。字義的表現は脚注に残した。
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: 十一枚の幕はすべて
  rationale: לְ が示す適用対象を日本語では主題として表し、全十一枚に同一寸法が当てはまることを明確にした。
