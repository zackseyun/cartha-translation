  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: ja
  text: 'また、贖いの蓋[a]を、至聖所[c]にある証しの箱[b]の上に置きなさい。


    [a] 別訳「恵みの座」。


    [b] ヘブライ語は「証しの箱」。伝統的に「契約の箱」とも訳される。


    [c] 別訳「最も聖なる所」。ヘブライ語では、同じ語を重ねて最上級を表す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恵みの座」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「証しの箱」。伝統的に「契約の箱」とも訳される。
    reason: alternative_reading
  - marker: c
    text: 別訳「最も聖なる所」。ヘブライ語では、同じ語を重ねて最上級を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: また、…置きなさい
  rationale: 接続詞を伴うカル完了形二人称男性単数は、一連の幕屋建設指示の中で命令の働きをする。「置きなさい」によって指示の力を自然な現代日本語で表した。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 箱の上を覆い、贖いの儀礼と結び付く器具であることを示す。単なる「蓋」より祭儀的含意を保ちつつ、「恵みの座」を別訳として脚注に残した。
- source_word: עַל
  choice: …の上に
  rationale: 蓋を箱の上面に据えるという空間的関係を明確に表す。
- source_word: אֲרוֹן הָעֵדֻת
  choice: 証しの箱
  rationale: 原文は「契約」ではなく明示的に「証し」と言うため、その語を保持した。「箱」は現代日本語で対象の形状を明瞭に伝える。伝統的な「契約の箱」は脚注に示した。
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: 至聖所にある
  rationale: ヘブライ語の重畳表現による最上級を、幕屋の最奥部を指す定着した簡潔な語「至聖所」で表した。日本語として位置関係が明瞭になるよう「証しの箱」を修飾させた。
theological_decisions:
- issue: כַּפֹּרֶתを物理的な蓋として訳すか、神学的・伝統的名称で訳すか
  choice: 本文では「贖いの蓋」
  alternative: 「恵みの座」
  rationale: 物体としての蓋と贖いとの関係をともに伝え、特定の贖罪理解を過度に読み込まない。伝統的表現は脚注で保持する。
- issue: אֲרוֹן הָעֵדֻתの「証し」を「契約」に調和させるか
  choice: 原文どおり「証しの箱」
  alternative: 「契約の箱」
  rationale: 原語優先により「証し」を本文に保持する。一方、読者になじみのある伝統的訳語を脚注に示す。
- issue: קֹדֶשׁ הַקֳּדָשִׁיםの重畳表現をどう表すか
  choice: 本文では「至聖所」
  alternative: 「最も聖なる所」
  rationale: 日本語で定着した祭儀用語を用いつつ、原文の最上級的構造と平易な別訳を脚注で明示する。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。命令文は「置きなさい」とし、幕屋祭儀の用語は必要な範囲で保持した。「証し」は漢字表記として意味を明瞭にし、原文の語彙上の区別を保っている。
