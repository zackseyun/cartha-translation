  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: ja
  text: また、一方のつなぎ合わせた組の端にある一枚の幕の縁に、輪を五十個作り、もう一方のつなぎ合わせた組にある幕の縁にも、輪を五十個作りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作る
  rationale: 幕屋造営の指示における接続詞付き完了形を、現代日本語で自然な命令・指示として表した。
- source_word: לֻלָאֹת
  choice: 輪
  rationale: 幕を連結するための布製のループを指す。簡潔で一般読者にも理解しやすい。
- source_word: שְׂפַת
  choice: 縁
  rationale: 字義は「唇」だが、布については「縁」が自然で正確である。
- source_word: הַיְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する大きな布を指す語として、定着し、かつ簡潔な訳語を採用した。
- source_word: הָאֶחָת
  choice: 一枚の
  rationale: 「第一」ではなく、原文の基数的な「一つ／一枚」を保持した。
- source_word: הַקִּיצֹנָה
  choice: 端にある
  rationale: 連結された組の末端に位置することを、自然な日本語で示した。
- source_word: בַּחֹבָרֶת
  choice: つなぎ合わせた一組の
  rationale: 連結によって形成された一まとまりを指すため、「組」という具体的な表現で構造を明らかにした。
- source_word: הַחֹבֶרֶת
  choice: それとつながる
  rationale: 語根 ח־ב־ר の連結関係を保ち、二枚の幕の関係として自然に表現した。
- source_word: הַשֵּׁנִית
  choice: 第二の幕
  rationale: 序数の意味をそのまま保持し、指示対象を明確にするため「幕」を補った。
