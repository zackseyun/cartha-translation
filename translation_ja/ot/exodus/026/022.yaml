  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: ja
  text: 幕屋の後部、すなわち西側には、板[a]を六枚作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「枠」。この構造部材を無垢の板ではなく、開放された枠状のものと理解する場合。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: 後ろ側には
  rationale: יַרְכְּתֵי はこの建築文脈で幕屋の奥・後部を指す。現代日本語として自然な「後ろ側」とした。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所構造物の定着した訳語であり、文脈上の指示対象を明確に保つ。
- source_word: יָמָּה
  choice: すなわち西側
  rationale: 語義は直訳的には「海の方へ」で、地理的方位として西を表す。ここでは後ろ側の位置を説明する同格的な表現として訳した。
- source_word: תַּעֲשֶׂה
  choice: 作る
  rationale: Qal未完了形二人称男性単数は、この指示文脈で命令・規定の力を持つ。日本語では簡潔な指示調を用いた。
- source_word: שִׁשָּׁה
  choice: 六枚
  rationale: 後続する板を数える基数。日本語として適切な助数詞「枚」を補った。
- source_word: קְרָשִׁים
  choice: 板
  rationale: 幕屋の壁を構成する木製部材を指す伝統的かつ明瞭な訳語。ただし、部材が無垢の板か枠状の構造体かは確定しないため異訳を脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、幕屋建設の規定にふさわしい簡潔で格調ある指示文にした。「後ろ側」と「西側」の関係が明確になるよう「すなわち」を補った。
