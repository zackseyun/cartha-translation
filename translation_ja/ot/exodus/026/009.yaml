  text: וְ/חִבַּרְתָּ֞ אֶת חֲמֵ֤שׁ הַ/יְרִיעֹת֙ לְ/בָ֔ד וְ/אֶת שֵׁ֥שׁ הַ/יְרִיעֹ֖ת לְ/בָ֑ד וְ/כָפַלְתָּ֙ אֶת הַ/יְרִיעָ֣ה הַ/שִּׁשִּׁ֔ית אֶל מ֖וּל פְּנֵ֥י הָ/אֹֽהֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: ja
  text: 五枚の幕を一組としてつなぎ合わせ、六枚の幕も別の一組としてつなぎ合わせなさい。そして、第六の幕は、天幕の正面で二つ折りにしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天幕の正面の向かいで第六の幕を二つ折りにしなさい」とも訳せる。
    reason: 前置詞句 אֶל מוּל פְּנֵי は、天幕の正面に対応する位置関係を表すため。
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: つなぎ合わせなさい
  rationale: 幕を結合してまとまりを作ることを表す動詞であり、現代日本語で自然かつ具体的に訳した。
- source_word: יְרִיעֹת / יְרִיעָה
  choice: 幕
  rationale: 幕屋を構成する布製の覆いを指す。建築文脈に合い、一般読者にも分かりやすい「幕」とした。
- source_word: לְבָד
  choice: 一組として／別の一組として
  rationale: 五枚と六枚をそれぞれ独立したまとまりとしてつなぐという配分的な意味を、日本語で明瞭に表した。
- source_word: כָפַלְתָּ
  choice: 二つ折りにしなさい
  rationale: 布を折って二重にする動作を具体的かつ自然に表す。
- source_word: הַשִּׁשִּׁית
  choice: 第六の幕
  rationale: 幕を修飾する序数をそのまま明確に訳した。
- source_word: אֶל מוּל פְּנֵי
  choice: 正面で
  rationale: 天幕の前面に対応する位置で折り重ねるという空間関係を簡潔に表した。方向性を強く取る訳も可能なため脚注に示した。
- source_word: הָאֹהֶל
  choice: 天幕
  rationale: 原語は一般に「天幕」を意味する。ここでは幕屋構造を指すが、より解釈的な語に置き換えず原語の表現を保った。
theological_decisions: []
translation_notes:
  register: 命令文として端正で明瞭な現代標準日本語を用いた。「それだけで」のような不自然な直訳を避け、二つの独立した幕の組であることを「一組」「別の一組」で示した。
