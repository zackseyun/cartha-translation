base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: ja
  text: あなたは、天幕の入口のために、青色、紫色、緋色の糸と、撚り合わせた上質の亜麻糸で、刺繍職人の仕事による幕[a]を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「覆い幕」「垂れ幕」。入口を覆うための幕であり、この章で先に述べられた内側の幕とは別のもの。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: 垂れ幕
  rationale: 入り口を覆い、仕切るために掛ける布を指す。現代日本語で自然な「垂れ幕」とし、内部の「垂れ幕」との区別や「覆い幕」という別訳の可能性は脚注で示した。
- source_word: לְפֶתַח הָאֹהֶל
  choice: 天幕の入り口のために
  rationale: פֶתַחは開口部・入り口、אֹהֶלは天幕を意味する。ここでは建造物全体を解釈的に「幕屋」とせず、原語に即して「天幕」とした。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の撚り糸
  rationale: 三つの色名は染色された繊維素材を指す。日本語では素材であることが明確になるよう「撚り糸」を補った。תְּכֵלֶתの青紫系の色幅は保ちつつ、簡明な「青」を採用した。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁは上質の亜麻布・亜麻糸、מָשְׁזָרは撚ったものを表す。製法と品質をともに明示した。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 刺繍職人の手で
  rationale: 装飾的な織物・刺繍を施す熟練職人の仕事を表す。職人に焦点を置く構文を自然な日本語で保持した。
- source_word: וְעָשִׂיתָ
  choice: あなたは……作りなさい
  rationale: 建造指示の連続における命令的な力を、明瞭で dignified な指示表現「作りなさい」で訳した。
