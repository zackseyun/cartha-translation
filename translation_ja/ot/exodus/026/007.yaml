  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: ja
  text: また、山羊の毛の幕を作り、幕屋を覆う天幕としなさい。幕は十一枚作りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞を伴う完了形が一連の建設指示を続けるため、現代日本語の命令表現で訳した。
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋建設の文脈で、大きな布製の覆いを指す。自然で簡潔な日本語として「幕」を用いた。
- source_word: עִזִּים
  choice: 山羊の毛
  rationale: 字義は「山羊」だが、ここでは山羊由来の毛を素材として表す換喩であるため、意味を明示した。
- source_word: לְאֹהֶל עַל הַמִּשְׁכָּן
  choice: 幕屋を覆う天幕としなさい
  rationale: לְאֹהֶל は用途・結果を示し、עַל は幕屋の上を覆う位置関係を示す。「天幕として、幕屋の上に」より自然な日本語に整えた。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所構造を指す定着した日本語の用語を採用した。
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: 幕は十一枚作りなさい
  rationale: 原文が幕の総数を改めて指定する構文を、日本語で明瞭かつ自然に表した。
