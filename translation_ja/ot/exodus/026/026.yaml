  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: ja
  text: また、幕屋の一方の側の枠[a]のために、アカシア材で横木を五本作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「枠」は「板」とも訳せる。ヘブライ語は幕屋を構成する直立部材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞を伴う完了形が一連の製作指示を続ける命令として機能しているため、現代日本語の自然な指示表現とした。
- source_word: בְרִיחִם
  choice: 横木
  rationale: 幕屋の枠を横方向につなぎ留める構造材を指す。単なる「棒」より用途が明確で、文脈に適する。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシヤ材
  rationale: 樹木名を伴う構成形を、建築材料として自然な日本語で表した。聖書用語として広く用いられる表記を採った。
- source_word: חֲמִשָּׁה
  choice: 五本
  rationale: 基数の「五」に、細長い横木に適した助数詞「本」を補った。
- source_word: לְקַרְשֵׁי
  choice: 枠のために
  rationale: קֶרֶשׁ は幕屋を構成する直立部材を指す。「枠」は構造上の役割を伝えるが、「板」も可能なので脚注に示した。
- source_word: צֶלַע
  choice: 側
  rationale: ここでは建造物の側面を指し、語源的な「肋骨」ではなく「側」が文脈上自然である。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所構造物を指す定着した日本語訳であり、文脈上明確である。
- source_word: הָאֶחָד
  choice: 一方の
  rationale: 二つの側面のうち特定の一方を示す定冠詞付きの語を表し、次節の反対側との対応も保った。
