  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: ja
  text: また、幕屋のために、アカシア材の枠板[a]を立てて作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「板」。ヘブライ語は、幕屋を構成する直立した木製部材を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作り…なさい
  rationale: 接続詞を伴う完了形は、一連の幕屋建設指示における命令を表す。「また」で連続性を示し、日本語では文末の「なさい」で命令として自然に表した。
- source_word: הַקְּרָשִׁים
  choice: 枠板
  rationale: 幕屋を構成する直立した木製部材を指す。「板」だけでは構造上の役割が伝わりにくく、「枠」だけでは板状の実体が薄れるため、「枠板」とした。語の具体的形状には議論の余地があるので脚注に別訳を示した。
- source_word: לַמִּשְׁכָּן
  choice: 幕屋のために
  rationale: מִשְׁכָּןは出エジプト記で聖所の構造物を指す定着した用語であり、日本語聖書で広く理解される「幕屋」を用いた。前置詞לは用途・関係を示すため「のために」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材で
  rationale: シッティームの木から取った木材を表す連語である。現代日本語で自然な材質表現として「アカシア材」を採用し、製作材料を示す「で」でつないだ。
- source_word: עֹמְדִים
  choice: 立てて据えなさい
  rationale: 男性複数分詞で枠板が立った状態・向きを表す。単なる動作の「立てる」だけでなく、建築部材として直立状態に据える意味を自然に伝えた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、幕屋建設の指示として簡潔で品位ある命令文にした。「枠板」は構造上の機能と木製部材としての具体性をともに保つ表現である。
