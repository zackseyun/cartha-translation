base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: ja
  text: 青、紫、緋色の糸と、より合わせた上質の亜麻布で、垂れ幕[a]を作りなさい。それを、巧みな職人の仕事として、ケルビムをあしらったものにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕切りの幕」とも訳せる。聖所と至聖所を隔てる内側の幕を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: 垂れ幕
  rationale: 聖所と至聖所を隔てる内側の掛け布を指す。現代日本語で具体物を明瞭に示しつつ、一般的な「幕」より用途を伝えやすい。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 青、紫、緋色の糸
  rationale: 幕屋の織物材料として列挙された染色糸を自然な日本語で示す。「糸」は文脈から補い、各色の後での不自然な反復を避けた。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 撚り合わせた上質の亜麻糸
  rationale: שֵׁשׁの上質な亜麻布・亜麻糸という素材感と、מָשְׁזָרの撚った加工状態の双方を明示した。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧みな意匠を施す職人
  rationale: 高度な芸術的・意匠的技巧を伴う仕事を表す。技法を刺繍など一つに限定せず、職人の熟練と意匠性を伝える。
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: それに…表すものとする
  rationale: 二人称命令から三人称男性単数へ移る原文を、職人を主語とする規定表現で保持した。
- source_word: כְּרֻבִים
  choice: ケルビム
  rationale: 幕の意匠として表される天上の存在を、聖書用語として定着した音写で示した。複数形の形態も保っている。
theological_decisions:
- issue: 幕とケルビムに後代の象徴的意味を持ち込むか
  choice: 幕屋建設の具体的な製作指示として訳す
  alternative: 幕の後代的・神学的象徴性を訳文で前面に出す
  rationale: 本文は材料、製作、意匠を命じており、それ以上の象徴解釈を明言していないため。
- issue: מַעֲשֵׂה חֹשֵׁבの具体的技法
  choice: 「巧みな意匠を施す」とし、技法を限定しない
  alternative: 「刺繍する」または特定の織り方と断定する
  rationale: 語句は熟練した芸術的製作を示すが、この節だけでは現代の特定技法に一義的に限定できないため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「作りなさい」で直接の製作命令を示し、後半は原文の三人称への移行を「ものとする」で表した。専門的な祭儀語を過度に増やさず、「ケルビム」は定着した聖書用語として保持した。
