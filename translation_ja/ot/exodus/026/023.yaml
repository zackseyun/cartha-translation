  text: また、幕屋の後方の両隅に用いる板を二枚作る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幕屋の隅の部材のために、後方の両端に板を二枚作る」。ここで用いられているヘブライ語は建築上のやや専門的な語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: また…二枚
  rationale: 接続詞と「二」の連語形は、建造指示の次の項目を導入している。日本語では「また」とし、板を数える助数詞「枚」を用いた。
- source_word: קְרָשִׁים
  choice: 板
  rationale: 幕屋の壁を構成する木製の構造材を指す。「枠」では構造を限定しすぎ、「厚板」では原語にない厚さを加えるため、簡潔で定着した「板」とした。
- source_word: תַּעֲשֶׂה
  choice: 作る
  rationale: 二人称男性単数の未完了形は、この建造指示では命令・指示の力を持つ。前後の規定に合う簡潔な指示文として「作る」とした。
- source_word: לִ/מְקֻצְעֹת
  choice: 両隅に用いる
  rationale: 角、または角を成す接合部分を表す建築的な語である。後続の双数形と合わせ、本文では自然な「後ろの両隅に用いる」としたが、部材そのものを指す可能性は注で残した。
- source_word: הַ/מִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる移動式聖所を指す定着した日本語訳であり、原義の「住まい」より文脈上明確である。
- source_word: בַּ/יַּרְכָתָיִם
  choice: 後ろの両隅
  rationale: יַרְכָה の双数形は後方の二つの端・側を指す。直前の「隅」と統合し、日本語として明瞭な「後ろの両隅」とした。
