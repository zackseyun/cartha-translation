translation:
  language: ja
  text: 五枚の幕を互いにつなぎ合わせ[a]、もう五枚の幕も互いにつなぎ合わせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「女がその姉妹に」。女性名詞で表される物同士を対応させて結ぶことを意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋を構成する大きな織物を指すため、建築的な文脈に合い、現代日本語でも自然な「幕」とした。
- source_word: תִּהְיֶיןָ חֹבְרֹת
  choice: つなぎ合わせる
  rationale: 指示文中の未完了形と、結合された状態を表す分詞を、日本語の施工指示として簡潔かつ自然に表した。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 互いに
  rationale: 字義的には「女がその姉妹に」だが、女性名詞の物同士が対応して結ばれることを示すヘブライ語の慣用句なので、「互いに」と訳した。
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: 五枚……もう五枚
  rationale: 十枚の幕を五枚ずつ二組に分ける構造を明確にしつつ、原文の反復を保った。第二節の「もう」は日本語で二組目を自然に示す。
