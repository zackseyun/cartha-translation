base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: ja
  text: 枠材[a]は八枚、その銀の台座[b]は十六個とする。各枠材の下に台座を二個ずつ置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「板」。
    reason: lexical_alternative
  - marker: b
    text: または「受け座」。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: 枠材
  rationale: 幕屋を構成する直立した構造部材を指すため、単なる平板に限定しない「枠材」とした。数え方は板状の部材として自然な「枚」を用いた。
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: 台座
  rationale: 枠材の下で支える部品を表す、現代日本語で明瞭な語を選んだ。「受け座」も可能だが、やや専門的である。
- source_word: כֶּסֶף
  choice: 銀
  rationale: 台座の材質を示す語として直接的に訳した。
- source_word: שִׁשָּׁה עָשָׂר
  choice: 十六個
  rationale: 基数をそのまま訳し、台座を数える自然な助数詞を補った。
- source_word: תַּחַת
  choice: 下に
  rationale: 構造物における位置関係を明瞭かつ直接的に表した。
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: 一枚の枠材……もう一枚の枠材
  rationale: 原文は同じ「一枚の枠材」という表現を反復する。日本語では配分関係が自然に伝わるよう「一枚……もう一枚」とし、順序を不必要に示す「次の」は避けた。
- source_word: וְהָיוּ
  choice: …とする
  rationale: 建造の仕様を述べる文脈に合う、簡潔で自然な規定表現とした。
