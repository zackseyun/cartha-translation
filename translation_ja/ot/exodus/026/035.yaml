translation_notes:
  register: 明瞭で現代的かつ品位ある命令文とした。ヘブライ語の二人称単数完了形と未完了形は、直前から続く神の指示として日本語の「置く」で表現した。語順は原文の配置関係を保ちながら、日本語で誤読しにくいよう整えた。
