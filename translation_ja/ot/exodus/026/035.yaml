base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: ja
  text: 垂れ幕[a]の外に机を置きなさい。燭台[b]は机の向かい側、幕屋の南側に置きなさい。机は北側に置きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕切りの幕」とも訳せる。ヘブライ語 פָּרֹכֶת は、幕屋の内部を仕切る幕を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語はメノラー。ここでは物の意味が伝わるよう「燭台」と訳した。
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: あなたは…置く
  rationale: שׂוּםは「置く、据える」を意味する。幕屋の備品の配置を命じる文脈に合い、現代日本語として自然な「置く」とした。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 名詞自体は単に「机」を意味する。この節には供えのパンへの明示的言及がないため、文脈上の説明を本文に補わない。
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: 垂れ幕の外
  rationale: פָּרֹכֶתは幕屋内部を仕切る幕を指す。「垂れ幕」は物理的な仕切りとして分かりやすく、מִחוּץの位置関係も「外」で明確に表せる。
- source_word: הַמְּנֹרָה
  choice: 燭台
  rationale: 音写ではなく物の機能が伝わる訳語を採用した。「燭台」は聖所の器具を指す簡潔で定着した日本語である。
- source_word: נֹכַח
  choice: 向かい側
  rationale: 二つの器具が互いに対応して配置される空間関係を表す。ここでは「正面」よりも「向かい側」が自然で明確である。
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: 幕屋の南側に
  rationale: צֶלַעは「側面」、תֵּימָנָהは南方向を示す。日本語では「幕屋の南側に」が簡潔で自然である。
- source_word: וְהַשֻּׁלְחָן תִּתֵּן עַל צֶלַע צָפוֹן
  choice: 机は北側に置く
  rationale: נָתַןはこの文脈では「置く」、צָפוֹןは「北」を意味する。原文の再度の配置命令を保ちつつ、明快な日本語とした。
