lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: また、…側面には
  rationale: 接続詞と前置詞を、前節から続く建築指示として自然に表した。צֶלַע はここでは身体の「あばら骨」ではなく、幕屋の側面を指す。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記の聖所を指す定着した訳語であり、簡潔で理解しやすい。
- source_word: הַשֵּׁנִית
  choice: 第二の
  rationale: 前節で述べた第一の側面に対応することを明示する原文の序数を保持した。
- source_word: לִפְאַת צָפוֹן
  choice: すなわち北側には
  rationale: 第二の側面の位置・方角が北であることを、現代日本語で明瞭に示した。
- source_word: עֶשְׂרִים
  choice: 二十枚
  rationale: 基数をそのまま訳し、板状の構造材に自然な助数詞を補った。
- source_word: קָרֶשׁ
  choice: 枠板
  rationale: 幕屋の壁を構成する直立した構造材を指すため、単なる「板」より構造上の役割を示せる「枠板」とした。ただし具体的形状には不確かさがあるため、脚注で別訳を示した。
