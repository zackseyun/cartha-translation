base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: ja
  text: 二十枚の枠材[b]の下に、銀の台座[a]を四十個作りなさい。一枚の枠材の下に、その二つのほぞを受ける台座を二つ、もう一枚の枠材の下にも、その二つのほぞを受ける台座を二つ作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀の受け台」とも訳せる。ヘブライ語は、幕屋の枠材のほぞを受けるソケット状の土台を指す。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「板」。ヘブライ語は、幕屋を構成する直立した構造部材を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: 銀の台座
  rationale: 幕屋の枠材を下から支え、ほぞを受ける部材を指す。現代日本語で構造上の役割が分かりやすい「台座」とし、ソケット状の形態を示す別訳を脚注に残した。
- source_word: תַּעֲשֶׂה
  choice: 作りなさい
  rationale: 幕屋建設についての二人称単数の指示であり、明確な命令・指示の調子を自然な現代日本語で表した。
- source_word: תַּחַת
  choice: 下に
  rationale: 枠材と台座の位置関係を直接表す、簡潔で自然な訳語。
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: 枠材
  rationale: 幕屋を構成する直立した構造部材を指す。「板」より機能が明確で、「フレーム」より日本語として自然である。
- source_word: שְׁנֵי אֲדָנִים
  choice: 台座を二つ
  rationale: 各枠材を支える部材の数を示す。冒頭の「銀の台座」と用語を統一した。
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: その二つのほぞのため
  rationale: 直訳は「その二つの手」だが、ここでは枠材から突き出して台座にはめ込む接合部を指す建築用語であるため、「ほぞ」とした。
- source_word: הָאֶחָד ... הָאֶחָד
  choice: 一枚の枠材……もう一枚の枠材
  rationale: 同じ表現の反復が各枠材への配分を示しているため、自然な日本語で順次の枠材を表した。助数詞「枚」は板状の構造材に適する。
