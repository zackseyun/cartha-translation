  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֣ה בְרִיחִ֗ם לְ/קַרְשֵׁי֙ צֶ֣לַע הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: ja
  text: また、幕屋の第二の側[a]の板のために横木を五本、幕屋の後ろ側、すなわち西側の板のために横木を五本作る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕屋のもう一方の側」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: 横木
  rationale: 幕屋の板を横方向につないで固定する部材を指すため、自然で具体的な「横木」とした。
- source_word: קַרְשֵׁי
  choice: 板
  rationale: 幕屋を構成する木製の構造材を指す。形状を必要以上に限定せず、文脈上明快な「板」とした。
- source_word: צֶלַע
  choice: 側
  rationale: 建築物としての幕屋の側面を表すため、「側」と訳した。
- source_word: הַשֵּׁנִית
  choice: 第二の
  rationale: 語の基本的な意味を保ち、直前に述べられた側に対するもう一方の側を「第二の側」と表した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖所としての移動式の幕を指す定着した日本語聖書用語を用いた。
- source_word: לַיַּרְכָתַיִם
  choice: 後ろ側
  rationale: 幕屋の最奥ないし後方部分を表す語であり、建築上の位置が明確になる「後ろ側」とした。
- source_word: יָמָּה
  choice: 西側
  rationale: 「海の方へ」に由来する西向きの方向表現であり、この配置説明では自然な「西側」とした。
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: また……五本、……五本
  rationale: 前節から続く列挙であることと、二組それぞれ五本という並行構造を日本語で明瞭に示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に通じる、簡潔で品位ある建築指示の文体とした。ヘブライ語本文は前節から続く名詞句だが、日本語では命令の継続を明確にするため、文末に「作る」を補った。「第二の」という原文の表現は本文に残し、文脈上の意味である「もう一方の」を脚注に示した。英語資料の脚注標識には位置と内容の不整合が見られるため、ヘブライ語に即して必要な異訳注のみを付した。
