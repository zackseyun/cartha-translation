  - severity: low
    issue: 「組み立てる」は設置・据え立ての含みをやや狭くする。
    rationale: וַהֲקֵמֹתָ は『立たせる、据え立てる、建てる』であり、幕屋全体を設置する文脈では「建てる」がより包括的で自然である。
  revised_text: あなたが山で見たとおりに、その定めに従って幕屋を建てなさい。
