  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: 組み立てなければならない
  rationale: קוםのヒフィル形で、幕屋を立たせることを命じる文脈。日本語では構造物について自然な「組み立てる」とし、指示の力を「なければならない」で表した。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる移動式の住まいを指す定着した訳語であり、単なる住居との混同を避けられる。
- source_word: כְּמִשְׁפָּטוֹ
  choice: その規定のとおりに
  rationale: מִשְׁפָּטはここでは、幕屋について定められた方式・仕様を指す。「規定」は法的な含みを保ちつつ、所定の造り方という文脈にも適合する。接尾辞の指示は日本語本文では属格関係によって自然に表した。
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: 山で見た
  rationale: ヘブライ語は能動形で直訳すれば「あなたが見た」。神が見せたという文脈上の含意を受動表現で明示せず、原文の言い方を保持した。
- source_word: בָּהָר
  choice: 山で
  rationale: 場所を表す前置詞בを、モーセが山上で見たという日本語として自然な「山で」とした。
