base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/017.yaml
  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: ja
  text: 板一枚ごとに、互いに対応するように組み合わされた二つのほぞを付けなさい[a]。幕屋のすべての板を、このように作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、「一枚の板に二つの手があり、女がその姉妹に対するように組み合わされている」。「女がその姉妹に対するように」は、同種のものが互いに対応することを表す慣用表現である。「手」はここでは接合用の突起、すなわち「ほぞ」を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: ほぞ
  rationale: 直訳は「手」だが、幕屋の板を台座などに接合するための突起を指す建築用語として、現代日本語で明確な「ほぞ」とした。
- source_word: מְשֻׁלָּבֹת
  choice: 組み合う
  rationale: 二つの突起が相互に対応して組み合わされる構造を表す。接合の厳密な仕組みまでは断定せず、受動分詞の構造的な意味を自然な日本語で示した。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 互いに
  rationale: 直訳すれば「女がその姉妹に対するように」だが、同種のもの同士の対応関係を表すヘブライ語の慣用表現なので、「互いに」とした。字義的表現は脚注に残した。
- source_word: קֶרֶשׁ
  choice: 板
  rationale: 幕屋を構成する直立した木製部材を指す。「枠」とすると形状を過度に特定する可能性があるため、透明性の高い「板」とした。
- source_word: מִשְׁכָּן
  choice: 幕屋
  rationale: 語義は「住まい」に関係するが、出エジプト記では移動式の聖所を指す定着した名称であるため、「幕屋」とした。
- source_word: כֵּן תַּעֲשֶׂה
  choice: このように作りなさい
  rationale: すべての板に同じ型を適用するよう命じる表現であり、指示の力を明確な現代日本語で示した。
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: 板一枚ごとに
  rationale: 形式上は「一枚の板に」だが、文脈上は各板への分配的な指示なので、「板一枚ごとに」とした。
