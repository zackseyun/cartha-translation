  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים תְּצַפֶּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹֽתֵי/הֶם֙ תַּעֲשֶׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וְ/צִפִּיתָ֥ אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: ja
  text: その枠[a]には金をかぶせ、その輪は金で作って、横木を通す受け具[b]としなさい。また、その横木にも金をかぶせなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「枠」は「板」とも訳せる。ヘブライ語は幕屋を構成する直立した構造材を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「横木のための家々」。横木を通して保持する部分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: 枠
  rationale: 幕屋を構成する直立した構造材を指す。形状を「板」と断定せず、その構造上の働きを自然な日本語で示すため。
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: 金をかぶせる
  rationale: ピエル形のצפהは、ここでは表面を金で覆う加工を表す。「覆う」より工芸上の意味が明確で、現代日本語としても分かりやすい。
- source_word: זָהָב
  choice: 金
  rationale: 素材を表す通常の語。原文での反復を保った。
- source_word: טַבְּעֹתֵיהֶם
  choice: その輪
  rationale: 枠に取り付けられ、横木を通す金属製の輪を指す。
- source_word: תַּעֲשֶׂה
  choice: 作る
  rationale: עשהの直接的で自然な訳。命令的な未来形を文末の「しなさい」に統合した。
- source_word: בָּתִּים לַבְּרִיחִם
  choice: 横木を通す受け具
  rationale: 直訳は「横木のための家々」。ここでは横木を通して保持する部分を指すため、機能が明瞭な「受け具」とした。
- source_word: הַבְּרִיחִם
  choice: 横木
  rationale: 枠同士を横方向につなぎ留める棒を指すため、「棒」より用途が伝わる「横木」とした。
theological_decisions: []
