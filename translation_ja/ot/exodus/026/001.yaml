base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: ja
  text: また、幕屋を造るために、十枚の幕を作りなさい。撚り合わせた上質の亜麻布と青糸、紫糸、緋色の糸を用い、巧みな意匠によるケルビムの模様を施しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ケルビムの模様を、熟練した職人の工芸として施しなさい」とも訳せる。ヘブライ語の句は、布地に施される巧みで意匠的な工芸を表すが、具体的な技法までは特定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 聖なる住まいである移動式聖所を指す定着した聖書用語であり、文脈上の専門的意味を簡潔に伝える。
- source_word: יְרִיעֹת
  choice: 幕
  rationale: 幕屋を構成する大きな布地のパネルを指す。「幕」は建造物としての用途に合い、現代日本語でも明瞭である。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 上質の撚り糸の亜麻布
  rationale: שֵׁשׁの上質な亜麻布と、מָשְׁזָרの撚った糸という両要素を自然な日本語で表す。
- source_word: תְּכֵלֶת
  choice: 青の糸
  rationale: 幕屋の染色素材を表す色彩語。並列される織物材料であることを日本語では「糸」で明示する。
- source_word: אַרְגָּמָן
  choice: 紫の糸
  rationale: 紫に染めた素材を指す。色名を保ち、文脈に即して「糸」を補う。
- source_word: תֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 緋色ないし深紅に染めた糸を指す定型句。「緋色」は祭具の荘重な文脈にも合う明瞭な訳語である。
- source_word: כְּרֻבִים
  choice: ケルビム
  rationale: 聖所に関わる天的存在の専門名称を音写し、現代の幼児的な天使像との混同を避ける。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 意匠を凝らして……織り出す
  rationale: 計画された巧みな織物細工を表す句であり、ケルビムの図柄が布地に施されることを自然に示す。ただし技法の厳密な特定には幅があるため脚注を付す。
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: また、……造りなさい
  rationale: 接続詞による一連の指示の継続を「また」で示し、命令の力を自然な現代日本語で表す。
- source_word: אֹתָם
  choice: （複数の幕を目的語として表現）
  rationale: ヘブライ語の複数代名詞は十枚の幕を受ける。日本語では末尾に「それらを」と重ねず、文全体の目的語として自然に含める。
