  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: ja
  text: その垂れ幕を、金をかぶせたアカシア材の四本の柱に掛ける。その鉤は金で、柱は四つの銀の台座[a]の上に立つ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「銀の受け口（ソケット）」。
    reason: アドニム（אַדְנֵי）は柱を支える台座のほか、柱を差し込む受け・ソケット状の部材を指し得るため。
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: その垂れ幕を…掛ける
  rationale: נתןの基本義は「置く」だが、目的語が前節の垂れ幕で、柱との関係を述べる文脈なので、日本語では機能を明確にする「掛ける」が自然である。女性単数代名詞は指示対象を明示して「その垂れ幕」とした。
- source_word: עַל אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: 四本のアカシア材の柱に
  rationale: עמודは幕を支える直立材なので「柱」とし、שׁטיםは生木ではなく建材を指すため「アカシア材」とした。
- source_word: מְצֻפִּים זָהָב
  choice: 金をかぶせた
  rationale: צפהの受動分詞は表面を金で覆うことを示す。「金張りの」も可能だが、平明で具体的な表現を選んだ。
- source_word: וָוֵיהֶם זָהָב
  choice: 柱の鉤は金で作り
  rationale: וָוִיםは垂れ幕を掛ける金具を指すため「鉤」とした。ヘブライ語は名詞文だが、前後の施工指示に合わせて自然な日本語の命令表現にした。
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: 柱は四個の銀の台座の上に据える
  rationale: אדןは柱を支える基部または差し込み式の受けを指す。「台座」は現代日本語で理解しやすく、עַלの空間関係も「上に据える」で明示した。
theological_decisions: []
