  naturalness: 現行文も理解可能ですが、「柱の鉤は金で作り、柱は…据える」は並列する動作指示としてやや不自然で、原文の名詞的な材質・配置の列挙を弱めています。「鉤が金で、四つの銀の台座の上に立つ」とすれば、明快で自然です。
  terminology: 「垂れ幕」「アカシア材」「柱」「鉤」「台座」は明瞭で現代標準日本語として適切です。「アカシア材の四本の柱」と語順を整え、「四個」より建築部材に自然な「四つ」を用います。脚注の「受け台」は許容されますが、「受け口（ソケット）」のほうが代替訳の意味を具体的に示せます。
