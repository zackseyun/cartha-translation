id: EXO.25.18
reference: Exodus 25:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ שְׁנַ֥יִם כְּרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ תַּעֲשֶׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: ja
  text: また、金で二つのケルビムを作りなさい。それらを、贖いの蓋[a]の両端から、打ち出し細工として作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの蓋」は契約の箱を覆う金の蓋を指す。「贖いの座」とも訳される。
    reason: 語義上の別訳と祭儀的用語を示すため。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞を伴う完了形は、一連の製作指示における命令として機能している。現代日本語の自然な指示表現にした。
- source_word: שְׁנַיִם כְּרֻבִים
  choice: 二つのケルビム
  rationale: 数詞を明示し、特定の天的存在を表す伝統的な音写「ケルビム」を用いた。
- source_word: זָהָב
  choice: 金で
  rationale: 材料を表す語として、簡潔で自然な日本語にした。
- source_word: מִקְשָׁה
  choice: 打ち出し細工で
  rationale: 金属を打って成形する製法を表す。「一続きに」は文脈上考えられる含意だが、語義以上に限定しないよう本文には加えなかった。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: それらを…作りなさい
  rationale: 原文が動詞を繰り返して製法と位置を指示しているため、日本語でも反復を保った。
- source_word: מִשְּׁנֵי קְצֹוֹת
  choice: 両端に
  rationale: 蓋の二つの端との位置・起点関係を自然な日本語で示し、像が蓋と一体か、単に端に置かれるかを必要以上に決めない表現とした。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱を覆う物体であることと、祭儀的な贖いとの結びつきの両方を明確にする表現を採用した。
theological_decisions:
- issue: הַכַּפֹּרֶת の祭儀的名称
  choice: 贖いの蓋
  alternative: 贖いの座／蓋
  rationale: この語は契約の箱の金の覆いを指す一方、贖いと神の臨在に深く結びつく。「贖いの蓋」は物体としての性質と祭儀的意味を併せて伝える。「贖いの座」も伝統的に可能だが、実際の形状を誤解させるおそれがあるため本文では採らず、語の指示対象を脚注で補った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、幕屋製作の指示にふさわしい簡潔で品位ある命令調を保った。専門的な祭儀語「ケルビム」と「贖いの蓋」は保持し、脚注で後者を説明した。
