lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: 雄羊の皮
  rationale: עֹרֹת は材料としての動物の皮、אֵילִם は雄羊の複数形を表す。日本語では材料名として自然な「雄羊の皮」とした。
- source_word: מְאָדָּמִים
  choice: 赤く染めた
  rationale: 皮が赤くされたことを示す形であり、単に自然な赤色だったという意味を避け、加工を明確に表した。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 上質の革[a]
  rationale: תְּחָשִׁים が指す動物または皮革の種類は確定できないため、特定の海獣名を本文に採らず、幕屋の覆いに用いる加工皮革として読みやすく訳した。不確かさは脚注で明示した。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: שִׁטִּים は一般にアカシアと同定され、材料一覧にふさわしい自然な日本語として「アカシア材」とした。
