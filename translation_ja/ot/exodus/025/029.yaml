  to: また、その皿、小皿、注ぎ用の器、および鉢を作りなさい。それらを用いて注ぎの供え物を注ぐ。これらを純金で作りなさい。
  rationale: 稀語の器名について形状や内容物を過度に特定しないよう「水差し」を「注ぎ用の器」に改めた。また、複数形の関係節を独立した文として訳し、注ぎの供え物との関係を特定の器一つに限定しないようにした。
