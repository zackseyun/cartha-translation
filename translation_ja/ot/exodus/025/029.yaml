  naturalness: 列挙の後に「それらを用いて注ぎの供え物を注ぐ」と一文を分けることで、現代標準日本語として読みやすく、複数形の関係節の係り先も不自然に限定しない。
  terminology: 「純金」は適切である。「皿」「小皿」は二つの器具名を無理なく区別する。「注ぎ用の器」は形状を確定できない稀語に対して安全であり、「水差し」より中立的である。
