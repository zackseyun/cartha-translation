base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: ja
  text: また、その皿、小皿、注ぎ用の器、および鉢を作りなさい。それらを用いて注ぎの供え物を注ぐ。これらを純金で作りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: その皿
  rationale: קְעָרָהは平たい器や皿を指す。供えのパンの机に属する器具として、現代日本語で自然な「皿」とした。
- source_word: כַפֹּתָיו
  choice: 小皿
  rationale: כַּףは本来「手のひら」を意味し、そこから手のひら形の小型容器を指し得る。前の「皿」と区別しつつ、用途を断定しすぎない訳語とした。
- source_word: קְשׂוֹתָיו
  choice: 水差し
  rationale: 祭儀用容器を指すまれな語で、厳密な形状は不明だが、液体を入れて注ぐ器と考えられるため、分かりやすい「水差し」とした。
- source_word: מְנַקִּיֹּתָיו
  choice: 鉢
  rationale: 注ぐ祭儀に用いる容器を指す語だが、正確な形状は確定しにくい。「鉢」は広口の容器を表しつつ、杯などに限定しない。
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: 注ぎの供え物を注ぐための
  rationale: נסךの受動形は祭儀で液体を注ぐことを表す。日本語では目的を明確にするため「注ぎの供え物」を補った。関係節は直前の複数の液体用容器に関わり得る。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 幕屋の器具の材質指定として定着し、簡潔で自然な訳語である。
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: 作りなさい……これらを……作りなさい
  rationale: 二人称単数の指示と、一覧を囲む動詞の反復を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な命令文としながら、「作る」の反復を残して原文の構造を保った。器具名は古風な専門語を避け、確定できない形状については脚注で代案と不確実性を示した。
