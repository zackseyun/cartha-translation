base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: ja
  text: また、その七つの灯を作りなさい。彼は[b]その七つの灯を据え、燭台の前方を照らすようにする[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その七つの灯をともす」。ヘブライ語の動詞は字義的には「上らせる」で、この文脈では、灯を所定の位置に据えることも、火をともすことも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 原文はここで三人称男性単数の「彼」に移る。燭台の灯を管理する祭司を指す可能性があるが、この節では主語が明記されていない。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作りなさい
  rationale: 接続詞を伴う完了形だが、幕屋造営の指示という文脈に即して、モーセへの命令として自然な現代日本語にした。
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: その七つの灯
  rationale: נֵרはここでは燭台に備える個々の灯を指す。「ランプ」よりも聖所の調度品にふさわしく、かつ現代語として通じる「灯」を採った。女性単数接尾辞は燭台を受ける。
- source_word: וְהֶעֱלָה
  choice: 彼は……その灯を据える
  rationale: עלהのヒフィル形は字義的には「上らせる」で、祭儀用の灯については据えることにも、ともすことにも解し得る。本文では不自然な直訳を避けつつ、後続の「照らす」と動作を区別できる「据える」を採用し、別解を脚注に残した。動詞の三人称男性単数も「彼は」と明示した。
- source_word: וְהֵאִיר
  choice: それらが……照らすように
  rationale: 照明という目的・結果を自然に示すため、灯を複数主語として補い、「照らすように」と表現した。
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: 燭台の前方
  rationale: עֵבֶרとפָּנִיםの組み合わせが示す、燭台の正面側への光の方向を簡潔に表した。代名詞だけでは日本語で指示対象が曖昧になるため「燭台」を補った。
theological_decisions:
- issue: 「灯を上らせる」の具体的意味
  choice: 本文では「灯を据える」
  alternative: 「灯をともす」
  rationale: ヘブライ語は設置と点火の双方を含み得るため、一方を唯一の意味として断定せず、語義上の別解を脚注に示した。
- issue: 三人称男性単数の無名の主語
  choice: 「彼は」と保持する
  alternative: 主語を省く、または祭司と明記する
  rationale: 原文は主語を名指ししていない。祭司を指す可能性は高いが、本文で特定せず、原文の主語交替と曖昧さを保った。
translation_notes:
  register: 明快な現代標準語を用いながら、聖所の調度品を扱う箇所にふさわしい簡潔で品位ある文体とした。「彼」を省略せず、原文にある二人称から三人称への移行を保持した。
