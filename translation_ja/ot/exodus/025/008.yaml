  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: ja
  text: 彼らに、わたしのための聖所を造らせなさい。そうすれば、わたしは彼らの間に住む[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らのただ中に」。ヘブライ語の語尾は複数形であり、神が聖所という建物の中だけでなく、民の間に住むことを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 彼らに……造らせよ
  rationale: 接続詞を伴う完了形は、この指示の文脈では命令・義務の意味を担う。三人称複数を保ちつつ、現代日本語で明確な指示として表した。
- source_word: לִי
  choice: わたしのための
  rationale: 前置詞 ל と一人称単数接尾辞は、ここでは目的・受益を示すため、「わたしのための」とした。
- source_word: מִקְדָּשׁ
  choice: 聖所
  rationale: 神の臨在のために聖別された場所を指す。幕屋建設の文脈に適し、簡潔で定着した日本語である。
- source_word: וְשָׁכַנְתִּי
  choice: そうして、わたしは……住む
  rationale: שׁכן は「住む、定住する」の意。接続詞 וְ が示し得る連続・結果を「そうして」で表し、目的だけに限定せず、神の宣言としての響きも保った。
- source_word: בְּתוֹכָם
  choice: 彼らの間に
  rationale: 直訳は「彼らのただ中に」。複数接尾辞を明確に反映し、神が建造物の中だけでなく民の間に住むことを自然な現代日本語で示した。
theological_decisions:
- issue: 神が住む場所の指示対象
  choice: 彼らの間に
  alternative: その中に／彼らのただ中に
  rationale: ヘブライ語の接尾辞は複数形であり、聖所を指す単数の「その中に」ではなく、民を指す「彼らの間に」と訳す。これにより、神の臨在を建造物だけに限定せず、イスラエルの民と共にあることを本文どおりに保つ。
- issue: 二つの節の論理関係
  choice: そうして
  alternative: そして／わたしが住むために
  rationale: 接続詞 וְ は文脈上、連続、結果、目的に近い関係を含み得る。「そうして」は聖所建設と神の臨在の結びつきを示しながら、目的節だけに意味を固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」は神の一人称として平明にし、「聖所」は文脈に即した定着語を用いた。
