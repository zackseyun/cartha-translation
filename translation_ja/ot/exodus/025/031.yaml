source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: ja
  text: また、純金の燭台を作りなさい。燭台は打ち出し細工で作る。その台座と幹、杯、つぼみ[a]、花は、すべて燭台と一体に作る[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つぼみ」は「こぶ」とも訳せる。ヘブライ語は、花を模した意匠にある丸い突起状の装飾を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「それから出るものとなる」。各部分を別々に作って取り付けるのではなく、燭台そのものから一体として作ることを表す。
    reason: construction_clarification
lexical_decisions:
- source_word: מְנֹרַת
  choice: 燭台
  rationale: 灯火そのものではなく、それを載せる器具を指す。日本語の聖書文脈で通用し、簡潔で品位のある「燭台」とした。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 精錬された混じり物のない金を表す自然で標準的な日本語。
- source_word: מִקְשָׁה
  choice: 打ち出し細工
  rationale: 金属を槌で打って成形する製法を表す。単なる装飾加工ではなく、一つの素材から打ち出す含意も保つ。
- source_word: יְרֵכָהּ
  choice: 台座
  rationale: 字義は「腿、側部」だが、器物については下部の支えを指すため、「台座」が明確で自然。
- source_word: וְקָנָהּ
  choice: 幹
  rationale: ここでは燭台の中央の軸を指す。後続する枝との植物的な造形上のつながりも伝わる「幹」とした。
- source_word: גְּבִיעֶיהָ
  choice: 杯
  rationale: 杯状の装飾部分を指す。形を簡潔に示し、後節の植物意匠とも両立する。
- source_word: כַּפְתֹּרֶיהָ
  choice: つぼみ
  rationale: 丸く突き出た装飾を指し、「こぶ」とも訳し得るが、花と並ぶ植物的意匠を自然に示す「つぼみ」を本文に採用した。
- source_word: וּפְרָחֶיהָ
  choice: 花
  rationale: 燭台の花形装飾を明瞭かつ自然に表す。
- source_word: מִמֶּנָּה יִהְיוּ
  choice: 燭台と一体になるようにする
  rationale: 各部分が別に作って取り付けられるのではなく、燭台そのものから形成されることを明確に示す。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、祭具についての指示にふさわしい簡潔で荘重な調子とした。「メノラー」という音写は避け、「燭台」を用いた。命令文と製作仕様を区別し、「作りなさい」「作る」「一体になるようにする」と自然に展開した。
