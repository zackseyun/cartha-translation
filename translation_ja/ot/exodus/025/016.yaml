  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: ja
  text: あなたは、わたしがあなたに与える証し[a]を箱の中に納めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、より具体的には「証しの板」を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 納めなさい
  rationale: נתןは広く「与える、置く」を意味するが、容器である箱に物を入れる文脈では「納める」が自然で、保管する含意にも適する。接続詞וְは一連の指示をつなぐが、日本語では独立した「そして」を置かない方が自然である。
- source_word: אֶל
  choice: の中に
  rationale: 本来は「〜へ」を表すが、נתןおよび容器を指すאָרוןとの組み合わせでは、内部への移動を示す。
- source_word: הָאָרֹן
  choice: 箱
  rationale: אָרוןはここで聖所に置かれる特別な箱を指す。「契約の箱」は文脈上の呼称として一般的だが、この節の原文には「契約」がないため補わない。
- source_word: הָעֵדֻת
  choice: あかし
  rationale: עֵדוּתの基本的な語義である「証言、あかし」を保ち、本文だけでは明示されない石の板まで本文中で特定しない。宗教的文脈で定着した語として平仮名表記を用いる。
- source_word: אֲשֶׁר
  choice: （わたしが与える）
  rationale: 関係節を前置修飾として自然な日本語に組み替えた。
- source_word: אֶתֵּן
  choice: わたしが与える
  rationale: Qal未完了形一人称単数を、後に神がモーセへ授ける行為として「与える」と訳す。
- source_word: אֵלֶיךָ
  choice: （あなたに）
  rationale: 日本語では主節の主語「あなた」と文脈から受け手が明白であるため、重複を避けて表面上は省略したが、「わたしがあなたに与える」の意味を保持する。
theological_decisions:
- issue: 「あかし」が何を指すか
  choice: 本文では「あかし」と一般的に訳す。
  alternative: 「あかしの板」または「契約の板」と明示する。
  rationale: より広い文脈では石の板を指すことが明らかになるが、この節のヘブライ語はהָעֵדֻתとのみ述べている。本文では原文の表現と余地を保ち、具体的な指示対象は脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある命令文とした。「入れなさい」よりも、聖なる箱に保管する文脈に適した「納めなさい」を採用した。脚注記号[a]は本文中の「あかし」に付した。
