  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: ja
  text: それに、周囲を囲む手の幅一つ分の枠を作り、その枠の周囲に金の飾り縁[a]を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「金の冠」。ヘブライ語は装飾的な縁取りや繰り形を指すことができ、「冠」は伝統的な訳語。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: 枠
  rationale: 机に取り付ける構造的な囲いを指すため、現代日本語で自然かつ具体的な「枠」とした。
- source_word: טֹפַח
  choice: 手のひら一つ分の幅
  rationale: 古代の長さの単位「一手幅」を、一般の読者に意味が伝わる自然な表現で示した。
- source_word: סָבִיב
  choice: 周囲に／周りに
  rationale: 二度の反復を保ちつつ、日本語として自然になるよう表現をわずかに変えた。
- source_word: זֵר
  choice: 飾り縁
  rationale: 幕屋の調度品に設ける装飾的な縁を表す語として理解しやすい。「冠」という伝統的な訳語も可能なので脚注に残した。
- source_word: זָהָב
  choice: 金の
  rationale: 材質を示す名詞として直接的に訳した。
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: そのために／その枠の
  rationale: 接尾代名詞が文脈上の机を受けることを保ち、机を不必要に補わず日本語の指示表現で結び付けた。
- source_word: וְעָשִׂיתָ
  choice: 作り／作りなさい
  rationale: 命令的な指示を明確にし、同じ動詞の反復も保った。
