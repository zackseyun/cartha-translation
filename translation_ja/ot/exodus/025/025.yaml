  register: 明瞭で現代的な標準日本語を用い、幕屋建設の指示にふさわしい簡潔で格調ある命令文とした。英語資料では脚注記号の位置が寸法表現の後にあるが、脚注内容は זֵר の訳に関するため、日本語本文では「飾り縁」の直後に置いた。
