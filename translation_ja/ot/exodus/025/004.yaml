  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goat hair[b],
translation:
  language: ja
  text: 青色の糸[a]、紫色の糸、緋色の糸、上質の亜麻布、やぎの毛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 青紫色、または紫がかった青とも訳せる。原語は、その色に染めた糸や布などの素材を指す。
    reason: lexical_alternative
  - marker: b
    text: 原文では字義的には「やぎ」。ここでは、やぎから取る織物用の毛を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכֵלֶת
  choice: 青紫色の糸
  rationale: 青から紫がかった青の染料・染色素材を指す語。幕屋用の織物材料の一覧なので、色彩の幅を保ちつつ素材を明示した。
- source_word: אַרְגָּמָן
  choice: 赤紫色の糸
  rationale: 高価な紫系の染色素材を指す。תְּכֵלֶתとの色の違いが伝わるよう「赤紫色」とした。
- source_word: תוֹלַעַת שָׁנִי
  choice: 緋色の糸
  rationale: 昆虫由来の染料で染めた緋色の素材を指す慣用表現。字義どおりの「虫」ではなく、文脈上の織物材料として訳した。
- source_word: שֵׁשׁ
  choice: 上質の亜麻布
  rationale: 幕屋の記事では上質な亜麻の織物を指す。「より糸」と限定せず、自然な材料名とした。
- source_word: עִזִּים
  choice: やぎの毛
  rationale: 原文は字義的には「やぎ」だが、材料一覧では幕を織るためのやぎの毛が意図されている。
theological_decisions: []
translation_notes:
  register: 材料を列挙する簡潔な節として、現代の一般読者に分かりやすい語を用いた。色名には「色の糸」を補い、前三項が幕屋用の染色繊維であることを明確にした。
