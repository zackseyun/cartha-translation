  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: ja
  text: あなたがたが彼らから受け取る奉納物は、次のとおりである。金、銀、青銅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「銅」。ヘブライ語 נְחֹשֶׁת は、文脈によって銅または青銅を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: 次のとおりである
  rationale: 接続詞と指示代名詞による提示の働きを、続く一覧を自然に導入する現代日本語で表した。
- source_word: הַ/תְּרוּמָה
  choice: 奉納物
  rationale: 聖所のために取り分けて差し出す物資を指すため、「捧げ物」よりも物品としての寄進の意味が明確な「奉納物」とした。
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: あなたがたが彼らから受け取る
  rationale: לקח の基本義は「取る」だが、民が自発的に差し出す物を集める文脈に合わせ、「受け取る」とした。二人称複数と「彼らから」を保持した。
- source_word: זָהָב
  choice: 金
  rationale: 材質を表す標準的な訳語。
- source_word: וָ/כֶסֶף
  choice: 銀
  rationale: 材質を表す標準的な訳語。
- source_word: וּ/נְחֹשֶׁת
  choice: 青銅
  rationale: 幕屋の資材一覧における加工金属として慣用的で有力な意味を採用した。ただし語は銅または銅合金を広く指し得るため、別訳を脚注に残した。
