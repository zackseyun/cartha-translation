  text: וְ/עָשִׂ֥יתָ שֻׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: ja
  text: また、アカシア材で机を作りなさい。[a] その長さは二キュビト、幅は一キュビト、高さは一キュビト半とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「そして、あなたは作りなさい」。ヘブライ語の接続詞は、この指示が前の命令に続くことを示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞付きの完了形は、一連の指示の中で命令の働きをする。「また」で前の命令とのつながりを示し、「作りなさい」で指示の力を明確にした。
- source_word: שֻׁלְחָן
  choice: 机
  rationale: 祭具として用いる家具を指す。現代日本語で簡潔かつ自然な名称として「机」を採用した。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 構文上は「アカシアの木材」の意であり、材料を表す自然な日本語とした。
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: その長さは二キュビト
  rationale: 原文の名詞的な寸法表現を保ち、古代の度量衡も換算せず「キュビト」とした。
- source_word: וְאַמָּה רָחְבּוֹ
  choice: 幅は一キュビト
  rationale: 接尾辞付き名詞「その幅」を、日本語の寸法列挙として自然に表した。
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: 高さは一キュビト半
  rationale: 家具の寸法なので קֹמָה は「高さ」とし、原文の「一キュビトと半分」を簡潔な「一キュビト半」で表した。
