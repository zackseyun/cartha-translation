base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/013.yaml
  text: You shall make poles of acacia wood and overlay them with gold.
translation:
  language: ja
  text: アカシア材で担ぎ棒を作り、それらを金で覆いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作り……なさい
  rationale: 接続詞を伴う完了形は、幕屋造営の指示が連続する文脈で命令を表す。現代日本語では「作り……なさい」として、後続の動作と自然につないだ。
- source_word: בַדֵּי
  choice: 担ぎ棒
  rationale: 契約の箱を運ぶための複数の棒を指すため、単なる「棒」より用途が明確な「担ぎ棒」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 樹種を示す連語であり、現代日本語で簡潔かつ自然な材木名として表した。
- source_word: וְצִפִּיתָ
  choice: 覆いなさい
  rationale: 木製の棒の表面を金で被覆することを表す。専門的になりすぎず、工芸上の意味も伝わる「覆う」を選んだ。
- source_word: אֹתָם
  choice: それらを
  rationale: 複数形の目的語代名詞で、直前の複数の担ぎ棒を受ける。日本語でも複数への照応を明示した。
- source_word: זָהָב
  choice: 金で
  rationale: 被覆に用いる材料を表すため、日本語では手段・材料を示す助詞「で」を添えた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な命令文としつつ、神からモーセへの造営指示にふさわしい端正さを保った。「担ぎ棒」により用途を自然に示し、原文の複数形は「それら」で保持した。
