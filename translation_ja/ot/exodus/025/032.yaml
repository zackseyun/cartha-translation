  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: ja
  text: また、六本の枝がその両側から伸び出る。すなわち、燭台の一方の側から三本の枝が、もう一方の側[a]から三本の枝が伸び出る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「第二の側」。
    reason: 原文の序数表現を示しつつ、本文では自然な対照表現「もう一方の側」を採用したため。
lexical_decisions:
- source_word: קָנִים / קְנֵי מְנֹרָה
  choice: 枝／燭台の枝
  rationale: この文脈では、燭台の側面から張り出す部分を指す。植物的な意匠とも調和し、現代日本語で自然な「枝」とした。
- source_word: יֹצְאִים
  choice: 伸び出る
  rationale: 側面を起点として外へ出ている形状を表す分詞。「出る」だけより物体の延伸を明瞭に示す。
- source_word: מִצִּדֶּיהָ
  choice: その両側から
  rationale: 原文は複数形「その側々から」。後半で一方ともう一方が示されるため、日本語では「両側」とするのが明確で自然。
- source_word: מְנֹרָה
  choice: 燭台
  rationale: 灯火を載せる器具を指す一般名詞として、宗教的音写を避け、簡潔で定着した訳語を用いた。
- source_word: מִצִּדָּהּ הָאֶחָד ... מִצִּדָּהּ הַשֵּׁנִי
  choice: 一方の側から……もう一方の側から
  rationale: 字義的には「第一（一つ）の側……第二の側」。対をなす二側面の対照を、現代日本語で自然に表した。
theological_decisions: []
