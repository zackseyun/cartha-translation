reference: Exodus 25:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נוֹעַדְתִּ֣י לְ/ךָ֮ שָׁם֒ וְ/דִבַּרְתִּ֨י אִתְּ/ךָ֜ מֵ/עַ֣ל הַ/כַּפֹּ֗רֶת מִ/בֵּין֙ שְׁנֵ֣י הַ/כְּרֻבִ֔ים אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת אֵ֣ת כָּל אֲשֶׁ֧ר אֲצַוֶּ֛ה אוֹתְ/ךָ֖ אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: ja
  text: そこで、わたしはあなたと会い、証しの箱の上にある二つのケルビムの間、贖いの蓋[a]の上から、イスラエルの子らに向けて[b]わたしがあなたに命じるすべてのことを、あなたに語る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの蓋」は、証しの箱を覆う金の蓋を指す。単に「蓋」とも訳せ、伝統的には「贖罪所」や「恵みの座」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: または「イスラエルの子らのために」あるいは「イスラエルの子らに」。ヘブライ語は直訳すると「イスラエルの子らへ／のために」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: そこで、わたしはあなたと会い
  rationale: נעד（ニファル）の、定められた場所で会うという意味を自然な現代日本語で表した。「そこで」は直前に記された箱と贖いの蓋を指す。
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: あなたと語る
  rationale: 前置詞 אֵת の相互的・直接的な響きを保ち、単なる一方的伝達に狭めない表現とした。
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: 贖いの蓋の上から
  rationale: כַּפֹּרֶת は箱を覆う金製の物体であり、祭儀上の贖いとの結びつきもあるため、「贖いの蓋」とした。מֵעַל は語りかけの発する位置を示す。
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: 二つのケルビムの間
  rationale: 空間関係を直接的に訳し、כְּרוּבִים は特定の天的存在を指す慣用的音写「ケルビム」で表した。
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: 証しの箱の上にある
  rationale: עֵדֻת を解釈的に「契約の板」と限定せず「証し」とし、אֲרוֹן は文脈に即して「箱」とした。
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: わたしがあなたに命じるすべてのことを
  rationale: כָּל の包括性と、神がモーセに直接命じる構文を保った。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに向けて
  rationale: אֶל の方向性を保ちつつ、命令の最終的な宛先がイスラエルであることを自然な日本語で示した。בְּנֵי の家族的表現も「子ら」として残した。
theological_decisions:
- issue: הַכַּפֹּרֶת の訳語
  choice: 贖いの蓋
  alternative: 蓋／贖罪所／恵みの座
  rationale: 物体として箱の蓋であることと、贖いに関わる祭儀的重みの双方を示す。単なる「蓋」では後者が薄れ、「贖罪所」「恵みの座」では物体的意味が見えにくくなる。
- issue: אֶל בְּנֵי יִשְׂרָאֵל の係り方
  choice: イスラエルの子らに向けて
  alternative: イスラエルの子らのために／イスラエルの子らに
  rationale: ヘブライ語の簡潔な方向表現には、命令がイスラエルに向けられること、または彼らのためであることの幅がある。本文では方向性を示し、脚注で代案を残した。
- issue: 神が語る位置
  choice: 二つのケルビムの間、贖いの蓋の上から
  alternative: 贖いの蓋の上、二つのケルビムの間から
  rationale: 原文の二つの空間句をともに保持し、神の姿や所在について本文以上の具体化を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「わたし」を用いて神の直接話法を示し、「ケルビム」「証しの箱」「贖いの蓋」など必要な祭儀用語は保ちながら、文を二つに分けて読みやすくした。
