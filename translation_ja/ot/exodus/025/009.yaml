base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: ja
  text: わたしがあなたに示しているすべて、すなわち幕屋の型と、そのすべての備品の型のとおりに、造りなさい。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「型」は「設計」「ひな型」「模型」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「造りなさい」に当たるヘブライ語は複数形で、モーセと、製作を担う人々に向けられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのものに、正確に従って
  rationale: כְּ と כֹּל אֲשֶׁר の組み合わせが示す全面的な対応を自然な日本語で表し、後続する詳細な指示に求められる厳密さも伝える。
- source_word: מַרְאֶה
  choice: 示している
  rationale: 分詞の継続的・進行的な意味を反映し、神がモーセに今まさに提示している啓示の場面を表す。
- source_word: תַּבְנִית
  choice: 型
  rationale: 形状、ひな型、設計を含み得る語義の幅を保ちつつ、単なる言語的な計画とも物理的な模型とも限定しない表現である。
- source_word: הַמִּשְׁכָּן
  choice: 幕屋
  rationale: 出エジプト記における聖なる移動式礼拝所を指す、日本語聖書で定着した明瞭な訳語である。
- source_word: כָּל כֵּלָיו
  choice: そのすべての備品
  rationale: 器、道具、調度を含む כֵּלִים の広い意味を、幕屋の文脈に即して過度に限定せず自然に表す。
- source_word: וְכֵן
  choice: 従って造りなさい
  rationale: 示された型と同じ仕方で実行するよう命じる帰結・様態を、日本語の文全体に自然に組み込んだ。
- source_word: תַּעֲשׂוּ
  choice: 造りなさい
  rationale: 建造物と備品の製作を含む文脈なので「造る」とした。ヘブライ語が複数形であることは日本語本文では表せないため脚注で明示する。
theological_decisions:
- issue: תַּבְנִית が天上の原型を明示するか
  choice: 型
  alternative: 設計、ひな型、模型
  rationale: 本文は神が型を示すと述べるが、その型の存在様態を明確には定義しない。「型」は天上の原型である可能性を残しつつ、それを訳文で断定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の指示としての荘重さを保つ文体。「すなわち」で提示内容を明確にし、「正確に従って」で原文の厳密な対応関係を表した。
