  text: その机に純金をかぶせ、その周囲に金の飾り縁[a]を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「金の縁」「金の縁飾り」。ヘブライ語は装飾を施した縁を指しうる。伝統的に「冠」と訳されることもあるが、ここでは机の周囲を巡る装飾的な縁を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: その机を…覆い
  rationale: צפהは木製の物に金属をかぶせることを表す。目的語の代名詞は前節の机を指すため、日本語では指示対象を明示した。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 高純度の金を指す定着した自然な表現である。
- source_word: וְעָשִׂיתָ לּוֹ
  choice: …作りなさい
  rationale: עשהの基本義を保ち、神からモーセへの製作指示として自然な命令表現にした。לּוֹの関係は、飾り縁を机の周囲に作るという構文全体で明確にした。
- source_word: זֵר זָהָב
  choice: 金の飾り縁
  rationale: זֵרはここでは机を巡る装飾的な縁を指す。「冠」では現代日本語で誤解を招きやすいため、家具製作の文脈が伝わる「飾り縁」とした。
- source_word: סָבִיב
  choice: 周囲に
  rationale: 机の四方を取り巻くことを、簡潔で自然な現代日本語で表した。
