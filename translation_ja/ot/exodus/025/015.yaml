  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: ja
  text: 棒は箱の環に通したままにしておき、箱から抜いてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: 環に通した
  rationale: 前置詞 בְּ は位置を示し、棒が環の内側にあることを表す。日本語では実際の配置が明確になる「環に通した」が自然である。
- source_word: הָאָרֹן
  choice: 箱
  rationale: אָרוֹן はこの文脈で幕屋の聖具である箱を指す。日本語では簡潔で伝統的にも理解しやすい「箱」とし、原文にない「契約の」は補わない。
- source_word: יִהְיוּ
  choice: 通したままにし
  rationale: 直訳は「ある」であるが、後続の禁止と合わせると継続的な設置を命じている。「ままにし」でその持続性を自然に表した。
- source_word: הַבַּדִּים
  choice: 棒
  rationale: בַּדִּים は箱を担ぐための棒を指す。直前の文脈で用途が示されるため、簡潔な「棒」が適切である。
- source_word: לֹא יָסֻרוּ
  choice: 抜いてはならない
  rationale: סוּר は離れる、取り去られる意。環に通した棒についての規定なので、日本語では「抜く」が具体的で自然である。
- source_word: מִמֶּנּוּ
  choice: 箱から
  rationale: 男性単数の接尾辞は複数形の「環」ではなく「箱」を受ける。指示対象を明確にするため名詞を繰り返した。
