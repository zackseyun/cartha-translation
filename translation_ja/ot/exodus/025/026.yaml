  text: וְ/עָשִׂ֣יתָ לּ֔/וֹ אַרְבַּ֖ע טַבְּעֹ֣ת זָהָ֑ב וְ/נָתַתָּ֙ אֶת הַ/טַּבָּעֹ֔ת עַ֚ל אַרְבַּ֣ע הַ/פֵּאֹ֔ת אֲשֶׁ֖ר לְ/אַרְבַּ֥ע רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: ja
  text: また、そのために金の輪を四つ作り、その四つの脚のところにある四隅[a]に、輪を取り付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「四隅」は、「四つの側面」または「四つの縁」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 接続詞を伴う完了形は、一連の製作指示の中で命令の働きをする。現代日本語として自然な指示表現にした。
- source_word: לּוֹ
  choice: そのために
  rationale: 男性単数接尾辞は文脈上、前節までの机を指す。日本語では非人称の対象として「そのために」とした。
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: 金の輪を四つ
  rationale: 材質と個数を明確にしつつ、自然な日本語の語順にした。
- source_word: וְנָתַתָּ
  choice: 取り付けなさい
  rationale: נתן の基本義は「置く」だが、家具に輪を設ける製作文脈では、単に載せるのでなく所定の位置に固定することを自然に表す「取り付ける」が適切である。
- source_word: עַל
  choice: に
  rationale: 輪を配置する箇所を示す日本語として「に」が自然であり、動詞「取り付ける」とよく結び付く。
- source_word: אַרְבַּע הַפֵּאֹת
  choice: 四隅
  rationale: פֵּאָה は端、側面、隅を表し得る。四本の脚との位置関係を述べる家具の記述では「四隅」が最も自然だが、語義の幅は脚注に残した。
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: その四つの脚のところにある
  rationale: רֶגֶל は足または脚を意味する。家具については日本語の「脚」が自然であり、関係節は四隅と四本の脚との位置的な結び付きを表すよう訳した。
theological_decisions: []
translation_notes:
  register: 幕屋の調度品に関する厳粛な製作指示としての品位を保ちながら、現代の一般読者に明瞭な表現とした。「輪」は金具として理解できる文脈に置き、「脚」を用いて家具であることを自然に示した。
