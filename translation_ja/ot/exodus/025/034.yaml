lexical_decisions:
- source_word: וּבַמְּנֹרָה
  choice: また、燭台には
  rationale: 接続詞と前置詞を自然な日本語にし、器具そのものを指す מְנֹרָה を「燭台」とした。
- source_word: אַרְבָּעָה גְבִעִים
  choice: 杯が四つ
  rationale: גְבִעִים は杯状の装飾部分を指すため、簡潔で形状も伝わる「杯」とした。
- source_word: מְשֻׁקָּדִים
  choice: アーモンドの花をかたどった
  rationale: アーモンドに由来する意匠を表す語であり、形か装飾かを過度に限定せず、花の意匠を自然に表した。
- source_word: כַּפְתֹּרֶיהָ
  choice: それぞれに節
  rationale: 丸みのある装飾部分を指す。植物を模した燭台の文脈に合う「節」を採用したが、「球飾り」も可能である。接尾辞の単数女性形は燭台を受ける一方、構造上は各杯に伴う装飾として自然な日本語に整えた。
- source_word: וּפְרָחֶיהָ
  choice: と花を付ける
  rationale: פֶּרַח の基本義を「花」とし、前の装飾要素と並列して表した。
