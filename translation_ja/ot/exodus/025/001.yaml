  yaml_path: translation/ot/exodus/025/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ja
  text: ヤハウェはモーセにこう語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告げられた
  rationale: 物語を進めるワウ継続法を日本語では自然な過去形で表した。דברと後続のלֵאמֹרから成る定型的な発話導入句は、一つの自然な日本語表現にまとめた。
- source_word: יְהוָה
  choice: 主[a]
  rationale: 日本語聖書で広く認知される表記を本文に用い、原文が称号ではなく四文字神名YHWHであることを脚注で明示した。
- source_word: אֶל מֹשֶׁה
  choice: モーセに
  rationale: 発話の相手を示す前置詞אֶלを自然な格助詞「に」で表し、人名מֹשֶׁהは慣用表記「モーセ」とした。
- source_word: לֵאמֹר
  choice: （告げられた）
  rationale: 後続する直接話法を導くヘブライ語の定型句。日本語では「言って言われた」のような重複を避け、主動詞と統合した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: 本文では「主」、脚注で「原文はYHWH（ヤハウェとも表記）」
  alternative: 本文で「ヤハウェ」または「エホバ」
  rationale: 原文が固有の神名である事実を脚注に保持しつつ、明瞭で品位ある現代日本語と広く定着した聖書表現を採用した。発音の再構成には不確実性があるため、一つの読みだけを原文そのものとして断定しない。
translation_notes:
  register: 簡潔で自然な現代標準日本語。ヘブライ語の二重の発話表現を日本語の定型「告げられた」に統合し、敬意を示す主体敬語を用いた。
