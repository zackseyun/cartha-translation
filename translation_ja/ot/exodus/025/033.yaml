  - severity: medium
    issue: 「それぞれに節と花がある」
    rationale: 原文は「三つの杯、節と花」と装飾要素を列挙する。節と花が三つの各杯に一つずつ付くという配分を明示していないため、「それぞれに」は避けるべきである。
