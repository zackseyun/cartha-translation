  source_fidelity: 原文は「一方の枝」と「もう一方の枝」という二本の特定の枝を対照させるのではなく、同一の型を反復して述べ、その型を燭台から出る六本の枝すべてに適用する。したがって「一方／もう一方」は不適切である。また、各三つの杯にそれぞれ節と花が付くことを必ずしも意味しないため、「それぞれに」は補い過ぎである。
  naturalness: 「アーモンドの花の形をした杯が三つ、節と花」は、器物装飾の列挙として自然で明瞭である。「燭台から出ている六本の枝」も現代標準日本語として読みやすい。
  terminology: 「杯」「枝」「燭台」は文脈に適する。「節」は丸くふくらんだ装飾を指す語として採用可能だが、注で補足するのが望ましい。「アーモンドの花の形をした」はメシュッカーディームの装飾意匠を適切に表す。
