  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: ja
  text: 枝の一つには、アーモンドの花の形をした杯が三つ、節と花がある。枝の一つには、アーモンドの花の形をした杯が三つ、節と花がある[a]。燭台から出ている六本の枝は、すべてこのようにする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「節」は、丸くふくらんだ装飾部分を表す。別訳「つぼみ」「こぶ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: 杯
  rationale: 杯状の器または装飾を指す語。燭台の造形を表す文脈なので、「鉢」よりも形状が明確な「杯」とした。
- source_word: מְשֻׁקָּדִים
  choice: アーモンドの花の形をした
  rationale: שקד（アーモンド）に由来し、ここでは杯の装飾意匠を表す。「アーモンド形」では実か花かが曖昧になるため、植物意匠と後続の「花」を踏まえて明示した。
- source_word: קָּנֶה
  choice: 枝
  rationale: 燭台から左右に伸びる部分を指す。植物を模した装飾との調和を保ち、日本語で自然な「枝」とした。
- source_word: כַּפְתֹּר
  choice: 節
  rationale: 丸く膨らんだ装飾部分を指す。植物的な造形の中で「花」と自然に並び、伝統的な幕屋用語としても理解可能な「節」を採用した。
- source_word: פֶרַח / פָרַח
  choice: 花
  rationale: 花または花飾りを表す普通名詞として、簡潔で自然な「花」とした。
- source_word: כֵּן לְשֵׁשֶׁת הַקָּנִים
  choice: 六本の枝は、すべてこのようにする
  rationale: 同じ意匠が六本すべてに適用されるという指示を、自然な現代日本語で明確にした。
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: 燭台から出る
  rationale: 枝が燭台本体から伸び出ることを、原文の分詞と前置詞に即して簡潔に表した。
- source_word: מְנֹרָה
  choice: 燭台
  rationale: ここでは幕屋の灯火を載せる器具を指す一般名詞であり、音写せず定着した訳語「燭台」を用いた。
