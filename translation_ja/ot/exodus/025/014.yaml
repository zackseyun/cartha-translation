  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: ja
  text: また、箱をそれで運ぶために、棒を箱の両側にある輪に通しなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: また、…通し
  rationale: בוא は字義的には「持って来る」だが、棒を輪の中へ入れる動作を表すため、現代日本語では「通す」が自然で具体的である。
- source_word: הַ/בַּדִּים
  choice: 棒
  rationale: בדים は聖具を運ぶための棒を指す。「担ぎ棒」も可能だが、後半の「担ぐ」によって用途が明らかなため、簡潔に「棒」とした。
- source_word: בַּ/טַּבָּעֹת
  choice: 輪に
  rationale: この文脈の前置詞 ב は、棒を輪の中に入れることを示す。日本語の「輪に通す」でその方向性を自然に表した。
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: 箱の両側にある
  rationale: צלעות は箱の側面を指す。複数形と器具の構造を自然に示すため「両側」とした。
- source_word: הָ/אָרֹן
  choice: 箱
  rationale: אָרוֹן の基本義は「箱、櫃」であり、この箇所では直前に造られた聖なる箱を指す。固有の伝統用語に限定せず、物体として明瞭な「箱」を採用した。
- source_word: לָ/שֵׂאת
  choice: 担ぐ
  rationale: נשא はここでは物理的に持ち運ぶことを表す。肩に棒を載せて運ぶ構造に即し、「運ぶ」より具体的な「担ぐ」とした。
- source_word: בָּ/הֶם
  choice: その棒で
  rationale: 複数代名詞は棒を受け、運搬の手段を示す。日本語では指示対象を明示する「その棒で」が自然である。
theological_decisions:
- issue: אָרוֹן の訳語
  choice: 箱
  alternative: 契約の箱／神の箱／櫃
  rationale: 原文の本節自体は単に定冠詞付きの「箱」と述べているため、文脈にない修飾語を補わず、語の基本義を保った。
translation_notes:
  register: 明瞭で現代的な命令文としつつ、幕屋の造作指示にふさわしい簡潔で dignified な文体を採用した。「通す」と「担ぐ」により、動作と用途を具体的に示した。
