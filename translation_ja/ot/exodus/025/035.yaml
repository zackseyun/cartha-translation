  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: ja
  text: 燭台から出る六本の枝には、二本の枝の下に節飾りを一つ、二本の枝の下に節飾りを一つ、二本の枝の下に節飾りを一つ設ける。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: 節飾り
  rationale: 燭台の幹に設けられる丸みのある装飾部分を指す。単なる「節」より意匠性を示し、「球」「つぼみ」と形状を限定しすぎない表現とした。
- source_word: קָנִים
  choice: 枝
  rationale: 燭台の中央の幹から左右へ伸びる部分なので、自然で定着した「枝」とした。
- source_word: מְנֹרָה
  choice: 燭台
  rationale: この文脈では幕屋用の灯火器具全体を指すため、現代日本語で理解しやすく、聖書用語としても定着した語を用いた。
- source_word: מִמֶּנָּה / מִן־הַמְּנֹרָה
  choice: そこから出る／燭台から…出る
  rationale: 女性単数の指示対象である燭台との関係を明示しつつ、日本語で不自然な反復を避けた。
theological_decisions: []
translation_notes:
  register: 設計指示として明快な現代標準日本語を用いた。原文の三組の反復構造は保ちつつ、各組が六本の枝に対応することが分かるよう「次の」「さらに次の」を補った。宗派的な解釈は加えていない。
