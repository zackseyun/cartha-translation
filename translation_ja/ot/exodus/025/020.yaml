  terminology: 「ケルビム」は定着した音写で適切。「贖いの蓋」はカポレットの物理的対象と祭儀的含意をともに表せる。脚注の「宥めの蓋」は現代日本語として不自然で、原語の語義を一義的に示すものでもないため、「贖罪の蓋」を代案として示すほうが明瞭である。
