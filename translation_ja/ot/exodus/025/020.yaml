  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: ja
  text: ケルビムは翼を上方に広げ、その翼で贖いの蓋[a]を覆うものとする。その顔は互いに向き合い、ケルビムの顔は贖いの蓋の方を向くものとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの蓋」は、契約の箱の金の蓋を指す。「贖罪の蓋」とも訳せる。
    reason: כַּפֹּרֶת の具体的な指示対象を説明し、その祭儀的意味を表す自然な代替訳を示すため。
lexical_decisions:
- source_word: וְהָיוּ
  choice: 〜ようにする
  rationale: 幕屋造営の指示という文脈にある完了形を、現代日本語で自然な規定・指示として表した。
- source_word: הַכְּרֻבִים
  choice: ケルビム
  rationale: 聖所の造作に置かれる天上の存在を指す、定着した音写を用いた。ヘブライ語では複数形である。
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: 翼を上の方に広げ
  rationale: 分詞が描く翼を伸ばした姿勢と、לְמַעְלָה の上向きの方向性を明確にした。
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: その翼で……を覆う
  rationale: סכך の覆い・遮る空間的な像と、前置詞 ב の手段用法を簡潔に表した。
- source_word: הַכַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱の金の蓋という具体的指示対象と、その祭儀的・贖罪的意義の双方を示す訳語を選んだ。単なる「蓋」より原語の含意を保つ。
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: その顔は互いに向き合い
  rationale: 直訳的には「それぞれがその兄弟に向かう」という相互関係を表す慣用句なので、自然な日本語で相互の向きを示した。
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: ケルビムの顔は贖いの蓋の方を向くようにする
  rationale: 原文が「顔」を繰り返して、その向きを贖いの蓋に定めている具体的な描写を保持した。
theological_decisions:
- issue: כַּפֹּרֶת の訳し方
  choice: 贖いの蓋
  alternative: 宥めの蓋／蓋
  rationale: 語が指す契約の箱の金の蓋を明示しつつ、贖いに関わる祭儀的機能を残した。語義を特定の贖罪理論に限定しないよう、別訳の可能性を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、造営指示としての規定調を保った。原文にある「顔」の反復は、ケルビム相互の向きと蓋への向きの両方を描くため保持した。
