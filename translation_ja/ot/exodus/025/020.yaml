  to: ケルビムは翼を上方に広げ、その翼で贖いの蓋[a]を覆うものとする。その顔は互いに向き合い、ケルビムの顔は贖いの蓋の方を向くものとする。
  rationale: 内容上の意味変更は行わず、幕屋造営の指示としての規定調を一貫させた。「覆う」は סכך の、翼によって上から覆うという像を保つ。顔が互いに向くことと贖いの蓋の方を向くことの両方を、原文どおり保持した。
