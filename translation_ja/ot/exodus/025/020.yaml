  source_fidelity: ヘブライ語の主要な構文と空間的描写は概ね正確に反映されている。「翼を上方に広げ」「翼で……を覆う」「顔が互いに向き合う」「顔がカポレットの方を向く」という各要素、および「顔」の反復も保持されている。ただし、指示文脈の וְהָיוּ／יִהְיוּ を「〜ようにする」とすると、ケルビム自身が意図的にそうするかのようにも響き、造作の規定としてやや不自然である。
