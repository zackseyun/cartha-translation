  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: ja
  text: その火ばさみ[a]と火皿[b]は、純金で作る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「芯切りばさみ」とも訳せる。ヘブライ語は、燭台に伴う、物をつかんだり灯芯を整えたりする器具を指す。
    reason: lexical_alternative
  - marker: b
