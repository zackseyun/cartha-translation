    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: その火ばさみ
  rationale: 語は物をつかむ道具を指し、燭台の文脈では灯芯を扱う器具と考えられる。「火ばさみ」は機能を限定しすぎず、現代日本語でも理解しやすい。接尾辞は燭台を受けるため「その」で表した。
- source_word: מַחְתֹּתֶיהָ
  choice: 火皿
  rationale: 火や炭を受けたり運んだりする皿状の祭具を表す語である。「火皿」は祭具としての意味を保ちつつ、「香炉」と機能を限定することを避ける。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 素材を示す定型的な句であり、簡潔で自然な日本語として「純金」とした。
- source_word: וּ
  choice: と
  rationale: 二つの器具を並列する接続辞を、日本語の名詞句に自然な「と」で表した。
- source_word: -הָ
  choice: その
  rationale: 三人称女性単数接尾辞は文法上女性の「燭台」を受ける。日本語では無生物の性を示さず、指示的な「その」で所属関係を表した。
