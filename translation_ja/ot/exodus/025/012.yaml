  text: וְ/יָצַ֣קְתָּ לּ֗/וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב וְ/נָ֣תַתָּ֔ה עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י/ו וּ/שְׁתֵּ֣י טַבָּעֹ֗ת עַל צַלְע/וֹ֙ הָֽ/אֶחָ֔ת וּ/שְׁתֵּי֙ טַבָּעֹ֔ת עַל צַלְע֖/וֹ הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: ja
  text: また、箱のために金の輪を四つ鋳造し、その四つの脚部[a]に取り付けなさい。一方の側に二つの輪を、もう一方の側にも二つの輪を付けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「四隅」。ヘブライ語は解釈が難しいが、抽象的な隅の位置というより、箱の下部にある支えや足を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: 鋳造し
  rationale: 金製の金具を作る文脈なので、一般的な「注ぐ」ではなく、金属を型に流して作ることを表す「鋳造する」とした。
- source_word: טַבְּעֹת זָהָב
  choice: 金の輪
  rationale: 担ぎ棒を通すため箱に取り付ける環状の金具を指す。「金の輪」は簡潔で分かりやすい。
- source_word: וְנָתַתָּה
  choice: 取り付けなさい／付けなさい
  rationale: 基本義は「置く」だが、輪を箱に設置する製作指示では「取り付ける」が自然で具体的である。後半は重複を和らげて「付ける」とした。
- source_word: פַּעֲמֹתָיו
  choice: その四つの脚部
  rationale: 語義は難しいが、ここでは箱の下部にある足または足状の支えを指す可能性が高い。「脚部」は具体性を保ちつつ、現代日本語で自然である。別解の「四隅」は脚注に示した。
- source_word: צַלְעוֹ
  choice: 側
  rationale: 建造物や物体については「側面」を意味する。ここでは簡潔な「側」が自然である。
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: 一方の側……もう一方の側
  rationale: 原文の二つの側の対比を、日本語として自然な対応表現で示した。
- source_word: לּוֹ / ־ָיו
  choice: 箱のために／その
  rationale: 原文は代名詞だが、日本語では対象を明確にするため、直前の文脈上の指示対象である箱を補った。後続箇所では「その」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な製作指示として、命令形「取り付けなさい」「付けなさい」を用いた。格調を保ちながらも過度に古風な表現は避けた。脚注記号[a]は該当語の直後に置いた。
