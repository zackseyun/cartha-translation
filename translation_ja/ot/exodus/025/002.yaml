base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: ja
  text: 「イスラエルの子らに告げなさい。彼らがわたしのために献納物[a]をささげるように。心がその人を促すすべての人から[b]、わたしの献納物を受け取りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「献納物」は、聖なる用途のために取り分けて差し出す物を指す。「ささげ物」または「寄進」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その心が彼を促す者から」。内面から進んで応じようとする意志を表す。
    reason: idiom_explanation
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: ～に告げなさい
  rationale: 命令形と前置詞の組み合わせを、現代日本語で自然かつ明確な直接命令として表した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 契約共同体を指す字義的な親族表現を保持した。「イスラエル人」も自然だが、原文の言い回しを残した。
- source_word: וְיִקְחוּ לִי
  choice: わたしのために～を携えて来るように
  rationale: לקח の基本義は「取る」だが、献納物を集める文脈では、民が神のために品物を持参するよう命じられている。「携えて来る」は日本語でその動作を明確にする。
- source_word: תְּרוּמָה
  choice: 献納物
  rationale: 聖なる用途のために取り分けて差し出す物を表す語であり、犠牲そのものに限定される印象を避けながら、神への奉献という性格を示す。
- source_word: מֵאֵת כָּל אִישׁ
  choice: 人すべてから
  rationale: אִישׁ は単数形だが、כָּל とともに分配的に「一人一人」を指す。日本語では「人すべて」で自然に包括性を表せる。
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: 心に促される人
  rationale: 心から自発的に応じるというヘブライ語の慣用表現を、余分な副詞を加えず自然な日本語にした。受動表現により、内面からの促しを保持する。
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: わたしへの献納物を受け取りなさい
  rationale: 直訳は「わたしの献納物を取りなさい」。収集を担当する側への命令なので「受け取る」が自然であり、接尾辞の神への帰属・方向性を「わたしへの」で示した。
theological_decisions:
- issue: 幕屋建設のための תְּרוּמָה の訳語
  choice: 献納物
  alternative: ささげ物／寄進
  rationale: 神のために取り分けられる物という聖的性格と、自発的な拠出という文脈の双方を示しつつ、後代の特定の犠牲祭儀に限定しないため。
- issue: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ が示す自発性
  choice: 心に促される人
  alternative: 心から進んでささげる人／心が奮い立たせる人
  rationale: 命令による強制と自発的意志との緊張を解消せず、原文どおり内なる心の働きとして表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イスラエルの子ら」で原文の契約共同体としての呼称を保持しつつ、命令部分は普通の読者に理解しやすい表現とした。
