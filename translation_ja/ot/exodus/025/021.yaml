  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: ja
  text: 贖いの蓋[a]を箱の上に置き、わたしがあなたに与える証しを箱の中に納めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 契約の箱を覆う蓋を指し、贖いの儀礼との関連を持つ語。「宥めの蓋」または単に「蓋」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱の上を覆う蓋という具体的な指示を明確にしつつ、この語が持つ贖いの儀礼との結びつきも保つ。「贖罪所」では物としての蓋であることが伝わりにくいため、「贖いの蓋」とした。
- source_word: מִלְמָעְלָה
  choice: 上に
  rationale: ここでは蓋を箱の上部に据える位置関係を表すため、自然で明確な「上に」とした。
- source_word: עֵדֻת
  choice: 証し
  rationale: 契約を証しするものを指すヘブライ語に近い表現を保ち、この節に明記されていない「板」などの説明を本文に補わない。
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: 置き／納めなさい／与える
  rationale: נתןの基本的意味を、目的語と動作に応じて自然な日本語に訳し分けた。蓋には「置く」、箱の内部への収容には「納める」、神が証しを授けることには「与える」を用いた。
- source_word: אֶל הָאָרֹן
  choice: 箱の中に
  rationale: אֶל自体は方向を示すが、証しを箱へ入れる文脈なので、到達点を明確にする「箱の中に」とした。
theological_decisions:
- issue: 祭儀的な語כַּפֹּרֶתの訳し方
  choice: 贖いの蓋
  alternative: 宥めの蓋／贖罪所／蓋
  rationale: この語は契約の箱の蓋を指すと同時に、そこで行われる贖いの儀礼との関連を帯びる。「贖いの蓋」は物体としての指示対象と祭儀的含意の双方を保つ。特定の贖罪論へ限定せず、別訳の可能性を脚注で示した。
translation_notes:
  register: 明快で格調を保った現代標準語。「箱」は直前の文脈で示された契約の箱を受ける。命令文は日本語として自然になるよう一続きにし、「証し」が何であるかは原文同様にこの節では特定しない。
