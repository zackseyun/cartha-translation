base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: ja
  text: その机の上に臨在のパン[a]を置き、絶えずわたしの前に供えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「顔（複数形）のパン」。神の御前に置かれるパンを指す。伝統的には「供えのパン」とも訳される。
    reason: 原語特有の祭儀的表現と伝統的な別訳を示すため。
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: 置いておきなさい
  rationale: נתןの「置く」という意味を採り、תָּמִידが示す継続性も自然な現代日本語で表した。神からの直接の命令として明確にした。
- source_word: עַל הַ/שֻּׁלְחָן
  choice: その机の上に
  rationale: 幕屋の備品として直前まで述べられている特定の机を指すため、「その机」とした。עַלは位置を示す「上に」と訳した。
- source_word: לֶחֶם פָּנִים
  choice: 臨在のパン
  rationale: 直訳的には「顔のパン」であり、神の御前、すなわち臨在に置かれる祭儀的なパンを指す。伝統的な「供えのパン」だけではפָּנִיםの含意が見えにくいため、原語の表現を保つ「臨在のパン」とした。
- source_word: לְ/פָנַ/י
  choice: わたしの前に
  rationale: 「わたしの顔の前に」を意味する直接的な表現であり、神の発言として簡潔に訳した。
- source_word: תָּמִיד
  choice: 絶えず
  rationale: 祭儀が継続的・恒常的に守られることを示す。個々のパンが永久に置かれるというより、パンを常に御前に保つ規定であることを表せる語を選んだ。
theological_decisions:
- issue: 祭儀用語 לֶחֶם פָּנִים の訳し方
  choice: 臨在のパン
  alternative: 供えのパン／御前のパン
  rationale: 神の臨在との関係を示す原語の比喩を保持しつつ、直後の「わたしの前に」と同一表現へ平板化しないようにした。特定の後代的教理は持ち込まず、別称は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令文は自然な「置いておきなさい」とし、神の一人称は「わたし」とした。原文の語順を機械的には再現せず、「絶えず」がパンを神の前に保つこと全体にかかるよう配置した。
