  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: ja
  text: 輪は枠に対応する位置にあり[a]、机を運ぶためのさおを通す受け具[b]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「枠のそばに」「枠に向かい合う位置に」。ヘブライ語は枠との相対的位置を示しますが、厳密な配置までは特定していません。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「さおのための家々」。さおを差し込む受け口、または保持具を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: 向かい合う位置に
  rationale: 基準となる物との相対的位置を示す語。ここでは「枠に向かい合う位置に」としたが、厳密な配置までは特定しないため、別の空間的理解を脚注に残した。
- source_word: הַמִּסְגֶּרֶת
  choice: 枠
  rationale: 机の周囲にある構造部分を指す文脈なので、現代日本語で広く自然な「枠」とした。
- source_word: תִּהְיֶיןָ
  choice: あり／となる
  rationale: 複数形の存在動詞。日本語では文の機能関係が明確になるよう「あり」とし、後半を「となる」でつないだ。
- source_word: הַטַּבָּעֹת
  choice: 輪
  rationale: 運搬用のさおを通す金属製の輪を表す標準的で簡潔な訳語。
- source_word: לְבָתִּים
  choice: 受け具
  rationale: 直訳は「家々」だが、ここではさおを差し込んで保持する部分を比喩的に指す。機能を明瞭に伝えるため「受け具」とした。
- source_word: לְבַדִּים
  choice: さお
  rationale: 聖具を運搬するために輪へ通す棒を指す。読みやすい現代日本語として、ひらがなの「さお」を用いた。
- source_word: לָשֵׂאת
  choice: 運ぶための
  rationale: 目的を表す不定詞であり、机を運搬する用途を自然な日本語で示した。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: この箇所で製作が命じられている祭具の卓を指す。一般読者に明瞭な「机」とした。
