  text: כַּפְתֹּרֵי/הֶ֥ם וּ/קְנֹתָ֖/ם מִמֶּ֣/נָּה יִהְי֑וּ כֻּלָּ֛/הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: ja
  text: そのつぼみと枝は燭台と一体に作り、その全体を純金を一つに打ち出して作る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: それらのつぼみ
  rationale: כפתרは燭台の丸みを帯びた装飾を指す。周囲の花を模した意匠に合わせ、現代日本語で分かりやすい「つぼみ」とした。
- source_word: וּקְנֹתָם
  choice: 枝
  rationale: קנהの基本義は葦・茎だが、ここでは燭台から伸びる腕を指す。植物的な意匠を保ちつつ自然な「枝」とした。
- source_word: מִמֶּנָּה יִהְיוּ
  choice: 燭台と一体にし
  rationale: 字義的には「それから出る／それから成る」。部品を別に取り付けず、本体と一続きに成形する指示を自然な日本語で表した。
- source_word: כֻּלָּהּ
  choice: その全体
  rationale: 燭台の全構造が例外なく一体であることを示す包括的な強調を保持した。
- source_word: מִקְשָׁה אַחַת
  choice: 一枚から打ち出して作る
  rationale: מקשהは金属を打って成形した細工を指し、אחתはその一体性を強調する。「一枚から打ち出して」で製法と一体構造を明瞭にした。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 定型的な語句であり、自然で正確な日本語の「純金」とした。
theological_decisions: []
translation_notes:
  register: 幕屋造営の規定にふさわしい簡潔で指示的な文体としつつ、現代の一般読者にも製法が伝わる表現にした。「燭台」は文脈上の指示対象を明示するため補った。
