  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: ja
  text: また、純金で贖いの蓋[a]を作りなさい。長さは二キュビト半、幅は一キュビト半とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「贖いの座」とも訳される。ヘブライ語 כַּפֹּרֶת は契約の箱の上に置く金の蓋を指し、「贖う」に関係する語根 כפר と結びついている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: また、…作りなさい
  rationale: 幕屋造営の指示という文脈で、接続詞付き完了形は命令的な指示を表す。現代日本語で自然かつ明確な命令形とした。
- source_word: כַפֹּרֶת
  choice: 贖いの蓋
  rationale: 契約の箱の上に置く特定の金の覆いであり、語根 כפר が示す贖いとの関連も伝える。「蓋」だけでは祭儀的含意が失われるため、「贖いの蓋」とした。伝統的な別称は脚注に示す。
- source_word: זָהָב טָהוֹר
  choice: 純金で
  rationale: 素材と品質を簡潔で自然な日本語で表した。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二キュビト半
  rationale: 古代の尺度を換算せず保持し、ヘブライ語の数量を簡潔に表した。
- source_word: אָרְכָּהּ
  choice: 長さは
  rationale: 女性単数接尾辞が כַפֹּרֶת を指すことは日本語の文脈上明白なので、所有表現を重ねず自然にした。
- source_word: וְאַמָּה וָחֵצִי
  choice: 幅は一キュビト半
  rationale: 前半の寸法表現と並行させ、原文どおりの尺度と数量を保持した。
- source_word: רָחְבָּהּ
  choice: 幅は
  rationale: 対象が贖いの蓋であることが明白なため、自然で簡潔な表現とした。
theological_decisions:
- issue: 祭儀的用語 כַפֹּרֶת の訳語
  choice: 贖いの蓋
  alternative: 恵みの座／蓋
  rationale: この語は契約の箱を覆う金製品を指す一方、贖いを表す語根 כפר とも関連する。「贖いの蓋」は物体としての性質と祭儀的含意の双方を示し、単なる「蓋」より情報を保つ。「恵みの座」は伝統的な訳語だが、原語に「座」を明示する語はないため脚注に置いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。造営指示として「作りなさい」「…とする」を用い、古代の尺度キュビトは換算せず保持した。
