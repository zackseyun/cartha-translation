base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: ja
  text: 一方の端に一つのケルブを、もう一方の端に一つのケルブを造りなさい。贖いの蓋から[a]、その両端にケルブたちを造りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖いの蓋から」とは、ケルブを別に作って取り付けるのではなく、贖いの蓋そのものから、その両端に一続きに造るという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: 造りなさい
  rationale: 命令形を、幕屋造営の指示にふさわしい明瞭な命令として訳した。接続詞は日本語の自然な文脈上、明示しない。
- source_word: כְּרוּב ... וּכְרוּב / הַכְּרֻבִים
  choice: 一体のケルブ……一体のケルブ／ケルブたち
  rationale: 前半の単数と後半の複数を保った。「ケルブ」はこの天的存在を指す固有の音写として用い、像として数えるため「体」を添えた。
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: 一方の端に……もう一方の端に
  rationale: 対称的な配置を自然な現代日本語で表した。ここでの最初の前置詞は位置関係を示すものとして訳した。
- source_word: מִן הַכַּפֹּרֶת
  choice: 贖いの蓋から
  rationale: כַּפֹּרֶתを契約の箱を覆う物体として理解でき、かつ贖いとの語義的・祭儀的関連も保つ「贖いの蓋」とした。מִןはケルブが蓋そのものから作り出される材料・起点の関係を示すため「から」と訳した。
- source_word: תַּעֲשׂוּ
  choice: 造り
  rationale: 二人称男性複数の指示を日本語では主語を補わず、後続の「置きなさい」と一続きの施工命令として自然に表した。
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: その両端に置きなさい
  rationale: 接尾辞の単数形が「贖いの蓋」を受けることを「その」で示した。עַלの配置の意味を「に置く」で明瞭にしたが、「造る」という動詞自体は直前で保持している。
theological_decisions:
- issue: כַּפֹּרֶתの訳語
  choice: 贖いの蓋
  alternative: 恵みの座／贖罪所／蓋
  rationale: 単なる物理的な「蓋」に限定せず、語の贖罪的含意を保ちながら、具体的な物体であることも普通の読者に伝わる表現を採った。「恵みの座」は伝統的だが、原語に「座」の語はなく、この箇所の製作指示では形状を誤解させ得る。
- issue: ケルブと贖いの蓋の一体性
  choice: 本文で「贖いの蓋から」とし、注で一体成形を明示
  alternative: 本文を「贖いの蓋と一続きに」と意訳
  rationale: מִןの原文表現を保ちつつ、それが別部品の取り付けではなく蓋自体から成形する意味であることを注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭具製作の指示として簡潔で格調ある命令文にした。「ケルブ」は専門語として音写し、「贖いの蓋」は物体性と祭儀的意味の双方を伝える訳語とした。
