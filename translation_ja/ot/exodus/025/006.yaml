  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原語は広く「油」を意味し、この節自体はオリーブ油と明記していないため、限定を加えない。
- source_word: לַמָּאֹר
  choice: 灯火のための
  rationale: מָאוֹרは光をもたらすもの、または灯火を指す。幕屋の灯火に用いる油という用途を、簡潔で自然な日本語にした。
- source_word: בְּשָׂמִים
  choice: 香料
  rationale: 聖なる調合物に用いる芳香性の材料を指すため、現代日本語で明瞭な「香料」とした。
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: 注ぎの油のための
  rationale: מִשְׁחָהの「油を注ぐこと」という意味を保ち、特定教派の術語を持ち込まずに、特別な油の調合用途を表した。本文では後続句とまとめて「注ぎの油と…のための香料」とした。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 幕屋の文脈では、たいて香りを立てる香を指すため、日本語の聖書文体でも理解しやすい「香」とした。
- source_word: הַסַּמִּים
  choice: 香り高い
  rationale: קְטֹרֶת הַסַּמִּיםは字義的には「香料の香」だが、日本語では重複感が強い。芳香性を自然に示す「香り高い香」とし、字義的な形は脚注に残した。
