lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 作り……なさい
  rationale: 幕屋造営の指示という文脈における命令として、現代日本語で自然かつ明確に表現した。
- source_word: הַבַּדִּים
  choice: 担ぎ棒
  rationale: 聖具を運ぶための棒を指すため、単なる「棒」より用途が明確な「担ぎ棒」とした。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 樹種と材料であることを簡潔に示す、現代日本語として自然な表現。
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: 金をかぶせなさい
  rationale: 工芸の文脈で、表面を金で覆うことを明瞭に表す。「金を張る」も可能だが、原語は具体的な施工法を限定しない。
- source_word: וְנִשָּׂא בָם
  choice: その棒で運ばれる
  rationale: 受動形を保ちつつ、בָםを運搬の手段として自然な日本語の助詞「で」で表した。
- source_word: הַשֻּׁלְחָן
  choice: 机
  rationale: 直前から述べられている聖具を指す。説明を加えず、一般読者に分かりやすい語を用いた。
