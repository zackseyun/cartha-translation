  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: ja
  text: 一キカルの純金で、これとこれらすべての器具[a]を作らなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「器具」と訳した語は、燭台に付属する道具や容器などを広く指すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: 一キカル
  rationale: 古代の重量単位を、幕屋の文脈で定着している音訳「キカル」によって保持した。現代の重量への換算には幅があるため、本文では換算値を示さない。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 素材として混じり物のない金を表す、この工芸文脈に自然で簡潔な訳語。
- source_word: יַעֲשֶׂה
  choice: 作らなければならない
  rationale: 三人称男性単数の未完了形だが、ここでは幕屋製作についての規定を表す。日本語では主語を補わず、義務・指示を自然に示した。
- source_word: אֹתָהּ
  choice: これを
  rationale: 女性単数目的語代名詞が直前まで述べられた燭台を指すことを保ちつつ、本文に「燭台」を補って明示することは避けた。
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: これらのすべての器具とともに
  rationale: כֵּלִים は器、道具、用具などを広く指し得る。燭台に付属する品々という文脈に合う包括的な「器具」を選び、「とともに」で燭台と付属品の全体が一キカルの純金から作られる関係を自然に表した。
