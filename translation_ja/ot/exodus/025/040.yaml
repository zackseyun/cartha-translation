reference: Exodus 25:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/רְאֵ֖ה וַ/עֲשֵׂ֑ה בְּ/תַ֨בְנִיתָ֔/ם אֲשֶׁר אַתָּ֥ה מָרְאֶ֖ה בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: ja
  text: よく見て、山であなたに示されたそれらの型[a]どおりに造りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見よ。そして、山であなたに示されたそれらの型に従って造りなさい。」
    reason: 原文の二つの命令「見よ」「造れ」の並列と、前置詞句の訳し方をより字義的に示すため。
lexical_decisions:
- source_word: וּרְאֵה
  choice: よく見て
  rationale: 命令形「見よ」はここでは注意深く従うよう促す働きを持つため、現代日本語として自然な「よく見て」とした。後続の命令との接続も保っている。
- source_word: וַעֲשֵׂה
  choice: 造りなさい
  rationale: עשהは広く「する／造る」を意味するが、幕屋の器具を製作する文脈なので「造る」が適切である。命令形の力を明確に示した。
- source_word: בְּתַבְנִיתָם
  choice: それらの型どおりに
  rationale: תבניתは「型・模型・設計」を意味し、三人称男性複数接尾辞は直前までに述べられた品々を指す。「それらの型どおりに」は、示されたものへの適合を表しつつ、模型か設計図かを限定しない。
- source_word: אֲשֶׁר
  choice: 山であなたに示された
  rationale: 関係節を日本語では名詞「型」の前に置き、自然な修飾構造とした。
- source_word: אַתָּה מָרְאֶה
  choice: あなたに示された
  rationale: מָרְאֶהをראהのホファル分詞と解し、「示される」と訳した。分詞の時間的含意は文脈上、山で受けた啓示を指すものとして自然な過去形にしたが、動作の主体は原文同様に明示していない。
- source_word: בָּהָר
  choice: 山で
  rationale: モーセが型を示された場所を表すため、日本語では場所を示す「山で」が自然である。
theological_decisions:
- issue: 幕屋の品々について示されたものの性質
  choice: 型
  alternative: 模型／形／設計
  rationale: תבניתが模型、形状、設計のいずれを具体的に指すかを断定せず、天上の原型について特定の形而上学的理解を持ち込まない「型」を採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「見よ」だけでは古風になりやすいため本文では「よく見て」とし、直接的な命令の調子を維持した。
