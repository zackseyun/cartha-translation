reference: Exodus 25:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: ja
  text: 彼らはアカシア材[b]で箱[a]を作るものとする。長さは二キュビト半[c]、幅は一キュビト半、高さは一キュビト半とする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、物を納める「箱」または「櫃」を意味する。ここでは、後に契約の箱と呼ばれる聖なる箱を指す。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「シッテム材」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: キュビトは古代の長さの単位で、およそ肘から指先までの長さ。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 彼らは……作るものとする
  rationale: 幕屋建設についての指示という文脈で、三人称複数の動詞を命令的な規定として自然な現代日本語にした。冒頭の接続詞は、日本語で不自然にならないよう明示しなかった。
- source_word: אֲרוֹן
  choice: 箱
  rationale: この語は物を納める箱・櫃を指す。日本語の聖書用語としても、この聖なる器は文脈上「箱」と呼ぶのが明瞭である。
- source_word: עֲצֵי שִׁטִּים
  choice: アカシア材
  rationale: 材料を表す連語として、現代日本語で簡潔かつ自然な「アカシア材」とした。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二キュビト半
  rationale: 古代の尺度を換算せず保持し、ヘブライ語の「二＋半」を自然な日本語の寸法表現にした。
- source_word: אָרְכּוֹ
  choice: 長さ
  rationale: 三人称単数接尾辞の指示対象は直前の箱であり、日本語では所有表現を繰り返さず「長さ」とするのが自然で明確である。
- source_word: וְאַמָּה וָחֵצִי
  choice: 一キュビト半
  rationale: 原文の「一キュビトと半分」という数量を、現代日本語の簡潔な寸法表現で示した。
- source_word: רָחְבּוֹ
  choice: 幅
  rationale: 物体の横方向の寸法を表すため、明瞭な現代語「幅」を用いた。
- source_word: קֹמָתוֹ
  choice: 高さ
  rationale: 物体の垂直方向の寸法を示す語として、自然な「高さ」とした。
theological_decisions:
- issue: אֲרוֹן の訳語が持つ聖なる契約の箱という含意
  choice: 本文では「箱」とし、文脈上の特別な指示対象は注で説明する
  alternative: 櫃／契約の箱
  rationale: 原語自体は一般に箱や収納器を指し、この節には「契約の」という修飾語がないため、本文でそれを補わず、語義と文脈の両方を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。施工指示としての規定調を「作るものとする」「〜とする」で表し、三つの寸法を読み取りやすく並列した。
