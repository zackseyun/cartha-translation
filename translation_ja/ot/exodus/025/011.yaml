  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: ja
  text: それを純金で覆い、内側も外側も覆いなさい。それに、周囲を巡る金の縁飾り[a]を作りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金の縁」または「金の枠」とも訳せる。伝統的には「金の冠」と訳される。ヘブライ語 זֵר は、その物の周囲に施す装飾的な縁取りを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: 覆い／覆いなさい
  rationale: 幕屋調度品の製作という文脈では、物体の表面に金の層を施すことを表す。「覆う」は現代日本語として明瞭で、金をかぶせる加工の意味を文脈から自然に伝える。
- source_word: זָהָב טָהוֹר
  choice: 純金
  rationale: 精錬され、不純物のない金を指す定着した自然な表現であり、聖所に用いる素材の品質を保つ。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 内側も外側も
  rationale: 字義的な『内から、外から』という対句を、日本語で表面の位置が明確になるよう自然に表した。両面を覆う意味も保持する。
- source_word: וְעָשִׂיתָ עָלָיו
  choice: その周囲には……作りなさい
  rationale: עַל は対象物の上またはそれに取り付ける位置関係を示す。続く סָבִיב と合わせ、日本語では『その周囲には』として配置を明瞭にした。
- source_word: זֵר
  choice: 縁飾り
  rationale: この語は調度品を取り巻く装飾的な縁取りを指すと考えられる。『縁飾り』は家具・工芸品の構造を自然に想起させ、伝統的な『冠』が招きうる頭上の冠という誤解を避ける一方、語義の幅は注で示す。
- source_word: זֵר זָהָב
  choice: 金の縁飾り
  rationale: 素材と部位の関係を簡潔で自然な日本語にした。
- source_word: סָבִיב
  choice: 周囲に
  rationale: 対象物を取り巻いて全体に及ぶ意味を端的に表す。
