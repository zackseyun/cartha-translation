  text: onyx stones[a], and stones for setting[c][b], for the ephod and for the breastpiece.
translation:
  language: ja
  text: オニキス[a]、ならびにエフォドと胸当てにはめ込むための石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「オニキス」と訳したヘブライ語がどの宝石を指すかは確定していない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「はめ込むための石」または「台座にはめる石」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: 縞めのう
  rationale: שֹׁהַם の鉱物学的同定は不確かだが、幕屋関連の文脈で伝統的かつ広く理解される訳語を採用し、不確かさは脚注に示した。日本語では「オニキス」より聖書語として定着した「縞めのう」を用いた。
- source_word: אַבְנֵי מִלֻּאִים
  choice: はめ込み用の宝石
  rationale: מִלֻּאִים は「満たすこと」に由来し、ここでは装身具にはめ込む石を指す。「はめ込み用」で用途を自然に表し、文脈上価値ある石なので日本語では「宝石」とした。
- source_word: לָאֵפֹד
  choice: エフォドのための
  rationale: אֵפוֹד は祭司の衣服を表す専門語であり、不確かな説明的訳を避けて音写した。
- source_word: וְלַחֹשֶׁן
  choice: 胸当てのための
  rationale: חֹשֶׁן は宝石を取り付ける祭司の胸部装具を指す。「胸当て」は現代日本語で分かりやすく、「胸当て板」や「胸当て鎧」のように材質や軍装を過度に含意しない。
theological_decisions: []
translation_notes:
