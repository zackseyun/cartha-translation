  text: כָּל מַחְמֶ֖צֶת לֹ֣א תֹאכֵ֑לוּ בְּ/כֹל֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם תֹּאכְל֖וּ מַצּֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/020.yaml
  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: ja
  text: パン種を入れたものは、何一つ食べてはならない[a]。あなたがたが住むすべての場所で[b]、種なしパンを食べなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「発酵させたものは何も食べてはならない」。ヘブライ語はパンだけでなく、パン種によって発酵させたものを広く指し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたのすべての居住地で」。この表現は、あなたがたが住むあらゆる場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: パン種を入れたものは、何一つ
  rationale: מַחְמֶצֶתはパンだけに限定されず、発酵させたもの全般を指し得る。否定文中のכָּלの包括的な力を「何一つ」で自然に表した。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならない
  rationale: לֹאを伴う未完了形が律法上の禁止を表すため、現代日本語で明確かつ威厳のある禁止表現とした。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: あなたがたが住むすべての場所で
  rationale: מוֹשָׁבには住居、居住地、集落などの幅がある。特定の家屋だけに狭めず、彼らが生活するあらゆる場所を指す自然な表現とした。
- source_word: תֹּאכְלוּ
  choice: 食べなければならない
  rationale: ここでは前半の禁止に対応する積極的な命令として理解し、義務性が明確になるように訳した。
- source_word: מַצּוֹת
  choice: 種なしパン
  rationale: パン種を用いずに作るパンを指す、現代日本語で広く理解される聖書用語を採用した。
