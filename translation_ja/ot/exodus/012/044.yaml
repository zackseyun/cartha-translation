id: EXO.12.44
reference: Exodus 12:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: ja
  text: しかし、人が銀で買い取った奴隷[a]は皆、あなたがその者に割礼を施した後で[b]、過越の食事を食べることができる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」は、ここでは銀で買い取られ、所有下に置かれた人を指す。
    reason: lexical_alternative
  - marker: b
    text: すなわち、その者が過越の食事に加わることができるのは、割礼を受けた後である。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: しかし、…は皆
  rationale: 接続詞וְが直前の「異国人は食べてはならない」という規定との対照を導くため「しかし」とし、כָּלの包括的・分配的意味を「皆」で表した。
- source_word: עֶבֶד אִישׁ
  choice: 人が…買い取った奴隷
  rationale: עֶבֶדは、金銭による取得が明記された法的文脈なので、隷属・所有の実態を弱めない「奴隷」とした。אִישׁは所有者を指すが、日本語では直訳的な「人の奴隷」より、後続句と合わせた表現が明確で自然である。
- source_word: מִקְנַת כָּסֶף
  choice: 銀で買い取った
  rationale: כֶּסֶףの字義である「銀」を保ちつつ、構文全体が金銭による購入を意味することを自然な日本語で表した。
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: あなたがその者に割礼を施した後で
  rationale: 二人称単数の直接的な命令対象を「あなた」で保持し、完了形を伴う法的手順が、食事への参加に先立つ条件であることを「後で」で示した。
- source_word: אָז
  choice: （割礼を施した）後で
  rationale: 割礼の後に続く段階を示す語であり、日本語では前節に組み込むことで重複を避け、時間的・条件的順序を明確にした。
- source_word: יֹאכַל בּוֹ
  choice: 過越の食事を食べることができる
  rationale: 未完了形はここで許可を表すため「食べることができる」とした。בּוֹの指示対象は文脈上の過越の食事であり、日本語で曖昧になりすぎないよう明示した。
theological_decisions:
- issue: 契約法規におけるעֶבֶדの訳語
  choice: 奴隷
  alternative: 僕、しもべ
  rationale: 銀で購入された人物であることが明記され、隷属と所有の身分が意味の中心にあるため、制度の実態を婉曲化しない訳語を選んだ。
- issue: 割礼と過越の食事への参加との関係
  choice: 割礼を施した後で、食べることができる
  alternative: 割礼を施し、食べる
  rationale: וּמַלְתָּה…אָזという順序は、割礼が参加に先立つ条件であることを示す。許可の意味を表しつつ、本文以上の教義的説明は加えなかった。
- issue: אִישׁの男性単数形
  choice: 人が
  alternative: 男が、主人が
  rationale: ここでは個々の男性所有者そのものより、奴隷の購入者・所有者を一般的な法的主体として示す。現代日本語の「人」は原文の機能を保ちながら、不自然な性別強調や「主人」という解釈的補足を避ける。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法規としての簡潔さと厳粛さを保った。「銀」は原文の具体的表現を保持し、「過越の食事」は代名詞の指示対象を日本語で明確にするため補った。
