  source_fidelity: 「エジプト人は民をせき立て」は、וַתֶּחֱזַק ... עַל־הָעָם の、エジプト人がイスラエルの民に強く圧力をかけたという意味を適切に表す。「一刻も早く彼らをその地から送り出そうとした」は、לְמַהֵר לְשַׁלְּחָם の切迫した急ぎと追放の意図を自然に再現している。「われわれは皆、死んでしまう」は、מֵתִים の恐怖に基づく切迫した「死ぬ／死にかけている」状態を、文脈に即して明瞭に訳している。
