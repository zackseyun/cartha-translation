translation_notes:
  register: 現代の一般読者に明瞭でありながら、出エジプト記の厳粛で切迫した物語調を保った。「一刻も早く」と「せき立てる」により、ヘブライ語の二つの不定詞と חזק על の強い緊急性を重複感なく表した。
