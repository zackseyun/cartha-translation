  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: ja
  text: エジプト人は民をせき立て、一刻も早く彼らをその地から送り出そうとした。彼らは、「われわれは皆、死んでしまう」と言ったのである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: エジプト人は民をせき立て
  rationale: חזק על はここで、相手に強く迫ることを表す。「せき立てる」は強い圧力と切迫感を自然な日本語で伝える。מִצְרַיִם は集合的に人々を指すため「エジプト人」とした。
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: 一刻も早く彼らを…送り出そうとした
  rationale: 連続する二つの不定詞が表す目的と緊急性を、日本語で明瞭に表現した。主体は文脈上エジプト人であり、イスラエルの民を急いで退去させようとする意味である。
- source_word: מִן־הָאָרֶץ
  choice: その地から
  rationale: 原文の「その地」を保ち、文脈上エジプトを指すことが分かる表現とした。
- source_word: כִּי אָמְרוּ
  choice: 彼らは、…と言ったのである
  rationale: כִּי がエジプト人の切迫した行動の理由を導くことを、日本語の説明的な結びで自然に示した。
- source_word: כֻּלָּנוּ מֵתִים
  choice: われわれは皆、死んでしまう
  rationale: מֵתִים は形の上では「死んでいる者たち／死ぬ者たち」だが、災厄がさらに及ぶとの切迫した認識を表す文脈では、日本語の「死んでしまう」が自然である。すでに全員が死亡しているという不自然な意味には限定しない。
