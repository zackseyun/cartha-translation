    rationale: ヘブライ語 הִכָּה は、主語であるヤハウェが「打った」という能動態である。日本語の「打たれた」はヤハウェが打撃を受けたとの読み、または不適切な尊敬受け身を生じうる。
  - severity: medium
    issue: 「王座に着くファラオ」は原文の分詞表現を十分に表していない。
    rationale: 「王座に着く」は即位する行為を表しやすいが、עַל כִּסְאוֹ に座るファラオという原文は、ここでは王座にある王としてのファラオを描写する。
  - severity: low
    issue: 脚注記号が文末のみで、該当する語句との結び付きがやや弱い。
    rationale: 語彙代替を示す脚注は「捕虜」および「牢獄の穴」の直後に置くと、どの語を説明するかが明瞭になる。
