  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: ja
  text: 真夜中、ヤハウェはエジプトの地のすべての初子を打った。王座に座っていたファラオの初子から、牢獄の穴にいた捕虜の初子[a]に至るまで、また家畜のすべての初子を打った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「捕虜」は「囚人」、「牢獄の穴」は「地下牢」とも訳せる。
    reason: הַשְּׁבִי は捕らわれ人または囚人を、בֵּית הַבּוֹר は文字どおりには「穴の家」を意味し、拘禁用の穴・牢獄を指すため。
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: 真夜中になったとき
  rationale: 物語の進行を示す וַיְהִי と時を表す句を、古風にならない自然な日本語で一体として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: הִכָּה
  choice: 打たれた
  rationale: この文脈では死をもたらす打撃を指すが、「殺した」と説明的に限定せず、原語の打つという像を保った。
- source_word: כָל בְּכוֹר
  choice: すべての初子
  rationale: בכור は人と家畜の双方の最初に生まれたものを指すため、聖書文体として通用しつつ簡潔な「初子」を用いた。
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: ファラオの初子から、…捕虜の初子に至るまで
  rationale: מִן ... עַד の範囲表現を保ち、最高位から最下層まで災いが及んだ構造を明示した。
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: 王座に着く
  rationale: 分詞は単なる一時的な着座より、統治者としての地位を表す。「王座に着く」はその王的身分を自然に示す。
- source_word: הַשְּׁבִי
  choice: 捕虜
  rationale: 戦争などで捕らえられた者を表す語義を保持した。「囚人」も文脈上可能であるため脚注に示した。
- source_word: בְּבֵית הַבּוֹר
  choice: 地下牢にいた
  rationale: 直訳的には「穴の家」で、拘禁施設としての穴・牢獄を指す。現代日本語で具体像が伝わる「地下牢」とした。
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: また家畜のすべての初子
  rationale: בהמה はここでは牛だけでなく飼育動物一般を指すため「家畜」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を明記しているため、称号「主」に置換せず音写する。「エホバ」は別の伝統的音写だが、ヘブライ語の推定発音により近い「ヤハウェ」を採った。
- issue: הִכָּה が表す死の明示性
  choice: 打たれた
  alternative: 打ち殺された／殺された
  rationale: 文脈上は死を意味するものの、原文は נכה の使役形で「打つ」という表現を用いるため、その像と神の直接的行為を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の裁きの厳粛さにふさわしい品位を保った。「初子」は「長子」より人と家畜の双方に適用しやすい。ヘブライ語の長い一文は日本語の可読性のため二文に分け、二文目で「打たれた」を補って述語を明確にした。脚注記号[a]は関連箇所を含む文末に置いた。
