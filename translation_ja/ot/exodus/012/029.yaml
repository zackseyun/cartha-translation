review_pass:
  verdict: revise
  source_fidelity: 主たる問題は、能動態の וַיהוָה הִכָּה（「ヤハウェが打った」）を「ヤハウェは…打たれた」とした点です。これは日本語では受け身（または不自然な尊敬表現）となり、行為者と被行為者を逆転させかねません。さらに、הַיֹּשֵׁב עַל כִּסְאוֹ は「王座に着く」ではなく、王座に座っているファラオを指します。
  naturalness: 「真夜中、…打った」とすることで、現代標準日本語として簡潔かつ明瞭になります。「王座に座っていた」は、王としての地位を示す文脈も保ちながら自然です。「牢獄の穴」は原語の具体的な「穴」の像を保つためやや重い表現ですが、脚注と合わせて理解可能です。
  terminology: 神名は原文に従い「ヤハウェ」を維持します。「初子」は人間と家畜の双方に適用できる聖書日本語として適切です。הַשְּׁבִי は「捕虜」、בֵּית הַבּוֹר は文脈上「牢獄の穴」とし、代替訳を脚注に残します。
