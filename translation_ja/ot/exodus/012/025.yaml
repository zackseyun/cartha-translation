source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: ja
  text: あなたがたが、ヤハウェが約束どおりあなたがたに与える地に入るとき、この儀式[a]を守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この奉仕」「この儀礼」とも訳せる。ここでは、定められた過越の祭儀を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ～たなら
  rationale: 将来の時点における状況を導く定型表現。日本語では条件を含む時の表現が自然である。
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: その地に入った
  rationale: בוא はここでは目的地への進入を表すため、「地に入る」とした。定冠詞は直前までの約束の地という文脈を踏まえ「その地」で表した。
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: ヤハウェが……与えてくださる
  rationale: 未完了形は文脈上、将来の授与を表す。神を主語とするため、明瞭で自然な敬語表現を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名を普通名詞や称号に置き換えず、本文に明示した。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 約束どおり
  rationale: 字義は「語ったとおり」だが、土地授与についての先行する発言を指す文脈では約束の含意が明白であり、自然な日本語でその力を表した。
- source_word: וּשְׁמַרְתֶּם
  choice: 守りなさい
  rationale: 祭儀を継続して遵守する義務を表す。日本語の命令形により、この文脈での規範的な力を明確にした。
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: この礼拝の務め
  rationale: עֲבֹדָה は奉仕・務めを意味し、ここでは過越の祭儀的実践を指す。「礼拝の務め」は祭儀性と奉仕の語感をともに保つ。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: ヘブライ語本文にある契約の神名を固有名として直接表し、称号への置換を避けた。
- issue: כַּאֲשֶׁר דִּבֵּר の約束としての理解
  choice: 約束どおり
  alternative: 語られたとおり／言われたとおり
  rationale: 動詞自体は「語る」だが、この箇所では土地を与えるという神の先行発言を指すため、約束という文脈的含意を本文に反映した。
- issue: הָעֲבֹדָה の祭儀的意味
  choice: 礼拝の務め
  alternative: この儀式／この奉仕
  rationale: 過越の祭りという直接の文脈で、一般的な労働ではなく定められた祭儀的奉仕を指すことを明確にした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい格調を保った。「礼拝の務め」は一般読者にも理解でき、原語の奉仕と祭儀の両面を伝える。
