review_pass:
  verdict: revise
  source_fidelity: יַהְוֶה is correctly rendered as 「ヤハウェ」, and the temporal/future sense is substantially preserved. However, 「礼拝の務め」 narrows עֲבֹדָה toward worship and introduces a conceptual nuance not explicit in the Hebrew. In this Passover context, the term denotes the prescribed rite/observance more directly.
  naturalness: The draft is understandable, but 「ヤハウェが約束どおり与えてくださる地」 has an awkward attachment of 「約束どおり」, and the honorific 「くださる」 is unnecessary in a direct divine command. 「…与える地に入るとき」 is smoother modern standard Japanese and retains the source syntax.
  terminology: 「ヤハウェ」 is appropriate. 「この儀式」 is a clearer contextual rendering of הָעֲבֹדָה than 「この礼拝の務め」; the footnote preserves the broader alternatives 「奉仕」 and 「儀礼」.
  issues:
  - severity: medium
    issue: 「礼拝の務め」
    rationale: עֲבֹדָה can mean service, but here it denotes the Passover ritual prescribed in the immediate context. 「礼拝」 adds a worship-specific sense that is not required by the Hebrew and is less natural than 「儀式」 in this command.
  - severity: low
    issue: 「約束どおり与えてくださる」
    rationale: The phrase is intelligible but syntactically less direct. The Hebrew states that Yahweh will give the land 「as he spoke」; rendering this as 「約束どおり…与える」 is natural and preserves the contextual promissory force without an unnecessary honorific.
  revised_text: あなたがたが、ヤハウェが約束どおりあなたがたに与える地に入るとき、この儀式[a]を守りなさい。
