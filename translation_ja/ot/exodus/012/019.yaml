source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: ja
  text: 七日間、あなたがたの家にパン種があってはならない。パン種を入れたものを食べる者はだれでも、その人はイスラエルの会衆[b]から断ち切られる[a]。寄留者[c]であれ、その地で生まれた者であれ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その者は断ち切られる」。このヘブライ語の慣用表現は、文脈により、追放、死、または神による裁きを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「会衆」は「集会」または「共同体」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「寄留者」は「居住外国人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 期間を表す句として、簡潔で自然な現代日本語にした。
- source_word: שְׂאֹר
  choice: パン種
  rationale: 発酵した食品全般ではなく、発酵を起こす種を指す。祭儀的文脈にも適する定着した訳語である。
- source_word: לֹא יִמָּצֵא
  choice: あってはならない
  rationale: 直訳的な「見いだされてはならない」より自然に、家の中に存在してはならないという禁止を表す。
- source_word: בְּבָתֵּיכֶם
  choice: あなたがたの家に
  rationale: 複数の住居・家々を集合的に指す自然な日本語表現とした。
- source_word: כָּל אֹכֵל מַחְמֶצֶת
  choice: パン種を入れたものを食べる者はだれでも
  rationale: 対象をパンだけに限定せず、כל の包括性も明示した。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: その人は……断ち切られる
  rationale: נפש をこの文脈では個人全体を指す「人」とし、כרת の処罰の具体的方法を限定せず契約的制裁の比喩を保った。
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: イスラエルの会衆から
  rationale: עֵדָה の公的・共同体的な意味を保つ簡潔な訳語を採用した。
- source_word: בַּגֵּר
  choice: 寄留者
  rationale: イスラエルの中に居住する非在来者を指し、現代の政治的な国籍概念を持ち込まない訳語とした。
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: その地で生まれた者
  rationale: גֵּר と対照される在地生まれの者という社会的区別を、分かりやすい現代日本語で示した。
theological_decisions:
- issue: 契約上の刑罰「断ち切られる」の意味
  choice: 「断ち切られる」という表現を保持し、刑罰の具体的内容を限定しない。
  alternative: 「死刑にされる」または「共同体から追放される」
  rationale: ヘブライ語の慣用表現は、文脈により死、共同体からの排除、神による裁きを含み得るため、本文だけでは確定できない緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。律法文としての厳粛さを維持しつつ、不自然な逐語訳を避けた。脚注記号は対応する語句の直後に置き、英語相談層に見られる記号位置の不整合は原語上の対象に合わせて整理した。
