  text: All the congregation of Israel shall do it[a].
translation:
  language: ja
  text: イスラエルの共同体全体は、これを行わなければならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの会衆全体は、これを守らなければならない。」
    reason: עֲדָהは「会衆」とも訳せ、עשהはこの文脈で過越の儀礼を「守る」とも訳せるため。
lexical_decisions:
- source_word: כָּל
  choice: 全
  rationale: 全体性を示す量化語。集合体としてのイスラエル会衆全体を自然な現代日本語で表す。
- source_word: עֲדַת
  choice: 会衆
  rationale: 集められた契約共同体を指す語であり、過越祭の共同体的・礼拝的文脈に適する。「集会」「共同体」も可能だが、「会衆」は原語の集合的な含意を簡潔に保つ。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 固有名詞として標準的な日本語表記を用いる。
- source_word: יַעֲשׂוּ
  choice: 行わなければならない
  rationale: 基本義は「行う、する」。ここでは過越の規定を実行する義務を表す未完了形であり、現代日本語の規定文として明確に訳した。「守らなければならない」は文脈上可能だが、解釈をやや加える。
- source_word: אֹתוֹ
  choice: これを
  rationale: 直前まで述べられた過越の行為・規定を受ける男性単数目的語代名詞。指示対象を「儀式」などと限定せず、原文の簡潔さと曖昧さを保つ。
theological_decisions:
- issue: 過越の命令における集合的主体
  choice: 「イスラエルの全会衆」とし、契約共同体全体に向けられた命令として訳す。
  alternative: 「イスラエル人は一人残らず」として個々人への命令を前面に出す。
  rationale: 原文は国民名を伴う集合名詞を主語としており、共同体を一つの全体として指す。各個人への義務を否定はしないが、原文以上に個人化しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「全会衆」で共同体的な主語を保ち、「これを」で指示対象を過度に特定しない。義務を示す文脈上の力は「行わなければならない」で自然に表した。
