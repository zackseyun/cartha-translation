  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: ja
  text: それを生のまま、または水で煮て食べてはならない。ただ、頭も脚も内臓も付けたまま、火で焼きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: 生のまま
  rationale: 調理法を規定する文脈で、火で焼くことや水で煮ることと対比される、十分に加熱されていない肉を指す。現代日本語では「生のまま」が明瞭で自然。
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: または水で煮て
  rationale: 同根語を重ねたヘブライ語表現と「水で」という指定から、一般的な加熱ではなく煮る調理法を意味する。日本語では「水で煮て」が簡潔かつ具体的。
- source_word: כִּי אִם
  choice: 必ず…なければならない
  rationale: 先行する二つの禁止に対し、許される唯一の調理法を強く限定する表現。その排他性を自然な日本語の義務表現で示した。
- source_word: צְלִי אֵשׁ
  choice: 火で焼き
  rationale: 火を手段として焼くことを表す。「火で焼く」は明瞭で、調理法を忠実に伝える。
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: 頭も脚も内臓も一緒に焼き
  rationale: 頭、脚、内臓を含めて焼くという列挙を、現代日本語で自然に表した。「一緒に」は反復される עַל がここで示す付加・随伴の意味を伝える。
- source_word: מִמֶּנּוּ
  choice: それを
  rationale: 原文には部分を表す含みがあるが、単節の日本語としては「それを食べてはならない」が自然であり、過越の動物の肉を指すことも明確。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、規定文としての厳粛さを保った。「脚」は動物の肢を日常的に示し、「内臓」は קֶרֶב の広い意味を過度に限定せず伝える。原文の調理法の対比と、全体を各部とともに焼く指示を自然な二文で表現した。
