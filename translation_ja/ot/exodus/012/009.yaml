  naturalness: 修正版は、規定として明快な現代標準日本語を保ちつつ、禁止と唯一許される調理法との対比を「ただ」で自然に示します。「付けたまま」は、頭・脚・内臓を含めた状態で焼くという指示を分かりやすく表します。
  terminology: 「生のまま」「水で煮て」「火で焼きなさい」は調理法の対比を正確に保っています。「内臓」はקִרְבּוֹのこの文脈での自然で適切な訳語です。「脚」は動物の肢を指す平明な語として問題ありません。
