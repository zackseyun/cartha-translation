  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: ja
  text: こうして、四百三十年の終わりに、まさにその日、ヤハウェのすべての軍勢[a]がエジプトの地から出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軍隊」または「部隊」とも訳せる。ヘブライ語は、組織された集団や軍隊を指すことがある。
    reason: צִבְאוֹתの語義には「軍勢」「軍隊」「組織された部隊」の幅があり、本文だけで一つに限定しないため。
lexical_decisions:
- source_word: מִקֵּץ
  choice: 終わった
  rationale: 期間が完了した時点を示す表現。日本語では「四百三十年が終わった」として時間的な意味を自然に表した。
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三十年
  rationale: ヘブライ語では三十と四百の順だが、日本語の通常の数詞順に整え、合計四百三十年を明確にした。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにその日に
  rationale: その特定の日であったことを強調する慣用表現。「まさに」により原文の強調を保った。
- source_word: יָצְאוּ
  choice: 出て行った
  rationale: エジプトを起点とする移動を、基本的な意味に即して簡潔に表した。
- source_word: כָּל צִבְאוֹת
  choice: すべての軍勢
  rationale: כָּלの包括性と、צָבָאが持つ組織された集団・軍勢という含みを保った。実戦部隊との意味に限定しないよう、訳語の幅がある「軍勢」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文に記された神の固有名を日本語で音写した。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 原文のאֶרֶץ（地）を明示し、地理的・国家的領域からの退出を表した。
- source_word: וַיְהִי
  choice: こうして
  rationale: 物語をつなぐ接続的な働きを自然な現代日本語で表した。原文で反復されるוַיְהִיのうち、後半は日本語の文構造に溶け込ませた。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、固有名として音写した。
- issue: צִבְאוֹת יְהוָה の意味合い
  choice: ヤハウェのすべての軍勢
  alternative: ヤハウェのすべての軍隊／ヤハウェのすべての部隊
  rationale: イスラエルの組織された諸集団という準軍事的な響きを保ちつつ、実際に戦闘する軍隊だけに意味を狭めない訳とした。語義の幅は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「まさにその日に」で原文の厳粛な時間的強調を再現し、「軍勢」は古風になりすぎない範囲で組織性と集合性を伝える語として採用した。
