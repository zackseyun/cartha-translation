  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: ja
  text: 彼らはエジプトから持ち出した生地を焼いて、種なしパンにした。生地が発酵していなかったからである。というのも、彼らはエジプトから追い出され、遅れることができず、また自分たちのための食料も用意していなかったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: 彼らは…焼いて
  rationale: 物語を進める動詞として、文頭の接続詞を日本語では明示せず、自然な叙述にした。
- source_word: הַבָּצֵק
  choice: 生地
  rationale: בצק は練ったパン生地を指す。現代日本語では簡潔な「生地」が文脈上明瞭である。
- source_word: עֻגֹת מַצּוֹת
  choice: 種なしのパン
  rationale: עֻגֹת は丸いパン・菓子状のパン、מַצּוֹת は種なしパンを表す。「菓子」という誤解を避け、食物として自然な表現を選んだ。
- source_word: כִּי לֹא חָמֵץ
  choice: 生地にはまだパン種が入っていなかった
  rationale: חמץ の動詞的表現は、生地がパン種を含む状態になっていなかったことを示す。「まだ」により、出発を急いだ時間的状況も自然に伝える。
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: 彼らはエジプトから追い出され
  rationale: גֹרְשׁוּ の受動形が示す強制的な退去を保持した。
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: ぐずぐずしていることができず
  rationale: התמהמה はその場にとどまって遅れることを表す。切迫した状況が分かる自然な現代語とした。
- source_word: צֵדָה
  choice: 旅の食料
  rationale: צֵדָה は旅のための食料・携行食を指す。「食料」だけより用途が明瞭で、広すぎる「物資」を避けられる。
- source_word: לָהֶם
  choice: 自分たちのための
  rationale: 与格代名詞の意味を直接保ち、自分たちが携える食料を用意していなかったことを示す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、出エジプトの切迫感と強制退去のニュアンスを保持した。「パン種」は聖書文脈で定着した語だが、「種なしのパン」と組み合わせることで一般読者にも理解しやすくした。
