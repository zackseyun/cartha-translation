  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: ja
  text: この月は、あなたがたにとって月々の始まりとなる。これは、あなたがたにとって一年の最初の月となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: この月
  rationale: חֹדֶשׁは新月と関係する語だが、この暦制定の文脈では暦上の「月」を指す。日本語では「この月」が明瞭で自然である。
- source_word: לָכֶם
  choice: あなたがたの／あなたがたにとって
  rationale: イスラエルを基準・当事者として定める関係を表す。同じ語を各文脈に自然な日本語で表現した。
- source_word: רֹאשׁ חֳדָשִׁים
  choice: 月々の始まり
  rationale: רֹאשׁの原義は「頭」だが、時間的順序では「始まり」を意味する。「月々の始まり」は構文と暦上の意味を保つ。
- source_word: רִאשׁוֹן
  choice: 最初の月
  rationale: 月の順序における第一を明示する形容詞であり、日本語では文脈上の「月」を補うのが自然である。
- source_word: הוּא
  choice: これは……となる
  rationale: 代名詞が「この月」を受ける。無動詞文の制度制定的な力を、現代日本語で自然な「となる」によって表した。
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: 一年の
  rationale: 一年を構成する月々の中での位置を示す。簡潔な「一年の」で暦上の範囲が明瞭になる。
theological_decisions:
- issue: 立法的文脈におけるヘブライ語無動詞文の力
  choice: 「始まりとしなさい」「となる」として制定の力を表す
  alternative: 「始まりである」「最初の月である」という単純現在
  rationale: 原文には明示的な動詞がないが、周囲は神がイスラエルの暦を定める指示の文脈である。日本語では制度制定の意味を自然に伝えるため、命令と将来的帰結を表す形にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「月々」は複数的なחֳדָשִׁיםを自然に示す。新月という語義上の連想は、この箇所の直接の指示対象が暦月であるため本文には持ち込まず、不要な脚注も付さなかった。
