  text: וְ/הָיָ֤ה לָ/כֶם֙ לְ/מִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/שָׁחֲט֣וּ אֹת֗/וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת יִשְׂרָאֵ֖ל בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: ja
  text: あなたがたは、それをこの月の十四日まで保管しておきなさい。そして、イスラエルの会衆全体が、夕暮れのころに[a]それを屠りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「二つの夕べの間に」。一般に日没前後の夕暮れの時間帯を指すと理解されるが、厳密な時間範囲については諸説ある。
    reason: ヘブライ語の慣用表現の字義を示し、その時間範囲が確定していないことを保持するため。
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: あなたがたのもとで取り置かなければならない
  rationale: 直訳的な「あなたがたのために保管のものとなる」ではなく、選んだ家畜を指定日まで管理しておくという命令の意味を、自然な現代日本語で表した。「取り置く」は、後の使用に備えて確保しておくことを示す。
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: この月の十四日まで
  rationale: ヘブライ語の暦日の表現を、簡潔で自然な日本語にした。
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: それを屠らなければならない
  rationale: שׁחטは家畜を食用・儀礼用に屠ることを指すため、一般的な「殺す」より具体的な「屠る」を用いた。目的語は前節までに選ばれた羊または山羊を指す。
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: イスラエルの会衆の集まり全体
  rationale: קהלとעדהが重なる集合表現を完全には平板化せず、イスラエル全体の共同的参与を示す表現とした。日本語として理解可能な範囲で原文の重なりを保った。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 夕暮れ時に
  rationale: 字義は「二つの夕べの間」であり解釈に幅があるが、日没前後の時間帯を指す慣用句として本文では自然な「夕暮れ時に」とした。字義と幅は脚注に残した。
theological_decisions:
- issue: 屠る命令の集合的主語
  choice: イスラエルの会衆の集まり全体が、それを屠る
  alternative: 各家族がそれぞれの家畜を屠る
  rationale: 周辺文脈では各家ごとの実施が想定される一方、この節の文法上の主語はイスラエル共同体全体を表す集合語である。その共同体的表現を個別の家族へ説明的に置き換えず、原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、律法の指示にふさわしい簡潔で格調ある文体とした。「屠る」は日常語よりやや文語的だが、家畜の屠殺を正確かつ簡潔に示す語として採用した。
