base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: ja
  text: まさにその日、ヤハウェは、イスラエルの子ら[a]をその部隊ごとに[b]エジプトの地から導き出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」または「イスラエルの民」とも訳せる。ヘブライ語は直訳すると「イスラエルの子ら」で、ここでは共同体全体を指す家族的な表現。
    reason: lexical_alternative
  - marker: b
    text: 「その軍勢に従って」または「その集団ごとに」とも訳せる。ヘブライ語は、彼らが秩序立った集団として出発したことを強調している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにその日
  rationale: וַיְהִיはここで物語を時間句へつなぐ談話機能を持つため、独立した定型句にはせず自然な日本語に織り込んだ。בְּעֶצֶם ... הַזֶּהの強調は「まさに」で表した。
- source_word: הוֹצִיא
  choice: 導き出された
  rationale: יצאのヒフィル形が示す使役的な「外へ出す」を、出エジプトの文脈に即した自然な表現で示す。敬語の「られた」は主語ヤハウェへの敬意を表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 直訳的な親族・共同体表現を保つ。「子ら」はこの文脈ではイスラエル民族全体を集合的に指す。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: エジプトの地から
  rationale: אֶרֶץを省略せず「地」として保持し、מןの起点を「から」で表した。
- source_word: עַל צִבְאֹתָם
  choice: その部隊ごとに
  rationale: צָבָאは軍勢、隊、組織された集団を表し得る。ここでは戦闘性を必要以上に強めず、秩序立った集団単位という含みを「部隊ごとに」で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いているため、その区別を保って音写する。
- issue: בְּנֵי יִשְׂרָאֵל の集合的意味
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の家族的・系譜的な言い回しを本文に残しつつ、脚注で民族全体を指すことを明示する。
- issue: צִבְאֹתָם の性格
  choice: その部隊ごとに
  alternative: その軍勢に従って、その集団ごとに
  rationale: 語の組織的・軍団的な響きを保つ一方、実際の戦闘部隊だったと断定しない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。語順は日本語として自然に整えつつ、「イスラエルの子ら」「エジプトの地」など原文の主要な表現を保持した。脚注記号は該当語句の直後に置いた。
