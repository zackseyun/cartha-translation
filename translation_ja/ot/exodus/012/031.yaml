  source_fidelity: ヘブライ語の夜間の呼び出し、二つの連続命令（「立て／出て行け」）、ファラオの民の中からの離脱、モーセとアロンおよびイスラエルの人々を併記する強調、ヤハウェに仕えること、そして「あなたがたが言ったとおり」という結びを、いずれも適切に伝えている。「ファラオ」は前後の文脈に基づく安全な主語補足である。
  naturalness: 明瞭で現代標準日本語として自然であり、緊急の命令場面にふさわしい簡潔さがある。「立って、…出て行け」は日本語では連続動作を自然に表し、原文の命令の連鎖も保っている。「おまえたち」は強い命令口調として文脈に合う。
