  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: ja
  text: その夜、ファラオはモーセとアロンを呼び寄せて言った。「立って、私の民の中から出て行け。おまえたちも、イスラエルの人々もだ。そして、おまえたちが言ったとおり、行ってヤハウェに仕えよ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェを礼拝せよ」。
    reason: עבד は神に「仕える」と「礼拝する」の両義を含み得るため。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せて
  rationale: この文脈では、ファラオがモーセとアロンを夜中に自分のもとへ呼ぶ行為を表す。「呼び寄せる」は、単に声をかける以上の召喚の意味を自然な現代日本語で伝える。
- source_word: לַיְלָה
  choice: その夜
  rationale: 時を示す副詞的用法。「その夜」は物語の流れに自然に結びつき、出来事が夜に起きたことを明確にする。
- source_word: קוּמוּ צְּאוּ
  choice: 立って、…出て行け
  rationale: 連続する複数形の命令を、日本語で緊迫感のある命令として表した。「立ち上がれ」も可能だが、「立って」のほうが後続の行動と自然につながる。
- source_word: מִתּוֹךְ עַמִּי
  choice: 私の民の中から
  rationale: 「私の民のただ中から」という空間的・社会的な離脱の意味を保ちつつ、過度に文語的にならない表現とした。
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: おまえたちも、イスラエルの人々もだ
  rationale: 反復される גַּם…גַּם の包括と強調を「…も、…も」で再現した。בְּנֵי יִשְׂרָאֵל は字義的には「イスラエルの子ら」だが、ここでは民族全体を指す慣用句なので、明瞭な「イスラエルの人々」とした。
- source_word: עִבְדוּ
  choice: 仕えよ
  rationale: עבד は神への奉仕と礼拝の双方を含み得る。「仕える」はその広い意味を保ち、「礼拝する」だけに限定しない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で一般的な学術的表記により音写した。
- source_word: כְּדַבֶּרְכֶם
  choice: おまえたちが言ったとおり
  rationale: モーセとアロンが求めていた内容を、ファラオが認めるという適合・一致の意味を自然に表す。
theological_decisions:
- issue: עבד が神との関係で持つ意味の幅
  choice: 仕えよ
  alternative: 礼拝せよ
  rationale: この語は礼拝行為を含むが、それだけでなく神への奉仕という広い意味も持つため、本文では「仕える」とし、別訳を脚注に示した。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として音写し、「主」への置換を避けた。
- issue: וַיִּקְרָא の省略された主語
  choice: ファラオは
  alternative: 彼は／主語を省略する
  rationale: ヘブライ語本文の動詞は主語を明示しないが、直前の文脈ではファラオが指示対象である。独立した節としても明瞭になるよう固有名を補った。
translation_notes:
  register: 明瞭で現代的ながら、命令場面の厳粛さと切迫感を保つ文体とした。ファラオの二人称には「おまえたち」を用い、権力者による命令口調を示した。英語相談層の脚注記号と脚注内容には位置の不整合があるため、それを踏襲せず、ヘブライ語本文から実質的な語義上の別訳のみを付した。
