source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/דָּ֨ם לָ/כֶ֜ם לְ/אֹ֗ת עַ֤ל הַ/בָּתִּים֙ אֲשֶׁ֣ר אַתֶּ֣ם שָׁ֔ם וְ/רָאִ֨יתִי֙ אֶת הַ/דָּ֔ם וּ/פָסַחְתִּ֖י עֲלֵ/כֶ֑ם וְ/לֹֽא יִֽהְיֶ֨ה בָ/כֶ֥ם נֶ֨גֶף֙ לְ/מַשְׁחִ֔ית בְּ/הַכֹּתִ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: ja
  text: その血は、あなたがたがいる家々の上で、あなたがたのためのしるしとなる。わたしはその血を見て、あなたがたの上を過ぎ越す[a]。わたしがエジプトの地を打つとき、あなたがたの間には、滅ぼす災いが起こらない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたを免れさせる」「あなたがたを守る」。
    reason: lexical_alternative
  - marker: b
    text: または「あなたがたの間には、滅ぼす者による災いは起こらない」。「滅ぼす」を名詞的に「滅ぼす者」と解する場合。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: その血は、あなたがたのためのしるしとなる
  rationale: 未来的・結果的な意味を持つ文脈に従い、「しるしとなる」とした。לָכֶם は、このしるしがイスラエルの民のために機能することを示すため「あなたがたのため」と訳した。
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: あなたがたのいる家々にあって
  rationale: 血が家に付けられるという空間関係と、その家に民がいるという関係節を、自然な現代日本語で表した。
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: わたしはその血を見て
  rationale: 接続された完了形が文脈上表す時間的順序を、日本語の連用表現で明確にした。
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: あなたがたの上を過ぎ越す
  rationale: פסח と「過越」の語彙的・正典的な結び付きを保ちつつ、עֲלֵיכֶם の「上を」に相当する表現も残した。
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: あなたがたの間には、…災いは起こらない
  rationale: בָכֶם を「あなたがたの間に」とし、נֶגֶף を文脈に合う「災い」と訳した。「起こらない」により自然な日本語の存在表現とした。
- source_word: לְמַשְׁחִית
  choice: 滅ぼす
  rationale: לְ と מַשְׁחִית の難しい結合を、ここでは災いの作用・結果を表す語として訳した。人格的な「滅ぼす者」という理解も可能なので脚注に示した。
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: わたしがエジプトの地を打つとき
  rationale: 前置詞付き不定詞の時間的意味を「とき」で表し、神がエジプトの地を打つという原文の構造を明瞭に保った。
theological_decisions:
- issue: וּפָסַחְתִּי עֲלֵכֶם における פסח の意味
  choice: あなたがたの上を過ぎ越す
  alternative: あなたがたを免れさせる／あなたがたを守る
  rationale: 本文では過越との語彙的なつながりを保つ訳を採用し、この動詞が含み得る「免れさせる」「守る」という効果的意味を脚注に残した。
- issue: לְמַשְׁחִית が破壊の作用を表すか、人格的な「滅ぼす者」を表すか
  choice: 滅ぼす災い
  alternative: 滅ぼす者による災い
  rationale: この節の構文だけでは人格的主体を明示する必要がないため、本文は作用・結果として訳した。ただし名詞的解釈も可能なので脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「しるし」「過ぎ越す」「災い」「打つ」は聖書本文としての連続性を保ちながら、一般読者にも理解できる語を用いた。すべての脚注記号を本文中に配置した。
