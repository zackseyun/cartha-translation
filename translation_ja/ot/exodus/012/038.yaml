  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: ja
  text: さらに、さまざまな人々から成る大集団も彼らと一緒に上って行った[a]。羊や山羊の群れと牛の群れもあり、家畜は非常に多かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大勢の入り交じった人々」または「入り交じった群衆」。ヘブライ語の表現は、イスラエルに同行した、さまざまな人々から成る集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: さらに…も
  rationale: 接続詞と副詞の付加的な意味を、現代日本語で自然な形にした。
- source_word: עֵרֶב רַב
  choice: さまざまな人々から成る大集団
  rationale: עֵרֶב の異質な構成と רַב の規模の大きさをともに表し、民族構成を本文以上に特定しない。
- source_word: עָלָה אִתָּם
  choice: 彼らと一緒に上って行った
  rationale: 同行を明確にしつつ、出エジプトの移動に用いられる עלה の『上る』という語感を保った。
- source_word: וְ/צֹאן וּ/בָקָר
  choice: 羊や山羊の群れと牛の群れもあり
  rationale: צֹאן を羊だけに限定せず小家畜の集合として示し、בָקָר との区別を自然な日本語で保った。
- source_word: מִקְנֶה כָּבֵד מְאֹד
  choice: 家畜は非常に多かった
  rationale: 『非常に重い家畜』という直訳を避け、家畜の量が甚だ多いというヘブライ語の慣用的意味を明瞭に表した。
