  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: ja
  text: あなたがたはヒソプの束を取り、鉢[a]の中の血に浸し、鉢の中の血を戸口の上の横木と、戸口の両側の二本の柱につけなさい。あなたがたはだれ一人、朝まで自分の家の戸口から外に出てはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鉢」と訳したヘブライ語は、「敷居」とも訳せる。ここでは、血がその中にあり、ヒソプをそこに浸すと述べられているため、「鉢」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: ヒソプの束
  rationale: אֲגֻדָּהは束ねた一まとまりを表す。「束」は具体的な祭儀用具としての形を簡潔に伝える。אֵזוֹבの植物学的同定には議論があるため、伝統的で広く通用する音写「ヒソプ」を用いた。
- source_word: בַּדָּם
  choice: 血に
  rationale: טבל（浸す）に伴う前置詞בは、浸す対象を示す。日本語では「血に浸す」が自然である。
- source_word: הַסַּף
  choice: 鉢
  rationale: 血がその中にあり、ヒソプをそこへ浸すという直近の文脈から、血を入れる器の意味を採った。ただし「敷居」も語義上可能なので脚注に残した。
- source_word: וְהִגַּעְתֶּם
  choice: つけなさい
  rationale: נגעのヒフィル形は、ここでは血を戸口の各部分に接触させる行為を表す。「つける」は、打ちつける等の余分な動作を加えず、現代日本語として自然である。
- source_word: הַמַּשְׁקוֹף
  choice: 戸口の上の横木
  rationale: 戸口上部の水平材を指す。「鴨居」よりも一般の読者に分かりやすく、建築上の位置も明確である。
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: 左右二本の柱
  rationale: 戸口の両側に立つ二本の柱を指す。日本語では「左右二本」として位置と数を明確にした。
- source_word: מִן הַדָּם
  choice: 鉢の中の血を
  rationale: מִןは鉢にある血の一部を用いることを示すが、日本語では対象を「血を…つける」と表すのが自然であり、文脈上、全部を使い切る意味にはならない。
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: あなたがたはだれ一人…出てはならない
  rationale: 複数への禁止に続くאִישׁの個別配分的な力を、「だれ一人」で自然かつ明確に表した。
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: 自分の家の戸口から外に
  rationale: פֶּתַחは家の開口部・入口を指す。「戸口」は直前の戸口の部材ともよく対応する。三人称単数接尾辞の個別配分的意味は「自分の家」で保持した。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 時間的限界を直接かつ自然に表す。
theological_decisions:
- issue: אִישׁ … בֵּיתוֹの男性単数形を伴う個別配分表現
  choice: あなたがたはだれ一人、朝まで自分の家の戸口から外に出てはならない
  alternative: あなたがたは、それぞれ朝まで彼の家の戸口から出てはならない
  rationale: ヘブライ語の男性単数形は、ここでは命令の対象を男性だけに限定するというより、共同体の各人に禁止を個別適用する表現である。日本語の「だれ一人」「自分の家」はその個別配分性を保ち、不自然な性別限定を持ち込まない。
- issue: הַסַּףの意味
  choice: 鉢
  alternative: 敷居
  rationale: 血がその中にあり、ヒソプを浸すという構文は容器の意味を強く支持する。一方、「敷居」は真正な語義上の別解なので、本文で暗黙に排除せず脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを「なさい」「てはならない」で表した。専門的な建築語「鴨居」は避けて「戸口の上の横木」とし、祭儀植物名「ヒソプ」は慣用表記を保持した。
