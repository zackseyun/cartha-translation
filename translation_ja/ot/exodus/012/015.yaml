  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: ja
  text: 七日間、あなたがたは種なしパンを食べなければならない。ただし、第一日には、あなたがたの家々からパン種を取り除きなさい[a]。第一日から第七日まで、発酵させたものを食べる者は皆、イスラエルから断たれる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの家々からパン種を絶えさせなさい」。「取り除く」のほか、「なくす」「処分する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「断たれる」はヘブライ語の法的表現。共同体からの追放、死、あるいは神の裁きを指す可能性があるが、この節は具体的な形を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: 種なしパン
  rationale: パン種を入れずに作ったパンを指す。過越の祭りの文脈に合い、現代日本語で意味が明瞭な表現とした。
- source_word: אַךְ
  choice: ただし
  rationale: 一般的な命令に続いて、第一日に関する限定的で強調された規定を導く機能を自然に表す。
- source_word: תַּשְׁבִּיתוּ
  choice: 取り除きなさい
  rationale: שׁבת のヒフィル形は、ここではパン種を家からなくすことを意味する。直訳的な「絶えさせる」より、命令の実際的意味を明瞭に伝える。
- source_word: שְּׂאֹר
  choice: パン種
  rationale: 発酵を起こす種を指す。祭儀的文脈を保ちつつ、日本語で通用する聖書用語を用いた。
- source_word: חָמֵץ
  choice: 種の入ったもの
  rationale: パンだけに限定せず、発酵させたものを広く指し得るため、原語の範囲を保つ表現とした。
- source_word: וְנִכְרְתָה
  choice: 断たれる
  rationale: 契約・法的文脈の כרת の受動表現を保ち、共同体からの排除、死、神の裁きのいずれかに意味を限定しない。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: その人（日本語本文では「者」に統合）
  rationale: נֶפֶשׁ はこの法的定型句では個々の人を指す。日本語では「食べる者は皆」とまとめることで、不自然な重複を避けた。
- source_word: מִיִּשְׂרָאֵל
  choice: イスラエルから
  rationale: 契約共同体から断たれるという原文の簡潔な言い方を保持した。
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: 第一日から第七日までの間に
  rationale: 禁止と制裁が適用される期間を明確にし、両端の日を含む自然な日本語とした。
theological_decisions:
- issue: 「断たれる」（וְנִכְרְתָה）という制裁の意味
  choice: 具体的な執行方法を特定せず、「イスラエルから断たれる」と訳す。
  alternative: 共同体から追放される／死刑に処せられる／神の裁きによって除かれる
  rationale: この法的表現には契約上・司法上の重みがあるが、本節だけでは追放、死、神による裁きのいずれを意味するか特定されない。原文の曖昧さと神学的緊張を保持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「あなたがた」を用いて複数命令を明示し、法的命令には「なければならない」「なさい」を用いた。「種なしパン」「パン種」は一般読者にも理解可能な伝統的聖書語として保持した。脚注[a]は、その内容に対応する「取り除きなさい」の直後に置いた。
