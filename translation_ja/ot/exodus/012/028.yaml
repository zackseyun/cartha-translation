  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ וַ/יַּֽעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: ja
  text: こうして、イスラエルの子ら[a]は行って、そのとおりにした。ヤハウェがモーセとアロンに命じたとおりに、彼らはそのようにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より慣用的には「イスラエル人たち」。
    reason: בְּנֵי יִשְׂרָאֵל の自然な日本語による別訳を示すため。
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 行き
  rationale: הלךの物語を進める形を簡潔に訳した。過越の指示を実行しに行ったことは文脈から分かるため、動詞自体には目的を補わない。
- source_word: וַיַּעֲשׂוּ
  choice: そのとおりにした
  rationale: עשהが直前までに命じられた行為を受けているため、目的語を詳しく補わず、指示どおり実行したという照応関係を自然な日本語で示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義的な家族・子孫の表現を保ちつつ、「息子たち」がヤコブの直接の息子だけを指すように響く誤解を避けた。慣用的な「イスラエル人」は脚注に示した。
- source_word: כַּאֲשֶׁר
  choice: …とおり
  rationale: 命令と実行の正確な対応を表す日本語として自然であり、比較・一致の意味を明確に伝える。
- source_word: צִוָּה
  choice: 命じた
  rationale: צוהの意味を直接表す。日本語では出来事の前後関係が文脈と従属節によって明らかなため、過去完了に相当する補助表現は加えない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を音写して示した。
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロンに
  rationale: אֵתは二人を命令の直接の対象として示す。日本語の「命じる」が要求する格に従って「に」とし、「を通して」という媒介の意味は加えない。
- source_word: כֵּן עָשׂוּ
  choice: そのとおりにした
  rationale: 結びの反復を残し、彼らが命令に正確に従ったことを強調する。直前の訳語とそろえることで、原文のעשהの反復も反映した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された固有の神名を称号で代用せず、音写によって保持した。
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人たち
  rationale: 原文の系譜的・共同体的な表現を本文に残した。一方、この文脈ではイスラエル民族全体を指す慣用表現なので、自然な言い換えを脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。原文にあるעשהの反復は、日本語でも「そのとおりにした」を二度用いて保持した。
