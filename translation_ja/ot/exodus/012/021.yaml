  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: ja
  text: そこでモーセは、イスラエルの長老たちを皆呼び寄せて言った。「自分たちのために、家族ごとに群れの家畜を引き出して[a]取り、過越のいけにえを屠りなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「引き出して」は、「選び出して」とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「過越を屠りなさい」。ここで「過越」は、過越のために屠る犠牲の動物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せて
  rationale: ここでは、モーセが長老たちを集めて指示を与える場面なので、単なる「呼んで」より召集の意味を自然に表す。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: イスラエルの長老たち
  rationale: 民を代表する指導者たちを指す定着した表現。
- source_word: מִשְׁכוּ וּקְחוּ
  choice: 引き出して取り
  rationale: 二つの命令を一つにまとめず、「引く」と「取る」という原文の動作を保つ。「引き出す」には群れから選び出す意味も含み得るため、脚注で補足する。
- source_word: לָכֶם
  choice: あなたがたの……ために
  rationale: 自分たちの家族のために動物を確保するという与格の意味を、自然な日本語で表す。
- source_word: צֹאן
  choice: 群れの家畜
  rationale: 羊だけでなく山羊も含み得る小型家畜の集合名詞であり、直前の12章5節とも整合する。「小家畜」より一般読者に分かりやすい。
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: あなたがたの諸家族のために
  rationale: 家族・氏族ごとに用意する指示を自然に示す。「諸家族」により複数形も反映する。
- source_word: וְשַׁחֲטוּ
  choice: 屠りなさい
  rationale: 食用・犠牲用の動物を正式に殺す語であり、祭儀的文脈にふさわしい重みと正確さがある。
- source_word: הַפָּסַח
  choice: 過越のいけにえ
  rationale: 字義は「過越」だが、ここでは換喩的に過越のために屠る動物を指す。羊または山羊であり得るため、「過越の小羊」より広い表現を採る。
theological_decisions:
- issue: הַפָּסַח の指示対象
  choice: 過越のいけにえ
  alternative: 過越／過越の小羊
  rationale: 文脈上は祭りそのものではなく、屠られる犠牲動物を指す。ただし12章5節では羊と山羊のどちらも認められているため、「小羊」に限定せず、原文の換喩を明確にする。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「屠る」は祭儀的な家畜の殺処分を正確に表すため採用した。「群れの家畜」は羊と山羊の双方を含み得る原語の広さを保つ。
