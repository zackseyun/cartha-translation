revisions:
- from: そこでモーセは、イスラエルの長老たちを皆呼び寄せて言った。「あなたがたの諸家族のために、群れの家畜を引き出して取り[a]、過越のいけにえを屠りなさい[b]。」
  to: そこでモーセは、イスラエルの長老たちを皆呼び寄せて言った。「自分たちのために、家族ごとに群れの家畜を引き出して[a]取り、過越のいけにえを屠りなさい[b]。」
  rationale: לָכֶםを「自分たちのために」、לְמִשְׁפְּחֹתֵיכֶםを「家族ごとに」とそれぞれ訳し分けた。これにより、各家族単位で自分たちのために動物を取るというヘブライ語の構文を明瞭に再現する。その他の語彙選択と脚注の趣旨は原文に忠実であり、維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:11Z'
