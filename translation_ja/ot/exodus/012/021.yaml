  terminology: 「イスラエルの長老たち」「群れの家畜」「過越のいけにえ」「屠りなさい」はいずれも文脈に適切である。「過越のいけにえ」は、羊だけでなく山羊も含み得る対象を「小羊」に狭めない点で特に妥当である。
