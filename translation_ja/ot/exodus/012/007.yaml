translation:
  language: ja
  text: そして、その血を少し取り、その羊を食べる家々[a]の二本の門柱と鴨居に付ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこでその羊を食べることになる家々」。ヘブライ語の未完了形は、この指示の文脈では未来の意味にも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: そして、…取る
  rationale: 過越の儀式についての一連の指示であるため、接続詞付き完了形の指示的な力を、前後の命令文になじむ現代日本語で表した。
- source_word: מִן הַדָּם
  choice: その血を少し
  rationale: 前置詞 מִן の部分を示す用法を明示し、血の全部ではなく一部を取る意味を自然に表した。
- source_word: וְנָתְנוּ
  choice: 塗る
  rationale: נתן の基本義は「置く、付ける」だが、血を門柱と鴨居に付着させる場面では「塗る」が具体的で自然。ただし塗布方法までは限定しない。
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: 二本の門柱に
  rationale: מְזוּזוֹת は戸口の左右に立つ柱を指すため、簡潔で定着した建築語「門柱」を用いた。
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: 鴨居に
  rationale: מַשְׁקוֹף は戸口上部の横材を指す。「鴨居」は日本語で正確かつ簡潔な対応語である。
- source_word: עַל הַבָּתִּים
  choice: 家々の
  rationale: ここで עַל は、血を塗る門柱と鴨居がどの家に属するかを示す。日本語では「家々の」と連体修飾にするのが自然で、各家が対象であることも表せる。
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: その羊を食べる家々
  rationale: 関係節が「家々」を修飾する構造を保った。אֹתוֹ の指示対象は直前の文脈にある過越の羊なので、単なる「それ」より明瞭な「その羊」とした。未完了形の未来的ニュアンスは脚注に示した。
