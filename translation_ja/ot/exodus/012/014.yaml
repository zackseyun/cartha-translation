  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: ja
  text: この日は、あなたがたにとって記念となる。あなたがたはこれをヤハウェへの祭りとして祝いなさい。代々にわたり、永続する定めとして、これを祝いなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永遠の定め」または「恒久の定め」とも訳せる。ヘブライ語の表現 חֻקַּת עוֹלָם は、長く継続して守るべき定めを指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה לָכֶם
  choice: この日は、あなたがたにとって……となる
  rationale: 法的・指示的文脈における未来的な効力を自然な現代日本語で表し、לָכֶם の関係・受益の意味も保持した。
- source_word: לְזִכָּרוֹן
  choice: 記念の日
  rationale: זִכָּרוֹן は「記念」「覚え」を意味する。この文脈では、その日自体が記念となることを明瞭にするため「記念の日」とした。
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: これを……祭りとして祝い
  rationale: 動詞 חגג と同根の名詞 חַג の反復を、日本語として自然な「祭りとして祝う」で表した。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 神名 יהוה を固有名「ヤハウェ」として示し、祭りがヤハウェにささげられ、その方をあがめるものであることを表した。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたって
  rationale: 後代へ継続して守るという慣用的意味を、簡潔で自然な日本語にした。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: חֻקָּה の法的な「定め」と、עוֹלָם の継続的・恒久的な効力を表しつつ、哲学的な絶対無限を過度に断定しない表現とした。
- source_word: תְּחָגֻּהוּ
  choice: 祝わなければならない
  rationale: 反復された חגג の命令的効力を明確にし、前半の「祝い」と語彙をそろえた。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に神名が明記されているため、称号に置き換えず、一般的な学術的再建に基づく「ヤハウェ」とした。
- issue: חֻקַּת עוֹלָם の時間的効力
  choice: 永続する定め
  alternative: 永遠の定め、とこしえの定め
  rationale: イスラエルの代々にわたる継続的な規定という文脈上の力を保ち、ヘブライ語の曖昧さを越えて形而上学的な無終性を断定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法的な厳粛さと祭りの祝祭性を保った。「記念の日」は日本語で意味を明確にするための自然な補足であり、「代々にわたって」は原文の継続性を簡潔に表す。脚注記号[a]は、その説明対象である「永続する定め」の直後に置いた。
