  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: ja
  text: その地に生まれた者にも、あなたがたの間に寄留している者にも、一つの律法がある。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法」は「教え」または「定め」とも訳せる。
    reason: תּוֹרָהの語彙上の訳し分けの可能性を示すため。本文では過越の規定という法的文脈に従い「律法」と訳した。
lexical_decisions:
- source_word: תּוֹרָה
  choice: 律法
  rationale: 過越の祭りに関する拘束力のある規定という法的文脈を表す。一般的な「教え」より「律法」が適切である。
- source_word: אַחַת
  choice: 同じ
  rationale: 直訳は「一つ」だが、二つの集団に共通する単一の法的基準を、現代日本語では「同じ律法」と自然に表せる。
- source_word: יִהְיֶה
  choice: 適用される
  rationale: 字義的には「ある」だが、律法が双方を等しく規律するという法的意味を日本語で明瞭にする。
- source_word: אֶזְרָח
  choice: 生まれながらの民
  rationale: 共同体に属する土着の者を指す。「市民」は後代の政治制度を連想させるため避けた。
- source_word: גֵּר
  choice: 寄留者
  rationale: イスラエルの共同体の中に居住する非在来者を示す伝統的かつ簡潔な聖書語であり、単なる訪問者ではない居住性を保つ。
- source_word: הַגָּר
  choice: 住む
  rationale: גֵּרと同根の分詞が、その者が共同体内に居住していることを限定する。日本語では語根の反復より自然さを優先した。
- source_word: בְּתוֹכְכֶם
  choice: あなたがたの間に
  rationale: 共同体のただ中での居住を、明瞭で現代的な日本語で表す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法令としての厳粛さを保った。「寄留者」はやや聖書的な語だが、גֵּרの居住外国人としての意味を簡潔に保持するため採用した。
