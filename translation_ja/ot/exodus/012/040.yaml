  text: וּ/מוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּ/מִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: ja
  text: イスラエルの子ら[a]がエジプトに住んだ期間は、四百三十年であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の古代の写本と訳は、「イスラエルの子らとその父祖がエジプトとカナンに住んだ期間は、四百三十年であった」としている。
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: 住んだ期間
  rationale: ここでは居住すること、またはその期間を指す。「居住」だけでは日本語で期間との関係が曖昧になりやすいため、文脈に即して「住んだ期間」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の字義と契約共同体を表す伝統的な言い方を保つ。「イスラエル人」より原文の表現が見えやすい。
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: が…住んだ
  rationale: ישׁבの通常の意味を自然な現代日本語で表し、関係節を「期間」に組み込んで明瞭にした。
- source_word: בְּמִצְרָיִם
  choice: エジプトに
  rationale: 場所を示す前置詞と地名を自然な日本語で表した。
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三十年
  rationale: ヘブライ語では「三十年と四百年」の順だが、日本語の自然な数詞の順序に整え、同じ期間を明確に示した。
theological_decisions:
- issue: 四百三十年がエジプト滞在だけを指すのか、カナンでの族長たちの滞在も含むのか
  choice: 本文はマソラ本文に従い、イスラエルの子らがエジプトに住んだ期間を四百三十年とする。
  alternative: 一部の古代の本文証拠は、イスラエルの子らとその父祖がエジプトとカナンに滞在した期間としている。
  rationale: 指定されたWLC本文には「エジプトに」とだけある。年代理解に影響する重要な異読は本文へ混入させず、脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「住んだ期間」により原文の名詞מוֹשַׁבがこの箇所では期間を表すことを自然に示した。節頭のוּは文脈上の接続であり、この一節だけでは日本語の接続語を明示する必要がないため訳出していない。
