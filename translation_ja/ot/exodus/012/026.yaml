translation:
  language: ja
  text: あなたがたの息子たちが、「この務めは、あなたがたにとって何なのですか」とあなたがたに言うとき、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …とき
  rationale: 将来起こる事態を導入する定型表現。日本語では文脈に即して自然な時間節とした。
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: あなたがたに…と言う
  rationale: אמרの基本義「言う」を保ち、疑問内容であっても「尋ねる」と解釈的に言い換えなかった。日本語では引用の受け手が明らかなため、「あなたがたに」は文中で省いても意味が保たれる。
- source_word: בְּנֵיכֶם
  choice: あなたがたの息子たち
  rationale: 男性複数形の語義をそのまま示し、一般化した「子どもたち」とはしなかった。
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: この務め
  rationale: עֲבֹדָהは労働、奉仕、祭儀上の務めを含み得る。過越の文脈における宗教的行為を示しつつ、「儀式」や「礼拝」と限定しすぎない表現を選んだ。
- source_word: מָה ... לָכֶם
  choice: あなたがたにとって何なのですか
  rationale: 直訳的な問いの形を保ち、その務めの意味、性質、関係性のいずれを尋ねるかを一つに限定しなかった。
theological_decisions:
- issue: 「この務め」が指す内容の限定
  choice: 意味を説明的に補わず、「何なのですか」とした。
  alternative: 「どんな意味があるのですか」
  rationale: 後者は自然だが、問いを主観的・象徴的な「意味」に限定し得る。ヘブライ語の簡潔さと曖昧さを保持した。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で落ち着いた文体。「務め」はやや改まった語だが、祭儀的奉仕という文脈にふさわしく、原語の意味幅も保つ。節が次節へ続くため読点で結んだ。
