reference: Exodus 12:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: ja
  text: あなたのもとに寄留者[a]が住み、ヤハウェのために過越を行う場合には、その者に属する男子は皆、割礼を受けなければならない。そうして初めて、その者は近づいてそれを行うことができ、その地に生まれた者と同じようになる。しかし、無割礼の者はだれも、それを食べてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者」は、イスラエル人の間に住む、その地に生まれた者ではない住民を指す。単なる旅行者という意味ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: 寄留者
  rationale: イスラエルの中に住む非生来の住民を表す法的・社会的な語であり、単なる旅人ではないため。
- source_word: יָגוּר אִתְּךָ
  choice: あなたのもとに住み
  rationale: גור の継続的な居住の意味を、自然な現代日本語で表す。
- source_word: וְעָשָׂה פֶסַח
  choice: 過越を守ろうとするなら
  rationale: 字義的には「過越を行う」。条件節に続いて参加要件が示される文脈上、意志・企図を表す日本語が自然。ただし補足性を脚注で明示する。
- source_word: פֶסַח
  choice: 過越
  rationale: 祭儀およびその食事を指す文脈に適した、定着した聖書用語。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 神名を音写し、前置詞 ל の奉献・対象の意味を「ために」で表す。
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: その者に属する男子は皆、割礼を受けなければならない
  rationale: 法的要件としての強制力と、その者の家に属する男子全員という範囲を明確にする。
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: その後で、その者は近づいてこれを守ることができ
  rationale: קרב の祭儀参加への接近と、要件を満たした後の資格・許可を保つ。
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: 土地に生まれた者と同じようになる
  rationale: אֶזְרַח の生来の構成員という法的・社会的含意を平明に表す。
- source_word: עָרֵל
  choice: 無割礼の者
  rationale: 男性単数形による一般的な排除規定を簡潔に表す。
- source_word: לֹא יֹאכַל בּוֹ
  choice: これを食べてはならない
  rationale: 禁止・参加不資格を自然な日本語で示し、בּוֹ が過越の食事を指すことを表す。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文にある固有の契約名を音写し、一般称号へ置き換えない。
- issue: 寄留者の過越参加資格
  choice: その者に属する男子全員の割礼後に参加でき、土地に生まれた者と同じようになる
  alternative: 民族的に全面排除される、または契約上の境界がすべて撤廃される
  rationale: 本文が示す条件付き包摂をそのまま保ち、後代の神学的枠組みを持ち込まない。
- issue: וְעָשָׂה の様相
  choice: 守ろうとするなら
  alternative: 守るなら／過越を行うなら
  rationale: 割礼が参加前の要件であるため、日本語では企図として読むのが文脈に合うが、動詞自体には「望む」が明示されないため脚注で曖昧さを保つ。
translation_notes:
  register: 明快で現代的ながら、律法本文にふさわしい端正な文体。「過越」「割礼」「無割礼」は定着した聖書語として保持した。「彼」を避け、「その者」で指示関係を明確にした。
