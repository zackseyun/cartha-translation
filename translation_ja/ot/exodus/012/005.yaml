  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: ja
  text: あなたがたの小家畜[a]は、傷のない一歳の雄でなければならない。羊からでも、やぎからでも取りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の שֶׂה（セ）は、羊の子またはやぎの子など、羊・やぎの群れに属する小家畜を指す語である。続く句は、羊からでもやぎからでも取れることを明示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: 子羊[a]
  rationale: 通常は「子羊」とするのが自然だが、この語は羊の子にもやぎの子にも用いられ得る。本文後半が両方を明示するため、脚注で語義の広さを示した。
- source_word: תָמִים
  choice: 傷のない
  rationale: いけにえの動物に欠陥がないことを表す祭儀的な用法を、明瞭な現代日本語で表した。
- source_word: זָכָר
  choice: 雄
  rationale: 動物の性別を示す直接的で自然な表現。
- source_word: בֶּן שָׁנָה
  choice: 一歳の
  rationale: 字義どおりには「一年の子」で、第一年にある動物を指す慣用句。日本語では「一歳の」が簡潔で自然。
- source_word: יִהְיֶה לָכֶם
  choice: でなければならない
  rationale: 動物に求められる条件を規定する文脈上の力を明確にした。לָכֶםは日本語で独立して訳さず、「あなたがたの」に含ませた。
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: 羊またはやぎの中から
  rationale: 選択可能な二つの家畜群を示すため、接続詞וを文脈に即して選択の「または」とした。
- source_word: תִּקָּחוּ
  choice: 取りなさい
  rationale: 二人称複数への指示であるため命令として訳した。目的語は直前の「子羊」から明らかなので、日本語では省略した。
