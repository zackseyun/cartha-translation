  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: ja
  text: それは一つの家[a]で食べなければならない。肉を少しでも家の外へ持ち出してはならない。また、その骨を一本も折ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一つの世帯で」とも訳せる。ヘブライ語の「家」は、建物としての家のほか、そこに属する家族・家の者から成る世帯を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: 一軒の家の中で
  rationale: בַּיִתは建物としての「家」と、そこに属する「家族・家の者」の双方を表し得る。直後に「家の外へ」とあるため、本文では空間的な意味を前面に出しつつ、別の可能性を脚注に残した。
- source_word: יֵאָכֵל
  choice: 食べなければならない
  rationale: ニファル未完了形による受動の規定を、日本語の法規的な義務表現で自然に示した。直訳的な受動形「食べられなければならない」は現代日本語では不自然になりやすい。
- source_word: לֹא תוֹצִיא ... חוּצָה
  choice: 家の外へ持ち出してはならない
  rationale: יצאのヒフィルは「外へ出す」を意味し、חוּצָהが外向きの移動を明示するため、「外へ持ち出す」とした。
- source_word: מִן הַבָּשָׂר
  choice: その肉を少しでも
  rationale: 食物の文脈でבָּשָׂרを自然な「肉」とし、部分を示すמִןを「少しでも」によって、肉の一部さえ持ち出してはならないという意味に反映した。
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: また、その骨を一本も折ってはならない
  rationale: 単数形עֶצֶםはここでは個々の骨を包括的に指すため、日本語では「一本も」として禁止の範囲を明確にした。בוֹは過越のいけにえを指す「その」によって表した。
theological_decisions:
- issue: 末尾の代名詞 בוֹ の指示対象
  choice: 文脈上の過越のいけにえ全体を指す「その骨」
  alternative: 「その小羊の骨」
  rationale: 男性単数の代名詞は直前まで論じられている過越のいけにえを指す。節そのものにない「小羊」を補わず、文脈上の指示関係を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、律法の規定としての厳粛さを「なければならない」「てはならない」で保った。主語「それ」は、節の文脈にある過越のいけにえを受け、本文にない具体的な名詞を補うことを避けている。
