source:
  edition: WLC
  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: ja
  text: その夜、ファラオと彼のすべての家臣、そしてエジプトの人々全員[a]が起き上がった。エジプトでは大きな叫び声が起こった。そこに死者のいない家は一軒もなかったからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は地名を集合的に用いて、直訳すると「全エジプト」。ここではエジプトの人々を指す。
    reason: cultural_note
  - marker: b
    text: より直訳すると、「そこに死者がいない家はなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起きた
  rationale: קוםのQal連続形で、夜中に眠りから起きたという文脈を、現代日本語で簡潔かつ自然に表す。
- source_word: לַיְלָה הוּא
  choice: 夜中に
  rationale: 夜という時を示す慣用的な句。単なる「夜に」よりも、災いを受けて起きた深夜の出来事として自然に伝わる。
- source_word: עֲבָדָיו
  choice: 彼のすべての家臣
  rationale: עֶבֶדは奴隷・僕・臣下を表し得るが、ここではファラオに仕える宮廷の者たちなので「家臣」が文脈に適する。
- source_word: וְכָל מִצְרַיִם
  choice: 全エジプトの人々
  rationale: 地名「エジプト」が住民全体を集合的に指す換喩であるため、日本語では意味を明確にして「人々」を補った。
- source_word: צְעָקָה גְדֹלָה
  choice: 激しい叫び声
  rationale: צְעָקָהは苦痛や悲嘆の叫びを指す。「激しい」はגְדֹלָהの規模と強さを自然な日本語で表す。
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: 死者のいない家は一軒もなかった
  rationale: 原文の二重の否定による強調を保ちつつ、すべての家に死者が出たことを明瞭で自然な日本語にした。「家」はבַּיִתの具体性を保持する。
- source_word: מֵת
  choice: 死者
  rationale: 分詞が名詞的に用いられ、「死んだ者」を指すため、簡潔で厳粛な「死者」とした。
