  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מֵ/רַעְמְסֵ֖ס סֻכֹּ֑תָ/ה כְּ/שֵׁשׁ מֵא֨וֹת אֶ֧לֶף רַגְלִ֛י הַ/גְּבָרִ֖ים לְ/בַ֥ד מִ/טָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: ja
  text: イスラエルの人々[a]は、ラメセスからスコトへ出発した[b]。幼い子どもたち[d]を除く徒歩の男子だけで、およそ六十万人[c]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 「旅立った」とも訳せる。この動詞は、宿営を解いて旅を始めることを表し得る。
    reason: lexical_alternative
  - marker: c
    text: 「およそ六十万人」は徒歩の男子の数であり、幼い子どもたちはこの数に含まれていない。
    reason: cultural_note
  - marker: d
    text: 「幼い者たち」とも訳せる。ヘブライ語 טף は幼い子どもたちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 旅立った
  rationale: נסעは移動の文脈で、宿営地を離れて旅を始めることを表す。「旅立った」は出発と移動の両面を簡潔に伝える。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの家族的表現を保ちつつ、現代日本語で荘重かつ理解可能な形とした。「イスラエル人」も意味上は可能である。
- source_word: מֵרַעְמְסֵס
  choice: ラメセスから
  rationale: 地名は日本語で一般的な音写「ラメセス」とし、前置詞מִןによる起点を「から」で表した。
- source_word: סֻכֹּתָה
  choice: スコトへ
  rationale: 地名に付く方向を示す-הを、目的地を表す「へ」で明示した。
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: およそ六十万人
  rationale: 数詞に付くכְּは概数を示すため、「およそ」とした。
- source_word: רַגְלִי
  choice: 徒歩の
  rationale: רגלに由来する語が、ここでは徒歩で移動する者を示すため、簡潔に「徒歩の」と訳した。
- source_word: הַגְּבָרִים
  choice: 男子
  rationale: גבריםが男性を明示していることを保つため、「人々」ではなく「男子」とした。成人男性に限定するかどうかは本文以上に断定しない。
- source_word: לְבַד מִטָּף
  choice: 幼い者たちを除いて
  rationale: טףは幼い子ども、または小さな扶養家族を指し得る。「幼い者たち」はその範囲を過度に狭めず、人数に含まれないことを「除いて」で明確にした。
