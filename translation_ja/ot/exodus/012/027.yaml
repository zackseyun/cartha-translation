  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: ja
  text: あなたがたはこう言いなさい。「これはヤハウェに献げる過越のいけにえである。ヤハウェは、エジプトを打たれたとき、エジプトにいたイスラエルの子ら[a]の家々を過ぎ越し[b]、私たちの家々を救い出された[c]。」民は身をかがめ、ひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。直訳的には「イスラエルの子ら」で、イスラエルの民を指す。
    reason: lexical_alternative
  - marker: b
    text: 「過ぎ越し」は「過越」と同じヘブライ語語根に由来し、害を加えずに守る、という意味合いも持ちうる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「私たちの家々を助け出された」「私たちの家々を救われた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: 過越のいけにえ
  rationale: 「過越」に結びついた祭儀的な犠牲という連語の意味を保ち、現代日本語として自然に表した。
- source_word: לַיהוָה
  choice: ヤハウェに献げる
  rationale: 前置詞לの奉献・帰属の意味を、犠牲を献げる文脈に即して明示した。
- source_word: פָּסַח
  choice: 過ぎ越し
  rationale: 名詞「過越」と同じ語根による語の響きを日本語でも保つ。文脈上は、害を加えず守る意味合いも含む。
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らの家々
  rationale: ヘブライ語の親族的・契約的な表現を見える形で保った。「イスラエル人の家々」も自然な訳として可能。
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: エジプト人を打ったとき
  rationale: ב付き不定詞の時を表す働きを「とき」で示した。目的語「エジプト」は、この対比では住民を指す換喩として自然な「エジプト人」とした。
- source_word: הִצִּיל
  choice: 救い出された
  rationale: נצלの救出・解放の意味を保持し、「過ぎ越す」に含まれる保護の意味と不必要に重複させない。敬意を表す日本語として主語ヤハウェに尊敬表現を用いた。
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: 身をかがめ、ひれ伏した
  rationale: 二つの動作を一つに潰さず、かがむことと礼拝的にひれ伏すことの連続を保った。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に固有の神名が明記されているため、一般称号に置き換えず音写した。
- issue: בְנֵי יִשְׂרָאֵל の表現
  choice: イスラエルの子ら
  alternative: イスラエル人、イスラエルの民
  rationale: 原文の親族的な言い回しを保持した。ただし、この複数形は共同体全体を指し、男性だけに限定する必要はない。
- issue: וַיִּשְׁתַּחֲווּ の行為性と礼拝性
  choice: ひれ伏した
  alternative: 礼拝した
  rationale: 直前の「身をかがめた」との二段階の身体動作を保ちつつ、文脈上の礼拝行為を自然に伝える表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神への発話と礼拝場面にふさわしい簡潔で格調ある文体とした。「いけにえ」は一般読者にも理解しやすい表記とし、「過越」は聖書用語としての連続性を優先した。
