  to: イスラエルの全会衆に告げなさい。『この月の十日に、各人が父の家[a]に応じて、すなわち一家につき一頭の羊またはやぎを取らなければならない。』
  rationale: 原語の語義範囲に合わせて、שֶׂהから「子」という限定を除いた。また、יִקְחוּの基本的意味に沿って「取らなければならない」とし、指示的な文脈上の力を保った。「父の家」と「一家」の関係は、原文の反復を損なわずに分かるよう「に応じて、すなわち一家につき」と表現した。引用符も完結させた。
