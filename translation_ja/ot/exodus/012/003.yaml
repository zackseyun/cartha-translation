source:
  edition: WLC
  text: דַּבְּר֗וּ אֶֽל כָּל עֲדַ֤ת יִשְׂרָאֵל֙ לֵ/אמֹ֔ר בֶּ/עָשֹׂ֖ר לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/יִקְח֣וּ לָ/הֶ֗ם אִ֛ישׁ שֶׂ֥ה לְ/בֵית אָבֹ֖ת שֶׂ֥ה לַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: ja
  text: イスラエルの全会衆に告げなさい。『この月の十日に、各人が父の家[a]に応じて、すなわち一家につき一頭の羊またはやぎを取らなければならない。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父の家」は、父系の親族関係によって成り立つ家族集団を指す。
    reason: לְבֵית אָבֹת の古代イスラエルにおける社会単位を明確にするため。
lexical_decisions:
- source_word: דַּבְּרוּ אֶל כָּל עֲדַת יִשְׂרָאֵל לֵאמֹר
  choice: イスラエルの全会衆に告げなさい
  rationale: 複数形の命令と引用導入句を、日本語で自然な一つの発話命令として表した。עֵדָהの公的・集合的な意味は「全会衆」で保持した。
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: この月の十日に
  rationale: 字義的な「この月の十日に」を明瞭で自然な現代日本語にした。
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: それぞれが…一匹ずつ選び取りなさい
  rationale: 指示的な未完了形とאִישׁの分配的用法を表す。「取る」は文脈上、祭儀のために家畜を選んで確保することなので「選び取る」とした。
- source_word: שֶׂה
  choice: 羊またはやぎの子
  rationale: שֶׂהは羊に限らず、羊またはやぎの群れの一頭を指し得る。直後の12:5が羊とやぎの双方を明示するため、原語の範囲を本文で保持した。
- source_word: לְבֵית אָבֹת
  choice: 父祖の家ごとに
  rationale: 父系の親族・家族単位を表す定型句の社会的構造を保持した。「父の家」より誤解が少なく、複数形אָבֹתも反映する。
- source_word: שֶׂה לַבָּיִת
  choice: 家族ごとに…一匹
  rationale: בַּיִתは建物ではなく同居する世帯を指すため「家族」とした。反復されるשֶׂהは、日本語では「一匹ずつ」にまとめて明確に表した。
theological_decisions:
- issue: שֶׂהを「小羊」に限定するか
  choice: 羊またはやぎの子
  alternative: 小羊
  rationale: 過越の伝統的表現よりも、原語の語義と12:5の明示を優先した。後代の神学的連想によって、この節の対象を羊だけに狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会衆」「父祖の家」で原文の共同体的・社会的語感を残しつつ、命令部分は自然な日本語に整えた。脚注記号[a]は本文に付した。
