  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: ja
  text: イスラエルの子らはモーセの言葉どおりに行い、エジプト人に銀の品々、金の品々、それに衣服を求めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「願い求めた」。「借りた」と訳されることもあるが、ここで用いられているヘブライ語の動詞は、通常「求める」「願い求める」という意味である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: ヘブライ語の定型表現と共同体的・家族的な響きを保つ。「イスラエル人」より原文の形が見える訳とした。
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: モーセの言葉どおりに行い
  rationale: עשהの単純な「行う」と、דברの「言葉」という表現を保ちつつ、現代日本語として自然にした。文脈上「指示」とも理解できるが、本文では意味を狭めない。
- source_word: וַיִּשְׁאֲלוּ
  choice: 求めた
  rationale: שאלの基本義である「求める、願い求める」を表す。「借りた」という返却の含意や、「奪った」という結果の意味を動詞自体に持ち込まない。
- source_word: מִמִּצְרַיִם
  choice: エジプト人に
  rationale: 字義的には「エジプトから」だが、この文脈では品々を求めた相手であるエジプト人を指す。日本語では人物を相手として明示するほうが自然である。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 銀の品々、金の品々
  rationale: כְּלִיは器、道具、物品などを含む広い語なので、「器」に限定せず「品々」とした。
- source_word: וּשְׂמָלֹת
  choice: それに衣服
  rationale: 衣類全般を表す語として、明快で現代的な「衣服」を用いた。接続の重なりは「それに」で自然に表した。
theological_decisions:
- issue: 出エジプト時の物品取得という文脈における וַיִּשְׁאֲלוּ の訳
  choice: 求めた
  alternative: 願い求めた／借りた／奪った
  rationale: ヘブライ語の基本的な語義を保ち、返却を前提とする「借りた」や、周辺文脈が述べる結果としての「奪い取った」という評価を、この動詞そのものに読み込まないため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「イスラエルの子ら」「モーセの言葉」に原文の表現を残した。「銀の品々、金の品々」は対象を器物に限定しない。脚注記号[a]は関連語「求めた」の直後に置いた。
