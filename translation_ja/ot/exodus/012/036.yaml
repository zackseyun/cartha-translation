source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: ja
  text: ヤハウェは、エジプト人が民に好意を抱くようにされた。そこでエジプト人は、民が求めた物を与えた[a]。こうして民はエジプトを略奪した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「エジプト人は民に貸した」とも訳される。ここで用いられているヘブライ語の動詞は、貸す意味とも、求められた物を渡す意味とも理解されてきた。
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: ヤハウェ
  rationale: 固有名詞יהוהを、その名であることが分かる一般的な日本語表記で訳した。
- source_word: נָתַן אֶת־חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: 民がエジプト人の好意を得るようにされた
  rationale: 直訳的な「エジプト人の目に民の好意を与えた」というヘブライ語慣用句を、神がエジプト人の好意的な態度を生じさせたという意味が明瞭になる自然な日本語にした。
- source_word: וַיַּשְׁאִלוּם
  choice: エジプト人は民が求めた物を与えた
  rationale: 文脈上、エジプト人がイスラエルの求めに応じたことを表す。通常の貸借と断定せず、求めた物を渡したという意味を本文に採り、語義上可能な「貸した」は脚注に残した。
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: 民はエジプトを略奪した
  rationale: נצלのピエル形が持つ「奪い取る、略奪する」という強い結果を保ち、目的語「エジプト」も集合的・国家的な表現として維持した。
theological_decisions:
- issue: וַיַּשְׁאִלוּםを貸借として訳すか、求めに応じて渡す意味で訳すか
  choice: エジプト人は民が求めた物を与えた
  alternative: エジプト人は民に貸した
  rationale: この動詞はここで「貸す」とも「求められた物を渡す」とも理解されてきた。本文では、好意を与えられたエジプト人が民の求めに応じたという文脈を優先しつつ、返済を前提とする通常の貸借を不必要に示唆しない訳を採用した。伝統的で語義上可能な理解は脚注に明記した。
- issue: 略奪という表現の強さ
  choice: 民はエジプトを略奪した
  alternative: 民はエジプトから品々を持ち出した
  rationale: 原語の強い語感と、好意によって品々が渡されたことを同時に語る本文の緊張を弱めずに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で品位ある叙述調とした。「好意を得るようにされた」でヘブライ語慣用句を自然に表し、「略奪した」では原文の意図的な強さを保持した。
