  terminology: 神名「ヤハウェ」はこの翻訳方針と整合する。「好意」はחןの文脈上の意味に適切である。「略奪した」は、エジプト人が物を渡したという直前の記述との緊張を残しつつ、ピエル形נצלの「剝ぎ取る・略奪する」という強さを保つ。脚注はוישאלוםの「貸す」と「求めに応じて渡す」という歴史的・語義的な両理解を公平に示している。
