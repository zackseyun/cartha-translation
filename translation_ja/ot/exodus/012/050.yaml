source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: ja
  text: イスラエルの子らは皆、ヤハウェ[a]がモーセとアロンに命じたとおりに行った。そのとおりに行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語はYHWH（四文字神名）。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 行った
  rationale: 命令への服従を表す文脈なので、עשהを自然な日本語の「行った」とした。節末の同じ動詞も同じ訳語で反復する。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子らは皆
  rationale: כָּלの全体性と、בְּנֵי יִשְׂרָאֵלの家族的・民族的表現をともに保持した。「イスラエル人」は自然な代案だが、原文の形を残した。
- source_word: כַּאֲשֶׁר
  choice: とおりに
  rationale: 命じられた内容との一致を示すため、現代日本語で自然な「とおりに」とした。
- source_word: צִוָּה
  choice: 命じた
  rationale: 完了した先行命令を表す。日本語では時系列が文脈上明らかなため、過去完了を過度に明示せず「命じた」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、神名YHWHを一般的な日本語音写「ヤハウェ」で示した。
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: モーセとアロンに
  rationale: 目的語標識は二人が命令を受けた対象であることを示す。日本語では「に」が自然であり、「を通して」という媒介の意味は加えない。
- source_word: כֵּן עָשׂוּ
  choice: まさにそのように行った
  rationale: 先の行為を強調して言い直す原文の反復を保持し、כֵּןによる一致の強調を「まさにそのように」で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、神名として音写した。伝統的な代読「主」は脚注で示す。
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 民族全体を指す定型表現である一方、原文の家族的な比喩を残すため「子ら」とした。文脈上、男性だけに限定する表現とは解さない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文のעשהの反復を滑らかに消さず、命令への完全な服従を強調する語調を保った。
