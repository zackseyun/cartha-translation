  text: וּ/שְׁמַרְתֶּ֖ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/חָק לְ/ךָ֥ וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: ja
  text: あなたがたは、このこと[a]を、あなたとあなたの息子たち[b]のための定めとして、いつまでも守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この事柄」または「この言葉」。ヘブライ語は、事柄、物事、語られた言葉などを広く指し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたとあなたの子どもたち」または「あなたとあなたの子孫」。ヘブライ語は「あなたの息子たち」とある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守りなさい
  rationale: שׁמר は「守る」「保つ」「遵守する」を意味する。ここでは祭儀に関する規定を継続して実行する文脈なので、法的な義務と継続性を自然に表す「守りなさい」とした。
- source_word: הַדָּבָר הַזֶּה
  choice: このこと
  rationale: דָּבָר は「言葉」「事柄」「物事」など広い意味を持つ。ここでは直前に述べられた過越の規定全体を指すため、意味を「命令」だけに狭めない「このこと」とした。
- source_word: לְחָק
  choice: 定めとして
  rationale: חֹק は定められた規定や法令を指す。現代日本語で明瞭かつ荘重であり、法的・契約的な響きを保つ「定め」を採用した。
- source_word: לְךָ וּלְבָנֶיךָ
  choice: あなたとあなたの息子たちのための
  rationale: ヘブライ語は単数形の「あなた」と「あなたの息子たち」を明示するため、その形を本文に保持した。文脈上は後代の家族や子孫を代表し得るが、その解釈を本文に織り込まず脚注で示す。
- source_word: עַד עוֹלָם
  choice: いつまでも
  rationale: עַד עוֹלָם は永続的・恒久的な継続を表す。日本語として自然で、継続する義務を明瞭に伝える「いつまでも」とした。
theological_decisions:
- issue: 「あなたの息子たち」が示す契約継承の範囲
  choice: 本文では原文どおり「あなたの息子たち」とする
  alternative: 「あなたの子どもたち」または「あなたの子孫」
  rationale: 原文は明確に「息子たち」と述べる。家族や後代を代表する表現と理解する余地はあるが、翻訳本文でその範囲を確定せず、語形を保持して別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法の規定にふさわしい簡潔で荘重な調子を保った。冒頭の複数形「あなたがた」と、後半の単数形「あなた」の切り替えも原文に即して保持した。
