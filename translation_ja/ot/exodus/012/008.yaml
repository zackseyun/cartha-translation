    issue: 「火で焼き」が原文の調理法の修飾をやや曖昧にする
    rationale: צְלִי אֵשׁ は「火で焼いたもの／火で焼いた肉」であり、肉の調理状態を指定する。「火で焼いた肉を」とすれば、この関係を明示できる。
  - severity: low
    issue: 「苦菜」はやや限定的で、現代日本語として説明を要しうる
    rationale: מְרֹרִים は字義的には「苦いもの」で、本文自体は植物の種類を特定しない。「苦い野菜」は文脈上の意味を自然に伝えつつ、過度の特定を避ける。
  - severity: low
    issue: 原文後半の「それを食べる」の反復が訳文で省略されている
    rationale: 日本語では完全な反復は不自然になりうるが、「それを食べなければならない」と再述すれば、原文の構造と強調をよりよく反映できる。
  revised_text: その夜、火で焼いた肉を、種なしパンと苦い野菜を添えて食べなければならない。
