  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: 食べなければならない
  rationale: 儀礼上の指示という文脈にある完了形を、現代日本語で命令・義務の力が明確に伝わる形にした。
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: 食物を指す文脈なので、字義的な「肉体」ではなく自然な「肉」とした。
- source_word: בַּלַּיְלָה הַזֶּה
  choice: その夜
  rationale: 直訳は「この夜に」だが、直前に指定された過越の夜を指す日本語として「その夜」が自然である。
- source_word: צְלִי אֵשׁ
  choice: 火で焼き
  rationale: 火による調理、特に次節で煮ることと対照される焼く調理法を簡潔に表した。
- source_word: וּמַצּוֹת
  choice: 種なしパン
  rationale: パン種を入れないパンを指す定着した明瞭な訳語を用いた。
- source_word: עַל
  choice: 添えて
  rationale: ここでは位置を表す「上に」より、食事の取り合わせ・同伴を示すと判断した。
- source_word: מְרֹרִים
  choice: 苦菜
  rationale: 語義は「苦いもの」だが、過越の食事で食べる苦い植物を指す簡潔で定着した表現を選んだ。
- source_word: יֹאכְלֻהוּ
  choice: 食べなければならない
  rationale: 目的語接尾辞の指示対象である肉を文頭に置いた日本語文の述語としてまとめ、原文後半の反復が持つ指示の強調を義務表現で保持した。
