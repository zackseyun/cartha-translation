language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: ja
  text: この夜、わたしはエジプトの地を通り[a]、エジプトの地にいるすべての初子を、人から家畜に至るまで打つ。また、エジプトのすべての神々に裁きを下す。わたしはヤハウェである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「通って行き」とも訳せる。ここでの動詞はエジプトの地を進んで行くことを意味し、「免れさせる」という意味での「過ぎ越す」ではない。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェ」はヘブライ語で神の名を表す四文字 YHWH の慣用的な音写。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: 通り抜け
  rationale: עבר に בְּאֶרֶץ が続き、ここでは土地の中を進むことを表す。「過ぎ越す」では、家々を免れさせるという別の主題と混同されるため避けた。
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: エジプトの地
  rationale: אֶרֶץ を明示し、行為の地理的範囲を保った。
- source_word: בַּלַּיְלָה הַזֶּה
  choice: この夜
  rationale: 指示語の強調を保ちつつ、自然な現代日本語とした。
- source_word: וְהִכֵּיתִי
  choice: 打つ
  rationale: נכה の直接的な意味を保つ。文脈上は死をもたらす打撃だが、「打ち殺す」と明示して解釈を加えることは避けた。
- source_word: כָּל בְּכוֹר
  choice: すべての初子
  rationale: 単数集合表現を反映した。「男」は本文に明示されていないため加えなかった。
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: 人から家畜に至るまで
  rationale: 人間と動物を両端とする範囲表現を自然に示した。בְּהֵמָה はこの文脈では飼育動物を指す「家畜」が適切である。
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: エジプトのすべての神々に
  rationale: אֱלֹהִים を「偶像」などに還元せず、本文どおり「神々」とした。助詞「に」は裁きの向けられる対象を示す。
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: 裁きを下す
  rationale: 複数形 שְׁפָטִים の司法的・懲罰的な力を、日本語として自然で荘重な慣用表現で示した。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 神名 YHWH を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に記された四文字神名を固有名として示す。「主」という伝統的表記も脚注で案内する。
- issue: אֱלֹהֵי מִצְרַיִם の存在論的含意
  choice: エジプトの神々
  alternative: エジプトの偶像
  rationale: ヘブライ語の表現をそのまま保ち、それらの実在性や性質について翻訳段階で断定しない。
- issue: 初子への打撃の明示性
  choice: 打つ
  alternative: 打ち殺す
  rationale: 出来事の致死性は文脈から明らかだが、この節の動詞自体より限定的な表現を本文に加えず、原文の語義幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣告にふさわしい簡潔で荘重な調子を保った。「初子」は聖書語として定着しており、「最初に生まれた者」より簡潔で、性別を原文以上に限定しない。すべての脚注記号を本文中に配置した。
