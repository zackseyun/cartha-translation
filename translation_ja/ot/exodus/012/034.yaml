  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: ja
  text: そこで民は、まだ発酵していない練り粉を持ち、こね鉢[a]を外衣に包んで縛り、肩に担いだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「練り桶」とも訳せる。ヘブライ語は、練り粉を作る際に用いる容器を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 持ち／担いだ
  rationale: נשׂאは物を持ち上げて運ぶことを表す。この文では、練り粉については「持ち」、肩に載せた包みについては「担いだ」と訳し分け、日本語として自然に移動の情景を示した。
- source_word: הָעָם
  choice: 民
  rationale: 出エジプトするイスラエルの共同体全体を指す。聖書叙述にふさわしく、現代日本語でも明瞭な「民」とした。
- source_word: בְּצֵקוֹ
  choice: 練り粉
  rationale: 語形上の接尾辞は単数だが、主語の「民」は集合体なので、所有を明示せず自然な日本語にした。בָּצֵקはパン生地、とりわけこねた粉を指すため「練り粉」とした。
- source_word: טֶרֶם יֶחְמָץ
  choice: まだ発酵していない
  rationale: טֶרֶםは「まだ～していない」、חמץは生地が発酵して酸味を帯びることを表す。過越の文脈を保ちつつ、現代の読者に過程が分かる表現とした。
- source_word: מִשְׁאֲרֹתָם
  choice: こね鉢
  rationale: 練り粉を準備するための容器を指す。「練り桶」も可能だが、容器の形状を過度に限定せず、日常的に理解しやすい「こね鉢」を本文に採った。
- source_word: צְרֻרֹת
  choice: くるんで
  rationale: צררの受動分詞は、移動のために包んで縛りまとめた状態を表す。日本語では外衣との関係を自然に示す「くるんで」とした。
- source_word: בְּשִׂמְלֹתָם
  choice: 外衣に
  rationale: שִׂמְלָהは一般に衣服、とくに上にまとう衣を指す。荷物を包む具体的な情景が伝わる「外衣」とした。
- source_word: עַל שִׁכְמָם
  choice: 肩に
  rationale: 集合的な「民」の各人が包みを肩に載せて運んだことを表す。日本語では単複を明示せず「肩に」が自然である。
theological_decisions: []
