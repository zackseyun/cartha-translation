language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: ja
  text: ヤハウェは、エジプトを打つためにエジプトの地を通って行かれ、鴨居と二本の戸柱にある血を御覧になる。ヤハウェはその戸口を過ぎ越され[a]、滅ぼす者[b]があなたがたの家に入って打つことをお許しにならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「過ぎ越す」は、「免れさせる」または「守る」とも解し得る。ヘブライ語のこの動詞は「過越」と結びつく語である。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語本文は「滅ぼす者」が誰であるかを明示していない。裁きを執行する御使いと理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וְעָבַר
  choice: 通って行かれる
  rationale: ここではエジプトを打つためにその地を通る動きを表す。後半のפסח（「過ぎ越す」）との語の違いも保った。
- source_word: לִנְגֹּף
  choice: 打つために
  rationale: נגףが表す致命的な裁きの厳しさを保ちつつ、現代日本語として簡潔に訳した。
- source_word: מִצְרַיִם
  choice: エジプト
  rationale: 地名の標準的な日本語表記。文脈上、裁きの対象となるエジプトの地と民を含み得る表現として、原文の簡潔さを保った。
- source_word: וְרָאָה
  choice: 御覧になる
  rationale: 先行する未来の出来事の流れを受ける。日本語では「とき」と結び、時間的な順序を自然に表した。
- source_word: הַדָּם
  choice: 血
  rationale: 直前の文脈で家に塗られた、特定の血を指す。日本語では冠詞を明示せずとも特定性が文脈から伝わる。
- source_word: הַמַּשְׁקוֹף
  choice: 鴨居
  rationale: 戸口の上部にある横材を指す、日本語の簡潔で正確な建築用語を採用した。
- source_word: שְׁתֵּי הַמְּזוּזוֹת
  choice: 二本の門柱
  rationale: 戸口の左右に立つ二本の柱を指す。聖書文脈で分かりやすく、構造も明確な表現とした。
- source_word: וּפָסַח
  choice: 過ぎ越し
  rationale: 過越の物語を特徴づける動詞との語彙的なつながりを保つ。「免れさせる」「守る」という含意を本文だけで一義的に確定しない。
- source_word: עַל הַפֶּתַח
  choice: その戸口
  rationale: 家の入口の開口部を指す。「その」によって、血の付いた鴨居と門柱から成る戸口とのつながりを自然に示した。
- source_word: וְלֹא יִתֵּן
  choice: お許しにならない
  rationale: נתן＋不定詞の「〜することを許す」という慣用的な意味を、自然な敬語表現で訳した。
- source_word: הַמַּשְׁחִית
  choice: 滅ぼす者
  rationale: 原文が示す破壊の担い手を訳しつつ、その正体を「御使い」などと本文で限定することを避けた。
theological_decisions:
- issue: ヤハウェと「滅ぼす者」の関係
  choice: 両者を区別し、ヤハウェが「滅ぼす者」の侵入を許されない、と訳す。
  alternative: 「滅ぼす者」をヤハウェ自身の別称とみなす、または本文で「滅ぼす御使い」と特定する。
  rationale: ヘブライ語本文はこの節でיְהוָהとהַמַּשְׁחִיתを別々に言及している。その区別を保ちながら、「滅ぼす者」の正体について本文以上の特定をしない。
- issue: פסחの意味
  choice: 本文では「過ぎ越す」と訳し、守る・免れさせるという含意は文脈と脚注に残す。
  alternative: 本文で「守る」または「免れさせる」と訳す。
  rationale: 過越の物語における中心的な語とのつながりを保持するため。「滅ぼす者」の侵入を許さないという後続句が保護の働きを明示しているので、語義の幅を狭めずに済む。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。神の動作には自然な敬語を用いた。原文の二つの異なる動詞、עבר（通って行く）とפסח（過ぎ越す）を訳し分け、後者の語義上の幅は脚注で保持した。脚注記号は、それぞれが説明する「過ぎ越し」と「滅ぼす者」の直後に置いた。
