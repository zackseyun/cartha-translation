  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: ja
  text: 第一日には、あなたがたのために聖なる集会[a]があり、第七日にも聖なる集会がある。その両日には、いかなる仕事もしてはならない。ただし、各人が食べるためのものだけは、あなたがたのために用意してよい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別された集会」。伝統的には「聖会」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「各人のために食べられるもの、それだけがあなたがたのためになされてよい」。ここで「各人」はヘブライ語ネフェシュ（人）に当たり、文脈上、食べ物を用意することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: 聖なる集会
  rationale: 「聖別された、召集された集まり」という句の意味を、現代日本語で明瞭かつ荘重に表す。「聖会」より一般読者に分かりやすい。
- source_word: יִהְיֶה לָכֶם
  choice: あなたがたのために…を開く
  rationale: 直訳的な「あなたがたのために…がある」を自然な規定文に整えつつ、与格の「あなたがたのために」を保持した。
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: その両日には、いかなる仕事もしてはならない
  rationale: כָּלを「いかなる…も」で表し、受動表現の禁止を日本語の自然な法令調にした。בָהֶםが先行する二日を指すことを「その両日」で明示した。
- source_word: אַךְ
  choice: ただし
  rationale: 全面的な仕事の禁止に対する唯一の例外を導く機能を明確に表す。
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: 各人が食べるもの
  rationale: נֶפֶשׁはここでは非物質的な「魂」ではなく個々の人を指す。原文の受動形を日本語として自然な能動表現にしたが、必要性を意味する語を補わず、原文の幅を保った。
- source_word: הוּא לְבַדּוֹ
  choice: それだけは
  rationale: 代名詞とלְבַדּוֹによる排他的な強調を簡潔に保持した。
- source_word: יֵעָשֶׂה לָכֶם
  choice: あなたがたのために用意してよい
  rationale: 動詞自体は「行う／作る」だが、直前の食べるものを受けるため「用意する」とした。許可を表す文脈上の機能と、לָכֶםの「あなたがたのために」を保持した。
theological_decisions:
- issue: 祭日の仕事禁止における例外の範囲
  choice: 食べるものの用意だけを許される例外として示す
  alternative: 必要最低限の調理だけに限定すると明記する
  rationale: 原文は「各人が食べるもの」と「それだけ」を述べるが、「必要最低限」という限定を明示してはいないため、解釈を本文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語による、荘重さを保った規定文。「開く」「してはならない」「用意してよい」を用い、過度に古風な宗教語や不自然な受動文を避けた。
