  text: תּוֹשָׁ֥ב וְ/שָׂכִ֖יר לֹא יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: ja
  text: 寄留者[a]も雇われ人も、それを食べてはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者」は、「一時的居住者」または「在留外国人」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: すなわち、過越の食事を食べてはならないということ。より狭くは、過越の小羊を指すとも考えられる。
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: 寄留者
  rationale: イスラエルの中に居住しながら共同体に正式には組み込まれていない者を指す語として、簡潔で聖書法規の文体にも適する。「在留外国人」より原文の身分概念を広く保つ。
- source_word: שָׂכִיר
  choice: 雇われ人
  rationale: 賃金を受けて雇用されている者を表す。現代日本語で明瞭であり、「雇い人」よりも雇われる側であることが伝わる。
- source_word: לֹא יֹאכַל
  choice: 食べてはならない
  rationale: 否定辞を伴う未完了形が法規における禁止を表すため、明確な禁止表現とした。
- source_word: בּוֹ
  choice: それを
  rationale: אָכַל と前置詞 ב の組み合わせは、ここでは過越の食物にあずかることを表す。日本語では「それを食べる」が自然で、代名詞による原文の簡潔さも保てる。
- source_word: וְ
  choice: も…も
  rationale: 二つの身分を並べ、そのどちらにも同じ禁止が及ぶことを自然な日本語で示す。
theological_decisions:
- issue: 「それ」が指すもの
  choice: 本文では原文どおり代名詞「それ」を保ち、文脈上は過越の食事を指すものとする。
  alternative: より限定して「過越の小羊」を指すと解する。
  rationale: 直前から続く過越の規定が先行詞を与えるが、この節自体は対象を明示していない。本文で限定を加えず、注で文脈上の指示対象を説明することで原文の簡潔さと意味の幅を保つ。
translation_notes:
  register: 簡潔で格調ある法規文体としつつ、現代の一般読者に明瞭な語彙を用いた。「も…も」によって、寄留者と雇われ人の双方に禁止が及ぶことを自然に表現した。
