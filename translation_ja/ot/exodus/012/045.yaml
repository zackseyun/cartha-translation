  verdict: approve
  source_fidelity: ヘブライ語の「寄留者（תּוֹשָׁב）と雇われ人（שָׂכִיר）は、それにあずかって食べてはならない」という法規上の禁止を正確に伝えている。「も…も」は、接続詞で並ぶ二つの対象の双方に禁止が及ぶことを自然に示す。「それ」はבּוֹの簡潔さと、前後の過越規定に依存する指示対象を適切に保っている。
  naturalness: 「寄留者も雇われ人も、それを食べてはならない。」は、簡潔で理解可能な現代標準日本語であり、法規文としても自然である。「寄留者」は日常語ではないが、聖書の社会的・法的区分を過度に現代化せず表す適切な語であり、注が理解を補っている。
  terminology: 「寄留者」はתּוֹשָׁבの、共同体内に居住するが完全には同一の身分ではない者という含意を保つ。「雇われ人」はשָׂכִירの賃金労働者という意味に合う。「食べてはならない」は否定未完了形による法的禁止を明瞭に表現する。注aは代替訳を適切に示し、注bも対象を過度に本文へ限定せず、過越の食事／より狭義には過越の小羊という文脈上の幅を保っている。
