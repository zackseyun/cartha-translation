    rationale: この句は、各人の食べる量を踏まえ、その小家畜に関して人数を算定・見積もることをいう。人数の共有関係に加え、食べられる量に見合う算定という含意を保つ必要がある。
  - severity: low
    issue: 「一家族」は הַבַּיִת の指す世帯単位を核家族・家族に狭めうる。
    rationale: ここでの「家」は過越の食事に加わる家の者たち／世帯であり、「その家の者たち」なら建物ではないことを示しつつ範囲を不必要に限定しない。
  - severity: low
    issue: 本文の「羊一頭」は שֶׂה の羊・山羊を含む語義より狭い。
    rationale: 脚注はあるが、明瞭な本文でも「小家畜一頭」とすることで、直後の文脈（12:5）にも整合し、語義の幅を保持できる。
