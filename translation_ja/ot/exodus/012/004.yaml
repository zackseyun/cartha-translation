base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: ja
  text: もしその家の者たちだけでは小家畜一頭[a]を食べるには少なすぎるなら、その人と、自分の家に最も近い隣人は、人数に応じて一頭を用意しなさい。一人一人が食べる量に応じて、その小家畜について人数を算定しなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は、羊または山羊の一頭を指すことができます。
    reason: lexical_alternative
  - marker: b
    text: または「一人一人が食べる量に応じて、その小家畜のために人数を見積もりなさい」。直訳に近くは「一人一人、その食べる量に応じて、その小家畜について数えなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: 一家族だけでは羊一頭を食べるには人数が少なすぎる
  rationale: הַבַּיִת は建物ではなく食事に参加する家族・世帯を指す。יִמְעַט と מִהְיֹת の組み合わせを、人数が一頭分に足りないという文脈が明確になる自然な日本語にした。
- source_word: שֶׂה
  choice: 羊一頭
  rationale: この語は羊または山羊の小家畜一頭を指し得る。本文では簡潔で自然な「羊一頭」とし、原語の広い意味を脚注に示した。年齢を限定する「子羊」は避けた。
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: その家族は、家の最も近くに住む隣人と一緒に、…一頭を用意しなさい
  rationale: 男性単数代名詞を日本語で不自然な「彼」とせず、指示対象である家族を明示した。「取る」はこの食事のために一頭を確保する意味なので「用意する」とした。
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: 人数に応じて
  rationale: מִכְסָה は割り当てられた数・人数、נְפָשׁוֹת はここでは「人々」を表す。簡潔で現代的な表現とした。
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: 一人一人が食べる量に応じて
  rationale: אִישׁ はここで分配的に各人を指す。לְפִי אָכְלוֹ は直訳的には「その人の食べるところに応じて」であり、各人の食事量を意味する。
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: その一頭を共にする人数を決めなさい
  rationale: まれな動詞は、この一頭について参加者を算定する意味と理解した。単なる頭数の計数ではなく、各人の食事量に基づいて必要人数を割り出す文脈を自然な日本語で表した。
