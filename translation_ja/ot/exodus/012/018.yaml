base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: ja
  text: 第一の月の十四日の夕方から、二十一日の夕方まで、種なしパンを食べなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: 第一の月
  rationale: 後続の「その月の」と結びつく日付表現であり、文脈上省略されている「月」を補って明確にした。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: 十四日
  rationale: 基数詞を用いるヘブライ語の日付表現を、自然な日本語の暦日表現にした。
- source_word: לַחֹדֶשׁ
  choice: その月の
  rationale: 日付公式では חֹדֶשׁ は「新月」より「月」を意味するため。日本語では既出の第一の月を受けて「その月」とした。
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: 夕方から／夕方まで
  rationale: עֶרֶב の基本的な時間帯を「夕方」とし、最初と最後の境界を示す構文上の働きを「から／まで」で明示した。
- source_word: תֹּאכְלוּ
  choice: 食べなさい
  rationale: 律法的文脈における未完了形の指示・命令の力を、明快な現代日本語で表した。
- source_word: מַצֹּת
  choice: 種なしパン
  rationale: 過越祭の文脈で、パン種を入れずに作るパンを指す一般的で分かりやすい表現を採用した。
- source_word: עַד
  choice: まで
  rationale: 期間の終点を示す語として自然な日本語にした。
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: 二十一日
  rationale: ヘブライ語の数詞による日付を、自然な日本語の暦日表現にした。
