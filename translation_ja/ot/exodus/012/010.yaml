id: EXO.12.10
reference: Exodus 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: ja
  text: それを朝まで少しも残してはならない。朝まで残ったものは、火で焼かなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: 残してはならない
  rationale: יתרのヒフィル形は「残しておく、残存させる」の意。否定命令として自然で明確な現代日本語にした。
- source_word: מִמֶּנּוּ
  choice: それを少しも
  rationale: מן＋三人称男性単数接尾辞は文脈上、過越の食物の一部を指す。否定文に合わせて「少しも」とし、一部たりとも残さない意味を明示した。
- source_word: עַד בֹּקֶר
  choice: 朝まで
  rationale: 時間的な限界を表す句を、簡潔で自然な日本語に訳した。
- source_word: הַנֹּתָר
  choice: 残ったもの
  rationale: יתרのニファル分詞を、残存した部分を指す名詞的表現として自然に訳した。
- source_word: בָּאֵשׁ
  choice: 火で
  rationale: בはここで手段を表す。「火で」は日本語の「焼く」と自然に結びつく。
- source_word: תִּשְׂרֹפוּ
  choice: 焼かなければならない
  rationale: 法的・儀礼的指示における未完了形の命令的効力を、現代日本語で明確に表した。
theological_decisions:
- issue: 過越の食物の残りに関する命令の性質
  choice: 直接的な禁止と、それに続く必須の処分命令
  alternative: 法的拘束力を伴わない実用上の指示
  rationale: 本文は、朝まで残すことを禁じ、残った場合には火で焼くよう命じている。象徴的意味を付加せず、二つの指示の命令性をそのまま保った。
translation_notes:
  register: 明快な現代標準日本語。儀礼規定にふさわしい威厳を保ちつつ、過度に古風な「〜してはならぬ」「〜せよ」は避けた。原文の二つの節の並行性と命令の強さを保持した。
