source:
  edition: WLC
  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: ja
  text: 羊や山羊の群れも牛の群れも、あなたがたが言ったとおりに連れて行け。そして行け。私をも[a]祝福してくれ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私をさえ」とも訳せる。ファラオの言葉は、イスラエルが去るにあたり、自分も祝福を受けたいという思いを強調している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: 羊や山羊の群れも牛の群れも
  rationale: 二度の גַּם による並列と強調を、日本語の「～も～も」で自然に表した。צֹאן は羊や山羊などの小家畜、בָּקָר は牛などの大家畜を指す集合名詞である。
- source_word: קְחוּ ... וָלֵכוּ
  choice: 連れて行け
  rationale: 直訳すれば「取れ、そして行け」だが、この文脈では家畜を伴って立ち去る許可・命令であるため、現代日本語として自然な「連れて行け」とした。命令の強さは保っている。
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: あなたがたが言ったとおり
  rationale: モーセとアロンが以前に求めた内容どおりであることを示す比較表現を、そのまま明確に表した。
- source_word: וּבֵרַכְתֶּם
  choice: 祝福してくれ
  rationale: ברך の基本的な意味「祝福する」を保ち、ファラオが求める祝福の具体的な仕方までは補わなかった。
- source_word: גַּם אֹתִי
  choice: 私をも
  rationale: ファラオ自身も祝福の対象に加える語感を表す。「私をさえ」という強調の可能性もあるため、注で示した。
theological_decisions:
- issue: ファラオが求めた祝福の性質
  choice: 単純に「祝福してくれ」と訳し、祝福の仕方を限定しない
  alternative: イスラエルの神への執り成しを求めた、または別れの祝意を求めたと明示する
  rationale: 本文は祝福を求めていることは明白だが、それが神の恵みを求める執り成しなのか、別れに伴う祝意なのかを明示していない。原文の神学的な緊張と曖昧さを保った。
translation_notes:
  register: ファラオの切迫した命令口調を「行け」「してくれ」で表しつつ、現代の一般読者に明瞭で、聖書本文としての品位を保つ文体とした。
