source:
  edition: WLC
  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: ja
  text: それは、彼らをエジプトの地から導き出すために、ヤハウェのために守る夜[a]であった。この同じ夜は、イスラエルの子らすべてが代々、ヤハウェのために守る夜である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夜の見張り」または「見守りの夜」とも訳せる。ヘブライ語は、目を覚まして見張ることと、記念として守り続けることの両方を含みうる。
    reason: שִׁמֻּרִיםには警戒・見張りと記念的遵守の双方の含意があり、本文ではどちらか一方に限定しない。
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: 見守りの夜
  rationale: 構文上の「〜の夜」を保ちつつ、שׁמר に由来する「見張る・守る」という意味を表した。「徹夜」では礼拝的・記念的含意が弱く、「祭儀」では具体的な見守りの意味が失われるため、「見守り」とした。
- source_word: לַיהוָה
  choice: ヤハウェのための
  rationale: 前置詞 ל が示す関係・献身を、日本語として自然な「〜のための」で表した。「ヤハウェが見守った」と行為者を明示せず、原文の解釈上の幅を残した。
- source_word: לְהוֹצִיאָם
  choice: 彼らを…導き出すための
  rationale: ל を伴う不定詞の目的・関連の意味を保った。「連れ出す」よりも、神による出エジプトを表す文脈にふさわしい「導き出す」を用いた。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 原文に明示された אֶרֶץ（地）を省略せず訳した。
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: この同じ夜は
  rationale: 指示語と代名詞による強調的な同定を「この同じ夜」で表し、前半とのつながりを明確にした。
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの民すべてにとって
  rationale: 直訳的な「イスラエルの子ら」の契約共同体的意味を保ちながら、現代日本語で誤解なく自然に読める「イスラエルの民」とした。
- source_word: לְדֹרֹתָם
  choice: 代々
  rationale: 後続する世代にわたる継続を、簡潔で定着した日本語表現によって示した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の神名を固有名として明示し、一般名詞的な称号に置き換えなかった。
- issue: שִׁמֻּרִים の担い手と意味
  choice: 見守りの夜
  alternative: ヤハウェが見守った夜／イスラエルが守るべき記念の夜
  rationale: 前半を神の見守り、後半を民の記念遵守と理解する可能性はあるが、原文は名詞表現によって両者を明示的に分けていない。同じ訳語を反復し、その神学的・語義的な緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、出エジプトの出来事にふさわしい簡潔で荘重な調子を保った。שִׁמֻּרִים は前後で同じ「見守り」とし、原文の反復と曖昧さを維持した。
