source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: ja
  text: あなたがたは、このようにしてそれを食べなければならない。腰に帯を締め[a]、足に履物を履き、手に杖を持って、それを急いで食べなければならない。それはヤハウェの過越[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「腰を締めて」。長い衣を帯でまとめ、すぐに出発できるよう備えることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェへの過越」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: このようにして
  rationale: 食事の具体的な仕方を導入する表現として、指示の力を保ちつつ自然な現代日本語とした。
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: 食べなければならない
  rationale: この文脈での二人称複数の指示・命令として、義務性を明確に表した。
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: 腰に帯を締め
  rationale: 直ちに出発できるよう衣服を整える姿を示す慣用句。古風な直訳を避けながら、身体的な比喩を保持した。
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: 足には履物を履き
  rationale: נַעַלは古代の履物を指すが、ここでは種類よりも出発の備えが焦点なので、過度に限定しない「履物」とした。
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: 手には杖を持って
  rationale: 旅立つ者の装備という文脈に合う「杖」を採用した。
- source_word: בְּחִפָּזוֹן
  choice: 急いで
  rationale: 切迫感と即時の出発への備えを、簡潔で自然な副詞表現にした。
- source_word: פֶּסַח
  choice: 過越
  rationale: この食事・祭儀を指す確立した日本語の聖書用語を用いた。
- source_word: הוּא לַיהוָה
  choice: それはヤハウェの過越である
  rationale: לַיהוָהが示す帰属・献呈の関係を簡潔に表しつつ、別の理解の余地は脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文の神名を日本語で音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を保持し、称号との区別を明確にした。
- issue: לַיהוָה が表す関係
  choice: ヤハウェの過越
  alternative: ヤハウェへの過越
  rationale: 帰属を表す自然な日本語を本文に採用したが、献呈・方向を強調する解釈も文法上可能なため脚注で保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の厳粛さを保った。「腰に帯を締め」「履物」「杖」という具体的な旅支度の描写を残し、古風すぎる表現は避けた。
