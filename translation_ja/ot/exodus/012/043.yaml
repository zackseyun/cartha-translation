  terminology: Change 「主」 to 「ヤハウェ」 to represent the Tetragrammaton as a personal name. 「過越の祭り」「定め」「外国人」 are suitable in context. The footnote correctly gives the literal idiom and appropriately confines the fuller communal sense to explanation rather than the main text.
