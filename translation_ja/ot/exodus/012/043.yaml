source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: ja
  text: ヤハウェはモーセとアロンに言われた。「過越の祭りについての定めは次のとおりである。外国人[a]はだれも、その食事にあずかってはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「異国の子」。ここでは、イスラエルの共同体に属さない外国人を指す。
    reason: ヘブライ語の慣用表現と、その文脈上の意味を示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字名。日本語聖書として自然で荘重な慣用に従い「主」とした。
- source_word: חֻקַּת הַפָּסַח
  choice: 過越の祭りについての定め
  rationale: חֻקָּהの法的な響きを「定め」で保ち、הַפֶּסַחはこの文脈で祭儀とその食事を含むため「過越の祭り」とした。
- source_word: בֶּן נֵכָר
  choice: 外国人
  rationale: 字義的には「異国の子」だが、自然な日本語では共同体外の外国人を指す表現となる。文脈から未割礼などの限定を本文へ補わない。
- source_word: לֹא יֹאכַל בּוֹ
  choice: その食事にあずかってはならない
  rationale: 直訳的な「それを食べる」を、過越の食事への参与を禁じる法規として自然に表現した。בּוֹの指示対象を犠牲そのものだけに狭めない。
theological_decisions:
- issue: 過越の食事から除外される者の範囲
  choice: 「外国人」とし、本文ではそれ以上限定しない
  alternative: 「契約共同体の外にいる外国人」または「割礼を受けていない外国人」
  rationale: この節の בֶּן נֵכָר 自体は外国人を意味する。後続文脈が示す契約上の条件を先取りして本文へ挿入しない。
- issue: 神名 יְהוָה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語として広く理解される荘重な表記を採用した。ただし原文が称号ではなく神の固有名を記すことは翻訳判断上認識している。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、法規を告げる場面にふさわしい荘重さを保った。「次のとおりである」「あずかってはならない」により、規定としての調子を自然に示した。
