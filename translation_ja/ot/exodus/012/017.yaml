reference: Exodus 12:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: ja
  text: あなたがたは種なしパンの祭りを守りなさい[a]。まさにこの日に、わたしがあなたがたの諸隊をエジプトの地から導き出したからである[b]。あなたがたは代々、この日を永続する定めとして守りなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は字義的には「種なしのパン（物）」。「種なしパン」そのものを指すことも、そこから転じてその祭りを指すこともできる。原文に「祭り」という語はない。
    reason: lexical_alternative
  - marker: b
    text: 「諸隊」は、「軍勢」「部隊」「集団」とも訳せる。イスラエルが秩序ある集団としてエジプトを出たことを表す。
    reason: lexical_alternative
  - marker: c
    text: 「永久の定め」または「永遠の掟」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 守りなさい
  rationale: 祭儀上の命令として「守る」「遵守する」の意味を表し、節内の反復も保てる。
- source_word: הַמַּצּוֹת
  choice: 種なしパンの祭り
  rationale: 字義的には「種なしのパン（物）」だが、ここではそれを守る祭りの意を含む。本文は自然な日本語を優先し、字義上の幅は脚注に残した。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにこの日に
  rationale: その日そのものを強調するヘブライ語の慣用表現を、明瞭で荘重な日本語にした。
- source_word: הוֹצֵאתִי
  choice: 導き出した
  rationale: 使役形の「外へ出させた／連れ出した」を自然に表し、出エジプトの移動を明示する。
- source_word: צִבְאוֹתֵיכֶם
  choice: あなたがたの諸隊
  rationale: 民を秩序ある複数の集団として描く語感を保ちつつ、「軍勢」ほど戦闘性を強くしない表現とした。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々
  rationale: 後代へ継続することを簡潔で自然な日本語で表す。
- source_word: חֻקַּת עוֹלָם
  choice: 永続する定め
  rationale: 継続的効力を持つ規定という意味を伝えつつ、עוֹלָםを文脈を超えて哲学的な絶対永遠と断定しない。
theological_decisions:
- issue: הַמַּצּוֹתが食物そのものを指すか、祭りを指すか
  choice: 本文では「種なしパンの祭り」とした。
  alternative: 「種なしパン」
  rationale: 目的語が「守る」と結びつく文脈では祭りの遵守が自然だが、原文には「祭り」に当たる語がないため、その換喩的解釈を脚注で明示した。
- issue: חֻקַּת עוֹלָםの時間的範囲
  choice: 「永続する定め」
  alternative: 「永久の定め」「永遠の掟」
  rationale: 契約共同体の各世代にわたる継続的規定を表しながら、この慣用句が持ち得る文脈依存の時間幅を不必要に狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の荘重さを保った。「守りなさい」の反復によって原文の構造を再現し、「まさに」で第一の「この日」にだけある強調を示した。
