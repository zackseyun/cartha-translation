source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: ja
  text: そして言われた。「わたしはあなたの父の神、アブラハムの神、イサクの神、ヤコブの神である。」モーセは神を見ることを恐れ、顔を隠した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そして言われた
  rationale: 継続法による物語の進行を「そして」で示す。発話者は直前の文脈で明らかなため、日本語では主語を補わない。
- source_word: אָנֹכִי
  choice: わたしは…である
  rationale: 独立人称代名詞の明示による強調を「わたしは」で保ち、名詞文の同定を自然で荘重な「である」で表す。
- source_word: אֱלֹהֵי אָבִיךָ
  choice: あなたの父の神
  rationale: 単数形の「父」と二人称単数接尾辞をそのまま保ち、契約的な自己同定を明確に表す。
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: アブラハムの神、イサクの神、ヤコブの神
  rationale: ヘブライ語で各族長名の前に繰り返される「神」を省略せず、修辞的・契約的な強調を保つ。
- source_word: וַיַּסְתֵּר מֹשֶׁה פָּנָיו
  choice: モーセは…顔を隠した
  rationale: 使役語幹の「隠す、覆って見えなくする」を、身体的動作として自然な日本語で表す。
- source_word: כִּי יָרֵא
  choice: …ことを恐れ
  rationale: כִּי の理由を日本語では理由節を先に置く連用形で自然に示し、יָרֵא の恐れを保持する。
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: 神を見ること
  rationale: 恐れる対象となる行為を「見ること」と表す。הביט は注視する含みもあるが、この文脈では簡潔な「見る」が自然である。
theological_decisions:
- issue: 神の自己同定における אֱלֹהִים の訳
  choice: 神
  alternative: 神的存在
  rationale: 語り手は発話者を族長たちの神として明確に同定しているため、一般的な「神的存在」とせず「神」とする。
- issue: 族長名に伴う「神」の反復
  choice: アブラハムの神、イサクの神、ヤコブの神
  alternative: アブラハム、イサク、ヤコブの神
  rationale: 原文の反復が持つ契約的・修辞的重みを保ち、要約的に圧縮しない。
- issue: 「あなたの父」の単数形
  choice: あなたの父
  alternative: あなたの先祖たち
  rationale: 原文は単数形であり、指示対象を訳文で特定したり複数の先祖へ一般化したりせず、その曖昧さを保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の自己宣言には簡潔で品位ある「である」調を採用した。地の文では日本語として自然になるよう理由節を動作の前に置いた。
