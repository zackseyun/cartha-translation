source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: ja
  text: わたしは手を伸ばし、わたしがエジプトのただ中で行うあらゆる不思議な業によって、エジプトを打つ。その後、彼はあなたがたを送り出す。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: わたしは手を伸ばし
  rationale: 直訳的には「わたしの手を遣わす」だが、行動や力の発動を表すヘブライ語の慣用表現である。日本語では「手を伸ばす」が具体的な比喩を保ちつつ自然である。
- source_word: וְהִכֵּיתִי
  choice: 打つ
  rationale: נכה の基本義である「打つ」を採用し、災いによる神の攻撃を表しながら、殺害や全滅まで過度に限定しない。
- source_word: מִצְרַיִם
  choice: エジプト
  rationale: 個々のエジプト人ではなく、国・地域を集合的に指す固有名詞として訳した。
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: あらゆる不思議な業によって
  rationale: נִפְלְאוֹת は驚嘆を呼ぶ並外れた行為を指す。「不思議」だけでは事物にも聞こえるため、「不思議な業」として神の行為であることを明確にした。前置詞 בְּ はここでは手段を示す。
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: 行う
  rationale: עשה の簡潔な意味を保ち、「不思議な業」と自然につながるようにした。
- source_word: בְּקִרְבּוֹ
  choice: エジプトのただ中で
  rationale: 単数接尾辞は集合体としてのエジプトを受ける。「そのただ中」では日本語で指示対象が曖昧になりやすいため、固有名詞を補って空間的な像を保持した。
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 出来事の順序を示す簡潔で自然な現代日本語。
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: 彼はあなたがたを去らせる
  rationale: 主語は文脈上ファラオ。「解放する」より原語の「送り出す／去らせる」という使役的意味を保ち、日本語として自然にした。
theological_decisions:
- issue: 神の行動を表す擬人的表現
  choice: 「手を伸ばし」という身体的比喩を保持する
  alternative: 「力を振るい」など抽象化する
  rationale: 原文は神の介入を具体的な身体像で語っている。比喩を抽象的な教理表現に置き換えず、そのまま保持した。
- issue: ファラオの行為の表現
  choice: 「去らせる」と訳す
  alternative: 「行かせる」「解放する」「送り出す」
  rationale: שׁלח の使役・派遣／放逐の幅を残しつつ、単なる許可や積極的な解放に意味を狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「手を伸ばす」「打つ」「不思議な業」という原文の具体的で荘重な表現を保持した。節内の神の発言として、過度な敬語や古語は避けた。
