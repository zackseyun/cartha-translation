base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: ja
  text: そこでモーセは言った。「少し脇へそれて、この驚くべき光景を見てみよう。なぜ柴が燃え尽きないのだろう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……は言った
  rationale: ワウ継続法による物語の進行を、現代日本語で自然に示す。
- source_word: מֹשֶׁה
  choice: モーセ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: אָסֻרָה נָּא
  choice: あちらへ行って
  rationale: コホルタティブと נָא が表す自発的な意向を、独語として自然な「行って……見よう」に組み込んだ。「脇へそれる」よりも場面を理解しやすい。
- source_word: וְאֶרְאֶה
  choice: 見よう
  rationale: 視覚的に確かめようとする意志を、日本語の意向形で表した。
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: この驚くべき光景
  rationale: גָּדוֹל は単なる物理的大きさでなく、目を見張るほどの顕著さを表し得るため、文脈に即して「驚くべき」とした。
- source_word: מַדּוּעַ
  choice: なぜ
  rationale: 理由を問う疑問詞を簡潔に訳した。
- source_word: לֹא יִבְעַר
  choice: 燃え尽きない
  rationale: בער の基本義「燃える」を保ちつつ、この場面で問題となる、燃えているのに焼失しない現象を自然な日本語で表した。文脈上の含意を示すが、「焼き尽くされない」という受動態を原文に加えてはいない。
- source_word: הַסְּנֶה
  choice: 柴
  rationale: 茂み・低木を指す語について、日本語聖書で定着し、簡潔で格調のある「柴」を採用した。
theological_decisions:
- issue: 火に包まれた柴の現象の表現
  choice: なぜ柴が燃え尽きないのか
  alternative: なぜ柴は燃えないのか／なぜ柴は焼き尽くされないのか
  rationale: 原語の動詞は基本的に「燃える」だが、直前の文脈では柴が燃えていながら失われないことが驚異とされる。「燃え尽きない」はその緊張を明瞭にしつつ、現象への神学的解釈を付け加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、モーセの独語は自然な意向表現にした。「柴」はやや文語的だが、聖書語として定着しており、本文の簡潔さと品位を保つ。
