  to: そこでモーセは言った。「少し脇へそれて、この驚くべき光景を見てみよう。なぜ柴が燃え尽きないのだろう。」
  rationale: 「あちらへ行って」を「少し脇へそれて」に改め、コホルタティブの自発的意向と「向きを変える」という原語の基本的意味を反映した。後半は、燃えている柴が消費されないという文脈上の驚異を、原文の曖昧さを不必要に狭めず自然な日本語で保っている。
