  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: ja
  text: モーセは神に言った。「私がファラオのもとへ行き、イスラエルの子ら[a]をエジプトから連れ出すとは、私は何者なのでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イスラエル人たち」。字義的には「イスラエルの息子たち」。
    reason: בני ישראל の慣用的な民族集団としての意味と、原文の系譜的・男性形の表現の両方を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語で発言を導く אמר の標準的で自然な訳。接続辞は、直前の召命に対するモーセの応答と反論の流れを示すため「しかし」とした。
- source_word: אֶל הָאֱלֹהִים
  choice: 神に
  rationale: 定冠詞を伴うが、ここでは真の神を直接指しており、現代日本語では「神に」が自然。
- source_word: מִי אָנֹכִי
  choice: 私は何者なのでしょう
  rationale: モーセの自己卑下と、自分にはその任が不相応だという修辞的な問いを、説明を加えず自然に表す。
- source_word: אֵלֵךְ אֶל־פַּרְעֹה
  choice: 私がファラオのもとへ行き
  rationale: 未完了形が示す企図された行為を、修辞疑問に従属する日本語の形で表した。「もとへ」は人物への派遣を自然に示す。
- source_word: וְכִי אוֹצִיא
  choice: （そして）連れ出すとは
  rationale: יצא のヒフィル形の使役的意味を「連れ出す」で表した。二つの כִּי 節は「行き、…連れ出すとは」という並列構造にまとめ、日本語としての明瞭さを保った。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 系譜的・家族的なヘブライ語表現を保ちつつ、「子ども」だけを意味すると誤解されにくい「子ら」を用いた。より慣用的な集合表現は脚注に示す。
- source_word: מִמִּצְרָיִם
  choice: エジプトから
  rationale: 起点を表す前置詞 מן と「連れ出す」の組み合わせを、自然で意味の十分な日本語にした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人たち
  rationale: 原文の男性複数かつ系譜的な表現を本文で保持する。ただし、この句は民族全体を指す慣用表現なので、自然な集合表現も脚注に残し、年少者だけを指すとの誤解を避ける。
- issue: モーセの問いの含意
  choice: 「私は何者なのでしょう」という修辞疑問として保持
  alternative: 「私にはできません」など能力不足を明示する訳
  rationale: 原文はモーセの不相応感を示すが、その理由を能力、身分、信仰などの一つに限定していないため、含意を説明的に確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神への応答にふさわしい端正さを保った。語順は日本語として自然になるよう従属内容を先に置き、文末の修辞疑問を際立たせた。
