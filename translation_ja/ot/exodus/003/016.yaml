reference: Exodus 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: ja
  text: 行って、イスラエルの長老たちを集め、彼らにこう言いなさい。『あなたがたの父祖の神[a]、すなわちアブラハム、イサク、ヤコブの神であるヤハウェが私に現れ、こう言われた。「わたしは、あなたがたと、エジプトであなたがたにされたことを、確かに顧みた[b]。」』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「あなたがたの父たちの神」。続く「アブラハム、イサク、ヤコブの神」が、その父たちを具体的に示している。
    reason: lexical_alternative
  - marker: b
    text: 「確かに顧みた」に当たるヘブライ語は、同じ語根を重ねて意味を強めている。「必ず訪れた」とも訳せるが、ここでの「訪れる」は、神が決定的に心を向け、介入することを含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: 行って、……集め
  rationale: 命令形と、それに続く連続した行為を、簡潔で自然な日本語の命令表現として訳した。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: イスラエルの長老たち
  rationale: 共同体の指導者を指す定着した社会的呼称を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: あなたがたの父祖の神
  rationale: 直訳的な「父たち」が示す族長的・契約的背景を保ちつつ、現代日本語として自然な「父祖」を用いた。
- source_word: נִרְאָה אֵלַי
  choice: 私に現れ
  rationale: ראהのニファル形による神的顕現の慣用表現を自然な日本語で示した。
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: すなわちアブラハム、イサク、ヤコブの神
  rationale: 前の「父祖の神」を同格的に特定する構造を明確にした。
- source_word: פָּקֹד פָּקַדְתִּי
  choice: 確かに顧みた
  rationale: 不定詞絶対形と定動詞の重複による強意を「確かに」で表し、פקדがここで示す、介入へ向かう神の決定的な配慮を「顧みた」で表現した。
- source_word: וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם
  choice: エジプトであなたがたになされていること
  rationale: 行為者を補わず、受動分詞の焦点を維持した。分詞の継続的な含みを「なされている」とした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、称号で代替せず、日本語で一般的な学術的音写を採用した。
- issue: אֲבֹתֵיכֶםの族長的表現
  choice: 父祖
  alternative: 先祖、父たち
  rationale: アブラハム、イサク、ヤコブが直後に明示されるため、一般化しすぎる「先祖」を避け、男性の族長系列を自然な日本語で示した。
- issue: פקדの意味範囲
  choice: 顧みた
  alternative: 訪れた、心に留めた、目を留めた
  rationale: 単なる認知や社交的訪問ではなく、救出のための介入につながる神の決定的な配慮を示す一方、動詞の意味を具体的な救出行為にまで狭めないようにした。
translation_notes:
  register: 明快な現代標準語を基調としつつ、神の発言には「わたし」を用いて適度な威厳を保った。引用の階層を鉤括弧と二重鉤括弧で示し、原文の同格関係は「すなわち」で自然に明示した。
