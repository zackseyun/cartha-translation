base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: ja
  text: 神は言われた。「わたしは必ずあなたと共にいる。これがあなたにとって、わたしがあなたを遣わしたことのしるしである。あなたが民をエジプトから導き出したとき、あなたがたはこの山で神に仕える[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を礼拝する」とも訳せる。ヘブライ語の動詞は「仕える」を意味し、神との関係では「礼拝する」という意味にもなる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: わたしは必ずあなたと共にいる
  rationale: כִּי はここではモーセへの確かな保証を示し、אֶהְיֶה は将来に及ぶ神の臨在の約束を表す。日本語では「必ず」と現在形「いる」を組み合わせることで、約束の確かさと継続する臨在を自然に表した。
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: これが…あなたへのしるしである
  rationale: אוֹת を明瞭で聖書文脈にもなじむ「しるし」とした。לְךָ は受益・関係を示すため「あなたへの」と訳した。
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: わたしがあなたを遣わしたことの
  rationale: 後続節が、しるしによって確認される内容を示す構文として訳した。אָנֹכִי の明示的な主語は「わたしが」で保った。
- source_word: בְּהוֹצִיאֲךָ אֶת־הָעָם מִמִּצְרַיִם
  choice: あなたが民をエジプトから導き出したとき
  rationale: 前置詞 בְּ と不定詞構文を時間的に取り、接尾辞を民を導き出す主体モーセとして訳した。「導き出す」は単なる移動よりも出エジプトの指導を自然に表す。
- source_word: תַּעַבְדוּן אֶת־הָאֱלֹהִים
  choice: あなたがたは…神に仕える
  rationale: 動詞の複数形を「あなたがた」で明示した。עבד の基本的な幅を保つため「仕える」とし、神を目的とする文脈で礼拝の意味も含み得ることを脚注で示した。
- source_word: עַל הָהָר הַזֶּה
  choice: この山で
  rationale: 日本語では行為の場所を「山で」とするのが自然であり、指示語「この」によって物語上の具体性を保った。
theological_decisions:
- issue: 約束された「しるし」の性質
  choice: 出エジプト後にこの山で神に仕えることを、将来において実現するしるしとして示す
  alternative: 神が今ここで与える臨在の約束そのものをしるしと見る、または現在の保証と将来の成就の両方を含むと見る
  rationale: 統語上、「あなたが民を…導き出したとき、あなたがたは…仕える」という後続節がしるしの内容を示すと読むのが最も自然である。ただし、そのしるしと直前の臨在の約束との神学的関係を説明で限定しなかった。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の発話にふさわしい簡潔で荘重な文体とした。「わたし」を用い、過度に古風な語法は避けた。単数のモーセへの委任から複数の民による奉仕への移行を「あなた」から「あなたがた」への変化で明示した。
