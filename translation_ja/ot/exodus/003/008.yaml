language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: ja
  text: わたしは、エジプトの支配からこの民を救い出し[a]、その地から、良い広々とした地へ、乳と蜜の流れる地へ、すなわちカナン人、ヒッタイト人、アモリ人、ペリジ人、ヒビ人、エブス人のいる所へ、この民を導き上げるために降りて来た[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「エジプトの手から」。「手」はここでは権力や支配を表す。また、原文の「救い出し」と「導き上げる」の目的語はいずれも男性単数形で、イスラエルの民全体を一つの集合体として指している。
    reason: 慣用句と集合的単数を説明するため。
  - marker: b
    text: 「降りて来た」は、神の働きを空間的な動きとして描く原文の表現。
    reason: 擬人的な空間表現を保持していることを明確にするため。
lexical_decisions:
- source_word: וָאֵרֵד
  choice: わたしは……降りて来た
  rationale: 神の行動を表す空間的・擬人的な表現を保ちつつ、文脈上すでに決意され開始された行為として自然な日本語の過去形で訳した。
- source_word: לְהַצִּילוֹ מִיַּד מִצְרַיִם
  choice: エジプトの支配からこの民を救い出し
  rationale: נצל（ヒフィル）の具体的な救出の意味を「救い出す」で表した。יד の慣用句は、日本語で字義的な「手」を残すより意味が明瞭な「支配」とし、単数接尾辞の集合的指示対象を「この民」とした。
- source_word: וּלְהַעֲלֹתוֹ
  choice: この民を導き上る
  rationale: עלה（ヒフィル）の上方への移動を「上る」で保った。「導き」を添えて、神が民を目的地へ移す使役的意味を自然に表した。
- source_word: מִן הָאָרֶץ הַהִוא
  choice: その地から
  rationale: 直前のエジプトを指す指示表現を過度に明示せず、そのまま保った。
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: 良い広々とした地へ
  rationale: טוֹבָה を「良い」、רְחָבָה の空間的な広さとゆとりを自然な現代日本語の「広々とした」で表した。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 乳と蜜の流れる地
  rationale: 豊かさを示す分詞的比喩を、定着しつつ原文の像を保つ表現で訳した。
- source_word: אֶל מְקוֹם
  choice: ……の住む所へ
  rationale: מְקוֹם の「所」を保ちながら、民族名の列挙との関係が日本語で明確になるよう、居住を表す補足を最小限に加えた。
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: カナン人、ヒッタイト人、アモリ人、ペリジ人、ヒビ人、エブス人
  rationale: 単数形の民族名が集合的に各民族を指すため、日本語でも通常の集合的な「〜人」で表した。
theological_decisions:
- issue: 神が「降りて来た」という擬人的な空間表現
  choice: 空間的表現を字義どおり残す
  alternative: 「介入するために来た」「行動を起こすことにした」と意訳する
  rationale: 原文は神の救出行為を鮮明な空間的言語で描く。抽象化せず、物語上の神学的緊張と表現を保持した。
- issue: イスラエルを指す単数代名詞
  choice: 集合体を示す「この民」と訳し、脚注で単数形を明示する
  alternative: 「彼」または複数の「彼ら」と訳す
  rationale: ヘブライ語の男性単数接尾辞を日本語で「彼」とすると個人を指すように誤解されやすい。一方「彼ら」だけでは集合的単数が失われるため、本文では自然な「この民」を用い、原文の形は脚注で保持した。
- issue: 「エジプトの手」という慣用表現
  choice: 本文では「エジプトの支配」と意味を明示する
  alternative: 「エジプトの手から」と比喩を直訳する
  rationale: 日本語の「手から」は所有や保護など別の意味にも取れ、この箇所の権力・統制の意味が不明瞭になりやすい。脚注で原文の比喩を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「乳と蜜の流れる地」「降りて来た」など原文の主要な比喩と空間表現を保持した。民族名は一般的な聖書表記に従い、文全体は神の発話にふさわしい簡潔で格調ある調子とした。
