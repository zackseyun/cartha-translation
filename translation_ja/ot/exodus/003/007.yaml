  terminology: 「ヤハウェ」「わたしの民」「苦しみ」「叫び」「痛み」はいずれも文脈と原語にふさわしい。「追い立てる者たち」はנֹגְשִׂיםの駆り立て・労働強制の含意をよく伝える。
  issues:
