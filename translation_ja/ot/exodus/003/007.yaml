source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: ja
  text: ヤハウェは言われた。「わたしは、エジプトにいるわたしの民の苦しみを確かに見た[a]。また、彼らが彼らを追い立てる者たちのゆえに上げる叫びを聞いた[b]。わたしは彼らの痛みを知っている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしはまさしく見た」。ヘブライ語では、同じ動詞の不定詞絶対形を定動詞に重ねて強調している。
    reason: lexical_alternative
  - marker: b
    text: 「追い立てる者たち」は、労働を強制する監督者、または圧迫する者たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: רָאֹה רָאִיתִי
  choice: 確かに見た
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を、自然な現代日本語で保持した。
- source_word: עֳנִי
  choice: 苦しみ
  rationale: 過酷な境遇による悲惨と苦難を含む語であり、平明かつ文脈に適する。
- source_word: צַעֲקָתָם
  choice: 叫び
  rationale: 苦境から発せられる切迫した声を簡潔に表す。
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: 彼らを追い立てる者たちのゆえに
  rationale: נֹגֵשׂの労働を強制して駆り立てる含意を保ち、前置詞句の原因的関係を明示した。
- source_word: יָדַעְתִּי
  choice: 知っている
  rationale: 完了形がここで表す、現在に及ぶ人格的で深い認識を自然に伝える。
- source_word: מַכְאֹבָיו
  choice: 彼らの痛み
  rationale: 身体的・精神的苦痛の双方を含みうる原語を、抽象化しすぎず表した。
theological_decisions:
- issue: 神名YHWHの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 契約の神の固有名を称号で代替せず、本文に明示する。
- issue: 神が民の痛みを『知る』という表現
  choice: わたしは彼らの痛みを知っている
  alternative: わたしは彼らの痛みを承知している／顧みた
  rationale: 神の人格的で関与を伴う認識を示す原文の直接性を弱めず、特定の解釈を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神の発言には「わたし」を用い、原文の強調と短い節の力強さを維持した。
