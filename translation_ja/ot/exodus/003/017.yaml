source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: ja
  text: わたしはこう言った[a]。『わたしはあなたがたを、エジプトでの苦しみ[b]から、カナン人、ヒッタイト人、アモリ人、ペリジ人、ヒビ人、エブス人の地へ、乳と蜜の流れる地へ連れ上げる。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の動詞は形式上「わたしは言った」である。文脈上、すでに表明され、今も効力を持つ神の意志を改めて示す表現とも理解できる。
    reason: 時制と談話上の機能に関する注記。
  - marker: b
    text: 「苦しみ」は「虐げ」または「悲惨な境遇」とも訳せる。
    reason: 原語 עֳנִי が苦難、悲惨、抑圧を含む意味範囲を持つため。
lexical_decisions:
- source_word: וָאֹמַר
  choice: わたしは言った
  rationale: ヘブライ語の動詞が表す過去の発言を素直に訳した。文脈上、この宣言は現在も効力を持つが、日本語本文で「約束した」と意味を限定せず、注で含意を示す。
- source_word: אַעֲלֶה
  choice: 連れ上る
  rationale: ヒフィル形の「上らせる、連れ上る」という移動のイメージを保つ。「救い出す」より原語に近く、エジプトから約束の地への上行も表せる。
- source_word: מֵעֳנִי מִצְרַיִם
  choice: エジプトでの苦しみから
  rationale: עֳנִי の幅を保ちつつ、属格を日本語で自然に解釈した表現。「エジプトの苦しみ」という曖昧な日本語を避け、エジプトにおける民の苦境を示す。
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: カナン人、ヒッタイト人、アモリ人、ペリジ人、ヒビ人、エブス人
  rationale: 原文では各民族名が単数形だが、民族集団を指す日本語として「人」を付けた慣用的な形にした。
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 乳と蜜の流れる地へ
  rationale: 豊かさと肥沃さを示す原文の比喩を説明に置き換えず、そのまま自然な日本語で保持した。
theological_decisions:
- issue: 神の宣言を表す過去形の扱い
  choice: わたしは言った
  alternative: わたしはこう言っている／わたしは約束した
  rationale: 形式上の過去形を本文で保ち、神の確定した意志や現在的効力を訳語だけで断定しない。「約束した」は文脈に適合し得るが、原語の一般的な「言う」より意味を狭めるため採用しなかった。
translation_notes:
  register: 明瞭で現代的ながら、神の宣言にふさわしい簡潔で格調ある文体とした。民族名は現代日本語の聖書表記として通用する形を用い、比喩「乳と蜜の流れる地」は保持した。英語監査層では脚注[b]の印が「Hivites」の後に置かれているが、脚注内容と原語上の論点は מֵעֳנִי מִצְרַיִם に対応するため、日本語では「苦しみ」の後に配置した。
