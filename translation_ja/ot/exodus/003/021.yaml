source:
  edition: WLC
  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: ja
  text: わたしは、この民がエジプト人の好意を得るようにする[a]。あなたがたが出て行くとき、何も持たずに出て行くことはない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「エジプト人の目に、この民への好意を与える」。
    reason: lexical_alternative
  - marker: b
    text: または「手ぶらで出て行くことはない」。品物や備えを何も持たずに去ることを意味するヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־חֵן
  choice: 好意を得るようにする
  rationale: 直訳的には「好意を与える」だが、日本語では対象となる民がエジプト人から好意的に見られるという使役的な関係を「好意を得るようにする」で自然に表せる。
- source_word: הָעָם הַזֶּה
  choice: この民
  rationale: 単数の集合名詞 עָם と指示詞を反映し、イスラエルを一つの民として指す表現を保つ。
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: エジプト人の好意を得る
  rationale: 字義は「エジプト人の目に」で、人からどう見られるかを示す慣用句。本文では自然な日本語で意味を伝え、字義的表現を脚注に残す。
- source_word: וְהָיָה כִּי
  choice: …とき
  rationale: 将来の状況を導入するヘブライ語の定型表現であり、冗長な「その時にはこうなる」を避けて自然に訳す。
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: 出て行く／出て行く
  rationale: הלך の基本義は「行く」だが、文脈上はエジプトからの出発を指すため、「出て行く」が明確で自然。
- source_word: רֵיקָם
  choice: 何も持たずに
  rationale: 「空で、空手で」を意味し、この文脈では品物や備えを持たずに出発することを指す。現代日本語として明瞭な表現を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「この民」で集合的な指示を保ち、神の働きを主語として明示した。本文は慣用的な日本語を優先しつつ、原文の身体語彙「目」と רֵיקָם の字義を脚注で示した。
