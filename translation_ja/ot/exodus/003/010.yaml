source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: ja
  text: さあ、行きなさい。わたしはあなたをファラオのもとへ遣わす。わたしの民、イスラエルの子ら[a]をエジプトから連れ出しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエル人」とも訳せる。ヘブライ語では「イスラエルの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: 時間的・談話的な転換を示し、モーセへの任命が次の段階に入ることを、現代日本語で自然に表す。
- source_word: לְכָה
  choice: 行きなさい
  rationale: הלךの命令形。神のもとからファラオのもとへ遣わされる方向性を、日本語では「行く」で明瞭に表せる。
- source_word: וְאֶשְׁלָחֲךָ
  choice: わたしはあなたを…遣わす
  rationale: 神による任命を表す未完了形を、簡潔な意志・未来表現として訳した。
- source_word: אֶל־פַּרְעֹה
  choice: ファラオのもとへ
  rationale: 単なる方向だけでなく、ファラオへの使者として赴く意味を自然な日本語で示す。
- source_word: וְהוֹצֵא
  choice: 連れ出しなさい
  rationale: יצאのヒフィル命令形の使役的意味「外へ出させる」を、人々を対象とする自然な日本語で表す。
- source_word: עַמִּי
  choice: わたしの民
  rationale: 神と民との帰属関係を示す重要な表現を直接保持する。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 祖先イスラエルとの家族的・系譜的な結びつきを表す原文の形を保持する。より慣用的な訳は脚注に示す。
- source_word: מִמִּצְרָיִם
  choice: エジプトから
  rationale: 「連れ出す」と組み合わせ、出発点と脱出の動きを自然に表す。
theological_decisions:
- issue: 契約の民を指す בְנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 原文の家族的・祖先的な呼称を本文に残しつつ、民族名としての自然な理解を脚注で補う。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の命令と任命にふさわしい簡潔で荘重な調子を保った。
