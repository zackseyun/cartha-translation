source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: ja
  text: すると、神は言われた。「ここに近づいてはならない。[a] 履物を足から脱ぎなさい。あなたが立っているその場所は、聖なる地[b]だからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ここまで近づいてはならない。」
    reason: הֲלֹם は「ここに」のほか、到達点を強調して「ここまで」とも表せる。
  - marker: b
    text: 「聖なる地」は、直訳では「聖性の地（土）」という構成。
    reason: אַדְמַת קֹדֶשׁ の構成関係と、אַדָמָה が「地／土」を意味する語であることを示す。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、神は言われた
  rationale: 接続形による物語の進行を「すると」で表した。主語は直前の文脈にある神を明示し、日本語として自然にした。
- source_word: אַל תִּקְרַב הֲלֹם
  choice: ここに近づいてはならない
  rationale: 否定辞と未完了形による禁止を明確に表し、הֲלֹם の場所・方向の意味を「ここに」で自然に示した。
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: 履物を脱ぎなさい
  rationale: שַׁל は履物を取り外す命令である。נְעָלֶיךָ は古代のサンダルを含む履物を指すため、特定の形状に狭めず、現代日本語で自然な「履物」とした。「足から」は日本語では通常自明なので省いた。
- source_word: כִּי
  choice: だからである
  rationale: 先の命令の理由を導く因果関係を明確にした。
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: あなたが立っているその場所
  rationale: 関係節と前置詞句を自然な日本語に組み替え、モーセが現に立つ特定の場所を「その」で示した。
- source_word: אַדְמַת קֹדֶשׁ
  choice: 聖なる地
  rationale: 構成句は直訳すれば「聖の地／土」であり、その場所の神聖さを、簡潔で定着した日本語「聖なる地」で表した。
- source_word: הוּא
  choice: は…である
  rationale: 独立代名詞が担う同定・断定の働きを、日本語の判断文として表した。
theological_decisions:
- issue: その場所の聖性の性質
  choice: 「聖なる地」と記述するにとどめる
  alternative: 神の臨在によって聖別された地であると説明的に訳す
  rationale: 本文はその地が聖であると宣言するが、この節自体は聖性の仕組みを説明していないため、神学的説明を訳文に加えなかった。
- issue: 発話者の明示
  choice: 直前の文脈を受けて「神」とする
  alternative: 主語を省略して「言われた」とする
  rationale: ヘブライ語の三人称男性単数の指示対象は直前の神的発話者であり、日本語で読み手が自然に追えるよう文脈上の主語を明示した。神的発話者の同定以上の解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の命令にふさわしい簡潔で荘重な調子を保った。「サンダル」より広く原語を覆う「履物」を採用し、不自然な逐語表現は避けた。
