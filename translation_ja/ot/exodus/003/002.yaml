  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: ja
  text: その時、ヤハウェの御使い[a]が、茂みの中の火の炎のうちに彼に現れた。彼が見ると、そこには、茂みが火に燃えていたが、その茂みは焼き尽くされていなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェの使者」。ヘブライ語は「御使い」と「使者」のどちらも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 現れた
  rationale: ראהのニファル形が表す「姿を現す」という意味を、神的顕現の文脈に自然な現代日本語で表した。
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの御使い
  rationale: מַלְאַךְは「使者」と「御使い」の両義を持つ。この神的顕現の場面では「御使い」が自然だが、「使者」の可能性を脚注に残した。固有名יהוהは「ヤハウェ」とした。
- source_word: בְּלַבַּת אֵשׁ
  choice: 燃え上がる炎のうちに
  rationale: 直訳的な「火の炎」の重複を避けつつ、לַבַּת אֵשׁの鮮明な炎のイメージと、前置詞בの「炎のうちに」を保った。
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: 茂みの中から
  rationale: מִתּוֹךְの起点を示す「中から」を明示した。סְנֶהの植物種は確定しにくいため、特定しすぎない「茂み」とした。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 彼が見ると、なんと
  rationale: ראהの知覚とהִנֵּהの注意喚起をそれぞれ表し、驚くべき光景へ読者の注意を向ける語りの力を保った。
- source_word: בֹּעֵר בָּאֵשׁ
  choice: 火に燃えている
  rationale: 分詞が示す継続状態を「燃えている」で表し、明記されたאֵשׁも「火に」として残した。
- source_word: אֵינֶנּוּ אֻכָּל
  choice: 焼き尽くされなかった
  rationale: אכלの受動形を火の文脈に即して訳し、茂みが燃え続けながら消失しないという逆説を明確にした。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された契約の神名を固有名として示した。日本語で伝統的な「主」とする選択肢もあるが、ここでは原文上の神名を保持した。
- issue: 神的顕現の文脈におけるמַלְאַךְ
  choice: 御使い
  alternative: 使者
  rationale: 天的存在を指す文脈に自然な「御使い」を本文に採用した。ただし語そのものは一般的な「使者」も意味するため、特定の神学的同定を本文で付加せず、語義上の別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「見よ」のような古風な命令形は避けつつ、הִנֵּהの驚きと注意喚起を「なんと」で表現した。代名詞「彼」は文脈上モーセを指す。
