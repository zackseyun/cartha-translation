id: EXO.3.15
reference: Exodus 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: ja
  text: 神はさらにモーセに言われた。「イスラエルの子らに、こう言いなさい。『あなたがたの父祖の神、アブラハムの神、イサクの神、ヤコブの神であるヤハウェ[a]が、私をあなたがたのもとに遣わされた。』これが永遠にわたしの名であり、これが代々にわたって、わたしが覚えられる名である[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では四文字神名「YHWH」。その古代の正確な発音は確定していないが、一般に「ヤハウェ」と再構成される。伝統的に「主」と訳されることもある。
    reason: 神名の原語表記と発音上の不確かさを示すため。
  - marker: b
    text: 直訳すると「これが代々にわたる、わたしの記念」。または「これが代々、わたしが覚えられる名」。
    reason: זִכְרִי が持つ「記念」「記憶」「覚えられるためのもの」という意味の幅を保存するため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文に現れる四文字神名を称号「主」で置き換えず、一般的な推定発音に基づいて音写した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの親族的表現を保ちつつ、イスラエル民族共同体を指す語として理解できる形にした。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: あなたがたの父祖の神
  rationale: 男性形の「父たち」を反映しながら、現代日本語で祖先を指す自然で格調ある「父祖」を用いた。
- source_word: שְׁלָחַנִי
  choice: 私をあなたがたのもとに遣わされた
  rationale: 完了した派遣と現在も有効な委任を、日本語の文脈に自然な過去形で表した。
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: これが永遠にわたしの名であり
  rationale: לְעֹלָם の持続性を簡潔な「永遠に」で表し、神名が恒久的なものであるという本文の力点を保った。
- source_word: זִכְרִי
  choice: わたしを覚えるための名
  rationale: 「記念」「記憶」を意味し得る名詞を、この文脈で人々が神を覚え、呼び起こす名という含意が伝わるように訳した。字義的な別訳は脚注に残した。
- source_word: לְדֹר דֹּר
  choice: 代々にわたって
  rationale: 世代から世代へ続くことを、明瞭で自然な現代日本語の慣用表現で示した。
- source_word: כֹּה תֹאמַר
  choice: こう言いなさい
  rationale: 神の直接的な命令を、現代日本語として自然でありながら威厳を損なわない形で表した。
- source_word: עוֹד
  choice: さらに
  rationale: 発言の反復というより、神が説明を続ける談話上の機能を表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名そのものを用いているため、神名であることを明示する音写を本文に置いた。発音が完全には確定できない点は脚注で示した。
- issue: イスラエルへの呼びかけにある男性親族語
  choice: イスラエルの子ら／あなたがたの父祖
  alternative: イスラエルの民／あなたがたの祖先
  rationale: 原文の親族的・男性形の語法を保持しつつ、日本語で共同体と祖先を自然に指せる表現を選んだ。
- issue: זִכְרִי の意味範囲
  choice: わたしを覚えるための名
  alternative: わたしの記念／わたしの記憶
  rationale: この語が「記念」そのものとも「それによって覚えられるもの」とも取れる余地を認め、本文では文脈上の機能を明瞭にし、より字義的な表現を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、神の発言には簡潔で威厳ある調子を保った。「私」はモーセの発言部分、「わたし」は神の自己言及として表記を分け、話者の違いを読み取りやすくした。
