source:
  edition: WLC
  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: ja
  text: 彼らはあなたの言うことに耳を傾ける。あなたとイスラエルの長老たちはエジプトの王のもとへ行き、彼にこう言いなさい。『ヘブライ人の神ヤハウェが私たちに出会われました[a]。どうか、私たちを今、荒野へ三日の道のりを行かせてください。私たちの神ヤハウェにいけにえをささげるためです。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちに現れました」。ヘブライ語の句は、ヤハウェが彼らに出会った、または彼らのもとに現れたことを表し得る。
    reason: 語句 נִקְרָה עָלֵינוּ の意味の幅を示しつつ、神が主体であることと、出会いの方向性を明確にするため。
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: 彼らはあなたの言うことに耳を傾ける
  rationale: 直訳的な「あなたの声を聞く」が含む、聞くことと受け入れて応じることの両面を、過度に明示的な「従う」に限定せず自然な日本語で表した。
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: あなたとイスラエルの長老たちは…行き
  rationale: 単数動詞に明示代名詞と長老たちが続くヘブライ語の構造を、日本語では複数主語として自然に整えた。文脈上、エジプト王のもとへの移動なので「行く」とした。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: エジプトの王
  rationale: 連語を簡潔かつ標準的に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: ヘブライ人の神
  rationale: 原文の民族呼称と属格関係をそのまま明瞭に表した。
- source_word: נִקְרָה עָלֵינוּ
  choice: 私たちに出会われました
  rationale: קראのニファル形とעַלの組み合わせを、神との遭遇を表す句として訳した。召命という意味に限定せず、原文の幅を保った。
- source_word: נֵלֲכָה נָּא
  choice: どうか…行かせてください
  rationale: 勧奨形と丁寧な要請を示すנָאを、王に許可を求める自然な日本語で表した。
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 三日の道のり
  rationale: 移動の期間または距離を表すヘブライ語の慣用句を簡潔に保った。
- source_word: בַּמִּדְבָּר
  choice: 荒野へ
  rationale: 移動動詞に伴う方向を「へ」で表し、מִדְבָּרの広い地理的意味に合う「荒野」を用いた。
- source_word: וְנִזְבְּחָה
  choice: いけにえをささげるためです
  rationale: 先行する移動の要請に対する目的として理解し、勧奨形の意図を自然な日本語で示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、称号へ置換せず一般的な学術的音写を採用した。
- issue: נִקְרָה עָלֵינוּ が表す神との遭遇
  choice: 私たちに出会われました
  alternative: 私たちの前に現れました／私たちに会われました／私たちを召されました
  rationale: この句は出会い・遭遇を表し得るが、その具体的な様態までは確定しない。「召された」と限定せず、意味の幅を脚注でも示した。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある標準語とした。神名は「ヤハウェ」、祭儀語は分かりやすい「いけにえをささげる」を用いた。引用内の要請は丁寧だが過度に古風にならない表現とした。
