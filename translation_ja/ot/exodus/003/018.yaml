  to: 彼らはあなたの言うことに耳を傾ける。あなたとイスラエルの長老たちはエジプトの王のもとへ行き、彼にこう言いなさい。『ヘブライ人の神ヤハウェが私たちに出会われました[a]。どうか、私たちを今、荒野へ三日の道のりを行かせてください。私たちの神ヤハウェにいけにえをささげるためです。』
