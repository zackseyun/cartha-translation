source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: ja
  text: 今、見よ、イスラエルの子らの叫びがわたしのもとに届いた。そしてわたしは、エジプト人が彼らに加えている圧迫も見た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 今
  rationale: 接続と場面転換を示す表現。日本語では文脈上の連続性を保ちつつ、簡潔に「今」とした。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 注意を促す談話標識。現代日本語でも聖書の荘重な語りとして理解でき、原文の喚起力を保つ。
- source_word: צַעֲקַת
  choice: 叫び
  rationale: 苦境から発せられる救いを求める声を直接的に表す。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 原文の親族的・契約的表現を保ち、「息子たち」よりも集団名称として自然な日本語にした。
- source_word: בָּאָה אֵלַי
  choice: わたしのもとに届いた
  rationale: 直訳は「わたしのもとに来た」だが、叫びを主語とする自然な日本語では「届いた」が適切。
- source_word: וְגַם
  choice: そして…も
  rationale: 追加と強調の働きを、日本語の「も」で保持した。
- source_word: רָאִיתִי
  choice: 見た
  rationale: 完了した知覚と現在の行動へのつながりを文脈に委ね、自然な日本語の過去形とした。
- source_word: הַלַּחַץ
  choice: 虐げ
  rationale: 強制的な圧迫・抑圧を表し、後続の同根動詞との語の響きも保てる。
- source_word: מִצְרַיִם
  choice: エジプト人
  rationale: ここでは複数分詞の主語としてエジプトの民を指すため、自然で明確な「エジプト人」とした。
- source_word: לֹחֲצִים
  choice: 虐げている
  rationale: 分詞が示す継続中の抑圧を「ている」で表した。
- source_word: אֹתָם
  choice: 彼らを
  rationale: イスラエルの子らを受ける複数目的語として明示した。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の集団的・親族的呼称
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 民族名に平板化せず、原文の系譜的・契約的な表現を残した。「子ら」は集団全体を含み得るため、男性だけに不必要に限定しない。
- issue: 神が叫びを認識したことを表す בָּאָה אֵלַי
  choice: わたしのもとに届いた
  alternative: わたしのもとに来た
  rationale: 神がそれまで知らなかったという含意を加えず、原文の比喩を自然な日本語で表した。
- issue: הִנֵּה の談話上の力
  choice: 見よ
  alternative: 確かに
  rationale: 断定の意味へ狭めず、聞き手の注意を促す原文の機能を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発話にふさわしい簡潔で荘重な調子を採用した。同根語 הַלַּחַץ／לֹחֲצִים は「虐げ／虐げている」と反復し、原文の修辞を保持した。
