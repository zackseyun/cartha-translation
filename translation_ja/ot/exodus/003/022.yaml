reference: Exodus 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: ja
  text: 女はそれぞれ、近所の女から、また自分の家に滞在している女[a]から、銀の品、金の品、衣服を求めなさい[b]。それらをあなたがたの息子や娘に身に着けさせなさい。こうして、あなたがたはエジプトを略奪することになる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の家に寄留している女」。この表現は、その家に一時的に滞在している者、または寄留者を指し得る。家が誰のものかについても解釈の余地がある。
    reason: lexical_alternative
  - marker: b
    text: 「求める」と訳した語は「願い求める、頼む」の意。「借りる」と訳されることもあるが、原語自体は返却を前提としていない。
    reason: lexical_alternative
  - marker: c
    text: 別訳「エジプトを奪い取る」「エジプトをはぎ取る」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: 求めなさい
  rationale: שׁאל の基本義は「求める、願い求める」であり、返却義務を含む「借りる」とはしない。文脈に即して自然な命令表現とした。
- source_word: אִשָּׁה
  choice: 女はそれぞれ
  rationale: 単数形の分配的用法を、現代日本語で明確に表した。
- source_word: מִשְּׁכֶנְתָּהּ
  choice: 近所の女
  rationale: 女性形で、相手が女性であることを保持した。
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: 自分の家に滞在している女
  rationale: גור の分詞が示す、一時的滞在者または寄留者という幅を保ちつつ、家庭の文脈で分かりやすくした。誰の家かについては接尾辞を直近の主語であるイスラエル人女性に結び付けた。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 銀の品、金の品
  rationale: כְּלִי は器、道具、装身具などを含み得る広い語なので、種類を限定しない「品」とした。
- source_word: וּשְׂמָלֹת
  choice: 衣服
  rationale: 衣類一般を指す語として、明瞭で自然な現代語を選んだ。
- source_word: וְשַׂמְתֶּם עַל
  choice: 身に着けさせなさい
  rationale: 直訳は「上に置く」だが、銀・金の品や衣服を息子と娘に付ける場面では「身に着けさせる」が自然である。
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: あなたがたの息子や娘
  rationale: 原文が息子と娘を明記しているため、総称の「子ども」にまとめなかった。
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: こうして、あなたがたはエジプトから略奪することになる
  rationale: נצל のピエル形が表す「奪い取る、略奪する」という強い意味を弱めない。「エジプト」は土地そのものよりエジプト人側を集合的に指すと理解でき、日本語では起点を示す「から」を補うと行為関係が明瞭になる。
theological_decisions:
- issue: エジプトの財物を受け取る行為を道徳的に和らげるか
  choice: 略奪することになる
  alternative: 借りる／品物を受け取る
  rationale: 原文は返却を前提とする「借りる」とは述べず、נצל によって圧政の逆転としての強い奪取を表す。翻訳でこれを婉曲化しない。
- issue: וּמִגָּרַת בֵּיתָהּ の家の所属
  choice: イスラエル人女性の家に滞在する女
  alternative: 彼女の家に住む寄留者の女／隣人の家に滞在する女
  rationale: 三人称女性単数の接尾辞は、文法上は先行する女性を指し得るため多少の曖昧さがある。本文では文の中心である「女」に結び付け、別解を脚注で示した。
translation_notes:
  register: 明瞭で現代的だが、命令と結末の重みを保つ格調ある文体とした。「女」は原文の性別を明示するため用い、「女性」より聖書本文として簡潔な語調を選んだ。脚注記号は該当箇所に配置し、本文の流れを妨げないようにした。
