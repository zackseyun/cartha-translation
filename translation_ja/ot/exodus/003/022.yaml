revisions:
- from: 女はそれぞれ、近所の女と、自分の家に滞在している女[a]に、銀の品、金の品、衣服を求めなさい[b]。それらをあなたがたの息子や娘に身に着けさせなさい。こうして、あなたがたはエジプトから略奪することになる[c]。
  to: 女はそれぞれ、近所の女から、また自分の家に滞在している女[a]から、銀の品、金の品、衣服を求めなさい[b]。それらをあなたがたの息子や娘に身に着けさせなさい。こうして、あなたがたはエジプトを略奪することになる[c]。
  rationale: 二つの מִן句を「～から」で明示し、エジプトを直接目的語として保持した。これにより、原文の統語関係と נצל の強い意味を、現代日本語として自然に再現する。家の所属に関する構文上の余地は、本文で不必要に断定せず脚注に保持した。
