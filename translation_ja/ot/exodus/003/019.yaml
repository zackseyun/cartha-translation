  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: ja
  text: しかし、わたしは知っている。エジプトの王は、強い手によらなければ、あなたがたを行かせない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エジプトの王は、あなたがたを行かせない。強い手をもってしても、行かせない」。ヘブライ語の句は省略を含み、「強い手によってのみ王が屈する」という意味にも、「強い手をもってしても行かせない」という意味にも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: しかし、わたしは
  rationale: 接続詞と独立代名詞による対照と強調を、自然な現代日本語で表した。
- source_word: יָדַעְתִּי
  choice: 知っている
  rationale: 完了形が示す確定した神の認識を、文脈に即した現在の状態として表した。
- source_word: כִּי
  choice: （内容を示す後続文）
  rationale: 知っている内容を導く接続表現だが、日本語では独立した文として続けることで明瞭かつ自然にした。
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: あなたがたを行かせない
  rationale: 「与える」と不定詞の組み合わせがここでは許可を意味するため、出エジプトの文脈に合う簡潔な表現とした。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: エジプトの王
  rationale: 連語を直接的で自然な日本語に訳した。
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: 強い手によらなければ
  rationale: 省略を含む句を、「強い手」だけが王を動かすという文脈上有力な意味に補って訳しつつ、出エジプト記に反復される「手」の比喩を保持した。
theological_decisions:
- issue: וְלֹא בְּיָד חֲזָקָה の省略的構文の解釈
  choice: 王は強い手によらなければイスラエルを行かせない
  alternative: 王は強い手をもってしてもイスラエルを行かせない
  rationale: 直後の20節では神がエジプトを打つことによって王が民を去らせると語られるため、圧倒的な力によってのみ王が屈するという理解を本文に採った。ただし、ヘブライ語の構文自体には別の取り方も可能なので脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「強い手」という原文の中心的比喩を保った。「わたし」は神の発話として平明かつ荘重さを損なわない表記とした。
