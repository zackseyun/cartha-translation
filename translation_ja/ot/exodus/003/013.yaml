source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: ja
  text: モーセは神に言った。「私がイスラエルの子らのもとへ行って、『あなたがたの父祖の神が、私をあなたがたのもとに遣わされた』と言うと、彼らが私に、『その名は何ですか』と言ったら、私は彼らに何と答えればよいでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה אָנֹכִי בָא
  choice: 今、私が……行き、……と言うとします
  rationale: הִנֵּהは注意喚起だけでなく、想定場面を提示する働きをする。日本語で不自然な「見よ」を避け、モーセがこれから起こり得る場面を神に示す流れを明確にした。בָאは文脈上、イスラエルの子らのもとへ「行く」とした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 民族共同体を表す伝統的な呼称を保ちつつ、現代日本語で理解できる形にした。
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: あなたがたの父祖の神
  rationale: אבותはここではイスラエルの先祖たちを指す。「父たち」より自然で、族長との歴史的連続性も保つ「父祖」を選んだ。
- source_word: מַה שְּׁמוֹ
  choice: その方の名は何というのか
  rationale: 直訳的な「彼の名は何か」より自然な問いとしつつ、「名」が単なる呼称以上の意味を帯び得る原文の余地を残した。
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: 私は彼らに何と答えればよいでしょうか
  rationale: 原文は直訳すると「私は彼らに何と言おうか」。直前の問いへの応答を求める文脈を自然な現代日本語で表した。
theological_decisions:
- issue: 神の「名」を尋ねる問いの含意
  choice: 「その方の名は何というのか」と訳し、説明を本文に加えない
  alternative: 「その方はどのような神なのか」と解釈的に訳す
  rationale: שֵׁםは呼称だけでなく権威や性質を含意し得るが、この節だけで意味を一つに限定せず、次節の神の自己啓示へつながる曖昧さを保った。
- issue: אֱלֹהִיםの表現
  choice: 神
  alternative: 神なる方／その神
  rationale: モーセが語りかけている相手を日本語で明瞭に示し、特定の教派的解釈を付加しない標準的な表現とした。
translation_notes:
  register: 明瞭で現代的かつ敬意ある会話文。神への問いなので「でしょうか」を用いた。引用が重なる構造は原文どおり保持し、冗長になりすぎないよう整えた。
