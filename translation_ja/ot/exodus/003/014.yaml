language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: ja
  text: 神はモーセに言われた。「わたしは、わたしである[a]。」また言われた。「イスラエルの子ら[b]にこう言いなさい。『「わたしはある」が、わたしをあなたがたのもとへ遣わされた』と。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしは、わたしがなる者となる」または「わたしは、わたしがなるものとなる」とも訳せる。ヘブライ語の動詞は、ここでは現在の意味にも未来の意味にも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「イスラエルの子ら」は、イスラエル人を指すヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: この物語では、形は複数形でもイスラエルの神を指す単数の呼称として機能しているため、現代日本語で自然な「神」とした。
- source_word: אֶהְיֶה
  choice: わたしはある
  rationale: היה の未完了形一人称単数で、文脈により現在と未来の双方の含みを持ちうる。本文では自己提示と、続く神的呼称としての反復を示すため「わたしはある」とし、未来の可能性は脚注に残した。
- source_word: אֲשֶׁר
  choice: という者
  rationale: 自己を指す関係表現を、日本語で理解可能かつ荘重な「『わたしはある』という者である」という形にした。「何であれ」などと意味を限定しすぎないようにした。
- source_word: כֹּה
  choice: こう
  rationale: 伝えるべき文言を導入する定型表現として、現代日本語で自然な「こう」を用いた。
- source_word: תֹאמַר
  choice: 言いなさい
  rationale: ここでの二人称男性単数未完了形はモーセへの指示を表すため、明確な命令表現とした。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: בְּנֵי の字義を保ちつつ、日本語として理解できる表現にした。共同体全体を指す慣用的な意味は脚注で示した。
- source_word: שְׁלָחַנִי
  choice: 私をあなたがたのもとに遣わされた
  rationale: 完了した派遣と、その委任が現在にも及ぶことを自然な日本語で表した。神への敬意を示す主語敬語として「遣わされた」を用いた。
- source_word: וַיֹּאמֶר
  choice: 言われた／また言われた
  rationale: 物語の継起を保ち、同じ話者による発言の展開を「また」で自然に接続した。
theological_decisions:
- issue: 神の自己提示 אֶהְיֶה אֲשֶׁר אֶהְיֶה の訳
  choice: わたしは『わたしはある』という者である
  alternative: わたしは、わたしがなる者となる／わたしは、わたしがいる者としている
  rationale: ヘブライ語未完了形が持つ現在的・未来的な幅を一つに決め切ることはできない。本文では直後に אֶהְיֶה が呼称のように反復される点を生かして現在形の自己提示とし、未来的な読みも脚注で明示した。
- issue: אֶהְיֶה を神的呼称としてどう示すか
  choice: かぎ括弧で「わたしはある」と示す
  alternative: 通常の叙述として、わたしはある、とする
  rationale: 日本語には英語の大文字表記に相当する仕組みがないため、かぎ括弧と「という方」によって、後半で呼称として反復されていることを示した。これを独立した固有名と断定することは避けた。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の自己提示にふさわしい荘重さを保った。一人称は、神の発言では「わたし」、モーセが引用する発言では話者の区別を見やすくするため「私」と表記した。
