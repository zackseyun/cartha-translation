revisions:
- from: ヤハウェ[a]は、モーセが見ようとして道をそれたのをご覧になった。神は柴[b]の中から彼に呼びかけて言われた。「モーセ、モーセ。」彼は答えた。「はい、ここにおります。」
  to: ヤハウェ[a]は、モーセが見るためにわきへそれたのをご覧になった。神は柴[b]の中から彼に呼びかけ、「モーセ、モーセ」と言われた。彼は答えた。「ここにおります。」
  rationale: 神名と神称の区別、茂みの内部からの呼びかけ、名前の反復、モーセの応答という原文の構成を維持した。目的を表す לִרְאוֹת と「わきへそれる」という סָר の意味を明瞭にし、原文に明示されない「はい」を除いた。脚注アンカーはそれぞれ「ヤハウェ」と「柴」に適切に対応している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:58Z'
