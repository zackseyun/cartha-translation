source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: ja
  text: ヤハウェ[a]は、モーセが見るためにわきへそれたのをご覧になった。神は柴[b]の中から彼に呼びかけ、「モーセ、モーセ」と言われた。彼は答えた。「ここにおります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語本文に記された神の固有名。伝統的に「主」とも訳される。
    reason: alternative_reading
  - marker: b
    text: 「柴」は、いばらのある低木を指す可能性もある。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を表す四文字語を音写し、同じ節にある אֱלֹהִים（「神」）との区別を保った。
- source_word: וַיַּרְא
  choice: ご覧になった
  rationale: ראה の基本的な視覚の意味を保ちつつ、神を主語とする自然で敬意ある日本語とした。
- source_word: כִּי סָר לִרְאוֹת
  choice: 見ようとして道をそれたのを
  rationale: כִּי を知覚内容として表し、סור の「それる」と目的を示す不定詞 לִרְאוֹת の双方を明示した。
- source_word: וַיִּקְרָא אֵלָיו
  choice: 彼に呼びかけて
  rationale: קרא と אֶל の組み合わせが示す、相手に向けて声をかける意味を自然に表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 一般的な神称として訳し、直前の固有名「ヤハウェ」との原文上の違いを残した。
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: 柴の中から
  rationale: מִתּוֹךְ の空間的な意味を簡潔に保った。「柴」はこの場面の灌木を表す、現代日本語でも理解可能な聖書的表現である。
- source_word: מֹשֶׁה מֹשֶׁה
  choice: モーセ、モーセ
  rationale: 名前の反復をそのまま保ち、強い個人的な呼びかけを伝えた。
- source_word: הִנֵּנִי
  choice: はい、ここにおります
  rationale: 話者の所在と応答する用意を表す定型句を、過度に服従の意味へ限定せず、自然で敬意ある日本語にした。
theological_decisions:
- issue: 同じ節における יְהוָה と אֱלֹהִים の訳し分け
  choice: יְהוָה を「ヤハウェ」、אֱלֹהִים を「神」とする
  alternative: יְהוָה を「主」とする、または両方を「神」とする
  rationale: 原文が近接して用いる固有名と神称の違いを透明に保ち、両者を同一の訳語に平板化しないため。
- issue: 最後の וַיֹּאמֶר の話者
  choice: 「彼は答えた」とし、モーセを指すものとして訳す
  alternative: 「モーセは答えた」と名前を補う
  rationale: 直前にモーセが呼びかけられているため指示対象は明瞭である。「答えた」は対話の流れを自然に示すが、新たな解釈内容は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発話場面にふさわしい簡潔で荘重な調子を保った。原文の「呼びかけて言った」に対応する連続動作も残し、固有名と神称の区別を明示した。
