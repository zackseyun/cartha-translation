  naturalness: 全体として明瞭で自然である。「見るためにわきへそれた」とすると現代日本語としても自然で、モーセが観察するために進路を変えたことが明確になる。発話の導入は引用を一続きにして整える。
  terminology: 「ヤハウェ」と「神」の訳し分けは原文の יְהוָה と אֱלֹהִים の区別をよく保っている。「柴」はこの文脈で定着した訳語であり、低木・いばらの可能性は注で補えている。
