source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: ja
  text: モーセは、義父で、ミディアンの祭司であるエトロの群れを飼っていた。彼は群れを荒野の向こうへ[a]導き、神の山、ホレブに来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「荒野の向こう側へ」。
    reason: אַחַר הַמִּדְבָּר の空間的表現には「荒野の向こうへ」と「荒野の向こう側へ」のいずれも可能であるため。
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: モーセは
  rationale: 接続詞は新しい場面への移行を示すが、日本語では文脈上、明示的な「さて」を加えずとも自然に表せる。
- source_word: הָיָה רֹעֶה
  choice: 飼っていた
  rationale: 過去に継続していた牧羊の動作を、自然な現代日本語で表す。
- source_word: צֹאן
  choice: 群れ
  rationale: 羊や山羊などの小家畜を集合的に指す語であり、文脈では簡潔な「群れ」が自然である。
- source_word: יִתְרוֹ
  choice: エトロ
  rationale: 日本語聖書で広く用いられる慣用的な人名表記を採る。
- source_word: חֹתְנוֹ
  choice: しゅうと
  rationale: 婚姻関係にある男性親族を指し、この文脈ではモーセの義父を表す。平易さを優先して平仮名で表記する。
- source_word: כֹּהֵן מִדְיָן
  choice: ミディアンの祭司
  rationale: 連語の関係を直接に示し、エトロの身分を明確にする。
- source_word: וַיִּנְהַג
  choice: 導き
  rationale: 群れを移動させる意味を自然に表し、「追い立てる」という不要な強い含意を避ける。
- source_word: אַחַר הַמִּדְבָּר
  choice: 荒野の向こうへ
  rationale: 空間的な「後ろ／向こう側」の意味を保ちつつ、「西」と限定しない。
- source_word: וַיָּבֹא
  choice: 来た
  rationale: 物語の視点に沿って、到来を表す基本的な訳語を用いる。
- source_word: הַר הָאֱלֹהִים
  choice: 神の山
  rationale: 原文の連語を簡潔かつ直接的に訳し、その山がいつ、どの意味で神に属するものと認識されたかは説明によって限定しない。
- source_word: חֹרֵבָה
  choice: ホレブに
  rationale: 地名に方向を示す語尾が付いているため、目的地を示す助詞「に」で表す。
theological_decisions:
- issue: הַר הָאֱלֹהִים が、すでに聖なる山と認識されていたことを示すのか、後の出来事を見越した呼称なのか
  choice: 神の山
  alternative: 聖なる山
  rationale: 原文を直接に表し、回顧的・先取り的・既成の呼称のいずれかに解釈を固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しゅうと」は一般読者の読みやすさを考慮して平仮名とし、叙述は簡潔に整えた。
