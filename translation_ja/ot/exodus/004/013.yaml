  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: ja
  text: しかしモーセは言った[a]。「どうか、主よ、あなたがお遣わしになる者を通して、お遣わしください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（意味を明確にした訳）「どうか、主よ、ほかの人を遣わしてください。」
    reason: 原文の慣用的で回避的な言い方を文脈に即して明示する別訳。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかしモーセは言った
  rationale: 物語を進める接続形だが、神の答えを受けてもなおモーセが抵抗する文脈上、逆接の「しかし」が適切。日本語では話者を明示して自然な叙述とした。
- source_word: בִּי
  choice: どうか
  rationale: 敬意ある呼びかけに先立つ嘆願の慣用表現であり、現代日本語で自然な懇願を表す。
- source_word: אֲדֹנָי
  choice: 主よ
  rationale: 神に対する畏敬を込めた直接の呼びかけ。神名 יהוה ではないため、呼格として簡潔に「主よ」とした。
- source_word: שְׁלַח־נָא
  choice: お遣わしください
  rationale: 命令形と嘆願の小辞を、敬意と懇願を表す自然な尊敬語・丁寧表現で訳した。
- source_word: בְּיַד
  choice: …の手によって
  rationale: 行為の担い手を示すヘブライ語の比喩を保ちつつ、日本語でも理解できる表現とした。
- source_word: תִּשְׁלָח
  choice: あなたがお遣わしになる者
  rationale: 直訳的な「あなたがお遣わしになる者」を採り、文脈上の「ほかの人」という解釈を本文で明示せず、原文の回避的な曖昧さを保持した。
theological_decisions:
- issue: モーセの回避的な願いの解釈
  choice: 「あなたがお遣わしになる者の手によって、お遣わしください」と原文の曖昧さを残す。
  alternative: 「どうか、ほかの人を遣わしてください。」
  rationale: 文脈上はモーセが自分以外の者を求めていると理解できるが、ヘブライ語本文には「ほかの」という語がない。本文ではその緊張を保ち、解釈的な読みを脚注に示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神への発話には「お遣わしになる」「お遣わしください」を用いて敬意を表した。本文はヘブライ語の反復と曖昧さを可能な限り保つ。
