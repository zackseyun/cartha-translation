base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: ja
  text: ヤハウェはアロンに言われた。「荒野へ行って、モーセに会いなさい。」そこで、アロンは出かけ、神の山でモーセに会い、彼に口づけした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示す。
- source_word: לֵךְ
  choice: 行って
  rationale: הלךの命令形を、後続する目的表現と自然につながる簡潔な日本語にした。
- source_word: לִקְרַאת
  choice: 迎えなさい
  rationale: לקראתは相手の方へ出向いて会うことを表すため、単なる「会う」より方向性を保つ「迎える」とした。
- source_word: הַמִּדְבָּרָה
  choice: 荒野へ
  rationale: 方向を示す語尾־ָהを反映し、荒野を移動の目的地として訳した。
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: モーセに会い
  rationale: פגשの物語文脈での自然な意味を「会う」とし、日本語で指示対象を明確にするため代名詞を固有名で表した。
- source_word: בְּהַר הָאֱלֹהִים
  choice: 神の山で
  rationale: ヘブライ語の連語を簡潔に保持し、出会いが起きた場所として助詞「で」を用いた。
- source_word: וַיִּשַּׁק לוֹ
  choice: 口づけした
  rationale: נשקの動作を説明的な意味づけを加えず、品位ある現代日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を保持し、称号への置換や別系統の伝統的音写を避けた。
- issue: 「神の山」の解釈
  choice: 神の山
  alternative: 神聖な山／神が現れた山
  rationale: 原文の属格的表現が持つ幅を保ち、山の性質や由来を本文で限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」により物語の連続を示す。再会の口づけについて「挨拶として」などの説明は原文にないため補わない。
