revisions:
- from: ヤハウェはアロンに言われた。「荒野へ行って、モーセを迎えなさい。」そこでアロンは出かけて行き、神の山でモーセに会い、口づけした。
  to: ヤハウェはアロンに言われた。「荒野へ行って、モーセに会いなさい。」そこで、アロンは出かけ、神の山でモーセに会い、彼に口づけした。
  rationale: 「迎える」を、会見を表す「会う」に改め、命令の目的と荒野への移動を保持した。叙述では口づけの対象を補い、意味を変えずに指示関係を明瞭にした。原文および英語監査記録にある荒野への方向性と場所の構文上の幅は、日本語の「荒野へ行って」により過度に限定せず表現されている。
