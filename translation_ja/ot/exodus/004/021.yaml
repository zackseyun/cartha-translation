  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: ja
  text: 主はモーセに言われた。「エジプトへ戻るときには、わたしがあなたの手に授けたすべての不思議な業[a]を、必ずファラオの前で行いなさい。しかし、わたしは彼の心をかたくなにする[b]。彼は民を行かせない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しるし」または「奇跡」とも訳せる。原語は、神の力を示す驚くべき行為を指す。
    reason: lexical_alternative
  - marker: b
    text: 「彼の心を強くする」または「彼の心を固くする」とも訳せる。原語の動詞には「強くする」という意味があり、ここではファラオが頑強に拒み続けることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す四文字語を、日本語聖書で広く理解される敬称「主」で表した。一般読者に自然でありながら、神を指す名称としての重みを保つ。
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: エジプトへ戻るときには
  rationale: 前置詞を伴う不定詞構文を自然な時の節として訳し、方向を示す語尾は「へ」で表した。
- source_word: רְאֵה
  choice: 必ず……行いなさい
  rationale: 字義は「見よ」だが、ここでは後続する行為を確実に実行するよう命じる表現であるため、その勧告・命令の力を自然な日本語で示した。
- source_word: הַמֹּפְתִים
  choice: 不思議な業
  rationale: 神の力を示す非凡な行為を指す。「しるし」だけに意味を狭めず、驚異的な性格と行為性をともに伝える。
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: わたしがあなたの手に授けた
  rationale: モーセに委ねられ、実行する力が与えられたことを表す「手」の原語の比喩を、日本語でも理解できる形で残した。
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: ファラオの前で行いなさい
  rationale: ファラオの面前で実行するという公然たる場面を保ち、文脈上の命令として自然に表した。
- source_word: וַאֲנִי
  choice: しかし、わたしは
  rationale: 接続詞は形式上「そして」だが、モーセの行為から神の対照的な働きへ移る談話上の関係を「しかし」で明確にした。
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: 彼の心をかたくなにする
  rationale: חזקの使役形は「強くする」「固くする」の意味を持つが、ファラオ物語では拒絶に固執させることを表す。「かたくなにする」はその文脈上の意味を自然に伝える。
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: 彼は民を去らせない
  rationale: שׁלחの基本的な「送り出す」の意味と、民の出発を許さないという出エジプト記の文脈を簡潔に表した。
theological_decisions:
- issue: 神がファラオの心を強く／固くすること
  choice: わたしは彼の心をかたくなにする
  alternative: わたしは彼の心を強くする／固くする
  rationale: 原語は心を強くする、または固くするとも訳せるが、この物語ではファラオが拒絶を貫くことを指す。神の働きとファラオの責任との緊張を弱めたり説明で解消したりせず、本文の直接的な言い方を保った。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、神の発言としての威厳を保った。「不思議な業」「あなたの手に授けた」によって原文の具体的なイメージを残し、「心をかたくなにする」では神学的緊張を言い換えで弱めないようにした。脚注記号は該当語句の直後に置いた。
