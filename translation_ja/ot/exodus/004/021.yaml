- from: 主はモーセに言われた。「エジプトへ戻るときには、わたしがあなたの手に授けたすべての不思議な業[a]を、必ずファラオの前で行いなさい。しかし、わたしは彼の心をかたくなにする[b]。彼は民を去らせない。」
  to: 主はモーセに言われた。「エジプトへ戻るときには、わたしがあなたの手に授けたすべての不思議な業[a]を、必ずファラオの前で行いなさい。しかし、わたしは彼の心をかたくなにする[b]。彼は民を行かせない。」
  rationale: 末文のみを「民を行かせない」に改めた。これにより、原文の「民を送り出さない／出発を許さない」という意味を、明瞭で自然な現代日本語で表す。他の本文と脚注は原文に忠実であり、神がファラオの心をかたくなにするという緊張も説明によって弱めていない。
