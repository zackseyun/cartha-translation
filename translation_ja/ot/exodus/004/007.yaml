  text: וַ/יֹּ֗אמֶר הָשֵׁ֤ב יָֽדְ/ךָ֙ אֶל חֵיקֶ֔/ךָ וַ/יָּ֥שֶׁב יָד֖/וֹ אֶל חֵיק֑/וֹ וַ/יּֽוֹצִאָ/הּ֙ מֵֽ/חֵיק֔/וֹ וְ/הִנֵּה שָׁ֖בָה כִּ/בְשָׂרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: ja
  text: 彼は言った。「手をもう一度、懐[a]に入れなさい。」そこで彼は手を懐に戻した。彼が手を懐から出すと、見よ、その手は彼の肉のように元に戻っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 胸元にある衣の合わせやひだを指すとも考えられる。
    reason: cultural_note
  - marker: b
    text: すなわち、その手は通常の肌の状態に戻っていた。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: もう一度…入れなさい
  rationale: 使役形の命令が表す「元の場所へ戻す」という動作を、現代日本語で自然に表した。
- source_word: חֵיק
  choice: 懐
  rationale: 胸元、または胸元の衣の合わせ・ひだを指す語であり、手を差し入れる場所として簡潔かつ自然である。具体的な文化的意味は脚注で補った。
- source_word: וַיָּשֶׁב
  choice: 戻し
  rationale: 直前の命令に対応する反復動作を示し、手を先ほどの場所へ戻したことを表す。
- source_word: וַיּוֹצִאָהּ
  choice: そこから出すと
  rationale: 使役形の「外へ出す」を自然な日本語で表し、接尾代名詞が指す手を文脈上明らかなものとして扱った。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 予想外の結果へ注意を向ける提示表現の働きを、物語として自然でありながら驚きを残す形で表した。
- source_word: שָׁבָה
  choice: 元に戻り
  rationale: 手が以前の状態へ戻ったことを表す。受動的な「癒やされた」として神学的に解釈せず、原語の「戻る」を保った。
- source_word: כִּבְשָׂרוֹ
  choice: 彼の肌と同じになっていた
  rationale: 比較を示す כְּ と「肉・皮膚」を意味する בָּשָׂר を反映した。「ほかの皮膚」と補わず、原文の簡潔な比較を保った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、物語の荘重さを保った。「彼」はヘブライ語本文と同様に話者を明示せず、文脈に委ねている。「見ると」は וְהִנֵּה の注意喚起と驚きを、日本語として過度に古風にならない形で表す。
