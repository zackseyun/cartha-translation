- from: 彼は言った。「手をもう一度懐[a]に入れなさい。」そこで彼が手を懐に戻し、そこから出すと、見ると、その手は元に戻り、彼の肌と同じになっていた[b]。
  to: 彼は言った。「手をもう一度、懐[a]に入れなさい。」そこで彼は手を懐に戻した。彼が手を懐から出すと、見よ、その手は彼の肉のように元に戻っていた[b]。
