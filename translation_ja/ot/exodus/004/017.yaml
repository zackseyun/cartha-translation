  text: וְ/אֶת הַ/מַּטֶּ֥ה הַ/זֶּ֖ה תִּקַּ֣ח בְּ/יָדֶ֑/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה בּ֖/וֹ אֶת הָ/אֹתֹֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/017.yaml
  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: ja
  text: この杖[a]を手に取りなさい。あなたはそれを使って、しるし[b]を行う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「棒」。ヘブライ語は杖にも棒にも使われるが、ここではモーセが羊飼いとして用いていたものなので「杖」とした。
    reason: lexical_alternative
  - marker: b
    text: 文脈上は「奇跡のしるし」を指す。ヘブライ語そのものは単に「しるし」としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: （文脈上、独立した訳語を置かない）
  rationale: 接続詞は直前の命令とのつながりを示すが、日本語では新たな命令文として自然につなげられる。目的格標識 אֵת は訳出しない。
- source_word: הַמַּטֶּה הַזֶּה
  choice: この杖
  rationale: מַטֶּה は杖または棒を指す。モーセが羊飼いとして用いていた文脈に「杖」がよく合い、指示詞と定冠詞は「この」で自然に表せる。
- source_word: תִּקַּח בְּיָדֶךָ
  choice: 手に取りなさい
  rationale: 未完了形はここで命令の機能を持つ。「手に取りなさい」は בְּיָדֶךָ を含め、明瞭で自然な命令表現となる。
- source_word: אֲשֶׁר ... בּוֹ
  choice: それを使って
  rationale: 関係節は杖がしるしを行う手段であることを示す。日本語では文を分けて「それを使って」とすることで、道具・手段の意味を明確かつ自然に表せる。
- source_word: תַּעֲשֶׂה
  choice: 行う
  rationale: עָשָׂה は広く「する、行う」の意。目的語が「しるし」であるため、「行う」が現代日本語として自然であり、原文以上の説明を加えない。
- source_word: הָאֹתֹת
  choice: しるし
  rationale: אוֹת は確認や証拠となる「しるし」を指す。定冠詞は既出のしるしを受ける文脈から理解できるため、日本語では簡潔に「しるし」とする。「奇跡的な」は文脈上可能だが、原文に明示されない。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準語。「あなた」を明示しつつ、命令は「取りなさい」とした。長い関係節を避けて二文に分け、杖が手段であることを自然に示した。
