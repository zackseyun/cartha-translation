base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: ja
  text: もし彼らがあなたを信じず、最初のしるしの声に耳を傾けないなら、後のしるしの声を信じるようになる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「後のしるし」は、「最後のしるし」とも訳せる。ヘブライ語の語には両方の意味があり得るが、ここでは、さらに別のしるしが続かないとは限らないため「後の」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: もし…なら
  rationale: 未来の条件とその帰結を導くヘブライ語の構文を、自然な現代日本語の条件文で表した。
- source_word: יַאֲמִינוּ לָךְ
  choice: あなたを信じる
  rationale: ヒフィル形の אמן と前置詞 ל の組み合わせは、ここではモーセの言葉を真実として受け入れる意味である。
- source_word: יִשְׁמְעוּ לְקוֹל
  choice: 声に耳を傾ける
  rationale: 単なる聴覚的な『聞く』よりも、証言を受け止める含意を示しつつ、『しるしの声』という原文の擬人的な比喩を保持した。
- source_word: הָאֹת
  choice: しるし
  rationale: אוֹת の基本的な意味を保ち、原文に明示されない『奇跡』を本文へ付加しなかった。
- source_word: הָרִאשׁוֹן
  choice: 最初の
  rationale: רִאשׁוֹן の順序を示す通常の意味を明確に表す。
- source_word: וְהֶאֱמִינוּ
  choice: 耳を傾け、信じるようになる
  rationale: 条件文の帰結として未来の受容を表した。日本語では『声には耳を傾け、信じる』と補うことで、しるしの声を信じるという原文の意味を自然に伝える。
- source_word: הָאַחֲרוֹן
  choice: 後の
  rationale: אַחֲרוֹן が持つ『後の／最後の』という幅のうち、次節にさらに別のしるしが示される可能性を踏まえ、最終性を断定しない表現を採用した。
