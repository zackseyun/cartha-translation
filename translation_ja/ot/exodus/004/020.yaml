    issue: 「そのろば」の指示性
    rationale: ヘブライ語の定冠詞を機械的に「その」とすると、日本語では未導入の対象を指すように響く。ここでは「ろば」とするのが自然で、意味を損なわない。
  - severity: low
    issue: 脚注aが本文とほぼ同一の言い換えになっている
    rationale: 「彼らをそのろばの上に乗せ」は本文の「彼らをそのろばに乗せ」と実質的に同じであり、代替訳としての有用性が低い。ヒフィルの使役を明示する「彼らをろばに乗らせた」を示すほうがよい。
