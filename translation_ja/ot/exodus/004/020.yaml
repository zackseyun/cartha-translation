  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: ja
  text: そこでモーセは妻と息子たちを連れ、ろばに乗せ[a]、エジプトの地へ戻った。そしてモーセは神の杖[b]を手に取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らをろばに乗らせた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「神の棒」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... אֶת־אִשְׁתּוֹ וְאֶת־בָּנָיו
  choice: 妻と息子たちを連れ
  rationale: לקחの基本義は「取る」だが、人を旅に同行させる文脈では「連れる」が自然である。בָּנָיוは男性複数なので、一般化せず「息子たち」とした。
- source_word: וַיַּרְכִּבֵם עַל־הַחֲמֹר
  choice: 彼らをそのろばに乗せ
  rationale: רכבのヒフィル形が表す使役の意味を「乗せ」で簡潔に示した。定冠詞を伴うחֲמוֹרは、文脈中の乗用動物を指すものとして「そのろば」とした。
- source_word: וַיָּשָׁב אַרְצָה מִצְרָיִם
  choice: エジプトの地へ帰った
  rationale: שׁובはここでは「帰る、戻る」。אַרְצָהの方向を表す語尾とמִצְרַיִםを反映し、「エジプトの地へ」とした。
- source_word: מַטֵּה הָאֱלֹהִים
  choice: 神の杖
  rationale: מַטֶּהは杖または棒を指すが、モーセが携え、しるしに用いる物として現代日本語では「杖」が自然である。属格関係を「神の」と明示した。
- source_word: בְּיָדוֹ
  choice: 手に取った
  rationale: 直訳的な「彼の手に」を、לקחとの結び付きを保ちながら自然な日本語の動作表現にした。
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִיםにおけるהָאֱלֹהִיםの解釈
  choice: 神の杖
  alternative: 神的な杖
  rationale: 直前の召命としるしの文脈では、特定の神、すなわちモーセを遣わした神との関係を表すのが自然であり、抽象的な「神的な」より「神の」が原文の属格表現をよく保つ。
translation_notes:
  register: 明快で現代的な標準日本語を用い、物語の順序を「そこで」「そして」で示した。「妻」「息子たち」「エジプトの地」「神の杖」といった原文の具体的表現を保持しつつ、移動に伴うלקחは自然な「連れ」とした。
