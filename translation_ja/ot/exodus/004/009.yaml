source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: ja
  text: もし彼らが、この二つのしるしさえ信じず、あなたの声に聞き従わないなら[a]、あなたはナイル川の水を少し取り、乾いた地面に注ぎなさい。あなたがナイル川から取る水は、乾いた地面で血となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたの声を聞かない」。ここでは、あなたの言葉を受け入れ、それに従うことを指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「血に変わる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: たとえ…としても
  rationale: 後続する גַּם と否定条件が、先の二つのしるしでも信じない場合を段階的に想定しているため、現代日本語で自然な譲歩的条件として表した。
- source_word: יַאֲמִינוּ גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: この二つのしるしを信じず
  rationale: אמן のヒフィルを「信じる」、אוֹת を出エジプト記の文脈に即して「しるし」とした。גַּם の強調は条件構文全体の「たとえ…としても」で表現した。
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: あなたの声に聞き従わない
  rationale: שׁמע לְקוֹל は単なる聴覚ではなく、言葉を受け入れて従うことを含む慣用句である。「声」を残しつつ意味を明確にした。
- source_word: מִמֵּימֵי הַיְאֹר
  choice: ナイル川の水をいくらか
  rationale: 部分を示す מִן を「いくらか」で表し、出エジプト記における יְאֹר を「ナイル川」とした。
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: 乾いた地面
  rationale: 水との対比を保ち、実際に水を注ぐ場所として自然な日本語にした。原文の反復に合わせて二度とも同じ表現を用いた。
- source_word: וְשָׁפַכְתָּ
  choice: 注ぎなさい
  rationale: שפך の基本義を保ち、神からモーセへの指示として自然な命令表現にした。
- source_word: וְהָיוּ ... לְדָם
  choice: 血となる
  rationale: היה + לְ が示す結果・変化を簡潔かつ格調ある日本語で表した。
- source_word: דָם
  choice: 血
  rationale: 原語の直接的な意味をそのまま保持し、比喩化や弱化を避けた。
theological_decisions:
- issue: ナイル川の水が血になるしるしの性質
  choice: 「血となる」と、実際の変化として訳す
  alternative: 「血のように見える」「血の色になる」
  rationale: ヘブライ語の היה + לדם は無限定に結果として血となることを述べる。本文にない自然主義的説明や外見だけの変化を持ち込まない。
- issue: שׁמע לְקוֹל に含まれる応答の意味
  choice: 「声に聞き従う」と訳す
  alternative: 「声を聞く」「あなたの言うことを聞く」
  rationale: この慣用句は聞くことと従うことの双方を含み得るため、「声」を保持しながら文脈上の応答性を示した。ただし脚注で字義的な訳の可能性も明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「しるし」「血となる」など聖書本文にふさわしい簡潔で品位ある語調を保った。原文にある「乾いた地面」の反復も維持した。
