source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: ja
  text: わたしはあなたにこう言った。『わたしの子を行かせ、わたしに仕えさせよ。』しかし、あなたは彼を行かせることを拒んだ。見よ、わたしはあなたの子、あなたの長子を殺す。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: 去らせよ／去らせる
  rationale: ピエル命令形および不定詞で、「解放して行かせる」ことを求める文脈。日本語では対象を束縛から送り出す意味を保つため「去らせる」とした。
- source_word: וְיַעַבְדֵנִי
  choice: わたしに仕えさせよ
  rationale: עבד はここでは神への奉仕・礼拝を含みうる。「仕える」はその幅を保ち、目的を表す接続形を命令に連ねた。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 警告を際立たせ、目前の確実な行為へ注意を促す談話標識として、荘重だが理解可能な定訳を採用した。
- source_word: הֹרֵג
  choice: 殺す
  rationale: 分詞は切迫した、確定的な意図を表す。日本語では現在形「殺す」により、その直接性と脅威を保持した。
- source_word: בְּכֹרֶךָ
  choice: あなたの長子
  rationale: בכור の家族上の地位を簡潔かつ正確に表す。「初子」より現代の一般読者に明瞭な「長子」を選んだ。
theological_decisions:
- issue: 「わたしの子」と「あなたの子」の対置
  choice: 両方を単数の「子」として明示し、「あなたの長子」を同格で続けた
  alternative: 前者を集合的に「わたしの民」、後者を「初子」と訳す
  rationale: 原文の意図的な「わたしの子」対「あなたの子」という報復的対応と、イスラエルを神の子と呼ぶ比喩的・集合的表現を解釈で薄めないため。
- issue: 神の行為の時制・様相
  choice: 「わたしは…殺す」
  alternative: 「殺そうとしている」「殺すことになる」
  rationale: הִנֵּה と分詞の組み合わせが示す切迫性と確定性を保持しつつ、日本語で過度に説明的な様相を加えないため。
- issue: עבד の礼拝的含意
  choice: 「仕える」
  alternative: 「礼拝する」
  rationale: 語は礼拝を含みうるが、奉仕というより広い語義もあるため、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の厳粛な警告には「見よ」を用いて聖書本文としての品位を保った。引用内の命令と、その拒絶および裁きの宣告との対応が見える語順にした。
