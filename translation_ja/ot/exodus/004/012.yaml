  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: ja
  text: さあ、行きなさい。わたしがあなたの口と共にあり、あなたが語るべきことを教える。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: モーセの異議に対する応答から、直ちに行動を促す談話標識。日本語では「さあ」が自然に切迫感と移行を表す。
- source_word: לֵךְ
  choice: 行きなさい
  rationale: הלךのカル命令形。直接的な命令を、明瞭で品位ある現代日本語で表した。
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: このわたしが……共にいて
  rationale: 独立人称代名詞 אָנֹכִי の強調を「このわたしが」で示し、אֶהְיֶה の未完了形を文脈に即した将来的な約束として表した。
- source_word: עִם־פִּיךָ
  choice: あなたの口と共にいて
  rationale: 直訳的な身体表現を保ち、モーセの発話能力に神自身が臨在して支えるという本文の具体性を残した。
- source_word: וְהוֹרֵיתִיךָ
  choice: あなたに……教える
  rationale: ירהのヒフィル形はここでは指示し、教えることを表す。「教える」が後続する発話内容との関係を明瞭にする。
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: あなたが語るべきこと
  rationale: 神が教える発話内容を指す関係節。未完了形の将来性と、委託に伴う意図・務めを「べき」で簡潔に表した。
theological_decisions:
- issue: 召命における神の臨在と発話の保証
  choice: このわたしがあなたの口と共にいて
  alternative: わたしがあなたの話すのを助け
  rationale: 能力付与だけを説明する意訳にせず、神自身がモーセの「口」と共にいるという、具体的で神学的含意のある表現を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の直接命令と約束にふさわしい簡潔で品位ある調子とした。「口と共にいて」は日常表現としてはやや特異だが、原文の意図的な具体性を保つため採用した。
