base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: ja
  text: 旅の途中、宿泊地[b]で、ヤハウェは彼[a]に出会い、彼を殺そうとした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、この「彼」が誰であるか明示されていない。モーセを指すとも、別の解釈ではその息子を指すとも考えられている。
    reason: alternative_reading
  - marker: b
    text: 「夜営地」とも訳せる。原語は夜を過ごす場所を指し、必ずしも商業的な宿屋ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 〜でのことであった
  rationale: 新しい出来事を導入する物語上の働きを、古風すぎない自然な日本語で表した。
- source_word: בַדֶּרֶךְ
  choice: 旅の途中
  rationale: 移動中であることを簡潔かつ自然に示す。
- source_word: בַמָּלוֹן
  choice: 宿泊地
  rationale: 夜を過ごす場所を指し、現代的な商業施設としての「宿」を必ずしも意味しないため。
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: 彼に出会い
  rationale: פגע の基本的な意味を保ち、敵対的な含みは後続する「殺そうとした」によって示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: וַיְבַקֵּשׁ
  choice: 〜しようとした
  rationale: בקש がここで表す企図を明瞭な現代日本語にしつつ、行為が実現したとは述べない原文の緊張を保った。
- source_word: הֲמִיתוֹ
  choice: 彼を殺す
  rationale: מות のヒフィル形が表す「死なせる」を、直接的で明瞭な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の四文字神名を称号へ置き換えず、固有名として示した。
- issue: 三人称男性単数接尾辞の指示対象
  choice: 「彼」として曖昧さを保持
  alternative: モーセ、またはモーセの息子と明示する
  rationale: この節自体は対象者を明示していないため、解釈によって一人に限定しなかった。
- issue: ヤハウェの企図の表現
  choice: 彼を殺そうとした
  alternative: 彼を殺すことを求めた、彼の命を奪おうとした
  rationale: 神の行為を婉曲化せず、同時に未遂の企図として語る原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、物語としての重みを保った。「旅の途中、宿泊地でのことであった」という導入でヘブライ語の語順と場面転換を自然に反映し、代名詞の指示対象は本文で確定しないようにした。
