source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: ja
  text: そこでヤハウェはモーセに言った。「手を伸ばし、その尾をつかみなさい。」モーセが手を伸ばしてそれをしっかりつかむと、それは彼の手の中で杖[a]になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「棒」とも訳せる。
    reason: מַטֶּהには「杖」「棒」の意味があり、この箇所では「杖」を本文に採用したため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず一般的な日本語音写で示した。
- source_word: שְׁלַח יָדְךָ
  choice: 手を伸ばし
  rationale: 直訳的な「手を送り出す」ではなく、命じられた具体的動作を自然な現代日本語で表した。
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: その尾をつかみなさい
  rationale: אָחַזの具体的な把持動作と、直前の蛇を指す三人称男性単数接尾辞を明確に表した。前置詞בはここでは日本語の自然な目的語表現に含めた。
- source_word: וַיַּחֲזֶק בּוֹ
  choice: それをしっかりつかむと
  rationale: חזקのこの語形が示す、離さないよう強く保持する動作を「しっかり」で表し、命令中のאָחַזとの語の違いも反映した。
- source_word: וַיְהִי לְמַטֶּה
  choice: 杖になった
  rationale: 変化の文脈にあるהיהを「なった」とし、מַטֶּהはモーセが携える用具として自然な「杖」と訳した。
- source_word: בְּכַפּוֹ
  choice: 彼の手の中で
  rationale: כַּףは厳密には手のひらを指し得るが、ここでは保持している状態を自然に表す「手の中で」とした。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名として音写し、本文の区別を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の連続性を「そこで」で示し、命令とその遂行の対応を保った。英語相談層の脚注位置には内容上のずれが見られるため、原文に基づきמַטֶּהの訳語候補だけを該当箇所に付した。
