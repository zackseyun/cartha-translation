  text: וַ/יֵּ֨לֶךְ מֹשֶׁ֜ה וַ/יָּ֣שָׁב אֶל יֶ֣תֶר חֹֽתְנ֗/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ אֵ֣לֲכָה נָּ֗א וְ/אָשׁ֨וּבָה֙ אֶל אַחַ֣/י אֲשֶׁר בְּ/מִצְרַ֔יִם וְ/אֶרְאֶ֖ה הַ/עוֹדָ֣/ם חַיִּ֑ים וַ/יֹּ֧אמֶר יִתְר֛וֹ לְ/מֹשֶׁ֖ה לֵ֥ךְ לְ/שָׁלֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: ja
  text: それからモーセは行って、義父エテル[a]のもとに戻り、言った。「どうか、エジプトにいる私の兄弟たち[b]のもとへ帰らせてください。彼らがまだ生きているかどうか、確かめたいのです。」すると、イトロはモーセに言った。「平安のうちに行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節では、同じ人物の名が初めは「エテル」、後には「イトロ」という形で記されている。
    reason: textual_variant
  - marker: b
    text: 「兄弟たち」は、ここでは広く「同胞」または「親族」を指す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: それからモーセは……戻って
  rationale: 連続する物語叙述を自然な現代日本語で示しつつ、שׁוב の「戻る」という意味を保った。
- source_word: יֶתֶר / יִתְרוֹ
  choice: エテル／イトロ
  rationale: 同じ人物を指す二つの名形を、原文どおり区別して音写した。読者が別人と誤解しないよう脚注を付した。
- source_word: חֹתְנוֹ
  choice: しゅうと
  rationale: 文脈上、モーセの妻の父を指す。現代日本語で理解でき、関係を簡潔に表す語を選んだ。
- source_word: אֵלֲכָה נָּא וְאָשׁוּבָה
  choice: どうか……帰らせてください
  rationale: 二つの意志形と נָא が表す、しゅうとに許しを求める丁重な願いを自然な日本語にした。
- source_word: אַחַי
  choice: 私の兄弟たち
  rationale: 原語の字義を本文に残した。より広く同胞や親族を指し得ることは脚注で示した。
- source_word: וְאֶרְאֶה הַעוֹדָם חַיִּים
  choice: 彼らがまだ生きているかどうか、確かめたい
  rationale: 「見る」がこの文脈では安否を確認することを意味するため、「確かめる」とした。「かどうか」により原文の不確かさを保持した。
- source_word: לֵךְ לְשָׁלוֹם
  choice: 安心して行きなさい
  rationale: 許可と好意ある送り出しを表すヘブライ語の慣用句を、自然な現代日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、会話には丁重さを持たせた。固有名の二つの形と「兄弟たち」の意味の幅は、本文と脚注で原文に即して保持した。
