  - severity: low
    issue: 後半の受動表現が命令の授受をやや不明瞭にする
    rationale: אֲשֶׁר צִוָּהוּ は文脈上、ヤハウェがモーセにしるしを行うよう命じたことをいう。「ヤハウェがモーセに行うよう命じた」とすると、原文の人称関係を明瞭に保てる。
  - severity: low
    issue: 脚注の代替訳を「ことば」に係る読みとしてより正確に表現する必要がある
    rationale: 代替的統語では、ヤハウェがモーセを遣わす際／そのために託したことば、という意味合いである。「告げた」より「託した」が派遣の委任内容という文脈をよく表す。
