source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: ja
  text: モーセは、モーセを遣わしたヤハウェのことばをすべて[a]、また、ヤハウェがモーセに行うよう命じたしるしをすべて、アロンに告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェが彼を遣わす際に託したことばをすべて」。ヘブライ語の関係節は「ことば」と密接に結び付けて読むこともできるが、いずれの読みでも、ヤハウェがモーセを遣わしたという意味は変わらない。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告げた
  rationale: ヒフィル形の「知らせる、語り伝える」という意味を、簡潔で品位ある現代日本語で表した。
- source_word: דִּבְרֵי יְהוָה
  choice: ヤハウェのことば
  rationale: דָּבָר の複数形を「ことば」とし、モーセが受けた神の委任の内容を伝えたことを保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神名を音写した。
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: 自分を遣わした
  rationale: 関係節をヤハウェに係るものとして自然な日本語にした。「自分」はモーセを指す。別の統語的理解は脚注に示した。
- source_word: הָאֹתֹת
  choice: しるし
  rationale: 出エジプト記で神の力を示す行為を指す語だが、「奇跡的な」を補わず、原語の簡潔さを保った。
- source_word: אֲשֶׁר צִוָּהוּ
  choice: ヤハウェから行うよう命じられた
  rationale: 直訳的な「命じられたしるし」は日本語では不自然なため、しるしを行うことが命令の内容であるという文脈上の含意を明示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の神名を称号に置換せず、そのまま識別できる形で示した。
- issue: אֲשֶׁר שְׁלָחוֹ の係り先
  choice: 「自分を遣わした」をヤハウェに係らせる
  alternative: 「彼を遣わすにあたって告げたことば」として「ことば」に密接に係らせる
  rationale: 直前のヤハウェを先行詞とする読みが自然だが、ヘブライ語では「ことば」と密接に結び付ける余地もあるため、本文で一方を採り、別解を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御言葉」のような教会的な定型表現を避け、「ことば」とした。「しるし」は聖書文脈で理解可能な簡潔な語として平仮名表記にした。
