  source_fidelity: ヘブライ語本文の主要要素を忠実に反映している。יַהְוֶהは「ヤハウェ」と音写され、場所句「ミディアンで」、二つの命令 לֵךְ／שֻׁב、帰還先「エジプトへ」、理由を示す כִּי、死亡した者たち、そして「あなたの命を狙っていた」という慣用表現が適切に訳出されている。「男たちは皆」は הָאֲנָשִׁים の男性的・特定的な指示を保つ。
