language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: ja
  text: ヤハウェはミディアンでモーセに言われた。「行って、エジプトへ帰りなさい[a]。あなたの命を狙っていた男たちは皆、死んだからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エジプトへ帰りなさい」とも訳せる。ヘブライ語には二つの命令形があり、直訳すると「行け、エジプトへ帰れ」となる。
    reason: 二つの命令動詞を保つ直訳と、自然な日本語にまとめる訳の違いを示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める標準的な発言動詞。神を主語とするため、現代日本語として自然な敬語表現にした。
- source_word: בְּמִדְיָן
  choice: ミディアンで
  rationale: 前置詞בの場所を表す意味を、自然な日本語の格助詞「で」で示した。
- source_word: לֵךְ שֻׁב
  choice: 行って、…帰りなさい
  rationale: 二つの命令動詞を両方とも訳し、移動を促すלֵךְと帰還を命じるשֻׁבを保持した。日本語としての可読性を保つため、前者を接続形にした。
- source_word: מִצְרָיִם
  choice: エジプトへ
  rationale: 文脈上の移動先を、方向を示す「へ」で明確にした。
- source_word: כִּי
  choice: …からだ
  rationale: 命令の理由を導く因果関係を、明瞭な現代日本語で表した。
- source_word: מֵתוּ
  choice: 死んだ
  rationale: 完了した死と、その結果として現在も脅威がなくなったことを自然に伝える。
- source_word: כָּל הָאֲנָשִׁים
  choice: 男たちは皆
  rationale: אֲנָשִׁיםの男性複数という具体性と、כָּלの全体性を保持した。
- source_word: הַמְבַקְשִׁים
  choice: 狙っていた
  rationale: 分詞の継続的な意味を保ちつつ、「命を求める」というヘブライ語の殺害意図を日本語で自然に表した。
- source_word: אֶת נַפְשֶׁךָ
  choice: あなたの命を
  rationale: נֶפֶשׁはこの慣用句では「魂」ではなく命そのものを指すため、「命」とした。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された神の固有名を称号で代用せず、音写して保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。神の発言には過度に古風な語尾を避けつつ敬語を用い、命令は「帰りなさい」とした。原文の二つの命令は本文と脚注の双方で見えるようにした。
