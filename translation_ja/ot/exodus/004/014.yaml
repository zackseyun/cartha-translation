source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: ja
  text: その時、ヤハウェはモーセに対して怒りを燃やし、言われた。「あなたの兄弟、レビ人アロンがいるではないか。わたしは彼がよく話せることを知っている。[a] しかも、見てみなさい。彼はあなたに会いに向かっている。彼はあなたを見ると、心から喜ぶだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼が流暢に話すことを知っている」または「彼が確かに話すことを知っている」。ヘブライ語では「話す」という動詞を重ねて強調している。
    reason: 原文の強意表現は、話す能力、流暢さ、または発話の確かさとして理解できるため。
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒りを燃やし
  rationale: 怒りが「燃える」というヘブライ語の比喩を保ちつつ、現代日本語として自然にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: הֲלֹא
  choice: いるではないか
  rationale: 肯定の答えを期待する修辞疑問の力を、自然な日本語で表した。
- source_word: הַלֵּוִי
  choice: レビ人
  rationale: アロンのレビ族への所属を示す標準的な訳語であり、ここで祭司職まで読み込まない。
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: わたしは、彼がよく話せることを知っている
  rationale: 不定詞独立形と定動詞の重複が強める発話能力を文脈に即して自然に表した。ただし「よく」が流暢さを明示する可能性があるため、別訳を脚注に示した。
- source_word: וְגַם הִנֵּה
  choice: しかも今
  rationale: 付加と注意喚起の機能を、過度に古風な「見よ」を避けて現代日本語で表した。
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: あなたに会うために出て来ている
  rationale: 分詞の進行中・目前という意味合いと、迎えに出る動きを表した。
- source_word: וְרָאֲךָ
  choice: 彼はあなたを見ると
  rationale: 後続する喜びの時を示す関係を、日本語の自然な条件・時間表現で示した。
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: 心から喜ぶだろう
  rationale: 心における内面的で真実な喜びを、明瞭で自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を直接用いているため、称号へ置換せず、一般的な学術的音写を採用した。
- issue: דַבֵּר יְדַבֵּר の強意の解釈
  choice: よく話せる
  alternative: 確かに話す、流暢に話す
  rationale: モーセが自分は話し下手だと訴えた直前の文脈では、アロンの発話能力を指すと理解するのが自然である。一方、ヘブライ語自体は「流暢に」を明示しないため、脚注で曖昧さを保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「見よ」のような古風な命令表現は避けたが、怒りが「燃える」という原文の比喩は保持した。神の発話には敬語を過度に加えず、地の文の「言われた」で敬意と読みやすさを両立した。
