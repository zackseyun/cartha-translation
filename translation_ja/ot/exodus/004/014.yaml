  to: その時、ヤハウェはモーセに対して怒りを燃やし、言われた。「あなたの兄弟、レビ人アロンがいるではないか。わたしは彼がよく話せることを知っている。[a] しかも、見てみなさい。彼はあなたに会いに向かっている。彼はあなたを見ると、心から喜ぶだろう。」
