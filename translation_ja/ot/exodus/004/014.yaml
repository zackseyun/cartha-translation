  - severity: low
    issue: 「しかも今」
    rationale: וְגַם הִנֵּה は単なる時間の「今」ではなく、付加と注意喚起（「しかも、見よ／ほら」）を表す。「しかも、見てみなさい」として両機能を保つ。
