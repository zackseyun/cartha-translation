  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: ja
  text: そこでモーセとアロンは行って、イスラエルの子らの長老たちを皆集めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエル人」。伝統的には「イスラエルの子どもたち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 出かけ
  rationale: 物語を進めるהלךのワイイクトル形。二人の主語に先立つ単数形だが、文意上はモーセとアロンが共に行動したことを自然な日本語で表す。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: モーセとアロン
  rationale: 日本語聖書で広く定着している固有名詞の表記を用いた。
- source_word: וַיַּאַסְפוּ
  choice: 集めた
  rationale: ここでは人々を一か所に招集する意味。簡潔で自然な「集めた」が文脈に合う。
- source_word: כָּל זִקְנֵי
  choice: 長老を皆
  rationale: זִקְנֵיは単なる高齢者ではなく共同体の公認された指導者を指すため「長老」とし、כָּלの全体性を「皆」で示した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: イスラエル（ヤコブ）からの系譜を表すヘブライ語の親族表現を保持する。「子ら」は男性複数形を反映しつつ、現代日本語として読める表現である。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵלの訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人／イスラエルの子どもたち
  rationale: 民族名だけに平板化せず、イスラエル（ヤコブ）に連なる民という原文の系譜的・契約的含意を保つ。一方、本文の指示対象は民族共同体であるため、自然な代替訳を脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で直前の出来事を受ける物語上の連続を示し、「長老」は共同体の役職名として定着した語を用いた。
