id: EXO.4.30
reference: Exodus 4:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: ja
  text: アロンは、ヤハウェがモーセに語ったすべての言葉を語り、民の目の前で[a]しるしを行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「民の見ている前で」。
    reason: לְעֵינֵי הָעָם の意味を自然な日本語で言い換えた訳。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 語った
  rationale: ピエル形の基本的な意味「語る」を保ち、「すべての言葉」と自然に結び付けた。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: すべての言葉
  rationale: 「すべてのこと」と一般化せず、ヘブライ語の具体的な「言葉」を保持した。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: ヤハウェがモーセに語った
  rationale: 先にヤハウェがモーセへ語った内容を指す関係節として、明瞭で自然な日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を一般的な日本語表記で示した。
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: 広い意味を持つ動詞 עשה を、しるしを実行するという文脈に合う簡潔な日本語で表した。
- source_word: הָאֹתֹת
  choice: しるし
  rationale: 奇跡的・証明的な働きは文脈から理解できるため、「奇跡」と説明的に補わず、原語の語義の幅を保った。
- source_word: לְעֵינֵי הָעָם
  choice: 民の目の前で
  rationale: 「民が見ているところで」という意味を伝えつつ、「目の前で」というヘブライ語の視覚的な表現を保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が称号ではなく四文字神名を用いているため、神の固有名を音写して示した。
- issue: しるしを行った人物
  choice: アロンを主語として継続させる
  alternative: モーセがしるしを行ったと明示する
  rationale: ヘブライ語では後半にも主語が明記されていないが、直前の明示された主語はアロンであり、文法上はその継続として読むのが自然である。本文では主語を繰り返さず、原文のつながりを保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「語った」の反復は原文の דבר の反復を反映する。「民」は出エジプト記の共同体的な文脈に合い、「人々」よりも聖書本文として簡潔である。
