  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: ja
  text: あなたは彼に語り、これらの言葉を彼の口に置きなさい。わたしはあなたの口と彼の口と共にいる。あなたがた[a]が何をすべきかを教える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがた」は複数形で、モーセとアロンの二人を指す。
    reason: 原文のאֶתְכֶם（あなたがたを）とתַּעֲשׂוּן（あなたがたが行う）は、いずれも二人称複数形であることを明示するため。
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: あなたは彼に語り
  rationale: 接続詞付き完了形は、この指示の文脈では命令として機能する。「彼に語る」はדבר＋אלの意味を素直に表す。
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: その言葉を彼の口に置きなさい
  rationale: שׂיםの基本義「置く」と、発言内容を授ける「口に置く」というヘブライ語の具体的な表現を保った。定冠詞付きのהַדְּבָרִיםは、文脈を受ける「その言葉」とした。
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: わたしはあなたの口と彼の口と共にあり
  rationale: 神が二人の語る働きに臨在し、力を与えることを表す原文の身体的比喩を、そのまま理解できる日本語で保持した。
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: あなたがたが…教える
  rationale: ירהのヒフィル形は「教える、指示する」の意。目的語אֶתְכֶםが複数なので「あなたがた」と明示し、日本語では後続の内容節を先に置いて自然な語順にした。
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: 何をすべきか
  rationale: 関係表現אֲשֶׁרと二人称男性複数形の動詞を、指示の文脈に合う自然な日本語で表した。「すべき」は単なる未来予告ではなく、神が行動を教えるという文脈上の方向づけを示す。
theological_decisions:
- issue: 発話に対する神の助けを表す身体的比喩
  choice: 「わたしはあなたの口と彼の口と共にあり」と具体的表現を保持する。
  alternative: 「あなたにも彼にも、語るとき力を与える」
  rationale: 原文は神の臨在と発話への助力を「口と共にいる」と表す。説明的に言い換えず、その比喩と神学的含みを残した。
- issue: 後半の二人称の数
  choice: 「あなたがた」と複数を明示する。
  alternative: 「あなたたち二人」または単数にも見える「あなた」
  rationale: אֶתְכֶםとתַּעֲשׂוּןはいずれも複数形で、モーセとアロンを共に指す。日本語では「あなたがた」によってこの文法情報を自然に示せる。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「口に置く」「口と共にある」という原文の具体的表現は、意味を説明に置き換えず保持した。「彼」は直前の文脈におけるアロンを指す。
