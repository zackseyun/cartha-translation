  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: ja
  text: ヤハウェは彼に言った。「あなたの手にあるものは何か。」彼は言った。「杖です[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「棒」とも訳せる。ヘブライ語の מַטֶּה（マッテ）は、文脈により杖、棒などを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、一般的な学術的音写に基づいて表記した。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 言った……言った
  rationale: אמר の反復を保った。後半は文脈上返答だが、「答えた」と明示せず、原文の簡潔な語り方を反映した。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 代名詞を固有名に置き換えず、原文どおり「彼に」とした。
- source_word: מַה־זֶּה / מִזֶּה
  choice: それは何か
  rationale: 話し手が相手の手にある物を指してその正体を尋ねる表現として、明瞭で自然な日本語にした。
- source_word: בְּיָדֶךָ
  choice: あなたの手にある
  rationale: 物が実際に手にある場面を表すため、所有一般に広げず身体的な意味を保った。
- source_word: מַטֶּה
  choice: 杖
  rationale: この場面でモーセが手にしている物には「杖」が最も自然である。ただし語は文脈により「棒」なども指し得るため、脚注で語義の幅を示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 神の固有名を称号で代用せず音写しつつ、特定教派に固有の読みを持ち込まないため。
translation_notes:
  register: 明瞭な現代標準語を用い、会話の簡潔さと原文にある「言った」の反復を保持した。神への発話動詞にも過度な敬語を加えず、簡潔で品位ある叙述とした。
