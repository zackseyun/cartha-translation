source:
  edition: WLC
  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: ja
  text: 彼はあなたに代わって民に語る。そして、彼はあなたの口となり[a]、あなたは彼にとって神となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼はあなたにとって口となる」。アロンがモーセの代弁者として語ることを表す比喩。
    reason: lexical_alternative
  - marker: b
    text: 「あなたは彼にとって神のようになる」とも訳せる。モーセ自身が神になるという意味ではなく、神から言葉を受け、それをアロンに伝える権威ある代表者の役割を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: 彼はあなたに代わって民に語る
  rationale: דבר（ピエル）はここでは「語る」。לְךָは文脈上、アロンがモーセを代表して語ることを示すため、「あなたに代わって」とした。אֶל־הָעָםは自然に「民に」と訳した。
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: 彼はあなたの口となり
  rationale: פֶּהの「口」という比喩を保持した。「代弁者」と説明的に置き換えず、続く「神となる」との対応も残した。重ねられたהיהは役割の確実性を強めるが、日本語では冗長になるため一つの「となり」で表した。
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: あなたは彼にとって神となる
  rationale: ヘブライ語は明示的な比較語を用いず、直訳すれば「神となる」。強い役割比喩と原文の緊張を保つため本文では「神のようになる」と弱めず、「神となる」とした。ただし存在論的な神格化ではなく、神の言葉を受け渡す権威的・代表的役割であることを注で示した。
theological_decisions:
- issue: לֵאלֹהִיםがモーセ自身の神性を意味するか、それとも神から委ねられた代表的役割を意味するか
  choice: 本文では「神となる」と原文の強い表現を保ち、注で代表的役割を説明する
  alternative: 「神のようになる」または「神の代わりとなる」
  rationale: 出エジプト記4章15節の文脈では、モーセが神から受けた言葉をアロンに伝え、アロンがそれを民に語る。したがって機能的・代表的関係を指すが、本文に比較語を補って原文の表現を先回りして弱めることは避けた。
translation_notes:
  register: 明快で格調ある現代標準語。「民」「口」「神」という簡潔な語を用いて原文の並行する比喩を保持した。本文はヘブライ語の強い述語表現を残し、必要な解釈説明は脚注に限定した。
