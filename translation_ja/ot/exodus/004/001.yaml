base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: ja
  text: モーセは答えた。「しかし、彼らは私を信じず、私の声に耳を傾けないでしょう[a]。『ヤハウェ[b]はあなたに現れなかった』と言うからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私の声を聞かない」。この表現は「私の言うことを聞き入れない」または「私に従わない」という意味にもなり得る。
    reason: lexical_alternative
  - marker: b
    text: 神名「ヤハウェ」は、伝統的に「主」と訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: モーセは答えて言った
  rationale: ענהとאמרをともに反映し、対話における応答と発言を明示する。日本語としてやや定型的だが、原文の二動詞を保つ荘重な物語表現である。
- source_word: וְהֵן
  choice: しかし
  rationale: ここでは注意喚起の機能よりも、直前の神の言葉に対するモーセの異議を導く機能が中心であるため、自然な現代日本語で逆接を表した。
- source_word: לֹא יַאֲמִינוּ לִי
  choice: 彼らは私を信じず
  rationale: Hiphil形のאמןはここでモーセの主張を信用することを指す。「私を信頼する」より「私を信じる」が文脈に適する。
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: 私の声に耳を傾けない
  rationale: שמע בקולの「聞く・受け入れる・従う」という幅を残しつつ、ヘブライ語の「声」の比喩を保った。「従わない」だけでは服従の意味を強めすぎる。
- source_word: כִּי יֹאמְרוּ
  choice: と言うからです
  rationale: כִּיをモーセの懸念の理由として明確に示し、後続する発言を自然な日本語で結んだ。
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: あなたに現れなかった
  rationale: ראהのNiphal形を通常の「現れる」と訳した。完了形は、想定された発言中で過去の出来事を否定する自然な日本語とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文に記された神名YHWHを日本語で一般的な音写により示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、その区別を保つ。「主」は伝統的な代読に基づく訳として脚注に示した。
- issue: שמע בקול の意味範囲
  choice: 私の声に耳を傾けない
  alternative: 私の言うことに従わない
  rationale: この文脈では、モーセの報告を受け入れて従うことまで含み得るが、「従う」に限定せず、聞き入れることと服従との間の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、物語の荘重さを保つため「答えて言った」を採用した。モーセの異議は「しかし」で自然に導き、神名とヘブライ語特有の「声」の表現は本文に保持した。
