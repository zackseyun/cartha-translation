    issue: יהוהを「主」と訳している。
    rationale: 原文は称号ではなく神名を用いており、英語POBの決定もYahwehである。訳文でも固有名を保持する必要がある。
  - severity: low
    issue: נאを「さあ」としている。
    rationale: 「さあ」は命令を始める口語的な促しに寄り、ここでの丁寧な要請・促しを十分には反映しない。「どうか」が適切である。
  - severity: low
    issue: 「雪のようになっていた」が比喩の対象をやや曖昧にする。
    rationale: 原文は手の状態を雪になぞらえる。「雪のようだった」とすれば、手が雪そのものに変化したという含みを避けられる。
