source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: ja
  text: ヤハウェはさらにモーセに言われた。「どうか、手を懐に入れなさい。」モーセが手を懐に入れ、それを出すと、すると、その手はツァラアト[a]に冒され、雪のようだった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァラアト」は、旧約聖書で特定の皮膚や物の状態を指す語。現代のハンセン病と正確に同じものとは限らない。
    reason: 原語の指示範囲を現代の特定疾患と誤って同一視することを避けるため。
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す箇所として、日本語聖書で広く認識される荘重な表現を用いた。
- source_word: עוֹד
  choice: さらに
  rationale: ここでは、しるしに続いてもう一つの命令が加えられることを自然に示す。
- source_word: הָבֵא נָא
  choice: さあ、……入れなさい
  rationale: הָבֵא の「持って来る」を文脈に即して「入れる」とし、נָא の命令を促すニュアンスを「さあ」で表した。
- source_word: חֵיק
  choice: 懐
  rationale: 胸元の衣の内側や折り目を指す語であり、簡潔かつ自然に表せる。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 目の前に現れた驚くべき状態へ注意を向ける提示的・劇的な力を、現代日本語で自然に伝える。
- source_word: מְצֹרַעַת
  choice: ツァラアトに冒され
  rationale: 聖書上の特有の状態を現代のハンセン病や特定の皮膚疾患と同一視しないため、原語に基づく音写を用い、脚注で説明した。
- source_word: כַּשָּׁלֶג
  choice: 雪のようになっていた
  rationale: 原文は単に「雪のよう」と比較しており、「白い」を本文に補わず、その簡潔な比喩を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: 日本語としての荘重さと一般読者への理解しやすさを優先しつつ、神の固有名を表す伝統的な訳語を採用した。
- issue: מְצֹרַעַת が指す病態
  choice: ツァラアト
  alternative: 重い皮膚病／らい病
  rationale: この語が指す古代イスラエルの分類は現代医学の単一疾患と正確には一致しないため、特定の病名に断定せず曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「懐」「なんと」により物語の荘重さと劇的な提示を保った。「モーセ」は直前文脈から代名詞の指示対象を明確にするため補った。
