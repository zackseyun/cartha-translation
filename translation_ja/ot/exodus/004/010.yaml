  to: モーセはヤハウェに言った。「どうか、主よ。私は、昨日も一昨日も、またあなたがこの僕に語ってからも、言葉にたけた者ではありません[a]。私は口が重く、舌も重いのです[b]。」
  rationale: 現代日本語としての明瞭さを改善するため、「言葉の人」を自然な「言葉にたけた者」とした。その直訳的表現と、雄弁さに限定しない解釈の幅は脚注で保持した。また、神を主語に取る敬語受け身を簡潔な能動表現へ整えた。原文の反復的な時間表現、神名と称号の区別、僕という自己卑下、ならびに発話困難の比喩的・未特定の性格はすべて維持している。
