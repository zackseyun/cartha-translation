  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: ja
  text: モーセはヤハウェに言った。「どうか、主よ。私は、昨日も一昨日も、またあなたがこの僕に語ってからも、言葉にたけた者ではありません[a]。私は口が重く、舌も重いのです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「言葉の人ではありません」。話すことに巧みではない、雄弁ではない、という意味に解することができます。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「口が重く、舌も重い」。話すことの困難を表す比喩ですが、雄弁さの不足なのか、何らかの発話上の障害なのかは特定されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号の「主」に置き換えず音写した。直後の אֲדֹנָי は称号として「主」と訳し、両者を区別した。
- source_word: בִּי אֲדֹנָי
  choice: どうか、主よ
  rationale: בִּי を嘆願を表す間投詞として自然な日本語の「どうか」とし、אֲדֹנָי は呼びかけの称号「主よ」とした。
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: 私は……言葉の人ではありません
  rationale: 話す能力に関するヘブライ語の表現を保ち、「雄弁ではありません」と意味を限定しすぎないようにした。
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: 昨日も一昨日も
  rationale: 過去から現在まで話し上手ではなかったことを強調する対句的な時間表現を、原文の具体的な語像を残して訳した。
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: またあなたがこの僕に語られてからも
  rationale: 神がモーセに語り始めて以後も事情が変わらない、という時間的継続を表した。「この僕」は神へのへりくだった自己呼称として訳した。
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: 口が重く、舌も重い
  rationale: 「重い」という並行する比喩を保持し、雄弁さの不足、話すことの不得手、発話上の障害などのどれを指すかを断定しなかった。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文は称号ではなく神の固有名を用いているため、これを音写した。また同じ文中の אֲדֹנָי「主」との違いも保持できる。
- issue: モーセの話す困難の性質
  choice: 「言葉の人ではない」「口が重く、舌も重い」という比喩を保持する
  alternative: 「雄弁ではない」「言語障害がある」などと明示する
  rationale: 原文は困難の正確な性質を特定していないため、解釈によって曖昧さを解消せず、その緊張を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、神への呼びかけとモーセのへりくだりにふさわしい品位を保った。原文の反復と比喩は、不自然になりすぎない範囲で残した。
