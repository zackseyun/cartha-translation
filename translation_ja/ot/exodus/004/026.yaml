  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: ja
  text: そこで、主は彼を放っておかれた。すると彼女は、「血の花婿」と言った。割礼[a]のゆえに、そう言ったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「割礼」と訳した語は、ヘブライ語では複数形で、「割礼の数々」または「割礼の儀式」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: 主は彼を放された
  rationale: רפה はここでは敵対的な行為をやめることを表す。直前の文脈から主語を「主」と補い、目的語の指示対象は本文上「彼」のまま保った。
- source_word: אָז אָמְרָה
  choice: すると彼女は……と言った
  rationale: 物語の時間的推移を自然な現代日本語で示す。女性形の動詞に従い、主語は「彼女」とした。
- source_word: חֲתַן דָּמִים
  choice: 血の花婿
  rationale: 文化的・感情的な含意が確定しにくい難解な連語であるため、意味を決めつけず、簡潔な字義的表現を保持した。
- source_word: לַמּוּלֹת
  choice: 割礼のゆえに
  rationale: 前置詞句が直前の発言を割礼の出来事と結び付けるものとして訳した。原文の名詞は珍しい複数形なので脚注で明示した。
theological_decisions:
- issue: 「放された」の主語と「彼」の指示対象
  choice: 主語は「主」と明示し、目的語は「彼」とした
  alternative: 主語を代名詞のままにする、または目的語を「モーセ」と明示する
  rationale: 24節では主が襲う者であるため、行為をやめた主語は主と読むのが最も自然である。一方、目的語をモーセとする理解が有力でも、ヘブライ語本文自体は代名詞なので「彼」を保った。
- issue: 「血の花婿」の意味
  choice: 難解な慣用句を字義的に保持した
  alternative: 嫌悪の叫び、割礼儀礼上の称号、またはモーセないし子への呼びかけとして説明的に訳す
  rationale: 句の正確な儀礼的・感情的意味と呼びかけの相手は確定できないため、解釈で曖昧さを解消しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。難解な「血の花婿」は説明的に言い換えず、原文の緊張と曖昧さを残した。脚注記号は該当する説明句の後に置いた。
