  text: וַ/תִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַ/תִּכְרֹת֙ אֶת עָרְלַ֣ת בְּנָ֔/הּ וַ/תַּגַּ֖ע לְ/רַגְלָ֑י/ו וַ/תֹּ֕אמֶר כִּ֧י חֲתַן דָּמִ֛ים אַתָּ֖ה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: ja
  text: その時、ツィポラは火打ち石を取り、息子の包皮を切り取り、それを彼の足に触れさせて[a]、言った。「まことに、あなたは私にとって血の花婿です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「彼の足」。ここで「足」は性器の婉曲表現である可能性がある。また、「彼」がモーセを指すのか息子を指すのかも明確ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: 火打ち石
  rationale: 切る道具として用いられた石、特にフリントを指す。現代日本語で簡潔かつ具体的に表現した。
- source_word: עָרְלַת בְּנָהּ
  choice: 息子の包皮
  rationale: 構文を直接かつ解剖学的に明確に訳し、婉曲化を避けた。
- source_word: וַתַּגַּע
  choice: 触れさせて
  rationale: נגעの基本的な「触れる」という意味を保ちつつ、切り取った包皮を接触させたという文脈を自然な日本語で示す。接触の具体的な仕方は限定しない。
- source_word: לְרַגְלָיו
  choice: 彼の足に
  rationale: 字義どおりの「彼の足」を本文に残す。「足」が性器の婉曲表現である可能性と、代名詞の指示対象の曖昧さは脚注で示す。
- source_word: כִּי
  choice: まことに
  rationale: ここでは理由を表す接続詞よりも、ツィポラの発言を強める感嘆的・断定的な用法と判断した。
- source_word: חֲתַן דָּמִים
  choice: 血の花婿
  rationale: 難解で特異なヘブライ語表現の比喩と曖昧さを保ち、説明的な意訳を避けた。
- source_word: לִי
  choice: 私にとって
  rationale: 話者との個人的な関係を、前後の名詞表現に合う自然な日本語で表した。
theological_decisions:
- issue: 「彼の足」が性器の婉曲表現か、また「彼」がモーセと息子のどちらを指すか
  choice: 本文では字義どおり「彼の足」とし、指示対象を特定しない
  alternative: 「彼の性器」、または「モーセの／息子の足（性器）」と明示する
  rationale: ヘブライ語本文には実質的な曖昧さがあるため、本文で一つの解釈に限定せず、主要な可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「血の花婿」という異例の表現は、原文の難解さと解釈上の緊張を保つため、そのまま訳した。
