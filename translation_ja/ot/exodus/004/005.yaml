id: EXO.4.5
reference: Exodus 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: ja
  text: それは、彼らの父祖[b]の神、アブラハムの神、イサクの神、ヤコブの神であるヤハウェ[a]が、あなたに現れたことを彼らが信じるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。伝統的には「主」と訳される。「エホバ」という表記もある。
    reason: alternative_reading
  - marker: b
    text: 「彼らの先祖」とも訳せる。ヘブライ語をより直訳すると「彼らの父たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: それは……ためである
  rationale: 目的を示す接続表現。前節のしるしが与えられた目的を、自然な現代日本語で明確に示す。
- source_word: יַאֲמִינוּ
  choice: 信じる
  rationale: この文脈では、しるしによってモーセの主張を真実として受け入れることを表す。「信頼する」よりも直接的に内容節と結びつく。
- source_word: כִּי
  choice: ……ことを
  rationale: 原因ではなく、信じる内容を導く接続詞なので、日本語では名詞化した内容節「……ことを」で表した。
- source_word: נִרְאָה
  choice: 現れた
  rationale: ראהのニファル形で、「見られた」ではなく神が姿を現したことを意味する。日本語では完了性も文脈上十分に伝わる。
- source_word: אֵלֶיךָ
  choice: あなたに
  rationale: 前置詞אֶלと男性単数二人称接尾辞を直接かつ自然に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、一般的な日本語音写によって固有名として示した。
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: 彼らの父祖の神
  rationale: 契約上の祖先を指す男性複数形の表現を保ちつつ、現代日本語で自然かつ荘重な「父祖」を用いた。
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: アブラハムの神、イサクの神、ヤコブの神
  rationale: 原文が各族長の前で「神」を繰り返す強調とリズムを保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写し、注で伝統的な代替表記を示した。
- issue: אֲבֹתָם の性別と祖先概念
  choice: 彼らの父祖
  alternative: 彼らの先祖／彼らの父たち
  rationale: 原文の男性複数形と族長的・契約的文脈を保ちながら、日本語として過度に逐語的にならない表現を選んだ。別訳の可能性は注記した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神名と族長名の反復が持つ荘重さを保った。「それは……ためである」によって、前節から続く目的節であることを示している。
