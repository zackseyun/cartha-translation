source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: ja
  text: そして、ファラオにこう言いなさい。「ヤハウェはこう言われる。イスラエルはわたしの子、わたしの長子である。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「イスラエルはわたしの長子である」。
    reason: 日本語では「長子」が「子」の意味を含むため、より簡潔に訳すこともできる。本文はヘブライ語の「わたしの子、わたしの長子」という語順と強調を保った。
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  choice: そして、…言いなさい
  rationale: 接続詞付き完了形は文脈上、モーセへの順次的な指示を表すため、現代日本語の命令表現で訳した。
- source_word: אֶל פַּרְעֹה
  choice: ファラオに
  rationale: 前置詞 אֶל は発言の相手を示し、日本語では助詞「に」が自然である。פַּרְעֹה は慣用的表記「ファラオ」とした。
- source_word: כֹּה אָמַר
  choice: こう言われる
  rationale: 使者の定型句。厳粛さを保ちつつ、神を主語とする自然で敬意ある現代日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語音写で示した。
- source_word: בְּנִי
  choice: わたしの子
  rationale: 明示された父子の比喩を保持する。「息子」も可能だが、集合体イスラエルを指す日本語として「子」が自然で、性別を消去する意図ではない。
- source_word: בְכֹרִי
  choice: わたしの長子
  rationale: 家族的比喩と第一位の身分を保ち、時間的・法的・名誉的意味のいずれか一つに限定しない。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 固有名を標準的な日本語表記で音写した。無動詞節において「わたしの子、わたしの長子」と同格関係にある。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を称号で代替せず音写し、契約の神の名として本文に明示する。
- issue: イスラエルの父子比喩と בְכֹרִי の関係
  choice: イスラエルはわたしの子、わたしの長子である
  alternative: イスラエルはわたしの長子である
  rationale: 原文の語順と二重の同格表現を保ち、「子」と「長子」の双方にある強調を示した。より簡潔な日本語では「長子」に「子」の意味が含まれるが、独立した בְּנִי を見えにくくする。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神の発言には敬語「言われる」を用い、本文中の一人称は「わたし」とした。
