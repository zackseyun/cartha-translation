  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: ja
  text: 主は言われた。「それを地面に投げなさい。」そこでモーセはそれを地面に投げた。すると、それは蛇になった。モーセはその蛇から逃げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 主は言われた
  rationale: 動詞自体の主語は文脈上、直前から続く主である。日本語では主語を明示すると自然であり、物語の流れも明確になる。
- source_word: הַשְׁלִיכֵהוּ
  choice: それを…投げなさい
  rationale: 命令形と三人称男性単数接尾辞を自然な現代日本語で表した。「それ」は前節の杖を指す。
- source_word: אַרְצָה
  choice: 地面に
  rationale: 方向を表す語尾を伴う「地・地面」で、この場面では「地面へ／地面に」の意味。「地面に」が動作の到達点を自然に示す。
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: モーセがそれを…投げると
  rationale: 逐語的な接続の反復を避けつつ、命令に続く実行と、その直後の変化という物語上の連続を保った。
- source_word: וַיְהִי לְנָחָשׁ
  choice: それは蛇になった
  rationale: נָחָשׁ は一般に蛇を指す。「蛇」は現代日本語で明瞭かつ文体上も適切である。
- source_word: וַיָּנָס
  choice: 逃げた
  rationale: 「逃走した」より自然でありながら、危険から離れて逃げるという動詞の力を十分に伝える。
- source_word: מִפָּנָיו
  choice: 蛇から
  rationale: 字義的には「その前から／その面前から」。接尾辞は最も自然には直前の蛇を指し、日本語では「蛇から逃げた」がこの慣用表現の意味を明瞭に伝える。
theological_decisions:
- issue: וַיֹּאמֶר の省略された主語
  choice: 主
  alternative: 彼
  rationale: この節単独でも理解できるよう、直前の文脈で語っている神を「主」と明示した。神学的な称号を新たに付加したのではなく、文脈上の指示対象を日本語として補った。
translation_notes:
  register: 明瞭で現代的な標準日本語。命令は品位のある「投げなさい」とし、物語部分は簡潔な常体で統一した。原文の連続する וַ־ は、日本語で不自然な「そして」の反復にせず、「投げると」で出来事の推移を示した。
