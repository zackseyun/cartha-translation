  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: ja
  text: 主は彼に言われた。「だれが人に口を与えたのか。あるいは、だれが人を口の利けない者、耳の聞こえない者、目の見える者、目の見えない者にするのか。そうするのは、このわたし、主ではないか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: 人に口を与えた
  rationale: 直訳的な「人に口を置いた」では不自然なため、創造者として口を備える意味を明確で自然な日本語にした。
- source_word: אִלֵּם
  choice: 口の利けない者
  rationale: 発話できない状態を指す語として、本文の対比を保ちつつ現代日本語で通じる表現を選んだ。
- source_word: חֵרֵשׁ
  choice: 耳の聞こえない者
  rationale: 聴覚を欠く者を表す原語を、明瞭で一般的な表現にした。
- source_word: פִּקֵּחַ
  choice: 目の見える者
  rationale: 文脈上、עִוֵּר「目の見えない者」と対になる視覚能力のある者を指すため、その対照を明示した。
- source_word: עִוֵּר
  choice: 目の見えない者
  rationale: 視覚を欠く者を示す原語を、対句構造が分かる形で訳した。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で広く定着した神名の表記を採用した。
theological_decisions:
- issue: 発話・聴覚・視覚の能力と障害を生じさせる主体
  choice: 原文どおり、主が「する」と述べる直接的な表現を保持した。
  alternative: 許容や摂理などの説明を訳文に補う。
  rationale: 原文は神の主権について鋭い問いを提示しており、その神学的緊張を訳者の説明によって弱めたり解消したりしないため。
- issue: 修辞疑問 הֲלֹא אָנֹכִי יְהוָה
  choice: それは、このわたし、主ではないか
  alternative: わたしが主なのだ
  rationale: 原文の修辞疑問と、אָנֹכִי による一人称の強調を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の荘重な発話にふさわしい格調を保った。「口の利けない」は慣用的表現だが、現代の読者に配慮して中立的な記述表現として用いた。
