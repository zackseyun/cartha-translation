id: EXO.4.31
reference: Exodus 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: ja
  text: 民は信じた。そして、ヤハウェがイスラエルの子ら[b]を顧み[a]、彼らの苦しみ[c]をご覧になったと聞くと、身をかがめて礼拝した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「訪れた」「心に留めた」とも訳せる。神が注意を向け、行動を起こす含みを持つ。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの民」または「イスラエル人」とも訳せる。直訳は「イスラエルの子ら」。
    reason: lexical_alternative
  - marker: c
    text: 「苦境」「惨苦」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: 信じた
  rationale: 目的語は明示されていないため補わず、民が告げられた言葉としるしを真実として受け入れたという物語上の意味を自然な日本語で表した。
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: …と聞くと
  rationale: 聞いた内容を導く כִּי と、その後の応答への時間的・因果的なつながりを、自然な日本語で示した。
- source_word: פָקַד
  choice: 顧み
  rationale: 単に認識するだけでなく、神が心に留めて介入する含みを持つ語である。「顧みる」はその幅を簡潔に保つ。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 字義どおりの家族的表現を保ち、「イスラエル人」と平板化しなかった。
- source_word: רָאָה אֶת־עָנְיָם
  choice: 彼らの苦しみをご覧になった
  rationale: 具体的な動詞「見る」を保ちつつ、神を主語とする自然で敬意ある日本語にした。עֳנִי の苦難・惨苦・圧迫という意味領域は「苦しみ」で広く表した。
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: 身をかがめて礼拝した
  rationale: קדד の身体を低くする動作と、שׁחה のひれ伏して崇敬する行為を区別しながら、重複感の少ない日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文に固有の契約名が明記されているため、称号に置き換えず音写した。
- issue: בְּנֵי יִשְׂרָאֵל の家族的表現
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の家族的・系譜的な言い方を保持した。「子ら」は文脈上、共同体全体を指す。
- issue: שׁחה の行為の性格
  choice: 礼拝した
  alternative: ひれ伏した
  rationale: 語そのものは身体的な平伏・崇敬を表し得るが、神の顧みを聞いた民の応答という文脈では礼拝として表すのが適切である。先行する קדד により身体動作も明示されている。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神名と家族的表現は原文に即して保持した。「ご覧になった」は過度に古風にならない範囲で神を主語とする敬意を示す。「身をかがめて礼拝した」により、連続する二つのヘブライ語動詞の身体的動作と宗教的意味を自然に表現した。
