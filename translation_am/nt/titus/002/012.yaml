  rationale: ግሪኩ ሦስት ተውሳከ ግሶችን ይጠቀማል። አማርኛው ሦስቱንም የተለያዩ የኑሮ ገጽታዎች—ራስን መግዛት፣ ትክክለኛ ግንኙነትና ምግባር፣ እንዲሁም እግዚአብሔርን ማክበር—በተፈጥሯዊ የግስ አገላለጽ ይጠብቃል፤ ከየትኛውም የቤተ እምነት ልዩ ትርጓሜ ጋር አያያዝም።
- issue: የጸጋው እርምጃ እንደ ትምህርት ወይም ተግሣጽ
  choice: ትምህርትንና ተግሣጽን በአንድነት መግለጽ
  alternative: ያስተምረናል ብቻ ወይም ይቀጣናል
