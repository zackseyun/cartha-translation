    issue: “ፈጽመን ትተን” adds “completely.”
    rationale: ἀρνησάμενοι denotes repudiation/renunciation, but the Greek does not explicitly state completeness. “ትተን” preserves the antecedent renunciation without adding that emphasis.
  - severity: low
    issue: The final member of the ethical triad is expressed with a progressive participle.
