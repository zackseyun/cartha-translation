- from: በዕድሜ የገፉ ወንዶች ልከኞች፣ የተከበሩና ራሳቸውን የሚገዙ ሊሆኑ፣ በእምነት[a]፣ በፍቅርና በጽናትም ጤናማ ሊሆኑ ይገባል።
