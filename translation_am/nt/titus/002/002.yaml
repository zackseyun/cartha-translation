id: TIT.2.2
reference: Titus 2:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: am
  text: በዕድሜ የገፉ ወንዶች ልከኞች፣ ክቡራንና ራሳቸውን የሚገዙ ሊሆኑ፣ በእምነት[a]፣ በፍቅርና በጽናትም ጤናማ ሊሆኑ ይገባል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በታማኝነት።” የግሪኩ πίστις እንደ አውዱ “እምነት” ወይም “ታማኝነት” ማለት ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: በዕድሜ የገፉ ወንዶች
  rationale: በዚህ የቤተሰብና የዕድሜ ቡድኖች መመሪያ አውድ ቃሉ የቤተ ክርስቲያንን ሹመት ሳይሆን በዕድሜ የገፉ ወንዶችን ያመለክታል።
- source_word: νηφαλίους
  choice: ልከኞች
  rationale: ቃሉ ከስካር ነፃ መሆንን ብቻ ሳይሆን ንቁነትንና በሁሉ ልክን መጠበቅን ስለሚያመለክት፣ ‘ልከኞች’ ሰፊውን ሥነ ምግባራዊ ትርጉም ይይዛል።
- source_word: σεμνούς
  choice: የተከበሩ
  rationale: ክብር የሚያስገኝ ጨዋነትንና ክቡድነትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σώφρονας
  choice: ራሳቸውን የሚገዙ
  rationale: የሰከነ አስተሳሰብንና ፍላጎትን መቆጣጠርን በግልጽ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὑγιαίνοντας
  choice: ጤናማ
  rationale: የግሪኩን ‘ጤናማ/የዳነ’ የሚለውን ምሳሌያዊ አገላለጽ ጠብቆ፣ በተጠቀሱት በጎ ባሕርያት እንከን የሌለበትን ሁኔታ ያመለክታል።
- source_word: τῇ πίστει
  choice: በእምነት
  rationale: πίστις በዚህ አውድ ‘እምነት’ ወይም ‘ታማኝነት’ ሊሆን ይችላል፤ ዋናው ጽሑፍ የተለመደውን ‘እምነት’ ይጠቀማል፣ ሌላውም አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τῇ ἀγάπῃ
  choice: በፍቅር
  rationale: ἀγάπηን በተፈጥሯዊና ቀጥተኛ ሁኔታ ይተረጉማል።
- source_word: τῇ ὑπομονῇ
  choice: በጽናት
  rationale: በመከራ ወይም በችግር ውስጥ በትዕግሥት የመቆየትንና የመጽናትን ትርጉም በአጭሩ ይይዛል።
- source_word: εἶναι
  choice: ሊሆኑ ይገባል
  rationale: ከቀደመው ቁጥር የሚቀጥለውን የማስተማርና የመምከር ኃይል በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: በበጎ ባሕርያት ዝርዝር ውስጥ የπίστις ትርጉም
  choice: እምነት
  alternative: ታማኝነት
  rationale: ‘እምነት፣ ፍቅር፣ ጽናት’ በሚለው ሦስትዮሽ ውስጥ πίστις በእግዚአብሔር መታመንን ወይም ታማኝ መሆንን ሊያመለክት ይችላል። ዋናው ጽሑፍ ‘እምነት’ን ይዞ፣ እውነተኛውን አሻሚነት በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የጤና ምሳሌ ‘ጤናማ’ በሚለው ቃል ተጠብቋል፤ ነገር ግን አረፍተ ነገሩ በአማርኛ እንዲፈስ የበጎ ባሕርያቱ ዝርዝር በሁለት የተያያዙ ክፍሎች ተደርድሯል።
