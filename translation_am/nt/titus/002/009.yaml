    issue: The explicit governing verb is rendered «አስተምር».
    rationale: The supplied Greek has dependent infinitives and participles, with exhortation supplied from the preceding discourse. “Teach” adds a more specific instructional nuance; “urge/exhort” better reflects the implied paraenetic force.
  - severity: medium
    issue: «ባሪያዎች» is nominative despite the explicit governing verb at the end.
    rationale: 'Once an Amharic verb such as «አሳስብ» is supplied, the persons being exhorted should be marked as its object: «ባሪያዎችን».'
  - severity: low
