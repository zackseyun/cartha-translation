  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: am
  text: እርሱም ከዓመፅ ሁሉ ሊቤዠንና ለራሱ የሆነ፣ ለመልካም ሥራዎች የሚቀና ሕዝብ ሊያነጻ ስለ እኛ ራሱን ሰጠ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: ራሱን ሰጠ
  rationale: የግሪኩን የፈቃደኝነት ራስን መስጠት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὑπὲρ ἡμῶν
  choice: ስለ እኛ
  rationale: ለእኛ ጥቅም ወይም በእኛ ፈንታ የመሆንን ሰፊ አንድምታ ሳያጠብ ያቆያል።
- source_word: ἵνα λυτρώσηται
  choice: ሊቤዠን
  rationale: λυτρόομαι የቤዛ ዋጋ በመክፈል ነጻ የማውጣትን አንድምታ ይዟል፤ ‘ሊቤዠን’ ይህን በአጭርና በመጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ πάσης ἀνομίας
  choice: ከዓመፅ ሁሉ
  rationale: ἀνομία ከሕግ ውጭ መሆንንና ሕግን መጣስን ያመለክታል፤ ‘ዓመፅ’ በዘመናዊ አማርኛ የሕግ እምቢተኝነትን ይገልጻል።
- source_word: καθαρίσῃ
  choice: ሊያነጻን
  rationale: የሥነ ምግባርና የቃል ኪዳን ንጽሕናን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἑαυτῷ
  choice: ለራሱ የሆነ
  rationale: ሕዝቡ በተለየ ሁኔታ የእርሱ መሆኑን የሚያሳየውን የባለቤትነት አንድምታ ይጠብቃል።
- source_word: λαὸν περιούσιον
  choice: ለራሱ የሆነ ሕዝብ
  rationale: περιούσιος ያለውን በተለየ መንገድ የእርሱ ንብረት የመሆንና የቃል ኪዳን አንድምታ በግልጽ አማርኛ ያቆያል።
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: መልካም ሥራዎችን ለማድረግ የሚቀና
  rationale: ζηλωτής የሚያመለክተውን ትጋትና ከፍተኛ ፍላጎት በቀላሉ ሊገባ በሚችል ዘመናዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በክርስቶስ ራስን መስጠት ውስጥ የὑπὲρ ἡμῶν ኃይል
  choice: ስለ እኛ
  alternative: ለእኛ፤ በእኛ ፈንታ
  rationale: ቃሉ ለእኛ ጥቅም መሆንንና በእኛ ፈንታ መሆንን ሊያመለክት ይችላል፤ ትርጉሙ ጥቅሱ በግልጽ ከሚናገረው በላይ አንድን የሥርየት አስተምህሮ ሳይወስን ስፋቱን ይጠብቃል።
- issue: የλαὸν περιούσιον የቃል ኪዳን አንድምታ
  choice: ለራሱ የሆነ ሕዝብ
  alternative: ውድ ሀብቱ የሆነ ሕዝብ፤ ልዩ ሕዝብ
  rationale: ይህ አባባል የሕዝቡን ልዩ የባለቤትነት ግንኙነትና የብሉይ ኪዳን ድምፀት ይጠብቃል፤ ‘ልዩ’ ብቻ ከማለትም ይበልጥ ግልጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረዥም ዓላማ-አመልካች አወቃቀር በአማርኛ ተፈጥሯዊ እንዲሆን ግሶቹ ከዋናው ግስ በፊት ተደርድረዋል።
