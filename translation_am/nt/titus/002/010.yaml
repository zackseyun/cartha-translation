lexical_decisions:
- source_word: νοσφιζομένους
  choice: አንዳች ነገር ለራሳቸው ሳያስቀሩ
  rationale: ግሱ የሌላውን ንብረት በስውር ለራስ ማስቀረትን ያመለክታል። ይህ አተረጓጎም ከአገልጋዮችና ከጌቶች አውድ ጋር የሚስማማ ሲሆን፣ “መስረቅ” ከሚለው ሰፊ ቃል ይበልጥ የግሱን ልዩ ሐሳብ ይገልጣል።
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: ፍጹም ታማኝነትን ሁሉ ያሳዩ
  rationale: በዚህ የሥነ ምግባርና የአገልግሎት አውድ πίστις እምነትን ብቻ ሳይሆን ታማኝነትንና ታማኝ መሆንን ያመለክታል። πᾶσαν የሙሉነትን ስፋት፣ ἀγαθήν ደግሞ መልካምና እውነተኛ ጥራትን ያጎላል።
- source_word: κοσμῶσιν
  choice: እንዲያስውቡ
  rationale: ቃሉ ማስዋብን፣ ውበት መጨመርን የሚገልጽ ዘይቤ ነው። “እንዲያስውቡ” ዘይቤውን ጠብቆ ትምህርቱን በመልካም ኑሮ የሚስብና የተከበረ አድርጎ ማቅረብን ያሳያል።
- source_word: διδασκαλίαν
  choice: ትምህርት
  rationale: “ትምህርት” በዘመናዊ አማርኛ ተፈጥሯዊና ለሁሉ የሚገባ ሲሆን διδασκαλία የሚያመለክተውን የተሰጠ ትምህርት በትክክል ይወክላል።
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: የአዳኛችንን የእግዚአብሔርን
  rationale: ይህ አገላለጽ θεός በዚህ ሐረግ “አዳኛችን” ተብሎ መጠራቱን በግልጽ ይጠብቃል፤ በጥቅሱ ውስጥ በቀጥታ ያልተገለጸ ሌላ ማንነት አያስገባም።
- source_word: ἐν πᾶσιν
  choice: በሁሉም ነገር
  rationale: ይህ አተረጓጎም የምግባራቸውን አጠቃላይ ስፋት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በሥነ ምግባራዊ አውድ πίστιςን መተርጎም
  choice: ታማኝነት
  alternative: እምነት
  rationale: በአገልጋዮች ለጌቶቻቸው ስለሚያሳዩት ምግባር የሚናገረው የቅርብ አውድ πίστις እዚህ የታማኝነትና የታመነ መሆን ሐሳብ እንዳለው በጠንካራ ሁኔታ ያመለክታል። ይህን በዋናው ጽሑፍ ማስቀመጥ የአማርኛውን ግልጽነት ይጠብቃል።
- issue: “አዳኛችን እግዚአብሔር” የሚለው ማንን እንደሚያመለክት
  choice: ሐረጉን በቀጥታ እግዚአብሔርን “አዳኛችን” ብሎ እንደሚጠራ መተርጎም
  alternative: ሐረጉን በቀጥታ ክርስቶስን እንደሚጠቅስ ማብራራት
  rationale: የግሪኩ ሐረግ በዚህ ጥቅስ θεόςን “አዳኛችን” ይላል። ትርጉሙ የደብዳቤውን ሰፊ ክርስቶሎጂያዊ አውድ ሳይክድ፣ በዚህ ሐረግ ብቻ ያልተገለጸውን ነገር አያክልም።
