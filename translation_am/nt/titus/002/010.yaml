translation:
  language: am
  text: ሳይሰርቁ[a]፣ ይልቁንም መልካም ታማኝነትን በሙሉ ያሳዩ፤ ይህም በሁሉም ነገር የእግዚአብሔርን፣ የአዳኛችንን ትምህርት እንዲያስውቡ ዘንድ ነው።
  philosophy: optimal-equivalence
  footnotes:
