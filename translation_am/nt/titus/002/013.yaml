source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: am
  text: የተባረከውን ተስፋና የታላቁ አምላካችንና አዳኛችን፣ የኢየሱስ መሲሕ ክብር መገለጥ እየጠበቅን፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: እየጠበቅን
  rationale: የግስ ተውሳኩ ከቀደመው ንግግር ጋር የሚቀጥል ሲሆን፣ በተስፋ የተሞላ ቀጣይ መጠባበቅን ያመለክታል።
- source_word: μακαρίαν
  choice: የተባረከውን
  rationale: በዚህ የፍጻሜ ዘመን አውድ ‘ደስተኛ’ ከሚለው ይልቅ ክብርና መንፈሳዊ ክብደት ያለው ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐλπίδα
  choice: ተስፋ
  rationale: እዚህ ላይ የሚጠበቀውን የወደፊት እውነታ እንጂ ተራ ምኞትን አያመለክትም።
- source_word: ἐπιφάνειαν
  choice: መገለጥ
  rationale: የሚታይ መገኘትንና መግለጥን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δόξης
  choice: ክብር
  rationale: የግሪኩን ቀጥተኛና በአውዱ የተለመደ ትርጉም ይጠብቃል፤ ‘የክብሩ መገለጥ’ የሚለው ግንኙነትም በአማርኛው ተጠብቋል።
- source_word: μεγάλου
  choice: ታላቁ
  rationale: θεοῦን የሚያጎላ ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: θεοῦ
  choice: አምላክ
  rationale: መደበኛውን የአማርኛ የመጽሐፍ ቅዱስ ቃል ይጠቀማል፤ በዚህ ሰዋሰዋዊ አወቃቀር ከ‘አዳኝ’ ጋር አንድ የክርስቶስ መጠሪያ ይፈጥራል።
- source_word: σωτῆρος
  choice: አዳኝ
  rationale: በጳውሎሳዊ አጠቃቀምና በዘመናዊ አማርኛ የተለመደውና ተገቢው አቻ ቃል ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ መተርጎም ትርጉሙን ያስተላልፋል፤ በአማርኛም የመድኃኒቱን ማንነት በግልጽ ያሳያል።
theological_decisions:
- issue: ‘ታላቁ አምላካችንና አዳኛችን ኢየሱስ መሲሕ’ አንድን አካል ወይስ ሁለት የተለያዩ አካላትን ያመለክታል?
  choice: አንድ አካል፤ ኢየሱስ መሲሕ ‘ታላቁ አምላካችንና አዳኛችን’ ተብሎ ተለይቷል።
  alternative: ‘ታላቁ አምላክ’ አብን፣ ‘አዳኛችን ኢየሱስ መሲሕ’ ደግሞ ወልድን እንደሚያመለክቱ መውሰድ።
  rationale: በግሪኩ አንድ መስተዋድድ ሁለት ነጠላ የግል ስሞችን ይገዛል (τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν)፣ ከዚያም ‘ኢየሱስ መሲሕ’ ይከተላል። ስለዚህ አንድ ማጣቀሻ መሆኑ በሰዋሰውና በአውዱ ይበልጥ ተፈጥሯዊ ነው፤ ሌላው አተረጓጎም ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። የግሪኩ ተሳቢ አገላለጽ ከቀደመው ቁጥር ጋር እንዲቀጥል ‘እየጠበቅን’ ተብሏል፤ የክርስቶስ ማንነትን የሚመለከተው እውነተኛ የአተረጓጎም አማራጭም በ[a] ማስታወሻ ተመዝግቧል።
