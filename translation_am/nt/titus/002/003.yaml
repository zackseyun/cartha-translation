- source_word: μὴ διαβόλους
  choice: ሐሜተኞች አይሁኑ
  rationale: διάβολος በዚህ የሥነ ምግባር ዝርዝር ውስጥ ሌሎችን በክፉ የሚያሙ ወይም በሐሰት የሚከሱ ሰዎችን እንጂ ዲያብሎስን አያመለክትም። ‘ሐሜተኞች’ በዘመናዊ አማርኛ ቀጥተኛና ለመረዳት ቀላል ነው።
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: ለብዙ ወይንም ባሪያዎች አይሁኑ
  rationale: የδουλόω ፍጹም ተገብሮ አካፋይ ቅርጽ የባርነትና የመገዛት ምስልን ይዟል። ‘ባሪያዎች አይሁኑ’ ይህን ምስል ከ‘ሱሰኞች አይሁኑ’ ይልቅ በቅርብ ይጠብቃል።
- source_word: καλοδιδασκάλους
  choice: መልካም ነገርን የሚያስተምሩ
  rationale: ያልተለመደው ድብልቅ ቃል የማስተማሩን ችሎታ ሳይሆን የሚያስተምሩትን መልካም ይዘት ያመለክታል።
