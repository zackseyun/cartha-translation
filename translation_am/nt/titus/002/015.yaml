base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: am
  text: እነዚህን ነገሮች በሙሉ ሥልጣን ተናገር፣ ምከር፣ ገሥጽ። ማንም አይናቅህ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማንም ቸል አይበልህ” ወይም “ማንም አቅልሎ አይይህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: እነዚህን ነገሮች
  rationale: ወደ ምዕራፉ ቀደምት መመሪያዎች የሚያመለክተውን ሰፊ ትርጉም ሳያጠብ ያቆያል።
- source_word: λάλει
  choice: ተናገር
  rationale: ቀጣይነት ያለውን የመናገር ትእዛዝ በቀጥታ ያስተላልፋል፤ ትርጉሙን ‘አስተምር’ ብሎ አያጠብም።
- source_word: παρακάλει
  choice: ምከር
  rationale: በዚህ የእረኝነት አውድ ያለውን የማበረታታት፣ የመምከርና የማሳሰብ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔλεγχε
  choice: ገሥጽ
  rationale: ስህተትን አጋልጦ የማረምን ኃይል የሚይዝ ተገቢ የእረኝነት ቃል ነው።
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: በሙሉ ሥልጣን
  rationale: ἐπιταγή የትእዛዝንም ሆነ የሥልጣንን ሐሳብ ሊይዝ ይችላል፤ እዚህ ተግባሮቹ በሙሉ ክብደት እንዲከናወኑ መመሪያ መሆኑን ይገልጣል።
- source_word: μηδείς
  choice: ማንም
  rationale: አሉታዊውን ያልተወሰነ ባለቤት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: σου
  choice: -ህ
  rationale: በግሱ ላይ የተያያዘው የሁለተኛ መደብ ነጠላ ተሳቢ ቅጥያ ጢቶን በቀጥታ ያመለክታል።
- source_word: περιφρονείτω
  choice: አይናቅህ
  rationale: አንድን ሰው አቅልሎ ማየት፣ መናቅ ወይም ቸል ማለት የሚለውን ዋና ሐሳብ በአጭርና ግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በ‘μετὰ πάσης ἐπιταγῆς’ ውስጥ የጢቶ የአገልግሎት ሥልጣን ኃይል
  choice: ጢቶ በሙሉ ሥልጣን እንዲናገር፣ እንዲመክርና እንዲገሥጽ ይታዘዛል።
  alternative: ሐረጉ የሚያመለክተው የትእዛዝ አነጋገርን ብቻ ወይም የመልእክቱን ሥልጣን ብቻ ነው።
  rationale: ሐረጉ ሦስቱን ትእዛዞች በተፈጥሮ ያሻሽላል፤ ‘በሙሉ ሥልጣን’ የተሰጠውን የአገልግሎት ክብደት ያቆያል እንጂ የግልና ራሱን የቻለ ኃይል አያደርገውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የትእዛዞቹ ቀጥተኛ ኃይልና የመጨረሻው ክልከላ ተጠብቀዋል።
