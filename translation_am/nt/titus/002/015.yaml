  naturalness: The wording is clear, modern, and suitably dignified. Reordering the authority phrase also produces a smooth Amharic sequence of parallel imperatives.
  terminology: ‘ምከር’ suitably conveys the directive pastoral force of παρακάλει, and ‘ገሥጽ’ appropriately conveys ἔλεγχε. ‘አይናቅህ’ is a valid rendering of περιφρονείτω; the footnote helpfully retains less forceful or more idiomatic alternatives.
