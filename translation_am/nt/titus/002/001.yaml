lexical_decisions:
- source_word: Σὺ δὲ
  choice: አንተ ግን
  rationale: ግልጽ የሆነው ተውላጠ ስምና δὲ ከቀደሙት ሐሰተኛ አስተማሪዎች ጋር ያለውን ንጽጽር ያጎላሉ፤ «አንተ ግን» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λάλει
  choice: ተናገር
  rationale: ትእዛዛዊውን ኃይል ይጠብቃል፤ ቃሉን ወደ መደበኛ ማስተማር ብቻ አያጠብም።
- source_word: ἃ πρέπει
  choice: የሚስማማውን
  rationale: πρέπει ተስማሚነትንና ተገቢነትን ያመለክታል። «የሚስማማውን» ከትምህርቱ ጋር የሚጣጣሙ ነገሮችን በተፈጥሯዊ አገላለጽ ይወክላል።
- source_word: ὑγιαινούσῃ
  choice: ጤናማው
  rationale: የጤንነትን ዘይቤ ጠብቆ ትምህርቱ ከስሕተት የጸዳና የሚጠቅም መሆኑን ያሳያል።
- source_word: διδασκαλίᾳ
  choice: ትምህርት
  rationale: ቃሉ የማስተማርን ተግባር ወይም ይዘት ሊያመለክት ይችላል፤ «ትምህርት» ሁለቱንም ሊሸከም የሚችል ግልጽና ዘመናዊ ቃል ነው።
theological_decisions:
- issue: τῇ ὑγιαινούσῃ διδασκαλίᾳ የሚለው ሐረግ
  choice: ጤናማው ትምህርት
  alternative: ትክክለኛው ትምህርት፤ ጤናማው አስተምህሮ
  rationale: «ጤናማው ትምህርት» የግሪኩን የጤንነት ዘይቤና የትምህርቱን ትክክለኛነት ይጠብቃል፤ ቃሉን ወደ አንድ ልዩ የቤተ እምነት ቴክኒካዊ አገላለጽ አይገድብም።
translation_notes:
