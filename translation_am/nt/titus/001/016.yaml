base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: am
  text: እግዚአብሔርን እንደሚያውቁ ይናገራሉ[a]፤ በሥራቸው ግን ይክዱታል[b]። እነርሱ አስጸያፊዎችና የማይታዘዙ ናቸው፤ ለማንኛውም መልካም ሥራም ብቁ ያልሆኑ ናቸው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔርን እናውቃለን ይላሉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በድርጊታቸው ግን ይክዱታል።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ለማንኛውም መልካም ሥራ ውድቅ የሆኑ ናቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν ὁμολογοῦσιν εἰδέναι
  choice: እግዚአብሔርን እንደሚያውቁ ይናገራሉ
  rationale: የእግዚአብሔር እውቀት እንዳላቸው በቃል መግለጣቸውን ያሳያል፤ ከሚከተለው የተግባር ክህደት ጋር ያለውን ተቃርኖም ይጠብቃል።
- source_word: τοῖς δὲ ἔργοις ἀρνοῦνται
  choice: በሥራቸው ግን ይክዱታል
  rationale: የመሣሪያን ወይም የአኳኋንን ትርጉም የሚሰጠውን ዳቲቭ በተፈጥሯዊ አማርኛ ያቀርባል፤ የ‘ይክዱታል’ ተሳቢም በቀደመው ሐረግ የተጠቀሰው እግዚአብሔር ነው።
- source_word: βδελυκτοὶ
  choice: አስጸያፊዎች
  rationale: ቃሉ የሚገልጸውን ከባድ የሥነ ምግባር አስጸያፊነት በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: ἀπειθεῖς
  choice: የማይታዘዙ
  rationale: በዚህ የሥነ ምግባር አውድ ውስጥ ቃሉ ለመታዘዝ እምቢ ማለትን ያመለክታል።
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι
  choice: ለማንኛውም መልካም ሥራ የማይበቁ
  rationale: πρός የሚያሳየውን ለአንድ ዓላማ ብቁ መሆንን እና ἀδόκιμοι የሚያሳየውን ፈተናውን አለማለፍ በተፈጥሯዊ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: በቃል እግዚአብሔርን እናውቃለን ማለትና በተግባር እርሱን መካድ ያላቸው ግንኙነት
  choice: ሰዎቹ እግዚአብሔርን እንደሚያውቁ በቃል ይገልጻሉ፤ ሥራቸው ግን እርሱን እንደሚክዱ ያሳያል።
  alternative: ‘ይክዱታል’ የሚለውን በአጠቃላይ የእግዚአብሔርን እውነት መካድ ብሎ መረዳት።
  rationale: በመጀመሪያው ሐረግ ግልጽ የሆነው ተሳቢ ‘እግዚአብሔርን’ ነው፤ በሁለተኛውም ሐረግ በተፈጥሮ ይቀጥላል። ትርጉሙ ጽሑፉን ወደማይገልጸው ሰፊ የአስተምህሮ መግለጫ ሳያስፋፋ በቃልና በተግባር መካከል ያለውን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ በቃል መናገርና በሥራ መካድ ተቃርኖ ተጠብቋል፤ የመጨረሻዎቹ ሦስት ገላጭ ቃላትም በግልጽ አረፍተ ነገር ቀርበዋል።
