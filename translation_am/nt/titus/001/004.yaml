base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: am
  text: በምንጋራው እምነት[a] እውነተኛ ልጄ ለሆንኸው ለቲቶስ፤ ከእግዚአብሔር አብና ከአዳኛችን መሲሕ[b] ኢየሱስ ጸጋና ሰላም ይሁንልህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጋራ እምነታችን።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክ፣ “ክርስቶስ”፤ እዚህ Χριστός እንደ ማዕረግ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ
  choice: እውነተኛ
  rationale: ከቴክνον ጋር ሲያያዝ የመንፈሳዊ ዝምድናውን እውነተኝነት ያመለክታል፤ ባዮሎጂያዊ ወይም ሕጋዊ ልጅነትን አያስገባም።
- source_word: τέκνῳ
  choice: ልጄ
  rationale: የቤተሰብ ምሳሌውን በተፈጥሯዊ አማርኛ ይጠብቃል፤ የመጀመሪያው ተውላጠ ስም በአውዱ የጳውሎስን ግንኙነት ያሳያል።
- source_word: κατὰ κοινὴν πίστιν
  choice: በምንጋራው እምነት
  rationale: κατά የግንኙነት ወይም የመሠረት ሐሳብን፣ κοινήν ደግሞ በጋራ መካፈልን ያሳያል። ይህ አገላለጽ ሁለቱ የሚጋሩትን እምነት በግልጽና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: πίστιν
  choice: እምነት
  rationale: በዚህ አውድ የጋራውን ክርስቲያናዊ እምነት ያመለክታል፤ ‘ታማኝነት’ የሚለው ትርጉም ከአውዱ ጋር ያነሰ ይስማማል።
- source_word: χάρις
  choice: ጸጋ
  rationale: የጳውሎስ ደብዳቤዎች የተለመደ የበረከት ቃል ሲሆን በአማርኛም የታወቀና ትክክለኛ ነው።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: ከጸጋ ጋር የተጣመረውን የበረከት ቃል በቀጥታ ይገልጣል።
- source_word: θεοῦ πατρὸς
  choice: እግዚአብሔር አብ
  rationale: የግሪኩ ጽሑፍ ከπατρός ጋር ‘የእኛ’ የሚል ቃል ስለሌለው ‘እግዚአብሔር አብ’ የሚለው አቀራረብ የምንጩን ዝርዝር ይጠብቃል።
- source_word: Χριστοῦ Ἰησοῦ
  choice: መሲሕ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ የማዕረግ ትርጉሙን እንዲያስተላልፍ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ በወረስነው የድምፅ ቅጂ ብቻ አልቀረም።
- source_word: σωτῆρος ἡμῶν
  choice: አዳኛችን
  rationale: የመጀመሪያውን የባለቤትነት አገላለጽና የማዕረጉን ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: Χριστός በΧριστοῦ Ἰησοῦ ውስጥ እንዴት እንደሚተረጎም
  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: የΧριστόςን ‘የተቀባው/መሲሕ’ የማዕረግ ይዘት ለአንባቢው በትርጉም ለማቅረብ ተመርጧል፤ የተለመደው የድምፅ ቅጂ በማስታወሻ ተጠቅሷል።
- issue: σωτῆρος ἡμῶν የሚጠቅሰው ማንን እንደሆነ
  choice: ‘አዳኛችን’ መሲሕ ኢየሱስን በቀጥታ ይገልጣል
  alternative: ሐረጉ በላላ ንባብ ለተቀናጁት ምንጮች ሁሉ እንደሚዘረጋ ሊሰማ ይችላል
  rationale: τοῦ σωτῆρος ἡμῶν የሚለው አንቀጽ-ስም ሐረግ ወዲያው ከΧριστοῦ Ἰησοῦ በኋላ በመምጣቱ በተፈጥሮ ኢየሱስን በተጨማሪ መግለጫ ይለያል። ትርጉሙ ይህን አገባብ ያልሸፈነ ሆኖ አቅርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የደብዳቤ ሰላምታ አገላለጽ ተጠቅሟል። በግሪኩ ውስጥ ግስ ባይገለጽም፣ የበረከት ሐረጉ በተፈጥሯዊ አማርኛ ‘ይሁንልህ’ በሚለው ተሟልቷል።
