  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: am
  text: ከእነርሱ አንዱ፣ የራሳቸው ነቢይ፣ እንዲህ አለ፦ “የቀርጤስ ሰዎች ሁልጊዜ ውሸታሞች፣ ክፉ አውሬዎች፣ ሥራ ፈት ሆዳሞች ናቸው።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሥራ ፈት ሆዶች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: ከእነርሱ አንዱ … እንዲህ ብሏል
  rationale: τις ἐξ αὐτῶν የከፊልነትን ሐሳብ፣ ማለትም ከዚያው ቡድን አንድ ሰው መሆኑን፣ በተፈጥሯዊ አማርኛ ያስተላልፋል። የግሪኩ ያለፈ ጊዜ በጥቅሱ ውስጥ እስከአሁን የሚጠቀስ ንግግር በመሆኑ «ብሏል» ተብሏል።
- source_word: ἴδιος αὐτῶν προφήτης
  choice: የገዛ ነቢያቸው
  rationale: ἴδιος የራሳቸው የሆነ፣ ከእነርሱ የወጣ መሆኑን አጽንዖት ይሰጣል፤ «የገዛ» ይህን አጽንዖት በአጭርና ክቡር አማርኛ ይጠብቃል።
- source_word: Κρῆτες
  choice: የቀርጤስ ሰዎች
  rationale: በቀርጤስ ደሴት የሚኖሩትን ሕዝብ በዘመናዊ አማርኛ ግልጽ አድርጎ ይጠራል።
- source_word: ἀεὶ ψεῦσται
  choice: ሁልጊዜ ውሸታሞች
  rationale: ἀεί የቀጣይነትን አጽንዖት ያለማለዘብ ይጠብቃል፤ ψεῦσται በቀጥታ «ውሸታሞች» ነው።
- source_word: κακὰ θηρία
  choice: ክፉ አውሬዎች
  rationale: የግሪኩን የአውሬ ምስልና የሥነ ምግባር ክፋት በቀጥታ ይጠብቃል፤ ስድቡን አያለዝብም።
- source_word: γαστέρες ἀργαί
  choice: ሥራ ፈት ሆዳሞች
  rationale: ቃል በቃል «ሥራ ፈት ሆዶች» የሚለውን ምስል ሳያጠፋ፣ ሰዎችን እንደሚገልጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ የጠቀሰውን በአንድ ሕዝብ ላይ የተነገረ ከባድ አባባል መተርጎም
  choice: እንደ ጥቅስ በግልጽ አቅርቦ ከባድ ቃላቱን ሳያለዝብ መተርጎም
  alternative: የሕዝብ ቡድኑን እንዳያስከፋ ቃላቱን ማለዘብ ወይም ማብራራት
  rationale: ግሪኩ ይህን ንግግር «የገዛ ነቢያቸው» እንደተናገረው በግልጽ ያቀርባል። ትርጉሙ የጥቅሱን ማንነትና የንግግሩን ክብደት ይጠብቃል፤ ነገር ግን ከአውዱ ባለፈ ስለ ቀርጤስ ሰዎች ዘላለማዊ ትምህርት አድርጎ አይተረጉመውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የተጠቀሰው አባባል ያለው ሦስት ክፍል ተከታታይ ኃይል ተጠብቋል፤ «ሥራ ፈት ሆዳሞች» ቃል በቃል ትርጉሙንና በአማርኛ ያለውን ተፈጥሯዊነት ያመጣጥናል።
