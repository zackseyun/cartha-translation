  rationale: κέρδος ትርፍን ወይም ጥቅምን ሊያመለክት ስለሚችል ገንዘብ ብቻ ብሎ አያጠብም፤ αἰσχρός የሚሰጠውን የሥነ ምግባር ነቀፋ ይጠብቃል።
