  rationale: የግሪኩን የግዴታ ኃይል ይጠብቃል፤ ἐπιστομίζειν ቃል በቃል አፍን መዝጋት ማለት ቢሆንም፣ በዚህ አውድ ጎጂ ትምህርታቸውን ማስቆም የሚለውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
