  source_fidelity: The draft accurately conveys the necessity expressed by δεῖ, the restraint of harmful speech/teaching in ἐπιστομίζειν, the explanatory force of οἵτινες, household units in ὅλους οἴκους, improper teaching, and the motive of αἰσχροῦ κέρδους χάριν. The expression “ለነውር ትርፍ” is not idiomatic and can suggest profit intended to bring disgrace, rather than gain that is itself disgraceful.
