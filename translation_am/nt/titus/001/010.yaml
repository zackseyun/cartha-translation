  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: am
  text: ምክንያቱም የማይታዘዙ፣ ከንቱ ነገር የሚናገሩና የሚያሳስቱ ብዙ ሰዎች አሉ፤ በተለይም ከተገረዙት ወገን የሆኑት ናቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የግርዛት ወገን አባላት” ወይም “ከግርዛት ወገን የመጡት።” አገላለጹ አይሁዳውያንን ወይም ግርዛትን የሚያስገድዱ ተቃዋሚዎችን የሚያመለክት ሊሆን ይችላል፤ ግሪክኛው ግን ይህን በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው መመሪያ ጋር ያለውን የምክንያት ወይም የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πολλοὶ
  choice: ብዙ ሰዎች
  rationale: ቅጽሉ በግሪክ በስም ፋንታ ስለቆመ፣ በአማርኛ ግልጽነት ‘ሰዎች’ ተጨምሯል።
- source_word: ἀνυπότακτοι
  choice: የማይታዘዙ
  rationale: ለተገቢ ሥልጣን አለመገዛትን የሚያመለክት ተፈጥሯዊና ግልጽ አገላለጽ ነው።
- source_word: ματαιολόγοι
  choice: ከንቱ ነገር የሚናገሩ
  rationale: ፍሬ ቢስና ጥቅም የሌለውን ንግግር የሚያደርጉ ሰዎችን በዘመናዊ አማርኛ ያሳያል።
- source_word: φρεναπάται
  choice: የሚያሳስቱ
  rationale: ቃሉ የሌሎችን አእምሮ ማታለልን ያመለክታል፤ ‘የሚያሳስቱ’ ይህን በአጭርና ተፈጥሯዊ መንገድ ያቀርባል።
- source_word: μάλιστα
  choice: በተለይም
  rationale: ከሰፊው ቡድን ውስጥ አንድን ክፍል አጉልቶ የሚያሳይ ተመጣጣኝ አገላለጽ ነው።
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: ከተገረዙት ወገን የሆኑት
  rationale: ‘ከግርዛት’ የሚለውን ግሪክኛ ፈሊጥ በሚነበብ አማርኛ ያቀርባል፤ ‘ወገን’ የቡድን ትስስሩን ያሳያል እንጂ መደበኛ ፓርቲ መሆኑን አይገድብም።
theological_decisions:
- issue: ‘οἱ ἐκ τῆς περιτομῆς’ የሚያመለክተው ቡድን
  choice: ከተገረዙት ወገን የሆኑት
  alternative: የግርዛት ወገን አባላት፤ ወይም ከአይሁድ ወገን የሆኑት
  rationale: አገላለጹ አይሁዳውያንን ወይም ግርዛትን የሚያስገድዱ ተቃዋሚዎችን ሊያመለክት ቢችልም፣ ግሪክኛው ‘አይሁድ’ ወይም ‘ፓርቲ’ ብሎ በግልጽ አይገድብም። ስለዚህ ዋናው ጽሑፍ ይህን ክፍትነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቁጥሩን ረዘም ያለ ዝርዝር ለማንበብ ቀላል ለማድረግ ነጠላ ሰረዞችና ከፊል ነጥብ ተጠቅመዋል።
