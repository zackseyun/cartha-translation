  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: am
  text: ለአይሁዳዊ አፈ ታሪኮችና ከእውነት የሚርቁ ሰዎች ትእዛዛት ትኩረት እንዳይሰጡ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለአይሁዳዊ አፈ ታሪኮችና ከእውነት ለሚርቁ ሰዎች ትእዛዛት ራሳቸውን እንዳይሰጡ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: ትኩረት እንዳይሰጡ
  rationale: የአሁን ጊዜው አሳታፊ ቅርጽ በቀደመው ቁጥር ያለውን ምክር ይቀጥላል፤ ይህ አተረጓጎም አእምሮን ወደ አንድ ነገር የማዞርን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: የአይሁድን ተረቶች
  rationale: μῦθος የተቀነባበሩ ታሪኮችን ወይም አፈ ታሪኮችን ያመለክታል፤ Ἰουδαϊκοῖς ደግሞ ባሕርያቸውን ወይም ምንጫቸውን የአይሁድ እንደሆነ ይገልጣል።
- source_word: ἐντολαῖς ἀνθρώπων
  choice: የሰዎችን ትእዛዛት
  rationale: ይህ ትርጉም የἐντολαῖςን ‘ትእዛዛት’ እና የἀνθρώπωνን ጾታ-አይለይ የሰው ልጆች ማመልከቻ በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀποστρεφομένων
  choice: ከእውነት የሚርቁ
  rationale: ቃሉ ከአንድ ነገር መዞርን ወይም መራቅን ያመለክታል፤ ‘የሚርቁ’ የግሱን ምስላዊ ኃይል ሳይተረጉም ይጠብቃል።
- source_word: τὴν ἀλήθειαν
  choice: እውነት
  rationale: ይህ የἀλήθεια መደበኛ አተረጓጎም ሲሆን ጽሑፉ ከሚለው በላይ ትርጉሙን ወደ ‘የወንጌል እውነት’ አያስፋፋም።
theological_decisions:
- issue: የἀποστρεφομένων የመስተዋድድ አገናኝ ማንን እንደሚገልጥ
  choice: ‘ከእውነት የሚርቁ’ የሚለው ‘ሰዎችን’ ይገልጣል።
  alternative: አገላለጹ ከእውነት ከሚርቁት ሰዎች ጋር የተያያዙትን ‘ተረቶችና ትእዛዛት’ በሰፊው እንደሚገልጥ ሊወሰድ ይችላል።
  rationale: ἀποστρεφομένων እና ἀνθρώπων ሁለቱም በተመሳሳይ የጀኒቲቭ ብዙ ቁጥር ቅርጽ የተቀመጡ ስለሆነ፣ በሰዋስው በጣም ተፈጥሯዊው ግንኙነት አሳታፊው ቅርጽ ‘ሰዎችን’ እንዲገልጥ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትእዛዝ’ የሚለው የአማርኛ መደበኛ አጻጻፍ ተመርጧል።
