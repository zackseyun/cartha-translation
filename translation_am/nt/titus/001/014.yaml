    reason: lexical_alternative
  revision_rationale: 'The revision retains the draft’s intended meaning but corrects the Amharic grammatical relationship corresponding to ἐντολαῖς ἀνθρώπων ἀποστρεφομένων: the commands are those of people who turn away from the truth. It also uses the idiomatic ለ- complement of “ትኩረት መስጠት.” The footnote remains a genuine lexical alternative for προσέχοντες and preserves the same syntax.'
