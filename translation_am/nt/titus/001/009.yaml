  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: am
  text: በትምህርቱ መሠረት የሆነውን የሚታመን ቃል[a] አጥብቆ የሚይዝ ሊሆን ይገባል፤ ይህም በጤናማው ትምህርት ሊመክርና የሚቃወሙትንም ሊገሥጽ[b] እንዲችል ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በትምህርቱ መሠረት ያለውን ታማኝ ቃል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የሚቃወሙትን ውድቅ ሊያደርግ።” የግሪኩ ግስ ከመገሠጽ ባሻገር ስሕተትን ማጋለጥ ወይም ሰው ስሕተተኛ መሆኑን ማሳየት የሚለውን ፍቺ ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: አጥብቆ የሚይዝ
