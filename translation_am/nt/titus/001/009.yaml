- source_word: πιστοῦ λόγου
  choice: የታመነ ቃል
  rationale: πιστός እዚህ ቃሉ እምነት የሚጣልበትና አስተማማኝ መሆኑን ይገልጣል፤ λόγος ደግሞ ‘ቃል’ ተብሎ ተጠብቋል።
- source_word: κατὰ τὴν διδαχήν
  choice: በትምህርቱ መሠረት የሆነውን
  rationale: κατά ከተወሰነ ትምህርት ጋር መስማማትን ያመለክታል፤ የተወሰነው አመልካች ቅጥያም በ‘ትምህርቱ’ ተጠብቋል።
- source_word: παρακαλεῖν
  choice: ሊመክር
  rationale: በዚህ የአመራርና የማስተማር አውድ ውስጥ ቃሉ ሰዎችን በትምህርት ማበረታታትንና በጽናት መጥራትን ያካትታል፤ ‘ሊመክር’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: በጤናማው ትምህርት
  rationale: ὑγιαίνω በዘይቤያዊ አጠቃቀሙ ጤናማና ከስሕተት የጸዳ መሆንን ይገልጣል፤ የጤንነት ዘይቤው ተጠብቋል።
- source_word: ἀντιλέγοντας
  choice: የሚቃወሙትን
  rationale: ተሳቢው በቃል የሚከራከሩትን ወይም ትምህርቱን የሚቃወሙትን ሰዎች ያመለክታል፤ ነገሩን በግልጽ ሳይጨምር የግሪኩን አጠቃላይነት ይጠብቃል።
- source_word: ἐλέγχειν
  choice: ሊገሥጽ
  rationale: ቃሉ ስሕተትን ማጋለጥ፣ ስሕተተኛነትን ማስረዳትና በማረም መገሠጽን ሊያካትት ይችላል፤ ዋናው ጽሑፍ የእረኝነት ማረሚያ ኃይሉን ያሳያል፣ ሌላው ገጽታ በማስታወሻ ተጠብቋል።
- source_word: δυνατὸς ᾖ
  choice: እንዲችል
