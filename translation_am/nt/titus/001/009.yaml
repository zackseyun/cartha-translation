theological_decisions:
- issue: ‘ትምህርቱ’ እና ‘የታመነ ቃል’ የሚያመለክቱት
  choice: ለቤተ ክርስቲያን መሪዎች የተሰጠውንና የታወቀውን የክርስቲያን ትምህርት ያመለክታሉ።
  alternative: አጠቃላይ የሥነ ምግባር ትምህርትን ብቻ ሊያመለክት ይችላል።
  rationale: በδιδαχή ላይ ያለው የተወሰነ አመልካችና በእረኛ መልእክቶች ውስጥ የπιστὸς λόγος አጠቃቀም የተረጋጋ የክርስቲያን ትምህርትን ይጠቁማሉ፤ ትርጉሙ ከጽሑፉ በኋላ የተፈጠሩ ቴክኒካዊ የዶግማ ምድቦችን አያስገባም።
- issue: ἐλέγχειν ለተቃዋሚዎች ያለው ኃይል
  choice: ስሕተትን በማጋለጥ የማረምና የመገሠጽ ኃይሉን ‘ሊገሥጽ’ በማለት ማስተላለፍ።
  alternative: ስሕተታቸውን ሊያስረዳ ወይም ክርክራቸውን ውድቅ ሊያደርግ።
  rationale: አውዱ አዎንታዊ ምክርንና ተቃውሞን የሚያርም ምላሽን አብሮ ያቀርባል፤ ዋናው ትርጉም የእረኝነት ማረሚያ ኃይሉን ሲጠብቅ የ‘ማስረዳት/ውድቅ ማድረግ’ ገጽታ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጤናማ ትምህርት’ የምንጩን የጤንነት ዘይቤ ይጠብቃል፤ ‘ሊመክር’ እና ‘ሊገሥጽ’ ደግሞ የአዎንታዊ ማስተማርና የማረም ሚዛንን ያሳያሉ።
