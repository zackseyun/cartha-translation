  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: am
  text: ለንጹሓን ሁሉም ነገር ንጹሕ ነው፤ ለተረከሱትና ለማያምኑት ግን ንጹሕ የሆነ ምንም ነገር የለም።[a] ከዚህ ይልቅ፣ አእምሯቸውም ሕሊናቸውም ተረክሰዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ንጹሕ” የሚለው የግሪክ ቃል በቁጥሩ ሁሉ ሥርዓታዊ ንጽሕናን እና ሥነ ምግባራዊ ንጽሕናን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ሁሉም ነገር
  rationale: የግሪኩን አጠቃላይ ወሰንና የአባባሉን አጭር ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: ንጹሕ / ንጹሓን
  rationale: “ንጹሕ” ሥርዓታዊ ንጽሕናን ሥነ ምግባራዊ ንጽሕናን ሊያመለክት ስለሚችል የግሪኩን ድርብ ፍቺ ይጠብቃል፤ ተመሳሳዩ ቃል በመላው ቁጥር ተይዟል።
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: ለረከሱት ግን
  rationale: የፍጹም ጊዜው አሳታፊ ቅርጽ የተፈጠረው ርኩሰት የቀጠለ ሁኔታ መሆኑን ያሳያል፤ “ረከሱት” ይህን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπίστοις
  choice: ለማያምኑት
  rationale: በዚህ አውድ የእምነት እጦትን በግልጽ ሁኔታ ያሳያል፤ “ታማኝ ያልሆኑ” የሚለውን ሌላ ሊሆን የሚችል ፍቺ በጽሑፉ ላይ አያስገድድም።
- source_word: οὐδὲν καθαρόν
  choice: ንጹሕ የሆነ ምንም ነገር የለም
  rationale: ከመጀመሪያው ሐረግ ጋር ያለውን ቃላዊ ትይዩነት ይጠብቃል።
- source_word: ἀλλὰ
  choice: ከዚህ ይልቅ
  rationale: የውጫዊ ነገሮች ንጽሕና ሳይሆን የውስጣዊ ሰው ርኩሰት ዋናው ጉዳይ መሆኑን የሚያሳየውን ጠንካራ ንጽጽር ያቀርባል።
- source_word: μεμίανται
  choice: ረክሷል
  rationale: የፍጹም ጊዜውን የቀጠለ ውጤታዊ ሁኔታ ያሳያል፤ ነጠላው ግስ ሁለቱን ተያያዥ ስሞች በተፈጥሯዊ አማርኛ ያስተዳድራል።
- source_word: νοῦς
  choice: አእምሮ
  rationale: የማሰብና የመረዳት ችሎታን የሚያመለክት መደበኛና በቀላሉ የሚገባ ቃል ነው።
- source_word: συνείδησις
  choice: ሕሊና
  rationale: የሰውን ውስጣዊ ሥነ ምግባራዊ ምስክርነትና ፍርድ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ ... καὶ
  choice: አእምሯቸውም ሕሊናቸውም
  rationale: የግሪኩን “ሁለቱም” አጽንዖት በአማርኛው ተያያዥ “-ም ... -ም” መዋቅር ያሳያል።
theological_decisions:
- issue: የንጽሕና ቋንቋ ወሰን
  choice: καθαρός በመላው ቁጥር “ንጹሕ” ተብሎ ተተርጉሟል።
  alternative: “ንጹሕ/ንጽሕና”ን በሥርዓታዊ ንጽሕና ብቻ መወሰን።
  rationale: አውዱ ከአይሁድ ሥርዓቶችና ከንጽሕና ጉዳዮች ጋር ቢያያዝም፣ ንግግሩ ወደ አእምሮና ሕሊና ይሰፋል። “ንጹሕ” የሥርዓታዊና የሥነ ምግባራዊ ትርጉም ውጥረቱን ሳይፈታ ይጠብቃል።
- issue: የἀπίστοις ትርጉም
  choice: “ለማያምኑት” ተብሎ ተተርጉሟል።
  alternative: “ለማይታመኑት” ወይም “እምነት ለሌላቸው”።
  rationale: ከእውነተኛ እምነት ጋር ያለው ንጽጽር በዚህ አውድ ዋና ነው፤ ሆኖም ጽሑፉን ወደ አንድ የቤተ እምነት ትርጓሜ አይገድብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመጀመሪያውና የሁለተኛው ሐረግ ትይዩ አወቃቀር ተጠብቋል፤ “ንጹሕ” እና “ረከሰ” የሚሉት ዋና ቃላትም በጽሑፉ ውስጥ በወጥነት ቀርበዋል።
