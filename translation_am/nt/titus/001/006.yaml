- source_word: τέκνα
  choice: ልጆች
  rationale: በቤተሰብ አውድ ውስጥ ተፈጥሯዊና የተለመደ የአማርኛ አቻ ነው።
- source_word: πιστά
  choice: ታማኝ
  rationale: ቃሉ ታማኝነትን ወይም አማኝነትን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ ሰፊውን ትርጉም ይይዛል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: በሴሰኝነት የማይከሰሱ
  rationale: የክስን ሐሳብ በግልጽ ይጠብቃል፤ ሴሰኝነት ደግሞ ከቁጥጥር ውጭ የሆነንና የተበላሸን አኗኗር በአጭሩ ያመለክታል።
- source_word: ἀνυπότακτα
  choice: የማያምፁ
  rationale: ለሥርዓትና ለተገቢ ሥልጣን አለመገዛትን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በτέκνα ἔχων πιστά ውስጥ የπιστά ትርጉም
  choice: ታማኝ ልጆች
  alternative: አማኝ ልጆች
  rationale: πιστά በዚህ አውድ ሥነ ምግባራዊ ታማኝነትን ወይም በክርስቶስ ማመንን ሊያመለክት ይችላል። ዋናው ጽሑፍ ሰፊውን ንባብ ሲይዝ አማራጩ በማስታወሻ ተገልጧል።
- issue: የμιᾶς γυναικὸς ἀνήρ ኃይል
  choice: የአንዲት ሚስት ባል
  alternative: ለአንዲት ሴት ብቻ ታማኝ የሆነ ወንድ
  rationale: ግልጽ ትርጉሙ የግሪኩን አወቃቀር ይጠብቃል፤ ሐረጉ ብዙ ሚስት ስለማግባት፣ ስለጋብቻ ሁኔታ፣ ስለድጋሚ ጋብቻ ወይም ስለጾታዊ ታማኝነት የሚያስነሳቸውን ክርክሮች በግድ አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሐረጉ ከቁጥር 5 የሚቀጥል የሽማግሌ መመዘኛ በመሆኑ በኮማ ተዘግቷል። የእንግሊዝኛው የማስታወሻ ምልክቶች ከይዘታቸው ጋር የተዛቡ ስለነበሩ፣ ከግሪክ ምንጭ ጋር በሚዛመድ ቦታ እንደገና ተደርድረዋል።
