  text: ነቀፋ የማይገኝበት፣ የአንዲት ሚስት ባል[a]፣ በብልግና የማይከሰሱና የማያምፁ ታማኝ ልጆች[b] ያሉት ሰው ቢኖር፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለአንዲት ሴት ብቻ ታማኝ የሆነ ወንድ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አማኝ ልጆች።” የግሪኩ ቃል πιστά “ታማኝ” ወይም “አማኝ” ማለት ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: ነቀፋ የማይገኝበት
  rationale: ሕጋዊ ክስን ብቻ ሳይሆን ትክክለኛ የነቀፋ ምክንያት የሌለበትን ሰው ያመለክታል፤ ፍጹም ኃጢአት አልባነትን አያስገባም።
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: የአንዲት ሚስት ባል
