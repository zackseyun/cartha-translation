  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: am
  text: ይህ ምስክርነት እውነት ነው። ስለዚህም በጥብቅ ገሥጻቸው፤ በእምነት ጤናማ እንዲሆኑ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በእምነት ጤናማ» የሚለው ሐረግ በራሳቸው እምነት ጤናማ መሆናቸውን ወይም በክርስቲያናዊው እምነት እንደ አስተምህሮ ጤናማ መሆናቸውን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: ምስክርነት
  rationale: ቀደም ሲል ስለ ቀርጤስ ሰዎች የተጠቀሰውን የምስክር ንግግር ያመለክታል፤ «ንግግር» ከሚለው ይልቅ የማስረጃነቱን ስሜት ይጠብቃል።
- source_word: ἀληθής
  choice: እውነት ነው
  rationale: ምስክርነቱ ከእውነታ ጋር የሚስማማ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δι’ ἣν αἰτίαν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚነሳውን ምክንያታዊ ድምዳሜ በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: ἔλεγχε
  choice: ገሥጻቸው
  rationale: ስሕተትን በቀጥታ የመጋፈጥና የማረም ኃይል ያለውን የአሁን ጊዜ ትእዛዝ ያስተላልፋል።
- source_word: ἀποτόμως
  choice: አጥብቀህ
  rationale: የግሣጹን ጥብቅነት ያሳያል፤ ነገር ግን ቅጣትን ከልክ በላይ አያጎላም።
- source_word: ὑγιαίνωσιν
  choice: ጤናማ እንዲሆኑ
  rationale: የጤንነትን ዘይቤ ጠብቆ በመንፈሳዊና በትምህርታዊ ሁኔታ የጸኑ መሆንን ይገልጣል።
- source_word: ἐν τῇ πίστει
  choice: በእምነት
  rationale: የግሪኩን አገላለጽ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል፤ ሐረጉ የግል እምነትንም ሆነ እንደ እምነት አስተምህሮ የተያዘውን ይዘት ሊያመለክት የሚችለውን አሻሚነት በማስታወሻ ይጠብቃል።
theological_decisions:
- issue: የἐν τῇ πίστει ትርጉም
  choice: በእምነት
  alternative: በክርስቲያናዊው እምነት ማለትም በእምነት አስተምህሮ
  rationale: በእረኛ መልእክቶች ዐውድ ሐረጉ የክርስቲያናዊ እምነትን ይዘት ሊያመለክት ይችላል፤ ሆኖም የአማርኛው «በእምነት» የግል ማመንንም አያስቀርም። ስለዚህ የግሪኩ እውነተኛ አሻሚነት በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ገሥጻቸው» የጽሑፍ ክብርን እየጠበቀ በስፋት የሚገባ ሲሆን፣ «አጥብቀህ» የἀποτόμωςን ጥብቅ ኃይል በተፈጥሯዊ አገላለጽ ያቀርባል።
