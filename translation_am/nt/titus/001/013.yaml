review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders μαρτυρία, ἀληθής, the causal inference, the imperative to rebuke, and the purpose clause. However, አጥብቀህ can readily mean “diligently/earnestly” and does not as precisely convey the severity or sharpness of ἀποτόμως as በጥብቅ.
  naturalness: The Amharic is clear and appropriately formal. Placing the purpose clause after the imperative more naturally follows the Greek progression and makes the command easier to process. በጥብቅ ገሥጻቸው is idiomatic modern standard Amharic.
  terminology: ምስክርነት, ገሥጻቸው, and በእምነት ጤናማ እንዲሆኑ appropriately preserve the source’s terminology and metaphor. The note should distinguish the two possible referents of “faith” without presenting the main reading itself as merely an alternative.
  issues:
  - severity: medium
    issue: Rendering of ἀποτόμως
    rationale: አጥብቀህ may describe earnestness or diligence rather than the stern, severe manner indicated by ἀποτόμως. በጥብቅ more directly conveys “sharply/strictly.”
  - severity: low
    issue: Footnote wording
    rationale: The footnote’s first quoted option is nearly identical to the main text but adds a possessive pronoun. It can more clearly explain that the ambiguity concerns whether ἐν τῇ πίστει refers to their own believing or to the Christian faith as a body of teaching.
