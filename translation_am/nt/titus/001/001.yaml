  alternative: “በእምነትና በእውቀት መሠረት” ብሎ ማቅረብ
  rationale: አገባቡ አጭርና ተለዋዋጭ ቢሆንም፣ በዚህ አውድ የተልእኮ አቅጣጫው ይበልጥ የተፈጥሮ ነው፤ ከአገባቡ በላይ የሆነ ሥነ መለኮታዊ ሥርዓት አይጫንም።
