  rationale: መለኮታዊ ምርጫን ያሳያል፣ ሆኖም ከግሪኩ በላይ የሆነ የቡድን ትምህርት አይወስንም።
- issue: κατὰ πίστιν ... καὶ ἐπίγνωσιν ከሐዋርያነት ጋር ያለው ግንኙነት
