- source_word: τῆς κατ’ εὐσέβειαν
  choice: እግዚአብሔርን ከማክበር ጋር የሚስማማውን
  rationale: κατά የሚገልጸውን የመስማማት ግንኙነት ይጠብቃል፤ የውጤት ትርጉሙን ግን በማስታወሻ ያቀርባል።
