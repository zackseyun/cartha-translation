  rationale: የተመረጠው አባባል የግሪኩን የሥነ ምግባር ገለጻ በቀጥታ ያቀርባል፤ ጽሑፉ በቀጥታ ያላለውን ‘አይችልም’ የሚል የችሎታ መግለጫ አይጨምርም።
