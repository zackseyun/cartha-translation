lexical_decisions:
- source_word: ὅτε δὲ
  choice: ነገር ግን ... በተገለጠ ጊዜ
  rationale: ὅτε የጊዜ ንዑስ ሐረግን ያስገባል፤ δέ ደግሞ ከቀደመው የሰው ኃጢአተኝነት መግለጫ ወደ እግዚአብሔር የማዳን ተግባር የሚደረገውን መጠነኛ ንጽጽራዊ ሽግግር ያሳያል።
- source_word: χρηστότης
  choice: ቸርነት
  rationale: ቃሉ በግንኙነት የሚታይን ደግነት፣ መልካምነት ወይም በጎ አድራጎት ያመለክታል፤ «ቸርነት» በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው ነው።
- source_word: φιλανθρωπία
  choice: ለሰዎች ያለው ፍቅር
  rationale: φιλανθρωπία ለሰው ልጆች የሚደረግን በጎነትና ፍቅር ያመለክታል። ይህ አተረጓጎም ከχρηστότης ጋር ሳያዋህደው ትርጉሙን ግልጽ ያደርጋል።
- source_word: ἐπεφάνη
  choice: ተገለጠ
  rationale: የአውሪስጦስ ቅርጹ መታየትን ወይም በግልጽ መገለጥን ያሳያል። «ተገለጠ» የመገለጥን ስሜት ይጠብቃል፤ የመገለጡን መንገድ ግን አይወስንም።
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: የአዳኛችን የእግዚአብሔር
  rationale: የግሪኩ የባለቤትነት ሐረግ ሁለቱንም ስሞች—ቸርነትና ፍቅር—ይገዛል። ይህ ቅርጽ «እግዚአብሔር»ን እንደ «አዳኛችን» ያቀርባል፤ የሐረጉን ክብደትም ይጠብቃል።
theological_decisions:
- issue: «እግዚአብሔር አዳኛችን» የሚለው ማንን እንደሚያመለክት
  choice: ትርጉሙ «የአዳኛችን የእግዚአብሔር» በማለት መለኮታዊውን ማዕረግ ይጠብቃል፤ በዚህ ቁጥር እግዚአብሔርን አብን እንደሚያመለክት ከአውዱ ሊታይ ቢችልም በትርጉሙ ውስጥ ተጨማሪ መግለጫ አልገባም።
  alternative: ሐረጉን በዚህ ቁጥር ብቻ ለአንድ መለኮታዊ አካል ሳይወስኑ አጠቃላይ መለኮታዊ ማዕረግ አድርጎ ማንበብ።
  rationale: በእረኛ መልእክቶች «እግዚአብሔር አዳኛችን» ብዙ ጊዜ አብን ያመለክታል፤ «አዳኝ» የሚለው ማዕረግ ግን ለኢየሱስ ክርስቶስም ይሰጣል። ቁጥር 6 ኢየሱስ ክርስቶስን ለይቶ ይጠቅሳል፤ ስለዚህ ትርጉሙ ማዕረጉን ሳያዳክም አካላቱንም ሳያዋህድ የምንጩን አነጋገር ይጠብቃል።
