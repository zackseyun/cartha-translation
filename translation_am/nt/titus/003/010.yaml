theological_decisions:
- issue: αἱρετικὸν በኋለኛው ቴክኒካዊ የእምነት ስሕተት ቃል ይተርጎም ወይስ በክፍፍል ፈጣሪነት ስሜት?
  choice: ከፋፋይ የሆነን
  alternative: መናፍቅ የሆነን / ወገን የሚፈጥርን
  rationale: የመጀመሪያውን ክፍለ ዘመን የቃሉን ሰፊ የወገንተኝነትና የክፍፍል ስሜት ይጠብቃል፤ ጽሑፉ በግልጽ ያላስቀመጠውን ኋለኛ ቴክኒካዊ የመናፍቅነት ምድብ አያስገባም።
translation_notes:
