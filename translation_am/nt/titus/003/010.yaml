lexical_decisions:
- source_word: αἱρετικὸν
  choice: ከፋፋይ የሆነን
  rationale: በዚህ ዐውድ ቃሉ በኋለኛው የቤተ ክርስቲያን ቴክኒካዊ ትርጉም ‘መናፍቅ’ ከማለት ይልቅ ወገንተኝነትንና ክፍፍልን የሚፈጥር ሰውን ያመለክታል።
- source_word: ἄνθρωπον
