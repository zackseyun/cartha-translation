  rationale: የግሪኩ ቃል በሰዋስው ተባዕታይ ነጠላ ቢሆንም፣ በዚህ ዐውድ ግለሰብን በአጠቃላይ ያመለክታል፤ ‘ሰው’ በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: አንድ ጊዜና ሁለተኛ ጊዜ ካስጠነቀቅኸው በኋላ
