- source_word: ζωῆς αἰωνίου
  choice: የዘላለም ሕይወት
  rationale: የተስፋውን ይዘት የሚገልጽና በዘመናዊ አማርኛ የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: የδικαιωθέντες ትርጉም
  choice: ጸድቀን
  alternative: ጻድቃን ተብለን
  rationale: ‘ጸድቀን’ ከδικαιόω ጋር ያለውን ዋና የቃል ግንኙነት ይጠብቃል፤ ‘ጻድቃን ተብለን’ የፍርድ አዋጅን ገጽታ ይበልጥ የሚያጎላ ትርጉም ስለሆነ በማስታወሻ ቀርቧል።
- issue: የἐκείνου ተሳቢ
  choice: እርሱ—በአውዱ የተጠቀሰው መለኮታዊ አዳኝ
  alternative: በግልጽ ‘እግዚአብሔር’ ወይም ‘ኢየሱስ ክርስቶስ’ ማለት
  rationale: ግሪኩ በዚህ ሐረግ ስምን በግልጽ አይደግምም፤ ‘እርሱ’ የሚለው ያንኑ የማጣቀሻ ስፋት ይጠብቃል።
- issue: የκατ’ ἐλπίδα ከውርስ ጋር ያለው ግንኙነት
  choice: በዘላለም ሕይወት ተስፋ መሠረት ወራሾች
  alternative: የዘላለም ሕይወትን ተስፋ በማድረግ ወራሾች
  rationale: ዋናው ትርጉም κατάን በመዋቅራዊ ቅርበት ይጠብቃል፤ ተለዋጩ ግን ሐረጉን እንደ ተስፋ ያለበት ሁኔታ ያቀርባል።
