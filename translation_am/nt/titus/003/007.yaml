  to: በእርሱ ጸጋ ጸድቀን፣[a] የዘላለም ሕይወት ተስፋ ያላቸው ወራሾች እንድንሆን ዘንድ ነው።
  rationale: The revision replaces the calqued “በ…ተስፋ መሠረት” with an idiomatic expression that preserves the Greek link between being heirs and the hope of eternal life. Footnote b is retained as a legitimate more formally compact alternative, and its anchor is moved to the relevant phrase.
