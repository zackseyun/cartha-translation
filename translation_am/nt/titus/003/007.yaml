  choice: እንሆን ዘንድ
  rationale: የዓላማን ወይም የውጤትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δικαιωθέντες
  choice: ጸድቀን
  rationale: የδικαιόωን ቁልፍ ሥነ መለኮታዊ ቃልና ከዋናው ግስ በፊት የሆነውን ድርጊት ይጠብቃል፤ ተለዋጩ ትርጉም በማስታወሻ ቀርቧል።
- source_word: τῇ ἐκείνου χάριτι
  choice: በእርሱ ጸጋ
  rationale: መሣሪያዊውን የዳቲቭ አገባብ ይገልጣል፤ ‘እርሱ’ ተውላጠ ስሙን ከግሪኩ በላይ ሳይገልጽ ይተዋል።
- source_word: κληρονόμοι
