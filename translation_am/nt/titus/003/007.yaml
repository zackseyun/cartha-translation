  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጸጋ፣ ጸድቀን፣ ወራሾች’ የሚሉት የመጽሐፍ ቅዱስ ቁልፍ ቃላት ተጠብቀዋል፤ ሆኖም አረፍተ ነገሩ በዘመናዊ አገባብ ተዋቅሯል።
