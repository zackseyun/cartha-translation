review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the purpose clause, the passive and antecedent sense of δικαιωθέντες, grace as the means, and the inheritance imagery. However, “በ…ተስፋ መሠረት” is an overly literal and somewhat unnatural rendering of κατ’ ἐλπίδα; it can suggest that hope is the basis or ground of inheritance. In this context the phrase more naturally conveys heirship characterized by, or held in, the hope of eternal life.
  naturalness: “በእርሱ ጸጋ ጸድቀን” is understandable and suitably biblical in register. The latter phrase, “በዘላለም ሕይወት ተስፋ መሠረት,” is not idiomatic modern standard Amharic. Recasting it as “የዘላለም ሕይወት ተስፋ ያላቸው ወራሾች” is clear and natural.
  terminology: Retain “ጸድቀን,” “ጸጋ,” and “ወራሾች.” They preserve established biblical terminology without imposing a doctrinal explanation. The pronoun “እርሱ” appropriately leaves the antecedent no more explicit than the Greek does.
  issues:
  - severity: medium
    issue: The rendering of κατ’ ἐλπίδα as “በ…ተስፋ መሠረት” is awkward and may alter the relationship of hope to heirship.
    rationale: “መሠረት” can imply that hope is the ground on which one becomes an heir. The Greek idiom is better represented by heirship held in/characterized by the hope of eternal life.
  - severity: low
    issue: Footnote b's alternative is less natural than the revised main rendering.
    rationale: “የዘላለም ሕይወትን ተስፋ በማድረግ” can sound as though hoping is the means of becoming heirs. A footnote should instead explain the possible concise rendering “በ…ተስፋ.”}],
