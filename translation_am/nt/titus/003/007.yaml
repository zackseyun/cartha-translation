- source_word: γενηθῶμεν
  choice: እንሆን
  rationale: ወደ አዲስ ሁኔታ ወይም ማዕረግ መግባትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κατ’ ἐλπίδα
  choice: በ…ተስፋ መሠረት
