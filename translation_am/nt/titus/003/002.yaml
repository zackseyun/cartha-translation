  terminology: “እንዳይሰድቡ” suitably represents interpersonal βλασφημεῖν, with the broader harmful-speech sense retained in the footnote. “ልዝብ” and “የዋህነት” distinguish ἐπιεικεῖς from πραΰτης without forcing a doctrinal distinction. “ለሰው ሁሉ” naturally renders the generic and comprehensive πάντας ἀνθρώπους.
