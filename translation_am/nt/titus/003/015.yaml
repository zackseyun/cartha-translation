  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: am
  text: 'ከእኔ ጋር ያሉት ሁሉ ሰላምታ ያቀርቡልሃል። በእምነት[a] የሚወዱንን ሰላምታ አቅርብላቸው። ጸጋ ከሁላችሁ ጋር ይሁን።


    [a] ወይም፣ “በእምነት ውስጥ”፤ አለዚያም፣ “በታማኝነት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእምነት ውስጥ”፤ አለዚያም፣ “በታማኝነት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: ሰላምታ ያቀርቡልሃል
  rationale: በደብዳቤ መዝጊያ የሚገኘውን የሰላምታ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: ከእኔ ጋር ያሉት ሁሉ
  rationale: μετά የሚገልጸውን አብሮነትና πάντες የሚገልጸውን ሙሉ አካታችነት ይጠብቃል።
- source_word: ἄσπασαι
  choice: ሰላምታ አቅርብላቸው
  rationale: የግል ነጠላ ትእዛዙንና የደብዳቤ ሰላምታውን በግልጽ አማርኛ ያቀርባል።
- source_word: φιλοῦντας
  choice: የሚወዱንን
  rationale: φιλέω የሚገልጸውን የግል ፍቅርና ቅርበት በቀጥተኛ ቃል ይገልጻል።
- source_word: ἐν πίστει
  choice: በእምነት
  rationale: በአማኞች መካከል ያለው ፍቅር የሚኖርበትን ወይም የሚመሠረትበትን የእምነት ሁኔታ ሳያጠብ ያስተላልፋል፤ ሌሎች እውነተኛ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ἡ χάρις
  choice: ጸጋ
  rationale: የጳውሎስን የተለመደ የበረከት መዝጊያ በተለመደው መጽሐፍ ቅዱሳዊና ዘመናዊ አማርኛ ያቀርባል።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር ይሁን
  rationale: በግሪክኛው የተገመተውን ግስ በአማርኛ ግልጽ ያደርጋል፤ πάντων የሚገልጸውን ‘ሁሉ’ ይጠብቃል።
theological_decisions:
- issue: በἐν πίστει ውስጥ πίστις የሚለው ቃል አተረጓጎም
  choice: በእምነት
  alternative: በእምነቱ፤ በታማኝነት
  rationale: እዚህ ‘እምነት’ የጋራ ክርስቲያናዊ እምነትን እንደ ፍቅሩ ሉል ወይም መሠረት ሊገልጽ ይችላል። የግሪክኛው ሐረግ ‘እምነቱ’ ወይም ‘ታማኝነት’ የሚሉትንም አማራጮች ስለሚፈቅድ እነሱ በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ለቲቶ የተነገረው ነጠላ ወንድ ሁለተኛ መደብ ‘ልሃል/አቅርብላቸው’ ተጠብቋል፤ የመጨረሻው በረከት ግን ብዙ ተቀባዮችን ‘ሁላችሁ’ ብሎ ያካትታል።
