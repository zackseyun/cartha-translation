  rationale: ምንባቡ የቀድሞውን የሥነ ምግባር እስራት በጠንካራ የባርነት ቋንቋ ይገልጣል። ይህን ኃይል ማስጠበቅ ጽሑፉን ይከተላል እንጂ ተጨማሪ የእምነት ሥርዓት አያስገባም።
- issue: στυγητοί ንቁ ወይም ተገብሮ መሆኑ
  choice: የተጠላን
  alternative: የምናስጠላ
  rationale: የግሪኩ ቅጽ ሁለቱንም «የተጠሉ» እና «የሚያስጠሉ/አስጸያፊ» ትርጉሞች ሊይዝ ስለሚችል አንዱ በዋናው ጽሑፍ፣ ሌላው በግርጌ ማስታወሻ ቀርቧል።
