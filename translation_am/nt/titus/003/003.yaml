base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: am
  text: እኛ ራሳችንም ቀድሞ ማስተዋል የጎደለን፣ የማንታዘዝ፣ የተሳሳትን[a]፣ በተለያዩ ምኞቶችና ደስታዎች ባርነት የተያዝን፣ በክፋትና በቅናት ሕይወታችንን የምናሳልፍ፣ አስጸያፊ የሆንን[b]፣ እርስ በርሳችንን የምንጠላ ነበርንና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የተታለልን»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የተጠላን»። የግሪኩ ቃል «አስጸያፊ/የሚያስጠሉ» ወይም «የተጠሉ» ተብሎ ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: እኛ ራሳችንም ቀድሞ ... ነበርንና
  rationale: καὶ ἡμεῖς ያለውን አካታች አጽንዖት «እኛ ራሳችንም» ያስጠብቃል፤ ποτεን «ቀድሞ»፣ γάρንም ከቀደመው ንግግር ጋር በሚያገናኘው የአማርኛ መደምደሚያ «-ና» ይገልጣል።
- source_word: ἀνόητοι
  choice: ማስተዋል የጎደለን
  rationale: የአእምሮና የሥነ ምግባር አለማስተዋልን በተፈጥሯዊና ባልተጋነነ አማርኛ ያሳያል።
- source_word: ἀπειθεῖς
  choice: የማንታዘዝ
  rationale: ያለመታዘዝንና ለማሳመን እምቢተኛ መሆንን በዐውደ ንባቡ ተስማሚ በሆነ አገላለጽ ያቀርባል።
- source_word: πλανώμενοι
  choice: የተሳሳትን
  rationale: የግሪኩን ተገብሮ/መካከለኛ ትርጉም ሳያጠብ ከትክክለኛው መንገድ መሳትን ይገልጣል።
- source_word: δουλεύοντες
  choice: ባርያ የሆንን
  rationale: ቃሉ ከምኞቶችና ከደስታዎች በታች ያለን ጠንካራ ተገዢነትና እስራት ያሳያል፤ «የምናገለግል» ከሚለው ይልቅ የባርነቱን ኃይል ይጠብቃል።
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: ለተለያዩ ምኞቶችና ደስታዎች
  rationale: ἐπιθυμίαን በወሲባዊ ምኞት ብቻ ሳይገድብ «ምኞቶች» ይላል፤ ποικίλαις የሁለቱንም ስሞች ልዩ ልዩነት ያመለክታል።
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: በክፋትና በቅናት ሕይወታችንን የምናሳልፍ
  rationale: διάγω የሕይወትን ቀጣይ አኗኗር ያሳያል፤ κακία በዚህ የግንኙነት ክፉ ባሕርያት ዝርዝር ውስጥ «ክፋት» ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: στυγητοί
  choice: የተጠላን
  rationale: ቃሉ በተገብሮ «የተጠሉ» ወይም በንቁ «የሚያስጠሉ» ሊገባ ይችላል። ዋናው ጽሑፍ ተገብሮውን አማራጭ ይዟል፣ ሌላውም በማስታወሻ ተጠብቋል።
- source_word: μισοῦντες ἀλλήλους
  choice: እርስ በርሳችንም የምንጠላ
  rationale: ተደጋጋሚውን ግንኙነትና የአሁን ጊዜ አሳታፊውን ቀጣይነት በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
