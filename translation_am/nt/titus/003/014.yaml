- source_word: καλῶν ἔργων
  choice: በመልካም ሥራዎች
  rationale: በቲቶ መልእክት የተደጋገመውን የሥነ ምግባርና የተግባር አገልግሎት አጽንዖት በግልጽ ያቆያል።
- source_word: προΐστασθαι
  choice: መጠመድን
  rationale: ግሱ መምራት፣ መንከባከብ፣ መሰማራት ወይም ራስን መስጠት ሊያመለክት ይችላል። በዚህ አገባብ ‘መጠመድ’ በመልካም ሥራ ላይ በቀጣይነትና በንቃት መሳተፍን ያሳያል፣ የቤተ ክርስቲያን የሥልጣን መሪነትን ግን አያስገባም።
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: አስፈላጊ ፍላጎቶችን ለማሟላት
  rationale: መልካም ሥራዎቹ ተጨባጭና አስፈላጊ የሆኑ ፍላጎቶችን የማሟላት ዓላማ እንዳላቸው በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: ፍሬ ቢስ እንዳይሆኑ
  rationale: የዓላማውን አንቀጽና የግሪኩን ‘ፍሬ የሌለው’ ዘይቤ ሳይተረጉም ያቆያል።
theological_decisions:
- issue: የοἱ ἡμέτεροι ወሰን
