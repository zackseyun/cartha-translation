  rationale: ሐረጉ የግንኙነትና የማኅበር መግለጫ እንጂ የተወሰነ የፆታ ቡድን ወይም ትምህርተ እምነታዊ ምድብ አይደለም።
- issue: የπροΐστασθαι ትርጉም
  choice: በመልካም ሥራዎች በንቃትና በቀጣይነት መጠመድ።
  alternative: መልካም ሥራዎችን በመምራት ፊት መሆን።
  rationale: ግሱ የመሪነትን ትርጉም ሊይዝ ቢችልም፣ ከκαλῶν ἔργων ጋር በዚህ አገባብ ዋናው አጽንዖት በመልካም ሥራ ራስን መስጠትና መሰማራት ላይ ነው፤ ተለዋጩ ግን በግርጌ ማስታወሻ ተጠብቋል።
