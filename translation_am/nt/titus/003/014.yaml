lexical_decisions:
- source_word: μανθανέτωσαν
  choice: ይማሩ
  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዛዊ አኳኋንን በተፈጥሯዊ የአማርኛ ምክርና ትእዛዝ አገላለጽ ያስተላልፋል።
