  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: am
  text: ነገር ግን ከሞኝ ክርክሮች[a]፣ ከዘር ሐረጎች፣ ከጠቦችና ሕግን ከሚመለከቱ ክርክሮች[b] ራቅ፤ እነዚህ የማይጠቅሙና ከንቱ ናቸውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሞኝነት ውዝግቦች” ወይም “የሞኝነት ጥያቄዎች።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ሕጋዊ ክርክሮች”፤ ማለትም ሕግን የሚመለከቱ ክርክሮች።
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: የሞኝነት ክርክሮች
  rationale: ζητήσεις በዚህ አውድ ገለልተኛ ጥያቄዎችን ሳይሆን አከራካሪ ምርመራዎችን ወይም ውዝግቦችን ያመለክታል፤ ይህ አገላለጽ የμωράςን ሞኝነትና ተግባራዊ ጥቅም አልባነት ይጠብቃል።
- source_word: γενεαλογίας
  choice: የትውልድ ሐረጎች
  rationale: የዘር ወይም የትውልድ ተከታታይነትን በቀጥታ የሚያመለክት ተፈጥሯዊ የአማርኛ አቻ ሲሆን የተወሰነ ታሪካዊ ሥርዓት አይጨምርበትም።
- source_word: ἔρεις
  choice: ጠብ
  rationale: ጠብ የግጭትንና የአለመግባባትን ሐሳብ በአጭሩ ያስተላልፋል፤ ከሚቀጥለው μάχας ጋር ያለውን የትርጉም መደራረብም ሙሉ በሙሉ አያጠፋም።
- source_word: μάχας νομικὰς
  choice: ሕግን የሚመለከቱ ክርክሮች
  rationale: μάχας በዚህ ስፍራ የአካል ውጊያን ሳይሆን የቃል ግጭትን ያመለክታል፤ νομικάς ክርክሮቹ ከሕግ ጋር የተያያዙ መሆናቸውን ይገልጣል።
- source_word: περιΐστασο
  choice: ራቅ
  rationale: የአሁን ጊዜ መካከለኛ ትእዛዝ ራስን ከእነዚህ ነገሮች ማራቅን ያዛል፤ ‘ራቅ’ አጭር፣ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: ἀνωφελεῖς
  choice: የማይጠቅሙ
  rationale: ምንም ጥቅም ወይም በጎ ውጤት የሌላቸው መሆኑን በዘመናዊ አማርኛ ግልጽ ያደርጋል።
- source_word: μάταιοι
  choice: ከንቱ
  rationale: ቃሉ ባዶነትን፣ ዓላማ አልባነትንና ፍሬ አልባነትን ያመለክታል፤ ‘ከንቱ’ ይህን በክብር ባለው የተለመደ ቋንቋ ይገልጣል።
theological_decisions:
- issue: የ‘ትውልድ ሐረጎች’ና ‘ሕግን የሚመለከቱ ክርክሮች’ ትክክለኛ ታሪካዊ ይዘት
  choice: ቃላቱን በአጠቃላይ ትርጉማቸው ማቅረብ
  alternative: የትውልድ ሐረጎቹን በተለይ ከአይሁድ የዘር ሐረግ ክርክር ወይም ከቀደምት ግኖስጢካዊ ግምቶች ጋር ማያያዝ
  rationale: ጥቅሱ ልማዶቹን ይጠቅሳል እንጂ የተወሰነ ታሪካዊ ወይም ሃይማኖታዊ ሥርዓት እንዲሆኑ አይገልጽም፤ ስለዚህ አሻሚነቱን መጠበቅ ተገቢ ነው።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የዝርዝሩን የንግግር ፍሰት ለመጠበቅ ‘ከ…፣ ከ…፣ ከ…’ የሚለው አወቃቀር ተመርጧል፤ የግሪኩ γάρ ምክንያታዊ ኃይል ‘ናቸውና’ በሚለው ተጠብቋል።
