source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: am
  text: 'ይህ ቃል የታመነ ነው። በእግዚአብሔር ያመኑት[b] መልካም ሥራዎችን ለማድረግ ትኩረት እንዲሰጡ፣ ስለ እነዚህ ነገሮች አጽንተህ እንድትናገር[a] እፈልጋለሁ። እነዚህ ነገሮች መልካምና ለሰዎች ጠቃሚ ናቸው።


    [a] ወይም፣ “በሙሉ እርግጠኝነት እንድትናገር” ወይም “አጥብቀህ እንድታረጋግጥ።”


    [b] ወይም፣ “እግዚአብሔርን ያመኑት” ወይም “በእግዚአብሔር የተማመኑት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሙሉ እርግጠኝነት እንድትናገር” ወይም “አጥብቀህ እንድታረጋግጥ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እግዚአብሔርን ያመኑት” ወይም “በእግዚአብሔር የተማመኑት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: ይህ ቃል የታመነ ነው
  rationale: በእረኛ መልእክቶች የሚገኘውን የታመነ አባባል ቀመር በተለመደና ክብር ባለው አማርኛ ያስተላልፋል፤ λόγος እዚህ አንድን ቃል ብቻ ሳይሆን ቀደም ያለውን መልእክት ያመለክታል።
- source_word: περὶ τούτων
  choice: ስለ እነዚህ ነገሮች
  rationale: የπερί ከጄኒቲቭ ጋር ያለውን ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: βούλομαί σε
  choice: እንድታረጋግጥ ... እፈልጋለሁ
  rationale: የግል ፍላጎትና መመሪያ የሚገልጸውን βούλομαι በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: διαβεβαιοῦσθαι
  choice: አጥብቀህ እንድታረጋግጥ
  rationale: ግሱ የሚያሳየውን ጠንካራና እርግጠኛ ማረጋገጥ ይይዛል፤ ሌሎች ተገቢ አገላለጾች በማስታወሻ ተጠብቀዋል።
- source_word: ἵνα φροντίζωσιν
  choice: እንዲጠነቀቁ
  rationale: በጥንቃቄ ማሰብንና ትኩረት መስጠትን ይገልጻል፤ የዓላማውን ንዑስ አረፍተ ነገርም በግልጽ ያሳያል።
- source_word: καλῶν ἔργων
  choice: መልካም ሥራዎችን
  rationale: የግሪኩን መደበኛ ሐረግ በግልጽ ይተረጉማል፤ ሥነ ምግባራዊና ተግባራዊ ስፋቱንም ይጠብቃል።
- source_word: προΐστασθαι
  choice: በትጋት ለመሥራት
  rationale: በዚህ አውድ ድርጅታዊ መሪነትን ሳይሆን በመልካም ሥራ ቀጣይነት ያለውን መሰማራትና መትጋት ያመለክታል።
- source_word: οἱ πεπιστευκότες θεῷ
  choice: በእግዚአብሔር ያመኑት
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ወደ እምነት ገብተው በዚያ ሁኔታ የሚኖሩትን ያሳያል፤ የዳቲቩን ቀጥተኛ ‘እግዚአብሔርን ማመን’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα
  choice: እነዚህ ነገሮች መልካምና ... ጠቃሚ ናቸው
  rationale: የግሪኩን ብዙ ቁጥር ጠብቆ የሥነ ምግባር መልካምነትንና ተግባራዊ ጥቅምን ይለያል።
- source_word: τοῖς ἀνθρώποις
  choice: ለሰዎች
  rationale: ἀνθρώποις ሁሉንም ሰው የሚያካትት በመሆኑ ‘ለሰዎች’ የፆታ ገደብ ሳያስገባ ግልጽ ያደርገዋል።
theological_decisions:
- issue: የእምነትና የመልካም ሥራ ግንኙነት
  choice: አስቀድመው ያመኑት በመልካም ሥራ እንዲተጉ እንደ ውጤት ተተርጉሟል።
  alternative: መልካም ሥራዎችን ለመዳን መሠረት አድርጎ ማቅረብ።
  rationale: የግሪኩ ቅደም ተከተል እምነትን ቀድሞ፣ መልካም ሥራን ደግሞ የታመኑት የሚሰማሩበት ውጤት አድርጎ ያቀርባል፤ ትርጉሙ ከዚህ በላይ የኑፋቄ መደምደሚያ አያክልም።
- issue: θεῷ ከπιστεύω ጋር ያለው ዳቲቭ
  choice: ዋናው ጽሑፍ ተፈጥሯዊውን ‘በእግዚአብሔር ያመኑት’ ይጠቀማል።
  alternative: ‘እግዚአብሔርን ያመኑት’ ወይም ‘በእግዚአብሔር የታመኑት።’
  rationale: የግሪኩ ዳቲቭ እግዚአብሔርን ማመን፣ በእርሱ ማመን ወይም መታመንን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ተፈጥሯዊነትን ሲጠብቅ እውነተኛውን የቃል ፍቺ ስፋት በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የዓላማ አወቃቀር በአማርኛ ግልጽ እንዲሆን የአንቀጾቹ ቅደም ተከተል በመጠኑ ተስተካክሏል፤ ጾታ የማይገድበው ἀνθρώποις ‘ሰዎች’ ተብሏል።
