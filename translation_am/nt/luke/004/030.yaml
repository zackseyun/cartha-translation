lexical_decisions:
- source_word: αὐτὸς
  choice: እርሱ
  rationale: በግሪኩ የተገለጸውንና ትንሽ አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል፤ “እርሱ ራሱ” ማለት ግን ከምንጩ በላይ አጽንዖት ሊጨምር ይችላል።
- source_word: δὲ
  choice: ግን
  rationale: ሕዝቡ ሊገድለው ከሞከረበት ከቀደመው ሁኔታ ጋር ያለውን መጠነኛ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διελθὼν
  choice: አልፎ
  rationale: በአንድ ስፍራ ውስጥ ተሻግሮ መሄድን ያሳያል፤ ከዋናው ግስ ጋር ያለውን የተውሳከ ግስ ግንኙነትም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: διὰ μέσου αὐτῶν
  choice: በመካከላቸው
  rationale: በቡድኑ መካከል በኩል መንቀሳቀሱን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπορεύετο
  choice: መንገዱን ቀጠለ
  rationale: የግሱን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል፤ “ሄደ” ብቻ ከማለት ይልቅ ከዚያ ስፍራ ጉዞውን እንደቀጠለ ያመለክታል።
theological_decisions:
- issue: ኢየሱስ ከሕዝቡ መካከል ማለፉ ተአምራዊ መሆኑን ትርጉሙ በግልጽ ሊናገር ይገባልን?
  choice: የሆነውን ብቻ የሚገልጽ ገለልተኛ አባባል፦ “በመካከላቸው አልፎ”
  alternative: “በተአምራዊ ሁኔታ በመካከላቸው አለፈ” የሚል ግልጽ ተአምራዊ ትርጓሜ
  rationale: የግሪኩ ጽሑፍ ኢየሱስ በሕዝቡ መካከል እንዳለፈ ይናገራል እንጂ ይህ እንዴት እንደተፈጸመ አይገልጽም። ስለዚህ ትርጉሙ አንባቢው ከዐውደ ንባቡ እንዲመዝን ያስችላል፣ ጽሑፉ ያልተናገረውንም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “መንገዱን ቀጠለ” የሚለው አገላለጽ የግሪኩን ቀጣይ እንቅስቃሴ በተፈጥሯዊ አነጋገር ያቀርባል።
