- source_word: ὑπηρέτῃ
  choice: ለአገልጋዩ
  rationale: በምኩራብ አውድ ጥቅል መጻሕፍቱን የሚይዘውንና በአገልግሎቱ የሚረዳውን ሰው ያመለክታል፤ ‘አገልጋይ’ የሥራውን ሚና ያለ አላስፈላጊ ማብራሪያ ያሳያል።
