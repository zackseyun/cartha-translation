  text: ጥቅሉን[a] ጠቅልሎ ለአገልጋዩ[b] መልሶ ሰጠውና ተቀመጠ። በምኩራቡ የነበሩት የሁሉም ዓይኖች በእርሱ ላይ ተተክለው ነበር።
  philosophy: optimal-equivalence
  footnotes:
