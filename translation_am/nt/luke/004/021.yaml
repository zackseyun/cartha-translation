lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς
  choice: ከዚያም፣ … ብሎ ሊነግራቸው ጀመረ
  rationale: የንግግሩን መጀመርና የትረካውን ቀጣይነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ δέን እንደ ጠንካራ ተቃርኖ አይተረጉምም።
- source_word: Σήμερον
  choice: ዛሬ
  rationale: በግሪክኛው የቀደመውንና አጽንዖት ያለውን የጊዜ መግለጫ በቀጥታ ያስተላልፋል።
- source_word: ἡ γραφὴ αὕτη
  choice: ይህ የመጽሐፍ ቃል
  rationale: በአውዱ ከኢሳይያስ አሁን የተነበበውን ቅዱስ ጽሑፍ ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊና የተወሰነውን ክፍል የሚያመለክት ነው።
- source_word: πεπλήρωται
  choice: ተፈጽሟል
  rationale: የግሪክኛውን ፍጹም ተደራጊ ቅርጽ፣ ማለትም የተጠናቀቀና ውጤቱ አሁንም ያለ ፍጻሜን፣ በአማርኛ ያስተላልፋል።
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: እናንተ ስትሰሙ
  rationale: ቃል በቃል ‘በጆሮአችሁ’ የሚለውን የግሪክኛ ፈሊጥ ለዘመናዊ አማርኛ አንባቢ በግልጽና ተፈጥሯዊ መንገድ ያቀርባል፤ ቃል በቃል አገላለጹ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የፍጻሜው አይነትና አድራጊ
  choice: ኢየሱስ ይህ የመጽሐፍ ቃል ዛሬ መፈጸሙን እንደገለጠ ብቻ መተርጎም
  alternative: ‘ይህ ትንቢት ዛሬ በእኔ ተፈጽሟል’ በማለት ማብራራት
  rationale: አውዱ ከኢየሱስ ጋር ያለውን ፍጻሜ ቢያመለክትም፣ ጥቅሱ ‘ትንቢት’ ወይም ‘በእኔ’ ብሎ በግልጽ አይጨምርም። ትርጉሙ የጽሑፉን ኃይልና የትርጓሜ ውጥረት ሳያሰፋ ይጠብቃል።
translation_notes:
