    text: ወይም፣ “እየተፈተነ።” የግሪኩ ግስ “መፈተን” ወይም “ወደ ክፉ መፈታተን” ማለት ሊሆን ይችላል፤ እዚህ ድርጊቱን የሚፈጽመው ዲያብሎስ በመሆኑ የክፉ ዓላማ አውዱ ጎልቶ ይታያል።
