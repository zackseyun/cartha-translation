lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: አርባ ቀን
  rationale: የጊዜ ቆይታን የሚያመለክተው የግሪክ አኩዛቲቭ በአማርኛ በተፈጥሮ ‘አርባ ቀን’ ተብሎ ይገለጣል፤ ‘ቆየ’ የቆይታውን ሐሳብ ግልጽ ያደርጋል።
- source_word: πειραζόμενος
  choice: እየተፈተነ
  rationale: ‘መፈተን’ በአማርኛ የፈተናንና ወደ ክፉ የመፈታተንን ሁለቱንም ገጽታዎች ሊሸከም ይችላል። ፈታኙ ዲያብሎስ መሆኑ በዚህ አውድ የክፉ ዓላማውን ያሳያል።
- source_word: ὑπὸ τοῦ διαβόλου
  choice: በዲያብሎስ
  rationale: διάβολος በዚህ አውድ የግል መጠሪያ ስለሆነ፣ በዘመናዊ አማርኛ የተለመደው ‘ዲያብሎስ’ ተመርጧል።
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: ምንም አልበላም
  rationale: የግሪኩን ጠንካራ አሉታዊ አገላለጽ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: በእነዚያ ቀናት
  rationale: የተጠቀሰውን የጊዜ ክልል በቀጥታና በተለመደ አማርኛ ያሳያል።
- source_word: συντελεσθεισῶν αὐτῶν
  choice: ቀኖቹም ሲፈጸሙ
  rationale: የግሪኩን ጄኒቲቭ አብሶሉት እንደ ጊዜ ንዑስ አረፍተ ነገር ያቀርባል፤ ‘ሲፈጸሙ’ የተወሰነው ጊዜ መጠናቀቁን ያሳያል።
- source_word: ἐπείνασεν
  choice: ተራበ
  rationale: የረሃብ ሁኔታ መከሰቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: πειραζόμενος ስለ ኢየሱስ የምድረ በዳ ልምምድ የሚገልጸው ትርጉም
  choice: እየተፈተነ
  alternative: እየተፈታተነ
  rationale: ‘እየተፈተነ’ የግሪኩን የመፈተን/የመፈታተን አሻሚነት በአንጻራዊ ሁኔታ ይጠብቃል። ፈታኙ ዲያብሎስ መሆኑ የጠላትነት አውዱን ያብራራል፤ ጽሑፉ ግን ስለ ክርስቶስ ፈተና ተጨማሪ የእምነት ሥርዓታዊ ማብራሪያ አያስገባም።
