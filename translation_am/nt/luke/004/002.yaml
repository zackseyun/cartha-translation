  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: am
  text: አርባ ቀንም በዲያብሎስ እየተፈታተነ[a] ቆየ። በእነዚያም ቀናት ምንም አልበላም፤ እነዚያም ቀናት ከተፈጸሙ በኋላ ተራበ።
  philosophy: optimal-equivalence
  footnotes:
