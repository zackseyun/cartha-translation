- source_word: εἰς τὴν Καφαρναοὺμ
  choice: በቅፍርናሆም
  rationale: εἰς በመሠረቱ ‘ወደ/ወደ ውስጥ’ ቢልም፣ ከγενόμενα ጋር በዚህ ዐውድ የቦታ ትርጉም አለው፤ ስለዚህ ‘በቅፍርናሆም’ ተፈጥሯዊ ነው።
- source_word: ποίησον καὶ ὧδε
  choice: በዚህም … አድርግ
  rationale: የποίησονን ሰፊ ትርጉም በ‘አድርግ’ ይጠብቃል፤ καί የሚጨምረውን ‘ደግሞ/ም’ ኃይልም ያሳያል።
- source_word: ἐν τῇ πατρίδι σου
  choice: በትውልድ ከተማህ
  rationale: በዐውዱ πατρίς ሀገርን በሰፊው ሳይሆን የኢየሱስን የትውልድ ስፍራ ናዝሬትን ያመለክታል።
