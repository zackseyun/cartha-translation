  rationale: ኢየሱስ የሚናገሩትን አስቀድሞ በእርግጠኝነት መግለጹን ያሳያል።
- source_word: ἐρεῖτέ μοι
  choice: ትነግሩኛላችሁ
  rationale: የወደፊት ጊዜውን እንደ ትንቢታዊ ግምት ይጠብቃል፤ ትእዛዝ ወይም ጥያቄ አያደርገውም።
- source_word: παραβολὴν
