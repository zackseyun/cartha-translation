  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ “በእርግጥ ይህን አባባል ትሉኛላችሁ፤ ‘ሐኪም ሆይ፣ ራስህን ፈውስ!’ በቅፍርናሆም[a] ተከናውነዋል ብለን የሰማናቸውን ሁሉ በዚህም በትውልድ ስፍራህ አድርግ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በጥሬው ‘ወደ ቅፍርናሆም’ ወይም ‘ወደ ቅፍርናሆም ውስጥ’ ማለት ነው፤ የግሪክ ጽሑፉ εἰς (‘ወደ/ወደ ውስጥ’) ይጠቀማል፣ ነገር ግን በዚህ ዐውድ ትርጉሙ የቦታ ነው።
