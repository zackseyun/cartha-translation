  rationale: እዚህ ቃሉ ረጅም ታሪካዊ ምሳሌን ሳይሆን አጭር ምሳሌያዊ አባባልን ያመለክታል፤ ‘ምሳሌ’ ይህን በተፈጥሮ ይገልጣል።
- source_word: Ἰατρέ
  choice: ሐኪም ሆይ
  rationale: የጥሪ ቅርጹንና የምሳሌውን ክብር ያለው አገላለጽ ይጠብቃል።
- source_word: θεράπευσον σεαυτόν
  choice: ራስህን ፈውስ
  rationale: ቀጥተኛውን የትእዛዝ ኃይልና የአባባሉን አጭርነት ይጠብቃል።
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: እንደተደረገ የሰማነውን ሁሉ
