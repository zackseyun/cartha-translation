review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ confident prediction, the imperative proverb, the reported character of what was heard, the locative contextual sense of εἰς Καφαρναούμ, and the command to do the same in his native place. However, the relative construction for ὅσα ἠκούσαμεν γενόμενα is awkward and can misleadingly make the reported deeds singular. The rendering of πατρίς as “ትውልድ ከተማ” is unnecessarily narrower than the Greek, which can denote one’s native place or region.
  naturalness: “እንዲህ የሚለውን ምሳሌ” is understandable, but “ይህን አባባል” is more natural for a concise proverb. “ተከናውነዋል ብለን የሰማናቸውን ሁሉ” gives clear, idiomatic Amharic syntax and preserves the plural scope. “በትውልድ ስፍራህ” is natural modern standard Amharic.
  terminology: “ሐኪም ሆይ፣ ራስህን ፈውስ” appropriately preserves the terse proverbial register. “አባባል” is preferable to “ምሳሌ” here because παραβολή refers specifically to a brief proverbial saying, not an extended illustrative story.
  issues:
  - severity: medium
    issue: The phrase “እንደተደረገ የሰማነውን ሁሉ” is grammatically and semantically strained.
    rationale: ὅσα and γενόμενα refer to multiple things/events heard to have occurred. The revised wording explicitly preserves both the reported nature and plural scope without adding interpretive detail.
  - severity: low
    issue: “ምሳሌ” is less precise than needed for παραβολή in this context.
    rationale: The quoted expression is a proverb; “አባባል” is the natural Amharic term for this concise traditional saying.
  - severity: low
    issue: “በትውልድ ከተማህ” narrows πατρίς to a city.
    rationale: πατρίς can refer more broadly to one’s native place. “በትውልድ ስፍራህ” retains the source’s scope while fitting the Nazareth context.
  revised_text: እርሱም እንዲህ አላቸው፦ “በእርግጥ ይህን አባባል ትሉኛላችሁ፤ ‘ሐኪም ሆይ፣ ራስህን ፈውስ!’ በቅፍርናሆም[a] ተከናውነዋል ብለን የሰማናቸውን ሁሉ በዚህም በትውልድ ስፍራህ አድርግ።”
