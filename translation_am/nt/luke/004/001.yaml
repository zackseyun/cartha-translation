base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: am
  text: ኢየሱስም በመንፈስ ቅዱስ ተሞልቶ ከዮርዳኖስ ተመለሰ፤ በምድረ በዳም በመንፈስ ቅዱስ[a] ይመራ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመንፈስ ቅዱስ ውስጥ»። የግሪኩ አገላለጽ ይበልጥ ቃል በቃል እንዲህ ሊተረጎም ይችላል፤ በዚህ አውድ ግን መንፈስ ቅዱስ ኢየሱስን እየመራው እንደነበር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ ተሞልቶ
  rationale: πλήρης ከዘርፍ አመልካች ጋር ሙሉ መሆንን ይገልጣል። በአማርኛ «በመንፈስ ቅዱስ ተሞልቶ» ተፈጥሯዊና ግልጽ ሲሆን፣ አውዱ ያላስገደደውን የጊዜያዊ መሞላት ሐሳብ አያክልም።
- source_word: ὑπέστρεψεν
  choice: ተመለሰ
  rationale: የግሱን መሠረታዊ ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: ከዮርዳኖስ
  rationale: የግሪኩን ስያሜ ተከትሎ «ወንዝ» የሚለውን በጽሑፉ የሌለ ማብራሪያ አይጨምርም።
- source_word: ἤγετο
  choice: ይመራ ነበር
  rationale: ያለፈ ጊዜ ቀጣይ ድርጊትን የሚያሳየውን የግሪክ ኢምፐርፌክት ተገብሮ ቅርጽ ይጠብቃል።
- source_word: ἐν τῷ πνεύματι
  choice: በመንፈስ
  rationale: «በ» የግሪኩን ἐν ሰፊ ክልል ይጠብቃል፤ በዚህ አውድ መንፈስ ቅዱስ መሪው መሆኑን በተፈጥሯዊ ሁኔታ ያሳያል፣ ነገር ግን «በመንፈስ ውስጥ» የሚለውን ይበልጥ ቃል በቃል አማራጭም ስለሚፈቅድ የግሪኩን ልዩነት በማስታወሻ ያቆያል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: ἔρημος የበረሃ፣ የብቸኝነትና የሰው አልባ ስፍራ ሐሳብን ይይዛል፤ «ምድረ በዳ» የአሸዋ በረሃን ብቻ ሳያመለክት በመጽሐፍ ቅዱሳዊ አውድ የተለመደ ነው።
- source_word: δὲ
  choice: ም
  rationale: የትረካውን ለስላሳ ሽግግርና ከቀደመው ክፍል ጋር ያለውን ትስስር በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
theological_decisions:
- issue: በἐν τῷ πνεύματι ውስጥ «መንፈስ» የሚለው የሚያመለክተው
  choice: መንፈስ ቅዱስ
  alternative: የኢየሱስ ውስጣዊ መንፈሳዊ ሁኔታ
  rationale: ከዚያው በፊት «በመንፈስ ቅዱስ ተሞልቶ» የሚለው ሐረግ ስለሚገኝና በሉቃስ ትረካ መንፈስ ቅዱስ እንደ ንቁ መሪ ስለሚቀርብ፣ ተመሳሳዩ መንፈስ ኢየሱስን እየመራው ነው የሚለው ንባብ ከሁሉ ይበልጥ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ምድረ በዳ» መጽሐፍ ቅዱሳዊ ክብር ያለው ቢሆንም አሁንም በሰፊው የሚገባ ነው፤ የኢምፐርፌክት ቀጣይነት «ይመራ ነበር» በሚለው ተጠብቋል።
