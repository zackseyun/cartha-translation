review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the devil as speaker, retains the emphatic ‘to you,’ renders ἐξουσία as ‘authority,’ and presents the assertion as the devil’s direct claim. However, ‘ተላልፎ ተሰጥቶኛል’ redundantly combines two passive-transfer expressions where παραδέδοται is one perfect passive verb, and the final ‘ለፈለግሁት’ is insufficiently explicit for the Greek indefinite personal object (‘whomever I wish’).
  naturalness: The proposed revision uses idiomatic modern standard Amharic. ‘ይህ ሥልጣን ለእኔ ተሰጥቶኛል’ naturally makes the singular pronoun’s antecedent clear, while ‘ለምፈልገው ሰው’ clearly conveys a person without suggesting an unspecified object.
  terminology: ‘ዲያብሎስ,’ ‘ሥልጣን,’ and ‘ክብር’ are appropriate established biblical terms. The lexical-alternative footnote for δόξα remains accurate and properly anchored.
  issues:
  - severity: medium
    issue: Redundant rendering of παραδέδοται
    rationale: ‘ተላልፎ ተሰጥቶኛል’ expresses both ‘passed over’ and ‘given to me.’ The Greek has a single perfect passive, so ‘ተሰጥቶኛል’ is sufficient and more natural.
  - severity: medium
    issue: Ambiguous object in ለፈለግሁት
    rationale: Without a personal noun, this can mean ‘to what I want’ rather than clearly ‘to whomever I want.’ Adding ‘ሰው’ preserves the indefinite personal reference of ᾧ ἂν θέλω.
  revised_text: ዲያብሎስም፣ “ይህን ሙሉ ሥልጣንና ክብራቸውን[a] ለአንተ እሰጥሃለሁ፤ ይህ ሥልጣን ለእኔ ተሰጥቶኛልና፣ እኔም ለምፈልገው ሰው እሰጠዋለሁ” አለው።
