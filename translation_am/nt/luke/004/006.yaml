  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: am
  text: ዲያብሎስም፣ “ይህን ሙሉ ሥልጣንና ክብራቸውን[a] ለአንተ እሰጥሃለሁ፤ ይህ ሥልጣን ለእኔ ተሰጥቶኛልና፣ እኔም ለምፈልገው ሰው እሰጠዋለሁ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ድምቀታቸውን።” እዚህ ያለው የግሪክኛ ቃል ክብርን፣ ድምቀትን ወይም ግርማን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: ዲያብሎስ
  rationale: በሉቃስ የፈተና ትረካ ውስጥ የሰይጣን የታወቀ ግላዊ መጠሪያ ስለሆነ፣ ቃሉን በተለመደው መጠሪያው መተርጎም ከቃላዊው ‘ስም አጥፊ’ የበለጠ ግልጽ ነው።
- source_word: Σοὶ δώσω
  choice: ለአንተ እሰጥሃለሁ
  rationale: በግሪክኛው የተቀደመውን ለአንተ የሚለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: በዚህ አውድ የመግዛትን መብትና ሥልጣን ያመለክታል፤ ‘ኃይል’ ግን ጥሬ ብርታትን ሊያስመስል ይችላል።
- source_word: ταύτην ἅπασαν
  choice: ይህን ሁሉ
  rationale: የአመልካቹንና የሙሉነት አጽንዖቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δόξαν αὐτῶν
  choice: ክብራቸውን
  rationale: ተውላጠ ስሙ በቁጥር 5 የታዩትን መንግሥታት ይመለከታል፤ ‘ክብር’ የቃሉን መሠረታዊ ትርጉምና መጽሐፍ ቅዱሳዊ ድምፅ ይጠብቃል።
- source_word: παραδέδοται
  choice: ተላልፎ ተሰጥቶኛል
  rationale: የግሪክኛውን ፍጹም ተደራጊ ቅርጽ፣ ማለትም አስቀድሞ የተፈጸመና ውጤቱ የቀጠለ ድርጊትን፣ ይጠብቃል፤ የንግግሩን ሕጋዊነት አያክልም።
- source_word: ᾧ ἂν θέλω
  choice: ለፈለግሁት
  rationale: ዲያብሎስ ሥልጣኑን በፈቃዱ ለማንም እንደሚሰጥ የሚያቀርበውን አጠቃላይ ንግግር በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δίδωμι αὐτήν
  choice: እሰጠዋለሁ
  rationale: የግሪክኛውን የአሁን ጊዜ አጠቃላይ ወይም ልማዳዊ አገልግሎት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የመንግሥታቱ ሥልጣን ለእርሱ እንደተሰጠ ዲያብሎስ የሚናገረውን ትርጉሙ ያጸድቀው እንደሆነ
  choice: ንግግሩን ምንም የአርታኢ ማብራሪያ ሳይጨመርበት እንደ ዲያብሎስ ቀጥተኛ ንግግር ማቅረብ
  alternative: ‘እንደሚለው’ ወይም ‘ይገባኛል ብሎ የሚናገረው’ ያለ የማራቂያ ቃል መጨመር
  rationale: ግሪክኛው ይህን እንደ ዲያብሎስ ቀጥተኛ ንግግር ያቀርበዋል። ተርጓሚው ንግግሩን ሊያዳክምም ሆነ ሊያጸድቅ አይገባም፤ ተናጋሪው ዲያብሎስ መሆኑን ትረካው ራሱ ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው የ‘ለአንተ’ አጽንዖት ተጠብቋል፣ የዲያብሎስም አባባል እንደ ትረካዊ ይሁንታ ሳይቀርብ ቀጥተኛ ንግግር ሆኖ ቀርቧል።
