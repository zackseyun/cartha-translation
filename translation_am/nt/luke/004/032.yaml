  rationale: ጥቅሱ የኢየሱስን ንግግር ሥልጣን ያረጋግጣል፣ ነገር ግን የሥልጣኑን ሙሉ ሥነ መለኮታዊ መሠረት በዚህ ጥቅስ አይገልጽም፤ ትርጉሙም ይህን ድንበር ይጠብቃል።
