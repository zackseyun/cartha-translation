- source_word: ἐν ἐξουσίᾳ
  choice: በሥልጣን
  rationale: የንግግሩን ባሕርይና ሁኔታ ያሳያል፤ ‘በሥልጣን’ የግሪኩን አገላለጽ በቅርብ ይጠብቃል።
- source_word: ὁ λόγος αὐτοῦ
  choice: ቃሉ
  rationale: λόγος እዚህ የኢየሱስን ንግግር፣ የተናገረውን ወይም መልእክቱን ሊያመለክት ይችላል፤ ‘ቃሉ’ የምንጩን አጭርነትና አሻሚነት ይጠብቃል።
- source_word: ὅτι
  choice: ነበርና
  rationale: የመደነቃቸውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ አያያዝ ያቀርባል።
