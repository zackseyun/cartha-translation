  choice: ተደነቁ
  rationale: የግሱን ጠንካራ የመደነቅ ምላሽ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል። የግሪኩ ያልተጠናቀቀ ጊዜ በዐውዱ ውስጥ ቀጣይ ምላሽን ሊያመለክት ቢችልም፣ በአማርኛ ቀላሉ ያለፈ ጊዜ ተፈጥሯዊ ነው።
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: በትምህርቱ
  rationale: ἐπί ከዳቲቭ ጋር የመደነቃቸውን መነሻ ወይም ትኩረት ያሳያል፤ ‘በትምህርቱ’ በአማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: διδαχῇ
