review_pass:
  verdict: revise
  source_fidelity: The first clause accurately conveys their astonishment at Jesus’ teaching. The draft’s second clause, however, makes the word a passive object ('was spoken with authority'), whereas the Greek states that his word/speech itself was characterized by authority. The revision retains the source’s descriptive claim without specifying the ground of that authority.
  naturalness: ‘በትምህርቱ ተደነቁ’ is clear and natural. ‘ቃሉ ሥልጣን ያለው ነበር’ is idiomatic modern standard Amharic and avoids the awkward, source-shifting passive construction.
  terminology: ‘ትምህርት’ suitably renders διδαχή, and ‘ቃል’ preserves the compact referential breadth of λόγος. ‘ሥልጣን ያለው’ naturally expresses ἐν ἐξουσίᾳ without doctrinal expansion.
  issues:
  - severity: medium
    issue: ‘ቃሉ በሥልጣን የተነገረ ነበር’ introduces a passive verbal formulation.
    rationale: ὁ λόγος αὐτοῦ ἐν ἐξουσίᾳ ἦν describes Jesus’ word/speech as being authoritative; it does not use a passive verb meaning ‘was spoken.’ The passive may also imply an unstated speaker or shift the emphasis from the authoritative quality of the speech.
  - severity: low
    issue: The footnote’s first alternative duplicates the revised main rendering too closely.
    rationale: A lexical-alternative note should provide a genuinely distinct, viable way to express the phrase.
  revised_text: በትምህርቱ ተደነቁ፤ ቃሉ ሥልጣን ያለው ነበርና።[a]
