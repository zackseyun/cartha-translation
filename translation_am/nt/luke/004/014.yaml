  text: ኢየሱስም በመንፈስ ኃይል ወደ ገሊላ ተመለሰ፤ ስለ እርሱም ዜና[a] በዙሪያው ባለው አካባቢ ሁሉ ተሰራጨ።
  philosophy: optimal-equivalence
  footnotes:
