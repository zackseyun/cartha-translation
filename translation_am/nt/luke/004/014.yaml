    text: ወይም «ዝና» ወይም «ወሬ»። የግሪኩ ቃል አዎንታዊ ወይም አሉታዊ መሆኑን ሳይወስን በስፋት የሚዛመትን ዜና ሊያመለክት ይችላል።
    reason: lexical_alternative
