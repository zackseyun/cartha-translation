source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: am
  text: ኢየሱስም ጋኔኑን ገሥጾ፣ “ዝም በል[a]፤ ከእርሱም ውጣ!” አለው። ጋኔኑም ሰውየውን ወደ መካከላቸው ጥሎት፣ ምንም ሳይጎዳው[b] ከእርሱ ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ተለጎም” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ምንም ጉዳት ሳያደርስበት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: ገሥጾ
  rationale: ἐπιτιμάω የጽኑ ተግሣጽና የሥልጣን ትእዛዝ ኃይል አለው፤ “ገሠጸ” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Φιμώθητι
  choice: ዝም በል
  rationale: ቃሉ በመሠረቱ አፍን መለጎምን የሚያሳይ ቢሆንም፣ በንግግር አውድ ውስጥ ጽኑ የዝምታ ትእዛዝ ነው። “ዝም በል” ቀጥተኛና ተፈጥሯዊ ነው፤ ምስላዊው ቃል በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: ከእርሱም ውጣ
  rationale: የግሪኩን ቀጥተኛ የማስወጣት ትእዛዝና የἀπόን የመለየት ሐሳብ ይጠብቃል።
- source_word: ῥίψαν αὐτὸν
  choice: ሰውየውን … ጥሎት
  rationale: የአኦሪስት ተሳቢ ግስ ከዋናው ድርጊት በፊት ወይም ከእርሱ ጋር የተያያዘ ድርጊትን ያሳያል። “ሰውየውን” የተባለው በአማርኛ ሁለቱ ተውላጠ ስሞች እንዳይደበላለቁ ነው።
- source_word: εἰς τὸ μέσον
  choice: ወደ መካከላቸው
  rationale: ቃሉ “ወደ መካከል” ማለት ነው፤ በአማርኛ “ወደ መካከላቸው” በዚያ የነበሩትን ሰዎች በተፈጥሯዊ ሁኔታ ያመለክታል፣ አዲስ የቦታ ዝርዝርም አይጨምርም።
- source_word: τὸ δαιμόνιον
  choice: ጋኔኑ
  rationale: δαιμόνιονን በቀጥታ የሚወክል የተለመደ ዘመናዊ አማርኛ ቃል ነው፤ ታሪኩን ወደ ረቂቅ ኃይል ወይም ወደ ሕመም አይለውጠውም።
- source_word: μηδὲν βλάψαν αὐτόν
  choice: ምንም ሳይጎዳው
  rationale: μηδέν ያለውን ፍጹም አሉታዊ አጽንዖት ይጠብቃል፤ የተሳቢ ግሱንም ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በማስወጣት ታሪኩ ውስጥ δαιμόνιον ምንን እንደሚያመለክት
  choice: “ጋኔን” ተብሎ ተተርጉሞ፣ ኢየሱስ በቀጥታ የሚያዘውና ከሰውየው የሚወጣው ክፉ መንፈሳዊ ፍጡር መሆኑ ተጠብቋል።
  alternative: እንደ “ክፉ ኃይል” ወይም እንደ አእምሮ ሕመም ብቻ በረቂቅ መንገድ መተርጎም።
  rationale: የግሪኩ ጽሑፍ ቀጥተኛ ንግግርን፣ ትእዛዝንና ከሰውየው መውጣትን ይተርካል፤ ትርጉሙ ይህን አቀራረብ ሳያቃልል ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትእዛዙ ጥንካሬ በአጭር ቀጥተኛ ንግግር ተጠብቋል፤ የግሪኩ ተውላጠ ስሞች በአማርኛ እንዳይደበላለቁ “ሰውየውን” ተገልጾ ቀርቧል።
