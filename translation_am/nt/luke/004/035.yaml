review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ rebuke, the commands to be silent and leave the man, the demon’s throwing the man into the midst, its departure, and the absence of injury. However, the object of ገሥጾ is left implicit; in Amharic this can momentarily make the man rather than the demon seem to be the one rebuked. Explicitly naming ጋኔኑን reflects αὐτῷ and removes that ambiguity.
  naturalness: The register is modern, clear, and suitably forceful. The participial sequence ጥሎት፣ ... ወጣ is natural. Adding the explicit object to ገሥጾ improves clarity without making the wording heavy.
  terminology: ጋኔን is an appropriate direct rendering of δαιμόνιον in this context. ዝም በል naturally renders the speech-directed imperative Φιμώθητι; the literal muzzling image is appropriately retained in the note. ምንም ሳይጎዳው faithfully expresses μηδὲν βλάψαν αὐτόν.
  issues:
  - severity: medium
    issue: The referent of ገሥጾ is not explicit.
    rationale: The Greek pronoun αὐτῷ refers to the demon. Although the following command and later noun make this inferable, Amharic permits ኢየሱስም ገሥጾ ... አለው to be initially read as rebuking the man. Adding ጋኔኑን preserves the source referent and improves immediate clarity.
  revised_text: ኢየሱስም ጋኔኑን ገሥጾ፣ “ዝም በል[a]፤ ከእርሱም ውጣ!” አለው። ጋኔኑም ሰውየውን ወደ መካከላቸው ጥሎት፣ ምንም ሳይጎዳው[b] ከእርሱ ወጣ።
