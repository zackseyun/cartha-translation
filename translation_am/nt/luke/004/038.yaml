  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: am
  text: ከምኩራብም ተነሥቶ ወደ ስምዖን ቤት ገባ። የስምዖን አማት በከፍተኛ ትኩሳት ተይዛ ነበር፤ እነርሱም ስለ እርሷ ጠየቁት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ እርሷ ለመኑት።» የግሪኩ አገላለጽ በቃል በቃል «ስለ እርሷ ጠየቁት» የሚል ሲሆን፣ በዐውዱ ግን እንዲረዳት መለመናቸውን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: ከምኩራብም ተነሥቶ
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች አሳታፊ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ «ተነሥቶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል። «ከምኩራብ» ደግሞ ከቦታው መውጣቱን ያሳያል።
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: ወደ ስምዖን ቤት ገባ
  rationale: ወደ አንድ ቦታ ውስጥ መግባትን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: የስምዖን አማት
  rationale: πενθερά በተለይ ሴት አማትን፣ ማለትም የባለቤትን እናት ያመለክታል። «አማት» በዐውዱ ይህን የዝምድና ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: በከፍተኛ ትኩሳት ተይዛ ነበር
  rationale: συνέχω በተደራጊ አገባብ ሕመሙ አጥብቆ እንደያዛት ያሳያል፤ «ተይዛ ነበር» ይህን ኃይል ይጠብቃል። πυρετῷ μεγάλῳ የትኩሳቱን ክብደት ስለሚያጎላ፣ «ከፍተኛ ትኩሳት» ዘመናዊና ግልጽ አገላለጽ ነው።
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: ስለ እርሷ ጠየቁት
  rationale: ἐρωτάω «መጠየቅ» ወይም «መለመን» ሊሆን ይችላል። ዋናው ጽሑፍ የግሪኩን ቀለል ያለ አገላለጽ እንዲጠብቅ «ጠየቁት» ተመርጧል፤ በዐውዱ የእርዳታ ልመና መሆኑ በግርጌ ማስታወሻ ተገልጧል።
theological_decisions:
- issue: πενθερά ስለ ስምዖን የትዳር ሁኔታ የሚያመለክተው
  choice: የዝምድናውን ቃል «የስምዖን አማት» ብሎ በቀጥታ መተርጎም
  alternative: ከቃሉ በላይ ሄዶ ስለ ስምዖን ጋብቻ ተጨማሪ ማብራሪያ መጨመር
  rationale: ጥቅሱ የዝምድናውን ግንኙነት በግልጽ ይጠቅሳል፤ ትርጉሙ ግን ከቃሉ ትርጉም በላይ የሆነ ታሪካዊ ወይም አስተምህሯዊ መደምደሚያ አይጨምርም።
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆς የልመና ወይም የጥያቄ ስሜት
  choice: በዋናው ጽሑፍ «ስለ እርሷ ጠየቁት» ማለት
  alternative: «ስለ እርሷ ለመኑት» ወይም «እንዲረዳት ለመኑት»
  rationale: ዐውዱ ፈውስ እንዲሰጣት የቀረበ ልመናን ያመለክታል፤ የግሪኩ ቃል ግን «ጠየቁት» የሚለውንም ቀለል ያለ ትርጉም ይፈቅዳል። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ የዐውዱ ልመናዊ ስሜትም በግርጌ ማስታወሻ ይቀርባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ምኩራብ» የተለመደው መጽሐፍ ቅዱሳዊ ቃል በመሆኑ ተጠብቋል፤ የግሪኩም የትረካ ቅደም ተከተል በተፈጥሯዊ አማርኛ ቀርቧል።
