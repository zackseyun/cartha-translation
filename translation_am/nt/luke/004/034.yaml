base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: am
  text: “ኧረ![a] የናዝሬቱ ኢየሱስ ሆይ፣[b] ከእኛ ጋር ምን ጉዳይ አለህ?[c] ልታጠፋን መጣህ?[d] ማን እንደሆንህ አውቅሃለሁ፤ አንተ የእግዚአብሔር ቅዱሱ ነህ።”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ኧረ!” የሚለው ድንገተኛ የድንጋጤ ወይም የተቃውሞ ጩኸት ነው፤ አንዳንዶች በአውዱ “ተወን!” ብለው ይተረጉሙታል።
    reason: lexical_alternative
