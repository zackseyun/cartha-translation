    text: ወይም “ናዝራዊው ኢየሱስ ሆይ።”
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “ለእኛና ለአንተ ምን?” ይላል፤ ይህ መራራቅን ወይም ተቃውሞን የሚገልጽ ሴማዊ ፈሊጥ ነው።
    reason: cultural_note
  - marker: d
    text: “እኛን” የሚለው የብዙ ቁጥር አመልካች በግሪክ ጽሑፍ ማንን እንደሚያካትት አልተገለጸም፤ ርኩሱ መንፈስ ራሱን በወካይነት እየገለጸ ወይም ስለ ሰፊው የአጋንንት ዓለም እየተናገረ ሊሆን ይችላል።
    reason: alternative_reading
  - marker: e
    text: ወይም “ቅዱሱ የእግዚአብሔር።”
    reason: lexical_alternative
