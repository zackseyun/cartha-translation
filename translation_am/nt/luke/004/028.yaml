lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: ተሞሉ
  rationale: የπίμπλημι የድርጊት ተቀባይ ቅርጽን በተፈጥሯዊ አማርኛ ይጠብቃል፤ ስሜቱን በትርጓሜ ከማጋነን ይቆጠባል።
- source_word: πάντες
  choice: ሁሉ
  rationale: በምኩራቡ የነበሩትን ሰዎች በአጠቃላይ ያመለክታል፤ የግሪኩንም አጭርነት ይጠብቃል።
- source_word: θυμοῦ
  choice: በቁጣ
  rationale: θυμός ብርቱ ቁጣን ሊያመለክት ቢችልም፣ «ቁጣ» ተፈጥሯዊና ያልተጋነነ ዘመናዊ አማርኛ ነው።
- source_word: ἐν τῇ συναγωγῇ
  choice: በምኩራብ የነበሩት
  rationale: የቦታውን ሐረግ ከπάντες ጋር በማያያዝ በምኩራቡ ውስጥ የነበሩትን ሁሉ በተፈጥሯዊ አማርኛ ይለያል።
- source_word: ἀκούοντες
  choice: ሲሰሙ
  rationale: ከዋናው ግስ ጋር በአንድ ጊዜ የተፈጸመውን ድርጊትና ለቁጣቸው የሆነውን አጋጣሚ በግልጽ ያሳያል።
- source_word: ταῦτα
  choice: ይህን
  rationale: ብዙ ቁጥር ያለው ταῦτα ወደ ቀደሙት የኢየሱስ ንግግሮች ይመለሳል፤ በአማርኛ «ይህን ሲሰሙ» በተፈጥሯዊ ሁኔታ ንግግሩን በአጠቃላይ ያመለክታል።
