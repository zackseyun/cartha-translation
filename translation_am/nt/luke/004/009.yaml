  text: ከዚያም ወደ ኢየሩሳሌም መራው፤ በቤተ መቅደሱ[c] ከፍተኛ ጫፍ[a] ላይ አቆመውና፣ “የእግዚአብሔር ልጅ ከሆንክ[b]፣ ከዚህ ወደ ታች ራስህን ወርውር፤” አለው።
  philosophy: optimal-equivalence
  footnotes:
