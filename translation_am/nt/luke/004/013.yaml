lexical_decisions:
- source_word: συντελέσας
  choice: ከፈጸመ በኋላ
  rationale: የግሪኩ የአኦሪስት ቦዝ አንቀጽ ከዋናው ግስ በፊት የተፈጸመ ድርጊትን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: πάντα πειρασμόν
  choice: ፈተናውን ሁሉ
  rationale: ነጠላው πειρασμόν ከπάντα ጋር በዚህ አውድ የቀረበውን ፈተና በሙሉ ወይም ሁሉንም የፈተና ዓይነቶች ያጠቃልላል። ‘ፈተና’ በአማርኛም የመፈተንና የማባበል ትርጉሞችን ሊሸከም ስለሚችል የምንጩን መጠነኛ አሻሚነት ይጠብቃል።
- source_word: ὁ διάβολος
  choice: ዲያብሎስ
  rationale: በሉቃስ ትረካ ውስጥ ቃሉ የግል ልዕለ-ተፈጥሯዊውን ባላጋራ ያመለክታል፤ ‘ዲያብሎስ’ በዘመናዊ መደበኛ አማርኛ የተለመደና ትክክለኛ መጠሪያ ነው።
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: ከእርሱ ተለየ
  rationale: ἀφίστημι እዚህ ከአንድ ሰው መራቅን ወይም ለቆ መሄድን ያመለክታል። ‘ተለየ’ በተከበረ የትረካ ቋንቋ ይህን በተፈጥሯዊነት ያስተላልፋል።
- source_word: ἄχρι καιροῦ
  choice: አመቺ ጊዜ እስኪያገኝ ድረስ
  rationale: καιρός ተራ የጊዜ ርዝመትን ብቻ ሳይሆን ተስማሚ ወይም አመቺ ወቅትን ሊያመለክት ይችላል። ተለይቶ የተጠቀሰ ባለቤት ባይኖርም፣ በአማርኛ ‘አመቺ ጊዜ እስኪያገኝ’ የመልቀቁን ጊዜያዊና ስልታዊ ባሕርይ በግልጽ ይገልጣል።
theological_decisions:
- issue: πειρασμός የኢየሱስን ልምምድ ሲገልጥ ያለው የትርጉም ስፋት
  choice: ፈተና
  alternative: መፈተን
  rationale: πειρασμός እንደ አውዱ መፈተንን ወይም ወደ ኃጢአት ማባበልን ሊያመለክት ይችላል። እዚህ ድርጊቱን የሚፈጽመው ዲያብሎስ ስለሆነ የማባበል ገጽታው ጎልቶ ይታያል፤ ሆኖም ትዕይንቱ የኢየሱስን ታማኝነት የሚፈትንም ነው። ዋናው ‘ፈተና’ የሚለው ቃልና የግርጌ ማስታወሻው ሁለቱንም ገጽታዎች ይጠብቃሉ።
