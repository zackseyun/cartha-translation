id: LUK.4.10
reference: Luke 4:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: am
  text: ምክንያቱም፣ «ስለ አንተ ለመላእክቱ እንዲጠብቁህ ያዝዛል» ተብሎ ተጽፎአል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: ተጽፎአል
  rationale: የግሪኩን ፍጹም ተገብሮ አንቀጽ በተፈጥሯዊ የአማርኛ የቅዱስ ጽሑፍ ጥቅስ አገላለጽ ያቀርባል፤ የተጻፈውም አሁንም ሥልጣን እንዳለው ያመለክታል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው የፈተና ንግግር ጋር ያለውን ማብራሪያዊ ግንኙነት በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ὅτι
  choice: የጥቅስ ምልክት
  rationale: ከ‘ተጽፎአል’ ጋር የጥቅሱን ይዘት ለማስገባት በአማርኛ ቀጥተኛ ንግግርን በጥቅስ ምልክት ማቅረብ ተፈጥሯዊ ነው።
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: መላእክቱን
  rationale: ‘የእርሱን መላእክት’ የሚለውን ባለቤትነት በተፈጥሯዊና ክቡር የአማርኛ አገላለጽ ያሳያል።
- source_word: ἐντελεῖται
  choice: ያዛቸዋል
  rationale: ወደፊት ትእዛዝ መስጠትን በግልጽ ያሳያል፤ የተቀባዮቹን ብዙ ቁጥርም ይጠብቃል።
- source_word: περὶ σοῦ
  choice: ስለ አንተ
  rationale: περί ከዘር አገባብ ጋር ያለውን ‘concerning/about you’ ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῦ διαφυλάξαι σε
  choice: እንዲጠብቁህም
  rationale: የአንቀጹን ዓላማ በአማርኛ የዓላማ ንዑስ አረፍተ ነገር ይገልጣል፤ διαφυλάσσω ያለውን ከጉዳት የመጠበቅ ሐሳብም ይጠብቃል።
theological_decisions:
- issue: በሰይጣን ንግግር ውስጥ የቀረበው የመዝሙር ጥቅስ
  choice: ሉቃስ ያስቀመጠውን ክፍል ብቻ በቅርብ መተርጎም
  alternative: በመዝሙር 91፥11 ያለውን ሙሉ አገላለጽ ጨምሮ ማስማማት
  rationale: ሉቃስ እዚህ ያስቀመጠው ቃል ብቻ ተተርጉሟል፤ በግሪኩ የሌለው የመዝሙሩ ቀጣይ ክፍል አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል በተፈጥሯዊ የአማርኛ አገባብ ተደራጅቷል፤ ‘እንዲጠብቁህም’ የትእዛዙን ዓላማ ያሳያል።
