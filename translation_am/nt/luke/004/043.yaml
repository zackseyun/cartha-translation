    text: ወይም፣ “የምስራቹን መስበክ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የተላክሁት ለዚህ ዓላማ ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέραις πόλεσιν
  choice: ለሌሎቹም ከተሞች
  rationale: ἕτερος ከአሁኑ ስፍራ ውጭ ያሉትን ከተሞች ያመለክታል፤ ካί የሚያሳየውን ጭማሪ “-ም” ይጠብቃል።
- source_word: εὐαγγελίσασθαί
  choice: የምስራች ማወጅ
  rationale: ግሱ መልካም ዜናን ማብሰር ወይም ማወጅን ያመለክታል፤ “ማወጅ” ለዘመናዊ አማርኛ ግልጽ ሲሆን የግሱን ይፋዊ አዋጅ ኃይል ይጠብቃል።
- source_word: δεῖ
  choice: አለብኝ
  rationale: በሉቃስ ውስጥ ብዙ ጊዜ ከመለኮታዊ ዓላማ ጋር የተያያዘውን ግዴታ ወይም አስፈላጊነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: የግሪኩን የባለቤትነት ግንኙነትና የሉቃስን ዋና መንግሥት-ቃል በቀጥታ ይጠብቃል፤ ግዛትን ወይም የሚገዛበትን ሁኔታ አስቀድሞ አይወስንም።
- source_word: ἐπὶ τοῦτο
  choice: ለዚህ
  rationale: የዓላማን ወይም የተልእኮን አቅጣጫ በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπεστάλην
  choice: ተልኬአለሁ
  rationale: የግሪኩን ተደራጊ ቅርጽና የተልእኮ ሐሳብ ይጠብቃል፤ ላኪውን ግን ጽሑፉ ካለው በላይ አይገልጽም።
- source_word: Καὶ
  choice: -ም
  rationale: ኢየሱስ ከአሁኑ ቦታ ባሻገር ወደ ሌሎች ከተሞችም መሄድ እንዳለበት የሚያሳየውን የጭማሪ ትርጉም በአማርኛ ቅጥያ ያቀርባል።
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: እርሱ ግን … አላቸው
  rationale: δέ በዐውዱ ያለውን ረጋ ያለ ንፅፅር “ግን” ይጠብቃል፤ የአማርኛው ተፈጥሯዊ የጥቅስ አወቃቀር የንግግር ግሱን በመጨረሻ ያኖራል።
theological_decisions:
- issue: የኢየሱስ ተልእኮ አስፈላጊነት
  choice: “አለብኝ” እና “ተልኬአለሁ” በማለት መለኮታዊ ዓላማን የሚያመለክተው ኃይል ተጠብቋል፤ ላኪው በዋናው ጽሑፍ አልተጨመረም።
  alternative: “እግዚአብሔር ስለላከኝ” ብሎ ላኪውን በግልጽ መጨመር።
  rationale: δεῖ በሉቃስ የመለኮታዊ አስፈላጊነትን ሊጠቁም ይችላል፣ ἀπεστάληνም ላኪ እንዳለ ያሳያል፤ ነገር ግን በዚህ ጥቅስ ላኪው በስም አልተገለጸም።
