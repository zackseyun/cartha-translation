  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: am
  text: እንዲህም አለ፤ “እውነት እላችኋለሁ፤ አንድም ነቢይ በትውልድ ስፍራው[a] ተቀባይነት አያገኝም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በትውልድ ከተማው” ወይም “በአገሩ።” የግሪኩ πατρίς የአንድን ሰው የትውልድ ከተማ፣ የትውልድ አካባቢ ወይም አገር ሊያመለክት ይችላል፤ በዚህ ዐውድ ናዝሬትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: እንዲህም አለ
  rationale: δέ በዚህ ቦታ የትረካውን ፍሰት በለስላሳ ሁኔታ ያገናኛል፤ «-ም» ይህን ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἀμὴν
  choice: እውነት
  rationale: ኢየሱስ የሚናገረውን ቃል በጽኑ ማረጋገጡን በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ለብዙ ሰዎች የቀረበውን ቀጥተኛ ንግግርና የአሁን ጊዜ አገላለጽ በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: οὐδεὶς προφήτης
  choice: አንድም ነቢይ
  rationale: የግሪኩን ፍጹም አሉታዊ አገላለጽ በአማርኛ ተፈጥሯዊ በሆነው «አንድም … አይ…ም» አወቃቀር ያስተላልፋል።
- source_word: δεκτός
  choice: ተቀባይነት አያገኝም
  rationale: ቃሉ በበጎ ሁኔታ መቀበልን ያመለክታል፤ ይህ ምርጫ ከእንግዳ አቀባበል ብቻ የሰፋውን ማኅበራዊና ግምገማዊ ትርጉም ይይዛል።
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: በትውልድ ስፍራው
  rationale: πατρίς የትውልድ ከተማን፣ አካባቢን ወይም አገርን ሊያመለክት ይችላል፤ «ትውልድ ስፍራ» ይህን ስፋት ሳያጠፋ ከናዝሬት ዐውድ ጋር ይስማማል።
