  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: am
  text: በነቢዩ ኤልሳዕ ዘመን በእስራኤል ብዙ ለምጻሞች ነበሩ፤ ነገር ግን ከሶርያዊው ንዕማን በቀር ከእነርሱ አንድም አልነጻም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: ለምጻሞች
  rationale: የግሪኩን ስማዊ ቅጽ በአጭሩ የሚያስተላልፍ፣ በመጽሐፍ ቅዱሳዊ አጠቃቀምም የታወቀ ቃል ነው። ይህ ቃል በጥንታዊው ዐውድ ከዘመናዊው የሕክምና ፍቺ የሰፋ የቆዳ በሽታ ምድብን ሊያመለክት ይችላል።
- source_word: ἐν τῷ Ἰσραὴλ
  choice: በእስራኤል
  rationale: የቦታን ወይም የማኅበረሰብን ወሰን ሳያጠብ የግሪኩን ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: በነቢዩ በኤልሳዕ ዘመን
  rationale: ἐπί ከወራሽ ቅጽ ጋር ያለውን ጊዜያዊ ትርጉም ‘በ…ዘመን’ ብሎ በግልጽ ያስተላልፋል፤ ‘ነቢዩ’ም ከስሙ ጋር ያለውን መለያ ይጠብቃል።
- source_word: ἐκαθαρίσθη
  choice: አልነጻም
  rationale: የግሪኩን ተገብሮ አድራጊ ቅጽና የመንጻት ቋንቋ ይጠብቃል፤ ትርጉሙን በሕክምናዊ ‘ተፈወሰ’ ብቻ አይገድበውም።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: በዚህ ዐውድ ያለውን የማግለል ትርጉም በተፈጥሯዊና አጭር አማርኛ ይገልጻል።
- source_word: Ναιμὰν ὁ Σύρος
  choice: ሶርያዊው ንዕማን
  rationale: የብሔር መለያውን በወሳኝነት ይጠብቃል፤ የነጻው ሰው እስራኤላዊ ሳይሆን የታወቀው ሶርያዊ ንዕማን መሆኑን ያጎላል።
theological_decisions:
- issue: ከለምጽ ጋር የተያያዘው የመንጻት ቋንቋ
  choice: ἐκαθαρίσθηን ‘ነጻ’ በሚለው ቃል ማቅረብ
  alternative: ‘ተፈወሰ’ ወይም ‘ነጻ ሆነ’
  rationale: የጥቅሱን አካላዊና ሥርዓታዊ የመንጻት ድምፅ ይጠብቃል፤ ተጨማሪ ዶክትሪናዊ ድምዳሜም አያስገባም።
- issue: የንዕማን የብሔር መለያ አጽንዖት
  choice: ‘ሶርያዊው ንዕማን’ የሚለውን በዋናው ጽሑፍ ማቆየት
  alternative: ‘ንዕማን የተባለ አንድ ሶርያዊ’
  rationale: የግሪኩን መለያ አንቀጽና የኢየሱስን ንግግር አነጻጻሪ ኃይል ይጠብቃል፤ በብዙዎቹ የእስራኤል ለምጻሞች ፈንታ የነጻው ባዕድ መሆኑን ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ቅደም ተከተል ትርጉሙ ሳይቀየር ለአማርኛ ተፈጥሯዊነት ተስተካክሏል። ለዚህ ጥቅስ የግርጌ ማስታወሻ አላስፈለገም።
