id: LUK.4.41
reference: Luke 4:41
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: am
  text: አጋንንትም ከብዙዎች እየወጡ፣ “አንተ የእግዚአብሔር ልጅ ነህ!” ብለው ይጮኹ ነበር። እርሱ ግን እየገሠጻቸው እንዳይናገሩ ይከለክላቸው ነበር፤ ምክንያቱም እርሱ መሲሕ[a] እንደሆነ ያውቁ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪክ ቃል Χριστός “መሲሕ/የተቀባው” ማለት ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: δαιμόνια
  choice: አጋንንት
  rationale: ግሪኩ በቀጥታ አጋንንትን ያመለክታል፤ ‘ርኩሳን መናፍስት’ የሚለው የተለየ የግሪክ አገላለጽ ስለሆነ እዚህ አልገባም።
- source_word: ἐξήρχετο
  choice: እየወጡ … ነበር
  rationale: የግሱን ቀጣይና ተደጋጋሚ የትረካ ገጽታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπὸ πολλῶν
  choice: ከብዙዎች
  rationale: በግሪኩ የሰዎቹ መጠሪያ በግልጽ አልተጨመረም፤ ‘ከብዙዎች’ ይህን አጭርነትና የአውዱን ግልጽነት ይጠብቃል።
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: ብለው ይጮኹ ነበር
  rationale: የድምፁን ከፍተኛነትና የተነገረውን ቃል በተፈጥሯዊ አማርኛ አንድ ላይ ያቀርባል።
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የክርስቶስን መጠሪያ ክብደት እንዳለ ያቆያል።
- source_word: ἐπιτιμῶν
  choice: እየገሠጻቸው
  rationale: የኢየሱስን ጠንካራ ተግሣጽና ሥልጣናዊ ትእዛዝ የሚያሳይ የተለመደ አማርኛ ነው።
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: እንዳይናገሩ ይከለክላቸው ነበር
  rationale: የግሪኩን ቀጣይ ወይም ተደጋጋሚ ክልከላ ይጠብቃል።
- source_word: ᾔδεισαν
  choice: ያውቁ ነበር
  rationale: የοἶδαን የቆየ የእውቀት ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν χριστόν
  choice: መሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ ‘የተቀባው’ የሚለውን መሲሐዊ ትርጉም የሚጠብቀው ‘መሲሕ’ ተመርጧል።
theological_decisions:
- issue: በአጋንንት የተነገረውን Χριστός እንዴት መተርጎም እንደሚገባ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ግል ስም ሳይሆን እንደ ማዕረግ ይሠራል፤ አማራጩ በማስታወሻ ተጠብቋል።
- issue: ‘የእግዚአብሔር ልጅ’ እና ‘መሲሕ’ የሚሉት መጠሪያዎች ግንኙነት
  choice: ሁለቱን እንደ ተለያዩ መጠሪያዎች ማቆየት
  alternative: ሁለቱን በአንድ ገላጭ ሐረግ ማዋሃድ
  rationale: ግሪኩ አጋንንት የሚጮኹትን መጠሪያና ተራኪው የሚሰጠውን ማብራሪያ ተዛማጅ ሆነው ግን ተለይተው ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ኢምፐርፌክት ገጽታ ‘እየ… ነበር’ እና ‘ይ… ነበር’ በሚሉ ቅርጾች ተጠብቋል።
