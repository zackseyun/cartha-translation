  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: am
  text: አንተ እንግዲህ በፊቴ ብትሰግድልኝ[a]፣ ሁሉም የአንተ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በፊቴ ተደፍተህ ብትሰግድልኝ።” የግሪኩ ግስ በአካል መደፋትን ወይም ማምለክን ሊያመለክት ይችላል፤ እዚህ ግን አውዱ ለዲያብሎስ የአምልኮ ክብር ስለመስጠት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: አንተ (በ“የአንተ” ውስጥ)
  rationale: ግልጽ የሆነው የሁለተኛ መደብ ነጠላ ተውላጠ ስም አጽንዖት አለው፤ በአማርኛ ይህ በባለቤትነት ሐረጉና በግስ ቅጥያው በተፈጥሮ ይገለጣል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: የቀረበውን ስጦታ ተከትሎ የሚመጣውን ውጤታዊ ወይም አመክንዮአዊ ግንኙነት በዘመናዊ አማርኛ በተፈጥሮ ያሳያል።
- source_word: ἐὰν
  choice: ብት-
  rationale: ከተያያዘው ግስ ጋር የተዋሐደው የአማርኛ ሁኔታዊ ቅጥያ የግሪኩን ሁኔታዊ አንቀጽ በትክክልና በተፈጥሮ ይገልጣል።
- source_word: προσκυνήσῃς
  choice: ብትሰግድልኝ
  rationale: “መስገድ” አካላዊ መድፋትንም ሆነ የአምልኮ ክብርን ሊያመለክት ስለሚችል የግሪኩን የትርጉም ስፋት ይጠብቃል፤ በዚህ አውድ ለዲያብሎስ የሚቀርብ የአምልኮ ክብር መሆኑ ግልጽ ነው።
- source_word: ἐνώπιον ἐμοῦ
  choice: በፊቴ
  rationale: የቦታና የግንኙነት ሐረጉን “በፊቴ” በሚለው አጭርና የተለመደ አገላለጽ ይጠብቃል።
- source_word: ἔσται σοῦ πᾶσα
  choice: ሁሉም የአንተ ይሆናል
  rationale: πᾶσα በቀደመው ቁጥር የተጠቀሱትን መንግሥታትና ክብራቸውን በአጠቃላይ ይመለከታል፤ ስሙን ሳይደግም “ሁሉም” የሚለው ድምር ሐሳቡን ይይዛል፣ “የአንተ ይሆናል”ም የσοῦን ባለቤትነት ያሳያል።
theological_decisions:
- issue: προσκυνέω እንደ ገለልተኛ አካላዊ ስግደት ወይስ እንደ አምልኮ ክብር መተርጎም
  choice: መስገድ
  alternative: ማምለክ
  rationale: “መስገድ” የአካላዊ ስግደትንና የአምልኮ ክብርን ሁለቱንም ሊይዝ ይችላል፤ ቀጣዩ ቁጥር ይህ ለእግዚአብሔር ብቻ የሚገባ አምልኮ መሆኑን ያብራራል። ስለዚህ የቃሉን እውነተኛ ስፋትና የአውዱን ከባድነት ሳይጠፋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በፊቴ ብትሰግድልኝ” የግሪኩን ቅደም ተከተልና የአምልኮ አውድ በተፈጥሮ ያቀርባል።
