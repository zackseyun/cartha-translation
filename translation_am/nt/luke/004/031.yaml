base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: am
  text: ከዚያም ወደ ቅፍርናሆም፣ የገሊላ ከተማ፣ ወረደ። በሰንበታትም[a] ያስተምራቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደ አገላለጽ፣ «በሰንበት።» የግሪኩ ቃል ብዙ ቁጥር ነው፤ «በሰንበታት» የሚለውም ምናልባት ተደጋጋሚ የሰንበት ወቅቶችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: ወረደ
  rationale: የግሪኩን ወደ ታች የመጓዝ አቅጣጫዊ ትርጉም በቀጥታ ይጠብቃል፤ ከናዝሬት ከፍታ ወደ ቅፍርናሆም መውረድንም ሳያብራራ ያመለክታል።
- source_word: Καφαρναοὺμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ይጠቀማል።
- source_word: πόλιν τῆς Γαλιλαίας
  choice: በገሊላ ወደምትገኘው … ከተማ
  rationale: የግሪኩን ‘የገሊላ ከተማ’ ግንኙነት በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ አካባቢያዊ አገላለጽ ያቀርባል፤ ቅፍርናሆም ከገሊላ ከተሞች አንዷ መሆኗን ያሳያል።
- source_word: ἦν διδάσκων
  choice: ያስተምራቸው ነበር
  rationale: የግሪኩን ቀጣይነት ወይም ተደጋጋሚነት ያለውን ድርጊት በተፈጥሯዊ የአማርኛ አላፊ ጊዜ አወቃቀር ይገልጣል።
- source_word: αὐτοὺς
  choice: -አቸው
  rationale: ግልጽ የስም ቀዳሚ የሌለውን የግሪክ ተውላጠ ስም ሳይጨምር በአማርኛ የግስ ቅጥያ ይጠብቃል።
- source_word: ἐν τοῖς σάββασιν
  choice: በሰንበታት
  rationale: የσάββασινን ብዙ ቁጥር ይጠብቃል፤ ይህም ትምህርቱ በተደጋጋሚ የሰንበት ወቅቶች እንደተሰጠ ሊያመለክት ይችላል።
theological_decisions:
- issue: σάββασιν የሚለውን ብዙ ቁጥር በነጠላ ‘በሰንበት’ ማቅረብ ወይም መጠበቅ
  choice: በሰንበታት
  alternative: በሰንበት
  rationale: ብዙ ቁጥሩን መጠበቅ የግሪኩን እውነተኛ ቅርጽና ትምህርቱ በተደጋጋሚ ሊሰጥ የመቻሉን ፍንጭ ያቆያል፤ ይህን ወደ አንድ ክስተት አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በገሊላ ወደምትገኘው’ የሚለው አገላለጽ የግሪኩን የቦታ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘በሰንበታት’ ግን የምንጩን ብዙ ቁጥር ለመጠበቅ ሆን ተብሎ ተቀምጧል። የግርጌ ማስታወሻው ከሚመለከተው ሐረግ ቀጥሎ ተያይዟል።
