  source_fidelity: The draft accurately represents the sequence of going out, going to an isolated place, the crowds’ ongoing search, their arrival, and their attempt to prevent Jesus from leaving. However, “ቀንም በሆነ ጊዜ” is not a natural rendering of the temporal genitive absolute, and “ተለይቶ” adds a separation nuance not required by ἀπ’ αὐτῶν.
  naturalness: 'A revision improves idiomatic modern standard Amharic: “ሲነጋ” naturally conveys “when day came,” plural verbal agreement fits “ሕዝቡ” as a crowd, and “ለማስቀረት ይሞክሩ ነበር” is smoother than the draft’s double prospective construction.'
