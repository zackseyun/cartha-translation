base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: am
  text: በምኩራብም ውስጥ የርኩስ ጋኔን መንፈስ ያለበት አንድ ሰው ነበር፤[a] እርሱም በታላቅ ድምፅ ጮኸ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የርኩስ ጋኔን መንፈስ ያለው።” የግሪኩ ጽሑፍ “መንፈስ” እና “ጋኔን” የሚሉትን ሁለቱንም ቃላት ይዟል።
    reason: lexical_clarification
lexical_decisions:
- source_word: συναγωγῇ
  choice: ምኩራብ
  rationale: በአይሁድ የጉባኤና የአምልኮ ስፍራ የሚያመለክተውን የተለመደና በዐውዱ ትክክለኛ ቃል ይጠቀማል።
- source_word: ἄνθρωπος
  choice: አንድ ሰው
  rationale: በትረካው የተጠቀሰውን ነጠላ ግለሰብ በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ቃል እዚህ የግድ የፆታ ምልክት አያስፈልገውም።
- source_word: ἔχων
  choice: ያለበት
  rationale: ‘ያለው/የያዘው’ የሚለውን መሠረታዊ ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ተጋንኖ የነበረ’ የሚል ሰፋ ያለ ትርጓሜ አይጨምርም።
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: የርኩስ ጋኔን መንፈስ
  rationale: πνεῦμα (‘መንፈስ’) እና δαιμόνιον (‘ጋኔን’) ሁለቱንም ይጠብቃል። የግሪኩ የጉዳይ ምልክት ἀκαθάρτουን ከδαιμονίου ጋር ያዛምዳል፤ ስለዚህ ‘የርኩስ ጋኔን’ ተብሎ ተተርጉሟል።
- source_word: ἀνέκραξεν
  choice: ጮኸ
  rationale: ድምፅን ከፍ አድርጎ መጮኽን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የግሪኩን ተጨባጭ አገላለጽ በክቡርና ለመረዳት ቀላል በሆነ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የጋኔን ቃላት አተረጓጎም
  choice: የርኩስ ጋኔን መንፈስ
