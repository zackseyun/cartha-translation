  rationale: ምንጩ ሁለቱንም፣ ‘መንፈስ’ እና ‘ጋኔን’፣ በግልጽ ይጠቅሳል። አተረጓጎሙ ከጽሑፉ በላይ የሆነ የእምነት ሥርዓት ሳይጨምር ይህን ሙሉ አገላለጽ ይጠብቃል።
