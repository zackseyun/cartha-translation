  text: ከዚያም ወደ ላይ ወስዶት፣ በሰዎች የምትኖረውን ዓለም[b] መንግሥታትን ሁሉ በቅጽበት[a] አሳየው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአንድ አፍታ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የዓለም።” የግሪኩ ቃል ብዙ ጊዜ ሰዎች የሚኖሩበትን ዓለም ያመለክታል፤ በአንዳንድ አውዶች ደግሞ በተለይ የሠለጠነውን ዓለም ወይም የንጉሠ ነገሥትን ግዛት ሊያመለክት ይችላል።
    reason: lexical_alternative
