  rationale: የግሪኩ ጽሑፍ መንግሥታቱን እንዳሳየው ብቻ ይናገራል፤ ራእይ፣ ተአምራዊ ማሳያ ወይም ቃል በቃል የመልክዓ ምድር እይታ መሆኑን አይወስንም።
translation_notes:
