- source_word: τῆς οἰκουμένης
  choice: የሰው ዘር የሚኖርባትን ዓለም
  rationale: οἰκουμένη ከመደበኛው ‘ዓለም’ ይልቅ የሚኖርባትን ዓለም የሚያመለክተውን ልዩ ፍቺ ያቆያል፤ ‘የሮም ግዛት’ ብሎ አያጠብም።
- source_word: ἐν στιγμῇ χρόνου
