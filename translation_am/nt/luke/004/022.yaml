  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: am
  text: ሁሉም ስለ እርሱ መልካም ይናገሩ ነበር[a]፤ ከአፉ በሚወጡት የጸጋ ቃላት[b] ይደነቁ ነበር። እንዲህም ይሉ ነበር፤ “ይህ የዮሴፍ ልጅ አይደለምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እርሱ ይመሰክሩ ነበር።” የግሪኩ አገላለጽ ስለ እርሱ በመልካም መናገራቸውን ወይም ስለ እርሱ መመስከራቸውን ሊያመለክት ይችላል፤ በዚህ አውድ ግን «ይደነቁ ነበር» ከሚለው ጋር የአድናቆት ትርጉሙ ይበልጥ ይስማማል።
    reason: lexical_alternative
  - marker: b
    text: “የጸጋ ቃላት” ማለት በጸጋ፣ በሞገስ ወይም በማራኪነት የተሞሉ ቃላት ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: ስለ እርሱ በመልካም ይናገሩ ነበር
  rationale: በዚህ አውድ ከ«ይደነቁ ነበር» ጋር ተያይዞ የሚያመለክተው መልካም ምስክርነትን ወይም አድናቆትን ነው፤ ይህ አተረጓጎም ለዘመናዊ አማርኛ አንባቢ ግልጽ ነው።
- source_word: ἐθαύμαζον
  choice: ይደነቁ ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ ቀጣይ ምላሻቸውን ያሳያል፤ «ይደነቁ ነበር» አድናቆት የተቀላቀለበትን መገረም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ τοῖς λόγοις
  choice: በ...ቃላት
  rationale: ἐπί ከመስጫ ዘርፍ ጋር የመደነቃቸውን መሠረት ወይም ምክንያት ያሳያል፤ በአማርኛ «በ...ቃላት ይደነቁ» ተፈጥሯዊ ነው።
- source_word: τῆς χάριτος
  choice: የጸጋ
  rationale: የዘርፍ አገባቡ ቃላቱ በጸጋ፣ በሞገስ ወይም በማራኪነት የተሞሉ መሆናቸውን ሊያመለክት ይችላል። «የጸጋ ቃላት» የግሪኩን ሆን ተብሎ ያልተወሰነ ስፋት ይጠብቃል።
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: ከአፉ በሚወጡት
  rationale: ይህ ሐረግ «ቃላት»ን የሚገልጽ ሲሆን ምንጫቸውንም በቀጥታ ያሳያል፤ የመነሻውን ተጨባጭ ምስል ይጠብቃል።
- source_word: Οὐχὶ
  choice: አይደለምን?
  rationale: Οὐχί አዎንታዊ መልስ የሚጠብቅ የክህደት ጥያቄ ነው፤ የአማርኛው «አይደለምን?» ይህን አጽንዖት በተፈጥሯዊነት ያስተላልፋል።
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: ይህ የዮሴፍ ልጅ
  rationale: የግሪኩን ቀጥተኛ የባለቤትነት ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
