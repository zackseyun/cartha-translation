language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: am
  text: ከዚያም ዲያብሎስ፣ “የእግዚአብሔር ልጅ ከሆንህ፣[a] ለዚህ ድንጋይ እንጀራ እንዲሆን በለው” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር ልጅ ስለሆንህ።” የግሪኩ ሁኔታዊ አነጋገር በፈተናው አውድ መነሻው እንደ እውነት ተቀብሎ እንደተነገረ ሊገባ ይችላል፤ ዋናው ጽሑፍ ግን ሁኔታዊውን ቅርጽ ጠብቋል።
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ከዚያም
  rationale: δέ ቀላል የትረካ ማያያዣ ነው፤ “ከዚያም” የክስተቱን ቀጣይነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὁ διάβολος
  choice: ዲያብሎስ
  rationale: በዚህ አውድ διάβολος የታወቀውን ግላዊ ተቃዋሚ ይጠቁማል፤ “ዲያብሎስ” በአማርኛ የተለመደና ግልጽ ስያሜ ነው።
- source_word: Εἰ
  choice: ከሆንህ
  rationale: εἰ ያለውን ሁኔታዊ አቀራረብ በቀጥታ ይጠብቃል፤ ንግግሩ መነሻውን እንደሚያምን ሊገባ ቢችልም ዋናው ጽሑፍ ያንን አይወስንም።
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: በዚህ ክርስቶሳዊ አውድ ሐረጉ የታወቀ ማዕረግን ያመለክታል፤ የአማርኛው የባለቤትነት ግንባታ ትርጉሙን በተፈጥሮ ያቀርባል።
- source_word: εἰπὲ
  choice: እዘዘው
  rationale: λέγω በዚህ ሥርዓተ ንግግር ድንጋዩ እንዲለወጥ የሚነገርለትን ትእዛዝ ይገልጻል፤ “እዘዘው” በአማርኛ ከግዑዝ ግስ ጋር ተፈጥሯዊ ሲሆን ከአውዱ በላይ ኃይል አይጨምርም።
- source_word: τῷ λίθῳ τούτῳ
  choice: ይህን ድንጋይ
  rationale: λίθος በተለምዶ “ድንጋይ” ማለት ነው፤ τούτῳ ያለው አመልካችም ተጠብቋል።
- source_word: ἵνα γένηται
  choice: እንዲሆን
  rationale: ἵνα ከተያያዘው ንዑስ አንቀጽ ጋር የትእዛዙን ይዘት ይገልጻል፤ “እንዲሆን” ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄρτος
  choice: እንጀራ
  rationale: ἄρτος በአጠቃላይ የዋና የእህል ምግብን፣ “bread”ን፣ ያመለክታል፤ “እንጀራ” በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና ለተራ አንባቢ ግልጽ ነው፣ የኢትዮጵያን የተወሰነ ምግብ ቅርጽ ብቻ እንደሚያመለክት ግን መወሰድ የለበትም።
theological_decisions:
- issue: የሁኔታዊው ሐረግ εἰ υἱὸς εἶ τοῦ θεοῦ ኃይል
  choice: “የእግዚአብሔር ልጅ ከሆንህ”
  alternative: “የእግዚአብሔር ልጅ ስለሆንህ”
  rationale: ዋናው ትርጉም የግሪኩን ሁኔታዊ ቅርጽ ይጠብቃል፤ ይህም የፈተናውን የትረካና የሥነ መለኮት ውጥረት የኢየሱስን ልጅነት ሳይክድና አሻሚነቱን ሳይፈታ ያቆያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና በቀላሉ የሚገባ መደበኛ አማርኛን ይጠቀማል። “እዘዘው” ከ“በለው” ይልቅ የንግግሩን ትእዛዛዊ ይዘት በተፈጥሮ ያሳያል፤ የንግግር ምልክቶችና [a] ማጣቀሻው በዋናው ጽሑፍ ተካትተዋል።
