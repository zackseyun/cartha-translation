  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: am
  text: እርሱም በእሷ ላይ ቆሞ ትኩሳቱን ገሠጸ፤ ትኩሳቱም ለቀቃት[a]። እሷም ወዲያው ተነሥታ እነርሱን ማገልገል ጀመረች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክኛው የተገሠጸው ትኩሳቱ እንደሆነና እሷን የለቀቀውም እሱ እንደሆነ በግልጽ ያቀርባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: በእሷ ላይ ቆሞ
  rationale: የኢየሱስን አካላዊ አቋቋምና ቅርበት በተፈጥሯዊ አማርኛ ያስቀምጣል፤ ተጨማሪ ትርጓሜም አያስገባም።
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: ትኩሳቱን ገሠጸ
  rationale: ግሱ ያለውን የሥልጣን ቃና ይጠብቃል፤ የግሪክኛው ቀጥተኛ ተቀባይም ትኩሳቱ መሆኑን በግልጽ ያሳያል።
- source_word: ἀφῆκεν αὐτήν
  choice: ትኩሳቱም ለቀቃት
  rationale: በግሪክኛው የተገመተው የግሱ ባለቤት ትኩሳቱ ነው። በአማርኛ ስሙን መድገም ይህን ግንኙነት ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: παραχρῆμα
  choice: ወዲያው
  rationale: የፈውሱን ፈጣንነት በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀναστᾶσα
  choice: ተነሥታ
  rationale: ከፈውሱ በኋላ ያደረገችውን ፈጣን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διηκόνει αὐτοῖς
  choice: እነርሱን ማገልገል ጀመረች
  rationale: የያልተፈጸመው ግስ የድርጊቱን መጀመርና መቀጠል ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ከፈውሱ በኋላ ማገልገል እንደጀመረች በቀላሉ ያሳያል።
theological_decisions:
- issue: ትኩሳቱን መገሠጹ ሰውኛ ባሕርይ መስጠትን ወይም አጋንንታዊ ምክንያትን ያመለክት እንደሆነ
  choice: “ትኩሳቱን ገሠጸ” የሚለውን ቀጥተኛ አገላለጽ መጠበቅ
  alternative: “ትኩሳቷን በጥብቅ አዘዘው” ወይም “ሕመሟን ገሠጸ”
  rationale: ግሪክኛው ኢየሱስ ትኩሳቱን እንደገሠጸ በቀጥታ ይናገራል። ይህን አገላለጽ መጠበቅ የኢየሱስን ሥልጣን ያሳያል፤ በሽታው አጋንንታዊ ነበር ወይስ በሰውኛ አነጋገር ብቻ ቀርቧል የሚለውን ጉዳይ ግን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ገሠጸ” የሉቃስን የሥልጣን ቃና ይጠብቃል፤ “ማገልገል ጀመረች” ደግሞ የግሱን ያልተፈጸመ ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
