  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: am
  text: ተነሥተውም ከከተማው አስወጡት፤ ከተማቸው ተሠርታበት ወደ ነበረው ተራራ ጫፍ[a] ወሰዱት፤ ወደ ታች ሊወረውሩት[b] ዘንድ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ተራራው ጠርዝ።” የግሪኩ ቃል በቀጥታ “ቅንድብ” ማለት ሲሆን፣ እዚህ የከፍታውን ጫፍ ወይም ጠርዝ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከአፋፉ ላይ ሊፈጠፍጡት።” የግሪኩ ግስ አንድን ሰው ከከፍታ ወደ ታች መወርወርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: ተነሥተው
  rationale: የተከታታይ ድርጊቱንና ሕዝቡ በድንገት ወደ ተግባር መንቀሳቀሱን ያለ ተጨማሪ ትርጓሜ ያሳያል።
- source_word: ἐξέβαλον
  choice: አስወጡት
  rationale: ከቦታው በግድ የማስወጣትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከግሱ በላይ የሆነ የዓመፅ ዝርዝር አይጨምርም።
- source_word: πόλεως
  choice: ከተማ
  rationale: πόλιςን በመደበኛው እና በተፈጥሯዊው የአማርኛ ቃል ይወክላል፤ ቃሉ በአማርኛ በግድ ትልቅ ከተማን ብቻ አያመለክትም።
- source_word: ἤγαγον
  choice: ወሰዱት
  rationale: ἄγω እዚህ የሚገልጸውን ወደ አንድ ቦታ የመምራት/የመውሰድ ሰፊ ትርጉም ይጠብቃል፤ ‘ጎተቱት’ የሚለውን በግልጽ ያልተነገረ ዝርዝር አይጨምርም።
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: ወደ የተራራው ጫፍ
  rationale: ὀφρύς በቀጥታ ‘ቅንድብ’ ሊል ቢችልም፣ ስለ ከፍታ ሲነገር ጠርዙን ወይም ጫፉን ያመለክታል፤ ‘ጫፍ’ ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: ከተማቸው ተሠርቶበት ወደነበረው
  rationale: የግሪኩን ተገብሮ አድራጊ ያልተጠቀሰበት አገላለጽና የቀደመ ሁኔታ ይጠብቃል፤ αὐτῶνንም ‘ከተማቸው’ በማለት ይወክላል።
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: ይህንም ያደረጉት ወደ ታች ሊወረውሩት ነበር
  rationale: ὥστε ከኢንፊኒቲቭ ጋር በዚህ ዐውድ የሚያሳየውን ዓላማ/የታሰበ ውጤት በግልጽ አማርኛ ያቀርባል፤ κατακρημνίσαι የሚያመለክተውን ከከፍታ ወደ ታች መወርወር ይገልጻል።
theological_decisions:
- issue: በሕዝቡ ድርጊት ውስጥ የተመለከተው የዓመፅ መጠን
  choice: በግድ ከከተማው እንዳስወጡትና ከከፍታው ወደ ታች ሊወረውሩት እንዳሰቡ በድርጊቶቹ ቅደም ተከተል ማሳየት
  alternative: ‘ጎተቱት’ ወይም ‘ሊገድሉት ሞከሩ’ ብሎ በትርጉሙ ውስጥ በቀጥታ ማብራራት
  rationale: ጥቅሱ ገዳይ ዓላማን በግልጽ ቢያሳይም፣ የግሪኩ ጽሑፍ ያልጠቀሳቸውን የድርጊት ዝርዝሮች ሳይጨምር ዓላማው ከተገለጹት ተከታታይ ድርጊቶች እንዲታይ ተደርጓል።
