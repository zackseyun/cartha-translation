review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence: the people rise, force Jesus out of the town, take him to the hill’s edge on which their town was built, and intend to cast him down. However, “ይህንም ያደረጉት ... ነበር” adds an explanatory retrospective construction not present in the Greek and weakens the direct purpose force of ὥστε + infinitive. The revised wording renders that purpose directly.'
  naturalness: Most of the Amharic is clear and suitably formal. The relative phrase is more natural with the feminine passive form for ከተማ, and a direct purpose clause is considerably smoother than “ይህንም ያደረጉት ... ነበር.”
  terminology: “አስወጡት,” “ወሰዱት,” and “ጫፍ” are appropriate modern-standard renderings. “ጫፍ” permits the intended sense of ὀφρύς as a brow/edge without asserting a specific cliff. The footnotes are correctly anchored to the relevant Amharic terms.
  issues:
  - severity: medium
    issue: The final purpose clause is indirect and interpretively expanded.
    rationale: “ይህንም ያደረጉት ... ነበር” means roughly “the reason they did this was ...” rather than directly expressing ὥστε κατακρημνίσαι as the intended outcome/purpose. “ሊወረውሩት ዘንድ” preserves the source syntax and is more natural.
  - severity: low
    issue: Agreement in the relative clause can be improved.
    rationale: Since ከተማ is feminine, “ተሠርታበት” is the natural passive form for “the town had been built on it.”
  revised_text: ተነሥተውም ከከተማው አስወጡት፤ ከተማቸው ተሠርታበት ወደ ነበረው ተራራ ጫፍ[a] ወሰዱት፤ ወደ ታች ሊወረውሩት[b] ዘንድ።
