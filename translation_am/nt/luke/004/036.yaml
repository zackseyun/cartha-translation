  text: በሁሉም ላይ መደነቅ መጣ፤ እርስ በርሳቸውም፣ «ይህ ምን ዓይነት ቃል[a] ነው? ርኩሳን መናፍስትን በሥልጣንና በኃይል ያዝዛል፤ እነርሱም ይወጣሉ!» እያሉ ይነጋገሩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህ ምን ዓይነት መልእክት ነው?» የግሪኩ λόγος (ሎጎስ) «ቃል፣» «መልእክት» ወይም «ጉዳይ» ማለት ሊሆን ይችላል።
