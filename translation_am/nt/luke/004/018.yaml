  rationale: ቅርብ አውዱ ምርኮኞችን፣ ዕውሮችንና የተሰበሩ/የተጨቆኑ ሰዎችን በመጥቀስ የነፃነትና የመታደስ ምስልን ያጠናክራል። ሉቃስ በሌሎች ስፍራዎች ἄφεσιςን ለኃጢአት ይቅርታ ቢጠቀምም፣ እዚህ ያለውን ሰፊ የነፃነት ትርጉም ዋና ማድረግና የይቅርታውን አማራጭ በማስታወሻ መጠበቅ አሻሚነቱን አያጠፋም።
