source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: am
  text: የጌታ መንፈስ በእኔ ላይ ነው፤ ለድሆች የምሥራች እንዳበስር ቀብቶኛልና። ለምርኮኞች መፈታትን[a]፣ ለዕውሮችም እንደገና ማየትን እንዳውጅ፣ የተጨቆኑትንም[b] ነፃ እንድለቅ ልኮኛል፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መፈታት” ተብሎ የተተረጎመው የግሪክ ቃል ἄφεσις “ይቅርታ” ማለትም ሊሆን ይችላል፤ እዚህ ስለ ምርኮኞችና ስለ ተጨቆኑት የሚናገረው አውድ ግን የመፈታትን ወይም የነፃነትን ትርጉም ይደግፋል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል “የተሰበሩትን” ወይም “የተቀጠቀጡትን”፤ “የተጨቆኑትን” የሚለው በዚህ የነፃነት አውድ ያለውን ፈሊጣዊ ሐሳብ ያስተላልፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: የጌታ መንፈስ
  rationale: የግሪኩን የባለቤትነት/የምንጭ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ ኢሳይያስን የሚያስታውሰውንም አገላለጽ ይጠብቃል።
- source_word: ἐπ’ ἐμέ
  choice: በእኔ ላይ ነው
  rationale: በግሪክ ያልተገለጸውን አያያዥ ግስ አማርኛ በሚፈልገው መጠን በመጨመር የἐπίን ምስላዊ ኃይል ይጠብቃል።
- source_word: οὗ εἵνεκεν
  choice: …ና
  rationale: የምክንያት ግንኙነቱን በተፈጥሯዊው የአማርኛ ምክንያታዊ ቅጥያ ያሳያል።
- source_word: ἔχρισέν με
  choice: ቀብቶኛል
  rationale: χρίω ያለውን የመቀባትና የመሢሓዊ ሹመት ጥላ ከማጥበብ ይጠብቃል፤ የፍጹም ጊዜ ቅርጹም ያለፈው ተግባር አሁን ያለውን ውጤት ያሳያል።
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: ለድሆች የምሥራች እንዳበስር
  rationale: የመልካም ዜናን ይዘትና የማወጅን ተግባር በግልጽ ዘመናዊ አማርኛ ያስተላልፋል፤ πτωχοῖςንም ያለ ትርጉም ጠበብ ለድሆች ይላል።
- source_word: ἀπέσταλκέν με
  choice: ልኮኛል
  rationale: የተፈጸመው መላክ አሁንም የሚቀጥል ተልእኮ እንዳለው የግሪኩን ፍጹም ጊዜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κηρύξαι
  choice: እንዳውጅ
  rationale: κηρύσσω የሚያመለክተውን ይፋዊ አዋጅ ይይዛል፤ ከሃይማኖታዊ ስብከት ብቻ ጋር አያጠብበውም።
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: ለምርኮኞች ነፃ መውጣትን
  rationale: αἰχμάλωτοιን እንደ ምርኮኞች፣ ἄφεσιςንም በኢሳይያሳዊው የነፃ መውጣት አውድ ይተረጉማል፤ የይቅርታ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: ለዕውሮችም እንደገና ማየትን
  rationale: ἀνάβλεψις ያለውን የማየት መመለስ ወይም ማየት መጀመር ትርጉም ይገልጻል።
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: የተጨቆኑትን ነፃ ለማውጣት
  rationale: ቃል በቃል ‘የተሰበሩትን በነፃነት መላክ’ የሚለውን ግትር አገላለጽ በአውዱ የነፃ ማውጣት ሐሳብ ያቀርባል፤ የτεθραυσμένους ቃል በቃል አማራጭ በማስታወሻ ተጠብቋል።
