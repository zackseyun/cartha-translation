- source_word: Γέγραπται
  choice: እንዲህ ተብሎ ተጽፎአል
  rationale: ቅዱስ ጽሑፍን ለመጥቀስ የሚያገለግለውን ፍጹም ተደራጊ ቅርጽ እና የጽሑፉን ቀጣይ ሥልጣን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Κύριον τὸν θεόν σου
  choice: ጌታ አምላክህን
