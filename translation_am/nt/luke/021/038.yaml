  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: am
  text: ሕዝቡም ሁሉ እርሱን ለመስማት ማልደው በቤተ መቅደሱ[a] ወደ እርሱ ይመጡ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ἱερόν የቤተ መቅደሱን ሕንፃ ብቻ ሳይሆን ግቢውንና አደባባዮቹን ጨምሮ መላውን የቤተ መቅደስ ስፍራ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ሕዝቡም ሁሉ
  rationale: የሕዝቡን ሰፊና አጠቃላይ ተሳትፎ ያሳያል፤ ይህም ያለ ልዩነት እያንዳንዱን ግለሰብ ማለት ሳይገድድ የግሪኩን አጠቃላይ አገላለጽ ይጠብቃል።
- source_word: ὤρθριζεν
  choice: ማልደው ... ይመጡ ነበር
  rationale: ὀρθρίζω በማለዳ መነሣትን ወይም ቀድሞ መምጣትን ያመለክታል፤ ያልተፈጸመው የግስ ጊዜም ተደጋጋሚ ልማድን ስለሚገልጽ፣ “ይመጡ ነበር” ይህን ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρὸς αὐτόν
  choice: ወደ እርሱ
  rationale: πρός ከተሳቢ ጋር ወደ አንድ ሰው የሚደረግን እንቅስቃሴ ያመለክታል፤ “ወደ እርሱ” ይህን በግልጽ ይገልጻል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የቤተ መቅደሱን ግቢና አደባባዮች ጨምሮ መላውን ስፍራ ያመለክታል፤ የተለመደው “ቤተ መቅደስ” በዋናው ጽሑፍ ተጠብቆ ልዩነቱ በማስታወሻ ተብራርቷል።
- source_word: ἀκούειν αὐτοῦ
  choice: እርሱን ለመስማት
  rationale: የዓላማ አገላለጹን በግልጽ ይጠብቃል፤ በዚህ አውድ “መስማት” እርሱ የሚናገረውን ለማዳመጥ መምጣታቸውን ያመለክታል።
