lexical_decisions:
- source_word: εἶδεν
  choice: አየ
  rationale: የὁράω የአንድ ጊዜ ያለፈ ድርጊት ቅርጽ ቀጥተኛውን የማየት ትርጉም ይሰጣል፤ «አየ» የትረካውን ቀላል ፍሰት ይጠብቃል።
- source_word: δέ
  choice: ደግሞ
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን ለስላሳ የትረካ ትስስርን ያመለክታል፤ «ደግሞ» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τινα
  choice: አንዲት
  rationale: τις ያልተወሰነችን ሴት ያስተዋውቃል፤ በአማርኛ «አንዲት» ይህን በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: χήραν
  choice: መበለት
  rationale: χήρα በቀጥታ «መበለት» ማለት ሲሆን በዐውዱ ያለውን ማኅበራዊ የተጋላጭነት ሁኔታም ይጠብቃል።
- source_word: πενιχρὰν
  choice: ድሀ
  rationale: πενιχρός የገንዘብ እጥረትን ወይም ዝቅተኛ አቅምን ያመለክታል፤ «ድሀ» ተፈጥሯዊና በቂ ትክክለኛ ነው፣ «ምንም የሌላት» ግን ትርጉሙን ሊያጠናክር ይችላል።
- source_word: βάλλουσαν
  choice: ስታስገባ
  rationale: βάλλω በመሠረቱ መጣልን ሊያመለክት ቢችልም፣ ገንዘብን በመባ ማስቀመጫ ውስጥ በማኖር ዐውድ «ስታስገባ» ዘመናዊና ተፈጥሯዊ ነው።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ἐκεῖ የቦታ ተውሳክ ሲሆን ቀደም ሲል የተጠቀሰውን ቦታ ያመለክታል፤ «በዚያ» ቀጥተኛ አቻው ነው።
- source_word: λεπτὰ δύο
  choice: ሁለት ትንንሽ የመዳብ ሳንቲሞች
  rationale: λεπτά እጅግ አነስተኛ ዋጋ የነበራቸው የመዳብ ሳንቲሞች ነበሩ፤ ይህ አተረጓጎም ቁጥራቸውን፣ መጠናቸውንና የሳንቲሙን ዓይነት ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
