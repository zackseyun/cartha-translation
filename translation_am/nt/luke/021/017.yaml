lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: የተጠላችሁ ትሆናላችሁ
  rationale: የወደፊት ጊዜውን አያያዥ ግስና ተገብሮአዊውን ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል፤ የጥላቻውን ቀጣይነትም አያስወግድም።
- source_word: ὑπὸ πάντων
  choice: በሁሉም
  rationale: ὑπό ከባለቤት አገናዛቢ ጋር የድርጊቱን ፈጻሚ ያመለክታል፤ πάντων ያለውን ሰፊ ‘ሁሉ’ በአጭር መልኩ ይጠብቃል።
- source_word: διὰ τὸ ὄνομά μου
  choice: በስሜም ምክንያት
  rationale: διά ከወንድ ተሳቢ ጋር ምክንያትን ያመለክታል። ‘ስሜ’ የሚለውን የግሪኩን ቀጥተኛ አገላለጽ በመጠበቅ የኢየሱስን ማንነት፣ ሥልጣንና ለእርሱ ያለውን ታማኝነት የሚያካትተውን ስፋት ይተዋል።
theological_decisions:
- issue: በስደት አውድ ውስጥ ‘ስሜ’ የሚለው አገላለጽ ትርጉም
  choice: ‘በስሜ ምክንያት’ የሚለውን ቀጥተኛ አገላለጽ ማቆየት
  alternative: ‘በእኔ ምክንያት’ ወይም ‘የእኔ ስለሆናችሁ’
  rationale: ግሪኩ በግልጽ ‘በስሜ ምክንያት’ ይላል። በሉቃስና በሐዋርያት ሥራ ውስጥ ‘ስም’ ማንነትን፣ ሥልጣንንና ለኢየሱስ የሚሰጥን እምነታዊ ታማኝነት ሊያመለክት ስለሚችል፣ ቀጥተኛውን አገላለጽ ማቆየት ይህን ሙሉ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩን ቃላት ቅደም ተከተል በግድ ሳይከተል ትኩረቱን በ‘በስሜም ምክንያት’ ላይ ለማቆየት ሐረጉ በመጀመሪያ ተቀምጧል። ‘ሁሉም’ የሚለው የጽሑፉን ሰፊ አገላለጽ ይጠብቃል፤ እያንዳንዱን ሰው ያለ ልዩነት እንደሚያመለክት ግን አይገደድም።
