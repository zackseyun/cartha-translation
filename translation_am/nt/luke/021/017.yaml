review_pass:
  verdict: revise
  source_fidelity: The draft preserves the core sense of future passive hostility by all people because of Jesus’ name. However, the enclitic ም in በስሜም introduces an unwarranted additive sense (“and because of my name”), which is absent from the Greek.
  naturalness: በስሜ ምክንያት በሁሉም ትጠላላችሁ is concise, idiomatic modern Amharic and directly expresses the Greek future passive construction.
  terminology: ስሜ (“my name”) properly retains the source expression and its contextual breadth without interpretively replacing it with “because of me.” The footnote has been adjusted to address the hearers’ allegiance (ያላችሁን), rather than using the first-person plural ያለንን.
  issues:
  - severity: medium
    issue: Unwarranted additive enclitic in በስሜም
    rationale: The ም normally adds “also/and,” but καὶ in the Greek joins the sentence to the preceding context; it does not modify διὰ τὸ ὄνομά μου as “also because of my name.” The Amharic sentence should read በስሜ ምክንያት.
  - severity: low
    issue: Footnote shifts the audience from “you” to “we”
    rationale: The wording ለእርሱ ያለንን ታማኝነት introduces first-person plural perspective, whereas the verse addresses second-person plural disciples. ያላችሁን maintains the passage’s perspective.
  revised_text: በስሜ ምክንያት በሁሉም ትጠላላችሁ።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ “በእኔ ምክንያት።” “ስሜ” የሚለው አገላለጽ የኢየሱስን ማንነትና ሥልጣን፣ እንዲሁም ለእርሱ ያላችሁን ታማኝነት መግለጽ ሊያመለክት ይችላል።
