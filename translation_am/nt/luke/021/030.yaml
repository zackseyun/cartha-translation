base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: am
  text: ቀድሞውኑ ቅጠል ሲያወጡ[a]፣ እናንተ ራሳችሁ አይታችሁ በጋ ቀድሞውኑ እንደቀረበ ታውቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በቃል ይበልጥ ቀርቦ፣ “አዲስ እድገት ሲያወጡ።” ግሪክኛው “ቅጠል” ብሎ በግልጽ አይጠቅስም፤ ነገር ግን የዛፎች አውድ ይህን ፍቺ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ሲያወጡ
  rationale: ጊዜንና ሁኔታን የሚያመለክተውን አንቀጽ በተፈጥሯዊ የአማርኛ ‘ሲ-’ አወቃቀር ያቀርባል።
- source_word: προβάλωσιν
  choice: ቅጠል ሲያወጡ
  rationale: ግሱ በቀጥታ ‘ቅጠል’ ባይልም፣ በቁጥር 29 የዛፎች አውድ አዲስ እድገትን ማውጣት ያመለክታል፤ ‘ቅጠል ማውጣት’ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἤδη
  choice: ቀድሞውኑ
  rationale: በመጀመሪያው አጠቃቀም የወቅቱ ምልክት አስቀድሞ መታየቱን ይጠብቃል። በሁለተኛው ቦታ ይህ ፍቺ ‘እንደቀረበ’ በሚለው ተፈጥሯዊ አገላለጽ ተካትቷል።
- source_word: βλέποντες ἀφ’ ἑαυτῶν
  choice: እናንተ ራሳችሁ አይታችሁ
  rationale: ተሳቢውንና ሰሚዎቹ ከራሳቸው ምልከታ እንደሚያውቁ የሚያሳየውን አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γινώσκετε
  choice: ታውቃላችሁ
  rationale: ከቀጥተኛ ምልከታ የሚመጣውን የተለመደ እውቀት በቀላልና ግልጽ ቃል ይገልጻል።
- source_word: ἐγγὺς
  choice: እንደቀረበ
  rationale: ጊዜያዊ ቅርበትን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: θέρος
  choice: በጋ
  rationale: የዓመቱን ሞቃት ወቅት የሚገልጽ መደበኛና ለሁሉም ግልጽ የአማርኛ ቃል ነው።
