  text: And not a hair from your head will perish[a].
translation:
  language: am
  text: ከራሳችሁም አንዲት ጸጉር እንኳ አትጠፋም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው አጽንዖታዊ ድርብ እምቢታ ስላለ፣ ቃል በቃል ሲቀርብ፣ “ከራሳችሁ አንዲት ጸጉር እንኳ በፍጹም አትጠፋም” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል አያያዥ በተፈጥሯዊ የአማርኛ ቅጥያ ያስተላልፋል፤ በግልጽ ያልተነገረ ተቃርኖ አይጨምርም።
- source_word: θρὶξ
  choice: አንዲት ጠጕር
  rationale: ነጠላውን ስም በተፈጥሯዊ አማርኛ ይገልጣል፤ የሙሉ ጥበቃን ምሳሌያዊ አነጋገርም ይጠብቃል።
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: ከራሳችሁ
  rationale: ἐκ የሚያመለክተውን ‘ከ’ ግንኙነትና የሁለተኛ መደብ ብዙ ቁጥርን በግልጽ ያስተላልፋል።
- source_word: οὐ μὴ
  choice: እንኳ አት...ም
  rationale: አጽንዖታዊውን እምቢታ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘እንኳ’ ከአንዲት ጠጕር ጋር የተያያዘውን ጠንካራ ማረጋገጫ ያጎላል።
- source_word: ἀπόληται
  choice: አትጠፋም
  rationale: ‘መጥፋት/መጥፋት ላይ መድረስ’ የሚለውን ሰፊ ትርጉም ይጠብቃል፤ ጥቅሱን ከአውዱ በላይ በአካላዊ መጥፋት ብቻ አይገድበውም።
theological_decisions:
- issue: በአቅራቢያው ካለው የስደትና የአንዳንዶች ሞት ትንቢት ጋር የሚታየው ውጥረት
  choice: ንግግሩን ያለ ትርጓሜያዊ ጭማሪ እንደ ጠንካራና ምሳሌያዊ የጥበቃ ማረጋገጫ ማቅረብ
  alternative: ምንም ዓይነት አካላዊ ጉዳት ፈጽሞ እንደማይደርስ የሚሰጥ ቃል በቃል የሆነ ተስፋ
  rationale: የቅርብ አውዱ አንዳንድ ደቀ መዛሙርት እንደሚገደሉ ይናገራል። ስለዚህ ዋናው ጽሑፍ ውጥረቱን ሳይፈታ የግሪኩን ጠንካራ ማረጋገጫ ብቻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ጠጕር’ የተመረጠው የራስን አንዲት ፀጉር በተፈጥሯዊ አገላለጽ ለማመልከት ነው፤ የአውዱ ሥነ መለኮታዊ ውጥረት አልተወገደም።
