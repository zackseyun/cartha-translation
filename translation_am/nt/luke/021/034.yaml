lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: ነገር ግን … ራሳችሁን ጠብቁ
  rationale: የትእዛዙን የንቃትና የጥንቃቄ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግሪኩ ተመላሽ ተውላጠ ስምም ‘ራሳችሁን’ በሚለው ተጠብቋል።
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: ልባችሁ … እንዳይከብድ
  rationale: ‘መክበድ’ የሚለው የምንጩን ዘይቤ ይጠብቃል፤ ‘ልብ’ም ስሜትን ብቻ ሳይሆን ውስጣዊ ሕይወትንና መንፈሳዊ ንቃትን ያመለክታል።
- source_word: κραιπάλῃ
  choice: በልቅ ድግስ[a]
  rationale: ቃሉ ከልክ ያለፈ የመጠጥ ግብዣን ወይም የዚያን መዘዝ ሊያመለክት ስለሚችል፣ ‘ልቅ ድግስ’ ሰፊውን ሐሳብ በተፈጥሯዊ አማርኛ ይይዛል፤ ሌላው የቃሉ ገጽታ በማስታወሻ ተገልጿል።
- source_word: μέθῃ
  choice: በስካር
  rationale: ስካርን የሚያመለክተውን ስም በቀጥታና በግልጽ ቋንቋ ያስተላልፋል።
- source_word: μερίμναις βιωτικαῖς
  choice: በኑሮ ጭንቀት
  rationale: የዕለት ተዕለት ምድራዊ ኑሮን የሚመለከቱ ስጋቶችን ሳያጠብ ወይም ከጽሑፉ በላይ አሉታዊ ፍርድ ሳይጨምር ይገልጣል።
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: ድንገት እንዳይደርስባችሁ
  rationale: ቀኑ ባልታሰበ ጊዜ በሰዎቹ ላይ የመድረሱን ማስጠንቀቂያ በተፈጥሯዊ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ያም ቀን
  rationale: ምንጩ የሚለውን ‘ያ ቀን’ የሚለውን ብቻ ይጠብቃል፤ ‘የፍርድ ቀን’ የሚል ትርጓሜያዊ ማብራሪያ አይጨምርም።
