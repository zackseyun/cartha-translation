    text: ወይም፣ “ከልክ ያለፈ የመጠጥ ግብዣ”፤ የግሪኩ ቃል ከልክ ያለፈ መጠጥንና ፈንጠዝያን፣ ወይም ከዚያ በኋላ የሚመጣውን ከባድ ስሜት ሊያመለክት ይችላል።
