review_pass:
  verdict: revise
  source_fidelity: The imperative and inferential connector are conveyed well. However, «ምን መልስ እንደምትሰጡ» can mean any reply and does not adequately retain ἀπολογηθῆναι, which denotes making a defense, often in a formal judicial setting. The revised wording explicitly preserves the defensive sense without over-specifying the setting.
  naturalness: The draft is generally idiomatic modern Amharic, but the construction is more direct and clear when the defense is stated as the object of advance deliberation. «በልባችሁ ወስኑ» is natural and retains the idiomatic inner-resolution image.
  terminology: «ራሳችሁን ለመከላከል» accurately represents the middle infinitive’s sense of making one’s defense. «አስቀድማችሁ ላለማሰብ» preserves the broad sense of προμελετᾶν—deliberating or preparing in advance—without narrowing it to spoken rehearsal alone.
  issues:
  - severity: medium
    issue: The main text renders ἀπολογηθῆναι as «ምን መልስ እንደምትሰጡ».
    rationale: A generic answer does not necessarily constitute a defense. The Greek specifically refers to answering in one’s own defense, so the defensive element should be explicit in the translation.
  - severity: low
    issue: Footnote b is less exact than it could be.
    rationale: Its wording is understandable, but naming «የመከላከያ ንግግራችሁን» more clearly represents rehearsal of a defense.
