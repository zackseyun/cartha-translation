- source_word: τῷ λαῷ τούτῳ
  choice: በዚህም ሕዝብ ላይ
  rationale: በὀργή ጋር ያለውን ዳቲቭ ቁጣው የሚያርፍበትን ሕዝብ በሚያሳይ ተፈጥሯዊ አማርኛ ይተረጉማል፤ ‘ይህ’ የሚለውንም አመልካች ይጠብቃል።
theological_decisions:
- issue: የγῆ እና ‘የዚህ ሕዝብ’ ወሰንና ተጠቃሽ
  choice: በዋናነት አካባቢያዊ ፍርድን የሚያመለክት ሆኖ ‘ምድሪቱ’ ተመርጧል፤ ‘ይህ ሕዝብ’ የሚለውም ተጠብቋል።
  alternative: γῆን ዓለም አቀፍ ወሰን ባለው ‘በምድር ላይ’ ማቅረብ።
  rationale: የሉቃስ የቅርብ አውድ የኢየሩሳሌምን መከበብ፣ መፍረስና የነዋሪዎቿን ዕጣ ያተኩራል። ሆኖም γῆ ሰፊ ትርጉም ሊኖረው ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- issue: የὀργή ባለቤትና ባሕርይ
  choice: ‘ቁጣ’ ብቻ ተብሎ ተተርጉሟል፤ ባለቤቱ በጽሑፉ ላይ አልተጨመረም።
  alternative: ‘የእግዚአብሔር ቁጣ’ ወይም ‘ፍርድ’ ብሎ ማብራራት።
  rationale: አውዱ መለኮታዊ ቁጣን ሊያመለክት ቢችልም የግሪኩ ጽሑፍ ባለቤቱን አይጠቅስም። ስለዚህ የጽሑፉ የሥነ መለኮት ውጥረትና አሻሚነት ተጠብቋል።
- issue: የτῷ λαῷ τούτῳ ዳቲቭ ግንኙነት
  choice: ‘በዚህም ሕዝብ ላይ’ ተብሎ ቁጣው የሚያርፍበትን አካል ያሳያል።
  alternative: ‘ለዚህ ሕዝብ’ ብሎ የዳቲቩን ቅርጽ ይበልጥ በቀጥታ ማቅረብ።
  rationale: ‘ቁጣ በ…ላይ’ የሚለው በአማርኛ ተፈጥሯዊ ሲሆን የተጎጂውን ግንኙነት ያሳያል። የ‘ለ’ አማራጭ ግን የግሪኩን ሰዋሰዋዊ ክፍተት ስለሚያሳይ በማስታወሻ ቀርቧል።
