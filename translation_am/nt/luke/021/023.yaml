    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: ወዮላቸው
  rationale: የትንቢታዊ ልቅሶንና የፍርድ ማስጠንቀቂያን ኃይል ይጠብቃል፤ በአማርኛም ተፈጥሯዊ ነው።
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: እርጉዞች
  rationale: ቃል በቃል ‘በማህፀን ያላቸው’ የሚለውን በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ταῖς θηλαζούσαις
  choice: ሕፃናትን የሚያጠቡ ሴቶች
  rationale: በግሪኩ የተገለጸውን የማጥባት ተግባር በተፈጥሯዊ አማርኛ ያሳያል፤ የተሰወረውን ተሳቢ ‘ሕፃናትን’ ለግልጽነት ይገልጻል።
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: በእነዚያ ቀናት
  rationale: የግሪኩን የጊዜ አመልካች ቅርጽ በቀጥታና በተለመደ አማርኛ ይጠብቃል።
- source_word: ἀνάγκη μεγάλη
  choice: ታላቅ መከራ
  rationale: በዚህ የጥፋትና የጦርነት አውድ ἀνάγκη የግዴታን ሐሳብ ብቻ ሳይሆን ከባድ ጭንቀትና መከራን ያመለክታል።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድሪቱ ላይ
  rationale: γῆ ምድርን ወይም የተወሰነች ሀገር/አገርን ሊያመለክት ይችላል። የተወሰነው ‘ምድሪቱ’ በኢየሩሳሌምና በይሁዳ ላይ ያተኮረውን አውድ ይከተላል፤ የአማራጭ ትርጉሙ በማስታወሻ ቀርቧል።
- source_word: ὀργή
  choice: ቁጣ
