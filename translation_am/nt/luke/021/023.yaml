base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: am
  text: በእነዚያ ቀናት ለእርጉዞችና ሕፃናትን ለሚያጠቡ ሴቶች ወዮላቸው! በምድር[a] ላይ ታላቅ መከራ፣ በዚህም ሕዝብ ላይ ቁጣ[b] ይሆናልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአገሩ ላይ።” γῆ የሚለው የግሪክ ቃል “ምድር” ወይም “አገር” ማለት ይችላል፤ በዙሪያው ያለው አውድ በኢየሩሳሌምና በይሁዳ ላይ ስለሚያተኩር አካባቢያዊ ንባብን ይደግፋል።
