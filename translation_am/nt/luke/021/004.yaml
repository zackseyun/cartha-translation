theological_decisions:
- issue: በመበለቲቱ ስጦታ ውስጥ βίος የሚለው ቃል ትርጉም
  choice: ቁሳዊ የኑሮ መተዳደሪያ
  alternative: መላ ሕይወቷ
  rationale: ዐውዱ ስለ ገንዘብ መስጠት ነው፤ βίοςም እዚህ ሰው የሚኖርበትን ሀብት ያመለክታል። ‘ሕይወቷን ሁሉ’ ማለት ጽሑፉ ከሚለው በላይ ህልውናዋን እንደሰጠች ሊያስመስል ይችላል።
- issue: τὰ δῶρα የሚያመለክተው
  choice: ስጦታዎቹ
  alternative: መባዎቹ፤ የቤተ መቅደሱ ግምጃ ቤት
  rationale: ግሪኩ በቀጥታ ‘ስጦታዎቹ’ ይላል። ዐውዱ የቤተ መቅደስ ስጦታዎች መሆናቸውን ቢያሳይም፣ ‘ግምጃ ቤት’ ማለት ከቃሉ በላይ የቦታ ዝርዝር ይጨምራል።
