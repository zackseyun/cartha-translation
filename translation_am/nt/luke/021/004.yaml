    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከድህነቷ” ወይም “ከችግሯ።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “የምትኖርበትን ሁሉ” ወይም “መተዳደሪያዋን ሁሉ።” ይህ መላ ህልውናዋን ሳይሆን የኑሮ መተዳደሪያዋን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: እነዚህ ሁሉ
  rationale: γάρ የሚያሳየው ከቀደመው ንግግር ጋር ያለው የማብራሪያ ግንኙነት በአማርኛው የአረፍተ ነገሩ ፍሰት ተገልጧል፤ πάντες οὗτοι ደግሞ በቀጥታ ‘እነዚህ ሁሉ’ ተብሏል።
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: ካላቸው ትርፍ ላይ
  rationale: περισσεύοντος ከፍላጎታቸው በላይ የተረፈውን ወይም ብዛታቸውን ያመለክታል፤ ‘ትርፍ’ ከὑστέρημα ጋር ያለውን ንፅፅር በተፈጥሮ ያስቀምጣል።
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: ወደ ስጦታዎቹ አስገብተዋል
  rationale: ἔβαλον የማስገባትን ተግባር ያሳያል፤ τὰ δῶρα በቅርብ ትርጉሙ ‘ስጦታዎቹ’ ነው፣ በዐውዱም በቤተ መቅደስ የሚቀርቡ ስጦታዎችን ያመለክታል።
- source_word: αὕτη δὲ
  choice: እርሷ ግን
  rationale: አስቀድሞ የተጠቀሰችውን መበለት ያመለክታል፤ δέ የሚፈጥረው ንፅፅር ‘ግን’ በሚለው ተጠብቋል።
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: ከእጦቷ ላይ
  rationale: ὑστέρημα እጥረትን፣ ችግርን ወይም የሚያስፈልግ ነገር መጉደልን ያመለክታል፤ ‘እጦት’ ከ‘ትርፍ’ ጋር ያለውን የቃላት ንፅፅር ይጠብቃል።
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: ያላትን መተዳደሪያ ሁሉ
  rationale: βίος በዚህ የገንዘብ ዐውድ የመኖሪያ ሀብትን ወይም የኑሮ መተዳደሪያን እንጂ መላ ሕይወቷን አያመለክትም። ὃν εἶχεν ‘ያላትን’ ተብሎ በተፈጥሮ ተካቷል።
- source_word: ἔβαλεν
  choice: አስገባች
