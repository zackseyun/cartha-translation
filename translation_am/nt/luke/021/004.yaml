  text: ምክንያቱም፣ እነዚህ ሁሉ ከትርፋቸው ለመባዎቹ[a] ሰጥተዋል፤ እርሷ ግን ከእጦቷ[b] ያላትን የኑሮ መተዳደሪያ ሁሉ[c] ሰጠች።
  philosophy: optimal-equivalence
  footnotes:
