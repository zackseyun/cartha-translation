  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: am
  text: እርሱም እንዲህ አለ፦ “እንዳትሳቱ ተጠንቀቁ፤ ብዙዎች፣ ‘እኔ ነኝ’[a] እና ‘ጊዜው ቀርቧል’ እያሉ በስሜ ይመጣሉና። እነርሱን ተከትላችሁ አትሂዱ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እኔ ነኝ” የሚለው “የሚጠበቀው እኔ ነኝ” ማለትን ሊያመለክት ይችላል፤ በዚህ አውድ ምናልባት መሲሕ ነኝ ብሎ በሐሰት የሚናገር ሰውን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: እንዳትሳቱ ተጠንቀቁ
  rationale: የΒλέπετεን የንቃት ትእዛዝ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ πλανηθῆτε ያለውን ከእውነት የመሳት ሐሳብም ይጠብቃል።
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: በስሜ ይመጣሉ
  rationale: ሰዎቹ የኢየሱስን ስም፣ ሥልጣን ወይም ማንነት እየጠቀሱ እንደሚመጡ የሚገልጸውን ልማዳዊ አገላለጽ በቀጥታና በተለመደ መንገድ ይተረጉማል።
- source_word: Ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: በግሪኩ ያልተገለጸውን ተሳቢ ሳይጨምር የንግግሩን አጭርነትና አሻሚነት ይጠብቃል፤ የአውዱ ፍቺ በማስታወሻ ተብራርቷል።
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: ጊዜው ቀርቧል
  rationale: καιρός የተወሰነውን ወይም ወሳኙን ጊዜ ሊያመለክት የሚችል ሲሆን፣ ἤγγικεν የቀረበና አሁንም ቅርብ የሆነ ጊዜን ያሳያል።
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: እነርሱን ተከትላችሁ አትሂዱ
  rationale: የπορεύομαιን የመሄድ እና የὀπίσωን ከኋላ የመከተል ምስል ጠብቆ፣ ከአሳቾቹ ጋር እንዳይተባበሩ የተሰጠውን ክልከላ ግልጽ ያደርጋል።
theological_decisions:
- issue: በሐሰተኛ አስመሳዮች አውድ Ἐγώ εἰμι የሚለውን መተርጎም
  choice: እኔ ነኝ
  alternative: “እርሱ እኔ ነኝ” ወይም “መሲሑ እኔ ነኝ”
  rationale: ግሪኩ “መሲሕ” የሚለውን ቃል በግልጽ አይጠቀምም። ስለዚህ ዋናው ጽሑፍ የመነሻውን አሻሚነት ይጠብቃል፤ በአውዱ የሚገኘው የሐሰት ማንነት ጥያቄ ግን በማስታወሻው ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ተጠንቀቁ” የንቃት ትእዛዙን፣ “ተከትላችሁ አትሂዱ” ደግሞ የመሄድና የመከተል ምስሉን በተፈጥሯዊ አነጋገር ይጠብቃሉ።
