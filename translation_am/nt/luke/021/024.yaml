  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: am
  text: እነርሱም በሰይፍ ስለት ይወድቃሉ፤ ወደ ሕዝቦችም ሁሉ በምርኮ ይወሰዳሉ።[a] የሕዝቦችም ዘመናት እስኪፈጸሙ ድረስ ኢየሩሳሌም በሕዝቦች ትረገጣለች።[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወደ አሕዛብም ሁሉ” ወይም “በሕዝቦችም ሁሉ መካከል” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ἔθνη “ሕዝቦች/አገሮች” ወይም “አሕዛብ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
