  choice: ይወድቃሉ
  rationale: የወደፊት ጊዜውንና በጦርነት ዐውድ የመገደልን ፈሊጣዊ ትርጉም ይጠብቃል፤ ቀጣዩ ሐረግ በምን እንደሚወድቁ ይገልጣል።
- source_word: στόματι μαχαίρης
  choice: በሰይፍ ስለት
  rationale: ቃል በቃል ‘በሰይፍ አፍ’ የሚለውን ሴማዊ/ግሪካዊ ፈሊጥ በተፈጥሯዊና ምስሉን በሚጠብቅ አማርኛ ያቀርባል።
- source_word: αἰχμαλωτισθήσονται
  choice: በምርኮ ይወሰዳሉ
  rationale: የተደራጊ ቅርጹንና እስረኞች ሆነው ከአገራቸው የመወሰዳቸውን ኃይል ያሳያል።
- source_word: εἰς τὰ ἔθνη πάντα
  choice: ወደ አሕዛብም ሁሉ
  rationale: εἰς የሚያመለክተውን እንቅስቃሴ ይጠብቃል። ἔθνη በዚህ ዐውድ ‘አሕዛብ’ ተብሎ ሲተረጎም ከእስራኤል ውጭ ያሉ ሕዝቦችንም የብዙ አገሮችን ሕዝቦችም በተፈጥሯዊ መጽሐፍ ቅዱሳዊ አማርኛ ያመለክታል።
- source_word: Ἰερουσαλήμ
  choice: ኢየሩሳሌም
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስፍራው ስም ነው።
- source_word: πατουμένη
  choice: ትረገጣለች
  rationale: ἔσται ከሚለው ጋር የሚፈጥረውን ቀጣይ የወደፊት ተደራጊ ሁኔታ እና የመገዛትን ምስል ይጠብቃል።
- source_word: ὑπὸ ἐθνῶν
  choice: በአሕዛብ
  rationale: ተደራጊውን የፈጸመውን ወገን ያመለክታል፤ በቁጥሩ ውስጥ ἔθνη ለሚለው ቃል ያለውን ድግግሞሽና ቃላዊ ትስስር ይጠብቃል።
- source_word: ἄχρι οὗ
  choice: እስኪፈጸሙ ድረስ
  rationale: የጊዜ ወሰንን በተፈጥሯዊ አማርኛ በግልጽ ያሳያል።
- source_word: πληρωθῶσιν
  choice: እስኪፈጸሙ
  rationale: የተደራጊውን ቅርጽ በአማርኛ ይጠብቃል፤ ጊዜያቱ ወደ ፍጻሜ መድረሳቸውን ይገልጣል እንጂ የተወሰነ የፍጻሜ ዘመን ሥርዓት አያስገባም።
- source_word: καιροὶ ἐθνῶν
  choice: የአሕዛብ ዘመናት
  rationale: καιροί በቀላሉ የሚቆጠር ጊዜ ብቻ ሳይሆን የተወሰኑ ወይም ወሳኝ የጊዜ ወቅቶችን ሊያመለክት ይችላል፤ ‘ዘመናት’ ይህን ስፋት ይጠብቃል።
theological_decisions:
- issue: በቁጥሩ ውስጥ ἔθνη የሚለውን ቃል መተርጎም
  choice: አሕዛብ
  alternative: ሕዝቦች / አገሮች
  rationale: አንድ የግሪክ ስም ሦስት ጊዜ በመጠቀሙ በዋናው ጽሑፍ አንድ ወጥ ትርጉም መጠቀም ቃላዊ ትስስሩን ይጠብቃል። ‘አሕዛብ’ በአማርኛ የአይሁድ ያልሆኑ ሕዝቦችን ሊያጎላ ቢችልም፣ የብዙ ሕዝቦችን ስፋትም ይይዛል፤ የ‘ሕዝቦች/አገሮች’ አማራጭ በማስታወሻ ተጠብቋል።
- issue: καιροὶ ἐθνῶν የሚለው ሐረግ ሥነ መለኮታዊ ወሰን
  choice: የአሕዛብ ዘመናት እስኪፈጸሙ
  alternative: የሕዝቦች የተወሰኑ ጊዜያት እስኪጠናቀቁ
  rationale: ሐረጉ ከአሕዛብ ጋር የተያያዘ ወሰን ያለውን ጊዜ ያመለክታል፤ ይሁን እንጂ የባለቤትነት/ግንኙነት ቅርጹ ትክክለኛውን ግንኙነት አይወስንም። ትርጉሙ ይህን አሻሚነትና የተደራጊ አገላለጹን ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በሰይፍ ስለት’ የምንጩን ምስል በተፈጥሯዊ አገላለጽ ይጠብቃል፤ ‘በምርኮ ይወሰዳሉ’ የግዳጅ መፈናቀልን ያሳያል። የግሪኩ ἔθνη አሻሚነት በ‘አሕዛብ’ እና በማስታወሻዎቹ ውስጥ ባሉ ‘ሕዝቦች/አገሮች’ አማራጮች ተጠብቋል።
