source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: am
  text: 'በፀሐይ፣ በጨረቃና በከዋክብት ምልክቶች ይታያሉ፤[a] በምድርም ላይ ሕዝቦች በግራ መጋባት ውስጥ ሆነው በባሕር ጩኸትና መናወጥ ምክንያት ይጨነቃሉ።[b]


    [a] ወይም፦ “በፀሐይና በጨረቃ በከዋክብትም ምልክቶች ይሆናሉ።”


    [b] ቃል በቃል፦ “በባሕር ድምፅና መናወጥ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በፀሐይና በጨረቃ በከዋክብትም ምልክቶች ይሆናሉ።”
    reason: የግሪኩን ἔσονται (“ይሆናሉ”) እና በሰማያዊ አካላቱ ውስጥ የሚለውን አወቃቀር የሚያሳይ አማራጭ አቀራረብ።
  - marker: b
    text: ቃል በቃል፦ “በባሕር ድምፅና መናወጥ።”
    reason: ἦχος (“ድምፅ”) እና σάλος (“መናወጥ/መታወክ”) የሚሉትን ቃላት ያለ ተጨማሪ ባለቤትነት ወይም የማዕበል ማብራሪያ ቀጥታ ያሳያል።
lexical_decisions:
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: ይህ ቃል አስደናቂ ክስተቶችን የሚያመለክተውን ሰፊ ትርጉም ይጠብቃል፤ አስፈሪ ትንቢታዊ ምልክቶች ናቸው ብሎ አስቀድሞ አይወስንም።
- source_word: ἔσονται
  choice: ይታያሉ
  rationale: ቃል በቃል ‘ይሆናሉ’ ማለት ቢቻልም፣ ከሰማያዊ አካላት ጋር ‘ምልክቶች ይታያሉ’ ማለት በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: συνοχὴ ἐθνῶν
  choice: ሕዝቦች … ይጨነቃሉ
  rationale: συνοχή የመጨነቅንና የመጠበብን ሁኔታ ያመለክታል፤ ἐθνῶν እዚህ የዓለምን ሕዝቦች እንጂ አይሁድ ያልሆኑትን ብቻ አያመለክትም። የስም ሐረጉ ለተፈጥሯዊ አማርኛ በግስ ተገልጿል።
- source_word: ἐν ἀπορίᾳ
  choice: መውጫ ጠፍቶአቸው
  rationale: ἀπορία ምን ማድረግ እንደሚገባ አለማወቅንና መፍትሔ ማጣትን ያሳያል፤ ‘መውጫ ጠፍቶአቸው’ ይህን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: በባሕሩ ጩኸትና በማዕበሉ መናወጥ
  rationale: ἦχος በመሠረቱ ‘ድምፅ’ ቢሆንም በዚህ የባሕር አውድ ‘ጩኸት’ የኃይለኛውን ድምፅ ያሳያል። σάλος የባሕርን መናወጥና መታወክ ያመለክታል፤ ‘ማዕበሉ’ ምስሉን በግልጽ ያቀርባል።
theological_decisions:
- issue: የሰማያዊ ምልክቶቹ ባሕርይ
  choice: ጥቅሱ እንደሚናገረው በሰማያዊ አካላት የሚታዩ ምልክቶች ተብለው ቀርበዋል።
  alternative: ምልክቶቹን ቃል በቃል የሚፈጸሙ የሥነ ፈለክ ክስተቶች ወይም ፖለቲካዊ ምሳሌዎች ብቻ እንደሆኑ መወሰን።
  rationale: የግሪኩ ጽሑፍ ምልክቶቹ ቃል በቃል የሚፈጸሙ፣ ምሳሌያዊ ወይም ሁለቱንም ያካተቱ መሆናቸውን አይወስንም፤ ትርጉሙም ይህን ክፍትነት ጠብቋል።
- issue: የἐν ከἤχους ጋር ያለው ግንኙነት
  choice: ‘የተነሣ’ በማለት የምክንያት ግንኙነቱ በዋናው ጽሑፍ ተገልጿል።
  alternative: ‘በባሕሩ ድምፅ…’ ብሎ የግሪኩን አወቃቀር በቀጥታ መከተል።
  rationale: በአውዱ የባሕሩ ጩኸትና መናወጥ የሕዝቦቹ ጭንቀትና ግራ መጋባት ምክንያት መሆኑ ተፈጥሯዊ ነው፤ ቀጥተኛው አወቃቀር ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘መውጫ ጠፍቶአቸው’ የἀπορίαን ስሜት ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል፤ የምጽአት ምስሎቹን ግን በተወሰነ የትርጓሜ ሥርዓት አይገድብም።
