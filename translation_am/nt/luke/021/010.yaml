  rationale: ቁጥሩ ራሱ የግጭትን እውነታ ይናገራል እንጂ ሰፊውን የፍጻሜ ዘመን ክርክር አይወስንም፤ ትርጉሙም ይህን ክፍትነት ጠብቋል።
