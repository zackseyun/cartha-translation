  rationale: βασιλεία እዚህ ረቂቅ ንግሥናን ሳይሆን ፖለቲካዊ ግዛትን ያመለክታል፤ ተደጋጋሚው አወቃቀር ከመጀመሪያው ሐረግ ጋር ትይዩነቱን ጠብቋል።
