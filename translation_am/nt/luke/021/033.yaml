lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ሰማይና ምድር
  rationale: በዚህ ጥምር ውስጥ ሰማይና ምድር መላውን የተፈጠረ ዓለም ያመለክታሉ፤ በዘመናዊ አማርኛም የተለመደና ግልጽ አገላለጽ ነው።
- source_word: παρελεύσονται
  choice: ያልፋሉ / አያልፉም
  rationale: ግሱ እዚህ ላይ ማለፍን ወይም ወደ ፍጻሜ መድረስን ያመለክታል። በሁለቱም ሐረጎች ተመሳሳዩን ግስ መጠቀም የግሪኩን ንጽጽርና ድግግሞሽ ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: በሚያልፉት ሰማይና ምድር እና በማያልፉት የኢየሱስ ቃሎች መካከል ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ λόγοι μου
  choice: ቃሎቼ
  rationale: የኢየሱስን የተነገሩ ቃሎች በቀጥታ፣ በአጭሩና በተከበረ አገላለጽ ያስተላልፋል።
- source_word: οὐ μὴ
  choice: ፈጽሞ አያልፉም
  rationale: οὐ μή ከወደፊት ግስ ጋር የሚሰጠውን አጽንዖታዊ እምቢታ፣ ተፈጥሯዊና ጠንካራ በሆነ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የኢየሱስ ቃሎች አለማለፋቸውን የሚገልጠው አጽንዖት
  choice: “ፈጽሞ አያልፉም” በማለት ፍጹም እምቢታውን ማስተላለፍ
  alternative: “አያልፉም” ወይም “በእርግጥ አያልፉም”
  rationale: ግሪኩ οὐ μή ከቀላል አሉታ የበለጠ አጽንዖት አለው። “ፈጽሞ” ይህን ኃይል ያለ ተጨማሪ የአንድ ወገን ትርጓሜ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። “ሰማይና ምድር” የሚለው የታወቀውን አጽናፈ ዓለማዊ ጥምር ይጠብቃል፤ የπαρελεύσονται ድግግሞሽም “ያልፋሉ / አያልፉም” በሚለው ተመጣጣኝ አገላለጽ ተጠብቋል።
