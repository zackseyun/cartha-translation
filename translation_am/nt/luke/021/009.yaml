reference: Luke 21:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: am
  text: ነገር ግን ስለ ጦርነቶችና ሁከቶች[a] በምትሰሙ ጊዜ አትደናገጡ፤ እነዚህ ነገሮች በፊት መሆን አለባቸውና፤ ፍጻሜው ግን ወዲያውኑ አይደርስም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ረብሻዎች»፣ «ዓመፆች» ወይም «ሥርዓት አልበኝነቶች»።
    reason: lexical_alternative
  - marker: b
    text: በቃል፣ «ፍጻሜው ግን ወዲያውኑ አይደለም»።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ነገር ግን ... በምትሰሙበት ጊዜ
  rationale: ὅταν ወደፊት የሚከሰትን ጊዜ ያመለክታል፤ δέ ደግሞ ከቀደመው ንግግር ጋር መጠነኛ ንጽጽር ስለሚያሳይ «ነገር ግን» ተብሏል።
- source_word: ἀκούσητε
  choice: ስለ ... በምትሰሙበት ጊዜ
  rationale: የጦርነትና የሁከት ወሬ መስማትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πολέμους
  choice: ጦርነቶች
  rationale: የታጠቁ ግጭቶችን የሚያመለክተውን የግሪክ ብዙ ቁጥር በቀጥታ ይተረጉማል።
- source_word: ἀκαταστασίας
  choice: ሁከቶች
  rationale: ቃሉ የማኅበራዊ ወይም የፖለቲካ መረበሽን፣ ዓመፅንና ሥርዓት አልበኝነትን በሰፊው ሊያመለክት ስለሚችል «ሁከቶች» ተመርጧል።
- source_word: μὴ πτοηθῆτε
  choice: አትደናገጡ
  rationale: በድንገት በፍርሃት መረበሽን ወይም መሸበርን በተፈጥሯዊና ጠንካራ አገላለጽ ያስተላልፋል።
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: እነዚህ ነገሮች አስቀድመው መሆን አለባቸውና
  rationale: δεῖ የግድ መሆንን፣ γάρ ምክንያታዊ ማብራሪያን፣ πρῶτον ደግሞ የቅደም ተከተልን ያሳያሉ።
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: ፍጻሜው ግን ወዲያውኑ አይደርስም
  rationale: ግሪኩ ግስ ባይገልጽም፣ በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን «አይደርስም» ተጨምሯል፤ εὐθέως «ወዲያውኑ» ተብሏል።
theological_decisions:
- issue: የፍጻሜው ጊዜና የሁከቶቹ ግንኙነት
  choice: ጦርነቶችና ሁከቶች አስቀድመው መሆን አለባቸው፤ ፍጻሜው ግን ወዲያውኑ አይደርስም
  alternative: እነዚህ ነገሮች ከፍጻሜው በፊት ያሉ ምልክቶች ናቸው እንጂ ፍጻሜው ራሱ አይደሉም
  rationale: ጥቅሱ የሁከት ወሬዎችን ከፍጻሜው ፈጣን መድረስ ጋር እንዳያመሳስሉ ያስጠነቅቃል፤ የተወሰነ የፍጻሜ ዘመን ሥርዓት ሳይጫን የጽሑፉን የጊዜ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ፍጻሜው» የጽሑፉን ክብደት ይጠብቃል፤ «አትደናገጡ» የπτοέωን የፍርሃት ኃይል በተፈጥሯዊ አገላለጽ ያቀርባል።
