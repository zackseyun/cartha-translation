    reason: lexical_alternative
  revision_rationale: 'The revision removes the awkward doubled speech-introduction while retaining every semantic component required by the Greek: the parable, its recipients, the command to attend, the fig tree, and all the trees. The footnote anchor and lexical alternative remain valid.'
