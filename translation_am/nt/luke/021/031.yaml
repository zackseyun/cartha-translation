review_pass:
  verdict: revise
  source_fidelity: The draft preserves the comparison, the future-contingent observation of the specified events, the imperative to recognize their significance, and the unexpanded phrase “the kingdom of God.” “ሲፈጸሙ” is acceptable in this eschatological context, though it can carry a slightly stronger ‘be fulfilled’ nuance than γινόμενα.
  naturalness: The predicate-complement construction “ቅርብ እንደሆነች ዕወቁ” is grammatically possible but less natural and less direct in modern standard Amharic. “ቅርብ መሆኑን ዕወቁ” is idiomatic and clearly expresses ‘know that ... is near.’
  terminology: “የእግዚአብሔር መንግሥት” is the established, natural biblical term and appropriately retains the Greek phrase’s range without doctrinal expansion. “ዕወቁ” maintains the imperative in a dignified but understandable register.
