  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: am
  text: እንደዚሁም እናንተ፣ እነዚህ ነገሮች ሲፈጸሙ[a] ስታዩ፣ የእግዚአብሔር መንግሥት[b] ቅርብ መሆኑን ዕወቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሲከናወኑ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የእግዚአብሔር ንጉሣዊ አገዛዝ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንደዚሁም እናንተ
  rationale: የቀደመውን ምሳሌ ወደ ደቀ መዛሙርቱ የሚያዛምደውን አመልካች ኃይል ይጠብቃል፤ ግልጽ የሆነውን ὑμεῖςም ‘እናንተ’ በማለት ያሳያል።
- source_word: ὅταν ἴδητε
  choice: ስታዩ
  rationale: ወደፊት የሚፈጸም ሁኔታን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ταῦτα γινόμενα
  choice: እነዚህ ነገሮች ሲፈጸሙ
  rationale: ταῦτα ወደ ቀደሙት ምልክቶች የሚያመለክተውን ይጠብቃል፤ γινόμεναንም ክስተቶቹ በመከሰት ላይ እንዳሉ በግልጽ ያቀርባል።
- source_word: γινώσκετε
  choice: ዕወቁ
  rationale: የግሪኩን ቀጥተኛ ትእዛዝ ይጠብቃል፤ ምልክቶቹን ትርጉም እንዲረዱ የሚሰጠውን ጥሪ ያሳያል።
- source_word: ἐγγύς ἐστιν
  choice: ቅርብ እንደሆነች
  rationale: የመቅረብን ጊዜያዊና ምሳሌያዊ ሐሳብ ያለ ተጨማሪ የግስ ገጽታ ይጠብቃል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደ፣ ተፈጥሯዊና ክቡር አገላለጽ ነው፤ የግዛት ስፍራንና የንጉሣዊ አገዛዝን ሁለቱንም ፍንጭ ሳያጠብ ይይዛል።
theological_decisions:
- issue: ‘የእግዚአብሔር መንግሥት’ በፍጻሜያዊው አውድ ያለው ትርጉም
  choice: የእግዚአብሔር መንግሥት
  alternative: የእግዚአብሔር ንጉሣዊ አገዛዝ
  rationale: ጽሑፉ መንግሥቱ ከተጠቀሱት ምልክቶች ጋር ተያይዞ ቅርብ መሆኑን ይናገራል፤ ነገር ግን ይህ በዋናነት መገለጡን፣ ፍጻሜውን ወይም ፍርዳዊ ማረጋገጡን እንደሚያመለክት አይወስንም። ስለዚህ የጽሑፉ ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘እናንተ’ የግሪኩን ግልጽ ተውላጠ ስም አጽንዖት ይጠብቃል፤ ‘ዕወቁ’ ደግሞ ቀጥተኛውን ትእዛዝ በክቡር የመጽሐፍ ቅዱስ አገላለጽ ያቀርባል።
