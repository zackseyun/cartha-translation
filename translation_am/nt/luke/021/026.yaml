base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: am
  text: ሰዎች በፍርሃትና በሰው በሚኖርበት ዓለም[a] ላይ የሚመጡትን ነገሮች በመጠበቅ ምክንያት ራሳቸውን ይስታሉ፤ የሰማያት ኃይላት[b] ይናወጣሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዓለም» ወይም «ምድር»፤ በግሪክኛ፣ «በሰው የሚኖርበት ዓለም»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ሰማያዊ ኃይላት» ወይም «የሰማይ ኃይላት»። ሐረጉ የጠፈርን ወይም የሰማይን ኃይላት በሰፊው ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: ራሳቸውን ይስታሉ
  rationale: ቃሉ በከባድ ፍርሃት የተነሣ ኃይልን ማጣትን ወይም መውደቅን ያመለክታል። «ራሳቸውን ይስታሉ» አካላዊና ስሜታዊ ድካሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀνθρώπων
  choice: ሰዎች
  rationale: የግሪኩ ቃል ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: ἀπὸ φόβου
  choice: በፍርሃት
  rationale: ἀπό እዚህ ምንጭን ወይም ምክንያትን ያሳያል፤ «በፍርሃት» ይህን በአጭርና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: προσδοκίας
  choice: በመጠባበቅ
  rationale: ቃሉ የሚመጣውን ነገር መጠበቅን ያመለክታል። አስፈሪነቱ ከአውዱ ስለሚገኝ «በጭንቀት» የሚል ተጨማሪ ትርጉም አልገባም።
- source_word: τῶν ἐπερχομένων
  choice: የሚመጡትን ነገሮች
  rationale: ገላጭ አሳታፊው በነገር ስምነት የተጠቀሰ ሲሆን ብዙ የሚመጡ ክስተቶችን ያመለክታል።
- source_word: τῇ οἰκουμένῃ
  choice: በሰው የሚኖርበት ዓለም ላይ
  rationale: οἰκουμένη በቀጥታ ሰዎች የሚኖሩበትን ዓለም ያመለክታል። ይህ ምርጫ ከ«ምድር» ይልቅ የሰው ማኅበረሰብ ያለበትን ዓለም የሚያጎላውን ልዩነት ይጠብቃል።
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: የሰማያት ኃይላት
  rationale: ይህ ቅርብ ትርጉም ሐረጉ የሰማይ አካላትን፣ የጠፈር ኃይላትን ወይም ሰማያዊ ኃይላትን ሊያመለክት የሚችለውን ድርብ አንድምታ አይወስንም።
- source_word: σαλευθήσονται
  choice: ይናወጣሉ
  rationale: የወደፊት ጊዜ ተገብሮ መናወጥን ይገልጣል፤ አማርኛው የጠፈር መታወክን ምስል በግልጽ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: በራእያዊ አውድ «የሰማያት ኃይላት» የሚለው ሐረግ ምን እንደሚያመለክት
  choice: ድርብ አንድምታውን የሚጠብቀው «የሰማያት ኃይላት»
  alternative: «የሰማይ አካላት» ወይም «ሰማያዊ መንፈሳዊ ኃይላት»
  rationale: የግሪኩ ሐረግ የጠፈርን ሥርዓት፣ የሰማይ አካላትን ወይም ሰማያዊ ኃይላትን ሊያስታውስ ይችላል። ትርጉሙ ጽሑፉ ከሚፈቅደው በላይ አንዱን ብቻ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አወቃቀር በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል፤ ነገር ግን በ«የሰማያት ኃይላት» ያለው ሥነ መለኮታዊና ራእያዊ ድርብ አንድምታ ተጠብቋል።
