  text: ከዚያም ቀና ብሎ፣ ሀብታሞች ስጦታዎቻቸውን[a] ወደ ግምጃ ቤት[b] ሲያስገቡ አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “መባዎቻቸውን።”
    reason: lexical_alternative
  - marker: b
    text: “ግምጃ ቤት” ተብሎ የተተረጎመው የግሪክ ቃል የቤተ መቅደሱን ግምጃ ቤት ክፍል ወይም መባ የሚጨመርባቸውን መቀበያዎች ሊያመለክት ይችላል።
