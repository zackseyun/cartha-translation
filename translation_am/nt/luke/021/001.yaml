lexical_decisions:
- source_word: Ἀναβλέψας
  choice: ቀና ብሎ ሲመለከት
  rationale: የዓይንን እይታ ወደ ላይ ማንሳትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ የግሪኩን ቦዝ አንቀጽ ከዋናው ግስ ጋር ያያይዛል።
- source_word: δὲ
  choice: ከዚያም
  rationale: በዚህ ትረካዊ አውድ ያለውን ቀላል የቀጣይነት ግንኙነት ያሳያል፤ የተጋነነ ንፅፅር አይጨምርም።
- source_word: εἶδεν
  choice: አየ
  rationale: ተራውን የማየት ትርጉም በቀጥታ ያስተላልፋል፤ ‘አስተዋለ’ የሚል ተጨማሪ የትኩረት ሐሳብ አያስገባም።
- source_word: τοὺς βάλλοντας
  choice: ሲያስገቡ
  rationale: ቃሉ በቀጥታ ‘መጣል’ ሊል ቢችልም፣ ስጦታን ወደ ግምጃ ቤት በማስገባት አውድ ‘ሲያስገቡ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: በቤተ መቅደሱ ግምጃ ቤት ውስጥ
  rationale: ‘ግምጃ ቤት’ የገንዘብና የስጦታ ማስቀመጫ ስፍራን ይገልጻል። ‘ቤተ መቅደሱ’ ከቅርብ አውዱ የተገኘ ግልጽ ማብራሪያ ሲሆን፣ ቃሉ ስፍራውን ወይም የስጦታ መቀበያዎቹን ሊያመለክት የሚችለው ልዩነት በማስታወሻ ተጠብቋል።
- source_word: τὰ δῶρα αὐτῶν
  choice: ስጦታዎቻቸውን
  rationale: የδῶραን መሠረታዊ የ‘ስጦታዎች’ ትርጉም ይጠብቃል፤ በአውዱ ‘መባዎቻቸውን’ ማለትም ይቻላል።
- source_word: πλουσίους
  choice: ሀብታሞች
  rationale: በግሪክ ስም ሆኖ የሚሠራውን ቅጽል በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
