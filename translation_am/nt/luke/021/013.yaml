  text: This will turn out for you as a testimony[a].
translation:
  language: am
  text: ይህም ለእናንተ ምስክርነት ይሆናል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህም ምስክርነት ለመስጠት ዕድል ይሆንላችኋል።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: ይሆናል
  rationale: የወደፊት ውጤትን ወይም መድረሻን የሚገልጠውን የግሱን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቀደም ብሎ የተጠቀሰው ስደት ምን ውጤት እንደሚኖረው ያመለክታል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: ድርጊቱ ከደቀ መዛሙርቱ አንጻር የሚኖረውን ውጤት በግልጽ ያሳያል።
- source_word: εἰς
  choice: ምስክርነት ይሆናል
  rationale: εἰς እዚህ የውጤትን ወይም የዓላማን ግንኙነት ያመለክታል፤ ይህም በአማርኛ በ«ይሆናል» ግንባታ ተፈጥሯዊ ሆኖ ይገለጣል።
- source_word: μαρτύριον
  choice: ምስክርነት
  rationale: ቃሉ ምስክርነትን፣ የምስክርነትን ይዘት ወይም ማስረጃን ሊያመለክት ይችላል፤ «ምስክርነት» የፍርድ እና የሕዝብ ፊት ንግግር ገጽታውን ሳያጠብ ያቆያል።
theological_decisions:
- issue: በባለሥልጣናት ፊት የሚደርስባቸው ስደት ትርጉም
  choice: ኢየሱስ አስቀድሞ የተናገረው ሁኔታ ለደቀ መዛሙርቱ ምስክርነት የሚሆን ውጤት ይኖረዋል።
  alternative: ሁኔታዎቹ በተቃዋሚዎቻቸው ላይ ማስረጃ ይሆናሉ።
  rationale: የሉቃስ ዐውድ ደቀ መዛሙርቱ ተይዘው በነገሥታትና በገዥዎች ፊት መቅረባቸውን ስለሚናገር፣ μαρτύριον በተፈጥሮ እነርሱ ስለ ኢየሱስ የሚሰጡትን ምስክርነት ያመለክታል። ዋናው ጽሑፍ ግን ይህ የወንጌል ስብከት ዕድል ነው ወይስ የፍርድ ማስረጃ ነው ብሎ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ምስክርነት» የሚለው ቃል የመመስከርንም ሆነ የማስረጃን ፍቺ ክፍት ያደርጋል።
