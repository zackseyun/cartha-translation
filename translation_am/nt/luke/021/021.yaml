source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: am
  text: በዚያን ጊዜ በይሁዳ ያሉት ወደ ተራሮች ይሽሹ፤ በመካከሏ[a] ያሉትም ይውጡ፤ በገጠርም ያሉት ወደ እርሷ አይግቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመካከሏ” እና “ወደ እርሷ” የሚሉት አንስታይ ተውላጠ ስሞች ኢየሩሳሌምን ያመለክታሉ፤ በግሪክ ከተማይቱ በአንስታይ ተውላጠ ስም ቀርባለች።
    reason: የተውላጠ ስሞቹን ማጣቀሻና በምንጩ ያለውን አንስታይ ሰውኛ አቀራረብ ለማብራራት።
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የቀደመውን ንግግር ተከትሎ የሚመጣውን ጊዜና ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: በይሁዳ ያሉት
  rationale: በይሁዳ ክልል የሚገኙትን ሰዎች በግልጽና በተፈጥሯዊ አገላለጽ ያመለክታል።
- source_word: φευγέτωσαν
  choice: ይሽሹ
  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዝንና የሁኔታውን አስቸኳይነት ይጠብቃል።
- source_word: εἰς τὰ ὄρη
  choice: ወደ ተራሮች
  rationale: የመድረሻውን አቅጣጫ እና የὄρηን መደበኛ ትርጉም በቀጥታ ያስተላልፋል።
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: በመካከሏ ያሉት
  rationale: የግሪኩን አንስታይ ተውላጠ ስም እና ከተማይቱን እንደ ሴት የማቅረብ ምስላዊ አገላለጽ ይጠብቃል፤ ቀዳሚው አውድ ኢየሩሳሌምን ያመለክታል።
- source_word: ἐκχωρείτωσαν
  choice: ይውጡ
  rationale: ከቦታው የመውጣትንና የመልቀቅን እንቅስቃሴ በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οἱ ἐν ταῖς χώραις
  choice: በገጠር ያሉት
  rationale: ከከተማዋ ውጭ ባሉ የገጠር ስፍራዎች የሚገኙትን ሰዎች ያመለክታል፤ ቃሉን በግድ ወደ ‘እርሻዎች’ አያጠብበውም።
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: ወደ እርሷ አይግቡ
  rationale: አሉታዊውን ትእዛዝ፣ ወደ ውስጥ የመግባትን አቅጣጫ፣ እና አንስታይ ተውላጠ ስሙን ይጠብቃል።
theological_decisions:
- issue: የαὐτῆς / αὐτήν ማጣቀሻና አንስታይ አገላለጽ
  choice: በዋናው ጽሑፍ ‘በመካከሏ’ እና ‘ወደ እርሷ’ በማለት አንስታይ ተውላጠ ስሙን ማቆየት
  alternative: ለግልጽነት ‘በኢየሩሳሌም ውስጥ’ እና ‘ወደ ኢየሩሳሌም’ ብሎ በግልጽ ስም መተካት
  rationale: ቀዳሚው አውድ ማጣቀሻው ኢየሩሳሌም መሆኑን በጠንካራ ሁኔታ ያሳያል፤ ሆኖም ግሪኩ በዚህ ቁጥር ስሟን አይደግምም። አንስታይ ተውላጠ ስሙን ማቆየት የምንጩን አገላለጽና የከተማይቱን ሰውኛ አቀራረብ ይጠብቃል፤ የግርጌ ማስታወሻውም ማጣቀሻውን ያብራራል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱ ትእዛዞች በትይዩ አወቃቀር ቀርበዋል፤ ሰሚኮሎኖቹም የንግግሩን ፍጥነትና ክፍፍል ያሳያሉ።
