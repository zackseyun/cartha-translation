theological_decisions:
- issue: የኢየሩሳሌም መጪ ፍርድ ምንነት
  choice: ἐρήμωσιςን ‘ውድመቷ’ ብሎ መተርጎም፣ ነገር ግን ጥቅሱ ከሚናገረው በላይ የተወሰነ የፍጻሜ ዘመን ሥርዓት አለመጨመር
  alternative: ‘ጥፋቷ’ ወይም ‘ባድማ መሆኗ’ ብሎ መተርጎም፤ ወይም በዋናው ጽሑፍ ከ‘የጥፋት ርኵሰት’ ጋር በግልጽ ማያያዝ
  rationale: ጥቅሱ ራሱ ሰራዊቶች ኢየሩሳሌምን ሲከቡ ውድመቷ መቅረቡን ይናገራል። ‘ውድመቷ’ የቃሉን ክብደት ይጠብቃል፤ ነገር ግን ጥቅሱ ያልገለጸውን ዝርዝር ትርጓሜ አያስገባም።
