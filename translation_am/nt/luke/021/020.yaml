  text: ነገር ግን ኢየሩሳሌም በሠራዊቶች[a] ተከብባ ስታዩ፣ ያን ጊዜ ውድመቷ[b] ቀርቦ እንዳለ እወቁ።
  philosophy: optimal-equivalence
  footnotes:
