- source_word: ὑπὸ στρατοπέδων
  choice: በሰራዊቶች
  rationale: στρατόπεδον የጦር ሰፈርን ወይም በሰፈር የተቀመጠ ሰራዊትን ሊያመለክት ይችላል። በዚህ የከበባ አውድ ‘ሰራዊቶች’ ዋናውን ትርጉም በግልጽ ያስተላልፋል፤ ሌላው የቃሉ ገጽታ በማስታወሻ ተጠብቋል።
- source_word: τότε γνῶτε
  choice: ያን ጊዜ … እወቁ
