lexical_decisions:
- source_word: ὅτι
  choice: ናቸውና
  rationale: ቀደም ሲል ለተሰጠው ማስጠንቀቂያ ምክንያትና ማብራሪያ እንደሚሰጥ ያሳያል።
- source_word: ἡμέραι ἐκδικήσεως
