- source_word: αὗταί εἰσιν
  choice: እነዚህ ... ናቸው
  rationale: አመልካቹንና አያያዡን በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῦ πλησθῆναι
  choice: እንዲፈጸም ነው
  rationale: የτοῦ ከኢንፊኒቲቭ ጋር ያለውን የዓላማ/ውጤት ኃይል ሁለቱንም ሳይለይ ያስተላልፋል።
- source_word: πάντα τὰ γεγραμμένα
  choice: የተጻፈው ሁሉ
  rationale: ፍጹም ተገብሮ አሳቢውን እንደ ስም የሚሠራውን አወቃቀር በተፈጥሯዊ አማርኛ ይገልጣል፤ ማጣቀሻውንም ‘ቅዱሳት መጻሕፍት’ ብሎ አያጥብም።
theological_decisions:
- issue: የἐκδικήσεως ባሕርይ
  choice: የበቀል
