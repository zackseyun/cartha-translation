  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: am
  text: ምክንያቱም የተጻፈው ሁሉ እንዲፈጸም እነዚህ የበቀል ቀኖች ናቸው።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የበቀል” የሚለው ቃል “የብድራት መመለሻ” ወይም “የቅጣት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “የተጻፈው ሁሉ እንዲፈጸም” የሚለው ሐረግ ዓላማን ወይም ውጤትን ሊያመለክት ይችላል፤ “የተጻፈው ሁሉ እንዲፈጸም ሲል” ተብሎም ሊገለጽ ይችላል።
