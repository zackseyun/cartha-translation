  alternative: የተጻፈው ሁሉ ይፈጸም ዘንድ
  rationale: ግንባታው ዓላማን ወይም ውጤትን ሊያመለክት የሚችለውን አሻሚነት ሳይዘጋ በዘመናዊ አማርኛ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። ‘ቀኖች’ የሚለው መደበኛ የመጽሐፍ ቅዱስ አገላለጽ ተጠብቋል፤ ‘በቀል’ የፍርድን ጥንካሬ ለመጠበቅ ተመርጧል።
