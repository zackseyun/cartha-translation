base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: am
  text: ቀን ቀን በቤተ መቅደሱ[a] ያስተምር ነበር፤ ሌሊት ሌሊት ግን ወጥቶ በተባለው የወይራ ተራራ ላይ ያድር ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ቤተ መቅደስ» የሚለው የውስጠኛውን መቅደስ ብቻ ሳይሆን የቤተ መቅደሱን ግቢና ሕንፃዎች በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ሌሊቱን ያሳልፍ ነበር»፤ የግሪኩ ግስ ከቤት ውጭ ማደርንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: ያስተምር ነበር
  rationale: የεἰμί ኢምፐርፌክት ከየአሁን ጊዜ አሳታፊው διδάσκων ጋር በመሆኑ ቀጣይና የተደጋገመ ልማዳዊ ድርጊትን ያሳያል፤ የአማርኛውም አገላለጽ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τὰς ἡμέρας
  choice: በቀን ጊዜ
  rationale: የጊዜ አኩዛቲቭ ሲሆን ከሌሊቱ ጋር ያለውን ንጽጽር በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን መላውን የቤተ መቅደስ ግቢ ሊያመለክት ይችላል፤ የተለመደው አማርኛ ቃል በዋናው ጽሑፍ ተጠብቆ ወሰኑ በማስታወሻ ተገልጿል።
- source_word: τὰς δὲ νύκτας
  choice: በሌሊት ግን
  rationale: δέ የቀንና የሌሊት ልማድን የሚያነጻጽር ሲሆን፣ «ግን» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐξερχόμενος
  choice: ወጥቶ
  rationale: አሳታፊው ከዋናው ግስ ጋር ተያይዞ የሚደጋገም ቀዳሚ እርምጃን ያሳያል፤ «ወጥቶ» አጭርና ተፈጥሯዊ ነው።
- source_word: ηὐλίζετο
  choice: ያድር ነበር
  rationale: ግሱ ሌሊትን ማሳለፍ ወይም ማደርን፣ አንዳንዴም ከቤት ውጭ ማደርን ሊያመለክት ይችላል፤ «ያድር ነበር» መንገዱን ሳይወስን ልማዳዊነቱን ይጠብቃል።
- source_word: εἰς τὸ ὄρος
  choice: በ... ተራራ
  rationale: εἰς መድረሻን ቢያሳይም ከማደር ግስ ጋር ውጤቱ በቦታው መቆየት ነው፤ በአማርኛ «በተራራው ያድር» ተፈጥሯዊ ነው።
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: የወይራ ተራራ ተብሎ በሚጠራው
  rationale: Ἐλαιῶν የወይራ ፍሬዎችን ወይም ዛፎችን የሚያመለክት ጄኒቲቭ ነው፤ በአማርኛ የተለመደውና ግልጽ የቦታ ስም «የወይራ ተራራ» ነው።
