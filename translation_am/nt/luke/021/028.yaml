    text: “ቤዛነት” የሚለው “ነፃ መውጣት” ወይም “መዳን” ተብሎም ሊተረጎም ይችላል፤ በዚህ አውድ የኢየሱስ ሕዝብ የመጨረሻ ነፃ መውጣት መቅረቡን ያመለክታል።
    reason: lexical_alternative
