  text: ነገር ግን እነዚህ ነገሮች መከሰት ሲጀምሩ[a]፣ ቀና በሉ፤ ራሶቻችሁንም ከፍ አድርጉ[b]፤ ምክንያቱም ቤዛነታችሁ[c] እየቀረበ ነው።
  philosophy: optimal-equivalence
  footnotes:
