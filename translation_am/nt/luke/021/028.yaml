- source_word: ἀνακύψατε
  choice: ቀና በሉ
  rationale: ከጎንበስ ወይም ከመደፋት ቀና ማለትን በተፈጥሯዊ አማርኛ ይገልጣል፤ የመበርታትንም ምስላዊ ፍቺ አያጠፋም።
