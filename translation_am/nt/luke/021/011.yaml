  source_fidelity: 'The draft accurately conveys the sequence and scope of the Greek: great earthquakes, geographically distributed famines and epidemic outbreaks, undefined fear-inspiring events, and great signs from heaven. However, በየስፍራው normally suggests ‘in every place,’ whereas κατὰ τόπους means ‘in various/different places.’'
