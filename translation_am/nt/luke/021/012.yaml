- source_word: παραδιδόντες
  choice: አሳልፈው ይሰጧችኋል
  rationale: የፍርድና የጠላትነት ገጽታውን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: ወደ ምኩራቦችና ወደ ወኅኒ ቤቶች
