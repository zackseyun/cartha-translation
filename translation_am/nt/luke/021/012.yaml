base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: am
  text: ነገር ግን ከእነዚህ ሁሉ በፊት እጃቸውን ይጭኑባችኋል[a]፤ ያሳድዷችኋልም። ወደ ምኩራቦችና ወደ ወኅኒ ቤቶች አሳልፈው ይሰጧችኋል፤ ስለ ስሜ[b] በነገሥታትና በገዥዎች ፊት ይወስዷችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይይዟችኋል።” የግሪኩ ቃል በቃል “እጃቸውን ይጭኑባችኋል” ይላል፤ ይህም በጠላትነት መያዝን ወይም ጉዳት ማድረስን የሚያመለክት ፈሊጣዊ አነጋገር ነው።
    reason: lexical_alternative
  - marker: b
    text: “ስለ ስሜ” የሚለው “ለስሜ ሲባል” ወይም በትርጓሜ “ስለ እኔ” ተብሎም ሊቀርብ ይችላል። ዋናው ጽሑፍ የኢየሱስን ስም ከማንነቱና ከሥልጣኑ ጋር የሚያያዘውን መጽሐፍ ቅዱሳዊ አገላለጽ ጠብቋል።
    reason: alternative_reading
