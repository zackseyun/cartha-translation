  rationale: πρό ከግስ ባለቤት መስተዋድድ ጋር የጊዜ ቀዳሚነትን ያሳያል፤ πάντων ደግሞ ‘ሁሉ’ የሚለውን ሙሉ ሐሳብ ይደግፋል። δέ የንግግሩን ሽግግርና ንፅፅር ለማሳየት ‘ነገር ግን’ ተብሏል።
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
