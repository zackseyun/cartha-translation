  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: am
  text: እናንተ የምትመለከቷቸውን እነዚህን ነገሮች፤ ድንጋይ በድንጋይ ላይ እንደቀረ የማይፈርስ አንድም ድንጋይ የማይኖርባቸው ቀኖች ይመጣሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: እናንተ የምትመለከቷቸው እነዚህ ነገሮች
  rationale: የΤαῦταን አጽንዖት በ“እነዚህ ነገሮች” ያቆያል፤ θεωρεῖτε የማየትንና በትኩረት የመመልከትን ሐሳብ ስለሚይዝ “የምትመለከቷቸው” ተመርጧል።
- source_word: ἐλεύσονται ἡμέραι
  choice: ቀኖች ይመጣሉ
  rationale: የግሪኩን የወደፊት ጊዜ አገላለጽና ያልተወሰነውን ἡμέραι በቀጥታና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν αἷς
  choice: የማይቀርባቸው
  rationale: “በእነዚያ ቀኖች” የሚለውን ጊዜያዊ ዝምድና በአማርኛ የዝምድና ግስ ቅርጽ ተፈጥሯዊ አድርጎ ይገልጣል።
- source_word: οὐκ ἀφεθήσεται
  choice: የማይቀር
  rationale: በዚህ የሕንፃ መፍረስ አውድ ἀφίημι በተገብሮ “መቅረት” የሚለውን ፍቺ ይዟል።
- source_word: λίθος ἐπὶ λίθῳ
  choice: ድንጋይ በሌላው ድንጋይ ላይ
  rationale: የግሪኩን “ድንጋይ በድንጋይ ላይ” ምስል ይጠብቃል፤ “በሌላው” የሚለው በአማርኛ ዝምድናውን ግልጽ ያደርጋል።
- source_word: ὃς οὐ καταλυθήσεται
  choice: የማይፈርስ
  rationale: καταλύω በዚህ አውድ ሕንፃን ማፍረስ ወይም መፍረስን ያመለክታል፤ የተገብሮው ኃይል በአማርኛ ተፈጥሯዊ በሆነው “የማይፈርስ” ተገልጿል።
theological_decisions:
- issue: ትንቢቱ ስለ መቅደሱ ሕንፃዎች ያለው ወሰንና ኃይል
  choice: ቃሉን በዓይን የሚታዩት ሕንፃዎች ፈጽመው እንደሚፈርሱ የሚናገር ተጨባጭ ትንቢት አድርጎ መተርጎም።
  alternative: እንደ ምሳሌያዊ የፍርድ ንግግር ብቻ መተርጎም፣ ወይም ከአንድ የተወሰነ የፍጻሜ ዘመን ሥርዓት ጋር ማስተሳሰር።
  rationale: ግሪኩ የሚታዩ ሕንፃዎች ድንጋይ በድንጋይ ላይ እስከማይቀር ድረስ ስለሚፈርሱ በቀጥታ ይናገራል፤ ትርጉሙ ይህን ተጨባጭ ኃይል ያቆያል እንጂ ጥቅሱ ያልገለጸውን የእምነት ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የድንጋይ-በድንጋይ ምስልና የተሟላ ውድመት አጽንዖት ተጠብቋል።
