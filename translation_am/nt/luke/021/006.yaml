  verdict: revise
  source_fidelity: 'The draft correctly identifies the visible objects, the coming days, and the intended total destruction, but its central relative construction is ungrammatical and reverses the required relationship: the Greek says that no stone will remain upon another unless it is demolished.'
  naturalness: The wording “የማይፈርስ አንድም ድንጋይ በሌላው ድንጋይ ላይ የማይቀርባቸው” is not natural modern Amharic. A construction with “የማይኖርባቸው” clearly and idiomatically expresses the temporal relative clause.
  terminology: “መመልከት,” “ድንጋይ,” and “መፍረስ” are suitable modern standard Amharic choices. “እንደቀረ” preserves the sense of a stone being left/remain, while “የማይፈርስ” conveys the demolition outcome without doctrinal expansion.
  issues:
  - severity: high
    issue: The main clause's relative syntax is malformed and obscures the logical scope of the two Greek negatives.
    rationale: 'The draft makes “days” the object of “የማይቀር” and does not clearly state that no stone remaining on another will escape demolition. The revised sentence restores the sense: days will come in which there will be no stone left on another that will not be torn down.'
  - severity: medium
    issue: The footnote marked b omits the qualifying relative clause and does not accurately reflect the literal Greek formulation.
    rationale: The revised note includes both “will be left” and “will not be torn down,” preserving the source's emphatic totality.
