  rationale: ቃሉ ለእግዚአብሔር ተለይተው የተሰጡና በቤተ መቅደስ የቀረቡ ስጦታዎችን ያመለክታል፤ ይህ አገላለጽ ከመደበኛ መባ ወይም መሥዋዕት ጋር እንዳይምታታ ፍቺውን ግልጽ ያደርጋል።
- source_word: κεκόσμηται
