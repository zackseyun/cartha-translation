  rationale: የፍጹም ተደራጊ ግሱ ቀድሞ የተፈጸመና ውጤቱ በዚያን ጊዜ የታየ ማስዋብን ያሳያል፤ ‘እንደተዋበ’ ይህን የውጤት ሁኔታ ይጠብቃል።
- source_word: εἶπεν
