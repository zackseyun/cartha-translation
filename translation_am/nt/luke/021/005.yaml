    text: እዚህ ‘ቤተ መቅደስ’ የሚለው የውስጠኛውን መቅደስ ብቻ ሳይሆን ግቢውንና ሌሎች የቤተ መቅደሱን ክፍሎች በአጠቃላይ ያመለክታል።
