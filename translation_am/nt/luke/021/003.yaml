  edition: SBLGNT
  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: am
  text: እርሱም፣ “እውነት እላችኋለሁ፤ ይህች ድሃ መበለት ከሁሉም የበለጠ አስገባች[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ “ከሁሉም የበለጠ ጣለች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: እውነት
  rationale: ኢየሱስ በአጽንዖት የሚናገረውን የተረጋገጠ ንግግር በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን አድራሻና የንግግሩን ሥልጣናዊ ክብደት በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: χήρα
  choice: መበለት
  rationale: ባሏ የሞተባትን ሴት የሚያመለክተው መደበኛና ትክክለኛ ቃል ነው።
- source_word: πτωχή
  choice: ድሀ
  rationale: ድህነትን በግልጽ ያመለክታል፤ ‘በጣም የተቸገረች’ ማለት በዋናው ጽሑፍ የድህነቷን ደረጃ ከምንጩ በላይ ሊወስን ይችላል።
- source_word: αὕτη
  choice: ይህች
  rationale: በእይታ ውስጥ ያለችውን የተወሰነች መበለት የሚያመለክተውን የግሪኩን ጠቋሚ ኃይል ይጠብቃል።
- source_word: πλεῖον
  choice: የበለጠ
  rationale: የስጦታውን መጠን የሚያወዳድረውን አጭርና ተፈጥሯዊ አገላለጽ ይሰጣል።
- source_word: πάντων
  choice: ከሁሉም
  rationale: ከሌሎቹ ስጦታ አስገቢዎች ሁሉ ጋር የሚደረገውን ንጽጽር በግልጽ ያስተላልፋል።
- source_word: ἔβαλεν
  choice: አስገባች
  rationale: በቤተ መቅደሱ የስጦታ ሳጥን ውስጥ ገንዘብ ማስገባትን በግልጽና በተፈጥሯዊ አማርኛ ያሳያል፤ የግሱን ይበልጥ ቀጥተኛ ምስላዊ አማራጭ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: ስለ መበለቲቱ ስጦታ የተነገረው ንጽጽር
  choice: “ከሁሉም የበለጠ አስገባች” ተብሎ በዐውዱ ውስጥ የመጠን ንጽጽር ሆኖ ተተርጉሟል።
  alternative: “ከማንኛቸውም የበለጠ አስገባች” ወይም “ከሁሉ የበለጠ ጣለች።”
  rationale: πλεῖον πάντων በተፈጥሮ ከሌሎቹ ለጋሾች ሁሉ ጋር ንጽጽርን ያመለክታል። ይህ አተረጓጎም ኢየሱስ የሰጠውን ግምገማ ይጠብቃል፤ በቀጣዩ ቁጥር ከመገለጡ በፊት ንጽጽሩ በገቢ መጠን ወይም በመሥዋዕትነት ድርሻ ላይ እንደተመሠረተ በግልጽ አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “እውነት እላችኋለሁ” የንግግሩን አጽንዖት ሳያስቀር ተፈጥሯዊ ሆኖ ቀርቧል።
