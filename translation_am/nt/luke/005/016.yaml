  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: am
  text: እርሱ ግን በገለልተኛ ስፍራዎች ራሱን ያገልልና ይጸልይ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እርሱ ራሱ በገለልተኛ ስፍራዎች ራሱን ያገልልና ይጸልይ ነበር።» የግሪኩ አነጋገር ያለፈ ጊዜ ቀጣይ ግስን ከአሁን ጊዜ አሳታፊ ግሶች ጋር በማጣመር ቀጣይ ወይም ልማዳዊ ድርጊትን ይገልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: እርሱ
  rationale: በግሪክ ግልጽ ተውላጠ ስም ሆኖ ቀላል አጽንዖት አለው፤ «እርሱ» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ትረካ ጋር ያለውን ቀላል ንፅፅር ወይም የሐሳብ ሽግግር ያሳያል።
- source_word: ἦν ὑποχωρῶν
  choice: ፈቀቅ እያለ ... ነበር
  rationale: የነበረውን ቀጣይ ወይም ልማዳዊ ድርጊት የሚገልጠውን የግሪክ ኢምፐርፌክት ከአሁን ጊዜ አሳታፊ ግስ ጋር የተሠራውን ቅርጽ ያንጸባርቃል።
- source_word: ἐν ταῖς ἐρήμοις
  choice: ወደ ምድረ በዳ ስፍራዎች
  rationale: ብዙ ቁጥሩ ሰው የማይኖርባቸውን ወይም ገለልተኛ ስፍራዎች ያመለክታል፤ ከ«ፈቀቅ ማለት» ጋር «ወደ» በአማርኛ ተፈጥሯዊ የእንቅስቃሴ አቅጣጫን ይገልጣል።
- source_word: καὶ προσευχόμενος
  choice: ይጸልይ ነበር
  rationale: ከመገለሉ ጋር ተያይዞ በተደጋጋሚ የሚፈጸመውን የጸሎት ተግባር በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የኢየሱስ ድርጊት ገጽታ
  choice: ጥቅሱ ኢየሱስ ለጸሎት ፈቀቅ የማለት ተደጋጋሚ ልማድ እንደነበረው ይገልጣል።
  alternative: ጥቅሱ አንድን የተወሰነ የመገለልና የጸሎት አጋጣሚ ብቻ ይተርካል።
  rationale: ἦν ከአሁን ጊዜ አሳታፊ ግሶች ጋር ያለው ኢምፐርፌክት አወቃቀር ቀጣይነትን ወይም ልማዳዊ ድግግሞሽን በተፈጥሮ ያሳያል፤ ተጨማሪ የእምነት ሥርዓታዊ ድምዳሜ አልተጫነበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ምድረ በዳ ስፍራዎች» የብዙ ቁጥሩንና የገለልተኛ ቦታዎችን ሐሳብ ይጠብቃል።
