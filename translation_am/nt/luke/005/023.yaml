base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: am
  text: “ከሁለቱ የትኛው ይቀላል፤ ‘ኃጢአቶችህ ተሰርየውልሃል’[a] ማለት ወይስ ‘ተነሥተህ ተራመድ’ ማለት?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአቶችህ ይቅር ተብለውልሃል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: ከሁለቱ የትኛው ይቀላል
  rationale: ንጽጽሩን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ ‘ከሁለቱ’ የሚለው በቀጣይ የተጠቀሱትን ሁለት አማራጮች ግልጽ ያደርጋል።
- source_word: εἰπεῖν
  choice: ማለት
  rationale: ሁለቱን ቀጥተኛ ንግግሮች የሚያስገባ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: Ἀφέωνταί σοι αἱ ἁμαρτίαι σου
  choice: ኃጢአቶችህ ይቅር ተብለውልሃል
  rationale: የἀφίημιን የኃጢአት ይቅርታ ትርጉም፣ የብዙ ቁጥር ርዕሰ ጉዳይንና ለተናጋሪው ተቀባይ የሆነውን σοι ያስተላልፋል። የፍጹም ጊዜውን ከተፈጸመ ድርጊት የተነሣ አሁን ያለ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἢ
  choice: ወይስ
  rationale: በጥያቄ ውስጥ ሁለት አማራጮችን ለማነጻጸር ‘ወይስ’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: Ἔγειρε καὶ περιπάτει
  choice: ተነሥተህ ሂድ
  rationale: በአማርኛ ሁለቱን ተከታታይ ትእዛዛት በተፈጥሯዊ መንገድ ያቀርባል፤ ‘ሂድ’ እዚህ ያለውን ቃል በቃል የመራመድ ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: የፍጹም ጊዜና የተደራጊ ቅርጽ ያለውን የይቅርታ አዋጅ ተጨማሪ ሥነ መለኮታዊ ድምዳሜ ሳይጫን መተርጎም
  choice: ኃጢአቶችህ ይቅር ተብለውልሃል
  alternative: ኃጢአቶችህ ተሰርየውልሃል
  rationale: ይህ ምርጫ ይቅርታው የተፈጸመ ሆኖ ውጤቱ አሁን እንዳለ ያሳያል፤ ተደራጊው ቅርጽ የድርጊቱን ፈጻሚ በግልጽ ስለማይጠቅስ ትርጉሙም አይጨምረውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ተነሥተህ’ በመደበኛው የግእዝ ፊደል አጻጻፍ ቀርቧል።
