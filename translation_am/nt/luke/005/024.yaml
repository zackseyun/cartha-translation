    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ትንሽ መኝታህን” ወይም “አልጋህን።” የግሪኩ κλινίδιον ትንሽ አልጋን፣ መደብን ወይም ምንጣፍን ያመለክታል።
    reason: lexical_alternative
