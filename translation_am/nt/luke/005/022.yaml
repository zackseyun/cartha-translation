review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ awareness of their inner deliberations and does not specify the means of that awareness. However, “እንዲህ” (“thus/in this way”) adds a deictic element not expressed in the Greek, and “ማሰላሰል” better represents διαλογίζεσθε as active inward deliberation than the broader “ማሰብ.”
  naturalness: The revised wording is natural, modern standard Amharic while retaining the biblical expression “በልባችሁ.”
  terminology: “ሐሳባቸውን” suitably renders their inward thoughts/deliberations, while “ታሰላስላላችሁ” preserves the active reasoning nuance of διαλογίζεσθε. The alternative footnote retains the lexical possibility of “knowing.”
  issues:
  - severity: low
    issue: The question contains “እንዲህ.”
    rationale: The Greek asks why they are reasoning in their hearts, without an explicit equivalent of “thus/in this way.” Removing it avoids adding detail.
  - severity: low
    issue: “የምታስቡት” is somewhat broader than διαλογίζεσθε.
    rationale: The verb denotes inward reasoning or deliberation. “ታሰላስላላችሁ” more closely preserves that nuance in idiomatic Amharic.
  revised_text: ኢየሱስ ግን ሐሳባቸውን ተገንዝቦ መልሶ፣ “በልባችሁ ለምን ታሰላስላላችሁ?” አላቸው።
