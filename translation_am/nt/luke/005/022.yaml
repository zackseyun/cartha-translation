    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported “thus” and uses a verb for inward deliberation that more closely reflects the present-middle sense of διαλογίζεσθε. It preserves the source’s ambiguity concerning how Jesus knew their thoughts, the narrative response formula, and the biblical heart idiom.
