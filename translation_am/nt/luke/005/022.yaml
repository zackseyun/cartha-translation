  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: am
  text: ኢየሱስ ግን ሐሳባቸውን ተገንዝቦ መልሶ፣ “በልባችሁ ለምን ታሰላስላላችሁ?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: ተገንዝቦ
  rationale: የኢየሱስን ሙሉ ግንዛቤ ያሳያል፤ ነገር ግን እንዴት እንዳወቀ በትርጉም ላይ አይጨምርም።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የውስጥ ተቃውሞ ወደ ኢየሱስ ምላሽ የሚደረገውን ቀላል ንፅፅርና ሽግግር ያሳያል።
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: አሳባቸውን
  rationale: በውስጣቸው ያወጡትንና ያወረዱትን ያመለክታል፤ “አሳባቸውን” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: መልሶ … አላቸው
  rationale: ሁለቱንም የግሪክ ግሶች በተፈጥሯዊ የአማርኛ ትረካ አቀራረብ ይጠብቃል።
- source_word: Τί
  choice: ለምንድን ነው?
  rationale: በዚህ አገባብ τί የውስጥ አስተሳሰባቸውን ምክንያት ይጠይቃል።
- source_word: διαλογίζεσθε
  choice: እንዲህ የምታስቡት
  rationale: ቀጣይ የሆነውን የውስጥ ማሰላሰል በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: በልባችሁ
  rationale: “ልብ” አሳብን፣ ፈቃድንና ውስጣዊ ሰውነትን የሚያመለክተውን መጽሐፍ ቅዱሳዊ አነጋገር ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ የሌሎችን ውስጣዊ አሳብ ያወቀበት መንገድ
  choice: ኢየሱስ አሳባቸውን እንደተገነዘበ ብቻ በቀጥታ መግለጽ
  alternative: “በመለኮታዊ ኃይል አውቆ” ወይም “ገምቶ” ብሎ መተርጎም
  rationale: ጥቅሱ ኢየሱስ ውስጣዊ አሳባቸውን እንዳወቀ ይናገራል፤ ያወቀበትን መንገድ ግን አይገልጽም። ስለዚህ ትርጉሙ ከምንጩ በላይ አያሰፋውም፣ አያሳንሰውምም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “በልባችሁ” የሚለው መጽሐፍ ቅዱሳዊ ምስል እንዳለ ተጠብቋል።
