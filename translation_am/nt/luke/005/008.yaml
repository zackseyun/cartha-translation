    text: ወይም፣ “ከእኔ ራቅ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል በተለይ ወንድን የሚያመለክት “ሰው” ይላል፤ እዚህም ስምዖን ጴጥሮስ ራሱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ይህን ባየ ጊዜ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ጊዜን በሚገልጽ ተፈጥሯዊ የአማርኛ አገላለጽ ተተርጉሟል። “ይህን” በጽሑፉ በግልጽ ያልተጠቀሰውን፣ ከአውዱ የሚታወቀውን አስደናቂ የዓሣ ማጥመድ ክስተት ያመለክታል።
- source_word: δὲ
  choice: ግን
  rationale: የትረካውን ሽግግርና መጠነኛ ንፅፅር ይጠብቃል።
- source_word: Σίμων Πέτρος
  choice: ስምዖን ጴጥሮስ
  rationale: በግሪኩ ያሉት ሁለቱም ስሞች ተጠብቀዋል።
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: በኢየሱስ ጉልበቶች ፊት ወድቆ
  rationale: ወደ ኢየሱስ ጉልበቶች ፊት የመውደቁን አካላዊ አቀማመጥና የትሕትና ምላሽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγων
  choice: አለ
  rationale: በአማርኛ ትረካ ቀጥተኛ ንግግርን ለማስገባት ተፈጥሯዊ የሆነ ግስ ተመርጧል።
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: ከእኔ ራቅ
  rationale: አስቸኳይ የመለየት ጥያቄውን በግልጽና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: ነኝና
  rationale: የጴጥሮስን ጥያቄ ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ ቅጥያ ይገልጻል።
- source_word: ἀνὴρ ἁμαρτωλός
  choice: ኃጢአተኛ ሰው
  rationale: የግሪኩን ስምና ገላጭ ቅጽ በቅርብ ይከተላል፤ ንግግሩም ስለ ስምዖን ጴጥሮስ ራሱ ነው።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: አክብሮትንና የኢየሱስን ሥልጣን መገንዘብ የሚችለውን የቃሉን ስፋት ይጠብቃል።
theological_decisions:
- issue: ስምዖን ጴጥሮስ ኢየሱስን κύριε ብሎ መጥራቱ
