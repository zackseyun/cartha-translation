  text: ስምዖን ጴጥሮስ ግን ይህን ባየ ጊዜ፣ በኢየሱስ ጉልበቶች ፊት ወድቆ፣ “እኔ ኃጢአተኛ ሰው[b] ነኝና ከእኔ ሂድ[a]፣ ጌታ ሆይ!” አለ።
  philosophy: optimal-equivalence
  footnotes:
