review_pass:
  verdict: revise
  source_fidelity: 'The draft retains all principal Greek elements: Simon Peter, the contextual object supplied for the participle, his falling at Jesus’s knees, the request for separation, the causal confession, the masculine noun ἀνήρ, and the address κύριε. However, «ከእኔ ራቅ» primarily means “move/be far from me” and is less precise for ἔξελθε ἀπ’ ἐμοῦ, an imperative to go/depart from someone.'
  naturalness: The narrative is clear and suitably formal-modern. Replacing «ራቅ» with «ከእኔ ሂድ» gives the direct request a more natural and source-near Amharic form. «በኢየሱስ ጉልበቶች ፊት ወድቆ» is acceptable and vividly conveys the posture.
  terminology: «ጌታ ሆይ» appropriately renders κύριε while preserving its respectful and potentially weightier sense without overdefining it. «ኃጢአተኛ ሰው» preserves the masculine singular expression, and the explanatory footnote properly clarifies its referent.
  issues:
  - severity: medium
    issue: The imperative «ራቅ» is not the closest rendering of Ἔξελθε ἀπ’ ἐμοῦ.
    rationale: ἔξελθε means “go out/depart,” not merely “be far away.” «ከእኔ ሂድ» directly expresses Simon Peter’s request that Jesus leave him.
