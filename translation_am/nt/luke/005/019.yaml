  naturalness: The Amharic is generally clear and modern, but the revised wording more naturally expresses finding an access way and retains the Greek sequence in one sentence.
  terminology: ኢየሱስ, ጣራ, ሸክላዎች, and ምንጣፍ are suitable. ምንጣፍ remains an acceptable contextual rendering of κλινίδιον, with alternatives retained in the note.
  issues:
  - severity: medium
    issue: “በሰዎቹ መካከል” adds a referent absent from εἰς τὸ μέσον.
    rationale: The Greek says “into the middle,” without specifying “of the people.” The addition narrows the spatial expression unnecessarily.
  - severity: medium
    issue: 'The draft adds a second action: “አወረዱት፤ ... አኖሩት።”'
    rationale: καθῆκαν governs the movement “into the middle before Jesus”; it does not state a subsequent, distinct act of placing him.
