  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: am
  text: እርሱም ከከተሞቹ በአንዲቱ ሳለ፣ እነሆ፣ በለምጽ የተሸፈነ[a] አንድ ሰው ነበር። ሰውየውም ኢየሱስን ባየ ጊዜ ፊቱን ወደ መሬት አድርጎ ወደቀና፣ “ጌታ ሆይ፣ ብትፈቅድ ልታነጻኝ[b] ትችላለህ” ብሎ ለመነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል “በለምጽ የተሞላ።” የግሪኩ አገላለጽ ሁኔታው እጅግ ከባድና የተስፋፋ መሆኑን ያጎላል። በጥንት ዘመን “ለምጽ” የሚለው ቃል ከዘመናዊው የሕክምና ፍቺ የሰፋ የቆዳ ሕመም ሊያመለክት ይችል ነበር።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ንጹሕ ልታደርገኝ።” ግሱ አካላዊ ፈውስን ብቻ ሳይሆን ሥርዓታዊ ንጽሕናንና ወደ ማኅበረሰብ መመለስንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: እርሱም … ሳለ
  rationale: የሉቃስን የትረካ መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ἐγένετο የሚለውን ቀመር ቃል በቃል በማድረግ አያከብደውም።
- source_word: μιᾷ τῶν πόλεων
  choice: ከከተሞቹ በአንዲቱ
  rationale: πόλις ትልቅ ከተማን ብቻ ሳያመለክት ከተማ ወይም ከተማ መሰል ሰፈርን ሊያመለክት ይችላል፤ ይህ አገላለጽ የምንጩን አጠቃላይነት ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ድንገተኛነትና ትኩረት ሰጪ ኃይል ይጠብቃል።
- source_word: πλήρης λέπρας
  choice: በለምጽ የተሸፈነ
  rationale: πλήρης የሕመሙን ከባድነትና ስፋት ያጎላል። ቃል በቃል ‘በለምጽ የተሞላ’ ማለት በአማርኛ እንግዳ ስለሚሆን፣ ተፈጥሯዊው አቻ ተመርጦ ቃል በቃል ቅርጹ በማስታወሻ ተገልጧል።
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ፊቱን ወደ መሬት አድርጎ ወደቀ
  rationale: የትሕትናና የአስቸኳይ ልመና አካላዊ አቀማመጥን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐδεήθη αὐτοῦ
  choice: ለመነው
  rationale: የጥያቄውን ጽኑ ልመና በተፈጥሯዊና ክብር ባለው ቃል ያቀርባል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: አክብሮታዊ አድራሻውንና ሊኖረው የሚችለውን ክርስቶሎጂያዊ ድምፀት ይጠብቃል፤ ዐውደ ንባቡ ብቻውን ከሚፈቅደው በላይ አይወስንም።
- source_word: ἐὰν θέλῃς
  choice: ብትወድ
  rationale: የፈቃድን ሁኔታ በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δύνασαί με καθαρίσαι
  choice: ልታነጻኝ ትችላለህ
  rationale: δύναμαι የችሎታን ትርጉም በግልጽ ያስተላልፋል፤ καθαρίζω ደግሞ ከአካላዊ ፈውስ በተጨማሪ የሥርዓትና የማኅበራዊ መመለስ ድምፀትን እንዲጠብቅ ‘ማንጻት’ ተብሏል።
theological_decisions:
- issue: የλέπρα እና καθαρίζω አተረጓጎም
  choice: ‘ለምጽ’ እና ‘ልታነጻኝ’
  alternative: ‘የቆዳ በሽታ’ እና ‘ልትፈውሰኝ’
  rationale: የግሪኩ λέπρα ከዘመናዊው ሕክምናዊ የለምጽ ፍቺ የሰፋ ሊሆን ቢችልም፣ ባህላዊና የሚታወቀው ‘ለምጽ’ ተጠብቋል። καθαρίζωን ‘መፈወስ’ ብቻ ማለት የሥርዓታዊና የማኅበራዊ ንጽሕና ድምፀቱን ያጠፋል፤ ‘ማንጻት’ ግን ይህን ውጥረት ይጠብቃል።
- issue: ኢየሱስን Κύριε ብሎ መጥራት
  choice: ‘ጌታ ሆይ’
  alternative: ‘መምህር ሆይ’ ወይም ‘ጌታዬ’ እንደ አክብሮት ብቻ
  rationale: ‘ጌታ’ የአክብሮት አድራሻውን እና ሊኖረው የሚችለውን ጥልቅ ሥነ መለኮታዊ ድምፀት ሳያጠፋ ይጠብቃል።
