  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘እነሆ’ የሉቃስን ትኩረት ሰጪ ትረካዊ ቅርጽ ለመጠበቅ ተይዟል፤ ሌሎች አገላለጾች ግን ቃል በቃል እንግዳነትን በማስወገድ ተፈጥሯዊ ሆነዋል።
