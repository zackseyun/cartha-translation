  rationale: የአኦሪስት አሳታፊው ተግባር ከዋናው ግስ አስቀድሞ መፈጸሙን ያሳያል፤ ‘ከእነርሱ’ የሚለው ወደ ጀልባዎቹ ይመለሳል። ‘ወርደው’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የት እንደወረዱ ያልተገለጸውን አይጨምርም።
- source_word: ἔπλυνον
  choice: ያጥቡ ነበር
  rationale: የπλύνω ኢምፐርፌክት ቅርጽ በዚያ ጊዜ እየቀጠለ የነበረ ድርጊትን ያሳያል፤ ‘ያጥቡ ነበር’ ይህን የቀጣይነት ገጽታ በተፈጥሮ ያስተላልፋል።
- source_word: τὰ δίκτυα
