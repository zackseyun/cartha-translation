  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: am
  text: ፈሪሳውያንና የእነርሱ ጸሐፍት ለደቀ መዛሙርቱ እያጉረመረሙ፣ “ከቀረጥ ሰብሳቢዎችና ከኃጢአተኞች ጋር ለምን ትበላላችሁ ትጠጣላችሁ?” ይሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: እያጉረመረሙ
  rationale: የግስ አወቃቀሩ ቀጣይ ወይም ተደጋጋሚ ቅሬታን ያመለክታል፤ ‘ማጉረምረም’ በዝቅተኛ ድምፅ የሚገለጽን ቅሬታ ይጠብቃል።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: ታሪካዊውን የቡድን መጠሪያ በቀጥታ የሚያስተላልፍ የተለመደ የመጽሐፍ ቅዱስ ቃል ነው።
- source_word: αὐτῶν
  choice: የእነርሱ
  rationale: ተውላጠ ስሙን ከፈሪሳውያን ጋር በማያያዝ ‘የእነርሱ ጸሐፍት’ የሚለውን የግሪኩን አወቃቀር ይጠብቃል።
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: በደቀ መዛሙርቱ ላይ
  rationale: πρός እዚህ ቅሬታው ወደ ደቀ መዛሙርቱ መቅረቡን ያሳያል፤ ይህ አገላለጽ የተቃውሞ አቅጣጫውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τελωνῶν
  choice: ቀረጥ ሰብሳቢዎች
  rationale: በወንጌላት አውድ የታሪካዊውን ሥራና ማኅበራዊ መገለል በግልጽ ሁኔታ ያስተላልፋል።
- source_word: ἁμαρτωλῶν
  choice: ኃጢአተኞች
  rationale: የተናጋሪዎቹን ማኅበራዊና ሥነ ምግባራዊ ምደባ ያለ ማብራሪያ የሚጠብቅ ቀጥተኛ ትርጉም ነው።
- source_word: ἐσθίετε καὶ πίνετε
  choice: የምትበሉትና የምትጠጡት
  rationale: ሁለቱን ተጨባጭ ድርጊቶች ይጠብቃል፤ የብዙ ሰው አድራጊ ቅርጽም ጥያቄው ለደቀ መዛሙርቱ መቅረቡን ያሳያል።
theological_decisions:
- issue: ከ‘ቀረጥ ሰብሳቢዎችና ኃጢአተኞች’ ጋር የገበታ ኅብረት ማድረግ የነበረው ማኅበራዊና ሃይማኖታዊ ክብደት
  choice: ክሱን ‘መብላትና መጠጣት’ በሚለው ተጨባጭ አገላለጽ እንዳለ ማቆየት
  alternative: የሥርዓት ንጽሕና ወይም የሥነ ምግባር ጥፋት እንደሆነ በትርጓሜ ማስፋት
  rationale: ጥቅሱ ተቃውሞውን በተናጋሪዎቹ ምድቦችና በጋራ መብላትና መጠጣት ድርጊት ብቻ ያቀርባል፤ ያልተገለጸ ሥነ መለኮታዊ ማብራሪያ ሳይጨመር ውጥረቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጸሐፍት’ የሚለው ታሪካዊ መጠሪያ ተጠብቋል፤ የቅሬታው ቀጣይነት በ‘እያጉረመረሙ’ ተገልጿል።
