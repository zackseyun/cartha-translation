theological_decisions:
- issue: የኢየሱስ ትእዛዝ እንደ ደቀ መዝሙርነት ጥሪ ያለው ኃይል
  choice: “ተከተለኝ” ተብሎ ቀጥተኛ ጥሪ ሆኖ ተተርጉሟል።
