  text: ከእነዚህ በኋላ ወጣ፤ ሌዊ የሚባል አንድ ቀረጥ ሰብሳቢ በቀረጥ መሰብሰቢያው[b] ተቀምጦ አየው[a]። እንዲህም አለው፤ “ተከተለኝ።”
  philosophy: optimal-equivalence
  footnotes:
