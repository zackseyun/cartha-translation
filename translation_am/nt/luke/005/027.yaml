    text: ወይም “በትኩረት ተመለከተው” ወይም “ልብ አለው”፤ የግሪኩ ግስ በጨረፍታ ከማየት የበለጠ ትኩረትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “በመንገድ ክፍያ መሰብሰቢያው” ወይም “በጉምሩክ ጣቢያው”።
    reason: lexical_alternative
lexical_decisions:
