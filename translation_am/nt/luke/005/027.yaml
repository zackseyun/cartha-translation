translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ዐረፍተ ነገር ትኩረት ሳይጠፋ የአማርኛ ተፈጥሯዊ አገባብ ተከትሏል። በቀረበው የእንግሊዝኛ ንባብ የእግር ማስታወሻ ምልክቶቹ ከማስታወሻዎቹ ይዘት ጋር ተቀያይረው ስለነበር፣ [a] ከ“አየው” እና [b] ከ“ቀረጥ መሰብሰቢያው” ጋር በምንጩ መሠረት ተያይዘዋል።
