  rationale: በዐውዱ ውስጥ ተፈጥሯዊው አማርኛ ይህ ነው፤ የግሪኩ ግስ በትኩረት ማየትን ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠቅሷል።
