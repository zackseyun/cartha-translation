  rationale: በጀልባ አውድ ከዳርቻ ወደ ውኃው ማራቅን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀπὸ τῆς γῆς
