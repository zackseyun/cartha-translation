  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: am
  text: እምነታቸውንም[a] አይቶ፣ “ሰው ሆይ[b]፣ ኃጢአቶችህ ተሰርየውልሃል[c]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መታመናቸውን”፤ ግሪክኛው “እምነት” ይላል።
    reason: lexical_alternative
  - marker: b
    text: በቃል በቃል፣ “አንተ ሰው”።
    reason: literal_rendering
  - marker: c
    text: ወይም፣ “ኃጢአቶችህ ይቅር ተብለውልሃል።” የግሪክኛው ፍጹም ተደራጊ ቅርጽ ቀድሞ ከተፈጸመ ድርጊት የተነሣ አሁን ያለውን ሁኔታ ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: አይቶ
  rationale: የግሪክኛውን አሳቢ ግስ በተፈጥሯዊ የአማርኛ አገባብ ይወክላል፤ ድርጊቶቹንም ከሚገባው በላይ በጊዜ አይለያይም።
- source_word: πίστιν
  choice: እምነታቸውን
  rationale: እዚህ በድርጊታቸው የታየውን እምነት ወይም መታመን ያመለክታል፤ ‘እምነት’ መደበኛውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል።
- source_word: αὐτῶν
  choice: -አቸው
  rationale: የብዙ ቁጥር አመልካቹን ይጠብቃል፤ ሽባውን ብቻ ወይም የተሸከሙትን ብቻ እንደሚያመለክት አይወስንም።
- source_word: Ἄνθρωπε
  choice: አንተ ሰው
  rationale: ቀጥተኛውን የወንድ ሰው አድራሻ ይጠብቃል፤ ‘ወዳጄ’ የሚለውን በግሪክኛው በግልጽ ያልተገለጸ ስሜት አያክልም።
- source_word: ἀφέωνταί
  choice: ተሰርየውልሃል
  rationale: የተፈጸመ የይቅርታ ድርጊትና ከእርሱ የተነሣውን አሁናዊ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል፤ ተጠቃሚውንም ‘-ልሃል’ በማለት ይወክላል።
- source_word: ἁμαρτίαι σου
  choice: ኃጢአቶችህ
  rationale: የግሪክኛውን ብዙ ቁጥርና የባለቤትነት አመልካች በግልጽ ይጠብቃል።
theological_decisions:
- issue: ‘እምነታቸው’ የሚያመለክተው ወገን
  choice: የብዙ ቁጥር አመልካቹ በዋናው ጽሑፍ ተጠብቋል።
  alternative: የተሸካሚዎቹ እምነት ብቻ ወይም የሽባውና የባልንጀሮቹ የጋራ እምነት።
  rationale: ግሪክኛው ብዙ ቁጥርን ይጠቀማል፤ ትርጉሙ ግን ማንን እንደሚያካትት ከጽሑፉ በላይ አይወስንም።
- issue: የይቅርታው አዋጅ ጊዜያዊና ሥነ መለኮታዊ ኃይል
  choice: ይቅርታውን እንደተፈጸመና ውጤቱ አሁን እንዳለ የሚገልጽ አረፍተ ነገር።
  alternative: በዚያው ቅጽበት ይቅርታን የሚፈጽም አዋጅ፣ ወይም ቀድሞ የተሰጠን ይቅርታ የሚያሳውቅ አዋጅ።
  rationale: የግሪክኛው ፍጹም ተደራጊ ቅርጽ የይቅርታውን እውነታ ይገልጻል፤ ትክክለኛውን ጊዜያዊ አሠራር ግን በግልጽ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አንተ ሰው’ በዘመናዊ ንግግር ብዙም የተለመደ ባይሆንም የግሪክኛውን ቀጥተኛ አድራሻ ሳያለዝብ ወይም ተጨማሪ ወዳጅነት ሳያስገባ ይጠብቃል።
