  choice: መልሶ … አለ
  rationale: የግሪኩን ተሳቢ አገላለጽ በተፈጥሯዊ የአማርኛ የቀጥታ ንግግር መግቢያ ያቀርባል።
- source_word: Ἐπιστάτα
  choice: መምህር ሆይ
  rationale: በሉቃስ ይህ የአድራሻ ቃል ለኢየሱስ ሥልጣን እውቅና ይሰጣል፤ ከκύριος ጋር ሳይቀላቀል ‘መምህር’ በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው አቻ ነው።
- source_word: δι’ ὅλης νυκτός
  choice: ሌሊቱን ሙሉ
  rationale: ድርጊቱ ሌሊቱን በሙሉ መቆየቱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: κοπιάσαντες
  choice: ደክመን
  rationale: ቃሉ ድካም ያለበትን ከባድ ጥረት ያመለክታል፤ ‘ደክመን’ ቀላልና ተፈጥሯዊ ሲሆን ‘ለፍተን’ በማስታወሻ ቀርቧል።
- source_word: οὐδὲν ἐλάβομεν
  choice: ምንም አልያዝንም
  rationale: በዓሣ ማጥመድ አውድ λαμβάνω መያዝን ያመለክታል፤ የግሪኩን ግልጽ አሉታዊ አገላለጽ ይጠብቃል።
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: ነገር ግን በቃልህ
  rationale: ‘ነገር ግን’ ቀላል ንጽጽሩን ያሳያል፤ ‘በቃልህ’ ድርጊቱ በኢየሱስ ቃል ላይ የተመሠረተ ወይም በዚያ ምክንያት መሆኑን ሳይገድብ ያቀርባል።
- source_word: χαλάσω
  choice: አወርዳለሁ
  rationale: መረቦቹን ወደ ውኃው ዝቅ ማድረግን በትክክልና በተፈጥሯዊነት ይገልጻል።
- source_word: τὰ δίκτυα
  choice: መረቦቹን
  rationale: የምንጩን ብዙ ቁጥርና በአውዱ የታወቁ መረቦች መሆናቸውን ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ የአድራሻ ማዕረግ Ἐπιστάτα
  choice: መምህር ሆይ
