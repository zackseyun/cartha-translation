base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: am
  text: 'ስምዖንም መልሶ፣ “መምህር ሆይ፣ ሌሊቱን ሙሉ ለፍተን[a] ምንም አልያዝንም፤ ነገር ግን በቃልህ[b] መረቦቹን አወርዳለሁ” አለ።


    [a] ወይም፣ “ደክመን”። የግሪኩ ቃል ከባድ ጥረትን ያመለክታል።


    [b] ወይም፣ “በቃልህ ላይ ተመሥርቼ” ወይም “በቃልህ ምክንያት”።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ደክመን”። የግሪኩ ቃል ከባድ ጥረትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በቃልህ ላይ ተመሥርቼ” ወይም “በቃልህ ምክንያት”።
    reason: lexical_alternative
