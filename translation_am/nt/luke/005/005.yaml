  rationale: ምንጩ ἐπιστάτης እንጂ κύριος አይደለም። ‘መምህር ሆይ’ የኢየሱስን የታወቀ ሥልጣን ያስተላልፋል፣ ነገር ግን ምንጩ ያልጠቀሰውን ሙሉ የ‘ጌታ’ ሥነ መለኮታዊ ክብደት አያስገባም።
- issue: ἐπὶ τῷ ῥήματί σου የሚገልጸው መሠረት ወይም ምክንያት
  choice: በቃልህ
  alternative: በቃልህ ላይ ተመሥርቼ፤ በቃልህ ምክንያት
  rationale: አጭሩ አገላለጽ ስምዖን ለኢየሱስ ቃል ያሳየውን ታዛዥነት ይጠብቃል፤ የግንባታውን ሊሆኑ የሚችሉ የመሠረትና የምክንያት ጥላዎችም በማስታወሻ ያሳያል።
