    text: በቀጥታ፣ “አሮጌ ቆዳዎች።” የግሪኩ ቃል የወይን ጠጅን ጨምሮ ፈሳሽ ለመያዝ የሚያገለግሉ ከቆዳ የተሠሩ ዕቃዎችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
