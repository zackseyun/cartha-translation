  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: am
  text: አዲስ የወይን ጠጅን በአሮጌ የቆዳ ከረጢቶች[a] ውስጥ የሚያኖር ማንም የለም፤ አለበለዚያ አዲሱ የወይን ጠጅ ከረጢቶቹን ይቀድዳቸዋል፤ ጠጁም ይፈስሳል[b]፣ ከረጢቶቹም ይወድማሉ።
  philosophy: optimal-equivalence
  footnotes:
