review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the proverb’s negation, the contrast between new wine and old skin containers, and the ensuing loss of both wine and containers. However, ያፈነዳቸዋል primarily suggests making the containers explode, whereas ῥήξει denotes tearing or bursting them open. ይቀድዳቸዋል conveys the rupture more precisely.
  naturalness: The wording is generally clear modern standard Amharic. ይቀድዳቸዋል is natural in this context, and ይወድማሉ more directly expresses the loss/destruction of the containers than the milder ይበላሻሉ. The passive sense of ἐκχυθήσεται is well represented by ይፈስሳል.
  terminology: የቆዳ ከረጢቶች is a clear, suitably descriptive rendering of ἀσκοί. አዲስ የወይን ጠጅ is appropriate. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: ያፈነዳቸዋል can imply causing an explosion.
    rationale: The Greek verb ῥήξει describes the new wine rupturing or tearing open the old skins, not an explosive event. ይቀድዳቸዋል better preserves the image.
  - severity: low
    issue: ይበላሻሉ is somewhat weaker than ἀπολοῦνται.
    rationale: The Greek states that the skins are lost/destroyed; ይወድማሉ communicates that consequence more fully while remaining idiomatic for containers.
