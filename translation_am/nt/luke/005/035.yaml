id: LUK.5.35
reference: Luke 5:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: am
  text: ነገር ግን ቀኖች ይመጣሉ፤ ሙሽራውም ከእነርሱ በሚወሰድበት[a] ጊዜ፣ ያን ጊዜ በእነዚያ ቀኖች ይጾማሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነርሱ በሚነጠቅበት።” የግሪኩ ግስ ሙሽራው በራሱ ፈቃድ ብቻ እንደሚሄድ ሳይሆን እንደሚወሰድ ይጠቁማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: ቀኖች ይመጣሉ
  rationale: የግሪኩን ፈሊጣዊ አገላለጽና የወደፊት ጊዜ አመልካችነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የአሁኑ ሁኔታ ጋር ያለውን መጠነኛ ንፅፅር ያሳያል።
- source_word: ὅταν
  choice: በሚወሰድበት ጊዜ
  rationale: ከአኦሪስት ሰብጃንክቲቭ ጋር የተገለጸውን የወደፊት ጊዜ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπαρθῇ
  choice: በሚወሰድበት
  rationale: ድርጊቱ በሙሽራው ላይ እንደሚፈጸም የሚያሳየውን ተደራጊ ቅርጽ ይጠብቃል፤ እርሱ በፈቃዱ ብቻ እንደሚሄድ አያስመስልም።
- source_word: ἀπ’ αὐτῶν
  choice: ከእነርሱ
  rationale: ሙሽራው ከአብረውት ካሉት እንደሚለይ ያሳያል።
- source_word: ὁ νυμφίος
  choice: ሙሽራው
  rationale: በዘመናዊ አማርኛ የሠርግ ምሳሌውን በግልጽና በተለመደ ቃል ያስተላልፋል።
- source_word: τότε
  choice: ያን ጊዜ
  rationale: የሙሽራውን መወሰድ ተከትሎ የሚሆነውን ጊዜያዊ ውጤት ያጎላል።
- source_word: νηστεύσουσιν
  choice: ይጾማሉ
  rationale: ቃሉ ተራ ምግብ መተውን ሳይሆን ሃይማኖታዊ ጾምን ያመለክታል።
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: በእነዚያ ቀኖች
  rationale: በግሪኩ ያለውን የቀኖች ድግግሞሽና አጽንዖት ሳያለሰልስ ይጠብቃል።
theological_decisions:
- issue: የሙሽራው መለየት በፈቃዱ እንደሚሄድ ወይስ እንደሚወሰድ መተርጎም
  choice: ሙሽራው ከእነርሱ በሚወሰድበት
  alternative: ሙሽራው ከእነርሱ በሚሄድበት
  rationale: ἀπαρθῇ ተደራጊ ቅርጽ ስለሆነ ሙሽራው የሚወሰድ መሆኑን ይጠቁማል። ይህን ማቆየት የጽሑፉን አስጨናቂ ፍንጭ ይጠብቃል፤ ነገር ግን ፍንጩን በትርጓሜ አይፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ሙሽራውም” የሚለው ቅጥያ የግሪኩን καὶ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሥርዓተ ነጥቡም የዓረፍተ ነገሩን ሁለት የጊዜ ደረጃዎች በግልጽ ይለያል።
