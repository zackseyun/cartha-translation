review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal lexical categories, but its initial word order leaves the negated purpose ('not to call the righteous') syntactically elliptical in Amharic. Making the purpose phrase explicit preserves the scope of οὐκ over ἐλήλυθα καλέσαι more clearly.
  naturalness: The proposed revision is fluent modern standard Amharic with a formal biblical register. It avoids an initially compressed contrast that may momentarily read as contrasting people rather than the purpose of Jesus' coming.
  terminology: ጻድቃን, ኃጢአተኞች, and ንስሓ are established, appropriate terms. ወደ ንስሓ naturally conveys the goal expressed by εἰς μετάνοιαν. The alternate ለንስሓ is retained in the footnote.
  issues:
  - severity: low
    issue: The negated infinitival purpose is elliptical in the draft.
    rationale: In 'ጻድቃንን ሳይሆን ... ልጠራ መጥቻለሁ,' the reader must supply 'ልጠራ' with the first object. Repeating the purposive phrase makes clear that Jesus did not come for the purpose of calling the righteous, while retaining the source's unqualified contrast.
  - severity: low
    issue: The footnote anchor is placed at the sentence end rather than immediately after the translated εἰς μετάνοιαν phrase.
    rationale: Moving the anchor to ንስሓ directly identifies the phrase to which the lexical alternative pertains.
  revised_text: ጻድቃንን ልጠራ ሳይሆን፣ ኃጢአተኞችን ወደ ንስሓ[a] ልጠራ መጥቻለሁ።
  revised_footnotes:
