    reason: lexical_alternative
  revision_rationale: The revision explicitly attaches ልጠራ to both sides of the 'not ... but' contrast, clarifying the Greek purposive construction without adding an interpretation about who the righteous are. It also relocates the footnote marker to its corresponding phrase.
