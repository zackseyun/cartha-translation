  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: am
  text: ጻድቃንን ልጠራ ሳይሆን፣ ኃጢአተኞችን ወደ ንስሓ[a] ልጠራ መጥቻለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለንስሓ።” የግሪኩ εἰς μετάνοιαν ሐረግ ዓላማን ወይም ግብን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: መጥቻለሁ
  rationale: የግሱን ፍጹም ጊዜና ከመምጣቱ የተነሣውን አሁናዊ የተልእኮ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καλέσαι
  choice: ልጠራ
  rationale: ከመጣሁ ጋር የተያያዘውን ዓላማ ያሳያል፤ ‘መጥራት’ የግሪኩን ክፍት ትርጉም ከግብዣ ወይም ከትእዛዝ ወደ አንዱ ሳያጠብ ይጠብቃል።
- source_word: δικαίους
  choice: ጻድቃንን
  rationale: በስም ተግባር የዋለውን ብዙ ቁጥር ቅጽ በአጭርና በተለመደ አገላለጽ ይተረጉማል፤ በእውነት ጻድቃን ወይስ እንደ ጻድቃን የሚቆጠሩ መሆናቸውን አይወስንም።
- source_word: ἁμαρτωλοὺς
  choice: ኃጢአተኞችን
  rationale: የሞራልና የማኅበራዊ ምድብነቱን በግልጽና በተለመደ የአማርኛ ቃል ይገልጻል።
- source_word: εἰς μετάνοιαν
  choice: ወደ ንስሓ
  rationale: εἰς የሚያመለክተውን ግብ ወይም ዓላማ ከስማዊው μετάνοια ቅርጽ ጋር ይጠብቃል፤ ‘ንስሓ’ በዘመናዊ መደበኛ አማርኛ የልብና የአቅጣጫ ለውጥን የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
theological_decisions:
- issue: ኢየሱስ በእውነት ጻድቃን መኖራቸውን ይክዳል ወይስ ማኅበራዊ አመለካከትን ይገልጻል?
  choice: ‘ጻድቃን’ እና ‘ኃጢአተኞች’ የሚሉትን ምድቦች ያለ ተጨማሪ ትርጓሜ ማቆየት
  alternative: ‘ራሳቸውን ጻድቃን የሚያደርጉ’ ወይም ‘ጻድቃን ተብለው የሚቆጠሩ’
  rationale: ጥቅሱ ራሱ ተቃርኖውን ያለ ግልጽ የምፀት ምልክት ያቀርባል። ማብራሪያ መጨመር ከሰፊው ዐውድ የተወሰደ ትርጓሜን ወደ ጽሑፉ ያስገባል፤ ቀጥተኛው ትርጉም ግን የሥነ መለኮት ውጥረቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ንስሓ’ ባሕላዊ መጽሐፍ ቅዱሳዊ ክብደቱን ሳያጣ በዘመናዊ አጠቃቀም የሚገባ ነው።
