language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: am
  text: እጁንም ዘርግቶ ዳሰሰውና፣ “ፈቃደኛ ነኝ፤ ንጹሕ ሁን” አለው። ወዲያውም ለምጹ[a] ለቀቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በሰፊው፣ “የቆዳ በሽታ”። በመጽሐፍ ቅዱሳዊ አጠቃቀም የግሪኩ λέπρα የሚለው ቃል ዘመናዊውን ለምጽ (የሃንሰን በሽታ) ብቻ ሳይሆን የተለያዩ ከባድ የቆዳ በሽታዎችን ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: እጁንም ዘርግቶ
  rationale: የአኦሪስት ቦዝ አንቀጹንና ከዋናው ድርጊት በፊት የተፈጸመውን አካላዊ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἥψατο αὐτοῦ
  choice: ዳሰሰው
  rationale: በዚህ አውድ ἅπτομαι በቀጥታ መንካትን ያመለክታል፤ “ዳሰሰው” ኢየሱስ ከሰውየው ጋር አካላዊ ንክኪ ማድረጉን በግልጽ ይገልጣል።
- source_word: Θέλω
  choice: ፈቃደኛ ነኝ
  rationale: በፈውሱ አውድ ቃሉ ፍላጎትንና ዝግጁነትን እንጂ የወደፊት ጊዜን ብቻ አያመለክትም።
- source_word: καθαρίσθητι
  choice: ንጻ
  rationale: የተገብሮ ትእዛዙን አጭርነት ይጠብቃል፤ ከሕክምናዊ ፈውስ ባሻገር ያለውን የንጽሕናና የማኅበራዊ መመለስ ገጽታም አያጠፋም።
- source_word: εὐθέως
  choice: ወዲያውም
  rationale: የፈውሱን ፈጣንነት በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ λέπρα
  choice: ለምጹ
  rationale: “ለምጽ” በመጽሐፍ ቅዱሳዊ አውድ የታወቀ ትርጉም ነው፤ የግሪኩ ቃል ከዘመናዊው የሃንሰን በሽታ የሰፋ ሊሆን መቻሉ በማስታወሻ ተገልጿል።
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: ለቀቀው
  rationale: በሽታው ከእርሱ መወገዱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በለምጻሙ ፈውስ ውስጥ καθαρίσθητιን መተርጎም
  choice: ንጻ
  alternative: ተፈወስ፤ ንጹሕ ሁን
  rationale: የግሪኩ ቃል አካላዊ ፈውስን ብቻ ሳይሆን ከሥርዓታዊ ርኩሰት መንጻትንና ወደ ማኅበረሰቡ መመለስንም ያካትታል፤ “ንጻ” ይህን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር የድርጊት ቅደም ተከተል ተጠብቆ፣ ቃል በቃልነት የሚፈጥረው እንግዳ አገላለጽ ተወግዷል። የማስታወሻው ምልክት በሚያብራራው “ለምጽ” ቃል ላይ ተቀምጧል።
