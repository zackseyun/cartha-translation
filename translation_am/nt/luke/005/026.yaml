base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: am
  text: መደነቅ ሁሉንም ያዛቸው፤ እግዚአብሔርንም ያከብሩ ነበር፤ በፍርሃትም ተሞልተው፣ “ዛሬ ከተለመደው ውጭ የሆኑ ነገሮችን አይተናል[a]” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አስደናቂ ነገሮችን” ወይም “ያልተለመዱ ነገሮችን።” የግሪኩ ቃል ከተለመደው ግምት ውጭ የሆኑ ነገሮችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: እጅግ መደነቅ
  rationale: በዚህ አውድ ቃሉ ምሥጢራዊ ራእይን ሳይሆን ከፍተኛ መደነቅንና መገረምን ያመለክታል።
- source_word: ἔλαβεν ἅπαντας
  choice: ሁሉንም … ያዛቸው
  rationale: የግሪኩን ሕያው አገላለጽ በተፈጥሯዊ የአማርኛ ፈሊጥ ያስተላልፋል።
- source_word: ἐδόξαζον
  choice: ያከብሩ ነበር
  rationale: ያልተጠናቀቀውንና ቀጣይ ድርጊትን የሚያሳየውን የግሪክ ኢምፐርፌክት ገጽታ ይጠብቃል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: በመደበኛ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም θεόςን በተፈጥሯዊና በክብር ይተረጉማል።
- source_word: ἐπλήσθησαν φόβου
  choice: ፍርሃትም ሞላባቸው
  rationale: φόβοςን ወደ ‘አክብሮታዊ ድንቅ’ ብቻ ሳያለዝብ ፍርሃትንና አድናቆትን የሚያካትተውን ውጥረት ይጠብቃል።
- source_word: λέγοντες
  choice: አሉ
  rationale: በአማርኛ ጥቅሱን ተከትሎ ‘አሉ’ ማለት የተሳታፊውን ተግባር በተፈጥሯዊ ንግግር ያቀርባል።
- source_word: Εἴδομεν
  choice: አይተናል
  rationale: አሁን በተፈጸመው ነገር ላይ የሚሰጥ ወቅታዊ ምላሽ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παράδοξα
  choice: ከተለመደው ውጭ የሆኑ ነገሮች
  rationale: ቃሉ ከመደበኛ ግምት ውጭ የሆኑና አስደናቂ ነገሮችን ያመለክታል፤ ‘እንግዳ’ የሚለው ግን አሉታዊ ስሜት ሊፈጥር ይችላል።
- source_word: σήμερον
  choice: ዛሬ
  rationale: የዓይን ምስክሮቹን ወቅታዊ ምላሽ የሚጠብቅ ቀጥተኛ ትርጉም ነው።
theological_decisions:
- issue: በመለኮታዊ ተግባር ፊት φόβος ያለው ትርጉም
  choice: ‘ፍርሃት’ ተብሎ በቀጥታ ተተርጉሟል።
  alternative: ‘አክብሮታዊ ድንቅ’ ወይም ‘ፍርሃት የተቀላቀለበት አድናቆት’
  rationale: ጥቅሱ ለኢየሱስ ተአምራዊ ሥልጣን የተሰጠውን አክብሮታዊና የሚያናውጥ ምላሽ ያሳያል፤ ‘ፍርሃት’ ማለት በፍርሃትና በአምልኮ መካከል ያለውን መጽሐፍ ቅዱሳዊ ውጥረት አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘ያከብሩ ነበር’ የቀጣይ ድርጊቱን ገጽታ ይጠብቃል፤ አረፍተ ነገሩ ግን ለተራ አንባቢ ተፈጥሯዊ እንዲሆን ተዋቅሯል።
