  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: am
  text: ንግግሩን እንደጨረሰም ስምዖንን፣ “ጀልባውን ወደ ጥልቅ ውኃ[a] አስገባ፤ መረቦቻችሁንም ለማጥመድ አውርዱ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ጥልቁ።” የግሪኩ ቃል በቀጥታ “ወደ ጥልቁ” ይላል፤ እዚህ ግን ጥልቅ ውኃን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: እንደ…ም
  rationale: የትረካውን ቀላል ቅደም ተከተልና የጊዜ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπαύσατο λαλῶν
  choice: ንግግሩን እንደጨረሰ
  rationale: እየተናገረ የነበረውን ድርጊት መጨረሱን በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: ስምዖንን…አለው
  rationale: የግሪኩን ቀጥተኛ የንግግር መግቢያ በአማርኛ ተፈጥሯዊ አወቃቀር ይጠብቃል።
- source_word: Ἐπανάγαγε
  choice: ግባ
  rationale: በዓሣ ማጥመድ አውድ ከዳርቻ ርቆ ወደ ጥልቅ ውኃ መሄድን ያመለክታል፤ የነጠላ ትእዛዝ መሆኑንም ይጠብቃል።
- source_word: εἰς τὸ βάθος
  choice: ወደ ጥልቁ ውኃ
  rationale: βάθος በዚህ አውድ ረቂቅ ‘ጥልቀት’ ሳይሆን ጥልቅ ውኃን ያመለክታል፤ ‘ውኃ’ መጨመሩ ትርጉሙን ለዘመናዊ አንባቢ ግልጽ ያደርገዋል።
- source_word: χαλάσατε
  choice: አውርዱ
  rationale: መረቦችን ከጀልባ ወደ ውኃ ዝቅ ማድረግን የሚገልጽ ተፈጥሯዊ አቻ ነው፤ የብዙ ቁጥር ትእዛዙንም ይጠብቃል።
- source_word: τὰ δίκτυα ὑμῶν
  choice: መረቦቻችሁን
  rationale: የብዙ ቁጥር መረቦችንና ለብዙ ሰዎች የተነገረውን ባለቤትነት በግልጽ ሁኔታ ያሳያል።
- source_word: εἰς ἄγραν
  choice: ለማጥመድ
  rationale: የመረቦቹን ማውረድ ዓላማ ይገልጣል፤ የዓሣ ማጥመድ አውዱ ከአካባቢው ጥቅሶች ግልጽ በመሆኑ ‘ዓሣ’ ሳይጨመር አጭርና ተፈጥሯዊ ሆኗል።
