  text: But new wine must be put into fresh wineskins[a].
translation:
  language: am
  text: ነገር ግን አዲስ የወይን ጠጅ ወደ አዲስ የቆዳ ከረጢቶች ውስጥ መጨመር ይገባል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አዲስ የወይን ጠጅ ወደ ትኩስ የቆዳ ከረጢቶች ውስጥ መጨመር ይገባል።” በግሪክ ጽሑፉ ለወይኑ νέος (“አዲስ”፣ በተለይ በጊዜ)፣ ለቆዳ ከረጢቶቹም καινός (“አዲስ/ትኩስ”፣ በተለይ በሁኔታ ወይም በጥራት) የሚሉ ሁለት የተለያዩ ቅጽሎች ተጠቅመዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ቁጥር ጋር ያለውን ተቃርኖ በተፈጥሯዊና በክብር ያለው ዘመናዊ አማርኛ ያሳያል።
- source_word: οἶνον νέον
  choice: አዲስ የወይን ጠጅ
  rationale: νέον በጊዜ አዲስ የሆነውን፣ ገና ሙሉ በሙሉ ያልቦካውን የወይን ጠጅ ያመለክታል።
- source_word: εἰς
  choice: ውስጥ
  rationale: የመያዣውን ውስጣዊ መድረሻ ያሳያል፤ ከ‘መጨመር’ ጋር ሲጣመር ወደ ውስጥ የሚደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀσκοὺς
  choice: የቆዳ ከረጢቶች
  rationale: ቃሉ ፈሳሽ፣ በተለይም የወይን ጠጅ፣ ለመያዝ የሚያገለግሉ ከቆዳ የተሠሩ መያዣዎችን ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ዕቃውን ግልጽ ያደርጋል።
- source_word: καινοὺς
  choice: ትኩስ
  rationale: ከνέος የተለየውን የግሪክ ቃል ልዩነት በተቻለ መጠን ይጠብቃል፤ እዚህ ገና ያላረጁና ለአዲስ ወይን ጠጅ ተስማሚ የሆኑ የቆዳ መያዣዎችን ያመለክታል።
- source_word: βλητέον
  choice: መጨመር አለበት
  rationale: የግሪኩን ግላዊ ያልሆነ የግዴታ ወይም የተገቢነት ሐሳብ በግልጽ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በአንድ ዓረፍተ ነገር ውስጥ νέος እና καινός ያላቸውን ልዩነት መግለጽ
  choice: νέοςን ‘አዲስ’፣ καινόςን ‘ትኩስ’ ብሎ መተርጎም
  alternative: ሁለቱንም ‘አዲስ’ ብሎ መተርጎም
  rationale: የግሪክ ጽሑፉ ሁለት የተለያዩ ቅጽሎችን ይጠቀማል። ‘አዲስ … ትኩስ’ ማለት የወይኑን በጊዜ አዲስነትና የቆዳ መያዣዎቹን አዲስ/ያላረጀ ሁኔታ በተቻለ መጠን ይለያል፤ አንድን የሥነ መለኮት ትርጓሜ በጽሑፉ ላይ አያስገድድም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። ‘የቆዳ ከረጢቶች’ ታሪካዊውን መያዣ ለመደበኛ አንባቢ ግልጽ ያደርጋል፤ ‘ትኩስ’ ደግሞ ከ‘አዲስ’ ጋር ያለውን የምንጭ ቃላት ልዩነት ይጠብቃል።
