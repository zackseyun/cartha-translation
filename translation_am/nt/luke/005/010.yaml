  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: am
  text: እንዲሁም የዘብዴዎስ ልጆች የሆኑት ያዕቆብና ዮሐንስ፣ ከስምዖን ጋር አጋሮች የነበሩት፣ ተደነቁ። ኢየሱስም ስምዖንን፣ “አትፍራ፤ ከአሁን ጀምሮ ሰዎችን በሕይወት ትይዛለህ”[a][b] አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰዎችን ሕያዋን ሆነው ትይዛለህ።” የግሪኩ ግስ መግደል ሳይሆን ሕያው ሆኖ መያዝን ወይም መማረክን ያመለክታል።
    reason: lexical_alternative
  - marker: b
