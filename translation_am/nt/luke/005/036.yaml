source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: am
  text: እንዲህ የሚል ምሳሌም ይነግራቸው ነበር፦ “ማንም ከአዲስ ልብስ ላይ ጥገና ቁራጭ ቀድዶ በአሮጌ ልብስ ላይ አያደርገውም።[a] አለዚያ አዲሱን ልብስ ይቀዳዋል፤ ከአዲሱም የተወሰደው ጥገና ቁራጭ ከአሮጌው ጋር አይስማማም።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ማንም ከአዲስ ልብስ ጥገና ቁራጭ ቀድዶ፣ በአሮጌ ልብስ ላይ አያደርገውም።” በግሪኩ «ቀድዶ» የሚለው ተሳቢ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “አይስማማም” የሚለው “አይገጥምም” ወይም “ተስማሚ አይሆንም” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ ጥገና ቁራጩ ከአሮጌው ልብስ ጋር የማይጣጣም ወይም ተስማሚ ያልሆነ መሆኑን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: ምሳሌም ይነግራቸው ነበር
  rationale: የግሱን ያልተፈጸመ የአለፈ ጊዜ አኳኋን በ«ይነግራቸው ነበር» ያሳያል፤ «ም» ደግሞ καὶ የሚያስገባውን ተጨማሪ ሐሳብ ይጠብቃል።
- source_word: παραβολήν
  choice: ምሳሌ
  rationale: በወንጌላዊ ንግግር ውስጥ የተለመደ፣ ግልጽና ክብር ያለው አቻ ቃል ነው።
- source_word: ἐπίβλημα
  choice: መጣፊያ
  rationale: በልብስ ላይ የሚደረግን መጠገኛ ቁራጭ በትክክል ይገልጣል።
- source_word: ἱμάτιον καινόν / ἱμάτιον παλαιόν
  choice: አዲስ ልብስ / አሮጌ ልብስ
  rationale: ἱμάτιον እዚህ ሰፊ ትርጉም ስላለው «ልብስ» የተፈጥሮ አማርኛ ሲሆን፣ καινός እና παλαιός ያላቸውን ንጽጽር ይጠብቃል።
- source_word: σχίσας ἐπιβάλλει
  choice: ቀድዶ ... ላይ አያደርገውም
  rationale: የግሪኩን ቀድሞ የተፈጸመ ተሳቢ ግስ በተፈጥሯዊው የአማርኛ «ቀድዶ» ቅርጽ ያቀርባል፤ ἐπιβάλλειን የመስፋት ዘዴ ሳይጨምር «ያደርገውም» ብሎ ይተረጉማል።
- source_word: εἰ δὲ μήγε
  choice: እንዲህ ካደረገ
  rationale: በዚህ ዐውድ «ካልሆነ ግን» የሚለውን የግሪክ አገላለጽ የተጠቀሰው ድርጊት ቢፈጸም የሚከተለውን ውጤት በግልጽ ያሳያል።
- source_word: τὸ καινὸν σχίσει
  choice: አዲሱንም ይቀዳል
  rationale: ግሱ ንቁ ድምፅ ያለውና ድርጊት ፈጻሚው ሰው የተሰወረበት መሆኑን ይጠብቃል፤ አዲሱ ልብስ መጎዳቱንም ግልጽ ያደርጋል።
- source_word: οὐ συμφωνήσει
  choice: አይስማማም
  rationale: συμφωνέω በዚህ ዐውድ መጣፊያው ከአሮጌው ልብስ ጋር ተመጣጣኝ ወይም ተስማሚ አለመሆኑን ያመለክታል፤ «አይስማማም» ይህን ሆን ብሎ በሰፊ ትርጉም ይጠብቃል።
