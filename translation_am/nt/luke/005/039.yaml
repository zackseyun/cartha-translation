  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: am
  text: የቆየ ወይን ከጠጣ በኋላ አዲስ ወይን የሚፈልግ ማንም የለም፤ ‘የቆየው ጥሩ ነው’ ይላልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ ‘የቆየው ይሻላል’ ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: ማንም የለም
  rationale: ማንኛውንም ሰው በአጠቃላይ የሚያመለክተውን አሉታዊ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πιὼν
  choice: ከጠጣ በኋላ
  rationale: የአኦሪስት ተሳቢው ድርጊት ከዋናው ግስ በፊት መፈጸሙን በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: παλαιὸν
  choice: አሮጌ ወይን
  rationale: በግሪክ የ‘ወይን’ ስም በአውዱ የተገመተ ቢሆንም፣ በአማርኛ ለግልጽነት ስሙን መጨመር ተፈጥሯዊ ነው።
- source_word: θέλει νέον
  choice: አዲሱን የሚፈልግ
  rationale: θέλει የምርጫን ወይም የፍላጎትን ሐሳብ ያሳያል፤ ‘አዲሱን’ የሚለውም በአውዱ አዲስ ወይንን ያመለክታል።
- source_word: λέγει γάρ
  choice: ይላልና
  rationale: γάρ ለቀደመው ንግግር ምክንያት መስጠቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ὁ παλαιὸς χρηστός ἐστιν
  choice: አሮጌው ጥሩ ነው
  rationale: ‘አሮጌው’ የሚለው በአውዱ ወይኑን ያመለክታል፤ χρηστός ን በመሠረታዊና ትርጓሜን በማያጠብ መንገድ ‘ጥሩ’ ብሎ ያቀርባል።
theological_decisions:
- issue: በአሮጌና በአዲስ ወይን ምሳሌ ውስጥ χρηστός የሚለውን መተርጎም
  choice: ጥሩ
  alternative: ይሻላል
  rationale: የታተመው የግሪክ ጽሑፍ χρηστός የሚል ሲሆን ዋና ትርጉሙ ‘ጥሩ’ ወይም ‘ደስ የሚያሰኝ’ ነው፤ የንጽጽር ትርጉም ያለው ‘ይሻላል’ አይደለም። ስለዚህ ዋናው ጽሑፍ የምንጩን ንባብ ይከተላል፣ ሌላው ንባብ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የምሳሌው አጭር ቅርጽና የምክንያት ግንኙነቱ ተጠብቀዋል።
