  to: የቆየ ወይን ከጠጣ በኋላ አዲስ ወይን የሚፈልግ ማንም የለም፤ ‘የቆየው ጥሩ ነው’ ይላልና።[a]
  rationale: The revision improves idiomatic modern Amharic for aged wine and makes the ellipted object explicit where Amharic benefits from it. It retains the SBLGNT reading’s noncomparative sense, ‘ጥሩ ነው,’ and preserves the ‘better’ reading only in the textual-variant footnote.
