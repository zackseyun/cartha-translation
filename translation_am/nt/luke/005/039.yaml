review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the universal negative, the prior action of drinking old wine, the preference for new wine, and χρηστός as ‘good,’ rather than importing the comparative variant into the main text. The implied noun may be supplied in Amharic for clarity without altering the Greek sense.
  naturalness: ‘አሮጌ ወይን’ and especially the substantival ‘አሮጌው’ are understandable, but ‘የቆየ ወይን/የቆየው’ is the more idiomatic and contextually apt modern Amharic expression for aged wine. Supplying ‘ወይን’ after ‘አዲስ’ also makes this isolated verse smoother and clearer.
  terminology: Use ‘የቆየ ወይን’ for παλαιὸν in this wine context. Retain ‘ጥሩ ነው’ for χρηστός. The footnote appropriately preserves the comparative textual variant as ‘ይሻላል.’
  issues:
  - severity: low
    issue: The expression for old wine is less idiomatic.
    rationale: In modern Amharic, ‘የቆየ ወይን’ more naturally denotes wine that has aged than ‘አሮጌ ወይን,’ while preserving the source meaning.
  - severity: low
    issue: ‘አዲሱን’ leaves the implied noun unnecessarily unstated in an isolated verse.
    rationale: Although the Greek is elliptical, repeating ‘ወይን’ is natural Amharic and provides clarity without adding a distinct meaning.
  revised_text: የቆየ ወይን ከጠጣ በኋላ አዲስ ወይን የሚፈልግ ማንም የለም፤ ‘የቆየው ጥሩ ነው’ ይላልና።[a]
  revised_footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ ‘የቆየው ይሻላል’ ይላሉ።
    reason: textual_variant
  revision_rationale: The revision improves idiomatic modern Amharic for aged wine and makes the ellipted object explicit where Amharic benefits from it. It retains the SBLGNT reading’s noncomparative sense, ‘ጥሩ ነው,’ and preserves the ‘better’ reading only in the textual-variant footnote.
