language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: am
  text: ጻፎችና ፈሪሳውያንም፣ “የስድብ ቃላትን የሚናገረው ይህ ማን ነው? ከእግዚአብሔር ብቻ በቀር ኃጢአትን ይቅር ማለት የሚችል ማን ነው?” እያሉ ማሰላሰል ጀመሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: ማሰላሰል ጀመሩ
  rationale: ἤρξαντο የመጀመርን ሐሳብ ይጠብቃል፤ διαλογίζεσθαι ደግሞ ውስጣዊ አሳብን፣ ምክክርን ወይም ክርክርን ሊያመለክት ስለሚችል፣ “ማሰላሰል” ንግግራቸው በልብ ብቻ ነበር ወይም በድምፅ ነበር ብሎ ሳይወስን የግምገማ አሳባቸውን ያቀርባል።
- source_word: γραμματεῖς
  choice: የሕግ ጸሐፍት
  rationale: በወንጌላት አውድ ይህ ቃል የሕጉ ዕውቀትና ሥልጣን ያላቸውን ጸሐፍት ያመለክታል፤ “የሕግ ጸሐፍት” ባህላዊ ቃሉንና ሚናቸውን በግልጽ ያስተላልፋል።
- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የቡድኑን ስም በአማርኛ በተለመደው ቅርጽ ያቀርባል።
- source_word: λαλεῖ βλασφημίας
  choice: የስድብ ቃላትን የሚናገረው
  rationale: “የስድብ ቃላት” የβλασφημίαςን ብዙ ቁጥር ይጠብቃል፤ አገላለጹም ተናጋሪዎቹ ንግግሩን እንደ እግዚአብሔር ስድብ መቁጠራቸውን ያሳያል።
- source_word: ἁμαρτίας ἀφεῖναι
  choice: ኃጢአትን ይቅር ማለት
  rationale: ἀφίημι ከἁμαρτίας ጋር ሲመጣ ኃጢአትን ይቅር ማለትን የሚገልጽ የተለመደ አገላለጽ ነው፤ ይህም በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: ከእግዚአብሔር ብቻ በቀር
  rationale: የማግለል አገላለጹንና የμόνοςን ብቸኝነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Τίς ἐστιν οὗτος
  choice: ይህ ማን ነው?
  rationale: በግሪኩ የሌለውን “ሰው” ሳይጨምር የጥያቄውን አጭርና ንቀት የተቀላቀለበት ድምፅ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ኃጢአትን ይቅር የማለት ሥልጣን እንዳለው የሚነሣው ጥያቄ
  choice: ተናጋሪዎቹ “ከእግዚአብሔር ብቻ በቀር” ማንም ኃጢአትን ይቅር ሊል አይችልም የሚለውን ተቃውሞ በቀጥታ ማቅረብ
  alternative: ብቸኝነቱን ማለዘብ ወይም ጥቅሱ በግልጽ ያልተናገረውን ክርስቶሎጂያዊ ድምዳሜ መጨመር
  rationale: ጥቅሱ የሕግ ጸሐፍትና ፈሪሳውያን ያቀረቡትን ጠንካራ መለኮታዊ ተቃውሞ ይዘግባል። ትርጉሙ በሉቃስ ትረካ ውስጥ የሚፈጠረውን ውጥረት መጠበቅ አለበት እንጂ ያልተገለጸውን ድምዳሜ ማከል የለበትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “እያሉ ማሰላሰል” ቃላቱ በልብ ይሁኑ ወይም በውይይት ተነግረው እንደሆነ የግሪኩን ክፍትነት ይጠብቃሉ።
