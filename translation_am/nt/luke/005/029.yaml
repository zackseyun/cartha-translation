base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: am
  text: ሌዊ በገዛ ቤቱ ለእርሱ ታላቅ ግብዣ አደረገ፤ ብዙ የቀረጥ ሰብሳቢዎችና ሌሎች ሰዎችም ከእነርሱ ጋር[a] ተደግፈው በማዕድ ተቀምጠው[b] ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእርሱ ጋር።» የግሪኩ ጽሑፍ «ከእነርሱ ጋር» ይላል፤ ተውላጠ ስሙ ቀደም ሲል የተጠቀሰውን ቡድን ወይም በኢየሱስ ዙሪያ የተሰበሰቡትን ተመጋቢዎች እንደሚያመለክት ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: በዚያ ዘመን በመደበኛ ግብዣ ላይ ሰዎች በዝቅተኛ ማዕድ ዙሪያ ተደግፈው ይመገቡ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: ታላቅ ግብዣ
  rationale: δοχή የተጋበዙ ሰዎች የሚስተናገዱበትን ትልቅ የምግብ ዝግጅት ያመለክታል፤ «ታላቅ ግብዣ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: αὐτῷ
  choice: ለእርሱ
  rationale: ተውላጠ ስሙ በአቅራቢያው ዐውደ ንባብ ኢየሱስን ያመለክታል፤ ስሙን ሳይጨምር የግሪኩን አገላለጽ ይጠብቃል።
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: በገዛ ቤቱ
  rationale: ቤቱ የሌዊ መሆኑን በተፈጥሯዊ አማርኛ በግልጽ ያሳያል።
- source_word: ὄχλος πολὺς τελωνῶν καὶ ἄλλων
  choice: ብዙ ቀረጥ ሰብሳቢዎችና ሌሎችም
  rationale: ὄχλος πολύς ብዙ ሰዎች መኖራቸውን ያሳያል፤ «ብዙ» ይህን በቀላልና ወቅታዊ አማርኛ ይገልጣል። τελώνης በወንጌላት ዐውድ «ቀረጥ ሰብሳቢ» ተብሎ በግልጽ ይተረጎማል፤ ἄλλων ደግሞ ማንነታቸውን ሳይወስን «ሌሎችም» ተብሎ ቀርቧል።
- source_word: μετ’ αὐτῶν
  choice: ከእነርሱ ጋር
  rationale: የግሪኩን ብዙ ቁጥር ተውላጠ ስም በቀጥታ ይጠብቃል፤ በአማርኛ ሊነሣ የሚችለው ሌላ አረዳድ በማስታወሻ ተጠቅሷል።
- source_word: κατακείμενοι
  choice: በማዕድ ተቀምጠው
  rationale: ቃሉ ለመብላት በማዕድ መሆንንና በጥንቱ ልማድ ተደግፎ መቀመጥን ያመለክታል። «በማዕድ ተቀምጠው» ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን ባህላዊው ዝርዝር በማስታወሻ ተብራርቷል።
