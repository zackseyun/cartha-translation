- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: ጀልባዎቹም መስጠም ጀመሩ
  rationale: የአሁን ጊዜው የግስ ስም እየተካሄደ ያለ ውጤትን ያሳያል፤ «መስጠም ጀመሩ» ሙሉ በሙሉ ሰጥመው እንደጠፉ ሳያስመስል ሂደቱን ይገልጣል።
