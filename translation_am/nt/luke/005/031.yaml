  verdict: revise
  source_fidelity: The draft accurately identifies οἱ κακῶς ἔχοντες as an idiom for sick people and preserves Jesus’ responsive speech and the contrast between healthy and sick. However, its reversed formulation shifts the Greek’s stated negative assertion (‘the healthy have no need’) into an identification of who needs a physician. A direct contrast better preserves the source structure and emphasis.
  naturalness: The current wording is understandable, but the predicate construction ‘ሐኪም የሚያስፈልጋቸው ... አይደሉም’ is less direct than a standard Amharic contrast. The revision is fluent modern standard Amharic.
  terminology: ‘ሐኪም,’ ‘ጤነኞች,’ and ‘የታመሙት’ are appropriate, clear, and suitably dignified. The footnote correctly explains the Greek idiom without treating its literal wording as the intended sense.
  issues:
  - severity: low
    issue: The clause order and predicate structure recast the saying rather than retaining its explicit initial assertion about the healthy.
    rationale: Although the sense is substantially equivalent, the Greek explicitly says that healthy people do not need a physician, followed by an elliptical contrast concerning the sick. Rendering this structure directly improves source fidelity and Amharic clarity.
