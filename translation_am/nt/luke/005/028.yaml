  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: am
  text: ሁሉንም ትቶ[a] ተነሥቶ እርሱን ተከተለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉንም ከተወ በኋላ ተነሥቶ እርሱን ተከተለ።”
    reason: የግሪኩ ያለፈ ጊዜ አጋዥ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን ድርጊት በግልጽ ሊቀርብ ይችላል።
lexical_decisions:
- source_word: καταλιπὼν
  choice: ትቶ
  rationale: የግሱን ቀዳሚና ወሳኝ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ጥሎ’ የሚለው ሊያስከትለው የሚችለውን ከልክ ያለፈ የመተው ስሜት አያክልም።
- source_word: πάντα
  choice: ሁሉንም
  rationale: በግሪኩ ያለውን አጠቃላይና ያልተገደበ መጠን ይጠብቃል።
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: በትረካ አውድ ውስጥ ከቦታው ተነሥቶ ወደ ተግባር መግባቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἠκολούθει
  choice: ተከተለ
  rationale: ያልተጠናቀቀው የግሪክ ግስ ቀጣይ መከተልን ሊያመለክት ቢችልም፣ በዚህ የትረካ አውድ ‘ተከተለ’ ትክክለኛና ተፈጥሯዊ ነው፤ ‘መከተል ጀመረ’ የሚለውን ግልጽ ያልሆነ መነሻዊ ትርጉም አያስገድድም።
- source_word: αὐτῷ
  choice: እርሱን
  rationale: በቅርብ አውድ ወደ ኢየሱስ የሚያመለክተውን ተውላጠ ስም ይጠብቃል።
- source_word: καὶ
  choice: ያለ ተጨማሪ መስተዋድድ
  rationale: በአማርኛ የተከታታይ ድርጊቶች አወቃቀር ግንኙነቱን በግስ ቅርጾቹ በቂ ሁኔታ ያሳያል፤ ‘እና’ ቢጨመር ንባቡ ይከብዳል።
theological_decisions:
- issue: ሌዊ ሁሉን መተዉ ያለው ስፋት
  choice: ጥቅሱ እርሱ ‘ሁሉንም’ ትቶ ኢየሱስን እንደተከተለ ይናገራል፤ ከዚህ በላይ ስለ ንብረቱ ዘላቂ ሁኔታ አይወስንም።
  alternative: ሥራውን ለጊዜው ብቻ ተወ፤ ወይም ንብረቱን ሁሉ ለዘላለም ካደ።
  rationale: πάντα ያለውን አጠቃላይ አነጋገር በመጠበቅ ወሳኝ ምላሹን ያሳያል፤ ጽሑፉ ያልገለጠውን ስለ ንብረት ወይም ሙያ የሚነገር ሰፊ ትምህርት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ተነሥቶ’ የሚለው መደበኛ የግዕዝ ፊደል አጻጻፍ ተጠብቋል።
