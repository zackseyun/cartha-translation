    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መረቦቻቸው መቀደድ ጀመሩ።” የግሪኩ ያልተፈጸመ የግስ ጊዜ መቀደዱ በሂደት ላይ እንደነበር ያሳያል፤ መረቦቹ ሙሉ በሙሉ መቀደዳቸውን ግን አያስገድድም።
    reason: lexical_alternative
