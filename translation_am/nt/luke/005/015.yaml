  text: ነገር ግን ስለ እርሱ የሚነገረው ዜና ይበልጥ እየተስፋፋ ሄደ[a]፤ ብዙ ሕዝብም ሊሰሙትና ከበሽታቸው ሊፈወሱ ይሰበሰቡ ነበር።
