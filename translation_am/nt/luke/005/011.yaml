lexical_decisions:
- source_word: καταγαγόντες
  choice: ካወጡ በኋላ
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች ተካፋይ ግስ፣ ጀልባዎቹን ወደ የብስ ማውጣት ቀጥሎ ዋናው ድርጊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ πλοῖα
  choice: ጀልባዎቹን
  rationale: በገሊላ የዓሣ ማጥመድ አውድ ውስጥ πλοῖα በተፈጥሯዊና ትክክለኛ ሁኔታ ‘ጀልባዎች’ ይባላል።
- source_word: ἐπὶ τὴν γῆν
  choice: ወደ የብስ
  rationale: ቃል በቃል ‘ወደ/በየብስ ላይ’ የሚል ሲሆን፣ ጀልባዎቹን ከውኃ ወደ መሬት ማውጣታቸውን ያሳያል፤ ‘ዳርቻ’ የሚለውን ከጽሑፉ በላይ አይጨምርም።
- source_word: ἀφέντες
  choice: ትተው
  rationale: ἀφίημι እዚህ መተውን ወይም ኋላ መተውን ያመለክታል፤ የአማርኛው ተውሳከ ግስ የድርጊቶቹን ቅደም ተከተል ይጠብቃል።
- source_word: πάντα
  choice: ሁሉን
  rationale: የግሪኩ ገለልተኛ ብዙ ቁጥር አጠቃላይነትን ይገልጣል፤ ‘ሁሉን’ ይህን ሙሉ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἠκολούθησαν αὐτῷ
  choice: ተከተሉት
  rationale: አካላዊ መከተልንና የደቀ መዝሙርነትን ፍንጭ ሳያብራራ የግሪኩን ቀጥተኛ ትርጉም ይጠብቃል።
theological_decisions:
- issue: በπάντα የተገለጠው የመተው ወሰን
  choice: ሁሉን ትተው
  alternative: ሁሉንም ነገር ትተው
  rationale: ጽሑፉ ምላሻቸው አጠቃላይ መሆኑን ያሳያል፤ ነገር ግን ይህ ዘላቂ የንብረት መነጠል እንደነበር ወይም ምን ምን እንዳካተተ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የድርጊት ቅደም ተከተል በ‘ካወጡ በኋላ … ትተው ተከተሉት’ ተጠብቋል።
