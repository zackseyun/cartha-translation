- source_word: φέροντες
  choice: ተሸክመው የመጡ
  rationale: ተሸክመው እየቀረቡ ያሉትን ድርጊት በተፈጥሯዊ የአማርኛ የድርጊት ቅደም ተከተል ያሳያል።
- source_word: ἐπὶ κλίνης
  choice: በአልጋ
  rationale: κλίνη አልጋ፣ መኝታ ወይም አልጋ መሰል መሸከሚያን ሊያመለክት ስለሚችል ‘አልጋ’ ዋናውን ትርጉም ያለ ትርጓሜያዊ ማጥበብ ይጠብቃል።
- source_word: παραλελυμένος
  choice: ሽባ የሆነ
