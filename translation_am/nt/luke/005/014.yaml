  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የኢየሱስ ቀጥተኛ ንግግር በጥቅስ ምልክት ተለይቷል፤ የግሪኩ አሻሚነት በዋናው ጽሑፍና በ[a] ማስታወሻ ተጠብቋል።
