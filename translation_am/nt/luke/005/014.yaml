base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: am
  text: እርሱም፣ “ለማንም እንዳትናገር፤ ነገር ግን ሄደህ ራስህን ለካህኑ አሳይ፤ ስለ መንጻትህም ሙሴ እንዳዘዘ መባ አቅርብ፤ ለእነርሱም ምስክር እንዲሆን[a]” ብሎ አዘዘው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእነርሱ ላይ ማስረጃ እንዲሆን።” “እነርሱ” የሚለው ካህናቱን ወይም ሌሎችን ሊያመለክት ይችላል፤ አንዳንዶችም ሐረጉን በእነርሱ ላይ የሚሆን ማስረጃ ብለው ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: παρήγγειλεν
  choice: አዘዘው
  rationale: ቃሉ ግልጽ ሥልጣናዊ ትእዛዝን ያመለክታል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: μηδενὶ εἰπεῖν
  choice: ለማንም እንዳትናገር
  rationale: የግሪኩን ክልከላ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἀπελθὼν
  choice: ሄደህ
  rationale: ተከታዩን ትእዛዝ የሚቀድም ድርጊት መሆኑን ያሳያል፤ ከ‘ሂድና’ ይልቅ የተከታታይነቱን ጥላ ይጠብቃል።
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: ራስህን ለካህኑ አሳይ
  rationale: ቀጥተኛውን ትእዛዝና አንጸባራቂ ተውላጠ ስም በቅርብ ይጠብቃል።
- source_word: προσένεγκε
  choice: መባውን አቅርብ
  rationale: በካህናዊው ዐውድ ‘አቅርብ’ የመሥዋዕት አቀራረብን ይገልጻል፤ በአማርኛ ሐረጉ ግልጽ እንዲሆን የታወቀው ነገር ‘መባውን’ ተጨምሯል።
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: ለመንጻትህ
  rationale: መባው የሚቀርብበትን ጉዳይና ዓላማ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: ሙሴ እንዳዘዘው
  rationale: የሙሴን ሕጋዊ ትእዛዝ ቀጥታ ይጠብቃል።
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ለእነርሱ ምስክር ይሆን ዘንድ
  rationale: የ‘እነርሱ’ን ማጣቀሻና የምስክሩን አዎንታዊ፣ ማስረጃዊ ወይም ተቃራኒ ኃይል ሳይወስን የግሪኩን አሻሚነት ይጠብቃል።
theological_decisions:
- issue: በεἰς μαρτύριον αὐτοῖς ውስጥ የαὐτοῖς ማጣቀሻና የምስክሩ ኃይል
  choice: ‘ለእነርሱ’ ተብሎ ቡድኑና ምስክሩ ለእነርሱ ነው ወይስ በእነርሱ ላይ ነው የሚለው ሳይወሰን ቀርቷል።
  alternative: ‘ለካህናቱ ምስክር’፣ ‘ለሕዝቡ ምስክር’ ወይም ‘በእነርሱ ላይ ማስረጃ’
  rationale: የግሪኩ ጽሑፍ ተውላጠ ስሙ የሚያመለክተውን ቡድን አይገልጽም፤ ሐረጉም አዎንታዊ ምስክርነትን፣ ማስረጃነትን ወይም ተቃራኒ ማስረጃን ሊያመለክት ስለሚችል አሻሚነቱ ተጠብቋል።
