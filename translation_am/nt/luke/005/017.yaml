source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: am
  text: በእነዚያ ቀኖች በአንዱ፣ እርሱ እያስተማረ ነበር፤ ከገሊላና ከይሁዳ ባሉ መንደሮች ሁሉ እንዲሁም ከኢየሩሳሌም የመጡ ፈሪሳውያንና የሕግ አስተማሪዎች ተቀምጠው ነበር፤ የጌታም ኃይል እርሱ እንዲፈውስ በዚያ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “እርሱ እንዲፈውስ” በሚለው ፈንታ “እነርሱን እንዲፈውስ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: ከእነዚያም ቀኖች በአንዱ እንዲህ ሆነ
  rationale: የሉቃስን የትረካ መክፈቻ በተፈጥሯዊና በዘመናዊ አማርኛ ያቀርባል፤ የክስተቱን መጀመርም ይጠብቃል።
- source_word: αὐτὸς ἦν διδάσκων
  choice: እርሱ እያስተማረ ነበር
  rationale: የቀጣይ ድርጊትን የሚገልጠውን የግሪክ አወቃቀር ይጠብቃል፤ αὐτόςን ከሚገባው በላይ አጽንዖት አይሰጠውም።
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: ፈሪሳውያንና የሕግ አስተማሪዎች
  rationale: ለΦαρισαῖοι የተለመደውን ስያሜ ይጠቀማል፤ νομοδιδάσκαλοιንም ሳይተረጉም በግልጽ ያቀርባል።
- source_word: ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: ከገሊላና ከይሁዳ መንደሮች ሁሉ እንዲሁም ከኢየሩሳሌም
  rationale: κώμηን ‘መንደር’ ብሎ በመተርጎም የሰፈሩን ዓይነትና πάσηςን ‘ሁሉ’ ብሎ በመግለጽ የስርጭቱን ኃይል ይጠብቃል፤ ኢየሩሳሌም ከክልሎቹ የተለየች ከተማ መሆኗንም አወቃቀሩ ያብራራል።
- source_word: δύναμις κυρίου
  choice: የጌታ ኃይል
  rationale: የግሪኩን የባለቤትነት ግንኙነትና መለኮታዊውን ኃይል በቀጥታ ይጠብቃል።
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: እርሱ እንዲፈውስ በዚያ ነበር
  rationale: εἰς τὸ ከኢንፊኒቲቭ ጋር ያለውን የዓላማ/ውጤት ኃይል ያሳያል፤ በSBLGNT የቀረበውን ነጠላ αὐτόν ተከትሎ ያልተጠቀሰ የብዙ ቁጥር ተሳቢ አይጨምርም።
theological_decisions:
- issue: የ“δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν” ትርጉምና የተውላጠ ስሙ አመልካች
  choice: የጌታ ኃይል እርሱ እንዲፈውስ በዚያ ነበር
  alternative: የጌታ ኃይል እነርሱን ለመፈወስ በዚያ ነበር፤ ወይም የጌታ ኃይል ለመፈወስ ከእርሱ ጋር ነበር
  rationale: የቀረበው የSBLGNT ጽሑፍ αὐτόν ይላል፤ ስለዚህ ዋናው ጽሑፍ ‘እነርሱን’ የሚል ብዙ ቁጥር ተሳቢ አይጨምርም። ትርጉሙ መለኮታዊው ኃይል በኢየሱስ የፈውስ አገልግሎት ሥራ ላይ መሆኑን ያሳያል፤ ከአወቃቀሩ በላይ የሆነ የእምነት ድምዳሜ ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር ለአማርኛ ንባብ ተፈጥሯዊነት በሦስት ሐረጎች ተከፍሏል፤ ነገር ግን የትረካው ቅደም ተከተልና የነገረ መለኮት ውጥረቱ ተጠብቀዋል።
