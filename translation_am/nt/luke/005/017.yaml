    rationale: “እንዲህ ሆነ” after “በአንዱ” is less natural than a direct temporal opening in contemporary Amharic and adds a demonstrative nuance not expressed by the Greek formula.
  - severity: low
    issue: Distributive village phrasing can be clearer
    rationale: “ከገሊላና ከይሁዳ መንደሮች ሁሉ” is comprehensible, but “በገሊላና በይሁዳ ካሉ መንደሮች ሁሉ” more clearly conveys that the villages are in both regions.
