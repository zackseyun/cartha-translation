lexical_decisions:
- source_word: θάμβος
  choice: መደነቅ
  rationale: ቃሉ ድንገተኛና ከፍተኛ የሆነ የመገረም ስሜትን ያመለክታል፤ «መደነቅ» በዘመናዊ አማርኛ ግልጽና ክብር ያለው አገላለጽ ነው።
- source_word: γὰρ
  choice: ነበርና
  rationale: አረፍተ ነገሩ በቀደመው ቁጥር የተገለጠውን የስምዖን ምላሽ ምክንያት ይሰጣል፤ የአማርኛው «-ና» ይህን ገላጭ ግንኙነት በተፈጥሮ ያሳያል።
- source_word: περιέσχεν
  choice: ይዟቸው ነበር
  rationale: ግሱ በቀጥታ መክበብን ወይም መያዝን ሊያመለክት ቢችልም፣ እዚህ መደነቅ ሰዎቹን ሙሉ በሙሉ እንደተቆጣጠራቸው ይገልጣል። «ይዟቸው ነበር» የምስሉን ኃይል ይጠብቃል።
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: ከእርሱ ጋር የነበሩትን ሁሉ
  rationale: በቦታው ከስምዖን ጋር የነበሩትን በሙሉ የሚያካትት ግልጽና ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: በያዙት ዓሣ ምክንያት
  rationale: ἐπί በዚህ አገባብ ምክንያትን ያሳያል፤ ἄγρα ደግሞ የተያዘውን ዓሣ ወይም የማጥመዱን ውጤት ያመለክታል። ይህ ትርጉም ያልተፈጥሯዊ ስማዊ አገላለጽን በማስወገድ የምክንያቱን ግንኙነት ይጠብቃል።
- source_word: ὧν συνέλαβον
  choice: በያዙት
  rationale: አንጻራዊው ሐረግ ዓሣዎቹን ይመለከታል፤ የብዙ ቁጥር ግሱም ቡድኑ በማጥመዱ መሳተፉን ያሳያል። «ያዙ» በዐውደ ንባቡ ግልጽና ተፈጥሯዊ ነው።
