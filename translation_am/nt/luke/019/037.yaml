  alternative: ተአምራት፤ የኃይል ሥራዎች
  rationale: ይህ ምርጫ በድርጊቶቹ የተገለጠውን ኃይል ያጎላል፤ የግሪኩን ሰፊ ትርጉም ወደ አንድ ቴክኒካዊ የተአምር ቃል አያጠብም።
