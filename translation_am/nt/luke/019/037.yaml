lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: እርሱም ... ቀርቦ ሳለ
  rationale: የግሪኩን ገለልተኛ የባለቤት አገባብ እንደ የጊዜ ዳራ ያቀርባል፤ ἤδη የሚያመለክተው መቅረቡ በዚያን ጊዜ እውን መሆኑን ‘ቀርቦ’ ያሳያል።
- source_word: πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: ወደ ደብረ ዘይት ቁልቁለት
  rationale: πρὸς ከዳቲቭ ጋር የቦታ ቅርበትን ያሳያል፤ ‘ቁልቁለት’ የመውረጃውን ክፍል በተፈጥሯዊ አማርኛ ይገልጣል። ‘ደብረ ዘይት’ በአማርኛ የተለመደው የቦታው ስም ነው።
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: የደቀ መዛሙርቱ ሕዝብ ሁሉ
  rationale: πλῆθος ብዙ የሆነ ስብስብን ያመለክታል፤ ቡድኑ የደቀ መዛሙርቱ መሆኑን በግልጽ ይጠብቃል።
- source_word: χαίροντες
  choice: ደስ እያላቸው
  rationale: ተሳቢው ተግባር ምስጋናው በደስታ እንደተከናወነ ያሳያል።
- source_word: ἤρξαντο ... αἰνεῖν τὸν θεὸν
  choice: እግዚአብሔርን ማመስገን ጀመሩ
  rationale: የመጀመር ትርጉሙንና የምስጋናውን ቀጥተኛ ተሳቢ ይጠብቃል።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የግሪኩን ተጨባጭ አገላለጽ በተለመደ አማርኛ ያቀርባል።
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: ስላዩአቸው ኃይለኛ ሥራዎች ሁሉ
  rationale: δύναμις በዚህ ዐውድ የኃይል መገለጫ የሆኑ ድርጊቶችን ያመለክታል፤ ‘ኃይለኛ ሥራዎች’ ቃሉን ወደ ‘ተአምራት’ ብቻ ሳያጠብ ስፋቱን ይጠብቃል።
theological_decisions:
- issue: δύναμις በተአምራዊ ድርጊቶች ዐውድ ውስጥ እንዴት እንደሚተረጎም
