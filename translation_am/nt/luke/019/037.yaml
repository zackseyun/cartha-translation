  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: am
  text: እርሱም ቀድሞውኑ ወደ ደብረ ዘይት መውረጃ ቀርቦ ሳለ፣ የደቀ መዛሙርቱ ሕዝብ ሁሉም ደስ እያላቸው፣ ስላዩአቸው የኃይል ሥራዎች[a] ሁሉ በታላቅ ድምፅ እግዚአብሔርን ማመስገን ጀመሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተአምራት” ወይም “ኃይለኛ ድርጊቶች”፤ የግሪኩ ቃል “ኃይል/ሥራ” የሚል ሲሆን፣ መለኮታዊ ኃይል በድርጊቶች መገለጡን ያጎላል።
