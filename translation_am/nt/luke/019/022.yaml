source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: am
  text: እርሱም፣ “ክፉ ባሪያ፣ በራስህ አፍ እፈርድብሃለሁ።[a] እኔ ያላኖርኩትን የምወስድ፣ ያልዘራሁትንም የማጭድ ጨካኝ ሰው መሆኔን ታውቅ ነበር?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከራስህ ቃል እፈርድብሃለሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: ከራስህ አፍ በወጣው ነገር
  rationale: የግሪኩን የአፍ ምሳሌያዊ አነጋገር እየጠበቀ፣ ፍርዱ በባሪያው በራሱ ንግግር ላይ እንደተመሠረተ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κρίνω
  choice: እፈርድብሃለሁ
  rationale: የወደፊት ጊዜ ቅርጹንና በተናጋሪው ላይ የሚደረገውን ፍርድ ያስተላልፋል፤ ‘እኮንንሃለሁ’ ከግሪኩ ይበልጥ የተወሰነ ነው።
- source_word: πονηρὲ δοῦλε
  choice: ክፉ ባሪያ
  rationale: ‘ክፉ’ የሞራል ወቀሳውን ይገልጣል፤ ‘ባሪያ’ ደግሞ በጌታና በባሪያ ዐውድ ውስጥ የδοῦλοςን ተገዢነት ከ‘አገልጋይ’ ይልቅ በግልጽ ያሳያል።
- source_word: ᾔδεις
  choice: ታውቅ ነበር
  rationale: በዐውዱ የባሪያውን ቀድሞ የነበረ ዕውቀት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐστηρός
  choice: ጨካኝ
  rationale: ቃሉ ባሪያው ለጌታው የሰጠውን አሉታዊ፣ ጥብቅና የማይራራ ገለጻ ያስተላልፋል፤ ‘ጥብቅ’ ብቻ የአሉታዊ ክብደቱን ሙሉ በሙሉ አያሳይም።
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: ያላኖርኩትን የማነሣ
  rationale: የሁለቱን ግሶች ምስልና ተቃርኖ ይጠብቃል፤ τίθημιን እንደ ቴክኒካዊ የገንዘብ ማስቀመጥ በመወሰን አይተረጉምም።
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: ያልዘራሁትን የማጭድ
  rationale: የመዝራትና የማጨድን ግብርናዊ ምስል ይጠብቃል፤ የዝምድናው ተውላጠ ስም ተሳቢ ስለሆነ ‘ያልዘራሁትን’ ተብሎ እንጂ ‘ባልዘራሁበት’ ተብሎ አልተተረጎመም።
theological_decisions:
- issue: በምሳሌያዊው የጌታና የባሪያ ዐውድ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ዐውዱ የግለሰቡን ተገዢና በጌታ ሥልጣን ሥር የሆነ ማኅበራዊ ሁኔታ ያጎላል፤ ‘ባሪያ’ ይህን ኃይል ይጠብቃል።
- issue: የጌታው ራስን ገላጭ ንግግር እውነትን እንደሚያረጋግጥ ወይስ የባሪያውን ቃል በክርክር እንደሚመልስ መወሰን
  choice: “ጨካኝ ሰው መሆኔን ታውቅ ነበር?” የሚለውን ቀጥተኛ አነጋገር ማቆየት
  alternative: “ጨካኝ ሰው ነኝ ብለህ ካወቅህ” ወይም “እንደምትለው” ብሎ ማብራራት
  rationale: ግሪኩ የባሪያውን ገለጻ በጥያቄያዊ የክርክር መልክ ይመልሳል። ትርጉሙ ይህን አሻሚነት ይጠብቃል፣ የመሳፍንቱን ባሕርይ በነገረ መለኮታዊ መንገድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የንግግሩ ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን “አለው” በመጨረሻ ተቀምጧል፤ የግሪኩ የመጨረሻ ጥያቄ ምልክትም የጌታውን ስላቃዊ/ክርክራዊ ጥያቄ ለማቆየት ተጠብቋል።
