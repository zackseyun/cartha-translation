review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future force of κρίνω, the direct address πονηρὲ δοῦλε, the rhetorical question, and the accusative sense of both relative clauses (‘what,’ not ‘where’). However, the rendering of Ἐκ τοῦ στόματός σου is unnecessarily expanded, and የማነሣ is less fitting than ‘take’ for αἴρων in this context.
  naturalness: The revised wording uses the established and idiomatic Amharic judicial expression በራስህ አፍ እፈርድብሃለሁ. Replacing የማነሣ with የምወስድ makes the parallel accusations read more naturally without specifying a technical financial meaning for τίθημι.
  terminology: ባሪያ appropriately represents δοῦλος in this master–slave parable setting. ጨካኝ ሰው is an acceptable negative rendering of αὐστηρός and is retained. No theological interpretation is added to the master's rhetorical reuse of the slave's characterization.
  issues:
  - severity: low
    issue: Expanded rendering of Ἐκ τοῦ στόματός σου
    rationale: ከራስህ አፍ በወጣው ነገር adds ‘the thing that came out’ and is more cumbersome than necessary. በራስህ አፍ is both natural and closely reflects the source idiom.
  - severity: low
    issue: Lexical fit of የማነሣ for αἴρων
    rationale: While ማንሣ can mean ‘take up,’ it commonly evokes lifting. መውሰድ more naturally conveys the accusation of taking what one did not put down, while leaving the precise nuance open.
  revised_text: እርሱም፣ “ክፉ ባሪያ፣ በራስህ አፍ እፈርድብሃለሁ።[a] እኔ ያላኖርኩትን የምወስድ፣ ያልዘራሁትንም የማጭድ ጨካኝ ሰው መሆኔን ታውቅ ነበር?” አለው።
