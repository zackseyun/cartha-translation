  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: am
  text: ሁሉም ይህን ባዩ ጊዜ፣ “እሱ እንግዳ ሆኖ ለመቀመጥ ወደ ኃጢአተኛ ሰው ቤት ገባ” እያሉ ማጉረምረም ጀመሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: ይህን ባዩ ጊዜ
  rationale: የአኦሪስት አጋዥ ግስ በአማርኛ ተፈጥሯዊ በሆነ የጊዜ አንቀጽ ተተርጉሟል፤ ‘ይህን’ የሚለው ኢየሱስ ከዘኬዎስ ጋር መሄዱን ያመለክታል።
- source_word: πάντες
  choice: ሁሉም
  rationale: የሕዝቡ ምላሽ አጠቃላይ እንደነበር የግሪኩን አጽንዖት ይጠብቃል።
- source_word: διεγόγγυζον
  choice: ማጉረምረም ጀመሩ
  rationale: ያልተጠናቀቀው የግስ ቅርጽ ቀጣይነትን ወይም የድርጊቱን መጀመር ሊያመለክት ይችላል፤ ይህ አተረጓጎም ምላሹ መነሳቱንና ቅሬታ የተሞላበት ማንጎራጎር መሆኑን ያሳያል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: የማጉረምረማቸውን ይዘት በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: ኃጢአተኛ ሰው ቤት
  rationale: παρά ከዳቲቭ ጋር በአንድ ሰው ዘንድ ማረፍን ያመለክታል፤ ‘ኃጢአተኛ ሰው’ ቅጽልንና ἀνήρ የሚለውን ስም ይጠብቃል፣ ‘ቤት’ ደግሞ በአማርኛ የመግባቱን መዳረሻ በተፈጥሯዊነት ያሳያል።
- source_word: εἰσῆλθεν
  choice: ገባ
  rationale: ኢየሱስ ወደ ዘኬዎስ ቤት መግባቱን በቀጥታና ተፈጥሯዊ በሆነ የአማርኛ ፍጹም ግስ ይገልጻል።
- source_word: καταλῦσαι
  choice: እንግዳ ሆኖ ሊቆይ
  rationale: ቃሉ በአንድ ቦታ እንደ እንግዳ ማረፍን ወይም መቆየትን ያመለክታል፤ ይህ አገላለጽ ሁለቱንም ገጽታዎች በግልጽ ዘመናዊ አማርኛ ያቀርባል።
