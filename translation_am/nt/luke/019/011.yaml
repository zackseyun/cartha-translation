id: LUK.19.11
reference: Luke 19:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: am
  text: እነርሱም ይህን እየሰሙ ሳሉ፣ ኢየሱስ ቀጥሎ አንድ ምሳሌ ተናገረ፤ ይህንም ያደረገው እርሱ ወደ ኢየሩሳሌም ቀርቦ ስለነበርና እነርሱ የእግዚአብሔር መንግሥት ወዲያውኑ ሊገለጥ ነው[a] ብለው ስላሰቡ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወዲያውኑ ሊታይ ነው።” ግሱ በግልጽ መታየትን ወይም መገለጥን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: እነርሱም ይህን እየሰሙ ሳሉ
  rationale: የግሪኩ ጄኒቲቭ አብሶሉትና የአሁን ጊዜ አሳታፊ ግስ በአንድ ጊዜ እየተከናወነ ያለ ተግባርን ያሳያሉ፤ ይህ አተረጓጎም ቀጣይነቱን ይጠብቃል።
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: ቀጥሎ አንድ ምሳሌ ተናገረ
  rationale: ቃል በቃል ‘ጨምሮ ተናገረ’ ከማለት ይልቅ የንግግሩን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ምሳሌ’ የወንጌላትን የተለመደ ዘውግ ይጠብቃል።
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: እርሱ ወደ ኢየሩሳሌም ቀርቦ ስለነበር
  rationale: διά ከአርቲክላዊ ኢንፊኒቲቭ ጋር ምክንያትን ይገልጣል፤ የቀረበውም ኢየሱስ መሆኑን የግሪኩ አገባብ ያመለክታል።
- source_word: δοκεῖν αὐτοὺς
  choice: እነርሱ ... ብለው ስላሰቡ
  rationale: የሰዎቹን ግምትና ተስፋ ይገልጣል እንጂ እርግጠኛ እውቀትን አያመለክትም።
- source_word: παραχρῆμα
  choice: ወዲያውኑ
  rationale: የጊዜን ፈጣንነትና አፋጣኝነት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: ሊገለጥ ነው
  rationale: μέλλω ቅርብ ጊዜ የሚጠበቅ ክስተትን፣ ἀναφαίνεσθαι ደግሞ መታየትን ወይም መገለጥን ያመለክታል። ‘ሊገለጥ ነው’ ሁለቱንም በአጭር ይይዛል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደና ትክክለኛ አተረጓጎም ሲሆን የሉቃስን ትረካዊና ሥነ መለኮታዊ ቀጣይነት ይጠብቃል።
theological_decisions:
- issue: የመንግሥቱ የሚጠበቀው መገለጥ ባሕርይ
  choice: የእግዚአብሔር መንግሥት ‘ወዲያውኑ ሊገለጥ’ ነው ብለው እንዳሰቡ ማቅረብ
  alternative: መንግሥቱ በፖለቲካዊ መልክ ሊቋቋም ነው ወይም በፍጻሜ ዘመን ሙሉ በሙሉ ሊገለጥ ነው ብሎ መወሰን
  rationale: ጥቅሱ የቅርብ ጊዜ መገለጥ ተስፋቸውን ይዘግባል እንጂ የመገለጡን ዓይነት አይወስንም፤ ትርጉሙ ይህን አሻሚነትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ኢየሱስ’ በግሪኩ በስም ባይደገምም የ‘እርሱ’ን ማጣቀሻ በአማርኛ ግልጽ ለማድረግ ተጨምሯል፤ ይህ አዲስ ይዘት አያስገባም።
