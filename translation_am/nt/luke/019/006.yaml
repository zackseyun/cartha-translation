    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: ፈጥኖ
  rationale: የአኦሪስት አድራጊ ቅጽ የድርጊቱን ፈጣንነትና ዝግጁነት ያሳያል፤ «ፈጥኖ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: κατέβη
  choice: ወረደ
  rationale: የቁልቁለት እንቅስቃሴውን በግልጽና ቀጥተኛ መንገድ ይገልጣል።
- source_word: ὑπεδέξατο
  choice: ተቀበለው
  rationale: መቀበልን፣ በዐውዱም የእንግዳ አቀባበልን ሊያመለክት የሚችለውን መካከለኛ ድምፅ ይጠብቃል፤ ከ«እንግዳ አደረገው» ይልቅ የምንጩን ስፋት አያጠብም።
- source_word: αὐτόν
  choice: እርሱን / -ው
  rationale: ተውላጠ ስሙ ኢየሱስን ያመለክታል፤ በአማርኛ ከግሱ ጋር በተያያዘው «-ው» ተገልጧል።
- source_word: χαίρων
  choice: በደስታ
  rationale: ከመቀበሉ ጋር አብሮ የነበረውን የደስታ ሁኔታ ተፈጥሯዊ በሆነ ተውሳካዊ አገላለጽ ያስተላልፋል።
- source_word: καὶ ... καὶ
  choice: እርሱም ... በደስታም
  rationale: ተደጋጋሚውን የትረካ ቅንጅት በአማርኛው «-ም» በተፈጥሯዊ ሁኔታ ያንጸባርቃል።
