  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: am
  text: እነርሱም ውርንጫውን እየፈቱ ሳሉ፣ ባለቤቶቹ፣ “ውርንጫውን ለምን ትፈቱታላችሁ?” አሏቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυόντων
  choice: እየፈቱ ሳሉ
  rationale: የግሪኩ የአሁን ጊዜ ቦዝ አንቀጽ ከዋናው ግስ ጋር በአንድ ጊዜ የሚከናወን ድርጊትን ያሳያል፤ ይህ አገላለጽም ያንን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ማያያዣ ስለሆነ፣ በአማርኛ ከተውላጠ ስሙ ጋር የተያያዘው “-ም” ፍሰቱን ያለ ከባድ ንፅፅር ይቀጥላል።
- source_word: αὐτῶν
  choice: እነርሱ
  rationale: በቀደመው አውድ የተጠቀሱትን ሁለት ደቀ መዛሙርት የሚያመለክተውን ተውላጠ ስም ብቻ ይገልጣል፤ ስማቸውን በመጨመር አውዱን አይተረጉምም።
- source_word: πῶλον
  choice: ውርንጫውን
  rationale: πῶλος ወጣት እንስሳን ያመለክታል፤ ቀዳሚው አውድ የአህያ ውርንጫ መሆኑን ይለያል። “ውርንጫ” አጭር፣ የተለመደና አውዱን የሚጠብቅ ነው።
- source_word: εἶπαν
  choice: አሏቸው
  rationale: λέγω የሚለውን መደበኛ “አለ” በቀጥታ ይተረጉማል፤ ንግግሩ ጥያቄ ቢሆንም “ጠየቁ” ብሎ የግሱን መሠረታዊ ትርጉም አይቀይርም።
- source_word: οἱ κύριοι αὐτοῦ
  choice: ባለቤቶቹ
  rationale: κύριοι እዚህ መለኮታዊ ማዕረግ ሳይሆን የውርንጫውን ሰብአዊ ባለንብረቶች ያመለክታል። “ባለቤቶቹ” ይህን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: πρὸς αὐτούς
  choice: አሏቸው
  rationale: πρός ከንግግር ግስ ጋር የሚያሳየው ተቀባይ በአማርኛው “-አቸው” ቅጥያ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: Τί
  choice: ለምን
  rationale: τί ቃል በቃል “ምን” ቢሆንም፣ በዚህ የጥያቄ አገባብ የድርጊቱን ምክንያት ይጠይቃል፤ “ለምን” ይህን ኃይል በግልጽ አማርኛ ያስተላልፋል።
- source_word: λύετε
  choice: ትፈቱታላችሁ
  rationale: የአሁን ጊዜ ድርጊትንና የብዙ ሰው አድራጊን ያሳያል። “ፈታ”ን መድገም ከλυόντων ጋር ያለውን የቃል ግንኙነት ይጠብቃል።
theological_decisions:
- issue: κύριοι በሰብአዊ የባለንብረትነት አውድ እንዴት እንደሚተረጎም
  choice: ባለቤቶቹ
  alternative: ጌቶቹ
  rationale: ብዙ ቁጥር ያለው κύριοι እዚህ የእንስሳውን ሰብአዊ ባለንብረቶች እንጂ “ጌታ” የሚለውን መለኮታዊ ወይም ክብራዊ ማዕረግ አያመለክትም። “ባለቤቶቹ” የአውዱን ግልጽ ትርጉም ያለ ሐሰተኛ ሥነ መለኮታዊ ጥላ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ λύω በሁለቱም ስፍራ “ፈታ” ተብሎ ተጠብቋል። ትርጉሙ “ባለቤቶቹ” በማለት የግሪኩን ብዙ ቁጥር በግልጽ ስለሚጠብቅ የእንግሊዝኛው ማስታወሻ በአማርኛ አላስፈለገም።
