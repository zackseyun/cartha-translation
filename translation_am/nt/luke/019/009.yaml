  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፦ “ዛሬ ድነት ለዚህ ቤት[a] መጥቷል፤ ምክንያቱም እርሱም ደግሞ የአብርሃም ልጅ ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለዚህ ቤተሰብ።” የግሪኩ ቃል ቤቱን ራሱን ወይም ከቤቱ ጋር የተያያዘውን ቤተሰብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν
  choice: ኢየሱስም እንዲህ አለው
  rationale: δέ የትረካውን ፍሰት በ«ም» ያገናኛል፤ πρὸς αὐτόν የሚያመለክተው ተውላጠ ስም በ«አለው» ውስጥ ተጠብቋል። «እንዲህ» ቀጥሎ ያለውን ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Σήμερον
  choice: ዛሬ
  rationale: የጊዜውን አጽንዖት በቀጥታና በዘመናዊ አማርኛ ይገልጣል።
- source_word: σωτηρία
  choice: ድነት
  rationale: በሉቃስ ውስጥ ያለውን ሰፊ መንፈሳዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: τῷ οἴκῳ τούτῳ
  choice: ለዚህ ቤት
  rationale: የግሪኩን ዳቲቭ በተፈጥሯዊ አማርኛ «ለ» ይገልጣል፤ «ቤት» ሕንፃውንም ሆነ ቤተሰቡን ሊያመለክት የሚችለውን οἶκος በቅርብ ይከተላል።
- source_word: ἐγένετο
  choice: መጥቷል
  rationale: ከ«ድነት» ጋር ሲያያዝ ድነት እንደደረሰ በተፈጥሯዊ አማርኛ ይገልጣል፤ የተጠናቀቀውንና አሁን ውጤት ያለውን ክስተት ያሳያል።
- source_word: καθότι
  choice: ስለሆነ
  rationale: የኢየሱስን መግለጫ ምክንያት በግልጽ ያሳያል።
- source_word: καὶ αὐτὸς
  choice: እርሱም
  rationale: የመካተትን አጽንዖት—«እርሱ ደግሞ»—በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: υἱὸς Ἀβραάμ
  choice: የአብርሃም ልጅ
  rationale: የግሪኩን የዝምድናና የቃል ኪዳን መግለጫ ሳያጠብ ይጠብቃል፤ «ዘር» ብሎ በዘር ሐረግ ብቻ አይወስነውም።
theological_decisions:
- issue: «የአብርሃም ልጅ» የሚለው ትርጉም
  choice: ሐረጉ እንዳለ ተጠብቆ፣ የዘር ሐረግን፣ የቃል ኪዳን አባልነትን ወይም ሁለቱንም ብቻውን እንዲያመለክት አልተወሰነም።
  alternative: «የአብርሃም ዘር» ወይም «በእምነት የአብርሃም ቤተሰብ አባል»
  rationale: ጥቅሱ ራሱ ከእነዚህ አንዱን ብቻ አያስገድድም፤ የመጀመሪያውን ሐረግ መጠበቅ ሥነ መለኮታዊውን ውጥረትና አሻሚነት ያቆያል።
- issue: ድነት የመጣለት ወሰን
  choice: «ለዚህ ቤት» ተብሎ የοἶκος ስፋት ተጠብቋል።
  alternative: ድነቱን ለዘኬዎስ ግለሰብ ብቻ መወሰን ወይም ለቤተሰቡ ሁሉ እንደተረጋገጠ መግለጽ
  rationale: οἶκος ቤቱንም ሆነ ከቤቱ ጋር የተያያዘውን ቤተሰብ ሊያመለክት ይችላል፤ ጥቅሱ ወሰኑን ከዚህ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምክንያት አንቀጹ በአማርኛ ተፈጥሯዊ አወቃቀር ከዋናው አንቀጽ በፊት ቀርቧል፤ «ዛሬ» ግን በዋናው መግለጫ መጀመሪያ ላይ በመቀመጡ የግሪኩን አጽንዖት ይጠብቃል።
