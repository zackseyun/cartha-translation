  text: ሁለተኛውም መጥቶ፣ ‘ጌታ ሆይ፣ የእርስዎ ምና አምስት ምና አስገኝቷል’ አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ሁለተኛው
  rationale: በቅደም ተከተል ሁለተኛ የሆነውን አገልጋይ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ ንግግሩን የጥሪ ቅርጽ እና የአክብሮት ይዘት ይጠብቃል።
- source_word: Ἡ μνᾶ σου
  choice: የእርስዎ አንድ ምናን
  rationale: μνᾶ የጥንት ገንዘብ መለኪያ መሆኑን በብድር ቃሉ ይጠብቃል፤ አንድ የሚለው የነጠላውን ትርጉም ግልጽ ያደርጋል።
- source_word: ἐποίησεν πέντε μνᾶς
  choice: አምስት ምናን አተረፈ
  rationale: ቃል በቃል ‘አደረገ’ ከማለት ይልቅ በንግድ አውዱ የሚገባውን ‘አተረፈ’ በመጠቀም ገንዘቡ ትርፍ ማስገኘቱን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: κύριε በዚህ ምሳሌ ውስጥ ያለው አጠራር
  choice: ጌታ ሆይ
  alternative: ጌታዬ ሆይ
  rationale: ጽሑፉ በቀጥታ ለታላቁ ሰው የቀረበ የአክብሮት አጠራር ነው፤ ከዚህ በላይ የክርስቶሎጂ ትርጉም በቃሉ ላይ አይጫንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ምናን’ የጥንቱን የገንዘብ መለኪያ ስም ጠብቆ ያቀርባል።
