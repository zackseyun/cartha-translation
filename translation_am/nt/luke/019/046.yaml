- issue: λῃστῶν የሚለውን ቃል መተርጎም
  choice: ወንበዴዎች
  alternative: ዘራፊዎች
  rationale: ቃሉ ዘራፊዎችን ወይም በጉልበት የሚንቀሳቀሱ ወንበዴዎችን ሊያመለክት ይችላል። “ወንበዴዎች” የኤርምያስን የመደበቂያ ዋሻ ምስል ይጠብቃል፣ የፖለቲካ ዓመፀኝነትንም በግድ አያስገባም።
