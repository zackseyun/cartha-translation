  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ጌታ ሆይ» የሚለው አድራሻ እንደ ዐውዱ «ክቡር ጌታ ሆይ» ወይም «አለቃ ሆይ» ተብሎም ሊተረጎም ይችላል።
