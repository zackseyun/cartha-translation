  rationale: «ጌታ ሆይ» ዋናውን የቃሉን ፍቺና የሥልጣን ገጽታ ይጠብቃል። ነገር ግን ንግግሩ በምሳሌው ውስጥ ለባለሥልጣኑ የቀረበ የአክብሮት አድራሻ ሊሆን ስለሚችል፣ ግልጽ ክርስቶሳዊ ኑዛዜ መሆኑን አያስገድድም፤ አማራጩ በማስታወሻ ተጠቅሷል።
