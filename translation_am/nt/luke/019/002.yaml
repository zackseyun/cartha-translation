  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: am
  text: እነሆ፣ ዘኬዎስ የሚባል አንድ ሰው ነበር፤ እርሱም የቀረጥ ሰብሳቢዎች አለቃ ነበር፣ ሀብታምም ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የሉቃስን ትኩረት ሰጪ የትረካ ምልክትና ሕያውነት ለመጠበቅ ተተርጉሟል።
- source_word: ἀνὴρ
  choice: አንድ ሰው
  rationale: ቃሉ አንድን ወንድ ግለሰብ ያመለክታል፤ በአማርኛ በዚህ ዐውድ «አንድ ሰው» ተፈጥሯዊ ነው።
- source_word: ὀνόματι καλούμενος
  choice: ዘኬዎስ የሚባል
  rationale: የግሪኩን «በስም የሚጠራ» ፈሊጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Ζακχαῖος
  choice: ዘኬዎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ አጻጻፍ ነው።
- source_word: ἀρχιτελώνης
  choice: የቀረጥ ሰብሳቢዎች አለቃ
  rationale: ἀρχι- የሚያመለክተውን የሥልጣን ወይም የኃላፊነት ደረጃ በግልጽ አማርኛ ይጠብቃል።
- source_word: πλούσιος
  choice: ሀብታም
  rationale: የቃሉን የገንዘብና የንብረት ብዛት ትርጉም በቀጥታ ያስተላልፋል።
- source_word: αὐτὸς … αὐτὸς
  choice: እርሱም … ሀብታምም
  rationale: የተደገመውን የግሪክ ተውላጠ ስም አጽንዖት ሳያጋንን፣ በአማርኛ አያያዥ «ም» እና በተደገመው ግስ ተፈጥሯዊ ሁኔታ ያንጸባርቃል።
