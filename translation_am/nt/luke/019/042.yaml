source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: am
  text: እንዲህ እያለ፦ “በዚህ ቀን አንቺም እንኳ ወደ ሰላም የሚያደርሱትን ነገሮች ብታውቂ ኖሮ![a] አሁን ግን ከዓይኖችሽ ተሰውረዋል።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ቀን አንቺም እንኳ ወደ ሰላም የሚያደርሱትን ነገሮች ብታውቂ!” የግሪኩ አነጋገር የልቅሶና ያልተፈጸመ ምኞት ኃይል አለው።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ግስ በነጠላ ቁጥር ነው፤ ስለዚህ የቀደመውን ሐረግ በጥቅል በመውሰድ፣ “አሁን ግን ከዓይኖችሽ ተሰውሯል” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ እያለ
  rationale: የአሁን ጊዜውን ቦዝ አንቀጽ ከቀደመው ትረካ ጋር በተፈጥሮ ያያይዛል።
- source_word: Εἰ ἔγνως
  choice: ብታውቂ ኖሮ
  rationale: በልቅሶው አውድ ያልተፈጸመውን ሁኔታ እና ጸጸቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: በዚህ ቀን
  rationale: ጊዜን የሚገልጠውን ሐረግ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καὶ σὺ
  choice: አንቺም እንኳ
  rationale: ኢየሩሳሌም በአንስታይ ነጠላ ቅርጽ በቀጥታ ስለተጠራች፣ የግሪኩን አጽንዖትና የልቅሶ ስሜት ያስተላልፋል።
- source_word: τὰ πρὸς εἰρήνην
  choice: ወደ ሰላም የሚያደርሱትን ነገሮች
  rationale: ቃል በቃል ‘ወደ ሰላም ያሉትን’ የሚለውን ፈሊጣዊ ሐረግ፣ ሰላምን የሚመለከቱትን ወይም ወደ እሱ የሚመሩትን ነገሮች በግልጽ መንገድ ይገልጣል፤ የብዙ ቁጥር ኃይሉንም ይጠብቃል።
- source_word: εἰρήνην
  choice: ሰላም
  rationale: የግሪኩን ሰፊ የሰላምና የደኅንነት ትርጉም የሚሸከም መደበኛና ከአውዱ ጋር የሚስማማ ቃል ነው።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: ሊታወቅ በቻለውና አሁን በተሰወረው መካከል ያለውን ጠንካራ ንፅፅር ያሳያል።
- source_word: ἐκρύβη
  choice: ተሰውረዋል
  rationale: የተሰወሩትን ‘ወደ ሰላም የሚያደርሱት ነገሮች’ በብዙ ቁጥር በግልጽ ይመልሳል፣ የተግባሩንም ወቅታዊ ውጤት ያሳያል።
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: ከዓይኖችሽ
  rationale: የማየትና የመገንዘብ መጽሐፍ ቅዱሳዊ ምሳሌያዊ አነጋገርን በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የἐκρύβη የተገመተ ባለቤት
  choice: የተሰወሩት ‘ወደ ሰላም የሚያደርሱት ነገሮች’ ናቸው፤ በአማርኛ ብዙ ቁጥር ‘ተሰውረዋል’ ተብሏል።
  alternative: ነገሩን በጥቅል እንደ ነጠላ በመውሰድ ‘ተሰውሯል’ ማለት።
  rationale: የግሪኩ ግስ ነጠላ ቢሆንም፣ ግልጹና ቅርቡ የትርጉም ተመላሽ τὰ πρὸς εἰρήνην የተባለው ገለልተኛ ብዙ ቁጥር ሐረግ ነው። አማርኛው ብዙ ቁጥርን በመጠቀም ይህን ግንኙነት ግልጽ ያደርጋል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- issue: የሁኔታዊው ልቅሶ ኃይል
  choice: ‘ብታውቂ ኖሮ!’ ተብሎ የልቅሶውና ያልተፈጸመው ምኞት ኃይል ተገልጧል።
  alternative: ያለ አጽንዖት ‘ብታውቂ’ ብቻ ማለት።
  rationale: በግሪክ ግልጽ ‘ብቻ’ የሚል ቅንጣት ባይኖርም፣ ያልተሟላው ሁኔታዊ አነጋገርና የልቅሶው አውድ በአማርኛ ‘ኖሮ’ እና በአግባቡ በምልክተ አንክሮ ይተላለፋሉ፤ ተጨማሪ የትምህርት ትርጓሜ አልገባም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ኢየሩሳሌምን በአንስታይ ነጠላ ቅርጽ ‘አንቺ/ዓይኖችሽ’ በማለት የአውዱ ቀጥተኛ ንግግር ተጠብቋል። የግሪኩ ፈሊጥ በግልጽ አማርኛ ቀርቧል፣ እውነተኛው የነጠላና የብዙ ቁጥር አሻሚነትም በማስታወሻ ተጠብቋል።
