base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: am
  text: ምን እንደሚያደርጉ ማወቅ አልቻሉም፤ ሕዝቡ ሁሉ እርሱን በጉጉት እያዳመጠ ነበርና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሕዝቡ ሁሉ እያዳመጠ በእርሱ ላይ ተንጠልጥሎ ነበር።” የግሪኩ ፈሊጥ ኢየሱስን በከፍተኛ ጉጉትና ትኩረት ማዳመጣቸውን ይገልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: ማግኘት አልቻሉም
  rationale: የአለፈ ጊዜ ቀጣይ ግስ ከአሉታ ጋር የሚያሳየውን መፍትሔ ለማግኘት የቀጠለ አለመቻል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ τί ποιήσωσιν
  choice: ምን ሊያደርጉበት እንደሚችሉ
  rationale: ዐውደ ንባቡ በኢየሱስ ላይ ሊወስዱት ስለሚችሉት እርምጃ ነው፤ ይህ አተረጓጎም የምክክርና የዕድል ልዩነቱን ይጠብቃል።
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: ሕዝቡ ሁሉ ... ነበርና
  rationale: γάρ የምክንያት ግንኙነቱን በአማርኛው ‘ነበርና’ ያሳያል፤ ἅπας ደግሞ ‘ሁሉ’ ተብሎ ሙሉነቱን ይጠብቃል።
- source_word: ἐξεκρέματο αὐτοῦ
  choice: በትኩረት ተከታትለውት ነበር
  rationale: በአንድ ሰው ላይ ‘መንጠልጠል’ የሚለውን የግሪክ ፈሊጥ በቃል ከመተርጎም ይልቅ፣ በከፍተኛ ጉጉትና ትኩረት መከታተል የሚለውን ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል፤ αὐτοῦ የሚያመለክተውም እርሱን ነው።
- source_word: ἀκούων
  choice: እያዳመጡት
  rationale: የመስማቱ ድርጊት ከጉጉት ጋር በአንድ ጊዜ መከናወኑን ያሳያል፤ የግሪኩ ነጠላ የስብስብ ስም በተፈጥሯዊ አማርኛ በብዙ ቁጥር ተስማምቷል።
