  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: am
  text: እላችኋለሁ፤ ላለው ሁሉ ተጨማሪ ይሰጠዋል፤[a] ከሌለው ሰው ግን ያለው ነገር እንኳ ይወሰድበታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በቀጥታ፣ “ይሰጠዋል።” በግሪክኛው “ተጨማሪ” የሚለው ቃል በግልጽ አልተጻፈም፤ በአውዱ ግን የመጨመር ሐሳብ እንዳለ በሰፊው ይገነዘባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: በቀጥታ ንግግር ውስጥ አጽንዖት ያለውን ‘እላችኋለሁ’ የሚለውን መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: παντὶ τῷ ἔχοντι
  choice: ላለው ሁሉ
  rationale: በጽሑፉ ያለውን አጠቃላይና ስም ሆኖ የሚሠራውን ቦዝ አንቀጽ፣ ‘ላለው ለእያንዳንዱ’ የሚለውን ሐሳብ፣ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: δοθήσεται
  choice: ተጨማሪ ይሰጠዋል
  rationale: የግሪኩ ቀጥተኛ ትርጉም ‘ይሰጠዋል’ ቢሆንም፣ በአውዱ የተገነዘበውን መጨመር ‘ተጨማሪ’ በማለት ግልጽ ያደርጋል፤ የግሪኩ አጭር አገላለጽም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: ከሌለው ግን
  rationale: አሉታዊውን ስማዊ ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ δέ ያለውን ተቃርኖ ‘ግን’ ይገልጣል።
- source_word: καὶ ὃ ἔχει
  choice: ያለው እንኳ
  rationale: καί በዚህ አውድ የማጠናከር ኃይል ስላለው ‘እንኳ’ ተብሎ ተተርጉሟል፤ የግለሰቡን አሁን ያለውን ነገር ይጠቅሳል።
- source_word: ἀρθήσεται
  choice: ይወሰድበታል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና የመነጠቅ/የመወገድ ትርጉሙን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ንግግሩ ስለ መጨመርና ማጣት የሚገልጸው መርሕ ያለው የትርጓሜ ክልል
  choice: ንግግሩን በአጭርና ቀጥተኛ መልኩ ማቅረብ፣ ስለ ድነት፣ ብቃት ወይም አስቀድሞ መወሰን የሚናገር ሥርዓተ እምነታዊ ማብራሪያ በትርጉሙ ውስጥ አለማስገባት
  alternative: እንደ ምሳሌው አውድ ስለ አደራ አጠባበቅ ብቻ መወሰን፣ ወይም እንደ ሰፊ የመንግሥቱ መርሕ በግልጽ መተርጎም
  rationale: ቁጥሩ ሥርዓተ እምነታዊ አሠራሩን አይገልጽም። ስለዚህ የአውዱንና የሥነ መለኮት አተገባበሩን ለትርጓሜ በመተው የንግግሩ ጥብቅነትና ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ላለው ሁሉ’ እና ‘ከሌለው’ የተባሉት አጭር አገላለጾች የምንጩን ምሳሌያዊ ጥብቅነት ይጠብቃሉ።
