- source_word: δοῦλε
  choice: አገልጋይ
  rationale: በዚህ ምሳሌያዊ አውድ የጌታና የበታች ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል፤ “ባሪያ” የሚለው የቃሉ ሌላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἐν ἐλαχίστῳ
