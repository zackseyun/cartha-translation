  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: am
  text: 'እርሱም፣ “ጎበዝ! መልካም አገልጋይ ሆይ፣ በእጅግ ትንሽ ነገር ታማኝ ስለሆንህ፣ በአሥር ከተሞች ላይ ሥልጣን ይኑርህ” አለው።


    [a] ወይም፣ “ባሪያ።” የግሪኩ δοῦλος (ዱሎስ) የሚለው ቃል እንደ አውዱ “አገልጋይ” ወይም “ባሪያ” ማለት ሊሆን ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባሪያ።” የግሪኩ δοῦλος (ዱሎስ) የሚለው ቃል እንደ አውዱ “አገልጋይ” ወይም “ባሪያ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
