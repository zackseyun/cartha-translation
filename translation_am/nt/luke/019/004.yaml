    text: ይበልጥ ትክክለኛ ትርጉሙ፣ “የሾላ በለስ ዛፍ” ሊባል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν … εἰς τὸ ἔμπροσθεν
  choice: ወደ ፊት ሮጦ
  rationale: የመሮጥንም ሆነ ከፊት ለመቅደም የተደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀνέβη ἐπὶ
  choice: ወደ … ዛፍ ላይ ወጣ
  rationale: ዛፍ ላይ የመውጣትን ተግባር በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: συκομορέαν
  choice: የሾላ ዛፍ
  rationale: በዐውደ ንባቡ የሚያመለክተውን Ficus sycomorus ለዘመናዊ አማርኛ አንባቢ በሚታወቅ ስም ይገልጻል፤ የዕፅዋት ዓይነቱን ይበልጥ ትክክለኛ የሚያደርገው መጠሪያ በማስታወሻ ተጠብቋል።
- source_word: ἵνα ἴδῃ αὐτόν
  choice: እርሱን ለማየት
  rationale: የἵνα ዓላማ አመልካች ኃይልን በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ዛፉ ላይ የወጣበትን ምክንያት በግልጽ ያስተዋውቃል።
- source_word: ἐκείνης
  choice: በዚያ
  rationale: በግሪኩ ያልተገለጸን ‘መንገድ’ ወይም ‘ጎዳና’ ሳይጨምር፣ በዚያ ስፍራ ወይም አቅጣጫ የማለፍን ሐሳብ ይጠብቃል።
- source_word: ἤμελλεν διέρχεσθαι
  choice: ሊያልፍ ነበር
  rationale: በቅርብ ጊዜ የሚፈጸመውን ወይም የታሰበውን ማለፍ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በመጨረሻው ንዑስ ሐረግ የተሰወረው ባለቤት
  choice: ኢየሱስ
  alternative: እርሱ
  rationale: በአማርኛ ‘እርሱ’ ቢባል ዘኬዎስን እንደሚያመለክት ሊያሳስት ይችላል፤ በዐውደ ንባቡ የሚያልፈው ኢየሱስ መሆኑ ግልጽ ስለሆነ ስሙ ተገልጿል።
