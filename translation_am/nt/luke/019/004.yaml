  verdict: revise
  source_fidelity: The draft accurately conveys the running ahead, climbing, purpose of seeing Jesus, and the impending passing. However, ስለዚህ (‘therefore/so’) introduces an inferential relationship not expressed by the Greek καί (‘and’).
  naturalness: 'The phrase ወደ አንድ የሾላ ዛፍ ላይ is not idiomatic Amharic: ዛፍ ላይ requires በ, not ወደ. The revised wording is fluent modern standard Amharic.'
  terminology: የሾላ ዛፍ is a suitable familiar rendering of συκομορέα. The footnote appropriately preserves the more botanically specific ‘sycamore-fig tree’ sense.
  issues:
  - severity: medium
    issue: Unwarranted connective ስለዚህ
    rationale: The Greek begins with καί, a simple narrative connector. ስለዚህ adds a consequential/inferential sense (‘therefore’) not supplied by the source.
  - severity: medium
    issue: Incorrect locative construction with the tree
    rationale: ወደ … ዛፍ ላይ combines the directional preposition ወደ with ላይ in a nonstandard way. For climbing a tree, በአንድ … ዛፍ ላይ ወጣ is natural and precise.
  revised_text: እርሱም ወደ ፊት ሮጦ ሄደ፤ እርሱን ለማየትም በአንድ የሾላ ዛፍ[a] ላይ ወጣ፤ ምክንያቱም ኢየሱስ በዚያ ሊያልፍ ነበር።
