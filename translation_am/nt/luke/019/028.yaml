  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: am
  text: እነዚህን ከተናገረ በኋላ፣ ከዚያም ወደ ኢየሩሳሌም እየወጣ ወደፊት ቀጠለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ተራኪ አያያዥ በተፈጥሯዊ የአማርኛ ቅጥያ ይገልጣል፤ የክስተቶቹን ቅደም ተከተል ያስቀጥላል።
- source_word: εἰπὼν ταῦτα
  choice: እነዚህን ከተናገረ በኋላ
  rationale: የአኦሪስት አሳታፊው ድርጊት ከዋናው ግስ በፊት መፈጸሙን ያሳያል፤ ταῦτα ወደ ቀደመው ንግግር በሰፊው ይመለሳል።
- source_word: ἐπορεύετο
  choice: ጉዞውን ቀጠለ
  rationale: ኢምፐርፌክት ግሱ በትረካው ውስጥ የቀጠለ እንቅስቃሴን ይገልጣል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἔμπροσθεν
  choice: ከፊት ሆኖ
  rationale: ኢየሱስ ከተከታዮቹ ቀድሞ መጓዙን ያሳያል፤ በጽሑፉ ያልተጠቀሰውን ‘እነርሱን’ በግልጽ አይጨምርም።
- source_word: ἀναβαίνων
  choice: እየወጣ
  rationale: ከዋናው ግስ ጋር አብሮ የሚከናወነውን ድርጊት ይጠብቃል፤ ወደ ኢየሩሳሌም የመውጣትን ጂኦግራፊያዊና ትረካዊ ቋንቋ አያጠፋም።
- source_word: εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς እዚህ መድረሻን ወይም አቅጣጫን ያመለክታል፤ ‘ወደ’ ገና ወደ ከተማይቱ መግባቱን ሳያስገድድ ይህን ትርጉም ያቀርባል።
theological_decisions:
- issue: ወደ ኢየሩሳሌም የመውጣት ቋንቋን መጠበቅ
  choice: ἀναβαίνωνን ‘እየወጣ’ ብሎ በግልጽ መተርጎም
  alternative: ‘ወደ ኢየሩሳሌም እየተጓዘ’ ወይም ‘ወደ ኢየሩሳሌም ሲሄድ’
  rationale: የሉቃስ ጽሑፍ የመውጣትን ቃል ሆን ብሎ ይጠቀማል። ይህ በመልክዓ ምድር አንጻር ተፈጥሯዊ ሲሆን በትረካውም የኢየሱስን ወደ ከተማይቱ መቅረብ ያጎላል፤ ተጨማሪ ትርጓሜ ሳይጫን የምንጩን ሸካራነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጉዞውን ቀጠለ’ የግሪኩን ኢምፐርፌክት ተፈጥሯዊ በሆነ አገላለጽ ያሳያል፤ ‘እየወጣ’ ደግሞ የምንጩን የዕርገት ቋንቋ ይጠብቃል።
