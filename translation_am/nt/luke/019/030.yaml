id: LUK.19.30
reference: Luke 19:30
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: am
  text: እንዲህ አለ፦ “በፊታችሁ ወዳለው መንደር ሂዱ። ወደዚያም ስትገቡ፣ ማንም ሰው ከቶ ያልተቀመጠበት የታሰረ ውርንጫ ታገኛላችሁ። ፈትታችሁ አምጡት።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν κατέναντι κώμην
  choice: በፊታችሁ ወዳለው መንደር
  rationale: κατέναντι የፊት ለፊትነትን ወይም በተቃራኒ በኩል መኖርን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የቦታውን ግንኙነት ይጠብቃል።
- source_word: πῶλον
  choice: ውርንጫ
  rationale: ቃሉ ወጣት የጋማ እንስሳን ያመለክታል፤ በዚህ ዐውድ የአህያ ግልገል መሆኑ ቢገባም፣ ሉቃስ በቁጥሩ ውስጥ የእንስሳውን ዓይነት በግልጽ ስላልጠቀሰ ሰፋ ያለው “ውርንጫ” ተመርጧል።
- source_word: δεδεμένον
  choice: የታሰረ
  rationale: የδέω ፍጹም ተገብሮ አካል ሲሆን፣ እንስሳው ታስሮ ባለበት ሁኔታ መገኘቱን በቀጥታ ያሳያል።
- source_word: ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: ማንም ሰው ከቶ ያልተቀመጠበት
  rationale: οὐδεὶς πώποτε ἀνθρώπων ያለውን ፍጹም አሉታዊ አጽንዖት “ማንም ሰው ከቶ” በማለት ይጠብቃል፤ “ተቀመጠበት” ደግሞ በእንስሳው ላይ መቀመጥን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λύσαντες αὐτὸν ἀγάγετε
  choice: ፈትታችሁ አምጡት
  rationale: የቅድሚያ ድርጊቱንና ዋናውን ትእዛዝ በተከታታይ የሚያሳይ ቀላልና ትክክለኛ አተረጓጎም ነው።
theological_decisions:
- issue: የπῶλον የእንስሳ ዓይነት
  choice: ውርንጫ
  alternative: የአህያ ውርንጫ
  rationale: በቅርብ ዐውድና በትይዩ ወንጌላት የአህያ ግልገል መሆኑ ቢታወቅም፣ የዚህ ቁጥር ግሪክ ጽሑፍ ἄνοςን አይጨምርም። ስለዚህ ጽሑፉ ያልገለጸውን በትርጉሙ ውስጥ በግድ አልተወሰነም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። የብዙ ቁጥር አክብሮታዊ አነጋገር ሳይሆን፣ ኢየሱስ ለሁለቱ ደቀ መዛሙርት የሚሰጠው ትእዛዝ በብዙ ቁጥር ቅርጽ ተጠብቋል።
