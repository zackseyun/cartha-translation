- source_word: οἱ ἀπεσταλμένοι
  choice: የተላኩት
  rationale: የተወሰነው ፍጹም ተደራጊ አጋዥ ግስ እንደ ስም ሠርቷል፤ «የተላኩት» ተደራጊነቱን ይጠብቃል፣ «መልእክተኞቹ» የሚለውንም ተጨማሪ ትርጓሜ አያስገባም።
- source_word: εὗρον
  choice: አገኙት
  rationale: ግሱ «አገኙ» ማለት ነው። በአማርኛው «-ት» ከዐውዱ የሚታወቀውን ውርንጭላ እንደ ተሳቢ ያመለክታል፤ በግሪኩ ግን ተሳቢው በግልጽ አልተጠቀሰም፣ ስለዚህ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: καθὼς
  choice: እንደ... ሆኖ
