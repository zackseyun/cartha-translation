lexical_decisions:
- source_word: ἀπελθόντες
  choice: ሄደው
  rationale: የἀπέρχομαι የአኦሪስት አጋዥ ግስ ሲሆን ከቦታው ተነሥቶ መሄድን ያመለክታል፤ «ሄደው» በአማርኛ ተፈጥሯዊና ከዋናው ግስ ጋር በትክክል የሚያያዝ ነው።
