- source_word: εἶπεν αὐτοῖς
  choice: እርሱ እንደነገራቸው
  rationale: λέγω እዚህ ቀድሞ የተሰጠውን መመሪያ ያመለክታል፤ «ነገራቸው» ከ«አላቸው» ይልቅ በዐውዱ ተፈጥሯዊ ነው። «እርሱ» የግሱን ባለቤት ግልጽ ያደርጋል።
