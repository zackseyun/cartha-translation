reference: Luke 19:40
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: am
  text: እርሱም መልሶ፣ “እላችኋለሁ፤ እነዚህ ዝም ቢሉ፣ ድንጋዮቹ ይጮኻሉ” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የግሪኩን ተሳቢ ግስ የመመለስ ትርጉም ይጠብቃል፤ ከዋናው ‘አለ’ ጋርም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: εἶπεν
  choice: አለ
  rationale: ዋናውን የንግግር ግስ በቀላልና ተፈጥሯዊ አማርኛ ያቀርባል፤ የመመለስ ሐሳብ አስቀድሞ ‘መልሶ’ በሚለው ተጠብቋል።
- source_word: Λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: በወንጌላት የሚገኘውን ቀጥተኛና አጽንዖታዊ የንግግር ቀመር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ὅτι
  choice: በአማርኛ ለየት ብሎ አልተተረጎመም
  rationale: የንግግሩን ይዘት ከሚያስገባው ὅτι ቀጥሎ ሁኔታዊ አረፍተ ነገር ስለሚመጣ፣ ‘ቢሉ’ የሚለው አወቃቀር ግንኙነቱን በቂ ሁኔታ ያሳያል።
- source_word: οὗτοι
  choice: እነዚህ
  rationale: በዐውዱ ያሉትን ሰዎች በቀጥታ ያመለክታል፤ ‘ሰዎች’ ብሎ የማይገኝ ማብራሪያ አይጨምርም።
- source_word: σιωπήσουσιν
  choice: ዝም ቢሉ
  rationale: አሁን እያመሰገኑ ያሉት ቢቆሙ የሚለውን ሁኔታዊ ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ λίθοι
  choice: ድንጋዮቹ
  rationale: የግሪኩን የተወሰነ አመልካችነትና የምስሉን ተጨባጭነት ይጠብቃል።
- source_word: κράξουσιν
  choice: ይጮኻሉ
  rationale: κράζω የሚያመለክተውን ከፍ ያለ ጩኸት በአጭርና ኃይለኛ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ድንጋዮቹ መጮኻቸው ቃል በቃል፣ ትንቢታዊ ምስል ወይም አጋኖ መሆኑ
  choice: ‘ድንጋዮቹ ይጮኻሉ’ የሚለውን ግልጽ ምስል ያለ ትርጓሜ መጠበቅ
  alternative: ‘ፍጥረት ራሱ ያመሰግናል’ ወይም ‘ድንጋዮቹ ይመሰክራሉ’ ብሎ መተርጎም
  rationale: የግሪኩ ጽሑፍ ምስሉን ሳያብራራ ያቀርባል፤ ቃል በቃል ማቆየቱ አጋኖ፣ ትንቢታዊ ምስል ወይም ተአምራዊ ክስተት መሆኑን በትርጉሙ ውስጥ አስቀድሞ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መልሶ … አለ’ የግሪኩን ተሳቢና ዋና ግስ ይጠብቃል፤ የሁኔታው ግስ ‘ዝም ቢሉ’ በአማርኛ ተፈጥሯዊ ስለሆነ የእንግሊዝኛው ማስታወሻ ወደ ረቂቁ አልተዘዋወረም።
