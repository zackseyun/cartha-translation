lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: እርሱም እየሄደ ሳለ
  rationale: የግሪኩ ገላጭ የተውሳከ ግስ ከዋናው ድርጊት ጋር በአንድ ጊዜ የሚከናወን እንቅስቃሴን ያሳያል፤ ይህ አተረጓጎም የጊዜውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δέ
  choice: -ም
  rationale: δέ እዚህ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ“እርሱ” ጋር የተያያዘው “-ም” ይህን ፍሰት ያለ ከባድ ንጽጽር ያስተላልፋል።
- source_word: ὑπεστρώννυον
  choice: ያነጥፉ ነበር
  rationale: የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ ቅርጽ በሂደት ላይ የነበረውን ወይም የተደጋገመውን ድርጊት ያሳያል፤ “ያነጥፉ ነበር” ይህን ገጽታ ይጠብቃል።
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: ልብሳቸውን
  rationale: ἱμάτια በአጠቃላይ ልብሶችን፣ ብዙ ጊዜም መደረቢያ ልብሶችን ሊያመለክት ይችላል። “ልብሳቸውን” ሰፊውን የቃሉን ትርጉም ይጠብቃል፤ የመደረቢያነቱ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ ላይ
  rationale: ሐረጉ የልብሶቹን መገኛ ያመለክታል፤ “በመንገድ ላይ” የቦታውን ትርጉም በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
