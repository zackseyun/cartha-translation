lexical_decisions:
- source_word: εἰσελθὼν
  choice: ገብቶ
  rationale: የግሪክኛው ያለፈ ጊዜ አጋዥ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ «ገብቶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἱερὸν
  choice: ቤተ መቅደሱ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን አጠቃላይ የቤተ መቅደሱን ግቢና ሕንፃዎች ያመለክታል። «ቤተ መቅደስ» በዋናው ጽሑፍ የተለመደና አጭር ሲሆን ስፋቱ በማስታወሻ ተገልጧል።
- source_word: ἤρξατο
  choice: ጀመረ
  rationale: ከቀጣዩ የግስ ስም ጋር የድርጊቱን መጀመር በቀጥታ ያሳያል።
- source_word: ἐκβάλλειν
  choice: ማስወጣት
  rationale: ቃሉ በኃይልና በቁርጠኝነት ከቦታ ማስወገድን ያመለክታል፤ «ማስወጣት» ተፈጥሯዊና ግልጽ ነው።
- source_word: πωλοῦντας
  choice: የሚሸጡትን
  rationale: የአሁን ጊዜው አጋዥ ግስ በመሸጥ ሥራ ላይ የነበሩትን ሰዎች ያመለክታል፤ ጥቅሱ የሚሸጠውን ነገር ስለማይጠቅስ ትርጉሙም አልጨመረውም።
theological_decisions:
- issue: በኢየሱስ የቤተ መቅደስ ድርጊት ውስጥ የἱερόν የቦታ ስፋት
  choice: በዋናው ጽሑፍ «ቤተ መቅደሱ» ተብሎ ተተርጉሟል፤ ቃሉ አጠቃላይ የቤተ መቅደሱን ግቢ ያካትታል።
  alternative: «የቤተ መቅደሱ ግቢ» ወይም «የቤተ መቅደሱ ክልል»፤ «ውስጠኛው መቅደስ» ግን ከግሪክኛው ይልቅ ጠባብ ነው።
  rationale: ἱερόν በተለምዶ ሰፊውን የቤተ መቅደስ ስፍራ ያመለክታል፤ ከውስጠኛው መቅደስ ብቻ ጋር ማያያዝ የቦታውን ስፋት ያጠባል። ዋናው ትርጉም ተነባቢነትን ሲጠብቅ ማስታወሻው የቃሉን ትክክለኛ ወሰን ያሳያል።
