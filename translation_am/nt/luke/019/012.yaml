  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: am
  text: ስለዚህ እንዲህ አለ፦ “ከክቡር ቤተሰብ የተወለደ አንድ ሰው ለራሱ መንግሥትን[a] ለመቀበልና ለመመለስ ወደ ሩቅ አገር ሄደ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ንግሥናን” ወይም “ንጉሣዊ ሥልጣንን።” የግሪኩ βασιλείαν የመንግሥትን ግዛት ወይም የንጉሥነትን አገዛዝና ሥልጣን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ንግግር ከምሳሌው ጋር የሚያገናኘውን የድምዳሜና የትረካ ቅደም ተከተል ኃይል ያስቀምጣል።
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: ከከበረ ቤተሰብ የተወለደ አንድ ሰው
  rationale: τις የሚያመለክተውን ያልተወሰነ ሰው እና εὐγενής የሚያመለክተውን የከበረ የትውልድ ደረጃ በግልጽና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπορεύθη
  choice: ሄደ
  rationale: ቀላሉንና ቀጥተኛውን የመንቀሳቀስ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς χώραν μακρὰν
  choice: ወደ ሩቅ አገር
  rationale: መድረሻውንና የቦታውን ርቀት በግልጽ ያስቀምጣል።
- source_word: λαβεῖν ἑαυτῷ
  choice: ለራሱ … ተቀብሎ
  rationale: በፖለቲካዊው አውድ ሥልጣኑን መቀበል እንጂ በኃይል መውሰድ እንዳልሆነ ያሳያል፤ ἑαυτῷ የሚገልጠውንም የራስ ጥቅም ያቆያል።
- source_word: βασιλείαν
  choice: መንግሥትን
  rationale: ቃሉ መንግሥትን፣ ንግሥናን ወይም ንጉሣዊ ሥልጣንን ሊያመለክት ይችላል፤ ‘መንግሥትን መቀበል’ በዚህ የፖለቲካ ምስል ውስጥ ተፈጥሯዊ ሲሆን ሌሎቹ ፍቺዎች በማስታወሻ ተጠብቀዋል።
- source_word: ὑποστρέψαι
  choice: ለመመለስ
  rationale: ከመንግሥቱ መቀበል በኋላ የሚከተለውን ወደ መነሻው የመመለስ እርምጃ በአጭር ይገልጣል።
theological_decisions:
- issue: በፖለቲካዊ ፍንጭ ባለው ምሳሌ ውስጥ βασιλείαν ያለው ሰፊ የትርጉም ክልል
  choice: መንግሥትን
  alternative: ንግሥናን፤ ንጉሣዊ ሥልጣንን
  rationale: ግሪኩ ቃል የሚገዛውን ግዛትም ሆነ የመግዛት ሥልጣንን ሊገልጥ ይችላል። ዋናው ጽሑፍ የተለመደውንና ተፈጥሯዊውን ‘መንግሥት’ ይጠቀማል፤ የሥልጣን ፍቺው ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። ‘ከከበረ ቤተሰብ የተወለደ’ የሚለው εὐγενήςን ከዘመናዊ የሹመት ማዕረግ ይልቅ እንደ ከፍ ያለ የትውልድ ደረጃ ያቀርባል።
