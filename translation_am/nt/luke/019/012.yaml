    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s two coordinated purposes—receiving a kingdom/royal authority for himself and returning—without adding a temporal relation. It also makes the expression for noble birth more idiomatic in modern standard Amharic. The lexical ambiguity of βασιλείαν remains explicitly retained in the footnote.
