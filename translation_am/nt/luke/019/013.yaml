  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: am
  text: የራሱን አሥር ባሪያዎች[a] ጠርቶ አሥር ምና[b] ሰጣቸው፤ “እስክመጣ ድረስ ንግድ ሥሩ[c]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አገልጋዮች።” የግሪክኛው δοῦλος እንደ አውዱ ባሪያን ወይም አገልጋይን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ምና የጥንት የገንዘብ አሃድ ነበር።
    reason: cultural_note
  - marker: c
    text: ወይም “ነግዱ” ወይም “የንግድ ሥራ አካሂዱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: ጠርቶ
  rationale: የግሪክኛው የአኦሪስት አንቀጽ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ “ጠርቶ” ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δούλους ἑαυτοῦ
  choice: ከራሱ ባሪያዎች
  rationale: δοῦλος እንደ አውዱ አገልጋይን ወይም ባሪያን ሊያመለክት ይችላል፤ ἑαυτοῦ ደግሞ የግል ባለቤትነትን ያጎላል። በዚህ የጌታና የባሪያ ማኅበራዊ አውድ “ከራሱ ባሪያዎች” የጽሑፉን ኃይል ይጠብቃል።
- source_word: δέκα μνᾶς
  choice: አሥር ምናን
  rationale: μνᾶ የጥንት የገንዘብ መለኪያ ነው፤ “ምና” በድምፅ ተቀራራቢ ስምን በመጠቀም በዘመናዊ ገንዘብ ጋር የሚፈጠር የተሳሳተ እኩልነትን ያስወግዳል።
- source_word: Πραγματεύσασθε
  choice: በዚህ ነግዱ
  rationale: ትእዛዙ በተሰጣቸው ገንዘብ የንግድ ሥራ እንዲሠሩ ያዛል። “ነግዱ” ግልጽና ተፈጥሯዊ ሲሆን “በዚህ” የተሰጣቸውን ገንዘብ ያመለክታል።
- source_word: ἐν ᾧ ἔρχομαι
  choice: እስክመጣ ድረስ
  rationale: የግሪክኛው አገላለጽ የጊዜ ወሰንን፣ ማለትም እርሱ እስኪመጣ ድረስ፣ ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በጌታና በባሪያ ምሳሌያዊ አውድ δοῦλοςን መተርጎም
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: ἑαυτοῦ የሚያጎላው የባለቤትነት ግንኙነትና የምሳሌው የጌታ-ባሪያ መዋቅር “ባሪያዎች”ን ይደግፋሉ። የቃሉ ሰፊ የትርጉም ክልል ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ከራሱ ባሪያዎች አሥሩን” የሚለው አገላለጽ አሥሩ ከትልቅ ቡድን የተመረጡ መሆናቸውን ሳይገድብ፣ የግሪክኛውን “አሥር የራሱ ባሪያዎች” ተፈጥሯዊ አድርጎ ያቀርባል።
