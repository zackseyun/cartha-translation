  source_fidelity: The draft preserves the principal sequence and sense, but ከዚያም adds a temporal transition not expressed by δέ, and ከራሱ ባሪያዎች አሥሩን can suggest that ten were selected from a larger group. The Greek directly identifies ten of his own slaves. The revised wording retains the total of ten minas and the imperative to conduct business until his coming.
  naturalness: 'The revision uses idiomatic modern standard Amharic: የራሱን አሥር ባሪያዎች is clearer and more natural, and ንግድ ሥሩ is a direct, broad rendering of Πραγματεύσασθε without an unnecessarily vague demonstrative.'
  terminology: ባሪያዎች appropriately represents δοῦλοι in this master-slave parable while the alternative አገልጋዮች is retained in a note. ምና is retained as a historically specific monetary-unit name; the note is adjusted to call it a monetary unit rather than a measure.
