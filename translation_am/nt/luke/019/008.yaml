  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: am
  text: ዘኬዎስ ግን ቆሞ ጌታን እንዲህ አለው፤ “እነሆ፣ ጌታ ሆይ፣ ከንብረቴ ግማሹን ለድሆች እሰጣለሁ፤ ከማንም ምንም ነገር በግፍ ወስጄ ከሆነም፣[a] አራት ዕጥፍ እመልሳለሁ።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከማንም ምንም ነገር በማታለል ወስጄ ከሆነ።” የግሪኩ ግስ በግፍ መውሰድን፣ መበዝበዝን ወይም ማታለልን ሊያመለክት ይችላል፤ አንዳንድ ጊዜም በሐሰት ክስ ከሚፈጸም በደል ጋር ይያያዛል።
    reason: lexical_alternative
  - marker: b
    text: “እሰጣለሁ” እና “እመልሳለሁ” የሚሉት የግሪክ የአሁን ጊዜ ግሶች አሁን የሚደረግን ልማድ ወይም ወዲያውኑ የሚፈጸም ውሳኔን ሊገልጹ ይችላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: ቆሞ
  rationale: የግሪኩን ተራኪያዊ ድርጊት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ተነሣ ወይም ቆም አለ የሚል ተጨማሪ ትርጉም አያስገባም።
- source_word: κύριον / κύριε
  choice: ጌታውን / ጌታ ሆይ
  rationale: በትረካው ውስጥ ለኢየሱስ የተሰጠውን የክብር መጠሪያ ይጠብቃል፤ የቀጥታ ንግግሩም ተፈጥሯዊ የአማርኛ አድራሻ ቅርጽ ይጠቀማል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ተናጋሪው ትኩረት እንዲሰጠው የሚያደርገውን አጽንዖት በክቡርና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ያቀርባል።
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: ከንብረቴ ግማሹን
  rationale: የከፊልነቱን ግንኙነትና ὑπάρχοντα የሚያመለክተውን ሀብት ወይም ንብረት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τοῖς πτωχοῖς
  choice: ለድሆች
  rationale: ማኅበራዊና ኢኮኖሚያዊ ድህነትን በቀጥታ የሚያመለክት ግልጽ አገላለጽ ነው።
- source_word: δίδωμι
  choice: እሰጣለሁ
  rationale: የአማርኛው ያልተፈጸመ ግስ አሁናዊ ልማድንም ሆነ ቅርብ ውሳኔን ሊገልጽ ስለሚችል የግሪኩን የአሁን ጊዜ ቅርጽና አሻሚነት ይጠብቃል።
- source_word: ἐσυκοφάντησα
  choice: በግፍ ወስጄ
  rationale: በሥልጣን ወይም በጫና የሚፈጸም መበዝበዝን በተረዳ አማርኛ ይገልጻል፤ ማታለልና የሐሰት ክስ የሚሉት የቃሉ ሌሎች ገጽታዎች በማስታወሻው ተጠብቀዋል።
- source_word: ἀποδίδωμι
  choice: እመልሳለሁ
  rationale: የተወሰደን ነገር መልሶ መክፈልን በአጭርና ግልጽ አማርኛ ያስተላልፋል።
- source_word: τετραπλοῦν
  choice: አራት እጥፍ
  rationale: የአራት ዕጥፍ ካሳ ወይም መመለስ ትክክለኛ መጠንን ይጠብቃል።
theological_decisions:
- issue: የδίδωμι እና ἀποδίδωμι የአሁን ጊዜ ግሶች ኃይል
  choice: “እሰጣለሁ … እመልሳለሁ” በሚል አሻሚነቱን የሚጠብቅ ያልተፈጸመ ቅርጽ
