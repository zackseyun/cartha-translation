  rationale: ግሪኩ የአሁን ጊዜ አመልካች ቅርጽ ይጠቀማል። ዋናው ጽሑፍ ዘኬዎስ የነበረውን ልማድ እየገለጸ እንደሆነ ወይም አዲስና ፈጣን ውሳኔ እያወጀ እንደሆነ አይወስንም፤ ይህም ከንስሐና ከቀድሞ ጽድቅ ጋር የተያያዘውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
