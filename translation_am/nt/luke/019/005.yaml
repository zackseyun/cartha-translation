  source_fidelity: The draft accurately renders the arrival, Jesus looking upward, the direct address, the urgent command, and the necessity expressed by δεῖ. However, it omits the explicit causal force of γάρ in σήμερον γὰρ. This should be represented in the main text.
  naturalness: The Amharic is clear and suitably modern. Adding “ምክንያቱም” produces a natural and explicit connection between the command and Jesus’s stated necessity.
  terminology: “ኢየሱስ,” “ዘኬዎስ,” “በቤትህ,” and “አለብኝ” are appropriate. “አለብኝ” preserves the force of δεῖ without defining the source of the necessity. Footnote a is retained at “በቤትህ,” the expression to which its lexical alternative pertains.
  issues:
  - severity: medium
    issue: The causal particle γάρ is not translated.
    rationale: σήμερον γὰρ introduces the reason Zacchaeus is to come down quickly. The draft’s juxtaposition implies a connection but does not explicitly preserve the Greek causal marker, unlike the optimal-equivalence audit trail’s “because today.”
  - severity: low
    issue: Footnote a’s household alternative can be stated more precisely.
    rationale: οἶκος can include a household, but “በቤተሰብህ ዘንድ” is less directly parallel to “ἐν τῷ οἴκῳ σου” than an alternative referring to the household/home. A refined note preserves the lexical range without suggesting a different location.
