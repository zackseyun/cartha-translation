base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: am
  text: ኢየሱስም ወደዚያ ቦታ በደረሰ ጊዜ፣ ወደ ላይ አይቶ፣ “ዘኬዎስ ሆይ፣ ፈጥነህ ውረድ፤ ምክንያቱም ዛሬ በቤትህ[a] መቆየት አለብኝ[b]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በቤትህ” የሚለው ቃል “በመኖሪያህ” ወይም “በቤተሰብህ ዘንድ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “አለብኝ” የተባለው የግሪክ ቃል (δεῖ) ከኢየሱስ ተልእኮ ወይም ከመለኮታዊ ዓላማ ጋር የተያያዘ አስፈላጊነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: በደረሰ ጊዜ
  rationale: በትረካው ውስጥ የጊዜ ተከታታይነትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπὶ τὸν τόπον
  choice: ወደዚያ ቦታ
  rationale: የግሪኩን የስፍራ አመልካች ፍቺ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἀναβλέψας
  choice: ወደ ላይ አይቶ
  rationale: ኢየሱስ በዛፉ ላይ ያለውን ዘኬዎስን ለማየት ዓይኑን ወደ ላይ ማንሳቱን በትክክል ያሳያል።
- source_word: Ζακχαῖε
  choice: ዘኬዎስ ሆይ
  rationale: ስሙን በተለመደው የአማርኛ አጻጻፍ ያቀርባል፤ “ሆይ” የግሪኩን የቀጥታ ጥሪ ያሳያል።
- source_word: σπεύσας κατάβηθι
  choice: ፈጥነህ ውረድ
  rationale: የትእዛዙን አስቸኳይነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: σήμερον γὰρ
  choice: ዛሬ
  rationale: ከቀደመው ትእዛዝ ጋር ያለው የምክንያት ግንኙነት በአማርኛው ዐውደ ንባብና በ“አለብኝ” ግዴታዊ አገላለጽ በቂ ሁኔታ ይታያል።
- source_word: ἐν τῷ οἴκῳ σου
  choice: በቤትህ
