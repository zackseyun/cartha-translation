  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: am
  text: ነገር ግን የአገሩ ዜጎች ይጠሉት ነበር፤ ከእርሱ በኋላም የተወካዮች ልዑክ[a] ልከው፣ “ይህ ሰው በእኛ ላይ እንዲነግሥ አንፈልግም” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልዑክ።” የግሪኩ ቃል በይፋዊ ተልእኮ የተላከ የተወካዮች ቡድን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται αὐτοῦ
  choice: የአገሩ ዜጎች
  rationale: የπολῖταιን የዜግነትና የፖለቲካ ማኅበረሰብ ስሜት ይጠብቃል፤ “ተገዢዎቹ” ማለት እነርሱ የማይቀበሉትን ንግሥና አስቀድሞ ያጸድቃል።
- source_word: ἐμίσουν
  choice: ይጠሉት ነበር
  rationale: የግሱን ያልተጠናቀቀ የቀድሞ ጊዜ አቀራረብ በተፈጥሯዊ አማርኛ ያሳያል፤ ጥላቻው ቀጣይ ወይም የተለመደ እንደነበር ያመለክታል።
- source_word: πρεσβείαν
  choice: የወኪሎች ቡድን
  rationale: በይፋዊ ተልእኮ የተላከ የተወካዮች ቡድን የሚለውን ትርጉም በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ὀπίσω αὐτοῦ
  choice: ተከትሎት
  rationale: እርሱ ከሄደ በኋላ ወኪሎቹ እሱን ተከትለው እንደተላኩ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Οὐ θέλομεν τοῦτον
  choice: ይህ ሰው … አንፈልግም
  rationale: የθέλωን ፈቃድና ምኞት በቀጥታ ይገልጣል፤ “ይህ ሰው” የτοῦτονን ርቀትና አለመቀበል ያለ ከመጠን ያለፈ ንቀት ያስተላልፋል።
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: በእኛ ላይ እንዲነግሥ
  rationale: የβασιλεύωን ግልጽ የንግሥና ምስል ይጠብቃል፤ አጠቃላይ የሥልጣን ቃል በመጠቀም አያዳክመውም።
theological_decisions:
- issue: በምሳሌው ያለው የፖለቲካና የንግሥና ምስል
  choice: “በእኛ ላይ እንዲነግሥ” በማለት ግልጽ የንግሥና ቋንቋውን መጠበቅ
  alternative: “እንዲገዛን” ወይም “እንዲያስተዳድረን”
  rationale: የምሳሌው አቀራረብ በንግሥና ላይ የተመሠረተ ነው። ትርጉሙ ይህን ምስል ይጠብቃል፤ ሆኖም ጽሑፉ ከሚለው በላይ ምሳሌያዊ መደምደሚያ አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። “ይጠሉት ነበር” የቀጣይ ጥላቻውን፣ “ይህ ሰው” ደግሞ የተናጋሪዎቹን ርቀትና አለመቀበል በተፈጥሯዊ አነጋገር ያሳያሉ። የማስታወሻው ምልክት ከሚያብራራው “የወኪሎች ቡድን” ቀጥሎ ተቀምጧል።
