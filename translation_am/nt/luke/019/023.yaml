review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the rebuking question, the commercial sense of ἀργύριον and τράπεζα, and τόκος as interest. However, ἂν ... ἔπραξα expresses the unrealized result: on his return the master would have received/collected the money with interest. The draft''s progressive እሰበስበው ነበር is less exact for this single resulting collection.'
  naturalness: The first sentence is clear and natural enough, though በባንክ is better expressed as በባንክ ውስጥ in contemporary Amharic. In the second sentence, ከነወለዱ is understandable but less idiomatic than ከወለድ ጋር, and the revised verb phrase reads more naturally for a one-time receipt at the master's return.
  terminology: ገንዘብ, ባንክ, and ወለድ are appropriate modern standard Amharic terms. A footnote on ባንክ is warranted because τράπεζα literally refers to a table and, in context, to a banker/banking operation rather than a modern bank building.
  issues:
  - severity: medium
    issue: The counterfactual collection is rendered with a progressive form.
    rationale: ἔπραξα with ἄν refers to what the master would have obtained/collected on returning. እሰበስበው ነበር can suggest an ongoing or habitual act; እቀበለው ነበር better conveys the unrealized single outcome.
  - severity: low
    issue: No footnote preserves the lexical-historical alternative for τράπεζα.
    rationale: The English audit trail identifies a relevant alternative. Anchoring an Amharic note to ባንክ preserves the literal ‘table’ and banker-related sense without making the main text unnatural.
  revised_text: “ታዲያ ገንዘቤን ለምን በባንክ[a] ውስጥ አላስቀመጥከውም? እኔም በመጣሁ ጊዜ ከወለድ ጋር እቀበለው ነበር።”
