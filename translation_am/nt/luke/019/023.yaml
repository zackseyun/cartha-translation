  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: am
  text: “ታዲያ ገንዘቤን ለምን በባንክ[a] ውስጥ አላስቀመጥከውም? እኔም በመጣሁ ጊዜ ከወለድ ጋር እቀበለው ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገንዘቤን ለባንኮች በአደራ ትሰጥ ነበር።” ቃል በቃል፣ “ገንዘቤን በጠረጴዛ ላይ ትሰጥ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: ለምን
  rationale: ምክንያትን የሚጠይቀውን እና የወቀሳውን ቃና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: በባንክ አላስቀመጥከውም
  rationale: ቃል በቃል ‘በጠረጴዛ ላይ መስጠት’ የሚለው ሐረግ በዚህ የገንዘብ አውድ ገንዘብን ለባንክ ማስቀመጥን ያመለክታል፤ የተመረጠው አገላለጽ ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: μου τὸ ἀργύριον
  choice: ገንዘቤን
  rationale: ἀργύριον በመሠረቱ ብርን ሊያመለክት ቢችልም፣ በዚህ የንግድ አውድ ‘ገንዘብ’ የሚለው ትርጉም ትክክለኛና የተለመደ ነው።
- source_word: κἀγὼ ἐλθὼν
  choice: እኔም በመጣሁ ጊዜ
  rationale: የግሪኩን ተውሳከ ግስ የጊዜ ግንኙነት በግልጽ አማርኛ የጊዜ ሐረግ ያቀርባል።
- source_word: σὺν τόκῳ
  choice: ከነወለዱ
  rationale: τόκος በዚህ አውድ በተቀማጭ ገንዘብ ላይ የሚገኝን ወለድ ያመለክታል፤ ‘ከነወለዱ’ ዋናውን ገንዘብና ወለዱን አብሮ መቀበልን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: αὐτὸ ἔπραξα
  choice: እሰበስበው ነበር
  rationale: πράσσω እዚህ የሚገባን ገንዘብ መቀበል ወይም መሰብሰብ የሚል የንግድ ትርጉም አለው፤ የግሪኩ ἄν ያለውን ያልተፈጸመ አማራጭ ሁኔታም ‘ነበር’ ይጠብቃል።
