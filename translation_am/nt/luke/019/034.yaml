  text: And they said[a], “The Lord has need of it.”
translation:
  language: am
  text: እነርሱም፣ “ጌታ[a] ያስፈልገዋል” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለቤቱ ያስፈልገዋል።” κύριος በዚህ ስፍራ ለኢየሱስ የተሰጠ የ«ጌታ» ማዕረግ ሳይሆን «ባለቤት» በሚለው ትርጉም ከተወሰደ።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: δέ በዚህ ቦታ ከቀደመው ትረካ ጋር የሚያያዝ ለስላሳ አያያዥ ነው፤ «-ም» ይህን ፍሰት በተፈጥሯዊ አማርኛ ያሳያል። ὁ የቀደሙትን ተናጋሪዎች የሚወክል ስለሆነ «እነርሱ» ተብሏል።
- source_word: εἶπαν
  choice: አሉ
  rationale: የλέγω ያለፈ ጊዜ ቅርጽ በቀጥታ «አሉ» ይሆናል፤ «መለሱ» ቢቻልም ግሱ በራሱ ያልገለጠውን የመልስ ልዩ ስሜት ይጨምራል።
- source_word: ὅτι
  choice: በቀጥተኛ ንግግር ምልክት ተወክሏል
  rationale: ὅτι ቀጥተኛ ንግግርን ያስገባል፤ በተፈጥሯዊ አማርኛ ይህን ተግባር የጥቅስ ምልክቶች በቂ ሁኔታ ያሳያሉ።
- source_word: Ὁ κύριος
  choice: ጌታ
  rationale: κύριος በሉቃስ ወንጌል ብዙ ጊዜ ለኢየሱስ የሚሰጥ ማዕረግ ስለሆነ ዋናው ጽሑፍ «ጌታ» ይላል። ቃሉ «ባለቤት/አለቃ» ማለትም ሊሆን ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: αὐτοῦ
  choice: -ዋል (በ«ያስፈልገዋል» ውስጥ)
  rationale: ተውላጠ ስሙ ከዚህ በፊት የተጠቀሰውን ውርንጫ ያመለክታል፤ በአማርኛ የዕቃ ተሳቢ ቅጥያው «-ው-» ከግሱ ጋር ተዋሕዷል።
- source_word: χρείαν ἔχει
  choice: ያስፈልገዋል
  rationale: የግሪኩ ፈሊጥ ቃል በቃል «ፍላጎት አለው» ቢሆንም፣ «ያስፈልገዋል» የአስፈላጊነትን ሐሳብ በግልጽና በዘመናዊ አማርኛ ያስተላልፋል፤ «ይፈልገዋል» ወደ ምኞት ሊያዘነብል ይችላል።
theological_decisions:
- issue: በደቀ መዛሙርቱ መልስ ውስጥ κύριος የሚያመለክተው ማንን እንደሆነ
  choice: በዋናው ጽሑፍ «ጌታ» ተብሎ ቀርቧል፤ በአውዱ ኢየሱስን ያመለክታል።
  alternative: «ባለቤቱ»፣ ማለትም የውርንጫው ባለቤት
  rationale: ኢየሱስ ደቀ መዛሙርቱ እንዲሉት አስቀድሞ የሰጣቸው መልስ መሆኑና ሉቃስ κύριοςን ለኢየሱስ መጠቀሙ «ጌታ»ን ይደግፋሉ። ሆኖም κύριος «ባለቤት» ማለት ሊሆን ስለሚችል እውነተኛው የቃል አሻሚነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ይጠቀማል። «እነርሱም … አሉ» ተፈጥሯዊውን የአማርኛ ቀጥተኛ ንግግር አወቃቀር ይከተላል፤ «ያስፈልገዋል» ደግሞ የግሪኩን የአስፈላጊነት ትርጉም ያለ አላስፈላጊ ጥንታዊነት ይጠብቃል።
