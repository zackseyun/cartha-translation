lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: ከነበሩት ፈሪሳውያን አንዳንዶቹ
  rationale: የከፊልነት ትርጉም ያለውን አገባብ ይጠብቃል፤ ተናጋሪዎቹ ፈሪሳውያን ሁሉ ሳይሆኑ ከእነርሱ የተወሰኑት መሆናቸውን ያሳያል።
