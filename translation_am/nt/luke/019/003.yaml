base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: am
  text: እርሱም ኢየሱስ ማን እንደሆነ ለማየት ይሞክር ነበር፤ ነገር ግን ከሕዝቡ የተነሣ ማየት አልቻለም፤ ቁመቱ አጭር[a] ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በቁመቱ ትንሽ ነበር።” የግሪኩ አገላለጽ ከቁመት አንጻር ትንሽ መሆንን ያመለክታል፤ በዚህ ዐውድ ስለ ዕድሜ ሳይሆን ስለ አካላዊ ቁመት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: ይሞክር ነበር
  rationale: ያልተጠናቀቀው የግስ አይነት ቀጣይ ጥረትን ስለሚያመለክት፣ ቀላል ፍላጎትን ብቻ ከሚገልጽ ‘ይፈልግ ነበር’ ይልቅ ይህ አገላለጽ ዐውዱን ይበልጥ ያስተላልፋል።
- source_word: ἰδεῖν
  choice: ለማየት
  rationale: የጥረቱን ዓላማ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τίς ἐστιν
  choice: ኢየሱስ ማን እንደሆነ
  rationale: የግሪኩን የማንነት ጥያቄ ይጠብቃል፤ ሐረጉ ‘ምን ዓይነት ሰው እንደሆነ’ የሚለውን ጥላ ሊይዝ ቢችልም ይህን በጽሑፉ ውስጥ በግድ አይወስንም።
- source_word: οὐκ ἠδύνατο
  choice: ማየት አልቻለም
  rationale: የአለመቻልን ሐሳብ በተለመደና ግልጽ አማርኛ ያቀርባል፤ የተደገመው ‘ማየት’ በአማርኛ የተከለከለውን ተግባር ግልጽ ያደርጋል።
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ከሕዝቡ የተነሣ
  rationale: ἀπό እዚህ የእንቅፋቱን ምክንያት ይገልጻል፤ ይህ አገላለጽ ሕዝቡ እንደከለከለው የማይገኝ ተጨማሪ ድርጊት ሳያስገባ ምክንያቱን ያሳያል።
- source_word: ὅτι
  choice: ነበርና
  rationale: ማየት ያልቻለበትን ተጨማሪ ምክንያት በተፈጥሯዊ የአማርኛ የምክንያት ቅርጽ ያቀርባል።
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: ቁመቱ አጭር ነበር
  rationale: ἡλικία ዕድሜን ወይም ቁመትን ሊያመለክት ቢችልም፣ ሕዝቡ እይታውን የከለከለበት ዐውድ አካላዊ ቁመትን በግልጽ ይደግፋል። ‘ቁመቱ አጭር’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
