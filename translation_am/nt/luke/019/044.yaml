id: LUK.19.44
reference: Luke 19:44
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: am
  text: አንቺንና በውስጥሽ ያሉትን ልጆችሽን ከመሬት ጋር እኩል ያደርጋሉ፤ በውስጥሽም ድንጋይ በድንጋይ ላይ አይተዉም። ይህም የተጎበኘሽበትን ጊዜ ስላላወቅሽ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: ከመሬት ጋር ያደርሳሉ
  rationale: ግሱ እስከ መሬት ድረስ ማፍረስንና ማውደምን ያመለክታል፤ ይህ አገላለጽ ኃይሉን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σε
  choice: አንቺን
  rationale: ኢየሩሳሌም እንደ ሴት ሰው ተደርጋ በቀጥታ ትጠራለች፤ የሁለተኛ መደብ ነጠላው አጠራር ተጠብቋል።
- source_word: τὰ τέκνα σου ἐν σοί
  choice: በውስጥሽ ያሉትን ልጆችሽን
  rationale: ‘ልጆች’ የሚለው ቃል የከተማይቱን እናትነት ምስል ይጠብቃል፤ በዐውዱ ውስጥ ያሉ ነዋሪዎቿን ያመለክታል።
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: በውስጥሽም ድንጋይ በድንጋይ ላይ አይተዉም
  rationale: የፍጹም ውድመትን ምስል ቃል በቃል በሚቀርብ እና በአማርኛ ግልጽ በሆነ አገላለጽ ያቀርባል።
- source_word: ἀνθ’ ὧν
  choice: ስለ... ነው
  rationale: በዚህ ዐውድ የፍርዱን ምክንያት የሚያስተዋውቀውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔγνως
  choice: ስላላወቅሽ
  rationale: γινώσκω እዚህ ማወቅን ወይም ለይቶ መገንዘብን ያመለክታል፤ አማርኛው በዐውዱ ይህን ሁለቱንም ሊያስተላልፍ ይችላል።
- source_word: καιρὸν
  choice: ጊዜ
  rationale: ወሳኝና የተወሰነ ጊዜን የሚያመለክተው ትርጉም ከተከታዩ ሐረግ ጋር በግልጽ ይታያል።
- source_word: τῆς ἐπισκοπῆς σου
  choice: የተጎበኘሽበትን
  rationale: የመለኮታዊ ጉብኝትን ፍንጭ ይጠብቃል፤ ጎብኚውን በስም ባለመጥቀስ የግሪኩን አጭርነትና አንዳንድ ክፍትነት ያስቀራል።
theological_decisions:
- issue: በፍርድ ዐውድ ውስጥ የἐπισκοπή ትርጉም
  choice: የተጎበኘሽበትን
  alternative: የተመረመርሽበትን
  rationale: ቃሉ ምሕረትንም ሆነ ፍርድን ሊያመጣ የሚችል መለኮታዊ ጉብኝትን ወይም ምርመራን ሊያመለክት ይችላል። ዋናው ጽሑፍ ‘ጉብኝት’ የሚለውን ፍንጭ ይዞ ጎብኚውን ወይም የጉብኝቱን ውጤት በግልጽ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ኢየሩሳሌምን እንደ ሴት ሰውና እናት የሚያቀርበው ምስል በሴት ጾታ ቅጥያዎች ተጠብቋል።
