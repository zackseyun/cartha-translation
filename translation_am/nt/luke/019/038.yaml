  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: am
  text: እንዲህ እያሉ፦ “በጌታ ስም የሚመጣው ንጉሥ የተባረከ ነው![a] በሰማይ ሰላም፣ በአርያምም ክብር!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ትርጉሞች የተለመደውን “በጌታ ስም የሚመጣው የተባረከ ነው” የሚል አቀራረብ ይከተላሉ፤ ሉቃስ ግን “ንጉሥ” የሚለውን ቃል በግልጽ አካትቷል።
    reason: alternative_reading
  - marker: b
    text: ይህ ሉቃስ 2፥14ን ያስታውሳል፤ የሰላሙን ስፍራ ግን በተቃራኒው ያቀርባል፤ በዚያ “በምድር ሰላም” ሲል፣ እዚህ “በሰማይ ሰላም” ይላል።
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: እንዲህ እያሉ
  rationale: የአሁን ጊዜ አጋዥ ግስ ሆኖ ከቀደመው ቁጥር ጋር ያለውን ትስስር ይጠብቃል፤ በአማርኛም የሚከተለውን ንግግር በተፈጥሯዊ ሁኔታ ያስተዋውቃል።
- source_word: Εὐλογημένος
  choice: የተባረከ ነው
  rationale: የምስጋናና የበረከት አዋጅን በክብር ያቀርባል፤ የመዝሙራዊውን ድምፅም ሳያጠፋ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: ὁ ἐρχόμενος
  choice: የሚመጣው
  rationale: በመስተዋድድና በአጋዥ ግስ የተገለጠውን ‘የሚመጣው’ የሚል ስማዊ አገባብ ይጠብቃል፤ ከ‘ንጉሥ’ ጋርም ተፈጥሯዊ ነው።
- source_word: βασιλεὺς
  choice: ንጉሥ
  rationale: ሉቃስ በግልጽ ያካተተውን የንግሥና መጠሪያ ይጠብቃል፤ ወደ አጠቃላይ የበረከት ንግግር አያለሰልሰውም።
- source_word: ἐν ὀνόματι κυρίου
  choice: በጌታ ስም
  rationale: የሴማዊውን አነጋገርና በጌታ ሥልጣን መምጣትን ሊያመለክት የሚችለውን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: በሰማይ ሰላም
  rationale: ግስ የሌለውን አጭር የአዋጅ አወቃቀር ይጠብቃል፤ ‘በምድር’ ብሎ ከማስማማት ይልቅ የምንጩን ‘በሰማይ’ በትክክል ያቀርባል።
- source_word: δόξα ἐν ὑψίστοις
  choice: በአርያምም ክብር
  rationale: ἐν ὑψίστοις የሚያመለክተውን እጅግ ከፍ ያለውን ሰማያዊ ስፍራ በታወቀና በክብር ባለው አማርኛ ይገልጣል፤ ከሉቃስ 2፥14 ጋር ያለውን የቃላት ትይዩነትም ይጠብቃል።
theological_decisions:
- issue: በድል መግባቱ ወቅት የተነገረው የንጉሥነት አዋጅ
  choice: βασιλεὺςን ‘ንጉሥ’ ብሎ በግልጽ ማቅረብ
  alternative: “በጌታ ስም የሚመጣው የተባረከ ነው” የሚለው አጠቃላይ አቀራረብ
  rationale: የሉቃስ ጽሑፍ ‘ንጉሥ’ የሚለውን ቃል በግልጽ ያካትታል። ቃሉን መጠበቅ የንግሥናውንና መሲሐዊውን አጽንዖት ያቀርባል፤ ከጽሑፉ በላይ የሆነ የአንድ ወገን ትርጓሜ ግን አይጨምርም።
- issue: ከሉቃስ 2፥14 ጋር ያለው ግንኙነት
  choice: “በሰማይ ሰላም፣ በአርያምም ክብር” ብሎ መተርጎም
  alternative: “በምድር ሰላም፣ በአርያምም ክብር” ብሎ ከሉቃስ 2፥14 ጋር ማስማማት
  rationale: የግሪክ ምንጩ በግልጽ ‘በሰማይ’ ይላል። ይህን መጠበቅ ሉቃስ ከቀደመው መዝሙር ጋር የፈጠረውን ትይዩነትና የትርጉም ውጥረት ሳይፈታ ያስቀራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። “አርያም” በመጽሐፍ ቅዱሳዊ አውድ የታወቀ ቢሆንም ለዘመናዊ አንባቢም የሚገባ ሲሆን፣ የአዋጁን አጭርና ግጥማዊ ቅርጽ ይጠብቃል።
