base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: am
  text: እርሱም በየዕለቱ በቤተ መቅደስ ያስተምር ነበር። ዋና ካህናትና ጸሐፍት፣ እንዲሁም የሕዝቡ ታላላቅ ሰዎች[a] ሊያጠፉት ይፈልጉ ነበር፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሕዝቡ መሪዎች”። የግሪኩ አገላለጽ ቃል በቃል “የሕዝቡ ቀዳሚዎች” ማለት ሲሆን፣ በሕዝቡ መካከል ታዋቂ ወይም ተጽዕኖ ያላቸውን ሰዎች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: ያስተምር ነበር
  rationale: የተያያዘው ያለፈ ጊዜ አገላለጽ በዚያን ጊዜ ቀጥሎና ተደጋግሞ ይደረግ የነበረ ተግባርን ያሳያል።
- source_word: τὸ καθ’ ἡμέραν
  choice: በየዕለቱ
  rationale: የእያንዳንዱን ቀን ተደጋጋሚነት በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢ የሚያመለክት ሲሆን፣ ይህ በአማርኛ የተለመደው አጭር አቻ ነው።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: የካህናትን ከፍተኛ አመራር ቡድን በግልጽና በተለመደ አገላለጽ ያመለክታል።
- source_word: οἱ γραμματεῖς
  choice: ጸሐፍት
  rationale: የግሪኩን ቃል ቀጥተኛና በመጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደ አቻ ይሰጣል፤ ‘የሕግ መምህራን’ የበለጠ ትርጓሜያዊ ነው።
- source_word: ἐζήτουν
  choice: ይፈልጉ ነበር
  rationale: ያለፈው ጊዜ ኢምፐርፌክት የቀጠለ ፍላጎትንና ሙከራን ያሳያል።
- source_word: ἀπολέσαι
  choice: ሊያጠፉት
  rationale: ἀπόλλυμι በዚህ ዐውድ መግደልን የሚያካትት ጠላትነት ያለበትን ማጥፋት ያመለክታል፤ ‘ማጥፋት’ የምንጩን ሰፊ ክልል ይጠብቃል።
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: የሕዝቡ ታላላቅ ሰዎች
  rationale: በሕዝቡ ዘንድ የከበሩ፣ ተጽዕኖ ያላቸውንና ቀዳሚ ቦታ የያዙ ሰዎች በተፈጥሯዊ አማርኛ ያመለክታል።
theological_decisions:
- issue: በοἱ πρῶτοι τοῦ λαοῦ ያለው ወንድ ጾታ ያለው ብዙ ቁጥር
  choice: የሕዝቡ ታላላቅ ሰዎች
  alternative: የሕዝቡ መሪዎች
  rationale: የግሪኩ አገላለጽ በታሪካዊው ሁኔታ የሕዝቡን ታዋቂ ወንድ ሹማምንት ሊያመለክት ይችላል። አማርኛው ‘ሰዎች’ ሰዋሰዋዊ ጾታን በግድ ሳይጨምር የቡድኑን ሰብዓዊና ታላቅነት ገጽታ ይጠብቃል፤ አማራጩም በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። በየዕለቱ የማስተማሩና የተቃዋሚዎቹ የቀጠለ ፍለጋ የግሪኩን ኢምፐርፌክት ገጽታ ይጠብቃሉ። የመጨረሻው ምልክት ዐረፍተ ነገሩ በቀጣዩ ቁጥር እንደሚቀጥል ያመለክታል።
