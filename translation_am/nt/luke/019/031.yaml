id: LUK.19.31
reference: Luke 19:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: am
  text: ማንም፣ ‘ለምን ትፈቱታላችሁ?’ ብሎ ቢጠይቃችሁ፣ እንዲህ በሉ፦ ‘ጌታ[a] ያስፈልገዋል።’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለቤቱ ያስፈልገዋል።”
    reason: κύριος በዚህ አውድ ‘ጌታ’ ወይም ‘ባለቤት’ ሊሆን የሚችለውን ትርጉማዊ አሻሚነት ለማሳየት።
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: ቢጠይቃችሁ
  rationale: የግሪኩን ሁኔታዊ አገባብ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: Διὰ τί
  choice: ለምን
  rationale: ቀጥተኛና ተፈጥሯዊ የምክንያት ጥያቄ ነው።
- source_word: λύετε
  choice: ትፈቱታላችሁ
  rationale: በአውዱ የታሰረውን ውርንጫ ከማሰሪያው መፍታትን ያመለክታል፤ በግሪኩ የተዘወረው ተሳቢ በአማርኛው -ታ- ተገልጿል።
- source_word: οὕτως ἐρεῖτε
  choice: እንዲህ በሉት
  rationale: የወደፊት ጊዜውን መመሪያዊ ኃይል በተፈጥሯዊ የትእዛዝ አገባብ ያቀርባል።
- source_word: κύριος
  choice: ጌታ
  rationale: የማዕረጉን መለኮታዊ ድምፀትና በሉቃስ ትረካ ኢየሱስን የማመልከት እድሉን ይጠብቃል፤ የ‘ባለቤት’ ትርጉም በማስታወሻ ተቀምጧል።
- source_word: αὐτοῦ
  choice: -ዋል (በያስፈልገዋል)
  rationale: ተውላጠ ስሙ በአቅራቢያው ያለውን ውርንጫ እንደሚያመለክት በአማርኛ ግስ ውስጥ በተፈጥሮ ተዋሕዷል።
- source_word: χρείαν ἔχει
  choice: ያስፈልገዋል
  rationale: ‘ያስፈልገዋል/ይፈልገዋል’ የሚለው የአማርኛ ፈሊጥ የግሪኩን ‘ፍላጎት አለው’ ትርጉም ግልጽና ተፈጥሯዊ አድርጎ ያስተላልፋል።
theological_decisions:
- issue: የὉ κύριος አመልካችና ትርጉም
  choice: ‘ጌታ’ ተብሎ ተተርጉሟል፤ በትረካው ኢየሱስን እንደሚያመለክትና የማዕረጉን መለኮታዊ ድምፀት እንደሚጠብቅ ተደርጓል።
  alternative: ‘ባለቤቱ’፣ ማለትም የእንስሳው ባለቤት ወይም ጌታ
  rationale: κύριος በቅርብ አውድ ‘ባለቤት’ ሊባል ቢችልም፣ ሉቃስ ቃሉን ለኢየሱስ በተደጋጋሚ ይጠቀማል። ‘ጌታ’ ሁለቱንም የትርጉም እድሎች ሳይዘጋ ዋናውን የማዕረግ ንባብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ ሥርዓተ ነጥብ በግልጽ ሁኔታ ቀርቧል፤ ማስታወሻውም ከሚመለከተው ‘ጌታ’ ቃል ጋር ተያይዟል።
