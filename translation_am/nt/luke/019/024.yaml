    text: ምና የጥንት የገንዘብ መለኪያ ነው፤ በባህላዊ አተረጓጎም “ፓውንድ” ተብሎም ይተረጎማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεστῶσιν
  choice: በዚያ ቆመው ለነበሩት
  rationale: በአቅራቢያው ቆመው የነበሩትን ሰዎች የሚያመለክተውን ግልጽ ትዕይንት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: ከእርሱ ወስዳችሁ
  rationale: αἴρω በዚህ አውድ ‘መውሰድ/ማስወገድ’ ማለት ሲሆን፣ ἀπό ደግሞ ከእርሱ መለየቱን ያሳያል።
- source_word: μνᾶν
  choice: ምናውን
  rationale: የጥንቱን የገንዘብ መለኪያ በድምፅ ቅርብ ስያሜው ይጠብቃል፤ ዘመናዊ የገንዘብ አቻ እንዳይመስልም ይከላከላል።
- source_word: δότε
  choice: ስጡት
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዙንና የእቃውን ማስተላለፍ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: አሥር ምና ላለው
  rationale: ግሪኩ ያልጨመረውን ‘ሰው’ ወይም ‘ወንድ’ ሳይጨምር፣ የያዘውን ሰው በተፈጥሯዊ አማርኛ ይለያል። ከቁጥር በኋላ ስሙን በነጠላ መጠቀም የአማርኛን ልማድ ይከተላል።
theological_decisions:
- issue: μνᾶ የተባለውን የጥንት የገንዘብ መለኪያ መተርጎም
  choice: ምና
  alternative: ፓውንድ
  rationale: ‘ምና’ የግሪኩን ታሪካዊ መለኪያ በቀጥታ ይጠብቃል፤ ‘ፓውንድ’ ግን ዘመናዊ ወይም ትክክለኛ አቻ ዋጋ እንዳለው ሊያስመስል ይችላል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የቀጥተኛው ንግግር ትእዛዛዊ ኃይል ተጠብቋል፤ የጥንቱ የገንዘብ መለኪያም በማብራሪያ ግርጌ ተብራርቷል።
