  rationale: πρός ከትረካው እንቅስቃሴ አንጻር ወደ ተራራው አቅጣጫ መሆኑን ያሳያል።
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: የወይራ ተራራ ወደሚባለው
  rationale: የግሪኩን የስያሜ አወቃቀር በተፈጥሯዊና በሚታወቅ የአማርኛ አገላለጽ ያቀርባል፤ በግሪኩ ያለው አጭር «ወይራዎች» የሚል ስያሜ በማስታወሻ ተገልጿል።
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: ቀላል የትረካ ድርጊቱን በመደበኛና ትክክለኛ የአማርኛ ግስ ያስተላልፋል።
- source_word: δύο τῶν μαθητῶν
  choice: ከደቀ መዛሙርቱ ሁለቱን
  rationale: የከፊል ዘርፍ አወቃቀሩን «ከ… ሁለቱን» በማለት ይጠብቃል፤ በግሪኩ በግልጽ ያልተጻፈውን «የእርሱ» አይጨምርም።
