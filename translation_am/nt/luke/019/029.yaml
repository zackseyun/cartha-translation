    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: እንዲህም ሆነ
  rationale: የሉቃስን የትረካ መሸጋገሪያ ቀመር በግልጽና በተከበረ ዘመናዊ አማርኛ ያቀርባል፤ καί ያለውንም ትስስር «-ም» ይጠብቃል።
- source_word: ὡς
