  rationale: እዚህ ὡς ጊዜን የሚገልጽ ሲሆን፣ የመቅረቡን ክስተት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἤγγισεν
  choice: በቀረበ
  rationale: ἐγγίζω ወደ ስፍራ መቅረብን ያመለክታል፤ «ቀረበ» ዘመናዊና ቀጥተኛ ነው።
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ወደ ቤተ ፋጌና ወደ ቢታንያ
  rationale: εἰς የአቅጣጫ ትርጉሙን «ወደ» በማለት ይጠብቃል፤ የቦታዎቹ ስሞችም በተለመደ የአማርኛ አጻጻፍ ተተርጉመዋል።
- source_word: πρὸς τὸ ὄρος
