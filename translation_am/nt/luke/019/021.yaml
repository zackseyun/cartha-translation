base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: am
  text: ፈርቼህ ነበር፤ አንተ ጥብቅ ሰው[a] ነህና፤ ያላስቀመጥከውን ትወስዳለህ[b]፣ ያልዘራኸውንም ታጭዳለህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ጥብቅ» የሚለው «ከባድ»፣ «ጨካኝ» ወይም «ጠንካራ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «ያላስቀመጥከውን ትወስዳለህ»። አንዳንድ ትርጉሞች «ያላኖርከውን ታነሣለህ» ወይም፣ ከገንዘብ አውድ ጋር በማያያዝ፣ «ያላስቀመጥከውን ትሰበስባለህ» ብለው ይተረጉሙታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην γάρ σε
  choice: ፈርቼህ ነበር
  rationale: ያለፈ ጊዜንና የቀጠለ የፍርሃት ሁኔታን በተፈጥሯዊ አማርኛ ያሳያል፤ γάρ የሚያመለክተው ምክንያታዊ ግንኙነት በቀጣዩ ሐረግ ባለው «ስለማውቅ» ተገልጧል።
- source_word: ἄνθρωπος αὐστηρὸς
  choice: ጨካኝ ሰው
  rationale: αὐστηρός እዚህ ጥብቅ፣ አስጨናቂ ወይም ጨካኝ የሆነን ሰው ያመለክታል። «ጨካኝ» የአገልጋዩን ከሳሽ ንግግር ሳያለዝብ ይጠብቃል።
- source_word: αἴρεις ὃ οὐκ ἔθηκας
  choice: ያላኖርኸውን ታነሣለህ
  rationale: የግሪኩን ቀጥተኛ የማኖርና የማንሣት ምስል ይጠብቃል፤ ጽሑፉ በግልጽ ያልጠቀሰውን «ገንዘብ ማስቀመጥ» የመሰለ የንግድ ትርጉም አያስገባም።
- source_word: θερίζεις ὃ οὐκ ἔσπειρας
  choice: ያልዘራኸውንም ታጭዳለህ
  rationale: የመዝራትና የማጨድን የግብርና ትይዩ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የአገልጋዩ ስለ ጌታው የተናገረውን ከሳሽ ገለጻ ማለዘብ ወይም እንዳለ ማቆየት
  choice: «ጨካኝ ሰው» በማለት የአገልጋዩን ከሳሽ ቃና እንዳለ ማቆየት
  alternative: «ጥብቅ ሰው» ወይም «በጣም ጠያቂ ሰው» በማለት ቃናውን ማለዘብ
  rationale: ጥቅሱ የሚዘግበው የአገልጋዩን ክስና ማመካኛ ነው። ትርጉሙ ይህን ኃይል መጠበቅ አለበት፤ ክሱ ስለ ጌታው ባሕርይ ፍጹም እውነት መሆኑን ግን አይወስንም።
