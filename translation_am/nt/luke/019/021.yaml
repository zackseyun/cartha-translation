review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two parallel accusations about taking and reaping, but it adds the non-source idea “ስለማውቅ” (“because I know”). The Greek gives the stated reason as “because you are a severe/strict man,” not because the servant knows this. “ጨካኝ” can suggest cruelty or stinginess and is stronger/differently focused than αὐστηρός; “ጥብቅ” better conveys the master's alleged exacting severity without resolving the parable's tension.
  naturalness: The proposed revision is natural, modern standard Amharic. It avoids the somewhat unnatural causal construction in the draft and uses idiomatic verbs for taking, placing, reaping, and sowing.
  terminology: “ጥብቅ ሰው” appropriately renders αὐστηρὸς in this reported accusation. “ትወስዳለህ” renders αἴρεις as “you take,” while “ያላስቀመጥከውን” retains the basic put/place sense without importing a specifically financial transaction. “ታጭዳለህ” and “ዘራህ” preserve the agricultural pair θερίζεις/ἔσπειρας.
  issues:
  - severity: high
    issue: The phrase “ስለማውቅ” adds ‘because I know.’
    rationale: No verb of knowing occurs in the Greek. The causal clause is ὅτι ἄνθρωπος αὐστηρὸς εἶ, ‘because you are a severe/strict man.’
  - severity: medium
    issue: “ጨካኝ” is not the most precise equivalent for αὐστηρός.
    rationale: It may imply cruelty or stinginess, whereas αὐστηρός primarily describes someone strict, severe, or exacting. “ጥብቅ” retains the servant's negative complaint with less semantic overreach.
  - severity: medium
    issue: Footnote a is anchored to “ፈርቼህ ነበር” although its content explains the adjective for ‘severe.’
    rationale: The anchor should follow “ጥብቅ” so that the lexical alternative is attached to the word it explains.
