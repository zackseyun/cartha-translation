  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: am
  text: ከዚያም የመጀመሪያው መጥቶ፣ “ጌታ ሆይ፣[a] የእርስዎ ምና አሥር ምና አተረፈ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አለቃ ሆይ።” የግሪኩ κύριε የሚለው የማዕረግ ቃል “ጌታ” ማለት ብቻ ሳይሆን ለአንድ በላይ ሰው የሚቀርብ የአክብሮት አድራሻም ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο δὲ
  choice: ከዚያም … መጥቶ
  rationale: δέ የትረካውን ቅደም ተከተል ስለሚያመለክት “ከዚያም” ተብሏል፤ παραγίνομαι ደግሞ በዚህ አውድ “መጣ” የሚለውን ቀላልና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: ὁ πρῶτος λέγων
  choice: የመጀመሪያው … አለ
  rationale: በቅደም ተከተል ከቀረቡት አገልጋዮች መካከል መጀመሪያውን ያመለክታል፤ የግሪኩ ተውሳከ ግስ በተፈጥሯዊ የአማርኛ ትረካ “መጥቶ … አለ” ተብሎ ቀርቧል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριε ለበላይ የሚቀርብ የአክብሮት አድራሻ ሊሆን ቢችልም “ጌታ ሆይ” የቃሉን መደበኛ ትርጉምና የምሳሌውን ክብር የተሞላበት ንግግር ይጠብቃል።
- source_word: ἡ μνᾶ σου
  choice: የእርስዎ ምና
  rationale: ምና ታሪካዊ የገንዘብ መለኪያ ስለሆነ በዘመናዊ የገንዘብ ስም ሳይተካ በድምፅ ተቀራራቢ መልኩ ተጠብቋል፤ σου ደግሞ ገንዘቡ የጌታው መሆኑን ያሳያል።
- source_word: δέκα προσηργάσατο μνᾶς
  choice: አሥር ምና አተረፈ
  rationale: προσεργάζομαι በሥራ ተጨማሪ ትርፍ ማስገኘትን ያመለክታል። “አተረፈ” ዋናው ምና አሥር ምና ትርፍ ማስገኘቱን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በምሳሌያዊው ንግግር κύριος የሚለውን ማቅረብ
  choice: ጌታ ሆይ
  alternative: አለቃ ሆይ
  rationale: በዚህ ስፍራ ቃሉ ባሪያው ለበላዩ የሚጠቀምበት የአክብሮት አድራሻ ነው፤ ሆኖም “ጌታ” የκύριοςን ሰፊ ትርጉም ይጠብቃል። “አለቃ” አውዳዊ አማራጭ በመሆኑ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር የተሞላበትና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ምና” የሚለው ታሪካዊ መጠሪያ ተጠብቋል፤ የአክብሮት ተውላጠ ስም “እርስዎ” ከጌታና አገልጋይ ግንኙነት ጋር ተስማሚ ነው።
