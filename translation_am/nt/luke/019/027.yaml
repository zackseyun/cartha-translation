  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: am
  text: ነገር ግን እኔ በእነርሱ ላይ እንድነግሥ ያልፈለጉትን[a] እነዚህን ጠላቶቼን ወደዚህ አምጡና በፊቴ እረዷቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔ በእነርሱ ላይ ንጉሥ እንድሆን ያልፈለጉትን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በፊቴ ግደሏቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ነገር ግን
  rationale: በመኳንንቱ ንግግር መጨረሻ ላይ ያለውን ጠንካራ የተቃርኖና የሽግግር ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: እነዚህን ጠላቶቼን
  rationale: ἐχθρούς የግል ተቃዋሚዎችን ያመለክታል፤ τούτους የሚሰጠውን ጉልህ ጠቋሚ አጽንዖትም ‘እነዚህን’ ይጠብቃል።
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: እኔ በእነርሱ ላይ እንድነግሥ ያልፈለጉትን
  rationale: የግሪኩን አንጻራዊ ገላጭ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል፤ θέλωን ‘መፈለግ’፣ βασιλεύωንም ‘መንገሥ’ ብሎ በትክክል ያስተላልፋል።
- source_word: ἀγάγετε ὧδε
  choice: ወደዚህ አምጡ
  rationale: የመዳረሻውን አቅጣጫና የትእዛዙን ቀጥተኛነት በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: κατασφάξατε
  choice: እረዷቸው
  rationale: κατασφάζω ከአጠቃላይ ‘መግደል’ ይልቅ ኃይለኛና ስዕላዊ የሆነ ‘ማረድ’ን ያመለክታል፤ ስለዚህ የግሪኩን ክብደት ሳያለዝብ ይጠብቃል።
- source_word: ἔμπροσθέν μου
  choice: በፊቴ
  rationale: ሐረጉ የቦታንና የግል መገኘትን ያመለክታል፤ ‘በፊቴ’ ሁለቱንም በአጭርና በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: በምሳሌው ውስጥ የተናጋሪው ማንነትና የትእዛዙ ኃይለኛነት
  choice: የመኳንንቱን ትእዛዝ እንደቀረበው በቀጥታ መተርጎም፣ ግፋዊነቱን ሳያለዝቡ እና ከምሳሌው ውጭ የኢየሱስ ቀጥተኛ ትእዛዝ እንደሆነ ሳይጨምሩ
  alternative: ንግግሩ ምሳሌያዊ ምስል ብቻ መሆኑን በትርጉሙ ውስጥ ግልጽ ለማድረግ የሚያርቅ ቃል መጨመር
  rationale: ግሪኩ በምሳሌው ውስጥ መኳንንቱ በቀጥታ ሲናገር ያቀርባል። ትርጉሙም ይህን የትረካ ኃይልና ሥነ መለኮታዊ ውጥረት ጠብቆ ከጽሑፉ በላይ የሆነ ድምዳሜ አይጨምርም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ግልጽና ክብር ያለው ነው። ‘እረዷቸው’ የግሪኩን ኃይለኛ ምስል ይጠብቃል፤ ነገር ግን በግርማዊ ወይም በጥንታዊ ቃላት አይሸፍነውም። የእግር ማስታወሻ ምልክቶቹ ከሚመለከቷቸው ሐረጎች ቀጥለው ተቀምጠዋል።
