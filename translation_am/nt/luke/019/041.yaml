  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: am
  text: እርሱም ሲቀርብ፣ ከተማይቱን አይቶ ስለ እርሷ አለቀሰ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: ሲቀርብ
  rationale: የመቅረቡን ቀጣይ እንቅስቃሴና ከሚከተለው ድርጊት ጋር ያለውን የጊዜ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በግሪኩ ያልተገለጸውን የመቅረቡን ቀጥተኛ ተሳቢ አይጨምርም።
- source_word: ἰδὼν
  choice: አይቶ
  rationale: የግሪኩን ተውሳከ ግስ ፍሰት ይጠብቃል፤ ከተማይቱን ማየቱንም ከማልቀሱ ጋር በቀጥታ ያያይዛል።
- source_word: τὴν πόλιν
  choice: ከተማይቱን
  rationale: πόλιςን በቀጥታ ይተረጉማል። ኢየሩሳሌም መሆኗ ከአውዱ ግልጽ ስለሆነ ስሟን በዋናው ጽሑፍ አይጨምርም፤ የተወሰነነትንና የአማርኛውን የሴት ፆታ ስምምነት ያሳያል።
- source_word: ἔκλαυσεν
  choice: አለቀሰ
  rationale: የκλαίωን ስሜታዊ ክብደት በተፈጥሯዊና ክብር ባለው አማርኛ ያቀርባል፤ በግሱ ያልተገለጸ ተጨማሪ ጥንካሬ አያስገባም።
- source_word: ἐπ’ αὐτήν
  choice: ስለ እርሷ
  rationale: ከκλαίω ጋር ያለውን ‘በእርሷ ምክንያት/ስለ እርሷ’ የሚለውን የሐዘን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል፤ የከተማይቱን የሴት ፆታ ስምምነትም ይጠብቃል።
theological_decisions:
- issue: የπόλιςን ሰዋሰዋዊ የሴት ፆታ በተውላጠ ስሙ ማቆየት
  choice: ‘ከተማይቱ’ ከሚለው ጋር ተስማምቶ ‘እርሷ’ የሚለውን የሴት ፆታ ተውላጠ ስም መጠቀም
  alternative: ፆታን ሳያጎላ ‘ስለ ከተማይቱ’ ብሎ ስሙን መድገም
  rationale: በአማርኛ ‘ከተማይቱ’ በተፈጥሮ የሴት ፆታ ስምምነትን ይወስዳል። ስለዚህ ‘እርሷ’ የግሪኩን αὐτήν በትክክል እያንጸባረቀ በእንግሊዝኛ ያለውን ‘it/her’ ችግር በአማርኛ ላይ አይጭንም፤ ነገር ግን ከተማይቱን በግል አካል መልክ የማቅረብ ዕድሉን አያጠፋም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። አጭሩን የግሪክ ዓረፍተ ነገር ፍሰት ይጠብቃል፤ ኢየሩሳሌም የሚለውን በአውድ የታወቀ ስም አይጨምርም። የእንግሊዝኛው የፆታ አማራጭ በአማርኛ ተፈጥሯዊ የስምምነት ሥርዓት ስለሚፈታ የግርጌ ማስታወሻ አላስፈለገም።
