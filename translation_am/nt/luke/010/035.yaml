  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: am
  text: በማግስቱም ሁለት ዲናር[a] አውጥቶ ለማደሪያ ቤቱ ጠባቂ ሰጠውና፣ ‘ተንከባከበው፤ ከዚህም በላይ ተጨማሪ ወጪ ብታወጣ፣ ስመለስ እመልስልሃለሁ’ አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዲናር በሮማውያን ዘንድ የተለመደ የብር ሳንቲም ሲሆን፣ በግምት የአንድ ሠራተኛ የአንድ ቀን ደመወዝ ያህል ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: በማግስቱም
  rationale: የሚቀጥለውን ቀን የሚያመለክተውን የጊዜ አገላለጽ በተፈጥሯዊና በተለመደ አማርኛ ያቀርባል።
- source_word: ἐκβαλών
  choice: አውጥቶ
  rationale: ገንዘቡን ከያዘበት ማውጣቱን በአጭርና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: δύο δηνάρια
  choice: ሁለት ዲናር
  rationale: የታሪካዊውን ሳንቲም ስም ከመጠኑ ጋር ይጠብቃል፤ ወደ ዘመናዊ ገንዘብ ወይም የቀን ደመወዝ አይለውጠውም።
- source_word: πανδοχεῖ
  choice: ለእንግዳ ቤቱ ጠባቂ
  rationale: ማረፊያውን የሚያስተዳድረውን ሰው በግልጽ ይለያል፤ ሕንፃውን አያመለክትም።
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: ተንከባከበው
  rationale: ትኩረት ያለውን እንክብካቤ በግልጽ የትእዛዝ ቅርጽ ያቀርባል።
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: ከዚህም በላይ የምታወጣውን ማንኛውንም ወጪ
  rationale: προσ- የሚያመለክተውን ተጨማሪ ወጪና ὅ τι ἄν የሚገልጠውን ያልተወሰነ መጠን ሁለቱንም ይጠብቃል።
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: ስመለስ
  rationale: የግሪኩን የጊዜ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀποδώσω σοι
  choice: እከፍልሃለሁ
  rationale: በዐውዱ ያለውን ተጨማሪ ወጪ መመለስን የሚያመለክት ግልጽና ተፈጥሯዊ የገንዘብ አገላለጽ ነው።
