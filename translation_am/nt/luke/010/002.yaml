  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: am
  text: እንዲህም አላቸው፦ “መከሩ ብዙ ነው፤ ሠራተኞቹ ግን ጥቂቶች ናቸው። ስለዚህ የመከሩን ጌታ፣ ወደ ራሱ መከር ሠራተኞችን እንዲልክ[a] ለምኑት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኃይል እንዲልክ።” የግሪኩ ግስ ከተራው “መላክ” የበለጠ ጠንካራ ስሜት ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: አላቸው
  rationale: የግሪኩ ያልተፈጸመ ጊዜ በትረካ መግቢያ ውስጥ በተፈጥሯዊ አማርኛ በቀላል ያለፈ ጊዜ ተተርጉሟል።
- source_word: δὲ
  choice: እንዲህም
  rationale: ቀላል የትረካ ትስስሩን ያሳያል፤ እዚህ የጠነከረ ተቃርኖ አያመለክትም።
- source_word: θερισμός
  choice: መከር
  rationale: ቃሉን በቀጥታ የሚያስተላልፍና ግብርናዊውን ዘይቤ የሚጠብቅ የተለመደ አማርኛ ነው።
- source_word: πολύς
  choice: ብዙ
  rationale: የመከሩን ብዛት በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐργάται
  choice: ሠራተኞች
  rationale: መከሩን የሚሰበስቡ ሰዎችን በዘመናዊና ለሁሉም በሚገባ ቃል ይገልጣል።
- source_word: ὀλίγοι
  choice: ጥቂቶች
  rationale: ከ‘ብዙ’ ጋር ያለውን ተቃርኖ በአጭርና ግልጽ መንገድ ያቀርባል።
- source_word: δεήθητε
  choice: ለምኑት
  rationale: ትእዛዛዊውን ኃይልና የጽኑ ልመናን ስሜት ይጠብቃል፤ በአማርኛም ለጸሎት ተፈጥሯዊ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከመከሩ ብዛትና ከሠራተኞቹ ማነስ የሚነሳውን ድምዳሜ በግልጽ ያሳያል።
- source_word: κύριος
  choice: ጌታ
  rationale: ባለቤትነትንና ሥልጣንን ሁለቱንም የሚያስተላልፍ የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
- source_word: ὅπως
  choice: እንዲልክ
  rationale: የልመናውን ይዘትና ዓላማ በተፈጥሯዊ የአማርኛ ንዑስ አረፍተ ነገር ያቀርባል።
- source_word: ἐκβάλῃ
  choice: እንዲልክ
  rationale: በዚህ ዐውድ ‘መላክ’ ተፈጥሯዊ ነው፤ ሆኖም የግሪኩ ግስ የበለጠ ጠንካራ የማስወጣት ስሜት ሊኖረው ስለሚችል በማስታወሻ ተጠብቋል።
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: ወደ መከሩ
  rationale: የአቅጣጫውንና የባለቤትነቱን ኃይል ይጠብቃል፤ ‘እርሻ’ የሚል በምንጩ ያልተገለጸ ቃል አይጨምርም።
theological_decisions:
- issue: ‘የመከሩ ጌታ’ የሚለው ማንነትና ሥልጣን
  choice: ‘የመከሩ ጌታ’ የሚለውን ዘይቤያዊ ማዕረግ ያለ ተጨማሪ ማብራሪያ ማቆየት
  alternative: በቀጥታ ‘እግዚአብሔር’ ብሎ መግለጽ ወይም ኢየሱስን በግልጽ ከማዕረጉ ጋር ማያያዝ
  rationale: ጽሑፉ የመከሩ ባለቤትና ሠራተኞችን የሚያሰማራ መለኮታዊ ሥልጣን እንዳለ ያሳያል፤ ነገር ግን በዚህ ቁጥር ማንነቱን በተጨማሪ አይተነትንም። ስለዚህ የጽሑፉ የሥነ መለኮት ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግብርናው ዘይቤ፣ የብዛትና የማነስ ተቃርኖ፣ እንዲሁም የልመናው ትእዛዛዊ ኃይል ተጠብቀዋል።
