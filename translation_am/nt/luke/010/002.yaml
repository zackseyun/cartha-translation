review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the plentiful harvest, few workers, imperative petition, and the title ‘Lord of the harvest.’ However, the explicit possessive αὐτοῦ (‘his’) in the final phrase is not represented distinctly in ‘ወደ መከሩ’; it should be retained as ‘ወደ ራሱ መከር.’
  naturalness: The wording is clear, modern, and suitably dignified. ‘እንዲህም አላቸው’ and ‘ለምኑት’ are natural in this narrative and prayer context. The revised final phrase remains natural while making the possessive explicit.
  terminology: ‘መከር,’ ‘ሠራተኞች,’ and ‘የመከሩ ጌታ’ are appropriate, consistent renderings. The footnote should express the stronger possible force of ἐκβάλῃ without making coercion (‘አስገድዶ’) the asserted meaning.
  issues:
  - severity: medium
    issue: The explicit possessive αὐτοῦ is not distinctly translated in the final phrase.
    rationale: Although the preceding title may allow readers to infer the referent, the Greek explicitly says that the workers are sent into ‘his harvest.’ ‘ወደ ራሱ መከር’ preserves this detail without adding ‘field.’
  - severity: low
    issue: The footnote alternative ‘አስገድዶ እንዲያስወጣ’ is too coercive as a direct alternative.
    rationale: ἐκβάλῃ can carry a forceful sense, but the context does not require the specific notion of compelling unwilling workers. ‘በኃይል እንዲልክ’ better preserves the lexical nuance as a possibility.
  revised_text: እንዲህም አላቸው፦ “መከሩ ብዙ ነው፤ ሠራተኞቹ ግን ጥቂቶች ናቸው። ስለዚህ የመከሩን ጌታ፣ ወደ ራሱ መከር ሠራተኞችን እንዲልክ[a] ለምኑት።”
