language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: am
  text: እርሱም፣ “በሕጉ ምን ተጽፏል? እንዴትስ ታነበዋለህ?[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዴት ትተረጉመዋለህ?” የግሪኩ ቃል በጥሬው፣ “እንዴት ታነበዋለህ?” ይላል፤ ነገር ግን የመረዳትን ወይም የመተርጎምን ሐሳብም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱም
  rationale: δέ ቀላል የትረካ አያያዥ ነው፤ “-ም” የንግግሩን ፍሰት ያስቀጥላል እንጂ ጠንካራ ተቃርኖ አያስገባም። ὁ በዚህ ስፍራ ተውላጠ ስም ሆኖ “እርሱ” የሚለውን ያመለክታል።
- source_word: εἶπεν πρὸς αὐτόν
  choice: አለው
  rationale: በዘመናዊ አማርኛ ተናጋሪው ለተጠሪው መናገሩን በተፈጥሮ ይገልጣል፤ የπρός + ተሳቢ አድራሻ በ“-ው” ተጠብቋል።
- source_word: Ἐν τῷ νόμῳ
  choice: በሕጉ
  rationale: νόμος እዚህ የእስራኤልን የታወቀ ቅዱስ የሕግ መጻሕፍት ያመለክታል፤ የውስንነት “-ው” ይህን የታወቀ ማጣቀሻ ያሳያል።
- source_word: τί γέγραπται
  choice: ምን ተጽፎአል?
  rationale: የፍጹም ጊዜ ተደራጊ ቅርጹ የተጻፈው አሁንም ጽሑፍ ሆኖ መኖሩን ያሳያል፤ “ተጽፎአል” ይህን ሁኔታ በተፈጥሮ ይጠብቃል።
- source_word: πῶς ἀναγινώσκεις
  choice: እንዴትስ ታነበዋለህ?
  rationale: ἀναγινώσκεις በቀጥታ “ታነባለህ” ማለት ነው፤ በዐውዱ ግን የመረዳትን ወይም የመተርጎምን ስሜት ሊያካትት ይችላል። ዋናው ጽሑፍ ቀጥተኛውን ቃል ጠብቆ አሻሚነቱን ያቆያል።
theological_decisions:
- issue: በኢየሱስ ጥያቄ ውስጥ νόμος የሚያመለክተው
  choice: ለእስራኤል የተሰጠውና እንደ ቅዱስ መጽሐፍ የታወቀው ሕግ፣ “ሕጉ” ተብሎ ተተርጉሟል
  alternative: “ኦሪት” ወይም በጠቅላላው “ሕግ”
  rationale: ዐውዱ ከሕግ ዐዋቂ ጋር የተደረገ ውይይት ነው። “ሕጉ” የታወቀውን የቅዱስ መጽሐፍ ሕግ ያመለክታል፣ ነገር ግን ከግሪኩ በላይ ወሰኑን አያጠብም።
- issue: የπῶς ἀναγινώσκεις የትርጓሜ ጥላ
  choice: ቀጥተኛው “እንዴትስ ታነበዋለህ?” ተጠብቋል
  alternative: “እንዴት ትተረጉመዋለህ?”
  rationale: ጥያቄው ንባብን ብቻ ሳይሆን መረዳትንም ሊመረምር ይችላል፤ ሆኖም የግሪኩ ግስ “ማንበብ” ነው። ቀጥተኛውን አገላለጽ ማቆየት የንግግሩን ሥነ ንግግራዊና ሥነ መለኮታዊ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አለው” ተፈጥሯዊ የቀጥታ ንግግር አወቃቀር ሲሆን፣ “ሕጉ” የታወቀውን የቅዱስ መጽሐፍ ሕግ ያመለክታል።
