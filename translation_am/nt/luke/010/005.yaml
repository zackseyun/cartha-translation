review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the directional entry, the priority marked by πρῶτον, the imperative λέγετε, and the peace-blessing directed to the house. However, its opening repeats the action of entering and is not a faithful or idiomatic representation of the single Greek verb εἰσέλθητε.
  naturalness: The wording “ወደምትገቡበትም ማንኛውም ቤት ስትገቡ” is syntactically awkward and redundantly says ‘the house into which you enter, when you enter.’ “ወደ ማንኛውም ቤት በገባችሁ ጊዜ” is clear, natural modern standard Amharic, and retains the general/indefinite sense.
  terminology: “ቤት” appropriately represents both οἰκία and οἶκος in this context. “ሰላም ለዚህ ቤት ይሁን” is a natural Amharic blessing formula and appropriately conveys the concise Greek nominative greeting without doctrinal expansion.
  issues:
  - severity: medium
    issue: Redundant and awkward rendering of the opening indefinite relative clause
    rationale: The draft uses both “ወደምትገቡበት” and “ስትገቡ,” redundantly expressing εἰσέλθητε twice. This impairs naturalness and obscures the simple general condition expressed by εἰς ἣν δ’ ἂν ... εἰσέλθητε.
  - severity: low
    issue: Placement/form of πρῶτον
    rationale: “አስቀድማችሁ” is understandable, but “በመጀመሪያ” more directly and idiomatically marks that the greeting is the first action upon entering.
  revised_text: ወደ ማንኛውም ቤት በገባችሁ ጊዜ፣ በመጀመሪያ፣ ‘ሰላም ለዚህ ቤት ይሁን’ በሉ።
  revised_footnotes: []
  revision_rationale: The revision removes the duplicated expression of entering while preserving the Greek’s directional and indefinite-general sense. It uses a more idiomatic sequential expression for πρῶτον. The blessing formula is retained because it is natural Amharic and faithfully communicates the performative greeting addressed to the house.
