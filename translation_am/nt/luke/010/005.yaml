  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: am
  text: ወደ ማንኛውም ቤት በገባችሁ ጊዜ፣ በመጀመሪያ፣ ‘ሰላም ለዚህ ቤት ይሁን’ በሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν εἰσέλθητε οἰκίαν
  choice: ወደምትገቡበትም ማንኛውም ቤት ስትገቡ
  rationale: የεἰςን አቅጣጫዊ ኃይልና ከἄν ጋር ያለውን ያልተወሰነ አንጻራዊ አገላለጽ ይጠብቃል፤ በዘመናዊ አማርኛም ግልጽ ነው።
- source_word: πρῶτον
  choice: አስቀድማችሁ
  rationale: ወደ ቤቱ እንደገቡ መጀመሪያ ሊያደርጉት የሚገባውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγετε
  choice: በሉ
  rationale: የግሪኩን ትእዛዛዊ አገላለጽ በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: Εἰρήνη τῷ οἴκῳ τούτῳ
  choice: ሰላም ለዚህ ቤት ይሁን
  rationale: አጭሩን የሰላም ምኞትና ቡራኬ ቀመር በአማርኛ እንደ እውነተኛ ቡራኬ የሚሰማ አገላለጽ ያቀርባል፤ የዳቲቩን ተቀባይም “ለዚህ ቤት” በማለት ይጠብቃል።
theological_decisions:
- issue: የሰላም ቀመሩ ባሕርይ
  choice: እንደ የተነገረ ቡራኬና ሰላምታ፣ “ሰላም ለዚህ ቤት ይሁን” ተተርጉሟል።
  alternative: “ሰላም ለዚህ ቤት” ወይም “ሰላም በዚህ ቤት ላይ ይሁን”
  rationale: ጽሑፉ ሰላምን በቤቱ ላይ እንዲናገሩ ያዛል። “ይሁን” በአማርኛ የቡራኬውን ተግባራዊ ኃይል ያሳያል፣ ነገር ግን ልዩ ሥርዓተ አምልኮዊ ቃላትን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በግሪኩ ውስጥ ያለው አጭር የቡራኬ ቀመር በአማርኛ ሰዋስው ምክንያት “ይሁን” በማከል ተፈጥሯዊ ሆኗል።
