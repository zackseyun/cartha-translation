base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: am
  text: በዚያም ያሉትን በሽተኞች ፈውሱ፤ ‘የእግዚአብሔር መንግሥት ወደ እናንተ ቀርቧል’[a] በሏቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘የእግዚአብሔር መንግሥት ወደ እናንተ ተቃርቧል።’
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύετε
  choice: ፈውሱ
  rationale: የአሁን ጊዜ ትእዛዛዊ ግስ ሲሆን በዚህ የተልእኮ አውድ ውስጥ ለታመሙት ፈውስን መስጠት የሚለውን ቀጥተኛ ትርጉም ያስተላልፋል።
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: በዚያም ያሉትን በሽተኞች
  rationale: ἀσθενεῖς ‘ደካሞች’ ወይም ‘በሽተኞች’ ሊሆን ቢችልም፣ θεραπεύετε ከሚለው ግስ ጋር አካላዊ ሕመም ዋናው ሐሳብ ነው። αὐτῇ በቀደመው ቁጥር የተጠቀሰችውን ከተማ ያመለክታል።
- source_word: λέγετε αὐτοῖς
  choice: በሏቸው
  rationale: ቀላልና ቀጥተኛውን የንግግር ትእዛዝ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἤγγικεν
  choice: ቀርቧል
  rationale: የግሪኩ ፍጹም ጊዜ መቅረቡ ተፈጽሞ አሁንም ጠቀሜታ እንዳለው ያሳያል፤ ‘ቀርቧል’ ይህን ያለፈና የአሁን ተዛምዶ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἐφ’ ὑμᾶς
  choice: ወደ እናንተ
  rationale: ከἐγγίζω ጋር የመቅረብን አቅጣጫና ከሰሚዎቹ ጋር ያለውን ቅርበት ይገልጣል። ‘ወደ እናንተ’ ተፈጥሯዊ ነው፤ ‘በእናንተ ላይ’ የግሪኩን ቅርጽ ይበልጥ ቢከተልም በአማርኛ የተቃውሞ ስሜት ሊያስከትል ይችላል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ የእግዚአብሔርን ንግሥናም ሆነ የእርሱን ግዛት ሳያጠብ ያስተላልፋል።
theological_decisions:
- issue: የመንግሥቱ መቅረብ ትርጉም
  choice: የእግዚአብሔር መንግሥት ‘ቀርቧል’ ተብሎ ተተርጉሟል፤ ይህም በኢየሱስ መልእክተኞች ተልእኮ ውስጥ የመንግሥቱን የአሁን ቅርበት ያውጃል።
  alternative: መንግሥቱ አሁን ሙሉ በሙሉ ተገኝቷል፣ ወይም ገና ወደፊት ብቻ ይመጣል።
  rationale: Ἤγγικεν ቅርበትንና የአሁን ጠቀሜታን ይገልጣል፤ ነገር ግን ጥቅሱ መንግሥቱ ሙሉ በሙሉ መፈጸሙን ወይም ለወደፊት ብቻ መሆኑን አይወስንም። ትርጉሙ ይህን የሥነ መለኮት ውጥረት ክፍት ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በዚያ’ የሚለው በቀደመው ቁጥር ያለችውን ከተማ በተፈጥሯዊ መንገድ ይመልሳል።
