  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: am
  text: እንዲሁም አንድ ሌዋዊ ወደዚያ ስፍራ መጥቶ ባየው ጊዜ፣ በማዶ በኩል አልፎ ሄደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በማዶ በኩል አልፎ ሄደ» የሚለው «አልፎ ሄደ» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ የተዋሐደ ግስ ግን ከእርሱ ርቆ በሌላው ወገን ማለፉን ሊጠቁም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: እንዲሁም
  rationale: የሌዋዊውን ድርጊት ቀደም ሲል ከተጠቀሰው ካህን ድርጊት ጋር በተፈጥሯዊ አማርኛ ያዛምዳል።
- source_word: δὲ καὶ
  choice: አንድ
  rationale: የδέ ቀላል አያያዥነት በዓረፍተ ነገሩ ፍሰት ተገልጧል፤ καί የሚያሳየው ተጨማሪ ተመሳሳይ ምሳሌም በ«እንዲሁም» በበቂ ሁኔታ ተላልፏል። «አንድ» ደግሞ በአማርኛ ትረካ ውስጥ ግለሰቡን በተፈጥሮ ያስተዋውቃል።
- source_word: Λευίτης
  choice: ሌዋዊ
  rationale: ታሪካዊውንና ማኅበራዊ-ሃይማኖታዊውን መለያ ሳያጠቃልል የሚጠብቅ በአማርኛ የተለመደ ስያሜ ነው።
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: ወደዚያ ስፍራ መጥቶ
  rationale: ግለሰቡ በተጠቀሰው ቦታ መድረሱን ያሳያል፤ የግሪኩን ቦዝ አንቀጽ ቅደም ተከተልም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ ἰδὼν
  choice: ባየው ጊዜ
  rationale: የማየቱ ድርጊት ከማለፉ በፊት መሆኑን ያብራራል፤ «ው» ከአውዱ የሚታወቀውን የተጎዳውን ሰው ይጠቁማል።
- source_word: ἀντιπαρῆλθεν
  choice: በማዶ በኩል አልፎ ሄደ
  rationale: የተዋሐደው ግስ በቀላሉ ማለፍን ብቻ ሳይሆን በተቃራኒው ወገን በኩል ተለይቶ ማለፍን እንደሚጠቁም ያስተላልፋል።
theological_decisions:
- issue: የΛευίτης ማኅበራዊና ሃይማኖታዊ ማንነት
  choice: ሌዋዊ
  alternative: የቤተ መቅደስ አገልጋይ፤ የሌዊ ነገድ አባል
  rationale: ጽሑፉ ከካህኑ ጋር በትይዩ የሚታወቅ የአይሁድ ሃይማኖታዊ ቡድን መለያ ይጠቀማል። «ሌዋዊ» የተባለውን ስያሜ መጠበቅ በዋናው ጽሑፍ ውስጥ ተጨማሪ ትርጓሜ ሳያስገባ ታሪካዊ ልዩነቱን ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሌዋዊ» የሚለው ታሪካዊ ስያሜ ተጠብቋል፤ የἀντιπαρῆλθεν ሙሉ ኃይል በዋናው ጽሑፍ ተላልፎ ሊኖር የሚችለው አጭር አማራጭ በግርጌ ማስታወሻ ቀርቧል።
