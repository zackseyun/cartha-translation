language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: am
  text: ከእነዚህም በኋላ ጌታ ሌሎች ሰባ ሁለት[a] ሰዎችን ደግሞ ሾመ፤ እርሱ ራሱ ሊሄድባቸው ወደ ነበሩ ከተሞችና ስፍራዎች ሁሉ ከፊቱ ሁለት ሁለት አድርጎ ላካቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ሰባ ሁለት” በሚለው ፈንታ “ሰባ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ከዚህም በኋላ
  rationale: የጊዜውን ሽግግርና የግሪኩን ብዙ ቁጥር አመልካች በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀνέδειξεν
  choice: ሾመ
  rationale: ግሱ ሰዎቹን ለተወሰነ ተግባር መምረጥንና መመደብን ያመለክታል፤ “ሾመ” በአማርኛ ግልጽና አጭር ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በዚህ አውድ ኢየሱስን የሚያመለክተውን የκύριος የተለመደ አማርኛ አተረጓጎም ይጠብቃል።
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: ሌሎች ሰባ ሁለት ሰዎችን ደግሞ
  rationale: ἑτέρους የተጨማሪ ሰዎችን ያመለክታል፤ καί ደግሞ የመጨመርን ሐሳብ ይይዛል። SBLGNT ያለው “ሰባ ሁለት” በዋናው ጽሑፍ ተቀምጦ፣ “ሰባ” የሚለው ልዩነት በማስታወሻ ተጠብቋል።
- source_word: ἀπέστειλεν
  choice: ላካቸው
  rationale: ቃሉን ያለ አስፈላጊ ያልሆነ ሥነ መለኮታዊ ጭነት ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: ἀνὰ δύο δύο
  choice: ሁለት ሁለት አድርጎ
  rationale: የግሪኩን የማከፋፈል አገላለጽና ድግግሞሽ ጠብቆ፣ በጥንድ መላካቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸ προσώπου αὐτοῦ
  choice: ከፊቱ
  rationale: ከእርሱ መድረስ በፊት ቀድመው እንደተላኩ በአጭርና ፈሊጣዊ አማርኛ ያመለክታል።
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: ወደነበሩት ከተሞችና ስፍራዎች ሁሉ
  rationale: πόλις እና τόπος የሚሉትን ሁለቱንም ስሞች ሳያዋህድ ይጠብቃል፤ πᾶσαν የሚለውንም “ሁሉ” በማለት ያስተላልፋል።
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: እርሱ ራሱ ሊሄድባቸው ወደነበሩት
  rationale: αὐτός ያለውን አጽንዖት “እርሱ ራሱ” በማለት ይጠብቃል፤ μέλλω የሚያሳየውን ቀራቢ ወይም የታሰበ የወደፊት ድርጊት “ሊሄድ” በማለት በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የተሾሙት ሰዎች ቁጥር ያለው የጽሑፍ ልዩነት
  choice: ሰባ ሁለት
  alternative: ሰባ
  rationale: የቀረበው SBLGNT ጽሑፍ ἑβδομήκοντα δύο (“ሰባ ሁለት”) ይላል። “ሰባ” የሚለው ጉልህ የእጅ ጽሑፍ ልዩነት ስለሆነ ሳይደበቅ በእግር ማስታወሻ ቀርቧል፤ ጉዳዩ የጽሑፍ እንጂ የአንድ ወገን ዶክትሪን ምርጫ አይደለም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ሁለት ሁለት” የግሪኩን ድግግሞሽ ሲጠብቅ፣ የዓረፍተ ነገሩ አወቃቀር ለአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል።
