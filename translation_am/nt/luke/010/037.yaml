  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: am
  text: እርሱም፣ “ምሕረት ያደረገለት ነው” አለ። ኢየሱስም፣ “ሂድ፤ አንተም እንደዚሁ አድርግ” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: ምሕረት ያደረገለት ነው
  rationale: የግሪኩን ‘ከእርሱ ጋር ምሕረትን ያደረገው’ ፈሊጣዊ አነጋገር በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Πορεύου
  choice: ሂድ
  rationale: የአሁን ጊዜ ትእዛዛዊ ቅርጹን በቀጥተኛና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: አንተም እንደዚሁ አድርግ
  rationale: καὶ σὺ የሚሰጠውን አጽንዖት ‘አንተም’ በማለት ይጠብቃል፤ ποίει የቀጣይ ተግባርን ሊያመለክት ቢችልም በአማርኛ ተፈጥሯዊው ‘አድርግ’ ነው።
theological_decisions:
- issue: የኢየሱስ ትእዛዝ ውስጥ ያለው የσὺ አጽንዖት
  choice: አንተም እንደዚሁ አድርግ
  alternative: እንደዚሁ አድርግ
  rationale: ግልጽ የሆነውን σὺ በመተርጎም ትእዛዙ ለሕግ አዋቂው በግል የተሰጠ መሆኑን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ፤ የግሪኩ አጽንዖትና የንግግር ቅደም ተከተል ተጠብቋል።
