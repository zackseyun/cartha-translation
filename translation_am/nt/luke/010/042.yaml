- source_word: χρεία
  choice: ያስፈልጋሉ
  rationale: ἐστιν χρεία የሚለውን የአስፈላጊነት ፈሊጣዊ አገላለጽ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἢ ἑνός
  choice: ወይም አንድ ብቻ
