  rationale: የግሪኩ ቃል በቀጥታ «መልካም» ነው እንጂ ንጽጽራዊ «የተሻለ» አይደለም፤ ስለዚህ በጽሑፉ የሌለ ንጽጽር አልተጨመረም።
