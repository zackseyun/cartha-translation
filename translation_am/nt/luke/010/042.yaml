  source_fidelity: The draft accurately conveys the difficult πρώ clause without deciding whether it concerns meal dishes or one essential matter, and it correctly renders Mary's deliberate choice and the future passive promise. The phrase "እርሱም" is less suitable as the rendering of the relative clause because it is a personal masculine pronoun and can momentarily be read as referring to a person rather than to the chosen portion.
