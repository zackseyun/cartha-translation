  alternative: «አንድ ነገር ብቻ አስፈላጊ ነው» ወይም «ጥቂት ምግቦች፣ እንዲያውም አንድ ብቻ ያስፈልጋል»
  rationale: የግሪኩ አገላለጽ ለምግብ ዝግጅት የተሰጠ ተግባራዊ ምክርንም ሆነ ሰፊ መንፈሳዊ ንጽጽርን ሊያመለክት ይችላል፤ ትርጉሙ ይህን ውጥረት አይፈታውም።
- issue: ἀγαθὴν የሚለው ተራ ወይስ ንጽጽራዊ ትርጉም
  choice: «መልካሙን»
