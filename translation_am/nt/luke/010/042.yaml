  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: τὴν ἀγαθὴν μερίδα
  choice: መልካሙን ድርሻ
  rationale: ἀγαθήን «መልካም» ብሎ ያለ ንጽጽራዊ ትርጉም ይተረጉማል፤ «ድርሻ» ደግሞ የምግብ እድልና ዋጋ ያለው ምሳሌያዊ እድል የሚሉትን ሁለቱንም የትርጉም አቅጣጫዎች ሊሸከም ይችላል።
- source_word: ἐξελέξατο
  choice: መርጣለች
  rationale: የግሷን ሆን ብሎ የሚደረግ የግል ምርጫና የዚያን ምርጫ ዘላቂ ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
