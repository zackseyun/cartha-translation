    reason: alternative_reading
  - marker: b
    text: ወይም፣ «መልካሙን ክፍል።» «ድርሻ» የሚለው ቃል የምግብን ድርሻና በእውነት ዋጋ ያለውን ምሳሌያዊ ድርሻ ሁለቱንም ሆን ብሎ ሊያስተጋባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
