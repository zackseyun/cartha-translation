    issue: The second exclusive-knowledge clause has ambiguous coordination.
    rationale: 'Greek has two distinct exceptions: “except the Son” and “anyone to whom the Son chooses to reveal [the Father].” The draft’s «ከወልድና ወልድ አብን ... ሰው በቀር» joins them under a single «ከ… በቀር» construction, obscuring the intended alternatives. Repeating «ከ… በቀር» resolves this while preserving the source syntax and meaning.'
