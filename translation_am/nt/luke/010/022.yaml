  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: am
  text: ነገር ሁሉ በአባቴ ለእኔ ተሰጥቶኛል[a]። ወልድ ማን እንደሆነ ከአብ በቀር ማንም አያውቅም፤ አብም ማን እንደሆነ ከወልድ በቀር፣ ወልድ አብን ሊገልጥለት ከፈቀደው ሰው በቀር ማንም አያውቅም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁሉም ነገር በአባቴ ለእኔ ተሰጥቶኛል።»
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ነገር ሁሉ
  rationale: የግሪኩን ሰፊና አጠቃላይ ወሰን ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: παρεδόθη
  choice: ተሰጥቶኛል
  rationale: የተፈጸመውን የማስረከብ ድርጊትና የሚቀጥለውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘አደራ ተሰጠኝ’ የሚለውን ጠባብ ትርጉም አያስገባም።
- source_word: ὑπὸ τοῦ πατρός μου
  choice: በአባቴ
  rationale: ὑπό ከዝርያ ስም ጋር በተገብሮ አነጋገር የድርጊቱን አድራጊ ያመለክታል።
- source_word: γινώσκει
  choice: ያውቃል
  rationale: ቀጥተኛውን ‘ማወቅ’ የሚለውን ትርጉም ይጠብቃል፤ ‘ፈጽሞ ያውቃል’ የሚል በግልጽ ያልተጻፈ ማጠናከሪያ አይጨምርም።
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: ወልድ ማን እንደሆነ / አብ ማን እንደሆነ
  rationale: የግለሰባዊና የግንኙነት ኃይሉን ሳያብራራ በአማርኛ ተፈጥሯዊ ቅርጽ ያቀርባል።
- source_word: ὁ υἱός / ὁ πατήρ
  choice: ወልድ / አብ
  rationale: በዚህ ክርስቶሳዊ አውድ የማዕረግና የግንኙነት መጠሪያዎች ስለሆኑ በአማርኛ የተለመዱት ክቡር ቃላት ተመርጠዋል።
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ወልድ አብን ሊገልጥለት ከፈቀደው ሰው
  rationale: የተቀባዩን ያልተወሰነነት፣ የወልድን ፈቃድና የመግለጥ ድርጊት ይጠብቃል። በግሪኩ ከቀደመው ንግግር የሚገባው ‘አብን’ የሚለው ተሳቢ በአማርኛ ለግልጽነት ተገልጿል።
- source_word: βούληται
  choice: ከፈቀደው
  rationale: የወልድን ውሳኔ ያለው ፈቃድ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀποκαλύψαι
  choice: ሊገልጥለት
  rationale: የመለኮታዊ መገለጥን ትርጉም የሚጠብቅ መደበኛና ግልጽ አገላለጽ ነው።
theological_decisions:
- issue: በአብና በወልድ መካከል ያለው ልዩ የእርስ በርስ እውቀት
  choice: የልዩ የእርስ በርስ እውቀት ቀጥተኛ አነጋገር ያለ ማስፋፊያ ተጠብቋል።
  alternative: ‘ፈጽሞ ያውቃል’ ወይም ‘በእውነት ያውቃል’ የሚል ትርጓሜያዊ ማጠናከሪያ መጨመር።
  rationale: አወቃቀሩ ራሱ ያለውን ከባድ ክርስቶሳዊ አሳብ ያስተላልፋል፤ γινώσκει ላይ ያልተጻፈ ቃል መጨመር አያስፈልግም።
- issue: የወልድ የመግለጥ ፈቃድና ወሰን
  choice: βούληται ‘ከፈቀደው’ ተብሎ ተተርጉሞ ወልድ የሚገልጥ ወሳኝ አድራጊ መሆኑ ተጠብቋል።
  alternative: ‘ከወደደው’ ወይም የወልድን አድራጊነት የሚያለዝብ አባባል።
  rationale: ግሪኩ መግለጡን ከወልድ ፈቃድ ጋር ያያይዛል፤ ትርጉሙ ይህን ሳያዳክምና ከጽሑፉ በላይ የሥነ መለኮት ሥርዓት ሳይጫን ያቀርበዋል።
