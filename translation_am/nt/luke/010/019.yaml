source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: am
  text: እነሆ፣ እባቦችንና ጊንጦችን[a] እንድትረግጡ፣ በጠላትም ኃይል ሁሉ ላይ ሥልጣን ሰጥቻችኋለሁ፤ ምንም ነገር ፈጽሞ አይጎዳችሁም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል ‘እባቦችና ጊንጦች’። በአውዱ ይህ ምስል ጠላት የሆኑ መንፈሳዊ ኃይሎችንም ሊያስታውስ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም ‘ምንም ነገር በምንም መንገድ አይጎዳችሁም።’ የግሪኩ አገላለጽ እጅግ አጽንዖታዊ ክልከላ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የንግግር ምልክት በክብር ያለውና ለዘመናዊ አንባቢ ግልጽ በሆነ ቃል ያቆያል።
- source_word: δέδωκα
  choice: ሰጥቻችኋለሁ
  rationale: የግሪኩን ፍጹም ጊዜ፣ ማለትም ተፈጽሞ አሁንም ውጤቱ የሚኖርን ድርጊት፣ ይገልጣል።
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: የተሰጠ መብትንና ሥልጣንን ይገልጣል፤ በኋላ ካለው δύναμις ‘ኃይል’ ጋር ያለውን የቃላት ልዩነትም ይጠብቃል።
- source_word: τοῦ πατεῖν
  choice: እንድትረግጡ
  rationale: የተሰጠውን ሥልጣን ዓላማና ይዘት በተፈጥሯዊ አማርኛ ያሳያል፤ የመርገጥንም ምስል ይጠብቃል።
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: እባቦችንና ጊንጦችን
  rationale: ቀጥተኛውን ምስል በተለመደ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: በ…ኃይል ሁሉ ላይ
  rationale: ከጠላት ኃይል በላይ የሆነውን ሥልጣንና የበላይነት ያሳያል።
- source_word: δύναμιν
  choice: ኃይል
  rationale: ከἐξουσία ‘ሥልጣን’ የተለየውን የአቅም ወይም የኃይል ትርጉም ይጠብቃል።
- source_word: τοῦ ἐχθροῦ
  choice: የጠላት
  rationale: ግሪኩ የሚለውን ነጠላና ግለሰባዊ መጠሪያ ሰይጣን ወይም ዲያብሎስ ብሎ ሳይጨምር በቀጥታ ይተረጉማል።
- source_word: οὐδὲν … οὐ μὴ ἀδικήσῃ
  choice: ምንም ነገር ፈጽሞ አይጎዳችሁም
  rationale: οὐ μή ያለውን አጽንዖታዊ ክልከላ ‘ፈጽሞ’ በማለት በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘ጠላት’ የሚለው ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ ‘ጠላት’ ተብሎ በአጠቃላይ ተተርጉሟል።
  alternative: ‘ሰይጣን’ ወይም ‘ዲያብሎስ’
  rationale: አውዱ የሰይጣንን ተቃውሞ ቢጠቁምም ግሪኩ በቀጥታ ‘ጠላት’ ብቻ ይላል፤ ስለዚህ ጽሑፉ ያልገለጸው ማንነት አልተጨመረም።
- issue: ‘እባቦችና ጊንጦች’ ቀጥተኛ ወይም ምሳሌያዊ ትርጉም
  choice: ቀጥተኛው ምስል በዋናው ጽሑፍ ተጠብቋል።
  alternative: የክፉ መንፈሳዊ ኃይሎች ምሳሌ ብሎ በግልጽ መተርጎም
  rationale: ቃላቱ በቀጥታ እባቦችንና ጊንጦችን ይጠቅሳሉ፤ አውዱ መንፈሳዊ ጠላትነትን ሊያስታውስ ቢችልም ትርጉሙ ይህን ውጥረት ሳይፈታ አቆይቶታል።
- issue: ‘አይጎዳችሁም’ የሚለው የተስፋ አጽንዖት
  choice: የግሪኩ ጠንካራ ክልከላ ‘ፈጽሞ’ በሚለው ቃል ተገልጧል።
  alternative: ‘አይጎዳችሁም’ ብቻ
  rationale: οὐδέν … οὐ μή የሚለው አወቃቀር ተራ ክልከላ ሳይሆን አጽንዖታዊ ነው፤ ትርጉሙም ያንን የቋንቋ ኃይል ጠብቋል።
