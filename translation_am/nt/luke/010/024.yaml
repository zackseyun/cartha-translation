  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: am
  text: እላችኋለሁና፣ ብዙ ነቢያትና ነገሥታት እናንተ የምታዩትን ለማየት ተመኙ[a]፣ አላዩምም፤ የምትሰሙትንም ለመስማት ተመኙ፣ አልሰሙምም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፈለጉ” ወይም “ናፈቁ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: እላችኋለሁና
  rationale: λέγω with ὑμῖν is naturally expressed as “እላችኋለሁ,” while the suffixed conjunction “-ና” preserves γάρ as an explanatory link to the preceding statement.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: ብዙ ነቢያትና ነገሥታት
  rationale: This directly preserves both historical categories and renders βασιλεῖς specifically as “ነገሥታት,” rather than broadening it to rulers.
- source_word: ἠθέλησαν
  choice: ተመኙ
  rationale: “ተመኙ” naturally conveys an earnest desire without necessarily intensifying it to profound longing. The verb is repeated in Amharic to maintain a clear, balanced sentence, though it occurs once and governs both infinitives in Greek.
- source_word: ἃ ὑμεῖς βλέπετε
  choice: እናንተ የምታዩትን
  rationale: The explicit “እናንተ” reflects the emphatic Greek pronoun ὑμεῖς, and the relative construction naturally renders “what you see.”
- source_word: καὶ οὐκ εἶδαν
  choice: ነገር ግን አላዩም
  rationale: This states the historical non-attainment clearly and naturally; the object is recoverable from the preceding relative clause.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: የምትሰሙትንም ለመስማት
  rationale: The wording preserves the parallel between seeing and hearing, with “-ም” carrying the coordinating force of καί.
- source_word: καὶ οὐκ ἤκουσαν
  choice: ነገር ግን አልሰሙም
  rationale: This closely parallels the preceding negative clause and preserves the plain historical assertion.
theological_decisions:
- issue: Identity of “prophets and kings”
  choice: ብዙ ነቢያትና ነገሥታት
  alternative: ብዙ ነቢያትና ገዢዎች / የጥንት ነቢያትና ነገሥታት
  rationale: The translation retains the source text’s historical categories without identifying particular persons, broadening kings into rulers, or adding “of old.”
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ነገር ግን” በሁለቱ ተመሳሳይ ክፍሎች የሐሳቡን ተቃርኖ ግልጽ ያደርጋል።
