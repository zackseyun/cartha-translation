  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: am
  text: በዚያም የሰላም ልጅ ቢኖር[a]፣ ሰላማችሁ በእርሱ ላይ ያርፋል፤ ባይኖር ግን፣ ወደ እናንተ ይመለሳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሰላም ሰው”፤ ማለትም ሰላምን የሚያመጣውን መልእክት የሚቀበል ሰው።
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: የሰላም ልጅ
