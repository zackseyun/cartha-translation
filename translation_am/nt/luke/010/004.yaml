base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: am
  text: የገንዘብ ከረጢት፣ የጉዞ ከረጢት[a] ወይም ጫማዎች አትያዙ፤ በመንገድ ላይም ለማንም ሰላምታ አትስጡ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የጉዞ ከረጢት” የሚለው “ቦርሳ” ወይም “ስንቅ መያዣ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህ ትእዛዝ ተራ ጨዋነትን ፈጽሞ የሚከለክል መሆኑ አይቀርም፤ በዚያ ባሕል ጊዜ ሊወስዱ የሚችሉ የሰላምታ ልውውጦች ሳያዘገዩ ተልእኮውን በአስቸኳይ እንዲፈጽሙ የሚያመለክት ሊሆን ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: አትያዙ
  rationale: በጉዞ መመሪያው አውድ ዕቃዎቹን ይዞ መሄድን የሚከለክል ተፈጥሯዊ አማርኛ ነው፤ ‘አትሸከሙ’ ከሚለውም ይልቅ ጫማን ጨምሮ ለዝርዝሩ በሙሉ ይስማማል።
- source_word: βαλλάντιον
  choice: የገንዘብ ከረጢት
  rationale: ገንዘብ ለመያዝ የሚያገለግል ከረጢት መሆኑን በግልጽ ያሳያል።
- source_word: πήραν
  choice: የጉዞ ከረጢት
  rationale: በጉዞ ጊዜ ስንቅና ሌሎች ቁሳቁሶች የሚያዙበትን ከረጢት በዘመናዊና ቀላል ቋንቋ ይገልጣል።
- source_word: ὑποδήματα
  choice: ጫማ
  rationale: የግሪኩ ቃል የእግር መልበሻን ያመለክታል፤ በጥንታዊው አውድ ብዙውን ጊዜ ሳንዳል ቢሆንም ‘ጫማ’ በአማርኛ ተፈጥሯዊና አጠቃላይ ነው።
- source_word: μηδένα
  choice: ለማንም
  rationale: የሰላምታውን ክልከላ ማንንም ሰው ሳይለይ በግልጽ ያስተላልፋል።
- source_word: κατὰ τὴν ὁδόν
  choice: በመንገድም ላይ
  rationale: በጉዞ ላይ ሳሉ ወይም በመንገድ ላይ የሚለውን ተጨባጭ ምስል ይጠብቃል።
- source_word: ἀσπάσησθε
  choice: ሰላምታ አትስጡ
  rationale: በዚህ አውድ የሰላምታ ልውውጥን የሚገልጽ ቀጥተኛና የተለመደ አማርኛ ነው።
theological_decisions:
- issue: በመንገድ ላይ ለሌሎች ሰላምታ አለመስጠት የሚለው ክልከላ ኃይል
  choice: በዋናው ጽሑፍ ‘ለማንም ሰላምታ አትስጡ’ ተብሎ ቀጥተኛ ክልከላ ሆኖ ተተርጉሟል።
  alternative: ‘ረጅም ሰላምታ በመለዋወጥ አትዘግዩ’ ብሎ ትርጉሙን በዋናው ጽሑፍ ማብራራት።
  rationale: የግሪኩ ንግግር ቀጥተኛ ትእዛዝ ነው። የተልእኮውን አስቸኳይነትና በዚያ ባሕል ሰላምታ ጊዜ ሊወስድ መቻሉን በማስታወሻ መግለጽ፣ በዋናው ጽሑፍ ያለውን ኃይልና አሻሚነት ከማለዘብ ይሻላል።
