  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ቀጥተኛ የክልከላ ቅርጽ ተጠብቆ፣ ባሕላዊ ማብራሪያው ወደ ግርጌ ማስታወሻ ተወስዷል።
