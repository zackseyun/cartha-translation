source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: am
  text: 'ወዮልሽ፣ ኮራዚን! ወዮልሽ፣ ቤተ ሳይዳ! በእናንተ መካከል የተከናወኑት የኃይል ሥራዎች[a] በጢሮስና በሲዶና ቢከናወኑ ኖሮ፣ እነርሱ ከረጅም ጊዜ በፊት በማቅና በአመድ ተቀምጠው ንስሐ በገቡ ነበር።


    [a] ወይም፣ “ተአምራት”፤ የግሪኩ ቃል “የኃይል ሥራዎች” ወይም “ኃይልን የሚገልጡ ሥራዎች” ማለት ነው።


    [b] ወይም፣ “ከረጅም ጊዜ በፊት በማቅና በአመድ ተቀምጠው አስተሳሰባቸውን በለወጡ ነበር።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተአምራት”፤ የግሪኩ ቃል “የኃይል ሥራዎች” ወይም “ኃይልን የሚገልጡ ሥራዎች” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከረጅም ጊዜ በፊት በማቅና በአመድ ተቀምጠው አስተሳሰባቸውን በለወጡ ነበር።”
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐαί σοι
  choice: ወዮልሽ
  rationale: የፍርድ ማስጠንቀቂያንና የሐዘን ድምፅን አብሮ ይጠብቃል፤ ንግግሩም ለከተሞቹ በነጠላ አንስታይ ቅርጽ ቀጥታ የቀረበ ነው።
- source_word: Χοραζίν / Βηθσαϊδά
  choice: ኮራዚን / ቤተ ሳይዳ
  rationale: የቦታ ስሞቹ በአማርኛ የተለመደውን የአጻጻፍ ቅርጽ ተከትለው ተጽፈዋል።
- source_word: δυνάμεις
  choice: የኃይል ሥራዎች
  rationale: ቃሉ የኃይልንም ሆነ የተከናወነ ሥራን ሐሳብ ይዟል፤ “ተአምራት” የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: ተከናውነው ... የተከናወኑት
  rationale: የግሪኩን ተደጋጋሚ የመከሰት/የመፈጸም አገላለጽ በተፈጥሯዊ አማርኛ ያንጸባርቃል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ መካከል
  rationale: ሥራዎቹ በከተሞቹ ሕዝብ መካከል መከናወናቸውን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πάλαι
  choice: ከብዙ ጊዜ በፊት
  rationale: በተቃራኒ-ሁኔታው ውስጥ ያለውን የረጅም ጊዜ በፊትነት በግልጽ ያሳያል።
- source_word: ἐν σάκκῳ καὶ σποδῷ καθήμενοι
  choice: ማቅ ለብሰውና አመድ ላይ ተቀምጠው
  rationale: የሐዘንና የንስሐውን ተጨባጭ ምስል በአማርኛ ግልጽ በሆነ መንገድ ይጠብቃል።
- source_word: μετενόησαν
  choice: ንስሐ በገቡ ነበር
  rationale: በሉቃስ ዐውድ ያለውን የሥነ ምግባርና የመንፈስ መመለስ በተለመደ አማርኛ ይገልጣል፤ መሠረታዊው የአስተሳሰብ ለውጥ ሐሳብ በማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: በኢየሱስ አገልግሎት ውስጥ δυνάμεις የሚያመለክተው
  choice: “የኃይል ሥራዎች” ተብሎ ተተርጉሟል።
  alternative: “ተአምራት”
  rationale: ግሪኩ ቃል ከተለመደው ቴክኒካዊ ስያሜ ይልቅ በሥራዎቹ የተገለጠውን ኃይል ያጎላል፤ ትርጉሙ ይህን ክፍት ስፋት ጠብቋል።
- issue: የንስሐው ምስል ኃይል
  choice: “ማቅ ለብሰውና አመድ ላይ ተቀምጠው” የሚለው ተጨባጭ ምስል ተጠብቋል።
  alternative: “በሐዘን ንስሐቸውን ባሳዩ ነበር”
  rationale: ተሳቢውን አገላለጽ ወደ ረቂቅ ሐሳብ ሳያጠቃልል ታሪካዊና ትንቢታዊ ምስሉን ይጠብቃል።
- issue: ያልተፈጸመ ሁኔታዊ ንግግር
  choice: “ቢሆን ኖሮ ... በገቡ ነበር” በሚለው ቅርጽ ተሰጥቷል።
  alternative: ቀጥተኛ የታሪክ ንግግር አድርጎ መተርጎም
  rationale: ጥቅሱ ስለ ጢሮስና ሲዶና የሚናገረውን ተቃራኒ-እውነታዊ ግምት ይጠብቃል፤ መላምቱን እንደተፈጸመ ታሪክ አያቀርብም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ወዮልሽ” የትንቢታዊ ወቀሳንና ሐዘንን ጠብቆ ሲያቀርብ፣ “ማቅ” የመጽሐፍ ቅዱስን ባህላዊ ምስል ይጠብቃል።
