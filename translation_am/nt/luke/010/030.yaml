id: LUK.10.30
reference: Luke 10:30
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አለ፤ “አንድ ሰው ከኢየሩሳሌም ወደ ኢያሪኮ እየወረደ ሳለ በወንበዴዎች እጅ ወደቀ። እነርሱም ልብሱን ገፈፉት፣ ደበደቡትም፤ ሊሞት በቀረ ትተውት ሄዱ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ ὁ Ἰησοῦς εἶπεν
  choice: ኢየሱስም መልሶ እንዲህ አለ
  rationale: ὑπολαμβάνω በዚህ የውይይት አውድ ‘መልሶ መናገር’ ማለት ነው፤ አማርኛውም የንግግሩን ተከታታይነት በተፈጥሯዊ መንገድ ያሳያል።
- source_word: Ἄνθρωπός τις
  choice: አንድ ሰው
  rationale: τις ያልተወሰነን ግለሰብ ያመለክታል፤ ‘አንድ ሰው’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: κατέβαινεν
  choice: እየወረደ ሳለ
  rationale: ያልተጠናቀቀውን የጉዞ ሂደትና ከኢየሩሳሌም ወደ ኢያሪኮ ያለውን ቁልቁለት ይጠብቃል።
- source_word: λῃσταῖς περιέπεσεν
  choice: በወንበዴዎች እጅ ወደቀ
  rationale: περιπίπτω ከ λῃσταί ጋር ሲሆን ድንገት በዘራፊ ወንበዴዎች መያዝን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐκδύσαντες αὐτὸν
  choice: ልብሱን ገፈፉት
  rationale: ግሱ ሰውየውን ልብሱን ማስወለቅን ያመለክታል፤ በአማርኛ ዕቃውን ‘ልብሱን’ በግልጽ መጥቀስ ተፈጥሯዊ ነው።
- source_word: πληγὰς ἐπιθέντες
  choice: ደበደቡትም
  rationale: ቃል በቃል ‘ቁስሎችን/ድብደባዎችን አደረሱበት’ ሲሆን፣ ‘ደበደቡት’ ድርጊቱን በግልጽና ወቅታዊ አማርኛ ይገልጣል።
- source_word: ἀφέντες ἡμιθανῆ
  choice: በግማሽ ሞቶ ትተውት
  rationale: ἡμιθανής ‘በግማሽ የሞተ፣ ሊሞት የቀረው’ የሚለውን ኃይለኛ ምስል ይይዛል፤ ‘በግማሽ ሞቶ’ የምንጩን አገላለጽ ይጠብቃል።
