translation_notes:
  register: ዘመናዊ፣ የተከበረና ለሕዝብ የሚገባ የትረካ አማርኛ ተጠቅሟል። καί የሚያሳየው ተጨማሪ ድርጊት በ‘እነርሱም’ እና በተከታታይ ‘-ም’ ቅንጣቶች ተንጸባርቋል፤ በእንግሊዝኛው ያለውን ‘also’ ለብቻው በማከል አማርኛውን ከማክበድ ተቆጥቧል።
