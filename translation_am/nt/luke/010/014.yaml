  rationale: የግሪኩን ንፅፅር በተፈጥሯዊው የአማርኛ ‘ከ...ይልቅ’ አወቃቀር ያቀርባል።
theological_decisions:
- issue: በዐውዱ የκρίσις ባሕርይ
  choice: ‘በፍርድ ቀን’ የመጨረሻውን ወይም የፍጻሜውን ፍርድ ያመለክታል
  alternative: ‘በፍርድ’ ብቻ በማለት አጠቃላይ ፍርድን ማመልከት
  rationale: ኢየሱስ ንስሐ ያልገቡትን ከተሞች ከጢሮስና ከሲዶና ጋር የሚያነፃፅርበት ዐውድ የመጨረሻውን መለኮታዊ ፍርድ አጥብቆ ይጠቁማል፤ ትርጉሙ ግን ፍርዱን በተጨማሪ የዶክትሪን ዝርዝር አይገልጸውም።
