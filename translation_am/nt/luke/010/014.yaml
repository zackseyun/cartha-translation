- source_word: ἀνεκτότερον
  choice: የሚታገሥ
  rationale: ‘ሊታገሡት የሚችሉት/የሚቻል’ የሚለውን ንፅፅራዊ ትርጉም ይጠብቃል፤ ‘ከ...ይልቅ’ የሚለው አወቃቀር ንፅፅራዊነቱን ያሳያል።
