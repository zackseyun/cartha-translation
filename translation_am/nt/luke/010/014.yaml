- source_word: ἐν τῇ κρίσει
  choice: በፍርድ ቀን
  rationale: በዐውዱ የተወሰነውን መጪውን መለኮታዊ ፍርድ በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ቀን’ በግሪኩ በቀጥታ ባይኖርም የአማርኛውን ሐረግ ግልጽ ያደርጋል።
- source_word: ἢ ὑμῖν
