  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: am
  text: “ከእነዚህ ሦስቱ፣ በወንበዴዎች መካከል ለወደቀው ሰው ባልንጀራ የሆነው የትኛው ይመስልሃል?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነዚህ ሦስቱ በወንበዴዎች መካከል ለወደቀው ሰው ባልንጀራው የነበረው ማን ነው ብለህ ታስባለህ?” ግሪኩ ቃል በቃል «ባልንጀራ የሆነ» የሚል ሲሆን፣ በድርጊት ለሌላው ባልንጀራ መሆንን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: የትኛው
  rationale: ጥያቄው ከተወሰኑት ሦስት አንዱን እንዲመርጥ ስለሚጠይቅ፣ «ማን» ከማለት ይልቅ «የትኛው» የክፍል ምርጫውን በግልጽ ያሳያል።
- source_word: τούτων τῶν τριῶν
  choice: ከእነዚህ ሦስቱ
  rationale: የግሪኩን ክፍላዊ ጄኒቲቭ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በምንጩ ያልተገለጸውን «ሰዎች» አይጨምርም።
- source_word: πλησίον
  choice: ባልንጀራ
  rationale: በዚህ አገባብ πλησίον በቅርብ ያለን ሰው፣ በተለይም የፍቅርና የርኅራኄ ግዴታ የሚፈጸምለትን ሰው ያመለክታል። «ባልንጀራ» ይህን ሰፊ ሰብዓዊ ትርጉም ከመኖሪያ አቅራቢያ ብቻ ከሚያመለክተው «ጎረቤት» ይልቅ ይጠብቃል።
- source_word: δοκεῖ σοι
  choice: ይመስልሃል
  rationale: δοκεῖ የሚለውን «ይመስላል» እና σοι የሚለውን «ለአንተ» በአንድ ተፈጥሯዊ የአማርኛ ግስ ይጠብቃል፤ ወደ «ምን ታስባለህ?» አይቀይረውም።
- source_word: γεγονέναι
  choice: የሆነው
  rationale: የγίνομαιን የመሆን/ወደ አንድ ሁኔታ የመግባት ኃይል ይጠብቃል፤ ጥያቄው ማን ባልንጀራ እንደነበረ ብቻ ሳይሆን ማን በድርጊቱ ባልንጀራ እንደሆነ ያተኩራል።
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: በወንበዴዎች እጅ ለወደቀው ሰው
  rationale: የግሪኩ «ወደ ወንበዴዎች የወደቀው» የሚለውን ፈሊጣዊ አነጋገር በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል። «ሰው» በቀደመው ታሪክ የተጠቀሰውን ተጎጂ ግልጽ ያደርጋል።
theological_decisions:
- issue: በመልካሙ ሳምራዊ ምሳሌ ውስጥ የጥያቄው ሥነ ምግባራዊ ትኩረት
  choice: γεγονέναιን «ባልንጀራ የሆነው» ብሎ መተርጎም
  alternative: «ባልንጀራው የነበረው» ብሎ በቋሚ ሁኔታ መተርጎም
  rationale: የግሪኩ አገላለጽ ባልንጀራዬ ማን ነው ከማለት ወደ ማን ለሌላው ባልንጀራ ሆነ ወደሚለው ያዞራል። «የሆነው» ይህን ሥነ ምግባራዊ ኃይል ያለ ተጨማሪ የትርጓሜ ጭነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ይመስልሃል» የግሪኩን ነጠላ ሰው አድራሻ በተፈጥሯዊ አገላለጽ ይጠብቃል።
