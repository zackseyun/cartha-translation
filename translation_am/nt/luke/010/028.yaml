  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: am
  text: እርሱም፣ “በትክክል መልሰሃል፤ ይህን አድርግ፣ ትኖራለህ[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሰፊው ዐውድ የዘላለምን ሕይወት ይመለከታል (ሉቃስ 10፥25ን ይመልከቱ)፤ እዚህ ግን የግሪኩ ጽሑፍ በቀጥታ «ትኖራለህ» ይላል።
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: እርሱም … አለው
  rationale: εἶπεν ቀላል የትረካ ግስ ሲሆን «አለው» ተብሎ በተፈጥሯዊ አማርኛ ይተረጎማል፤ δέ ያለውን ቀላል የትረካ ትስስር «-ም» ይገልጣል፤ αὐτῷ ደግሞ በ«አለው» ውስጥ ተካትቷል።
- source_word: Ὀρθῶς
  choice: በትክክል
  rationale: ቃሉ «በትክክል/በቅንነት» ማለት ሲሆን፣ እዚህ የተሰጠውን መልስ የሚገመግም ተፈጥሯዊ ዘመናዊ አገላለጽ «በትክክል» ነው።
- source_word: ἀπεκρίθης
  choice: መልሰሃል
  rationale: ሁለተኛ መደብ ነጠላ የሆነውን የተጠናቀቀ ምላሽ፣ አሁን ካለው ግምገማ ጋር በተፈጥሯዊ ሁኔታ ያያይዛል።
- source_word: τοῦτο ποίει
  choice: ይህን አድርግ
  rationale: τοῦτο ቀደም ሲል የተጠቀሰውን ትእዛዝ ያመለክታል፤ ποίει የአሁን ጊዜ ትእዛዝ በመሆኑ ቀጣይነትን ሊያመለክት ቢችልም «አድርግ» ያንን ሳይከለክል አጭርና ተፈጥሯዊ ነው።
- source_word: καὶ ζήσῃ
  choice: በሕይወትም ትኖራለህ
  rationale: ζήσῃ በቀጥታ «ትኖራለህ» የሚል ነው። «በሕይወት ትኖራለህ» በአማርኛ የመኖርን ትርጉም ግልጽ ያደርጋል፣ ነገር ግን «የዘላለም ሕይወትን ትወርሳለህ» የሚል በግሪኩ ያልተጻፈ ማብራሪያ አይጨምርም።
theological_decisions:
- issue: በዐውዱ ውስጥ የ«ትኖራለህ» ወሰን
  choice: ζήσῃን «በሕይወትም ትኖራለህ» ብሎ መተርጎም።
  alternative: «የዘላለም ሕይወትን ትወርሳለህ» ወይም «ሕይወት ይኖርሃል»
  rationale: ሉቃስ 10፥25 ያለው ሰፊ ዐውድ የዘላለምን ሕይወት ቢመለከትም፣ በዚህ ሐረግ ግሪኩ «ትኖራለህ» ብቻ ይላል። ዋናው ጽሑፍ ያልተጻፈውን ሳይጨምር የቃሉን ግልጽነትና የሥነ መለኮት ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ቀላል የትረካ ፍሰት በ«እርሱም … አለው» ተጠብቋል። በእንግሊዝኛው የነበረው [a] የቃላት አማራጭ ማስታወሻ ከአማርኛው ዋና ጽሑፍ ጋር ተግባራዊ ልዩነት ስለሌለው አልተደገመም፤ አስፈላጊው የዐውድ ማስታወሻ [a] ተብሎ ተቀምጧል።
