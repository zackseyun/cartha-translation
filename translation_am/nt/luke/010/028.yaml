review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the speaker’s response, the positive assessment of the answer, and the imperative. However, «በሕይወትም ትኖራለህ» adds an idiomatically marked element (“in life/alive”) not present in καὶ ζήσῃ and can suggest merely remaining alive rather than the unqualified “you will live.”
  naturalness: «በትክክል መልሰሃል» and «ይህን አድርግ» are natural modern standard Amharic. The simpler «ትኖራለህ» is both more natural here and closer to the Greek.
  terminology: No doctrinal expansion is introduced in the revised main text. The contextual note appropriately identifies the wider question of eternal life while preserving the Greek clause’s simple wording.
  issues:
  - severity: medium
    issue: The main text renders καὶ ζήσῃ as «በሕይወትም ትኖራለህ».
    rationale: The added phrase «በሕይወት» is not represented in the Greek and is redundant in Amharic. It may narrow or shift the force toward physical survival. «ትኖራለህ» preserves the source’s unqualified future verb and the contextual ambiguity.
  revised_text: እርሱም፣ “በትክክል መልሰሃል፤ ይህን አድርግ፣ ትኖራለህ[a]” አለው።
