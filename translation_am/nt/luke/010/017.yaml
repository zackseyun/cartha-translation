  choice: ይታዘዙልናል
  rationale: በዐውዱ ያለውን ለደቀ መዛሙርቱ መገዛት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ የአሁን ጊዜውን አገላለጽም ይጠብቃል።
