base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: am
  text: በዚያችው ሰዓት በመንፈስ ቅዱስ ሐሴት አደረገና እንዲህ አለ፦ “የሰማይና የምድር ጌታ የሆንክ አባት ሆይ፣ እነዚህን ነገሮች ከጥበበኞችና ከአስተዋዮች ሰውረህ ለሕፃናት[b] ስለገለጥክላቸው አመሰግንሃለሁ።[a] አዎን፣ አባት ሆይ፣ እንዲህ ማድረግ በፊትህ ደስ ያሰኘ ነበርና።[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እወድስሃለሁ።” የግሪኩ ግስ በጸሎት ውስጥ ምስጋናንም ውዳሴንም ሊገልጥ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ሕፃናት” በቀጥታ ትንንሽ ልጆችን ወይም ጨቅላዎችን ያመለክታል፤ እዚህ ግን ትሑታንን፣ ጥገኛ የሆኑትን ወይም በማኅበረሰብ ያልታወቁትን በምሳሌ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ቸር ፈቃድህ እንዲህ ነበርና” ወይም “ይህ መልካም ፈቃድህ ነበርና።”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: በዚያችው ሰዓት
  rationale: የግሪኩን አመልካች አጽንዖት ጠብቆ በተፈጥሯዊ አማርኛ ‘በዚያችው ሰዓት’ ተብሏል።
- source_word: ἠγαλλιάσατο
  choice: ሐሴት አደረገ
  rationale: ግሱ ጠንካራ ደስታንና እልልታን ያመለክታል፤ ‘ሐሴት አደረገ’ የንባቡን ክብር ጠብቆ በአማርኛ የተለመደ ነው።
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: በመንፈስ ቅዱስ
  rationale: የግሪኩ የተወሰነ አገላለጽ መንፈስ ቅዱስን ያመለክታል፤ ‘በ’ የሥራ አስፈጻሚነትንም ሆነ የሁኔታ ወሰንን ሳይወስን ሁለቱንም ሊሸከም ይችላል።
- source_word: Ἐξομολογοῦμαί σοι
  choice: አመሰግንሃለሁ
  rationale: በጸሎት አውድ ግሱ ምስጋናንና ውዳሴን ሊገልጥ ይችላል፤ ይህ አማርኛ ሁለቱንም በተፈጥሯዊ ሁኔታ ያቅፋል።
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: የሰማይና የምድር ጌታ የሆንክ አባት ሆይ
  rationale: ሁለቱን የቀጥታ አድራሻዎች—አባትና ጌታ—በግልጽና ተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: σοφῶν καὶ συνετῶν
  choice: ከጥበበኞችና ከአስተዋዮች
  rationale: የቃላቱን ልዩነት ይጠብቃል፤ የትምህርት ደረጃን ብቻ አያስገባም።
- source_word: ἀπεκάλυψας αὐτὰ νηπίοις
  choice: ለሕፃናት ስለገለጥክላቸው
  rationale: ‘ገለጥክ’ ከ‘ሰወርክ’ ጋር ያለውን ተቃርኖ ይጠብቃል፤ ‘ሕፃናት’ የνηπίοιςን ምስላዊ ኃይል ሳይተረጉም ያቆያል።
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: ይህ በፊትህ ደስ የሚያሰኝ ሆኖአልና
  rationale: የግሪኩን ‘በፊትህ’ እና ‘ደስ የሚያሰኝ’ አገላለጽ በቅርበት ይጠብቃል፤ እንደ ‘ቸር ፈቃድህ’ ያለውን ትርጓሜያዊ አማራጭ በማስታወሻ ያቀርባል።
theological_decisions:
- issue: የτῷ πνεύματι τῷ ἁγίῳ ተመላካች
  choice: መንፈስ ቅዱስን የሚያመለክት ሆኖ ‘በመንፈስ ቅዱስ’
  alternative: ‘በመንፈሱ’ ወይም ‘በመንፈስ’
  rationale: መስተዋድዱ ከስሙና ከቅጽሉ ጋር የተደገመበት የግሪክ አወቃቀር የተወሰነውን መንፈስ ቅዱስ በጠንካራ ሁኔታ ያመለክታል።
- issue: እግዚአብሔር እውነቱን መሰወሩና መግለጡ
  choice: ንቁ ግሶቹን በቀጥታ ‘ሰውረህ ... ገለጥክላቸው’ ብሎ ማቆየት
  alternative: ‘እንዳይረዱ ፈቀድክ ... እንዲረዱ አደረግክ’
  rationale: ጽሑፉ አብን የሁለቱም ድርጊቶች ቀጥተኛ አድራጊ ያደርጋል፤ ይህን ሥነ መለኮታዊ ውጥረት ማለዘብ የለበትም።
- issue: εὐδοκία የሚገልጠው መለኮታዊ ደስታ ወይም ፈቃድ
  choice: ‘በፊትህ ደስ የሚያሰኝ’
  alternative: ‘ቸር ፈቃድህ እንዲህ ነበር’
  rationale: ዋናው ትርጉም የጽሑፉን ቅርጽና አሻሚነት ይጠብቃል፤ የፈቃድ ትርጉሙ ትክክለኛ አማራጭ ስለሆነ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጸሎቱ ክብር በ‘አባት ሆይ’ እና ‘ጌታ’ ተጠብቋል፤ ለቃል ታማኝነትና ለተፈጥሯዊ ንባብ ሚዛናዊ አቀራረብ ተከትሏል።
