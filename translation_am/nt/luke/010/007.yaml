base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: am
  text: በዚያው ቤት ቆዩ፤ እነርሱ የሚሰጧችሁን ብሉና ጠጡ፤ ሠራተኛው ደመወዙ ይገባዋልና[a]። ከቤት ወደ ቤት አትዘዋወሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሠራተኛው ሊያገኝ የሚገባው ደመወዙ ነው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: በዚያው ቤት
  rationale: «በዚያው» የሚለው ከዚህ በፊት የተቀበላቸውን ቤት በማመልከት፣ በአንድ ቤት እንዲቆዩ የተሰጠውን አጽንዖት ያስጠብቃል።
- source_word: μένετε
  choice: ቆዩ … ኑሩ
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ቆይታን ያመለክታል፤ «ቆዩ» ትእዛዙን ሲያቀርብ፣ «ኑሩ» ደግሞ ከተከታዮቹ ተውሳከ ግሶች ጋር ተፈጥሯዊ የአማርኛ አገባብ ይፈጥራል።
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: እየበላችሁና እየጠጣችሁ
  rationale: ተውሳከ ግሶቹ ከመቆየቱ ጋር በአንድ ጊዜ የሚቀጥል ድርጊት መሆኑን ይገልጣሉ።
- source_word: τὰ παρ’ αὐτῶν
  choice: እነርሱ የሚያቀርቡላችሁን
  rationale: ሐረጉ አስተናጋጆቹ የሚሰጡትን ምግብና መጠጥ ያመለክታል፤ ትርጉሙ ከአውዱ ያልተጨመረ ዝርዝር ሳያስገባ በግልጽ አማርኛ ቀርቧል።
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: ሠራተኛው ደመወዙ ይገባዋልና
  rationale: «ይገባዋል» ἄξιος የሚያሳየውን ብቁነትና ተገቢ ክፍያ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «ደመወዙ» ደግሞ μισθόςን እንደ የሥራ ክፍያ ይገልጣል። «-ና» የγάρን ምክንያታዊ ግንኙነት ያስጠብቃል።
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: ከቤት ወደ ቤት አትዘዋወሩ
  rationale: ትእዛዙ ማረፊያን እየቀያየሩ መዘዋወርን ይከለክላል፤ «አትዘዋወሩ» ይህን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
