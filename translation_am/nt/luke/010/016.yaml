id: LUK.10.16
reference: Luke 10:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: am
  text: እናንተን የሚሰማ እኔን ይሰማል፤ እናንተን የማይቀበል[a] እኔን አይቀበልም፤ እኔን የማይቀበል ግን የላከኝን አይቀበልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚንቃችሁ» ወይም «ወደ ጎን የሚተዋችሁ»፤ የግሪኩ ቃል አለመቀበልን፣ ንቆ መተውን ወይም ወደ ጎን ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: የሚሰማ
  rationale: The substantival present participle is rendered by a generic Amharic relative form, preserving the characterization of any person who hears without adding an explicit noun.
- source_word: ὑμῶν / ὑμᾶς
  choice: እናንተን
  rationale: The disciples themselves are the persons heard and rejected. The direct personal object preserves the source rather than adding ‘your message.’
- source_word: ἐμοῦ / ἐμέ
  choice: እኔን
  rationale: The personal pronoun maintains Jesus’ direct identification with his commissioned messengers.
- source_word: ἀκούει
  choice: ይሰማል
  rationale: Repeats the same Amharic hearing verb used in the participial expression and preserves the concise rhetorical parallel.
- source_word: ἀθετέω
  choice: አይቀበልም / የማይቀበል
  rationale: In this relational context, the idiomatic Amharic ‘does not accept’ clearly expresses rejection while avoiding the stronger emotional sense of contempt carried by መናቅ. The same expression is repeated in all three occurrences.
- source_word: δὲ
  choice: ግን
  rationale: Marks the mild contrast and climactic progression of the final clause naturally in Amharic.
- source_word: τὸν ἀποστείλαντά με
  choice: የላከኝን
  rationale: The relative verbal form naturally means ‘the one who sent me’ and leaves the Sender personally implicit, as in the Greek.
theological_decisions:
- issue: Identification of Jesus with his commissioned messengers
  choice: Preserve the direct chain in which hearing or rejecting the disciples amounts to hearing or rejecting Jesus.
  alternative: Paraphrase the objects as the disciples’ message or teaching.
  rationale: The Greek uses personal pronouns rather than an abstract term for message or teaching.
- issue: Identity of ‘the one who sent me’
  choice: Leave the Sender unnamed as የላከኝን.
  alternative: Expand it to ‘the Father who sent me’ or ‘God who sent me.’
  rationale: The context points to God the Father, but the verse itself does not explicitly name him.
translation_notes:
  register: Modern standard Amharic in Ge’ez script; concise, dignified, and accessible. The balanced repetition of ይሰማል and አይቀበልም retains the saying’s rhetorical structure.
