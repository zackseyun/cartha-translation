  terminology: Rendering ἀθετέω consistently as የማይቀበል / አይቀበልም is a sound contextual equivalent for “reject.” The footnote responsibly records alternatives involving contempt/disregard and setting aside without overstating one lexical sense. Key personal references and the implicit Sender are maintained.
