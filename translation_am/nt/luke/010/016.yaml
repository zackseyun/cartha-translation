  source_fidelity: 'The translation accurately preserves the threefold personal chain in the Greek: hearing the commissioned disciples is hearing Jesus; rejecting them is rejecting Jesus; rejecting Jesus is rejecting the one who sent him. It does not add an explicit object such as “message,” and የላከኝን appropriately leaves the Sender unnamed.'
