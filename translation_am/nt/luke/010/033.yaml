source:
  edition: SBLGNT
  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: am
  text: ነገር ግን አንድ ሳምራዊ በመንገድ ሲጓዝ ሰውየው ወዳለበት ስፍራ መጣ፤ ባየውም ጊዜ በርኅራኄ ልቡ ተነካ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «አዘነለት።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: ሳምራዊ
  rationale: በአማርኛ የታወቀውን የሕዝብና የሃይማኖት ማንነት ስያሜ ይጠብቃል፤ በምሳሌው ውስጥ ያለውንም ማኅበራዊ ንጽጽር አያደበዝዝም።
- source_word: δέ
  choice: ነገር ግን
  rationale: ከቀደሙት ካህንና ሌዋዊ ድርጊት ጋር ያለውን ተቃርኖ በግልጽ ያሳያል።
- source_word: τις
  choice: አንድ
  rationale: ያልተወሰነውን ሰው በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ὁδεύων
  choice: በመንገድ ሲጓዝ
  rationale: እየቀጠለ ያለውን የጉዞ ድርጊት እንደ ዳራ በተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: ἦλθεν κατ’ αὐτόν
  choice: ሰውየው ወዳለበት ስፍራ መጣ
  rationale: ወደ ተጎዳው ሰው መገኛ መድረሱን በግልጽ ያስተላልፋል፤ የአማርኛ ተውላጠ ስም ግራ መጋባትንም ይቀንሳል።
- source_word: ἰδών
  choice: ባየውም ጊዜ
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ማየት በተፈጥሯዊ ጊዜያዊ አገናኝ ይገልጣል።
- source_word: ἐσπλαγχνίσθη
  choice: በርኅራኄ ልቡ ተነካ
  rationale: ግሱ የሚገልጠውን ጥልቅና ከውስጥ የሚነሳ ርኅራኄ ይጠብቃል፤ ከቀላሉ «አዘነለት» ይልቅ ስሜታዊ ኃይሉን በተሻለ ያሳያል።
theological_decisions:
- issue: የሳምራዊውን የርኅራኄ ምላሽ በኋላ የተጨመረ ሥነ መለኮታዊ ትርጓሜ ሳይጫን መተርጎም
  choice: በርኅራኄ ልቡ ተነካ
  alternative: አዘነለት
  rationale: የግሪክ ግሱን ጥልቅ የርኅራኄ ስሜት ይጠብቃል፤ ነገር ግን ጥቅሱ በግልጽ ያልተናገረውን ስለ ጸጋ፣ ምሕረት ወይም ባልንጀራነት ትምህርት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ርኅራኄ» የሚለው ቃል የግሱን ጥልቅ ስሜታዊ ኃይል ሲጠብቅ፣ «ልቡ ተነካ» ደግሞ ተፈጥሯዊ አማርኛ አገላለጽ ይሰጣል። የእንግሊዝኛው የግርጌ ማስታወሻ ከἐσπλαγχνίσθη ጋር ስለሚዛመድ፣ ምልክቱ ከርኅራኄ ሐረግ በኋላ ተቀምጧል።
