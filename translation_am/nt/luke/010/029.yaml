  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: am
  text: እርሱ ግን ራሱ ትክክል መሆኑን ለማሳየት ፈልጎ ኢየሱስን፣ “ታዲያ ባልንጀራዬ ማን ነው?[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማን እንደ ባልንጀራዬ ይቈጠራል?”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: ፈልጎ
  rationale: የሰውየውን ዓላማና ውስጣዊ ፍላጎት የሚገልጸውን የአሁን ጊዜ አካፋይ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δικαιῶσαι ἑαυτόν
  choice: ራሱን ትክክለኛ አድርጎ ለማሳየት
  rationale: በዚህ ዐውድ ሰውየው ራሱ ትክክል እንደሆነ ለማስመስከር መፈለጉን ያመለክታል፤ “ራሱን ለማጽደቅ” ሊያመጣ የሚችለውን ቴክኒካዊ ወይም የመንጻት ትርጉም ያስወግዳል።
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: ኢየሱስን … አለው
  rationale: የግሪኩን ቀጥተኛ የንግግር አቀራረብ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: Καὶ
  choice: ታዲያ
  rationale: በውይይቱ ውስጥ የሚከተለውን ጥያቄ የሚያገናኘውን የግሪክ መስተዋድድ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τίς ἐστίν μου πλησίον
  choice: ባልንጀራዬ ማን ነው?
  rationale: πλησίον በዚህ ስፍራ እንደ ስም የተጠቀሰ ሲሆን፣ “ባልንጀራ” በዙሪያው ካለው የኦሪት ጥቅስ ጋር የሚስማማና የተለመደ አተረጓጎም ነው።
theological_decisions:
- issue: የδικαιῶσαι ἑαυτόν ትርጉም
  choice: ሰውየው ራሱን ትክክለኛ አድርጎ ለማሳየት መሞከሩ
  alternative: ራሱን ለማጽደቅ፤ ወይም በሕዝቡ ፊት ራሱን ከነቀፋ ነጻ ለማድረግ
  rationale: በቅርብ ዐውዱ ያለው የሕግና የሥነ ምግባር ውይይት ነው፤ ሐረጉ ስለ ጽድቅ የተሟላ ቴክኒካዊ ትምህርት ከማቅረብ ይልቅ ራስን ትክክል አድርጎ ለማሳየት የተደረገ ጥረትን ይገልጻል።
