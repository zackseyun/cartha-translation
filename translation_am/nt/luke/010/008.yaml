lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: ወደምትገቡባትም ከተማ ሁሉ
  rationale: ἣν ἂν ያለውን አጠቃላይና ያልተወሰነ ሐሳብ ‘ከተማ ሁሉ’ በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል፤ εἰς የሚያሳየውን ወደ ውስጥ የመግባት አቅጣጫም ‘ወደ’ ይጠብቃል።
- source_word: εἰσέρχησθε
  choice: ምትገቡባት
  rationale: የከተማይቱን ውስጥ መግባት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ የግሪኩን አጠቃላይ ሁኔታዊ አወቃቀር ከ‘ከተማ ሁሉ’ ጋር ያስተላልፋል።
- source_word: δέχωνται ὑμᾶς
  choice: ሰዎቹ ቢቀበሏችሁ
  rationale: δέχομαι በዚህ ዐውድ ‘መቀበል’ ወይም ‘በደስታ መቀበል’ ሊሆን ይችላል። ‘ቢቀበሏችሁ’ ቅርብ የቃል ተመጣጣኝነትንና የሁኔታውን ትርጉም ይጠብቃል፤ ‘ሰዎቹ’ በአማርኛ የግሱን ሦስተኛ መደብ ብዙ ቁጥር ባለቤት ግልጽ ያደርጋል።
- source_word: ἐσθίετε
  choice: ብሉ
  rationale: የአሁን ጊዜ ትእዛዛዊ ግስ የሚሰጠውን ቀጥተኛ መመሪያ በተፈጥሯዊና ክብር ባለው የብዙ ቁጥር ትእዛዝ ያስተላልፋል።
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: የሚያቀርቡላችሁን
  rationale: παρατίθημι በምግብ ዐውድ ለእንግዶች የሚቀርበውን ያመለክታል። ‘የሚያቀርቡላችሁን’ በአማርኛ ተፈጥሯዊ ሲሆን ነገሩ ለደቀ መዛሙርቱ መቅረቡን ይጠብቃል።
