  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: am
  text: ሂዱ፤ እነሆ፣ እኔ በተኩላዎች መካከል[a] እንደ ጠቦቶች[b] እልካችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “በተኩላዎች መካከል።”
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ በተለይ “ጠቦቶች” ይላል፤ “በጎች” አይልም።
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπάγετε
  choice: ሂዱ
  rationale: የብዙ ሰዎች ሁለተኛ መደብ ትእዛዝ ሲሆን፣ አጭርና ተፈጥሯዊውን የተልእኮ ትእዛዝ ያስተላልፋል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ቀጥሎ ወዳለው ነገር ትኩረት የሚጠራውን የንግግር ኃይል በክብር ያለውና በአማርኛ የተለመደ አገላለጽ ይጠብቃል።
- source_word: ἀποστέλλω ὑμᾶς
  choice: እልካችኋለሁ
  rationale: የአሁን ጊዜውን የመላክ ድርጊትና የብዙ ሰዎች ተቀባይነት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘መሾም’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: ὡς
  choice: እንደ
  rationale: የማንነት እኩልነትን ሳይሆን ንጽጽርን የሚያሳይ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἄρνας
  choice: ጠቦቶች
  rationale: የግሪኩን ‘ጠቦቶች’ የሚል የተወሰነ ትርጉም ይጠብቃል፤ ‘በጎች’ ብሎ በማስፋት የተጋላጭነቱን ምስል አያደበዝዝም።
- source_word: ἐν μέσῳ λύκων
  choice: በተኩላዎች መካከል
  rationale: ‘በተኩላዎች መካከል’ የሚለውን የተከበቡበትና አደገኛ ሁኔታ በቅርብና ተፈጥሯዊ መንገድ ይገልጻል።
theological_decisions:
- issue: የደቀ መዛሙርቱን ተልእኮ የሚገልጸው የእንስሳት ምሳሌ
  choice: ንጽጽሩን ‘በተኩላዎች መካከል እንደ ጠቦቶች’ ብሎ በቀጥታ ማቆየት
  alternative: ‘በተኩላዎች መካከል እንደ በጎች’
  rationale: ἄρνας በተለይ ‘ጠቦቶች’ ማለት እንጂ አጠቃላይ ‘በጎች’ አይደለም። ይህን ማቆየት የተላኩትን ተጋላጭነት ያጎላል፣ ተመሳሳይ ንግግሮችንም ከዚህ ጋር አያዋህድም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነሆ’ የግሪኩን የትኩረት ጥሪ ጠብቆ ሲያቀርብ፣ የዓረፍተ ነገሩ አደራደር በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል።
