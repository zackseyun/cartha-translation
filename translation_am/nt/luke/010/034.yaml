  - severity: low
    issue: The object “ቁስሎቹ” lacks the accusative marker in the main text.
    rationale: τραύματα is the direct object of κατέδησεν. Adding “-ን” gives clear and standard Amharic syntax.
  - severity: low
    issue: “በራሱ እንስሳ” is somewhat unnatural for personal possession.
    rationale: “የራሱ እንስሳ” naturally conveys the emphatic possessive force of ἴδιον without changing the meaning.
  - severity: low
    issue: Footnote a is unnecessarily cumbersome in its current wording.
    rationale: “ቁስሎቹን በፋሻ አሰረለት” is a clear lexical alternative for “bound up his wounds.”
