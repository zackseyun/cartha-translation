    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported implication that Mary went away, recasts the first clause into natural modern Amharic while retaining the ongoing sense of Martha’s preoccupation with much service, and aligns the footnote with the lexical alternative for οὐ μέλει σοι.
