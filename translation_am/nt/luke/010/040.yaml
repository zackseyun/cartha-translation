review_pass:
  verdict: revise
  source_fidelity: The draft preserves the core sense of Martha’s being occupied with extensive household service, her approach to Jesus, her complaint that her sister left her to serve alone, and her request that Mary help. However, «ትታኝ መሄዷ» adds the idea of going away, which is not stated by κατέλειπεν, and the opening construction is awkward and does not naturally express περιεσπᾶτο.
  naturalness: «ብዙ በማገልገል ትኩረቷ ተከፋፍሎ ነበር» is syntactically and idiomatically strained. «በብዙ ማገልገል ተጠምዳ ነበር» is natural modern Amharic and appropriately conveys an ongoing state of being drawn into much serving. The revised complaint also removes the unnatural nominalized «መሄዷ».
  terminology: «ጌታ ሆይ» appropriately renders Κύριε in this address. «ማገልገል» fits the domestic, practical sense of διακονία without importing formal ecclesial ministry. «እንድትረዳኝ» accurately conveys the requested shared assistance in συναντιλάβηται.
  issues:
  - severity: medium
    issue: The rendering «ትታኝ መሄዷ» introduces going away.
    rationale: κατέλειπεν means that Mary left Martha to serve alone; it does not explicitly say that she went away. The added motion should be removed.
  - severity: medium
    issue: The opening phrase is unnatural and weakly represents the Greek state of distraction/being drawn away.
    rationale: The word order «ብዙ በማገልገል» and predicate «ትኩረቷ ተከፋፍሎ ነበር» are awkward in modern standard Amharic. A personal predicate with «ተጠምዳ ነበር» gives a clear ongoing sense in the household-service context.
  - severity: low
    issue: The footnote repeats the added idea «መሄዷ» and uses an unnecessarily narrowed expression for the service.
    rationale: The alternate should preserve the same source content as the text and should only provide the lexical alternative for οὐ μέλει σοι.
  revised_text: ማርታ ግን በብዙ ማገልገል ተጠምዳ ነበር። ወደ እርሱም ቀርባ፣ “ጌታ ሆይ፣ እህቴ ብቻዬን እንዳገለግል ትታኝ መሆኑ አያሳስብህምን?[a] እንግዲህ እንድትረዳኝ ንገራት” አለች።
