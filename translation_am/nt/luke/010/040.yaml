lexical_decisions:
- source_word: περιεσπᾶτο
  choice: ትኩረቷ ተከፋፍሎ ነበር
  rationale: ያልተፈጸመው ግስ በብዙ ሥራ ምክንያት ትኩረቷ እየተሳበ የቆየ ሁኔታን ያሳያል፤ ይህ አተረጓጎም ‘ሥራ በዝቶባት ነበር’ ከሚለው ይልቅ የትኩረት መከፋፈሉን ግልጽ ያደርጋል።
- source_word: περὶ πολλὴν διακονίαν
  choice: ብዙ በማገልገል
  rationale: በዚህ የቤት አውድ ውስጥ διακονία ተግባራዊ ማገልገልን ያመለክታል፤ ‘ዝግጅት’ ማለት ትርጉሙን ያጠብበዋል።
- source_word: ἐπιστᾶσα
  choice: ወደ እርሱም ቀርባ
  rationale: ከመናገሯ በፊት ወደ ኢየሱስ መቅረቧን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በአማርኛ ለቀጥተኛ አድራሻ የተለመደ ሲሆን፣ ለኢየሱስ የቀረበውን የክብር መጠሪያ ይጠብቃል።
- source_word: οὐ μέλει σοι
  choice: አያሳስብህምን?
  rationale: ነገሩ ለጌታ ግድ እንደሚሰጠው የሚጠይቀውን ቅሬታ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል፤ ‘ግድ አይሰጥህምን?’ የሚለውም አማራጭ በማስታወሻው ተጠብቋል።
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: ብቻዬን እንዳገለግል ትታኝ መሄዷ
  rationale: μόνην የሚያሳየውን ብቸኝነትና διακονεῖν የሚያሳየውን ማገልገል ሳያጠናክር ወይም ሳያሳንስ ይጠብቃል።
- source_word: εἰπὲ οὖν αὐτῇ
  choice: እንግዲህ … ንገራት
  rationale: የትእዛዙን ቀጥተኛነትና οὖν ያለውን መደምደሚያዊ ኃይል ይጠብቃል።
- source_word: συναντιλάβηται
  choice: እንድትረዳኝ
  rationale: አብሮ በመያዝ ወይም በመሳተፍ መርዳትን በዘመናዊ አማርኛ በቀላሉ ያስተላልፋል፤ የጋራ ድጋፉ ትርጉም በአውዱ ግልጽ ነው።
theological_decisions:
