base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: am
  text: እነርሱም በመንገድ ላይ ሲጓዙ፣ እርሱ ወደ አንዲት መንደር ገባ፤ ማርታ የምትባል አንዲት ሴትም እንግዳ አድርጋ ተቀበለችው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ተቀበለችው»። የግሪክኛው ግስ አንድን ሰው እንደ እንግዳ በመስተንግዶ መቀበልን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: እነርሱም በመንገድ ላይ ሲጓዙ
  rationale: ἐν ከአንቀጽ ያለው የድርጊት ስም ጋር ሆኖ በአንድ ጊዜ የሚከናወንን ድርጊት ያሳያል፤ ሲጓዙ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል። እነርሱ የቡድኑን ብዙ ቁጥር ይጠብቃል፤ δέ ደግሞ በ -ም ቀላል የትረካ ትስስር ተገልጧል።
- source_word: αὐτὸς
  choice: እርሱ
  rationale: በግሪክኛው ያለውን አጽንዖትና ከብዙ ቁጥሩ እነርሱ ጋር ያለውን ልዩነት ይጠብቃል፤ ኢየሱስ ብሎ ስሙን መጨመር አያስፈልግም።
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: ወደ አንዲት መንደር ገባ
  rationale: κώμη መንደርን ያመለክታል፤ τινά የሚያሳየው አለመወሰን በአንዲት ተጠብቋል።
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: ማርታ የምትባል አንዲት ሴትም
  rationale: የግሪክኛውን የስም አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ δέ አዲስ ተሳታፊን የሚያስገባ ቀላል ትስስር ስለሆነ በ -ም ተተርጉሟል።
- source_word: ὑπεδέξατο αὐτόν
  choice: እንግዳ አድርጋ ተቀበለችው
  rationale: ὑποδέχομαι በእንግድነት መቀበልን ያመለክታል። ይህ አገላለጽ የመስተንግዶውን ፍቺ ይጠብቃል፤ በግሪክኛው በግልጽ የሌለውን ወደ ቤቷ የሚል ሐረግ አይጨምርም።
