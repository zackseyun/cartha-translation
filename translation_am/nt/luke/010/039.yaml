  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: am
  text: 'ለእርሷም ማርያም የምትባል እኅት ነበረቻት፤ እርሷም በኢየሱስ[a] እግር ሥር ተቀምጣ ቃሉን ታዳምጥ ነበር።


    [a] አንዳንድ የእጅ ጽሑፎች “ኢየሱስ” በሚለው ፈንታ “ጌታ” ይላሉ።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ኢየሱስ” በሚለው ፈንታ “ጌታ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: ለእርሷም
  rationale: የሴት ነጠላ አመልካች ተውላጠ ስም በቀደመው ቁጥር የተጠቀሰችውን ማርታን ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀδελφὴ καλουμένη Μαριάμ
  choice: ማርያም የምትባል እኅት
  rationale: የዝምድናውን ቃልና ስምን የሚያስተዋውቀውን ተሳቢ ግስ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: በ… እግር ሥር ተቀምጣ
  rationale: በአንድ ሰው እግር አጠገብ ተቀምጦ የማዳመጥን አቀማመጥ በአማርኛ በተለመደና ግልጽ አነጋገር ይገልጣል።
- source_word: τοῦ Ἰησοῦ
  choice: የኢየሱስ
  rationale: የቀረበው የSBLGNT ዋና ጽሑፍ Ἰησοῦ ይላል፤ ስለዚህ የግል ስሙ በዋናው ጽሑፍ ተጠብቋል።
- source_word: ἤκουεν
  choice: ታዳምጥ ነበር
  rationale: የግሱን ያልተፈጸመ ያለፈ ጊዜ ቅርጽና ቀጣይነት ያለውን ድርጊት ያሳያል።
- source_word: τὸν λόγον αὐτοῦ
  choice: ቃሉን
  rationale: λόγος የሚለውን ሰፊ ትርጉም ሳያጠብ በአገባቡ የኢየሱስን ንግግር ያመለክታል።
theological_decisions:
- issue: “በ… እግር ሥር” በሚለው ሐረግ የሚገኘው ስም ወይም ማዕረግ
  choice: ኢየሱስ
  alternative: ጌታ
  rationale: የቀረበው የግሪክ ዋና ጽሑፍ Ἰησοῦ ስለሚል “ኢየሱስ” በዋናው ጽሑፍ ገብቷል፤ κύριος የሚለው ልዩ ንባብ ያለውን የስምና የማዕረግ ልዩነት ለመጠበቅ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ታዳምጥ ነበር” የግሪኩን ቀጣይ ድርጊት ያሳያል፤ “ቃሉን” ደግሞ የλόγοςን ስፋት ይጠብቃል።
