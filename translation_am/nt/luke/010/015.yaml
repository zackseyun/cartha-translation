- source_word: μὴ ... ὑψωθήσῃ
  choice: ከፍ ከፍ ትደረጊያለሽን?
  rationale: μὴ ያለበት ጥያቄ አሉታዊ መልስን የሚጠብቅ የንግግር ጥያቄ ነው፤ የግሱን ተደራጊ ቅርጽና የከፍታ ምስል ይጠብቃል።
- source_word: ἕως οὐρανοῦ
  choice: እስከ ሰማይ
  rationale: ἕως የሚያመለክተውን የወሰን ወይም የመጠን ሐሳብ እና ከሲኦል ጋር ያለውን የላይና የታች ንጽጽር ያስቀምጣል።
- source_word: ἕως τοῦ ᾅδου
  choice: ወደ ሲኦል
  rationale: ᾅδης የሙታንን ዓለም የሚያመለክት ሲሆን ከገሃነም ጋር ያለውን የቃላት ልዩነት ለመጠበቅ ‘ሲኦል’ ተመርጧል። በአማርኛ የመድረሻ አቅጣጫን ለማሳየት ‘ወደ’ ተጠቅሟል።
- source_word: καταβιβασθήσῃ
  choice: ታወርጃለሽ
  rationale: የግሪኩን የወደፊት ጊዜ ተደራጊ ቅርጽ በመጠበቅ፣ በሌላ አካል ወደ ታች እንደምትወርድ ያሳያል፤ ከ‘ትወርጃለሽ’ ይልቅ የማዋረድና የፍርድ ጥላውንም ይጠብቃል።
theological_decisions:
- issue: የᾅδης አተረጓጎም
  choice: ሲኦል
  alternative: የሙታን ዓለም፤ ገሃነም
  rationale: ‘ሲኦል’ ᾅδηςን ከገሃነም ለይቶ ያቆያል፤ ‘ገሃነም’ የመጨረሻ ቅጣትን ሐሳብ ያለአስፈላጊ ሁኔታ ሊያስገባ ይችላል። ገላጭ አማራጩ በማስታወሻ ቀርቧል።
- issue: ቅፍርናሆምን በሴት ነጠላ ቅርጽ መጥራት
  choice: አንቺስ ... ትደረጊያለሽን ... ታወርጃለሽ
  alternative: አንተስ ... ትደረጋለህን ... ትወርዳለህ
  rationale: ግሪኩ በሁለተኛ መደብ ነጠላ ቁጥር ከተማዋን በቀጥታ ይጠራል፤ አማርኛ ጾታን በግስና በተውላጠ ስም ማሳየት ስለሚጠይቅ፣ ከተማን በሴት ጾታ የመወከል ተፈጥሯዊ አጠቃቀም ተከትሏል።
