review_pass:
  verdict: revise
  source_fidelity: The rhetorical question and the heaven-to-Hades contrast are retained, and ሲኦል appropriately preserves the distinction between ᾅδης and γέεννα. However, the second verb as drafted does not clearly convey the Greek future passive, ‘you will be brought down.’
