    issue: The phrase ከፍ ከፍ ትደረጊያለሽን? is stylistically awkward.
    rationale: The repeated ከፍ is not required by ὑψωθήσῃ and weakens the compact rhetorical contrast. ከፍ ትደረጊያለሽን? expresses the future passive and expected-negative rhetorical question directly.
  - severity: medium
    issue: ታወርጃለሽ does not reliably express the passive force of καταβιβασθήσῃ.
    rationale: 'The Greek verb is future passive: Capernaum is acted upon and brought down. ትወረጃለሽ explicitly represents this passive sense.'
