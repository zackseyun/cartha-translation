language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: am
  text: እርሱም መልሶ እንዲህ አለ፦ “ጌታ አምላክህን በሙሉ ልብህ፣ በሙሉ ነፍስህ፣ በሙሉ ኃይልህ፣ በሙሉ አእምሮህ ውደድ፤ ባልንጀራህንም እንደ ራስህ ውደድ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: እርሱም መልሶ … አለ
  rationale: የግሪኩን ተሳቢ ግስና ዋና ግስ በተፈጥሯዊ የአማርኛ ትረካ አወቃቀር ያቀርባል።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: የወደፊት አመልካቹ በተጠቀሰው የቅዱስ ጽሑፍ ትእዛዝ ውስጥ የትእዛዝ ኃይል አለው፤ ቀጥተኛው የአማርኛ ትእዛዝ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: κύριον τὸν θεόν σου
  choice: ጌታ አምላክህን
  rationale: κύριοςን እንደ መለኮታዊ ማዕረግ በ“ጌታ”፣ θεόςንም በተለመደው “አምላክ” ይተረጉማል።
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: ከልብህ ሁሉ
  rationale: ἐξ ያለውን “ከ/ውስጥ ተነስቶ” አቅጣጫ ይጠብቃል፤ ቀጣዮቹ ἐν ያላቸው ሐረጎች ግን “በ” ተብለዋል።
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: በነፍስህም ሁሉ
  rationale: ψυχήን በባህላዊና ቀጥተኛ አቻው “ነፍስ” ይጠብቃል፤ እዚህ ግን ጠቅላላ ማንነትንና ሕይወትን የሚያካትት ሰፊ ትርጉም አለው።
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: በኃይልህም ሁሉ
  rationale: ἰσχύς የአካልንና የችሎታን ጥንካሬ ያመለክታል፤ “ኃይል” ግልጽና የተለመደ አቻ ነው።
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: በአእምሮህም ሁሉ
  rationale: διάνοια የማሰብና የመረዳት ችሎታን ያመለክታል፤ “አእምሮ” ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: τὸν πλησίον σου
  choice: ባልንጀራህን
  rationale: በመጽሐፍ ቅዱሳዊ የሥነ ምግባር አውድ የቅርብ ሰውን ወይም ሌላውን ሰው የሚያመለክት የታወቀ አማርኛ አቻ ነው፤ “ጎረቤት” ቦታዊ ቅርበትን ብቻ ሊያስመስል ይችላል።
- source_word: ὡς σεαυτόν
  choice: እንደ ራስህ
  rationale: የὡςን ንጽጽራዊ ኃይል በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በመለኮታዊ የቅዱስ ጽሑፍ ጥቅስ ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: ገዢ / ባለቤት
  rationale: እዚህ κύριος የእስራኤልን አምላክ የሚያመለክት መለኮታዊ ማዕረግ ስለሆነ “ጌታ” የጥቅሱን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል።
- issue: καρδία፣ ψυχή፣ ἰσχύς፣ διάνοια የሚሉትን የሰው ማንነት ገጽታዎች ማቅረብ
  choice: ልብ፣ ነፍስ፣ ኃይልና አእምሮ የሚሉትን አራቱን ቃላት ለየብቻ ማቆየት
  alternative: ሁሉን “በፍጹም ማንነትህ” ብሎ ማጠቃለል
  rationale: የተደራረቡት ቃላት ፍጹም መሰጠትን በአጽንዖት ያሳያሉ። ለየብቻ ማቆየታቸው ጽሑፉን አያሳጥርም፤ ነገር ግን ግትር የሰው ክፍልፋይ ትምህርትም አያስገባም።
- issue: ἐξ እና ἐν ያላቸውን የመስተዋድድ ልዩነት መጠበቅ
  choice: “ከልብህ ሁሉ” ከዚያም “በ…ሁሉ”
  alternative: ሁሉንም “በ…ሁሉ” ብሎ ማመሳሰል
  rationale: የሉቃስ የግሪክ አገላለጽ በመጀመሪያው ሐረግ ἐξ፣ በቀጣዮቹ ግን ἐν ይጠቀማል። ትርጉሙ ይህን እውነተኛ የቅርጽ ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የጥቅሱን ትእዛዛዊ ኃይል በቀጥተኛ ትእዛዝ ያቀርባል፤ የግሪኩን አራት ተደራራቢ አገላለጾችና የመስተዋድድ ልዩነት ይጠብቃል።
