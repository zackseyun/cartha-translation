  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: am
  text: ጌታ ግን መልሶ እንዲህ አላት፤ “ማርታ፣ ማርታ፣ ስለ ብዙ ነገሮች ትጨነቂያለሽና ትረበሻለሽ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ ብዙ ነገሮች ትጨነቂያለሽና ትታወኪያለሽ።»
    reason: θορυβάζῃ can be expressed with a related sense of being upset, unsettled, or disturbed; the note records this lexical alternative.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: ጌታም መልሶ እንዲህ አላት
  rationale: የግሪኩን የትረካ ፈሊጥ በተፈጥሯዊ አማርኛ ይገልጣል፤ δὲ እዚህ ለስላሳ ሽግግርንና ምላሽን ስለሚያመለክት በ«ም» ተገልጧል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በሉቃስ ትረካ ውስጥ ለኢየሱስ የሚሰጠውን የክብርና ክርስቶሳዊ ማዕረግ ይጠብቃል።
- source_word: Μάρθα Μάρθα
  choice: ማርታ፣ ማርታ
  rationale: የቀጥታ ጥሪው ድግግሞሽ ያለውን ርኅራኄና አጽንዖት ለማስጠበቅ ቃል በቃል ተደግሟል።
- source_word: μεριμνᾷς
  choice: ትጨነቂያለሽ
  rationale: ውስጣዊ ጭንቀትንና ሐሳብ መብዛትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: θορυβάζῃ
  choice: ትታወኪማለሽ
  rationale: ከμεριμνᾷς የተለየውን የመረበሽና የውስጥ መናወጥ ስሜት ያስተላልፋል።
- source_word: περὶ πολλά
  choice: ስለ ብዙ ነገር
  rationale: የማርታን በብዙ ጉዳዮች መጠመድ በቀጥተኛና ተፈጥሯዊ አገላለጽ ያቀርባል።
theological_decisions:
- issue: κύριος ለኢየሱስ እንደ ማዕረግ መተርጎም
  choice: ጌታ
  alternative: መምህር / ባለቤት
  rationale: «ጌታ» የግሪኩን የክብር ማዕረግና በሉቃስ ትረካ ያለውን ክርስቶሳዊ ድምፀት ይጠብቃል፤ አማራጮቹ ይህን ስፋት ሊያጠቡ ይችላሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቃላቱ ልዩነት በ«ትጨነቂያለሽ» እና «ትታወኪማለሽ» ተጠብቋል፤ በቀረበው የእንግሊዝኛ ጽሑፍ ያለው [a] ማስታወሻ በዋናው የግሪክ ሐረግ ላይ ካለው ቦታ ጋር የማይጣጣም በመሆኑና የቀረበው አማራጭ ትርጉም በዋናው አማርኛ በቂ ሁኔታ ስለተወከለ ማስታወሻ አልተጨመረም።
