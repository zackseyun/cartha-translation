  rationale: የግሪኩ የተያያዙ አንቀጾች በማስጠንቀቂያው የታሰቡትን ጸሐፍት በተግባራቸው ይገልጣሉ። ትርጉሙ የሞራል ትችቱን ይጠብቃል፤ ነገር ግን ጽሑፉ ከሚለው በላይ ስለ እያንዳንዱ ጸሐፊ አጠቃላይ ፍርድ አይጨምርም።
