  rationale: በትረካው ውስጥ ቀጥሎ የሆነውን ጊዜ ያመለክታል፤ «በኋላ» የጊዜውን ቅደም ተከተል ሳያብራራ በተፈጥሯዊ አማርኛ ያስተላልፋል።
