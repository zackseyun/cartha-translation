review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the participial description, the long prayers performed under a false show, and the future reception of a comparative κρίμα. However, የከፋ ፍርድ can mean a qualitatively bad/worse judgment and does not express the explicit comparative force as clearly as የበለጠ ከባድ ፍርድ.
  naturalness: The wording is generally clear modern standard Amharic. Recasting the opening metaphor as exploitation is more idiomatic in Amharic while retaining the source's condemnatory sense; the footnote may preserve the literal imagery.
  terminology: ፍርድ appropriately retains the breadth of κρίμα rather than prematurely restricting it to ኩነኔ. ለማስመሰል naturally conveys προφάσει in this context. የበለጠ ከባድ ፍርድ clearly renders the comparative περισσότερον.
  issues:
  - severity: medium
    issue: The comparative περισσότερον is underrepresented by የከፋ.
    rationale: Although የከፋ can fit an adverse context, it primarily denotes something worse/badder. The Greek explicitly indicates a greater or more severe judgment; የበለጠ ከባድ preserves this comparison clearly.
  - severity: low
    issue: ቤቶች ይበላሉ is a markedly non-idiomatic literal metaphor in contemporary Amharic.
    rationale: The Greek verb is itself metaphorical for rapacious exploitation. ይበዘብዛሉ communicates that force naturally; a note can retain the literal ‘devour ... houses’ image.
  revised_text: የመበለቶችን ቤቶች ይበዘብዛሉ፤ ለማስመሰልም[a] ረጅም ጊዜ ይጸልያሉ። እነዚህ የበለጠ ከባድ ፍርድ[b] ይቀበላሉ።
