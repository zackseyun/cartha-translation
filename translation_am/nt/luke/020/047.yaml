lexical_decisions:
- source_word: κατεσθίουσιν
  choice: ይበላሉ
  rationale: ቃሉ በቀጥታ ‘ይበላሉ’ ማለት ሲሆን፣ እዚህ መበለቶችን በጭካኔ መበዝበዝን በምሳሌያዊ እና ብርቱ አነጋገር ያሳያል።
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: የመበለቶችን ቤቶች
  rationale: የግሪኩን ቀጥተኛ ምስል ይጠብቃል፤ ‘ቤቶች’ በዐውዱ ንብረትን ወይም ኑሮንም ሊወክል ይችላል።
- source_word: προφάσει
  choice: ለማስመሰል
  rationale: ጸሎታቸው ሐሰተኛ ውጫዊ መልክ ለማሳየት መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ‘እንደ ሰበብ’ የሚለው ቀረብ ያለ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: μακρὰ προσεύχονται
  choice: ረጅም ጊዜ ይጸልያሉ
  rationale: μακρά እዚህ በተውሳከ ግስ አገልግሎት የጸሎቱን ረጅም ቆይታ ያመለክታል።
- source_word: λήμψονται
  choice: ይቀበላሉ
  rationale: የወደፊት የፍርድ ውጤትን በክብር ያለውና ግልጽ አነጋገር ይገልጻል።
- source_word: περισσότερον κρίμα
  choice: የከፋ ፍርድ
  rationale: የንጽጽር ትርጉሙንና የከበደ የፍርድ ውጤትን በተፈጥሯዊ አማርኛ ይገልጻል፤ κρίμαን በቀጥታ ‘ፍርድ’ ብሎ በመተርጎም የቃሉን ስፋት ይጠብቃል።
theological_decisions:
- issue: በዐውዱ የκρίμα ትርጉም
  choice: ፍርድ
  alternative: ኩነኔ
  rationale: ዐውዱ አሉታዊ መለኮታዊ ፍርድን በግልጽ ቢያመለክትም፣ ‘ፍርድ’ የግሪኩን ሰፊ የቃል ወሰን ከ‘ኩነኔ’ ይልቅ ይጠብቃል።
