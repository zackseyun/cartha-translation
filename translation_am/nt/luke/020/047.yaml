  text: የመበለቶችን ቤቶች ይበዘብዛሉ፤ ለማስመሰልም[a] ረጅም ጊዜ ይጸልያሉ። እነዚህ የበለጠ ከባድ ፍርድ[b] ይቀበላሉ።
  philosophy: optimal-equivalence
  footnotes:
