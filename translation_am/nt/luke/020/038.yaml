lexical_decisions:
- source_word: θεὸς
  choice: አምላክ
  rationale: በአይሁዳዊው አንድ አምላክ እምነት አውድ ውስጥ θεός የተወሰነውን አምላክ ያመለክታል፤ በአማርኛም «አምላክ» ተፈጥሯዊ ነው።
