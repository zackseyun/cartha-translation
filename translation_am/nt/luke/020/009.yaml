base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: am
  text: ከዚያም ለሕዝቡ ይህን ምሳሌ መናገር ጀመረ፦ “አንድ ሰው የወይን እርሻ ተከለ፤ ለገበሬዎችም አከራየው፤ ለረጅም ጊዜም ርቆ ቆየ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ሌላ አገር ሄዶ ለረጅም ጊዜ ቆየ።” ግሱ አንድ ሰው ከመኖሪያው ወይም ከክልሉ ርቆ፣ አንዳንዴም ወደ ውጭ አገር መሄዱን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: ከዚያም … ጀመረ
  rationale: δέ የትረካውን ቀጣይነት ስለሚያመለክት “ከዚያም” ተብሏል፤ ἤρξατο ደግሞ ድርጊቱ መጀመሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: ለሕዝቡ … መናገር
  rationale: πρός ከመናገር ግስ ጋር የንግግሩን ተቀባዮች ያመለክታል፤ λαός የሚያሳየውን ሰፊ የሕዝብ ስብስብ “ሕዝቡ” ይጠብቃል።
- source_word: τὴν παραβολὴν ταύτην
  choice: ይህን ምሳሌ
  rationale: “ምሳሌ” የወንጌላትን የትረካ ዘውግ በተለመደና ግልጽ ቃል ያስተላልፋል።
- source_word: Ἄνθρωπος
  choice: አንድ ሰው
  rationale: በአማርኛ የአንድን የታሪኩን ገጸ ባሕርይ ለማስተዋወቅ ተፈጥሯዊ ነው፤ በቀጣዩ የወንድ ነጠላ ተውላጠ ስም የግለሰቡ ጾታ ይታያል።
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: የወይን አትክልት ተከለ
  rationale: φυτεύω በቀጥታ “ተከለ” ማለት ሲሆን፣ “የወይን አትክልት” ἀμπελώνን በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ለገበሬዎችም አከራየው
  rationale: ἐκδίδωμι ንብረትን በኪራይ መስጠትን ያመለክታል፤ γεωργοί ደግሞ አራሾችን ወይም አልሚዎችን በሰፊው የሚያመለክት በመሆኑ “ገበሬዎች” ተመርጧል።
- source_word: ἀπεδήμησεν
  choice: ከአገሩ ርቆ ሄደ
  rationale: ግሱ ከመኖሪያ አገር ወይም ክልል ርቆ መሄድን፣ አንዳንዴም ወደ ሌላ አገር መጓዝን ሊያመለክት ይችላል፤ ይህ አተረጓጎም ዋናውን ሐሳብ ሳያጠብ ያቀርባል።
- source_word: χρόνους ἱκανούς
  choice: ለረጅም ጊዜ
  rationale: የግሪክ ሐረጉ ከፍ ያለ የጊዜ ርዝመትን ያሳያል፤ “ለረጅም ጊዜ” ተፈጥሯዊና ትክክለኛ አቻ ነው።
theological_decisions:
- issue: Ἄνθρωπος የሚለው የወንድ ነጠላ ስም
  choice: አንድ ሰው
  alternative: አንድ ወንድ
  rationale: “አንድ ሰው” በአማርኛ ታሪክ ውስጥ አንድን ግለሰብ ለማስተዋወቅ የተለመደ ሲሆን፣ “አንድ ወንድ” ያለአስፈላጊ ትኩረት በጾታው ላይ ያደርጋል። የታሪኩ ገጸ ባሕርይ ወንድ መሆኑ ግን “አገሩ” በሚለው የወንድ ነጠላ ቅጽ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ ረዘም ያለ ዓረፍተ ነገር በሰሚኮሎን ተከፍሎ የትረካው ፍሰት ተጠብቋል። የግርጌ ማስታወሻው ἀπεδήμησεν ከሚለው ግስ ጋር በቀጥታ እንዲያያዝ ምልክቱ ከ“ሄደ” በኋላ ተቀምጧል።
