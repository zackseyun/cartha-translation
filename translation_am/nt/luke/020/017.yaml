base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: am
  text: እርሱ ግን ትኩር ብሎ ተመለከታቸውና እንዲህ አለ፦ “እንግዲህ፣ ‘ገንቢዎች የናቁት ድንጋይ፣ ይህ የማዕዘን ራስ[a] ሆነ’ ተብሎ የተጻፈው ይህ ምንድን ነው?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የማዕዘን ድንጋይ”፤ በሌላ አማራጭ፣ “የጫፍ ድንጋይ።” ግሪኩ ቃል በቃል “የማዕዘን ራስ” ይላል።
