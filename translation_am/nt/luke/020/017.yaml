- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: እንግዲህ፣ … ተብሎ የተጻፈው ይህ ምንድን ነው?
  rationale: የግሪኩን የአጻጻፍ ጊዜና ተገብሮ አወቃቀር በ«የተጻፈው» ይጠብቃል፤ ጥያቄውንም «ይህ ምንድን ነው?» ብሎ እንጂ «ምን ማለት ነው?» ብሎ በትርጓሜ አይፈታውም።
- source_word: Λίθον
  choice: ድንጋይ
  rationale: በመዝሙሩ ጥቅስ የተለየውን ድንጋይ ያመለክታል፤ በአማርኛም የግልጽነት ቃል ኪዳን ሳያስፈልግ በተፈጥሮ ይገለጻል።
- source_word: ἀπεδοκίμασαν
