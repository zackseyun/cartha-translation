  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: am
  text: ኢየሱስም፣ “እኔም እነዚህን ነገሮች በምን ሥልጣን እንደማደርግ አልነግራችሁም” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδὲ
  choice: እኔም ቢሆን … አልነግራችሁም
  rationale: οὐδέ የኢየሱስን ምላሽ በቀደመው ቁጥር ከተገለጠው የመሪዎቹ እምቢታ ጋር ያያይዛል፤ ይህ አገላለጽ በአማርኛ የተመሳሳይ ምላሽን ኃይል በተፈጥሮ ያሳያል።
- source_word: λέγω
  choice: አልነግራችሁም
  rationale: እዚህ λέγω ለተጠየቀው ጉዳይ መልስን መግለጥ ስለሚያመለክት፣ “መናገር” ከሚለው ይልቅ “መንገር” ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: ἐν ከἐξουσίᾳ ጋር በዚህ አውድ ድርጊቱ የሚፈጸምበትን ሕጋዊ መሠረት ወይም ውክልና ያመለክታል፤ “በምን ሥልጣን” ይህን በተለመደ አማርኛ ይገልጣል።
- source_word: ἐξουσίᾳ
  choice: ሥልጣን
  rationale: ቃሉ ተራ ኃይልን ሳይሆን ተገቢ መብትንና ውክልናን ያመለክታል፤ “ሥልጣን” በአውዱ ትክክለኛው ምርጫ ነው።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ይጠብቃል፣ በክርክር ላይ ያሉትንም የኢየሱስ ድርጊቶች ወደኋላ ያመለክታል።
- source_word: ποιῶ
  choice: እንደማደርግ
  rationale: የአሁን ጊዜውን ቀጣይ ወይም ልማዳዊ ድርጊት ያለ አላስፈላጊ ትርጓሜ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ኢየሱስም … አላቸው
  rationale: የκαίን ትስስር በ“-ም” ይጠብቃል፤ የግሪኩን ተቀባዮችም “አላቸው” በማለት በተፈጥሯዊ የአማርኛ ንግግር ያሳያል።
theological_decisions:
- issue: ኢየሱስ ለመሪዎቹ መልስ አለመስጠቱ
  choice: የሥልጣኑን ምንጭ እንደማይነግራቸው ቀጥተኛ እምቢታ አድርጎ መተርጎም
  alternative: ጥያቄውን እንደሸሸ ወይም አለማመናቸውን በግልጽ እንደፈረደ አድርጎ መጨመር
  rationale: ጥቅሱ ራሱ ኢየሱስ በምን ሥልጣን እነዚህን እንደሚያደርግ እንደማይነግራቸው ብቻ ይናገራል፤ ምክንያቱን በትርጉሙ ውስጥ መጨመር አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “እኔም ቢሆን” ከቀደመው እምቢታ ጋር ያለውን ምላሳዊ ትስስር በተፈጥሮ ይገልጣል። የእንግሊዝኛው [a] ማስታወሻ “by/with” የሚለውን የእንግሊዝኛ ቅድመ አገባብ ልዩነት ብቻ ስለሚመለከት፣ በአማርኛ “በምን ሥልጣን” ሁለቱንም በተፈጥሮ ይሸፍናልና የግርጌ ማስታወሻ አልተጨመረም።
