lexical_decisions:
- source_word: κατανοήσας
  choice: ተረድቶ
  rationale: የግሪኩ ያለፈ ጊዜ አሳታፊ ግስ፣ ከመናገሩ በፊት የእነርሱን ዓላማ በአእምሮ እንደተገነዘበ ያሳያል። ‘ተረድቶ’ የማስተዋልንና የመገንዘብን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: ግን
  rationale: በትረካው ውስጥ ቀላል ንጽጽርንና ወደ ኢየሱስ ምላሽ መሸጋገርን ያመለክታል።
- source_word: αὐτῶν
  choice: -አቸው
  rationale: የባለቤትነት ዝምድናው በ‘ተንኮላቸው’ ውስጥ በአማርኛ በተፈጥሯዊ መንገድ ተገልጧል።
- source_word: πανουργίαν
  choice: ተንኮል
  rationale: ቃሉ ብልህነትን ብቻ ሳይሆን የማታለልና ያልቀና ዕቅድ አሉታዊ ሐሳብን ይይዛል፤ ‘ተንኮል’ ይህን ስፋት በአጭርና በተለመደ ቃል ያስተላልፋል።
- source_word: εἶπεν
  choice: አላቸው
  rationale: የትረካ ያለፈ ጊዜ ግስንና የንግግሩን ተቀባዮች በተፈጥሯዊ አማርኛ በአንድ ቃል ይገልጣል።
- source_word: πρὸς αὐτούς
  choice: አላቸው
  rationale: πρός የንግግሩን ተቀባዮች ያመለክታል፤ ይህ በአማርኛው የግስ ቅጥ ‘አላቸው’ ውስጥ ተካትቷል።
