  text: እርሱ ግን ተንኮላቸውን[a] ተረድቶ እንዲህ አላቸው፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተንኮለኛ ብልሃታቸውን፣” “ማታለያቸውን” ወይም “ሸፍጣቸውን።” የግሪኩ ቃል ብልህነትን ለመጥፎና ላልቀና ዕቅድ የመጠቀምን ሐሳብ ይዟል።
