  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: am
  text: 'እርሱም እንዲህ አላቸው፦ “መሲሑ[a] የዳዊት ልጅ[b] ነው ብለው እንዴት ይላሉ?”


    [a] ወይም “ክርስቶስ።” በግሪክኛው Χριστός የሚለው ማዕረግ እዚህ ከዳዊት ዘር እንደሚመጣ የሚጠበቀውን ንጉሣዊ አዳኝ ስለሚያመለክት “መሲሕ” ተብሎ ተተርጉሟል።


    [b] ቃል በቃል “የዳዊት ልጅ።” ይህ አገላለጽ “ከዳዊት ዘር የሆነ ልጅ” ወይም “የዳዊት ልጁ” ተብሎ ሊገባ ይችላል።'
  philosophy: optimal-equivalence
