  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: am
  text: ነገር ግን፣ ‘ከሰዎች ነው’ ብንል፣ ሕዝቡ ሁሉ ይወግሩናል፤ ዮሐንስ ነቢይ እንደሆነ[a] እርግጠኞች ናቸውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዮሐንስ ነቢይ እንደነበረ።” የግሪኩ የማይወሰን የግስ ቅጽ በራሱ ጊዜን አይወስንም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: ነገር ግን፣ … ብንል
  rationale: ἐὰν ከንዑስ አንቀጽ ጋር የሚያቀርበውን ሊሆን የሚችል ሁኔታ በተፈጥሯዊው የአማርኛ ሁኔታዊ አገላለጽ ‘ብንል’ ይገልጣል፤ δέ ደግሞ ‘ነገር ግን’ ተብሏል።
- source_word: Ἐξ ἀνθρώπων
  choice: ከሰዎች ነው
  rationale: በአውዱ የዮሐንስን ጥምቀት ምንጭ የሚመለከተውን ሞላ ያልተባለ ሐረግ በአማርኛ አጭርና ግልጽ አድርጎ ያቀርባል፤ ‘ከሰው የመነጨ ነው’ ከሚለው ያነሰ ትርጓሜ ይጨምራል።
- source_word: ὁ λαὸς ἅπας
  choice: ሕዝቡ ሁሉ
  rationale: λαός የሕዝብን ስብስባዊ ማንነት፣ ἅπας ደግሞ ሙሉነቱን ያሳያል።
- source_word: καταλιθάσει ἡμᾶς
  choice: ይወግሩናል
  rationale: ግሱ በድንጋይ መውገርን በቀጥታ ይገልጣል፤ ምንጩ በግልጽ ያልጨመረውን ‘እስከ ሞት’ አልጨመርንም።
- source_word: πεπεισμένος γάρ ἐστιν
  choice: እርግጠኞች ናቸውና
  rationale: የግሪኩ ነጠላ ቅርጽ ሕዝቡን እንደ አንድ ስብስብ ይመለከታል፤ በአማርኛ ግን ‘ሕዝቡ ሁሉ’ ጋር ብዙ ቁጥር ተፈጥሯዊ ነው። γάρ የምክንያት ኃይሉ በ‘ና’ ተጠብቋል።
- source_word: Ἰωάννην προφήτην εἶναι
  choice: ዮሐንስ ነቢይ እንደሆነ
  rationale: የግሪኩ መስተዋድድ የጊዜ ምልክት በራሱ አይወስንም፤ የአማርኛው ‘እንደሆነ’ የሕዝቡን በዚያን ጊዜ ያለ እምነት በተፈጥሯዊ ሁኔታ ይገልጣል።
theological_decisions:
- issue: ሕዝቡ ስለ ዮሐንስ ያለውን ግምት የጊዜ አገላለጽ
  choice: ዮሐንስ ነቢይ እንደሆነ
  alternative: ዮሐንስ ነቢይ እንደነበረ
  rationale: εἶναι በራሱ ጊዜን አይገልጽም። ‘እንደሆነ’ የሕዝቡን ወቅታዊ እርግጠኝነት ያሳያል፤ ‘እንደነበረ’ም በትረካው ያለፈ ጊዜ አንጻር ሊባል ይችላል። አማራጩ በማስታወሻ ተጠብቋል።
