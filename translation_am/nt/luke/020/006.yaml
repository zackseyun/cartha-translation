  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። ‘ይወግሩናል’ መጽሐፍ ቅዱሳዊ ክብሩን ሳያጣ በዘመናዊ አማርኛ የታወቀ ነው።
