  text: Was John's baptism from heaven or from men?[a]
translation:
  language: am
  text: የዮሐንስ ጥምቀት ከሰማይ ነበር ወይስ ከሰዎች?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእግዚአብሔር»፤ ግሪኩ ቃል በቃል «ከሰማይ» ይላል። ይህም መለኮታዊ ምንጭን ወይም ሥልጣንን በአክብሮት የሚገልጽ አነጋገር ነው።
