lexical_decisions:
- source_word: βάπτισμα
  choice: ጥምቀት
  rationale: ቃሉ ከዮሐንስ ጋር የተያያዘውን ሥርዓትና ተግባር ያመለክታል፤ «ጥምቀት» በዘመናዊ አማርኛ የተለመደና ትክክለኛ አቻ ነው።
- source_word: Ἰωάννου
  choice: የዮሐንስ
  rationale: የግሪኩ የባለቤትነት/የግንኙነት ቅርጽ ጥምቀቱ ከዮሐንስ ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐξ οὐρανοῦ
  choice: ከሰማይ
  rationale: የግሪኩን ቀጥተኛ አገላለጽና ለመለኮታዊ ምንጭ ወይም ሥልጣን የሚያመለክተውን አክብሮታዊ ፈሊጥ ይጠብቃል።
- source_word: ἐξ ἀνθρώπων
  choice: ከሰዎች
  rationale: ἀνθρώπων እዚህ ጾታን ሳይለይ ሰዎችን በአጠቃላይ ያመለክታል፤ «ከሰዎች» ከመለኮታዊው ምንጭ ጋር የተቃረነውን ሰብአዊ ምንጭ በትክክል ያሳያል።
- source_word: ἦν
  choice: ነበር
  rationale: የግሪኩን አያያዥ ግስና ያለፈ ጊዜ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἢ
  choice: ወይስ
  rationale: በቀጥተኛ ጥያቄ ውስጥ ሁለት አማራጮችን ለማነጻጸር «ወይስ» ተፈጥሯዊ የአማርኛ አገናኝ ነው።
theological_decisions:
- issue: «ከሰማይ» የሚለው አገላለጽ ከዮሐንስ ጥምቀት ጋር ያለው ትርጉም
  choice: በዋናው ጽሑፍ «ከሰማይ» የሚለውን ፈሊጣዊ አገላለጽ ማቆየት
  alternative: ከእግዚአብሔር
  rationale: ሐረጉ መለኮታዊ ምንጭን ወይም ሥልጣንን ያመለክታል፤ ሆኖም ግሪኩ በግልጽ «ከሰማይ» ይላል። ይህን ማቆየት የምንጩን አገላለጽና የትርጉም ስፋቱን ሳይወስን ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ከሰዎች» ጾታ-አጠቃላይ የሆነውን የግሪኩን ትርጉም ይጠብቃል፤ «ከሰማይ» ደግሞ የመነሻውን አክብሮታዊ ፈሊጥ እንዳለ ያቆያል።
