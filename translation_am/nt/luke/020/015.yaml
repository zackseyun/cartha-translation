  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: am
  text: ከወይን እርሻውም አውጥተውት ገደሉት። እንግዲህ የወይን እርሻው ባለቤት[a] ምን ያደርግባቸዋል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የወይን እርሻው ጌታ” ወይም “የወይን እርሻው አለቃ።” የግሪኩ ቃል κύριος (ኪዩሪዮስ) እንደ ማዕረግ ሲያገለግል ብዙ ጊዜ “ጌታ” ተብሎ ይተረጎማል፤ እዚህ ግን በምሳሌው ውስጥ የወይን እርሻውን ሰብዓዊ ባለቤት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: አውጥተው
  rationale: የግሪኩ የአኦሪስት አድራጊ አንቀጽ ከመግደሉ በፊት ከወይን እርሻው እንዳስወጡት ያሳያል፤ “አውጥተው” ማስወጣቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ከወይን እርሻው
  rationale: ከእርሻው ውስጥ ወደ ውጭ የተደረገውን እንቅስቃሴ ከ“አውጥተው” ጋር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπέκτειναν
  choice: ገደሉት
  rationale: ግሱ በቀጥታ “ገደሉት” ማለት ነው፤ “ገድለው ጣሉት” ወይም “ግድያ ፈጸሙበት” የሚሉ አገላለጾች በግሱ ውስጥ ያልተገለጸ ተጨማሪ ትርጉም ሊያስገቡ ይችላሉ።
- source_word: τί οὖν
  choice: እንግዲህ … ምን
  rationale: “እንግዲህ” የοὖνን ከቀደመው ድርጊት የሚነሳ የውጤት ወይም የማጠቃለያ ኃይል በዘመናዊ አማርኛ ይጠብቃል።
- source_word: ποιήσει αὐτοῖς
  choice: ምን ያደርጋቸዋል
  rationale: በአማርኛ የተውላጠ ስሙን በግሱ ውስጥ ማካተት ተፈጥሯዊ ነው፤ አገላለጹ ባለቤቱ በእነርሱ ላይ ምን እርምጃ እንደሚወስድ ይጠይቃል።
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: የወይን እርሻው ባለቤት
  rationale: κύριος ብዙ ጊዜ “ጌታ” ተብሎ ቢተረጎምም፣ በዚህ ምሳሌ ውስጥ የሚያመለክተው የወይን እርሻውን ሰብዓዊ ባለንብረት ነው፤ “ባለቤት” ይህን አውዳዊ ትርጉም በግልጽ ያስተላልፋል።
theological_decisions:
- issue: κύριοςን በምሳሌው ውስጥ መተርጎም
  choice: ባለቤት
  alternative: ጌታ፤ አለቃ
  rationale: ቃሉ እዚህ በትረካው ደረጃ የወይን እርሻውን ባለንብረት ያመለክታል እንጂ በቀጥታ መለኮታዊ ማዕረግን አያመለክትም። “ባለቤት” የምሳሌውን ሥነ መለኮታዊ ጠቀሜታ ሳያጠፋ በአፋጣኝ አውዱ የሚፈለገውን ሰብዓዊ ባለንብረትነት ያሳያል፤ የቃሉ ሌሎች ትርጉሞች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “የወይን እርሻ” ἀμπελώνን በተፈጥሯዊ ወቅታዊ አገላለጽ ያስተላልፋል፤ የ[a] ምልክትም የሚያብራራውን “ባለቤት” ቃል ተከትሎ ተቀምጧል።
