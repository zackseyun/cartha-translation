source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: am
  text: በተገቢው ጊዜ፣ ከወይን እርሻው ፍሬ ጥቂት እንዲሰጡት ወደ ወይን አብቃዮቹ አንድ ባሪያ[a] ላከ። ወይን አብቃዮቹ ግን ደብድበው ባዶ እጁን[b] መለሱት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይ።” የግሪኩ ቃል ሁለቱንም ሊያመለክት ቢችልም፣ በዚህ አውድ “ባሪያ” የሚለው ቃል የባርነት ማኅበራዊ ሁኔታውን በግልጽ ያሳያል።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “ባዶ ሆኖ።” በአውዱ ምንም ሳይቀበል እንደተላከ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: በተገቢው ጊዜ
  rationale: የዳቲቭ አጠቃቀሙ ተስማሚውን ወይም የተወሰነውን ጊዜ ያመለክታል፤ “የመከር ጊዜ” በማለት ግሪኩ በግልጽ ያልጠቀሰውን አይጨምርም።
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: ቀላሉን የመላክ ድርጊት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: γεωργούς
  choice: የወይን አትክልተኞች
  rationale: ከἀμπελών አውድ ጋር የእርሻውን ዓይነት ይጠብቃል፤ ቃሉ በራሱ የማይገልጸውን የሕግ ተከራይነት አያስገባም።
- source_word: δοῦλον
  choice: ባሪያ
  rationale: በምሳሌው ማኅበራዊ አውድ የታሰረውን ሁኔታ በግልጽ ይጠብቃል፤ “አገልጋይ” የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: እንዲሰጡት
  rationale: የἵνα የዓላማ ኃይልን በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: ከወይን እርሻው ፍሬ ጥቂት
  rationale: ἀπό ከጄኒቲቭ ጋር ያለውን ከፊል የመውሰድ ስሜት ያሳያል፤ ያልተገለጸ የሕግ ድርሻ አይጨምርም።
- source_word: ἐξαπέστειλαν
  choice: ሰደዱት
  rationale: የግሪኩ ድብልቅ ግስ ያለውን ከቦታው የማሰናበት ወይም ወደ ውጭ የመላክ ኃይል በአውዱ ይገልጻል።
- source_word: δείραντες
  choice: ደብድበው
  rationale: የአኦሪስት ክፍለ ግሱን ቀዳሚ ድርጊት ያሳያል፤ ከ“ገርፈው” ይልቅ የተወሰነ የቅጣት ዘዴ አይጭንም።
- source_word: κενόν
  choice: ባዶ እጁን
  rationale: “ባዶ” የሚለውን ቀጥተኛ ትርጉም በተፈጥሯዊ የአማርኛ ፈሊጥ ያቀርባል፤ ምንም እንዳልተቀበለ ያመለክታል።
