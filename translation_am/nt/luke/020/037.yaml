base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: am
  text: ደግሞም ሙታን እንደሚነሡ፣ ሙሴ እንኳ ስለ ቁጥቋጦው በሚናገረው ክፍል[a] ገልጦታል፤ በዚያም ጌታን[b]፣ “የአብርሃም አምላክ፣ የይስሐቅ አምላክ፣ የያዕቆብም አምላክ” ብሎ ይጠራዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቁጥቋጦው ዘንድ።” የግሪኩ አገላለጽ ቁጥቋጦው የነበረበትን ትዕይንት ወይም በፈሊጣዊ አጠቃቀም ስለሚነደው ቁጥቋጦ የሚናገረውን የመጽሐፍ ክፍል (ዘፀአት 3) ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ጌታ” ይላል፤ ይህም በዘፀአት 3 ያለውን መለኮታዊ ስም የሰብዓ ሊቃናት ትርጉም (ሴፕቱዋጂንት) በተለምዶ የተረጎመበትን አካሄድ ያንጸባርቃል።
    reason: cross_reference
