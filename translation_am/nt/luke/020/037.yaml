  rationale: አገላለጹ ቁጥቋጦው የታየበትን ስፍራ ብቻ ሳይሆን ስለ ቁጥቋጦው የሚናገረውን የመጽሐፍ ክፍል ሊያመለክት ይችላል፤ ዋናው ጽሑፍ በዐውደ ንባቡ የሚስማማውን ሥነ ጽሑፋዊ ትርጉም ይጠቀማል።
