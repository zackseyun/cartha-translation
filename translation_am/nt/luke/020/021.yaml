  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: am
  text: እነርሱም እንዲህ ብለው ጠየቁት፦ “መምህር ሆይ፣ በትክክል እንደምትናገርና እንደምታስተምር፣ ለሰውም እንደማታዳላ፣[a] ነገር ግን የእግዚአብሔርን መንገድ በእውነት እንደምታስተምር[b] እናውቃለን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ፊትን አትቀበልም።” ይህ ለሰው አለማዳላትን ወይም በውጫዊ ገጽታና በማዕረግ አለመወሰድን የሚገልጽ ፈሊጥ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የእግዚአብሔርን መንገድ በእውነት ታስተምራለህ።”
    reason: lexical_alternative
