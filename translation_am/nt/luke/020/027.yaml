  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: am
  text: ከሰዱቃውያንም መካከል አንዳንዶቹ፣ ከሙታን መነሣት እንደሌለ የሚክዱ፣ ወደ እርሱ ቀርበው ጠየቁት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: ወደ እርሱ ቀርበው
  rationale: የግሱን ወደ ኢየሱስ የመቅረብ እንቅስቃሴና ከዋናው ግስ በፊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δέ
  choice: -ም
  rationale: እዚህ ላይ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያመለክታል፤ በአማርኛ ከ«ሰዱቃውያንም» ጋር በተዋሐደው -ም ተወክሏል።
- source_word: τινες τῶν Σαδδουκαίων
  choice: ከሰዱቃውያን አንዳንዶቹ
  rationale: የግሪኩን ከአንድ ቡድን ከፊሎቹን የሚያመለክት ክፍላዊ አገላለጽ ግልጽ አድርጎ ያቀርባል።
- source_word: οἱ ἀντιλέγοντες
  choice: የሚክዱ
  rationale: በዐውዱ ውስጥ ያለው ተቃውሞ ተራ የቃል ክርክር ሳይሆን ከሙታን መነሣት መኖሩን መካድ ነው።
- source_word: ἀνάστασιν μὴ εἶναι
  choice: ከሙታን መነሣት እንደሌለ
  rationale: የተካደውን ይዘት በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል፤ «ከሙታን» የሚለው በዚህ ዐውድ የመነሣትን ፍቺ ግልጽ ያደርጋል።
- source_word: ἐπηρώτησαν αὐτόν
  choice: ጠየቁት
  rationale: ቀጥተኛውን ተሳቢ ከግሱ ጋር በማዋሐድ የግሪኩን «እርሱን ጠየቁ» በተፈጥሯዊ አማርኛ ያቀርባል፤ ቀጣዩ ዐውድ የጥያቄውን ፈታኝ ባሕርይ ያሳያል።
theological_decisions:
