  text: እነርሱ ግን እርስ በርሳቸው አመዛዘኑ፤ እንዲህም አሉ፦ “ከሰማይ ነው ብንል፣ እርሱ፣ ‘ታዲያ ለምን አላመናችሁትም[a]?’ ይላል።”
  philosophy: optimal-equivalence
