  rationale: የቡድን ውስጥ ማመዛዘንንና መወያየትን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን የሆነ ውሳኔ ለመድረስ የማሰብ ሐሳብም ይጠብቃል።
