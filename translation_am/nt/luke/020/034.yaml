  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፦ “የዚህ ዘመን ልጆች[a] ያገባሉ፣ ለትዳርም ይሰጣሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዚህ ዘመን ሰዎች።” ግሪኩ ቃል በቃል “የዚህ ዘመን ወንድ ልጆች” ይላል፤ ይህም የአሁኑ ዘመን አባል የሆኑትን ሰዎች በአጠቃላይ የሚወክል አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል የትረካ አያያዥ በተፈጥሯዊ የአማርኛ አገባብ ያስተላልፋል፤ ተጨማሪ የጊዜ ትርጉም አያስገባም።
- source_word: εἶπεν αὐτοῖς
  choice: እንዲህ አላቸው
  rationale: ‘አላቸው’ የንግግሩን ተቀባዮች ያሳያል፤ ‘እንዲህ’ ቀጥሎ የሚመጣውን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: የዚህ ዘመን ልጆች
  rationale: ‘ልጆች’ የ‘የ... ልጆች’ን የአባልነትና የባሕርይ ሴማዊ አገላለጽ ይጠብቃል፤ በአማርኛም ወንዶችንና ሴቶችን በአጠቃላይ ሊያመለክት ይችላል። ‘ዘመን’ ደግሞ ከሚመጣው ዘመን ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: γαμοῦσιν
  choice: ያገባሉ
  rationale: ንቁውን የጋብቻ ግስ በተለመደና ግልጽ ዘመናዊ አማርኛ ይተረጉማል።
- source_word: γαμίσκονται
  choice: ለትዳርም ይሰጣሉ
  rationale: በግሪኩ በንቁውና በተደራጊው የጋብቻ አገላለጽ መካከል ያለውን ልዩነት ይጠብቃል፤ ትርጉሙ ‘ለጋብቻ ይሰጣሉ’ የሚለው ነው።
theological_decisions:
- issue: በአጠቃላይ ትርጉም የገባ ጾታዊ አገላለጽ
  choice: የዚህ ዘመን ልጆች
  alternative: የዚህ ዘመን ሰዎች
  rationale: ግሪኩ ቃል በቃል ‘ወንድ ልጆች’ ይላል፣ ነገር ግን አገላለጹ የዚህ ዘመን አባል የሆኑትን ሰዎች በአጠቃላይ ይወክላል። ‘ልጆች’ የመነሻውን ዘይቤ ሳያጠፋ በአማርኛ ጾታ አካታች ነው።
- issue: αἰών እንደ መጨረሻ-ዘመን ምድብ
  choice: ይህ ዘመን
  alternative: ይህ ዓለም
  rationale: ‘ዘመን’ በአውዱ ውስጥ ካለው ‘ከዚያ ዘመን’ ጋር የሚደረገውን ንጽጽር በትክክል ይጠብቃል፤ ‘ዓለም’ የፍጥረት ወይም የምድር ትርጉምን ሊያስታውስ ይችላል።
- issue: በሁለቱ የጋብቻ ግሶች መካከል ያለው ንቁ/ተደራጊ ልዩነት
  choice: ያገባሉ፣ ለትዳርም ይሰጣሉ
  alternative: ይጋባሉ
  rationale: ሁለቱን ግሶች በአንድ አጠቃላይ አገላለጽ ከማዋሃድ ይልቅ መነሻው ያለውን ትይዩ ልዩነት ያቆያል፤ በተጨማሪም ከጽሑፉ በላይ የጾታ መለያ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሴማዊ ዘይቤ ‘የዚህ ዘመን ልጆች’ ተጠብቆ፣ ትርጉሙ በማስታወሻ ተብራርቷል።
