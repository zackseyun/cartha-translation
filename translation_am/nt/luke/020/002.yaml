id: LUK.20.2
reference: Luke 20:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: am
  text: እነርሱም እንዲህ አሉት፦ “ንገረን፤ እነዚህን ነገሮች በምን ሥልጣን ታደርጋለህ? ወይስ ይህን ሥልጣን የሰጠህ ማን ነው?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የአማርኛው -ም ቀዳሚውን ትረካ ከዚህ ንግግር ጋር በተፈጥሯዊ ሁኔታ ያያይዛል።
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: እንዲህ አሉት
  rationale: የግሪኩን የንግግር ማስተዋወቂያ ትርጉም ጠብቆ፣ በአማርኛ የማይደጋገምና ተፈጥሯዊ አገላለጽ ይሰጣል፤ በአሉት ውስጥ ተቀባዩም ተገልጿል።
- source_word: Εἰπὸν ἡμῖν
  choice: ንገረን
  rationale: የነጠላ ትእዛዝ ቅርጹንና ‘ለእኛ’ የሚለውን ተቀባይ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: ἐν እዚህ የድርጊቱን መሠረት ወይም ፈቃድ ያመለክታል፤ ‘በምን ሥልጣን’ የጥያቄውን ፈታኝ ኃይል ሳያጠፋ ይገልጣል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥር ጠብቆ በቅርቡ በቤተ መቅደስ የተደረጉትን ድርጊቶች ያመለክታል።
- source_word: ποιεῖς
  choice: ታደርጋለህ
  rationale: የአሁን ጊዜውን ድርጊት በተለመደው የአማርኛ ጥያቄ አቀራረብ ያሳያል።
- source_word: ἢ
  choice: ወይስ
  rationale: ሁለተኛውን ተያያዥ ነገር ግን እንደ አማራጭ አቀራረብ የሚያቀርብ ጥያቄ መሆኑን ያሳያል።
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: የሰጠህ ማን ነው
  rationale: ὁ δούς የሚያመለክተውን ‘ሰጪውን’ በግልጽና ተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ይጠብቃል።
- source_word: τὴν ἐξουσίαν ταύτην
  choice: ይህን ሥልጣን
  rationale: ταύτην የሚያመለክተውን ቅርበት ይጠብቃል፤ ‘ሥልጣን’ ደግሞ በዚህ አውድ የተፈቀደ መብትንና ሥልጣናዊ ፈቃድን ያመለክታል።
theological_decisions:
- issue: በኢየሱስ የቤተ መቅደስ ድርጊት ላይ ἐξουσία የሚለው ቃል ያለው ትርጉም
  choice: ሥልጣን
  alternative: ኃይል፤ መብት
  rationale: መሪዎቹ የሚጠይቁት ኢየሱስ ድርጊቱን የማድረግ ችሎታ እንዳለው ሳይሆን፣ ድርጊቱ በምን ፈቃድና ከማን በተሰጠ ሥልጣን እንደሆነ ነው። ‘ሥልጣን’ ይህን ሃይማኖታዊና ተቋማዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። ‘ንገረን’ የነጠላ ትእዛዝ መሆኑን ይጠብቃል፤ የሁለቱ ጥያቄዎች ልዩነትም በ‘በምን ሥልጣን’ እና ‘የሰጠህ ማን ነው’ በሚሉት አገላለጾች ተጠብቋል።
