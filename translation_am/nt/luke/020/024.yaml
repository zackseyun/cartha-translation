base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: am
  text: “አንድ ዲናር[a] አሳዩኝ። የማን ምስልና ጽሑፍ አለበት?” እነርሱም፣ “የቄሳር ነው” ብለው መለሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዲናር በዚያ ዘመን በስፋት ጥቅም ላይ የሚውል የሮም ሳንቲም ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: አሳዩኝ
  rationale: የግሪኩን ቀጥተኛ ትእዛዝ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δηνάριον
  choice: አንድ ዲናር
  rationale: የሳንቲሙን ታሪካዊ ስም በመጠበቅ ከአጠቃላይ ‘ሳንቲም’ የበለጠ ትክክለኛ ነው።
- source_word: τίνος
  choice: የማን
  rationale: በዚህ አውድ የባለቤትነትን ወይም የዝምድናን ጥያቄ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰκόνα
  choice: ምስል
  rationale: በሳንቲሙ ላይ ያለውን የሰው ምስል ይገልጣል፤ የቃሉንም ሰፊ ትርጉም ይጠብቃል።
- source_word: ἐπιγραφήν
  choice: ጽሑፍ
  rationale: በሳንቲም ላይ የተቀረጸውን ጽሑፍ በግልጽና በተለመደ አማርኛ ያመለክታል።
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: እነርሱም፣ … ብለው መለሱ
  rationale: የግሪኩን የቦዝ አንቀጽና ዋና ግስ ጥምረት ያለ እንጨታማነት በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: Καίσαρος
  choice: የቄሳር ነው
  rationale: በግሪኩ ያለውን አጭር የዝምድና መልስ በአማርኛ ሙሉና ተፈጥሯዊ መልስ ያደርገዋል።
