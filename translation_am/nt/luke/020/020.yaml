  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: am
  text: እርሱን በቅርብ ከተከታተሉ በኋላ፣ ራሳቸውን ጻድቃን የሚያስመስሉ ሰላዮችን ላኩ፤ በንግግሩ ሊያጠምዱት[a]፣ በዚህም ለገዢው አገዛዝና ሥልጣን አሳልፈው እንዲሰጡት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ “በቃሉ ሊይዙት” ወይም “ቃሉን ሊቆናጠጡት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: በቅርብ ከተከታተሉት በኋላ
  rationale: የጠላትነት ክትትልንና ከዋናው ግስ በፊት የተፈጸመ ድርጊትን ያሳያል፤ ተሳቢው ‘እርሱን’ ከዐውዱ ተጨምሯል።
- source_word: ἐγκαθέτους
  choice: ሰላዮችን
  rationale: ለማጥመድ በስውር የተመደቡ ሰዎችን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: ጻድቃን መስለው የሚቀርቡ
  rationale: የማታለል ራስ-አቀራረባቸውን ይገልጣል፤ ‘ጻድቃን’ የδίκαιοςን ሥነ ምግባራዊና ሃይማኖታዊ ክብደት ይጠብቃል።
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: ከተናገረው ነገር አንዳች ለማጥመድ
  rationale: በንግግሩ መሠረት ሊያጠምዱት የነበራቸውን ዓላማ ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል፤ ቀጥተኛው ምስላዊ አገላለጽ በማስታወሻ ተጠብቋል።
- source_word: ὥστε
  choice: ከዚያም
  rationale: የማጥመዱን የታሰበ ውጤት ከአሳልፎ መስጠቱ ጋር በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: παραδοῦναι
  choice: አሳልፈው ለመስጠት
  rationale: በፍርድና በጠላትነት ዐውድ የተለመደውን የπαραδίδωμι ትርጉም ይጠብቃል።
- source_word: τῇ ἀρχῇ
  choice: ለገዢው አስተዳደር
  rationale: ἀρχήን እንደ ገዢ ሥርዓት ወይም ኦፊሴላዊ አስተዳደር ይገልጣል፣ ከሚቀጥለው ἐξουσίαም አይደባለቅም።
- source_word: τῇ ἐξουσίᾳ
  choice: ሥልጣን
  rationale: ሕጋዊ ወይም የተሰጠ የማስፈጸም ሥልጣንን በትክክል ይገልጣል።
- source_word: τοῦ ἡγεμόνος
  choice: የገዢው
  rationale: በሮማዊው የክልል አስተዳደር ዐውድ ውስጥ ቀላልና ትክክለኛ አቻ ነው።
theological_decisions:
- issue: በሐሰተኛ የሥነ ምግባር አቋም ዐውድ ውስጥ δίκαιοςን መተርጎም
  choice: ጻድቃን
  alternative: ቅኖች / ፍትሐውያን
  rationale: ‘ጻድቃን’ ቃሉ ያለውን ሥነ ምግባራዊና ሃይማኖታዊ ክብደት ይጠብቃል፤ የእነርሱ ማስመሰል በአገላለጹ በግልጽ ተለይቷል።
- issue: τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ የሚለው ጥምር አገላለጽ
  choice: ለገዢው አስተዳደርና ሥልጣን
  alternative: ለገዢው አገዛዝና ሥልጣን / ለገዢው ሥልጣን
  rationale: ሁለቱን የግሪክ ቃላት አንድ አድርጎ ከማጥፋት ይልቅ ኦፊሴላዊውን አስተዳደርና የማስፈጸም ሥልጣኑን ለይቶ ያቆያል፤ እነዚህ ለገዢው የሚያመለክቱ መሆናቸውም በአገባቡ ተጠብቋል።
