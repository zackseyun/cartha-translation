review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the coordinated objects of τυχεῖν and the contrast between γαμοῦσιν and γαμίζονται. However, “የተገባቸው” normally means “what is due to them,” rather than “worthy/fit,” and the second marriage clause lacks the passive sense of γαμίζονται.
  naturalness: The revised wording is clear, modern standard Amharic. “ብቁ ተብለው የተቆጠሩት” naturally conveys an externally made assessment, and the impersonal passive-equivalent construction makes explicit that they are not given by others in marriage.
  terminology: “ከሙታን ትንሣኤ” is the standard concise expression for “resurrection from the dead.” The wording retains the text’s evaluative passive without asserting intrinsic merit.
  issues:
  - severity: medium
    issue: “የተገባቸው” is not an idiomatic equivalent of καταξιωθέντες.
    rationale: In modern Amharic it ordinarily refers to something owed or due to someone. “ብቁ ተብለው የተቆጠሩት” expresses being considered fit or worthy and preserves the passive/evaluative force.
  - severity: medium
    issue: “ለጋብቻም አይሰጡም” makes the subject the giver rather than the one given in marriage.
    rationale: γαμίζονται is passive. “ማንም ለጋብቻ አይሰጣቸውም” is a natural Amharic passive-equivalent and preserves the historical social idiom without implying that the resurrected themselves give others in marriage.
  - severity: low
    issue: Footnote b is not anchored directly to “ያን ዘመን.”
    rationale: Moving the marker to its corresponding phrase makes the lexical alternative unambiguous.
