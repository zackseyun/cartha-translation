  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: am
  text: ነገር ግን ያን ዘመን[b]ና ከሙታን ትንሣኤን ለማግኘት ብቁ ተብለው የተቆጠሩት[a] አያገቡም፤ ማንም ለጋብቻ አይሰጣቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብቁ ተብለው የተፈረደላቸው።” የግሪኩ ቃል ተደራጊ ቅርጽ ያለው ሲሆን፣ ብቁ ተብለው የተቆጠሩ መሆናቸውን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የሚመጣውን ዘመን።” ቃል በቃል፣ “ያን ዘመን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: የተገባቸው ተብለው የተቆጠሩት
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ ሰዎቹ በራሳቸው ብቃት የተገባቸው እንደሆኑ ሳይወስን፣ የተገባቸው ተብለው መቆጠራቸውን ያሳያል።
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ያን ዘመን
  rationale: αἰών በዚህ አውድ ዘመንን ወይም የሕይወት ሥርዓትን ያመለክታል፤ የግሪኩን አመልካች ቃል በቅርብ ይከተላል እንጂ ‘የሚመጣው’ የሚለውን ትርጓሜ በዋናው ጽሑፍ አይጨምርም።
- source_word: τυχεῖν
  choice: ለማግኘት
  rationale: ከዘመኑና ከትንሣኤው ጋር በተፈጥሯዊ አማርኛ የሚስማማ ሲሆን፣ ‘ማግኘት/መድረስ’ የሚለውን የግሪክ ትርጉም ያስተላልፋል።
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: ከሙታን መነሳትን
  rationale: ἐκ የሚያመለክተውን ከሙታን መካከል መነሳት በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: γαμοῦσιν
  choice: አያገቡም
  rationale: ግሱን በአጠቃላይ ‘ማግባት’ ብሎ በቀላልና በዘመናዊ አማርኛ ያቀርባል።
- source_word: γαμίζονται
  choice: ለጋብቻም አይሰጡም
  rationale: ከመጀመሪያው ግስ የተለየውን ተደራጊ ቅርጽና በዚያ ዘመን ሰውን ለጋብቻ የመስጠት ማኅበራዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: καταξιωθέντες ሰዎች ትንሣኤን በራሳቸው ብቃት እንደሚያገኙ ያመለክት እንደሆነ
  choice: ‘የተገባቸው ተብለው የተቆጠሩት’ በማለት ፍርድን ወይም ግምገማን የሚያሳየው ተደራጊ አገላለጽ ተጠብቋል።
  alternative: ‘ያን ዘመን የሚገባቸው’
  rationale: ትርጉሙ የግሪኩን ተደራጊነት ይጠብቃል፤ በግል ብቃት የተገኘ ዋጋ መሆኑንም አያስገባም፣ የጽሑፉን ሥነ መለኮታዊ ውጥረትም አያጠፋም።
