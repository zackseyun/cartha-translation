base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: am
  text: ለቄሳር ግብር[a] መክፈል ይፈቀድልናልን፣ ወይስ አይፈቀድልንም?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ግብር” የሚለው የግሪክ ቃል ለገዢ ሥልጣን የሚከፈል ታክስ ወይም ቀረጥ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: ተፈቅዶልናልን
  rationale: ቃሉ በዚህ አውድ ችሎታን ሳይሆን ሕጋዊ ወይም ሃይማኖታዊ ፈቃድን ይጠይቃል፤ ይህ አተረጓጎም የትኛው ሕግ እንደታሰበ ሳይወስን ግልጽና ተፈጥሯዊ ነው።
- source_word: ἡμᾶς
  choice: ለእኛ
  rationale: ከወሰን የሌለው ግስ ጋር ያለውን ‘ለእኛ … ተፈቅዷል’ የሚለውን አወቃቀር ያስተላልፋል፤ በግሪኩ የሌለውን ‘ለእኛ ለአይሁድ’ የሚል መግለጫ አይጨምርም።
- source_word: Καίσαρι
  choice: ለቄሳር
  rationale: የሮምን ገዢ ታሪካዊና ፖለቲካዊ ማንነት የሚጠብቀውን ስም/ማዕረግ በቀጥታ ያስተላልፋል።
- source_word: φόρον
  choice: ግብር
  rationale: ለገዢ ሥልጣን የሚከፈልን ታክስ ወይም ቀረጥ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ ልዩ የግዛት ትርጉሙን የግርጌ ማስታወሻው ያብራራል።
- source_word: δοῦναι
  choice: መክፈል
  rationale: δίδωμι በመሠረቱ ‘መስጠት’ ቢሆንም ከግብር ጋር ‘መክፈል’ ትክክለኛና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἢ οὔ
  choice: ወይስ አልተፈቀደልንም?
  rationale: የአሉታዊ አማራጩን ‘ወይስ አይደለም?’ ትርጉም ከቀደመው ግስ ጋር በተፈጥሯዊ አማርኛ ደግሞ ይገልጻል።
theological_decisions:
- issue: በጥያቄው ውስጥ የተጠቀሰው የፈቃድ መሠረት
  choice: ‘ተፈቅዶልናልን’ በማለት የፈቃድ ጥያቄ እንደሆነ ተተርጉሟል፤ የሮም ሕግ ወይም የእግዚአብሔር ሕግ መሆኑ አልተወሰነም።
  alternative: ‘በሮም ሕግ ተፈቅዶልናልን?’ ወይም ‘በእግዚአብሔር ሕግ ተፈቅዶልናልን?’
  rationale: የግሪኩ ጽሑፍ የታሰበውን ሕግ በግልጽ አይጠቅስም። ጥያቄው ፖለቲካዊና ሃይማኖታዊ ወጥመድ ስለሆነ ያለው አሻሚነትና ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። ‘ግብር መክፈል’ ተፈጥሯዊ አገላለጽ ሲሆን ‘ቄሳር’ የታሪኩን ልዩነት ይጠብቃል።
