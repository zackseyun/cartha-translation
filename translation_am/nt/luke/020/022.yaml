    text: “ግብር” የሚለው የግሪክ ቃል ለገዢ ሥልጣን የሚከፈል ታክስ ወይም ቀረጥ ያመለክታል።
    reason: lexical_alternative
  revision_rationale: The revision changes only the verb forms for 'is it lawful/permitted ... or not?' from perfect passive to present permissibility, matching ἔξεστιν. The compact dative suffix -ልናል retains ἡμᾶς without redundancy. The footnote is retained with a minor grammatical smoothing and its anchor is placed directly after ግብር.
