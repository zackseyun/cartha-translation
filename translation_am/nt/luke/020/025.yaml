  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: am
  text: እርሱ ግን፣ “እንግዲህ የቄሳርን ለቄሳር፣ የእግዚአብሔርንም ለእግዚአብሔር መልሱ[a]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለቄሳር … ለእግዚአብሔርም … ስጡ [ወይም ክፈሉ]።” የግሪኩ ግስ የሚገባውን መስጠት፣ መክፈል ወይም መልሶ መስጠት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: እርሱ ግን … አላቸው
  rationale: “ግን” የδέን መጠነኛ ተቃርኖ ያሳያል፤ “አላቸው” ደግሞ λέγω πρὸς αὐτούς የሚለውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: Τοίνυν
  choice: እንግዲህ
  rationale: ከቀደመው ምላሽ የሚወጣውን መደምደሚያና የንግግሩን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπόδοτε
  choice: መልሱ
  rationale: ግሡ ለባለቤቱ ወይም ለሚገባው አካል አንድን ነገር መመለስ፣ መስጠት ወይም መክፈልን ሊያመለክት ይችላል። “መልሱ” የመልሶ መስጠትን ፍንጭ ይጠብቃል።
- source_word: τὰ Καίσαρος Καίσαρι
  choice: የቄሳርን ለቄሳር
  rationale: የግሪኩን አጭር እና ሰፊ አገላለጽ ይጠብቃል፤ ትርጉሙን በግብር ክፍያ ብቻ አያጥብም።
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: የእግዚአብሔርንም ለእግዚአብሔር
  rationale: ከቄሳር ጋር ያለውን የግሪኩን ትይዩ አወቃቀርና ንፅፅር ይጠብቃል።
- source_word: Καίσαρος / Καίσαρι
  choice: ቄሳር
  rationale: የሮማውን ንጉሠ ነገሥት ስምና ማዕረግ በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
- source_word: θεοῦ / θεῷ
  choice: እግዚአብሔር
  rationale: በዚህ አውድ θεός የእስራኤልን አምላክ ያመለክታል፤ “እግዚአብሔር” በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር የተለመደና የተከበረ አጠራር ነው።
theological_decisions:
- issue: የኢየሱስ ንግግር ፖለቲካዊና ሥነ መለኮታዊ ወሰን
  choice: ለቄሳርና ለእግዚአብሔር የሚገባውን የመስጠት ትይዩ ግዴታ ተጠብቋል፤ የእያንዳንዱ ሥልጣን ትክክለኛ ወሰን አልተወሰነም።
  alternative: ንግግሩን እንደ ጥብቅ የመንግሥትና የሃይማኖት መለያየት፣ እንደ ገደብ የለሽ የመንግሥት ሥልጣን ድጋፍ፣ ወይም ስለ ግብር ክፍያ ብቻ እንደተነገረ መተርጎም
  rationale: የግሪኩ ንግግር ለእያንዳንዱ የሚገባውን መስጠት ይናገራል እንጂ ሙሉ የፖለቲካ ሥነ መለኮትን አይዘረዝርም። ስለዚህ የጥቅሱ ስፋትና ውጥረት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። አጭሩ ትይዩ አወቃቀር የዋናውን ንግግር ምትና ስፋት ይጠብቃል።
