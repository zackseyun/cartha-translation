  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: am
  text: እርሱም ሦስተኛውን ላከ[a]፤ እነርሱ ግን ይህንም አቁስለው አባረሩት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል፣ «ሦስተኛውን ለመላክ ጨመረ» ይላል፤ ይህም «ሦስተኛውን ላከ» ወይም «ቀጥሎ ሦስተኛውን ላከ» ማለት የሆነ ፈሊጣዊ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: ላከ
  rationale: προστίθημι ከግስ መደበኛ ቅጽ ጋር ሲመጣ ድርጊቱን መቀጠልን የሚገልጽ ፈሊጣዊ አገላለጽ ነው። በአማርኛ «ሦስተኛውን ላከ» ማለት ከአውዱ ጋር የተደጋጋሚነቱን ሐሳብ በተፈጥሮ ያስተላልፋል።
- source_word: τρίτον πέμψαι
  choice: ሦስተኛውን ላከ
  rationale: በግሪኩ ተላኪውን የሚገልጽ ስም ተትቶ ከቀደመው አውድ እንዲገባ ተደርጓል። «ሦስተኛውን» ይህን አጭርነት ይጠብቃል፤ ማመልከቻውም ከቀደሙት ቁጥሮች ግልጽ ነው።
- source_word: οἱ δὲ
  choice: እነርሱ ግን
  rationale: δέ ከባለቤቱ ድርጊት ወደ ገበሬዎቹ ተቃራኒ ምላሽ የሚደረገውን ሽግግር ያመለክታል፤ «ግን» ይህን ተቃርኖ በተፈጥሮ ያሳያል።
- source_word: καὶ τοῦτον
  choice: ይህንም
  rationale: καί ተመሳሳይ ግፍ በዚህኛውም ላይ እንደደረሰ ያሳያል። በ«ይህንም» ውስጥ ያለው «-ም» የመደመርና የመደጋገም ኃይሉን በአጭሩ ይገልጻል።
- source_word: τραυματίσαντες
  choice: አቁስለው
  rationale: τραυματίζω ቁስል ማድረስን በቀጥታ ያመለክታል። «አቁስለው» ከአጠቃላዩ «ጎድተው» ይልቅ የምንጩን ግልጽ የአካል ጉዳት ትርጉም ይጠብቃል።
- source_word: ἐξέβαλον
  choice: አወጡት
  rationale: ἐκβάλλω ከቦታው በኃይል ማስወጣትን ያመለክታል። በወይኑ አትክልት ቦታ አውድ «አወጡት» የእንቅስቃሴውን አቅጣጫ በግልጽና በተፈጥሮ ይገልጻል፤ የድርጊቱ ግፍም «አቁስለው» በሚለው አብሮ ይታያል።
