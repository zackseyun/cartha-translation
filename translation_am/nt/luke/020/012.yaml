  verdict: revise
  source_fidelity: The draft correctly renders the idiom προσέθετο + infinitive as a further sending, retains the elliptical “third,” and conveys the wounding and additive force of καὶ τοῦτον. However, አወጡት can be read simply as “took him out” and does not adequately represent the forcible expulsion denoted by ἐξέβαλον.
  naturalness: The sentence is otherwise natural, clear modern standard Amharic. Replacing አወጡት with አባረሩት makes the final action more idiomatic and forceful in this context.
  terminology: No theological terminology or proper names occur. The footnote accurately explains the Greek idiom without overstating it.
  issues:
  - severity: medium
    issue: The rendering አወጡት weakens ἐξέβαλον.
    rationale: ἐκβάλλω denotes casting/driving someone out. In Amharic, አወጡት may merely mean “they took him out,” whereas አባረሩት naturally conveys forcible expulsion.
  revised_text: እርሱም ሦስተኛውን ላከ[a]፤ እነርሱ ግን ይህንም አቁስለው አባረሩት።
