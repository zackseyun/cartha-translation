language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: am
  text: እንዲህም አሉ፦ “መምህር ሆይ፣ ሙሴ እንዲህ ብሎ ጻፈልን፤ ‘የአንድ ሰው ወንድም ሚስት ያለው ሆኖ ቢሞት፣ ልጅም የሌለው ከሆነ፣ ወንድሙ ሚስቱን ሊወስዳትና ለወንድሙ ዘር ሊያስነሣ ይገባል።’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: ለኢየሱስ የቀረበ ቀጥተኛ የጥሪ ቃል ነው፤ በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው አገላለጽ ነው።
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: ሙሴ … ብሎ ጻፈልን
  rationale: ἡμῖν ሕጉ ለእስራኤል ጥቅምና ተፈጻሚነት እንዳለው ያመለክታል፤ ‘ጻፈልን’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: የአንድ ሰው ወንድም … ቢሞት
  rationale: τινος ያልተወሰነውንና አጠቃላይ ሁኔታውን ይጠብቃል።
- source_word: ἔχων γυναῖκα
  choice: ሚስት ኖራው
  rationale: የግሪኩን ‘ሚስት ኖራት/ኖራው’ ቀጥተኛ ሐሳብ ይጠብቃል፤ ‘ሚስት ትቶ’ የሚለውን ትርጓሜያዊ አማራጭ በማስታወሻ ያቀርባል።
- source_word: οὗτος ἄτεκνος ᾖ
  choice: ልጅ የሌለው ቢሆን
  rationale: ἄτεκνος የልጅ አልባነትን ያመለክታል፤ የልጁን ፆታ ሳይጨምር ትርጉሙን በግልጽ አማርኛ ያቀርባል።
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: ወንድሙ ሚስቱን ወስዶ
  rationale: የሕጉን የታዘዘ ተግባር ያሳያል፤ ‘ወስዶ’ የግሪኩን λαμβάνω ይከተላል እንጂ ‘ያግባት’ ብሎ አያሰፋውም።
- source_word: ἐξαναστήσῃ σπέρμα
  choice: ዘር ያስነሣለት
  rationale: የዘዳግም 25፥5ን ሕጋዊ-መጽሐፍ ቅዱሳዊ ፈሊጥ ይጠብቃል፤ ‘ዘር’ በዚህ አውድ ዘሮችን ወይም ተተኪን ያመለክታል።
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ለወንድሙ
  rationale: ዘሩ በሞተው ወንድም ስምና ጥቅም እንደሚቆጠር የሚያሳየውን የዳቲቭ ግንኙነት በአጭር ያስተላልፋል።
theological_decisions:
- issue: የወንድምን ሚስት የማግባት ሙሴያዊ ሕግ ቃላትን ያለ ትርጓሜያዊ ማስፋፋት ማቅረብ
  choice: “ወንድሙ ሚስቱን ወስዶ ለወንድሙ ዘር ያስነሣለት”
  alternative: “ወንድሙ መበለቲቱን አግብቶ ለሞተው ወንድሙ ልጆችን ይውለድለት”
  rationale: የተመረጠው አገላለጽ የሕጉን ትርጉም ግልጽ ሲያደርግ የግሪኩን ‘መውሰድ’ና ‘ዘር ማስነሣት’ ፈሊጦች ይጠብቃል፤ ‘መበለት፣ ማግባት፣ ልጆችን መውለድ’ የሚሉትን ትክክለኛ ቢሆኑም በጽሑፉ በቀጥታ ያልተነገሩ ማብራሪያዎች ወደ ዋናው ጽሑፍ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የሙሴ ሕግ ጥቅሱ ሕጋዊ ቃናውን እንዲጠብቅ መጽሐፍ ቅዱሳዊው ‘ዘር ማስነሣት’ ፈሊጥ ተይዟል።
