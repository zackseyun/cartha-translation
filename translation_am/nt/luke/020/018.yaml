  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: am
  text: በዚያ ድንጋይ ላይ የሚወድቅ ሁሉ ይሰባበራል[a]፤ ድንጋዩ በማንም ላይ ቢወድቅ ግን ያደቅቀዋል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይፈረካከሳል።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ዱቄት እስኪሆን ይፈጨዋል» ወይም «እንደ ገለባ ይበትነዋል»፤ የግሪኩ ግስ ከተራ ግጭት የበለጠ ኃይለኛ ትርጉም አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: የሚወድቅ ሁሉ
  rationale: መስተዋድዳዊው ቦዝ አንቀጽ አጠቃላይ እና ማንኛውንም ሰው የሚያካትት ነው፤ «የሚወድቅ ሁሉ» ይህን ስፋት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: በዚያ ድንጋይ ላይ
  rationale: ἐπί ከአኩዛቲቭ ጋር ወደ ድንጋዩ ላይ የሚደረግን እንቅስቃሴ ያመለክታል፤ «በዚያ» ደግሞ የἐκεῖνονን አመልካች ኃይል ይጠብቃል።
- source_word: συνθλασθήσεται
  choice: ይሰባበራል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹ በክፍል ክፍል መሰበርን ወይም መንኮታኮትን ያሳያል፤ «ይሰባበራል» የድርጊቱን ከባድነት ሳያለዝብ ይገልጣል።
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ድንጋዩ በማንም ላይ ቢወድቅ ግን
  rationale: ἄν ከአኦሪስት ሳብጀንክቲቭ ጋር ያልተወሰነ ሁኔታን፣ «በማንም ላይ ቢወድቅ» የሚል ሐሳብን ይገልጣል። በአማርኛ ድንጋዩን በግልጽ መድገም የተፈጥሮ አገላለጽንና የድርጊቱን ፈጻሚ ግልጽነት ይጠብቃል።
- source_word: λικμήσει
  choice: ያደቃዋል
  rationale: ግሱ መፍጨትን፣ ማድቀቅን ወይም እንደ ገለባ መበተንን ሊያመለክት ይችላል። «ያደቃዋል» በዚህ የፍርድ ምስል ውስጥ ያለውን ከባድ ጥፋት ግልጽና ተደራሽ በሆነ ቃል ያስተላልፋል፤ ሌሎቹ ሊሆኑ የሚችሉ ልዩነቶች በማስታወሻ ተጠብቀዋል።
- source_word: αὐτόν
  choice: -ዋል (በ«ያደቃዋል» ውስጥ)
  rationale: የአማርኛው የተሳቢ ቅጥያ ተወካይ ነጠላ ወንድ አመልካቹን ይጠብቃል፤ እዚህ ግን በአጠቃላይ ማንኛውንም ሰው ይወክላል።
theological_decisions:
- issue: የድንጋዩ የፍርድ ምስል
  choice: ድንጋዩን ከባድና አጥፊ ፍርድ እንደሚፈጽም ወኪል አድርጎ የሚያቀርበውን ምስል ሳያለዝቡ መጠበቅ
  alternative: ንግግሩን እንደ ቀላል መሰናከል ወይም መጎዳት ማቅለል
  rationale: በአውዱ ውስጥ ድንጋዩ የወሳኝ ፍርድ ምስል ነው፤ συνθλασθήσεται እና λικμήσει ከባድ ጥፋትን ያመለክታሉ። ትርጉሙ ከቁጥሩ በላይ ትርጓሜ ሳይጨምር ይህን ኃይል ይጠብቃል።
- issue: አጠቃላይ ወንድ ነጠላ አመልካች
  choice: በ«ያደቃዋል» ውስጥ የወንድ ነጠላ ተሳቢ ቅጥያን መጠቀም
  alternative: ፆታ-ገለልተኛ በሆነ አገላለጽ «ያንን ሰው» ብሎ መድገም
  rationale: ግሪኩ በሰዋሰው ወንድ ነጠላ የሆነ ተውላጠ ስም ይጠቀማል፣ ነገር ግን አጠቃላይ ወካይ ኃይል አለው። የአማርኛው ቅጥያ ይህን ቅርጽ በተፈጥሯዊ መንገድ ይጠብቃል።
