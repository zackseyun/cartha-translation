  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ይሰባበራል» እና «ያደቃዋል» የፍርዱን ከባድነት ይጠብቃሉ፤ የλικμήσει ሰፊ ምስላዊ ክልል በማስታወሻ [b] ተቀምጧል።
