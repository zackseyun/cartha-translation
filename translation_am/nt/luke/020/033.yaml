review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the question about the woman's marital relation in the resurrection and retains the plain term ትንሣኤ. However, ሰባቱም adds an explicit distributive/emphatic ‘all,’ whereas οἱ ἑπτά is more closely rendered ሰባቱ. The final idiom is also better conveyed as ‘had/took her as wife’ than by the less natural እንደ ሚስት ነበረቻቸው.
  naturalness: The first sentence is clear and appropriately formal. Recasting the final clause as እንደ ሚስት ይዘዋት ነበርና is more idiomatic modern standard Amharic while maintaining the Greek relationship/state emphasis.
  terminology: ትንሣኤ and ሚስት are appropriate established terms. ሴቲቱ properly distinguishes the referential ‘woman’ from the predicate ‘wife.’
  issues:
  - severity: low
    issue: ሰባቱም is more explicit than the source.
    rationale: The suffix -ም conveys ‘also/all/even’ in this context; the Greek has simply ‘the seven.’
  - severity: medium
    issue: The rendering እንደ ሚስት ነበረቻቸው is not the most natural expression for the marital idiom.
    rationale: It can sound like a bare possession statement. እንደ ሚስት ይዘዋት ነበር naturally expresses ἔσχον αὐτὴν γυναῖκα without reducing it merely to the marriage event.
  revised_text: እንግዲህ በትንሣኤው[a] ጊዜ ሴቲቱ ከእነርሱ የማን ሚስት ትሆናለች?[b] ሰባቱ እንደ ሚስት ይዘዋት ነበርና።[c]
