source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: am
  text: እንግዲህ በትንሣኤው[a] ጊዜ ሴቲቱ ከእነርሱ የማን ሚስት ትሆናለች?[b] ሰባቱ እንደ ሚስት ይዘዋት ነበርና።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በትንሣኤው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእነርሱ የማን ሚስት ናት?”
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “እንደ ሚስት ይዘዋት ነበር፤” ወይም፣ “አግብተዋት ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: ሴቲቱ
  rationale: የመጀመሪያው γυνή በቀደመው ታሪክ የተጠቀሰችውን ሴት ያመለክታል፤ የጋብቻ ትርጉሙ በኋላው ‘ሚስት’ በሚለው ቃል ግልጽ ይሆናል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: በሰዱቃውያኑ ክርክር ውስጥ የሚከተለውን ድምዳሜያዊ ጥያቄ በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἐν τῇ ἀναστάσει
  choice: በትንሣኤው ጊዜ
  rationale: የግሪኩን ጊዜያዊ አውድ በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘በትንሣኤው’ ብቻም ቀጥተኛ አማራጭ ነው።
- source_word: τίνος αὐτῶν
  choice: ከእነርሱ የማን
  rationale: የግሪኩን የባለቤትነት/የግንኙነት ጥያቄ በግልጽ አማርኛ ያስተላልፋል።
- source_word: γίνεται
  choice: ትሆናለች
  rationale: γίνομαι ያለውን ‘መሆን/ወደ አንድ ሁኔታ መድረስ’ ኑዋንስ ይጠብቃል።
- source_word: γυνή
  choice: ሚስት
  rationale: በዚህ ተሳቢ አጠቃቀም የጋብቻ ግንኙነት ግልጽ ስለሆነ ‘ሚስት’ ይገባል።
- source_word: οἱ γὰρ ἑπτὰ
  choice: ሰባቱም … ና
  rationale: በፊት የተጠቀሱትን ሰባት ወንድማማቾች ያመለክታል፤ ‘ሁሉም’ የሚል በግሪኩ የሌለ ቃል አልተጨመረም፣ γάρ ደግሞ በ‘ና’ ተላልፏል።
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: እንደ ሚስት ነበረቻቸው
  rationale: ‘ሚስት አድርገው ነበራት’ ከሚለው የጋብቻ ድርጊት ይልቅ በግሪኩ ያለውን የግንኙነት ሁኔታ በቅርብ ይጠብቃል።
theological_decisions:
- issue: በሰዱቃውያኑ ጥያቄ ውስጥ የትንሣኤ ቃል ትርጉም
  choice: ἀνάστασιςን ያለ ተጨማሪ ትርጓሜ ‘ትንሣኤ’ ብሎ መተርጎም
  alternative: ‘የሙታን ትንሣኤ’ ብሎ ማስፋት
  rationale: ቁጥሩ ራሱ ἀνάστασις ብቻ ይላል፤ ‘የሙታን’ የሚለውን ከአውዱ ማከል የተናጋሪዎቹን አገላለጽ ከሚያስፈልገው በላይ ይተረጉማል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ትንሣኤ’ የተለመደውን የግዕዝ ፊደል አጻጻፍ ይጠብቃል። ዋናው ጽሑፍ የግሪኩን የጥያቄ መዋቅርና የሁኔታ ትኩረት ሲጠብቅ ተፈጥሯዊ የአማርኛ ቃል ቅደም ተከትሏል።
