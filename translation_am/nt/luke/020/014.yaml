base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: am
  text: ነገር ግን የወይኑ አትክልተኞች[a] እርሱን ባዩት ጊዜ፣ “ይህ ወራሹ ነው፤ እንግደለው፤ ርስቱ የእኛ እንዲሆን” እያሉ እርስ በርሳቸው ተመካከሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ተከራዮቹ” ወይም “ገበሬዎቹ።” የግሪኩ ቃል የእርሻ ሠራተኞችን ያመለክታል፤ በዚህ ምሳሌ ውስጥ በተለይ በወይን ቦታ የሚሠሩ ሰዎች ናቸው።
    reason: lexical_alternative
lexical_decisions:
