  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: am
  text: ከጻፎችም አንዳንዶቹ መልሰው፣ “መምህር ሆይ፣ በትክክል ተናግረሃል።” አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: መልሰው
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ንግግራዊ ምላሽን ያሳያል፤ ‘መልሰው … አሉ’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: δέ
  choice: ም
  rationale: δέ የሚያሳየውን ቀላል የንግግር ሽግግር በተያያዥ ቅንጣት ‘-ም’ መግለጽ ከዐውዱ ጋር ይስማማል፤ ከባድ ተቃርኖ አያስገባም።
- source_word: τινες τῶν γραμματέων
  choice: ከጻፎች አንዳንዶቹ
  rationale: የክፍል አመልካቹን የግሪክ አወቃቀር በግልጽ ያሳያል፤ የተናገሩት ጻፎቹ ሁሉ ሳይሆኑ ከእነርሱ ጥቂቶቹ ናቸው።
- source_word: γραμματέων
  choice: ጻፎች
  rationale: በወንጌላት ዐውድ γραμματεῖςን የሚወክለው የተለመደ እና አጭር መጠሪያ ነው፤ ‘የሕግ መምህራን’ የሚለውን ትርጓሜያዊ ማስፋት አያስገባም።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የጥሪ ቅርጹን በክብርና በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: καλῶς
  choice: በትክክል
  rationale: በዚህ ዐውድ ተናጋሪዎቹ የኢየሱስን ንግግር ትክክለኛነት እያመሰገኑ ናቸው፤ ‘በትክክል’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἶπας
  choice: ተናገርህ
  rationale: የግሪኩን አንድ ጊዜ የተፈጸመ ንግግር በቀላል ያለፈ ጊዜ ይገልጻል፤ ‘አልክ’ም ሊባል ቢችል ‘ተናገርህ’ ከκαλῶς ጋር ተፈጥሯዊ ነው።
