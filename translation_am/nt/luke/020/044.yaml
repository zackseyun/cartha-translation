- source_word: ἐστιν
  choice: ይሆናል
  rationale: በአማርኛ የዝምድና መለያን በሚጠይቅ በዚህ ዓይነት አገላለጽ ‘እንዴት ልጁ ይሆናል?’ ማለት ተፈጥሯዊ ሲሆን የግሪክኛውን የአሁን ሁኔታ ትርጉም ይጠብቃል።
theological_decisions:
