  choice: ዳዊት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ጥቅስና ክርክር የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτὸν κύριον
  choice: እርሱን ‘ጌታ’
  rationale: የግሪክኛውን ‘እርሱን ጌታ ብሎ’ የሚለውን አወቃቀርና κύριος በመሲሐዊው ክርክር ያለውን የክብር ክብደት ይጠብቃል።
- source_word: καλεῖ
