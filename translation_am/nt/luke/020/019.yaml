- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: በዚያው ሰዓት
  rationale: ድርጊቱን ከዚያው አጋጣሚ ጋር ያያይዛል፤ አፋጣኝነቱንም ይጠብቃል።
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: ሕዝቡን ግን ፈሩ
  rationale: λαόςን ከተሰበሰበ ሕዝብ ብቻ ይልቅ ሰፊውን ሕዝብ እንደሚያመለክት ያቀርባል፤ የተቃርኖ ኃይሉንም በ‘ግን’ ያሳያል።
- source_word: ἔγνωσαν
  choice: ስላወቁ
  rationale: ምሳሌው ማንን እንደሚመለከት መገንዘባቸውን በቀላልና ቀጥተኛ ቃል ይገልጣል።
- source_word: πρὸς αὐτοὺς
  choice: በእነርሱ ላይ
  rationale: በቅርብ አውዱ ምሳሌው በእነርሱ ላይ ያነጣጠረ የፍርድ ንግግር መሆኑን ያሳያል፤ የ‘ወደ/ለእነርሱ’ ቀጥተኛ አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: παραβολὴν
  choice: ምሳሌ
  rationale: በወንጌላት አውድ παραβολήን ለመግለጽ የተለመደና ለዘመናዊ አንባቢ ግልጽ ቃል ነው።
theological_decisions:
- issue: πρὸς αὐτοὺς ከኢየሱስ ምሳሌ ጋር ያለው ትርጉማዊ ኃይል
  choice: ምሳሌው በሃይማኖት መሪዎቹ ላይ ያነጣጠረ ነበር።
  alternative: ምሳሌው ለእነርሱ ወይም ስለ እነርሱ ተነግሮ ነበር።
  rationale: በፊት ባለው ምሳሌ የተወቀሱት እነርሱ መሆናቸውን ከፈጣን ምላሻቸው የሚታየው አውድ የተቃርኖውን ኃይል ይደግፋል፤ ቀጥተኛው አማራጭ ግን በማስታወሻ ቀርቧል።
