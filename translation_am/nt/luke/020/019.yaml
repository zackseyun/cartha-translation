  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: am
  text: ጸሐፍትና የካህናት አለቆች በዚያው ሰዓት እጅ ሊጭኑበት[a] ፈለጉ፤ ግን ሕዝቡን ፈሩ፤ ይህን ምሳሌ በእነርሱ ላይ[b] እንደተናገረ አውቀው ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊይዙት” ወይም “ሊያስሩት”፤ ቃል በቃል፣ “እጅ ሊጭኑበት።”
    reason: lexical_alternative
  - marker: b
    text: “በእነርሱ ላይ” የሚለው “ለእነርሱ” ተብሎም ሊተረጎም ይችላል፤ አውዱ ግን ምሳሌው በእነርሱ ላይ ያነጣጠረ መሆኑን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: ፈለጉ
  rationale: የግሱን ያለፈ ጊዜ አጠቃላይ እርምጃና ዓላማ በቀጥታ ያሳያል፤ ድርጊቱ እንደተሳካ አያመለክትም።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: በወንጌላት አውድ ያለውን የተወሰነ ማኅበራዊና ሃይማኖታዊ ቡድን የሚጠቅስ የተለመደ ቃል ነው።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ሊቃነ ካህናትን ሳይሆን የካህናትን አመራር ክፍል ያመለክታል።
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: እጃቸውን ሊጭኑበት
