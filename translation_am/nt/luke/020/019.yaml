  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የአረፍተ ነገር ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን የምክንያቱ ክፍል ቀድሞ ቀርቧል፤ የመያዝ ፈሊጣዊ ምስልና የπρός አሻሚነት በዋናው ጽሑፍና በማስታወሻዎች ተጠብቀዋል።
