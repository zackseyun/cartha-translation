lexical_decisions:
- source_word: οὐκέτι
  choice: ከዚያ በኋላ ... አል...ም
  rationale: ከዚያ ጊዜ ጀምሮ ድርጊቱ መቋረጡን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው አውድ ጋር ያለውን የምክንያት ወይም የማብራሪያ ግንኙነት በአማርኛ ተፈጥሯዊ በሆነ አገናኝ ይገልጣል።
- source_word: ἐτόλμων
  choice: አልደፈሩም
  rationale: የመጠየቅ ድፍረታቸው እንደቀረ ያሳያል፤ ያልተጠናቀቀው ያለፈ ጊዜ ከ οὐκέτι ጋር የሚሰጠው የመቋረጥ ሐሳብ በአገላለጹ ተጠብቋል።
- source_word: ἐπερωτᾶν
  choice: ሊጠይቁት
  rationale: የἐτόλμων ማሟያ የሆነውን የመጠየቅ ድርጊት በቀላልና ወቅታዊ አማርኛ ይገልጣል፤ የተውላጠ ስም ተሳቢም በቅጥያው ተካትቷል።
- source_word: αὐτόν
  choice: -ት
  rationale: ኢየሱስን የሚያመለክተው ቀጥተኛ ተሳቢ በግሱ ላይ በተያያዘ ቅጥያ በተፈጥሯዊ ሁኔታ ተተርጉሟል።
- source_word: οὐδέν
  choice: ምንም ነገር
  rationale: ከአሉታዊው ግስ ጋር የጥያቄውን ፍጹም አለመኖር ያሳያል።
