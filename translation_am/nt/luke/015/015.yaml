  text: ከዚያም ሄዶ በዚያች አገር ከነበሩ ዜጎች አንዱ ጋር ተጣበቀ[a]፤ እርሱም እሪያዎችን እንዲመግብ ወደ እርሻዎቹ ላከው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ራሱን ከእርሱ ጋር አያያዘ» ወይም «በእርሱ ላይ ተደገፈ»፤ የግሪኩ ግስ ከአንድ ሰው ጋር በቅርብ መያያዝን፣ እስከ ጥገኝነት ድረስም ሊደርስ የሚችል መተሳሰርን ያመለክታል።
