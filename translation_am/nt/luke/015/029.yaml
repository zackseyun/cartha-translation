  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: am
  text: እርሱ ግን ለአባቱ መልሶ እንዲህ አለው፤ «እነሆ፣ ለእነዚህ ሁሉ ዓመታት እንደ ባሪያ እያገለገልኩህ ነው፤[a] ትእዛዝህንም አንድም ጊዜ አልተላለፍኩም። ነገር ግን ከወዳጆቼ ጋር ደስ እንድል አንድ የፍየል ግልገል እንኳ ከቶ አልሰጠኸኝም።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «እንደ ባሪያ እያገለገልኩህ ነው» ወይም «እያገለገልኩህ ነው»። የግሪኩ δουλεύω ቃል «ማገልገል» ወይም፣ በበለጠ ጠንካራ ፍቺ፣ «በባርነት ማገልገል» ማለት ይችላል። እዚህ «እንደ ባሪያ» የሚለው የታላቁን ልጅ ምሬታዊ ቃና ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: እንዲህ ሲል መለሰ
  rationale: የግሪኩን ሁለት ግሶች የሚያንጸባርቅና በአማርኛ ተፈጥሯዊ የሆነ የንግግር መግቢያ ነው።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ተናጋሪው በቁጣ ወደ ክርክሩ ትኩረት እንዲሳብ የሚያደርገውን አጽንዖት ይጠብቃል።
- source_word: τοσαῦτα ἔτη
  choice: ይህን ያህል ዓመት
  rationale: የረጅም ጊዜን ቆይታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: δουλεύω
  choice: እንደ ባሪያ አገለገልኩህ
  rationale: ቃሉ በበታችነት ወይም በባርነት የሚደረግ አገልግሎትን ሊያመለክት ይችላል፤ በዚህ ቅሬታ ውስጥ የታላቁን ልጅ ምሬት ያሰማል። ቀለል ያለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐντολήν σου παρῆλθον
  choice: ትእዛዝህን አልተላለፍኩም
  rationale: ትእዛዝን መጣስ ወይም አለመታዘዝ የሚለውን ፍቺ በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጻል።
- source_word: ἔδωκας ἔριφον
  choice: አንድ የፍየል ጠቦት እንኳ ከቶ አልሰጠኸኝም
  rationale: ἔριφος ወጣት ፍየልን ያመለክታል፤ “እንኳ” እና “ከቶ” በአረፍተ ነገሩ ያለውን አጉላ ቅሬታ ተፈጥሯዊ በሆነ አማርኛ ያሳያሉ።
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: ከወዳጆቼ ጋር ደስ እንዲለኝ
  rationale: የዓላማውን ንዑስ አረፍተ ነገርና በድግስ አውድ ያለውን ደስታ በግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: ታላቁ ልጅ ራሱን በδουλεύω የገለጸበት መንገድ
  choice: እንደ ባሪያ አገለገልኩህ
  alternative: አገለገልኩህ
  rationale: ይህ ስለ ቃል በቃል ባርነት የሚሰጥ የእምነት አስተምህሮ ሳይሆን ታላቁ ልጅ ግንኙነቱን በምሬት እንደ ባርነት እያየው መሆኑን የሚያሳይ የንግግር ቃና ነው። ቃሉ ቀለል ብሎ “ማገልገል” ሊል የሚችለው እውነተኛ አሻሚነት በማስታወሻ ተገልጿል።
