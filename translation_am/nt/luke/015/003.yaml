  text: እርሱም ይህን ምሳሌ እንዲህ ብሎ ነገራቸው፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: ነገራቸው
  rationale: የλέγω የአንድ ጊዜ ያለፈ ድርጊት ሲሆን፣ ከ«ምሳሌ» ጋር «ነገራቸው» በዘመናዊ አማርኛ ተፈጥሯዊ ነው፤ ተናጋሪውንና ተቀባዮቹንም በግስ ውስጥ ያሳያል።
- source_word: δὲ
  choice: ስለዚህ
  rationale: በፊተኛው ክፍል ላይ ለተነሣው ማጉረምረም የኢየሱስን ምላሽ የሚያገናኝ ለስላሳ የትረካ መሸጋገሪያ ነው፤ ጠንካራ ተቃርኖ አያስገባም።
- source_word: πρὸς αὐτοὺς
  choice: ነገራቸው ውስጥ «-አቸው»
  rationale: πρός ከተሳቢ ጋር የንግግሩን ተቀባዮች ያመለክታል። አማርኛ ይህን በግሱ ውስጥ ባለው «-አቸው» ቅጥያ በተፈጥሮ ይገልጣል።
- source_word: τὴν παραβολὴν ταύτην
  choice: ይህን ምሳሌ
  rationale: «ምሳሌ» በወንጌላት ውስጥ παραβολήን ለመተርጎም የተለመደና ለአንባቢዎች ግልጽ ቃል ነው፤ «ይህን» ደግሞ ταύτηνን ይጠብቃል።
- source_word: λέγων
  choice: እንዲህም አለ፦
  rationale: ተከትሎ የሚመጣውን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያስገባል። የግሪኩን የንግግር ማስገቢያ ተግባር ይጠብቃል።
