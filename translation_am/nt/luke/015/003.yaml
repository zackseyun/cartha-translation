translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩ «εἶπεν … λέγων» ድግግሞሽ በ«ነገራቸው፤ እንዲህም አለ» ተጠብቆ በአማርኛ ተፈጥሯዊ ሆኗል። ከእንግሊዝኛው የመደበኛ አገላለጽ አማራጭ ይልቅ ዋናው ጽሑፍ ራሱ የግሪኩን ቅርጽና ፍቺ በቂ ስለሚያስተላልፍ የግርጌ ማስታወሻ አልተጨመረም።
