base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: am
  text: ከእንግዲህ ወዲህ ልጅህ ተብዬ ልጠራ አይገባኝም፤ ከቅጥረኞችህ[a] እንደ አንዱ አድርገኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከተቀጠሩ አገልጋዮችህ እንደ አንዱ” ወይም “ከደመወዝ ሠራተኞችህ እንደ አንዱ” ሊተረጎም ይችላል። የግሪኩ ቃል የቤት ባሪያዎችን ሳይሆን በክፍያ የሚሠሩ ሰዎችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ከእንግዲህ ወዲህ … አይደለሁም
  rationale: የቀድሞው ሁኔታ እንደተለወጠ የሚያሳየውን ጊዜያዊ አሉታዊ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄξιος
  choice: የሚገባኝ
  rationale: ለአንድ ክብር ወይም ደረጃ ብቁ ወይም የተገባ መሆንን የሚገልጸውን ማኅበራዊና ሥነ ምግባራዊ ኃይል ይጠብቃል።
- source_word: κληθῆναι
  choice: ተብዬ ልጠራ
  rationale: ተገብሮአዊውን ቅርጽና እንደ አንድ ደረጃ መሰየምን ሁለቱንም ይጠብቃል።
- source_word: υἱός σου
  choice: ልጅህ
  rationale: በዐውዱ ወንድ ልጅነቱ ግልጽ ስለሆነ፣ የአባትና የልጅን ቀጥተኛ ዝምድና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ποίησόν με
  choice: አድርገኝ
  rationale: አዲስ ደረጃ እንዲሰጠው የሚቀርበውን ቀጥተኛ ጥያቄ ያስተላልፋል፤ ‘እንደ … ቍጠረኝ’ ከሚለው ያነሰ ተርጓሚ ነው።
- source_word: ὡς ἕνα τῶν μισθίων σου
  choice: ከቅጥረኞችህ እንደ አንዱ
  rationale: ὡς ያለውን የንጽጽር ኃይል ይጠብቃል፤ ‘ቅጥረኞች’ ደግሞ ለደመወዝ የሚሠሩትን ከቤት ባሪያዎች ይለያል።
theological_decisions:
- issue: ልጁ ስለ ራሱ የሚናገረው የብቁነትና የልጅነት ደረጃ
  choice: ‘የሚገባኝ’ እና ‘ልጅህ’ የሚሉትን የዝምድናና የክብር ቃላት መጠበቅ
  alternative: ‘ከእንግዲህ ልጅህ ልባል አይገባኝም’ ብሎ በተጨመቀ መልክ መተርጎም
  rationale: ጽሑፉ የልጅነት ደረጃ እንደማይገባው የልጁን ግምት ይገልጻል፤ ይህን ወደ አጠቃላይ የኀፍረት ስሜት አያለዝብም፣ ከጽሑፉም በላይ የሆነ ዶክትሪናዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ቅጥረኛ’ የክፍያ ሠራተኛነትን በአጭሩ ይገልጻል፤ የግሪኩን የማነጻጸር ቅርጽ ለመጠበቅ ‘እንደ አንዱ’ ተብሏል።
