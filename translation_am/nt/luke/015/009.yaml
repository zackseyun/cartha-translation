  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: am
  text: ካገኘችውም በኋላ ሴት ወዳጆቿንና ጎረቤቶቿን አንድ ላይ ጠርታ፣ “ያጣሁትን ድራክማ[a] አግኝቻለሁና ከእኔ ጋር ደስ ይበላችሁ!” ትላቸዋለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ድራክማ የግሪክ የብር ሳንቲም ነበር፤ በብዙ ሁኔታዎች በግምት ከአንድ ሠራተኛ የአንድ ቀን ደመወዝ ጋር ተመጣጣኝ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: ካገኘችውም በኋላ
  rationale: የአኦሪስት አንቀጽ ዋናውን ድርጊት የቀደመ ሁኔታ ስለሚገልጥ፣ በተፈጥሯዊ አማርኛ በጊዜያዊ ቅደም ተከተል ተተርጉሟል፤ “ው” ከአውዱ የጠፋውን ሳንቲም ያመለክታል።
- source_word: συγκαλεῖ
  choice: አንድ ላይ ጠርታ … ትላቸዋለች
  rationale: የግሱን ‘ወደ ራስ አንድ ላይ መጥራት’ ትርጉም ይጠብቃል፤ የግሪኩ ትረካዊ የአሁን ጊዜም በ“ትላቸዋለች” ተንጸባርቋል።
- source_word: φίλας καὶ γείτονας
  choice: ወዳጆቿንና ጎረቤቶቿን
  rationale: “ወዳጆቿ” የሴቷን ወዳጆች፣ “ጎረቤቶቿ”ም ጎረቤቶቿን በተፈጥሯዊ አማርኛ ይገልጣሉ፤ ግሪኩ በመጀመሪያው ቃል የሴት ጾታ ብዙ ቁጥርን በግልጽ ያሳያል።
- source_word: Συγχάρητέ μοι
  choice: ከእኔ ጋር ደስ ይበላችሁ
  rationale: ከሌላው ጋር ደስታን መካፈል የሚለውን የግሱን ቀጥተኛ ትርጉም በክብር ባለውና በተለመደ አማርኛ ያቀርባል።
- source_word: ὅτι
  choice: …ና
  rationale: የደስታውን ምክንያት በተፈጥሯዊ አማርኛ የሚያስተሳስር የምክንያት ቅጥያ ነው።
- source_word: εὗρον
  choice: አግኝቻለሁ
  rationale: በቀጥታ ንግግር ውስጥ የተጠናቀቀው ማግኘት ያለውን ወቅታዊ ውጤት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δραχμὴν
  choice: ድራክማ
  rationale: የግሪኩን የተወሰነ የሳንቲም ስም ከማጠቃለል ይልቅ ይጠብቃል፤ ባህላዊ መረጃው በማስታወሻ ተብራርቷል።
- source_word: ἣν ἀπώλεσα
  choice: ያጣሁትን
  rationale: ድራክማውን የሚለይ የዝምድና አንቀጽ ሲሆን፣ ቀድሞ በእርሷ እንደጠፋ በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
