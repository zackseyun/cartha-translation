id: LUK.15.8
reference: Luke 15:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: am
  text: 'ወይስ አሥር ድራክማ[a] ያላት አንዲት ሴት፣ አንድ ድራክማ ብታጣ፣ መብራት አብርታ ቤቱን ጠርጋ እስክታገኘው ድረስ በጥንቃቄ[b] አትፈልግምን?


    [a] ድራክማ የግሪክ የብር ሳንቲም ነበር።

    [b] ወይም፣ «በትጋት»።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ድራክማ የግሪክ የብር ሳንቲም ነበር።
    reason: cultural_note
  - marker: b
    text: ወይም፣ «በትጋት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: ወይስ
  rationale: ከቀደመው ምሳሌ ጋር ያለውን ትስስር ጠብቆ ሌላ ተመሳሳይ ምሳሌ የሚያስገባ ተፈጥሯዊ የአማርኛ አያያዥ ነው።
- source_word: τίς γυνὴ
  choice: አንዲት ሴት … አትፈልግምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አጠያየቅ በተፈጥሯዊ የአማርኛ የክህደት ጥያቄ አቀራረብ ያሳያል፤ በምንጩ የሌለው «ከእናንተ» አልተጨመረም።
- source_word: δραχμὰς
  choice: ድራክማ
  rationale: ታሪካዊውንና የተወሰነውን የሳንቲም ስም ከማጥፋት ይልቅ በቃል ዝውውር ተጠብቋል፤ ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: ἐὰν ἀπολέσῃ δραχμὴν μίαν
  choice: አንድ ድራክማ ብታጣ
  rationale: አጠቃላይ ሁኔታዊ ግሱንና አንድ ብቻ መጥፋቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἅπτει λύχνον
  choice: መብራት አብርታ
  rationale: መብራትን ማብራት የሚለውን ተግባር በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: σαροῖ τὴν οἰκίαν
  choice: ቤቱን ጠርጋ
  rationale: οἰκίαን እንደ ቤት በመተርጎም የቤት ውስጥ ፍለጋውን ተጨባጭ አድርጎ ያቀርባል።
- source_word: ζητεῖ ἐπιμελῶς
  choice: በጥንቃቄ አትፈልግምን?
  rationale: ἐπιμελῶς የሚያመለክተውን ጥንቃቄና ትጋት በተለመደ አገላለጽ ይይዛል፤ «በትጋት» የሚለው ሌላ ትክክለኛ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἕως οὗ εὕρῃ
  choice: እስክታገኘው ድረስ
  rationale: የፍለጋውን የመጨረሻ ግብ ይገልጣል፤ «-ው» የጠፋውን ድራክማ በግልጽ ይጠቅሳል።
