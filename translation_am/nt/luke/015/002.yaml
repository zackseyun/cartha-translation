  rationale: ጥቅሱ ፈሪሳውያንና የሕግ መምህራን ኢየሱስ በማኅበራዊና በሃይማኖታዊ መለያ «ኃጢአተኞች» ከተባሉት ጋር ስለሚቀራረብ ያቀረቡትን ቅሬታ ያሳያል። ትርጉሙ ይህን መሰናክል ይጠብቃል፣ ነገር ግን ጽሑፉ ያላለውን ፍርድ አይጨምርም።
