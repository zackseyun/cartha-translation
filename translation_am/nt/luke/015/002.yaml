- source_word: συνεσθίει αὐτοῖς
  choice: ከእነርሱም ጋር ይበላል
  rationale: ቃል በቃል ግልጽ ሲሆን የጋራ ማዕድ ማኅበራዊ ክብደትንም ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
theological_decisions:
