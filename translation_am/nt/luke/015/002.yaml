lexical_decisions:
- source_word: διεγόγγυζον
  choice: ያጉረመርሙ ነበር
  rationale: ያልተጠናቀቀው ጊዜ ቀጣይነት ያለውን ወይም ተደጋጋሚ ማጉረምረምን ያሳያል፤ ይህ ምርጫም የቅሬታና የማንጎራጎር ቃናውን ይጠብቃል።
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: ፈሪሳውያንና የኦሪት ሕግ መምህራንም
  rationale: τε ... καί ሁለቱንም ቡድኖች ያጣምራል። γραμματεῖς በዚህ የወንጌል አውድ ተራ ጸሐፊዎችን ሳይሆን የኦሪት ሕግ የተማሩ አስተማሪዎችን ስለሚያመለክት፣ ትርጉሙ ለዘመናዊ አንባቢ ግልጽ ተደርጓል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: ይህ አሳታፊ ግስ ከዋናው ድርጊት ጋር በአንድ ጊዜ የተከናወነውን ንግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Οὗτος
  choice: ይህ ሰው
  rationale: ተውላጠ ጠቋሚው የመራቅ ወይም ትንሽ የንቀት ቃና ሊኖረው ይችላል፤ «ይህ ሰው» ከገለልተኛው «እርሱ» ይልቅ ይህን ቃና ይጠብቃል።
- source_word: ἁμαρτωλοὺς
  choice: ኃጢአተኞችን
  rationale: ስማዊ አጠቃቀሙንና በክሱ ውስጥ ያለውን ማኅበራዊና ሃይማኖታዊ ምድብ በቀጥታ ይጠብቃል።
- source_word: προσδέχεται
  choice: ይቀበላል
