  text: ፈሪሳውያንና የሕግ መምህራንም፣ “ይህ ሰው ኃጢአተኞችን ይቀበላል[a]፤ ከእነርሱም ጋር ይበላል” እያሉ ያጉረመርሙ ነበር።
  philosophy: optimal-equivalence
  footnotes:
