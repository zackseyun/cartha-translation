  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: am
  text: እርሱም አሳማዎቹ ከሚበሉት የካሮብ ፍሬ ቅርፊቶች[a] ሆዱን ለመሙላት ይመኝ ነበር፤ ነገር ግን ማንም ምንም አይሰጠውም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የካሮብ ፍሬዎች»፤ የግሪኩ ቃል በተለይ ብዙ ጊዜ ለእንስሳት መኖ የሚያገለግሉ የካሮብ ዛፍ ፍሬ ቅርፊቶችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: ይመኝ ነበር
  rationale: ያልተቋረጠውን ከፍተኛ ፍላጎት የግሱን ኢምፐርፌክት ገጽታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: ሆዱን ለመሙላት
  rationale: የግሪኩን አካላዊና ተጨባጭ ምስል ሳይተረጉም በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀπὸ τῶν κερατίων
  choice: ከሚበሉት የካሮብ ፍሬ እንክብሎች
  rationale: ἀπό ከመሙላት ጋር የሚያመለክተውን ምንጭ በአማርኛ አገባብ ይገልጣል፤ κεράτιαንም እንደ ካሮብ ፍሬ እንክብል በትክክል ይለያል።
- source_word: οἱ χοῖροι
  choice: አሳማዎቹ
  rationale: በዘመናዊ መደበኛ አማርኛ ተፈጥሯዊና ቀጥተኛ አቻ ነው።
- source_word: ἤσθιον
  choice: ከሚበሉት
  rationale: በትዕይንቱ ውስጥ የቀጠለውን የመብላት ድርጊት የኢምፐርፌክቱን ገጽታ በተፈጥሯዊ አንቀጽ ያሳያል።
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: ማንም ምንም አይሰጠውም ነበር
  rationale: የሚሰጠው ነገር በግሪኩ በግልጽ ባይጠቀስም በአማርኛ አገባብ ‘ምንም’ በማለት በተፈጥሮ ይገለጣል፤ የግሱንም ቀጣይ ኢምፐርፌክት ገጽታ ይጠብቃል።
