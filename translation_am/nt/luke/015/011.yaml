  text: Then he said[a], “A certain man had two sons.”
translation:
  language: am
  text: ከዚያም እንዲህ አለ፤ “አንድ ሰው[a] ሁለት ወንድ ልጆች ነበሩት።”
  philosophy: optimal-equivalence
  footnotes:
