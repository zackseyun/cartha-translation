    rationale: In standard contemporary Amharic, «ሁለት ወንድ ልጆች» is the normal form; «ሁለት ወንዶች ልጆች» is understandable but less smooth.
  - severity: medium
    issue: Footnote is self-referential and inaccurately framed as literal
