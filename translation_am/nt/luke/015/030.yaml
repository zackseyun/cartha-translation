theological_decisions:
- issue: የታላቁ ወንድም ክስ በተረጋገጠ እውነት ወይስ እንደ ክስ መቅረቡ
  choice: ንግግሩን ያለ ተጨማሪ ማረጋገጫ ወይም ማለዘቢያ በቀጥታ ማቅረብ
  alternative: ‘እንደተባለው’ ወይም ‘በብልግና ኑሮ’ የሚል ትርጓሜያዊ ቃል መጨመር
  rationale: ግሪኩ ይህን እንደ ታላቁ ወንድም ክስ ያቀርበዋል እንጂ በዚህ ቁጥር ተራኪው እንዳረጋገጠው አያሳይም። ቀጥተኛው ትርጉም የታሪኩን ውጥረት ይጠብቃል።
