- source_word: σου τὸν βίον
  choice: ንብረትህን
  rationale: በዚህ አውድ βίος ሕይወትን ሳይሆን መተዳደሪያን፣ ሀብትን ወይም ንብረትን ያመለክታል፤ ‘ንብረትህን’ ለተራ አንባቢ ግልጽና ከታሪኩ አውድ ጋር ተስማሚ ነው።
