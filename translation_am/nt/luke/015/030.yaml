  source_fidelity: The clause order, the distancing force of “ይህ ልጅህ,” the vivid consumption metaphor, the father’s resources, the simple “came,” and the slaughter of the fattened calf are all substantially retained. However, “ከዝሙት አዳሪዎች ጋር” normally denotes people who commit sexual immorality, rather than specifically prostitutes (πόρναι).
  naturalness: The draft is generally clear and modern. “ከሴተኛ አዳሪዎች ጋር” is a clearer, idiomatic designation for prostitutes. “የወፈረውን ጥጃ” more explicitly conveys an animal deliberately fattened for the feast.
  terminology: “ንብረትህን” is a sound contextual rendering of βίος, and the footnote appropriately preserves the broader lexical range. “አረድክ” accurately avoids importing sacrificial overtones. The revision corrects the term for πόρναι without softening the older brother’s accusation.
