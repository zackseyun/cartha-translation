  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: am
  text: ነገር ግን ከሴተኛ አዳሪዎች ጋር ንብረትህን የበላው ይህ ልጅህ በመጣ ጊዜ፣ ለእሱ የወፈረውን ጥጃ አረድክ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መተዳደሪያህን የበላው።” የግሪኩ ግስ ኃይለኛና ምስላዊ ሲሆን፣ ቃል በቃል “የበላው” ማለት ነው፤ “ንብረት” የተተረጎመው ቃልም መተዳደሪያ፣ ንብረት ወይም ሀብት ሊያመለክት ይችላል።
