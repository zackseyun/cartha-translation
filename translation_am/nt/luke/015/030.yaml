- source_word: ἔθυσας
  choice: አረድክ
  rationale: እንስሳው ለግብዣ መታረዱን በትክክል ይገልጣል፤ የአምልኮ መሥዋዕት ሐሳብ አያስገባም።
- source_word: τὸν σιτευτὸν μόσχον
