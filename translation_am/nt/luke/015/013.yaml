  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: am
  text: 'ከጥቂት ቀናት በኋላ[a]፣ ታናሹ ልጅ ያለውን ሁሉ ሰብስቦ ወደ ሩቅ አገር ሄደ፤ በዚያም ንብረቱን[b] ያለ አግባብ እየኖረ[c] አባከነ።


    [a] ቃል በቃል፣ “ብዙ ቀናት ሳያልፉ።”


    [b] ወይም “ሀብቱን” ወይም “ጥሪቱን።”


    [c] ወይም “በብክነት እየኖረ።” ጽሑፉ እዚህ ላይ የተለዩ ኃጢአቶችን አይጠቅስም፤ ልቅና ብኩን የሆነ አኗኗርን ብቻ ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ብዙ ቀናት ሳያልፉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም “ሀብቱን” ወይም “ጥሪቱን።”
    reason: lexical_alternative
  - marker: c
    text: ወይም “በብክነት እየኖረ።” ጽሑፉ እዚህ ላይ የተለዩ ኃጢአቶችን አይጠቅስም፤ ልቅና ብኩን የሆነ አኗኗርን ብቻ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: ከጥቂት ቀናት በኋላ
  rationale: የግሪክኛው አገላለጽ ቃል በቃል “ብዙ ቀናት ሳያልፉ” ቢሆንም፣ ይህ ምርጫ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ቃል በቃሉ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: συναγαγὼν πάντα
  choice: ያለውን ሁሉ ሰብስቦ
  rationale: ቀድሞ የተፈጸመውን ተግባር በአማርኛ ተያያዥ ግስ ያሳያል፤ πάντα በአውዱ የእርሱ የሆነውን ሁሉ በስፋት ያመለክታል።
- source_word: ὁ νεώτερος υἱός
  choice: ታናሹ ልጅ
  rationale: በትረካው አውድ የንጽጽር ቅጹን ተፈጥሯዊና ግልጽ በሆነ አማርኛ ይገልጻል።
- source_word: ἀπεδήμησεν εἰς χώραν μακράν
  choice: ወደ ሩቅ አገር ሄደ
  rationale: ግሱ ከቤት ርቆ ወደ ሌላ ስፍራ መጓዝን ያመለክታል፤ ከተከታዩ ሐረግ ጋር ይህ አተረጓጎም ግልጽና ተፈጥሯዊ ነው።
- source_word: διεσκόρπισεν
  choice: አባከነ
  rationale: መሠረታዊው “መበተን” የሚለው ሐሳብ በንብረት አውድ ላይ ሀብትን በከንቱ ማጥፋትን ያመለክታል፤ “አባከነ” ይህን ፍቺ በትክክል ይይዛል።
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: ያለውን ንብረት
  rationale: οὐσία እዚህ የራሱ የሆነውን ጥሪት፣ ሀብት ወይም ንብረት በስፋት ያመለክታል፤ “ንብረት” ያለአስፈላጊ ጠባብነት አውዱን ይገልጻል።
- source_word: ζῶν ἀσώτως
  choice: ያለአግባብ እየኖረ
  rationale: የንብረቱ ብክነት የተፈጸመበትን የኑሮ መንገድ ይገልጻል። “ያለአግባብ” ቸልተኛ፣ ልቅና ብኩን ኑሮን ያመለክታል፤ ጽሑፉ ያልገለጻቸውን የተወሰኑ የፆታ ኃጢአቶች አያስገባም።
theological_decisions:
- issue: ἀσώτως የሚገልጸው የኑሮ ዓይነት
  choice: ያለአግባብ እየኖረ
  alternative: በዝሙት እየኖረ
  rationale: የግሪክኛው ቃል ብኩን፣ ልቅ ወይም ያለአግባብ የሆነ ኑሮን ይገልጻል፤ በዚህ ቁጥር ብቻ የፆታ ብልግናን በተለይ አይጠቅስም። ስለዚህ አሻሚነቱን ሳይዘጋ ሰፊው ፍቺ ተጠብቋል።
