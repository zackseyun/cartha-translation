  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: am
  text: እላችኋለሁ፤ እንደዚሁ[a]፣ በአንድ ንስሐ በሚገባ ኃጢአተኛ ምክንያት፣ ንስሐ መግባት የማያስፈልጋቸው ከዘጠና ዘጠኝ ጻድቃን[b] ይልቅ በሰማይ ደስታ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲሁ።” ሐረጉ በሰማይ ያለውን ደስታ ከቀደመው ምሳሌ ፍሬ ሐሳብ ጋር ያገናኛል።
    reason: lexical_alternative
  - marker: b
    text: ጽሑፉ “ጻድቃን” ይላል። ይህ በቀጥታ ወይም በዐውዱ እንደ ምጸት ሊነበብ ይችላል፤ ትርጉሙ አንዱን ሳይወስን የጽሑፉን አገላለጽ ጠብቋል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን ንግግርና አጽንዖቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὕτως
  choice: እንደዚሁ
  rationale: ንግግሩን ከቀደመው ምሳሌ ፍሬ ሐሳብ ጋር ያገናኛል፤ ‘እንዲሁ’ም ሊባል ይችላል።
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: በሰማይ ደስታ ይሆናል
  rationale: የወደፊት ጊዜውንና የቦታውን አገላለጽ ይጠብቃል፤ የደስታውን አድራጊ ከጽሑፉ በላይ አይወስንም።
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: በአንድ ኃጢአተኛ ምክንያት
  rationale: ἐπί ከχαρά ጋር የደስታውን ምክንያት ወይም አጋጣሚ ስለሚገልጽ፣ በአማርኛ ግልጽ ሆኖ ቀርቧል።
- source_word: μετανοοῦντι
  choice: ንስሐ በሚገባ
  rationale: የአሁን ጊዜ አድራጊ ቅጽን በተፈጥሯዊ አንጻራዊ ሐረግ ይገልጻል፤ ንስሐ መግባት በዘመናዊ አማርኛ የመመለስን/የአስተሳሰብ ለውጥን የሚገልጽ የተለመደ አገላለጽ ነው።
- source_word: ἢ
  choice: ከ… ይልቅ
  rationale: በዚህ አወቃቀር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: ዘጠና ዘጠኝ ጻድቃን
  rationale: ስማዊ ሆኖ የተጠቀሰውን ቅጽል በአማርኛ ስማዊ ብዙ ቁጥር በቀጥታ ይጠብቃል።
- source_word: οὐ χρείαν ἔχουσιν μετανοίας
  choice: ንስሐ መግባት በማያስፈልጋቸው
  rationale: የ‘ፍላጎት/አስፈላጊነት የላቸውም’ ሐሳብንና μετανοίαςን በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘ጻድቃን’ በቀጥታ የተነገረ ነው ወይስ ምጸታዊ ነው?
  choice: ‘ጻድቃን’ የሚለውን የግሪኩን ቃል እንዳለ ማቆየት
  alternative: ‘ራሳቸውን ጻድቃን የሚያደርጉ’ ወይም ‘ጻድቃን ነን የሚሉ’ ብሎ መተርጎም
  rationale: ግሪኩ ምጸቱን በግልጽ አያመለክትም፤ ስለዚህ ትርጉሙ በዐውዱ ያለውን የትርጓሜ ውጥረት ሳይፈታ ይጠብቃል።
- issue: ‘በሰማይ’ የሚለው የደስታውን አድራጊ ይወስናልን?
  choice: ቦታዊ አገላለጹን ‘በሰማይ’ ብሎ ማቆየት
  alternative: ‘እግዚአብሔር ይደሰታል’ ወይም ‘መላእክት ይደሰታሉ’ ብሎ ማብራራት
  rationale: ቁጥሩ የደስታውን ቦታ ይገልጻል እንጂ አድራጊዎቹን በግልጽ አይሰይምም።
