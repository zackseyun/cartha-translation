  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የንግግሩ ቀጥተኛነትና የጋራ ደስታ ጥሪው ተጠብቀዋል።
