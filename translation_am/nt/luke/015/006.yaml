base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: am
  text: ወደ ቤቱ ሲገባ[a]፣ ወዳጆቹንና ጎረቤቶቹን አንድ ላይ ይጠራቸዋል፤ እንዲህም ይላቸዋል፤ “ጠፍታ የነበረችውን በጌን[c] አግኝቻለሁና፣ ከእኔ ጋር ደስ ይበላችሁ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ በተፈጥሯዊ አነጋገር፣ “ወደ ቤቱ በተመለሰ ጊዜ።” ግሪኩ ቃል በቃል “ወደ ቤቱ ሲገባ” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ደስታዬን ተካፈሉ።” የግሪኩ ትእዛዝ ከአንድ ሰው ጋር አብሮ ደስ መሰኘትን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “የጠፋችውን በጌን።” ግሪኩ ቃል በቃል “የእኔን በግ፣ ጠፍታ የነበረችውን” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: ወደ ቤቱም በገባ ጊዜ
  rationale: የአኦሪስት አሳታፊውን እንደ ጊዜ ንዑስ ሐረግ በተፈጥሯዊ አማርኛ ይገልጻል፤ εἰς የመግባትን አቅጣጫ ያሳያል።
- source_word: συγκαλεῖ
  choice: አንድ ላይ ጠርቶ
  rationale: የሰዎችን በአንድ ስፍራ መጥራት የሚለውን የግሱን ዋና ሐሳብ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: ወዳጆቹንና ጎረቤቶቹን
  rationale: ሁለቱን ማኅበራዊ ቡድኖች ቀጥተኛና ግልጽ በሆኑ ዘመናዊ ቃላት ያቀርባል።
- source_word: Συγχάρητέ μοι
  choice: ከእኔ ጋር ደስ ይበላችሁ
  rationale: የጋራ ደስታን የሚጠይቀውን የብዙ ቁጥር ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὅτι εὗρον
  choice: አግኝቻለሁና
  rationale: ὅτι የሚያስገባውን ምክንያት በአማርኛው ‘-ና’ ያሳያል፤ ፍጹም ግሱም የተገኘው በግ አሁን በእጁ መሆኑን ያጎላል።
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: ጠፍታ የነበረችውን በጌን
  rationale: የግሪኩን ‘በጌ፣ ጠፍቶ የነበረው’ የተለየ ገላጭ አወቃቀር በተፈጥሯዊ አማርኛ ያቆያል፤ ‘በግ’ በአማርኛ በሴት ጾታ ተውላጠ ስም መጠቀሙ የተለመደ ነው።
