  rationale: በዚህ ቁጥር ያለውን ተጨባጭ የበግ ምስል ይጠብቃል፤ ስለ ኃጢአተኞች ወይም ድነት የሚሰጠውን ትርጓሜ ከአውዱ በፊት ወደ ጽሑፉ አያስገባም። የነበረችው የሚለውም የግሪኩን ፍጹም አሳታፊ ሁኔታ ያንጸባርቃል።
