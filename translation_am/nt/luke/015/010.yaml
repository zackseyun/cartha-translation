  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: am
  text: እንደዚሁም[a]፣ እላችኋለሁ፤ በእግዚአብሔር መላእክት ፊት[b]፣ ንስሐ በሚገባ በአንድ ኃጢአተኛ ምክንያት ደስታ አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲሁ” ወይም “ስለዚህ።”
    reason: lexical_alternative
  - marker: b
    text: ቃሉ “በእግዚአብሔር መላእክት ፊት” ማለት ነው፤ ደስ የሚላቸው መላእክቱ ራሳቸው እንደሆኑ በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: እንደዚሁም
  rationale: ከቀደመው ምሳሌ ጋር ያለውን ንጽጽርና ትግበራ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን ንግግርና የማጉላት ኃይሉን በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: γίνεται χαρά
  choice: ደስታ ይሆናል
  rationale: ደስታ መከሰቱን ወይም መኖሩን የሚያመለክተውን ግሪክኛ በግልጽ አማርኛ ያቀርባል።
- source_word: ἐνώπιον
  choice: ፊት
  rationale: ‘በፊት/በመገኘት’ የሚለውን የስፍራና የመገኘት ሐሳብ ይጠብቃል፤ የደስታውን አድራጊ አይገድብም።
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: የእግዚአብሔር መላእክት
  rationale: የባለቤትነት ግንኙነቱን በተለመደና ክብር ባለው መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: በአንድ ኃጢአተኛ ምክንያት
  rationale: ደስታው የተነሳበትን ምክንያት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετανοοῦντι
  choice: ንስሓ በሚገባ
  rationale: የአሁን ጊዜ አሳታፊው ኃጢአተኛውን ንስሓ በመግባት ላይ እንዳለ ይገልጻል፤ ቃሉን ወደ አንድ ብቻ የትርጉም ክፍል አያጠብብም።
theological_decisions:
- issue: የμετανοοῦντι ንስሓ ትርጉም
  choice: ንስሓ በሚገባ
  alternative: ሐሳቡን በሚለውጥ / በሚመለስ
  rationale: ጥቅሱ ንስሓን በሰፊ የእምነት ትምህርት አይተነትንም፤ ስለዚህ የተለመደውንና ሰፊ መጽሐፍ ቅዱሳዊ ቃል ሳይዘረጋ መጠቀም ተመርጧል።
- issue: የደስታው ቦታና አድራጊ
  choice: በእግዚአብሔር መላእክት ፊት ደስታ ይሆናል
  alternative: የእግዚአብሔር መላእክት ደስ ይላቸዋል / በመላእክት መካከል ደስታ ይሆናል
  rationale: ግሪክኛው ደስታው በመላእክት ‘ፊት’ እንደሚሆን ይናገራል እንጂ መላእክትን በግልጽ የደስታው አድራጊዎች አያደርጋቸውም፤ ይህ አሻሚነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እግዚአብሔር፣ መላእክት፣ ንስሓ፣ ኃጢአተኛ’ የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ለትክክለኛነትና ለክብር ተጠብቀዋል።
