  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: am
  text: ሲያገኘውም[a] ደስ እያለው በትከሻዎቹ ላይ ያደርገዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ማለትም፣ በቀደመው አውድ የተጠቀሰውን የጠፋውን በግ።
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: ሲያገኘውም
  rationale: የግሪኩ ያለፈ ጊዜ አድራጊ ቦዝ አንቀጽ ከዋናው ድርጊት በፊት የሚፈጸመውን ድርጊት ያሳያል፤ በአማርኛም «ሲያገኘው» በተፈጥሮ ይገልጸዋል። «-ው» የሚለው ተሳቢ ከቀደመው አውድ የጠፋውን በግ ያመለክታል።
- source_word: ἐπιτίθησιν
  choice: ያደርገዋል
  rationale: ዋናውን የማኖር ወይም የመጫን ድርጊት በተለመደና ግልጽ አማርኛ ይገልጻል።
- source_word: ἐπὶ τοὺς ὤμους
  choice: በትከሻዎቹ ላይ
  rationale: ἐπί ከተሳቢ መስተዋድድ ጋር ወደ ላይ አኖረ የሚለውን አቅጣጫና ቦታ ያሳያል፤ «ትከሻዎቹ» ደግሞ የግሪኩን ብዙ ቁጥር ይጠብቃል።
- source_word: αὐτοῦ
  choice: -ዎቹ
  rationale: የትከሻዎቹ ባለቤት እረኛው መሆኑን የአማርኛው የባለቤትነት ቅጥያ በተፈጥሮ ያሳያል።
- source_word: χαίρων
  choice: ደስ እያለው
  rationale: የአሁን ጊዜ አድራጊ ቦዝ አንቀጹ ከዋናው ድርጊት ጋር አብሮ የሚከናወን ደስታን ያሳያል፤ «ደስ እያለው» ይህን ተጓዳኝ ሁኔታ ሳያጋንን ይጠብቃል።
theological_decisions:
- issue: በግሪኩ በግልጽ ያልተጠቀሰውን ተሳቢ መግለጽ
  choice: «ሲያገኘው» እና «ያደርገዋል» በሚሉት ውስጥ «-ው»ን በመጠቀም የጠፋውን በግ አመልክቷል።
  alternative: ተሳቢውን ሳይገልጹ መተርጎም።
  rationale: በግሪክ ተሳቢው ከአውዱ ስለሚታወቅ ሊቀር ይችላል፤ በአማርኛ ግን የተሳቢ ቅጥያው ንግግሩን ተፈጥሯዊና ግልጽ ያደርገዋል። ይህም ከቀደመው ቁጥር የጠፋውን በግ ብቻ ያመለክታል፤ ተጨማሪ ሥነ መለኮታዊ ትርጉም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። የግሪኩ የድርጊት ቅደም ተከተልና ከድርጊቱ ጋር የተጓዳኘው ደስታ ተጠብቀዋል።
