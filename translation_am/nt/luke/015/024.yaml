id: LUK.15.24
reference: Luke 15:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: am
  text: ምክንያቱም ይህ ልጄ ሞቶ ነበር፤ እንደገናም ሕያው ሆነ[a]፤ ጠፍቶ ነበር፤ ተገኘም[b]። እነርሱም ደስ ማለት ጀመሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደገና ኖረ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተገኝቷል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: የአባቱን የደስታ ምክንያት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተዋውቃል።
- source_word: οὗτος ὁ υἱός μου
  choice: ይህ ልጄ
  rationale: የοὗτοςን አጽንዖትና የአባቱን የቅርበት አገላለጽ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: νεκρὸς ἦν
  choice: ሞቶ ነበር
  rationale: ጽሑፉ የተጠቀመበትን ጠንካራ የሞት ምስል ሳያለዝብ ያቆያል፤ በአማርኛም ያለፈውን ሁኔታ በተፈጥሮ ይገልጣል።
- source_word: ἀνέζησεν
  choice: እንደገናም ሕያው ሆነ
  rationale: ‘እንደገና መኖር/ሕያው መሆን’ የሚለውን ፍቺ ግልጽ አድርጎ ከ‘ሞቶ ነበር’ ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: ἦν ἀπολωλὼς
  choice: ጠፍቶ ነበር
  rationale: በሉቃስ 15 የሚደጋገመውን የጠፋና የተገኘ ጭብጥ በትክክል ያቆያል።
- source_word: εὑρέθη
  choice: ተገኘም
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፣ አድራጊውንም ሳይጨምር ክፍትነቱን ያቆያል።
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: ደስ ማለት ጀመሩ
  rationale: ἤρξαντο የሚያሳየውን መጀመር በግልጽ ያቆያል፤ εὐφραίνεσθαιንም በድግሱ አውድ ውስጥ ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
theological_decisions:
- issue: በምሳሌው ውስጥ ‘ሞቶ’ እና ‘እንደገና ሕያው ሆነ’ የሚሉት አገላለጾች ያላቸው ዘይቤያዊ ኃይል
  choice: የሞትና የሕይወት ቃላትን ያለ ትርጓሜያዊ ማብራሪያ እንዳሉ ማቆየት
  alternative: ‘እንደ ሞተ ነበር፤ በመንፈሳዊ/ማኅበራዊ ሁኔታም ወደ ሕይወት ተመለሰ’ ብሎ መተርጎም
  rationale: በታሪኩ ውስጥ ቃላቱ የልጁን ከአባቱ መራቅና መመለስ በዘይቤ ይገልጣሉ፤ ሆኖም ግሪኩ ሆን ብሎ ጠንካራውን የሞት/ሕይወት ቋንቋ ይጠቀማል። ትርጉሙ ይህን ውጥረት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የሞት/ሕይወትና የመጥፋት/መገኘት ትይዩነቶች ተጠብቀዋል፤ የግሪኩ ቀላል ያለፈ ጊዜ በዋናው ጽሑፍ ተንጸባርቋል።
