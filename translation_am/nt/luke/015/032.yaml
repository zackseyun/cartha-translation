    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: ደስ ልንሰኝ
  rationale: በድግሱ አውድ ያለውን የጋራ ደስታና በዓላዊ ስሜት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: χαρῆναι
  choice: ሐሴት ልናደርግ
  rationale: ከመጀመሪያው የደስታ ግስ ጋር ያለውን ድርብ አገላለጽ ሳያጠፋ ክብር ያለውና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἔδει
  choice: ይገባ ነበር
  rationale: ያልተወሰነ ባለቤት ያለውን የሁኔታ ወይም የሥነ ምግባር ግዴታ ይጠብቃል፤ “ተገቢ ነበር” የሚለውም በማስታወሻ ቀርቧል።
- source_word: ὁ ἀδελφός σου οὗτος
  choice: ይህ ወንድምህ
  rationale: ጠቋሚውን οὗτος እና የዝምድናውን σου በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ይጠብቃል።
- source_word: νεκρὸς ἦν
  choice: ሞቶ ነበር
  rationale: የግሪክኛውን ቀጥተኛ የሞት አገላለጽ ይጠብቃል፤ ምሳሌያዊ ኃይሉን አያብራራውም።
- source_word: ἔζησεν
  choice: እንደገናም ሕያው ሆነ
  rationale: ቃሉ በቀጥታ “ኖረ/ሕያው ሆነ” ቢልም፣ ከ“ሞቶ ነበር” ጋር ያለው ተቃርኖ የቀድሞው ሕይወት መመለሱን ያመለክታል።
- source_word: ἀπολωλὼς
  choice: ጠፍቶ ነበር
  rationale: ፍጹም አካፋዩ የሚገልጸውን የጠፋነት ሁኔታ በተለመደ አማርኛ ያስተላልፋል።
- source_word: εὑρέθη
  choice: ተገኘም
  rationale: የአኦሪስት ተደራጊ ቅርጹን በቀጥታ ይወክላል፤ “ተገኝቶአል” የሚለው አሁናዊ ውጤቱን የሚያጎላ አማራጭ ነው።
theological_decisions:
- issue: ἔζησεν በምሳሌው ውስጥ ቃል በቃል ወይስ ምሳሌያዊ መሆኑ
  choice: “እንደገናም ሕያው ሆነ” ተብሎ የሞትና የሕይወት ተቃርኖው ተጠብቋል።
  alternative: “እንደገና ኖረ” ወይም ትርጉሙን በግልጽ “ወደ ግንኙነት ተመለሰ” ማለት።
  rationale: አውዱ የጠፋው ልጅ መመለስን በምሳሌያዊ የሞትና የሕይወት ቋንቋ ይገልጻል። ትርጉሙ ይህን ምስል ሳይፈታ ይጠብቃል፤ ማስታወሻው ግን የመመለስ ምሳሌያዊ አጠቃቀም ሊሆን እንደሚችል ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው ሁለት የደስታ አገላለጾች፣ የግዴታ ኃይል፣ የዝምድና አጽንዖት፣ እንዲሁም የሞት/ሕይወትና የመጥፋት/መገኘት ትይዩ ተቃርኖዎች ተጠብቀዋል።
