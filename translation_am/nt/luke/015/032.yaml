base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: am
  text: 'ነገር ግን ደስ ልንሰኝና ሐሴት ልናደርግ ይገባ ነበር፤[a] ምክንያቱም ይህ ወንድምህ ሞቶ ነበር፣ እንደገናም ሕያው ሆነ፤[b] ጠፍቶ ነበር፣ ተገኘም።[c]


    [a] ወይም፣ “ደስ ልንሰኝና ሐሴት ልናደርግ ተገቢ ነበር።”

    [b] ግሪክኛው “ሕያው ሆነ” ወይም “ኖረ” ማለት ነው፤ በምሳሌው ውስጥ ይህ አገላለጽ የተመለሰውን ግንኙነትና ሁኔታ በምሳሌያዊ መንገድ የሚገልጽ ሊሆን ይችላል።

    [c] ወይም፣ “ተገኝቶአል።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ደስ ልንሰኝና ሐሴት ልናደርግ ተገቢ ነበር።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ሕያው ሆነ” ወይም “ኖረ” ማለት ነው፤ በምሳሌው ውስጥ ይህ አገላለጽ የተመለሰውን ግንኙነትና ሁኔታ በምሳሌያዊ መንገድ የሚገልጽ ሊሆን ይችላል።
