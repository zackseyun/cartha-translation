  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩ ሕያው የትረካ ቅደም ተከተልና ስሜታዊ ኃይል ተጠብቋል፤ በκατεφίλησεν ውስጥ ያለው የጥንካሬ ወይም የመደጋገም አሻሚነት በማስታወሻ ቀርቧል።
