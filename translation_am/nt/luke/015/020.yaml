base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: am
  text: እርሱም ተነሥቶ ወደ አባቱ መጣ። ነገር ግን ገና ሩቅ ሳለ[a]፣ አባቱ አየውና ራራለት፤ ሮጦም ወደ አንገቱ ተጠምዶ አጥብቆ ሳመው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገና ብዙ ርቀት ርቆ ሳለ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ግስ የጠነከረ ፍቅራዊ አገላለጽ ወይም የተደጋጋሚ መሳም ሊያመለክት ይችላል፤ “ደጋግሞ ሳመው” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: የአዮሪስት አጋዥ ግስ ሲሆን፣ ልጁ ወደ አባቱ ከመምጣቱ በፊት የወሰደውን ቆራጥ እርምጃ ያሳያል።
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: ወደ አባቱ መጣ
  rationale: የግሪኩ ἔρχομαι እንደ እይታው አቅጣጫ ‘መጣ’ ወይም ‘ሄደ’ ሊሆን ይችላል፤ እዚህ ‘መጣ’ ትረካው በአባቱ ላይ ካደረገው ትኩረት ጋር ይስማማል።
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: ገና ከሩቅ ሳለ
  rationale: ድርጊቶቹ በአንድ ጊዜ መሆናቸውንና ልጁ አሁንም ሩቅ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐσπλαγχνίσθη
  choice: ራራለት
  rationale: ግሱ ከውስጥ የሚነሣ ጥልቅ ርኅራኄን ይገልጣል፤ ‘ራራለት’ ይህን ስሜታዊ ኃይል በአጭርና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: δραμὼν
  choice: ሮጦም
  rationale: ቀጥተኛውን የመሮጥ ድርጊት በተፈጥሯዊ የትረካ ቅደም ተከተል ያቀርባል።
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: በአንገቱ ላይ ወድቆ
  rationale: የግሪኩን ግልጽና ሕያው ምስል ይጠብቃል፤ ‘አቀፈው’ የሚለውን የተተረጎመ ማብራሪያ ወደ ዋናው ጽሑፍ አያስገባም።
- source_word: κατεφίλησεν
  choice: በፍቅር ሳመው
  rationale: καταφιλέω የመሳሙን ሞቅታና ጥንካሬ ሊያጎላ ይችላል፤ ‘በፍቅር’ ይህን ሳያጠፋ መሳሙ በተደጋጋሚ እንደነበር አስገድዶ አይወስንም።
theological_decisions:
- issue: በምሳሌው ውስጥ የአባቱ ርኅራኄ አቀራረብ
  choice: የአባቱን ርኅራኄና ቀዳሚ እርምጃ ስሜታዊ ኃይሉን ጠብቆ ማቅረብ፣ ነገር ግን ምሳሌያዊ ፍቺውን በትርጉሙ ውስጥ አለመጨመር
  alternative: ስሜታዊ ኃይሉን በሚቀንስ ቃል ማቅረብ፣ ወይም አባቱ እግዚአብሔርን እንደሚወክል በዋናው ጽሑፍ ግልጽ ማድረግ
  rationale: ጥቅሱ ራሱ በተከታታይ ኃይለኛ ግሶች የአባቱን ርኅራኄና ቀዳሚ እርምጃ ያሳያል። ትርጉሙ ይህን ኃይል ሊጠብቅ ይገባል፤ ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ማብራሪያ ግን ማከል የለበትም።
