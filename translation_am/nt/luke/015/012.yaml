source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: am
  text: ከእነርሱም ታናሹ ለአባቱ፣ “አባት ሆይ፣ ከንብረትህ የሚደርሰኝን ድርሻ[a] ስጠኝ” አለው። እርሱም የኑሮ ጥሪቱን[b] ለእነርሱ አካፈለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ከንብረትህ ለእኔ የሚገባውን ክፍል” ወይም “ሊደርሰኝ የሚገባውን ድርሻ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው ቃል በቀጥታ “ሕይወት/ኑሮ” (βίον) ማለት ሲሆን፣ እዚህ የአባቱን ንብረት ወይም የኑሮ ጥሪት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: ታናሹ
  rationale: በግሪክኛው ንጽጽራዊ ቅጽ እንደ ስም ሆኖ ‘ታናሹ [ልጅ]’ የሚል ፍቺ አለው፤ ‘ልጅ’ ከአውዱ ቢታወቅም በዚህ ሐረግ በግልጽ ስላልተጻፈ ‘ታናሹ’ ተመርጧል።
- source_word: δός μοι
  choice: ስጠኝ
  rationale: ቀጥተኛውን የትእዛዝ/የጥያቄ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ ἐπιβάλλον μέρος
  choice: የሚደርሰኝን ድርሻ
  rationale: ἐπιβάλλον ለአንድ ሰው የሚደርሰውን ወይም የሚገባውን ክፍል ያመለክታል፤ ይህ አገላለጽ የድርሻ መብቱን ሳያጠነክር ወይም ሳያዳክም ያቀርባል።
- source_word: οὐσία
  choice: ሀብት
  rationale: በውርስ አውድ የቤተሰቡን ንብረትና ጥሪት ያመለክታል፤ ‘ሀብት’ በዘመናዊ አማርኛ ተፈጥሯዊና ሰፊ ትርጉም አለው።
- source_word: διεῖλεν
  choice: አካፈለ
  rationale: ሀብትን ለብዙ ሰዎች ከፍሎ የመስጠትን ተግባር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: αὐτοῖς
  choice: ለእነርሱ
  rationale: የግሪክኛውን የብዙ ቁጥር ተውላጠ ስም በቀጥታ ይጠብቃል፤ ከአውዱ ሁለቱ ልጆች መሆናቸው ይታወቃል።
- source_word: βίον
  choice: መተዳደሪያ ንብረቱን
  rationale: βίος እዚህ ሕይወትን ብቻ ሳይሆን የኑሮ መሠረት የሆነውን ሀብትና ንብረት ያመለክታል፤ ትርጉሙ የኑሮ መደገፊያነቱን ይጠብቃል።
