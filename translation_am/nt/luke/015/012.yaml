  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “አባት ሆይ” የቀጥተኛውን ንግግር ክብርና ጥሪ ይጠብቃል፤ የግሪክኛው οὐσία እና βίος ልዩነትም “ሀብት” እና “መተዳደሪያ ንብረት” በሚሉ ልዩ አገላለጾች ተጠብቋል።
