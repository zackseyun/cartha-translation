  text: እርሱ ግን ተቆጣ፤ ወደ ውስጥም መግባት አልፈለገም።[a] አባቱም ወደ ውጭ ወጥቶ ይለምነው ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለመግባት ፈቃደኛ አልነበረም” ወይም “ወደ ውስጥ ለመግባት እምቢ አለ።”
    reason: lexical_alternative
  - marker: b
    text: “ይለምነው” ተብሎ የተተረጎመው ግስ “ያበረታታው” ወይም “ይማጸነው” ተብሎም ሊተረጎም ይችላል፤ ያልተፈጸመ የግስ ቅርጹ ልመናው ቀጣይ መሆኑን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: ተቆጣ
  rationale: የቁጣውን መነሳት በተፈጥሯዊና ግልጽ አማርኛ ያሳያል፤ ‘እጅግ ተናደደ’ ከሚለው ይልቅ የግሪኩን ኃይል አያጋንንም።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የደስታ በዓል ጋር ያለውን መጠነኛ ንጽጽር በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: ወደ ውስጥም መግባት አልፈለገም
  rationale: θέλω የፈቃድን ወይም የመሻትን ሐሳብ ይገልጣል። ይህ አተረጓጎም እንደ ግልጽ እምቢታ ከማጠናከር ይልቅ የውስጥ ፈቃድ ማጣቱን ይጠብቃል።
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: ስለዚህ አባቱ
  rationale: ሁለተኛው δέ ለልጁ አቋም የአባቱን ምላሽ ያስከትላል፤ ‘ስለዚህ’ የትረካውን ተከታታይነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξελθὼν
  choice: ወደ ውጭ ወጥቶ
  rationale: ከቤቱ ውስጥ ወደ ውጭ የተደረገውን እንቅስቃሴ ግልጽ ያደርጋል።
- source_word: παρεκάλει
  choice: ይለምነው ነበር
  rationale: የግሪኩ ያልተፈጸመ የግስ ቅርጽ ቀጣይ ወይም ተደጋጋሚ ልመናን ሊያመለክት ስለሚችል፣ ‘ነበር’ የድርጊቱን ቀጣይነት ያሳያል። ‘ይለምነው’ ደግሞ የአባቱን ከልብ የሆነ ጥሪ ሳያጋንን ያስተላልፋል።
- source_word: αὐτόν
  choice: -ው
  rationale: በ‘ይለምነው’ ውስጥ ያለው የተሳቢ ቅጥያ ታላቁን ልጅ በተፈጥሯዊ አማርኛ ያመለክታል።
theological_decisions:
