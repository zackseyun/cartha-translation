  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የዐረፍተ ነገሩ ፍሰት ተፈጥሯዊ ሆኖ ሳለ የግሪኩ ንጽጽር፣ ፈቃድና ቀጣይ ልመና ተጠብቀዋል።
