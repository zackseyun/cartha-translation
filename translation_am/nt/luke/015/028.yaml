  rationale: ይህ ምርጫ አባቱ በራሱ ተነሳስቶ በትጋትና በርኅራኄ መጥራቱን ይጠብቃል፤ ከቃሉ ትርጉም በላይ የሆነ የትምህርተ እምነት ፍቺ አያስገባም።
