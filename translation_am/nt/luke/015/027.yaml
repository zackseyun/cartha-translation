  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: am
  text: እርሱም፣ “ወንድምህ መጥቷል፤ አባትህም ደኅና ሆኖ[a] ስለተቀበለው፣ የሰባውን ጥጃ አርዷል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጤናማ ሆኖ።” ὑγιαίνοντα የሚለው የግሪክ ቃል “ጤናማ መሆን” ማለት ሊሆን ይችላል፤ በዚህ አውድ ግን ደኅናና ያለ ጉዳት መሆንን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: መጥቷል
  rationale: የመምጣቱን ፍጻሜና አሁን በቦታው መኖሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔθυσεν
  choice: አርዷል
  rationale: በድግስ ምግብ አውድ ውስጥ እንስሳን ለምግብ ማረድን በትክክል ይገልጣል፤ መደበኛ የአምልኮ መሥዋዕት ነው የሚል ግንዛቤ አያስገባም።
- source_word: μόσχον τὸν σιτευτόν
  choice: የሰባውን ጥጃ
  rationale: ለልዩ ድግስ ተመግቦ የሰባውን እንስሳ በተለመደና በቀላሉ በሚገባ አማርኛ ይገልጣል።
- source_word: ὑγιαίνοντα
  choice: በሰላም
  rationale: ቃሉ ጤናማ ወይም ደህና መሆንን ሊያመለክት ይችላል፤ በመመለስ አውድ ‘በሰላም’ ሥጋዊ ደኅንነትንና ያለጉዳት መድረስን በተፈጥሯዊነት ይይዛል።
- source_word: ἀπέλαβεν
  choice: ተመልሶ ስላገኘው
  rationale: አባቱ ልጁን እንደገና ማግኘቱን የሚያሳየውን የመመለስ ፍቺ ይጠብቃል።
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: እርሱም፣ … አለው
  rationale: δέን በ‘ም’ አያያዥ አሳይቶ፣ ὅτι ያስገባውን ቀጥተኛ ንግግር በአማርኛ ተፈጥሯዊ የንግግር አወቃቀር ያቀርባል።
theological_decisions:
- issue: ὑγιαίνοντα የሚያመለክተው የጤና ሁኔታ ወይስ ሰፊ የደኅንነት ሁኔታ
  choice: በዋናው ጽሑፍ ‘በሰላም’
  alternative: ‘ጤናማ ሆኖ’
  rationale: አውዱ ከሩቅ የተመለሰ ልጅን ስለመቀበል ስለሆነ ‘በሰላም’ ሰፊውን ፍቺ ያስተላልፋል፤ ጠባቡ የጤና ፍቺ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥተኛ ንግግሩ አወቃቀር ተፈጥሯዊ እንዲሆን የንግግር ግሱ በመጨረሻ ቀርቧል።
