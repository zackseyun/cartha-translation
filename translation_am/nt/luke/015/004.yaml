  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: am
  text: ከእናንተ መካከል መቶ በጎች ያሉት ሰው፣ ከእነርሱም አንዱ ቢጠፋበት፣ ዘጠና ዘጠኙን በሜዳ[a] ትቶ የጠፋውን እስኪያገኘው ድረስ የጠፋውን ፍለጋ የማይሄድ ማን ነው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በምድረ በዳ»። የግሪኩ ቃል ክፍት ሜዳን፣ የግጦሽ ስፍራን ወይም ሰው የማይኖርበትን ቦታ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: ከእናንተ መካከል ... ሰው ... ማን ነው?
  rationale: የግሪኩን ወካይ ነጠላ ሰው እና አዎንታዊ መልስ የሚጠብቀውን የንግግር ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: መቶ በጎች ያሉት
  rationale: የባለቤትነት ሐረጉንና ቁጥሩን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: ከእነርሱም አንዱ ቢጠፋበት
  rationale: በዚህ አውድ የጠፋው በግ መሆኑን እንጂ ሰውየው ሆን ብሎ እንዳጠፋው አያመለክትም፤ የአማርኛው -በት ቅጥያም ኪሳራው በባለቤቱ ላይ መድረሱን በተፈጥሯዊነት ያሳያል።
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: ዘጠና ዘጠኙን ... ትቶ ... የማይሄድ ማን ነው?
  rationale: አዎንታዊ መልስ የሚጠብቀውን አሉታዊ የንግግር ጥያቄ በአማርኛ የተለመደ አወቃቀር ይጠብቃል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በሜዳ
  rationale: ἔρημος ክፍት፣ ያልታረሰ ወይም ሰው የማይኖርበትን ስፍራ ሊያመለክት ይችላል፤ «በሜዳ» በእረኝነት አውድ ተፈጥሯዊ ሲሆን የግድ ደረቅ በረሃ የሚል ሐሳብ አያስገባም።
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: የጠፋውን ... ፍለጋውን ይሄዳል
  rationale: ወደ ጠፋው በግ በማምራት የመፈለግን ዓላማ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἕως εὕρῃ αὐτό
  choice: እስኪያገኘው ድረስ
  rationale: የፍለጋውን የጊዜ ገደብ በቅርብ እና ግልጽ ሁኔታ ያስተላልፋል።
theological_decisions:
