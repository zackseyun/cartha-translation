  rationale: ἄνθρωπος በዚህ ስፍራ ነጠላ ወካይ ምሳሌ ያቀርባል። «ሰው» በአማርኛ ይህን አጠቃላይ ኃይል በተፈጥሯዊነት ይጠብቃል።
