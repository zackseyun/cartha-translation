  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: am
  text: የደለበውን ጥጃ አምጡ፤ እረዱት፤ እንብላና ደስ ይበለን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρετε
  choice: አምጡ
  rationale: የብዙ ቁጥር ትእዛዛዊ ቅርጽ ሲሆን፣ በአማርኛ ‘አምጡ’ በተፈጥሮ እና ያለ አስፈላጊ ማስፋት ይገልጸዋል።
- source_word: μόσχον τὸν σιτευτόν
  choice: የደለበውን ጥጃ
  rationale: μόσχος ወጣት ከብትን ወይም ጥጃን፣ σιτευτός ደግሞ ለልዩ ወቅት የተመገበና የደለበ መሆኑን ያመለክታል። ‘የደለበው ጥጃ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: θύσατε
  choice: እረዱት
  rationale: በዚህ የግብዣ አውድ ውስጥ እንስሳውን ለምግብ ማረድን ይገልጻል። ‘ሠዉት’ ማለት በግልጽ የአምልኮ መሥዋዕት ሐሳብ ሊያስገባ ስለሚችል፣ ዋናው ጽሑፍ ‘እረዱት’ ይላል፤ የቃሉ ሰፊ ትርጉም ግን በማስታወሻ ተጠብቋል።
- source_word: φαγόντες
  choice: እንብላ
  rationale: በቃል ቅርጹ ‘በልተን’ የሚል ቦዝ አንቀጽ ቢሆንም፣ ከሚከተለው የማበረታቻ ንግግር ጋር ‘እንብላ’ ብሎ መተርጎም ተፈጥሯዊ ሲሆን የመመገብን ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: εὐφρανθῶμεν
  choice: ደስም ይበለን
  rationale: የአንደኛ መደብ ብዙ ቁጥር የማበረታቻ ቅርጽ ነው። ‘ደስ ይበለን’ የደስታና የበዓል ሐሳቡን በዘመናዊ፣ ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ ... καὶ
  choice: -ም ... -ም
  rationale: የግሪኩን ተደጋጋሚ ማያያዣ በአማርኛ ተፈጥሯዊ በሆነው ‘-ም ... -ም’ አወቃቀር በመግለጽ የትእዛዞቹንና የጋራ ደስታውን ቅደም ተከተል ይጠብቃል።
theological_decisions:
- issue: θύσατε ሊኖረው የሚችለው የመሥዋዕት ፍቺ
  choice: በዋናው ጽሑፍ ለግብዣ እንስሳን ማረድ በሚያመለክተው ‘እረዱት’ ተተርጉሟል።
