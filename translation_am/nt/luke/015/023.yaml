  rationale: በታሪኩ አውድ ዋናው ትኩረት ለቤተሰብ የደስታ ግብዣ እንስሳውን ማዘጋጀት ላይ ነው። ‘ሠዉት’ የሚለው በግልጽ የአምልኮ ሥርዓትን ሊያስገባ ይችላል፤ ሆኖም የግሪኩ ግስ በአንዳንድ አውዶች የመሥዋዕት ጥላ ፍቺ ሊኖረው እንደሚችል በማስታወሻው ተጠብቋል።
