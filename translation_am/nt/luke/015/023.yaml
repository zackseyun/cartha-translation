  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር ትእዛዞቹ በሴሚኮሎን ተለይተው የንግግሩን ፈጣን እንቅስቃሴ ይጠብቃሉ፤ የግሪኩ ፍጹም የቦዝ አንቀጽ በተፈጥሯዊ የጋራ ማበረታቻ አገላለጽ ተሰጥቷል።
