lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: ሁሉን ካጠፋ በኋላ
  rationale: የግሪኩ የጊዜ አመልካች ሐረግ ዋናው ክስተት ከመሆኑ በፊት ያለቀን ድርጊት ያሳያል። «አጠፋ» ገንዘብን ወይም ሀብትን ሙሉ በሙሉ መጨረስን በተፈጥሯዊ አማርኛ ያሳያል፤ «አባከነ» ግን ግምገማዊ ትርጉምን በዚህ ግስ ላይ ከሚገባው በላይ ሊጨምር ይችላል።
- source_word: δέ
  choice: ነገር ግን
  rationale: ትረካው ከብዛት ወደ ችግር የሚዞርበትን ንጽጽርና እድገት ያሳያል።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: ከ«ረሃብ» ጋር የአንድ ክስተት መከሰትን በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λιμὸς ἰσχυρά
  choice: ከባድ ረሃብ
  rationale: ἰσχυρά የረሃቡን ጽናትና ክብደት ያጠናክራል፤ «ከባድ ረሃብ» ዘመናዊና ተፈጥሯዊ አገላለጽ ነው።
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: በዚያች አገር ሁሉ
  rationale: κατά ከተሳቢ ጋር በአንድ አካባቢ ላይ የተዘረጋ ሁኔታን ሊያመለክት ይችላል፤ «ሁሉ» ይህን የመስፋፋት ስሜት ያስተላልፋል።
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: እርሱም መቸገር ጀመረ
  rationale: ἤρξατο የእጦቱን መጀመር ያሳያል፤ ὑστερεῖσθαι በዚህ አውድ የሚያስፈልገውን ማጣትና ችግር ውስጥ መግባት ነው። «መቸገር» በአማርኛ አጭርና ግልጽ ነው፤ ግልጽ የሆነውን αὐτός ደግሞ «እርሱም» በማለት ያንጸባርቃል።
