lexical_decisions:
- source_word: Ἦν δὲ
  choice: ነበር። ...ም
  rationale: δέ የትረካውን ሽግግር ያመለክታል፤ በአማርኛ የአረፍተ ነገሩ አወቃቀርና በቀጣዩ ሐረግ ያለው «ም» ይህን ፍሰት በተፈጥሮ ያስተላልፋሉ፣ ግልጽ ያልሆነ ተቃርኖም አይጨምሩም።
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: ታላቁ ልጁ
  rationale: πρεσβύτερος ከሌላው ልጅ የሚበልጠውን ዕድሜ ያመለክታል፤ «ታላቁ ልጁ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ የግድ ከሁሉም የበኩር መሆኑን አያክልም።
- source_word: ἐν ἀγρῷ
  choice: በእርሻ ላይ
  rationale: ἀγρός እርሻን ወይም የእርሻ መሬትን ያመለክታል፤ ይህ አገላለጽ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ
  choice: ወደ ቤቱም እየመጣ ሲቀርብ
  rationale: የመምጣቱን ቀጣይ እንቅስቃሴና ወደ ቤቱ መቅረቡን ሳያደበዝዝ በተፈጥሯዊ የአማርኛ ጊዜ ሐረግ ያቀርባል።
- source_word: ἤκουσεν
  choice: ሰማ
  rationale: ቀላል የትረካ ግስ ነው፤ «ሰማ» ተጨማሪ የጅማሬ ሐሳብ ሳያስገባ በትክክል ይተረጉመዋል።
- source_word: συμφωνίας καὶ χορῶν
  choice: የሙዚቃና የጭፈራ ድምፅ
  rationale: ቃላቱ ሙዚቃንና ጭፈራን፣ ወይም በተለይ የመሣሪያ ሙዚቃንና የጨፋሪዎች ቡድንን ሊያመለክቱ ይችላሉ። «ድምፅ» ከ«ሰማ» ጋር ተፈጥሯዊ አማርኛ እንዲሆን ያደርገዋል፤ ዋናው ጽሑፍ የዝግጅቱን አጠቃላይ ትርጉም ይይዛል፣ የተወሰነው አማራጭ ደግሞ በማስታወሻ ቀርቧል።
