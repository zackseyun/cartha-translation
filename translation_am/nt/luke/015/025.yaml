  text: ታላቁ ልጁ በእርሻ ላይ ነበር፤ እየመጣም ወደ ቤት ሲቀርብ፣ ሙዚቃና ጭፈራ[a] ሰማ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመሣሪያ ሙዚቃና ጨፋሪዎች።» የግሪክኛዎቹ ቃላት በተለይ በመሣሪያ የሚቀርብ ሙዚቃንና የጨፋሪዎችን ቡድኖች ሊያመለክቱ ይችላሉ።
