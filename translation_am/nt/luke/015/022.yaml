  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: am
  text: ነገር ግን አባቱ ባሪያዎቹን[a]፣ “ፈጥናችሁ ከሁሉ የተሻለውን ካባ[b] አውጥታችሁ አልብሱት፤ ቀለበትም[c] በእጁ ላይ፣ ጫማዎችንም በእግሮቹ ላይ አድርጉለት” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ δούλους በቤቱ ውስጥ በባርነት ወይም በጥገኝነት የሚያገለግሉትን ያመለክታል፤ «አገልጋዮቹን» ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል «የመጀመሪያውን ካባ»፤ በዚህ ዐውድ «ከሁሉ የተሻለውን» ወይም «ዋናውን» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: c
    text: የግሪኩ ጽሑፍ «ቀለበት» ብቻ ይላል፤ አንዳንዶች ግን ይህን የተመለሰ ክብርን የሚያሳይ የማኅተም ቀለበት እንደሆነ ይረዱታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: ባሪያዎቹን
  rationale: ቃሉ በቤተሰብ ውስጥ በባርነት ወይም በጥገኝነት የሚያገለግሉትን ያመለክታል፤ «ባሪያዎቹን» የዘመኑን ማኅበራዊ እውነታ ከ«አገልጋዮቹን» ይበልጥ በግልጽ ያስቀምጣል።
- source_word: Ταχὺ
  choice: ፈጥናችሁ
  rationale: ትእዛዙ ወዲያውኑ እንዲፈጸም የአባቱን ጥድፊያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξενέγκατε
  choice: አውጥታችሁ
  rationale: ካባውን ከቤት ወይም ከማከማቻ ስፍራ ወደ ውጭ የማምጣትን ተግባር ያስተላልፋል።
- source_word: στολὴν τὴν πρώτην
  choice: ከሁሉ የተሻለውን ካባ
  rationale: πρώτην በዚህ ዐውድ በቅደም ተከተል «የመጀመሪያው» ሳይሆን በክብር ወይም በጥራት ቀዳሚ የሆነውን ሊያመለክት ይችላል፤ «ካባ» ደግሞ στολή የሚያመለክተውን የውጭ ልብስ ከአጠቃላይ «ልብስ» ይበልጥ በግልጽ ያሳያል።
- source_word: ἐνδύσατε αὐτόν
  choice: አልብሱት
  rationale: ሰውየውን በተጠቀሰው ካባ እንዲያለብሱት የተሰጠውን ትእዛዝ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: δακτύλιον
  choice: ቀለበት
  rationale: የግሪኩ ቃል ቀለበትን ብቻ ይጠቅሳል፤ የማኅተም ቀለበት መሆኑን አይገልጽም።
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: በእጁ
  rationale: ጌጥ በእጅ ላይ ማድረግን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὑποδήματα
  choice: ጫማ
  rationale: ቃሉ በጥንታዊው የሜድትራኒያን ዐውድ በተለምዶ የታሰረ ክፍት ጫማን ያመለክታል፤ «ጫማ» ግን በዘመናዊ መደበኛ አማርኛ ያልተጣበቀና በቀላሉ የሚገባ ምርጫ ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከልጁ ንግግር ወደ አባቱ ፈጣን ትእዛዝ የሚደረገውን ቀላል ንፅፅርና የትረካ ሽግግር ያሳያል።
theological_decisions:
