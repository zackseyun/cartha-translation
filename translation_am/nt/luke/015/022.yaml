- issue: πρώτην ቃል በቃል «የመጀመሪያው» ወይስ በዐውዱ «ከሁሉ የተሻለው» ተብሎ መተርጎም
  choice: ከሁሉ የተሻለውን ካባ
  alternative: የመጀመሪያውን ካባ / ዋናውን ካባ
  rationale: በዚህ ዐውድ ሐረጉ በጥራት ወይም በክብር ቀዳሚ የሆነውን ካባ መጥቀሱ ይበልጥ የተፈጥሮ ነው፤ ይህም ምልክታዊ ትርጉምን ያለ ማከል ፍቺውን ያስተላልፋል።
- issue: δακτύλιονን «የማኅተም ቀለበት» ብሎ ማስፋት
  choice: ቀለበት
  alternative: የማኅተም ቀለበት
  rationale: ቀለበቱ የተመለሰ ክብርን ወይም ሥልጣንን ሊያመለክት ቢችልም የግሪኩ ጽሑፍ የማኅተም ቀለበት መሆኑን አይወስንም።
