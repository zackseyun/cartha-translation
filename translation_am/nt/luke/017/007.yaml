source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: am
  text: ነገር ግን ከእናንተ መካከል የሚያርስ ወይም መንጋ የሚጠብቅ ባሪያ[a] ያለው ማን ነው፣ ባሪያው ከእርሻ ሲገባ፣ “ወዲያው መጥተህ በማዕድ ተደግፈህ ተቀመጥ[b]” የሚለው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ δοῦλος “አገልጋይ” ወይም “በባርነት የታሰረ አገልጋይ” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን በጌታው ሥልጣን ሥር ያለን የቤት ሠራተኛ ያመለክታል።
    reason: alternative_reading
  - marker: b
    text: “በማዕድ ተደግፈህ ተቀመጥ” የሚለው የግሪኩ ቃል ለምግብ ተደግፎ መቀመጥን ያመለክታል። በጥንት ጊዜ ሰዎች ብዙ ጊዜ ምግብ ሲበሉ ተደግፈው ይመገቡ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: ባሪያ
  rationale: ቃሉ በጌታው ሥልጣን ሥር ያለን፣ በደመወዝ የተቀጠረ ሠራተኛ ያልሆነን ሰው ያመለክታል። በምሳሌው ውስጥ ያለውን የጌታና የባሪያ ያልተመጣጠነ ማኅበራዊ ግንኙነት ለማስጠበቅ “ባሪያ” ተመርጧል።
- source_word: ἀροτριῶντα
  choice: የሚያርስ
  rationale: ግሱ በቀጥታ መሬትን በማረሻ የማረስ ሥራን ያመለክታል፤ የአማርኛው አገላለጽም አጭርና ተፈጥሯዊ ነው።
- source_word: ποιμαίνοντα
  choice: መንጋ የሚጠብቅ
  rationale: ግሱ እንደ እረኛ መንጋን መጠበቅን ያመለክታል። ምንጩ የእንስሳውን ዓይነት ስለማይገልጽ “በግ” ብሎ ከመወሰን ይልቅ “መንጋ” ተብሏል።
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: ከእርሻ ሲገባ
  rationale: የድርጊቱን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ ባሪያው ከመስክ ሥራው ተመልሶ ሲገባ የሚነገረውን ያመለክታል።
- source_word: Εὐθέως παρελθὼν ἀνάπεσε
  choice: ወዲያው ናና በማዕድ ተቀመጥ
  rationale: “ወዲያው” የትእዛዙን አፋጣኝነት፣ “ናና” ደግሞ ወደ ማዕዱ መቅረብን ያሳያሉ። “በማዕድ ተቀመጥ” ለመብላት መቀመጥን በተፈጥሯዊ አማርኛ ሲገልጽ፣ የጥንቱ የተደግፎ መብላት ልማድ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: በቤተሰብ ሥራ አውድ ውስጥ δοῦλος የሚለውን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ፣ በባርነት የታሰረ አገልጋይ
  rationale: የምሳሌው ኃይል በጌታውና በሠራተኛው መካከል ባለው ያልተመጣጠነ ሥልጣን ላይ የተመሠረተ ነው። “ባሪያ” ይህን ማኅበራዊና ንግግራዊ ኃይል ይጠብቃል፤ ከጥቅሱ በላይ የሆነ የኋለኛ ዘመን ሥነ መለኮታዊ ትርጉም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አንድ ረጅም የአጠያይቅ አወቃቀር ተጠብቋል፤ “ናና” የሚለውም የπαρελθώνን የመቅረብ ሐሳብ በተፈጥሯዊ ንግግር ያቀርባል።
