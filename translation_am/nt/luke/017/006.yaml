language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: am
  text: ጌታም እንዲህ አለ፤ “እንደ ሰናፍጭ ዘር ያለ እምነት ቢኖራችሁ፣ ለዚህ የእንጆሪ ዛፍ[a]፣ ‘ከሥርህ ተነቅለህ በባሕር ውስጥ ተተከል’ ትሉ ነበር፤ እርሱም ይታዘዛችሁ ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሲካሚን ዛፍ።” ይህ የግሪኩ ቃል ባህላዊ አተረጓጎም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: የሉቃስን ትረካዊና ክርስቶሳዊ መጠሪያ በተለመደውና ክብር ባለው የአማርኛ ቃል ያቀርባል።
- source_word: πίστιν
  choice: እምነት
  rationale: በዚህ አውድ የታመነ መታመንን ወይም በእግዚአብሔር መተማመንን ያመለክታል፤ ‘ታማኝነት’ የሚለው ግን የዚህ አውድ ዋና ሐሳብ አይደለም።
- source_word: ὡς κόκκον σινάπεως
  choice: እንደ ሰናፍጭ ዘር ያለ
  rationale: ὡς የሚገልጸውን ንጽጽር ይጠብቃል፤ ንጽጽሩን በመጠን ብቻ እንዳይወሰን ‘ትንሽ’ የሚል ትርጓሜ አልተጨመረም።
- source_word: συκαμίνῳ
  choice: የእንጆሪ ዛፍ
  rationale: ቃሉ ከሾላ ወይም ከሾላ በለስ የተለየውን የmulberry ዓይነት ዛፍ ያመለክታል፤ ለዘመናዊ አንባቢ የሚገባ መጠሪያ ተመርጧል፣ ባህላዊው አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: ἐλέγετε ἂν
  choice: ትሉት ነበር
  rationale: ከሁኔታዊው ንግግር ጋር የተያያዘውን የሚቻል ወይም ያልተፈጸመ ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἐκριζώθητι
  choice: ከሥሩ ተነቅለህ
  rationale: የግሪኩን ተገብሮአዊ ትእዛዝና ሥር ነቀል መነቀል በግልጽ አማርኛ ያስተላልፋል።
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: በባሕር ውስጥ ተተከል
  rationale: የመተከልን ግልጽ ግስና የምስሉን አስገራሚ ተቃርኖ ሳያለዝብ ይጠብቃል።
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: ይታዘዛችሁ ነበር
  rationale: በትእዛዝ አውድ ὑπακούω ያለውን ‘መታዘዝ’ ትርጉምና ሁኔታዊ ኃይሉን ይጠብቃል።
theological_decisions:
- issue: በተአምራዊ ንግግሩ ውስጥ πίστις ያለው ትርጉም
  choice: እምነት
  alternative: መታመን፤ ታማኝነት
  rationale: አውዱ የማይቻለውን ለማዘዝ የሚያስችል በእግዚአብሔር መተማመንን ያጎላል፤ ሆኖም ቃሉ ያለውን ሰፊ ሥነ መለኮታዊ ይዘት በጠባብ ማብራሪያ ላለመወሰን ‘እምነት’ ተጠቅሟል።
- issue: የሁኔታዊው ንግግር ኃይል
  choice: ቢኖራችሁ … ትሉት ነበር … ይታዘዛችሁ ነበር
  alternative: ካላችሁ … ትላላችሁ … ይታዘዛችኋል
  rationale: ἄν ያላቸው ግሶች የሚያሳዩትን መላምታዊ ወይም ሊፈጸም የሚችል ውጤት በአማርኛ ሁኔታዊ አቀራረብ ተጠብቋል፤ ይህም ንግግሩን ቀጥተኛ ተስፋ ወይም ቀመር አድርጎ አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁኔታዊው ዓረፍተ ነገር በተፈጥሯዊ ‘ቢኖራችሁ … ነበር’ አወቃቀር ቀርቧል፤ የዛፉ መጠሪያ ያለው የቃላት አማራጭ [a] በሚል ምልክት በዋናው ጽሑፍ ተጠብቋል።
