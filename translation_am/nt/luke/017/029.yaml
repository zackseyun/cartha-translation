- source_word: ἀπώλεσεν πάντας
  choice: ሁሉንም አጠፋ
  rationale: ἀπόλλυμι እዚህ ‘ማጥፋት’ ማለት ነው፤ πάντας የሚያመለክታቸውን ሰዎች በዐውዱ እንዲታወቁ በማድረግ ‘ሁሉንም’ የግሪኩን አጭርነት ይጠብቃል።
theological_decisions:
- issue: በፍርድ ዐውድ ውስጥ የθεῖον አተረጓጎም
  choice: ድኝ
  alternative: ዲን
  rationale: ‘ድኝ’ ቀጥተኛውን የንጥረ ነገሩን ትርጉም በዘመናዊ አማርኛ ያቀርባል፤ ባህላዊው ቅርጽ ግን በማስታወሻ ተጠብቋል።
- issue: የοὐρανός አተረጓጎም
  choice: ሰማይ
  alternative: ሰማያት / የሰማይ አየር
  rationale: ‘ሰማይ’ የግሪኩን አሻሚነት ሳያጠብ የተፈጥሮ ከፍታንም ሆነ መጽሐፍ ቅዱሳዊውን የፍርድ ምስል ይሸከማል።
- issue: በἀπώλεσεν ውስጥ ያልተጠቀሰው ፈጻሚ
  choice: ግልጽ ፈጻሚ አለመጨመር
  alternative: እግዚአብሔር ሁሉንም አጠፋ
  rationale: ግሪኩ በዚህ ሐረግ ውስጥ እግዚአብሔርን በስም አይጠቅስም፤ ትርጉሙም የጽሑፉን አጭርነትና ሰዋሰዋዊ ውጥረት ይጠብቃል።
