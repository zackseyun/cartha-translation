    reason: lexical_alternative
  revision_rationale: The revision changes only the rain verb to an idiomatic causative construction and corrects the lexical-alternative footnote. It preserves the Greek's temporal contrast, unnamed implied agent, fire-and-sulfur imagery, and comprehensive object of destruction.
