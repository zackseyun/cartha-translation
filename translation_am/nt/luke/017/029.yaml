- source_word: Λὼτ
  choice: ሎጥ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἀπὸ Σοδόμων
  choice: ከሰዶም
  rationale: የቦታውን ስምና የመነሻ ግንኙነቱን በግልጽና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἔβρεξεν
  choice: ዘነበ
  rationale: ግሪኩ ግልጽ ፈጻሚ ሳይጨምር የዝናብ ግስን ይጠቀማል፤ አማርኛውም ይህንኑ ቀጥተኛ ምስል ይጠብቃል።
- source_word: πῦρ καὶ θεῖον
