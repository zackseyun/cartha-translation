  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: am
  text: ከዚያም ደቀ መዛሙርቱን እንዲህ አላቸው፤ “የሰው ልጅ ቀኖች[a] አንዱን ለማየት የምትናፍቁባቸው ቀኖች ይመጣሉ፤ ነገር ግን አታዩትም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰው ልጅ ቀኖች” የሚለው የእርሱን መገኘትና ሥራ ዘመን፣ ወይም በተለይ የወደፊቱን መገለጡን ሊያመለክት ይችላል፤ የግሪኩ አገላለጽ ወሰኑን ክፍት ይተዋል።
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: ከዚያም … እንዲህ አላቸው
  rationale: δέ ትረካውን በለሰለሰ አያያዥ ያስቀጥላል፤ ‘ከዚያም’ የግሪኩን ቀላል የትረካ ሽግግር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πρὸς τοὺς μαθητάς
  choice: ደቀ መዛሙርቱን
  rationale: ግሪኩ ግልጽ የባለቤትነት ተውላጠ ስም ባይኖረውም፣ በአማርኛ የተወሰነው መስተዋድድ በተፈጥሯዊ ሁኔታ ‘ደቀ መዛሙርቱን’ ተብሎ ይገለጣል።
- source_word: Ἐλεύσονται ἡμέραι ὅτε
  choice: … የምትናፍቁበት ጊዜ ይመጣል
  rationale: ይህ የወደፊት ጊዜን የሚያስተዋውቅ ሴማዊ አገላለጽ ነው፤ በዘመናዊ አማርኛ ‘ጊዜ ይመጣል’ ትንቢታዊ ኃይሉን ሳያጠፋ ተፈጥሯዊ ነው።
- source_word: ἐπιθυμήσετε
  choice: የምትናፍቁበት
  rationale: ἐπιθυμέω በዚህ አውድ ጠንካራና ስሜታዊ ምኞትን ያመለክታል፤ ‘መናፈቅ’ ከቀላል ‘መፈለግ’ ይልቅ ይህን በትክክል ያስተላልፋል።
- source_word: μίαν τῶν ἡμερῶν
  choice: ከ…ቀኖች አንዱን
  rationale: የክፍል አመልካች ጄኒቲቩን በቀጥታ ይጠብቃል፤ ከብዙ ቀኖች መካከል አንዱን ማለቱን ያሳያል።
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን ማዕረጋዊ ራስ-መጠሪያና ዳንኤላዊ ድምፁን የሚጠብቅ የተለመደ ቀጥተኛ ትርጉም ነው።
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: ለማየት … ነገር ግን አታዩትም
  rationale: ሁለቱንም የὁράω ቅርጾች በ‘ማየት’ ይተረጉማል። καί በዚህ አውድ ውጤታዊ ተቃርኖ ስላለው፣ ተፈጥሯዊ አማርኛው ‘ነገር ግን’ ነው፤ ‘-ት’ የሚለው ተውላጠ ቅጥያ የተናፈቀውን ቀን ይመለከታል።
theological_decisions:
- issue: ‘የሰው ልጅ ቀኖች’ የሚለው ሐረግ ትርጉም
  choice: የሰው ልጅ ጊዜን የሚያመለክትና የፍጻሜ ዘመን ክብደት ያለው ክፍት አገላለጽ ሆኖ ተጠብቋል።
  alternative: የኢየሱስ ምድራዊ አገልግሎት ቀኖች ብቻ፣ ወይም የወደፊቱ መገለጥና ፍርድ ቀን ብቻ ተብሎ ሊገደብ ይችላል።
  rationale: የግሪኩ ሐረግ ደቀ መዛሙርቱ የኢየሱስን መገኘት የሚናፍቁበትን ጊዜና፣ በአቅራቢያው አውድ የሚጠቀሰውን የሰው ልጅ የወደፊት መገለጥ ሊያስተጋባ ይችላል። ትርጉሙ ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሴማዊ ‘ቀኖች ይመጣሉ’ አገላለጽ በአማርኛ የተፈጥሮ አገባብ ‘ጊዜ ይመጣል’ ተብሎ ቀርቧል፤ ዋናው ‘የሰው ልጅ ቀኖች’ ሐረግ ግን ሥነ መለኮታዊ ክፍትነቱን እንዲጠብቅ ቃል በቃል ቀርቷል።
