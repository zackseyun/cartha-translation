  to: ከዚያም ደቀ መዛሙርቱን እንዲህ አላቸው፤ “የሰው ልጅ ቀኖች[a] አንዱን ለማየት የምትናፍቁባቸው ቀኖች ይመጣሉ፤ ነገር ግን አታዩትም።”
