  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: am
  text: በኖኅ ዘመን እንደ ሆነ፣ በሰው ልጅ[a] ዘመንም እንዲሁ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ሰብአዊው»። በተለምዶ «የሰው ልጅ» ተብሎ የሚተረጎመው የግሪክ ማዕረግ ከዳንኤል 7 ጋር የሚያስተጋባ ሊሆን ይችላል። የተለመደውን መሲሐዊና ፍጻሜን የሚመለከት ትርጉሙን ለመጠበቅ እዚህ እንዳለ ተውተናል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: እንደ
  rationale: የሁለት ዘመናትን ሁኔታ የሚያነጻጽረውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐγένετο
  choice: እንደ ሆነው
  rationale: በኖኅ ዘመን የተከናወነውን ሁኔታ ያመለክታል፤ በአማርኛም ከተከታዩ ንጽጽር ጋር ተፈጥሯዊ ነው።
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: በኖኅ ዘመን
  rationale: የግሪኩን ‘በኖኅ ቀኖች’ የሚለውን የጊዜ ፈሊጥ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὕτως
  choice: እንዲሁ
  rationale: የንጽጽሩን ሁለተኛ ክፍል በግልጽ ሁኔታ ያስገባል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የወደፊት ጊዜውን ትርጉም ሳይጨምር በቀጥታ ያስተላልፋል።
- source_word: καὶ
  choice: -ም
  rationale: በ‘ዘመንም’ ላይ ያለው -ም ንጽጽሩ ‘ደግሞ/እንዲሁ’ በሚል እንደሚዘረጋ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በወንጌላት የተመሠረተውን ማዕረግና ከዳንኤል 7 ጋር ሊኖረው የሚችለውን መሲሐዊና ፍጻሜያዊ ድምፅ ይጠብቃል።
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου የሚለውን ማዕረግ መተርጎም
  choice: የሰው ልጅ
  alternative: ሰብአዊው
  rationale: ‘የሰው ልጅ’ የሚለው ቃላዊ ቅርጽና በቅዱሳት መጻሕፍት ያለው የተመሠረተ ማዕረጋዊ ድምፅ ይጠበቃል፤ ‘ሰብአዊው’ ግን አገላለጹን ወደ አጠቃላይ ሰውነት ሊያጠብ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በ... ዘመን’ የሚለው ተፈጥሯዊ የጊዜ አገላለጽ ሲሆን፣ የንጽጽሩ ቅርጽ ‘እንደ... እንዲሁ’ ተጠብቋል።
