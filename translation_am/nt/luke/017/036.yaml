    text: ይህ ቁጥር ከጥንት የግሪክ የእጅ ጽሑፎች (ከእነዚህም የ4ኛው መቶ ዘመን ሲናይቲከስና ቫቲካነስ) እና ከጥንት የቅብጥ ትርጉሞች ውስጥ የለም። ነገር ግን በምዕራባዊው የጽሑፍ ወግ (ለምሳሌ በ5ኛው መቶ ዘመን ኮዴክስ ቤዛ)፣ በባይዛንታይን አብላጫ የጽሑፍ ወግ እና በላቲኑ ቩልጌት ውስጥ ይገኛል። ምናልባት ከማቴዎስ 24፥40 ጋር ለማስማማት በኋለኞቹ ጸሐፍት ተጨምሮ ሊሆን ይችላል።
