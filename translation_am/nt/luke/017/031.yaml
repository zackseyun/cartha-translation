  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: am
  text: በዚያ ቀን፣ በየቤት ጣራ[a] ላይ ያለ ሰው፣ ዕቃዎቹ በቤት ውስጥ ሲሆኑ፣ ሊወስዳቸው አይውረድ፤ እንዲሁም በእርሻ ያለው ወደ ኋላ አይመለስ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የቤት ጣራ” በዚያ ዘመን በቀላሉ ሊደረስበትና ለተለያዩ ተግባሮች ሊያገለግል የሚችል ጠፍጣፋ ጣራን ያመለክታል።
    reason: cultural_note
  - marker: b
    text: “ወደ ኋላ አይመለስ” የሚለው “ወደተተወው ነገር አይመለስ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያ ቀን
  rationale: የጊዜውን አመልካች አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ τοῦ δώματος
  choice: በቤት ጣራ ላይ
  rationale: δώμα በዚያ ባህላዊ አውድ ሊደረስበትና ሊጠቀሙበት የሚችል ጠፍጣፋ የቤት ጣራን ያመለክታል።
- source_word: τὰ σκεύη αὐτοῦ
  choice: ንብረቱ
  rationale: በአውዱ ውስጥ ያሉትን ዕቃዎችና ሊወሰዱ የሚችሉ ግላዊ ንብረቶች በግልጽና በተፈጥሯዊ ቃል ይገልጻል።
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: ሊወስደው አይውረድ
  rationale: የሦስተኛ መደብ ክልከላውን ጥንካሬና ንብረቱን ለማንሳት ወደ ቤት መውረድ የሚለውን ተግባራዊ ምስል ይጠብቃል።
- source_word: ὁ ἐν ἀγρῷ
  choice: በእርሻ ያለው ሰው
  rationale: በመስክ ወይም በእርሻ ሥፍራ ያለውን ተወካይ ሰው በግልጽ ያመለክታል፤ ‘እርሻ’ በዚህ አውድ ተፈጥሯዊ ነው።
- source_word: ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: እንዲሁም … ወደ ኋላ አይመለስ
  rationale: ὁμοίως ሁለተኛውን ክልከላ ከመጀመሪያው ጋር ያያይዛል፤ εἰς τὰ ὀπίσω የኋላውን አቅጣጫና ወደተተወው ነገር የመመለስ ፍንጭ ይይዛል።
theological_decisions:
- issue: የፍጻሜ ዘመን አስቸኳይነት ምስል
  choice: ከጣራ አለመውረድንና ወደ ኋላ አለመመለስን እንደ ቀጥተኛና ተግባራዊ ክልከላዎች ማቆየት
  alternative: ንብረትን አትውደዱ ወይም በንብረት አትጣበቁ ወደሚል አጠቃላይ ሥነ ምግባራዊ ማሳሰቢያ መተርጎም
  rationale: ግሪክኛው ከ‘ዚያ ቀን’ ጋር የተያያዘ ግልጽ የሽሽት ሁኔታ ይስላል፤ ምስሉን ማቆየት የጽሑፉን አስቸኳይነት ይጠብቃል እንጂ ከተባለው በላይ የሃይማኖት ትርጓሜ አያስገባም።
- issue: εἰς τὰ ὀπίσω የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘ወደ ኋላ’ ብሎ መተርጎም፣ ወደተተወው ነገር የመመለስ ፍንጭን በማስታወሻ ማቆየት
  alternative: ‘ወደ ኋላ ወዳሉት ነገሮች’ ብሎ ቃል በቃል መተርጎም
  rationale: የግሪክኛው ሐረግ በተፈጥሯዊ አማርኛ ‘ወደ ኋላ’ ተብሎ ይገለጻል፤ ነገር ግን በኋላ የቀረውን ነገር የሚያስታውስ ስሜት ፈጽሞ እንዳይጠፋ አማራጩ በማስታወሻ ተጠብቋል።
