  source_fidelity: The draft accurately preserves the two urgent prohibitions and the accessible-roof setting. However, τὰ σκεύη αὐτοῦ is plural and is better represented by “ዕቃዎቹ,” with a matching plural object pronoun. The conditional “ቢሆን” is also less exact than a contemporaneous construction for the Greek participial clause.
  naturalness: The proposed revision is natural modern standard Amharic. “...ሲሆኑ” expresses the accompanying circumstance without introducing an unnecessary condition. Placing each footnote marker immediately after its relevant expression improves readability and anchor precision.
  terminology: “የቤት ጣራ” appropriately communicates δῶμα in this cultural context. “ዕቃዎቹ” is preferable here to singular “ንብረቱ,” since the Greek explicitly uses plural σκεύη and refers to movable items. “ወደ ኋላ አይመለስ” naturally renders μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω while the note preserves the contextual nuance.
