    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንዲሁም እናንተ
  rationale: ይህ አገላለጽ ንግግሩን ከቀደመው ምሳሌ ጋር ያገናኛል፤ የοὕτως ንጽጽራዊ ኃይልና የκαί አካታች ትርጉም ይጠበቃሉ።
- source_word: ὅταν ποιήσητε
  choice: ካደረጋችሁ በኋላ
  rationale: ከመናገር ትእዛዙ በፊት ድርጊቱ መጠናቀቁን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: የታዘዛችሁትን ሁሉ
  rationale: διατάσσω ያለውን የሥልጣን ትእዛዝ ስሜት ይጠብቃል፤ ‘ሁሉ’ ደግሞ πάνταን ይወክላል።
- source_word: λέγετε
  choice: በሉ
  rationale: በዚህ የማስተማር አውድ የአሁን ጊዜውን ትእዛዝ በቀጥታና ተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: Δοῦλοι
  choice: ባሪያዎች
  rationale: በዙሪያው ባለው የጌታና የባሪያ ምሳሌ ውስጥ የታሰረው ማኅበራዊ ሁኔታ ጎልቶ ስለሚታይ፣ ‘ባሪያዎች’ ከ‘አገልጋዮች’ ይልቅ የቃሉን ኃይል ይጠብቃል።
- source_word: ἀχρεῖοί
  choice: የማንጠቅም
  rationale: የቃሉን ‘ጥቅም የሌለው/ትርፍ የማያስገኝ’ መሠረታዊ ስሜት ይጠብቃል፤ ዐውዱ ግን ከግዴታ በላይ ዋጋ ወይም ሽልማት የሚያስገባ ትርፍ እንዳልፈጠሩ ያመለክታል። የቃሉ ጥንካሬ በማስታወሻ ተብራርቷል።
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: ማድረግ የሚገባንን
  rationale: ὀφείλω የሚያመለክተውን የግዴታና የዕዳ ስሜት በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πεποιήκαμεν
  choice: አድርገናል
  rationale: የተጠናቀቀውንና አሁን ውጤት ያለውን ድርጊት በአማርኛ ፍጹም ጊዜ ይገልጻል።
theological_decisions:
- issue: በደቀ መዝሙርነት ምሳሌ ውስጥ δοῦλοιን መተርጎም
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: የቅርብ ዐውዱ የጌታና የባሪያ ግንኙነትን ይጠቀማል። ስለዚህ የቃሉን ጥገኝነትና የማዘዝ ግዴታ ሳያለዝብ ‘ባሪያዎች’ ተመርጧል።
- issue: የἀχρεῖοι ትርጉም
  choice: የማንጠቅም
  alternative: የማንረባ / ዋጋ የማይገባን
  rationale: የግሪኩ ቃል ‘ጥቅም የሌለው’ ወይም ‘ትርፍ የማያስገኝ’ ሊል ይችላል። ዐውዱ ደቀ መዛሙርቱ በመታዘዛቸው ጌታቸውን ዕዳ ውስጥ እንደማያስገቡ ያሳያል፤ የሰውነታቸውን ውስጣዊ ዋጋ እንደሌለ አድርጎ መወሰን አያስፈልግም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የጌታና የባሪያ ምሳሌያዊ ኃይል ተጠብቋል፤ ἀχρεῖοι ያለው የቃላትና የነገረ መለኮት ውጥረት ደግሞ በዋናው ጽሑፍና በማስታወሻው ሳይደበቅ ቀርቧል።
