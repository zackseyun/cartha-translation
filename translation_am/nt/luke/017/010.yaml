    text: ወይም “የማንረባ ባሪያዎች” ወይም “ትርፍ የማናስገኝ ባሪያዎች።” የግሪኩ ቅጽል ምንም ጥቅም የሌለውን ወይም ሽልማት ለመጠየቅ መብት የሌለውን ሊያመለክት ይችላል።
