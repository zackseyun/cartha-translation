  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አገልጋዩ”፤ የግሪክኛው ቃል δοῦλος ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: … ያመሰግነዋልን?
  rationale: ከአመልካች ግስ ጋር የመጣው μὴ መልሱ ‘አይደለም’ እንዲሆን የሚጠበቅ የንግግር ጥያቄ ያቀርባል። የአማርኛው የጥያቄ ቅርጽና ዐውዱ ይህን በተፈጥሮ ያሳያሉ።
- source_word: ἔχει χάριν
  choice: ያመሰግነዋል
  rationale: ἔχειν χάριν τινί በዚህ ዐውድ ‘ለአንድ ሰው ምስጋና ማቅረብ’ ማለት ነው፤ ‘ያመሰግነዋል’ አጭር፣ ግልጽና ተፈጥሯዊ ነው።
- source_word: δούλῳ
  choice: ባሪያው
  rationale: በምሳሌው ውስጥ ያለውን የጌታና በትእዛዝ ሥር ያለ ባሪያ ግንኙነት እና የግዴታ አገልግሎት ለማስጠበቅ ‘ባሪያ’ ተመርጧል።
- source_word: ὅτι
  choice: ስለ
  rationale: ὅτι ለሚገመተው ምስጋና ምክንያትን ያስገባል፤ በአማርኛ ‘ስለ…’ ይህን ግንኙነት በተፈጥሮ ይገልጣል።
- source_word: ἐποίησεν
  choice: አደረገ
  rationale: ግሱ የታዘዘውን መፈጸም ያመለክታል፤ ‘አደረገ’ ቀላልና በዐውዱ በቂ ግልጽ ነው።
- source_word: τὰ διαταχθέντα
  choice: የታዘዘውን
  rationale: መስተዋድዳዊው ፍጹም ተደራጊ አንቀጽ ‘የታዘዙትን ነገሮች’ የሚል ነው፤ ‘የታዘዘውን’ ተደራጊውን ትርጉም ጠብቆ ተፈጥሯዊ አማርኛ ይሰጣል።
theological_decisions:
