    text: ወይም “አገልጋዩ”፤ የግሪክኛው ቃል δοῦλος ነው።
    reason: lexical_alternative
  revision_rationale: The revision makes explicit the master who is implicit in the Greek verb and marks the slave with ለ- as the recipient of thanks, preserving τῷ δούλῳ. It retains the source's expected-negative rhetorical question, the causal force of ὅτι, and the passive sense of τὰ διαταχθέντα.
