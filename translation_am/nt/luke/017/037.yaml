  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: am
  text: እነርሱም መልሰው፣ “ጌታ ሆይ፣ የት?” አሉት። እርሱም፣ “አካሉ[a] ባለበት፣ በዚያ አሞራዎችም[b] ይሰበሰባሉ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አካል” የሚለው “በድን” ተብሎም ሊተረጎም ይችላል፤ ይህም የሥጋ በሊታ ወፎችን ምስል ይበልጥ ግልጽ ያደርገዋል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ንስሮች።” የግሪኩ ቃል ንስሮችን ሊያመለክት ይችላል፤ ነገር ግን ወፎቹ በአካል ዙሪያ የሚሰበሰቡበት ዐውድ “አሞራዎች” የሚለውን ትርጉም ይበልጥ የሚመጥን ያደርገዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: መልሰው
  rationale: የተሳታፊውን የመልስ ተግባር ይጠብቃል፤ በዘመናዊ አማርኛም ከ«አሉት» ጋር ተፈጥሯዊ ነው።
- source_word: λέγουσιν
  choice: አሉት
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በአማርኛ ትረካ ያለፈ ጊዜው የተፈጥሮ አገላለጽ ነው።
- source_word: Ποῦ
  choice: የት?
  rationale: የቦታ ጥያቄውን በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ የቀረበውን ቀጥተኛ የአክብሮት አድራሻ በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: Ὅπου
  choice: ባለበት
  rationale: ምሳሌያዊውን «ባለበት ቦታ» ግንኙነት ያለ ተጨማሪ ትርጓሜ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: σῶμα
  choice: አካሉ
  rationale: ዋናውን «አካል/ሰውነት» ትርጉም ይጠብቃል፤ ከአሞራዎች ምስል የተነሣ የሞተ አካል ሊሆን እንደሚችል በግርጌ ማስታወሻ ተጠቅሷል።
- source_word: ἀετοὶ
  choice: አሞራዎች
  rationale: በአካል ዙሪያ የሚሰበሰቡ የሥጋ በሊታ ወፎችን በዘመናዊ አማርኛ ግልጽ ያደርጋል፤ «ንስሮች» የሚለው የቃሉ ሌላ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐπισυναχθήσονται
  choice: ይሰበሰባሉ
  rationale: የወደፊት ጊዜውንና የመሰባሰብ ሐሳቡን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግሪኩን ተገብሮአዊ ቅርጽ በሚቻለው መጠን ያንጸባርቃል።
theological_decisions:
- issue: ስለ አካሉና ወፎቹ የተነገረው ምሳሌ የሚያመለክተው
  choice: ምስሉን በቀጥታ መተርጎምና የሚያመለክተውን ነገር አለመወሰን
  alternative: የመጨረሻ ፍርድ፣ የሮም ሠራዊት ወረራ፣ ወይም ፍርድና መጋለጥ የማይቀር መሆኑን የሚገልጥ አጠቃላይ ምሳሌ እንደሆነ በትርጉሙ ውስጥ መግለጽ
  rationale: የግሪክ ጽሑፉ የምስሉን ትክክለኛ ተጠቃሽ አይለይም። ስለዚህ ትርጉሙ የትርጓሜ ውጥረቱን ይጠብቃል እንጂ አንድን አተረጓጎም አያስገድድም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «መልሰው … አሉት» የግሪኩን አወቃቀር ሳያከብድ ያንጸባርቃል፤ ምሳሌያዊው አባባልም ያለ ትርጓሜያዊ ማብራሪያ ተጠብቋል።
