  source_fidelity: The draft correctly represents the future setting, the feminine plural referents, the ongoing act of grinding, and the contrast between one being taken and the other left. It appropriately avoids deciding the disputed theological force of ‘taken’ and ‘left.’ However, በአንድነት commonly suggests unity, unanimity, or coordinated action, rather than the spatial/associative sense of ἐπὶ τὸ αὐτό.
  naturalness: Replacing በአንድነት with አብረው is more idiomatic modern Amharic for two women carrying out the activity together, while retaining the source expression’s ambiguity through the footnote.
  terminology: The feminine forms ሴቶች, አንዲቱ, ሌላዋ, ትወሰዳለች, and ትቀራለች are accurate. ትቀራለች is a natural, non-interpretive rendering of ἀφεθήσεται in this contrast.
