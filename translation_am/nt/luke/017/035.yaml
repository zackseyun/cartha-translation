  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: am
  text: ሁለት ሴቶች አብረው[a] እየፈጩ ይሆናሉ፤ አንዲቱ ትወሰዳለች[b]፣ ሌላዋ ግን ትቀራለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአንድ ቦታ»። የግሪኩ አገላለጽ «አብረው» ወይም «በአንድ ቦታ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «ትወሰዳለች» የሚለው ቃል ብቻውን መወሰዷ ለድነት ወይም ለፍርድ መሆኑን አይገልጽም፤ ግሪኩ ይህን ለሰፊው አውድ ይተወዋል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο
  choice: ሁለት ሴቶች ... ይሆናሉ
  rationale: የወደፊት ጊዜውን ይጠብቃል፤ ἀλήθουσαι የሚለው የሴት ፆታ ብዙ ቁጥር ቅርጽ ስለሆነ፣ በአማርኛ «ሴቶች» በግልጽ ተጨምሯል።
- source_word: ἀλήθουσαι
  choice: እየፈጩ
  rationale: እህልን ወይም ዱቄትን የመፍጨት ተግባር ያመለክታል፤ «እህል» በግሪኩ በቀጥታ ስላልተጠቀሰ አልተጨመረም።
- source_word: ἐπὶ τὸ αὐτό
  choice: በአንድነት
  rationale: በዚህ ዐውድ «አብረው» ወይም «በአንድ ቦታ» የሚለውን ሊያመለክት የሚችል አገላለጽ ነው፤ «በአንድነት» ሁለቱንም ገጽታዎች በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παραλημφθήσεται
  choice: ትወሰዳለች
  rationale: የግሪኩን ተደራጊ የወደፊት ጊዜ በቀጥታ ይገልጣል፤ መወሰዷ ለድነት ወይም ለፍርድ መሆኑን አይወስንም።
- source_word: ἡ δὲ ἑτέρα ἀφεθήσεται
  choice: ሌላዋ ግን ትቀራለች
  rationale: δέ ያለውን ንጽጽር «ግን» ይጠብቃል፤ «ትቀራለች» ደግሞ ተጨማሪ የመተው ወይም የመጣል ፍቺ ሳያስገባ ἀφεθήσεταιን በተፈጥሯዊ አማርኛ ይተረጉማል።
theological_decisions:
- issue: «ትወሰዳለች» እና «ትቀራለች» ድነትን ወይም ፍርድን ያመለክቱ እንደሆነ
  choice: አንዲቱ ትወሰዳለች፣ ሌላዋ ግን ትቀራለች
  alternative: አንዲቱ ለፍርድ ትወሰዳለች ወይም አንዲቱ ለድነት ትወሰዳለች
  rationale: ጥቅሱ ራሱ መለያየቱን ብቻ ይናገራል፤ የመወሰድንና የመቅረትን መንፈሳዊ ውጤት በግልጽ አይወስንም። ስለዚህ ትርጉሙ ያለውን መለኮታዊ ውጥረት እንዳለ ይጠብቃል።
