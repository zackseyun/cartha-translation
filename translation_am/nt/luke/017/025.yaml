  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: am
  text: ነገር ግን፣ አስቀድሞ እርሱ ብዙ መከራ ሊቀበልና በዚህ ትውልድ ዘንድ ውድቅ ሊደረግ ይገባል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: ጊዜያዊ ቅድምናን በተፈጥሯዊ አማርኛ ያሳያል፤ ይህም መከራውና መናቁ ቀደም ብለው መፈጸም እንዳለባቸው ይጠብቃል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን መጠነኛ ተቃርኖና ሽግግር በግልጽ አማርኛ ያሳያል።
- source_word: δεῖ
  choice: ይገባል
  rationale: በሉቃስ ዘንድ ብዙ ጊዜ የሚታየውን ግዴታዊ አስፈላጊነት ይጠብቃል፤ የዚያን አስፈላጊነት ምንጭ ግን በትርጉሙ ውስጥ አይጨምርም።
- source_word: αὐτὸν
  choice: እርሱ
  rationale: የግሪኩ የወሰን የሌለው ግስ ርዕሰ ጉዳይ በአማርኛ ተፈጥሯዊ ዓረፍተ ነገር ውስጥ እንደ ባለቤት ቀርቧል።
- source_word: πολλὰ παθεῖν
  choice: ብዙ መከራ ሊቀበል
  rationale: πολλά የመከራውን ስፋትና ብዛት ያሳያል፤ «መከራ መቀበል» የπάσχωን ከባድነት በዘመናዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: ἀποδοκιμασθῆναι
  choice: ሊናቅ
  rationale: ግሱ ከግምገማ በኋላ እንደማይገባ ተቆጥሮ መጣልን ያመለክታል፤ «መናቅ» በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና አጭር አቻ ነው።
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: በዚህ ትውልድ
  rationale: ከተደራጊ ግስ ጋር ἀπό ድርጊቱን የሚፈጽመውን ወገን ያመለክታል፤ «በዚህ ትውልድ» የዘመኑን ሰዎች ማመልከቱን ይጠብቃል።
theological_decisions:
- issue: በየሰው ልጅ መከራ ውስጥ የδεῖ ኃይል
  choice: «ይገባል» ተብሎ ግዴታዊ አስፈላጊነቱ ተጠብቋል።
  alternative: «አስፈላጊ ነው» ወይም ይህ በግልጽ የእግዚአብሔር ዕቅድ ፍጻሜ እንደሆነ መጨመር።
  rationale: ቃሉ መለኮታዊ ዓላማን ሊያመለክት ቢችልም፣ ጥቅሱ የአስፈላጊነቱን ምንጭ በግልጽ አይናገርም። ስለዚህ «ይገባል» የሥነ መለኮት ክብደቱን ሳያጠፋ ውጥረቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «እርሱ» በአውዱ የሰውን ልጅ ያመለክታል፤ ጥቅሱ ራሱ ስያሜውን ስለማይደግም በትርጉሙም አልተጨመረም።
