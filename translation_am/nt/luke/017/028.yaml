- source_word: ἠγόραζον, ἐπώλουν
  choice: ይገዙ፣ ይሸጡ ... ነበር
  rationale: መደበኛውን የገበያ እንቅስቃሴ በቀላልና ተፈጥሯዊ ቃላት ይገልጻል።
- source_word: ἐφύτευον, ᾠκοδόμουν
  choice: ይተክሉና ይገነቡ ነበር
