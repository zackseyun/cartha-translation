- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: በሎጥ ዘመን
  rationale: ከሎጥ ጋር የተያያዘውን ጊዜ በዘመናዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ἤσθιον, ἔπινον
  choice: ይበሉ፣ ይጠጡ ... ነበር
