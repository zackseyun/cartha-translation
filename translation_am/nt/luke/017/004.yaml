base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: am
  text: በአንድ ቀን ሰባት ጊዜ ቢበድልህ፣ ሰባት ጊዜም ወደ አንተ ተመልሶ፣ “ንስሐ ገብቻለሁ” ቢልህ፣ ይቅር ትለዋለህ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ይቅር ትለዋለህ” የሚለው የግሪክኛ አገላለጽ በቅርጹ የወደፊት ጊዜ ቢሆንም፣ እዚህ “ይቅር ልትለው ይገባል” የሚል የትእዛዝ ኃይል አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις
  choice: ሰባት ጊዜ
  rationale: የድርጊቱን ተደጋጋሚነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῆς ἡμέρας
  choice: በአንድ ቀን
  rationale: የግሪክኛውን በተወሰነ ጊዜ ውስጥ መፈጸም የሚያመለክተውን የጊዜ ሐረግ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: ቢበድልህ
  rationale: በአድራሻው ላይ የተፈጸመ ኃጢአትን ወይም በደልን በአጭርና ተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: ወደ አንተ ተመልሶ
  rationale: ግሱ በዚህ አውድ ወደ ሰውየው መመለስን ወይም ዞሮ መቅረብን ሊያመለክት ይችላል፤ ይህ ምርጫ የመመለስን ገጽታ ይጠብቃል።
- source_word: Μετανοῶ
  choice: ንስሐ ገብቻለሁ
  rationale: ከቀላል የይቅርታ ጥያቄ ወይም የሐዘን ስሜት ይልቅ የμετανοέωን ሥነ ምግባራዊና መንፈሳዊ ክብደት ያቆያል።
- source_word: ἀφήσεις αὐτῷ
  choice: ይቅር ትለዋለህ
  rationale: የግሪክኛውን የወደፊት ጊዜ ቅርጽ ይጠብቃል፤ በዚህ የትምህርት አውድ ግን የትእዛዝና የግዴታ ኃይል አለው።
theological_decisions:
- issue: የἀφήσεις የወደፊት ጊዜ ቅርጽ ኃይል
  choice: “ይቅር ትለዋለህ” ተብሎ በመመሪያ ኃይል ተተርጉሟል
  alternative: “ይቅር በለው” ወይም “ይቅር ልትለው ይገባል”
  rationale: ቅርጹ የወደፊት ጊዜ ቢሆንም፣ አውዱ ትእዛዝን ያሳያል። ዋናው ትርጉም ቅርጹንም ሆነ የሥነ ምግባር ግዴታውን ይጠብቃል።
- issue: የΜετανοῶ ትርጉም
  choice: “ንስሐ ገብቻለሁ”
  alternative: “አዝኛለሁ” ወይም “ሐሳቤን ቀይሬአለሁ”
  rationale: ጽሑፉ ከመጸጸት ወይም ከይቅርታ ጥያቄ በላይ ንስሐን ይገልጣል፤ የቃሉን ሥነ ምግባራዊና መንፈሳዊ ክብደት አያለዝብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው የሁኔታ ተከታታይነት በ“ቢበድልህ … ተመልሶ … ቢልህ” ተጠብቋል።
