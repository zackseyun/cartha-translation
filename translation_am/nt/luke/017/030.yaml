- source_word: ᾗ ἡμέρᾳ
  choice: በሚገለጥበት ቀን
  rationale: የድርጊቱን ጊዜ «በ…ቀን» በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በወንጌላት የተመሠረተውን የኢየሱስ መጠሪያ ይጠብቃል፤ ከዳንኤል 7 ጋር ያለውን መሲሓዊና ፍጻሜያዊ ግንኙነትም አያዳክምም።
- source_word: ἀποκαλύπτεται
  choice: በሚገለጥበት
