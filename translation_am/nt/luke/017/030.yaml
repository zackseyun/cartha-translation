theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου የሚለውን ፍጻሜያዊ መጠሪያ መተርጎም
  choice: የሰው ልጅ
  alternative: ሰብአዊው
  rationale: የተለመደው ትርጉም መጠሪያውን እንደ መጠሪያ ያስቀራል፣ በወንጌላት ያለውን ቀጣይነትና ከዳንኤል 7 ጋር ያለውን ግንኙነት ይጠብቃል።
- issue: በዚህ አውድ የἀποκαλύπτεται ኃይል
  choice: በሚገለጥበት
  alternative: በሚመጣበት
  rationale: ግሱ በቀጥታ መገለጥን ወይም መጋለጥን ያመለክታል። አውዱ ከመምጣቱ ጋር ቢያያዝም፣ «ይመጣል» ማለት የተለየ የቃል ሐሳብ ያስገባል።
