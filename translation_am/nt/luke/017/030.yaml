lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: እንዲሁ
  rationale: ይህ የግሪክኛ ፈሊጥ ከቀደሙት የኖኅና የሎጥ ዘመን ምሳሌዎች ጋር ንጽጽር ያደርጋል። «እንዲሁ» ይህን ወደ ኋላ የሚያመለክተውን የንጽጽር ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔσται
