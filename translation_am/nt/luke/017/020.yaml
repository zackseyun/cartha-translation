lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: ፈሪሳውያን ... በጠየቁት ጊዜ
  rationale: የግሪኩን ተደራጊ አገባብ በተፈጥሯዊ የአማርኛ ንቁ አገባብ ያቀርባል፤ የጥያቄውን አድራጊዎችና የጊዜ ግንኙነቱን ይጠብቃል። δέ የሚያመለክተው ለስላሳ የንግግር ሽግግር በአማርኛው የዓረፍተ ነገር ቅደም ተከተል ተሸክሟል።
- source_word: πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት መቼ እንደምትመጣ
  rationale: ቀጥተኛውን የጊዜ ጥያቄ በተፈጥሯዊ ተዘዋዋሪ ንግግር ያቀርባል፤ የአሁን ጊዜው ግስ ያለውን የወደፊት መምጣት አቅጣጫ አያጠፋም።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: በአማርኛ የአዲስ ኪዳን አጠቃቀም የታወቀና የግሪኩን ሐረግ በግልጽነት የሚያስተላልፍ ትርጉም ነው።
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: እርሱም መልሶ እንዲህ አላቸው
  rationale: ሁለቱንም የመመለስና የመናገር ክፍሎች በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: Οὐκ ἔρχεται
  choice: አትመጣም
  rationale: ስለ መንግሥቱ የመምጣት ሁኔታ የሚናገረውን አጠቃላይ የአሁን ጊዜ አሉታዊ አነጋገር ይጠብቃል።
- source_word: μετὰ παρατηρήσεως
  choice: በሚታዩ ምልክቶች
  rationale: παρατήρησις የመመልከት፣ በጥንቃቄ የመከታተል ወይም በውጫዊ ሁኔታ የሚታወቅ መሆንን ሊያመለክት የሚችለውን ትርጉም በዐውዱ ግልጽ ያደርጋል፤ አማራጮቹ በማስታወሻው ተጠብቀዋል።
theological_decisions:
- issue: የመንግሥቱ መምጣት እንዴት እንደማይሆን የሚገልጸው አሉታዊ ንግግር
  choice: ኢየሱስ መንግሥቱ ሰዎች በውጫዊ ምልክቶች ሊከታተሉትና ሊለዩት በሚችሉበት ሁኔታ እንደማይመጣ ይናገራል።
  alternative: ንግግሩ ማንኛውንም የሰው ምልከታ ወይም ሁሉንም የፍጻሜ ዘመን ምልክቶች ፈጽሞ ይክዳል።
  rationale: ይህ አቀራረብ μετὰ παρατηρήσεως የሚለውን በቅርብ ይከተላል፤ ጥቅሱ ከሚለው በላይ ሰፊ የፍጻሜ ዘመን ዶክትሪን አይጭንም፣ ያለውንም የትርጉም ውጥረት ይጠብቃል።
