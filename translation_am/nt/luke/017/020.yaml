  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። በግሪክ ተደራጊ የሆነው መግቢያ በአማርኛ የተፈጥሮ አገባብ ሲቀርብ ትርጉሙ ተጠብቋል።
