  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: am
  text: በእግሩ ሥር ፊቱን ወደ መሬት አድርጎ ወድቆ እያመሰገነው ነበር። እርሱም ሳምራዊ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: በግንባሩ ተደፍቶ
  rationale: የመውደቁንና ፊትን ወደ መሬት አድርጎ የመስገዱን አኳኋን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ ግስና አኳኋን በአንድነት ይጠበቃሉ።
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: በእግሩ አጠገብ
  rationale: παρά ያለውን የቅርበት ሐሳብ ይጠብቃል፤ በዚህ የክብር አውድ ውስጥ በእግሩ ሥር ተደፍቶ መቅረቡን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐχαριστῶν αὐτῷ
  choice: አመሰገነው
  rationale: ለእርሱ ምስጋና መስጠቱን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል፤ በግሪክኛው ያለው አብሮ የተከናወነ ድርጊት በአማርኛ የተከታታይ ግሶች አወቃቀር ተላልፏል።
- source_word: Σαμαρίτης
  choice: ሳምራዊ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊና አጠቃላይ አጠቃቀም የታወቀውን የሕዝብና የማኅበረሰብ መለያ ይጠብቃል።
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: እርሱም ሳምራዊ ነበር
  rationale: ግልጽ ተውላጠ ስሙ የሚሰጠውን አጽንዖት በ«እርሱም» ይጠብቃል፤ የሰውየውን ማንነት ያለ ትርጓሜያዊ ጭማሪ ያቀርባል።
theological_decisions:
- issue: የተፈወሰው ሰው ሳምራዊ መሆኑ ያለው ትረካዊና ማኅበራዊ አጽንዖት
  choice: «እርሱም ሳምራዊ ነበር» በማለት ቀላሉን መግለጫ ማቆየት
  alternative: «ይህ ሰው ግን ሳምራዊ ነበር» ብሎ ንፅፅሩን በመጨመር መግለጽ
  rationale: የግሪክኛው ጽሑፍ አስገራሚውን ማንነት በተረጋጋ አገላለጽ ይገልጣል። ትርጉሙም የውጭ ወገን ተብሎ የሚታየው ሰው አመስጋኝ መሆኑን የሚፈጥረውን ውጥረት ያለ ትርጓሜያዊ ጭማሪ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በግንባሩ ተደፍቶ» የአካል አኳኋኑን በግልጽ ያሳያል፤ የሳምራዊነቱ መግለጫ ግን ሆን ተብሎ አጭርና ያልተብራራ ሆኖ ተቀምጧል።
