review_pass:
  verdict: revise
  source_fidelity: The draft communicates the man’s gratitude and Samaritan identity, but «በግንባሩ ተደፍቶ» narrows πρόσωπον (“face”) to “forehead” and does not explicitly retain ἔπεσεν (“fell”). «በእግሩ አጠገብ» is possible in isolation, but “at his feet” is the contextually appropriate sense of παρά here.
  naturalness: The revised wording is clear, modern standard Amharic and naturally depicts prostration before someone’s feet.
  terminology: «ሳምራዊ» is an established and appropriate Amharic designation for Σαμαρίτης. The explicit «እርሱም» suitably reflects the narrative emphasis of αὐτός without adding interpretation.
  issues:
  - severity: medium
    issue: The posture is rendered as «በግንባሩ ተደፍቶ».
    rationale: πρόσωπον means “face,” not specifically “forehead,” and the wording leaves the aorist verb ἔπεσεν (“fell”) implicit rather than expressed.
  - severity: low
    issue: «በእግሩ አጠገብ» understates the reverential idiom.
    rationale: In this context, παρὰ τοὺς πόδας αὐτοῦ is best rendered idiomatically as “at his feet,” for which «በእግሩ ሥር» is the natural Amharic expression.
  revised_text: በእግሩ ሥር ፊቱን ወደ መሬት አድርጎ ወድቆ እያመሰገነው ነበር። እርሱም ሳምራዊ ነበር።
  revised_footnotes: []
  revision_rationale: The revision explicitly represents both “fell” and the face-down posture while using the natural reverential expression “at his feet.” The participial gratitude is represented as accompanying action, and the understated emphasis on the man’s Samaritan identity is retained.
