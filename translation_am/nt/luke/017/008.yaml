base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: am
  text: ከዚህ ይልቅ፣ ‘የራት ምግቤን አዘጋጅ፤ ታጥቀህም[a] እስክበላና እስክጠጣ ድረስ[b] አገልግለኝ፤ ከዚያ በኋላ አንተ ትበላለህ፣ ትጠጣለህ’ አይለውምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል ‘ወገብህን ታጥቀህ’፤ ይህም ለሥራ ሲዘጋጁ ረጅም ልብሳቸውን ሰብስበው በወገባቸው ማሰራቸውን ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ቃል በቃል፣ ‘እስክበላና እስክጠጣ ድረስ።’ በአውዱ ውስጥ ይህ የጊዜ አገላለጽ ሌላው ሰው ከመብላቱና ከመጠጣቱ በፊት ተናጋሪው እንደሚበላና እንደሚጠጣ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: ከዚህ ይልቅ፣ ... አይለውምን?
  rationale: ἀλλά ከቀደመው ጥያቄ ጋር ንፅፅርን ያሳያል፤ οὐχί ደግሞ አዎንታዊ መልስ የሚጠብቅ የአሉታዊ ጥያቄ ቅርጽ ነው።
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: የራት ምግቤን አዘጋጅ
  rationale: τί δειπνήσω ቃል በቃል ‘ለራት የምበላውን’ የሚል ሲሆን፣ ይህ አተረጓጎም የምሽት ምግብ አውዱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: περιζωσάμενος
  choice: ታጥቀህ
  rationale: ልብስን ለሥራ እንዳያደናቅፍ በወገብ ማሰርን የሚያመለክተውን ጥንታዊ ምስል በአጭርና ተፈጥሯዊ ቃል ይጠብቃል።
- source_word: διακόνει μοι
  choice: አገልግለኝ
  rationale: በዚህ አውድ በማዕድ ላይ ማገልገልን ያመለክታል፤ ምግብና መጠጥ መጠቀሳቸው ትርጉሙን ግልጽ ያደርገዋል።
- source_word: ἕως φάγω καὶ πίω
  choice: እኔ በልቼና ጠጥቼ እስክጨርስ ድረስ
  rationale: ከἕως ጋር ያሉት የአኦሪስት ሳብጃንክቲቭ ግሶች አገልጋዩ ከመብላቱ በፊት የጌታው መብላትና መጠጣት እንደሚጠናቀቅ ያሳያሉ።
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: ከዚያ በኋላ አንተ ትበላለህ፣ ትጠጣለህ
  rationale: የድርጊቶቹን ቅደም ተከተል ይጠብቃል፤ ግልጹ σύ በ‘አንተ’ ተተርጉሞ በሁለተኛው ሰው ላይ ያለውን አጽንዖት ያሳያል።
theological_decisions:
- issue: በምሳሌው ውስጥ የማኅበራዊ ሚና ስያሜ
  choice: በዚህ ቁጥር ውስጥ ያሉትን ተውላጠ ስሞችና ትእዛዞች ብቻ በቀጥታ መተርጎም፣ ‘አገልጋይ’ ወይም ‘ባሪያ’ የሚል ስም አለመጨመር
  alternative: ከአውዱ የታወቀውን δοῦλος በማብራሪያነት ‘አገልጋዩ’ ወይም ‘ባሪያው’ ብሎ መጨመር
  rationale: በአቅራቢያው አውድ δοῦλος ቢኖርም፣ ይህ ቁጥር ተውላጠ ስምና ቀጥተኛ ንግግር ብቻ ይጠቀማል። ስለዚህ ጽሑፉ ያልጠቀሰውን ስያሜ ሳይጨምር የጌታና የአገልጋይ ግንኙነትን በትእዛዞቹ ይገልጻል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ታጥቀህ’ የምንጩን ባህላዊ ምስል ሲጠብቅ የግርጌ ማስታወሻው ያብራራዋል።
