  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: am
  text: እርሱም፣ “ተነሥተህ ሂድ፤ እምነትህ[b] አድኖሃል[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ፈውሶሃል” ወይም “ደኅና አድርጎሃል።” የግሪኩ ግስ ማዳንን፣ መፈወስን ወይም ከአደጋ ማውጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “መታመን።” የግሪኩ ቃል እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል፤ እዚህ ግን “እምነት” ዋናው ትርጉም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: የግሪኩን ግስና ተውላጠ ስም በተፈጥሯዊ የአማርኛ ትረካ አገላለጽ ያስተላልፋል።
- source_word: Ἀναστὰς
  choice: ተነሥተህ
  rationale: ከሚከተለው ትእዛዝ ጋር የተያያዘውን የተነሣ እንቅስቃሴ አጭርና ክብር ባለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: πορεύου
  choice: ሂድ
  rationale: ቀጥተኛውን ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πίστις
  choice: እምነት
  rationale: በዚህ አውድ የሰውየውን በኢየሱስ ላይ ያደረገውን መታመን ያመለክታል፤ ቃሉ ታማኝነትንም ሊያመለክት ቢችልም፣ እዚህ “እምነት” ተገቢውና ያልተጫነ አቻ ነው።
- source_word: σέσωκέν σε
  choice: አድኖሃል
  rationale: የግሪኩን ፍጹም ጊዜ ቀጣይ ውጤት ይጠብቃል፤ ደግሞም ማዳንን፣ መፈወስንና ከአደጋ ማውጣትን ሊያካትት የሚችለውን ሰፊ ትርጉም አያጠብም።
theological_decisions:
- issue: በፈውስ አውድ ውስጥ σέσωκέν σε የሚለው ትርጉም
  choice: አድኖሃል
  alternative: አድኖሃል የሚለው እዚህ “ፈውሶሃል” ወይም “ደኅና አድርጎሃል” ማለትም ሊሆን ይችላል።
  rationale: አሥሩም ከበሽታቸው ከነጹ በኋላ ይህ አንዱ ተመልሶ እግዚአብሔርን ማክበሩ ንግግሩ ከሥጋዊ ፈውስ የሰፋ ትርጉም ሊኖረው እንደሚችል ያሳያል። “አድኖሃል” ይህን የሥነ መለኮት ውጥረትና የቃሉን ትርጉማዊ ስፋት ይጠብቃል።
- issue: πίστις የሚለው ቃል በዚህ አውድ
  choice: እምነት
  alternative: መታመን
  rationale: “እምነት” መደበኛና ተፈጥሯዊ ትርጉም ሲሆን፣ በዚህ አውድ “መታመን” የሚለውን ሐሳብም ይዟል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ጥቅም ላይ ውሏል። “ተነሥተህ ሂድ” የግሪኩን አጭር የትእዛዝ ኃይል ይጠብቃል። በቀረበው የእንግሊዝኛ ጽሑፍ የግርጌ ማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ጋር አልተዛመዱም፤ በዚህ ረቂቅ [a] ከ“አድኖሃል”፣ [b] ከ“እምነትህ” ጋር ተቀምጠዋል።
