- issue: የδι’ οὗ ነጠላ ግለሰባዊ ማጣቀሻ
  choice: “በእርሱ በኩል ... ሰው” ተብሎ ተተርጉሟል።
  alternative: “በዚያ ሰው በኩል”
  rationale: የግሪኩን ነጠላና ግለሰባዊ ኃላፊነት ይጠብቃል፤ በቡድን ላይ ብቻ አያሰፋውም።
