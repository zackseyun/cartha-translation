  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: am
  text: ከዚያም ደቀ መዛሙርቱን እንዲህ አላቸው፤ “ማሰናከያዎች[a] አለመምጣታቸው የማይቻል ነው፤ ነገር ግን ማሰናከያዎቹ በሚመጡበት ሰው ወዮለት!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ሰዎችን ወደ ኃጢአት የሚመሩ ነገሮች፣” “በደሎች፣” ወይም “የኃጢአት ፈተናዎች።” የግሪኩ σκάνδαλα የሚለው ቃል ሰዎችን በሥነ ምግባር ወይም በመንፈሳዊ ሕይወት የሚያሰናክሉ ነገሮችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: ከዚያም ... አላቸው
  rationale: δέ ቀላል የትረካ ማያያዣ ነው፤ “ከዚያም” የትረካውን ፍሰት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ደቀ መዛሙርቱን
  rationale: የαὐτοῦን ባለቤትነት የአማርኛው “-ቱ” ይወክላል፤ “ደቀ መዛሙርት” ለμαθηταί የተለመደና የተከበረ አገላለጽ ነው።
- source_word: Ἀνένδεκτόν ἐστιν
  choice: የማይቻል ነው
  rationale: የግሪኩን የአለመቻል አገላለጽ በቀጥታ ያቆያል፤ ቀጣዩ ሐረግ የማሰናከያዎች አለመምጣት የማይቻል መሆኑን ያብራራል።
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: ማሰናከያዎች አለመምጣታቸው
  rationale: የμή ክልከላንና የማይቻለው ነገር ማሰናከያዎቹ አለመምጣታቸው መሆኑን ግልጽ ያደርጋል።
- source_word: σκάνδαλα
  choice: ማሰናከያዎች
  rationale: የመሰናከል ምስላዊ አገላለጽን ይጠብቃል፤ ትርጉሙን በግል ቅሬታ ብቻ ሳይገድብ ወደ ኃጢአት ወይም ውድቀት የሚመራን ነገር ያካትታል።
- source_word: πλὴν οὐαὶ
  choice: ነገር ግን ... ወዮለት
  rationale: πλήν ከማይቀረው መምጣት ወደ ግለሰቡ ኃላፊነትና ፍርድ የሚደረገውን ለውጥ ያሳያል፤ “ወዮለት” የοὐαίን ከባድ ማስጠንቀቂያ ይጠብቃል።
- source_word: δι’ οὗ ἔρχεται
  choice: በእርሱ በኩል ለሚመጡት ሰው
  rationale: “በ...በኩል” የδιάን መካከለኛ ወኪልነት ይጠብቃል፤ ነጠላውን የግለሰብ ማጣቀሻም “ሰው” በማለት ይወክላል።
theological_decisions:
- issue: በሥነ ምግባራዊ ትምህርቱ ውስጥ የσκάνδαλα ትርጉም
  choice: በዋናው ጽሑፍ “ማሰናከያዎች” ተብሎ ተተርጉሟል።
