  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: am
  text: ምክንያቱም መብረቅ ከሰማይ በታች ካለው አንድ ስፍራ እስከ ሰማይ በታች እስካለው ሌላ ስፍራ ድረስ ብልጭ እያለ እንደሚያበራ፣[a] የሰው ልጅም በእርሱ ቀን[b] እንዲሁ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ተፈጥሯዊ በሆነ አገላለጽ፣ «ከሰማይ አንዱ ጫፍ እስከ ሌላው ጫፍ ድረስ»። ግሪክኛው ቃል በቃል «ከሰማይ በታች» የሚለውን ሐረግ በሁለቱም ጎኖች ይደግማል።
    reason: lexical_alternative
