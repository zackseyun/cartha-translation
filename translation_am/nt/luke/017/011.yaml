  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: am
  text: እንዲህም ሆነ፤ ወደ ኢየሩሳሌም እየሄደ ሳለ፣ በሰማርያና በገሊላ መካከል[a] ያልፍ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰማርያና በገሊላ መካከለኛ አካባቢ ያልፍ ነበር።” የግሪኩ አገላለጽ በሁለቱ ክልሎች መካከል መጓዝን ወይም በሚለያቸው የድንበር አካባቢ ማለፍን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: በአማርኛ በተናጠል አልተተረጎመም
  rationale: ይህ የሉቃስ የትረካ መግቢያ አገላለጽ ነው፤ “እንዲህም ሆነ” ብሎ መተርጎም የግሪኩን ቅርጽ ቢያንጸባርቅም በዘመናዊ አማርኛ ከባድና አላስፈላጊ ይሆናል። የክስተቱ መግቢያ ተግባር በሙሉ ዓረፍተ ነገሩ ተጠብቋል።
- source_word: ἐν τῷ πορεύεσθαι
  choice: እየሄደ ሳለ
  rationale: የአርቲክል ያለው መድረሻ ግስ ከἐν ጋር የአብሮነት ጊዜንና የቀጣይ ጉዞን ያሳያል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: εἰς Ἰερουσαλήμ
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς ወደ መድረሻ የሚደረግን እንቅስቃሴ ያመለክታል፤ “ወደ” አቅጣጫንና መድረሻን በግልጽ ያስተላልፋል።
- source_word: αὐτός
  choice: በግስ ውስጥ የተገለጠ ሦስተኛ መደብ ወንድ ነጠላ ባለቤት
  rationale: በአማርኛ ባለቤቱ በግሱ ቅርጽ ይታወቃል፤ “እርሱ” ማለት በዚህ ስፍራ ያልተፈለገ አጽንዖት ይጨምራል።
- source_word: διήρχετο
  choice: አልፎ ይሄድ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በጉዞ ላይ ያለ ቀጣይ እንቅስቃሴን ያሳያል፤ “ይሄድ ነበር” ይህን አኳኋን ይጠብቃል፣ “አልፎ”ም διέρχομαι ያለውን የማለፍ ሐሳብ ይይዛል።
- source_word: διὰ μέσον
  choice: በ…መካከል
  rationale: ከሁለቱ ክልሎች ጋር ያለው አገላለጽ በመካከላቸው ወይም በድንበር አካባቢያቸው የሚደረግን ጉዞ ሊያመለክት ይችላል፤ ሌላው ንባብ በማስታወሻው ተጠብቋል።
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: ሰማርያና ገሊላ
  rationale: የቦታ ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርበዋል፤ የግሪኩም ቅደም ተከተል ተጠብቋል።
