  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: am
  text: “‘እነሆ፣ እዚህ ነው!’ ወይም ‘እዚያ ነው!’ አይሉም፤ እነሆ፣ የእግዚአብሔር መንግሥት በመካከላችሁ[a] ነውና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በውስጣችሁ ነው።” የግሪኩ ሐረግ “በውስጣችሁ” ወይም “በመካከላችሁ” ማለት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: አይሉም
  rationale: የወደፊት ጊዜውን ክልከላ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ከቀደመው ንግግር ጋር ያለው ቀጣይ አሉታዊ ግንኙነት በዐውዱ ይገለጣል።
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘እነሆ፣ እዚህ ነው!’ ወይም ‘እዚያ ነው!’
  rationale: የቦታ አመልካቾቹን ተመጣጣኝነት ይጠብቃል፤ በመጀመሪያው ሐረግ Ἰδοὺን ‘እነሆ’ በማለት ይወክላል።
- source_word: γὰρ
  choice: ነውና
  rationale: የሚከተለው ንግግር ለቀደመው ክልከላ ምክንያት መሆኑን በተፈጥሯዊ የአማርኛ አያያዝ ያሳያል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረት የሚስበውን ቃል በክቡርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: ንጉሣዊ ሥልጣንንም ሆነ መንግሥታዊ ክልልን ሳይገድብ የግሪኩን የተለመደ ሐረግ ግልጽ አድርጎ ያቀርባል።
- source_word: ἐντὸς ὑμῶν
  choice: በመካከላችሁ
  rationale: ὑμῶν ብዙ ቁጥር ስለሆነና ንግግሩ ለቡድን ስለተነገረ፣ በዚህ ዐውድ ‘በመካከላችሁ’ የሚለው የጋራ/የመገኘት ትርጉም ተመራጭ ነው፤ ‘በውስጣችሁ’ የሚለው እውነተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐστιν
  choice: ነው
  rationale: ቀላሉን የአሁን ጊዜ መኖር በቀጥታ ይገልጣል።
theological_decisions:
- issue: የἐντὸς ὑμῶν ትርጉም
  choice: የእግዚአብሔር መንግሥት በመካከላችሁ ነው
  alternative: የእግዚአብሔር መንግሥት በውስጣችሁ ነው
  rationale: ሐረጉ የውስጣዊነትንም ሆነ በሕዝቡ መካከል የመገኘትን ሐሳብ ሊያመለክት ይችላል። ኢየሱስ ለብዙ ሰዎች መናገሩና ዐውዱ በሚታይ ቦታ ላይ ስለመጠቆም መሆኑ ‘በመካከላችሁ’ን ለዋናው ጽሑፍ ይደግፋል፤ ሆኖም ሌላው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነሆ’ የሚለው ቃል የἰδοὺን የትኩረት ኃይል ለመጠበቅ ተመርጧል።
