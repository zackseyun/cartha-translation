  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: am
  text: ሰዎችም፣ “እነሆ፣ እዚያ!” ወይም “እነሆ፣ እዚህ!” ይሏችኋል። አትሂዱ፤ እንዲሁም አትከተሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አትሂዱ፤ እነርሱንም አትከተሉ።” በግሪክኛው ጽሑፍ “አትከተሉ” የሚለው ግስ ተሳቢ በግልጽ አልተጠቀሰለትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: ይሏችኋል
  rationale: የወደፊት ጊዜውንና ቀጥተኛ ንግግርን የሚያስገባውን የλέγω ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἰδοὺ
  choice: እዩ
  rationale: ትኩረትን ወደተጠቀሰው ቦታ የሚስብ ቀጥተኛና ዘመናዊ የብዙ ቁጥር ትእዛዝ ነው።
- source_word: ἐκεῖ / ὧδε
  choice: እዚያ / እዚህ
  rationale: በሩቅና በቅርብ ቦታ መካከል ያለውን አጭር ንጽጽር ይጠብቃል።
- source_word: μὴ ἀπέλθητε
  choice: አትሂዱ
  rationale: ἀπέρχομαι እዚህ ከተነገረው የቦታ ጥቆማ የተነሣ ወደዚያ መሄድን ይከለክላል፤ አማርኛው ተጨማሪ ቦታ ሳያስገባ እገዳውን በተፈጥሯዊነት ይገልጣል።
- source_word: μηδὲ διώξητε
  choice: አትከተሉም
  rationale: διώκω በዚህ አውድ መከተልን ወይም አሳድዶ መሄድን ያመለክታል። ተሳቢውን ሳይጨምር የግሪክኛውን ክፍትነት ይጠብቃል።
theological_decisions:
- issue: የδιώξητε ተሳቢ በግልጽ መጠቀስ ወይም አለመጠቀስ
  choice: በዋናው ጽሑፍ ተሳቢውን ሳይጨምር “አትከተሉም” ማለት
  alternative: “እነርሱን ተከትላችሁ አትሂዱ”
  rationale: የግሪክኛው ግስ ተሳቢውን አይገልጽም። አማርኛም ተሳቢው ሳይነገር ሊገባ ስለሚችል፣ ዋናው ጽሑፍ ይህን እውነተኛ ክፍትነት ጠብቆ አማራጩን በማስታወሻ ያቀርባል።
- issue: የቦታ ጥቆማዎቹን መተርጎም
  choice: “እዩ፣ እዚያ!” ወይም “እዩ፣ እዚህ!”
  alternative: “እነሆ፣ እዚያ!” ወይም “እነሆ፣ እዚህ!”
  rationale: “እዩ” የἰδούን የትኩረት ጥሪ በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ ስለ ሰው ልጅ መገኛ ከጽሑፉ በላይ የሆነ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር የቦታ ጥቆማዎቹና የማስጠንቀቂያው ፈጣን ምት ተጠብቀዋል።
