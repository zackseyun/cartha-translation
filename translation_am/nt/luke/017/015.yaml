  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: am
  text: ከእነርሱ አንዱ ግን እንደ ተፈወሰ ባየ ጊዜ፣ በታላቅ ድምፅ እግዚአብሔርን ክብር እየሰጠ ተመለሰ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: ከእነርሱ አንዱ ግን
  rationale: ከፊልነትን የሚገልጠውን ‘ከእነርሱ አንዱ’ በቀጥታ ያስተላልፋል፤ δέ ደግሞ ከሌሎቹ ዘጠኝ ጋር ያለውን ቀላል ንጽጽር ‘ግን’ በማለት ያሳያል።
- source_word: ἰδὼν ὅτι ἰάθη
  choice: እንደ ተፈወሰ ባየ ጊዜ
  rationale: የፈውሱን መፈጸምና እርሱም ይህን ካየ በኋላ መመለሱን በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል። ‘ተፈወሰ’ የἰάομαιን የፈውስ ትርጉም ይጠብቃል።
- source_word: ὑπέστρεψεν
  choice: ተመለሰ
  rationale: በትረካው ውስጥ ወደ ኢየሱስ መመለሱን በግልጽና በተለመደ አማርኛ ያመለክታል።
- source_word: μετὰ φωνῆς μεγάλης
  choice: በታላቅ ድምፅ
  rationale: በጣም ከፍ ባለ ድምፅ መናገሩን የሚገልጥ፣ ለግሪኩም ቅርብ የሆነ የተለመደ አገላለጽ ነው።
- source_word: δοξάζων τὸν θεόν
  choice: እግዚአብሔርን እያከበረ
  rationale: δοξάζω የክብር ትርጉሙን እንዲጠብቅ ‘እያከበረ’ ተብሏል፤ በዚህ ዐውድ ‘እያመሰገነ’ የሚለውንም ሐሳብ ሊያካትት ይችላል። τὸν θεόν በመደበኛው የአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም ‘እግዚአብሔርን’ ተብሏል።
theological_decisions:
- issue: የτὸν θεόν አተረጓጎም
  choice: እግዚአብሔርን
  alternative: አምላክን
  rationale: ጥቅሱ የተፈወሰው ሰው እግዚአብሔርን እንዳከበረ ብቻ ይናገራል፤ በአማርኛ የተለመደው መጠሪያ የግሪኩን ትርጉም ያለ ዶክትሪናዊ ማስፋፊያ ያስተላልፋል።
- issue: የδοξάζων ትርጉም ስፋት
  choice: እያከበረ
  alternative: እያመሰገነ
  rationale: ‘እያከበረ’ ከδόξα ጋር ያለውን የክብር ግንኙነት ይጠብቃል፤ ሆኖም በዐውዱ የምስጋና ሐሳብም ስለሚኖረው አማራጩ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተካፋይ ግስ በተፈጥሯዊው ‘ባየ ጊዜ’ ተገልጧል፤ የδοξάζω የትርጉም ስፋት ግን በግርጌ ማስታወሻ ተጠብቋል።
