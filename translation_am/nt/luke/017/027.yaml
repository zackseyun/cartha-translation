base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: am
  text: ይበሉ ነበር፣ ይጠጡ ነበር፣ ያገቡ ነበር፣ ለጋብቻም ይሰጡ ነበር[a]፤ ኖኅ ወደ መርከቢቱ እስከገባበት ቀን ድረስ። ከዚያም የጥፋት ውሃው መጥቶ ሁሉንም አጠፋ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህን በአጭሩ «ይጋቡ ነበር» ብሎ መተርጎምም ይቻላል። ግሪኩ ግን ሁለት የተለያዩ ግሶችን ይጠቀማል፤ አንደኛው «ማግባት» የሚል አድራጊ ግስ ሲሆን፣ ሁለተኛው «ለጋብቻ መሰጠት» የሚል ተደራጊ ግስ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: ይበሉ ነበር፣ ይጠጡ ነበር
  rationale: የግሶቹ ያልተፈጸመ የጊዜ አቀራረብ በዚያን ጊዜ በተለምዶ ይቀጥሉ የነበሩ ተግባራትን ስለሚያሳይ፣ «ነበር» ያለው አወቃቀር ተመርጧል።
- source_word: ἐγάμουν, ἐγαμίζοντο
  choice: ያገቡ ነበር፣ ለጋብቻም ይሰጡ ነበር
  rationale: በግሪክ ያሉትን አንዱ አድራጊ ሌላው ተደራጊ የሆኑ ሁለት የተለያዩ ግሶች ሳይዋሐዱ ይጠበቃሉ።
- source_word: ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε
  choice: ኖኅ ወደ መርከቢቱ እስከገባበት ቀን ድረስ
  rationale: ቀጥለው የነበሩት ተግባራት ያበቁበትን ጊዜ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: κιβωτόν
  choice: መርከቢቱ
  rationale: በኖኅ ታሪክ ውስጥ ቃሉ የሚያመለክተው ልዩ መርከብ ስለሆነ የውስንነት ቅጥያ ተጠቅሟል።
- source_word: κατακλυσμός
  choice: የጥፋት ውሃው
  rationale: የኖኅን ታላቅ ጎርፍ በግልጽና በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያመለክታል።
- source_word: ἀπώλεσεν πάντας
  choice: ሁሉንም አጠፋቸው
  rationale: πάντας ሰዎችን የሚያመለክት ብዙ ቁጥር ስለሆነ፣ የጥፋቱን ሙሉነት የሚጠብቅ የተፈጥሮ አማርኛ ተመርጧል።
theological_decisions:
- issue: ሁለቱን የጋብቻ ግሶች ለይቶ መተርጎም
  choice: ያገቡ ነበር፣ ለጋብቻም ይሰጡ ነበር
  alternative: ይጋቡ ነበር
  rationale: ምንጩ ሁለት የተለያዩ ግሶችን—አንዱን አድራጊ፣ ሌላውን ተደራጊ—ይጠቀማል። ልዩነቱን መጠበቅ በፍርድ እስከተቋረጠበት ጊዜ ድረስ መደበኛ ማኅበራዊ ኑሮ መቀጠሉን ያሳያል፤ ተጨማሪ የእምነት ትርጉም አያስገባም።
- issue: የመክፈቻውን የግስ ተከታታይ ገጽታ መጠበቅ
  choice: «ይ… ነበር» የሚለውን ቀጣይ/ልማዳዊ የኋላ ጊዜ አቀራረብ መጠቀም
  alternative: ቀላል ያለፈ ጊዜን መጠቀም
  rationale: በግሪክ ያሉት ተደጋጋሚ ያልተፈጸሙ ግሶች መደበኛው ኑሮ ሳይቋረጥ እንደቀጠለና ፍርዱ በድንገት እንደመጣ ያሳያሉ።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። አጭር ተደጋጋሚ ሐረጎቹ የምንጩን የዕለት ተዕለት ኑሮ ምት ይጠብቃሉ።
