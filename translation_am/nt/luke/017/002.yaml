    text: ወይም፣ “ትልቅ የወፍጮ ድንጋይ።” የግሪኩ ሐረግ በወፍጮ የሚያገለግል ከባድ ድንጋይን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
