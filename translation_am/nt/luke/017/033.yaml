id: LUK.17.33
reference: Luke 17:33
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: am
  text: ሕይወቱን[a] ለራሱ ለማቆየት የሚጥር ሁሉ ያጣታል፤ የሚያጣት ግን በሕይወት ያቆያታል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ሕይወት» ለሚለው «ነፍስ» ሊባልም ይችላል፤ እዚህ ግን ψυχή የሰውን ሕይወት ወይም ራስነት የሚያመለክት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ግስ ቃል በቃል «በሕይወት ያቆያታል» ማለት ነው፤ «ያድናታል» ወይም «ያተርፋታል» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: የሚጥር
  rationale: ግሱ ተራ ምኞትን ሳይሆን ዓላማ ያለውን ጥረት ስለሚገልጥ፣ «የሚጥር» የተግባር ኃይሉን ያስቀራል።
- source_word: ψυχὴν
  choice: ሕይወቱን
  rationale: በዚህ የፍርድና የራስን ሕይወት የማቆየት አውድ ውስጥ ψυχή የሰውን ሕይወት ወይም ራስነት ያመለክታል፤ «ነፍስ» ግን ያልተፈለገ የአካልና የነፍስ ክፍፍል ሊያስገባ ይችላል።
- source_word: περιποιήσασθαι
  choice: ለራሱ ለማቆየት
  rationale: የመካከለኛው ድምፅ ለራስ ማስቀረትን ወይም ማስጠበቅን ያሳያል፤ ይህ አተረጓጎም ራስን የመጠበቅ ጥረቱን በግልጽ ያቀርባል።
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ያጣታል / የሚያጣት
  rationale: በሁለቱም ሐረጎች የሚገኘውን ተመሳሳይ ግስና የንግግሩን ተቃርኖ በአንድ ዓይነት አተረጓጎም ይጠብቃል።
- source_word: ζῳογονήσει
  choice: በሕይወት ያቆያታል
  rationale: ζῳογονέω በቀጥታ በሕይወት ማቆየትን ይገልጣል፤ ይህ ከተለመደው «ያድናታል» ይልቅ የግሪኩን ልዩ የሕይወት ቃል በግልጽ ያሳያል።
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: … ሁሉ …፤ … ግን
  rationale: አጠቃላይ ሁኔታዊ አነጋገሩን «ሁሉ» ይገልጣል፤ δέ የሚያሳየውን ተቃርኖ «ግን» ያስቀራል።
theological_decisions:
- issue: በኢየሱስ ተቃርኖአዊ ንግግር ውስጥ የψυχή ትርጉም
  choice: «ሕይወት» ተብሎ ተተርጉሟል
  alternative: «ነፍስ»
  rationale: ቅርብ አውዱ ሰው በፍርድ ጊዜ ሕይወቱን ለማስቀረት ስለሚያደርገው ጥረትና በማጣት ስለሚገኘው ሕይወት ይናገራል። «ሕይወት» ያልተገለጸ የሰው ተፈጥሮ ክፍፍል ሳያስገባ የንግግሩን ኃይል ይጠብቃል።
- issue: የζῳογονήσει አተረጓጎም
  choice: «በሕይወት ያቆያታል» ተብሎ በግልጽ ተተርጉሟል
  alternative: «ያድናታል» ወይም «ያተርፋታል»
  rationale: የግሪኩ ግስ የተለመደው ‘ማዳን’ ግስ ሳይሆን ሕያው ማድረግን ወይም በሕይወት ማቆየትን ይገልጣል። ቀጥተኛው አተረጓጎም የንግግሩን የሕይወት–ማጣት ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ለራሱ» የመካከለኛውን የግሪክ ድምፅ በተፈጥሯዊ አማርኛ ያሳያል፤ የሁለቱ ሐረጎች ተቃርኖም በአጭርና ሚዛናዊ አወቃቀር ተጠብቋል።
