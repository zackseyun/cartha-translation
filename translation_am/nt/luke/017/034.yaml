  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: am
  text: እላችኋለሁ፤ በዚያች ሌሊት ሁለት ሰዎች በአንድ አልጋ ላይ ይሆናሉ፤ አንዱ ይወሰዳል[a]፣ ሌላውም ይቀራል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘አብሮ ይወሰዳል’፤ παραλημφθήσεται የሚለው ግስ እዚህ መወሰዱ ለመዳን ወይም ለፍርድ መሆኑን በራሱ አይገልጽም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘ተትቶ ይቀራል’፤ በግሪኩ በግልጽ ያልተገለጹ በኋላ የተፈጠሩ የፍጻሜ ዘመን ግንዛቤዎችን ላለማስገባት በዋናው ጽሑፍ ‘ይቀራል’ የሚለው አጭር አገላለጽ ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውንና አጽንዖት ያለውን ንግግር በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ταύτῃ τῇ νυκτί
  choice: በዚያች ሌሊት
  rationale: በዐውዱ የታሰበችውን የተወሰነች ሌሊት ያመለክታል፤ የአማርኛው አገላለጽም ተፈጥሯዊ ነው።
- source_word: ἔσονται δύο
  choice: ሁለት ሰዎች … ይሆናሉ
  rationale: በግሪኩ የተገለጸውን የወደፊት ጊዜ ይጠብቃል፤ በአማርኛ ግልጽ እንዲሆን ‘ሰዎች’ በዐውድ ተሟልቷል።
- source_word: ἐπὶ κλίνης μιᾶς
  choice: በአንድ አልጋ ላይ
  rationale: κλίνη አልጋን ወይም መደገፊያ ያለውን መኝታ ሊያመለክት ቢችልም፣ በሌሊት ዐውድ ‘አልጋ’ ተፈጥሯዊና ተገቢ ነው።
- source_word: ὁ εἷς
  choice: አንዱ
  rationale: ከሁለቱ አንዱን በተፈጥሯዊ የአማርኛ ንጽጽር ይገልጣል።
- source_word: παραλημφθήσεται
  choice: ይወሰዳል
  rationale: ተገብሮአዊውን የወደፊት ጊዜ ይጠብቃል፤ መወሰዱ ለመዳን ወይም ለፍርድ መሆኑን ግሱ ብቻውን ስለማይወስን አሻሚነቱ ተጠብቋል።
- source_word: ὁ ἕτερος
  choice: ሌላው
  rationale: በሁለቱ መካከል ያለውን ‘አንዱ … ሌላው’ ንጽጽር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀφεθήσεται
  choice: ይቀራል
  rationale: ከ‘ይወሰዳል’ ጋር በተቃርኖ ያለውን ‘መተው/መቅረት’ ትርጉም በአጭሩ ያሳያል፤ በኋላ የተፈጠሩ የፍጻሜ ዘመን ግንዛቤዎችን አያስገባም።
theological_decisions:
- issue: የተወሰደው ሰው የዳነ ነው ወይስ ለፍርድ የተወሰደ ነው?
  choice: ዋናው ጽሑፍ ‘አንዱ ይወሰዳል፣ ሌላውም ይቀራል’ ብሎ ገለልተኛነቱን ይጠብቃል።
  alternative: ‘የተወሰደው ለመዳን ተወስዷል’ ወይም ‘የተወሰደው ለፍርድ ተወስዷል’ ብሎ መተርጎም።
  rationale: የግሪኩ ግሶች በዚህ ቁጥር ብቻ ጉዳዩን አይወስኑም፤ ስለዚህ አንድን የፍጻሜ ዘመን አተረጓጎም ሳያስገባ ሥነ መለኮታዊው ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር ትይዩ አወቃቀር ‘አንዱ … ሌላውም’ ተጠብቋል።
