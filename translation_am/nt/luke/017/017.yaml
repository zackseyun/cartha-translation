  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “አሥሩ አልነጹምን?[a] ዘጠኙስ የት ናቸው?” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አሥሩም ሁሉ ንጹሕ አልተደረጉምን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: ኢየሱስም መልሶ፣ ... አለ
  rationale: የግሪክኛውን የንግግር መግቢያ ቅርጽ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ የδὲን ቀላል የትረካ ቅጥልጥል በ“-ም” ያሳያል።
- source_word: Οὐχὶ
  choice: አል...ምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን አሉታዊ የአጠያየቅ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οἱ δέκα
  choice: አሥሩ
  rationale: በአውዱ አስቀድሞ የታወቁትን አሥር ሰዎች በአጭርና ተፈጥሯዊ መንገድ ይጠቅሳል፤ በግሪክኛው ያልተገለጸ ተጨማሪ አጽንዖት አይጨምርም።
- source_word: ἐκαθαρίσθησαν
  choice: ነጹ
  rationale: καθαρίζω በዚህ የለምጽ አውድ ያለውን ከበሽታ መመለስና ሥርዓታዊ ንጽሕና የሚያካትት ትርጉም ይጠብቃል፤ “ተፈወሱ” ብቻ ከሚለው የሰፋ ነው።
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: ዘጠኙስ የት ናቸው?
  rationale: “-ስ” አንዱ ከተመለሰ በኋላ ከቀሩት ዘጠኝ ጋር ያለውን ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በለምጻሞቹ ፈውስ ውስጥ καθαρίζω የሚለው ቃል ትርጉም
  choice: “ነጹ” ተብሎ ተተርጉሟል
  alternative: “ተፈወሱ” ወይም “ንጹሕ ተደረጉ”
  rationale: የግሪክኛው ቃል አካላዊ መዳንንም ሆነ ከለምጽ ጋር የተያያዘውን ሥርዓታዊ ንጽሕና ሊያመለክት ይችላል። “ነጹ” ይህን ስፋት ያለ ተጨማሪ የእምነት ትርጓሜ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አልነጹምን?” የጥንታዊውን አሉታዊ ጥያቄ ኃይል ሳያጣ አጭርና ተፈጥሯዊ ነው።
