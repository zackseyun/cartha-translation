  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: am
  text: የሴሩግ ልጅ፣ የራዑ ልጅ፣ የፋሌቅ ልጅ፣ የዔቤር ልጅ፣ የሳላ ልጅ፣[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ «የሴሩግ፣ የራጋው፣ የፋሌቅ፣ የዔቤር፣ የሳላ።» በዚህ የዘር ሐረግ ውስጥ «ልጅ» የሚለው ቃል በግሪክኛው በግልጽ አልተደገመም፤ ከአውዱ ስለሚታወቅ ለግልጽነት በአማርኛ ተጨምሯል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በሉቃስ የዘር ሐረግ ውስጥ ተደጋጋሚው የግሪክ ባለቤትነት ቅርጽ ከአውዱ የሚታወቀውን የወላጅና የልጅ ግንኙነት ያመለክታል፤ ስለዚህ በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን «የ… ልጅ» ተብሏል።
- source_word: Σεροὺχ
  choice: ሴሮግ
  rationale: ይህ በግሪክ Σερούχ የተጻፈውን የግል ስም በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ ቅርጽ በመከተል ያቀርባል።
- source_word: Ῥαγαὺ
  choice: ራጉ
  rationale: ምንጩ ያለውን የግሪክ ስም ቅርጽ በቅርብ ይከተላል፤ ከዕብራይስጡ የመጣው «ራዑ» የሚለው ቅርጽ አማራጭ ሊሆን ይችላል።
- source_word: Φάλεκ
  choice: ፋሌቅ
  rationale: የግሪኩን Φάλεκ ቅርጽ በቅርብ የሚያንጸባርቅ እና በአማርኛ ሊነበብ የሚችል የስም አጻጻፍ ነው።
- source_word: Ἔβερ
  choice: ዔቦር
  rationale: ይህ ስም ከዘፍጥረት የዘር ሐረግ ጋር የሚያገናኘውን በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ቅርጽ ይጠቀማል።
- source_word: Σαλὰ
  choice: ሳላ
  rationale: የSBLGNT ግሪክ Σαλά ቅርጽን በቀጥታ የሚከተል ተጽፎ ሲሆን፣ በዕብራይስጥ ወግ የሚታወቀው «ሴላ» ቅርጽ በማስታወሻ ተጠቅሷል።
