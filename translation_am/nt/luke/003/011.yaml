  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ ትይዩ ትእዛዛት በ“ያካፍል … ያድርግ” ተጠብቀዋል፤ ባህላዊው የልብስ ስም ግን ለአንባቢ በማስታወሻ ተብራርቷል።
