base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: am
  text: እርሱም መልሶ፣ “ሁለት ቀሚሶች[a] ያሉት ቀሚስ ከሌለው ጋር ያካፍል፤ ምግብ ያለውም እንደዚሁ ያድርግ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ሸሚዞች” ወይም “ልብሶች”፤ የግሪኩ ቃል በሰውነት ላይ የሚለበስን የጥንት ዘመን መሠረታዊ ልብስ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: እርሱም መልሶ … አላቸው
  rationale: የግሪኩን የመልስ አሳብና ቀላል አያያዥ ይጠብቃል፤ በአማርኛም ተፈጥሯዊ የንግግር መግቢያ ነው። የἔλεγεν ኢምፐርፌክት ገጽታ በዚህ አውድ የቆይታ ትርጉም እንዲጫንበት ሳይደረግ በተለመደው የትረካ አገላለጽ ተተርጉሟል።
- source_word: Ὁ ἔχων δύο χιτῶνας
  choice: ሁለት ቀሚሶች ያሉት
  rationale: የግሪኩን አጠቃላይ ነጠላ ተሳቢ አገላለጽ ያለ ጾታዊ ጭነት ይጠብቃል። ቀሚስ የχιτώνን መሠረታዊ ልብስ በአንጻራዊ ቅርበት ይገልጣል፤ ባህላዊ ልዩነቱ በማስታወሻ ተብራርቷል።
- source_word: μεταδότω τῷ μὴ ἔχοντι
  choice: አንድም ለሌለው ያካፍል
  rationale: ያካፍል የሦስተኛ መደብ ትእዛዛዊ ኃይሉንና የማጋራት ሐሳቡን በተፈጥሯዊ አማርኛ ያስተላልፋል። አንድም የተነፈገው ነገር ቀሚስ መሆኑን ከአውዱ ጋር በግልጽ ያያይዛል።
- source_word: βρώματα
  choice: ምግብ
  rationale: ቃሉ በአጠቃላይ የሚበሉ ነገሮችን ያመለክታል፤ ምግብ ግልጽና ዘመናዊ የአማርኛ አቻ ነው።
- source_word: ὁμοίως ποιείτω
  choice: እንደዚሁ ያድርግ
  rationale: የመጀመሪያውን ትእዛዝ ለምግብም በትይዩ ያስፋፋል፤ ያድርግ የግሪኩን ትእዛዛዊ ኃይል ይጠብቃል።
theological_decisions:
- issue: አጠቃላይ ነጠላ አገላለጽና ጾታ
  choice: ያሉት … ለሌለው … ያለው
