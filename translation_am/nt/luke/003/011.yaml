  alternative: ማካፈል አለበት … እንደዚሁ ማድረግ አለበት
  rationale: ሁለቱም የግሪክ ግሶች የሦስተኛ መደብ ትእዛዝ ናቸው። ቀጥተኛው የአማርኛ ትእዛዛዊ ቅርጽ ምክሩን ወደ ተራ ግዴታ መግለጫ ሳያለዝብ ያስተላልፋል።
