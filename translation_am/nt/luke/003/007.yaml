  - marker: b
    text: ወይም፣ “ሊመጣ ካለው ቁጣ።”
    reason: lexical_alternative
  revision_rationale: The changes clarify John’s agency in baptism, preserve the ongoing sense of the participle describing the crowds, and make the first lexical-alternative footnote idiomatic and grammatically consistent. No theological narrowing has been introduced.
