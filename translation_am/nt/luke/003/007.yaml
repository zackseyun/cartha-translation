base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: am
  text: ስለዚህ በእርሱ ዘንድ ሊጠመቁ ለሚወጡት ሕዝብ እንዲህ ይል ነበር፦ “እናንተ የእፉኝቶች ዘር[a]፣ ከሚመጣው ቁጣ[b] እንድትሸሹ ማን አስጠነቀቃችሁ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእፉኝቶች ልጆች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሊመጣ ካለው ቁጣ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ይል ነበር
  rationale: የግሪኩን ያልተፈጸመ የግስ አቀራረብ በመጠበቅ፣ ንግግሩ በዚያ ጊዜ ቀጣይ ወይም ተደጋጋሚ እንደነበር ያሳያል፤ ድግግሞሹን ግን ከጽሑፉ በላይ አይወስንም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ንግግሩን ከቀደመው አውድ ጋር የሚያያይዘውን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: ይወጡ ለነበሩት ሕዝብ
  rationale: ሕዝቡ ዮሐንስ ወዳለበት እየወጣ መምጣቱን ይገልጻል፤ ‘ሕዝብ’ በአማርኛ የብዙ ሰዎችን ስብስብ በተፈጥሮ ያመለክታል።
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: በእርሱ ሊጠመቁ
  rationale: የግሪኩን ተደራጊ ቅርጽና የመውጣታቸውን ዓላማ ይጠብቃል፤ የስም ተውላጠ ስሙም ሳይተካ እንዳለ ቀርቧል።
- source_word: Γεννήματα ἐχιδνῶν
  choice: የእፉኝቶች ዘሮች
  rationale: γέννημα የተወለደውን ወይም የተገኘውን ያመለክታል፤ ‘ዘሮች’ ይህን ጠንካራ ምስል በክቡርና ግልጽ አማርኛ ያስተላልፋል።
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ማን አስጠነቀቃችሁ?
  rationale: ὑποδείκνυμι ማሳየትን፣ ማስተማርን ወይም ማስጠንቀቅን ሊያመለክት ይችላል፤ በሚመጣው ፍርድ አውድ ‘አስጠነቀቀ’ የንግግሩን ኃይል በተፈጥሮ ይገልጻል።
- source_word: φυγεῖν
  choice: እንድትሸሹ
  rationale: ከአደጋ በፍጥነት የመራቅን ሕያው ምስል ይጠብቃል።
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: ከሚመጣው ቁጣ
  rationale: μέλλουσα ወደፊት የሚመጣውን ያመለክታል፤ ‘ቁጣ’ ደግሞ ὀργήን ሳያጠብ ወይም ወደ አንድ የትምህርት ሥርዓት ሳይወስን ያቀርባል።
theological_decisions:
- issue: በዮሐንስ ማስጠንቀቂያ ውስጥ የὀργή ባሕርይ
  choice: ‘ቁጣ’ የሚመጣውን መለኮታዊ ፍርድ በሰፊው ያመለክታል።
  alternative: ቃሉን በተለይ የመጨረሻው ዘመን ፍርድ ወይም በታሪክ ውስጥ የሚፈጸም ጊዜያዊ ፍርድ ብሎ መወሰን።
  rationale: የሉቃስ 3 አውድ በንስሐና በእግዚአብሔር ፍርድ ላይ ያተኩራል። ትርጉሙ ‘ቁጣ’ የሚለውን ሰፊ ቃል በመጠበቅ ጽሑፉ ያልወሰነውን ሥነ መለኮታዊ አቋም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የዮሐንስ ከባድ የትንቢታዊ ንግግር ሳይለዝብ ተጠብቋል።
