- source_word: ποιήσωμεν
  choice: እናድርግ
  rationale: የግሪኩን የምክክር ጥያቄ ቅርጽ በአማርኛ ተፈጥሯዊ በሆነ አንደኛ መደብ ብዙ ቁጥር ያቀርባል።
