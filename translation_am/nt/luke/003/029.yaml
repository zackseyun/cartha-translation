  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: ኢያሱ
  rationale: የግሪኩ Ἰησοῦς በዚህ የዘር ሐረግ ውስጥ የቀድሞውን የዕብራይስጥ ስም የሚወክል በመሆኑ፣ በአማርኛ የተለመደው ኢያሱ ተመርጧል።
- source_word: Ἐλιέζερ
  choice: አልዓዛር
  rationale: የግሪኩን የግል ስም በአማርኛ መጽሐፍ ቅዱሳዊ አጠራር የታወቀውን ቅርጽ በመከተል ያቀርባል።
- source_word: Ἰωρίμ
  choice: ዮሪም
  rationale: የስሙን የግሪክ ድምፅ በተፈጥሯዊ የአማርኛ ፊደል በቅርብ ያስተላልፋል።
- source_word: Μαθθάτ
  choice: ማታት
  rationale: የግሪክ ስም በቀጥታ እና በቀላሉ ሊነበብ በሚችል የአማርኛ ቅርጽ ተገልብጧል።
- source_word: Λευί
  choice: ሌዊ
  rationale: በአማርኛ መጽሐፍ ቅዱስ የተለመደው የስሙ ቅርጽ ነው።
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በዘር ሐረጉ ውስጥ ያለው ተደጋጋሚ የግሪክ ዝምድና አመልካች በአማርኛ ተፈጥሯዊ በሆነው የስሞች ሰንሰለትና በመጨረሻው ‘ልጅ’ ተገልጿል።
