  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: am
  text: እንዲህም ሆነ፤ ሕዝቡ ሁሉ በተጠመቀ ጊዜ፣ ኢየሱስም ተጠምቆ ሲጸልይ፣ ሰማይ[a] ተከፈተ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚታየው ሰማይ»። የግሪኩ ቃል የሚታየውን ሰማይ ወይም ሰማያዊውን ዓለም ሊያመለክት ይችላል፤ በዚህ አውድ ግን የመገለጥ ትርጉሙ ይበልጥ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: እንዲህም ሆነ
  rationale: የሉቃስን የትረካ ሽግግርና የክስተቱን ኃይል በተፈጥሯዊና ክቡር አማርኛ ያስተላልፋል፤ δὲ ያለው ለስላሳ ትስስር በ«ም» ተገልጧል።
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: ሕዝቡ ሁሉ በተጠመቀ ጊዜ
  rationale: ἐν ከአንቀጻዊው የግስ ስም ጋር ያለውን ጊዜያዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ «ሁሉ» የἅπανταን ስፋት ይጠብቃል።
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: ኢየሱስም ተጠምቆ
  rationale: ተጨማሪነትን የሚገልጠው καί በ«ም» ተተርጉሟል፤ የተፈጸመው ጥምቀት ከቀጣዩ የጸሎት ተግባር ጋር በተፈጥሯዊ ቅደም ተከተል ቀርቧል።
- source_word: καὶ προσευχομένου
  choice: ሲጸልይ
  rationale: የጸሎቱን ቀጣይነትና ሰማይ ከመከፈቱ ጋር ያለውን በአንድ ጊዜ መሆን ያሳያል።
- source_word: ἀνεῳχθῆναι
  choice: ተከፈተ
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ በማርቆስ የሚታየውን ጠንካራ የመቀደድ ምስል አያስገባም።
- source_word: τὸν οὐρανὸν
  choice: ሰማይ
  rationale: «ሰማይ» በአማርኛ ሰማያዊውን ዓለምም ሆነ የሚታየውን ሰማይ ሊያመለክት ስለሚችል የግሪኩን የቃል ስፋት ይጠብቃል፤ በዚህ አውድ ግን መለኮታዊ መገለጥ ቀዳሚ ነው።
theological_decisions:
- issue: በጥምቀቱ ትዕይንት ውስጥ οὐρανός የሚያመለክተው
  choice: ሰማይ፣ በዋናነት እንደ ሰማያዊው ዓለም
  alternative: የሚታየው ሰማይ
  rationale: የመንፈስ ቅዱስ መውረድና የመለኮታዊው ድምፅ መሰማት የሚከተሉበት አውድ ሰማያዊውን የመገለጥ ትርጉም ያጠናክራል፤ ነገር ግን የቃሉ ሌላ ትርጉም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እንዲህም ሆነ» የሉቃስን ትረካዊ መግቢያ ሳይጥል ይይዛል፤ የጊዜ አወቃቀሩም በ«በተጠመቀ ጊዜ» እና «ሲጸልይ» በተፈጥሯዊ ሁኔታ ቀርቧል።
