  text: የማታትያስ ልጅ፣ የአሞጽ ልጅ፣ የናሆም ልጅ፣ የኤስሊ ልጅ፣ የናጌ ልጅ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በሉቃስ የዘር ሐረግ ውስጥ ከእያንዳንዱ ስም ጋር የተደጋገመው የዝምድና ቅጽ በአውዱ ‘የ… ልጅ’ የሚለውን ያመለክታል፤ ይህን በግልጽ ማቅረብ በአማርኛ ተፈጥሯዊ ነው።
- source_word: Ματταθίου
  choice: ማታትያስ
  rationale: የግል ስም ስለሆነ ከግሪክኛው ድምፅ ጋር በሚቀራረብ መልኩ ተጽፏል።
- source_word: Ἀμὼς
  choice: አሞጽ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀው የስሙ ቅጽ ተመርጧል።
- source_word: Ναοὺμ
  choice: ናሆም
  rationale: በአማርኛ የተለመደውና በቀላሉ የሚታወቀው የግል ስም ቅጽ ነው።
- source_word: Ἑσλὶ
  choice: ኤስሊ
  rationale: የግሪክኛውን ስም ድምፅ በቅርብ የሚያስተላልፍና በአማርኛ ለማንበብ ተፈጥሯዊ የሆነ ቅጽ ተመርጧል።
- source_word: Ναγγαὶ
  choice: ናጋይ
  rationale: ድርብ ጋማውን በአማርኛ አጻጻፍ ሳያከብድ፣ የግሪክኛውን አጠራር በቅርብ የሚወክል ቅጽ ነው።
