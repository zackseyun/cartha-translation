translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛን ይጠቀማል። በግሪኩ የተዘወተረው τοῦ ብቻ ቢሆንም፣ ከዘር ሐረጉ አውድ ግልጽ የሆነው ‘ልጅ’ በአማርኛ ለተፈጥሯዊነትና ለግልጽነት ተጨምሯል። ይህ በአማርኛ የዘር ሐረግ አነጋገር ውስጥ ግልጽ ስለሆነ የግርጌ ማስታወሻ አላስፈለገውም።
