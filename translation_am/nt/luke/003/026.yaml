  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: am
  text: የማዓት ልጅ፣ የማታትያስ ልጅ፣ የሴሜይን ልጅ፣ የዮሴክ ልጅ፣ የዮዳ ልጅ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በዘር ሐረጉ አውድ ውስጥ ተደጋጋሚው የግሪክ ዝርያ አመልካች አንቀጽ የአባትና የልጅን ዝምድና በአጭሩ ያመለክታል፤ ስለዚህ በተፈጥሯዊ አማርኛ ‘የ… ልጅ’ ተብሎ ተገልጧል።
- source_word: Μάαθ
  choice: ማዓት
  rationale: የግሪኩን የግል ስም ድምፅ በግዕዝ ፊደል በቀጥታ የሚወክል ቅርጽ ነው።
- source_word: Ματταθίου
  choice: ማታትያስ
  rationale: የግሪኩ ስም Ματταθίας የባለቤትነት ቅርጽ ሲሆን፣ በአማርኛ ስሙ በመሠረታዊ ቅርጹ ተጽፏል።
- source_word: Σεμεῒν
  choice: ሴሜይን
  rationale: ከSBLGNT የግሪክ ንባብ ጋር በቅርብ የሚሄድ የድምፅ ጽሕፈት ነው።
- source_word: Ἰωσὴχ
  choice: ዮሴክ
  rationale: የመጨረሻውን χ በአማርኛ ስሞች ውስጥ ተፈጥሯዊ በሆነ ‘ክ’ በመወከል የግሪኩን ቅርጽ በቅርብ ይከተላል።
- source_word: Ἰωδὰ
  choice: ዮዳ
  rationale: የግሪኩን Ἰωδά በቀጥታ የሚወክል የአማርኛ አጻጻፍ ሲሆን፣ ወደ ሌላ ዕብራይስጣዊ ቅርጽ አልተስማማም።
