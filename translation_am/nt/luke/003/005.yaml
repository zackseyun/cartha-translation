  text: ሸለቆ ሁሉ ይሞላል፤[a] ተራራና ኮረብታ ሁሉ ዝቅ ይደረጋል፤ ጠማማ የሆኑትም ቀጥ ይላሉ፤[b] ወጣ ገባ የሆኑትም የተስተካከሉ መንገዶች ይሆናሉ።
