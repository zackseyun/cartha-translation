  text: የማበጠሪያ አካፋው[a] በእጁ ነው፤ አውድማውን ፈጽሞ ያጸዳል፣ ስንዴውንም ወደ ጎተራው[b] ይሰበስባል፤ ገለባውን ግን በማይጠፋ እሳት[c] ፈጽሞ ያቃጥላል።
  philosophy: optimal-equivalence
