theological_decisions:
- issue: በግብርናዊው ምሳሌ ውስጥ ያለው የፍርድ ምስል
  choice: መጪው እርሱ ስንዴውን ከገለባው በቁርጥ እንደሚለይ፣ አንዱን እንደሚሰበስብና ሌላውን እንደሚያቃጥል የሚያሳየውን የመዳንና የፍርድ ውጥረት መጠበቅ
  alternative: ጥቅሱን በእስራኤል ላይ ብቻ የሚደርስ ጊዜያዊ ፍርድ አድርጎ መወሰን፣ ወይም ስለ መጨረሻው ፍርድ ከጥቅሱ በላይ የተሟላ የሥነ መለኮት መግለጫ ማስገባት
  rationale: የስንዴና የገለባ መለያየት ፍርድን በግልጽ ያሳያል። ‘በማይጠፋ እሳት’ የሚለው ሳይለዘብ ተተርጉሟል፤ ነገር ግን ጥቅሱ በራሱ ከሚናገረው በላይ የአንድ ወገን ዶክትሪን አልተጨመረም።
