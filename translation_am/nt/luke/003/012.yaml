lexical_decisions:
- source_word: ἦλθον
  choice: መጡ
  rationale: የግሪኩ የአንድ ጊዜ ያለፈ ድርጊት አመልካች ቅርጽ በተፈጥሯዊ አማርኛ በቀላል ያለፈ ጊዜ ተተርጉሟል።
- source_word: δὲ καὶ τελῶναι
  choice: ቀረጥ ሰብሳቢዎችም እንኳ
  rationale: δὲ የትረካውን ቀጣይነት፣ καὶ ደግሞ አካታችና አጽንዖታዊ ኃይልን ይሰጣሉ፤ “-ም እንኳ” በዐውዱ ያለውን ያልተጠበቀ ተሳትፎ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βαπτισθῆναι
  choice: ሊጠመቁ
  rationale: የተገብሮ ድርጊትንና የመምጣታቸውን ዓላማ ሁለቱንም ይጠብቃል።
- source_word: εἶπαν πρὸς αὐτόν
  choice: እርሱንም … አሉት
  rationale: የግሪኩን “እርሱን አሉት” የሚለውን አገላለጽ ከ“ጠየቁት” ይልቅ በቅርብ ይጠብቃል፤ የንግግሩ ይዘት ጥያቄ መሆኑ በሥርዓተ ነጥቡ ግልጽ ነው።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የቀጥታ ጥሪውንና የማስተማር ሚናውን በክብር ያስተላልፋል።
- source_word: τί ποιήσωμεν
  choice: ምን እናድርግ?
