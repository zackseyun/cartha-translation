  rationale: ጥቅሱ በትረካው ዐውድ በሥነ ምግባር አጠራጣሪ ተደርገው የሚታዩ ሰዎችም ለዮሐንስ መልእክት ምላሽ መስጠታቸውን ያጎላል፤ ትርጉሙ ተጨማሪ ትርጓሜ ሳያስገባ ይህን የንግግር ኃይል ይጠብቃል።
