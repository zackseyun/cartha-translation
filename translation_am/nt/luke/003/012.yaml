  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: am
  text: ቀረጥ ሰብሳቢዎችም እንኳ ሊጠመቁ መጡ።[a] እርሱንም፣ “መምህር ሆይ፣ ምን እናድርግ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀረጥ ሰብሳቢዎችም ሊጠመቁ መጡ።”
