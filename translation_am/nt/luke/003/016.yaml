- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: እኔ በውሃ አጠምቃችኋለሁ
  rationale: እኔ የሚለው ተውላጠ ስም የμένን ንጽጽራዊ አጽንዖት በአማርኛ ያሳያል፤ በውሃ የሚለው ዳቲቩን እንደ መሣሪያ ወይም ክፍል በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: βαπτίζω / βαπτίσει
  choice: አጠምቃችኋለሁ / ያጠምቃችኋል
  rationale: ‘ማጥመቅ’ በወንጌላዊ ትረካ ውስጥ የተለመደና ግልጽ ቃል ሲሆን የአፈጻጸሙን ዘዴ ከጽሑፉ በላይ አይወስንም።
- source_word: ὁ ἰσχυρότερός μου
  choice: ከእኔ የሚበረታ
  rationale: የንጽጽር ቅርጹን በቀጥታ ይጠብቃል፤ ስለ ኃይል ወይም ብርታት ያለውን ሰፊ የቃሉን ትርጉም ሳያጠብ ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: እኔ ... የሚገባኝ አይደለሁም
  rationale: በዚህ የትሕትና አገላለጽ ἱκανός ብቁነትንና የመገባትን ሐሳብ ይይዛል፤ የአማርኛው አባባል ይህን በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: የጫማውን ማሰሪያ እንኳ ለመፍታት
  rationale: ዝቅተኛ አገልግሎት የሆነውን የጫማ ማሰሪያ መፍታት በግልጽና ዘመናዊ ቃላት ይገልጣል፤ ‘እንኳ’ የትሕትናውን ኃይል ያሰማል።
