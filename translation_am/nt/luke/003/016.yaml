  source_fidelity: 'The draft accurately retains John’s response, the water/Spirit-and-fire contrast, and the unresolved sense of “fire.” However, ἔρχεται is a vivid present (“is coming”), not a simple future, and the opening construction has a case/agreement problem: ሁሉን with መለሰላቸው is not idiomatic for “answered them all.”'
