    reason: lexical_alternative
  - marker: c
    text: የግሪኩ ቃል “በመንፈስ ቅዱስና በእሳት” ይላል። እዚህ ያለው ἐν መሣሪያን፣ ክፍልን ወይም ሁኔታን ሊያመለክት ስለሚችል፣ የ“በ” አገላለጽ ይህን ልዩነት ክፍት ያቆየዋል።
