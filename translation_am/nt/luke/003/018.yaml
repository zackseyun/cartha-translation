  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: am
  text: እንግዲህም በብዙ ሌሎች ምክሮች ሕዝቡን እየመከረ፣ የምሥራቹን ያበሥርላቸው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: በሌሎችም ብዙ ምክሮች
  rationale: ግሪኩ ገለልተኛ ብዙ ቁጥር ቅጽን በስም ፈንታ ተጠቅሞ የተነገሩትን ብዙ ተጨማሪ ነገሮች ያመለክታል። ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ሲሆን የተውበትን ነገር በግልጽ ያሳያል፤ አማራጩም በማስታወሻ ተጠብቋል።
- source_word: μὲν οὖν
  choice: ስለዚህ
  rationale: በቀደመው ንግግር ላይ መቀጠልንና መደምደምን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρακαλῶν
  choice: እያበረታታ
  rationale: παρακαλέω ማበረታታን፣ መምከርን ወይም አጥብቆ መጠየቅን ሊያመለክት ይችላል። እዚህ የዮሐንስን የማሳሰቢያና የምክር አገልግሎት የሚያሳይ ተፈጥሯዊ ምርጫ ነው።
- source_word: εὐηγγελίζετο
  choice: የምሥራቹን ያበሥርላቸው ነበር
  rationale: የግሪኩን ቀጣይ ያለፈ ድርጊትና የምሥራች ማወጅ ትርጉም ይጠብቃል።
- source_word: τὸν λαόν
  choice: ሕዝቡን ... ላቸው
  rationale: λαόςን ‘ሕዝብ’ ብሎ በትክክል ይተረጉማል፤ በግሪኩ ያልተገለጸውን ‘እስራኤል’ ወይም ‘ሕዝብ ብዛት’ አያክልም።
theological_decisions:
- issue: εὐηγγελίζετο ለዮሐንስ አገልግሎት የሚሰጠው ትርጉም
  choice: የምሥራቹን ያበሥርላቸው ነበር
  alternative: ይሰብክላቸው ነበር / ያውጅላቸው ነበር
  rationale: ግሪኩ የዮሐንስን አጥብቆ የሚመክር መልእክት እንኳ እንደ ምሥራች ያቀርበዋል። ይህን የሥነ መለኮት ውጥረት ወደ አጠቃላይ ‘ስብከት’ ሳያለዝብ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የምሥራቹን ያበሥር’ የሚለው መጽሐፍ ቅዱሳዊ ክብርን ሲጠብቅ ትርጉሙንም በግልጽ ያስተላልፋል።
