revisions:
- from: ስለዚህ ዮሐንስ በሌሎችም ብዙ ምክሮች[a] ሕዝቡን እያበረታታ የምሥራቹን ያበሥርላቸው ነበር።
  to: እንግዲህም በብዙ ሌሎች ምክሮች ሕዝቡን እየመከረ፣ የምሥራቹን ያበሥርላቸው ነበር።
  rationale: The revision omits the supplied proper name, uses a more contextually accurate Amharic equivalent for exhorting, regularizes the word order, and preserves both the ongoing aspect and the gospel-proclamation force of the Greek. The footnote retains the lexical ambiguity of the substantival neuter plural without imposing a specific implied noun.
