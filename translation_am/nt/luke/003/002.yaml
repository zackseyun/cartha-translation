  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: am
  text: በሐናና በቀያፋም የሊቀ ካህናትነት ዘመን[a]፣ የዘካርያስ ልጅ ዮሐንስ በምድረ በዳ ሳለ፣ የእግዚአብሔር ቃል ወደ እርሱ መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በሐናና በቀያፋም የሊቀ ካህናትነት ዘመን።” ግሪኩ “ሊቀ ካህናትነት” የሚለውን በነጠላ ቅርጽ ሲጠቀም ሐናንና ቀያፋን ሁለቱንም በስም ይጠቅሳል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: ሐናና ቀያፋ በሊቀ ካህናትነት በነበሩበት ዘመን
  rationale: ἐπί ከዘር አመልካች ጋር እዚህ የጊዜ ማዕቀፍን ያመለክታል። በዋናው ጽሑፍ ያለውን ነጠላ ἀρχιερέως በ“ሊቀ ካህናትነት” በተቋማዊ ነጠላ መልኩ ማቅረብ ተፈጥሯዊ አማርኛንና የግሪኩን ውጥረት ያስጠብቃል።
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: የእግዚአብሔርን ቃል ተቀበለ
  rationale: ይህ የነቢያዊ መገለጥ የመጽሐፍ ቅዱስ ፈሊጥ ነው። “ቃል መጣለት” ቃል በቃል ቢቀርብም በዘመናዊ አማርኛ አነጋገር ሊደበዝዝ ስለሚችል፣ “ተቀበለ” መለኮታዊ መልእክቱ ለዮሐንስ መድረሱን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἐπὶ Ἰωάννην
  choice: ዮሐንስ … ተቀበለ
  rationale: ἐπί ከተሳቢ ጋር ቃሉ ወደ ዮሐንስ መምጣቱን ያመለክታል፤ አማርኛው ሐረግ ዮሐንስን ተቀባይ በማድረግ ይህን ግንኙነት ያስተላልፋል።
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: የዘካርያስ ልጅ ዮሐንስ
  rationale: መለያው ሐረግ የትኛው ዮሐንስ እንደሆነ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: ἔρημος እዚህ ከሰው መኖሪያ የራቀውን የዮሐንስ አገልግሎት አካባቢ ያመለክታል፤ “ምድረ በዳ” በአማርኛ የተለመደና ከአሸዋማ በረሃ ብቻ ያልተወሰነ ቃል ነው።
theological_decisions:
- issue: ሉቃስ ሐናናንና ቀያፋን ሲጠቅስ ነጠላውን ἀρχιερέως እንዴት ማቅረብ እንደሚገባ
  choice: ተቋማዊውን ነጠላ በ“ሊቀ ካህናትነት” ማቆየት
  alternative: “ሐናናና ቀያፋ ሊቃነ ካህናት በነበሩበት ጊዜ”
  rationale: ግሪኩ ሁለት ሰዎችን እየጠቀሰ ἀρχιερέωςን በነጠላ ይጠቀማል። ትርጉሙ ይህን ታሪካዊና ሥነ ጽሑፋዊ ውጥረት ከማስወገድ ይልቅ በዋናው ጽሑፍና በማስታወሻው ያስጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሊቀ ካህናትነት” እና “ምድረ በዳ” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ቢሆኑም በዘመናዊ አንባቢ ዘንድ ሊገቡ የሚችሉ ናቸው።
