  text: የሄኖስ ልጅ፣ የሴት ልጅ፣ የአዳም ልጅ፣ የእግዚአብሔር ልጅ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ በቀጥታ «የሄኖስ፣ የሴት፣ የአዳም፣ የእግዚአብሔር» የሚለውን ቅርጽ ይደግማል፤ «ልጅ» የሚለው ቃል ከዘር ሐረጉ አገባብ ተረድቶ በአማርኛ ተጨምሯል።
