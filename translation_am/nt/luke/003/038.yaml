lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: የሄኖስ ልጅ
  rationale: የግሪኩ የባለቤትነት ቅርጽ በዚህ የዘር ሐረግ ውስጥ ከቀደመው አገባብ የተረዳውን ‘ልጅ’ ያመለክታል፤ ሄኖስም በአማርኛ የተለመደው የስሙ ቅርጽ ነው።
- source_word: τοῦ Σὴθ
  choice: የሴት ልጅ
  rationale: ተደጋጋሚው የግሪክ ቅርጽ የወላጅና የልጅን ዝምድና ያመለክታል፤ ‘ሴት’ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀው የስሙ ቅርጽ ነው።
- source_word: τοῦ Ἀδὰμ
  choice: የአዳም ልጅ
  rationale: Ἀδάμ በዚህ የዘር ሐረግ ውስጥ የግል ስም ስለሆነ ‘ሰው’ ተብሎ ሳይተረጎም ‘አዳም’ ተብሎ ተጠብቋል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የመጨረሻው ሐረግ ከቀደሙት ጋር ተመሳሳይ የግሪክ የባለቤትነት ቅርጽ አለው፤ ስለዚህ በዘር ሐረጉ የተረዳው ‘ልጅ’ በአማርኛም ተገልጿል።
