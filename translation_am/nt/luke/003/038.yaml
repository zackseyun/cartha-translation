- issue: በአዳም የዘር ሐረግ መጨረሻ τοῦ θεοῦን መተርጎም
  choice: የእግዚአብሔር ልጅ
  alternative: የእግዚአብሔር / ከእግዚአብሔር
  rationale: ግሪኩ በቃል ደረጃ ‘የእግዚአብሔር’ ብቻ ቢሆንም፣ በሉቃስ ተደጋጋሚ የዘር ሐረግ አገባብ ‘ልጅ’ የሚለው የታሰበ ነው። ይህ አተረጓጎም አዳም በቀጥታ ከእግዚአብሔር መገኘቱን የሐረጉን አወቃቀር ተከትሎ ያሳያል፤ ከዚያ በላይ የክርስቶስን ልጅነት ልዩ ትርጉም በአዳም ላይ አያስጭንም።
