    text: ወይም፣ «በአሥራ አምስተኛው ዓመት ውስጥ።»
    reason: lexical_alternative
  - marker: b
    text: «ቴትራርክ» በሮማ ሥልጣን ሥር የአንድ ክልል ገዥ የነበረ ማዕረግ ነው።
    reason: cultural_note
