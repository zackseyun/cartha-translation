    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በሉቃስ የዘር ሐረግ ውስጥ ከእያንዳንዱ ስም ጋር የተደጋገመው የግሪክ ባለቤትነት አመልካች ከአውዱ የሚቀጥለውን የወላጅነት ግንኙነት በአጭሩ ያመለክታል፤ በአማርኛ «የ… ልጅ» ማለት ይህን በተፈጥሮና በግልጽ ያስተላልፋል።
- source_word: Συμεὼν
  choice: ስምዖን
