  rationale: የስሙ የተለመደና የታወቀ የአማርኛ ቅርጽ ነው።
- source_word: Ἰωνὰμ
  choice: ዮናም
  rationale: የSBLGNT ንባብ Ἰωνὰμ የመጨረሻውን ሙ ድምፅ ይዞ «ዮናም» ተብሎ በቀጥታ ይተረጎማል፤ ሌላው ቅርጽ በማስታወሻ ተጠብቋል።
- source_word: Ἐλιακὶμ
  choice: ኤልያቄም
  rationale: የሴማዊውን የግል ስም የሚወክል፣ በአማርኛም ግልጽና ተነባቢ የሆነ ቅርጽ ነው።
