  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: am
  text: እርሱም፣ “ከታዘዘላችሁ በላይ ምንም አትሰብስቡ” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ “ከታዘዘላችሁ በላይ ምንም አታድርጉ።” በዚህ ዐውድ ግሱ በተለይ ቀረጥ የመሰብሰብ ሥራቸውን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱም
  rationale: δέ በዚህ ቦታ የትረካውን ቀጣይነት የሚያሳይ ቀላል አያያዥ ነው፤ «-ም» ያለአስፈላጊ ንፅፅር ተፈጥሯዊ ቀጣይነትን ያሳያል።
- source_word: εἶπεν πρὸς αὐτούς
  choice: አላቸው
  rationale: λέγω + πρός የሚለውን ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: Μηδὲν πλέον
  choice: በላይ ምንም አት-
  rationale: ይህ አገላለጽ ከተፈቀደው ወይም ከታዘዘው መጠን ማለፍን ይከለክላል፤ የአማርኛው አወቃቀር ይህን ግልጽ ያደርጋል።
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: ከታዘዘላችሁ በላይ
  rationale: διατεταγμένον የታዘዘውን፣ የተደነገገውን ወይም የተወሰነውን ነገር ያመለክታል። «ከታዘዘላችሁ» የግሱን ተገብሮአዊና ሥልጣናዊ ገጽታ ይጠብቃል።
- source_word: πράσσετε
  choice: አትሰብስቡ
  rationale: πράσσω በጥቅሉ «ማድረግ» ማለት ቢሆንም፣ በቁጥር 12 የተጠቀሱት ቀረጥ ሰብሳቢዎች ስለሆኑ እዚህ የቀረጥ መሰብሰብን ያመለክታል። «አትሰብስቡ» ይህን ዐውዳዊ ፍቺ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: በπράσσετε ውስጥ የተዘዋወረውን ድርጊት ከዐውዱ ግልጽ ማድረግ
  choice: ድርጊቱን እንደ ቀረጥ መሰብሰብ በመግለጽ «አትሰብስቡ» ተብሏል።
  alternative: «ከታዘዘላችሁ በላይ ምንም አታድርጉ» ብሎ በይበልጥ ቃል በቃል መተርጎም።
  rationale: ይህ የእምነት ትምህርት ውዝግብ ሳይሆን የትርጉም ምርጫ ነው። የንግግሩ ተቀባዮች በቀደመው ቁጥር የተጠቀሱት ቀረጥ ሰብሳቢዎች ስለሆኑ፣ በግሪክኛው ውስጥ በዐውድ የሚታወቀውን ድርጊት በአማርኛ ግልጽ ማድረጉ አዲስ ሐሳብ አይጨምርም። ይበልጥ መደበኛው አማራጭ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። «እርሱም» የትረካውን ቀጣይነት ያቆያል፤ «አትሰብስቡ» ደግሞ ከቀደመው ቁጥር የሚታወቀውን የቀረጥ አውድ ግልጽ ያደርጋል።
