  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: am
  text: የሜልያ ልጅ፣ የሜና ልጅ፣ የማታታ ልጅ፣ የናታን ልጅ፣ የዳዊት ልጅ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ፦ “የሜልያ፣ የሜና፣ የማታታ፣ የናታን፣ የዳዊት”። በሉቃስ የዘር ሐረግ ተደጋጋሚ አወቃቀር ውስጥ “ልጅ” የሚለው ቃል በአውዱ ይገባል። የSBLGNT ጽሑፍ እዚህ “ሜና” የሚለውን የስም ቅርጽ ይዟል፤ አንዳንድ ትርጉሞች “ሜናን” የሚል ሌላ ቅርጽ ይከተላሉ።
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በሉቃስ የዘር ሐረግ ውስጥ ተደጋግሞ የመጣው የግሪክ ዝምድና አመልካች በአውዱ ‘የ… ልጅ’ የሚለውን የዘር ግንኙነት ያመለክታል፤ በአማርኛም ይህን ግልጽ ማድረጉ ተፈጥሯዊ ነው።
- source_word: Μελεὰ
  choice: ሜልያ
  rationale: የግሪኩን Μελεά ድምፅ በአማርኛ በቅርብ የሚያስተላልፍ የስም አጻጻፍ ነው።
- source_word: Μεννὰ
  choice: ሜና
  rationale: የSBLGNT ንባብ Μεννάን በቀጥታ የሚከተል ነው፤ ‘ሜናን’ የሚለውን ሌላ የስም ቅርጽ አይከተልም።
- source_word: Ματταθὰ
  choice: ማታታ
  rationale: Ματταθάን በዘመናዊ አማርኛ የስም አጻጻፍ በቅርብ ያንጸባርቃል።
- source_word: Ναθὰμ
  choice: ናታን
  rationale: ግሪኩ Ναθάμ ቢልም፣ ይህ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የሚታወቀውን የናታንን ስም ይጠብቃል።
- source_word: Δαυὶδ
  choice: ዳዊት
  rationale: Δαυίδ በአማርኛ መጽሐፍ ቅዱሳዊ ወግ በተለመደው ‘ዳዊት’ ተተርጉሟል።
theological_decisions:
- issue: በዘር ሐረጉ ውስጥ የተዘለለው የዝምድና ቃል
  choice: በእያንዳንዱ ስም ‘የ… ልጅ’ የሚለውን ማሟላት
  alternative: ‘የሜልያ፣ የሜና፣ የማታታ፣ የናታን፣ የዳዊት’ ብቻ ማለት
  rationale: የግሪኩ ቅርጽ ባለቤትነትን/ዝምድናን በሚያሳይ ተከታታይ መዋቅር ቀደም ብሎ በተመሠረተው የዘር ሐረግ አገባብ ላይ ይደገፋል። ‘ልጅ’ን ማሟላት የአውዱን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል እንጂ አዲስ መረጃ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዘር ሐረጉን ተደጋጋሚ ምት ለመጠበቅ ‘የ… ልጅ’ በእያንዳንዱ ስም ተደግሟል።
