lexical_decisions:
- source_word: τετραάρχης
  choice: የአራተኛው ክፍል ገዥ
  rationale: የግሪኩን ታሪካዊና ፖለቲካዊ ማዕረግ ትርጉም በአማርኛ ግልጽ በሆነ ሐረግ ያቀርባል፤ በቀላሉ «ገዥ» ብቻ በማለት ልዩ ማዕረጉን አያጠፋም።
- source_word: ἐλεγχόμενος
  choice: ይወቀስ ነበር
  rationale: የአሁን ጊዜ ተሳቢ አካል የሚያመለክተውን ቀጣይ ወይም በዚያው ጊዜ የነበረ የሥነ ምግባር ወቀሳ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπ’ αὐτοῦ
  choice: በእርሱ
  rationale: ግሪኩ ዮሐንስን በስም ሳይደግም ተውላጠ ስም ስለሚጠቀም፣ የምንጩን አገላለጽና አውዳዊ ማጣቀሻ ጠብቋል።
- source_word: περὶ Ἡρῳδιάδος
  choice: ስለ ... ሄሮድያዳ
  rationale: περί የሚያመለክተውን «ስለ/በተመለከተ» ግንኙነት በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: የወንድሙ ሚስት
  rationale: ለክሱ ዋና የሆነውን የዝምድናና የጋብቻ ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: እና ሄሮድ ስላደረጋቸው ክፉ ነገሮች ሁሉ
  rationale: ሁለተኛውን περί ግንኙነት፣ የድርጊቶቹን አጠቃላይነትና የሄሮድን የተጠቀሰ ስም ይጠብቃል።
- source_word: πονηρῶν
  choice: ክፉ ነገሮች
  rationale: ሰፊውን የሥነ ምግባር ክፋት ፍቺ በግልጽና ለዘመናዊ አንባቢ በቀላሉ በሚገባ ቃል ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ትረካ ጋር ያለውን ተቃርኖና ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
