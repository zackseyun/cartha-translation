id: LUK.3.14
reference: Luke 3:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: am
  text: ወታደሮችም፣ “እኛስ ምን እናድርግ?” እያሉ ጠየቁት። እርሱም፣ “በማስፈራራት ከማንም ገንዘብ አትቀሙ[a]፤ ማንንም በሐሰት አትክሰሱ፤ ደመወዛችሁም ይብቃችሁ[b]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃሉ በቀጥታ ሰውን ‘መነቅነቅ’ ወይም ማስፈራራትን ሊያመለክት ይችላል፤ እዚህ ግን ኃይልን ወይም ሥልጣንን ተጠቅሞ ገንዘብ መቀማት ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: «ደመወዝ» የተተረጎመው ቃል «ክፍያ» ወይም «ቀለብ» ተብሎም ሊተረጎም ይችላል፤ ቃሉ በተለምዶ ለወታደሮች የሚሰጥ ክፍያንና ስንቅን ያመለክት ነበር።
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: ወታደሮች
  rationale: ቃሉ በወታደራዊ አገልግሎት ላይ ያሉ ሰዎችን ያመለክታል፤ «ወታደሮች» በዐውዱ ተፈጥሯዊና ግልጽ ነው።
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: እኛስ ምን እናድርግ?
  rationale: «እኛስ» የሚለው አገላለጽ καὶ ἡμεῖς ያለውን ‘እኛም/እኛስ’ የሚል አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: διασείσητε
  choice: በማስፈራራት ከማንም ገንዘብ አትቀሙ
  rationale: ግሱ ሥልጣንን ወይም ኃይልን በመጠቀም ሰውን አስፈራርቶ ገንዘብ መቀማትን ያመለክታል፤ ይህ አገላለጽ የግዳጅንና የጥቅምን ገጽታ ግልጽ ያደርጋል።
- source_word: συκοφαντήσητε
  choice: ማንንም በሐሰት አትክሰሱ
  rationale: ቃሉ ሰውን በሐሰት መወንጀልን ወይም መክሰስን ያመለክታል፤ የተመረጠው አገላለጽ ሕጋዊና ማኅበራዊ ዐውዱን በግልጽ ያስተላልፋል።
- source_word: ἀρκεῖσθε
  choice: ይብቃችሁ
  rationale: ትእዛዙ ባላቸው ነገር መርካትንና በቂ አድርጎ መቀበልን ያሳያል፤ «ይብቃችሁ» ተፈጥሯዊና ክብር ያለው አማርኛ ነው።
- source_word: ὀψωνίοις
  choice: ደመወዛችሁ
  rationale: ቃሉ በተለይ ለወታደሮች የሚሰጥ ክፍያን ወይም ቀለብን ሊያመለክት ይችላል፤ በዚህ ዐውድ «ደመወዝ» ለዘመናዊ አንባቢ ግልጽ ነው።
theological_decisions:
- issue: ለወታደሮች የተሰጠው ሥነ ምግባራዊ መመሪያ
  choice: ጽሑፉ ወታደሮቹ ሥልጣናቸውን ተጠቅመው እንዳይቀሙ፣ በሐሰት እንዳይከሱና በክፍያቸው እንዲረኩ በቀጥታ ያዛል።
  alternative: ጥቅሱ ወታደራዊ አገልግሎትን ራሱን በተዘዋዋሪ ይኮንናል።
  rationale: የግሪክ ጽሑፉ ለወታደሮቹ በሥራቸው ውስጥ ሊርቋቸው የሚገቡ በደሎችን ይጠቅሳል፤ ከወታደራዊ አገልግሎት እንዲወጡ ግን አይናገርም። ትርጉሙ ከዚህ በላይ የሆነ የትምህርት ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «እኛስ» የግሪኩን አጽንዖት በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል፤ የሁለቱ ክልከላዎችና የመጨረሻው አዎንታዊ ትእዛዝ ቅደም ተከተልም ተጠብቋል።
