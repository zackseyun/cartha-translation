lexical_decisions:
- source_word: ὄψεται
  choice: ያያል
  rationale: የὁράω የወደፊት ጊዜ ቅርጽ ሲሆን፣ ቀጥተኛውን የማየት ምስላዊ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቆያል።
- source_word: πᾶσα σὰρξ
  choice: ሥጋ የለበሰ ሁሉ
  rationale: ቃል በቃል ‘ሥጋ ሁሉ’ የሚለው በአማርኛ ግልጽ ባለመሆኑ፣ ሰዎችን ሁሉ የሚያመለክተውን ሴማዊና ትንቢታዊ ፈሊጥ በመጠኑ ቀጥተኛ በሆነው ‘ሥጋ የለበሰ ሁሉ’ ተተርጉሟል፤ የኢሳይያስ 40፥5ን የቃላት ግንኙነትም ይጠብቃል።
- source_word: σωτήριον
  choice: ማዳን
