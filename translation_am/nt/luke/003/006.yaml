    text: ወይም፣ “ሰው ሁሉ።” ግሪኩ ቃል በቃል “ሥጋ ሁሉ” ይላል፤ ይህም ኢሳይያስ 40፥5ን ያስተጋባል እና እዚህ ሰዎችን ሁሉ ያመለክታል።
