- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: የግሪኩን የባለቤትነት/ምንጭ አገናኝ በመደበኛው የአማርኛ የ- ቅርጽ ያቆያል፤ ‘ከእግዚአብሔር የሚመጣውን’ የሚለው የምንጭ ትርጉም በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የπᾶσα σὰρξ ፈሊጣዊ ትርጉም
  choice: ሰውን ሁሉ የሚያካትት ሁለንተናዊ የሰው ዘር ወሰን፣ የትንቢታዊውን ‘ሥጋ’ ምስል በማቆየት
  alternative: ቃል በቃል ‘ሥጋ ሁሉ’ ወይም ምስሉን ሙሉ በሙሉ የሚያጠፋ ‘ሰው ሁሉ’
  rationale: ይህ የኢሳይያስ ጥቅስ አካል ስለሆነ ፈሊጡ ሰውን ሁሉ ያመለክታል። ‘ሥጋ የለበሰ ሁሉ’ የቃሉን ትንቢታዊ ድምፅ እና ሰብአዊ ወሰኑን አብሮ ይጠብቃል።
- issue: የτοῦ θεοῦ ግንኙነት
  choice: የእግዚአብሔር ማዳን
  alternative: ከእግዚአብሔር የሚመጣ ማዳን
  rationale: የግሪኩ የዘር ስም ቅርጽ ባለቤትነትንም ምንጭንም ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ ያልተወሰነውን ግንኙነት በ‘የእግዚአብሔር’ ያቆያል፤ የምንጭ ንባቡ በማስታወሻ ተጠቅሷል።
