  verdict: revise
  source_fidelity: The draft correctly represents the future sense of ὄψεται, the universal human referent of πᾶσα σὰρξ, and the genitive ambiguity in τὸ σωτήριον τοῦ θεοῦ. ‘የእግዚአብሔርን ማዳን’ preserves the source construction without narrowing it to source alone.
  naturalness: ‘ሥጋ የለበሰ ሁሉ’ is intelligible, but it is less idiomatic and can sound like a completed action (‘everyone who has put on flesh’). ‘ሥጋ ለባሽ ሁሉ’ is the established elevated Amharic expression, naturally conveys the prophetic idiom, and remains suitable for the biblical register.
  terminology: ‘ማዳን’ is an appropriate rendering of σωτήριον here. ‘እግዚአብሔር’ is the standard biblical designation for θεός. The revised wording preserves the Isaianic ‘flesh’ image while footnote a explains its human reference.
