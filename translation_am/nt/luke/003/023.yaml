theological_decisions:
- issue: ‘እንደሚታሰበው’ ከኢየሱስና ከዮሴፍ ዝምድና ጋር ያለው ግንኙነት
  choice: ቃሉን ከዮሴፍ ልጅነት ሐረግ ጋር በቀጥታ ማያያዝ
