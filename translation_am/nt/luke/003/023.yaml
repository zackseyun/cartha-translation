  rationale: ዮሴፍ አባቱ መሆኑ የሰዎች ግምት እንጂ የተራኪው ባዮሎጂያዊ ማረጋገጫ አለመሆኑን ያሳያል።
- source_word: Ἰωσὴφ τοῦ Ἠλὶ
