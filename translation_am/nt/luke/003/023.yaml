  text: ኢየሱስም ራሱ፣ ሲጀምር[a]፣ ዕድሜው ሠላሳ ዓመት ገደማ ነበር፤ የዮሴፍ ልጅ (እንደሚታሰበው[b]) ነበር፣ ዮሴፍም የኤሊ ልጅ ነበር።
