  rationale: ሉቃስ ቀደም ሲል የተናገረውን የድንግል ፅንሰት ሳይዘነጋ፣ ጥቅሱ የዮሴፍን አባትነት እንደ ሕዝብ ግምት ያቀርባል፤ ከዚያ በላይ ግን አይወስንም።
- issue: ‘አገልግሎቱን’ የሚለውን ቃል መጨመር ወይም አለመጨመር
  choice: በዋናው ጽሑፍ አለመጨመር
  alternative: ‘አገልግሎቱን ሲጀምር’ ብሎ መተርጎም
  rationale: አውዱ ይህን በጽኑ ቢጠቁምም ‘አገልግሎት’ የሚለው ስም በግሪክ ምንጭ የለም፤ ያለው ግልጽነትና አሻሚነት በማስታወሻ ይጠበቃል።
