  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: am
  text: የእሴይ ልጅ፣ የኢዮቤል ልጅ፣ የቦዔዝ ልጅ፣ የሳላ ልጅ፣ የናአሶን ልጅ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: የ… ልጅ
  rationale: በዚህ የዘር ሐረግ አውድ የግሪኩ የባለቤትነት ቅርጽ ከቀደመው «υἱός» ጋር ተያይዞ «የ… ልጅ» የሚለውን ግንኙነት ያመለክታል።
- source_word: Ἰεσσαί
  choice: እሴይ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን የስሙን ቅርጽ ይጠብቃል።
- source_word: Ἰωβήλ
  choice: ኢዮቤድ
  rationale: የSBLGNTን Ἰωβήλ ቅርጽ በቅርብ የድምፅ ሽግግር ያቀርባል፤ ከብሉይ ኪዳን የተለመደው ኦቤድ ቅርጽ ጋር ልዩነቱን ሳይደብቅ የሉቃስን ጽሑፍ ይከተላል።
- source_word: Βόος
  choice: ቦዔዝ
  rationale: በአማርኛ አንባቢዎች ዘንድ የታወቀውን የቦዔዝ ስም ይጠቀማል።
- source_word: Σαλά
  choice: ሳላ
  rationale: የግሪኩን ስም ቀጥተኛና ግልጽ በሆነ የግዕዝ ፊደል ቅርጽ ያቀርባል።
- source_word: Ναασσών
  choice: ነአሶን
  rationale: የግሪኩን የስም ቅርጽ በቅርብ የድምፅ ሽግግር ይወክላል።
theological_decisions:
- issue: የዘር ሐረጉ ግንኙነት
  choice: በእያንዳንዱ ስም «የ… ልጅ» ተደግሟል
  alternative: ስሞቹን ብቻ በ«የ» በማያያዝ መዘርዘር
  rationale: ግሪኩ በዚህ ቁጥር «ልጅ» የሚለውን ቃል ባይደግምም፣ ከቁጥር 23 የሚቀጥለውን የዘር ግንኙነት በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል፤ ከቅርብ ትውልድ በላይ «ዘር» የሚለውን ሰፊ የትውልድ ግንኙነትም ሊያካትት ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ፤ የዘር ሐረጉን ተደጋጋሚ አወቃቀር ጠብቋል።
