  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ሥጋዊ መልክ’ የምንጩን ትክክለኛነት ሲጠብቅ፣ ‘እንደ ርግብ’ ንጽጽሩን ሳይፈታ ያቆያል።
