  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: am
  text: መንፈስ ቅዱስም በአካላዊ መልክ እንደ ርግብ በእርሱ ላይ ወረደ፤ ከሰማይም፣ “አንተ የምወድህ ልጄ ነህ፤ በአንተ ደስ ብሎኛል”[a] የሚል ድምፅ መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል ይበልጥ ቀርቦ፦ “በአንተ ደስ ተሰኘሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: ወረደ
  rationale: የመውረድን አቅጣጫ በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የአኦሪስት ትረካዊ ክስተትነቱንም ይጠብቃል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደ፣ ግልጽና ትክክለኛ አገላለጽ ነው።
- source_word: σωματικῷ εἴδει
  choice: በሥጋዊ መልክ
  rationale: የሚታይና አካላዊ መገለጥን በቀጥታ ይገልጣል፤ ጉዳዩን ውስጣዊ ልምምድ ብቻ አድርጎ አያቀርብም።
- source_word: ὡς περιστερὰν
  choice: እንደ ርግብ
  rationale: ὡς የሚያመለክተውን ንጽጽር ይጠብቃል፤ መንፈስ ቅዱስ በቃል ትርጉሙ ርግብ ሆነ የሚል ጠንካራ ድምዳሜ አያስገባም።
- source_word: ἐπ’ αὐτόν
  choice: በእርሱ ላይ
  rationale: ወደ ኢየሱስ ላይ የሆነውን መውረድ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: ከሰማይም … የሚል ድምፅ መጣ
  rationale: γενέσθαι ከφωνή ጋር የሚገልጸውን የድምፅ መከሰት በአማርኛ ተፈጥሯዊ በሆነ ትረካዊ አገላለጽ ያቀርባል።
- source_word: Σὺ εἶ
  choice: አንተ … ነህ
  rationale: ግልጽ ተውላጠ ስሙን በማቆየት የቀጥታ ንግግሩን አጽንዖት ይጠብቃል።
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: የምወድህ ልጄ
  rationale: የባለቤትነቱንና የἀγαπητόςን የፍቅር ትርጉም በዘመናዊ፣ ክብር ባለውና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν σοὶ
  choice: በአንተ
  rationale: የἐνን ቅርብ ትርጉም ይጠብቃል፤ ወደ ‘ከአንተ ጋር’ በመቀየር ግንኙነቱን አያላላም።
- source_word: εὐδόκησα
  choice: ደስ ብሎኛል
  rationale: የመለኮታዊውን ደስታና ሞገስ በዘመናዊ አማርኛ ተፈጥሯዊ ሁኔታዊ አገላለጽ ያቀርባል፤ የአኦሪስቱ ይበልጥ ቅርብ የሆነ አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የመንፈስ ቅዱስ መገለጥ ባሕርይ
  choice: መንፈስ ቅዱስ እንደ ርግብ በሥጋዊ መልክ እንደወረደ ቀርቧል።
  alternative: መንፈስ ቅዱስ በቃል ትርጉሙ ርግብ ሆኖ ወረደ።
  rationale: σωματικῷ εἴδει ὡς περιστερὰν የሚታይ መገለጥን ከንጽጽር ጋር ያጣምራል። ‘እንደ ርግብ’ ማለት የግሪኩን ንጽጽር ይጠብቃል፣ ጽሑፉ ከሚለውም በላይ ስለ መንፈስ ቅዱስ ባሕርይ አይወስንም።
- issue: የεὐδόκησα ጊዜያዊና ትርጉማዊ ኃይል
  choice: በዋናው ጽሑፍ ‘ደስ ብሎኛል’ ተብሎ የአሁኑን የጸና ደስታ በተፈጥሯዊ አማርኛ ተገልጿል።
  alternative: በአንተ ደስ ተሰኘሁ።
  rationale: የግሪኩ አኦሪስት በይበልጥ ቀጥተኛ መንገድ እንደ ያለፈ ክስተት ሊተረጎም ይችላል፤ ሆኖም በዚህ መግለጫ ውስጥ ‘ደስ ብሎኛል’ የተረጋጋውን ሞገስ በተፈጥሯዊ አማርኛ ያስተላልፋል። የጊዜ ልዩነቱ እንዳይጠፋ ቀጥተኛው አማራጭ በማስታወሻ ተቀምጧል።
