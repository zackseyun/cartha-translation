  terminology: መንፈስ ቅዱስ, ርግብ, ልጄ, and the direct-address formulation are suitable. የምወድህ ልጄ naturally expresses “my Son, whom I love/beloved Son” in this context. Replacing ሥጋዊ with አካላዊ avoids an unwanted “carnal” implication.
  issues:
