  source_fidelity: The draft accurately conveys the Spirit's descent, the dove comparison, the descent upon Jesus, and the heavenly declaration. However, ሥጋዊ can carry the modern sense “fleshly/carnal,” which is not the intended sense of σωματικῷ here. አካላዊ more clearly communicates bodily form. The aorist εὐδόκησα is adequately represented by the main-text perfect/state expression, with its past-oriented alternative retained in the note.
