  text: የማቱሳላ ልጅ፣ የሄኖክ ልጅ፣ የያሬድ ልጅ፣ የመላልኤል ልጅ፣ የቃይናም[a] ልጅ፣
  philosophy: optimal-equivalence
  footnotes:
