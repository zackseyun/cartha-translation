  choice: የ… ልጅ
  rationale: በሉቃስ የዘር ሐረግ ውስጥ ከእያንዳንዱ ስም ጋር የተደገመው የግሪክ ዝምድና አመልካች፣ ከቀደመው አውድ የሚታወቀውን ‘ልጅ’ የሚለውን ሐሳብ ይቀጥላል። በአማርኛ ‘የ… ልጅ’ ማለት ዝምድናውን ግልጽና ተፈጥሯዊ ያደርገዋል።
