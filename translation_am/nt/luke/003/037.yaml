    text: የግሪኩ ጽሑፍ Καϊνάμ (ቃይናም) ይላል። ስሙ በሌሎች የአጠራር ወይም የትርጉም ቅርጾች ‘ቃይናን’ ወይም ‘ካይናን’ ሊባል ይችላል፤ ከብሉይ ኪዳን የዘር ሐረጎች ጋር ሲስማማ ደግሞ ‘ቄናን’ ተብሎ ሊቀርብ ይችላል። የሉቃስ የግሪክ ጽሑፍ ይህን ስም ያካትታል።
    reason: alternative_reading
lexical_decisions:
