  rationale: የSBLGNT ግሪክ ጽሑፍ Καϊνάμ የሚለውን ስም ይዟል። ስለዚህ ስሙ ሳይወገድና ከሌላ የዘር ሐረግ ጋር ሳይስማማ ተጠብቋል፤ ሌላው የስም ቅርጽ በማስታወሻ ተገልጿል።
