id: LUK.3.9
reference: Luke 3:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: am
  text: ቀድሞውኑም መጥረቢያው በዛፎች ሥር ላይ ተቀምጧል፤ ስለዚህ መልካም ፍሬ የማያፈራ ዛፍ ሁሉ ይቆረጣል፤ ወደ እሳትም ይጣላል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: አሁንም
  rationale: የግሥጋሴውን ቀጣይነትና የፍርዱን ቅርበት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ ἀξίνη
  choice: ምሳሩ
  rationale: ዛፍ ለመቁረጥ የሚያገለግለውን መሣሪያ በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: በዛፎቹ ሥር ላይ ተቀምጧል
  rationale: ምሳሩ ለመቁረጥ ተዘጋጅቶ በሥሩ አጠገብ መኖሩን የሚያሳየውን ምስል ይጠብቃል፤ κεῖταιን ያለ አስፈላጊ ምክንያት ንቁ ድርጊት አያደርገውም።
- source_word: πᾶν οὖν δένδρον
  choice: ስለዚህ ... ዛፍ ሁሉ
  rationale: οὖν የሚያሳየውን ውጤታዊ ግንኙነት እና πᾶν ያለውን ሁሉን አቀፍነት በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: መልካም ፍሬ የማያፈራ
  rationale: ከፍሬ ጋር የሚስማማውን ተፈጥሯዊ የአማርኛ ግሥ በመጠቀም የሥነ ምግባርና የመንፈሳዊ ውጤት ምሳሌውን ይጠብቃል።
- source_word: ἐκκόπτεται
  choice: ተቆርጦ
  rationale: በዛፍ ምሳሌው ውስጥ መቆረጥን በግልጽ ያሳያል፤ ከሚከተለው ተገብሮ ግሥ ጋር በተፈጥሯዊ ሁኔታ ተያይዟል።
- source_word: εἰς πῦρ βάλλεται
  choice: ወደ እሳት ይጣላል
  rationale: የግሪኩን አቅጣጫና ተገብሮ የተገለጸውን ከባድ ፍርድ በዘመናዊና ግልጽ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የፍርድ ምሳሌያዊ ምስል
  choice: ምሳሩ፣ ዛፎቹና እሳቱ የሚያቀርቡትን የቀረበ ከባድ ፍርድ ምስል እንዳለ ማቆየት
  alternative: እሳቱን በቀጥታ ሲኦል ብሎ መተርጎም፣ ወይም ምስሉን በእስራኤል ላይ ብቻ የሚደርስ ታሪካዊ ፍርድ ብሎ መገደብ
  rationale: ጥቅሱ ከባድና የቀረበ ፍርድን በግልጽ ያሳያል፤ ነገር ግን እሳቱ ጊዜያዊ ፍርድን፣ የመጨረሻ ፍርድን ወይም ሁለቱንም እንደሚያመለክት በዚህ ጥቅስ ብቻ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምሳሌያዊ ምስልና የፍርዱ አጣዳፊነት ተጠብቀዋል። በአማርኛ ውስጥ ትርጉማዊ ጠቀሜታ የማይጨምሩ የእንግሊዝኛ አጻጻፍ አማራጮች የግርጌ ማስታወሻ አልተደረጉላቸውም።
