  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ውስጣዊው ጥያቄ በጥቅስ ምልክት ቀርቦ የμήποτε እና εἴηን ጥርጣሬ ጠብቋል።
