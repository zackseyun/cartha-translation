  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: am
  text: ሕዝቡ በጉጉት እየጠበቀ ሳለ፣ ሁሉም በልባቸው ስለ ዮሐንስ፣ “ምናልባት እርሱ መሲሑ[a] ይሆን?” እያሉ ያሰላስሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶሱ።” በግሪክ፦ ሆ ክሪስቶስ።
    reason: alternative_reading
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: በተስፋ እየጠበቀ ሳለ
  rationale: የተስፋ ጉጉት ያለበትን ቀጣይ መጠበቅ ይገልጣል፤ የግሪኩን ጄኒቲቭ አብሶሉት በተፈጥሯዊ የአማርኛ የጊዜ ንዑስ ሐረግ ያቀርባል።
- source_word: δὲ
  choice: በአወቃቀሩ የተገለጸ
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን ቀላል የትረካ ሽግግር ነው፤ በአማርኛ የሐረጉ ቅደም ተከተል ይህን በቂ ስለሚገልጥ ተጨማሪ “አሁን” አልገባም።
- source_word: λαοῦ
  choice: ሕዝቡ
  rationale: ቃሉ ሰዎቹን በአንድ ማኅበር የሚጠቅስ ሲሆን “ሕዝቡ” ቀጥተኛና በዐውዱ የሚስማማ ነው።
- source_word: διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν
  choice: ሁሉም … ብለው በልባቸው ያስቡ ነበር
  rationale: የሁሉንም ውስጣዊ ማሰብና መመርመር ያቆያል፤ “በልባቸው” የመነሻውን ምሳሌያዊ አነጋገር ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: περὶ τοῦ Ἰωάννου
  choice: ስለ ዮሐንስ
  rationale: περί ከጄኒቲቭ ጋር ያለውን “ስለ/በተመለከተ” ትርጉም በተለመደ አማርኛ ይገልጣል።
- source_word: μήποτε αὐτὸς εἴη
  choice: ምናልባት እርሱ … ይሆን?
  rationale: μήποτε እና ኦፕታቲቭ εἴη የሚያሳዩትን ጥርጣሬና እድል በውስጣዊ ጥያቄ መልክ ይጠብቃል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: በዚህ ዐውድ ቃሉ የተጠበቀውን የተቀባ ንጉሥ/አዳኝ የሚጠቁም ማዕረግ ነው፤ “መሲሑ” ይህን የአይሁድ መሲሐዊ ተስፋ በግልጽ ያሳያል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶሱ
  rationale: ሕዝቡ ዮሐንስ የሚጠበቀው መሲሕ መሆኑን እያሰበ ስለሆነ፣ ቃሉ እዚህ እንደ ስም ሳይሆን እንደ ማዕረግ ይሠራል።
