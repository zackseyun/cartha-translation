  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ምድረ በዳ’ ነቢያዊውን ድምፀት ይጠብቃል፤ አሻሚው የሐረግ ትስስርና የκύριος/YHWH ልዩነት በማስታወሻዎች ተጠብቀዋል።
