  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: am
  text: በነቢዩ ኢሳይያስ ቃላት መጽሐፍ ውስጥ እንደተጻፈው፦ “በምድረ በዳ የሚጮኽ ሰው ድምፅ፦ ‘የጌታን መንገድ አዘጋጁ[a]፤ ጎዳናዎቹን ቀጥ አድርጉ።’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔርን መንገድ።” ይህ ጥቅስ ኢሳይያስ 40፥3ን ያስተጋባል፤ በዚያም የዕብራይስጡ ጽሑፍ የመለኮት ስም YHWH ይላል።
    reason: alternative_reading
  - marker: b
    text: “በምድረ በዳ” የሚለው ሐረግ እዚህ እንደቀረበው ከ“የሚጮኽ” ጋር ወይም ከሚከተለው ትእዛዝ ጋር ሊያያዝ ይችላል፦ “የሚጮኽ ሰው ድምፅ፦ ‘በምድረ በዳ የጌታን መንገድ አዘጋጁ።’”
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: እንደተጻፈው
  rationale: ቅዱስ ጽሑፍን የሚያስተዋውቀውን የተለመደ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ የተጻፈው ቃል አሁንም ጸንቶ መኖሩንም ያመለክታል።
- source_word: βίβλῳ λόγων
  choice: የቃላት መጽሐፍ
  rationale: ሉቃስ የተጠቀመባቸውን ሁለቱንም ስሞች ይጠብቃል፤ ‘መጽሐፍ’ የጥንቱን ጥቅልል ጨምሮ ጽሑፋዊ ሰነድን በተለመደ አማርኛ ይገልጣል።
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: በነቢዩ ኢሳይያስ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በአማርኛ ተፈጥሯዊ በሆነ አወቃቀር ያቀርባል።
- source_word: Φωνὴ βοῶντος
  choice: የሚጮኽ ሰው ድምፅ
  rationale: የተሳቢውን ግላዊ ትርጉም ግልጽ ያደርጋል፤ ‘ይጮኻል’ የሚለው ግስ ከፍ ባለ ድምፅ መጥራትን ያሳያል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: የነቢያዊውን የበረሃ አውድና የዮሐንስን ስፍራ የሚያስታውስ ክቡርና የተለመደ አገላለጽ ነው።
- source_word: Ἑτοιμάσατε
  choice: አዘጋጁ
  rationale: የብዙ ቁጥር ትእዛዙን በቀጥታና ተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: τὴν ὁδὸν κυρίου
  choice: የጌታን መንገድ
  rationale: የመንገድ ዝግጅትን ነቢያዊ ምሳሌ ይጠብቃል፤ κύριοςንም ከግሪኩ በቀጥታ ‘ጌታ’ ብሎ ያቀርባል።
- source_word: εὐθείας ποιεῖτε
  choice: ቀጥ አድርጉ
  rationale: የግሪኩን ገላጭ ቅጽና የትእዛዝ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰς τρίβους αὐτοῦ
  choice: ጎዳናዎቹን
  rationale: ከ‘መንገድ’ ጋር ያለውን ትይዩነት እየጠበቀ τρίβοι የሚያመለክተውን የመጓጓዣ መስመር በተፈጥሯዊ ቃል ይተረጉማል።
theological_decisions:
- issue: በኢሳይያስ ጥቅስ ውስጥ በመነሻው YHWHን የሚያመለክተውን κύριος መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የሉቃስ ግሪክ ጽሑፍ κύριος ስለሚል ዋናው ጽሑፍ ‘ጌታ’ ይላል። የኢሳይያስ 40፥3 ዕብራይስጥ ግን YHWH እንደሚል በማስታወሻ ተጠብቋል፤ ይህም የክርስቶስን አንድምታ ያለ ትርጓሜያዊ ማስገደድ ክፍት ያደርገዋል።
- issue: ἐν τῇ ἐρήμῳ ከ‘የሚጮኽ’ ወይም ከ‘አዘጋጁ’ ጋር መያያዙ
  choice: ከ‘የሚጮኽ’ ጋር ማያያዝ
  alternative: “የሚጮኽ ሰው ድምፅ፦ ‘በምድረ በዳ የጌታን መንገድ አዘጋጁ’”
  rationale: በሉቃስ የግሪክ አቀራረብና በዮሐንስ የበረሃ አገልግሎት አውድ መሠረት ሐረጉ ከ‘የሚጮኽ’ ጋር ተያይዟል፤ ሆኖም ከቀጣዩ ትእዛዝ ጋር ሊያያዝ የሚችለው እውነተኛ የአገባብ አሻሚነት በማስታወሻ ተገልጿል።
