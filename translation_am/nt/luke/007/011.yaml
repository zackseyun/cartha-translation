  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: am
  text: ከዚህም በኋላ[a] ወደ ናይን የምትባል ከተማ ሄደ፤ ደቀ መዛሙርቱና ብዙ ሕዝብም ከእርሱ ጋር ይሄዱ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ «በማግስቱ» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: በተፈጥሯዊው የአማርኛ ትረካ አወቃቀር ውስጥ ተዋሕዷል
  rationale: ይህ የሉቃስ የተለመደ የትረካ መክፈቻ ነው። «እንዲህም ሆነ» ተብሎ ቃል በቃል ቢተረጎም በዘመናዊ አማርኛ ከባድ ስለሚሆን፣ የትረካ ተግባሩ «ከዚያም» በሚለው መሸጋገሪያ ተጠብቋል።
- source_word: ἐν τῷ ἑξῆς
  choice: ብዙም ሳይቆይ
  rationale: የSBLGNT ንባብ ἐν τῷ ἑξῆς ቀጥሎ ባለው ጊዜ፣ ማለትም «ብዙም ሳይቆይ» የሚል ትርጉም ይሰጣል። «በማግስቱ» የሚለው የተለየ የእጅ ጽሑፍ ንባብ በግርጌ ማስታወሻ ተቀምጧል።
- source_word: ἐπορεύθη
  choice: ሄደ
  rationale: የመሄድን ድርጊት በተፈጥሯዊና ቀጥተኛ ዘመናዊ አማርኛ ይገልጻል።
- source_word: εἰς πόλιν
  choice: ወደ…ከተማ
  rationale: πόλις ከተማን ወይም መንደርን ሊያመለክት ቢችልም፣ «ከተማ» በአማርኛ የተለመደና ክብር ያለው አጠቃላይ ቃል ነው፤ «ወደ» ደግሞ εἰςን ያንጸባርቃል።
- source_word: καλουμένην Ναΐν
  choice: ናይን ወደምትባል
  rationale: የቦታውን ስም በግእዝ ፊደል በድምፅ አቀራረብ ያቀርባል፤ καλουμένην ደግሞ «የምትባል» ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: συνεπορεύοντο
  choice: ከእርሱ ጋር ይሄዱ ነበር
  rationale: ያልተጠናቀቀው የግሪክ ግስ ቀጣይነት ያለውን አብሮ መጓዝ ያሳያል፤ «ይሄዱ ነበር» ይህን ቀጣይነት ይጠብቃል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ንግግር የታወቀ፣ ክብር ያለውና በቀላሉ የሚገባ አገላለጽ ነው።
- source_word: ὄχλος πολύς
  choice: ብዙ ሕዝብ
  rationale: የሰዎቹን ብዛት በተፈጥሯዊ አማርኛ ይገልጻል፤ በዚህ አውድ «ሕዝብ» ማለት የተሰበሰበ ብዙ ሰው ማለት ነው።
