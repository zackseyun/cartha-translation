  terminology: በዘይት, በሽቶ, and ቀባ are suitable choices. In particular, ቀባ avoids importing a formal consecratory sense into a context of hospitality and honor. The footnote appropriately retains ‘fragrant oil’ and ‘fragrant ointment’ as alternatives for μύρον.
