  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: am
  text: አንተ ራሴን በዘይት አልቀባኸውም፤ እሷ ግን እግሮቼን በሽቶ[a] ቀባቻቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መዓዛ ባለው ዘይት» ወይም «መዓዛ ባለው ቅባት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: በዘይት
  rationale: የመሣሪያን ወይም የአድራጎትን ዘዴ የሚገልጽ ዳቲቭ ነው፤ «ዘይት» በዐውዱ ተፈጥሯዊና በቂ ሲሆን «የወይራ ዘይት» ማለት ከምንጩ ይልቅ ዝርዝር ይጨምራል።
- source_word: ἤλειψας / ἤλειψεν
  choice: አልቀባህም / ቀባች
  rationale: ἀλείφω ዘይትን ወይም ሽቶን በሰውነት ላይ መቀባትን ያመለክታል። «ቀባ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን በዚህ የእንግዳ አክብሮት ዐውድ ውስጥ ከልክ ያለፈ ሥርዓታዊ ትርጉም አይጭንም።
- source_word: τὴν κεφαλήν μου
  choice: ራሴን
  rationale: የቀጥታ ተሳቢውንና የባለቤትነት ተውላጠ ስሙን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: αὕτη δὲ
  choice: እሷ ግን
  rationale: αὕτη በቦታው ያለችውን ሴት አጽንዖት ሰጥቶ ያመለክታል፤ «እሷ ግን» ከቀደመው «አንተ» ጋር ያለውን ንጽጽር ግልጽ ያደርጋል።
- source_word: μύρῳ
  choice: በሽቶ
  rationale: μύρον መዓዛ ያለውን ዘይት ወይም ቅባት ያመለክታል። «ሽቶ» በአማርኛ አጭርና ተፈጥሯዊ ሲሆን ከተራው ዘይት ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: τοὺς πόδας μου
  choice: እግሮቼን
  rationale: ብዙ ቁጥር ያለውን ቀጥተኛ ተሳቢና የመጀመሪያ መደብ ባለቤትነትን በቀጥታ ይገልጻል።
theological_decisions:
- issue: ኢየሱስ በሰጠው ተግሣጽ ውስጥ ያለው የማኅበራዊ ክብር ንጽጽር
  choice: የእንግዳ አክብሮትን ንጽጽር በቀላሉና በግልጽ ማቅረብ፤ ἀλείφωን «ቀባ» ብሎ መተርጎም።
  alternative: ሥርዓታዊ ቅባትን ወይም መቀደስን የሚያመለክት ይበልጥ ሥነ መለኮታዊ ቃል መጠቀም።
  rationale: አፋጣኝ ዐውዱ ስምዖን ያላደረገውን የእንግዳ አክብሮት ከሴቲቱ እጅግ የበዛ ክብር ጋር ያነጻጽራል። ትርጉሙ ከምንጩ ያልተገኘ ምሥጢራዊ ወይም ሥርዓተ እምነታዊ ፍቺ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አንተ … እሷ ግን» የሚለው አወቃቀር በግሪክ ያለውን አጽንዖታዊ ንጽጽር ይጠብቃል።
