  naturalness: The sentence order and the woman-directed imperative are natural modern standard Amharic. Correcting the feminine agreement makes the central declaration grammatically clear and natural.
  terminology: «እምነት» and «ድነት/ማዳን» appropriately retain the source-contextual salvation sense without excluding the verb’s healing sense. The audit-trail alternative for πίστις should also be retained in a footnote.
