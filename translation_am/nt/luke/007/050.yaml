  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὴν γυναῖκα· Ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: am
  text: እርሱም ሴቲቱን፣ «እምነትሽ[a] አድናሻለች[b]፤ በሰላም ሂጂ» አላት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መታመንሽ።» በዚህ አውድ «ታማኝነትሽ» የሚለው ትርጉም እምብዛም አይመስልም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ፈውሳሻለች» ወይም «ደህና አድርጋሻለች።» የግሪኩ ግስ «ማዳን፣» «መታደግ» ወይም «መፈወስ» ሊያመለክት ይችላል፤ እዚህ ግን አውዱ ይቅርታንና ድነትን ያጎላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς τὴν γυναῖκα
  choice: እርሱም ሴቲቱን … አላት
  rationale: δέ ቀላል የትረካ ቅጥያ ስለሆነ በ«-ም» ተገልጧል፤ πρὸς τὴν γυναῖκα በተፈጥሯዊ አማርኛ «ሴቲቱን … አላት» ተብሏል።
- source_word: Ἡ πίστις σου
  choice: እምነትሽ
  rationale: πίστις እዚህ ለኢየሱስ ያላትን የመታመን ምላሽ ያመለክታል፤ «እምነት» ይህን በተለመደና ክብር ባለው ቋንቋ ያስተላልፋል።
- source_word: σέσωκέν σε
  choice: አድኖሻል
  rationale: የσῴζω ፍጹም ጊዜ የተፈጸመና ውጤቱ የሚቀጥል ድነትን ያሳያል። በአውዱ የኃጢአት ይቅርታ ዋና ስለሆነ «አድኖሻል» ተመርጧል።
- source_word: πορεύου εἰς εἰρήνην
  choice: በሰላም ሂጂ
  rationale: የግሪኩ አገላለጽ በአማርኛ በተፈጥሯዊ ሁኔታ «በሰላም ሂጂ» ይባላል፤ የሴት ነጠላ ትእዛዝም ተጠብቋል።
theological_decisions:
- issue: በይቅርታና በድነት አውድ ውስጥ የσῴζω ትርጉም
  choice: አድኖሻል
  alternative: ፈውሶሻል / ደህና አድርጎሻል
  rationale: ሉቃስ 7፥36–50 በዋናነት የኃጢአት ይቅርታንና ሴቲቱ ለኢየሱስ የሰጠችውን የእምነት ምላሽ ያጎላል። ስለዚህ «አድኖሻል» የቃሉን ሰፊ የድነት ክብደት ይጠብቃል፤ የፈውስ ትርጉሙ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ቅደም ተከተል ወደ ተፈጥሯዊ የአማርኛ አወቃቀር ተለውጧል።
