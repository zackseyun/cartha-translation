- from: ስለ ኢየሱስም በሰማ ጊዜ፣ መጥቶ ባሪያውን[a] እንዲያድንለት ሊለምነው የአይሁድ ሽማግሌዎችን ወደ እርሱ ላከ።
  to: ስለ ኢየሱስ በሰማ ጊዜ፣ እንዲመጣና ባሪያውን[a] እንዲያድን እንዲለምኑት የአይሁድ ሽማግሌዎችን ወደ እርሱ ላከ።
  rationale: The revision uses an idiomatic Amharic purpose clause to state plainly that the Jewish elders were sent to ask Jesus to come and save the centurion’s slave. It preserves the source’s narrative content, the social force of δοῦλος, and the broader sense of διασώσῃ.
