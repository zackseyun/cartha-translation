  language: am
  text: ስለ ኢየሱስ በሰማ ጊዜ፣ እንዲመጣና ባሪያውን[a] እንዲያድን እንዲለምኑት የአይሁድ ሽማግሌዎችን ወደ እርሱ ላከ።
