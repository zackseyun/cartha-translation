- source_word: περὶ τοῦ Ἰησοῦ
  choice: ስለ ኢየሱስ
  rationale: περί ከጄኒቲቭ ጋር «ስለ» ወይም «በተመለከተ» ማለት ነው፤ «ስለ ኢየሱስ» ግልጽና የተለመደ ነው።
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: ወደ እርሱ ላከ
  rationale: ግሱንና አቅጣጫውን በቀጥታ ያስተላልፋል፤ የተላኩት ሰዎች በቀጣዩ ሐረግ ተገልጸዋል።
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: የአይሁድ ሽማግሌዎችን
  rationale: πρεσβύτεροι እዚህ የማኅበረሰቡን እውቅና ያገኙ መሪዎች ያመለክታል እንጂ በዕድሜ የገፉ ሰዎችን ብቻ አይደለም።
- source_word: ἐρωτῶν αὐτὸν
  choice: ሊለምነው
  rationale: አሳታፊው የመላኩን ዓላማና የመቶ አለቃውን ጥያቄ ያሳያል፤ ነጠላ ቁጥሩን በመጠበቅ ጥያቄው የመቶ አለቃው መሆኑን ያሳያል።
- source_word: ὅπως ἐλθὼν
  choice: መጥቶ … እንዲ…
  rationale: ὅπως ከሰብጃንክቲቭ ጋር የጥያቄውን የታሰበ ውጤት ያሳያል፤ ἐλθών ደግሞ መዳኑ ከመምጣቱ ጋር እንደሚከተል ይገልጻል።
- source_word: διασώσῃ
  choice: እንዲያድንለት
  rationale: διασῴζω «ማዳን፣ መታደግ፣ በሰላም ማሳለፍ» የሚል ሰፊ ትርጉም አለው፤ በአውዱ የአካል ሕመምን ቢመለከትም «ማዳን» የግሪኩን ስፋት ሳያጠብ ይጠብቃል።
- source_word: τὸν δοῦλον αὐτοῦ
  choice: ባሪያውን
  rationale: δοῦλος በዚህ የቤተሰብ አውድ በመቶ አለቃው ሥልጣንና ባለቤትነት ሥር የነበረውን ሰው ያመለክታል፤ «ባሪያ» የታሰረውን ማኅበራዊ ሁኔታ ከ«አገልጋይ» ይልቅ በግልጽ ይጠብቃል።
theological_decisions:
- issue: በቤት ውስጥ አውድ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ቃሉ አገልግሎትን ብቻ ሳይሆን በጌታ ሥልጣን ሥር ያለውን የታሰረ ማኅበራዊ ሁኔታ ሊገልጽ ይችላል። በዚህ አውድ «ባሪያ» ያንን እውነታ ይጠብቃል፤ ባህላዊውና አገልግሎትን አጉልቶ የሚያሳየው «አገልጋይ» ግን በማስታወሻ ተጠብቋል።
- issue: διασώσῃ በሕመም አውድ
  choice: እንዲያድንለት
  alternative: እንዲፈውስለት
  rationale: አውዱ ፈውስን ቢያመለክትም የግሪኩ ግስ ከ«መፈወስ» የሰፋ ሲሆን ማዳንንና መታደግንም ያካትታል። «ማዳን» የቃሉን ስፋትና የአውዱን አካላዊ አደጋ አብሮ ይጠብቃል።
