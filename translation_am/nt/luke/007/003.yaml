review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies Jesus, the Jewish elders, and the centurion’s enslaved household member, and it reasonably retains the broad sense of διασώσῃ as “save.” However, the current purpose construction is syntactically awkward and leaves the requested action less direct than the Greek: the elders are sent with the request that Jesus come and save the slave.'
  naturalness: “ስለ ኢየሱስም በሰማ ጊዜ” and especially “መጥቶ … ሊለምነው” are understandable but not the most natural modern standard Amharic phrasing. A finite purpose clause makes the sequence and request clear.
  terminology: “የአይሁድ ሽማግሌዎች” is appropriate for πρεσβυτέρους τῶν Ἰουδαίων. “ባሪያ” appropriately reflects δοῦλος in this household and social setting; the alternative “አገልጋይ” should remain footnoted. “እንዲያድን” preserves the lexical breadth of διασώσῃ without prematurely narrowing it to healing.
  issues:
  - severity: medium
    issue: The purpose/request construction is awkward and obscures the relation between the elders’ mission and Jesus’ requested action.
    rationale: “መጥቶ ባሪያውን እንዲያድንለት ሊለምነው” is grammatically strained in modern Amharic. “እንዲመጣና ባሪያውን እንዲያድን እንዲለምኑት” clearly expresses the content of the request while preserving the source meaning.
  - severity: low
    issue: The temporal opening is somewhat calqued.
    rationale: “ስለ ኢየሱስ በሰማ ጊዜ” is more idiomatic than placing the connective enclitic directly on “ኢየሱስ” before the temporal clause.
  - severity: low
    issue: The dative suffix in “እንዲያድንለት” can sound unnecessarily indirect.
    rationale: The direct object “ባሪያውን” already conveys that it is his slave whom Jesus is asked to save. Removing -ለት yields a cleaner and more direct expression.
  revised_text: ስለ ኢየሱስ በሰማ ጊዜ፣ እንዲመጣና ባሪያውን[a] እንዲያድን እንዲለምኑት የአይሁድ ሽማግሌዎችን ወደ እርሱ ላከ።
