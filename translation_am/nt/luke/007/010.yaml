id: LUK.7.10
reference: Luke 7:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: am
  text: የተላኩትም ወደ ቤቱ ተመልሰው፣ ባሪያውን[a] ጤናማ ሆኖ አገኙት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋዩን።” የግሪኩ δοῦλος (ዱሎስ) እንደ አውዱ “ባሪያ” ወይም “አገልጋይ” ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: በተመለሱ ጊዜ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ግስ በፊት የሆነውን ድርጊት በጊዜያዊ ሁኔታ ያሳያል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: εἰς τὸν οἶκον
  choice: ወደ ቤቱ
  rationale: εἰς ወደ ስፍራው የሚደረግን እንቅስቃሴ ያመለክታል፤ ‘ቤቱ’ የተወሰነውን ስፍራ ሳይተረጉም ይጠብቃል።
- source_word: οἱ πεμφθέντες
  choice: የተላኩት
  rationale: የግሪኩን ተደራጊ አገላለጽ ይጠብቃል፤ ‘መልእክተኞች’ የሚል በጽሑፉ ያልተገለጸ ስም አይጨምርም።
- source_word: εὗρον
  choice: አገኙት
  rationale: በትረካዊው አውድ የεὑρίσκωን መደበኛ ትርጉም ይሰጣል፤ የነገሩንም ተሳቢነት በአማርኛ በተፈጥሮ ያሳያል።
- source_word: τὸν δοῦλον
  choice: ባሪያውን
  rationale: δοῦλος በዚህ አውድ በባለመቶ ሥልጣን ሥር ያለውንና ነፃ ያልሆነውን ማኅበራዊ ደረጃ ያመለክታል፤ ‘ባሪያ’ ይህን ትርጉም ከ‘አገልጋይ’ ይበልጥ በግልጽ ይጠብቃል።
- source_word: ὑγιαίνοντα
  choice: ጤነኛ ሆኖ
  rationale: ὑγιαίνω ጤናማ መሆንን ያመለክታል፤ ‘ተፈውሶ’ ከማለት ይልቅ የግሪኩን ቀጥተኛ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በፈውስ ትረካ ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: በትረካው ውስጥ የግለሰቡ በባለመቶው ሥልጣን ሥር መሆን ግልጽ ነው፤ ስለዚህ ‘ባሪያ’ የግሪኩን ማኅበራዊ ክብደት ይጠብቃል። ባህላዊውና በአንዳንድ አውድ ሊሆን የሚችለው ‘አገልጋይ’ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ የጊዜ ቅደም ተከተልና ተደራጊ አገላለጽ ተጠብቀዋል። የማስታወሻው ምልክት δοῦλος ከተተረጎመበት ‘ባሪያውን’ ቀጥሎ ተቀምጧል።
