  verdict: revise
  source_fidelity: 'The draft accurately represents the woman standing behind Jesus near his feet, weeping, wetting his feet with tears, wiping them with her hair, kissing them, and applying μύρον. However, «ደጋግማ» makes repeated kissing explicit in the main text, whereas the intensive verb and imperfect can suggest this but need not be resolved there. More importantly, «ሽቱውን ... ትቀባቸው» uses an accusative noun where Amharic idiom requires the instrumental preposition: she anointed his feet with perfume.'
  naturalness: The register is modern, clear, and suitable. «በሽቱ» is the natural construction with «ትቀባቸው». The revised wording also avoids an unnecessary break into short sentences while retaining the Greek sequence.
  terminology: «ሽቱ» is an appropriate accessible rendering of μύρον, with the footnote responsibly preserving fragrant oil and ointment as alternatives. «መቀባት» properly renders ἀλείφω without imposing a ritual interpretation.
  issues:
  - severity: medium
    issue: The main text specifies repeated kissing with «ደጋግማ».
    rationale: κατεφίλει is intensive and imperfect, so repeated kissing is a legitimate possibility, but it is not necessary to state it explicitly in the main translation. Retaining it as a footnoted alternative better preserves the source's semantic range.
  - severity: high
    issue: «ሽቱውንም ... ትቀባቸው ነበር» is grammatically and idiomatically unsuitable.
    rationale: The perfume is the means/material used for anointing, not a direct object alongside the object pronoun «-ቸው». Amharic should use «በሽቱ ... ትቀባቸው ነበር».
