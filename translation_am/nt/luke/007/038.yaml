base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: am
  text: ከኋላውም በእግሮቹ አጠገብ ቆማ እያለቀሰች፣ እግሮቹን በእንባዋ ማርጠብ ጀመረች፤ በራሷ ጠጉርም ታብሳቸው ነበር፤ እግሮቹንም ትስማቸው[a] ነበር፣ በሽቱም[b] ትቀባቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እግሮቹን ደጋግማ ትስማቸው ነበር» ወይም «አጥብቃ ትስማቸው ነበር»። የግሪኩ ግስ የተጠናከረ ሲሆን፣ ያልተጠናቀቀው የጊዜ ቅርጽ ድርጊቱ ተደጋጋሚ እንደነበር ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ጥሩ መዓዛ ባለው ዘይት» ወይም «ሽቱ ቅባት»። የግሪኩ ቃል ጥሩ መዓዛ ያለውን ዘይት ወይም ቅባት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
