  rationale: የግሪኩ የቀደመ ድርጊት አመልካች ተሳቢ ግስ ሁኔታውን የሚያዘጋጅ ሲሆን፣ «ቆማ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: ከኋላውም በእግሮቹ አጠገብ
  rationale: ὀπίσω የኋላ አቀማመጥን፣ παρά ከተሳቢ ጋር ደግሞ በእግሮቹ አጠገብ መሆንን ያሳያል፤ ይህም በማዕድ ጊዜ ተደግፎ ከመቀመጥ ልማድ ጋር ይስማማል።
- source_word: κλαίουσα
  choice: እያለቀሰች
  rationale: ቀጣይና ስሜታዊ ለቅሶን በግልጽ ሁኔታ ያሳያል።
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: በእንባዋ ማርጠብ ጀመረች
  rationale: ἤρξατο የድርጊቱን መጀመር፣ βρέχειν ደግሞ ማርጠብን ያመለክታል፤ ትርጉሙ ሳያጋንን ሁለቱንም ይጠብቃል።
- source_word: ἐξέμασσεν
  choice: ታብሳቸው ነበር
  rationale: ያልተጠናቀቀው የግስ ቅርጽ ቀጣይ ድርጊትን ያሳያል፤ «ታብሳቸው ነበር» የማበስን ሂደት ይጠብቃል።
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: በራሷም ጠጉር
  rationale: የግሪኩን «በራሷ ጠጉር» የሚል ግልጽና ምስላዊ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κατεφίλει
