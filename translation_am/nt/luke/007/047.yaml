translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ይቅር ተብሎለታል’ የሚለው የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ሲሆን ያለፈውን ድርጊትና አሁን ያለውን ውጤት ያጣምራል።
