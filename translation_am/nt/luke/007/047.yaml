base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: am
  text: ስለዚህ እልሃለሁ፤ ብዙ ኃጢአቶቿ ይቅር ተብለዋል፤ በጣም ስለወደደች[a]። ጥቂት ይቅር የሚባልለት ግን ጥቂት ይወዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለዚህ በጣም ወደደች።” የግሪኩ አገናኝ ፍቅሯ ይቅር የተባለላት መሆኑን የሚያሳይ ማስረጃ እንጂ፣ ይቅርታዋን ያስገኘ ምክንያት እንዳልሆነ አጉልቶ በሚያሳይ መንገድ ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: ስለዚህ
  rationale: የምክንያትና የድምዳሜ አያያዙን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀφέωνται
  choice: ይቅር ተብለውላታል
  rationale: የግሪኩን ፍጹም ተደራጊ ቅርጽ፣ ማለትም የተፈጸመ ድርጊትንና አሁን ያለውን ውጤት፣ ያንጸባርቃል።
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: ብዙ ኃጢአቶቿ
  rationale: የባለቤትነት አመልካቹንና የኃጢአቶቹን ብዛት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὅτι
  choice: -ና
  rationale: በአማርኛ የምክንያት ግንኙነቱን በተፈጥሯዊ ሁኔታ ያሳያል፤ በአውዱ ያለውን የምክንያትና የማስረጃ አሻሚነት በማስታወሻ ይጠብቃል።
- source_word: ἠγάπησεν πολύ
  choice: ብዙ ወዳለች
  rationale: የፍቅሯን ታላቅነት በአጭርና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: ጥቂት ይቅር የተባለለት ግን
  rationale: አጠቃላይ ነጠላውን አገላለጽና ከቀዳሚው ሐረግ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ὀλίγον ἀγαπᾷ
  choice: ጥቂት ይወዳል
  rationale: ከ‘ጥቂት ይቅር’ ጋር ያለውን አጭር ምሳሌያዊ ትይዩነት ይጠብቃል።
theological_decisions:
- issue: ὅτι የሴቲቱ ፍቅር ለይቅርታዋ የሚያስገኝ ምክንያት መሆኑን ያመለክት እንደሆነ
