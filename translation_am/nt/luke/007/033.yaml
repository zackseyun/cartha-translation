  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: am
  text: መጥምቁ ዮሐንስ እንጀራ ሳይበላ፣ ወይን ጠጅም ሳይጠጣ መጥቷልና፤ ‘ጋኔን አድሮበታል’ ትላላችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: መጥቷል
  rationale: የግሪኩን ፍጹም ጊዜና የመምጣቱን አሁናዊ አግባብ ይጠብቃል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: መጥምቁ ዮሐንስ
  rationale: በአማርኛ የተለመደውንና የጥምቀት ተግባሩን የሚያመለክተውን መጠሪያ ይጠቀማል።
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: እንጀራ ሳይበላ፣ ወይን ጠጅም ሳይጠጣ
  rationale: የዮሐንስን የተከለከለ አኗኗር የሚገልጹትን ትይዩ አንቀጾች ይጠብቃል፤ ἄρτονን ወደ አጠቃላይ ‘ምግብ’ ሳያሰፋ በተጨባጭ ‘እንጀራ’ ብሎ ያቀርባል።
- source_word: λέγετε
  choice: ትላላችሁ
  rationale: የአድማጮቹን ተደጋጋሚ ወይም የተለመደ ምላሽ በተፈጥሯዊ የአሁን ጊዜ አገላለጽ ያቀርባል።
- source_word: Δαιμόνιον ἔχει
  choice: ጋኔን አለበት
  rationale: የግሪኩን ቀጥተኛ አገላለጽና የክሱን ኃይል ይጠብቃል፤ ይበልጥ ፈሊጣዊው አማራጭ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በዮሐንስ ላይ በቀረበው ክስ δαιμόνιον የሚለውን መተርጎም
  choice: ጋኔን
  alternative: ርኩስ መንፈስ
  rationale: በዚህ ቦታ የምንጩ ቃል δαιμόνιον ነው፤ ‘ርኩስ መንፈስ’ ተዛማጅ ቢሆንም የተለየ የግሪክ አገላለጽ ስለሆነ ቃላቱን ማዋሐድ አይገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። የምንጩ ትይዩ አወቃቀርና ቀጥተኛ ክስ ተጠብቀዋል።
