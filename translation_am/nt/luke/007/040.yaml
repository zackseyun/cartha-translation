  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “ስምዖን ሆይ፣ የምነግርህ ነገር አለኝ” አለው። እርሱም፣ “መምህር ሆይ፣ ተናገር”[a] አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታ ሆይ፣ ተናገር።” የግሪኩ Διδάσκαλε ቃል በቀጥታ “መምህር” ማለት ሲሆን፣ εἰπέ ደግሞ “በል” ወይም “ተናገር” የሚል ቀላል ትእዛዝ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የግሪኩን የትረካ አገላለጽ (‘መልሶ አለ’) ይጠብቃል፤ ቀደም ሲል ግልጽ ጥያቄ ባይኖርም በአማርኛ የንግግር ምላሽን በተፈጥሮ ያመለክታል።
- source_word: εἶπεν πρὸς αὐτόν
  choice: አለው
  rationale: λέγω ከπρὸς ጋር ያለውን ‘ለእርሱ አለ’ የሚል ትርጉም በተፈጥሯዊና አጭር አማርኛ ይገልጣል።
- source_word: Σίμων
  choice: ስምዖን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ልማድ የታወቀውን የስሙን አጻጻፍ ይከተላል።
- source_word: ἔχω σοί τι εἰπεῖν
  choice: የምነግርህ ነገር አለኝ
  rationale: σοίን በ‘-ህ’ በግልጽ ያካትታል፤ የግሪኩን ፈሊጥም በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የቃሉን መሠረታዊ ‘አስተማሪ/መምህር’ ትርጉም ይጠብቃል፤ ‘ሆይ’ የጥሪውን ቅርጽ በግልጽ ያሳያል።
- source_word: εἰπέ
  choice: ተናገር
  rationale: ቀላሉን የሁለተኛ መደብ ነጠላ ትእዛዝ ይጠብቃል፤ ኢየሱስ ሊናገር ያሰበውን እንዲቀጥል የተሰጠ ግብዣ ነው።
- source_word: φησίν
  choice: አለ
  rationale: በግሪክ የታሪክ አሁን ጊዜ ቢሆንም፣ በአማርኛ ትረካ ያለፈ ጊዜው የተፈጥሮ አገላለጽ ነው።
theological_decisions: []
