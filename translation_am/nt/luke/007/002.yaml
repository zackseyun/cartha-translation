  text: የአንድ የመቶ አለቃ ባሪያ[a] ታሞ ሊሞት ደርሶ ነበር፤ ይህም ባሪያ በአለቃው ዘንድ እጅግ ውድ ነበር።
  philosophy: optimal-equivalence
  footnotes:
