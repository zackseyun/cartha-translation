- source_word: τὸ ἔθνος ἡμῶν
  choice: ሕዝባችንን
  rationale: ተናጋሪዎቹ ስለራሳቸው የአይሁድ ማኅበረሰብ እንደ አንድ ሕዝብ መናገራቸውን ይገልጣል፤ ‘ብሔራችንን’ ቃል በቃል ቢቀርብም በዚህ አውድ ‘ሕዝባችንን’ ይበልጥ ተፈጥሯዊ ነው።
- source_word: τὴν συναγωγήν
  choice: ምኩራቡን
  rationale: የአይሁድን የአምልኮና የስብሰባ ተቋም በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይጠቅሳል፤ በግሪኩ ግልጽ የባለቤትነት ቅጥያ ስለሌለ ‘ምኩራባችንን’ አልተባለም።
- source_word: αὐτὸς
  choice: እርሱ ራሱ
  rationale: በግሪኩ ያለውን አጽንዖት ጠብቆ የመቶ አለቃውን የግል ተሳትፎ ወይም ደጋፊነት ያጎላል።
- source_word: ᾠκοδόμησεν
  choice: የሠራው
  rationale: ግሪኩ በቀላሉ ‘ሠራ/ገነባ’ ይላል፤ ይህ አተረጓጎም በእጁ መገንባቱን ወይም በገንዘብና በድጋፍ ማሠራቱን ሳይወስን ዋናውን ክፍትነት ይጠብቃል።
- source_word: ἡμῖν
  choice: ለእኛ
  rationale: የጥቅም ተቀባይነትን የሚያመለክተውን ዳቲቭ በተፈጥሯዊ አማርኛ ይገልጣል።
