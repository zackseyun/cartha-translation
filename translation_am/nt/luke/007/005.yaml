  text: ሕዝባችንን ይወዳልና፤ ምኩራቡንም ለእኛ የገነባው እርሱ ራሱ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱ ራሱ ምኩራቡን ለእኛ አሠራልን።” የግሪኩ ጽሑፍ በቀላሉ “ገነባ” ይላል፤ ይህም እርሱ ራሱ በግንባታው መሳተፉን ወይም ገንዘብ በመስጠት ግንባታውን ማሠራቱን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
