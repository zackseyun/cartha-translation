    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከመቅሰፍቶች” ወይም “ከግርፋቶች።” የግሪኩ ቃል በቀጥታ ጅራፍን ወይም ግርፋትን፣ በተዘዋዋሪም ከባድ የአካል ሥቃይን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
