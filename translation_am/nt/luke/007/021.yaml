  text: በዚያች ሰዓት[a] ብዙዎችን ከበሽታዎች፣ ከከባድ ሥቃዮች[b]ና ከክፉ መናፍስት ፈወሰ፤ ለብዙ ዓይነ ስውራንም ማየትን በጸጋ ሰጠ[c]።
  philosophy: optimal-equivalence
