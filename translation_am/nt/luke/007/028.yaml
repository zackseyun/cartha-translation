base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: am
  text: እላችኋለሁ፤ ከሴቶች ከተወለዱት መካከል[b] ከዮሐንስ የሚበልጥ ማንም የለም፤ ነገር ግን በእግዚአብሔር መንግሥት ከሁሉ ያነሰው[c] ከእርሱ ይበልጣል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እላችኋለሁ።”
    reason: lexical_alternative
  - marker: b
    text: “ከሴቶች የተወለዱ” የሚለው አገላለጽ በአጠቃላይ ሰዎችን የሚያመለክት ፈሊጥ ነው።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በእግዚአብሔር መንግሥት ያነሰው።” የግሪኩ አገላለጽ በስም ሆኖ የሚሠራ ንጽጽራዊ ቅጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛ የንግግር ቀመርና የአሁን ጊዜ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μείζων ἐν γεννητοῖς γυναικῶν
  choice: ከሴቶች ከተወለዱት መካከል ... የሚበልጥ
