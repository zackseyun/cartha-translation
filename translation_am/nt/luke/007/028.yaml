  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሴማዊው ‘ከሴቶች የተወለዱ’ አገላለጽ በዋናው ጽሑፍ ተጠብቆ ትርጉሙ በማስታወሻ ተብራርቷል። ሁሉም የግርጌ ማስታወሻ ምልክቶች [a]፣ [b]፣ [c] በዋናው ጽሑፍ ተካተዋል።
