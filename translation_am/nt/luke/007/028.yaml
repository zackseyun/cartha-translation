- source_word: Ἰωάννου οὐδείς ἐστιν
  choice: ከዮሐንስ የሚበልጥ ማንም የለም
  rationale: የንጽጽሩን መነሻ ዮሐንስ መሆኑንና ፍጹም አሉታዊውን οὐδείς በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὁ δὲ μικρότερος
