  rationale: የግሪኩ ጽሑፍ ንጽጽሩን ይናገራል እንጂ የብልጫውን መስፈርት አይገልጽም፤ ስለዚህ የሥነ መለኮት ውጥረቱ ሳይፈታ ተቀምጧል።
