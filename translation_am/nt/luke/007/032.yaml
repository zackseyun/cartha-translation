  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: am
  text: እነርሱ በገበያ አደባባይ ተቀምጠው እርስ በርሳቸው እየተጣሩ፣ “ዋሽንት ነፋንላችሁ፣ እናንተ ግን አልጨፈራችሁም፤ ሙሾ አወረድንላችሁ[a]፣ እናንተ ግን አላለቀሳችሁም” ከሚሉ ልጆች ጋር ይመሳሰላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የልቅሶ ዜማ ዘመርንላችሁ” ወይም “አዘንንላችሁ።” የግሪኩ ቃል ማልቀስን ሳይሆን ማልቀሻ ወይም ሙሾ ማውረድን፣ የሞት ሙሾንም ጨምሮ፣ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: ጋር ይመሳሰላሉ
  rationale: ምሳሌያዊ ንጽጽሩን በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: παιδίοις
  choice: ልጆች
  rationale: ዕድሜን ወይም ጾታን ሳያጠብ የግሪኩን አጠቃላይ ትርጉም ይጠብቃል።
- source_word: ἐν ἀγορᾷ
  choice: በገበያ አደባባይ
  rationale: ἀγορά የንግድና የሕዝብ መሰብሰቢያ የሆነውን ክፍት አደባባይ ያመለክታል።
- source_word: καθημένοις
  choice: ተቀምጠው
  rationale: የልጆቹን አቀማመጥ ቀላልና ተፈጥሯዊ በሆነ መንገድ ይገልጻል።
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: እርስ በርሳቸው እየተጣሩ
  rationale: የግሪኩን የመጠራራት ተመላላሽ ሐሳብ በትዕይንቱ የሚመጥን አማርኛ ያስተላልፋል።
- source_word: ἃ λέγει
  choice: ከሚሉ
  rationale: የግሪኩ ነጠላ ግስ የቡድን ንግግርን ሊገልጽ ስለሚችል፣ በአማርኛ ከብዙ ቁጥር ልጆች ጋር ተፈጥሯዊ ተስማምቷል።
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: ዋሽንት ነፋንላችሁ
  rationale: αὐλέω በተለይ ዋሽንት ወይም ቧንቧ መጫወትን ያመለክታል፤ ይህ አገላለጽ መሣሪያውን ግልጽ ያደርጋል።
- source_word: οὐκ ὠρχήσασθε
  choice: አልጨፈራችሁም
  rationale: ድርጊቱን በቀጥታ ያስተላልፋል፤ ከዋሽንት ድምፅ ጋር ያለውንም ተገቢ ምላሽ ያሳያል።
- source_word: ἐθρηνήσαμεν
  choice: ሙሾ አወረድንላችሁ
  rationale: በዚህ የልጆች ጨዋታ አውድ የልቅሶ ክንውኑን ከደስታ ዋሽንት ጋር በግልጽ ያነጻጽራል፤ አማራጭ ስፋቱ በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἐκλαύσατε
  choice: አላለቀሳችሁም
  rationale: κλαίω የሚያመለክተውን ማልቀስ በቀጥታና በክብር ያስተላልፋል።
theological_decisions:
- issue: የልጆቹን ተቃራኒ ድርጊቶች የምሳሌውን ኃይል ሳይተረጉሙ ማቅረብ
  choice: “ዋሽንት ነፋንላችሁ፣” “ሙሾ አወረድንላችሁ፣” “አልጨፈራችሁም፣” እና “አላለቀሳችሁም” የሚሉ ተጨባጭ የድርጊት ቃላትን መጠቀም
  alternative: እንደ “ደስ አሰኘናችሁ” እና “እንድታዝኑ አደረግን” ያሉ ትርጓሜያዊ አገላለጾችን መጠቀም
  rationale: ቁጥሩ ራሱ ምስሉን ያቀርባል እንጂ አተገባበሩን አይተረጉምም። ተጨባጭ ቃላቱ ምስሉንና ሥነ መለኮታዊ ውጥረቱን ያለ ተጨማሪ ማብራሪያ ይጠብቃሉ።
