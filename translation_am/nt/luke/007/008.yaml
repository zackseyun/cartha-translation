id: LUK.7.8
reference: Luke 7:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: am
  text: እኔም በሥልጣን ሥር የተመደብሁ ሰው ነኝና፤ ከእኔም በታች ወታደሮች አሉኝ። ለዚህኛው፣ ‘ሂድ’ እላለሁ፤ ይሄዳል፤ ለሌላውም፣ ‘ና’ እላለሁ፤ ይመጣል፤ ለባሪያዬም[a]፣ ‘ይህን አድርግ’ እላለሁ፤ ያደርገዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይ።” የግሪኩ δοῦλος (ዱሎስ) ቃል በባለቤትነት ወይም በእስራት ትስስር ሥር ያለን የበታችነት ሁኔታ ያመለክታል፤ በአንዳንድ አውዶች ግን በአጠቃላይ “አገልጋይ” ተብሎ ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ ἐγὼ
  choice: እኔም ራሴ … ነኝና
  rationale: ጋር የሐሳቡን ምክንያታዊ ትስስር በ‘ነኝና’ ያሳያል፤ ካί እና ግልጽ የሆነው ἐγώ ደግሞ ‘እኔም ራሴ’ በሚለው የንጽጽርና የአጽንዖት አገላለጽ ተጠብቀዋል።
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: በሥልጣን ሥር የተመደብሁ
  rationale: የተሳቢውን ቅርጽና በወታደራዊ የትእዛዝ ተዋረድ ውስጥ የመመደብን ሐሳብ ያቆያል፤ ‘በሥልጣን ሥር ነኝ’ ብቻ ከማለት ይልቅ τασσόμενοςን በግልጽ ያንጸባርቃል።
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: ከእኔም በታች ወታደሮች አሉኝ
  rationale: የመቶ አለቃውን የተሰጠ ሥልጣንና ከእርሱ በታች ያለውን የትእዛዝ ተዋረድ ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται
  choice: ይህንኛውን፣ ‘ሂድ’ ስለው ይሄዳል
  rationale: τούτῳ ያለውን ጠቋሚ ኃይል ‘ይህንኛውን’ ይጠብቃል፤ ቀጥተኛውን ትእዛዝና ፈጣን ምላሹንም በተመሳሳይ አወቃቀር ያቀርባል።
- source_word: ἄλλῳ· Ἔρχου, καὶ ἔρχεται
  choice: ሌላውንም፣ ‘ና’ ስለው ይመጣል
  rationale: ከቀደመው ትእዛዝና ምላሽ ጋር ያለውን ትይዩ አወቃቀር ጠብቆ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῷ δούλῳ μου
  choice: ባሪያዬን
  rationale: δοῦλος በባለቤትነት ወይም በእስራት ትስስር ሥር ያለን የበታችነት ሁኔታ ሊያመለክት ይችላል፤ በዚህ የሥልጣን ተዋረድ ምሳሌ ውስጥ ‘ባሪያዬን’ ይህን ማኅበራዊ እውነታ ከ‘አገልጋዬን’ ይበልጥ በግልጽ ያሳያል።
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘ይህን አድርግ’ ስለው ያደርጋል
  rationale: የግሪኩን አጭር ትእዛዝና የታዛዥነት ምላሽ በቀጥታና በትይዩ መልክ ይጠብቃል።
theological_decisions:
- issue: በመቶ አለቃው ምሳሌ ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያዬን
  alternative: አገልጋዬን
  rationale: ጥቅሱ ስለ ባርነት ትምህርት እየሰጠ አይደለም፤ ሆኖም የበታችነትና የትእዛዝ ተዋረድ ለምሳሌው ዋና ነው። ስለዚህ የታሰረውን ወይም የባለቤትነት ሁኔታን የሚያሳየው ‘ባሪያ’ በዋናው ጽሑፍ ተመርጧል፤ δοῦλος በአንዳንድ አውዶች ሰፋ ባለ መልኩ ‘አገልጋይ’ ሊተረጎም ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ነኝና’ ምክንያታዊውን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል፤ የትእዛዝና የምላሽ ትይዩነት ደግሞ በአጭርና ቀጥተኛ ንግግር ተጠብቋል።
