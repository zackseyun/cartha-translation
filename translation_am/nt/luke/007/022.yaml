  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የዝርዝሩን ምትና የነቢያዊ ቋንቋውን አስተጋብኦ ለመጠበቅ አጭር ተመሳሳይ አንቀጾች ተጠቅመዋል።
