source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: am
  text: እርሱም መልሶ እንዲህ አላቸው፤ “ሄዳችሁ ያያችሁትንና የሰማችሁትን ለዮሐንስ ንገሩት፤ ዕውሮች ያያሉ[a]፣ አንካሶች ይራመዳሉ፣ ለምጻሞች ይነጻሉ፣ ደንቆሮዎች ይሰማሉ፣ ሙታን ይነሣሉ፣ ለድሆች የምሥራች ይሰበካል[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዕውሮች መልሰው ያያሉ»። የግሪኩ ግስ የማየትን ችሎታ መልሶ ማግኘት ወይም ዓይንን ወደ ላይ ማንሣት ሊያመለክት ይችላል፤ በዚህ አውድ ግን ማየትን ማግኘትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ለድሆች የምሥራች ይሰበካል»። በግሪኩ ተደራጊ ነው፤ በትክክል፣ «ድሆች የምሥራች ይነገራቸዋል።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የኢየሱስን ምላሽ በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: Πορευθέντες
  choice: ሄዳችሁ
  rationale: ከዋናው ትእዛዝ ጋር የተያያዘውን ተሳቢ አንቀጽ በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል።
- source_word: ἀπαγγείλατε
  choice: ንገሩት
  rationale: መልእክተኞቹ ያዩትንና የሰሙትን ወደ ዮሐንስ መልሰው እንዲያደርሱ የተሰጠውን ትእዛዝ ግልጽ ያደርጋል።
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: ያያችሁትንና የሰማችሁትን
  rationale: ሁለቱን የምስክርነት ምንጮች በቀጥታና ተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: ዕውሮች ማየት ችለዋል
  rationale: በዚህ አውድ ግሱ የማየት ችሎታን ማግኘት ወይም መልሶ ማግኘትን ያመለክታል፤ አገላለጹ ይህን ያለ አስገዳጅ ዝርዝር ያቀርባል።
- source_word: χωλοὶ περιπατοῦσιν
  choice: አንካሶች ይራመዳሉ
  rationale: ቀጥተኛ፣ ግልጽና በዘመናዊ አማርኛ የተለመደ አቻ ነው።
- source_word: λεπροὶ καθαρίζονται
  choice: ለምጻሞች ይነጻሉ
  rationale: καθαρίζονται ከሕክምናዊ ፈውስ በተጨማሪ የሥርዓታዊ ንጽሕናን ሐሳብ ስለሚይዝ ‘ይነጻሉ’ ተመርጧል።
- source_word: κωφοὶ ἀκούουσιν
  choice: ደንቆሮዎች ይሰማሉ
  rationale: κωφός በአንዳንድ አውድ ዲዳ ወይም ደንቆሮ ሊሆን ቢችልም፣ ከ‘ይሰማሉ’ ጋር እዚህ የመስማት እክልን ያመለክታል።
- source_word: νεκροὶ ἐγείρονται
  choice: ሙታን ይነሣሉ
  rationale: የግሪኩን ተደራጊ አወቃቀርና ያልተገለጸውን አድራጊ ይጠብቃል።
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ለድሆችም የምሥራች ይሰበካል
  rationale: ተደራጊውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ድሆች የምሥራቹ ተቀባዮች መሆናቸውን ያሳያል።
theological_decisions:
- issue: የተአምራቱ ዝርዝር ስለ ኢየሱስ ማንነትና ተልእኮ ማስረጃ መሆኑ
  choice: የተመለከቱትን የመመለስና የመታደስ ሥራዎች በቀጥታ ማቅረብ፣ መሲሐዊ ትርጓሜን በዋናው ጽሑፍ አለመጨመር
  alternative: የኢሳይያስን ፍጻሜ በግልጽ የሚያሳይ ተጨማሪ ቃል ማስገባት
  rationale: ቁጥሩ ራሱ ሥራዎቹን ለዮሐንስ የሚደርስ ማስረጃ አድርጎ ያቀርባል፤ ትርጉሙ ነቢያዊውን አስተጋብኦ ይጠብቃል እንጂ ያልተጻፈ ማብራሪያ አይጨምርም።
- issue: በዝርዝሩ ውስጥ ያሉት ተደራጊ ግሶች
  choice: ‘ይነጻሉ፣ ይነሣሉ፣ ይሰበካል’ የሚሉ ተደራጊ አገላለጾችን መጠቀም
  alternative: ‘እግዚአብሔር ሙታንን ያስነሣል’ ወይም ‘እኔ ለድሆች እሰብካለሁ’ በማለት አድራጊውን መግለጽ
  rationale: የግሪኩን ተደራጊ አወቃቀር መጠበቅ ጽሑፉ ያልገለጸውን አድራጊ ከመጨመር ይቆጠባል።
