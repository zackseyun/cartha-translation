  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: am
  text: ስምዖንም፣ “የበለጠ ዕዳ የተሰረዘለት ይመስለኛል[a]” ብሎ መለሰ። ኢየሱስም፣ “በትክክል ፈርደሃል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እገምታለሁ።” የግሪኩ ቃል ጥንቃቄ ያለበትን ግምት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ብሎ መለሰ
  rationale: የግሪኩ ተውሳከ ግስና ዋና ግስ በአማርኛ ተፈጥሯዊ በሆነው ‘ብሎ መለሰ’ ተገልጿል።
- source_word: Ὑπολαμβάνω
  choice: ይመስለኛል
  rationale: ቃሉ ጽኑ እርግጠኝነትን ሳይሆን ጥንቃቄ ያለበትን ግምት ያሳያል፤ ‘ይመስለኛል’ ይህን የመጠራጠር ድምፀት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: የበለጠ ዕዳ የተሰረዘለት
  rationale: በቅርብ ዐውድ ውስጥ ያለው የዕዳ ምሳሌ በግልጽ እንዲቆይ የዕዳ መሰረዝ ቋንቋ ተመርጧል፤ የተጠቃሚውን ዳቲቭ መዋቅር ‘-ለት’ ያስቀምጣል።
- source_word: Ὀρθῶς
  choice: በትክክል
  rationale: የስምዖንን ፍርድ ትክክለኛነት በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: ἔκρινας
  choice: ፈርደሃል
  rationale: የκρίνωን የፍርድና የግምገማ ትርጉም ይጠብቃል፤ ፍጹም ጊዜውም አሁን የተሰጠውን መልስ ከአሁኑ ውጤቱ ጋር ያገናኛል።
theological_decisions:
- issue: በምሳሌው ውስጥ የἐχαρίσατο ትርጉም
  choice: የበለጠ ዕዳ የተሰረዘለት
  alternative: የበለጠ ይቅር የተባለለት
  rationale: በቅድሚያው ምሳሌ የገንዘብ ዕዳ እየተነገረ ስለሆነ ‘ዕዳ የተሰረዘለት’ ምስሉን ይጠብቃል፤ በሰፊው ክፍል ያለውን የኃጢአት ይቅርታ ግንኙነትም አያስወግድም።
- issue: የስምዖን መልስ የእርግጠኝነት ደረጃ
  choice: ይመስለኛል
  alternative: እገምታለሁ
  rationale: Ὑπολαμβάνω የሚገልጸውን ጥንቃቄ ያለበት ግምት ሳያጠናክር ወይም ሳያጠፋ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዕዳ ምሳሌውን በግልጽ ለማቆየት ‘ዕዳ የተሰረዘለት’ ተመርጧል፤ የጸጋ ስጦታና የይቅርታ ሰፊ ፍቺው በዐውዱ እንዲታይ ተትቷል።
