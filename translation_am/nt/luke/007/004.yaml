  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: am
  text: እነርሱም ወደ ኢየሱስ በመጡ ጊዜ፣ “ይህን ልታደርግለት የሚገባው ሰው ነው” እያሉ አጥብቀው ለመኑት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: በመጡ ጊዜ
  rationale: የግሱ አጋዥ ቅርጽ ወደ ኢየሱስ መድረሳቸውን ያሳያል፤ በአማርኛ የጊዜ ግንኙነቱን በተፈጥሮ ይገልጣል።
- source_word: παρεκάλουν
  choice: ለመኑት
  rationale: በዚህ አውድ የተከበረና ጽኑ ጥያቄን ያመለክታል፤ “ለመኑት” በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: σπουδαίως
  choice: አጥብቀው
  rationale: የልመናቸውን ጽናትና ከልብ መሆን ይገልጣል፣ ከልክ በላይ ግን አያጠናክረውም።
- source_word: Ἄξιός
  choice: ይገባዋል
  rationale: በዐውዱ ሰውየው የተጠየቀውን በጎ ነገር ሊቀበል የሚገባው መሆኑን ይገልጣል፤ ይህ ከቃል በቃል “ብቁ ነው” ይልቅ ተፈጥሯዊ ነው።
- source_word: ᾧ
  choice: ለት
  rationale: አንጻራዊው ተውላጠ ስም የመቶ አለቃውን ያመለክታል፤ በአማርኛ ከግሱ ጋር በተያያዘው “-ለት” በተፈጥሮ ተገልጧል።
- source_word: παρέξῃ
  choice: እንድታደርግለት
  rationale: ግሱ ማቅረብ፣ መስጠት ወይም አንድን ነገር ለሰው ማድረግ ሊያመለክት ይችላል፤ እዚህ የተጠየቀውን ድርጊት በሰፊና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τοῦτο
  choice: ይህን
  rationale: ከዚህ በፊት የተጠየቀውን ድርጊት ያመለክታል፤ የግሪኩን አጭርነትና የአውዱን ግልጽነት ይጠብቃል።
theological_decisions:
- issue: የἄξιος የብቁነት ፍርድ
  choice: ይገባዋል
