  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: am
  text: የዮሐንስ መልእክተኞች ከሄዱ በኋላ፣ ኢየሱስ ስለ ዮሐንስ ለሕዝቡ እንዲህ ማለት ጀመረ፦ “ምን ለማየት ወደ ምድረ በዳ ወጣችሁ? በነፋስ የሚወዛወዝ ሸምበቆ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሚናወጥ” ወይም “የሚንቀሳቀስ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: ከሄዱ በኋላ
  rationale: የግሪኩ የጄኒቲቭ አብሶሉት አገባብ ከዋናው ድርጊት በፊት የተፈጸመውን ነገር በጊዜ ቅደም ተከተል ያሳያል።
- source_word: ἀγγέλων
  choice: መልእክተኞች
  rationale: በዚህ ዐውድ ቃሉ ዮሐንስ የላካቸውን ሰዎች እንጂ ሰማያዊ መላእክትን አያመለክትም።
- source_word: ἤρξατο λέγειν
  choice: እንዲህ ማለት ጀመረ
  rationale: ንግግሩ መጀመሩን የሚገልጠውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል። የግሱ ባለቤት በቁጥሩ ዐውድ ኢየሱስ ስለሆነ ስሙ ለግልጽነት ተጨምሯል።
- source_word: πρὸς τοὺς ὄχλους
  choice: ለሕዝቡ
  rationale: የብዙ ቁጥር ὄχλους በአማርኛ የተሰበሰቡትን ሰዎች በተፈጥሯዊ ሁኔታ ‘ሕዝቡ’ ብሎ መግለጽ ይቻላል።
- source_word: περὶ Ἰωάννου
  choice: ስለ ዮሐንስ
  rationale: περί ከጄኒቲቭ ጋር ያለውን ‘ስለ/በተመለከተ’ የሚለውን የተለመደ ትርጉም ይይዛል።
- source_word: Τί ἐξήλθατε
  choice: ምን ለማየት ... ወጣችሁ?
  rationale: τί እዚህ የሚጠይቀው የመውጣታቸውን ዓላማ ብቻ ሳይሆን ሊያዩት የወጡትን ነገር ነው፤ የአማርኛው የቃላት ቅደም ተከተል ጥያቄውን ተፈጥሯዊ ያደርገዋል።
- source_word: εἰς τὴν ἔρημον
  choice: ወደ ምድረ በዳ
  rationale: በዮሐንስ አገልግሎት ዐውድ ያለውን ሰው አልባና ያልለማ አካባቢ የሚገልጽ የተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ነው።
- source_word: θεάσασθαι
  choice: ለማየት
  rationale: ቃሉ ‘በትኩረት ማየት/መመልከት’ ሊል ቢችልም፣ ‘ለማየት’ በዘመናዊ አማርኛ ቀላልና ተፈጥሯዊ ሲሆን የጥያቄውን ኃይል ይጠብቃል።
- source_word: κάλαμον
  choice: ሸምበቆ
  rationale: በነፋስ በቀላሉ የሚንቀሳቀስን ተክል የሚያመለክት ቀጥተኛና የታወቀ አማርኛ ቃል ነው።
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: በነፋስ የሚወዛወዝ
  rationale: σαλεύω የሚገልጸውን በነፋስ የሚንቀሳቀስና ወዲያ ወዲህ የሚያዘነብል ምስል በተፈጥሯዊና ሕያው አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ስለ ዮሐንስ የቀረበው የሸምበቆ ምሳሌያዊ ጥያቄ
  choice: “በነፋስ የሚወዛወዝ ሸምበቆ?” የሚለውን ምስል በቀጥታ ማቆየት
  alternative: “ደካማ ወይም በአቋሙ የሚለዋወጥ ሰው?” ብሎ ትርጉሙን መተርጎም
  rationale: ጽሑፉ ምስሉን ያቀርብና አድማጮቹ ፍቺውን እንዲገነዘቡ ይተወዋል። ስለዚህ ምሳሌያዊውንና ሥነ መለኮታዊውን ውጥረት በማይፈታ መልኩ ቀጥተኛው ምስል ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የአማርኛ ተፈጥሯዊ የቃላት ቅደም ተከተል ተከትሏል፤ ከዐውዱ የሚታወቀው ‘ኢየሱስ’ ለግልጽነት ተጨምሯል።
