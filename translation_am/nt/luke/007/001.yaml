id: LUK.7.1
reference: Luke 7:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: am
  text: ኢየሱስ ሕዝቡ እየሰማ ቃሎቹን ሁሉ ተናግሮ ከጨረሰ በኋላ፣ ወደ ቅፍርናሆም ገባ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: ከጨረሰ በኋላ
  rationale: በዚህ ዐውድ ቃሉ ምክንያትን ሳይሆን የጊዜ ቅደም ተከተልን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἐπλήρωσεν
  choice: ተናግሮ ከጨረሰ
  rationale: ከῥήματα ጋር ሲገባ ‘መሙላት’ ወይም ‘መፈጸም’ ሳይሆን ንግግርን አጠናቆ መጨረስን ያመለክታል።
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: ቃሎቹን ሁሉ
  rationale: የግሪኩን ‘ቃሎቹን ሁሉ’ በቅርብ ይከተላል፤ ወደ ‘እነዚህን ነገሮች ሁሉ’ በማስፋት አይተረጉምም።
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: ሕዝቡ እየሰማ
  rationale: ቃል በቃል ‘ወደ ሕዝቡ ጆሮዎች’ የሚለውን ፈሊጣዊ አገላለጽ፣ ንግግሩ ሕዝቡ በሚሰማበት ሁኔታ መቅረቡን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λαοῦ
  choice: ሕዝቡ
  rationale: λαός የሚያመለክተውን የጋራ ሕዝብ በቀጥታ ይገልጣል፤ ‘ሕዝቡን’ ወደ ‘ሰዎቹ’ ወይም ‘ሕዝብ ብዛቱ’ አያጠብም።
- source_word: εἰσῆλθεν
  choice: ገባ
  rationale: የግሪኩን ቀላል የመግባት ግስ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Καφαρναούμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስፍራውን ስም ይጠቀማል።
theological_decisions:
- issue: የድርጊቱ ባለቤት ስም በግሪኩ በግልጽ አለመደገሙ
  choice: ኢየሱስ በግልጽ ተጠቅሷል
  alternative: ተውላጠ ስም ብቻ መጠቀም፦ ‘እርሱ’
  rationale: የግሪኩ ግሶች ባለቤት ከቀደመው ዐውድ ኢየሱስ መሆኑ ግልጽ ነው፤ በአማርኛ የቁጥሩን መክፈቻ ግልጽና ተፈጥሯዊ ለማድረግ ስሙ ተጠቅሷል፣ አዲስ ትርጓሜ ግን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ሕዝቡ እየሰማ’ የሚለው የግሪኩን ፈሊጥ ትርጉም ሳያጣ ከቃል በቃል እንግዳ አገላለጽ ይርቃል።
