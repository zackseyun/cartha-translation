  terminology: “ወሬ” suitably represents λόγος as a circulating report here, though it can have a colloquial sense; the footnote responsibly records “ዜና” and “ቃል” as alternatives. “በዙሪያው ባለው አካባቢ ሁሉ” accurately renders the surrounding region.
