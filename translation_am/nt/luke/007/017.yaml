lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ተሰራጨ
  rationale: ቃል በቃል ‘ወጣ’ ማለት ቢሆንም፣ በዚህ አውድ ወሬው በስፋት መዳረሱን ያመለክታል፤ ‘ተሰራጨ’ ይህን ፈሊጣዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ λόγος οὗτος
  choice: ይህ … ወሬ
  rationale: λόγος እዚህ አንዲትን ቃል ሳይሆን ስለ ኢየሱስና ስላደረገው ነገር የተሰማውን ወሬ ያመለክታል። ‘ወሬ’ በዚህ ትርጉም ዘመናዊና ተፈጥሯዊ ነው።
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: በይሁዳ ምድር ሁሉ
  rationale: የወሬውን በመላው ይሁዳ መሰራጨት በግልጽ ያሳያል፤ ‘ምድር’ ይሁዳ ሰፊ መልክዓ ምድራዊ ክልል መሆኗን ያብራራል።
- source_word: περὶ αὐτοῦ
  choice: ስለ እርሱ
  rationale: περί ከባለቤት አገናዛቢ ጋር ‘ስለ’ ወይም ‘በተመለከተ’ ማለት ነው፤ ‘ስለ እርሱ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: πάσῃ τῇ περιχώρῳ
  choice: በዙሪያው ባለው አካባቢ ሁሉ
  rationale: περίχωρος በዙሪያ ያለውን ክልል ወይም አካባቢ ያመለክታል፤ ይህ አገላለጽ ግልጽ ሲሆን ከልክ በላይ አስተዳደራዊ ትርጉም አያስገባም።
- source_word: καὶ ... καὶ
  choice: …ሁሉና …ሁሉ
  rationale: ተደጋጋሚው καί ሁለቱን መልክዓ ምድራዊ ክልሎች አያይዞ የወሬውን ሰፊ መዳረስ ያጠናክራል፤ ‘-ና’ በአማርኛ ይህን ግንኙነት ተፈጥሯዊ ያደርገዋል።
