lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτόν
  choice: ወደ እርሱ መጥተው
  rationale: የአኦሪስት አጋዥ ግስ ወደ ኢየሱስ መምጣታቸውን እንደ ቀጣዩ ንግግር ሁኔታ ያቀርባል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: οἱ ἄνδρες
