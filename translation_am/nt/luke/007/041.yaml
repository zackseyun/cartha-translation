- source_word: δανιστῇ τινι
  choice: አንድ አበዳሪ
  rationale: δανιστής ገንዘብ የሚያበድርን ሰው ያመለክታል፤ τινι ደግሞ በትረካው ያልተጠቀሰ አንድ የተወሰነ ሰው መሆኑን ያሳያል።
- source_word: ὤφειλεν
  choice: ዕዳ ነበረበት
  rationale: ያለፈውን የዕዳ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δηνάρια
  choice: ዲናር
  rationale: ታሪካዊውን የሮማውያን ሳንቲምና የገንዘብ መለኪያ ከማጠቃለል ይልቅ ስሙን ይጠብቃል፤ ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: πεντακόσια
  choice: አምስት መቶ
  rationale: ቁጥሩን በቀጥታ ይተረጉማል።
- source_word: ἕτερος
  choice: ሌላኛው
  rationale: ከአንደኛው ጋር ያለውን ተነጻጻሪ ጥንድ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πεντήκοντα
  choice: አምሳ
  rationale: ቁጥሩን በቀጥታ ይተረጉማል፤ ግልጽነት እንዲኖርም ‘ዲናር’ በሁለተኛው ሐረግ ተደግሟል።
