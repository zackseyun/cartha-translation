base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: am
  text: “አንድ አበዳሪ ሁለት ባለዕዳዎች ነበሩት፤ አንደኛው አምስት መቶ ዲናር[a]፣ ሌላኛውም አምሳ ዲናር ዕዳ ነበረበት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዲናር በሮማውያን ዘመን የተለመደ የብር ሳንቲም ነበር፤ በተለምዶም ከአንድ ሠራተኛ የአንድ ቀን ደመወዝ ያህል እንደነበረ ይቆጠራል።
    reason: cultural_note
