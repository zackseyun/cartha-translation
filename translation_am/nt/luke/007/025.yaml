  text: ነገር ግን፣ ምን ለማየት ወጣችሁ? ለስላሳ ልብሶችን የለበሰ ሰው?[a] እነሆ፣ የከበሩ ልብሶችን ለብሰው በቅንጦት የሚኖሩ በነገሥታት ቤተ መንግሥቶች ውስጥ ናቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
