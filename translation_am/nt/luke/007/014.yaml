review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the approach, touching of the σορός, the bearers' stopping, and Jesus' direct command. The main fidelity concern is that ተሸካሚዎቹ can naturally suggest persons/things being carried rather than the persons carrying the bier; the Greek explicitly identifies the latter.
  naturalness: The sentence is generally clear and appropriately formal. Recasting the bearers as የሬሳ መሸከሚያውን የተሸከሙት removes an avoidable ambiguity in modern standard Amharic. ተነሣ is the more idiomatic direct imperative form here.
  terminology: የሬሳ መሸከሚያ appropriately represents a funeral bier without wrongly requiring an enclosed coffin. The lexical footnote correctly preserves the alternatives and historical sense.
  issues:
  - severity: medium
    issue: ተሸካሚዎቹም is ambiguous.
    rationale: In contemporary Amharic, ተሸካሚ may denote one that is carried or borne, not unambiguously one who carries. The Greek οἱ βαστάζοντες means those carrying the bier, so the agents should be stated clearly.
  - severity: low
    issue: The imperative ተነሥ is less idiomatic than ተነሣ in this direct address.
    rationale: ተነሣ naturally conveys the singular command “arise/get up” in modern standard Amharic while retaining the solemn brevity of ἐγέρθητι.
  revised_text: ኢየሱስም ቀርቦ የሬሳውን መሸከሚያ[a] ነካ፤ የሬሳ መሸከሚያውን የተሸከሙትም ቆሙ። እርሱም፣ “ወጣት ሆይ፣ እልሃለሁ፣ ተነሣ!” አለው።
