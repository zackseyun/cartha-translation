  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: am
  text: ኢየሱስም ቀርቦ የሬሳውን መሸከሚያ[a] ነካ፤ የሬሳ መሸከሚያውን የተሸከሙትም ቆሙ። እርሱም፣ “ወጣት ሆይ፣ እልሃለሁ፣ ተነሣ!” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የሬሳ ሳጥን” ወይም “የቀብር አልጋ።” የግሪኩ ቃል በቀብር ሰልፍ ሬሳን ለመሸከም የሚያገለግል አልጋ ወይም ፍሬም ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ቀርቦ
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች ተሳቢ ግስ ኢየሱስ ከመንካቱ በፊት ወደ ሬሳ ማጓጓዣው መቅረቡን ያሳያል፤ ‘ቀርቦ’ ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἥψατο
  choice: ነካ
  rationale: በዚህ አገባብ ቃሉ ‘መንካት’ ወይም ‘መያዝ’ ሊሆን ቢችልም፣ ጽሑፉ አጥብቆ መያዝን ስለማያስገድድ ‘ነካ’ ተመርጧል።
- source_word: σοροῦ
  choice: የሬሳውን መሸከሚያ[a]
  rationale: σορός በዚህ የቀብር ሰልፍ አገባብ ሬሳው የተሸከመበትን ክፍት አልጋ ወይም ፍሬም ያመለክታል፤ የዘመናችንን የተዘጋ የሬሳ ሳጥን ብቻ እንዳያስታውስ ‘የሬሳ መሸከሚያ’ ተብሏል።
- source_word: οἱ δὲ βαστάζοντες
  choice: ተሸካሚዎቹም
  rationale: ቃሉ መሸከሚያውን የተሸከሙትን ሰዎች ያመለክታል፤ ‘ተሸካሚዎቹ’ አጭር፣ ግልጽና በአገባቡ የሚታወቅ ነው።
- source_word: ἔστησαν
  choice: ቆሙ
  rationale: ግሱ ተሸካሚዎቹ መራመዳቸውን አቁመው በቦታቸው መቆማቸውን ያሳያል፤ ‘ቆሙ’ ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Νεανίσκε
  choice: ወጣት ሆይ
  rationale: ይህ ለወጣት ወንድ የቀረበ ቀጥተኛ ጥሪ ነው፤ ‘ወጣት ሆይ’ ክብር ያለውን ቀጥተኛ ንግግር ይጠብቃል።
- source_word: σοὶ λέγω
  choice: እልሃለሁ
  rationale: በግሪኩ ያለው ግልጽ ተውላጠ ስም የንግግሩን ቀጥተኝነትና አጽንዖት ያሳያል፤ ‘እልሃለሁ’ በአማርኛ ይህን በተፈጥሯዊና በተከበረ ቅርጽ ያቀርባል።
- source_word: ἐγέρθητι
  choice: ተነሥ
  rationale: በተአምሩ አገባብ ይህ ለሞተው ወጣት ከሞት እንዲነሣ የተሰጠ ትእዛዝ ነው፤ ‘ተነሥ’ ተፈጥሯዊ ሆኖ ሳለ የንግግሩን ክብደትና ሥልጣን ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ለሞተው ወጣት የሰጠው ትእዛዝ ቃና
  choice: ἐγέρθητι የሚለው ‘ተነሥ’ ተብሎ ተተርጉሟል።
  alternative: ‘ተነሣ’ ወይም ‘ከሞት ተነሥ’
  rationale: ‘ተነሥ’ የጽሑፉን አጭር፣ ቀጥተኛና ሥልጣን ያለው ትእዛዝ ይጠብቃል። ‘ከሞት’ የሚለውን መጨመር ትርጉሙን ቢያብራራም በምንጩ ውስጥ የለም፤ ስለዚህ የተአምሩ ትርጉም በትረካው እንዲገለጥ ተትቷል።
