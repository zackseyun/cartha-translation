  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘መሸከሚያ’ ታሪካዊውን የቀብር አሠራር ከዘመናዊ የተዘጋ ሳጥን ጋር ሳያደባልቅ ለመግለጽ ተመርጧል፤ የኢየሱስ ቃል ግን አጭርና የተከበረ ሆኖ ቀርቧል።
