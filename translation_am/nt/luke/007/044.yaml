source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: am
  text: ወደ ሴቲቱም ዘወር ብሎ ስምዖንን እንዲህ አለው፤ “ይህችን ሴት ታያለህ? ወደ ቤትህ ገባሁ፤ ለእግሮቼ ውሃ አልሰጠኸኝም፤[a] እርሷ ግን እግሮቼን በእንባዋ አራሰች፤ በፀጉሯም ጠረገቻቸው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ “በእግሮቼ ላይ ውሃ አልሰጠኸኝም።” ትርጉሙ እግርን ለመታጠብ ውሃ የማቅረብን ልማድ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: ወደ ሴቲቱም ዘወር ብሎ
  rationale: የኢየሱስን አካላዊ መዞርና አቅጣጫውን ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: τῷ Σίμωνι ἔφη
  choice: ስምዖንን እንዲህ አለው
  rationale: በትረካ ውስጥ ያለውን የንግግር መግቢያ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: ይህችን ሴት ታያለህ?
  rationale: የግሪኩን ቀጥተኛ የአሁን ጊዜ ጥያቄና በዚያች ሴት ላይ የተደረገውን አጽንዖት ይጠብቃል።
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: ወደ ቤትህ ገባሁ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ ንግግር በቅርብና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: ለእግሮቼ ውሃ አልሰጠኸኝም
  rationale: ጽሑፉ ውሃ መስጠትን ብቻ በግልጽ ስለሚናገር፣ የመታጠብን ድርጊት ያለ አስፈላጊነት አይጨምርም።
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: እግሮቼን በእንባዋ አራሰች
  rationale: መሣሪያዊውን ዳቲቭ ‘በእንባዋ’ በማለት በግልጽ ያቀርባል፤ ἔβρεξενንም እንደ ተፈጸመ ድርጊት ይተረጉማል።
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: በፀጉሯም ጠረገች
  rationale: የመጥረግን ድርጊትና ፀጉሯ መሣሪያ መሆኑን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
