base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: am
  text: ይህ ስለ እርሱ፣ “እነሆ፣ መልእክተኛዬን[a] በፊትህ እልካለሁ፤ እርሱም መንገድህን በፊትህ ያዘጋጃል።” ተብሎ የተጻፈው ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል “መልአክ” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን የሚያመለክተው ሰው የሆነውን ተላኪ፣ ማለትም ዮሐንስን ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: ይህ
  rationale: የጠቋሚውን አጽንዖት ጠብቆ ዮሐንስን በቀጥታ ያመለክታል።
- source_word: περὶ οὗ γέγραπται
  choice: ስለ እርሱ … ተብሎ የተጻፈለት
  rationale: የቅዱሳት መጻሕፍትን ጥቅስ የማስተዋወቂያ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩን ፍጹም ተገብሮ አንቀጽም ይጠብቃል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የትንቢታዊውን ጥቅስ ከፍ ያለና ትኩረት የሚስብ ቃና ይጠብቃል።
- source_word: ἀποστέλλω
  choice: እልካለሁ
  rationale: የአሁን ጊዜውን ትንቢታዊ ሕያውነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄγγελόν
  choice: መልእክተኛዬን
  rationale: በዚህ አውድ ቃሉ ሰው የሆነውን መልእክተኛ፣ ማለትም ዮሐንስን፣ ስለሚያመለክት ከ“መልአክ” ይልቅ ግልጽ ነው።
- source_word: πρὸ προσώπου σου
  choice: ከፊትህ
  rationale: ቃል በቃል “ከፊትህ/ከፊትህ ፊት” የሚለውን ምስል ያቀርባል፤ በአማርኛም “ቀድሞህ” የሚለውን ሐሳብ ተፈጥሯዊ ያደርጋል።
- source_word: κατασκευάσει
  choice: የሚያዘጋጅ
  rationale: ወደፊት የሚፈጸመውን የማሰናዳት ተግባር ግልጽ ያደርጋል።
- source_word: τὴν ὁδόν σου
  choice: መንገድህን
  rationale: ቃሉንም ትንቢታዊና ዘይቤያዊ አጠቃቀሙንም የሚጠብቅ የተለመደ አቻ ነው።
- source_word: ἔμπροσθέν σου
  choice: በፊትህ
  rationale: የመንገዱ ዝግጅት ከተናጋሪው ተጠሪ በፊት እንደሚደረግ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ኢየሱስ ስለ ዮሐንስ የተናገረው የትንቢት ጥቅስ ከራሱ ጋር ያለው ግንኙነት
  choice: “መንገድህን፣” “በፊትህ፣” እና “ከፊትህ” የሚሉትን ሁለተኛ መደብ ተውላጠ ስሞች ያለ ትርጓሜያዊ ማስፋፊያ መጠበቅ
  alternative: መልእክተኛው የጌታን ወይም የመሲሑን መንገድ እንደሚያዘጋጅ በግልጽ ስም ማስፋት
  rationale: የግሪኩን ቀጥተኛ ንግግርና የኢየሱስን አተገባበር ይጠብቃል፤ ጥቅሱ ራሱ ያልጨመረውን ሥነ መለኮታዊ ማብራሪያ ወደ ዋናው ጽሑፍ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆ” የትንቢታዊ ጥቅሱን ከፍ ያለ ቃና ሲጠብቅ፣ የአረፍተ ነገሩ አወቃቀር ለአማርኛ ተፈጥሯዊ እንዲሆን የድርጊት አንቀጹ ከስሙ በፊት ቀርቧል።
