  naturalness: The revised wording uses natural modern standard Amharic while retaining the elevated citation register of እነሆ. Rendering the Greek relative clause as a second coordinated clause is idiomatic Amharic and makes the future action explicit.
  terminology: መልእክተኛ is the appropriate contextual rendering of ἄγγελος for John. መንገድ retains the prophetic metaphor without interpretive expansion. The footnote’s alternative መልአክ is useful and correctly limited by context.
  issues:
  - severity: medium
    issue: የተጻፈለት is semantically imprecise for περὶ οὗ γέγραπται.
    rationale: The Amharic dative form normally means “written for him/on his behalf,” while the Greek construction states that Scripture was written concerning him.
  - severity: medium
    issue: የሚያዘጋጅ does not explicitly represent the future κατασκευάσει.
    rationale: The Greek quotation states a future action (“will prepare”). Using ያዘጋጃል clearly preserves that temporal force.
