  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: am
  text: ስለዚህ ራሴን ወደ አንተ ለመምጣት እንኳ ብቁ አድርጌ አልቈጠርኩም። ነገር ግን አንድ ቃል ብቻ ተናገር፤ አገልጋዬም[a] ይፈወስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ወንድ ልጄ» ወይም «ልጄ»፤ የግሪኩ ቃል እንደ አውዱ ልጅን፣ ወጣትን ወይም አገልጋይን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚወጣውን ምክንያታዊ ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐδὲ
  choice: እንኳ ... አልቈጠርኩም
  rationale: ክህደቱን በማጠናከር ተናጋሪው ራሱን ለመምጣት እንኳ የተገባ እንዳልቈጠረ ያስተላልፋል።
- source_word: ἐμαυτὸν ἠξίωσα
  choice: ራሴን የሚገባኝ አድርጌ ቈጠርኩ
  rationale: ἀξιόω በዚህ ስፍራ ራስን የተገባ ወይም ብቁ አድርጎ መቁጠርን ያመለክታል፤ የአንጸባራቂውን ተውላጠ ስም ኃይልም «ራሴን» ይጠብቃል።
- source_word: πρὸς σὲ ἐλθεῖν
  choice: ወደ አንተ ለመምጣት
  rationale: ወደ ኢየሱስ በአካል መቅረብን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከራሱ አለመገባት ወደ ሚያቀርበው ተቃራኒ ጥያቄ የሚደረገውን ሽግግር ያሳያል።
- source_word: εἰπὲ λόγῳ
  choice: በቃል ብቻ ተናገር
  rationale: የግሪኩ አገባብ ባለሥልጣን ቃል መናገርን ያመለክታል፤ «ብቻ» የርቀት ፈውስ እንዲፈጸም ንግግሩ በቂ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἰαθήτω
  choice: ይፈወስ
  rationale: የሦስተኛ መደብ ተገብሮ ትእዛዛዊ ቅርጹን ይጠብቃል፤ ወደ ወደፊት አመልካች «ይፈወሳል» አይለውጠውም።
- source_word: ὁ παῖς μου
  choice: አገልጋዬ
  rationale: παῖς ልጅን፣ ወጣትን ወይም አገልጋይን ሊያመለክት ቢችልም፣ በመቶ አለቃው ቤተሰብና በትእዛዙ ሥር ያለ ሰው አውድ «አገልጋዬ»ን ይደግፋል፤ ሌሎቹ ትርጉሞች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: በመቶ አለቃው ታሪክ ውስጥ የπαῖς አተረጓጎም
  choice: አገልጋዬ
  alternative: ወንድ ልጄ፤ ልጄ
  rationale: ቃሉ ሰፊ የትርጉም ክልል አለው፤ ሆኖም የመቶ አለቃው የሥልጣንና የቤት አውድ አገልጋይ የሚለውን ይደግፋል። ቤተሰባዊ ወይም የፍቅር ቅርበትን ሊያሳዩ የሚችሉት አማራጮች ግን ሳይወገዱ በማስታወሻ ተገልጠዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «ይፈወስ» የግሪኩን ትእዛዛዊ ኃይል ይጠብቃል፤ የπαῖς እውነተኛ የትርጉም ስፋትም በማስታወሻ ተጠብቋል።
