base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: am
  text: ኢየሱስም እነዚህን ነገሮች ሰምቶ በሰውየው ተደነቀ። ዞር ብሎም ይከተለው ለነበረው ሕዝብ፣ “እላችኋለሁ፤ በእስራኤል እንኳ ይህን የሚያህል እምነት[a][b] አላገኘሁም” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲህ ያለ ታላቅ እምነት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መታመን”፤ የግሪኩ ቃል ብዙ ጊዜ “እምነት” ተብሎ የሚተረጎመው ይኸው ቃል ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: ኢየሱስም እነዚህን ነገሮች ሰምቶ
  rationale: የአውሪስጦስ አሳታፊው ከዋናው ግስ በፊት የተፈጸመውን ሁኔታ ያሳያል፤ δὲ ያለው ለስላሳ የትረካ ሽግግር በ‘ም’ ተገልጧል፣ የταῦτα ብዙ ቁጥርም ተጠብቋል።
- source_word: ἐθαύμασεν αὐτόν
  choice: በሰውየው ተደነቀ
  rationale: θαυμάζω መደነቅን ወይም መገረምን ያመለክታል፤ αὐτόν በዐውዱ የመቶ አለቃውን ያመለክታል። ‘በሰውየው’ የተውላጠ ስሙን ማጣቀሻ ግልጽ ያደርጋል።
- source_word: στραφεὶς
  choice: ዞር ብሎም
  rationale: በትረካው ውስጥ የመዞርን ተግባር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: እየተከተለው ለነበረው ሕዝብ
  rationale: የአሁን ጊዜ አሳታፊው በዚያን ጊዜ ቀጥሎ የነበረውን መከተል ያሳያል።
- source_word: Λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን ንግግርና የብዙ ቁጥር ተደራሲዎቹን በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: በእስራኤል እንኳ
  rationale: οὐδὲ ያለውን ‘እንኳ አይደለም’ የሚል አጽንዖት በአማርኛው አሉታዊ ግስ ጋር በተፈጥሯዊ ሥርዓት ያቀርባል።
- source_word: τοσαύτην πίστιν
  choice: ይህን የሚያህል እምነት
  rationale: τοσαύτην የደረጃውን ወይም የመጠኑን አጽንዖት ይጠብቃል፤ πίστις በዐውዱ በኢየሱስ ሥልጣን ላይ ያለን እምነትና መታመን ያመለክታል።
- source_word: εὗρον
  choice: አላገኘሁም
  rationale: የግሪኩን አውሪስጦስ ቀጥተኛ የአማርኛ ያለፈ ጊዜ ቅርጽ ይጠቀማል፤ ከοὐδὲ ጋር ያለውን አሉታዊ ትርጉምም ይገልጣል።
theological_decisions:
- issue: የπίστις አተረጓጎም
  choice: እምነት
  alternative: መታመን
  rationale: በዚህ ዐውድ የመቶ አለቃው በኢየሱስ ሥልጣን ላይ የነበረው የሚያምን መተማመን ነው። ‘እምነት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ‘መታመን’ የቃሉን ግንኙነታዊ ገጽታ የሚያጎላ ትክክለኛ አማራጭ ነው።
- issue: የኢየሱስ መደነቅ
  choice: ተደነቀ
  alternative: ተገረመ
  rationale: ጽሑፉ የሚናገረውን እውነተኛ መደነቅ ሳያዳክም ይጠብቃል፤ ይህን መደነቅ በአንድ የተወሰነ ክርስቶሎጂያዊ ማብራሪያ አይፈታውም።
