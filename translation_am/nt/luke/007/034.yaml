  alternative: ሆዳምና የወይን ጠጅ ጠጪ
  rationale: ይህ የተቃዋሚዎቹ የጥላቻ ክስ እንጂ የትረካው የሥነ ምግባር ፍርድ አይደለም፤ ትርጉሙ የክሱን ሹልነት ይጠብቃል።
