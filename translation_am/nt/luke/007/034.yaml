  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: am
  text: 'የሰው ልጅ እየበላና እየጠጣ መጥቷል፤ እናንተም፣ “እነሆ፣ ሆዳምና ሰካራም ሰው፣[a] የቀረጥ ሰብሳቢዎችና የኃጢአተኞች ወዳጅ!” ትላላችሁ።


    [a] ወይም በይበልጥ ቃል በቃል፣ “እነሆ፣ ሆዳምና የወይን ጠጅ ጠጪ ሰው።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በይበልጥ ቃል በቃል፣ “እነሆ፣ ሆዳምና የወይን ጠጅ ጠጪ ሰው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: መጥቷል
  rationale: የግሪኩን ፍጹም ጊዜ በተፈጥሯዊ አማርኛ ይገልጻል፤ መምጣቱ ተፈጽሞ ያለውን ውጤት ያሳያል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የታወቀ ራስን መጥሪያ እና ሊኖረው የሚችለውን የዳንኤል ትንቢት ጥላ ሳይፈታ ይጠብቃል።
- source_word: ἐσθίων καὶ πίνων
  choice: እየበላና እየጠጣ
  rationale: ተያያዥ ድርጊቱንና የመምጣቱን አኳኋን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: λέγετε
  choice: ትላላችሁ
  rationale: የአሁን ጊዜ ቀጥተኛ ንግግሩንና የብዙ ቁጥር ተናጋሪዎችን በግልጽ ሁኔታ ይገልጻል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የማመልከትና የአጽንዖት ኃይሉን በክቡርና በሚታወቅ አማርኛ ይጠብቃል።
- source_word: φάγος
  choice: ሆዳም
  rationale: የጥላቻ ክሱን ሳያለዝብ በአጭርና ተፈጥሯዊ የአማርኛ ስድብ ያቀርባል።
- source_word: οἰνοπότης
  choice: ሰካራም
  rationale: ቃሉ በዐውዱ የያዘውን ነቀፋ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: τελωνῶν
  choice: የቀረጥ ሰብሳቢዎች
  rationale: በሮማውያን ሥርዓት ይሠሩ የነበሩትን ሰዎች ለዘመናዊ አንባቢ በግልጽ ይጠራል።
- source_word: ἁμαρτωλῶν
  choice: የኃጢአተኞች
  rationale: በተቃዋሚዎቹ የተጠቀሰውን ማኅበራዊና ሃይማኖታዊ መለያ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου የሚለውን መጠሪያ መተርጎም
  choice: የሰው ልጅ
  alternative: ሰብዓዊው
  rationale: የታወቀውን ክርስቶሎጂያዊ መጠሪያና ጽሑፋዊ ጥላዎቹን ሳይተረጉም ይጠብቃል።
- issue: በኢየሱስ ላይ የቀረቡት ክሶች ኃይል
