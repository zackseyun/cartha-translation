  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። “እነሆ” የጽሑፉን የማመልከት ኃይል ይጠብቃል፤ “ሆዳምና ሰካራም” ደግሞ የተቃዋሚዎቹን ስድብ በተፈጥሯዊ ንግግር ያስተላልፋል።
