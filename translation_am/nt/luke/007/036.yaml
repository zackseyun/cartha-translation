    reason: lexical_alternative
  - marker: b
    text: ይህ በዚያ ዘመን በመደበኛ ድግስ ጊዜ የተለመደውን አቀማመጥ ያመለክታል፤ ሰዎች ቀጥ ብለው ከመቀመጥ ይልቅ ተደግፈው ይመገቡ ነበር።
