  text: ከፈሪሳውያን አንዱም ከእርሱ ጋር ምግብ እንዲበላ ይጠይቀው ነበር[a]። እርሱም ወደ ፈሪሳዊው ቤት ገብቶ በማዕድ ተደግፎ ተቀመጠ[b]።
