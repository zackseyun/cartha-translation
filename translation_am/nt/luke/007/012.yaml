  choice: ሲቀርብ
  rationale: የድርጊቱን ጊዜና የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል፤ የδέ ቀላል አያያዥነት በአወቃቀሩ ውስጥ ተካትቷል።
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: ወደ ከተማይቱ በር
  rationale: የመቅረቡን አቅጣጫ ያሳያል፤ πύλη በአውዱ የከተማ መግቢያ በር ነው።
- source_word: καὶ ἰδοὺ
  choice: እነሆ
  rationale: በድንገት ለተገለጠው ትዕይንት የአንባቢውን ትኩረት የሚጠራውን የἰδού ኃይል ይጠብቃል።
- source_word: ἐξεκομίζετο
  choice: ተሸክመው ወደ ውጭ እያወጡት ነበር
  rationale: ያለፈ ጊዜ ቀጣይ ድርጊቱንና የቀብር ሰልፉን አውድ በግልጽ አማርኛ ያሳያል።
- source_word: τεθνηκώς
  choice: አንድ የሞተ ሰው
  rationale: ሰውየው ሞቶ በዚያ ሁኔታ መኖሩን የሚያመለክተውን ፍጹም አሳታፊ ቅርጽ በቀጥታ ይገልጻል።
- source_word: μονογενὴς υἱός
  choice: አንድያ ወንድ ልጅ
  rationale: በዚህ የቤተሰብ አውድ μονογενής ልጁ ለእናቱ ብቸኛ መሆኑን ያሳያል፤ υἱός ደግሞ ወንድ ልጅ መሆኑን በግልጽ ይጠብቃል።
- source_word: τῇ μητρὶ αὐτοῦ
  choice: የእናቱ
  rationale: ዳቲቭ ቅርጹ እዚህ የዝምድና ግንኙነትን ያሳያል፤ በአማርኛ ባለቤትነት አወቃቀር ተፈጥሯዊ ነው።
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: እሷም መበለት ነበረች
  rationale: ግልጽ ተውላጠ ስሙ በእናቲቱ ሁኔታ ላይ የሚያደርገውን አጽንዖት ይጠብቃል።
