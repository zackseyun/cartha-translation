  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: am
  text: ሕዝቡም ሁሉ፣ ቀረጥ ሰብሳቢዎችንም ጨምሮ፣ ይህን ሲሰሙ፣ በዮሐንስ ጥምቀት ተጠምቀው እግዚአብሔር ትክክል መሆኑን እውቅና ሰጡ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ «እግዚአብሔርን አጸደቁ»። ትርጉሙ እግዚአብሔር ትክክል እንደሆነ እውቅና ሰጡ ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: አሳታፊው ምክንያትን እንደሚገልጽም ሊታይ ይችላል፦ «በዮሐንስ ጥምቀት ስለተጠመቁ»።
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ሕዝቡም ሁሉ
  rationale: ነጠላ የስብስብ ስያሜውንና ሰፊ አድማሱን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἀκούσας
  choice: ይህን ሲሰሙ
  rationale: የአዎሪስት አሳታፊውን ጊዜያዊ ግንኙነት በተፈጥሯዊ መንገድ ያሳያል፤ «ይህን» ከአውዱ የሚታወቀውን የተሰማ ነገር ይገልጣል።
- source_word: τελῶναι
  choice: ቀረጥ ሰብሳቢዎች
  rationale: በዘመናዊ አማርኛ ግልጽና የተለመደ አገላለጽ ነው።
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: እግዚአብሔር ትክክል መሆኑን አረጋገጡ
  rationale: ሰዎቹ እግዚአብሔርን ጻድቅ እንዳደረጉት ሳያስመስል፣ እርሱ ትክክል እንደሆነ እውቅና መስጠታቸውን ያሳያል።
- source_word: βαπτισθέντες
  choice: ተጠምቀው ነበር
  rationale: የተፈጸመውን ጥምቀት እንደ ዳራ ያቀርባል፤ ግንኙነቱን በግልጽ ምክንያታዊ ቃል አይወስንም።
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: የዮሐንስን ጥምቀት
  rationale: የግሪኩን የዝምድና አገላለጽ በአማርኛ አጭርና ተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: ἐδικαίωσαν τὸν θεόν የሚለው ሐረግ ትርጉም
  choice: ሕዝቡ እግዚአብሔር ትክክል መሆኑን እውቅና ሰጠ።
  alternative: ይበልጥ ቃል በቃል፣ «እግዚአብሔርን አጸደቁ» ሊባል ይችላል።
  rationale: የግሪኩ አገላለጽ የሰዎቹን እውቅና እንጂ በእግዚአብሔር ሁኔታ ላይ ለውጥ ማምጣታቸውን አያመለክትም።
- issue: βαπτισθέντες የሚለው አሳታፊ ኃይል
  choice: ጥምቀቱ የምላሻቸው ዳራ እንደሆነ ቀርቧል፤ ምክንያታዊነቱ በዋናው ጽሑፍ አልተወሰነም።
  alternative: «በዮሐንስ ጥምቀት ስለተጠመቁ» ተብሎ በምክንያታዊ አገባብ ሊተረጎም ይችላል።
  rationale: አውዱ ምክንያታዊ ግንኙነትን ሊያመለክት ቢችልም፣ የግሪኩ አሳታፊ ቅርጽ በራሱ ይህን አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ትክክል መሆኑን አረጋገጡ» የፍርድ ቤታዊውን ሐሳብ በግልጽ ቋንቋ ያስተላልፋል፤ ይበልጥ መደበኛው አማራጭ በማስታወሻ ተጠብቋል። የመጨረሻው አሳታፊ በአማርኛ እንደ ዳራ በተለየ አንቀጽ ቀርቦ፣ የጊዜና የምክንያት ግንኙነቱ ሳይገደብ ተጠብቋል።
