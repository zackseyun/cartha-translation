source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: am
  text: ኢየሱስም ከእነርሱ ጋር ሄደ። ነገር ግን ቀድሞውኑ ከመቶ አለቃው ቤት ብዙም ሳይርቅ፣ የመቶ አለቃው ወዳጆችን ወደ እርሱ ልኮ እንዲህ አለው፦ “ጌታ ሆይ[a]፣ ራስህን አታስቸግር፤ ከጣራዬ በታች እንድትገባ እኔ ብቁ አይደለሁም[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክቡር ሆይ።” የግሪኩ “ጌታ” (κύριε) የአክብሮት አጠራር ሆኖ ሊያገለግል ይችላል፤ የኢየሱስን ሥልጣን ማወቅንም ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ተገቢ አይደለሁም።” የግሪኩ አገላለጽ ብቃትን ወይም ተገቢነትን ሊያመለክት ይችላል፤ እዚህ የመቶ አለቃውን ትሕትና ይገልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: ሄደ
  rationale: የግሪኩ ያልተፈጸመ ግስ በትረካው ውስጥ የኢየሱስን መጓዝ ያሳያል፤ “ሄደ” በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: σὺν αὐτοῖς
  choice: ከእነርሱ ጋር
  rationale: የአብሮነትን ትርጉም በቀጥታ ያስተላልፋል።
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: ከቤቱ ብዙም ሳይርቅ
  rationale: የግሪኩን “ከቤቱ ሩቅ ሳይሆን” የሚለውን ጊዜያዊ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔπεμψεν φίλους
  choice: ወዳጆቹን ... ልኮ
  rationale: φίλους የግል ወዳጆችን ያመለክታል፤ የአማርኛው አገባብ ላኪው የመቶ አለቃው መሆኑን በግልጽ ያሳያል።
- source_word: ὁ ἑκατοντάρχης
  choice: የመቶ አለቃው
  rationale: የሮማውያንን ወታደራዊ ማዕረግ ትክክለኛና በመጽሐፍ ቅዱሳዊ አማርኛ የታወቀ አገላለጽ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ የቀረበውን የአክብሮት አድራሻ ይጠብቃል፤ ከአክብሮት በላይ ሥልጣኑን የማወቅ ፍንጭ ሊኖረው የሚችለውንም አይዘጋም።
- source_word: μὴ σκύλλου
  choice: ራስህን አታስቸግር
  rationale: በዚህ አገባብ σκύλλω ማለት ራስን ማስቸገር ወይም መድከም ነው፤ ምርጫው አክብሮት ያለውና ተፈጥሯዊ ነው።
- source_word: ἱκανός εἰμι
  choice: እኔ ብቁ አይደለሁም
  rationale: ἱκανός ብቃትን፣ ተገቢነትን ወይም የሚገባ መሆንን ሊያመለክት ይችላል፤ “ብቁ አይደለሁም” የመቶ አለቃውን ትሕትና ሳያጠፋ ይህን ስፋት ይጠብቃል።
- source_word: ὑπὸ τὴν στέγην μου
  choice: ከጣራዬ በታች
  rationale: ቤት ውስጥ መግባትን የሚገልጠውን ግልጽ የግሪክ ምስላዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: Κύριε ለኢየሱስ በቀጥታ ሲነገር ያለው ትርጉም
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ጌታ
  rationale: የግሪኩ ቃል ተራ የአክብሮት አድራሻ ሊሆን ቢችልም፣ የኢየሱስን ሥልጣን የማወቅ ጥልቅ ፍቺንም ሊሸከም ይችላል። “ጌታ ሆይ” ይህን አሻሚነት ይጠብቃል።
- issue: ἱκανός የሚገልጠው ብቃት ወይም የሚገባ መሆን
  choice: ብቁ አይደለሁም
  alternative: አይገባኝም / የሚገባኝ አይደለሁም
  rationale: “ብቁ” የቃሉን የብቃትና የተገቢነት ስፋት ይጠብቃል፤ በአገባቡም የመቶ አለቃውን ትሕትና በግልጽ ያሳያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “የመቶ አለቃ” እና “ከጣራዬ በታች” የታወቁትን መጽሐፍ ቅዱሳዊ አገላለጾች ሲጠብቁ፣ የአረፍተ ነገሩ ፍሰት ግን ዘመናዊና ተፈጥሯዊ ነው። በቀረበው የእንግሊዝኛ ጽሑፍ የግርጌ ማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ጋር አልተጣጣሙም ነበር፤ በዚህ ረቂቅ [a] ከ“ጌታ ሆይ” ጋር፣ [b] ደግሞ ከ“ብቁ አይደለሁም” ጋር በትክክል ተያይዘዋል።
