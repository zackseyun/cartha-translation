  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: am
  text: የጋበዘውም ፈሪሳዊ ይህን ባየ ጊዜ በልቡ እንዲህ አለ፦ “ይህ ሰው ነቢይ ቢሆን ኖሮ፣ የምትነካው ሴት ማን እንደሆነችና ምን ዓይነት ሴት እንደሆነች ያውቅ ነበር፤ እሷ ኃጢአተኛ ናትና።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እሷ ኃጢአተኛ መሆኗን” ተብሎም ሊተረጎም ይችላል። የግሪኩ አገባብ ይህን ነገር እርሱ ሊያውቀው የሚገባው ይዘት አድርጎ ወይም ሴቲቱ ምን ዓይነት እንደሆነች የሚገልጽ ምክንያት አድርጎ ሊያሰማ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: ይህን ባየ ጊዜ
  rationale: የአኦሪስት ተውሳከ ግስ ለዋናው ግስ ጊዜያዊ ሁኔታን ያቀርባል፤ ‘ይህን’ የሚለው ከቀደመው ድርጊት በዐውዱ የተረዳ ነው። δὲ በአማርኛው ‘-ም’ በተፈጥሯዊ ሁኔታ ተወክሏል።
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτόν
  choice: የጋበዘውም ፈሪሳዊ
  rationale: καλέω በምግብ ግብዣ ዐውድ ‘ጋበዘ’ ማለት ነው፤ የአማርኛው አንጻራዊ አገባብ ቀድሞ የተፈጸመውን ግብዣ በግልጽ ያሳያል።
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: በልቡ እንዲህ አለ
  rationale: የግሪኩ አገላለጽ ውስጣዊ ንግግርን ያመለክታል፤ ‘በልቡ’ በዘመናዊ አማርኛ የተፈጥሮ አቻው ነው።
- source_word: Οὗτος
  choice: ይህ ሰው
  rationale: ተውላጠ አመልካቹ ኢየሱስን በርቀትና በጥርጣሬ የሚጠቅስ ቃና አለው፤ ‘ይህ ሰው’ ይህን ቃና ይጠብቃል።
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: ነቢይ ቢሆን ኖሮ፣ … ያውቅ ነበር
  rationale: εἰ ከኢምፐርፌክት እና በውጤት ክፍሉ ከἄν ጋር ያለው አገባብ ተናጋሪው እውን አይደለም ብሎ የገመተውን ሁኔታ ያሳያል፤ የአማርኛው ‘ቢሆን ኖሮ … ነበር’ ይህን በትክክል ይገልጣል።
- source_word: τίς καὶ ποταπὴ
  choice: ማን እንደሆነችና ምን ዓይነት ሴት እንደሆነች
  rationale: ሁለቱ ጠያቂ ቃላት የሴቲቱን ማንነትና ባሕርይ/ዝና በአንድነት ያጎላሉ፤ ሁለቱም በትርጉሙ በግልጽ ተጠብቀዋል።
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: የምትነካው ሴት
  rationale: የአሁን ጊዜው ግስ በትዕይንቱ እየተካሄደ ያለውን ንክኪ ያሳያል፤ የአማርኛው የአሁን ጊዜ አንጻራዊ ቅርጽ ይህን ይጠብቃል።
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: እሷ ኃጢአተኛ ናትና
  rationale: ὅτι ምክንያትን ወይም የሚታወቀውን ይዘት ሊያመለክት ይችላል፤ ዋናው ጽሑፍ የምክንያት ንባቡን በ‘-ና’ ያቀርባል፣ ሌላውን ንባብ ግን በማስታወሻ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ነቢይ ስለመሆኑ የተነገረው ሁኔታዊ ንግግር
  choice: “ነቢይ ቢሆን ኖሮ፣ … ያውቅ ነበር” ተብሎ እውን ያልሆነ ሁኔታ እንደሆነ ተተርጉሟል።
  alternative: “ነቢይ ከሆነ፣ … ያውቃል/ያውቅ ነበር” የሚል ይበልጥ ገለልተኛ ንባብ።
  rationale: የግሪኩ ሰዋሰው የፈሪሳዊውን ክህደት ወይም ጥርጣሬ የያዘ ተቃራኒ-እውነታዊ ሁኔታን በተፈጥሮ ያሳያል፤ ትርጉሙ የእርሱን አስተሳሰብ እንጂ የትረካውን ፍርድ አያደርገውም።
- issue: ὅτι የሚያሳየው ምክንያት ወይስ የእውቀቱ ይዘት
  choice: በዋናው ጽሑፍ ምክንያታዊ ንባብ፦ “እሷ ኃጢአተኛ ናትና።”
  alternative: የይዘት ንባብ፦ “ኃጢአተኛ መሆኗን።”
  rationale: ὅτι ሁለቱንም አገባቦች ሊፈቅድ ስለሚችል ዋናው ጽሑፍ በዐውዱ የሚፈስሰውን ምክንያታዊ ንባብ ይዟል፤ እውነተኛው አሻሚነት ግን በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ውስጣዊ ንግግር፣ የፈሪሳዊው የርቀት ቃና፣ ተቃራኒ-እውነታዊ ሁኔታ እና የὅτι አሻሚነት ተጠብቀዋል።
