  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: am
  text: የሚከፍሉበት ስላልነበራቸው፣ የሁለቱንም ዕዳ በነፃ ሰረዘላቸው።[a] እንግዲህ ከእነርሱ ማን አብልጦ ይወደዋል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁለቱንም በነፃ ይቅር አላቸው።» የግሪኩ ግስ በነፃ መስጠትን ወይም የሚገባ ዕዳን መተውን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: የሚከፍሉት ስላልነበራቸው
  rationale: የዘርፍ ፍጹም ሐረጉ ዕዳውን ለመመለስ አቅም ወይም ገንዘብ እንዳልነበራቸው የሚገልጽ ሁኔታ ነው፤ በዘመናዊ አማርኛ «የሚከፍሉት ስላልነበራቸው» ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: ለሁለቱም ዕዳቸውን በነፃ ተወላቸው
  rationale: χαρίζομαι በዕዳ አውድ የሚገባውን በነፃ መተውን ወይም ዕዳን መሰረዝን ያመለክታል። «በነፃ» የጸጋና የስጦታን ገጽታ ያሳያል፤ «ዕዳቸውን ተወላቸው» ደግሞ የገንዘብ ምሳሌውንና የይቅርታ ፍንጭን አብሮ ይጠብቃል።
- source_word: τίς οὖν αὐτῶν
  choice: እንግዲህ ከእነርሱ … ማን ነው?
  rationale: οὖν ከቀደመው ነገር የሚወጣውን ድምዳሜ ያመለክታል፤ «እንግዲህ» በዘመናዊ አማርኛ ይህን ግንኙነት በተፈጥሮ ይገልጻል።
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: አብልጦ የሚወደው
  rationale: πλεῖον የፍቅሩን ንጽጽራዊ መጠን ያሳያል፤ «አብልጦ የሚወደው» ይህን በተፈጥሮ ያስተላልፋል። የአማርኛው አንጻራዊ ግስ የግሪኩን የወደፊት ጊዜ ጥያቄ በአውዱ ይይዛል።
theological_decisions:
- issue: χαρίζομαιን በዕዳ ይቅርታ ምሳሌ ውስጥ መተርጎም
  choice: ዕዳቸውን በነፃ ተወላቸው
  alternative: የሁለቱንም ዕዳ ሰረዘ
  rationale: ዋናው ንባብ የገንዘብ ዕዳ መሰረዝንና χαρίζομαι ያለውን የነፃ ስጦታ/ጸጋ ገጽታ በአንድነት ይጠብቃል። እንዲሁም የሉቃስን ሰፊ የይቅርታና የፍቅር አውድ ሳያጠብ የምሳሌውን የዕዳ ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ዕዳ» እና «በነፃ ተወላቸው» የምሳሌውን የገንዘብ አውድና የχαρίζομαιን የጸጋ ቅርጽ ይጠብቃሉ።
