- from: የሚከፍሉት ስላልነበራቸው፣ ለሁለቱም ዕዳቸውን በነፃ ተወላቸው።[a] እንግዲህ ከእነርሱ አብልጦ የሚወደው ማን ነው?
  to: የሚከፍሉበት ስላልነበራቸው፣ የሁለቱንም ዕዳ በነፃ ሰረዘላቸው።[a] እንግዲህ ከእነርሱ ማን አብልጦ ይወደዋል?
  rationale: The revision replaces the unclear expression for lacking repayment resources with idiomatic modern Amharic, renders the remission as cancellation of both debts in the immediate financial context, and uses a direct future question. The footnote retains the lexical alternative that foregrounds the broader freely-forgiving sense of χαρίζομαι.
