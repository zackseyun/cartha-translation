lexical_decisions:
- source_word: μακάριος
  choice: ብፁዕ
  rationale: ቃሉ በኢየሱስ የብፅዕና ንግግሮች ያለውን መንፈሳዊና ሃይማኖታዊ ክብደት ይጠብቃል፤ «ደስተኛ» ብቻ የሚለው ይህን ሙሉ ትርጉም አያስተላልፍም።
- source_word: ὃς ἐὰν μὴ
  choice: የማይ…
  rationale: አጠቃላይ ሁኔታን የሚገልጸውን አንጻራዊ ሐረግ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: σκανδαλισθῇ
  choice: የማይሰናከል
  rationale: የመሰናከያውን ምስል ጠብቆ፣ በኢየሱስ ምክንያት ቅር ከመሰኘት እስከ ከእርሱ መራቅ ያለውን የትርጉም ስፋት ሳይገድብ ይተዋል። የግሪኩ ተደራጊ ቅርጽ በአማርኛ በተፈጥሮ አይገለጽም፤ ምክንያቱ ግን በ«በእኔ ምክንያት» ግልጽ ሆኗል።
- source_word: ἐν ἐμοί
  choice: በእኔ ምክንያት
  rationale: በዚህ ፈሊጣዊ አጠቃቀም ἐν የመሰናከሉን አጋጣሚ ወይም ምክንያት ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: በኢየሱስ ምክንያት መሰናከል የሚለውን አገላለጽ ማለስለስ
  choice: የመሰናከልን ምስል በዋናው ጽሑፍ መጠበቅ
  alternative: «በእኔ ቅር የማይሰኝ» ወይም «በእኔ ምክንያት የማይወድቅ»
  rationale: ንግግሩ በኢየሱስ ቅር ተሰኝቶ መሰናከልን ያስጠነቅቃል። «መሰናከል» የስሜት ቅሬታ ብቻ እንዳይሆን እና በቀጥታ ክህደት ብቻ እንዳይተረጎም ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። «ብፁዕ» መጽሐፍ ቅዱሳዊ ክብደቱን ይጠብቃል፤ የአረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
