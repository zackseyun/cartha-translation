  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: am
  text: እነሆ፣ በኢየሩሳሌም ስሙ ስምዖን የሚባል አንድ ሰው ነበር። ይህ ሰው ጻድቅና እግዚአብሔርን የሚያከብር ነበር፤ የእስራኤልን መጽናናት[a] ይጠባበቅ ነበር፣ መንፈስ ቅዱስም[b] በእርሱ ላይ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእስራኤልን ማጽናኛ።» ሐረጉ እስራኤል ተስፋ ያደረገውን ከእግዚአብሔር የሚመጣ ማጽናናትና መታደስ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: «ቅዱስ መንፈስ» ተብሎም ሊተረጎም ይችላል፤ ሆኖም በሉቃስ ዐውድ ይህ በተፈጥሮ መንፈስ ቅዱስን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የሉቃስን ትኩረት ሰጪ የትረካ ምልክት በተፈጥሯዊና ክብር ባለው የአማርኛ አገላለጽ ያቆያል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ቃሉ በዚህ ስምዖን የተባለውን ወንድ ግለሰብ ያመለክታል፤ «ሰው» በአማርኛ ተፈጥሯዊ ሲሆን ከስሙ ጋር ጾታውም ግልጽ ነው።
- source_word: ᾧ ὄνομα Συμεών
  choice: ስሙ ስምዖን የሆነ
  rationale: የግሪኩን መለያ አወቃቀር በተፈጥሯዊ የአማርኛ አነጋገር ያቀርባል።
- source_word: δίκαιος
  choice: ጻድቅ
  rationale: የቃሉን ሥነ ምግባራዊና ከእግዚአብሔር ሕዝብ ጋር የተያያዘ ሰፊ ትርጉም ያቆያል።
- source_word: εὐλαβής
  choice: እግዚአብሔርን የሚያከብር
  rationale: ቃሉ የሚያመለክተውን 敬虔ነትና አክብሮት ለዘመናዊ አንባቢ ግልጽ በሆነ አገላለጽ ይሰጣል።
- source_word: προσδεχόμενος
  choice: ይጠባበቅ ነበር
  rationale: ተስፋ ያለበትንና ቀጣይ የሆነውን መጠበቅ ያሳያል።
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: የእስራኤልን መጽናናት
  rationale: የተስፋ ቃሉን መጽናናትና መታደስ የሚያካትት የመጽሐፍ ቅዱስ ድምፅ ይጠብቃል።
- source_word: πνεῦμα ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በሉቃስ አጠቃቀምና በቅርብ ዐውዱ ይህ የሚያመለክተው መንፈስ ቅዱስን ነው፤ የግሪኩ የመስተዋድድ እጥረት ግን በማስታወሻ ተገልጧል።
- source_word: ἐπ’ αὐτόν
  choice: በእርሱ ላይ ነበር
  rationale: የመንፈስን መገኘት የሚገልጠውን የግሪክ ምሳሌያዊ አነጋገር በቅርብ ያቆያል።
