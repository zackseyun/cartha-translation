  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: am
  text: እንዲህም ሆነ፤ ከሦስት ቀን በኋላ በቤተ መቅደሱ[a] ውስጥ በመምህራኑ መካከል ተቀምጦ፣ ሲያዳምጣቸውና ጥያቄዎችን ሲጠይቃቸው[b] አገኙት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ἱερόν የሚለው ቃል ውስጠኛውን መቅደስ ብቻ ሳይሆን የቤተ መቅደሱን ሕንፃዎችና አደባባዮች ያካተተውን ሰፊ ግቢ ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ ‘ሲጠይቃቸው።’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: በአማርኛው ተፈጥሯዊ የትረካ ቅንብር በ‘ከሦስት ቀንም በኋላ’ ተዋህዷል
  rationale: የሉቃስን የክስተት መግቢያ ተግባር ይጠብቃል፤ ‘እንዲህም ሆነ’ የሚል ከባድና ያረጀ አገላለጽ ሳያስገድድ በዘመናዊ አማርኛ ተፈጥሯዊ ያደርገዋል።
- source_word: μετὰ ἡμέρας τρεῖς
  choice: ከሦስት ቀንም በኋላ
  rationale: የግሪኩን ጊዜያዊ ቅደም ተከተል በቅርብና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: εὗρον αὐτόν
  choice: አገኙት
  rationale: ቀጥተኛውን የትረካ ግስ በተለመደ አማርኛ ይገልጻል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ ውስጥ
  rationale: መደበኛና ለአንባቢ የታወቀ አተረጓጎም ነው፤ ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን የቤተ መቅደስ ግቢ እንደሚያመለክት በማስታወሻ ተገልጿል።
- source_word: καθεζόμενον ἐν μέσῳ τῶν διδασκάλων
  choice: በመምህራኑ መካከል ተቀምጦ
  rationale: የኢየሱስን አቀማመጥና ቦታ በተፈጥሯዊ አማርኛ ያቀርባል፤ διδάσκαλοι ላይ በግሪኩ ያልተገለጸውን ‘የሕግ’ አይጨምርም።
- source_word: ἀκούοντα αὐτῶν
  choice: ሲያዳምጣቸው
  rationale: በውይይቱ ውስጥ በትኩረት የመስማትን ቀጣይ ድርጊት ይገልጻል።
- source_word: ἐπερωτῶντα αὐτούς
  choice: ጥያቄዎችን ሲጠይቃቸው
  rationale: የመጠየቅን ቀጣይ ድርጊት በግልጽ አማርኛ ያስተላልፋል፤ ግጭት ወይም ምርመራ የሚያመለክት ትርጉም አይጭንም።
theological_decisions:
- issue: ኢየሱስ ከመምህራኑ ጋር ያደረገው ግንኙነት ባሕርይ
  choice: ‘ሲያዳምጣቸውና ጥያቄዎችን ሲጠይቃቸው’ ተብሎ የማዳመጥና የመጠየቅ ሁለቱም ድርጊቶች ተጠብቀዋል።
  alternative: ‘ሲመረምራቸው’ ወይም ‘ሲከራከራቸው’ ብሎ መተርጎም
  rationale: ግሪኩ ንቁ ውይይትን ያሳያል፣ ነገር ግን ግጭትን ወይም ኢየሱስ መምህራኑን እየፈተነ እንደነበር አያስገድድም። ትርጉሙ ትሕትናውንና ጥበቡን ሳይቀንስ የጽሑፉን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ አሁናዊ ቦዝ አንቀጾች በ‘ተቀምጦ ሲያዳምጣቸውና ... ሲጠይቃቸው’ ተጠብቀዋል። የማስታወሻ ምልክቶቹ በዋናው ጽሑፍ ከሚመለከታቸው ቃላት ቀጥለው ተቀምጠዋል።
