  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: am
  text: እርሷም ሰማንያ አራት ዓመት እስኪሆናት ድረስ መበለት ሆና ኖረች[a]። ከቤተ መቅደሱ[b] ሳትለይ፣ ሌሊትና ቀን በጾምና በልመናዎች[c] እግዚአብሔርን ታመልክ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሰማንያ አራት ዓመት በመበለትነት ኖረች።» ግሪክኛው አነጋገር የሐናን ዕድሜ ወይም በመበለትነት የኖረችበትን ጊዜ ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: እዚህ «ቤተ መቅደስ» የሚለው የውስጠኛውን መቅደስ ብቻ ሳይሆን አደባባዮቹንም ጨምሮ መላውን የቤተ መቅደሱን ግቢ ያመለክታል።
    reason: cultural_note
  - marker: c
