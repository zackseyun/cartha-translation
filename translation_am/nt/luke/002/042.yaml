- source_word: ἀναβαινόντων
  choice: ወደ ላይ እየወጡ ሳሉ
  rationale: ወደ ኢየሩሳሌም የመውጣትን እንቅስቃሴ እና የአሁን ጊዜ አሳታፊውን ቀጣይነት ይጠብቃል፤ ‘ወደ ኢየሩሳሌም’ በዚህ ቁጥር ስላልተደገመ አልተጨመረም።
- source_word: αὐτῶν
