- source_word: κατὰ τὸ ἔθος
  choice: እንደ በዓሉ ልማድ
  rationale: ከተመሠረተ ልማድ ጋር የሚስማማ ተግባርን በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: τῆς ἑορτῆς
