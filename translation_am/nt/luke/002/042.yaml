  rationale: ἑορτή ሃይማኖታዊ በዓልን ያመለክታል፤ ይህም በቀደመው ቁጥር የተጠቀሰው የፋሲካ በዓል ነው።
- source_word: καὶ ὅτε
  choice: እርሱም … በሆነ ጊዜ
