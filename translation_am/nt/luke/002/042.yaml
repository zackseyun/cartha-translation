  text: እርሱም የአሥራ ሁለት ዓመት ሲሆን፣ እነርሱ እንደ በዓሉ[b] ልማድ ወደ ላይ ሲወጡ[a]፣
  philosophy: optimal-equivalence
  footnotes:
