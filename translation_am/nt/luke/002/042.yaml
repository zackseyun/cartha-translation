    rationale: «ልጅ» is not present in ἐγένετο ἐτῶν δώδεκα. The context identifies Jesus, but the source only states that he was twelve years old.
  - severity: medium
    issue: Footnote anchors are structurally misplaced
    rationale: Footnote a discusses ἀναβαινόντων and should follow the ascent expression; footnote b explains τῆς ἑορτῆς and should follow «በዓሉ», not both occur at the verse end.
