  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: am
  text: እርሱም፣ “ለምን ትፈልጉኝ ነበር? በአባቴ ቤት ልሆን እንዳለብኝ አታውቁም ነበር?” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአባቴ ጉዳዮች ላይ ልሆን እንዳለብኝ” ወይም “የአባቴ በሆኑት ነገሮች መካከል ልሆን እንዳለብኝ።” የግሪኩ አገላለጽ የተዘለለ ቃል ያለበት ስለሆነ፣ የአባቱን ቤት ወይም የአባቱን ጉዳዮች ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: ለምን
  rationale: የምክንያት ጥያቄውን በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐζητεῖτέ με
  choice: ትፈልጉኝ ነበር
  rationale: በትረካው አውድ የጠፋን ሰው ፈልጎ ማግኘትን ያመለክታል፤ ያለፈውን ቀጣይ ፍለጋም ይገልጣል።
- source_word: οὐκ ᾔδειτε
  choice: አታውቁም ነበር?
  rationale: የግሪኩን አሉታዊ የንግግር ጥያቄ በቀጥታ ይጠብቃል።
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: በአባቴ ቤት
  rationale: ሐረጉ በግሪክ የተዘለለ ስም ያለበት ቢሆንም፣ ኢየሱስ በቤተ መቅደስ መገኘቱ በዋናው ጽሑፍ ‘በአባቴ ቤት’ የሚለውን ይደግፋል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: δεῖ
  choice: ይገባኛል
  rationale: የግድ ወይም የመለኮታዊ አስፈላጊነት ክብደትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἶναί με
  choice: መሆን
  rationale: ከδεῖ ጋር ያለውን ‘መሆን ይገባኛል’ የሚለውን አወቃቀር በቀጥታ ይወክላል።
- source_word: πατρός μου
  choice: አባቴ
  rationale: የግል የልጅነት ግንኙነቱን በቀላልና ክቡር አማርኛ ይገልጣል፤ የአማርኛ ፊደል የአቢይና የንዑስ ፊደል ልዩነት የለውም።
theological_decisions:
- issue: ἐν τοῖς τοῦ πατρός μου የሚለው የተዘለለ ሐረግ
  choice: በዋናው ጽሑፍ ‘በአባቴ ቤት’
  alternative: ‘በአባቴ ጉዳይ’ ወይም ‘የአባቴ በሆኑት ነገሮች መካከል’
  rationale: የቤተ መቅደሱ ቅርብ አውድ ‘ቤት’ን ይደግፋል፤ ሆኖም የግሪኩ ሐረግ የአባቱን ጉዳዮችም ሊያመለክት ስለሚችል አሻሚነቱ በግርጌ ማስታወሻ ተጠብቋል።
- issue: ‘አባቴ’ የሚለው ማንን እንደሚያመለክት
  choice: እግዚአብሔርን እንደ አባቱ ያመለክታል
  alternative: ዮሴፍን ማመልከት
  rationale: የቤተ መቅደሱ አውድና ከዮሴፍ በተለየ መንገድ የቀረበው የኢየሱስ ንግግር እግዚአብሔርን ያመለክታል፤ ትርጉሙ ከጽሑፉ በላይ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ቅደም ተከተል ሳይጠፋ የአማርኛ ተፈጥሯዊ የንግግር አወቃቀር ተከትሏል።
