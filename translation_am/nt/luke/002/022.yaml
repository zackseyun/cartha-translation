base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: am
  text: በሙሴ ሕግ መሠረት የመንጻታቸው ቀኖች በተፈጸሙ ጊዜ[a]፣ ለጌታ ሊያቀርቡት ወደ ኢየሩሳሌም ይዘውት ወጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “የመንጻቷ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: በተፈጸሙ ጊዜ
  rationale: ጊዜው ሙሉ በሙሉ መድረሱን የሚገልጠውን የግስ ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καθαρισμοῦ
  choice: መንጻት
  rationale: ከወሊድ በኋላ በሙሴ ሕግ የታዘዘውን ሥርዓታዊ መንጻት በግልጽና በተለመደ ቃል ይገልጣል።
- source_word: αὐτῶν
  choice: የመንጻታቸው
  rationale: በቀረበው የግሪክ ጽሑፍ ያለውን የብዙ ቁጥር ተውላጠ ስም በዋናው ጽሑፍ ይጠብቃል።
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: በሙሴ ሕግ መሠረት
  rationale: ድርጊቱ ከሙሴ ሕግ ጋር ተስማምቶ መፈጸሙን በተፈጥሯዊ ሕጋዊ አገላለጽ ያሳያል።
- source_word: ἀνήγαγον
  choice: ይዘውት ወጡ
  rationale: ኢየሩሳሌምን ወደ ላይ እንደሚወጡባት ስፍራ የሚያሳየውን አቅጣጫዊ ስሜት ይጠብቃል፣ ሕፃኑንም ይዘው መሄዳቸውን ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስፍራው ስም ነው።
- source_word: παραστῆσαι
  choice: ሊያቀርቡት
  rationale: በሕጋዊና በአምልኮ አውድ ሰውን በእግዚአብሔር ፊት ማቅረብን በግልጽ ያስተላልፋል።
- source_word: κυρίῳ
  choice: ለጌታ
  rationale: κύριοςን በተለመደው ክብር ያለው መጠሪያ ይተረጉማል፤ የወሰን ቅጥያውም የግሪኩን ተቀባይ ያሳያል።
theological_decisions:
- issue: “የመንጻታቸው” የሚለው ተውላጠ ስም ቁጥር
  choice: በዋናው ጽሑፍ የብዙ ቁጥሩን “የመንጻታቸው” ማቆየት
