translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የብዙ ቁጥር አሻሚነት ሳይስተካከል ተጠብቋል።
