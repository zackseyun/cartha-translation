translation:
  language: am
  text: ምክንያቱም ዓይኖቼ ማዳንህን አይተዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አዳኝህን።» ግሪኩ በቀጥታ «ማዳንህን» ይላል፤ በዐውዱ ግን የእግዚአብሔር ማዳን በኢየሱስ የተገለጠ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ የስምዖንን ቀዳሚ ንግግር ምክንያት ያስረዳል፤ ስለዚህ የምክንያት ትርጉሙ በግልጽ ተጠብቋል።
- source_word: εἶδον
  choice: አይተዋል
  rationale: የግሪኩ ግስ የተፈጸመ የማየት ድርጊትን ይገልጣል፤ የአማርኛው ፍጹም አኳኋን ድርጊቱ አሁን ላለው ንግግር ያለውን ውጤት በተፈጥሮ ያሳያል።
- source_word: οἱ ὀφθαλμοί μου
  choice: ዓይኖቼ
  rationale: በምንጩ ያለውን ሕያውና አካላዊ አገላለጽ ከ‘እኔ’ ይልቅ በቀጥታ ይጠብቃል።
- source_word: τὸ σωτήριόν σου
  choice: ማዳንህን
  rationale: σωτήριον በቀጥታ ‘አዳኝ’ የሚለው የግለሰብ ስም ሳይሆን መዳንን፣ ማዳንን ወይም የማዳኛ ዝግጅትን ያመለክታል። ‘ማዳንህን’ የእግዚአብሔርን የማዳን ተግባርና በሕፃኑ የተገለጠውን ውጤት ሳይለያይ ይይዛል።
theological_decisions:
- issue: τὸ σωτήριόν σου እንደ መዳን/ማዳን ይተረጎም ወይስ በሕፃኑ መሲሕ ምክንያት ‘አዳኝህን’ ተብሎ ግላዊ ይደረግ?
  choice: ማዳንህን
  alternative: አዳኝህን
  rationale: ግሪኩ σωτήρ (‘አዳኝ’) ሳይሆን σωτήριον ይላል። ስለዚህ ትርጉሙ የምንጩን ቃል ይጠብቃል፤ በዚያው ጊዜ የእግዚአብሔር ማዳን በኢየሱስ ሰውነት እንደተገኘ ዐውዱ እንዲያሳይ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ዓይኖቼ’ የምንጩን ሕያው አገላለጽ ይጠብቃል፤ ‘ማዳንህን’ ደግሞ ከ‘መዳንህን’ ይልቅ እዚህ የእግዚአብሔርን ባለቤትነትና የማዳን እርምጃ በተፈጥሮ ያሳያል።
