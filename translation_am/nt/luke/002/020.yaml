base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: am
  text: እረኞቹም ስለሰሙትና ስላዩት ሁሉ[b]፣ ልክ እንደተነገራቸው[c]፣ እግዚአብሔርን እያከበሩና እያመሰገኑ ተመለሱ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደነበሩበት ተመልሰው ሄዱ።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በሰሙትና ባዩት ሁሉ ምክንያት።»
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «ልክ ለእነርሱ እንደተነገረው።» ተናጋሪው በግልጽ አልተጠቀሰም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: ተመለሱ
  rationale: የግሪኩ ግስ እረኞቹ ከጉብኝታቸው በኋላ ወደቀድሞ ስፍራቸው ወይም ሥራቸው መመለሳቸውን ያመለክታል፤ «ተመለሱ» ተፈጥሯዊና ግልጽ ነው።
- source_word: οἱ ποιμένες
  choice: እረኞቹ
  rationale: በቀደመው ትረካ የተጠቀሱትን እረኞች በወሳኝ ቅጥያው ይጠቁማል።
- source_word: δοξάζοντες
  choice: እያከበሩ
  rationale: ከመመለሳቸው ጋር አብሮ የቀጠለውን ተግባር ይገልጣል፤ ከ«እያመሰገኑ» ጋር ያለውን የተዛማጅነትና የልዩነት ሚዛን ይጠብቃል።
- source_word: αἰνοῦντες
  choice: እያመሰገኑ
  rationale: እግዚአብሔርን በውዳሴ ማመስገንን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከδοξάζοντες ጋር ያሉት ሁለት ግሶች አልተዋሐዱም።
- source_word: τὸν θεὸν
  choice: እግዚአብሔርን
  rationale: የሁለቱም ቦዝ አንቀጾች ቀጥተኛ ተሳቢ ነው፤ «እግዚአብሔር» በዘመናዊ መደበኛ አማርኛ የተለመደው አጠራር ነው።
- source_word: ἐπὶ πᾶσιν οἷς
  choice: ስለ…ሁሉ
  rationale: ἐπί ከዳቲቭ ጋር እዚህ የውዳሴውን መሠረት ወይም አጋጣሚ ያሳያል፤ «ስለ» ይህን ግንኙነት በአጭርና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἤκουσαν καὶ εἶδον
  choice: ሰሙትና አዩት
  rationale: ሁለቱን የግሪክ አኦሪስት ግሶች በቀላል ያለፈ ጊዜ ይወክላል፤ በአማርኛ የትረካው ቅደም ተከተል የቀደመነታቸውን ሐሳብ በቂ ያደርገዋል።
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: ልክ እንደተነገራቸው
  rationale: καθώς ያለውን የማመሳሰል ኃይል «ልክ እንደ» ይጠብቃል፤ የግሪኩን ተደራጊ ግስ በመጠበቅ ተናጋሪውን በግልጽ አይጨምርም።
theological_decisions:
- issue: የሰሙትና ያዩት ነገር ከቀድሞው መልእክት ጋር መጣጣሙን ሲገልጽ የተናጋሪውን ማንነት በግልጽ መጨመር ወይም አለመጨመር
  choice: «ልክ እንደተነገራቸው» ተብሎ ተደራጊው አነጋገር ተጠብቋል፤ ተናጋሪው አልተጨመረም።
  alternative: «ልክ መልአኩ እንደነገራቸው» ወይም «መላእክቱ እንደነገሯቸው»
  rationale: ዐውደ ንባቡ የመልአኩን መልእክት ቢያመለክትም፣ በዚህ ጥቅስ የግሪኩ ተደራጊ ግስ ተናጋሪውን አይጠቅስም። ስለዚህ ትርጉሙ በጥቅሱ ያልተገለጸ ዝርዝር አያስገባም።
