  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «እያከበሩና እያመሰገኑ» የሚለው ቅርጽ ሁለቱ ቦዝ አንቀጾች ከመመለሳቸው ጋር አብረው የቀጠሉ ተግባራት መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
