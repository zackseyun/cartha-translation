source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: am
  text: በድንገትም ከመልአኩ ጋር እጅግ ብዙ የሰማይ ሠራዊት[a] ተገኙ፤ እግዚአብሔርንም እያመሰገኑ እንዲህ አሉ፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰማያዊ ሠራዊት” ወይም “የሰማይ ጭፍራ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαίφνης
  choice: በድንገትም
  rationale: የድርጊቱን ድንገተኛነትና የትረካውን አስገራሚነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐγένετο
  choice: ተገኙ
  rationale: በዚህ የህልውና አገባብ የሰማያዊውን ሠራዊት በዚያ መገኘት ያመለክታል፤ ‘ታዩ’ ብሎ ግሱን የማየት ድርጊት አድርጎ ከመወሰን ይቆጠባል።
- source_word: σὺν τῷ ἀγγέλῳ
  choice: ከመልአኩ ጋር
  rationale: የአብሮነትን ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πλῆθος
  choice: እጅግ ብዙ
  rationale: ብዛቱን በሕዝብ ዘንድ ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
- source_word: στρατιᾶς οὐρανίου
  choice: የሰማይ ሠራዊት
  rationale: የሰማይ መሆናቸውንና በστρατιά ውስጥ ያለውን የተደራጀ ሠራዊት ምስል ሳያጠፋ ያስተላልፋል።
- source_word: αἰνούντων τὸν θεόν
  choice: እግዚአብሔርንም እያመሰገኑ
  rationale: ቀጣይነት ያለውን የምስጋና ተግባር በግልጽ ያሳያል።
- source_word: καὶ λεγόντων
  choice: እንዲህ አሉ፦
  rationale: በቀጣዩ ቁጥር የሚመጣውን ቀጥተኛ ንግግር በተፈጥሯዊ የአማርኛ ትረካ ያስገባል።
theological_decisions:
- issue: የστρατιᾶς οὐρανίου አተረጓጎም
  choice: የሰማይ ሠራዊት
  alternative: ሰማያዊ ሠራዊት፤ የሰማይ ጭፍራ
  rationale: ሐረጉ የተደራጀ ሰማያዊ ሠራዊትን የሚያስታውስ ወታደራዊ ምስል አለው፤ ነገር ግን በዚህ አውድ ተግባራቸው ውጊያ ሳይሆን ምስጋና ነው። ስለዚህ ትርጉሙ ምስሉን ሳያጠፋ አውዱንም አይገድብም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። ‘እግዚአብሔር’ እና ‘መልአክ’ የተለመዱ የመጽሐፍ ቅዱስ ቃላት ሆነው ተጠብቀዋል፤ የግሪኩ ተያያዥ አንቀጾች ለተፈጥሯዊ አማርኛ ወደ ሁለት ተያያዥ ሐረጎች ተደርገዋል።
