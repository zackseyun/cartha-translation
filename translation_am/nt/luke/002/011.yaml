id: LUK.2.11
reference: Luke 2:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: am
  text: ምክንያቱም ዛሬ በዳዊት ከተማ ለእናንተ አዳኝ ተወልዷል፤ እርሱም መሲሑ ጌታ[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊ አተረጓጎም፣ “ክርስቶስ ጌታ።” የግሪክኛው χριστὸς κύριος በቃል በቃል “መሲሕ ጌታ” ሲሆን፣ በተለምዶ “መሲሑ ጌታ” ተብሎ ይገባል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በቀደመው ቁጥር ያለውን የመልአኩን የምሥራች ማብራሪያና ምክንያት ያስተዋውቃል።
- source_word: ἐτέχθη
  choice: ተወልዷል
  rationale: የτίκτω የተደራጊ ቅርጽን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ አሁን ለአድማጮቹ ጠቀሜታ ያለውን የተፈጸመ ክስተት ያመለክታል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: የጥቅም ተቀባይነትን ያሳያል፤ ልደቱ ለአድማጮቹ የሆነ የምሥራች መሆኑን ይገልጣል።
- source_word: σήμερον
  choice: ዛሬ
  rationale: የጊዜ ተውሳኩን በግልጽና በዘመናዊ አማርኛ ይተረጉማል።
- source_word: σωτήρ
  choice: አዳኝ
  rationale: የማዳንና የመታደግ ትርጉሙን እንዲሁም በዚህ ክፍል ያለውን መሲሐዊ ክብደት የሚያስተላልፍ የተለመደ አማርኛ ስያሜ ነው።
- source_word: ὅς ἐστιν
  choice: እርሱም … ነው
  rationale: አዳኙን ከሚከተሉት ሁለት ማዕረጎች ጋር በተፈጥሯዊ የአማርኛ አገባብ ያገናኛል።
- source_word: χριστός
  choice: መሲሑ
  rationale: ቃሉ እዚህ እንደ ማዕረግ የቀረበ ስለሆነ ትርጉሙን የሚገልጠው “መሲሕ” ተመርጧል፤ የተወሰነው ቅርጽ በአማርኛ የመለያ ስያሜውን ተፈጥሯዊ ያደርገዋል።
- source_word: κύριος
  choice: ጌታ
  rationale: ሥልጣንንና ጠንካራውን ሥነ መለኮታዊ ክብደት የሚጠብቅ የተለመደ ትርጉም ነው።
- source_word: ἐν πόλει Δαυίδ
  choice: በዳዊት ከተማ
  rationale: የቦታውን ሐረግ በቀጥታ ያስተላልፋል፤ ከዳዊት ንጉሣዊ የተስፋ ታሪክ ጋር ያለውንም ግንኙነት ይጠብቃል።
theological_decisions:
- issue: የχριστὸς κύριος አተረጓጎም
  choice: መሲሑ ጌታ
  alternative: የጌታ መሲሕ፤ ክርስቶስ ጌታ
  rationale: ግሪክኛው “አዳኝ” የሚለውን በሁለት ተያያዥ ማዕረጎች—“መሲሕ” እና “ጌታ”—ይለየዋል። “የጌታ መሲሕ” ሊባል የሚችል አተረጓጎም ቢኖርም፣ የግሪክኛውን ቀጥተኛ የማዕረግ አቀራረብ ያነሰ ያሳያል። “ክርስቶስ ጌታ” ባህላዊ ቢሆንም χριστός እዚህ ማዕረግ መሆኑን “መሲሕ” ይበልጥ ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “መሲሑ ጌታ” የሚለው አገላለጽ የግሪክኛውን የሁለት ማዕረጎች ውጥረት ሳያጠፋ ለዘመናዊ አንባቢ ተፈጥሯዊ እንዲሆን ተደርጓል።
