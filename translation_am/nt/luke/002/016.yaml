  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: am
  text: እነርሱም በፍጥነት መጥተው ማርያምንና ዮሴፍን፣ በግርግምም[a] ተኝቶ ያለውን ሕፃን አገኙ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእንስሳት መኖ ማቅረቢያው»። የግሪኩ φάτνη ቃል ግርግምን ወይም የእንስሳት መኖ ማቅረቢያን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: መጥተው
  rationale: የትረካውን እንቅስቃሴ ወደ ተገለጠላቸው ስፍራ እንደመምጣት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σπεύσαντες
  choice: በፍጥነት
  rationale: ድርጊቱ የተፈጸመበትን አጣዳፊ ሁኔታ በግልጽና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ἀνεῦραν
  choice: አገኙ
  rationale: ከመፈለግ በኋላ ማግኘትን የሚያመለክተውን ግስ በተለመደ የአማርኛ ትረካ ያቀርባል።
- source_word: τήν τε Μαριὰμ
  choice: ማርያምን
  rationale: የሰው ስም በአማርኛ መጽሐፍ ቅዱሳዊ አጠራር ተጽፏል፤ τε የሚያሳየው ቅንጅት በ«-ንና» ተወክሏል።
- source_word: Ἰωσὴφ
  choice: ዮሴፍን
  rationale: ስሙ በዘመናዊ አማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ ቅርጽ ይከተላል።
- source_word: τὸ βρέφος
  choice: ሕፃን
  rationale: βρέφος እጅግ ትንሽ ልጅን፣ በዚህም አውድ አራስን ያመለክታል፤ «ሕፃን» ግልጽና የተከበረ አማርኛ ነው።
- source_word: κείμενον
  choice: ተኝቶ ያለውን
  rationale: ግሱ ሕፃኑ የተቀመጠበትን ሁኔታ እንጂ አንድ ሰው ያስተኛውን ድርጊት አያጎላም።
- source_word: ἐν τῇ φάτνῃ
  choice: በግርግም
  rationale: «ግርግም» በልደት ትረካው የተለመደና φάτνη የሚያመለክተውን የእንስሳት መኖ ማቅረቢያ የሚገልጽ ቃል ነው።
- source_word: καὶ ... καὶ ... καὶ
  choice: እነርሱም ... ማርያምንና ዮሴፍን፣ ...ም
  rationale: የግሪኩ ተደጋጋሚ ቅንጅት በተፈጥሯዊ የአማርኛ «-ም/እና» አወቃቀር ተጠብቋል።
