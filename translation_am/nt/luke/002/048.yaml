source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: am
  text: እርሱንም ባዩት ጊዜ እጅግ ተገረሙ፤ እናቱም፣ “ልጅ ሆይ፣ ለምን እንዲህ አደረግህብን? እነሆ፣ አባትህና እኔ በጭንቀት[a] ስንፈልግህ ነበር” አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በሥቃይ።” የግሪኩ ቃል በፍለጋው ጊዜ የነበራቸውን ከባድ የስሜት ሕመም ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ባዩት ጊዜ
  rationale: የአኦሪስት አሳታፊውን ከዋናው ድርጊት በፊት የሆነ ጊዜያዊ ሁኔታ አድርጎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξεπλάγησαν
  choice: እጅግ ተገረሙ
  rationale: ቃሉ የሚገልጠውን ከፍተኛ መደነቅና መገረም በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Τέκνον
  choice: ልጅ ሆይ
  rationale: የእናትነት ቅርበት ያለውን የጥሪ ቅርጽ ይጠብቃል፤ በግሪኩ የሌለውን የባለቤትነት ቅጥያ አይጨምርም።
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: ለምን እንዲህ አደረግህብን?
  rationale: በተፈጥሯዊ አማርኛ የጥያቄውን የቅሬታ ኃይልና ἡμῖν የሚያሳየውን ‘በእኛ ላይ/በእኛ ላይ ያደረሰው’ ግንኙነታዊ ስሜት ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: በቀጥታ ንግግር ውስጥ ትኩረትን የሚስበውን አጽንዖት በተከበረና በሚታወቅ አማርኛ ያቀርባል።
- source_word: ὁ πατήρ σου
  choice: አባትህ
  rationale: ግሪኩ የሚለውን ቀጥተኛ የቤተሰብ አጠራር ያለ ትርጓሜያዊ ቅጽል ይጠብቃል።
- source_word: ὀδυνώμενοι
  choice: በጭንቀት
  rationale: ፍለጋውን ያጀበውን የውስጥ ሥቃይና ከባድ ጭንቀት በተፈጥሯዊ አገላለጽ ያስተላልፋል፤ የቃሉ ጠንካራ ስሜታዊ ኃይል በማስታወሻ ተገልጿል።
- source_word: ἐζητοῦμέν σε
  choice: ስንፈልግህ ነበር
  rationale: ያለፈውን ቀጣይ ፍለጋ የሚያሳየውን ኢምፐርፌክት በተፈጥሯዊ የአማርኛ ቀጣይ ያለፈ ጊዜ ይገልጣል።
theological_decisions:
- issue: ዮሴፍን በኢየሱስ ዘንድ “አባትህ” ብሎ መጥራትና የኢየሱስ መለኮታዊ ልጅነት
  choice: በዋናው ጽሑፍ “አባትህ” የሚለውን ያለ ተጨማሪ ማብራሪያ ማቆየት
  alternative: “ምድራዊ አባትህ” ብሎ መተርጎም
  rationale: የግሪኩ ጽሑፍ የማርያምን ቃል “አባትህና እኔ” ብሎ በቀጥታ ያቀርባል። “ምድራዊ” ማከል ትርጓሜ እንጂ ትርጉም አይሆንም፤ ቀጣዩ ቁጥር የሚያቀርበው ሥነ መለኮታዊ ውጥረትም እንዳለ ይጠበቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “ልጅ ሆይ” እና “እነሆ” በቅዱስ ጽሑፍ ንግግር የሚስማሙ ሆነው ሳለ ለዘመናዊ አንባቢም የሚገቡ ናቸው። የማስታወሻው ምልክት ከሚያብራራው “በጭንቀት” ቀጥሎ ተቀምጧል።
