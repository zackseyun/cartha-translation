id: LUK.2.40
reference: Luke 2:40
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: am
  text: ሕፃኑም እያደገና እየበረታ በጥበብ ይሞላ ነበር፤ የእግዚአብሔርም ሞገስ[a] በእርሱ ላይ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእግዚአብሔር ጸጋ በእርሱ ላይ ነበር።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: ሕፃኑም
  rationale: παιδίον በዚህ የሕፃንነት አውድ «ሕፃን» ማለት ነው፤ δέ ያለውን ቀላል ትስስር «-ም» በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ηὔξανεν καὶ ἐκραταιοῦτο
  choice: እያደገና እየበረታ
  rationale: ሁለቱም ያልተጠናቀቀ ቀጣይ እድገትን የሚገልጹ የግስ ቅርጾች ናቸው፤ ይህ አተረጓጎም አካላዊ እድገቱንና መጠንከሩን ያሳያል።
- source_word: πληρούμενον σοφίᾳ
  choice: በጥበብ ይሞላ ነበር
  rationale: የአሁን ጊዜ አሳታፊ ቅርጹ ከእድገቱ ጋር አብሮ የቀጠለ ሁኔታን ይገልጣል፤ σοφίᾳ የተሞላበትን ይዘት፣ ማለትም ጥበብን፣ ያመለክታል።
- source_word: χάρις θεοῦ
  choice: የእግዚአብሔር ሞገስ
  rationale: χάρις በዚህ ትረካዊ አውድ የእግዚአብሔርን በጎ ፈቃድና ደግነት ያመለክታል፤ «ሞገስ» ይህን በዘመናዊ አማርኛ በግልጽ ያስተላልፋል። «ጸጋ»ም ሕጋዊ የቃል አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
- source_word: ἦν ἐπ’ αὐτό
  choice: በእርሱ ላይ ነበር
  rationale: ἐπί ከεἰμί ጋር በአንድ ሰው ላይ ያለን ቀጣይ መገኘት ይገልጣል፤ ይህ ቅርጽ የግሪኩን ምሳሌያዊ አነጋገር በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: χάρις θεοῦ በክርስቶስ ሰብአዊ እድገት አውድ ውስጥ መተርጎም
  choice: የእግዚአብሔር ሞገስ
  alternative: የእግዚአብሔር ጸጋ
  rationale: «ሞገስ» በሕፃኑ ላይ የነበረውን የእግዚአብሔር በጎ ፈቃድ ያሳያል፤ ቃሉ በክርስቶስ መለኮታዊ ባሕርይ ጉድለት እንዳለ አያመለክትም። «ጸጋ» የሚለው እውነተኛ የቃል አማራጭ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተከታታይ እድገትን ለማሳየት «እያደገና እየበረታ» እና «ይሞላ ነበር» የሚሉ ቅርጾች ተመርጠዋል።
