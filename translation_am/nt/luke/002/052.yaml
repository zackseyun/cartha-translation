  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: am
  text: ኢየሱስም በጥበብና በቁመት[a] እያደገ ሄደ፤ በእግዚአብሔርና በሰዎች ዘንድም ሞገስን እያገኘ ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «በዕድሜ» ወይም «በብስለት»፤ የግሪኩ ἡλικία እነዚህን ትርጉሞች ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: እያደገ ሄደ
  rationale: ያልተፈጸመው የግስ አቀራረብ በጊዜ ሂደት የቀጠለ እድገትን ያመለክታል፤ «እያደገ ሄደ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σοφίᾳ
  choice: በጥበብ
  rationale: ሰፊ የማስተዋልና የመለየት ችሎታን የሚያመለክት መደበኛ ትርጉም ነው።
- source_word: ἡλικίᾳ
  choice: በቁመት
  rationale: ቃሉ ዕድሜን ወይም አካላዊ ቁመትን ሊያመለክት ይችላል። በዚህ አገባብ «ቁመት» የሚታየውን ሰብአዊ እድገት ያሳያል፤ የቃሉ አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: χάριτι
  choice: ባለው ሞገስ
  rationale: ከእግዚአብሔርና ከሰዎች ጋር በተያያዘው አገባብ ቃሉ ረቂቅ ሥነ መለኮታዊ «ጸጋ»ን ሳይሆን የተገኘን ሞገስና ተቀባይነት ይገልጣል።
- source_word: παρὰ θεῷ
  choice: በእግዚአብሔር ... ዘንድ
  rationale: παρά ከተሳቢ ጋር በአንድ ሰው ፊት ወይም ዘንድ ያለን ግንኙነት ያሳያል፤ «ዘንድ» ይህን በአማርኛ በተፈጥሮ ይገልጣል።
- source_word: ἀνθρώποις
  choice: በሰዎች
  rationale: ብዙ ቁጥር ያለው ἄνθρωποι እዚህ በአጠቃላይ ሰዎችን ያመለክታል፤ «ሰዎች» የምንጩን ስፋት ያለ ወንድ-ብቻ ግንዛቤ በትክክል ያስተላልፋል።
theological_decisions:
- issue: ከክርስቶስ ሰብአዊ እድገት ጋር የተያያዘው ሥነ መለኮታዊ ውጥረት
  choice: ጥቅሱ ኢየሱስ በጥበብ፣ በቁመትና በሞገስ በእውነት እያደገ እንደሄደ በቀጥታ ተተርጉሟል።
  alternative: ሥነ መለኮታዊውን ውጥረት ለማስወገድ የኢየሱስን እድገት ማለዘብ ወይም መሸፈን።
  rationale: የግሪክ ጽሑፉ ኢየሱስ በሂደት እንዳደገ በግልጽ ይናገራል። ይህ ስለ እውነተኛ ሰብአዊነቱ የተነገረው ሳይለዘብ ወይም ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እያደገ ሄደ» የግሪኩን ቀጣይ የእድገት ሂደት ያሳያል፤ የἡλικία አሻሚነትም በአንድ የቃላት አማራጭ ማስታወሻ ተጠብቋል።
