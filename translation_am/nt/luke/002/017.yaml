    text: “መልእክት” ወይም “ቃል” ወይም “የተነገረ ነገር”።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ካዩትም በኋላ
  rationale: የአኦሪስት ቦዝ አንቀጹ ከዋናው ድርጊት በፊት የሆነውን ማየት ያመለክታል። በግሪክ ጽሑፍ የሚታየው ነገር በግልጽ አልተጠቀሰም፤ በአማርኛውም የነገሩን ዝርዝር ሳይጨምር የተውላጠ ስም ቅጥያ ብቻ ተጠቅሟል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያሳያል፤ ከግሱ ጋር የተያያዘው “-ም” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐγνώρισαν
  choice: አሳወቁ
  rationale: γνωρίζω አንድን ነገር ለሌሎች የታወቀ ማድረግን ያመለክታል። “አሳወቁ” የግሱን አስደራጊ ኃይል ያቆያል።
- source_word: περὶ τοῦ ῥήματος
  choice: መልእክት
  rationale: ῥῆμα ቃልን፣ ንግግርን ወይም የተነገረን መልእክት ሊያመለክት ይችላል። በዚህ ዐውደ ንባብ እረኞቹ ስለ ሕፃኑ የተቀበሉትን የንግግር ይዘት ስለሚያመለክት “መልእክት” ግልጽና ተፈጥሯዊ ነው፤ ሌሎቹ የቃሉ አማራጮች በማስታወሻ ቀርበዋል።
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: የተነገራቸውን
  rationale: የግሪኩን ተደራጊ ቅርጽና መልእክቱ አስቀድሞ ለእነርሱ መነገሩን ያቆያል።
- source_word: περὶ τοῦ παιδίου τούτου
  choice: ስለዚህ ሕፃን
  rationale: παιδίον በዚህ ዐውደ ንባብ አራስ ሕፃኑን ያመለክታል። “ስለዚህ ሕፃን” የግሪኩን ጠቋሚ ቅጽ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ῥῆμα ከመልአኩ ማብሰሪያ ጋር ያለው ግንኙነት
  choice: መልእክት
  alternative: ቃል፤ የተነገረ ነገር
  rationale: ጥቅሱ እረኞቹ ስለ ኢየሱስ የተነገራቸውን ይዘት እንዳሳወቁ ይገልጻል። “መልእክት” ይህን ይዘት ግልጽ ያደርጋል፤ “ቃል” ወይም “የተነገረ ነገር” የሚሉትም ትርጉሞች የግሪኩ ቃል እውነተኛ አማራጮች ስለሆኑ በማስታወሻ ተጠብቀዋል።
