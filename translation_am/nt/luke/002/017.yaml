  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: am
  text: ካዩትም በኋላ፣ ስለዚህ ሕፃን የተነገራቸውን መልእክት[a] አሳወቁ።
  philosophy: optimal-equivalence
  footnotes:
