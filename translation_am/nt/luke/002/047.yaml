  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ብዙ ቁጥር («ምላሾቹ») እና የቀጣይ ድርጊት ስሜት («ይደነቁ ነበር») ተጠብቀዋል።
