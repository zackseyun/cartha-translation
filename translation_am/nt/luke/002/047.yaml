  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: am
  text: እርሱን የሰሙት ሁሉ በማስተዋሉና በምላሾቹ እጅግ ይደነቁ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እጅግ ተገርመው ነበር።» የግሪኩ ግስ ከፍተኛ መደነቅን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: እጅግ ይደነቁ ነበር
  rationale: የግሱ ያልተፈጸመ የጊዜ ቅርጽ ቀጣይ የሆነ ከፍተኛ መደነቅን ያሳያል፤ «እጅግ ይደነቁ ነበር» ይህን ኃይለኛና ቀጣይ ምላሽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: δέ እዚህ ለትረካው ቀላል ማያያዣ ነው፤ ከ«የሰሙት» ጋር የተያያዘው «-ም» በአማርኛ የተፈጥሮ ፍሰት ይሰጣል።
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: የሰሙትም ሁሉ
  rationale: በኢየሱስ ላይ የሚያመለክተውን የመስማት ተሳታፊ ሐረግ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል፤ «ሁሉ» የπάντεςን ሙሉ ወሰን ይጠብቃል።
- source_word: ἐπὶ τῇ συνέσει
  choice: በማስተዋሉ
  rationale: ἐπί ከዳቲቭ ጋር የመደነቃቸውን መሠረት ወይም ምክንያት ያመለክታል፤ σύνεσις ደግሞ ግንዛቤንና ማስተዋልን ይገልጣል።
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: በምላሾቹ
  rationale: የἀπόκρισιςን ብዙ ቁጥር በግልጽ ሁኔታ ይጠብቃል፤ «ምላሾቹ» በውይይት አውድ ውስጥ ተፈጥሯዊና ዘመናዊ ነው።
theological_decisions: []
