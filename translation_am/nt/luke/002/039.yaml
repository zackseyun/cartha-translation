  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: am
  text: በጌታ ሕግ መሠረት ሁሉንም ነገር ከፈጸሙ በኋላ[a]፣ ወደ ገሊላ፣ ወደ የራሳቸው ከተማ[b] ወደ ናዝሬት ተመለሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታ ሕግ የሚጠይቀውን ሁሉ ካደረጉ በኋላ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል በቀጥታ “ከተማ” ማለት ነው፤ ናዝሬት ግን በዘመኑ አነስተኛ ሰፈር ነበረች።
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: ከ… በኋላ
  rationale: ዐውደ ንባቡ ዋናው ድርጊት ቀድሞ የተጠቀሱት ነገሮች ከተፈጸሙ በኋላ መከተሉን ያሳያል፤ ይህ አተረጓጎም ፈጣንነትን አላግባብ አያጎላም።
- source_word: ἐτέλεσαν
  choice: ከፈጸሙ
  rationale: እዚህ τελέω በሕጉ መሠረት የሚደረጉትን ሥርዓቶች እስከ መጨረሻ ማከናወንን ያመለክታል፤ ‘ፈጸሙ’ ተፈጥሯዊና ከትንቢት ፍጻሜ ጋር ያልተገደበ ነው።
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: በጌታ ሕግ መሠረት ሁሉን ነገር
  rationale: የግሪኩን አገባብና የተደነገጉትን ተግባራት ሙሉነት ይጠብቃል፤ ‘ሕጉ የሚጠይቀውን’ የሚለው ትርጉም በአማራጭ ማስታወሻ ቀርቧል።
- source_word: νόμον κυρίου
  choice: የጌታ ሕግ
  rationale: መጽሐፍ ቅዱሳዊውን አገላለጽ የሚጠብቅና በዘመናዊ አማርኛ ግልጽ የሆነ ትርጉም ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος በጽሑፉ እንዳለው ‘ጌታ’ ተብሎ ተተርጉሟል፤ በዚህ ዐውድ እግዚአብሔርን ያመለክታል።
- source_word: ἐπέστρεψαν
  choice: ተመለሱ
  rationale: በጉዞ ዐውድ ወደ ቀድሞ ስፍራቸው መመለስን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ
  rationale: εἰς የጉዞውን መድረሻ ስለሚያመለክት ‘ወደ’ ተገቢ ነው።
- source_word: εἰς πόλιν ἑαυτῶν
  choice: ወደ ራሳቸው ከተማ
  rationale: ἑαυτῶν ያለውን አጽንዖት ‘ራሳቸው’ ይጠብቃል፤ πόλις ትልቅ ከተማንም አነስተኛ ከተማንም ሊያመለክት ስለሚችል ‘ከተማ’ ተመርጧል።
- source_word: Ναζαρέθ
  choice: ናዝሬት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የቦታው ስም ነው።
theological_decisions:
- issue: ‘የጌታ ሕግ’ በሚለው ሐረግ ‘ጌታ’ የሚያመለክተው
  choice: በቅዱሳት መጻሕፍት የተሰጠው መለኮታዊ ሕግ ባለቤት የሆነውን እግዚአብሔር
  alternative: በዚህ ዐውድ ትልቅ ሥነ መለኮታዊ ልዩነት ያለው ሌላ አተረጓጎም የለም።
  rationale: ሐረጉ የተለመደ የአይሁድ መጽሐፍ ቅዱሳዊ አገላለጽ ነው፤ ቀጥተኛ ትርጉሙ ቤተሰቡ ለሕጉ ያሳየውን ታዛዥነት ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ εἰς በ‘ወደ ገሊላ፣ ወደ ራሳቸው ከተማ … ወደ ናዝሬት’ ተጠብቆ መድረሻዎቹ በግልጽ ተያይዘዋል።
