  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: am
  text: '“በአርያም ለእግዚአብሔር ክብር፣

    በምድርም በእግዚአብሔር በተወደዱ ሰዎች መካከል ሰላም!”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምድርም እርሱ ደስ በሚሰኝባቸው ሰዎች መካከል ሰላም።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች፣ “በምድርም ሰላም፣ በሰዎችም በጎ ፈቃድ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: ክብር
  rationale: በዚህ የውዳሴ አዋጅ ውስጥ ለእግዚአብሔር የሚሰጥን ክብር ያመለክታል፤ የግሪኩን ሥነ አምልኮአዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: ἐν ὑψίστοις
  choice: በአርያም
  rationale: ከፍተኛውን ሰማያዊ ስፍራ በተፈጥሯዊና በተከበረ አማርኛ ይገልጣል፣ ከ“በምድር” ጋርም ያለውን ቦታዊ ንጽጽር ይጠብቃል።
- source_word: θεῷ
  choice: ለእግዚአብሔር
  rationale: የግሪኩን የተቀባይ ወይም የማድረሻ ቅርጽ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἐπὶ γῆς
  choice: በምድር
  rationale: ቀጥተኛና ዘመናዊ አተረጓጎም ሲሆን ከሰማያዊው ስፍራ ጋር ያለውን ንጽጽር ያስጠብቃል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: ቃሉ የሚያመለክተውን ሰፊ መጽሐፍ ቅዱሳዊ ሰላም ያለማጥበብ ያስተላልፋል።
- source_word: ἐν ἀνθρώποις
  choice: ሰዎች መካከል
  rationale: ἄνθρωποι በዚህ አገባብ የሰውን ዘር በአጠቃላይ ያመለክታል፤ “ሰዎች” በዘመናዊ አማርኛ ተፈጥሯዊና ጾታን ሳያጠብ ትክክለኛ ነው።
- source_word: εὐδοκίας
  choice: በበጎ ፈቃድ ሰዎች
  rationale: የጄኒቲቭ ቅርጹን ከ“ሰዎች” ጋር በማያያዝ እነዚያ ሰዎች የበጎ ፈቃድ ተቀባዮች መሆናቸውን ያሳያል፤ በግሪኩ ያልተገለጸውን “የእርሱ” ባለቤትነት ወደ ዋናው ጽሑፍ አያክልም።
theological_decisions:
- issue: በመላእክቱ አዋጅ ውስጥ የεὐδοκίας ጄኒቲቭ ትርጉም
  choice: ሰላሙ ከበጎ ፈቃድ ጋር በተያያዙ ሰዎች መካከል እንደሆነ ተተርጉሟል።
  alternative: “በምድርም ሰላም፣ በሰዎችም በጎ ፈቃድ” የሚለው በεὐδοκία ኖሚናቲቭ የእጅ ጽሑፍ ልዩነት ላይ የተመሠረተ ንባብ፤ ወይም “እርሱ በሚደሰትባቸው ሰዎች መካከል” የሚለው ይበልጥ ፈሊጣዊ አተረጓጎም።
  rationale: SBLGNT εὐδοκίας የሚለውን ጄኒቲቭ ንባብ ይዟል፤ ስለዚህ ቃሉ “ሰዎች”ን ይገድባል እንጂ ሦስተኛ የተለየ የአዋጁ ክፍል አይደለም። ትርጉሙ ይህን ሰዋሰዋዊ ኃይል ይጠብቃል፣ ነገር ግን ስለ ምርጫ ወይም ስለ መለኮታዊ ውሳኔ ሙሉ የእምነት ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተስማሚ የአማርኛ አገላለጽ ተጠቅሟል። “በአርያም” የአዋጁን ሥነ አምልኮአዊ ድምፅ ይጠብቃል፤ “ሰዎች” ደግሞ የἀνθρώποιςን አጠቃላይ የሰው ዘር ማመልከቻ በተፈጥሯዊ መንገድ ያስተላልፋል።
