  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: am
  text: እንዲሁም በጌታ ሕግ እንደተነገረው[a]፣ ሁለት ዋኖሶች ወይም ሁለት የርግብ ጫጩቶች የሚሆን መሥዋዕት ለማቅረብ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጌታ ሕግ እንደሚነገረው።”
    reason: የግሪኩ ፍጹም ተደራጊ አሳታፊ ቀድሞ ተነግሮ ጸንቶ የሚኖረውን ቃል ስለሚያመለክት፣ በአማርኛ ያለፈ ጊዜያዊ ወይም የአሁን ጊዜያዊ አገላለጽ ሁለቱም ይቻላሉ።
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: ለማቅረብ
  rationale: δίδωμι ቃል በቃል ‘መስጠት’ ቢሆንም፣ ከθυσίαν ጋር በመሥዋዕት አውድ ‘መሥዋዕት ማቅረብ’ የተፈጥሯዊና ትክክለኛ አማርኛ ነው፤ የዓላማ አንቀጹም ‘ለማቅረብ’ ተብሎ ተጠብቋል።
- source_word: θυσίαν
  choice: መሥዋዕት
  rationale: ቃሉ በዚህ የሕጋዊ የንጽሕና ሥርዓት አውድ የሚቀርብ መሥዋዕትን ያመለክታል።
- source_word: κατὰ τὸ εἰρημένον
  choice: እንደተነገረው
  rationale: የፍጹም ተደራጊ አሳታፊው በሕጉ የተነገረና ጸንቶ የሚኖር ቃል መሆኑን ያሳያል፤ ‘እንደታዘዘው’ በማለት የትእዛዝን ሐሳብ በትርጓሜ አልጨመረም።
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: በጌታ ሕግ
  rationale: νόμος የሙሴን ሕግ እንደ ቅዱስ ጽሑፍ ያመለክታል፤ κύριος ደግሞ በመደበኛው የአዲስ ኪዳን አጠቃቀም ‘ጌታ’ ተብሏል።
- source_word: ζεῦγος
  choice: ሁለት
  rationale: ζεῦγος በዚህ አውድ ጥንድ ወፎችን ያመለክታል፤ በአማርኛ ‘ሁለት ዋኖሶች’ ማለት ተፈጥሯዊ ሲሆን የጥንድነቱንም ትርጉም ያስተላልፋል።
- source_word: τρυγόνων
  choice: ዋኖሶች
  rationale: τρυγών ከአጠቃላይ ርግብ ይልቅ turtledove የተባለውን የተወሰነ የወፍ ዓይነት ያመለክታል፤ ‘ዋኖስ’ ይህን ልዩነት ይጠብቃል።
- source_word: νοσσοὺς περιστερῶν
  choice: የርግብ ጫጩቶች
  rationale: νοσσός ገና ያላደገ ወፍን፣ περιστερά ደግሞ ርግብን ያመለክታል፤ ‘የርግብ ጫጩቶች’ ሁለቱንም ክፍሎች ግልጽ አድርጎ ያስተላልፋል።
theological_decisions:
- issue: በቅዱስ ጽሑፋዊ የሕግ አገላለጽ ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የግሪኩ ጽሑፍ κύριος ይላል፤ ‘ጌታ’ የቃሉን የአዲስ ኪዳን ቅርጽ በቀጥታ ይጠብቃል። ‘እግዚአብሔር’ የብሉይ ኪዳኑን መለኮታዊ ስም አውድ ሊያጎላ ቢችልም፣ እዚህ ከግሪኩ በላይ የሆነ ውሳኔ ስለሚጨምር አልተመረጠም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ጥቅሱ ከቁጥር 23 የቀጠለ የዓላማ አንቀጽ ስለሆነ፣ በአማርኛ ሙሉ ዓረፍተ ነገር እንዲሆን ‘መጡ’ ከቀደመው አውድ ተደግሟል። የሕጉ ቃል ቀጥተኛ ጥቅስ መሆኑን ለማሳየት የጥቅስ ምልክት ገብቷል።
