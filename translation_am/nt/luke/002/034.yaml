id: LUK.2.34
reference: Luke 2:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: am
  text: ስምዖንም ባረካቸውና እናቱን ማርያምን እንዲህ አላት፤ “እነሆ፣ ይህ ልጅ በእስራኤል ውስጥ ለብዙዎች መውደቅና መነሣት፣ እንዲሁም ተቃውሞ ለሚነሣበት ምልክት እንዲሆን ተወስኗል።[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተቃራኒ ነገር ለሚነገርበት ምልክት።”
    reason: ἀντιλεγόμενον የሚለውን የግሪክ ቃል ይበልጥ ቀጥተኛ በሆነ መንገድ ያሳያል።
lexical_decisions:
- source_word: κεῖται
  choice: ተወስኗል
  rationale: ቃሉ በዚህ አውድ የተመደበ ወይም የተወሰነ ዓላማን ያመለክታል፤ የቃል በቃል ‘ተቀምጧል/ተኝቷል’ ትርጉም በአማርኛ ይህን ፍቺ አያስተላልፍም።
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: መውደቅና መነሣት
  rationale: የግሪኩን ተቃርኖና በብዙዎች ላይ ያለውን አሻሚ አያያዝ ሳይፈታ ይጠብቃል።
- source_word: σημεῖον ἀντιλεγόμενον
  choice: ተቃውሞ ለሚነሣበት ምልክት
  rationale: ἀντιλεγόμενον በቃል ደረጃ ‘ተቃራኒ ነገር የሚነገርበት’ ማለት ሲሆን፣ ይህ አገላለጽ በተፈጥሯዊ አማርኛ ምልክቱ ተቃውሞ እንደሚገጥመው ያሳያል።
- source_word: οὗτος
  choice: ይህ ልጅ
  rationale: ‘ይህ’ የሚለውን አመልካች ይጠብቃል፤ ‘ልጅ’ ከሕፃኑ ኢየሱስ ጋር ያለውን ማጣቀሻ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: ‘መውደቅና መነሣት’ ለተመሳሳይ ሰዎች ወይስ ለተለያዩ ቡድኖች መሆኑ
  choice: በእስራኤል ውስጥ ለብዙዎች መውደቅና መነሣት
  alternative: አንዳንዶች እንዲወድቁ ሌሎችም እንዲነሡ
  rationale: የግሪኩ አገባብ መውደቅንና መነሣትን ‘ለብዙዎች’ ጋር በአንድነት ያያይዛል፤ ትርጉሙ ቡድኖቹን ሳይከፋፍል ይህን ሥነ መለኮታዊ ውጥረት ጠብቋል።
- issue: κεῖται መለኮታዊ ውሳኔን ወይም አጠቃላይ መመደብን ማመልከቱ
  choice: ተወስኗል
  alternative: ተመድቧል
  rationale: አውዱ ዓላማና የተወሰነ ሚና እንዳለው ያሳያል፤ ወሳኙን በስም በመጨመር ግን ጽሑፉ ከሚለው አልፎ አይሄድም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆ” መጽሐፍ ቅዱሳዊ ክብሩን ሲጠብቅ፣ የቀረው አገላለጽ በዘመናዊ ንግግር ተፈጥሯዊ እንዲሆን ተደርጓል።
