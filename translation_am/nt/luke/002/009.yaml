  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ብዙ καί አገናኞች የትረካውን ቅኝት ለማቆየት በ“-ም” ተንጸባርቀዋል፤ ሥርዓተ ነጥቡ ግን ሐሳቦቹን በግልጽ ይከፍላል።
