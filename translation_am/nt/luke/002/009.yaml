  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: am
  text: የጌታ መልአክ በአጠገባቸው ቆመ[a]፤ የጌታም ክብር በዙሪያቸው አበራ፤ እጅግም ፈሩ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ እነርሱ መጣ” ወይም “በፊታቸው ቆመ።” የግሪኩ ግስ በአጠገብ መቆምንም ሆነ ድንገት መገኘትን ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ታላቅ ፍርሃትን ፈሩ።” ይህ አገላለጽ እጅግ ከባድ ፍርሃትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: በዚህ ትረካ ውስጥ ἄγγελος ሰማያዊውን ‘መልአክ’ ያመለክታል። ግሪኩ መስተዋድድ የለውም፤ አማርኛም በዚህ የባለቤትነት አወቃቀር ላይ የተወሰነነትን በግድ አይጨምርም።
- source_word: κυρίου
  choice: ጌታ
  rationale: መለኮታዊውን ተጠቃሽ በክብርና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ‘ጌታ’ ብሎ ያቀርባል።
- source_word: ἐπέστη αὐτοῖς
  choice: ድንገት በአጠገባቸው ቆመ
  rationale: ἐφίστημι በአጠገብ መቆምንም ሆነ ድንገተኛ መገኘትን ሊገልጽ ይችላል። ይህ አተረጓጎም ሁለቱንም ገጽታዎች በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δόξα κυρίου
  choice: የጌታ ክብር
  rationale: δόξα የመለኮታዊ ግርማና ብርሃን ክብደትን ሳያጠብ ‘ክብር’ ተብሎ ቀጥተኛ ትርጉም አግኝቷል።
- source_word: περιέλαμψεν αὐτούς
  choice: በዙሪያቸው አበራ
  rationale: περιλάμπω ብርሃን ዙሪያን እንደሚከብብ ይገልጻል፤ ‘በዙሪያቸው አበራ’ ቅርብና ግልጽ ነው።
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: እጅግ ፈሩ
  rationale: የግሪኩ ተመሳሳይ ሥር ያላቸው ግስና ስም ጥምረት ፍርሃቱን ያጠናክራል። በዘመናዊ አማርኛ ‘ታላቅ ፍርሃትን ፈሩ’ ሰዋሰዋዊ ቢሆንም ከባድ ስለሚሰማ፣ ‘እጅግ ፈሩ’ የማጠናከሪያውን ኃይል በተፈጥሯዊ ሁኔታ ያቆያል።
theological_decisions:
- issue: በሁለቱ የባለቤትነት ሐረጎች ውስጥ κύριος የሚተረጎምበት መንገድ
  choice: ጌታ
  alternative: ባለቤት
  rationale: በዚህ አውድ ተጠቃሹ እግዚአብሔር ነው፤ ‘ጌታ’ የቃሉን መለኮታዊና ኪዳናዊ ክብደት ይጠብቃል።
