  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: am
  text: ወላጆቹም በየዓመቱ ለፋሲካ በዓል ወደ ኢየሩሳሌም ይሄዱ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: ይሄዱ ነበር
  rationale: ያለፈውን ጊዜ ተደጋጋሚ ልማድ የሚገልጠውን የግሪክ ኢምፐርፌክት ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γονεῖς
  choice: ወላጆቹ
  rationale: የግሪኩን ብዙ ቁጥር ስም በቀጥታና በተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: κατ’ ἔτος
  choice: በየዓመቱ
  rationale: ‘በየዓመቱ’ የሚለው ተከፋፋይ የዓመታዊ ድግግሞሽ ሐሳብን በግልጽ ያስተላልፋል።
- source_word: Ἰερουσαλὴμ
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ይጠብቃል።
- source_word: τῇ ἑορτῇ
  choice: ለ… በዓል
  rationale: በጉዞው አውድ ያለውን የአጋጣሚና የዓላማ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ πάσχα
  choice: ፋሲካ
  rationale: በዚህ የአይሁድን የማለፍ በዓል የሚያመለክተውን πάσχα በአማርኛ የተለመደው ስያሜ ይተረጉማል፤ ‘በዓል’ የሚለው ከἑορτή ጋር ተያይዞ ትርጉሙን ግልጽ ያደርጋል።
theological_decisions:
- issue: የኢየሱስ ቤተሰብ አባላት አጠራር
  choice: ወላጆቹ
  alternative: አባቱና እናቱ
  rationale: ግሪኩ ‘ወላጆቹ’ ይላል። ይህን ተራ የቤተሰብ ቃል እንዳለ መተርጎም በሉቃስ ሌላ ስፍራ ስለተገለጸው ድንግል ፅንሰት የተለየ የዶክትሪን መደምደሚያ አያስገባም፤ የትረካውን ግልጽ አነጋገርና ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። ‘ይሄዱ ነበር’ ከ‘በየዓመቱ’ ጋር ተደጋጋሚውን ያለፈ ልማድ በተፈጥሯዊ ሁኔታ ያሳያል።
