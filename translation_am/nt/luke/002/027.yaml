  text: 'እርሱም በመንፈስ[a] ወደ ቤተ መቅደስ መጣ፤ ወላጆቹም[b] ሕፃኑን ኢየሱስን በሕጉ ልማድ መሠረት ስለ እርሱ ለማድረግ ባስገቡት ጊዜ፣


    [a] “በመንፈስ ተመርቶ” ተብሎም ሊተረጎም ይችላል። የግሪኩ አገላለጽ ሁለቱንም ትርጉሞች ሊይዝ ይችላል፤ “በመንፈስ” የሚለው ግን የግሪኩን አገላለጽና ሉቃስ በዚህ ክፍል ለመንፈስ ቅዱስ የሰጠውን ተደጋጋሚ አጽንዖት በቅርብ ይጠብቃል።


    [b] በግሪክኛ “ወላጆቹ” ይላል። ሉቃስ ኢየሱስን ሲንከባከቡ ለነበሩት ለማርያምና ለዮሴፍ የተለመደውን የቤተሰብ አጠራር እዚህ ይጠቀማል።'
  philosophy: optimal-equivalence
