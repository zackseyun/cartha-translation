  rationale: የግሪኩን መስተዋድዳዊ አገላለጽ ይጠብቃል፤ የአማርኛው “በ” በመንፈስ ውስጥ መሆንንም ሆነ በመንፈስ መመራትን ሊያመለክት ስለሚችል የምንጩን የትርጉም ስፋት ይጠብቃል። የቅርቡ አውድ መንፈስ ቅዱስን ያመለክታል።
