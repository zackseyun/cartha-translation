  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: am
  text: አባቱና እናቱም ስለ እርሱ በሚነገሩት ነገሮች ይደነቁ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ «አባቱ»። ይህ በትረካው ውስጥ ዮሴፍን በተለመደው ቤተሰባዊና ሕጋዊ አገባብ ያመለክታል። አንዳንድ ትርጉሞች፣ ሉቃስ ቀደም ሲል ኢየሱስ ከድንግል መፀነሱን ከተረከው ጋር በተያያዘ የተሳሳተ ግንዛቤ እንዳይፈጠር፣ «ዮሴፍና እናቱ» ብለው ያነባሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: አባቱ
  rationale: የግሪኩን «አባቱ» የሚለውን ቀጥተኛ አገላለጽ ይጠብቃል፤ በትረካው ውስጥ ዮሴፍን በቤተሰባዊና በሕጋዊ አገባብ ያመለክታል።
- source_word: μήτηρ
  choice: እናቱ
  rationale: μήτηρ የሚለውን መደበኛና ተፈጥሯዊ የአማርኛ አቻ ይሰጣል።
- source_word: θαυμάζοντες
  choice: ይደነቁ ነበር
  rationale: ἦν ከአሁን ጊዜ አንቀጽ ጋር የሚሰጠውን በቀድሞ ጊዜ የቀጠለ ድንቅና አድናቆት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: በሚነገሩት ነገሮች
  rationale: የብዙ ቁጥር ተሳቢ አንቀጹን በግልጽ ሁኔታ ጠብቆ፣ እየተነገሩ ያሉትን ነገሮች ያመለክታል።
- source_word: περὶ αὐτοῦ
  choice: ስለ እርሱ
  rationale: περί ከዘር አገናዛቢ ጋር ያለውን «ስለ/በተመለከተ» ትርጉም በተፈጥሯዊና ክቡር አማርኛ ይገልጣል።
theological_decisions:
- issue: ዮሴፍን «አባቱ» ማለትና ሉቃስ ቀደም ሲል የገለጸው የኢየሱስ ድንግል መፀነስ
  choice: የግሪኩን ንባብ «አባቱ» ብሎ በዋናው ጽሑፍ መተርጎም፣ የቤተሰብና የሕግ አገባቡን በማስታወሻ ማብራራት
  alternative: «ዮሴፍና እናቱ» ብሎ መተርጎም
  rationale: ግሪኩ በቀጥታ «አባቱ» ይላል። ሉቃስ ዮሴፍን በተለመደው ቤተሰባዊና ሕጋዊ አገባብ የኢየሱስ አባት ብሎ ሊጠራው ይችላል፤ ይህም ቀደም ሲል የተገለጸውን ድንግል መፀነስ አይክድም። ትርጉሙ በግሪኩ ያለውን ውጥረት ሳያስወግድ ይጠብቃል።
