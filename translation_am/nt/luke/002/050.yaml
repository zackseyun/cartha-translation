lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ ይገልጻል፤ በግሪኩ በግልጽ የሌለ የተቃርኖ ኃይል አይጨምርም።
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: በዐውዱ የኢየሱስን ወላጆች ያመለክታል፤ በግሪኩ ያለውን ግልጽ ተውላጠ ስም ይጠብቃል።
- source_word: οὐ συνῆκαν
  choice: አልተረዱም
  rationale: የግሪኩን ቀጥተኛ የአለመረዳት ትርጉም በተፈጥሯዊና በዘመናዊ አማርኛ ያቀርባል፤ ‘ሙሉ በሙሉ’ የሚል ያልተጻፈ ማለዘቢያ አይጨምርም።
- source_word: τὸ ῥῆμα
  choice: ቃል
  rationale: ኢየሱስ አሁን የተናገረውን ንግግር ያመለክታል፤ የግሪኩን ሰፊ የትርጉም ክልል ለማሳየት አማራጮቹ በማስታወሻ ተጠቅሰዋል።
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: የተናገራቸውን
  rationale: ‘ለእነርሱ የተናገረውን’ የሚለውን ግንኙነት በአጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ይሰጣል።
theological_decisions:
- issue: የኢየሱስ ወላጆች ምላሽ ትረካዊ አቀራረብ
  choice: እነርሱ የኢየሱስን ቃል እንዳልተረዱ በግልጽ ተተርጉሟል።
  alternative: ‘ሙሉ በሙሉ አልተረዱም’ ወይም ‘አልተቀበሉትም’
  rationale: ግሪኩ የሚናገረው ስለ አለመረዳት እንጂ ስለ ከፊል መረዳት ወይም ስለ አለመቀበል አይደለም፤ ትርጉሙ ስለ ኢየሱስ ማንነትና ተልእኮ ያለውን ትረካዊና ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ቀላል የትረካ ፍሰትና የአለመረዳት ግልጽ አባባል ተጠብቀዋል።
