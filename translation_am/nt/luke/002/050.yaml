review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys καὶ, the explicit plural referent, their lack of understanding, and the specific saying Jesus spoke to them. The relative verbal phrase is, however, structurally awkward in modern standard Amharic and can obscure the intended relation.
  naturalness: እነርሱም ... አልተረዱም is natural. Recasting the relative clause with an explicit subject and ለእነርሱ makes the sentence fully clear and idiomatic without adding meaning.
  terminology: ቃል is an appropriate primary rendering of τὸ ῥῆμα in this context. The lexical-alternative note suitably records the broader sense.
  issues:
  - severity: medium
    issue: The phrase የተናገራቸውን ቃል is grammatically and stylistically awkward.
    rationale: The enclitic object in ተናገራቸው can be understood as ‘spoke to them,’ but attaching -ን to the relative form before ቃል produces an unclear construction. እርሱ ለእነርሱ የተናገረውን ቃል clearly represents ὃ ἐλάλησεν αὐτοῖς.
  revised_text: እነርሱም እርሱ ለእነርሱ የተናገረውን ቃል[a] አልተረዱም።
