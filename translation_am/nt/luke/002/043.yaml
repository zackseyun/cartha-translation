  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: am
  text: የበዓሉን ቀኖች ከጨረሱ በኋላ፣ እነርሱ ሲመለሱ ልጁ ኢየሱስ በኢየሩሳሌም ቀረ[a]፤ ወላጆቹም[b] ይህን አላወቁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ኋላ ቀረ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው፣ “ወላጆቹ።” ሉቃስ እዚህ የተጠቀመው መደበኛ የቤተሰብ አጠራር በወንጌሉ ቀደም ሲል የተገለጸውን ከድንግል መፀነስ አይክድም።
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: የበዓሉን ቀኖች ከጨረሱ በኋላ
  rationale: የግሪኩ የጄኒቲቭ አብሶሉት አወቃቀር ከዋናው ድርጊት በፊት ቀኖቹ መጠናቀቃቸውን ያሳያል። ‘የበዓሉን’ የሚለው በቅርብ አውድ የተጠቀሱትን ቀኖች በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: እነርሱ ሲመለሱ
  rationale: ἐν ከአርቲኩላር ኢንፊኒቲቭ ጋር የሚያመለክተውን በአንድ ጊዜ እየተከናወነ ያለ ድርጊት የአማርኛው ‘ሲመለሱ’ በተፈጥሮ ይገልጻል፤ በግሪኩ ያልተገለጸ መድረሻም አልተጨመረም።
- source_word: ὑπέμεινεν
  choice: ቀረ
  rationale: በዚህ አውድ ግሱ በቦታው መቅረትን፣ በአውዱም ከተጓዦቹ ወደ ኋላ መቅረትን ያመለክታል። ‘ቀረ’ አጭር፣ ተፈጥሯዊና የትርጉሙን ስፋት የሚጠብቅ ነው።
- source_word: ὁ παῖς
  choice: ልጁ
  rationale: παῖς በአውዱ የአሥራ ሁለት ዓመቱን ኢየሱስ ያመለክታል። ‘ልጁ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን እንደ ‘አገልጋይ’ ያለውን በዚህ አውድ የማይፈለግ ትርጉም ያስወግዳል።
- source_word: ἐν Ἰερουσαλήμ
  choice: በኢየሩሳሌም
  rationale: ἐν ከቦታ ስም ጋር ያለውን መደበኛ የቦታ አገልግሎት ‘በ-’ በቀጥታ ይገልጻል።
- source_word: οὐκ ἔγνωσαν
  choice: ይህን አላወቁም
  rationale: γινώσκω እዚህ ላይ አንድን ሁኔታ ማወቅ ወይም መገንዘብ ማለት ነው። በአማርኛ ዓረፍተ ነገሩ የተሟላ እንዲሆን ‘ይህን’ ተጨምሮ ኢየሱስ መቅረቱን እንዳላወቁ ያመለክታል።
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ወላጆቹ
  rationale: γονεῖς በቀጥታ ‘ወላጆች’ ማለት ነው። ይህ ምርጫ የሉቃስን መደበኛ የቤተሰብ አጠራር ሳያሰፋ ወይም ሳያስማማ ይጠብቃል።
theological_decisions:
- issue: ማርያምና ዮሴፍን οἱ γονεῖς αὐτοῦ ብሎ መጥራቱ
  choice: ወላጆቹ
  alternative: እናቱና ዮሴፍ
  rationale: የግሪኩ ጽሑፍ በግልጽ ‘ወላጆቹ’ ይላል። ይህን በቀጥታ መተርጎም ሉቃስ ቀደም ሲል የገለጸውን ከድንግል መፀነስ አይክድም፤ ይልቁንም ወንጌላዊው በዚህ ትረካ የተጠቀመውን መደበኛ የቤተሰብ ቋንቋ እና በጽሑፉ ያለውን ውጥረት ሳያስወግድ ይጠብቃል።
