lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል ትረካዊ አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ ያሳያል።
- source_word: πάντες οἱ ἀκούσαντες
  choice: የሰሙት ሁሉ
  rationale: በስም ተግባር የቀረበውን የግሪክ አንቀጽና አላፊ ግስ በተፈጥሯዊ አማርኛ ‘የሰሙት ሁሉ’ ብሎ ይገልጣል፤ በ‘ሰሙት’ ያለው ‘-ት’ ከአውዱ የሚታወቀውን የእረኞቹን ወሬ ያመለክታል።
- source_word: ἐθαύμασαν
  choice: ተደነቁ
  rationale: ግሱ የሚገልጠውን የመገረምና የመደነቅ ስሜት በዘመናዊና ግልጽ ቃል ያስተላልፋል።
- source_word: περὶ τῶν λαληθέντων
  choice: ስለ…ነገር
  rationale: περί ከዘር አገባብ ጋር ያለውን ‘ስለ/በተመለከተ’ ትርጉምና የተነገረውን ይዘት በተፈጥሯዊ የአማርኛ አገባብ ይይዛል።
- source_word: ὑπὸ τῶν ποιμένων
  choice: እረኞቹ
  rationale: በግሪኩ ያለውን የድርጊቱን ፈጻሚ በአማርኛ ንቁ አገባብ ውስጥ በግልጽ ያቀርባል።
- source_word: πρὸς αὐτούς
  choice: ነገሯቸው
  rationale: ወደ ሰሚዎቹ የተመራውን ንግግር ‘-አቸው’ በሚለው ተሳቢ ቅጥያ ያሳያል፤ የተውላጠ ስሙን ማጣቀሻ ከግሪኩ በላይ አይገድብም።
