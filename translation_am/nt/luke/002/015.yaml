  issues:
  - severity: medium
    issue: The hortatory force of Διέλθωμεν is weakened by “ሄደን.”
    rationale: “ሄደን” is a conjunctive form (‘having gone/go and’), whereas the Greek explicitly urges joint action. “እንሂድ” directly renders ‘let us go.’
  - severity: low
    issue: “የተፈጸመውን” is not the best equivalent of γεγονός in this context.
    rationale: It may imply that something was fulfilled or completed. “የሆነውን” naturally conveys ‘what has happened’ without importing fulfillment language.
