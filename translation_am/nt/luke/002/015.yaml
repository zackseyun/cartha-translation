base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: am
  text: እንዲህም ሆነ፤ መላእክቱ ከእነርሱ ተለይተው ወደ ሰማይ በሄዱ ጊዜ፣ እረኞቹ እርስ በርሳቸው፣ “እንግዲህ እስከ ቤተ ልሔም[b] እንሂድ፤ ጌታ ያሳወቀንን ይህን የሆነውን ነገር[a] እንይ” ተባባሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሆነውን ጉዳይ” ወይም “የሆነውን ቃል” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ῥῆμα “ቃል፣ ጉዳይ፣ ነገር” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ወደ ቤተ ልሔም”፤ የግሪኩ ἕως በቃል ቅርብ “እስከ ቤተ ልሔም” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: እንዲህም ሆነ
  rationale: የሉቃስን የትረካ መሸጋገሪያ በክቡርና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: ከእነርሱ ተለይተው ወደ ሰማይ በሄዱ ጊዜ
  rationale: ὡςን በጊዜ አመልካች ሐረግ ይተረጉማል፤ ἀπ’ αὐτῶνንና εἰς τὸν οὐρανόνንም በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: እርስ በርሳቸው … ተባባሉ
  rationale: ቀጥተኛውን ንግግር በተፈጥሯዊ አማርኛ ያስገባል፤ የጋራ መነጋገሩንም ያሳያል።
- source_word: Διέλθωμεν δὴ
  choice: እንግዲህ … ሄደን
  rationale: የhortatory subjunctiveውን የጋራ ግብዣና δὴ የሚሰጠውን አፋጣኝ አጽንዖት ይገልጣል።
- source_word: ἕως Βηθλέεμ
  choice: እስከ ቤተ ልሔም
  rationale: ἕως ያለውን ‘እስከ’ የመድረሻ ሐሳብ በቅርብ ይጠብቃል፤ ‘ወደ ቤተ ልሔም’ የሚለው ይበልጥ ለስላሳ አማራጭ ነው።
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: ይህን የተፈጸመውን ነገር
  rationale: ῥῆμα ቃልን፣ ጉዳይን ወይም ነገርን ሊያመለክት ይችላል፤ እዚህ እረኞቹ ሊያዩት የሚሄዱትን ክስተት ስለሚያመለክት ‘ነገር’ ተመርጧል።
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: ጌታ ያሳወቀንን
  rationale: ἐγνώρισεν ያለውን ‘አሳወቀ’ ትርጉም ያቆያል፤ κύριοςንም ሳያጠብ በመደበኛው ‘ጌታ’ ይተረጉማል።
theological_decisions:
- issue: ὁ κύριος የሚያመለክተው ማንን እንደሆነ
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: በአቅራቢያው ዐውድ የመላእክቱ መልእክት ምንጭ እግዚአብሔር መሆኑ ቢታይም፣ ጽሑፉ κύριος ብቻ ይላል። ‘ጌታ’ የሉቃስን ሰፊ ሥነ መለኮታዊ ድምፅና የአመልካቹን ውጥረት ሳይገድብ ይጠብቃል።
