  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሉቃስ የትረካ ቅርጽ ‘እንዲህም ሆነ’ በሚል ተጠብቋል፤ ከመጠን ያለፈ ጥንታዊ አገላለጽ ግን ተወግዷል።
