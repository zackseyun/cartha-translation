  text: መልአኩም እንዲህ አላቸው፦ “አትፍሩ፤ እነሆ፣ ምክንያቱም ለሕዝቡ ሁሉ[a] የሚሆን ታላቅ ደስታ የሚያስገኝ የምሥራች እነግራችኋለሁ።”
  philosophy: optimal-equivalence
  footnotes:
