  choice: ከታጨችለት
  alternative: ሚስቱ ከነበረችው
  rationale: የግሪኩ μνηστεύομαι መተጫጨትን ይገልጻል፤ “ሚስቱ” ማለት ይህ ሐረግ በግልጽ ከሚናገረው በላይ የተጠናቀቀ የጋብቻ ሁኔታ ያስገባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሰፊው አንባቢ ግልጽ የሆነ አማርኛ። ቁጥሩ በግሪክ የዓላማ ሐረግ በመሆኑ በአማርኛ ሙሉ ዓረፍተ ነገር እንዲሆን “ሄደ” ከቀደመው አውድ ተደግፎ ተጨምሯል። ሁለቱም የግርጌ ማስታወሻ ምልክቶች በዋናው ጽሑፍ ተካትተዋል።
