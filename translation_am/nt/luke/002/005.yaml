  terminology: “የታጨችው” appropriately renders the formal betrothal without calling Mary Joseph’s wife. “ነፍሰ ጡር” is respectful, clear modern Amharic for ἐγκύῳ. “ለመመዝገብ” suitably expresses the administrative purpose of ἀπογράψασθαι.
