    text: ወይም፣ “ለብሔራት።” የግሪኩ ቃል በአጠቃላይ “ብሔራት” ማለት ሊሆን ይችላል፤ እዚህ ግን ከእስራኤል ጋር በመነጻጸሩ አይሁድ ያልሆኑትን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ብርሃን
  rationale: የግሪኩን የብርሃን ምሳሌያዊ አገላለጽ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς ἀποκάλυψιν
  choice: መገለጥ የሚሆን
  rationale: εἰς እዚህ የዓላማ ወይም የውጤት ግንኙነትን ያሳያል፤ ἀποκάλυψις ደግሞ የተሰወረ ነገር መገለጡን ያመለክታል።
- source_word: ἐθνῶν
  choice: አሕዛብ
  rationale: በዚህ አይሁዳዊ አውድ ቃሉ ከእስራኤል ጋር ተነጻጽሮ አይሁድ ያልሆኑትን ያመለክታል፤ ቃሉ በአጠቃላይ ‘ብሔራት’ ማለትም ሊሆን ይችላል።
- source_word: δόξαν
  choice: ክብር
  rationale: የግሪኩን የክብርና የግርማ ትርጉም በሚገባ የሚይዝ የተለመደ አማርኛ ቃል ነው።
- source_word: λαοῦ σου Ἰσραήλ
  choice: ለሕዝብህ ለእስራኤል
  rationale: እስራኤል ‘ሕዝብህ’ የሚለውን እንደሚለይና እንደሚያብራራ ያሳያል፤ የአማርኛው ድግግሞሽም ይህን ተያያዥነት በተፈጥሮ ይገልጣል።
- source_word: καὶ
  choice: ም
  rationale: ሁለቱን ትይዩ ሐረጎች በተፈጥሯዊ አማርኛ የሚያገናኝ መስተዋድድ ነው።
theological_decisions:
- issue: ἐθνῶν ከእስራኤል ጋር ያለው ንጽጽር
  choice: አሕዛብ
  alternative: ብሔራት
  rationale: ጥቅሱ ἐθνῶνን ‘ሕዝብህ እስራኤል’ ከሚለው ጋር ስለሚያነጻጽር፣ ‘አሕዛብ’ የአይሁድና አይሁድ ያልሆኑትን ልዩነት በግልጽ ያስተላልፋል፤ ‘ብሔራት’ የሚለው ሰፊ የቃሉ ትርጉም ግን በማስታወሻ ተጠብቋል።
- issue: φῶς ከሁለቱ ሐረጎች ጋር ያለው ሰዋሰዋዊ ግንኙነት
  choice: ‘ብርሃን’ን በቀጥታ ከ‘ለአሕዛብ መገለጥ’ ጋር ማያያዝ
  alternative: ‘ለአሕዛብ የሚገልጥ ብርሃን’
  rationale: ἀποκάλυψιν የሚለው ስም ‘መገለጥ’ን ያመለክታል እንጂ ብርሃኑ አሕዛብን እንደሚገልጥ በግልጽ አይልም፤ ስለዚህ የምንጩን ሥነ መለኮታዊ ክፍትነት ሳይጠብብ ተተርጉሟል።
