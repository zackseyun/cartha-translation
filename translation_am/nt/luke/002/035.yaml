review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the sword image, the passive disclosure of thoughts, and the direct address to Mary. However, “አንቺ ራስሽም ብትሆኚ” introduces a concessive sense (“even if you are...”) that is absent from καὶ σοῦ δὲ αὐτῆς. The Greek instead gives emphatic inclusion: “and you yourself/you too.”'
  naturalness: Removing “ብትሆኚ” produces a natural, complete Amharic sentence. “ከብዙ ሰዎች ልብ” is understandable but needlessly supplies “people”; “ከብዙ ልቦች” is direct and idiomatic.
  terminology: “ነፍስ,” “ሰይፍ,” “ሐሳቦች,” and “እንዲገለጡ” are suitable modern-standard Amharic equivalents. The footnotes accurately retain the lexical distinction between passing through and piercing, and describe the sword as figurative without over-specifying fulfillment.
  issues:
  - severity: high
    issue: The phrase “አንቺ ራስሽም ብትሆኚ” mistranslates the emphatic pronoun construction.
    rationale: “ብትሆኚ” is conditional/concessive (“even if you are”), whereas καὶ σοῦ δὲ αὐτῆς emphatically includes Mary herself. It should be rendered without a conditional verb.
  - severity: low
    issue: “ከብዙ ሰዎች ልብ” adds “people” to “many hearts.”
    rationale: ἐκ πολλῶν καρδιῶν directly refers to many hearts. The added noun is not required for natural Amharic and slightly expands the wording.
