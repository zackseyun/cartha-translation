- source_word: διελεύσεται
  choice: ያልፋል
  rationale: ግሱ በቀጥታ ‘ያልፋል/ያቋርጣል’ ማለት ነው፤ የመውጋት ምስል ከሰይፉ ይገኛል እንጂ በግሱ ብቻ አልተገለጸም።
- source_word: ῥομφαία
