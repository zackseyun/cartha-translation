  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሕጉና ነቢያት» የታወቀውን ቅዱሳት መጻሕፍት ምድብ ያሳያል፤ የመጨረሻው ሐረግ ኃይለኛ ድምፁን ሳያጣ ትርጉማዊ ጥርጣሬው በማስታወሻዎች ተጠብቋል።
