base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: am
  text: ሕጉና ነቢያት እስከ ዮሐንስ ድረስ ነበሩ፤ ከዚያን ጊዜ ጀምሮ የእግዚአብሔር መንግሥት እንደ ምሥራች ይሰበካል፣ ሁሉም በኃይል ወደ እርሱ ለመግባት ይጋፋል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁሉም በግፊት ወደ እርሱ ይገባል።» የግሪኩ ግስ ኃይለኛና አጣዳፊ እንቅስቃሴን ሊገልጥ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንዶች ከማቴዎስ 11፥12 ያለው ተመሳሳይ ንግግር አንጻር የመጨረሻውን ሐረግ በአሉታዊ መንገድ ይረዱታል። እዚህ ግን በግሪኩ የβιάζεται ባለቤት «ሁሉም» እንጂ «መንግሥቱ» አይደለም።
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: ሕጉ
  rationale: ከ«ነቢያት» ጋር ተጣምሮ የሙሴን ሕግና የቅዱሳት መጻሕፍትን የታወቀ ምድብ ያመለክታል።
- source_word: οἱ προφῆται
  choice: ነቢያት
  rationale: ከሕጉ ጋር የሚጠቀሰውን የቅዱሳት መጻሕፍት ምድብ በተለመደው አማርኛ ይገልጣል።
- source_word: μέχρι Ἰωάννου
  choice: እስከ ዮሐንስ ድረስ
  rationale: በድነት ታሪክ ውስጥ ያለውን ጊዜያዊ ወሰን በተፈጥሯዊ አማርኛ ያሳያል፤ ከአውዱ የሚታወቀው መጥምቁ ዮሐንስ ነው።
- source_word: ἀπὸ τότε
  choice: ከዚያን ጊዜ ጀምሮ
  rationale: የጊዜውን ሽግግርና ቀጣይነት በግልጽ ያቀርባል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: βασιλεία ያለውን የመንግሥትና የንግሥና ሥልጣን ስፋት በተለመደው መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: εὐαγγελίζεται
  choice: እንደ ምሥራች ይሰበካል
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና የምሥራች ይዘቱን በግልጽ ይጠብቃል።
- source_word: πᾶς
  choice: ሁሉም
  rationale: ነጠላ አከፋፋይ ኃይሉን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς αὐτὴν
  choice: ወደ እርሱ ለመግባት
  rationale: ወደ መንግሥቱ የሚደረገውን እንቅስቃሴ ግልጽ ያደርጋል፤ በአማርኛ «መንግሥት» በተለምዶ በወንድ ተውላጠ ስም ይመለሳል።
- source_word: βιάζεται
  choice: በኃይል … ይጋፋል
  rationale: የግሱን ኃይለኛና አጣዳፊ እንቅስቃሴ ይጠብቃል፤ በዚህ ሰዋስው πᾶς ባለቤት ስለሆነ ሰዎች ወደ መንግሥቱ እንደሚጋፉ ተተርጉሟል።
theological_decisions:
- issue: βιάζεται ከመንግሥቱ ጋር ያለው ትርጉም
  choice: ሰዎች በአጣዳፊና በኃይለኛ ሁኔታ ወደ መንግሥቱ ለመግባት ይጋፋሉ
  alternative: መንግሥቱ ግፍ ይደርስበታል ወይም በግፍ ይያዛል
  rationale: በሉቃስ አገባብ πᾶς («ሁሉም») የβιάζεται ባለቤት ሲሆን εἰς αὐτήν ደግሞ ወደ መንግሥቱ የሚደረግ እንቅስቃሴን ያመለክታል። ሆኖም የግሱ መካከለኛ/ተደራጊ ቅርጽና ከማቴዎስ 11፥12 ጋር ያለው ተመሳሳይነት አማራጭ ንባብን ስለሚያስነሱ በማስታወሻ ተጠቅሰዋል።
