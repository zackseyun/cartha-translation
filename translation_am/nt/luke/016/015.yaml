base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ “እናንተ ራሳችሁን በሰዎች ፊት[a] ጻድቃን አድርጋችሁ የምታሳዩ ናችሁ፤ እግዚአብሔር ግን ልባችሁን ያውቃል። በሰዎች ዘንድ ከፍ ያለው[b] በእግዚአብሔር ፊት አስጸያፊ ነውና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰው ልጆች ፊት።” የግሪኩ ቃል እዚህ ሰዎችን በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሰዎች ከፍተኛ ዋጋ የሚሰጡት።”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: ራሳችሁን ጻድቃን አድርጋችሁ የምታቀርቡ
  rationale: የአሁን ጊዜውን ቀጣይ ተግባርና ተመላሽ ተሳቢውን ያስቀምጣል፤ በዚህ አውድ ሰዎች ፊት ራስን ጻድቅ አድርጎ ማቅረብን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: በሰዎች ፊት
  rationale: ἐνώπιον የሚያሳየውን ‘ፊት/እይታ’ ይጠብቃል፤ ἀνθρώπων እዚህ ሁሉን አቀፍ የሰው ልጆች ትርጉም አለው።
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: ልባችሁን ያውቃል
  rationale: ‘ልብ’ የውስጥ ማንነትን፣ አሳብንና ዓላማን የሚወክልበትን መጽሐፍ ቅዱሳዊ አጠቃቀም ሳይዘረጋ ይጠብቃል።
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: በሰዎች ዘንድ ከፍ ያለው
  rationale: የὑψηλόνን የከፍታ ምስል ይጠብቃል፤ ሐረጉ ማኅበራዊ ከበሬታን፣ አድናቆትን ወይም ከፍ ያለ ደረጃን ሊያመለክት የሚችልበትን ስፋት ክፍት ያደርጋል።
- source_word: βδέλυγμα
  choice: አስጸያፊ
  rationale: ቃሉ በእግዚአብሔር ዘንድ የሚጠላና የሚያስጸይፍ ነገርን ያመለክታል፤ ‘አስጸያፊ’ ጠንካራ፣ ግልጽና ዘመናዊ አማርኛ ነው።
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: ከመጀመሪያው ἐνώπιον ጋር ተመሳሳይ አተረጓጎም በመጠቀም የሰውንና የእግዚአብሔርን ግምገማ ንጽጽር ያጎላል።
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: እናንተ ... የምታቀርቡ ናችሁ
  rationale: የተጎላውን Ὑμεῖς እና የአንቀጽ-ቦዝ አንቀጹን በአማርኛ የተጎላ ሁለተኛ መደብ ብዙ ቁጥር አወቃቀር ያስተላልፋል።
theological_decisions:
- issue: በሁለቱም ሐረጎች ያለው አጠቃላይ ἀνθρώπων
  choice: ሰዎች
  alternative: የሰው ልጆች
  rationale: ግሪኩ የወንዶችን ጾታ ብቻ ሳይሆን የሰውን ማኅበራዊ ፍርድ በአጠቃላይ ከእግዚአብሔር ፍርድ ጋር ያነጻጽራል፤ ‘ሰዎች’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- issue: የτὸ ἐν ἀνθρώποις ὑψηλὸν ትርጉማዊ ኃይል
  choice: በሰዎች ዘንድ ከፍ ያለው
  alternative: ሰዎች ከፍተኛ ዋጋ የሚሰጡት
  rationale: ዋናው ጽሑፍ የከፍታውን ዘይቤና የሐረጉን ትርጉማዊ ስፋት ይጠብቃል፤ የማኅበራዊ እሴት ትርጉሙ በማስታወሻ ቀርቧል።
- issue: የβδέλυγμα ጥንካሬ
  choice: አስጸያፊ
  alternative: አስጸያፊ ነገር
  rationale: የመለኮታዊ ጥላቻውን ኃይል ሳያለዝብ በተፈጥሯዊ አማርኛ ይገልጣል፤ የስም ቅርጹ በማስታወሻ ተጠብቋል።
