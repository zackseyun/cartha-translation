review_pass:
  verdict: revise
  source_fidelity: 'The verse’s major contrasts are retained: self-justification before human beings versus God’s knowledge of hearts, and what is elevated among people as abhorrent before God. However, the draft’s expression “ራሳችሁን ጻድቃን አድርጋችሁ የምታቀርቡ” is less idiomatic and can imply making yourselves righteous rather than representing yourselves as righteous/vindicated before others.'
  naturalness: The register and most phrasing are clear modern standard Amharic. Replacing “የምታቀርቡ” with “የምታሳዩ” produces a more natural expression for the public, self-presenting force of δικαιοῦντες ἑαυτούς.
  terminology: “ልባችሁን ያውቃል,” “በሰዎች ዘንድ ከፍ ያለው,” and “አስጸያፊ” are suitable and preserve the source’s biblical and evaluative language. “እግዚአብሔር” is appropriate in this register. The two supplied footnotes are correctly anchored and reflect genuine alternatives.
  issues:
  - severity: medium
    issue: The rendering of δικαιοῦντες ἑαυτούς is somewhat unnatural and potentially overstates self-making righteous.
    rationale: “ጻድቃን አድርጋችሁ የምታቀርቡ” does not naturally express the Greek’s contextual sense of presenting or portraying oneself as righteous before others. “ጻድቃን አድርጋችሁ የምታሳዩ” retains the δικαιόω link while clearly expressing the public self-vindicating posture.
