  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: am
  text: ምን እንደማደርግ አውቃለሁ፤ ከአስተዳዳሪነት ሥራዬ ስነሳ[a] ወደ ቤቶቻቸው እንዲቀበሉኝ አደርጋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከአደራ አስተዳዳሪነቴ በምሰናበት ጊዜ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνων
  choice: አውቃለሁ
  rationale: የግሱ አዮሪስት ቅርጽ በዚህ አውድ ወደ ውሳኔ መድረስን ያመለክታል፤ በአማርኛ «አውቃለሁ» የተናጋሪውን ወቅታዊ መገንዘብና የወሰነውን እቅድ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τί ποιήσω
  choice: የማደርገውን
  rationale: የምክክር ንዑስ አንቀጹ የወደፊት የታሰበ ተግባርን ይገልጣል፤ «የማደርገውን» የተወሰነ እቅድ መኖሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα ὅταν
  choice: በ…ጊዜ … እንዲ…
  rationale: ይህ አገባብ ዓላማንና ወደፊት የሚፈጸም ሁኔታን አንድ ላይ ያሳያል፤ የአማርኛው አወቃቀር ሁለቱንም ይጠብቃል።
- source_word: μετασταθῶ
  choice: በምወገድበት
  rationale: ተገብሮ ቅርጹ ከሥልጣን ወይም ከሹመት መነሳትን ያመለክታል፤ «መወገድ» ትርጉሙን ሳያጠብ የሥራ ቦታውን ማጣት ያስተላልፋል።
- source_word: ἐκ τῆς οἰκονομίας
  choice: ከአስተዳዳሪነቴ
  rationale: οἰκονομία እዚህ የቤት ወይም የንብረት አስተዳደር ኃላፊነትንና ሹመትን ያመለክታል፤ «አስተዳዳሪነት» በዘመናዊ አማርኛ ግልጽና ከአውዱ ጋር የሚስማማ ነው።
- source_word: δέξωνταί με
  choice: እንዲቀበሉኝ
  rationale: δέχομαι መቀበልን ወይም እንግዳ አድርጎ ማስገባትን ሊያመለክት ይችላል፤ «እንዲቀበሉኝ» የእንግዳ ተቀባይነቱን አውድ ሳያጋንን ይጠብቃል።
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: ወደ ቤታቸው
  rationale: በዚህ የመጠለል አውድ οἶκος «ቤት» ተብሎ በተፈጥሯዊ ሁኔታ ይተረጎማል፤ የባለቤትነት አጽንዖቱም «ቤታቸው» ውስጥ ተወክሏል።
