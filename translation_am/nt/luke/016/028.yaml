base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: am
  text: ምክንያቱም አምስት ወንድሞች አሉኝና፤ እነርሱም ወደዚህ የሥቃይ ስፍራ እንዳይመጡ፣ በጽኑ እንዲያስጠነቅቃቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእነርሱ በጽኑ እንዲመሰክር” ወይም “አጥብቆ እንዲያስጠነቅቃቸው።” የግሪኩ ግስ በጽኑ የመመስከርን ወይም የማስጠንቀቅን ሐሳብ ይይዛል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: ምክንያቱም ... አሉኝ
  rationale: γάρ ከቀደመው ልመና ጋር ያለውን ማብራሪያዊ ግንኙነት ያሳያል፤ ἔχω ደግሞ በተፈጥሯዊ አማርኛ ‘አሉኝ’ ተብሏል።
- source_word: πέντε ἀδελφούς
  choice: አምስት ወንድሞች
  rationale: የግሪኩ ቃል ተባዕታይ ብዙ ቁጥር ስለሆነ በዚህ አውድ ወንድ እህቶችን ሳይሆን ወንድሞችን ያመለክታል።
- source_word: ὅπως
  choice: እንዲያስጠነቅቃቸው
  rationale: የዓላማ ግንኙነቱ በአማርኛው ‘እንዲ-’ አወቃቀር ተፈጥሯዊ ሆኖ ተገልጧል።
- source_word: διαμαρτύρηται αὐτοῖς
  choice: በጥብቅ እንዲያስጠነቅቃቸው
  rationale: διαμαρτύρομαι በጽኑ መመስከርን፣ ማሳሰብን ወይም ማስጠንቀቅን ሊያመለክት ይችላል። ቀጣዩ የመከላከል ዓላማ በዚህ አውድ የጠንካራ ማስጠንቀቂያውን ትርጉም ይደግፋል።
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: እነርሱም ... እንዳይመጡ
  rationale: ἵνα μή አሉታዊ ዓላማን ያሳያል፤ καὶ αὐτοὶ የሚለውም ‘እነርሱም’ በሚለው ተጠብቋል።
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: ወደዚህ የሥቃይ ስፍራ
  rationale: εἰς ወደ መድረሻ የሚደረግን እንቅስቃሴ ያሳያል፤ βάσανος ደግሞ ከባድ ሥቃይን ያመለክታል። ‘የሥቃይ ስፍራ’ የጽሑፉን ክብደት ሳያሰፋ ይጠብቃል።
theological_decisions:
- issue: ከሞት በኋላ ያለውን ስፍራ ባለጠጋው የገለጸበት አነጋገር
  choice: ይህ የሥቃይ ስፍራ
  alternative: ይህ የመከራ ስፍራ
  rationale: ትርጉሙ βάσανος የሚያሳየውን የተለማመደ ከባድ ሥቃይ ይጠብቃል፤ ከቁጥሩ በላይ የሆነ ዝርዝር የኋለኛው ዓለም ትምህርት አያክልም።
