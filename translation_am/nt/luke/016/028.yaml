review_pass:
  verdict: revise
  source_fidelity: The draft conveys the five brothers, the warning, their possible coming, and the place of torment. However, its clause order makes the two purposive clauses syntactically awkward in Amharic and weakens the immediate connection between the warning and its intended result. The source has the warning as the primary purpose, followed by the negative purpose that they not come.
  naturalness: The sentence is understandable, but ending with “...እንዲያስጠነቅቃቸው ነው” after first stating the result clause is less natural and unnecessarily turns the verse into an explanatory copular construction. Recasting the negative clause as the purpose of the warning is clear, idiomatic modern standard Amharic.
  terminology: “ወንድሞች,” “በጽኑ እንዲያስጠነቅቃቸው,” and “የሥቃይ ስፍራ” are appropriate. The footnote should retain “መመስከር” as a lexical alternative while avoiding “እንዲመሰክርላቸው,” which can sound like testifying on their behalf rather than testifying/warning to them.
  issues:
  - severity: medium
    issue: The purpose clauses are ordered and framed awkwardly.
    rationale: 'ὅπως διαμαρτύρηται αὐτοῖς is followed by ἵνα μὴ ... ἔλθωσιν: he is to solemnly warn them so that they will not come. In the draft, the negative clause precedes the warning and the final “ነው” produces a less direct relation.'
  - severity: low
    issue: The footnote's first alternative can imply testimony on behalf of the brothers.
    rationale: “እንዲመሰክርላቸው” is potentially ambiguous in Amharic. “እንዲመሰክርላቸው/ለእነርሱ እንዲመሰክር” should be phrased to preserve the dative sense of solemn testimony addressed to them.
  revised_text: ምክንያቱም አምስት ወንድሞች አሉኝና፤ እነርሱም ወደዚህ የሥቃይ ስፍራ እንዳይመጡ፣ በጽኑ እንዲያስጠነቅቃቸው።[a]
