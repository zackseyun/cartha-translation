base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: am
  text: ደግሞም ለደቀ መዛሙርቱ እንዲህ ይላቸው ነበር፦ “አንድ ሀብታም ሰው ነበር፤ እርሱም የንብረት አስተዳዳሪ[a] ነበረው። ይህ አስተዳዳሪም የሀብታሙን ንብረት እያባከነ ነው ተብሎ ለሀብታሙ ክስ ቀረበበት[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የቤት አዛዥ” ወይም “ባለአደራ” ተብሎም ሊተረጎም ይችላል። οἰκονόμος የቤትን ወይም የርስትን ጉዳይ በአደራ የሚቆጣጠር ሰውን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “በእርሱ ላይ ለሀብታሙ መጥፎ ዘገባ ቀረበ” ወይም “ለሀብታሙ ተወነጀለ” ተብሎም ሊተረጎም ይችላል። ግሱ ክስን ወይም ጎጂ ዘገባን ሊያመለክት ይችላል፤ ክሱ እውነት መሆኑን ግን አያረጋግጥም።
    reason: lexical_alternative
