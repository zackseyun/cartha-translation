- source_word: οἰκονόμον
  choice: የንብረት አስተዳዳሪ
  rationale: የቤትን ወይም የርስትን ጉዳይ በአደራ የሚያስተዳድር ሰው መሆኑን ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: διεβλήθη αὐτῷ
  choice: ለሀብታሙ ክስ ቀረበበት
  rationale: በአስተዳዳሪው ላይ መጥፎ ዘገባ ወይም ክስ ለሀብታሙ መቅረቡን ያሳያል፤ ክሱ እንደተረጋገጠ አይወስንም።
- source_word: ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ
  choice: ንብረቱን እያባከነ ነው ተብሎ
  rationale: የክሱን ይዘት ያሳያል፤ διασκορπίζων በገንዘብና በንብረት አውድ ‘ማባከን’ የሚለውን ትርጉም ይሰጣል።
