  rationale: οὖν ከቀደመው እምቢታ በኋላ የሚመጣውን መደምደሚያዊ ወይም ቀጣይ ጥያቄ ያመለክታል፤ «እንግዲያውስ» ይህን ኃይል ይጠብቃል።
- source_word: πάτερ
