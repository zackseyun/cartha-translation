  rationale: በ«እንድትልከው» ውስጥ ያለው የተሳቢ ቅጥያ በቀደመው አውድ የተጠቀሰውን አልዓዛርን ያመለክታል።
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: ወደ አባቴ ቤት
  rationale: εἰς የመድረሻ አቅጣጫን፣ οἶκος ደግሞ ቤትን ወይም ቤተሰብን ሊያመለክት ይችላል፤ «ወደ አባቴ ቤት» በዚህ አውድ ቀጥተኛና ተፈጥሯዊ ነው።
