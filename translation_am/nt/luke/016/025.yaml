  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: am
  text: አብርሃም ግን እንዲህ አለ፦ “ልጄ ሆይ፣ በሕይወትህ መልካም ነገሮችህን እንደተቀበልህ[a]፣ አልዓዛርም እንዲሁ መጥፎ ነገሮችን እንደተቀበለ አስታውስ። አሁን ግን እርሱ እዚህ እየተጽናና ነው፤ አንተ ግን በሥቃይ ላይ ነህ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መልካም ነገሮችህን ሙሉ በሙሉ ተቀብለሃል።” የግሪኩ ግስ የተመደበውን መቀበል ወይም ሙሉ በሙሉ መቀበል የሚል ፍቺ ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እየተሠቃየህ ነው።” የግሪኩ ቃል ከባድ ሕመምን ወይም ጭንቀትን ሊያመለክት ይችላል።
    reason: lexical_alternative
