  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: am
  text: እኔም እላችኋለሁ፤ የዓመፅን ሀብት[a] ተጠቅማችሁ ለራሳችሁ ወዳጆችን አፍሩ፤ ሀብቱ በሚያልቅበት ጊዜ[b] ወደ ዘላለማዊ ማደሪያዎች[c] እንዲቀበሏችሁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቀጥታ፣ «ከዓመፅ ማሞን።» «ማሞን» ሀብትን ወይም ገንዘብን ለሚያመለክተው የግሪክ ቃል ባሕላዊ አተረጓጎም ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እናንተ ስትሞቱ» ወይም «ሲያልቅ።» የግሪኩ ግስ እዚህ በተለያየ መንገድ ሊገባ ይችላል፤ ብዙዎች ሀብቱን እንደሚያመለክት ይወስዱታል፣ አንዳንዶች ግን የሰውን ሞት እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ «ወደ ዘላለማዊ ድንኳኖች።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: ለራሳችሁ ወዳጆችን አፍሩ
  rationale: የግሪኩን መልሶ አመልካች ቅርጽና ትእዛዝ ይጠብቃል፤ “ወዳጆችን አፍሩ” በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: የዓመፅን ሀብት ተጠቅማችሁ
  rationale: ἐκ በዐውዱ ያለውን የመሣሪያነት ኃይል “ተጠቅማችሁ” ያሳያል፤ የግሪኩን የባሕርይ ገላጭ የዝምድና ሐረግም “የዓመፅ ሀብት” ብሎ ሳያጠብ ያቆያል።
- source_word: μαμωνᾶ
  choice: ሀብት
  rationale: ቃሉ ገንዘብንና ንብረትን በሰፊው ያመለክታል፤ “ሀብት” በአማርኛ ግልጽ ሲሆን ከሰውኛ አካልነት ጋር ያልተፈለገ ግንኙነት አይጭንም።
- source_word: τῆς ἀδικίας
  choice: የዓመፅ
  rationale: ἀδικία የጽድቅ ጉድለትንና ፍትሕ ማጣትን በሰፊው ይገልጣል፤ “የዓመፅ” ትርጉሙን በ“በማታለል የተገኘ” ብቻ አያጠበውም።
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: ይህም ሀብት በሚያልቅበት ጊዜ … እንዲ… ነው
  rationale: ἐκλίπῃ ማለቅን ወይም መክሸፍን ያመለክታል። ቅርቡ ቀዳሚ ስም ሀብት ስለሆነ በዋናው ጽሑፍ እሱን እንደ ባለቤት ወስዶ፣ ሌላውን ንባብ በማስታወሻ ይጠብቃል።
- source_word: δέξωνται ὑμᾶς
  choice: እንዲቀበሏችሁ
  rationale: የብዙ ቁጥር ግሱን ያቆያል፤ ተቀባዮቹ እነማን እንደሆኑ ግን ግሪኩ እንዳልገለጠው ሳይገልጥ ይተዋል።
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: ወደ ዘላለማዊ ማደሪያዎች
  rationale: σκηναί በቀጥታ “ድንኳኖች” ቢሆንም፣ እዚህ የመኖሪያ ስፍራዎችን የሚገልጥ ስለሆነ “ማደሪያዎች” ተፈጥሯዊና ክቡር ነው፤ ቀጥተኛው ምስል በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: “የዓመፅ ሀብት” የሚለው አተረጓጎም
  choice: በዚህ ዓለም ከዓመፅና ከኢፍትሐዊነት ጋር የተቆራኘ ሀብት ተብሎ በሰፊው እንዲነበብ ተትቷል
  alternative: በማታለል ብቻ የተገኘ ሀብት፤ ወይም በሰውኛ አካል የተወከለ ማሞን
  rationale: ሐረጉን በሕገ ወጥ ገቢ ብቻ ማጥበብም ሆነ የሀብትን ሰውኛ አካልነት በግድ ማስገባት የግሪኩን የትርጉም ውጥረት ይፈታዋል።
- issue: የἐκλίπῃ ባለቤት
  choice: ሀብቱ ሲያልቅ
  alternative: እናንተ ስታልፉ፣ ማለትም ስትሞቱ፤ ወይም ዓለማዊ ሀብት በአጠቃላይ ሲያልቅ
  rationale: በዐውዱ በቅርብ ያለው ቀዳሚ ስም μαμωνᾶς ነው፤ የግሪክ ግሱ ግን ባለቤቱን በግልጽ ስላልሰየመ ሌላው ንባብ በማስታወሻ ተቀምጧል።
- issue: “እንዲቀበሏችሁ” የሚለው የግስ ባለቤት
  choice: ማንነታቸው ሳይገለጥ ተትቷል
  alternative: በሀብት አጠቃቀም የተገኙት ወዳጆች፤ ድሆች ወይም የእግዚአብሔር ሕዝብ፤ ሰማያዊ ፍጥረታት
  rationale: ግሪኩ የብዙ ቁጥር ግስ ቢጠቀምም ባለቤቱን በስም አይገልጥም፤ ትርጉሙም ከምንጩ በላይ አይወስንም።
