id: LUK.16.10
reference: Luke 16:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: am
  text: በትንሹ ታማኝ የሆነ ሰው በብዙም ታማኝ ነው፤ በትንሹ ፍትሐዊ ያልሆነ ሰውም በብዙ ፍትሐዊ ያልሆነ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστός
  choice: የታመነ
  rationale: በዐውዱ የተሰጠውን ነገር በአደራ መያዝንና ታማኝነትን ያመለክታል፤ «የታመነ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν ἐλαχίστῳ
  choice: በጥቂቱ
  rationale: ἐν ከዳቲቭ ጋር የሚገልጠውን የሁኔታ ወይም የመስክ ሐሳብ ይይዛል፣ ከ«በብዙው» ጋርም ያለውን ቀጥተኛ ንጽጽር ይጠብቃል።
- source_word: πολλῷ
  choice: በብዙው
  rationale: ከἐλαχίστῳ ጋር ያለውን የመጠን ተቃርኖ በአጭርና ትይዩ አገላለጽ ያስቀምጣል።
- source_word: ἄδικος
  choice: ዓመፀኛ
  rationale: ቃሉ ከገንዘብ አለመታመን በላይ ሰፊ የሆነ የሞራል በደልን ያመለክታል፤ «ዓመፀኛ» ይህን ስፋት ሳያጠብ ይገልጣል።
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: የታመነ ሰው ... ዓመፀኛ የሆነ ሰው
  rationale: በግሪክ ከመስተዋድድ ጋር በስምነት የተጠቀሙትን ቅጽ አጠቃላይ ሰውን በሚያመለክት ግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: καὶ
  choice: -ም
  rationale: በሁለቱም ክፍሎች ያለውን የመደመር ትርጉም «-ም» በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በአደራ አስተዳደር ዐውድ ውስጥ የἄδικος የሞራል ገለጻ
  choice: ዓመፀኛ
  alternative: ሐቀኛ ያልሆነ / ፍትሕ የሌለው
  rationale: ንግግሩን በገንዘብ ጉዳይ ላይ ብቻ እንዳይገድብ፣ የግሪኩን ሰፊ የሞራል ምድብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሚዛናዊ ትይዩነት «በጥቂቱ/በብዙው» እና «የታመነ/ዓመፀኛ» በሚሉ ቅርጾች ተጠብቋል።
