  to: በትንሹ ታማኝ የሆነ ሰው በብዙም ታማኝ ነው፤ በትንሹ ፍትሐዊ ያልሆነ ሰውም በብዙ ፍትሐዊ ያልሆነ ነው።
  rationale: 'The revision corrects the two key lexical mismatches while preserving the Greek’s balanced parallelism: “in very little/in much,” “faithful/faithful,” and “unjust/unjust.” No footnote is required because the Amharic renderings do not introduce a disputed reading or a meaning requiring explanatory qualification.'
