review_pass:
  verdict: revise
  source_fidelity: The Greek antithesis and representative-singular structure are retained, but «የታመነ» ordinarily means “trusted/relied upon,” rather than the person’s quality of being faithful or trustworthy (πιστός). «ዓመፀኛ» primarily denotes a rebellious, riotous, or insubordinate person and does not adequately represent ἄδικος (“unjust/unrighteous”).
  naturalness: The draft is generally fluent, but the revised wording uses the more idiomatic adjectival predicate «ታማኝ የሆነ» and a clearer modern equivalent for the moral contrast.
  terminology: 'Use «ታማኝ» for πιστός in this stewardship setting. Use «ፍትሐዊ ያልሆነ» for ἄδικος: it preserves the broad moral sense of injustice without reducing the term to financial dishonesty or recasting it as rebellion.'
  issues:
  - severity: high
    issue: «የታመነ» for πιστός
    rationale: This passive expression normally means “one who is trusted,” whereas πιστός here describes a person who acts faithfully/trustworthily in what is entrusted.
  - severity: high
    issue: «ዓመፀኛ» for ἄδικος
    rationale: «ዓመፀኛ» shifts the sense toward rebellion or disorder. The Greek denotes one characterized by injustice/wrongdoing; «ፍትሐዊ ያልሆነ» more accurately preserves that category.
  revised_text: በትንሹ ታማኝ የሆነ ሰው በብዙም ታማኝ ነው፤ በትንሹ ፍትሐዊ ያልሆነ ሰውም በብዙ ፍትሐዊ ያልሆነ ነው።
  revised_footnotes: []
  revision_rationale: 'The revision corrects the two key lexical mismatches while preserving the Greek’s balanced parallelism: “in very little/in much,” “faithful/faithful,” and “unjust/unjust.” No footnote is required because the Amharic renderings do not introduce a disputed reading or a meaning requiring explanatory qualification.'
