  source_fidelity: The translation accurately conveys the internal deliberation (ἐν ἑαυτῷ), the deliberative question, the removal of the manager’s office from him, physical inability to dig, and shame at begging. “ጌታዬ” appropriately denotes the human superior in the parable without requiring a divine reading.
  naturalness: The Amharic is clear, idiomatic, and suitably dignified for modern standard usage. “በልቡ እንዲህ አለ” naturally introduces internal speech, and the short clauses preserve the force of the Greek.
  terminology: “አስተዳዳሪ / አስተዳደር” clearly represents οἰκονόμος / οἰκονομία and retains their cognate relationship. The alternative terminology in the footnote is appropriate. “ለመቆፈር አቅም የለኝም” correctly reflects the physical-strength nuance of οὐκ ἰσχύω.
