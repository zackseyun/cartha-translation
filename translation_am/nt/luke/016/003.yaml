id: LUK.16.3
reference: Luke 16:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: am
  text: አስተዳዳሪውም[a] በልቡ እንዲህ አለ፦ “ጌታዬ አስተዳደሩን ከእኔ እየወሰደ ስለሆነ ምን ላድርግ? ለመቆፈር አቅም የለኝም፤ ለመለመንም አፍራለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አስተዳዳሪ” እና “አስተዳደር” በሚሉት ፈንታ “ባለአደራ” እና “ባለአደራነት” ሊባል ይችላል። የግሪኩ ጽሑፍ ሰውየውንና ሥራውን ለመግለጽ ከአንድ ሥር የተገኙ ቃላትን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: አስተዳዳሪ / አስተዳደር
  rationale: የሌላውን ንብረትና ጉዳይ በአደራ የሚመራውን ሰውና የተሰጠውን ኃላፊነት በዘመናዊና ግልጽ አማርኛ ይገልጻሉ፤ የግሪኩን የቃል ዝምድናም ይጠብቃሉ።
- source_word: ἐν ἑαυτῷ
  choice: በልቡ
  rationale: በውስጡ ያደረገውን ንግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Τί ποιήσω
  choice: ምን ላድርግ?
  rationale: ስለሚቀጥለው እርምጃ የሚደረግን ውስጣዊ ምክክር በተፈጥሯዊ የጥያቄ አገላለጽ ያቀርባል።
- source_word: κύριός μου
  choice: ጌታዬ
  rationale: በምሳሌው ውስጥ በአስተዳዳሪው ላይ ሥልጣን ያለውን ሰብዓዊ ባለቤት ያመለክታል።
- source_word: ἀφαιρεῖται
  choice: ከእኔ እየወሰደ
  rationale: የኃላፊነቱን መወገድና ἀπ’ ἐμοῦ የሚለውን ‘ከእኔ’ ግንኙነት በግልጽ ሁኔታ ያስተላልፋል።
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: ለመቆፈር አቅም የለኝም
  rationale: σκάπτεινን ቃል በቃል ሲጠብቅ ἰσχύω በዚህ አውድ ያለውን የአካል ጉልበት ሐሳብ ያሳያል።
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: ለመለመንም አፍራለሁ
  rationale: ምጽዋት ለመለመን የሚሰማውን ኀፍረት በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በሰብዓዊ ምሳሌ አውድ κύριοςን መተርጎም
  choice: ጌታዬ
  alternative: ባለቤቴ / አለቃዬ
  rationale: ቃሉ እዚህ መለኮታዊ ማዕረግ ሳይሆን የሀብታሙን ሰው ሥልጣን ያመለክታል። ‘ጌታዬ’ ይህን የሥልጣን ግንኙነት ይጠብቃል፤ አውዱም ሰብዓዊ ማጣቀሻውን ግልጽ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የውስጥ ንግግሩ ቀጥተኛነትና በአስተዳዳሪው ላይ የደረሰው ጭንቀት ተጠብቀዋል።
