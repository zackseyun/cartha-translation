lexical_decisions:
- source_word: Οὐχί
  choice: አይ
  rationale: የቀደመውን ንግግር በግልጽ የሚቃወም ጠንካራ አሉታዊ መልስ ነው፤ «አይ» በዘመናዊ አማርኛ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: πάτερ Ἀβραάμ
  choice: አባት አብርሃም ሆይ
  rationale: የግሪኩን የጥሪ አገባብና ሀብታሙ አብርሃምን እንደ ቅድመ አያቱ መማጸኑን ይጠብቃል።
- source_word: ἀλλ’ ἐάν
  choice: ነገር ግን … ቢሄድ
  rationale: ከቀደመው አባባል ጋር ያለውን ተቃርኖና ሁኔታዊ አገባብ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τις
  choice: አንድ ሰው
  rationale: ያልተወሰነውን ነጠላ ሰው በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ νεκρῶν
  choice: ከሙታን መካከል
  rationale: ἀπό ከብዙ ቁጥር ዘርፍ ጋር ያለውን፣ አንድ ሰው ከሙታን ማኅበር ወጥቶ የመምጣቱን ትርጉም በግልጽ ያንጸባርቃል፤ አጭሩ አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: πορευθῇ
  choice: ቢሄድ
  rationale: ከἐάν ጋር ያለውን ሁኔታዊ አገባብ ይጠብቃል፤ ወደ ሰዎቹ መሄድን እንጂ ከእነርሱ አንጻር መምጣትን አይጭንም።
- source_word: πρὸς αὐτοὺς
  choice: ወደ እነርሱ
  rationale: ወደተጠቀሱት ሰዎች የሚደረገውን እንቅስቃሴ በቀጥታ ይገልጣል።
- source_word: μετανοήσουσιν
  choice: ንስሐ ይገባሉ
  rationale: በሉቃስ አውድ ያለውን ከአእምሮ ለውጥ የሚያልፍ ሥነ ምግባራዊና መንፈሳዊ መመለስ በተለመደ የአማርኛ አገላለጽ ይጠብቃል።
