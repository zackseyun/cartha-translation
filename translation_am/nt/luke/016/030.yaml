  rationale: በዚህ የሉቃስ አውድ ቃሉ ለመለኮታዊ ማስጠንቀቂያ በሥነ ምግባራዊና መንፈሳዊ መመለስ ምላሽ መስጠትን ያመለክታል፤ «አሳባቸውን ይለውጣሉ» ይህን ወደ አእምሯዊ ውሳኔ ብቻ ሊያጠብበው ይችላል።
