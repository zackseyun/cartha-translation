  rationale: በምሳሌው ውስጣዊ አውድ ይህ ቃል የአስተዳዳሪውን ጌታ ማመልከቱ ይበልጥ ተፈጥሯዊ ነው፤ እዚህ ለኢየሱስ ወይም ለእግዚአብሔር በቀጥታ የተሰጠ ማዕረግ እንዳይመስል በአውዱ የቤቱን ባለቤት ያመለክታል።
