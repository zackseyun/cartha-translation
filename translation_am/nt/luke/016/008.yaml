  rationale: ጥቅሱ አስተዳዳሪውን በἀδικία ይገልጸዋል፤ በተመሳሳይ ጊዜ በφρονίμως ስለሠራ ያመሰግነዋል። ‘ዓመፀኛ’ እና ‘በብልሃት’ የሚሉት ምርጫዎች ይህን ውጥረት ሳይፈቱ ይጠብቃሉ።
