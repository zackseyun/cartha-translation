    text: “ጌታ ኢፍትሐዊውን አስተዳዳሪ…” ተብሎም ሊተረጎም ይችላል። እዚህ የግሪኩ κύριος በምሳሌው ውስጥ ያለውን ባለቤት ማመልከቱ ይበልጥ ተፈጥሯዊ ነው።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፦ “የዚህ ዘመን ልጆች ለገዛ ትውልዳቸው ከብርሃን ልጆች ይልቅ ብልሆች ናቸው።” የግሪኩ ሐረግ አስቸጋሪ ነው፤ በገዛ ትውልዳቸው ወይም በራሳቸው ክበብ ውስጥ በሚያደርጉት ነገር የሚያሳዩትን ብልሃት ሊያመለክት ይችላል።
    reason: lexical_alternative
