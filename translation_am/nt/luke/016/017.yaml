    text: ወይም፣ “አንዲት ትንሽ የፊደል ጫፍ”—ይህም አንዱን ፊደል ከሌላው የሚለይ እጅግ ትንሽ ጭረት ማለት ነው።
    reason: lexical_alternative
  revision_rationale: The revision resolves the comparative syntax and makes the relationship ‘one stroke of the Law’ explicit, without adding interpretation. The wording continues to preserve the Greek’s literal ‘fall’ imagery and the source’s emphasis on the Law’s smallest written detail.
