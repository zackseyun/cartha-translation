id: LUK.16.17
reference: Luke 16:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: am
  text: ነገር ግን፣ የሕጉ አንዲት የፊደል ጭረት ከመውደቅ ይልቅ ሰማይና ምድር ማለፋቸው ይቀላል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: ይቀላል
  rationale: የንጽጽር ትርጉሙን ‘easier’ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δέ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ቀላል ተቃርኖ ወይም ሽግግር ይጠብቃል።
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: ሰማይና ምድር
  rationale: መላውን ፍጥረት የሚያመለክተውን የመጽሐፍ ቅዱስ የተለመደ አገላለጽ ይጠብቃል።
- source_word: παρελθεῖν
  choice: ማለፋቸው
  rationale: በዚህ አውድ የሰማይና የምድርን ማለፍ ወይም ከነበሩበት መወገድ የሚያመለክተውን ምስል ይጠብቃል።
- source_word: νόμου
  choice: ሕጉ
  rationale: አጠቃላይ ሕግን ሳይሆን በአይሁድ ቅዱስ መጻሕፍት ያለውን ሕግ እንደሚያመለክት አውዱ ያሳያል፤ የዕውቅና ቅጥያውም ይህን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: μίαν κεραίαν
  choice: አንዲት የፊደል ጭረት
  rationale: κεραία በፊደል ላይ ያለችን እጅግ ትንሽ መስመር ወይም ጫፍ ያመለክታል፤ ይህ አተረጓጎም ጥንታዊ ቴክኒካዊ ቃል ሳይጠቀም ትርጉሙን ግልጽ ያደርጋል።
- source_word: πεσεῖν
  choice: ከምትወድቅ
  rationale: የግሪኩን ‘መውደቅ’ ምስል በቀጥታ ይጠብቃል፣ በአውዱም ትንሹ የሕጉ ክፍል እንኳ እንዳይጠፋ ወይም እንዳይፈርስ ያመለክታል።
theological_decisions:
- issue: የνόμος ማመልከቻ
  choice: በቅዱሳት መጻሕፍት ያለው ሕግ
  alternative: ሕግ በአጠቃላይ
  rationale: የሉቃስ አቅራቢያ አውድና ከሰማይና ከምድር ጋር የተደረገው ንጽጽር የተገለጠውን መለኮታዊ ሕግ ያመለክታሉ፤ ትርጉሙ ከጽሑፉ በላይ ሳይጨምር ‘ሕጉ’ ብሎ ያቀርበዋል።
- issue: የκεραία አተረጓጎም
  choice: አንዲት የፊደል ጭረት
  alternative: አንዲት ትንሽ ምልክት
  rationale: ንግግሩ በጽሑፍ ያለውን እጅግ ትንሽ ዝርዝር ዘላቂነት ያጎላል፤ ‘የፊደል ጭረት’ ይህን በዘመናዊና ግልጽ ቋንቋ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንጽጽር አወቃቀርና ‘መውደቅ’ የሚለው ምስላዊ አገላለጽ ተጠብቀዋል።
