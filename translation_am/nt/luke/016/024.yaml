source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: am
  text: እርሱም ጮኾ እንዲህ አለ፦ “አባት አብርሃም ሆይ፣ ማረኝ፤ አልዓዛርንም ልከው፤ የጣቱን ጫፍ በውሃ ነክሮ ምላሴን ያቀዘቅዝልኝ፤ በዚህ ነበልባል ውስጥ በከባድ ሥቃይ ነኝና።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ነበልባል ውስጥ እየተሠቃየሁ ነውና።” የግሪኩ ግስ ከባድ ሕመምን ወይም ሥቃይን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: ጮኾ
  rationale: የግሱን ከፍ ያለና አስቸኳይ ጥሪ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλέησόν με
  choice: ማረኝ
  rationale: የምሕረትና የርኅራኄ ቀጥተኛ ልመናውን አጭርና የተለመደ በሆነ አነጋገር ይገልጣል።
- source_word: πέμψον
  choice: ልከው
  rationale: ቀጥተኛውን የትእዛዝ ቅርጽና ‘ላክ’ የሚለውን መሠረታዊ ትርጉም ይጠብቃል።
- source_word: βάψῃ
  choice: ነክሮ
  rationale: እዚህ የተገለጠውን የጣትን ጫፍ ለአጭር ጊዜ በውሃ የማስገባት ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ጠልቆ’ ሙሉ በሙሉ መስጠምን ሊያስመስል ይችላል።
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: የጣቱን ጫፍ
  rationale: የግሪኩን የአካል ክፍል ምስል ግልጽና ቀጥተኛ በሆነ መንገድ ይጠብቃል።
- source_word: ὕδατος
  choice: በውሃ
  rationale: ከ‘ነክሮ’ ጋር የሚስማማ ተፈጥሯዊ አማርኛ ሲሆን የድርጊቱን ፈሳሽ በግልጽ ያሳያል።
- source_word: καταψύξῃ
  choice: ያቀዘቅዝልኝ
  rationale: የማቀዝቀዝን ተጨባጭ አካላዊ ምስል ይጠብቃል፤ ተጠቃሚውንም በ‘-ልኝ’ ያሳያል።
- source_word: γλῶσσάν μου
  choice: ምላሴን
  rationale: የአካል ክፍሉን ቀጥተኛ ትርጉም ያስቀምጣል።
- source_word: ὀδυνῶμαι
  choice: በከባድ ሥቃይ ነኝ
  rationale: ግሱ የሚያመለክተውን ከፍተኛ ሕመምና ጭንቀት ያሳያል፤ ሥቃዩን የሚያደርስ አካል እንዳለ በትርጉሙ ላይ አይጨምርም።
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: በዚህ ነበልባል ውስጥ
  rationale: φλόξ ከአጠቃላይ ‘እሳት’ ይልቅ በተለይ ‘ነበልባል’ን ስለሚያመለክት የግሪኩን ሕያው ምስል ይጠብቃል።
- source_word: Πάτερ Ἀβραάμ
  choice: አባት አብርሃም ሆይ
  rationale: የቀጥታ ጥሪውንና የዘር አባትነት ይግባኙን በአማርኛ የጥሪ ቅርጽ ይጠብቃል።
theological_decisions:
- issue: የሀብታሙ ሥቃይ አገላለጽ
  choice: በዚህ ነበልባል ውስጥ በከባድ ሥቃይ ነኝ
  alternative: በዚህ ነበልባል ውስጥ እየተሠቃየሁ ነው
  rationale: ዋናው ንባብ የὀδυνῶμαιን ከፍተኛ ሕመም ሳያለዝብ ይገልጣል፤ በተመሳሳይም ሥቃዩን የሚያደርስ ውጫዊ አካል እንዳለ በግድ አይወስንም። ሌላው ንባብ ደግሞ በአማርኛ የተለመደ ሲሆን የግሪኩን ከባድ ሥቃይ ሊገልጥ ይችላል።
