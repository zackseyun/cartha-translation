  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: am
  text: ከዚያም ለሌላው፣ “አንተስ ምን ያህል ዕዳ አለብህ?” አለው። እርሱም፣ “አንድ መቶ ቆሮስ[a] ስንዴ” አለ። እርሱም፣ “የዕዳ ሰነድህን[b] ውሰድና ሰማንያ ብለህ ጻፍ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቆሮስ እህልን ለመስፈር ያገለግል የነበረ ትልቅ የደረቅ ነገር መስፈሪያ ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “የጽሑፍ ውልህን” ወይም “ሰነዶችህን”፤ ግሪኩ “ጽሑፎችህን” (τὰ γράμματα) ይላል። በዚህ አውድ የባለዕዳውን የጽሑፍ ዕዳ ሰነድ ወይም ሒሳብ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: ከዚያም
  rationale: የታሪኩን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἑτέρῳ
  choice: ለሌላው
  rationale: ከቀድሞው ባለዕዳ የተለየ ሌላ ሰው መሆኑን ያለ ተጨማሪ ግምት ያስተላልፋል።
- source_word: Σὺ δὲ
  choice: አንተስ
  rationale: አጽንዖት ያለውን Σὺ እና የሽግግር/ንጽጽር ኃይል ያለውን δέ በአጭርና ተፈጥሯዊ አገላለጽ ይይዛል።
- source_word: πόσον ὀφείλεις
  choice: ምን ያህል ዕዳ አለብህ
  rationale: በገንዘብና በንብረት ዕዳ አውድ ውስጥ የὀφείλωን ትርጉም ግልጽ ያደርጋል።
- source_word: Ἑκατὸν κόρους σίτου
  choice: አንድ መቶ ቆሮስ ስንዴ
  rationale: κόροςን እንደ ተወሰነ ጥንታዊ የደረቅ ነገር መስፈሪያ በቅርጸ ድምፅ ጠብቆ፣ σίτουን በዚህ አውድ ‘ስንዴ’ ብሎ ይተረጉማል።
- source_word: λέγει αὐτῷ
  choice: እርሱም … አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ቃል በቃል ቢተረጎም የተፈጥሮ ፍሰቱን ስለሚያውክ፣ የትረካውን ሕያውነት በተፈጥሯዊ ያለፈ ጊዜ ቅርጽ ያቀርባል።
- source_word: Δέξαι
  choice: ውሰድ
  rationale: ሰነዱን በእጅ መቀበልንና ይዞ መጠቀምን በዚህ አውድ በግልጽ ያሳያል።
- source_word: σου τὰ γράμματα
  choice: የዕዳ ደብዳቤህን
  rationale: γράμματα በቁጥር ብዙ ቢሆንም በዕዳው አውድ የሚያመለክተውን የጽሑፍ ዕዳ ሰነድ በተፈጥሯዊ አማርኛ ያቀርባል፤ ቃል በቃል ‘ጽሑፎች’ የሚለውን አሻሚ አገላለጽ ያስወግዳል።
- source_word: γράψον ὀγδοήκοντα
  choice: ሰማንያ ብለህ ጻፍ
  rationale: በሰነዱ ላይ አዲሱን መጠን እንዲጽፍ የተሰጠውን ትእዛዝ ግልጽና ተፈጥሯዊ አድርጎ ይገልጻል።
