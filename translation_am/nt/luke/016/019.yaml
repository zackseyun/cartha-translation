  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በየቀኑ በቅንጦት ግብዣ ያደርግ ነበር።” “ይደሰት” ተብሎ የተተረጎመው ቃል በደስታ መዝናናትን ወይም ግብዣ ማድረግን ሊያመለክት ይችላል፤ “በቅንጦት” ደግሞ የተንደላቀቀ የኑሮ ግርማን ሊያጎላ ይችላል።
