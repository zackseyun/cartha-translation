  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: am
  text: እርሱንም ጠርቶ፣ “ስለ አንተ የምሰማው ይህ ምንድን ነው? የአስተዳዳሪነትህን ሂሳብ አቅርብ፤[a] ከእንግዲህ በኋላ ማስተዳደር አትችልምና”[b] አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአስተዳደርህን ሂሳብ ስጥ” ወይም “የአስተዳዳሪነትህን ሂሳብ አስረክብ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእንግዲህ በኋላ በአስተዳዳሪነት ማገልገል አትችልምና።”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: እርሱንም ጠርቶ
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች አንቀጽ ከዋናው ግስ በፊት መጥራቱን ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: ስለ አንተ የምሰማው ይህ ምንድን ነው?
  rationale: የግሪኩን የተግሣጽ ድምፅ ያለማብራራት ይጠብቃል፤ περὶ σοῦ በተፈጥሯዊ ሁኔታ ‘ስለ አንተ’ ተብሏል።
- source_word: ἀπόδος τὸν λόγον
  choice: ሂሳብ አቅርብ
  rationale: በአስተዳደር አውድ λόγος የሂሳብ መግለጫን ወይም ተጠያቂነትን ያመለክታል፤ ‘ሂሳብ አቅርብ’ ግልጽና ወቅታዊ የአማርኛ አገላለጽ ነው።
- source_word: τῆς οἰκονομίας σου
  choice: የአስተዳዳሪነትህን
  rationale: οἰκονομία የሌላውን ቤት ወይም ንብረት የማስተዳደር ኃላፊነትና ሹመት ያመለክታል፤ ‘አስተዳዳሪነት’ ይህን ከአጠቃላይ አስተዳደር ይበልጥ በግልጽ ይገልጣል።
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: ከእንግዲህ በኋላ ማስተዳደር አትችልምና
  rationale: δύνῃ ከግስ መደብ ጋር አለመቻልን፣ ἔτι ደግሞ የኃላፊነቱን መቋረጥ ያሳያል። ‘ማስተዳደር’ ከοἰκονομία ጋር ያለውን የቃል ዝምድና በተፈጥሯዊ አማርኛ ያቆያል።
