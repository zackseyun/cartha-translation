  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: am
  text: ማንም የቤት አገልጋይ ለሁለት ጌቶች ማገልገል አይችልም፤ ምክንያቱም ወይ አንዱን ይጠላል ሌላውንም ይወዳል፣ ወይም ለአንዱ ታማኝ ይሆናል ሌላውንም ይንቃል። እግዚአብሔርንና ማሞንን[a] ማገልገል አትችሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ሀብት» ወይም «ገንዘብ»። የግሪኩ ጽሑፍ «ማሞን» የሚለውን ቃል ይጠቀማል፤ በዚህም ሀብት ከእግዚአብሔር ጋር እንደሚፎካከር ጌታ ቀርቧል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: የቤት አገልጋይ
  rationale: ቃሉ በቤተሰብ ውስጥ በአገልጋይነት የሚኖርን ሰው ያመለክታል። «የቤት አገልጋይ» የቤት ውስጥ አውዱንና የጌታና የአገልጋይን ግንኙነት በግልጽ ያስቀምጣል።
- source_word: κυρίοις
  choice: ጌቶችን
  rationale: በዚህ ማኅበራዊ ምሳሌ ውስጥ ቃሉ የአገልጋዩን ጌቶች ያመለክታል፤ መለኮታዊውን «ጌታ» ሳይሆን የሥልጣን ባለቤቶችን ይጠቁማል።
- source_word: δουλεύειν
  choice: ማገልገል
  rationale: ግሱ እንደ አገልጋይ ወይም ባሪያ መገዛትንና ማገልገልን ይገልጣል። «ማገልገል» በአማርኛ ተፈጥሯዊ ሲሆን የጌቶች አገላለጽ የመገዛትን ኃይል ይጠብቃል።
- source_word: μισήσει / ἀγαπήσει
  choice: ይጠላል / ይወዳል
  rationale: የግሪኩን ጠንካራ ተቃርኖ ሳያለዝብ «መጥላት»ና «መውደድ» በቀጥታ ይወክላሉ።
- source_word: ἀνθέξεται
  choice: ከአንዱ ጋር ይጣበቃል
  rationale: ቃሉ አንዱን አጥብቆ መያዝ፣ ከእርሱ ጋር መጣበቅና ለእርሱ ታማኝ መሆንን ያመለክታል። ይህ አገላለጽ የግንኙነትና የታማኝነት ኃይሉን ይጠብቃል።
- source_word: καταφρονήσει
  choice: ይንቃል
  rationale: ቃሉ በንቀት ማየትንና ዋጋ መንሳትን ይገልጣል፤ «ይንቃል» አጭር፣ ጠንካራና ተፈጥሯዊ ትርጉም ነው።
- source_word: μαμωνᾷ
  choice: ማሞንን
  rationale: የሴማዊውን የብድር ቃል መጠበቅ ሀብትን እንደ ተቀናቃኝ ጌታ የሚያቀርበውን ሰውኛ አድርጎ የመናገር ኃይል ያስጠብቃል፤ ትርጉሙ በግርጌ ማስታወሻ ተብራርቷል።
theological_decisions:
- issue: θεῷ እና μαμωνᾷ እንደ ተቀናቃኝ ጌቶች መቅረባቸው
  choice: እግዚአብሔርንና ማሞንን
  alternative: እግዚአብሔርንና ሀብትን / ገንዘብን
  rationale: «ማሞን»ን በድምፅ ማስተላለፍ ሀብት ለሰው ታማኝነት የሚጠይቅ ተቀናቃኝ ጌታ ሆኖ የቀረበበትን የንግግር ኃይል ይጠብቃል። ይህ ማሞን ቃል በቃል አምላክ ነው የሚል አይደለም።
- issue: የነጠላ ምሳሌውና የብዙ ቁጥር ቀጥተኛ ንግግሩ
  choice: በምሳሌው «ይጠላል… ይወዳል…»፣ በመደምደሚያው «አትችሉም»
  alternative: ሁሉንም በነጠላ ወይም በብዙ ቁጥር ማቅረብ
  rationale: ይህ የግሪኩን አወቃቀር ይጠብቃል፤ መጀመሪያ አጠቃላይ ነጠላ ምሳሌ ይሰጣል፣ በመጨረሻም አድማጮቹን በብዙ ቁጥር በቀጥታ ይጠራል።
