review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the conditional argument, the stewardship sense of πιστεύσει (‘entrust’), and the supplied noun ‘wealth’ for τὸ ἀληθινόν. However, የታመናችሁ is passive (‘you who have been trusted’) and reverses the sense of πιστοί (‘faithful/trustworthy’). ዓመፀኛ primarily denotes rebellious/insurrectionary rather than unjust or unrighteous, and is not the most accurate modifier for ἀδίκῳ here.
  naturalness: The revised wording is idiomatic modern standard Amharic. ታማኞች ካልሆናችሁ clearly expresses the required predicate ‘if you have not been faithful.’
  terminology: ሀብት appropriately renders μαμωνᾷ broadly. ኢፍትሐዊው preserves the ‘unjust/unrighteous’ force of ἀδίκῳ without narrowing it to fraud. እውነተኛውን ሀብት is a permissible idiomatic completion of the substantival τὸ ἀληθινόν, with the supplied noun disclosed in a note.
  issues:
  - severity: high
    issue: የታመናችሁ renders πιστοί incorrectly.
    rationale: The Amharic participle is passive and means ‘having been trusted,’ while πιστοί here describes the audience as faithful or trustworthy stewards. It should be rendered ታማኞች ካልሆናችሁ.
  - severity: medium
    issue: ዓመፀኛው is an imprecise rendering of ἀδίκῳ.
    rationale: ዓመፀኛ normally means rebellious, mutinous, or insurgent. ἀδίκῳ means unjust/unrighteous; ኢፍትሐዊው gives this sense more accurately in modern Amharic.
