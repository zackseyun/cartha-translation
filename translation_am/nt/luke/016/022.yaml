review_pass:
  verdict: revise
  source_fidelity: The main sequence and both deaths are accurately represented. However, ἀπενεχθῆναι specifically conveys that the poor man was carried/borne away; the draft's ወሰዱት (‘took him’) weakens this detail. The revision expresses the carrying action while retaining the angels as agents.
  naturalness: The revision remains modern, clear Amharic and preserves the concise parallelism of the Greek. መላእክትም ተሸክመው ... ወሰዱት is natural and explicit.
  terminology: 'ወደ አብርሃም እቅፍ appropriately preserves the image of κόλπος without doctrinally defining it. The footnote''s alternative must use ወደ, not ከ: the latter means ‘from Abraham’s side’ and reverses the directional sense.'
  issues:
  - severity: medium
    issue: The rendering መላእክትም ... ወሰዱት does not explicitly convey ‘carried/bore.’
    rationale: ἀπενεχθῆναι is more specific than simply ‘take.’ Adding ተሸክመው preserves the source image without awkward literalism.
  - severity: medium
    issue: The footnote alternative says «ከአብርሃም ጎን».
    rationale: ከ means ‘from,’ whereas εἰς and the stated English alternative require movement ‘to Abraham’s side.’
  revised_text: ድሀውም ሞተ፤ መላእክትም ተሸክመው ወደ አብርሃም እቅፍ[a] ወሰዱት። ሀብታሙም ደግሞ ሞተ፤ ተቀበረም።
