  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: am
  text: ድሀውም ሞተ፤ መላእክትም ተሸክመው ወደ አብርሃም እቅፍ[a] ወሰዱት። ሀብታሙም ደግሞ ሞተ፤ ተቀበረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ አብርሃም ጎን»። የግሪኩ አገላለጽ ቃል በቃል «ወደ አብርሃም እቅፍ» ሲሆን፣ የቅርበት፣ የክብርና የኅብረት ምስል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: ድሀውም … ሞተ
  rationale: የሉቃስን የትረካ መሸጋገሪያ በአማርኛ ተፈጥሯዊ በሆነው -ም አያያዥ ተወክሏል፤ «እንዲህም ሆነ» ማለት አላስፈላጊ ክብደት ይፈጥራል።
- source_word: τὸν πτωχὸν
  choice: ድሀው
  rationale: πτωχός ድሀነትንና እጦትን ያመለክታል፤ «ድሀው» ቀጥተኛና ዘመናዊ ነው። «ለማኙ» በዚህ ሐረግ በግልጽ ያልተጠቀሰ ሐሳብ ሊጨምር ይችላል።
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: መላእክትም … ወሰዱት
  rationale: የግሪኩ ተገብሮአዊ ቅርጽ ወኪሎቹን በግልጽ ይጠቅሳል፤ በአማርኛ ግብሩን በነቃ ቅርጽ መግለጽ ተፈጥሯዊ ሲሆን የትርጉሙን ይዘት አይለውጥም።
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: ወደ አብርሃም እቅፍ
  rationale: κόλπος ቃል በቃል ደረትን ወይም እቅፍን፣ በዐውዱም ቅርበትንና የክብር ኅብረትን ያመለክታል። «እቅፍ» ምስሉን ሳያጠፋ በዘመናዊ አማርኛ የሚገባ ነው።
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: ሀብታሙም ደግሞ ሞተ
  rationale: «ደግሞ» καί የሚያሳየውን ትይዩ ዕጣ ይጠብቃል፤ -ም ደግሞ የδέን ቀላል አያያዥነት በተፈጥሮ ያቀርባል።
- source_word: ἐτάφη
  choice: ተቀበረም
  rationale: የθάπτω ተገብሮአዊ ቅርጽን በአጭርና ቀጥተኛ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የεἰς τὸν κόλπον Ἀβραάμ አተረጓጎም
  choice: ወደ አብርሃም እቅፍ
  alternative: ከአብርሃም ጎን
  rationale: የመነሻው ንግግር የቅርበት፣ የክብርና የኅብረት ምስል ይዟል። «እቅፍ» ይህን ምስል ይጠብቃል፤ ትርጉሙንም ወደ አንድ የተወሰነ የኋለኛው ዓለም ትምህርት አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር ትይዩ አወቃቀርና የአብርሃም እቅፍ ምስላዊ አገላለጽ ተጠብቀዋል።
