base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: am
  text: ከሀብታሙ ሰው ማዕድ ከሚወድቀው ነገር ሊጠግብ ይመኝ ነበር።[a] ነገር ግን ውሾች እንኳ እየመጡ ቁስሎቹን ይልሱ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሀብታሙ ሰው ማዕድ የወደቀው ፍርፋሪ ሊጠግብበት።” ግሪኩ ቃል በቃል “ከሚወድቀው ነገር” ይላል፤ “ፍርፋሪ” የሚለው ከምግብ ዐውዱ የሚገመት እንጂ በቀጥታ የተጠቀሰ አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: ይመኝ ነበር
  rationale: የአሁን ጊዜ አንቀጽ የቀጠለ ጽኑ ፍላጎትን ያሳያል፤ ይህ አገላለጽ በተፈጥሯዊ አማርኛ ያንን ቀጣይነት ያስተላልፋል።
- source_word: χορτασθῆναι
  choice: ሊጠግብ
  rationale: በምግብ ዐውድ ውስጥ በቂ ምግብ አግኝቶ መጥገብን ያመለክታል፤ አማርኛው ተፈጥሯዊ ሲሆን የቃሉን ውጤታዊ ሁኔታ ይጠብቃል።
- source_word: ἀπὸ τῶν πιπτόντων
  choice: በሚወድቀው
  rationale: በግሪኩ ያለውን ‘በሚወድቀው’ የሚለውን ግልጽ ያልተወሰነ አገላለጽ ይጠብቃል፤ ‘ፍርፋሪ’ የሚለው ከዐውዱ የሚገመት እንጂ በቀጥታ የተጠቀሰ አይደለም።
- source_word: τράπεζης
  choice: ማዕድ
  rationale: በምግብ ዐውድ ውስጥ ያለውን ጠረጴዛ በተፈጥሯዊና ክብር ባለው ዘመናዊ አገላለጽ ያመለክታል።
- source_word: τοῦ πλουσίου
  choice: የሀብታሙ ሰው
  rationale: ቅጽሉ በስም ፈንታ ቆሞ በምሳሌው ውስጥ ያለውን ሀብታም ሰው ያመለክታል።
- source_word: ἀλλὰ καὶ
  choice: ነገር ግን … እንኳ
  rationale: ተቃርኖውንም ሆነ አስገራሚውን ተጨማሪ ሁኔታ በአማርኛ ያስተላልፋል።
- source_word: οἱ κύνες
  choice: ውሾች
  rationale: የግሪኩን ብዙ ቁጥር ቀጥታና ያለማለዘብ ይተረጉማል።
- source_word: ἐρχόμενοι
  choice: እየመጡ
  rationale: ከዋናው ግስ ጋር ተጓዳኝ የሆነውን ድርጊትና ቀጣይነት ይጠብቃል።
- source_word: ἐπέλειχον
  choice: ይልሱ ነበር
  rationale: ያልተጠናቀቀው የግሪክ ግስ ተደጋጋሚ ወይም ቀጣይ ድርጊትን ስለሚያሳይ፣ ይህ ቅርጽ ያንን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὰ ἕλκη αὐτοῦ
  choice: ቁስሎቹን
  rationale: ክፍት ወይም የተቆሰለ የቆዳ ሕመምን በተለመደና ለአንባቢ ግልጽ ቃል ያስተላልፋል።
