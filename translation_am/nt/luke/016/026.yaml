  language: am
  text: ከዚህ ሁሉ በተጨማሪም[a]፣ ከዚህ ወደ እናንተ ሊሻገሩ የሚፈልጉ እንዳይችሉ፣ ከዚያም ወደ እኛ እንዳይሻገሩ፣ በእኛና በእናንተ መካከል ታላቅ ገደል በጽኑ ተቀምጧል።
  philosophy: optimal-equivalence
  footnotes:
