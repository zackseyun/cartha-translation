review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional and rhetorical-question structure, as well as the contrast between what is another's and what is one's own. However, “ለሌላ ሰው በሚገባው ነገር” means “in what is fitting/due for another person,” not “in what belongs to another.” Also, “የታመናችሁ” can mean “you who were trusted,” whereas πιστοὶ here requires that the hearers themselves be faithful/trustworthy.
  naturalness: The revised wording is concise, idiomatic modern standard Amharic, and retains the formal but accessible register appropriate to the saying.
  terminology: “ታማኞች” accurately conveys stewardship reliability rather than believing faith. “በሌላ ሰው ንብረት” naturally expresses the substantival ἀλλοτρίῳ, while “የራሳችሁ የሆነውን” preserves the corresponding τὸ ὑμέτερον without specifying the referents.
  issues:
  - severity: high
    issue: The phrase “ለሌላ ሰው በሚገባው ነገር” mistranslates ἀλλοτρίῳ.
    rationale: “የሚገባው” denotes what is proper, appropriate, or owed to someone. The Greek denotes that which belongs to another person.
  - severity: medium
    issue: “የታመናችሁ” does not clearly render πιστοὶ as the hearers' faithfulness.
    rationale: The passive-perfect form may be understood as “you who have been trusted.” “ታማኞች” directly states that they are faithful/trustworthy.
  - severity: medium
    issue: Footnote b's alternative “ለእናንተ የሚገባውን” shifts the sense of τὸ ὑμέτερον.
    rationale: It can mean “what is due to you,” while the Greek more simply means “what is yours.”
  revised_text: እናም በሌላ ሰው ንብረት[a][c] ታማኞች ካልሆናችሁ፣ የራሳችሁ የሆነውን[b] ማን ይሰጣችኋል?
