review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the universal scope, divorce, remarriage, and both occurrences of μοιχεύει. However, ሌላዋን is definite (“the other [woman]”), whereas ἑτέραν is indefinite, “another woman.”
  naturalness: The sentence is otherwise clear, dignified modern standard Amharic, and its two balanced clauses read naturally. Replacing the first object with ሌላ ሴትን also makes the intended referent explicit and fluent.
  terminology: ሚስት, መፍታት, ማግባት, and ማመንዘር are appropriate modern standard terms in this register. ከባሏ የተፈታችን ሴት faithfully retains the passive, completed-state sense of ἀπολελυμένην and the relational force of ἀπὸ ἀνδρός.
  issues:
  - severity: medium
    issue: ሌላዋን is definite.
    rationale: The feminine form with -ዋ makes the object “the other woman,” while Greek ἑτέραν has no article and means “another/different woman.” The translation should not add definiteness.
  revised_text: ሚስቱን ፈትቶ ሌላ ሴትን የሚያገባ ሁሉ ያመነዝራል፤ ከባሏ የተፈታችንም ሴት የሚያገባ ያመነዝራል።
  revised_footnotes: []
