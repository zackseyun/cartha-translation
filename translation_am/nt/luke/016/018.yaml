id: LUK.16.18
reference: Luke 16:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: am
  text: ሚስቱን ፈትቶ ሌላ ሴትን የሚያገባ ሁሉ ያመነዝራል፤ ከባሏ የተፈታችንም ሴት የሚያገባ ያመነዝራል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: … ሁሉ
  rationale: የግሪኩ የአጠቃላይነት ኃይል በተፈጥሯዊው የአማርኛ ‘የሚ… ሁሉ’ አወቃቀር ተጠብቋል።
- source_word: ἀπολύων
  choice: ፈትቶ
  rationale: በጋብቻ አውድ ἀπολύω ፍቺን ያመለክታል፤ ‘መፍታት’ በአማርኛም የጋብቻ ፍቺን በተለመደ መንገድ ይገልጣል።
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ሚስቱን
  rationale: γυνή በዚህ የጋብቻ አውድ ‘ሚስት’ ማለት ነው።
- source_word: γαμῶν
  choice: የሚያገባ
  rationale: የአሁን ጊዜው ተሳቢ ግስ አጠቃላይ ሁኔታን ይገልጣል፤ የአማርኛው አንጻራዊ ግስ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἑτέραν
  choice: ሌላዋን
  rationale: የሴት ፆታ ቅርጹ ‘ሌላ ሴት’ የሚለውን ያመለክታል፤ ‘ሌላዋን’ ይህን በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: μοιχεύει
  choice: ያመነዝራል
  rationale: ግሱ ምንዝርና መፈጸምን በቀጥታ ይገልጣል፤ ይህ በዘመናዊ መደበኛ አማርኛ ግልጽና ክቡር ነው።
- source_word: ἀπολελυμένην
  choice: የተፈታችን ሴት
  rationale: ፍጹም ጊዜ ተደራጊ ተሳቢው ቀድሞ ተፈትታ በዚያ ሁኔታ ያለችን ሴት ያመለክታል፤ ተደራጊው ትርጉም ተጠብቋል።
- source_word: ἀπὸ ἀνδρὸς
  choice: ከባሏ
  rationale: ἀνήρ በዚህ አውድ ‘ባል’ ማለት ነው፤ ἀπό የመለየትን ግንኙነት ‘ከ’ በማለት ያስተላልፋል። ባለቤትነቱ በአማርኛ ለተፈጥሯዊነት ‘ባሏ’ ተብሎ ተገልጧል።
theological_decisions:
- issue: የኢየሱስ ስለ ፍቺና ዳግም ጋብቻ የተናገረው ቃል ወሰንና ኃይል
  choice: ንግግሩን ሉቃስ እንዳቀረበው አጠቃላይ የሥነ ምግባር መግለጫ አድርጎ መተርጎም።
  alternative: ከሌሎች ወንጌላት የተወሰደ የልዩ ሁኔታ አንቀጽ መጨመር፣ ወይም ንግግሩን በአንድ የተወሰነ የአይሁድ ሕጋዊ ሁኔታ ብቻ መገደብ።
  rationale: በዚህ ቁጥር ውስጥ የልዩ ሁኔታ አንቀጽ የለም። ትርጉሙ ያልተጻፈን ማብራሪያ ሳይጨምር የሉቃስን አጭርና አጠቃላይ አነጋገር ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ መደበኛና ክቡር አማርኛ ተጠቅሟል። አረፍተ ነገሩ የግሪኩን ሁለት ትይዩ አንቀጾች ይጠብቃል፤ ምንም የግርጌ ማስታወሻ አላስፈለገም።
