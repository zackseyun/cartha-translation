  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዛዊ ኃይልን “ይስሟቸው” ያስተላልፋል። “እነርሱን” የሚለውን በማቆየት ሙሴንና ነቢያትን እንደ ሰዎች ወይም ምስክርነታቸውን እንደ መጻሕፍት የሚያመለክተው የምንጩ ውክልናዊ አገላለጽ ተጠብቋል።
theological_decisions:
