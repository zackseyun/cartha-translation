  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: am
  text: በምድር ላይ ሰላምን ልሰጥ እንደመጣሁ ታስባላችሁን? አይደለም፤ እላችኋለሁ፤ ይልቁንም መከፋፈልን ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: ይመስላችኋልን?
  rationale: ለብዙ ሰዎች የቀረበውን የንግግር ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ታስባላችሁን?’ የሚለውም አማራጭ ነው።
- source_word: εἰρήνην
  choice: ሰላምን
  rationale: ማኅበራዊ ሰላምንና ስምምነትን ጨምሮ የቃሉን ሰፊ ትርጉም ይጠብቃል።
- source_word: παρεγενόμην
  choice: የመጣሁ
  rationale: የኢየሱስን መምጣትና ከሚከተለው የዓላማ ሐረግ ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δοῦναι
  choice: ለመስጠት
  rationale: የግሪኩን ቀጥተኛ ትርጉምና የዓላማ አገባብ ይጠብቃል፤ ‘ለማምጣት’ የሚለው ትርጉማዊ አማራጭ ነው።
- source_word: ἐν τῇ γῇ
  choice: በምድር ላይ
  rationale: γῆ ሊያመለክት ከሚችለው አካባቢያዊ ‘ሀገር’ ይልቅ በዚህ አውድ የሚገባውን ሰፊ የዓለም ወሰን ይገልጣል።
- source_word: οὐχί
  choice: አይደለም
  rationale: ለንግግራዊው ጥያቄ አጭርና ጠንካራ አሉታዊ መልስ ይሰጣል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የቀጥታ አድራሻውንና አጽንዖቱን በተፈጥሯዊ ወቅታዊ አማርኛ ያስተላልፋል።
- source_word: ἀλλ’ ἢ
  choice: ይልቁንም
  rationale: ከአሉታው በኋላ ያለውን ሹል ንጽጽር ያሳያል።
- source_word: διαμερισμόν
  choice: መከፋፈልን
  rationale: በሚቀጥሉት ቁጥሮች የሚገለጠውን በቤተሰብና በማኅበረሰብ መካከል የሚፈጠር መለያየት ሳያጠብ ያስተላልፋል።
theological_decisions:
- issue: የኢየሱስ መምጣት ከሰላም ጋር እንዳይጋጭ በማለት ንግግሩን ማለስለስ ይገባ እንደሆነ
  choice: ‘ሰላም’ እና ‘መከፋፈል’ የሚለውን ሹል ንጽጽር እንዳለ ማቆየት
  alternative: ‘ግጭትን’ በሚል ትርጓሜያዊ ቃል መተርጎም ወይም መከፋፈሉን ድንገተኛ ውጤት ብቻ አድርጎ ማለስለስ
  rationale: ግሪኩ ሆን ብሎ የተቀመጠ ጠንካራ ንጽጽር አለው። አውዱ ተልእኮው በሰዎችና በቤተሰቦች መካከል የሚያስከትለውን መከፋፈል ያሳያል፤ ጽሑፉ ራሱ ያልፈታውን ሥነ መለኮታዊ ውጥረት ትርጉሙ ሊያስወግደው አይገባም።
translation_notes:
  register: ወቅታዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ የጥያቄ፣ የአሉታዊ መልስና የንጽጽር አወቃቀር ተጠብቋል። አስፈላጊ ያልሆነ የግርጌ ማስታወሻ አልተጨመረም።
