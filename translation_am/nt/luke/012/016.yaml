  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: am
  text: ከዚያም እንዲህ ሲል ምሳሌ ነገራቸው፦ “የአንድ ሀብታም ሰው መሬት እጅግ ብዙ ፍሬ አፈራ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: ከዚያም … ነገራቸው
  rationale: δέ የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ ለማሳየት “ከዚያም” ተብሏል፤ παραβολὴν ቀጥተኛ ተሳቢ ስለሆነ “ምሳሌ ነገራቸው” ተፈጥሯዊ ነው።
- source_word: παραβολὴν
  choice: ምሳሌ
  rationale: በወንጌላት ውስጥ ያለውን የትምህርት ታሪክ ዘውግ የሚወክለው የተለመደውና ግልጽ ቃል “ምሳሌ” ነው።
- source_word: πρὸς αὐτοὺς
  choice: ነገራቸው
  rationale: “ለእነርሱ” የሚለው የአድራሻ ሐሳብ በግሱ ውስጥ በ“-አቸው” በተፈጥሯዊ ሁኔታ ተካቷል።
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: ተካፋይ ግሱ የምሳሌውን ቃል እንደሚያስገባ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: የአንድ ሀብታም ሰው
  rationale: የዘር ሐረጉ ከχώρα ጋር ያለውን የባለቤትነት ግንኙነት “የ…” በሚለው ቅርጽ ይጠብቃል፤ “አንድ” ደግሞ τινόςን በተፈጥሯዊ የትረካ አማርኛ ይወክላል።
- source_word: εὐφόρησεν
  choice: እጅግ ብዙ ፍሬ አፈራ
  rationale: ግሱ መሬቱ በብዛት ማፍራቱን ያመለክታል፤ “ብዙ ፍሬ አፈራ” የግብርናውን ትርጉም በዘመናዊና ግልጽ አማርኛ ያቀርባል። “እጅግ” የመብዛቱን ኃይል ያሳያል።
- source_word: ἡ χώρα
  choice: መሬት
  rationale: በዚህ ዐውድ χώρα አገርን ሳይሆን የእርሻ መሬትን ወይም የሰውየውን ይዞታ ያመለክታል፤ “መሬት” ሰፊነቱን ሳያጠብ “እርሻ” ከሚለው ይልቅ ዋናውን ቃል በትክክል ያቀርባል።
