  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: am
  text: ሀብታችሁ ባለበት ልባችሁም በዚያ ይሆናልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሀብታችሁ የትም ቢሆን፣ ልባችሁም በዚያ ይሆናልና።”
    reason: ὅπου የሚለው ቃል በአውዱ ‘ባለበት’ ወይም በሰፋ ያለ አገላለጽ ‘የትም ቢሆን’ ተብሎ ሊተረጎም ይችላል።
lexical_decisions:
- source_word: ὅπου
  choice: ባለበት
  rationale: የቦታ አንቀጹን በተፈጥሯዊ አማርኛ ይገልጻል፤ ከἐκεῖ ጋር ያለውን ‘ባለበት…በዚያ’ ተዛምዶም ይጠብቃል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ትእዛዝ ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አረፍተ ነገር ፍጻሜ ይገልጻል።
- source_word: θησαυρός
  choice: ሀብት
  rationale: በአውዱ የሚገኘውን ቁሳዊና ዘይቤያዊ ስፋት የሚያቆይ፣ ለዘመናዊ አንባቢም ግልጽ የሆነ ቃል ነው።
- source_word: καρδία
  choice: ልብ
  rationale: የፍላጎት፣ የፍቅርና የውስጣዊ አቅጣጫ ማዕከልን የሚያመለክተውን መጽሐፍ ቅዱሳዊ ስፋት ሳያጠብ ይጠብቃል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ከὅπου ጋር ያለውን ‘ባለበት…በዚያ’ የቦታ ተዛምዶ በቀጥታ ያቆያል።
- source_word: καὶ
  choice: -ም
  rationale: ልብ ከሀብት ጋር እንደሚከተል ያለውን ጨማሪ አጽንዖት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: በግሪኩ ያለውን የወደፊት ጊዜ እና የምሳሌያዊ እርግጠኝነት ይጠብቃል።
- source_word: ὑμῶν
  choice: -አችሁ
  rationale: በሁለቱም ቦታዎች ያለውን የሁለተኛ መደብ ብዙ ቁጥር ባለቤትነት በግልጽ ያሳያል።
theological_decisions:
- issue: የ‘ልብ’ ሰውነታዊና መንፈሳዊ ትርጉም
  choice: ‘ልብ’ የሚለውን መጽሐፍ ቅዱሳዊ ቃል ማቆየት
  alternative: ‘ፍላጎታችሁ’ ወይም ‘አሳባችሁ’ ብሎ በትርጓሜ ማቅረብ
  rationale: ንግግሩ የሰው ፍቅር፣ ቁርጠኝነትና ውስጣዊ አቅጣጫ ዋጋ ወደሚሰጠው ነገር እንደሚከተል ይናገራል። ‘ልብ’ ይህን ሙሉ ስፋት ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ‘ባለበት…በዚያ’ ተዛምዶ፣ የወደፊት ጊዜ እና የሁለተኛ መደብ ብዙ ቁጥር ተጠብቀዋል።
