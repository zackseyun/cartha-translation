  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: am
  text: የደቡብ ነፋስም ሲነፍስ፣ ‘ከባድ ሙቀት ይሆናል’ ትላላችሁ፤ እንዲሁም ይሆናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: የደቡብ ነፋስ
  rationale: ቃሉ ‘ደቡብ’ ወይም ‘የደቡብ ነፋስ’ ሊል ይችላል፤ πνέοντα ከሚለው ‘ሲነፍስ’ ጋር በዚህ የአየር ሁኔታ አውድ ‘የደቡብ ነፋስ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: πνέοντα
  choice: ሲነፍስ
  rationale: የነፋሱን በዚያን ጊዜ እየተከናወነ ያለ እንቅስቃሴ ይገልጣል፤ የግሪኩን የአሁን ጊዜ አሳታፊ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λέγετε
  choice: ትላላችሁ
  rationale: የተደጋጋሚና የተለመደ ንግግር ልማዳቸውን የሚገልጥ ቀላል የአሁን ጊዜ አገላለጽ ነው።
- source_word: Καύσων
  choice: ከባድ ሙቀት
  rationale: ቃሉ የሚያቃጥል ወይም እጅግ ኃይለኛ ሙቀትን ያመለክታል። ‘ከባድ ሙቀት’ ጥንካሬውን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: ወደፊት የሚኖረውን የሙቀት ሁኔታ በቀጥታ ይገልጣል።
- source_word: γίνεται
  choice: እንዲሁም ይሆናል
  rationale: የተነገረው ትንበያ በእውነት እንደሚፈጸም በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
