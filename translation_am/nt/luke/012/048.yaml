  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: am
  text: ነገር ግን ያላወቀ ሰው፣ ምት የሚያስገባ ነገር ያደረገ ቢሆንም፣ በጥቂት ምቶች ይመታል። ብዙ ከተሰጠው ሰው ሁሉ ብዙ ይጠየቃል፤ ብዙ ነገር አደራ ከሰጡት ሰው ደግሞ ይበልጥ ይጠይቁታል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: ያላወቀው
  rationale: ስማዊ ሆኖ የተጠቀሰውን የግስ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ካለማወቅ በላይ የሆነ ጥፋተኝነትን አይጨምርም።
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: መመታት የሚገባውን ነገር ቢያደርግ
  rationale: ድርጊቱ የመቀጣት ምክንያት መሆኑንና πληγῶν የሚያሳየውን የመምታት ምስል ይጠብቃል።
- source_word: δαρήσεται ὀλίγας
  choice: ጥቂት ጊዜ ይመታል
  rationale: δέρω የሚለውን ግልጽ የመምታት ትርጉም ይጠብቃል፤ ὀλίγας የሚጠቁመውን ጥቂት ምቶች በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: ብዙ ከተሰጠው ሰው ሁሉ
  rationale: የተቀባዩን ተጠያቂነት የሚያስቀድም አጠቃላይ መርሕ ሆኖ ያቀርባል።
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: ብዙ ይጠየቃል
  rationale: ζητέω በዚህ አውድ ያለውን የተጠያቂነት ጥያቄ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ከማን እንደሚጠየቅም ቀዳሚው ሐረግ ግልጽ ያደርገዋል።
- source_word: παρέθεντο
  choice: አደራ ከሰጡት
  rationale: አንድን ነገር ለሌላ ሰው እንክብካቤና ኃላፊነት አሳልፎ የመስጠትን ሐሳብ በተለመደ አማርኛ ይገልጣል።
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: ይበልጥ ይጠይቁታል
  rationale: ከቀዳሚው መጠን የላቀ ጥያቄ እንደሚኖር ይገልጣል፤ የግሪኩን ሶስተኛ መደብ ብዙ ቁጥር ቅርጽም ይጠብቃል።
theological_decisions:
- issue: የቅጣቱ ምስል ባሕርይ
  choice: የመመታትን ተጨባጭ ምስል በቀጥታ ማቆየት
  alternative: በአጠቃላይ ‘ቅጣት’ ማለት ወይም እንደ ጅራፍ ያለ ያልተጠቀሰ መሣሪያ መወሰን
  rationale: ጥቅሱ እውቀትንና ኃላፊነትን ከተመጣጣኝ ቅጣት ጋር የሚያያዝ ምሳሌያዊ ምስል ይጠቀማል፤ ትርጉሙ ይህን ሳያለዝብና ሳያጠናክር ይጠብቃል።
- issue: በመጨረሻው ሐረግ የድርጊቱ ፈጻሚ
  choice: ‘ሰጡት’ እና ‘ይጠይቁታል’ የሚሉትን ያልተወሰነ ብዙ ቁጥር ማቆየት
  alternative: ፈጻሚውን በግልጽ ‘እግዚአብሔር’ ወይም ‘ሰዎች’ ብሎ መግለጽ
  rationale: የግሪኩ ጽሑፍ ግልጽ ባለቤት የሌላቸውን የሶስተኛ መደብ ብዙ ቁጥር ግሶች ይጠቀማል፤ ትርጉሙ ጽሑፉ ያልወሰነውን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘አደራ መስጠት’ የአደራና የኃላፊነትን ሐሳብ ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
