review_pass:
  verdict: revise
  source_fidelity: The draft preserves the overall contrast between ignorance, proportionate beating, and heightened accountability. However, the first clause uses a conditional form (ቢያደርግ, “if he does”) where the Greek has a completed participial action (“having done”), and መመታት የሚገባውን ነገር can suggest that the “thing” itself deserves beating rather than that the person's deed merits blows. The revision makes the deed-to-punishment relation explicit and renders ὀλίγας as “a few blows.”
  naturalness: The revised wording is idiomatic modern standard Amharic, avoids an ambiguous passive/active reading of ይመታል by supplying በጥቂት ምቶች, and keeps the concise, formal register appropriate to the passage.
  terminology: ምት የሚያስገባ ነገር preserves the concrete disciplinary image of πληγαί without specifying an instrument. አደራ መስጠት naturally conveys παρέθεντο (“entrusted”). The indefinite plural subjects in ሰጡት and ይጠይቁታል are retained without identifying them as God or people.
  issues:
  - severity: medium
    issue: The phrase መመታት የሚገባውን ነገር is semantically and syntactically unclear.
    rationale: Its relative clause most naturally modifies ነገር (“a thing that deserves to be beaten”), whereas the Greek means that the person's action is worthy of blows. Recasting it as ምት የሚያስገባ ነገር clearly expresses the intended relation.
  - severity: medium
    issue: ቢያደርግ introduces a conditional nuance not present in ποιήσας.
    rationale: The Greek aorist participle presents the deed as having been done. ያደረገ is a closer and natural Amharic equivalent in this context.
  - severity: low
    issue: ጥቂት ጊዜ (“a few times”) does not explicitly retain the implied noun “blows.”
    rationale: Although understandable, በጥቂት ምቶች explicitly carries forward πληγῶν and better reflects δαρήσεται ὀλίγας.
  revised_text: ነገር ግን ያላወቀ ሰው፣ ምት የሚያስገባ ነገር ያደረገ ቢሆንም፣ በጥቂት ምቶች ይመታል። ብዙ ከተሰጠው ሰው ሁሉ ብዙ ይጠየቃል፤ ብዙ ነገር አደራ ከሰጡት ሰው ደግሞ ይበልጥ ይጠይቁታል።
