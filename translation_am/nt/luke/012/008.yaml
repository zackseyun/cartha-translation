  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: am
  text: “እኔም እላችኋለሁ፤ በሰዎች ፊት የሚመሰክርልኝ ሁሉ፣ የሰው ልጅም በእግዚአብሔር መላእክት ፊት ይመሰክርለታል።[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሚመሰክርልኝ … ይመሰክርለታል” የሚለው “እኔን በግልጽ የሚቀበል … እርሱን በግልጽ ይቀበለዋል” ተብሎም ሊተረጎም ይችላል። ግሪኩ ቃል በቃል “በእኔ … በእርሱ” ይላል፤ በዚህ አገባብ ግን በግልጽ ማመንን ወይም መመስከርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: እኔም እላችኋለሁ
  rationale: የአሁን ጊዜውን የተከበረ አገላለጽ ያቆያል፤ δέ እዚህ ጠንካራ ተቃርኖ ሳይሆን ንግግሩን የሚያያይዝ በመሆኑ “-ም” ተፈጥሯዊ ነው።
- source_word: πᾶς ὃς ἂν
  choice: የሚመሰክር ሁሉ
  rationale: ማንንም ሳይለይ የሚመለከተውን አጠቃላይ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: የሚመሰክር … ይመሰክራል
  rationale: ግሱ በሕዝብ ፊት በግልጽ ማመንን ወይም መቀበልን ያመለክታል፤ ተመሳሳዩን ግስ በሁለቱም ክፍሎች መጠቀም የሰውንና የሰው ልጅን ተመላላሽ ምስክርነት ያቆያል።
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: ለእኔ … ለእርሱ
  rationale: ከὁμολογέω ጋር ያለው ἐν ቃል በቃል “በ” ከሚለው ይልቅ አንድን ሰው በግልጽ ለመቀበልና ለእርሱ ለመመስከር የሚያመለክት ፈሊጣዊ አጠቃቀም ነው። “ለእኔ/ለእርሱ” በአማርኛ የተፈጥሮ አገላለጽ ሲሆን ተመላላሽነቱንም ይጠብቃል።
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: በሰዎች ፊት
  rationale: ἀνθρώπων እዚህ ሰዎችን በአጠቃላይ ያመለክታል፤ “ሰዎች” ይህን ወካይ ኃይል በዘመናዊ አማርኛ በትክክል ያስተላልፋል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የታወቀ ራስ-መጠሪያና መጽሐፍ ቅዱሳዊ ክብደቱን ይጠብቃል።
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: በእግዚአብሔር መላእክት ፊት
  rationale: የሰማያዊውን ሕዝባዊ ምስክርነት ትዕይንት ቀጥተኛና የተከበረ በሆነ አማርኛ ያቆያል።
