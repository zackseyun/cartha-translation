  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: am
  text: «በምድር ላይ እሳትን ልጥል መጣሁ፤ ምነው አስቀድሞ ተቀጣጥሎ ቢሆን![a]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፦ «አስቀድሞ ተቀጣጥሎ ከሆነ፣ ምን እፈልጋለሁ?» የግሪኩ ሐረግ አስቸጋሪ ነው፤ ዋናው ጽሑፍ ጽኑ ምኞትን የሚገልጽ ሊሆን የሚችለውን ፈሊጣዊ ትርጉም ያቀርባል።
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: እሳትን
  rationale: የምንጩን ምስላዊ አገላለጽ እንዳለ ያቆያል፤ በዋናው ጽሑፍ ‘ፍርድ’፣ ‘መንጻት’ ወይም ሌላ ትርጉም በመጨመር አይፈታውም።
- source_word: ἦλθον
  choice: መጣሁ
  rationale: የግሪኩን አኦሪስት በቀጥታ የሚያንጸባርቅና የተልእኮ ዓላማን በተፈጥሯዊ አማርኛ የሚገልጽ ነው።
- source_word: βαλεῖν
  choice: ልጥል
  rationale: የβάλλωን ‘መጣል’ የሚለውን ግልጽና ኃይለኛ ምስል ይጠብቃል፤ ‘ላመጣ’ ከሚለው ይልቅ ለምንጩ ቅርብ ነው።
- source_word: ἐπὶ τὴν γῆν
  choice: በምድር ላይ
  rationale: γῆ ምድር፣ አገር ወይም መሬት ሊሆን ቢችልም፣ በዚህ ሰፊ የተልእኮ አባባል ‘በምድር ላይ’ ተፈጥሯዊና ተገቢ ነው።
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: እንዴትስ አሁን ተቀጣጥሎ ቢሆን እመኛለሁ!
  rationale: አስቸጋሪውን የግሪክ ሐረግ እንደ ጽኑ ምኞት የሚገልጽ ቃለ አጋኖ ያቀርባል፤ ቃል በቃል አወቃቀሩን ግን በማስታወሻ ያቆያል።
- source_word: ἤδη
  choice: አሁን
  rationale: በአማርኛ የምኞት አገላለጹ ውስጥ ἤδη የሚያመለክተውን ‘እስከ አሁን/አስቀድሞ’ ሐሳብ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἀνήφθη
  choice: ተቀጣጥሎ ቢሆን
  rationale: የἀνάπτωን ተገብሮአዊ የ‘መቀጣጠል’ ትርጉም ይጠብቃል፤ ከእሳት ምስሉ ጋርም ተፈጥሯዊ ነው።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ ‘እሳት’ የሚለው ምን እንደሚያመለክት
  choice: ‘እሳት’ የሚለውን ምስል ሳይተረጉሙ እንዳለ ማቆየት
