  rationale: ቁጥሩ ራሱ ምስሉን በግልጽ አይፈታውም፤ ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱንና ብዙ ድምፁን ይጠብቃል።
- issue: τί θέλω εἰ ἤδη ἀνήφθη የሚለው አስቸጋሪ ሐረግ ኃይል
  choice: ጽኑ ምኞትን እንደሚገልጽ ቃለ አጋኖ ማቅረብ
  alternative: ‘ቀድሞ ተቀጣጥሎ ከሆነ፣ ምን እፈልጋለሁ?’ የሚል ቃል በቃል ጥያቄ
  rationale: የምኞት አገላለጹ በዐውደ ንባቡ የተገባና በዘመናዊ አማርኛ ግልጽ ነው፤ የምንጩ እውነተኛ አሻሚነት ግን በግርጌ ማስታወሻ ተጠብቋል።
