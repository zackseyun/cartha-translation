    reason: የεἰς θεὸν አማራጭ ግንኙነታዊ አተረጓጎም
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁ ነው
  rationale: ይህ አገላለጽ ከቀደመው ምሳሌ የሚወጣውን ትግበራ በተፈጥሯዊና አጭር የአማርኛ አነጋገር ያሳያል።
- source_word: ὁ θησαυρίζων
  choice: ሀብት የሚያከማች ሰው
  rationale: መስተዋድድ ያለው የአሁን ጊዜ ተሳቢ አጠቃላይ ሰውን ይወክላል፤ ‘የሚያከማች’ ደግሞ ቀጣይነት ያለውን የማከማቸት ባሕርይ ይጠብቃል።
- source_word: ἑαυτῷ
  choice: ለራሱ
  rationale: የድርጊቱን ራስ-ተኮር ጥቅም በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ μὴ
  choice: ግን ... ያልሆነ
  rationale: καί በቃል ደረጃ ‘እና’ ቢሆንም፣ በአማርኛ ሁለቱን ተቃራኒ ገለጻዎች ተፈጥሯዊ ለማያያዝ ‘ግን’ የንግግሩን ኃይል ሳያጋንን ይሻላል።
- source_word: εἰς θεὸν
  choice: በእግዚአብሔር ፊት
  rationale: ከπλουτέω ጋር ያለው εἰς ግንኙነታዊ አቅጣጫን ወይም በእግዚአብሔር አንጻር ያለ ሁኔታን ያመለክታል። ‘በእግዚአብሔር ፊት’ በአማርኛ ግልጽና ክቡር ሲሆን የሐረጉን የትርጉም ክፍተት ይጠብቃል።
- source_word: πλουτῶν
  choice: ባለጠጋ
  rationale: ተሳቢው በዚህ አወቃቀር እንደ ባሕርይ ገላጭ ይሠራል፤ ‘ባለጠጋ’ ከሀብት ማከማቸት ጋር ያለውን ተቃርኖ በአጭሩ ይጠብቃል።
theological_decisions:
- issue: በሥነ ምግባራዊው ንግግር ያለው ወካይ ነጠላ ተሳቢ
  choice: ሰው
  alternative: ወንድ / እርሱ
  rationale: የግሪኩ ተሳቢ ሰዋሰዋዊ ወንድ ነጠላ ቢሆንም አጠቃላይ የሰው ምሳሌን ያቀርባል። ‘ሰው’ ትግበራውን ለወንዶች ብቻ ሳይገድብ የምንጩን ወካይ ነጠላነት ይጠብቃል።
- issue: ‘εἰς θεὸν πλουτῶν’ የሚለው ሥነ መለኮታዊ ሐረግ
  choice: በእግዚአብሔር ፊት ባለጠጋ
  alternative: ለእግዚአብሔር ባለጠጋ / በእግዚአብሔር ዘንድ ባለጠጋ
  rationale: ጥቅሱ ይህ ብልጽግና በትክክል ምን እንደሚያካትት አይወስንም። ትርጉሙም የተወሰነ የሃይማኖት ትርጓሜ ሳይጨምር ግንኙነታዊውንና ግምገማዊውን ውጥረት ይጠብቃል።
