  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: am
  text: ነገር ግን የእርሱን መንግሥት[b][a] ፈልጉ፤ እነዚህም ነገሮች ይጨመሩላችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእግዚአብሔርን መንግሥት»፤ የግሪኩ ጽሑፍ «የእርሱን መንግሥት» ይላል፤ የተውላጠ ስሙ ዋቢ ከዐውዱ ይገባል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች «የእርሱን መንግሥት» በሚለው ፈንታ «የእግዚአብሔርን መንግሥት» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
