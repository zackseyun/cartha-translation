- source_word: βασιλείαν
  choice: መንግሥት
  rationale: በሉቃስ ውስጥ መለኮታዊውን ግዛትና የግዛቱን ዓለም ሁለቱንም ሊያካትት የሚችለውን ሰፊ የቃሉን ክልል የሚጠብቅ የተለመደና ግልጽ አቻ ነው።
- source_word: αὐτοῦ
  choice: የእርሱን
  rationale: ተውላጠ ስሙን እንዳለ ይጠብቃል፤ ዋቢው እግዚአብሔር መሆኑ ከዐውዱ ይታወቃል እንጂ በዋናው ጽሑፍ ውስጥ በስም አልተገለጸም።
- source_word: ταῦτα
  choice: እነዚህም ነገሮች
  rationale: በአካባቢው ዐውድ የተነገሩትን የኑሮ ፍላጎቶች ያመለክታል፤ «ሁሉ» የሚል ቃል አለመጨመሩ የሉቃስን አጭር ንባብ ይጠብቃል።
- source_word: προστεθήσεται
  choice: ይጨመሩላችኋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና የመጨመር ምሳሌያዊ አገላለጹን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑμῖν
  choice: -ላችኋል
  rationale: ብዙ ተቀባዮችን የሚያመለክተውን ዳቲቭ በአማርኛው ግስ ላይ በተፈጥሮ ያዋህዳል።
theological_decisions:
- issue: የαὐτοῦ ዋቢ
  choice: ተውላጠ ስሙ «የእርሱን መንግሥት» ተብሎ ተጠብቋል፤ ዋቢው እግዚአብሔር መሆኑ ከዐውዱ ይገባል።
