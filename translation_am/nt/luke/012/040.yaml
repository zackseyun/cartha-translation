- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የግሪኩን የማዕረግ ስም ቃላዊ ቅርጽና ከዳንኤል 7፥13–14 ጋር ያለውን ድምፀት የሚጠብቅ የተለመደ የአማርኛ አተረጓጎም ነው።
- source_word: ἔρχεται
  choice: ይመጣል
  rationale: የግሪኩ የአሁን ጊዜ ግስ የወደፊት መምጣትን በሕያውነት ያቀርባል። ‘ይመጣል’ በአማርኛ ይህን የወደፊት ኃይል በተፈጥሯዊ ሁኔታ ይገልጣል፤ ‘እየመጣ ነው’ ግን መምጣቱ አሁን በሂደት ላይ እንዳለ በማስመሰል ትርጉሙን ሊያጠብ ይችላል።
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου የሚለውን ክርስቶሳዊ የማዕረግ ስም መተርጎም
