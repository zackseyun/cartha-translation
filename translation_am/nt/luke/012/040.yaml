- issue: ἔρχεται የሚለው የአሁን ጊዜ ግስ በዚህ የመጨረሻ ዘመን ንግግር ያለው የጊዜ ኃይል
  choice: ይመጣል
  alternative: እየመጣ ነው
  rationale: ግሪኩ የወደፊትን ክስተት በአሁን ጊዜ ቅርጽ ሊገልጥ ይችላል። የአማርኛው ቀላል የወደፊት ግስ የማስጠንቀቂያውን ኃይል ይጠብቃል፤ ስለ መጨረሻው ዘመን የተለየ ሥርዓት አይጭንም።
