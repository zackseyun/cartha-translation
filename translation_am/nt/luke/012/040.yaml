lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: የግል ተውላጠ ስሙን በግልጽ ማስቀመጥ አድማጮቹ ከቀደመው ምሳሌ አገልጋዮች ጋር እንደሚካተቱ ያሳያል፤ -ም የሚለውም ‘እናንተም ደግሞ’ የሚለውን አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γίνεσθε ἕτοιμοι
  choice: ዝግጁ ሁኑ
