  rationale: የአማርኛው -ና ቅጥያ ለትእዛዙ የተሰጠውን ምክንያት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ᾗ ὥρᾳ οὐ δοκεῖτε
  choice: ባልጠበቃችሁት ሰዓት
