review_pass:
  verdict: revise
  source_fidelity: The draft retains the major elements of the Greek, including the temporal transition, the enormous crowd, the priority of the disciples as audience, the leaven image, and its identification as hypocrisy. However, the crowd clause uses an awkward result construction, and the warning is less direct than the Greek's imperative.
  naturalness: “እርስ በርሳቸው እስኪረጋገጡ ድረስ ተሰብስበው ሳሉ” is structurally strained in modern standard Amharic. Placing the warning after the explanatory apposition is possible but less natural and less forceful than directly commanding the disciples to guard themselves from the Pharisees’ leaven.
  terminology: “ፈሪሳውያን,” “እርሾ,” and “ግብዝነት” are appropriate modern biblical-register terms. “እልፍ አእላፍ” is a suitable rendering for μυριάδες when supported by a footnote explaining the possible numerical sense.
  issues:
  - severity: medium
    issue: The result clause is awkwardly expressed.
    rationale: ὥστε καταπατεῖν ἀλλήλους expresses the consequence of the crowd’s gathering. The draft’s “እስኪ… ድረስ” is more naturally a limit/until construction and obscures the result relation. “ስለ ተጨናነቁ እርስ በርሳቸው እስከ መረጋገጥ ድረስ” more clearly conveys the crowded, trampling consequence.
  - severity: medium
    issue: The imperative is deferred after the appositional explanation.
    rationale: 'The Greek begins the warning with Προσέχετε. Amharic is clearer and more idiomatic when the command comes first: “ራሳችሁን ከ… ጠብቁ፤ ይህም ግብዝነት ነው።” This retains the explanatory force of ἥτις without changing the metaphor.'
  - severity: low
    issue: The crowd is rendered simply as “ሰዎች.”
    rationale: “የሕዝቡ” better reflects τοῦ ὄχλου and keeps the sense of a gathered crowd rather than an unspecified number of people.
