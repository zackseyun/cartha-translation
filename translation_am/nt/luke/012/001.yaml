  rationale: ሉቃስ ምሳሌውን በግብዝነት በግልጽ ስለሚለየው፣ ትርጉሙ ምስሉን እንዳለ ማቆየት እንጂ የተወሰነ የእምነት ትርጓሜ መጫን የለበትም።
- issue: የπρῶτον ወሰን
  choice: ኢየሱስ በቅድሚያ ደቀ መዛሙርቱን እንዳነጋገረ ማሳየት
  alternative: ‘ከሁሉ በፊት’ የሚል የንግግር ምልክት አድርጎ መተርጎም
  rationale: ግሪኩ ሁለቱንም አቅጣጫዎች ሊፈቅድ ቢችልም፣ የአድማጮችን ቅድሚያ የሚያሳየው ንባብ የትረካውን ፍሰት ይጠብቃል፤ ያልተነገረ ቀጣይ ንግግርም አያስገባም።
