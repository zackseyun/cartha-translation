id: LUK.12.41
reference: Luke 12:41
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: am
  text: ጴጥሮስም፣ “ጌታ ሆይ፣ ይህን ምሳሌ የምትናገረው ለእኛ ነው ወይስ ለሁሉም ጭምር?” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: አለው
  rationale: የλέγω የትርክት ግስ ስለሆነ፣ የንግግሩ ጥያቄነት በጥያቄ ምልክትና በአገባቡ እንዲገለጥ ተደርጎ ‘አለው’ ተመርጧል።
- source_word: δὲ
  choice: -ም
  rationale: δὲ የንግግር ቀጣይነትን ያመለክታል፤ በአማርኛ ‘ጴጥሮስም’ የሚለው ተፈጥሯዊ ሽግግር ይሰጣል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በቀጥታ ጥሪ ውስጥ κύριος የክብር ትርጉሙንና ሊኖረው የሚችለውን ክርስቶሳዊ አንድምታ ሳያጠፋ ‘ጌታ ሆይ’ ተብሏል።
- source_word: πρὸς ἡμᾶς
  choice: ለእኛ
  rationale: ቃል በቃል ‘ወደ እኛ’ ማለት ቢቻልም፣ ከ‘መናገር’ ጋር ‘ለእኛ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ንግግሩ የሚመለከታቸውን ወገኖች ያሳያል።
- source_word: τὴν παραβολὴν ταύτην
  choice: ይህን ምሳሌ
  rationale: παραβολή በወንጌላት የኢየሱስን ምሳሌያዊ ትምህርት የሚጠቁም ስለሆነ፣ የተለመደውና ግልጽ የአማርኛ ቃል ‘ምሳሌ’ ተመርጧል።
- source_word: λέγεις
  choice: የምትናገረው
  rationale: የግሪኩ የአሁን ጊዜ ግስ ጴጥሮስ አሁን የሰማውን ትምህርት እንደሚጠይቅ ያሳያል፤ ይህም በ‘የምትናገረው’ ተፈጥሯዊ ሆኖ ተገልጧል።
- source_word: ἢ καὶ
  choice: ወይስ ... ጭምር
  rationale: ἢ የሁለት አማራጮችን ጥያቄ ሲያቀርብ፣ καὶ ሁለተኛውን ወገን እንደ ተጨማሪ ያጎላል፤ ‘ወይስ ... ጭምር’ ሁለቱንም ኃይሎች ይጠብቃል።
- source_word: πρὸς πάντας
  choice: ለሁሉም
  rationale: πάντας በቅርጹ ወንድ ብዙ ቁጥር ቢሆንም እዚህ ሰፊውን አድማጭ በአጠቃላይ ያመለክታል፤ ‘ለሁሉም’ ይህን አካታች ማጣቀሻ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በጴጥሮስ ቀጥተኛ ጥሪ ውስጥ κύριος እንዴት እንደሚተረጎም
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: ‘ጌታ’ የክብር ጥሪውንና ሊኖር የሚችለውን ክርስቶሳዊ አንድምታ ይጠብቃል፤ ከአውዱ በላይ የሆነ የእምነት ውሳኔም አያስገባም።
- issue: πάντας የሚለው አጠቃላይ ወንድ ብዙ ቁጥር
  choice: ለሁሉም
  alternative: ለሰዎች ሁሉ
  rationale: በአውዱ ‘እኛን’ ከሰፊው አድማጭ ጋር ያነጻጽራል፤ ‘ለሁሉም’ የግሪኩን አጠቃላይና አካታች ማጣቀሻ ያለ ወንድ-ብቻ ገደብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የግሪኩ የቃል ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል፤ ‘ለሁሉም’ ግልጽ ስለሆነ የግርጌ ማስታወሻ አላስፈለገም።
