  choice: ማንኛውም ዓይነት ስግብግብነት
  alternative: ሁሉም መጎምጀት
  rationale: ቃሉ የሌላውን ንብረት ብቻ መመኘትን ሳይሆን የበለጠ ለማግኘት ያለን ሰፊ ገንዘብና ንብረት ወዳድነት ሊያመለክት ይችላል፤ ስለዚህ ስግብግብነት የትርጉም ስፋቱን በተሻለ ይጠብቃል።
- issue: ሕይወትና ንብረት ብዛት ያላቸው ግንኙነት
  choice: ሕይወት ብዙ ንብረት በመኖሩ አይገኝም
  alternative: ሕይወት ከንብረቱ ብዛት አይመጣም
  rationale: ጽሑፉ ሕይወት በብዛት ንብረት የተዋቀረ ወይም የተመሠረተ እንዳልሆነ ይናገራል፤ “አይገኝም” ይህን ግንኙነት ሳይጨምር ያስተላልፋል።
