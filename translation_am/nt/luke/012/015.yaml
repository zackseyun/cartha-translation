  rationale: τινὶ እና αὐτοῦ ነጠላ ቁጥር ቢሆኑም አባባሉ ማንኛውንም ሰው የሚመለከት ነው። “የሰው ሕይወት” ይህን ጠቅላላ ኃይል ያለ ፆታዊ ገደብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
