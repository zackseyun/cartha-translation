- source_word: ἀπὸ πάσης πλεονεξίας
  choice: ከማንኛውም ዓይነት ስግብግብነት
  rationale: πλεονεξία ያለውን ከመጠን በላይ የማግኘትና የመያዝ ምኞት ስግብግብነት በሰፊው ይገልጣል፤ πάσης ደግሞ የማስጠንቀቂያውን ሁሉን አቀፍ ስፋት ያሳያል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ከማስጠንቀቂያው ቀጥሎ የተሰጠውን ምክንያት በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: የሰው ሕይወት ብዙ ንብረት በመኖሩ አይገኝም
  rationale: የግሪኩን አሉታዊ አባባል በተፈጥሯዊ አማርኛ ያቀርባል፤ ሕይወት በንብረት ብዛት ላይ እንደማይመሠረት ይገልጣል።
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: ብዙ ንብረት በመኖሩ
  rationale: ὑπάρχοντα በዚህ አውድ የሰውን ንብረት ወይም ያለውን ነገር ያመለክታል፤ አገላለጹ ከπερισσεύειν ጋር በመያያዝ የንብረትን ብዛት በግልጽ ያቀርባል።
theological_decisions:
- issue: የጠቅላላ ሰው አመልካች አገላለጽ
