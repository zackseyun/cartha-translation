  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: am
  text: ከዚያም እንዲህ አላቸው፦ “ተጠንቀቁ፤ ከማንኛውም ዓይነት ስግብግብነት[a] ራሳችሁን ጠብቁ፤ ምክንያቱም የማንም ሰው ሕይወት ከንብረቱ ብዛት አይመሠረትም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከማንኛውም ዓይነት መጎምጀት።” የግሪኩ ቃል πλεονεξία ስግብግብነትን፣ መጎምጀትን ወይም የበለጠ ለማግኘት ያለን ምኞት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
