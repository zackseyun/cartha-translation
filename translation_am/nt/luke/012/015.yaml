  choice: ተጠንቀቁ
  rationale: የብዙ ቁጥር ትእዛዝ ሲሆን የማስጠንቀቂያውን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: φυλάσσεσθε
  choice: ራሳችሁን ጠብቁ
