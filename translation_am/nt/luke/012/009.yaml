  rationale: ጽሑፉ ከቀደመው ንግግር ጋር ያለውን ተቃርኖ በ«ነገር ግን» ያሳያል። በአንቀጽ የተደገፈው የአኦሪስት ተሳቢ አጠቃላይ መርሕን ስለሚገልጥ «የሚክድ» ተብሎ በተፈጥሯዊ የአማርኛ አነጋገር ተተርጉሟል፤ «እኔን»ም በግልጽ ተጠብቋል።
