lexical_decisions:
- source_word: διελογίζετο
  choice: ያሰላስል ነበር
  rationale: የግሱ ያልተፈጸመ የቆይታ ገጽታና ውስጣዊ ምክክርን የሚያመለክተው ኃይል በተፈጥሯዊ አማርኛ ይጠበቃል።
- source_word: ἐν ἑαυτῷ
  choice: በልቡ
  rationale: ንግግሩ በውስጡ የተደረገ ሐሳብ መሆኑን በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγων
  choice: እያለ
  rationale: የውስጣዊውን ሐሳብ ይዘት የሚያስገባውን የግሪክ አሳታፊ ግስ ይወክላል።
- source_word: Τί ποιήσω
  choice: ምን ላድርግ?
  rationale: የምክክር ጥያቄውን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὅτι οὐκ ἔχω ποῦ
  choice: የምሰበስብበት ቦታ ስለሌለኝ
  rationale: ምክንያታዊውን ὅτι እና ‘ቦታ የለኝም’ የሚለውን ፈሊጣዊ ትርጉም ግልጽ አድርጎ ያስተላልፋል።
- source_word: συνάξω
  choice: የምሰበስብበት
  rationale: የግሱን ‘ሰብስቦ ማኖር’ መሠረታዊ ትርጉም ይጠብቃል፤ የማከማቸት ሐሳቡም ከዐውደ ንባቡ ይገባል።
- source_word: τοὺς καρπούς μου
  choice: ሰብሌን
  rationale: በዚህ የግብርና ዐውድ καρποί የእርሻ ምርትን ያመለክታል፤ ‘ሰብሌን’ ግልጽና ተፈጥሯዊ ሲሆን ‘ፍሬዎቼን’ የሚለውን ጠባብ ግንዛቤ ያስወግዳል።
