  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረዥም የንጽጽር አወቃቀር በተፈጥሯዊ የአማርኛ ቅደም ተከተል ቀርቧል፤ «መቼ» የሚለው የጊዜውን አለመታወቅ ጠብቋል።
