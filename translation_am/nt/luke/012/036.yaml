  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: am
  text: እናንተም ጌታቸው ከሰርግ መቼ እንደሚመለስ የሚጠባበቁ፣ መጥቶም ሲያንኳኳ ወዲያው የሚከፍቱለት ሰዎችን ምሰሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν κύριον ἑαυτῶν
  choice: ጌታቸው
  rationale: κύριος በዚህ የቤት ጌታን ወይም የአገልጋዮችን ጌታ ያመለክታል፤ «ጌታቸው» የቃሉን ክብርና የባለሥልጣንነት ግንኙነት ይጠብቃል።
- source_word: προσδεχομένοις
  choice: የሚጠባበቁ
  rationale: ቃሉ በጉጉትና በዝግጁነት መጠበቅን ያመለክታል፤ «የሚጠባበቁ» ይህን ንቁ ጥበቃ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀναλύσῃ ἐκ τῶν γάμων
  choice: ከሰርግ … እንደሚመለስ
  rationale: ἀναλύω በዚህ አውድ ከቦታ ተነሥቶ መመለስን ያመለክታል፤ γάμοι የሰርግ በዓልንም ሊያመለክት ቢችል «ከሰርግ» በአማርኛ ተፈጥሯዊና የምንጩን ስፋት የሚጠብቅ ነው።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: የድርጊቱን ፈጣንነትና ዝግጁነት በግልጽ ያስተላልፋል።
theological_decisions:
- issue: κύριος እንደ «ጌታ» ወይም «ባለቤት» መተርጎም
  choice: ጌታቸው
  alternative: ባለቤታቸው
  rationale: ታሪካዊው ምሳሌ የቤት ጌታን ሲያመለክትም፣ «ጌታ» የግሪኩን κύριος መደበኛ ክብርና በምሳሌው ያለውን ሰፊ ነገረ መለኮታዊ ጥላ ሳይገድብ ይጠብቃል።
