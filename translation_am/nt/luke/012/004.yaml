  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: am
  text: ነገር ግን ለእናንተ፣ ወዳጆቼ፣ እላለሁ፤ አካልን የሚገድሉትንና ከዚያ በኋላ ከዚህ የበለጠ ምንም ማድረግ የማይችሉትን አትፍሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አካልን የሚገድሉትንና ከዚያ በኋላ ተጨማሪ ምንም ማድረግ የማይችሉትን አትፍሩ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: ነገር ግን … እላለሁ
  rationale: δέ በዚህ ስፍራ ቀላል የንግግር ሽግግርን ወይም ንፅፅርን ያመለክታል፤ ይህ አተረጓጎም ንፅፅሩን ሳያጋንን በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: ወዳጆቼ ለሆናችሁ ለእናንተ
  rationale: የዳቲቭ ሐረጉ ተደራራቢ ማብራሪያ ነው፤ ኢየሱስ ተናጋሪዎቹን ‘ወዳጆቼ’ ብሎ መጥራቱንና ‘ለእናንተ’ የሚለውን ተውላጠ ስም ሁለቱንም ይጠብቃል።
- source_word: μὴ φοβηθῆτε
  choice: አትፍሩ
  rationale: μή ከአኦሪስት ሳብጀንክቲቭ ጋር ክልከላን ይገልጣል፤ ‘አትፍሩ’ አጭር፣ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἀπὸ τῶν ἀποκτεινόντων
  choice: የሚገድሉትን
  rationale: ἀπό ከφοβέομαι ጋር የፍርሃቱን ምንጭ ወይም ዒላማ ያመለክታል፤ የአሁን ጊዜ አጋኝ ግስ በአጠቃላይ ‘የሚገድሉት’ ተብሎ ተተርጉሟል።
- source_word: τὸ σῶμα
  choice: ሥጋን
  rationale: σῶμα እዚህ ላይ ሥጋዊውን አካል ያመለክታል፤ ‘ሥጋ’ በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና ለአንባቢዎች ግልጽ ነው።
- source_word: καὶ μετὰ ταῦτα
  choice: ከዚያም በኋላ
  rationale: ሐረጉ ጊዜያዊ ቅደም ተከተልን ያሳያል፤ ትርጉሙም ከሥጋ መገደል በኋላ ያለውን ደረጃ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: ከዚህ የበለጠ ምንም ማድረግ የማይችሉትን
  rationale: περισσότερόν τι ‘ከዚህ የበለጠ ማንኛውንም ነገር’ የሚለውን ሐሳብ ይይዛል፤ አተረጓጎሙ ከሥጋ ግድያ በኋላ ያላቸውን ውስንነት ግልጽ ያደርጋል።
theological_decisions:
- issue: ከሥጋዊ ሞት በኋላ ያለው የሰው ኃይል ወሰን
  choice: ጥቅሱ ሰዎች ሥጋን ሊገድሉ ቢችሉም ከዚያ በላይ ምንም ማድረግ እንደማይችሉ ብቻ ይናገራል።
  alternative: ‘ነፍስን ሊገድሉ አይችሉም’ የሚል ገላጭ ሐረግ መጨመር።
  rationale: ቀጣዩ ጥቅስ የሰውን ውስንነት ከእግዚአብሔር ሥልጣን ጋር ቢያነፃፅርም፣ ይህ ጥቅስ ራሱ ‘ነፍስ’ ብሎ አይጠቅስም። ስለዚህ ትርጉሙ የቀጣዩን ጥቅስ ሐሳብ አስቀድሞ ሳያስገባ የምንጩን የሥነ መለኮት ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ወዳጆቼ ለሆናችሁ ለእናንተ’ የምንጩን ተውላጠ ስምና የፍቅር አጠራር በአንድነት ይጠብቃል።
