base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: am
  text: የዚያ ባሪያ ጌታ እርሱ በማይጠብቀው ቀንና በማያውቀው ሰዓት ይመጣል፤ በቁራጭ ቁራጭም ይቆርጠዋል[a]፣ ከታማኝ ካልሆኑትም[b] ጋር ይመድበዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሁለት ይቆርጠዋል።” አንዳንዶች ይህን አገላለጽ “ክፉኛ ይቀጣዋል” የሚል ፈሊጣዊ ንግግር አድርገው ይረዱታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከማያምኑት።”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: በምሳሌው የጌታና የባሪያ ግንኙነትን በተፈጥሮ ያሳያል፤ እዚህ በቀጥታ እንደ መለኮታዊ ማዕረግ አልተወሰደም።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: በቤት አስተዳደር ምሳሌው ውስጥ ያለውን የባለቤትነትና የበታችነት ግንኙነት ከ‘አገልጋይ’ ይልቅ በግልጽ ያስተላልፋል።
- source_word: ἥξει
  choice: ይመጣል
  rationale: የጌታውን መድረስ በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጻል።
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: እርሱ በማይጠብቀው ቀን
  rationale: προσδοκάω የመጠበቅን ወይም የመጠባበቅን ሐሳብ ይይዛል፤ ከዐውዱ የሚጠበቀው የጌታው መምጣት ነው።
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: በማያውቀው ሰዓት
  rationale: γινώσκω እዚህ ‘ማወቅ’ ስለሆነ፣ ከቀደመው ‘መጠበቅ’ ጋር ያለው የቃላት ልዩነት ተጠብቋል።
- source_word: διχοτομήσει
  choice: ለሁለት ይቆርጠዋል
  rationale: ግሱ በቀጥታ ‘ለሁለት መቁረጥ’ ማለት ነው፤ የፍርዱን ከባድ ምስል በዋናው ጽሑፍ ይጠብቃል።
- source_word: τὸ μέρος αὐτοῦ
  choice: ድርሻውን
  rationale: μέρος ክፍልን፣ ድርሻን ወይም ዕጣን ሊያመለክት ይችላል፤ ‘ድርሻውን’ የተመደበለትን ዕጣ በተገቢ ሁኔታ ያሳያል።
- source_word: ἀπίστων
  choice: ከታማኝ ካልሆኑት
  rationale: ምሳሌው በጌታው ፊት ታማኝ ስላልሆነ ባሪያ ስለሚናገር፣ ይህ አተረጓጎም የቅርብ ዐውዱን ይከተላል፤ ‘ከማያምኑት’ የሚለው ሌላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: θήσει
  choice: ያደርጋል
  rationale: ከ‘ድርሻውን’ ጋር ተያይዞ አንድን ሰው በተወሰነ ዕጣ ወይም ምድብ ውስጥ ማኖርን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የδιχοτομήσειን የቅጣት ምስል ቃል በቃል መግለጽ ወይስ እንደ ፈሊጣዊ ከባድ ቅጣት መተርጎም
  choice: ‘ለሁለት ይቆርጠዋል’ የሚለውን ቀጥተኛ ምስል በዋናው ጽሑፍ ማቆየት
