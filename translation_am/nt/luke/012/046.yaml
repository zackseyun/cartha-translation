  rationale: የግሪኩ ቃል ከባድ የፍርድ ምስል ይዟል፤ ጽሑፉ በግልጽ እስካላስገደደ ድረስ ምስሉን ማለዘብ አይገባም። ፈሊጣዊው ግንዛቤ በማስታወሻ ቀርቧል።
- issue: ἀπίστωνን እንደ ‘ታማኝ ያልሆኑ’ ወይም ‘የማያምኑ’ መተርጎም
  choice: በዋናው ጽሑፍ ‘ከታማኝ ካልሆኑት’ ማለት
  alternative: ‘ከማያምኑት’ ማለት
  rationale: የቤት ባሪያው ታማኝነት የምሳሌው ቅርብ ጉዳይ ነው፤ ሆኖም ቃሉ አለማመንንም ሊያመለክት ስለሚችል ይህ የሥነ መለኮት ውጥረት በማስታወሻ ተጠብቋል።
