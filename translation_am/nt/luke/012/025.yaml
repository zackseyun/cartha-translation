  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: am
  text: ከእናንተ መካከል በመጨነቅ በዕድሜው ላይ አንድ ክንድ መጨመር የሚችል ማን ነው?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዕድሜው”፦ የግሪክ ቃሉ “ቁመቱ” ተብሎም ሊተረጎም ይችላል።
    reason: የἡλικία እውነተኛ የቃላት አሻሚነትን ለመጠበቅ።
lexical_decisions:
- source_word: μεριμνῶν
  choice: መጨነቁ
  rationale: የግሪክ ቃሉን ‘በመጨነቅ’ የሚለውን ሐሳብ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἡλικίαν
  choice: ዕድሜው
  rationale: ἡλικία ዕድሜን ወይም ቁመትን ሊያመለክት ይችላል፤ ከ‘ክንድ’ ጋር ያለው ምሳሌያዊ ጥምረትና አውዱ እዚህ ‘ዕድሜ’ የሚለውን ምርጫ ይደግፋሉ።
- source_word: πῆχυν
  choice: አንድ ክንድ
  rationale: የጥንቱን የርዝመት መለኪያ በቀጥታ ይጠብቃል፤ በዕድሜ ላይ ሲውል የምሳሌያዊውን አነጋገር ኃይል ያስቀራል።
- source_word: προσθεῖναι
  choice: ሊጨምር
  rationale: ‘መጨመር’ የሚለውን ቀጥተኛ ትርጉም ያቀርባል።
theological_decisions:
- issue: ἡλικία የሚያመለክተው ዕድሜ ወይስ ቁመት
  choice: ዕድሜው
  alternative: ቁመቱ
  rationale: በዙሪያው ያለው ስለ ሕይወትና ጭንቀት የሚናገረው አውድ ‘ዕድሜ’ን ይደግፋል፤ ሆኖም የቃሉ ሌላ ትርጉም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ፤ የግሪኩ የጥያቄ አወቃቀርና የ‘አንድ ክንድ’ ምስል ተጠብቀዋል።
