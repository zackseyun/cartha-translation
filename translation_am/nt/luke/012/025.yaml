  source_fidelity: The draft correctly conveys the rhetorical question, the means expressed by μεριμνῶν ('by worrying'), the ability expressed by δύναται, and preserves the deliberately striking 'one cubit' image. Rendering ἡλικία as 'age/lifespan' is contextually well supported, while the footnote appropriately retains the viable 'stature' sense.
