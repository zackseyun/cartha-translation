  rationale: ለኢየሱስ የተነገረ መሆኑ በግሱ የተያያዘው «-ው» ተውላጠ ስም ተጠብቋል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የጥሪ ቅርጹን በክብር የሚያቀርብና የአስተማሪነትን ቀጥተኛ ትርጉም የሚጠብቅ ነው።
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: ወንድሜን ... ንገረው
  rationale: εἰπὲ በዚህ አውድ ኢየሱስ ለወንድሙ እንዲናገር የቀረበ ጥያቄ ነው፤ «ንገረው» ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: μερίσασθαι μετ’ ἐμοῦ
  choice: ከእኔ ጋር እንዲካፈል
  rationale: መካፈልን ወይም ድርሻ ማድረግን የሚያመለክተውን መካከለኛ ግስ እና μετά የሚገልጠውን አብሮነት ይጠብቃል።
- source_word: τὴν κληρονομίαν
  choice: ርስቱን
  rationale: በቤተሰብ የሚወረስ ንብረትን በሰፊና ተፈጥሯዊ ቃል ይገልጣል፤ የሕግ ሁኔታውን ከምንጩ በላይ አይወስንም።
