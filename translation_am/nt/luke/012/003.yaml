base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: am
  text: ስለዚህ፣ በጨለማ የተናገራችሁት ሁሉ በብርሃን ይሰማል፤ በውስጥ ክፍሎችም በጆሮ የተናገራችሁት በቤቶች ጣሪያዎች ላይ[a] ይታወጃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከቤቶች ጣሪያዎች ላይ።” ምስሉ የሚያመለክተው በጠፍጣፋ የቤት ጣሪያዎች ላይ ሆኖ በይፋ ማወጅን ነው።
    reason: lexical_alternative
lexical_decisions:
