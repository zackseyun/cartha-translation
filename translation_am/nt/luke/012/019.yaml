source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: am
  text: እኔም ነፍሴን[a]፣ ‘ነፍሴ ሆይ፣ ለብዙ ዓመታት የተከማቹ ብዙ መልካም ነገሮች አሉሽ፤ ዕረፊ፣ ብዪ፣ ጠጪ፣ ደስ ይበልሽ’ እላታለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ነፍስ” የተተረጎመው የግሪክ ቃል ψυχή እንደ አውዱ “ራስ” ወይም “ሕይወት” ማለትም ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: እላታለሁ
  rationale: የወደፊት ጊዜ ንግግርን በተፈጥሯዊ አማርኛ ይገልጣል፤ የተሳቢዋም ጾታ ከ‘ነፍስ’ ጋር ይስማማል።
- source_word: ψυχῇ / Ψυχή
  choice: ነፍሴን / ነፍሴ ሆይ
  rationale: ሰውየው ለውስጣዊ ማንነቱ የሚናገረውን ራስን የመጥራት ኃይል ይጠብቃል፤ ψυχή እዚህ ቴክኒካዊ የሰው ተፈጥሮ ትምህርት ሳይሆን ሰፊ ትርጉም አለው።
- source_word: ἀγαθὰ
  choice: መልካም ነገር
  rationale: በአውዱ የተከማቹ ቁሳዊ ሀብቶችን ሲያመለክትም የግሪኩን ሰፊ ቃላዊ ትርጉም ይጠብቃል።
- source_word: κείμενα
  choice: የተከማቸ
  rationale: በአውዱ ለወደፊት ጥቅም ተቀምጦ ያለን ሀብት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς ἔτη πολλά
  choice: ለብዙ ዓመታት
  rationale: ወደፊት የሚዘልቀውን የጊዜ መጠን በግልጽ ሁኔታ ያሳያል።
- source_word: ἀναπαύου
  choice: ዕረፊ
  rationale: የመዝናናትንና ከጥረት የመቆምን ትእዛዝ በአጭርና ቀጥተኛ መንገድ ያቀርባል።
- source_word: φάγε
  choice: ብዪ
  rationale: ቀጥተኛውን ትእዛዝ ይጠብቃል፤ ከ‘ነፍስ’ ጋር በጾታ ይስማማል።
- source_word: πίε
  choice: ጠጪ
  rationale: ቀጥተኛውን ትእዛዝ ይጠብቃል፤ ከ‘ነፍስ’ ጋር በጾታ ይስማማል።
- source_word: εὐφραίνου
  choice: ደስ ይበልሽ
  rationale: የመደሰትንና በተድላ የመኖርን ሐሳብ በዘመናዊና ክብር ባለው አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በራስ ለራስ ንግግር ውስጥ ψυχήን መተርጎም
  choice: ነፍስ
  alternative: ራስ / ሕይወት
  rationale: ጥቅሱ ስለ ሰው ክፍሎች ቴክኒካዊ ትምህርት አይሰጥም፤ ሰውየው ራሱን ሲያነጋግር ያሳያል። ‘ነፍስ’ የግሪኩን ምስላዊና ሥነ ጽሑፋዊ ኃይል ይጠብቃል፣ አማራጭ ትርጉሞቹም በማስታወሻ ተጠቅሰዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የነፍስ ሴታዊ ሰዋሰዋዊ ጾታ በተሳቢና በትእዛዝ ቅርጾች ሁሉ በወጥነት ተጠብቋል።
