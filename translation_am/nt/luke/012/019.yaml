  terminology: ነፍስ appropriately preserves ψυχή in this rhetorical self-address without imposing a technical theological sense. “ደስ ይበልሽ” is a suitable modern-standard rendering of εὐφραίνου. The note responsibly preserves the contextual alternatives “ራስ” and “ሕይወት.”
