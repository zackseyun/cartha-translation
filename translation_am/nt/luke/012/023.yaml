  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: am
  text: ሕይወት[a] ከምግብ ይበልጣልና፣ ሰውነትም ከልብስ ይበልጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍስ።” የግሪኩ ψυχή “ሕይወት፣” “ራስ” ወይም “ነፍስ” ማለት ሊሆን ይችላል፤ እዚህ ግን አውዱ “ሕይወት” የሚለውን ትርጉም ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ትእዛዝ ጋር ያለውን የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ψυχή
  choice: ሕይወት
  rationale: ስለ መብላትና ስለ ዕለታዊ ፍላጎት በሚናገረው አውድ ψυχή የሰውን ሕይወት ያመለክታል፤ የማይዳሰሰውን ነፍስ ብቻ እንደሚያመለክት አያደርገውም።
- source_word: πλεῖόν
  choice: ይበልጣል
  rationale: ከገንዘብ ወይም ከመጠን በላይ የዋጋና የአስፈላጊነት ንጽጽርን ሳያጠብ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τροφή
  choice: ምግብ
  rationale: በዚህ አውድ ግልጽና የተለመደው ትርጉም ነው።
- source_word: σῶμα
  choice: ሰውነት
  rationale: ከልብስ ጋር የተነጻጸረውን አካላዊ ሰውነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔνδυμα
  choice: ልብስ
  rationale: ሰውነትን የሚሸፍነውን ነገር በቀላልና በዘመናዊ ቋንቋ ይገልጻል።
theological_decisions:
- issue: ስለ ጭንቀትና ስለ አስፈላጊ ፍላጎቶች በሚሰጠው ትምህርት ውስጥ የψυχή ትርጉም
  choice: ሕይወት
  alternative: ነፍስ
  rationale: ጥቅሱ ψυχήን ከምግብ፣ σῶμαንም ከልብስ ጋር ስለሚያነጻጽር ዋና ትኩረቱ ምድራዊ ሕይወትና አካላዊ ኑሮ ነው። ይህ አተረጓጎም ψυχή በሌሎች አውዶች ‘ነፍስ’ ሊሆን እንደሚችል አይክድም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ትይዩ ንጽጽሮች በሁለቱም ክፍሎች ‘ይበልጣል’ በማለት በግልጽ ተጠብቀዋል።
