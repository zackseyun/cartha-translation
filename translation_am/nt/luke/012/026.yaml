id: LUK.12.26
reference: Luke 12:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: am
  text: እንግዲህ ከሁሉ ትንሹን ነገር እንኳ ማድረግ ካልቻላችሁ፣ ስለ ቀሩት ነገሮች ለምን ትጨነቃላችሁ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: እንግዲህ ... ካልቻላችሁ
  rationale: የεἰን ሁኔታዊ ኃይልና የοὖνን ከቀደመው ሐሳብ የሚያስከትል አመክንዮ በተፈጥሯዊ የአማርኛ አገባብ ያቆያል።
- source_word: οὐδὲ ἐλάχιστον
  choice: ከሁሉ ትንሹን ነገር እንኳ
  rationale: ἐλάχιστον በስም ተግባር የቆመ ገለልተኛ ቅጽ ስለሆነ፣ በአማርኛ ግልጽ እንዲሆን ‘ነገር’ ተጨምሯል፤ οὐδέ የሚሰጠውን ‘እንኳ’ የማጠናከሪያ ኃይልም ይጠብቃል።
- source_word: δύνασθε
  choice: ማድረግ ካልቻላችሁ
  rationale: የችሎታን ወይም የብቃትን ሐሳብ በተፈጥሯዊ የአማርኛ ሁኔታዊ አገባብ ይገልጣል።
- source_word: τί
  choice: ለምን
  rationale: በዚህ የንግግር አውድ τί የምክንያት ጥያቄ ሆኖ የተጠቀሰ ስለሆነ ‘ለምን’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: περὶ τῶν λοιπῶν
  choice: ስለ ቀሩት ነገሮች
  rationale: λοιπῶν ከተጠቀሰው ‘ትንሹ ነገር’ በተጨማሪ ያሉትን ቀሪ ጉዳዮች ያመለክታል።
- source_word: μεριμνᾶτε
  choice: ትጨነቃላችሁ
  rationale: በሉቃስ 12 አውድ የቀጠለ ጭንቀትን ወይም መጨነቅን ያመለክታል፤ በዘመናዊ አማርኛም ግልጽና ክብር ያለው አገላለጽ ነው።
theological_decisions:
- issue: በእግዚአብሔር መታመንን በሚያስተምረው ንግግር ውስጥ μεριμνάω እንዴት እንደሚተረጎም
  choice: ትጨነቃላችሁ
  alternative: ትጠባበቃላችሁ / ታስባላችሁ
  rationale: ንግግሩ ማንኛውንም ጥንቃቄ ወይም ኃላፊነት ከመከልከል ይልቅ ያልተገባ ጭንቀትን ያነጣጠረ ነው። ‘ትጨነቃላችሁ’ ይህን ልዩነት ሳይፈታው በትክክል ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ሁኔታዊ አመክንዮ በአማርኛው ‘ካልቻላችሁ’ ቅርጽ ተጠብቋል። የእንግሊዝኛው ማስታወሻ የሚያቀርበው ‘the remaining things’ ትርጉም በዋናው ጽሑፍ ‘ቀሩት ነገሮች’ ተብሎ በቀጥታ ስለተካተተ የተለየ የግርጌ ማስታወሻ አላስፈለገም።
