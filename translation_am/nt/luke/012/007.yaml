review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the adversative and intensifying opening, the complete counting of the hairs, the prohibition against fear, and the comparison with many sparrows. However, the Greek subject αἱ τρίχες ... πᾶσαι is plural, while the Amharic predicate ተቆጥሯል is singular. Revising both noun and verb to plural preserves the source’s explicit distributive sense.
  naturalness: The wording is otherwise clear, dignified, and natural in modern standard Amharic. የራሳችሁ ፀጉሮች ሁሉ ተቆጥረዋል is idiomatic and removes the number-agreement problem.
  terminology: ድንቢጦች appropriately maintains the contextual referent of στρουθία. ዋጋ አላችሁ clearly expresses the contextual comparative-value force of διαφέρετε without imposing further theological claims.
  issues:
  - severity: medium
    issue: Number disagreement in the first clause
    rationale: ፀጉር is presented with ሁሉ as the rendering of the Greek plural αἱ τρίχες ... πᾶσαι, but ተቆጥሯል is singular. The translation should use a plural noun and plural perfect passive predicate.
  - severity: low
    issue: Footnote a is not a close lexical alternative to the stated wording
    rationale: “በቁጥር ታውቋል” shifts from counting to knowing and is singular. A passive alternative retaining the counting/registering sense better corresponds to ἠρίθμηνται.
  revised_text: ነገር ግን የራሳችሁ ፀጉሮች ሁሉ እንኳ ተቆጥረዋል[a]። አትፍሩ፤ ከብዙ ድንቢጦች ይልቅ ዋጋ አላችሁ[b]።
