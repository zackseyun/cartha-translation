  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: am
  text: ነገር ግን የምጠመቅበት ጥምቀት አለኝ፤[a][b] እስኪፈጸም ድረስ እንዴት ተጨንቄአለሁ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የምጠመቅበት ጥምቀት አለኝ።” የግሪኩ አገላለጽ የ«ጥምቀት/መጠመቅ» ምስልን በድግግሞሽ ግልጽ ያደርጋል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ጥምቀት” ዘይቤያዊ ነው፤ ኢየሱስ በቅርቡ የሚቀበለውን እጅግ ከባድ መከራ ያመለክታል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “እንዴት ተገድቤአለሁ!” ወይም “እንዴት በግፊት ሥር ነኝ!”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ጥምቀት
  rationale: የግሪኩን የመጠመቅ ምስል በግልጽ ያቆያል፤ ቃሉ በዚህ አውድ ዘይቤያዊ ቢሆንም ‘መከራ’ ብሎ በትርጓሜ አልተተካም።
- source_word: ἔχω βαπτισθῆναι
  choice: የምጠመቅበት ጥምቀት አለኝ
  rationale: የἔχω ከኢንፊኒቲቭ ጋር ያለውን ወደፊት የሚጠብቅ ግዴታ ወይም አስፈላጊነት በተፈጥሯዊ አማርኛ ያሳያል፤ የ‘ጥምቀት/መጠመቅ’ ድግግሞሽንም ይጠብቃል።
- source_word: πῶς
  choice: እንዴት
  rationale: የስሜቱን ከፍተኛነት የሚገልጽ አጋኖአዊ አጠቃቀም ነው።
- source_word: συνέχομαι
  choice: ተጨንቄአለሁ
  rationale: መጫንን፣ መገደብን ወይም ውስጣዊ ጭንቀትን ሊያመለክት የሚችለውን ቃል በዘመናዊና ለሁሉ በሚገባ አማርኛ ይገልጻል፤ ሌሎቹ ጥላዎች በማስታወሻ ተጠብቀዋል።
- source_word: ἕως ὅτου
  choice: እስኪ… ድረስ
  rationale: የጭንቀቱን ጊዜያዊ መድረሻ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τελεσθῇ
  choice: እስኪፈጸም
  rationale: አንድ ነገር ወደታሰበለት ፍጻሜ መድረሱን ያሳያል፤ ከሌላ የወንጌል ንባብ የተለየ ቃል በማስገባት አያብራራውም።
theological_decisions:
- issue: ‘ጥምቀት’ የሚያመለክተው ዘይቤያዊ ፍቺ
  choice: ኢየሱስ ሊመጣበት ስላለው መከራና ሞት በዘይቤ ይናገራል፤ በዋናው ጽሑፍ ግን የጥምቀት ምስሉ ተጠብቋል።
  alternative: በአጠቃላይ የሚያጥለቀልቅ ፈተና ወይም ቃል በቃል የውሃ ጥምቀት።
  rationale: ቅርብ አውዱና የወንጌሉ አጠቃቀም ወደ ኢየሱስ መከራ የሚያመለክት መሆኑን ያሳያሉ፤ ሆኖም ዘይቤውን ‘መከራ’ በሚል ትርጓሜያዊ ቃል መተካት የጽሑፉን ሥነ ጽሑፋዊና ሥነ መለኮታዊ ውጥረት ያጠፋል።
- issue: συνέχομαι የሚያሳየው ስሜት
  choice: ከፍተኛ ጭንቀት
  alternative: መገደብ ወይም በግፊት ሥር መሆን
  rationale: ቃሉ እነዚህን ተያያዥ ጥላዎች ሊሸከም ይችላል። ዋናው ንባብ ለዘመናዊ አንባቢ ግልጽ የሆነውን የጭንቀት ፍቺ ይሰጣል፤ ሌሎቹን ግን በማስታወሻ ያቆያል።
