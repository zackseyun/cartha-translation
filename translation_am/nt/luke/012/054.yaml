source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: am
  text: ለሕዝቡም እንዲህ ይል ነበር፦ “ደመና በምዕራብ ሲነሣ ስታዩ፣ ወዲያውኑ ‘ዝናብ[a] ሊመጣ ነው’ ትላላችሁ፤ እንደዚያም ይሆናል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከባድ ዝናብ ሊመጣ ነው” ተብሎም ሊተረጎም ይችላል። ὄμβρος የሚለው የግሪክ ቃል በአጠቃላይ ዝናብን ወይም በተለይ ከባድ ዝናብን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ በትረካው ውስጥ ቀጣይ ወይም ተደጋጋሚ ንግግርን ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም ገጽታውን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ καὶ
  choice: ደግሞም
  rationale: የንግግሩን ቀጣይነትና ተጨማሪነት በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
- source_word: τοῖς ὄχλοις
  choice: ሕዝቡን
  rationale: ግሪኩ ብዙ ቁጥር ቢሆንም፣ በዚህ የንግግር አውድ ‘ሕዝቡ’ የተሰበሰቡትን ብዙ ሰዎች በተፈጥሯዊ ዘመናዊ አማርኛ ይወክላል።
- source_word: Ὅταν ἴδητε
  choice: ስታዩ
  rationale: በተደጋጋሚ ሁኔታ የሚፈጸም አጠቃላይ ሁኔታን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: νεφέλην
  choice: ደመና
  rationale: ቃሉ በመሠረቱ ‘ደመና’ ማለት ነው፤ የዝናብ ምልክትነቱን አውዱ ያብራራል።
- source_word: ἀνατέλλουσαν ἐπὶ δυσμῶν
  choice: በምዕራብ ... ሲወጣ
  rationale: ደመናው በምዕራብ አድማስ ሲነሣ የሚታየውን ምስል በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ከምዕራብ’ የሚለውም የምንጭ አቅጣጫ ትርጉም ይቻላል።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: የፈጣን ምላሽን ኃይል በዘመናዊና የተለመደ አማርኛ ይጠብቃል።
- source_word: Ὄμβρος
  choice: ዝናብ
  rationale: ቃሉ ዝናብን በአጠቃላይ ወይም ከባድ ዝናብን በተለይ ሊያመለክት ይችላል፤ ‘ዝናብ’ በዋናው ጽሑፍ ትርጉማዊ ስፋቱን ይጠብቃል።
- source_word: ἔρχεται
  choice: ሊመጣ ነው
  rationale: በቅርቡ የሚሆን መምጣትን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: καὶ γίνεται οὕτως
  choice: እንደዚያም ይሆናል
  rationale: ትንበያቸው እንደተናገሩት መፈጸሙን በቀጥታ ያስተላልፋል።
