    text: ወይም፣ “የሜዳ አበቦች” ወይም “አበቦች።” የግሪኩ ቃል በተለምዶ ሊሊ የሚባሉትን አበቦች ይጠቅሳል፤ ትክክለኛው ዝርያ ግን እርግጠኛ አይደለም።
