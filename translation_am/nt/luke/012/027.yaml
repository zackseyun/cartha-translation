  text: የሊሊ አበቦችን[a] እንዴት እንደሚያድጉ ልብ ብላችሁ ተመልከቱ፤ አይደክሙም፣ ክርም አይፈትሉም። ነገር ግን እላችኋለሁ፤ ሰሎሞን እንኳ በክብሩ[b] ሁሉ ከእነዚህ አንዱን እንኳ አልለበሰም።
  philosophy: optimal-equivalence
  footnotes:
