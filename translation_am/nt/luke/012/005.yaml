  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: am
  text: ነገር ግን ማንን መፍራት እንዳለባችሁ አሳያችኋለሁ፤ ከገደለ በኋላ ወደ ጌሄና[a] ለመጣል ሥልጣን ያለውን ፍሩ። አዎን፣ እላችኋለሁ፤ ይህንን ፍሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገሃነም።” የግሪኩ ቃል ጌሄና ሲሆን፣ ከሂኖም ሸለቆ ምስል የመነጨ የፍርድ ቃል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: አሳያችኋለሁ
  rationale: የወደፊት ጊዜውንና ኢየሱስ ሊያመለክታቸው መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘አስጠነቅቃችኋለሁ’ የማይገኘውን ትርጓሜ ይጨምራል።
- source_word: τίνα φοβηθῆτε
  choice: ማንን መፍራት እንዳለባችሁ
  rationale: ቀጥተኛ ያልሆነውን ጥያቄ በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: φοβήθητε
  choice: ፍሩ
  rationale: የትእዛዙን ኃይልና በቁጥሩ ውስጥ ያለውን ድግግሞሽ ይጠብቃል፤ ‘አክብሩ’ በዚህ የፍርድ አውድ ደካማ ነው።
- source_word: τὸν
  choice: ያለውን
  rationale: በግሪኩ ስም ሆኖ የተጠቀሰውን መስተዋድድ ከተከታዩ ገላጭ ሐረግ ጋር በተፈጥሯዊ አማርኛ ያስተሳስራል።
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: ከገደለ በኋላ
  rationale: ድርጊቶቹ በጊዜ ቅደም ተከተል መከናወናቸውን በግልጽ ይጠብቃል፤ የገዳዩም ማንነት በጽሑፉ ከተገለጠው በላይ አይወሰንም።
- source_word: ἔχοντα ἐξουσίαν
  choice: ሥልጣን ያለውን
  rationale: ἐξουσία ጥሬ ኃይልን ብቻ ሳይሆን ሥልጣንንና መብትን ስለሚያመለክት ‘ሥልጣን’ ተገቢ ነው።
- source_word: ἐμβαλεῖν εἰς
  choice: ወደ … ለመጣል
  rationale: የግሪኩን ንቁ እና ኃይለኛ የመጣል ምስል በዘመናዊ አማርኛ ይጠብቃል።
- source_word: γέενναν
  choice: ጌሄና
  rationale: የግሪኩን የቦታ ስምና ከሂኖም ሸለቆ ጋር ያለውን ታሪካዊ የፍርድ ምስል ለመጠበቅ በድምፅ ተቀራራቢ መልኩ ተጽፏል፤ የተለመደው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ναί
  choice: አዎን
  rationale: የማረጋገጫውንና የአጽንኦቱን ኃይል በቀላል ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοῦτον
  choice: ያንን
  rationale: የአመልካች ተውላጠ ስሙን አጽንኦት ከቀላሉ ‘እርሱን’ ይልቅ በተሻለ ይጠብቃል።
theological_decisions:
- issue: በፍርድ አውድ ውስጥ γέενναን መተርጎም
  choice: ጌሄና
  alternative: ገሃነም
  rationale: በኋላ የዳበሩ ሥነ መለኮታዊ ግንዛቤዎችን በዋናው ጽሑፍ ላይ ሳይጭን፣ የግሪኩን የቦታ ስምና የአይሁድን ታሪካዊ የፍርድ ምስል ይጠብቃል። ለአማርኛ አንባቢዎች የተለመደው ‘ገሃነም’ በማስታወሻ ተቀምጧል።
- issue: ሊገድልና ወደ ጌሄና ሊጥል የሚችለውን በስም መለየት
