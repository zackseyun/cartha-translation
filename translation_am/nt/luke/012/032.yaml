    rationale: Its proposed wording repeats the main imperative and then adds an unsupported explanation about a plural address. The Greek imperative is grammatically singular, addressed to the collective ‘flock’; the footnote should state the valid alternative ‘Do not be afraid’ rather than alter the referent.
