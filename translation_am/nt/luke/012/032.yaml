  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: am
  text: “ትንሹ መንጋ ሆይ፣ አትፍራ፤[a] አባታችሁ መንግሥቱን[b] ሊሰጣችሁ ደስ ብሎታልና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አትፍራ።”
    reason: lexical_alternative
  - marker: b
    text: “መንግሥት” የንጉሥነት አገዛዝንም ሆነ ለሕዝቡ የሚሰጠውን መንግሥት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: አትፍራ
  rationale: የግሪኩን ቀጥተኛ ክልከላ በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: τὸ μικρὸν ποίμνιον
  choice: አንተ ታናሽ መንጋ
  rationale: የበጎችን መንጋ የሚያመለክተውን የእረኝነት ምሳሌና የፍቅር ቃና ይጠብቃል፤ ነጠላ ጥሪውም መንጋውን እንደ አንድ ማኅበር ያነጋግራል።
- source_word: ὅτι
  choice: —ና
  rationale: ላለመፍራት የተሰጠውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ ቅጥያ ያሳያል።
- source_word: εὐδόκησεν
  choice: ወዷል
  rationale: የአብን በጎ ፈቃድና ደስታ ያሳያል፤ ነገር ግን ቴክኒካዊ የውሳኔ ትምህርትን አያስገባም።
- source_word: ὁ πατὴρ ὑμῶν
  choice: አባታችሁ
  rationale: በግሪኩ ያለውን ‘አባታችሁ’ ብቻ ይተረጉማል፤ ‘የሰማዩ’ የሚል በምንጩ የሌለ ቃል አይጨምርም።
- source_word: δοῦναι ὑμῖν
  choice: ሊሰጣችሁ
  rationale: የመስጠትን ቀላልና ቀጥተኛ ትርጉም ከብዙ ተቀባዮች ጋር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὴν βασιλείαν
  choice: መንግሥቱን
  rationale: የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ ቃሉ የንጉሣዊ አገዛዝንም ሆነ የመንግሥትን ዓለም ሊያመለክት የሚችለውን ስፋት አያጠብም።
theological_decisions:
- issue: የβασιλεία ትርጉም ስፋት
  choice: መንግሥቱን
  alternative: አገዛዙን
  rationale: ‘መንግሥት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ሲጠብቅ፣ የንጉሡን አገዛዝና ለሕዝቡ የሚሰጠውን መንግሥት ሁለቱንም እንዲያካትት ክፍት ይተዋል።
- issue: የεὐδόκησεν ግንኙነት ከመለኮታዊ ፈቃድ ጋር
  choice: ወዷል
  alternative: በቸርነቱ መርጧል
  rationale: የአብን በጎ ፈቃድና ተነሳሽነት ያሳያል፤ ‘መርጧል’ ወይም ‘ወስኗል’ ብሎ በምንጩ ላይ ያልተገለጸ ቴክኒካዊ የአስተምህሮ አቋም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የእረኝነት ምሳሌውና የማጽናኛ ቃናው ተጠብቀዋል።
