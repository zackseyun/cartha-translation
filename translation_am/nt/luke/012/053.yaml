  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: am
  text: ይከፋፈላሉ፤ አባት በወንድ ልጁ ላይ፣ ወንድ ልጅም በአባቱ ላይ፤ እናት በሴት ልጇ ላይ፣ ሴት ልጅም በእናቷ ላይ፤ አማት በምራቷ ላይ፣ ምራትም በአማቷ ላይ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ይከፋፈላሉ” የሚለው “እርስ በርሳቸው ይለያያሉ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ በአንድ ቡድን ወይም ቤተሰብ ውስጥ የሚፈጠርን መከፋፈል ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: ተከፋፍለው ይቆማሉ
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና በቤተሰብ ውስጥ የሚፈጠረውን መከፋፈል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ምክንያቱን አይጨምርም።
- source_word: ἐπὶ
  choice: በ…ላይ
  rationale: ከሰዎች ጋር በተደጋጋሚ በመጣው በዚህ አውድ ተቃውሞን ያመለክታል፤ ‘በ…ላይ’ የግሪኩን ቅርጽ ጠብቆ በአማርኛም የመቃወምን ሐሳብ ይሰጣል።
- source_word: πατήρ / υἱός
  choice: አባት / ልጅ
  rationale: የቤተሰብ ዝምድናውንና የእርስ በርስ ተቃርኖውን ይጠብቃል፤ በአማርኛ ‘ልጅ’ በዚህ ከ‘አባት’ ጋር በመጣው ተዛማጅ አገባብ ወንድ ልጅን በተፈጥሮ ያመለክታል።
- source_word: μήτηρ / θυγάτηρ
  choice: እናት / ሴት ልጅ
  rationale: የግሪኩን የሴት ልጅ ልዩ ምልክትና የተመላላሽ የቤተሰብ ጥንድ ይጠብቃል።
- source_word: πενθερά
  choice: አማት
  rationale: በአማርኛ ለmother-in-law የተለመደው የዝምድና ቃል ነው።
- source_word: νύμφη
  choice: ምራት
  rationale: ቃሉ በሌላ አውድ ‘ሙሽራ’ ሊሆን ቢችልም፣ እዚህ ከπενθερά ጋር ያለው ተመላላሽ ጥንድ daughter-in-law የሚለውን የዝምድና ትርጉም ይጠይቃል።
- source_word: αὐτῆς
  choice: ምራቷ
  rationale: በመጀመሪያው የአማትና ምራት ክፍል ያለውን ግልጽ ባለቤትነት ያስተላልፋል፤ በመጨረሻውም ተመላላሽ ዝምድናው በአማርኛ በተፈጥሮ ‘አማቷ’ ተብሎ ተገልጧል።
theological_decisions:
- issue: የተገለጸው መከፋፈል ባሕርይ
  choice: ከኢየሱስ ተልእኮ የሚመጣውን ማኅበራዊና ቤተሰባዊ ግጭት እንደሚገልጽ የሚያሳይ ግልጽ ነገር ግን ያልተለሳለሰ አተረጓጎም
  alternative: ስለ ተራ የቤተሰብ ውጥረት ብቻ የተነገረ አጠቃላይ ምሳሌ፣ ወይም ለቤተሰብ ጥላቻ የተሰጠ ትእዛዝ
  rationale: አውዱ ይህን ተቃርኖ ከቀደመው ስለ መከፋፈል የተነገረው ጋር ያያይዘዋል። ትርጉሙ ግጭቱን አያለዝብም፣ ነገር ግን ጥላቻን እንደሚያጸድቅ ተጨማሪ ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተመላላሽ የቤተሰብ ጥንዶችና የተቃውሞ ትይዩነት ተጠብቀዋል። ‘ምራት’ በዚህ አውድ የልጅ ሚስትን ያመለክታል።
