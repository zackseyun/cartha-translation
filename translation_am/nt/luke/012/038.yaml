  verdict: revise
  source_fidelity: The draft accurately represents the repeated concessive conditions (κἂν ... κἂν), the second and third watches, the master's coming and finding, and the concluding beatitude. The implied plural object of εὕρῃ οὕτως is appropriately retained from context. A small phrasing revision makes the conditional sequence more idiomatic in Amharic without changing its scope.
  naturalness: “የሌሊት ጥበቃ ጊዜ” is understandable, but “የሌሊት የጥበቃ ክፍለ ጊዜ” more clearly denotes a division of the night rather than merely a time when someone guards. Using ካገኛቸው for the coordinated finding clause is smoother in modern standard Amharic.
  terminology: “ብፁዓን” is an appropriate established biblical rendering of μακάριοι. “እነዚያ” correctly preserves the Greek demonstrative without unnecessarily adding “አገልጋዮች” to the verse text.
  issues:
  - severity: low
    issue: The wording for φυλακή can be more precise.
    rationale: The source denotes a watch, that is, a designated division of the night. Adding “ክፍለ ጊዜ” makes this sense explicit and avoids a possible reading of “ጥበቃ ጊዜ” as an occasion of guarding.
  - severity: low
    issue: Footnote b labels the unchanged main-text wording as “ቃል በቃል.”
    rationale: Unlike the English rendering, the Amharic main text does not supply “servants.” The note should simply identify the contextual referent of “እነዚያ,” rather than imply a main-text-versus-literal-text contrast.
