base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: am
  text: 'በሁለተኛው የሌሊት የጥበቃ ክፍለ ጊዜ[a] ቢመጣም፣ ወይም በሦስተኛው የሌሊት የጥበቃ ክፍለ ጊዜ ቢመጣም፣ እንደዚሁ ሆነው ካገኛቸው፣ እነዚያ ብፁዓን ናቸው።[b]


    [a] “የሌሊት የጥበቃ ክፍለ ጊዜ” ሌሊቱ ለጥበቃ የሚከፈልበትን ክፍለ ጊዜ ያመለክታል።


    [b] “እነዚያ” የሚለው በቅርብ ዐውድ የተጠቀሱትን አገልጋዮች ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሌሊት የጥበቃ ክፍለ ጊዜ” ሌሊቱ ለጥበቃ የሚከፈልበትን ክፍለ ጊዜ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “እነዚያ” የሚለው በቅርብ ዐውድ የተጠቀሱትን አገልጋዮች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: ቢመጣም፣ ወይም ... ቢመጣም
  rationale: የቅናሽ ወይም የማይወሰን ሁኔታ ትርጉሙንና በሁለቱ የጊዜ ሐረጎች ፊት ያለውን አጽንዖታዊ ድግግሞሽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: በሁለተኛው የሌሊት ጥበቃ ጊዜ ... በሦስተኛው የሌሊት ጥበቃ ጊዜ
  rationale: φυλακή እዚህ እስር ቤትን ወይም የጥበቃ ስፍራን ሳይሆን የሌሊትን ክፍለ ጊዜ ያመለክታል፤ ግልጽነት ሲባል “የሌሊት” በዋናው ጽሑፍ ተገልጧል።
- source_word: ἔλθῃ
  choice: ቢመጣም
  rationale: በሁኔታዊው አወቃቀር ያለውን ያልተወሰነ የወደፊት አጋጣሚ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εὕρῃ οὕτως
  choice: እንደዚሁ ሆነው ቢያገኛቸው
  rationale: οὕτως በቀደመው ቁጥር ወደተገለጠው የአገልጋዮቹ ዝግጁነት ይመለሳል፤ በአማርኛ ግልጽ እንዲሆን ከዐውዱ የሚታወቀው ተሳቢ በግሱ ውስጥ ተካቷል።
- source_word: μακάριοί
  choice: ብፁዓን
  rationale: በእግዚአብሔር ፊት የተወደደና የሚቀናበት ሁኔታን የሚገልጠውን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: ἐκεῖνοι
  choice: እነዚያ
  rationale: የግሪኩን ጠቋሚ ተውላጠ ስም በቀጥታ በመጠበቅ የቃሉን ቅርጽ አይጨምርም፤ የሚያመለክታቸው አገልጋዮች መሆናቸው በማስታወሻ ተገልጧል።
theological_decisions:
- issue: የἐκεῖνοιን ተጠቃሽ መግለጽ
  choice: በዋናው ጽሑፍ “እነዚያ” የሚለውን ጠቋሚ ተውላጠ ስም ማቆየት
  alternative: “እነዚያ አገልጋዮች” ብሎ ተጠቃሹን በዋናው ጽሑፍ መግለጽ
  rationale: በዚህ ቁጥር δοῦλοι የሚለው ስም አልተጻፈም። ተጠቃሹ ከቅርብ ዐውድ ግልጽ ቢሆንም፣ የግሪኩን አገላለጽ ለመጠበቅ “እነዚያ” ተብሎ ተቀምጦ ማብራሪያው በእግር ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ብፁዓን” የሚለው የታወቀውን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል፤ “የሌሊት ጥበቃ ጊዜ” ደግሞ ጥንታዊውን የጊዜ ክፍፍል ያለ ዘመናዊ ሰዓት ግምት ያብራራል።
