  text: የጌታውን ፈቃድ አውቆ፣ ያላዘጋጀ ወይም እንደ ፈቃዱ ያላደረገ ያ ባሪያ ግን ብዙ ግርፋት ይቀበላል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው “ብዙ” የሚለው ቃል ብቻ ተጽፎ የግርፋቱ ስም ተረድቶ ቀርቷል። እንዲሁም፣ “ብዙ ጊዜ ይገረፋል” ተብሎ ሊተረጎም ይችላል።
