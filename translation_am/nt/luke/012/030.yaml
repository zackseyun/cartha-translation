  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: am
  text: የዓለም ሕዝቦች[a] እነዚህን ሁሉ ለማግኘት ይጥራሉና፤ እናንተ ግን እነዚህ እንደሚያስፈልጓችሁ አባታችሁ ያውቃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የዓለም አሕዛብ።» የግሪኩ ቃል «ሕዝቦች» ወይም «አሕዛብ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: እነዚህን ሁሉ
  rationale: በዐውዱ የተጠቀሱትን ምግብ፣ መጠጥና ሌሎች የኑሮ ፍላጎቶች በግልጽ ያመለክታል፤ የግሪኩን አጽንዖትም ይጠብቃል።
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: የዓለም ሕዝቦች[a]
  rationale: ἔθνη ሕዝቦችን ወይም አሕዛብን ሊያመለክት ይችላል። «የዓለም ሕዝቦች» ሰፊውን ፍቺ ይጠብቃል፤ ሌላው ትርጉም በማስታወሻ ተጠቅሷል።
- source_word: ἐπιζητοῦσιν
  choice: ለማግኘት ይጥራሉ
  rationale: ግሱ ንቁና ተከታታይ መሻትን ያመለክታል። ይህ አገላለጽ ያንን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὑμῶν ... ὁ πατήρ
  choice: አባታችሁ
  rationale: በግሪኩ ያለውን «የእናንተ አባት» በተፈጥሯዊ አማርኛ ይገልጣል፤ በዚህ ጥቅስ የሌለውን «የሰማይ» የሚለውን ቃል አይጨምርም።
- source_word: οἶδεν
  choice: ያውቃል
  rationale: ቅርጹ ፍጹም ቢሆንም የአሁን ጊዜ ትርጉም ያለውን ግስ በቀጥታና በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: χρῄζετε τούτων
  choice: እነዚህ እንደሚያስፈልጓችሁ
  rationale: ፍላጎቱን በግልጽ ይገልጣል፤ τούτων የሚያመለክተውንም ደግሞ «እነዚህ» በማለት በግልጽ ይደግማል።
theological_decisions:
- issue: በዓለም ሕዝቦች መጣርና በአባት እውቀት መታመን መካከል ያለው ንጽጽር
  choice: «የዓለም ሕዝቦች» እና «አባታችሁ» የሚሉትን ያለ ትርጓሜያዊ ጭማሪ ማቆየት
  alternative: ἔθνηን «አሕዛብ» ብሎ መተርጎም ወይም ከ«አባታችሁ» በፊት «የሰማይ» መጨመር
  rationale: ጥቅሱ የዓለምን ጭንቀት የተሞላበት መሻት ከደቀ መዛሙርቱ ከአብ ጋር ካላቸው ግንኙነት ጋር ያነጻጽራል። ትርጉሙ ይህን ውጥረት ይጠብቃል፤ ከሉቃስ ግሪክ ውጭ ያለ ቃልም አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ለማግኘት ይጥራሉ» የἐπιζητέωን ንቁ መሻት ተፈጥሯዊ በሆነ አገላለጽ ያሳያል።
