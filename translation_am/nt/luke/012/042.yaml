base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: am
  text: ጌታም እንዲህ አለ፦ “እንግዲህ ጌታው ለቤት አገልጋዮቹ በተገቢው ጊዜ የምግብ ድርሻቸውን[b] እንዲሰጥ በእነርሱ ላይ የሚሾመው ታማኝና አስተዋይ[a] መጋቢ ማን ነው?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጥበበኛ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “የእህል ድርሻውን”፤ ይህም ለእያንዳንዱ አገልጋይ ተለክቶ የተመደበውን የምግብ ድርሻ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ / ጌታው
  rationale: የመጀመሪያው ὁ κύριος ኢየሱስን በትረካው ውስጥ “ጌታ” ብሎ ይጠራል፤ ሁለተኛው በምሳሌው ውስጥ ያለውን የቤት ባለቤት ያመለክታል። አማርኛው “ጌታው” ይህን አውዳዊ ልዩነት ከተመሳሳይ ቃል ጋር ያስቀምጣል።
- source_word: πιστός
  choice: ታማኝ
  rationale: በአደራ በተሰጠ ኃላፊነት ላይ ያለን የታመነነትና የታማኝነት ባሕርይ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἰκονόμος
  choice: መጋቢ
  rationale: ቤትንና ንብረትን በአደራ የሚያስተዳድርን ሰው ያመለክታል፤ “መጋቢ” በመጽሐፍ ቅዱሳዊ አማርኛ የአደራ አስተዳዳሪነትን በአጭሩ ይይዛል።
- source_word: φρόνιμος
  choice: አስተዋይ
  rationale: ተግባራዊ ጥበብን፣ ማስተዋልንና ትክክለኛ ፍርድን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καταστήσει
  choice: የሚሾመው
  rationale: አንድን ሰው በኃላፊነት ሥልጣን ላይ ማኖርን ይገልጣል፤ የግሪኩ የወደፊት ጊዜ አንጻራዊ ሐረጉ በአማርኛ “የሚሾመው” በሚል ተፈጥሯዊ ሁኔታ ተወክሏል።
- source_word: θεραπείας
  choice: የቤት አገልጋዮቹ
  rationale: እዚህ ረቂቅ የአገልግሎት ሐሳብን ሳይሆን በቤቱ ውስጥ ያሉትን የአገልጋዮች ማኅበር ያመለክታል።
- source_word: ἐν καιρῷ
  choice: በተገቢው ጊዜ
  rationale: የተወሰነውን ወይም ለተግባሩ ተስማሚ የሆነውን ጊዜ ያሳያል።
- source_word: σιτομέτριον
  choice: የምግብ ድርሻ
  rationale: ቃሉ በመለኪያ የተመደበን የእህል ወይም የምግብ ክፍል ያመለክታል፤ “የምግብ ድርሻ” ተግባሩን በግልጽ ዘመናዊ አማርኛ ያቀርባል፣ ቃል በቃል ትርጉሙም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በትረካውና በምሳሌው ውስጥ የተደገመው κύριος
  choice: ለኢየሱስ “ጌታ”፣ ለምሳሌው የቤት ባለቤት “ጌታው”
