  rationale: የግሪኩን አንድ ቃል በሁለቱም ቦታ ከ“ጌታ” ቃል ጋር ይጠብቃል፤ የይዞታ ቅጥያው ግን ሁለተኛው በምሳሌው ውስጥ ያለው የቤቱ ጌታ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
