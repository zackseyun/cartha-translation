  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: am
  text: ያላችሁን ንብረት ሽጡና ለድሆች ስጡ[a]። ለራሳችሁ የማያረጁ የገንዘብ ከረጢቶችን አዘጋጁ፤ እነዚህም በሰማያት የማያልቅ ሀብት ናቸው[b]፣ በዚያ ሌባ አይቀርብም፣ ብልም አያጠፋም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምጽዋት ስጡ።” የግሪኩ ቃል ለተቸገሩ በመስጠት የሚገለጽን የምሕረት ተግባር ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሰማይ።” በግሪክ ግን “በሰማያት” የሚል የብዙ ቁጥር አገላለጽ አለ።
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε τὰ ὑπάρχοντα ὑμῶν
  choice: ያላችሁን ንብረት ሽጡ
  rationale: የብዙ ቁጥር ትእዛዙንና የንብረት ትርጉሙን ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል፤ ጽሑፉ በግልጽ ከሚለው በላይ ‘ሁሉንም’ የሚል ቃል አይጨምርም።
- source_word: δότε ἐλεημοσύνην
  choice: ለድሆች ስጡ
  rationale: ἐλεημοσύνη በተግባር ለተቸገሩ የሚደረግን የምሕረት ስጦታ ያመለክታል። ‘ለድሆች ስጡ’ በዘመናዊ አማርኛ ተቀባዩንና ተግባሩን በግልጽ ያሳያል።
- source_word: ποιήσατε ἑαυτοῖς
  choice: ለራሳችሁ … አዘጋጁ
  rationale: የግሪኩን ለራስ ጥቅም የሚደረግ ተግባርና የትእዛዝ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: የማያረጁ ከረጢቶች
  rationale: βαλλάντια የገንዘብ ከረጢቶችን ያመለክታል፤ በአውዱ ያለው የገንዘብ ምስል ግልጽ ስለሆነ ‘ከረጢቶች’ የምሳሌውን ተጨባጭነት ይጠብቃል። μὴ παλαιούμενα ደግሞ የማያረጁና የማይበላሹ መሆናቸውን ያሳያል።
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: የማያልቅ ሀብት
  rationale: ἀνέκλειπτος የማይጎድል፣ የማያልቅ ማለት ነው፤ ‘የማያልቅ ሀብት’ አጭር፣ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐν τοῖς οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ በአማርኛም የመጽሐፍ ቅዱስ ክብር ያለውና ሊገባ የሚችል አገላለጽ ነው።
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει
  choice: በዚያ ሌባ አይቀርብም፣ ብልም አያጠፋም
  rationale: ἐγγίζειን ‘አይቀርብም’ ብሎ በቀጥታ ያስተላልፋል፤ σής ልብስን የሚበላ ብል ሲሆን διαφθείρει በዚህ አውድ ‘ያጠፋል/ያበላሻል’ የሚል ነው።
theological_decisions:
- issue: ἐλεημοσύνην በንብረትና በሰማያዊ ሀብት አውድ መተርጎም
  choice: ለድሆች ስጡ
  alternative: ምጽዋት ስጡ
  rationale: ጽሑፉ በአጠቃላይ ልግስና ብቻ ሳይሆን ለተቸገሩ የሚደረግን ተጨባጭ ስጦታ ያመለክታል። ይህ ምርጫ ትርጉሙን ለዘመናዊ አንባቢ ግልጽ ያደርጋል እንጂ ጽሑፉ ያልተናገረውን የኢኮኖሚ ሥርዓት አይጨምርም።
- issue: ἐν τοῖς οὐρανοῖς ያለውን ብዙ ቁጥር መጠበቅ
  choice: በሰማያት
  alternative: በሰማይ
  rationale: የምንጩን ብዙ ቁጥርና የአይሁድ/የአዲስ ኪዳን አገላለጽ ለመጠበቅ ‘በሰማያት’ ተመርጧል፤ ይህም የትምህርት ልዩነት አይፈጥርም።
- issue: የከረጢቶችና የሀብት ምስሎች ሰዋሰዋዊ ግንኙነት
  choice: ሁለቱንም በአንድ ትእዛዝ ሥር ትይዩ ማቅረብ
  alternative: ‘የማያረጁ ከረጢቶች’ን እንደ ‘በሰማያት ያለ ሀብት’ ብቻ በግልጽ መተርጎም
  rationale: የግሪኩ አገባብ ከረጢቶቹንና የማያልቀውን ሀብት በቅርብ ያያይዛል፣ ነገር ግን ትክክለኛውን የአፖዚሽን ግንኙነት ማስገደድ አያስፈልግም። ትርጉሙ ምስሎቹን ሳያጠፋ ቅርብነታቸውን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የብዙ ቁጥር ትእዛዞች ተጠብቀዋል፤ ‘ምጽዋት’ የሚለው የቆየ ግን ትክክለኛ ቃል በማስታወሻ ቀርቦ፣ በዋናው ጽሑፍ ለተራ አንባቢ ግልጽ የሆነው ‘ለድሆች ስጡ’ ተመርጧል።
