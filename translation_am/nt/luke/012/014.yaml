  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: am
  text: እርሱ ግን፣ “ሰውዬ፣ በእናንተ ላይ ፈራጅ ወይም ከፋፋይ አድርጎ የሾመኝ ማን ነው?” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: አንተ ሰው
  rationale: ቀጥተኛውን የንግግር አድራሻ ይጠብቃል፤ በዘመናዊ አማርኛም ግልጽ ነው።
- source_word: κριτὴν
  choice: ፈራጅ
  rationale: የፍርድ ውሳኔ ሰጪን የሚያመለክተውን የግሪኩን ሕጋዊ ሚና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μεριστὴν
  choice: ከፋፋይ
  rationale: በተለይ ንብረትን ወይም ርስትን ለተካፋዮች የሚከፍል ሰው የሚለውን ትርጉም ይጠብቃል፤ ከ‘አስታራቂ’ ወይም ‘ዳኛ’ ጋር አያዋህደውም።
- source_word: ἐφ’ ὑμᾶς
  choice: በእናንተ ላይ
  rationale: የብዙ ቁጥር ተውላጠ ስምንና በጉዳዩ ላይ ሥልጣን ያለው ሚና የሚለውን ግልጽነት ይጠብቃል።
- source_word: κατέστησεν
  choice: አድርጎ የሾመኝ
  rationale: በአንድ ሚና ላይ በሥልጣን ማቆምን ወይም መሾምን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የኢየሱስ ጥያቄ የሚያመለክተው የሥልጣን ወሰን
  choice: ጥያቄውን እንደ ቀጥተኛ የሹመት ጥያቄ ማቅረብ
  alternative: ኢየሱስ ማንኛውንም የፍርድ ሚና እንደማይኖረው በትርጉሙ ላይ መጨመር
  rationale: ጥቅሱ በዚህ የቤተሰብ ክርክር ላይ ማን እንደሾመው ይጠይቃል፤ ከዚያ የሚያልፍ ሥነ መለኮታዊ ድምዳሜ በትርጉሙ ውስጥ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ተቃርኖ ‘δὲ’ በ‘ግን’፣ ነጠላው ተናጋሪ በ‘አለው’፣ ብዙ ቁጥሩ ὑμᾶς ደግሞ በ‘እናንተ’ ተጠብቋል።
