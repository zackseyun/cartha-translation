- source_word: τί φάγητε
  choice: ምን እንደምትበሉ
  rationale: ወደፊት ስለሚበሉት ነገር ያለውን የጥያቄ ይዘት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μηδὲ τῷ σώματι
  choice: ስለ ሰውነታችሁም
