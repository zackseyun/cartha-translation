- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን ንግግርና የብዙ ቁጥር ተደራሲዎችን በአጭር ዘመናዊ አማርኛ ይጠብቃል።
- source_word: μὴ μεριμνᾶτε
  choice: አትጨነቁ
  rationale: μεριμνάω እዚህ የጭንቀት አሳብን ያመለክታል፤ “አትጨነቁ” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τῇ ψυχῇ
  choice: ስለ ሕይወታችሁ
