  choice: ከዚያም … አላቸው
  rationale: δέ ቀላል የትረካ ማያያዣ ነው፤ “ከዚያም” የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ደቀ መዛሙርቱን
  rationale: μαθηταί በዚህ አውድ “ደቀ መዛሙርት” ሲሆን፣ የባለቤትነት ቅጥያው ግልጽ የሆነውን αὐτοῦ ያስተላልፋል።
- source_word: Διὰ τοῦτο
