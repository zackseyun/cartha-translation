base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: am
  text: ከዚያም ደቀ መዛሙርቱን እንዲህ አላቸው፤ “ስለዚህ እላችኋለሁ፤ ስለ ሕይወታችሁ[b] ምን እንደምትበሉ፣ ስለ ሰውነታችሁም ምን እንደምትለብሱ አትጨነቁ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጭንቀት አትያዙ።” የግሪኩ ግስ በጭንቀት መያዝን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ስለ ነፍሳችሁ።” እዚህ የግሪኩ ቃል ብዙ ጊዜ የሰውን ምድራዊ ሕይወት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
