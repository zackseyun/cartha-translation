  rationale: ለψυχή ምግብ፣ ለσῶμα ደግሞ ልብስ በሚለው ትይዩ አወቃቀር ውስጥ ቃሉ ተራውን ምድራዊ ሕይወት ያመለክታል። “ነፍስ” የሚለውን አማራጭ በማስታወሻ ማቆየት የግሪኩን ሰፊ የትርጉም ክልል ሳያጠፋ በአውዱ የሚቀድመውን ትርጉም በዋናው ጽሑፍ ያቀርባል።
