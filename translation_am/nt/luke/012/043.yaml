revisions:
- from: ጌታው[a] መጥቶ እንዲህ ሲያደርግ የሚያገኘው ያ አገልጋይ ብፁዕ ነው።
  to: ጌታው ሲመጣ እንዲህ ሲያደርግ የሚያገኘው ያ አገልጋይ ብፁዕ ነው።
  rationale: The word order is adjusted so that “እንዲህ ሲያደርግ” plainly describes the servant whom the master finds. The temporal clause “ጌታው ሲመጣ” idiomatically conveys the Greek participial arrival in relation to the future finding. The footnote is recast as a restrained lexical alternative and does not resolve the parable's broader application.
