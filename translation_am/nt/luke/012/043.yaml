review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the beatitude, demonstrative servant, master's arrival, and finding. However, the placement of “እንዲህ ሲያደርግ” immediately after “ጌታው መጥቶ” can naturally be read as describing what the master does, whereas ποιοῦντα οὕτως describes the servant. “ሲመጣ” also gives the temporal participle a clearer prospective sense in this context.
  naturalness: The proposed revision is natural modern standard Amharic and makes the servant, rather than the master, the clear agent of the faithful action.
  terminology: “ብፁዕ,” “አገልጋይ,” and “ጌታ” are suitable. “ጌታ” retains the household-master sense while allowing the Greek κύριος resonance without forcing a theological interpretation.
  issues:
  - severity: medium
    issue: Ambiguous attachment of “እንዲህ ሲያደርግ”
    rationale: In the draft, the phrase follows “ጌታው መጥቶ” and may modify the master. The Greek accusative participle ποιοῦντα modifies δοῦλος, so the Amharic should make the servant's action unambiguous.
  - severity: low
    issue: Footnote does not clearly state a usable lexical alternative
    rationale: The note discusses possible implications but does not explicitly identify “የቤቱ ጌታ”/“ባለቤት” as the household-context alternative. A concise lexical note better preserves the source ambiguity without asserting a doctrinal conclusion.
  revised_text: ጌታው ሲመጣ እንዲህ ሲያደርግ የሚያገኘው ያ አገልጋይ ብፁዕ ነው።
  revised_footnotes:
