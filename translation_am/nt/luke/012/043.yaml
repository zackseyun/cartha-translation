id: LUK.12.43
reference: Luke 12:43
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: am
  text: ጌታው ሲመጣ እንዲህ ሲያደርግ የሚያገኘው ያ አገልጋይ ብፁዕ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: ብፁዕ
  rationale: የቃሉን የበረከትና የመለኮታዊ ሞገስ ክብደት ይጠብቃል፤ ‘ደስተኛ’ ከሚለው ግላዊ ስሜት ይልቅ ከኢየሱስ የብፅዕና አነጋገር ጋርም ይስማማል።
- source_word: δοῦλος
  choice: አገልጋይ
  rationale: በምሳሌው የቤት አስተዳደር አውድ ውስጥ በጌታው ሥር ያለውን ሰው ሚናና ኃላፊነት በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ቃል ‘ባሪያ’ ሊሆን ቢችልም በዚህ አውድ ዋናው ነጥብ የተሰጠውን ሥራ በታማኝነት ማድረግ ነው።
- source_word: κύριος
  choice: ጌታ
  rationale: ‘ጌታ’ በአማርኛ የቤቱን ባለሥልጣንም ሆነ ጌታን የሚያመለክተውን ሰፊ ትርጉም ሊይዝ ስለሚችል የምሳሌውን የቤት አውድና የጌታ መምጣት ሰፊ ፍንጭ አብሮ ይጠብቃል።
- source_word: ἐλθὼν
  choice: መጥቶ
  rationale: የአኦሪስት አሳታፊውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል፤ ጌታው መጥቶ አገልጋዩን እንደሚያገኘው ያሳያል።
- source_word: εὑρήσει
  choice: የሚያገኘው
  rationale: የወደፊቱን ማግኘት በአማርኛ አንጻራዊ ሐረግ ተፈጥሯዊ አድርጎ ይገልጣል።
- source_word: ποιοῦντα οὕτως
  choice: እንዲህ ሲያደርግ
  rationale: ከዚህ በፊት የተገለጸውን ታማኝ ተግባር በአጭርና ተፈጥሯዊ መንገድ ይመለከታል።
- source_word: ἐκεῖνος
  choice: ያ
  rationale: በግሪኩ ያለውን ጠቋሚ አጽንዖት ይጠብቃል፤ ማንኛውንም አገልጋይ ሳይሆን ያን በዚያ ሁኔታ የሚገኘውን ያመለክታል።
theological_decisions:
- issue: በጌታው መመለስ ምሳሌ ውስጥ κύριος የሚኖረው የቤት ጌታና ክርስቶሳዊ ፍንጭ
  choice: በዋናው ጽሑፍ ‘ጌታ’ ተብሏል።
  alternative: የቤት አውዱን ብቻ ለማጉላት ‘አሠሪ’ ወይም ‘ባለቤት’ ማለት ይቻላል።
  rationale: ‘ጌታ’ የምሳሌውን የቤት ግንኙነት ይገልጣል፤ በተመሳሳይ ጊዜ ሉቃስ በሰፊው አውድ የሚያቀርበውን የጌታ መመለስ ፍንጭ ሳያጠፋ እውነተኛውን ትርጉማዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ቀላል አማርኛ ተጠቅሟል። ‘ብፁዕ’ መጽሐፍ ቅዱሳዊውን የብፅዕና አነጋገር ይጠብቃል፤ የአረፍተ ነገሩ አወቃቀርም የግሪኩን ትኩረት ሳያጣ በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል።
