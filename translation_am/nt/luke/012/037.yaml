  choice: በማዕድ ዙሪያ እንዲቀመጡ ያደርጋቸዋል
  rationale: ግሱ ለምግብ መደገፍን ወይም መዘርጋትን ያመለክታል። ቃል በቃል ‘ያስተኛቸዋል’ ማለት በዘመናዊ አማርኛ የምግብ አውዱን ሊያደበዝዝ ስለሚችል የማዕዱ ሁኔታ ግልጽ ተደርጓል።
- source_word: παρελθὼν
  choice: ወደ እነርሱ ቀርቦ
