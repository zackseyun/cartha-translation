base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: am
  text: ጌታቸው[b] ሲመጣ ነቅተው የሚያገኛቸው እነዚያ ባሪያዎች[a] የተባረኩ ናቸው። እውነት እላችኋለሁ፤ እርሱ ለማገልገል ወገቡን ይታጠቃል[c]፣ በማዕድ ዙሪያም እንዲቀመጡ ያደርጋቸዋል፤ ወደ እነርሱም ቀርቦ ያገለግላቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋዮች።” የግሪክ ቃል δοῦλοι ነው፤ በዚህ የቤት አስተዳደር ምሳሌ ውስጥ የባሪያነት ግንኙነቱ ግልጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ባለቤታቸው።” በምሳሌው የቅርብ አውድ የግሪኩ κύριος የቤቱን ጌታ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “ራሱን ይታጠቃል።” ይህ አገላለጽ ልብስን ለሥራ አመቺ አድርጎ መታጠቅን ያመለክታል።
    reason: cultural_note
