base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: am
  text: ነገር ግን፣ እግዚአብሔር ዛሬ በሜዳ ያለውንና ነገ ወደ ምድጃ[b] የሚጣለውን ሣር[a] እንዲህ የሚያለብሰው ከሆነ፣ እናንተንማ ይበልጥ አያለብሳችሁምን? እምነታችሁ ያነሰ እናንተ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዕፅዋት» ወይም «ልምላሜ»።
    reason: lexical_alternative
  - marker: b
    text: «ምድጃ» እዚህ የዳቦ መጋገሪያ ምድጃን ያመለክታል፤ የደረቀ የሜዳ ሣር ለማገዶነት ሊውል ይችል ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: ሣር
  rationale: ቃሉ ሣርን፣ ልምላሜን ወይም አጠቃላይ ዕፅዋትን ሊያመለክት ይችላል። በዚህ የሜዳ ልምላሜ በፍጥነት ደርቆ ለማገዶነት በሚውልበት አውድ፣ “ሣር” ቀላልና ተፈጥሯዊ ምርጫ ነው።
- source_word: ἐν ἀγρῷ
  choice: በሜዳ
  rationale: የሣሩን ተራ የውጭ አካባቢ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: ዛሬ ... ያለውንና ነገ ... የሚጣለውን
  rationale: የግሪኩን አጭር አሳታፊ ሐረግ በግልጽ አማርኛ ይዘረጋል፤ የዛሬና የነገን ተቃርኖ እና የሣሩን አጭር ዕድሜ ይጠብቃል።
- source_word: κλίβανον
  choice: ምድጃ
  rationale: ቃሉ በተለይ የመጋገሪያ ምድጃን ያመለክታል፤ “ምድጃ” ተራና ትክክለኛ ዘመናዊ አቻ ነው።
- source_word: ἀμφιέζει
  choice: ያለብሰው
  rationale: የማልበስን ምስል በቀጥታ ይጠብቃል፤ በአውዱም ከሰው ልብስ ጋር ያለውን ንጽጽር ያስቀጥላል።
- source_word: πόσῳ μᾶλλον
  choice: እንዴት አብልጦ
  rationale: ከትንሹ ወደ ትልቁ የሚሄደውን የክርክር አነጋገር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὀλιγόπιστοι
  choice: እምነታችሁ የሚያንስ እናንተ
  rationale: ቀጥተኛውን የጥሪ አነጋገርና ለስላሳ ወቀሳውን ይጠብቃል፤ የመዳን እምነት በሚመለከት ያልተገለጸ ቴክኒካዊ ፍርድ አይጨምርም።
- source_word: εἰ δὲ
  choice: ነገር ግን ... ከሆነ
  rationale: ከቀደመው ምሳሌ ጋር ያለውን ቀጣይነትና ቀላል ተቃርኖ ያሳያል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በዘመናዊ መደበኛ አማርኛ ለθεός የተለመደውና ክብር ያለው አቻ ነው።
- source_word: οὕτως
  choice: እንዲህ
  rationale: የማልበሱን ሁኔታ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
theological_decisions:
