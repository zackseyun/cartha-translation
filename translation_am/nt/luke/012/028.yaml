  rationale: ቃሉ በእግዚአብሔር ላይ ያለውን የጎደለ መታመን ይወቅሳል፤ ነገር ግን ስለ መዳን እምነት ወይም ክህደት ቴክኒካዊ አስተምህሮ አይሰጥም።
