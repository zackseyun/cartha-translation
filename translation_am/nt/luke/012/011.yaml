  rationale: ትእዛዙ በቅድሚያ በጭንቀት እንዳይዋጡ ይከለክላል፤ ‘አትጨነቁ’ ይህን ኃይል በተለመደ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πῶς ἢ τί
  choice: እንዴት ወይም ምን ብላችሁ
