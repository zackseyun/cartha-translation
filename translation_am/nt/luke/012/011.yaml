- source_word: ἀπολογήσησθε
  choice: መከላከያችሁን እንደምታቀርቡ
  rationale: ግሱ እዚህ ሕጋዊ ወይም መርማሪ በሆነ ሁኔታ ራስን መከላከልን ይጠቁማል። ‘መከላከያን ማቅረብ’ የፎረንሲክ ትርጉሙን ይጠብቃል።
- source_word: ἢ τί εἴπητε
  choice: ወይም ምን እንደምትሉ
  rationale: ከመከላከያው አቀራረብ ቀጥሎ የንግግሩን ይዘት የሚጠቅሰው የተለየ ሐረግ በግልጽ ሁኔታ ተጠብቋል።
