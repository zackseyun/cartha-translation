  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: am
  text: ነገር ግን ወደ ምኩራቦችና ወደ ገዢዎች እንዲሁም ወደ ባለሥልጣናት ሲያቀርቧችሁ[a]፣ ራሳችሁን እንዴት ወይም በምን እንደምትከላከሉ[b]፣ ወይም ምን እንደምትሉ አትጨነቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ምኩራቦች፣ ገዢዎችና ባለሥልጣናት” የሚለው ሐረግ ደቀ መዛሙርቱ ሊመረመሩባቸው የሚችሉ ሃይማኖታዊና የመንግሥት አካላትን ያመለክታል።
    reason: cultural_note
  - marker: b
