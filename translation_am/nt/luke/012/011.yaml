    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ነገር ግን … ባቀረቧችሁ ጊዜ
  rationale: ὅταν የሚጠቁመውን ያልተወሰነ የወደፊት ሁኔታ ‘… ጊዜ’ በሚለው ተፈጥሯዊ አማርኛ ያሳያል፤ δέ ደግሞ በዐውዱ ያለውን ቀላል ንጽጽር ‘ነገር ግን’ በማለት ይጠብቃል።
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: ባቀረቧችሁ ጊዜ
  rationale: በፍርድ ወይም በምርመራ አውድ አንድን ሰው በባለሥልጣን ፊት ‘ማቅረብ’ ተፈጥሯዊና ትክክለኛ ነው። የግሱ ሦስተኛ ወገን ብዙ ቁጥር ተዋናይ በአማርኛው ግስ ውስጥ ተጠብቋል።
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: በምኩራቦች፣ በገዢዎችና በባለሥልጣናት ፊት
  rationale: ἐπί ከተከታዩ የተሳቢ ቅርጽ ጋር እዚህ በፍርድ ወይም በምርመራ አካላት ፊት መቅረብን ያመለክታል። ሦስቱም ስሞች ሳይዋሃዱ ተጠብቀዋል።
- source_word: συναγωγάς
  choice: ምኩራቦች
  rationale: ቃሉ በቀጥታ ‘ምኩራቦች’ ማለት ነው፤ በዐውዱ የምኩራብ የፍርድ ወይም የምርመራ አካላትን በውክልና ሊያመለክት ቢችልም፣ ይህ በዋናው ጽሑፍ ውስጥ በትርጓሜ አልተተካም።
- source_word: ἀρχάς
  choice: ገዢዎች
  rationale: በዚህ የሕግና የአስተዳደር ዐውድ ቃሉ የሚያመለክተው ገዥ ባለሥልጣናትን ነው፤ ‘ገዢዎች’ ሰፊና ግልጽ አቻ ነው።
- source_word: ἐξουσίας
  choice: ባለሥልጣናት
