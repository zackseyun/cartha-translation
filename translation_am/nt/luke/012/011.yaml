  verdict: revise
  source_fidelity: 'The draft preserves the indefinite future setting, the threefold sequence of bodies/authorities, the prohibition against anxiety, and both interrogative elements (''how or what'' and ''what''). However, its opening judicial phrase is syntactically awkward in Amharic: ''በምኩራቦች ... ፊት'' does not naturally express being brought before synagogues and officials. The revised wording retains the source''s distinction while expressing the forensic setting idiomatically.'
  naturalness: 'The main clause is otherwise clear and suitably modern. Recasting the presentation phrase as ''ወደ ምኩራቦችና በገዢዎችና በባለሥልጣናት ፊት'' still has an uneven coordination; therefore the revision uses ''ወደ ... ፊት'' with a collective, judicial sense: ''ወደ ምኩራቦችና ወደ ገዢዎች እንዲሁም ወደ ባለሥልጣናት ሲያቀርቧችሁ.'' This is natural and does not over-specify formal tribunals.'
  terminology: ‘ምኩራቦች,’ ‘ገዢዎች,’ and ‘ባለሥልጣናት’ are retained. ‘ራሳችሁን ስለምትከላከሉበት’ renders the forensic middle sense of ἀπολογήσησθε more directly than the draft's noun phrase while retaining the distinction from the final, broader ‘what you should say.’ The cultural footnote is retained but replaces the English loanword ‘ሲቪላዊ’ with natural Amharic.
  issues:
