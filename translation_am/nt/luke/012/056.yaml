  to: ግብዞች! የምድርንና የሰማይን ገጽታ መለየት ታውቃላችሁ፤ ይህን ወቅት[a] ግን እንዴት መለየት አታውቁም?
  rationale: The revision preserves the source’s repetition of οἴδατε δοκιμάζειν and its indignant rhetorical question while rendering the operative verb as discerning visible signs rather than merely investigating them. It also uses ወቅት for καιρός and retains its possible decisive sense in the anchored footnote, without over-specifying the theological significance of the time.
