  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: am
  text: ግብዞች! የምድርንና የሰማይን ገጽታ መለየት ታውቃላችሁ፤ ይህን ወቅት[a] ግን እንዴት መለየት አታውቁም?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን ጊዜ” ወይም “ይህን ወሳኝ ጊዜ።” የግሪኩ καιρός ትርጉም ያለውን ወይም አመቺ ጊዜ ሊያመለክት ይችላል፤ ተራ ጊዜን ብቻ አያመለክትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: እናንተ ግብዞች
  rationale: ቀጥተኛውን የጥሪ ወቀሳ በተለመደና ግልጽ የአማርኛ አገላለጽ ያቀርባል፤ በዚህ ሥፍራ ቃሉ የመድረክ ተዋንያንን ሳይሆን አስመሳዮችን ያመለክታል።
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: የምድርንና የሰማይን ገጽታ
  rationale: πρόσωπον በዚህ አገባብ የሚታየውን ሁኔታ ወይም መልክ ያመለክታል። ‘ገጽታ’ ምሳሌያዊውን ‘ፊት’ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ γῆ/οὐρανός የአየር ሁኔታ ምልክቶችን በሚመለከተው አገባብ ‘ምድር/ሰማይ’ ተብሏል።
- source_word: οἴδατε δοκιμάζειν
  choice: መመርመር ታውቃላችሁ
  rationale: οἴδατε ከግስ መደብ ጋር ችሎታን (‘እንዴት እንደሚደረግ ማወቅ’) ያሳያል፤ δοκιμάζειν ደግሞ የሚታዩ ምልክቶችን መመርመርና ትርጉማቸውን መለየት ነው። በሁለቱም ክፍሎች የግሱ ድግግሞሽ ተጠብቋል።
- source_word: τὸν δὲ καιρὸν τοῦτον
  choice: ይህን ዘመን ግን
  rationale: τοῦτον በ‘ይህን’ ቀጥታ ተተርጉሟል። καιρός ተራ የጊዜ ፍሰትን ብቻ ሳይሆን ትርጉም ያለውን ወቅት ሊያመለክት ስለሚችል ‘ዘመን’ ተመርጧል፤ የግሪኩን ክልል ሳያጠብ አማራጮቹ በማስታወሻ ቀርበዋል።
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: እንዴት መመርመር አታውቁም?
  rationale: πῶς ያለውን የተቆጣ የአጠያየቅ ኃይል በ‘እንዴት ... አታውቁም?’ ጠብቋል፤ የመጀመሪያውን οἴδατε δοκιμάζειν አገላለጽም እንደገና ያንጸባርቃል።
theological_decisions:
- issue: በኢየሱስ ወቀሳ ውስጥ καιρός የሚያመለክተው
  choice: ይህን ዘመን
  alternative: ይህን ወቅት፤ ይህን ወሳኝ ጊዜ
  rationale: አገባቡ በኢየሱስ አገልግሎትና በእግዚአብሔር ድርጊት ያለውን ትርጉም አለማስተዋል ይጠቁማል፤ ሆኖም ትርጉሙ ግሪኩ በግልጽ ከሚለው በላይ የተወሰነ ሥነ መለኮታዊ ፍቺ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽርና የግስ ድግግሞሽ ተጠብቀዋል፤ የκαιρός የትርጉም ስፋት በግርጌ ማስታወሻ ቀርቧል።
