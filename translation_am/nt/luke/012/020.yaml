id: LUK.12.20
reference: Luke 12:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: am
  text: እግዚአብሔር ግን እንዲህ አለው፦ ‘አንተ ሞኝ! በዚህችው ሌሊት ሕይወትህን[a] ከአንተ ይጠይቃሉ፤ ያዘጋጀኸውስ ለማን ይሆናል?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ነፍስህን።’ የግሪኩ ቃል እንደ አውዱ ‘ሕይወት’ ወይም ‘ነፍስ’ ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: አንተ ሞኝ!
  rationale: የግሪኩ ቃል በቀጥታ ለሰውየው የተነገረ ጠንካራ ተግሣጽ ነው፤ ይህ አተረጓጎም ኃይሉንና ተፈጥሯዊነቱን ይጠብቃል።
- source_word: ταύτῃ τῇ νυκτί
  choice: በዚህችው ሌሊት
  rationale: አመልካቹ ቃል የሌሊቱን ቅርብነትና አስቸኳይነት አጽንዖት ሰጥቶ ያሳያል።
- source_word: ψυχήν
  choice: ሕይወትህን
  rationale: በዚህ አውድ ψυχή በዚያች ሌሊት የሚያበቃውን የሰውየውን ሕይወት ያመለክታል፤ ‘ነፍስህን’ የሚለው ትርጉም ግን በማስታወሻ ተጠብቋል።
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: ከአንተ ይጠይቃሉ
  rationale: የግሪኩን ብዙ ቁጥር ግስና ያልተገለጸውን ፈጻሚ ሳይጨምር ይጠብቃል። ቃሉ መጠየቅን ወይም መልሶ መጠየቅን ሊያመለክት ቢችልም፣ ‘መልሰው’ የሚል ቃል በዋናው ጽሑፍ አልተጨመረም።
- source_word: ἃ δὲ ἡτοίμασας
  choice: ያዘጋጀኸውስ
  rationale: የሰውየውን የተከማቸ ንብረት በአጠቃላይ የሚያመለክት ተፈጥሯዊና አጭር አማርኛ ነው።
- source_word: τίνι ἔσται
  choice: ለማን ይሆናል?
  rationale: የግሪኩ የባለቤትነት ወይም የተጠቃሚነት ጥያቄን ያለ አላስፈላጊ ማብራሪያ ይጠብቃል።
theological_decisions:
- issue: ψυχή በሞት አውድ ያለው ትርጉም
  choice: ሕይወት
  alternative: ነፍስ
  rationale: አውዱ ስለ ሰውየው ድንገተኛ ሞትና ምድራዊ ሕይወቱ ማብቃት ይናገራል። ‘ሕይወት’ ማለት ጽሑፉ ከሚጠይቀው በላይ የሰው ባሕርይ ትምህርትን አያስገባም፤ ‘ነፍስ’ የሚለው አማራጭ ደግሞ የግሪኩን የትርጉም ስፋት ለመጠበቅ በማስታወሻ ቀርቧል።
- issue: በἀπαιτοῦσιν ያልተገለጸው ብዙ ቁጥር ፈጻሚ
  choice: ከአንተ ይጠይቃሉ
  alternative: ከአንተ ይጠየቃል
  rationale: ቀጥተኛው ብዙ ቁጥር አተረጓጎም የግሪኩን ሰዋስው ይጠብቃል፣ የተግባሩ ፈጻሚዎች እነማን እንደሆኑም አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በዚህችው’ አስቸኳይነቱን፣ ‘ያዘጋጀኸውስ’ ደግሞ የመጨረሻውን ተቃርኖና የንግግሩን ኃይል ያስጠብቃሉ።
