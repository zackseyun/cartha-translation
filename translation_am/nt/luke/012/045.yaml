  rationale: በዚህ ምሳሌ ውስጥ የቤት ባለሥልጣንነትና የተገዥነት ግንኙነት ጎልቶ ስለሚታይ፣ ከአጠቃላዩ ‘አገልጋይ’ ይልቅ የግሪኩን ማኅበራዊ ሁኔታ ይበልጥ በግልጽ ያሳያል።
