id: LUK.12.59
reference: Luke 12:59
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: am
  text: እልሃለሁ፤ የመጨረሻውን ሌፕቶን[a] እንኳ እስክትከፍል ድረስ ከዚያ ፈጽሞ አትወጣም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመጨረሻውን ትንሽ ሳንቲም እንኳ።” የግሪኩ λεπτόν (ሌፕቶን) እጅግ ትንሽ ዋጋ ያለውን ሳንቲም ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: እልሃለሁ
  rationale: በነጠላ ቁጥር የተነገረውን ቀጥተኛ የአነጋገር ሐረግ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ፈጽሞ አትወጣም
  rationale: οὐ μή ከአኦሪስት ሰብጃንክቲቭ ጋር ያለውን ጠንካራ የወደፊት እምቢታ ‘ፈጽሞ’ በሚለው አጽንዖት ያስተላልፋል።
- source_word: ἐκεῖθεν
  choice: ከዚያ
  rationale: ከዚያ ቦታ መውጣትን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἕως
  choice: እስክትከፍል ድረስ
  rationale: አሉታዊው ሁኔታ የሚቆይበትን የጊዜ ወሰን ያሳያል።
- source_word: καὶ τὸ ἔσχατον
  choice: የመጨረሻውን … እንኳ
  rationale: καί እዚህ ያለውን አጽንዖታዊ ኃይል ‘እንኳ’ ይገልጻል፤ ἔσχατον ደግሞ ክፍያው ሙሉ መሆን እንዳለበት ያሳያል።
- source_word: λεπτόν
  choice: ለፕቶን
  rationale: የጥንቱን ትንሽ ሳንቲም ታሪካዊ ስያሜ ይጠብቃል፤ ትርጉሙ በግርጌ ማስታወሻ ተብራርቷል።
- source_word: ἀποδῷς
  choice: እስክትከፍል
  rationale: በዕዳና በሕጋዊ አውድ የሚገኘውን ክፍያ ይገልጻል፤ ከἕως ጋር የክፍያውን መጠናቀቅ ያመለክታል።
theological_decisions:
- issue: የንግግሩ የዕዳና የእስር ምስል ምንነት
  choice: የዕዳና የእስር ምስሉን ያለ ትርጓሜያዊ ጭማሪ መጠበቅ
  alternative: እንደ ምድራዊ ሕጋዊ ውጤት፣ መለኮታዊ ፍርድ ወይም በኋላ እንደተቀመጠ የመንጻት ቅጣት ትምህርት በግልጽ መወሰን
  rationale: ጥቅሱ ሙሉ ክፍያ እስኪፈጸም ያለውን እስር ይገልጻል፤ ነገር ግን ምስሉ በትክክል የሚያመለክተውን አይወስንም። ስለዚህ ትርጉሙ ያለውን ሥነ መለኮታዊ ውጥረት አይፈታም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ለፕቶን’ የሚለው ታሪካዊ ቃል ተጠብቆ በግርጌ ማስታወሻ ተብራርቷል።
