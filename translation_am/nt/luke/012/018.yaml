- source_word: συνάξω ἐκεῖ
  choice: በዚያም ... እሰበስባለሁ
  rationale: የ‘መሰብሰብ’ን መሠረታዊ ትርጉምና የቦታውን ማመልከቻ ሳያሰፋ ይጠብቃል።
- source_word: πάντα τὸν σῖτον
  choice: እህሌን ሁሉ
  rationale: σῖτος እህልን በአጠቃላይ፣ አንዳንድ ጊዜም ስንዴን በተለይ ሊያመለክት ይችላል፤ ‘እህል’ አውዱን ሳያጠብ ይገልጻል። የባለቤትነት ቅጥያው ከተናጋሪው አውድና ከ‘ንብረቴ’ ጋር ካለው ትይዩነት የተነሣ ነው።
- source_word: τὰ ἀγαθά μου
  choice: ንብረቴን
  rationale: ገንዘብን ብቻ ሳይጠቁም ሰፊውን የቁሳዊ ንብረት ትርጉም ይጠብቃል።
