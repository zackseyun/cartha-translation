  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: am
  text: እንዲህም አለ፤ ‘ይህን አደርጋለሁ፤ ጎተራዎቼን[a] አፍርሼ ከእነዚህ የሚበልጡ ጎተራዎችን እሠራለሁ፤ በዚያም እህሉን[b] ሁሉና ንብረቴን[c] እሰበስባለሁ።’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጎተራዎቼን” የተተረጎመው ቃል (ἀποθήκας) “መጋዘኖቼን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
