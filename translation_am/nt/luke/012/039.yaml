review_pass:
  verdict: revise
  source_fidelity: The counterfactual condition and result are represented correctly. However, the main clause's passive infinitive is more clearly and naturally conveyed by explicitly expressing entry through the house/wall, while retaining the source's digging image.
  naturalness: The draft is generally clear, but “ቤቱ ተቆፍሮ እንዲገባበት” is syntactically heavy and the referent of the implied entrant is less immediate. A more direct formulation is idiomatic modern standard Amharic.
  terminology: “የቤቱ ባለቤት,” “ሌባው,” and “ሰዓት” are appropriate. The cultural footnote correctly explains the literal digging-through image.
  issues:
  - severity: medium
    issue: The rendering of διορυχθῆναι is awkward in the main text.
    rationale: The Greek means to have one's house broken into by digging through it. Recasting it as “ቤቱን ቆፍሮ እንዲገባ” makes the intended unauthorized entry explicit and reads more naturally, while the note preserves the passive/literal image.
