id: LUK.12.39
reference: Luke 12:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: am
  text: ይህን ግን ዕወቁ፤ የቤቱ ባለቤት ሌባው በየትኛው ሰዓት እንደሚመጣ ቢያውቅ ኖሮ፣ ቤቱን[a] ቆፍሮ እንዲገባ ባልፈቀደ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ቤቱ እንዲቆፈር” ማለት ነው፤ ይህም በቤት ግድግዳ ውስጥ ቆፍሮ ወይም ሰብሮ የመግባትን ልማድ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: ይህን ግን ዕወቁ
  rationale: የብዙ ሰዎች ትእዛዝ የሆነውን γινώσκετε በቀጥታ ያስተላልፋል፤ δέ የሚያሳየውን ሽግግር ወይም ንጽጽር ‘ግን’ ይጠብቃል።
- source_word: οἰκοδεσπότης
  choice: የቤቱ ባለቤት
  rationale: የቤቱን ኃላፊ ወይም ጌታ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል፤ ባለንብረትነትን ብቻ አያጎላም።
- source_word: ποίᾳ ὥρᾳ
  choice: በየትኛው ሰዓት
  rationale: የግሪኩን የሰዓት ልዩነት በቀጥታ ጠብቆ ከአውዱ የንቃት ጭብጥ ጋር ይስማማል።
- source_word: ὁ κλέπτης ἔρχεται
  choice: ሌባው … እንደሚመጣ
  rationale: የግሪኩን የአሁን ጊዜ ቅርጽ በተዘዋዋሪ ንግግር ውስጥ ተፈጥሯዊ በሆነ የአማርኛ አቀራረብ ያቀርባል።
- source_word: οὐκ ἂν ἀφῆκεν
  choice: ባልፈቀደም ነበር
  rationale: ያልተፈጸመ ተቃራኒ-ሁኔታን በአማርኛ ግልጽ በሆነው ‘ቢ… ኖሮ፣ ባል… ነበር’ አወቃቀር ይገልጻል።
- source_word: διορυχθῆναι
  choice: ተቆፍሮ እንዲገባበት
  rationale: ግሱ በቀጥታ ‘ተቆፍሮ መገባትን’ ስለሚያመለክት፣ የጥንታዊውን የግድግዳ ሰብሮ መግባት ምስል ሳያጠፋ ለአማርኛ አንባቢ ድርጊቱን ግልጽ ያደርጋል።
- source_word: τὸν οἶκον αὐτοῦ
  choice: ቤቱ
  rationale: የግሪኩን ‘የእርሱ ቤት’ በአማርኛ ተፈጥሯዊና አጭር በሆነ ቅርጽ ያቀርባል።
