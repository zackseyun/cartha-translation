  verdict: revise
  source_fidelity: The draft correctly represents the rhetorical question, independent discernment (ἀφ’ ἑαυτῶν), and the evaluative sense of κρίνετε. Its rendering of τὸ δίκαιον as “ትክክል የሆነውን” is broadly possible, but a more idiomatic substantive expression better conveys “what is right/the right thing.”
  naturalness: “ትክክል የሆነውን” is understandable but somewhat less natural than “ትክክለኛውን ነገር” in this sentence. Placing “በራሳችሁ” nearer the verb also makes the independent-judgment sense clear.
  terminology: “አትፈርዱም” suitably retains the judgment/evaluation wording of κρίνω. “ትክክለኛውን ነገር” preserves the broad moral and practical force of τὸ δίκαιον without reducing it to legal justice alone.
