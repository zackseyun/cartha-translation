base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: am
  text: ቁራዎችን በጥሞና ተመልከቱ[a]፤ አይዘሩም፣ አያጭዱምም፤ የማከማቻ ክፍልም ሆነ ጎተራ የላቸውም[b]፤ እግዚአብሔርም ይመግባቸዋል። እናንተማ ከወፎች ይልቅ ምንኛ የበለጠ ዋጋ አላችሁ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቁራዎችን አስተውሉ” ወይም “ስለ ቁራዎች በጥሞና አስቡ።”
    reason: lexical_alternative
  - marker: b
    text: “የማከማቻ ክፍል” ταμεῖονን፣ “ጎተራ” ደግሞ ἀποθήκηን ይተረጉማሉ። ግሪኩ ሁለት የተለያዩ የማከማቻ ቃላትን ይጠቀማል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “እናንተማ ከወፎች ይልቅ ምንኛ የከበራችሁ ናችሁ!”
    reason: lexical_alternative
