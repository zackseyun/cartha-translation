id: LUK.12.58
reference: Luke 12:58
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: am
  text: ከከሳሽህ ጋር ወደ ባለሥልጣን በምትሄድበት ጊዜ፣ በመንገድ ሳለህ ከእርሱ ነፃ ለመሆን[a] ጥረት አድርግ፤ አለዚያ ወደ ዳኛ ይጎትትሃል፣ ዳኛውም ለፍርድ አስፈጻሚው አሳልፎ ይሰጥሃል፣ አስፈጻሚውም ወደ ወኅኒ ይጥልሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእርሱ ጋር ጉዳዩን ለመጨረስ።” የግሪክኛው አገላለጽ ቃል በቃል “ከእርሱ ነፃ ለመሆን” የሚል ነው፤ በዚህ አውድ ግን ጉዳዩ ወደ ዳኛው ከመድረሱ በፊት መፍትሔ ማግኘትን መጠቆሙ አይቀርም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: ከሳሽ
  rationale: በዚህ የሕግ አውድ ክስ ያቀረበውን ተቃራኒ ወገን በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ἄρχοντα
  choice: ባለሥልጣን
  rationale: ቃሉ በሰፊው ገዢን ወይም ሥልጣን ያለውን ሰው ሊያመለክት ቢችልም፣ እዚህ የሲቪል ሥልጣን ያለውን ኃላፊ ያመለክታል፤ “ባለሥልጣን” ይህን ሳያጠብ ያስተላልፋል።
- source_word: δὸς ἐργασίαν
  choice: ጥረት አድርግ
  rationale: ይህ ፈሊጣዊ አገላለጽ ንቁና ትጉ እርምጃን ይጠይቃል፤ ምርጫው በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: ከእርሱ ነፃ ለመሆን
  rationale: የግሪክኛውን መሠረታዊ ምስልና ሊኖረው የሚችለውን አሻሚነት ይጠብቃል፤ “ጉዳዩን መጨረስ” የሚለው ዐውዳዊ ትርጉም በማስታወሻ ቀርቧል።
- source_word: κατασύρῃ
  choice: ይጎትትሃል
  rationale: ግሱ ያለውን የግዳጅና የኃይል ስሜት በግልጽ ሁኔታ ያስተላልፋል።
- source_word: κριτήν / κριτής
  choice: ዳኛ / ዳኛው
  rationale: በሕጋዊው አውድ ያለው መደበኛና ግልጽ ትርጉም ነው።
- source_word: παραδώσει
  choice: አሳልፎ ይሰጥሃል
  rationale: በፍርድ ሂደቱ ከአንድ ባለሥልጣን ወደ ሌላ መሰጠትን የግሪክኛውን ኃይል ጠብቆ ይገልጣል።
- source_word: πράκτορι / πράκτωρ
  choice: የፍርድ አስፈጻሚ / አስፈጻሚ
  rationale: ቃሉ የዳኛውን ውሳኔ የሚያስፈጽም፣ ዕዳ ሊያስከፍል ወይም ታሳሪን ሊረከብ የሚችል ሹም ያመለክታል፤ ይህ ምርጫ ከአንድ ዘመናዊ የሕግ ሥርዓት ልዩ ማዕረግ ጋር አያያዘውም።
- source_word: βαλεῖ εἰς φυλακήν
  choice: ወደ ወኅኒ ይጥልሃል
  rationale: βάλλω ያለውን ጠንካራና ሕያው አገላለጽ “ይጥልሃል” ይጠብቃል፤ “ወኅኒ” ደግሞ ክብር ያለውና የተለመደ የአማርኛ ቃል ነው።
- source_word: ὡς γὰρ
  choice: …በምትሄድበት ጊዜ
  rationale: በአማርኛ የምሳሌውን ሁኔታ ተፈጥሯዊ በሆነ ጊዜያዊ አንቀጽ ያቀርባል፤ ከቀደመው ንግግር ጋር ያለው አብራሪ ግንኙነት በአውዱ ይታያል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ ሳለህ
  rationale: ቀጥተኛውን የመንገድ ምስልና ፍርድ ቤት ከመድረስ በፊት እርምጃ የመውሰድን አስቸኳይነት ይጠብቃል።
theological_decisions:
- issue: የሕጋዊው ምክር መንፈሳዊ አተረጓጎም
  choice: በቁጥሩ ውስጥ ያለውን ሕጋዊ ምስል ሳይፈታ ማቆየት
  alternative: ከመጨረሻው ፍርድ በፊት ከእግዚአብሔር ጋር እርቅ እንዲደረግ የተሰጠ ግልጽ ጥሪ አድርጎ መተርጎም
  rationale: ሰፊው አውድ የመጨረሻ ፍርድን አስቸኳይነት ሊያመለክት ቢችልም፣ ቁጥሩ ራሱ ከሳሹን፣ ዳኛውንና ወኅኒውን ከተወሰኑ መንፈሳዊ ተዛማጆች ጋር አያስተዋውቅም። ስለዚህ ትርጉሙ የጽሑፉን ውጥረትና ክፍትነት ይጠብቃል።
