  text: ዳሩ ግን ምንም የተሸፈነ[a] ነገር ወደፊት የማይገለጥ የለም፤ ምንም የተሰወረ[b] ነገርም ወደፊት የማይታወቅ የለም[c]።
  philosophy: optimal-equivalence
  footnotes:
