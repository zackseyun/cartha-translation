    reason: lexical_alternative
  - marker: c
    text: ይህ ንግግር መገለጡ በአሁኑ ጊዜም ሆነ በመጨረሻው ፍርድ ሊሆን የሚችል ሰፊ ፍቺ አለው።
    reason: alternative_reading
