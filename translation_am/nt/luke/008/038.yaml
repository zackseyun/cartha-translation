  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: am
  text: አጋንንት ከእርሱ የወጡበት ሰው፣ ከኢየሱስ ጋር እንዲሆን ለመነው፤ ኢየሱስ ግን እንዲህ ብሎ ሸኘው፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: ይለምነው ነበር
  rationale: የግሱን ያልተቋረጠ ወይም ተደጋጋሚ ልመና የሚያመለክት ያለፈ ጊዜ አሠራር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ ἀνὴρ
  choice: ሰው
  rationale: በዐውዱ ቀድሞ የተጠቀሰውን ወንድ ያመለክታል፤ አማርኛው ‘ሰው’ በዚህ የትረካ ዐውድ ተፈጥሯዊ ነው።
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: አጋንንቱ የወጡለት
  rationale: ከዋናው ድርጊት በፊት መውጣታቸውን ያሳያል፤ ‘የወጡለት’ የግሪኩን ከሰውየው መውጣት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ δαιμόνια
  choice: አጋንንቱ
  rationale: የምንጩን የግል ሕልውና ያላቸው ክፉ መናፍስታዊ ፍጥረታት ማመልከቻ በቀጥታ የሚያስተላልፍ መደበኛ የአማርኛ የመጽሐፍ ቅዱስ ቃል ነው።
- source_word: εἶναι σὺν αὐτῷ
  choice: ከእርሱ ጋር እንዲሆን
  rationale: የግሪኩን ቀጥተኛ ትርጉም ያለ ተጨማሪ የመጓዝ ወይም የመቆየት ፍቺ ይጠብቃል።
- source_word: ἀπέλυσεν αὐτὸν
  choice: ሸኘው
  rationale: በዐውዱ ኢየሱስ የሰውየውን ልመና ሳይቀበል ወደ ሌላ ተግባር እንዲሄድ መላኩን በተፈጥሯዊና ከጭካኔ ነፃ ቋንቋ ይገልጣል።
- source_word: λέγων
  choice: እንዲህ ብሎ
  rationale: ቀጥሎ የሚመጣውን ቀጥተኛ ንግግር በተፈጥሯዊ የአማርኛ የትረካ አገባብ ያስተዋውቃል።
theological_decisions:
- issue: በአጋንንት ማስወጣት ዐውድ የδαιμόνια አተረጓጎም
  choice: አጋንንቱ
  alternative: ክፉ መናፍስቱ
  rationale: ጽሑፉ ከሰውየው የወጡ አጋንንታዊ ፍጥረታትን እንደ እውነተኛ ተዋናዮች ያቀርባል፤ ‘አጋንንቱ’ ይህን ከማደብዘዝ ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ δέ በአንቀጹ መጀመሪያ በተጨማሪ ‘አሁን’ አልተተረጎመም፤ የማነጻጸር ኃይሉ በሁለተኛው ክፍል ‘ግን’ ተገልጧል። ቀጣዩን ቀጥተኛ ንግግር ለማስተዋወቅ ፦ ተጠቅሟል።
