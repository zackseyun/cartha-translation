id: LUK.8.13
reference: Luke 8:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: am
  text: በዓለቱ ላይ ያሉት ደግሞ፥ ቃሉን ሲሰሙ በደስታ የሚቀበሉት ናቸው። እነዚህ ግን ሥር የላቸውም፤ ለጥቂት ጊዜ ያምናሉ፤ በፈተና ጊዜ[a] ግን ይወድቃሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በፈታኝ ሙከራ ጊዜ” ወይም “መከራ ሲመጣ።” የግሪኩ ቃል እንደ አውዱ ፈተናን፣ ፈታኝ ሙከራን ወይም መከራን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: በዓለቱ ላይ
  rationale: የግሪኩን ነጠላና ተጨባጭ የዓለት ምስል በቀጥታ ይጠብቃል፤ የመዝራቱ አውድ ከአካባቢው ግልጽ ነው።
- source_word: ἀκούσωσιν
  choice: ሲሰሙ
  rationale: ὅταν ከአኦሪስት ሰብጃንክቲቭ ጋር የሚሰጠውን አጠቃላይ ጊዜያዊ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετὰ χαρᾶς
  choice: በደስታ
  rationale: የስሜቱን ኃይል በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: δέχονται τὸν λόγον
  choice: ቃሉን ... የሚቀበሉት
  rationale: δέχομαιን ‘ይቀበላሉ’፣ λόγοςን ደግሞ የመጽሐፍ ቅዱስን የታወቀ አገላለጽ በመጠበቅ ‘ቃሉ’ ብሎ ያቀርባል።
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: ሥር የላቸውም
  rationale: የግሪኩን ነጠላ ‘ሥር’ እና የምሳሌውን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πρὸς καιρὸν
  choice: ለጥቂት ጊዜ
  rationale: እምነታቸው የተወሰነ ቆይታ ብቻ እንዳለው በግልጽ ያሳያል።
- source_word: πιστεύουσιν
  choice: ያምናሉ
  rationale: ግሱን በቀጥታና በገለልተኛ ሁኔታ ይተረጉማል፤ የእምነታቸውን ዶክትሪናዊ ዓይነት ከጽሑፉ በላይ አይወስንም።
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: በፈተና ጊዜ
  rationale: πειρασμός ሊያካትተው የሚችለውን ፈተና፣ መከራ ወይም ፈታኝ ሙከራ የሚል ሰፊ ትርጉም በአማርኛ ‘ፈተና’ ይጠብቃል፤ አማራጮቹም በማስታወሻ ተገልጸዋል።
- source_word: ἀφίστανται
  choice: ይርቃሉ
  rationale: በግፊት ጊዜ ከቀድሞው እምነት መለየትን ያመለክታል፤ ‘ክህደት’ የሚል ቴክኒካዊ ቃል ሳይጨምር የድርጊቱን ክብደት ይጠብቃል።
theological_decisions:
- issue: πιστεύουσιν እውነተኛ የማዳን እምነትን ወይስ ላዩን ብቻ የሆነ እምነትን ያመለክታል?
  choice: ‘ያምናሉ’ ተብሎ በገለልተኛ መንገድ ተተርጉሟል።
  alternative: ‘የሚያምኑ ይመስላሉ’ ወይም ‘በላዩ ብቻ ያምናሉ’
  rationale: ጥቅሱ ለጥቂት ጊዜ እንደሚያምኑና በኋላ እንደሚርቁ ይናገራል፤ ነገር ግን የእምነታቸውን የዶክትሪን ዓይነት አይገልጽም። ትርጉሙ ይህን ውጥረት አልፈታውም።
- issue: በዚህ አውድ የπειρασμός ትርጉም
  choice: በዋናው ጽሑፍ ‘ፈተና’ ተብሏል።
  alternative: ‘ፈታኝ ሙከራ’ ወይም ‘መከራ’
  rationale: የግሪኩ ቃል ውጫዊ መከራንም ሆነ ወደ ኃጢአት የሚስብ ፈተናን ሊያመለክት ይችላል። ‘ፈተና’ ይህን ስፋት በአንጻራዊነት ይጠብቃል።
