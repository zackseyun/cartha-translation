  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ጥቅም ላይ ውሏል። የዓለትና የሥር ምስሎች ተጠብቀዋል፤ የእምነትና የመራቅ ሥነ-መለኮታዊ ውጥረት በትርጉም አልተፈታም።
