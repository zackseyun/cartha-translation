  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: am
  text: ያዩት ሰዎችም፣ አጋንንት ይዘውት የነበረው ሰው እንዴት እንደዳነ[a] ነገሯቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደተፈወሰ» ወይም «ነፃ እንደወጣ»። የግሪኩ ግስ እንደ አውዱ ማዳንን፣ መፈወስን ወይም ነፃ ማውጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: ነገሯቸው
  rationale: ግሱ ያዩትን ነገር ለሌሎች ማስታወቅን ያመለክታል፤ «ነገሯቸው» በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የምስክሮቹን ዘገባ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ«ያዩት» ጋር የተያያዘው «-ም» ያለማጋነን ይህን ፍሰት ይገልጣል።
- source_word: αὐτοῖς
  choice: -አቸው (ነገሯቸው)
  rationale: የዘገባውን ተቀባዮች በግሱ ውስጥ በተፈጥሯዊ የአማርኛ አገባብ ያመለክታል።
- source_word: οἱ ἰδόντες
  choice: ያዩት ሰዎች
  rationale: ስማዊውን ቦዝ አንቀጽ «ያዩት ሰዎች» ብሎ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል፤ ግሪኩ ያዩትን ነገር በግልጽ ስለማይሰይም ተጨማሪ ነገር አልተጨመረም።
- source_word: πῶς
  choice: እንዴት
  rationale: የተከሰተውን ሁኔታ ወይም አድራጎት የሚያስገባውን የግሪኩን ትርጉም ቀጥታ ያስተላልፋል።
- source_word: ἐσώθη
  choice: እንደዳነ
  rationale: «ዳነ» በአማርኛም መዳንን፣ ከአደጋ መትረፍን ወይም ከሕመም መፈወስን ሊያመለክት ስለሚችል የσῴζωን ሰፊ የትርጉም ክልል በተሻለ ሁኔታ ይጠብቃል።
- source_word: ὁ δαιμονισθείς
  choice: አጋንንት ይዘውት የነበረው ሰው
  rationale: በአጋንንት ተጽዕኖ ሥር የነበረውን ሰው በግልጽ፣ ወቅታዊና ክብር ባለው አገላለጽ ይገልጣል፤ «የነበረው» የቀድሞው ሁኔታ እንዳበቃ ያሳያል።
theological_decisions:
- issue: በአጋንንት ከመያዝ ነፃ በወጣበት አውድ ἐσώθη (σῴζω) እንዴት እንደሚተረጎም
  choice: እንደዳነ
  alternative: እንደተፈወሰ፤ ነፃ እንደወጣ
  rationale: σῴζω ማዳንን፣ መታደግን፣ መፈወስን ወይም ነፃ ማውጣትን ሊያመለክት ይችላል። ዋናው ጽሑፍ «ዳነ» በማለት ይህን ስፋት ይጠብቃል፤ የአውዱ ትርጉሞች ደግሞ በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። አገባቡ ለተራ አንባቢ ተፈጥሯዊ ሲሆን የግሪኩን የትርጉም ስፋት አያጠብም።
