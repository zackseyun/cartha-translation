lexical_decisions:
- source_word: κρυπτὸν
  choice: የተሰወረ
  rationale: ቃሉ ከዓይን ወይም ከእውቀት የተሰወረውን ያመለክታል፤ ይህ ምርጫ ከሚቀጥለው መገለጥ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: φανερὸν γενήσεται
  choice: ግልጥ የማይሆን
  rationale: γίνομαι የሁኔታ ለውጥን ስለሚያመለክት፣ የተሰወረው ግልጥ ወደ መሆን እንደሚመጣ ያሳያል። የአማርኛው አሉታዊ አንጻራዊ አወቃቀር የወደፊቱን ትርጉም በተፈጥሮ ይሸከማል።
- source_word: ἀπόκρυφον
  choice: ምስጢር
  rationale: ከκρυπτόν ጋር ያለውን ትይዩነት እያስጠበቀ ትንሽ የቃላት ልዩነት ይሰጣል፤ በዚህ አውድም የተደበቀ ነገርን ያመለክታል።
- source_word: οὐ μὴ γνωσθῇ
  choice: የማይታወቅ
  rationale: በአጠቃላዩ አሉታዊ አንጻራዊ አወቃቀር ውስጥ፣ ምንም ምስጢር ሳይታወቅ እንደማይቀር ያሳያል። የግሪኩ οὐ μή ጠንካራ ክህደት በእግር ማስታወሻ ተገልጧል።
- source_word: εἰς φανερὸν ἔλθῃ
  choice: ይፋ የማይወጣ
  rationale: ይህ ተፈጥሯዊ የአማርኛ አገላለጽ አንድ የተደበቀ ነገር በግልጥ መታየቱንና መገለጡን ያስተላልፋል።
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ቁጥሩ ከቀደመው ንግግር ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በግልጥ ይጠብቃል።
theological_decisions:
- issue: የመገለጡ ንግግር ወሰን
  choice: የተሰወረውና ምስጢር የሆነው በመጨረሻ እንደሚገለጥ የሚናገር አጠቃላይ መርሕ
  alternative: የመጨረሻውን ፍርድ ብቻ የሚመለከት የፍጻሜ ዘመን መገለጥ፣ ወይም በአውዱ የኢየሱስን ትምህርት መገለጥና ለእርሱ የሚሰጠውን ምላሽ ብቻ የሚያመለክት ንባብ
  rationale: ጥቅሱ የመገለጡን ጊዜና ልዩ አፈጻጸም አይወስንም። ስለዚህ ትርጉሙ ሰፊውን አነጋገር ይጠብቃል እንጂ ለአንድ ብቻ ትርጓሜ አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጥ የሆነ አማርኛ ተጠቅሟል። የሁለቱ ሐረጎች ትይዩ አወቃቀር ተጠብቋል፤ “የተሰወረ” እና “ምስጢር” በመጠቀም የግሪኩ ቅርብ ትርጉምና ቀላል የቃላት ልዩነት ተወክሏል።
