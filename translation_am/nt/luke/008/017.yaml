base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: am
  text: ምክንያቱም ግልጥ የማይሆን[a] የተሰወረ ነገር የለም፤ እንዲሁም የማይታወቅ[b]ና ይፋ የማይወጣ[c] ምስጢር የለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የማይገለጥ።”
