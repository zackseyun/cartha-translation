  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: am
  text: ሴቲቱም ሳትታወቅ እንዳልቀረች ባየች ጊዜ፣ እየተንቀጠቀጠች መጥታ በፊቱ ወደቀች፤ ለምን እንደነካችውና እንዴት ወዲያው እንደተፈወሰች በሕዝብ ሁሉ ፊት ተናገረች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοῦσα
  choice: ባየች ጊዜ
  rationale: የአኦሪስት አካፋይ ግስ ለዋናው ድርጊት ጊዜያዊ ሁኔታን ያቀርባል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οὐκ ἔλαθεν
  choice: ድርጊቷ እንዳልተሰወረ
  rationale: λανθάνω በዚህ ዐውድ ከማስተዋል ሳይደርስ መቅረትን ወይም ተሰውሮ መቆየትን ያመለክታል። በአማርኛ ግልጽ እንዲሆን የተሰወረው ነገር ድርጊቷ መሆኑ ተገልጿል።
- source_word: τρέμουσα
  choice: እየተንቀጠቀጠች
  rationale: የሴቲቱን አካላዊና ስሜታዊ ሁኔታ ሳይገድበው በሕያው ሁኔታ ያስተላልፋል።
- source_word: προσπεσοῦσα αὐτῷ
  choice: በፊቱ ወደቀች
  rationale: προσπίπτω በአንድ ሰው ፊት መውደቅን ያመለክታል፤ በግሪኩ በግልጽ ያልተጠቀሰውን ‘እግር’ አይጨምርም።
- source_word: δι’ ἣν αἰτίαν
  choice: ለምን
  rationale: ‘በምን ምክንያት’ የሚለውን ትርጉም በአጭርና ተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἥψατο αὐτοῦ
  choice: እንደነካችው
  rationale: ἅπτομαι ከጄኒቲቭ ጋር ‘መንካት’ ማለት ነው፤ ቀድሞ የሆነው ድርጊት በአማርኛው የግስ አወቃቀር ተጠብቋል።
- source_word: ἀπήγγειλεν
  choice: ተናገረች
  rationale: ለሕዝብ ፊት ሪፖርት ማድረግን ወይም መግለጽን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: በሕዝቡ ሁሉ ፊት
  rationale: ἐνώπιον የሚለውን ‘በፊት/በተገኙበት’ ትርጉምና παντὸς ያለውን ሁሉን አቀፍነት ይጠብቃል።
- source_word: ὡς ἰάθη
  choice: እንዴት እንደተፈወሰች
  rationale: ὡς የፈውሱን ሁኔታ ወይም እውነታ ወደ ተናገረችው ይዘት ያስገባል፤ ‘እንዴት’ የዚህን ተግባር ይጠብቃል።
- source_word: παραχρῆμα
  choice: ወዲያው
  rationale: ፈውሱ ያለ መዘግየት መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የሴቲቱ በሕዝብ ፊት መናገር ባሕርይ
  choice: ጥቅሱ እንደሚለው መንቀጥቀጧን፣ በፊቱ መውደቋንና በሕዝብ ፊት መናገሯን በትረካዊ መንገድ ማቅረብ
  alternative: ድርጊቷን በግልጽ ‘ንስሐ’ ወይም ‘አምልኮ’ ብሎ መግለጽ
  rationale: ግሪኩ አቋሟ ክብርን ወይም ልመናን ሊያመለክት ቢችልም፣ ንስሐ ወይም አምልኮ የሚሉ ቃላትን በግልጽ አይጠቀምም፤ ስለዚህ ሥነ መለኮታዊ ማስፋፊያ አልተጨመረም።
