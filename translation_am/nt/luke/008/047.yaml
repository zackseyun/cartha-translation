  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የድርጊት ቅደም ተከተልና የፈውሱ ፈጣንነት ተጠብቀዋል።
