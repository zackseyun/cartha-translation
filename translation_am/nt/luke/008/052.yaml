review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two ongoing mourning actions, the universal subject, and Jesus’ sleep imagery. However, it omits γάρ (‘for’), which explicitly gives the reason for the command not to weep.
  naturalness: The wording is generally clear modern standard Amharic. The plural subject ሁሉም requires the plural auxiliary ነበሩ, not singular ነበር. The revised causal-negative construction is natural and concise.
  terminology: እያለቀሱና እያዘኑ appropriately conveys weeping and mourning without adding the physically implicit breast-beating. ተኝታለች retains the source’s unexplicated sleep metaphor. The footnote distinguishes the idiomatic alternative ‘is asleep’ without resolving the narrative’s theological tension.
  issues:
  - severity: medium
    issue: The causal particle γάρ is not represented.
    rationale: The source reads ‘Do not weep, for she has not died but is sleeping.’ Amharic አልሞተችምና naturally conveys the explanatory force of γάρ.
  - severity: medium
    issue: Number agreement is incorrect in ሁሉም ... ነበር.
    rationale: With the plural human subject ሁሉም, modern standard Amharic requires ነበሩ.
  - severity: low
    issue: The footnote anchor is placed after the reporting clause rather than directly after the expression it explains.
    rationale: Placing [a] immediately after ተኝታለች makes its referent unambiguous.
