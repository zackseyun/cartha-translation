base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: am
  text: ሁሉም ስለ እርሷ እያለቀሱና እያዘኑ ነበሩ። እርሱ ግን፣ “አታልቅሱ፤ አልሞተችምና፣ ተኝታለች[a] እንጂ።” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ተኝታለች” የሚለው “ተኝታ ናት” ተብሎም ሊተረጎም ይችላል። ኢየሱስ በሞት እና በመመለስ አውድ እንቅልፍን እንደ ምሳሌያዊ አገላለጽ ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: እያለቀሱ ነበር
  rationale: የግሱን ቀጣይነት የሚያሳየውን ያልተፈጸመ ያለፈ ጊዜ (imperfect) በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πάντες
  choice: ሁሉም
  rationale: የሐዘንተኞቹን ሁሉን አቀፍ መጠን በግልጽና ተፈጥሯዊ ቃል ያስተላልፋል።
- source_word: ἐκόπτοντο αὐτήν
  choice: ስለ እሷ ... እያዘኑ ነበር
  rationale: በሐዘን አውድ κόπτομαι ሙሾንና ራስን መምታትን ሊያካትት ይችላል፤ “እያዘኑ” ግን ጽሑፉ በግልጽ ያልገለጸውን አካላዊ ድርጊት ሳይጨምር ዋናውን ትርጉም ያቀርባል።
- source_word: Μὴ κλαίετε
  choice: አታልቅሱ
  rationale: በዚህ አውድ እየተካሄደ ያለውን ልቅሶ እንዲያቆሙ የሚሰጠውን ትእዛዝ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: አል...ም፣ ... እንጂ
  rationale: የምክንያትና የንጽጽር ግንኙነቱን በተፈጥሯዊው የአማርኛ “አይደለም ... እንጂ” አወቃቀር ያስተላልፋል።
- source_word: ἀπέθανεν
  choice: አልሞተችም
  rationale: የሞትን ድርጊትና የአሁኑን ውጤቱን በአማርኛ ተፈጥሯዊ በሆነ ፍጹም አሉታዊ ግስ ይገልጣል።
- source_word: καθεύδει
  choice: ተኝታለች
  rationale: የአሁን ጊዜውን ሁኔታና ኢየሱስ የተጠቀመበትን የእንቅልፍ አገላለጽ ሳያብራራ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ “አልሞተችም፣ ተኝታለች እንጂ” ማለቱ
  choice: የኢየሱስን ቀጥተኛ አገላለጽ በዋናው ጽሑፍ እንዳለ ማቆየት
  alternative: “ሞቷ ዘላቂ አይደለም” ወይም “የሞተች ትመስላለች እንጂ በእውነት ተኝታለች” ብሎ መተርጎም
  rationale: የግሪክ ጽሑፉ በሞትና በእንቅልፍ መካከል ያለውን የትርጉምና የትረካ ውጥረት አይፈታውም። ስለዚህ ትርጉሙም ልጅቱ በቅርቡ እንደምትነሣ በትርጓሜ በመጨመር ወይም ሞቷን በመካድ ይህን ውጥረት ሊያስወግድ አይገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “እያለቀሱና እያዘኑ” የሁለቱን የግሪክ ግሶች ልዩነትና ቀጣይነት ይጠብቃል።
