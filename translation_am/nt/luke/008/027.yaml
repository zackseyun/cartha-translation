  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: am
  text: እርሱ ወደ የብስ በወጣ ጊዜ[a]፣ ከከተማው አጋንንት ያሉበት አንድ ሰው አገኘው[b]። እርሱም ለረጅም ጊዜ ልብስ አይለብስም ነበር፤ በቤት ውስጥም አይኖርም ነበር፣ ነገር ግን በመቃብሮች መካከል ይኖር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ወደ ምድር በወጣ ጊዜ»፤ ወይም፣ «ወደ ዳርቻ በወጣ ጊዜ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በአጋንንት ተይዞ የነበረ አንድ ሰው»። የግሪኩ ቃል በቃል፣ «አጋንንት ያሉበት» ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: እርሱም ወደ የብስ በወጣ ጊዜ
  rationale: የድርጊቱን ጊዜያዊ ግንኙነት ያሳያል፤ ‘ወደ የብስ ወጣ’ ከውኃ ላይ ወደ ምድር መውጣቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὑπήντησεν
  choice: አገኘው
  rationale: የመገናኘትን ቀጥተኛ የትረካ ድርጊት በቀላልና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀνήρ τις ἐκ τῆς πόλεως
  choice: ከከተማው የሆነ አንድ ሰው
  rationale: τις የሚያሳየውን ያልተጠቀሰ ግለሰብነትና ἀνήρ የሚያሳየውን ወንድ ሰው በተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ἔχων δαιμόνια
  choice: በሰውየውም አጋንንት ነበሩ
  rationale: ‘አጋንንት ነበሩበት’ የሚለውን ቀጥተኛ ሐሳብ ይጠብቃል፤ ‘ተገዝቶ ነበር’ ወይም ‘ተይዞ ነበር’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: χρόνῳ ἱκανῷ
  choice: ለረጅም ጊዜ
  rationale: ከፍተኛ የጊዜ ቆይታን በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: ልብስ አልለበሰም ነበር
  rationale: ልብስ አለመልበሱንና ይህም ለተጠቀሰው ጊዜ የቆየ ሁኔታ መሆኑን ይገልጣል።
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν
  choice: በቤትም አይኖርም ነበር፣ ነገር ግን በመቃብሮች መካከል ይኖር ነበር
  rationale: የኢምፐርፌክት ግሱን ተደጋጋሚ ወይም የቀጠለ ሁኔታ ይጠብቃል፤ μνήμασιν የቀብር ስፍራዎችን በግልጽ ያመለክታል።
theological_decisions:
- issue: δαιμόνια የሚለው ቃል አተረጓጎም
  choice: አጋንንት
