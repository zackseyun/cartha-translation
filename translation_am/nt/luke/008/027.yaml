  choice: በሰውየውም አጋንንት ነበሩ
  alternative: በአጋንንት ተይዞ ነበር
  rationale: የግሪኩን ‘አጋንንት ያሉበት’ የሚል ቅርጽ በቅርብ ይከተላል፤ የቁጥጥርን መጠን ከምንጩ በላይ አይወስንም።
