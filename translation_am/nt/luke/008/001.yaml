  rationale: κατά ከነጠላ ስሞች ጋር ያለውን ከቦታ ወደ ቦታ የመዘዋወር አከፋፋይ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κηρύσσων
