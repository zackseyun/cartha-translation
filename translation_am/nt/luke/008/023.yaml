base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: am
  text: በጀልባ ሲጓዙ እንቅልፍ ያዘው። የነፋስ ዐውሎም በሐይቁ ላይ ወረደ፤ ውኃም እየሞላባቸው[a] ነበር፣ ለአደጋም ተጋልጠው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየተሞሉ ነበር”፤ ይህም ጀልባው በውኃ እየተሞላ እንደነበር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: እየተጓዙም ሳሉ
  rationale: የግሪኩ ጄኒቲቭ አብሶሉትና የአሁን ጊዜ አጋዥ ግስ በጀርባ እየቀጠለ ያለውን ድርጊት ያሳያሉ፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἀφύπνωσεν
  choice: እንቅልፍ ወሰደው
  rationale: የአኦሪስት ግሱን ወደ እንቅልፍ መግባት አመልካች ትርጉም ይገልጣል፤ ባለቤቱ ኢየሱስ መሆኑ ከአውዱ ይታወቃል።
- source_word: κατέβη
  choice: ወረደ
  rationale: ነፋሱ ወደ ሐይቁ ከፍ ካለ ስፍራ የመውረዱን ምስል በቀጥታ ይጠብቃል።
- source_word: λαῖλαψ ἀνέμου
  choice: የነፋስ ዐውሎ
  rationale: ኃይለኛና ድንገተኛ ነፋሳማ ማዕበልን ያመለክታል፤ ዝናብን ሳይጨምር በነፋሱ ላይ ያለውን አጽንዖት ይጠብቃል።
- source_word: εἰς τὴν λίμνην
  choice: ወደ ሐይቁ
  rationale: የεἰςን አቅጣጫዊ ኃይል በቀጥታ ይጠብቃል፤ ከ‘ወረደ’ ጋርም በአማርኛ ተፈጥሯዊ ነው።
- source_word: συνεπληροῦντο
  choice: ጀልባዋም በውኃ እየተሞላች
  rationale: ብዙ ቁጥር ያለው ግስ በጀልባው ያሉትን ሰዎች በጀልባዋ መሞላት የተነሣ እንደተጎዱ ሊያመለክት ይችላል። ግልጽ አማርኛ ለማቅረብ በአውዱ የተገመተው ‘ጀልባ’ ተገልጿል፣ አማራጩም በማስታወሻ ተጠብቋል።
- source_word: ἐκινδύνευον
  choice: ለአደጋ ተጋለጡ
  rationale: እየቀጠለ የነበረውን ከባድ አደጋ በግልጽና ዘመናዊ አማርኛ ያስተላልፋል።
