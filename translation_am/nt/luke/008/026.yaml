  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: am
  text: እነርሱም በጀልባ ወደ ጌራሴናውያን[a] አገር ደረሱ፤ ይህም ከገሊላ ማዶ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎችና ተጓዳኝ የወንጌል ክፍሎች «ጋዳራውያን» ወይም «ጌርጌሴናውያን» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: በጀልባ … ደረሱ
  rationale: ግሱ በውኃ ተጉዞ ወደ አንድ ስፍራ መድረስን ያመለክታል። በአማርኛ «በጀልባ … ደረሱ» የጉዞውን መንገድና መድረሱን ተፈጥሯዊ በሆነ አነጋገር ያስተላልፋል፤ κατά የሚያስገድደው የቁልቁለት አቅጣጫ እዚህ ስለሌለ «ወደ ታች» አልተጨመረም።
- source_word: χώραν
  choice: አገር
  rationale: χώρα በዚህ ዐውድ የሕዝብን አካባቢ ወይም ግዛት ያመለክታል። «አገር» እዚህ ዘመናዊ ሉዓላዊ መንግሥትን ሳይሆን አካባቢን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: Γερασηνῶν
  choice: ጌራሴናውያን
  rationale: የግሪክ የነዋሪዎች ስያሜ በአማርኛ የስም አጻጻፍ ተቀርጾ ቀርቧል።
- source_word: ἥτις
  choice: ይህም
  rationale: የአካባቢውን ገላጭ መረጃ ከቀደመው ሐረግ ጋር በተፈጥሯዊ አማርኛ ያያይዛል።
- source_word: ἀντιπέρα
  choice: ባሻገር
  rationale: ቃሉ «በተቃራኒው/ከወዲያኛው ወገን» የሚለውን ስፍራዊ ግንኙነት ይገልጣል። «ከገሊላ ባሻገር» በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: Γαλιλαίας
  choice: ገሊላ
  rationale: በአማርኛ የተለመደው የቦታው ስም አጻጻፍ ነው።
