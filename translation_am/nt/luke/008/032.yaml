  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: am
  text: 'በዚያም በተራራው ላይ[b] ትልቅ የአሳማ መንጋ[a] እየተመገበ ነበር። እነርሱም[c] ወደ እነዚያ አሳሞች እንዲገቡ እንዲፈቅድላቸው ለመኑት፤ እርሱም ፈቀደላቸው።


    [a] ወይም፣ «ብዙ አሳሞች» ወይም «እጅግ ብዙ አሳሞች ያሉበት መንጋ»።

    [b] ወይም፣ «በተራራው ዳገት ላይ»።

    [c] «እነርሱ» የሚለው በአውዱ የተጠቀሱትን አጋንንት፣ ማለትም ርኩሳን መናፍስትን፣ ያመለክታል፤ አንዳንድ ትርጉሞች «አጋንንቱም» ብለው በግልጽ ይተረጉሙታል።'
  philosophy: optimal-equivalence
