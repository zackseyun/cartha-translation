lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν τὸν Ἰησοῦν
  choice: ኢየሱስም በተመለሰ ጊዜ
  rationale: ἐν + አንቀጽ ያለው የግስ ስም ጊዜን የሚገልጽ ነው፤ «በ…ጊዜ» በአማርኛ ተፈጥሯዊ ነው። δέ የትረካውን ቀጣይነት በ«ም» ያሳያል፤ የሌለውን «አሁን» አያክልም።
- source_word: ὑποστρέφειν
  choice: በተመለሰ
  rationale: ግሱ ወደነበረበት መመለስን ያመለክታል፤ «ተመለሰ» ግልጽና ዘመናዊ አገላለጽ ነው።
- source_word: ἀπεδέξατο
  choice: ተቀበሉት
  rationale: ግሱ መቀበልን ወይም በመልካም ስሜት መቀበልን ሊያመለክት ይችላል። «ተቀበሉት» የግሱን መሠረታዊ ትርጉም ይጠብቃል፤ የአውዱ አዎንታዊ ስሜት በማስታወሻ ተገልጿል።
- source_word: ὁ ὄχλος
  choice: ሕዝቡ
  rationale: በአውዱ የተሰበሰበውን ሰው ብዛት ያመለክታል፤ «ሕዝቡ» የተለመደና ክብር ያለው ዘመናዊ አማርኛ ነው።
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: ሁሉም እየጠበቁት ነበርና
  rationale: γάρ የመቀበላቸውን ምክንያት በ«ና» ያሳያል። ቀጣይ ድርጊቱ «እየጠበቁት ነበር» ተብሎ ተጠብቋል፤ πάντεςም «ሁሉም» ተብሎ በግልጽ ተተርጉሟል።
- source_word: Ἰησοῦν
  choice: ኢየሱስ
  rationale: ስሙ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርቧል።
