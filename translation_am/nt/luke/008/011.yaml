  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: am
  text: ምሳሌውም ይህ ነው፤ ዘሩ የእግዚአብሔር ቃል ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የምሳሌው ትርጉም ይህ ነው።” ግሪኩ በቀጥታ “ምሳሌው ይህ ነው” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ነው
  rationale: ግሱ የመሆንን ቀጥተኛ አገባብ ይገልጣል፤ ‘ትርጉሙ ነው’ ብሎ ከመተርጎም ይልቅ የግሪኩን አወቃቀር ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: የሐሳብ ሽግግሩን በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያሳያል፤ ጊዜያዊ ‘አሁን’ አያስገባም።
- source_word: αὕτη ἡ παραβολή
  choice: ምሳሌው ይህ ነው
  rationale: ግሪኩ በቀጥታ ‘ምሳሌው ይህ ነው’ ይላል፤ በዐውዱ ማብራሪያውን ቢያስተዋውቅም ‘ትርጉሙ’ የሚል ያልተጻፈ ስም አልተጨመረም።
- source_word: σπόρος
  choice: ዘሩ
  rationale: ነጠላውን ስም እና የምሳሌውን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: λόγος
  choice: ቃል
  rationale: በዚህ ዐውድ የእግዚአብሔርን የተነገረ መልእክት ያመለክታል፤ ‘ቃል’ የመጽሐፍ ቅዱስን አገላለጽና የቃሉን ቀጥተኛነት ይጠብቃል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት/ዝምድና አገባብ በቀጥታ ያሳያል፤ ‘ከእግዚአብሔር የመጣ’ የሚለውን ትርጓሜ አይጨምርም።
theological_decisions:
- issue: παραβολήን በቀጥታ ‘ምሳሌ’ ብሎ መተርጎም ወይስ በዐውዱ መሠረት ‘የምሳሌው ትርጉም’ ብሎ ማስፋት
  choice: ምሳሌው ይህ ነው
  alternative: የምሳሌው ትርጉም ይህ ነው
  rationale: ኢየሱስ ምሳሌውን እየተረጎመ ቢሆንም፣ የግሪኩ ጽሑፍ ‘ይህ ምሳሌ ነው’ የሚለውን ቅርጽ ይዟል። ትርጉሙ ያንን እውነተኛ የአገላለጽ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ምሳሌውም’ የሚለው ቅጽ δὲን እንደ ቀላል የሐሳብ ሽግግር ያቀርባል።
