  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: am
  text: ሌላውም በዓለቱ ላይ[a] ወደቀ፤ ከበቀለ በኋላም እርጥበት ስላልነበረው ደረቀ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ‘ዓለት’ የሚለውን ቃል በነጠላ ቁጥር ይጠቀማል፤ ስለዚህ ዘሩ በዓለታማ ስፍራ ላይ መውደቁን ከሚገልጸው ሰፊ አነጋገር ይልቅ በዓለት ላይ የወደቀበትን ምስል ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
