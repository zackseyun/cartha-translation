  choice: ሌላውም
  rationale: በምሳሌው ቅደም ተከተል የሚቀጥለውን ዘር ያመለክታል፤ ‘ሌላውም’ በአማርኛ ተፈጥሯዊ ሲሆን καίንም ‘-ም’ ያሳያል።
- source_word: κατέπεσεν
  choice: ወደቀ
  rationale: የዘሩን መውደቅ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπὶ τὴν πέτραν
  choice: በዓለቱ ላይ
  rationale: πέτρα ነጠላ ቁጥር ያለው ‘ዓለት’ ነው፤ ‘ድንጋያማ መሬት’ ብሎ ሳያሰፋ የግሪኩን ግልጽ ምስልና የተወሰነ አመልካች ይጠብቃል።
- source_word: φυὲν
  choice: ከበቀለ በኋላ
  rationale: ተሳቢው ከዋናው ግስ በፊት የተፈጸመውን የዘር መብቀል ያሳያል፤ ይህ አተረጓጎም የጊዜውን ቅደም ተከተል በግልጽ ያቀርባል።
- source_word: ἐξηράνθη
  choice: ደረቀ
  rationale: በዚህ የእፅዋት አውድ ‘ደረቀ’ የሚለው ተፈጥሯዊ ሲሆን የእርጥበት ማጣትን በትክክል ያሳያል።
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ስላልነበረው
  rationale: διά ከአንቀጻዊ የግስ ስም ጋር የሚገልጸውን ምክንያት ‘ስለ-’ በሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: ἰκμάδα
  choice: እርጥበት
  rationale: ለእድገት የሚያስፈልገውን እርጥበት በግልጽና በዘመናዊ አማርኛ ይገልጻል፤ ‘ጭማቂ’ ከማለት ይልቅ የቃሉን ስፋት ይጠብቃል።
