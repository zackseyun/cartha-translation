- source_word: διέταξεν
  choice: አዘዘ
  rationale: ቃሉ ሥልጣን ያለውን መመሪያ ያመለክታል፤ «አዘዘ» ይህን በአጭርና በግልጽ ሁኔታ ይጠብቃል።
- source_word: αὐτῇ δοθῆναι φαγεῖν
