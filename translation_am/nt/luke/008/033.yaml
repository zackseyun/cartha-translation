  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: am
  text: አጋንንቱም ከሰውየው ወጥተው በእሪያዎቹ ውስጥ ገቡ፤ መንጋውም ቁልቁለቱን[a] ተንደርድሮ ወደ ሐይቁ ገባና በውኃው ሰጥሞ ሞተ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ገደሉን ወርዶ” ወይም “ከአፋፍ ወርዶ”፤ የግሪኩ ቃል ከፍ ያለ ቁልቁለትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: ወጥተው
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች አንቀጽ አጋንንቱ ከሰውየው ከወጡ በኋላ ወደ እሪያዎቹ እንደገቡ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δαιμόνια
  choice: አጋንንቱ
  rationale: ቃሉ በትክክል አጋንንትን ያመለክታል፤ ‘ርኩሳን መናፍስት’ በሚል ተዛማጅ ግን የተለየ አገላለጽ አልተተካም።
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ከሰውየው
  rationale: በትረካው ቀደም ሲል የተጠቀሰውን የተወሰነ ሰው ያመለክታል።
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: ወደ እሪያዎቹ ገቡ
  rationale: ወደ እንስሳቱ ውስጥ የተደረገውን እንቅስቃሴ ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὥρμησεν
  choice: ተንደርድሮ
  rationale: ድንገተኛና ኃይለኛ እንቅስቃሴን ያሳያል፤ የመንጋውን ዓላማ ከጽሑፉ በላይ አይተረጉምም።
- source_word: ἡ ἀγέλη
  choice: መንጋው
  rationale: ለእሪያዎቹ ስብስብ ግልጽና የተለመደ የአማርኛ የጋራ ስም ነው።
- source_word: κατὰ τοῦ κρημνοῦ
  choice: ቁልቁለቱን
  rationale: ወደ ታች በሚወርድ ከፍ ያለ ተዳፋት ላይ የተደረገውን እንቅስቃሴ ይገልጣል፤ የግድ ቀጥ ያለ ገደል እንደነበር አይወስንም።
- source_word: λίμνην
  choice: ሐይቁ
  rationale: ሉቃስ እዚህ λίμνη የሚለውን ‘ሐይቅ’ ትርጉም ያለውን ቃል ተጠቅሟል፤ ‘ባሕር’ ተብሎ አልተተረጎመም።
- source_word: ἀπεπνίγη
  choice: ሰጠመ
  rationale: መንጋው ወደ ውኃው ገብቶ በመስጠም መሞቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በአጋንንት የተያዘውን ሰው በሚገልጸው ትረካ δαιμόνια የሚለውን መተርጎም
  choice: አጋንንቱ
  alternative: ርኩሳን መናፍስት
  rationale: የግሪኩ ጽሑፍ δαιμόνια ይላል፤ ስለዚህ ተዛማጅ ቢሆንም የተለየውን ‘ርኩሳን መናፍስት’ አገላለጽ በመተካት ተጨማሪ ሥነ መለኮታዊ ጥላ አልገባም።
- issue: κρημνός የሚያመለክተው የመሬት ቅርጽ ምን ያህል የተወሰነ መሆኑ
  choice: ቁልቁለቱ
  alternative: ገደሉ / አፋፉ
  rationale: ቃሉ ከፍ ያለ ቁልቁለትን ሊያመለክት ቢችልም የግድ ቀጥ ያለ ገደል እንደነበር አያስገድድም፤ ‘ቁልቁለቱ’ የቦታውን ገጽታ ያለ ማጋነን ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የድርጊት ቅደም ተከተል ‘ወጥተው…ገቡ’ በሚል ተጠብቋል፤ ነጠላ የጋራ ስም የሆነው ‘መንጋው’ ከነጠላ ግሶች ጋር ተስማምቷል። የግርጌ ማስታወሻው በሚመለከተው ‘ቁልቁለቱን’ ቃል ላይ ተያይዟል።
