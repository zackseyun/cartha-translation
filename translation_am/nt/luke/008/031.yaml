  rationale: አውዱ ክፉ መናፍስት ኢየሱስን ሲለምኑና በሥልጣኑ እንዳያዝዛቸው ሲፈሩ ያሳያል። «ጥልቁ» ይህን መንፈሳዊና ዓለማቀፋዊ ገጽታ ይጠብቃል፤ ሉቃስ ከተናገረው በላይ ግን ቦታውን አይተረጉምም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ነበር» የግሪክኛውን ቀጣይ ድርጊት ያሳያል፤ የግስ ብዙ ቁጥር ቅጥያዎችም ተናጋሪዎቹ ብዙ መሆናቸውን ይጠብቃሉ።
