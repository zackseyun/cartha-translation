  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: am
  text: ወደ ጥልቁ[a] እንዲሄዱ እንዳያዛቸው አጥብቀው ይለምኑት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ወደ ጥልቅ ስፍራው»። የግሪክኛው ቃል እጅግ ጥልቅ የሆነን ስፍራ ሊያመለክት ይችላል፤ እዚህ ግን ክፉ መናፍስት የሚታሰሩበትን ጥልቅ ስፍራ የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: አጥብቀው ይለምኑት ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ የቀጠለ ወይም የተደጋገመ ልመናን ያሳያል፤ «አጥብቀው ይለምኑት ነበር» የልመናውን ጽናትና ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπιτάξῃ
  choice: እንዳያዝዛቸው
  rationale: ግሱ በሥልጣን የሚሰጥን ትእዛዝ ያመለክታል፤ «ማዘዝ» የኢየሱስን ሥልጣን በግልጽ ይጠብቃል።
- source_word: ἄβυσσον
  choice: ጥልቁ
  rationale: ቃሉ እጅግ ጥልቅ የሆነን ስፍራ ወይም ጥልቅ ጉድጓድ ሊያመለክት ይችላል፤ በዚህ አውድ የክፉ መናፍስት የሚታሰሩበትን ስፍራ ያመለክታል። «ጥልቁ» ቀጥተኛ ሆኖ የቃሉን ምሥጢራዊ ስፋት ሳያጠብ ይጠብቃል።
- source_word: ἀπελθεῖν
  choice: እንዲሄዱ
  rationale: ወደተጠቀሰው መድረሻ መንቀሳቀስን በቀላሉና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα μὴ
  choice: እንዳያዝዛቸው
  rationale: ከልመና ግስ በኋላ የሚመጣው ሐረግ የጠየቁትን ነገር ይገልጣል፤ የአማርኛው «እንዳይ-» አወቃቀር ይህን በተፈጥሯዊነት ያስተላልፋል።
- source_word: αὐτοῖς
  choice: -አቸው
  rationale: በ«እንዳያዝዛቸው» ውስጥ ያለው የተሳቢ ቅጥያ ትእዛዙ የሚመለከታቸውን መናፍስት በግልጽ ያመለክታል።
theological_decisions:
- issue: በክፉ መናፍስት አውድ የἄβυσσος ትርጉም
  choice: «ጥልቁ»—ክፉ መናፍስት የሚታሰሩበት ወይም ፍርድን የሚጠብቁበት ልዩ ስፍራን የሚጠቁም
