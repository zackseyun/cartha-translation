  source_fidelity: The draft accurately distinguishes evil spirits from sicknesses and retains the prior-completed departure of seven demons. However, the wording for Mary's designation has a feminine agreement problem, and the current rendering of ἀφ’ ἧς is less explicit than the Greek's “from whom.”
  naturalness: Most of the Amharic is clear and suitable for modern standard usage. “መግደላዊት የምትባለው” is not grammatically natural for Mary; “መግደላዊት የምትባል” is idiomatic and unambiguous.
  terminology: “ክፉ መናፍስት,” “በሽታዎች,” and “አጋንንት” are appropriate and preserve the source's distinctions. “መግደላዊት” is an established designation for Magdalene.
  issues:
  - severity: medium
    issue: Gender/agreement error in “መግደላዊት የምትባለው ማርያም.”
    rationale: The relative form ending in -ው is not appropriate with the feminine referent Mary. The revised wording uses the natural feminine-neutral attributive construction “መግደላዊት የምትባል ማርያም.”
  - severity: low
    issue: “የወጡላት” does not state the separation relation as explicitly as ἀφ’ ἧς.
    rationale: Although understandable in context, adding “ከእርሷ” directly represents “from whom” and avoids any possible reading of the dative suffix as merely affected-person language.
