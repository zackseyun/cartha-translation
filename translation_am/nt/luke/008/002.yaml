source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: am
  text: እንዲሁም ከክፉ መናፍስትና ከበሽታዎች የተፈወሱ አንዳንድ ሴቶች[a]፤ ሰባት አጋንንት ከእርሷ ወጥተው የነበሩባት[b] መግደላዊት የምትባል ማርያም፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የተወሰኑ ሴቶች»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ሰባት አጋንንት ከእርሷ ወጥተው ነበር»።
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: አንዳንድ ሴቶች
  rationale: τινες የተወሰነ ያልሆነ የሴቶች ክፍልን ያመለክታል፤ «አንዳንድ ሴቶች» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: τεθεραπευμέναι
  choice: የተፈወሱ
  rationale: ከἦσαν ጋር ያለው ፍጹም ተደራጊ አሳታፊ ከዚያ በፊት የተፈጸመና ውጤቱ የቀጠለ ፈውስን ያሳያል፤ «የተፈወሱ» መንፈሳዊውንም ሆነ አካላዊውን መከራ ለማካተት ተስማሚ ነው።
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: ከክፉ መናፍስት
  rationale: πονηρῶν «ክፉ» ማለት ነው፤ ጽሑፉ ἀκάθαρτος («ርኩስ») ስለማይል ቀጥተኛው ትርጉም ተመርጧል።
- source_word: καὶ ἀσθενειῶν
  choice: ከበሽታዎች
  rationale: ἀσθένεια በዚህ ዐውድ የአካል ድካምን ወይም ሕመምን ያመለክታል፤ «በሽታዎች» ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: መግደላዊት የምትባለው
  rationale: καλουμένη ማርያምን «መግደላዊት» በሚለው መጠሪያ ይለያታል፤ ይህ አገላለጽ ተፈጥሯዊና ታማኝ ነው።
- source_word: ἀφ’ ἧς
  choice: የወጡላት
  rationale: የአማርኛው -ላት ቅጥያ አጋንንቱ ከእርሷ መውጣታቸውን በተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: δαιμόνια ἑπτὰ
  choice: ሰባት አጋንንት
  rationale: δαιμόνια ከቀደመው ሰፊ ትርጉም ካለው πνεύματα በተለየ ሁኔታ አጋንንትን በተለይ ያመለክታል፤ ቁጥሩም በቀጥታ ተጠብቋል።
- source_word: ἐξεληλύθει
  choice: የወጡላት
  rationale: የἐξέρχομαι የቀድሞ ፍጹም ቅርጽ ከትረካው ጊዜ በፊት መውጣታቸውን ያሳያል፤ አማርኛው አገላለጽ ይህን እንደተፈጸመ ክስተት በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: የአጋንንታዊ መከራ ቋንቋ አተረጓጎም
  choice: «ክፉ መናፍስት» እና «አጋንንት» የሚሉት እንደ ግላዊ መንፈሳዊ ፍጥረታት ቋንቋ ተጠብቀዋል።
  alternative: ቃላቱን የሥነ ልቦና ወይም የአካል ሕመም ዘይቤ ብቻ አድርጎ መተርጎም።
  rationale: ግሪክኛው πνευμάτων πονηρῶν እና δαιμόνιαን ከἀσθενειῶν ይለያል፤ ስለዚህ ትርጉሙ መንፈሳዊ መከራንና አካላዊ በሽታን ሳያቀላቅል የጽሑፉን ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ አወቃቀር የቀደመውን አረፍተ ነገር የሚቀጥል ዝርዝር መሆኑን ለማሳየት መጨረሻው በኮማ ተቀምጧል።
