  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: am
  text: እርሱም “እምነታችሁ[a] የት አለ?” አላቸው። እነርሱም ፈርተው ተደነቁና፣ “ታዲያ ይህ ማን ነው? ነፋሳትንና ውኃውን እንኳ ያዛል፤ እነርሱም ይታዘዙለታል!” እያሉ እርስ በርሳቸው ተነጋገሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መታመናችሁ።” የኢየሱስ ጥያቄ፣ “መታመናችሁ የት አለ?” ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: የት አለ?
  rationale: የግሪኩን ቀጥተኛ የቦታ/መገኘት ጥያቄ ይጠብቃል፤ “ለምን እምነት የላችሁም?” ብሎ በትርጓሜ አያሰፋውም።
- source_word: πίστις
  choice: እምነት
  rationale: በአማርኛ የተለመደውንና ሰፊውን ትርጉም ይጠብቃል፤ በዚህ አውድ ‘መታመን’ የሚለውን ስሜትም ሊይዝ ይችላል።
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: እነርሱም ፈርተው ተደነቁና
  rationale: የφοβηθέντεςን አሳታፊ አወቃቀርና የፍርሃትና የመደነቅን ተያያዥ ምላሽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: ይህ ማን ይሆን?
  rationale: ἄρα ያለውን የመደነቅና የድምዳሜ ኃይል ‘ይሆን’ በሚለው ተፈጥሯዊ ጥያቄ ይገልጣል።
- source_word: ἐπιτάσσει
  choice: ያዛል
  rationale: ‘ትእዛዝ ይሰጣል’ የሚለውን ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከቀደመው ቁጥር ‘ገሠጸ’ የሚለውን አያስገባም።
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: ነፋሳትንና ውኃውን
  rationale: የሉቃስን ትክክለኛ ቃላት ‘ነፋሳት’ እና ‘ውኃ’ ይጠብቃል፤ ‘ማዕበል’ ወይም ‘ባሕር’ የሚል ትርጓሜ አያስገባም።
- source_word: ὑπακούουσιν αὐτῷ
  choice: ይታዘዙለታል
  rationale: የፍጥረትን እንደ ሰው ታዛዥነት በግልጽና የተለመደ አማርኛ ይገልጣል።
