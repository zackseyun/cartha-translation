id: LUK.8.39
reference: Luke 8:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: am
  text: «ወደ ቤትህ ተመለስና እግዚአብሔር ያደረገልህን ሁሉ ተርክ» አለው። እርሱም ሄዶ፣ ኢየሱስ ያደረገለትን ሁሉ በከተማው ሁሉ አወጀ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: ተመለስ
  rationale: የአሁን ጊዜ ትእዛዝ ሲሆን ቀድሞ ወደነበረበት ስፍራ እንዲመለስ የተሰጠ ቀጥተኛ ትእዛዝ ነው።
- source_word: εἰς τὸν οἶκόν σου
  choice: ወደ ቤትህ
  rationale: οἶκος ቤትን ወይም ቤተሰብን ሊያመለክት ቢችልም፣ εἰς የቦታ አቅጣጫን ስለሚገልጥ እዚህ ‘ወደ ቤትህ’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: διηγοῦ
  choice: ተናገር
  rationale: ቃሉ ነገሩን በመተረክ መግለጽን ያመለክታል፤ ‘ተናገር’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: እግዚአብሔር ያደረገልህን ሁሉ
  rationale: ὅσα ‘ያደረገውን ሁሉ/ምን ያህል’ የሚል ስፋት አለው። በግሪኩ ያልተጠቀሰውን ‘ታላላቅ ነገሮች’ የሚል ቅጽል ሳይጨምር ‘ሁሉ’ የቃሉን ስፋት ይጠብቃል።
- source_word: ἀπῆλθεν
  choice: ሄዶ
  rationale: ከስፍራው መሄዱን በተፈጥሯዊ የአማርኛ ትረካ ያሳያል።
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: በከተማው ሁሉ ... ዞረ
  rationale: κατά ከተማውን በሙሉ የሚሸፍን ስርጭትን ያመለክታል፤ ‘በከተማው ሁሉ ... ዞረ’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κηρύσσων
  choice: እያወጀ
  rationale: ቃሉ በአደባባይ ማሳወቅን ያመለክታል፤ ‘እያወጀ’ ከተራ መናገር የበለጠውን የሕዝብ ማስታወቂያ ኃይል ይጠብቃል።
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስ ያደረገለትን ሁሉ
  rationale: ከቀደመው ስለ እግዚአብሔር ከተነገረው ሐረግ ጋር ያለውን ሆን ተብሎ የተደረገ ትይዩነት ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ትእዛዝ ውስጥ ‘እግዚአብሔር’ እና በሰውየው አዋጅ ውስጥ ‘ኢየሱስ’ የሚለው ትይዩነት
  choice: ‘እግዚአብሔር ያደረገልህን’ / ‘ኢየሱስ ያደረገለትን’ በማለት የትረካውን ትይዩነት መጠበቅ
  alternative: ሁለቱንም ‘እግዚአብሔር’ ወይም ሁለቱንም ‘ኢየሱስ’ ብሎ ማስማማት፣ ወይም ‘ማለትም ኢየሱስ’ የሚል ማብራሪያ መጨመር
  rationale: ሉቃስ ሁለቱን ስያሜዎች በትይዩ ያቀርባል እንጂ በአርታኢ ማብራሪያ አያስማማቸውም። ትርጉሙም ይህን ሥነ መለኮታዊ ኃይልና ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛ ንግግሩ በአማርኛ ሰዋስው ግልጽ እንዲሆን ‘አለው’ ተጨምሯል፤ ይህ ተናጋሪውን አይለውጥም። የግሪኩ ὅσα በሁለቱም ሐረጎች ‘...ን ሁሉ’ ተብሎ ተተርጉሟል።
