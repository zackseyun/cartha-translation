  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: am
  text: በእሾህ መካከል የወደቀው ግን፣ የሰሙት እነዚህ ናቸው፤ እነርሱም ሲሄዱ በጭንቀቶች[a]፣ በሀብትና በሕይወት ደስታዎች ይታነቃሉ፤ ፍሬንም ወደ ብስለት አያደርሱም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሐሳቦች” ወይም “በጭንቀቶች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የበሰለ ፍሬ አያፈሩም” ወይም “ፍሬን ወደ ፍጻሜ አያደርሱም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: የወደቀው
  rationale: ገለልተኛ ነጠላውን የግስ ቅጽ በቀጥታ ይወክላል፤ በአውዱ ዘሩን እንደሚያመለክት ግልጽ ቢሆንም ‘ዘር’ የሚለውን በጽሑፉ የሌለ ስም አይጨምርም።
- source_word: ἀκάνθας
  choice: እሾሆች
  rationale: የእርሻውን ምስል በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: የሰሙ ሰዎችን ያመለክታል
  rationale: የሰሙትን ሰዎች ከወደቀው ዘር ጋር የሚያመሳስለውን የምሳሌ ማብራሪያ በተፈጥሯዊ አማርኛ ያቀርባል፤ ያልተገለጸውን የመስማት ተሳቢ አይጨምርም።
- source_word: ὑπὸ μεριμνῶν
  choice: በጭንቀት
  rationale: μέριμνα የሚያመለክተውን አሳሳቢ ጭንቀት በዘመናዊና ሰፊ ትርጉም ያስተላልፋል።
- source_word: πλούτου
  choice: በሀብት
  rationale: ቁሳዊ ብልጽግናን በአጭርና በተለመደ ቃል ይገልጻል።
- source_word: ἡδονῶν τοῦ βίου
  choice: በሕይወት ደስታዎች
  rationale: ἡδοναίን እንደ ደስታዎች፣ βίοςንም እንደ ምድራዊ ሕይወት በቅርብ ይወክላል።
- source_word: πορευόμενοι
  choice: በመንገዳቸው ሲሄዱ
  rationale: የእንቅስቃሴውንና የቀጣይነቱን ስሜት ይጠብቃል፤ ሐረጉን ከልክ በላይ ‘ሕይወታቸውን ሲኖሩ’ ብሎ አይተረጉመውም።
- source_word: συμπνίγονται
  choice: ታንቀው
  rationale: የተክሉን የመታነቅ ምስልና የግሱን ተደራጊ አቀራረብ ይጠብቃል።
- source_word: οὐ τελεσφοροῦσιν
  choice: ፍሬያቸውን ለብስለት አያደርሱም
  rationale: ፍሬ ወደ ፍጹም ብስለት አለመድረሱን ይገልጻል፤ የፍሬውን ምስልና የፍጻሜን ሐሳብ አንድ ላይ ይጠብቃል።
theological_decisions:
- issue: በእሾህ መካከል የተዘራውን የሚመስሉ ሰሚዎች ውድቀት ምንነት
  choice: ጽሑፉ መታነቃቸውንና ፍሬያቸው ለብስለት አለመድረሱን ብቻ ይገልጻል።
  alternative: እነዚህ ሰዎች ፈጽሞ ያላመኑ፣ እውነተኛ አማኞች ሆነው ፍሬ ያጡ፣ ወይም ከጀመሩ በኋላ የወደቁ ናቸው ብሎ በግልጽ መወሰን።
  rationale: ጥቅሱ ስለ መዳን፣ ስለ ዳግም መወለድ ወይም ስለ ጸንቶ መኖር የተነሱትን ኋለኛ የአስተምህሮ ክርክሮች አይወስንም፤ ስለዚህ የእርሻው ምስልና የጽሑፉ ውጥረት እንዳለ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የእርሻ ምስሎቹ—እሾህ፣ መታነቅ፣ ፍሬና ብስለት—ተጠብቀዋል።
