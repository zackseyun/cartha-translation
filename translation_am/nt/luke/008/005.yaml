source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: am
  text: ዘሪው ዘሩን ሊዘራ ወጣ። ሲዘራም ከዘሩ አንዳንዱ በመንገድ ዳር ወደቀ፤ ተረገጠም፣ የሰማይ ወፎችም በሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν ὁ σπείρων
  choice: ዘሪው ... ወጣ
  rationale: በግሪክኛው ያለው የተወሰነ ገላጭ አንቀጽ ὁ σπείρων እንደ ስም ስለሚሠራ፣ «ዘሪው» ተፈጥሯዊና አጭር ነው፤ Ἐξῆλθεν ደግሞ «ወጣ» ተብሎ ተተርጉሟል።
- source_word: τοῦ σπεῖραι τὸν σπόρον αὐτοῦ
  choice: ዘሩን ሊዘራ
  rationale: የዓላማ ትርጉሙን «ሊዘራ» ይገልጣል፤ τὸν σπόρον αὐτοῦ ደግሞ ያለ አላስፈላጊ ማስፋፊያ «ዘሩን» ተብሏል።
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: ሲዘራም
  rationale: ይህ የግሪክኛ አወቃቀር በአንድ ጊዜ የሚፈጸምን ድርጊት ያሳያል፤ «ሲዘራም» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὃ μὲν
  choice: ከዘሩ አንዳንዱ
  rationale: ነጠላ ገላጭ ቃሉ የዘሩን አንድ ክፍል በማከፋፈል ይጠቅሳል። «ከዘሩ አንዳንዱ» ዋቢውን ግልጽ አድርጎ የቀጣዮቹን የዘር ክፍሎች ያመለክታል።
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: በመንገድ ዳር ወደቀ
  rationale: παρά ከተሳቢ ቅጽ ጋር እዚህ ከመንገዱ ጎን ያለውን ስፍራ ያመለክታል፤ «በመንገድ ዳር» ይህን በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κατεπατήθη
  choice: ተረገጠ
  rationale: የግሪክኛውን ተደራጊ ቅርጽና የመረገጥ ትርጉም በአጭሩ ይጠብቃል።
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎች
  rationale: የሴማዊ አገላለጽ በግሪክኛ የተጠበቀ ሲሆን፣ «የሰማይ ወፎች» ቃላዊ ምስሉን በተለመደና ግልጽ አማርኛ ያቀርባል።
- source_word: κατέφαγεν αὐτό
  choice: በሉት
  rationale: κατεσθίω ሙሉ በሙሉ መብላትን ሊያጎላ ቢችልም፣ «በሉት» በዚህ የእርሻ ትዕይንት ተፈጥሯዊ ነው፤ የነጠላው ዘር ክፍል በአማርኛ እንደ ጥቅል ተወስዷል።
