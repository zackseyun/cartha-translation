  text: And they were laughing at him, because they knew that she had died.
translation:
  language: am
  text: እርሷ እንደሞተች ያውቁ ስለነበር፣ በእርሱ ይሳለቁ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: ይስቁበት ነበር
  rationale: ግሱ የነበረውን ቀጣይ ወይም ተደጋጋሚ ድርጊት ያመለክታል፤ የንቀት ሳቅንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αὐτοῦ
  choice: በእርሱ ... በት
  rationale: καταγελάω የሚሳቅበትን ሰው ያመለክታል፤ በአማርኛ ‘በእርሱ ይስቁበት’ ተብሎ በተፈጥሯዊ አገባብ ተገልጿል።
- source_word: εἰδότες
  choice: ያውቁ ስለነበር
  rationale: የግስ ተውሳኩ በዐውዱ የሳቃቸውን ምክንያት ይገልጣል፤ ይህ አተረጓጎም ምክንያታዊ ግንኙነቱን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὅτι
  choice: እንደ
  rationale: ያወቁትን ይዘት፣ ማለትም እርሷ መሞቷን፣ ያስገባል።
- source_word: ἀπέθανεν
  choice: ሞተች
  rationale: የተፈጸመውን የሞት ክስተት ይገልጣል፤ የሴት አንድ ቁጥር ቅርጹ ከዐውዱ ግልጽ የሆነችውን ልጅ ያመለክታል።
theological_decisions:
- issue: በግሪክ ያልተጠቀሰውን የልጅቷን ስም ወይም መጠሪያ በግልጽ ማከል ወይም አለማከል
  choice: እርሷ እንደሞተች
  alternative: ልጅቷ እንደሞተች
  rationale: የግሪኩ ግስ ስምን በግልጽ አይደግምም፤ ሴት ተጠቃሹ ከዐውዱ ይታወቃል። ‘እርሷ’ የምንጩን አጭርነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩ የነበረ ቀጣይ ድርጊት ‘ይስቁበት ነበር’ በሚለው ቅርጽ ተጠብቋል፤ የεἰδότες ምክንያታዊ ኃይልም ‘ስለነበር’ በሚለው ተገልጿል።
