  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: am
  text: ኢየሱስ ርኩሱን መንፈስ ከሰውየው እንዲወጣ አዝዞት ነበርና። መንፈሱ ለረጅም ጊዜ[a] ይዞት ነበር፤ በሰንሰለቶችና በእግር ብረቶች ታስሮ ይጠበቅ ነበር፤ ማሰሪያዎቹንም እየበጠሰ በጋኔኑ ወደ ሰው አልባ ስፍራዎች[b] ይነዳ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብዙ ጊዜ።” የግሪኩ አገላለጽ በቀዳሚነት ረዥም ቆይታን ያመለክታል፤ በዐውዱ ግን ተደጋጋሚ መያዝንም ሊያሳይ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ወደ በረሃዎች።” የግሪኩ ቃል ብዙ ቁጥር ሲሆን፣ ቃል በቃል “ወደ ሰው አልባ ስፍራዎች” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: አዞት ነበር
  rationale: ያለፈውን ትእዛዝ እንደ ትረካዊ ዳራ ያቀርባል፤ የግሪኩን ኢምፐርፌክት ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: ርኩሱን መንፈስ
  rationale: የአዲስ ኪዳንን የርኵሰት ቃላዊ ግንኙነት የሚጠብቅ የተለመደ አገላለጽ ነው።
- source_word: πολλοῖς γὰρ χρόνοις
  choice: ብዙ ጊዜ
  rationale: ዐውዱ ተደጋጋሚ መያዝን ይደግፋል፤ የረጅም ጊዜ ትርጉም እንደ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: συνηρπάκει
  choice: ይይዘው ነበር
  rationale: የመንፈሱን ኃይለኛና ተደጋጋሚ ቁጥጥር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: በሰንሰለትና በእግር ብረት
  rationale: ሁለቱን የማሰሪያ ዓይነቶች ለይቶ ያቀርባል፤ πέδαι በተለይ የእግር ማሰሪያን ያመለክታል።
- source_word: φυλασσόμενος
  choice: ይጠብቁት ነበር
  rationale: ሰዎች በቁጥጥር ሥር ሊያቆዩት ያደርጉትን ቀጣይ ጥረት በግልጽ ያሳያል።
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: ማሰሪያዎቹን እየበጠሰ
  rationale: δεσμά ከሰንሰለት የሰፋ ትርጉም ስላለው ‘ማሰሪያዎች’ የሚለው ድግግሞሽን ያስወግዳል፤ διαρρήσσω የኃይል ሰበራን ያሳያል።
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: በጋኔኑ እየተነዳ
  rationale: ተገብሮአዊውንና ቀጣይ/ተደጋጋሚውን የግሪክ ግስ ገጽታ እንዲሁም የጋኔኑን አስገዳጅ ተግባር ይጠብቃል።
- source_word: εἰς τὰς ἐρήμους
  choice: ወደ ሰው አልባ ስፍራዎች
  rationale: የግሪኩን ብዙ ቁጥርና ሰው የማይኖርባቸው ስፍራዎች የሚለውን ሐሳብ ይጠብቃል፤ የመሬቱን ዓይነት ከልክ በላይ አይወስንም።
theological_decisions:
- issue: የአጋንንታዊ ቃላት አተረጓጎም
  choice: πνεῦμα ἀκάθαρτονን ‘ርኩስ መንፈስ’፣ δαιμόνιονን ‘ጋኔን’ ብሎ በቀጥታ መተርጎም
  alternative: ‘ክፉ መንፈስ’ ወይም ሥነ ልቦናዊ ሁኔታ አድርጎ ማቅለል
  rationale: ትረካው የግል ድርጊት የሚፈጽም አጋንንታዊ ኃይልን በግልጽ ያቀርባል፤ ትርጉሙ ይህን ሳያለዝብ ይጠብቃል።
- issue: በκαί ውስጥ ያለው የንፅፅር ስሜት
  choice: በተፈጥሯዊ አማርኛ ‘እሱ ግን’ ብሎ የዐውዱን ንፅፅር ማሳየት
  alternative: ቀላል ‘እና’ ብቻ መጠቀም
  rationale: καί በመደበኛነት ‘እና’ ቢሆንም፣ እዚህ የሰዎቹ ማሰርና የእሱ ማሰሪያዎቹን መበጠስ በግልጽ ይነፃፀራሉ፤ ‘ግን’ አዲስ ሥነ መለኮታዊ ሐሳብ ሳይጨምር አማርኛውን ያ自然ል።
