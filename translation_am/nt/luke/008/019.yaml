- source_word: πρὸς αὐτὸν
  choice: ወደ እርሱ
  rationale: πρός ከተሳቢ ጋር ወደ ሰው የሚደረግን እንቅስቃሴ ያመለክታል፤ ‘ሊያዩት’ ማለት በጽሑፉ ያልተገለጸ ዓላማ ስለሚጨምር አልተመረጠም።
- source_word: μήτηρ
  choice: እናቱ
  rationale: ግልጽና ተፈጥሯዊ የዝምድና ቃል ነው፤ የባለቤትነት ቅጥያው በአውዱ ያለውን ግንኙነት ያሳያል።
- source_word: ἀδελφοὶ
  choice: ወንድሞቹ
