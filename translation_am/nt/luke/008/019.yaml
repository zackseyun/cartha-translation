  alternative: ዘመዶቹ
  rationale: የቃሉ የተለመደ ትርጉም ‘ወንድሞች’ ነው፤ ጥቅሱ የሥጋ ወንድሞች፣ የእንጀራ ወንድሞች ወይም ሌሎች ዘመዶች መሆናቸውን በዝርዝር አይወስንም። ስለዚህ የእምነት ባህሎችን ክርክር ወደ ዋናው ጽሑፍ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እርሱ ዘንድ’ የሚለው አገላለጽ ክብር ያለው ሲሆን ከመጠን በላይ ጥንታዊ አይደለም፤ የግሪኩ አሻሚነት በማስታወሻዎች ተጠብቋል።
