- source_word: συντυχεῖν αὐτῷ
  choice: እርሱ ዘንድ መድረስ
  rationale: በሕዝቡ መከልከላቸውን ከሚገልጸው አውድ ጋር ‘መድረስ’ ተግባራዊ ትርጉሙን በተፈጥሯዊ መንገድ ይይዛል፤ ‘መገናኘት’ም የቃሉ አማራጭ ነው።
- source_word: διὰ τὸν ὄχλον
  choice: በሕዝቡ ብዛት ምክንያት
  rationale: διά ከተሳቢ ጋር ምክንያትን ያሳያል፤ ‘ብዛት’ መጨመሩ ሕዝቡ መድረስን እንዴት እንደከለከለ በተፈጥሯዊ አማርኛ ያብራራል።
theological_decisions:
- issue: ‘ወንድሞቹ’ የሚለው የዝምድና ማጣቀሻ
