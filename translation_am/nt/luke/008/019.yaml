  text: ከዚያም እናቱና ወንድሞቹ[b] ወደ እርሱ መጡ፤ ነገር ግን በሕዝቡ ምክንያት ወደ እርሱ ሊደርሱ[a] አልቻሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእርሱ ጋር ለመገናኘት” ወይም “ወደ እርሱ ለመቅረብ”።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ወንድሞች” ይላል፤ አንዳንዶች ይህን ቃል በሰፊው “ዘመዶች” ብለው ይረዱታል፣ ጽሑፉ ራሱ ግን “ወንድሞች” ይላል።
