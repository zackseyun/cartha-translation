lexical_decisions:
- source_word: Παρεγένετο
  choice: መጡ
  rationale: ግሱ የኢየሱስን እናትና ወንድሞቹን መምጣት ያመለክታል፤ በአማርኛ ከብዙ ባለቤት ጋር የሚስማማው ብዙ ቁጥር ተጠቅሟል።
- source_word: δὲ
