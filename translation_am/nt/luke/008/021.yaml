base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: am
  text: እርሱ ግን መልሶ፣ “እናቴና ወንድሞቼ[a] የእግዚአብሔርን ቃል የሚሰሙና የሚፈጽሙ እነዚህ ናቸው[b]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድምና እህቶቼ።” የግሪክኛው ቃል “ወንድሞች” ይላል፤ ነገር ግን ንግግሩ ከወንዶች ባለፈ ሌሎችንም ሊያካትት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እነዚህ ናቸው፤ የእግዚአብሔርን ቃል የሚሰሙና የሚፈጽሙት።”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ፣ … አላቸው
  rationale: የግሪክኛውን ‘መልሶ አለ’ የትረካ አገላለጽ በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: πρὸς αὐτούς
  choice: አላቸው
  rationale: ተናጋሪው ለብዙ ሰዎች መናገሩን በአማርኛው ግስ ውስጥ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: Μήτηρ μου
  choice: እናቴ
  rationale: ነጠላውን ስምና የባለቤትነት ቅጥያውን በቀጥታ ያስተላልፋል።
- source_word: ἀδελφοί μου
  choice: ወንድሞቼ
  rationale: የግሪክኛውን ተባዕታይ ብዙ ቁጥር ቅርጽና ከኢየሱስ ሥጋዊ ወንድሞች ጋር ያለውን የንግግሩን ትይዩነት ይጠብቃል፤ ሰፋ ያለው አጠቃቀም በማስታወሻ ተገልጧል።
- source_word: οὗτοί εἰσιν
  choice: እነዚህ ናቸው
  rationale: የοὗτοιን ቅርብ አመልካችና አጽንዖት ይጠብቃል።
- source_word: οἱ … ἀκούοντες καὶ ποιοῦντες
  choice: የሚሰሙና የሚፈጽሙ
  rationale: የአሁን ጊዜ አሳታፊ ግሶቹ የሚገልጹትን ቀጣይ ባሕርይ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘የሚፈጽሙ’ የተሰማውን ቃል በተግባር ማዋልን ያመለክታል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: የምንጩን የባለቤትነት ግንኙነትና የλόγοςን ሃይማኖታዊ ድምፀት ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ እንደ ቤተሰቡ የሚለያቸው ሰዎች ወሰን
  choice: የእግዚአብሔርን ቃል በመስማትና በመፈጸም የሚታወቁትን እንደ እናቱና ወንድሞቹ ይጠቁማል።
  alternative: ሥጋዊ ቤተሰቡን ፈጽሞ እንደካደ ወይም ወንዶችን ብቻ እንደጠቀሰ ማቅረብ።
  rationale: ጥቅሱ ቤተሰባዊ ቅርበትን በእግዚአብሔር ቃል ላይ ባለ ምላሽ ዙሪያ ያሰፋል፤ ሆኖም ሥጋዊ ቤተሰቡን እንደካደ አይናገርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘እግዚአብሔር’ እና ‘ቃል’ የተለመደውን መጽሐፍ ቅዱሳዊ ድምፀት ይጠብቃሉ፤ የአመልካቹ አጽንዖትም ‘እነዚህ ናቸው’ በሚለው ተጠብቋል።
