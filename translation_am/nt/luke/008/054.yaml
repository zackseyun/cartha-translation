base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: am
  text: እርሱ ግን እጇን ይዞ ጮክ ብሎ ጠራ፦ “ልጅ ሆይ፣ ተነሺ!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: እርሱ ግን
  rationale: δέ በትረካው ውስጥ ያለውን መጠነኛ ተቃርኖ ወይም ሽግግር ያሳያል፤ αὐτός ደግሞ በተፈጥሯዊ አማርኛ ‘እርሱ’ ተብሎ ቀርቧል።
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: እጇን ይዞ
  rationale: የግሪኩን እጅን የመያዝ ተግባር በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ያስተላልፋል፤ ኃይለኛ የመጨበጥ ወይም የመንጠቅ ስሜት አይጨምርም።
- source_word: ἐφώνησεν λέγων
  choice: ጮክ ብሎ፣ … አለ
  rationale: φωνέω በዚህ ስፍራ በሚሰማ ድምፅ መጥራትን ያመለክታል። የግሪኩን ድርብ አገላለጽ በአማርኛ እንዳይከብድ ‘ጮክ ብሎ … አለ’ ተብሏል።
- source_word: Ἡ παῖς
  choice: ልጄ
  rationale: παῖς ልጅን በአጠቃላይ ወይም በዐውዱ ሴት ልጅን ሊያመለክት ይችላል። ‘ልጄ’ የቀጥታ ጥሪውን ርኅራኄና ተፈጥሯዊነት ይጠብቃል፤ የጾታው ዐውዳዊ ትርጉም በእግር ማስታወሻ ተገልጿል።
- source_word: ἔγειρε
  choice: ተነሺ
  rationale: ἐγείρω እዚህ ለሴት ልጅ የተሰጠ ቀጥተኛ ትእዛዝ ነው። ‘ተነሺ’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን የመነሣትን ትርጉም ያቆያል።
theological_decisions:
- issue: ኢየሱስ ልጅቷን የጠራበት አገላለጽ
  choice: ልጄ
  alternative: ልጅቷ / አንቺ ልጅ
  rationale: παῖς በቃሉ ራሱ ሰፊ ትርጉም ስላለው ‘ልጄ’ የጥሪውን ርኅራኄ ያቆያል፤ ‘ትንሽ ልጅ’ በማለት ከትይዩ ወንጌሎች የማይገኝበትን ዝርዝር አያስገባም።
- issue: የመነሣት ትእዛዝ
  choice: ተነሺ
  alternative: ቁሚ / ንቂ
  rationale: ቃሉ መቆምንም ሆነ ከእንቅልፍ መንቃትን ሊያመለክት ቢችልም፣ ‘ተነሺ’ የግሪኩን ስፋት በዚህ የሕይወት መመለስ ዐውድ የበለጠ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጮክ ብሎ’ የφωνέωን የሚሰማ ጥሪ ያሳያል፤ ነገር ግን የጭንቀት ጩኸትን አያመለክትም።
