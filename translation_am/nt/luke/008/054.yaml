  rationale: The possessive sense in ልጄ is removed and replaced with the natural Amharic vocative ልጅ ሆይ, preserving the source’s unpossessed, tender address and its lexical ambiguity. The footnote is revised accordingly and the calling verb is expressed directly and idiomatically.
