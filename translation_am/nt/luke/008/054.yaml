review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the narrative contrast, the act of taking the girl's hand, the audible summons, and the feminine singular imperative. However, ልጄ means “my child” and adds a first-person possessive not present in Ἡ παῖς. The Greek is a vocative address, not a possessive expression.
  naturalness: እርሱ ግን እጇን ይዞ ጮክ ብሎ ጠራ፦ “ልጅ ሆይ፣ ተነሺ!” is fluent, modern standard Amharic. The vocative ልጅ ሆይ naturally addresses the child without adding possession; ተነሺ supplies the contextually appropriate feminine address.
  terminology: The revised wording preserves the lexical breadth of παῖς as “child,” while the footnote gives the contextually specific alternative “girl.” The footnote's direct-address wording is corrected from the non-vocative ልጅቷ to ሴት ልጅ ሆይ.
  issues:
  - severity: medium
    issue: ልጄ introduces possession
    rationale: The Amharic suffix -ዬ means “my.” Neither the Greek vocative Ἡ παῖς nor the English audit trail contains a possessive pronoun. This changes the wording of Jesus’ address.
  - severity: low
    issue: Footnote alternative is not phrased as direct address
    rationale: ልጅቷ means “the girl,” whereas the quoted speech addresses her directly. ሴት ልጅ ሆይ accurately expresses the alternative in vocative form.
  revised_text: እርሱ ግን እጇን ይዞ ጮክ ብሎ ጠራ፦ “ልጅ ሆይ፣ ተነሺ!”
  revised_footnotes:
