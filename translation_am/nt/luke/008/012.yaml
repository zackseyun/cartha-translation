  choice: «አምነው እንዳይድኑ» ተብሎ ተተርጉሟል።
  alternative: «እንዳያምኑና እንዳይድኑ»
  rationale: ግሪኩ ዲያብሎስ ቃሉን የሚያስወግደው ሰዎቹ አምነው እንዳይድኑ መሆኑን ይገልጣል። ትርጉሙ ስለ እምነትና ድነት ያሉ ሰፋፊ የእምነት ትምህርታዊ ክርክሮችን ሳይፈታ የጽሑፉን ቅደም ተከተልና ውጥረት ይጠብቃል።
