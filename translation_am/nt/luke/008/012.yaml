  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ «ልብ» የአሳብ፣ የፈቃድና የምላሽ ማዕከልን የሚያመለክተውን መጽሐፍ ቅዱሳዊ ምስል አያጠብም።
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: ይህም አምነው እንዳይድኑ ነው
  rationale: μή ያለበትን የዓላማ/ውጤት አንቀጽ እና ከመዳን በፊት የቀረበውን πιστεύσαντες በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πιστεύσαντες
  choice: አምነው
  rationale: πιστεύωን በቀጥታ የሚያስተላልፍ የተለመደ አማርኛ ሲሆን በዚህ ስፍራ ከመዳን ጋር ያለውን ቅደም ተከተል ያሳያል።
- source_word: σωθῶσιν
  choice: እንዳይድኑ
  rationale: በሉቃስ አውድ ያለውን ሙሉ የድነት ትርጉም በግልጽና በተለመደ ቋንቋ ያስተላልፋል።
theological_decisions:
