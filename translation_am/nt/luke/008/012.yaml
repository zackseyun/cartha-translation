- source_word: ἀκούσαντες
  choice: የሰሙት
  rationale: የሰሙትን ሰዎች የሚለይ የተፈጸመ ድርጊት እንደሆነ ያሳያል።
- source_word: εἶτα
  choice: ከዚያም
  rationale: ቀጥሎ የሚፈጸመውን ድርጊት በግልጽ ያመለክታል።
- source_word: ὁ διάβολος
  choice: ዲያብሎስ
  rationale: በዚህ አውድ ቃሉ የግል ክፉ ፍጡርን ያመለክታል፤ «ዲያብሎስ» በአማርኛ የተለመደና ግልጽ ነው።
- source_word: αἴρει
  choice: ያስወግዳል
  rationale: ቃሉን ከልባቸው ማራቅን ወይም መውሰድን ያሳያል፤ በግሪኩ ያልተገለጸ የኃይል አጠቃቀም አያክልም።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: የመጽሐፍ ቅዱስን የተለመደ አገላለጽ ይጠብቃል፤ በምሳሌው ውስጥ የታወጀውን የእግዚአብሔር መልእክት ያመለክታል።
- source_word: τῆς καρδίας αὐτῶν
