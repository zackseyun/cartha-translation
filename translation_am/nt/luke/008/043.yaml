  source_fidelity: 'The draft conveys the twelve-year duration, the woman’s expenditure of her means on physicians, and her inability to be healed. However, ለሐኪሞች አጥፍታ is too underspecified: it can mean that she ruined/destroyed something for physicians without explicitly stating that she spent all her resources. The textual-variant note appropriately identifies the disputed physician-expenditure clause represented in the bracketed SBLGNT text.'
  naturalness: ደም ይፈሳት የነበረች is understandable but less idiomatic and less medically clear than የደም መፍሰስ የነበረባት. Recasting the verse as one Amharic sentence also better preserves the Greek narrative construction without sacrificing readability.
  terminology: መተዳደሪያዋን is suitable for βίος in its sense of livelihood/resources. ሐኪሞች and ልትፈወስ are appropriate in a modern, dignified biblical register.
  issues:
