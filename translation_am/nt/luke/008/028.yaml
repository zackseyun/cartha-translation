  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: am
  text: ነገር ግን፣ ኢየሱስን ባየ ጊዜ ጮኸ፤ በፊቱም ወደቀና በታላቅ ድምፅ፣ “ኢየሱስ ሆይ፣ የልዑል እግዚአብሔር ልጅ፣ ከእኔ ጋር ምን ጉዳይ አለህ?[a] እለምንሃለሁ፤ አታሠቃየኝ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “በእኔና በአንተ መካከል ምን አለ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ባየው ጊዜ
  rationale: የቀደመውን ሁኔታ የሚገልጸውን የግሪክ ያለፈ ጊዜ አሳታፊ በተፈጥሯዊ የአማርኛ ጊዜ አገባብ ያቀርባል።
- source_word: ἀνακράξας
  choice: ጮኸ
  rationale: ድንገተኛና ከፍተኛ የድምፅ ጩኸትን ይገልጻል፤ ቀጥሎ ያለውን ‘በታላቅ ድምፅ’ አያዋህድም።
- source_word: προσέπεσεν αὐτῷ
  choice: በፊቱም ወደቀ
  rationale: በአንድ ሰው ፊት መውደቅን ያሳያል፤ ‘እግሩ ላይ’ በማለት ምንጩ ያልገለጸውን ዝርዝር አይጨምርም።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የድርጊቱን አኳኋን ቅርጹንና ሕያውነቱን ጠብቆ ያስተላልፋል።
- source_word: Τί ἐμοὶ καὶ σοί
  choice: ከእኔ ጋር ምን ጉዳይ አለህ?
  rationale: መራቅን ወይም ተቃውሞን የሚገልጸውን ሴማዊ ፈሊጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ይበልጥ ቀጥተኛው ቅርጽ በማስታወሻ ተጠብቋል።
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: የልዑሉ እግዚአብሔር ልጅ
  rationale: የግሪኩን የባለቤትነት አወቃቀርና ‘ልዑል እግዚአብሔር’ የሚለውን ማዕረግ ግልጽና የተከበረ በሆነ አማርኛ ይጠብቃል።
- source_word: δέομαί σου
  choice: እለምንሃለሁ
  rationale: አጥብቆ የመለመንን አስቸኳይነት ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: μή με βασανίσῃς
  choice: አታሠቃየኝ
  rationale: ከባድ ሥቃይ ማድረስን ያሳያል፤ ሥቃዩን አካላዊ ብቻ አድርጎ ሳይወስን የአውዱን መንፈሳዊና የፍርድ ገጽታ ይፈቅዳል።
theological_decisions:
- issue: ክፉው መንፈስ ስለ ኢየሱስ ማንነት የተናገረውን ማቅረብ
  choice: ኢየሱስ ሆይ፣ የልዑሉ እግዚአብሔር ልጅ
  alternative: ኢየሱስ ሆይ፣ የእግዚአብሔር፣ የልዑሉ ልጅ
  rationale: የንግግሩን ሙሉ ክርስቶሎጂያዊ ኃይል ሳያለዝብና ከጽሑፉ በላይ የኋለኛ ዘመን ቀመር ሳይጨምር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ የአማርኛ አገላለጽ ተጠቅሟል። የንግግሩ ድንገተኛነትና ግርማ ‘ጮኸ’ እና ‘በታላቅ ድምፅ’ ተለያይተው በመቆየታቸው ተጠብቀዋል።
