  rationale: ቃሉ የልብሱን ዳርቻ በአጠቃላይ ወይም በአይሁድ ልብስ ላይ ያለውን ልዩ ሹራብ ሊያመለክት ይችላል። ቁጥሩ ራሱ የቶራን ድንጋጌ በግልጽ ስለማይጠቅስ፣ ዋናው ጽሑፍ አሻሚነቱን አይዘጋም፤ አማራጮቹን በማስታወሻ ያቀርባል።
