review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the woman’s approach from behind, her touching of Jesus’ garment, and the immediate cessation of her bleeding. However, «ዘርፍ» is not the clearest contemporary Amharic equivalent for κράσπεδον in this context and can suggest a section or strip rather than a garment’s edge/fringe. «ዳርቻ» provides a clear, suitably broad main-text rendering while retaining the lexical ambiguity in the note.
  naturalness: «ከኋላው መጥታ» is more idiomatic and precise for approaching from behind than «ከኋላው ቀርባ». The remainder is natural, respectful modern standard Amharic. «የደሟ ፍሰት ቆመ» appropriately conveys the Greek nominal expression without unnecessary euphemism or elaboration.
  terminology: Use «ዳርቻ» for κράσπεδον in the text. The alternatives «ጫፍ», «ዘርፍ», and «ጉንጉን» preserve the possible senses edge/hem, fringe, and tassel. «ሹራብ» is unsuitable here because in current Amharic it ordinarily refers to knitted clothing rather than a tassel or garment fringe.
  issues:
  - severity: medium
    issue: The main-text term «ዘርፍ» is semantically less clear for κράσπεδον.
    rationale: It may be understood as a portion, strip, or section; «ዳርቻ» naturally denotes the edge or border of a garment and does not overdetermine whether a tassel is intended.
  - severity: medium
    issue: The footnote’s «ሹራብ» is misleading as an alternative for κράσπεδον.
    rationale: In modern Amharic it normally denotes a knitted garment. «ጉንጉን» better expresses the possible tassel sense.
  - severity: low
    issue: «ከኋላው ቀርባ» is slightly awkward.
    rationale: «ከኋላው መጥታ» is idiomatic and clearly preserves both the approach and the position behind him.
  revised_text: ከኋላው መጥታ የልብሱን ዳርቻ[a] ነካች፤ ወዲያውም የደሟ ፍሰት ቆመ።
  revised_footnotes:
