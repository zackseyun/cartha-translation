  rationale: ቃሉ የልብስን ጫፍ፣ ዳርቻ ወይም ከዳርቻው ያለ ዘርፍ/ሹራብ ሊያመለክት ስለሚችል፣ «ዘርፍ» በዋናው ጽሑፍ ሰፊውን ሐሳብ ይይዛል፤ አማራጮቹም በማስታወሻ ተጠብቀዋል።
