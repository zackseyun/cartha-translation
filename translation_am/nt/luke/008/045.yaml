  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: am
  text: ኢየሱስም፣ “የነካኝ ማን ነው?” አለ። ሁሉም ይህን ሲክዱ፣ ጴጥሮስ፣ “መምህር ሆይ፣ ሕዝቡ በዙሪያህ ከቦ እያጨናነቀህ ነው[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝቡ በዙሪያህ ተጨናንቆ እየጫነህ ነው።”
    reason: συνέχω በዚህ አውድ ከዙሪያ መክበብን ወይም ተጨናንቆ መቅረብን ሊገልጽ ስለሚችል ተፈጥሯዊ የቃላት አማራጭ ቀርቧል።
lexical_decisions:
- source_word: ἁψάμενός
  choice: የነካኝ
  rationale: በዚህ ትረካ መካከለኛው የግስ ቅርጽ አካላዊ ንክኪን ያመለክታል፤ “የነካኝ” ተፈጥሯዊና ከአውዱ ጋር የሚስማማ ነው።
- source_word: ἀρνουμένων δὲ πάντων
  choice: ሁሉም ይህን ሲክዱ
  rationale: የአሁን ጊዜ ተካፋይ ቅርጹ በዚያን ጊዜ የቀጠለ ክደትን ያሳያል፤ “ይህን” የሚለው የኢየሱስን ጥያቄ በተፈጥሮ ይመለከታል።
- source_word: Ἐπιστάτα
  choice: መምህር ሆይ
  rationale: ቃሉ በሉቃስ ዘንድ ለኢየሱስ የሚቀርብ የአክብሮትና የሥልጣን መጠሪያ ነው። “መምህር ሆይ” በአማርኛ ተፈጥሯዊ ሲሆን κύριος የሚለውን የተለየ ማዕረግ አያስገባም።
- source_word: οἱ ὄχλοι
  choice: ሕዝቡ
  rationale: ግሪክኛው ብዙ የሰዎች ጉባኤዎችን የሚያመለክት ብዙ ቁጥር ቢሆንም፣ “ሕዝቡ” በአማርኛ በዙሪያው የተሰበሰቡትን ብዙ ሰዎች በተፈጥሮ የሚገልጽ የስብስብ ስም ነው።
- source_word: συνέχουσίν
  choice: ከቦህ እያጨናነቀህ
  rationale: ግሱ ከዙሪያ መክበብንና እንቅስቃሴን መገደብን ያሳያል፤ ይህ አተረጓጎም ያንን ምስል ይጠብቃል።
- source_word: ἀποθλίβουσιν
  choice: እየተጫነህ
  rationale: ቃሉ በሰዎች ብዛት የሚፈጠርን ጠንካራ ግፊት ያመለክታል፤ “እየተጫነህ” ኃይሉን ሳያጋንን በተፈጥሯዊ አማርኛ ይገልጸዋል።
theological_decisions:
- issue: Ἐπιστάτα የሚለውን ለኢየሱስ የቀረበ መጠሪያ መተርጎም
  choice: መምህር ሆይ
  alternative: ጌታ ሆይ፤ አለቃ ሆይ
  rationale: ጥቅሱ κύριος ሳይሆን Ἐπιστάτα ይጠቀማል። “መምህር ሆይ” አክብሮትንና የታወቀ ሥልጣንን ያሳያል፤ “ጌታ” ግን በዚህ ቦታ ግሪክኛው በቀጥታ ያልተጠቀመውን የተለየ ማዕረግ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛውን ሁለት የግፊት ግሶች ልዩነት “ከቦህ እያጨናነቀህና እየተጫነህ” በማለት ተጠብቋል።
