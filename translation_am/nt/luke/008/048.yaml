source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: am
  text: እርሱ ግን፣ “ልጄ ሆይ፣ እምነትሽ አድኖሻል፤[a] በሰላም ሂጂ” አላት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እምነትሽ ፈውሶሻል” ወይም “እምነትሽ ደኅና አድርጎሻል።” የግሪኩ ግስ ማዳንንም ሆነ መፈወስን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: ልጄ ሆይ
  rationale: የግሪኩን የጥሪ ቅርጽና የአባታዊ ርኅራኄ አነጋገር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πίστις
  choice: እምነት
  rationale: በዚህ አውድ ሴቲቱ በኢየሱስ ላይ ያደረገችውን የማመን እምነት ያመለክታል፤ ቃሉን በሰፊው መንፈሳዊ አጠቃቀሙም ይጠብቃል።
- source_word: σέσωκέν
  choice: አድኖሻል
  rationale: የσῴζωን ሰፊ የማዳን ትርጉም እና በቅርብ አውዱ ያለውን የፈውስ ሐሳብ አብሮ እንዲሸከም ያደርጋል፤ የፈውስ ትርጉሙ በግርጌ ማስታወሻ ተገልጧል።
- source_word: πορεύου
  choice: ሂጂ
  rationale: ለአንዲት ሴት የተነገረውን የግሪኩን ቀጥተኛ ትእዛዝ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: εἰς εἰρήνην
  choice: በሰላም
  rationale: መሄድን በሰላም ሁኔታና በረከት የሚገልጸውን የግሪክ ፈሊጥ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: δὲ
  choice: ግን
  rationale: ከሴቲቱ ፍርሃትና ኑዛዜ ወደ ኢየሱስ አጽናኝ መልስ የሚደረገውን ለስላሳ ንጽጽርና ሽግግር ይገልጻል።
theological_decisions:
- issue: በፈውስ አውድ ውስጥ የσῴζω ትርጉም ወሰን
  choice: በዋናው ጽሑፍ “አድኖሻል” ተብሎ ሰፊው ትርጉም ተጠብቋል።
  alternative: “ፈውሶሻል” ወይም “ደኅና አድርጎሻል”
  rationale: ትረካው የአካል ፈውስን በግልጽ ቢያካትትም፣ σῴζω ከአካላዊ ፈውስ የሰፋ የማዳን ትርጉም ሊኖረው ይችላል። “አድኖሻል” ይህን ሆን ተብሎ ያልተፈታ የትርጉም ውጥረት ይጠብቃል፤ የፈውሱ ሐሳብ ደግሞ በግርጌ ማስታወሻው ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ልጄ ሆይ” ርኅራኄንና የጥሪ ቅርጹን ይጠብቃል፤ “በሰላም ሂጂ” ተፈጥሯዊ የበረከት አነጋገር ነው።
