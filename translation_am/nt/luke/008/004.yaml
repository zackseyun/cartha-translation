  language: am
  text: ብዙ ሕዝብ እየተሰበሰበ፣ ከየከተማው ሰዎችም ወደ እርሱ እየመጡ ሳሉ፣ በምሳሌ[a] እንዲህ አለ፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምሳሌ ተናገረ።” የግሪኩ አገላለጽ διὰ παραβολῆς መሣሪያን ወይም የንግግር መንገድን እንደሚያመለክት ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
