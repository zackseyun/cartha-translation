- source_word: ὄχλου πολλοῦ
  choice: ብዙ ሕዝብ
  rationale: ὄχλος የተሰበሰበን ሕዝብ ያመለክታል፣ πολλοῦም ብዛቱን ያጎላል። ‘ብዙ ሕዝብ’ ግልጽና የተለመደ አማርኛ ነው።
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: ከየከተማውም ሰዎች … እየመጡ
  rationale: κατὰ πόλιν የስርጭት ሐሳብ አለው፤ ‘ከየከተማው’ ሰዎቹ ከተለያዩ ከተሞች እንደመጡ በተፈጥሯዊ አማርኛ ያስተላልፋል። የአሁን ጊዜ አንቀጽ ‘እየመጡ’ ቀጣይ ድርጊቱን ይጠብቃል።
- source_word: πρὸς αὐτόν
  choice: ወደ እርሱ
  rationale: πρός ከአኩዛቲቭ ጋር ወደ ኢየሱስ የሚደረግን እንቅስቃሴ ያሳያል፤ ‘ወደ እርሱ’ ቀጥተኛና ግልጽ ነው።
- source_word: εἶπεν
  choice: እንዲህ አለ
  rationale: በሚቀጥለው ጥቅስ ቀጥተኛ ንግግር ስለሚጀምር፣ ‘እንዲህ አለ’ በአማርኛ ተፈጥሯዊ የንግግር መግቢያ ነው።
- source_word: διὰ παραβολῆς
  choice: በምሳሌ
  rationale: διά ከጄኒቲቭ ጋር መንገድን ወይም መሣሪያነትን ሊገልጽ ይችላል፤ ‘በምሳሌ’ ይህን አሻሚነት በአጭርና ተፈጥሯዊ መልኩ ይጠብቃል።
