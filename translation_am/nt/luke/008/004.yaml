  rationale: ከὄχλου πολλοῦ ጋር የተሠራው የጄኒቲቭ አብሶሉት አወቃቀር እየቀጠለ ያለ መሰብሰብን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
