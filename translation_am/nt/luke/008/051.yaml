source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: am
  text: ወደ ቤቱ በመጣ ጊዜ፣ ጴጥሮስን፣ ዮሐንስን፣ ያዕቆብን፣ የልጅቷን[a] አባትና እናት በቀር፣ ከእርሱ ጋር እንዲገባ ማንንም አልፈቀደም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የልጅን አባትና እናት»። የግሪኩ ቃል በአጠቃላይ «ልጅ» ማለት ሊሆን ይችላል፤ አውዱ ግን ልጅቷ ሴት መሆኗን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: በመጣ ጊዜ
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ በዚህ አውድ ጊዜያዊ ቅደም ተከተልን ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: οἰκίαν
  choice: ቤቱ
  rationale: οἰκία ቤትን ወይም መኖሪያን ያመለክታል፤ በትረካው አውድ «ቤቱ» ቀጥተኛና ግልጽ ነው።
- source_word: οὐκ ἀφῆκεν
  choice: አልፈቀደም
  rationale: ἀφίημι እዚህ መፍቀድን ያመለክታል፤ «አልፈቀደም» ክብር ያለውና ዘመናዊ አገላለጽ ነው።
- source_word: εἰσελθεῖν
  choice: እንዲገባ
  rationale: የዓላማ ግሱ ከ«አልፈቀደም» ጋር በተፈጥሯዊ የአማርኛ አገባብ ተያይዟል።
- source_word: τινα σὺν αὐτῷ
  choice: ማንንም ከእርሱ ጋር
  rationale: τινα ከአሉታዊው ግስ ጋር አጠቃላይ «ማንንም» የሚል ኃይል አለው፤ σὺν αὐτῷ ደግሞ «ከእርሱ ጋር» ተብሎ ተጠብቋል።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: ከአሉታዊ አነጋገሩ በኋላ εἰ μὴ ልዩ ማድረግን፣ ማለትም «በቀር»ን ያመለክታል።
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: ጴጥሮስን፣ ዮሐንስን፣ ያዕቆብን
  rationale: ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ቀርበዋል፤ የግሪኩ ተደጋጋሚ καὶ በተፈጥሯዊ የአማርኛ ዝርዝር አገባብ ተሰጥቷል።
- source_word: τῆς παιδὸς
  choice: የልጅቷን
  rationale: παῖς በአጠቃላይ «ልጅ» ሊሆን ቢችልም፣ በቅርብ አውዱ የኢያኢሮስ ሴት ልጅ መሆኗ ግልጽ ስለሆነ «ልጅቷ» ተመርጧል።
- source_word: πατέρα ... καὶ τὴν μητέρα
  choice: አባትና እናት
  rationale: ሁለቱን ወላጆች በተናጠል የሚጠቅሰውን የግሪክ አገላለጽ ይጠብቃል፤ «ወላጆች» ተብሎ አልተጠቃለለም።
theological_decisions:
- issue: በአውዱ ውስጥ የπαῖς ጾታዊ ልዩነት
  choice: የልጅቷን አባትና እናት
  alternative: የልጁን አባትና እናት
  rationale: παῖς በራሱ ልጅን በአጠቃላይ ሊያመለክት ይችላል፤ ሆኖም የቅርቡ ትረካ ልጁ ሴት መሆኗን ይገልጣል። ስለዚህ «ልጅቷ» ግልጽና ከአውዱ ጋር የሚስማማ ነው፤ የቃሉ ሰፊ ትርጉም ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተጠቅሟል። የዓረፍተ ነገሩ ቅደም ተከተል የተፈቀደላቸውን ሰዎች በግልጽ ከ«ማንንም» ለይቶ እንዲያሳይ በአማርኛ አገባብ ተደራጅቷል።
