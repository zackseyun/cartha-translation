  source_fidelity: The draft conveys the crowd’s request, their great fear, and Jesus’ departure and return. However, “በጌራሴኖች ዙሪያ” can mean physically ‘around the Gerasenes,’ rather than the surrounding district belonging to/associated with the Gerasenes. The fear expression can also more directly represent συνέχοντο (‘were held/gripped’).
  naturalness: The sentence is generally clear, but “የጌራሴኖች አካባቢ ሕዝብ ሁሉ” is more idiomatic and accurate than the draft’s locution. “በታላቅ ፍርሃት ተይዘው ነበር” is natural modern standard Amharic.
  terminology: “ጌራሴኖች,” “ፍርሃት,” “ጀልባ,” and “ተመለሰ” are suitable. The revision retains the ambiguity about the nature and cause of the fear.
