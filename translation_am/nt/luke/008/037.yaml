  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: am
  text: የጌራሴኖች አካባቢ ሕዝብ ሁሉ፣ በታላቅ ፍርሃት ተይዘው ነበርና፣ ከእነርሱ እንዲሄድ ጠየቁት።[a] እርሱም ወደ ጀልባ ገብቶ ተመለሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታላቅ ፍርሃት አጥብቆ ይዟቸው ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησεν
  choice: ጠየቁት
  rationale: ἐρωτάω እዚህ ጥያቄን ወይም ጥያቄ መሰል ጥያቄን ያመለክታል። “ጠየቁት” የሕዝቡን ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል፤ “ለመኑት” ከምንጩ በላይ ግፊት ሊጨምር ይችላል።
- source_word: ἅπαν τὸ πλῆθος
  choice: ሕዝብ ሁሉ
  rationale: የἅπανን አጠቃላይነት ይጠብቃል፤ “ሕዝብ” ለተሰበሰበ ብዙ ሰው ተፈጥሯዊና ክቡር የአማርኛ አገላለጽ ነው።
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: በጌራሴኖች ዙሪያ ካለው አካባቢ የመጣው
  rationale: περίχωρος በዙሪያ ያለውን ክልል ወይም አካባቢ ያመለክታል። የግሪኩን የቦታ ግንኙነት በግልጽ ዘመናዊ አማርኛ ያቀርባል፤ Γερασηνῶν ደግሞ “ጌራሴኖች” ተብሎ በድምፅ ቀርቧል።
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: ከእነርሱ እንዲሄድ
  rationale: የመራቅን አቅጣጫ ይጠብቃል፤ በአማርኛም ከ“ጠየቁት” ጋር ተፈጥሯዊ ነው።
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: ታላቅ ፍርሃት ይዟቸው ስለነበር
  rationale: συνέχω በፍርሃት መያዝን ወይም መጨነቅን ያሳያል። ይህ አገላለጽ የምንጩን ጥንካሬ ሳያጠፋ በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ወደ ጀልባ ገብቶ
  rationale: የመርከብ መሳፈርን በግልጽና ተለምዷዊ አማርኛ ይገልጣል፤ በግሪኩ የተወሰነ መስተዋድድ አለመኖሩንም አይለውጥም።
- source_word: ὑπέστρεψεν
  choice: ተመለሰ
  rationale: ὑποστρέφω የሚለውን “መመለስ” በአጭርና ተፈጥሯዊ መንገድ ይተረጉማል።
theological_decisions:
- issue: ሕዝቡ ኢየሱስን እንዲሄድ የጠየቀበት ፍርሃት ምንነት
  choice: ፍርሃቱን “ታላቅ ፍርሃት” ብቻ በማለት ምክንያቱን ሳይተረጉም ማቅረብ
  alternative: ፍርሃቱን ለመለኮታዊ ኃይል እንደነበረ አክብሮት፣ ወይም በኢኮኖሚያዊ ኪሳራና ማኅበራዊ ለውጥ የተነሣ ጥላቻ አድርጎ መግለጽ
  rationale: ጽሑፉ የፍርሃቱን ዓይነት አይወስንም። ስለዚህ ትርጉሙ አክብሮታዊ፣ ጥላቻዊ ወይም የተደባለቀ እንደነበር በመጨመር አይፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ረዘም ያለ አረፍተ ነገር ትስስር ተጠብቆ፣ ለአማርኛ ፍሰት ግን ተፈጥሯዊ ቅደም ተከተል ተሰጥቶታል።
