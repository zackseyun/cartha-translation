  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: am
  text: እንስሳቱን የሚጠብቁትም የሆነውን ነገር[a] ባዩ ጊዜ ሸሹ፤ በከተማውና በገጠሩ[b] አስታወቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተከሰተውን።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በእርሻዎቹ”፤ እዚህ ቃሉ በዙሪያው ያለውን የገጠር አካባቢ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የግሪኩን የአኦሪስት ተሳቢ ግስ ከዋናዎቹ ድርጊቶች ጋር ያለውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ βόσκοντες
  choice: እንስሳቱን የሚጠብቁት
  rationale: በዐውዱ ውስጥ አሳማዎቹን የሚጠብቁትን ሰዎች ያመለክታል፤ “እረኞች” በተለምዶ በግ ጠባቂዎችን ሊያስታውስ ስለሚችል ይህ አገላለጽ ዐውዱን በግልጽ ያስቀምጣል።
- source_word: τὸ γεγονός
  choice: የሆነውን ነገር
  rationale: የተፈጸመውን ክስተት የሚያመለክተውን ፍጹም ተሳቢ ግስ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἔφυγον
  choice: ሸሹ
  rationale: φεύγω የሚያመለክተውን ፈጣን መሸሽ በቀጥታና አጭር ቃል ይገልጣል።
- source_word: ἀπήγγειλαν
  choice: አስታወቁ
  rationale: የሆነውን ነገር ለሌሎች ማድረስን ወይም መዘገብን የሚገልጽ ተፈጥሯዊ የትረካ ቃል ነው።
- source_word: εἰς τὴν πόλιν
  choice: በከተማው
  rationale: ዜናው የተነገረበትን ስፍራ በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩ አቅጣጫዊ መስተዋድድ ከማሳወቅ ግስ ጋር የቦታ ክልልንም ሊያመለክት ይችላል።
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: በገጠሩ
  rationale: ἀγροί በቃል ደረጃ “እርሻዎች” ሊባል ቢችልም፣ ከ“ከተማ” ጋር ያለው ንጽጽር በዙሪያው ያለውን የገጠር አካባቢ ያመለክታል።
