  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: am
  text: ከእነዚያ ቀናት በአንዱ፣ እርሱ ወደ አንዲት ጀልባ ገባ፤ ደቀ መዛሙርቱም ከእርሱ ጋር ገቡ። እርሱም፣ “ወደ ሐይቁ ማዶ እንሻገር” አላቸው። ከዚያም ከዳር ተነሥተው ሄዱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ግስ “ለመጓዝ ተነሡ” ወይም “ጀልባውን አስነሡ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ከእነዚያ ቀናት በአንዱ፣
  rationale: የሉቃስን የትረካ ሽግግር በተፈጥሯዊ አማርኛ ያቀርባል፤ Ἐγένετοን በቃል በቃል ‘ሆነ’ ማለት እዚህ አስፈላጊ አይደለም።
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: ከእነዚያ ቀናት በአንዱ
  rationale: በሚታወቅ የጊዜ ክፍል ውስጥ ካሉት ቀናት አንዱን የሚጠቁመውን ከፊላዊ አገላለጽ ይጠብቃል።
- source_word: ἐνέβη εἰς πλοῖον
  choice: ወደ አንዲት ጀልባ ገባ
  rationale: ወደ ጀልባ የመግባቱን ድርጊትና የπλοῖονን ያልተወሰነ ቅርጽ በግልጽ አማርኛ ያሳያል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱም ከእርሱ ጋር ገቡ
  rationale: ደቀ መዛሙርቱም ከእርሱ ጋር ጀልባው ውስጥ እንደገቡ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: Διέλθωμεν
  choice: እንሻገር
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር የማበረታቻ ሐሳብንና የመሻገርን አቅጣጫ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: ወደ ሐይቁ ማዶ
  rationale: τὸ πέρανን ‘ማዶ’፣ λίμνηንም ‘ሐይቅ’ በማለት የቦታውን ትክክለኛ ትርጉም ይጠብቃል።
- source_word: ἀνήχθησαν
  choice: በጀልባዋ ጉዞ ጀመሩ
  rationale: የባሕር ጉዞ አጠቃቀሙን ለዘመናዊ አማርኛ አንባቢ በግልጽ ሁኔታ ያቀርባል፤ የግሪኩ ግስ ጀልባን ከዳር አስነሥቶ መጓዝን ያመለክታል።
