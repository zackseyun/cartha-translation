  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: am
  text: ኢየሱስ ግን “አንድ ሰው ነክቶኛል፤ ኃይል ከእኔ እንደወጣ አውቄአለሁና” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: አንድ ሰው ነክቶኛል
  rationale: የግሪኩን ያልተወሰነ ὅ τις (‘አንድ ሰው’) እና የἅπτομαιን ቀጥተኛ ትርጉም (‘ነካ’) በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔγνων
  choice: አውቄአለሁ
  rationale: ቃሉ እዚህ ላይ ማወቅን ይገልጻል፤ ‘ተረዳሁ’ ወይም ‘ተሰማኝ’ በማለት ያልተገለጸን የአውቆት መንገድ አይወስንም።
- source_word: δύναμιν ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: ኃይል ከእኔ እንደወጣ
  rationale: δύναμιςን ‘ኃይል’፣ ἐξέρχομαιንም ‘ወጣ’ ብሎ በቀጥታና በተፈጥሯዊ አገላለጽ ያቀርባል።
theological_decisions:
- issue: ኢየሱስ ኃይሉ መውጣቱን ያወቀበት መንገድ
  choice: “አውቄአለሁ” ተብሎ የጽሑፉ አጠቃላይ አነጋገር ተጠብቋል።
  alternative: “ተሰምቶኛል” ወይም “ተገንዝቤአለሁ”
  rationale: የግሪኩ ἔγνων የማወቁን መንገድ አይገልጽም፤ ስለዚህ ትርጉሙ ተጨማሪ ሥነ መለኮታዊ ግምት አያስገባም።
- issue: ኃይል ከኢየሱስ መውጣቱ
  choice: “ኃይል ከእኔ እንደወጣ”
  alternative: “የፈውስ ኃይል ከእኔ እንደወጣ”
  rationale: ምንባቡ በዐውዱ ፈውስን ቢያመለክትም ‘የፈውስ’ የሚለው በዚህ ጥቅስ የለም፤ ስለዚህ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ነክቶኛል” እና “አውቄአለሁ” የተባሉት ፍጹም ድርጊቱንና አሁን ያለውን ውጤት በተፈጥሯዊ አማርኛ ያሳያሉ።
