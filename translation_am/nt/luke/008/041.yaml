  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: am
  text: እነሆ፣ ኢያኢሮስ የሚባል አንድ ሰው መጣ። እርሱም የምኩራብ አለቃ ነበር። በኢየሱስ እግሮች አጠገብ ወድቆ፣ ወደ ቤቱ እንዲገባ ለመነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: እነሆም
  rationale: የትረካውን ድንገተኛ ትኩረት በክቡርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἄρχων τῆς συναγωγῆς
  choice: የምኩራብ አለቃ
  rationale: በምኩራቡ ውስጥ ያለውን የመሪነት ሥልጣን በግልጽ ያሳያል፤ የፖለቲካ ገዥነትን አያመለክትም።
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: በኢየሱስም እግር አጠገብ ወድቆ
  rationale: παρά ያለውን ‘አጠገብ/በአጠገብ’ ትርጉም በቅርብ ይጠብቃል፣ ድርጊቱም የተማጽኖ አቀማመጥ መሆኑን ያሳያል።
- source_word: παρεκάλει
  choice: ለመነው
  rationale: በዐውዱ ያለውን አጥብቆ የመማጸን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: ወደ ቤቱ እንዲገባ
  rationale: የግሪኩን የእንቅስቃሴና የመግባት ሐሳብ በቀጥታ ይገልጻል።
