base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: am
  text: ስለዚህ እንዴት እንደምትሰሙ ተጠንቀቁ፤ ያለው ሁሉ ይሰጠዋልና፤ የሌለው ግን ያለው ብሎ የሚያስበውም[a] እንኳ ከእርሱ ይወሰዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ያለው የሚመስለው እንኳ ከእርሱ ይወሰዳል።»
    reason: lexical_alternative
