  rationale: πῶς የመስማቱን ሁኔታ ያጎላል፤ አገላለጹም ቃሉን በምን ዓይነት አቀባበል እንደሚሰሙ እንዲመረምሩ ይጠይቃል።
- source_word: ὃς ἂν ... ἔχῃ
