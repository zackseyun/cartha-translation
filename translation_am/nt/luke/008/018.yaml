- source_word: ὃ δοκεῖ ἔχειν
  choice: እንዳለው የሚያስበውም
  rationale: δοκέω «ማሰብ» ወይም «መምሰል» ሊል ይችላል። ዋናው ጽሑፍ ሰውየው እንዳለው የሚገምተውን ሐሳብ በግልጽ አማርኛ ይገልጣል፤ ሌላው የትርጉም አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ከእርሱ ይወሰዳል
  rationale: የወደፊት ጊዜ ተደራጊ ግሱ አንድ ነገር ከሰውየው መወገዱን ወይም መነጠቁን ያሳያል፤ «ይወሰዳል» ግልጽና የተለመደ ነው።
- source_word: αὐτῷ / αὐτοῦ
