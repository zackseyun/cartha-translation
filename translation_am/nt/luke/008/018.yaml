- issue: δοκεῖ የሚለው ቃል ማሰብን ወይም መምሰልን ማመልከቱ
  choice: በዋናው ጽሑፍ «እንዳለው የሚያስበው» ተብሏል።
  alternative: «ያለው የሚመስለው»
  rationale: ሁለቱም በግሪክኛው ሊደገፉ ይችላሉ። ዋናው አገላለጽ ለዘመናዊ አንባቢ ግልጽ ሲሆን፣ እውነተኛው የቃል አማራጭ በእግር ማስታወሻ ተጠብቋል።
