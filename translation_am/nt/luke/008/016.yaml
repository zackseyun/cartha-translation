id: LUK.8.16
reference: Luke 8:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: am
  text: ማንም መብራት አብርቶ በዕቃ አይሸፍነውም ወይም ከአልጋ ሥር አያስቀምጠውም፤ ነገር ግን ወደ ውስጥ የሚገቡት ብርሃኑን እንዲያዩ በመቅረዝ ላይ ያስቀምጠዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: መብራት
  rationale: በዘመኑ የነበረውን ትንሽ የዘይት መብራት የሚያመለክት ሲሆን፣ «መብራት» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: σκεύει
  choice: በዕቃ
  rationale: ቃሉ የተለየ የዕቃ ዓይነት አይወስንም፤ ስለዚህ የምንጩን ሰፊ ትርጉም ለማቆየት «ዕቃ» ተመርጧል።
- source_word: κλίνης
  choice: አልጋ
  rationale: በዚህ አውድ የመኝታ ወይም የመደገፊያ ዕቃን ያመለክታል፤ «አልጋ» ለተራ አንባቢ ቀጥተኛና ግልጽ ነው።
- source_word: λυχνίας
  choice: መቅረዝ
  rationale: መብራት የሚቀመጥበትን መደገፊያ ያመለክታል፤ «መቅረዝ» በመጽሐፍ ቅዱሳዊ አማርኛ የታወቀና ከ«መብራት» የሚለይ ቃል ነው።
- source_word: οἱ εἰσπορευόμενοι
  choice: ወደ ውስጥ የሚገቡት
  rationale: የአሁን ጊዜ አሳታፊውን እና የመግባትን አቅጣጫ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የምሳሌው ትርጉም
  choice: የመብራቱን፣ የመቅረዙንና የብርሃኑን ምስላዊ ቃላት ያለ ትርጓሜ ማቆየት
  alternative: መብራቱን ከወንጌል፣ ከቃሉ ወይም ከምስክርነት ጋር በግልጽ መለየት
  rationale: ጥቅሱ ራሱ ምሳሌውን በዚህ ቦታ በአንድ ብቻ ትርጓሜ አይገድበውም፤ ስለዚህ የምንጩ ምስላዊነትና ክፍትነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ δέ እዚህ የንግግር ማያያዣ ስለሆነ በግድ «አሁን» ወይም «ግን» ተብሎ አልተተረጎመም፤ ነገር ግን ἀλλά ያለው ግልጽ ንፅፅር «ነገር ግን» ተብሎ ተላልፏል።
