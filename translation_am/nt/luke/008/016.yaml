review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the sequence of lighting, covering with an unspecified vessel, placing under a bed, and instead placing on a lampstand so that entrants see the light. Its rendering of the purpose clause is faithful.
  naturalness: The wording is generally clear and modern. However, «ከአልጋ በታች» is less idiomatic for static location in this sentence; «ከአልጋ ሥር» is a natural and precise equivalent of ‘under a bed.’ Keeping the verse as one sentence also better reflects the Greek contrast.
  terminology: «መብራት» suitably renders λύχνος, «ዕቃ» preserves the nonspecific σκεῦος, and «መቅረዝ» appropriately distinguishes the lampstand from the lamp. No doctrinal interpretation has been introduced.
  issues:
