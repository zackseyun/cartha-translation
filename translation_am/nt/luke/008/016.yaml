    issue: Static-location phrase for ‘under a bed’
    rationale: «ከአልጋ ሥር» is more natural modern standard Amharic than «ከአልጋ በታች» in this context, while preserving the source’s indefinite singular sense.
  revised_text: ማንም መብራት አብርቶ በዕቃ አይሸፍነውም ወይም ከአልጋ ሥር አያስቀምጠውም፤ ነገር ግን ወደ ውስጥ የሚገቡት ብርሃኑን እንዲያዩ በመቅረዝ ላይ ያስቀምጠዋል።
