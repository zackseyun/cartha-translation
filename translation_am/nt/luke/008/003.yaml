base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: am
  text: እንዲሁም የሄሮድ አስተዳዳሪ የኩዛ ሚስት ዮሐና፣ ሱሳናና ሌሎች ብዙ ሴቶች፤ እነዚህም እነርሱን[a] ከንብረታቸው[b] ያገለግሏቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የጥንት ቅጂዎች “እነርሱን” በሚለው ፈንታ “እርሱን” ይላሉ።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “ከነበራቸው” ወይም “ከአቅማቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: ሚስት
  rationale: ከኩዛ ስም ጋር በዝምድና አገባብ የተቀመጠው γυνή ዮሐና የኩዛ ሚስት መሆኗን በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: ἐπιτρόπου
  choice: አስተዳዳሪ
  rationale: ቃሉ በጉዳዮች ወይም በንብረት ላይ የተሾመን ሰው ያመለክታል፤ “አስተዳዳሪ” በንጉሣዊ ቤት ወይም ንብረት አውድ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἕτεραι πολλαί
  choice: ሌሎች ብዙ ሴቶች
  rationale: የግሪኩ ቅጽ እንስታዊ ብዙ ቁጥር ስለሆነ፣ በአማርኛ ማጣቀሻውን ግልጽ ለማድረግ “ሴቶች” ተጨምሯል።
- source_word: διηκόνουν
  choice: ያገለግሉ ነበር
  rationale: “ማገልገል” የቃሉን ሰፊ የአገልግሎት ትርጉም ይጠብቃል፤ በኋለኛ ዘመን የቤተ ክርስቲያን ሹመት ልዩ ትርጉም አያስገባም።
- source_word: αὐτοῖς
  choice: እነርሱን
  rationale: የቀረበው የግሪክ ጽሑፍ ብዙ ቁጥር አለው፤ ስለዚህ ኢየሱስንና ከእርሱ ጋር ያሉትን የሚያመለክተው ብዙ ቁጥር ተጠብቋል።
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: ካላቸው ንብረት እያወጡ
  rationale: ሐረጉ አገልግሎታቸው ከራሳቸው ሀብት፣ ንብረት ወይም አቅም እንደተደገፈ ያሳያል፤ ይህ አተረጓጎም ምንጩንና ተግባሩን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የαὐτοῖς ማጣቀሻና የጽሑፍ ልዩነት
  choice: ብዙ ቁጥር፦ እነርሱን
  alternative: ነጠላ ቁጥር፦ እርሱን፣ ማለትም ኢየሱስን
  rationale: SBLGNT እዚህ αὐτοῖς የሚለውን ብዙ ቁጥር ያቀርባል፤ ትርጉሙም ይህን ይከተላል። የነጠላ ቁጥር ንባብ በግርጌ ማስታወሻ ተጠቅሷል፣ ያለውም ውጥረት በዶክትሪናዊ ግምት አልተወገደም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የሴቶቹ አገልግሎት በቁሳዊ ድጋፍ እንደተገለጠ ዐውዱ ቢያሳይም፣ διηκόνουν የሚለው ግስ በጠባብ ሃይማኖታዊ ሹመት ቃል አልተተረጎመም።
