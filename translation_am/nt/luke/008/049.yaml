id: LUK.8.49
reference: Luke 8:49
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: am
  text: እርሱም ገና እየተናገረ ሳለ፣ ከምኩራብ አለቃው ዘንድ አንድ ሰው መጥቶ፣ “ሴት ልጅህ ሞታለች፤ መምህሩን ከእንግዲህ ወዲያ አታስቸግረው” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: እርሱም ገና እየተናገረ ሳለ
  rationale: የግሪኩን አብሮ በአንድ ጊዜ የሚከናወን ድርጊትና የἔτιን ‘ገና’ የሚል ጊዜያዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔρχεταί τις
  choice: አንድ ሰው መጥቶ
  rationale: ታሪካዊውን የአሁን ጊዜ ግስ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ያቀርባል፤ τις የማይታወቅን ሰው ያመለክታል።
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: ከምኩራብ አለቃው ዘንድ
  rationale: παρά ከዘር አመልካች ጋር የመልእክቱን ምንጭ ያሳያል፤ ἀρχισυνάγωγος የምኩራብን ኃላፊ ወይም መሪ ያመለክታል።
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: ሴት ልጅህ ሞታለች
  rationale: የፍጹም ጊዜውን የሞት ክስተትና የተገኘውን የአሁን ሁኔታ በተለመደው የአማርኛ አገላለጽ ያስተላልፋል። ‘ሴት ልጅ’ የθυγάτηρን ፆታ በግልጽ ይጠብቃል።
- source_word: μηκέτι σκύλλε
  choice: ከእንግዲህ ወዲያ አታስቸግረው
  rationale: μηκέτι ከዚህ ጊዜ በኋላ ድርጊቱ እንዲቆም የሚያዝ ሲሆን፣ σκύλλω እዚህ ‘ማስቸገር’ በሚለው ክብር ያለውና ተፈጥሯዊ ቃል ተተርጉሟል።
- source_word: τὸν διδάσκαλον
  choice: መምህሩን
  rationale: διδάσκαλος በቀጥታ ‘መምህር’ ማለት ነው፤ ጽሑፉ ያልገለጸውን የማዕረግ ከፍታ አይጨምርም።
theological_decisions:
- issue: የἀρχισυνάγωγος ትርጉም
  choice: የምኩራብ አለቃ
  alternative: የምኩራብ መሪ / ኃላፊ
  rationale: ይህ የተቋም ሥልጣንን የሚገልጽ ስያሜ እንጂ የኋለኛውን ዘመን የቤተ ክርስቲያን ማዕረግ አይደለም። ‘አለቃ’ ሚናውን በግልጽና በተለመደ አማርኛ ያሳያል።
- issue: የδιδάσκαλος ትርጉም
  choice: መምህር
  alternative: ጌታ
  rationale: የግሪኩ ቃል በዚህ ስፍራ መደበኛውን ‘መምህር’ ትርጉም ይዟል። ‘ጌታ’ ማለት በዚህ ሐረግ በግልጽ ያልተጠቀሰ ተጨማሪ ክርስቶሳዊ ማዕረግ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በእንግሊዝኛው የቀረቡት የግርጌ ማስታወሻ ምልክቶች ከሚያብራሩት ቃል ጋር የተዛመዱ ስላልነበሩና በዚህ አማርኛ ረቂቅ የሚያስፈልግ እውነተኛ የትርጉም አሻሚነት ስላልፈጠሩ፣ የግርጌ ማስታወሻ አልተጨመረም።
