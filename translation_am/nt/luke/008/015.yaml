base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: am
  text: መልካም መሬት ላይ ያለው ዘር ግን፣ እነዚህ ማለት ቃሉን በመልካምና ቅን ልብ[a] ሰምተው አጥብቀው የሚይዙና በጽናት ፍሬ የሚያፈሩ ሰዎች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በክቡርና መልካም ልብ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: መልካም መሬት ላይ ያለው ዘር
  rationale: በግሪኩ የተተወውን ስም በምሳሌው አውድ መሠረት “ዘር” በማለት ማሟላት ማጣቀሻውን ግልጽ ያደርጋል፤ “መሬት” ደግሞ የእርሻውን ምስል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὗτοί εἰσιν οἵτινες
  choice: የሚያፈሩት እነዚህ ናቸው
  rationale: የግሪኩን መለያ አገላለጽ በተፈጥሯዊ የአማርኛ ዐረፍተ ነገር አወቃቀር ይጠብቃል።
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: በቅንና በመልካም ልብ
  rationale: “ልብ” ውስጣዊውን ሰው ያመለክታል። ሁለቱን ተቀራራቢ ቅጽሎች “ቅን” እና “መልካም” ብሎ መለየት ድርብ የሥነ ምግባር ምስጋናውን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἀκούσαντες τὸν λόγον
  choice: ቃሉን ... ሰምተው
  rationale: የግሪኩ አንቀጽ መስማቱ ከመያዝና ፍሬ ከማፍራት እንደሚቀድም ያሳያል፤ “ቃሉ” የምሳሌውን የተቋቋመ አጠራር ይጠብቃል።
- source_word: κατέχουσιν
  choice: አጥብቀው የሚይዙት
  rationale: ግሱ ቃሉን በጽናት መጠበቅን እንጂ ብቻ መያዝን አያመለክትም፤ “አጥብቀው” ይህን ንቁ ጽናት ያሳያል።
- source_word: καρποφοροῦσιν
  choice: ፍሬ የሚያፈሩት
  rationale: የምሳሌውን የእርሻ ምስል በተለመደና ግልጽ አማርኛ ያቆያል።
- source_word: ἐν ὑπομονῇ
  choice: በጽናት
  rationale: ὑπομονή በችግር ውስጥ የሚቀጥል ጽኑ መቆየትን ያመለክታል፤ “በጽናት” የፍሬ ማፍራቱን ሁኔታ በአጭርና ተፈጥሯዊ መንገድ ይገልጻል።
theological_decisions:
- issue: ቃሉን የሚቀበለው ልብ የሥነ ምግባር ገለጻ
  choice: በቅንና በመልካም ልብ
  alternative: በመልካምና በክቡር ልብ
  rationale: ጥቅሱ የሰሚዎቹን ውስጣዊ ዝንባሌ በአዎንታዊ ሁኔታ ይገልጻል፤ ይህ ልብ እንዴት እንደተፈጠረ ወይም የትኛውንም የድነት ሥርዓት ግን አይወስንም። ትርጉሙ ይህን ውጥረት ሳይፈታ የግሪኩን ሁለት ቅጽሎች ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩን የእርሻ ምስልና የጽናት አጽንዖት ይጠብቃል።
