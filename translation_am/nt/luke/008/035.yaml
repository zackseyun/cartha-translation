  rationale: አቀማመጡ መገዛትን ወይም ደቀ መዝሙርነትን ሊያመለክት ቢችልም፣ ግሪኩ በቀጥታ የሚናገረው ቦታውን ነው፤ የሚቻለውን ተጨማሪ ትርጉም ለአንባቢው ክፍት ማድረግ ይገባል።
