- source_word: βλέποντες μὴ βλέπωσιν
  choice: እያዩ እንዳያዩ
  rationale: በምንጩ ያለውን ‘ማየት’ የቃል ድግግሞሽ ይጠብቃል፣ የኢሳይያስንም አስተጋብኦ ያስቀራል።
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: እየሰሙም እንዳያስተውሉ
