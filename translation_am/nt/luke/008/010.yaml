  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: am
  text: እርሱም እንዲህ አለ፤ “የእግዚአብሔርን መንግሥት ምሥጢራት[a] እንድታውቁ ለእናንተ ተሰጥቷችኋል፤ ለቀሩት ግን በምሳሌዎች ነው፤ እንዲህ እንዲሆን ነው፤ እያዩ እንዳያዩ፣ እየሰሙም እንዳያስተውሉ።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ምሥጢራት” የሚለው “ምስጢሮች” ወይም “የተሰወሩ እውነቶች” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ከአንዳንዶች ተሰውረው ለሌሎች የተገለጡትን የእግዚአብሔር መንግሥት እውነቶች ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “እያዩ እንዳያዩ፣ እየሰሙም እንዳያስተውሉ” የሚለው ኢሳይያስ 6፥9-10ን ያስተጋባል። ሐረጉ መለኮታዊ ዓላማን፣ የፍርድ ውጤትን ወይም ሁለቱንም እንደሚገልጥ ሊረዳ ይችላል።
    reason: cross_reference
lexical_decisions:
