  rationale: የእግዚአብሔርን ንግሥናም ሆነ የግዛቱን ወሰን ሊያካትት የሚችል፣ የታወቀና ተፈጥሯዊ አገላለጽ ነው።
- source_word: τοῖς δὲ λοιποῖς
  choice: ለቀሩት ግን
