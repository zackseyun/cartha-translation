review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' question, the reply “ሌጌዎን,” the causal relation, and the plurality of demons. However, “ወደ እርሱ ገብተው” does not clearly express εἰς αὐτόν (“into him”); it can mean merely “entered toward/to him.”
  naturalness: The narrative is fluent modern standard Amharic. Replacing the final directional phrase with “በውስጡ ገብተው” is both idiomatic and semantically precise in this context.
  terminology: “አጋንንት” is an appropriate direct rendering of δαιμόνια. “ሌጌዎን” appropriately retains the Greek/Latin designation, and the cultural footnote is suitable.
  issues:
  - severity: medium
    issue: The phrase “ወደ እርሱ ገብተው” weakly renders εἰς αὐτόν.
    rationale: The Greek specifies entry into the man. In Amharic, “ወደ እርሱ” normally marks destination toward him and does not necessarily indicate entry into his person. “በውስጡ ገብተው” preserves the intended directional/resultative sense naturally.
