  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: am
  text: ኢየሱስም፣ “ስምህ ማን ነው?” ብሎ ጠየቀው። እርሱም፣ “ሌጌዎን”[a] አለ፤ ብዙ አጋንንት በውስጡ ገብተው ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሌጌዎን” ከላቲን የተወሰደ ቃል ሲሆን ብዙ ወታደሮች ያሉበትን ትልቅ የሮም ወታደራዊ ክፍል ያመለክታል፤ እዚህ ብዙ አጋንንት በሰውየው ውስጥ እንዳሉ ያሳያል።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: ጠየቀው
  rationale: በቀጥታ ጥያቄን የሚያስተዋውቀውን ግስ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: -ም
  rationale: የትረካውን ቀጣይነትና ረጋ ያለ ሽግግር ያለ ከባድ አጽንዖት ያሳያል።
- source_word: Τί σοι ὄνομά ἐστιν
  choice: ስምህ ማን ነው?
  rationale: የግሪኩን ፍቺ በዘመናዊ አማርኛ የተለመደ የስም መጠየቂያ አነጋገር ይገልጻል።
- source_word: Λεγιών
  choice: ሌጌዎን
  rationale: የግሪኩን አጠራር የሚከተልና በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የሚታወቅ የቃል ንባብ ነው።
- source_word: ὅτι
  choice: -ና
  rationale: ‘ሌጌዎን’ የተባለበትን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ አያያዝ ያሳያል።
- source_word: εἰσῆλθεν
  choice: ገብተው ነበር
  rationale: መግባታቸው ከተሰጠው መልስ በፊት መሆኑን በአማርኛ የቀደመ ጊዜ አገላለጽ ግልጽ ያደርጋል።
- source_word: δαιμόνια πολλὰ
  choice: ብዙ አጋንንት
  rationale: የቃሉን ልዩ መንፈሳዊ ማጣቀሻና የብዛት አጽንዖት በቀጥታ ይጠብቃል።
- source_word: εἰς αὐτόν
  choice: ወደ እርሱ
  rationale: εἰς የሚያሳየውን ወደ ውስጥ የመግባት አቅጣጫ ይጠብቃል።
theological_decisions:
- issue: በክፉ መናፍስት መያዝ አውድ ውስጥ δαιμόνιαን መተርጎም
  choice: አጋንንት
  alternative: ክፉ መናፍስት
  rationale: ግሪኩ ወደ ሰውየው የገቡ ብዙ ክፉ መንፈሳዊ ፍጡራንን በተለየ ቃል ይጠቅሳል፤ ‘አጋንንት’ ይህን በቀጥታ ይገልጻል።
- issue: “ሌጌዎን” የሚለውን መልስ ማን እንደተናገረ መግለጽ
  choice: እርሱም … አለ
  alternative: ጋኔኑም … አለ
  rationale: ὁ δὲ በሰዋሰው ወደ ሰውየው ሊመለስ ይችላል፤ አጋንንቱ በእርሱ በኩል መናገራቸውም በአውዱ ይታያል። ትርጉሙ ተናጋሪውን ‘ጋኔን’ ብሎ በመለየት የግሪኩን አሻሚነት አይዘጋም።
- issue: εἰσῆλθεν ከስሙ ማብራሪያ ጋር ያለው የጊዜ ግንኙነት
  choice: ገብተው ነበር
  alternative: ገቡ
  rationale: የአጋንንቱ መግባት ‘ሌጌዎን’ ከሚለው መልስ እንደቀደመ በተፈጥሯዊ አማርኛ ያብራራል፤ ይህ የጊዜ ግንኙነት ማብራሪያ እንጂ የእምነት ትርጓሜ ጭማሪ አይደለም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የእንግሊዝኛው [a] ማስታወሻ ይዘት ከተቀመጠበት ቦታ ጋር ስለማይጣጣም አልተካተተም፤ ስለ ‘ሌጌዎን’ ያለው ባህላዊ ማብራሪያ ግን በቃሉ ላይ [a] ተደርጎ ቀርቧል።
