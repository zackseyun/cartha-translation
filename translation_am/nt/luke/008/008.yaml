  text: ሌላ ዘርም በመልካም አፈር[a] ላይ ወደቀ፤ አድጎም መቶ እጥፍ ፍሬ አፈራ[b]። እነዚህን ሲናገር ድምፁን ከፍ አድርጎ፣ “ለመስማት ጆሮ ያለው ይስማ[c]!” አለ።
