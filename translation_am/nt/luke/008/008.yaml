  terminology: መልካም አፈር, መቶ እጥፍ ፍሬ አፈራ, and ድምፁን ከፍ አድርጎ are suitable agricultural and narrative expressions. 'ለመስማት ጆሮ ያለው' retains the hearing imagery and exhortatory ambiguity without interpreting it as understanding.
  issues:
