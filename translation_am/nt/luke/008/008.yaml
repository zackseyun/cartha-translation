  source_fidelity: The draft accurately conveys the good soil, growth before fruit-bearing, the hundredfold yield, and the imperative exhortation. However, the final saying should more directly reflect ὦτα ἀκούειν ('ears to hear'), rather than wording that can mean simply 'an ear with which to hear.' The plural ταῦτα is also better represented by 'these things.'
