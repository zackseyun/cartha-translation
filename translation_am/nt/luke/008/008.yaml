  choice: የምንጩ ድርብ ስሜት በ“የሚሰማበት ጆሮ…ይስማ” ተጠብቋል
  alternative: “ለመረዳት የሚችል ይረዳ”
  rationale: “ይረዳ” ማለት ትርጓሜውን በግልጽ ይፈታል፤ ምንጩ ግን የጆሮና የመስማትን ምስል በመጠቀም ትርጉማዊ ውጥረቱን ይጠብቃል።
