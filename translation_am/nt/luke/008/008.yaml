  rationale: ኢየሱስ በአጽንዖት እንደተናገረ ያሳያል፤ ከልክ ያለፈ ቁጣ ወይም ጩኸት ግን አያስገባም።
- source_word: Ὁ ἔχων ὦτα ἀκούειν
