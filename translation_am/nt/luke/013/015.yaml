base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: am
  text: ጌታ ግን መልሶ እንዲህ አለው፦ “እናንተ ግብዞች! ከእናንተ እያንዳንዱ በሰንበት ቀን የራሱን በሬ ወይም አህያ ከመኖ ገንዳ[a] ፈትቶ ወስዶ ውሃ አያጠጣውምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መመገቢያ ቦታ” ወይም “መኖ ማስቀመጫ።” የግሪኩ φάτνη መኖ የሚቀርብበትን ገንዳ ወይም ቦታ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: በሉቃስ ትረካ ለኢየሱስ የተሰጠውን የክብርና የክርስቶሳዊ ክብደት ያለውን ስያሜ ይጠብቃል።
- source_word: Ὑποκριταί
  choice: እናንተ ግብዞች
  rationale: የብዙ ቁጥር ቀጥተኛ ጥሪውንና የተግሣጹን ጥንካሬ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἕκαστος ὑμῶν
  choice: ከእናንተ እያንዳንዱ
  rationale: ንግግሩ በየግለሰቡ ልማድ ላይ የሚያደርገውን አጽንዖት ይጠብቃል።
- source_word: τῷ σαββάτῳ
  choice: በሰንበት ቀን
  rationale: ጊዜን የሚገልጠውን ዳቲቭ በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: λύει
  choice: ፈትቶ
  rationale: የታሰረውን እንስሳ መፍታትን በዐውዱ በግልጽ ይገልጣል።
- source_word: βοῦν
  choice: በሬ
  rationale: የከብት ዓይነቱን በተለመደና በዐውዱ ተስማሚ ቃል ያቀርባል።
- source_word: ὄνον
  choice: አህያ
  rationale: ዘመናዊ አማርኛ ውስጥ ግልጽና መደበኛ መጠሪያ ነው።
- source_word: φάτνης
  choice: መኖ ገንዳ
  rationale: እንስሳው ከሚመገብበት ዕቃ ወይም ቦታ መፈታቱን በተጨባጭ ምስል ያሳያል፤ የቃሉ ሰፊ የትርጉም ክልል በማስታወሻ ተጠቅሷል።
- source_word: ἀπαγαγὼν
  choice: ወስዶ
  rationale: ከመፍታቱ በኋላ እንስሳውን ወደ ውሃ የመምራቱን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ποτίζει
  choice: ውሃ ሊያጠጣው
  rationale: ለእንስሳው ውሃ እንዲጠጣ ማድረግን በአማርኛ ተፈጥሯዊ በሆነ ግስ ይገልጣል።
