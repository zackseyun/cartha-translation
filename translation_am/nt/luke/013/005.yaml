  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: am
  text: “አይደለም፤ እላችኋለሁ። ነገር ግን ንስሐ ካልገባችሁ፣ ሁላችሁም እንደዚሁ ትጠፋላችሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚያው መንገድ ትጠፋላችሁ።» የግሪኩ «እንደዚሁ» የሚለው ቃል፣ ከቀደሙት ምሳሌዎች አንጻር ተመሳሳይ የፍርድ ዓይነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: አይደለም
  rationale: በቀደመው አውድ ውስጥ ለተጠቆመው ጥያቄ የተሰጠ አጽንዖት ያለው አሉታዊ መልስ ነው፤ «አይደለም» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛ ንግግር በአጭር፣ በተፈጥሯዊና በክብር ባለው አማርኛ ያቀርባል።
- source_word: ἀλλ’ ἐὰν μὴ
  choice: ነገር ግን … ካል-
  rationale: የተቃርኖውንና የሁኔታውን ኃይል በአማርኛ ተፈጥሯዊ በሆነ አሉታዊ ሁኔታዊ አወቃቀር ይገልጣል።
- source_word: μετανοῆτε
  choice: ንስሐ ገባችሁ
  rationale: ቃሉ በዚህ አውድ ከቀላል የሐሳብ ለውጥ ይልቅ ወደ እግዚአብሔር የሚመለስ ንስሐን ያመለክታል፤ «ንስሐ መግባት» በአማርኛ የተለመደና ክብደቱን የሚጠብቅ አገላለጽ ነው።
- source_word: πάντες
  choice: ሁላችሁም
  rationale: ማስጠንቀቂያው ሰሚዎቹን ሁሉ ያካተተ መሆኑን በግልጽ ያሳያል።
- source_word: ὡσαύτως
  choice: እንደዚሁ
  rationale: «እንዲሁ» ወይም «በተመሳሳይ ሁኔታ» የሚለውን ሰፊ ትርጉም ጠብቆ፣ ንጽጽሩ የአጥፋፉን መንገድ፣ እርግጠኝነት ወይም ፍርድ መመሳሰል እንደሆነ አይወስንም።
- source_word: ἀπολεῖσθε
  choice: ትጠፋላችሁ
  rationale: የግሪኩን የጥፋትና የመውደም ክብደት ይጠብቃል፤ ትርጉሙን በአካላዊ ሞት ብቻ አይገድብም።
theological_decisions:
- issue: በኢየሱስ ማስጠንቀቂያ ውስጥ የμετανοῆτε ትርጉም
  choice: «ንስሐ ካልገባችሁ» ተብሎ ተተርጉሟል።
  alternative: «ሐሳባችሁን ካልለወጣችሁ» ወይም «ካልተመለሳችሁ»
  rationale: «ንስሐ» የቃሉን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ክብደት ይጠብቃል፤ ነገር ግን ወደ ቀላል ስሜታዊ ጸጸት ወይም ወደ አንድ የእምነት ሥርዓት ትርጓሜ አያጠብበውም።
- issue: የὡσαύτως ἀπολεῖσθε ንጽጽር ወሰን
  choice: «እንደዚሁ ትጠፋላችሁ» ተብሎ ግልጽ ያልሆነው የንጽጽር ስፋት ተጠብቋል።
  alternative: «በዚያው መንገድ ትጠፋላችሁ»
  rationale: አውዱ ከቀደሙት ክስተቶች ጋር ያነጻጽራል፤ ነገር ግን ንጽጽሩ ትክክለኛውን የሞት መንገድ፣ ድንገተኝነት ወይም የፍርድ እርግጠኝነት ብቻ እንደሚያመለክት ጽሑፉ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ንስሐ መግባት» ለመደበኛ አማርኛ አንባቢ የታወቀ ሲሆን፣ «ትጠፋላችሁ» የማስጠንቀቂያውን ክብደት ያለ ትርጓሜያዊ ማጥበብ ይጠብቃል።
