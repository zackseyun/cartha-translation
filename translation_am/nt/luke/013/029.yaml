  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: am
  text: ከምሥራቅና ከምዕራብ፣ ከሰሜንና ከደቡብም ይመጣሉ፤ በእግዚአብሔርም መንግሥት በማዕድ ይቀመጣሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተደግፈው ይቀመጣሉ።” የግሪኩ ቃል በተለይ በግብዣ ጊዜ ምግብ ለመብላት ተደግፎ መቀመጥን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: ይመጣሉ
  rationale: የἥκω የወደፊት ጊዜ ቅርጽ እዚህ ‘ይመጣሉ’ ወይም ‘ይደርሳሉ’ ማለት ነው፤ ከአቅጣጫዎቹ ጋር ‘ይመጣሉ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: ከምሥራቅና ከምዕራብ
  rationale: ቃላቱ በቀጥታ ‘ከፀሐይ መውጫዎችና መግቢያዎች’ የሚል የአቅጣጫ ፈሊጥ ናቸው፤ በዘመናዊ አማርኛ ‘ከምሥራቅና ከምዕራብ’ በትክክል ያስተላልፈዋል።
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: ከሰሜንና ከደቡብ
  rationale: ይህ የአራቱን አቅጣጫዎች ሙሉ ወሰን የሚያሳይ ቀጥተኛና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: ἀνακλιθήσονται
  choice: በማዕድ ይቀመጣሉ
  rationale: ግሱ በግብዣ አውድ ለምግብ መደገፍን ወይም መንጋለልን ያመለክታል። ‘በማዕድ ይቀመጣሉ’ የግብዣውን ምስል ጠብቆ በዘመናዊ አማርኛ ተፈጥሯዊ ነው፤ ባህላዊው የመደገፍ ሁኔታ በማስታወሻ ተገልጿል።
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: በእግዚአብሔር መንግሥት
  rationale: የግሪኩን ሐረግ ግልጽና የተለመደ በሆነ መንገድ ይተረጉማል፤ የመንግሥቱን ሥነ መለኮታዊና የፍጻሜ ዘመን ክብደት ያለ ትርጓሜያዊ መስፋፋት ይጠብቃል።
theological_decisions:
- issue: በፍጻሜው መንግሥት ያለው የግብዣ ምስል
  choice: ‘በማዕድ ይቀመጣሉ’ በማለት የምግብና የግብዣውን ምስል ማቆየት
  alternative: ‘በእግዚአብሔር መንግሥት ይገባሉ’ ወይም ዝም ብሎ ‘ይቀመጣሉ’
  rationale: ግሪኩ በመንግሥቱ ግብዣ የመሳተፍን ተጨባጭ ምስል ያቀርባል። ‘መግባት’ ብቻ ምስሉን ያጠፋዋል፤ ነገር ግን ትርጉሙ ተጨማሪ የትምህርተ እምነት ዝርዝር አያክልም።
- issue: የአራቱ አቅጣጫዎች ሰፊ ወሰን
  choice: አራቱን አቅጣጫዎች በቀጥታ መጥቀስ
  alternative: መጥተው የሚሰበሰቡትን በዋናው ጽሑፍ ‘አሕዛብ’ ወይም ‘ከሁሉም ብሔራት’ ብሎ መግለጽ
  rationale: ንግግሩ ከሁሉም አቅጣጫ የሚመጣ ሰፊ ስብስብን ያመለክታል፤ ሆኖም ጥቅሱ ራሱ ‘አሕዛብ’ ወይም የተወሰነ የዘር ስያሜ አይጠቀምም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። ‘ማዕድ’ የግብዣውን ምስል በአጭርና በተለመደ መንገድ ያቆያል፤ በጥንቱ ዘመን በማዕድ የመደገፍ ልማድ ግን በእግር ማስታወሻ ተብራርቷል።
