    issue: The order of the quoted clauses is reversed.
    rationale: Greek presents ‘Leave and go from here’ before ‘because Herod wants to kill you.’ Keeping this order more closely preserves the source discourse flow.
  - severity: low
    issue: Footnote b’s alternative adds ‘ተነሥተህ’ (‘having risen/get up’).
    rationale: This addition is not required by πορεύου and can introduce a nuance not expressed in the Greek. A simpler alternative retains the lexical distinction without adding content.
