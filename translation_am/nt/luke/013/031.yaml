base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: am
  text: በዚያው ሰዓት[a] አንዳንድ ፈሪሳውያን ወደ እርሱ ቀርበው፣ “ከዚህ ውጣና ሂድ[b]፤ ሄሮድ ሊገድልህ ይፈልጋልና” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚያው ጊዜ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከዚህ ውጣና ሂድበት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: በዚያው ሰዓት
  rationale: αὐτῇ የሚያሳየውን የተወሰነና አጽንዖታዊ ጊዜ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: προσῆλθάν τινες Φαρισαῖοι
  choice: አንዳንድ ፈሪሳውያን ወደ እርሱ ቀርበው
  rationale: τινες ያልተወሰኑ ከፊሎችን ያመለክታል፤ προσῆλθάν ደግሞ ወደ ኢየሱስ መቅረባቸውን ይገልጣል።
- source_word: λέγοντες αὐτῷ
  choice: አሉት
  rationale: የግሪኩን ተጓዳኝ ድርጊት ለተፈጥሯዊ የአማርኛ አገባብ በዋና ግስ ይገልጣል።
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: ከዚህ ውጣና ሂድ
  rationale: ሁለቱን ትእዛዛዊ ግሶች እና ከአሁኑ ስፍራ የመራቅን ሐሳብ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι
  choice: ሄሮድ ሊገድልህ ይፈልጋልና
  rationale: ὅτι የሚያስገባውን ምክንያት “-ና” በሚለው ተፈጥሯዊ አገናኝ ያሳያል፤ θέλει ፍላጎትን እንጂ የተወሰነ ዕቅድን አያስገድድም።
theological_decisions:
- issue: የፈሪሳውያኑ ማስጠንቀቂያ ዓላማ
  choice: ንግግራቸውን እንደተነገረው ብቻ ማቅረብ፣ ልባዊ ወይም አታላይ እንደነበሩ አለመወሰን
  alternative: ፈሪሳውያኑ ኢየሱስን በቅንነት አስጠነቀቁት፣ ወይም ሊያስፈራሩትና ከስፍራው ሊያስወጡት ሞከሩ
  rationale: የግሪኩ ጽሑፍ ንግግራቸውን ዘግቧል እንጂ ውስጣዊ ዓላማቸውን አይገልጥም፤ ትርጉሙም ይህን ግልጽ ያልሆነ ሁኔታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ቀጥተኛው ንግግር ግልጽ ተደርጎ ቀርቧል፤ የፈሪሳውያኑ ዓላማ ግን አልተተረጎመም።
