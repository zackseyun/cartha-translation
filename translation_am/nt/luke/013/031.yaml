  naturalness: The Amharic is generally clear and modern. ‘ከዚህ ውጣና ሂድ’ is natural and direct. Placing the warning first and the reason second also produces a more natural command followed by explanation.
  terminology: ‘ፈሪሳውያን,’ ‘ሄሮድ,’ and ‘ሊገድልህ ይፈልጋል’ are appropriate modern-standard renderings. The revision preserves neutrality concerning the Pharisees’ motive.
