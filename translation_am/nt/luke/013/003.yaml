  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: am
  text: «አይደለም፣ እላችኋለሁ፤ ነገር ግን ንስሐ ካልገባችሁ፣ ሁላችሁም እንደዚሁ[a] ትጠፋላችሁ።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በተመሳሳይ ሁኔታ»። «እንደዚሁ» የሚለው ቃል የሞቱ አኳኋን ፍጹም አንድ ነው ማለት ሳይሆን፣ ድንገተኛ የፍርድ መምጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: አይደለም
  rationale: በቀደመው አውድ የተገመተውን ሐሳብ በግልጽ የሚክድ፣ ተፈጥሯዊ የአማርኛ መልስ ነው።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን የብዙ ቁጥር አድራሻና የንግግሩን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከተካደው ግምት ጋር ያለውን ተቃርኖ በግልጽ ያሳያል።
- source_word: ἐὰν μὴ
  choice: ካል-
  rationale: አሉታዊውን ሁኔታ ‘ካል...’ በሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: μετανοῆτε
  choice: ንስሐ ካልገባችሁ
  rationale: ቃሉ በዚህ አውድ ተራ የአእምሮ ለውጥን ብቻ ሳይሆን ከኃጢአት ወደ እግዚአብሔር መመለስን ያመለክታል፤ ‘ንስሐ መግባት’ በዘመናዊ አማርኛ የተለመደና ግልጽ ነው።
- source_word: πάντες
  choice: ሁላችሁም
  rationale: ማስጠንቀቂያው ለሰሚዎቹ ሁሉ እንደሚሠራ በግልጽ ያሳያል።
- source_word: ὁμοίως
  choice: እንደዚሁ
  rationale: ከቀደሙት ክስተቶች ጋር ያለውን ንጽጽር ይጠብቃል፤ ግን ፍጹም ተመሳሳይ የሞት ሁኔታን እንዳያስገድድ በማስታወሻ ተገልጿል።
- source_word: ἀπολεῖσθε
  choice: ትጠፋላችሁ
  rationale: የመጥፋትንና ወደ ጥፋት የመድረስን ከባድ ማስጠንቀቂያ ይጠብቃል፤ ትርጉሙን በአካላዊ ሞት ወይም በዘላለማዊ ፍርድ ብቻ አይገድብም።
theological_decisions:
- issue: በኢየሱስ ማስጠንቀቂያ ውስጥ የἀπολεῖσθε ወሰን
  choice: ትጠፋላችሁ
  alternative: ትሞታላችሁ፤ ለዘላለም ትፈረድባችኋል፤ ትደመሰሳላችሁ
  rationale: ግሪክኛው ንስሐ ካለመግባት ጋር የተያያዘ ፍርድን ያስጠነቅቃል፣ ነገር ግን የጥፋቱን ትክክለኛ መልክና ወሰን በዚህ ጥቅስ አይወስንም። ‘ትጠፋላችሁ’ ይህን የሥነ መለኮት ውጥረት ሳይፈታ ይጠብቃል።
- issue: የμετανοέω ሥነ መለኮታዊ ክብደት
  choice: ንስሐ መግባት
  alternative: አስተሳሰባችሁን መለወጥ፤ ሐሳባችሁን መቀየር
  rationale: በዚህ የፍርድ አውድ ቃሉ አእምሯዊ አቋም መቀየርን ብቻ አይገልጽም፤ የሰውን ልብና አቅጣጫ የሚመለከት ንስሐን ይጠይቃል። ሆኖም ትርጉሙ የአንድን ወገን ልዩ የንስሐ ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥተኛ ንግግሩ ኃይል ተጠብቋል፤ ‘ንስሐ መግባት’ የመጽሐፍ ቅዱስ አውድን የሚገልጽ ሲሆን ከመጠን በላይ ጥንታዊ ወይም የቡድን ልዩ አገላለጽ አይደለም።
