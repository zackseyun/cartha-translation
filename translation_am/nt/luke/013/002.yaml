revisions:
- from: እርሱም መልሶ እንዲህ አላቸው፤ “እነዚህ ገሊላውያን ይህን ስለተቀበሉ፣ ከሌሎቹ ገሊላውያን ሁሉ ይልቅ ኃጢአተኞች ሆነው ይመስላችኋል?”
  to: እርሱም መልሶ እንዲህ አላቸው፤ “እነዚህ ገሊላውያን እነዚህ ነገሮች ስለደረሱባቸው፣ ከገሊላውያን ሁሉ ይልቅ ኃጢአተኞች ሆኑ ብላችሁ ታስባላችሁን?”
