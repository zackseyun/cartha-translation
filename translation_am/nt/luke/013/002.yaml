language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: am
  text: እርሱም መልሶ እንዲህ አላቸው፤ “እነዚህ ገሊላውያን እነዚህ ነገሮች ስለደረሱባቸው፣ ከገሊላውያን ሁሉ ይልቅ ኃጢአተኞች ሆኑ ብላችሁ ታስባላችሁን?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመልስ አሰጣጥ ቅርጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: ከሌሎቹ ገሊላውያን ሁሉ ይልቅ ኃጢአተኞች ሆነው
  rationale: ἐγένοντο የሚለውን ‘ሆነው’ በማለት ይጠብቃል፤ παρὰ πάντας የሚያሳየውን ንጽጽርም ግልጽ ያደርጋል።
- source_word: ταῦτα πεπόνθασιν
  choice: ይህን ስለተቀበሉ
  rationale: ፍጹም ጊዜው ያለፈውን መከራ እና ያለውን ውጤት ይጠቁማል፤ ‘ተቀበሉ’ መከራን መቀበል በሚለው ተፈጥሯዊ አጠቃቀም ተተርጉሟል።
- source_word: Δοκεῖτε ὅτι
  choice: ይመስላችኋል?
  rationale: የኢየሱስን ጥያቄ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: መከራ ከኃጢአተኝነት መጠን ጋር ያለው ግንኙነት
  choice: ጥያቄውን ብቻ ማቅረብ፣ በዚህ ቁጥር ያልተገለጸውን መልስ አለመጨመር
  alternative: መከራቸው የበለጠ ኃጢአተኞች መሆናቸውን አያሳይም ብሎ በግልጽ መተርጎም
  rationale: የግሪክ ጽሑፉ እዚህ ላይ ጥያቄ ብቻ ያቀርባል፤ መልሱ በሚቀጥለው ቁጥር ይመጣል።
- issue: ἐγένοντο የሚለው የመሆን ግስ
  choice: ‘ሆነው’ ብሎ በግልጽ ማቆየት
  alternative: ‘ነበሩ’ ብሎ የሁኔታ ግስ መጠቀም
  rationale: የምንጭ ጽሑፉን የቃል ምርጫና በእንግሊዝኛ POB የተጠበቀውን ልዩነት ይዞ ይቀራል፣ የኃጢአተኝነት መንስኤን ግን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ፤ የግሪኩ ንጽጽርና ‘ሆኑ’ የሚለው ቅርጽ ተጠብቋል።
