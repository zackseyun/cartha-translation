  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: am
  text: ደግሞም፣ “የእግዚአብሔርን መንግሥት ከምን ጋር ላመሳስለው?” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ πάλιν
  choice: ደግሞም
  rationale: የቀደመውን ንግግር በቀላል አያያዥነት ያገናኛል፤ πάλιν የሚያመለክተውን ድግግሞሽም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἶπεν
  choice: አለ
  rationale: ቀጥተኛ ንግግርን ለማስገባት በአማርኛ ተፈጥሯዊና ትክክለኛ የትረካ አገላለጽ ነው።
- source_word: Τίνι
  choice: ከምን ጋር
  rationale: በዚህ አውድ ጥያቄው ሰውን ሳይሆን የንጽጽር ነገርን ይጠይቃል፤ ከὁμοιώσω ጋር ያለውን የንጽጽር ግንኙነት ግልጽ ያደርጋል።
- source_word: ὁμοιώσω
  choice: ላመሳስለው
  rationale: የግሪኩን የመጀመሪያ መደብ ነጠላ የወደፊት ጥያቄ በአማርኛ ተፈጥሯዊ የምክክር ጥያቄ ቅርጽ ያቀርባል።
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: መንግሥት የንጉሣዊ አገዛዝንና የግዛትን ስፋት ሳያጠብ የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በእግዚአብሔር ንጉሣዊ አገዛዝ ላይ ባለው ንግግር βασιλείαን መተርጎም
  choice: የእግዚአብሔር መንግሥት
  alternative: የእግዚአብሔር አገዛዝ
  rationale: “መንግሥት” የእግዚአብሔርን ንጉሣዊ አገዛዝና የግዛቱን አድማስ በአንድነት የሚይዝ ሲሆን፣ “አገዛዝ” ትርጉሙን ወደ ተግባራዊ መግዛት ብቻ ሊያጠብ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ደግሞም” የΚαὶ πάλινን አያያዥነትና ድግግሞሽ በአጭሩ ይይዛል።
