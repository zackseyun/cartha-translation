  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: am
  text: ስለዚህ እንዲህ ይል ነበር፤ “የእግዚአብሔር መንግሥት[a] ምን ትመስላለች? ከምንስ ጋር ላመሳስላት?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር ንግሥና” ወይም “የእግዚአብሔር አገዛዝ”፤ ይህም ከግዛቱ ይልቅ እግዚአብሔር በመግዛቱ ላይ አጽንዖት ይሰጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: እንዲህ ይል ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በትረካው ውስጥ የቀጠለ ወይም የተደጋገመ ንግግርን ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም ያንን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ክፍል ጋር ያለውን የንግግር ቅጥያ ወይም ድምዳሜያዊ ግንኙነት ይገልጣል።
- source_word: Τίνι ὁμοία ἐστὶν
  choice: ምን ይመስላል?
  rationale: የንጽጽር ጥያቄውን በዘመናዊና ተፈጥሯዊ አማርኛ የሚያቀርብ አባባል ነው።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ βασιλεία ግዛትንም ሆነ የመግዛት ተግባርን ሊያመለክት የሚችለውን ሰፊ የትርጉም መስክም አይዘጋም።
- source_word: καὶ
  choice: -ስ
  rationale: በ“ከምንስ” ላይ ያለው አገናኝ ቅጥያ ሁለተኛውን ትይዩ ጥያቄ ከመጀመሪያው ጋር በተፈጥሯዊ አማርኛ ያያይዛል።
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: ከምንስ ጋር ላመሳስለው?
  rationale: የወደፊት አመልካች ግሱን የምክክር ወይም የአጻጻፍ ጥያቄ ኃይል በአማርኛው “ላመሳስለው?” ይወክላል።
theological_decisions:
- issue: የ βασιλεία τοῦ θεοῦ አተረጓጎም
  choice: የእግዚአብሔር መንግሥት
  alternative: የእግዚአብሔር ንግሥና / የእግዚአብሔር አገዛዝ
  rationale: ሐረጉ የሚገዛበትን ግዛትም ሆነ የእግዚአብሔርን የመግዛት ተግባር ሊያመለክት ይችላል። “መንግሥት” የተለመደውን መጽሐፍ ቅዱሳዊ ሐረግና የምሳሌዎቹን ዘይቤ ይጠብቃል፤ ተለዋዋጩ ትርጉም ደግሞ በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ትይዩ ጥያቄዎቹና የግስ ገጽታው ተጠብቀዋል።
