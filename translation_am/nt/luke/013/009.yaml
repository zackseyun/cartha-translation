  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: am
  text: ወደፊት[a] ፍሬ ብታፈራ—መልካም ነው፤ ባታፈራ ግን ትቆርጣታለህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሚመጣው ጊዜ።” አንዳንድ ትርጉሞች ከቀደመው ቁጥር አውድ በመነሣት “በሚቀጥለው ዓመት” ይላሉ፤ የግሪኩ ሐረግ ግን በቀጥታ “ወደፊት” ወይም “በሚመጣው ጊዜ” የሚል ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: ብታፈራ
  rationale: καί + ἐάν ሁኔታዊ ንግግሩን ያስገባል፤ μέν ደግሞ ከሚከተለው δέ ጋር ንጽጽር ይፈጥራል። በአማርኛ የ‘ብት... ግን’ አወቃቀር ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ποιήσῃ καρπὸν
  choice: ፍሬ ብታፈራ
  rationale: ποιέω ከκαρπός ጋር ሲመጣ ‘ፍሬ ማፍራት’ ማለት ነው፤ ይህም የእርሻውን ምስል በተፈጥሮ ይጠብቃል።
- source_word: εἰς τὸ μέλλον
  choice: ወደፊት
  rationale: ሐረጉ በቀጥታ ‘ለሚመጣው ጊዜ’ ወይም ‘ወደፊት’ የሚል ሰፊ የጊዜ ሐሳብ ይዟል፤ በዚህ ቁጥር ውስጥ ‘በሚቀጥለው ዓመት’ የሚል ግልጽ ቃል የለም።
- source_word: εἰ δὲ μήγε
  choice: ባታፈራ ግን
  rationale: የቀደመውን ሁኔታ በመቃረን ‘ካልሆነ ግን’ የሚለውን ፍቺ ያቀርባል፤ ግሱን መድገም በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐκκόψεις αὐτήν
  choice: ትቆርጣታለህ
  rationale: ἐκκόπτω በዛፍ እንክብካቤ አውድ ‘ቆርጦ መጣል’ ወይም ‘መቁረጥ’ ማለት ነው። የአማርኛው የሴት ነገር ተውላጠ ስም ቅጥያ የበለሲቱን ማጣቀሻ በተፈጥሮ ያሳያል።
theological_decisions:
- issue: የባለቤቱ የዘገየ ፍርድ የጊዜ ወሰን
  choice: ውጤቱ በምሳሌው ውስጥ ሁኔታዊ ሆኖ ተቀምጧል፤ ‘ወደፊት’ የሚለውም ሰፊ የጊዜ ሐሳብ ተጠብቋል።
  alternative: εἰς τὸ μέλλονን ከቀደመው ቁጥር አውድ ጋር በማዛመድ ‘በሚቀጥለው ዓመት’ ብሎ መተርጎም።
  rationale: የግሪኩ ጽሑፍ በዚህ ቁጥር ‘የሚቀጥለው ዓመት’ ብሎ አይወስንም። ሰፊውን የጊዜ አገላለጽ መጠበቅ የተሰጠውን ዕድልና ሊከተል የሚችለውን ፍርድ አንዱንም ሳያጋንን ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። ‘መልካም ነው’ በግሪኩ ውስጥ በአጭር የተተወውን የመልካም ውጤት ሐሳብ በተፈጥሯዊ አማርኛ ያሟላል።
