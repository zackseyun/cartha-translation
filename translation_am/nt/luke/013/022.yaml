  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: am
  text: እርሱም በከተሞችና በመንደሮች እያለፈ እያስተማረ፣ ወደ ኢየሩሳሌም እየተጓዘ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεπορεύετο
  choice: እያለፈ
  rationale: ያልተጠናቀቀ ቀጣይ እንቅስቃሴን የሚያመለክተውን የግሪክ ኢምፐርፌክት ግስ በተፈጥሯዊ አማርኛ ያሳያል፤ በየስፍራው እየተጓዘ ማለፉንም ከሚከተለው ሐረግ ጋር ያስተሳስራል።
- source_word: κατὰ πόλεις καὶ κώμας
  choice: በከተሞችና በመንደሮች
  rationale: κατά እዚህ በተለያዩ ትልልቅና ትንንሽ ሰፈሮች ውስጥ እያለፈ መጓዝን ያሳያል፤ ይህ አተረጓጎም የπόλεις እና κώμαςን ልዩነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: διδάσκων
  choice: እያስተማረ
  rationale: በጉዞው ላይ አብሮ የቀጠለውን ተግባር የሚገልጠውን የአሁን ጊዜ አሳታፊ ቅርጽ በግልጽና አጭር ሁኔታ ያስተላልፋል።
- source_word: πορείαν ποιούμενος
  choice: መንገዱን ቀጠለ
  rationale: ቃል በቃል ‘ጉዞ እያደረገ’ የሚለውን ፈሊጥ ዓላማ ያለው ቀጣይ ጉዞ በሚገልጽ ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς የጉዞውን አቅጣጫና መዳረሻ ያመለክታል፤ ‘ወደ’ በአማርኛ መድረስን ሳይገድብ ወደዚያ የሚደረገውን እንቅስቃሴ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውን የቦታውን ስም ቅርጽ ይጠቀማል።
theological_decisions:
- issue: የኢየሱስ ጉዞ አቅጣጫና የመድረስ ሁኔታ
  choice: ወደ ኢየሩሳሌም መንገዱን ቀጠለ
  alternative: ወደ ኢየሩሳሌም ተጓዘ
  rationale: ጥቅሱ መድረሱን ሳይናገር ቀጣይና ዓላማ ያለውን ጉዞ ያሳያል። ‘መንገዱን ቀጠለ’ የሉቃስን የጉዞ ትረካ ውጥረት ይጠብቃል፤ ተጨማሪ የሥነ መለኮት ትርጓሜም አያስገባም።
