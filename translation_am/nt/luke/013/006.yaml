base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: am
  text: ይህንም ምሳሌ ተናገረ፦ “አንድ ሰው[a] በወይን እርሻው ውስጥ የተተከለች የበለስ ዛፍ ነበረችው፤ በእሷም ላይ ፍሬ ለመፈለግ መጣ፤ ነገር ግን አላገኘም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ሰው ነበር።” የግሪኩ ያልተወሰነ ተውላጠ ስም በአጠቃላይ “አንድ ሰው” ተብሎ ሊተረጎም ይችላል፤ እዚህ ግን “አንድ ሰው” የምሳሌውን የትረካ ዘይቤ ያስጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ተናገረ
  rationale: የግሪኩ ኢምፐርፌክት የትረካ መግቢያን ያመለክታል፤ በአማርኛ ቀላል ያለፈ ጊዜ በተፈጥሮ ይህን ተግባር ይፈጽማል።
- source_word: δὲ
  choice: ከዚያም
  rationale: ለስላሳውን የትረካ ትስስር በተፈጥሯዊ አማርኛ ያሳያል፤ ጠንካራ የተቃርኖ ትርጉም አይጨምርም።
- source_word: παραβολήν
  choice: ምሳሌ
  rationale: ለኢየሱስ ምሳሌያዊ የማስተማሪያ ታሪክ የተለመደና ትክክለኛ የአማርኛ ቃል ነው።
- source_word: Συκῆν
  choice: የበለስ ዛፍ
  rationale: ቃሉ በተለይ የበለስን ዛፍ ያመለክታል።
- source_word: εἶχέν τις
  choice: አንድ ሰው ... ነበረችው
  rationale: τις ያልተወሰነ ሰውን ያመለክታል፤ ‘አንድ ሰው’ በአማርኛ የትረካ አገላለጽ ተፈጥሯዊ ነው።
- source_word: πεφυτευμένην
  choice: የተተከለች
  rationale: ፍጹም ተደራጊ አንቀጽ ዛፉ ተተክላ ባለችበት ሁኔታ መኖሯን ያሳያል።
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: በወይኑ እርሻ ውስጥ
  rationale: ἀμπελών ወይን የሚተከልበትን እርሻ ያመለክታል፤ የባለቤትነት መረጃውም ‘ወይኑ’ በሚለው ተጠብቋል።
- source_word: ἦλθεν ζητῶν
  choice: ፍሬ ለመፈለግ መጣ
  rationale: ዋናው ግስና አሁናዊው አንቀጽ የመምጣቱን ዓላማ በተፈጥሯዊ አማርኛ ያሳያሉ።
- source_word: καρπὸν
  choice: ፍሬ
  rationale: ቀጥተኛውን ትርጉምና በምሳሌው ውስጥ ያለውን ዘይቤያዊ አቅም ይጠብቃል።
- source_word: ἐν αὐτῇ
  choice: በእሷም ላይ
  rationale: ቃል በቃል ‘በእሷ ውስጥ’ ቢሆንም፣ በዛፍ ላይ ፍሬን ስለመፈለግ ተፈጥሯዊው የአማርኛ አገላለጽ ‘በእሷ ላይ’ ነው።
- source_word: οὐχ εὗρεν
  choice: አላገኘም
  rationale: ከፊት የተጠቀሰውን ‘ፍሬ’ ሳያስፈልግ ደግሞ በመድገም አለማግኘቱን በግልጽ ያሳያል።
theological_decisions:
- issue: በምሳሌው ውስጥ ያለው ያልተወሰነ ባለቤት (τις)
  choice: አንድ ሰው
  alternative: አንድ ሰው ነበር / አንድ ባለቤት
  rationale: ጽሑፉ ተራ ያልተወሰነ ገጸ ባሕርይን ያስገባል፤ ‘አንድ ሰው’ ምንም ተጨማሪ ሥነ መለኮታዊ መለያ ሳይጨምር ይህን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ የትረካ አማርኛ ተጠቅሟል። የዛፍ ሴት ጾታዊ ሰዋስው በ‘የተተከለች’፣ ‘ነበረችው’ እና ‘በእሷ’ በወጥነት ተጠብቋል።
