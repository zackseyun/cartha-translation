- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: ዛሬም ነገም በማግስቱም
  rationale: የግሪኩን ሦስት ደረጃ ያለው የጊዜ ቅደም ተከተል በግልጽና በተፈጥሯዊ አማርኛ ይጠብቃል፤ ሐረጉ ፈሊጣዊ ሊሆን መቻሉ በማስታወሻ ተገልጧል።
- source_word: πορεύεσθαι
  choice: መንገዴን መቀጠል
