base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: am
  text: ይሁን እንጂ፣ ዛሬም ነገም በማግስቱም[a] መንገዴን መቀጠል አለብኝ፤ ምክንያቱም ነቢይ ከኢየሩሳሌም ውጭ ሊጠፋ አይቻልም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዛሬም ነገም በማግስቱም” የሚለው ሐረግ ቃል በቃል ሦስት የቀን መቁጠሪያ ቀናትን ከመግለጽ ይልቅ፣ አጭርና የተወሰነ የተግባር ጊዜን የሚያመለክት ፈሊጣዊ አነጋገር ሊሆን ይችላል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ነቢይ ከኢየሩሳሌም ውጭ ሊጠፋ አይገባም” ወይም “ነቢይ ከኢየሩሳሌም ውጭ መጥፋቱ የማይታሰብ ነው።”
    reason: lexical_alternative
lexical_decisions:
