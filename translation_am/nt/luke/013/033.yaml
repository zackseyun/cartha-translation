  choice: አባባሉ የማይቻልነትን በሚገልጽ ቃል ተተርጉሟል፤ ነገር ግን ፍጹም የሥነ ሕልውና አዋጅ እንደሆነ አልተብራራም።
  alternative: “የማይታሰብ ነው” ወይም “አይገባም” በማለት የአባባሉን ምፀታዊ ወይም የልማድ ኃይል ይበልጥ ማጉላት።
  rationale: οὐκ ἐνδέχεται በቀጥታ የማይቻልነትን፣ በአገባቡ ደግሞ የማይገባነትን ወይም የማይታሰብነትን ሊያመለክት ይችላል። ትርጉሙ ይህን ሥነ መለኮታዊና ንግግራዊ ውጥረት አይፈታውም።
