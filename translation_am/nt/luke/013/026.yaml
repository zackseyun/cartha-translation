  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: am
  text: በዚያን ጊዜ፣ ‘በፊትህ በልተናል፣ ጠጥተናልም፤ በአደባባዮቻችንም[a] አስተምረሃል’ ማለት ትጀምራላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰፋፊ መንገዶቻችን።” የግሪኩ ቃል በከተማ ውስጥ ያሉ ሰፋፊ መንገዶችን ወይም ክፍት የሕዝብ ስፍራዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የንግግሩን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: ἄρξεσθε λέγειν
  choice: ማለት ትጀምራላችሁ
  rationale: የἄρχω የመጀመር ገጽታን በግልጽ ሁኔታ ይጠብቃል፤ ብቻውን ‘ትላላችሁ’ ማለት ይህን ልዩነት ያጠፋል።
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: በልተናል፣ ጠጥተናልም
  rationale: በአማርኛ ተፈጥሯዊ የሆነው ፍጹም ጊዜ ያለፈውን የመብላትና የመጠጣት ሁኔታ እንደ ማስረጃ የሚያቀርበውን ቀጥተኛ ንግግር ያስተላልፋል።
- source_word: ἐνώπιόν σου
  choice: በፊትህ
  rationale: የግል ቅርበትንና በእርሱ ፊት መሆንን የሚያሳይ አጭርና የተለመደ አማርኛ ነው፤ እውቅና ወይም የተቀበለ ኅብረት አያስገባም።
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: በአደባባዮቻችን
  rationale: πλατεῖα በከተማ ውስጥ ያለ ሰፊ መንገድን ወይም ክፍት የሕዝብ ስፍራን ሊያመለክት ይችላል። ‘አደባባይ’ ሕዝባዊና አካባቢያዊ መቼቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ የቃሉ ስፋት በማስታወሻ ተጠብቋል።
- source_word: ἐδίδαξας
  choice: አስተምረሃል
  rationale: ቀደም ሲል በሕዝብ ፊት ያስተማረውን ታሪካዊ እውነታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ተናጋሪዎቹ የሚያቀርቡት ልመና ባሕርይ
  choice: ከኢየሱስ ጋር የነበራቸውን ውጫዊ ቅርበት ብቻ የሚጠቅስ ንግግር ሆኖ ተተርጉሟል።
  alternative: ቃሉን በነፃነት በመተርጎም እውቅና የተሰጠው ኅብረት ወይም አዳኝ ግንኙነት እንዳለ ማስመሰል።
  rationale: ‘በፊትህ’ እና ‘በአደባባዮቻችን አስተምረሃል’ የሚሉት የቅርበት ማስረጃዎች ናቸው፤ ኢየሱስ እንደሚያውቃቸው ወይም እንደተቀበላቸው አይናገሩም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት አልፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛው ንግግር በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ቀርቧል፤ የግሪኩ የመጀመር ገጽታና የπλατεῖα የትርጉም ስፋት ተጠብቀዋል።
