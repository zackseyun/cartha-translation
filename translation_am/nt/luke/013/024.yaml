  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: am
  text: “በጠባቡ በር[a] ለመግባት ታገሉ፤ ምክንያቱም፣ እላችኋለሁ፣ ብዙዎች ለመግባት ይፈልጋሉ፤ ነገር ግን አይችሉም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጠባቡ መግቢያ በር።” የሉቃስ ግሪክ ቃል θύρα በተለምዶ “በር” ማለት ነው፤ በማቴዎስ ተመሳሳይ ንግግር ግን πύλη የሚለው፣ “መግቢያ በር” የሚል ቃል ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: ታገሉ
  rationale: የቀጣይነት ኃይል ያለው የብዙ ቁጥር ትእዛዝ ሲሆን፣ ከባድና ትጉህ ጥረትን ያመለክታል። “ታገሉ” ይህን ጥንካሬ ሳያለዝብ ይጠብቃል።
- source_word: εἰσελθεῖν
  choice: ለመግባት
  rationale: ሁለቱንም የግስ ክስተቶች በተፈጥሯዊና ወጥ አማርኛ ይገልጻል።
- source_word: διὰ τῆς στενῆς θύρας
  choice: በጠባቡ በር
  rationale: θύρα በመደበኛነት “በር” ማለት ነው፤ στενῆς ደግሞ ጠባብነትን ያሳያል። የአማርኛው “በ” የመግቢያውን መንገድ በተፈጥሮ ያሳያል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ከትእዛዙ በኋላ የሚመጣውን ምክንያት በግልጽ ያስተዋውቃል።
- source_word: πολλοί
  choice: ብዙዎች
  rationale: በስም ተግባር የቆመውን ቅጽል በቀጥታና ተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: λέγω ὑμῖν
  choice: እነግራችኋለሁ
  rationale: የንግግር ቀመሩን በዘመናዊ፣ ክብር ባለውና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ζητήσουσιν
  choice: እንደሚሹ
  rationale: “መሻት/መፈለግ” የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ ከ“ታገሉ” ጋር ያለውን የቃላት ልዩነትም አያጠፋም።
- source_word: οὐκ ἰσχύσουσιν
  choice: እንደማይችሉ
  rationale: ድርጊቱን ለመፈጸም አቅም ወይም ችሎታ እንደማይኖራቸው በግልጽ ይገልጻል፤ “አይሳካላቸውም” ከሚለው የበለጠ ከምንጩ ጋር ቅርብ ነው።
theological_decisions:
