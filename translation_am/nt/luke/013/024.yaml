  source_fidelity: The imperative ታገሉ and the narrow-door wording faithfully convey Ἀγωνίζεσθε and διὰ τῆς στενῆς θύρας. However, the draft recasts the two future verbs as subordinate reported content (እንደሚሹ … እንደማይችሉ), which weakens the direct warning and obscures the Greek future force. It also places λέγω ὑμῖν as a final reporting verb rather than retaining it as an interjected discourse formula.
