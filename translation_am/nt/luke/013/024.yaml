  rationale: ጥቅሱ ራሱ ትጉህ ጥረትን ያዛል፣ ነገር ግን ስለ ጸጋ፣ ሥራ፣ ብቃት ወይም መለኮታዊና ሰብአዊ ኃላፊነት የአንድ ወገን ሥነ መለኮታዊ ማብራሪያ አይጨምርም። በምንጩ ያለው ውጥረት ተጠብቋል።
