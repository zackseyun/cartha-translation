source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: am
  text: እርሱም፣ “ከየት እንደመጣችሁ አላውቅም፤ እናንተ ዓመፅን የምትሠሩ ሁሉ፣ ከእኔ ራቁ!” ይላችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: ይላችኋል
  rationale: ἐρεῖ λέγων የሚለው በግሪክኛ ትርጉሙን የማይጨምር ድግግሞሽ ነው፤ በተፈጥሯዊ አማርኛ የንግግሩን መግቢያና የተናጋሪውን የወደፊት ድርጊት በአንድ ግስ ይገልጣል።
- source_word: οἶδα
  choice: አላውቅም
  rationale: ዋናውን ‘ማወቅ’ የሚለውን ትርጉም በግልጽ ሁኔታ ይጠብቃል፤ በዐውዱ ያለውን የግንኙነት እምቢታ በትርጓሜ አይተካም።
- source_word: πόθεν ἐστέ
  choice: ከየት እንደሆናችሁ
  rationale: የመጡበትን ምንጭ ወይም መነሻ የሚጠይቀውን πόθεν በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: ከእኔ ራቁ
  rationale: ወሳኝ መለየትን የሚያዝዘውን የግሱን ኃይል በክብደት ያስተላልፋል።
- source_word: πάντες ἐργάται ἀδικίας
  choice: እናንተ ዓመፅን የምትሠሩ ሁሉ
  rationale: ἐργάταιን እንደ አንድ ጊዜ ድርጊት ሳይሆን አዘውትረው የሚፈጽሙ ሰዎች አድርጎ ያሳያል፤ ἀδικίαንም ከ‘ሕገ ወጥነት’ ይልቅ ሰፊውን የክፋትና የኢፍትሐዊነት ስሜት በ‘ዓመፅ’ ይይዛል።
theological_decisions:
- issue: በፍርድ ንግግሩ ውስጥ ἀδικίαςን መተርጎም
  choice: ዓመፅ
  alternative: ክፋት፣ ኢፍትሐዊነት፣ ሕገ ወጥነት
  rationale: ἀδικία ከፍትሕና ጽድቅ ተቃራኒ የሆነውን ሰፊ የሞራል ክፋት ያመለክታል። ‘ሕገ ወጥነት’ ብሎ መተርጎም νόμος የሚለውን ያልተጠቀሰ የሕግ ጽንሰ ሐሳብ ሊያስገባ ይችላል፤ ‘ዓመፅ’ ግን የቃሉን ሞራላዊና የፍርድ ክብደት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የግሪክኛው ἐρεῖ λέγων ድግግሞሽ በአንድ ተፈጥሯዊ ግስ ተዋሕዷል፤ ቀጥተኛው ንግግርና የፍርዱ ክብደት ተጠብቀዋል።
