    text: ወይም፣ «በሰንበታት»፤ የግሪኩ ቃል የብዙ ቁጥር ቅርጽ ቢኖረውም፣ በተለምዶ ነጠላውን «ሰንበት» ለማመልከት በፈሊጣዊ አነጋገር ያገለግላል።
