lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: እርሱም … ያስተምር ነበር
  rationale: የεἰμί ኢምፐርፌክት ከአሁን ጊዜ አንቀጽ ጋር ተጣምሮ በቀድሞ ጊዜ ቀጣይ የነበረን ድርጊት ያሳያል፤ በአማርኛም «ያስተምር ነበር» ይህን በተፈጥሮ ያቀርባል። δέ ቀላል የትረካ ትስስር ስላለው በ«ም» ተወክሏል።
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: ከምኵራቦች በአንዱ
  rationale: ክፍልን ከሙሉ የሚለየውን «ከ…በአንዱ» አወቃቀር ያቆያል፤ «ምኵራብ» የተወሰነውን የአይሁድ ሃይማኖታዊ መሰብሰቢያ በትክክል ይጠቅሳል።
- source_word: ἐν τοῖς σάββασιν
  choice: በሰንበት ቀን
  rationale: σάββασιν በቅርጹ ብዙ ቁጥር ቢሆንም፣ በኮይኔ ግሪክ ብዙ ጊዜ አንዱን የሰንበት ቀን በፈሊጣዊ አጠቃቀም ያመለክታል። በአማርኛ ተፈጥሯዊው አገላለጽ ነጠላው ነው፤ የቅርጹ ብዙ ቁጥር ግን በማስታወሻ ተጠብቋል።
