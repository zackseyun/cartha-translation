  rationale: ንባቡ የኢየሱስን ተልእኮ ፍጻሜ፣ ምናልባትም ሞቱንና በኋላ ያለውን መጽደቅ ሊያመለክት ይችላል፤ ግሪኩ ግን ትንሣኤን በግልጽ አይጠቅስም። ስለዚህ ዋናው ጽሑፍ ይህን ሥነ መለኮታዊ ጥምረት ሳይጠብብ ክፍት አድርጎታል።
