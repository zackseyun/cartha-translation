  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ “ሄዳችሁ ለዚያ ቀበሮ እንዲህ በሉት፤ ‘እነሆ፣ ዛሬና ነገ አጋንንትን አወጣለሁ፣ ፈውሶችንም እፈጽማለሁ፤ በሦስተኛውም ቀን ወደ ፍጻሜ እደርሳለሁ[a]።’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ፍጹም እሆናለሁ፣” “ግቤ ላይ እደርሳለሁ” ወይም “ሥራዬን እጨርሳለሁ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ወደ ፍጻሜ መድረስን ወይም መሟላትን ሊያመለክት ይችላል፤ እዚህ ለኢየሱስ የተመደበለት ተልእኮ መፈጸሙን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: ቀበሮ
  rationale: ቃሉ በቀጥታ ቀበሮን ያመለክታል። ዘይቤያዊውንና ንቀት የተቀላቀለበትን ኃይል በትርጓሜ ሳይፈታ የእንስሳውን ስም እንዳለ ያቆያል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ቀጥሎ ለሚነገረው ነገር ትኩረት የሚጠራ በአማርኛ የተለመደ ክቡር አገላለጽ ነው።
- source_word: ἐκβάλλω δαιμόνια
  choice: አጋንንትን አወጣለሁ
  rationale: በወንጌላት ውስጥ የአጋንንትን ማስወጣት በተፈጥሯዊና በሚታወቅ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἰάσεις ἀποτελῶ
  choice: ፈውሶችንም እፈጽማለሁ
  rationale: ἰάσεις የፈውስ ድርጊቶችን፣ ἀποτελῶ ደግሞ ማከናወንን ወይም ወደ ውጤት ማድረስን ያመለክታል። ይህ አተረጓጎም ከቀደመው ‘አወጣለሁ’ ጋር ያለውን የግስ ልዩነት ይጠብቃል።
- source_word: σήμερον καὶ αὔριον
  choice: ዛሬና ነገ
  rationale: ቀጥተኛውን ጊዜያዊ አገላለጽና አጭር የተወሰነ ጊዜን ሊያመለክት የሚችለውን ፈሊጣዊ ኃይል ያቆያል።
- source_word: τῇ τρίτῃ
  choice: በሦስተኛውም ቀን
  rationale: ቅደም ተከተላዊው ቃል በጊዜ አመልካች ሆኖ የገባ ስለሆነ ‘ቀን’ በግልጽ ተጨምሯል።
- source_word: τελειοῦμαι
  choice: ወደ ፍጻሜ እደርሳለሁ
  rationale: ቃሉ ወደ ፍጻሜ መምጣትን፣ ፍጹም መሆንን ወይም ግብን መድረስን ሊያመለክት ይችላል። የአማርኛው አገላለጽ የሞራል ፍጽምናን በግድ ሳያስገባ የተልእኮ ፍጻሜን ያሳያል፤ ሰዋሰዋዊው ተገብሮ ግን በተፈጥሯዊ አማርኛ ተገልጿል።
theological_decisions:
- issue: τελειοῦμαι ከኢየሱስ ተልእኮ፣ ሞትና ትንሣኤ ጋር ያለው ግንኙነት
