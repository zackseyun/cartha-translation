id: LUK.13.34
reference: Luke 13:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: am
  text: ኢየሩሳሌም፣ ኢየሩሳሌም፣ ነቢያትን የምትገድዪ፣ ወደ አንቺም የተላኩትን በድንጋይ የምትወግሪ፤ ዶሮ ጫጩቶቿን በክንፎቿ ሥር እንደምትሰበስብ፣ ልጆችሽን ልሰበስብ ስንት ጊዜ ፈለግሁ! እናንተ ግን አልፈለጋችሁም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አንቺ” የሚለው ኢየሩሳሌምን በነጠላ ሴት ይጠራል፤ “እናንተ ... አልፈለጋችሁም” የሚለው ግን በግሪኩ ብዙ ቁጥር ነው።
    reason: grammatical_clarification
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: ኢየሩሳሌም፣ ኢየሩሳሌም
  rationale: የልቅሶውንና የአጽንዖቱን ኃይል ለመጠበቅ የስሙ ድግግሞሽ ተጠብቋል።
- source_word: ἡ ἀποκτείνουσα ... λιθοβολοῦσα
  choice: ነቢያትን የምትገድዪ፣ ... በድንጋይ የምትወግሪ
  rationale: የአሁን ጊዜ ቦዝ አንቀጾቹ ኢየሩሳሌምን በተደጋጋሚ ባሕርይዋ ይገልጣሉ፤ የአማርኛው አንጻራዊ አገላለጽም ይህን ይጠብቃል።
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: ወደ አንቺም የተላኩትን
  rationale: የፍጹም ጊዜ ተደራጊ ቦዝ አንቀጹን ተደራጊነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ποσάκις ἠθέλησα ἐπισυνάξαι
  choice: ልሰበስብ ስንት ጊዜ ፈለግሁ
  rationale: ποσάκις ያለውን የልቅሶ አጽንዖትና θέλω ያለውን የፈቃድ/ፍላጎት ትርጉም በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: τὰ τέκνα σου
  choice: ልጆችሽን
  rationale: ኢየሩሳሌምን እንደ እናት ከተማ የሚያቀርበውን ምስላዊ አነጋገር ሳያጠብ ይጠብቃል።
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: ዶሮ ጫጩቶቿን
  rationale: ὄρνις በሰፊው ‘ወፍ’ ሊሆን ቢችልም፣ ጫጩቶችን ከክንፍ በታች የመሰብሰብ የእናትነት ምስል ‘ዶሮ’ን ተፈጥሯዊ ያደርገዋል፤ νοσσιά እዚህ በተፈጥሯዊነት ‘ጫጩቶች’ ተብሏል።
- source_word: καὶ οὐκ ἠθελήσατε
  choice: እናንተ ግን አልፈለጋችሁም
  rationale: የብዙ ቁጥር ሁለተኛ መደብን ግልጽ በማድረግ፣ በኢየሱስ ፍላጎትና በተናጋሪዎቹ እምቢታ መካከል ያለውን ተቃርኖ ይጠብቃል።
theological_decisions:
- issue: ‘ልጆችሽ’ የሚለው ማንን እንደሚያመለክት
  choice: ልጆችሽን
  alternative: የኢየሩሳሌም ነዋሪዎችን፤ ወይም ከተማይቱ የምትወክላቸውን ሕዝቦች
  rationale: ግሪኩ የእናት ከተማን ምስል በመጠቀም ‘ልጆችሽ’ ይላል፤ ትርጉሙ ሊያመለክት የሚችለውን ቡድን ከጽሑፉ በላይ አያጠብም።
- issue: በἠθέλησα / οὐκ ἠθελήσατε ያለው የፈቃድ ተቃርኖ
  choice: ፈለግሁ ... አልፈለጋችሁም
  alternative: ወደድሁ ... እናንተ ግን አልወደዳችሁም፤ ፈቃደኛ ነበርሁ ... ፈቃደኞች አልነበራችሁም
  rationale: የግሪኩን የፍላጎትና የፈቃድ ቋንቋ ይጠብቃል፤ ከዚህ ቁጥር በላይ ስለ መለኮታዊ ፈቃድና ሰው እምቢታ የአንድ ወገን ዶክትሪን አያስገባም።
- issue: ከነጠላ ሴት አድራሻ ወደ ብዙ ቁጥር መሸጋገር
  choice: አንቺ/ልጆችሽ ... እናንተ ... አልፈለጋችሁም
  alternative: የመጨረሻውንም አነጋገር እንደ ነጠላ ሴት ማቅረብ
  rationale: ግሪኩ ኢየሩሳሌምን በነጠላ ሴት ይጠራል፣ መጨረሻ ግን ወደ ብዙ ቁጥር ሁለተኛ መደብ ይሸጋገራል። ይህ ጉልህና ትርጓሜያዊ ጠቀሜታ ያለው ለውጥ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የልቅሶው ድግግሞሽ፣ የእናት ዶሮ ምስል፣ እንዲሁም ከነጠላ ሴት አድራሻ ወደ ብዙ ቁጥር የሚደረገው ጉልህ ሰዋሰዋዊ ለውጥ ተጠብቀዋል።
