review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the repeated address, Jerusalem’s characteristic killing and stoning of messengers, the contrast between Jesus’ desire and the people’s refusal, and the shift from singular feminine address to plural second person. The supplied gathering verb in the bird simile is appropriate in Amharic, since the Greek leaves it implicit. However, “ከክንፎቿ በታች” is less idiomatic for the locative sense of ὑπὸ τὰς πτέρυγας; “በክንፎቿ ሥር” conveys ‘under her wings’ naturally and precisely.
  naturalness: The wording is clear, dignified modern standard Amharic. Replacing the wing phrase improves fluency without changing the image. “ስንት ጊዜ” is acceptable as a rhetorical rendering of ποσάκις.
  terminology: “ነቢያት,” “በድንጋይ መውገር,” “ልጆችሽ,” and “ጫጩቶቿ” are suitable. “ዶሮ” naturally communicates the maternal hen image in context; no theological narrowing is introduced.
  issues:
  - severity: low
    issue: Less idiomatic rendering of ‘under her wings’
    rationale: The phrase “ከክንፎቿ በታች” is understandable, but “በክንፎቿ ሥር” is the more natural Amharic locative expression for προσταction beneath wings and directly represents ὑπὸ τὰς πτέρυγας.
  revised_text: ኢየሩሳሌም፣ ኢየሩሳሌም፣ ነቢያትን የምትገድዪ፣ ወደ አንቺም የተላኩትን በድንጋይ የምትወግሪ፤ ዶሮ ጫጩቶቿን በክንፎቿ ሥር እንደምትሰበስብ፣ ልጆችሽን ልሰበስብ ስንት ጊዜ ፈለግሁ! እናንተ ግን አልፈለጋችሁም።[a]
