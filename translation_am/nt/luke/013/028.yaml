base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: am
  text: በዚያ ልቅሶና ጥርስ ማፋጨት ይሆናል፤ አብርሃምን፣ ይስሐቅን፣ ያዕቆብንና ነቢያትን ሁሉ በእግዚአብሔር መንግሥት ውስጥ ስታዩ፣ እናንተ ግን ወደ ውጭ ተጥላችሁ ትሆናላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወደ ውጭ እየተጣላችሁ” ተብሎም ሊተረጎም ይችላል። ἐκβαλλομένους የሚለው የግሪክ ተገብሮ አሳታፊ ከἔξω (“ውጭ”) ጋር ተያይዞ በግድ መገለልን ያጎላል።
