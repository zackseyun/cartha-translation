  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: am
  text: ከዚያም የወይን እርሻውን ለሚያለማው እንዲህ አለው፤ “እነሆ፣ ሦስት ዓመት ሙሉ ከዚህች የበለስ ዛፍ ፍሬ ፍለጋ እየመጣሁ ነው፤ ምንም አላገኘሁም። ቁረጣት። መሬቱንም ለምን በከንቱ ትይዛለች?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መሬቱንም ለምን የማያፈራ ታደርገዋለች?” የግሪኩ ግስ ዛፏ ቦታ ከመያዟ ባለፈ መሬቱን ከምርት ውጭ የማድረግን ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: የወይን ቦታውን ለሚንከባከበው
  rationale: የወይን ቦታን የሚያለማና የሚንከባከብ ሰው መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ ከአጠቃላዩ ‘አትክልተኛ’ ይልቅ የወይኑን አውድ ይጠብቃል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ንግግሩን በአጽንዖት የሚያስተዋውቅ ሲሆን በክብር ያለ መጽሐፍ ቅዱሳዊ አማርኛ የተለመደ ነው።
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: ሦስት ዓመት ሙሉ
  rationale: እስከ አሁን የዘለቀውን የሦስት ዓመት ጊዜ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔρχομαι ζητῶν
  choice: ፍሬ ፍለጋ እየመጣሁ ነው
  rationale: በሦስቱ ዓመታት የተደጋገመውንና እስከ አሁን የዘለቀውን ድርጊት ያሳያል።
- source_word: καρπὸν
  choice: ፍሬ
  rationale: በምሳሌው ውስጥ ያለውን ቀጥተኛ የግብርና ትርጉም ይጠብቃል።
- source_word: συκῇ
  choice: የበለስ ዛፍ
  rationale: የዛፉን ዓይነት በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: οὐχ εὑρίσκω
  choice: ምንም አላገኘሁም
  rationale: ተደጋጋሚው ፍለጋ ውጤት እንዳላመጣ በአማርኛ በተፈጥሯዊ ሁኔታ ያጠቃልላል።
- source_word: ἔκκοψον αὐτήν
  choice: ቁረጣት
  rationale: ዛፏን እንዲያስወግድ የተሰጠውን ቀጥተኛ ትእዛዝ አጭርና ግልጽ አድርጎ ያቀርባል።
- source_word: ἱνατί καὶ τὴν γῆν καταργεῖ
  choice: መሬቱንስ ለምን በከንቱ ታስይዛለች?
  rationale: የካίን ተጨማሪ አጽንዖት ‘-ስ’ ያሳያል፤ καταργεῖ ደግሞ ፍሬ ሳታፈራ ቦታውን በከንቱ የመያዝን ተግባራዊ ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: የምሳሌው የግብርና ምስል እና መንፈሳዊ ትርጓሜ
  choice: የግብርናውን ቋንቋ እንዳለ መጠበቅ
  alternative: መንፈሳዊ ፍሬ አለማፍራትን በትርጉሙ ውስጥ በግልጽ መጨመር
  rationale: ጥቅሱ የምሳሌ ክፍል ስለሆነ ትርጉሙ ምስሉን ይጠብቃል፤ መንፈሳዊ ትርጓሜውን ከቃላቱ በላይ አያስገባም።
- issue: የκαταργεῖ የትርጉም ስፋት
  choice: መሬቱን በከንቱ እንደምታስይዝ መተርጎም፣ ሌላውን ትርጉም በማስታወሻ ማቆየት
  alternative: መሬቱን የማያፈራ ታደርገዋለች ብሎ በዋናው ጽሑፍ መተርጎም
  rationale: ግሱ ቦታን በከንቱ መያዝንም ሆነ መሬቱን ከምርት ውጭ ማድረግን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ በአውዱ ተፈጥሯዊውን ንባብ ሲይዝ እውነተኛውን የቃል አማራጭ ማስታወሻው ይጠብቃል።
