  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: am
  text: ይህችስ ሴት የአብርሃም ልጅ ሆና፣ ሰይጣን፣ እነሆ፣ ለአሥራ ስምንት ዓመት ያሰራት፣ በሰንበት ቀን ከዚህ እስራት ልትፈታ አይገባምን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: የአብርሃም ልጅ
  rationale: የግሪኩን የዝምድናና የኪዳን መግለጫ በቀጥታ ይጠብቃል፤ በአማርኛም ለሴት ልጅ ተፈጥሯዊ ነው።
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: ያሰራት / ልትፈታ / እስራት
  rationale: በሦስቱ ቃላት መካከል ያለውን የማሰርና የመፍታት ምስላዊ ትስስር ይጠብቃል።
- source_word: ἰδού
  choice: እነሆ
  rationale: የአድማጩን ትኩረት የሚጠራውን ግልጽ የግሪክ ቃል ሳይተው ያስተላልፋል።
- source_word: οὐκ ἔδει
  choice: አይገባምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን አሉታዊ የንግግር ጥያቄና የግዴታ ስሜት ይጠብቃል።
theological_decisions:
- issue: የሴቲቱ መከራና የሰይጣን ድርሻ
  choice: ሰይጣን ... ያሰራት
  alternative: ሰይጣን ያሳመማት
  rationale: ምንጩ ሰይጣንን በግልጽ ይጠቅሳል እና የ‘ማሰር’ ምስልን ይጠቀማል፤ ጽሑፉ ከሚለው በላይ የበሽታ ሥነ መለኮት አይወሰንም።
