  choice: ቃሉን ያለ ትርጓሜያዊ ማስፋፊያ መጠበቅ
  alternative: ‘የእምነት ሴት’ ወይም ‘እስራኤላዊት’ ብሎ መተርጎም
  rationale: ሐረጉ የዘር፣ የኪዳን ወይም የእምነት አጽንኦትን ሊያካትት ይችላል፤ ትርጉሙ ይህን አሻሚነት አይፈታም።
