  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: am
  text: ወይስ በሲሎአም ያለው ግንብ ወድቆ የገደላቸው እነዚያ አሥራ ስምንት ሰዎች፣ በኢየሩሳሌም ከሚኖሩት ሰዎች ሁሉ ይልቅ የበለጠ ባለዕዳዎች ሆነው ይመስላችኋል?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ባለዕዳዎች” የሚለው “ኃጢአተኞች” ወይም “የባሰ በደለኞች” ተብሎም ሊተረጎም ይችላል። የግሪኩ ὀφειλέται በቀጥታ “ዕዳ ያለባቸው” ማለት ሲሆን፣ በዚህ አውድ ሥነ ምግባራዊ ተጠያቂነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
