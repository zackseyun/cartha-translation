    issue: The name of Siloam is rendered “ሰሊሆም.”
    rationale: This does not accurately transliterate Σιλωάμ and may obscure identification of the place. Modern Amharic biblical usage should use “ሲሎአም.”
  - severity: low
    issue: The footnote says the word ‘cannot fail’ to indicate moral responsibility.
    rationale: The Greek term literally means ‘debtors’; a moral sense is strongly contextual but should remain a contextual interpretation, not be asserted as unambiguous lexical content.
