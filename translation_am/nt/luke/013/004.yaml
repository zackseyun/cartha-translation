  terminology: “ባለዕዳዎች” appropriately retains the lexical metaphor of ὀφειλέται without assimilating it to the προηγούμενο verse’s “sinners.” “ሰዎች” correctly represents the generic sense of ἀνθρώπους. The footnote should phrase the moral sense as a contextual possibility rather than as a near-certainty.
  issues:
