- source_word: δοκεῖτε ὅτι
  choice: ይመስላችኋል?
  rationale: ቀጥተኛውን የተግዳሮት ጥያቄ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὀφειλέται
