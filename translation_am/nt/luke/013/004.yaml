  verdict: revise
  source_fidelity: The draft preserves the rhetorical alternative, the number, the disaster, the comparative question, and the distinct debt-metaphor of ὀφειλέται. However, the place name Σιλωάμ is not accurately represented by “ሰሊሆም”; it should be “ሲሎአም.”
