  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: am
  text: የእግዚአብሔር መንግሥት አንዲት ሴት ወስዳ በሦስት መስፈሪያ[b] ዱቄት ውስጥ ከደበቀችው[c] እርሾ[a] ጋር ትመሳሰላለች፤ ዱቄቱ በሙሉ እስኪቦካ ድረስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊጥ ማቡኪያ።” የግሪክኛው ቃል ሊጥን ለማቡካት የሚያገለግል እርሾን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው “ሦስት ሳታ።” ሳታ የጥንት የደረቅ ነገር መስፈሪያ ሲሆን፣ እዚህ እጅግ ብዙ ዱቄትን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ውስጥ ከቀላቀለችው።” የግሪክኛው ግስ በቀጥታ “ደበቀች” ወይም “ሰወረች” ማለት ነው፤ “ቀላቀለች” የሚለው በዚህ የዱቄት አውድ የሚገባ አማራጭ አቀራረብ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστίν
  choice: ጋር ይመሳሰላል
  rationale: ምሳሌያዊ ንጽጽሩን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የግሪክኛው የጾታ ስምምነት በአማርኛ መደገም አያስፈልግም።
- source_word: ζύμῃ
  choice: እርሾ
  rationale: የጥንቱን ሊጥ የሚያቦካ ንጥረ ነገር በተለመደና ግልጽ ቃል ይገልጻል፤ የዘመናዊ ፋብሪካ ምርትን ብቻ አያመለክትም።
- source_word: λαβοῦσα γυνή
  choice: አንዲት ሴት ወስዳ
  rationale: የቅድሚያውን ድርጊትና ያልተወሰነውን ተዋናይ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
- source_word: ἔκρυψεν
  choice: ደበቀችው
  rationale: የግሪክኛውን ቀጥተኛ የ‘መደበቅ/መሰወር’ ምስል ይጠብቃል፤ ‘ቀላቀለች’ የሚለው አውዳዊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: በሦስት መስፈሪያ ዱቄት ውስጥ
  rationale: የማይታወቀውን ጥንታዊ መስፈሪያ በዋናው ጽሑፍ ሳያከብድ ትርጉሙን ያስተላልፋል፤ ‘ሳታ’ በማስታወሻ ተጠብቋል።
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: ዱቄቱ ሁሉ እስኪቦካ ድረስ
  rationale: የግሪክኛውን ተገብሮ አወቃቀርና አጠቃላይነት በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በምሳሌው ውስጥ የእርሾው ምሳሌያዊ ኃይል
  choice: እርሾ የሚለውን ምስል በገለልተኛነት ማቅረብ
  alternative: እርሾውን አሉታዊ ተጽእኖ ወይም አዎንታዊ የመንግሥት እድገት ብሎ በትርጉሙ ውስጥ መወሰን
  rationale: ቁጥሩ ራሱ ምስሉን ያቀርባል እንጂ ምሳሌያዊ ዋጋውን በግልጽ አይወስንም፤ ስለዚህ የትርጓሜ ውጥረቱ ተጠብቋል።
