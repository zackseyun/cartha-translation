id: LUK.13.25
reference: Luke 13:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: am
  text: የቤቱ ጌታ ተነሥቶ በሩን ከዘጋ በኋላ፣ እናንተ በውጭ ቆማችሁ በሩን ማንኳኳት ትጀምራላችሁ፤ ‘ጌታ ሆይ፣ ክፈትልን’ ትላላችሁ። እርሱም መልሶ፣ ‘እናንተ ከየት እንደሆናችሁ አላውቅም’ ይላችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: ከዘጋ በኋላ
  rationale: ይህ አገባብ የጊዜ ተከታታይነትን ‘ከ… በኋላ/አንዴ … ከሆነ’ በሚል ያሳያል፤ በአማርኛ ‘ከ… በኋላ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐγερθῇ
  choice: ተነሥቶ
  rationale: በዚህ አውድ ከተቀመጠበት መነሣትን እንጂ ከሞት መነሣትን አያመለክትም።
- source_word: ὁ οἰκοδεσπότης
  choice: የቤቱ ጌታ
  rationale: የቤቱን ባለሥልጣንና ኃላፊ ያመለክታል፤ በዘመናዊ አማርኛም ግልጽ ነው።
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: በሩን ከዘጋ
  rationale: ግሱ በሩን በመዝጋት መግቢያውን መከልከልን ያሳያል፤ ‘ዘጋ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἔξω ἑστάναι
  choice: በውጭ ቆማችሁ
  rationale: ፍጹም የግስ ቅርጹ የቆመ ሁኔታን ያሳያል፤ ‘በውጭ ቆማችሁ’ ይህን ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κρούειν τὴν θύραν
  choice: በሩን ማንኳኳት
  rationale: ተደጋጋሚ የበር ማንኳኳትን ሳያጋንን የሚገልጽ መደበኛ አማርኛ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριος የሚለውን ዋና ትርጉምና የሉቃስን ሰፊ ሥነ መለኮታዊ ድምፅ ይጠብቃል፤ በምሳሌው ውስጥም ለቤቱ ጌታ የቀረበ አክብሮታዊ ጥሪ ሊሆን ይችላል።
- source_word: ἄνοιξον ἡμῖν
  choice: ክፈትልን
  rationale: የተጠቃለለውን ‘ለእኛ ክፈት’ በተፈጥሯዊና አጭር የአማርኛ ትእዛዝ ያቀርባል።
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: እናንተን አላውቃችሁም፤ ከየት እንደሆናችሁም አላውቅም
  rationale: ግሪኩ ቀጥተኛውን ተሳቢ ‘እናንተን’ እና ‘ከየት እንደሆናችሁ’ የሚለውን ሐረግ ሁለቱንም ይዟል። በአማርኛ ግልጽ ለማድረግ ግሱ ተደግሟል፤ በግሪኩ ያለው አወቃቀር ግን በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በምሳሌያዊ ንግግር ውስጥ κύριοςን መተርጎም
  choice: ጌታ ሆይ
  alternative: ባለቤት ሆይ / ክቡር ሆይ
  rationale: ‘ጌታ’ የቃሉን መደበኛ ትርጉም ይጠብቃል፤ በምሳሌው አውድ ያለውን ተራ የአክብሮት አነጋገር እና በሉቃስ ወንጌል ያለውን ሰፊ ሥነ መለኮታዊ ድምፅ ሳይወስን ለሁለቱም ክፍት ያደርገዋል።
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ የሚለው አገባብ
  choice: እናንተን አላውቃችሁም፤ ከየት እንደሆናችሁም አላውቅም
  alternative: እናንተን፣ ከየት እንደሆናችሁ አላውቅም
  rationale: ቀጥተኛውን ተሳቢ አለመተው የጽሑፉን ኃይለኛ የክህደት/ያለማወቅ ንግግር ይጠብቃል። ግሱን መድገም የአማርኛውን ግልጽነት ያሻሽላል፤ የግሪኩ ጥብቅ አገባብ በእግር ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ተነሥቶ’ የሚለው ባህላዊ አጻጻፍ ቢኖረውም በዘመናዊ ንባብ የተለመደና የተከበረ ነው።
