review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, the householder’s action, the standing outside and knocking, and the plea are conveyed faithfully. The final response, however, expands the single Greek verb οἶδα into two separate denials ('I do not know you; I do not know where you are from'), adding emphasis and a semantic division not expressed in the source.
  naturalness: Most of the verse is clear, modern, and appropriately dignified. The phrase “እናንተን አላውቃችሁም” is not idiomatic standard Amharic because it redundantly combines the explicit accusative object እናንተን with the object suffix -አችሁ. The final statement is most natural with እናንተ as the topic/subject of the embedded question.
  terminology: “የቤቱ ጌታ” suitably renders οἰκοδεσπότης, and “ጌታ ሆይ” appropriately preserves the ambiguity and resonance of Κύριε in the parable without imposing an interpretation. “ተነሥቶ” is contextually understood as getting up, not resurrection.
  issues:
  - severity: medium
    issue: The final sentence duplicates the Greek verb and contains an unidiomatic object construction.
    rationale: Greek has one expression, Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ, not two coordinated statements. In Amharic, “እናንተን አላውቃችሁም” is grammatically awkward/redundant. “እናንተ ከየት እንደሆናችሁ አላውቅም” naturally expresses that he does not know where they are from while retaining the explicitly addressed group.
  - severity: low
    issue: Footnote a describes the current expanded rendering as though it were a literal Greek rendering.
    rationale: Because the main text currently repeats “I do not know,” the footnote is needed to distinguish it from the Greek. Once the main text follows the Greek’s single-clause construction, no footnote is necessary.
  revised_text: የቤቱ ጌታ ተነሥቶ በሩን ከዘጋ በኋላ፣ እናንተ በውጭ ቆማችሁ በሩን ማንኳኳት ትጀምራላችሁ፤ ‘ጌታ ሆይ፣ ክፈትልን’ ትላላችሁ። እርሱም መልሶ፣ ‘እናንተ ከየት እንደሆናችሁ አላውቅም’ ይላችኋል።
