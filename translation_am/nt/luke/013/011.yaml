base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: am
  text: እነሆ፣ ለአሥራ ስምንት ዓመት የድካም መንፈስ[a] የነበረባት አንዲት ሴት ነበረች። እርሷም ጎብጣ ነበረች፤ ሙሉ በሙሉ ቀና ማለትም አትችልም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አቅም ያሳጣት መንፈስ” ወይም “የሕመም መንፈስ።” የግሪኩ ጽሑፍ “መንፈስ” የሚለውን ቃል በግልጽ ይጠቅሳል፤ ይህም በመከራዋ ውስጥ መንፈሳዊ አድራጊነት ሊኖር እንደሚችል ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: በትረካው ውስጥ አንባቢውን ወደ አዲሱ ሰው እና ሁኔታ የሚያስተውለውን ሕያው የትኩረት ጥሪ በክቡርና በተለመደ አማርኛ ይጠብቃል።
- source_word: γυνὴ
  choice: አንዲት ሴት
  rationale: በዚህ ስፍራ ሴቲቱ ለመጀመሪያ ጊዜ ስለምትገለጥ ያልተወሰነውን አገላለጽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: የድካም መንፈስ የነበረባት
  rationale: πνεῦμα የሚለውን ‘መንፈስ’ በግልጽ ይጠብቃል፤ ἀσθένεια ያለውን ሰፊ የድካምና የአቅም ማነስ ትርጉምም ያለ አላስፈላጊ የአጋንንት ይዞታ ማብራሪያ ያቀርባል።
- source_word: ἔτη δεκαοκτώ
  choice: ለአሥራ ስምንት ዓመት
  rationale: የሁኔታውን የጊዜ ቆይታ በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: συγκύπτουσα
  choice: ጎብጣ ነበር
  rationale: የሴቲቱን የታጠፈ አካላዊ አቋም በግልጽና በቀጥተኛ ዘመናዊ አማርኛ ይገልጻል።
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: ቀና ማለት አትችልም ነበር
  rationale: ከጎበጠችበት አቋም ወደ ቀጥተኛ አቋም መመለስ እንዳልቻለች በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς τὸ παντελές
  choice: ፈጽሞም
  rationale: አለመቻሏ ሙሉ እንደነበር የሚያጠናክረውን ሐረግ በአጭርና ትክክለኛ መንገድ ያስተላልፋል።
theological_decisions:
- issue: πνεῦμα ἀσθενείας መንፈሳዊ አድራጊነትን የሚያሳንስ ወይም የሚያስወግድ አገላለጽ መሆን አለበት ወይ?
  choice: በዋናው ጽሑፍ ‘የድካም መንፈስ’ ብሎ መንፈስን በግልጽ ማስቀመጥ
  alternative: ‘ሕመም የነበረባት’ ወይም ‘አካል ጉዳተኛ የነበረች’ ብሎ መተርጎም
  rationale: ግሪኩ πνεῦμα (‘መንፈስ’) በግልጽ ይጠቅሳል፤ ስለዚህ ጽሑፉን ወደ ሕክምናዊ ሁኔታ ብቻ ማጥበብ አይገባም። በተመሳሳይ ጊዜ ‘የድካም መንፈስ’ የሚለው ከቁጥሩ በላይ የተወሰነ የአጋንንት ይዞታ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነሆ’ የትረካውን ሕያውነት ይጠብቃል፤ ‘ጎብጣ’ እና ‘ቀና ማለት’ ደግሞ አካላዊ ሁኔታዋን በቀላሉ ያስረዳሉ።
