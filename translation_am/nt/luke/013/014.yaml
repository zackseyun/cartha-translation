source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: am
  text: ነገር ግን የምኩራቡ አለቃ፣ ኢየሱስ በሰንበት ቀን ስለፈወሰ ተቆጥቶ፣ ለሕዝቡ መልሶ እንዲህ አለ፤ “ሥራ ሊሠራባቸው የሚገቡ ስድስት ቀናት አሉ፤ ስለዚህ በእነዚያ ቀናት መጥታችሁ ተፈወሱ፤ በሰንበት ቀን ግን ለመፈወስ አትምጡ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχισυνάγωγος
  choice: የምኩራቡ አለቃ
  rationale: የምኩራቡን ጉዳይ የሚመራ ኃላፊ መሆኑን በተለመደና ግልጽ አማርኛ ያሳያል፤ የመንግሥት ሥልጣንን አያመለክትም።
- source_word: ἀγανακτῶν
  choice: ተቆጥቶ
  rationale: ቃሉ ጠንካራ ቅሬታንና ቁጣን ይገልጣል፤ “ተቆጥቶ” ለዘመናዊ አንባቢ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: ለሕዝቡ እንዲህ አለ
  rationale: የግሪኩ ያልተፈጸመ ጊዜ በዚህ የንግግር መግቢያ ውስጥ ድግግሞሽን በግድ አያመለክትም፤ ይህ አተረጓጎም ተፈጥሯዊ አማርኛ ነው።
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: ሥራ ሊሠራባቸው የሚገቡ ስድስት ቀናት አሉ
  rationale: δεῖ የሚያሳየውን ግዴታ በ“የሚገቡ” ያቆያል፣ የግሪኩንም አወቃቀር ያለ ከባድ ቀጥተኛነት ይከተላል።
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: ስለዚህ በእነዚያ ቀናት እየመጣችሁ ተፈወሱ
  rationale: οὖν የሚያሳየውን መደምደሚያ፣ ἐρχόμενοι የሚያሳየውን መምጣት፣ θεραπεύεσθε የሚያሳየውን መፈወስ ይጠብቃል።
theological_decisions:
- issue: የምኩራቡ አለቃ ስለ ሥራና ስለ ፈውስ የተናገረውን አቀራረብ
  choice: ቃሉን እንደ አለቃው ግዴታዊ አባባል ማቅረብ፤ “ሥራ ሊሠራባቸው የሚገቡ ስድስት ቀናት አሉ”
  alternative: ንግግሩን በማብራሪያ አስፍቶ ግብዝነቱን በትርጉሙ ውስጥ በቀጥታ መግለጽ
  rationale: ጥቅሱ የሚዘግበው የአለቃውን አመለካከት እንጂ መለኮታዊ ማጽደቅን አይደለም። ትርጉሙ የንግግሩን ግዴታዊ ኃይል ይጠብቃል፣ ነገር ግን በጥቅሱ ያልተገለጸ የእምነት ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ምኩራብ፣” “ሰንበት፣” እና “ተፈወሱ” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ የአረፍተ ነገሩ አወቃቀር ግን የዘመኑ አማርኛ ነው። በዋናው ጽሑፍ ውስጥ የግርጌ ማስታወሻ ምልክት ስላልገባ የግርጌ ማስታወሻ አልተጨመረም።
