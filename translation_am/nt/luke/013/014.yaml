  to: ነገር ግን የምኩራቡ አለቃ፣ ኢየሱስ በሰንበት ቀን ስለፈወሰ ተቆጥቶ፣ ለሕዝቡ መልሶ እንዲህ አለ፤ “ሥራ ሊሠራባቸው የሚገቡ ስድስት ቀናት አሉ፤ ስለዚህ በእነዚያ ቀናት መጥታችሁ ተፈወሱ፤ በሰንበት ቀን ግን ለመፈወስ አትምጡ።”
  rationale: The revision restores the omitted response marker and repairs the final prohibition. It retains the ruler’s own normative claim about workdays without endorsing it or adding theological interpretation. The wording “ለመፈወስ አትምጡ” makes explicit in idiomatic Amharic the purpose implied by the Greek participle and passive imperative while preserving the contrast with the Sabbath.
