    text: ወይም፣ “የእርሱ ተቃዋሚዎች ሁሉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ድንቅ ነገሮች ሁሉ” ወይም “ግሩም ነገሮች ሁሉ።” ግሪኩ “ክብር ያላቸው ነገሮች” ይላል፤ ይህም ኃያላን ሥራዎቹን ሊያካትት የሚችል ሰፊ አገላለጽ ነው።
