id: LUK.13.30
reference: Luke 13:30
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: am
  text: እነሆ፣ ከኋለኞች መካከል ፊተኞች የሚሆኑ አሉ፤ ከፊተኞችም መካከል ኋለኞች የሚሆኑ አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአድማጩን ትኩረት ወደ ቀጣዩ አስገራሚ ንግግር የሚስብ እና በዘመናዊ መደበኛ አማርኛ የተከበረ የመጽሐፍ ቅዱስ አነጋገር ነው።
- source_word: ἔσχατοι
  choice: ኋለኞች
  rationale: የመጨረሻ ስፍራን ወይም ዝቅተኛ ደረጃን ያመለክታል፤ የሥነ ምግባር ፍርድ የሚጨምረውን ‘ታናናሾች’ አልተመረጠም።
- source_word: πρῶτοι
  choice: ፊተኞች
  rationale: ከ‘ኋለኞች’ ጋር ያለውን አጭርና ሚዛናዊ ተቃርኖ ይጠብቃል።
- source_word: οἳ ἔσονται
  choice: የሚሆኑ
  rationale: የግሪኩን አንጻራዊ ሐረግና የወደፊት ጊዜ ትንቢት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰσὶν
  choice: አሉ
  rationale: የህልውና አገላለጹን ‘there are’ በቀጥታና በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: καὶ
  choice: ፤ …ም
  rationale: የሁለቱን ተመጣጣኝ ክፍሎች ግንኙነት በአማርኛ ተፈጥሯዊ በሆነ አያያዥ ቅጥያ እና ሥርዓተ ነጥብ ይጠብቃል።
theological_decisions:
- issue: የቦታ መገለባበጡ አባባል ወሰን
  choice: የማኅበራዊ፣ የዘር ወይም የመጨረሻ ፍርድ ምድብ ሳይወሰን፣ ስለ ደረጃ መገለባበጥ አጠቃላይ አባባል ሆኖ ተተርጉሟል።
  alternative: በተለይ ስለ አሕዛብና አይሁድ፣ ስለ ትሕትናና ትዕቢት፣ ወይም ስለ መጨረሻው ፍርድ ደረጃዎች እንደሚናገር መግለጽ።
  rationale: ዐውዱ ከመንግሥቱ መግባት ጋር ቢያያዝም፣ የግሪኩ አባባል አጭርና አጠቃላይ ነው፤ ትርጉሙም ይህን ስፋትና የትርጓሜ ውጥረት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ መደበኛና ክቡር አማርኛ ተጠቅሟል። ‘እነሆ’ ትኩረት የሚስብ መጽሐፍ ቅዱሳዊ ቃል ሲሆን አሁንም በቀላሉ ይገባል። ‘ከ…መካከል’ የሚለው አወቃቀር የግሪኩን ስማዊ ቅጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በጽሑፉ ያልተገለጸ ትርጓሜ አይጨምርም።
