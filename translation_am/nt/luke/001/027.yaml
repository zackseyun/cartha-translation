    text: ወይም፣ “በጋብቻ ቃል ለተሰጠች።” የግሪኩ ቃል ሙሉ ጋብቻ ከመፈጸሙ በፊት ያለውን መደበኛና አስገዳጅ የእጮኝነት ሁኔታ ያመለክታል።
