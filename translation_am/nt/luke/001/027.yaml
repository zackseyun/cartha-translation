    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: ድንግል / የድንግሊቱ
  rationale: በዚህ አውድ παρθένος የጾታ ግንኙነት ያልፈጸመችን ሴት ያመለክታል፤ በቁጥሩ ውስጥ የተደገመውንም ቃል በተመሳሳይ መንገድ ለማቆየት “ድንግል” ተመርጧል።
- source_word: ἐμνηστευμένην
  choice: ለታጨች
  rationale: የግሪኩ ፍጹም ተሳቢ ቅርጽ በሕጋዊና በማኅበራዊ ክብደት የተመሠረተ የጋብቻ ቃል ኪዳን ሁኔታን ያሳያል። “ለታጨች” ይህን በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀνδρὶ
  choice: ለሰው
  rationale: ἀνήρ “ሰው” ወይም “ባል” ሊል ቢችልም፣ ከእጮኝነቱ አገባብ ጋር “ሰው” ማለት ጋብቻው ተፈጽሞ እንደነበር ሳያስገባ የምንጩን አሻሚነት ይጠብቃል።
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: ዮሴፍ ለተባለ
  rationale: የግሪኩን የስም አጠራር ቀመር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξ οἴκου Δαυίδ
  choice: ከዳዊት ቤት ለሆነ
  rationale: “ቤት” የሚለውን መጽሐፍ ቅዱሳዊ የዘርና የንጉሣዊ ሐረግ አገላለጽ ይጠብቃል፤ አቀማመጡም ሐረጉ ዮሴፍን እንደሚገልጽ ግልጽ ያደርጋል።
- source_word: Μαριάμ
  choice: ማርያም
  rationale: “ማርያም” በአማርኛ የተለመደውንና ከግሪኩ ቅርጽ ጋር የቀረበውን የስሙን አጠራር ይጠብቃል።
theological_decisions:
- issue: παρθένος የድንግልናን ትርጉም በግልጽ ሁኔታ መጠበቅ
  choice: ድንግል
  alternative: ወጣት ሴት
  rationale: የሉቃስ ቃል ምርጫና የቅርብ አውዱ “ድንግል” የሚለውን ትርጉም ይደግፋሉ፤ ይህም ከቁጥሩ ውጭ ትምህርት ሳይጨምር የጽሑፉን ሥነ መለኮታዊ ክብደት ይጠብቃል።
- issue: ἐμνηστευμένην የሚያመለክተው የጋብቻ ሁኔታ
  choice: ለታጨች
  alternative: ለተጋባች / ለባል የተሰጠች
  rationale: ጽሑፉ መደበኛና ጽኑ የእጮኝነት ሁኔታን ያመለክታል፤ ትርጉሙ ሙሉ ጋብቻ እንደተፈጸመ አያስገባም።
