  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የቀረበው የግሪክ ምንጭ የቁጥር 26 ግስን የሚቀጥል ሐረግ ስለሆነ፣ በምንጩ ውስጥ ያልተሰጠ ግስ አልተጨመረም። “ከዳዊት ቤት” የሚለው ሐረግ ዮሴፍን እንዲገልጽ የቃላት አደራደሩ ተስተካክሏል።
