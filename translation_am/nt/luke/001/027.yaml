  text: ስሙ ዮሴፍ የሆነ፣ ከዳዊት ቤት የሆነ ሰው ለታጨች[a] ድንግል ዘንድ፤ የድንግሏም ስም ማርያም[b] ነበር።
  philosophy: optimal-equivalence
  footnotes:
