id: LUK.1.67
reference: Luke 1:67
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: am
  text: አባቱ ዘካርያስም በመንፈስ ቅዱስ ተሞልቶ እንዲህ ሲል ትንቢት ተናገረ፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: ዘካርያስ
  rationale: የግሪኩን የግል ስም በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን አጻጻፍ ተከትሎ ያቀርባል።
- source_word: ὁ πατὴρ αὐτοῦ
  choice: አባቱ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊና አጭር አማርኛ ይገልጣል፤ ተውላጠ ስሙ ወደ ሕፃኑ ዮሐንስ ይመለሳል።
- source_word: ἐπλήσθη
  choice: ተሞልቶ
  rationale: የግሪኩን ተደራጊ ቅርጽና የተፈጸመ ድርጊት ይጠብቃል፤ በአማርኛም ከቀጣዩ ዋና ግስ ጋር በተፈጥሮ ይያያዛል።
- source_word: πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ
  rationale: ከመሞላት ግስ ጋር በአማርኛ የተለመደውን «በ… ተሞላ» አወቃቀር ይጠቀማል፤ በሉቃስ ዐውድ ሐረጉ የእግዚአብሔርን መንፈስ ያመለክታል።
- source_word: ἐπροφήτευσεν
  choice: ትንቢት ተናገረ
  rationale: የትንቢታዊ ንግግሩን ኃይል በዘመናዊና ግልጽ አማርኛ ይገልጣል፤ «ተነበየ» ሊያስከትለው የሚችለውን የጽሑፍ ወይም የንባብ ግራ መጋባትም ያስወግዳል።
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: ተከታዩን የትንቢት ይዘት በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Καὶ
  choice: -ም
  rationale: የሉቃስን ትረካዊ ቀጣይነት በተፈጥሯዊው የአማርኛ አያያዥ ቅጥያ ይጠብቃል።
theological_decisions:
- issue: የπνεύματος ἁγίου አመልካች
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ / አንድ ቅዱስ መንፈስ
  rationale: በሉቃስ–ሐዋርያት የመለኮታዊ መነሳሳት ዐውድ ይህ ሐረግ የእግዚአብሔርን መንፈስ ያመለክታል። «መንፈስ ቅዱስ» የግሪኩን የቃላት ቅደም ተከተል በቅርበት የሚያንጸባርቅና በአማርኛ የተለመደ ስያሜ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአረፍተ ነገር ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል፤ ሆኖም መረጃውና ትንቢታዊ ኃይሉ ተጠብቀዋል።
