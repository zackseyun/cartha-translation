  source_fidelity: The draft accurately conveys Zechariah's inability to speak, the crowd's realization that he had seen a vision in the sanctuary, and his continuing mute state. The temporal rendering of ἐξελθών and the distinction conveyed by ναός are sound. However, በምልክት ያነጋግራቸው ነበር can imply that he communicated by speaking, which conflicts with the immediately stated inability to speak and is less precise for διανεύων (‘making signs/gesturing’).
