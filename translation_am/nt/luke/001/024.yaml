- source_word: μῆνας πέντε
  choice: ለአምስት ወራት
  rationale: ተሳቢው የጊዜ ቆይታን ያመለክታል፤ በአማርኛ «ለ» ይህን በተፈጥሮ ይገልጻል።
- source_word: λέγουσα
  choice: እንዲህ እያለች
  rationale: የአሁን ጊዜ አንቀጸ ግስ በሚቀጥለው ቁጥር ከሚመጣው ንግግር ጋር ያገናኛል፤ «እያለች» የአንቀጸ ግሱን ግንኙነት ይጠብቃል።
