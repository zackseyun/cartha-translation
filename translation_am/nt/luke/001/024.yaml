  rationale: በዚህ አውድ ግሱ ልጅን መፀነስን ያመለክታል፤ «ፀነሰች» ቀጥተኛ፣ የተከበረና ተፈጥሯዊ አማርኛ ነው።
- source_word: Ἐλισάβετ
