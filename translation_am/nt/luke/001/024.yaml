- source_word: ἡ γυνὴ αὐτοῦ
  choice: ሚስቱ
  rationale: γυνή ሴት ወይም ሚስት ሊሆን ቢችልም፣ ባለቤትነት አመልካቹና አውዱ «ሚስቱ» የሚለውን ትርጉም ግልጽ ያደርጋሉ።
- source_word: περιέκρυβεν ἑαυτὴν
  choice: ራሷን ሰውራ ቆየች
