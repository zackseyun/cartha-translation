  text: ከእነዚህም ቀኖች በኋላ[a] ሚስቱ ኤልሳቤጥ ፀነሰች፤ ለአምስት ወራትም ራሷን ሰውራ ቆየች[b]፣ እንዲህ እያለች፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነዚያ ቀኖች በኋላ።” የግሪኩ አመልካች ቃል ያለፈውን ጊዜ ሲጠቅስ «እነዚህ» ወይም «እነዚያ» ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ራሷን ደበቀች” ወይም “ከሰዎች ተገልላ ቆየች።” የግሪኩ የግስ ቅርጽ ድርጊቱ በአምስቱ ወራት የቀጠለ መሆኑን ያመለክታል።
    reason: lexical_alternative
