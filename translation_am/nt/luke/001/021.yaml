  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: am
  text: ሕዝቡም ዘካርያስን እየጠበቁ ነበር፤ በመቅደስ[a] ውስጥ በመዘግየቱ ይደነቁ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “መቅደስ” የሚለው ሰፊውን የቤተ መቅደስ ግቢ ሳይሆን ዋናውን የተቀደሰ ሕንፃ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: ሕዝቡ
  rationale: የተሰበሰቡትን ሰዎች በኅብረት የሚያመለክተውን ነጠላ የግሪክ ስም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προσδοκῶν
  choice: እየጠበቁ ነበር
  rationale: ከἦν ጋር ያለው የቀጣይ ያለፈ ጊዜ ቅርጽ ጥበቃው ለተወሰነ ጊዜ እየቀጠለ እንደነበር ያሳያል።
- source_word: Ζαχαρίαν
  choice: ዘካርያስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን የስሙን ቅርጽ ይጠቀማል።
- source_word: ἐθαύμαζον
  choice: ተደነቁ
  rationale: ያልተጠበቀው መዘግየት ያስከተለውን መደነቅ ያስተላልፋል፤ የሐሳብ ጥያቄን ብቻ የሚጠቁመውን ‘ተገረሙ’ ወይም ‘ምን ሆኖ ይሆን አሉ’ ከማለት ይልቅ የግሪኩን ኃይል ይጠብቃል።
- source_word: ἐν τῷ χρονίζειν
  choice: በመዘግየቱ
  rationale: የመደነቃቸውን አጋጣሚና ምክንያት በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፣ ዘካርያስም ከተጠበቀው በላይ እንደቆየ ያመለክታል።
- source_word: ναῷ
  choice: በመቅደሱ ውስጥ
  rationale: ναός ሰፊውን የቤተ መቅደስ ግቢ ሳይሆን ዋናውን የተቀደሰ ሕንፃ ያመለክታል፤ ‘መቅደስ’ ይህን ልዩነት በአማርኛ በተሻለ ሁኔታ ይጠብቃል።
- source_word: αὐτόν
  choice: እርሱም … በመዘግየቱ
  rationale: ተውላጠ ስሙ በግሪክ የχρονίζειν ሰዋሰዋዊ ባለቤት ነው፤ በአማርኛም ‘እርሱ’ እና የባለቤት ቅጥያው ‘-ቱ’ ይህንኑ ግንኙነት ግልጽ ያደርጋሉ።
