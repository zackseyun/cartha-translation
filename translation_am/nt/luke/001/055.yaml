  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: am
  text: ለአባቶቻችን[a]፣ ለአብርሃምና ለዘሩ[b] ለዘላለም እንደተናገረው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለቅድመ አያቶቻችን።” የግሪኩ ቃል በቀጥታ “ለአባቶቻችን” ይላል።
    reason: lexical_alternative
  - marker: b
    text: “ዘር” የሚለው የግሪክ ቃል ነጠላ የስብስብ ስም ሲሆን “ዘር፣” “ዝርያ” ወይም “ዘሮች” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: እንደ…ው
  rationale: ከቀደመው ንግግር ጋር ያለውን መጣጣምና የተነገረው ቃል መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλάλησεν
  choice: እንደተናገረው
  rationale: የመናገርን ድርጊት በቀጥታ ያቀርባል፤ ከκαθὼς ጋር ተዋሕዶ ተፈጥሯዊ የአማርኛ አንቀጽ ይፈጥራል።
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: ለአባቶቻችን
  rationale: የግሪኩን ቃል ቀጥተኛ ወንዳዊ ብዙ ቁጥርና ከቃል ኪዳን ታሪክ ጋር ያለውን ድምፅ ይጠብቃል።
- source_word: τῷ Ἀβραὰμ
  choice: ለአብርሃም
  rationale: የግሪኩን ተውላጠ ስም በተለመደው የአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ያቀርባል፤ የ‘ተናገረ’ ተቀባይም መሆኑን ለ- ያሳያል።
- source_word: τῷ σπέρματι αὐτοῦ
  choice: ለዘሩ
  rationale: ‘ዘር’ በአማርኛም ነጠላ የስብስብ ስም ሆኖ ዘርን፣ ልጅን ወይም ትውልድን ሊያመለክት ስለሚችል የግሪኩን ሆን ተብሎ ያልተወሰነ ስፋት ይጠብቃል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: የማያቋርጥ ቆይታን የሚገልጽ ግልጽና ተፈጥሯዊ የአማርኛ አባባል ነው።
theological_decisions:
- issue: πατέρας ἡμῶν የሚለውን ወንዳዊና የቃል ኪዳን ድምፅ ያለውን አገላለጽ መተርጎም
  choice: ለአባቶቻችን
  alternative: ለቀደሙት አባቶቻችን / ለቅድመ አያቶቻችን
  rationale: ምንጩ በግልጽ ወንዳዊ ብዙ ቁጥር ይጠቀማል፣ በአውዱም የእስራኤልን አባቶችና የቃል ኪዳን ታሪክ ያስታውሳል። ሰፋ ያለው የ‘ቅድመ አያቶች’ ትርጉም በማስታወሻ ተጠብቋል።
- issue: σπέρματι αὐτοῦ በአብርሃም የቃል ኪዳን አውድ ያለውን ነጠላ የስብስብ ስም መተርጎም
  choice: ለዘሩ
  alternative: ለትውልዱ / ለዘሮቹ
  rationale: ‘ዘሩ’ የምንጩን ነጠላ ቅርጽና ስብስባዊ ትርጉም በአንድ ጊዜ ይጠብቃል፤ ነጠላ ግለሰብ ወይም ብዙ ዘሮች ብቻ ብሎ አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛው ተፈጥሯዊ የአንቀጽ አወቃቀር ግስን ወደ መጨረሻ ያኖራል፤ ሁለቱ የትርጉም አማራጮች በ[a] እና [b] በትክክለኛው ቃል ላይ ተጠቁመዋል።
