  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: am
  text: እነርሱም፣ “ከዘመዶችሽ መካከል በዚህ ስም የሚጠራ ማንም የለም” አሏት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: አሏት
  rationale: የግሪኩን የንግግር ግስና ንግግሩ ለእርሷ መነገሩን በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: Οὐδείς ἐστιν
  choice: ማንም የለም
  rationale: ፍጹም አሉታዊነቱን በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐκ τῆς συγγενείας σου
  choice: ከዘመዶችሽ መካከል
  rationale: συγγένεια የዘመድ ወገንን ወይም ዘመዶችን ያመለክታል፤ ይህ ምርጫ የἐκ ከፊል-ከሙሉ ግንኙነትንም በግልጽ ያሳያል።
- source_word: ὃς καλεῖται
  choice: የሚጠራ
  rationale: καλέω ከስም ጋር ያለውን መጠራት በቀጥታ ያስተላልፋል፤ በዚህ አውድ 'የተሰየመ' ማለትንም ይይዛል።
- source_word: τῷ ὀνόματι τούτῳ
  choice: በዚህ ስም
  rationale: የግሪኩን ጠቋሚ τούτῳ እና ከκαλεῖται ጋር ያለውን የስም አጠቃቀም በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions: []
translation_notes:
