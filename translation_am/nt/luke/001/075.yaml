lexical_decisions:
- source_word: ἐν
  choice: በ
  rationale: ድርጊቱ የሚፈጸምበትን ሁኔታ ወይም መንገድ ያመለክታል፤ በአማርኛም «በ» በተፈጥሮ ይህን ያስተላልፋል።
- source_word: ὁσιότητι
  choice: ቅድስና
  rationale: በተለይ ከእግዚአብሔር ጋር ባለው ግንኙነት የሚታየውን ቅዱስና የተገባ አኗኗር ያመለክታል፤ «ቅድስና» ከጽድቅ ጋር ያለውን ልዩነትም ይጠብቃል።
- source_word: καὶ
  choice: እና
  rationale: ሁለቱን ስሞች በቀጥታ የሚያገናኝ አያያዥ ነው።
- source_word: δικαιοσύνῃ
  choice: ጽድቅ
  rationale: በዚህ ዐውድ በእግዚአብሔር ፊት ያለን ቅንና ትክክለኛ አኗኗር ያመለክታል፤ «ጽድቅ» ከ«ቅድስና» ጋር ያለውን ጥምረት በተለመደ መጽሐፍ ቅዱሳዊ ቃል ያቀርባል።
- source_word: ἐνώπιον αὐτοῦ
  choice: በእርሱ ፊት
  rationale: በእግዚአብሔር እይታና መገኘት ውስጥ የሚለውን ግንኙነታዊና ገምጋሚ ስሜት ይጠብቃል።
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: ዘመናችንን ሁሉ
  rationale: የሕይወትን ሙሉ ቆይታ የሚገልጽ ተፈጥሯዊ የአማርኛ አባባል ነው፤ የግሪኩን «ቀኖቻችን ሁሉ» የጊዜ ስፋት ይጠብቃል።
