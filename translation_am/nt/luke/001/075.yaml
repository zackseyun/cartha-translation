  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ቃሉ እዚህ ከቅድስና ጋር ተጣምሮ በእግዚአብሔር ፊት ያለን ትክክለኛና ቅን አኗኗር ይገልጻል። «ፍትሕ» ሊሆን የሚችል የቃሉ አማራጭ ቢሆንም፣ በዚህ ቅርብ ዐውድ «ጽድቅ» ይበልጥ ተስማሚ ነው።
