  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: am
  text: እንዲህም ሆነ፤ የአገልግሎቱ[b] ቀናት በተፈጸሙ ጊዜ፣ ወደ ቤቱ[a] ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ መኖሪያው።” የግሪኩ ቃል ራሱን ሕንፃ ወይም በሰፊው መኖሪያንና ቤተሰብን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “አገልግሎት” ዘካርያስ ካህን ሆኖ እንዲፈጽመው የተመደበለትን የቤተ መቅደስ ተግባር ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: በተፈጥሯዊ የአማርኛ ትረካ አልተገለጸም
  rationale: ይህ በሉቃስ ትረካ የተለመደ የንግግር መክፈቻ ነው፤ ‘እንዲህም ሆነ’ ብሎ በቃል መተርጎም በዘመናዊ አማርኛ ከባድና አላስፈላጊ ስለሚሆን የትረካው ቅደም ተከተል በሐረጉ አወቃቀር ተጠብቋል።
- source_word: ὡς
  choice: ሲ-
  rationale: በዚህ ስፍራ ጊዜን የሚያመለክተውን ‘when’ በተፈጥሯዊ የአማርኛ ጊዜ አመልካች ቅጥያ ይገልጻል።
- source_word: ἐπλήσθησαν
  choice: ሲፈጸሙ
  rationale: የተመደቡት ቀናት ሙሉ ቁጥራቸውን ደርሰው ማለቃቸውን ይገልጻል።
- source_word: λειτουργίας
  choice: አገልግሎት
  rationale: በዐውዱ የዘካርያስን የተመደበ የቤተ መቅደስ ክህነታዊ ተግባር ያመለክታል፤ አጭርና ተፈጥሯዊ ቃል ሲሆን ልዩ ዐውዱ በማስታወሻ ተብራርቷል።
- source_word: ἀπῆλθεν
  choice: ሄደ
  rationale: ቀላልና ተፈጥሯዊ የእንቅስቃሴ ግስ ነው።
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: ወደ ቤቱ
  rationale: οἶκος አካላዊውን ቤት ወይም በሰፊው መኖሪያንና ቤተሰብን ሊያመለክት ይችላል፤ ‘ቤቱ’ ይህን የቃሉን ስፋት በተፈጥሯዊ አማርኛ ይጠብቃል።
