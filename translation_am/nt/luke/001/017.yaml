  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: am
  text: እርሱም በኤልያስ መንፈስና ኃይል[a] በፊቱ ይሄዳል፤ የአባቶችን ልብ ወደ ልጆች፣ የማይታዘዙትንም ወደ ጻድቃን ማስተዋል[b] ይመልስ ዘንድ፣ ለጌታም የተዘጋጀ ሕዝብ ያሰናዳ ዘንድ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በኤልያስ መንፈስና ኃይል” የሚለው ከኤልያስ ጋር የሚመሳሰል ትንቢታዊ ሚናና ኃይልን ሊያመለክት ይችላል። የኤልያስን በአካል መመለስ ራሱ አያረጋግጥም።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “ወደ ጻድቃን አስተሳሰብ” ወይም “በጻድቃን ማስተዋል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: በፊቱ ይሄዳል
  rationale: የግሪኩን አጭር አገላለጽና ሆን ብሎ ያልተገለጸውን የαὐτοῦ ተመልካች ይጠብቃል፤ በተልእኮ ከእርሱ ቀድሞ መሄድንም ሊያመለክት ይችላል።
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: በኤልያስ መንፈስና ኃይል
  rationale: የኤልያስን ትንቢታዊ አገልግሎትና ኃይል የሚመስል አገልግሎት መሆኑን በግልጽ ያስተላልፋል።
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: የአባቶችን ልብ ወደ ልጆች ይመልስ ዘንድ
  rationale: የሚልክያስ 4፥6ን ትይዩ አገላለጽ ይጠብቃል፤ ἐπί ያለውን አቅጣጫዊ ትርጉም ‘ወደ’ በማለት ያሳያል።
- source_word: ἀπειθεῖς
  choice: የማይታዘዙትን
  rationale: ቃሉ አለመታመንን፣ እምቢተኝነትንና አለመታዘዝን ሊያካትት ቢችልም፣ ከጻድቃን ሥነ ምግባራዊ አስተዋይነት ጋር ባለው ንጽጽር ‘የማይታዘዙት’ ተፈጥሯዊና ሰፊ ነው።
- source_word: ἐν φρονήσει δικαίων
  choice: ወደ ጻድቃን አስተዋይነት
  rationale: φρόνησις ተግባራዊና ሥነ ምግባራዊ ማስተዋልን ያመለክታል፤ ከἐπιστρέψαι ጋር ያለውን አቅጣጫዊ ግንኙነት ‘ወደ’ ይገልጻል።
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: ለጌታም የተዘጋጀ ሕዝብ ያሰናዳ ዘንድ
  rationale: የἑτοιμάσαιን ዓላማና የፍጹም ተገብሮ አንቀጽ κατεσκευασμένον የሚያሳየውን የዝግጁነት ሁኔታ ለይቶ ያቀርባል።
theological_decisions:
- issue: የኤልያስ ቋንቋ ማንነትና ሚና
  choice: ዮሐንስ በኤልያስ መንፈስና ኃይል የሚያገለግል ተብሎ ቀርቧል።
  alternative: ኤልያስ ራሱ በአካል ተመልሶ መጥቷል የሚል ንባብ።
  rationale: ግሪኩ ‘በኤልያስ መንፈስና ኃይል’ ይላል፤ ስለዚህ ከኤልያስ ጋር ሙሉ የግል ማንነትን ሳይደነግግ ትንቢታዊ ተከታታይነትንና ኃይልን ያሳያል።
- issue: የ‘እርሱ’ና የ‘ጌታ’ ተመልካች
  choice: በፊቱ / ለጌታ
  alternative: በዋናው ጽሑፍ ‘በመሲሑ/በኢየሱስ ፊት’ ብሎ ማስፋት።
  rationale: ዐውደ ንባቡ ተመልካቹን ቢያብራራም፣ ጥቅሱ ራሱ ተውላጠ ስምና ‘ጌታ’ የሚለውን ማዕረግ ይጠቀማል፤ ትርጉሙም ይህን አሻሚነት ይጠብቃል።
