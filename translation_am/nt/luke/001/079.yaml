id: LUK.1.79
reference: Luke 1:79
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: am
  text: 'በጨለማና በሞት ጥላ ውስጥ ተቀምጠው ላሉት ለማብራት፣

    እግሮቻችንንም ወደ ሰላም መንገድ ለመምራት።'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: ያበራል
  rationale: የብርሃን ምስሉን በተፈጥሯዊ አማርኛ ይጠብቃል፤ በዐውዱ የመጣው አካል በጨለማ ላሉት ብርሃን እንደሚሰጥ ያሳያል።
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: በጨለማ ... ውስጥ ተቀምጠው ላሉት
  rationale: καθημένοις የሚለውን የመቀመጥ ሕያው ምስል ከኢሳይያስ አገላለጽ ጋር ያለውን ትስስር ሳያጠፋ ይጠብቃል።
- source_word: σκότει
  choice: ጨለማ
  rationale: ቃሉ በዐውዱ ያለውን ቀጥተኛና ዘይቤያዊ ኃይል ያለ ትርጓሜያዊ ማስፋፋት ይይዛል።
- source_word: σκιᾷ θανάτου
  choice: የሞት ጥላ
  rationale: ግሪኩ ሞትን በግልጽ ይጠቅሳል፤ ይህ ምርጫም የመጽሐፍ ቅዱስን የተለመደ ምስልና ጥቅሳዊ ትስስር ይጠብቃል።
- source_word: τοῦ κατευθῦναι
  choice: ይመራል
  rationale: ከእግሮችና ከመንገድ ምስሎች ጋር ተፈጥሯዊ ሆኖ የአቅጣጫ መስጠትን ያሳያል።
- source_word: τοὺς πόδας ἡμῶν
  choice: እግሮቻችንን
  rationale: የግሪኩን አካላዊና ግጥማዊ ምስል ከማጠቃለል ይልቅ በቀጥታ ይጠብቃል።
- source_word: εἰς ὁδὸν εἰρήνης
  choice: ወደ ሰላም መንገድ
  rationale: የመንገድን ዘይቤ ይጠብቃል፤ ሰላምንም መንገዱ የሚያመጣው ውጤት ብቻ እንደሆነ በትርጓሜ አይወስንም።
theological_decisions:
- issue: የጨለማ፣ የሞት ጥላ፣ የእግርና የመንገድ ምስሎችን ዘይቤያዊነት
  choice: ምስሎቹን በዋናው ጽሑፍ ሳይፈቱ መጠበቅ
  alternative: ጨለማን እንደ መንፈሳዊ አለማወቅ፣ ሞትን እንደ አደጋ፣ የሰላም መንገድንም እንደ ሥነ ምግባራዊ ኑሮ በግልጽ መተርጎም
  rationale: ጥቅሱ ግጥማዊና ጥቅሳዊ ነው፤ ምስሎቹን ወደ አንድ ብቻ ሥነ መለኮታዊ ትርጓሜ መገደብ ያለውን ሆን ተብሎ የተተወ ስፋት ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግጥሙ ትይዩ አወቃቀርና የብርሃን/ጨለማ፣ እግር/መንገድ ምስሎች ተጠብቀዋል። በዐውዱ ያሉትን የዓላማ ኢንፊኒቲቮች በተፈጥሯዊ የአማርኛ የወደፊት/አጠቃላይ ግስ ቅርጽ ቀርበዋል።
