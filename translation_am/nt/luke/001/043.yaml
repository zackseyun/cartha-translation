    text: ወይም፣ ይበልጥ ቀጥተኛ ትርጉም፦ “ይህስ ከየት ለእኔ ሆነ…?” ይህ ፈሊጣዊ አባባል እንዲህ ያለ ክብር በማግኘቷ የተሰማትን መደነቅ ይገልጻል።
