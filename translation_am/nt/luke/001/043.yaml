- issue: πόθεν μοι τοῦτο የሚለውን ፈሊጣዊ አገላለጽ በቀጥታ ወይም በተፈጥሮ መተርጎም
  choice: ይህ ክብር እንዴት ለእኔ ተሰጠኝ?
  alternative: ይህስ ከየት ለእኔ ሆነ?
  rationale: የተመረጠው አባባል የኤልሳቤጥን መደነቅና የክብር ስጦታ ስሜት በዘመናዊ አማርኛ ግልጽ ያደርጋል። የግሪኩ ቀጥተኛና በመጠኑ አሻሚ አነባበብ በእግር ማስታወሻው ተጠብቋል።
