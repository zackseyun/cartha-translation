lexical_decisions:
- source_word: πόθεν
  choice: እንዴት
  rationale: ቃሉ በቀጥታ ‘ከየት’ ማለት ቢሆንም፣ በዚህ አገባብ ኤልሳቤጥ ያገኘችውን ያልተጠበቀ ክብር በመደነቅ ትጠይቃለች፤ ‘እንዴት’ ይህን በዘመናዊ አማርኛ በተፈጥሮ ያስተላልፋል።
- source_word: μοι
  choice: ለእኔ
  rationale: ያልተጠበቀው ክብር የደረሰላትን ሰው የሚያመለክተውን የግሪክ ተውሳከ ስም በተፈጥሮ ይተረጉማል።
- source_word: τοῦτο
  choice: ይህ ክብር
  rationale: የግሪኩ ‘ይህ’ ብቻ ቢልም፣ አገባቡ የሚገልጸው ያልተጠበቀ ሞገስ ወይም ክብር ነው። ‘ይህ ክብር’ በአማርኛ አባባሉን ግልጽ ያደርጋል፤ የቀጥታው አነባበብ በማስታወሻው ተጠብቋል።
- source_word: ἵνα ἔλθῃ
  choice: እንድትመጣ
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የአስደናቂውን ሁኔታ ይዘት ያቀርባል፤ ‘እንድትመጣ’ ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: μήτηρ
  choice: እናት
  rationale: ቀጥተኛና ተፈጥሯዊ የቃሉ አቻ ነው።
- source_word: κυρίου μου
  choice: የጌታዬ
  rationale: κύριος ያለውን ክብርና ክርስቶሳዊ ክብደት ሳያሳንስ ‘ጌታ’ ተብሎ ተተርጉሟል፤ μου ደግሞ በ‘ጌታዬ’ ተካትቷል።
- source_word: πρὸς ἐμέ
  choice: ወደ እኔ
  rationale: ወደ ኤልሳቤጥ የሚደረገውን እንቅስቃሴ በቅርብ ይገልጻል፤ ‘ወደ ቤቴ’ ማለት ምንጩ ያልገለጸውን ይጨምራል።
theological_decisions:
- issue: ἡ μήτηρ τοῦ κυρίου μου የሚለውን ሐረግ መተርጎም
