translation:
  language: am
  text: ኃያሉ ታላላቅ ነገሮችን አድርጎልኛልና፤ ስሙም ቅዱስ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ቅዱስም ነው ስሙ።» በግሪክኛው «ቅዱስ» የሚለው ቃል «ስሙ» ከሚለው በፊት ለአጽንዖት ተቀምጧል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: -ና
  rationale: የቀደመውን የማርያም ውዳሴ ምክንያት የሚያሳይ ስለሆነ፣ በአማርኛ ተፈጥሯዊ የሆነው ምክንያታዊ ቅጥያ «-ና» ተመርጧል።
- source_word: ἐποίησέν
  choice: አድርጎልኛል
  rationale: ድርጊቱ ተፈጽሞ አሁንም ጠቀሜታው እንዳለ የሚያሳየውን የግሪኩን አውድ በተፈጥሯዊ አማርኛ ያቀርባል፤ «-ልኛል» ደግሞ μοι ያለውን ተጠቃሚነት ያካትታል።
- source_word: μοι
  choice: -ልኛል
  rationale: የድርጊቱ ተጠቃሚ ማርያም መሆኗን «ለእኔ» ከማለት ይልቅ በተፈጥሯዊው የአማርኛ ግስ ቅጥያ ይገልጻል።
- source_word: μεγάλα
  choice: ታላቅ ነገር
  rationale: በግሪክ ገለልተኛ ብዙ ቁጥር በስማዊ አጠቃቀም ነው፤ አማርኛ «ታላቅ ነገር» የታላቅ ሥራ ሰፊ ትርጉሙን ሳያጠብ ተፈጥሯዊ ነው።
- source_word: ὁ δυνατός
  choice: ሁሉን ቻዩ
  rationale: ከመስተዋድዱ ጋር ያለው ቅጽል እንደ ስምና እንደ መለኮታዊ ማዕረግ ተጠቅሟል። «ሁሉን ቻዩ» በዘመናዊ መደበኛ አማርኛ የተለመደ፣ ክብር ያለው ማዕረግ ነው።
- source_word: ἅγιον
  choice: ቅዱስ
  rationale: የእግዚአብሔርን ስም በትንቢታዊ አገባብ የሚገልጽ ሲሆን፣ «ቅዱስ» የንጽሕናንና የተለየ መሆንን ትርጉም የሚጠብቅ መደበኛ አቻ ነው።
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ስሙ
  rationale: የግሪኩን «ስሙ» በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል፤ «ስም» በመጽሐፍ ቅዱሳዊ አውድ የተገለጠውን ባሕርይና ዝና ሊያመለክት ቢችልም ቃሉ ራሱ አልተተካም።
theological_decisions:
- issue: ὁ δυνατόςን እንደ መለኮታዊ ማዕረግ መተርጎም
  choice: ሁሉን ቻዩ
  alternative: ኃያሉ / ኃይለኛው
  rationale: የግሪኩ መስተዋድድ ያለውን ቅጽል እንደ ስም ያቀርባል። «ሁሉን ቻዩ» የማዕረጉን ክብር ይጠብቃል፤ የተወሰነ የቤተ እምነት ትምህርትም አያክልም።
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ ያለው የቃላት ቅደም ተከተል
  choice: ስሙም ቅዱስ ነው
  alternative: ቅዱስም ነው ስሙ
  rationale: ግሪኩ «ቅዱስ»ን በፊት በማምጣት አጽንዖት ይሰጣል፤ ዋናው ጽሑፍ ግን ግልጽና ተፈጥሯዊ የአማርኛ ቅደም ተከተልን ተከትሏል፣ የአጽንዖቱ ልዩነትም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምክንያታዊ ግንኙነት በ«-ና»፣ የμοι ተጠቃሚነት በ«-ልኛል» ተዋሕዷል።
