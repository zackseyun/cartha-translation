  verdict: revise
  source_fidelity: The draft mistranslates ὁ δυνατός ('the Mighty One') as «ሁሉን ቻዩ», which means 'the One who knows/sees everything' and introduces omniscience rather than might. It also renders the substantival neuter plural μεγάλα as singular «ታላቅ ነገር»; the plural sense should be retained.
  naturalness: Apart from these fidelity issues, the verbal form «አድርጎልኛልና» is natural and clearly conveys both the completed action and its benefit to Mary. «ስሙም ቅዱስ ነው» is idiomatic modern standard Amharic.
  terminology: «ኃያሉ» is an appropriate reverent substantive rendering of the divine title ὁ δυνατός. «ቅዱስ» correctly renders ἅγιον. The footnote accurately gives the emphatic alternative word order.
  issues:
  - severity: high
    issue: «ሁሉን ቻዩ» for ὁ δυνατός
    rationale: «ሁሉን ቻዩ» denotes the all-knowing/all-seeing one, whereas δυνατός denotes the mighty or powerful one. This changes the source's attribute/title.
  - severity: medium
    issue: Singular «ታላቅ ነገር» for μεγάλα
    rationale: μεγάλα is substantival plural ('great things'). Amharic should preserve the plurality with «ታላላቅ ነገሮችን».
  revised_text: ኃያሉ ታላላቅ ነገሮችን አድርጎልኛልና፤ ስሙም ቅዱስ ነው።[a]
