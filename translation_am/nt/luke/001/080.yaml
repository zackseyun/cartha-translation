  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: am
  text: ሕፃኑም እያደገ በመንፈስ እየበረታ ሄደ[a]፤ ለእስራኤል በይፋ እስከሚገለጥበት ቀን ድረስ በምድረ በዳ ስፍራዎች ይኖር ነበር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመንፈስ ቅዱስ እየበረታ።” የግሪኩ አገላለጽ በአጠቃላይ የውስጥ ወይም የመንፈሳዊ ብርታትን፣ ወይም በተለይ ከመንፈስ ቅዱስ ጋር ያለ ብርታትን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: በቃል በቃል፣ “በምድረ በዳዎች” ወይም “በባድማ ስፍራዎች።” በግሪኩ ብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: ሕፃኑ
  rationale: ዮሐንስን በልጅነቱ የሚያመለክት ሲሆን፣ የተወሰነ የዕድሜ ደረጃ ሳያስገድድ በተፈጥሯዊ አማርኛ ይገልጸዋል።
- source_word: ηὔξανε
  choice: እያደገ ... ሄደ
  rationale: የግሪኩን ያልተቋረጠ የእድገት ሂደት በአማርኛ ተፈጥሯዊ በሆነ ቀጣይነት ያሳያል።
- source_word: ἐκραταιοῦτο
  choice: እየበረታ ሄደ
  rationale: ቀጣይ የመጠንከር ሂደትን ያሳያል፤ ግሱ ተደራጊ ወይም ውስጠ-ግስ መሆኑን በግድ አይወስንም።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የውስጥ ወይም መንፈሳዊ ብርታትን ሊያመለክት የሚችለውን ክፍትነት ይጠብቃል፤ መንፈስ ቅዱስን በቀጥታ አይወስንም።
- source_word: ἐν ταῖς ἐρήμοις
  choice: በምድረ በዳ ስፍራዎች
  rationale: የግሪኩን ብዙ ቁጥር በተፈጥሯዊ አማርኛ ይጠብቃል፤ ቃሉንም በጠባብ መልኩ እንደ አሸዋማ በረሃ ብቻ አይገድብም።
- source_word: ἀναδείξεως
  choice: በይፋ እስከሚገለጥበት
  rationale: ለሕዝብ የመታየትንና ይፋ የመውጣትን ሐሳብ ግልጽና ዘመናዊ በሆነ አማርኛ ያቀርባል።
- source_word: πρὸς τὸν Ἰσραήλ
  choice: ለእስራኤል
  rationale: የይፋዊ መገለጡ ተመልካችና ተቀባይ እስራኤል መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በዮሐንስ እድገት ውስጥ πνεύματι የሚለው ትርጉም
  choice: በመንፈስ
  alternative: በመንፈስ ቅዱስ፤ በመንፈሳዊ ኃይል
  rationale: የግሪኩ ጽሑፍ እዚህ መንፈስ ቅዱስን በግልጽ አይሰይምም። ስለዚህ ትርጉሙ የውስጥ ብርታትንም ሆነ ከመንፈስ ጋር ያለ ብርታትን ሊያስተናግድ የሚችለውን የምንጩን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እያደገ ... እየበረታ ሄደ” የሁለቱን የግሪክ ያልተፈጸሙ ግሶች ቀጣይ ሂደት ያስተላልፋል።
