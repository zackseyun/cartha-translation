  source_fidelity: The draft accurately represents the child’s ongoing growth and strengthening, retains the appropriately non-specific sense of πνεύματι ('በመንፈስ'), conveys the plural/desolate-place nuance of ἐν ταῖς ἐρήμοις, and renders John’s public emergence to Israel faithfully. The revised wording removes an unnecessary enclitic from 'ለእስራኤልም' without affecting meaning.
