    reason: lexical_alternative
  revision_rationale: The revision removes material imported from verse 3 and retains the verse as the Greek purpose clause. It renders ἐπιγνῷς with the natural “እንድታውቅ,” without forcing an intensified sense, and expresses the content taught and its ἀσφάλεια in idiomatic Amharic. The sole footnote preserves the relevant lexical breadth without resolving whether the emphasis is subjective assurance or objective reliability.
