  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: am
  text: የተማርካቸው ነገሮች እርግጠኝነት[a] እንዳላቸው እንድታውቅ ዘንድ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አስተማማኝነት”፤ የግሪኩ ስም እርግጠኝነትን፣ አስተማማኝነትን ወይም ጽናትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: … ዘንድ
  rationale: የዓላማ ሐረጉን በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐπιγνῷς
  choice: በሚገባ ታውቅ
  rationale: ἐπιγινώσκω እዚህ የሚያመለክተውን ግልጽና የተረጋገጠ ዕውቀት ያለ ማጋነን ይገልጣል።
- source_word: περὶ ὧν … λόγων
  choice: የተማርካቸው ነገሮች
  rationale: λόγων በዐውዱ የቃላትን ቅርጽ ብቻ ሳይሆን የተሰጠውን ትምህርት ይዘት ስለሚያመለክት፣ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: κατηχήθης
  choice: የተማርካቸው
  rationale: የግሥ ተደራጊ ቅርጹንና በቃል ወይም በሥርዓት የተሰጠ ትምህርት የሚለውን ሰፊ ፍቺ ያስተላልፋል፤ ኋለኛውን የቤተ ክርስቲያን ቴክኒካዊ ቃል አያስገባም።
- source_word: τὴν ἀσφάλειαν
  choice: እርግጠኛነት
  rationale: የግሪኩን የእርግጠኝነት፣ የጽናትና የታማኝነት ትርጉም በሰፊው ይይዛል፤ እዚህ ሁሉንም ወደ ግላዊ ስሜት ወይም ወደ ታሪካዊ ማረጋገጫ ብቻ አያጠብም።
theological_decisions:
- issue: የሉቃስ የመጻፍ ዓላማ የሚያመለክተው ግላዊ መተማመን ነው ወይስ የትምህርቱ ተጨባጭ ታማኝነት?
  choice: “እርግጠኛነት” በማለት ሁለቱንም ሊያካትት የሚችል ስፋት ተጠብቋል።
  alternative: “ታማኝነት” ወይም “መተማመን” ብቻ ማለት
  rationale: ἀσφάλεια የነገሩን አስተማማኝነትም ሆነ ከእርሱ የሚመጣውን መተማመን ሊያመለክት ስለሚችል፣ ጥቅሱ ያልወሰነውን ትርጉም ትርጉሙ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ነገር ግን ቁጥሩ ከቁጥር 3 ጋር ተከታትሎ ሲነበብ “ጻፍሁልህ” መደገሙ አስፈላጊ ላይሆን ይችላል፤ እዚህ ቁጥሩ ለብቻው ግልጽ እንዲሆን ተጨምሮ በግርጌ ማስታወሻ ተገልጧል።
