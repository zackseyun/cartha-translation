base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: am
  text: 'የሰሙትም ሁሉ ይህን ነገር በልባቸው አኖሩትና፣ “ታዲያ ይህ ሕፃን ምን ይሆን?”[a] አሉ። ምክንያቱም የጌታ እጅ[b] ከእርሱ ጋር ነበረች።


    [a] ወይም፣ “ይህ ሕፃን ምን ይሆናል?” የግሪኩ ግስ በቀጥታ “ይሆናል” የሚል ቢሆንም፣ በዚህ አውድ ጥያቄው የሕፃኑን የወደፊት ማንነት ወይም ሚና ይመለከታል።


    [b] “የጌታ እጅ” የእግዚአብሔርን በኃይል መሥራት፣ ሞገስ ወይም መምራት የሚያመለክት መጽሐፍ ቅዱሳዊ አነጋገር ነው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ሕፃን ምን ይሆናል?” የግሪኩ ግስ በቀጥታ “ይሆናል” የሚል ቢሆንም፣ በዚህ አውድ ጥያቄው የሕፃኑን የወደፊት ማንነት ወይም ሚና ይመለከታል።
    reason: lexical_alternative
  - marker: b
    text: “የጌታ እጅ” የእግዚአብሔርን በኃይል መሥራት፣ ሞገስ ወይም መምራት የሚያመለክት መጽሐፍ ቅዱሳዊ አነጋገር ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: በልባቸው አኖሩት
  rationale: የግሪኩን ‘በልባቸው ውስጥ አኖሩ’ የሚለውን ምሳሌያዊ አነጋገር ይጠብቃል፤ ነገሩን በጥሞና ማሰብና ማስታወስንም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πάντες οἱ ἀκούσαντες
  choice: የሰሙትም ሁሉ
  rationale: ተሳቢውን የግስ ቅርጽ እና የ‘ሁሉ’ን አጠቃላይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Τί ἄρα
  choice: ታዲያ ... ምን
  rationale: ἄρα ከቀደሙት ክስተቶች በመነሳት የሚቀርብን የውሳኔ ወይም የውጤት ጥያቄ ያመለክታል፤ ‘ታዲያ’ ይህን ቅጥ በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τὸ παιδίον τοῦτο
  choice: ይህ ሕፃን
  rationale: የሕፃኑን ዕድሜ ወይም ጾታ ከጽሑፉ በላይ ሳይወስን ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: ἔσται
  choice: ይሆን
  rationale: ግሱ በቀጥታ ‘መሆን’ን ይገልጣል፤ በአውዱ ግን የሕፃኑን የወደፊት ማንነት ወይም ሚና የሚጠይቅ ሲሆን፣ ‘ምን ይሆን?’ ሁለቱንም ገጽታዎች ሳይዘጋ ያቆያል።
- source_word: καὶ γὰρ
  choice: ምክንያቱም
  rationale: የሕዝቡ ጥያቄ ለምን እንደተነሣ የሚያስረዳውን ምክንያታዊ ግንኙነት በግልጽ አማርኛ ያሳያል።
- source_word: χεὶρ κυρίου
  choice: የጌታ እጅ
  rationale: የመለኮታዊ ኃይልን፣ ሞገስን ወይም መምራትን የሚያመለክተውን መጽሐፍ ቅዱሳዊ ምሳሌያዊ አነጋገር ሳያፈርስ ይጠብቃል።
- source_word: κυρίου
  choice: ጌታ
  rationale: እዚህ κύριος እግዚአብሔርን ያመለክታል፤ ‘ጌታ’ የተለመደና ክብር ያለው አቻ ቃል ነው።
- source_word: μετ’ αὐτοῦ
  choice: ከእርሱ ጋር
  rationale: μετά ከዘር አገባብ ጋር ያለውን ‘ከ...ጋር’ ትርጉም ቀጥታ ይገልጣል፤ ተውላጠ ስሙም ወደ ሕፃኑ ይመለሳል።
theological_decisions:
- issue: “የጌታ እጅ ከእርሱ ጋር ነበረች” የሚለው አነጋገር ትርጉም
  choice: ምሳሌያዊ አነጋገሩን እንዳለ በማቆየት የእግዚአብሔርን ኃይል፣ ሞገስ ወይም ንቁ መገኘት በሰፊው እንዲያመለክት ማድረግ
  alternative: “ጌታ ይረዳው ነበር” ወይም “የእግዚአብሔር ኃይል በእርሱ ላይ ነበር” ብሎ በትርጓሜ መተካት
  rationale: ጽሑፉ የእግዚአብሔርን ተግባራዊ አብሮነት ያሳያል፣ ነገር ግን ጥበቃ፣ ኃይል መስጠት፣ ሞገስ ወይም መምራት ከሚሉት አንዱን ብቻ አይወስንም። ስለዚህ ምሳሌውን ማቆየት የጽሑፉን ሥነ መለኮታዊ ስፋት ይጠብቃል።
