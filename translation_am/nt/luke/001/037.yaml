  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: am
  text: ምክንያቱም ከእግዚአብሔር የሚመጣ ቃል ሁሉ ሊሳን አይችልም[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእግዚአብሔር የማይቻል ምንም ነገር የለም።”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ ይህ ሐረግ መልአኩ ቀደም ሲል ለተናገረው ነገር ምክንያት ይሰጣል፤ “ምክንያቱም” ይህን አብራሪ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ ἀδυνατήσει
  choice: የማይቻል አይሆንም
  rationale: የወደፊት ጊዜ የሆነው ግስ “የማይቻል መሆን” ወይም “አቅም ማጣት” የሚል ሐሳብ አለው። ይህ አተረጓጎም የወደፊት ጊዜውንና ከπᾶν ῥῆμα ጋር ያለውን አወቃቀር ይጠብቃል።
- source_word: παρὰ τοῦ θεοῦ
  choice: ከእግዚአብሔር የሚመጣ
  rationale: παρά ከባለቤት አገናዛቢ ጋር ምንጭን ሊያመለክት ይችላል። ከῥῆμα (“ቃል”) ጋር ሲነበብ፣ ቃሉ ከእግዚአብሔር መምጣቱን ይገልጣል። “ለእግዚአብሔር” የሚለው ባህላዊ ንባብ ግን ሰዋሰዋዊ አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
- source_word: πᾶν
  choice: አንድም
  rationale: πᾶν በቀጥታ “ሁሉ/እያንዳንዱ” ቢሆንም፣ ከአሉታዊው ግስ ጋር ያለውን ሁሉን አቀፍ ኃይል “አንድም … አይሆንም” የሚለው የአማርኛ አወቃቀር በተፈጥሮ ያስተላልፋል።
- source_word: ῥῆμα
  choice: ቃል
  rationale: ῥῆμα “ቃል፣ ንግግር፣ ጉዳይ” ሊል ይችላል። በሉቃስ የልደት ታሪክ ዐውድ “ቃል” የተነገረ መለኮታዊ መግለጫን ይጠብቃል፤ “ነገር” ማለት ግን በግሪኩ በግልጽ ያለውን ቃል ያደበዝዛል።
theological_decisions:
- issue: የπαρὰ τοῦ θεοῦ πᾶν ῥῆμα ሐረግ ትርጉም
  choice: ከእግዚአብሔር የሚመጣ አንድም ቃል የማይቻል አይሆንም።
  alternative: ለእግዚአብሔር የማይቻል ምንም ነገር የለም።
  rationale: ሁለቱም ንባቦች በሰዋስው ሊደገፉ ይችላሉ። ዋናው ጽሑፍ በግሪኩ በግልጽ የሚገኘውን ῥῆμα (“ቃል”) ይጠብቃል፤ ይህም መልአኩ ለማርያም ከነገራት መለኮታዊ መልእክት ጋር ይስማማል። ባህላዊው አማራጭ ንባብ የእግዚአብሔርን ችሎታ አጉልቶ ያሳያል፤ የጽሑፉን እውነተኛ የትርጉም ውጥረት ለመጠበቅ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እግዚአብሔር” የተለመደውን መጽሐፍ ቅዱሳዊ አጠራር ይጠብቃል፤ አወቃቀሩም የግሪኩን ግልጽ ቃላት ሳያጠፋ ተፈጥሯዊ እንዲሆን ተደርጓል።
