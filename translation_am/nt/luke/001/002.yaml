    reason: lexical_alternative
  revision_rationale: The revision restores the comparative force of καθὼς, replaces the erroneous object-marked አስረከቡን with the natural transmission verb አስተላለፉ, and retains ለእኛ as the dative recipient. It keeps γενόμενοι as 'became/were made' in the compact Amharic expression አገልጋዮች የሆኑት without adding the interpretive temporal adverb በኋላም. The verse remains a comma-ended dependent clause, as in the Greek context.
