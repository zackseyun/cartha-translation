- from: ከመጀመሪያው ጀምሮ የዓይን ምስክሮች የነበሩና በኋላም የቃሉ[a] አገልጋዮች የሆኑት እነዚህን ነገሮች ለእኛ እንዳስረከቡን፣
  to: ከመጀመሪያ ጀምሮ የዓይን ምስክሮችና የቃሉ[a] አገልጋዮች የሆኑት ለእኛ እንዳስተላለፉ፣
