translation:
  language: am
  text: ከመጀመሪያ ጀምሮ የዓይን ምስክሮችና የቃሉ[a] አገልጋዮች የሆኑት ለእኛ እንዳስተላለፉ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመለእክቱ።” የግሪኩ λόγος “ቃል፣” “መለእክት፣” ወይም “ታሪክ” ማለት ሊሆን ይችላል፤ እዚህ ስለ ኢየሱስ የሚሰበከውን መለእክት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: እንደ… / እንዳስረከቡን
  rationale: ከቁጥር 1 ጋር ያለውን የንጽጽርና የተዛማጅነት ኃይል በተፈጥሯዊ የአማርኛ አገባብ ይጠብቃል።
- source_word: παρέδοσαν
  choice: አስረከቡን
  rationale: የተቀበሉትን ምስክርነትና መረጃ በታማኝነት ማስተላለፍን ያመለክታል፤ ቃሉ ከἡμῖν ጋር ተዋሕዶ ‘ለእኛ አስረከቡ’ የሚለውን ይገልጣል።
- source_word: ἡμῖν
  choice: ለእኛ
  rationale: የግሥ ተቀባዩን በቀጥታ የሚገልጽ ተፈጥሯዊ አተረጓጎም ነው።
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: ከመጀመሪያው ጀምሮ … የነበሩት
  rationale: ቡድኑ ከክስተቶቹ መጀመሪያ አንስቶ በቦታው እንደነበረ የሚገልጸውን ጊዜያዊ ትርጉም ይጠብቃል።
- source_word: αὐτόπται
  choice: የዓይን ምስክሮች
  rationale: ነገሩን ራሳቸው በቀጥታ ያዩ ሰዎችን የሚያመለክት ግልጽና የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: ὑπηρέται
  choice: አገልጋዮች
  rationale: ለቃሉ በአገልግሎት የተሰጡ ሰዎችን ይገልጣል፤ የተወሰነ ቤተ ክርስቲያናዊ ሹመት ሳያስገባ የምንጩን ሰፊ ትርጉም ይጠብቃል።
- source_word: γενόμενοι
  choice: በኋላም … የሆኑት
  rationale: እነዚሁ ሰዎች መጀመሪያ የዓይን ምስክሮች እንደነበሩና ከዚያም የቃሉ አገልጋዮች እንደሆኑ የγενόμενοιን የመሆን ሂደት ግልጽ ያደርጋል።
- source_word: τοῦ λόγου
  choice: የቃሉ
  rationale: λόγος ያለውን የትርጉም ስፋት ይጠብቃል፤ በዚህ አውድ ስለ ኢየሱስ የተሰበከውን መልእክት ሳይገድብ ሊያመለክት ይችላል።
theological_decisions:
- issue: የτοῦ λόγου ዋቢ
  choice: ስለ ኢየሱስ የተላለፈውን ሐዋርያዊ መልእክት በሚያስችል ሁኔታ ‘ቃሉ’ ተብሎ ተተርጉሟል።
  alternative: ‘መልእክቱ’ ወይም ‘ታሪኩ’
  rationale: እዚህ λόγος የቅድመ ሥጋዌውን ሎጎስ እንደ ክርስቶሳዊ መጠሪያ ከመግለጽ ይልቅ ስለ ኢየሱስ የሚነገረውን መልእክት ሳያመለክት አይቀርም። ‘ቃሉ’ የምንጩን ልቅነት ይጠብቃል፣ የትርጉሙ አማራጭም በማስታወሻ ተገልጿል።
- issue: የγενόμενοι ግንኙነት
  choice: የዓይን ምስክሮች የነበሩና በኋላም የቃሉ አገልጋዮች የሆኑ
  alternative: ‘የዓይን ምስክሮችና የቃሉ አገልጋዮች የሆኑ’
  rationale: ይህ አገላለጽ የመጀመሪያውን ቀጥተኛ ምስክርነትና ቀጥሎ የመጣውን የቃሉ አገልግሎት ይለያል፤ ሆኖም የግሪኩ አገባብ γενόμενοιን ከሁለቱም ስሞች ጋር ማያያዝ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ነገር ተቀባይ በዚህ ቁጥር በግልጽ ስላልተደገመ፣ ከቁጥር 1 የሚወረሰው ‘እነዚህን ነገሮች’ ለአማርኛ ግልጽነት ተጨምሯል።
