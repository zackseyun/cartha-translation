  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: am
  text: በእነዚያ ቀናት ማርያም ተነሥታ በፍጥነት ወደ ተራራማው አገር፣ በይሁዳ ወዳለች አንዲት ከተማ[a] ሄደች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ከተማ» የተተረጎመው የግሪክ ቃል ትልቅ ከተማንም ሆነ ትንሽ ከተማን ሊያመለክት ይችላል። ሐረጉ ደግሞ «ወደ አንዲት የይሁዳ ከተማ» ወይም «ወደ አንዲት የይሁዳ አገር ከተማ» ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: ተነሥታ
  rationale: የግሪኩን ቀዳሚ ድርጊትና ከዋናው ግስ ጋር ያለውን የትረካ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δὲ
  choice: በአማርኛው የትረካ ፍሰት በስውር ተገልጧል
  rationale: δέ ቀላል የትረካ ሽግግር ነው፤ እዚህ «እንግዲህ» ወይም «ነገር ግን» ማለት ከምንጩ በላይ ክብደት ይጨምራል።
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: በዚያን ወራት
  rationale: የጊዜውን አመልካች ኃይል ጠብቆ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐπορεύθη
  choice: ሄደች
  rationale: πορεύομαι በዚህ አውድ የመሄድን አጠቃላይ ትርጉም ይሰጣል፤ «ሄደች» ግልጽና ተፈጥሯዊ ነው።
- source_word: εἰς τὴν ὀρεινὴν
  choice: ወደ ተራራማው አገር
  rationale: ὀρεινή በስም ተግባር የተራራማውን ክልል ያመለክታል፤ ይህ አተረጓጎም ቦታውን በግልጽ ያሳያል።
- source_word: μετὰ σπουδῆς
  choice: በፍጥነት
  rationale: σπουδή ትጋትን፣ ጉጉትን ወይም ፍጥነትን ሊያመለክት ቢችልም፣ በጉዞው አውድ «በፍጥነት» የተጣደፈውን እንቅስቃሴ በተሻለ ይገልጣል።
- source_word: εἰς πόλιν Ἰούδα
  choice: በይሁዳ ወዳለች አንዲት ከተማ
  rationale: πόλις ከተማን ወይም ትንሽ ከተማን ሊያመለክት ይችላል፤ Ἰούδα ደግሞ እዚህ የክልሉ ስም መሆኑ ይበልጥ ተፈጥሯዊ ነው። የአማርኛው አገባብ ቦታዋ በይሁዳ እንዳለች በግልጽ ያሳያል።
theological_decisions:
- issue: የἸούδα መለያ
