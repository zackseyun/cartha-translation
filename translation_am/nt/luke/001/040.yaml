  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: am
  text: ወደ ዘካርያስ ቤት ገብታ ኤልሳቤጥን ሰላም አለቻት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሰላምታ ሰጠቻት።»
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰσῆλθεν
  choice: ወደ … ቤትም ገብታ
  rationale: εἰσῆλθεν ወደ አንድ ስፍራ መግባትን ያመለክታል። በአማርኛ የተከታታይ ትረካውን ፍሰት ለመጠበቅ καὶ በ«-ም» ተገልጧል፤ ሁለቱን ድርጊቶች በተፈጥሯዊ ሁኔታ ለማያያዝም «ገብታ» ተመርጧል።
- source_word: τὸν οἶκον
  choice: ቤት
  rationale: ከεἰς ጋር እዚህ የሚያመለክተው የሚገቡበትን አካላዊ መኖሪያ ስለሆነ «ቤት» ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: Ζαχαρίου
  choice: ዘካርያስ
  rationale: በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἠσπάσατο
  choice: ሰላም አለቻት
  rationale: ἀσπάζομαι በዚህ አውድ ሰውን ሰላም ብሎ መቀበልን ወይም ሰላምታ መስጠትን ያመለክታል። «ሰላም አለቻት» ቀላል፣ ወቅታዊና ከግሪኩ በላይ ሥነ ሥርዓታዊነት የማይጨምር ነው።
- source_word: Ἐλισάβετ
  choice: ኤልሳቤጥ
  rationale: በአማርኛ ክርስቲያናዊ አጠቃቀም የተለመደውና ለአንባቢዎች የታወቀው የስሙ ቅርጽ ነው።
theological_decisions: []
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ ግስ የፆታ ምልክት ባይኖረውም፣ ከቀደመው አውድ የምትሠራው ማርያም መሆኗ ግልጽ በመሆኑ በአማርኛ አስፈላጊው የሴት አንቀጽ «ገብታ…አለቻት» ተጠቅሟል።
