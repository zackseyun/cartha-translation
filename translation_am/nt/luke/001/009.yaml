    text: ወይም፣ “ወደ ጌታ ቤተ መቅደስ።” እዚህ ያለው ναός የተባለው የግሪክ ቃል ብዙ ጊዜ ሰፊውን የቤተ መቅደስ ግቢ ሳይሆን የቤተ መቅደሱን ውስጠኛ ሕንፃ ያመለክታል።
