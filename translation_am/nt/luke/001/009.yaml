lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: በክህነት ሥርዓት መሠረት
  rationale: κατά ከተከታዩ የባለቤትነት ሐረግ ጋር በመሆን ከተመሠረተ የክህነት ልማድና አሠራር ጋር መስማማትን ያሳያል። “ሥርዓት” የግለሰብ ልማድን ብቻ ሳይሆን የክህነትን ተቋማዊ አሠራር ያስተላልፋል።
- source_word: ἔλαχε
  choice: ዕጣ ደረሰበት
  rationale: λαγχάνω አንድ ሥራ ወይም ድርሻ በዕጣ መገኘቱን ያመለክታል። “ዕጣ ደረሰበት” የዕጣውን ሂደትና ውጤት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῦ θυμιᾶσαι
  choice: ዕጣን እንዲያጥን
  rationale: የጽሑፉ አንቀጽ በዕጣ የተሰጠውን ተግባር ይገልጣል፤ θυμιάω ዕጣንን ማጠን ወይም ማቅረብ ማለት ነው። “ዕጣን ማጠን” በዐውዱ ግልጽና ተፈጥሯዊ ነው።
- source_word: εἰσελθὼν
  choice: ገብቶ
  rationale: የአኦሪስት አጋዥ ግስ ወደ መቅደሱ መግባቱን ከዕጣን ማጠኑ ጋር ያያይዛል። “ገብቶ” ይህን ጊዜያዊ ግንኙነት ያለ አላስፈላጊ ማብራሪያ ይጠብቃል።
- source_word: εἰς τὸν ναὸν τοῦ κυρίου
  choice: ወደ ጌታ መቅደስ
  rationale: ναός በዚህ ዐውድ ከሰፊው የቤተ መቅደስ ግቢ ይልቅ ዕጣን የሚታጠንበትን ውስጠኛ መቅደስ ያመለክታል። “መቅደስ” ይህን ይበልጥ በትክክል ይገልጣል፤ κύριος ደግሞ “ጌታ” ተብሎ ተተርጉሟል።
theological_decisions:
- issue: በቤተ መቅደስ አምልኮ ዐውድ ναόςን መተርጎም
  choice: መቅደስ
  alternative: ቤተ መቅደስ
  rationale: ναός ብዙ ጊዜ መላውን የቤተ መቅደስ ግቢ ሳይሆን የውስጡን ቅዱስ ሕንፃ ያመለክታል። ዘካርያስ ዕጣን ለማጠን እየገባ በመሆኑ “መቅደስ” የዐውዱን የተወሰነ ትርጉም ይጠብቃል፤ ሰፋ ያለው አማራጭ በማስታወሻ ተቀምጧል።
