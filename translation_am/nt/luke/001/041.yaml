  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: am
  text: ኤልሳቤጥም የማርያምን ሰላምታ በሰማች ጊዜ፣ ሕፃኑ በማህፀኗ ውስጥ ዘለለ፤ ኤልሳቤጥም በመንፈስ ቅዱስ ተሞላች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: በ…ጊዜ
  rationale: የሉቃስ የትረካ መግቢያ ቀመር ከὡς ጋር ተዋሕዶ በተፈጥሯዊ የአማርኛ ጊዜያዊ አረፍተ ነገር ተገልጧል፤ ‘ሆነ’ ብሎ በቃል መድገም በአማርኛ ከባድ ስለሚሆን የትረካው ተግባር በአወቃቀሩ ተጠብቋል።
- source_word: ὡς
  choice: በ…ጊዜ
  rationale: ድርጊቱ ወዲያው መከተሉን የሚገልጽ ተፈጥሯዊ የአማርኛ ጊዜ አያያዥ ነው።
- source_word: ἀσπασμός
  choice: ሰላምታ
  rationale: የማርያምን የቃል ሰላምታ በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: Μαρίας
  choice: የማርያምን
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ የአማርኛ የ- አወቃቀር ይገልጣል።
- source_word: ἐσκίρτησεν
  choice: ዘለለ
  rationale: ድንገተኛና ሕያው እንቅስቃሴውን በግልጽ ቃል ይጠብቃል።
- source_word: βρέφος
  choice: ሕፃኑ
  rationale: በማህፀን ያለውን ዮሐንስ የሚያመለክት ተፈጥሯዊና ክቡር አገላለጽ ነው።
- source_word: κοιλία
  choice: ማህፀኗ
  rationale: በዚህ ዐውድ ቃሉ በትክክል ማህፀንን ያመለክታል።
- source_word: ἐπλήσθη
  choice: ተሞላች
  rationale: የግሪኩን ተገብሮአዊ ቅርጽና መለኮታዊ ድርጊት የሚያመለክተውን ፍንጭ ሳያብራራ ይጠብቃል።
- source_word: πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ
  rationale: በሉቃስ–ሐዋርያት ሥራ አጠቃቀም መሠረት የእግዚአብሔርን ቅዱስ መንፈስ በመደበኛው የአማርኛ አገላለጽ ያመለክታል።
theological_decisions:
- issue: የπνεύματος ἁγίου ማጣቀሻ
  choice: መለኮታዊው መንፈስ ቅዱስ
  alternative: አንድ ቅዱስ መንፈስ
  rationale: በሉቃስ–ሐዋርያት ሥራ ያለው መደበኛ አጠቃቀምና የትንቢታዊ መነሳሳት ዐውድ የእግዚአብሔርን መንፈስ ያመለክታሉ፤ ትርጉሙ ከጽሑፉ በላይ የሆነ ዶግማዊ ማብራሪያ አይጨምርም።
- issue: βρέφος በማህፀን ላለው ዮሐንስ መጠቀሙ
  choice: ሕፃኑ
  alternative: ልጁ / ጨቅላው
  rationale: ቃሉ በማህፀን ያለውን በጣም ትንሽ ልጅ በቀጥታ ያመለክታል፤ ‘ሕፃኑ’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ἐγένετο ὡς ቅንብር በቃል በቃል ከመተርጎም ይልቅ ተፈጥሯዊ በሆነ ‘በ…ጊዜ’ አወቃቀር ተሰጥቷል። በቀረበው የእንግሊዝኛ እግር ማስታወሻ ምልክት [a] ከ‘it happened that’ ቀጥሎ ቢታይም ጽሑፉ ‘Or salutation’ በማለት ἀσπασμόςን ይመለከታል፤ በአማርኛ ‘ሰላምታ’ ሁለቱንም በቂ ስለሚሸፍን እና ጠቃሚ የትርጉም አማራጭ ስለሌለ የእግር ማስታወሻ አልተጨመረም።
