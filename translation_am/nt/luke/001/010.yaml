lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: ስብስብ ሁሉ
  rationale: πᾶν ከነጠላው πλῆθος ጋር የተሰበሰበውን ሕዝብ ሙሉነት ያጎላል፤ «ስብስብ ሁሉ» ይህን የጋራ እና የሙሉነት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦ λαοῦ
  choice: የሕዝቡ
  rationale: በቤተ መቅደሱ አውድ λαός የኪዳኑን ሕዝብ ሊያመለክት ቢችልም፣ ጽሑፉ «እስራኤል» ብሎ ስለማይገልጽ «የሕዝቡ» ተብሎ ተተርጉሟል።
- source_word: προσευχόμενον
  choice: ይጸልይ ነበር
  rationale: ከἦν ጋር የተሠራው የአሁን ጊዜ አንቀጽ ቀጣይ ድርጊትን ያሳያል፤ «ይጸልይ ነበር» ይህን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔξω
  choice: በውጭ
  rationale: ቃሉ በቀጥታ «ውጭ» ማለት ነው። አውዱ የቤተ መቅደሱን ውጭ ቢያመለክትም፣ በግሪክ ጽሑፉ ያልተገለጸውን «ከመቅደሱ ውጭ» የሚል ዝርዝር አይጨምርም።
- source_word: τῇ ὥρᾳ
  choice: በ...ሰዓት
  rationale: ὥρα «ሰዓት» ወይም «ጊዜ» ሊሆን ይችላል፤ እዚህ «ሰዓት» የተወሰነውን የአምልኮ ጊዜ ይጠብቃል።
- source_word: τοῦ θυμιάματος
  choice: ዕጣን በሚቀርብበት
  rationale: θυμίαμα ዕጣንን ያመለክታል፤ በዚህ የቤተ መቅደስ አውድ ደግሞ የዕጣንን ሥርዓታዊ ማቅረብ ያመለክታል። «ዕጣን በሚቀርብበት» ይህን በግልጽና ተፈጥሯዊ ቋንቋ ያስተላልፋል።
theological_decisions:
- issue: በθυμίαμα ያለው የቤተ መቅደስ ሥርዓት ቃላት
  choice: ዕጣን በሚቀርብበት
  alternative: ዕጣን በሚታጠንበት
  rationale: ዋናው ንባብ የዕጣንን ሥርዓታዊ ማቅረብ ያሳያል፣ ነገር ግን ከጽሑፉ በላይ የሆነ ትምህርተ እምነታዊ ሐሳብ አያስገባም። አማራጩ የዕጣንን የማጠን ተግባር ይበልጥ በቀጥታ ይገልጻል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ስብስብ ሁሉ» የተሰበሰበውን ሕዝብ ሙሉነት ያጎላል፤ ነጠላው የጋራ ርዕሰ ጉዳይ ስለሆነ «ሆኖ ይጸልይ ነበር» ተብሏል።
