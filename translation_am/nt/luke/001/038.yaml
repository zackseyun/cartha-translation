  text: ማርያምም፣ “እነሆ፣ እኔ የጌታ አገልጋይ[a] ነኝ፤ እንደ ቃልህ ይሁንልኝ[b]” አለች። መልአኩም ከእሷ ዘንድ ሄደ።
  philosophy: optimal-equivalence
