base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: am
  text: ልጅም አልነበራቸውም፤ ኤልሳቤጥ መካን ነበረችና፣ ሁለቱም በዕድሜ ገፍተው ነበሩ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በዘመናቸው ገፍተው ነበሩ።” ወይም፣ “በዕድሜ የገፉ ነበሩ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  choice: ልጅ
  rationale: በግሪክ ነጠላ ቁጥር ያለውን ቃል በተፈጥሯዊና ትክክለኛ አማርኛ ያስተላልፋል።
- source_word: καθότι
  choice: ነበረችና
  rationale: የልጅ አልባነታቸውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ አያያዝ ያቀርባል።
- source_word: στεῖρα
  choice: መካን
  rationale: ቃሉ ልጅ ያለመኖርን ውጤት ብቻ ሳይሆን መውለድ አለመቻልን በቀጥታ ይገልጣል፤ ‘መካን’ ይህን ልዩነት በአጭርና በተለመደ ቃል ያቆያል።
- source_word: ἀμφότεροι
  choice: ሁለቱም
  rationale: ንግግሩ ዘካርያስንና ኤልሳቤጥን በአንድነት እንደሚመለከት ግልጽ ያደርጋል።
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: በዕድሜ ገፍተው
  rationale: የግሪኩን ፈሊጣዊ አነጋገርና አክብሮታዊ ቃና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ ἦν αὐτοῖς
  choice: አልነበራቸውም
  rationale: በግሪክ ቃል በቃል ‘ለእነርሱ አልነበረም’ የሚለውን የባለቤትነት ፈሊጥ በተፈጥሯዊ አማርኛ ይገልጣል።
