    text: ወይም፣ “እርሱን አይቶ።” ἰδών የሚለው የግሪክ ተውሳከ ግስ በይበልጥ ቀጥተኛ መንገድ እንዲህ ሊተረጎም ይችላል፤ “ባየው ጊዜ” የሚለው ግን በዚህ አውድ ያለውን ጊዜያዊ ኃይል ግልጽ ያደርጋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: ደነገጠ
  rationale: በዚህ አውድ ውስጣዊ መረበሽንና መደናገጥን በተፈጥሯዊ አማርኛ ያሳያል፤ ቀጥሎ ያለውን φόβος አስቀድሞ እስከ ‘በጣም ፈራ’ ድረስ አያጠናክረውም።
- source_word: Ζαχαρίας
  choice: ዘካርያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: ἰδών
  choice: ባየው ጊዜ
  rationale: የግሪኩን የቀደመ ድርጊት አመልካች ተውሳከ ግስ ጊዜያዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ው’ በቀደመው ቁጥር የተጠቀሰውን መልአክ ያመለክታል።
- source_word: φόβος
  choice: ፍርሃት
  rationale: የግሪኩን ሰፊና ቀጥተኛ ትርጉም ይጠብቃል፤ ‘ሽብር’ የሚለውን ከልክ ያለፈ ጥንካሬ አያስገባም።
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: ወደቀበት
  rationale: ‘በእርሱ ላይ ወደቀ’ የሚለውን ምስላዊ አነጋገር በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
