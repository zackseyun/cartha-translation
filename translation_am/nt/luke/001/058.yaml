id: LUK.1.58
reference: Luke 1:58
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: am
  text: ጎረቤቶቿና ዘመዶቿም ጌታ ለእሷ ታላቅ ምሕረት እንዳደረገ ሰሙ፤ ከእሷም ጋር ደስ አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: ጎረቤቶቿ
  rationale: በዙሪያዋ የሚኖሩትን ሰዎች በተፈጥሯዊና ዘመናዊ አማርኛ ይገልጻል።
- source_word: συγγενεῖς
  choice: ዘመዶቿ
  rationale: የዝምድና ግንኙነት ያላቸውን በግልጽና በተለመደ አገላለጽ ያመለክታል።
- source_word: ἐμεγάλυνεν
  choice: እጅግ እንዳበዛላት
  rationale: ግሱ በቀጥታ ‘ታላቅ ማድረግ/ማጉላት’ የሚል ኃይል ቢኖረውም፣ ከ‘ምሕረት’ ጋር በአማርኛ ‘ምሕረትን ማብዛት’ ተፈጥሯዊ ሆኖ የታላቅነቱን ሐሳብ ይጠብቃል።
- source_word: κύριος
  choice: ጌታ
  rationale: በዚህ አውድ የእግዚአብሔር መጠሪያ ነው፤ ‘ጌታ’ ግልጽና የተለመደ አቻ ነው።
- source_word: ἔλεος
  choice: ምሕረቱን
  rationale: ‘ምሕረት’ የἔλεοςን ርኅራኄና ቸርነት ያካተተ ዋና ትርጉም ይጠብቃል።
- source_word: μετ’ αὐτῆς
  choice: ለእሷ … አበዛላት
  rationale: በዚህ ፈሊጣዊ አገባብ μετά የምሕረቱን ተቀባይ ያመለክታል፤ ቀጥተኛው ‘ከእሷ ጋር’ በአማርኛ ከ‘ምሕረት’ ጋር የማይፈጥሯዊ ስለሆነ ‘ለእሷ’ ተመርጧል።
- source_word: συνέχαιρον αὐτῇ
  choice: ከእሷም ጋር ደስ አላቸው
  rationale: አብረው ደስ የመሰኘታቸውን ሐሳብ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἐμεγάλυνεν … τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς የሚለውን ፈሊጣዊ አገላለጽ መተርጎም
  choice: ጌታ ምሕረቱን ለእሷ እጅግ እንዳበዛላት
  alternative: ጌታ ምሕረቱን ከእሷ ጋር ታላቅ እንዳደረገ
  rationale: የተመረጠው አገላለጽ የμεγαλύνωን የማግዘፍ ኃይል በ‘እጅግ አበዛ’ ይጠብቃል፤ በተመሳሳይም ጊዜ በዘመናዊ አማርኛ የተፈጥሮ ንባብ ይሰጣል። ይህም ጌታ ለኤልሳቤጥ ያደረገውን ታላቅ ምሕረት ያለ ተጨማሪ የእምነት ሥርዓት ትርጓሜ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። በግሪኩ ያለው የመስማትና አብሮ ደስ የመሰኘት ቅደም ተከተል ተጠብቋል።
