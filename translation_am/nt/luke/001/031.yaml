  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: am
  text: እነሆ፣ በማህፀንሽ ትፀንሻለሽ፤ ወንድ ልጅም ትወልጃለሽ፤ ስሙንም ኢየሱስ ብለሽ ትሰይሚዋለሽ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የንግግር ምልክትና የብሥራቱን ክቡር ቃና ይጠብቃል።
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: ትፀንሻለሽ
  rationale: የግሪኩ ሐረግ በዚህ አውድ መፀነስን ያመለክታል፤ በአማርኛም «ትፀንሻለሽ» ትክክለኛና ተፈጥሯዊ ነው። «በማህፀንሽ» ማለትን በተናጠል መጨመር በአማርኛ አላስፈላጊ ድግግሞሽ ይፈጥራል።
- source_word: τέξῃ υἱόν
  choice: ወንድ ልጅም ትወልጃለሽ
  rationale: τίκτω መውለድን፣ υἱός ደግሞ ወንድ ልጅን በግልጽ ያመለክታሉ፤ ይህ አተረጓጎም የፆታውን ዝርዝር ይጠብቃል።
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ስሙንም … ትዪዋለሽ
  rationale: የግሪኩን «ስሙን ትጠሪዋለሽ» የሚለውን የስም አጠራር ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἰησοῦν
  choice: ኢየሱስ
  rationale: በአማርኛ የአዲስ ኪዳን አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
theological_decisions:
- issue: καλέσεις τὸ ὄνομα αὐτοῦ የሚለውን የስም አሰጣጥ ቀመር መተርጎም
  choice: ስሙንም ኢየሱስ ትዪዋለሽ
  alternative: ኢየሱስ ብለሽ ትሰይሚዋለሽ
  rationale: የተመረጠው አተረጓጎም የግሪኩን መጽሐፍ ቅዱሳዊ የስም አጠራር ቅርጽ እየጠበቀ በአማርኛ ተፈጥሯዊ ሆኖ ይነበባል፤ አማራጩ ግን ይበልጥ ፈሊጣዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «እነሆ» የብሥራቱን የተከበረ ቃና ይጠብቃል፤ ሌሎቹ ግሶች ለማርያም የተነገሩ የሴት ነጠላ ቅርጾች ናቸው።
