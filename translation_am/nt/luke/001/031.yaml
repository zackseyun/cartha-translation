review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the annunciation, future feminine-singular address, conception, birth, the male child, and the name Jesus. However, it leaves ἐν γαστρί unexpressed and its naming verb is not idiomatic modern standard Amharic.
  naturalness: «ትፀንሻለሽ» and «ወንድ ልጅ ትወልጃለሽ» are clear and appropriate. «ስሙንም ኢየሱስ ትዪዋለሽ» is an archaizing/traditional form and is not suitable as a clear modern-standard rendering.
  terminology: «እነሆ» appropriately preserves the marked, solemn force of ἰδού. «ኢየሱስ» is the established Amharic New Testament form. «በማህፀንሽ» explicitly represents the Greek phrase ἐν γαστρί without altering its sense.
  issues:
  - severity: medium
    issue: The phrase ἐν γαστρί is omitted.
    rationale: Although conception semantically entails pregnancy, the Greek explicitly says ‘in your womb.’ Adding «በማህፀንሽ» preserves this element naturally in Amharic.
  - severity: medium
    issue: «ትዪዋለሽ» is not a natural modern-standard naming expression.
    rationale: Use the clear modern naming formula «ኢየሱስ ብለሽ ትሰይሚዋለሽ», which faithfully conveys ‘you will call/name him Jesus.’
  revised_text: እነሆ፣ በማህፀንሽ ትፀንሻለሽ፤ ወንድ ልጅም ትወልጃለሽ፤ ስሙንም ኢየሱስ ብለሽ ትሰይሚዋለሽ።
  revised_footnotes: []
