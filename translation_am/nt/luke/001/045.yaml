  rationale: አገባቡ ὅτιን የπιστεύσασα የይዘት አንቀጽ አስገቢ አድርጎ ማንበብን ይደግፋል፤ ሆኖም ሊኖር የሚችለው የምክንያት ንባብ በማስታወሻ ተጠብቋል።
