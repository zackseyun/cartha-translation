  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: am
  text: ከጌታ የተነገራት ነገር እንደሚፈጸም ያመነችውም ብፅዕት ናት[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያመነችውም ብፅዕት ናት፤ ከጌታ የተነገራት ነገር ይፈጸማልና።” የግሪኩ አያያዥ ቃል አንዳንድ ጊዜ ምክንያትን ሊገልጽ ይችላል፤ እዚህ ግን “እንደሚፈጸም” የሚለው የይዘት ንባብ ይበልጥ የሚመረጥ ነው።
    reason: alternative_reading
  - marker: b
    text: “ይፈጸማል” የሚለው ደግሞ “ወደ ፍጻሜ ይደርሳል” ወይም “ይከናወናል” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: ብፅዕት
  rationale: የሉቃስን መንፈሳዊና ሃይማኖታዊ ክብደት ይጠብቃል፤ ‘ደስተኛ’ ከሚለው ጊዜያዊ ስሜት የተለየ ነው።
- source_word: ἡ πιστεύσασα
  choice: ያመነችው
  rationale: በግሪክ ያለውን በስም ፈንታ የቆመ ያለፈ ጊዜ አንቀጽ፣ እንዲሁም የማመኗን ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: እንደሚፈጸም
  rationale: ὅτι በዚህ ስፍራ በዋናነት የታመነውን ይዘት ያስገባል፤ የምክንያት ንባቡ ግን በማስታወሻ ተጠብቋል።
- source_word: τελείωσις
  choice: መፈጸም
  rationale: ቃሉ አንድን ነገር ወደ ፍጻሜ ማድረስን ያመለክታል፤ በተስፋ ቃል አውድም ተፈጥሯዊ ነው።
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: የተነገራት ነገር
  rationale: ቀድሞ የተነገረውን ይዘትና የግሪኩን ተደራጊ ቅርጽ በግልጽ አማርኛ ይጠብቃል።
- source_word: παρὰ κυρίου
  choice: ከጌታ
  rationale: παρά ከባለቤት አገናዛቢ ጋር የንግግሩን ምንጭ ያመለክታል፤ ‘ከጌታ’ ይህን በቀጥታ ያስተላልፋል።
- source_word: κυρίου
  choice: ጌታ
  rationale: በዚህ አውድ የተስፋው ቃል ምንጭ የሆነውን የእስራኤል አምላክ ያመለክታል።
theological_decisions:
- issue: የማርያም ብፅዕና፣ እምነቷና የተስፋው ቃል ፍጻሜ ግንኙነት
  choice: ማርያም፣ ከጌታ የተነገራት ነገር እንደሚፈጸም ስላመነች፣ ብፅዕት ተብላለች።
