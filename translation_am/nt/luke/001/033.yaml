  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: am
  text: እርሱም በያዕቆብ ቤት ላይ ለዘላለም[a] ይነግሣል፤ መንግሥቱም ፍጻሜ አይኖረውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለዘመናት»። የግሪኩ ፈሊጥ εἰς τοὺς αἰῶνας ማብቂያ የሌለውን ቆይታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: ይነግሣል
  rationale: የወደፊት ጊዜ የንጉሣዊ አገዛዝ ተግባርን ያመለክታል፤ «ይነግሣል» ይህን ትርጉም በተፈጥሯዊና በክብር ያለው አማርኛ ያስተላልፋል።
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: በያዕቆብ ቤት ላይ
  rationale: ἐπί ከተሳቢ ቅጽ ጋር በዚህ ዐውድ «በ…ላይ» ያለውን የግዛት ግንኙነት ያሳያል። «የያዕቆብ ቤት» የሚለው ቃል ኪዳናዊና ማኅበራዊ አገላለጽ ሳይሰፋ ተጠብቋል።
- source_word: εἰς τοὺς αἰῶνας
  choice: ለዘላለም
  rationale: የግሪኩ ፈሊጥ ማብቂያ የሌለውን ቆይታ ያመለክታል፤ «ለዘላለም» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው። ቃል በቃል አማራጮቹ በማስታወሻው ቀርበዋል።
- source_word: βασιλείας
  choice: መንግሥቱ
  rationale: βασιλεία ንግሥናን፣ አገዛዝን ወይም መንግሥትን ሊያመለክት ይችላል። «ፍጻሜ አይኖረውም» ከሚለው ጋር «መንግሥቱ» ተፈጥሯዊ ሲሆን የንጉሣዊውን ግዛትና ዘላቂነት ይጠብቃል።
- source_word: οὐκ ἔσται τέλος
  choice: ፍጻሜ አይኖረውም
  rationale: የመኖር ግስ ያለበትን አሉታዊ የወደፊት ጊዜ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ የማያበቃ መሆኑንም በግልጽ ይገልጣል።
theological_decisions:
- issue: የ«ያዕቆብ ቤት» ወሰን
  choice: «በያዕቆብ ቤት ላይ» የሚለው አገላለጽ ሳይሰፋ ተጠብቋል።
  alternative: «በእስራኤል ሕዝብ ላይ» ወይም «በእግዚአብሔር ሕዝብ ላይ»
