- issue: የንግሥናው ቆይታ
  choice: «ለዘላለም» እና «መንግሥቱም ፍጻሜ አይኖረውም»
  alternative: «ለዘመናት» ወይም «እስከ ዘመናት»
  rationale: ሁለቱ የግሪክ አገላለጾች አንድ ላይ ሆነው ማብቂያ የሌለውን ንግሥናና መንግሥት ያሳያሉ። «ለዘላለም» ይህን ኃይል ሳያዳክም በቀላሉ ያስተላልፋል።
