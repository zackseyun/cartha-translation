  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: am
  text: እነሆ፣ ዘመድሽ ኤልሳቤጥም በእርጅናዋ ወንድ ልጅ ፀንሳለች፤ መካን ለምትባለውም ይህ ስድስተኛ ወርዋ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአድማጩን ትኩረት ወደሚከተለው አስደናቂ ዜና የሚጠራ ተፈጥሯዊና ክብር ያለው የአማርኛ አገላለጽ ነው።
- source_word: συγγενίς
  choice: ዘመድሽ
  rationale: ቃሉ የዝምድናውን ትክክለኛ ደረጃ አይገልጽም፤ ‘ዘመድ’ ያንን አሻሚነት ይጠብቃል።
- source_word: συνείληφεν υἱὸν
  choice: ወንድ ልጅ ፀንሳለች
  rationale: መፀነሷንና ፅንሱ ወንድ መሆኑን በቀጥታ ያስተላልፋል።
- source_word: ἐν γήρει αὐτῆς
  choice: በእርጅናዋ
  rationale: የግሪኩን ቀጥተኛ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: መካን ተብላ ለነበረችው
  rationale: ‘ትባል ለነበረችው’ ከሚለው ቃል በቃል አገላለጽ ይልቅ ተፈጥሯዊ ሲሆን፣ ይህ ስያሜ ከመፀነሷ በፊት ይሠራባት እንደነበር ያሳያል።
theological_decisions:
- issue: የኤልሳቤጥ ከማርያም ጋር ያላት የዝምድና ደረጃ
  choice: ዘመድሽ
  alternative: የአክስት ልጅሽ / የወንድም ወይም የእኅት ልጅሽ
  rationale: συγγενίς አጠቃላይ የሴት ዘመድን ያመለክታል፤ ምንጩ ያልወሰነውን የዝምድና ደረጃ መወሰን አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የትኩረት ጥሪ ‘እነሆ’ ተጠብቋል፤ የዝምድናው ደረጃ ግን ምንጩ እንዳልወሰነው ሳይገደብ ቀርቷል።
