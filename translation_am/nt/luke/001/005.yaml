  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: am
  text: በይሁዳ ንጉሥ በነበረው በሄሮድስ ዘመን፣ የአብያ የካህናት ምድብ[a] አባል የነበረ ዘካርያስ የሚባል አንድ ካህን ነበር፤ ከአሮን ዘር[b] የሆነች ሚስትም ነበረችው፣ ስሟም ኤልሳቤጥ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የአብያ የካህናት ምድብ” ለቤተ መቅደስ አገልግሎት ከተደራጁት የካህናት ቡድኖች አንዱን ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ከአሮን ሴት ልጆች።” ግሪኩ ቃል በቃል “ከአሮን ሴት ልጆች” ይላል፤ ይህም የካህናት የዘር ሐረግን የሚያመለክት አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: በ… ዘመን … ነበር
  rationale: የግሪኩን ትረካ መክፈቻና የጊዜ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: በይሁዳ ንጉሥ በሄሮድስ ዘመን
  rationale: ሄሮድስን በሹመቱና በግዛቱ ይለያል፤ Ἰουδαία በዚህ ታሪካዊ አውድ ‘ይሁዳ’ ተብሏል።
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: ዘካርያስ የሚባል አንድ ካህን
  rationale: τις ያለውን ያልተወሰነ መግቢያ ‘አንድ’ ያሳያል፤ ὀνόματι ደግሞ በተፈጥሯዊው ‘የሚባል’ ተተርጉሟል።
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: ከአብያ የካህናት ክፍል የሆነ
  rationale: ἐφημερία ለቤተ መቅደስ አገልግሎት ከተደራጁት የካህናት ቡድኖች አንዱን ያመለክታል፤ ‘የካህናት ክፍል’ ተቋማዊ ትርጉሙን ግልጽ ያደርጋል።
- source_word: γυνὴ αὐτῷ
  choice: ሚስት ነበረችው
  rationale: የባለቤትነት ዳቲቩን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: ከአሮን ሴት ልጆች ወገን
  rationale: ‘ሴት ልጆች’ የሚለውን የግሪክ ምስላዊ የዘር አገላለጽ ይጠብቃል፤ ‘ወገን’ የትውልድ ግንኙነቱን በአማርኛ ግልጽ ያደርጋል።
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: ስሟም ኤልሳቤጥ ነበር
  rationale: መደበኛውን የስም መግለጫ በተፈጥሯዊና በክብር ባለው አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የኤልሳቤጥ የካህናት ዘር አገላለጽ
  choice: ከአሮን ሴት ልጆች ወገን
  alternative: ከአሮን ዘሮች ወገን
  rationale: ግሪኩ ‘የአሮን ሴት ልጆች’ የሚለውን ተጨባጭ የቤተሰብ አገላለጽ ይጠቀማል። ይህን ማቆየት የካህናት የዘር ሐረግ አጽንዖቱን ይጠብቃል፤ ‘ዘሮች’ ግን ትርጉሙን ይገልጻል እንጂ የመነሻውን ምስላዊ ቃል አያቆይም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አንድ ረጅም ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ቀርቧል፤ የአገናኝ ቅንጣቶቹ ግን ተጠብቀዋል።
