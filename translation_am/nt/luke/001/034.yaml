  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: am
  text: ማርያም ግን ለመልአኩ፣ “ወንድን ስለማላውቅ[a]፣ ይህ እንዴት ይሆናል?” አለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድን ስለማላውቅ” የሚለው፣ በይበልጥ ፈሊጣዊ አነጋገር፣ “ከወንድ ጋር የጾታ ግንኙነት ስላልፈጸምኩ” ማለት ነው። በግሪክ “ወንድን ማወቅ” የጾታ ግንኙነትን በጨዋነት የሚገልጽ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: የመልአኩን ማስታወቂያ ተከትሎ የማርያምን ጥያቄ እንደ ትንሽ የንግግር ተቃርኖ ያቀርባል፤ በአማርኛም ተፈጥሯዊ ነው።
- source_word: Μαριὰμ
  choice: ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: πρὸς τὸν ἄγγελον
  choice: መልአኩን
  rationale: የአማርኛው ‘አለው/አለችው’ አወቃቀር ተናጋሪው የሚናገረውን ተቀባይ በቀጥታ ተሳቢ ማቅረብን ይፈቅዳል፤ በዚህ የሉቃስ አውድ ‘መልአክ’ ሰማያዊ ፍጡርን በግልጽ ያመለክታል።
- source_word: Πῶς ἔσται τοῦτο
  choice: ይህ እንዴት ይሆናል?
  rationale: የግሪኩን ቀላል የወደፊት ጥያቄና የቃላቱን ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያቆያል።
- source_word: ἐπεὶ
  choice: ስለማላውቅ
  rationale: ምክንያታዊ ግንኙነቱን ‘ስለ-’ በሚለው ቅጥያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄνδρα οὐ γινώσκω
  choice: ወንድ ስለማላውቅ
  rationale: ‘ማወቅ’ የሚለውን የግሪክ የጨዋነት ፈሊጥ በዋናው ጽሑፍ ያቆያል፤ ‘ወንድ’ ከ‘ባል’ ይልቅ የἀνήρን እዚህ ያለውን ሰፊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: የማርያም ንግግርና የኢየሱስ መፀነስ
  choice: ‘ወንድ ስለማላውቅ’ የሚለውን የምንጭ ፈሊጥ በዋናው ጽሑፍ ማቆየት
  alternative: ‘ከወንድ ጋር ግንኙነት ስላልነበረኝ’ ወይም ‘ድንግል ስለሆንኩ’
  rationale: ግሪኩ የጾታ ግንኙነትን በጨዋነት ‘ወንድን አላውቅም’ ብሎ ይገልጻል። ቀጥተኛውን ፈሊጥ ማቆየት የማርያምን የጾታ ልምድ አለመኖር ያመለክታል፣ ነገር ግን ግሪኩ በቀጥታ ያልተናገረውን በዋና ጽሑፍ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የምንጩ የጨዋነት ፈሊጥ በዋናው ጽሑፍ ተጠብቆ፣ ዘመናዊው ፈሊጣዊ ትርጉም በማስታወሻ ተብራርቷል።
