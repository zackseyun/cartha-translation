    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «በአባቱ ስም ዘካርያስ ብለው ሊሰይሙት ነበር።» ይህ ልጅን በቤተሰብ አባል ስም የመሰየምን ልማድ ያመለክታል።
    reason: cultural_note
