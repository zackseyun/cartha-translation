  rationale: የመዝሙሩ የሁኔታ መገለባበጥ ሐሳብ ዝቅተኛ ማኅበራዊ ሁኔታን ያጎላል፤ ቃሉ ግን የልብ ትሕትናንም ሊያመለክት ስለሚችል ትርጉሙ ይህን ውጥረት አይዘጋም።
