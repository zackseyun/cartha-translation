  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: am
  text: መልአኩም እንዲህ አላት፦ “ማርያም ሆይ፣ አትፍሪ፤ በእግዚአብሔር ዘንድ ሞገስ[a] አግኝተሻልና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ጸጋ”፤ χάρις የሚለው የግሪክ ስም “ጸጋ” ወይም “ሞገስ” ማለት ሊሆን ይችላል። እዚህ ግን “በእግዚአብሔር ዘንድ ሞገስ ማግኘት” ከሚለው ፈሊጣዊ አገላለጽ ጋር “ሞገስ” ይበልጥ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: እንዲህ አላት
  rationale: የግሪኩን ቀላል የትረካ ግስ በቀጥተኛ ንግግር ፊት ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἄγγελος
  choice: መልአኩ
  rationale: በሉቃስ የልደት ትረካ ውስጥ የሰማያዊ ፍጡርን ስለሚያመለክት፣ ከአጠቃላዩ ‘መልእክተኛ’ ይልቅ ‘መልአክ’ ትክክለኛና የተለመደ ነው።
- source_word: Μὴ φοβοῦ
  choice: አትፍሪ
  rationale: የግሪኩን ክልከላ በጾታዋ የተስማማ፣ አጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: Μαριάμ
  choice: ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: εὗρες
  choice: አግኝተሻል
  rationale: የተፈጸመው ድርጊት አሁን ያለውን ውጤት እንደሚያመጣ በአማርኛ ፍጹም ጊዜ በተፈጥሯዊነት ይገልጣል።
- source_word: χάριν
  choice: ሞገስ
  rationale: ‘በአንድ ሰው ዘንድ ሞገስ ማግኘት’ የሚለውን የግሪክ ፈሊጣዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ጸጋ’ የሚለው ሌላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: παρὰ τῷ θεῷ
  choice: በእግዚአብሔር ዘንድ
  rationale: ከ‘ሞገስ ማግኘት’ ጋር የሚሄድ፣ በእግዚአብሔር ፊት ወይም እይታ የሚለውን ግንኙነታዊ ፍቺ የሚገልጽ የተለመደ የአማርኛ ፈሊጥ ነው።
theological_decisions:
- issue: በማርያም አውድ χάριν የሚለውን ቃል መተርጎም
  choice: ሞገስ
  alternative: ጸጋ
  rationale: εὑρίσκω χάριν παρά የሚለው አገላለጽ ‘በአንድ ሰው ዘንድ ሞገስ ማግኘት’ የሚል የተለመደ ፈሊጥ ነው። ‘ሞገስ’ የሚለው ምርጫ የግሪኩን ግንኙነታዊ ፍቺ ያስቀድማል፣ በኋላ የተፈጠሩ የእምነት አቀራረቦችንም በጥቅሱ ላይ አይጭንም፤ የቃሉ ሌላው እውነተኛ ፍቺ ‘ጸጋ’ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ማርያም ሆይ’ የቀጥታ ጥሪውን በተፈጥሯዊና ክቡር መንገድ ያሳያል።
