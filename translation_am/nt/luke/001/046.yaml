    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል አያያዥ በተፈጥሯዊው የአማርኛ ቅጥያ -ም በመተርጎም የትረካውን ፍሰት ይጠብቃል።
- source_word: εἶπεν
  choice: እንዲህ አለች
  rationale: የንግግሩን መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የማርያምን ጾታም ያሳያል።
- source_word: Μαριάμ
  choice: ማርያም
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠብቃል።
- source_word: Μεγαλύνει
  choice: ታከብራለች
  rationale: μεγαλύνω እዚህ አንድን ነገር በመጠን ማሳደግ ሳይሆን ታላቅነቱን በማወጅ ማክበርና ማወደስን ያመለክታል። የአሁን ጊዜውም ተጠብቋል።
- source_word: ἡ ψυχή μου
  choice: ነፍሴ
  rationale: የግሪኩን ግጥማዊና ሰውነታዊ-መንፈሳዊ አገላለጽ ሳያጠፋ በተፈጥሯዊ አማርኛ ያቀርባል፤ ወደ ‘እኔ’ ብቻ አያቃልለውም።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: κύριος በዚህ የውዳሴ አውድ ለእግዚአብሔር የተሰጠ የክብር ማዕረግ ስለሆነ ‘ጌታ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: በዚህ መዝሙራዊ አውድ κύριος ወደ እግዚአብሔር የሚያመለክት የክብር ማዕረግ ነው፤ ‘ባለቤት’ ሕጋዊ ወይም ማኅበራዊ ግንኙነትን ከልክ በላይ ሊያጠብ ይችላል።
- issue: የἡ ψυχή μου ሰውነታዊ አገላለጽ
  choice: ነፍሴ
  alternative: እኔ / ውስጣዊ ማንነቴ
  rationale: ‘ነፍሴ’ የጽሑፉን ግጥማዊ ውጥረትና ሆን ተብሎ የተመረጠውን የψυχή ቃል ይጠብቃል፤ ወደ ተራ ተውላጠ ስም ወይም ወደ ዘመናዊ ሥነ ልቦናዊ ትርጓሜ አይቀንሰውም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝሙሩን ግጥማዊ ቃና ለመጠበቅ ‘ነፍሴ’ ተይዟል፤ ‘ታከብራለች’ ደግሞ የμεγαλύνειን የውዳሴ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
