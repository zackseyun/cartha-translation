- source_word: κέρας σωτηρίας
  choice: የመዳን ቀንድ
  rationale: ቀንድን የኃይልና የድል ምስል አድርጎ የሚጠቀመውን ሴማዊና መጽሐፍ ቅዱሳዊ ዘይቤ ሳያደበዝዝ ይጠብቃል።
- source_word: ἡμῖν
  choice: ለእኛ
  rationale: የድርጊቱ ተጠቃሚዎች እኛ መሆናችንን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: በዳዊት ቤት
  rationale: ‘ቤት’ የዳዊትን ዘርና ሥርወ መንግሥት የሚያመለክት ቢሆንም፣ የግሪኩን ምስልና ከዳዊት ቃል ኪዳን ጋር ያለውን ትስስር ለመጠበቅ ‘ቤት’ ተብሎ ቀርቧል።
- source_word: παιδὸς αὐτοῦ
  choice: በአገልጋዩ
  rationale: παῖς እዚህ ዳዊትን ከእግዚአብሔር ጋር ባለው የአገልጋይነት ግንኙነት ይገልጻል፤ ‘ልጅ’ ወይም ‘ሕፃን’ የሚለው በዚህ አውድ አሳሳች ይሆናል።
theological_decisions:
- issue: κέρας σωτηρίας የሚለውን ዘይቤ መጠበቅ ወይስ ‘ኃያል አዳኝ’ ብሎ መተርጎም
  choice: ዋናው ጽሑፍ ‘የመዳን ቀንድ’ የሚለውን ምስል ይጠብቃል።
  alternative: ኃያል አዳኝ
  rationale: የግሪኩ ሐረግ በብሉይ ኪዳን የንጉሣዊ ኃይልና የድል ማዳን ምስል የሆነውን ‘ቀንድ’ በቀጥታ ይጠቀማል። ይህን መጠበቅ ሥነ ጽሑፋዊና ሥነ መለኮታዊ ትስስሩን ያቆያል፤ ግልጽ ትርጉሙ ግን በግርጌ ማስታወሻ ተሰጥቷል።
