lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: መልሳ … አለች
  rationale: የግሪኩን የቀደመ ግስ አገባብ ይጠብቃል፤ በዘመናዊ አማርኛም ቀጥተኛ ንግግርን ለማስገባት ተፈጥሯዊ ነው።
- source_word: μήτηρ αὐτοῦ
