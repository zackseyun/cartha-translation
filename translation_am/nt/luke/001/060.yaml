- source_word: κληθήσεται
  choice: ይባላል
  rationale: የκαλέωን የወደፊት ጊዜ ተደራጊ ቅርጽና በስም የመጠራት ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἰωάννης
  choice: ዮሐንስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይጠቀማል።
