  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የማህፀንሽ ፍሬ» የምንጩን ዘይቤና የበረከቱን ትይዩነት ይጠብቃል።
