base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: am
  text: በታላቅ ድምፅ ጮኸችና[a] እንዲህ አለች፦ “አንቺ ከሴቶች መካከል የተባረክሽ ነሽ፤ የማህፀንሽም ፍሬ የተባረከ ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በታላቅ ጩኸት እንዲህ አለች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: ጮኸችና
  rationale: ግሱ በከፍተኛ ድምፅ መናገርን ወይም መጣራትን ያመለክታል። «ጮኸች» የንግግሩን ኃይል ይጠብቃል፤ በዐውዱም የጭንቀት ጩኸት እንደሆነ አያስገድድም።
- source_word: κραυγῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የአነጋገሩን ሁኔታና ከፍተኛ መሰማቱን በተፈጥሯዊ አማርኛ ያሳያል። «በታላቅ ጩኸት» የሚለውም ቀጥተኛ አማራጭ ነው።
- source_word: Εὐλογημένη
  choice: የተባረክሽ ነሽ
  rationale: ፍጹም ተደራጊ ቦዝ አንቀጹን እንደ ትንቢታዊ የበረከት ንግግር ይገልጻል፤ «ሞገስ ያገኘሽ» ብሎ ወደ ሌላ የቃላት መስክ አያዛውረውም።
- source_word: ἐν γυναιξίν
  choice: ከሴቶች መካከል
  rationale: ማርያም ከሴቶች ጋር በሚደረግ ንጽጽር የተለየች መሆኗን ያሳያል፤ በግሪኩ የሌለውን «ሁሉ» አይጨምርም።
- source_word: εὐλογημένος
  choice: የተባረከ ነው
  rationale: ከማርያም ጋር የተነገረውን የበረከት ቀመር በትይዩ ይጠብቃል።
- source_word: ὁ καρπὸς
  choice: ፍሬ
  rationale: የምንጩን ዘይቤያዊ ቃል በግልጽና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይጠብቃል፤ «ልጅ» ከሚለው ይልቅ ለጽሑፉ ቅርብ ነው።
- source_word: τῆς κοιλίας σου
  choice: የማህፀንሽ
  rationale: በእርግዝናው ዐውድ κοιλία በትክክል ማህፀንን ያመለክታል፤ የእናትነትን ምስልም ይጠብቃል።
theological_decisions:
- issue: ለማርያም የተነገረውን የበረከት ቀመር መተርጎም
  choice: አንቺ ከሴቶች መካከል የተባረክሽ ነሽ
  alternative: አንቺ ከሴቶች መካከል ተባርከሻል
  rationale: የኤልሳቤጥን የበረከት አዋጅ ይጠብቃል፤ የማርያምን ሚና ከጽሑፉ በላይ ሳያሰፋ ወይም ሳያሳንስ የግሪኩን አነጋገር ያቀርባል።
