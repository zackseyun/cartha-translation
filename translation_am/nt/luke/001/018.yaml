base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: am
  text: ዘካርያስም መልአኩን፣ “ይህን እንዴት አውቃለሁ? እኔ ሽማግሌ ነኝ፤ ሚስቴም በዕድሜዋ ገፍታለች[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በቀኖቿ ገፍታለች።” ይህ የግሪክ አነጋገር በዕድሜ መግፋትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... πρὸς τὸν ἄγγελον
  choice: መልአኩን ... አለው
  rationale: በአማርኛ የንግግሩን ተቀባይ በተሳቢ አመልካች ከ‘አለው’ ጋር መግለጽ ተፈጥሯዊ ሲሆን የግሪኩን ትርጉም በትክክል ያስተላልፋል።
- source_word: Κατὰ τί γνώσομαι τοῦτο
  choice: ይህን እንዴት አውቃለሁ?
  rationale: ጥያቄው የሚጠይቀው የማወቂያውን መሠረት ወይም መንገድ ነው፤ ‘እንዴት አውቃለሁ?’ የወደፊት ማወቅን ሳያዛባ በተፈጥሯዊ አማርኛ ይገልጠዋል።
- source_word: πρεσβύτης
  choice: ሽማግሌ
  rationale: እዚህ ቃሉ በዕድሜ የገፋን ወንድ ያመለክታል እንጂ ሃይማኖታዊ ሹመትን አይደለም፤ ‘ሽማግሌ’ በዐውዱ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἡ γυνή μου
  choice: ሚስቴ
  rationale: ባለቤትነትን ከሚገልጸው ‘μου’ እና ከዐውዱ ጋር ‘γυνή’ በግልጽ ሁኔታ ‘ሚስት’ ማለት ነው።
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: በዕድሜዋ ገፍታለች
  rationale: የግሪኩ ቃል በቃል ‘በቀኖቿ ገፍታለች’ የሚል የእርጅና ፈሊጥ ነው። ‘በዕድሜዋ ገፍታለች’ በዘመናዊ አማርኛ ግልጽና ክብር ያለው ሲሆን የመገፋቱን ምስል ይጠብቃል።
theological_decisions:
- issue: የἄγγελος አተረጓጎም
  choice: መልአክ
  alternative: መልእክተኛ
  rationale: ἄγγελος በአጠቃላይ ‘መልእክተኛ’ ሊል ቢችልም፣ በቅርብ ዐውዱ የሚናገረው ገብርኤል ስለሆነ ‘መልአክ’ ዐውዳዊውን ትርጉም ያለ ተጨማሪ የእምነት ትርጓሜ ያስተላልፋል።
