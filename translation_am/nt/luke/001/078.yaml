id: LUK.1.78
reference: Luke 1:78
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: am
  text: በአምላካችን ርኅራኄ በተሞላ ምሕረት ምክንያት፣ በዚህም ከላይ የሚመጣው ንጋት[a] ይጎበኘናል፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የፀሐይ መውጫ» ወይም «ንጋት»፤ ἀνατολή በግሪክ ብሉይ ኪዳን «ቡቃያ» ከሚለው መሲሐዊ ማዕረግ ጋርም ሊያስተጋባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: ምክንያት
  rationale: ከውንድ ተሳቢ ጋር የመጣው διά ምክንያትን ወይም መሠረትን ያመለክታል፤ «ምክንያት» ይህን የምክንያት ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σπλάγχνα ἐλέους
  choice: ርኅራኄ የተሞላ ምሕረት
  rationale: ቃል በቃል «የምሕረት አንጀት» ማለት ቢሆንም፣ አገላለጹ ከውስጥ የሚመነጭ ጥልቅ ርኅራኄን ያመለክታል፤ የተመረጠው አገላለጽ ጥልቀቱንና የምሕረትን ሐሳብ በዘመናዊ አማርኛ ይጠብቃል።
- source_word: θεοῦ ἡμῶν
  choice: የአምላካችን
  rationale: የባለቤትነት ዝምድናውን በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν οἷς
  choice: በ…ምክንያት
  rationale: አንጻራዊው ሐረግ ወደ አምላክ ርኅራኄና ምሕረት ይመለሳል፤ የጉብኝቱን መሠረት በአማርኛ በተዋሐደ ሐረግ ያሳያል።
- source_word: ἐπισκέψεται
  choice: ይጎበኘናል
  rationale: የወደፊት ጊዜ ቅርጹንና የመለኮታዊ ጉብኝት ቃላዊ ትስስሩን ይጠብቃል፤ የማዳን እርዳታውን አውዱ እንዲገልጠው ይተዋል።
- source_word: ἀνατολὴ
  choice: ንጋት
  rationale: ቀጣዩ ቁጥር ስለሚያበራ ብርሃን ስለሚናገር፣ የንጋት/የፀሐይ መውጫ ምስል በአውዱ ዋና ነው። «ንጋት» ተፈጥሯዊና ግጥማዊ ሲሆን የቃሉን ሌላ መሲሐዊ ድምፅ በማስታወሻ ለማቆየት ያስችላል።
- source_word: ἐξ ὕψους
  choice: ከላይ
  rationale: የሰማያዊውን ከፍታ የሚያመለክተውን አገላለጽ ሳይጨምር በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በመሲሐዊ አውድ የἀνατολή ትርጉም
  choice: በዋናው ጽሑፍ «ንጋት» ተብሎ ተተርጉሟል።
  alternative: «የፀሐይ መውጫ»፣ «ቡቃያ» ወይም «የሚወጣው»
  rationale: በቁጥር 78–79 ያለው የብርሃንና የጨለማ አውድ «ንጋት» የሚለውን ትርጉም ይደግፋል። ሆኖም ቃሉ በግሪክ ብሉይ ኪዳን ያለውን «ቡቃያ» የተባለ መሲሐዊ ማዕረግ ሊያስተጋባ ስለሚችል፣ ይህ ድምፅ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ርኅራኄ የተሞላ ምሕረት» የግሪኩን ጥልቅ ስሜታዊ ፈሊጥ ያለ ጥሬ አካላዊ አገላለጽ ያስተላልፋል።
