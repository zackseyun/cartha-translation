revisions:
- from: በአምላካችን ርኅራኄ የተሞላ ምሕረት ምክንያት፣ ከላይ የሚወጣው ንጋት[a] ይጎበኘናል፤
  to: በአምላካችን ርኅራኄ በተሞላ ምሕረት ምክንያት፣ በዚህም ከላይ የሚመጣው ንጋት[a] ይጎበኘናል፤
  rationale: The revision separately reflects the causal διὰ (“ምክንያት”) and the relative ἐν οἷς (“በዚህም”), improves Amharic grammatical flow, and renders the dawn as coming from on high rather than defining it as rising there. The footnote retains the source-supported lexical ambiguity without making a doctrinal decision in the main text.
