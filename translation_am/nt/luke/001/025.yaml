  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: am
  text: “ጌታ በተመለከተኝ ቀናት ውስጥ፣ በሰዎች ዘንድ የነበረብኝን ውርደት[a] ሊያስወግድ፣ እንዲህ አድርጎልኛል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነቀፋ” ወይም “እፍረት።” የግሪኩ ቃል በተለይ በሰዎች ዘንድ የሚደርስን ውርደትና ክብር ማጣት ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: የቀጥታ ንግግር መክፈቻ ምልክት
  rationale: በቁጥር 24 ካለው ‘እንዲህ እያለች’ ጋር ተያይዞ ὅτι ንግግሩን ያስገባል፤ ስለዚህ ‘ምክንያቱም’ ብሎ ከመተርጎም ይልቅ በጥቅስ ምልክት ተወክሏል።
- source_word: Οὕτως
  choice: እንዲህ
  rationale: የድርጊቱን አኳኋንና አመልካች አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μοι πεποίηκεν
  choice: አደረገልኝ
  rationale: የግሪኩን ሰፊ ‘አደረገ’ ትርጉምና ለተናጋሪዋ የተደረገላትን ግላዊ ተግባር ያሳያል።
- source_word: κύριος
  choice: ጌታ
  rationale: እዚህ ኤልሳቤጥ የእግዚአብሔርን ድርጊት በማመልከት የተጠቀመችበትን ማዕረግ ይጠብቃል።
- source_word: ἐν ἡμέραις αἷς ἐπεῖδεν
  choice: በተመለከተኝ ጊዜ
  rationale: የግሪኩን ጊዜያዊ ግንኙነትና ትኩረት ሰጥቶ የማየት ምስል በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ቀናት’ የሚለው ሰምቲክ ይዘት በ‘ጊዜ’ ተወክሏል።
- source_word: ἀφελεῖν
  choice: ሊያስወግድ
  rationale: የማስወገድን ዓላማ በግልጽ ሁኔታ ይገልጣል።
- source_word: ὄνειδός μου
  choice: የነበረብኝን ውርደት
  rationale: ὄνειδος በሰዎች ዘንድ የሚደርስን ክብር ማጣትና ማኅበራዊ ነውር ያመለክታል፤ ‘የነበረብኝን’ ደግሞ ይህ በእሷ ላይ የተጫነ ማኅበራዊ ውርደት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν ἀνθρώποις
  choice: በሰዎች ዘንድ
  rationale: ጾታን ሳይወስን ውርደቱ የነበረበትን ማኅበራዊ ክበብ ያሳያል።
theological_decisions:
- issue: የκύριος ተመላካች
  choice: ጌታ የሚለው እግዚአብሔርን ያመለክታል።
  alternative: በዚህ አውድ ዋና አማራጭ የለም።
  rationale: ኤልሳቤጥ መካንነቷንና ከእሱ የመጣውን ማኅበራዊ ውርደት ስላስወገደላት የእግዚአብሔርን ድርጊት ትናገራለች።
- issue: የὄνειδος ማኅበራዊ ትርጉም
  choice: ውርደት
  alternative: ነቀፋ፣ እፍረት
  rationale: አውዱ የሚያመለክተው ውስጣዊ ስሜትን ብቻ ሳይሆን መካንነት በሰዎች ዘንድ ያመጣውን ማኅበራዊ ክብር ማጣት ነው።
- issue: የὅτι አገባብ
  choice: የቀጥታ ንግግር መክፈቻ ተደርጎ ተወስዷል።
  alternative: ምክንያቱም
  rationale: በቁጥር 24 መጨረሻ ያለው λέγουσα (‘እንዲህ እያለች’) ὅτιን የጥቅስ መክፈቻ እንዲሆን ይደግፋል፤ ሆኖም የምክንያት አገባብ ሰዋሰዋዊ አማራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ ከቁጥር 24 ጋር እንዲያያዝ በጥቅስ ምልክት ቀርቧል።
