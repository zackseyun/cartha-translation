lexical_decisions:
- source_word: ἐνένευον
  choice: በምልክት ጠየቁት
  rationale: ግሱ በእጅ፣ በራስ ወይም በሌላ ምልክት መግባባትን ያመለክታል። በአማርኛ ‘በምልክት ጠየቁት’ የድርጊቱን መንገድና በዐውዱ ያለውን የጥያቄ ተግባር በተፈጥሯዊ አነጋገር ይገልጣል።
- source_word: δὲ
  choice: ስለዚህ
  rationale: እዚህ δέ ትረካውን ወደ ቀጣዩ ድርጊት የሚያሸጋግር ለስላሳ አያያዥ ነው፤ ‘ስለዚህ’ ከቀደመው ክፍል ጋር ያለውን የትረካ ፍሰት ያሳያል።
- source_word: τῷ πατρὶ αὐτοῦ
  choice: አባቱን
  rationale: የምልክቱ ተቀባይ የልጁ አባት መሆኑን በተፈጥሯዊ የአማርኛ ሰዋስው ይገልጣል።
- source_word: τὸ τί ἂν θέλοι
  choice: ምን ... እንደሚፈልግ
  rationale: ይህ ቀጥተኛ ያልሆነውን ጥያቄ ያስተላልፋል። ἄν ከኦፕታቲቭ ጋር ያለውን የእድል ወይም ለስላሳ ያልተወሰነነት ሙሉ በሙሉ በግድ ሳይጨምር፣ ተፈጥሯዊው አማርኛ የፈቃዱን ይዘት ያቀርባል።
- source_word: καλεῖσθαι αὐτό
  choice: ልጁ ... ተብሎ እንዲጠራ
  rationale: የግሪኩን ተደራጊ ቅርጽ ‘እንዲጠራ’ ይጠብቃል፤ αὐτό የሚያመለክተውን ሕፃንም በአማርኛ ግልጽነት ‘ልጁ’ ብሎ ይጠቅሳል።
