    text: ወይም፣ «ከእስራኤላውያን መካከል።» ግሪኩ ቃል በቃል «የእስራኤል ልጆች» ይላል፤ ይህም ባህላዊውን የኪዳን አገላለጽ ይጠብቃል።
    reason: lexical_alternative
