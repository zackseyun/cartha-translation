  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: am
  text: እንዲሁም ከእስራኤል ልጆች መካከል ብዙዎችን ወደ ጌታ አምላካቸው ይመልሳል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእስራኤላውያን መካከል።» ግሪኩ ቃል በቃል «የእስራኤል ልጆች» ይላል፤ ይህም ባህላዊውን የኪዳን አገላለጽ ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ በመተርጎም ከቀደመው ንግግር ጋር ያለውን ፍሰት ይጠብቃል።
- source_word: πολλοὺς
  choice: ብዙዎችን
  rationale: ቅጽሉ በስም ተግባር የተጠቀሰ ሲሆን፣ የግሱ ቀጥተኛ ተሳቢ መሆኑን የአማርኛው -ን ያሳያል።
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: ከእስራኤል ልጆች
  rationale: የቃል በቃል አወቃቀሩንና ባህላዊውን የኪዳን አገላለጽ ይጠብቃል፤ በአማርኛ «ልጆች» በዚህ የሕዝብ ስያሜ አገባብ ተፈጥሯዊ ነው።
- source_word: ἐπιστρέψει
  choice: ይመልሳል
  rationale: የወደፊት ጊዜውንና ዮሐንስ ሌሎችን እንዲመለሱ የሚያደርግ ወኪል መሆኑን ይጠብቃል፤ «ይለውጣል» ከሚለው የበለጠ የአቅጣጫ መመለስን ያሳያል።
- source_word: ἐπὶ
  choice: ወደ
  rationale: ከἐπιστρέφω ጋር ወደ አንድ ሰው የሚደረግን መመለስ ወይም አቅጣጫ መቀየር በግልጽ ያሳያል።
- source_word: κύριον
  choice: ጌታ
  rationale: እዚህ ቃሉ የእስራኤልን አምላክ ስለሚያመለክት «ጌታ» መለኮታዊውንና ኪዳናዊውን ክብደት ይጠብቃል።
- source_word: τὸν θεὸν αὐτῶν
  choice: አምላካቸው
  rationale: «ጌታ»ን በተጨማሪ የሚገልጸውን ኪዳናዊ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: τῶν υἱῶν Ἰσραὴλ የሚለው የኪዳን አገላለጽ
  choice: ከእስራኤል ልጆች
  alternative: ከእስራኤላውያን
  rationale: «የእስራኤል ልጆች» የሚለውን ቅዱስ ጽሑፋዊና ኪዳናዊ አገላለጽ ሳያጠፋ በአማርኛ ተፈጥሯዊ ያደርገዋል።
- issue: κύριον τὸν θεὸν αὐτῶν የሚያመለክተው
  choice: ጌታ አምላካቸው
  alternative: ጌታቸው ወደሆነው አምላክ
  rationale: ሐረጉ የሰው ጌታን ሳይሆን የእስራኤልን አምላክ እንደሚያመለክት ይጠብቃል፤ ሁለቱንም ስያሜዎች አንድ ተጠቃሽ ላይ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ከእስራኤልም ልጆች» የሚለው ቅደም ተከተል ከቀደመው ቁጥር ጋር ያለውን ትስስር ሲጠብቅ ባህላዊውን ቅዱስ ጽሑፋዊ ድምፅም ያቆያል።
