  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: am
  text: በዚያን ጊዜም የጌታ መልአክ በዕጣን መሠዊያው ቀኝ በኩል ቆሞ ታየለት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: ታየው
  rationale: የὁράω የአኦሪስት ተደራጊ ቅርጽ በዚህ ትረካ ውስጥ ‘ተገለጠለት/ታየው’ የሚል ኢ-ተሻጋሪ ትርጉም አለው። ‘ታየው’ በድንገት በዓይን መታየቱንና የታየለትን ሰው በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: በዚያን ጊዜም
  rationale: δὲ እዚህ የትረካውን ቀጣይነት ያመለክታል፤ ‘በዚያን ጊዜም’ ክስተቱን ከቀደመው ጋር በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: αὐτῷ
  choice: -ው (ታየው)
  rationale: የሦስተኛ መደብ ተቀባይ ቅጥያው αὐτῷ የሚያመለክተውን ‘ለእርሱ’ በአማርኛ ግስ ውስጥ በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ἄγγελος
  choice: መልአክ
  rationale: በቤተ መቅደስ ራእይ አውድ ውስጥ ቃሉ ሰማያዊ ፍጡርን ስለሚያመለክት ‘መልአክ’ ተገቢ ነው።
- source_word: κυρίου
  choice: የጌታ
  rationale: የባለቤትነት ግንኙነቱን ‘የጌታ መልአክ’ በሚለው የተለመደ እና ግልጽ አገላለጽ ይጠብቃል።
- source_word: ἑστὼς
  choice: ቆሞ
  rationale: የἵστημι ፍጹም አንቀጽ በመገለጡ ጊዜ የመልአኩን አቋቋምና ቦታ ይገልጣል፤ ‘ቆሞ’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ δεξιῶν
  choice: ቀኝ በኩል
  rationale: የግሪኩ ፈሊጥ በአንድ ነገር ቀኝ ጎን ያለ ቦታን ያመለክታል፤ ‘ቀኝ በኩል’ ግልጽና ዘመናዊ ነው።
- source_word: θυσιαστηρίου
  choice: መሠዊያው
  rationale: θυσιαστήριονን የሚወክለው መደበኛ የአማርኛ ቃል ‘መሠዊያ’ ነው፤ ተከታዩ ሐረግ የትኛው መሠዊያ እንደሆነ ይወስናል።
- source_word: τοῦ θυμιάματος
  choice: የዕጣን
  rationale: የዘር ሐረጉ መሠዊያውን የዕጣን መሠዊያ ብሎ ይለየዋል፤ ‘የዕጣን መሠዊያ’ ትክክለኛና የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: κύριοςን በἄγγελος κυρίου ሐረግ ውስጥ መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የግሪኩን κύριος በቀጥታ ‘ጌታ’ ማለት የምንጩን የማዕረግ አጠቃቀም ይጠብቃል፤ ‘እግዚአብሔር’ በአውዱ ሊገባ ቢችልም ምንጩ ያለውን ልዩነት በትርጉም ደረጃ በግልጽ ሁኔታ ይወስናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል ሳይጫን፣ መልአኩ በመሠዊያው ቀኝ በኩል ቆሞ መታየቱ ግልጽ እንዲሆን ተደርጓል።
