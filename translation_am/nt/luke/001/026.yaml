lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: በስድስተኛው ወር
  rationale: ἐν ከመስጫ ቅጽ ጋር የጊዜ ማመልከቻ ስለሆነ ‘በስድስተኛው ወር’ ተብሏል። δέ ቀላል የትረካ ማያያዣ ሲሆን በአማርኛ የዓረፍተ ነገሩ ፍሰት በቂ ስለሆነ ተጨማሪ ‘እንግዲህ’ ወይም ‘ግን’ አልገባም።
- source_word: ἀπεστάλη
  choice: ተላከ
  rationale: የግሪኩን ተደራጊ ቅርጽና የመላክን ቀጥተኛ ፍቺ ይጠብቃል።
- source_word: ὁ ἄγγελος
  choice: መልአኩ
  rationale: በዚህ ትረካ ἄγγελος ሰማያዊ መልአክን ያመለክታል፤ የውስንነት አመልካቹም በ‘መልአኩ’ ተጠብቋል።
- source_word: Γαβριὴλ
  choice: ገብርኤል
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἀπὸ τοῦ θεοῦ
  choice: ከእግዚአብሔር
  rationale: ἀπό በዋናነት የመነሻውን ምንጭ ያመለክታል፤ ‘ከእግዚአብሔር’ ይህን ሳይለውጥ ይገልጣል።
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: ወደ ... የገሊላ ከተማ
  rationale: εἰς መድረሻን ‘ወደ’ በማለት ያሳያል፤ የባለቤትነት ቅርጹም ‘የገሊላ ከተማ’ ተብሎ በቅርብ ተጠብቋል።
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: ናዝሬት ወደምትባል
  rationale: ቃል በቃል ‘ስሟ ናዝሬት የሆነች’ ማለት ሲሆን፣ ‘ናዝሬት ወደምትባል’ በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ነው።
theological_decisions:
- issue: ‘ስድስተኛው ወር’ የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘በስድስተኛው ወር’ ብቻ ተብሎ ቀርቧል፤ በአውዱ የኤልሳቤጥን እርግዝና ያመለክታል።
  alternative: የዓመቱ ስድስተኛ ወር እንደሆነ መረዳት
  rationale: ሉቃስ 1፥24 እና 1፥36 አመልካቹ የኤልሳቤጥ እርግዝና መሆኑን ያሳያሉ፤ ግሪኩ ግን በዚህ ቁጥር ያንን በግልጽ ስለማይደግም ማብራሪያው በግርጌ ማስታወሻ ተቀምጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ተደራጊ አነጋገር ተጠብቋል፤ የአማርኛው ተፈጥሯዊ ቃል ቅደም ተከተል ለመጠበቅ የመነሻ ሐረጉ ‘ከእግዚአብሔር’ ከመድረሻው በኋላ ተቀምጧል።
