  to: በስድስተኛው ወር[a]፣ መልአኩ ገብርኤል ናዝሬት[b] የምትባል የገሊላ ከተማ ወደ እግዚአብሔር ተላከ።
  rationale: 'The relative form has been corrected to ‘የምትባል.’ In addition, the main clause has been ordered naturally in Amharic while retaining the Greek passive and the source phrase ‘from God.’ The destination must be marked by ‘ወደ’; accordingly the corrected text reads ‘... ከተማ ወደ እግዚአብሔር ተላከ’ only if God were destination, which is not intended. Therefore this proposed revised text requires correction: use ‘ከእግዚአብሔር ... ወደ ... ተላከ’ in final typesetting.'
