  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: am
  text: በስድስተኛው ወር[a]፣ መልአኩ ገብርኤል ናዝሬት[b] የምትባል የገሊላ ከተማ ወደ እግዚአብሔር ተላከ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም የኤልሳቤጥ እርግዝና ስድስተኛ ወር ማለት ነው፤ ሉቃስ 1፥24፣ 36ን ይመልከቱ።
    reason: cross_reference
  - marker: b
    text: ወይም፣ ‘በገሊላ የምትገኝ ናዝሬት የምትባል ከተማ።’
