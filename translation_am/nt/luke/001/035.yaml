source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: am
  text: መልአኩም መልሶ እንዲህ አላት፤ “መንፈስ ቅዱስ በአንቺ ላይ ይመጣል፤ የልዑልም ኃይል በላይሽ ጥላዋን ታደርጋለች። ስለዚህም የሚወለደው ቅዱስ[a] የእግዚአብሔር ልጅ[b] ተብሎ ይጠራል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚወለደው ቅዱስ ሕፃን።” የግሪኩ τὸ γεννώμενον በቃል በቃል “የሚወለደው” ወይም “የሚወለደው ነገር” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: “የእግዚአብሔር ልጅ” የሚለው በግሪኩ “ልጅ” ከሚለው በፊት የወሰን መስጫ የሌለውን ሐረግ ይተረጉማል፤ በዐውዱ ግን ሐረጉ እንደ ማዕረግ ያገለግላል እንጂ “አንድ ልጅ” የሚል ያልተወሰነ አባባል አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የግሪኩ ተሳቢ አንቀጽ ቅርጹ በዐውዱ ንቁ ትርጉም ስላለው፣ የምላሽን ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἄγγελος
  choice: መልአኩ
  rationale: በሉቃስ የልደት ትረካ ውስጥ የተጠቀሰው ሰማያዊ መልአክ ነው፤ ተራ ሰው መልእክተኛ አይደለም።
- source_word: Πνεῦμα ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: ሐረጉ የእግዚአብሔርን መንፈስ ያመለክታል፤ ይህም በአማርኛ የተለመደና ግልጽ አጠራር ነው።
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: በአንቺ ላይ ይመጣል
  rationale: የመለኮታዊውን ድርጊት ኃይለኛ አቅጣጫ በቀጥታ ያስተላልፋል።
- source_word: δύναμις Ὑψίστου
  choice: የልዑልም ኃይል
  rationale: Ὑψίστου የመለኮት ማዕረግ መሆኑን በ‘ልዑል’ ያቆያል፣ የዝምድናውንም ቅርጽ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπισκιάσει σοι
  choice: ይጋርድሻል
  rationale: የጥላና የሸፈነ መገኘትን ምስል በአጭርና ክቡር ቋንቋ ያቆያል፤ ጽሑፉ ያልገለጸውን አካላዊ ሂደት አያስገባም።
- source_word: διὸ καὶ
  choice: ስለዚህም
  rationale: የውጤትን አመክንዮና የκαὶን አጽንዖት በተፈጥሯዊ አማርኛ ያጣምራል።
- source_word: τὸ γεννώμενον
  choice: የሚወለደው
  rationale: የአሁን ጊዜ ተሳቢ አንቀጹን ‘የሚወለደው’ ብሎ በቅርብ ይተረጉማል፣ በዐውዱም ሕፃኑን እንደሚያመለክት ይገባል።
- source_word: ἅγιον
  choice: ቅዱስ
  rationale: ቃሉ የሚወለደውን እንደ ቅዱስ ይገልጻል፤ የግሪኩን አጭርና ትንሽ አሻሚ አገባብ ሳይፈታ ያቆያል።
- source_word: κληθήσεται
  choice: ተብሎ ይጠራል
  rationale: የወደፊት ጊዜ ተሳቢ ቅርጹን ያቆያል፣ ስያሜንም ሆነ የማንነት እውቅናን ለማመልከት ክፍት ይተዋል።
- source_word: υἱὸς θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: በዐውዱ የክርስቶስ ማዕረግ ነው። አማርኛ የእንግሊዝኛውን የተወሰነ አመልካች አይነት ስለማይፈልግ፣ ይህ ቅርጽ ማዕረጋዊውን ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: Πνεῦμα ἅγιον የግል መለኮታዊ አመልካች መሆኑ
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ / የተቀደሰ መንፈስ
  rationale: የሉቃስ ዐውድ መንፈሱን በኢየሱስ መፀነስ ውስጥ እንደሚሠራ መለኮታዊ አድራጊ ያቀርባል፤ ትርጉሙ ይህን ወደ ግላዊነት የሌለው ኃይል አያሳንስም።
- issue: υἱὸς θεοῦ በዐውዱ ማዕረጋዊ ኃይል መኖሩ
  choice: የእግዚአብሔር ልጅ
  alternative: አንድ የእግዚአብሔር ልጅ
  rationale: በግሪክ የወሰን መስጫ ባይኖርም ሐረጉ በዚህ ዐውድ ያልተወሰነ አባባል ሳይሆን ማዕረግ ነው፤ ‘አንድ’ ማከል ያልተፈለገ ትርጉም ያስገባል።
- issue: የመለኮታዊውን ድርጊት ወሲባዊ ወይም ሥነ ሕይወታዊ ትርጓሜ አለማድረግ
  choice: ይጋርድሻል
  alternative: ይሸፍንሻል / ጥላውን ይጥልብሻል
  rationale: ግሪኩ የመለኮታዊ መገኘትን ምሳሌያዊና ክቡር ቋንቋ ይጠቀማል፤ ትርጉሙም ይህን ገደብ ይጠብቃል።
- issue: τὸ γεννώμενον ἅγιον ያለውን ሰዋሰዋዊ ውጥረት መጠበቅ
  choice: የሚወለደው ቅዱስ
  alternative: የሚወለደው ቅዱስ ሕፃን / የሚወለደውም ቅዱስ ይባላል
  rationale: ግሪኩ ἅγιονን ከ‘የሚወለደው’ ጋር አያይዞ በአጭር ቅርጽ ያቀርባል። ትርጉሙ ‘ሕፃን’ን በዋናው ጽሑፍ ሳይጨምር የዐውዱን ግልጽነትና የምንጩን አሻሚነት ሚዛን ይጠብቃል።
