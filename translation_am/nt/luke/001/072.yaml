  source_fidelity: The two coordinated aorist infinitives are retained as purpose expressions. “ለአባቶቻችን ምሕረት ለማድረግ” appropriately conveys ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν, and “ቅዱስ ኪዳኑን” accurately represents διαθήκης ἁγίας αὐτοῦ. However, ማሰብ primarily means ‘to think/consider’ in current standard Amharic and is less exact for μνησθῆναι (‘to remember’). ማስታወስ is the clear, natural equivalent and still permits the covenantal-action implication to remain in the note rather than being inserted into the text.
