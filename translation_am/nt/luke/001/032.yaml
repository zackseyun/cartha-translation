lexical_decisions:
- source_word: οὗτος
  choice: እርሱ
  rationale: በቀደመው ንግግር የተገለጠውን ሕፃን ያመለክታል። ቀጥተኛው ‘ይህ’ ቢሆንም፣ ‘እርሱ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ማጣቀሻውን ይጠብቃል።
- source_word: ἔσται μέγας
  choice: ታላቅ ይሆናል
  rationale: የወደፊት ጊዜውንና μέγας ያለውን ሰፊ የክብርና የከፍታ ትርጉም ይጠብቃል።
- source_word: υἱὸς Ὑψίστου
  choice: የልዑል ልጅ
  rationale: ‘ልዑል’ የመለኮት መጠሪያውን ቅዱሳዊ ድምፅ ይጠብቃል፤ ሐረጉም እንደ ማዕረግ ቀርቧል።
- source_word: κληθήσεται
  choice: ተብሎ ይጠራል
  rationale: የወደፊት ተደራጊ አወቃቀሩንና የማዕረግ መሰየሙን በግልጽ አማርኛ ያሳያል።
- source_word: κύριος ὁ θεὸς
  choice: ጌታ አምላክ
  rationale: κύριοςን ‘ጌታ’ ብሎ ይተረጉማል፤ ግሪኩ ቴትራግራማቶኑን በቀጥታ ስለማያቀርብ ከዚያ በላይ አይወስንም።
- source_word: δώσει αὐτῷ
  choice: ይሰጠዋል
  rationale: ቀላሉን የወደፊት ጊዜ ግስና ተቀባዩን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν θρόνον Δαυὶδ
  choice: የዳዊትን ዙፋን
  rationale: የንጉሣዊ ተስፋውን ቋንቋ በቀጥታ ይጠብቃል።
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: የአባቱን
  rationale: πατήρ በዚህ የዘር ሐረግ አውድ ቀደምት አባትን ሊያመለክት ቢችልም፣ ቀጥተኛው ‘አባት’ ተጠብቋል።
theological_decisions:
- issue: υἱὸς Ὑψίστου የሚለው ክርስቶሎጂያዊ ማዕረግ
  choice: የልዑል ልጅ
  alternative: ከልዑል ልጆች አንዱ
  rationale: ሐረጉ በአውዱ ልዩ የንጉሣዊና የመለኮታዊ ማዕረግ ሆኖ ይሠራል፤ ትርጉሙ ይህን ኃይል ሳያዳክም ይጠብቃል።
- issue: κύριος የሚለው መጠሪያ
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: ምንጩ κύριος ይላል እንጂ ቴትራግራማቶኑን አያቀርብም፤ ‘ጌታ’ የግሪኩን ቅርጽ ሳያልፍ ያቀርባል።
- issue: ዳዊት ‘አባቱ’ መባሉ
  choice: የአባቱን የዳዊትን
  alternative: የቀድሞ አባቱን የዳዊትን
  rationale: ቀጥተኛውን የአባትነት ቃል በመጠበቅ የዳዊትን የንግሥና የዘር ሐረግ ግንኙነት ያቆያል፤ ማብራሪያው በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትንቢታዊው ንግግር ከፍ ያለ ድምፅ እና የዳዊት ንግሥና ቃላት ተጠብቀዋል።
