    issue: The phrase የአባቱን የዳዊትን ዙፋን has duplicated accusative marking and awkward genitive order.
    rationale: Only the complete object phrase should bear the accusative suffix. የአባቱ የዳዊትን ዙፋን naturally means “the throne of David, his father,” retaining the apposition and the source’s word order emphasis.
  - severity: low
    issue: ተብሎም ይጠራል is less economical than necessary.
    rationale: ይባላል naturally expresses “will be called” as a title in modern Amharic, with no loss of the Greek passive-designation sense.
