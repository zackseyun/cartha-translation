  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: am
  text: ለአንተም ደስታና ሐሴት ይሆናል፤ ብዙዎችም በመወለዱ[a] ደስ ይላቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በልደቱ ምክንያት።” የግሪኩ ሐረግ መወለዱ የደስታው አጋጣሚ ወይም ምክንያት መሆኑን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: ይሆናል
  rationale: የεἰμί የወደፊት ጊዜ ቅርጽ ሲሆን፣ የሚመጣውን ደስታና ሐሴት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: χαρά
  choice: ደስታ
  rationale: የተለመደና ግልጽ የአማርኛ አቻ ቃል ነው።
- source_word: σοι
  choice: ለአንተ
  rationale: ደስታውና ሐሴቱ የሚሆንለትን ሰው የሚያመለክተውን የግሪክ ዳቲቭ ያስተላልፋል።
- source_word: ἀγαλλίασις
  choice: ሐሴት
  rationale: ከχαρά ‘ደስታ’ ያለውን ልዩነት ጠብቆ ከፍ ያለ የደስታ መግለጫን ያስተላልፋል።
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: በስም ተግባር የገባውን የብዛት ቅጽል በአጭርና ተፈጥሯዊ መንገድ ይተረጉማል።
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: በእርሱ መወለድ
  rationale: ἐπί ከዳቲቭ ጋር የደስታውን አጋጣሚ ወይም ምክንያት ሊገልጥ ስለሚችል፣ ይህ አገላለጽ ሁለቱንም ንባቦች በተቻለ መጠን ክፍት ያደርጋል።
- source_word: χαρήσονται
  choice: ደስ ይላቸዋል
  rationale: የወደፊት ጊዜውንና ከχαρά ጋር ያለውን የቃል ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
