  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: am
  text: “የእስራኤል አምላክ ጌታ የተባረከ ይሁን፤ ሕዝቡን ጎብኝቶ[a] ለእነርሱ ቤዛ አድርጓልና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለመርዳት መጥቶ።” “ጎበኘ” የሚለው የግሪክ አገላለጽ እግዚአብሔር ለሕዝቡ በትኩረት ተመልክቶ ለመርዳት ጣልቃ መግባቱን የሚገልጽ ቅዱስ ጽሑፋዊ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: የተባረከ ይሁን
  rationale: የውዳሴ አዋጅ የሆነውን ቅጽል በተፈጥሯዊና ክብር ባለው የአማርኛ የቡራኬ አገላለጽ ያቀርባል።
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: የእስራኤል አምላክ ጌታ
  rationale: ‘ጌታ’ን እንደ መለኮታዊ ማዕረግ ይጠብቃል፤ የአማርኛው ቅደም ተከተልም ‘የእስራኤል አምላክ’ ለ‘ጌታ’ ገላጭ መሆኑን ያሳያል።
- source_word: ὅτι
  choice: -ና
  rationale: የውዳሴውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ መስተጻምር ያቀርባል።
- source_word: ἐπεσκέψατο
  choice: ጎብኝቶ
  rationale: የመለኮታዊ ጉብኝትን ቅዱስ ጽሑፋዊ ምስል ይጠብቃል፤ በዚህ ዐውድ ቃሉ በትኩረት መመልከትንና ለመርዳት ጣልቃ መግባትን ያመለክታል።
- source_word: ἐποίησεν λύτρωσιν
  choice: ቤዛነትን አድርጎለታል
  rationale: የግሪኩን ‘ቤዛነትን አደረገ’ የሚለውን አገባብ በቅርበት ሲጠብቅ፣ ተጠቃሚው ሕዝቡ መሆኑን በ‘-ለታል’ በግልጽ ያሳያል።
- source_word: λύτρωσιν
  choice: ቤዛነት
  rationale: ከእስራት ወይም ከባርነት በዋጋ የመፍታትን ሐሳብና የቃሉን መዳናዊ ክብደት ይጠብቃል።
- source_word: τῷ λαῷ αὐτοῦ
  choice: ሕዝቡን … አድርጎለታል
  rationale: የግሪኩን ተጠቃሚ የሚያመለክተውን ዳቲቭ በአማርኛው ‘-ለታል’ ያሳያል፤ ‘ሕዝቡን’ ደግሞ ከ‘ጎብኝቶ’ ጋር በተፈጥሯዊ ሁኔታ ይያያዛል።
theological_decisions:
- issue: የመለኮታዊ ጉብኝት አገላለጽ
  choice: ጎብኝቶ
  alternative: ሊረዳ መጥቶ
  rationale: ጽሑፉ የእግዚአብሔርን በትኩረት የተሞላ የማዳን ጣልቃ ገብነት በቅዱስ ጽሑፋዊ የጉብኝት ምስል ይናገራል። ትርጉሙ ምስሉን ሳያጠብ ይጠብቃል፤ አማራጩን ግን በማስታወሻ ያብራራል።
- issue: λύτρωσις የሚያመለክተው የማዳን ሐሳብ
  choice: ቤዛነት
  alternative: ነፃ መውጣት
  rationale: ‘ቤዛነት’ ከመከራና ከባርነት መዳንን ብቻ ሳይሆን የመቤዠትን የቃል ግንኙነትም ይጠብቃል፤ ከዚህ በላይ ግን የቤዛውን አሠራር በጽሑፉ ላይ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለአጠቃላይ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የውዳሴ ቅላፄውና የቅዱስ ጽሑፍ የ‘ጉብኝት’ ምስል ተጠብቀዋል።
