    reason: ἐν ἀγαλλιάσει የሚለው ከፍ ያለ የደስታ ወይም የሐሴት ስሜትን ያመለክታል፤ አማራጩ ይህን ይበልጥ ሥነ ጽሑፋዊ በሆነ ቃል ያቀርባል።
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: እነሆና
  rationale: እነሆ የተናጋሪዋን ትኩረት የሚስብ አገላለጽ ይጠብቃል፤ የተያያዘው -ና ደግሞ γὰρ ከቀደመው ንግግር ጋር ያለውን ማብራሪያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὡς ἐγένετο
  choice: በደረሰ ጊዜ
  rationale: የድምፁን መድረስና የሕፃኑን መዝለል በጊዜ የሚያገናኘውን አገላለጽ በግልጽና ተፈጥሯዊ ሁኔታ ይወክላል።
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: የሰላምታሽ ድምፅ
  rationale: φωνή እዚህ ላይ ወደ ጆሮ የደረሰውን የሚሰማ ድምፅ ያመለክታል፤ ሰላምታሽም የሴት ነጠላ ሁለተኛ መደብን ያስጠብቃል።
- source_word: εἰς τὰ ὦτά μου
  choice: ወደ ጆሮዬ
  rationale: εἰς ያለውን የአቅጣጫ ምስል ይጠብቃል፤ የአማርኛው ነጠላ የአካል ስም በዚህ አገባብ ተፈጥሯዊ ነው።
- source_word: ἐσκίρτησεν
  choice: ዘለለ
  rationale: ድንገተኛውንና ግልጽ የሕፃኑን እንቅስቃሴ በቀጥታ ይገልጻል።
- source_word: ἐν ἀγαλλιάσει
  choice: በደስታ
  rationale: የእንቅስቃሴውን የደስታና የሐሴት ባሕርይ በቀላልና ዘመናዊ አማርኛ ያስተላልፋል፤ በሐሴት የሚለው ይበልጥ ሥነ ጽሑፋዊ አማራጭ ነው።
- source_word: τὸ βρέφος
  choice: ሕፃኑ
  rationale: βρέφος ገና ያልተወለደን ወይም በጣም ትንሽ ልጅን ሊያመለክት ይችላል፤ ሕፃኑ በዚህ የማሕፀን አውድ ትክክለኛና የተከበረ ነው።
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: በማሕፀኔ
  rationale: በአውዱ κοιλία የሚያመለክተውን ማሕፀን በግልጽና ትክክለኛ ቃል ይገልጻል።
theological_decisions:
- issue: በማሕፀን ያለውን ዮሐንስ βρέφος ብሎ መጥራት
  choice: ሕፃኑ
  alternative: ልጁ / ጽንሱ
  rationale: ሕፃኑ የግሪኩን ሰፊ የዕድሜ ማመልከቻና የግለሰብ አቀራረብ ይጠብቃል። ጽንሱ የሚለው በተለይ የቅድመ ወሊድ ደረጃን ቢያመለክትም የግሪኩን ቃል ከሚፈቅደው በላይ ቴክኒካዊ ሊያደርገው ይችላል፤ ትርጉሙ ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ድምዳሜ አይጨምርም።
- issue: ἐν ἀγαλλιάσει የደስታን ምክንያት ወይም የእንቅስቃሴን ሁኔታ ማመልከቱ
  choice: በደስታ
  alternative: በሐሴት / ከደስታ የተነሣ
  rationale: በደስታ የሚለው የግሪኩን የአገባብ ተለዋዋጭነት ሳያጠብ ደስታው ከመዝለሉ ጋር እንደተያያዘ ያሳያል፤ ምክንያታዊነቱን ከጽሑፉ በላይ በግድ አይወስንም።
