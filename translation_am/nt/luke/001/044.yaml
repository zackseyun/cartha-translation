  text: እነሆና፣ የሰላምታሽ ድምፅ ወደ ጆሮዬ በደረሰ ጊዜ፣ ሕፃኑ በማሕፀኔ በደስታ[a] ዘለለ።
  philosophy: optimal-equivalence
  footnotes:
