  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: am
  text: መልአኩም መልሶ፣ “እኔ በእግዚአብሔር ፊት የምቆመው ገብርኤል ነኝ፤ ላንተ እንድናገርና ይህን የምስራች እንዳበስርህ ተልኬያለሁ” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የግሪኩ የተውሳከ ግስ ቀጥተኛ ንግግርን ያስገባል፤ «መልሶ» በአማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: ἄγγελος
  choice: መልአኩ
  rationale: ተናጋሪው ገብርኤል መሆኑ ስለተገለጠ፣ እዚህ ሰማያዊ መልእክተኛን የሚያመለክተው «መልአክ» ተገቢ ነው።
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: እኔ … ገብርኤል ነኝ
  rationale: ግልጽ የሆነውን Ἐγώ በ«እኔ» በመተርጎም የግለሰቡን አጽንዖት ጠብቋል።
- source_word: ὁ παρεστηκὼς
  choice: የምቆመው
  rationale: ፍጹም ተውሳከ ግሱ የቀጠለ አቋምና አገልግሎት ያመለክታል፤ የአማርኛው አሁን ጊዜ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: መገኘትንና በንጉሣዊ አደባባይ ፊት የመቆምን ምስል በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: ἀπεστάλην
  choice: ተልኬአለሁ
  rationale: የግሪኩን ተደራጊ ቅርጽና የተሰጠ ተልእኮ ሐሳብ ይጠብቃል።
- source_word: λαλῆσαι πρὸς σὲ
  choice: ላንተ እንድናገር
  rationale: የዓላማ መስተዋድዱን በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: εὐαγγελίσασθαί σοι
  choice: የምስራች እንዳበስርህ
  rationale: ግሱ መልካም ዜናን ማወጅ ማለት ነው፤ «የምስራች ማብሰር» በአማርኛ ይህን ትርጉም በተፈጥሮ ይይዛል።
- source_word: ταῦτα
  choice: ይህን የምስራች
  rationale: ቃል በቃል «እነዚህን ነገሮች» ቢሆንም፣ በአውዱ ገብርኤል ያስታወቀውን መልእክት ያመለክታል። ዋናው ጽሑፍ ተፈጥሯዊ አማርኛን ይጠቀማል፤ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
