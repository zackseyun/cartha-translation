  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: am
  text: ምሕረቱም ለሚፈሩት ከትውልድ ወደ ትውልድ ይደርሳል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል፣ «ለትውልዶችና ለትውልዶች»፤ ይህም ምሕረቱ በተከታታይ ትውልዶች እንደሚቀጥል ይገልጣል።
    reason: lexical_alternative
  - marker: b
    text: «ለሚፈሩት» ማለት እግዚአብሔርን በአክብሮትና በፍርሃት የሚኖሩትን ያመለክታል፤ «ለሚያከብሩት» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: ምሕረት
  rationale: ቃሉ ለተቸገረ ሰው የሚደረግን ርኅራኄና ቸርነት ያመለክታል፤ «ምሕረት» የማርያምን ዝማሬ አውድ የሚስማማና ትርጉሙን ያለ አላስፈላጊ ማጥበብ የሚያስተላልፍ ቀጥተኛ ምርጫ ነው።
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: ከትውልድ ወደ ትውልድ
  rationale: የግሪኩ አገላለጽ ምሕረቱ በተከታታይ ትውልዶች እንደሚቀጥል ያሳያል። ይህ የአማርኛ አገላለጽ ተፈጥሯዊና ግልጽ ሲሆን የቀጣይነቱን ሐሳብ ይጠብቃል።
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: ለሚፈሩት
  rationale: የዳቲቭ አገባቡ የምሕረቱን ተቀባዮች ያመለክታል፤ «ለሚፈሩት» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል። «መፍራት» የመጽሐፍ ቅዱሱን ክብደት ይጠብቃል፤ እዚህ በፈሪ ድንጋጤ ብቻ ሳይሆን ከአክብሮት ጋር የተያያዘ ፍርሃትን ያመለክታል።
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው «-ም» ከቀደመው ሐሳብ ጋር ያለውን ግንኙነትና የዝማሬውን ድምር ፍሰት በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: αὐτοῦ / αὐτόν
  choice: -ቱ / -ት
  rationale: ባለቤትነትና ተሳቢነትን በግስና በስም ላይ የተጣበቁት የሦስተኛ መደብ ወንድ ነጠላ ቅጥያዎች ያሳያሉ፤ በአውዱም ወደ እግዚአብሔር ይመለሳሉ።
theological_decisions:
- issue: እግዚአብሔርን «መፍራት» የሚለው ትርጉም
  choice: ለሚፈሩት
  alternative: ለሚያከብሩት
  rationale: φοβέομαι እግዚአብሔርን እንደ ተሳቢ ሲወስድ አክብሮታዊ ፍርሃትንና እግዚአብሔርን በአምልኮ ማክበርን ሊያመለክት ይችላል። «መፍራት» የምንጩን ሥነ መለኮታዊ ክብደትና ሆን ተብሎ ያልተፈታውን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። የግጥም ፍሰቱን ለመጠበቅ «-ም» ተጠቅሟል፤ ከምንጩ የማይገኝ የእምነት ቡድን ልዩ ትርጓሜ አልተጨመረም።
