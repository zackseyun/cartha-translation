  to: በቅዱሳን ነቢያቱ አፍ ከጥንት ጀምሮ እንደተናገረው።[a]
  rationale: The revision relocates “ከጥንት ጀምሮ” so that it unambiguously modifies “እንደተናገረው,” as in the Greek. It also removes the unsupported and syntactically distracting “በነበሩት,” while preserving the source’s prophetic-mouth imagery, God’s possession of the prophets, and the footnote’s lexical ambiguity.
