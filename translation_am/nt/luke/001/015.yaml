- issue: πνεύματος ἁγίου የሚያመለክተው
  choice: መለኮታዊው መንፈስ፦ ‘መንፈስ ቅዱስ’
  alternative: ግላዊ ያልሆነ ቅዱስ ኃይል ወይም ዝንባሌ
  rationale: በሉቃስ ዐውድ ውስጥ ሐረጉ የእግዚአብሔርን መንፈስ ያመለክታል፤ ትርጉሙ ከዐውዱ በላይ የሆነ የእምነት ዝርዝር አያክልም።
