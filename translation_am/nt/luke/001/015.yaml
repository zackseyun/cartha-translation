- source_word: οἶνον καὶ σίκερα
  choice: የወይን ጠጅም ሆነ ሌላ አስካሪ መጠጥ
  rationale: οἶνοςን በግልጽ ይለያል፤ σίκερα ደግሞ ከወይን ጠጅ ሌላ የሚያሰክር መጠጥን ስለሚያመለክት ‘ሌላ’ በማከል የምድቦቹን ግንኙነት ግልጽ ያደርጋል።
- source_word: οὐ μὴ πίῃ
