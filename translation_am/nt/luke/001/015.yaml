  rationale: οὐ μή ያለውን አጽንዖት በ‘ፈጽሞ’ ያሳያል፤ የወደፊት ትንቢታዊ አገላለጹንም ይጠብቃል።
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: በመንፈስ ቅዱስ ይሞላል
