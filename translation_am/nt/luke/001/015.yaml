  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: am
  text: ምክንያቱም እርሱ በጌታ ፊት ታላቅ ይሆናል፤ የወይን ጠጅም ሆነ ሌላ አስካሪ መጠጥ ፈጽሞ አይጠጣም፤[a] ገና ከእናቱ ማህፀን ጀምሮ በመንፈስ ቅዱስ ይሞላል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የወይን ጠጅም ሆነ ሌላ አስካሪ መጠጥ ፈጽሞ መጠጣት የለበትም።” ግሪኩ ድርጊቱን በጽኑ ይክዳል፤ ንግግሩ እንደ አጽንዖት ያለው ትንቢት ወይም ከተቀደሰ ጥሪው ጋር እንደሚስማማ ክልከላ ሊገለጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ገና በእናቱ ማህፀን ሳለ።” የግሪኩ ሐረግ እጅግ ቀደም ያለውን ጊዜ ያጎላል።
    reason: lexical_alternative
