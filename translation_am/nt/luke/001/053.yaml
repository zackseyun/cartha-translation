  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: am
  text: የተራቡትን በመልካም ነገሮች አጥግቧል፤ ሀብታሞችን ግን ባዶአቸውን ሰዷቸዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: የተራቡትን
  rationale: በስም ተግባር የቀረበውን የአሁን ጊዜ ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ይገልጣል፤ የረሃቡን ክብደት ከግሪኩ በላይ አያጋንንም።
- source_word: ἐνέπλησεν
  choice: አጥግቧል
  rationale: ግሱ መሙላትንና በቂ እንዲሆን ማድረግን ይጠቁማል። ከረሃብ አንጻር ‘አጥግቧል’ ተፈጥሯዊ ሲሆን፣ ፍጹም ጊዜውም በመዝሙሩ የተገለጠውን የተፈጸመ መለኮታዊ ድርጊት ያስተላልፋል።
- source_word: ἀγαθῶν
  choice: በመልካም ነገሮች
  rationale: የመሙላቱን ይዘት የሚገልጠውን የግሪክ ዘርፍ በቀጥታ ይወክላል፤ ‘ስጦታዎች’ የሚለውን በግልጽ ያልተጠቀሰ ሐሳብ አይጨምርም።
- source_word: πλουτοῦντας
  choice: ሀብታሞችን
  rationale: በስም ተግባር የቀረበውን ቦዝ አንቀጽ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ ከተራቡት ጋር ያለውን ማኅበራዊ ንፅፅር ይጠብቃል።
- source_word: ἐξαπέστειλεν
  choice: ሰዷቸዋል
  rationale: ‘አሰናበተ/ሰደደ’ የሚለውን የመላክና ከቦታው የማራቅ ፍቺ በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: κενούς
  choice: ባዶአቸውን
  rationale: ሀብታሞቹ ሲሰደዱ ያሉበትን ሁኔታ የሚገልጠውን ቅጽል በቀጥታ ያስተላልፋል፤ ‘እጃቸውን ባዶ’ የሚል በግሪኩ ያልተገለጸ ምስል አይጨምርም።
theological_decisions:
- issue: በማርያም መዝሙር የተገለጠው ማኅበራዊና መለኮታዊ ተቃራኒ ለውጥ
  choice: ‘የተራቡት’ እና ‘ሀብታሞች’ የሚለውን ተጨባጭ ንፅፅር ሳይንፈሳዊ ብቻ እንደሆነ ሳይተረጉም ማቆየት
  alternative: ቃላቱን ‘በመንፈስ የተራቡ’ እና ‘ራሳቸውን የቻሉ ወይም ትዕቢተኞች’ ብሎ መተርጎም
  rationale: ግሪኩ በቀጥታ የተራቡ ሰዎችንና ሀብታሞችን ይጠቅሳል። ጥቅሱ ሌሎች መንፈሳዊ አንድምታዎችን ሊኖሩት ቢችልም፣ ትርጉሙ የጽሑፉን ተጨባጭ ማኅበራዊ ውጥረት አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተቃራኒውን ለማጉላት ‘ግን’ ተጨምሯል፤ ይህም በግሪኩ καί ያገናኛቸውን ሁለት ተቃራኒ አንቀጾች በተፈጥሯዊ አማርኛ ያቀርባል። የእንግሊዝኛው ማስታወሻ ምልክት ከ‘good things’ በኋላ ቢቀመጥም የማስታወሻው ይዘት ‘empty-handed’ ከሚለው ጋር ይዛመዳል፤ የአማርኛው ዋና ጽሑፍ ‘ባዶአቸውን’ ብሎ የግሪኩን ስፋት በቂ ስለሚጠብቅ ማስታወሻ አልተጨመረም።
