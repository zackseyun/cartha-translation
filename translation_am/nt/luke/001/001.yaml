  rationale: ከπραγμάτων ጋር ያለው አገባብና የሉቃስ የፍጻሜ ጭብጥ የ‘ፍጻሜ ማግኘት’ን ትርጉም ይደግፋሉ። ሆኖም ቃሉ መፈጸምን ወይም ሙሉ መረጋገጥን ሊያመለክት ስለሚችል ይህ እርግጠኛ ባልሆነበት ቦታ አማራጮቹ በእግር ማስታወሻ ቀርበዋል።
