review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Mary’s staying with Elizabeth, the approximate duration expressed by ὡς, and her return to her own home. However, «ቆይታ» is a deverbal noun (“having stayed/a stay”) and is syntactically ill-formed in this finite narrative clause; a finite verb is required for ἔμεινεν.
  naturalness: Replacing «ቆይታ» with «ቆየች» produces fluent, modern standard Amharic. The connective suffix in «ማርያምም» is natural, and «ከእርሷ ጋር», «ሦስት ወር ያህል», and «ወደ ቤቷ ተመለሰች» read naturally.
  terminology: «ማርያም» is the established Amharic biblical form. «ቤቷ» faithfully renders the spatial/personal sense of εἰς τὸν οἶκον αὐτῆς. No doctrinal terminology is involved.
  issues:
  - severity: high
    issue: «ቆይታ» is used where a finite past-tense verb is required.
    rationale: The Greek ἔμεινεν is an aorist finite verb. In «ማርያምም ... ቆይታ ወደ ቤቷ ተመለሰች», «ቆይታ» is nominal/deverbal and leaves the first action grammatically malformed. «ቆየች» faithfully and idiomatically expresses “stayed.”
  revised_text: ማርያምም ከእርሷ ጋር ሦስት ወር ያህል[a] ቆየች፤ ወደ ቤቷም ተመለሰች።
  revised_footnotes:
