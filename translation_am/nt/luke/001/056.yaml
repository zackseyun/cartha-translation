  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: am
  text: ማርያምም ከእርሷ ጋር ሦስት ወር ያህል[a] ቆየች፤ ወደ ቤቷም ተመለሰች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሦስት ወር ገደማ»፤ በግሪክኛው ከጊዜ መጠን ጋር የገባው ὡς ቁጥሩ ግምታዊ መሆኑን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: ቆይታ
  rationale: μέ​νω በዚህ አውድ አንድ ቦታ ለተወሰነ ጊዜ መቆየትን ያመለክታል፤ «ቆይታ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: -ም
  rationale: δέ ቀላል የትረካ ማያያዣ ነው፤ ከ«ማርያም» ጋር የተያያዘው «-ም» ንፅፅርን ሳያጎላ የትረካውን ቀጣይነት ያሳያል።
- source_word: Μαριὰμ
  choice: ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: σὺν αὐτῇ
  choice: ከእርሷ ጋር
  rationale: σύν ከዳቲቭ ጋር አብሮነትን ያመለክታል፤ በአውዱ «እርሷ» ኤልሳቤጥን ይመለከታል።
- source_word: ὡς μῆνας τρεῖς
  choice: ሦስት ወር ያህል
  rationale: ὡς ከጊዜ መጠን ጋር ሲመጣ ግምታዊነትን ሊያመለክት ይችላል፤ «ያህል» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπέστρεψεν
  choice: ተመለሰች
  rationale: ግሱ ወደ ቀድሞ ቦታ መመለስን ያመለክታል፤ የአማርኛው ግስ ከማርያም ጾታ ጋር ተስማምቷል።
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: ወደ ቤቷ
  rationale: እዚህ οἶκος የመድረሻ ቦታዋን፣ ማለትም የራሷን ቤት፣ ያመለክታል፤ «ወደ ቤቷ» አጭርና ተፈጥሯዊ ነው።
