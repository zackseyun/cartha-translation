id: LUK.1.63
reference: Luke 1:63
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: am
  text: የሚጻፍበትንም ሰሌዳ ጠይቆ፣ “ስሙ ዮሐንስ ነው” ብሎ ጻፈ። ሁሉም ተደነቁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: ጠይቆ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን ጥያቄ ያሳያል፤ በአማርኛ ‘ጠይቆ’ ቅደም ተከተሉን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: πινακίδιον
  choice: የሚጻፍበትን ሰሌዳ
  rationale: ቃሉ ለመጻፍ የሚያገለግል ትንሽ ሰሌዳን ያመለክታል፤ ይህ አገላለጽ ከዘመናዊ ኤሌክትሮኒክ ታብሌት ጋር የሚፈጠርን ግራ መጋባት ያስወግዳል።
- source_word: ἔγραψεν λέγων
  choice: ‘…’ ብሎ ጻፈ
  rationale: የጽሑፉን ይዘት የሚያስተዋውቀውን λέγων በተፈጥሯዊው የአማርኛ የቀጥታ ንግግር አወቃቀር ‘ብሎ’ በማለት ይጠብቃል።
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: ስሙ ዮሐንስ ነው
  rationale: የአማርኛ ተፈጥሯዊ የስም አረፍተ ነገር አወቃቀር ይህ ነው፤ የአሁን ጊዜውን ወሳኝ ማረጋገጫ ይጠብቃል እንጂ ‘ይባላል’ ወይም ‘ይሆናል’ ብሎ አይተረጉምም።
- source_word: ἐθαύμασαν πάντες
  choice: ሁሉም ተደነቁ
  rationale: θαυμάζω በዚህ አውድ የሚገልጠውን መገረም ወይም መደነቅ በዘመናዊና ክብር ባለው አማርኛ ይገልጣል፤ πάντες ደግሞ ‘ሁሉም’ ተብሎ ሙሉ በሙሉ ተጠብቋል።
theological_decisions:
- issue: የሕፃኑ ስም እንደ ወደፊት የሚሰጥ ወይም አስቀድሞ እንደተወሰነ መተርጎም
  choice: ‘ስሙ ዮሐንስ ነው’ በሚለው የአሁን ጊዜ አረጋገጥ ተተርጉሟል።
  alternative: ‘ስሙ ዮሐንስ ይሆናል’ ወይም ‘ዮሐንስ ይባላል።’
  rationale: ἐστίν የአሁን ጊዜ ግስ ነው፤ ዘካርያስ ስሙን እየጠቆመ ሳይሆን አስቀድሞ የተሰጠው ስሙ ይህ እንደሆነ በቁርጥ ያረጋግጣል።
translation_notes:
  register: ትርጉሙ በዘመናዊ መደበኛ አማርኛ፣ በተፈጥሯዊ የትረካ ፍሰትና ክብር ባለው ቃና ተዘጋጅቷል። የግሪኩን የስም ቅድመት በቃል ቅደም ተከተል መኮረጅ (‘ዮሐንስ ነው ስሙ’) በአማርኛ አላስፈላጊ ድምፀት ስለሚፈጥር፣ የዘካርያስ ወሳኝ ማረጋገጫ በ‘ነው’ ተጠብቆ ተፈጥሯዊው አወቃቀር ተመርጧል።
