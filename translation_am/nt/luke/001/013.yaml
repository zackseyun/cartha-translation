  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: am
  text: መልአኩ ግን እንዲህ አለው፦ “ዘካርያስ ሆይ፣ አትፍራ፤ ጸሎትህ[a] ተሰምቷልና። ሚስትህ ኤልሳቤጥ ወንድ ልጅ ትወልድልሃለች፤ ስሙንም ዮሐንስ ብለህ ትጠራዋለህ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልመናህ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ዮሐንስ ብለህ ትሰይመዋለህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν
  choice: መልአኩ ግን እንዲህ አለው
  rationale: δέ የሚያመለክተውን ቀላል የንግግር ሽግግር “ግን” ያሳያል፤ “አለው” ደግሞ πρὸς αὐτόν የሚያመለክተውን ተቀባይ በተፈጥሯዊ አማርኛ ያካትታል።
- source_word: ὁ ἄγγελος
  choice: መልአኩ
  rationale: በዚህ ትረካ ውስጥ ἄγγελος ሰማያዊ መልአክን ያመለክታል፤ “መልአክ” የተለመደውና ግልጽ ቃል ነው።
- source_word: Μὴ φοβοῦ
  choice: አትፍራ
  rationale: የግሪኩን ቀጥተኛ ክልከላ በአጭር፣ ተፈጥሯዊና ዘመናዊ አማርኛ ይገልጣል።
- source_word: Ζαχαρία
  choice: ዘካርያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: διότι
  choice: ተሰምቷልና
  rationale: ምክንያትን የሚያስገባው διότι በአማርኛ “-ና” ቅጥያ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: εἰσηκούσθη
  choice: ተሰምቷል
  rationale: ድርጊቱ ተፈጽሞ አሁን ውጤት እንዳለው ያሳያል፤ የሰማውን አካል ግን እንደ ግሪኩ በግልጽ አይሰይምም።
- source_word: ἡ δέησίς σου
  choice: ጸሎትህ
  rationale: δέησις በዚህ አውድ ወደ እግዚአብሔር የቀረበ ልመና ነው፤ “ጸሎትህ” ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን “ልመናህ” የሚለው ይበልጥ የተወሰነ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: ሚስትህ ኤልሳቤጥ
  rationale: ከባለቤትነት አመልካቹ σου እና ከአውዱ የተነሣ γυνή እዚህ “ሚስት” ማለት ነው።
- source_word: γεννήσει υἱόν σοι
  choice: ወንድ ልጅ ትወልድልሃለች
  rationale: የሴት ባለቤት የሆነው γεννήσει “ትወልዳለች” ማለት ሲሆን፣ σοι የሚያሳየው ግንኙነትና ጥቅም “-ልሃ-” በሚለው ቅጥያ ተጠብቋል።
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: ስሙንም ዮሐንስ ትለዋለህ
  rationale: የግሪኩን “ስሙን ... ትለዋለህ” የሚል አገላለጽ በተረዳ አማርኛ ይጠብቃል፤ “ትሰይመዋለህ” የሚለው ለስላሳ አማራጭ በማስታወሻ ቀርቧል።
- source_word: Ἰωάννην
  choice: ዮሐንስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: “ተሰምቷል” በሚለው ተደራጊ ግስ የተሰወረው ፈጻሚ
  choice: ጸሎቱን የሰማው እግዚአብሔር እንደሆነ አውዱ ያመለክታል፤ ትርጉሙ ግን ስሙን አይጨምርም።
  alternative: “እግዚአብሔር ጸሎትህን ሰምቷል” ብሎ ፈጻሚውን በግልጽ መጥቀስ።
  rationale: በአይሁዳዊ የጸሎት አውድ ውስጥ መለኮታዊ ተደራጊ መሆኑ ተፈጥሯዊ ነው፤ ሆኖም የግሪኩን የተሰወረ ፈጻሚና የአገላለጹን ጥንቃቄ ለመጠበቅ “እግዚአብሔር” በዋናው ጽሑፍ አልተጨመረም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ መደበኛ አማርኛን ይጠቀማል። “ዘካርያስ ሆይ” የሚለው ቅርጽ የቀጥታ ንግግሩን ክብርና ግልጽነት ይጠብቃል፤ የግሪኩ አሻሚነት ባለበት ቦታ አልተፈታም።
