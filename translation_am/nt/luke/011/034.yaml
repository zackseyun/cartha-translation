base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: am
  text: የሰውነትህ መብራት ዓይንህ ነው። ዓይንህ ጤናማ[a] ሲሆን፣ መላ ሰውነትህም በብርሃን የተሞላ ነው፤ ነገር ግን ዓይንህ መጥፎ[b] ሲሆን፣ ሰውነትህም ጨለማ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ግልጽ፣” “ጤናማ፣” ወይም በተለምዶ “አንድ።” የግሪኩ ቅጽል ቃል ያልተከፋፈለ ወይም ጤናማ የሚለውን ፍቺ ሊይዝ ይችላል፤ እዚህ ግን “መጥፎ” ከሚባል ዓይን ጋር በተቃርኖ ዓይንን ይገልጻል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ክፉ።” የግሪኩ ቃል “መጥፎ” ወይም “ክፉ” ማለት ሊሆን ይችላል፤ እዚህ የዓይንን ጉድለትና በሥነ ምግባር የተዛባ እይታን አብሮ ሊጠቁም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: መብራት
  rationale: ተጨባጭ የብርሃን ምንጭን የሚያመለክተውን የግሪክ ቃል እና የአካሉን ዘይቤ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σῶμα
  choice: ሰውነት
  rationale: በዚህ ስፍራ ለአካላዊው ሰውነት የተጠቀሰ መደበኛ ትርጉም ነው፤ በተመሳሳይ ጊዜም የውስጣዊ እይታን ዘይቤ ይሸከማል።
- source_word: ὀφθαλμός
  choice: ዓይን
  rationale: ጥቅሱ ከአካላዊው የማየት አካል ተነሥቶ የውስጥ ግንዛቤን ስለሚያመለክት፣ ቀጥተኛው ቃል ተጠብቋል።
- source_word: ἁπλοῦς
  choice: ጤናማ
  rationale: ከπονηρός ጋር በተቃርኖ ሲቀርብ በትክክል የሚሠራ፣ ያልተከፋፈለ ወይም ንጹሕ ዓይን የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሌሎች የቃሉ ገጽታዎች በማስታወሻ ተጠብቀዋል።
- source_word: φωτεινόν
  choice: ብርሃን የተሞላ
  rationale: “ብሩህ” ብቻ ከማለት ይልቅ በብርሃን የተሞላ የሚለውን የግሪኩን ምስል ግልጽ አድርጎ ያቀርባል።
- source_word: πονηρός
  choice: መጥፎ
  rationale: ቃሉ አካላዊ ጉድለትንም ሆነ ሥነ ምግባራዊ ክፋትን ሊያመለክት ስለሚችል፣ “መጥፎ” ይህን አሻሚነት ሳይወስን ይጠብቃል።
- source_word: σκοτεινόν
  choice: ጨለማ
  rationale: ከ“ብርሃን የተሞላ” ጋር ያለውን ቀጥተኛ ተቃርኖ አጭርና ግልጽ በሆነ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በ“ዓይንህ ἁπλοῦς በሚሆንበት ጊዜ” ውስጥ የἁπλοῦς ትርጉም
  choice: በዋናው ጽሑፍ “ጤናማ” ተብሎ ተተርጉሟል።
  alternative: “ንጹሕ፣” “ቅን፣” ወይም በቃል ቅርብ “አንድ/ያልተከፋፈለ”፤ በሌላ አውድ “ለጋስ” የሚለውም ሊታሰብ ይችላል።
  rationale: ቅርብ አውዱ ዓይንን እንደ ሰውነት መብራት እና ሰውነትን እንደ ብሩህ ወይም ጨለማ ያቀርባል። “ጤናማ” በትክክል የሚሠራ ዓይንን በተፈጥሯዊ ቋንቋ ያሳያል፤ የቅንነትና ያልተከፋፈለ እይታ ገጽታዎችን ግን ማስታወሻው ይጠብቃል።
- issue: የπονηρός አካላዊና ሥነ ምግባራዊ ገጽታ
  choice: “መጥፎ” ተብሎ ተተርጉሟል።
  alternative: “ክፉ” ወይም “የታመመ/ጤናማ ያልሆነ”
  rationale: “ክፉ” ሥነ ምግባራዊውን ገጽታ ብቻ፣ “የታመመ” ደግሞ አካላዊውን ገጽታ ብቻ ሊያጎላ ይችላል። “መጥፎ” ሁለቱንም እድሎች ክፍት ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር “በሚሆንበት ጊዜ ... ነገር ግን ... በሚሆንበት ጊዜ” በሚል ተጠብቋል፤ የἁπλοῦς እና πονηρός አሻሚነት በዋናው ጽሑፍና በማስታወሻዎች ተወክሏል።
