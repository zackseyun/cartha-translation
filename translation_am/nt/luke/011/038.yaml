  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: am
  text: ፈሪሳዊው ግን ይህን ባየ ጊዜ፣ ኢየሱስ ከምግብ በፊት አስቀድሞ ባለመታጠቡ[a] ተደነቀ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከምግብ በፊት የሥርዓት መታጠብን ባለመፈጸሙ።” የግሪኩ ግስ ብዙ ጊዜ “ማጥመቅ” ተብሎ የሚተረጎመው ግስ ነው፤ እዚህ ግን በፈሪሳውያን የንጽሕና ልማድ ዐውድ ውስጥ የሥርዓት መታጠብን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው ትረካ እና በፈሪሳዊው ምላሽ መካከል ያለውን መጠነኛ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Φαρισαῖος
  choice: ፈሪሳዊው
  rationale: የቡድኑን መጠሪያና የግሪኩን የተወሰነ አመልካች በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: ἰδὼν
  choice: ይህን ባየ ጊዜ
  rationale: ዋናውን ግስ የቀደመውን ድርጊት በተፈጥሯዊ የጊዜ ሐረግ ይገልጣል፤ የተተወው የግስ ተሳቢም ከዐውዱ ‘ይህን’ ተብሎ ተገልጧል።
- source_word: ἐθαύμασεν
  choice: ተደነቀ
  rationale: በዐውዱ ያለውን ያልተጠበቀ ነገር የማየት ምላሽ በክቡርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: οὐ πρῶτον
  choice: አስቀድሞ ባለመ-
  rationale: ከመብላት በፊት ይጠበቅ የነበረው ድርጊት እንዳልተፈጸመ ያሳያል።
- source_word: ἐβαπτίσθη
  choice: ባለመታጠቡ
  rationale: በዚህ የፈሪሳውያን የንጽሕና ልማድ ዐውድ ግሱ ከምግብ በፊት መታጠብን ያመለክታል፤ የክርስቲያን ጥምቀት ሥነ ሥርዓትን አያመለክትም።
- source_word: πρὸ τοῦ ἀρίστου
  choice: ከምግብ በፊት
  rationale: ἄριστον ሊያመለክት የሚችለውን የቀን ሰዓት ሳይወስን፣ ከመብላት በፊት መሆኑን በግልጽ አማርኛ ይገልጣል።
theological_decisions:
- issue: በፈሪሳውያን የምግብ ዐውድ ውስጥ የἐβαπτίσθη ትርጉም
  choice: ከምግብ በፊት የሚደረግ ሥርዓታዊ መታጠብ፣ በዋናው ጽሑፍ ‘መታጠብ’ ተብሎ ተተርጉሟል
  alternative: ‘ተጠመቀ’ ወይም ‘ራሱን በውኃ ውስጥ ነከረ’
  rationale: የቅርብ ዐውዱ ጉዳይ የፈሪሳውያን የንጽሕና ልማድ እንጂ የክርስቲያን ጥምቀት አይደለም። የግሪኩ ግስ ግን ከ‘ማጥመቅ’ ጋር ያለውን የቃል ግንኙነት በማስታወሻው ተጠብቋል።
- issue: በὅτι ንዑስ ሐረግ የተተወው የἐβαπτίσθη ባለቤት
  choice: ግልጽነት ለመስጠት ‘ኢየሱስ’ ተጨምሯል
  alternative: የሦስተኛ መደብ ተውላጠ ስምን ብቻ መጠቀም
  rationale: በግሪክ ከዐውዱ የሚታወቀው የግሱ ባለቤት ኢየሱስ ነው። በአማርኛ ተውላጠ ስም ብቻ ቢጠቀም ፈሪሳዊውን እንደሚያመለክት ሊሳሳት ስለሚችል ስሙ በግልጽ ቀርቧል።
