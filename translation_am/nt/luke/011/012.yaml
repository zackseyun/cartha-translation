  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: am
  text: ወይስ እንቁላል ቢለምነው፣ ጊንጥ ይሰጠዋልን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: ወይስ
  rationale: በኢየሱስ ተከታታይ የንጽጽር ጥያቄ ውስጥ ቀጣዩን ምሳሌ በተፈጥሯዊ አማርኛ ያስገባል፤ καίን ሳያበዛ የἤን አማራጭ ኃይል ይጠብቃል።
- source_word: αἰτήσει
  choice: ቢለምነው
  rationale: የወደፊት አመልካች ግስ እዚህ ሁኔታዊ በሆነ አጠያየቅ ውስጥ ስለመጣ፣ በአማርኛ የሁኔታ አንቀጽ ተፈጥሯዊ ነው፤ የመጠየቅን ሐሳብም ይገልጣል።
- source_word: ᾠόν
  choice: እንቁላል
  rationale: የግሪኩ ቀጥተኛና መደበኛ ፍቺ ነው።
- source_word: ἐπιδώσει
  choice: ይሰጠዋልን
  rationale: ለጥያቄው ምላሽ አንድን ነገር መስጠትን ይገልጣል፤ የአማርኛው የጥያቄ ቅርጽ የግሪኩን የወደፊት አመልካች እና የአጻጻፉን ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: αὐτῷ
  choice: -ዋ-
  rationale: በ«ይሰጠዋልን» ውስጥ ያለው ተሳቢ ተውላጠ ስም ለልጁ እንደሚሰጥ ያመለክታል።
- source_word: σκορπίον
  choice: ጊንጥ
  rationale: መደበኛ የአማርኛ ቃል ሲሆን፣ ከእንቁላል ጋር ያለውን ግልጽና አስደንጋጭ ንጽጽር ይጠብቃል።
theological_decisions:
- issue: የአባትና የልጅ ንጽጽር የአጻጻፍ ኃይል
  choice: የታሰበውን አሉታዊ መልስ ሳይጨምር እንደ ቀጥተኛ የአጻጻፍ ጥያቄ መተርጎም።
  alternative: «በእርሱ ፈንታ» ወይም «በፍጹም አይሰጠውም» በማለት የተዘዋዋሪውን ንጽጽር ግልጽ ማድረግ።
  rationale: ግሪኩ የእንቁላልና የጊንጥን የማይመጣጠን ንጽጽር በጥያቄው ውስጥ እንዲታወቅ ይተወዋል። አማርኛውም ይህን በቀላሉ ስለሚያስተላልፍ፣ የአብን ቸርነት በትርጓሜያዊ ጭማሪ ሳይወስን የጽሑፉን ነጥብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ። «ወይስ» የቀደመውን ተከታታይ ጥያቄ ይቀጥላል፤ «-ን» የአጻጻፍ ጥያቄውን በክብር ያለው የጽሑፍ ቅርጽ ያቀርባል።
