  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: am
  text: እንግዲህ እናንተ ክፉዎች ሆናችሁ ለልጆቻችሁ መልካም ስጦታዎችን መስጠት ካወቃችሁ፣ የሰማይ አባት[a] እርሱን ለሚለምኑት መንፈስ ቅዱስን[b] ምንኛ አብልጦ ይሰጣቸዋል!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ትርጉሞች ከማቴዎስ 7፥11 ጋር በማመሳሰል “የእናንተ የሰማይ አባት” ይላሉ፤ የሉቃስ ግሪክ ግን “ከሰማይ የሆነው አባት” ይላል፣ “የእናንተ” የሚለውም ቃል የለበትም።
    reason: alternative_reading
  - marker: b
    text: በማቴዎስ 7፥11 “መልካም ነገሮች” ይላል፤ ሉቃስ ግን እዚህ “መንፈስ ቅዱስ” ይላል። ይህ የሁለቱን ወንጌሎች ልዩ አገላለጽ ይጠብቃል።
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: ክፉዎች ሆናችሁ
  rationale: የግሪኩን ገላጭና በዐውዱ አንጻር የቅናሽ ሐሳብ ያለውን አገላለጽ በቅርብ ይጠብቃል፤ የሰውን የሥነ ምግባር ሁኔታ ይገልጻል።
- source_word: οἴδατε … διδόναι
  choice: መስጠት ካወቃችሁ
  rationale: ከተከታዩ ግስ ጋር ያለውን የተግባር እውቀት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: δόματα ἀγαθὰ
  choice: መልካም ስጦታዎችን
  rationale: δόματα አጠቃላይ ‘ነገሮች’ ሳይሆን በተለይ ስጦታዎችን ያመለክታል።
- source_word: τέκνοις ὑμῶν
  choice: ለልጆቻችሁ
  rationale: በቤተሰብ ዐውድ ውስጥ τέκνα የሚለውን በተፈጥሯዊና ትክክለኛ አማርኛ ያቀርባል።
- source_word: πόσῳ μᾶλλον
  choice: ምንኛ አብልጦ
  rationale: ከታናሹ ወደ ታላቁ የሚሄደውን የንጽጽር ክርክር በግልጽ ያሳያል።
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: ከሰማይ የሆነው አብ
  rationale: ግሪኩ ‘የእናንተ’ የሚለውን ቃል አልያዘም፤ ἐξ οὐρανοῦ የሚለውንም ‘በሰማይ ያለው’ ብሎ ከማስማማት ይልቅ ‘ከሰማይ’ የሚለውን የሉቃስ ልዩ አገላለጽ ይጠብቃል።
- source_word: πνεῦμα ἅγιον
  choice: መንፈስ ቅዱስን
  rationale: በዚህ ዐውድ የሚያመለክተው አጠቃላይ መንፈስን ሳይሆን የእግዚአብሔርን ቅዱስ መንፈስ ነው።
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: እርሱን ለሚለምኑት
  rationale: የአሁን ጊዜውን ተሳቢ አገላለጽ በተፈጥሯዊ አማርኛ ሲያቀርብ፣ በግሪኩ በግልጽ ያለውን αὐτόν (‘እርሱን’) ይጠብቃል።
theological_decisions:
- issue: የπνεῦμα ἅγιον ማጣቀሻ
  choice: መለኮታዊው መንፈስ ቅዱስ
  alternative: አንድ ቅዱስ መንፈስ
  rationale: ሐረጉ በግሪክ የመወሰኛ አመልካች ባይኖረውም፣ በሉቃስ ዐውድ አብ የሚሰጠውን የእግዚአብሔር መንፈስ ያመለክታል።
- issue: ከማቴዎስ 7፥11 ጋር ያለው ተመሳሳይ ንባብ
  choice: የሉቃስን ‘ከሰማይ የሆነው አብ’ እና ‘መንፈስ ቅዱስ’ የሚሉ ልዩ ቃላት መጠበቅ
  alternative: ‘የእናንተ የሰማይ አባት’ እና ‘መልካም ነገሮች’ ብሎ ከማቴዎስ ጋር ማስማማት
  rationale: ትርጉሙ የሉቃስን የግሪክ ጽሑፍ ይከተላል፤ በተመሳሳዩ የማቴዎስ ንባብ አይተካውም።
