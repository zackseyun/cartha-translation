  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: am
  text: እንዲህም ሆነ፤ እርሱ በአንድ ስፍራ እየጸለየ ሳለ፣ ጸሎቱን ባቆመ ጊዜ፣ ከደቀ መዛሙርቱ አንዱ፣ “ጌታ ሆይ፣ ዮሐንስም ደቀ መዛሙርቱን እንዳስተማረ፣ እኛም እንድንጸልይ አስተምረን” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: '[በተፈጥሯዊ የትረካ አጀማመር ውስጥ ተዋሕዷል]'
  rationale: ይህ የሉቃስ የትረካ ቀመር ነው። “እንዲህም ሆነ” የሚለው ቃል በቃል አተረጓጎም በዘመናዊ አማርኛ ከባድ ስለሚሆን፣ የክስተት ማስገቢያ ተግባሩ በቀጥተኛው የትረካ አጀማመር ተጠብቋል።
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: ኢየሱስ ... እየጸለየ ነበር
  rationale: አወቃቀሩ ከሌላው ድርጊት ጋር በአንድ ጊዜ የሚካሄድ ቀጣይ ድርጊትን ያሳያል፤ “እየጸለየ ነበር” ይህን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል። በአማርኛ ግልጽነት ሲባል ተውላጠ ስሙ “ኢየሱስ” ተብሎ ተገልጿል።
- source_word: ἐν τόπῳ τινὶ
  choice: በአንድ ስፍራ
  rationale: የቦታውን ሆን ተብሎ ያልተወሰነ መሆን ይጠብቃል፤ “በአንድ ስፍራ” በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው ነው።
- source_word: ὡς ἐπαύσατο
  choice: ጸሎቱን ባቆመ ጊዜ
  rationale: ἐπαύσατο በቀጥታ “አቆመ” ማለት ነው። ነገሩ “ጸሎቱን” ተብሎ ተገልጦ በአማርኛ የማጣቀሻ ግራ መጋባት ተወግዷል፤ “ሲጨርስ” የሚለው የበለጠ ትርጓሜያዊ አማራጭ አልተመረጠም።
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ አንዱ
  rationale: ክፍልን ከሙሉ የሚለየውን የግሪክ አወቃቀር በተፈጥሯዊ አማርኛ በትክክል ይገልጣል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριος በኢየሱስ ቀጥተኛ አድራሻ ሲሆን “ጌታ” የሚለው ትርጉም አክብሮቱንና በሉቃስ ውስጥ ያለውን ሰፊ የማዕረግ ክልል ይጠብቃል፤ “ሆይ” የጥሪ አገባቡን ያሳያል።
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: እኛንም መጸለይን አስተምረን
  rationale: የግሪኩን “መጸለይ አስተምረን” የሚለውን ቀጥተኛ ይዘት ይጠብቃል፤ “እንዴት እንደምንጸልይ” በማለት በጽሑፉ የሌለው “እንዴት” አልተጨመረም። “ም” ከቀጣዩ ንጽጽር ጋር ያለውን የተናጋሪዎቹን ጨምሮ የማያያዝ ኃይል ይገልጣል።
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: ዮሐንስም ደቀ መዛሙርቱን እንዳስተማረ
  rationale: καθώς የንጽጽር ኃይሉን “እንደ” ይጠብቃል፤ καί ደግሞ በ“ም” ተወክሏል። የአማርኛ ተፈጥሯዊ ቃል ቅደም ተከተል ተከትሏል።
theological_decisions:
- issue: ኢየሱስን κύριος ብሎ መጥራት
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: “ጌታ” የκύριοςን መደበኛ የአዲስ ኪዳን ትርጉምና የቃሉን የትርጉም ስፋት ይጠብቃል። “መምህር” ንግግሩን በማስተማር ሚና ብቻ ሊወስነው ይችላል፤ ነገር ግን እዚህ ያለውን ክርስቶሳዊ ክብደት ከልክ በላይም አልተተረጎመም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ደቀ መዛሙርት” እና “ጌታ ሆይ” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ቢሆኑም በዘመናዊ አንባቢ ዘንድ ግልጽ ናቸው። ምንም የግርጌ ማስታወሻ አልተፈለገም።
