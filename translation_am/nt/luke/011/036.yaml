  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: am
  text: እንግዲህ መላ ሰውነትህ ብሩህ ከሆነ፣ ምንም ጨለማ ክፍል ሳይኖረው፣ ሙሉ በሙሉ ብሩህ ይሆናል፤ መብራት በድምቀቱ ሲያበራልህ እንደሚሆነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መብራት በብልጭታው ሲያበራልህ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ብልጭታን ወይም ድምቀትን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ቃል በቃል መብረቅን ሳይሆን የመብራቱን ማብራት የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: ሰውነት
  rationale: ቃሉ በቀጥታ ‘ሰውነት’ ማለት ነው፤ በአውዱ ሰውን በምሳሌያዊ መንገድ ቢወክልም፣ የዓይንና የብርሃንን ምስል ሳይፈታ ያቆያል።
- source_word: ὅλον / φωτεινόν
  choice: መላ / ብርሃን የሞላበት
  rationale: ὅλον የሙሉነትን አጽንዖት ያስጠብቃል፤ φωτεινόν ደግሞ ከ‘ጨለማ ክፍል’ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: ምንም ጨለማ ክፍል ከሌለበት
  rationale: አሉታዊውን አሳታፊ ሐረግና μέρος τι የሚያመለክተውን ‘ማንኛውም ክፍል’ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: λύχνος
  choice: መብራት
  rationale: ተንቀሳቃሽ የዘይት መብራትን የሚያመለክተውን ተጨባጭ ምስል ይጠብቃል፤ ‘ብርሃን’ ወይም ‘መቅረዝ’ ተብሎ አልተፈታም።
- source_word: τῇ ἀστραπῇ
  choice: በብርሃኑ
  rationale: ἀστραπή መብረቅን፣ ብልጭታን ወይም ድምቀትን ሊያመለክት ይችላል፤ እዚህ መብራት የድርጊቱ ባለቤት ስለሆነ ‘በብርሃኑ’ የሚለው ተፈጥሯዊ ሲሆን ዋናውን ሐሳብ ያስተላልፋል።
- source_word: φωτίζῃ σε
  choice: እንደሚያበራልህ
  rationale: ግሱ ‘ብርሃን መስጠት/ማብራት’ ማለት ሲሆን፣ σε የተባለውን የሁለተኛ መደብ ነጠላ ተሳቢ በ‘-ልህ’ ያስጠብቃል።
theological_decisions:
- issue: ‘ሰውነት’ና ‘ብርሃን’ ያላቸው ምሳሌያዊ ኃይል
  choice: የሰውነትና የብርሃን ምስሎቹን እንዳሉ ማቆየት
  alternative: ‘ውስጣዊ ሕይወት’ ወይም ‘መንፈሳዊ ሁኔታ’ ብሎ መተርጎም
  rationale: ጥቅሱ ከዓይን፣ ከሰውነትና ከብርሃን ጋር የተያያዘውን ምሳሌ ይቀጥላል። ትርጉሙ ምስሉን ወደ ነፍስ ወይም ወደ ሥነ ምግባራዊ ሁኔታ በመፍታት ሳይወስን የጽሑፉን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩን ረጅም ሁኔታዊ አወቃቀር በአማርኛ ተፈጥሯዊ ቅደም ተከተል በማቅረብ፣ የ‘መላ/በሙሉ’ አጽንዖትና ተጨባጩ የብርሃን ምስል ተጠብቀዋል።
