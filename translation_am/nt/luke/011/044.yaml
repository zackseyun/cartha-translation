review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the woe, the comparison with imperceptible/unknown tombs, and people passing over them. However, it recasts the Greek coordinate clause «οἱ ... περιπατοῦντες ... οὐκ οἴδασιν» (“the people walking over [them] do not know”) as a subordinate, simultaneous expression (“people walk over them without knowing”). A revision can preserve the source’s explicit final assertion more closely.
  naturalness: The draft is generally clear modern Amharic. «እንደ የማይታወቁ መቃብሮች» is slightly more natural and clearly formed than writing the comparison phrase without spacing/relative marker. Rendering the final clause independently is also more direct and readable.
  terminology: «ወዮላችሁ» and «መቃብሮች» are appropriate. «የማይታወቁ» suitably retains the breadth of ἄδηλα (“unnoticed/unknown,” potentially also not evident), without imposing the narrower “unmarked.” «ሰዎች» correctly represents the gender-inclusive ἄνθρωποι; the English audit trail’s “men” should not control this translation.
  issues:
  - severity: low
    issue: The final Greek clause is subordinated in the draft.
    rationale: «ሳያውቁ ... ይሄዳሉ» is close in sense, but the Greek independently states that those walking over the tombs do not know. Retaining an independent negative clause more faithfully reflects the source structure and emphasis.
  - severity: low
    issue: Comparison phrase can be smoothed.
    rationale: Using «እንደ የማይታወቁ መቃብሮች» is more idiomatic and visually clear in modern standard Amharic while retaining the source ambiguity.
  revised_text: ወዮላችሁ፤ እናንተ እንደ የማይታወቁ መቃብሮች ናችሁና፤ በላያቸው የሚሄዱ ሰዎችም አያውቋቸውም።
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s sound rendering of ἄδηλα as “unknown/unnoticed,” avoiding the interpretively narrower “unmarked.” It restores the final clause as an explicit assertion and supplies the naturally understood object «-አቸው» (“them,” the tombs) for clarity in Amharic. No footnotes are required by the source text or provided audit trail.
