  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: am
  text: ወዮላችሁ፤ እናንተ እንደ የማይታወቁ መቃብሮች ናችሁና፤ በላያቸው የሚሄዱ ሰዎችም አያውቋቸውም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ወዮላችሁ!
  rationale: የፍርድና የሐዘን ጩኸትን በተፈጥሯዊና በተከበረ አማርኛ ያስተላልፋል።
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: እንደማይታወቁ መቃብሮች
  rationale: ἄδηλα በቀጥታ ‘የማይታዩ/የማይታወቁ’ ማለት ነው፤ በዐውዱ ሰዎች መቃብር መሆናቸውን ሳይለዩ እንደሚረግጧቸው ያመለክታል። ‘ምልክት የሌላቸው’ የሚለውን የተወሰነ ትርጓሜ ሳያስገድድ የምንጩን ስፋት ይጠብቃል።
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: ሰዎችም ... በላያቸው ይሄዳሉ
  rationale: ἄνθρωποι በዚህ አጠቃላይ ሰዎችን ያመለክታል፤ የግሪኩን ተውላጠ ስም ማጣቀሻ በአማርኛ ግልጽ ለማድረግ ‘በላያቸው’ ተብሏል።
- source_word: οὐκ οἴδασιν
  choice: ሳያውቁ
  rationale: እነርሱ ከላያቸው የሚሄዱት መቃብርነታቸውን ሳያውቁ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የማይታወቁት መቃብሮች ምስል
  choice: ምስሉን ያለ ማብራሪያ በዋናው ጽሑፍ ማቆየት
  alternative: ሰዎችን በሥርዓታዊ ርኩሰት እንደሚያረክሱ በግልጽ መጨመር
  rationale: የቁጥሩ የባህልና የሥርዓት ዳራ ይህን ጥቅስ ሊያበራ ቢችልም፣ ምንጩ ያልገለጸውን ትርጓሜ በዋናው ጽሑፍ ውስጥ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እናንተ’ የሚለው አጽንዖት ἐστὲ እና ὑμῖνን ተከትሎ ተጠብቋል፤ የግሪኩ ἄνθρωποι ጾታን የማይወስን በመሆኑ ‘ሰዎች’ ተመርጧል።
