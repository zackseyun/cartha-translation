- from: ወዮላችሁ! ምክንያቱም እናንተ እንደማይታወቁ መቃብሮች ናችሁ፤ ሰዎችም ሳያውቁ በላያቸው ይሄዳሉ።
  to: ወዮላችሁ፤ እናንተ እንደ የማይታወቁ መቃብሮች ናችሁና፤ በላያቸው የሚሄዱ ሰዎችም አያውቋቸውም።
