- source_word: ἐζήτουν
  choice: ይጠይቁ ነበር
  rationale: በዚህ ዐውድ ζητέω ምልክትን መጠየቅን ያመለክታል፤ የግሱ ኢምፐርፌክት ቅርጽ የሚያሳየውን ቀጣይ ወይም ተደጋጋሚ ድርጊት «ነበር» ይጠብቃል።
- source_word: παρ’ αὐτοῦ
  choice: ከእርሱ
  rationale: ምልክቱን የጠየቁት ከኢየሱስ መሆኑን፣ παρά ከወራሽ ጋር የሚገልጸውን ምንጭ፣ በግልጽ ያስተላልፋል።
