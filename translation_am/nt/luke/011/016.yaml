  alternative: የሰማይ ምልክት
  rationale: ዋናው ንባብ ምልክቱ ከሰማይ እንዲመጣ መጠየቃቸውን ያሳያል፤ ከግሪኩ በላይ የሆነ የሥነ መለኮት ዝርዝር አያክልም።
