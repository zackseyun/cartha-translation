lexical_decisions:
- source_word: ἕτεροι
  choice: ሌሎች
  rationale: ከቀደመው ቡድን የተለዩ ሰዎችን የሚያመለክተውን ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
