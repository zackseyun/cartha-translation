- source_word: πειράζοντες
  choice: እርሱን እየፈተኑ
  rationale: በጥላቻ ወይም በተንኮል የሚደረግን ፈተና ይገልጣል፤ ቀጣይነት ያለውንም የአሁን ጊዜ ቦዝ አንቀጽ ያንጸባርቃል።
- source_word: σημεῖον
  choice: ምልክት
