review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the participial clause, the general maxim, the internal-division sense, and the compressed image of one house falling upon another. However, ἐρημοῦται denotes being devastated or made desolate, a stronger result than merely ‘falls apart’ (ይፈርሳል).
  naturalness: The Amharic is clear, modern, and appropriately dignified. “ቤትም በቤት ላይ ይወድቃል” naturally retains the deliberately compact concrete image.
  terminology: “አሳባቸውን,” “መንግሥት ሁሉ,” and “ቤት” are suitable. The note properly preserves the lexical range of οἶκος without imposing the household sense on the main text.
