  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: am
  text: እርሱ ግን አሳባቸውን አውቆ እንዲህ አላቸው፤ “በራሱ ላይ የተከፋፈለ መንግሥት ሁሉ ይወድማል፤ ቤትም በቤት ላይ ይወድቃል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቤተሰብ በቤተሰብ ላይ ይወድቃል።” የግሪኩ οἶκος ቃል ሕንፃ የሆነን ቤት ወይም ቤተሰብን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: አውቆ
  rationale: የግሱን የአእምሮ ማወቅ ትርጉምና ከዋናው ግስ ጋር ያለውን የቦዝ አንቀጽ ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: διανοήματα
  choice: አሳባቸውን
  rationale: ውስጣዊ ሐሳቦቻቸውንና የአእምሮ አመዛዛኞቻቸውን ያመለክታል፤ ጥላቻ ወይም ክፉ ዓላማ በግልጽ ሳይጨምር ትርጉሙን ይጠብቃል።
- source_word: Πᾶσα βασιλεία
  choice: መንግሥት ሁሉ
  rationale: πᾶσα ያለውን አጠቃላይና አከፋፋይ ኃይል በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ያሳያል።
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: በራሱ ላይ የተከፋፈለ
  rationale: ቀላል መከፋፈልን ብቻ ሳይሆን ውስጣዊ ተቃርኖን የሚያሳየውን የግሪኩን አገላለጽ ይጠብቃል።
- source_word: ἐρημοῦται
  choice: ይፈርሳል
  rationale: ቃል በቃል ‘ወና ይሆናል’ ሊባል ቢችልም፣ በዚህ ምሳሌያዊ ንግግር የሚከተለውን ውድመትና መፍረስ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οἶκος ἐπὶ οἶκον
  choice: ቤትም በቤት ላይ
  rationale: የግሪኩን አጭርና ምስላዊ አገላለጽ ይጠብቃል፤ οἶκος ሕንፃንም ሆነ ቤተሰብን/ቤተሰባዊ ክፍልን ሊያመለክት የሚችለው አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: πίπτει
  choice: ይወድቃል
  rationale: የአሁን ጊዜውን ምሳሌያዊ አነጋገርና የመውደቅን ምስል በቀጥታ ይጠብቃል።
theological_decisions:
- issue: በሁለተኛው ሐረግ οἶκος የሚለው ቃል ትርጉም
  choice: በዋናው ጽሑፍ “ቤት” ተብሎ ተተርጉሟል።
  alternative: “ቤተሰብ” ወይም “ቤተሰብ በቤተሰብ ላይ”
  rationale: ግሪኩ ማኅበራዊውን ትርጉም ብቻ የሚያስገድድ ግልጽ ምልክት የለውም። “ቤት” የሚለው ምስሉንና የቃሉን አሻሚነት ይጠብቃል፤ የቤተሰብ አማራጭ ትርጉም በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። “በራሱ ላይ የተከፋፈለ” የመጽሐፍ ቅዱስ የተለመደ ክብር ያለውን አገላለጽ ሲጠብቅ ለዘመናዊ አንባቢም ተረድቶ ይነበባል።
