id: LUK.11.24
reference: Luke 11:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: am
  text: “ርኩስ መንፈስ ከሰውየው በወጣ ጊዜ፣ ዕረፍት እየፈለገ ውኃ በሌለባቸው ስፍራዎች ያልፋል፤ ሳያገኝም፣ ‘ከወጣሁበት ቤቴ ወደ ቤቴ እመለሳለሁ’ ይላል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν ... ἐξέλθῃ
  choice: በወጣ ጊዜ
  rationale: የግሪኩን አጠቃላይ ጊዜያዊ ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: ርኩስ መንፈስ
  rationale: በአማርኛ የወንጌል ቋንቋ የተለመደ ሲሆን የንጽሕና ጉድለትንና የክፋትን ፍቺ ይጠብቃል።
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ከሰውየው
  rationale: በምሳሌያዊ ትረካው የተወሰነ ተወካይ ሰው መሆኑን ይጠብቃል፤ አማርኛውም ተፈጥሯዊ ነው።
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: ውኃ በሌለባቸው ስፍራዎች ያልፋል
  rationale: ἀνύδρων በቀጥታ ‘ውኃ የሌለባቸው’ ማለት ስለሆነ ምስሉን ሳይተረጉም ይጠብቃል።
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ዕረፍት እየፈለገ
  rationale: ተያያዥ ድርጊቱን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: καὶ μὴ εὑρίσκον
  choice: ሳያገኝም
  rationale: የተፈለገው ዕረፍት ከቀደመው ሐረግ በግልጽ ስለሚገባ ተሳቢውን ሳይደግም የግሪኩን ፍሰት ይጠብቃል።
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: ወደ ... ቤቴ እመለሳለሁ
  rationale: የወደፊት ውሳኔውንና የቤት ምስሉን በግልጽ ይጠብቃል።
- source_word: ὅθεν ἐξῆλθον
  choice: ወደ ወጣሁበት
  rationale: ከ‘ቤቴ’ ጋር በተፈጥሯዊ አማርኛ ተዋሕዶ የመውጣቱን ምስል ይደግማል።
theological_decisions:
- issue: የ‘ርኩስ መንፈስ’ ማንነት
  choice: እንደሚወጣ፣ እንደሚፈልግና እንደሚናገር የቀረበ ግላዊ ክፉ መንፈስ ሆኖ ተተርጉሟል።
  alternative: የሥነ ምግባር መመለስ ምሳሌ ወይም ግላዊ ያልሆነ ኃይል
  rationale: ጽሑፉ ራሱ ለመንፈሱ ግላዊ ድርጊቶችንና ንግግርን ይሰጣል፤ ትርጉሙ ይህን አቀራረብ አያሳንስም።
- issue: የἀνθρώπου አቀራረብ
  choice: ከሰውየው
  alternative: ከአንድ ሰው / ከግለሰቡ
  rationale: መስተዋድዱ ያለውን ነጠላ ተወካይ ሰው ያሳያል፤ ‘ሰውየው’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ውኃ በሌለባቸው ስፍራዎች’ የግሪኩን ቀጥተኛ ፍቺ ስለሚሰጥ የ‘ደረቅ ስፍራዎች’ አማራጭ የግርጌ ማስታወሻ አላስፈለገም።
