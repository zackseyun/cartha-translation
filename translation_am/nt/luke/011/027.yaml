- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: እርሱ ይህን ሲናገር
  rationale: ድርጊቶቹ በአንድ ጊዜ እየተከናወኑ መሆናቸውንና የንግግሩን ቀጣይነት ያሳያል።
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: አንዲት ሴት ድምፅዋን ከፍ አድርጋ
  rationale: የግሪኩን ፈሊጣዊ አነጋገር በተፈጥሯዊ አማርኛ ይገልጣል፤ τις ደግሞ በ“አንዲት” እንደ ያልተወሰነ መጠቀሻ ተተርጉሟል።
- source_word: ἐκ τοῦ ὄχλου
  choice: ከሕዝቡ መካከል
  rationale: ሴቲቱ ከተሰበሰበው ሕዝብ መካከል መሆኗን በግልጽ አማርኛ ያሳያል።
- source_word: Μακαρία
  choice: ብፁዓን ናቸው
  rationale: ከተራ ደስታ ይልቅ የተከበረና የተባረከ ሁኔታን የሚገልጠውን መጽሐፍ ቅዱሳዊ ኃይል ይጠብቃል። ማሕፀንና ጡቶች በአንድነት ስለተጠቀሱ የብዙ ቁጥር አገባብ ተጠቅሟል።
- source_word: ἡ κοιλία
  choice: ማሕፀን
  rationale: በዚህ የእናትነት አውድ κοιλία በትክክል የሚያመለክተው ማሕፀንን ነው።
- source_word: ἡ βαστάσασά σε
  choice: የተሸከመችህ
  rationale: በእርግዝና ወቅት መሸከምን በግልጽ ይገልጣል፤ መውለድ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: የጠባሃቸው ጡቶች
  rationale: የግሪኩን ሰዋሰዋዊ አቅጣጫ—ኢየሱስ ጡቶቹን መጥባቱን—ይጠብቃል፤ አካላዊውን የእናትነት ምስልም ያለ ማለዘብ ያቀርባል።
theological_decisions:
- issue: ኢየሱስን የወለደችውን እናት በሚያከብረው ንግግር μακαρία የሚለውን መተርጎም
  choice: የተሸከመችህ ማሕፀንና የጠባሃቸው ጡቶች ብፁዓን ናቸው
  alternative: ደስተኞች ናቸው / ዕድለኞች ናቸው
  rationale: “ብፁዓን” የሴቲቱን የክብር አዋጅ በትክክል ይጠብቃል፤ ስለ ኢየሱስ እናት ያለውን የጥቅሱን ኃይል አያሳንስም፣ ከጽሑፉ በላይም የኋላ ዘመን የእምነት ትምህርት አይጨምርበትም።
