base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: am
  text: 'እርሱ እነዚህን ነገሮች ሲናገር እንዲህ ሆነ፤ ከሕዝቡ መካከል አንዲት ሴት ድምፅዋን ከፍ አድርጋ[a]፣ “የተሸከመችህ ማሕፀን[b]ና የጠባሃቸው ጡቶች ብፁዓን ናቸው!” አለችው።


    [a] ወይም፣ “ጮክ ብላ።” የግሪኩ አነጋገር “ድምፅዋን ከፍ አደረገች” ወይም “ጮኸች” ማለት ነው።


    [b] ወይም፣ “የወለደችህ ማሕፀን።” የግሪኩ ግስ በእርግዝና መሸከምን ወይም መውለድን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጮክ ብላ።” የግሪኩ አነጋገር “ድምፅዋን ከፍ አደረገች” ወይም “ጮኸች” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የወለደችህ ማሕፀን።” የግሪኩ ግስ በእርግዝና መሸከምን ወይም መውለድን ሊያመለክት ይችላል።
    reason: lexical_alternative
