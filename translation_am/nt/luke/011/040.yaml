  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: am
  text: እናንተ ሞኞች! ውጫዊውን የሠራው ውስጣዊውንም አልሠራምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ውጩን … ውስጡን።” አገላለጹ በቅርብ ዐውድ የዕቃውን ውጭና ውስጥ፣ በሰፊ አንድምታ ደግሞ የሰውን ውጫዊና ውስጣዊ ሕይወት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: እናንተ ሞኞች
  rationale: ብዙ ሰዎችን በቀጥታ የሚገሥጽ የጥሪ አገላለጽ ነው፤ ይህ ትርጉም የቃሉን ጥንካሬ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐχ ... ἐποίησεν;
  choice: አልሠራምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን አሉታዊ የንግግር ጥያቄ ይጠብቃል።
- source_word: ὁ ποιήσας
  choice: የሠራው
  rationale: በግሪክኛው ስም ሆኖ የሚሠራውን አንቀጽ ‘የሠራው’ በሚል አጭርና ተፈጥሯዊ አገላለጽ ያቀርባል፤ እግዚአብሔርን በግልጽ ሳይጨምር የግለሰብ አመልካቹን ይጠብቃል።
- source_word: τὸ ἔξωθεν
  choice: ውጫዊውን
  rationale: በቅርብ ዐውድ የዕቃውን ውጭ፣ በሰፊ አንድምታም የሰውን ውጫዊ ሕይወት ሊያመለክት የሚችለውን ስፋት ይጠብቃል።
- source_word: τὸ ἔσωθεν
  choice: ውስጣዊውን
  rationale: ከ‘ውጫዊውን’ ጋር ትይዩነቱን ይጠብቃል፤ የዕቃውን ውስጥም ሆነ የሰውን ውስጣዊ ሕይወት የማመልከት አቅሙን አይገድብም።
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው ተያያዥ ቅጥያ ‘-ም’ በዚህ ዐውድ ‘ደግሞ/እንዲሁም’ የሚለውን አመክንዮ በተፈጥሯዊነት ያሳያል።
theological_decisions:
- issue: ‘የሠራው’ የሚያመለክተው ማንን ነው?
  choice: ፈጣሪ የሆነውን እግዚአብሔር በተዘዋዋሪ ያመለክታል፤ ስሙ ግን በትርጉሙ አልተጨመረም።
  alternative: የጽዋውን ወይም የዕቃውን ሠሪ ብቻ እንደሚያመለክት መውሰድ።
  rationale: ንግግሩ የዕቃውን ምሳሌ በቅርብ ዐውድ ሲጠቀም፣ ውጫዊውንና ውስጣዊውን የፈጠረውን እግዚአብሔር በሰፊ አንድምታ ያመለክታል። ግሪክኛው ያልገለጠውን ‘እግዚአብሔር’ በጽሑፉ ውስጥ አለመጨመር ሁለቱንም የአነባበብ ደረጃዎች ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እናንተ ሞኞች!’ የግሪክኛውን የቀጥታ ተግሣጽ ይጠብቃል፤ ‘ውጫዊውን/ውስጣዊውን’ ደግሞ የዕቃውንና የሰው ሕይወትን ድርብ አንድምታ ክፍት ያደርጋል።
