  revision_rationale: 'The revision corrects two Amharic idiom and scope issues while preserving the source’s meaning and the ambiguity of “the love of God.” It does not alter the contrast in the final sentence: justice and God’s love are to be practiced, and the tithing practices are not thereby to be left undone.'
