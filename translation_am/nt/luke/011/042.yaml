id: LUK.11.42
reference: Luke 11:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: am
  text: ነገር ግን እናንተ ፈሪሳውያን ወዮላችሁ! ከአዝሙድ፣ ከጤና አዳምና ከማንኛውም ቅጠላ ተክል አሥራት ታወጣላችሁ፤ ፍትሕንና የእግዚአብሔርን ፍቅር ግን ቸል ትላላችሁ። እነዚህን ማድረግ፣ እነዚያንም አለመተው ይገባችሁ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδύοσμον
  choice: አዝሙድ
  rationale: የግሪኩን mint በዘመናዊ አማርኛ የተለመደውን የቅመም ተክል ስም ይገልጻል።
- source_word: πήγανον
  choice: ጤና አዳም
  rationale: rue የተባለውን ተክል በኢትዮጵያ አጠቃቀም በሚታወቅ ስም ያቀርባል።
- source_word: πᾶν λάχανον
  choice: ማንኛውም የአትክልት ቅጠል
  rationale: λάχανον እዚህ ለምግብ ወይም ለቅመም የሚውል የተተከለ ቅጠላማ ተክልን ያመለክታል፤ ‘ቅጠል’ በአውዱ የሚቆጠረውን አነስተኛ ምርት ግልጽ ያደርጋል።
- source_word: παρέρχεσθε
  choice: ታልፋላችሁ
  rationale: ቃሉ ቃል በቃል ‘አጠገብ ማለፍ/ማለፍ’ የሚለውን ምስል ይጠብቃል፤ ‘ቸል ትላላችሁ’ ብሎ ትርጉሙን ብቻ ከመፍታት ይልቅ የምንጩን አገላለጽ ያቆያል።
- source_word: κρίσιν
  choice: ፍትሕ
  rationale: በዚህ ሥነ ምግባራዊ አውድ κρίσις ትክክለኛና ፍትሐዊ አድራጎትን ያመለክታል።
- source_word: ἀγάπην τοῦ θεοῦ
  choice: የእግዚአብሔርን ፍቅር
  rationale: የግሪኩን ጄኒቲቭ ሳይፈታ ይጠብቃል፤ እግዚአብሔርን መውደድ ወይም ከእርሱ የሚመጣ ፍቅር የሚሉትን የአገላለጹን ክፍትነት አይዘጋም።
theological_decisions:
- issue: የ‘የእግዚአብሔር ፍቅር’ ጄኒቲቭ ትርጉም
  choice: የእግዚአብሔርን ፍቅር
  alternative: እግዚአብሔርን መውደድ
  rationale: ምንጩ ያለውን ሰዋሰዋዊና ሥነ መለኮታዊ አሻሚነት ሳይፈታ ለአንባቢው ያስተላልፋል።
- issue: የአሥራትና የፍትሕ/ፍቅር ግዴታ ግንኙነት
  choice: እነዚህን ማድረግ፣ እነዚያንም አለመተው ይገባችሁ ነበር
  alternative: ዋናዎቹን ብቻ ማድረግ ይገባችሁ ነበር
  rationale: ኢየሱስ ፍትሕንና ፍቅርን ቀዳሚ ግዴታ አድርጎ ሲያቀርብ፣ ሌላውንም እንዳይተዉ የሚለውን የግሪክ ንጽጽር ሙሉ በሙሉ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ታልፋላችሁ’ የምንጩን ምሳሌያዊ ኃይል ይጠብቃል፤ ዐረፍተ ነገሩም ለአማርኛ ተፈጥሯዊ በሆነ ሥርዓት ተደርድሯል።
