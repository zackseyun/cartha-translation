  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘እነሆ’ የጽሑፉን አጽንዖት ለመጠበቅ ተቀምጧል፤ አሻሚው πλεῖον ደግሞ በዋናው ጽሑፍና በማስታወሻው ሳይጠበብ ቀርቧል።
