  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: am
  text: የነነዌ ወንዶች በፍርድ ጊዜ ከዚህ ትውልድ ጋር ተነሥተው ያወግዙታል፤ ምክንያቱም በዮናስ ስብከት ንስሐ ገቡ፤ እነሆም፣ ከዮናስ የሚበልጥ ነገር እዚህ አለ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከዮናስ የሚበልጥ ሰው እዚህ አለ” ወይም “ከዮናስ የበለጠ እዚህ አለ።” በግሪክኛ ያለው ቃል ገለልተኛ ቅርጽ (“የሚበልጥ/የበለጠ”) ነው፤ ስለዚህ የግል ንጽጽርን ብቻ ሳይሆን በኢየሱስና በአገልግሎቱ የተገኘውን የላቀ እውነታ በሰፊው ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: የነነዌ ሰዎች
  rationale: ἄνδρες በቀጥታ ‘ወንዶች’ ሊባል ቢችልም፣ በአማርኛ ‘የነነዌ ሰዎች’ የከተማዋን ነዋሪዎች በተፈጥሯዊ እና በክብር የሚገልጽ ሲሆን የቡድኑን ማንነት ይጠብቃል።
- source_word: ἀναστήσονται
  choice: ተነሥተው
  rationale: በፍርድ ዐውድ ውስጥ መነሣትን ያሳያል፤ የትንሣኤን ፍንጭ ሳያጠፋ ከሚቀጥለው ግስ ጋር ተፈጥሯዊ አማርኛ ይፈጥራል።
- source_word: ἐν τῇ κρίσει
  choice: በፍርድ ጊዜ
  rationale: የመጨረሻውን የፍርድ ክስተት በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ከዚህ ትውልድ ጋር
  rationale: μετά የሚያመለክተውን አብሮነት እና ‘ይህ ትውልድ’ የሚለውን የወንጌላት አገላለጽ በቀጥታ ይጠብቃል።
- source_word: κατακρινοῦσιν αὐτήν
  choice: ይፈርዱበታል
  rationale: በአማርኛ ‘በእርሱ ላይ ይፈርዳሉ’ የሚለውን የውግዘት ፍርድ በተፈጥሯዊ መንገድ ይገልጻል፤ ተውላጠ ስሙም ወደ ‘ትውልድ’ ይመለሳል።
- source_word: μετενόησαν
  choice: ንስሐ ገብተዋል
  rationale: በነቢያዊው ዐውድ ያለውን የልብና የኑሮ መመለስ በዘመናዊ መደበኛ አማርኛ በግልጽ ያስተላልፋል።
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: በዮናስ ስብከት
  rationale: ለዮናስ አዋጅ ምላሽ ሰጥተው ንስሐ መግባታቸውን በአጭርና ተፈጥሯዊ መልኩ ያሳያል።
- source_word: ἰδοὺ
  choice: እነሆም
  rationale: የጽሑፉን አጽንዖትና ክቡር ንግግር ይጠብቃል።
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ከዮናስ የሚበልጥ ነገር እዚህ አለ
  rationale: πλεῖον ገለልተኛ ነጠላ ቅርጽ ስለሆነ ‘ነገር’ በማለት የግሪኩን ሰፊ አመልካችነት ይጠብቃል፤ በግለሰብ ንጽጽር ብቻ አይገድበውም።
theological_decisions:
- issue: የπλεῖον Ἰωνᾶ አመልካችና ኃይል
  choice: ከዮናስ የሚበልጥ ነገር እዚህ አለ
  alternative: ከዮናስ የሚበልጥ ሰው እዚህ አለ፤ ወይም፣ ከዮናስ የበለጠ እዚህ አለ
  rationale: ‘ነገር’ የሚለው የግሪኩን ገለልተኛ ቅርጽ በመጠበቅ ኢየሱስን እና በእርሱ የተገኘውን የላቀ እውነታ ሊያካትት የሚችለውን ሥነ መለኮታዊ ውጥረት ክፍት ያደርጋል።
