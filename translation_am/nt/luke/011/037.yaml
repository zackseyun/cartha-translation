  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: am
  text: እርሱም ሲናገር፣ አንድ ፈሪሳዊ ከእርሱ ጋር ምግብ እንዲበላ[a] ጠየቀው፤ እርሱም ገብቶ በማዕድ ተደግፎ ተቀመጠ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የማለዳ ምግብ እንዲበላ» ወይም «የቀትር ምግብ እንዲበላ»፤ የግሪኩ ግስ በቀኑ ቀደም ብሎ የሚበላ ምግብን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም በዚያን ዘመን በድግስ ጊዜ በተለመደው ሁኔታ ተደግፎ መቀመጡን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: እርሱም ሲናገር
  rationale: ἐν ከመስተዋድድ ያለው የግስ ስም ከዋናው ድርጊት ጋር በአንድ ጊዜ የሚከናወን ድርጊትን ያመለክታል፤ «ሲናገር» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐρωτᾷ
  choice: ጠየቀው
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜ ግስ ቢጠቀምም፣ በአማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊ ነው። ግሱን «ጠየቀው» ማለት የመጋበዙን ሐሳብ በተከታዩ ሐረግ እንዲገለጥ ያደርጋል።
- source_word: Φαρισαῖος
  choice: አንድ ፈሪሳዊ
  rationale: ያለ የተወሰነነት አመልካች የመጣውን ነጠላ ስም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὅπως ἀριστήσῃ
  choice: ምግብ እንዲበላ
  rationale: ἀριστάω የማለዳን ወይም የቀትርን ምግብ ሊያመለክት ቢችልም፣ አውዱ ሰዓቱን በግልጽ አይወስንም፤ አጠቃላዩ አተረጓጎም ይህን አሻሚነት ይጠብቃል።
- source_word: παρ’ αὐτῷ
  choice: ከእርሱ ጋር
  rationale: የግሪኩን «ከእርሱ ጋር/በእርሱ ዘንድ» የሚለውን ትርጉም ይጠብቃል፤ ጽሑፉ በግልጽ «በቤቱ» ስለማይል ቦታውን አይጨምርም።
- source_word: εἰσελθὼν
  choice: ገብቶ
  rationale: ከዋናው ግስ በፊት የሆነውን ድርጊት በአጭርና ተፈጥሯዊ የአማርኛ ግስ ቅጽ ያቀርባል።
- source_word: ἀνέπεσεν
  choice: በማዕድ ተደግፎ ተቀመጠ
  rationale: በጥንቱ የድግስ ልማድ ለምግብ ተደግፎ መቀመጥን ያመለክታል፤ «ተቀመጠ» ብቻ የአካል አቀማመጡን ስለሚያጠፋ፣ ይህ ሐረግ ታሪካዊ ምስሉን በሚገባ ያስተላልፋል።
