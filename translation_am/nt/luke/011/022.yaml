  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: am
  text: ነገር ግን ከእርሱ የበረታ ሰው መጥቶ ድል ባደረገው[a] ጊዜ፣ እርሱ ይተማመንበት የነበረውን ሙሉ ትጥቁን[b] ይወስዳል፤ ምርኮውንም[c] ያከፋፍላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ካሸነፈው” ወይም “ከረታው።”
    reason: lexical_alternative
  - marker: b
    text: “ሙሉ ትጥቅ” የሚለው ሙሉውን የጦር ትጥቅ የሚያመለክተውን ቃል ይተረጉማል።
    reason: lexical_alternative
  - marker: c
    text: ወይም “የማረከውን ንብረት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: ነገር ግን … በ… ጊዜ
  rationale: δέ ከቀደመው ሁኔታ ጋር ያለውን ንፅፅር ያሳያል፤ ἐπάν ያለው ጊዜያዊና ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: ἰσχυρότερος αὐτοῦ
  choice: ከእርሱ የበረታ ሰው
  rationale: የንፅፅር ቅርጹን በግልጽ አማርኛ ያቀርባል። “ሰው” በግሪኩ በቀጥታ ባይጻፍም በአማርኛ የስማዊውን ቅጽ በተፈጥሮ ለመግለጽ ተጨምሯል፤ የቀደመው ቁጥርም ይህን ምስል ያቀርባል።
- source_word: ἐπελθὼν
  choice: መጥቶ
  rationale: ቃሉ በእርሱ ላይ መምጣትን ያመለክታል፤ የግጭቱ ኃይል ከቀጣዩ ግስ ስለሚታወቅ “አጥቅቶ” የሚል ትርጓሜ አልተጨመረም።
- source_word: νικήσῃ αὐτόν
  choice: ድል ባደረገው
  rationale: በዚህ የግጭት ምስል ውስጥ ተቃዋሚውን በኃይል ማሸነፍን በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: ሙሉ ትጥቁን
  rationale: πανοπλία ሙሉውን የጦር ትጥቅ ያመለክታል፤ “ሙሉ ትጥቅ” ይህን ሙሉነት ሳይጥል በቀላሉ ይነበባል።
- source_word: αἴρει
  choice: ይወስድበታል
  rationale: ተሸናፊው የተማመነበት ትጥቅ ከእርሱ እንደሚወሰድ ያለውን ዐውድ በግልጽ ያሳያል።
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: ይተማመንበት የነበረውን
  rationale: ቀድሞ በትጥቁ ላይ የነበረውን የጸና እምነትና መደገፍ ይገልጣል።
- source_word: τὰ σκῦλα αὐτοῦ
  choice: ምርኮውን
  rationale: σκῦλα ከተሸነፈ ጠላት የሚወሰዱ ምርኮዎችን ያመለክታል፤ “ምርኮ” የጦርነት ምስሉን በአጭርና በተለመደ አማርኛ ይጠብቃል።
- source_word: διαδίδωσιν
  choice: ያከፋፍላል
  rationale: የተያዘውን ምርኮ ለሌሎች መከፋፈልን ወይም ማደልን በትክክል ያሳያል።
theological_decisions:
- issue: “ከእርሱ የበረታውን” ሰው በመጨመር መግለጽ ወይም ግሪኩን ቃል በቃል ስም ሳይጨምሩ መተርጎም
  choice: ከእርሱ የበረታ ሰው
  alternative: ከእርሱ የበረታው
  rationale: ግሪኩ ቅጽልን እንደ ስም ይጠቀማል። በአማርኛ “ሰው” መጨመር ሐሳቡን ተፈጥሯዊ ያደርገዋል፤ ከዐውዱ ውጭ የሆነ ማንነት ወይም ሥነ መለኮታዊ ትርጓሜ ግን አያስገባም።
- issue: νικάω በግጭቱ ምስል ውስጥ ምን ያህል በኃይል እንዲተረጎም
  choice: ድል ባደረገው
  alternative: ካሸነፈው፤ ከረታው
  rationale: የመሣሪያ መነጠቅና የምርኮ መከፋፈል ውጤት ያለውን ተጨባጭ ድል ይገልጣል፤ ነገር ግን ጠንካራውን ወይም ከእርሱ የበረታውን በስም በመለየት ከጽሑፉ በላይ አይተረጉምም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። “ትጥቅ፣” “ድል ማድረግ” እና “ምርኮ” የሚሉት ቃላት የግጭቱን ምስል ያቆያሉ፤ የምሳሌውን ተዋናዮች በሥነ መለኮታዊ ስም በቀጥታ አይለዩም።
