  source_fidelity: 'The translation accurately represents all major elements of the Greek: the prophetic denunciation (οὐαί), the addressed legal specialists (τοῖς νομικοῖς), removal of the key of knowledge, the emphatic contrast in αὐτοὶ, the unexpanded entrance metaphor, and hindering those entering. It does not add an object such as the kingdom to the implicit ‘enter.’'
  naturalness: The Amharic is clear, idiomatic, and suitably weighty for a public denunciation. “ወዮላችሁ,” “የሕግ ሊቃውንት,” and “አገዳችሁ” are natural in a formal modern biblical register. “እየገቡ የነበሩትን” adequately conveys the ongoing sense of the present participle.
  terminology: “የሕግ ሊቃውንት” appropriately avoids the misleading modern-professional sense of ‘lawyers’ while retaining the sense of specialists in Jewish law. “የእውቀትን ቁልፍ” preserves the Greek metaphor and genitive relation. The footnotes are correctly anchored and give appropriate lexical alternatives without doctrinal expansion.
