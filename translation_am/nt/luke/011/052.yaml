  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: am
  text: '“እናንተ የሕግ ሊቃውንት[a] ወዮላችሁ! የእውቀትን ቁልፍ[b] አስወገዳችሁና፤ እናንተ ራሳችሁ አልገባችሁም፣ እየገቡ የነበሩትንም አገዳችሁ።”


    [a] ይህ አገላለጽ የአይሁድን ሕግ በሚገባ የሚያውቁና የሚያስተምሩ ሰዎችን ያመለክታል፤ የዘመናችንን ጠበቆች አያመለክትም። ወይም፣ “የሕግ አዋቂዎች።”


    [b] ወይም፣ “ወደ እውቀት የሚያስገባውን ቁልፍ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ አገላለጽ የአይሁድን ሕግ በሚገባ የሚያውቁና የሚያስተምሩ ሰዎችን ያመለክታል፤ የዘመናችንን ጠበቆች አያመለክትም። ወይም፣ “የሕግ አዋቂዎች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ወደ እውቀት የሚያስገባውን ቁልፍ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ወዮላችሁ
  rationale: የትንቢታዊ ወቀሳና የፍርድ ማስጠንቀቂያ ኃይልን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: νομικοῖς
  choice: የሕግ ሊቃውንት
  rationale: ቃሉ የሙሴን ሕግ የተማሩ ባለሙያዎችን እንጂ የዘመናችንን ፍርድ ቤት ጠበቆች አያመለክትም፤ ይህ ምርጫ በአማርኛ ያንን ታሪካዊ ትርጉም ግልጽ ያደርጋል።
- source_word: ἤρατε
  choice: አስወገዳችሁ
  rationale: እዚህ αἴρω ቁልፉን በቀላሉ ማንሳት ሳይሆን ሌሎች እንዳይጠቀሙበት ከቦታው ማስወገድን ያሳያል።
- source_word: κλεῖδα τῆς γνώσεως
  choice: የእውቀትን ቁልፍ
  rationale: የግሪኩን የገዢ ቅጽ በቅርብ ይከተላል፣ የመድረሻና የመግቢያ ዘይቤውንም አይፈታውም።
- source_word: αὐτοὶ
  choice: እናንተ ራሳችሁ
  rationale: አጽንዖታዊውን ተውላጠ ስም በግልጽ በማሳየት በመሪዎቹና በሚገቡት መካከል ያለውን ንፅፅር ይጠብቃል።
- source_word: οὐκ εἰσήλθατε
  choice: አልገባችሁም
  rationale: የተገባበትን ነገር ሳይጨምር የመግባትን ዘይቤ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοὺς εἰσερχομένους
  choice: እየገቡ የነበሩትን
  rationale: የአሁን ጊዜ አንቀጽ የሚያሳየውን ቀጣይ ሂደት ያስተላልፋል፤ ‘ለመግባት የሞከሩት’ የሚል በጽሑፉ ያልተገለጸ ሐሳብ አይጨምርም።
- source_word: ἐκωλύσατε
  choice: አገዳችሁ
  rationale: የመግባቱ ውጤት ሙሉ በሙሉ እንደተከለከለ ሳያስገድድ፣ መንገድ መዝጋትንና እንቅፋት መሆንን ያሳያል።
theological_decisions:
- issue: ‘መግባት’ እና ‘የእውቀት ቁልፍ’ የሚሉት ዘይቤያዊ አገላለጾች ምን እንደሚያመለክቱ
  choice: የመድረስና የመግባት ዘይቤው በዋናው ጽሑፍ ያለ ተጨማሪ ማብራሪያ ተጠብቋል።
  alternative: ‘ወደ እግዚአብሔር መንግሥት መግባት’ ወይም ‘እግዚአብሔርን ወደ ማወቅ መግባት’ ብሎ በግልጽ መተርጎም።
  rationale: የግሪኩ ጽሑፍ ወዴት እንደሚገቡ በግልጽ አይሰይምም። ይህን ክፍትነት መጠበቅ ጥቅሱ ራሱ ያልወሰነውን ሥነ መለኮታዊ ፍቺ ከመጨመር ይቆጥባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ሊቃውንት” በዚህ ሃይማኖታዊና ታሪካዊ አውድ የታወቀ ሲሆን፣ ከ“ጠበቆች” የሚነሳውን ዘመናዊ የፍትሕ ሙያ ግንዛቤ ያስወግዳል። ሥርዓተ ነጥቡ የወቀሳውን ኃይልና የሁለቱን ክሶች ትይዩነት ግልጽ ያደርጋል።
