id: LUK.11.15
reference: Luke 11:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: am
  text: ነገር ግን ከእነርሱ አንዳንዶቹ፣ “እርሱ አጋንንትን የሚያስወጣው በአጋንንት ገዥው ብዔልዜቡል ነው” አሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ብዔልዜቡብ» የሚለው የዚህ ስም ባህላዊ ቅርጽ ነው፤ እዚህ «ብዔልዜቡል» የተባለው የግሪኩን ጽሑፍ ቅርጽ በመከተል ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: ነገር ግን ከእነርሱ አንዳንዶቹ
  rationale: የቡድኑን አንድ ያልተወሰነ ክፍል የሚያመለክተውን ክፍላዊ ትርጉም ይጠብቃል፤ δὲ በአውዱ ያለውን ተቃርኖ በ«ነገር ግን» ያሳያል።
- source_word: Ἐν Βεελζεβοὺλ
  choice: በብዔልዜቡል
  rationale: ἐν እዚህ የድርጊቱን ኃይል ወይም ወኪልነት ያመለክታል፤ «በ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል። ስሙም የግሪኩን Βεελζεβούλ ቅርጽ በቅርብ ይከተላል።
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: በአጋንንት ገዥ
  rationale: ἄρχων ሥልጣን ያለውን ገዥ ያመለክታል፤ «የአጋንንት ገዥ» የበላይነትን ግንኙነት በግልጽ ያስተላልፋል። ከ«በብዔልዜቡል» ጋር በተያያዘ የቅጽል ሚናውን ለማሳየት «በ» ተደግሟል።
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: አጋንንትን የሚያስወጣው
  rationale: ἐκβάλλω በአጋንንት ማስወጣት አውድ «ማስወጣት» ተብሎ በግልጽና በዘመናዊ አማርኛ ይተረጎማል፤ δαιμόνια ደግሞ በቀጥታ «አጋንንት» ተብሏል።
- source_word: εἶπον
  choice: አሉ
  rationale: የአውሪስት ግስ ድርጊቱን እንደ ቀላል ያለፈ ክስተት ያቀርባል፤ «አሉ» ተፈጥሯዊና ቀጥተኛ ነው።
theological_decisions:
- issue: የΒεελζεβούλ ስም አተረጓጎም
  choice: ብዔልዜቡል
  alternative: ብዔልዜቡብ
  rationale: ዋናው ጽሑፍ በSBLGNT ያለውን Βεελζεβούλ ቅርጽ ይከተላል። የተለመደው ሌላ ቅርጽ እንዳይጠፋ በማስታወሻ ተጠቅሷል።
- issue: ἄρχων የሚገልጸው የሥልጣን ማዕረግ
  choice: የአጋንንት ገዥ
  alternative: የአጋንንት አለቃ
  rationale: «ገዥ» የሥልጣንና የበላይነት ሐሳቡን ግልጽ አድርጎ ያቀርባል፤ ጥቅሱ ከሚለው በላይ ዝርዝር የአጋንንት ሥርዓት አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ የክስ አወቃቀር በተፈጥሯዊው «የሚያስወጣው ... ነው» ቅርጽ ቀርቧል።
