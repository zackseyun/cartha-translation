reference: Luke 11:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: am
  text: እንዲህም አላቸው፦ “ከእናንተ መካከል ወዳጅ ያለው፣ በእኩለ ሌሊትም ወደ እርሱ ሄዶ፣ ‘ወዳጄ ሆይ፣ ሦስት ዳቦዎች አውሰኝ’ የሚለው ማን ነው?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእናንተ መካከል ወዳጅ የሚኖረውና በእኩለ ሌሊት ወደ እርሱ የሚሄደው፣ ‘… አውሰኝ’ የሚለው ማን ነው?” ግሪኩ በዚህ የንግግር ጥያቄ ውስጥ የወደፊት ጊዜ ቅርጾችን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: ከእናንተ መካከል … ማን ነው?
  rationale: ለአድማጮቹ የቀረበውን የንግግር ጥያቄ ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἕξει … πορεύσεται … εἴπῃ
  choice: ያለው … ሄዶ … ይለዋል
  rationale: የግሪኩን የወደፊት ጊዜ ቅርጾች በአማርኛ የንግግር ጥያቄ ውስጥ ተፈጥሯዊ በሆነ ቅደም ተከተል ይገልጻል፤ የቅርጽ ልዩነቱም በማስታወሻ ተጠብቋል።
- source_word: φίλον / Φίλε
  choice: ወዳጅ / ወዳጄ ሆይ
  rationale: የግሪኩን የቃል ድግግሞሽ ይጠብቃል፤ የጥሪው ቅርጽ ‘ወዳጄ ሆይ’ በአማርኛ ግልጽና ክብር ያለው ነው።
- source_word: μεσονυκτίου
  choice: እኩለ ሌሊት ላይ
  rationale: ጊዜን የሚያመለክተውን የግሪክ ጄኒቲቭ ቀጥተኛና የተለመደ በሆነ አማርኛ ይተረጉማል።
- source_word: χρῆσόν μοι
  choice: አውሰኝ
  rationale: ለጊዜው እንዲሰጠው የሚቀርበውን ጥያቄ በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τρεῖς ἄρτους
  choice: ሦስት እንጀራ
  rationale: ἄρτος በዚህ አውድ የሚያመለክተውን ተቆጣሪ የዳቦ አይነት በአማርኛ መጽሐፍ ቅዱሳዊና ተለምዷዊ ቃል ‘እንጀራ’ ያቀርባል፤ ቁጥሩም እንደተጠበቀ ነው።
