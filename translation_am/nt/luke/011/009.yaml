base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: am
  text: እኔም እላችኋለሁ፦[a] ለምኑ፣ ይሰጣችኋል፤ ፈልጉ፣ ታገኛላችሁ፤ አንኳኩ፣ ይከፈትላችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ የግሪኩን የአሁን ጊዜ ትእዛዛዊ ቅጾች ይበልጥ በግልጽ በማንጸባረቅ፦ «ለመን ቀጥሉ … መፈለግን ቀጥሉ … ማንኳኳትን ቀጥሉ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: እኔም
  rationale: καὶ ἐγώ የሚለውን ቅጽ በተፈጥሯዊ አማርኛ በመግለጽ፣ ከቀደመው ትምህርት ጋር ያለውን ትስስርና በ«እኔ» ላይ ያለውን አጽንዖት ይጠብቃል።
- source_word: λέγω
  choice: እላችኋለሁ
  rationale: በአሁን ጊዜ የተገለጸውን ቀጥተኛ ንግግር በዘመናዊና ክቡር አማርኛ ያቀርባል።
- source_word: αἰτεῖτε
  choice: ለምኑ
  rationale: ትእዛዛዊውን ቅጽ በቀጥታ ይገልጣል፤ የመቀጠል ወይም የመደጋገም ሊኖር የሚችለው ገጽታ በማስታወሻው ተጠቅሷል።
- source_word: δοθήσεται
  choice: ይሰጣችኋል
  rationale: የግሪኩን የወደፊት ጊዜ ተደራጊ ትርጉም በአማርኛ ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል፤ ተቀባዮቹም በግልጽ ይታያሉ።
- source_word: ζητεῖτε
  choice: ፈልጉ
  rationale: ቃሉ ሊይዘው የሚችለውን ቀጥተኛም ሆነ ዘይቤያዊ የመፈለግ ስፋት የሚጠብቅ የተለመደ አማርኛ ነው።
- source_word: εὑρήσετε
  choice: ታገኛላችሁ
  rationale: የወደፊት ጊዜ ተስፋውን በቀጥታ ያቀርባል፣ ከሌሎቹም ሐረጎች ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: κρούετε
  choice: አንኳኩ
  rationale: በርን የማንኳኳት ምስሉን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀνοιγήσεται ὑμῖν
  choice: ይከፈትላችኋል
  rationale: በግሪኩ ያልተገለጸውን የሚከፈተውን ነገር ሳይጨምር፣ ተደራጊውን ትርጉምና «ለእናንተ» የሚለውን አቅጣጫ በአንድ ተፈጥሯዊ ግስ ይጠብቃል።
theological_decisions:
