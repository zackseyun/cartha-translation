source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: am
  text: ኃጢአታችንንም ይቅር በለን፤ እኛ ራሳችንም ለእኛ ዕዳ ያለበትን ሰው ሁሉ ይቅር እንላለንና።[a] ወደ ፈተናም አታግባን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ለእኛ ዕዳ ያለበትን ሁሉ።” በመጀመሪያው ሐረግ ግሪኩ “ኃጢአት” ይላል፤ እዚህ ግን የዕዳ ቃል ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: “ፈተና” የሚለው የግሪክ ቃል “ሙከራ” ወይም “የፈተና ጊዜ” ማለትም ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: ይቅር በለን
  rationale: በጸሎት አውድ ውስጥ የἀφίημι ተፈጥሯዊ የአማርኛ አቻ ሲሆን፣ ቀጥተኛውን ልመና ያስቀምጣል።
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: ኃጢአታችንን
  rationale: ግሪኩ በዚህ የመጀመሪያ ሐረግ ‘ኃጢአቶች’ ይላል እንጂ ‘ዕዳዎች’ አይልም።
- source_word: καὶ γὰρ αὐτοὶ
  choice: እኛ ራሳችንም … እንላለንና
  rationale: ‘ራሳችንም’ የαὐτοὶን አጽንዖትና καὶን ያሳያል፤ ‘-ና’ ደግሞ γὰρ የሚያመለክተውን ምክንያት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀφίομεν
  choice: ይቅር እንላለን
  rationale: ከἄφες ጋር ያለውን የግስ ትስስር በአማርኛም ይጠብቃል፤ የገንዘብ ዕዳን ብቻ አድርጎ አይወስነውም።
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: ዕዳ ያለበትን ሁሉ
  rationale: የὀφείλωን የዕዳ ቋንቋ ይጠብቃል፤ በመጀመሪያው ‘ኃጢአት’ እና በዚህ ‘ዕዳ’ መካከል ያለውን የቃላት ልዩነት አያጠፋም።
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: ወደ ፈተናም አታግባን
  rationale: εἰσφέρω ያለውን ‘ወደ ውስጥ ማስገባት’ ትርጉም በቀጥታና ተፈጥሯዊ አማርኛ ያቀርባል፤ የጽሑፉን ሥነ መለኮታዊ ውጥረት አያለዝብም።
- source_word: πειρασμόν
  choice: ፈተና
  rationale: ‘ፈተና’ በአማርኛ የመፈተንን፣ የሙከራንና የኃጢአት ፈተናን ሰፊ ክልል ሊሸፍን ይችላል፤ አውዱን በአንድ ትርጉም ብቻ አይወስንም።
theological_decisions:
- issue: πειρασμός በመጨረሻው ልመና ያለው ትርጉምና እግዚአብሔር ወደ ፈተና ስለማስገባቱ ያለው ውጥረት
  choice: ወደ ፈተናም አታግባን
  alternative: ፈተና እንዳይደርስብን ጠብቀን / ወደ ሙከራ አታግባን
  rationale: ዋናው ጽሑፍ εἰσφέρωን ‘አታግባን’ ብሎ በቅርብ ይተረጉማል፤ እግዚአብሔር ከፈተና ጋር ስላለው ግንኙነት የትርጓሜ ማብራሪያ በጽሑፉ ውስጥ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ የጸሎት ቋንቋ ተጠቅሟል። ‘ይቅር በለን’ እና ‘አታግባን’ የተለመዱ ቢሆኑም የግሪኩን ቀጥተኛነት ይጠብቃሉ።
