  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: am
  text: ሕዝቡ በብዛት እየተሰበሰበ ሳለ፣ እንዲህ ማለት ጀመረ፦ “ይህ ትውልድ ክፉ[a] ትውልድ ነው። ምልክት ይፈልጋል፤ ከዮናስ ምልክት[b] በቀር ምልክት አይሰጠውም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክፋተኛ።”
    reason: lexical_alternative
  - marker: b
    text: “የዮናስ ምልክት” ዮናስ ራሱ በትንቢታዊ ተልእኮው ምልክት መሆኑን ሊያመለክት ይችላል፤ ከወንጌላት ትይዩ ክፍሎች አንጻር ደግሞ ከኢየሱስ ሞትና ትንሣኤ ጋር ያለውን ተምሳሌታዊ ዝምድና ሊያስታውስ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: በብዛት እየተሰበሰበ ሳለ
  rationale: ቀጣይነት ያለውንና ከዋናው ድርጊት ጋር በአንድ ጊዜ የሚከናወነውን የሕዝቡን መሰብሰብ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἤρξατο λέγειν
  choice: ማለት ጀመረ
  rationale: የግሪኩን የድርጊት መጀመር አገላለጽ በቀጥታና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γενεά
  choice: ትውልድ
  rationale: ጊዜያዊና የጋራ ማኅበራዊ ማጣቀሻውን የሚጠብቅ የተለመደ አቻ ቃል ነው።
- source_word: πονηρά
  choice: ክፉ
  rationale: በዐውዱ ያለውን ግልጽ የሥነ ምግባር ፍርድ በአጭርና በዘመናዊ ቃል ያስተላልፋል።
- source_word: σημεῖον
  choice: ምልክት
  rationale: ቃሉን ያለ አስፈላጊ ትርጓሜ ይጠብቃል፤ “ተአምራዊ” የሚለውን ትርጉም በግድ አይጨምርም።
- source_word: ζητεῖ
  choice: ይፈልጋል
  rationale: የግሪኩን መሠረታዊ ትርጉም ይጠብቃል፤ የግድ መጠየቅ ስሜቱን ዐውዱ እንዲያሳይ ይተዋል።
- source_word: δοθήσεται
  choice: አይሰጠውም
  rationale: የወደፊት ጊዜውንና ተቀባዩን በተፈጥሯዊ አማርኛ ያሳያል፤ ሰጪውንም በስም አይጨምርም።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: ከአሉታዊ ዓረፍተ ነገሩ በኋላ የሚመጣውን የማግለያ ኃይል በግልጽ ሁኔታ ያሳያል።
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: የዮናስ ምልክት
  rationale: የግሪኩን የዝምድና አገላለጽ ሳይፈታ ይጠብቃል፤ ምልክቱ ከዮናስ ጋር በምን መንገድ እንደሚዛመድ በዋናው ጽሑፍ አይወስንም።
theological_decisions:
- issue: “ይህ ትውልድ” የሚለው የኢየሱስ ፍርድ ወሰን
  choice: በዘመኑ ባሉት ሰዎች ላይ የተሰጠ የጋራ የሥነ ምግባር ፍርድ እንደሆነ ማቅረብ
  alternative: በዚያ ያሉትን ጥቂት ተቃዋሚዎች ብቻ እንደሚመለከት ማጥበብ
  rationale: “ይህ ትውልድ ክፉ ትውልድ ነው” የሚለው ድግግሞሽ ሰፊ የጋራ ውግዘትን ያጎላል፤ ትርጉሙም የግሪኩን ወሰን አያጠብም።
- issue: “የዮናስ ምልክት” ትርጉም
  choice: የዝምድና አገላለጹን ሳይፈታ በዋናው ጽሑፍ ማቆየት
  alternative: የዮናስን ስብከትና የንስሐ ጥሪ ብቻ ወይም የኢየሱስን ሞትና ትንሣኤ ብቻ በግልጽ አድርጎ ማስገባት
  rationale: የሉቃስ ቅርብ ዐውድ ሐረጉን በራሱ መንገድ ያብራራል፤ ሌሎች የወንጌል ትይዩ ክፍሎችም ተምሳሌታዊ ዝምድናን ሊያስታውሱ ይችላሉ። ዋናው ጽሑፍ ይህን ውጥረት አይፈታም።
