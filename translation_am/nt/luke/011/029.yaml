review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the gathering crowds, the inceptive speech, the corporate moral indictment, the request for a sign, and the deliberately open expression “the sign of Jonah.” However, “ሌላ” (“another/other”) is an unnecessary addition: the Greek says that no sign will be given except Jonah’s sign, without explicitly supplying “other.”'
  naturalness: The Amharic is clear, modern, and suitably dignified. “ሕዝቡ በብዛት እየተሰበሰበ ሳለ” is acceptable for the crowds’ ongoing assembly. The revised final clause is slightly leaner and more closely follows the source.
  terminology: “ትውልድ,” “ክፉ,” “ምልክት,” and “የዮናስ ምልክት” are appropriate. The genitive relation in “የዮናስ ምልክት” is correctly left unexplained in the main text. The footnote preserves possible wider Gospel-parallel associations without making them part of the translation.
  issues:
  - severity: low
    issue: The word “ሌላ” is added in the final clause.
    rationale: Although it is compatible with the sense, it is not expressed in the Greek. Removing it retains the absolute exclusion expressed by “οὐ ... εἰ μὴ.”
