base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: am
  text: ስለዚህ፣ እናንተ ምስክሮች ናችሁ፤ ለአባቶቻችሁ ድርጊቶች ይሁንታ ትሰጣላችሁ፤ እነርሱ ነቢያቱን ገደሉ፣ እናንተ ግን መቃብሮቻቸውን ትገነባላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «መቃብሮቻቸውን» የሚለው ከቀደመው ቁጥር ከተጠቀሱት የነቢያት መቃብሮች የተሟላ ነው፤ በግሪኩ በዚህ ቁጥር ተሳቢው አልተደገመም።
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: ስለዚህ
  rationale: ከቀደመው ክስ የሚወጣውን ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: μάρτυρές ἐστε
  choice: ምስክሮች ናችሁ
  rationale: የግሪኩን የስም ማሰሪያ አወቃቀርና በድርጊታቸው በራሳቸው ላይ የሚመሰክሩበትን ኃይል ይጠብቃል።
- source_word: συνευδοκεῖτε
  choice: ትስማማላችሁ
  rationale: ከአባቶቻቸው ድርጊት ጋር ያላቸውን የሞራል ይሁንታና ተባባሪነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς ἔργοις
  choice: በ...ድርጊት
  rationale: በዚህ የሞራል ክስ አውድ ውስጥ ተጨባጭ ተግባራትን በግልጽ ያመለክታል።
- source_word: τῶν πατέρων ὑμῶν
  choice: የአባቶቻችሁ
  rationale: የምንጩን ቤተሰባዊና የክርክር ኃይል ይጠብቃል፤ እዚህ የቀደሙትን ትውልዶች ያመለክታል።
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: እነርሱ ነቢያቱን ገደሉ
  rationale: ከአሁኑ ትውልድ ጋር ያለውን አጽንዖታዊ ንጽጽር ይጠብቃል፤ የተገደሉት ነቢያት መሆናቸው ከቁጥር 47 ቀጥተኛ አውድ ግልጽ ነው።
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: እናንተ ግን መቃብሮቻቸውን ትሠራላችሁ
  rationale: “እናንተ ግን” የግሪኩን ንጽጽር ያሳያል፤ ያልተጠቀሰው የግሱ ቀጥተኛ ተሳቢ ከቀደመው ቁጥር በማቅረብ ትርጉሙን በአማርኛ ያሟላል።
theological_decisions:
- issue: የοἰκοδομεῖτεን በግሪኩ ያልተደገመ ቀጥተኛ ተሳቢ ከቀደመው ቁጥር ማሟላት
  choice: “መቃብሮቻቸውን ትሠራላችሁ” ብሎ በዋናው ጽሑፍ ማቅረብ
