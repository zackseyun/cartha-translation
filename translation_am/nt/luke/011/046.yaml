  rationale: ቃሉ በአይሁድ ሕግ የተካኑ ሰዎችን እንጂ የዘመናችንን ዓለማዊ ጠበቆች አያመለክትም። ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
