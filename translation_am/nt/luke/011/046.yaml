theological_decisions:
- issue: የνομικοῖς ማንነት
  choice: በአይሁድ ሕግ የተካኑ ሰዎችን ለማመልከት ‘የሕግ አዋቂዎች’ ተብሏል።
  alternative: የሕግ ሊቃውንት፤ ጠበቆች
  rationale: ‘ጠበቆች’ የዘመናዊ ፍርድ ቤት ባለሙያዎችን ሊያስታውስ ይችላል፤ ‘ጸሐፍት’ ደግሞ ከνομικοί ጋር ሁልጊዜ ፍጹም ተመሳሳይ አይደለም።
- issue: የመጨረሻው ሐረግ ኃይል
  choice: ‘ከጣቶቻችሁ በአንዱ እንኳ ሸክሞቹን አትነኩም’ የሚለው ተጨባጭ ምስል ተጠብቋል።
  alternative: ሸክሞቹን ለማቅለል ምንም አትረዱም።
  rationale: ምንጩ እርዳታ አለማድረጋቸውን በተጨባጭ ዘይቤ ይገልጣል። ዘይቤው በአማርኛም ግልጽ ስለሆነ የተጠቆመውን ትርጉም በትርጓሜ መተካት አላስፈለገም።
