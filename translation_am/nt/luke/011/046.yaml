base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: am
  text: እርሱም እንዲህ አለ፤ “እናንተ የሕግ አዋቂዎችም[a] ወዮላችሁ! ሰዎችን ለመሸከም በሚከብዱ ሸክሞች ትጭናላችሁና፤ እናንተ ራሳችሁ ግን ከጣቶቻችሁ በአንዱ እንኳ ሸክሞቹን አትነኩም።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሕግ ሊቃውንት።” የግሪኩ ቃል በአይሁድ ሕግ የተካኑ ሰዎችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሸክሞቹ ላይ አንድ ጣት እንኳ አታኖሩም።” አገላለጹ በሌሎች ላይ የጫኑትን ሸክም ለማቅለል ምንም ጥረት እንደማያደርጉ ያጎላል።
    reason: lexical_alternative
