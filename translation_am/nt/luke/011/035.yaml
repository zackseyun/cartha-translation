  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: am
  text: ስለዚህ፣ በአንተ ውስጥ ያለው ብርሃን ጨለማ እንዳይሆን ተጠንቀቅ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአንተ ውስጥ ያለው ብርሃን ጨለማ አለመሆኑን አረጋግጥ።”
    reason: የσκόπει μὴ የትርጉም አማራጭን ያቀርባል፤ አወቃቀሩ እንደ ጥንቃቄ ማስጠንቀቂያ ወይም እንደ ማረጋገጥ ጥሪ ሊቀርብ ይችላል።
lexical_decisions:
- source_word: σκόπει
  choice: ተጠንቀቅ
  rationale: የአሁን ጊዜ ትእዛዝ ሲሆን ቀጣይ ንቃትንና የማስጠንቀቂያውን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ስለ ዓይንና ብርሃን ትምህርት የሚወጣውን ድምዳሜ በግልጽ ያመለክታል።
- source_word: μὴ
  choice: እንዳይሆን
  rationale: ከትእዛዙ ጋር የማይፈለግ ነገር እንዳይከሰት የሚሰጠውን ማስጠንቀቂያ በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል።
- source_word: τὸ φῶς
  choice: ብርሃን
  rationale: የብርሃንና የጨለማን ንጽጽር እና ሰፊውን ዘይቤያዊ ትርጉም ሳይገድብ ይጠብቃል።
- source_word: τὸ ἐν σοὶ
  choice: በአንተ ውስጥ ያለው
  rationale: ሁለተኛ መደብ ነጠላውን በቀጥታ ያስተላልፋል፤ ዘይቤውንም በሥነ ልቦናዊ ወይም በመንፈሳዊ ትርጓሜ አይገድበውም።
- source_word: σκότος
  choice: ጨለማ
  rationale: በአቅራቢያው ዐውድ ያለውን የብርሃንና የጨለማ ንጽጽር እንዲሁም ዘይቤያዊና ሥነ ምግባራዊ ኃይሉን ይጠብቃል።
- source_word: ἐστίν
  choice: ይሆን
  rationale: ከአሉታዊ የማስጠንቀቂያ አወቃቀሩ ጋር ተዋሕዶ ቀላሉን አያያዥ ግስ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የ“ብርሃን”ና “ጨለማ” ዘይቤያዊ ትርጉም
  choice: ዘይቤውን በዋናው ጽሑፍ ሳይተረጉሙ እንዳለ ማቆየት
  alternative: “ማስተዋልህ”፣ “ውስጣዊ ብርሃንህ” ወይም “ሕሊናህ” ብሎ መግለጽ
  rationale: ንግግሩ ከአመለካከትና ከውስጣዊ ሁኔታ ጋር የተያያዘ ሰፊ ዘይቤ ይጠቀማል። አንዱን ብቻ መግለጽ ግሪኩ ያልወሰነውን ትርጓሜ ያስገባል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ተጠንቀቅ” የማስጠንቀቂያውን ኃይል ያቆያል፤ የብርሃንና የጨለማ ዘይቤም ሳይፈታ ተጠብቋል።
