base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: am
  text: 'እርሱም እንዲህ አላቸው፦ “በምትጸልዩበት ጊዜ እንዲህ በሉ፦ ‘አባት ሆይ፣[a] ስምህ ይቀደስ፤[b] መንግሥትህ ትምጣ።’”


    [a] አንዳንድ የትርጉምና የአምልኮ ወጎች፣ በማቴዎስ 6፥9 ካለው ተጓዳኝ ክፍል ተጽዕኖ የተነሣ፣ “አባታችን ሆይ” ይላሉ፤ እዚህ ያለው ግሪክኛ ግን “አባት ሆይ” ብቻ ይላል።


    [b] ወይም፣ “ስምህ ቅዱስ ሆኖ ይከበር።”'
  philosophy: optimal-equivalence
  footnotes:
