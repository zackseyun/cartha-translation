    text: አንዳንድ የትርጉምና የአምልኮ ወጎች፣ በማቴዎስ 6፥9 ካለው ተጓዳኝ ክፍል ተጽዕኖ የተነሣ፣ “አባታችን ሆይ” ይላሉ፤ እዚህ ያለው ግሪክኛ ግን “አባት ሆይ” ብቻ ይላል።
