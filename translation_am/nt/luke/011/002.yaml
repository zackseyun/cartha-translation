lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: በምትጸልዩበት ጊዜ
  rationale: Ὅταν ከተያያዘው ንዑስ አንቀጽ ጋር አጠቃላይና ተደጋጋሚ ጊዜያዊ ሁኔታን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: λέγετε
  choice: እንዲህ በሉ
  rationale: የአሁን ጊዜ ትእዛዛዊ ቅርጹን በቀጥተኛና ተፈጥሯዊ የአማርኛ ትእዛዝ ያቀርባል፤ “እንዲህ” የሚለው ቀጥሎ የሚመጣውን የጸሎት ቃል በግልጽ ያስተዋውቃል።
- source_word: Πάτερ
  choice: አባት ሆይ
  rationale: የግሪክኛውን ነጠላ የጥሪ ቅርጽ በትክክል ያሳያል፤ “አባታችን” የሚለውን ከማቴዎስ ተጓዳኝ ክፍል አያስገባም።
- source_word: ἁγιασθήτω
  choice: ይቀደስ
  rationale: የተገብሮ ትእዛዛዊ ቅርጹንና የልመና ኃይሉን በአጭር፣ ክቡርና የተለመደ የአማርኛ አገላለጽ ያቆያል።
- source_word: τὸ ὄνομά σου
  choice: ስምህ
  rationale: የምንጩን ቃል በቀጥታ ያቆያል፤ በዐውዱ የእግዚአብሔርን የተገለጠ ማንነት፣ ክብርና ዝና ያካትታል።
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: መንግሥትህ ትምጣ
  rationale: የግሪክኛውን የልመና ትእዛዛዊ ኃይል በተፈጥሯዊ የአማርኛ ምኞታዊ ቅርጽ ያሳያል፤ “መንግሥት” ደግሞ የንግሥና አገዛዝንም ሆነ የመንግሥቱን ፍጻሜያዊ ገጽታ ክፍት ያደርጋል።
theological_decisions:
- issue: እግዚአብሔርን “አባት” ብሎ መጥራት፣ “አባታችን” ሳይል
  choice: አባት ሆይ
  alternative: አባታችን ሆይ
  rationale: የቀረበው SBLGNT ጽሑፍ Πάτερ ብቻ ይላል። ትርጉሙ ከማቴዎስ 6፥9 ወይም ከኋለኛ የአምልኮ ወግ ጋር ከማስማማት ይልቅ የሉቃስን ጽሑፍ ይከተላል።
- issue: ἁγιασθήτω τὸ ὄνομά σου የሚለው ጥያቄ
  choice: ስምህ ይቀደስ
  alternative: ስምህ ቅዱስ ሆኖ ይከበር
  rationale: “ይቀደስ” የተገብሮውንና የልመናውን ቅርጽ ያቆያል። ቃሉ የእግዚአብሔር ስም ቅድስና ይጨምርለት ማለት ወይም በሰዎች ቅዱስ ሆኖ ይከበር ማለት መሆኑን በዋናው ጽሑፍ በማብራሪያ አይወስንም።
