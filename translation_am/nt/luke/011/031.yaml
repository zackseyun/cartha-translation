  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: am
  text: የደቡብ ንግሥት በፍርድ ጊዜ ከዚህ ትውልድ ወንዶች ጋር ትነሣለች፤ ታወግዛቸዋለች።[a] ምክንያቱም የሰሎሞንን ጥበብ ለመስማት ከምድር ዳርቻዎች መጥታለች፤ እነሆም፣ ከሰሎሞን የሚበልጥ ነገር እዚህ አለ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህች ንግሥት በተለምዶ የሳባ ንግሥት ተብላ የምትታወቀው ናት (1 ነገሥት 10፥1–13፤ 2 ዜና መዋዕል 9፥1–12 ይመልከቱ)።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “ከሰሎሞን የሚበልጥ ሰው።” ግሪኩ ቃል በቃል “ከሰሎሞን የሚበልጥ ነገር” የሚል ገለልተኛ ጾታ ያለው አገላለጽ ነው፤ ይህም ቀጥተኛ የሰው ንጽጽርን ብቻ ሳይሆን ከዚያ የሰፋ ነገርን ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
