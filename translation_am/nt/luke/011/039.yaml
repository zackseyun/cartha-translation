  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: am
  text: ጌታም እንዲህ አለው፦ “አሁን እናንተ ፈሪሳውያን የጽዋውንና የወጭቱን ውጫቸውን ታጸዳላችሁ፤ ውስጣችሁ ግን በስግብግብነት[a]ና በክፋት የተሞላ ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዘረፋ”፣ “ንጥቂያ” ወይም “ብዝበዛ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: በአዲስ ኪዳን የተለመደውን የክብር ማዕረግ ያስተላልፋል፤ እዚህ ተራ የአክብሮት አጠራር ብቻ አይደለም።
- source_word: Νῦν
  choice: አሁን
  rationale: የኢየሱስን ቀጥተኛ ተግሣጽ የሚያስገባውን የንግግር ምልክት በቀላልና ቀጥተኛ አማርኛ ይጠብቃል።
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: እናንተ ፈሪሳውያን
  rationale: በተውላጠ ስሙ ያለውን አጽንዖትና ቀጥተኛ አድራሻ ይጠብቃል።
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: የጽዋውንና የወጭቱን ውጭ
  rationale: የዕቃዎቹን ውጫዊ ክፍል የሚያመለክተውን ተጨባጭ ምስል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καθαρίζετε
  choice: ታጸዳላችሁ
  rationale: የአሁን ጊዜውንና የተደጋጋሚ ልማድን ትርጉም በተለመደ አገላለጽ ያስተላልፋል።
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: ውስጣችሁ ግን
  rationale: ‘ልባችሁ’ ወይም ‘ውስጣዊ ማንነታችሁ’ ብሎ ሳይተረጉም፣ ከዕቃዎቹ ውጭ ጋር የሚደረገውን የውስጥ ንጽጽር ይጠብቃል።
- source_word: γέμει
  choice: የተሞላ ነው
  rationale: ነጠላ የሆነውን ‘ውስጥ’ እንደ ርዕሰ ጉዳይ ጠብቆ የመሙላትን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἁρπαγῆς
  choice: ስግብግብነት
  rationale: በዐውዱ ውስጥ ያለውን የሚነጥቅና የሚበዘብዝ ውስጣዊ ምኞት ለዘመናዊ አንባቢ በግልጽ ሁኔታ ያቀርባል፤ የዘረፋና የንጥቂያ ትርጉሞቹ በማስታወሻ ተጠብቀዋል።
- source_word: πονηρίας
  choice: ክፋት
  rationale: የቃሉን ሰፊና ከባድ የሥነ ምግባር ክፋት ትርጉም በቀጥተኛ ዘመናዊ ቃል ያስተላልፋል።
theological_decisions:
- issue: የ‘ውስጥ’ ዘይቤያዊ ማጣቀሻ
  choice: ዘይቤውን ‘ውስጣችሁ’ በማለት መጠበቅ
  alternative: ‘ልባችሁ’ ወይም ‘ውስጣዊ ማንነታችሁ’
  rationale: ግሪክኛው ውጫዊ ንጽሕናን ከውስጣዊ ብልሹነት ጋር ሆን ብሎ ያነጻጽራል። አንድን የሰው ውስጣዊ ክፍል በተለይ መጥቀስ ጽሑፉ ያልወሰነውን ትርጓሜ ያስገባል።
- issue: የἁρπαγή ሥነ ምግባራዊ ትርጉም
  choice: በዋናው ጽሑፍ ‘ስግብግብነት’ ማለትና ተጨባጭ አማራጮቹን በማስታወሻ ማቆየት
  alternative: ዘረፋ፣ ንጥቂያ፣ ብዝበዛ
  rationale: ዐውዱ አንድን የወንጀል ድርጊት ብቻ ሳይሆን የውስጥን የሥነ ምግባር ብልሹነት ይወቅሳል። ‘ስግብግብነት’ ይህን ውስጣዊ መሻት ያስተላልፋል፤ ማስታወሻውም የግዳጅ ንጥቂያን የሚያካትተውን የቃሉን ስፋት ይጠብቃል።
