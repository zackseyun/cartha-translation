  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጽዋና የወጭት ተጨባጭ ምስል፣ እንዲሁም በ‘ውጭ’ና ‘ውስጥ’ መካከል ያለው ቀጥተኛ ንጽጽር ተጠብቋል።
