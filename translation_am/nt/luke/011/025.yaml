review_pass:
  verdict: revise
  source_fidelity: The draft preserves the implicit object and accurately renders the two perfect passive participles as resultant conditions. However, «መጥቶም» is less clear as a temporal participial clause in this context than «ሲመጣ», and its enclitic -ም can misleadingly suggest ‘also.’
  naturalness: «ሲመጣ» gives natural modern Amharic narrative flow for the Greek aorist participle while retaining the temporal sense. «ተስተካክሎ» is understandable, but «በሥርዓት ተዘጋጅቶ» more idiomatically describes a house that has been put in order.
  terminology: No doctrinal terminology is at issue. The object remains implicit through «-ዋል», as in the Greek and as recoverable from the preceding context. The footnote should offer an adjectival/resultative alternative for κεκοσμημένον rather than the less fitting form «አጊጦ».
  issues:
  - severity: low
    issue: Temporal force of ἐλθὸν
    rationale: «መጥቶም» can be read as sequential ‘and having come,’ but «ሲመጣ» more naturally conveys ‘when it comes’ and avoids an unnecessary additive nuance from -ም.
  - severity: low
    issue: Rendering of κεκοσμημένον
    rationale: For a house, «በሥርዓት ተዘጋጅቶ» clearly communicates the ordered, arranged resultant state. An alternative ‘adorned’ should be expressed as «ያጌጠ».
  revised_text: ሲመጣ ተጠርጎና በሥርዓት ተዘጋጅቶ ያገኘዋል።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ «ተጠርጎና ያጌጠ»።
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek clause’s compactness, its implicit reference to the house, and the resultant-state sense of both perfect passive participles. It uses idiomatic modern Amharic for the temporal participle and gives a natural house-context rendering of κεκοσμημένον, while preserving ‘adorned’ as a footnoted lexical alternative.
