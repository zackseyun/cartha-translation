  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: am
  text: ሲመጣ ተጠርጎና በሥርዓት ተዘጋጅቶ ያገኘዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ተጠርጎና ያጌጠ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: መጥቶም
  rationale: የግሪኩ የቀድሞ ጊዜ አጋዥ ግስ ከቁጥር 24 የሚመለሰውን ርኩስ መንፈስ ያመለክታል፤ «መጥቶም» ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὑρίσκει
  choice: ያገኘዋል
  rationale: የአሁን ጊዜው ግስ ለትረካው ሕያው ኃይል ይሰጣል። የተውላጠ ስሙ ነገር በግሪኩ በግልጽ ባይጠቀስም፣ «-ዋል» ከአውዱ የሚታወቀውን ቤት ይመለከታል።
- source_word: σεσαρωμένον
  choice: ተጠርጎ
  rationale: ፍጹም ተደራጊ አጋዥ ግሱ ቤቱ እንደተጠረገና በዚያ ሁኔታ እንዳለ ያሳያል፤ «ተጠርጎ» በግሪኩ ያልተጨመረውን «ንጹሕ» ሳያክል ትርጉሙን ይጠብቃል።
- source_word: κεκοσμημένον
  choice: ተስተካክሎ
  rationale: በቤት አውድ ውስጥ κοσμέω ሥርዓት ማስያዝን ወይም ማስጌጥን ሊያመለክት ይችላል። «ተስተካክሎ» ዋናውን የተደራጀ ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል፤ «አጊጦ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የተውት ቀጥተኛ ተሳቢ ማጣቀሻ
  choice: ያገኘዋል
  alternative: ቤቱን ያገኘዋል
  rationale: ግሪኩ ቀጥተኛውን ተሳቢ በስም አይጠቅስም፤ ከቁጥር 24 አውድ ግን ቤቱ መሆኑ ግልጽ ነው። ቤቱን በስም ሳይጨምር «-ዋል» የግሪኩን አጭርነትና በአውድ የሚገኘውን ማጣቀሻ ይጠብቃል።
- issue: የκεκοσμημένον ትርጉም ስፋት
  choice: ተስተካክሎ
  alternative: አጊጦ
  rationale: ቃሉ ቤቱ በሥርዓት መያዙንም ሆነ መዋቡን ሊያመለክት ይችላል። ዋናው ጽሑፍ ለቤት አውድ የሚስማማውን «ተስተካክሎ» ይጠቀማል፤ ሌላውን እውነተኛ የቃል አማራጭ ግን በማስታወሻ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ አጭር አገላለጽ ተጠብቋል፤ ከአውዱ የሚታወቀው «ቤት» በስም አልተጨመረም።
