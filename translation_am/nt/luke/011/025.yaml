- from: መጥቶም ተጠርጎና ተስተካክሎ ያገኘዋል።[a]
  to: ሲመጣ ተጠርጎና በሥርዓት ተዘጋጅቶ ያገኘዋል።[a]
  rationale: The revision retains the Greek clause’s compactness, its implicit reference to the house, and the resultant-state sense of both perfect passive participles. It uses idiomatic modern Amharic for the temporal participle and gives a natural house-context rendering of κεκοσμημένον, while preserving ‘adorned’ as a footnoted lexical alternative.
  reviewer_model: gpt-5.6-terra
