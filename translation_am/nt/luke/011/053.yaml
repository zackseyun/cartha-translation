base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: am
  text: እርሱም ከዚያ ከወጣ በኋላ፣ ጸሐፍትና ፈሪሳውያን አጥብቀው ሊጫኑትና ስለ ብዙ ነገሮች እንዲናገር ሊጠይቁት ጀመሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አጥብቀው ሊመረምሩት” ወይም “ያለ ዝግጅት እንዲናገር ሊያደርጉት።” የግሪኩ ግስ ብርቅዬ ሲሆን፣ መልስ ከእርሱ በኃይል ለማውጣት መሞከርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: እርሱም ከዚያ ከወጣ በኋላ
  rationale: የዘርፍ ፍጹም አንቀጽ (genitive absolute) ከዋናው ድርጊት በፊት የሆነውን ሁኔታ ያሳያል፤ ይህ አተረጓጎም የቦታውንና የጊዜውን ትስስር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἤρξαντο
  choice: ጀመሩ
  rationale: ከተከታዮቹ የግስ ሐረጎች ጋር የመጀመርን ፍቺ በግልጽ ያስተላልፋል።
- source_word: οἱ γραμματεῖς
  choice: ጸሐፍት
  rationale: በወንጌላት አውድ የሕግ ጽሑፎች ባለሙያዎችን የሚጠቁመውን የተለመደ መጠሪያ ይጠብቃል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የቡድኑን ስም በአማርኛ የተለመደውን ቅርጽ ይጠቀማል።
- source_word: δεινῶς ἐνέχειν
  choice: አጥብቀው ይጫኑት
  rationale: በኢየሱስ ላይ ያደረጉትን ከባድና ጠላትነት የተሞላበት ጫና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀποστοματίζειν αὐτόν
  choice: እንዲናገር ይጠይቁት
  rationale: ብርቅዬው ግስ ቃል ለማስወጣት በኃይል መጠየቅን ወይም ያለ ዝግጅት እንዲመልስ ማድረግን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ አጠቃላይ ፍቺውን ሲይዝ አማራጮቹ በማስታወሻ ተጠብቀዋል።
- source_word: περὶ πλειόνων
  choice: ስለ ብዙ ነገሮች
  rationale: ንጽጽራዊ ‘የበለጡ’ ከማለት ይልቅ ብዙ ልዩ ልዩ ጉዳዮችን የሚያመለክተውን አውዳዊ ፍቺ ይገልጻል።
