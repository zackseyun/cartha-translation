- source_word: τὰ παιδία μου
  choice: ልጆቼ
  rationale: ዕድሜያቸውን ከልክ በላይ ሳይወስን የልጆችን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: ከእኔ ጋር በመኝታው ናቸው
