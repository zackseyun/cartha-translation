  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: am
  text: እርሱም ከውስጥ ሆኖ፣ “አታስቸግረኝ፤[a] በሩ አስቀድሞ ተዘግቷል፤[b] ልጆቼም ከእኔ ጋር በመኝታ ላይ ናቸው።[c] ተነስቼ ልሰጥህ አልችልም” ብሎ ይመልሳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ችግር አትፍጠርብኝ” ወይም “ደጋግመህ አትረብሸኝ።” የግሪኩ ፈሊጥ ቃል በቃል “ድካሞችን ማቅረብ” የሚል ሐሳብ አለው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሩ አስቀድሞ ዝግ ነው።” የግሪኩ ፍጹም ጊዜ ግስ የተጠናቀቀውን ድርጊት (“ተዘግቷል”) ወይም ከድርጊቱ የተገኘውን ሁኔታ (“ዝግ ነው”) ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: c
    text: “በመኝታ ላይ” የሚለው በዚያን ዘመን ቤተሰቡ አብሮ የሚተኛበትን የጋራ መኝታ ስፍራ ያመለክታል፤ የትዳር ግንኙነትን አያመለክትም።
    reason: cultural_note
