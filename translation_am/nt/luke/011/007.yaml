- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: ተነስቼ ልሰጥህ አልችልም
  rationale: ተሳቢው ግስ ከመስጠቱ በፊት አስፈላጊውን መነሳት ይገልጣል፤ በግሪኩ ግልጽ ያልሆነ ተሳቢ ነገር አልተጨመረም።
