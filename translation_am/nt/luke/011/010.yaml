  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: am
  text: የሚለምን ሁሉ ይቀበላልና፤ የሚፈልግም ያገኛል፤ ለሚያንኳኳውም ይከፈትለታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በአውዱ መሠረት ይበልጥ ግልጽ ተደርጎ፣ «ለሚያንኳኳው በሩ ይከፈትለታል» ሊባል ይችላል። በግሪኩ ግን የሚከፈተው ነገር በግልጽ አልተጠቀሰም።
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ሁሉ
  rationale: ከተሳቢው አሳታፊ ግስ ጋር በተናጠል ሁሉን አቀፍ ትርጉም ይሰጣል፤ «የሚለምን ሁሉ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ማበረታቻ ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
- source_word: ὁ αἰτῶν
  choice: የሚለምን
  rationale: የአሁን ጊዜውን አሳታፊ ግስ እንደ አጠቃላይ የሰው ባሕርይ ያቀርባል፤ በጸሎት አውድ «መለመን» ተፈጥሯዊና ክቡር ነው።
- source_word: λαμβάνει
  choice: ይቀበላል
  rationale: በመለመንና ምላሽ በማግኘት አውድ ውስጥ ቀጥተኛና የተለመደ አቻ ነው።
- source_word: ὁ ζητῶν
  choice: የሚፈልግ
  rationale: ቀጣይነት ወይም አጠቃላይ ድርጊት የሚገልጸውን አሳታፊ ግስ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εὑρίσκει
  choice: ያገኛል
  rationale: በዚህ ሦስትዮሽ ምሳሌያዊ አነጋገር ውስጥ ቀጥተኛና ፈሊጣዊ አቻ ነው።
- source_word: τῷ κρούοντι
  choice: ለሚያንኳኳው
  rationale: የግሪኩን ተውላጠ ስም የሆነ አሳታፊ ግስና የዳቲቭን አቅጣጫ «ለ-» በመጠበቅ ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ἀνοιγήσεται
  choice: ይከፈትለታል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን ይጠብቃል፤ በግሪኩ ያልተገለጸውን ተሳቢ «በር» በዋናው ጽሑፍ ውስጥ አይጨምርም።
theological_decisions:
- issue: የሁሉን አቀፍ ተስፋው ወሰንና ኃይል
  choice: ንግግሩን ምንም ተጨማሪ ቅድመ ሁኔታ ሳይጨመርበት እንደ አጠቃላይ ሁሉን አቀፍ መርሕ መተርጎም
  alternative: እንደ ማጋነናዊ ማበረታቻ መተርጎም ወይም «በትክክል የሚለምን» የሚል የትርጓሜ ገደብ መጨመር
  rationale: የግሪኩ ጽሑፍ በጸሎት ማበረታቻው አውድ ውስጥ ያልተገደበ ሁሉን አቀፍ አባባል ያቀርባል። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ይጠብቃል እንጂ በጥቅሱ ያልተገለጹ ሁኔታዎችን አያክልም።
