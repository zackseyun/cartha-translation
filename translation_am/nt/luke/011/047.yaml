lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ወዮላችሁ!
  rationale: የፍርድ ማስጠንቀቂያና የነቢያት ወቀሳ ኃይልን በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: …ና
