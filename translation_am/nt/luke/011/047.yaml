  text: ወዮላችሁ፣ ምክንያቱም የነቢያትን መቃብሮች[a] ትሠራላችሁ፤ አባቶቻችሁ[b] ግን ገድለዋቸዋል።
  philosophy: optimal-equivalence
  footnotes:
