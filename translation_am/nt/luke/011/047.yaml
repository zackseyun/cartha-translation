- source_word: οἰκοδομεῖτε
  choice: ትሠራላችሁ
  rationale: የግሪኩን የአሁን ጊዜ ቀጥተኛና ያልተጋነነ አገላለጽ ይጠብቃል።
- source_word: τὰ μνημεῖα
  choice: መቃብሮች
  rationale: ቃሉ መቃብርን ወይም የመቃብር ሐውልትን ሊያመለክት ቢችልም፣ ‘መቃብሮች’ የቀብር ቦታውን ትርጉም በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῶν προφητῶν
  choice: የነቢያትን
  rationale: መቃብሮቹ ከነቢያት ጋር ያላቸውን ባለቤትነታዊ ወይም ተዛማጅነታዊ ግንኙነት በቀጥታ ይገልጻል።
- source_word: οἱ δὲ πατέρες ὑμῶν
