  naturalness: The register and principal wording are clear, modern standard Amharic. Moving the causal connector to the beginning makes the sentence’s logical structure natural and unambiguous. Omitting the independent object pronoun avoids unnecessary duplication because the object is already expressed by the verbal suffix -ዋቸዋል.
  terminology: ‘ወዮላችሁ,’ ‘ነቢያት,’ ‘መቃብሮች,’ and ‘አባቶቻችሁ’ are suitable and retain the source’s register and lexical range. The alternatives in both footnotes remain appropriate.
  issues:
  - severity: medium
    issue: The causal marker is placed on the final killing clause.
    rationale: 'In Greek, ὅτι occurs before ‘you build’ and supplies the reason for the woe through the entire juxtaposition: they build the prophets’ tombs, but their fathers killed them. The draft’s final -ና can make only the fathers’ killing appear to be the stated reason.'
  - severity: low
    issue: Redundant explicit object pronoun before an object-suffixed verb.
    rationale: ‘እነርሱን ገድለዋቸዋል’ is understandable, but ‘ገድለዋቸዋል’ already refers clearly to the prophets and is smoother in modern standard Amharic.
