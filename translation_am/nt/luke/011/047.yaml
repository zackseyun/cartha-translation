  rationale: ‘ግን’ የδέን ንጽጽራዊ ኃይል ይጠብቃል፤ ‘አባቶቻችሁ’ ደግሞ የπατέρεςን ቤተሰባዊና ትውልዳዊ አገላለጽ በቀጥታ ያቀርባል።
- source_word: ἀπέκτειναν αὐτούς
  choice: እነርሱን ገድለዋቸዋል
  rationale: ድርጊቱን ያለ ተጨማሪ ሕጋዊ ወይም ሥነ ምግባራዊ ፍርድ በቀጥታ ይገልጻል፤ ተውላጠ ስሙም ወደ ነቢያቱ እንደሚመለስ ግልጽ ያደርጋል።
theological_decisions:
- issue: መቃብሮቹን በመሥራትና አባቶቻቸው ነቢያቱን በመግደላቸው መካከል ያለውን ግብዝነት ወይም ተባባሪነት በግልጽ ማስገባት እንዳለበት
  choice: ንጽጽሩን ብቻ ማቆየት፦ ‘መቃብሮችን ትሠራላችሁ፤ አባቶቻችሁ ግን እነርሱን ገድለዋቸዋል።’
  alternative: ‘አባቶቻችሁ የገደሏቸውን ነቢያት መቃብሮች ትሠራላችሁ’ ወይም የዚህን ተግባር ግብዝነት በግልጽ መጨመር
  rationale: ጥቅሱ ሁለቱን ድርጊቶች ያነጻጽራል እንጂ የንጽጽሩን ሙሉ ድምዳሜ በዚህ ስፍራ አይገልጽም፤ ያ ድምዳሜ በሚቀጥለው ጥቅስ ይበራል። ስለዚህ ሥነ መለኮታዊ ውጥረቱ ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ወዮላችሁ’ የነቢያትን የፍርድ ወቀሳ ያቆያል፤ የምክንያት ግንኙነቱም በመጨረሻው ‘-ና’ በተፈጥሯዊ አማርኛ ተገልጿል።
