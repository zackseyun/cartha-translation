  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: am
  text: ነገር ግን፣ በውስጥ ያሉትን ምጽዋት አድርጋችሁ ስጡ[a]፤ እነሆ፣ ሁሉም ነገር ለእናንተ ንጹሕ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያላችሁን ምጽዋት አድርጋችሁ ስጡ።” የግሪኩ ሐረግ በውስጥ ያሉ ነገሮችን ወይም በእጃችሁ ያለውን ንብረት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: ነገር ግን
  rationale: ከቀደመው ስለ ውጫዊ ንጽሕና የተነገረው ጋር የሚቃረን እርማትን ያስገባል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: τὰ ἐνόντα
  choice: በውስጥ ያሉትን
  rationale: ቃል በቃል የውስጥን ነገሮች ያመለክታል፤ በቁጥር 39 ካለው የውጭና የውስጥ ንጽጽር ጋር ይጣጣማል። ‘ያላችሁን’ የሚለው አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: δότε
  choice: ስጡ
  rationale: የትእዛዝ ኃይሉን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐλεημοσύνην
  choice: ለድሆች
  rationale: ቃሉ የምጽዋት ስጦታን ያመለክታል። ‘ለድሆች ስጡ’ በዘመናዊ አማርኛ ከ‘ምጽዋት አድርጋችሁ ስጡ’ ይልቅ ቀላልና ተፈጥሯዊ ሲሆን የቃሉን ዋና ትርጉም ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረት የሚስብና ውጤቱን አጽንዖት ሰጥቶ የሚያቀርብ ክቡር ሆኖም ለአንባቢ የሚገባ አገላለጽ ነው።
- source_word: πάντα
  choice: ሁሉም ነገር
  rationale: የግሪኩን አጠቃላይ ስፋት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καθαρὰ
  choice: ንጹሕ
  rationale: በአውዱ ያለውን የንጽሕና ጉዳይና ከዕቃዎች ማጽዳት ጋር ያለውን ትስስር ይጠብቃል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: የማጣቀሻውን ወይም የጥቅምን ዳቲቭ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: τὰ ἐνόντα ከንጽሕናና ከምጽዋት ጋር ያለው ግንኙነት
  choice: ‘በውስጥ ያሉትን’ የሚል ውስጣዊና ሥነ ምግባራዊ ንባብ
  alternative: ‘ያላችሁን’ ማለትም በእጅ ያለን ንብረት የሚያመለክት ንባብ
  rationale: ቅርብ አውዱ የጽዋንና የወጭቱን ውጭ ከውስጣቸው ጋር ያነጻጽራል፤ ስለዚህ ዋናው ጽሑፍ ውስጣዊውን ንባብ ይጠብቃል። የግሪኩ ሐረግ ንብረትንም ሊያመለክት ስለሚችል ያ አማራጭ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። ‘እነሆ’ የግሪኩን አጽንዖት ለመጠበቅ ተመርጧል፤ ዋናው አሻሚ ሐረግ ቃላዊ ቅርጹን በጽሑፉ ሲጠብቅ ሌላው ትርጉም በማስታወሻ ቀርቧል።
