  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። በቀረበው የእንግሊዝኛ ጽሑፍ ውስጥ የማስታወሻ ምልክቶቹ ከሚገልጹት ቃል ጋር ተዛውረው ነበር፤ በዚህ ረቂቅ [a] ከκρύπτη እና [b] ከμόδιος ጋር በትክክል ተያይዘዋል።
