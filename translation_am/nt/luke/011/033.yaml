base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: am
  text: ማንም መብራት አብርቶ በተሰወረ ስፍራ[a] ወይም በቅርጫት[b] ሥር አያስቀምጠውም፤ ነገር ግን ወደ ውስጥ የሚገቡት ብርሃኑን እንዲያዩ በመብራት ማስቀመጫው ላይ ያስቀምጠዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጓዳ” ወይም “በሚስጥር ስፍራ።” የግሪኩ κρύπτη ከመሬት በታች ያለ ማከማቻን ጨምሮ የተሰወረ ስፍራን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ μόδιος የደረቅ ነገር መስፈሪያ ዕቃ ነው፤ በተለምዶ “ቡሽል” ወይም “የቡሽል ቅርጫት” ተብሎ ይተረጎማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ማንም … አያስቀምጠውም
  rationale: የግሪኩን አጠቃላይ አሉታዊ አገላለጽ በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: λύχνον
  choice: መብራት
  rationale: ቃሉ ተንቀሳቃሽ የዘይት መብራትን ያመለክታል፤ ‘መብራት’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἅψας
  choice: አብርቶ
  rationale: የተካሄደው ድርጊት ዋናውን ግስ እንደሚቀድም የሚያሳይ ተፈጥሯዊ የአማርኛ ተውሳከ ግስ ነው።
- source_word: εἰς κρύπτην
  choice: በተሰወረ ስፍራ
  rationale: κρύπτη የተሰወረ ስፍራን ወይም ጓዳን ሊያመለክት ይችላል፤ ይህ ምርጫ የመደበቁን ዋና ሐሳብ ሳያጠብ ይጠብቃል።
- source_word: ὑπὸ τὸν μόδιον
  choice: ከቅርጫት በታች
  rationale: μόδιος የደረቅ ነገር መስፈሪያና ያንን የሚይዝ ዕቃ ነው፤ ‘ቅርጫት’ በምሳሌው ውስጥ መብራቱን የሚሸፍነውን ዕቃ በቀላሉ ያሳያል፣ የመስፈሪያነቱም ዝርዝር በማስታወሻ ተጠብቋል።
- source_word: ἐπὶ τὴν λυχνίαν
  choice: በመብራት ማስቀመጫ ላይ
  rationale: λυχνία በተለይ መብራት የሚቀመጥበትን ማስቀመጫ ያመለክታል።
- source_word: οἱ εἰσπορευόμενοι
  choice: ወደ ውስጥ የሚገቡት
  rationale: የአሁን ጊዜውን ተሳቢ ግስ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ φέγγος
  choice: ብርሃኑን
  rationale: φέγγος ብርሃንን ወይም ድምቀትን ያመለክታል፤ በመብራት ምሳሌ ውስጥ ‘ብርሃን’ በጣም ተፈጥሯዊ ነው።
- source_word: ἵνα … βλέπωσιν
  choice: እንዲያዩ
  rationale: የἵνα ሐረጉን ዓላማ በተለመደው የአማርኛ የዓላማ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የκρύπτη ትርጉም
  choice: አጠቃላይ ‘በተሰወረ ስፍራ’
  alternative: ‘በጓዳ’ ወይም ‘በምድር ቤት’
  rationale: የንግግሩ አጽንዖት ብርሃንን መደበቅ ምን ያህል ተገቢ እንዳልሆነ ማሳየት ነው፤ ይህ ምርጫ ቃሉ ሊኖረው የሚችለውን የሕንፃ ዝርዝር አይወስንም።
- issue: የμόδιος አተረጓጎም
  choice: በዋናው ጽሑፍ ‘ቅርጫት’
  alternative: ‘መስፈሪያ ዕቃ’ ወይም ‘የእህል መስፈሪያ’
  rationale: ዋናው ጽሑፍ ምስሉን ለዘመናዊ አንባቢ በግልጽ ያቀርባል፤ ዕቃው መስፈሪያ መሆኑ ግን በማስታወሻ ተገልጿል።
