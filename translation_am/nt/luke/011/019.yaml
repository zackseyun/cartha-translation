- issue: በἐν τίνι የተጠየቀው አድራጊ ወይም ኃይል
  choice: «በማን»
  alternative: «በምን» ወይም «በማን ኃይል»
  rationale: ከብዔልዜቡል ጋር ያለውን የግል አድራጊ ንጽጽር ያቆያል፤ የመንገድ/የኃይል ንባቡ ግን በማስታወሻ ተጠብቋል።
