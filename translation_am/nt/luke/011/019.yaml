base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: am
  text: እኔ ግን አጋንንትን በብዔልዜቡል የማስወጣ ከሆንሁ፣ ልጆቻችሁ በማን[a] ያስወጧቸዋል? ስለዚህ እነርሱ ራሳቸው[b] ፈራጆቻችሁ ይሆናሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምን” ወይም “በማን ኃይል።”
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ በ«እነርሱ ራሳቸው» ላይ አጽንዖት ይሰጣል።
    reason: lexical_emphasis
lexical_decisions:
- source_word: εἰ δὲ ἐγὼ
  choice: እኔ ግን … ከሆነ
  rationale: δέ ያለውን መጠነኛ ተቃርኖ በ«ግን» ያሳያል፤ ግልጽ የሆነው ἐγώ ደግሞ ለክርክሩ ንጽጽር «እኔ» ተብሎ ተጠብቋል።
- source_word: ἐν Βεελζεβοὺλ
  choice: በብዔልዜቡል
  rationale: ἐν እዚህ የአድራጊነት/የመሣሪያነት ፍቺ ስላለው «በ» ተብሏል፤ የግል ስሙም ተጽፎ ቀርቧል።
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: አጋንንትን … የማስወጣ
  rationale: «ማስወጣ» በዘመናዊ አማርኛ የክፉ መናፍስትን ማባረር ትርጉም በተፈጥሮ ያስተላልፋል፤ τὰ δαιμόνια «አጋንንት» ተብሏል።
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ልጆቻችሁ
  rationale: የυἱοίን ቀጥተኛ የዝምድና አገላለጽ ይጠብቃል፤ «ተከታዮቻችሁ» ወይም «ደቀ መዛሙርቶቻችሁ» ብሎ የትርጓሜ ውሳኔ አይጨምርም።
- source_word: ἐν τίνι
  choice: በማን
  rationale: በብዔልዜቡል ከሚለው የግል አድራጊ ጋር ያለውን የክርክሩን ንጽጽር ይጠብቃል፤ «በምን» የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው የክርክር ጥያቄ የሚወጣውን ድምዳሜ በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: እነርሱ ራሳቸው ፈራጆቻችሁ ይሆናሉ
  rationale: ግልጽ የሆነውንና አጽንዖት የሚሰጠውን αὐτοί «እነርሱ ራሳቸው» ብሎ ጠብቋል፤ κριταί ደግሞ «ፈራጆች» ተብሏል።
theological_decisions:
