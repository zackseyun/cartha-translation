  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: am
  text: ከእናንተ መካከል የትኛው አባት ነው፣ ልጁ ዓሣ ቢጠይቀው፣ በዓሣው ፈንታ እባብ የሚሰጠው?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: ከእናንተ መካከል የትኛው አባት ነው
  rationale: የግሪኩን ከአድማጮቹ መካከል እንዲህ የሚያደርግ አባት ማን እንደሆነ የሚጠይቅ አነጋገር ተፈጥሯዊ በሆነ የአማርኛ የንግግር ጥያቄ ያቀርባል።
- source_word: αἰτήσει
  choice: ቢለምነው
  rationale: ግሱ የወደፊት ጊዜ ቅርጽ ቢኖረውም፣ በዚህ የምሳሌያዊ ጥያቄ አውድ ውስጥ የአማርኛው ሁኔታዊ ቅርጽ ተፈጥሯዊ ነው፤ የተጠየቀውን ሰውም በተውላጠ ስም ግልጽ ያደርጋል።
- source_word: ὁ υἱὸς
  choice: ልጁ
  rationale: በአውዱ ያለውን የአባትና የልጅ ዝምድና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἰχθύν / ἰχθύος
  choice: ዓሣ / ዓሣው
  rationale: ተጨባጩን ነጠላ ምሳሌ ይጠብቃል፤ ሁለተኛው አጠቃቀም ቀድሞ የተጠቀሰውን ዓሣ ያመለክታል።
- source_word: ἀντὶ
  choice: በ… ፈንታ
  rationale: የመተካትን ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: ὄφιν
  choice: እባብ
  rationale: ὄφιςን በቀጥታና ያለ ተጨማሪ ምሳሌያዊ ፍቺ የሚያስተላልፍ መደበኛ የአማርኛ ቃል ነው።
- source_word: αὐτῷ ἐπιδώσει
  choice: የሚሰጠው
  rationale: ἐπιδίδωμι በዚህ አውድ ‘መስጠት’ ማለት ነው፤ የአማርኛው ቅርጽ ተቀባዩን ልጅ ከአውዱ ግልጽ ያደርጋል።
