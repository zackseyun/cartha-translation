  rationale: ግሪኩ የክሱን ዝርዝር ሥነ መለኮታዊ አሠራር አያብራራም፤ ስለዚህ ትርጉሙ የመሣሪያነት/የአድራጊነት ግንኙነቱን ያሳያል እንጂ ተጨማሪ ትርጓሜ አያስገባም።
