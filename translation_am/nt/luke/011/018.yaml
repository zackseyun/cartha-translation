  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ የክርክር አወቃቀርና የንግግሩ ጥያቄያዊ ኃይል ተጠብቋል። የእግር ማስታወሻው ምልክት ከሚያብራራው ‘ብዔልዜቡል’ ስም ቀጥሎ ተቀምጧል።
