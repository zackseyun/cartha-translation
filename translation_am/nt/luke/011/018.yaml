  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: am
  text: ሰይጣን እንኳ በራሱ ላይ ተከፋፍሎ ከሆነ፣ መንግሥቱ እንዴት ትጸናለች? እናንተ እኔ አጋንንትን በብዔልዜቡል[a] እንደማስወጣ ትላላችሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ ብዔልዜቡል፤ አንዳንድ የእንግሊዝኛ ትርጉሞች «ብዔልዜቡብ» የሚለውን ቅርጽ ይጠቀማሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: ሰይጣን
  rationale: በዘመናዊ አማርኛ የተለመደውን የግሪክ ስም/ማዕረግ ቅርጽ ይከተላል።
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: በራሱ ላይ ተከፋፍሎ ከሆነ
  rationale: የውስጥ መከፋፈልንና ራስን መቃወምን ያሳያል፤ የግሪኩን ተገብሮአዊ ቅርጽም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πῶς σταθήσεται
  choice: እንዴት ትጸናለች?
  rationale: መንግሥቱ እንዴት ቆማ እንደምትቀጥል ወይም እንደምትኖር የሚጠይቀውን ዘይቤያዊ ኃይል ይጠብቃል።
- source_word: βασιλεία
  choice: መንግሥት
  rationale: በዚህ አውድ የሰይጣንን ግዛት ወይም የሥልጣን ክልል በተለመደ መጽሐፍ ቅዱሳዊ ቃል ይገልጻል።
- source_word: ὅτι
  choice: ትላላችሁና
  rationale: የተቃዋሚዎቹ ክስ ከቀደመው የኢየሱስ ጥያቄ ጋር ምክንያታዊ ግንኙነት እንዳለው በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν Βεελζεβοὺλ
  choice: በብዔልዜቡል
  rationale: ἐν በዚህ አውድ የመሣሪያነትን ወይም የአድራጊነትን ግንኙነት ስለሚያመለክት፣ ‘በ’ የሚለው አጭርና ግልጽ ትርጉም ተመርጧል።
- source_word: Βεελζεβοὺλ
  choice: ብዔልዜቡል
  rationale: የSBLGNTን Βεελζεβούλ ቅርጽ በቀጥታ የሚያንጸባርቅ የፊደል ማስተላለፊያ ነው።
- source_word: ἐκβάλλειν
  choice: ማስወጣት
  rationale: አጋንንትን ከሰው ማስወገድን በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: δαιμόνια
  choice: አጋንንት
  rationale: የግሪኩን ቃል በቀጥታ የሚወክለው የተለመደ የአማርኛ ቃል ነው።
theological_decisions:
- issue: የኢየሱስ ተቃዋሚዎች ክስ ትርጉም
  choice: ኢየሱስ አጋንንትን በብዔልዜቡል እንደሚያስወጣ እነርሱ የተናገሩትን ክስ ብቻ ማቅረብ
