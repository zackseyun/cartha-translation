- issue: κατοικεῖ የነጠላ ቁጥር ግስ ሲሆን εἰσελθόντα ብዙ ቁጥር መሆኑ
  choice: እነርሱም ... ይኖራሉ
  alternative: ገብቶ በዚያ ይኖራል
  rationale: የብዙ ቁጥር ተሳቢውና የትረካው ትርጉም ሰባቱን ከመጀመሪያው መንፈስ ጋር በቤቱ የሚኖሩ አድርጎ ያሳያል። የአማርኛው ብዙ ቁጥር ይህን ትርጉም በተፈጥሮ ያስተላልፋል፣ የግሪኩን ሰዋሰዋዊ ውጥረት ግን በውሳኔ ማስታወሻው ያስቀምጣል።
- issue: ἀνθρώπουን ጾታ-ገለልተኛ ቃል አድርጎ መተርጎም
  choice: የዚያ ሰው
  alternative: የዚያ ግለሰብ
  rationale: የኢየሱስ ምሳሌ የሚያመለክተው የተወሰነ ሰው ነው፤ ‘ሰው’ በአማርኛ ተፈጥሯዊና ክብር ያለው ነው።
