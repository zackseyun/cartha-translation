base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: am
  text: ከዚያም ሄዶ ከራሱ ይበልጥ ክፉ የሆኑ ሌሎች ሰባት መናፍስትን ወስዶ ይሄዳል[a][b]። እነርሱም ገብተው በዚያ ይኖራሉ፤ የዚያም ሰው የመጨረሻው ሁኔታ ከቀድሞው የከፋ ይሆናል[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከራሱ ይበልጥ ክፉ የሆኑ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪክ ጽሑፍ እዚህ “መናፍስት” ይላል እንጂ “አጋንንት” ወይም “ርኩሳን መናፍስት” ብሎ በግልጽ አይጠራቸውም፤ አውዱ ግን ጠላትነታቸውን ግልጽ ያደርጋል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “የዚያ ሰው የመጨረሻ ሁኔታ ከመጀመሪያው ይከፋል።”
    reason: lexical_alternative
lexical_decisions:
