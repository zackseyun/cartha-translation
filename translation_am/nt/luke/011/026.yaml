  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: ሄዶ ... አብረውት ይወስዳል
  rationale: የመሄድንም ሆነ ሌሎቹን ከራሱ ጋር የመውሰድን ሐሳብ ይጠብቃል።
- source_word: ἕτερα πνεύματα
  choice: ሌሎች ... መናፍስት
