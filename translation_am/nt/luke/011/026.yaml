- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: እነርሱም ገብተው በዚያ ይኖራሉ
  rationale: ብዙ ቁጥር ያለውን ተሳቢ አንቀጽ እና የብዙዎቹን መናፍስት የጋራ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩ ዋና ግስ በነጠላ ቁጥር መሆኑ ግን በውሳኔው ማብራሪያ ተጠብቋል።
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: የኋለኛው ሁኔታ ከቀድሞው የከፋ
  rationale: ቃል በቃል ‘የመጨረሻዎቹ’ የሚለውን ፈሊጣዊ አገላለጽ ስለ ሰውየው የኋላ ሁኔታ እንደሚናገር ግልጽ አድርጎ ያቀርባል።
