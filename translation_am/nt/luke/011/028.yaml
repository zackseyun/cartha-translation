  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: am
  text: እርሱ ግን፣ “ይልቁንም[a] የእግዚአብሔርን ቃል የሚሰሙና የሚጠብቁ ብፁዓን ናቸው” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እውነት፣ ብፁዓን ናቸው …” ወይም “አዎን፣ ይልቁንም ብፁዓን ናቸው …” የግሪኩ ቃል የቀደመውን ንግግር እያረጋገጠ ትኩረቱን ሊያዞር ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: ይልቁንም
  rationale: በቀደመው ንግግር ላይ ፍጹም ተቃውሞ ሳያሳይ ትኩረቱን ወደ ጥልቅ የብፅዕና መሠረት ያዞራል፤ የማረጋገጥና የማስተካከል ኃይሉ በማስታወሻ ተጠብቋል።
- source_word: μακάριοι
  choice: ብፁዓን ናቸው
  rationale: ቃሉ በኢየሱስ የብፅዕና ንግግሮች ያለውን መንፈሳዊና መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል፤ ‘ደስተኞች’ ከሚለው ሥነ ልቦናዊ ትርጉም ይሰፋል።
- source_word: οἱ ἀκούοντες
  choice: ሰምተው የሚጠብቁት
  rationale: የአሁን ጊዜ ቦዝ አንቀጽ በመስማት የሚታወቁ ሰዎችን ያመለክታል፤ ከተከታዩ φυλάσσοντες ጋር በተፈጥሯዊ አማርኛ ተያይዟል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: λόγος እዚህ የእግዚአብሔርን መልእክትና መገለጥ ያመለክታል፤ ‘ቃል’ ሰፊውን የትርጉም ክልልና መጽሐፍ ቅዱሳዊ ድምፁን ይጠብቃል።
- source_word: φυλάσσοντες
  choice: የሚጠብቁት
  rationale: ‘መጠበቅ’ ቃሉን ማክበር፣ ማስቀመጥና በተግባር መፈጸምን ሊያካትት ይችላል፤ ‘የሚታዘዙት’ ብቻ ብሎ የትርጉም ክልሉን አያጠብም።
- source_word: αὐτὸς δὲ εἶπεν
  choice: እርሱ ግን … አለ
  rationale: δὲ ከቀደመው የሴቲቱ ንግግር ጋር ያለውን ቀላል ንፅፅር ያሳያል፤ εἶπεν ደግሞ በቀጥታ ‘አለ’ ተብሏል።
theological_decisions:
- issue: የኢየሱስ ምላሽ ከሴቲቱ ብፅዕና ንግግር ጋር ያለው ግንኙነት
  choice: ኢየሱስ ትኩረቱን ከሥጋዊ ዝምድና ወደ እግዚአብሔርን ቃል መስማትና መጠበቅ ወደሆነው ጥልቅ የብፅዕና መሠረት ያዞራል፤ የእናቱን ብፅዕና ግን በግልጽ አይክድም።
  alternative: ኢየሱስ የሴቲቱን ንግግር ፈጽሞ ይቃወማል፣ ወይም ምንም ሳያስተካክል ሌላ ብፅዕና ብቻ ይጨምራል።
  rationale: Μενοῦν ማረጋገጥንና ትኩረት ማዞርን አንድ ላይ ሊይዝ ይችላል። ‘ይልቁንም’ የማስተካከል ኃይሉን ሲጠብቅ፣ የቀደመውን ንግግር እንደ ፍጹም ክህደት አያቀርብም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ብፁዓን’ እና ‘የእግዚአብሔር ቃል’ የሚሉት ቅርጾች መጽሐፍ ቅዱሳዊ ክብርን ይጠብቃሉ።
