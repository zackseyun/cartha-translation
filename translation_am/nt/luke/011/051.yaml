  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: am
  text: ከአቤል ደም እስከ በመሠዊያውና በቤቱ[a] መካከል የሞተው የዘካርያስ[b] ደም ድረስ። አዎን፣ እላችኋለሁ፤ ከዚህ ትውልድ ይጠየቃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመሠዊያውና በቤተ መቅደሱ መካከል።” የግሪኩ ቃል በቀጥታ “በመሠዊያውና በቤቱ መካከል” ይላል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ የተጠቀሰው ዘካርያስ ማን እንደሆነ አከራካሪ ነው። ሊሆኑ ከሚችሉት መካከል የኢዮአዳ ልጅ ዘካርያስ (2 ዜና መዋዕል 24፥20-22) ወይም የበራክዩ ልጅ ዘካርያስ ይገኙበታል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: ከአቤል ደም አንስቶ … እስከ ዘካርያስ ደም ድረስ
  rationale: የግሪኩን ‘ከ…እስከ…’ የንግግር ክልል በተፈጥሯዊ አማርኛ ያቆያል፤ ‘ደም’ም የደም መፍሰስንና ተጠያቂነትን የሚያስታውሰውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: τοῦ ἀπολομένου
  choice: እስከሞተው
  rationale: የἀπόλλυμι የመጥፋት/የመሞት ኃይልን ያሳያል፤ በዋናው ጽሑፍ ገዳዩን ወይም የድርጊቱን አፈጻጸም በግልጽ ሳይጨምር የግሪኩን አሻሚነት ይጠብቃል።
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: በመሠዊያውና በቤቱ መካከል
  rationale: οἶκος በቀጥታ ‘ቤት’ ማለት ስለሆነ የምንጩን ቃልና መጽሐፍ ቅዱሳዊ ዘይቤ ይጠብቃል፤ በዚህ አውድ የቤተ መቅደሱን ሕንፃ ሊያመለክት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ναί, λέγω ὑμῖν
  choice: አዎን፣ እላችኋለሁ
  rationale: የναίን አጽንዖት እና የλέγω ὑμῖνን ቀጥተኛ ንግግር በዘመናዊና ክብር ባለው አማርኛ ያቀርባል።
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: ከዚህ ትውልድ ይጠየቃል
  rationale: የግሪኩን የተገብሮ አቀራረብና የፍርድ/የተጠያቂነት ስሜት ያቆያል፤ ድርጊቱን የሚፈጽመውን አካል ወይም የሚጠየቀውን ነገር ከጽሑፉ በላይ አይገልጽም።
theological_decisions:
- issue: የዘካርያስ ማንነትና የኢየሱስ የፍርድ ንግግር ወሰን
  choice: ዘካርያስ ማን እንደሆነ በዋናው ጽሑፍ አልተወሰነም፤ ‘ይህ ትውልድ’ም ኢየሱስ እያነጋገረው ያለውን ትውልድ እንደሚያመለክት በራሱ አገላለጽ ተተወ።
  alternative: የኢዮአዳ ልጅ ዘካርያስ፤ የበራክዩ ልጅ ዘካርያስ፤ ወይም የነቢያት ሰማዕትነትን የሚወክል ሰው።
  rationale: የግሪኩ ጽሑፍ እዚህ ላይ ከስሙ በላይ መለያ አይሰጥም። ስለዚህ አከራካሪውን ታሪካዊ ማንነት ወይም የ‘ዚህ ትውልድ’ን ሥነ መለኮታዊ ወሰን ትርጉሙ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ቤቱ’ የምንጩን ዘይቤ ሲጠብቅ፣ የአውዱ ግልጽ አማራጭ በማስታወሻ ቀርቧል። የእግዚአብሔር ፍርድ እንደ አድራጊ በግልጽ አልተጨመረም፤ የግሪኩ ተገብሮ አቀራረብ ተጠብቋል።
