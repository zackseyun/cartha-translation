source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: am
  text: ይህ የሆነው፣ ዓለም ከተመሠረተች ጀምሮ የፈሰሰው የነቢያት ሁሉ ደም ከዚህ ትውልድ እንዲጠየቅ[a] እንዲሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የነቢያት ደም ከዚህ ትውልድ እንዲፈለግ።” ግሱ ስለ ደም መፍሰስ ለፍርድ ሂሳብ የመጠየቅን ሐሳብ ይዟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የግሪኩን የዓላማ/ውጤት ኃይል ከቀደመው ንግግር ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἐκζητηθῇ
  choice: እንዲጠየቅ
  rationale: በዚህ አውድ ግሱ ስለ ደም መፍሰስ ተጠያቂነትን የመጠየቅ የፍርድ ስሜት አለው፤ ይህ ምርጫ ያንን ስሜት ሳያብራራ ይጠብቃል።
- source_word: τὸ αἷμα
  choice: ደም
  rationale: ግሪኩ በቀጥታ ‘ደም’ ይላል፤ በአውዱ የደም ዕዳን ቢያመለክትም ምስላዊ አገላለጹ ተጠብቋል።
- source_word: πάντων τῶν προφητῶν
  choice: የነቢያት ሁሉ
  rationale: የግሪኩን አጠቃላይ ወሰን በግልጽና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: τὸ ἐκκεχυμένον
  choice: የፈሰሰው
  rationale: ከ‘ደም’ ጋር ተፈጥሯዊ የሆነ አገላለጽ ሲሆን የፍጹም ተደራጊ አንቀጹን የተፈጸመ የደም መፍሰስ ስሜት ይጠብቃል።
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ዓለም ከተመሠረተ ጀምሮ
  rationale: የግሪኩን የጊዜ መነሻ ትርጉም በዘመናዊና ክቡር አማርኛ ያቀርባል።
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ከዚህ ትውልድ
  rationale: በተደራጊው ግስ ውስጥ ተጠያቂነቱ የሚጠየቅበትን ወገን የሚያመለክተውን ἀπό በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የነቢያት ደም ‘ከዚህ ትውልድ መጠየቁ’ ምንነት
  choice: እግዚአብሔር ስለ ፈሰሰው የነቢያት ደም ይህን ትውልድ ለፍርድ እንደሚጠይቅ የሚያሳይ ንግግር
  alternative: የፍርድ ኃይሉን የማያጎላ፣ ታሪካዊ ቀጣይነትን ብቻ የሚገልጽ ንግግር
  rationale: ἐκζητέω ከፈሰሰ ደም ጋር ሲውል የሂሳብና የፍርድ ተጠያቂነትን ያመለክታል። ትርጉሙ ይህን ይጠብቃል፤ ነገር ግን ጥቅሱ ከሚለው በላይ የጋራ በደል ንድፈ ሐሳብን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘ደም’ እና ‘ትውልድ’ የተባሉት መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል፤ የፍርድ ስሜቱም በተፈጥሯዊው ‘እንዲጠየቅ’ ተገልጿል።
