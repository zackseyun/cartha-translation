lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የኢየሱስን ቀጥተኛ የንግግር መግቢያ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: ተነሥቶ ባይሰጠው እንኳ
  rationale: የεἰ καίን አሳማኝ የቅናሽ ኃይል በ‘ቢ… እንኳ’ አወቃቀር ይጠብቃል፤ ἀναστὰςም በቤት ውስጥ ካለው አውድ ጋር ተስማምቶ ‘ተነሥቶ’ ተብሏል።
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: ወዳጁ ስለሆነ
  rationale: ምክንያትንና የግል ወዳጅነትን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διά γε τὴν ἀναίδειαν αὐτοῦ
  choice: በእርሱ እፍረት አልባ ግትርነት ምክንያት
