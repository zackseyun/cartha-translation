- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: ተነሥቶ … ይሰጠዋል
  rationale: በዚህ የቤት ውስጥ ትዕይንት ἐγερθεὶς ከመኝታ መነሣትን ያመለክታል፤ የድርጊቶቹንም ቅደም ተከተል ይጠብቃል።
