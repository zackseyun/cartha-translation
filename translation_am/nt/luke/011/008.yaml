base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: am
  text: እላችኋለሁ፤ ወዳጁ ስለሆነ ተነሥቶ ባይሰጠው እንኳ፣ በእፍረት አልባነቱ[a] ምክንያት ተነሥቶ የሚያስፈልገውን ሁሉ ይሰጠዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በድፍረቱ፣” “በአደብ ጉድለቱ፤” ቃል በቃል፣ “በእፍረት አልባነቱ።” በዚህ አውድ፣ “ያለ እፍረት ያለ ጽናት” የሚል ሐሳብም ሊኖረው ይችላል። የግሪኩ ተውላጠ ስም ማንን እንደሚያመለክት ሊያሻማ ይችላል።
