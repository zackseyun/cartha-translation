review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the strong man, his being fully armed, his own courtyard, and his possessions. However, ንብረቱ … ይኖራል treats the possessions as a singular living subject and is not idiomatic for the Greek predicate ἐν εἰρήνῃ. A plural expression of the possessions' secure condition better reflects τὰ ὑπάρχοντα αὐτοῦ and the idiom's contextual sense.
  naturalness: The opening clause is understandable, though ሲጠብቅ is more concise and natural for this general temporal scenario. ንብረቶቹ ደህና ናቸው is natural modern standard Amharic; the literal peace wording is retained in a footnote.
  terminology: ብርቱው ሰው, ሙሉ ትጥቁን ታጥቆ, and የራሱን ግቢ are appropriate. The αὐλή alternatives should continue to note the possible residence/estate sense without forcing it into the text.
  issues:
  - severity: medium
    issue: «ንብረቱ በሰላም ይኖራል» is semantically and grammatically awkward.
    rationale: The Greek has plural «τὰ ὑπάρχοντα» (“possessions”), and «in peace» here denotes their being undisturbed/secure. Saying that property “lives in peace” is less natural in modern Amharic and unnecessarily personifies it.
  - severity: low
    issue: The b footnote explains the idiom but does not clearly identify the literal wording.
    rationale: Since the main rendering is revised to the natural contextual sense «ደህና ናቸው», the footnote should explicitly provide the literal «በሰላም ናቸው».
