  rationale: የግሪክኛውን የሰላም ምስል ይጠብቃል፤ በአገባቡ ንብረቱ ደህንነቱ ተጠብቆና ሳይነካ መኖሩን ያመለክታል።
- source_word: τὰ ὑπάρχοντα αὐτοῦ
