  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: am
  text: እናንተ ፈሪሳውያን ሆይ፣ ወዮላችሁ! በምኩራቦች የክብር መቀመጫዎችን[a]፣ በገበያ ስፍራዎችም ሰላምታዎችን[b] ትወዳላችሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዋና መቀመጫዎችን” ወይም “የክብር ቦታዎችን።”
    reason: lexical_alternative
  - marker: b
    text: ይህም በሕዝብ ፊት ማኅበራዊ ክብርና እውቅና የሚገልጹ ሰላምታዎችን ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ወዮላችሁ!
  rationale: የትንቢታዊ ወቀሳና የፍርድ ማስጠንቀቂያ ኃይልን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς Φαρισαίοις
  choice: እናንተ ፈሪሳውያን ሆይ
  rationale: ቀጥተኛውን ንግግር ግልጽና ክብር ባለው ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ὅτι
  choice: ትወዳላችሁና
  rationale: የወዮታውን ምክንያት በአማርኛ ተፈጥሯዊ የምክንያት ቅጥያ ይገልጻል።
- source_word: ἀγαπᾶτε
  choice: ትወዳላችሁ
  rationale: ቃሉ እዚህ የሚገልጸውን ለማኅበራዊ ክብር ያለ ጽኑ ፍላጎት በቀጥታ ያስተላልፋል።
- source_word: πρωτοκαθεδρίαν
  choice: የክብር መቀመጫዎችን
  rationale: በምኩራብ ውስጥ ከፍ ያለ ማዕረግን የሚያመለክቱ መቀመጫዎችን ይገልጻል፤ ከቦታ አቀማመጥ ይልቅ የክብር ትርጉሙን ያቆያል።
- source_word: ἐν ταῖς συναγωγαῖς
  choice: በምኩራቦች
  rationale: συναγωγή የሚለውን በአማርኛ የተለመደው መጠሪያ በብዙ ቁጥር ይተረጉማል።
- source_word: ἀσπασμοὺς
  choice: ሰላምታዎችን
  rationale: የምንጩን አጭርና ክፍት አገላለጽ ይጠብቃል፤ በዚህ አውድ ያለው የሕዝብ እውቅናና ክብር ገጽታ በማስታወሻ ይብራራል።
- source_word: ἐν ταῖς ἀγοραῖς
  choice: በገበያ ስፍራዎች
  rationale: ἀγορά የሕዝብ መሰብሰቢያና የገበያ ስፍራ መሆኑን በግልጽ ዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የኢየሱስ ወቀሳ ባሕርይ
  choice: ለሕዝብ ፊት ክብርን መውደዳቸው ላይ የተነገረ ትንቢታዊ ወዮታ
  alternative: ስለ መጥፎ ማኅበራዊ ሥነ ምግባር ብቻ የተሰጠ ትችት
  rationale: οὐαί ከተጠቀሱት ምክንያቶች ጋር ሲነበብ ንግግሩን እንደ ሥነ ምግባራዊና መንፈሳዊ ወቀሳ ያቀርበዋል፤ ትርጉሙ ይህን ኃይል ያለ ተጨማሪ የእምነት ትርጓሜ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ወዮላችሁ” የግሪኩን ትንቢታዊ ወቀሳ ያቆያል፤ “የክብር መቀመጫዎች” ደግሞ ቦታው የማዕረግ ምልክት መሆኑን በተፈጥሯዊ አገላለጽ ያሳያል።
