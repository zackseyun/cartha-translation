id: LUK.11.23
reference: Luke 11:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: am
  text: ከእኔ ጋር ያልሆነ በእኔ ላይ ነው፤ ከእኔ ጋር የማይሰበስብም ይበትናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ያልሆነ
  rationale: መስተዋድዱና የአሁን ጊዜ አድራጊ ቅጽ በአንድነት እንደ ስም ሆነው በአጠቃላይ ሰውን ያመለክታሉ። «ያልሆነ» ይህን ነጠላና አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: μετά ከባለቤት ሙያ ጋር ኅብረትን ወይም አብሮነትን ያመለክታል፤ «ከእኔ ጋር» ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: κατ’ ἐμοῦ
  choice: በእኔ ላይ
  rationale: κατά ከባለቤት ሙያ ጋር ተቃውሞን ያመለክታል። «በእኔ ላይ» ከ«ከእኔ ጋር» ጋር ያለውን ጠንካራ ተቃርኖ በአጭርና የተለመደ አገላለጽ ይጠብቃል።
- source_word: συνάγων
  choice: የማይሰበስብ
  rationale: συνάγω አንድ ላይ ማሰባሰብን ያመለክታል። «ይሰበስባል» ከቀጣዩ «ይበትናል» ጋር ያለውን ምሳሌያዊ ተቃርኖ ይጠብቃል።
- source_word: σκορπίζει
  choice: ይበትናል
  rationale: σκορπίζω መበተንን ወይም መበታተንን ያመለክታል። «ይበትናል» ንቁና ቀጥተኛ ሲሆን ከመሰብሰብ ጋር ያለውን ተቃርኖ በግልጽ ያሳያል።
- source_word: καὶ
  choice: -ም
  rationale: ግሪኩ ሁለቱን ትይዩ ሐረጎች ያገናኛል። በአማርኛ «-ም» ይህን ቅንጅት በተፈጥሯዊና አጭር መንገድ ያስተላልፋል።
theological_decisions:
- issue: ኢየሱስን በተመለከተ ገለልተኛ አቋም ስለመኖሩ የንግግሩ ኃይል
  choice: ከኢየሱስ ጋር ያልሆነው በእርሱ ላይ እንደሆነ የሚገልጸው ጠንካራ ሁለትዮሽ ያለማለስለስ ተጠብቋል።
  alternative: ንግግሩን ወደ ድጋፍ እጥረት ብቻ ማለስለስ፣ ወይም አጠቃላይ ቃላቱን ሳይጠብቁ ለአጋንንት ማስወጣት አውድ ብቻ መገደብ
  rationale: የግሪኩ አገላለጽ ፍጹምና ቀጥተኛ ነው። ትርጉሙ የንግግሩን ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ ነገር ግን ከጽሑፉ በላይ የሆነ ትምህርታዊ ማብራሪያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሁለቱ ሐረጎች ትይዩነትና «መሰብሰብ/መበተን» ተቃርኖ ተጠብቋል። በአማርኛ «ያልሆነ» በተፈጥሮ አጠቃላይ ሰውን ስለሚያመለክት፣ በእንግሊዝኛው ላይ የቀረበው የአገላለጽ አማራጭ የትርጉም ልዩነት አይፈጥርም፤ ስለዚህ የግርጌ ማስታወሻ አልተጨመረም።
