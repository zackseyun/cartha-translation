review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the addressee, the Father's promise without identifying it beyond the verse, the command to remain in the city, and the clothing metaphor. The final clause, however, renders the Greek passive ἐνδύσησθε with an active Amharic form (እስክትለብሱ).
  naturalness: The wording is generally clear and suitably dignified modern Amharic. Using a passive construction with an instrumental phrase is more idiomatic for being clothed with power.
  terminology: እነሆ, የአባቴን ተስፋ, and በከተማይቱ ቆዩ are appropriate. No doctrinal expansion of 'the promise' is introduced.
  issues:
  - severity: medium
    issue: Voice in the final clause
    rationale: ἐνδύσησθε is aorist subjunctive passive, 'until you are clothed.' እስክትለብሱ normally has active force, 'until you clothe/wear [something].' Revising to እስክትለበሱ retains the source's passive imagery; በኃይል supplies the natural Amharic construction.
  revised_text: እነሆ፣ የአባቴን ተስፋ በእናንተ ላይ እልካለሁ። እናንተ ግን ከላይ በሚመጣ ኃይል እስክትለበሱ ድረስ በከተማይቱ ቆዩ።
  revised_footnotes: []
