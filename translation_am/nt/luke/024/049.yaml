id: LUK.24.49
reference: Luke 24:49
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: am
  text: እነሆ፣ የአባቴን ተስፋ በእናንተ ላይ እልካለሁ። እናንተ ግን ከላይ በሚመጣ ኃይል እስክትለበሱ ድረስ በከተማይቱ ቆዩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: እነሆ
  rationale: የአድማጮችን ትኩረት ወደሚከተለው ቃል የሚጠራውን የግሪኩን አገላለጽ በክቡርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἐξαποστέλλω
  choice: እልካለሁ
  rationale: የአሁን ጊዜውን ቅርጽና የኢየሱስን የተግባር አበጋዝነት በቀጥታ ይጠብቃል።
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: የአባቴን ተስፋ
  rationale: ቃል የተገባውን ነገር በሚያመለክተው ተፈጥሯዊ አማርኛ ያቀርባል፤ በዚህ ጥቅስ ያልተጠቀሰውን መንፈስ ቅዱስ በጽሑፉ ውስጥ አይጨምርም።
- source_word: ἐφ’ ὑμᾶς
  choice: በእናንተ ላይ
  rationale: የግሪኩን የአቅጣጫ/መውረድ ምስል ሳያጠፋ በቀጥታ ይተረጉማል።
- source_word: καθίσατε ἐν τῇ πόλει
  choice: በከተማይቱ ቆዩ
  rationale: καθίσατε በዚህ አውድ ‘ተቀመጡ’ ከሚለው ይልቅ ‘ቆዩ’ የሚለውን ትርጉም ይሰጣል፤ የተወሰነችውን ከተማ ለማመልከት የወሰን ቅርጽ ተጠቅሟል።
- source_word: ἐνδύσησθε
  choice: እስክትለብሱ
  rationale: የመልበስን ዘይቤ በቀጥታ ጠብቆ ኃይል ከውጭ እንደሚያለብሳቸው ያሳያል።
- source_word: ἐξ ὕψους δύναμιν
  choice: ከላይ ኃይልን
  rationale: የኃይሉን ምንጭ የሚገልጠውን አጭርና ምስላዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: “የአባቴ ተስፋ” ማንነት
  choice: በዋናው ጽሑፍ ውስጥ “መንፈስ ቅዱስ” የሚል ማብራሪያ አልተጨመረም።
  alternative: “አባቴ ቃል የገባውን መንፈስ ቅዱስ” ብሎ በግልጽ መጨመር።
  rationale: ሰፊው የሉቃስ–ሐዋርያት ሥራ አውድ ተስፋውን ከመንፈስ ቅዱስ ጋር ቢያያይዘውም፣ ይህ ጥቅስ ራሱ የተስፋውን ማንነት በስም አይገልጽም።
- issue: “ከላይ ኃይልን መልበስ” የሚለው ዘይቤ
  choice: ዘይቤው በቀጥታ ተጠብቋል።
  alternative: “ከላይ ኃይል እስክትቀበሉ” ብሎ ትርጉሙን ማብራራት።
  rationale: የመልበስ ምስሉ የግሪክ ጽሑፉ ጉልህ ክፍል ስለሆነ ሳይፈታ መቆየቱ ተገቢ ነው።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆ” መጽሐፍ ቅዱሳዊ ክብርን ሲጠብቅ አሁንም ሊገባ የሚችል የትኩረት ጥሪ ነው።
