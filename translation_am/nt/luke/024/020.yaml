    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንዲሰቀል አደረጉት።” ይህ አባባል መሪዎቹ ለአፈጻጸሙ ኃላፊ እንደነበሩ፣ የመስቀል ቅጣቱን ግን የሮም ባለሥልጣናት እንደፈጸሙ ግልጽ ያደርጋል።
    reason: lexical_alternative
