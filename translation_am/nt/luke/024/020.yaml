  text: እንዲሁም የእኛ የካህናት አለቆችና መሪዎች የሞት ፍርድ እንዲፈረድበት እንዴት አሳልፈው እንደሰጡትና እንደሰቀሉት።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
