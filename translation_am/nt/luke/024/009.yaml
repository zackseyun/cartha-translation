id: LUK.24.9
reference: Luke 24:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: am
  text: ከመቃብሩም ተመልሰው፣ ይህን ሁሉ ለአሥራ አንዱና ለቀሩት ሁሉ ነገሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: ተመልሰው
  rationale: የግሱን የተሳቢ አገናኝነት በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ ያለው የሴት ብዙ ቁጥር ቅርጽ በአማርኛ ግስ ላይ በተለየ መልኩ አይገለጥም፣ ነገር ግን ከአውዱ ሴቶቹን ያመለክታል።
- source_word: μνημείου
  choice: መቃብሩ
  rationale: በትንሣኤው ትረካ የኢየሱስን የቀብር ስፍራ ለመግለጽ ግልጽና የተለመደ ቃል ነው።
- source_word: ἀπήγγειλαν
  choice: ነገሩ
  rationale: መረጃን ለሌሎች ማድረስን በተፈጥሯዊና ግርማ ባለው ትረካዊ አማርኛ ይገልጻል፤ ‘አወጁ’ የሕዝብ አዋጅ ያህል ሊሰማ ይችላል።
- source_word: ταῦτα πάντα
  choice: ይህን ሁሉ
  rationale: የጠቋሚውንና የሁሉንም አካታች ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοῖς ἕνδεκα
  choice: ለአሥራ አንዱ
  rationale: ግሪኩ የሚለውን ‘አሥራ አንዱ’ ብቻ በመተርጎም ‘ሐዋርያት’ የሚለውን በጽሑፉ የሌለ ስም አይጨምርም።
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: ለቀሩት ሁሉ
  rationale: አሥራ አንዱን ከሰፊው ቡድን ለይቶ፣ የቀሩትን ሁሉ ያካተተ መሆኑን ያሳያል።
theological_decisions:
- issue: የሴት ብዙ ቁጥር ተሳቢውና ግሱ ባለቤት
  choice: ባለቤቱ በቀደመው አውድ የተጠቀሱት ወደ መቃብሩ የመጡ ሴቶች ናቸው፤ በዚህ ቁጥር ስማቸው አልተጨመረም።
  alternative: ‘ሴቶቹ’ ብሎ ባለቤቱን በግልጽ መጨመር።
  rationale: የግሪኩ ሰዋስው ሴት ብዙ ቁጥርን ያመለክታል፤ አማርኛው ግን ባለቤቱን ከአውዱ እንዲታወቅ በመተው በጽሑፉ የሌለ ስም አይጨምርም።
- issue: የሐዋርያዊው ቡድን መጠሪያ
  choice: ‘አሥራ አንዱ’ ተብሎ ያለ ማስፋፊያ ተተርጉሟል።
  alternative: ‘አሥራ አንዱ ሐዋርያት’
  rationale: ምንጩ የተለመደውን ‘አሥራ አንዱ’ የሚል መጠሪያ ብቻ ይጠቀማል፤ ‘ሐዋርያት’ን መጨመር ማብራሪያ ቢሆንም ከግሪኩ ቃል በላይ ይሄዳል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘ከመቃብሩም’ የሚለው በግሪኩ መጀመሪያ ያለውን καὶ ከቀደመው ትረካ ጋር በ‘ም’ ያገናኛል። ምንም የግርጌ ማስታወሻ ስላልተፈለገ በዋናው ጽሑፍ ምልክት አልገባም።
