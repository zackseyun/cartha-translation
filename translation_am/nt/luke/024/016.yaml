    text: ወይም፣ “እንዳያውቁት ተገድበው ነበር” ወይም “እንዳያውቁት ተከልክለው ነበር።” የግሪኩ ጽሑፍ ድርጊቱን ያደረገውን አይጠቅስም።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ነገር ግን
  rationale: በትረካው ውስጥ ኢየሱስ ከእነርሱ ጋር መሆኑንና እነርሱ ሊያውቁት አለመቻላቸውን በቀላል ንጽጽር ያገናኛል።
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ዓይኖቻቸው
  rationale: የግሪኩን ተጨባጭ የዓይን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκρατοῦντο
  choice: ተይዘው ነበር
  rationale: የግሪኩን ተደራጊ አነጋገር እና የመያዝ/የመገደብ ሐሳብ ይጠብቃል፤ ድርጊቱን ያደረገውንም አይጠቅስም።
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: እንዳያውቁት
  rationale: በዚህ ዐውደ ንባብ ἐπιγινώσκω አንድን ሰው ማንነቱን ለይቶ ማወቅን ያመለክታል፤ ይህ አገላለጽ የውጤት/የመከልከል ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτόν
  choice: እርሱን … -ት
  rationale: በዐውዱ ኢየሱስን የሚያመለክተውን ተሳቢ በግልጽ ሁኔታ ያስቀምጣል።
theological_decisions:
- issue: ማን እንዳያውቁት እንዳደረገ መግለጽ
  choice: የግሪኩን ተደራጊ አነጋገር በመጠበቅ ፈጻሚውን አለመጥቀስ።
  alternative: “እግዚአብሔር እንዳያውቁት ዓይኖቻቸውን ከለከለ” በማለት መለኮታዊ ፈጻሚነትን በግልጽ መጨመር፤ ወይም “ሊያውቁት አልቻሉም” ብሎ ተደራጊነቱን ማስወገድ።
  rationale: የግሪኩ ግስ ተደራጊ ነው፣ ፈጻሚው ግን አልተጠቀሰም። ትርጉሙ ይህን አሻሚነትና ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
