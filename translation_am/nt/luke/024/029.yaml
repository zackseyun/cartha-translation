base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: am
  text: እነርሱ ግን፣ “ከእኛ ጋር ቆይ፤ ማታ ተቃርቧልና፣ ቀኑም አስቀድሞ አዘንብሏል[b]” ብለው አጥብቀው ለመኑት[a]። እርሱም ከእነርሱ ጋር ሊቆይ ገባ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አጥብቀው ጫኑት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቀኑም በጣም ገፍቷል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: አጥብቀው ለመኑት
  rationale: ቃሉ በዚህ አውድ አካላዊ ኃይልን ሳይሆን ጽኑ ልመናንና ያላቋረጠ ግፊትን ያመለክታል፤ ይህ አገላለጽ ጥንካሬውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: ከእኛ ጋር ቆይ
  rationale: የእንግዳ መቀበልን አውድና አብሮነትን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: ማታ ተቃርቧል
  rationale: πρὸς ἑσπέραν ሙሉ በሙሉ ማታ ሆኗል ሳይሆን ማታ እየቀረበ መሆኑን ያሳያል።
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: ቀኑም አሁን አዘንብሏል
  rationale: የκλίνωን የመዘንበል ምስልና የፍጹም ጊዜውን የተከናወነ ሁኔታ ይጠብቃል፤ ቀኑ ወደ ፍጻሜው መድረሱን ያመለክታል።
- source_word: εἰσῆλθεν
  choice: ወደ ቤት ገባ
  rationale: በትረካው የተገመተውን የማረፊያ ቦታ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል፤ ‘ቤት’ በግሪኩ በግልጽ አልተጠቀሰም የሚለውም በማስታወሻ ተገልጧል።
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: ከእነርሱ ጋር ሊቆይ
  rationale: የመግባቱን ዓላማ እና σύν የሚያመለክተውን አብሮነት በቀጥታ ያስተላልፋል።
