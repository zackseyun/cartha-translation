  text: ከዚያም መጻሕፍትን እንዲረዱ አእምሮአቸውን ከፈተላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: διήνοιξεν
  choice: ከፈተላቸው
  rationale: የግሪኩን የመክፈት ዘይቤ ይጠብቃል፤ በአማርኛም ተጠቃሚዎቹን በተውሳከ ግስ መግለጽ ተፈጥሯዊ ነው።
- source_word: αὐτῶν τὸν νοῦν
  choice: አእምሮአቸውን
  rationale: νοῦς የማስተዋልና የመገንዘብ ችሎታን ያመለክታል፤ ነጠላውን የግሪክ ስምና የብዙ ባለቤትነት ቅርጽ በአማርኛ በተፈጥሯዊ ሁኔታ ይይዛል።
- source_word: τοῦ συνιέναι
  choice: እንዲረዱ
  rationale: የዓላማ ወይም የውጤት ኃይል ያለውን አንቀጽ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὰς γραφάς
  choice: መጻሕፍትን
  rationale: በዚህ የሉቃስ አውድ የእስራኤልን ቅዱሳት መጻሕፍት የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
theological_decisions:
- issue: ኢየሱስ አእምሮአቸውን የከፈተበት ድርጊት ምንነት
  choice: “አእምሮአቸውን ከፈተላቸው” የሚለውን ቀጥተኛ ዘይቤ መጠበቅ
  alternative: “እንዲረዱ አስቻላቸው” ወይም “መጻሕፍትን አብራራላቸው”
  rationale: የግሪኩ ጽሑፍ ኢየሱስ አእምሮአቸውን እንደከፈተ በቀጥታ ይናገራል፤ ትርጉሙ ይህን አስተምህሮአዊ ውጥረት ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ይጠብቃል።
- issue: τοῦ συνιέναι ዓላማን ወይስ ውጤትን እንደሚገልጽ
  choice: “እንዲረዱ” በሚለው ቅርጽ ሁለቱንም ሊሸከም የሚችል ትርጉም መስጠት
  alternative: “እንዲረዱ ዘንድ” በማለት ዓላማውን ይበልጥ ማጉላት
  rationale: የግሪኩ አንቀጽ ዓላማና ውጤት ሁለቱንም ሊያመለክት ስለሚችል፣ ተፈጥሯዊው የአማርኛ ቅርጽ አሻሚነቱን ሳያስወግድ ያቀርበዋል።
translation_notes:
