base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: am
  text: እርሱም፣ “እየሄዳችሁ እርስ በርሳችሁ የምትለዋወጧቸው እነዚህ ቃላት[a] ምንድን ናቸው?” አላቸው። እነርሱም ፊታቸው አዝኖ ቆሙ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየሄዳችሁ እርስ በርሳችሁ የምትወያዩባቸው እነዚህ ጉዳዮች ምንድን ናቸው?”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቆሙ፤ ፊታቸውም የተከዘ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: እርሱም … አላቸው
  rationale: λέγωን ‘አለ’ በሚለው መደበኛ የንግግር ግስ ያቀርባል፤ ጥያቄ መሆኑን በማየት ‘ጠየቀ’ ብሎ አይተረጉምም። δέ የትረካውን ፍሰት በ‘-ም’ ያስቀጥላል።
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: እነዚህ ቃላት ምንድን ናቸው?
  rationale: λόγοι በቀጥታ ‘ቃላት’ ሲሆን በዐውዱ ሁለቱ ስለሚያወሩት ነገር ያመለክታል፤ ዋናው ጽሑፍ የግሪኩን ቃላዊ ቅርጽ ይጠብቃል።
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: እርስ በርሳችሁ የምትለዋወጧቸው
  rationale: ግሱ የቃል ልውውጥንና የእርስ በርስ ውይይትን ያሳያል፤ ‘የምትለዋወጧቸው’ ይህን ተደጋጋፊ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: περιπατοῦντες
  choice: እየሄዳችሁ
  rationale: ተሳቢው ድርጊት ከውይይቱ ጋር በአንድ ጊዜ መከናወኑን ያሳያል፤ ‘እየሄዳችሁ’ በዐውዱ ተፈጥሯዊ ነው።
- source_word: ἐστάθησαν
  choice: ቆሙ
  rationale: እየተጓዙ የነበሩት በቦታቸው መቆማቸውን ያሳያል፤ አማርኛው ‘ቆሙ’ መቆምንም መጓዝ ማቋረጥንም በዐውዱ ይይዛል።
- source_word: σκυθρωποί
  choice: ፊታቸው በሐዘን ተሞልቶ
  rationale: ቅጽሉ በፊት ገጽታ የሚታይ ሐዘንን ወይም የተከዘ ሁኔታን ያመለክታል፤ ይህ አገላለጽ የሚታየውን ገጽታ በግልጽ አማርኛ ያሳያል።
