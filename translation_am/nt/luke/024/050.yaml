    text: ወይም፣ “ወደ ቢታንያ” ወይም “እስከ ቢታንያ”፤ የግሪኩ አገላለጽ ቃል በቃል፣ “ወደ ቢታንያ አቅጣጫ እስከ” የሚል ሲሆን መጠነኛ አሻሚነት አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: ይዟቸው ወጣ
  rationale: የἐξάγωን ‘ወደ ውጭ መምራት/ማውጣት’ አቅጣጫዊ ኃይል በተፈጥሯዊ አማርኛ ይገልጻል፤ በዐውዱ ባለቤቱ ኢየሱስ ነው።
