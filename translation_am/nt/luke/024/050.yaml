- source_word: ἐπάρας
  choice: እጆቹንም አንሥቶ
  rationale: ከዋናው ግስ በፊት የሆነውን የእጆች ማንሣት ተግባር በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ያቀርባል።
- source_word: τὰς χεῖρας αὐτοῦ
  choice: እጆቹን
  rationale: ብዙ ቁጥሩንና የባለቤትነት አመልካቹን በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εὐλόγησεν αὐτούς
  choice: ባረካቸው
  rationale: የεὐλογέωን ቀጥተኛ የቡራኬ ድርጊት ይጠብቃል፤ ተጨማሪ ሥርዓታዊ ወይም ካህናዊ ሐሳብ አያስገባም።
