  rationale: ግሪኩ በሁለቱም ግሶች ቀጥተኛ ተሳቢ አይገልጽም፤ ይህ ግን ከቁጥር 42 ዐውድ ይገባል። አማርኛም በዚህ አወቃቀር ተሳቢውን ሳይደግም ተፈጥሯዊና ግልጽ ሊሆን ስለሚችል፣ የምንጩ አሻሚነት እንዳይሰወር ተጠብቋል። ትረካው በደቀ መዛሙርቱ ፊት መብላቱን በግልጽ ይናገራል፤ ከዚያ በላይ የሥነ መለኮት ማብራሪያ አልተጨመረም።
