  choice: በፊታቸው
  rationale: ነገሩ እነርሱ እያዩ በመገኘታቸው እንደተደረገ የሚያሳየውን የግሪኩን ሐረግ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἔφαγεν
  choice: በላ
  rationale: የተፈጸመ የትረካ ድርጊትን ቀጥታና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል። የሚበላው ነገር ከቀዳሚው ቁጥርና ከ«ተቀብሎ» ዐውድ ይታወቃል።
theological_decisions:
