  rationale: The revision retains the source’s continual past setting («ዘወትር … ነበር»), location («በቤተ መቅደስ»), and worship directed to God. It uses the idiomatic Amharic expression «እግዚአብሔርን እያመሰገኑ» for the Greek εὐλογοῦντες τὸν θεόν and documents the more literal “blessing” rendering in the footnote.
