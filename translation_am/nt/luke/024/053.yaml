lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የግሪኩን ቀላል አያያዥ በአማርኛ ተፈጥሯዊ በሆነው «-ም» በመግለጽ ከቀደመው ትረካ ጋር ያገናኛል።
- source_word: ἦσαν
  choice: ሆነው … ነበር
  rationale: ያለፈ ጊዜ ቀጣይ ሁኔታን የሚያሳየውን የግሪክ ኢምፐርፌክት በተፈጥሯዊ የአማርኛ ግንባታ ያቀርባል።
- source_word: διὰ παντός
  choice: ዘወትር
  rationale: በቀጣይነትና በመደበኛነት መደረጉን በአጭርና በተለመደ አማርኛ ይገልጻል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደስ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን የቤተ መቅደሱን ሕንፃና አደባባዮች የሚያካትት ቦታ ነው፤ «ቤተ መቅደስ» መደበኛና አጭር ትርጉም ነው።
- source_word: εὐλογοῦντες
  choice: ይባርኩ
  rationale: የግሪኩን «መባረክ/መልካም መናገር» የሚለውን መሠረታዊ ቃላዊ ቅርጽ ይጠብቃል፤ እግዚአብሔር ተሳቢ ሲሆን «ማመስገን» የሚለውም ትርጉም ይቻላል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም θεόςን በክብርና በተፈጥሯዊነት የሚያቀርብ መደበኛ ስያሜ ነው።
theological_decisions:
- issue: εὐλογοῦντες τὸν θεόν የሚለውን የአምልኮ ንግግር መተርጎም
  choice: እግዚአብሔርን ይባርኩ
  alternative: እግዚአብሔርን ያመሰግኑ
  rationale: εὐλογέω የሚለውን የግሪክ ግስ ቃላዊ ቅርጽ ሳያጠፋ ያቀርባል፤ ነገር ግን እግዚአብሔርን በተመለከተ «ማመስገን» ተፈጥሯዊ የትርጉም አማራጭ መሆኑ በማስታወሻ ተጠብቋል።
