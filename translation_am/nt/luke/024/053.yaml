  text: And they were continually in the temple[a], blessing God.
translation:
  language: am
  text: እነርሱም ዘወትር በቤተ መቅደስ እግዚአብሔርን እያመሰገኑ[a] ነበር።
  philosophy: optimal-equivalence
  footnotes:
