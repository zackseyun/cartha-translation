  choice: እጅግ ፈርተው
  rationale: ἔμφοβος የፍርሃቱን ጥንካሬ ያሳያል፤ γενομένων ደግሞ ይህ ሁኔታ ከዋናው ንግግር በፊት መከሰቱን ያመለክታል። በአማርኛ “እጅግ ፈርተው” ተፈጥሯዊና ግልጽ ነው።
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: ፊታቸውን ወደ መሬት ባዘነበሉ ጊዜ
  rationale: የፍርሃትን ወይም የአክብሮትን አካላዊ እንቅስቃሴ የሚገልጸውን ተጨባጭ ምስል ይጠብቃል፤ የአማርኛው ጊዜያዊ አገናኝም የግሪኩን ተሳቢ አወቃቀር በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: εἶπαν πρὸς αὐτάς
  choice: ሰዎቹ እንዲህ አሏቸው
  rationale: በግሪኩ ያሉት ብዙ ቁጥር ተውላጠ ስሞች ጾታን ስለሚለዩ ተናጋሪዎቹና ተነጋጋሪዎቹ ግልጽ ናቸው። የአማርኛ ብዙ ቁጥር ተውላጠ ስም ጾታን ስለማይለይ፣ “ሰዎቹ” የሚለው ከቀደመው ዐውድ የተወሰደ ማብራሪያ ሲሆን ግራ መጋባትን ይከላከላል።
- source_word: Τί ζητεῖτε
  choice: ለምን ትፈልጋላችሁ?
  rationale: τί በቃል ደረጃ “ምን” ሊባል ቢችልም፣ በዚህ አገባብ ጥያቄው የፍለጋቸውን ተገቢነት ስለሚሞግት “ለምን” በአማርኛ ትርጉሙን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τὸν ζῶντα
  choice: ሕያውን
  rationale: በግሪኩ ያለው ስማዊ ቦዝ አንቀጽ ነጠላና ሰውን የሚያመለክት ነው። “ሕያውን” ይህን ኃይል በአጭርና በክቡር አማርኛ ይጠብቃል።
