  text: ሴቶቹም እጅግ ፈርተው ፊታቸውን ወደ ምድር ሲያጎነብሱ፣ ሰዎቹ እንዲህ አሏቸው፤ “ሕያውን ከሙታን መካከል ለምን ትፈልጋላችሁ?[a]”
  philosophy: optimal-equivalence
  footnotes:
