review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the women’s fear, their lowering of their faces to the ground, the speech addressed to them, and the rhetorical contrast between ‘the living one’ and ‘the dead.’ ‘ሰዎቹ’ is contextually warranted by Luke 24:4, though the Greek of this verse itself uses only a pronoun. The principal needed adjustment is the physical-action wording: ‘ፊታቸውን ... ባዘነበሉ’ is less idiomatic and less direct than the standard expression ‘ፊታቸውን ... ሲያጎነብሱ.’'
  naturalness: The revision uses natural modern standard Amharic. ‘ሲያጎነብሱ’ expresses the ongoing/simultaneous participial action more smoothly than ‘ባዘነበሉ ጊዜ.’ Retaining ‘ሰዎቹ’ avoids an unclear shift of subject in Amharic after a clause whose explicit subject is ‘ሴቶቹ.’
  terminology: ‘ሕያውን’ is an appropriate concise rendering of the singular substantival participle τὸν ζῶντα and preserves the resurrection-context contrast without adding interpretation. ‘ከሙታን መካከል’ is the natural contextual rendering of μετὰ τῶν νεκρῶν. The footnote is adjusted so that its literal alternative does not misleadingly present an unidiomatic ‘ምን’ construction as the contextual sense.
  issues:
  - severity: medium
    issue: ‘ፊታቸውን ወደ መሬት ባዘነበሉ ጊዜ’ is awkward and does not most naturally express κλινουσῶν.
    rationale: For lowering or bowing one’s face, modern standard Amharic idiom is ‘ፊታቸውን ወደ ምድር ሲያጎነብሱ.’ The present participle also better reflects the Greek participle’s attendant, ongoing action.
  - severity: low
    issue: The footnote’s ‘ቃል በቃል’ wording is not a sufficiently clear Amharic presentation of the Greek τί ambiguity.
    rationale: The main text correctly gives the contextual rhetorical sense, ‘ለምን.’ A footnote can identify ‘ምን’ as the more literal value of τί while explaining that the construction means ‘ለምን’ in context.
  revised_text: ሴቶቹም እጅግ ፈርተው ፊታቸውን ወደ ምድር ሲያጎነብሱ፣ ሰዎቹ እንዲህ አሏቸው፤ “ሕያውን ከሙታን መካከል ለምን ትፈልጋላችሁ?[a]”
