    text: ወይም ይበልጥ ቃል በቃል፣ “ሕያውን ከሙታን ጋር ምን ፍለጋ ትፈልጋላችሁ?” በዚህ ዐውድ ግን ጥያቄው “ለምን ትፈልጋላችሁ?” የሚል ትርጉም አለው።
