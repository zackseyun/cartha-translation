id: LUK.24.15
reference: Luke 24:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: am
  text: እንዲህም ሆነ፤ እነርሱ እየተነጋገሩና እየተወያዩ[a] ሳሉ፣ ኢየሱስ ራሱ ቀርቦ አብሯቸው ይጓዝ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየተከራከሩ።” የግሪኩ ቃል የበለጠ የጠነከረ ውይይትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: እንዲህም ሆነ
  rationale: የሉቃስን የትረካ መሸጋገሪያ አገላለጽ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐν τῷ ὁμιλεῖν
  choice: እየተነጋገሩ ... ሳሉ
  rationale: ἐν ከአንቀጻዊ ግሳዊ ስም ጋር ያለውን ጊዜያዊ ትርጉም ‘ሳሉ’ በሚለው ተፈጥሯዊ አወቃቀር ይገልጣል።
- source_word: συζητεῖν
  choice: እየተወያዩ
  rationale: ጥልቅ ውይይትን ሊያመለክት የሚችለውን ቃል ጠብን ሳያጋንን በሰፊ ትርጉም ያቀርባል፤ የክርክር አማራጭ በማስታወሻ ተጠብቋል።
- source_word: αὐτὸς Ἰησοῦς
  choice: ኢየሱስ ራሱ
  rationale: αὐτός በስሙ አጠገብ የሚሰጠውን አጽንዖት በግልጽ ያስቀምጣል።
- source_word: ἐγγίσας
  choice: ቀርቦ
  rationale: ወደ እነርሱ መቅረቡንና ከዋናው ግስ ጋር ያለውን ቅደም ተከተል በአጭር የአማርኛ ተውሳከ ግስ ይገልጣል።
- source_word: συνεπορεύετο
  choice: አብሯቸው ይጓዝ ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይ እንቅስቃሴ ይጠብቃል፤ ‘ይጓዝ’ የመንገድ ጉዞውን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ወደ ተጓዦቹ የቀረበው ማን እንደሆነ የትረካው አጽንዖት
  choice: ኢየሱስ ራሱ ቀርቦ
  alternative: ኢየሱስ ቀርቦ
  rationale: ግሪኩ αὐτὸς Ἰησοῦς የተነሣው ኢየሱስ በግሉ ወደ እነርሱ መቅረቡን በሰዋሰዋዊ አጽንዖት ያቀርባል፤ ትርጉሙም ይህን ያለ ተጨማሪ የእምነት ትርጓሜ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ተደጋጋሚ καί በአማርኛ ተፈጥሯዊ በሆነው ‘እየ...ና እየ... ሳሉ’ አወቃቀር ተቀርቧል። በእንግሊዝኛው የ[b] ማስታወሻ ምልክት ከ‘discussing’ በኋላ የተቀመጠ ቢሆንም ይዘቱ ‘came near and went with them’ የሚለውን አማራጭ ይመለከታል፤ የአማርኛው ዋና ጽሑፍ ‘ቀርቦ አብሯቸው ይጓዝ ነበር’ ብሎ ይህን በቀጥታ ስለሚያቀርብ ያልተፈለገ ተደጋጋሚ ማስታወሻ አልተጨመረም።
