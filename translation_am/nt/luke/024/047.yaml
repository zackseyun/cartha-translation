  source_fidelity: The draft preserves the proclamation, Jesus' name, universal scope, and Jerusalem as the starting point. However, “ኃጢአት ይቅር እንዲባል” is not an idiomatic or sufficiently precise rendering of “forgiveness of sins”; it can sound as though sins themselves are being verbally excused rather than referring to forgiveness received.
