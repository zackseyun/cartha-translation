  terminology: “ንስሐ መግባት” is appropriate modern standard religious terminology. “የኃጢአት ይቅርታ” is the natural established expression for ἄφεσις ἁμαρτιῶν. “ሕዝቦች” appropriately retains the broad sense of ἔθνη; the lexical alternative is retained in the footnote.
