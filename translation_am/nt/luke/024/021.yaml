  choice: «እስራኤልን ሊቤዥ» የሚለውን ሰፊ አገላለጽ መጠበቅ
  alternative: «እስራኤልን ከፖለቲካ ጭቆና ሊያድን» ወይም «በመንፈሳዊ ሁኔታ ሊያድን»
  rationale: ጽሑፉ ቤዛነቱ ፖለቲካዊ፣ መንፈሳዊ ወይም ሁለቱንም መሆኑን አይወስንም፤ ስለዚህ ያለውን ሥነ መለኮታዊ ውጥረት መጠበቅ ይገባል።
- issue: ከἠλπίζομεν በኋላ የመጣው ἐστιν የጊዜ አጠቃቀም
  choice: «እርሱ ነው» በማለት የአሁን ጊዜውን መጠበቅ
  alternative: «እርሱ ነበር» በማለት ሙሉ በሙሉ ወደ ኋላ ማዛወር
  rationale: የግሪኩ አወቃቀር በቀድሞው ተስፋ ይዘት ውስጥ የአሁን ጊዜን ያቆያል፤ አውዱ የተስፋ መቁረጣቸውን በቂ ሁኔታ ያሳያል።
