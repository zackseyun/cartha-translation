base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: am
  text: እኛ ግን እስራኤልን ሊቤዥ የነበረው እርሱ ነው ብለን ተስፋ አድርገን ነበር።[a] ከእነዚህ ሁሉ በተጨማሪ፣[b] እነዚህ ነገሮች ከሆኑ ዛሬ ሦስተኛው ቀን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እርሱ እስራኤልን ሊቤዥ የነበረው ነበር።» በግሪኩ ግን፣ ቀድሞ የነበራቸውን ተስፋ በሚገልጽበት ጊዜም «ነው» የሚለው የአሁን ጊዜ ግስ ተጠቅሟል።
    reason: alternative_reading
  - marker: b
    text: «እስራኤልን መቤዠት» ሰፊ የመሲሓዊ መዳን ተስፋን ሊያመለክት ይችላል፤ ተናጋሪዎቹ ፖለቲካዊ ነፃነትን፣ መንፈሳዊ ድነትን፣ ወይም ሁለቱንም ማለታቸውን ጽሑፉ አይወስንም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: እኛ ግን
  rationale: δέ ከቀደመው ንግግር ጋር ያለውን ንፅፅር ያሳያል፤ ἡμεῖς የሚሰጠውን አጽንዖትም «እኛ» ይጠብቃል።
- source_word: ἠλπίζομεν
  choice: ተስፋ አድርገን ነበር
  rationale: ያልተፈጸመ ሆኖ የታየውን ቀጣይ የቀድሞ ተስፋ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅτι αὐτός ἐστιν
  choice: እርሱ ነው ብለን
  rationale: በቀድሞው ተስፋ ውስጥ የተጠበቀውን የግሪክ የአሁን ጊዜ ግስ ይጠብቃል።
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: ሊቤዥ ያለው
  rationale: μέλλων የሚያመለክተውን የተጠበቀ ወይም በቅርብ የሚፈጸም ድርጊት ያሳያል፤ «ሊቤዥ» የλυτρόομαιን ቤዛነት ያቆያል።
- source_word: τὸν Ἰσραήλ
  choice: እስራኤልን
  rationale: የቃል ቀጥተኛነቱንና ሕዝቡን በአጠቃላይ የሚያመለክተውን ስሜት ይጠብቃል።
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: ከዚህም ሁሉ በተጨማሪ
  rationale: ተጨማሪ ተስፋ አስቆራጭ ሁኔታ እየተጠቀሰ መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: ዛሬ ሦስተኛው ቀን ነው
  rationale: ἄγει በዚህ የጊዜ መቁጠሪያ ፈሊጣዊ አጠቃቀም ነው፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: እነዚህ ነገሮች ከሆኑ
  rationale: ጊዜው መቆጠር የጀመረበትን ነጥብ በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
