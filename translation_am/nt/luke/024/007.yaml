    text: ወይም፣ “ከሞት ሊነሣ።” የግሪኩ ግስ ንቁ ቅርጽ ነው፤ ራሱ መነሣቱን ይገልጣል፣ ሌሎች እንደሚያስነሡት አይገልጽም።
