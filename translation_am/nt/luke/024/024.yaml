  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: am
  text: ከእኛም ጋር ከነበሩት አንዳንዶቹ ወደ መቃብሩ ሄደው፣ ሴቶቹም እንደተናገሩት እንደዚያው አገኙ፤ እርሱን ግን አላዩም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: ሄደው
  rationale: ወደ መቃብሩ የተደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጻል፤ «ወጡ» የመነሻውን ገጽታ ከልክ በላይ ሊያጎላ ይችላል።
- source_word: τινες τῶν σὺν ἡμῖν
  choice: ከእኛም ጋር ከነበሩት አንዳንዶቹ
  rationale: ከተናጋሪዎቹ ጋር ከነበረው ቡድን የተወሰኑ ሰዎችን መሆናቸውን የግሪኩን አወቃቀር ተከትሎ ያሳያል።
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ወደ መቃብሩ
  rationale: በትንሣኤው ትረካ ውስጥ μνημεῖον ኢየሱስ የተቀበረበትን ስፍራ ያመለክታል፤ «መቃብር» በዘመናዊ አማርኛ ግልጽና የተለመደ ነው።
- source_word: εὗρον
  choice: አገኙት
  rationale: ቀላሉን የትረካ ግስ «አገኙ» በተፈጥሯዊ አማርኛ ያቀርባል፤ የነገሩ ሁኔታ በቀጣዩ ሐረግ ይገለጻል።
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: ሴቶቹ እንደተናገሩት ሆኖ
  rationale: በመቃብሩ የተገኘው ሁኔታ ከሴቶቹ ዘገባ ጋር መስማማቱን ያሳያል። καί ያለው ጭማሪያዊ አጽንዖት በአማርኛው ንጽጽርና በ«ም» አያያዥ በበቂ ሁኔታ ተንጸባርቋል።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: ተውላጠ ስሙን እንዳለ በመጠበቅ ወደ ኢየሱስ ያመለክታል፤ ስሙን በግልጽ መጨመር ከምንጩ በላይ ማብራሪያ ይሆናል።
- source_word: δὲ
  choice: ግን
  rationale: መቃብሩን ሴቶቹ እንዳሉት ማግኘታቸውና እርሱን አለማየታቸው መካከል ያለውን ለስላሳ ንጽጽር ያሳያል።
- source_word: οὐκ εἶδον
  choice: አላዩትም
  rationale: ὁράω የሚለውን «ማየት» በትክክል ያስተላልፋል፤ «አላገኙትም» ቢባል የግሱን ትርጉም ይለውጣል።
theological_decisions:
- issue: የትንሣኤው ትረካ አነጋገር
  choice: ጎብኚዎቹ መቃብሩን ሴቶቹ እንደተናገሩት ሁኔታ እንዳገኙት፣ ነገር ግን ኢየሱስን ራሱን እንዳላዩት የሚገልጽ አነጋገር
  alternative: ከሌሎች የወንጌል ዘገባዎች ዝርዝር በመጨመር ትረካውን ማስማማት
  rationale: የግሪኩን ልዩነት—የመቃብሩን ሁኔታ እንደተነገረው ማግኘትና እርሱን አለማየት—ይጠብቃል፤ ከትይዩ ዘገባዎች ያልተጠቀሱ ዝርዝሮችን አያስገባም።
