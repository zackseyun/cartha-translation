  to: ከእኛም ጋር ከነበሩት አንዳንዶቹ ወደ መቃብሩ ሄደው፣ ሴቶቹም እንደተናገሩት እንደዚያው አገኙ፤ እርሱን ግን አላዩም።
  rationale: 'The revision removes the unsupported object from «አገኙት» and renders οὕτως καθὼς as “just so/as the women also said.” It maintains the narrative’s deliberate distinction: the visitors confirmed the women’s report concerning the tomb, but did not see Jesus himself.'
