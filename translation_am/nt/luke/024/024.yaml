review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys that some companions went to the tomb and did not see him. However, «አገኙት» adds a masculine singular object (“found it/him”), whereas εὗρον is objectless here and οὕτως (“so/thus”) refers to the state of affairs as the women reported it. This should be expressed without making the tomb—or Jesus—the direct object of “found.”
  naturalness: The sequence is generally clear, but «ሴቶቹ እንደተናገሩት ሆኖ አገኙት» is less idiomatic and creates an unclear antecedent for the object suffix. «…እንደተናገሩት እንደዚያው አገኙ» is natural modern standard Amharic. Avoiding the repeated object marking in «እርሱን … አላዩትም» also improves flow.
  terminology: «መቃብር» appropriately renders μνημεῖον in this context, and «እርሱን ግን አላዩም» preserves the contrast and the reference to Jesus without unnecessary explicitation.
  issues:
  - severity: medium
    issue: «አገኙት» supplies an unwarranted masculine object.
    rationale: The Greek says they “found [things] so/just as the women said,” not that they found “it” or “him.” In the current wording, the suffix may grammatically suggest either the tomb or Jesus, obscuring the intended contrast with “they did not see him.”
  - severity: low
    issue: The additive καί before “the women” is not represented.
    rationale: Although it can be stylistically understated, «ሴቶቹም» naturally preserves the additive/emphatic connection without overtranslation.
  - severity: low
    issue: Double object marking in «እርሱን … አላዩትም» is unnecessarily heavy.
    rationale: Using the explicit pronoun as the object, «እርሱን ግን አላዩም», is clearer and more natural while retaining the Greek pronoun’s contrastive force.
  revised_text: ከእኛም ጋር ከነበሩት አንዳንዶቹ ወደ መቃብሩ ሄደው፣ ሴቶቹም እንደተናገሩት እንደዚያው አገኙ፤ እርሱን ግን አላዩም።
  revised_footnotes: []
  revision_rationale: 'The revision removes the unsupported object from «አገኙት» and renders οὕτως καθὼς as “just so/as the women also said.” It maintains the narrative’s deliberate distinction: the visitors confirmed the women’s report concerning the tomb, but did not see Jesus himself.'
