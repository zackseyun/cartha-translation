language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: am
  text: በዚያችው ሰዓት ተነሥተው ወደ ኢየሩሳሌም ተመለሱ፤ አሥራ አንዱንና ከእነርሱ ጋር የነበሩትን ተሰብስበው እንዳሉ[a] አገኟቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ አገላለጽ በተገኙ ጊዜ አስቀድመው ተሰብስበው የነበሩበትን ሁኔታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: ተነሥተው
  rationale: የመነሣታቸውን አካላዊ ድርጊት ከዋናው ግስ በፊት እንደተፈጸመ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: በዚያችው ሰዓት
  rationale: ሐረጉ የተጠቀሰውን የተወሰነ ጊዜና አጽንዖቱን ያቆያል፤ ‘ወዲያውኑ’ ብሎ በማስፋት አይተረጉምም።
- source_word: ὑπέστρεψαν
  choice: ተመለሱ
  rationale: ወደ ቀድሞው ስፍራ የተደረገውን የጉዞ መመለስ በቀጥታና በተለመደ አማርኛ ይገልጻል።
- source_word: Ἰερουσαλήμ
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ይጠቀማል።
- source_word: εὗρον
  choice: አገኟቸው
  rationale: በትረካው ውስጥ ያለውን የ‘ማግኘት’ መደበኛ ትርጉም ያስተላልፋል፤ የብዙ ሰዎች ተሳቢነትንም ያመለክታል።
- source_word: ἠθροισμένους
  choice: ተሰብስበው እንዳሉ
  rationale: ፍጹም ተደራጊ አሳታፊው በተገኙበት ጊዜ አስቀድመው ተሰብስበው የነበሩበትን ሁኔታ ይገልጻል፤ ይህ አገላለጽ ድርጊቱን በተመለሱት ሁለት ሰዎች ላይ እንዳይጭን ያደርጋል።
- source_word: τοὺς ἕνδεκα
  choice: አሥራ አንዱን
  rationale: ግሪኩ የቡድኑን መጠሪያ ብቻ ስለሚጠቀም ‘ሐዋርያት’ የሚለውን ያልተጻፈ ማብራሪያ ሳይጨምር በቀጥታ ያቀርባል።
- source_word: τοὺς σὺν αὐτοῖς
  choice: ከእነርሱ ጋር የነበሩትን
  rationale: ከአሥራ አንዱ ጋር የተገኙትን ሌሎች ሰዎች ማንነት ከጽሑፉ በላይ ሳይወስን በግልጽ ያሳያል።
theological_decisions:
- issue: ይሁዳ ባይኖርና ቶማስም ምናልባት በዚያ ባይገኝም ‘አሥራ አንዱ’ የሚለው ስያሜ
  choice: የግሪኩን የቡድን መጠሪያ ‘አሥራ አንዱ’ በቀጥታ ማቆየት
  alternative: ‘አሥራ አንዱ ሐዋርያት’ ወይም ‘የቀሩት ደቀ መዛሙርት’
  rationale: ጽሑፉ τοὺς ἕνδεκα የሚለውን የተለመደ የቡድን ስያሜ ይጠቀማል። ቀጥተኛው ትርጉም በዚያ ጊዜ በትክክል ማን እንደነበረ ለማስማማት የሚደረግን ያልተጻፈ ማብራሪያ ያስወግዳል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ተሰብስበው እንዳሉ’ የሚለው አወቃቀር የግሪኩን ውጤታዊ ሁኔታ በግልጽ ያቆያል፤ ሰሚኮሎኑም የጉዞውንና የማግኘቱን ትረካዊ ደረጃዎች ይለያል።
