  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ «እናንተ ማስተዋል የጎደላችሁ[a]፣ ነቢያት የተናገሩትን ሁሉ ለማመን በልባችሁ የዘገያችሁ[b] ሆይ!»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ማስተዋል የሌላችሁ» ወይም «ሞኞች።»
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «በልብ የዘገያችሁ።» «ልብ» እዚህ የሰውን ውስጣዊ ማንነት ያመለክታል፤ ሐረጉም እግዚአብሔር የተናገረውን ለማመንና ለመቀበል ያለን ዝግታ ይገልጻል።
    reason: cultural_note
