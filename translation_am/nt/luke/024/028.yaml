  text: እነርሱም ወደሚሄዱበት መንደር ቀረቡ፤ እርሱም ወደ ፊት እንደሚሄድ አስመሰለ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ፊት ሊሄድ እንደሆነ አስመሰለ።»
