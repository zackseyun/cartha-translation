  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: am
  text: ከእነርሱም አንዱ፣ ቀለዮጳ የሚባል፣ መልሶ እንዲህ አለው፤ “በኢየሩሳሌም እንደ እንግዳ የምትኖርና በእነዚህ ቀናት በዚያ የሆኑትን ነገሮች የማታውቅ አንተ ብቻ ነህን?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኢየሩሳሌም እንደ መጻተኛ የምትኖር።” የግሪኩ ግስ እንደ ውጭ ሰው ወይም እንደ ጊዜያዊ ነዋሪ የመኖር ፍቺ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: መልሶ
  rationale: የአውሮፓዊውን አውሪስት ተሳቢ ቅርጽ በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጻል፤ δέ ያለው ቀላል ትስስር በአውዱና በ“-ም” ተወክሏል።
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: ከእነርሱም አንዱ፣ ስሙ ቀለዮጳ የተባለው
  rationale: εἷς በአውዱ ከሁለቱ ደቀ መዛሙርት አንዱን ያመለክታል፤ ὀνόματι ደግሞ ‘ስሙ…የተባለ’ ተብሎ በግልጽ አማርኛ ተሰጥቷል።
- source_word: εἶπεν πρὸς αὐτόν
  choice: አለው
  rationale: λέγω + πρός የሚያሳየውን ለእርሱ መናገር በተፈጥሯዊው የአማርኛ ግስ ይገልጻል፤ ስሙን በጽሑፉ ላይ አይጨምርም።
- source_word: Σὺ μόνος
  choice: አንተ ብቻ ነህን?
  rationale: μόνος ያለውን የብቸኝነት አጽንዖት ይጠብቃል፤ የጥያቄውን ኃይልም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παροικεῖς
  choice: በኢየሩሳሌም እንደ እንግዳ እየኖርክ
  rationale: ግሱ እንደ ውጭ ሰው ወይም ጊዜያዊ ነዋሪ መኖርን ያመለክታል፤ ‘እንግዳ’ የውጭነቱን ፍቺ ይጠብቃል።
- source_word: οὐκ ἔγνως
  choice: ያላወቅኸው
  rationale: የአውሪስት ቅርጹን በቅርብ ጊዜ የተፈጸሙትን ነገሮች አሁንም አለማወቅ በሚያሳይ ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις
  choice: በዚህ ቀን የሆነውን ነገር
  rationale: ንባቡ በተፈጥሯዊ አማርኛ ቅርብ ጊዜውን እና በኢየሩሳሌም የተፈጸሙትን ክስተቶች ለመግለጽ የታሰበ ነው።
