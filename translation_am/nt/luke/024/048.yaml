  alternative: ቃሉ በኋለኛው የክርስትና አጠቃቀም ከሰማዕትነት ጋር ያገኘውን ትርጉም ሊያስተጋባ ይችላል።
  rationale: በቅርብ አውዱ ውስጥ ዋናው ሐሳብ ስለ ኢየሱስ መከራ፣ ትንሣኤና የሚሰበከው መልእክት መመስከር ነው፤ ስለዚህ በኋላ የዳበረውን የሰማዕትነት ትርጉም በጥቅሱ ላይ አልተጫነም።
