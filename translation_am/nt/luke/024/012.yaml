revisions:
- from: ጴጥሮስ ግን ተነሥቶ ወደ መቃብሩ ሮጠ፤ ጎንበስ ብሎም ሲመለከት የበፍታ ጨርቆቹን ብቻ ያያል። በሆነውም ነገር እየተደነቀ ወደ ራሱ ሄደ።
  to: ጴጥሮስ ግን ተነሥቶ ወደ መቃብር ሮጠ፤ ጎንበስ ብሎ ይመለከታል፤ የበፍታ ጨርቆቹን ብቻ ያያል፤ በተፈጸመውም ነገር እየተደነቀ ወደ ራሱ ሄደ።
  rationale: The revision separates the participial action of stooping to look in from the historical-present verb ‘he sees,’ removes an avoidable possessive implication for the tomb, and retains the source's unusual ‘to himself’ wording without doctrinal or interpretive expansion.
  reviewer_model: gpt-5.6-terra
