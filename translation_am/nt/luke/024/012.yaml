review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Peter's rising, running, the linen cloths being alone, and his amazement. However, it conflates παρακύψας (having stooped/looked in) with βλέπει (he sees) by rendering both as acts of looking. The Greek historical present βλέπει can be retained naturally as “ያያል.”
  naturalness: “ጎንበስ ብሎም ሲመለከት ... ያያል” is redundant and syntactically awkward in modern Amharic. “ጎንበስ ብሎ ይመለከታል፤ የበፍታ ጨርቆቹን ብቻ ያያል” clearly distinguishes stooping/looking in from seeing.
  terminology: “የበፍታ ጨርቆች” is suitable for τὰ ὀθόνια. “ወደ ራሱ ሄደ” appropriately preserves the unusual, disputed force of πρὸς ἑαυτόν without interpreting it as “home.” “መቃብር” is preferable here to the potentially possessive-sounding “መቃብሩ,” since the Greek simply says “the tomb.”
  issues:
  - severity: medium
    issue: The draft duplicates the perception action in the clause for παρακύψας βλέπει.
    rationale: “ሲመለከት ... ያያል” makes both Greek expressions mean essentially “look/see,” whereas παρακύψας specifically supplies the bodily action of stooping to look in and βλέπει states what Peter sees.
  - severity: low
    issue: “መቃብሩ” can be heard as ‘his tomb.’
    rationale: Although it may function as a definite form in context, “መቃብር” is more idiomatic and avoids adding a possessive nuance not expressed by τὸ μνημεῖον.
  revised_text: ጴጥሮስ ግን ተነሥቶ ወደ መቃብር ሮጠ፤ ጎንበስ ብሎ ይመለከታል፤ የበፍታ ጨርቆቹን ብቻ ያያል፤ በተፈጸመውም ነገር እየተደነቀ ወደ ራሱ ሄደ።
  revised_footnotes: []
  revision_rationale: The revision separates the participial action of stooping to look in from the historical-present verb ‘he sees,’ removes an avoidable possessive implication for the tomb, and retains the source's unusual ‘to himself’ wording without doctrinal or interpretive expansion.
