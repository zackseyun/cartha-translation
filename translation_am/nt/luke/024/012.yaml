  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: am
  text: ጴጥሮስ ግን ተነሥቶ ወደ መቃብር ሮጠ፤ ጎንበስ ብሎ ይመለከታል፤ የበፍታ ጨርቆቹን ብቻ ያያል፤ በተፈጸመውም ነገር እየተደነቀ ወደ ራሱ ሄደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημεῖον
  choice: መቃብሩ
  rationale: በዚህ አውድ የመቃብር ስፍራውን በተፈጥሯዊና በግልጽ አማርኛ ይገልጻል።
- source_word: παρακύψας
  choice: ጎንበስ ብሎም ሲመለከት
  rationale: ወደ መቃብሩ ውስጥ ለማየት ጎንበስ ማለቱንና መመልከቱን ያስተላልፋል።
- source_word: τὰ ὀθόνια
  choice: የበፍታ ጨርቆቹን
  rationale: ቃሉ ለሬሳ መጠቅለያነት የዋሉ የበፍታ ጨርቆችን ያመለክታል፤ ትርጉሙም ከጽሑፉ በላይ ዝርዝር አይጨምርም።
- source_word: μόνα
  choice: ብቻ
  rationale: ጴጥሮስ ከጨርቆቹ በቀር ሌላ እንዳላየ የሚያሳየውን አጽንዖት ይጠብቃል።
- source_word: θαυμάζων
  choice: እየተደነቀ
  rationale: በሆነው ነገር መገረሙንና መደነቁን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የትረካው የግስ ጊዜ በ βλέπει
  choice: ያያል
  alternative: አየ
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በመጠበቅ የትረካውን ሕያውነት ያስተላልፋል።
- issue: πρὸς αὑτόν የሚለው አሻሚ አገላለጽ
  choice: ወደ ራሱ ሄደ
  alternative: ወደ ቤቱ ሄደ
  rationale: የምንጩን ያልተለመደና አሻሚ አገላለጽ ሳይፈታ ይጠብቃል፤ “ወደ ቤቱ” ማለት ትርጓሜን በጽሑፉ ውስጥ ያስገባል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ ታሪካዊ የአሁን ጊዜ በ“ያያል” ተጠብቋል፤ “ወደ ራሱ” የሚለውም የምንጩን አሻሚነት ሆን ብሎ ይይዛል።
