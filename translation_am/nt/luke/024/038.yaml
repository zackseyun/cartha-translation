    issue: ደነገጣችሁ is too specific for τεταραγμένοι.
    rationale: It emphasizes alarm or startlement. τεταραγμένοι describes their state as troubled/disturbed; ተረበሻችሁ more closely represents that meaning without importing a stronger or narrower emotion.
