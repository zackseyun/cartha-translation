    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: ለምን
  rationale: ከτεταραγμένοι ἐστέ ጋር ባለው አገባብ ምክንያትን ይጠይቃል፤ «ለምን» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τεταραγμένοι
  choice: ደነገጣችሁ
  rationale: የተናጋሪዎቹን የውስጥ መረበሽና ድንጋጤ በዘመናዊ አማርኛ በተፈጥሮ ይገልጣል።
- source_word: διαλογισμοὶ
  choice: ጥርጣሬዎች
  rationale: በቅርብ ዐውድ ያለውን አለማመንና ማመንታት ይገልጣል፤ ነገር ግን «ሐሳቦች» ወይም «አስተሳሰቦች» የሚለው ሰፊ የቃሉ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἀναβαίνουσιν
  choice: ይነሣሉ
  rationale: ቃል በቃል ወደ ላይ መውጣትን ቢያመለክትም፣ ለውስጣዊ ሐሳብ መፈጠር «ይነሣሉ» ተፈጥሯዊ አቻ ነው።
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: በልባችሁ
  rationale: የግሪኩን ነጠላ καρδίᾳ ከብዙ ቁጥር ὑμῶν ጋር ያለውን አከፋፋይ አገባብ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: καρδία
  choice: ልብ
  rationale: በመጽሐፍ ቅዱሳዊ አጠቃቀም ሐሳብን፣ ስሜትንና የውስጥ ማንነትን የሚያካትተውን ትርጉም ይጠብቃል።
