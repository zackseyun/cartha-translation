  source_fidelity: The overall clause structure, two causal questions, internal-location imagery, and rendering of διαλογισμοί as doubts are faithful. However, ደነገጣችሁ primarily conveys being startled or alarmed, whereas τεταραγμένοι denotes being troubled, disturbed, or inwardly unsettled. A less narrow term better preserves the Greek distinction from the fear/alarm described in the preceding verse.
  naturalness: The proposed revision is idiomatic, modern standard Amharic and retains a respectful biblical register. በልባችሁ naturally expresses the Greek distributive singular ‘in your heart’ when addressing a group.
  terminology: ልብ appropriately retains καρδία’s biblical sense of the inner person, including thought. ጥርጣሬዎች is contextually defensible for διαλογισμοί; the footnote properly preserves broader alternatives.
  issues:
