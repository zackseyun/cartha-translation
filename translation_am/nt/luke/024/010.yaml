  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: am
  text: እነዚህም መግደላዊት ማርያም፣ ዮሐና፣ የያዕቆብ እናት ማርያም[a]፣ እንዲሁም ከእነርሷ ጋር የነበሩ ሌሎች ሴቶች ነበሩ፤ እነዚህን ነገሮች ለሐዋርያት ይነግሩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል “የያዕቆብ ማርያም” ይላል። ይህ ምናልባት “የያዕቆብ እናት ማርያም” ማለት ነው፤ “የያዕቆብ ሚስት ማርያም” ማለትም ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν
  choice: ነበሩ
  rationale: የግሱን ያለፈ ጊዜ እና ብዙ ቁጥር ይጠብቃል፤ በአማርኛም የተጠቀሱትን ሴቶች ለማስተዋወቅ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ትስስሩን በአማርኛ ተፈጥሯዊ በሆነው አያያዥ ቅጥያ ያሳያል፤ ግልጽ የጊዜ ቅደም ተከተል አይጨምርም።
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: መግደላዊት ማርያም
  rationale: የስሙንና የቦታ መለያውን በተለመደው የአማርኛ ቅርጽ ያቀርባል።
- source_word: Ἰωάννα
  choice: ዮሐና
  rationale: በአማርኛ የተለመደ የግል ስም አጻጻፍ ነው።
- source_word: Μαρία ἡ Ἰακώβου
  choice: የያዕቆብ እናት ማርያም
  rationale: አጭሩ የግሪክ ዝምድና መግለጫ እናትነትን ሊያመለክት እንደሚችል በግልጽና ተፈጥሯዊ አማርኛ ይተረጉማል፤ የምንጩ አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: ከእነርሱ ጋር የነበሩት ሌሎች ሴቶች
  rationale: በግሪኩ ያለውን የሴት ብዙ ቁጥር በግልጽ ያሳያል፤ የተሰወረውን ‘ሴቶች’ ለአማርኛ ግልጽነት ያሟላል።
- source_word: ἔλεγον
  choice: ይነግሩ ነበር
  rationale: ያልተጠናቀቀውን ወይም የቀጠለውን ያለፈ ጊዜ አኳኋን ይጠብቃል።
- source_word: πρὸς τοὺς ἀποστόλους
  choice: ለሐዋርያት
  rationale: የመልእክቱን ተቀባዮች በተለመደው የአማርኛ ክርስቲያናዊ ቃል ይገልጻል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥር ጠብቆ ቀደም ሲል የተገለጹትን ክስተቶችና መልእክት ያመለክታል።
theological_decisions:
- issue: የΜαρία ἡ Ἰακώβου ዝምድና መለያ
  choice: የያዕቆብ እናት ማርያም
  alternative: የያዕቆብ ማርያም፤ ወይም የያዕቆብ ሚስት ማርያም
  rationale: ግሪኩ የዝምድናውን ዓይነት በግልጽ አይናገርም። በወንጌላት የስም አጠራር ልማድ መሠረት እናት የሚለው ትርጉም እጅግ የሚቀርብና በአማርኛ ግልጽ ነው፤ ሆኖም ሌላው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ሁለቱ የግሪክ ሐረጎች በነጠላ ሰረዝ ተለይተው ቀርበዋል፤ የያለፈ ጊዜው ቀጣይነትም ‘ይነግሩ ነበር’ በሚለው ቅርጽ ተጠብቋል።
