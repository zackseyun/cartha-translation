review_pass:
  verdict: revise
  source_fidelity: The temporal rendering of εἰσελθοῦσαι and the negated aorist sense of οὐχ εὗρον are retained. However, ሥጋ primarily denotes ‘flesh’ in modern standard Amharic and is not the most accurate unmarked rendering of Greek σῶμα (‘body’). ሰውነት more directly conveys the source term. The contextual possessive in ሰውነቱን is natural Amharic and does not add the variant’s explicit title and name.
  naturalness: ወደ ውስጥ በገቡ ጊዜ is a clear, natural temporal expression in the narrative context. Replacing ሥጋውን with ሰውነቱን improves precision and avoids an unintended ‘flesh’ sense.
  terminology: Use ሰውነት for σῶμα here. The longer textual variant should likewise use ሰውነት. The footnote anchor must be placed at the term affected by the variant—the body—not at ‘entered.’
  issues:
  - severity: medium
    issue: ሥጋውን is used for τὸ σῶμα.
    rationale: In modern standard Amharic, ሥጋ most directly means ‘flesh,’ whereas σῶμα here means ‘body.’ ሰውነቱን is more source-faithful in this burial and resurrection narrative.
  - severity: low
    issue: The textual-variant footnote anchor follows በገቡ ጊዜ.
    rationale: The reported variant expands ‘the body,’ not ‘entered’; the anchor should follow ሰውነቱን.
  revised_text: ነገር ግን ወደ ውስጥ በገቡ ጊዜ፣ ሰውነቱን[a] አላገኙም።
