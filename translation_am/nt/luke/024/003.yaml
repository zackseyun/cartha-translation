  rationale: የቀረበው የSBLGNT ጽሑፍ τὸ σῶμα (‘ሥጋውን’) ብቻ ይላል። በአንዳንድ ቅጂዎች ያለው ረዘም ያለ ንባብ በዋናው ጽሑፍ ውስጥ ሳይጨመር በማስታወሻ ተጠቅሷል።
