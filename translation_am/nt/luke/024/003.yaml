lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: ወደ ውስጥ በገቡ ጊዜ
  rationale: የግስ ተውሳከ ግስ ቅርጹ አንስታይ ብዙ ቁጥር ሆኖ ቀደም ሲል የተጠቀሱትን ሴቶች ያመለክታል፤ ጊዜያዊ ግንኙነቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: የትረካውን ቀጣይነትና በመቃብሩ ውስጥ ያጋጠመውን ያልተጠበቀ ሁኔታ የሚያሳይ መጠነኛ ንጽጽር ይገልጣል።
- source_word: οὐχ εὗρον
  choice: አላገኙም
  rationale: ያለፈ ጊዜ አሉታዊ ግስን በዘመናዊና ተፈጥሯዊ አማርኛ በቀጥታ ያቀርባል።
- source_word: τὸ σῶμα
  choice: ሥጋውን
  rationale: በቀብር አውድ ውስጥ σῶμα የሚያመለክተውን የሰውነት አካል በክብር የተሞላና በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደ ቃል ይገልጣል፤ ‘አስከሬን’ የሚለውን ተጨማሪ ትርጓሜያዊ ቀለም አያስገባም።
