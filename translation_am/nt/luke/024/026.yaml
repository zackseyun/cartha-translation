lexical_decisions:
- source_word: οὐχὶ
  choice: አል...ምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አሉታዊ ጥያቄ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ταῦτα
  choice: እነዚህን መከራዎች
  rationale: ተውላጠ ጠቋሚውን ይጠብቃል፤ በዐውደ ንባቡም የሚያመለክታቸው መከራዎች መሆናቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔδει
  choice: የግድ አልነበረበትምን
  rationale: በአውዱ ያለውን መለኮታዊና ቅዱስ ቃላዊ አስፈላጊነት ያሳያል፤ ተራ ግዴታ ወይም የማይቀር ክስተት ብቻ አድርጎ አይገድበውም።
- source_word: παθεῖν
  choice: መከራዎች ሊቀበል
  rationale: ‘ሊሠቃይ’ ከሚለው ይልቅ ከቀጥተኛ ተሳቢ ጋር ተፈጥሯዊ የሆነ የአማርኛ አገላለጽ ሲሆን የπάσχωን ትርጉም ይጠብቃል።
- source_word: τὸν χριστὸν
  choice: መሲሑ
  rationale: Χριστός እዚህ የግል ስም ሳይሆን በቅዱሳት መጻሕፍት ፍጻሜ ዐውድ የተጠቀሰ ማዕረግ ነው፤ ‘መሲሕ’ ይህን ትርጉም በግልጽ ያስተላልፋል።
- source_word: καὶ
  choice: -ና
  rationale: ሁለቱን የግስ ሐረጎች ያለ ተጨማሪ የጊዜ ቅደም ተከተል በቀላሉ ያገናኛል።
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: ወደ ክብሩ ሊገባ
  rationale: የመግባትን ምስል፣ አቅጣጫውንና የባለቤትነት ተውላጠ ስሙን በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δόξαν
  choice: ክብር
  rationale: በትንሣኤና ከፍ ከፍ ማለት ዐውድ δόξαን በትክክል የሚወክል የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: αὐτοῦ
  choice: -ሩ
  rationale: የግሪኩን የባለቤትነት ተውላጠ ስም በቀጥታ ይጠብቃል፤ ‘ለእርሱ የተዘጋጀው’ የሚል ትርጓሜ አይጨምርም።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ ትንቢታዊ ፍጻሜን የሚያመለክት ማዕረግ ስለሆነ ‘መሲሕ’ የሚለው ትርጉሙን ይጠብቃል፤ የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ቀርቧል።
- issue: የἔδει ኃይል
  choice: የግድ አልነበረበትምን
  alternative: ማድረግ አይገባውም ነበርን
  rationale: አገላለጹ በእግዚአብሔር ዕቅድና በቅዱሳት መጻሕፍት ፍጻሜ የተመሠረተውን አስፈላጊነት ያቆያል፤ ምንጩ በግልጽ ስላልተጠቀሰ ግን በዋናው ጽሑፍ አይጨመርም።
- issue: የ‘ክብሩ’ ባለቤትነት ትርጉም
  choice: ክብሩ
  alternative: ለእርሱ የተዘጋጀው ክብር
  rationale: የαὐτοῦን አሻሚነት በቀጥታ ይጠብቃል፤ ክብሩ የእርሱ መሆኑን ይናገራል እንጂ የግንኙነቱን ዓይነት በትርጓሜ አይወስንም።
