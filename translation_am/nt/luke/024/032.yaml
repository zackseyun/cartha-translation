  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: am
  text: 'እርስ በርሳቸውም፣ “በመንገድ ላይ ሳለን እርሱ ሲናገረንና መጻሕፍትን ሲከፍትልን[a]፣ ልባችን በውስጣችን እየተቃጠለ አልነበረምን?” እንዲህ አሉ።


    [a] ማለትም፣ የመጻሕፍትን ትርጉም ግልጽ ሲያደርግልን።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ማለትም፣ የመጻሕፍትን ትርጉም ግልጽ ሲያደርግልን።
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: እርስ በርሳቸው ... ተባባሉ
  rationale: የጋራ ውይይቱን በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: Οὐχὶ
  choice: አልነበረምን?
  rationale: አዎንታዊ መልስን የሚጠብቀውን የአጽንዖት ጥያቄ ይጠብቃል።
- source_word: ἡ καρδία ἡμῶν
  choice: ልባችን
  rationale: የግሪኩን ነጠላ ቁጥር በቀጥታ ይጠብቃል፤ በአማርኛም የሁለቱን የጋራ ውስጣዊ ተሞክሮ ለመግለጽ ተፈጥሯዊ ነው።
- source_word: καιομένη
  choice: ይቃጠል
  rationale: የመቃጠልን ዘይቤ ሳይተረጉም ይጠብቃል፤ ስሜታዊ፣ መንፈሳዊ ወይም አእምሯዊ መሆኑን ብቻውን አይወስንም።
- source_word: ἐν ἡμῖν
  choice: በውስጣችን
  rationale: የውስጥ ተሞክሮን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλάλει
  choice: ሲናገረን
  rationale: የኢምፐርፌክት ግሱን ቀጣይነት በአማርኛ የጊዜ አንቀጽ ያስተላልፋል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ ሳለን
  rationale: የጉዞውን ተጨባጭ አውድ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: διήνοιγεν
  choice: ሲከፍትልን
  rationale: የ‘መክፈት’ን ዋና ዘይቤና የግሱን ቀጣይ ገጽታ ይጠብቃል፤ የታሰበው ትርጉም በማስታወሻ ተብራርቷል።
- source_word: τὰς γραφάς
  choice: መጻሕፍትን
  rationale: በዚህ አውድ የተቀደሱትን ጽሑፎች የሚያመለክተውን የተለመደ የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
theological_decisions:
- issue: የ‘ልብ መቃጠል’ ዘይባዊ ኃይል
  choice: “ልባችን በውስጣችን ይቃጠል” የሚለውን ዘይቤ ማቆየት
  alternative: “በጥልቅ ተነካን” ወይም “በውስጣችን እሳት ተሰማን”
  rationale: ጽሑፉ መቃጠሉ ስሜታዊ፣ መንፈሳዊ ወይም አእምሯዊ መሆኑን አይወስንም፤ ዘይቤውን ማቆየት ይህን አሻሚነትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
- issue: የ‘መጻሕፍትን መክፈት’ ዘይቤ
  choice: በዋናው ጽሑፍ “ሲከፍትልን” ብሎ ማቆየት
  alternative: “ሲያብራራልን”
  rationale: የግሪኩን የመክፈት ምስል ይጠብቃል፤ የትርጉም ግልጽነቱን በእግር ማስታወሻ ማብራራት ከልክ ያለፈ ትርጓሜን ከዋናው ጽሑፍ ያርቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ነጠላ ‘ልብ’ ተጠብቋል፤ በአማርኛ ‘ልባችን’ ነጠላ ስለሆነ የ‘ልቦቻችን’ አማራጭ ማስታወሻ አላስፈለገም። በመንገድ/በጉዞ ላይ ያለው ልዩነትም በዚህ አውድ ተጨማሪ ማስታወሻ የሚጠይቅ አይደለም።
