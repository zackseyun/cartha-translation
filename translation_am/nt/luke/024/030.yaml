  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: am
  text: እንዲህም ሆነ፤ ከእነርሱ ጋር በማዕድ በተቀመጠ[a] ጊዜ፣ እንጀራውን ወስዶ ባረከው፤ ቆርሶም ሊሰጣቸው ጀመረ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነርሱ ጋር በማዕድ ተደግፎ በተቀመጠ ጊዜ።” የግሪኩ ቃል በጥንቱ የመመገቢያ ልማድ መሠረት በማዕድ ተደግፎ መቀመጥን በተለየ ሁኔታ ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ይሰጣቸው ነበር።” የግሪኩ ኢምፐርፌክት ግስ ቀጣይ ድርጊትን ሊያጎላ ይችላል፤ “ሊሰጣቸው ጀመረ” የሚለው በዚህ አውድ የድርጊቱን መጀመር ያንጸባርቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: እንዲህም ሆነ
  rationale: የሉቃስን የትረካ መሸጋገሪያ አገላለጽ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: ከእነርሱ ጋር በማዕድ በተቀመጠ ጊዜ
  rationale: የግሪኩን ጊዜ አመልካች አወቃቀር ይገልጣል፤ κατακλίνω በምግብ አውድ ለመብላት መቀመጥን፣ በታሪካዊ ልማዱም ተደግፎ መቀመጥን ያመለክታል።
- source_word: λαβὼν τὸν ἄρτον
  choice: እንጀራውን አንሥቶ
  rationale: የግሪኩን ተከታታይ ድርጊት በተፈጥሯዊ የአማርኛ ቦዝ አንቀጽ ያቀርባል፤ የተወሰነው አመልካችም በ -ው ተጠብቋል።
- source_word: εὐλόγησεν
  choice: ባረከ
  rationale: በምግብ ላይ በረከት መናገሩን በቀጥታ ያስተላልፋል፤ ‘አመሰገነ’ ብሎ በመተርጎም εὐχαριστέωን አያስገባም።
- source_word: κλάσας
  choice: ከቆረሰውም በኋላ
  rationale: የአኦሪስት ቦዝ አንቀጹ ከዋናው ግስ በፊት የተፈጸመ ድርጊት መሆኑን ግልጽ ያደርጋል።
- source_word: ἐπεδίδου
  choice: ሊሰጣቸው ጀመረ
  rationale: የኢምፐርፌክት ግሱን ቀጣይነት ወይም የድርጊቱን መጀመር ይጠብቃል፤ በዚህ ትረካዊ አውድ የማከፋፈሉን መጀመር ያሳያል።
theological_decisions:
- issue: የምግቡ ድርጊቶች ሊኖራቸው የሚችለው የጌታ እራት ወይም የምሥጢር ሥርዓት አንድምታ
  choice: የጥቅሱን የተራ የማዕድ ቋንቋ ጠብቆ ያለ ሥርዓታዊ ማብራሪያ መተርጎም
  alternative: አገላለጹን የጌታን እራት ይበልጥ እንዲያስታውስ አድርጎ መተርጎም
  rationale: ‘አነሣ፣ ባረከ፣ ቆረሰ፣ ሰጠ’ የሚለው ቅደም ተከተል ሌሎች የምግብ ትረካዎችን ሊያስታውስ ቢችልም፣ ጥቅሱ ራሱ ድርጊቱን የምሥጢር ሥርዓት ብሎ አይጠራውም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በማዕድ” የምግብ አውዱን በአጭሩ ያሳያል፤ ታሪካዊው የተደግፎ መቀመጥ ልማድ በማስታወሻ ተገልጧል።
