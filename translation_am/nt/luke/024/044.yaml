base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: am
  text: ከዚያም እንዲህ አላቸው፤ “ገና ከእናንተ ጋር ሳለሁ የነገርኳችሁ ቃሎቼ እነዚህ ናቸው፤ ስለ እኔ[c] በሙሴ ሕግ፣ በነቢያትና በመዝሙራት[b] የተጻፈው ሁሉ[a] ሊፈጸም ይገባል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተጻፉት ነገሮች ሁሉ።”
    reason: lexical_alternative
  - marker: b
    text: “የሙሴ ሕግ፣ ነቢያትና መዝሙራት” የሚለው ምናልባት የእስራኤልን ቅዱሳት መጻሕፍት ዋና ክፍሎች ያመለክታል፤ “መዝሙራት” በተለይ መዝሙረ ዳዊትን ወይም በሰፊው “ጽሑፎች” የተባለውን ክፍል ሊወክል ይችላል።
    reason: cultural_note
  - marker: c
