  text: And they gave him a piece of broiled fish[a].
translation:
  language: am
  text: እነርሱም ከተጠበሰ ዓሣ አንድ ቁራጭ ሰጡት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የኋለኞቹ የእጅ ጽሑፎች፣ «ከማር ወለላም ጥቂት» የሚለውን ይጨምራሉ።
