lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: οἱ በስም ምትክ ሆኖ ቀደም ሲል የተጠቀሱትን ደቀ መዛሙርት ያመለክታል፤ δέ ደግሞ ለስላሳ አያያዥ ስለሆነ፣ «እነርሱም» የታሪኩን ተከታታይነት በተፈጥሮ ያሳያል።
- source_word: ἐπέδωκαν αὐτῷ
  choice: ሰጡት
  rationale: ἐπιδίδωμι በዚህ አውድ «መስጠት/አሳልፎ መስጠት» ማለት ነው፤ የተቀባዩ ተውላጠ ስም αὐτῷ በአማርኛው «-ት» በሚለው ቅጥያ በተፈጥሮ ተገልጿል።
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: ከተጠበሰ ዓሣ አንድ ቁራጭ
  rationale: μέρος የሐረጉ ዋና ስም ሲሆን «ቁራጭ/ክፍል» ማለት ነው፤ ἰχθύος ὀπτοῦ ደግሞ ቁራጩ ከተጠበሰ ዓሣ መሆኑን ይገልጣል። ይህ አገላለጽ ትርጉሙን በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὀπτοῦ
  choice: የተጠበሰ
  rationale: ὀπτός ምግብን በእሳት ወይም በሙቀት መጥበስን ያመለክታል፤ «የተጠበሰ» ከአጠቃላዩ «የበሰለ» ይልቅ የምንጩን ልዩ ትርጉም ይጠብቃል።
theological_decisions:
- issue: የሉቃስ 24፥42 የጽሑፍ ቅርጽ
  choice: በSBLGNT ያለውን «ከተጠበሰ ዓሣ አንድ ቁራጭ» ብቻ በዋናው ጽሑፍ ማስቀመጥ
  alternative: አንዳንድ የኋለኞቹ የእጅ ጽሑፎች «ከማር ወለላም ጥቂት» የሚለውን ይጨምራሉ።
  rationale: የቀረበው የግሪክ ምንጭ μέρος በሚለው ቃል ያበቃል፤ ስለዚህ ዋናው ትርጉም ያንኑ ይከተላል። የታወቀው ረዘም ያለ ንባብ ግን ለጽሑፍ ግልጽነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እነርሱም» ትረካዊ ቅደም ተከተሉን ያስቀጥላል፤ «ከተጠበሰ ዓሣ አንድ ቁራጭ» ደግሞ የግሪኩን አወቃቀር ሳያዛባ በተፈጥሯዊ አማርኛ ያቀርባል።
