review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the paired imperatives, the emphatic personal identification, tactile verification, and the contrast between a spirit and Jesus’ visible flesh and bones. However, the final Amharic clause is grammatically and semantically malformed: «እኔ እንዳለኝ ሆኜ የምታዩትን…» does not naturally express καθὼς ἐμὲ θεωρεῖτε ἔχοντα. It should state that the disciples see flesh and bones on/in him.'
  naturalness: The opening is clear and appropriately elevated. «እኔ ራሴ ነኝ» is more idiomatic than the doubly emphatic «እኔው ራሴ ነኝ». The corrected final wording is natural modern standard Amharic while preserving the Greek comparison.
  terminology: «ዳስሱኝ», «መንፈስ», and «ሥጋና አጥንት» are suitable and accurate. The footnote’s alternative «መንፈሰ ሙት» is possible but should remain explicitly an alternative rather than replacing the direct rendering «መንፈስ».
  issues:
  - severity: high
    issue: The final clause is ungrammatical and obscures the source relation between Jesus and the flesh and bones the disciples observe.
    rationale: The Greek means that a spirit does not have flesh and bones, whereas the disciples see Jesus himself having them. «እኔ እንዳለኝ ሆኜ የምታዩትን» fails to convey this in intelligible Amharic.
  - severity: low
    issue: The phrase «እኔው ራሴ ነኝ» is overly redundant in modern Amharic.
    rationale: «እኔ ራሴ ነኝ» adequately conveys the emphatic ἐγώ εἰμι αὐτός without unnecessary stacking of emphatic forms.
  revised_text: እጆቼንና እግሮቼን ተመልከቱ፤ እኔ ራሴ ነኝ።[a] ዳስሱኝና እዩ፤[b] መንፈስ[c] እናንተ በእኔ ላይ እንደምታዩት ሥጋና አጥንት የለውምና።
