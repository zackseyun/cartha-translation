  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ዳስሱኝ» የትእዛዙን የአካላዊ ምርመራ ኃይል ይጠብቃል፤ «እኔው ራሴ» የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
