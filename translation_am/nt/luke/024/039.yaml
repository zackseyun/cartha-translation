  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: am
  text: እጆቼንና እግሮቼን ተመልከቱ፤ እኔ ራሴ ነኝ።[a] ዳስሱኝና እዩ፤[b] መንፈስ[c] እናንተ በእኔ ላይ እንደምታዩት ሥጋና አጥንት የለውምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እኔ እርሱ ነኝ»። የግሪኩ አገላለጽ አጽንዖት አለው፦ «እኔ ራሴ ነኝ [ያው ሰው]»። የመጀመሪያው ὅτι «እኔ ራሴ መሆኔን» ወይም «እኔ ራሴ ነኝና» ተብሎም ሊገናኝ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ንኩኝና እዩ»። የግሪኩ ቃል በእጅ በመዳሰስ ማረጋገጥን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: እዚህ «መንፈስ» የሚለው ቃል አካል ከሌለው ፍጡር ጋር የሚደረገውን ንጽጽር ያሳያል፤ «መንፈሰ ሙት» ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: ተመልከቱ / እዩ
  rationale: የብዙ ሰዎች የትእዛዝ ቅርጽ ሲሆን በቅርብ እንዲመረምሩ ይጋብዛል። በመጀመሪያው ስፍራ «ተመልከቱ»፣ በሁለተኛው «እዩ» ተብሎ ተፈጥሯዊ ልዩነት ተጠብቋል።
- source_word: χεῖράς ... πόδας
  choice: እጆቼንና እግሮቼን
  rationale: የአካል ክፍሎቹን ቀጥተኛ ትርጉም ያቀርባል፤ የሚናገረው ሰው ማንነትና አካላዊ መገኘት እንዲረጋገጥ ያደርጋል።
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: እኔው ራሴ ነኝ
  rationale: ἐγώ እና αὐτός የሚሰጡትን ጠንካራ የግል ማንነት አጽንዖት «እኔው ራሴ» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ψηλαφήσατέ
  choice: ዳስሱኝ
  rationale: ቃሉ በእጅ በመንካት ወይም በመዳሰስ ማረጋገጥን ያመለክታል፤ «ዳስሱኝ» ከቀላል «ንኩኝ» ይልቅ የምርመራውን ኃይል ይጠብቃል።
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: የግሪኩ ቀጥተኛና በአማርኛ የተለመደ አቻ ነው፤ «ጭራቅ» ወይም «መንፈሰ ሙት» ያልተገለጸ ባህላዊ ትርጓሜ ሊጨምር ይችላል።
- source_word: σάρκα καὶ ὀστέα
  choice: ሥጋና አጥንት
  rationale: በዚህ አውድ ቀጥተኛ አካላዊ አገላለጽ ነው፤ የትንሣኤውን አካላዊ እውነታ ሳያለዝብ ያቀርባል።
- source_word: θεωρεῖτε
  choice: የምታዩትን
  rationale: ጥንቃቄ ያለውን ምልከታ ሊጠቁም ቢችልም፣ «የምታዩት» በአሁኑ አውድ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἔχοντα
  choice: እኔ እንዳለኝ ሆኜ
  rationale: ተሳቢው ἐμέን የሚገልጠውን አሳታፊ ቅርጽ በአማርኛ ተፈጥሯዊ አንቀጽ ያቀርባል፣ ኢየሱስ ሥጋና አጥንት እንዳለው የሚያዩት መሆኑን ያሳያል።
theological_decisions:
- issue: ኢየሱስ ከትንሣኤው በኋላ ስለ አካላዊ እውነታው የተናገረው
  choice: «መንፈስ ... ሥጋና አጥንት የለውም» የሚለው ግልጽ አካላዊ ንግግር ተጠብቋል።
  alternative: አካላዊ ንጽጽሩን የሚያለዝቡ ወይም መንፈስን በትርጓሜ «መንፈሰ ሙት» ብለው የሚወስኑ አቀራረቦች
  rationale: ግሪኩ በማየት፣ በመዳሰስ፣ በሥጋና በአጥንት አገላለጽ ተጨባጭ አካላዊነትን አጥብቆ ያሳያል። ትርጉሙ ይህን ሳይቀንስና ከጥቅሱ በላይ የእምነት ማብራሪያ ሳይጨምር ጠብቆታል።
- issue: የመጀመሪያው ὅτι የአገባብ ግንኙነት
  choice: እይታው የሚያረጋግጠውን ይዘት እንደሚያስተዋውቅ ተተርጉሟል፦ «እኔው ራሴ ነኝ»።
  alternative: ምክንያታዊ ግንኙነት፦ «እኔው ራሴ ነኝና»
  rationale: ὅτι ይዘትንም ምክንያትንም ሊያመለክት ይችላል። በዚህ ስፍራ እጆቹንና እግሮቹን በማየት የሚታወቀውን ማንነት እንደሚያቀርብ መውሰድ የግሪኩን ቅርጽ ይጠብቃል፤ የምክንያት ንባቡ ግን እውነተኛ አማራጭ ነው።
