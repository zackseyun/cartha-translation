base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: am
  text: እነርሱም ራሳቸው በመንገድ ላይ የሆነውን ነገር፣ እንጀራውን በመቁረስም እንዴት እንደታወቀላቸው[a] ይተርኩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንዴት እንዳወቁት።» የግሪኩ ግስ ተገብሮ ነው፤ እርሱ ለእነርሱ መታወቁን ወይም እነርሱ እርሱን ማወቃቸውን ሊያጎላ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: እነርሱም ራሳቸው
  rationale: ግልጽ ተውላጠ ስሙ በዐውዱ ያለውን አጽንዖት ይጠብቃል፤ እነዚያ ሁለት ደቀ መዛሙርት የራሳቸውን ልምምድ እየተናገሩ ነው።
- source_word: ἐξηγοῦντο
  choice: ይተርኩ ነበር
  rationale: የኢምፐርፌክት ግስ ቀጣይነት ያለውን ትረካ ያመለክታል፤ ‘ይተርኩ ነበር’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: በመንገድ ላይ የሆነውን
  rationale: የግሪኩን አጭርና በዐውድ የሚሞላ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὡς
  choice: እንዴት
  rationale: የሪፖርቱን ይዘትና የመታወቁን ሁኔታ በተፈጥሯዊ መንገድ ያስገባል።
- source_word: ἐγνώσθη αὐτοῖς
  choice: እንዳወቁት
  rationale: በአማርኛ የመታወቅን ክስተት ግልጽና ተፈጥሯዊ ያደርጋል፤ የግሪኩ ተገብሮ ቅርጽ የሚያስችለው ሌላ ንባብ በማስታወሻ ተጠብቋል።
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: እንጀራው ሲቆረስ
  rationale: የተወሰነውን የምግብ ትዕይንትና የግሪኩን የድርጊት ስም በዘመናዊ አማርኛ በተፈጥሯዊነት ይገልጣል።
theological_decisions:
- issue: ἐγνώσθη የሰዎቹን ማወቅ ብቻ ወይስ እርሱ ለእነርሱ መገለጡን እንደሚያጎላ መወሰን
  choice: በዋናው ጽሑፍ ‘እንዳወቁት’ ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሞ፣ ተገብሮው ‘እንዴት እንደታወቀላቸው’ ሊሆን እንደሚችል በማስታወሻ ተጠብቋል።
  alternative: እንዴት እንደታወቀላቸው
  rationale: ግሪኩ ተገብሮ ግስ ስለሚጠቀም የሰዎቹን መለየትም ሆነ እርሱ ለእነርሱ መታወቁን ሊያጎላ ይችላል፤ ማስታወሻው ይህን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። ‘እንጀራው’ በዐውዱ ያለውን የተወሰነ ምግብ ይጠብቃል፤ የἐγνώσθη አሻሚነት በእግር ማስታወሻ ተመዝግቧል።
