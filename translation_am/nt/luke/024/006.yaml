  rationale: በግሪክ ግልጽ ሰዋሰዋዊ ባለቤት ባይኖርም ዐውዱ ኢየሱስን ያመለክታል፤ «እርሱ» በአማርኛ ሐረጉን ግልጽና ተፈጥሯዊ ያደርገዋል። ὧδε የቦታ ተውሳክ ስለሆነ «እዚህ» ተብሏል።
- source_word: ἀλλὰ
