- source_word: μνήσθητε
  choice: አስታውሱ
  rationale: የግሪኩን ቀጥተኛ የትእዛዝ ኃይል በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὡς ἐλάλησεν ὑμῖν
  choice: እንዴት እንደነገራችሁ
