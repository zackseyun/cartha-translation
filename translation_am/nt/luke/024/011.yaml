  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: am
  text: እነዚህ ቃላት ለእነርሱ እንደ የማይረባ ወሬ[a] መሰሉ፤ ሴቶቹንም አላመኗቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከንቱ ወሬ” ወይም “የተዘበራረቀ ንግግር።” የግሪኩ λῆρος እንደሌለው ወይም እንደማይረባ የተቆጠረ ንግግርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: መሰሉአቸው
  rationale: በዚህ የግምገማ አውድ ግሱ በዓይን መታየትን ሳይሆን ንግግሩ በእነርሱ ዘንድ እንዴት እንደተቆጠረ ያመለክታል።
- source_word: ἐνώπιον αὐτῶν
  choice: ለእነርሱ
  rationale: ቃል በቃል ‘በፊታቸው’ ቢሆንም፣ ከ‘መሰለ’ ጋር በተፈጥሯዊ አማርኛ የእነርሱን አመለካከት ለመግለጽ ‘ለእነርሱ’ ተመርጧል።
- source_word: ὡσεὶ λῆρος
  choice: ከንቱ ወሬ
  rationale: λῆρος ትርጉም የሌለው፣ የማይረባ ወይም የተዘበራረቀ ንግግር ተብሎ የሚቆጠርን ነገር ያመለክታል፤ ‘ከንቱ ወሬ’ ይህን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰ ῥήματα ταῦτα
  choice: እነዚህ ቃላት
  rationale: የግሪኩን አመልካች ሐረግ በቀጥታ የሚከተልና በአማርኛ የሚገባ አተረጓጎም ነው።
- source_word: ἠπίστουν
  choice: አላመኑአቸውም
  rationale: ያለፈ ጊዜ ቀጣይ አለማመንን በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ለማመን እምቢ አሉ’ የሚለው በግሱ ውስጥ ያልተገለጸ የፈቃድ አጽንዖት ስለሚጨምር አልተመረጠም።
- source_word: αὐταῖς
  choice: ሴቶቹን
  rationale: የሴት ብዙ ቁጥር ተውላጠ ስም ሲሆን በቅርብ አውዱ የተጠቀሱትን ሴቶች ያመለክታል፤ ማጣቀሻውን ግልጽ ለማድረግ ‘ሴቶቹን’ ተብሏል።
