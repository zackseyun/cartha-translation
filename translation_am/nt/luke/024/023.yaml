- source_word: ὀπτασίαν ἀγγέλων
  choice: የመላእክትን ራእይ
  rationale: ὀπτασία ከተራ እይታ ይልቅ ልዩ መገለጥን ያመለክታል፤ «ራእይ» ይህን በግልጽና በክብር ያስተላልፋል።
- source_word: ἑωρακέναι
  choice: እንዳዩ
  rationale: በλέγουσαι የሚመራውን ቀጥተኛ ያልሆነ ዘገባ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἳ λέγουσιν
  choice: መላእክቱም … ይላሉ
  rationale: የወንድ ብዙ ቁጥር አንጻራዊ ተውላጠ ስም οἳ በተፈጥሮ ወደ ἀγγέλων ይመለሳል፤ ስሙን መድገም በአማርኛ የማጣቀሻውን ግልጽነት ያስጠብቃል።
- source_word: αὐτὸν ζῆν
