  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: am
  text: አካሉን ሳያገኙ፣ መጥተው ደግሞ[b] የመላእክትን ራእይ እንዳዩ ተናገሩ፤ መላእክቱም እርሱ ሕያው ነው ይላሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ምናልባትም ያነሰ ዕድል ባለው አገባብ፦ «አካሉን ሳያገኙ፣ መጥተው የመላእክትን ራእይ እንዳዩና እርሱ ሕያው ነው እንዳሉ ተናገሩ»። በዚህ አገባብ «ይላሉ» የሚለው ወደ ሴቶቹ ይመለሳል እንጂ ወደ መላእክቱ አይደለም።
    reason: alternative_reading
  - marker: b
