  choice: ሳያገኙ
  rationale: የሴቶቹን ድርጊት የሚገልጸውን አሉታዊ ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸ σῶμα αὐτοῦ
  choice: ሥጋውን
  rationale: በመቃብርና በትንሣኤ አውድ ውስጥ σῶμα የኢየሱስን ሰውነት ያመለክታል፤ «ሥጋ» በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና ግልጽ ነው።
- source_word: ἦλθον λέγουσαι
  choice: መጥተው … ተናገሩ
  rationale: ἦλθονን በቀጥታ «መጥተው» ይተረጉማል፤ ተጓዳኙን λέγουσαι ደግሞ በተፈጥሯዊ የአማርኛ ትረካ «ተናገሩ» ብሎ ያቀርባል።
- source_word: καὶ
