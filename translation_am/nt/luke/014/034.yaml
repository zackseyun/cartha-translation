base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: am
  text: ስለዚህ ጨው መልካም ነው፤ ነገር ግን ጨው እንኳ ጣዕሙን ቢያጣ[a]፣ በምን ይጣፈጣል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሞኝ ቢሆን።” የግሪኩ ግስ ቃል በቃል “ሞኝ መሆን” ሊል ይችላል፤ እዚህ ግን ጨው ጣዕሙን ማጣቱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: መልካም ነው
  rationale: ጨውን በአጠቃላይ አዎንታዊ ሁኔታ የሚገልጸውን καλός በተፈጥሯዊና ክቡር አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትምህርት ጋር ያለውን የድምዳሜ ወይም የውጤት ግንኙነት በግልጽ ያሳያል።
- source_word: ἅλας
  choice: ጨው
  rationale: ቀጥተኛውን ምሳሌያዊ ምስል ያለ ማብራሪያ ይጠብቃል።
- source_word: ἐὰν δὲ καὶ
  choice: ነገር ግን ... እንኳ ... ቢ-
  rationale: δέ የሚያሳየውን ንፅፅር፣ καί የሚሰጠውንም ‘እንኳ’ የሚል አጽንዖት በተፈጥሯዊ የአማርኛ ሁኔታ ያቀርባል።
- source_word: μωρανθῇ
  choice: ጣዕሙን ቢያጣ
  rationale: ከጨው ጋር በዚህ ዐውድ ግሱ የሚያመለክተውን ጣዕም አልባ መሆን በተለመደና ግልጽ አማርኛ ይገልጻል፤ ቃል በቃል ‘ሞኝ መሆን’ የሚለውን እንግዳ አገላለጽ አያስገባም።
- source_word: ἐν τίνι
  choice: በምን
  rationale: ድርጊቱ በምን አማካይነት እንደሚፈጸም የሚጠይቀውን ሐረግ በቀጥታ ያስተላልፋል።
- source_word: ἀρτυθήσεται
  choice: ይጣፍጣል
  rationale: የማጣፈጥን የምግብ ምስል ይጠብቃል፤ ‘ይመለሳል’ ብሎ ምሳሌውን ከመተርጎም ይቆጠባል።
theological_decisions:
- issue: የጨው ንግግር ምሳሌያዊ ኃይል
  choice: ምሳሌያዊውን ንግግር ቃል በቃል ማቆየት፣ ለደቀ መዝሙርነት ያለውን አተገባበር በትርጉሙ ውስጥ አለማስፋት
  alternative: ‘ደቀ መዛሙርት ልዩነታቸውን ቢያጡ’ ብሎ ትርጓሜውን በግልጽ ማስገባት
  rationale: የቁጥሩን ምሳሌያዊ ውጥረትና ከአካባቢው ዐውድ ጋር ያለውን የትርጉም ግንኙነት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘ጨው እንኳ’ የግሪኩን አጽንዖት ይጠብቃል፤ የመጨረሻውም ጥያቄ የምግብ ማጣፈጥ ምስሉን እንዳለ ያቆያል።
