- source_word: ἄνθρωπός τις
  choice: አንድ ሰው
  rationale: የተወሰነ ነገር ግን ስሙ ያልተጠቀሰ ሰው መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἦν
  choice: ነበር
  rationale: የεἰμί ያለፈ ጊዜ ቀጣይ ቅርጽን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: ὑδρωπικὸς
  choice: ሰውነቱ በፈሳሽ ያበጠ
  rationale: ቃሉ በሰውነት ውስጥ ፈሳሽ በመከማቸቱ የሚመጣውን እብጠት ያመለክታል። ይህ አገላለጽ ግልጽ ነው፣ የግሪኩንም የታመመ ሰው ገላጭ ቅርጽ ይጠብቃል።
- source_word: ἔμπροσθεν αὐτοῦ
  choice: በፊቱ
  rationale: የቦታውን ‘ከፊቱ’ ትርጉምና በእርሱ ፊት መገኘትን የሚያመለክተውን ሰፊ ስሜት ሳይገድብ ይጠብቃል።
