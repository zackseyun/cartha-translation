lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የትረካውን ትስስር በተፈጥሯዊ የአማርኛ አያያዥ ይጠብቃል፤ በግሪኩ የሌለ የጊዜ ትርጉም አይጨምርም።
- source_word: ἰδοὺ
  choice: እነሆ
