source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: am
  text: ከእርሱ ጋር በማዕድ ከተቀመጡት አንዱ እነዚህን ነገሮች ሲሰማ፣ “በእግዚአብሔር መንግሥት እንጀራ[a] የሚበላ ብፁዕ ነው!” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንጀራ መብላት” ማለት ምግብ አብሮ መብላትን ወይም በግብዣ መካፈልን ሊያመለክት ይችላል፤ እዚህ ላይ የግሪኩ ቃል ቀጥተኛ ምስል ተጠብቋል።
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: ይህን ሲሰማ
  rationale: የግሪኩን አኦሪስት ተሳቢ ግስ በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ተርጉሞ፣ ወደ ቀደመው የኢየሱስ ንግግር የሚያመለክተውን ταῦτα በነጠላው ‘ይህን’ ያቀርባል።
- source_word: δέ
  choice: በአማርኛ የአረፍተ ነገሩ ፍሰት ተገልጿል
  rationale: δέ ቀላል የትረካ ሽግግር ነው፤ ‘ነገር ግን’ ማለት ከአውዱ በላይ ጠንካራ ተቃርኖ ስለሚፈጥር ሽግግሩ በቃላት ቅደም ተከተል ተገልጿል።
- source_word: τις τῶν συνανακειμένων
  choice: ከእርሱ ጋር በማዕድ ከተቀመጡት አንዱ
  rationale: ያልተጠቀሰ አንድ የማዕድ ተካፋይን ያመለክታል። ‘በማዕድ ተቀመጡ’ የጋራ ምግብ አውድን በተፈጥሯዊ አማርኛ ይገልጣል፤ የጥንቱን በጎን ተደግፎ የመመገብ አቀማመጥ በዋናው ጽሑፍ አያስገድድም።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: የግሪኩን ‘ለእርሱ አለ’ በአጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ይሰጣል።
- source_word: Μακάριος
  choice: ብፁዕ ነው
  rationale: ቃሉ ተራ የስሜት ደስታን ብቻ ሳይሆን የተባረከና በመለኮታዊ ሞገስ ያለ ሁኔታን ይገልጣል። ‘ብፁዕ’ ይህን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል።
- source_word: ὅστις φάγεται
  choice: የሚበላ
  rationale: ὅστις አጠቃላይ እና ክፍት ማመልከቻ አለው፤ የአማርኛው አንጻራዊ ግስ ይህን በተፈጥሯዊነት ይገልጣል። የግሪኩ የወደፊት ጊዜ በአውዱ ወደፊታዊ የመንግሥት ግብዣን ያመለክታል፤ በአማርኛ ግን ‘የሚበላ’ ተፈጥሯዊ ነው።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: ቀጥተኛውን የ‘እንጀራ’ ምስል ይጠብቃል፤ ቃሉ በአውዱ ሙሉ ምግብን ወይም ግብዣን ሊወክል ቢችልም ‘ግብዣ’ የሚለው በዋናው ጽሑፍ አልተጨመረም።
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: በእግዚአብሔር መንግሥት
  rationale: የግሪኩን የቦታ/የሁኔታ ሐረግ በቀጥታና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በወደፊቱ የመንግሥት ማዕድ ንግግር ውስጥ የ Μακάριος ትርጉም
  choice: በእግዚአብሔር መንግሥት እንጀራ የሚበላ ብፁዕ ነው
  alternative: በእግዚአብሔር መንግሥት እንጀራ የሚበላ ደስተኛ ነው
  rationale: ‘ብፁዕ’ በመንግሥቱ መካፈል ጋር የተያያዘውን መለኮታዊ ሞገስና ኤስካቶሎጂያዊ ክብደት ይጠብቃል፤ ‘ደስተኛ’ ግን ንግግሩን ወደ ግላዊ ስሜት ሊያጠብ ይችላል።
