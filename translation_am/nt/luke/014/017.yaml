  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: am
  text: በእራት ሰዓትም ለቀድሞ ለተጠሩት፣ “ኑ፤ ሁሉም ነገር አስቀድሞ ዝግጁ ነውና” እንዲላቸው አገልጋዩን ላከ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: የግሱን ቀጥተኛ ትርጉምና የተፈጸመውን ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν δοῦλον αὐτοῦ
  choice: አገልጋዩን
  rationale: በዚህ የቤትና የግብዣ አውድ ውስጥ ግለሰቡ የተላላኪ አገልጋይነት ሚና አለው፤ የግሪኩ የባለቤትነት አመልካችም በ“-ዩ” ተጠብቋል። “ባሪያውን” ቃላዊ አማራጭ ቢሆንም በዚህ አውድ ያልተፈለገ አጽንዖት ሊጨምር ይችላል።
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: በእራትም ሰዓት
  rationale: የምግቡን የተወሰነ ጊዜ በቀላልና በክቡር ዘመናዊ አማርኛ ይገልጣል፤ “ም” ከቀደመው ትረካ ጋር ያገናኛል።
- source_word: τοῖς κεκλημένοις
  choice: የተጠሩትን
  rationale: ፍጹም ተደራጊ አካላዊ ቅጹ ሰዎቹ ከዚህ በፊት ለግብዣው እንደተጠሩ ያመለክታል። የአማርኛው ቅጽ ይህን የቀደመ ጥሪ ያሳያል።
- source_word: Ἔρχεσθε
  choice: ኑ
  rationale: ለብዙ ሰዎች የተሰጠውን ቀጥተኛ ጥሪ በተፈጥሯዊ የአማርኛ ትእዛዝ ቅጽ ይገልጣል።
- source_word: ὅτι ἤδη ἕτοιμά ἐστιν
  choice: አሁን ሁሉም ዝግጁ ነውና
  rationale: ἤδη የዝግጅቱን በዚያን ጊዜ መጠናቀቅ “አሁን” በሚለው ቃል ያሳያል፤ ὅτι የምክንያት ግንኙነቱን “-ና” ያስተላልፋል። ለተፈጥሯዊ አማርኛ “ሁሉም” ተጨምሯል፣ የግሪኩ ያልተገለጸ ሰዋሰዋዊ ርእሰ ጉዳይ ግን በማስታወሻ ተጠብቋል።
