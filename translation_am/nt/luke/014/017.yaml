review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sending, the meal time, the servant, the summons, and the collective sense of the final Greek predicate. However, የተጠሩትን is accusative where the Greek requires the recipients of the message, and አሁን alone does not adequately represent ἤδη (“already”).
  naturalness: The proposed revision uses an idiomatic Amharic purpose construction (እንዲላቸው … ላከ) and clearly identifies the recipients without disrupting the narrative register.
  terminology: አገልጋዩን is a defensible context-sensitive rendering of δοῦλον in this parabolic household setting. እራት is appropriate for δεῖπνον. The phrase ሁሉም ነገር makes the collective implied subject natural in Amharic; the footnote retains the Greek ambiguity.
  issues:
  - severity: medium
    issue: The phrase የተጠሩትን is marked as a direct object, rather than as the people to whom the servant was to speak.
    rationale: 'τοῖς κεκλημένοις is dative and depends on εἰπεῖν: the servant is sent to speak to those previously invited. Amharic should use ለ… and, naturally, the resumptive object on እንዲላቸው.'
  - severity: medium
    issue: አሁን does not fully convey ἤδη.
    rationale: ἤδη indicates that the preparations are already complete at the stated time. አስቀድሞ preserves this completed-by-now force better than አሁን alone.
  revised_text: በእራት ሰዓትም ለቀድሞ ለተጠሩት፣ “ኑ፤ ሁሉም ነገር አስቀድሞ ዝግጁ ነውና” እንዲላቸው አገልጋዩን ላከ።
  revised_footnotes:
  - marker: a
    text: ቃል በቃል፣ “ዝግጁ ናቸው።” በግሪኩ ዝግጁ የሆኑት ነገሮች በግልጽ አልተጠቀሱም፤ ገለልተኛ ብዙ ቁጥር ቅጹ በአንድነት የሚታሰቡ ብዙ ነገሮችን ያመለክታል።
    reason: lexical_alternative
  revision_rationale: The recipient relation is corrected with ለቀድሞ ለተጠሩት and እንዲላቸው. አስቀድሞ restores the force of ἤδη. A footnote anchor is not needed in the revised main text because the natural collective rendering ሁሉም ነገር is retained; the supplied footnote records the implicit collective subject and its literal grammatical form.
