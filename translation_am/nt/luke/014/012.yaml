  rationale: The revision corrects the opening connective and preserves the source’s explicit repayment construction. It also uses idiomatic Amharic for hosting a meal while retaining the distinction between the earlier and later meals. Footnotes supply the relevant lexical alternatives without resolving historical meal terminology more narrowly than the Greek permits.
