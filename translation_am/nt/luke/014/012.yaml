review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the meal setting, the four groups, reciprocal invitation, and repayment. However, Ἔλεγεν δὲ καὶ is not fully represented: «እርሱንም» means “him also,” whereas καὶ modifies Jesus’ further speaking. The final clause is also more accurately retained as something becoming repayment to the host, rather than as the host’s favor being returned.'
  naturalness: «እርሱም ደግሞ … አለው» and «ግብዣ ስታደርግ» are natural, modern standard Amharic. «ለአንተ አጸፋ እንዳይሆን» clearly expresses the source’s result clause without adding interpretation.
  terminology: «ግብዣ», «መጋበዝ», and «አጸፋ» fit the social-meal and reciprocity context. «ወንድሞችህን» preserves the masculine wording of the Greek without doctrinal expansion.
  issues:
  - severity: medium
    issue: The opening uses «እርሱንም» for Ἔλεγεν δὲ καὶ.
    rationale: This places “also” on the invited person (“him also”) rather than on Jesus’ additional speech. The Greek means that he also spoke to the one who had invited him.
  - severity: medium
    issue: «ውለታህ እንዳይመለስልህ» shifts γένηται ἀνταπόδομά σοι.
    rationale: The Greek says that their return invitation may become repayment/recompense to the host. Rendering it as the host’s favor being returned is close but less direct and slightly changes the clause’s construction.
  revised_text: እርሱም ደግሞ የጋበዘውን ሰው እንዲህ አለው፦ “የቀትር ወይም የማታ ግብዣ ስታደርግ፣ ወዳጆችህን፣ ወንድሞችህን፣ ዘመዶችህን፣ ወይም ሀብታም ጎረቤቶችህን አትጋብዝ፤ እነርሱም ደግመው እንዳይጋብዙህና ይህም ለአንተ አጸፋ እንዳይሆን።”
