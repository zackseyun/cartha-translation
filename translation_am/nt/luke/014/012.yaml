language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: am
  text: እርሱም ደግሞ የጋበዘውን ሰው እንዲህ አለው፦ “የቀትር ወይም የማታ ግብዣ ስታደርግ፣ ወዳጆችህን፣ ወንድሞችህን፣ ዘመዶችህን፣ ወይም ሀብታም ጎረቤቶችህን አትጋብዝ፤ እነርሱም ደግመው እንዳይጋብዙህና ይህም ለአንተ አጸፋ እንዳይሆን።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: እንዲህ አለው
  rationale: በአማርኛ ትረካ ውስጥ ያለፈ ድርጊትን በተፈጥሯዊና ግልጽ መንገድ ያቀርባል፤ καὶ የሚያሳየው ተጨማሪ አድራሻ በእርሱንም ተወክሏል።
- source_word: τῷ κεκληκότι αὐτόν
  choice: እርሱንም የጋበዘውን ሰው
  rationale: ፍጹም አድራጊ ቦዝ አንቀጹ ኢየሱስን ቀደም ሲል የጋበዘውን ሰው እንደሚጠቁም በግልጽ ያሳያል።
- source_word: Ὅταν ποιῇς
  choice: በምታዘጋጅበት ጊዜ
  rationale: ποιέω ከምግብ ስሞች ጋር ሲመጣ ምግብ ማዘጋጀትን ወይም ግብዣ ማድረግን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἄριστον ἢ δεῖπνον
  choice: የቀትር ወይም የማታ ምግብ
  rationale: ἄριστον ቀደም ያለውን፣ ብዙ ጊዜም በቀትር አካባቢ የሚበላውን ምግብ ሲያመለክት፣ δεῖπνον ደግሞ የኋለኛውን ዋና ምግብ ያመለክታል።
- source_word: μὴ φώνει
  choice: አትጋብዝ
  rationale: φωνέω በቃል ደረጃ ‘መጥራት’ ቢሆንም፣ በምግብ ግብዣ አውድ ‘መጋበዝ’ የታሰበውን ማኅበራዊ ድርጊት በትክክል ያስተላልፋል።
- source_word: τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους
  choice: ወዳጆችህን፣ ወንድሞችህን፣ ዘመዶችህን ወይም ሀብታም ጎረቤቶችህን
  rationale: የግሪኩን ዝርዝርና የወንድ ፆታ ቅርጽ ይጠብቃል፤ πλουσίους በቀጥታ γείτοναςን እንደሚገልጽም ግልጽ ያደርጋል።
- source_word: ἀντικαλέσωσίν σε
  choice: መልሰው እንዳይጋብዙህ
  rationale: የἀντι- ቅድመ ቅጥያውን የመመላለስ ወይም የአጸፋ ትርጉም በ‘መልሰው’ ይጠብቃል።
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: ውለታህ እንዳይመለስልህ
  rationale: ቃል በቃል ‘ለአንተ መመለሻ እንዳይሆን’ የሚለውን ሐሳብ፣ በማኅበራዊ ግብዣ አውድ ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የትእዛዙ ወሰን
  choice: አትጋብዝ የሚለውን ቀጥተኛ የክልከላ ቅርጽ መጠበቅ
  alternative: ‘እነዚህን ብቻ አትጋብዝ’ ብሎ ማስፋት
  rationale: የግሪክ ጽሑፉ ‘ብቻ’ አይልም፤ ስለዚህ ትርጉሙ የኢየሱስን ቀጥተኛና አስጨናቂ አገላለጽ ሳያለዝብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘የቀትር ምግብ’ እና ‘የማታ ምግብ’ የጥንቱን ሁለት የምግብ ጊዜያት በቀላሉ ይለያሉ።
