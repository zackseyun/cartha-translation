- source_word: δοῦλος
  choice: አገልጋይ
  rationale: ቃሉ ‘ባሪያ’ ማለትም ይችላል፤ እዚህ ግን በምሳሌው ውስጥ የቤት አገልግሎት ሚናው የጎላ ስለሆነ ‘አገልጋይ’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ἀπήγγειλεν
  choice: ነገረው
  rationale: ለበላይ ያገኘውን መረጃ መልሶ ማሳወቅን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κυρίῳ
  choice: ለጌታው
  rationale: በዚህ አውድ κύριος የአገልጋዩን ሰብአዊ ጌታ ያመለክታል፤ ‘ጌታው’ የግንኙነቱን ትርጉም ይጠብቃል።
- source_word: ὀργισθεὶς
  choice: ተቆጥቶ
