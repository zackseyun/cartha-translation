- source_word: οἰκοδεσπότης
  choice: የቤቱ ጌታ
  rationale: የቤተሰብን ወይም የቤትን ዋና ኃላፊ የሚያመለክተውን የግሪክ ውሁድ ቃል በቅርብ ይተረጉማል።
- source_word: ταχέως
  choice: ፈጥነህ
