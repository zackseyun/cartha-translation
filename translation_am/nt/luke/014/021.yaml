  rationale: ቃሉ የአካል እንቅስቃሴ ጉዳት ወይም የአካል ክፍል መጎዳትን ሊያመለክት ይችላል፤ ይህ ምርጫ በዘመናዊ አማርኛ ክብር ያለውና ሰፊ አገላለጽ ነው።
- source_word: χωλούς
  choice: አንካሶችን
  rationale: መራመድ የሚያዳግታቸውን ሰዎች የሚያመለክተውን ቃል በተለመደ የአማርኛ አቻ ያቀርባል።
theological_decisions:
- issue: በምሳሌያዊ የቤት አውድ ውስጥ δοῦλος እንዴት እንደሚተረጎም
  choice: አገልጋይ
  alternative: ባሪያ
  rationale: የግሪክ ቃሉ የባርነት ሁኔታን ሊያመለክት ቢችልም፣ በዚህ ቁጥር የተግባር ሚናው የጎላ ነው። ‘አገልጋይ’ ትኩረቱን ሳይቀይር አውዱን በግልጽ ያቀርባል።
- issue: ሰብአዊ አመልካች ላለው κύριος የተመረጠ ትርጉም
  choice: ጌታ
  alternative: አለቃ
  rationale: በምሳሌው ውስጥ ቃሉ አምላክን ሳይሆን የአገልጋዩን ሰብአዊ በላይ ያመለክታል። ‘ጌታ’ ምንጫዊውን ግንኙነት ይጠብቃል፤ አውዱም ሰብአዊ አመልካቹን ግልጽ ያደርገዋል።
- issue: ἀναπείρους የሚያመለክተው የጉዳት ዓይነት
  choice: አካል ጉዳተኞች
  alternative: የአካል ክፍላቸው የተጎዳ
  rationale: የቃሉ ትክክለኛ ወሰን ሰፊ ሊሆን ስለሚችል ዘመናዊና ክብር ያለው አጠቃላይ አገላለጽ በዋናው ጽሑፍ ተመርጧል፤ ጠባቡ አማራጭ በማስታወሻ ተጠቅሷል።
