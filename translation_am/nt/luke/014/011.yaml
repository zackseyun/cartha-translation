language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: am
  text: ምክንያቱም ራሱን ከፍ የሚያደርግ ሁሉ ዝቅ ይደረጋል፤ ራሱንም ዝቅ የሚያደርግ ከፍ ይደረጋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ የቀደመውን ትእዛዝ ምክንያት ያስረዳል፤ ይህ ምርጫ የግሪኩን ማብራሪያዊ ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: ራሱን ከፍ የሚያደርግ ሁሉ
  rationale: መስተዋድዳዊው የአሁን ጊዜ ቦዝ አንቀጽ አጠቃላይና ምሳሌያዊ ኃይል አለው፤ «ሁሉ» ያንን ሁሉን አቀፍነት ይጠብቃል።
- source_word: ὑψῶν
  choice: ከፍ የሚያደርግ
  rationale: እዚህ ቃሉ አካላዊ ማንሳትን ሳይሆን ራስን ማግነንን ያመለክታል፤ የተመረጠው አገላለጽ ከ«ዝቅ ማድረግ» ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: ταπεινωθήσεται
  choice: ዝቅ ይደረጋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን ጠብቆ፣ ድርጊቱን የሚፈጽመውን አካል ሳይጨምር ትርጉሙን ያስተላልፋል።
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው ተያያዥ ቅጥያ «-ም» ሁለቱን ተቃራኒ ክፍሎች በተፈጥሯዊ ሁኔታ ያስተሳስራል።
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: ራሱን ዝቅ የሚያደርግ
  rationale: የግሪኩን አጠቃላይ መስተዋድዳዊ ቦዝ አንቀጽና ከመጀመሪያው ክፍል ጋር ያለውን ሚዛናዊ አወቃቀር ይጠብቃል።
- source_word: ὑψωθήσεται
  choice: ከፍ ይደረጋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና ከ«ዝቅ ይደረጋል» ጋር ያለውን ግልጽ ትይዩነት ያቆያል።
theological_decisions:
- issue: በወደፊት ጊዜ ተደራጊ ግሶች ውስጥ ያልተገለጸው አድራጊ
  choice: «ዝቅ ይደረጋል» እና «ከፍ ይደረጋል» በማለት ተደራጊውን ቅርጽ ማቆየት
  alternative: «እግዚአብሔር ዝቅ ያደርገዋል» እና «እግዚአብሔር ከፍ ያደርገዋል»
  rationale: መለኮታዊ አድራጊነት በሰፊው መጽሐፍ ቅዱሳዊ ዐውድ ቢጠቆምም፣ የግሪኩ ጽሑፍ አድራጊውን በግልጽ አይጠራም። ስለዚህ ተደራጊውን ቅርጽ ማቆየት ያልተገለጸውን ነገር አይወስንም።
- issue: የግሪኩ ነጠላ ወንድ ጾታ አጠቃላይ አጠቃቀም
  choice: «ራሱን» የሚለውን ተፈጥሯዊ አማርኛ መጠቀም
  alternative: የጾታ ማብራሪያ የያዘ የቃል በቃል አገላለጽ
  rationale: «ራሱን … የሚያደርግ ሁሉ» በአማርኛ ለሰው ሁሉ የሚሠራ አጠቃላይ አባባል ሲሆን፣ የምንጩን ነጠላ ቅርጽና ምሳሌያዊ ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁለቱ ክፍሎች ትይዩ አወቃቀርና «ከፍ/ዝቅ» ተቃርኖ ተጠብቋል። የግሪኩ ὅτι እዚህ ምክንያታዊ ነውና «ምክንያቱም» ተብሏል፤ የትርጉም ግርታ ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
