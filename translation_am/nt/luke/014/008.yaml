review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the indefinite invitation, wedding-feast setting, warning against taking the chief place, and the possibility that a more honored guest has also been invited. A small revision makes the main clause more idiomatic and clarifies the final pronoun's antecedent without adding meaning.
  naturalness: “ይዘህ አትቀመጥ” is understandable but somewhat awkward for taking a place at a meal. “... ስፍራ ላይ አትቀመጥ” is natural modern standard Amharic. “በይፋዊ ግብዣዎች” in footnote c means public banquets, rather than formal meals, and should be corrected.
  terminology: “ሠርግ ግብዣ,” “የክብር ስፍራ,” and “የተከበረ” appropriately convey the Greek banquet, honor-place, and comparative-status terminology. “ተጋብዞ” is a natural contextual rendering of κεκλημένος.
  issues:
  - severity: low
    issue: The expression “ይዘህ አትቀመጥ” is stylistically marked.
    rationale: It can suggest physically holding or occupying a place. A direct prohibition against sitting in that place is clearer and more idiomatic while retaining the meaning of κατακλιθῇς.
  - severity: medium
    issue: Footnote c describes the meals as “በይፋዊ ግብዣዎች” (public banquets).
    rationale: The English audit note says formal meals, not public meals. “በሥርዓታዊ ግብዣዎች” better preserves the intended cultural description.
