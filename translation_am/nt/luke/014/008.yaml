base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: am
  text: አንድ ሰው ወደ ሠርግ ግብዣ[a] በጋበዘህ ጊዜ፣ ከሁሉ የከበረው ስፍራ[b] ላይ አትቀመጥ[c]፤ ምናልባት ከአንተ የበለጠ የተከበረ ሰው በጋበዘህ ሰው ተጋብዞ ሊሆን ይችላልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ሠርግ።” የግሪኩ ብዙ ቁጥር የሠርጉን በዓል፣ በተለይም ግብዣውን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም በማዕድ ዙሪያ ከሁሉ ከፍ ያለው የክብር ቦታ ማለት ነው።
    reason: cultural_note
  - marker: c
    text: በጥንት ዘመን በሥርዓታዊ ግብዣዎች ሰዎች ቀጥ ብለው ከመቀመጥ ይልቅ ተዘርግተው መመገባቸው የተለመደ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: አንድ ሰው ... በጠራህ ጊዜ
  rationale: የግሪኩን አጠቃላይ ሁኔታ እና ያልተወሰነውን ጋባዥ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ በዚህ ዐውድ ‘መጥራት’ ማለት መጋበዝ ነው።
- source_word: εἰς γάμους
  choice: ወደ ሠርግ ግብዣ
  rationale: የብዙ ቁጥር ጋሞይ የሠርጉን ድግስና በተለይም ግብዣውን ሊያመለክት ስለሚችል፣ ከምግብ ቦታ ዐውድ ጋር በግልጽ ይስማማል።
- source_word: μὴ κατακλιθῇς
  choice: ይዘህ አትቀመጥ
  rationale: ግሪኩ በጥንታዊ ግብዣ ጊዜ ተዘርግቶ መቀመጥን በትክክል ያመለክታል፤ በዘመናዊ አማርኛ ግን ‘ተዘርግተህ አትቀመጥ’ ትኩረቱን ወደ አካላዊ አቀማመጥ ስለሚያዞር፣ ተፈጥሯዊው አገላለጽ ተመርጧል፤ ባህላዊው መረጃ በማስታወሻ ተጠብቋል።
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: ከሁሉ የከበረውን ስፍራ
  rationale: ቃሉ በግብዣ ላይ ከፍተኛውን የክብር ቦታ ያመለክታል፤ ይህ ትርጉም ማኅበራዊ ክብሩን ግልጽ ያደርጋል።
- source_word: μήποτε
  choice: '... ሊሆን ይችላልና'
  rationale: ትእዛዙን የሚያነሳሳውን የማስጠንቀቂያና የአጋጣሚ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐντιμότερός σου
  choice: ከአንተ ይልቅ የከበረ ሰው
  rationale: ንጽጽራዊውን የክብር ወይም የማኅበራዊ ደረጃ ልዩነት በቀጥታ ያስተላልፋል።
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: በእርሱ ተጠርቶ ሊሆን ይችላል
  rationale: የተፈጸመውንና አሁንም ተጽዕኖ ያለውን ግብዣ ይጠብቃል፤ የንዑስ ግሱን የጥንቃቄ አጋጣሚም ሳይወስን ያሳያል።
