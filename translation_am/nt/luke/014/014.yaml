review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal statement that the recipients lack the ability to repay and retains the temporal, eschatological phrase «በጻድቃን ትንሣኤ». However, «ዋጋህ ይከፈልሃል» is not an idiomatic way to express the Greek future passive ἀνταποδοθήσεται and can sound like the payment of a price rather than reciprocal recompense.
  naturalness: The first clause is understandable, but placing the blessing first follows the Greek emphasis more naturally in a concise saying. «መልስ ታገኛለህ» is clear modern Amharic and preserves the reciprocal sense without unnecessarily specifying the payer.
  terminology: «የተባረክህ», «ጻድቃን», and «ትንሣኤ» are suitable established biblical terms. «መልስ» appropriately echoes «መልሰው» and represents recompense rather than commercial payment.
  issues:
  - severity: medium
    issue: «ዋጋህ ይከፈልሃል» is awkward and semantically imprecise.
    rationale: The expression may be heard as ‘your price will be paid to you.’ The Greek means that the addressee will receive reciprocal repayment/recompense; it does not identify a ‘price’ as the object.
  revised_text: የተባረክህ ትሆናለህ፤ እነርሱ መልሰው ሊከፍሉህ አቅም የላቸውምና፤ በጻድቃን ትንሣኤ መልስ ታገኛለህ።
  revised_footnotes: []
