source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: am
  text: የተባረክህ ትሆናለህ፤ እነርሱ መልሰው ሊከፍሉህ አቅም የላቸውምና፤ በጻድቃን ትንሣኤ መልስ ታገኛለህ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: የተባረክህ
  rationale: የኢየሱስን የብፅዕና ንግግርና የወደፊት መለኮታዊ በረከት ክብደት ይጠብቃል፤ «ደስተኛ» የውስጥ ስሜትን ብቻ ሊያመለክት ይችላል።
- source_word: ἔσῃ
  choice: ትሆናለህ
  rationale: የግሪኩን የወደፊት ጊዜ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὅτι
  choice: ስለሌላቸው
  rationale: ለበረከቱ ምክንያት የሚሰጠውን ምክንያታዊ ግንኙነት በግልጽ አማርኛ ያሳያል።
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: መልሰው ሊከፍሉህ አቅም ስለሌላቸው
  rationale: «የላቸውም» የሚለውን ቃል በመጠበቅ የግዴታ እጥረትን ሳይሆን የአቅም ወይም የዘዴ እጥረትን ይገልጻል፤ «መልሰው» ደግሞ የἀνταποδίδωμιን ምላሽ የመስጠት ሐሳብ ያንጸባርቃል።
- source_word: ἀνταποδοθήσεται
  choice: ዋጋህ ይከፈልሃል
  rationale: የወደፊት ተደራጊ ቅርጹንና ከቀደመው «መልሰው ሊከፍሉህ» ጋር ያለውን የቃል ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γάρ
  choice: -ም
  rationale: በአማርኛ የአረፍተ ነገሩን ማብራሪያዊ ቀጣይነት በተፈጥሯዊ መንገድ ያያይዛል።
- source_word: ἐν τῇ ἀναστάσει
  choice: በ...ትንሣኤ
  rationale: ἐν የሚገልጸውን ጊዜያዊ አውድ ከግሪኩ ቅርጽ ጋር ቅርብ በሆነና በአማርኛ ተፈጥሯዊ በሆነ መንገድ ይገልጻል።
- source_word: τῶν δικαίων
  choice: የጻድቃን
  rationale: የትንሣኤው ተካፋዮች ጻድቃን መሆናቸውን በአጭርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያስቀምጣል።
theological_decisions:
- issue: «የጻድቃን ትንሣኤ» ትርጉም
  choice: ወደፊት ከጻድቃን ጋር የተያያዘ ትንሣኤ ተብሎ ቀጥታ ተተርጉሟል።
  alternative: ጻድቃንን አጽንዖት የሚሰጥ አጠቃላይ ትንሣኤ፣ ወይም ከሌሎች የተለየ የጻድቃን ትንሣኤ።
  rationale: ጥቅሱ የትንሣኤዎችን ጊዜያዊ ቅደም ተከተል ወይም ዝርዝር አወቃቀር አይወስንም፤ ስለዚህ ትርጉሙ የወደፊቱን መለኮታዊ ካሳና የጻድቃንን ትንሣኤ ያረጋግጣል እንጂ የአንድን ወገን ዝርዝር የፍጻሜ ዘመን አስተምህሮ አያስገባም።
- issue: የሚከፍለው ማን እንደሆነ
  choice: የግሪኩን ተደራጊ ቅርጽ በመጠበቅ «ይከፈልሃል» ተብሏል።
  alternative: «እግዚአብሔር ይከፍልሃል» ብሎ ድርጊት ፈጻሚውን በግልጽ መጨመር።
  rationale: መለኮታዊ ድርጊት በአውዱ የሚገባ ቢሆንም ግሪኩ ድርጊት ፈጻሚውን በስም አይጠቅስም፤ ተደራጊውን መጠበቅ ይህን ገላጭ አለመሆን ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ትንሣኤ» እና «ጻድቃን» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ስለሆኑ ተጠብቀዋል። በዚህ ረቂቅ ውስጥ የግዴታን አለመኖር በስህተት የሚያሳይ አማራጭ ስላልተመረጠ የግርጌ ማስታወሻ አላስፈለገም።
