  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: am
  text: ነገር ግን ሁሉም በአንድነት ሰበብ ማቅረብ ጀመሩ።[a] የመጀመሪያውም፣ «እርሻ ገዝቻለሁ፤ ወጥቼ ላየው ግድ አለብኝ። እባክህ፣ ይቅርታ እንዳደረግህልኝ ቁጠረኝ» አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በአንድነት” የሚለው በግሪክኛ ቃል በቃል “ከአንድ” የሚል ፈሊጥ ሲሆን፣ “ሁሉም አንድ ላይ” ወይም “ሁሉም በአንድ ጊዜ” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ነገር ግን
  rationale: ከቀደመው የግብዣ ጥሪ ጋር ያገናኛል፤ እዚህ ግን የእንግዶቹን ተቃራኒ ምላሽ ስለሚያስገባ “ነገር ግን” ተፈጥሯዊ ነው።
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: ሁሉም ... ሰበብ እያቀረቡ ግብዣውን አለመቀበል ጀመሩ
  rationale: παραιτεῖσθαι ግብዣን በሰበብ አለመቀበልን ሊያመለክት ስለሚችል፣ ሁለቱንም የትርጉም ገጽታዎች በግልጽ አማርኛ ይጠብቃል።
- source_word: ἀπὸ μιᾶς
  choice: አንድ ላይ
  rationale: ቃል በቃል “ከአንድ” የሚለው ፈሊጥ የጋራ ወይም በአንድነት የተደረገ ምላሽን ያመለክታል።
- source_word: Ἀγρὸν ἠγόρασα
  choice: እርሻ ገዝቻለሁ
  rationale: ἀγρός እርሻ ወይም የመሬት ይዞታን ያመለክታል፤ “እርሻ” አጭርና ቀጥተኛ ነው። የአማርኛው ፍጹም ጊዜ ግዢው አሁን ካለው ሁኔታ ጋር ያለውን ዝምድና ያሳያል።
- source_word: ἔχω ἀνάγκην ἐξελθὼν ἰδεῖν αὐτόν
  choice: ወጥቼ ማየት ያስፈልገኛል
  rationale: የግዴታውን ኃይልና የወጥቶ ማየቱን ተከታታይ ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐρωτῶ σε
  choice: እባክህ
  rationale: ቀጥተኛው ትርጉም “እጠይቅሃለሁ” ቢሆንም፣ በዚህ የጨዋነት ጥያቄ ውስጥ “እባክህ” ተፈጥሯዊውን ኃይል ይጠብቃል።
- source_word: ἔχε με παρῃτημένον
  choice: ይቅርታዬን ተቀበል
  rationale: ጋባዡ ግብዣውን አለመቀበሉን በይቅርታ እንዲቀበለው የሚጠይቅ ፈሊጣዊ አነጋገር ነው፤ የፍጹም ቦዝ አንቀጹን ውጤታዊ ሁኔታ ያስተላልፋል።
