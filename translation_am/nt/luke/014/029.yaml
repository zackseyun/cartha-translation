lexical_decisions:
- source_word: ἵνα μήποτε
  choice: አለበለዚያ
  rationale: በዐውዱ ሊወገድ የሚገባውን ውጤት የሚያስጠነቅቅ አገላለጽ ነው፤ «አለበለዚያ» በዘመናዊ አማርኛ ይህን ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: መሠረቱን ከጣለ በኋላ
  rationale: የግሪኩ ገላጭ የቀደመ ድርጊትን ያመለክታል፤ «ከጣለ በኋላ» የድርጊቶቹን ቅደም ተከተል ግልጽ ያደርጋል።
- source_word: μὴ ἰσχύοντος ἐκτελέσαι
  choice: ሊጨርሰው ባይችል
  rationale: ἰσχύω እዚህ አካላዊ ጉልበትን ብቻ ሳይሆን ችሎታን ያመለክታል፤ ἐκτελέσαι ደግሞ ግንባታውን እስከ ፍጻሜ ማድረስን ይገልጣል።
- source_word: πάντες οἱ θεωροῦντες
  choice: የሚያዩት ሁሉ
  rationale: θεωρέω በትኩረት ማየትን ወይም መመልከትን ይገልጣል፤ የአማርኛው የነገር ተሳቢ ቅጥያ ያልተጠናቀቀውን ሥራ በተፈጥሮ ያመለክታል።
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: ያፌዙበት ይጀምራሉ
  rationale: ἐμπαίζω ማፌዝንና ማላገጥን ያመለክታል፤ «ያፌዙበት» የግሪኩን ዳቲቭ αὐτῷ በተፈጥሯዊ አማርኛ ይወክላል።
