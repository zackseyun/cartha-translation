  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: am
  text: አለበለዚያ፣[a] መሠረት ከጣለ በኋላ ግንባታውን ማጠናቀቅ ባይችል፣ የሚመለከቱት ሁሉ ሊያፌዙበት ሊጀምሩ ይችላሉ።
  philosophy: optimal-equivalence
  footnotes:
