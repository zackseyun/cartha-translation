id: LUK.14.22
reference: Luke 14:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: am
  text: አገልጋዩም፣ “ጌታ ሆይ፣ ያዘዝኸው ተፈጽሟል፤ አሁንም ቦታ አለ” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: አገልጋይ
  rationale: ቃሉ በጥንታዊው አውድ ባሪያንም ሊያመለክት ቢችልም፣ በዚህ ምሳሌ የቤቱን ጌታ ትእዛዝ የሚፈጽም ሰው በተፈጥሯዊ አማርኛ “አገልጋይ” ተብሎ ይገለጻል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቤቱን ባለሥልጣን በቀጥታ የሚጠራ የአክብሮትና የበላይነት መጠሪያ ነው፤ “ጌታ ሆይ” የጥሪውን ቅርጽ በግልጽ ይጠብቃል።
- source_word: γέγονεν
  choice: ተፈጽሟል
  rationale: ፍጹም ጊዜው ትእዛዙ ተከናውኖ ውጤቱ እንደሚጸና ያሳያል፤ “ተፈጽሟል” ይህን የተጠናቀቀ አፈጻጸም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὃ ἐπέταξας
  choice: ያዘዝኸው
  rationale: አንጻራዊው ሐረግ የጌታውን ቀደምት ትእዛዝ ይመለከታል፤ አጭሩ የአማርኛ ቅርጽ የግሪኩን የሥልጣን ኃይል ይጠብቃል።
- source_word: ἔτι
  choice: አሁንም
  rationale: ትእዛዙ ከተፈጸመ በኋላም ቦታ እንደቀረ የሚያሳየውን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τόπος
  choice: ቦታ
  rationale: በግብዣው አውድ ያልተሞላ የመቀመጫ ወይም የመቀበያ አቅምን ያመለክታል፤ “ቦታ” ግልጽና የተለመደ ነው።
theological_decisions:
- issue: Κύριε በምሳሌው ውስጥ ያለው አጠራር
  choice: ጌታ ሆይ
  alternative: አለቃ ሆይ / ባለቤት ሆይ
  rationale: ቃሉ እዚህ በምሳሌው ውስጥ ያለውን የቤት ጌታ በቀጥታ ይጠራል። “ጌታ ሆይ” የቃሉን ሰፊ ትርጉምና የአክብሮት ኃይል ይጠብቃል፣ ነገር ግን በዚህ ቦታ የክርስቶስ መለኮታዊ ማዕረግ እንደሆነ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ቅደም ተከተል በተፈጥሯዊ የአማርኛ አገባብ ተደርጓል። δοῦλος የ“ባሪያ” ትርጉም ሊኖረው ቢችልም፣ ይህን በአማርኛ እንደ ግዴታ የግርጌ ማስታወሻ ማቅረብ የአንቀጹን ተፈጥሯዊነት ከማገዝ ይልቅ ሊከብድ ስለሚችል አልተጨመረም።
