review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the adversative ἀλλ’, the meal-hosting idiom δοχὴν ποιῇς, the imperative κάλει, and the four-item list. It also appropriately distinguishes ἀναπείρους from χωλούς. However, ὅταν with the subjunctive has an indefinite/iterative force ('whenever'), which is better conveyed in Amharic by ቁጥር than by the more simply temporal ጊዜ.
  naturalness: The wording is clear, modern standard Amharic, and the direct imperative and concise list read naturally. Replacing ጊዜ with ቁጥር makes the temporal clause both more idiomatic in this recurring-event sense and more precise.
  terminology: ድሆችን, አካል ጉዳተኞችን, አንካሶችን, and ዕውሮችን are understandable modern terms. አካል ጉዳተኞችን is a respectful broad rendering of ἀναπείρους, while አንካሶችን retains the separate, specific sense of χωλούς. No theological terminology is at issue.
  issues:
  - severity: low
    issue: The temporal expression ባዘጋጀህ ጊዜ underrepresents ὅταν’s indefinite/iterative force.
    rationale: The Greek refers to any occasion on which the addressee hosts such a meal, not merely to a single time. ግብዣ ባዘጋጀህ ቁጥር naturally communicates 'whenever you prepare/host a banquet.'
  revised_text: ነገር ግን ግብዣ ባዘጋጀህ ቁጥር፣[a] ድሆችን፣ አካል ጉዳተኞችን፣ አንካሶችንና ዕውሮችን ጥራ።
