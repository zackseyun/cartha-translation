  rationale: ከቀደመው መመሪያ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅταν
  choice: ባዘጋጀህ ጊዜ
  rationale: ከተከታዩ ሐረግ ጋር ሆኖ አንድ ጊዜ ብቻ ሳይሆን በማናቸውም እንዲህ ያለ አጋጣሚ የሚሠራ ጊዜያዊ ሁኔታን ይገልጣል።
- source_word: δοχὴν ποιῇς
  choice: ግብዣ ባዘጋጀህ
  rationale: ‘መቀበያን/ግብዣን ማድረግ’ የሚለውን ፈሊጣዊ አገላለጽ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል፤ የምግብ ግብዣን ከማስተናገድ ጋር ያመለክታል።
- source_word: κάλει
  choice: ጥራ
  rationale: በግብዣ አውድ ‘ጋብዝ’ የሚለውን ፍቺ ይይዛል፤ ‘ጥራ’ ደግሞ የግሪኩን ቀጥተኛ ትእዛዝና የመጋበዝ አውድ በአጭሩ ያስተላልፋል።
- source_word: πτωχούς
  choice: ድሆችን
  rationale: ገንዘብና መተዳደሪያ የሌላቸውን ሰዎች የሚጠቅሰውን ስማዊ ቅጽ በአጭር ዝርዝር ይጠብቃል።
- source_word: ἀναπείρους
  choice: አካል ጉዳተኞችን
  rationale: ሰፋ ያለ የአካል እክል ያለባቸውን ሰዎች በክብር የሚገልጽ ዘመናዊ አጠራር ነው፤ ቃሉን χωλούς ከሚጠቅሰው የመራመድ እክል አያዋህደውም።
- source_word: χωλούς
  choice: አንካሶችን
  rationale: በተለይ የመራመድ እክል ያለባቸውን የሚያመለክት የተለመደ አማርኛ ቃል ሲሆን ከአጠቃላዩ ἀναπείρους ልዩነቱን ይጠብቃል።
- source_word: τυφλούς
  choice: ዕውሮችን
  rationale: ማየት የተሳናቸውን ሰዎች በግልጽና በተለመደ አማርኛ ይገልጻል።
theological_decisions:
- issue: የአካል እክልን የሚገልጹ ሁለት የግሪክ ቃላትን በዘመናዊና ከምንጩ ታማኝ ቋንቋ መለየት
  choice: ἀναπείρουςን ‘አካል ጉዳተኞችን’፣ χωλούςን ‘አንካሶችን’ ብሎ መተርጎም
  alternative: ሁለቱንም በአንድ አጠቃላይ የአካል ጉዳት ቃል መተርጎም፣ ወይም ἀναπείρουςን ‘የተጎዳዱትን’ ማለት
  rationale: የግሪኩ ዝርዝር ሰፊውን የአካል እክል ምድብና በተለይ የመራመድ እክል ያለባቸውን ይለያል። ትርጉሙ ይህን ልዩነት ሳያጠፋ ክብር ያለውን ዘመናዊ አገላለጽ ይጠቀማል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩን አጭር የስም ዝርዝርና ቀጥተኛ ትእዛዝ ተጠብቋል፤ በአማርኛ ተፈጥሯዊ ለመሆን የመጨረሻዎቹ ሁለት ንጥሎች ‘እና’ በሚያስገባው ‘-ንና’ ተያይዘዋል።
