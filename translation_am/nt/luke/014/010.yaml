source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: am
  text: ነገር ግን ስትጋበዝ፣ ሄደህ በማዕድ በዝቅተኛው ስፍራ ተቀመጥ[a]፤ የጋበዘህ ሰው ሲመጣ፣ ‘ወዳጄ፣ ከፍ ወዳለ ስፍራ ውጣ[b]’ እንዲልህ። በዚያን ጊዜ ከአንተ ጋር በማዕድ በተቀመጡት ሁሉ ፊት ክብር ይሆንልሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘በዝቅተኛው መቀመጫ ተቀመጥ።’ የግሪኩ ግስ በተለይ በምግብ ጊዜ ተደግፎ መቀመጥን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘ወደ ላይ ከፍ ብለህ ውጣ።’
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: ስትጋበዝ
  rationale: በግብዣው አውድ ውስጥ καλέω ተራ ጥሪን ሳይሆን ወደ ግብዣ መጋበዝን ያመለክታል።
- source_word: πορευθεὶς
  choice: ሄደህ
  rationale: የግሪኩ ቦዝ አንቀጽ ከዋናው ትእዛዝ ጋር ተያይዞ የሚፈጸም ድርጊት ስለሆነ በተፈጥሯዊ አማርኛ ‘ሄደህ ... ተቀመጥ’ ተብሏል።
- source_word: ἀνάπεσε
  choice: በማዕድ ተቀመጥ
  rationale: ግሱ በምግብ ማዕድ መደገፍን ወይም መቀመጥን ያመለክታል፤ ‘በማዕድ’ የግብዣውን ባህላዊ አውድ ያቆያል፣ ‘ተቀመጥ’ም ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
- source_word: ἔσχατον τόπον
  choice: በዝቅተኛው ስፍራ
  rationale: እዚህ ἔσχατος በመቀመጫ ሥርዓቱ ውስጥ ክብሩ ዝቅ ያለውን ቦታ ያመለክታል።
- source_word: ὁ κεκληκώς σε
  choice: የጋበዘህ ሰው
  rationale: ፍጹም ቦዝ አንቀጹ ጋባዡን በግልጽ ይለያል፤ ይህ አተረጓጎም ‘አስተናጋጅ’ ከሚለው ይልቅ የግሪኩን አገላለጽ በቅርብ ይከተላል።
- source_word: Φίλε
  choice: ወዳጄ
  rationale: በቀጥታ ለሰውየው የቀረበውን የአክብሮትና የወዳጅነት አድራሻ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προσανάβηθι ἀνώτερον
  choice: ከፍ ወዳለ ስፍራ ውጣ
  rationale: አገላለጹ ከፍ ወዳለና የበለጠ ክብር ወዳለው ቦታ መንቀሳቀስን ያመለክታል፤ የ‘ወደ ላይ’ ምስሉም ተጠብቋል።
- source_word: δόξα
  choice: ክብር
  rationale: በዚህ ማኅበራዊ አውድ δόξα መለኮታዊ ግርማን ሳይሆን በሰዎች ፊት የሚገኝ ክብርን ያመለክታል።
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: ከአንተ ጋር በማዕድ በተቀመጡት ሁሉ ፊት
  rationale: የክብሩን ይፋዊነትና የምግብ ማዕዱን አውድ ሁለቱንም ይጠብቃል።
theological_decisions:
- issue: የንግግሩ ባሕርይ
  choice: በትሕትናና በክብር መገለባበጥ ላይ በግብዣ ምሳሌ የቀረበ ተግባራዊ ትምህርት ሆኖ ተተርጉሟል።
  alternative: ንግግሩን እንደ ተራ የግብዣ ሥነ ምግባር ብቻ መውሰድ፣ ወይም ሙሉ በሙሉ የፍጻሜ ዘመን ሽልማትን ብቻ እንዲያመለክት ማድረግ።
  rationale: ጥቅሱ በማኅበራዊ የግብዣ ምስል ትሕትናንና የክብር መገለባበጥን ያስተምራል፤ ትርጉሙ ግን ማኅበራዊውንና ሰፋ ያለውን መንፈሳዊ አንድምታ አንዱን ብቻ በግድ አይመርጥም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በማዕድ’ የሚለው ቃል የጥንቱን የግብዣ ሁኔታ ሳያደበዝዝ በአማርኛ የሚታወቅ አገላለጽ ነው።
