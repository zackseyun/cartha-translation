  naturalness: The Amharic sentence is natural, clear, and suitably dignified for modern standard biblical prose. 'ከኋላዬ የማይመጣ' appropriately preserves the source image rather than replacing it with the more interpretive 'የማይከተለኝ.'
  terminology: '''መስቀል'' and ''ደቀ መዝሙር'' are established, accurate Gospel terminology. The wording does not impose a doctrinal interpretation of the cross image.'
