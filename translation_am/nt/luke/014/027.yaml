  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: am
  text: የራሱን መስቀል የማይሸከምና ከኋላዬ የማይመጣ[b] ማንም ደቀ መዝሙሬ ሊሆን አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ቃል በቃል፣ “ከኋላዬ የማይመጣ።” ይህን ከተለመደው “ተከተለኝ” ከሚለው የደቀ መዝሙርነት አገላለጽ ጋር ያነጻጽሩ።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ማንም ... የማይ-
  rationale: አጠቃላይ ሁኔታን የሚያስተዋውቀውን ያልተወሰነ አንጻራዊ ተውላጠ ስም በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: βαστάζει
  choice: ይሸከማል
  rationale: ግሱ መስቀልን በአካል የመሸከምን ምስልና የደቀ መዝሙርነትን ከባድ ዋጋ የሚያመለክተውን ዘይቤ አብሮ ይጠብቃል።
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: የራሱን መስቀል
  rationale: σταυρός በተለመደው ‘መስቀል’ ተተርጉሟል፤ ἑαυτοῦ የነጠላውን አንጸባራቂ አጽንዖት ‘የራሱን’ በማለት ይጠብቃል።
- source_word: ἔρχεται ὀπίσω μου
  choice: ከኋላዬ ይመጣል
  rationale: ቃል በቃል ያለውን የእንቅስቃሴ ምስል ይጠብቃል፤ ‘ይከተለኛል’ ብሎ ትርጉሙን ሙሉ በሙሉ አይተካውም።
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ደቀ መዝሙሬ ሊሆን አይችልም
  rationale: አባባሉ ተራ ክልከላን ሳይሆን አለመቻልን ወይም ከደቀ መዝሙርነት ጋር አለመጣጣምን ያሳያል።
- source_word: μαθητής
  choice: ደቀ መዝሙር
  rationale: በወንጌላት አውድ የተለመደና ታማኝ ቃል ሲሆን ከተራ ተማሪነት የላቀ ቁርጠኛ ተከታይነትን ያመለክታል።
theological_decisions:
- issue: የነጠላው አንጸባራቂ ተውላጠ ስም አጠቃላይ ኃይል
  choice: ‘የራሱን መስቀል’ በማለት ነጠላውን መጠበቅ
  alternative: ‘የየራሳቸውን መስቀል’ ብሎ በብዙ ቁጥር መተርጎም
  rationale: ግሪኩ ነጠላ ወንድ ጾታዊ ቅርጽ ቢጠቀምም ተወካይ አጠቃላይ ኃይል አለው። ‘ማንም’ ሁሉን አቀፍነቱን ሲያሳይ፣ ‘የራሱን’ የምንጩን ነጠላና አንጸባራቂ አጽንዖት ይጠብቃል።
- issue: መስቀልን የመሸከም ምስል
  choice: የመገደል መሣሪያውንና የደቀ መዝሙርነትን ዋጋ የሚያስታውሰውን ‘መስቀል’ የሚለውን ምስል ሳይፈታ መጠበቅ
  alternative: ‘መከራውን የማይቀበል’ ብሎ ዘይቤውን መፍታት
  rationale: ኢየሱስ የተጠቀመው ምስል ሞትን፣ እፍረትንና የደቀ መዝሙርነትን ዋጋ በአንድነት ያስተጋባል፤ ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት አይፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩን ትይዩ አወቃቀር—መስቀልን አለመሸከምና ከኋላ አለመምጣት—ለማቆየት ሁለቱም ግሶች በአሉታዊ ቅርጽ ቀርበዋል።
