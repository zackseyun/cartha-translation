  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: am
  text: ወይስ፣ ከሌላ ንጉሥ ጋር ለመዋጋት የሚዘምት የትኛው ንጉሥ ነው፣ በአሥር ሺህ ወታደሮች በእርሱ ላይ ከሃያ ሺህ ወታደሮች ጋር የሚመጣውን ለመግጠም[a] ይችል እንደሆነ አስቀድሞ ቁጭ ብሎ የማያስብ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለመገናኘት።” የግሪኩ ግስ በቀጥታ “ለመገናኘት” ሊተረጎም ይችላል፤ በዚህ የጦርነት አውድ ግን ጠላትን በውጊያ መግጠምን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: ሁለተኛውን ምሳሌያዊ ንጽጽር በተፈጥሯዊ የአማርኛ የንግግር ፍሰት ያስገባል።
- source_word: τίς βασιλεὺς
  choice: የትኛው ንጉሥ ነው
  rationale: አዎንታዊ መልስ የሚጠብቀውን አጠቃላይ የንግግር ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πορευόμενος
  choice: የሚዘምት
  rationale: ቃሉ በአጠቃላይ መሄድን ቢያመለክትም፣ የጦርነቱ አውድ ወደ ውጊያ መንቀሳቀስን ያሳያል፤ ‘መዝመት’ ይህን በአጭርና በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: ከሌላ ንጉሥ ጋር ለመዋጋት
  rationale: ሌላውን ንጉሥ በጦርነት ለመግጠም የሚለውን ሐሳብ ግልጽና የተለመደ በሆነ አማርኛ ያቀርባል።
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: አስቀድሞ ቁጭ ብሎ የማያስብ
  rationale: οὐχί አዎንታዊ መልስ የሚጠብቅ ጥያቄ መሆኑን ይጠብቃል፤ ቁጭ ብሎ ከዚያ ማሰብ የሚለውንም ቅደም ተከተል ያሳያል።
- source_word: εἰ δυνατός ἐστιν
  choice: ይችል እንደሆነ
  rationale: የችሎታ ምዘናን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐν δέκα χιλιάσιν
  choice: በአሥር ሺህ ወታደሮች
  rationale: ቁጥሩ የጦር ኃይልን እንደሚያመለክት ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: ὑπαντῆσαι
  choice: መቋቋም
  rationale: መሠረታዊ ትርጉሙ ‘መገናኘት/መቀበል’ ቢሆንም፣ በዚህ የውጊያ አውድ ጠላትን ገጥሞ መቃወምን ያመለክታል።
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: በሃያ ሺህ ወታደሮች የሚመጣበትን
  rationale: የባላጋራውን ንጉሥ የጠላትነት አቀራረብና ትልቁን የጦር ብዛት በግልጽ ያሳያል።
