  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: am
  text: ምክንያቱም፣ ከእናንተ መካከል ግንብ ለመሥራት የሚፈልግ ማን አስቀድሞ ቁጭ ብሎ፣ ለማጠናቀቅ በቂ ገንዘብ እንዳለው ወጪውን አያሰላም?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: ከእናንተ መካከል ግን ... ማን
  rationale: የንግግሩን ቀጣይነት በ«ግን» ያሳያል፤ ቀጥተኛውን ለአድማጮች የቀረበ አዎንታዊ መልስ የሚጠብቅ ጥያቄም ይጠብቃል።
- source_word: θέλων
  choice: የሚፈልግ
  rationale: የግንባታውን ፍላጎትና ዓላማ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: πύργον οἰκοδομῆσαι
  choice: ግንብ ለመሥራት
  rationale: πύργοςን በቀጥታ «ግንብ»፣ οἰκοδομέωንም በተፈጥሯዊው «መሥራት» ይተረጉማል።
- source_word: πρῶτον καθίσας
  choice: አስቀድሞ ቁጭ ብሎ
  rationale: ወጪውን ከማስላቱ በፊት ሆን ብሎ መቀመጡንና የድርጊቶቹን ቅደም ተከተል ያሳያል።
- source_word: ψηφίζει τὴν δαπάνην
  choice: ወጪውን አያሰላም?
  rationale: ψηφίζω በዚህ የግንባታ አውድ የወጪ መጠንን በጥንቃቄ ማስላት ሲሆን፣ አሉታዊው ጥያቄ አዎንታዊ መልስ የሚጠብቀውን οὐχί ያንጸባርቃል።
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: ለማጠናቀቅ የሚበቃው እንዳለው
  rationale: ግሪኩ በቃል «ለማጠናቀቂያ እንዳለው» የሚል ቢሆንም፣ በአውዱ ያለውን በቂ ገንዘብ ወይም አቅም በግልጽና ተፈጥሯዊ መንገድ ይገልጣል።
