    text: ወይም፣ “ግብዣዬን”፤ በባህላዊ አገላለጽ፣ “የማታ ምግቤን።”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek syntax and force while correcting the male-specific noun, clarifying that the called persons are banquet invitees, and repairing the lexical-alternative footnote. It neither allegorizes the parable nor resolves interpretive questions beyond the wording of the source.
