base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: am
  text: እላችኋለሁና፣ ከእነዚያ ከተጋበዙት ወንዶች መካከል አንድም እንኳ የእኔን እራት[a] አይቀምስም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ግብዣዬን”፤ በባህላዊ አገላለጽ፣ “የማታ ምግቤን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: እላችኋለሁና
  rationale: የቀጥታ ንግግሩንና የγάρን አብራሪ ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያቆያል።
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: ከእነዚያ ... ሰዎች አንድም እንኳ
  rationale: የክፍል አመልካች አወቃቀሩንና ጠንካራውን አሉታዊ አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል፤ በአውዱ የተጠሩትን ቡድን ለማመልከት ‘ሰዎች’ ተመርጧል።
- source_word: τῶν κεκλημένων
  choice: ከተጠሩት
  rationale: καλέω በዚህ የግብዣ አውድ ‘ወደ ግብዣ መጥራት’ን ያመለክታል፤ አጭሩ አገላለጽ ይህን በአማርኛ በቂ ሁኔታ ያስተላልፋል።
- source_word: γεύσεταί
  choice: አይቀምስም
  rationale: የግሪኩን ‘መቅመስ’ ምስላዊ ኃይል ይጠብቃል፤ በአውዱም ከምግቡ መካፈልን ያመለክታል።
- source_word: μου τοῦ δείπνου
  choice: የእኔን እራት
  rationale: የመጀመሪያ መደብ ባለቤትነትን በአጽንዖት ያቆያል፤ δεῖπνον ዋና ምግብን፣ በተለምዶም የማታ ምግብን ስለሚያመለክት ‘እራት’ ተመርጧል።
theological_decisions:
- issue: የአስተናጋጁን ንግግር ከምሳሌው መንፈሳዊ ትርጉም ጋር ማቅረብ
  choice: ‘የእኔን እራት’ የሚለውን የትረካ ድምፅ ሳይተረጎም ማቆየት
  alternative: በዋናው ጽሑፍ በግልጽ መንፈሳዊ ወይም መጨረሻዊ ግብዣ አድርጎ መግለጽ
  rationale: ግሪኩ በምሳሌው ውስጥ የአስተናጋጁን የመጀመሪያ መደብ ንግግር ይጠብቃል፤ ትርጉሙ ሥነ መለኮታዊ ማመሳሰሉን በጽሑፉ ላይ መጨመር የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አንድም እንኳ’ የοὐδείςን አጽንዖት ያሳያል፤ ‘አይቀምስም’ ደግሞ የግሪኩን ምስል ይጠብቃል።
