  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: am
  text: እንግዲህ፣ ከእናንተ እያንዳንዱ የራሱን ንብረት ሁሉ የማይተው[a] ደቀ መዝሙሬ ሊሆን አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለውን ሁሉ የማይተው።” የግሪኩ ግስ “መሰናበት” ወይም “ደህና ሁን ማለት” የሚል ፍቺ ሊኖረው ይችላል፤ በዚህ አውድ ግን በንብረት ላይ ያለን የባለቤትነት መብት መተውን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: እንግዲህ
  rationale: የቀደሙትን ምሳሌዎች ከሚከተለው መደምደሚያ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: πᾶς ἐξ ὑμῶν
  choice: ከእናንተ ማንም
  rationale: መስፈርቱ ከአድማጮቹ ለእያንዳንዱ እንደሚሠራ የሚያሳይ ተፈጥሯዊ አማርኛ ነው።
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: የማይተው
  rationale: ግሱ ቃል በቃል ‘የማይሰናበት’ ሊል ቢችልም፣ እዚህ ከንብረት ጋር ያለን የባለቤትነት ጥያቄና ቁርኝት በቆራጥነት መተውን ያመለክታል፤ ‘የማይተው’ ይህን ጥንካሬ ያስቀምጣል ነገር ግን ንብረቱን በአካል መጣልን ብቻ አያስገድድም።
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: የራሱ የሆነውን ሁሉ
  rationale: የግሪኩን ‘የራሱ’ አጽንዖትና የንብረት ሙሉነት ይጠብቃል፤ ከ‘ንብረቱን ሁሉ’ ይልቅ የዋናውን አገላለጽ ስፋት ያስቀራል።
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ደቀ መዝሙሬ ሊሆን አይችልም
  rationale: የማይቻል መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μαθητής
  choice: ደቀ መዝሙር
  rationale: በወንጌላት አውድ ተከታይነትንና ከመምህሩ መማርን የሚያካትት የተለመደ ትክክለኛ ቃል ነው።
theological_decisions:
- issue: ንብረትን በተመለከተ የጥሪው ባሕርይ
  choice: አገላለጹን ሁሉን ንብረት እንደ ራስ ጥያቄ መተውን የሚጠይቅ ቆራጥ ጥሪ አድርጎ ማቅረብ
  alternative: ‘ንብረቱን ሁሉ ካልሰጠ’ በማለት በሁሉም ሁኔታ ንብረትን በአካል ማስወገድን እንደሚያዝ ማቅረብ
  rationale: ἀποτάσσεται የመሰናበትን ወይም የመተውን ሐሳብ ይዟል። ትርጉሙ የደቀ መዝሙርነትን ከባድ ጥያቄ ሳያለዝብ፣ ጽሑፉ በግልጽ ያልወሰነውን አንድ ዓይነት የኢኮኖሚ አሠራር አያስገባም።
