review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential connection, the impossibility of being Jesus’ disciple, and the radical relation to possessions. However, ከእናንተ ማንም normally means “none of you/no one among you,” whereas πᾶς ἐξ ὑμῶν means “each/every one of you.” The object phrase should identify possessions more explicitly.
  naturalness: የራሱ የሆነውን ሁሉ is understandable but somewhat cumbersome and overly broad in this context. የራሱን ንብረት ሁሉ is idiomatic modern Amharic and directly communicates the sense of the Greek ὑπάρχουσιν.
  terminology: ደቀ መዝሙር and ሊሆን አይችልም are appropriate Gospel-register renderings. የማይተው adequately represents ἀποτάσσεται without requiring literal physical disposal; the note appropriately preserves the farewell/renunciation nuance.
  issues:
  - severity: medium
    issue: ከእናንተ ማንም does not accurately render the distributive force of πᾶς ἐξ ὑμῶν.
    rationale: In ordinary Amharic, ማንም under negation communicates “no one,” while the Greek expressly individualizes the requirement as applying to every person among the hearers. ከእናንተ እያንዳንዱ preserves that force.
  - severity: low
    issue: የራሱ የሆነውን ሁሉ is broader and less natural than an explicit possessions phrase.
    rationale: ὑπάρχουσιν here denotes possessions/property. የራሱን ንብረት ሁሉ is clear, natural, and retains the reflexive possessive emphasis.
  revised_text: እንግዲህ፣ ከእናንተ እያንዳንዱ የራሱን ንብረት ሁሉ የማይተው[a] ደቀ መዝሙሬ ሊሆን አይችልም።
  revised_footnotes:
  - marker: a
