  rationale: በምሳሌው ውስጥ የቤቱን ባለቤትና የባሪያውን ጌታ ያመለክታል፤ በአማርኛም “ጌታ” ይህን ማኅበራዊ ሚና በተፈጥሮ ይገልጻል፣ ቃሉንም በቀጥታ መለኮታዊ ማዕረግ እንዲሆን አያስገድድም።
- source_word: δοῦλον
