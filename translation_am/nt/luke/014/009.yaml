  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: am
  text: አንተንና እርሱን የጋበዘውም መጥቶ፣ ‘ለዚህ ሰው ቦታውን ልቀቅለት’ ይልሃል፤ ከዚያም እያፈርክ የመጨረሻውን ቦታ[a] መያዝ ትጀምራለህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዝቅተኛውን ቦታ።” የግሪኩ አገላለጽ τὸν ἔσχατον τόπον በቅደም ተከተል የመጨረሻውን ስፍራ ሊያመለክት ይችላል፤ በዚህ የግብዣ አውድ ደግሞ በክብር ደረጃ ዝቅተኛውን መቀመጫ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: አንተንና እርሱን የጋበዘው
  rationale: የግሪኩን ስማዊ አገልግሎት ያለውን ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ሁለቱም በአንድ ጋባዥ መጋበዛቸውን ይጠብቃል።
- source_word: ἐλθὼν … ἐρεῖ σοι
  choice: መጥቶ፣ … ይልሃል
  rationale: ቀድሞ የሚፈጸመውን መምጣትና ተከትሎ የሚመጣውን ንግግር በአማርኛ ተፈጥሯዊ የድርጊት ቅደም ተከተል ያሳያል።
- source_word: Δὸς τούτῳ τόπον
  choice: ለዚህ ሰው ቦታውን ልቀቅለት
  rationale: በግብዣው አውድ ትእዛዙ ቦታውን ለሌላው መስጠት ማለት መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μετὰ αἰσχύνης
  choice: እያፈርክ
  rationale: የαἰσχύνηን የማኅበራዊ ውርደትና እፍረት ስሜት በዘመናዊና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: ἄρξῃ … κατέχειν
  choice: መያዝ ትጀምራለህ
  rationale: የግሪኩን ‘መጀመር’ ግስ ሳይጨምር ወይም ሳይቀንስ በቀጥታ ይጠብቃል።
- source_word: τὸν ἔσχατον τόπον
  choice: የመጨረሻውን ቦታ
  rationale: ἔσχατος በቅደም ተከተል ‘መጨረሻ’ ወይም በክብር ደረጃ ‘ዝቅተኛ’ ሊሆን የሚችለውን እውነተኛ አሻሚነት በዋናው ጽሑፍና በማስታወሻ ይጠብቃል።
