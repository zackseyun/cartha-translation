  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: am
  text: እንዲህም ሆነ፤ ኢየሱስ በሰንበት ቀን ምግብ ሊበላ[a] ወደ ከፈሪሳውያን መሪዎች የአንዱ ቤት በገባ ጊዜ፣ እነርሱ በቅርብ ይከታተሉት ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዳቦ ሊበላ።» ቃል በቃል፣ «ዳቦ ሊበላ።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በጥንቃቄ ይመለከቱት ነበር።» የግሪኩ ቃል በጥርጣሬ ወይም በጠላትነት መከታተልንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: በገባ ጊዜ
  rationale: የሉቃስ የትረካ መግቢያ ቀመር ከጊዜ አመልካቹ ሐረግ ጋር በተፈጥሯዊ አማርኛ ተዋህዷል፤ የተለየ ‘ሆነ’ ማከል አማርኛውን ያከብደዋል።
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: ኢየሱስ ... በገባ ጊዜ
  rationale: ጥቅሱ ብቻውን ሲነበብ የተውላጠ ስሙ ማጣቀሻ ግልጽ እንዲሆን ‘ኢየሱስ’ ተጠቅሷል፤ የግሪክ ስነ ሰዋስው ጊዜያዊ ትርጉም ‘በገባ ጊዜ’ ተብሎ ተሰጥቷል።
- source_word: οἶκόν
  choice: ቤት
  rationale: ቀጥተኛ፣ ተፈጥሯዊና ለምግብ ግብዣው አውድ ተስማሚ ነው።
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: ከፈሪሳውያን መሪዎች የአንዱ ወደሆነው ሰው
  rationale: τινος ያለውን ያልተወሰነ ነጠላ ማጣቀሻና ἀρχόντων ያለውን የመሪነት ደረጃ ይጠብቃል፤ ሰውየውን የሁሉም ፈሪሳውያን ብቸኛ መሪ አያደርገውም።
- source_word: σαββάτῳ
  choice: በሰንበት ቀን
  rationale: የጊዜ አመልካቹን ዳቲቭ በዘመናዊ አማርኛ ግልጽ አድርጎ ይገልጻል።
- source_word: φαγεῖν ἄρτον
  choice: እንጀራ ሊበላ
  rationale: ‘እንጀራ መብላት’ የምንጩን ‘ዳቦ መብላት’ ፈሊጣዊ ቅርጽ በተፈጥሯዊ አማርኛ ይይዛል፤ እዚህ ‘እንጀራ’ በአጠቃላይ ምግብን ሊያመለክት ይችላል።
- source_word: παρατηρούμενοι
  choice: በቅርብ ይከታተሉት ነበር
  rationale: በጥንቃቄ መመልከትንና ሊኖር የሚችለውን የጥርጣሬ ወይም የጥላቻ ጥላ ይጠብቃል፤ ዓላማቸውን በግልጽ ክፉ ነበር ብሎ አይወስንም።
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: የግሪኩን አጽንዖትና ከኢየሱስ ጋር ያለውን የርዕሰ ጉዳይ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ፈሪሳውያኑ ኢየሱስን ሲመለከቱ የነበራቸው ዓላማ ጠላትነት እንደነበረ መወሰን
  choice: በቅርብ ይከታተሉት ነበር
  alternative: ይሰልሉት ነበር
  rationale: παρατηρέω ጥርጣሬ ወይም ጠላትነት ያለበትን ክትትል ሊያመለክት ቢችልም፣ ጥቅሱ ራሱ ክፉ ዓላማን በግልጽ አይናገርም። ይህ ምርጫ የትረካውን ውጥረት ሳያጠፋ ጠንካራ ክስ ከማስገባት ይቆጠባል።
