source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: am
  text: እርሱም፣ “ከእናንተ መካከል ልጁ ወይም በሬው ወደ የውኃ ጕድጓድ ቢወድቅ፣ በሰንበት ቀን ወዲያውኑ የማያወጣው ማን ነው?” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ልጁ” በሚለው ፈንታ “አህያው” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: ከእናንተ መካከል ... ማን ነው?
  rationale: የግሪኩን አጠያያቂ አነጋገር በተፈጥሯዊ የአማርኛ የንግግር ጥያቄ ያቀርባል።
- source_word: υἱὸς
  choice: ልጁ
  rationale: ቃሉ በቀጥታ ‘ወንድ ልጅ’ ማለት ቢሆንም፣ ‘ልጁ’ በዚህ የቤተሰብ ግንኙነት አገባብ ተፈጥሯዊና ግልጽ ነው፤ የባለቤትነት ቅጥያውም Τίνοςን ያንጸባርቃል።
- source_word: βοῦς
  choice: በሬው
  rationale: በዚህ ነጠላ ምሳሌ ውስጥ የሥራ ከብትን በግልጽ የሚያመለክት የተለመደ አማርኛ ነው።
- source_word: φρέαρ
  choice: ጕድጓድ
  rationale: φρέαρ ጕድጓድን ወይም የውኃ ጕድጓድን ሊያመለክት ይችላል፤ እዚህ ‘ጕድጓድ’ የመውደቅና ወደ ላይ የማውጣትን ምስል በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: πεσεῖται
  choice: ቢወድቅበት
  rationale: የወደፊት ግስን በአጠያያቂ ሁኔታዊ አረፍተ ነገር ተፈጥሯዊ በሆነ ‘ቢ-’ ቅርጽ ይገልጻል።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: የግሪኩን ፈጣንነትና አስቸኳይነት በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀνασπάσει αὐτόν
  choice: የማያወጣው
  rationale: ከታች ወደ ላይ ጎትቶ የማውጣትን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል፤ የነጠላውን ተሳቢ በግስ ቅጥያ ይይዛል።
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: በሰንበት ቀን
  rationale: ἡμέρᾳን በግልጽ ያካትታል፣ በአማርኛም የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: በምሳሌው ውስጥ ያለው የጽሑፍ ልዩነት
  choice: ልጁ ወይም በሬው
  alternative: አህያው ወይም በሬው
  rationale: የቀረበው SBLGNT ጽሑፍ υἱός (‘ልጅ/ወንድ ልጅ’) ይላል፤ ስለዚህ ዋናው ጽሑፍ ይህን ንባብ ይከተላል። በአንዳንድ የእጅ ጽሑፎች የሚገኘው ‘አህያ’ ንባብ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአጠያያቂው ኃይልና የወዲያውኑ መታደግ አጽንዖት ተጠብቀዋል።
