  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: am
  text: እርሱም ሁልጊዜ መጸለይና ተስፋ አለመቁረጥ እንደሚገባቸው ምሳሌ ይነግራቸው ነበር፦[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁልጊዜ መጸለይና ተስፋ አለመቁረጥ እንዳለባቸው ለማሳየት።»
    reason: የπρὸς τὸ δεῖν ግንባታን በዓላማ አገላለጽ መተርጎም የሚቻል መሆኑን ለማሳየት።
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ይነግራቸው ነበር
  rationale: የግሪኩ ኢምፐርፌክት ገጽታ በያለፈ ጊዜ ቀጣይ ወይም ትዕይንት አዘጋጅ ድርጊትን ስለሚያመለክት፣ ይህ አተረጓጎም ያንን ገጽታ ይጠብቃል።
- source_word: δὲ
  choice: ም
  rationale: ቀላል የንግግር ሽግግርን በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያሳያል፤ ግልጽ የጊዜ ቅደም ተከተል አይጨምርም።
- source_word: παραβολὴν
  choice: ምሳሌ
  rationale: በወንጌላት አውድ παραβολήን ለመተርጎም የተለመደ፣ ግልጽና የዘውጉን ባሕርይ የሚጠብቅ ቃል ነው።
- source_word: πρὸς τὸ δεῖν … αὐτοὺς
  choice: እንደሚገባቸው
  rationale: የπρὸς τὸ ከኢንፊኒቲቭ ጋር ያለውን የዓላማ/ማጣቀሻ ኃይልና δεῖν የሚገልጠውን አስፈላጊነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάντοτε προσεύχεσθαι
  choice: ሁልጊዜ መጸለይ
  rationale: የጸሎትን ቀጣይነትና ጽናት በቀጥታ ያሳያል፤ ሳያቋርጡ ቃላትን መናገር የሚል ጠባብ ትርጉም አያስገባም።
- source_word: μὴ ἐγκακεῖν
  choice: ተስፋ አለመቁረጥ
  rationale: በጸሎት መጽናት አውድ ውስጥ ድፍረትን አለማጣትና ተስፋ አለመቁረጥን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የኢየሱስ ትምህርት ስለ ጸሎት ጽናት ያለው ኃይል
  choice: ጥቅሱ ሁልጊዜ መጸለይና ተስፋ አለመቁረጥ እንደሚገባ ይገልጣል፤ የጸሎት ውጤታማነትን በሚመለከት የአንድ ወገን ልዩ ትምህርት አያክልም።
  alternative: «ሁልጊዜ መጸለይ አለባቸው» የሚል ይበልጥ ጠንካራ ግዴታ፣ ወይም «መጸለያቸውን ሊቀጥሉ ይገባል» የሚል ለስላሳ ማበረታቻ።
  rationale: δεῖν አስፈላጊነትን ይገልጣል። «እንደሚገባቸው» ይህን ኃይል ይጠብቃል፣ ነገር ግን ጽሑፉ ያላለውን የጸሎት ሥነ መለኮት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እርሱም» የቀደመውን አውድ በለስላሳ ሁኔታ ያገናኛል፤ «ይነግራቸው ነበር» ደግሞ የግሪኩን ኢምፐርፌክት ገጽታ ይጠብቃል።
