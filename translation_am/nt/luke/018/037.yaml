  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የናዝሬት ኢየሱስ እያለፈ ነው።» ግሪኩ በቃል በቃል «ኢየሱስ ናዝሬታዊው» ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: ነገሩት
  rationale: ግሱ የተሰማውን መረጃ ለእርሱ ማስታወቅን ያመለክታል፤ በዚህ የትረካ አውድ «ነገሩት» ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: እነርሱም
  rationale: δέ ንግግሩን በቀላሉ የሚያስቀጥል አያያዥ ነው፤ በአማርኛ ያለው «-ም» ፍሰቱን ያለ አላስፈላጊ ተቃርኖ ይጠብቃል።
- source_word: αὐτῷ
  choice: -ት (ነገሩት)
  rationale: የግሪኩ ተዘዋዋሪ ተሳቢ በአማርኛ ከግሱ ጋር በተያያዘው «-ት» በተፈጥሯዊ ሁኔታ ተገልጿል።
- source_word: ὅτι
  choice: «…» ብለው
  rationale: ὅτι የተነገረውን ይዘት ያስገባል፤ በአማርኛ ቀጥተኛ ንግግርን «ብለው» በማለት ማቅረብ ተፈጥሯዊ ነው።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: ὁ Ναζωραῖος
  choice: ናዝሬቱ
  rationale: ግሪኩ ቃል ከናዝሬት ጋር የተያያዘ መጠሪያ ነው፤ «ናዝሬቱ» የመጠሪያውን ቅርጽ ጠብቆ በአማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: παρέρχεται
  choice: እያለፈ ነው
  rationale: በዚህ አውድ ግሱ በዚያው ጊዜ በመካሄድ ላይ ያለን ድርጊት ያሳያል፤ «እያለፈ ነው» ይህን ቀጣይነትና አፋጣኝነት ያስተላልፋል።
theological_decisions:
- issue: የኢየሱስ መጠሪያ Ναζωραῖος አተረጓጎም
  choice: ናዝሬቱ
  alternative: የናዝሬቱ / ከናዝሬት የሆነው
  rationale: ቃሉ በዋናነት ኢየሱስን ከናዝሬት ጋር የሚያያዝ መጠሪያ ነው። «ናዝሬቱ» የግሪኩን ስማዊ መጠሪያ ይጠብቃል፤ ከጽሑፉ በላይ የሆነ ሥነ መለኮታዊ ትርጉምም አያክልም።
