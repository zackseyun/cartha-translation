  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: am
  text: እርሱ ወደ ኢያሪኮ ሲቃረብ፣ አንድ ዓይነ ስውር በመንገድ ዳር ተቀምጦ እየለመነ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: ይህ አገላለጽ በዚህ ቦታ በዋናነት የትረካ መሸጋገሪያ ነው፤ በአማርኛ ‘እንዲህም ሆነ’ ብሎ መጨመር ንባቡን ያከብዳል፣ የሌለ ግልጽ የጊዜ ቃልም ሊያስገባ ይችላል።
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: እርሱ ወደ ኢያሪኮ ሲቃረብ
  rationale: በἐν የተመራው የተገለጸ ግስ ስም በአንድ ጊዜ የሚከናወን ድርጊትን ያሳያል፤ ‘ሲቃረብ’ ይህን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል። εἰς የእንቅስቃሴውን አቅጣጫ ‘ወደ’ በማለት ያሳያል።
- source_word: τυφλός τις
  choice: አንድ ዓይነ ስውር ሰው
  rationale: τις የማይወሰንነትንና ጥቂት የመለየት ስሜትን ይጨምራል፤ ‘አንድ’ ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል። ‘ዓይነ ስውር’ ክብር ያለውና የተለመደ አገላለጽ ነው።
- source_word: ἐκάθητο
  choice: ተቀምጦ ... ነበር
  rationale: የግሱ ያልተጠናቀቀ ገጽታ ሁኔታውን እንደ ቀጣይ የትረካ መድረክ ያቀርባል፤ የአማርኛው ውህድ ይህን በተፈጥሯዊነት ይገልጣል።
- source_word: παρὰ τὴν ὁδὸν
  choice: በመንገድ ዳር
  rationale: παρά በዚህ አገባብ ከመንገዱ ጎን ያለ ቦታን ያመለክታል፤ ‘በመንገድ ዳር’ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐπαιτῶν
  choice: ይለምን ነበር
  rationale: ተሳቢው በተቀመጠበት ጊዜ እያደረገው የነበረውን የልመና ተግባር ያሳያል፤ ትርጉሙ ያልተገለጸውን ‘ገንዘብ’ ወይም ‘ምጽዋት’ አይጨምርም።
