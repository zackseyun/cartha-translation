  text: እውነት እላችኋለሁ፤ የእግዚአብሔርን መንግሥት እንደ ሕፃን[a] የማይቀበል ሁሉ ፈጽሞ ወደ እርሷ አይገባም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕፃን ሆኖ።” ሐረጉ የሕፃን ተቀባይነትን፣ እምነትን፣ ትሕትናን ወይም ጥገኝነትን ሊያጎላ ይችላል፤ ግሪኩ ግን ትክክለኛውን ባሕርይ አይገልጽም።
