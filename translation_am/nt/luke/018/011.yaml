  choice: ቆሞ
  rationale: የግስ ተውሳክ የሆነውን የአኦሪስት አንቀጽ በተፈጥሯዊ አማርኛ የሰውየውን አቋቋም የሚያሳይ ሆኖ ያቀርባል።
- source_word: πρὸς ἑαυτὸν
  choice: ለብቻው
  rationale: ሐረጉ ቦታዊ ትርጉም (‘ለብቻው’) ወይም ነጸብራቃዊ ትርጉም (‘ለራሱ/በልቡ’) ሊኖረው ይችላል። ዋናው ጽሑፍ የትረካውን ትዕይንት በተፈጥሯዊነት ያቀርባል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ταῦτα
  choice: እንዲህ ብሎ
  rationale: በአማርኛ ቀጥሎ የሚመጣውን የጸሎት ይዘት ለማስተዋወቅ ‘እንዲህ ብሎ’ ተፈጥሯዊ ሲሆን፣ ‘እነዚህን ነገሮች’ የሚለውን ትርጉም በአገባቡ ይይዛል።
- source_word: προσηύχετο
  choice: ይጸልይ ነበር
  rationale: የግሪኩን ኢምፐርፌክት ገጽታና በሂደት ላይ ያለ ድርጊት ያስተላልፋል።
- source_word: εὐχαριστῶ σοι
  choice: አመሰግንሃለሁ
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ የምስጋና አገላለጽ ነው።
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: እንደ ሌሎቹ ሰዎች
  rationale: λοιποί የሚያመለክተውን ቀሪዎቹን/ሌሎቹን ሰዎች የሚል ንጽጽር ይጠብቃል፤ ἄνθρωποι እዚህ አጠቃላይ ሰዎችን ስለሚያመለክት ‘ሰዎች’ ተመርጧል።
- source_word: ἅρπαγες
  choice: ቀማኞች
  rationale: በስግብግብነት የሚነጥቁና የሚበዘብዙ ሰዎችን የሚያመለክት ተፈጥሯዊ አማርኛ ነው።
- source_word: ἄδικοι
  choice: ዓመፀኞች
  rationale: ቃሉ ሕገ ወጥነትንና ሥነ ምግባራዊ ክፋትን ያካተተውን የἀδίκοι ሃይማኖታዊ-ሥነ ምግባራዊ ክብደት ይይዛል።
- source_word: μοιχοί
  choice: አመንዝራዎች
  rationale: የጋብቻ ታማኝነትን የሚጥሱ ሰዎችን በመደበኛ የመጽሐፍ ቅዱስ አማርኛ ይገልጻል።
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: ወይም እንደዚህ ቀራጭ እንኳ
  rationale: ἢ καὶ ያለውን አጽንዖት ‘እንኳ’ ይጠብቃል፤ ‘ቀራጭ’ ለτελώνης በአማርኛ የተለመደና አጭር አቻ ነው።
