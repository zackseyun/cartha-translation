  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: am
  text: ሁለት ሰዎች ለመጸለይ ወደ ቤተ መቅደስ[a] ወጡ፤ አንዱ ፈሪሳዊ ሌላውም ቀረጥ ሰብሳቢ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል ἱερόν የቤተ መቅደሱን ግቢና አጠቃላይ ሕንፃዎች ያመለክታል እንጂ ውስጠኛውን መቅደስ ብቻ አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: ሁለት ሰዎች
  rationale: በአማርኛ “ሰዎች” ተፈጥሯዊ ሲሆን፣ ተከታዩ “አንደኛው… ሌላኛው” የሁለቱን ወንዶች ማንነት በሰዋስው ያሳያል።
- source_word: ἀνέβησαν
  choice: ወጡ
  rationale: ግሱ ወደ ላይ መሄድን ያመለክታል፤ “ወጡ” የመነሻውን አቅጣጫዊ ስሜት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εἰς τὸ ἱερὸν
  choice: ወደ ቤተ መቅደሱ[a]
  rationale: ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢና ሕንፃዎች ሊያመለክት ይችላል። “ቤተ መቅደስ” የተለመደና ክብር ያለው አገላለጽ ሲሆን ዝርዝሩ በማስታወሻ ተገልጿል።
- source_word: προσεύξασθαι
  choice: ለመጸለይ
  rationale: የዓላማ አመልካች የሆነውን ኢንፊኒቲቭ በቀጥታና ተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: አንደኛው ... ሌላኛውም
  rationale: በሁለቱ መካከል ያለውን ንጽጽር በተፈጥሯዊ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: Φαρισαῖος
  choice: ፈሪሳዊ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የአይሁድ ሃይማኖታዊ ቡድን ስም ይጠቀማል።
- source_word: τελώνης
  choice: ቀረጥ ሰብሳቢ
  rationale: ግብርና ቀረጥ የሚሰበስብን ሰው በግልጽና በዘመናዊ አማርኛ ያመለክታል።
theological_decisions:
- issue: ἱερόνን ከναός ለይቶ መተርጎም
  choice: ቤተ መቅደሱ፣ ከግቢው ትርጉም ጋር በማስታወሻ
  alternative: ወደ ቤተ መቅደሱ ግቢ
  rationale: ዋናው ጽሑፍ የተለመደውንና ተነባቢውን ቃል ይጠቀማል፤ የግሪኩ ቃል በተለይ ውስጣዊውን መቅደስ ብቻ እንደማያመለክት ማስታወሻው ያብራራል።
- issue: ἄνθρωποι የፆታ አገላለጽ
  choice: ሰዎች
  alternative: ወንዶች
  rationale: “ሰዎች” የἄνθρωποι መደበኛ አማርኛ ትርጉም ነው፤ “አንደኛው… ሌላኛው” የሚለው ተባዕታይ ቅርጽ በዚህ አውድ ሁለቱ ወንዶች መሆናቸውን ሳያደበዝዝ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ወጡ” የቦታውን ከፍታዊ አቅጣጫ ይጠብቃል፤ የግሱ ዓላማ “ለመጸለይ” ተብሎ በግልጽ ቀርቧል።
