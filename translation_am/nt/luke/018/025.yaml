base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: am
  text: ምክንያቱም ባለጠጋ ወደ የእግዚአብሔር መንግሥት ከመግባት ይልቅ፣ ግመል በመርፌ ቀዳዳ በኩል መግባት ይቀላል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፣ “በመርፌ ዓይን በኩል።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንዶች “የመርፌ ቀዳዳ” የተባለ ጠባብ በር እንደነበር ወይም እዚህ “ግመል” ሳይሆን “ገመድ” ማለት እንደሆነ ሐሳብ አቅርበዋል፤ ሆኖም የግሪኩ ጽሑፍ “ግመል” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: ይቀላል
  rationale: ከንጽጽሩ ጋር ተያይዞ ‘ይቀላል’ የሚለው በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት ይጠብቃል።
- source_word: κάμηλον
  choice: ግመል
  rationale: የግሪኩ ቃል መደበኛ ትርጉም ‘ግመል’ ነው፤ ያልተደገፈው ‘ገመድ’ የሚለው ትርጓሜ አልገባም።
- source_word: διὰ τρήματος βελόνης
  choice: በመርፌ ቀዳዳ
  rationale: τρήματος የመርፌውን ቀዳዳ ያመለክታል፤ ይህ በአማርኛ ግልጽና ተፈጥሯዊ አቻ ነው።
- source_word: εἰσελθεῖν
  choice: መግባት / ቢገባ
  rationale: የመግባትን እንቅስቃሴ በሁለቱም የንጽጽር ክፍሎች ይጠብቃል፤ የአማርኛው አገባብ ተፈጥሯዊ እንዲሆን የግስ ቅርጹ ተስተካክሏል።
- source_word: πλούσιον
  choice: ባለጠጋ
  rationale: በአማርኛ እንደ ስም የሚሠራ ተፈጥሯዊ አቻ ሲሆን የግሪኩን ነጠላ ተወካይ አገላለጽ ይጠብቃል።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ወደ እግዚአብሔር መንግሥት
  rationale: εἰς የሚያመለክተውን አቅጣጫ ‘ወደ’ በሚለው ይጠብቃል፤ ‘የእግዚአብሔር መንግሥት’ የተለመደና ግልጽ መጽሐፍ ቅዱሳዊ ሐረግ ነው።
