translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽር በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር ቅደም ተከተል ቀርቧል፤ ሁለቱም የግርጌ ማስታወሻ ምልክቶች በዋናው ጽሑፍ ተካተዋል።
