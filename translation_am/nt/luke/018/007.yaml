  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: am
  text: ታዲያ እግዚአብሔር ቀንና ሌሊት ወደ እርሱ ለሚጮኹ ለመረጣቸው ሰዎች ፍትሕ አያሰጣቸውምን? ስለ እነርሱስ ለረጅም ጊዜ ይዘገያልን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እነርሱ ታጋሽ ሆኖ ሳለ” ወይም “ስለ እነርሱስ ይታገሣልን?” የግሪኩ ሐረግ እርምጃን ከማዘግየት ይልቅ ትዕግሥትንና ታጋሽነትን እንደሚያመለክት ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: ፍትሕ አያሰጣቸውምን
  rationale: በዐውዱ የግል በቀልን ሳይሆን ሕጋዊ ፍትሕንና ተገቢውን ውሳኔ ማግኘትን ያመለክታል፤ ይህ አባባል በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐκλεκτῶν
  choice: ለመረጣቸው ሰዎች
  rationale: ቅጽሉ እንደ ስም ያገለግላል። ይህ አተረጓጎም እግዚአብሔር የመረጣቸውን ሰዎች ያመለክታል፤ የአንድን ወገን ልዩ የእምነት ትርጓሜ አያስገባም።
- source_word: βοώντων
  choice: ለሚጮኹ
  rationale: ቃሉ ከፍተኛ ጥድፊያና ተደጋጋሚ ልመና ያለበትን ጥሪ ያሳያል።
- source_word: ἡμέρας καὶ νυκτός
  choice: ቀንና ሌሊት
  rationale: የጊዜውን ቀጣይነትና የልመናውን ያለማቋረጥ መሆን የሚጠብቅ የተለመደ አማርኛ አገላለጽ ነው።
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: ስለ እነርሱስ ብዙ ጊዜ ይዘገያልን?
  rationale: ሐረጉ በአገባብም በፍቺም አሻሚ ነው። ዋናው ጽሑፍ ከቁጥር 8 ፈጣን ፍትሕ ጋር ያለውን የክርክር ፍሰት በመከተል የእርምጃ መዘግየትን ይገልጻል፤ የትዕግሥት ፍቺው ግን በማስታወሻ ተጠብቋል።
- source_word: οὐ μὴ ποιήσῃ
  choice: አያሰጣቸውምን?
  rationale: ጠንካራው አሉታዊ አወቃቀር አዎንታዊ መልስ በሚጠብቅ የንግግር ጥያቄ ተተርጉሟል።
- source_word: θεὸς
  choice: እግዚአብሔር
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ንባብ የተለመደና ክብር ያለው መጠሪያ ነው።
theological_decisions:
- issue: የμακροθυμεῖ ἐπ’ αὐτοῖς ፍቺ ከእግዚአብሔር ትዕግሥትና ድርጊት ጋር ያለው ግንኙነት
  choice: ዋናው ጽሑፍ ሐረጉን እርምጃ ስለማዘግየት የሚጠይቅ ጥያቄ አድርጎ ተርጉሞታል።
  alternative: “ስለ እነርሱ ታጋሽ ሆኖ ሳለ” ወይም “ስለ እነርሱስ ይታገሣልን?”
  rationale: የግሪኩ ሐረግ ትዕግሥትን ሊያመለክት ቢችልም፣ የቅርቡ ዐውድ፣ በተለይም ቁጥር 8፣ ፈጣን ፍትሕን ያጎላል። አሻሚነቱን ሳይደመስስ ዋናው ንባብ የዐውዱን ፍሰት ይከተላል፤ አማራጩም በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የንግግር ጥያቄዎቹ በተፈጥሯዊ አማርኛ ተጠብቀዋል፤ የግሪኩ የመጨረሻ ሐረግ አሻሚነትም በማስታወሻ ተገልጿል።
