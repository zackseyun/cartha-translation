lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: እርሱም … አለ
  rationale: δέ ቀላል የትረካ ማያያዣ ነው፤ የግድ ተቃርኖን ሳያጎላ፣ የአማርኛው «-ም» የንግግሩን ቀጣይነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: Ταῦτα πάντα
