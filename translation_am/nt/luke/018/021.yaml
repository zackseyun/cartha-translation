  rationale: የግሪኩን አመልካች ተውላጠ ስምና πᾶςን በቀጥታ ያንጸባርቃል። «ትእዛዛት» ከአውዱ የሚገባ ቢሆንም በዚህ ሐረግ በግልጽ አልተጠቀሰም።
- source_word: ἐφύλαξα
  choice: ጠብቄአለሁ
  rationale: φυλάσσω በዚህ አውድ ትእዛዛትን መጠበቅ ወይም መፈጸም ማለት ነው። «ጠብቄአለሁ» እስከ አሁን የዘለቀ የታዛዥነት ማረጋገጫን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐκ νεότητος μου
  choice: ከወጣትነቴ ጀምሮ
  rationale: ἐκ የጊዜን መነሻ ያመለክታል፤ «ከወጣትነቴ ጀምሮ» የግሪኩን ፍቺ ግልጽና ዘመናዊ በሆነ አማርኛ ይገልጻል።
