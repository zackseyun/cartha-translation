  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: am
  text: እላችኋለሁ፤ ይህ ሰው ከዚያኛው ይልቅ[a] ጻድቅ ተብሎ ወደ ቤቱ ወረደ። ምክንያቱም ራሱን ከፍ የሚያደርግ ሁሉ ዝቅ ይደረጋል፤ ራሱን ዝቅ የሚያደርግ ግን ከፍ ይደረጋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከዚያኛው ጋር ሲነጻጸር ጻድቅ ተብሎ»፤ ሐረጉ ይህን ሰው ለጸሎት ከመጣው ከሌላው ሰው ጋር ያነጻጽራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: ጻድቅ ተብሎ
  rationale: የፍጹም ጊዜ ተደራጊ አካፋይ ቅርጹ የተሰጠን የሞገስ ፍርድና የቀጠለውን ውጤት ያመለክታል። «ጻድቅ ተብሎ» የእግዚአብሔርን የሞገስ ፍርድ በተፈጥሯዊ አማርኛ ያሳያል፤ ከጥቅሱ በላይ የሆነ ሥርዓተ እምነታዊ ማብራሪያም አይጨምርም።
- source_word: παρ’ ἐκεῖνον
  choice: ከዚያኛው ይልቅ
  rationale: παρά ከተሳቢ ቅጽ ጋር ንጽጽርን ወይም ልዩነትን ሊያመለክት ይችላል። ይህ አገላለጽ ቀረጥ ሰብሳቢውን ከፈሪሳዊው ጋር በተፈጥሯዊ አማርኛ ያነጻጽራል፤ የንጽጽሩ አወቃቀር ግን በማስታወሻ ተጠብቋል።
- source_word: κατέβη
  choice: ወረደ
  rationale: የቤተ መቅደሱን አካባቢ ለቆ ወደ ቤቱ የሚደረገውን ተጨባጭ የመውረድ እንቅስቃሴ ይጠብቃል።
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: ወደ ቤቱ
  rationale: የግሪኩን ቀጥተኛ ትርጉም ጠብቆ በአማርኛ ተፈጥሯዊ ነው።
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: ራሱን ከፍ የሚያደርግ ሁሉ
  rationale: አጠቃላይ መርሕ የሚገልጸውን ስማዊ አካፋይና የድርጊቱን ወደ ራስ መመለስ ይጠብቃል።
- source_word: ταπεινωθήσεται
  choice: ዝቅ ይደረጋል
  rationale: የወደፊት ተደራጊ ቅርጹን ይጠብቃል፤ ድርጊቱን የሚፈጽመውን እንደ ግሪኩ ሳይገልጽ ይተዋል።
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: ራሱን ዝቅ የሚያደርግ ግን
  rationale: ከመጀመሪያው ክፍል ጋር ያለውን ትይዩ አወቃቀርና በδέ የተገለጸውን ተቃርኖ ይጠብቃል።
- source_word: ὑψωθήσεται
  choice: ከፍ ይደረጋል
  rationale: የወደፊት ተደራጊ ቅርጹን ይጠብቃል፤ «ዝቅ ይደረጋል» ከሚለውም ጋር ግልጽ ትይዩነት ይፈጥራል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ከቀደመው ፍርድ በኋላ ያለውን ምክንያታዊ ማብራሪያ በግልጽ ዘመናዊ አማርኛ ያስተዋውቃል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: ቀደም ሲል የተጠቀሰውን ቀረጥ ሰብሳቢ በግልጽ ያመለክታል፤ ከፈሪሳዊው ጋር ያለውንም ንጽጽር ያሳያል።
theological_decisions:
- issue: በምሳሌው መደምደሚያ δικαιόω የሚለው ቃል ያለው ትርጉም
  choice: የእግዚአብሔርን የሞገስ ፍርድ የሚያመለክት «ጻድቅ ተብሎ»
  alternative: በሰፊው ማኅበራዊ ትርጉም «ንጹሕነቱ ተረጋግጦ»
  rationale: አውዱ በራሱ ጽድቅ የተማመነውን ፈሪሳዊ ንስሐ ከገባው ቀረጥ ሰብሳቢ ጋር በእግዚአብሔር ፊት ያነጻጽራል። ምርጫው የመለኮታዊውን የሞገስ ፍርድ ይጠብቃል፤ በኋላ የተደራጀ ሙሉ ሥርዓተ እምነትን ግን በጥቅሱ ላይ አይጭንም።
- issue: በπαρ’ ἐκεῖνον ውስጥ ያለው የንጽጽር አይነት
  choice: «ከዚያኛው ይልቅ» በማለት ንጽጽሩን መግለጽ
  alternative: «ከዚያኛው ጋር ሲነጻጸር» ወይም «ከዚያኛው ሳይሆን»
  rationale: የግሪኩ ሐረግ ንጽጽርን ወይም ተቃርኖን ይፈቅዳል። ዋናው ጽሑፍ ተፈጥሯዊውን የአማርኛ ንጽጽር ይጠቀማል፤ ሌላው ሊሆን የሚችለው አወቃቀር በማስታወሻ ቀርቧል።
- issue: በመጨረሻው መርሕ ያለው ተደራጊ ድምፅ
  choice: «ዝቅ ይደረጋል» እና «ከፍ ይደረጋል» ብሎ ድርጊቱን ፈጻሚ ሳይገልጽ መተው
  alternative: እግዚአብሔርን በግልጽ የድርጊቱ ፈጻሚ አድርጎ መጨመር
  rationale: በአውዱ የመለኮታዊ ፈጻሚነት ሊገባ ቢችልም ግሪኩ ፈጻሚውን በግልጽ አይሰይምም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ጠብቋል።
