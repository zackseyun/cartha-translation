  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: am
  text: ኢየሱስም ይህን ሰምቶ እንዲህ አለው፦ “አንድ ነገር ገና ይጎድልሃል፤[a] ያለህን ሁሉ ሽጥና ለድሆች አከፋፍል፤ በሰማያትም ሀብት ይኖርሃል።[b] መጥተህ ተከተለኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ነገር ገና ጎድሎብሃል።” ግሪኩ ቃል በቃል፣ “አንድ ነገር ገና ይጎድልሃል” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሰማይ።” ግሪኩ “ሰማያት” የሚል የብዙ ቁጥር ቅርጽ ይጠቀማል፤ “በሰማይ” በአማርኛ የተለመደ ነጠላ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: ኢየሱስም ይህን ሰምቶ
  rationale: የግሪኩን የድርጊት ቅደም ተከተልና δέ የሚያሳየውን ሽግግር በተፈጥሯዊ አማርኛ ያቀርባል። የተሰማው ከቀደመው ንግግር ጋር እንዲገናኝ “ይህን” ተጠቅሟል።
- source_word: Ἔτι ἕν σοι λείπει
  choice: አንድ ነገር ገና ይጎድልሃል
  rationale: λείπει የሚለውን “ይጎድላል” በሚል ቅርብ አቻ ያስተላልፋል፤ ἕν የሚለውንም አጽንዖት ይጠብቃል። በአማርኛ የግሪኩ የሰዋስው አወቃቀር በተፈጥሮ ወደ ሁለተኛ መደብ ግስ ይገባል።
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: ያለህን ሁሉ ሽጥ
  rationale: πάντα ὅσα ያለውን ሁሉን አቀፍ ኃይል “ሁሉ” ያስጠብቃል፤ የአንድ ጊዜ ወሳኝ ትእዛዝም በ“ሽጥ” በቀጥታ ተገልጿል።
- source_word: διάδος πτωχοῖς
  choice: ለድሆች አከፋፍል
  rationale: διαδίδωμι ከተራ “መስጠት” ይልቅ የማከፋፈል ሐሳብ ስላለው “አከፋፍል” ተመርጧል፤ πτωχοῖς ደግሞ በተለመደው “ለድሆች” ተተርጉሟል።
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: በሰማያትም ሀብት ይኖርሃል
  rationale: οὐρανοῖς በግሪኩ ብዙ ቁጥር ስለሆነ “በሰማያት” በማለት ተጠብቋል። θησαυρός በዚህ አውድ “ሀብት” ተብሎ ለዘመናዊ አንባቢ በተፈጥሯዊና ግልጽ ቃል ተላልፏል።
- source_word: καὶ δεῦρο ἀκολούθει μοι
  choice: ከዚያም መጥተህ ተከተለኝ
  rationale: δεῦρο የመምጣትን ጥሪ ያሳያል፤ ἀκολούθει ደግሞ ቀጣይ ደቀ መዝሙርነትን ሊያመለክት ቢችልም “ተከተለኝ” በአማርኛ ይህን ኃይል በተፈጥሮ ይይዛል። “ከዚያም” የትእዛዞቹን ቅደም ተከተል ያብራራል።
theological_decisions:
- issue: የንብረት መተውና የደቀ መዝሙርነት ጥሪ
  choice: ቃሉ ለዚህ ሰው የተሰጠ ቀጥተኛና ተግባራዊ የመሸጥ፣ ለድሆች የማከፋፈልና ኢየሱስን የመከተል ጥሪ ሆኖ ተተርጉሟል።
  alternative: ትእዛዙን ለእያንዳንዱ አማኝ የተሰጠ ሁሉንም ንብረት የመተው ዓለም አቀፍ ሕግ አድርጎ መተርጎም፣ ወይም ተጨባጭ ኢኮኖሚያዊ ጥያቄ የሌለው ተምሳሌታዊ ንግግር ብቻ አድርጎ ማቅረብ
  rationale: ግሪኩ ለአንድ ግለሰብ ተጨባጭ ትእዛዞችን ይሰጣል፣ ንግግሩም “ተከተለኝ” በሚለው ይደመደማል። ትርጉሙ ይህን ኃይል ይጠብቃል፤ ነገር ግን ጥቅሱ በግልጽ ያልተናገረውን የአስተምህሮ ማጠቃለያ አያስገባም።
