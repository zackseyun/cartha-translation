  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: am
  text: እርሱ ግን ይህን ሲሰማ እጅግ አዘነ፤[a] እጅግ ባለጠጋ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጅግ ተጨነቀ።” የግሪክኛው ቅጽል ጥልቅ ሐዘንን ወይም ከባድ ጭንቀትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ሲሰማ
  rationale: የአዎሪስት አሳታፊውን ጊዜያዊ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል፤ መስማቱና ቀጣዩ ምላሹ ያላቸውን ቅደም ተከተል ይጠብቃል።
- source_word: ταῦτα
  choice: ይህን
  rationale: በግሪክኛ ብዙ ቁጥር ቢሆንም፣ በዘመናዊ አማርኛ ከዚህ በፊት የተነገረውን ንግግር በአንድነት ‘ይህን’ ማለት ተፈጥሯዊ ነው።
- source_word: περίλυπος
  choice: እጅግ አዘነ
  rationale: ቃሉ ከፍተኛ ሐዘንንና የውስጥ ጭንቀትን ያመለክታል፤ ‘እጅግ’ የስሜቱን ጥንካሬ ያስጠብቃል።
- source_word: ἐγενήθη
  choice: አዘነ
  rationale: ወደ ሐዘን ሁኔታ መግባቱን በተፈጥሯዊ የአማርኛ ግስ ይገልጣል፤ ‘ሐዘንተኛ ሆነ’ የሚለውን ቀጥተኛ ቅርጽ ከማስገባት ይልቅ አንባቢነቱን ያሻሽላል።
- source_word: πλούσιος
  choice: ባለጠጋ
  rationale: ብዙ ሀብት ያለውን ሰው በክቡርና በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: σφόδρα
  choice: እጅግ
  rationale: የሀብቱን ከፍተኛ መጠን በአጭርና በተፈጥሯዊ ማጠናከሪያ ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖና የሰውየውን ምላሽ ግልጽ ያደርጋል።
- source_word: γὰρ
  choice: ነበርና
  rationale: ለሐዘኑ ምክንያት የሚሰጠውን ገላጭ ግንኙነት በተፈጥሯዊ የአማርኛ ቅጥያ ያስተላልፋል።
