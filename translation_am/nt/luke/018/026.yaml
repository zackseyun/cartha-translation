  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: አሉ
  rationale: የአንድ ጊዜ ያለፈ ድርጊትን በተፈጥሯዊ የአማርኛ ትረካ ይገልጣል።
- source_word: δὲ
  choice: ታዲያ
  rationale: በዐውዱ ያለውን የንግግር ቀጣይነትና ከሰሙት ነገር የተነሣውን ጥያቄ በተፈጥሯዊ አማርኛ ያሳያል፤ ከκαί ጋር ያለውን ጥምር ኃይል በአንድ ቃል ይይዛል።
- source_word: οἱ ἀκούσαντες
  choice: ይህንም የሰሙት
  rationale: በፊት የተነገረውን የሰሙ ሰዎችን ይጠቅሳል፤ ‘ይህን’ የሚለው ተሳቢ ከዐውዱ ተገንዝቦ የግሪኩን ተሳቢ-አልባ አገላለጽ በአማርኛ ግልጽ ያደርገዋል።
- source_word: Καὶ
  choice: ታዲያ
  rationale: ከδὲ ጋር በመያያዝ የመደመርና የድንጋጤ ስሜቱን ‘ታዲያ’ በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: τίς
  choice: ማን
  rationale: የሚድነውን ሰው ማንነት የሚጠይቀውን ተውላጠ ስም በቀጥታ ይተረጉማል።
- source_word: δύναται
  choice: ይችላል
  rationale: የችሎታን ወይም የመቻልን ሐሳብ በአጭርና በዘመናዊ አማርኛ ይገልጣል።
- source_word: σωθῆναι
  choice: ሊድን
  rationale: የግሪኩን ተደራጊ ትርጉም በአማርኛው ‘መዳን’ ግስ ያስተላልፋል፤ በዐውዱም ከመንግሥቱ መግባትና ከድነት ጋር የተያያዘ ነው።
theological_decisions:
- issue: በዐውዱ የσωθῆναι ትርጉም
  choice: ሊድን
  alternative: ከአደጋ ሊያመልጥ / ነፃ ሊወጣ
  rationale: በአቅራቢያው ዐውድ የሚነሣው ጉዳይ ወደ እግዚአብሔር መንግሥት መግባትና ለባለጠጋ ያለው አስቸጋሪነት ስለሆነ፣ ከአካላዊ አደጋ መትረፍ ይልቅ የድነት ትርጉሙ ዋና ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ታዲያ’ የሰሚዎቹን መደነቅና ከቀደመው ንግግር የተነሣውን ጥያቄ በተፈጥሯዊነት ያሳያል።
