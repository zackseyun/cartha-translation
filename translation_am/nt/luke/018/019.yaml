id: LUK.18.19
reference: Luke 18:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “ለምን በጎ ትለኛለህ? ከአንዱ ከእግዚአብሔር በቀር በጎ ማንም የለም” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: የንግግሩን ቀጣይነትና የኢየሱስን ምላሽ በተፈጥሯዊ አማርኛ ያሳያል፤ ግልጽ ተቃርኖ ስለማያስፈልግ “ነገር ግን” አልተጨመረም።
- source_word: εἶπεν ... αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም ... አለው
  rationale: የግሪኩን “ኢየሱስ እርሱን አለው” የሚለውን ቀጥተኛ አገላለጽ በተፈጥሯዊ የአማርኛ ቃል ቅደም ተከተል ይጠብቃል።
- source_word: Τί με λέγεις ἀγαθόν
  choice: ለምን በጎ ትለኛለህ?
  rationale: τί በዚህ አገባብ የምክንያት ጥያቄ ስለሆነ “ለምን” ተብሏል፤ “በጎ ትለኛለህ” ደግሞ የግሪኩን ቀጥተኛነት በግልጽ አማርኛ ያቀርባል።
- source_word: ἀγαθόν / ἀγαθὸς
  choice: በጎ
  rationale: ሁለቱንም የቃሉን መከሰቶች በአንድ ቃል ይተረጉማል፤ “በሥነ ምግባር በጎ” የሚል ማብራሪያ በመጨመር ትርጉሙን አያጠብም።
- source_word: οὐδεὶς
  choice: የለም
  rationale: ከአማርኛው የልዩነት አገባብ ጋር ተያይዞ ሁሉን አቀፍ እምቢታውን በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: ከአንዱ ከእግዚአብሔር በቀር
  rationale: የልዩነት አገባቡንና εἷς ያለውን “አንድ” አጽንዖት ይጠብቃል፤ አንዱ ማን እንደሆነም “ከእግዚአብሔር” በማለት ግልጽ ያደርጋል።
- source_word: ὁ θεός
  choice: እግዚአብሔር
  rationale: በመደበኛ ዘመናዊ የአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የግሪኩን θεός በአግባቡ ያመለክታል።
theological_decisions:
- issue: የኢየሱስ ጥያቄ ክርስቶሎጂያዊ አንድምታ
  choice: ጥያቄው ኢየሱስ በጎነቱን እንደካደ ወይም መለኮቱን በቀጥታ እንዳወጀ ሳይብራራ ቀርቧል።
  alternative: ኢየሱስ ፍጹም በጎ መሆኑን እየካደ ነው ብሎ መተርጎም፣ ወይም በጥያቄው መለኮቱን በግልጽ እያወጀ ነው ብሎ መተርጎም።
  rationale: የግሪኩ ጽሑፍ ጥያቄውንና ስለ እግዚአብሔር ብቸኛ በጎነት የተነገረውን ያስቀምጣል፣ ነገር ግን ክርስቶሎጂያዊ ድምዳሜውን በዚህ ጥቅስ ብቻ አይገልጽም፤ ትርጉሙም ይህን ውጥረት ጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። “በጎ” የሚለው ቃል በሁለቱም ስፍራ በወጥነት ተጠቅሟል። የግሪኩን εἷς አጽንዖት ለማቆየት “ከአንዱ ከእግዚአብሔር በቀር” ተብሏል።
