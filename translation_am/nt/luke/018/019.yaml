revisions:
- from: ኢየሱስም፣ “ለምን በጎ ትለኛለህ? ከአንዱ ከእግዚአብሔር በቀር በጎ የለም” አለው።
  to: ኢየሱስ ግን፣ “ለምን በጎ ትለኛለህ? ከአንዱ ከእግዚአብሔር በቀር በጎ ማንም የለም” አለው።
  rationale: The revision explicitly translates οὐδείς with ማንም and uses ግን for the mild response/contrast signaled by δέ. It retains the direct question, the repeated “good,” and the Greek construction’s theological tension; it neither makes Jesus deny goodness nor turns the question into an explicit assertion of deity.
  reviewer_model: gpt-5.6-terra
