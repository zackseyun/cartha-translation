id: LUK.18.27
reference: Luke 18:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: am
  text: እርሱ ግን፣ “ለሰዎች የማይቻለው ለእግዚአብሔር ይቻላል” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: የማይቻለው
  rationale: በግሪክኛው በስም ፈንታ የቆመውን ገለጻ በተፈጥሯዊ አማርኛ ‘የማይቻለው’ ብሎ ያቀርባል፤ ከሰው አቅም በላይ የሆነውን ያመለክታል።
- source_word: παρὰ ἀνθρώποις
  choice: ለሰዎች
  rationale: παρά ከዳቲቭ ጋር እዚህ የግንኙነትን ወይም የአቅምን ወሰን ያሳያል። ‘ለሰዎች’ በዘመናዊ አማርኛ ሰዎችን በአጠቃላይ የሚያመለክት ተፈጥሯዊ አባባል ነው።
- source_word: δυνατὰ
  choice: ይቻላል
  rationale: ከἀδύνατα ጋር ያለውን ቀጥተኛ ተቃርኖ በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: παρὰ τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ከ‘ለሰዎች’ ጋር ትይዩነቱን ይጠብቃል፤ ነገሩ በእግዚአብሔር ዘንድ ወይም ከእርሱ አቅም አንጻር የሚቻል መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ δὲ εἶπεν
  choice: እርሱ ግን … አለ
  rationale: δέ በአውዱ ያለውን መጠነኛ ተቃርኖ በ‘ግን’ ያሳያል፤ የአማርኛው የንግግር አቀራረብ ግሱን በመጨረሻ ያኖራል።
theological_decisions:
- issue: የመለኮታዊ ችሎታ ወሰን
  choice: ንግግሩ ለሰዎች የማይቻለው ለእግዚአብሔር እንደሚቻል ይገልጻል፤ ከዚህ በላይ የሚሄድ ፍልስፍናዊ ዝርዝር አይጨምርም።
  alternative: ጥቅሱ ስለ ማንኛውም ሊታሰብ ስለሚችል ድርጊት ፍጹም መለኮታዊ ችሎታን የሚወስን አጠቃላይ ፍልስፍናዊ መርሕ ነው ብሎ መተርጎም።
  rationale: የግሪክኛው ንግግር በአውዱ የሰውን አለመቻልና የእግዚአብሔርን መቻል በመዳንና ሀብታሙ ወደ መንግሥቱ መግባት ጉዳይ ያነጻጽራል። ትርጉሙ ሰፊውን አነጋገር ይጠብቃል እንጂ ጽሑፉ ያልገለጸውን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ሰዎች’ ἀνθρώποιςን በጾታ ያልተወሰነ አጠቃላይ ትርጉም ይወክላል። ‘ለ…’ የሚለው ትይዩ አቀራረብ የግሪክኛውን παρὰ ἀνθρώποις / παρὰ τῷ θεῷ ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል። በእንግሊዝኛው የግርጌ ማስታወሻ የቀረበው ‘with/for’ ልዩነት በአማርኛ ‘ለ…’ ውስጥ በተፈጥሯዊ ሁኔታ ስለሚካተት የግርጌ ማስታወሻ አላስፈለገም።
