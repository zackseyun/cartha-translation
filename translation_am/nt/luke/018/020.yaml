  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: am
  text: ትእዛዛቱን ታውቃለህ፤ “አታመንዝር፣ አትግደል፣ አትስረቅ፣ በሐሰት አትመስክር፣ አባትህንና እናትህን አክብር።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: ትእዛዛቱን
  rationale: ἐντολή ባለሥልጣናዊ ትእዛዝን ያመለክታል፤ እዚህ የሚጠቀሱት የአሥርቱ ትእዛዛት ክፍሎች ስለሆኑ፣ የተወሰነው ብዙ ቁጥር ‘ትእዛዛቱን’ ዐውዳዊ ትርጉሙን ይጠብቃል።
- source_word: οἶδας
  choice: ታውቃለህ
  rationale: οἶδα በቅርጹ ፍጹም ጊዜ ቢሆንም በኮይኔ ግሪክ የአሁን ጊዜ ትርጉም አለው፤ ‘ታውቃለህ’ ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: Μὴ μοιχεύσῃς
  choice: አታመንዝር
  rationale: μοιχεύω የጋብቻ ታማኝነትን የሚጥስ ዝሙትን በተለይ ያመለክታል፤ ‘አታመንዝር’ ይህን ልዩ ሥነ ምግባራዊ ይዘት በአጭር የትእዛዝ ቅርጽ ያስተላልፋል።
- source_word: Μὴ φονεύσῃς
  choice: አትግደል
  rationale: φονεύω በዐውዱ ሕገ ወጥ ሰው መግደልን ያመለክታል። ‘አትግደል’ በአማርኛ በትእዛዙ ባሕላዊ አገላለጽ የታወቀ ሲሆን ትርጉሙ ከዐውዱ ይገለጣል።
- source_word: Μὴ κλέψῃς
  choice: አትስረቅ
  rationale: κλέπτω በቀጥታ ‘መስረቅ’ ማለት ነው፤ አሉታዊው የትእዛዝ ቅርጽ የግሪኩን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: በሐሰት አትመስክር
  rationale: ψευδομαρτυρέω በሐሰት መመስከር ወይም ሐሰተኛ ምስክርነት መስጠት ማለት ነው፤ ይህ አገላለጽ ግልጽ ሲሆን ከአሥርቱ ትእዛዛት ጋር ያለውን ጽሑፋዊ ግንኙነትም ይጠብቃል።
- source_word: Τίμα
  choice: አክብር
  rationale: τιμάω እዚህ ለወላጆች ክብር መስጠትንና እንደ ክቡራን መቁጠርን ያመለክታል፤ ‘አክብር’ የተለመደና ትክክለኛ አቻ ነው።
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: አባትህንና እናትህን
  rationale: ግሪኩ ሁለቱንም ወላጆች በግልጽ ይጠቅሳል፤ የአማርኛው ጥምር አገላለጽ የእያንዳንዱን የባለቤትነት ግንኙነት ተፈጥሯዊ በሆነ መንገድ ያሳያል።
theological_decisions:
- issue: የአሥርቱ ትእዛዛት አሉታዊ ትእዛዞች አተረጓጎም
  choice: ዘመናዊና ቀጥተኛ የአማርኛ ክልከላ ቅርጾችን መጠቀም፦ ‘አታመንዝር፣ አትግደል…’
  alternative: የወደፊት ጊዜ ወይም ይበልጥ ጥንታዊ ድምፅ ያለው አገላለጽ
  rationale: የግሪኩ μή ከአኦሪስት ሳብጃንክቲቭ ጋር የገባው ቅርጽ ቀጥተኛ ክልከላን ይገልጣል። የአማርኛው ‘አት-’ ቅርጽ ይህን ኃይል በዘመናዊና ክቡር ቋንቋ ያቀርባል፤ ይህ የአጻጻፍ ምርጫ እንጂ የትምህርተ እምነት ለውጥ አይደለም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የትእዛዛቱ የታወቀ ቅኝት ተጠብቆ፣ ንግግሩ ለተራ አንባቢ ቀጥተኛ እንዲሆን ተደርጓል። በአማርኛ የቀጥተኛውና የባሕላዊው የክልከላ አገላለጽ ተመሳሳይ ስለሆነ፣ የእንግሊዝኛውን ‘Do not/You shall not’ ልዩነት የሚያስረዳ የግርጌ ማስታወሻ አላስፈለገም።
