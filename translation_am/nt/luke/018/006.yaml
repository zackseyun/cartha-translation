lexical_decisions:
- source_word: εἶπεν
  choice: አለ
  rationale: የλέγω ያለፈ ጊዜ ቅርጽ በአማርኛ የትረካ ንግግር መግቢያ በተፈጥሮ «አለ» ተብሎ ይተረጎማል።
- source_word: δὲ
  choice: -ም
  rationale: የትረካውን ቀጣይነት ያለ አላስፈላጊ ጊዜያዊ ትርጓሜ የሚጠብቅ ተፈጥሯዊ የአማርኛ አያያዥ ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በሉቃስ ትረካ ይህ ስያሜ ኢየሱስን ያመለክታል፤ «ጌታ» የማዕረጉን ክብደት ይጠብቃል።
- source_word: Ἀκούσατε
  choice: ስሙ
  rationale: የብዙ ቁጥር ትእዛዛዊ ኃይሉን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τί
  choice: የሚለውን
  rationale: የፈራጁን ንግግር ይዘት፣ ማለትም «የሚለውን» ያመለክታል እንጂ የንግግሩን አኳኋን አይደለም።
- source_word: ὁ κριτὴς
  choice: ፈራጅ
  rationale: ቀደም ሲል በምሳሌው የተጠቀሰውን ዳኛ በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: τῆς ἀδικίας
  choice: ዓመፀኛው
  rationale: ግሪኩ ቃል በቃል «የዓመፅ/የኢፍትሐዊነት ፈራጅ» የሚል የባሕርይ ገላጭ ነው፤ «ዓመፀኛ» ሕጋዊ ኢፍትሐዊነትንና ሰፊውን ሥነ ምግባራዊ ክፋት በአጭሩ ይይዛል።
- source_word: λέγει
  choice: የሚለውን
  rationale: የግሪኩን የአሁን ጊዜ አገላለጽ በአማርኛ ተፈጥሯዊ የዝምድና ግስ ይገልጣል።
theological_decisions:
- issue: ኢየሱስን የሚያመለክተው κύριος
  choice: ጌታ
  alternative: መምህር / ባለቤት
  rationale: «ጌታ» በሉቃስ ውስጥ ያለውን የማዕረግና የክርስቶሳዊ ክብደት ሳይጨምር ይጠብቃል፤ አማራጮቹ እዚህ ያለውን ክብደት ሊያቀልሉ ይችላሉ።
- issue: τῆς ἀδικίας የሚገልጸው የፈራጁ ባሕርይ
  choice: ዓመፀኛው ፈራጅ
  alternative: ኢፍትሐዊው ፈራጅ / የዓመፅ ፈራጅ
  rationale: የግሪኩ አገላለጽ ሕጋዊ ኢፍትሐዊነትን ብቻ ሳይሆን ሰፊ ሥነ ምግባራዊ ክፋትንም ሊያመለክት ይችላል። «ዓመፀኛ» ይህን ስፋት ይጠብቃል፤ ቃል በቃል ቅርጹ በማስታወሻ ተገልጧል።
