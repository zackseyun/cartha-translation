    issue: The object of “follow” is marked twice.
    rationale: “እርሱን ይከተለው ነበር” combines an independent accusative object with the object suffix -ው. Removing “እርሱን” produces idiomatic Amharic without changing meaning.
  - severity: medium
    issue: “አመሰገኑ” narrows “gave praise” toward thanking.
    rationale: ἔδωκεν αἶνον refers to offering praise. “ምስጋና ሰጡ” more directly preserves this God-directed praise while remaining natural Amharic.
