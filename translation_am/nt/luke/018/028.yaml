    text: ወይም “የራሳችን የሆኑትን ነገሮች” ወይም “ንብረታችንን።” የግሪኩ አገላለጽ ሰፊ ሲሆን፣ ጴጥሮስና ሌሎቹ የተዉትን ነገር በትክክል አይገልጽም።
