lexical_decisions:
- source_word: Εἶπεν
  choice: አለ
  rationale: የλέγω የትረካ አጠቃቀምን በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: በአማርኛ ትረካ ውስጥ የንግግር ቀጣይነትንና ቀላል ሽግግርን በተፈጥሮ ያሳያል፤ ጠንካራ ተቃርኖን አይጨምርም።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ተናጋሪው ትኩረት የሚስብበትን ኃይል በክብር ያለውና በዘመናዊ አማርኛ የሚታወቅ አገላለጽ ይጠብቃል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪኩ ያለውን ግልጽ ተውላጠ ስምና አጽንዖቱን ይጠብቃል።
- source_word: ἀφέντες
  choice: ትተን
  rationale: የቀደመውን ድርጊት ከዋናው ግስ ጋር በተፈጥሯዊ የአማርኛ ተውሳከ ግስ ያገናኛል፤ ‘ክደን’ የሚለውን ከምንጩ የበለጠ ኃይለኛ ትርጉም አያስገባም።
- source_word: τὰ ἴδια
  choice: የራሳችን የሆነውን
  rationale: ሐረጉ ንብረትን፣ ቤትን ወይም ሌላ የግል የሆነን ነገር ሊያካትት የሚችል ሰፊ ትርጉም አለው፤ ይህ አተረጓጎም ሳያጠብበው ያስተላልፋል።
- source_word: ἠκολουθήσαμέν σοι
  choice: ተከትለንሃል
  rationale: ἀκολουθέω ከተሳቢ ጋር ያለውን ቀጥተኛ የመከተልና የደቀ መዝሙርነት ስሜት በተፈጥሯዊ አማርኛ ይጠብቃል።
