  rationale: የግስ አወቃቀሩ ለተወሰነ ጊዜ የቀጠለውን ፈቃደኛ አለመሆን ያሳያል፤ ይህ አተረጓጎም የፈቃድን ሐሳብ ሳያጠናክር ይጠብቃል።
