  source_fidelity: The draft preserves the question, the inheritance imagery, and the action-oriented formulation of τί ποιήσας ... κληρονομήσω. However, ቸር primarily means kind, generous, or benevolent, and is too narrow for ἀγαθός, whose wording is deliberately taken up in the following verse. መሪ can mean a leader, but ἄρχων here more specifically identifies a person holding authority.
  naturalness: The sentence is fluent modern Amharic. Replacing መሪ with ባለሥልጣን is equally natural in this narrative context, and መልካም መምህር ሆይ is a clear, dignified direct address.
  terminology: Use መልካም for ἀγαθός so that the key term can be consistently retained in Jesus’ response in the next verse. Use ባለሥልጣን for ἄρχων without asserting a specific governmental or religious office. Retain ውረስ/ወርስ for κληρονομέω and የዘላለም ሕይወት for ζωὴ αἰώνιος.
  issues:
  - severity: medium
    issue: “ቸር” renders Διδάσκαλε ἀγαθέ too specifically.
    rationale: ቸር commonly conveys kindness or generosity. ἀγαθός is broader (“good”), and its repetition in the following verse is textually significant; መልካም better preserves that link without interpretive narrowing.
  - severity: low
    issue: “መሪ” is somewhat less precise than ἄρχων.
    rationale: Although “leader” can be acceptable, ባለሥልጣን more directly conveys that the unnamed man is an authority-holder while leaving his exact office unspecified.
  revised_text: አንድ ባለሥልጣንም፣ “መልካም መምህር ሆይ፣ የዘላለምን ሕይወት ለመውረስ ምን ማድረግ አለብኝ?[a]” ሲል ጠየቀው።
