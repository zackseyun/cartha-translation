language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: am
  text: አንድ ባለሥልጣንም፣ “መልካም መምህር ሆይ፣ የዘላለምን ሕይወት ለመውረስ ምን ማድረግ አለብኝ?[a]” ሲል ጠየቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ “ምን አድርጌ የዘላለምን ሕይወት እወርሳለሁ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: ጠየቀው
  rationale: ግሱ በዚህ የትረካ አውድ ‘ጠየቀ’ የሚለውን የተለመደ ትርጉም ይሰጣል፤ የነገሩን መደበኛነትም አያጋንንም።
- source_word: τις ἄρχων
  choice: አንድ መሪ
  rationale: τις ግለሰቡ በስም እንዳልተገለጠ ያሳያል፤ ἄρχων ደግሞ ሥልጣን ወይም የመሪነት ስፍራ ያለውን ሰው ያመለክታል። ‘መሪ’ የሥልጣኑን ዓይነት ሳይወስን ሰፊውን ፍቺ ይጠብቃል።
- source_word: λέγων
  choice: ሲል
  rationale: የግሪኩን ተሳቢ አገላለጽ ከቀጥተኛው ንግግርና ‘ጠየቀው’ ከሚለው ዋና ግስ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: Διδάσκαλε ἀγαθέ
  choice: ቸር መምህር ሆይ
  rationale: ‘መምህር’ የδιδάσκαλοςን የማስተማር ፍቺ በትክክል ይይዛል፤ ‘ቸር’ ደግሞ ኢየሱስ በሚቀጥለው ቁጥር የሚያነሣውን ἀγαθός የሚለውን ቁልፍ ቃል ግልጽና ክብር ባለው አገላለጽ ይጠብቃል።
- source_word: τί ποιήσας
  choice: ምን ማድረግ አለብኝ
  rationale: የአኦሪስት ተሳቢው ከወደፊት ግሱ ጋር የሚገልጠውን ቅድመ ሁኔታ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ቃል በቃል አወቃቀሩ በማስታወሻው ተጠብቋል።
- source_word: ζωὴν αἰώνιον
  choice: የዘላለምን ሕይወት
  rationale: በሉቃስ አውድ የተመሰረተውንና በአማርኛ ግልጽ የሆነውን ‘eternal life’ አገላለጽ ይሰጣል።
- source_word: κληρονομήσω
  choice: ለመውረስ
  rationale: ግሱ ያለውን የርስት ምስል ይጠብቃል፤ ‘ማግኘት’ ብሎ በአጠቃላይ አያለዝበውም።
theological_decisions:
- issue: የዘላለም ሕይወትን ከሰው ድርጊት ጋር አያይዞ የቀረበው ጥያቄ
  choice: የዘላለምን ሕይወት ለመውረስ ምን ማድረግ አለብኝ?
  alternative: ምን አድርጌ የዘላለምን ሕይወት እወርሳለሁ?
  rationale: ጽሑፉ የመሪውን ጥያቄ በሚፈለግ ድርጊት መልክ ያቀርባል። ትርጉሙ ይህን የጠያቂውን አቀራረብ እንዳለ ይጠብቃል እንጂ አያጸድቀውም፣ አያለዝበውምም፣ ከሌላ የነገረ መለኮት ማብራሪያም አያስገባበትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሆይ’ በቀጥተኛ አድራሻው ላይ የሚገባውን ክብር ይሰጣል፤ የሥልጣን ቦታውን ከጽሑፉ በላይ ላለመወሰን ‘መሪ’ ተመርጧል።
