  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: am
  text: ገርፈውም ይገድሉታል፤ በሦስተኛውም ቀን ይነሣል[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሞት ያስነሡታል»። የግሪኩ ቀጥተኛ አገላለጽ «ይነሣል» የሚል ነው።
