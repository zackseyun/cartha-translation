lexical_decisions:
- source_word: μαστιγώσαντες
  choice: ገርፈውም
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ከዋናው ግስ በፊት የሚፈጸምን ድርጊት ያመለክታል። «ገርፈው» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን የድርጊቱን ጭካኔ ያለ ጥንታዊ አነጋገር ያስተላልፋል።
- source_word: ἀποκτενοῦσιν
  choice: ይገድሉታል
  rationale: የወደፊት ጊዜ የብዙ ቁጥር ግስ ነው፤ ተዋናዮቹ ከዐውደ ንባቡ ይታወቃሉ። «ይገድሉታል» ቀጥተኛውን የቃሉን ትርጉም ይጠብቃል፤ «ይገድሉታል»ን በ«ይገድሉታል» ብቻ ማቅረብ ተጨማሪ የሕግ ወይም የሞራል ፍርድ አያስገባም።
- source_word: αὐτόν
  choice: -ታል (እርሱን)
  rationale: ቀጥተኛ ተሳቢው በአማርኛ በግሱ ላይ በተያያዘው «-ት-» የተገለጸ ሲሆን፣ በዐውደ ንባቡ የሰው ልጅን/ኢየሱስን ያመለክታል። የተለየ «እርሱን» መጨመር በአማርኛ አላስፈላጊ አጽንዖት ይፈጥራል።
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: በሦስተኛውም ቀን
  rationale: የጊዜ ዳቲቭ በአማርኛ «በ...ቀን» ተብሎ በተፈጥሮ ይተረጎማል። «ሦስተኛው» የግሪኩን ተራ ቁጥር በትክክል ይጠብቃል።
- source_word: ἀναστήσεται
  choice: ይነሣል
  rationale: ይህ የወደፊት ጊዜ መካከለኛ ቅርጽ በዚህ ዐውድ ኢ-ተሻጋሪ ትርጉም አለው። «ይነሣል» የግሪኩን «ይነሣል/ተነሥቶ ይቆማል» አቀራረብ በቀጥታ ይጠብቃል፤ በዐውደ ንባቡም ከሞት መነሣቱ ግልጽ ነው።
theological_decisions:
