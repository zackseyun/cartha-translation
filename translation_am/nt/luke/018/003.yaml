    text: ወይም፣ “ከባላጋራዬ ፍትሕ አድርግልኝ” ወይም “መብቴን በባላጋራዬ ላይ አስከብርልኝ።” የግሪኩ ግስ የሕግ ፍትሕ ማስገኘት ወይም በፍርድ መብትን ማስከበር ሊያመለክት ይችላል፤ የግል በቀልን ብቻ አያመለክትም።
