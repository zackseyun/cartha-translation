base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: am
  text: ነገር ግን ቀረጥ ሰብሳቢው ከሩቅ ቆሞ፣ ዓይኖቹን ወደ ሰማይ ለማንሳት እንኳ አልወደደም፤ ይልቁንም ደረቱን እየደቃ እንዲህ አለ፦ ‘እግዚአብሔር ሆይ፣ እኔን፣ ኃጢአተኛውን ማረኝ።’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእኔ ሞገስ አሳይ።” የግሪኩ ግስ ከሥርየትና ከመለኮታዊ ሞገስ ቋንቋ ጋር የተያያዘ ነው።
    reason: lexical_alternative
lexical_decisions:
