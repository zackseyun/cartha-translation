- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: ደረቱን እየደቃ
  rationale: የኢምፐርፌክት ግሱን ቀጣይነት ወይም ድግግሞሽ ያሳያል፤ የሐዘንና የንስሐ ምልክቱንም በዘመናዊ ቃል ያቀርባል።
- source_word: ἱλάσθητί μοι
  choice: ይቅር በለኝ
  rationale: በቀጥተኛ ጸሎት ውስጥ ግልጽና የተለመደ አማርኛ ነው፤ ከማስተሰረይና ከማስታረቅ ቋንቋ ጋር ያለው ጥልቅ የቃል ግንኙነት በማስታወሻ ተጠብቋል።
- source_word: τῷ ἁμαρτωλῷ
  choice: እኔን ኃጢአተኛውን
  rationale: የግሪኩን የተወሰነ አንቀጽና የራስን ኃጢአተኝነት አጽንዖት ይጠብቃል፤ ‘ኃጢአተኛ የሆንሁትን እኔን’ የሚለውን ሐሳብ በተጨመቀ መልኩ ይሰጣል።
theological_decisions:
- issue: ἱλάσθητί μοι የሚለውን የመለኮታዊ ሞገስ ጸሎት እንዴት መተርጎም እንደሚገባ
  choice: ይቅር በለኝ
