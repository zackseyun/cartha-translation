  choice: ቀረጥ ሰብሳቢ
  rationale: በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን፣ በወንጌላት አውድ የነበረውን ማኅበራዊ ነቀፋም ያስተላልፋል።
- source_word: μακρόθεν ἑστὼς
  choice: ከሩቅ ቆሞ
