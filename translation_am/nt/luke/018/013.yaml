- source_word: οὐκ ἤθελεν οὐδὲ
  choice: እንኳ አልወደደም
  rationale: θέλω የፈቃድ ወይም የመሻት ሐሳብ እንጂ ያለመቻልን እንደማያመለክት ይጠብቃል።
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: ዓይኖቹን ወደ ሰማይ ለማንሳት
