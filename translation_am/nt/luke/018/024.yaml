base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: am
  text: ኢየሱስም እርሱን አይቶ፣ “ሀብት[a] ላላቸው ሰዎች ወደ እግዚአብሔር መንግሥት መግባት እንዴት አስቸጋሪ ነው!” አለ።
  philosophy: optimal-equivalence
  footnotes:
