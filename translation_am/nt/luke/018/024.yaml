  alternative: ሀብት ያለው ሰው መግባቱ ፈጽሞ የማይቻል ነው የሚል ፍጹም አባባል
  rationale: ግሪኩ ‘እንዴት ከባድ’ ይላል እንጂ በዚህ ቁጥር ‘የማይቻል’ አይልም። ትርጉሙ የጽሑፉን ውጥረት ይጠብቃል እንጂ ቀጣዩን አውድ ቀድሞ አይተረጉምም።
