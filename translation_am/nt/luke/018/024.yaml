lexical_decisions:
- source_word: Ἰδὼν
  choice: አይቶ
  rationale: የግሪኩን የአኦሪስት አንቀጽ ቅርጽ በተፈጥሯዊ አማርኛ ይገልጣል፤ ማየቱ ከመናገሩ ጋር ያለውን ቅደም ተከተልም ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: በዚህ ስፍራ δέ ትረካውን በለስላሳ ሁኔታ የሚያስቀጥል አያያዥ ነው፤ ከ‘ኢየሱስ’ ጋር የተያያዘው ‘-ም’ በአማርኛ ይህን ተግባር በተፈጥሯዊ ሁኔታ ይፈጽማል።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: በአውዱ ውስጥ የተጠቀሰውን ባለጠጋ መሪ የሚያመለክት ቀጥተኛ ተውላጠ ስም ነው።
- source_word: Πῶς δυσκόλως
  choice: እንዴት ከባድ ነው
  rationale: የግሪኩን የድንቅና የደረጃ አገላለጽ በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃሉን ‘የማይቻል’ ብሎ አያጠናክረውም።
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ሀብት ያላቸው
  rationale: χρήματα ገንዘብን ብቻ ሳይሆን ንብረትንና ሀብትን በሰፊው ሊያመለክት ስለሚችል፣ ‘ሀብት’ የአውዱን ስፋት ይጠብቃል፤ ‘ያላቸው’ ደግሞ የግሪኩን አሳታፊ ቅርጽ ያንጸባርቃል።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ወደ እግዚአብሔር መንግሥት
  rationale: የመግባትን አቅጣጫ እና የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ በግልጽ ይጠብቃል።
- source_word: εἰσπορεύονται
  choice: መግባት
  rationale: ከ‘ከባድ ነው’ ጋር የተዋሃደው የማድረጊያ ስም ቅርጽ በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን ‘ወደ ውስጥ መግባት’ ትርጉም ይጠብቃል።
theological_decisions:
- issue: ባለሀብቶች ወደ እግዚአብሔር መንግሥት ስለመግባታቸው የኢየሱስ ንግግር ኃይል
