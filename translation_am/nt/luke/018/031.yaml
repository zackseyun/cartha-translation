- source_word: ἀναβαίνομεν
  choice: እየወጣን ነው
  rationale: ወደ ኢየሩሳሌም የሚደረገውን ጉዞ እንደ መውጣት የሚገልጸውን አቅጣጫዊ ኃይልና የአሁን ጊዜውን ትርጉም ይጠብቃል።
- source_word: τελεσθήσεται
  choice: ይፈጸማል
