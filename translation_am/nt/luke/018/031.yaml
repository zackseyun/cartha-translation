lexical_decisions:
- source_word: Παραλαβὼν
  choice: ወደ ጎን ወስዶ
  rationale: παραλαμβάνω በመሠረቱ አብሮ መውሰድን ያመለክታል፤ በዚህ አውድ ግን አሥራ ሁለቱን ለየት አድርጎ ለማነጋገር መውሰዱን በተፈጥሯዊ አማርኛ ያሳያል። ቃሉ “ወደ ጎን” ብሎ በግልጽ ስለማይናገር አማራጩ በማስታወሻ ተጠብቋል።
- source_word: τοὺς δώδεκα
  choice: አሥራ ሁለቱን
  rationale: ግሪኩ “ደቀ መዛሙርት” የሚለውን አይጨምርም፤ የታወቀውን የቡድኑን መጠሪያ እንዳለ ይጠብቃል።
- source_word: Ἰδοὺ
