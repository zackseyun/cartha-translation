- source_word: πάντα τὰ γεγραμμένα
  choice: የተጻፈው ሁሉ
  rationale: πάντα የሚገልጸውን ሙሉነትና γεγραμμένα የሚያመለክተውን የተጻፈ ሁኔታ በተፈጥሯዊ አማርኛ ይጠብቃል።
