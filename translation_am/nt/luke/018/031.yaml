  choice: ሰው ልጅ
  alternative: ሰብአዊው
  rationale: “ሰው ልጅ” የግሪኩን ቅርጽና ከዳንኤል ጋር ሊኖረው የሚችለውን ጽሑፋዊ ግንኙነት ይጠብቃል፤ ማዕረጉን ወደ አጠቃላይ ሰብአዊ መግለጫ አያሳንስም።
- issue: τῷ υἱῷ τοῦ ἀνθρώπου የሚለው ዳቲቭ ግንኙነት
  choice: ስለ ሰው ልጅ
  alternative: ለሰው ልጅ
  rationale: በአውዱ “የተጻፈው” ከሚለው ጋር የይዘት ወይም የማጣቀሻ ግንኙነት መሆኑ ይበልጥ ተፈጥሯዊ ነው። ሆኖም የግሪኩ ዳቲቭ “ለሰው ልጅ” ተብሎ በቀጥታ ሊተረጎም የሚችል የቅርጽ አሻሚነት አለው።
