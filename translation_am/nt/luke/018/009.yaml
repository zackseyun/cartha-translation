base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: am
  text: እርሱም ራሳቸው ጻድቃን መሆናቸውን በሚተማመኑና የቀሩትን ሰዎች ለሚንቁ አንዳንዶች ይህን ምሳሌ ተናገረ፦[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የቀሩትን ሰዎች የሚናቁ» / «የቀሩትን ሰዎች ዝቅ አድርገው የሚያዩ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: ተናገረ
  rationale: ከ«ይህን ምሳሌ» ጋር በአማርኛ ተፈጥሯዊ ሲሆን፣ የλέγωን የንግግር ኃይል ይጠብቃል።
- source_word: δὲ καὶ
  choice: እርሱም
  rationale: δὲ የትረካ አያያዥ ሲሆን καὶ የመደመርን ሐሳብ ይሰጣል፤ በአማርኛ «-ም» ሁለቱንም በቀላሉ ያሳያል።
- source_word: πρός τινας
  choice: ለ...አንዳንዶች
  rationale: ከንግግር ግስ ጋር πρός ንግግሩ የተነገረላቸውን ሰዎች ያመለክታል።
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: ራሳቸውን በመተማመን
  rationale: ፍጹም አንቀጸ ግሱ የጸና የራስ መተማመንን ያመለክታል፤ አገላለጹም ራስን የመደገፍ ትኩረቱን ይጠብቃል።
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: ጻድቃን እንደሆኑ ለሚያስቡ
  rationale: ὅτι እዚህ የመተማመናቸውን ይዘት ያሳያል፤ «ጻድቃን» የδίκαιοιን ሥነ ምግባራዊና ሃይማኖታዊ ትርጉም ይጠብቃል። «ለሚያስቡ» በአማርኛ ይህን ራስን የመገምገም ሐሳብ ተፈጥሯዊ ያደርገዋል።
- source_word: ἐξουθενοῦντας
  choice: ለሚንቁ
  rationale: ግሱ ሌሎችን ከንቱ አድርጎ መቁጠርን፣ መናቅን ወይም ዝቅ አድርጎ ማየትን ይገልጣል፤ «መናቅ» አጭርና ቀጥተኛ ነው።
- source_word: τοὺς λοιπούς
  choice: ሌሎቹን ሁሉ
  rationale: «ቀሪዎቹን/ሌሎቹን በሙሉ» የሚለውን የቡድን ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν παραβολὴν ταύτην
  choice: ይህን ምሳሌ
  rationale: «ምሳሌ» ለወንጌላት παραβολή የተለመደና ዘውጉን የሚያስታውቅ ትርጉም ነው።
theological_decisions:
- issue: በራስ ጽድቅ አውድ ውስጥ δίκαιοιን መተርጎም
  choice: ጻድቃን
  alternative: ትክክለኞች / ፍትሐውያን
  rationale: ግሪኩ ራሱ አሉታዊ ቅጽ አይጠቀምም። «ጻድቃን» ቁልፍ መጽሐፍ ቅዱሳዊ ቃሉን ይጠብቃል፤ ትችቱንና ምጸቱን አውዱ እንዲያሳይ ይተዋል።
