  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: am
  text: እነርሱም ከእነዚህ ነገሮች አንዳችም አልተረዱም፤ ይህም ንግግር[a] ከእነርሱ ተሰውሮ ነበር[b]፤ የተነገሩትንም[c] አላወቁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ይህ ቃል» ወይም «ይህ መልእክት» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «ከእነርሱ ተሰውሮ ነበር» የሚለው ተገብሮ አገላለጽ ማን ወይም ምን እንደሰወረው አይገልጽም።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ «እየተነገሩ ያሉትን ነገሮችም አልተረዱም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: አልተረዱም
  rationale: በዚህ አውድ የኢየሱስን ቀደም ያለ ትንቢታዊ ንግግር በአእምሮ አለመገንዘባቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὐδὲν τούτων
  choice: ከእነዚህ ነገሮች አንዳችም
  rationale: ወደ ቀደሙት በርካታ ንግግሮች የሚመለሰውን ብዙ ቁጥር ጠብቆ ሙሉ አለመረዳትን ያሳያል።
- source_word: τὸ ῥῆμα τοῦτο
  choice: ይህ ንግግር
  rationale: ῥῆμα ቃልን፣ ንግግርን ወይም መልእክትን ሊያመለክት ይችላል፤ «ንግግር» በአውዱ ተፈጥሯዊ ሲሆን የተነገረ ሐሳብን ይይዛል።
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: ከእነርሱ ተሰውሮ ነበር
  rationale: የፍጹም ተገብሮ አካል የሚያሳየውን ቀጣይ ሁኔታ ይጠብቃል፤ የሰወረውን አካልም አይገልጽም።
- source_word: ἐγίνωσκον
  choice: አላወቁም
  rationale: ከመጀመሪያው συνῆκαν («አልተረዱም») የሚለየውን የቃላት ልዩነት ጠብቆ፣ በአውዱ ግን የተነገረውን አለመገንዘብ ያመለክታል።
- source_word: τὰ λεγόμενα
  choice: የተነገረውን
  rationale: የንግግሩን ይዘት በተፈጥሯዊና አጭር አማርኛ ይገልጻል፤ በቃል ቅርብ ሲተረጎም «እየተነገሩ ያሉትን ነገሮች» ሊባል ይችላል።
theological_decisions:
- issue: የደቀ መዛሙርቱ አለመረዳትና የንግግሩ መሰወር
  choice: ጽሑፉ የሚያቀርበውን ሦስት እጥፍ የአለመገንዘብ መግለጫ ማቆየትና የሰወረውን አካል አለመግለጽ
  alternative: መሰወሩን በግልጽ የእግዚአብሔር ድርጊት አድርጎ መተርጎም፣ ወይም ተራ ሥነ ልቦናዊ ግራ መጋባት ብቻ አድርጎ መግለጽ
  rationale: የግሪኩ ተገብሮ አገላለጽ ድርጊቱን ያደረገውን አይጠቅስም፤ ትርጉሙም ይህን እውነተኛ ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሦስቱ ተከታታይ አረፍተ ነገሮች የሉቃስን አጽንዖት ለማቆየት በሰረዝ ነጥብ ተለያይተዋል።
