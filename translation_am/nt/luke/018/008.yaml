  terminology: ‘የሰው ልጅ’ and ‘እምነት’ are appropriate established renderings. The πίστις footnote suitably preserves ‘መታመን’ and ‘ታማኝነት.’ The first footnote should not characterize vindication as proving that the beneficiaries are free of wrongdoing, since the Greek denotes justice/vindication on their behalf.
