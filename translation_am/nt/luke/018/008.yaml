  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: am
  text: እላችኋለሁ፤ ፈጥኖ ፍትሕ ያደርግላቸዋል[a]። ይሁን እንጂ፣ የሰው ልጅ በሚመጣበት ጊዜ በምድር ላይ በእውነት እምነትን ያገኝ ይሆን?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍርድ ይሰጣቸዋል” ወይም “መብታቸው በፍርድ እንዲረጋገጥ ያደርጋል።” የግሪኩ አገላለጽ ለአንድ ሰው ፍትሕ መደረጉን ወይም በፍርድ መብቱ መረጋገጡን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “እምነት” የተተረጎመው የግሪክ ቃል “መታመን” ወይም “ታማኝነት” የሚል ትርጉምም ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: ፍትሕ ያስገኝላቸዋል
  rationale: በግፍ ለተጎዱት ፍትሕ የማድረግንና በፍርድ የማብቃትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የበቀልን ትርጉም አያጠናክርም።
- source_word: ἐν τάχει
  choice: ፈጥኖ
  rationale: ድርጊቱ ያለ መዘግየትና በፍጥነት እንደሚፈጸም ያሳያል፤ የተወሰነ የጊዜ ሰሌዳ አይጭንም።
- source_word: πλὴν
  choice: ይሁን እንጂ
  rationale: ከፍትሕ ተስፋው ወደሚከተለው መርማሪ ጥያቄ ያለውን ጠንካራ የንጽጽር ሽግግር ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የተለመደ ራስ-መጠሪያና ከዳንኤል 7 ጋር ያለውን ትስስር የሚጠብቅ የተቀበለ አተረጓጎም ነው።
- source_word: ἐλθὼν
  choice: በሚመጣበት ጊዜ
  rationale: የግሪኩን አሳታፊ ግስ ጊዜያዊ ግንኙነት ‘ሲመጣ’ በሚል ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἆρα
  choice: በእውነት … ይሆን?
  rationale: የጥያቄውን መርማሪና አሰላሳይ ኃይል በአማርኛ ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τὴν πίστιν
  choice: እምነትን
  rationale: የπίστιςን ሰፊ የእምነት፣ የመታመንና የታማኝነት ክልል ሳያጠብ በዋናው ጽሑፍ የተለመደውን ቃል ይጠቀማል።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድር ላይ
  rationale: በዐውዱ ያለውን ሰፊ የዓለም አቀፍ ስፋት በቀጥተኛና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: πίστις እዚህ ‘እምነት’፣ ‘መታመን’ ወይም ‘ታማኝነት’ ማለት ሊሆን መቻሉ
  choice: እምነት
  alternative: መታመን፤ ታማኝነት
  rationale: ‘እምነት’ የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ ዐውዱ በጸሎት የሚገለጥ ጽኑ መታመንን ሊያመለክት ቢችልም ትርጉሙ በዋናው ጽሑፍ በአንድ አቅጣጫ አልተገደበም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥያቄው አሰላሳይ ቃናና የπίστις ትርጉማዊ ስፋት ተጠብቀዋል።
