lexical_decisions:
- source_word: σταθεὶς
  choice: ቆሞ
  rationale: የἵστημι የአንድ ጊዜ አድራጊ ክፍለ ግስ ሲሆን በዚህ አውድ ኢየሱስ መሄዱን አቁሞ መቆሙን ያመለክታል፤ «ቆሞ» ይህን በተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: δὲ
