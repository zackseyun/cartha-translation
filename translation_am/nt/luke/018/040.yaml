  rationale: κελεύω ትእዛዝ መስጠትን ያመለክታል፤ «አዘዘ» የግሱን ሥልጣናዊ ኃይል በግልጽና ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀχθῆναι
  choice: እንዲያመጡት
  rationale: የἄγω ተደራጊ የማይወሰን ግስ ሲሆን ሌሎች ሰውየውን ወደ ኢየሱስ እንዲያቀርቡት ያመለክታል፤ አማርኛ ንቁ ቅርጹን በአጠቃላይ ባለቤት «እንዲያመጡት» በተፈጥሮ ይገልጣል።
- source_word: πρὸς αὐτόν
  choice: ወደ እርሱ
  rationale: πρός ከተሳቢ ጋር ወደ ኢየሱስ የሚደረግን እንቅስቃሴ ያመለክታል፤ «ወደ እርሱ» ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: እርሱም በቀረበ ጊዜ
  rationale: የἐγγίζω የገዢ ቅጽ ፍጹም ክፍለ ግስ ጊዜያዊ ግንኙነትን ያሳያል፤ ተውላጠ ስሙ ከፊት የተጠቀሰውን ሰው ያመለክታል።
- source_word: ἐπηρώτησεν αὐτόν
  choice: ጠየቀው
  rationale: ἐπερωτάω በዚህ አውድ «መጠየቅ» ማለት ነው፤ «ጠየቀው» ጠያቂውንና ተጠያቂውን በአማርኛ ግስ ውስጥ በተፈጥሮ ያሳያል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
