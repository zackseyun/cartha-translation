  terminology: «ኢየሱስ», «ቆሞ», «አዘዘ», «እንዲያመጡት», and «ጠየቀው» are appropriate. The footnote’s alternative «እንዲመሩት» accurately reflects the possible nuance of ἄγω and is correctly anchored to the translated infinitive.
  issues:
