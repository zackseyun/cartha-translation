- source_word: ὃς
  choice: እንደሚቀበል
  rationale: አንቀጹ የቀደመውን ጥቅስ የሚቀጥል አንጻራዊ ሐረግ ነው፤ በአማርኛ የአንጻራዊ ግስ ቅርጽ ተወክሏል።
