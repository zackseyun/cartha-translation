  language: am
  text: በዚህ ጊዜ[a] ብዙ እጥፍ፣ በሚመጣውም ዘመን የዘላለም ሕይወት የማይቀበል የለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚህ ዘመን»።
