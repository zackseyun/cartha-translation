lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: እንደሚቀበል … እርግጥ ነው
  rationale: ከአኦሪስት ሳብጃንክቲቭ ጋር የመጣው አጽንዖታዊ አሉታ ድርጊቱ እንደማይቀር ያረጋግጣል፤ በአማርኛ ተፈጥሯዊ በሆነው «እርግጥ ነው» ተገልጧል።
- source_word: ἀπολάβῃ
  choice: እንደሚቀበል
  rationale: በዐውዱ የሚሰጠውን ብድራት ወይም ተመላሽ ስጦታ ያመለክታል፤ «ይቀበላል» የቅድመ ቅጥያውን ኃይል ሳያጋንን ተፈጥሯዊ ነው።
- source_word: πολλαπλασίονα
  choice: እጅግ ብዙ እጥፍ
  rationale: የተባዛ ብድራትን በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: καιρῷ τούτῳ
  choice: በዚህ ዘመን
  rationale: καιρός የተወሰነ ጊዜን ወይም ወቅትን ያመለክታል፤ ከሚመጣው αἰών ጋር ያለውን ንጽጽር ለማሳየት «ዘመን» ተመርጧል።
- source_word: αἰῶνι τῷ ἐρχομένῳ
  choice: በሚመጣው ዘመን
  rationale: የግሪኩን የአሁንና የሚመጣው ዘመን ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
