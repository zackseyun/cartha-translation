  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: am
  text: ኢየሱስ ግን ሕፃናቱን ወደ እርሱ ጠርቶ፣ “ሕፃናቱ ወደ እኔ እንዲመጡ ፍቀዱላቸው፤ አትከልክሏቸውም፤ የእግዚአብሔር መንግሥት የእንደ እነዚህ ዓይነት ሰዎች ናትና።[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ “የእግዚአብሔር መንግሥት የእንደ እነዚህ ያሉት ናት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: ሕፃናቱን ወደ እርሱ ጠርቶ
  rationale: የግሱን ወደ ራስ የመጥራት አቅጣጫ በተፈጥሯዊ አማርኛ ያሳያል፤ ተውላጠ ስሙ የሚያመለክታቸውን ሕፃናት ግልጽ ያደርጋል።
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: ሕፃናቱ ወደ እኔ እንዲመጡ ፍቀዱላቸው
  rationale: ἄφετε በዚህ አውድ ‘ፍቀዱ’ ማለት ሲሆን፣ የመጣትን አቅጣጫ ‘ወደ እኔ’ በቀጥታ ይጠብቃል።
- source_word: μὴ κωλύετε αὐτά
  choice: አትከልክሏቸውም
  rationale: κωλύω ያለውን የመከልከል ወይም የማደናቀፍ ሰፊ ትርጉም ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: τῶν τοιούτων
  choice: እንደ እነዚህ ላሉት
  rationale: ንግግሩ በቦታው ያሉትን ሕፃናት ብቻ ሳይሆን እነርሱን የሚመስሉትንም እንደሚያካትት ያሳያል፤ የሚመስሉበትን ባሕርይ ግን አይወስንም።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደና የግሪኩን ሐረግ በቀጥታ የሚያስተላልፍ አገላለጽ ነው።
theological_decisions:
- issue: የτῶν τοιούτων ወሰን
  choice: “እንደ እነዚህ ላሉት” በማለት ሕፃናቱ የሚወክሉትን ሰፊ ወገን ማመልከት
  alternative: ንግግሩን በዚያ በነበሩት ሕፃናት ብቻ መወሰን
  rationale: τοιοῦτος ከተጠቀሱት ግለሰቦች አልፎ እንደነርሱ ያሉትን ያመለክታል፤ ጥቅሱ ግን የትኛውን የሕፃንነት ባሕርይ እንደሚያስብ በዚህ ቦታ አይገልጽም።
- issue: የግዛት/ዝምድና ግንኙነት በτῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: “መንግሥት ... ላሉት ናት” በማለት የመንግሥቱን ለእነርሱ መሆን መግለጽ
  alternative: በቃል ቅርብ “የእንደነዚህ ናት” ማለት
  rationale: የግሪኩን ጄኒቲቭ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ትርጉሙን ወደ አንድ ዝርዝር የሥነ መለኮት አቋም አይገድብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ሕፃናት” የπαιδίαን ወጣት ልጆች ማመልከት በተፈጥሯዊ ሁኔታ ይይዛል።
