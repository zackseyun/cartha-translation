  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: am
  text: እንዲህ አለ፦ “በአንዲት ከተማ እግዚአብሔርን የማይፈራና ለሰውም ደንታ የሌለው አንድ ዳኛ ነበር።[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለማንም ደንታ የሌለው” ወይም “ሰዎችንም የማያከብር።” የግሪኩ ጽሑፍ “ሰው” የሚለውን ነጠላ ቃል በአጠቃላይ ትርጉም ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ አለ
  rationale: የግሪኩ የአሁን ጊዜ ቦዝ አንቀጽ ምሳሌውን የሚያስተዋውቅ ሲሆን፣ ከቀደመው ቁጥር ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ “እንዲህ አለ” ያሳያል።
- source_word: Κριτής τις
  choice: አንድ ዳኛ
  rationale: τις ሰውየውን ሳይሰይም የታሪኩን ገጸ ባሕርይ ያስተዋውቃል፤ “አንድ ዳኛ” በአማርኛ ምሳሌያዊ ትረካ ውስጥ ተፈጥሯዊ ነው።
- source_word: ἦν ἔν τινι πόλει
  choice: በአንዲት ከተማ … ነበር
  rationale: የሕልውና አገላለጹንና ያልተወሰነውን ከተማ በተፈጥሯዊ የአማርኛ ትረካ ይገልጣል።
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: እግዚአብሔርን የማይፈራ
  rationale: “መፍራት” የሚለው ቃል የግሪኩን ሃይማኖታዊና ሥነ ምግባራዊ ክብደት ይጠብቃል፤ የአማርኛው አንጻራዊ ሐረግ ባሕርይውን እንደ ቋሚ ጠባይ ያቀርባል።
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: ለሰውም ደንታ የሌለው
  rationale: ἐντρέπομαι በዚህ አውድ ለሌሎች መጨነቅ፣ ግድ መስጠት ወይም ክብር ማሳየትን ያመለክታል። “ለሰው ደንታ የሌለው” ነጠላውን አጠቃላይ ἄνθρωπον ጠብቆ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: ነጠላ አጠቃላይ ἄνθρωπον ከእግዚአብሔር ጋር የተነጻጸረበት አገላለጽ
  choice: ለሰውም ደንታ የሌለው
  alternative: ለማንም ደንታ የሌለው፤ ሰዎችንም የማያከብር
  rationale: ዋናው ጽሑፍ የግሪኩን ነጠላ አጠቃላይ ስምና “እግዚአብሔር/ሰው” ንጽጽር ይጠብቃል፤ አገላለጹ ወንድን ብቻ እንደሚያመለክት እንዳይሰማም በእግር ማስታወሻ ትርጉሙ ተገልጿል።
- issue: ἐντρέπομαι የሚያሳየው የክብር፣ የኀፍረት ወይም የግድ ዘርፍ
  choice: ደንታ የሌለው
  alternative: የማያከብር፤ በሰው ፊት የማያፍር
  rationale: በአውዱ ዳኛው ለሰው ጥያቄና አስተያየት ምንም ግድ እንደማይሰጠው ዋና ሐሳብ ነው። “ደንታ የሌለው” ይህን በተፈጥሯዊ ሁኔታ ይገልጣል፣ የክብር ትርጉሙም በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተጠቅሟል። “አንድ ዳኛ” እና “በአንዲት ከተማ” የምሳሌውን ያልተወሰነ ቅርጽ ያስቀራሉ፤ “ደንታ የሌለው” ደግሞ ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን አክብሮት የማጣትን ሐሳብ ይይዛል።
