    issue: The second footnote gives ‘እንዳትበረታብኝ’ as a figurative alternative.
    rationale: 'This expression means roughly ‘lest she overpower me’ and does not clearly express the idiomatic sense of ὑπωπιάζῃ here: wearing the judge down by repeated appeals. Replacing it with ‘እንዳትደክመኝ’ preserves the intended sense without introducing a different nuance.'
