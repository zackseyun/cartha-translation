id: LUK.18.5
reference: Luke 18:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: am
  text: ነገር ግን ይህች መበለት ዘወትር ስለምታስቸግረኝ፣ ፍትሕ እሰጣታለሁ[a]፤ ያለማቋረጥ እየመጣች እንዳታደክመኝ[b]።’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ፍትሕ እሰጣታለሁ” የሚለው “ፍትሕ አደርግላታለሁ” ወይም “እበቀልላታለሁ” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን የሕግ ፍትሕ ማስገኘትን ያመለክታል።
    reason: alternative_reading
  - marker: b
    text: የግሪክኛው ቃል በቀጥታ “ከዓይኔ በታች እንዳትመታኝ” ማለት ሊሆን ይችላል፤ እዚህ ግን “እንዳታደክመኝ” ወይም “እንዳትደክመኝ” የሚል ፈሊጣዊ ትርጉም አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: ዘወትር ስለምታስቸግረኝ
  rationale: διά with the articular infinitive is causal, while γε adds emphasis. The present infinitive conveys ongoing trouble; this Amharic wording expresses both the cause and repeated action naturally.
- source_word: τὴν χήραν ταύτην
  choice: ይህች መበለት
  rationale: Preserves both the demonstrative and the explicit identification of the socially vulnerable widow.
- source_word: ἐκδικήσω αὐτήν
  choice: ፍትሕ እሰጣታለሁ
  rationale: In the legal setting, the verb denotes granting justice or vindication rather than necessarily taking revenge.
- source_word: εἰς τέλος ἐρχομένη
  choice: ያለማቋረጥ እየመጣች
  rationale: Conveys the repeated, continuing coming that provokes the judge, while avoiding the less likely temporal sense 'in the end' in the main text.
- source_word: ὑπωπιάζῃ με
  choice: እንዳታደክመኝ
  rationale: The vivid verb literally evokes striking beneath the eye, but in this context naturally communicates wearing someone down through persistent pressure.
theological_decisions:
- issue: The legal sense of ἐκδικήσω in the parable
  choice: ፍትሕ እሰጣታለሁ
  alternative: እበቀልላታለሁ / እንደ ንጹሕ አረጋግጣታለሁ
  rationale: The widow seeks judicial redress. The chosen wording preserves the passage's theme of justice without imposing a retaliatory sense or narrowing it to a declaration of innocence.
- issue: Whether ὑπωπιάζῃ should be understood literally or figuratively
  choice: እንዳታደክመኝ
  alternative: ከዓይኔ በታች እንዳትመታኝ
  rationale: The figurative sense fits the repeated petitions and the judge's exasperation, while the footnote preserves the verb's striking literal image and genuine ambiguity.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; dignified but readily understandable. “ዘወትር ስለምታስቸግረኝ” and “ያለማቋረጥ እየመጣች” preserve the ongoing pressure without sounding archaic. Footnote markers are aligned with the expressions they explain.
