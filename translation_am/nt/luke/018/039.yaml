  to: ከፊት የሚሄዱትም ዝም እንዲል ይገሥጹት ነበር፤ እርሱ ግን፣ “የዳዊት ልጅ ሆይ፣ ማረኝ!” እያለ እጅግ ይበልጥ ይጮኽ ነበር።
