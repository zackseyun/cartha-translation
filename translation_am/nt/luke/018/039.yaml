  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: am
  text: ከፊት የሚሄዱትም ዝም እንዲል ይገሥጹት ነበር፤ እርሱ ግን፣ “የዳዊት ልጅ ሆይ፣ ማረኝ!” እያለ እጅግ ይበልጥ ይጮኽ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ከፊት የሚሄዱት
  rationale: ስማዊ ሆኖ የቀረበውን የአሁን ጊዜ አድራጊ ቦዝ አንቀጽ እና የቦታ ቅድምናውን ይጠብቃል፤ የመሪነት ሚናም አይጨምርም።
- source_word: ἐπετίμων αὐτῷ
  choice: ገሠጹት
  rationale: ἐπιτιμάω የሚያመለክተውን ጠንካራ ወቀሳ ያስተላልፋል። የግሪኩ ኢምፐርፌክት ቀጣይነት በአማርኛው ዐውደ ንባብ በዓላማ አንቀጹና በተከታዩ ተቃራኒ ድርጊት ይታያል።
- source_word: ἵνα σιγήσῃ
  choice: ዝም እንዲል
  rationale: የἵνα ዓላማን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ዝምታን እንጂ ድምፅን ብቻ መቀነስን አያመለክትም።
- source_word: αὐτὸς δὲ
  choice: እርሱ ግን
  rationale: የተውላጠ ስሙን አጽንዖትና ከሕዝቡ ተግባር ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: πολλῷ μᾶλλον
  choice: ከበፊቱ እጅግ አብልጦ
  rationale: የንጽጽር ማጠናከሪያውን ይጠብቃል፤ ‘ይበልጥ ጮክ ብሎ’ በማለት በግሪኩ በቀጥታ ያልተጠቀሰውን የድምፅ ከፍታ አይጨምርም።
- source_word: ἔκραζεν
  choice: እያለ ... ጮኸ
  rationale: ጮኸ የκράζωን ኃይለኛ ጥሪ ያስተላልፋል፤ ‘እያለ’ ከአብልጦ ጋር ሆኖ የኢምፐርፌክቱን ቀጣይነትና ጽናት ያሳያል።
- source_word: Υἱὲ Δαυίδ
  choice: የዳዊት ልጅ ሆይ
  rationale: የዳዊትን ንጉሣዊና መሲሐዊ ማዕረግ በቀጥታ ይተረጉማል፤ ‘ሆይ’ የጥሪ ቅርጹን ያሳያል።
- source_word: ἐλέησόν με
  choice: ማረኝ
  rationale: አጭር፣ አስቸኳይና በዘመናዊ አማርኛ የተፈጥሮ የምሕረት ልመና ነው።
theological_decisions:
- issue: የΥἱὲ Δαυίδ መሲሐዊ አንድምታ
  choice: በዋናው ጽሑፍ ‘የዳዊት ልጅ’ ተብሎ እንደ ማዕረግ ተተርጉሟል።
  alternative: እንደ ተራ የክብር አጠራር መውሰድ።
  rationale: በሉቃስ ትረካ ውስጥ አጠራሩ የዳዊትን ንጉሣዊ ተስፋ የሚያስታውስ መሲሐዊ ማዕረግ ነው፤ ቀጥተኛ ትርጉሙ አንድምታውን ሳይዘረዝር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የድርጊቶቹ ንጽጽር፣ የሰውየው ጽናት እና የጥሪው አስቸኳይነት ተጠብቀዋል። ምንም የግርጌ ማስታወሻ አያስፈልግም።
