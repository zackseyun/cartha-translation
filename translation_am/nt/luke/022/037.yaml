base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: am
  text: እላችኋለሁና፣ ተብሎ የተጻፈው ይህ፤ ‘ከሕገወጦች ጋር ተቆጠረ’[a]፣ በእኔ ላይ ሊፈጸም ይገባል። እኔን የሚመለከተው ወደ ፍጻሜ እየደረሰ ነውና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊው አገላለጽ፣ “ከዓመፀኞች ጋር ተቆጠረ” (ኢሳ 53፥12)።
    reason: alternative_reading
  - marker: b
    text: ወይም “እኔን የሚመለከተው ፍጻሜ አለው / ወደ ፍጻሜ እየደረሰ ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: እላችኋለሁና
  rationale: λέγω ὑμῖνን በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ የማብራሪያውን γάρ ግንኙነትም “-ና” ይጠብቃል።
- source_word: τοῦτο τὸ γεγραμμένον
  choice: ተብሎ የተጻፈው ይህ
  rationale: “ይህ” የሚለውን አመልካችና የተጻፈ ነገር መሆኑን ሳይጨምር ይጠብቃል።
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: በእኔ ሊፈጸም ይገባል
  rationale: δεῖ ያለውን አስፈላጊነት “ይገባል” ይገልጣል፤ ትንቢታዊ ጽሑፍ በኢየሱስ ላይ መፈጸሙንም በቀጥታ ያሳያል።
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: ከሕግ የለሾች ጋር ተቆጠረ
  rationale: ἀνόμωνን ከ“ሕግ” ጽንሰ ሐሳብ ጋር በቅርብ ያቀርባል፤ ἐλογίσθηንም “ተቆጠረ” ብሎ በቀጥታ ይተረጉማል።
- source_word: τὸ περὶ ἐμοῦ
  choice: እኔን የሚመለከተው
  rationale: ሐረጉን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ግሪኩ በግልጽ ያላለውን “የተጻፈው” የሚል ቃል አይጨምርም።
- source_word: τέλος ἔχει
  choice: ወደ ፍጻሜው እየደረሰ ነው
  rationale: ሐረጉ የሚይዘውን የመጨረሻ ወይም የመሟላት ፍቺ ሙሉ በሙሉ ወደ አንዱ ሳያጠብ ወደ ፍጻሜ የሚደረገውን እንቅስቃሴ ይገልጣል።
theological_decisions:
- issue: የኢሳይያስ 53፥12 ጥቅስን ከባህላዊ የትርጉም አገላለጽ ጋር ማዛመድ
  choice: ከሕግ የለሾች ጋር ተቆጠረ
  alternative: ከዓመፀኞች ጋር ተቆጠረ
  rationale: ዋናው ጽሑፍ ἀνόμων የሚለውን ቃል በቅርብ ይከተላል፤ የተለመደው አገላለጽ ግን የጥቅሱን ትውፊታዊ ድምፅ ለማስጠበቅ በማስታወሻ ቀርቧል።
- issue: τέλος ἔχει የሚለው ሐረግ ፍቺ
  choice: ወደ ፍጻሜው እየደረሰ ነው
  alternative: ፍጻሜውን እያገኘ ነው / እየተፈጸመ ነው
  rationale: ግሪኩ መጨረሻንም ሆነ መሟላትን ሊያመለክት ስለሚችል፣ ትርጉሙ ይህን የፍቺ ውጥረት አንዱን ብቻ በመምረጥ አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ መደበኛ ድምፅ ተጠብቆ፣ በመጨረሻው ሐረግ ያለው የ“መጨረሻ/መሟላት” የፍቺ ስፋት አልተዘጋም።
