  source_fidelity: The draft accurately represents the intercession, Peter's faith, his subsequent return, and the command to strengthen the other disciples. However, «እንዳይወድቅ» renders faith itself as falling and is less exact than the source's ‘fail/cease/give out’ sense; «እንዳይከሽፍ» is both idiomatic and closer. «ጸልያለሁ» is potentially read as an ordinary present form; «ጸልዬአለሁ» clearly conveys the completed prayer expressed by the Greek aorist in this context.
  naturalness: The sentence is otherwise clear, dignified modern standard Amharic. The revised verbal form and ‘fail’ expression improve precision without making the sentence heavy. The temporal participle «ተመልሰህ» naturally conveys the contextual force of ποτέ without an unnatural literal insertion.
  terminology: «እምነት», «ተመልሰህ», «አጽና», and «ወንድሞችህን» are appropriate. The footnote's principal alternative should correspond to the revised main-text sense, and its explanatory wording should avoid implying more than the Greek states.
