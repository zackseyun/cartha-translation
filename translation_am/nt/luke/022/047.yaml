source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: am
  text: እርሱ ገና እየተናገረ ሳለ፣ እነሆ፣ ብዙ ሰዎች መጡ። ይሁዳ የሚባለው፣ ከአሥራ ሁለቱ አንዱ፣ ከፊታቸው ይሄድ ነበር[a]፤ ኢየሱስንም ሊስመው ወደ እርሱ ቀረበ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየመራቸው ነበር” / “ቀድሟቸው ሄደ።”
    reason: προήρχετο αὐτούς ከፊት መሄድን ወይም ቡድኑን መምራትን ሊያመለክት የሚችል የቃላት አማራጭ አለው።
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: እርሱ ገና እየተናገረ ሳለ
  rationale: የግሪኩን በአንድ ጊዜ እየተከናወነ ያለ ድርጊትና የἔτιን ‘ገና’ የጊዜ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን ወደ ድንገተኛው መምጣት የሚስበውን የትረካ ምልክት ይጠብቃል።
- source_word: ὄχλος
  choice: ብዙ ሰዎች መጡ
  rationale: ὄχλος የሰዎችን ብዛት ያመለክታል፤ በአማርኛ ‘ብዙ ሰዎች’ ተፈጥሯዊ ሲሆን ‘መጡ’ ከአውዱ የሚገባውን መድረስ ግልጽ ያደርጋል።
- source_word: ὁ λεγόμενος Ἰούδας
  choice: ይሁዳ የሚባለው
  rationale: ተሳቢውን የመለያ አገላለጽ በቅርብ ይከተላል፤ ‘የሚባለው’ በዚህ አውድ የንቀት ፍቺ አያክልም።
- source_word: εἷς τῶν δώδεκα
  choice: ከአሥራ ሁለቱም አንዱ የሆነው
  rationale: ይሁዳ ከአሥራ ሁለቱ መካከል መሆኑንና በትረካው ያለውን አሳዛኝ ተቃርኖ ይጠብቃል።
- source_word: προήρχετο αὐτούς
  choice: ከፊታቸው ይሄድ ነበር
  rationale: የኢምፐርፌክት ቀጣይነትንና ከቡድኑ በፊት መሄዱን ይጠብቃል፤ መደበኛ መሪነትን በግድ አያስገባም።
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: ወደ እርሱ ቀረበ
  rationale: ἐγγίζω የሚያመለክተውን ወደ ኢየሱስ መቅረብ በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘እርሱ’ ተውላጠ ስም ኢየሱስን በግልጽ ይመለከታል።
- source_word: φιλῆσαι αὐτόν
  choice: ኢየሱስንም ሊስመው
  rationale: የዓላማውን ኢንፊኒቲቭ እና ‘መሳም’ የሚለውን ቀጥተኛ ፍቺ ይጠብቃል፤ ‘አሳልፎ ሊሰጠው’ የሚል ትርጓሜ አያክልም።
theological_decisions:
- issue: የይሁዳን ድርጊት በትረካው ማቅረብ
  choice: መቅረቡንና ሊስመው መሆኑን ብቻ በቀጥታ መግለጽ
  alternative: “በመሳም አሳልፎ ሊሰጠው” ብሎ ትርጓሜያዊ ማስፋፋት
  rationale: የአሳልፎ መስጠቱ አውድ ግልጽ ቢሆንም፣ ይህ ቁጥር ራሱ መቅረቡንና የታሰበውን መሳም ይገልጻል፤ ትርጉሙ ከግሪኩ በላይ የሥነ መለኮት ወይም የሞራል ፍርድ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እነሆ’ የትረካውን ድንገተኛ ትኩረት ለመጠበቅ ሆን ተብሎ የተመረጠ ከፍ ያለ ነገር ግን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
