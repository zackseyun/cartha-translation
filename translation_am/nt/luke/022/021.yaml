  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: am
  text: ነገር ግን እነሆ፣ እኔን አሳልፎ የሚሰጠኝ ሰው እጅ ከእኔ ጋር በማዕዱ ላይ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: ነገር ግን
  rationale: በንግግሩ ውስጥ ያለውን የንፅፅር ሽግግር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚጠራውን ቀጥተኛ ትእዛዛዊ ኃይል በክብር የተሞላ እና ለመጽሐፍ ቅዱስ ንባብ የተለመደ አገላለጽ ይጠብቃል።
- source_word: τοῦ παραδιδόντος με
  choice: አሳልፎ የሚሰጠኝ ሰው
  rationale: የπαραδίδωን መሠረታዊ ሐሳብ ይጠብቃል፤ የአሁን ጊዜ ተሳቢውንም በ‘የሚሰጠኝ’ ያንጸባርቃል።
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: ከእኔ ጋር በማዕዱ ላይ
  rationale: የግሪኩን ቦታዊ ምስል ሳያጠፋ በአማርኛ ተፈጥሯዊ የሆነውን ‘ማዕድ’ ይጠቀማል።
theological_decisions:
- issue: የπαραδιδόντος አተረጓጎም
  choice: አሳልፎ የሚሰጠኝ
  alternative: የሚከዳኝ
  rationale: ‘የሚከዳኝ’ በዐውዱ ትክክል ቢሆንም፣ ‘አሳልፎ የሚሰጠኝ’ የግሪኩን ሰፊ ትርጉምና የድርጊቱን ሂደት ይበልጥ በቅርብ ይጠብቃል።
- issue: ‘እጅ’ የሚለውን ዘይቤ መጠበቅ
  choice: እጅ
  alternative: አሳልፎ የሚሰጠኝ ሰው ከእኔ ጋር በማዕድ ነው
  rationale: ምንጩ ሰውየውን በ‘እጅ’ በኩል በግልጽ ምስል ያቀርባል፤ ይህን ማቅለል የጽሑፉን ድራማዊ ኃይል ያሳንሳል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ አማርኛ። ‘እነሆ’ ትንሽ ሥነ ጽሑፋዊ ቢሆንም የἰδοὺን የትኩረት ጥሪ በአጭርና በግልጽ መንገድ ያስተላልፋል።
