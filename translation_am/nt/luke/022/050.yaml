id: LUK.22.50
reference: Luke 22:50
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: am
  text: ከእነርሱም አንዱ የሊቀ ካህናቱን ባሪያ[a] መታውና ቀኝ ጆሮውን ቆረጠው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሊቀ ካህናቱን አገልጋይ»። የግሪኩ δοῦλος (ዱሎስ) እንደ ዐውዱ «ባሪያ» ወይም «አገልጋይ» ሊል ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: መታው
  rationale: πατάσσω ኃይለኛ ድብደባን ያመለክታል፤ «መታው» ድርጊቱን በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εἷς τις ἐξ αὐτῶν
  choice: ከእነርሱም አንዱ
  rationale: የግለሰቡን ማንነት ሳይገልጥ፣ በቡድኑ ውስጥ ከነበሩት አንዱ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: የሊቀ ካህናቱን ባሪያ
  rationale: δοῦλος በዚህ ስፍራ በሌላ ሰው ሥልጣን ሥር ያለን ማኅበራዊ ደረጃ ያመለክታል፤ «ባሪያ» ይህን ትርጉም ከ«አገልጋይ» ይበልጥ በግልጽ ያስተላልፋል።
- source_word: ἀφεῖλεν
  choice: ቆረጠው
  rationale: ἀφαιρέω በመሠረቱ «አስወገደ» ማለት ቢሆንም፣ ከጆሮ ጉዳት ጋር በዚህ ዐውድ «ቆረጠው» የድርጊቱን ውጤት በግልጽና በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: ቀኝ ጆሮውን
  rationale: የተጎዳውን የሰውነት ክፍልና ወገን ሙሉ በሙሉ የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
theological_decisions:
- issue: የδοῦλος አተረጓጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ቃሉ እዚህ በቃል በቃል ማኅበራዊ ትርጉሙ ጥቅም ላይ ውሏል። «ባሪያ» የግለሰቡን በጌታ ሥልጣን ሥር የመሆን ሁኔታ ይጠብቃል፤ የተለመደው «አገልጋይ» አማራጭ ግን በማስታወሻ ተቀምጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ሊቀ ካህናት» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የድርጊቶቹ ቅደም ተከተልም ከግሪኩ ጋር ተጠብቋል።
