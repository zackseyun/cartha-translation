  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: am
  text: ለመሆኑ፣ ማን ይበልጣል፤ በማዕድ የተቀመጠው[a] ወይስ የሚያገለግለው? በማዕድ የተቀመጠው አይደለምን? እኔ ግን በመካከላችሁ እንደሚያገለግል ሰው ነኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ተደግፎ የተቀመጠው»። በጥንታዊው የግብዣ ልማድ መሠረት ተመጋቢዎች በማዕድ ተደግፈው ሲበሉ፣ አገልጋዮች ያስተናግዷቸው ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: ማን
  rationale: በሁለት ሰዎች ማኅበራዊ ደረጃ መካከል ንጽጽር የሚያቀርብ ጥያቄ ስለሆነ፣ ተፈጥሯዊው የአማርኛ አቻ «ማን» ነው።
- source_word: γὰρ
  choice: ለመሆኑ
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በአማርኛ የጥያቄ አገባብ ውስጥ ተፈጥሯዊ በሆነ መንገድ ያሳያል።
- source_word: μείζων
  choice: ይበልጣል
  rationale: የማዕረግ፣ የክብር ወይም የአስፈላጊነት ንጽጽሩን ሳይወስን የግሪኩን ንጽጽራዊ ኃይል ይጠብቃል።
- source_word: ὁ ἀνακείμενος
  choice: በማዕድ የተቀመጠው
  rationale: ቃሉ በጥንታዊ የምግብ ግብዣ ልማድ መሠረት ተደግፎ መብላትን ያመለክታል። «በማዕድ የተቀመጠው» ይህን ትዕይንት ለዘመናዊ አንባቢ በተፈጥሯዊ ቋንቋ ያስተላልፋል፤ ባሕላዊው ዝርዝር በማስታወሻ ተገልጧል።
- source_word: ὁ διακονῶν
  choice: የሚያገለግለው
  rationale: በማዕድ ያለውን ሰው ከምግብ አቅራቢው ጋር የሚያነጻጽረውን የግስ ሐሳብ ይጠብቃል፤ ከቤተ ክርስቲያናዊ ማዕረግ ጋርም አያያይዘውም።
- source_word: οὐχὶ
  choice: አይደለምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የአጻጻፍ ጥያቄ በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐγὼ δὲ
  choice: እኔ ግን
  rationale: በተለመደው ማኅበራዊ ግምትና በኢየሱስ ራስ-መግለጫ መካከል ያለውን ንጽጽር ይጠብቃል።
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: በመካከላችሁ … ነኝ
  rationale: በቡድኑ መካከል መገኘቱን በተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: ὡς ὁ διακονῶν
  choice: እንደሚያገለግል
  rationale: ὡς የሚገልጠውን የአኳኋንና የንጽጽር ሐሳብ ይጠብቃል፤ የግሱንም ቅርጽ በስም «አገልጋይ» አይተካም።
theological_decisions:
- issue: የኢየሱስን ራስ-መግለጫ በአገልግሎት ቋንቋ መተርጎም
  choice: እኔ ግን በመካከላችሁ እንደሚያገለግል ነኝ።
  alternative: እኔ ግን በመካከላችሁ እንደ አገልጋይ ነኝ።
  rationale: ግሪኩ διακονῶν የሚለውን የግስ ተሳቢ ቅርጽ እንጂ δοῦλος የሚለውን ስም አይጠቀምም። ስለዚህ «እንደሚያገለግል» የሚለው በማዕድ አውድ ያለውን ድርጊት ይጠብቃል፤ የባርነትን ወይም የተቋማዊ ማዕረግን ትርጉም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ማዕድ» የምግብ አውዱን በአጭሩ ያሳያል፤ «ተቀመጠ» ደግሞ ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን የጥንቱ የመደገፍ ልማድ በእግር ማስታወሻ ተጠብቋል።
