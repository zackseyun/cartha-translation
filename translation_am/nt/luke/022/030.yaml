- source_word: κρίνοντες
  choice: ትፈርዳላችሁ
  rationale: የκρίνωን ቀጥተኛ የፍርድ ትርጉም ያቆያል፤ በአማርኛ ውስጥ የወደፊቱን ሚና ግልጽ ለማድረግ እንደ ዋና ግስ ቀርቧል።
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: በእስራኤል አሥራ ሁለቱ ነገዶች ላይ
