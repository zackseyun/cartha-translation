  text: በመንግሥቴ በማዕዴ ላይ እንድትበሉና እንድትጠጡ፣ በዙፋኖችም ላይ ትቀመጣላችሁ፤ በእስራኤል አሥራ ሁለቱ ነገዶች ላይ ትፈርዳላችሁ።[a]
  philosophy: optimal-equivalence
