review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the arrival of the day, the festival association, and the calendrical necessity. However, «ፋሲካውን መሠዋት ያስፈልግ ነበር» is active in form and can imply that an unstated person had to sacrifice the Passover. The Greek infinitive θύεσθαι is passive here: the Passover sacrificial victim was to be sacrificed. A relative construction gives this force naturally while retaining τὸ πάσχα as «ፋሲካው».'
  naturalness: «ያልቦካ ቂጣ በዓል» is more idiomatic and concise than «ቂጣ የማይቦካበት በዓል». Combining the relative clause with «ቀን» avoids an awkward repetition and clearly expresses the temporal relative pronoun.
  terminology: «ፋሲካ» appropriately preserves the breadth of πάσχα, while the footnote responsibly identifies “Passover lamb” and “Passover sacrifice” as contextually possible specifications. «የሚሠዋበት» conveys the sacrificial setting without imposing a narrower referent in the main text.
  issues:
  - severity: medium
    issue: The main clause uses an active infinitive for θύεσθαι.
    rationale: «ፋሲካውን መሠዋት ያስፈልግ ነበር» can be read as ‘it was necessary to sacrifice the Passover,’ with the action assigned to an implicit agent, whereas the Greek passive says that the Passover was the thing to be sacrificed. Recasting as «ፋሲካው የሚሠዋበት» preserves the source construction naturally.
  - severity: low
    issue: The festival expression is unnecessarily periphrastic.
    rationale: «ያልቦካ ቂጣ በዓል» is standard, clear modern Amharic and retains the singular «ቀን».
  revised_text: ከዚያም ፋሲካው የሚሠዋበት ያልቦካ ቂጣ በዓል ቀን ደረሰ።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ “የፋሲካው በግ” ወይም “የፋሲካው መሥዋዕት።” የግሪኩ ቃል በአጠቃላይ የፋሲካን በዓል ወይም፣ በዚህ አውድ በተለይ፣ የሚሠዋውን እንስሳ ሊያመለክት ይችላል።
    reason: alternative_reading
  revision_rationale: The revision corrects the active/passive mismatch, improves idiomatic modern Amharic, and keeps the source’s deliberately broad use of πάσχα. The footnote marker is placed at the occurrence of «ፋሲካው», so its alternatives have an unambiguous anchor.
