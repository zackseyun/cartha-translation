  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: am
  text: ከዚያም ፋሲካው የሚሠዋበት ያልቦካ ቂጣ በዓል ቀን ደረሰ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፋሲካው በግ” ወይም “የፋሲካው መሥዋዕት።” የግሪኩ ቃል በአጠቃላይ የፋሲካን በዓል ወይም፣ በዚህ አውድ በተለይ፣ የሚሠዋውን እንስሳ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: ደረሰ
  rationale: ጊዜ ወይም ቀን መድረሱን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: δὲ
  choice: ከዚያም
  rationale: በትረካው ውስጥ ያለውን ቀጣይነትና የክስተት ሽግግር ያሳያል።
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: ቂጣ የማይቦካበት በዓል ቀን
  rationale: የግሪኩን ነጠላ ‘ቀን’ ይጠብቃል፤ ἄζυμα ያልቦካ ቂጣን እንደሚመለከትም ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: ᾗ
  choice: በዚያም ቀን
  rationale: ወደተጠቀሰው ቀን የሚመለሰውን የዝምድና ተውላጠ ስም ጊዜያዊ ኃይል በግልጽ አማርኛ ይገልጻል።
- source_word: ἔδει
  choice: ያስፈልግ ነበር
  rationale: ያለፈ ጊዜያዊ ግዴታን ወይም አስፈላጊነትን ይገልጻል፤ ከጽሑፉ በላይ የመለኮታዊ ግዴታ ትርጓሜ አይጨምርም።
- source_word: θύεσθαι
  choice: መሠዋት
  rationale: በአምልኮ ሥርዓት አውድ ውስጥ ያለውን ለመሥዋዕት ማረድ ትርጉም በአጭርና ክብር ባለው ቃል ያስተላልፋል።
- source_word: τὸ πάσχα
  choice: ፋሲካውን
  rationale: የግሪኩን ሰፊ መጠሪያ ይጠብቃል፤ ከ‘መሠዋት’ ግስ ጋር ሲነበብ የፋሲካውን መሥዋዕት እንስሳ እንደሚያመለክት ይገባል።
theological_decisions:
- issue: በመሥዋዕት አውድ ውስጥ τὸ πάσχα የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘ፋሲካውን’ ተብሎ ተተርጉሟል፤ የመሥዋዕቱ ትርጉም በ‘መሠዋት’ ግስ እንዲገለጥ ተደርጓል።
  alternative: ‘የፋሲካውን በግ’ ወይም ‘የፋሲካውን መሥዋዕት’
  rationale: πάσχα በዓሉን፣ ምግቡን ወይም የመሥዋዕቱን እንስሳ ሊያመለክት ይችላል። እዚህ θύεσθαι መሥዋዕታዊውን አውድ ያሳያል፤ ሆኖም ዋናው ጽሑፍ የግሪኩን ስፋት እንዳያጠብ ዝርዝር አማራጮቹ በማስታወሻ ተቀምጠዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ቂጣ የማይቦካበት በዓል’ በሕዝብ ዘንድ ሊገባ የሚችል ገላጭ አገላለጽ ሲሆን፣ ‘ፋሲካውን’ ደግሞ የምንጩን እውነተኛ የትርጉም ስፋት ይጠብቃል።
