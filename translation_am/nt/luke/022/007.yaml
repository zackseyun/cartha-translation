revisions:
- from: ከዚያም ቂጣ የማይቦካበት በዓል ቀን ደረሰ፤ በዚያም ቀን ፋሲካውን[a] መሠዋት ያስፈልግ ነበር።
  to: ከዚያም ፋሲካው የሚሠዋበት ያልቦካ ቂጣ በዓል ቀን ደረሰ።[a]
  rationale: The revision corrects the active/passive mismatch, improves idiomatic modern Amharic, and keeps the source’s deliberately broad use of πάσχα. The footnote marker is placed at the occurrence of «ፋሲካው», so its alternatives have an unambiguous anchor.
