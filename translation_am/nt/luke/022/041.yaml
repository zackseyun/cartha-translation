  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: am
  text: እርሱም ከእነርሱ በድንጋይ ውርወራ ያህል[a] ራቅ ብሎ፣ ተንበርክኮ[b] ይጸልይ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በድንጋይ ውርወራ የሚደረስበት ያህል ርቀት።»
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «ጉልበቶቹን አኑሮ»፤ ማለትም፣ «ተንበርክኮ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: ርቆ
  rationale: የግሱ ተገብሮአዊ ቅርጽ በዚህ ዐውድ ኢየሱስ ከደቀ መዛሙርቱ ራሱን ለይቶ ትንሽ መራቁን ይገልጻል፤ «ርቆ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὡσεὶ λίθου βολήν
  choice: የድንጋይ ውርወራ ያህል
  rationale: ὡσεὶ የሚያመለክተውን ግምታዊ ርቀት ጠብቆ፣ በድንጋይ መወርወር የሚለካ ርቀትን በግልጽ አማርኛ ይገልጻል።
- source_word: θεὶς τὰ γόνατα
  choice: ተንበርክኮ
  rationale: ቃል በቃል «ጉልበቶቹን አኑሮ» የሚለው አገላለጽ የመንበርከክ ፈሊጥ ነው፤ «ተንበርክኮ» የጸሎቱን አካላዊ አቋም ተፈጥሯዊ በሆነ ቋንቋ ያስተላልፋል።
- source_word: προσηύχετο
  choice: ይጸልይ ነበር
  rationale: ያልተፈጸመው የግስ ጊዜ ቀጣይነት ያለውን ድርጊት ስለሚያመለክት፣ «ይጸልይ ነበር» የጸሎቱን ቀጣይ ሁኔታ ይጠብቃል።
- source_word: αὐτὸς
  choice: እርሱ
  rationale: ተውላጠ ስሙ ያለውን መጠነኛ አጽንዖት ሳያጋንን «እርሱ» ይጠብቃል።
- source_word: καὶ
  choice: እርሱም
  rationale: የትረካውን ቀጣይነት «-ም» በተፈጥሯዊ የአማርኛ አያያዥነት ያስተላልፋል።
theological_decisions:
- issue: የጸሎት አቋምና ክርስቶሳዊ አቀራረብ
  choice: ኢየሱስ በአካል ርቆ፣ ተንበርክኮ ሲጸልይ የሚያሳየውን ትረካ ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ በቀጥታ ማቅረብ
  alternative: የድርጊቱን መንፈሳዊ ወይም ክርስቶሳዊ ትርጉም በትርጉሙ ውስጥ ማብራራት
  rationale: ጥቅሱ የኢየሱስን እንቅስቃሴ፣ አቋምና ጸሎት ይተርካል፤ በምንጩ የሌለ ኑፋቄያዊ ወይም መንፈሳዊ ትርጓሜ መጨመር አያስፈልግም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ይጸልይ ነበር» የምንጩን ቀጣይ የግስ ገጽታ ይጠብቃል።
