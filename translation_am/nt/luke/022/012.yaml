  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: am
  text: እርሱም ትልቅና ዕቃዎች የተደረደሩበትን የላይኛ ፎቅ ክፍል[a] ያሳያችኋል፤ በዚያ አዘጋጁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ትልቅና አስቀድሞ የተዘጋጀ የላይኛ ፎቅ ክፍል»፤ ወይም «ትልቅና የተነጠፈ የላይኛ ፎቅ ክፍል»።
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: እርሱም
  rationale: καί + ἐκεῖνος የቀደመውን ባለቤት እየጠቀሰ መመሪያውን ይቀጥላል፤ «እርሱም» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δείξει ὑμῖν
  choice: ያሳያችኋል
  rationale: የወደፊት ጊዜውንና የብዙ ሰዎች ተሳቢ ተውላጠ ስም በአንድ ተፈጥሯዊ የአማርኛ ግስ ይገልጣል።
- source_word: ἀνάγαιον
  choice: በላይኛው ፎቅ ያለውን ... ክፍል
  rationale: ቃሉ በሕንፃ የላይኛው ክፍል ያለን ክፍል ያመለክታል፤ ይህ አገላለጽ «የላይኛው ክፍል» ከሚለው ይበልጥ ግልጽና ተፈጥሯዊ ነው።
- source_word: μέγα
  choice: ትልቅ
  rationale: የክፍሉን መጠን በቀጥታና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐστρωμένον
  choice: የተዘጋጀ
  rationale: ፍጹም ተደራጊ አንቀጹ ክፍሉ አስቀድሞ ተዘጋጅቶ እንደነበር ያሳያል፤ የመዘርጋት፣ የማስጌጥ ወይም የዕቃ ዝግጅት ዝርዝሩ ግን አሻሚ ስለሆነ በማስታወሻ ተጠብቋል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ቀጥተኛውን የቦታ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἑτοιμάσατε
  choice: አዘጋጁ
  rationale: የብዙ ሰዎችን የትእዛዝ ኃይል በግልጽና አጭር መልኩ ይጠብቃል።
