  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: am
  text: ከጸሎትም ተነሥቶ ወደ ደቀ መዛሙርቱ መጣ፤ ከሐዘን የተነሣ ተኝተው አገኛቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: ከጸሎትም ተነሥቶ
  rationale: የግሪኩን የድርጊት ቅደም ተከተል ጠብቆ፣ ኢየሱስ ከጸሎቱ ተነሥቶ እንደሄደ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: ወደ ደቀ መዛሙርቱ መጣ
  rationale: πρός የሚያመለክተውን ወደ እነርሱ መቅረብ ይጠብቃል፤ «ደቀ መዛሙርት» ለμαθηταί የተለመደና ትክክለኛ የወንጌል ቃል ነው።
- source_word: εὗρεν κοιμωμένους αὐτούς
  choice: ተኝተው አገኛቸው
  rationale: በአገኛቸው ጊዜ የነበሩበትን ሁኔታ የሚገልጠውን የአሁን ጊዜ አሳታፊ ግስ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἀπὸ τῆς λύπης
  choice: ከሐዘን የተነሣ
  rationale: ἀπό በዚህ አውድ ምክንያትን ይገልጣል፤ «ከሐዘን የተነሣ» ይህን ግንኙነት ግልጽና ተፈጥሯዊ አድርጎ ያስተላልፋል።
theological_decisions:
- issue: የደቀ መዛሙርቱ መተኛትና ሐዘናቸው ያላቸው ግንኙነት
  choice: መተኛታቸው ከሐዘን የተነሣ እንደሆነ ቀርቧል።
  alternative: ምክንያታዊ ግንኙነቱን ሳያጠናክር «በሐዘን ተኝተው» ማለት።
  rationale: ἀπὸ τῆς λύπης በተፈጥሮ ምክንያትን ይገልጣል። ትርጉሙ ጽሑፉ ከሚለው በላይ ሥነ ልቦናዊ ወይም አስተምህሯዊ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ጸሎት»፣ «ደቀ መዛሙርት» እና «ሐዘን» በመጽሐፍ ቅዱሳዊ አውድ የተለመዱ ቢሆኑም አሁንም በቀላሉ የሚገቡ ቃላት ናቸው።
