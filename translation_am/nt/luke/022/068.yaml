  text: But if I ask[a], you will certainly not answer.
translation:
  language: am
  text: ነገር ግን ብጠይቃችሁ፣ ፈጽሞ አትመልሱልኝም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: ብ-
  rationale: ከአማርኛው የሁኔታ አመልካች ቅጥያ ጋር በመጣመር ‘ብጠይቃችሁ’ የግሪኩን ሁኔታዊ አንቀጽ ተፈጥሯዊ በሆነ መንገድ ይገልጻል።
- source_word: δὲ
  choice: -ም
  rationale: በዚህ ዐውደ ንባብ ያለውን ንጽጽርና ከቀዳሚው ንግግር ጋር ያለውን ትስስር ‘እኔም’ ውስጥ ያለው -ም በተፈጥሯዊ አማርኛ ያሳያል፤ ግልጽ ተቃርኖ ስለማይጠይቅ ‘ነገር ግን’ አልተጨመረም።
- source_word: ἐρωτήσω
  choice: ብጠይቃችሁ
  rationale: ‘ጠየቀ’ ጥያቄ መጠየቅን በሰፊና ተፈጥሯዊ ሁኔታ ይገልጻል፤ በግሪኩ ግስ ውስጥ ያልተወሰነ የጥላቻ ምርመራ ትርጉም አይጨምርም። የብዙ ቁጥር ተሳቢውም በግሱ ውስጥ ተገልጿል።
- source_word: οὐ μὴ
  choice: ፈጽሞ … አት…ም
  rationale: οὐ μή የሚያሳየውን ጠንካራ እምቢታ ‘ፈጽሞ’ ከአማርኛው አሉታዊ የግስ ቅርጽ ጋር በማጣመር በግልጽና በዘመናዊ አነጋገር ያስተላልፋል።
- source_word: ἀποκριθῆτε
  choice: አትመልሱልኝም
  rationale: ‘መለሰ’ ለጥያቄ መልስ መስጠትን በቀጥታ ይገልጻል። ‘-ልኝ’ መልሱ ለተናጋሪው እንደማይሰጥ በተፈጥሯዊ አማርኛ ያሳያል።
