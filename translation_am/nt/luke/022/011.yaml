    issue: The conjunction-like suffix in “ለቤቱም ባለቤት” is unsupported.
    rationale: καὶ introduces the whole instruction (“and you will say”), not an additional sense attached specifically to “the owner of the house.”
  - severity: medium
    issue: The quotation framing is syntactically awkward.
    rationale: Adding “እንዲህ” before the reported words and setting off the speech with a colon makes clear that the disciples are to deliver the Teacher’s message to the householder.
