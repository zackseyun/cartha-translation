  verdict: revise
  source_fidelity: 'The draft accurately renders the principal lexical content: the householder, the Teacher, the guest room, Passover, and the disciples are all retained. The singular address in “ይልሃል” appropriately reflects σοι. A small syntactic revision is needed to make the instruction and its nested quotation clear and idiomatic in Amharic.'
