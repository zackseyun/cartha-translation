- source_word: κατάλυμα
  choice: የእንግዳ ክፍል
  rationale: ቃሉ ለማረፊያ ወይም ለእንግዳ መቀበያ የሚውል ቦታን ያመለክታል። ቤት ውስጥ በሚካሄደው ሁኔታ «የእንግዳ ክፍል» ይስማማል፤ «ማደሪያ ቤት» ወይም «የላይኛው ክፍል» ማለት ግን ከቃሉ በላይ ይወስናል።
- source_word: τὸ πάσχα
  choice: ፋሲካን
  rationale: πάσχα የፋሲካን በዓል ወይም ምግብ ሊያመለክት ይችላል፤ «መብላት» ከሚለው ግስ ጋር እዚህ የፋሲካው ምግብ በተለይ ታስቦአል፣ ነገር ግን «ፋሲካን» የሚለው አገላለጽ የምንጩን አጭርነትና ስፋት ይጠብቃል።
- source_word: μετὰ τῶν μαθητῶν μου
  choice: ከደቀ መዛሙርቴ ጋር
  rationale: μαθητής በወንጌላት ውስጥ ተከታይነትንና ከመምህር መማርን የሚያጣምር ስለሆነ «ደቀ መዛሙርት» የተሟላውን ግንኙነት ያስተላልፋል።
- source_word: φάγω
  choice: የምበላበት
