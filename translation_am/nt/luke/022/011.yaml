  terminology: “መምህሩ,” “የእንግዳ ክፍል,” “ፋሲካን,” and “ደቀ መዛሙርቴ” are appropriate modern-standard renderings. The note correctly avoids identifying κατάλυμα as an inn or prematurely as the upper room.
  issues:
