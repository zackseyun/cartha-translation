  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: am
  text: ለቤቱ ባለቤት እንዲህ ትሉታላችሁ፦ «መምህሩ፣ “ከደቀ መዛሙርቴ ጋር ፋሲካን የምበላበት የእንግዳ ክፍል የት ነው?” ይልሃል።»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «የማረፊያ ቦታ» ተብሎም ሊተረጎም ይችላል። የግሪኩ κατάλυμα ለማደሪያ የሚሆን ቦታን ወይም የእንግዳ ክፍልን ያመለክታል፤ እዚህ በተለይ «ማደሪያ ቤት» ማለት አይደለም፣ «የላይኛው ክፍል» የሚለውም የሚጨመረው በሚቀጥለው ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: ለቤቱ ባለቤት
  rationale: ቃሉ የቤተሰቡን ኃላፊ ወይም የቤቱን ጌታ ያመለክታል፤ «የቤቱ ባለቤት» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የሥልጣን ሐሳቡንም ይጠብቃል።
