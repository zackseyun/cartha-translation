base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: am
  text: ከዚያም አንዲት አገልጋይ ልጃገረድ በብርሃኑ አጠገብ[a] ተቀምጦ አይታው፣ ትኩር ብላ ተመለከተችውና “ይህ ሰውም ከእርሱ ጋር ነበር” አለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብርሃን በሚያበራበት ስፍራ።” የግሪኩ ሐረግ ከብርሃኑ ምንጭ አጠገብ መሆንንም ሆነ ብርሃኑ በሚደርስበት ስፍራ መሆንን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: አይታው
  rationale: የግሪኩን የቀደመ ተግባር በተፈጥሯዊ የአማርኛ አያያዝ ያሳያል፤ ተውላጠ ስሙም ጴጥሮስን ያመለክታል።
- source_word: δὲ
  choice: ከዚያም
  rationale: እዚህ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይ እርምጃ ያመለክታል።
- source_word: παιδίσκη τις
  choice: አንዲት አገልጋይ ልጃገረድ
  rationale: παιδίσκη ወጣት ሴት አገልጋይን፣ τις ደግሞ ያልተወሰነች አንዲት መሆኗን ያሳያል። ‘ባሪያ’ ማለት በዚህ ትዕይንት ያልተጎላውን ማኅበራዊ ሁኔታ ከልክ በላይ ሊያጎላ ይችላል።
- source_word: καθήμενον
  choice: ተቀምጦ
  rationale: የጴጥሮስን አቀማመጥ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸς τὸ φῶς
  choice: በብርሃኑ አጠገብ
  rationale: πρός የብርሃኑን ምንጭ በተመለከተ ቅርበትን ሊያመለክት ይችላል፤ ሐረጉ በብርሃን የበራውን ስፍራም ሊያመለክት ስለሚችል ሌላው አገላለጽ በማስታወሻ ቀርቧል።
- source_word: ἀτενίσασα
  choice: ትኩር ብላ ተመለከተችውና
  rationale: የተራዘመና ያተኮረ እይታን ያሳያል፤ -ና የግሪኩን የተሳቢ ቅደም ተከተል በተፈጥሯዊ አማርኛ ከዋናው ግስ ጋር ያገናኛል።
- source_word: Καὶ οὗτος
  choice: ይህ ሰውም
  rationale: οὗτος ያለውን ጠቋሚ ኃይል ‘ይህ ሰው’ ይጠብቃል፤ -ም ደግሞ καί ያለውን ‘ደግሞ/እንዲሁም’ ትርጉም ይይዛል።
- source_word: σὺν αὐτῷ ἦν
  choice: ከእርሱ ጋር ነበር
  rationale: አብሮነትን የሚገልጠውን የግሪክ ሐረግ በቀጥታ ያስተላልፋል፤ ‘ከተከታዮቹ አንዱ ነበር’ የሚል ትርጓሜ አይጨምርም።
