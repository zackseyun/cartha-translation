  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: am
  text: እርሱም ሄዶ፣ እንዴት አድርጎ ኢየሱስን ለእነርሱ አሳልፎ እንደሚሰጥ[a] ከካህናት አለቆችና ከመኮንኖች[b] ጋር ተነጋገረ።
  philosophy: optimal-equivalence
  footnotes:
