  rationale: የግሪኩን ‘ለሌላ አሳልፎ መስጠት’ የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ በአውዱ ያለው የክህደት ፍቺ በማስታወሻ ተጠቅሷል።
