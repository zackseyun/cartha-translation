  choice: ወደ ስፍራውም በደረሰ ጊዜ
  rationale: ከግስ በፊት የተፈጸመውን መድረስ በተፈጥሯዊ የአማርኛ ጊዜ አረፍተ ነገር ይገልጣል፤ δὲ የሚያሳየውንም ቀላል የትረካ ትስስር “ም” ያስተላልፋል። “ስፍራው” በአውዱ አስቀድሞ የታወቀውን ቦታ ያመለክታል።
