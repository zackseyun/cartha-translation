  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: am
  text: በዙሪያው የነበሩትም ሊሆን ያለውን ነገር ባዩ ጊዜ፣ “ጌታ ሆይ፣ በሰይፍ[a] እንምታ?” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “በአጭር ሰይፍ” ወይም “በጩቤ።” የግሪኩ μάχαιρα ሰይፍን ወይም አጭር ስለታም መሣሪያን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የግሪኩን የአኦሪስት አሳታፊ ግስ ከዋናው ግስ ጋር ያለውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ περὶ αὐτὸν
  choice: በዙሪያው የነበሩት
  rationale: እነማን እንደሆኑ ከግሪኩ በላይ ሳይወስን፣ በኢየሱስ ዙሪያ የነበሩትን ሰዎች በግልጽ ያመለክታል።
- source_word: τὸ ἐσόμενον
  choice: ሊሆን ያለውን
  rationale: በቅርቡ ሊከሰት ያለውን ነገር የሚያመለክተውን የወደፊት አሳታፊ ግስ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: εἶπαν
  choice: አሉ
  rationale: ዋናውን ‘አሉ’ የሚለውን ትርጉም ይጠብቃል፤ ቀጥሎ ያለው የጥያቄ ምልክት ንግግሩ ጥያቄ መሆኑን ያሳያል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥታ ጥሪውንና κύριος እንደ ማዕረግ ያለውን ክብደት ይጠብቃል።
- source_word: εἰ πατάξομεν
  choice: እንምታ?
  rationale: εἰ እዚህ የምክክር ጥያቄ ያስገባል፤ የአማርኛው የመጀመሪያ መደብ ብዙ ቁጥር ጥያቄ ‘እንምታ?’ ይህን ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἐν μαχαίρῃ
  choice: በሰይፍ
  rationale: ἐνን እንደ መሣሪያ ገላጭ ‘በ-’ ይተረጉማል፤ μάχαιρα ሰይፍን ወይም አጭር ስለታም መሣሪያን ሊያመለክት ስለሚችል ዋናው ትርጉም በሰይፍ ቀርቦ አማራጩ በማስታወሻ ተገልጧል።
theological_decisions:
- issue: ኢየሱስን κύριος ብሎ መጥራት
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: ‘ጌታ’ የቀጥታ ጥሪውን ክብርና የማዕረጉን ሥነ መለኮታዊ ክብደት ይጠብቃል፤ ቃሉን ወደ ማኅበራዊ ክብር መጠሪያ ብቻ አያቀልለውም።
