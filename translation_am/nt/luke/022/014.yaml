  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: am
  text: ሰዓቱ በደረሰ ጊዜ፣ እርሱ በማዕድ ተደግፎ ተቀመጠ[a]፤ ሐዋርያቱም ከእርሱ ጋር ተቀመጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ተደግፎ ተቀመጠ» የሚለው በጥንት ዘመን ምግብ ለመብላት በተለመደው የመደገፍ አቀማመጥ መቀመጥን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ
  choice: ሰዓቱም
  rationale: የግሪኩን ቀላል ትረካዊ አያያዥ καί በአማርኛ ተፈጥሯዊ በሆነው -ም ቅጥያ ያስተላልፋል።
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: ሰዓቱም በደረሰ ጊዜ
  rationale: ὥρα የሚለውን በቀጥታ «ሰዓት» ብሎ በመጠበቅ፣ ἐγένετο የሚያመለክተውን የተወሰነው ጊዜ መድረስ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀνέπεσεν
  choice: በማዕድ ዙሪያ ተደገፈ
  rationale: ግሱ በጥንቱ የምግብ ልማድ መሠረት ለመብላት መደገፍን ያመለክታል። «ተቀመጠ» ማለት ታሪካዊውን አቀማመጥ ያደበዝዛል፤ «በማዕድ ዙሪያ» ደግሞ የምግብ አውዱን በግልጽ ያሳያል።
- source_word: οἱ ἀπόστολοι
  choice: ሐዋርያቱ
  rationale: የታወቁትን ቡድን የሚያመለክተውን የግሪክ ውስን አመልካች በአማርኛው -ቱ ቅጥያ ይጠብቃል፤ በምንጩ የሌለውን «የእርሱ» አይጨምርም።
- source_word: σὺν αὐτῷ
  choice: ከእርሱ ጋር
  rationale: የσύνን አብሮነት ቀጥተኛና ተፈጥሯዊ በሆነ የአማርኛ ሐረግ ያስተላልፋል።
theological_decisions:
- issue: በፋሲካው ማዕድ ወቅት የነበረው የምግብ አቀማመጥ
  choice: በማዕድ ዙሪያ ተደገፈ
  alternative: ተቀመጠ
  rationale: የግሪኩ ግስ የሚገልጠውን ታሪካዊ የምግብ አቀማመጥ ይጠብቃል፤ ይህ የቃልና የባህል ውሳኔ እንጂ የትምህርተ እምነት ጭማሪ አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ትረካዊው ፍሰት በ-ም አያያዥ ተጠብቋል፤ በግሪኩ ያለው የሁለተኛው አንቀጽ የግስ እጥረት ግን በአማርኛ ግልጽነት ሲባል «ነበሩ» ተብሎ ተሟልቷል።
