review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the arrival of the appointed hour, Jesus’ meal posture, and the presence of the apostles. However, the final clause, “ሐዋርያቱም ከእርሱ ጋር ነበሩ,” merely says that the apostles were with him and does not clearly carry forward the meal/reclining action implicit in the Greek ellipsis.
  naturalness: “በማዕድ ዙሪያ ተደገፈ” is understandable, but “በማዕድ ተደግፎ ተቀመጠ” is more idiomatic modern Amharic and makes clear that the posture is specifically for a meal. Explicitly supplying “ተቀመጡ” for the apostles is natural and preserves the intended shared action.
  terminology: “ሰዓት,” “ማዕድ,” and “ሐዋርያት” are appropriate, established, and suitably dignified terms. The cultural note should describe the posture without making it sound as though the Greek verb means only leaning on one’s side in every detail.
  issues:
  - severity: medium
    issue: The apostles are said only to have been present with Jesus.
    rationale: The Greek construction has an ellipsis after “the apostles with him,” in context meaning that they likewise reclined for the meal. “ነበሩ” weakens this action to simple presence.
  - severity: low
    issue: The main verb is phrased somewhat awkwardly.
    rationale: “በማዕድ ዙሪያ ተደገፈ” can suggest merely leaning around a table. “ተደግፎ ተቀመጠ” more naturally expresses the ancient dining posture while retaining its cultural specificity.
  revised_text: ሰዓቱ በደረሰ ጊዜ፣ እርሱ በማዕድ ተደግፎ ተቀመጠ[a]፤ ሐዋርያቱም ከእርሱ ጋር ተቀመጡ።
  revised_footnotes:
  - marker: a
    text: «ተደግፎ ተቀመጠ» የሚለው በጥንት ዘመን ምግብ ለመብላት በተለመደው የመደገፍ አቀማመጥ መቀመጥን ያመለክታል።
    reason: cultural_note
  revision_rationale: The revision retains the definite “hour,” the narrative connective, and the historically specific dining posture. It also supplies, in idiomatic Amharic, the meal action understood for the apostles in the Greek elliptical clause, rather than reducing their role to mere accompaniment.
