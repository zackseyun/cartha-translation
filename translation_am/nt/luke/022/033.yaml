source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: am
  text: እርሱ ግን፣ “ጌታ ሆይ፣ ከአንተ ጋር ወደ እስር ቤትም ወደ ሞትም ለመሄድ ዝግጁ ነኝ” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱ ግን
  rationale: ὁ በዚህ ስፍራ ተውላጠ ስም ሆኖ ጴጥሮስን ያመለክታል፤ δέ ደግሞ ከቀደመው የኢየሱስ ንግግር ጋር ያለውን ቀላል ተቃርኖ ስለሚያሳይ “ግን” ተመርጧል።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: የግሪኩን ግስና ቀጥተኛ ያልሆነውን ተሳቢ በተፈጥሯዊ አማርኛ ያቀርባል፤ ተሳቢው ኢየሱስ መሆኑን በዋናው ጽሑፍ ከምንጩ በላይ አይገልጽም።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛ ጥሪን በተፈጥሯዊና ክብር ባለው አማርኛ ያሳያል፤ κύριος ያለውን የክብርና የማዕረግ ክብደት ይጠብቃል።
- source_word: μετὰ σοῦ
  choice: ከአንተ ጋር
  rationale: μετά ከዘር አገባብ ጋር ያለውን የአብሮነት ትርጉም በትክክልና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἕτοιμός εἰμι
  choice: ዝግጁ ነኝ
  rationale: የጴጥሮስን ዝግጁነትና እርግጠኛ ፈቃድ አጭርና ተፈጥሯዊ በሆነ አገላለጽ ይገልጣል።
- source_word: καὶ ... καὶ
  choice: …ም …ም
  rationale: የተያያዘውን καὶ ... καὶ አወቃቀር በአማርኛ ሁለቱንም መዳረሻዎች በእኩል አጽንዖት በሚያስተሳስረው ቅጥያ “-ም … -ም” ያቀርባል።
- source_word: εἰς φυλακὴν
  choice: ወደ እስር ቤት
  rationale: εἰς ያለውን አቅጣጫዊ ኃይልና φυλακή በዚህ አውድ ያለውን የእስር ትርጉም ግልጽ አድርጎ ያቀርባል።
- source_word: εἰς θάνατον
  choice: ወደ ሞት
  rationale: ከ“ወደ እስር ቤት” ጋር ያለውን ትይዩነት ይጠብቃል፤ ጴጥሮስ እስከ ሞት ድረስ ለመሄድ ፈቃደኛ መሆኑን ያሳያል።
- source_word: πορεύεσθαι
  choice: ለመሄድ
  rationale: የἕτοιμός εἰμι ማሟያ የሆነውን የመንቀሳቀስና አብሮ የመጓዝ ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: κύριος ለኢየሱስ የተሰጠ የአድራሻ ማዕረግ
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: “ጌታ” የκύριοςን መደበኛ የማዕረግ ትርጉምና ክርስቶሳዊ ክብደት ይጠብቃል፤ “መምህር” ግን ትርጉሙን ወደ ማስተማር ሚና ብቻ ሊያጠብበው ይችላል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር “ወደ እስር ቤትም ወደ ሞትም” ተብሎ ተጠብቋል፤ ጴጥሮስ የሚናገረው ለኢየሱስ መሆኑ ከአውዱ የሚታወቅ በመሆኑ በዋናው ጽሑፍ ስሙ አልተጨመረም።
