  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: am
  text: ከእነርሱም መካከል የበለጠ ታላቅ ተብሎ የሚቆጠረው ማን እንደሆነ ክርክር ተነሣ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነርሱ መካከል የበለጠ ታላቅ የሚመስለው ማን እንደሆነ።” የግሪኩ ግስ “የሚመስል” ወይም “ተብሎ የሚቆጠር” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ተነሣ
  rationale: ክርክሩ መጀመሩን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ καὶ
  choice: -ም
  rationale: የδὲን ትረካዊ ትስስርና የκαὶን ጭማሪ በአማርኛው አያያዥ ቅጥያ በአጭሩ ያሳያል።
- source_word: φιλονεικία
  choice: ክርክር
  rationale: በማዕረግ ላይ የተነሣውን የቃል ግጭትና ፉክክር በግልጽ ዘመናዊ ቃል ያቀርባል።
- source_word: ἐν αὐτοῖς
  choice: ከእነርሱ መካከል
  rationale: ክርክሩ በቡድኑ ውስጥ መከሰቱን ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: τὸ τίς αὐτῶν
  choice: ማን እንደሆነ
  rationale: የክርክሩን ጉዳይ የሚገልጠውን ቀጥተኛ ያልሆነ ጥያቄ በአማርኛ ሰዋስው ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: δοκεῖ
  choice: ተደርጎ የሚቆጠረው
  rationale: በቡድኑ ዘንድ ያለውን ግምት ወይም አመለካከት ይገልጣል፤ የ‘የሚመስለው’ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: μείζων
  choice: የበለጠ ታላቅ
  rationale: የግሪኩን ንጽጽራዊ ቅርጽ ይጠብቃል፤ ‘ከሁሉ ታላቅ’ በማለት ወደ የላቀ ደረጃ አይለውጠውም።
theological_decisions:
- issue: በደቀ መዛሙርቱ መካከል የማዕረግ ንጽጽር
  choice: የበለጠ ታላቅ
  alternative: ከሁሉ ታላቅ
  rationale: μείζων ንጽጽራዊ ቅርጽ እንጂ ግልጽ የላቀ ደረጃ አይደለም፤ ስለዚህ ጽሑፉ የማይናገረውን አያጠናክርም።
- issue: የδοκεῖ የትርጉም አሻሚነት
  choice: ተደርጎ የሚቆጠረው
  alternative: የሚመስለው
  rationale: በዚህ የማዕረግ ክርክር አውድ ማኅበራዊ ግምትን የሚያመለክተው ንባብ ተመርጧል፤ የመታየት ወይም የመምሰል ንባብ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽራዊ ቅርጽና የδοκεῖ አሻሚነት ተጠብቀዋል።
