source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: am
  text: ኢየሱስ ግን በእርሱ ላይ የመጡትን የካህናት አለቆች፣ የቤተ መቅደስ አዛዦችንና ሽማግሌዎችን፣ “ወንበዴን[a] ለመያዝ እንደሚወጡ፣ በሰይፍና በዱላ ወጥታችሁብኝን?” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዘራፊ።” የግሪኩ λῃστής ዘራፊን፣ ወንበዴን ወይም አማፂ ባሕርይ ያለውን ሕገወጥ ሰው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በትረካው ውስጥ ከቀደመው ድርጊት ወደ ኢየሱስ ምላሽ የሚደረገውን ቀላል ንጽጽርና ሽግግር ያሳያል።
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: በእርሱ ላይ ወደ መጡት
  rationale: ἐπί ከተሳቢ ቅርጽ ጋር በዚህ የእስር አውድ ተቃዋሚ እንቅስቃሴን ያመለክታል፤ በአማርኛም ‘በእርሱ ላይ’ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ቃሉ አንድን ሊቀ ካህን ሳይሆን መሪ የክህነት ባለሥልጣናትን በጋራ ያመለክታል።
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: የቤተ መቅደሱ ጥበቃ አዛዦች
  rationale: የቤተ መቅደሱን ጸጥታና ጥበቃ የሚመሩ ባለሥልጣናትን ያመለክታል፤ ‘ጥበቃ አዛዦች’ ሚናቸውንና የትእዛዝ ሥልጣናቸውን በግልጽ ይገልጣል።
- source_word: πρεσβυτέρους
  choice: ሽማግሌዎች
  rationale: በአውዱ ቃሉ በዕድሜ የገፉ ወንዶችን ብቻ ሳይሆን እውቅና ያላቸውን የሕዝብ መሪዎች ያመለክታል።
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: በወንበዴ ላይ እንደሚወጣ
  rationale: ὡς ἐπί የሚለው ‘አንድን ሰው ለመያዝ እንደሚወጣ’ የሚል ኃይል አለው፤ λῃστής ደግሞ ዘራፊን፣ የታጠቀ ወንበዴን ወይም አማፂ ዓይነት ሕገወጥን ሊያመለክት ይችላል።
- source_word: ἐξήλθατε
  choice: የወጣችሁብኝ
  rationale: በቅርቡ የፈጸሙትን በእርሱ ላይ የተመራ መውጣት በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: μαχαιρῶν
  choice: ሰይፍ
  rationale: በትጥቅ የታጀበ የእስር አውድ ውስጥ መደበኛውና ተስማሚው ትርጉም ነው።
- source_word: ξύλων
  choice: ዱላ
  rationale: በቀጥታ ከእንጨት የተሠሩ ነገሮችን ሊያመለክት ቢችልም፣ እዚህ ለመምታት የሚያገለግሉ ዱላዎችን ያመለክታል።
theological_decisions:
- issue: የ λῃστής ትርጉማዊ ስፋት
  choice: ወንበዴ
  alternative: ዘራፊ፣ የታጠቀ ዘራፊ፣ አማፂ ዓይነት ሕገወጥ
  rationale: ‘ወንበዴ’ አደገኛና ኃይል የሚጠይቅ ወንጀለኛን የሚያሳየውን የኢየሱስ የንጽጽር ጥያቄ ይጠብቃል፤ ነገር ግን ቃሉ አማፂ ዓይነት ሕገወጥንም ሊያካትት ስለሚችል ይህ ስፋት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ የንግግር ቅደም ተከተል በአማርኛ ተፈጥሯዊነት ተደራጅቶ፣ የጥያቄው የወቀሳ ኃይልና የ λῃστής አሻሚነት ተጠብቀዋል።
