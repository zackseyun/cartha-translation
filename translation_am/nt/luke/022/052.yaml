  rationale: The revision corrects the central rhetorical question so that it is grammatical and natural in modern standard Amharic. ‘ለመያዝ’ makes explicit the arrest setting inherent in the Greek idiom and immediate context, without identifying λῃστής with any one disputed historical category. The revised official title avoids an unnecessary interpretive expansion, and the footnote preserves the lexical ambiguity of λῃστής.
