- from: ኢየሱስ ግን በእርሱ ላይ ወደ መጡት የካህናት አለቆች፣ የቤተ መቅደሱ ጥበቃ አዛዦችና ሽማግሌዎች፣ “በሰይፍና በዱላ የወጣችሁብኝ በወንበዴ[a] ላይ እንደሚወጣ ነውን?” አላቸው።
