- source_word: πικρῶς
  choice: መራራ ልቅሶ
  rationale: ቀጥተኛው ‘በመራራነት’ በአማርኛ ያልተፈጥሯዊ ስለሆነ፣ የሐዘኑን ከባድነትና የልቅሱን ጥልቀት በተለመደ አገላለጽ ያስተላልፋል።
