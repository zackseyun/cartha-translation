id: LUK.22.35
reference: Luke 22:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: am
  text: 'እርሱም፣ “የገንዘብ ከረጢት፣ የጉዞ ከረጢት[a] እና ጫማ ሳትይዙ በላክኋችሁ ጊዜ፣ የጎደለባችሁ ነገር ነበር?” አላቸው። እነርሱም፣ “ምንም፣” አሉ።


    [a] “የጉዞ ከረጢት” የሚለው “የጀርባ ቦርሳ” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የጉዞ ከረጢት” የሚለው “የጀርባ ቦርሳ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄτερ
  choice: ሳትይዙ
  rationale: ቃሉ እነዚህ ዕቃዎች አብረዋቸው እንዳልነበሩ ያመለክታል፤ በጉዞ አውድ ‘ሳትይዙ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: βαλλαντίου
  choice: የገንዘብ ከረጢት
  rationale: ገንዘብ ለመያዝ የሚያገለግል ቦርሳ ወይም ከረጢት ማለት ነው፤ ይህ አተረጓጎም ተግባሩን በግልጽ ያሳያል።
- source_word: πήρας
  choice: የጉዞ ከረጢት
  rationale: በጉዞ ጊዜ ስንቅና ሌሎች ዕቃዎችን ለመያዝ የሚያገለግል ከረጢትን ያመለክታል፤ ‘የጀርባ ቦርሳ’ የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ὑποδημάτων
  choice: ጫማ
  rationale: በወንጌላት የጉዞ አውድ የሚለበስ የእግር መጫሚያን፣ በተለምዶ ሳንደልን፣ ያመለክታል፤ ‘ጫማ’ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
- source_word: μή τινος ὑστερήσατε
  choice: የጎደለባችሁ ነገር ነበር?
  rationale: ጥያቄው አሉታዊ መልስ የሚጠብቅ ሲሆን፣ ὑστερέω እዚህ የሚያስፈልግ ነገር መጉደልን ያመለክታል።
- source_word: Οὐθενός
  choice: ምንም
  rationale: አጭሩንና ቀጥተኛውን ‘ምንም አልጎደለንም’ የሚል መልስ በአማርኛ በአጭሩ ያቀርባል።
- source_word: ἀπέστειλα
  choice: በላክኋችሁ ጊዜ
  rationale: በተልእኮ የመላክን ሐሳብ በቀጥታ ይገልጻል፤ የአማርኛው አውድ መላኩ ወደ ተልእኮ መሆኑን በቂ ያሳያል።
