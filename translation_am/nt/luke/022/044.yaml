  text: በከባድ ጭንቀት ውስጥ ሆኖ ይበልጥ አጥብቆ[a] ይጸልይ ነበር፤ ላቡም ወደ ምድር እንደሚወድቁ የደም ጠብታዎች መሰለ[b][c]።
