  terminology: Use an explicit comparison, “መሰለ,” for ὡσεὶ. “የደም ጠብታዎች” is a suitable main-text rendering of θρόμβοι αἵματος, with “የረጋ ደም ቁርጥራጮች” retained as a lexical alternative. Footnote a is moved to the word it explains, አጥብቆ, in accordance with the audit trail’s alternative “more earnestly/fervently.”
