    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “እንደ ደም ጠብታዎች/የረጋ ደም ቁርጥራጮች” ይላል። ይህም ላቡ ራሱ ደም ነበር ብሎ ከመወሰን ይልቅ ንጽጽሩን ይጠብቃል።
