  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: am
  text: በግቢውም መካከል እሳት አንድደው አብረው ከተቀመጡ በኋላ፣ ጴጥሮስ በመካከላቸው ተቀምጦ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጴጥሮስ በመካከላቸው ተቀመጠ።” የግሪኩ ኢምፐርፌክት ግስ በአጭሩ “ተቀመጠ” ተብሎ ሊተረጎም ቢችልም፣ “ተቀምጦ ነበር” በትዕይንቱ ውስጥ ድርጊቱ ቀጥሎ እንደነበር ይበልጥ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: እሳት አንድደው
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ ‘አንድደው’ እሳትን ማቀጣጠልን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πῦρ
  choice: እሳት
  rationale: በዐውዱ ውስጥ በግቢው የተነደደውን እሳት ያመለክታል፤ አማርኛ እዚህ ላይ የውስንነት መስተዋድድ አያስፈልገውም።
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: በግቢው መካከል
  rationale: የቦታውን አቀማመጥ ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ይጠብቃል፤ αὐλή በዚህ ዐውድ የሊቀ ካህናቱን መኖሪያ ክፍት ግቢ ያመለክታል።
- source_word: συγκαθισάντων
  choice: አብረው ከተቀመጡ በኋላ
  rationale: σύν የሚያሳየውን አብሮነት ይጠብቃል፤ የአኦሪስት ተሳቢውም ከዋናው ትዕይንት በፊት መቀመጣቸውን ያሳያል።
- source_word: ἐκάθητο
  choice: ተቀምጦ ነበር
  rationale: የግሪኩን ኢምፐርፌክት ገጽታ በመጠበቅ በዚያ ጊዜ ቀጥሎ የነበረውን ሁኔታ ያሳያል።
- source_word: μέσος αὐτῶν
  choice: በመካከላቸው
  rationale: ጴጥሮስ በቡድኑ ውስጥ መቀመጡን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: -ም
  rationale: በ‘በግቢውም’ ላይ ያለው አያያዥ -ም የδέን ለስላሳ የትረካ ቅጥያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
