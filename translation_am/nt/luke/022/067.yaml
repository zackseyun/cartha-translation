  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: am
  text: እንዲህም አሉት፤ “አንተ መሲሑ[a] ከሆንክ ንገረን።” እርሱ ግን እንዲህ አላቸው፤ “ብነግራችሁ ፈጽሞ አታምኑም፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ክርስቶስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: እንዲህም አሉት
  rationale: የአሁን ጊዜ አጋዥ ግስ የሸንጎውን ንግግር ያስገባል፤ በአማርኛ ከቀደመው ትረካ ጋር በተፈጥሮ ለማያያዝ ይህ አገላለጽ ተመርጧል።
- source_word: Εἰ σὺ εἶ
  choice: አንተ … ከሆንክ
  rationale: ግሪኩ ያለውን ግልጽ ሁኔታዊ አወቃቀር እንደ ቀጥተኛ ጥያቄ ሳይለውጥ ይጠብቃል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: በዚህ የአይሁድ ሸንጎ አውድ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ነው፤ በዘመናዊ አማርኛ የተለመደው መሲሕ ይህን ትርጉም ያስተላልፋል።
- source_word: εἰπὸν ἡμῖν
  choice: ንገረን
  rationale: ትእዛዛዊውን ኃይልና የግስ ተቀባዩን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: εἶπεν δὲ αὐτοῖς
  choice: እርሱ ግን እንዲህ አላቸው
  rationale: δέ ያለውን መጠነኛ ንፅፅር “ግን” ያሳያል፤ አገላለጹም የኢየሱስን መልስ በግልጽ ያስገባል።
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: ብነግራችሁ
  rationale: የግሪኩን ሁኔታዊ አወቃቀር በአጭርና ተፈጥሯዊ የአማርኛ ቅርጽ ይጠብቃል።
- source_word: οὐ μὴ πιστεύσητε
  choice: ፈጽሞ አታምኑም
  rationale: οὐ μή ያለውን አጽንዖታዊ ክህደት “ፈጽሞ” በማለት በግልጽ ያስተላልፋል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: የምክር ቤቱ ጥያቄ ከአይሁድ የመሲሕ ተስፋ ጋር የተያያዘ ስለሆነ፣ “መሲሑ” የማዕረጉን ትርጉም በግልጽ ያሳያል፤ “ክርስቶስ” ደግሞ የተለመደ አማራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁኔታዊ አወቃቀርና አጽንዖታዊ ክህደት ተጠብቀዋል።
