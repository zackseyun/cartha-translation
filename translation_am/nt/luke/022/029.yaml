lexical_decisions:
- source_word: κἀγὼ
  choice: እኔም
  rationale: καί + ἐγώ የሚያሳየውን ከቀደመው ንግግር ጋር ያለ ትስስርና በተናጋሪው ላይ የሚደረገውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: διατίθεμαι
  choice: እሰጣችኋለሁ
  rationale: ግሱ ማዘጋጀትን፣ በቃል ኪዳን ማስተላለፍን ወይም ሥልጣንን መስጠትን ሊያመለክት ይችላል። ከመንግሥት ጋር ባለው አገባብ ‘እሰጣችኋለሁ’ ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የቃል ኪዳን ኃይል ግን በማስታወሻ ተጠብቋል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: የስጦታውን ተቀባዮች በቀጥታ ያመለክታል።
- source_word: καθὼς
  choice: እንደ
  rationale: በኢየሱስ ድርጊትና በአብ ቀደም ሲል ባደረገው ድርጊት መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διέθετό
  choice: እንደሰጠኝ
  rationale: ከδιατίθεμαι ጋር ያለውን የግስ ትይዩነት ‘ሰጠ’ በማለት ይጠብቃል፤ ያለፈው ድርጊትም በአማርኛው ፍጹም ጊዜ ተገልጿል።
- source_word: μοι
  choice: ለእኔ / -ኝ
  rationale: ተቀባዩን የሚያሳየው ዳቲቭ በአማርኛው ‘ለእኔ’ እና በግሱ የተዋሐደው ‘-ኝ’ በተፈጥሯዊ ሁኔታ ተገልጿል።
- source_word: ὁ πατήρ μου
  choice: አባቴ
  rationale: የወልድነት ግንኙነቱን በክብር የሚገልጽ መደበኛና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: βασιλείαν
  choice: መንግሥትን
  rationale: ቃሉ ንጉሣዊ አገዛዝንም ሆነ ግዛትን ሊያመለክት ይችላል፤ በቀጣዩ ቁጥር ከገበታና ከዙፋኖች ጋር ባለው አውድ ‘መንግሥት’ ሁለቱንም የትርጉም ዘርፎች በተሻለ ሁኔታ ይጠብቃል።
