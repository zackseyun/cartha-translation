    text: ወይም፣ “አባቴ ለእኔ መንግሥትን በቃል ኪዳን እንደሰጠ፣ እኔም ለእናንተ በቃል ኪዳን እሰጣችኋለሁ።” የግሪኩ ግስ መወሰንን ወይም መስጠትን ብቻ ሳይሆን፣ በቃል ኪዳን መስጠትንም ሊያመለክት ይችላል።
