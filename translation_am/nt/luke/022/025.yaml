id: LUK.22.25
reference: Luke 22:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: am
  text: እርሱ ግን፣ “የአሕዛብ[a] ነገሥታት በእነርሱ ላይ ይገዛሉ፤ በእነርሱም ላይ ሥልጣን የሚያደርጉት ‘በጎ አድራጊዎች’[b] ይባላሉ።” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሕዝቦች።”
    reason: lexical_alternative
  - marker: b
    text: “በጎ አድራጊዎች” በጥንቱ የግሪክና የሮም ዓለም ለሕዝብ መልካም ነገር እንደሚያደርጉ ለሚታሰቡ ገዢዎች ወይም ኃያላን ደጋፊዎች ይሰጥ የነበረ የክብር ስያሜ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: ነገሥታት
  rationale: ቃሉ በአጠቃላይ ገዢዎችን ሳይሆን በተለይ ነገሥታትን ያመለክታል።
- source_word: τῶν ἐθνῶν
  choice: የአሕዛብ
  rationale: በሉቃስ ጽሑፎች ውስጥ ቃሉ ብዙውን ጊዜ አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል፤ ‘አሕዛብ’ ይህን ፍቺ በአጭሩ ያስተላልፋል።
- source_word: κυριεύουσιν
  choice: ይገዙባቸዋል
  rationale: የአማርኛው አገባብ በሌሎች ላይ ገዥነትን የመጫን ትርጉም ይይዛል፤ በዐውዱ ያለውን የበላይነት ኃይልም በተፈጥሯዊ ቋንቋ ያሳያል።
- source_word: ἐξουσιάζοντες
  choice: ሥልጣን የሚጠቀሙት
  rationale: ተሳቢው ሥልጣን መያዝን ብቻ ሳይሆን በሌሎች ላይ በተግባር መጠቀምን ያሳያል።
- source_word: εὐεργέται
  choice: በጎ አድራጊዎች
  rationale: ቃሉ በጥንቱ የግሪክና የሮም ዓለም ለገዢዎችና ለኃያላን ደጋፊዎች ይሰጥ የነበረውን የክብር ስያሜ በሚገባ ያስተላልፋል።
- source_word: καλοῦνται
  choice: ይባላሉ
  rationale: ተገብሮአዊውን ቅርጽና ሰዎቹ በዚህ ስያሜ እንደሚጠሩ የሚገልጠውን ቀጥተኛ ፍቺ ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የደቀ መዛሙርቱ ክርክር ጋር ያለውን ቀላል ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በዐውዱ ውስጥ የἐθνῶν ፍቺ
  choice: አሕዛብ
  alternative: ሕዝቦች
  rationale: ንግግሩ በአይሁድ ያልሆኑ ሕዝቦች ዘንድ የሚታየውን የፖለቲካ አገዛዝ ኢየሱስ ለደቀ መዛሙርቱ ከሚሰጠው ሥርዓት ጋር ያነጻጽራል። ‘ሕዝቦች’ የሚለው ሰፊ ፍቺ ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግርጌ ማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ቀጥለው ተቀምጠዋል፤ ይህም በተሰጠው የእንግሊዝኛ ንባብ ውስጥ የተዛወረውን የምልክት አቀማመጥ ያስተካክላል።
