  verdict: revise
  source_fidelity: The draft preserves the principal clauses and the passive sense of καλοῦνται. However, ይገዙባቸዋል is less direct than the source’s explicit ‘exercise lordship over them’; recasting it as በእነርሱ ላይ ይገዛሉ is clearer and retains the relation signaled by αὐτῶν.
  naturalness: The proposed revision is idiomatic modern standard Amharic. በእነርሱ ላይ ሥልጣን የሚያደርጉት naturally conveys the active participial idea of exercising authority.
  terminology: አሕዛብ appropriately represents the contextual sense of τῶν ἐθνῶν, with ሕዝቦች retained as a lexical alternative. በጎ አድራጊዎች is a clear rendering of εὐεργέται; quotation marks and the note correctly identify its title-like cultural force.
  issues:
  - severity: low
    issue: The wording ይገዙባቸዋል is somewhat less transparent for the explicit ‘over them’ relation in κυριεύουσιν αὐτῶν.
    rationale: Using በእነርሱ ላይ ይገዛሉ gives a more natural and direct Amharic expression while maintaining the source meaning.
  - severity: low
    issue: ሥልጣን የሚጠቀሙት can sound like ‘those who make use of authority.’
    rationale: ሥልጣን የሚያደርጉት more directly expresses the ongoing exercise of authority denoted by ἐξουσιάζοντες.
