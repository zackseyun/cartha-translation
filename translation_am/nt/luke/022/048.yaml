language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: am
  text: ኢየሱስ ግን፣ “ይሁዳ፣ የሰውን ልጅ በመሳም ትከዳለህ?[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “የሰውን ልጅ በመሳም አሳልፈህ ትሰጣለህ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: δέ ቀላል አያያዥ ቢሆንም፣ በዚህ አውድ የኢየሱስን ምላሽ ከይሁዳ ድርጊት ጋር በንጽጽር ስለሚያያይዝ ‘ግን’ ተፈጥሯዊ ነው።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: ይህ አጭርና ተፈጥሯዊ አገላለጽ የαὐτῷን ‘ለእርሱ’ ትርጉም በግስ ቅጥያው ይወክላል።
- source_word: Ἰούδα
  choice: ይሁዳ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው፤ እዚህም የጥሪ ስም ነው።
- source_word: φιλήματι
  choice: በመሳም
  rationale: የመሣሪያ ወይም የአፈጻጸም መንገድን የሚገልጸውን ዳቲቭ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ የመሳምን ተጨባጭ ድርጊትም ይጠብቃል።
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: የሰውን ልጅ
  rationale: የግሪኩን የተወሰነ ክርስቶሎጂያዊ ማዕረግ እና ከዳንኤል ጋር ያለውን የጽሑፍ ግንኙነት የሚጠብቅ የተለመደ የአማርኛ አተረጓጎም ነው።
- source_word: παραδίδως
  choice: ትከዳለህ
  rationale: በዚህ ጠላትነት ባለበት አውድ παραδίδωμι የክህደትን ሐሳብ ይይዛል፤ የአሁን ጊዜውንና የሁለተኛ መደብ ነጠላ ቅርጹንም ይወክላል። ይበልጥ ቃል በቃል የሆነው አማራጭ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የτὸν υἱὸν τοῦ ἀνθρώπου አተረጓጎም
  choice: የሰው ልጅ
  alternative: ሰብአዊው
  rationale: ሐረጉ ኢየሱስ ራሱን የሚጠራበት ማዕረግ ሆኖ ይሠራል። ‘የሰው ልጅ’ የግሪኩን አወቃቀር፣ የተለመደውን የወንጌል አጠቃቀምና የዳንኤልን ድምፀት ይጠብቃል፤ አማራጩ ግን ሐረጉን ወደ አጠቃላይ ሰብአዊነት ሊያጠብ ይችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የጥያቄው አስደንጋጭ ንጽጽር—የፍቅር ምልክት በሆነ መሳም መክዳት—በቀጥታ ተጠብቋል።
