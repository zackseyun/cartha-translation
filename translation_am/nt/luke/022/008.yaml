source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: am
  text: እንዲህ ብሎ ጴጥሮስንና ዮሐንስን ላካቸው፦ “ሄዳችሁ እንበላ ዘንድ ፋሲካውን[a] አዘጋጁልን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፋሲካን ምግብ”፤ የግሪኩ ቃል ፋሲካን በሰፊው ሊያመለክት ይችላል፤ እዚህ ግን የማዘጋጀትና የመብላት አውድ ምግቡን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ላካቸው
  rationale: የግሪኩን ቀላል የትረካ ግስ ‘ላከ’ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘-አቸው’ም ጴጥሮስንና ዮሐንስን ያመለክታል።
- source_word: εἰπών
  choice: እንዲህ ብሎ
  rationale: ተሳቢውን ከዋናው ግስ ጋር ያገናኛል፣ ቀጥሎም የንግግሩን ይዘት በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: Πορευθέντες
  choice: ሄዳችሁ
  rationale: ቅርጹ ተሳቢ ቢሆንም ከትእዛዙ ጋር የተያያዘ ቅድመ ድርጊትን ይገልጣል፤ ‘ሄዳችሁ’ ይህን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἑτοιμάσατε
  choice: አዘጋጁልን
  rationale: የብዙ ሰው ትእዛዝንና ዝግጅቱ ለተናጋሪውና ለቡድኑ መሆኑን በአንድ ተፈጥሯዊ የአማርኛ ግስ ያሳያል።
- source_word: ἡμῖν
  choice: -ልን
  rationale: የጥቅም ተቀባይነትን ‘ለእኛ’ በሚል ፍቺ ከግሱ ጋር በተዋሐደ መልኩ ያቀርባል።
- source_word: τὸ πάσχα
  choice: ፋሲካውን
  rationale: የግሪኩ ቃል በሰፊው በዓሉን፣ ምግቡን ወይም ተያያዥ የመሥዋዕት ክፍልን ሊያመለክት ስለሚችል፣ አውዱ የመብላትን ሐሳብ ቢያጠናክርም ትርጉሙ በዋናው ጽሑፍ አልተጠበበም።
- source_word: ἵνα φάγωμεν
  choice: እንበላ ዘንድ
  rationale: የἵνα ዓላማን የሚገልጽ ኃይል በክቡርና ግልጽ ዘመናዊ አማርኛ ያቀርባል፤ የመብላቱ ነገር ፋሲካው መሆኑ ከአውዱ ይገባል።
theological_decisions:
- issue: ‘ፋሲካ’ የሚለው ቃል የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘ፋሲካውን’ ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: ‘የፋሲካን ምግብ’ ወይም ‘የፋሲካውን በግ’
  rationale: የማዘጋጀትና የመብላት አውድ በተለይ ምግቡን ያመለክታል፤ ሆኖም πάσχα ራሱ ሰፋ ያለ የትርጉም ክልል ስላለው ዋናው ጽሑፍ ከምንጩ በላይ አልጠበበውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የትረካ አማርኛ ተጠቅሟል። ‘እንበላ ዘንድ’ የዓላማውን ግንኙነት በክቡር ንግግር ያሳያል፤ ‘አዘጋጁልን’ ደግሞ ትእዛዙንና ‘ለእኛ’ የሚለውን ጥቅም ተቀባይ ተፈጥሯዊ አድርጎ ያዋሕዳል።
