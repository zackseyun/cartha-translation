  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ታላቅ» እና «ታናሽ» የጽሑፉን ቀጥተኛ ንጽጽር ይጠብቃሉ፤ ማኅበራዊ ፍቺው በማስታወሻ ተብራርቷል።
