  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: am
  text: 'እናንተ ግን እንደዚያ አትሁኑ።[a] ይልቁንም፣ በመካከላችሁ ታላቅ የሆነው እንደ ታናሹ ይሁን፤[b] የሚመራውም እንደሚያገለግል ይሁን።


    [a] ወይም፣ «በእናንተ ዘንድ ግን እንዲህ አይሁን።» የግሪክኛው አገላለጽ አጭር ሲሆን፣ የኢየሱስን ደቀ መዛሙርት ቀደም ሲል ከተገለጸው ሥልጣንና ክብርን ከመሻት አካሄድ ጋር በግልጽ ያነጻጽራል።


    [b] «ታናሹ» የሚለው በማኅበራዊ ደረጃ ዝቅተኛ ወይም አነስተኛ ቦታ የነበረውን ሰው ያመለክታል፤ በዕድሜ ብቻ ታናሽ የሆነን ሰው አይደለም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእናንተ ዘንድ ግን እንዲህ አይሁን።» የግሪክኛው አገላለጽ አጭር ሲሆን፣ የኢየሱስን ደቀ መዛሙርት ቀደም ሲል ከተገለጸው ሥልጣንና ክብርን ከመሻት አካሄድ ጋር በግልጽ ያነጻጽራል።
    reason: alternative_reading
  - marker: b
    text: «ታናሹ» የሚለው በማኅበራዊ ደረጃ ዝቅተኛ ወይም አነስተኛ ቦታ የነበረውን ሰው ያመለክታል፤ በዕድሜ ብቻ ታናሽ የሆነን ሰው አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: እናንተ ግን እንደዚያ አትሁኑ
  rationale: እናንተ የሚለውን አጽንዖትና δὲ የሚያሳየውን ተቃርኖ ጠብቆ፣ በአውዱ የተገነዘበውን ከሕዝቦች ገዥዎች አካሄድ ጋር የመመሳሰል ክልከላ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀλλ’
  choice: ይልቁንም
  rationale: ከክልከላው ወደ አዎንታዊው ትእዛዝ የሚደረገውን ጠንካራ ሽግግር በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: ὁ μείζων
  choice: ታላቅ የሆነው
  rationale: የንጽጽር ቅርጹን እንደ ፍጹም የበላይነት ሳያቀርብ፣ በቡድኑ ውስጥ በደረጃ ወይም በክብር ከፍ ተደርጎ የሚታየውን ያመለክታል።
- source_word: ἐν ὑμῖν
  choice: በመካከላችሁ
  rationale: በማኅበረሰቡ ውስጥ ያለውን ግንኙነታዊ ቦታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: γινέσθω
  choice: ይሁን
  rationale: የግሪክኛውን ትእዛዛዊ ኃይል በአማርኛ በተፈጥሯዊ መንገድ ያስተላልፋል፤ በዚህ አገባብ አንድን አቋም ወይም ሚና መያዝንም ያካትታል።
- source_word: ὡς ὁ νεώτερος
  choice: እንደ ታናሹ
  rationale: νεώτερος የንጽጽር ቃል መሆኑን ጠብቆ፣ በባህላዊ አውዱ ዝቅተኛ ማኅበራዊ ቦታ የነበረውን ሰው የሚጠቁመውን ንጽጽር ይይዛል።
- source_word: ὁ ἡγούμενος
  choice: የሚመራው
  rationale: ተሳቢውን አገላለጽ ጠብቆ፣ ከጽሑፉ በላይ የፖለቲካ ወይም የተቋም ሥልጣን ትርጉም ሳያስገባ የመሪነት ተግባሩን ያሳያል።
- source_word: ὡς ὁ διακονῶν
  choice: እንደሚያገለግለው
  rationale: የሌሎችን ፍላጎት በተግባር የሚያሟላውን ሰው ያመለክታል፤ ቃሉን በኋላ ወደተቋቋመ ሃይማኖታዊ ማዕረግ አይገድበውም።
theological_decisions:
- issue: የኢየሱስ ትምህርት ስለ ደረጃና መሪነት
  choice: ጥቅሱን በደቀ መዛሙርቱ ማኅበረሰብ ውስጥ ማኅበራዊ ደረጃን እንደሚገለብጥ፣ ትሕትናንና አገልጋይነትን እንደሚያጎላ ሥነ ምግባራዊ ትእዛዝ መተርጎም
  alternative: ስለ ሹመት፣ ተቋማዊ ሥልጣን ወይም አገዛዝ የበለጠ ጠንካራ ቋንቋ መጠቀም
  rationale: ግሪክኛው «ታላቁን»ና «የሚመራውን» ከ«ታናሹ»ና «ከሚያገለግለው» ጋር ያነጻጽራል። ትርጉሙ ወደ ትሕትና የቀረበውን ጥሪ ይጠብቃል፤ የኋለኛ ዘመን ቤተ ክርስቲያናዊ መዋቅሮችን አያስገባም፣ የማኅበራዊ ደረጃ ግልበጣውንም አያደበዝዝም።
