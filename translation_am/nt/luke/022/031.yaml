  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: am
  text: “ስምዖን፣ ስምዖን፣ እነሆ፣ ሰይጣን እንደ ስንዴ ሊያበጥራችሁ አጥብቆ ጠይቋል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሊያበጥራችሁ” የሚለው ብዙ ቁጥር ነው፤ ንግግሩ ስምዖንን በስም ቢጠራም፣ የሰይጣን ጥያቄ ለደቀ መዛሙርቱ በጋራ ያመለክታል። “አጥብቆ ጠይቋል” ደግሞ “ጠይቋል” ወይም “አጥብቆ ጠይቆታል” ተብሎ ሊቀርብ ይችላል፤ ጥያቄው መፈቀዱን ግን ጽሑፉ አይናገርም።
    reason: የግሪኩን የብዙ ቁጥር ቅጽ እና ἐξῃτήσατο የሚያመለክተውን አጥብቆ መጠየቅ ያብራራል፤ መፈቀድ የሚል ያልተገለጸ ነገር እንዳይጨመር ይጠብቃል።
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የተናጋሪውን ጠንካራ የትኩረት ጥሪ በክቡርና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἐξῃτήσατο
  choice: ጠይቆ አግኝቷል
  rationale: ግሱ አጥብቆ መጠየቅን ብቻ ሳይሆን ጥያቄው ፈቃድ ማግኘቱንም ሊያመለክት ስለሚችል፣ ይህ አገላለጽ የግሪኩን ኃይል ይጠብቃል።
- source_word: ὑμᾶς
  choice: ሊያበጥራችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ቅጽን በ“-አችሁ” በግልጽ ያሳያል፤ ንግግሩ ለስምዖን ቢሆንም ጥያቄው ደቀ መዛሙርቱን በጋራ ያካትታል።
- source_word: σινιάσαι ὡς τὸν σῖτον
  choice: እንደ ስንዴ ሊያበጥራችሁ
  rationale: የእህል ማበጠርን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የሰይጣን ጥያቄ ሁኔታ
  choice: ጠይቆ አግኝቷል
  alternative: አጥብቆ ጠይቋል / ጠይቋችኋል
  rationale: ἐξῃτήσατο በዚህ አውድ ፈቃድ ማግኘትን ሊያካትት ቢችልም ፈቃዱን የሰጠውን አካል ጽሑፉ አይጠቅስም፤ ትርጉሙም ያንን አልጨመረም።
- issue: “እናንተ” የሚለው የብዙ ቁጥር አመልካች
  choice: በግሱ ውስጥ የብዙ ቁጥርን ግልጽ ማድረግ
  alternative: ነጠላ ቁጥር እንደሆነ ማቅረብ
  rationale: ὑμᾶς ብዙ ቁጥር ነው፤ ይህን መጠበቅ ንግግሩ ስምዖንን ብቻ እንዳይመለከት ያደርጋል።
