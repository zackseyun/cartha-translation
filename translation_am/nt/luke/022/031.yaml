  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። “ስምዖን፣ ስምዖን” የሚለው ድግግሞሽና “እነሆ” የሚለው የትኩረት ጥሪ ተጠብቀዋል።
