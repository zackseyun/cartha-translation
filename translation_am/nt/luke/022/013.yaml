source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: am
  text: እነርሱም ሄደው እንደ ነገራቸው አገኙ፤ ፋሲካውንም[a] አዘጋጁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የፋሲካውን ምግብ» ወይም «የፋሲካውን በግ»። የግሪኩ ቃል በሰፊው የፋሲካን በዓል፣ በተለይም ምግቡን ወይም የመሥዋዕቱን ክፍሎች ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες
  choice: ሄደው
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ግስ በፊት የተፈጸመውን ተግባር ያሳያል፤ «ሄደው ... አገኙት» በአማርኛ ተፈጥሯዊ የድርጊት ቅደም ተከተል ነው።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ ከ«እነርሱ» ጋር የተያያዘው «-ም» ይህን ፍሰት በተፈጥሮ ያሳያል።
- source_word: εὗρον
  choice: አገኙት
  rationale: ግሱ «አገኙ» ማለት ነው። የተገለጸላቸውን ሁኔታ የሚያመለክተው ነገር በዐውዱ የተረዳ ስለሆነ፣ የአማርኛው «-ት» ተሳቢ ቅጥያ ዓረፍተ ነገሩን ተፈጥሯዊ ያደርገዋል።
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: እንደነገራቸው ሆኖ
  rationale: καθώς ቀደም ሲል ኢየሱስ በተናገረውና እነርሱ ባገኙት ሁኔታ መካከል ያለውን ተዛማጅነት ያሳያል። «እንደነገራቸው ሆኖ» የፕሉፐርፌክቱን ቀደምትነትና የሁኔታውን መጣጣም በግልጽ ያቀርባል።
- source_word: ἡτοίμασαν
  choice: አዘጋጁ
  rationale: ቃሉ ለአንድ ዝግጅት አስፈላጊውን ሁሉ ማሰናዳትን ያመለክታል፤ «አዘጋጁ» ትክክለኛና ዘመናዊ አማርኛ ነው።
- source_word: τὸ πάσχα
  choice: ፋሲካውን
  rationale: πάσχα በሰፊው በዓሉን፣ በተለይም ምግቡን ወይም የመሥዋዕቱን በግ ሊያመለክት ይችላል። «ፋሲካውን» የምንጩን ስፋት ሳያጠብ ይጠብቃል።
theological_decisions:
- issue: በዐውዱ የπάσχα ወሰን
  choice: ፋሲካውን
  alternative: የፋሲካውን ምግብ / የፋሲካውን በግ
  rationale: በቅርብ ዐውዱ የፋሲካን ምግብ ስለመብላት ቢነገርም፣ የግሪኩ ቃል በዓሉን፣ ምግቡን ወይም የመሥዋዕቱን ክፍል ሊያመለክት ይችላል። ዋናው ጽሑፍ «ፋሲካውን» በማለት ይህን አሻሚነት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «እንደነገራቸው ሆኖ አገኙት» የምንጩን የቃልና የተገኘው ሁኔታ መጣጣም ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
