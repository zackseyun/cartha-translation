review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence: they went, found matters corresponding to Jesus’ prior words, and prepared the Passover. However, the supplied object in «አገኙት» and the added «ሆኖ» make the middle clause more cumbersome than the Greek requires. The Greek leaves the object implicit.'
  naturalness: «እንደነገራቸው ሆኖ አገኙት» is understandable but somewhat awkward in modern standard Amharic. «እንደ ነገራቸው አገኙ» is idiomatic and preserves the source’s implicit object.
  terminology: «ፋሲካውን» appropriately retains the breadth of τὸ πάσχα without prematurely deciding between the festival, meal, or lamb. The footnote suitably records the principal contextual alternatives.
  issues:
  - severity: low
    issue: The phrase «እንደነገራቸው ሆኖ አገኙት» is unnecessarily explicit and stylistically heavy.
    rationale: Neither «ሆኖ» nor the object suffix «-ት» is required by the Greek. Removing them gives natural Amharic while retaining the correspondence expressed by καθὼς and the prior speech expressed by εἰρήκει.
  revised_text: እነርሱም ሄደው እንደ ነገራቸው አገኙ፤ ፋሲካውንም[a] አዘጋጁ።
