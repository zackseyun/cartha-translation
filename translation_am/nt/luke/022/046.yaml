  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: am
  text: እንዲህም አላቸው፦ “ለምን ትተኛላችሁ? ወደ ፈተና እንዳትገቡ ተነሥታችሁ ጸልዩ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: ትተኛላችሁ
  rationale: የግሪኩን የአሁን ጊዜ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀναστάντες
  choice: ተነሥታችሁ
  rationale: ቃሉ በዚህ አውድ ከእንቅልፍ ተነሥቶ ወደ ጸሎት መግባትን ያመለክታል፤ ከሚከተለው ትእዛዝ ጋርም በተፈጥሯዊ ሁኔታ ተያይዟል።
- source_word: προσεύχεσθε
  choice: ጸልዩ
  rationale: የብዙ ቁጥር ትእዛዝን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: ወደ ፈተና እንዳትገቡ
  rationale: የምንጩን የመግባት ምሳሌያዊ አገላለጽ እና የἵνα μὴ ዓላማ/ውጤት አወቃቀር ይጠብቃል።
theological_decisions:
- issue: πειρασμός ፈተናን ወይም ፈታኝ ሙከራን ሊያመለክት መቻሉ
  choice: ፈተና
  alternative: ሙከራ
  rationale: “ፈተና” የቃሉን የፈታኝ ሁኔታና የኃጢአት ፈተና ሊሆን የሚችለውን ስፋት በአማርኛ ይይዛል፤ አውዱን ወደ አንድ ትርጉም ብቻ አይገድብም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። “ተነሥታችሁ ጸልዩ” የግሪኩን ተሳቢ አካልና ዋና ትእዛዝ በተፈጥሯዊ አማርኛ ያቀርባል።
