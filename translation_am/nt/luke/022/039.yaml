  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: am
  text: ወጥቶም እንደ ልማዱ[a] ወደ የወይራ ተራራ ሄደ፤ ደቀ መዛሙርቱም ተከተሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “እንደ ልማድ።”
    reason: የግሪኩ ሐረግ የልማዱን ባለቤት በቀጥታ አይገልጽም።
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ወጥቶ
  rationale: የዋናውን ግስ የሚቀድመውን ድርጊት በተፈጥሯዊ የአማርኛ ግስ ቅርጽ ያሳያል።
- source_word: ἐπορεύθη
  choice: ሄደ
  rationale: በትረካ ውስጥ የπορεύομαιን የተለመደ ትርጉም በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: κατὰ τὸ ἔθος
  choice: እንደ ልማዱ
  rationale: ድርጊቱ የተለመደ ልማድ መሆኑን ተፈጥሯዊ በሆነ አማርኛ ያሳያል፤ የባለቤትነት ቅጥያው ከዐውዱ የታወቀውን ኢየሱስን ያመለክታል።
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ወደ ወይራ ተራራ
  rationale: የቦታውን ስም ትርጉም በቀጥታ የሚያስተላልፍና ዘመናዊ አንባቢ በቀላሉ የሚረዳው አገላለጽ ነው።
- source_word: ἠκολούθησαν
  choice: ተከተሉት
  rationale: አካላዊ መከተልን በቀጥታ ይገልጻል፤ የድርጊቱ ተቀባይ በአማርኛው የነገር ቅጥያ ተገልጧል።
- source_word: οἱ μαθηταί
  choice: ደቀ መዛሙርት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ቋንቋ የታወቀ ቢሆንም አሁንም በሰፊው የሚረዳ አገላለጽ ነው፤ በግሪኩ ያልተገለጸውን ‘የእርሱ’ አይጨምርም።
- source_word: καὶ … δὲ … καὶ
  choice: ከዚያም … ም
  rationale: የትረካውን ቀጣይነትና ደቀ መዛሙርቱም አብረው መከተላቸውን በተፈጥሯዊ የአማርኛ አያያዝ ያሳያል።
theological_decisions:
- issue: ልማዱ የማን እንደሆነ በግልጽ ማድረግ
  choice: እንደ ልማዱ
  alternative: እንደ ልማድ
  rationale: የግሪኩ ሐረግ በቀጥታ ‘የእርሱ’ አይልም፣ ነገር ግን ዐውዱ ልማዱ የሄደው ሰው መሆኑን ያሳያል። የተመረጠው አገላለጽ በአማርኛ ተፈጥሯዊ ሲሆን ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- issue: ደቀ መዛሙርቱን ‘የእርሱ’ ብሎ ማብራራት
  choice: ደቀ መዛሙርት
  alternative: ደቀ መዛሙርቱ
  rationale: οἱ μαθηταί የተወሰኑትን ደቀ መዛሙርት ቢያመለክትም ‘የእርሱ’ የሚል ባለቤትነት በግሪኩ በግልጽ የለም፤ ዐውዱ ማንነታቸውን በቂ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርት’ የታወቀ መጽሐፍ ቅዱሳዊ ቃል ሆኖ ተጠብቋል፤ ‘ደብረ ዘይት’ ከዘመናዊው የከተማ ስም ጋር እንዳይምታታ ‘ወይራ ተራራ’ ተመርጧል።
