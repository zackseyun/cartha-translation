  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: am
  text: ሁሉም እንዲህ አሉት፤ «እንግዲህ አንተ የእግዚአብሔር ልጅ ነህ?» እርሱም፣ «እናንተ እኔ ነኝ ትላላችሁ»[a] አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በፍቺ፣ «እንዳላችሁት ነው» ወይም «እናንተው አላችሁት»። የኢየሱስ አባባል በዐውዱ የማረጋገጫ መልስ ነው፤ ግሪኩ ግን ቃል በቃል፣ «እናንተ እኔ ነኝ ትላላችሁ» ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ሁሉም
  rationale: ቅጽሉ በስም ተግባር የቡድኑን አባላት በሙሉ ያመለክታል፤ «ሁሉም» የጋራ አጽንኦቱን በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ንግግር የተደረሰበትን ድምዳሜ ያሳያል፤ «እንግዲህ» በጥያቄው ውስጥ ይህን የድምዳሜ ኃይል ያስተላልፋል።
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የክርስቶስን ማንነት የሚመለከት ማዕረግ ስለሆነ በአማርኛ የተለመደውና ክብደቱን የሚጠብቀው አገላለጽ ተመርጧል።
- source_word: Ὑμεῖς λέγετε
  choice: እናንተ ትላላችሁ
  rationale: በግሪኩ በግልጽ የተጠቀሰው ብዙ ቁጥር ተውላጠ ስም አጽንኦት አለው፤ «እናንተ» ይህን አጽንኦት ቃል ሳይጨመር ይጠብቃል።
- source_word: ὅτι ἐγώ εἰμι
  choice: እኔ እንደሆንሁ
  rationale: ὅτι የተነገረውን ይዘት ያስገባል፤ ἐγώ εἰμι ደግሞ ቃል በቃል «እኔ ነኝ» ሲሆን፣ ከ«ትላላችሁ» ጋር ተፈጥሯዊ የአማርኛ አገባብ «እኔ እንደሆንሁ» ነው።
theological_decisions:
- issue: የኢየሱስ መልስ ግልጽ ማረጋገጫ እንደሆነ ወይስ ቃላቱን ወደ ጠያቂዎቹ እንደሚመልስ አባባል መተርጎም
  choice: «እኔ እንደሆንሁ እናንተ ትላላችሁ» በሚል ከግሪኩ አወቃቀር ጋር ቅርብ አድርጎ ማቅረብ
  alternative: «እንዳልከው ነው» ወይም «አዎን፣ ነኝ»
  rationale: አባባሉ በዐውዱ የማረጋገጫ ኃይል ቢኖረውም፣ ግሪኩ መልሱን በቀጥታ «አዎን» ብሎ አያሰፋውም። ዋናው ጽሑፍ የቃላቱን ውጥረትና አሻሚነት ይጠብቃል፤ ፍቺያዊ አማራጮቹ በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩን አጽንኦት ለመጠበቅ «እናንተ» በግልጽ ተጠቅሷል፤ መልሱ ግን ወደ ግልጽ «አዎን» አልተስፋፋም።
