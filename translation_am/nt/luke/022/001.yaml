  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: am
  text: ፋሲካ የሚባለው የቂጣ በዓል[a] እየቀረበ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ፋሲካና የቂጣ በዓል በጥብቅ የተያያዙ አከባበሮች ነበሩ፤ በአይሁድ አጠቃቀምም አንድ ላይ ሊጠቀሱ ወይም ስሞቹ በተደራራቢ ሁኔታ ሊጠቀሱ ይችሉ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: እየቀረበ ነበር
  rationale: የግሱን ያለፈ ጊዜ ቀጣይ አኳኋን ያሳያል፤ በዓሉ በቅርብ እንደነበርና ይበልጥ እየቀረበ እንደመጣ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: በግልጽ ቃል አልተተረጎመም
  rationale: እዚህ ላይ ቀላል የትረካ ሽግግርን ያመለክታል፤ አማርኛው ዓረፍተ ነገር ያለ ተጨማሪ መስተጋብር ቃል ሽግግሩን በተፈጥሮ ያስተላልፋል።
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: የቂጣ በዓል
  rationale: በአማርኛ የእርሾ ያልገባበትን እንጀራና የአይሁድን በዓል ለመጥቀስ የተለመደውና አጭር የሆነው ስያሜ ነው።
- source_word: ἡ λεγομένη
  choice: የሚባለው
  rationale: ሉቃስ ለበዓሉ የሰጠውን ገላጭ ስያሜ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Πάσχα
  choice: ፋሲካ
  rationale: በአማርኛ የአይሁድን የማለፍ በዓል ለመጥቀስ የተለመደው መጽሐፍ ቅዱሳዊ ስያሜ ነው።
theological_decisions:
- issue: በ«የቂጣ በዓል»ና በ«ፋሲካ» መካከል ያለው ግንኙነት
  choice: ሉቃስ እንዳቀረበው «ፋሲካ የሚባለው የቂጣ በዓል» ተብሎ ተተርጉሟል።
  alternative: ሁለቱን በዓላት ፈጽሞ የተለያዩ እንደሆኑ በሚያጎላ ቴክኒካዊ አገላለጽ መተርጎም።
  rationale: የግሪክ ንባቡ ፋሲካን ለየቂጣ በዓል እንደ ገላጭ ስያሜ ያቀርባል። ትርጉሙ ይህን አገላለጽ ያቆያል፤ ታሪካዊ ልዩነታቸውንም አያጠፋም፣ ጽሑፉ ከሚለው በላይም አይለያቸውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የቂጣ በዓል» እና «ፋሲካ» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ የዓረፍተ ነገሩ ቅደም ተከተል በአማርኛ ተፈጥሯዊነት ምክንያት ገላጩን «ፋሲካ የሚባለው» ከስሙ በፊት አስቀምጧል።
