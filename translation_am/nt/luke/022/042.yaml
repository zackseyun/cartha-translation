  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: am
  text: እንዲህ አለ፦ “አባት ሆይ፣ ፈቃድህ ከሆነ፣ ይህን ጽዋ[b] ከእኔ አስወግድ[a]። ነገር ግን የእኔ ፈቃድ[c] ሳይሆን የአንተ ይሁን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን ጽዋ ከእኔ ውሰድ።” የግሪኩ ትእዛዛዊ ግስ “አስወግድ” ወይም “ውሰድ” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ጽዋ” በመጽሐፍ ቅዱስ ለአንድ ሰው የተመደበውን ድርሻ፣ ብዙ ጊዜም በተለይ ሥቃይን ወይም ፍርድን፣ የሚወክል ምሳሌ ነው።
    reason: cross_reference
  - marker: c
    text: ወይም፣ “እኔ የምፈልገው ሳይሆን አንተ የምትፈልገው ይሁን።”
    reason: alternative_reading
