theological_decisions:
- issue: የኢየሱስ ፈቃድ ከአብ ፈቃድ ጋር ያለው ግንኙነት
  choice: “የእኔ ፈቃድ ሳይሆን የአንተ ይሁን” ብሎ ቀጥተኛውን ንጽጽር ማቆየት
  alternative: “እኔ የምፈልገው ሳይሆን አንተ የምትፈልገው ይሁን”
  rationale: ጥቅሱ የኢየሱስን ፈቃድ ከአብ ፈቃድ ለይቶ ሲያቀርብ ለአብ ፈቃድ መገዛቱንም ያሳያል። ትርጉሙ ይህን መለኮታዊ ውጥረት ሳያለዝብና በኋላ የተነሳ የትምህርት ማብራሪያ ሳይጨምር ይጠብቃል።
- issue: የ“ጽዋ” ምሳሌያዊ ኃይል
  choice: “ጽዋ” የሚለውን ምስል በዋናው ጽሑፍ ማቆየት
  alternative: “ይህን ሥቃይ” ወይም “ይህን ፈተና”
  rationale: “ጽዋ” በመጽሐፍ ቅዱስ የተመደበ ድርሻን፣ በተለይም ሥቃይን ወይም ፍርድን፣ ሊወክል የሚችል ባለጠጋ ምስል ነው። በዋናው ጽሑፍ በቀጥታ መተርጎሙ ምስሉንና መጽሐፍ ቅዱሳዊ ትስስሩን ያዳክማል።
translation_notes:
