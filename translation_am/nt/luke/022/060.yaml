  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: am
  text: ጴጥሮስ ግን፣ “አንተ ሰው፣ የምትለውን አላውቅም” አለ። ገና እየተናገረ ሳለ፣ ወዲያውኑ ዶሮ ጮኸ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው ክስና በጴጥሮስ መካድ መካከል ያለውን ተቃርኖና የትረካውን ሽግግር ያሳያል።
- source_word: Ἄνθρωπε
  choice: አንተ ሰው
  rationale: የወንድ ነጠላ ጥሪውንና የንግግሩን ቀጥተኛ ቃና ይጠብቃል፤ “ጌታዬ” የሚለውን ያልተገለጸ አክብሮት አያክልም።
- source_word: οὐκ οἶδα
  choice: አላውቅም
  rationale: የοἶδαን በአሁን ጊዜ የሚሰማ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὃ λέγεις
  choice: የምትለውን
  rationale: ጴጥሮስ የሌላውን ሰው ንግግር እንዳላወቀ የሚገልጸውን ቀጥተኛ መካድ ይጠብቃል።
- source_word: παραχρῆμα
  choice: ወዲያውኑ
  rationale: ያለ ምንም መዘግየት መከሰቱን በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: ገና እየተናገረ ሳለ
  rationale: የጴጥሮስ ንግግርና የዶሮው ጩኸት በጊዜ መደራረባቸውን፣ በተለይም ἔτι የሚያጎላውን “ገና” ይጠብቃል።
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: ዶሮ ጮኸ
  rationale: በአማርኛ የዶሮን ድምፅ በተለመደው አገላለጽ ያቀርባል፤ ἀλέκτωρ በዚህ አውድ ወንድ ዶሮን ያመለክታል።
theological_decisions: []
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪክ ንባቡ ያልያዘውን የግርጌ ማስታወሻ አልተጨመረም፤ በቀረበው የእንግሊዝኛ ንባብ ያለው [a] ምልክትና ማስታወሻ እርስ በርሳቸው የማይዛመዱ ይመስላሉ።
