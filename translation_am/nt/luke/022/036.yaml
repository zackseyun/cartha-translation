  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: am
  text: እርሱም፣ “አሁን ግን የገንዘብ ከረጢት ያለው ይውሰደው፤ እንዲሁም የጉዞ ከረጢት[a] ይውሰድ፤ የሌለውም መጎናጸፊያውን ሸጦ ሰይፍ[b] ይግዛ።” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የጉዞ ከረጢት” ተብሎ የተተረጎመው የግሪክ ቃል (πήρα) “ከረጢት” ወይም “የጀርባ ቦርሳ” ማለትም ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ሰይፍ” ተብሎ የተተረጎመው የግሪክ ቃል (μάχαιρα) እንደ ጩቤ ወይም አጭር ሰይፍ ያለ አጭር ስለታማ መሣሪያንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: አሁን ግን
  rationale: ከቀደመው መመሪያ ጋር ያለውን ጠንካራ ንጽጽርና የጊዜውን ለውጥ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βαλλάντιον
  choice: የገንዘብ ከረጢት
  rationale: ገንዘብ ለመያዝ የሚያገለግል ከረጢትን በግልጽ ያመለክታል።
- source_word: ἀράτω
  choice: ይውሰደው
  rationale: በጉዞ ዝግጅት አውድ ውስጥ አብሮ መውሰድን የሚገልጽ ተፈጥሯዊ የትእዛዝ አገላለጽ ነው።
- source_word: πήραν
  choice: የጉዞ ከረጢት
  rationale: የመንገደኛ ከረጢት ወይም ቦርሳ መሆኑን ለዘመናዊ አንባቢ በግልጽ ያስተላልፋል፤ ሌሎች አማራጮች በማስታወሻ ተጠቅሰዋል።
- source_word: ὁ μὴ ἔχων
  choice: የሌለውም
  rationale: በግሪኩ ያልተገለጸውን የነገር ተሳቢ ሳይጨምር የአገላለጹን አጭርነትና አሻሚነት ይጠብቃል።
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: መጎናጸፊያውን
  rationale: ἱμάτιον የሚያመለክተውን የውጭ ልብስ በክብር ባለውና በሚገባ ግልጽ የአማርኛ ቃል ያቀርባል።
- source_word: μάχαιραν
  choice: ሰይፍ
  rationale: ቃሉን ያለ ትርጓሜያዊ ማለስለስ በሰፊው በሚታወቀው መደበኛ ቃል ይተረጉማል፤ ጩቤ ወይም አጭር ሰይፍ ሊሆን የሚችለው የቃሉ ስፋት በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ኢየሱስ ሰይፍ ስለመግዛት የሰጠውን ትእዛዝ ቃል በቃል ማቅረብ ወይስ ኃይሉን በትርጓሜ ማለስለስ
  choice: “ሰይፍ ይግዛ” በማለት ቀጥተኛውን ትእዛዝ መጠበቅ
  alternative: “መሣሪያ ይግዛ” ወይም አደጋን በምሳሌያዊ መንገድ እንዲዘጋጅ ማለት
  rationale: የግሪኩ ጽሑፍ μάχαιρα የሚለውን ቃልና ቀጥተኛ ትእዛዝ ይጠቀማል። ትርጉሙ ይህን የሥነ መለኮት ውጥረት ሳይፈታ ይጠብቃል፤ ትእዛዙ ቃል በቃል ወይም ምሳሌያዊ መሆኑን መወሰን የማብራሪያ ሥራ እንጂ የትርጉም ሥራ አይደለም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ቀጥተኛ ትእዛዞች ተጠብቀዋል፤ በὁ μὴ ἔχων ውስጥ ያልተገለጸው ተሳቢ በአማርኛም ሳይሞላ ቀርቷል። የእንግሊዝኛው ማስታወሻ ምልክቶች ከሚያብራሯቸው ቃላት ጋር እንዲዛመዱ [a] በ“የጉዞ ከረጢት” ላይ፣ [b] በ“ሰይፍ” ላይ ተቀምጠዋል።
