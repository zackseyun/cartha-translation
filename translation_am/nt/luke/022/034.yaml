review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the temporal structure and the threefold denial, but its denial-content clause reverses the intended sense: “እንደማታውቀኝ ... እስክትክድ” means denying that one does not know Jesus, rather than denying that one knows him. The source’s εἰδέναι must be represented as Peter’s denial of knowing Jesus. Also, ἀλέκτωρ specifically denotes a rooster, so “ወንድ ዶሮ” is preferable to the gender-neutral “ዶሮ.”'
  naturalness: The revised wording is clear, modern standard Amharic and retains a respectful scriptural register. “ጴጥሮስ ሆይ” appropriately conveys the vocative.
  terminology: “መካድ” accurately renders ἀπαρνέομαι here, while “ወንድ ዶሮ” makes explicit the rooster sense of ἀλέκτωρ. The revised complement clause retains the stated content of the denial without adding theological interpretation.
  issues:
  - severity: high
    issue: The denial-content clause has the polarity reversed.
    rationale: “እንደማታውቀኝ ... እስክትክድ” says Peter will deny that he does not know Jesus. Greek με ἀπαρνήσῃ εἰδέναι means that Peter will deny knowing Jesus; in Amharic this is naturally expressed as “እኔን ታውቀኛለህ ብለህ ... ትክዳለህ.”
  - severity: medium
    issue: “ዶሮ” does not explicitly identify the rooster.
    rationale: Although context may suggest crowing, ἀλέκτωρ is specifically a rooster. “ወንድ ዶሮ” preserves this lexical specificity in modern Amharic.
  revised_text: እርሱ ግን፣ “ጴጥሮስ ሆይ፣ እልሃለሁ፤ እኔን ታውቀኛለህ ብለህ ሦስት ጊዜ እስክትክድ ድረስ፣ ዛሬ ወንድ ዶሮ አይጮኽም” አለው።[a]
