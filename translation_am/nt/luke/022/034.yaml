  to: እርሱ ግን፣ “ጴጥሮስ ሆይ፣ እልሃለሁ፤ እኔን ታውቀኛለህ ብለህ ሦስት ጊዜ እስክትክድ ድረስ፣ ዛሬ ወንድ ዶሮ አይጮኽም” አለው።[a]
