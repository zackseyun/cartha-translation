  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: am
  text: እርሱ ግን፣ “ጴጥሮስ ሆይ፣ እልሃለሁ፤ እኔን ታውቀኛለህ ብለህ ሦስት ጊዜ እስክትክድ ድረስ፣ ዛሬ ወንድ ዶሮ አይጮኽም” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔን ታውቀኛለህ ብለህ ሦስት ጊዜ ከመካድህ በፊት፣ ዛሬ ወንድ ዶሮ አይጮኽም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: እርሱ ግን ... አለው
  rationale: δέ በአውዱ ያለውን ቀላል ንጽጽር በ“ግን” ያስተላልፋል፤ የአማርኛው ቀጥተኛ ንግግር አቀራረብ ግስን በመጨረሻ ማኖሩ ተፈጥሯዊ ነው።
- source_word: Λέγω σοι
  choice: እልሃለሁ
  rationale: የአሁን ጊዜውን λέγω እና ለአንድ ወንድ ተናጋሪ የተመራውን σοι በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: Πέτρε
  choice: ጴጥሮስ ሆይ
  rationale: የግሪኩን የጥሪ ቅርጽ በአማርኛው “ሆይ” ይጠብቃል፤ ስሙም በተለመደው የአማርኛ ቅጽ ቀርቧል።
- source_word: οὐ φωνήσει ... ἀλέκτωρ
  choice: ዶሮ አይጮኽም
  rationale: ἀλέκτωρ በዚህ አውድ ወንድ ዶሮን ያመለክታል፤ “ዶሮ መጮኽ” በአማርኛ የተፈጥሮ አገላለጽ ነው። የግሪኩ ስም ያለ መስተዋድድ በመሆኑ አጠቃላይ “ዶሮ” ተመርጧል።
- source_word: σήμερον
  choice: ዛሬ
  rationale: ቀጥተኛ፣ ዘመናዊና ግልጽ የጊዜ አቻ ነው።
- source_word: ἕως
  choice: እስክት... ድረስ
  rationale: በአሉታዊው ዋና ሐረግ የተወሰነውን የጊዜ ወሰን ይጠብቃል። “ከ... በፊት” የሚለው አማራጭ በእግር ማስታወሻው ቀርቧል።
- source_word: τρίς
  choice: ሦስት ጊዜ
  rationale: የግሪኩን ተውሳከ ግስ በዘመናዊና ቀላል አማርኛ ያቀርባል።
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: እኔን እንደማታውቀኝ ... እስክትክድ
  rationale: εἰδέναι የክህደቱን ይዘት—ኢየሱስን ማወቁን መካድ—በግልጽ ያሳያል። ባዶ “እኔን እስክትክድ” በማለት ትርጉሙን አያሰፋም።
theological_decisions:
- issue: የጴጥሮስ የተነገረለት ክህደት ባሕርይ
  choice: እኔን እንደማታውቀኝ ሦስት ጊዜ እስክትክድ
  alternative: እኔን ሦስት ጊዜ እስክትክድ
  rationale: εἰδέναι በግልጽ የተጠቀሰ ስለሆነ፣ ትንቢቱ ጴጥሮስ ኢየሱስን እንደማያውቀው መካዱን ይገልጻል። ጽሑፉ ከሚለው በላይ ወደ ሰፊ የታማኝነት ክህደት አልተተረጎመም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ሆይ” የግሪኩን የጥሪ ቅርጽ ለመጠበቅ ተወስኗል፤ ጥቅሱ በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር ሥርዓት ተዋቅሯል።
