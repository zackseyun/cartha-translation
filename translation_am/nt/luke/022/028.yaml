review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the emphatic plural subject, the adversative δέ, association with Jesus, and the plural πειρασμοῖς. However, «ጸንታችሁ» adds an explicit nuance of steadfast endurance that is compatible with the context but is not stated by διαμεμενηκότες, whose core sense is continued/remained.
  naturalness: The sentence is clear and modern, but «ከእኔ ጋር የቆያችሁ» is more direct and idiomatic for the Greek perfect participle than «ጸንታችሁ የቆያችሁ».
  terminology: «ፈተናዎቼ» appropriately retains the lexical breadth of πειρασμοῖς. The note should give genuine lexical alternatives without treating paraphrastic «በተፈተንኩባቸው ጊዜያት» as a direct equivalent.
  issues:
  - severity: low
    issue: Added explicit sense of steadfastness
    rationale: «ጸንታችሁ» can suggest perseverance under pressure, whereas διαμένω primarily says that the disciples continued or remained with Jesus. Removing it better preserves the source's wording while leaving the contextual implication available.
  - severity: low
    issue: Footnote's first alternative is paraphrastic
    rationale: «በተፈተንኩባቸው ጊዜያት» explains an interpretation rather than supplying a lexical alternative to πειρασμοῖς. A note should distinguish the word's possible senses and state the contextual preference.
