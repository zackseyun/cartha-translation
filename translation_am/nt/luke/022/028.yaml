  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: am
  text: እናንተ ግን በፈተናዎቼ[a] ከእኔ ጋር የቆያችሁ ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሙከራዎቼ» ወይም «በመከራዎቼ»። የግሪኩ ቃል ፈተናን፣ ሙከራን ወይም መከራን ሊያመለክት ይችላል፤ በዚህ ስፍራ ኢየሱስ ያለፈባቸውን ከባድ ሁኔታዎች የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: እናንተ
  rationale: በግሪክ ዓረፍተ ነገሩ መጀመሪያ ላይ የተቀመጠውን የሁለተኛ መደብ ብዙ ቁጥር አጽንዖት በግልጽ ያሳያል።
- source_word: δέ
  choice: ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ διαμεμενηκότες
  choice: ጸንታችሁ የቆያችሁ
  rationale: ግሱ እስከ አሁን የቀጠለ መቆየትንና በችግር ውስጥ ጽናትን ያመለክታል፤ ይህ አገላለጽ የፍጹም ጊዜውን ቀጣይ ውጤት ይጠብቃል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: አብሮነትንና አጋርነትን በቀጥታ የሚገልጽ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: በፈተናዎቼ
  rationale: πειρασμός ፈተናን፣ መፈተንን ወይም የሚያስቸግር አደጋን ሊያመለክት ይችላል። «ፈተና» በአማርኛም ይህን ስፋት በከፊል ስለሚጠብቅ የጽሑፉን አሻሚነት ሳያጠፋ ከዐውዱ ጋር ይስማማል።
theological_decisions:
- issue: πειρασμοῖς ኢየሱስን በሚመለከት ያለው ትርጉም
  choice: ኢየሱስ ያለፈባቸው ፈተናዎችና መከራዎች
  alternative: ኢየሱስ የተፈተነባቸው የፈተና ሁኔታዎች
  rationale: ዐውዱ ደቀ መዛሙርቱ በአገልግሎቱ ተቃውሞና መከራ ጊዜ ከኢየሱስ ጋር መቆየታቸውን ያጎላል። ሆኖም የግሪኩ ቃል የመፈተንን ትርጉምም ስለሚይዝ፣ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ጸንታችሁ የቆያችሁ» ቀጣይ ታማኝነትን በተፈጥሯዊ አገላለጽ ያሳያል።
