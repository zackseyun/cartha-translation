  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: am
  text: እነርሱም፣ “ከእንግዲህ ምስክርነት ለምን ያስፈልገናል?[a] እኛ ራሳችን ከአፉ ሰምተናልና” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከዚህ በኋላ ለምስክርነት ምን ፍላጎት አለን?”
    reason: lexical_alternative
lexical_decisions:
