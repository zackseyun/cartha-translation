- source_word: ἔχομεν μαρτυρίας χρείαν
  choice: ምስክርነት … ያስፈልገናል
  rationale: χρείαν ἔχειν ‘ያስፈልጋል’ የሚለውን ፍቺ ይሰጣል፤ “ምስክርነት” ደግሞ የፍርድ ሂደቱን አውድ በግልጽ ይጠብቃል።
- source_word: αὐτοὶ γὰρ
  choice: እኛ ራሳችን … ና
  rationale: “እኛ ራሳችን” የαὐτοὶን አጽንኦት ይጠብቃል፤ “-ና” የγὰρን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἠκούσαμεν
