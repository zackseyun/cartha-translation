- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: ከአፉ
  rationale: የቃል በቃል ቀጥተኛ ሰሚነትን የሚገልጽ አጭርና ተፈጥሯዊ አማርኛ ነው። “ከራሱ አፍ” ማለት በግሪኩ ያልተለየ ቃል ሊጨምር ስለሚችል አልተመረጠም።
theological_decisions:
