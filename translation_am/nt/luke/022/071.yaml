  choice: “ከአፉ ሰምተናል” ተብሎ የተሰማው ነገር ሳይጨመር ቀርቷል።
  alternative: “ምስክርነቱን ከአፉ ሰምተናል” ወይም “ያለውን ከአፉ ሰምተናል”
  rationale: ግሪኩ ከ“ሰማን” በኋላ ግልጽ ተሳቢ አያቀርብም። “ምስክርነት” ወይም “ክስ የሚያስከትል ንግግር” ብሎ መጨመር ጽሑፉ ያልገለጸውን ትርጓሜ ይወስናል።
