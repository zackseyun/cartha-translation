  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: am
  text: ጽዋ ተቀብሎ አመስግኖ፣ “ይህን ውሰዱና በመካከላችሁ አከፋፍሉት።” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεξάμενος
  choice: ተቀብሎ
  rationale: የግሪኩ የቀደመ ድርጊት ቅጽ ጽዋውን መቀበሉ ከማመስገኑና ከመናገሩ በፊት መሆኑን ያሳያል፤ «ተቀብሎ» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ποτήριον
  choice: ጽዋም
  rationale: ስሙ በግሪክ የውስንነት አመልካች የሌለው ቢሆንም፣ አማርኛ እንደ እንግሊዝኛ የ«አንድ/ያ» ልዩነትን ሁልጊዜ አያስገድድም። «ጽዋም» ያልተወሰነውን አገላለጽ ሳይጨምር የዐውዱን ዕቃ ይገልጣል።
- source_word: εὐχαριστήσας
  choice: ካመሰገነ በኋላ
  rationale: ከዋናው ግስ በፊት የተፈጸመውን የምስጋና ድርጊት ግልጽ ያደርጋል፤ ኋለኛ ሥርዓተ አምልኮዊ ቃላትንም አያስገባም።
- source_word: εἶπεν
  choice: አለ
  rationale: ግሪኩ ተቀባይን በግልጽ ሳይጨምር «አለ» ብቻ ይላል፤ ይህም በአማርኛ ተፈጥሯዊ ነው።
- source_word: Λάβετε
  choice: ውሰዱ
  rationale: በምግብ ማዕድ ዐውድ የቀጥታውን ትእዛዝ በተፈጥሯዊና በግልጽ ሁኔታ ያቀርባል።
- source_word: τοῦτο
  choice: ይህን
  rationale: ግሪኩ ስሙን እንደገና ሳይደግም አመልካቹን ብቻ ይጠቀማል፤ «ይህን» ያንን አጭርነት ይጠብቃል።
- source_word: διαμερίσατε
  choice: ተካፈሉት
  rationale: ግሱ መከፋፈልን ወይም ማከፋፈልን ሊያመለክት ይችላል። በዚህ የጋራ ጽዋ ዐውድ «ተካፈሉት» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የማከፋፈል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: εἰς ἑαυτούς
  choice: በመካከላችሁ
  rationale: በቡድኑ ውስጥ እርስ በርስ የሚደረገውን መካፈል በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: εὐχαριστήσας እና ποτήριον ሲተረጎሙ የቁርባን ሥርዓታዊ ቋንቋ መጠቀም ወይም አለመጠቀም
  choice: ተራ የትረካ ቋንቋ፦ «ጽዋ» እና «አመሰገነ»
  alternative: የተወሰነነትን ወይም ጠንካራ ሥርዓተ ቁርባን ፍቺን የሚያስገባ አተረጓጎም
  rationale: ጥቅሱ ኢየሱስ በማዕድ ላይ ያደረገውን በቀጥታ ይተርካል። የግሪኩ ቃላት በራሳቸው የኋለኛውን ቤተ ክርስቲያናዊ ሥርዓት ቃላት አያስገድዱም፤ ስለዚህ ያልተገለጸ የእምነት ዝርዝር አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጽዋ» የመጽሐፍ ቅዱስ ዐውድን የሚመጥን የታወቀ ቃል ሲሆን፣ አገባቡ ግን ከባድ ወይም ጥንታዊ እንዳይሆን በቀላል አወቃቀር ቀርቧል።
