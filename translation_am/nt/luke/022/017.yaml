revisions:
- from: ጽዋም ተቀብሎ ካመሰገነ በኋላ፣ “ይህን ውሰዱና በመካከላችሁ ተካፈሉት[a]” አለ።
  to: ጽዋ ተቀብሎ አመስግኖ፣ “ይህን ውሰዱና በመካከላችሁ አከፋፍሉት።” አለ።
  rationale: The revision removes the unsupported additive meaning in «ጽዋም», retains the source’s two antecedent participial actions through natural Amharic converbs, and renders the imperative with an explicit distribution verb. The lexical alternative preserves the viable contextual nuance of sharing/partaking without altering the main translation.
