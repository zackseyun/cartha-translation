  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጽዋ’ እና ‘ቃል ኪዳን’ የመጽሐፍ ቅዱስን ክብር የሚጠብቁ ሆነው በሰፊው የሚታወቁ ቃላት ናቸው።
