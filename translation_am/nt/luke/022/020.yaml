  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: am
  text: ከራትም በኋላ ጽዋውን እንዲሁ አንሥቶ እንዲህ አለ፦ “ይህ ጽዋ በደሜ የሆነው አዲሱ ቃል ኪዳን[a] ነው፤ ይህም ደም ስለ እናንተ የሚፈሰው ነው።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አዲሱ ኑዛዜ” ተብሎም ሊተረጎም ይችላል፤ ነገር ግን በዚህ አውድ “ቃል ኪዳን” የግሪኩን διαθήκη ትርጉም ይበልጥ በግልጽ ያስተላልፋል።
    reason: alternative_reading
  - marker: b
    text: በግሪክ አጻጻፍ “ስለ እናንተ የሚፈሰው” የሚለው ከሙሉው ሐረግ በኋላ ይመጣል፤ በአውዱ ግን በተፈጥሯዊ ሁኔታ የሚያመለክተው የኢየሱስን ደም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: ጽዋ
  rationale: በዘመናዊ የመጽሐፍ ቅዱስ አማርኛ የመጠጫውን ዕቃ በግልጽና በክብር የሚገልጽ ሲሆን፣ ግሪኩ የማይጠይቀውን ልዩ ሥርዓታዊ ትርጉም አያስገባም።
- source_word: ὡσαύτως
  choice: እንዲሁ
  rationale: ድርጊቱን በቀደመው ቁጥር ከተጠቀሰው የእንጀራ ድርጊት ጋር ያያይዛል።
- source_word: μετὰ τὸ δειπνῆσαι
  choice: ከራት በኋላ
  rationale: የግሪኩን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: λέγων
  choice: እንዲህ አለ
  rationale: የግሪኩን አገናኝ ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: καινὴ διαθήκη
  choice: አዲሱ ቃል ኪዳን
  rationale: διαθήκη በዚህ የአይሁድና የመጽሐፍ ቅዱስ አውድ የኪዳን ግንኙነትን ያመለክታል፤ ‘ቃል ኪዳን’ የብሉይ ኪዳንን ዳራ ይጠብቃል።
- source_word: ἐν τῷ αἵματί μου
  choice: በደሜ የሚመሠረተው
  rationale: ἐν የሚገልጸውን የደምና የኪዳን ግንኙነት በግልጽ አማርኛ ያቀርባል፤ ‘በደሜ’ የሚለውን ቅርጽም ይጠብቃል።
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: ይህም ደም ስለ እናንተ የሚፈስ ነው
  rationale: በአውዱ የሚፈሰው ደም መሆኑን በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል፤ ὑπὲρን ‘ስለ እናንተ’ ብሎ መተርጎም ለእነርሱ ሲል የሚደረገውን መሥዋዕታዊ ድርጊት ያሳያል እንጂ አንድን የሥርየት ንድፈ ሐሳብ አይጭንም።
theological_decisions:
- issue: διαθήκηን በጌታ እራትና በኪዳን አውድ መተርጎም
  choice: አዲሱ ቃል ኪዳን
  alternative: አዲሱ ኑዛዜ
  rationale: የደም ቋንቋው በደም የሚጸናውን የብሉይ ኪዳን ዳራ ያስታውሳል፤ ‘ቃል ኪዳን’ ይህን ዳራ ከ‘ኑዛዜ’ ይልቅ በትክክል ይጠብቃል።
- issue: ἐκχυννόμενον የሚለው ቦዝ አንቀጽ የሚመለከተው
  choice: በትርጉም ደረጃ ‘ደሜ’ን እንደሚመለከት ማቅረብ
  alternative: በቅርጽ ከ‘ጽዋ’ ጋር በቀጥታ ማያያዝ
  rationale: ቦዝ አንቀጹ ከሙሉው አረፍተ ነገር በኋላ መምጣቱ ሰዋሰዋዊ ውጥረትን ቢፈጥርም፣ በመሥዋዕታዊው አውድ የሚፈሰው የኢየሱስ ደም እንጂ የመጠጫው ዕቃ አይደለም። የግሪኩ አቀማመጥ ግን በማስታወሻ ተጠብቋል።
