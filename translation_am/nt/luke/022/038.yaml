  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: am
  text: እነርሱም፣ “ጌታ ሆይ፣ እነሆ፣ ሁለት ሰይፎች እዚህ አሉ” አሉ። እርሱም፣ “በቂ ነው” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቃ!” ይህ ሁለቱ ሰይፎች በቂ ናቸው ከማለት ይልቅ፣ ውይይቱ እንዲቋረጥ ማለቱ ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉት
  rationale: δέ ቀላል የትረካ አያያዥ ስለሆነ “-ም” የትረካውን ፍሰት በተፈጥሯዊ አማርኛ ያስቀጥላል፤ የንግግሩ ተቀባይም በ“አሉት” ተገልጧል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ የቀረበውን ቀጥተኛና አክብሮታዊ አድራሻ የሚገልጽ የተለመደ የአዲስ ኪዳን አተረጓጎም ነው።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የተናጋሪዎቹን ትኩረት ወደሚያሳዩት ነገር የሚጠራውን ኃይል በክቡርና በሚታወቅ አማርኛ ያስተላልፋል።
- source_word: μάχαιραι
  choice: ሰይፎች
  rationale: μάχαιρα ምላጭ ያለውን የጦር መሣሪያ ያመለክታል፤ “ሰይፍ” የተለመደና ያለአስፈላጊ ዝርዝር የሚተረጉም ቃል ነው።
- source_word: ὧδε δύο
  choice: በዚህ ሁለት … አሉ
  rationale: ὧδε የሚያመለክተውን ቦታና δύο የሚገልጸውን ቁጥር በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ያቀርባል።
- source_word: Ἱκανόν ἐστιν
  choice: ይበቃል
  rationale: አጭርና ተፈጥሯዊ ሲሆን፣ ሁለቱ ሰይፎች በቂ ናቸው ማለቱን ወይም ውይይቱ ይብቃ ማለቱን ሳይወስን የግሪኩን አሻሚነት ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ መልስ Ἱκανόν ἐστιν ያለው የትርጉም አሻሚነት
  choice: ይበቃል
  alternative: “ይህ በቂ ነው” ወይም “ከዚህ በቃ”
  rationale: ግሪኩ ሁለቱ ሰይፎች በቂ እንደሆኑ የሚናገር ሊሆን ይችላል፤ ወይም ኢየሱስ ውይይቱን እያቋረጠ ሊሆን ይችላል። “ይበቃል” ሁለቱንም ዕድሎች ክፍት ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እነሆ” መጽሐፍ ቅዱሳዊ ክብርን ሳያረጅ የἰδοὺን የትኩረት ጥሪ ይጠብቃል፤ “ይበቃል” የመጨረሻውን ንግግር ሆን ብሎ አሻሚ ያደርገዋል።
