review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves γάρ, the emphatic future negation οὐ μή, the temporal limit, and the location of fulfillment in God's kingdom. However, «እርሱን» is normally personal/masculine in modern Amharic and is unsuitable for the neuter, non-personal referent αὐτό. «እስኪፈጸም» more directly represents πληρωθῇ ('is fulfilled') than «ፍጻሜውን እስኪያገኝ».
  naturalness: The revised wording is more idiomatic modern standard Amharic. «ይህን» supplies a natural non-personal anaphoric object, while the implicit subject of «እስኪፈጸም» is readily understood as the Passover just mentioned.
  terminology: «እግዚአብሔር መንግሥት» appropriately retains the established biblical expression for ἐν τῇ βασιλείᾳ τοῦ θεοῦ. «እስኪፈጸም» retains fulfillment language without defining its eschatological mechanism.
  issues:
  - severity: medium
    issue: «እርሱን» is used for αὐτό.
    rationale: Although intended as an anaphoric pronoun, «እርሱን» ordinarily denotes a male person in current standard Amharic. The Greek pronoun has a non-personal, contextually Passover-related referent. «ይህን» is natural and avoids unintended personification.
  - severity: low
    issue: «ፍጻሜውን እስኪያገኝ» is less direct than the Greek passive.
    rationale: The phrase is understandable, but «እስኪፈጸም» is a more direct and idiomatic rendering of πληρωθῇ while retaining the source's open-ended fulfillment sense.
  revised_text: ምክንያቱም እላችኋለሁ፤ በእግዚአብሔር መንግሥት እስኪፈጸም ድረስ ይህን በፍጹም አልበላም[a][b]።
