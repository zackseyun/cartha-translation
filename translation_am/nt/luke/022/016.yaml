base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: am
  text: ምክንያቱም እላችኋለሁ፤ በእግዚአብሔር መንግሥት እስኪፈጸም ድረስ ይህን በፍጹም አልበላም[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእግዚአብሔር መንግሥት እስኪፈጸም ድረስ ይህን ዳግመኛ በፍጹም አልበላም።» የግሪኩ አነጋገር ወደፊት መብላትን አጥብቆ ይክዳል። አንዳንድ ትርጉሞች ከዐውዱ የሚገባውን «ዳግመኛ» በግልጽ ያክላሉ፤ ግን ቃሉ በግሪክ ጽሑፉ ውስጥ የለም።
    reason: lexical_alternative
  - marker: b
    text: «ይህን» የሚለው በቀደመው ቁጥር የተጠቀሰውን ፋሲካ ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ምክንያቱም እላችኋለሁ
  rationale: γάρ ከቀደመው ንግግር ጋር ያለውን የምክንያት ግንኙነት ይጠብቃል፤ λέγω ὑμῖν ደግሞ በተፈጥሯዊ ዘመናዊ አማርኛ «እላችኋለሁ» ተብሏል።
- source_word: ὅτι
  choice: በቀጥታ የተከተለ የንግግር ይዘት
  rationale: በአማርኛ «እላችኋለሁ» በኋላ የንግግሩን ይዘት በቀጥታ ማቅረብ ተፈጥሯዊ ነው፤ ὅτιን በተለየ ቃል አለመተርጎም የአረፍተ ነገሩን ትርጉም አያጎድልም።
- source_word: οὐ μὴ φάγω
  choice: ፈጽሞ አልበላም
  rationale: οὐ μή ከአኦሪስት ሳብጃንክቲቭ ጋር የወደፊት ድርጊትን አጥብቆ ይክዳል፤ «ፈጽሞ አልበላም» ይህን አጽንዖት በግልጽ አማርኛ ያስተላልፋል።
- source_word: αὐτό
  choice: እርሱን
  rationale: ተውላጠ ስሙ በቀደመው ቁጥር የተጠቀሰውን ፋሲካ ያመለክታል፤ በዋናው ጽሑፍ ያልተደገመውን «ፋሲካ» ሳይጨምር የግሪኩን አጭርነት ይጠብቃል።
- source_word: ἕως ὅτου
  choice: እስኪ… ድረስ
  rationale: የጊዜ ወሰኑን በተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ያሳያል።
- source_word: πληρωθῇ
  choice: ፍጻሜውን እስኪያገኝ
  rationale: የπληρόωን የመፈጸምና ወደ ሙላት የመድረስ ሐሳብ ይጠብቃል፤ ፋሲካው በምን መንገድ እንደሚፈጸም ግን አይወስንም።
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: በእግዚአብሔር መንግሥት
  rationale: «መንግሥት» የβασιλείαን የንግሥና አገዛዝና የግዛት ስፍራ ትርጉም ሊሸከም የሚችል የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
theological_decisions:
- issue: የαὐτό አመልካች
  choice: ተውላጠ ስሙ በቀደመው ቁጥር የተጠቀሰውን ፋሲካ ያመለክታል።
  alternative: በሰፊው የፋሲካን ሥርዓት ወይም ክስተት ሊያመለክት ይችላል።
  rationale: የቅርብ ዐውዱ «ይህን ፋሲካ» መብላትን ይጠቅሳል፤ «እርሱን» ማለት አመልካቹን ሳያሰፋ ወይም ሳያጠብ የግሪኩን አሻሚነት ይጠብቃል።
- issue: «በእግዚአብሔር መንግሥት ፍጻሜውን ማግኘት» የሚለው ትርጉም
  choice: የፍጻሜው መንገድና ክስተት ሳይወሰን የፍጻሜ ቋንቋው ተጠብቋል።
  alternative: ፍጻሜውን ከመንግሥቱ መምጣት ወይም ከመሲሐዊው ግብዣ ጋር በግልጽ ማመሳሰል።
  rationale: ግሪኩ የመጨረሻ ዘመን ፍጻሜን ያመለክታል፤ ይሁን እንጂ ይህ ፍጻሜ በትክክል እንዴት እንደሚሆን አይገልጽም። ትርጉሙም ይህን ሥነ መለኮታዊ ውጥረት አልፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ፈጽሞ አልበላም» የግሪኩን አጽንዖት ያስተላልፋል፤ «ፍጻሜውን እስኪያገኝ» ደግሞ የመፈጸምን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል።
