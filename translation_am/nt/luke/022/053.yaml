  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: am
  text: በየቀኑ ከእናንተ ጋር በቤተ መቅደሱ ሳለሁ፣ እጆቻችሁን በእኔ ላይ አልዘረጋችሁም[a]። ነገር ግን ይህ የእናንተ ሰዓትና የጨለማ ሥልጣን ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አልያዛችሁኝም»። የግሪኩ አነጋገር በአንድ ሰው ላይ እጅን መዘርጋት ማለት ሲሆን፣ በዚህ አውድ ለማሰር የሚደረግን የጥቃት እርምጃ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የጨለማ ኀይል»።
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: በየቀኑ
  rationale: የድርጊቱን በየዕለቱ መደጋገም በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: ከእናንተ ጋር ... ሳለሁ
  rationale: የግሪኩን genitive absolute ጊዜያዊ ሁኔታ በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ያቀርባል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢ ሊያመለክት ቢችልም፣ «ቤተ መቅደስ» በአማርኛ የተለመደና ከአውዱ ጋር ግልጽ ነው።
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: እጆቻችሁን በእኔ ላይ አልዘረጋችሁም
  rationale: የግሪኩን ምስላዊ አነጋገር ይጠብቃል፤ በአውዱም ለመያዝ የሚደረግን የጥቃት እርምጃ ያመለክታል።
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: ነገር ግን ይህ የእናንተ ሰዓት ... ነው
  rationale: «ሰዓት» ከተራ የሰዓት መለኪያ በላይ የተወሰነውን ወቅት የሚያሳይ ጥብቅ አገላለጽ ሆኖ የግሪኩን ክብደት ይጠብቃል።
- source_word: ἐξουσία
  choice: ሥልጣን
  rationale: የመግዛት፣ የመፍቀድ ወይም ተግባራዊ ኀይል ያለውን ሰፊ ትርጉም ይጠብቃል፤ ጥሬ ኀይልን ብቻ አያመለክትም።
- source_word: τοῦ σκότους
  choice: የጨለማ
  rationale: ግሪኩ የሚያቀርበውን ምሳሌያዊና መንፈሳዊ ክብደት ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
theological_decisions:
- issue: «የጨለማ ሥልጣን» የሚለውን ሰይጣን ወይም ክፋት ብሎ በግልጽ መተርጎም አለመተርጎም
  choice: የጨለማ ሥልጣን
  alternative: የጨለማ ኀይል፤ የሰይጣን ሥልጣን፤ የክፋት ግዛት
  rationale: ጽሑፉ ራሱ «ጨለማ» ይላል እንጂ ሰይጣንን በስም አይጠቅስም። ምሳሌያዊውን አገላለጽ ማቆየት የጽሑፉን መንፈሳዊ ውጥረት ይጠብቃል፣ የተወሰነ የትርጓሜ ድምዳሜም አያስገባም።
