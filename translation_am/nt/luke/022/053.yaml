  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እጆቻችሁን ... አልዘረጋችሁም» የምንጩን ምስላዊነት ሲጠብቅ፣ የግልጽ አውዳዊ ትርጉሙ በግርጌ ማስታወሻ ተገልጿል።
