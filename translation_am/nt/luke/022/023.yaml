  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: am
  text: እነርሱም ከመካከላቸው ይህን ሊያደርግ ያለው ማን ሊሆን እንደሚችል እርስ በርሳቸው መወያየት ጀመሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከመካከላቸው ይህን ሊያደርግ ያለው ማን ሊሆን እንደሚችል።» በአውዱ «ይህን» የሚለው በቀደመው ቁጥር የተነገረውን ኢየሱስን አሳልፎ የመስጠት ተግባር ያመለክታል።
