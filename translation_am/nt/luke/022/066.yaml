    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሸንጎአቸው ፊት” ወይም “ወደ ሸንጎ አዳራሻቸው።” የግሪኩ συνέδριον ምክር ቤቱን ራሱን፣ መደበኛ ጉባኤውን ወይም የሚሰበሰብበትን ስፍራ ሊያመለክት ይችላል።
