  text: ቀን ሲነጋ[a]፣ የሕዝቡ ሽማግሌዎች ሸንጎ፣ የካህናት አለቆችና ጸሐፍት ተሰበሰቡ፤ እርሱንም ወደ ሸንጎአቸው[b] ወሰዱት።
  philosophy: optimal-equivalence
  footnotes:
