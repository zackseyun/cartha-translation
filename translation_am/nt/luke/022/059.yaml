base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: am
  text: አንድ ሰዓት ያህል ካለፈ በኋላ፣ ሌላ ሰው[a]፣ “በእውነት ይህ ሰውም ከእርሱ ጋር ነበር፤ እርሱም ገሊላዊ ነውና” እያለ አጥብቆ ይናገር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሌላ ግለሰብ።” የግሪኩ አገላለጽ ያልተወሰነ ነው፤ በአገባቡ ግን ተናጋሪው ወንድ መሆኑ ይጠቆማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: አንድ ሰዓት ያህል ካለፈ በኋላ
  rationale: የግሪኩ ገላጭ ሐረግ የጊዜን ማለፍ ያመለክታል፤ ይህ አተረጓጎም ግምታዊውን ‘ያህል’ ጠብቆ በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: ἄλλος τις
  choice: ሌላ ሰው
  rationale: ሐረጉ በራሱ ያልተወሰነ ‘ሌላ አንድ/ሌላ ሰው’ ማለት ነው። ዐውደ ንባቡ ወንድ ተናጋሪን ሊጠቁም ቢችልም፣ የምንጩን ያልተወሰነነት ለመጠበቅ ‘ሰው’ ተመርጧል።
- source_word: διϊσχυρίζετο
  choice: እያለ አጥብቆ ተናገረ
  rationale: የግሱን አጽንዖት እና ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἐπ’ ἀληθείας
  choice: በእውነት
  rationale: ይህ የግሪክ ፈሊጥ የንግግሩን እውነተኛነት በአጽንዖት ይገልጣል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: ጠቋሚው ቃል ጴጥሮስን በቀጥታና በከሳሽ ቃና ያመለክታል፤ ‘እርሱ’ ከሚለው ይልቅ ‘ይህ ሰው’ ይህን ኃይል ይጠብቃል።
- source_word: μετ’ αὐτοῦ ἦν
  choice: ከእርሱ ጋር ነበር
  rationale: የኅብረትን ጥያቄ ሳያብራራ ቀጥተኛውን የግሪክ ትርጉም ይጠብቃል።
- source_word: καὶ γὰρ
  choice: እርሱም ... ነውና
  rationale: ‘-ና’ ምክንያታዊውን γάρ፣ ‘-ም’ ደግሞ የκαίን ‘ደግሞ/እንዲሁም’ ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋሉ።
- source_word: Γαλιλαῖός ἐστιν
  choice: ገሊላዊ ነው
  rationale: ጴጥሮስን በክልላዊ ማንነቱ የሚለየውን ቀጥተኛ የተሳቢ ስም አገላለጽ ይጠብቃል።
