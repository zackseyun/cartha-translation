  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: am
  text: እርሱንም ከያዙት በኋላ ወስደው ወደ የሊቀ ካህኑ ቤት አስገቡት፤ ጴጥሮስ ግን ራቅ ብሎ[a] ይከተለው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ከሩቅ” ወይም በባህላዊ አገላለጽ “በሩቅ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συλλαβόντες
  choice: ከያዙት በኋላ
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ዋናዎቹን ድርጊቶች የቀደመ እርምጃ ያመለክታል፤ በዚህ የጥበቃ አውድ ‘ያዙት’ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἤγαγον
  choice: ወስደው
  rationale: በጥበቃ ሥር ከነበረበት ስፍራ ማንቀሳቀሳቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ ከሚቀጥለው ‘አስገቡት’ ጋርም አይደጋገምም።
- source_word: εἰσήγαγον
  choice: አስገቡት
  rationale: ወደ ውስጥ የመግባትን አቅጣጫ በግልጽ ይጠብቃል።
- source_word: οἰκίαν
  choice: ቤት
  rationale: በዚህ ስፍራ ቃሉ አካላዊውን መኖሪያ ያመለክታል፤ ‘ቤት’ ቀጥተኛና የተለመደ አማርኛ ነው።
- source_word: ἀρχιερέως
  choice: ሊቀ ካህናቱ
  rationale: የአዲስ ኪዳንን ልዩ የካህናት ማዕረግ በትክክል የሚገልጽ የተለመደ አገላለጽ ነው።
- source_word: ἠκολούθει
  choice: ይከተለው ነበር
  rationale: የግሪኩን ኢምፐርፌክት የቀጣይ ድርጊት ገጽታ በአማርኛ ያስተላልፋል።
- source_word: μακρόθεν
  choice: ራቅ ብሎ
  rationale: የቦታ ርቀትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ ከሩቅ የመነሳትን ወይም በርቀት የመሆንን ጥቃቅን ልዩነት አያስገድድም።
- source_word: δὲ
  choice: ግን
  rationale: ኢየሱስ ወደ ቤቱ መግባቱንና ጴጥሮስ ራቅ ብሎ መከተሉን የሚያነጻጽረውን ቀላል ተቃርኖ ያሳያል።
theological_decisions:
- issue: ከእስሩ በኋላ ጴጥሮስ ከኢየሱስ ጋር የነበረው የትረካ ግንኙነት
  choice: ‘ራቅ ብሎ ይከተለው ነበር’ ተብሎ የአካላዊ ርቀቱና የቀጠለው ድርጊት ብቻ ተገልጿል።
  alternative: ‘በፍርሃት’ ወይም ‘ተደብቆ’ እየተከተለ ነበር ብሎ ምክንያቱን መተርጎም።
  rationale: ጥቅሱ የጴጥሮስን ውስጣዊ ዝንባሌ በግልጽ አይተረጉምም፤ ስለዚህ ትርጉሙ የትረካውን ውጥረት ሳይፈታ ጠብቆታል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ የእንቅስቃሴ ግሶች ‘ወስደው ... አስገቡት’ ተብለው ተፈጥሯዊ በሆነ አነጋገር ተጠብቀዋል። የእንግሊዝኛው [a] ምልክት ከ‘him’ በኋላ ቢታይም የማስታወሻው ይዘት μακρόθενን ስለሚመለከት በአማርኛው ‘ራቅ ብሎ’ ከሚለው ቀጥሎ ተቀምጧል።
