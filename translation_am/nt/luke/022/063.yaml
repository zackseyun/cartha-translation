review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the custodial action, hostile mockery, and accompanying beating. However, «እርሱን ይዘውት» redundantly marks the object twice and is not idiomatic in this construction. «ወንዶች» more directly preserves the explicitly male ἄνδρες than generic «ሰዎች».
  naturalness: The revised wording removes the redundant object suffix and makes the implied object of δέροντες explicit in natural Amharic.
  terminology: «ወንዶች» reflects ἄνδρες without importing the more specific identities “guards” or “soldiers.” «ያፌዙበት» and «እየደበደቡት» are suitable modern standard Amharic renderings of ἐνέπαιζον and δέροντες.
  issues:
  - severity: medium
    issue: Redundant object marking in «እርሱን ይዘውት የነበሩት»
    rationale: The independent object «እርሱን» and the object suffix in «ይዘውት» duplicate the same object. Use either «እርሱን ይዘው» or «ይዘውት», with the former fitting the relative clause naturally.
  - severity: low
    issue: Generic «ሰዎች» weakens the male-specific reference of ἄνδρες
    rationale: Although «ሰዎች» is natural, ἄνδρες specifically identifies men. «ወንዶች» preserves that feature without identifying them as guards or soldiers.
  revised_text: እርሱን ይዘው የነበሩት ወንዶች እየደበደቡት ያፌዙበት ነበር።[a]
