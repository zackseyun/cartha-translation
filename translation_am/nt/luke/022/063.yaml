lexical_decisions:
- source_word: συνέχοντες
  choice: ይዘውት የነበሩት
  rationale: በዚህ አውድ ግሱ ኢየሱስን በቁጥጥር ሥር አድርገው መያዛቸውን ያመለክታል፤ ይህ አተረጓጎም ተፈጥሯዊ ሲሆን መደበኛ የእስር ቃል አይጨምርም።
- source_word: ἐνέπαιζον
  choice: ያፌዙበት ነበር
  rationale: ግሱ በጥላቻና በንቀት መሳለቅን ይገልጣል፤ «ማፌዝ» በዘመናዊ አማርኛ አጭርና ግልጽ ነው።
- source_word: αὐτῷ
  choice: በእርሱ (ያፌዙበት)
  rationale: የግሪኩ ተሳቢ በአማርኛ «ያፌዙበት» በሚለው ግስ ውስጥ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: δέροντες
  choice: እየደበደቡ
  rationale: ተያይዞ የሚቀጥል አካላዊ ድብደባን ይገልጣል፤ «እየደበደቡ» የድርጊቱን ቀጣይነትና ከማፌዙ ጋር አብሮ መፈጸሙን ያሳያል።
- source_word: ἄνδρες
  choice: ሰዎች
  rationale: ግሪኩ በግልጽ «ወንዶች/ሰዎች» ይላል እንጂ «ጠባቂዎች» ወይም «ወታደሮች» አይልም፤ «ሰዎች» በአማርኛ ተፈጥሯዊ ሲሆን ማንነታቸውን ከጽሑፉ በላይ አያጠብብም።
- source_word: Καὶ
  choice: የትረካ ቅደም ተከተል በዓረፍተ ነገሩ አጀማመር ተገልጧል
  rationale: በአማርኛ ይህን ቀላል የግሪክ አያያዥ በየጊዜው «እና» ብሎ መተርጎም የተዛባ አገላለጽ ይፈጥራል፤ የትረካው ቀጣይነት ያለ ተጨማሪ የጊዜ ፍቺ ተጠብቋል።
theological_decisions:
- issue: ኢየሱስን ያንገላቱት ሰዎች ማንነት
