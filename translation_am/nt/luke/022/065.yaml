  rationale: 'The revision removes the semantic and syntactic duplication while retaining: καὶ as an additive connector, ἕτερα πολλὰ as ‘ሌሎች ብዙ,’ βλασφημοῦντες as ‘የስድብ,’ the imperfect ἔλεγον as ‘ይናገሩ ነበር,’ and the hostile orientation of εἰς αὐτόν as ‘በእርሱ ላይ.’ No footnote is necessary because the Amharic wording does not overstate a disputed ambiguity.'
