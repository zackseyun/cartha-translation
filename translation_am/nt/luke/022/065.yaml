  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: am
  text: ደግሞም ሌሎች ብዙ የስድብ ነገሮችን በእርሱ ላይ ይናገሩ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: ደግሞም
  rationale: ከቀደመው የማንገላታት ድርጊት ጋር ያገናኛል፤ እዚህ የመጨመር ኃይሉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἕτερα πολλὰ
  choice: ሌሎች ብዙ የስድብ ንግግሮችን
  rationale: ἕτερα ከቀደሙት በተጨማሪ ሌሎች ነገሮችን፣ πολλά ደግሞ ብዛታቸውን ያመለክታል። ‘ንግግሮችን’ የሚለው በἔλεγον የተገለጠውን የንግግር ይዘት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: βλασφημοῦντες
  choice: እየተናገሩ ይሳደቡት ነበር
  rationale: βλασφημέω በዚህ አውድ የሚያንቋሽሽ፣ የሚሰድብ ወይም የሚያቃልል ንግግርን ያመለክታል። ‘ይሳደቡት’ የግሱን ድርጊታዊ ኃይል ይጠብቃል፤ ከአውዱ በላይ የተወሰነ ሃይማኖታዊ ትርጉም አያስገባም።
- source_word: ἔλεγον
  choice: እየተናገሩ ... ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ ቀጣይነት ያለውን ወይም ተደጋጋሚውን ንግግር ያሳያል፤ የአማርኛው ‘እየ... ነበር’ አወቃቀር ይህን በግልጽ ያስተላልፋል።
- source_word: εἰς αὐτόν
  choice: በእርሱ ላይ ... ይሳደቡት
  rationale: εἰς ከጠላትነት ንግግር ጋር ሲመጣ ‘በእርሱ ላይ/በእርሱ ላይ የተቃጣ’ የሚል ኃይል ሊኖረው ይችላል። የአማርኛው አቀራረብ ንግግሩ በኢየሱስ ላይ መቃጣቱን ያሳያል።
theological_decisions:
- issue: βλασφημοῦντες በግልጽ ሃይማኖታዊ ቃል ይተረጎም ወይስ ሰፊው የስድብ ትርጉሙ ይቀርብ?
  choice: የስድብ ንግግሮችን ... ይሳደቡት
  alternative: ስድብን እየተናገሩበት / እግዚአብሔርን የሚያቃልል ንግግር እየተናገሩበት
  rationale: ግሱ ስም ማጥፋትን፣ ማንቋሸሽንና ስድብን ጨምሮ ሰፊ የትርጉም ክልል አለው። እዚህ ቀጥተኛው ሰዋሰዋዊ ዒላማ ኢየሱስ ነው፤ ስለዚህ ድርጊቱን ከማቅለል ውጭ በቀጥታ የስድብ ንግግር ብሎ ማቅረብ የግሪኩን አሻሚነት ይጠብቃል።
- issue: εἰς αὐτόν የአቅጣጫ ወይስ የተቃውሞ ኃይል ይገልጻል?
  choice: በእርሱ ላይ
  alternative: ለእርሱ / ወደ እርሱ
  rationale: የቀደመው የማንገላታት አውድና βλασφημοῦντες የንግግሩን ጠላትነት ያሳያሉ። ‘በእርሱ ላይ’ ይህን ያቀርባል፤ የአቅጣጫው አማራጭ ግን በሰዋሰው ደረጃ ሊኖር ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተሳቢ ቅጹ ‘ይሳደቡት’ የዒላማውን ግልጽነት ሲጠብቅ፣ ‘እየ... ነበር’ የድርጊቱን ቀጣይነት ያሳያል።
