  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: am
  text: እንጀራም አንሥቶ ካመሰገነ በኋላ ቆረሰው፤ ሰጣቸውም እንዲህ አለ፦ “ይህ ሥጋዬ ነው[c]፤ ለእናንተ የሚሰጠው[b]። ይህን እኔን ለማስታወስ ደጋግማችሁ አድርጉ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “ለእናንተ የሚሰጠው። ይህን እኔን ለማስታወስ ደጋግማችሁ አድርጉ” የሚለውን ይተዋሉ።
    reason: textual_variant
  - marker: b
