- source_word: τοῦτο ποιεῖτε
  choice: ይህን ... ደጋግማችሁ አድርጉ
  rationale: የአሁን ጊዜ ትእዛዝ በዚህ የሥርዓት አውድ ቀጣይና ተደጋጋሚ ተግባርን ስለሚያመለክት፣ ‘ደጋግማችሁ’ የሚለው ይህን ኃይል በግልጽ ያሳያል።
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: እኔን ለማስታወስ
  rationale: ἀνάμνησιςን እንደ ንቁ የማስታወስ ተግባር በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ ከ‘መታሰቢያ’ ጋር ሊያያዝ የሚችለውን የሙታን መታሰቢያ ጥላ ያስወግዳል።
