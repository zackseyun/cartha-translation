  - marker: c
    text: “ይህ ሥጋዬ ነው” የሚለው በተጻፈው መሠረት ተተርጉሟል። አንዳንዶች “ይህ ሥጋዬን ይወክላል” ብለው ይተረጉሙታል፤ የግሪኩ ጽሑፍ ራሱ ግን “ነው” ይላል።
