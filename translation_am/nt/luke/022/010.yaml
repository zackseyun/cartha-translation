id: LUK.22.10
reference: Luke 22:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ “እነሆ፣[a] ወደ ከተማይቱ ስትገቡ፣ የውሃ እንስራ[b] የተሸከመ አንድ ሰው ያገኛችኋል። እርሱ ወደሚገባበት ቤት ተከተሉት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተመልከቱ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል በተለይ ከሸክላ የተሠራ ዕቃን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የግሪኩን ትኩረት ጠሪ እና ጠቋሚ ኃይል በክቡርና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: ወደ ከተማይቱ ስትገቡ
  rationale: የጄኔቲቭ አብሶሉት ጊዜያዊ ግንኙነትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συναντήσει ὑμῖν
  choice: ያገኛችኋል
  rationale: በዐውዱ ውስጥ ሰውየው በመንገዳቸው እንደሚገጥማቸው በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἄνθρωπος
  choice: አንድ ሰው
  rationale: በዚህ ዐውድ የተወሰነ ወንድ ግለሰብን ያመለክታል፤ በአማርኛም ‘ሰው’ ተፈጥሯዊ ሲሆን የተሳሳተ ጾታ አያስገባም።
- source_word: κεράμιον ὕδατος
  choice: የውሃ እንስራ
  rationale: ‘እንስራ’ ውሃ ለመያዝ የሚያገለግል ባህላዊ የሸክላ ዕቃን በግልጽና በተፈጥሯዊ አማርኛ ይጠቁማል።
- source_word: βαστάζων
  choice: የተሸከመ
  rationale: ሰውየው ዕቃውን ይዞ እየሄደ መሆኑን በተፈጥሯዊ የትረካ አገላለጽ ያሳያል።
- source_word: ἀκολουθήσατε αὐτῷ
  choice: ተከተሉት
  rationale: የአኦሪስት ትእዛዙን ቀጥተኛና ግልጽ በሆነ የአማርኛ ትእዛዝ ያስተላልፋል።
- source_word: οἰκίαν
  choice: ቤት
  rationale: በዚህ የአቅጣጫ ዐውድ οἰκία የሚያመለክተውን ሕንፃ በቀጥታ ያሳያል።
- source_word: εἰς ἣν εἰσπορεύεται
  choice: እርሱ ወደሚገባበት
  rationale: አንጻራዊውን ሐረግና የመግባትን አቅጣጫ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
