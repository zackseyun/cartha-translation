id: LUK.22.22
reference: Luke 22:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: am
  text: ምክንያቱም የሰው ልጅስ እንደተወሰነው ይሄዳል፤ ነገር ግን እርሱን አሳልፎ በሚሰጠው በዚያ ሰው ላይ ወዮለት!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: በአማርኛ በተናጠል አልተተረጎመም
  rationale: ጥቅሱ ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ትስስር በአማርኛ የዐረፍተ ነገሩ ፍሰት በቂ ሁኔታ ያሳያል፤ «ምክንያቱም» ማለት ግን ብቻውን ሲነበብ አላስፈላጊ ክብደት ይጨምራል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የታወቀ ራስ-መጠሪያና ከብሉይ ኪዳን ጋር ያለውን ትስስር ይጠብቃል።
- source_word: μέν
  choice: -ስ
  rationale: የግሪኩን μέν…πλήν ንጽጽር በተፈጥሯዊ የአማርኛ አገላለጽ «የሰው ልጅስ… ነገር ግን…» ያሳያል።
- source_word: κατὰ τὸ ὡρισμένον
  choice: እንደተወሰነው
  rationale: አስቀድሞ ከተደረገ ውሳኔ ጋር መስማማትንና የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ ወሳኙን አካል በጽሑፉ ላይ ሳይጨምር።
- source_word: πορεύεται
  choice: መንገዱን ይሄዳል
  rationale: ቃሉ ቀጥተኛ ጉዞን ብቻ ሳይሆን ወደ ሞቱ የሚያመራውን አካሄድ ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሆኖ ምስላዊነቱን ይጠብቃል።
- source_word: πλὴν
  choice: ነገር ግን
  rationale: በተወሰነው ዕቅድና በአሳልፎ ሰጪው ተጠያቂነት መካከል ያለውን ጠንካራ ንጽጽር በግልጽ ያሳያል።
- source_word: οὐαὶ
  choice: ወዮለት
  rationale: የፍርድና የዋይታ ነቢያዊ ኃይልን በተለመደ እና በክብር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: በዚያ ሰው ላይ
  rationale: በዐውዱ የተጠቀሰውን የተወሰነ ወንድ ግለሰብ በትክክል ያመለክታል።
- source_word: δι’ οὗ
  choice: በሚሰጥበት
  rationale: διά ከዘመድ አመልካች ጋር ያለውን የመካከለኛ አድራጊነት በተፈጥሯዊ የአማርኛ አንቀጽ ያቀርባል።
- source_word: παραδίδοται
  choice: አሳልፎ በሚሰጥበት
  rationale: የግሪኩን መሠረታዊ «አሳልፎ መስጠት» ትርጉምና ተደራጊ ቅርጽ ይጠብቃል፤ ዐውዱ ያለውን ክህደት ሳይክድ ትርጉሙን በ«ከዳ» ብቻ አይገድበውም።
theological_decisions:
- issue: በመለኮታዊ ውሳኔና በሰው ኃላፊነት መካከል ያለው ግንኙነት
  choice: «እንደተወሰነው» የተባለውንና «በዚያ ሰው ላይ ወዮለት» የተባለውን ያለማለዘብ አብሮ ማቆየት
  alternative: መለኮታዊውን ውሳኔ ወይም የአሳልፎ ሰጪውን ተጠያቂነት የሚያለዝብ አተረጓጎም
  rationale: የግሪኩ ጽሑፍ ሁለቱን በግልጽ ያጎራብታል፤ ትርጉሙም ይህን ሥነ መለኮታዊ ውጥረት ለአንድ ሥርዓት በመወሰን ሳይፈታው ጠብቆታል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «መንገዱን ይሄዳል» የግሪኩን አካሄድ በተፈጥሯዊ አማርኛ ያሳያል። «አሳልፎ ይሰጣል» የሚለው ዋና ጽሑፍ የπαραδίδωμιን ስፋት ስለሚጠብቅ የእንግሊዝኛውን የቃላት አማራጭ ማስታወሻ በአማርኛ መድገም አላስፈለገም።
