revisions:
- from: የሰው ልጅስ እንደተወሰነው መንገዱን ይሄዳል፤ ነገር ግን እርሱ አሳልፎ በሚሰጥበት በዚያ ሰው ላይ ወዮለት!
  to: ምክንያቱም የሰው ልጅስ እንደተወሰነው ይሄዳል፤ ነገር ግን እርሱን አሳልፎ በሚሰጠው በዚያ ሰው ላይ ወዮለት!
  rationale: The revision translates the causal ὅτι, retains the juxtaposition of determination and culpability, and corrects the relative clause so that the specified man is unmistakably the one who hands the Son of Man over. No footnote is required because «አሳልፎ መስጠት» already retains the Greek verb's broad lexical sense; it does not force the narrower rendering “betray.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the Son of Man title, the prior determination, the adversative force, and the pronouncement of woe. However, «እርሱ አሳልፎ በሚሰጥበት» reverses or leaves unclear the roles in δι’ οὗ παραδίδοται: it can read as though the Son of Man is the one handing someone else over. The causal connector ὅτι should also be represented, especially when the verse is presented independently.'
  naturalness: «እርሱን አሳልፎ በሚሰጠው በዚያ ሰው» is clear, idiomatic modern standard Amharic. Omitting the added «መንገዱን» more closely reflects the concise Greek while retaining natural Amharic.
  terminology: «የሰው ልጅ», «እንደተወሰነው», «ወዮለት», and «አሳልፎ መስጠት» are appropriate. The latter preserves the broader sense of παραδίδωμι without reducing it solely to betrayal.
  issues:
  - severity: high
    issue: The relative clause «እርሱ አሳልፎ በሚሰጥበት» gives an unclear and potentially reversed agency/object relationship.
    rationale: Greek δι’ οὗ παραδίδοται means that the Son of Man is handed over through the agency of that man. Explicitly making «እርሱን» the object of «አሳልፎ የሚሰጠው» removes the ambiguity.
  - severity: medium
    issue: The discourse connector ὅτι is omitted.
    rationale: While Amharic may occasionally leave a connection implicit, «ምክንያቱም» properly conveys the verse's explanatory connection to the preceding statement.
  - severity: low
    issue: «መንገዱን» adds an image not explicitly present in πορεύεται.
    rationale: It is not a serious distortion, but plain «ይሄዳል» is both natural and closer to the source.
  revised_text: ምክንያቱም የሰው ልጅስ እንደተወሰነው ይሄዳል፤ ነገር ግን እርሱን አሳልፎ በሚሰጠው በዚያ ሰው ላይ ወዮለት!
