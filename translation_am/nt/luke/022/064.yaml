  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: am
  text: እርሱንም ከሸፈኑት በኋላ[a]፣ “ትንቢት ተናገር! የመታህ ማን ነው?” እያሉ ደጋግመው ጠየቁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓይኑን ከሸፈኑት በኋላ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: ከሸፈኑት በኋላ
  rationale: ግሱ መሸፈንን ወይም መጋረድን ያመለክታል፤ ዓይኑን እንደሸፈኑት በዐውዱ ቢገባም፣ ዋናው ጽሑፍ ከግሪኩ የበለጠ ዝርዝር አይጨምርም።
- source_word: ἐπηρώτων
  choice: ደጋግመው ጠየቁት
  rationale: ያልተፈጸመው የግስ ጊዜ (imperfect) ተደጋጋሚ ወይም ቀጣይ ጥያቄን ስለሚያመለክት፣ ይህ አተረጓጎም የድርጊቱን ተደጋጋሚነት ያሳያል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: ተሳቢው የስድቡን ቃል ያስገባል፤ “እያሉ” በአማርኛ ተፈጥሯዊ ሲሆን ቀጣይነቱንም ይጠብቃል።
- source_word: Προφήτευσον
  choice: ትንቢት ተናገር!
  rationale: የትእዛዝ ቅርጹንና የማፌዝ ኃይሉን በቀጥታ ያስተላልፋል።
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: የመታህ ማን ነው?
  rationale: ὁ παίσας በስም ምትክ የቆመ “የመታህ” የሚል አገላለጽ ነው፤ ትርጉሙ በዘመናዊ አማርኛ ግልጽና ቀጥተኛ ነው።
theological_decisions:
- issue: ኢየሱስ ዓይኑ እንደታሰረ በግልጽ መግለጽ ወይም ሰፊውን የመሸፈን ትርጉም መጠበቅ
  choice: በዋናው ጽሑፍ “ከሸፈኑት በኋላ” የሚለውን ሰፊ አገላለጽ መጠበቅ
  alternative: “ዓይኑን ከሸፈኑት በኋላ”
  rationale: ዐውዱ ማየት እንዳይችል መደረጉን ቢያመለክትም፣ የግሪኩ ግስ በራሱ መሸፈንን ወይም መጋረድን ብቻ ይገልጣል። ስለዚህ ዋናው ጽሑፍ የምንጩን ስፋት ይጠብቃል፣ የዐውዱ ግልጽ አማራጭ ደግሞ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ደጋግመው ጠየቁት” የግሪኩን imperfect ተደጋጋሚ ኃይል ያሳያል፤ የጥቅሱ የማፌዝ ቃናም በቀጥተኛው ትእዛዝ ተጠብቋል።
