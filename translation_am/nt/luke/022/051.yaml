  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: am
  text: ኢየሱስ ግን መልሶ፣ “ይህ ይብቃ!” አለ። ጆሮውንም ዳስሶ ፈወሰው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: ይህ ይብቃ!
  rationale: ቃል በቃል ‘እስከዚህ ተዉ’ የሚለውን አጭር የማስቆም ትእዛዝ፣ በዘመናዊና ተፈጥሯዊ አማርኛ ‘ይህ ይብቃ!’ በማለት ያቀርባል፤ የድርጊቱ እንዲቆም የሚያሳስበውን ኃይል ይጠብቃል።
- source_word: ὠτίου
  choice: ጆሮውን
  rationale: በአውዱ የሊቀ ካህናቱን አገልጋይ ጆሮ ያመለክታል፤ የግሪኩ ቅርጽ ትንሽነትን በግድ ስለማያሳይ፣ ተፈጥሯዊው ‘ጆሮ’ ተመርጧል።
- source_word: ἁψάμενος
  choice: ዳስሶ
  rationale: አካላዊ ንክኪን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἰάσατο αὐτόν
  choice: ፈወሰው
  rationale: የግሪኩ ቀጥተኛ ትርጉም ‘እርሱን ፈወሰው’ ነው፤ የአማርኛው ተውላጠ ስም የተፈወሰውን ሰው ያመለክታል።
theological_decisions:
- issue: Ἐᾶτε ἕως τούτου የሚለው ንግግር ዒላማ
  choice: ይህ ይብቃ!
  alternative: እስከዚህ ተዉአቸው።
  rationale: የግሪኩ አገላለጽ አሻሚ ሊሆን ቢችልም፣ በአውዱ ጥቃቱን የሚያስቆም አጭር አዋጅ መሆኑ ይበልጥ ተፈጥሯዊ ነው። ‘ይህ ይብቃ’ ተጨማሪ የሥነ መለኮት ማብራሪያ ሳያስገባ ይህን ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘መልሶ’ የἀποκριθείςን የትረካ ተግባር ይጠብቃል፤ የግሪኩ የአረፍተ ነገር ቅደም ተከተልም በተፈጥሯዊ አማርኛ ቀርቧል።
