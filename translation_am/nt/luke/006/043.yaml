  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: am
  text: ምክንያቱም የበሰበሰ ፍሬ[a] የሚያፈራ መልካም ዛፍ የለም፤ እንዲሁም መልካም ፍሬ የሚያፈራ የበሰበሰ ዛፍ የለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘መጥፎ ፍሬ’ ወይም ‘መጥፎ ዛፍ’ ተብሎም ሊተረጎም ይችላል። የግሪኩ σαπρός የበሰበሰ፣ የተበላሸ ወይም መጥፎ ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: አያፈራምና
  rationale: የግennials? γάρ ያለውን ማብራሪያዊ ግንኙነት በአማርኛው ‘-ምና’ ይዟል፤ የግሪኩን የመኖር አሉታ ቃል በተፈጥሯዊ የአማርኛ የድርጊት አሉታ ተገልጿል።
- source_word: δένδρον καλὸν
  choice: መልካም ዛፍ
  rationale: የፍሬ ዛፍን ምስልና የሥነ ምግባር ፍንጭን ሳያጠብ የ καλόςን ሰፊ የ‘መልካም’ ትርጉም ይጠብቃል።
- source_word: ποιοῦν καρπὸν
  choice: ፍሬ አያፈራም
  rationale: ከፍሬ ጋር ποιέω በአማርኛ ‘ማፍራት’ ተብሎ በተፈጥሮ ይገለጻል፤ የአሁን ጊዜውን አጠቃላይ እውነትም ያሳያል።
- source_word: σαπρόν
  choice: የበሰበሰ
  rationale: የተበላሸ ወይም የበሰበሰ ነገርን የሚያመለክተውን ተጨባጭ የእርሻ ምስል ይጠብቃል፤ ‘መጥፎ’ የሚለው ሰፊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: οὐδὲ πάλιν
  choice: ዛፍም ደግሞ … አያፈራም
  rationale: οὐδέን በ‘-ም’ እና በሁለተኛው አሉታዊ ግስ፣ πάλινንም በ‘ደግሞ’ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የግብርናው ምሳሌና የሥነ ምግባር ፍቺው ጥንካሬ
  choice: σαπρόςን በሁለቱም ሐረጎች ‘የበሰበሰ’ ብሎ መተርጎም
  alternative: ‘መጥፎ’ ወይም ‘የተበላሸ’
  rationale: ተጨባጩን የዛፍና የፍሬ ምስል በመጠበቅ ሥነ ምግባራዊው አንድምታ ከምሳሌው ራሱ እንዲወጣ ያደርጋል፤ አንድ የተወሰነ የእምነት ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛ ተጠቅሟል። ተቃርኖውና የሁለቱ ሐረጎች ትይዩነት ተጠብቋል፤ ‘ደግሞ’ πάλινን በተፈጥሯዊ ሁኔታ ያንጸባርቃል።
