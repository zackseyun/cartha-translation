- from: መልካም ዛፍ የበሰበሰ ፍሬ[a] አያፈራምና፤ የበሰበሰ ዛፍም ደግሞ መልካም ፍሬ አያፈራም።
  to: ምክንያቱም የበሰበሰ ፍሬ[a] የሚያፈራ መልካም ዛፍ የለም፤ እንዲሁም መልካም ፍሬ የሚያፈራ የበሰበሰ ዛፍ የለም።
