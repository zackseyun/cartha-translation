    text: ወይም፣ «ወንድ ሰው»። የግሪኩ ቃል በተባዕታይ ነጠላ ቅርጽ የቀረበ ሲሆን በንጽጽሩ ውስጥ አንድን ተወካይ ሰው ያመለክታል።
