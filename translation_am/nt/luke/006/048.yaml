  text: እርሱ ቤት የሚሠራ ሰውን[a] ይመስላል፤ ያ ሰው በጥልቅ ቆፍሮ በዓለት ላይ መሠረት ጣለ። ጎርፍም በመጣ ጊዜ ወንዙ ያን ቤት በኃይል መታው፤ ቤቱ በሚገባ ተሠርቶ ስለነበር ሊያናውጠው አልቻለም።
  philosophy: optimal-equivalence
  footnotes:
