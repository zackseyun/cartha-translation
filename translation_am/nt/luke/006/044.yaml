id: LUK.6.44
reference: Luke 6:44
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: am
  text: እያንዳንዱ ዛፍ በራሱ ፍሬ ይታወቃልና፤ ከእሾህ[a] በለስ አይለቅሙም፣ ከእሾሃማ ቁጥቋጦ[b] ደግሞ ወይን አይሰበስቡም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “እሾሃማ ተክሎች።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል እንደ ብራምብል ያለ እሾሃማ ቁጥቋጦን ያመለክታል።
    reason: lexical_clarification
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: እያንዳንዱ ዛፍ
  rationale: ἕκαστον ያለውን አከፋፋይ ኃይል በተፈጥሯዊና በዘመናዊ አማርኛ ይጠብቃል።
- source_word: γὰρ
  choice: -ና / ደግሞ
  rationale: የምሳሌውን ማብራሪያዊ እና ምክንያታዊ ትስስር በአማርኛ ተፈጥሯዊ አገባብ ያሳያል፤ ሁለተኛው γάρ በቃል ተደግሞ እንዳይከብድ የአረፍተ ነገሩ ማብራሪያዊ አወቃቀር ይሸከመዋል።
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: በራሱ ፍሬ
  rationale: ἐκ ከγινώσκεται ጋር ያለውን የመለያ መሠረት ‘በ’ በሚለው ያሳያል፤ ἰδίου የዛፉና የፍሬውን ተዛምዶ ይጠብቃል።
- source_word: γινώσκεται
  choice: ይታወቃል
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና ሁልጊዜ እውነት የሆነውን የምሳሌውን አነጋገር በአጭሩ ያስተላልፋል።
- source_word: ἀκανθῶν
  choice: እሾህ
  rationale: ብዙ ዓይነት እሾሃማ ተክሎችን ሊያመለክት የሚችለውን ሰፊ ትርጉም በተለመደ ቃል ይገልጣል።
- source_word: συλλέγουσιν
  choice: ይለቅማሉ
  rationale: ፍሬን ከተክል መሰብሰብን በተፈጥሯዊ የእርሻ አገላለጽ ያሳያል።
- source_word: σῦκα
  choice: በለስ
  rationale: የσῦκον መደበኛና ግልጽ የአማርኛ አቻ ነው።
- source_word: βάτου
  choice: እሾሃማ ቁጥቋጦ
  rationale: ቃሉ ተራ ቁጥቋጦን ሳይሆን እንደ ብራምብል ያለ እሾሃማ ቁጥቋጦን እንደሚያመለክት ይጠብቃል፤ የተወሰነ ዝርያ አይጨምርም።
- source_word: σταφυλήν
  choice: ወይን
  rationale: በግሪክ ነጠላ ቢሆንም በዐውዱ የወይን ፍሬን በአጠቃላይ ያመለክታል፤ ‘ወይን’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: τρυγῶσιν
  choice: ይሰበስባሉ
  rationale: በተለይ የደረሰ ወይንን የመከር ሰብል አድርጎ መሰብሰብ ያለውን ስሜት ያስተላልፋል።
theological_decisions:
- issue: የፍሬው ምስል ዘይቤያዊ ኃይል
  choice: የእርሻውን ምሳሌ ሳይፈታና ሳይሰፋ በቀጥታ ማቆየት
  alternative: ‘ፍሬ’ን በባሕርይ፣ በሥራ ወይም በሥነ ምግባር ውጤት በግልጽ ትርጓሜ መተካት
  rationale: ግሪክ ጽሑፉ የምስሉን ተግባራዊ ፍቺ በዚህ ቁጥር አይዘረዝርም፤ ምሳሌውን እንዳለ ማቆየት የንግግሩን ኃይልና በዐውዱ ያለውን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ አገላለጽ ተጠቅሟል። የምሳሌው አጭርነትና ትይዩ አወቃቀር ተጠብቋል፤ በሁለቱ እሾሃማ ተክሎች መካከል ያለው የቃል ልዩነትም ተገልጧል።
