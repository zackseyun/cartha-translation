  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: am
  text: ደቀ መዝሙር[a] ከመምህሩ በላይ አይደለም፤ ነገር ግን በሚገባ የሠለጠነ[b] ሁሉ እንደ መምህሩ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተማሪ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሙሉ በሙሉ የተዘጋጀ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: ደቀ መዝሙር
  rationale: ቃሉ ከመምህር ጋር ያለውን የተማሪነትና የተከታይነት ግንኙነት ይጠብቃል፤ “ተማሪ” የሚለው አማራጭ የትምህርት ገጹን ብቻ የበለጠ ያጎላል።
- source_word: ὑπὲρ
  choice: ከ… በላይ
  rationale: በዚህ ንጽጽር የደረጃ ወይም የበላይነት ሐሳብን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διδάσκαλος
  choice: መምህር
  rationale: የማስተማርን ሚና በቀጥታና በክብር የሚገልጽ የተለመደ አማርኛ ነው።
- source_word: κατηρτισμένος
  choice: በሚገባ የሠለጠነ
  rationale: ፍጹም ወይም በቂ ዝግጅት የደረሰበትን ሰው የሚያመለክተውን ፍጹም ተደራጊ አንቀጽ በዐውደ ንባቡ የትምህርት ገጽታ መሠረት ይገልጻል።
- source_word: πᾶς
  choice: ሁሉ
  rationale: በአባባሉ ያለውን አጠቃላይ ወካይ አገላለጽ በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: ὡς
  choice: እንደ
  rationale: በደቀ መዝሙሩና በመምህሩ መካከል ያለውን ንጽጽር በቀጥታ ይገልጻል።
- source_word: αὐτοῦ
  choice: መምህሩ
  rationale: የአማርኛው ባለቤትነት ቅጥያ ከተወካዩ ነጠላ ሰው ጋር ያለውን ግንኙነት በተፈጥሯዊ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: በምሳሌያዊው አባባል ያለው ወካይ ነጠላ ሰው
  choice: “ሁሉ … መምህሩ” የሚለውን ነጠላ ወካይ አገላለጽ መጠበቅ
  alternative: “ሁሉም … መምህራቸው” ብሎ በብዙ ቁጥር መተርጎም
  rationale: ግሪክኛው በሰዋስው ወንድ ነጠላ ቅርጽ አጠቃላይ ሰውን ይወክላል። አማርኛው “ሁሉ” የሚለውን አጠቃላይ ኃይል ከነጠላው “መምህሩ” ጋር በተፈጥሯዊ ሁኔታ ያቆያል።
- issue: κατηρτισμένος የሚያመለክተው የማሠልጠን፣ የማዘጋጀት ወይም የማሟላት ስፋት
  choice: በደቀ መዝሙርና በመምህር ዐውድ “በሚገባ የሠለጠነ” ብሎ መተርጎም
  alternative: “ፍጹም የሆነ” ወይም “የተዘጋጀ” ብሎ መተርጎም
  rationale: የትምህርት ዐውዱ ሥልጠናን ያጎላል፤ ይሁንና የቃሉ ሰፊ የዝግጅት ትርጉም በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ደቀ መዝሙር” መጽሐፍ ቅዱሳዊ ቢሆንም በዘመናዊ አማርኛ የሚታወቅ ሲሆን፣ “በሚገባ የሠለጠነ” የሚለው ደግሞ ከግሪክኛው ቅርጽና ከዐውዱ ጋር የሚስማማ ተፈጥሯዊ አገላለጽ ነው።
