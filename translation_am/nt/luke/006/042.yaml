  rationale: የትንሹን የሌላውን ጉድለትና የራስን እጅግ ትልቅ ጉድለት የሚያነጻጽረውን ምስል ሳያለሰልስ ይጠብቃል።
- issue: διαβλέψεις እንደ አካላዊ ወይም ሥነ ምግባራዊ ግልጽ እይታ
  choice: በግልጽ ታያለህ
  alternative: ለማውጣት በትክክል ትችላለህ
  rationale: ግሪኩ የማየትን ምስል በቀጥታ ይጠቀማል፤ ትርጉሙ አካላዊና ሥነ ምግባራዊ ድርብ አንድምታውን ክፍት ያደርጋል።
