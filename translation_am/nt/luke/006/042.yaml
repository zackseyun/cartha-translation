  verdict: revise
  source_fidelity: The rhetorical question, emphatic self-reference, direct rebuke, sequence of removing one's own obstruction first, and the final purpose clause are retained. However, ትንሽ ጉድፍ normally means a small flaw/defect rather than the literal small dry particle denoted by κάρφος; this weakens the concrete eye-image. Replacing it with ትንሽ ስንጣሪ restores the source image and its contrast with δοκός.
  naturalness: The revised wording is natural modern standard Amharic. በግልጽ አይተህ … ማውጣት ትችላለህ clearly expresses διαβλέψεις together with the infinitive ἐκβαλεῖν.
  terminology: ወንድም retains the masculine singular ἀδελφός without interpretive expansion. የእንጨት ምሰሶ makes explicit that ምሰሶ is the large timber of δοκός, while ትንሽ ስንጣሪ denotes the small particle/splinter of κάρφος. ግብዝ is an appropriate rendering of ὑποκριτά.
