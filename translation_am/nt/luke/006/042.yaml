  - severity: low
    issue: Final clause is less explicit about clear sight enabling removal
    rationale: The draft is understandable, but recasting it as በግልጽ አይተህ … ማውጣት ትችላለህ more directly and idiomatically carries διαβλέψεις … ἐκβαλεῖν.
