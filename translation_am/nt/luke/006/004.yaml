  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: am
  text: እንዴት ወደ እግዚአብሔር ቤት ገብቶ፣ በእግዚአብሔር ፊት የሚቀርቡትን ኅብስቶች[a] ወስዶ በልቶ፣ ከእርሱም ጋር ለነበሩት እንደሰጣቸው—ከካህናት ብቻ በቀር ማንም ሊበላቸው በሕግ ያልተፈቀደውን—አላነበባችሁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተቀደሱት ኅብስቶች”፤ በባህላዊ አጠራር፣ “የገጽ ኅብስት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: እንዴት ... እንደ
  rationale: የዳዊትን ድርጊት ሁኔታና ይዘት የሚያስተዋውቅ ቀጥተኛ ያልሆነ ጥያቄ ስለሆነ የግሪኩን አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ወደ እግዚአብሔር ቤት እንደገባ
  rationale: የመግባትን እንቅስቃሴና οἶκος የሚለውን ‘ቤት’ የሚል ቃል በቅርብ ይጠብቃል፤ ‘ቤተ መቅደስ’ የሚል ትርጓሜ አይጨምርም።
- source_word: ἄρτους τῆς προθέσεως
  choice: በእግዚአብሔር ፊት የሚቀርበውን ኅብስት
  rationale: በአምላክ ፊት ተዘጋጅቶ የሚቀርበውን ቅዱስ ኅብስት የሚያመለክተውን የአምልኮ ትርጉም በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: λαβὼν ἔφαγεν
  choice: ወስዶ እንደበላ
  rationale: የተሳቢ አንቀጹንና ዋናውን ግስ ቅደም ተከተል በተፈጥሯዊ የአማርኛ አገባብ ይጠብቃል።
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: ከእርሱም ጋር ለነበሩት እንደሰጠ
  rationale: ‘ከእርሱ ጋር የነበሩት’ የሚለውን ቃል በቅርብ ይከተላል፤ በግሪኩ የሌለ ‘ጥቂት’ የሚል ተጨማሪ ቃል አያስገባም።
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: መብላት በሕግ አልተፈቀደለትም
  rationale: አጠቃላይ ፈቃድን ብቻ ሳይሆን የሕግና የአምልኮ ደንብን የሚመለከተውን የἔξεστιν ስሜት ይጠብቃል።
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: ከካህናት በቀር ... ማንም
  rationale: ካህናት ብቻ እንደሚፈቀድላቸው የሚገልጠውን ማግለል በተፈጥሯዊ አማርኛ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: የተቀደሰውን ኅብስት የመብላት የአምልኮና የሕግ ገደብ
  choice: “በሕግ አልተፈቀደለትም” ተብሎ ተተርጉሟል።
  alternative: “አይፈቀድም” ወይም “አይቻልም”
  rationale: የኢየሱስ ምሳሌ በእስራኤል የአምልኮ ሕግ የተደነገገውን የካህናት መብት ስለሚመለከት፣ የሕግ ገጽታውን በግልጽ መጠበቅ ተመርጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ኅብስት’ የሚለው ቃል በአምልኮ አውድ የተለመደ ሲሆን፣ ልዩ የአምልኮ ቃሉ በመሠረታዊ ጽሑፉ ተገልጦ ባህላዊው አጠራር በማስታወሻ ቀርቧል።
