  language: am
  text: ኢየሱስ ግን፣ “እጠይቃችኋለሁ፤ በሰንበት በጎ ማድረግ ወይስ ጉዳት ማድረግ፣[a] ሕይወትን ማዳን ወይስ ማጥፋት ይፈቀዳል?” አላቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
