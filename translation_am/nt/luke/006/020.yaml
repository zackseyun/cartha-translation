base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: am
  text: እርሱም ዓይኖቹን ወደ ደቀ መዛሙርቱ አንሥቶ እንዲህ ይል ነበር፦ “እናንተ ድሆች የተባረካችሁ ናችሁ፤[a] ምክንያቱም የእግዚአብሔር መንግሥት የእናንተ ነው።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል ቅርብ፦ “ድሆች የተባረኩ ናቸው።” የግሪኩ አገላለጽ በቅርጹ ሦስተኛ መደብ ነው፤ ነገር ግን ቀጥሎ ያለው “የእናንተ” ቃል ንግግሩ ቀጥተኛ አድራሻ መሆኑን ያሳያል።
    reason: lexical_alternative
  - marker: b
    text: ሉቃስ “ድሆች” ይላል እንጂ “በመንፈስ ድሆች” አይልም፤ ከማቴዎስ 5፥3 ጋር ያነጻጽሩ።
    reason: cross_reference
lexical_decisions:
