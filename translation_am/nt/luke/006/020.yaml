- issue: οἱ πτωχοί በሦስተኛ መደብ ይተርጎም ወይስ ቀጥተኛ አድራሻው ይገለጥ?
  choice: እናንተ ድሆች የተባረካችሁ ናችሁ
  alternative: ድሆች የተባረኩ ናቸው
  rationale: οἱ πτωχοί በቅርጹ ሦስተኛ መደብ ቢሆንም፣ ὑμετέρα ‘የእናንተ’ የሚለው ተከታይ ቃል ኢየሱስ ደቀ መዛሙርቱን በቀጥታ እንደሚናገር ያሳያል።
