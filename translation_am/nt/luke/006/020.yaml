- source_word: ἔλεγεν
  choice: እንዲህ ይል ነበር
  rationale: የግሪኩን ኢምፐርፌክት ገጽታ እንደ ቀጣይ ወይም ንግግርን እንደሚያስገባ አነጋገር ያሳያል።
- source_word: Μακάριοι
  choice: የተባረካችሁ ናችሁ
  rationale: በብፅዕና ንግግር ውስጥ ያለውን መንፈሳዊና ኪዳናዊ ድምፅ ይጠብቃል፤ ‘ደስተኞች’ ከሚለው ስሜታዊ ትርጉም የሰፋ ነው።
- source_word: οἱ πτωχοί
  choice: እናንተ ድሆች
  rationale: የግሪኩ አገላለጽ በቅርጹ ‘ድሆች’ ቢሆንም፣ ተከትሎ ያለው ὑμετέρα ‘የእናንተ’ ቀጥተኛ አድራሻን ያሳያል፤ ይህ ምርጫ ሁለቱንም ይጠብቃል።
- source_word: πτωχοί
  choice: ድሆች
  rationale: የቃሉን ግልጽ ማኅበራዊና ቁሳዊ ትርጉም ያለ ተጨማሪ መንፈሳዊ ማብራሪያ ያቀርባል።
- source_word: ὅτι
  choice: ምክንያቱም
