  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: am
  text: ነገር ግን ለምታዳምጡ[a] እናንተ እላለሁ፤ ጠላቶቻችሁን ውደዱ፤ ለሚጠሏችሁም መልካም አድርጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለምትሰሙ።” የግሪኩ ተሳቢ ቅጽ በይበልጥ ቀጥተኛ መንገድ እንዲህ ሊተረጎም ይችላል፤ “የምታዳምጡ” የሚለው ግን በዐውዱ ያለውን ቀጣይና ንቁ ማዳመጥ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὑμῖν λέγω
  choice: እናንተ፣ እላችኋለሁ
  rationale: ቀጥተኛውን የሁለተኛ መደብ ብዙ ቁጥር አድራሻና የንግግሩን ቀመር ይጠብቃል።
- source_word: τοῖς ἀκούουσιν
  choice: የምታዳምጡ
  rationale: የአሁን ጊዜው ተሳቢ ቅጽ በዐውዱ የሚያመለክተውን ቀጣይና ንቁ ማዳመጥ ያጎላል፤ ይበልጥ ቀጥተኛው ‘የምትሰሙ’ የሚለውም ይቻላል።
- source_word: ἀγαπᾶτε
  choice: ውደዱ
  rationale: የብዙ ቁጥር ትእዛዛዊ ኃይሉን ጠብቆ የፍቅርን ቀጥተኛ ትርጉም ይሰጣል።
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ጠላቶቻችሁን
  rationale: የባለቤትነት ቅጥያውንና ቀጥተኛ ተሳቢውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καλῶς ποιεῖτε
  choice: መልካም አድርጉ
  rationale: የግሪኩን ‘መልካም ማድረግ’ ፈሊጣዊ አገላለጽ ከማስፋፋት ወይም ከማለዘብ ይልቅ በግልጽ ትእዛዝ ያቀርባል።
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: ለሚጠሏችሁ
  rationale: የድርጊቱን ተቀባዮች በ‘ለ-’ ይገልጣል፤ μισέω ያለውን ጠንካራ ‘መጥላት’ ትርጉም አያለዝብም።
theological_decisions:
- issue: ለተቃዋሚዎች የተሰጡ ሥነ ምግባራዊ ትእዛዛት
  choice: ትእዛዛቱን ወሰናቸውን ሳያጠብ ቀጥተኛ የብዙ ቁጥር ትእዛዛት አድርጎ መተርጎም
  alternative: እንደ ግል ጠላቶች ብቻ መገደብ ወይም እንደ ንግግራዊ ማጋነን መተርጎም
  rationale: የግሪኩ ጽሑፍ ግልጽ የሁለተኛ መደብ ብዙ ቁጥር ትእዛዛትን ይሰጣል፤ በቃላቱ ውስጥ የተገለጸ ገደብ የለም። ስለዚህ ትርጉሙ የትእዛዙን ከባድ ሥነ ምግባራዊ ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የትእዛዝ ቅጾቹ ቀጥተኛ ናቸው፤ የጥላቻና የጠላትነት ቃላትም አልለዘቡም።
