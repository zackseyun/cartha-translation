review_pass:
  verdict: revise
  source_fidelity: The draft preserves the repeated prophetic οὐαί, the present-time emphasis of νῦν, and the future reversal expressed by πεινάσετε, πενθήσετε, and κλαύσετε. The final verb, however, contains an erroneous/nonstandard form (ታለቅሱማላችሁ) and must be corrected to the ordinary future plural ታለቅሳላችሁ. Rendering καί explicitly as “እና” preserves the coordination of mourning and weeping without adding emphasis absent from the Greek.
  naturalness: The revised parallel clauses are clear, idiomatic modern standard Amharic. Moving “አሁን” next to the participial descriptions retains the source emphasis and yields a smooth, balanced warning saying.
  terminology: ወዮላችሁ suitably conveys the judgment-laden force of οὐαί. የጠገባችሁ appropriately expresses the resultant state of being full; ታዝናላችሁ and ታለቅሳላችሁ retain the distinction between mourning and weeping.
  issues:
  - severity: high
    issue: The form “ታለቅሱማላችሁ” is malformed/nonstandard.
    rationale: It does not correctly express the future second-person plural of ማልቀስ and includes an inappropriate -ማ element. The Greek κλαύσετε simply coordinates a second future action with καί; “ታለቅሳላችሁ” is the correct natural form.
  - severity: low
    issue: The draft uses “-ማ” to intensify the final verb.
    rationale: The Greek has plain καί (“and”), not an emphatic particle. Using እና more directly reflects the source coordination.
  revised_text: አሁን የጠገባችሁ፣ ወዮላችሁ! ምክንያቱም ትራባላችሁ። አሁን የምትስቁ፣ ወዮላችሁ![a] ምክንያቱም ታዝናላችሁ እና ታለቅሳላችሁ።
