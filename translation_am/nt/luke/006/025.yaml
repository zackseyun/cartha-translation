source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: am
  text: አሁን የጠገባችሁ፣ ወዮላችሁ! ምክንያቱም ትራባላችሁ። አሁን የምትስቁ፣ ወዮላችሁ![a] ምክንያቱም ታዝናላችሁ እና ታለቅሳላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዋይላችሁ!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ወዮላችሁ
  rationale: የትንቢታዊ ማስጠንቀቂያንና የሚመጣውን ፍርድ ኃይል ይጠብቃል፤ በአማርኛም ተፈጥሯዊ የሆነ አገላለጽ ነው።
- source_word: ἐμπεπλησμένοι
  choice: የጠገባችሁ
  rationale: ፍጹም ጊዜ አንቀጹ ከመሙላት የተገኘውን አሁናዊ የጥጋብ ሁኔታ ያመለክታል፤ ይህ ምርጫ ከወደፊቱ ረሃብ ጋር ያለውን ተቃርኖ ግልጽ ያደርጋል።
- source_word: νῦν
  choice: አሁን
  rationale: በአሁኑ ሁኔታና በወደፊቱ መገለባበጥ መካከል ያለውን ዋና የጊዜ ተቃርኖ ይጠብቃል።
- source_word: πεινάσετε
  choice: ትራባላችሁ
  rationale: የወደፊት ረሃብን በተፈጥሯዊና ቀጥተኛ ዘመናዊ አማርኛ ይገልጣል።
- source_word: γελῶντες
  choice: የምትስቁ
  rationale: በአሁኑ ጊዜ በመሳቅ ላይ ያሉትን ሰዎች ይጠቁማል፤ ‘ደስ የሚላችሁ’ ከሚለው ይልቅ ቀጥተኛ ነው።
- source_word: πενθήσετε
  choice: ታዝናላችሁ
  rationale: ከባድ ሐዘንንና ልቅሶን የሚያመለክተውን ትርጉም ያስተላልፋል፤ ከተከታዩ κλαύσετε ጋር ሳይዋሃድ ልዩነቱን ይጠብቃል።
- source_word: κλαύσετε
  choice: ታለቅሱማላችሁ
  rationale: የተገለጠ ልቅሶን ይጠቁማል፤ ‘-ማ’ ማያያዣውም ከሐዘን ወደ ልቅሶ ያለውን የንግግር ክብደት ያጎላል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ለወዮታው የተሰጠውን ምክንያት ግልጽ በሆነ ዘመናዊ አማርኛ ያስተዋውቃል።
theological_decisions:
- issue: የወዮታው ንግግር ባሕርይ
  choice: አሁን ለጠገቡና ያለጭንቀት ለሚስቁ ሰዎች ስለሚመጣ መገለባበጥና ፍርድ የሚሰጥ ትንቢታዊ ማስጠንቀቂያ
  alternative: ስለሚለዋወጥ የሰው ዕድል ብቻ የተሰጠ ማኅበራዊ ምልከታ
  rationale: የተደገመው οὐαί፣ የወደፊት ግሶችና በአውዱ ካሉት ብፁዓን ንግግሮች ጋር ያለው ትይዩነት ይህ ከገለልተኛ ምልከታ የሚበልጥ መሆኑን ያሳያሉ። ትርጉሙ መገለባበጡ በምን ዘዴ እንደሚፈጸም ሳይወስን ይህን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሐረጎቹ ትይዩ አወቃቀር፣ የ‘አሁን’ አጽንዖትና ከጥጋብ ወደ ረሃብ፣ ከሳቅም ወደ ሐዘንና ልቅሶ ያለው መገለባበጥ ተጠብቋል። የግሪክ ጽሑፉ በሁለተኛው οὐαί ከὑμῖν ይልቅ ቀጥተኛ የቡድን ጥሪ ቢኖረውም፣ ‘ወዮላችሁ’ በአማርኛ ተፈጥሯዊነትንና የሁለቱን ሐረጎች ትይዩነት ይጠብቃል።
