  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: am
  text: 'እርሱም ሁሉንም ዙሪያውን ተመልክቶ እርሱን፣ “እጅህን ዘርጋ” አለው። እርሱም እንዲሁ አደረገ፤ እጁም ተመለሰች።[a]


    [a] ወይም፣ “እጁም ዳነች።” የግሪኩ ቃል ቃል በቃል “እጁም ተመለሰች” ማለት ሲሆን፣ እጁ ወደ ትክክለኛ ሁኔታዋ መመለሷን ያጎላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጁም ዳነች።” የግሪኩ ቃል ቃል በቃል “እጁም ተመለሰች” ማለት ሲሆን፣ እጁ ወደ ትክክለኛ ሁኔታዋ መመለሷን ያጎላል።
    reason: lexical_alternative
