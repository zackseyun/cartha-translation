review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purposes of coming, healing from diseases, and the ongoing healing expressed by the imperfect ἐθεραπεύοντο. However, ለመፈወስ can be read as active (“to heal”) rather than as receiving healing; the Greek ἰαθῆναι is passive. The revised wording explicitly preserves this passive sense. The revised rendering of ἐνοχλούμενοι also more directly reflects a passive state of being troubled by unclean spirits.
  naturalness: The initial construction እነርሱም … የመጡ ነበሩ is understandable in its preceding context, but is somewhat heavy. Omitting the resumptive pronoun permits the relative continuation to read more naturally. በርኩሳን መናፍስት ይጨነቁ የነበሩ is idiomatic modern standard Amharic and retains the source’s non-overstated sense.
  terminology: ርኩሳን መናፍስት is an established and appropriate equivalent for πνευμάτων ἀκαθάρτων. ከበሽታዎቻቸው and እየተፈወሱ ነበር suitably retain the separation sense of ἀπό and the imperfective aspect of ἐθεραπεύοντο.
  issues:
  - severity: medium
    issue: The phrase ከበሽታዎቻቸው ለመፈወስ does not clearly mark the passive sense of ἰαθῆναι.
    rationale: In Amharic, ለመፈወስ may be understood actively as healing others. እንዲፈወሱ clearly states that they came in order to receive healing.
  - severity: low
    issue: The phrase ርኩሳን መናፍስት ያስጨንቋቸው የነበሩ is serviceable but less direct than a passive formulation.
    rationale: The Greek participle ἐνοχλούμενοι is passive. A passive Amharic expression preserves both the grammar and the restrained lexical force without implying a stronger term such as torment.
