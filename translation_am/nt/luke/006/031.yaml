review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comparative structure, the desired action, the generic sense of οἱ ἄνθρωποι, and the reciprocal imperative. However, it does not explicitly represent the opening καί, and its separate dative phrases (ለእናንተ … ለእነርሱ) are less idiomatic than Amharic benefactive verb forms.
  naturalness: The wording is readily understandable, but እንዲያደርጉላችሁ / አድርጉላቸው is more natural modern standard Amharic for reciprocal action done “for” someone. The initial እንዲሁም naturally carries the connective καί without adding meaning.
  terminology: ሰዎች appropriately renders the generic ἄνθρωποι. ፈልጉ and አድርጉ retain the ordinary, broad sense of θέλω and ποιέω; no theological terminology is involved.
  issues:
  - severity: low
    issue: The opening connective καί is not represented directly.
    rationale: Although Greek καί can function as a discourse connective, an optimal-equivalence Amharic rendering can naturally preserve it with እንዲሁም.
  - severity: low
    issue: The dative expressions are somewhat wooden in the current phrasing.
    rationale: In modern Amharic, the benefactive forms እንዲያደርጉላችሁ and አድርጉላቸው more naturally convey the reciprocal “do for you/them” relation while preserving the broad verb ἀποιέω/ποιέω sense.
  revised_text: እንዲሁም፣ ሰዎች እንዲያደርጉላችሁ እንደምትፈልጉ፣ እናንተም እንዲሁ አድርጉላቸው።
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s faithful generic reference and broad reciprocal action, while explicitly reflecting καί and using idiomatic Amharic benefactive verb morphology for both occurrences of the Greek dative. No footnote is required because the sense is not materially ambiguous in Amharic.
