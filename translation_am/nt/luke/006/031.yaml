  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: am
  text: እንዲሁም፣ ሰዎች እንዲያደርጉላችሁ እንደምትፈልጉ፣ እናንተም እንዲሁ አድርጉላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: እንደምትፈልጉ
  rationale: ከ θέλετε ጋር ተዋሕዶ የንጽጽሩን መስፈርት በተፈጥሯዊ አማርኛ ያሳያል፤ ὁμοίως ደግሞ «እንዲሁ» ተብሎ ተለይቷል።
- source_word: θέλετε
  choice: ምትፈልጉ
  rationale: በዚህ አውድ ያለውን ተራ ፍላጎት ወይም ምርጫ በዘመናዊና ተፈጥሯዊ ቃል ይገልጣል።
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: ለእናንተ እንዲያደርጉ
  rationale: ἵνα ከ θέλετε ጋር የፍላጎቱን ይዘት ያሳያል፤ የግሪኩን ሰፊ «ማድረግ» ትርጉም ሳያጠብ በአማርኛ የዓላማ ንዑስ አረፍተ ነገር ተተርጉሟል።
- source_word: οἱ ἄνθρωποι
  choice: ሰዎች
  rationale: ቃሉ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ይጠቅሳል።
- source_word: ποιεῖτε αὐτοῖς
  choice: ለእነርሱ አድርጉ
  rationale: የ ποιέωን ሰፊ ትርጉምና ከ ὑμῖν ጋር ያለውን ተመጣጣኝነት ይጠብቃል፤ የአሁን ጊዜ ትእዛዙ ቀጣይ ሥነ ምግባራዊ አሠራርን ሊያመለክት ቢችልም በአማርኛ ተፈጥሯዊ ትእዛዝ ቀርቧል።
- source_word: ὁμοίως
  choice: እናንተም እንዲሁ
  rationale: የሚጠበቀውን ተመሳሳይና ተመላላሽ ድርጊት ግልጽ ያደርጋል።
theological_decisions:
- issue: የ οἱ ἄνθρωποι አጠቃላይ አመልካችነት
  choice: ሰዎች
  alternative: ወንዶች
  rationale: በዚህ አውድ ἄνθρωποι ሰዎችን ሁሉ በአጠቃላይ እንጂ ወንዶችን ብቻ አያመለክትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩን «ማድረግ» ግስ በሁለቱም ክፍሎች በመጠበቅ «መያዝ» ወይም «መስተናገድ» የሚሉ ጠባብ ትርጓሜዎችን አላስገባም።
