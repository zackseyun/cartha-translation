- source_word: δίδοτε
  choice: ስጡ
  rationale: የአሁን ጊዜ ብዙ ቁጥር ትእዛዝን በተፈጥሯዊና አጠቃላይ ምክር መልክ ያቀርባል፤ ድርጊቱን ‘ሁልጊዜ ስጡ’ ብሎ ከግሪኩ በላይ አያብራራም።
- source_word: δοθήσεται ὑμῖν
  choice: ይሰጣችኋልም
  rationale: የግሪኩን ወደፊት ጊዜ ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሰጪውን ሳይገልጽ ይተወዋል።
- source_word: μέτρον καλὸν
  choice: ጥሩ መስፈሪያ
  rationale: የመለኪያ ዕቃንም ሆነ በእርሱ የተሰፈረውን መጠን ሊያመለክት የሚችለውን የገበያ ምስል ይጠብቃል፤ ‘ለጋስ’ የሚል ትርጓሜ አይጨምርም።
- source_word: πεπιεσμένον
  choice: ተጭኖ
  rationale: ዕቃው ብዙ እንዲይዝ ይዘቱ ወደ ታች ተጭኖ መጠጋጋቱን ያሳያል።
- source_word: σεσαλευμένον
  choice: ተወዝውዞ
  rationale: በመስፈሪያው ውስጥ ያለው እህል እንዲሰካካ ዕቃው መወዝወዙን በአጭርና ሕያው ቃል ይገልጻል።
- source_word: ὑπερεκχυννόμενον
  choice: እየተትረፈረፈ
  rationale: ከመስፈሪያው አፍ በላይ ሞልቶ የሚፈስሰውን ብዛት ይገልጻል፤ አሁናዊና ቀጣይ የሆነውን የግሪክ ቦዝ አንቀጽ ሕያውነትም ይጠብቃል።
- source_word: δώσουσιν
  choice: ይሰጡአችኋል
