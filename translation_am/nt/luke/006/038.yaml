- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: በእቅፋችሁ
  rationale: ለዘመናዊ አንባቢ ተፈጥሯዊ ሆኖ የልብስን ፊተኛ እጥፋት እንደ መቀበያ የመጠቀምን ጥንታዊ ምስል ይጠብቃል፤ ባህላዊ ዝርዝሩ በማስታወሻ ተብራርቷል።
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: እናንተ በምትሰፍሩበት መስፈሪያ
  rationale: የመስፈሪያውን ዘይቤና የተመጣጠነ ምላሽ መርሕ ግልጽ አድርጎ ይጠብቃል።
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: ለእናንተም ይሰፈርላችኋል
  rationale: የግሪኩን ተደራጊ ቅርጽና የመልሶ መስፈር ትርጉም ይጠብቃል፤ መላሹን ባለድርጊት አይወስንም።
theological_decisions:
