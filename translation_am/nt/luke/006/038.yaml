  rationale: የቅርብ አውዱ ምሕረትን፣ አለመፍረድን፣ ይቅርታንና መስጠትን ያካትታል። የግሪኩ ጽሑፍ ትእዛዙን በገንዘብ ብቻ ስለማይወስን፣ ትርጉሙም የብልጽግና ትምህርትን ወይም ጠባብ የገንዘብ ትርጓሜን አያስገባም።
