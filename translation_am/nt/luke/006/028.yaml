id: LUK.6.28
reference: Luke 6:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: am
  text: የሚረግሟችሁን መርቁ፤ ለሚበድሏችሁም ጸልዩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: መርቁ
  rationale: የብዙ ሰዎች ትእዛዝ ቅርጽን በቀጥታ ያስተላልፋል፤ ከ«የሚረግሟችሁን» ጋር ያለውን ሥነ ምግባራዊ ተቃርኖም ይጠብቃል።
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: የሚረግሟችሁን
  rationale: በመስተአምር የተጠቀሰውን ተሳቢ አገላለጽ «እናንተን የሚረግሙትን» በተፈጥሯዊና አጭር አማርኛ ይገልጻል።
- source_word: προσεύχεσθε
  choice: ጸልዩ
  rationale: የብዙ ሰዎች ቀጥተኛ ትእዛዝ ሲሆን፣ የግሪኩን የአሁን ጊዜ ቅርጽ በአማርኛ ከልክ በላይ ሳይጫን ትእዛዙን በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: ለሚበድሏችሁም
  rationale: περί ከ«መጸለይ» ጋር «ስለ/ለ» የሚለውን ፍቺ ይሰጣል። «የሚበድሏችሁ» ደግሞ ἐπηρεάζω ሊያመለክተው የሚችለውን የስድብ፣ የግፍ ወይም የተንኮል አያያዝ በሰፊ ቃል ይይዛል።
theological_decisions:
- issue: የጠላትን መውደድ ትእዛዛት ወሰን
  choice: ትእዛዛቱን ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ቀጥተኛ ሥነ ምግባራዊ ትእዛዛት አድርጎ ማቅረብ
  alternative: ትእዛዛቱን በትርጓሜ ማስፋት ወይም ተግባራቸውን በትርጉሙ ውስጥ መገደብ
  rationale: ጥቅሱ ለጥላቻና ለጥቃት የሚሰጠውን ምላሽ በቀጥታ ያዛል። ትርጉሙ የትእዛዛቱን ኃይልና ውጥረት መጠበቅ እንጂ ያልተጠቀሰ ዶክትሪናዊ ገደብ መጨመር የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። «መርቁ» እና «ጸልዩ» የሚሉት ቅርጾች የግሪኩን የብዙ ሰዎች ትእዛዝ ይጠብቃሉ። «በደል» የቃሉን ሰፊ የጠላትነት አያያዝ ስለሚይዝ የተለዋጭ ፍቺ ማስታወሻ አላስፈለገም።
