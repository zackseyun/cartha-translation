- issue: በኢየሱስ ላይ የታሰበውን ድርጊት እንደ ግድያ በግልጽ መተርጎም ወይስ የግሪኩን ክፍትነት መጠበቅ
  choice: በኢየሱስ ላይ ምን ሊያደርጉ እንደሚችሉ
