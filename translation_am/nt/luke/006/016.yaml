  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: am
  text: የያዕቆብን ልጅ ይሁዳን[a]፣ ከሃዲ የሆነውንም አስቆሮታዊውን ይሁዳን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «የያዕቆብ ይሁዳ»፤ «የያዕቆብ ወንድም ይሁዳ» ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: የያዕቆብን ይሁዳን
  rationale: የግሪኩ የባለቤትነት ቅርጽ የቤተሰብ ዝምድናውን በግልጽ አይወስንም። በዋናው ጽሑፍ ዝምድናውን ሳንጨምር «የያዕቆብ ይሁዳ» ብሎ መተርጎም የምንጩን አሻሚነት ይጠብቃል፤ በአማርኛ የስም ዝርዝር ውስጥም ተፈጥሯዊ ነው።
- source_word: Ἰσκαριὼθ
  choice: የአስቆሮቱ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የቦታ/መገኛ መጠሪያ ቅርጽ ይጠብቃል።
- source_word: ὃς ἐγένετο
  choice: የሆነውን
  rationale: γίνομαι የመሆንን ወይም ወደ አንድ ሁኔታ የመግባትን ኃይል ይይዛል፤ «የሆነው» በአማርኛ ተፈጥሯዊ ሆኖ ይህን ይገልጣል።
- source_word: προδότης
  choice: ከሃዲ
  rationale: ሌላውን አሳልፎ የሚሰጥን ወይም የሚከዳን ሰው የሚገልጥ አጭር፣ የተለመደና ክብር ያለው የአማርኛ ቃል ነው።
- source_word: καὶ
  choice: -ም
  rationale: በስም ዝርዝሩ ውስጥ የተደጋገመውን ማያያዣ በተፈጥሯዊ የአማርኛ አያያዝ ያቀርባል።
theological_decisions:
- issue: Ἰακώβου በሚለው ቅርጽ የተጠቆመው የይሁዳና የያዕቆብ ዝምድና
  choice: በዋናው ጽሑፍ «የያዕቆብ ይሁዳ» በማለት ዝምድናውን ሳይወስን ማቅረብ
  alternative: «የያዕቆብ ልጅ ይሁዳ» ወይም «የያዕቆብ ወንድም ይሁዳ»
  rationale: የግሪኩ ጽሑፍ በቀጥታ «የያዕቆብ ይሁዳ» ብቻ ይላል። ልጅነት ይበልጥ የሚገመት ቢሆንም፣ ወንድምነትም ሰዋሰዋዊ አማራጭ ነው፤ ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ የግንዛቤ አማራጮቹም በማስታወሻ ይቀርባሉ።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሐዋርያት ስም ዝርዝር ቀጣይነት በ«-ም» ተጠብቋል፤ የግሪኩ አሻሚ የዝምድና አገላለጽ በዋናው ጽሑፍ አልተወሰነም።
