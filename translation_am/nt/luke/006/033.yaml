review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional reciprocal action and the emphatic comparison with sinners. However, ብቻ (“only”) is not stated in the Greek and can add an unnecessary restriction. For χάρις, እውቅና more directly conveys the contextual sense of credit or commendation than the draft's ምስጋና.
  naturalness: The revised wording is clear, idiomatic modern standard Amharic, and preserves the rhetorical force of the question. Repeating መልካም maintains the verbal correspondence in the Greek without sounding unnatural.
  terminology: ኃጢአተኞች is an appropriate direct rendering of ἁμαρτωλοί. እውቅና is suitable here for χάρις as commendation/credit, while the footnote preserves “ጸጋ” as a lexical alternative without importing a theological sense into the main text.
  issues:
  - severity: low
    issue: The word ብቻ is added in the first clause.
    rationale: The Greek says to do good to those doing good to you; it expresses reciprocity but does not explicitly say that these are the only people to whom good is done. Removing ብቻ preserves the source wording more closely.
  - severity: low
    issue: ምስጋና is less precise than እውቅና for χάρις in this context.
    rationale: Here χάρις concerns credit, favorable recognition, or commendation for reciprocal conduct. እውቅና communicates that sense more directly in modern Amharic.
  revised_text: ለእናንተ መልካም ለሚያደርጉ መልካም ብታደርጉ፣ ምን እውቅና አላችሁ?[a] ኃጢአተኞችም እንኳ ይህንኑ ያደርጋሉ።
