id: LUK.6.33
reference: Luke 6:33
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: am
  text: ለእናንተ መልካም ለሚያደርጉ መልካም ብታደርጉ፣ ምን እውቅና አላችሁ?[a] ኃጢአተኞችም እንኳ ይህንኑ ያደርጋሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምን ጸጋ አላችሁ?” የግሪኩ ቃል “ጸጋ፣” “ሞገስ፣” “ምስጋና፣” ወይም “እውቅና” ማለት ይችላል፤ እዚህ ግን መልካምነትን በመልካምነት ለመመለስ የሚገባ እውቅና ወይም ምስጋናን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε / ἀγαθοποιοῦντας
  choice: መልካም ብታደርጉ / መልካም ለሚያደርጉ
  rationale: የሁለቱን ተመሳሳይ የግሪክ ሥርወ ቃል ግንኙነት በመጠበቅ፣ ድርጊቱ ሌሎችን መጥቀምና በጎ ማድረግን እንዲያመለክት ተተርጉሟል።
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: ምን ምስጋና ታገኛላችሁ?
  rationale: በዚህ የሥነ ምግባር አውድ χάρις ለድርጊቱ የሚገኝን እውቅና ወይም ምስጋና ያመለክታል፤ አገላለጹም በዘመናዊ አማርኛ ተፈጥሯዊ የአጠያየቅ ኃይል አለው።
- source_word: ἁμαρτωλοὶ
  choice: ኃጢአተኞች
  rationale: በሉቃስ ውስጥ ያለውን ሃይማኖታዊና ማኅበራዊ ምድብ ሳያለዝብ ቀጥተኛውን ትርጉም ይሰጣል።
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: ይህንኑ ያደርጋሉ
  rationale: የግሪኩን ‘ያንኑ ያደርጋሉ’ የሚል ቀጥተኛ ሐሳብ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καὶ
  choice: ም / እንኳ
  rationale: የመጀመሪያው አያያዥ በዐውደ ንባቡ ውስጥ በቂ ስለሆነ አዲስ ዓረፍተ ነገር ላይ በግድ አልተደገመም፤ ሁለተኛው ግን የማጉላት ኃይሉን ‘ም እንኳ’ በሚለው ያሳያል።
theological_decisions:
- issue: በዚህ አውድ χάρις የሚለው ቃል ትርጉም
  choice: ለድርጊት የሚገኝ ምስጋና ወይም እውቅና
  alternative: ጸጋ፣ ሞገስ ወይም ምስጋና
  rationale: ጥያቄው በምላሹ ብቻ መልካም ስለማድረግ የሚገኝን ልዩ እውቅና ይመለከታል፤ ስለዚህ ‘ጸጋ’ ብሎ መተርጎም በዚህ ቦታ ጽሑፉ ያልገለጸውን የድነት ትርጉም ሊያስገባ ይችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ብቻ’ የግሪኩን ተመላሽነት በአማርኛ ግልጽ ያደርገዋል፤ ‘እንኳ’ ደግሞ የሁለተኛውን καὶ የማጉላት ኃይል ይጠብቃል።
