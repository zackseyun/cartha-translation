base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: am
  text: መልካም ሰው ከልቡ ባለው መልካም መዝገብ ውስጥ መልካሙን ያወጣል፤ ክፉ ሰውም ከክፉ መዝገቡ ውስጥ ክፉውን ያወጣል፤ ልቡ ከተትረፈረፈው አፉ ይናገራልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከልብ ሙላት የተነሣ አፍ ይናገራልና።»
    reason: lexical_alternative
lexical_decisions:
