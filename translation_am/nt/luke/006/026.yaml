  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: am
  text: ሰዎች ሁሉ ስለ እናንተ መልካም ሲናገሩ[a] ወዮላችሁ! አባቶቻቸውም[b] ስለ ሐሰተኛ ነቢያት እንዲሁ መልካም ይናገሩ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እናንተ በአዎንታ ሲናገሩ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል “አባቶቻቸው”፤ ማለትም የሕዝባቸው ቀደምት ትውልዶች።
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: ወዮላችሁ!
  rationale: የግሪኩን ቃል የትንቢታዊ ማስጠንቀቂያና የፍርድ አዋጅ ኃይል ይጠብቃል፤ በአማርኛም በዚህ አውድ የተለመደና ክብር ያለው አገላለጽ ነው።
- source_word: ὅταν
  choice: ሲናገሩ
  rationale: አጠቃላይ ሁኔታን የሚያመለክተውን ‘በሚናገሩበት ጊዜ’ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: ስለ እናንተ መልካም ሲናገሩ
  rationale: ሐረጉ ንግግራቸው ትክክል መሆኑን ሳይሆን ሰዎቹ ስለ እናንተ በአዎንታ መናገራቸውን ያመለክታል።
- source_word: πάντες οἱ ἄνθρωποι
  choice: ሰዎች ሁሉ
  rationale: ጾታን ሳይለይ ሁሉንም ሰው የሚያካትተውን የግሪኩን አጠቃላይ ፍቺ ይጠብቃል።
- source_word: κατὰ τὰ αὐτά
  choice: እንዲሁ
  rationale: ‘በተመሳሳይ ሁኔታ’ ወይም ‘ያንኑ’ የሚለውን ፍቺ ከ‘ያደርጉ’ ጋር በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: γάρ
  choice: ነበርና
  rationale: ቀዳሚው የወዮታ አዋጅ ምክንያት የሚቀጥለው ታሪካዊ ንጽጽር መሆኑን ‘-ና’ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐποίουν
  choice: ያደርጉ ነበር
  rationale: የግሪኩ የአላፊ ጊዜ ግስ የተደጋጋሚ ወይም የተለመደ ያለፈ ተግባርን ስለሚያመለክት፣ ‘ያደርጉ ነበር’ ያንን ገጽታ በግልጽ ይገልጣል።
- source_word: τοῖς ψευδοπροφήταις
  choice: ለሐሰተኛ ነቢያት
  rationale: ድርጊቱ የተደረገላቸውን ሰዎች የሚያመለክተውን የዳቲቭ አገባብ በቀጥታ ያቀርባል።
- source_word: οἱ πατέρες αὐτῶν
  choice: አባቶቻቸው
  rationale: የግሪኩን ቃልና የመጽሐፍ ቅዱስን የትውልድ አገላለጽ ይጠብቃል፤ እዚህ ያለው ሰፊ ታሪካዊ ፍቺ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: ከሐሰተኛ ነቢያት ጋር የተደረገው ንጽጽር አመልካችና ኃይል
  choice: ሰዎች ሁሉ የሚሰጡት አዎንታዊ ምስክርነት፣ የቀድሞ ትውልዶች ሐሰተኛ ነቢያትን ከተቀበሉበት ታሪካዊ ልማድ ጋር ተነጻጽሮ እንደ ማስጠንቀቂያ ቀርቧል።
  alternative: ጥቅሱ ከሌሎች የሚመጣውን ማንኛውንም መልካም ንግግር ያለ ልዩነት ይኮንናል፤ ወይም ዋና ትኩረቱ ሐሰተኛ ተቀባይነት ሳይሆን ዝነኛነት ብቻ ነው።
  rationale: γάρ እና κατὰ τὰ αὐτά የወዮታውን ምክንያት በታሪካዊ ንጽጽር ያቀርባሉ። ትርጉሙ ሁሉንም ምስጋና በጅምላ እንደሚከለክል ሳያሰፋው፣ ሐሰተኛ ነቢያት ያገኙትን ሰፊ ተቀባይነት እንደ አስጠንቃቂ ምሳሌ ያቆያል።
