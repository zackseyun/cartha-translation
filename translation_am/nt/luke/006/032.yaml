id: LUK.6.32
reference: Luke 6:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: am
  text: የሚወዷችሁን ብትወዱ፣ ምን ምስጋና ይገባችኋል?[a] ኃጢአተኞችም እንኳ የሚወዷቸውን ይወዳሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለእናንተ ምን ጸጋ አለ?» የግሪኩ ቃል «ጸጋ፣ ምስጋና፣ ውለታ» የሚሉ ትርጉሞችን ሊይዝ ይችላል፤ እዚህ ግን ምስጋና ወይም ማድነቅ የሚገባውን ነገር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: የሚወዷችሁን / ብትወዱ / የሚወዷቸውን / ይወዳሉ
  rationale: የግሪኩን የἀγαπάω ድግግሞሽና የንግግሩን አጽንዖት ለመጠበቅ በሁሉም ቦታ «መውደድ» ተጠቅሟል።
- source_word: ποία
  choice: ምን
  rationale: ጥያቄውን በተፈጥሯዊ አማርኛ ያቀርባል፤ በዚህ አውድ «ምን ዓይነት» ማለት አላስፈላጊ ማስፋት ይሆናል።
- source_word: χάρις
  choice: ምስጋና
  rationale: በአውዱ ቃሉ የሚያመለክተው መንፈሳዊ የድነት «ጸጋን» ሳይሆን ሊያስመሰግን የሚችል ነገርን ነው። «ምስጋና» በአማርኛ ጥያቄውን ተፈጥሯዊ ያደርገዋል፤ የቃሉ ሰፊ ትርጉም በማስታወሻው ተጠብቋል።
- source_word: ἁμαρτωλοὶ
  choice: ኃጢአተኞች
  rationale: የግሪኩን ስማዊ የሥነ ምግባር ምድብ በቀጥታና በተለመደ የአዲስ ኪዳን አጠቃቀም ያስተላልፋል።
- source_word: καὶ γὰρ
  choice: ም… እንኳ … ና
  rationale: «እንኳ» የκαίን አጽንዖት፣ የመጨረሻው «-ና» ደግሞ የγάρን ማብራሪያዊ ምክንያት በተፈጥሯዊ አማርኛ ያስተላልፋሉ።
- source_word: ὑμῖν
  choice: አላችሁ
  rationale: የግሪኩ የባለቤትነት/ጥቅም ዳቲቭ ከ«ምስጋና» ጋር በተፈጥሯዊ አማርኛ «ምን ምስጋና አላችሁ?» ተብሎ ተገልጿል።
theological_decisions:
- issue: በዚህ ንግግር ውስጥ የχάρις ትርጉም
  choice: ከማዳን ትምህርት ውጭ የሆነ «ምስጋና/የሚያስመሰግን ነገር»
  alternative: «ጸጋ» ወይም «ውለታ»
  rationale: የቅርብ አውዱ አጸፋዊ ፍቅር ምን ያህል ሊያስመሰግን እንደሚችል ይጠይቃል። «ጸጋ» እዚህ በግሪኩ ያልተገደበ የድነት ትምህርታዊ ትርጉም ሊያስገባ ይችላል፤ ሆኖም ትክክለኛው የቃል አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ«መውደድ» ድግግሞሽ ሆን ተብሎ ተጠብቋል፤ የግሪኩ የሁለተኛ መደብ ብዙ ቁጥርም በ«እናንተ» ተገልጿል።
