  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: am
  text: ወደ እኔ የሚመጣ፣ ቃሎቼንም የሚሰማና የሚፈጽማቸው ሁሉ ማንን እንደሚመስል አሳያችኋለሁ፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: ወደ እኔ መጥቶ … ሁሉ
  rationale: የግሪኩ አገላለጽ ማንኛውንም ወደ ኢየሱስ የሚመጣ ሰው በአጠቃላይ ያመለክታል። «ሁሉ» ይህን ሁሉን አቀፍ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀκούων μου τῶν λόγων
  choice: ቃሎቼን የሚሰማ
  rationale: «ቃሎቼን» የሚለው ንግግር ሙ ከλόγων ጋር ያለውን የባለቤትነት/ምንጭ ግንኙነት በግልጽ ያቀርባል፤ «የሚሰማ» ደግሞ ἀκούωνን በቀጥታ ይተረጉማል።
- source_word: ποιῶν αὐτούς
  choice: የሚፈጽማቸው
  rationale: ቃሎችን «ማድረግ» በዘመናዊ አማርኛ የተፈጥሮ አገላለጽ ስላልሆነ፣ «መፈጸም» ቃሎቹን በተግባር ማዋልን በትክክልና በግልጽ ያሳያል።
- source_word: ὑποδείξω ὑμῖν
  choice: አሳያችኋለሁ
  rationale: የወደፊት ጊዜውንና የብዙ ተደራሲዎችን ቅርጽ ይጠብቃል፤ ቀጥሎ የሚቀርበውን ምሳሌ ያስተዋውቃል።
- source_word: τίνι ἐστὶν ὅμοιος
  choice: ማንን እንደሚመስል
  rationale: ግሪኩ በቃል ቅርጹ «ለማን ተመሳሳይ እንደሆነ» ይላል። አማርኛው «ማንን እንደሚመስል» ትርጉሙንና የሰው ንጽጽሩን በተፈጥሯዊ መንገድ ይጠብቃል።
theological_decisions:
- issue: በግሪክ ያለው አጠቃላይ ተባዕታይ ነጠላ ቅርጽ
  choice: በ«…የሚሰማና የሚፈጽማቸው ሁሉ» የተባለ ጾታ-አልባ አጠቃላይ የአማርኛ አገላለጽ
  alternative: «እርሱ» የሚል ተባዕታይ ተውላጠ ስም መጨመር
  rationale: የግሪኩ ተባዕታይ ነጠላ ቅርጽ ማንኛውንም ሰው በአጠቃላይ ይወክላል። አማርኛ ይህን ያለ ጾታ ተውላጠ ስም በተፈጥሮ ሊገልጽ ስለሚችል፣ «እርሱ»ን መጨመር የምንጩን ትርጉም ሳያስፈልግ ወደ ወንድ ሊያጠብበው ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የሚሰማና የሚፈጽማቸው» የሰሚነትንና የተግባርን ትይዩነት ይጠብቃል፤ የግሪኩ አሻሚነት ያለምክንያት አልተፈታም።
