    text: ‘ወንድም’ በግሪክ ያለውን ተባዕታይ ነጠላ ቃል ይተረጉማል፤ ማስተማሪያው ግን በወንድ ወንድም ብቻ የተወሰነ አይደለም።
    reason: cultural_note
  - marker: c
    text: ‘ምሰሶ’ (ግሪክ፦ δοκός) ትልቅ የሕንፃ እንጨት ነው፤ ‘ትልቅ ግንድ’ ወይም ‘ሳንቃ’ ተብሎም ሊገለጽ ይችላል።
    reason: lexical_alternative
