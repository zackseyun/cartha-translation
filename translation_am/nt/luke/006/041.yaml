  rationale: ከ βλέπεις ጋር በዚህ የወቀሳ ጥያቄ ውስጥ ምክንያትን የሚጠይቅ ኃይል ስላለው፣ ተፈጥሯዊው የአማርኛ አቻ ‘ለምን’ ነው።
