- source_word: βλέπεις
  choice: ታያለህ
  rationale: የማየትን ቀጥተኛ ምስል ይጠብቃል፣ ከ κατανοεῖς ጋር ያለውንም የቃላት ልዩነት አያጠፋም።
- source_word: κάρφος
  choice: ጉድፍ
  rationale: በዓይን ውስጥ የሚገባ ትንሽ ቅንጣትን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከትልቁ δοκός ጋር ያለውን ሆን ተብሎ የተጋነነ ንጽጽርም ይጠብቃል።
- source_word: ὀφθαλμῷ
  choice: ዓይን
  rationale: የግሪኩን ነጠላ ቁጥርና የእይታውን ምሳሌ በቀጥታ ይጠብቃል።
- source_word: ἀδελφοῦ
  choice: ወንድምህ
  rationale: የግሪኩን ተባዕታይ ነጠላ የዝምድና ቃል በትክክል ይተረጉማል፤ ምሳሌው ሰፊ ተፈጻሚነት እንዳለው በማስታወሻ ተገልጿል።
