  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: am
  text: ነገር ግን፣ በወንድምህ[b] ዓይን ያለውን ጉድፍ[a] ለምን ታያለህ፣ በራስህ ዓይን ያለውን ምሰሶ[c] ግን አታስተውልም?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ጉድፍ’ (ግሪክ፦ κάρφος) ‘ትንሽ የእንጨት ፍንጣሪ’ ወይም ‘ገለባ’ ተብሎም ሊተረጎም ይችላል፤ ከትልቁ ምሰሶ ጋር የተነጻጸረ እጅግ ትንሽ ቅንጣት ነው።
    reason: lexical_alternative
