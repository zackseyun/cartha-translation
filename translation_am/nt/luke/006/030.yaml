  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: am
  text: ከአንተ ለሚጠይቅ ሁሉ ስጥ፤ የአንተን ነገር ከሚወስድ መልሶ እንዲመልስልህ አትጠይቀው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መልሰህ አትጠይቀው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὶ
  choice: ለ…ሁሉ
  rationale: የግሪኩን አከፋፋይና ሁሉን አቀፍ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αἰτοῦντί σε
  choice: ከአንተ ለሚጠይቅ
  rationale: αἰτέω በአጠቃላይ መጠየቅን ያመለክታል፤ ‘ለሚለምንህ’ ማለት በግሪኩ ያልተገለጠውን የማኅበራዊ ሁኔታ ሊያክል ይችላል።
- source_word: δίδου
  choice: ስጥ
  rationale: የአሁን ጊዜ ትእዛዝን በቀጥተኛና ተፈጥሯዊ የአማርኛ ትእዛዝ ይገልጣል፤ ተደጋጋሚነቱን ከልክ በላይ አያጎላም።
- source_word: ἀπὸ τοῦ αἴροντος τὰ σὰ
  choice: የአንተ የሆነውን…ከሚወስድብህ ሰው
  rationale: αἴρω እዚህ ንብረትን መውሰድን ያመለክታል፤ ትርጉሙን ‘መስረቅ’ ወደሚል የሕግ ምድብ አያጠብም። τὰ σὰ ያለውንም ሰፊ ማጣቀሻ ይጠብቃል።
- source_word: μὴ ἀπαίτει
  choice: መልሶ እንዲሰጥህ አትጠይቀው
  rationale: ἀπαιτέω የተወሰደን ነገር መልሶ መጠየቅን ወይም መጠየቅን በጥብቅ ማቅረብን ሊያመለክት ይችላል። ይህ አገላለጽ በአማርኛ ግልጽ ሆኖ የመመለስን ሐሳብ ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ የሥነ ምግባር ትእዛዝ ወሰንና ኃይል
  choice: ትእዛዞቹን ሰፊና ቀጥተኛ እንደሆኑ መተርጎም
  alternative: ቃሉን እንደ ማጋነን በመውሰድ ማለዘብ፣ ለምጽዋት ብቻ መገደብ፣ ወይም ሁለተኛውን ክፍል ለስርቆት ካሳ ብቻ ማድረግ
  rationale: የግሪኩ ጽሑፍ ቀጥተኛ ትእዛዞችንና ‘ሁሉ’ የሚል ሰፊ ቃል ይጠቀማል። ትርጉሙ የቃሉን ሥነ ምግባራዊ ውጥረት መጠበቅ እንጂ አፈጻጸሙን በትርጓሜ መገደብ የለበትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ሰረዝ-ነጥቡ የሁለቱን ተዛማጅ ትእዛዞች ግንኙነት ያሳያል።
