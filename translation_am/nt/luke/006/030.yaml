review_pass:
  verdict: revise
  source_fidelity: The first clause accurately reflects παντὶ αἰτοῦντί σε δίδου. In the second clause, however, ከሚወስድብህ (“who takes from you”) does not as directly express τὰ σά (“what is yours”) as the Greek does. The wording መልሶ እንዲሰጥህ አትጠይቀው is intelligible, but “do not demand it back” is more forceful than a general request that the person give it back.
  naturalness: The draft is generally fluent modern standard Amharic. Recasting the second clause with የአንተን ነገር and እንዲመልስልህ makes the possession relationship explicit and gives a more natural expression for requiring return.
  terminology: No names or specialized theological terms occur. የአንተን ነገር preserves the broad sense of τὰ σά without narrowing it to stolen property or to a specific legal category. አትጠይቀው is retained for ἀπαίτει, with the return sense supplied by እንዲመልስልህ.
  issues:
  - severity: medium
    issue: The phrase ከሚወስድብህ does not explicitly render τὰ σά.
    rationale: The Greek specifies “the things that are yours,” not merely an act of taking from the addressee. Explicitly naming የአንተን ነገር preserves the source relation and breadth.
  - severity: low
    issue: The main text’s wording for ἀπαίτει somewhat softens the sense of reclaiming/demanding return.
    rationale: መልሶ እንዲሰጥህ አትጠይቀው can be read as simply not asking someone to give. እንዲመልስልህ more specifically conveys return, while the imperative verb keeps the prohibition direct.
  revised_text: ከአንተ ለሚጠይቅ ሁሉ ስጥ፤ የአንተን ነገር ከሚወስድ መልሶ እንዲመልስልህ አትጠይቀው።[a]
  revised_footnotes:
