- from: አባታችሁ መሐሪ እንደሆነ፣ እናንተም መሐሪዎች[a] ሁኑ።
  to: አባታችሁ ምሕረተኛ እንደሆነ፣ እናንተም ምሕረተኞች[a] ሁኑ።
  rationale: The revision preserves the comparative force of καθώς (“እንደሆነ”), the direct relational wording “አባታችሁ,” and the Greek repetition of οἰκτίρμων. It replaces a term that can focus specifically on forgiveness with one that more fully represents merciful compassion, without adding interpretation.
