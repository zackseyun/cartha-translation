  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: am
  text: አባታችሁ ምሕረተኛ እንደሆነ፣ እናንተም ምሕረተኞች[a] ሁኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ርኅሩኆች።» የግሪኩ ቅጽል ስም በርኅራኄ ተነሳስቶ ምሕረት የሚያሳይን ሰው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ሁኑ
  rationale: የአሁን ጊዜ ትእዛዛዊ ቅርጹ ቀጣይ የሕይወት ባሕርይ እንዲሆን የሚጠይቅ ሲሆን፣ «ሁኑ» በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: መሐሪዎች / መሐሪ
  rationale: ቃሉ በርኅራኄ ተነሳስቶ ምሕረትን የሚያሳይ ባሕርይ ያመለክታል። በሁለቱም ስፍራ ተመሳሳይ ሥር መጠቀም የግሪኩን የቃል ትስስር ይጠብቃል።
- source_word: καθὼς
  choice: እንደሆነ
  rationale: የአብን ምሕረት ለደቀ መዛሙርቱ ባሕርይ መለኪያና አርአያ አድርጎ የሚያቀርበውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ πατὴρ ὑμῶν
  choice: አባታችሁ
  rationale: ግሪኩ «የሰማይ» የሚል ቅጽል ስለሌለው ሳይጨመር ቀጥተኛው ዝምድናዊ አገላለጽ ተጠብቋል።
theological_decisions:
- issue: የትእዛዙ ከአብ ባሕርይ ጋር ያለው ግንኙነት
  choice: የአብ ምሕረት የአማኞች ባሕርይ አርአያ መሆኑን በንጽጽር ማቅረብ
  alternative: «አባታችሁ መሐሪ ስለሆነ» በማለት ምክንያታዊ ግንኙነት ማድረግ
  rationale: καθώς እዚህ «ልክ እንደ» የሚል ንጽጽርን ይገልጣል፤ «ስለሆነ» ብሎ መተርጎም በጽሑፉ ያልተገለጸ ምክንያታዊ ትርጓሜ ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛን ተፈጥሯዊ ሰዋስው በመከተል የንጽጽሩ ክፍል ከትእዛዙ በፊት ቀርቧል፤ የግሪኩ ትርጉምና አጽንዖት ግን ተጠብቋል።
