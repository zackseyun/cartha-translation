review_pass:
  verdict: revise
  source_fidelity: The draft preserves the plural imperative, the comparison introduced by καθώς, the unexpanded expression “your Father,” and the repeated adjective. However, መሐሪ primarily evokes forgiving someone, whereas οἰκτίρμων more broadly denotes a disposition of mercy or compassion. A more inclusive Amharic term is preferable.
  naturalness: The proposed reordered Amharic syntax is natural and clear. Replacing መሐሪ with ምሕረተኛ retains an elevated but accessible modern biblical register and communicates the intended quality more accurately.
  terminology: Use ምሕረተኛ consistently for both occurrences of οἰκτίρμων. This avoids narrowing the sense to forgiveness while retaining the verse’s lexical repetition. The alternative ርኅሩኅ may be retained in the note as “compassionate.”
  issues:
  - severity: medium
    issue: መሐሪ narrows the sense of οἰκτίρμων.
    rationale: In current Amharic, መሐሪ commonly foregrounds forgiving an offense. The Greek adjective encompasses compassionate mercy more generally, including being moved by pity; ምሕረተኛ better conveys that broader disposition.
  revised_text: አባታችሁ ምሕረተኛ እንደሆነ፣ እናንተም ምሕረተኞች[a] ሁኑ።
