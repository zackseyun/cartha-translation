base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: am
  text: ጉንጭህን[a] ለሚመታህ ሌላውን ጉንጭህንም አቅርብለት[b]፤ መደረቢያህን ከሚወስድብህ የውስጥ ልብስህንም አትከልክለው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መንጋጋህን።”
    reason: lexical_alternative
  - marker: b
    text: ባህላዊ ትርጉሞች “ሌላውንም አዙር” ሊሉ ይችላሉ፤ የግሪኩ ግስ ግን “አቅርብ/አቅርብለት” የሚል ነው።
    reason: alternative_reading
  - marker: c
    text: “መደረቢያ” (ἱμάτιον) የውጭ ልብስ ነው፤ “የውስጥ ልብስ” (χιτών) ደግሞ ከሥር የሚለበስ ልብስ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: ለሚመታህ
  rationale: ስማዊ የሆነውን የአሁን ጊዜ ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ አጠቃላይ ባሕርይ እንዲገልጽ ያቀርባል።
- source_word: ἐπὶ τὴν σιαγόνα
  choice: ጉንጭህን
  rationale: σιαγών ጉንጭን ወይም መንጋጋን ሊያመለክት ይችላል፤ በመመታት አውድ ‘ጉንጭ’ ተፈጥሯዊና የተለመደ ነው።
- source_word: πάρεχε
  choice: አቅርብለት
  rationale: ‘አቅርብ/ስጥ’ የሚለውን የግሪኩን ቀጥተኛ ኃይል ይጠብቃል፤ ከማቴዎስ ትይዩ የተለመደውን ‘አዙር’ አያስገባም።
- source_word: καὶ τὴν ἄλλην
  choice: ሌላውንም
  rationale: በአማርኛ የተተወው ስም ‘ጉንጭ’ ከአውዱ ግልጽ ሲሆን፣ -ም የκαίን ‘ደግሞ’ ትርጉም ይጠብቃል።
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: ከሚወስድብህ
  rationale: ልብሱን ከባለቤቱ የማስወገድን ሐሳብ እና በተጎጂው ላይ የሚደርሰውን ድርጊት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὸ ἱμάτιον
  choice: መደረቢያህን
  rationale: ἱμάτιον በውጭ የሚለበሰውን ልብስ ያመለክታል፤ ‘መደረቢያ’ ከውስጠኛው χιτών ያለውን ልዩነት በግልጽ ይጠብቃል።
- source_word: τὸν χιτῶνα
  choice: እጀ ጠባብህን
  rationale: χίτων ከመደረቢያው በታች በሰውነት አጠገብ የሚለበስ ውስጠኛ ልብስ ነው፤ ‘እጀ ጠባብ’ የታወቀውን የመጽሐፍ ቅዱስ የልብስ ቃል ይጠቀማል።
- source_word: μὴ κωλύσῃς
  choice: አትከልክለው
  rationale: የκωλύωን ‘መከልከል/ማገድ’ መሠረታዊ ትርጉምና የክልከላ ትእዛዙን በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የሉቃስን አገላለጽ ከማቴዎስ ‘ሌላውን ጉንጭ አዙር’ ከሚለው ጋር ማስማማት ወይም አለማስማማት
  choice: የሉቃስን ልዩ አገላለጽ ‘ሌላውንም አቅርብለት’ ብሎ ማቆየት
  alternative: ‘ሌላውን ጉንጭህንም አዙርለት’ ብሎ መተርጎም
  rationale: ግሪኩ πάρεχε (‘አቅርብ/ስጥ’) ይላል እንጂ ‘አዙር’ የሚል ግስ አይጠቀምም፤ ይህ ምርጫ የትይዩውን ወንጌል አገላለጽ ወደ ሉቃስ አያስገባም።
- issue: ትእዛዞቹን በትርጓሜ ማለስለስ ወይም በቀጥታ ማቅረብ
  choice: ቀጥተኛውን የትእዛዝ ኃይል ያለ ተጨማሪ ማብራሪያ ማቆየት
  alternative: በዋናው ጽሑፍ ውስጥ ስለ አጸፋ አለመመለስ ወይም ስለ አነጋገር ማጋነን ገደብ መጨመር
  rationale: ጥቅሱ ቀጥተኛ የሁለተኛ መደብ ትእዛዞችን ይሰጣል፤ ትርጉሙ የኢየሱስን ትምህርት ኃይልና የትርጓሜ ውጥረት ሳይፈታ ይጠብቃል።
