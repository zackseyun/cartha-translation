  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አቅርብለት’ የሉቃስን ልዩ ግስ ይጠብቃል፤ የሁለቱ ልብሶች ልዩነትም በቃላትና በእግር ማስታወሻ ተገልጿል።
