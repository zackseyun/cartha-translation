  choice: ሰምቶ ያልፈጸመ
  alternative: ሰምቶ ያላደረገ / በተግባር ያላዋለ
  rationale: ποιέω ቀላል የ«ማድረግ» ግስ ቢሆንም በአውዱ የተሰማውን ቃል መፈጸም ነው። «ያልፈጸመ» ይህን ግንኙነት ያሳያል እንጂ ተጨማሪ ሥነ መለኮታዊ ትርጓሜ አያስገባም።
