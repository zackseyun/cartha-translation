source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: am
  text: ነገር ግን ሰምቶ ያልፈጸመ[a] ሰው፣ ያለ መሠረት በመሬት ላይ ቤት የሠራን ሰው ይመስላል። ወንዙም ቤቱን በኃይል በመታው ጊዜ ወዲያው ፈረሰ፤ የዚያም ቤት ጥፋት[b] ታላቅ ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሰምቶ ያላደረገ» ወይም «ሰምቶ በተግባር ያላዋለ»። የግሪኩ ግስ በቀጥታ «ማድረግ» ማለት ሲሆን፣ እዚህ የኢየሱስን ቃል መፈጸምን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የዚያ ቤት ስብራት ታላቅ ሆነ»። የግሪኩ ቃል ስብራትን፣ መሰንጠቅን ወይም ጥፋትን ሊያመለክት ይችላል፤ ቤቱ በፈረሰበት በዚህ አውድ «ጥፋት» የሚለው ተፈጥሯዊ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: ነገር ግን ሰምቶ ያልፈጸመ ሰው
  rationale: የግሪኩ አገላለጽ የሚያመለክተው ሰምቶ በተግባር ያላዋለውን ሰው ነው። «ያልፈጸመ» ከቀደመው የኢየሱስ ቃል ጋር በተፈጥሮ ይያያዛል።
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: ሰውን ይመስላል
  rationale: ቀጥተኛውን የንጽጽር አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ἀνθρώπῳ በዚህ ምሳሌ አንድን ተወካይ ሰው ያመለክታል።
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: ያለ መሠረት በመሬት ላይ ቤት የሠራን ሰው
  rationale: γῆ በዚህ የቤቱን መቆሚያ መሬት ያመለክታል፤ χωρὶς θεμελίου ደግሞ መሠረት አለመኖሩን ግልጽ አድርጎ ያቆያል።
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: ወንዙም ቤቱን በኃይል በመታው ጊዜ
  rationale: προσρήγνυμι የኃይለኛ ግጭትን ሐሳብ ይይዛል። የግሪኩ አንጻራዊ አረፍተ ነገር ለተፈጥሯዊ አማርኛ በጊዜ አገላለጽ ቀርቧል።
- source_word: εὐθὺς συνέπεσεν
  choice: ወዲያው ፈረሰ
  rationale: εὐθύς ፈጣንነቱን ያቆያል፤ συμπίπτω ስለ ቤት ሲነገር «ፈረሰ» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: የዚያም ቤት ጥፋት ታላቅ ሆነ
  rationale: ῥῆγμα ስብራትን፣ መሰንጠቅን ወይም ከመፍረስ የተነሣ ጥፋትን ሊያመለክት ይችላል። «ጥፋት» በዚህ አውድ ተፈጥሯዊ ሲሆን μέγα የሚለውን «ታላቅ» ብሎ ያቆያል።
theological_decisions:
