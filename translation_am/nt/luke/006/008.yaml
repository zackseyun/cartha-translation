lexical_decisions:
- source_word: ᾔδει
  choice: ያውቅ ነበር
  rationale: የግሪክኛው ቅርጽ በዚህ አገባብ የማወቅን ሁኔታ ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ የትረካ አገላለጽ ነው።
- source_word: διαλογισμοὺς
  choice: ሐሳባቸውን
  rationale: ቃሉ ሐሳብን፣ ውስጣዊ አስተሳሰብን ወይም ምክንያታዊ መመካከርን ሊያመለክት ይችላል። “ሐሳባቸውን” ግልጽና ተፈጥሯዊ ሲሆን ትርጉሙን አያጠብም።
- source_word: ἀνδρὶ
  choice: ሰው
  rationale: በዐውደ ንባቡ የተጠቀሰው ግለሰብ ወንድ መሆኑ ግልጽ ቢሆንም፣ “ሰው” በአማርኛ ለአንድ ወንድ ግለሰብ ተፈጥሯዊ መጠሪያ ነው፤ ጾታውንም አይክድም።
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: እጁ ለደረቀችበት
  rationale: ξηρός ስለ አካል ክፍል ሲነገር የደረቀ፣ የሰለለ ወይም የከሰመ ማለት ነው። የተመረጠው አገላለጽ ቀጥተኛና በቀላሉ የሚገባ ነው።
- source_word: Ἔγειρε
  choice: ተነሥ
  rationale: ትእዛዙ ሰውየው ከነበረበት እንዲነሣ ይጠይቃል፤ ከሚቀጥለው “ቁም” የተለየ እርምጃ መሆኑ ተጠብቋል።
- source_word: στῆθι
  choice: ቁም
  rationale: ቃሉ በቆመ ሁኔታ መቆየትን ወይም ቦታ መያዝን ያመለክታል፤ “ቁም” ቀጥተኛውን ትእዛዝ ይጠብቃል።
- source_word: εἰς τὸ μέσον
  choice: ወደ መሃል ሄደህ
  rationale: ሐረጉ ወደ ተሰበሰቡት ሰዎች መካከል መግባትን ያመለክታል። “ሄደህ” በአማርኛ አቅጣጫውንና የትእዛዙን ተፈጥሯዊነት ያሳያል።
- source_word: ἀναστὰς ἔστη
  choice: ተነሥቶ ቆመ
  rationale: የተውሳከ ግስና የዋና ግስ ቅደም ተከተል ሁለቱን ተከታታይ ድርጊቶች ያሳያል፤ አማርኛውም ሁለቱን ሳያዋሕድ ይጠብቃል።
