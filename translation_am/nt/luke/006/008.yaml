  rationale: ጥቅሱ ኢየሱስ ሐሳባቸውን እንዳወቀ ይናገራል እንጂ ያወቀበትን መንገድ አይገልጽም። ትርጉሙ ይህን ክፍትነት ይጠብቃል።
