- issue: υἱοὶ Ὑψίστου የወንድ ብዙ ቁጥርና ወካይ አገባብ
  choice: የልዑል ልጆች
  alternative: የልዑል ወንድ ልጆች
  rationale: ግሪኩ υἱοί በሰዋስው ወንድ ብዙ ቁጥር ቢሆንም፣ ‘ወንድ ልጆች’ በአማርኛ ሴቶችን እንደሚያስወግድ ያልተፈለገ ገደብ ይፈጥራል። ‘ልጆች’ ተፈጥሯዊ የወካይ ትርጉምን ያቆያል፣ የምንጩ ወንድ ቅርጽም በማስታወሻ ይታያል።
