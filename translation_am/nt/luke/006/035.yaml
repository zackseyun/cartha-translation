  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: am
  text: ነገር ግን ጠላቶቻችሁን ውደዱ፤ መልካምም አድርጉ፤ ምንም መልስ ሳትጠብቁ[a] አበድሩ። ሽልማታችሁም ታላቅ ይሆናል፤ የልዑልም ልጆች[b] ትሆናላችሁ፤ ምክንያቱም እርሱ ለማያመሰግኑና ለክፉዎች ቸር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ብዙም የማይመረጥ ንባብ፣ “ከማንም ተስፋ ሳትቆርጡ” ወይም “ፈጽሞ ተስፋ ሳትቆርጡ።” μηδὲν ἀπελπίζοντες የሚለው የግሪክ ሐረግ አስቸጋሪ ነው፤ በዚህ አውድ ግን ብድሩ እንዲመለስ ወይም በምትኩ ነገር ለማግኘት አለመጠበቅ ማለት እንደሆነ ተወስዷል።
    reason: lexical_alternative
  - marker: b
    text: “ልጆች” ተብሎ የተተረጎመው የግሪክ ቃል በቅርጹ ወንድ ብዙ ቁጥር ነው፤ እዚህ ግን ሁሉን የሚወክል አገባብ ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ነገር ግን
  rationale: ከቀደመው የመመላለስ ፍቅር ጋር ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: ጠላቶቻችሁን ውደዱ
  rationale: የትእዛዙን ቀጥተኛነትና ‘ጠላቶች’ የሚለውን አስደንጋጭ ኃይል ሳያለዝብ ያቆያል።
- source_word: ἀγαθοποιεῖτε
  choice: መልካምም አድርጉ
  rationale: ግሱ የሚያመለክተውን ንቁ በጎ አድራጎት በተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: δανίζετε
  choice: አበድሩ
  rationale: ግሱን በቀጥታ ይተረጉማል፤ ግሪኩ ያልገደበውን ‘ገንዘብ’ የሚል ቃል አይጨምርም።
- source_word: μηδὲν ἀπελπίζοντες
  choice: ምንም እንዲመለስላችሁ ሳትጠብቁ
  rationale: በማበደርና በመመላለስ አውድ ውስጥ ዋናውን የመመለስ ተስፋ መተው ትርጉም በግልጽ አማርኛ ይገልጣል፤ ሌላው አጠራጣሪ ንባብ በማስታወሻ ተጠብቋል።
- source_word: μισθὸς ὑμῶν πολύς
  choice: ዋጋችሁ ታላቅ ይሆናል
  rationale: ‘ዋጋ’ በዚህ ሥነ ምግባራዊና መጨረሻዊ አውድ የሚሰጥን ፍዳ ሳይሆን ሽልማትን የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው፤ ‘ታላቅ’ ደግሞ πολύςን በክብደት ያቀርባል።
- source_word: υἱοὶ Ὑψίστου
  choice: የልዑል ልጆች
  rationale: ‘ልዑል’ የመለኮታዊውን ማዕረግ ያቆያል። በአማርኛ ‘ልጆች’ ለወንድ ብዙ ቁጥርም ሆነ ለወካይ የዘር ግንኙነት ተፈጥሯዊ ሲሆን፣ የግሪኩ ቃል በቅርጹ ወንድ መሆኑ በማስታወሻ ተገልጧል።
- source_word: χρηστός
  choice: ቸር
  rationale: እግዚአብሔር ለማይገባቸው ሰዎች የሚያደርገውን በጎነትና ደግነት በክብር የሚገልጥ ዘመናዊ ቃል ነው።
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: ለማያመሰግኑና ለክፉዎች
  rationale: ሁለቱንም ቅጽሎች እንደ ሰዎች የሚጠቁሙ ስማዊ ቅጾች አድርጎ በግልጽ አማርኛ ያቀርባል።
theological_decisions:
