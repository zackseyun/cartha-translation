review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the beatitude, generic ‘people,’ hatred, exclusion, insult, and the causal connection to the Son of Man. However, ‘ስማችሁን እንደ ክፉ በሚጥሉበት’ is not idiomatic Amharic and leaves the Greek idiom unclear in a way that impedes, rather than preserves, its sense.
  naturalness: The overall periodic beatitude structure is natural and appropriately elevated. Recasting the final persecution action as public denunciation produces clear modern standard Amharic while retaining the concrete reference to the disciples’ ‘name.’
  terminology: ‘ብፁዓን,’ ‘ሰዎች,’ and ‘የሰው ልጅ’ appropriately preserve the beatitude register, generic reference, and established Gospel title. ‘ከመካከላቸው በሚያገሏችሁ’ is suitable for social exclusion.
  issues:
  - severity: medium
    issue: The expression ‘ስማችሁን እንደ ክፉ በሚጥሉበት’ is awkward and semantically underdetermined in Amharic.
    rationale: Although it attempts to mirror ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν, ‘መጣል’ with ‘ስም’ does not naturally communicate public repudiation or denunciation. A clear rendering should express condemnation while retaining ‘ስማችሁን’; the footnote can identify the literal Greek imagery and the remaining interpretive range.
