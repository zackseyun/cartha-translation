    text: በቃል በቃል፣ “ስማችሁን እንደ ክፉ በሚያስወግዱበት።” አገላለጹ ስማችሁን ወይም መልካም ስማችሁን ክፉ እንደሆነ አድርገው በአደባባይ መካድ ወይም ማውገዝን ሊያመለክት ይችላል።
