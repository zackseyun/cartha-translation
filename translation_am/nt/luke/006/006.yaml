base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: am
  text: በሌላ ሰንበት እርሱ ወደ ምኵራብ ገብቶ ያስተምር ነበር፤ ቀኝ እጁ የሰለለች[a] አንድ ሰውም በዚያ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የደረቀች»። የግሪኩ ቅጽል የደረቀ ወይም የጠወለገ ነገርን ሊገልጽ ይችላል፤ በዚህ ዐውድ የሰውየውን ጉዳት ያለባትን ቀኝ እጅ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: በ…ም
  rationale: ይህ የሉቃስ የተለመደ የትረካ መሸጋገሪያ ነው። በአማርኛ አረፍተ ነገሩን «ሆነ» ብሎ ቃል በቃል ከመጀመር ይልቅ «በ…ም» የተሰኘው አያያዥ የትረካውን ቀጣይነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: በሌላ ሰንበት
  rationale: ἕτερος ተመሳሳይ ዓይነት የሆነ ሌላ አጋጣሚን ያመለክታል፤ «በሌላ ሰንበት» ግልጽና ተፈጥሯዊ ነው።
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: እርሱ ወደ ምኵራብ ገብቶ
  rationale: ከἐγένετο ቀጥሎ የመጣውን የግሪክ የዘይቤ አገላለጽ በተፈጥሯዊ የአማርኛ ተያያዥ ግስ ተርጉሟል። «እርሱ» የαὐτόνን ዋቢ ግልጽ ያደርጋል።
- source_word: καὶ διδάσκειν
  choice: ሲያስተምር
  rationale: የአሁን ጊዜው የግሪክ የግስ መደብ የቀጠለ ድርጊትን ያሳያል፤ «ሲያስተምር» ይህን በአማርኛ ይጠብቃል።
- source_word: ἄνθρωπος ἐκεῖ
  choice: አንድ ሰው በዚያ ነበር
  rationale: የግሪኩን ሕልውና የሚገልጽ አረፍተ ነገር በግልጽና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: ቀኝ እጁ
  rationale: በግሪኩ በተለይ ቀኝ እጁ እንደሆነ የተሰጠውን ገለጻ በአጭርና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ξηρά
  choice: የሰለለች
  rationale: ξηρός በዚህ ዐውድ የጠወለገችና ሥራዋን ማከናወን ያልቻለች እጅን ይገልጻል። «የሰለለች» በአማርኛ የአካል ጉዳቱን በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ «የደረቀች» የሚለው ቀጥተኛ አማራጭ በማስታወሻ ቀርቧል።
