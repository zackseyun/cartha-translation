  text: ነገር ግን ከፈሪሳውያን አንዳንዶች፣ “በሰንበት[a] ማድረግ የማይፈቀደውን ለምን ታደርጋላችሁ?” አሉ።
  philosophy: optimal-equivalence
  footnotes:
