  rationale: ከቀደመው ትረካ ጋር ያለውን ቀላል ንፅፅርና ወደ ተቃውሞ የሚያመራውን ለውጥ ያሳያል።
- source_word: Φαρισαίων
  choice: ፈሪሳውያን
