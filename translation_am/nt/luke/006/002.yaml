- source_word: εἶπαν
  choice: አሉ
  rationale: አንድ ጊዜ የተፈጸመውን የንግግር ድርጊት በቀጥታና ተፈጥሯዊ የትረካ አገላለጽ ያቀርባል።
- source_word: Τί ποιεῖτε
  choice: ለምን ታደርጋላችሁ?
  rationale: Τί ቃል በቀጥታ ‘ምን’ ቢሆንም፣ ከποιεῖτε ጋር በዚህ የተቃውሞ ጥያቄ ውስጥ ‘ለምን’ የሚል ኃይል አለው፤ የብዙ ሰው አድራጊ ቅርጽም ተጠብቋል።
- source_word: ὃ οὐκ ἔξεστιν
  choice: ማድረግ ያልተፈቀደውን
  rationale: የዘመናዊ አማርኛን ተፈጥሯዊ አገላለጽ ሲጠብቅ፣ በሕግና በሃይማኖታዊ ልማድ የተፈቀደውን ወይም ያልተፈቀደውን የሚመለከተውን ክርክር ያስተላልፋል።
- source_word: τοῖς σάββασιν
  choice: በሰንበታት
  rationale: የግሪኩን ብዙ ቁጥር በግልጽነት ይጠብቃል፤ ይህ አገላለጽ አንዱን የሰንበት ቀን ለማመልከት በተለምዶ ሊውል እንደሚችል በማስታወሻው ተብራርቷል።
