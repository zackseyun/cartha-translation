  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: am
  text: አትፍረዱ፤ እናንተም ፈጽሞ አይፈረድባችሁም። አትኮንኑ፤ እናንተም ፈጽሞ አትኮነኑም። ልቀቁ[a]፤ እናንተም ትለቀቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይቅር በሉ፤ እናንተም ይቅር ይባልላችኋል።» የግሪኩ ግስ «መልቀቅ» ወይም «ነፃ ማውጣት» ማለት ሲችል፣ በዚህ አውድ «ይቅር ማለት» ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: ፍረዱ
  rationale: «መፍረድ» የκρίνωን አጠቃላይ የመገምገምና ፍርድ የመስጠት ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ በአሉታዊ ትእዛዙ «አትፍረዱ» ሆኗል።
- source_word: οὐ μὴ κριθῆτε
  choice: እናንተም ፈጽሞ አይፈረድባችሁም
  rationale: «ፈጽሞ … አይ…ም» የοὐ μήን አጽንዖት ያሳያል፤ «አይፈረድባችሁም» ደግሞ የግሪኩን ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καταδικάζετε
  choice: ኮንኑ
  rationale: «መኮነን» ከአጠቃላዩ «መፍረድ» የበረታ፣ ጥፋተኛ አድርጎ የመፍረድን ሐሳብ ይይዛል፤ በአሉታዊ ትእዛዙ «አትኮንኑ» ሆኗል።
- source_word: οὐ μὴ καταδικασθῆτε
  choice: እናንተም ፈጽሞ አትኮነኑም
  rationale: የተደራጊውን ቅርጽና የοὐ μήን ጠንካራ አሉታዊ አጽንዖት ይጠብቃል፤ ከቀደመው ሐረግም ጋር ትይዩነት አለው።
- source_word: ἀπολύετε
  choice: ልቀቁ
  rationale: «መልቀቅ» የἀπολύωን ሰፊ የመፍታት፣ ነፃ የማውጣት ወይም በዚህ አውድ ይቅር የማለት ክልል ይጠብቃል፤ ትርጉሙን በዋናው ጽሑፍ ወደ «ይቅር በሉ» ብቻ አያጠብም።
- source_word: ἀπολυθήσεσθε
  choice: እናንተም ትለቀቃላችሁ
  rationale: ከ«ልቀቁ» ጋር ያለውን የግስ ድግግሞሽና የተመላላሽ አነጋገር ይጠብቃል፤ እንዲሁም የግሪኩን ተደራጊ ቅርጽ ያስተላልፋል።
- source_word: καὶ
  choice: ፤ / እናንተም
  rationale: ተደጋጋሚው καὶ በአማርኛ የተፈጥሮ አነጋገር መሠረት በሐረግ ክፍፍልና በ«እናንተም» ተገልጧል፤ የትይዩ አወቃቀሩን ግን ጠብቋል።
theological_decisions:
- issue: ἀπολύετε እና ἀπολυθήσεσθε በጠባቡ «ይቅር በሉ/ይቅር ይባልላችኋል» ወይስ በሰፊው «ልቀቁ/ትለቀቃላችሁ» መተርጎም
  choice: በዋናው ጽሑፍ «ልቀቁ፤ እናንተም ትለቀቃላችሁ»
  alternative: «ይቅር በሉ፤ እናንተም ይቅር ይባልላችኋል»
  rationale: ἀπολύω መልቀቅን፣ ነፃ ማውጣትን፣ ከጥያቄ ወይም ከቅጣት መፍታትን፣ በአውዱም ይቅር ማለትን ሊያመለክት ይችላል። «ልቀቁ» ይህን ስፋትና በሁለቱ አንቀጾች ያለውን የግስ ትይዩነት ይጠብቃል፤ በአውዱ ተገቢ የሆነው «ይቅር በሉ» ደግሞ በማስታወሻ ቀርቧል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ ሦስት ትይዩ ትእዛዞችና ውጤቶቻቸው በአጭር አረፍተ ነገሮች ተጠብቀዋል። «መኮነን» ከ«መፍረድ» የበረታውን ፍርድ ለመለየት ተመርጧል፤ «ልቀቁ» ደግሞ ሆን ተብሎ የግሪኩን የትርጉም ስፋት ይዞ ቀርቧል።
