review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the three coordinated imperatives and the emphatic reciprocal negations of οὐ μή. However, the final result clause, «እናንተም ትለቀቃላችሁ», is readily read as active (“you will release”), whereas ἀπολυθήσεσθε is passive (“you will be released”).
  naturalness: «አትፍረዱ» and «አትኮንኑ» are natural modern standard Amharic and retain the escalation from judging to condemning. The revised final clause uses an unambiguously passive, idiomatic construction while retaining the broad ‘release’ sense.
  terminology: «መፍረድ» and «መኮነን» appropriately distinguish κρίνω from καταδικάζω. «ልቀቁ» preserves the lexical breadth of ἀπολύετε; the footnote appropriately supplies “forgive” as a contextual alternative. The footnote’s alternative result clause is adjusted to standard plural agreement.
  issues:
  - severity: medium
    issue: The final clause is not unambiguously passive.
    rationale: ἀπολυθήσεσθε is a future passive. «ትለቀቃላችሁ» can be understood as an active future, weakening the reciprocal passive sense. «ነፃ ትሆናላችሁ» clearly expresses the result but is somewhat narrower than the source; «ትለቀቃላችሁ» is retained only if intended as passive, which is not sufficiently clear in modern usage.
  - severity: low
    issue: Footnote alternative has nonstandard plural agreement.
    rationale: For plural addressees, «ይቅር ይባልላችኋል» is preferable to «ይቅር ይባልላችሁ».
