  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: am
  text: ማቴዎስንና ቶማስን፣ የእልፍዮስ ልጅ የሆነውን ያዕቆብን፣ እንዲሁም ቀናተኛው[a] ተብሎ የሚጠራውን ስምዖንን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀናተኛ የተባለውን።” የግሪኩ ስያሜ የአንድን ሰው ቅንዓት የሚገልጽ መለያ ሊሆን ይችላል፤ በራሱ ግን በኋለኛ ዘመን ከነበረ የፖለቲካ ንቅናቄ ጋር መደበኛ አባልነት እንደነበረው አያረጋግጥም።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ንና / እንዲሁም
  rationale: በስም ዝርዝሩ ውስጥ ያሉትን አባላት በተፈጥሯዊ ዘመናዊ አማርኛ ያያይዛል፤ የግሪኩን ተደጋጋሚ ማስተሳሰሪያ ትርጉም ሳያጠፋ አማርኛውን ከመክበድ ይጠብቃል።
- source_word: Μαθθαῖον
  choice: ማቴዎስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይጠቀማል።
- source_word: Θωμᾶν
  choice: ቶማስን
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደው ቅርጽ ያቀርባል።
- source_word: Ἰάκωβον Ἁλφαίου
  choice: የእልፍዮስን ልጅ ያዕቆብን
  rationale: የἉλφαίου ዝምድና ገላጭ ቅጽ በዚህ የስም አሰያየም ውስጥ በተፈጥሮ የአባትነት ግንኙነትን ያመለክታል፤ በአማርኛም ‘የእልፍዮስ ልጅ’ ግልጽና ተፈጥሯዊ ነው።
- source_word: Σίμωνα
  choice: ስምዖንን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ባህል የተለመደውን የግል ስም ቅርጽ ይጠቀማል።
- source_word: τὸν καλούμενον
  choice: ተብሎ የሚጠራውን
  rationale: የአሁን ጊዜ ተገብሮ አንቀጽን እንደ መለያ ቅጽል በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ζηλωτὴν
  choice: ቀናተኛው
  rationale: ቃሉን የስምዖን መለያ ስያሜ አድርጎ ያቀርባል፤ ስያሜው የግል ቅንዓትን ወይም ከቀናተኞች ንቅናቄ ጋር ያለ ግንኙነትን ሊያመለክት የሚችለውን ጥርጣሬ አይዘጋም።
