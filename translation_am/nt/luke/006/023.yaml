  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: am
  text: በዚያች ቀን ደስ ይበላችሁ፤ በደስታም ዝለሉ።[a] እነሆ፣ በሰማይ ያለው ዋጋችሁ ታላቅ ነውና፤ አባቶቻቸውም ነቢያትን በተመሳሳይ መንገድ ይይዟቸው ነበርና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚያች ቀን ሐሴት አድርጉ፤ ዝለሉም።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “አባቶቻቸው ለነቢያት ተመሳሳይ ነገሮችን ያደርጉ ነበርና።” ፍቺው፣ ቀደምት አባቶቻቸው ነቢያትን በዚሁ መንገድ ይይዟቸው ነበር ማለት ነው።
    reason: lexical_alternative
