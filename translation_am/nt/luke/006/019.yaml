id: LUK.6.19
reference: Luke 6:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: am
  text: ሕዝቡ በሙሉ እርሱን ለመንካት ይሞክር ነበር፤ ምክንያቱም ኃይል ከእርሱ ይወጣ ነበር፣ እናም ሁሉንም ይፈውስ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: ሕዝቡም ሁሉ
  rationale: ነጠላ የስብስብ ስም የሆነውን ὄχλος ከπᾶς ጋር በተፈጥሯዊ አማርኛ ያቀርባል፤ መላው የተሰበሰበው ሕዝብ በድርጊቱ መካፈሉን ያሳያል።
- source_word: ἐζήτουν
  choice: ይሞክሩ ነበር
  rationale: የግሪኩን ያልተጠናቀቀና ቀጣይ ወይም ተደጋጋሚ ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἅπτεσθαι
  choice: ለመንካት
  rationale: በፈውስ አውድ ውስጥ ἅπτομαι ያለውን የአካላዊ ንክኪ ቀጥተኛና ግልጽ በሆነ ቃል ያስተላልፋል።
- source_word: δύναμις
  choice: ኃይል
  rationale: ቃሉ ከኢየሱስ የሚወጣውንና ፈውስን የሚያደርገውን ውጤታማ ኃይል ያመለክታል፤ ‘ተአምራዊ’ የሚል በግሪኩ ያልተገለጸ ቅጽል አልተጨመረም።
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: ከእርሱ ይወጣ ነበር
  rationale: ኃይሉ ከእርሱ እየወጣ መሆኑንና የግሪኩን ቀጣይ አመለካከት በግልጽ አማርኛ ይጠብቃል።
- source_word: ἰᾶτο
  choice: ይፈውስም ነበር
  rationale: የፈውሱን ቀጣይ ድርጊት ይጠብቃል፤ ከ‘ይወጣ ነበር’ ጋርም በአመለካከት ይጣጣማል።
- source_word: πάντας
  choice: ሁሉንም
  rationale: ግሪኩ የሚያጎላውን ሁሉን አቀፍነት በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ከኢየሱስ የሚወጣው የδύναμις ባሕርይ
  choice: ‘ኃይል ከእርሱ ይወጣ ነበር’ ተብሎ ያለ ተጨማሪ ዶግማዊ ማብራሪያ ተተርጉሟል።
  alternative: ‘ተአምራዊ ኃይል ከእርሱ ይወጣ ነበር’
  rationale: ጥቅሱ ኢየሱስን ውጤታማ የፈውስ ኃይል ምንጭ አድርጎ ያቀርባል። ትርጉሙ ይህን ቀጥተኛ አባባል ይጠብቃል፣ ነገር ግን ግሪኩ ያልጨመረውን የሥነ መለኮት መግለጫ አያክልም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ኢምፐርፌክት ግሶች ‘ነበር’ በሚለው ቅርጽ ቀጣይ ድርጊት ሆነው ቀርበዋል። በእንግሊዝኛው ማስታወሻ ውስጥ ‘was going out from him’ የሚለው አማራጭ ዋናውን የግሪክ አገላለጽ እንጂ ἅπτεσθαιን ስለማይመለከት፣ በአማርኛው ‘ከእርሱ ይወጣ ነበር’ በቀጥታ ተይዞ የግርጌ ማስታወሻ አላስፈለገውም።
