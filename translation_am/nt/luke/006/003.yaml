  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “ዳዊት ራብ በተሰማው ጊዜ፣ እርሱና ከእርሱ ጋር የነበሩት ሰዎች ያደረገውን ይህን እንኳ አላነበባችሁምን?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: መልሶ ... አላቸው
  rationale: የግሪክኛውን የመመለስና የመናገር አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: ይህን እንኳ አላነበባችሁምን
  rationale: «እንኳ» የΟὐδὲን አጽንዖት ይጠብቃል፤ የአሉታዊ ጥያቄውም የተግሣጽ ኃይል እንዳለ ይቆያል።
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: ዳዊት ... ያደረገውን
  rationale: አንጻራዊውን ሐረግ በግልጽና በተለመደ የአማርኛ አወቃቀር ያቀርባል።
- source_word: ὁπότε ἐπείνασεν
  choice: በተራቡ ጊዜ
  rationale: ጊዜያዊውን ግንኙነትና የረሃብን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: እርሱና ከእርሱ ጋር የነበሩት
  rationale: ግልጹን ተውላጠ ስምና «ከእርሱ ጋር የነበሩት» የሚለውን ሐረግ ሳይተረጉም በቅርብ ይጠብቃል።
