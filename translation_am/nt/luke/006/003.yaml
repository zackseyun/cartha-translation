review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ reply, the emphatic rhetorical question, David, and those with him. However, በተራቡ is plural ('when they were hungry'), whereas the SBLGNT has the singular ἐπείνασεν, referring grammatically to David. The revision retains the singular without making an unwarranted claim about the companions’ hunger.
  naturalness: The revised wording uses modern, public-facing standard Amharic. Replacing the dash and rearranging the dependent clause makes the question read more smoothly while retaining its pointed tone.
  terminology: ኢየሱስ and ዳዊት are standard biblical Amharic forms. No contested theological terminology occurs. ከእርሱ ጋር የነበሩት faithfully represents 'those who were with him.'
  issues:
  - severity: medium
    issue: The draft renders ἐπείνασεν as በተራቡ.
    rationale: This plural verb says 'when they were hungry,' but the Greek verb is singular. The hunger is grammatically predicated of David; the following phrase mentions David and those with him.
  revised_text: ኢየሱስም መልሶ፣ “ዳዊት ራብ በተሰማው ጊዜ፣ እርሱና ከእርሱ ጋር የነበሩት ሰዎች ያደረገውን ይህን እንኳ አላነበባችሁምን?” አላቸው።
  revised_footnotes: []
  revision_rationale: The temporal clause is corrected to singular, ዳዊት ራብ በተሰማው ጊዜ, corresponding to ὁπότε ἐπείνασεν. The phrase እርሱና ከእርሱ ጋር የነበሩት ሰዎች is retained as an explicit mention of David and those with him. Reordering the sentence permits idiomatic Amharic while maintaining the Greek rhetorical question and its emphasis ('even this').
