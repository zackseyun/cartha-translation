revisions:
- from: እንዲሁም መልሰው እንዲሰጧችሁ ከምትጠብቋቸው ሰዎች ጋር ብታበድሩ፣ ምን ምስጋና[a] አላችሁ? ኃጢአተኞችም እኩል መጠን መልሰው እንዲቀበሉ ለኃጢአተኞች ያበድራሉ።
  to: እንዲሁም ከእነርሱ መልሳችሁ እንደምትቀበሉ ለምትጠብቋቸው ሰዎች ብታበድሩ፣ ምን ውለታ ይቆጠርላችኋል? ኃጢአተኞችም እኩል መጠን መልሰው እንዲቀበሉ ለኃጢአተኞች ያበድራሉ።
  rationale: 'The revision replaces the misleading and unidiomatic ‘lend with’ construction with wording that states the source’s two linked ideas: the loan is made to certain people, and repayment is expected from those same people. It also renders χάρις as “ውለታ ይቆጠርላችኋል,” which better conveys moral credit while retaining “ምስጋና” as a footnoted lexical alternative. No interest, profit, or doctrinal implication is added.'
