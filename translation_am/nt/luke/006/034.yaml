id: LUK.6.34
reference: Luke 6:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: am
  text: እንዲሁም ከእነርሱ መልሳችሁ እንደምትቀበሉ ለምትጠብቋቸው ሰዎች ብታበድሩ፣ ምን ውለታ ይቆጠርላችኋል? ኃጢአተኞችም እኩል መጠን መልሰው እንዲቀበሉ ለኃጢአተኞች ያበድራሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: ብታበድሩ / ያበድራሉ
  rationale: “ማበደር” ገንዘብን ወይም ንብረትን ለጊዜው ሰጥቶ ተመልሶ መቀበልን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: παρ’ ὧν
  choice: ከምትጠብቋቸው ሰዎች ጋር
  rationale: የግሪኩ አገላለጽ ግብይቱ የሚደረግባቸውንና መመለሱ የሚጠበቅባቸውን ሰዎች ያመለክታል፤ “ጋር ማበደር” በአማርኛ የሁለትዮሽ የብድር ግብይትን በግልጽ ያቀርባል።
- source_word: ἐλπίζετε λαβεῖν
  choice: መልሰው እንዲሰጧችሁ ከምትጠብቋቸው
  rationale: ἐλπίζω እዚህ ተስፋ ማድረግን ብቻ ሳይሆን ተመላሽ ክፍያን መጠበቅን ያመለክታል፤ ተቀባዩንና ተመላሹን በአማርኛ ግልጽ ለማድረግ በዚህ መልክ ተተርጉሟል።
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: ምን ምስጋና አላችሁ?
  rationale: χάρις በዚህ ዐውድ የሚገባ ውለታ፣ ምስጋና ወይም መልካም አመለካከት ሊያመለክት ይችላል። “ምስጋና” የግሪኩን ቃላዊ ስፋት በአማርኛ በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: ἁμαρτωλοὶ
  choice: ኃጢአተኞች
  rationale: ቃሉ እንደ ስም የተጠቀመ ቅጽል ሲሆን “ኃጢአተኞች” ቀጥተኛና የተለመደ አቻ ነው።
- source_word: ἵνα ἀπολάβωσιν
  choice: መልሰው እንዲቀበሉ
  rationale: ἀπολαμβάνω እዚህ የተሰጠውን ተመልሶ መቀበል ማለት ነው፤ ትርጉሙ የመመለስን ሐሳብ በግልጽ ይጠብቃል።
- source_word: τὰ ἴσα
  choice: እኩል መጠን
  rationale: ሐረጉ በመጠን ወይም በዓይነት አቻ የሆነ ተመላሽን ያመለክታል፤ “እኩል መጠን” ወለድን ወይም ትርፍን ሳያስገባ ትክክለኛውን የልውውጥ ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: በኢየሱስ የንግግር ጥያቄ ውስጥ የχάρις ትርጉም
  choice: “ምስጋና” ተብሎ ተተርጉሟል፤ ይህም የሚገባ እውቅናን ወይም መልካም አመለካከትን ሊያካትት ይችላል።
  alternative: “ውለታ፣” “ተቀባይነት፣” ወይም “ጸጋ”
  rationale: በቅርብ ዐውዱ ጥያቄው የደቀ መዛሙርቱ ተግባር ከኃጢአተኞች ተግባር በምን እንደሚለይ ይመረምራል፤ ስለ ድነት ጸጋ የሚገልጽ ቴክኒካዊ መግለጫ አይደለም።
- issue: በብድሩ የሚጠበቀው ተመላሽ ባሕርይ
  choice: “እኩል መጠን መልሰው እንዲቀበሉ” ተብሎ በገለልተኛ መንገድ ተተርጉሟል።
  alternative: ከወለድ ወይም ከትርፍ ጋር ሙሉ ክፍያ መቀበል
  rationale: τὰ ἴσα አቻ የሆነ ተመላሽን እንጂ ወለድን ወይም ትርፍን አይገልጽም፤ ትርጉሙ ከጽሑፉ በላይ የኢኮኖሚ ወይም የሥነ ምግባር ግምት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ጋር ማበደር” በዘመናዊ የአማርኛ አጠቃቀም የእርስ በርስ ብድርን በተፈጥሯዊ መልኩ ያሳያል። የχάρις አሻሚነት በዋናው ጽሑፍና በእግር ማስታወሻው ተጠብቋል።
