    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱ ግን
  rationale: οἱ በዐውዱ ውስጥ ቀደም ሲል የተጠቀሱትን ሰዎች ያመለክታል፤ δέ ደግሞ ከጲላጦስ ንግግር ጋር ያለውን ተቃርኖ በተፈጥሯዊው «ግን» ያሳያል።
- source_word: ἐπεφώνουν
  choice: ይጮኹ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ ቀጣይነት ያለውን ወይም ተደጋጋሚ ጩኸት ያሳያል፤ «ይጮኹ ነበር» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: ተሳቢው ግስ ከጩኸቱ ጋር በአንድ ጊዜ የተነገረውን ይዘት ያስገባል፤ «እያሉ» በአማርኛ ተፈጥሯዊ ነው።
- source_word: Σταύρου σταύρου
  choice: ስቀለው! ስቀለው!
  rationale: የተደገመው ትእዛዝ የሕዝቡን ግፊትና ጽኑ ጥያቄ ይጠብቃል። በአማርኛ የነገሩን አካል በእያንዳንዱ ትእዛዝ ውስጥ ማካተት ግልጽና ተፈጥሯዊ ነው።
- source_word: αὐτόν
  choice: -ው (በ«ስቀለው» ውስጥ)
  rationale: የሦስተኛ መደብ ወንድ ነጠላ ተሳቢ ተውላጠ ስም በአማርኛው ግስ ላይ በተጨመረው «-ው» በትክክል ተወክሏል።
theological_decisions:
- issue: σταύρου የሚለውን የግድያ ጥያቄ መተርጎም
  choice: ስቀለው
  alternative: በመስቀል ላይ ግደለው
  rationale: σταυρόω በተለይ በመስቀል ላይ መግደልን ያመለክታል። «ስቀለው» አጭር፣ ቀጥተኛና በመጽሐፍ ቅዱሳዊ ዐውድ ውስጥ የሚገባ ሲሆን፣ የበለጠ ግልጽ አማራጩ በማስታወሻ ተሰጥቷል።
