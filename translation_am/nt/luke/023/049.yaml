  to: ነገር ግን እርሱን የሚያውቁት ሁሉ[a]፣ እንዲሁም ከገሊላ ጀምሮ ከእርሱ ጋር የተከተሉት ሴቶች፣ በሩቅ ቆመው ነበር፤ እነዚህ ሴቶችም እነዚህን ነገሮች ይመለከቱ ነበር።
