  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: am
  text: ይህም የዝግጅት ቀን ነበር፤ ሰንበትም እየጀመረ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በቃል በቃል፣ «ሰንበትም እየነጋ ነበር።» የግሪኩ ግስ «እየነጋ ነበር» ወይም «እየጀመረ ነበር» ማለት ይችላል፤ እዚህ ግን በምሽት የሚጀምረውን ሰንበት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: የዝግጅት ቀን
  rationale: በአይሁድ አጠቃቀም ይህ ቃል ከሰንበት በፊት ያለውን የዝግጅት ቀን ያመለክታል። «ዓርብ» ብሎ መተርጎም በአውዱ የሚቻል ቢሆንም፣ የግሪኩን ቃል ቀጥተኛ ሐሳብ ስለሚያጠፋ «የዝግጅት ቀን» ተመርጧል።
- source_word: σάββατον
  choice: ሰንበት
  rationale: በሕማማትና በቀብር ትረካው አውድ የሚያመለክተው ሳምንታዊውን ሰንበት ነው።
- source_word: ἐπέφωσκεν
  choice: እየጀመረ ነበር
  rationale: ግሱ በቀጥታ «እየነጋ ነበር» ሊል ቢችልም፣ እዚህ ሰንበት በምሽት መጀመሩን ያመለክታል። «እየጀመረ ነበር» በአማርኛ የጊዜውን ሐሳብ በግልጽ ያስተላልፋል፤ የግሱ ቀጥተኛ ምስላዊ አገላለጽ በማስታወሻ ተጠብቋል።
- source_word: καὶ
  choice: ይህም … ሰንበትም
  rationale: የሉቃስን ትረካዊ ቅንጅት ለማስጠበቅ ሁለቱም አያያዦች በአማርኛው «-ም» ተንጸባርቀዋል።
theological_decisions:
- issue: ἐπέφωσκεν ከሰንበት መጀመሪያ ጋር ያለው የጊዜ ትርጉም
  choice: ጥቅሱ በምሽት የሚጀምረውን ሰንበት ያመለክታል።
  alternative: «ሰንበትም እየነጋ ነበር»
  rationale: በአይሁድ የቀን አቆጣጠር ሰንበት ከምሽት ይጀምራል፤ የቀብሩ አውድም ይህንኑ ይጠይቃል። ሆኖም የግሪኩ ግስ ያለው የ«መንጋት» ምስል እንዳይጠፋ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የዝግጅት ቀን» የምንጩን የቀን መጠሪያ ይጠብቃል፤ «እየጀመረ ነበር» ደግሞ አንባቢው ክስተቱ በማለዳ እንደሆነ እንዳይሳሳት ያደርጋል።
