  verdict: revise
  source_fidelity: The draft accurately renders the wrapping, placement, rock-cut tomb, and its prior non-use. However, «ከመስቀሉ» specifies the place from which he was taken down, which is supplied by the wider context rather than stated in this verse. The final relative clause is also better rendered directly as a tomb in which no one had yet been buried/laid.
  naturalness: '«ማንም ገና ተቀብሮበት በማያውቅ» and the corresponding footnote are not idiomatic: they use «ማወቅ» where a direct relative clause is needed. The revision uses clear, modern standard Amharic.'
  terminology: «በበፍታ ጨርቅ» and «መቃብር» are appropriate. «ከዓለት ተፈልፍሎ በተሠራ» naturally conveys λαξευτός without implying more than a rock-cut/hewn tomb.
