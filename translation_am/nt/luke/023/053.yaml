    issue: «ከመስቀሉ» is added to the verse text.
    rationale: Although the immediate narrative context identifies the cross, καθελὼν in this verse itself only says that he took him down. Removing the supplied location keeps the translation closer to the source.
  - severity: medium
    issue: The prior-use clause and footnote b employ an unnatural «...በማያውቅ» construction.
    rationale: The Greek says that no one had yet been laid there. A direct relative clause, «ማንም ገና ያልተቀበረበት», expresses this naturally and accurately.
