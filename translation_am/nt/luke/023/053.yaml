base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: am
  text: አውርዶ በበፍታ ጨርቅ ጠቀለለው፤ ማንም ገና ያልተቀበረበት ከዓለት ተፈልፍሎ በተሠራ መቃብር[a] ውስጥ አኖረው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በተጠረበ መቃብር» ወይም «ከዓለት ተፈልፍሎ በተሠራ መቃብር»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ማንም እስከዚያ ጊዜ ተኝቶበት ያልነበረበት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: ከመስቀሉም ካወረደው በኋላ
  rationale: ቃሉ ከፍ ካለበት ቦታ ማውረድን ያመለክታል፤ በዚህ ዐውድ የኢየሱስን ሥጋ ከመስቀሉ ማውረዱ ግልጽ ነው። የግስ አጋዥ ቅርጹን የድርጊት ቅደም ተከተል በሚያሳይ ተፈጥሯዊ አማርኛ ተርጉሟል።
- source_word: ἐνετύλιξεν
  choice: ጠቀለለው
  rationale: ἐντυλίσσω በጨርቅ መጠቅለልን ያመለክታል፤ ምንጩ ያልገለጸውን ተጨማሪ የቀብር ሥርዓት ሳይጨምር ትርጉሙን ያስተላልፋል።
- source_word: σινδόνι
  choice: በበፍታ ጨርቅ
  rationale: σινδών የበፍታ ጨርቅን፣ በዚህ ዐውድም ለቀብር የዋለ ጨርቅን ያመለክታል። የመሣሪያ ዳቲቭ በ«በ» ተገልጿል።
- source_word: ἔθηκεν
  choice: አኖረው
  rationale: τίθημι እዚህ ሥጋውን በመቃብሩ ውስጥ ማኖርን ያመለክታል፤ «አኖረው» ግልጽና ተፈጥሯዊ ነው።
- source_word: μνήματι
  choice: መቃብር ውስጥ
  rationale: μνῆμα የሙታን መቀበሪያ ቦታን ያመለክታል፤ «መቃብር» በዘመናዊ አማርኛ የተለመደና ለዐውዱ ተስማሚ ነው።
- source_word: λαξευτῷ
  choice: ከድንጋይ በተፈለፈለ
  rationale: λαξευτός በመሣሪያ የተጠረበ ወይም ከድንጋይ የተፈለፈለ ማለት ነው፤ ይህ ምርጫ የመቃብሩን ዓይነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὗ
  choice: ተቀብሮበት
  rationale: ዘመድ ቦታ-ተውሳኩ ወደ መቃብሩ ይመለሳል፤ በአማርኛ በግሱ ውስጥ ያለው «-በት» ይህን የቦታ ግንኙነት በተፈጥሮ ያሳያል።
- source_word: οὐδεὶς οὔπω κείμενος
  choice: ማንም ገና ተቀብሮበት በማያውቅ
  rationale: የግሪኩ አገላለጽ ማንም ሰው እስከዚያ ጊዜ በዚያ ተኝቶ ወይም ተቀምጦ እንዳልነበረ ይገልጻል። በቀብር ዐውድ «ተቀብሮበት በማያውቅ» መቃብሩ ከዚህ በፊት ጥቅም ላይ አለመዋሉን በግልጽ ያስተላልፋል።
theological_decisions:
- issue: የቀብሩ መግለጫና የመቃብሩ ዓይነት
  choice: ኢየሱስ ከድንጋይ በተፈለፈለና ከዚህ በፊት ማንም ባልተቀበረበት መቃብር ውስጥ ተቀመጠ።
  alternative: ኢየሱስ ማንም ከቶ ተኝቶበት በማያውቅ በተጠረበ መቃብር ውስጥ ተቀመጠ።
  rationale: ጥቅሱ ታሪካዊ የቀብር ዝርዝርን ይገልጻል። ትርጉሙ ከትይዩ ወንጌላት የተወሰደ ማስማማትን ወይም ተጨማሪ ሥነ መለኮታዊ ይዘትን ሳያስገባ ይህን ዝርዝር ጠብቋል።
