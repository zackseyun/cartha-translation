    text: ወይም፣ “መልሶ ተናገራቸው።”
    reason: lexical_alternative
  revision_rationale: The revision retains every expressed element of the Greek while rendering προσεφώνησεν with the neutral, natural Amharic verb አነጋገራቸው. It removes the unexpressed claim that Pilate raised his voice and supplies a meaningful lexical alternative in the footnote.
