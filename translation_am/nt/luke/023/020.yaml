lexical_decisions:
- source_word: πάλιν
  choice: እንደገና
  rationale: የድርጊቱን መደገም በተፈጥሯዊና በአጭር አማርኛ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከሕዝቡ ምላሽ ጋር ያለውን መጠነኛ ተቃርኖና የትረካውን እድገት ያሳያል።
- source_word: ὁ Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን አጻጻፍ ይከተላል።
- source_word: προσεφώνησεν
  choice: ጮክ ብሎ ተናገራቸው
  rationale: ግሱ ሰዎችን ማነጋገር ወይም ድምፅን ከፍ አድርጎ መጥራት ሊያመለክት ስለሚችል፣ በዚህ ሕዝባዊ የፍርድ ትዕይንት ያለውን የድምፅ ስሜት ያስተላልፋል።
- source_word: θέλων
  choice: ሊፈታው ፈልጎ
  rationale: ከዋናው ግስ ጋር በአንድ ጊዜ የነበረውን የጲላጦስን ፍላጎት በተፈጥሯዊ የአማርኛ የግስ ተውሳክ አወቃቀር ያሳያል።
- source_word: ἀπολῦσαι
  choice: ሊፈታው
  rationale: በሕጋዊና በእስር አውድ ውስጥ አንድን ሰው ነፃ መልቀቅን በተለመደ አማርኛ ይገልጻል።
- source_word: τὸν Ἰησοῦν
  choice: ኢየሱስን
  rationale: የተለመደውን የአማርኛ የስም አጻጻፍና የቀጥታ ተሳቢ ምልክት -ን ይጠቀማል።
