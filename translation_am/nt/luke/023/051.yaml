  rationale: ያልተቋረጠንና በተስፋ የተሞላን መጠበቅ የሚያሳየውን የኢምፐርፌክት ግስ ገጽታ ይገልጣል።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: በሉቃስ ወንጌል ውስጥ ያለውን የቃሉን ቀጣይነትና ሥነ መለኮታዊ ክብደት የሚጠብቅ ግልጽና የተለመደ አተረጓጎም ነው።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: ቃሉ በቀደመው ቁጥር የተጠቀሰውን ዮሴፍን በአጽንዖት ያመለክታል፤ ተራ ተውላጠ ስም ብቻ ከመጠቀም ይልቅ ይህን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: ዮሴፍ ኢየሱስን ለመግደል ከተደረገው የሸንጎው እቅድና ድርጊት የተለየበት መንገድ
  choice: በእቅዳቸውና በድርጊታቸው ተስማምቶ እንዳልነበረ መተርጎም
