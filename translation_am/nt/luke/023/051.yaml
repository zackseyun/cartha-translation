  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የእቅድና የተፈጸመ ድርጊት ልዩነት ተጠብቋል፤ የግሥ ገጽታውም “ተስማምቶ አልነበረም” እና “ይጠባበቅ ነበር” በሚሉ አገላለጾች ተንጸባርቋል።
