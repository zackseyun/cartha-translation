  text: ይህ ሰው በእቅዳቸውና በድርጊታቸው ተስማምቶ አልነበረም[a]። እርሱም ከአርማትያ፣ ከአይሁድ ከተማ፣ የመጣ ነበር፤ የእግዚአብሔርንም መንግሥት ይጠባበቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
