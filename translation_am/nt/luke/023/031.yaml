  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: am
  text: ምክንያቱም፣ ለምለም እንጨት ሳለ እነዚህን ነገሮች የሚያደርጉ ከሆነ፣ ደረቅ ሲሆን ምን ይሆን?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በለምለም እንጨት ... በደረቅ እንጨት።» የግሪኩ አነጋገር ምስሉን ይበልጥ ቃል በቃል ያቀርባል፤ ዋናው ትርጉም ግን የለምለምና የደረቅ እንጨትን ንጽጽር በተፈጥሯዊ አማርኛ ያቀርባል።
    reason: lexical_alternative
  - marker: b
    text: ምስሉ ከትንሹ ወደ ትልቁ የሚሄድ ንጽጽር እንደሆነ ይታያል፤ በለምለም እንጨት ላይ እንዲህ ከተደረገ፣ በደረቅ እንጨት ላይ ምን ይሆን? የምስሉ ዝርዝር ወካዮች ግን በጽሑፉ አልተገለጹም።
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ ውስጥ ይህ ቃል ቀደም ሲል ለተነገረው ማስጠንቀቂያ ምክንያት ያቀርባል፤ «ምክንያቱም» ይህን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: እርጥብ እንጨት ሳለ
  rationale: የግሪኩን የእንጨት ምስል ይጠብቃል፤ ὑγρός በቀጥታ «እርጥብ/እርጥበት ያለው» ማለት ስለሆነ «እርጥብ» ተመርጧል። «ሳለ» ደግሞ ἐν ያለውን ሁኔታዊ አገባብ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ξύλῳ
  choice: እንጨት
  rationale: ξύλον እንጨትን፣ ግንድን ወይም ዛፍን ሊያመለክት ቢችልም፣ ከξηρός ጋር ያለው ንጽጽር ለማገዶ የሚታሰብ እንጨትን በግልጽ ያሳያል።
- source_word: ταῦτα ποιοῦσιν
  choice: ይህን የሚያደርጉ
  rationale: ταῦτα በግሪክ ብዙ ቁጥር ቢሆንም «ይህን ሁሉ» የሚል ጭማሪ ሳይደረግ «ይህን» በአማርኛ የተጠቀሰውን ድርጊት በተፈጥሯዊ ሁኔታ ይሸፍናል። የግሪኩ ሦስተኛ መደብ ብዙ ቁጥር ባለቤቱን ሳይገልጽ ስለሚተው፣ በአማርኛም በግስ ቅርጽ ክፍት ሆኖ ቀርቷል።
- source_word: ἐν τῷ ξηρῷ
  choice: ደረቅ በሚሆንበት ጊዜ
  rationale: «ደረቅ» ከ«እርጥብ» ጋር ያለውን ዋና ንጽጽር ይጠብቃል፤ እንጨቱን እንደገና ሳይደግም የግሪኩን አጭር አነጋገር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τί γένηται
  choice: ምን ይሆን?
  rationale: የአውሪስት ሳብጃንክቲቭ ጥያቄው የሚጠበቀውን ውጤት በንግግራዊ ኃይል ያቀርባል፤ «ምን ይሆን?» ይህን በአጭርና በዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
