  choice: ዘይቤውን በዋናው ጽሑፍ ውስጥ ሳይተረጉሙ ማቆየት
  alternative: «እርጥቡ» ኢየሱስን፣ «ደረቁ» ኢየሩሳሌምን ወይም ሕዝቧን ይወክላሉ ብሎ በግልጽ መተርጎም፤ ወይም ከትንሹ ወደ ትልቁ ፍርድ የሚሄድ አጠቃላይ ምሳሌ አድርጎ መግለጽ
  rationale: ንግግሩ ወደሚመጣ ከባድ ፍርድ ሊያመለክት ቢችልም፣ የ«እርጥቡ»ና የ«ደረቁ» ትክክለኛ ወካዮች በጽሑፉ አልተገለጹም። ስለዚህ የሥነ መለኮት ውጥረቱና እውነተኛው አሻሚነት ተጠብቀዋል።
