base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: am
  text: ኢየሱስ ግን፣ “አባት ሆይ፣ የሚያደርጉትን አያውቁምና ይቅር በላቸው” ይል ነበር።[a] ልብሶቹንም ሲካፈሉ ዕጣ ጣሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “አባት ሆይ፣ የሚያደርጉትን አያውቁምና ይቅር በላቸው” የሚለውን አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: የግሪኩን ያልተፈጸመ ጊዜ (imperfect) ቀጣይነት ወይም ድግግሞሽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Πάτερ
  choice: አባት ሆይ
  rationale: ያልተጨመረ የባለቤትነት ትርጉም ሳያስገባ የቀጥታ ጥሪውን ይጠብቃል።
- source_word: ἄφες
  choice: ይቅር በላቸው
  rationale: በዚህ ወደ እግዚአብሔር በቀረበ ጸሎት ውስጥ ἀφίημι በተፈጥሯዊ አማርኛ የኃጢአትን ይቅርታ ያመለክታል።
- source_word: αὐτοῖς
  choice: ላቸው
  rationale: ግሪኩ የሚያመለክተውን ቡድን በዚህ ሐረግ በግልጽ አይወስንም፤ ይህ ተውላጠ ስም ያንኑ አሻሚነት ይጠብቃል።
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: የሚያደርጉትን አያውቁምና
  rationale: οἶδαን ‘ማወቅ’ ብሎ በቀጥታ ይተረጉማል፤ ‘አይረዱም’ የሚለውን ትርጓሜያዊ ማስፋት አያስገባም።
- source_word: διαμεριζόμενοι
  choice: ተከፋፍለው
  rationale: የኢየሱስን ልብሶች በመካከላቸው የመከፋፈላቸውን ድርጊት በግልጽና ተፈጥሯዊ መንገድ ያሳያል።
- source_word: ἱμάτια
  choice: ልብሶቹን
  rationale: የሚለበሱ ነገሮችን በዘመናዊና ክብር ባለው አማርኛ ያመለክታል፤ ቅጥያውም αὐτοῦን ይወክላል።
- source_word: ἔβαλον κλήρους
  choice: ዕጣ ተጣጣሉባቸው
  rationale: የጥንቱን በዕጣ የመወሰን ልማድ በአማርኛ በተለመደ አገላለጽ ያቀርባል፤ ‘ባቸው’ ዕጣው ልብሶቹን ለመከፋፈል መሆኑን ያገናኛል።
- source_word: δὲ
  choice: ግን / ም
  rationale: የመጀመሪያው δέ የለዘበ ንፅፅርን ወይም ሽግግርን ‘ግን’ ብሎ ያሳያል፤ ሁለተኛው የትረካውን ቀጣይነት በ‘ም’ ያገናኛል።
