  text: ጲላጦስም የጠየቁት እንዲፈጸም ፈረደ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በበለጠ መደበኛ አገላለጽ፦ “ጲላጦስ ጥያቄያቸው እንዲፈጸም ፍርድ ሰጠ።”
    reason: የἐπέκρινενን መደበኛ የፍርድ ትርጉምና የαἴτημαን ቀጥተኛ ስም አገላለጽ የሚያሳይ የቃላት አማራጭ።
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው አያያዥ ቅጥያ ንግግሩን ከቀደመው ትዕይንት ጋር በተፈጥሮ ያያይዛል፤ በግሪኩ ያልተገለጸ የጊዜ ወይም የውጤት ሐሳብ አይጨምርም።
- source_word: Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የስሙን አጻጻፍ ይከተላል።
- source_word: ἐπέκρινεν
  choice: ፈረደ
  rationale: ግሱ የፍርድ ሥልጣን ያለውን ውሳኔ ያመለክታል። ‘ፈረደ’ ሕጋዊውን ገጽታ በአጭርና በተፈጥሮአዊ አማርኛ ያስተላልፋል፤ በቀጥታ የቅጣት ፍርድን ብቻ አይገድብም።
- source_word: γενέσθαι
  choice: እንዲፈጸም
  rationale: ከፍርዱ ጋር ተያይዞ የተጠየቀው ነገር በተግባር እንዲውል መወሰኑን ይገልጣል።
- source_word: τὸ αἴτημα αὐτῶν
  choice: የጠየቁት
  rationale: ‘ጥያቄያቸው/ጥያቄአቸው’ ከሚለው ክብደት ይልቅ ተፈጥሯዊ የዘመናዊ አማርኛ አገላለጽ ሲሆን፣ የጠያቂዎቹን ባለቤትነትና የαἴτημαን ይዘት ይጠብቃል። በአውዱ ጽኑ ግፊት ቢኖርም፣ ቃሉ በራሱ ‘ጥያቄ/ጥያቄ የቀረበበት ነገር’ ሊል ስለሚችል ‘ጥያቄ’ን ወደ ‘ግዴታዊ ጥያቄ’ አልጠበበም።
