  rationale: ‘ፈረደ’ የἐπέκρινενን መደበኛ የፍርድ ውሳኔ ገጽታ ይጠብቃል፤ ‘ወሰነ’ ይበልጥ አጠቃላይ ሆኖ የሕጋዊ ፍርዱን ጥላ ሊያሳንስ ይችላል። ትርጉሙ ከጽሑፉ በላይ የሆነ የታሪክ ወይም የእምነት አቋም አያክልም።
