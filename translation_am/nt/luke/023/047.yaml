base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: am
  text: የመቶ አለቃውም የሆነውን ነገር ባየ ጊዜ እግዚአብሔርን አከበረ፤ እንዲህ እያለ፦ “በእርግጥ ይህ ሰው ጻድቅ ነበር[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “በደል የሌለበት” ወይም “ፍትሐዊ።” የግሪኩ ቃል እንደ አውዱ ሥነ ምግባራዊ ጽድቅን ወይም በሕግ ፊት በደል የሌለበት መሆንን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: ባየ ጊዜ
  rationale: የግሪኩን የቀደመ ተሳቢ ግስ ከዋናው ግስ ጋር ያለውን ጊዜያዊ ዝምድና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ትስስሩን ያሳያል፤ በግሪኩ የሌለውን ‘አሁን’ አያክልም።
- source_word: ἑκατοντάρχης
  choice: የመቶ አለቃ
  rationale: የሮምን ወታደራዊ ማዕረግ በተለመደና ግልጽ የአማርኛ አገላለጽ ይወክላል።
- source_word: τὸ γενόμενον
  choice: የሆነውን ነገር
  rationale: አለቃው ያየውን የተፈጸመ ክስተት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἐδόξαζεν
  choice: አከበረ
  rationale: δοξάζω የሚያስተላልፈውን ክብር መስጠት ይጠብቃል፤ በዚህ የትረካ አውድ ያለውን ያልተፈጸመ ገጽታ በአማርኛ በግድ ማስፋት አያስፈልግም።
- source_word: λέγων
  choice: … አለ
  rationale: የንግግሩን ይዘት በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር ያቀርባል።
- source_word: Ὄντως
  choice: በእርግጥ
  rationale: ጠንካራ ማረጋገጫውን በዘመናዊና ክቡር አማርኛ ይገልጻል።
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ይህ ሰው
  rationale: ሐረጉን በቀጥታና በተፈጥሯዊ መንገድ ይተረጉማል።
- source_word: δίκαιος
  choice: ጻድቅ
  rationale: የቃሉን ሥነ ምግባራዊና መለኮታዊ ክብደት ይጠብቃል፤ ‘ንጹሕ’ ወይም ‘ፍትሐዊ’ የሚሉት በዚህ የፍርድ አውድ ሊሆኑ የሚችሉ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ἦν
  choice: ነበር
  rationale: ያለፈ ጊዜ ያለውን የεἰμί ቅርጽ በቀጥታ ይወክላል።
theological_decisions:
- issue: በመቶ አለቃው ንግግር ውስጥ δίκαιος የሚለው ቃል
  choice: ጻድቅ
  alternative: ንጹሕ፣ ፍትሐዊ
  rationale: ‘ጻድቅ’ የግሪኩን ሥነ ምግባራዊና መለኮታዊ ክብደት ሳያሳንስ ያቆያል። ሆኖም በሉቃስ የፍርድና ያለ በደል መሞት አውድ ‘ንጹሕ’ የሚለውም ትርጉም የሚቻል ስለሆነ ውጥረቱ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የትረካው ትስስር በ“-ም” ተገልጿል፤ በምንጩ የሌለ “አሁን” አልተጨመረም።
