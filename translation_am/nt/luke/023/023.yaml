  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: am
  text: እነርሱ ግን እንዲሰቀል በታላቅ ድምፅ[a] እየጠየቁ አጥብቀው ይወተውቱ ነበር፤ ድምፃቸውም የበላይ ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በታላቅ ጩኸት።” የግሪኩ ቃል በዚህ አውድ “ድምፅ” ወይም “ጩኸት” ሊተረጎም ይችላል፤ ይኸው ቃል በቁጥሩ በሁለቱም ሐረጎች ተደግሟል።
