  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: am
  text: ወታደሮቹም ወደ እርሱ ቀርበው የኮመጠጠ ወይን[a] እያቀረቡለት ተሳለቁበት።
  philosophy: optimal-equivalence
  footnotes:
