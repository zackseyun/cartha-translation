    text: ወይም፣ «ኮምጣጤ»። የግሪኩ ቃል ὄξος የኮመጠጠ ወይንን፣ በዚያ ዘመን የተለመደ ርካሽ መጠጥን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ተሳለቁበት
  rationale: ግሱ በጥላቻና በንቀት የተሞላ ማፌዝን ያመለክታል፤ «ተሳለቁበት» ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ … καὶ
  choice: ወታደሮቹም
  rationale: δέ የትረካውን ቀጣይነት፣ καί ደግሞ ወታደሮቹም በማላገጡ እንደተሳተፉ ያሳያል፤ የአማርኛው «-ም» ሁለቱንም ተግባራዊ ውጤት በአጭሩ ይገልጣል።
- source_word: οἱ στρατιῶται
  choice: ወታደሮቹ
  rationale: በሮማውያን የግድያ አውድ ውስጥ στρατιῶται የታጠቁ ወታደሮችን ያመለክታል፤ «ወታደሮቹ» ግልጽና መደበኛ አቻ ነው።
- source_word: προσερχόμενοι
  choice: ወደ እርሱ ቀርበው
  rationale: ተሳቢው ወታደሮቹ ወደ ኢየሱስ መቅረባቸውን ይገልጣል፤ ይህ አተረጓጎም የእንቅስቃሴውንና የተግባሮቹን ተያያዥነት ይጠብቃል።
- source_word: ὄξος
  choice: የኮመጠጠ ወይን ጠጅ
  rationale: ὄξος እንደ መጠጥ ይወሰድ የነበረ የኮመጠጠ ወይን ጠጅ ነው፤ «ኮምጣጤ» ብቻ በዘመናዊ አማርኛ ለምግብ የሚውል ፈሳሽ እንዳይመስል ዋናው ጽሑፍ ግልጽ አቻውን ይጠቀማል።
- source_word: προσφέροντες αὐτῷ
  choice: እያቀረቡለት
  rationale: ተሳቢው መጠጡን ለእርሱ የማቅረብን ቀጣይ ተግባር ያሳያል፤ «እያቀረቡለት» የተሳቢውን አወቃቀርና ተቀባዩን ይጠብቃል።
theological_decisions:
- issue: ወታደሮቹ ὄξοςን ያቀረቡበት ዓላማ
