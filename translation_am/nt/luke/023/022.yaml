    text: ወይም፣ “ይህ ሰው ምን ክፉ ነገር አድርጎ ነው?” የግሪኩ መክፈቻ ቃል ሙሉውን ጥያቄ የሚያስተዋውቅ አጭር የተቃውሞ ጥያቄ ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለሞት የሚያበቃ ምንም ጥፋት” ወይም “ለሞት ፍርድ የሚሆን ምንም መሠረት።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ከገሠጽኩት በኋላ” ወይም፣ ይበልጥ በተወሰነ መልኩ፣ “ከገረፍኩት በኋላ።” የግሪኩ παιδεύσας የቅጣት እርምጃን ያመለክታል፤ ቃሉ ብቻውን ግን የቅጣቱን ትክክለኛ ዓይነት አይወስንም።
