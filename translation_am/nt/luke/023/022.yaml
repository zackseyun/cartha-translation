  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: am
  text: እርሱም ለሦስተኛ ጊዜ፣ “ለምን?[a] ይህ ሰው ምን ክፉ ነገር አደረገ? በእርሱ ላይ ለሞት የሚያስፈርድ ምንም ምክንያት[b] አላገኘሁም። ስለዚህ ከቀጣሁት በኋላ[c] እለቀዋለሁ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
