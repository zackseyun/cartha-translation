  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: am
  text: ጲላጦስም ይህን ሰምቶ፣ ሰውየው ገሊላዊ መሆኑን ጠየቀ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም አጻጻፍ ይከተላል።
- source_word: δὲ
  choice: -ም
  rationale: በትረካው ውስጥ ያለውን ለስላሳ ሽግግር ወይም ንጽጽር በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: ἀκούσας
  choice: ይህን ሰምቶ
  rationale: የግሪኩን የቀደመ ድርጊት በተፈጥሯዊ አማርኛ ይገልጻል፤ «ይህን» የሚለው ከቀደመው የንግግር አውድ የተገኘ ግልጽ ማመልከቻ ነው።
- source_word: ἐπηρώτησεν
  choice: ጠየቀ
  rationale: የግሪኩን መጠየቅ ወይም ማጣራት ቀጥተኛና ዘመናዊ በሆነ አማርኛ ያቀርባል።
- source_word: εἰ
  choice: መሆኑን
  rationale: በአማርኛ ተዘዋዋሪ ጥያቄን በተፈጥሯዊ ሁኔታ የሚገልጽ የስነ አገባብ አወቃቀር ነው።
- source_word: ὁ ἄνθρωπος
  choice: ሰውየው
  rationale: «ያ ሰው» ወይም «ይህ ሰው» የሚል ተጨማሪ አመልካች ሳያስገባ፣ በአውዱ የታወቀውን ሰው በተፈጥሯዊ አማርኛ ይጠቅሳል።
- source_word: Γαλιλαῖός
  choice: ገሊላዊ
  rationale: የክልል ማንነቱን በቀጥታ የሚገልጽ የተለመደ አማርኛ ቅጽ ነው።
- source_word: ἐστιν
  choice: መሆኑን
  rationale: የግሪኩን የአሁን ጊዜ የመሆን ግስ በአማርኛ ተዘዋዋሪ ጥያቄ ውስጥ ጊዜውን ሳያጣምም በተፈጥሯዊ ሁኔታ ያቀርባል።
