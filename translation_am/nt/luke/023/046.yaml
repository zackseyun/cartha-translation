    issue: Unnatural rendering of ἐξέπνευσεν
    rationale: ‘...ተነፈሰ’ means ‘breathed’ rather than specifically ‘breathed out’ and is awkward with ‘last breath.’ ‘...እስትንፋስ አወጣ’ naturally conveys the literal imagery and idiomatic sense of dying.
