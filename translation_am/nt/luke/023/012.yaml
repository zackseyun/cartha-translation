  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: am
  text: በዚያኑም ዕለት ሄሮድስና ጲላጦስ እርስ በርሳቸው ወዳጆች[a] ሆኑ፤ ከዚያ በፊት እርስ በርሳቸው በጥል[b] ነበሩና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርስ በርሳቸው ወዳጃማ ሆኑ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እርስ በርሳቸው ጠላቶች ነበሩ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: ሆኑ
  rationale: የግንኙነት ሁኔታ መለወጡን በተፈጥሯዊና ቀጥተኛ አማርኛ ያሳያል።
- source_word: φίλοι
  choice: ወዳጆች
  rationale: ቃሉ ወዳጅነትን ወይም የተስማሙ ወገኖች መሆንን ሊያመለክት ስለሚችል፣ ቀጥተኛውን ትርጉም ይጠብቃል።
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: በዚያኑ ዕለት
  rationale: በግሪክ ምንጩ ያለውን የ‘ያው ዕለት’ አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μετ’ ἀλλήλων
  choice: እርስ በርሳቸው
  rationale: የሁለቱን የጋራና ተመላላሽ ግንኙነት በግልጽ ያሳያል።
- source_word: προϋπῆρχον
  choice: ከዚያ በፊት … ነበሩ
  rationale: ከዚያ ዕለት በፊት ለተወሰነ ጊዜ የቆየውን ሁኔታ ያሳያል።
- source_word: ἐν ἔχθρᾳ
  choice: በጥል
  rationale: የቀድሞውን የጠላትነትና የተቃውሞ ግንኙነት በአጭር፣ ተፈጥሯዊና ክቡር አማርኛ ይገልጣል።
- source_word: πρὸς αὑτούς
  choice: እርስ በርሳቸው
  rationale: ጥሉ አንዱ ወደ ሌላው የነበረ የጋራ ጠላትነት መሆኑን ያስቀምጣል።
theological_decisions:
- issue: በሄሮድስና በጲላጦስ መካከል የተፈጠረው የግንኙነት ለውጥ ባሕርይ
  choice: ጽሑፉ እነርሱ በዚያ ዕለት ወዳጆች እንደሆኑ ብቻ ይናገራል።
  alternative: ‘ወዳጃማ ሆኑ’ የሚለው ደካማ ትርጉም ወይም የፖለቲካ ኅብረት ብቻ ነበር የሚል ንባብ።
  rationale: ምንጩ የለውጡን ውስጣዊ ምክንያት፣ ጥልቀት ወይም ሥነ መለኮታዊ ፍቺ አይገልጥም፤ ስለዚህ ትርጉሙ ከተጻፈው በላይ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘በዚያኑ ዕለት’ የምንጩን አጽንዖት ይጠብቃል፤ ‘በጥል ነበሩ’ም ከቃል በቃል የራቀ ሳይሆን ተፈጥሯዊ አማርኛ ነው።
