base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: am
  text: እነርሱም እንዲህ እያሉ እርሱን መክሰስ ጀመሩ፦ “ይህ ሰው ሕዝባችንን ሲያሳስት[a]፣ ለቄሳር ግብር[b] እንዳንከፍል ሲከለክልና ራሱን መሲሕ፣ ንጉሥ እንደሆነ ሲናገር አግኝተነዋል።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝባችንን ሲያፈነግጥ” ወይም “ሕዝባችንን ከመንገዱ ሲያስወጣ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል φόρους ለሮማዊው ገዥ የሚከፈልን ግብር ወይም ቀረጥ ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ራሱ መሲሕ፣ ንጉሥ ነው ሲል።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: እነርሱም ... እርሱን መክሰስ ጀመሩ
  rationale: የመጀመርን ሂደት እና የፍርድ ክስን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Τοῦτον
  choice: ይህ ሰው
  rationale: ጠቋሚውን አገላለጽ በተፈጥሯዊ ሁኔታ ይጠብቃል፤ በክሱ ውስጥ ያለውን የማቃለል ቃናም ሊያሰማ ይችላል።
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: ሕዝባችንን ሲያሳስት
  rationale: διαστρέφω ማሳሳትን፣ ከትክክለኛው መንገድ ማዞርን ወይም ማፈንገጥን ሊጠቁም ይችላል። አውዱ ፖለቲካዊ ቢሆንም ‘መገልበጥ’ የሚለውን የተወሰነ ትርጉም ሳያስገባ፣ ‘ሲያሳስት’ ሰፊውን የቃሉን ክልል ይጠብቃል።
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: ለቄሳር ግብር እንዳንከፍል ሲከለክል
  rationale: κωλύω ያለውን የመከልከል ኃይል ይጠብቃል፤ በδιδόναι የተገለጸውን ክፍያ በአማርኛው ‘እንዳንከፍል’ በማለት የከሳሾቹን ተሳትፎ ግልጽ ያደርጋል።
- source_word: φόρους
  choice: ግብር
  rationale: ለሮማዊው ገዥ የሚከፈለውን ቀረጥ ወይም ግብር የሚያመለክት ተፈጥሯዊና የተለመደ አማርኛ ነው።
- source_word: αὑτὸν χριστὸν βασιλέα εἶναι
  choice: ራሱን መሲሕ፣ ንጉሥ ነኝ ሲል
  rationale: αὑτόν ያለውን አጽንኦት ‘ራሱን’ ይጠብቃል፤ χριστός እዚህ እንደ ንጉሣዊ ማዕረግ ‘መሲሕ’ ተተርጉሟል። በአማርኛ የቀጥታ ንግግር ውስጥ ተፈጥሯዊ ለመሆን ‘ነኝ’ ተጠቅሟል።
theological_decisions:
- issue: በፖለቲካዊ ክስ ውስጥ χριστόν እንዴት እንደሚተረጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ስም ሳይሆን ከንግሥና ጋር የተያያዘ ማዕረግ ነው፤ ‘መሲሕ’ የተቀባውን ንጉሥ የሚያመለክተውን አይሁዳዊ ዳራ ይጠብቃል።
- issue: χριστὸν βασιλέα የሁለቱ ስያሜዎች ግንኙነት
  choice: መሲሕ፣ ንጉሥ
  alternative: ንጉሥ መሲሕ / መሲሑ ንጉሥ
  rationale: የግሪኩን ሁለት ተያያዥ የተሳቢ ስሞች ሳያዋህድና ከጽሑፉ በላይ የተወሰነ ቋሚ ማዕረግ ሳይፈጥር ይጠብቃል።
- issue: የከሳሾቹ ንግግር እንደ እውነተኛ የታሪክ ገለጻ እንዳይታይ
  choice: የክስ ንግግሩን በጥቅስ ውስጥ ግልጽ ማድረግ
  alternative: ክሱን በተራኪው ድምፅ ማቅረብ
  rationale: ጽሑፉ የከሳሾቹን አባባል እንጂ የተራኪውን ፍርድ አያቀርብም፤ ይህን ልዩነት መጠበቅ የትረካውንና የሥነ መለኮት ውጥረቱን ያስቀራል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ የፍርድ ቤት ትረካ ቃና ተጠብቋል። ‘ቄሳር’ ታሪካዊውን ማዕረግ፣ ‘ግብር’ ደግሞ በዘመናዊ አማርኛ የሚገባውን የክፍያ ሐሳብ ይይዛሉ። ሁሉም የግርጌ ማስታወሻ ምልክቶች [a]፣ [b]፣ [c] በዋናው ጽሑፍ ውስጥ ተካተዋል።
