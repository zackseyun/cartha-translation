  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: am
  text: እንዲህም አላቸው፦ “ይህን ሰው ሕዝቡን ያሳስታል[a] ብላችሁ ወደ እኔ አመጣችሁት። እነሆ፣ በፊታችሁ መርምሬው፣ በዚህ ሰው ላይ የምትከሱበትን ክስ የሚደግፍ ምንም ምክንያት[b] አላገኘሁም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝቡን ከመንገዱ ያስወጣል።” የግሪኩ ግስ ከመንገድ ማስወጣት ወይም ማሳሳት ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእርሱ ላይ ከምትከሱት ነገር አንጻር በዚህ ሰው ምንም ጥፋት አላገኘሁም።”
    reason: alternative_rendering
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: ወደ እኔ አመጣችሁት
  rationale: የተፈጸመውን የማምጣት ድርጊትና የፍርድ አውዱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: ሕዝቡን ያሳስታል ብላችሁ
  rationale: ἀποστρέφω በዚህ የክስ አውድ ‘ከመንገድ ማስወጣት/ማሳሳት’ ማለት ሊሆን ይችላል፤ ‘ያሳስታል’ ከጽሑፉ በላይ ‘ያነሳሳል’ የሚል ጠንካራ ፖለቲካዊ ትርጉም አይጨምርም።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ተናጋሪው ቀጥሎ ለሚናገረው ፍርዳዊ ውሳኔ ትኩረት እንዲሰጥ የሚጠይቀውን የንግግር ምልክት በክብር ያለው ነገር ግን የተለመደ የመጽሐፍ ቅዱስ አማርኛ ያቀርባል።
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: በፊታችሁ መርምሬው
  rationale: ምርመራው በከሳሾቹ ፊት በግልጽ መካሄዱንና ἀνακρίνω ያለውን ፍርዳዊ የመመርመር ስሜት ይጠብቃል።
- source_word: αἴτιον
  choice: የጥፋተኝነት ምክንያት
  rationale: ቃሉ በፍርድ አውድ የክስ መሠረት ወይም ጥፋተኝነትን የሚያስወስን ምክንያት ያመለክታል፤ ይህ አተረጓጎም ፍርዳዊ ገጽታውን ያቆያል።
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: በእርሱ ላይ ስለምትከሱት ነገር
  rationale: κατηγορέω ያለውን የሕግ ክስ ፍቺ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የጲላጦስ መግለጫ ወሰን
  choice: መግለጫውን ከቀረበው ክስ አንጻር ምንም የጥፋተኝነት ምክንያት እንዳላገኘ የሚገልጽ ፍርዳዊ ውሳኔ አድርጎ መተርጎም
  alternative: ‘በዚህ ሰው ምንም ጥፋት አላገኘሁም’ ብሎ ከተወሰነው የሕግ አውድ በላይ አጠቃላይ የሥነ ምግባር ንጽሕናን እንደሚያውጅ ማቅረብ
  rationale: ἀνακρίνω፣ αἴτιον እና κατηγορέω የፍርድ ቃላት ናቸው፤ ስለዚህ ትርጉሙ የቅርብ የፍርድ አውዱን ይጠብቃል እንጂ ጽሑፉ በግልጽ ያላለውን ሰፊ ሥነ መለኮታዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የፍርድ አውዱ ተጠብቋል፤ ‘እነሆ’ የግሪኩን የትኩረት ጥሪ በሚመጥን መጽሐፍ ቅዱሳዊ ክብር ያቀርባል።
