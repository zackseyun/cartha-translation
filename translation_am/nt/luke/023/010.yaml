  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: am
  text: የካህናት አለቆችና ጸሐፍትም በዚያ ቆመው አጥብቀው ይከሱት ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: በዚያ ቆመው ... ነበር
  rationale: የግሪኩ ግስ በትዕይንቱ ቆመው እንደነበሩ የሚገልጽ የቆይታ ሁኔታ ነው፤ «በዚያ ቆመው» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ በአማርኛ «-ም» ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ቃሉ ብዙ ሊቃነ ካህናት በአንድ ጊዜ ዋና ካህን ነበሩ ሳይል፣ የካህናትን መሪ ባለሥልጣናት ያመለክታል።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: በወንጌል ትረካ የተለመደና ቀጥተኛ አቻ ቃል ነው፤ «የሕግ መምህራን» ከግሪኩ የበለጠ ትርጓሜ ይጨምራል።
- source_word: εὐτόνως
  choice: አጥብቀው
  rationale: የክሱን ኃይለኛነትና ጽናት በዘመናዊ፣ ግልጽ አማርኛ ያሳያል።
- source_word: κατηγοροῦντες
  choice: ይከሱት ነበር
  rationale: የአሁን ጊዜ አሳታፊው በዚያ ቆመው ሳሉ ክሱ ቀጥሎ እንደነበር ያሳያል፤ ይህ አገላለጽ የሕጋዊውንና የትረካውን ስሜት ይጠብቃል።
- source_word: αὐτοῦ
  choice: -ት
  rationale: ከκατηγορέω ጋር ያለው የባለቤት አገባብ የክሱን ተቀባይ ያመለክታል፤ በአማርኛ «ይከሱት» በቂና ተፈጥሯዊ ነው።
