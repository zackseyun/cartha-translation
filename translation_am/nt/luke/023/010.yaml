translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅመናል። «ጸሐፍት» ባህላዊ የመጽሐፍ ቅዱስ ቃል ቢሆንም አሁንም የሚገባ ነው፤ «አጥብቀው» ደግሞ εὐτόνως የሚያመለክተውን ጽኑ ክስ በቀላሉ ይገልጻል።
