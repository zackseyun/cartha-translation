source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: am
  text: ቀድሞውኑ ስድስተኛው ሰዓት ገደማ ነበር፤[a] እስከ ዘጠነኛው ሰዓት ድረስ በምድሪቱ ሁሉ ላይ ጨለማ ሆነ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም ከቀትር ገደማ ጀምሮ እስከ ከሰዓት በኋላ ሦስት ሰዓት ገደማ ድረስ ማለት ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “በመላው ምድር ላይ።” የግሪኩ γῆ የሚለው ቃል “ምድሪት” ወይም “ምድር” ማለት ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: አሁንም
  rationale: በትረካው ውስጥ ይህ ጊዜ አስቀድሞ መድረሱን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ὡσεὶ
  choice: ገደማ
  rationale: ጊዜው ትክክለኛ ሰዓት ሳይሆን ግምታዊ መሆኑን ያሳያል።
- source_word: ὥρα ἕκτη
  choice: ስድስተኛው ሰዓት
  rationale: የምንጩን ጥንታዊ የሰዓት አጠራር በዋናው ጽሑፍ ይጠብቃል፤ ዘመናዊ አቻው በማስታወሻ ተብራርቷል።
- source_word: σκότος
  choice: ጨለማ
  rationale: በዚህ አውድ የግሪኩን ስም በግልጽና በተለመደ አማርኛ ይተረጉማል።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: የጨለማውን መከሰት የግሪኩን ክስተታዊ ኃይል ሳያጋንን ያስተላልፋል።
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: በምድሪቱ ሁሉ ላይ
  rationale: γῆ የተወሰነን ምድር ወይም መላውን ምድር ሊያመለክት ይችላል። ይህ ምርጫ ወሰኑን ያለአስፈላጊ ሁኔታ ዓለም አቀፍ አድርጎ አይወስንም።
- source_word: ἕως ὥρας ἐνάτης
  choice: እስከ ዘጠነኛው ሰዓት ድረስ
  rationale: ከስድስተኛው ሰዓት ጋር ያለውን የምንጩን ትይዩ የጊዜ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በጨለማው ንግግር ውስጥ የγῆ ወሰን
  choice: ምድሪቱ
  alternative: መላው ምድር
  rationale: የግሪኩ ቃል ክልላዊም ሆነ ዓለም አቀፋዊ ትርጉም ሊኖረው ይችላል። ዋናው ጽሑፍ የተገደበውን አገላለጽ ይጠቀማል፤ ሰፊው አማራጭ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ጥንታዊው የሰዓት አቆጣጠር በዋናው ጽሑፍ ተጠብቆ ዘመናዊ አቻው በማስታወሻ ተገልጿል።
