  rationale: በዚህ አውድ ሥልጣን ያላቸውን የሕዝብ መሪዎች በግልጽና ተፈጥሯዊ ቃል ይጠቅሳል።
- source_word: Ἄλλους ἔσωσεν / σωσάτω ἑαυτόν
