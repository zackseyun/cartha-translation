  choice: ቆሞ … ነበር
  rationale: የግሱን ቀጣይ ሁኔታና የትዕይንቱን መነሻ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θεωρῶν
  choice: ይመለከት
  rationale: ሕዝቡ በቀጣይነት ቆሞ ሲመለከት መቆየቱን ያሳያል።
- source_word: ἐξεμυκτήριζον
  choice: እያፌዙበት
