base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: am
  text: ሕዝቡም ቆሞ ይመለከት ነበር። መሪዎቹም ያፌዙበት ነበር፤ እንዲህም አሉ፤ “ሌሎችን አድኗል፤ ይህ የእግዚአብሔር መሲሕ፣ የተመረጠው[a] ከሆነ ራሱን ያድን!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር ክርስቶስ፣ ምርጡ።”
    reason: Χριστός እና ἐκλεκτός በቀጥታ በተለመዱት ቤተ ክርስቲያናዊ ቃላት ሊተረጎሙ የሚችሉበትን አማራጭ ያሳያል።
lexical_decisions:
