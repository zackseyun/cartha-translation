id: LUK.23.29
reference: Luke 23:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: am
  text: ምክንያቱም፣ እነሆ፣ ‘መካን ሴቶች፣ ያልወለዱ ማሕፀኖችና ያላጠቡ ጡቶች የተባረኩ ናቸው’ የሚሉባቸው ቀኖች ይመጣሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የሚከተለውን ከባድ ነገር ትኩረት ሰጥቶ እንዲሰማ የሚጋብዘውን የግሪክ ቃል በተለመደውና በክብር ባለው የአማርኛ አገላለጽ ተርጉሟል።
- source_word: στεῖραι
  choice: መካኖች
  rationale: ልጅ መውለድ ያልቻሉ ሴቶችን በቀጥታ የሚጠቅስ አጭርና የተለመደ አገላለጽ ነው።
- source_word: κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: ያልወለዱ ማሕፀኖች
  rationale: የምንጩን የአካል ክፍል አገላለጽና የመውለድ ምስል ይጠብቃል።
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: ያላጠቡ ጡቶች
  rationale: ἔθρεψαν በዚህ አውድ ሕፃንን በጡት ማጥባትና መመገብን ያመለክታል፤ ይህ ትርጉም ተፈጥሯዊና ትክክለኛ ነው።
- source_word: Μακάριαι
  choice: የተባረኩ ናቸው
  rationale: በመጪው መከራ አውድ ሰዎች እነዚህን ሴቶች ዕድለኞች እንደሚቆጥሯቸው የሚገልጸውን የምንጩን የቡራኬ ቋንቋ ይጠብቃል።
theological_decisions:
- issue: በመካንነት ላይ የተነገረው ቡራኬ
  choice: ንግግሩን እንደ ወደፊቱ በሰዎች የሚባል አስደንጋጭ ግምገማ ማቅረብ
  alternative: መካንነትን በራሱ እንደ መለኮታዊ ቡራኬ በቀጥታ ማቅረብ
  rationale: የግሪክ ሰዋስው ‘ይላሉ’ ብሎ ንግግሩን በመጪው አስከፊ ጊዜ ውስጥ ያስቀምጣል፤ ጽሑፉ መካንነትን ሁልጊዜ በራሱ ቡራኬ ነው አይልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ሦስት ትይዩ አገላለጾች እና የወደፊት ጊዜ አጽንዖት ተጠብቀዋል።
