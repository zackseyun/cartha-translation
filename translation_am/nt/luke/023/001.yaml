  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: am
  text: የእነርሱም መላው ስብስብ ተነሥቶ ወደ ጲላጦስ ወሰደው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: እነርሱም
  rationale: የግሪኩን ተራኪያዊ አያያዥ በአማርኛው «-ም» ያስተላልፋል፤ «እነርሱ» ደግሞ በαὐτῶν የተጠቀሰውን ቡድን በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: ἀναστὰν
  choice: ተነሥተው
  rationale: ከዋናው ድርጊት በፊት የተፈጸመውን መነሣት በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጣል።
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: ጉባኤያቸው ሁሉ
  rationale: πλῆθος በዚህ የፍርድ አውድ የተሰበሰበውን ቡድን ያመለክታል፤ «ጉባኤ» የዘፈቀደ ሕዝብ እንዳልሆነ ሳያስገድድ ይገልጣል። «ሁሉ» የἅπανን አጠቃላይነት፣ «-አቸው» ደግሞ αὐτῶνን ይጠብቃሉ።
- source_word: ἤγαγον
  choice: ወሰዱት
  rationale: ἄγω እዚህ ኢየሱስን በቁጥጥር ሥር ወደ መድረሻው መውሰዳቸውን ያመለክታል፤ «ወሰዱት» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: αὐτὸν
  choice: -ት
  rationale: ወደ ኢየሱስ የሚመለሰው ተሳቢ ተውላጠ ስም በአማርኛው ግስ ላይ በተያያዘው «-ት» ተገልጧል።
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: ወደ ጲላጦስ
  rationale: ἐπί ከተሳቢ ቅርጽና ከእንቅስቃሴ ግስ ጋር ወደ ሰውየው መሄድን ያመለክታል፤ «ወደ» ይህን በቀጥታ ያስተላልፋል።
- source_word: Πιλᾶτον
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይጠቀማል።
theological_decisions:
- issue: በፍርድ አውድ ያለውን የቡድን ስም አተረጓጎም
  choice: ጉባኤያቸው ሁሉ
  alternative: ስብስባቸው ሁሉ
  rationale: «ጉባኤ» የተሰበሰበውን አካል ይገልጣል፤ ነገር ግን ግሪኩ በግልጽ ከሚለው በላይ የተወሰነ መደበኛ ተቋም እንደሆነ አይወስንም። አማራጩ የπλῆθοςን ሰፊ የቡድን ትርጉም ያሳያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ የቡድን ስም ነጠላ ቅርጽ ቢኖረውም ዋናው ግስ ብዙ ቁጥር ስለሆነ «ተነሥተው…ወሰዱት» ተብሎ የቡድኑ አባላት በአንድነት ያደረጉት ድርጊት ተጠብቋል።
