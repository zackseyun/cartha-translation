  revision_rationale: The revision removes the double-subject construction, retains the connective force of Καὶ in «-ም», and renders ἅπαν τὸ πλῆθος αὐτῶν as one collective phrase. Singular verbs agree naturally with the Amharic collective noun «ስብስብ»; this does not alter the source sense that all members of the group acted together. The footnote offers «ሕዝብ» as a broader lexical alternative for πλῆθος without over-specifying the group as an official council.
