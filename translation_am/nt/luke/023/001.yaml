review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of rising and taking Jesus to Pilate, but «እነርሱም ጉባኤያቸው ሁሉ» duplicates and blurs the Greek collective subject. The genitive αὐτῶν belongs with πλῆθος, not with an independently introduced «እነርሱ».
  naturalness: 'The opening is not idiomatic modern standard Amharic: «እነርሱም ጉባኤያቸው ሁሉ» creates an awkward double subject. A single collective noun phrase with singular collective verbs is natural and clear.'
  terminology: «ስብስብ» renders πλῆθος without implying a formally constituted body beyond what the Greek states. «ጲላጦስ» is the conventional Amharic biblical form. «ወሰደው» adequately renders ἤγαγον in this context.
  issues:
  - severity: medium
    issue: Awkward and structurally unclear collective subject
    rationale: «እነርሱም ጉባኤያቸው ሁሉ» presents both «እነርሱ» and «ጉባኤያቸው» as subjects and does not clearly represent the single Greek phrase ἅπαν τὸ πλῆθος αὐτῶν. Revising to «የእነርሱም መላው ስብስብ» retains the genitive relation and gives a coherent Amharic collective subject.
  revised_text: የእነርሱም መላው ስብስብ ተነሥቶ ወደ ጲላጦስ ወሰደው።
  revised_footnotes:
