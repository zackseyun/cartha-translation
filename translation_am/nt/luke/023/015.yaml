  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: am
  text: ነገር ግን ሄሮድስም በእርሱ ላይ የሚያስወነጅል ነገር አላገኘም፤ ወደ እኛ መልሶ ልኮታልና። እነሆ፣ ይህ ሰው የሞት ቅጣት የሚያስገባ ምንም ነገር አላደረገም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: ሄሮድስም እንኳ አልፈረደበትም
  rationale: የግሪክ ሐረጉ ከቀደመው የጲላጦስ ፍርድ ጋር በንጽጽር ሄሮድስም የሞት ፍርድ እንዳላገኘበት ያመለክታል። በግሪኩ የተዘለለው ግስ በአማርኛ ለግልጽነት ተሞልቷል።
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: ወደ እኛ መልሶ ልኮታልና
  rationale: ἀναπέμπω በዚህ የፍርድ አውድ ‘መልሶ መላክ’ ማለት ነው፤ γάρ የምክንያት ግንኙነቱን ‘-ና’ ያሳያል።
- source_word: καὶ ἰδοὺ
  choice: እነሆ
  rationale: ἰδού ተናጋሪው ትኩረት ወደ መደምደሚያው እንዲስብ የሚጠቀምበት ምልክት ነው፤ ‘እነሆ’ የተከበረና የተለመደ አማርኛ ነው።
- source_word: οὐδὲν ἄξιον θανάτου
  choice: ለሞት የሚያበቃ ምንም ነገር
  rationale: ሐረጉ የሞት ቅጣት የሚያስገባ ድርጊት እንደሌለ በፍርድ ቤት አውድ ይገልጣል።
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: ይህ ሰው ... አላደረገም
  rationale: የተፈጸመውን ድርጊት ለኢየሱስ የሚያያይዘውን ትርጉም በተፈጥሯዊ አማርኛ የአድራጊ ግስ ገልጿል።
theological_decisions:
- issue: የ αὐτῷ ግንኙነት ከ πεπραγμένον ጋር
  choice: ድርጊቱን የፈጸመው እርሱ መሆኑን የሚጠቅስ፦ ‘ይህ ሰው ... አላደረገም’
  alternative: ‘በእርሱ ላይ ምንም ... አልተገኘም’ ወይም ‘በእርሱ ላይ አልተፈጸመም’
  rationale: አውዱ ጲላጦስ ኢየሱስ የሞት ፍርድ የሚያስገባ ድርጊት እንዳልፈጸመ እየገለጠ መሆኑን ያሳያል፤ ስለዚህ የአድራጊነት ትርጉሙ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛ። ‘እነሆ’ የ ἰδούን አጽንዖት ሲጠብቅ፣ የተዘለለው ግስ ‘አልፈረደበትም’ ተብሎ በአውዱ መሠረት ተሞልቷል።
