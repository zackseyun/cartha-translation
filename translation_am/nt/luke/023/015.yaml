- from: ሄሮድስም እንኳ አልፈረደበትም፤ ወደ እኛ መልሶ ልኮታልና። እነሆ፣ ይህ ሰው ለሞት የሚያበቃ ምንም ነገር አላደረገም።
  to: ነገር ግን ሄሮድስም በእርሱ ላይ የሚያስወነጅል ነገር አላገኘም፤ ወደ እኛ መልሶ ልኮታልና። እነሆ፣ ይህ ሰው የሞት ቅጣት የሚያስገባ ምንም ነገር አላደረገም።
