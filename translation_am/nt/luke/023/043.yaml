  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: am
  text: እርሱም፣ “እውነት እልሃለሁ፤ ዛሬ ከእኔ ጋር በገነት ትሆናለህ” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ አነስ ባለ ዕድል የሚታይ ንባብ፦ “እውነት ዛሬ እልሃለሁ፤ ከእኔ ጋር በገነት ትሆናለህ።” የግሪኩ ጽሑፍ በመጀመሪያ ዘመናዊ ሥርዓተ ነጥብ አልነበረውም፤ ይህ አማራጭ “ዛሬ”ን “ትሆናለህ” ከሚለው ይልቅ “እልሃለሁ” ከሚለው ጋር ያያይዘዋል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: እውነት
  rationale: በኢየሱስ ንግግሮች መግቢያ ላይ የሚመጣውን የተረጋገጠና ሥልጣናዊ አዋጅ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: σοι λέγω
  choice: እልሃለሁ
  rationale: የግሪኩን ‘ለአንተ እላለሁ’ ትርጉም በአጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ይሰጣል፤ ተውላጠ ስሙም ነጠላ ወንድ ነው።
- source_word: σήμερον
  choice: ዛሬ
  rationale: በዋናው ንባብ ‘ትሆናለህ’ የሚለውን የወደፊት ግስ እንዲወስን ተደርጓል፤ ይህም ቃል የተገባው በዚያው ቀን እንደሚፈጸም ያሳያል። ሌላው የሥርዓተ ነጥብ ንባብ በማስታወሻ ተጠብቋል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: የግሪኩን ቅድመ አቀማመጥ ሐረግ በቀጥታና በግልጽ ይተረጉማል፤ ከኢየሱስ ጋር መሆንን ያጎላል።
- source_word: ἔσῃ
  choice: ትሆናለህ
  rationale: የεἰμίን ሁለተኛ መደብ ነጠላ የወደፊት ጊዜ ቅርጽ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: παραδείσῳ
  choice: ገነት
  rationale: በአማርኛ የመጽሐፍ ቅዱስና የዕለት ተዕለት አጠቃቀም የተለመደ፣ በዚህ የፍጻሜ ዘመን አውድ παράδεισοςን በትክክል የሚወክል ቃል ነው።
theological_decisions:
