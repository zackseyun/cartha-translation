  rationale: የቃላቱ ቅደም ተከተልና የኮይኔ ግሪክ ተፈጥሯዊ አጠቃቀም ‘ዛሬ’ የመሆኑን ጊዜ እንዲገልጽ ይደግፋሉ። ነገር ግን ጥንታዊው ጽሑፍ ዘመናዊ ሥርዓተ ነጥብ ስላልነበረውና ሌላው ንባብ ሥነ መለኮታዊ ክብደት ስላለው፣ ያ አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
