  rationale: የተደገመው ἀνήρ «ሰው» ተብሎ ለአጽንዖት ተጠብቋል። ἀγαθός «መልካም» ተብሏል፤ δίκαιος የሥነ ምግባርና የመንፈሳዊ ቅንነት ትርጉሙን ለማቆየት «ጻድቅ» ተብሏል።
theological_decisions:
- issue: በግለሰብ ባሕርይ መግለጫ ውስጥ δίκαιος የሚለውን መተርጎም
