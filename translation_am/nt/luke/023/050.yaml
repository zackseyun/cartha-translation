lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: እነሆም
  rationale: የሉቃስን ትኩረት ሰጪ የትረካ ምልክት ሳያስወግድ በተፈጥሯዊና ክብር ባለው አማርኛ ያቀርባል፤ -ም ደግሞ Καίን ከቀደመው ትረካ ጋር ያገናኛል።
- source_word: ἀνὴρ
  choice: አንድ ሰው
  rationale: በዚህ አውድ የተወሰነ ወንድ ግለሰብን ያመለክታል፤ የዮሴፍ የወንድ ስምና ቀጣዩ አውድ ጾታውን ግልጽ ስለሚያደርጉ ተፈጥሯዊው «ሰው» ተመርጧል።
- source_word: ὀνόματι Ἰωσὴφ
