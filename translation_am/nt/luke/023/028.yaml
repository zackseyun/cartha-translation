  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: am
  text: ኢየሱስም ወደ እነርሱ ዘወር ብሎ እንዲህ አላቸው፦ “የኢየሩሳሌም ሴት ልጆች፣[a] ስለ እኔ አታልቅሱ፤ ይልቁንም ስለ ራሳችሁና ስለ ልጆቻችሁ አልቅሱ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የኢየሩሳሌም ሴቶች።” ግሪኩ ቃል በቃል “የኢየሩሳሌም ሴት ልጆች” ይላል፤ ይህ ትንቢታዊ የጥሪ አነጋገር በዋናው ጽሑፍ ተጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: ኢየሱስም ወደ እነርሱ ዘወር ብሎ
  rationale: የግሪኩን የአካላዊ መዞር ትርጉምና ከዋናው ግስ ጋር ያለውን የአሳታፊ ግስ ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል። δέ እዚህ ቀላል የትረካ ሽግግር ስለሚያመለክት በ«ም» ተገልጧል።
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: እናንተ የኢየሩሳሌም ሴቶች ልጆች
  rationale: «ሴቶች ልጆች» የθυγατέρεςን ቃል በቃል ምስልና ትንቢታዊ የአነጋገር ዘይቤ ይጠብቃል፤ «እናንተ» ደግሞ ጥሪውን በዘመናዊ አማርኛ ግልጽ ያደርገዋል።
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: ስለ እኔ አታልቅሱ
  rationale: የልቅሶውን ነገር ወይም ምክንያት በ«ስለ» በተፈጥሯዊ ሁኔታ ያሳያል፤ የአሁን ጊዜ እገዳውን «ማልቀስ አቁሙ» ብሎ በግድ ሳይወስን «አታልቅሱ» ብሎ ያቆያል።
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: ይልቁንም ስለ ራሳችሁ … አልቅሱ
  rationale: πλήν የሚያመጣውን የማረሚያ ንጽጽር «ይልቁንም» በግልጽ ያሳያል፤ ἐφ’ ἑαυτὰς ከ«ስለ እኔ» ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: καὶ ἐπὶ τὰ τέκνα ὑμῶν
  choice: ስለ ልጆቻችሁ
  rationale: τέκναን በቤተሰባዊና ቀላል ትርጉሙ «ልጆች» ብሎ ይተረጉማል፤ ἐπίንም ከቀደመው ሐረግ ጋር ትይዩ በሆነ «ስለ» ያቀርባል።
