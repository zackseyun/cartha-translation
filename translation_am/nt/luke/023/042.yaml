id: LUK.23.42
reference: Luke 23:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: am
  text: እንዲህም አለ፦ “ኢየሱስ ሆይ፣ በመንግሥትህ ስትመጣ አስበኝ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ መንግሥትህ ስትመጣ።” የSBLGNT ጽሑፍ “በመንግሥትህ” የሚል ሲሆን፣ አንዳንድ የእጅ ጽሑፎች ግን “ወደ መንግሥትህ” የሚለውን አቅጣጫ ይበልጥ በግልጽ ያሳያሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: እንዲህም
  rationale: ቀላል የትረካ አያያዥ ሆኖ ይሠራል፤ በአማርኛም ከንግግር መግቢያው ጋር ተፈጥሯዊ ነው።
- source_word: ἔλεγεν
  choice: አለ
  rationale: የግሪኩ ኢምፐርፌክት እዚህ በትረካ ውስጥ በተፈጥሯዊ የአማርኛ ቀላል ያለፈ ጊዜ ተተርጉሟል፤ ‘ይል ነበር’ የሚለው ተደጋጋሚነትን ሊያጎላ ይችላል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ ሆይ
  rationale: የጥሪ ቅርጹን በተፈጥሯዊው የአማርኛ ‘ሆይ’ ያሳያል።
- source_word: μνήσθητί μου
  choice: አስበኝ
  rationale: ቀጥተኛውን ልመና ‘አስበኝ’ በሚል ያቀርባል፤ ማሰቡ ለጠያቂው በጎ እርምጃን ሊያመለክት ቢችልም ያንን ትርጉም አልጨመረም።
- source_word: ὅταν ἔλθῃς
  choice: ስትመጣ
  rationale: ወደፊት የሚፈጸም መምጣትን በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ይገልጣል።
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: በመንግሥትህ
  rationale: የSBLGNT ἐνን በቅርብ የሚከተለው ‘በ’ ሲሆን፣ βασιλεία ሊያመለክት የሚችለውን መንግሥት፣ ንጉሣዊ ሥልጣን ወይም አገዛዝ ሳይወስን የተለመደውን ‘መንግሥት’ ይጠቀማል።
theological_decisions:
- issue: የልመናው የፍጻሜ ዘመን አንድምታ
  choice: ተናጋሪው ኢየሱስ በመንግሥቱ ሲመጣ እንዲያስበው ይለምናል፤ ጊዜውንና ዝርዝር ሥርዓቱን አይወስንም።
  alternative: ኢየሱስ በንጉሣዊ ኃይል ሲመጣ ወይም ወደ መንግሥቱ ሲገባ እንዲያስበው እየጠየቀ ነው።
  rationale: ጥቅሱ ለኢየሱስ ወደፊት የሚገለጥ መንግሥትን ያስረዳል፤ ነገር ግን የክስተቱን ቅደም ተከተል ወይም ሙሉ አስተምህሮ አይዘረዝርም።
- issue: ἐν የሚገልጠው ግንኙነት
  choice: ‘በመንግሥትህ’ በማለት የSBLGNTን ἐν ጠብቆ ክፍት ማድረግ።
  alternative: ‘ወደ መንግሥትህ’ በማለት አቅጣጫን በግልጽ መግለጽ።
  rationale: ἐν በመሠረቱ ‘በ/ውስጥ’ የሚል ሲሆን፣ ከመምጣት ግስ ጋር የመግባት አንድምታ ሊኖረው ይችላል። ዋናው ጽሑፍ የምንጭ አሻሚነቱን ይጠብቃል፤ አቅጣጫዊው ንባብ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ኢየሱስ ሆይ’ የግሪኩን የጥሪ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል። የግርጌ ማስታወሻው ምልክት [a] በዋናው ጽሑፍ ተካትቷል።
