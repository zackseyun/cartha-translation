  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: am
  text: ብዙ ሕዝብ እርሱን ተከትሎ ይሄድ ነበር፤ ከመካከላቸውም ደረታቸውን እየደበደቡ ስለ እርሱ እያለቀሱ የነበሩ ሴቶች ነበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: ተከትሎ ይሄድ ነበር
  rationale: የግሪኩ ኢምፐርፌክት ግስ በዚያን ጊዜ ቀጥሎ የነበረውን ድርጊት ያሳያል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: በዓረፍተ ነገሩ ቀጣይነት ተወክሏል
  rationale: አገናኙ የትረካ ቀጣይነትን ያመለክታል፤ በአማርኛ ግን በግድ በተለየ ቃል መተርጎም አያስፈልግም።
- source_word: αὐτῷ
  choice: እርሱን
  rationale: ከἀκολουθέω ጋር ያለው ዳቲቭ ሕዝቡ ኢየሱስን እንደተከተለ ያሳያል፤ አማርኛም ‘እርሱን ተከትሎ’ ይላል።
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: ብዙ ሕዝብ
  rationale: የግሪኩን ‘ብዙ የሕዝብ ስብስብ’ ትርጉም ያለ ሜካኒካዊ የቃላት ድግግሞሽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γυναικῶν αἳ
  choice: ከመካከላቸውም … የነበሩ ሴቶች
  rationale: ሴቶቹ በሚከተለው ሕዝብ ውስጥ እንደነበሩ ያሳያል፤ የሴት ብዙ ቁጥር አንጻራዊ ተውላጠ ስም የሚያመለክተውም ሴቶቹን ብቻ መሆኑን ግልጽ ያደርጋል።
- source_word: ἐκόπτοντο
  choice: ደረታቸውን እየደቁ
  rationale: ቃሉ በሐዘን አውድ ደረትን መደብደብ የሚባለውን የልቅሶ ምልክት ያመለክታል፤ ድርጊቱን በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐθρήνουν αὐτόν
  choice: ስለ እርሱ እያለቀሱ
  rationale: θρηνέω የሐዘን ልቅሶን ያመለክታል፤ ‘ስለ እርሱ’ የልቅሶው ምክንያትና ተጠቃሽ እርሱ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
