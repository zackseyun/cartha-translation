base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: am
  text: ሌላው ግን መልሶ እየገሠጸው እንዲህ አለ፦ “አንተስ በተመሳሳይ ፍርድ[a] ሥር ሆነህ እንኳ እግዚአብሔርን አትፈራምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “በተመሳሳይ የቅጣት ፍርድ ሥር” ወይም “በተመሳሳይ ፍርድ ውስጥ።” የግሪኩ κρίμα ፍርድን፣ ውሳኔን ወይም የቅጣት ፍርድን ሊያመለክት ይችላል፤ እዚህ ሁለቱ የሚጋሩትን የቅጣት ውጤት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: ሌላው ግን መልሶ
  rationale: δὲ በሁለቱ ወንጀለኞች ምላሽ መካከል ያለውን ንጽጽር “ግን” በማለት ያሳያል፤ ἀποκριθείς ደግሞ ቀጥተኛ ንግግርን የሚያስገባ ሆኖ “መልሶ” ተተርጉሟል።
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: እየገሠጸው እንዲህ አለ
  rationale: የአሁን ጊዜ አሳታፊው ግስ ንግግሩ በግሣጼ መልክ መነገሩን ያሳያል፤ “ገሠጸ” የἐπιτιμάωን ጠንካራ ግን ተፈጥሯዊ ትርጉም ይጠብቃል።
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: አንተስ … እንኳ እግዚአብሔርን አትፈራምን?
  rationale: ግልጽ የሆነው σὺ “አንተስ” ተብሎ አጽንዖቱን ጠብቋል፤ οὐδὲ በ“እንኳ” ተንጸባርቋል፤ φοβῇ ደግሞ የመለኮታዊ ተጠያቂነት ክብደቱን ሳያለዝብ “አትፈራምን?” ተብሏል።
- source_word: ὅτι ἐν τῷ αὐτῷ κρίματι εἶ
  choice: በዚሁ ፍርድ ሥር ሆነህ
  rationale: ὅτι ለግሣጼው ምክንያት ይሰጣል፤ κρίμα ፍርድን፣ ውሳኔን ወይም የቅጣት ፍርድን ሊያመለክት ስለሚችል “ፍርድ” የቃሉን ስፋት ይጠብቃል፤ “በዚሁ … ሥር” ሁለቱ የተጋሩትን ሁኔታ ያሳያል።
theological_decisions:
- issue: “እግዚአብሔርን መፍራት” የሚለው አገላለጽ
  choice: እግዚአብሔርን አትፈራምን?
  alternative: ለእግዚአብሔር ክብር የለህምን?
  rationale: “መፍራት” የግሪኩን φοβέομαι ቀጥተኛ ኃይልና የመጽሐፍ ቅዱስን አገላለጽ ይጠብቃል፤ ወደ “ማክበር” ማለዘብ ወይም በአስተምህሮ ሐሳብ ማስፋት አያስፈልግም።
- issue: κρίμα የሚያመለክተው ፍርድ ወይስ የቅጣት ውጤት
  choice: ፍርድ
  alternative: የቅጣት ፍርድ / ኩነኔ
  rationale: በስቅለቱ አውድ የቅጣት ውጤቱ ግልጽ ቢሆንም κρίμα ሰፋ ያለ የፍርድ፣ የውሳኔ ወይም የቅጣት ፍርድ ትርጉም አለው። “ፍርድ” ይህን አሻሚነት ይጠብቃል፣ አውዱም የቅጣት ሁኔታውን ያብራራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛን ይጠቀማል። “እየገሠጸው” የንግግሩን ጥብቅ ቃና ይጠብቃል፤ “በዚሁ ፍርድ ሥር” ደግሞ ሕጋዊውን አውድ በተፈጥሯዊ አማርኛ ያቀርባል።
