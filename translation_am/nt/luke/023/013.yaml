  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሐረግ በቁጥር 14 የሚቀጥል ቢሆንም፣ ይህ ቁጥር ብቻውን ሲቀርብ የአማርኛው ዓረፍተ ነገር ያልተቋጨ እንዳይመስል ‘ሰብስቦ ጠራ’ በሚል ተፈጥሯዊ አገላለጽ ቀርቧል።
