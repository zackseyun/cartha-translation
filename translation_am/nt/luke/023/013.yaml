  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: am
  text: ጲላጦስም የካህናት አለቆችን፣ ገዢዎችንና ሕዝቡን ሰብስቦ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የተለመደውን የግል ስም አጻጻፍ ይከተላል።
- source_word: δὲ
  choice: -ም
  rationale: በትረካው ውስጥ ያለውን መጠነኛ ሽግግርና ትስስር በተፈጥሯዊ አማርኛ ያሳያል፤ ከባድ ተቃርኖን አያስገባም።
- source_word: συγκαλεσάμενος
  choice: ሰብስቦ ጠራ
  rationale: የግሪኩን ‘አንድ ላይ መጥራት’ ፍቺ እና ከዋናው ግስ በፊት የሆነውን ድርጊት በተፈጥሯዊ የአማርኛ ግስ ቅደም ተከተል ያቀርባል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ሊቀ ካህናት እንዳሉ ሳያስመስል፣ ዋናዎቹን የካህናት ባለሥልጣናት ያመለክታል።
- source_word: ἄρχοντας
  choice: ገዢዎች
  rationale: ቃሉ የሚያመለክተውን የሥልጣንና የአስተዳደር ሚና በቀጥታና በሚነበብ መንገድ ይገልጣል።
- source_word: λαὸν
  choice: ሕዝቡን
  rationale: የግሪኩን ሰፊ የሕዝብ ስብስብ ማመልከቻ ይጠብቃል፤ ትርጉሙን ‘ሕዝብ ብዛት’ ብቻ ወደሚያመለክት ቃል አያጠብም።
