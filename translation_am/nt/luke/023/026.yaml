- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: ከኢየሱስ ኋላ ሆኖ
  rationale: ὄπισθεν በዋናነት የቦታ አቀማመጥን፣ ማለትም ከኢየሱስ ኋላ መሆንን ያሳያል፤ ትርጉሙም ይህን የሰልፉን ምስል ይጠብቃል።
