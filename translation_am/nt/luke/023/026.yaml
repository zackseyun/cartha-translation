  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: am
  text: እርሱንም እየወሰዱት ሳሉ፣ ከገጠር[a] እየመጣ የነበረውን፣ የቀሬና ሰው የሆነውን አንድ ስምዖንን ያዙ፤ መስቀሉንም[b] ከኢየሱስ ኋላ ሆኖ እንዲሸከመው በእርሱ ላይ ጫኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእርሻ»። የግሪኩ ቃል በተለይ እርሻን ወይም በአጠቃላይ ከከተማ ውጭ ያለውን ገጠር ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንዶች እዚህ ላይ «መስቀሉን» የሚለውን በተለይ «የመስቀሉን አግዳሚ እንጨት» ብለው ይረዱታል፤ የግሪኩ ጽሑፍ ግን «መስቀሉን» ብቻ ይላል።
    reason: lexical_alternative
