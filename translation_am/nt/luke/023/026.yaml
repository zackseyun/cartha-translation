- source_word: ἀπήγαγον
  choice: እየወሰዱት ሳሉ
  rationale: ἀπάγω በጥበቃ ሥር ከቦታው መውሰድን ያመለክታል፤ ይህ አገላለጽ የግሱን ትርጉምና ὡς የሚያሳየውን በድርጊቱ ጊዜ የተፈጸመ ነገር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπιλαβόμενοι
  choice: ያዙ
  rationale: በዚህ አውድ ግሱ አንድን ሰው በኃይል መያዝን ያሳያል፤ «ያዙ» ድርጊቱን ግልጽና ተፈጥሯዊ አድርጎ ይገልጻል።
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: ቀሬናዊ የሆነ ስምዖን የተባለ አንድ ሰው
  rationale: τινα የሚያሳየውን ያልተወሰነ መግቢያ «አንድ ሰው» ያስተላልፋል፤ Κυρηναῖον ደግሞ የቀሬና ተወላጅነቱን በ«ቀሬናዊ» ይገልጻል።
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: ከገጠር እየመጣ የነበረውን
  rationale: ἀγρός በተለይ እርሻን ወይም በአጠቃላይ ከከተማ ውጭ ያለውን ገጠር ሊያመለክት ይችላል። «ከገጠር» በአውዱ ተፈጥሯዊ ሲሆን ሌላው ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: መስቀሉንም በእርሱ ላይ ጫኑት
  rationale: ἐπιτίθημι አንድን ሸክም በሰው ላይ ማኖርን ያመለክታል፤ «በእርሱ ላይ ጫኑት» የተጫነበትን ሸክምና የግዴታውን ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸν σταυρὸν
  choice: መስቀሉን
  rationale: σταυρός በጽሑፉ ውስጥ «መስቀል» ማለት ነው፤ ጽሑፉ በግልጽ ያልጠቀሰውን «የመስቀሉ አግዳሚ እንጨት» በዋናው ጽሑፍ አልተጨመረም።
- source_word: φέρειν
  choice: እንዲሸከመው
