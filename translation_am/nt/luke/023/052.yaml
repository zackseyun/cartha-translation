lexical_decisions:
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: በቀደመው ቁጥር የተጠቀሰውን የአርማትያሱን ዮሴፍ ያመለክታል፤ «ይህ ሰው» የአመልካቹን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: προσελθὼν
  choice: ወደ ጲላጦስ ሄዶ
  rationale: የአኦሪስት አሳታፊው ከዋናው ግስ በፊት የተፈጸመውን ተከታይ ድርጊት ያሳያል፤ «ሄዶ» በትረካ አማርኛ ተፈጥሯዊ ነው።
- source_word: τῷ Πιλάτῳ
  choice: ወደ ጲላጦስ
  rationale: ከπροσέρχομαι ጋር ያለው ዳቲቭ የቀረቡለትን ሰው ያመለክታል። በቁጥሩ የሌለውን «ጳንጥዮስ» መጨመር አያስፈልግም።
- source_word: ᾐτήσατο
  choice: ለመውሰድ ጠየቀ
  rationale: ግሱ አንድን ነገር መጠየቅ ወይም እንዲሰጥ መለመንን ያመለክታል። በአማርኛ «ሥጋውን ጠየቀ» ግልጽ ላይሆን ስለሚችል፣ «ለመውሰድ» የጥያቄውን ዓላማ በተፈጥሯዊ አነጋገር ያብራራል።
- source_word: τὸ σῶμα
  choice: ሥጋ
  rationale: σῶμα በቀጥታ «ሥጋ/አካል» ማለት ነው። እዚህ የሞተውን አካል ቢያመለክትም፣ «ሬሳ» ከግሪኩ ይበልጥ ተርጓሚና የንግግር ቃናውን የሚያከብድ ነው።
- source_word: τοῦ Ἰησοῦ
  choice: የኢየሱስን
  rationale: የጄኒቲቭ ግንኙነቱ በተፈጥሯዊ የአማርኛ ባለቤትነት አወቃቀር ተተርጉሟል።
