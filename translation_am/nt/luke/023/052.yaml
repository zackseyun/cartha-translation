review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the demonstrative reference, approach to Pilate, request, and Jesus' body. However, «ለመውሰድ» explicitly frames the request as Joseph's purpose of taking the body, whereas the Greek directly states that he requested the body. This is a modest interpretive expansion.
  naturalness: «ይህ ሰው ወደ ጲላጦስ ሄዶ ... ጠየቀ» is fluent, clear modern narrative Amharic. «የኢየሱስን አካል ጠየቀ» is natural and does not require an added infinitival phrase.
  terminology: For σώμα in this context, «አካል» is the clearer standard Amharic equivalent for a person's body. «ሥጋ» can mean flesh and may introduce an avoidable ambiguity; «ሬሳ» would be more interpretive than the Greek.
  issues:
  - severity: medium
    issue: 'Added purposive expression: «ለመውሰድ»'
    rationale: The source has ᾐτήσατο τὸ σῶμα, “requested the body,” without stating a purpose clause. The infinitive is contextually plausible but adds information beyond the verse.
  - severity: low
    issue: «ሥጋ» for τὸ σῶμα
    rationale: While possible in biblical usage, «ሥጋ» commonly denotes flesh. «አካል» more directly and unambiguously conveys σώμα, “body,” in modern standard Amharic.
  revised_text: ይህ ሰው ወደ ጲላጦስ ሄዶ የኢየሱስን አካል ጠየቀ።
  revised_footnotes: []
