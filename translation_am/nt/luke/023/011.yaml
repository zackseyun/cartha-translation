id: LUK.23.11
reference: Luke 23:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: am
  text: ሄሮድስም ከወታደሮቹ ጋር ናቀው፣ አፌዘበትም። ያማረ ልብስ አልብሶት ወደ ጲላጦስ መልሶ ላከው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: ናቀው
  rationale: ግሱ አንድን ሰው ከንቱ እንደሆነ በመቁጠር መናቅን ያመለክታል፤ «ናቀው» በዘመናዊ አማርኛ አጭር፣ ተፈጥሯዊና ግልጽ ነው።
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: ከወታደሮቹ ጋር
  rationale: በትረካው አውድ στράτευμα ወታደሮችን ወይም ሠራዊትን ሊያመለክት ይችላል፤ «ወታደሮቹ» ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐμπαίξας
  choice: አፌዘበትም
  rationale: ግሱ ማፌዝንና መሳለቅን ያመለክታል፤ ይህ ምርጫ የሕማማት ትረካውን ክብር የጠበቀ የተለመደ አገላለጽ ነው።
- source_word: περιβαλὼν
  choice: አልብሶም
  rationale: ቃሉ ልብስን በአንድ ሰው ላይ ማድረግን ያመለክታል፤ «አልብሶ» ይህን ተግባር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐσθῆτα λαμπρὰν
  choice: ያማረ ልብስ
  rationale: ἐσθής ልብስን ወይም ልብሰ ሥርዓትን፣ λαμπρός ደግሞ ደማቅ፣ ያማረ ወይም የተንቆጠቆጠ የሚል ትርጉም ሊኖረው ይችላል። «ያማረ ልብስ» የተወሰነ የንጉሥ ካባ ነው ሳይል የቃሉን ስፋት ይጠብቃል።
- source_word: ἀνέπεμψεν
  choice: መልሶ ላከው
  rationale: በፍርድ ሂደቱ አውድ ቃሉ ቀደም ወዳለው ባለሥልጣን መልሶ መላክን ያመለክታል።
- source_word: τῷ Πιλάτῳ
  choice: ወደ ጲላጦስ
  rationale: የግል ስሙን በአማርኛ የተለመደውን አጻጻፍ በመከተል ይገልጻል።
theological_decisions:
- issue: በልብሱ አማካይነት የተደረገው የሄሮድስ አሽሙር
  choice: ልብሱን «ያማረ ልብስ» ብሎ በመተርጎም የማስመሰል ክብሩንና አሽሙሩን ሳያብራራ የግሪኩን ክፍትነት መጠበቅ
  alternative: ልብሱን በግልጽ «የንጉሥ ካባ» ብሎ መተርጎም፣ ወይም የእብደትና የቀልድ ምልክት ነው ብሎ መወሰን
  rationale: አውዱ ንቀትንና ማፌዝን በግልጽ ያሳያል፤ ልብሱም የዚያ ማፌዝ ክፍል ሊሆን ይችላል። ሆኖም ግሪኩ ደማቅ ወይም ያማረ ልብስ ከማለት በላይ ምልክታዊ ትርጉሙን አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። «ሄሮድስም» የሚለው ቅጽ δὲ ... καὶ ὁ Ἡρῴδης ያለውን የመደመር ኃይል በተፈጥሯዊ መንገድ ያሳያል።
