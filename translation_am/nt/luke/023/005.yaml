    reason: lexical_alternative
  - marker: b
    text: “ይሁዳ” የይሁዳን ክልል በተለይ ሊያመለክት ወይም በአንዳንድ አውዶች በሰፊው የአይሁድን ምድር ሊያመለክት ይችላል፤ እዚህ ላይ ክሱ የኢየሱስን እንቅስቃሴ ስፋት ያጎላል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “እስከዚህ ስፍራ ድረስ።” ሐረጉ ከገሊላ ጀምሮ በጲላጦስ ፊት እስካሉበት ስፍራ ድረስ መድረሱን ያመለክታል።
    reason: lexical_alternative
