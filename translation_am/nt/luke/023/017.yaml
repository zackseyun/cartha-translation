- source_word: ἀνάγκην … εἶχεν
  choice: ግዴታ ነበረበት
  rationale: ይህ ሐረግ ‘ግዴታ ነበረበት’ ወይም ‘የግድ ነበረበት’ የሚል ፈሊጣዊ ትርጉም አለው። ‘ግዴታ ነበረበት’ በሕግ ወይም በልማድ ምክንያት የነበረውን አስገዳጅነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπολύειν
  choice: ሊፈታላቸው
  rationale: በእስርና በፍርድ አውድ ውስጥ ግሱ አንድን እስረኛ ከእስር መልቀቅን ያመለክታል፤ ‘መፍታት’ ይህን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: κατὰ ἑορτήν
  choice: በበዓሉ ጊዜ
  rationale: በአውዱ የፋሲካን ሕዝባዊና ሃይማኖታዊ በዓል ያመለክታል። ‘በበዓሉ ጊዜ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የግሪኩን የጊዜ ግንኙነት ይጠብቃል።
- source_word: ἕνα
