  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: am
  text: ሄሮድስም ኢየሱስን ባየው ጊዜ እጅግ ደስ አለው፤ ስለ እርሱ ሲሰማ ስለ ነበር[a]፣ ከረጅም ጊዜ ጀምሮ ሊያየው ይፈልግ ነበርና። ደግሞም በእርሱ የሚደረግ አንድ ምልክት[b] ያያል ብሎ ተስፋ ያደርግ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እርሱ ሰምቶ ስለ ነበር።” የግሪኩ የአሁን ጊዜ የግስ ስም ቀጣይ ወይም ተደጋጋሚ መስማትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተአምር።” የግሪኩ ቃል በቀጥታ “ምልክት” ማለት ሲሆን፣ ልዩ ትርጉም ያለውን ተአምራዊ ድርጊት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: እጅግ ደስ አለው
  rationale: የχαίρωን የደስታ ሐሳብና የλίανን አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐξ ἱκανῶν χρόνων
  choice: ከረጅም ጊዜ ጀምሮ
  rationale: የቆይታውን ርዝመት ይጠብቃል፤ ግሪኩ በግልጽ የማይለውን ‘ዓመታት’ አይጨምርም።
- source_word: θέλων ἰδεῖν αὐτόν
  choice: ሊያየው ይፈልግ ነበር
  rationale: ἦν ከተሳቢው θέλων ጋር የሚገልጸውን ቀጣይ ፍላጎት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: ስለ እርሱ ሰምቶ ስለ ነበር
  rationale: διά ከግስ ስም ጋር የሚገልጸውን ምክንያት በግልጽ ያሳያል፤ የአሁን ጊዜው የግስ ስም ቀጣይ ወይም ተደጋጋሚ መስማትን ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: አንዳች ምልክት ለማየት ተስፋ ያደርግ ነበር
  rationale: የἐλπίζωን ቀጣይ ተስፋና የτι σημεῖονን ያልተወሰነ ምልክት በግልጽ ያስተላልፋል።
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: በእርሱ የሚደረግ
  rationale: ὑπό የሚገልጸውን አድራጊነትና γινόμενον ያለውን ተሳቢ ቅርጽ ይጠብቃል።
- source_word: ὁ δὲ Ἡρῴδης
  choice: ሄሮድስም
  rationale: δέ የትረካ ሽግግር እንደሆነ በ‘-ም’ በቀላሉ ተገልጿል፤ በምንጩ የሌለ የጊዜ ቃል አልተጨመረም።
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: ኢየሱስን ባየው ጊዜ
  rationale: የቀደመውን ተሳቢ ድርጊት ከዋናው ግስ ጋር በተፈጥሯዊ የጊዜ አንቀጽ ያገናኛል።
theological_decisions:
- issue: σημεῖον የሚለው ቃል እንደ ‘ምልክት’ ወይም ‘ተአምር’ መተርጎሙ
  choice: ምልክት
  alternative: ተአምር
  rationale: ‘ምልክት’ የግሪኩን ሰፊ ትርጉምና የአመልካችነት ኃይል ይጠብቃል፤ በዐውዱ ተአምራዊ ድርጊት መታሰቡ ግን በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የትረካ ትስስር፣ የቆይታ ገጽታና ‘ምልክት’ የሚለው ሰፊ ትርጉም ተጠብቀዋል።
