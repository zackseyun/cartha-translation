  text: እርሱም በዓመፅና በግድያ ምክንያት ወደ እስር ቤት ተጥሎ የነበረውን[a]፣ እነርሱም ይጠይቁት የነበረውን ሰው[b] ፈታ፤ ኢየሱስን ግን ለፈቃዳቸው አሳልፎ ሰጠ።
  philosophy: optimal-equivalence
