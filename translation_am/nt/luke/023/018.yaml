lexical_decisions:
- source_word: Ἀνέκραγον
  choice: ጮኹ
  rationale: ግሱ ከፍ ባለ ድምፅ መጮኽን ያመለክታል፤ “ጮኹ” በዘመናዊ አማርኛ ተፈጥሯዊና ኃይለኛ አገላለጽ ነው።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የጲላጦስ ንግግር ጋር ያለውን ተቃርኖና የትረካውን መቀየር ያሳያል።
- source_word: παμπληθεὶ
  choice: ሁሉም በአንድነት
  rationale: ቃሉ የሕዝቡን በሙሉ አብሮ መጮኽ ያመለክታል፤ ይህ አተረጓጎም አንድነቱን ያስተላልፋል፣ “በአንድ ድምፅ” ከሚለውም ያነሰ ትርጓሜ ይጨምራል።
- source_word: λέγοντες
  choice: … አሉ
  rationale: የጩኸቱን ይዘት በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አወቃቀር ያስገባል።
- source_word: Αἶρε
  choice: አስወግደው
  rationale: በዚህ አውድ ከፊታቸው እንዲወገድ የሚጠይቅ ትእዛዝ ነው፤ “አስወግደው” የግሪኩን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῦτον
  choice: ይህን ሰው
  rationale: የወንድ ነጠላውን ጠቋሚ ቃልና ወደ ኢየሱስ የሚያመለክተውን ቀጥተኛ ኃይል ይጠብቃል።
- source_word: ἀπόλυσον
  choice: ፍታልን
  rationale: ከእስር ወይም ከጥበቃ ነፃ ማውጣትን በፍርድ አውድ በግልጽ ያሳያል።
- source_word: ἡμῖν
  choice: -ልን
  rationale: ተጠቃሚውን የሚያመለክተው ዳቲቭ በአማርኛው ግስ ውስጥ በተፈጥሯዊ ሁኔታ ተዋሕዷል።
- source_word: τὸν Βαραββᾶν
  choice: በርባንን
  rationale: የግሪኩን የስም ቅርጽ በመደበኛው የአማርኛ መጽሐፍ ቅዱስ አጠራር ያቀርባል፤ የቀጥተኛ ተሳቢ ምልክት -ንም ተጨምሯል።
theological_decisions:
- issue: “Αἶρε” በዚህ አውድ መግደልን በግልጽ ይናገራል ወይስ ማስወገድን?
  choice: “አስወግደው” ተብሎ ተተርጉሟል።
  alternative: “ግደለው” ወይም “ከዚህ ውሰደው”
  rationale: አውዱ ወደ ሞት መወሰድን ሊያመለክት ቢችልም፣ ግሱ ራሱ በቀጥታ “ግደል” አይልም። ስለዚህ የምንጩ ሰፊ ትርጉምና የአውዱ ውጥረት ተጠብቀዋል።
