  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የቀጥተኛው ንግግር ትእዛዛዊ ኃይል፣ የሕዝቡ የጋራ ጩኸትና በኢየሱስና በበርባን መካከል ያለው ተቃርኖ ተጠብቀዋል።
