  text: እነርሱ ግን ሁሉም በአንድነት ጮኹ፤ “ይህን ሰው ከዚህ ውሰደው፤[a] በርባንን ግን ፍታልን!” አሉ።
  philosophy: optimal-equivalence
  footnotes:
