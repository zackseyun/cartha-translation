    text: ወይም፣ “ይህን ሰው አስወግደው!” የግሪኩ ትእዛዝ ይበልጥ አጭር ሆኖ ሊተረጎም ይችላል፤ ነገር ግን ጥያቄያቸው እርሱ ከፊታቸው እንዲወገድ ነው።
