source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: am
  text: ከተሰቀሉት ወንጀለኞች አንዱ እርሱን እየሰደበ፣ “መሲሑ አንተ አይደለህምን?[a] ራስህንም እኛንም አድን!” እንዲህ ይል ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” ግሪክ፦ ὁ χριστός።
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: አንዱ
  rationale: δέ በዚህ ስፍራ ቀላል የትረካ ሽግግርን ወይም ንጽጽርን ያመለክታል፤ በአማርኛ ዐውዱ ይህን ያለ ተጨማሪ አያያዥ በተፈጥሮ ያስተላልፋል።
- source_word: τῶν κρεμασθέντων κακούργων
  choice: ከተሰቀሉት ወንጀለኞች
  rationale: κρεμασθέντων ቃል በቃል ‘ከተሰቀሉት’ ሲሆን፣ በዚህ የመስቀል ዐውድ ተፈጥሯዊ ነው፤ κακούργων ደግሞ በዘመናዊ አማርኛ ‘ወንጀለኞች’ ተብሎ በግልጽ ይተረጎማል።
- source_word: ἐβλασφήμει αὐτόν
  choice: እየሰደበው … ይለው ነበር
  rationale: እዚህ βλασφημέω በኢየሱስ ላይ የተነገረ የስድብና የነቀፋ ንግግር ነው። የግሱ ኢምፐርፌክት አንጻር ድርጊቱ ቀጣይ እንደነበር ‘እየ… ይለው ነበር’ ያሳያል።
- source_word: λέγων
  choice: … ይለው ነበር
  rationale: የንግግር መግቢያውን ከዋናው ግስ ጋር በተፈጥሯዊ የአማርኛ አወቃቀር ያገናኛል።
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός
  choice: መሲሑ አንተ አይደለህምን?
  rationale: οὐχί አዎንታዊ መልስን የሚጠብቅ ወይም የሚያፌዝ ጥያቄ ነው፤ ‘አይደለህምን?’ ይህን ሥነ ንግግራዊ ኃይል ይጠብቃል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: Χριστός እዚህ የማዕረግ ስም ስለሆነ፣ የአይሁድን መሲሐዊ ዐውድ በግልጽ የሚጠብቀው ‘መሲሑ’ ነው።
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: ራስህንም እኛንም አድን
  rationale: σῶσον ከቅርብ ሞት እንዲያድን የተሰጠ ትእዛዝ ሲሆን ‘አድን’ የአሁኑን ማዳንና ሰፊውን የድነት ቃላዊ ግንኙነት ይጠብቃል፤ ሁለቱ ‘-ም’ አገናኞች καίን በተፈጥሯዊ አማርኛ ያቀርባሉ።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ የአፌዝ ጥያቄ Χριστός እንደ ግላዊ ስም ሳይሆን እንደ ማዕረግ ይሠራል። ‘መሲሑ’ ትርጉሙንና የአይሁድን መሲሐዊ ዐውድ ይጠብቃል፤ ትይዩ የተለመደው አጠራር በማስታወሻው ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጣይ ድርጊት ስሜት ‘እየሰደበው … ይለው ነበር’ በሚለው አወቃቀር ተጠብቋል፤ የትረካ ፍሰቱን የሚከብድ ያልተገለጸ የጊዜ አያያዥ አልተጨመረም።
