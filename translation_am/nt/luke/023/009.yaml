  to: በብዙ ቃላት ሲጠይቀው ቆየ[a]፤ እርሱ ግን ምንም አልመለሰለትም።
  rationale: The revision uses one Amharic questioning expression for the one Greek verb, expresses its imperfect/prolonged force with 'ሲጠይቀው ቆየ,' and renders ἐν λόγοις ἱκανοῖς as 'በብዙ ቃላት.' It removes an unwarranted causal connective and repairs the footnote while preserving the lexical ambiguity of λόγοις.
