  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: am
  text: በብዙ ቃላት ሲጠይቀው ቆየ[a]፤ እርሱ ግን ምንም አልመለሰለትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በብዙ ቃላት ጠየቀው” ወይም “ለረጅም ጊዜ ጠየቀው።” የግሪኩ አገላለጽ የተራዘመ የቃል ጥያቄን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: መረመረው
  rationale: የግሱ ያልተፈጸመ ጊዜ ቅርጽ ተደጋጋሚና የቀጠለ ጥያቄን ያመለክታል፤ “መረመረው” በዚህ የፍርድ አውድ ጥያቄ በማቅረብ መጠየቅን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ስለዚህ / ግን
  rationale: የመጀመሪያው δέ የትረካውን ፍሰት በ“ስለዚህ” ያገናኛል፤ ሁለተኛው ደግሞ በሄሮድስ ረጅም ጥያቄና በኢየሱስ ዝምታ መካከል ያለውን ንጽጽር በ“ግን” ያሳያል።
- source_word: ἐν λόγοις ἱκανοῖς
  choice: ብዙ ነገር እየጠየቀ ለረጅም ጊዜ
  rationale: የግሪኩ አገላለጽ ብዙና የተራዘመ የቃል ጥያቄን ያጎላል። ትርጉሙ የቃላቱን ብዛትና የድርጊቱን ቆይታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αὐτὸς
  choice: እርሱ
  rationale: ተውላጠ ስሙ ከሄሮድስ ድርጊት ጋር ያለውን ንጽጽር ጠብቆ የኢየሱስን ምላሽ ያተኩራል።
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: ምንም አልመለሰለትም
  rationale: ይህ አጭርና ቀጥተኛ አገላለጽ ምንም ዓይነት መልስ እንዳልሰጠው የግሪኩን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
