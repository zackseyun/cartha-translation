lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: ፀሐይም ብርሃኗን አጣች
  rationale: ἐκλείπω መጉደልን፣ ማቆምን ወይም ብርሃን ማጣትን ሊያመለክት ይችላል። ይህ አተረጓጎም በዐውዱ ያለውን ጨለማ በተፈጥሯዊ አማርኛ ይገልጣል፤ ክስተቱን ግን በቴክኒክ የፀሐይ ግርዶሽ ብሎ አይወስንም።
- source_word: ἐσχίσθη
  choice: ተቀደደ
  rationale: የጨርቅ መጋረጃ መቀደድን በቀጥታና በተፈጥሯዊ አማርኛ የሚገልጽ ተገብሮ የተሠራ ግስ ነው።
- source_word: δὲ
  choice: -ም
  rationale: δέ እዚህ ቀላል አያያዥ ነው፤ የአማርኛው -ም አያያዥ ያለ ከባድ ተቃርኖ ሐረጎቹን በተፈጥሮ ያገናኛል።
- source_word: τὸ καταπέτασμα
  choice: መጋረጃ
  rationale: καταπέτασμα በቤተ መቅደሱ ውስጥ ያለውን ከፋይ መጋረጃ ያመለክታል። “መጋረጃ” ለዘመናዊ አንባቢ ግልጽና የተለመደ ነው።
- source_word: τοῦ ναοῦ
  choice: የቤተ መቅደሱ
  rationale: ναός በትክክል የመቅደሱን ውስጣዊ ቅዱስ ሕንፃ ሊያመለክት ቢችልም፣ “ቤተ መቅደስ” በአማርኛ የታወቀና በዐውዱ ትክክለኛ ነው።
- source_word: μέσον
  choice: ከመካከሉ
  rationale: ቃሉ መቀደዱ በመካከል መሆኑን ያሳያል። “ከመካከሉ” የግሪኩን ቀጥተኛ አገላለጽ ይጠብቃል፤ “ለሁለት” የሚለውን ውጤት በዋናው ጽሑፍ ላይ አይጨምርም።
