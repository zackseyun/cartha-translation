  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: am
  text: ሕይወቱን[a] ሊያድን የሚፈልግ ሁሉ ያጣታልና፤ ስለ እኔ ሕይወቱን የሚያጣ ግን እርሱ ያድናታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ነፍሱን” ወይም “ራሱን”፤ የግሪኩ ቃል እንደየአውዱ ሕይወት፣ ነፍስ ወይም ራስ ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: የሚፈልግ ሁሉ … ና
  rationale: ὃς … ἂν ያልተወሰነውን አጠቃላይ ሰው፣ θέλῃ ፈቃድን፣ γάρ ደግሞ ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ትስስር ያሳያሉ። በአማርኛ “የሚፈልግ ሁሉ” እና የመጨረሻው “-ና” ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋሉ።
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ሕይወቱን
  rationale: ψυχή እንደየአውዱ ሕይወት፣ ነፍስ ወይም ራስን ሊያመለክት ይችላል። እዚህ ሰው ሕይወቱን ለማቆየት ወይም ስለ ኢየሱስ ሊያጣው ስለሚችልበት የደቀ መዝሙርነት አውድ ስለሆነ “ሕይወት” ቀዳሚውን ትርጉም ይይዛል፤ ሌሎቹ ትርጉሞች በማስታወሻ ተጠብቀዋል።
- source_word: σῶσαι / σώσει
  choice: ሊያድን / ያድናታል
  rationale: በሁለቱም ቦታ “ማዳን” መጠቀም የግሱን ድግግሞሽና የንግግሩን ፓራዶክስ ይጠብቃል።
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ያጣታል / የሚያጣ
  rationale: ἀπόλλυμι በዚህ አውድ “ማጣት” ማለት ነው፤ “ማጥፋት” ሰውየው በራሱ ላይ ቀጥተኛ የጥፋት ድርጊት እንደሚፈጽም ሊያሰማ ይችላል።
- source_word: ἕνεκεν ἐμοῦ
  choice: ስለ እኔ
  rationale: ይህ አገላለጽ በአማርኛ ምክንያትንና የግል ታማኝነትን በአጭሩ ያሳያል፤ እዚህ ትርጉሙ “በእኔ ምክንያት” ነው።
- source_word: οὗτος
  choice: እርሱ
  rationale: οὗτος ሁለተኛውን ሰው በአጽንዖት ይለያል። “እርሱ” ይህን አጽንዖት በተፈጥሯዊና በክብር ቋንቋ ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ፓራዶክሳዊ ንግግር ውስጥ የψυχή ትርጉም
  choice: ሕይወት
  alternative: ነፍስ፤ ራስ
  rationale: የቅርቡ አውድ ራስን መካድንና ስለ ኢየሱስ ሕይወትን ማጣትን ይመለከታል። “ሕይወት” ንግግሩን ወደ ሥጋ ያልሆነች ነፍስ ብቻ ሳያጠብ የአውዱን ኃይል ይይዛል፤ ሰፊው የቃሉ ትርጉም በማስታወሻው ተገልጿል።
- issue: በοὗτος ያለው አጽንዖት
  choice: እርሱ ያድናታል
  alternative: ያድናታል
  rationale: ግልጽ የሆነው “እርሱ” የግሪኩን ጠቋሚ ተውላጠ ስም አጽንዖት ይጠብቃል፤ ልዩ የእምነት ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሁለቱ ክፍሎች ትይዩነት፣ “ማዳን/ማጣት” የሚለው ፓራዶክስና በοὗτος ያለው አጽንዖት ተጠብቀዋል።
