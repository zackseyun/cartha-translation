  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: am
  text: በማግስቱም[a] እነርሱ ከተራራው በወረዱ ጊዜ፣ ብዙ ሕዝብ ተገናኘው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሚቀጥለው ቀን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: -ም
  rationale: ይህ አገላለጽ በዚህ ስፍራ በዋናነት የትረካ ሽግግርን ያመለክታል። በአማርኛ በ«በማግስቱም» ላይ ያለው «-ም» ትረካውን በተፈጥሯዊ ሁኔታ ያያይዛል፤ በግሪኩ የሌለ ግልጽ «አሁን» አይጨምርም።
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: በማግስቱ
  rationale: የጊዜውን ሁኔታ «በሚቀጥለው ቀን» በሚል ተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: κατελθόντων αὐτῶν
  choice: እነርሱ ... በወረዱ ጊዜ
  rationale: የgenitive absolute የአጋጣሚ ዳራን በተፈጥሯዊ የአማርኛ የጊዜ ንዑስ ሐረግ ያቀርባል፤ መውረዳቸው ከዋናው ድርጊት አንጻር የተፈጸመ መሆኑንም ያሳያል።
- source_word: ἀπὸ τοῦ ὄρους
  choice: ከተራራው
  rationale: ὄρος በዚህ ትረካዊ አውድ «ተራራ» ተብሎ በትክክልና በተለመደ ሁኔታ ይተረጎማል። የወሰን ቅጥያው ቀደም ሲል የተጠቀሰውን ተራራ ያመለክታል።
- source_word: συνήντησεν αὐτῷ
  choice: እርሱን ተገናኘው
  rationale: የግሪኩን «አገኘው/ተገናኘው» ትርጉም በቀጥታ ይጠብቃል፤ «ሊቀበለው መጣ» የሚለውን ተጨማሪ የዓላማ ሐሳብ አያስገባም። ነጠላው αὐτῷ የሚያመለክተው ኢየሱስን ብቻ መሆኑ በ«እርሱን» ተጠብቋል።
- source_word: ὄχλος πολύς
  choice: ብዙ ሕዝብ
  rationale: የሕዝቡን ብዛት በዘመናዊና በተለመደ አማርኛ ይገልጻል።
