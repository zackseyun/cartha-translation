source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: am
  text: የማይቀበሏችሁ ሁሉ፣ ከዚያች ከተማ ስትወጡ፣ በእነርሱ ላይ ምስክር እንዲሆን በእግሮቻችሁ ላይ ያለውን ትቢያ አራግፉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: የማይቀበሏችሁ ሁሉ
  rationale: ὅσοι ἄν የሚያሳየውን አጠቃላይና ያልተወሰነ ማጣቀሻ በ«ሁሉ» ያስቀምጣል፤ δέχομαι ደግሞ መልእክተኞቹን መቀበልንና በእንግድነት ማስተናገድን ሊያካትት ይችላል።
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: ከዚያች ከተማ ስትወጡ
  rationale: የአሁን ጊዜ ክፍለ ግስ ከዋናው ትእዛዝ ጋር በአንድ ጊዜ የሚፈጸም ተግባር መሆኑን «ስትወጡ» በተፈጥሯዊ አማርኛ ይገልጣል፤ πόλιςን ሳያስጠብብ «ከተማ» ተብሏል።
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: ከእግሮቻችሁ ላይ ያለውን ትቢያ
  rationale: κονιορτός በመሬት ላይ ያለን ለስላሳ አቧራ ወይም ትቢያ ያመለክታል፤ «ትቢያ» በዚህ ምሳሌያዊ ድርጊት ውስጥ የተለመደና ግልጽ ነው።
- source_word: ἀποτινάσσετε
  choice: አራግፉ
  rationale: አስገዳጅ ትእዛዙ ትቢያውን በመንቀጥቀጥ ማስወገድን ያመለክታል፤ «አራግፉ» አካላዊውንና ምሳሌያዊውን ምስል በአጭር ይይዛል።
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: በእነርሱ ላይ ምስክር እንዲሆን
  rationale: εἰς የዓላማ ወይም የውጤት ኃይልን፣ ἐπί ከተሳቢ ጋር ደግሞ በዚህ አገባብ ተቃራኒ የምስክርነት ኃይልን ያሳያል።
theological_decisions:
- issue: የትቢያ ማራገፉ ምሳሌያዊ ድርጊት ኃይል
  choice: «በእነርሱ ላይ ምስክር እንዲሆን» ተብሎ የማስጠንቀቂያና የፍርድ አገባቡ ተጠብቋል።
  alternative: «ለእነርሱ ምስክር እንዲሆን» የሚለው ከግሪኩ የተቃራኒ ኃይል ያነሰ ገለልተኛ አተረጓጎም።
  rationale: ጥቅሱ ድርጊቱን ገለልተኛ ምልክት ብቻ አያደርገውም፤ ቢሆንም የመጨረሻ ፍርድን በግልጽ ስለማይዘረዝር ከጽሑፉ በላይ አልተስፋፋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ከተማ» የπόλιςን የመጠን ክፍትነት በአማርኛ አጠቃቀም በበቂ ሁኔታ ስለሚይዝ፣ «መንደር» የሚል ጠባብ አማራጭ አልገባም።
