review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of divine necessity, suffering, rejection by the three leadership groups, killing, and third-day resurrection. However, መናቅ primarily conveys being despised rather than the institutional repudiation expressed by ἀποδοκιμασθῆναι.
  naturalness: The infinitival chain is natural and appropriately formal modern Amharic. Replacing መናቅ with ውድቅ መደረግ gives the intended sense clearly without making the sentence unnatural.
  terminology: የሰው ልጅ, ሽማግሌዎች, የካህናት አለቆች, and ጸሐፍት are suitable established renderings. The main text may retain መነሣት as idiomatic resurrection language, provided the note accurately identifies the Greek passive without supplying an unstated agent.
  issues:
  - severity: medium
    issue: መናቅ for ἀποδοκιμασθῆναι
    rationale: መናቅ usually means “to be despised/scorned.” The Greek denotes rejection or repudiation after assessment, especially by the named authorities. ውድቅ መደረግ better preserves this sense.
  - severity: medium
    issue: Footnote's proposed literal passive expression
    rationale: “እንዲነሣ መደረግ” is not a sound or natural Amharic rendering of the Greek passive infinitive and can suggest an artificial causative construction. The note should simply state that the Greek verb is passive, “to be raised,” while leaving the agent unstated.
