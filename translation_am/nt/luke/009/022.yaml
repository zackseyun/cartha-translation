id: LUK.9.22
reference: Luke 9:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: am
  text: እንዲህ አለ፦ “የሰው ልጅ ብዙ መከራ መቀበል፣ በሽማግሌዎች፣ በካህናት አለቆችና በጸሐፍት ውድቅ መደረግ፣ መገደል፣ በሦስተኛውም ቀን መነሣት ይገባዋል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ “መነሣት” የሚለውን ግስ በተገብሮ ቅርጽ ያቀርባል፤ በቃል በቃል፣ “እንዲነሣ።”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: እንዲህ አለ
  rationale: የአኦሪስት አሳታፊው የኢየሱስን ቀጥተኛ ንግግር ያስገባል፤ በአማርኛ የተፈጥሮ ትረካ አገላለጽ ሆኖ ከቀደመው ዐውድ ጋር ይያያዛል።
- source_word: Δεῖ
  choice: ይገባዋል
  rationale: በአማርኛ ተፈጥሯዊ በሆነ መንገድ አስፈላጊነትን ይገልጣል፤ በዐውዱ ያለውን መለኮታዊ ዕቅድ በግልጽ ያልተጠቀሰ ተዋናይ ሳይጨምር ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የወንጌላትን የተለመደ ማዕረግና ከዳንኤል ጋር ያለውን ጽሑፋዊ ትስስር ይጠብቃል።
- source_word: πολλὰ παθεῖν
  choice: ብዙ መከራ መቀበል
  rationale: የπολλὰን ስፋት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ከቀጥተኛው ‘ብዙ ነገር መሠቃየት’ ይልቅ ንባቡ ግልጽ ነው።
- source_word: ἀποδοκιμασθῆναι
  choice: መናቅ
  rationale: በመሪዎቹ ከምርመራ በኋላ ብቁ አይደለም ተብሎ መጣልን በአጭርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: በሽማግሌዎች፣ በካህናት አለቆችና በጸሐፍት
  rationale: ከተገብሮ ግስ ጋር ἀπό ድርጊቱን የፈጸሙትን ያመለክታል፤ ‘በ’ ይህን በአማርኛ በግልጽ ያሳያል።
- source_word: ἀποκτανθῆναι
  choice: መገደል
  rationale: የግሪኩን ተገብሮ ቅርጽ በቀጥታና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: በሦስተኛው ቀን
  rationale: የጊዜውን ዳቲቭ በመደበኛው የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἐγερθῆναι
  choice: መነሣት
  rationale: በአማርኛ ‘መነሣት’ ለትንሣኤ የተለመደ ነው፤ ሆኖም የግሪኩ ቅርጽ ተገብሮ መሆኑን በማስታወሻ ግልጽ ተደርጓል።
theological_decisions:
- issue: የትንሣኤው ግስ ተገብሮ ቅርጽ
  choice: መነሣት፣ ከማስታወሻ ጋር
  alternative: እንዲነሣ መደረግ / መነሣትን በተገብሮ መግለጽ
  rationale: ‘እንዲነሣ መደረግ’ ግሪኩን ቅርጽ ቢያሳይም በአማርኛ ከባድና ሰው ሠራሽ ይሰማል። ዋናው ጽሑፍ የተለመደውን ትንሣኤያዊ አገላለጽ ይጠቀማል፤ ማስታወሻው ግን ድርጊቱ በሌላ አድራጊ እንደሚፈጸም የሚያመለክተውን ተገብሮ ቅርጽ ይጠብቃል።
- issue: የΔεῖ አስፈላጊነት
  choice: ይገባዋል
  alternative: የግድ ነው / አስፈላጊ ነው
  rationale: የመከራው፣ የሞቱና የትንሣኤው አስፈላጊነት በእግዚአብሔር የማዳን ዕቅድ ውስጥ መሆኑን ያመለክታል፤ ጽሑፉ በግልጽ ያልጠቀሰውን አድራጊ ወይም የአስፈላጊነቱን ዘዴ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የተከታታይ ኢንፊኒቲቭ አወቃቀሩ የግሪኩን የግዴታ ሰንሰለት ይጠብቃል፤ ‘ጸሐፍት’ እና ‘ካህናት አለቆች’ የቡድኖቹን ታሪካዊ ስያሜ ያቆያሉ።
