base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: am
  text: 'ዮሐንስም መልሶ፣ “ጌታ ሆይ፣ አንድ ሰው በስምህ አጋንንትን ሲያወጣ አየን፤ ከእኛ ጋር ስለማይከተልም[a] ልንከለክለው ሞከርን” አለ።


    [a] ወይም፣ “እኛን ስለማይከተል።” ግሪክኛው ቃል በቃል “ከእኛ ጋር” ይላል፤ ይህም ሰውየው ከደቀ መዛሙርቱ ቡድን ጋር አለመሆኑን የሚያጎላ ሊሆን ይችላል።'
