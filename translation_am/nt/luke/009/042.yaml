  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: am
  text: እርሱም ገና እየቀረበ ሳለ፣ ጋኔኑ ወደ መሬት ጣለውና ክፉኛ አንፈራገጠው። ኢየሱስ ግን ርኩሱን መንፈስ ገሠጸው፣ ልጁንም ፈውሶ ለአባቱ መልሶ ሰጠው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ አባቱ መለሰው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: እርሱም ገና እየቀረበ ሳለ
  rationale: የግስ አገባቡ ሌላው ድርጊት በሚፈጸምበት ጊዜ ልጁ ወደ ኢየሱስ መቅረቡን እንደቀጠለ ያሳያል፤ ‘ገና ... ሳለ’ ይህን የጊዜ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔρρηξεν αὐτὸν
  choice: ወደ መሬት ጣለው
  rationale: ῥήγνυμι በዚህ አውድ ጋኔኑ ልጁን በኃይል መጣሉን ያመለክታል፤ ትርጉሙ የድርጊቱን ኃይለኛነትና አቅጣጫ ግልጽ ያደርጋል።
- source_word: τὸ δαιμόνιον
  choice: ጋኔኑ
  rationale: δαιμόνιον በግል የሚሠራ ክፉ መንፈሳዊ ፍጡርን በቀጥታ ይጠቅሳል፤ ‘ጋኔን’ በዘመናዊ አማርኛ የተለመደና ግልጽ ቃል ነው።
- source_word: συνεσπάραξεν
  choice: ክፉኛ አንፈራገጠው
  rationale: ግሱ ኃይለኛ መንፈራገጥን ወይም መንቀጥቀጥን ያመለክታል፤ ይህ ምርጫ በአማርኛ ተፈጥሯዊ ሆኖ ኃይለኛነቱን ይጠብቃል።
- source_word: ἐπετίμησεν
  choice: ገሠጸው
  rationale: ቃሉ በሥልጣን የተሰጠ ጠንካራ ተግሣጽን ያመለክታል፤ ‘ገሠጸው’ በወንጌላት አውድ የተለመደና ክብር ያለው አገላለጽ ነው።
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ርኩሱን መንፈስ
  rationale: ‘ርኩስ’ የἀκάθαρτοςን የሥነ ምግብና የሥርዓት ንጽሕና ተቃራኒ ፍቺ ይጠብቃል፤ ሐረጉም ከጋኔን ጋር ተመሳሳይ ጠቃሽ ሲኖረው የግሪኩን የቃላት ልዩነት ያቆያል።
- source_word: ἰάσατο τὸν παῖδα
  choice: ልጁንም ፈውሶ
  rationale: ἰάομαι ፈውስን በግልጽ ይገልጣል፤ παῖς በዚህ አውድ ሕፃን/ወንድ ልጅን ይጠቅሳል፣ ‘ልጁ’ም ዕድሜውን ከጽሑፉ በላይ ሳይወስን ተፈጥሯዊ ነው።
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: ለአባቱ መልሶ ሰጠው
  rationale: ἀποδίδωμι የመመለስንና መልሶ የመስጠትን ሐሳብ ይይዛል፤ ይህ ምርጫ ከነፃ መውጣቱ በኋላ ልጁ ለአባቱ መመለሱን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የጋኔናዊ ሥቃይ ቃላት አተረጓጎም
  choice: δαιμόνιονን ‘ጋኔን’፣ πνεῦμα ἀκάθαρτονን ‘ርኩስ መንፈስ’ ብሎ እንደ ግላዊ ክፉ መንፈሳዊ አካል መተርጎም
  alternative: እንደ ‘ክፉ ኃይል’ ወይም እንደ ሥነ አእምሮ ሕመም ብቻ አድርጎ መተርጎም
  rationale: የግሪኩ ጽሑፍ በልጁ ላይ የሚሠራውን ጋኔን እንደ ግላዊ ወኪል ያቀርባል፣ ቀጥሎም ‘ርኩስ መንፈስ’ ይለዋል። በተመሳሳይ ጊዜ ኢየሱስ ልጁን እንደፈወሰው ይናገራል፤ ስለዚህ ትርጉሙ ከጋኔን ነፃ መውጣትንና ፈውስን ሁለቱንም ሳያጣምም ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የእንግሊዝኛው የእግር ማስታወሻ በትርጉሙ ፍቺ መሠረት ከἀπέδωκεν ጋር ስለሚዛመድ፣ ምልክቱ ከመጨረሻው ሐረግ በኋላ ተቀምጧል።
