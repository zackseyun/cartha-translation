base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: am
  text: እርሱም፣ “እናንተስ እኔ ማን እንደሆንሁ ትላላችሁ?” አላቸው። ጴጥሮስም፣ “የእግዚአብሔር መሲሕ[a] ነህ” ብሎ መለሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “የእግዚአብሔር ክርስቶስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: እናንተስ
  rationale: ግልጽና አጽንዖት ያለውን የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም ከቀደመው ንግግር ጋር በሚያነጻጽር ተፈጥሯዊ የአማርኛ ቅርጽ ያሳያል።
- source_word: τίνα με λέγετε εἶναι
  choice: እኔን ማን ነው ትላላችሁ?
  rationale: የλέγετε እና የεἶναι ቀጥተኛ ሐሳብ በዘመናዊና ተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: ἀποκριθεὶς εἶπεν
  choice: ብሎ መለሰ
  rationale: የግሪኩን ተከታታይ የመመለስና የመናገር አገላለጽ ያልከበደ ተፈጥሯዊ አማርኛ ያደርገዋል።
- source_word: χριστός
  choice: መሲሕ
  rationale: እዚህ ቃሉ የኢየሱስን ማንነት የሚገልጽ መጠሪያ ስለሆነ፣ በአማርኛ የተለመደው መሲሐዊ መጠሪያ «መሲሕ» ተመርጧል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት/ዝምድና ቅርጽ በቀጥታና በተለመደ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: δέ
  choice: -ም / -ስ
  rationale: የመጀመሪያው δέ እንደ ቀላል የንግግር ማገናኛ «-ም»፣ በጥያቄው ያለው ንጽጽር ደግሞ «እናንተስ» በሚለው «-ስ» ተገልጿል።
theological_decisions:
- issue: በጴጥሮስ እምነት አዋጅ ውስጥ χριστός የሚተረጎምበት መንገድ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: χριστός በዚህ ስፍራ እንደ ግላዊ ስም ሳይሆን ከእስራኤል ተስፋ ጋር የተያያዘ መጠሪያ ሆኖ ይሠራል። «መሲሕ» ይህን ተግባር ያሳያል፤ ባህላዊው «ክርስቶስ» ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እናንተስ» የግሪኩን አጽንዖትና ንጽጽር በአጭር ተፈጥሯዊ ቅርጽ ያሳያል።
