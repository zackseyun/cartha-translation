  terminology: «መሲሕ» appropriately renders χριστός as a title in accordance with the supplied translation policy. «የእግዚአብሔር» preserves the genitive relation of τοῦ θεοῦ. The lexical-alternative footnote for «ክርስቶስ» is appropriate.
