  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: am
  text: ነገር ግን እውነት እላችኋለሁ፤ እዚህ ከቆሙት[a] አንዳንዶቹ የእግዚአብሔርን መንግሥት እስኪያዩ ድረስ ፈጽሞ ሞትን አይቀምሱም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «እዚህ ከቆሙት መካከል»።
    reason: lexical_alternative
  - marker: b
    text: «ሞትን መቅመስ» ማለት «ሞትን መለማመድ» ወይም «መሞት» ማለት የሆነ ፈሊጣዊ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: ነገር ግን እውነት እላችኋለሁ
  rationale: δέ ያለውን የንግግር ሽግግር «ነገር ግን» በማለት ያሳያል፤ ἀληθῶς ደግሞ እንደ ተውሳከ ግስ «እውነት» ተተርጉሟል።
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: እዚህ ከቆሙት አንዳንዶቹ
  rationale: የክፍል አመልካች የግሪክ አገባብን በተፈጥሯዊ አማርኛ «ከቆሙት አንዳንዶቹ» ብሎ ያቀርባል፤ αὐτοῦ በዐውዱ የቦታ አመልካች ስለሆነ «እዚህ» ተብሏል።
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: ፈጽሞ ሞትን አይቀምሱም
  rationale: οὐ μή የሚያሳየውን ጠንካራ እምቢታ «ፈጽሞ ... አይ...» ያስተላልፋል፤ «ሞትን መቅመስ» የሚለው ምስላዊ አነጋገርም ሳይደበዝዝ ተጠብቋል።
- source_word: ἕως ἂν ἴδωσιν
  choice: እስኪያዩ ድረስ
  rationale: ወደፊት የሚፈጸም ድንበርን የሚገልጠውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: βασιλεία ያለውን የንግሥና አገዛዝና የመንግሥት ስፋት ሳያጠብ «መንግሥት» በሚለው የተለመደ አገላለጽ ተተርጉሟል።
theological_decisions:
- issue: «የእግዚአብሔርን መንግሥት ማየት» በዐውዱ የሚያመለክተው
  choice: ሐረጉን ያለ ትርጓሜያዊ ማስፋፊያ እንዳለ ማቆየት
  alternative: የክብር መለወጡን፣ ትንሣኤና ዕርገትን፣ የኢየሩሳሌምን ጥፋት ወይም የቤተ ክርስቲያንን መስፋፋት በግልጽ መጥቀስ
  rationale: ሐረጉ በትርጓሜ ታሪክ ውስጥ በተለያዩ መንገዶች ተረድቷል። ትርጉሙ አንዱን የፍጻሜ ዘመን አተያይ እንዳይጭንና የጽሑፉን ክፍት ትርጉም እንዲጠብቅ፣ የግሪኩ ሐረግ ያለ ማብራሪያ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሞትን አይቀምሱም» የሚለው መጽሐፍ ቅዱሳዊ ምስል ለአማርኛ አንባቢ የሚገባ በመሆኑ ተጠብቋል።
