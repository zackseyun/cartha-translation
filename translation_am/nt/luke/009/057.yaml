base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: am
  text: በመንገድ ላይ ሲሄዱ፣ አንድ ሰው፣ “ወዴትም ብትሄድ[a] እከተልሃለሁ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፦ «ወዴትም ልትሄድ ትችላለህ» ወይም «ወዴትም ብትሄድ ከዚያ ብትለይ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: ሲሄዱ
  rationale: የግሪኩ ጄኒቲቭ አብሶሉት እና የአሁን ጊዜ ተሳቢ ቅርጽ ከዋናው ድርጊት ጋር በአንድ ጊዜ የቀጠለ እንቅስቃሴን ያሳያል፤ “ሲሄዱ” ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ
  rationale: ተጨባጭ የጉዞ ስፍራውን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ በሉቃስ ያለውን የጉዞ አውድም አያጠፋም።
- source_word: εἶπέν τις
  choice: አንድ ሰው … አለው
  rationale: τις ያልተወሰነ ሰውን ያመለክታል። “አንድ ሰው” ጾታን ሳይጨምር ይህን ያስተላልፋል።
- source_word: πρὸς αὐτόν
  choice: አለው
  rationale: ከንግግር ግስ ጋር ያለው πρός በአማርኛ የተናገረለትን ተቀባይ በግሱ ውስጥ በ“-ው” ቅጥያ በተፈጥሯዊነት ይገልጣል።
- source_word: Ἀκολουθήσω σοι
  choice: እከተልሃለሁ
  rationale: የወደፊት ጊዜ አመልካች ቅርጹ የተናጋሪውን ውሳኔና ቃል ያሳያል። “እከተልሃለሁ” አካላዊ መከተልንም የደቀ መዝሙርነት ፍቺንም ሳይፈታ ይጠብቃል።
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: ወደምትሄድበት ሁሉ
  rationale: ὅπου ከἐάν እና ከሰብጅንክቲቭ ጋር ያልተወሰነውን “የትም/ወደምትሄድበት ሁሉ” ፍቺ ይሰጣል። ἀπέρχομαι በቃል ደረጃ “መሄድ/ከዚያ መሄድ” ሊሆን ቢችልም፣ በዚህ አውድ “መሄድ” ተፈጥሯዊ ነው።
theological_decisions:
- issue: ἀκολουθέω የደቀ መዝሙርነት ጥልቅ ፍቺ መኖሩ
  choice: እከተልሃለሁ
  alternative: ደቀ መዝሙርህ እሆናለሁ
  rationale: በሉቃስ አውድ ግሱ የደቀ መዝሙርነት ፍቺ ቢኖረውም፣ “ደቀ መዝሙርህ እሆናለሁ” የሚለው ትርጓሜ የግሱን ቀጥተኛ የመከተል ምስል ያጠፋል። “እከተልሃለሁ” ሁለቱንም ድምፆች ይጠብቃል።
