  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉንም ለምግብ ተደግፈው እንዲመገቡ አደረጉ።” የግሪክኛው ግስ ሰዎችን ለምግብ ማስቀመጥን ወይም ማደራጀትን ያመለክታል፤ በዚያን ዘመን ብዙ ጊዜ ተደግፈው ይመገቡ ነበር።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የቀደመውን ትእዛዝ ከደቀ መዛሙርቱ አፈጻጸም ጋር በተፈጥሯዊ የአማርኛ ትረካ ያያይዛል፤ በግሱ ውስጥ ያለውን የብዙ ቁጥር ባለቤትም ግልጽ ያደርጋል።
- source_word: ἐποίησαν οὕτως
  choice: እንዲሁ አደረጉ
  rationale: ወደ ቀደመው የኢየሱስ ትእዛዝ የሚመለሰውን ‘በዚህ መንገድ አደረጉ’ የሚለውን ሐሳብ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: καὶ
  choice: ፤
  rationale: ሁለተኛውን ድርጊት ከመጀመሪያው ጋር የሚያስተሳስረው ቀላል ትረካዊ ቅደም ተከተል በአማርኛ በሰረዝ ምልክት ተፈጥሯዊ ሆኖ ቀርቧል።
- source_word: κατέκλιναν
  choice: እንዲቀመጡ አደረጉ
  rationale: ግሱ ሰዎችን ለምግብ ማስቀመጥ ወይም ማስተኛት የሚያመለክት አስደራጊ ትርጉም አለው። ይህ ምርጫ አስደራጊነቱን ጠብቆ ለዘመናዊ አንባቢ የድርጊቱን ዓላማ በግልጽ ያቀርባል።
- source_word: ἅπαντας
  choice: ሁሉንም
  rationale: ተሳታፊዎቹ አንድም ሳይቀር ሁሉ እንደተደራጁ የሚገልጠውን ፍጹም አጠቃላይነት ይጠብቃል።
