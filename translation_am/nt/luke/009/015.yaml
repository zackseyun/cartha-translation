  rationale: The revision replaces the periphrastic causative with the natural Amharic causative አስቀመጡ, preserving the source verb's transitive arrangement of all the people. The footnote has been recast so that the reclining alternative is intelligible specifically as a dining posture, without making that historical posture the sole meaning of the main text.
