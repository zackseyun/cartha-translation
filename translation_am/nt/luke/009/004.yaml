lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: ወደምትገቡበትም ቤት ሁሉ
  rationale: The indefinite relative construction is naturally expressed in Amharic with ሁሉ, conveying ‘whatever house’ without narrowing the reference.
- source_word: ἐκεῖ μένετε
  choice: በዚያው ቆዩ
  rationale: በዚያው preserves the emphatic sense of remaining in that same place, while ቆዩ is clear and idiomatic.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: ከዚያም ውጡ
  rationale: This directly renders departure from that location and preserves the concise imperative force.
