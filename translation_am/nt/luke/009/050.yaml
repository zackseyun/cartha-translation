  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “አትከልክሉት፤ በእናንተ ላይ የማይቃወም ሁሉ ከእናንተ ወገን ነው” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: ኢየሱስ ግን ... አለው
  rationale: δέ ከቀደመው የዮሐንስ ንግግር ጋር ያለውን መጠነኛ ተቃርኖ በተፈጥሯዊው «ግን» ያሳያል፤ «አለው» ደግሞ πρὸς αὐτόν የሚያመለክተውን ነጠላ ተቀባይ ይጠብቃል።
- source_word: Μὴ κωλύετε
  choice: አትከልክሉት
  rationale: የብዙ ሰዎችን ትእዛዝ ቅርጽ ይጠብቃል፤ የተውላጠ ስም ቅጥያውም እንዳይከለከል የተባለውን ሰው በግልጽ ያመለክታል። κωλύω በዚህ አውድ «መከልከል/ማገድ» ማለት ነው።
- source_word: ὃς γὰρ οὐκ ἔστιν καθ’ ὑμῶν
  choice: በእናንተ ላይ ያልሆነ ሁሉ
  rationale: ὃς የተወሰነውን ሰው ብቻ ሳይሆን አጠቃላይ መርሕንም ሊገልጥ ስለሚችል «... ሁሉ» የሚለው ቅርጽ ይህን ስፋት ይጠብቃል። κατά ከወገን ተቃውሞን በተፈጥሯዊው «በ... ላይ» ያሳያል።
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: ከእናንተ ጋር ነው
  rationale: ὑπέρ እዚህ ድጋፍን ወይም ከአንድ ወገን መቆምን ያመለክታል። «ከእናንተ ጋር» በዘመናዊ አማርኛ የወገንተኝነትን ሐሳብ በግልጽ ያቀርባል።
theological_decisions:
- issue: የኢየሱስ ንግግር ወሰን
  choice: ንግግሩን «... ያልሆነ ሁሉ» በሚል አጠቃላይ መርሕ መልክ ማቅረብ
  alternative: «በእናንተ ላይ ያልሆነው ሰው» በማለት በአንድ በተወሰነ ሰው ላይ ማተኮር
  rationale: ὃς በቅርቡ የተጠቀሰውን ሰው ሊያመለክት ቢችልም አጠቃላይ እውነትንም የመግለጥ ኃይል አለው። ትርጉሙ ይህን ሰፊ ኃይል ይጠብቃል፤ ተጨማሪ የእምነት ትርጓሜ አያስገባም።
- issue: የሁለተኛ መደብ ብዙ ቁጥር
  choice: ሁለቱንም ὑμῶν በ«እናንተ» ብዙ ቁጥር መተርጎም
  alternative: ንግግሩን ወደ «እኛ» በመቀየር ኢየሱስን ከደቀ መዛሙርቱ ጋር ማካተት
  rationale: SBLGNT በሁለቱም ቦታ ሁለተኛ መደብ ብዙ ቁጥር ὑμῶν ይዟል። «እናንተ» ይህን የጽሑፍ ማስረጃ ያለ ማስተካከያ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አትከልክሉት» የግሪኩን ብዙ ቁጥር ትእዛዝ በተፈጥሯዊ ሁኔታ ይጠብቃል። የሕትመት ረቂቁ የግሪኩን ሁለተኛ መደብ ብዙ ቁጥር በግልጽ ጠብቋል።
