  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: am
  text: ሰው ዓለምን ሁሉ ቢያተርፍ፣ ራሱን[a] ግን ቢያጣ ወይም ቢያሳጣ፣ ምን ይጠቅመዋል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ሕይወቱን» ወይም «ነፍሱን»፤ የግሪኩ ቃል በቀጥታ «ራሱን» ይላል። ጽሑፉ በተለምዶ «ነፍስ» ወይም «ሕይወት» የሚለውን ቃል ሳይሆን መልሶ አመልካች ተውላጠ ስም ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: ምን ይጠቅመዋል?
  rationale: የጥቅምን ወይም የትርፍን ዋጋ የሚጠይቀውን አጽንዖታዊ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩ γὰρ አስረጂ ኃይል በጥያቄው ከቀደመው ንግግር ጋር ባለው ግንኙነት ይገለጣል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በዚህ ስፍራ ቃሉ ወንድና ሴትን በአጠቃላይ የሚወክል ሲሆን፣ «ሰው» ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: ዓለምን ሁሉ ቢያተርፍ
  rationale: የአዮሪስት ተሳቢውን መላምታዊ ሁኔታ በ«ቢ-» አወቃቀር ያቀርባል፤ «ዓለምን ሁሉ» የጽሑፉን ሙሉነት ይጠብቃል።
- source_word: ἑαυτόν
  choice: ራሱን
  rationale: ግሪኩ የተጠቀመው መልሶ አመልካች ተውላጠ ስም እንጂ ψυχή አይደለም፤ «ራሱን» የሰውየውን ሙሉ ማንነት ሳያጠብ ያስተላልፋል።
- source_word: ἀπολέσας
  choice: ቢያጣ
  rationale: ራስን ማጣትን የሚገልጸውን ቀጥተኛ እና ተፈጥሯዊ አማርኛ ይጠቀማል።
- source_word: ἢ ζημιωθείς
  choice: ወይም ጉዳት ቢደርስበት
  rationale: «ወይም» የἢን አማራጭ ግንኙነት ይጠብቃል፤ የζημιωθείςን ተደራጊ አወቃቀርና ጉዳት መቀበል የሚለውን ልዩ ገጽታ ይገልጣል።
theological_decisions:
- issue: ἑαυτόν ከሰው መዳረሻና ማንነት ጋር ያለው ትርጉም
  choice: ራሱን
  alternative: ነፍሱን ወይም ሕይወቱን
  rationale: ምንጩ ψυχή ሳይሆን መልሶ አመልካች ተውላጠ ስም ይጠቀማል። ስለዚህ «ራሱን» ሰውን ወደ ኢ-ቁሳዊ ነፍስ ወይም ወደ ምድራዊ ሕይወት ብቻ ሳያጠብ የጽሑፉን ሰፊ እና ውጥረት ያለበት አገላለጽ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለአብዛኛው አማርኛ አንባቢ ግልጽ የሆነ የንግግር ዘይቤ ይጠቀማል። የተቃርኖውን ኃይል ለማጉላት «ግን» ተጠብቋል፤ ሁለቱ የኪሳራ አገላለጾችም አንድ ሳይደረጉ ተለይተው ቀርበዋል።
