id: LUK.9.39
reference: Luke 9:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: am
  text: እነሆ፣[a] አንድ መንፈስ ይይዘዋል፤ በድንገትም ይጮኻል። አረፋ እያወጣ ይንፈራገጣል፤ መንፈሱም እያደቀቀው በእጅጉ ችግር ብቻ ከእርሱ ይለያል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ርኩስ መንፈስ” ወይም “አንድ ጋኔን”፤ እዚህ ያለው የግሪክ ጽሑፍ “መንፈስ” ብቻ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆም
  rationale: የአባቱን ሕያውና አጽንዖት ያለው ትረካ የሚያስተዋውቅ የንግግር ምልክት ሆኖ ተተርጉሟል።
- source_word: πνεῦμα
  choice: አንድ መንፈስ
  rationale: ግሪኩ በዚህ ስፍራ ‘ርኩስ’ የሚል ቅጽል ወይም ‘ጋኔን’ የሚል ስም ሳይጨምር πνεῦμα ብቻ ይላል፤ ስለዚህ የምንጩ ያልተወሰነነት ተጠብቋል።
- source_word: λαμβάνει
  choice: ይይዘዋል
  rationale: መንፈሱ ልጁን በኃይል እንደሚቆጣጠረው በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξαίφνης
  choice: በድንገት
  rationale: ድርጊቱ በድንገት መከሰቱን በግልጽ ይገልጣል።
- source_word: κράζει
  choice: ይጮኻል
  rationale: በግሪኩ የተረዳው ባለቤት ልጁ ነው፤ ‘መንፈሱ ያስጮኸዋል’ ብሎ ከምንጩ በላይ ምክንያታዊ ግንኙነት አልተጨመረም።
- source_word: σπαράσσει
  choice: ያንፈራግጠዋል
  rationale: ቃሉ በዚህ አውድ የሚያመለክተውን ኃይለኛ የሰውነት መንፈራገጥ በዘመናዊና ተረድቶ በሚታወቅ አማርኛ ያስተላልፋል።
- source_word: μετὰ ἀφροῦ
  choice: አረፋ እያስደፈቀው
  rationale: መንፈራገጡ ከአፍ አረፋ መውጣት ጋር እንደሚከሰት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μόγις
  choice: በጭንቅ
  rationale: መንፈሱ የሚለቀው በችግር ወይም እጅግ አስቸጋሪ ሆኖ መሆኑን ያሳያል፤ ቃሉ ሊያመለክተው የሚችለውን እምብዛም አለመልቀቅም አያስወግድም።
- source_word: ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: ከእርሱ የሚለቀው
  rationale: መንፈሱ ከልጁ መለየቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συντρῖβον αὐτόν
  choice: እየጎዳው
  rationale: ተካፋይ ግሱ መንፈሱ በሚለቅበት ጊዜ ከባድ ጉዳት እንደሚያደርስበት ያሳያል፤ ‘ይሰባብረዋል’ የሚለውን ከልክ በላይ ቃል በቃል አገላለጽ ያስወግዳል።
theological_decisions:
- issue: πνεῦμαን በዋናው ጽሑፍ በግልጽ ጋኔን ወይም ርኩስ መንፈስ ብሎ መለየት
  choice: አንድ መንፈስ
  alternative: ርኩስ መንፈስ፤ ጋኔን
  rationale: ሰፊው ዐውድ ጠላት የሆነ መንፈሳዊ ፍጡርን ቢያመለክትም፣ ይህ ቁጥር πνεῦμα ብቻ ይላል። ትርጉሙ ከምንጩ ይበልጥ የተወሰነ መለያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ፈጣንና ተከታታይ ትረካ በአጭር ሐረጎች ተጠብቋል።
