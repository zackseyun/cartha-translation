- from: እነሆም፣[a] አንድ መንፈስ ይይዘዋል፤ በድንገትም ይጮኻል። አረፋ እያስደፈቀው ያንፈራግጠዋል፤ እየጎዳውም ከእርሱ የሚለቀው በጭንቅ ነው።
  to: እነሆ፣[a] አንድ መንፈስ ይይዘዋል፤ በድንገትም ይጮኻል። አረፋ እያወጣ ይንፈራገጣል፤ መንፈሱም እያደቀቀው በእጅጉ ችግር ብቻ ከእርሱ ይለያል።
