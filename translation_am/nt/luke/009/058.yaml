id: LUK.9.58
reference: Luke 9:58
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: am
  text: ኢየሱስም፣ “ቀበሮዎች ጉድጓዶች አሏቸው፤ የሰማይ ወፎችም ጎጆዎች አሏቸው፤ የሰው ልጅ[a] ግን ራሱን የሚያሳርፍበት ስፍራ የለውም” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰው ልጅ” ኢየሱስ ራሱን የሚጠራበት መጠሪያ ሲሆን፣ ዳንኤል 7፥13–14ን ሊያስተጋባ ይችላል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: ቀበሮዎች
  rationale: የግሪኩን ቀጥተኛ የእንስሳ ስም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: φωλεοὺς
  choice: ጉድጓድ
  rationale: የእንስሳ መደበቂያን ወይም መኖሪያን ያመለክታል፤ ለቀበሮዎችም ተፈጥሯዊ አገላለጽ ነው።
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎች
  rationale: የግሪኩን ‘የሰማይ ወፎች’ አገላለጽ በቅርብና በተለመደ አማርኛ ይጠብቃል።
- source_word: κατασκηνώσεις
  choice: መስፈሪያ
  rationale: ቃሉ የማረፊያን ወይም የመቀመጫን ስፍራ ያመለክታል፤ ‘መስፈሪያ’ ከ‘ጎጆ’ ይልቅ ሰፊውን የግሪክ ትርጉም ይጠብቃል።
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በአማርኛ የተለመደውን የኢየሱስ ራስ-መጠሪያ ጠብቆ፣ ዳንኤል 7፥13-14ን ሊያስተጋባ የሚችለውን የማዕረግ ኃይል አያጠፋም።
- source_word: οὐκ ἔχει ποῦ
  choice: ስፍራ የለውም
  rationale: ቃል በቃል ‘የት ... የለውም’ የሚለውን አሉታዊ ፈሊጥ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: ራሱን የሚያሳርፍበት
  rationale: የማረፊያ ወይም የመኝታ ስፍራ አለመኖርን የሚገልጠውን ተጨባጭ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: በእንስሳቱ መጠለያ መኖርና በሰው ልጅ መጠለያ አለመኖር መካከል ያለውን ንጽጽር ግልጽ ያደርጋል።
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም ... አለው
  rationale: የግሪኩን መደበኛ የትረካ መግቢያ በአማርኛ ተፈጥሯዊ የንግግር አወቃቀር ያቀርባል።
theological_decisions:
- issue: የኢየሱስ ራስ-መጠሪያ υἱὸς τοῦ ἀνθρώπου አተረጓጎም
  choice: የሰው ልጅ
  alternative: ሰብዓዊው
  rationale: ቃሉን በትርጓሜ ከመተካት ይልቅ በታሪክ የታወቀውን ማዕረግ ይጠብቃል፤ የቃል ትርጉሙንና ሊኖረው የሚችለውን መሲሐዊና ራእያዊ አስተጋባ ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ንጽጽርና ተጨባጭ ምስል ተጠብቋል፤ ‘መስፈሪያ’ የκατασκηνώσειςን ሰፊ ትርጉም ለመጠበቅ ተመርጧል።
