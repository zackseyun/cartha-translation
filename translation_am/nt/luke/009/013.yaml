  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: am
  text: እርሱ ግን፣ “እናንተ የሚበላ ነገር ስጧቸው”[a] አላቸው። እነርሱም፣ “እኛ ሄደን ለዚህ ሁሉ ሕዝብ[b] ምግብ ከገዛን በቀር፣ ከአምስት ዳቦና ከሁለት ዓሣ የበለጠ የለንም” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ በግልጽ፣ “እናንተው የሚበላ ነገር ስጧቸው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም “ለዚህ ሁሉ ስብስብ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε … φαγεῖν
  choice: የሚበላ ነገር ስጧቸው
  rationale: በግሪክኛው ‘እንዲበሉ ስጧቸው’ የሚለውን ፈሊጣዊ አነጋገር በተፈጥሯዊ ዘመናዊ አማርኛ ‘የሚበላ ነገር ስጧቸው’ ብሎ ያስተላልፋል።
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: ግልጽ ተውላጠ ስሙ የሚሰጠውን አጽንዖት ይጠብቃል፤ ‘እናንተው’ የበለጠ ጠንካራ አማራጭ ሆኖ በማስታወሻ ቀርቧል።
- source_word: πλεῖον ἢ
  choice: ከ… የበለጠ የለንም
  rationale: አሉታዊውን የመጠን ገደብ ‘ከ… የበለጠ የለንም’ በሚል ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἄρτοι πέντε
  choice: አምስት ዳቦ
  rationale: ἄρτοι በዚህ አውድ የተቆጠሩ የዳቦ እንጎቻዎችን ያመለክታል። ‘ዳቦ’ ከጥንታዊው ‘ኅብስት’ ይልቅ ለዘመናዊ አንባቢ ግልጽ ሲሆን ‘እንጀራ’ የኢትዮጵያን ልዩ የምግብ ዓይነት እንዳያስገባ ተመርጧል።
- source_word: ἰχθύες δύο
  choice: ሁለት ዓሣ
  rationale: የግሪክኛውን ቀጥተኛ ብዙ ቁጥር በተፈጥሯዊ የአማርኛ የቁጥር አጠቃቀም ያቀርባል።
- source_word: εἰ μήτι
  choice: ካል… በቀር
  rationale: ሐረጉ የሚያቀርበውን የማይቻል ወይም አጠራጣሪ አማራጭ ‘ካል… በቀር’ በሚል ተፈጥሯዊ መዋቅር ይጠብቃል።
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: እኛ ሄደን … ካልገዛን
  rationale: ተሳቢውን በአማርኛ ተፈጥሯዊ ቅደም ተከተል ‘ሄደን… ካልገዛን’ ብሎ ያቀርባል፤ ἡμεῖς የሚሰጠውም አጽንዖት ‘እኛ’ በማለት ተጠብቋል።
- source_word: λαὸν
  choice: ሕዝብ
  rationale: λαός የሚለውን የጋራ ስም በቀጥታ ያስተላልፋል፤ ‘ሕዝብ’ እና ‘ሕዝብ ብዛት’ የሚሉት አውዳዊ አማራጮች ስለሆኑ ሁለተኛው በማስታወሻ ተጠቅሷል።
- source_word: βρώματα
  choice: ምግብ
  rationale: በዚህ አውድ ብዙ የሚበሉ ነገሮችን በአማርኛ ተፈጥሯዊ በሆነው የጋራ ስም ‘ምግብ’ ያቀርባል።
theological_decisions:
- issue: የኢየሱስ ትእዛዝና የደቀ መዛሙርቱ መልስ ድምፀት
  choice: ልውውጡን ከግሪክኛው በላይ ቁጣ፣ ስላቅ ወይም ተግሣጽ ሳይጨመርበት ቀጥተኛ ትእዛዝና ተግባራዊ ተቃውሞ አድርጎ ማቅረብ
  alternative: ትእዛዙን ‘እናንተው’ በማለት ይበልጥ አጽንዖት መስጠት፣ ወይም የደቀ መዛሙርቱን መልስ በተበሳጨ ድምፅ ማቅረብ
  rationale: ግልጽ ὑμεῖς አጽንዖት ቢኖረውም፣ ጥቅሱ በራሱ የበለጠ ስሜታዊ ድምፅ አይገልጽም። ትርጉሙ ያለውን አጽንዖት ይጠብቃል እንጂ ተጨማሪ ስሜት አያስገባም።
