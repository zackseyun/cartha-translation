  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የንግግር ቅርጹ ተፈጥሯዊ ሲሆን የግሪክኛው አጽንዖትና የአማራጩ አጠራጣሪ ገጽታ ተጠብቀዋል።
