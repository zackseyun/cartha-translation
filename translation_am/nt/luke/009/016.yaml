  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: am
  text: ከዚያም አምስቱን እንጀራና ሁለቱን ዓሣ ወስዶ፣ ወደ ሰማይ አሻቅቦ ተመለከተ፤ ባረካቸውም[a]፣ ቆራርሶም ለሕዝቡ እንዲያቀርቡ ለደቀ መዛሙርቱ ይሰጣቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እነርሱ አመሰገነ።” እዚህ ያለው የግሪክ ግስ “ባረከ” የሚል ሲሆን፣ አንዳንድ ትይዩ ዘገባዎች “አመሰገነ” የሚል ግስ ይጠቀማሉ።
    reason: lexical_alternative
