  alternative: የሚታየው ሰማይ ብቻ እንደሆነ መግለጽ
  rationale: ኢየሱስ ከመባረኩ ጋር ተያይዞ ወደ ላይ መመልከቱ ወደ እግዚአብሔር ያቀና አውድ አለው፤ “ሰማይ” ይህን ሳይጨምር ወይም ሳያጠብ ይጠብቃል።
- issue: εὐλόγησεν የሚለውን ግስ መተርጎም
