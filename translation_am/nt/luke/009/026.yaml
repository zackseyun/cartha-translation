  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: am
  text: ምክንያቱም በእኔና በቃሎቼ የሚያፍር ማንም ሰው፣ የሰው ልጅ በራሱ ክብርና በአብና በቅዱሳን መላእክት ክብር[b] በሚመጣበት ጊዜ በእርሱ[a] ያፍራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ይበልጥ ቃል በቃል፣ “በዚህ ሰው” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: የግሪክኛው አገባብ ደግሞ፣ “በራሱ ክብር፣ በአብ ክብርና በቅዱሳን መላእክት ክብር ሲመጣ” ተብሎ ሊቀርብ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: ምክንያቱም ... ማንም ቢኖር
  rationale: “ምክንያቱም” የγάρን ምክንያታዊ አገናኝነት ይጠብቃል፤ “ማንም ቢኖር” ደግሞ ὃς ... ἄν ያለውን ሁሉን አቀፍና ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: የሚያፍር / ያፍራል
  rationale: “ማፈር” የግሪክኛውን ‘በአንድ ሰው ወይም ነገር ማፈር’ ትርጉም በቀጥታ ይገልጣል። በሁለቱም ቦታ አንድ ግስ መጠቀሙ በሰውየውና በሰው ልጅ ምላሽ መካከል ያለውን ሆን ተብሎ የተደረገ ተመሳሳይነት ይጠብቃል።
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: በእኔና በቃሎቼ
  rationale: “ቃሎቼ” λόγουςን በቀጥታ ይጠብቃል፤ በ- የሚለው መስተዋድድ ከአማርኛው “ማፈር” ጋር ተፈጥሯዊ ነው።
- source_word: τοῦτον
  choice: በእርሱ
  rationale: ይህ ተውላጠ ስም ቀድሞ የተጠቀሰውን “ማንም” ይመለከታል። አማርኛው የግሪክኛውን ነጠላ ቁጥር ይጠብቃል፤ ማስጠንቀቂያው ግን ሴቶችንም ወንዶችንም ያካትታል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: ይህ የማዕረጉን የተለመደና ግልጽ አተረጓጎም ይጠብቃል፤ በብሉይ ኪዳን በተለይም በዳንኤል ካለው ዳራ ጋር ያለውን ትስስር አያጠፋም።
- source_word: ὅταν ἔλθῃ
  choice: በሚመጣበት ጊዜ
  rationale: የወደፊት ጊዜውን “ሲመጣ/በሚመጣበት ጊዜ” የሚለውን ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: በራሱ ክብርና በአብ እንዲሁም በቅዱሳን መላእክት ክብር
  rationale: “ክብር” δόξαን በትክክል ይገልጣል። በአማርኛ ግልጽነት ሲባል “ክብር” ተደግሟል፤ ነገር ግን ጽሑፉ የሰው ልጅን፣ የአብንና የቅዱሳን መላእክትን ክብር አብሮ ማቅረቡ ተጠብቋል።
- source_word: τῶν ἁγίων ἀγγέλων
  choice: በቅዱሳን መላእክት
  rationale: “ቅዱሳን መላእክት” የቅጽሉንና የስሙን ትርጉም ቀጥታና በክብር ያቀርባል።
