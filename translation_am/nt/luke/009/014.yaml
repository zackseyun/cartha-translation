  text: ምክንያቱም ወደ አምስት ሺህ የሚሆኑ ወንዶች[a] ነበሩ። እርሱም ለደቀ መዛሙርቱ እንዲህ አላቸው፦ “በየአምሳ የሚያህሉ ቡድኖች ተደግፈው እንዲቀመጡ አድርጓቸው[b]።”
  philosophy: optimal-equivalence
  footnotes:
