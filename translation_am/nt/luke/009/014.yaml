    text: የግሪክ ቃሉ “ወንዶች” የሚል ሲሆን፣ ሕዝቡን በሙሉ ሳይሆን ጎልማሳ ወንዶችን ይጠቅሳል፤ ሴቶችና ልጆች በዚህ ቁጥር ውስጥ አልተካተቱም።
