  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: am
  text: ከእነዚህ ቃሎች[a] በኋላ ስምንት ቀን ያህል[b] ሲሆን፣ እርሱ ጴጥሮስን፣ ዮሐንስንና ያዕቆብን ይዞ ሊጸልይ ወደ ተራራው ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነዚህ ንግግሮች በኋላ።” የግሪኩ λόγους በዚህ ስፍራ “ቃሎች” ወይም “ንግግሮች” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ “ስምንት ቀን ያህል” ይላል፤ ὡσεὶ ጊዜው ግምታዊ መሆኑን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ሲሆን
  rationale: ይህ አገላለጽ በትረካው ውስጥ ወደሚቀጥለው ክስተት የሚያሸጋግር ስለሆነ፣ ቃል በቃል ‘ሆነ’ ከማለት ይልቅ ከጊዜ ሐረጉ ጋር የተያያዘው ‘ሲሆን’ ተፈጥሯዊ የአማርኛ ትረካን ይሰጣል።
- source_word: μετὰ τοὺς λόγους τούτους
  choice: ከእነዚህ ንግግሮች በኋላ
  rationale: λόγους በዚህ አውድ ቀደም ሲል የተነገረውን ይጠቁማል፤ ‘ንግግሮች’ ይህን ትርጉም በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: ስምንት ቀን ያህል
  rationale: ὡσεὶ ጊዜው ግምታዊ መሆኑን ያሳያል፤ ‘ያህል’ ይህን ግምታዊነት ሳያጠፋ ተፈጥሯዊ በሆነ መንገድ ይገልጻል።
- source_word: παραλαβὼν
  choice: ይዞ
  rationale: አሳታፊው ግስ እነዚህን ሦስት ደቀ መዛሙርት አብሮት መውሰዱን ያመለክታል፤ ‘ይዞ’ በአማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ወደ ተራራው ወጣ
  rationale: ἀνέβη ወደ ላይ መውጣትን፣ εἰς τὸ ὄρος ደግሞ አቅጣጫውን ያሳያል፤ ይህ አገላለጽ ሁለቱንም ይጠብቃል።
- source_word: προσεύξασθαι
  choice: ሊጸልይ
  rationale: የዓላማ አድራጊው የወደ ተራራው መውጣቱ ዓላማ መጸለይ እንደሆነ ያሳያል፤ ‘ሊጸልይ’ ይህን በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: ከትይዩ የወንጌል ዘገባዎች ጋር በተያያዘ የጊዜው ግምታዊነት
  choice: ስምንት ቀን ያህል
  alternative: ስምንት ቀን
  rationale: ሉቃስ ὡσεὶ በማለት ቁጥሩን በግምት ያቀርባል። ትርጉሙ ይህን ግምታዊነት ይጠብቃል እንጂ ከሌሎች ዘገባዎች ጋር ለማስማማት አይሞክርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ καί በአማርኛ የስም ዝርዝር ልማድ መሠረት በሥርዓተ ነጥብና በ‘ና’ ተቀላጥፎ ቀርቧል።
