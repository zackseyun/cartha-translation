- source_word: ἤρθη
  choice: ተሰበሰበ
  rationale: የቀረውን ምግብ ከመሬት አንሥቶ የመሰብሰብን ዐውደ-ንባባዊ ትርጉም ይገልጣል፤ ቃሉ በቀጥታ «ተነሣ/ወደ ላይ ተወሰደ» ሊባል እንደሚችል በግርጌ ማስታወሻ ተጠብቋል።
