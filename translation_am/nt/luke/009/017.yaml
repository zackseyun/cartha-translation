- source_word: κλασμάτων
  choice: ከተቆራረሱት ቁርስራሾች
  rationale: የተሰበሩ ወይም የተቆራረሱ የምግብ ክፍሎችን በግልጽ ያሳያል፤ «ፍርፋሪዎች» ተቀባይነት ያለው አማራጭ ነው።
