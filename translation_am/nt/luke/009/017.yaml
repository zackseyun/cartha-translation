  text: ሁሉም በሉ፣ ጠገቡም። ከእነርሱ የተረፈው ፍርፋሪዎች[a] ተሰበሰቡ[b]፤ አሥራ ሁለት ቅርጫቶች ሞሉ።
  philosophy: optimal-equivalence
