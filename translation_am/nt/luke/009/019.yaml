  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: am
  text: እነርሱም፣ “መጥምቁ ዮሐንስ ነው፤ ሌሎች ግን ኤልያስ ነው ይላሉ፤ ሌሎችም ከጥንት ነቢያት አንዱ ተነሥቷል ይላሉ[a]” ብለው መለሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከጥንት የነበረ አንድ ነቢይ ተነሥቷል።” የግሪኩ አገባብ በዚህ መንገድም ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: ብለው መለሱ
  rationale: የተውሳከ ግስና የዋና ግስ አገባብን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የግሪኩን አላስፈላጊ ድግግሞሽ ቃል በቃል አያስገባም።
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: መጥምቁ ዮሐንስ
  rationale: በአማርኛ የተለመደውንና βαπτιστής የሚያመለክተውን መለያ ማዕረግ ይጠብቃል።
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: ሌሎች ግን ... ሌሎችም
  rationale: የተደጋገመውን የንጽጽርና የዝርዝር መዋቅር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Ἠλίαν
  choice: ኤልያስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የነቢዩ ስም ነው።
- source_word: ὅτι
  choice: ‘... ነው/ተነሥቷል’ ይላሉ
  rationale: የሌሎቹን ንግግር ይዘት በአማርኛ ቀጥተኛ ንግግር ተፈጥሯዊ ሆኖ ያቀርባል።
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: ከጥንት ነቢያት አንዱ
  rationale: τις ያለውን ያልተወሰነ ማጣቀሻና τῶν ἀρχαίων ያለውን ብዙ ቁጥር ግላዊ ማጣቀሻ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀνέστη
  choice: ተነሥቷል
  rationale: መነሣትን ይገልጣል፤ በዚህ አውድ ያለውን የትንሣኤ ድምፀት ሳያጠፋ ከጽሑፉ በላይ የተወሰነ ትርጓሜ አይጭንም።
theological_decisions:
- issue: ἀνέστη ትንሣኤን በግልጽ እንደሚያመለክት መተርጎም አለመተርጎም
  choice: ተነሥቷል
  alternative: ከሞት ተነሥቷል / እንደገና ተገልጧል
  rationale: ግሱ መነሣትን ወይም መነሳሳትን፣ በአንዳንድ አውዶችም ትንሣኤን ሊያመለክት ይችላል። “ተነሥቷል” ይህን የትርጉም ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛ ንግግሩ የብዙ ቡድኖችን መልስ ግልጽ ለማድረግ በተፈጥሯዊ የአማርኛ አገባብ ተዋቅሯል።
