  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: am
  text: ጴጥሮስና ከእርሱ ጋር የነበሩት እንቅልፍ ከብዷቸው ነበር፤ ሙሉ በሙሉ ከነቁ በኋላ ግን[a] ክብሩንና ከእርሱ ጋር ቆመው የነበሩትን ሁለቱን ሰዎች አዩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእንቅልፋቸው ከነቁ በኋላ” ወይም “ሙሉ በሙሉ ከነቁ በኋላ።” የግሪኩ ግስ ብርቅ ሲሆን፣ ዘወትር ነቅተው መቆየታቸውን ሳይሆን ወደ ፍጹም ንቃት መምጣታቸውን ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: እንቅልፍ ከብዶአቸው ነበር
  rationale: የእንቅልፍን ከባድ ጫና የሚገልጸውን ምሳሌያዊ አነጋገር በተፈጥሯዊ አማርኛ ያቆያል፤ ‘አንቀላፍተው ነበር’ ከሚለውም የጠነከረ ነው።
- source_word: διαγρηγορήσαντες
  choice: ሙሉ በሙሉ በነቁ ጊዜ
  rationale: አውዱ ከእንቅልፍ ክብደት ወደ ፍጹም ንቃት መምጣታቸውን ያመለክታል፤ ግሱ ብርቅ ስለሆነ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: δόξαν
  choice: ክብሩን
  rationale: የδόξαን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ድምፀት ይጠብቃል፤ በዐውዱም የኢየሱስን የሚታይ ክብር ይገልጻል።
- source_word: τοὺς δύο ἄνδρας
  choice: ሁለቱን ሰዎች
  rationale: በዐውዱ ሙሴንና ኤልያስን የሚያመለክት ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: συνεστῶτας αὐτῷ
  choice: ከእርሱ ጋር ቆመው የነበሩትን
  rationale: የአብሮ መቆምንና በቦታው መገኘትን የሚያሳየውን የአድራጊ ቅጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δέ
  choice: ግን
  rationale: ሁለተኛው δέ በእንቅልፍ መከበድና በመንቃት ማየት መካከል ያለውን ቀላል ተቃርኖ ያሳያል፤ የመጀመሪያው δέ የንግግር ሽግግር ብቻ ስለሆነ በተለየ ቃል አልተተረጎመም።
theological_decisions:
- issue: በመለወጥ ትዕይንት ውስጥ δόξαን መተርጎም
  choice: ክብሩን
  alternative: ግርማውን / ድምቀቱን
  rationale: ‘ክብር’ የሚታየውን ግርማ ሳያስቀር ሰፊውን መጽሐፍ ቅዱሳዊ ትስስር ይጠብቃል፤ የክብሩን ባሕርይ ከጽሑፉ በላይ አይተረጉምም።
- issue: διαγρηγορήσαντες የሚለው ብርቅ ግስ ትርጉም
  choice: ሙሉ በሙሉ በነቁ ጊዜ
  alternative: ነቅተው ከቆዩ በኋላ
  rationale: የተመረጠው አተረጓጎም ከእንቅልፍ ክብደት ወደ ፍጹም ንቃት የመጡበትን የትረካ ተቃርኖ ይጠብቃል፤ ግሱ ከዚህ ይልቅ ‘ነቅተው ቆዩ’ ሊል የሚችለው አማራጭ ግን በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምሳሌያዊ አነጋገርና የትረካው ተቃርኖ ተጠብቀዋል።
