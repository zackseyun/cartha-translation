    issue: The main-clause rendering of διαγρηγορήσαντες is stylistically awkward.
    rationale: “ሙሉ በሙሉ በነቁ ጊዜ” is understandable, but “ሙሉ በሙሉ ከነቁ በኋላ” is more natural and clearly expresses entry into full wakefulness.
  - severity: medium
    issue: The footnote presents “ነቅተው ከቆዩ በኋላ” as an alternative and then contrasts the preferred sense with remaining awake.
    rationale: This creates an internally confusing note and does not match the audit trail's reader-facing alternatives, which are ‘after waking up’ and ‘once fully awake.’ The note should preserve the rare verb's uncertainty without promoting a contextually disfavored ‘having remained awake’ wording as a direct alternative.
