  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: am
  text: ሕዝቡም ይህን ሲያውቁ ተከተሉት። እርሱም ተቀብሎአቸው ስለ እግዚአብሔር መንግሥት ይነግራቸው ነበር፤ መታከም ያስፈልጋቸውንም[a] ይፈውስ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፈውስ ያስፈልጋቸውን»። የግሪኩ θεραπεία የሚለው ቃል «ፈውስ» ወይም «ሕክምና/እንክብካቤ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: ሕዝቡም
  rationale: የግሪኩ ብዙ ቁጥር በአማርኛ በተፈጥሮ በነጠላ የስብስብ ስም «ሕዝቡ» ተገልጿል፤ δέ ደግሞ የትረካ ሽግግሩን በ«ም» ያሳያል።
- source_word: γνόντες
  choice: ይህን ሲያውቁ
  rationale: የአኦሪስት ተሳቢውን ጊዜያዊ ግንኙነት ተፈጥሯዊ በሆነ የአማርኛ ጊዜ ንዑስ ዓረፍተ ነገር ይገልጣል፤ «ይህን» ከቀደመው የኢየሱስ መሄድ ጋር ያገናኛል።
- source_word: ἠκολούθησαν αὐτῷ
  choice: ተከተሉት
  rationale: አካላዊ መከተልን በቀጥታ የሚገልጽ መደበኛና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: ἀποδεξάμενος αὐτούς
  choice: ተቀብሎአቸው
  rationale: ከተራ መቀበል ባለፈ በበጎ ፈቃድ መቀበልን ያሳያል፤ በአማርኛም በዐውዱ የእንግዳ ተቀባይነት ስሜቱን ይይዛል።
- source_word: ἐλάλει αὐτοῖς
  choice: ይነግራቸው ነበር
  rationale: የግሪኩን ኢምፐርፌክት ቀጣይነት በ«ነበር» ያስቀምጣል፤ በዐውዱ ስለ መንግሥቱ ማስተማርንና መናገርን በተፈጥሮ ይገልጣል።
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ስለ እግዚአብሔር መንግሥት
  rationale: ቁልፍ የወንጌል ሐረጉን በተለመደውና ግልጽ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: መታከም ያስፈልጋቸውን
  rationale: χρείαν ἔχοντας የሚለውን «ያስፈልጋቸውን» ብሎ ይገልጣል፤ θεραπεία የሕክምና፣ የእንክብካቤ ወይም የፈውስ ስፋት ስላለው «መታከም» ከተከታዩ «ይፈውስ» ሳይደጋገም ይህን ስፋት ይጠብቃል።
- source_word: ἰᾶτο
  choice: ይፈውስ ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይ የፈውስ ተግባር ያሳያል።
theological_decisions:
- issue: የβασιλεία τοῦ θεοῦ አተረጓጎም
  choice: የእግዚአብሔር መንግሥት
  alternative: የእግዚአብሔር አገዛዝ
  rationale: «መንግሥት» በወንጌላት የተለመደውን ቁልፍ ቃል ይጠብቃል፤ በዐውዱም የእግዚአብሔርን ንጉሣዊ አገዛዝ ሳይክድ ከቦታ ብቻ ጋር አያጥበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ኢምፐርፌክት ግሶች ቀጣይነት በ«ነበር» ተጠብቋል፤ θεραπεία ያለው የቃላት ስፋት በዋናው ጽሑፍና በእግር ማስታወሻው ተገልጿል።
