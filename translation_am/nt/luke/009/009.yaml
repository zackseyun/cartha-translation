base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: am
  text: ሄሮድስ ግን፣ “ዮሐንስን እኔ አንገቱን ቆርጬ ገደልሁ፤ ታዲያ ስለ እርሱ እንዲህ ያሉ ነገሮችን የምሰማው ይህ ማን ነው?” አለ። እርሱንም ለማየት ደጋግሞ ይፈልግ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን ለማየት ይፈልግ ነበር።” የግሪክኛው ያልተጠናቀቀ የግስ ጊዜ ቀጣይ ወይም ተደጋጋሚ ድርጊትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: የቀደመውን ዘገባ ከሄሮድስ ምላሽ ጋር በትንሽ ንፅፅር የሚያገናኘውን የንግግር ሽግግር ያሳያል።
- source_word: Ἡρῴδης
  choice: ሄሮድስ
  rationale: በዘመናዊ አማርኛ የተለመደውን የስሙን አጻጻፍ ይከተላል።
- source_word: Ἰωάννην
  choice: ዮሐንስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የግል ስም ነው።
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና ሄሮድስ ራሱ ያደረገውን ተግባር አጽንዖት የሚሰጠውን ተውላጠ ስም ይጠብቃል።
- source_word: ἀπεκεφάλισα
  choice: አንገቱን አስቆርጬዋለሁ
  rationale: ግሱ በተለይ አንገትን በማስቆረጥ መግደልን ያመለክታል፤ ሄሮድስ ድርጊቱን በአስፈጻሚ ቅርጽ ማድረጉንም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τίς δέ ἐστιν οὗτος
  choice: እንግዲህ ... ይህ ማን ነው?
  rationale: ቀጣዩን ጥያቄ የሚያስገባውን δέ በአማርኛ ተፈጥሯዊ በሆነው ‘እንግዲህ’ ያሳያል፤ ‘ይህ’ የሄሮድስን ግራ መጋባትና ርቀት ይጠብቃል።
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: ስለ እርሱ እንዲህ ያሉ ነገሮችን የምሰማው
  rationale: የግሪክኛውን አጠቃላይ አገላለጽ ሳይጠብብ ‘ወሬዎች’ ወይም የተወሰነ ይዘት ሳይጨምር ይተረጉማል።
- source_word: ἐζήτει
  choice: ደጋግሞ ይፈልግ ነበር
  rationale: ያልተጠናቀቀው የግሪክኛ ጊዜ ቀጣይነትን ወይም ተደጋጋሚ ጥረትን ሊያመለክት ስለሚችል ይህን ገጽታ በግልጽ ያቀርባል።
- source_word: ἰδεῖν αὐτόν
  choice: እርሱንም ለማየት
  rationale: ‘ማየት’ የግሱ ቀጥተኛ ትርጉም ነው፤ ‘ለመገናኘት’ የሚለውን ትርጓሜ አይጨምርም።
theological_decisions:
- issue: ሄሮድስ ስለ ዮሐንስ የተናገረውና ኢየሱስን ለማየት የነበረው ፍላጎት
  choice: የሄሮድስን ንግግር፣ ጥያቄና ለማየት የነበረውን ቀጣይ ፍላጎት ብቻ በቀጥታ ማቅረብ
  alternative: ዮሐንስ ከሙታን ተነሥቷል ብሎ እንደፈራ ወይም ይህን ለማረጋገጥ እንደፈለገ በግልጽ መጨመር
  rationale: ዐውደ ንባቡ የሄሮድስን ግራ መጋባት ቢያሳይም፣ ይህ ቁጥር ራሱ የሚናገረው ዮሐንስን እንዳስቆረጠ፣ ስለሚሰማው ሰው ማንነት እንደጠየቀና ሊያየው እንደፈለገ ብቻ ነው። ትርጉሙ ያልተገለጸውን ዓላማ ወይም ፍርሃት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሄሮድስን አጽንዖት ለመጠበቅ ‘እኔ’ ተይዟል፤ የἐζήτει ገጽታዊ አሻሚነት በግርጌ ማስታወሻ ተጠብቋል።
