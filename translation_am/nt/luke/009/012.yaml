base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: am
  text: ቀኑም ሊያልቅ ጀመረ፤ አሥራ ሁለቱም ወደ እርሱ ቀርበው፣ “ሕዝቡን በዙሪያው ወዳሉት መንደሮችና የገጠር ስፍራዎች ሄደው ማደሪያና ስንቅ[a] እንዲያገኙ አሰናብታቸው፤ እዚህ ገለልተኛ ስፍራ[b] ነንና” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምግብ።” ἐπισιτισμός የምግብ አቅርቦትን ወይም ስንቅን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሰው በማይኖርበት ወይም ሰው እምብዛም በማይኖርበት ስፍራ።” ἔρημος ሰው የሌለበትን ወይም ሰው እምብዛም የማይኖርበትን አካባቢ ሊያመለክት ይችላል።
    reason: lexical_alternative
