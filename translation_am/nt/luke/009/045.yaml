    text: “ቃል” የሚለው “ንግግር፣” “አባባል” ወይም “ጉዳይ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪክኛው ጽሑፍ “ከእነርሱ ተሰውሮ ነበር” ይላል እንጂ የሰወረውን አካል አይጠቅስም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: አልተረዱትም
  rationale: በዚህ አውድ ግሱ መረጃ ማጣትን ብቻ ሳይሆን ኢየሱስ የተናገረውን ትርጉም አለመያዝን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ῥῆμα
  choice: ቃል
  rationale: እዚህ ቃሉ ኢየሱስ አሁን የተናገረውን የተወሰነ ንግግር ያመለክታል። “ቃል” አጭር፣ የተለመደና የምንጩን ሰፊ የትርጉም ክልል የሚጠብቅ ነው፤ አማራጮቹ በማስታወሻ ተጠቅሰዋል።
- source_word: παρακεκαλυμμένον
  choice: ተሰውሮ ነበር
