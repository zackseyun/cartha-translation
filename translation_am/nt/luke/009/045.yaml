- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: እንዳይገነዘቡትም
  rationale: የዓላማ/ውጤት አወቃቀሩን ይጠብቃል። “ይገነዘቡ” የማስተዋልና የመረዳት ሐሳብ ሲኖረው፣ ቀድሞ ከተጠቀሰው ἠγνόουν ጋር ያለውን የቃላት ልዩነትም በተቻለ መጠን ይጠብቃል።
- source_word: ἐφοβοῦντο
  choice: ፈሩ
