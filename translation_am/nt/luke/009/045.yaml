  rationale: የግሪክኛው ተደራጊ አወቃቀር የሰወረውን አካል አይሰይምም። ጥቅሱ ራሱ ያልገለጸውን ሥነ መለኮታዊ ድምዳሜ እንዳይጨመር፣ ይህ ግልጽ ያልሆነ ነጥብ ተጠብቋል።
