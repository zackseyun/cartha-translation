  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: am
  text: 'ከእርሱም ቀድመው[a] እንዲሄዱ መልእክተኞችን ላከ። እነርሱም ሄደው ለእርሱ ለማዘጋጀት ወደ አንድ የሳምራውያን መንደር[b] ገቡ።


    [a] ቃል በቃል፣ “በፊቱ” ወይም “ከፊቱ”።


    [b] ወይም፣ “ሳምራዊ መንደር”። ግሪክኛው ቃል በቃል “የሳምራውያን መንደር” ይላል።'
  philosophy: optimal-equivalence
  footnotes:
