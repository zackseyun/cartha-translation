    text: ቃል በቃል፣ “በፊቱ” ወይም “ከፊቱ”።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሳምራዊ መንደር”። ግሪክኛው ቃል በቃል “የሳምራውያን መንደር” ይላል።
    reason: lexical_alternative
