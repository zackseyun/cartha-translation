id: LUK.9.41
reference: Luke 9:41
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “የማታምንና ጠማማ ትውልድ ሆይ! እስከ መቼ ከእናንተ ጋር እሆናለሁ? እስከ መቼስ እታገሣችኋለሁ? ልጅህን ወደዚህ አምጣው” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄπιστος
  choice: የማታምኑ
  rationale: በዐውዱ ሰዎቹን በቀጥታ የሚገልጽና ‘እምነት የሌለው’ የሚለውን የግሪክ ቃል በተፈጥሯዊ አማርኛ የሚያስተላልፍ ምርጫ ነው።
- source_word: διεστραμμένη
  choice: ጠማማ
  rationale: ‘የተጣመመ፣ ከትክክለኛው የወጣ’ የሚለውን ምስላዊና ሥነ ምግባራዊ ኃይል ሳያጠፋ በአጭሩ ያቀርባል።
- source_word: ἀνέξομαι ὑμῶν
  choice: እታገሣችኋለሁ
  rationale: የተናጋሪውን ትዕግሥትና የመሸከም ስሜት በዘመናዊና ክቡር አማርኛ ይገልጻል።
- source_word: προσάγαγε ὧδε
  choice: ወደዚህ አምጣው
  rationale: የቦታ አመልካቹንና የትእዛዙን ቀጥተኛነት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ ተግሣጽ ተቀባይ ወሰን
  choice: ‘እናንተ … ትውልዶች’ በማለት የብዙ ቁጥር አድራሻውን ጠብቋል
  alternative: ንግግሩን ለአባቱ፣ ለደቀ መዛሙርቱ ወይም ለሕዝቡ ብቻ መወሰን
  rationale: ὑμᾶς/ὑμῶν የብዙ ቁጥር ነው፤ ጽሑፉ ተግሣጹ በትክክል የትኛውን ቡድን እንደሚያካትት አይወስንም፣ ስለዚህ ያንን አሻሚነት ጠብቀናል።
- issue: ἕως πότε የሚለው በሁለቱ ግሶች ላይ ያለው ኃይል
  choice: ‘እስከ መቼ’ን በሁለቱም ጥያቄዎች መድገም
  alternative: አንድ ጊዜ ብቻ በመጥቀስ ሁለቱን ግሶች በአንድ ጥያቄ ማያያዝ
  rationale: በአማርኛ የተግሣጹን ኃይልና ትይዩ አወቃቀሩን ግልጽ ያደርጋል፤ አዲስ ትርጉም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሆይ’ የግሪኩን Ὦ የጥሪና የተግሣጽ ኃይል ይጠብቃል፤ ‘ጠማማ’ ደግሞ ከመጠን በላይ ሃይማኖታዊ የቃላት ጭነት ሳይጨምር διεστραμμένηን ያስተላልፋል።
