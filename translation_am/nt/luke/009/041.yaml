revisions:
- from: ኢየሱስም መልሶ፣ “እናንተ የማታምኑና ጠማማ ትውልዶች ሆይ! እስከ መቼ ከእናንተ ጋር እኖራለሁ? እስከ መቼስ እታገሣችኋለሁ? ልጅህን ወደዚህ አምጣው” አለ።
  to: ኢየሱስም መልሶ፣ “የማታምንና ጠማማ ትውልድ ሆይ! እስከ መቼ ከእናንተ ጋር እሆናለሁ? እስከ መቼስ እታገሣችኋለሁ? ልጅህን ወደዚህ አምጣው” አለ።
  rationale: The revision restores the singular collective vocative required by γενεὰ and replaces “እኖራለሁ” with “እሆናለሁ” to reflect the broader sense of ἔσομαι. It retains the plural pronouns, thereby avoiding any unsupported decision about precisely which group is included in the rebuke. No footnotes are required by the source or the English audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ response, the rebuke, the plural referents in the subsequent pronouns, endurance, and the command to bring the son. However, γενεὰ is singular, whereas the draft has the plural “ትውልዶች.” Also, ἔσομαι πρὸς ὑμᾶς means “be with you,” not specifically “live with you.”
  naturalness: The revised wording is natural, dignified modern standard Amharic. “ትውልድ ሆይ” preserves the collective singular vocative, while the following plural pronouns preserve the Greek’s plural address.
  terminology: “የማታምን” adequately renders ἄπιστος; “ጠማማ” appropriately retains the figurative and moral force of διεστραμμένη without overinterpreting it. “እታገሣችኋለሁ” fittingly renders ἀνέξομαι ὑμῶν.
  issues:
  - severity: medium
    issue: Singular Greek γενεὰ is translated as plural “ትውልዶች.”
    rationale: The source vocative is singular (“O … generation”). The plural form also produces an awkward mismatch with the singular descriptive adjective “ጠማማ.”
  - severity: medium
    issue: “እኖራለሁ” narrows ἔσομαι πρὸς ὑμᾶς.
    rationale: The Greek asks how long Jesus will “be with” them; “live with” can suggest residence and is more specific than the source.
  revised_text: ኢየሱስም መልሶ፣ “የማታምንና ጠማማ ትውልድ ሆይ! እስከ መቼ ከእናንተ ጋር እሆናለሁ? እስከ መቼስ እታገሣችኋለሁ? ልጅህን ወደዚህ አምጣው” አለ።
  revised_footnotes: []
  revision_rationale: The revision restores the singular collective vocative required by γενεὰ and replaces “እኖራለሁ” with “እሆናለሁ” to reflect the broader sense of ἔσομαι. It retains the plural pronouns, thereby avoiding any unsupported decision about precisely which group is included in the rebuke. No footnotes are required by the source or the English audit trail.
