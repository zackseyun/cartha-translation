  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: am
  text: እንዲህም አላቸው፦ “ማንም ይህን ልጅ በስሜ[b] የሚቀበል[a] እኔን ይቀበላል፤ ማንም እኔን የሚቀበል የላከኝን ይቀበላል። ከሁላችሁ መካከል ከሁሉ ያነሰው እርሱ ታላቅ ነውና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቁጥሩ ሁሉ «ይቀበላል» በሚለው ፈንታ «በደስታ ይቀበላል» ወይም «ያስተናግዳል» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ግስ ተቀባይነትንና እንግዳ መቀበልን ሁለቱንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «በስሜ» የሚለው «በስሜ መሠረት» ወይም «ስለ ስሜ» የሚል ትርጉምም ሊኖረው ይችላል፤ መቀበሉ ከኢየሱስ ሥልጣንና ከእርሱ ጋር ካለ ታማኝነት ጋር የተያያዘ መሆኑን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: የሚቀበል / ይቀበላል
  rationale: «መቀበል» የግሪኩን ግስ ድግግሞሽ ይጠብቃል፤ ሰውን በእንግድነት ማስተናገድንም ሆነ ተቀባይነት መስጠትን ሊያመለክት ይችላል።
- source_word: παιδίον
  choice: ሕፃን
  rationale: በዐውዱ ያለውን ልጅ ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: በስሜ
  rationale: ሕፃኑን መቀበሉ ከኢየሱስ ስም፣ ሥልጣንና ውክልና ጋር ባለው ግንኙነት እንደሆነ ያለ አላስፈላጊ ማጥበብ ይጠብቃል።
- source_word: τὸν ἀποστείλαντά με
  choice: የላከኝን
  rationale: ግሪኩ ላኪውን በስም ሳይጠቅስ በተሳቢ አንቀጽ ይገልጠዋል፤ ይህ አጭር የአማርኛ አገላለጽም ያንኑ ይጠብቃል።
- source_word: μικρότερος
  choice: ከሁሉ ያነሰው
  rationale: ንጽጽራዊውን ቅርጽ ጠብቆ በዐውዱ ያለውን የማኅበራዊ ደረጃና ትሕትና ያሳያል፤ በዕድሜ ትንሽ መሆን ብቻን አያስገድድም።
- source_word: ἐν πᾶσιν ὑμῖν
  choice: ከሁላችሁ መካከል
  rationale: በቡድኑ ውስጥ ያለውን አንጻራዊ ቦታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὗτός ἐστιν μέγας
  choice: እርሱ ታላቅ ነው
  rationale: οὗτος ያለውን አጽንዖት «እርሱ» በማለት ይጠብቃል፤ የታላቅነትንም ተቃርኖ ግልጽ ያደርጋል።
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: የሚቀበል ... የሚቀበል
  rationale: ማንኛውንም ሰው የሚመለከተውን አጠቃላይ ሁኔታዊ አባባል በተፈጥሯዊ የአማርኛ አንጻራዊ አንቀጽ ይገልጣል።
theological_decisions:
- issue: «የላከኝ» የሚለው ማንን እንደሚያመለክት
  choice: ላኪው በስም ሳይገለጽ «የላከኝን» ተብሎ ተቀምጧል።
  alternative: «የላከኝን አብ» ወይም «የላከኝን እግዚአብሔር»
  rationale: ጽሑፉ አብን/እግዚአብሔርን በዐውዱ ቢያመለክትም በግልጽ ስም አይጠራውም፤ ትርጉሙ ይህን የአገላለጽ መጠን ይጠብቃል።
- issue: ሕፃኑን «በስሜ» መቀበል
  choice: ከኢየሱስ ስም፣ ሥልጣን ወይም ውክልና ጋር ያለው ሰፊ ግንኙነት ተጠብቋል።
  alternative: «ስለ እኔ» ወይም «የእኔ ስለሆነ»
  rationale: አማራጮቹ ሐረጉን ወደ አንድ ምክንያታዊ ትርጉም ሊያጠብቡት ይችላሉ፤ «በስሜ» የምንጩን ስፋት ይጠብቃል።
- issue: የታናሽነትና የታላቅነት ተቃርኖ
  choice: በማኅበሩ ውስጥ ከሁሉ ያነሰው ታላቅ መሆኑ ሳይለዘብ ተቀምጧል።
  alternative: «ከሁላችሁ በዕድሜ ታናሹ ታላቅ ነው»
  rationale: μικρότερος በዚህ ዐውድ የዕድሜ ልዩነትን ብቻ ሳይሆን ዝቅተኛ ደረጃንና ትሕትናን ያካትታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ«መቀበል» ድግግሞሽ የንግግሩን ተያያዥ አመክንዮ ለማስጠበቅ ሆን ተብሎ ተይዟል፤ «እርሱ»ም የመደምደሚያውን አጽንዖት ያስተላልፋል።
