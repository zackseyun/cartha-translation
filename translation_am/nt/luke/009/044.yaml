  rationale: ግልጽ የሆነውን ὑμεῖς በ«እናንተ» በመግለጽ አጽንዖቱን ይጠብቃል፤ «ወደ ጆሮአችሁ አስገቡ»ም ቃሉን በጥንቃቄ ሰምቶ ማስታወስን የሚያመለክተውን ሕያው የግሪክ አነጋገር ሳይፈታ ያቆያል።
- source_word: τοὺς λόγους τούτους
  choice: እነዚህን ቃላት
  rationale: የኢየሱስን ቀጥሎ የሚነገር ልዩ ንግግር በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ γὰρ
  choice: ነውና
  rationale: γάρ ትእዛዙ ለምን በጥንቃቄ መሰማት እንዳለበት የሚሰጠውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ ቅጥያ ያሳያል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የተለመደ ማዕረግ እና ከዳንኤል 7 ጋር ሊኖረው የሚችለውን ትስስር ይጠብቃል።
- source_word: μέλλει
  choice: ሊ… ነው
  rationale: በቅርቡ የሚፈጸም ነገርን ያመለክታል፤ የግድ የተወሰነ ዕጣ ፈንታ የሚል ተጨማሪ ትርጉም አያስገባም።
- source_word: παραδίδοσθαι
  choice: ተላልፎ ሊሰጥ
  rationale: የተደራጊ ቅርጹንና በሌሎች ሥልጣን ሥር የመሰጠትን ሰፊ ትርጉም ይጠብቃል፤ ድርጊቱን ወዲያውኑ በ«ክህደት» ብቻ አያጥበውም።
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: በሰዎች እጅ
