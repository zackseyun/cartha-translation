id: LUK.9.47
reference: Luke 9:47
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: am
  text: ኢየሱስ ግን የልባቸውን አሳብ[a] አውቆ፣ አንድን ሕፃን ይዞ ከጎኑ አቆመው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በልባቸው ያለውን አሳብ»። በግሪክ «ልብ» ነጠላ ሲሆን «እነርሱ»ን የሚያመለክተው ባለቤትነት ግን ብዙ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ከራሱ አጠገብ አቆመው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: አውቆ
  rationale: በዚህ አውድ ቃሉ ውስጣዊ አሳባቸውን ማወቅን ያመለክታል፤ ይህም የማወቁን መንገድ ሳይገልጽ የጽሑፉን አረጋገጥ ያቆያል።
- source_word: διαλογισμὸν
  choice: አሳብ
  rationale: ቃሉ ውስጣዊ አስተሳሰብን፣ ማመዛዘንን ወይም ክርክርን ሊያመለክት ይችላል፤ «አሳብ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን አውዱን አያጠብም።
- source_word: τῆς καρδίας αὐτῶν
  choice: የልባቸውን
  rationale: የግሪኩን ነጠላ «ልብ» ከብዙ ባለቤቶች ጋር ያለውን አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπιλαβόμενος
  choice: ይዞ
  rationale: ቃሉ መያዝን ወይም እጅ ማድረግን ያመለክታል፤ «ይዞ» ድርጊቱን በግልጽና ተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: παιδίον
  choice: ሕፃን
  rationale: የቃሉን መሠረታዊ ትርጉም በግልጽና በዘመናዊ አጠቃቀም ያቀርባል፤ «ትንሽ» የሚል ተጨማሪ አጽንዖት አልገባም።
- source_word: ἔστησεν
  choice: አቆመው
  rationale: የግሪኩ ግስ «እንዲቆም አደረገ» ወይም «አቆመ» የሚል ምክንያታዊ ትርጉም አለው፤ «አቆመው» የመቆሙን ምስል ይጠብቃል።
- source_word: παρ’ ἑαυτῷ
  choice: ከጎኑ
  rationale: ኢየሱስ ሕፃኑን በራሱ አጠገብ እንዳቆመው በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ኢየሱስ ውስጣዊ አሳባቸውን ማወቁ
  choice: ኢየሱስ የልባቸውን አሳብ እንዳወቀ መግለጽ፣ ያወቀበትን መንገድ ግን አለመወሰን
  alternative: ይህን ማወቅ በመለኮታዊ ሁሉን አዋቂነት ወይም በሰዋዊ ጥልቅ ግንዛቤ መሆኑን በግልጽ መተርጎም
  rationale: ሉቃስ ኢየሱስ እንዳወቀ ይናገራል እንጂ ያወቀበትን ዘዴ አይገልጽም፤ ትርጉሙም ይህን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «የልባቸውን» የሚለው አወቃቀር የግሪኩን ነጠላ ስምና ብዙ ባለቤት በተፈጥሯዊ መንገድ ያቆያል።
