    text: ወይም፣ “የመንገደኛ ከረጢት።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ብር፤” እዚህ ግን ገንዘብን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: የግሪኩ አገላለጽ “እያንዳንዳችሁ ሁለት የውስጥ ልብሶች” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: ለጉዞው ምንም ነገር አትያዙ
  rationale: የግሪኩን የጉዞ ዝግጅት አውድ በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ῥάβδον
  choice: በትር
  rationale: በጉዞ ጊዜ ለመደገፊያ የሚያገለግልን በትር የሚያመለክት አጭርና የተለመደ ቃል ነው።
- source_word: πήραν
  choice: ከረጢት
  rationale: ለስንቅና ለጉዞ ዕቃ የሚያገለግል ከረጢት የሚለውን መሠረታዊ ትርጉም ያስተላልፋል፤ የመንገደኛ ከረጢት የሚለው ዝርዝር በማስታወሻ ተጠብቋል።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: በአማርኛ የዕለት ምግብንና የዳቦን ሐሳብ በተፈጥሯዊ መንገድ የሚያስተላልፍ ተመጣጣኝ ቃል ነው።
- source_word: ἀργύριον
  choice: ገንዘብ
  rationale: ቃሉ በቀጥታ ‘ብር’ ቢሆንም በዚህ አውድ የሚያመለክተው ለወጪ የሚውል ገንዘብ ነው፤ ቀጥተኛው ትርጉም በማስታወሻ ተገልጿል።
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: እያንዳንዳችሁም ሁለት ቀሚስ አይኑራችሁ
  rationale: ἀνά ያለውን አከፋፋይ ኃይል ‘እያንዳንዳችሁ’ በማለት በግልጽ ያስተላልፋል፤ ‘ቀሚስ’ ደግሞ የጥንቱን ከሰውነት ጋር ተጠግቶ የሚለበስ ልብስ ያመለክታል።
