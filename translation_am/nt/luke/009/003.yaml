base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: am
  text: 'እርሱም እንዲህ አላቸው፦ “ለጉዞው ምንም ነገር አትያዙ፤ በትርም ሆነ ከረጢት[a]፣ እንጀራም ሆነ ገንዘብ[b]፣ አትያዙ፤ እያንዳንዳችሁም ሁለት የውስጥ ልብሶች አይኑሯችሁ።[c]”


    [a] ወይም፣ “የመንገደኛ ከረጢት።”


    [b] ቃል በቃል፣ “ብር፤” እዚህ ግን ገንዘብን ያመለክታል።


    [c] የግሪኩ አገላለጽ “እያንዳንዳችሁ ሁለት የውስጥ ልብሶች” ማለት ነው።'
  philosophy: optimal-equivalence
  footnotes:
