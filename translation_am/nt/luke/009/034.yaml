    text: ወይም፣ “ደመና መጥቶ መጋረድ ጀመረ።” ግሱ የድርጊቱን መጀመር ወይም መቀጠል ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ደመናው ምናልባት በብሉይ ኪዳን የእግዚአብሔር መገኘት የሚገለጥባቸውን ትዕይንቶች ያስታውሳል፤ ይሁን እንጂ ይህ ቁጥር ይህን በግልጽ አይናገርም።
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
