  text: እርሱ እነዚህን ነገሮች ሲናገር፣ ደመና መጥቶ[b] ጋረዳቸው[a]፤ እነርሱም ወደ ደመናው ውስጥ ሲገቡ ፈሩ።
  philosophy: optimal-equivalence
  footnotes:
