base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: am
  text: ድምፁም በተሰማ ጊዜ፣ ኢየሱስ ብቻውን ተገኘ።[a] እነርሱም ዝም አሉ፤ በእነዚያም ቀናት ካዩት ነገር ምንም ለማንም አልነገሩም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ብቻ ቀረ” / “ኢየሱስ ብቻ ታየ።” የግሪኩ ቃል በቃል፣ “ኢየሱስ ብቻውን ተገኘ” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: ድምፁም በተሰማ ጊዜ
  rationale: ἐν + አርቲክል ያለው የግስ ስም ጊዜን ያመለክታል። φωνή በዚህ አውድ የሰማይን ድምፅ ያመለክታል፤ γενέσθαι ደግሞ ቃል በቃል ‘ሆነ’ ቢሆንም፣ በአማርኛ ድምፅን በተመለከተ ‘ተሰማ’ ተፈጥሯዊና አውዳዊ ነው።
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: ኢየሱስ ብቻውን ተገኘ
  rationale: የεὑρέθηን ተገብሮአዊ ቅርጽ ‘ተገኘ’ በማለት ጠብቋል፤ μόνος የኢየሱስን ብቸኛ መቅረት በ‘ብቻውን’ ያሳያል።
- source_word: ἐσίγησαν
  choice: ዝም አሉ
  rationale: συγάω ዝም ማለትን ወይም በዝምታ መቆየትን ያመለክታል፤ ‘ዝም አሉ’ ዘመናዊና ተፈጥሯዊ አማርኛ ነው።
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: ለማንም አልነገሩም
  rationale: ἀπαγγέλλω ማሳወቅን ወይም መንገርን ይገልጣል፤ ከοὐδενί ጋር ‘ለማንም አልነገሩም’ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: በዚያ ዘመን
  rationale: ቃል በቃል ‘በእነዚያ ቀናት’ ሊባል ይችላል፤ ‘በዚያ ዘመን’ የተጠቀሰውን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ይገልጣል።
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: ካዩት ነገር ምንም
  rationale: የοὐδένን አሉታዊ ኃይልና የὧν ἑώρακανን ከፊል-ጠቋሚ ግንኙነት ‘ካዩት ነገር ምንም’ በሚል ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ከሰማያዊው ድምፅ በኋላ ኢየሱስ ብቻውን ስለመገኘቱ ያለው የትረካ አንድምታ
  choice: ‘ኢየሱስ ብቻውን ተገኘ’ ብሎ ገላጭ ብቻ መተርጎም
  alternative: ‘ኢየሱስ ብቻ ቀረ’ ወይም ‘ኢየሱስን ብቻ አዩ’
  rationale: ጥቅሱ የትዕይንቱን ውጤት ይዘግባል እንጂ ግልጽ የነገረ መለኮት ትርጓሜ አይጨምርም። የግሪኩን ተገብሮአዊና የተገደበ አገላለጽ መጠበቅ አንድምታውን ሳይፈታ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። የግሪኩ አጭር አረፍተ ነገርና የክስተቶቹ ቅደም ተከተል ተጠብቋል።
