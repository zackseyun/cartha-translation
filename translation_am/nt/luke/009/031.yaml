  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: am
  text: እነርሱም በክብር ተገልጠው፣ እርሱ በኢየሩሳሌም ሊፈጽመው ስለነበረው መውጣቱ ይነጋገሩ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «መውጣቱ» የሚለው የግሪክ ቃል በቀጥታ «መውጣት» ወይም «መለየት» ማለት ነው። በዚህ አውድ በኢየሩሳሌም ስለሚፈጸመው የኢየሱስ መውጣት ይናገራል፤ ከሙሴ ጋር ባለው አውድ የዘፀአትን ሐሳብም ሊያስታውስ ይችላል።
    reason: ἔξοδος ከ«ሞት» የሰፋ ቃል ሲሆን፣ መሠረታዊውን ‘መውጣት/መለየት’ ትርጉም እና በዚህ አውድ ሊኖር የሚችለውን የዘፀአት ማስተጋባት ሳይወስን ያብራራል።
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: በክብር ተገልጠው
  rationale: የመታየትን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል፤ ἐν δόξῃንም ‘በክብር’ ብሎ በቅርብ ይከተላል።
- source_word: ἔλεγον
  choice: ይነጋገሩ ነበር
  rationale: ያልተቋረጠ የንግግር ተግባርን የሚያመለክተውን ያልተፈጸመ የግስ ጊዜ ያንጸባርቃል።
- source_word: ἔξοδον
  choice: መውጣቱ
  rationale: ቀጥተኛውን ‘መውጣት/ departure’ ሐሳብ ይጠብቃል፤ ቃሉ ሞቱን፣ ትንሣኤውንና ዕርገቱን በስፋት ሊያመለክት የሚችለውን ጥልቅ አውድ ሳይዘጋ ይተዋል።
- source_word: ἤμελλεν πληροῦν
  choice: ሊፈጽመው ስላለው
  rationale: ἤμελλεν የሚያሳየውን ቅርብ የወደፊት ተግባርና πληροῦν የሚያሳየውን ፍጻሜ አንድ ላይ ያቀርባል።
theological_decisions:
