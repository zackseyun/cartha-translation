  alternative: ሞቱ
  rationale: ‘ሞቱ’ ብቻ ማለት የግሪኩን ምስላዊና ሰፊ አንድምታ ያጠባል፤ ‘መውጣቱ’ የዘፀአትን ጥላ እና የኢየሱስን መከራ፣ ሞትና ከዚያ በኋላ ያለውን ክስተት ሳይወስን ይጠብቃል።
- issue: πληροῦν ከ‘መውጣት’ ጋር ያለው ያልተለመደ ጥምረት
  choice: መውጣቱን ሊፈጽም
  alternative: ሊደርስበት / ሊያከናውን
  rationale: ምንጩ የሚያቀርበውን የመለኮታዊ እቅድ ፍጻሜ አንድምታ ይጠብቃል፣ ያልተለመደውንም አገላለጽ በማለስለስ አያጠፋውም።
