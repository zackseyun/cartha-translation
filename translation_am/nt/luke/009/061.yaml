reference: Luke 9:61
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: am
  text: ሌላ ሰውም፣ “ጌታ ሆይ፣ እከተልሃለሁ፤ ነገር ግን አስቀድሜ በቤቴ ያሉትን ልሰናበት ፍቀድልኝ” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: ሌላውም
  rationale: የቀደመውን ውይይት በማያያዝ ከቀደሙት ሰዎች የተለየ ተጨማሪ ሰው መናገሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἀκολουθήσω σοι
  choice: እከተልሃለሁ
  rationale: የወደፊት ጊዜው ግስ ተናጋሪው ኢየሱስን ለመከተል የገለጠውን ውሳኔ ወይም ፈቃድ ይጠብቃል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ የቀረበውን የአክብሮት አድራሻ እና ሊኖረው የሚችለውን ሰፊ ሥነ መለኮታዊ ክብደት ሳያጠብ ያቆያል።
- source_word: πρῶτον
  choice: አስቀድሜ
  rationale: ድርጊቱ ከመከተሉ በፊት እንዲፈጸም የጠየቀውን ቅደም ተከተል ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἐπίτρεψόν μοι
  choice: ፍቀድልኝ
  rationale: ቀጥተኛ ትእዛዛዊ ቅርጹን እንደ ፈቃድ ጥያቄ በግልጽና በክብር ያቀርባል።
- source_word: ἀποτάξασθαι
  choice: እንድሰናበት
  rationale: በዚህ አውድ ሰዎችን ተሰናብቶ መለየትን ይገልጣል፤ የአማርኛው አጸፋዊ ግስም ይህን በተፈጥሯዊነት ያስተላልፋል።
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: በቤቴ ያሉትን
  rationale: በቤቱ ያሉትን ወይም ከቤቱ የሚዛመዱትን ሰዎች ያመለክታል፤ ‘ቤተሰቦቼን’ ብሎ ከግሪኩ በላይ ሳይወስን ተፈጥሯዊ አማርኛ ይሰጣል።
theological_decisions:
- issue: ኢየሱስን κύριε ብሎ መጥራቱ
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ፤ ጌታዬ
  rationale: ቃሉ ከአክብሮት መጠሪያ እስከ ሙሉ የጌትነት እውቅና ሊደርስ የሚችል ስፋት አለው። ‘ጌታ ሆይ’ ይህን ውጥረት ይጠብቃል፤ ‘መምህር’ ወይም ተራ የክብር መጠሪያ ብቻ አድርጎ አያጠበውም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛ የንግግር ሥርዓትን ለማሳመር መጥሪያው ‘ጌታ ሆይ’ በንግግሩ መጀመሪያ ተቀምጧል። ትርጉሙ ያለ ግርጌ ማስታወሻ ግልጽ ስለሆነ ማስታወሻ አልተጨመረም።
