  text: የአንድ አራተኛ ክፍል ገዥው ሄሮድ እየተከናወኑ ስላሉት ነገሮች ሁሉ ሰማ፤ አንዳንዶች ዮሐንስ ከሙታን እንደተነሣ[a] ይሉ ስለነበርም ግራ ተጋባ፣
  philosophy: optimal-equivalence
  footnotes:
