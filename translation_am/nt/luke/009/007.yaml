lexical_decisions:
- source_word: Ἤκουσεν
  choice: ሰማ
  rationale: ከቀጥተኛው ተሳቢ ‘ይደረግ የነበረውን ሁሉ’ ጋር ‘ሰማ’ በአማርኛ በተፈጥሮ ስለ ሁኔታዎቹ ዜና መድረሱን ያመለክታል።
- source_word: δὲ
  choice: —
  rationale: ይህ ቀላል የትረካ ማያያዣ ነው፤ ግልጽ የጊዜ ወይም የተቃርኖ ቃል ሳይጨመር የአማርኛው የአረፍተ ነገር ፍሰት አገልግሎቱን ይሸከማል።
- source_word: ὁ τετραάρχης
  choice: የአራተኛው ክፍል ገዥ
  rationale: ታሪካዊውን የፖለቲካ ማዕረግ ትርጉም በቀላሉ ያስረዳል፤ ‘ንጉሥ’ ወይም አጠቃላይ ‘ገዥ’ ብቻ በማለት አያደበዝዘውም።
- source_word: τὰ γινόμενα πάντα
  choice: ይደረግ የነበረውን ሁሉ
  rationale: በዚያን ጊዜ እየተከናወኑ የነበሩትን ነገሮች በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διηπόρει
  choice: ግራ ተጋባ
  rationale: ቃሉ የሚገልጸውን መደናገርና ምን እንደሚያስብ ማጣት በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: አንዳንዶች … ይናገሩ ስለነበር
  rationale: የምክንያት ግንኙነቱንና ‘አንዳንዶች’ የሚለውን ያቆያል፤ የግሪኩን ተገብሮ አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ ንቁ አወቃቀር ይገልጣል።
- source_word: ἠγέρθη
  choice: እንደተነሣ
  rationale: የትንሣኤን ትርጉም በተለመደ አማርኛ ያቀርባል፤ የግሪኩ ቅርጽ ተገብሮ መሆኑ በማስታወሻው ተገልጿል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: የትንሣኤ ንግግርን የሚገልጽ የተለመደና ትክክለኛ የአማርኛ አባባል ነው።
