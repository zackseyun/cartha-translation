    text: ወይም፣ “ዮሐንስ ከሙታን ተነሥቶ ነበር።” የግሪኩ ግስ ተገብሮ ነው፤ ቃል በቃል፣ “ከሙታን ተነሥቶ ነበር” የሚል ነው።
