source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: am
  text: ለሌላ ሰው ደግሞ፣ “ተከተለኝ” አለው። እርሱ ግን፣ “ጌታ ሆይ፣ አስቀድሜ ሄጄ አባቴን እንድቀብር ፍቀድልኝ” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: ሌላ ሰው
  rationale: የተለየ ሌላ ሰው የሚለውን የትርጉም ክልል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ጾታውን ወይም ማንነቱን ከጽሑፉ በላይ አይወስንም።
- source_word: Ἀκολούθει μοι
  choice: ተከተለኝ
  rationale: የግሪክኛውን ትእዛዝ በአማርኛ ቀጥተኛና የተለመደ አገላለጽ ያቀርባል፤ የአሁን ጊዜ ትእዛዙን ‘መከተልህን ቀጥል’ ብሎ ከሚገባው በላይ አይተረጉምም።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛ ጥሪን በተፈጥሯዊ አማርኛ ያሳያል፤ የአክብሮት አነጋገርና ሊኖረው የሚችለውን ክርስቶሳዊ ክብደት አብሮ ይጠብቃል።
- source_word: ἐπίτρεψόν μοι
  choice: ፍቀድልኝ
  rationale: ፈቃድ የመጠየቁን ትርጉም በአጭር፣ በግልጽና በክብር ያለው አማርኛ ይገልጻል።
- source_word: ἀπελθόντι πρῶτον
  choice: አስቀድሜ ሄጄ
  rationale: መጀመሪያ መሄድን ከዚያም መቅበርን የሚያሳየውን የድርጊት ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: θάψαι τὸν πατέρα μου
  choice: አባቴን እንድቀብር
  rationale: የግሪክኛውን ቀጥተኛ ፍቺ ይሰጣል፤ አባቱ አስቀድሞ መሞቱን ወይም ጥያቄው ሌላ ባህላዊ ግዴታን ማመልከቱን በጽሑፉ ላይ አይጨምርም።
theological_decisions:
- issue: ኢየሱስን Κύριε ብሎ መጥራት
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ / ጌታዬ
  rationale: “ጌታ ሆይ” የአክብሮት ጥሪና በሉቃስ ትረካ ውስጥ ያለውን ሥነ መለኮታዊ ድምፅ ሳይለያይ ይጠብቃል፤ “መምህር” የκύριοςን የተለመደ ትርጉም ያጠባል።
- issue: አባቱን ለመቅበር የቀረበው ጥያቄ ምን ሁኔታን እንደሚያመለክት
  choice: ጽሑፉ እንዳለ ቀጥተኛ የቀብር ጥያቄ ሆኖ ተጠብቋል
  alternative: አባቱ እስኪሞት ድረስ ቤት ለመቆየት የቀረበ ጥያቄ ነው ብሎ መተርጎም
  rationale: የግሪክኛው ጽሑፍ የአባቱን ወቅታዊ ሁኔታ አይገልጽም፤ ስለዚህ ትርጉሙ ያለውን አሻሚነት ሳይፈታ ይተዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። በእንግሊዝኛው የምክክር ጽሑፍ ያለው [a] ምልክት ከማስታወሻው ይዘት ጋር ቦታው አይዛመድም፤ የቀረበውም አማራጭ በአማርኛ “ፍቀድልኝ” ውስጥ በተፈጥሮ ስለተካተተ የማያስፈልግ የግርጌ ማስታወሻ አልተጨመረም።
