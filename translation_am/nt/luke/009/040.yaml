  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: am
  text: ያወጡት ዘንድ ደቀ መዛሙርትህን ለመንኳቸው፤ ነገር ግን አልቻሉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθην
  choice: ለመንኳቸው
  rationale: ግሱ ተራ ጥያቄን ሳይሆን አጥብቆ መለመንን ያመለክታል፤ «ለመንኳቸው» የአባቱን አጣዳፊ ልመና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν μαθητῶν σου
  choice: ደቀ መዛሙርትህን
  rationale: በወንጌላት ዐውድ μαθητής የመምህርና የተማሪ ግንኙነትን ያመለክታል፤ «ደቀ መዛሙርት» በአማርኛ የተለመደና ግልጽ የአዲስ ኪዳን ቃል ነው።
- source_word: ἵνα ἐκβάλωσιν
  choice: እንዲያወጡት
  rationale: ἵνα ከአገናዛቢ ግስ ጋር የልመናውን ዓላማ ይገልጣል፤ ἐκβάλλω በዚህ ዐውድ መንፈስን ከሰው ማስወጣትን ያመለክታል።
- source_word: αὐτό
  choice: እሱን … እንዲያወጡት
  rationale: የግሪኩ ገለልተኛ ተውላጠ ስም በአቅራቢያው ዐውድ ያለውን πνεῦμα ሊያመለክት ይችላል። አማርኛ የገለልተኛ ፆታ ተውላጠ ስም ስለሌለው «እሱን» ተመርጧል፤ የልጁ ማጣቀሻ የመሆን አማራጭ በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἠδυνήθησαν
  choice: አልቻሉም
  rationale: δύναμαι ችሎታን ወይም አቅምን ይገልጣል፤ «አልቻሉም» ትርጉሙን በአጭርና ተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በአጋንንት ማስወጣት ዐውድ የαὐτό ማጣቀሻ
  choice: ተውላጠ ስሙ መንፈሱን እንደሚያመለክት በዋናው ጽሑፍ «እሱን … እንዲያወጡት» ተተርጉሟል።
  alternative: ተውላጠ ስሙ የተጎዳውን ልጅ ሊያመለክት ይችላል።
  rationale: ἐκβάλλω በእንዲህ ዐውድ በተለምዶ መንፈስን እንደ ቀጥተኛ ተሳቢ ይወስዳል፣ ገለልተኛው αὐτόም በዐውዱ ካለው πνεῦμα ጋር በሰዋስው ይስማማል። ሆኖም ተውላጠ ስሙ በቅርጹ ብቻ ማጣቀሻውን ሙሉ በሙሉ ስለማይወስን፣ ሌላው አማራጭ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ደቀ መዛሙርት» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ «ለመንኳቸው» አስቸኳይነቱን ሲያስተላልፍ «አልቻሉም» ደግሞ ተፈጥሯዊና ቀጥተኛ ነው።
