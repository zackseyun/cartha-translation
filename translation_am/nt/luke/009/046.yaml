  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: am
  text: ከዚያም ከእነርሱ ማን ታላቅ ሊሆን እንደሚችል ክርክር በመካከላቸው ተነሣ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነርሱ ማን ታላቅ ሊሆን እንደሚችል አሳብ (ወይም ውይይት) በመካከላቸው ተነሣ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: ተነሣ
  rationale: ቃሉ በቀጥታ ‘ገባ’ ማለት ቢሆንም፣ ከδιαλογισμός ጋር ያለውን ፈሊጣዊ አገላለጽ በተፈጥሯዊ አማርኛ ‘ተነሣ’ በማለት መግለጽ ይሻላል።
- source_word: δὲ
  choice: ከዚያም
  rationale: የትረካውን ቀጣይነት በቀላሉ የሚያመለክት አያያዥ ነው።
- source_word: διαλογισμὸς
  choice: ክርክር
  rationale: ቃሉ ውስጣዊ አሳብን፣ ውይይትን ወይም ክርክርን ሊያመለክት ይችላል፤ ማን ታላቅ እንደሆነ የሚመለከተው ፉክክር ባለበት ዐውድ ‘ክርክር’ ተስማሚ ነው።
- source_word: ἐν αὐτοῖς
  choice: በመካከላቸው
  rationale: በቀጥታ ‘በእነርሱ ውስጥ’ ሊባል ቢችልም፣ በቡድኑ ውስጥ የተከሰተን ነገር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ τίς ἂν εἴη
  choice: ማን ... ሊሆን እንደሚችል
  rationale: የክርክሩን ይዘት የሚያስተዋውቀውን ቀጥተኛ ያልሆነ ጥያቄና የἄν ከoptative ጋር ያለውን የእድል/የተቻለነት ስሜት ይጠብቃል።
- source_word: μείζων
  choice: ታላቅ
  rationale: የግሪክ ቃሉ በቅርጹ አንጻራዊ ‘የበለጠ ታላቅ’ ቢሆንም፣ በቡድኑ ውስጥ ከሁሉ የላቀውን ደረጃ በአማርኛ ‘ታላቅ’ የሚለው በቂና ተፈጥሯዊ ነው።
- source_word: αὐτῶν
  choice: ከእነርሱ
  rationale: ንጽጽሩ የሚደረግበትን የተወሰነ ቡድን በግልጽ ያመለክታል።
theological_decisions:
- issue: የደቀ መዛሙርቱ መስተጋብር ባሕርይ
  choice: ክርክር
  alternative: አሳብ ወይም ውይይት
