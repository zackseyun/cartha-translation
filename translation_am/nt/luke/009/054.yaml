  text: ደቀ መዛሙርቱ ያዕቆብና ዮሐንስ ይህን ባዩ ጊዜ፣ “ጌታ ሆይ፣ እሳት ከሰማይ ወርዶ እንዲበላቸው እንበል ዘንድ[a] ትፈልጋለህ?” አሉት።
