lexical_decisions:
- source_word: ἰδόντες
  choice: ይህን ባዩ ጊዜ
  rationale: የተፈጸመውን ድርጊት የሚገልጠው ቦዝ አንቀጽ በአማርኛ ተፈጥሯዊ በሆነ ጊዜያዊ አገላለጽ ተተርጉሟል፤ “ይህን” በቀደመው ቁጥር ያለውን የሳምራውያን እምቢታ ያመለክታል።
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: ደቀ መዛሙርቱ ያዕቆብና ዮሐንስ
  rationale: የግሪኩን ተያያዥ መለያ በተፈጥሯዊ አማርኛ ያቀርባል፤ ያዕቆብና ዮሐንስ ከደቀ መዛሙርቱ የትኞቹ እንደሆኑ ይለያል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ በቀጥታ የቀረበውን የክብር ጥሪ በመደበኛና በክብር የተሞላ አማርኛ ያስተላልፋል።
- source_word: θέλεις
  choice: ትፈልጋለህ?
  rationale: ቃሉ በዚህ አውድ ፈቃድንና ፍላጎትን ይገልጣል፤ ይህም ደቀ መዛሙርቱ ፈቃድ እየጠየቁ መሆናቸውን በግልጽ ያሳያል።
- source_word: εἴπωμεν
  choice: እንድናዝ
  rationale: ቀጥተኛው “እንድንል” በአማርኛ ከእሳት ጋር የማይፈስ ስለሆነ፣ በዚህ የመናገር ድርጊት ውስጥ ያለውን የትእዛዝ ኃይል “እንድናዝ” በማለት ተፈጥሯዊ በሆነ መንገድ ያቀርባል፤ ቀጥተኛው አገላለጽ በማስታወሻው ተጠብቋል።
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: እሳት ከሰማይ ወርዶ
  rationale: የግሪኩን ሕያው ምስልና የነቢያትን የፍርድ ቋንቋ በቀላልና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀναλῶσαι
  choice: እንዲበላቸው
  rationale: ግሱ ማጥፋትን ወይም ፈጽሞ መብላትን ሊያመለክት ይችላል፤ “እንዲበላቸው” የእሳቱን ምስል በቀጥታ ይጠብቃል።
- source_word: αὐτούς
  choice: -አቸው
  rationale: ብዙ ቁጥር ያለው ተሳቢ ተውላጠ ስም በግሱ ላይ ተዋሕዶ ቀደም ሲል የተጠቀሱትን የሳምራውያን መንደር ሰዎች ያመለክታል።
theological_decisions:
- issue: “አዩ” የሚለው ግስ ያልተገለጸ ተሳቢ
  choice: “ይህን” ተጨምሮ በቀደመው ቁጥር የተገለጸውን እምቢታ እንዲያመለክት ተደርጓል።
  alternative: “ያዕቆብና ዮሐንስም ባዩ ጊዜ” ብቻ ማለት።
  rationale: በግሪኩ ተሳቢው በግልጽ ባይጠቀስም ከአውዱ ይታወቃል፤ “ይህን” ማለት አዲስ ሐሳብ ሳይጨምር የትረካውን ግንኙነት ግልጽ ያደርጋል።
- issue: የደቀ መዛሙርቱ ሐሳብ የትእዛዝ ኃይል
  choice: “እንድናዝ” ተብሏል።
  alternative: “እሳት ከሰማይ እንዲወርድ እንድንል” ወይም “እሳትን ከሰማይ እንድንጠራ” ማለት።
  rationale: ግሪኩ λέγω የሚለውን “መናገር” የሚል ግስ ቢጠቀምም፣ ከተከታዩ የኢንፊኒቲቭ ግንባታ ጋር ሲነበብ ትእዛዝ የመስጠት ኃይል አለው። “እንድናዝ” ይህን ኃይል በተፈጥሯዊ አማርኛ ያሳያል፣ ግሪኩ ቃል በቃል የሚለው ግን በማስታወሻው ተገልጿል።
- issue: ἀναλῶσαι የሚለው ግስ ምስላዊና አጠቃላይ ትርጉም
  choice: የእሳትን ምስል ለመጠበቅ “እንዲበላቸው” ተብሏል።
  alternative: “እንዲያጠፋቸው” ማለት።
  rationale: ሁለቱም ትርጉሞች በቃሉ ውስጥ ሊኖሩ ይችላሉ፤ የተመረጠው አገላለጽ እሳት የሚበላ መሆኑን የሚያሳየውን ምስል ሳያጠፋ ፍርዱ ጥፋት እንደሚያመጣ ያሳያል።
