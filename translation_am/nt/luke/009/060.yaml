base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: am
  text: እርሱ ግን እንዲህ አለው፦ “ሙታን የራሳቸውን ሙታን እንዲቀብሩ ተዋቸው፤[a] አንተ ግን ሄደህ የእግዚአብሔርን መንግሥት አውጅ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የመጀመሪያው “ሙታን” ምናልባት ዘይቤያዊ ነው፤ ይኸውም በመንፈሳዊ ነገር ምላሽ የማይሰጡትን ያመለክታል። ሁለተኛው ግን በአካል የሞቱትን ያመለክታል። የግሪክ ጽሑፍ በሁለቱም ቦታ ተመሳሳይ ቃል ይጠቀማል፤ ትርጉሙም ይህን ድግግሞሽ ጠብቋል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: ተዋቸው
  rationale: የግስ ትእዛዙ ከተጠየቀው የቀብር ተግባር እንዲለይ የሚጠይቅ አጭርና ጠንካራ ትእዛዝ ነው።
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: ሙታን ... የራሳቸውን ሙታን
  rationale: በግሪክ ያለውን የአንድ ቃል ድግግሞሽና አስደንጋጭ ንጽጽር ይጠብቃል፤ የመጀመሪያውን ትርጉም በዋናው ጽሑፍ ውስጥ አይፈታውም።
- source_word: θάψαι
  choice: እንዲቀብሩ
  rationale: ከ‘ተዋቸው’ ጋር በተፈጥሮ የሚያያዝና የመቅበርን ተግባር በግልጽ የሚገልጽ አማርኛ ነው።
- source_word: ἑαυτῶν
  choice: የራሳቸውን
  rationale: የተውላጠ ስሙን አጽንዖት ጠብቆ ‘የራሳቸውን’ የሚለውን ኃይል ያስተላልፋል።
- source_word: ἀπελθὼν
  choice: ሄደህ
  rationale: ከዋናው ትእዛዝ በፊት ያለውን የድርጊት ቅደም ተከተል በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: διάγγελλε
  choice: አውጅ
  rationale: በይፋና በስፋት የማሳወቅን ሐሳብ የሚይዝ ጠንካራ የትእዛዝ ቃል ነው።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደ፣ የእግዚአብሔርን ንግሥናና ግዛት የሚያመለክት አገላለጽ ነው።
