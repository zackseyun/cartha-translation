    text: “በየመንደሩ” የሚለው “ከመንደር ወደ መንደር” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ አገላለጽ በመንደሮቹ መካከል እየተዘዋወሩ መሄዳቸውን ሊያጎላ ይችላል።
