source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: am
  text: እነሆም፣ ሁለት ሰዎች ከእርሱ ጋር ይነጋገሩ ነበር፤ እነርሱም ሙሴና ኤልያስ ነበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የሉቃስን ትኩረት ሳቢ የትረካ ምልክትና የድንገተኛ መታየት ስሜት ይጠብቃል፤ በዘመናዊ አማርኛም ግልጽ ነው።
- source_word: ἄνδρες δύο
  choice: ሁለት ሰዎች
  rationale: በዚህ አውድ ሙሴንና ኤልያስን የሚያመለክት ሲሆን፣ «ሁለት ሰዎች» ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: συνελάλουν
  choice: ይነጋገሩ ነበር
  rationale: የግሱን ቀጣይ ያለፈ ድርጊት እና የእርስ በርስ ውይይት ትርጉም ይጠብቃል።
- source_word: αὐτῷ
  choice: ከእርሱ ጋር
  rationale: ከσυλλαλέω ጋር ያለው የተቀባይ ቅጽ አብሮ መነጋገርን ያመለክታል፤ «ከእርሱ ጋር» ይህን የጋራ ውይይት በግልጽ ያሳያል።
- source_word: οἵτινες
  choice: እነርሱም
  rationale: ሁለቱን ሰዎች በቀጥታ ለመለየት ተፈጥሯዊ የአማርኛ አገባብ ነው፤ በዚህ አውድ ተጨማሪ አጽንዖት አያስፈልግም።
- source_word: Μωϋσῆς
  choice: ሙሴ
  rationale: በአማርኛ የተለመደውና የታወቀው የስሙ ቅርጽ ነው።
- source_word: Ἠλίας
  choice: ኤልያስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀውና የግሪኩን የስም ቅርጽ የሚያንጸባርቀው ነው።
theological_decisions:
- issue: በመለወጥ ትዕይንት የታዩት ሁለት ሰዎች ማንነት
  choice: ጥቅሱ ሁለቱን ሰዎች ሙሴና ኤልያስ ብሎ በቀጥታ ይለያቸዋል።
  alternative: ስለ ምሳሌያዊነታቸው ወይም ስለ ፍጻሜያዊ ሚናቸው ማብራሪያ መጨመር።
  rationale: የግሪኩ ጽሑፍ ቀጥተኛ መለያ ብቻ ይሰጣል፤ ትርጉሙም የማይገኝበትን ምሳሌያዊ ወይም ሥነ መለኮታዊ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። «እነሆ» የትረካውን ድንገተኛ ትኩረት ይጠብቃል፤ «ይነጋገሩ ነበር» ደግሞ ቀጣይ የነበረውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
