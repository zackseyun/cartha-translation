base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: am
  text: እርሱም ለሁሉ እንዲህ ይል ነበር፦ “ማንም ከእኔ በኋላ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ በየዕለቱም መስቀሉን ያንሣ፣ እኔንም ይከተል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ራሳቸውን ይካዱ፣ በየዕለቱም መስቀላቸውን ያንሡ፣ እኔንም ይከተሉ።” ግሪኩ አጠቃላይ ነጠላ አነጋገር (“ማንም ... እርሱ ... ራሱን”) ይጠቀማል፤ ዋናው ጽሑፍ ይህን ነጠላ አነጋገር ይወክላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ይል ነበር
  rationale: ያልተፈጸመውን የግሪክ ኢምፐርፌክት ገጽታ በተፈጥሯዊ አማርኛ ያሳያል፤ ንግግሩ ቀጣይ ወይም ተደጋጋሚ እንደነበር ሊያመለክት ይችላል።
- source_word: πρὸς πάντας
  choice: ለሁሉ
  rationale: ንግግሩ የተነገረላቸውን ሰዎች አጠቃላይ ወሰን በአጭርና በተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: Εἴ τις θέλει
  choice: ማንም ... ቢፈልግ
  rationale: τις ያለውን አጠቃላይና ያልተወሰነ ነጠላ ትርጉም ይይዛል፤ θέλειንም ያለ ተጨማሪ ትርጓሜ በተለመደው ‘መፈለግ’ ይተረጉማል።
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: ከእኔ በኋላ ሊመጣ
  rationale: የደቀ መዝሙርነትን ፈሊጣዊ ምስል ይጠብቃል፤ በመጨረሻው የተጠቀሰውን ‘መከተል’ ግስ ቀድሞ አይደግምም።
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: ራሱን ይካድ
  rationale: የሦስተኛ መደብ ትእዛዛዊ አነጋገሩንና የራስ ተውላጠ ስሙን በቀጥታ ይወክላል።
- source_word: ἀράτω
  choice: ይሸከም
  rationale: በመስቀል አውድ ‘ማንሳትና መሸከም’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘መስቀሉን ያንሣ’ የሚለው ቀጥተኛ አማራጭ ቢኖርም እዚህ ያነሰ ተፈጥሯዊ ነው።
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: መስቀሉን
  rationale: σταυρόςን በቀጥታ ‘መስቀል’ ብሎ ይጠብቃል፤ የሥቃይ፣ የሸክም ወይም የመሥዋዕት ፍቺን በትርጉሙ ውስጥ አያስገባም።
- source_word: καθ’ ἡμέραν
  choice: በየዕለቱ
  rationale: የሉቃስን የየቀኑ ቀጣይነት አጽንዖት በግልጽና በክቡር ዘመናዊ አገላለጽ ይጠብቃል።
- source_word: ἀκολουθείτω μοι
  choice: እኔንም ይከተል
  rationale: ሁለተኛውን የሦስተኛ መደብ ትእዛዝ በግልጽ ይወክላል፤ ለአማርኛ ተፈጥሯዊ የሆነውን ቀጥተኛ ተሳቢ ይጠቀማል።
theological_decisions:
- issue: በደቀ መዝሙርነት ውስጥ የ‘መስቀል’ ቋንቋ
  choice: ቃሉን በቀጥታ ‘መስቀል’ ብሎ ማቆየት
  alternative: ‘ሸክሙ’፣ ‘ሥቃዩ’ ወይም ‘መሥዋዕቱ’ ብሎ መፍታት
  rationale: σταυρός ተጨባጭ ቃል ሲሆን ምሳሌያዊና ሥነ መለኮታዊ ውጥረቱ በትርጉም መፍትሔ ሳይሰጠው መቆየት አለበት።
- issue: በግሪኩ ያለው አጠቃላይ ነጠላ አነጋገር
  choice: ‘ማንም’ በሚል አጠቃላይ ነጠላ መጀመርና ትእዛዞቹን በነጠላ ማቆየት
  alternative: በብዙ ቁጥር ‘ራሳቸውን ... መስቀላቸውን ... ይከተሉ’ ማለት
  rationale: የግሪኩ ያልተወሰነ ነጠላ በአማርኛ ‘ማንም’ በሚል ፆታ-አልባ ቃል በተፈጥሯዊ ሁኔታ ይወከላል። ቀጣዮቹ የወንድ ነጠላ ቅርጾች በአማርኛ ሰዋሰዋዊ ፆታን ቢያሳዩም እዚህ አጠቃላይ ወካይ ኃይል አላቸው፤ የፆታ ወሰን ለማስገባት አይደለም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘ዕለት’ የሚለው ቃል በዚህ መጽሐፍ ቅዱሳዊ አውድ ክቡር ቢሆንም ለዘመናዊ አንባቢ ግልጽ ነው። የግሪኩ ተደጋጋሚ/ቀጣይ ገጽታ፣ የነጠላ አጠቃላይ አነጋገርና የ‘መስቀል’ ምስል ተጠብቀዋል።
