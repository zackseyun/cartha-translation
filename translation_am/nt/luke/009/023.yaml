review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the imperfect ‘was saying,’ the universal audience, the generic singular conditional, self-denial, the daily qualifier, and following Jesus. However, ἀράτω specifically means ‘let [that person] take up/lift,’ whereas ይሸከም means ‘let [that person] carry/bear.’ The latter imports the subsequent bearing sense and does not preserve the verb’s stated action.
  naturalness: The wording is clear, idiomatic modern standard Amharic, and maintains an appropriately dignified register. መስቀሉን ያንሣ is also natural and precise in this established idiom.
  terminology: መስቀል correctly retains the concrete Greek σταυρός without interpretive paraphrase. The singular generic construction is suitably maintained with ማንም and singular verbal forms.
  issues:
  - severity: medium
    issue: ይሸከም renders ἀράτω too broadly as ‘carry/bear.’
    rationale: ἀράτω is an aorist imperative of αἴρω and calls for taking up/lifting the cross. Rendering it as ‘carry’ changes the lexical action, even though carrying may be contextually associated with a cross.
  revised_text: እርሱም ለሁሉ እንዲህ ይል ነበር፦ “ማንም ከእኔ በኋላ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ በየዕለቱም መስቀሉን ያንሣ፣ እኔንም ይከተል።”[a]
