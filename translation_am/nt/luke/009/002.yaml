  choice: የእግዚአብሔር መንግሥት
  alternative: የእግዚአብሔር ንግሥና/አገዛዝ
  rationale: ሐረጉ የእግዚአብሔርን ንጉሣዊ አገዛዝም ሆነ የግዛቱን ስፋት ሊያጎላ ይችላል። «መንግሥት» ይህን ሥነ መለኮታዊ ስፋት ሳያጠብ ይጠብቃል፤ አማራጩም በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ ሁለት ዓላማዎች «እንዲያውጁና ... እንዲፈውሱ» በሚለው ትይዩ አወቃቀር ተጠብቀዋል።
