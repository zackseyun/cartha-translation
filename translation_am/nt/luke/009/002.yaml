  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: am
  text: የእግዚአብሔርን መንግሥት[a] እንዲያውጁና የታመሙትን እንዲፈውሱ ላካቸው።
  philosophy: optimal-equivalence
  footnotes:
