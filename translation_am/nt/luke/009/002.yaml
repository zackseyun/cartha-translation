    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ላካቸው
  rationale: የግሥ ቅርጹ ኢየሱስ ለተልእኮ እንደላካቸው ይገልጣል፤ በአማርኛ «ላካቸው» ይህን በተፈጥሯዊና አጭር መንገድ ያስተላልፋል።
- source_word: κηρύσσειν
  choice: እንዲያውጁ
  rationale: κηρύσσω በይፋ ማወጅን ያመለክታል፤ «እንዲያውጁ» የአዋጅነቱን ኃይል ሳያጠብ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: «መንግሥት» የግሪኩን ሐረግ ሰፊ ትርጉም—የንጉሥ አገዛዝንም ሆነ ግዛቱን—የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ አቻ ነው።
- source_word: ἰᾶσθαι
  choice: እንዲፈውሱ
  rationale: በዚህ የአካል ሕመም ዐውድ ἰάομαι መፈወስን ያመለክታል፤ «መፈወስ» ትክክለኛና የተፈጥሮ አማርኛ ነው።
- source_word: τοὺς ἀσθενεῖς
  choice: የታመሙትን
  rationale: ἀσθενής በሰፊው «ደካማ» ማለት ቢችልም፣ ከመፈወስ ጋር ባለው ዐውድ የታመሙ ሰዎችን ይጠቁማል።
theological_decisions:
