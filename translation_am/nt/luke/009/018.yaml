  text: እንዲህም ሆነ፤ እርሱ ብቻውን[a] እየጸለየ ሳለ፣ ደቀ መዛሙርቱ ከእርሱ ጋር ነበሩ። እርሱም፣ “ሕዝቡ እኔ ማን እንደሆንሁ ይላል?” ብሎ ጠየቃቸው።
  philosophy: optimal-equivalence
  footnotes:
