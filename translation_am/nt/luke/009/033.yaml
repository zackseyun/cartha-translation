  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: am
  text: እነርሱም ከእርሱ ሲለዩ፣ ጴጥሮስ ኢየሱስን እንዲህ አለው፤ “መምህር ሆይ፣ እዚህ መሆናችን መልካም ነው። ሦስት መጠለያዎችን[a] እንሥራ፤ አንዱን ለአንተ፣ አንዱን ለሙሴ፣ አንዱንም ለኤልያስ።” እርሱ ግን ምን እንደሚናገር አያውቅም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ዳሶች፣” “ድንኳኖች፣” ወይም በባህላዊ አተረጓጎም “ማደሪያዎች።” የግሪኩ ቃል ጊዜያዊ መጠለያዎችን ያመለክታል፤ ከዳስ በዓል ጋር የተያያዘ መጽሐፍ ቅዱሳዊ ምስልንም ሊያስታውስ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: እነርሱም ከእርሱ ሲለዩ
  rationale: የግሪኩን የትረካ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ እነርሱ ሙሴና ኤልያስ መሆናቸውንና ከኢየሱስ የመለየታቸውን አቅጣጫ ይጠብቃል።
- source_word: Ἐπιστάτα
  choice: ጌታ ሆይ
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ የሆነና ሥልጣንን የሚያመለክት የአክብሮት ጥሪ ነው፤ “መምህር” ከሚለው διδάσκαλος ጋር ቃሉን አያመሳስለውም።
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: እዚህ መሆናችን መልካም ነው
  rationale: የκαλόνን ቀጥተኛ የግምገማ ሐሳብ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ποιήσωμεν
  choice: እንሥራ
  rationale: የአንደኛ መደብ ብዙ ቁጥር አበረታች ንዑስ አንቀጽን እንደ ቀጥተኛ ሐሳብ ያቀርባል።
- source_word: σκηνὰς
  choice: መጠለያዎችን
  rationale: ጊዜያዊ መጠለያዎችን በግልጽ ያመለክታል፤ ጽሑፉ በግልጽ ያልጠቀሰውን የዳስ በዓል ትርጓሜ በዋናው ጽሑፍ ላይ አያስገድድም።
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: ምን እንደሚናገር አያውቅም ነበር
  rationale: ጴጥሮስ በዚያ ጊዜ የተናገረውን አለማስተዋሉን ይገልጣል፤ የλέγειን ቀጣይ ገጽታም ይጠብቃል።
theological_decisions:
- issue: በመለወጥ ትዕይንቱ ውስጥ σκηνάς ሊኖረው የሚችለው የዳስ በዓልና የማደሪያ ምስል
  choice: መጠለያዎችን
  alternative: ዳሶችን፣ ድንኳኖችን፣ ማደሪያዎችን
  rationale: ጥቅሱ መዋቅሮቹን ከዳስ በዓል ወይም ከማደሪያው ትውፊት ጋር በግልጽ አያያይዛቸውም። ስለዚህ ዋናው ጽሑፍ ገለልተኛና ትክክለኛ ቃል ይጠቀማል፤ ሊኖር የሚችለው መጽሐፍ ቅዱሳዊ ጥላ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የትረካ ፈሊጥ በተፈጥሯዊ አማርኛ ተቀርቧል፤ ሊኖር የሚችለው የበዓል ጥላ ግን ሳይጠፋ በማስታወሻ ተቀምጧል።
