lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህም
  rationale: የቀደመው ንግግር ያስከተለውን ውጤት ወይም መደምደሚያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτοὺς ἡμᾶς
  choice: እኛ ራሳችን
  rationale: ጳውሎስንና አገልጋይ ጓደኞቹን የሚያጎላውን አገላለጽ ይጠብቃል።
- source_word: ἐν ὑμῖν … ἐγκαυχᾶσθαι
  choice: ስለ እናንተ … እንመካለን
  rationale: ἐν ከመመካት ግስ ጋር የመመካቱን መሠረት ወይም ነገር ያመለክታል፤ ይህ አገላለጽ ጠንካራውን ንግግር ሳያለዝብ ተፈጥሯዊ ነው።
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: በእግዚአብሔር ቤተ ክርስቲያናት መካከል
  rationale: መመካቱ የተከናወነበትን ማኅበራዊ ክልልና የጉባኤዎቹን ብዙ ቁጥር ይጠብቃል።
- source_word: ὑπομονῆς
  choice: ጽናት
  rationale: በግፊትና በመከራ ሥር በትዕግሥት መቆየትን በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: πίστεως
  choice: እምነት
  rationale: የቃሉን መደበኛ ትርጉም ይጠብቃል፤ በዚህ የመከራ አውድ ታማኝነትንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: በ…ስደቶቻችሁና መከራዎቻችሁ ሁሉ
  rationale: ጽናታቸውና እምነታቸው የታየበትን ሁኔታ ያሳያል፤ διωγμός የጠላትነት ስደትን፣ θλῖψις ደግሞ ሰፊውን ጫናና መከራ ለይተው ይገልጣሉ።
- source_word: αἷς ἀνέχεσθε
  choice: በምትታገሷቸው
  rationale: በአሁኑ ጊዜ ቀጥለው እየተሸከሟቸው ያሉትን ስደቶችና መከራዎች በተፈጥሯዊ አማርኛ ይገልጣል።
