  text: ወንድሞች[a] ሆይ፣ ስለእናንተ ሁልጊዜ ለእግዚአብሔር ምስጋና ልናቀርብ ይገባናል፤ ይህም ተገቢ ነው፣ ምክንያቱም እምነታችሁ[b] እጅግ እያደገ፣ እያንዳንዳችሁም ለእርስ በርሳችሁ ያላችሁ ፍቅር እየበዛ[c] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ወንድሞችና እህቶች።” በግሪኩ “ወንድሞች” የሚል ቃል ሲሆን፣ መላውን የአማኞች ማኅበር በአካታች ሁኔታ ሊጠራ ይችላል።
