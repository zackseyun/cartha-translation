  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: am
  text: ይህም በአምላካችንና ጌታ ኢየሱስ መሲሕ ጸጋ መሠረት የጌታችን ኢየሱስ ስም በእናንተ[a] እንዲከብር፣ እናንተም በእርሱ እንድትከብሩ ዘንድ ነው።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመካከላችሁ።” የግሪኩ መስተዋድድ በዚህ አውድ “በእናንተ” ወይም “በመካከላችሁ” ማለት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: የመጨረሻው ሐረግ “አምላካችን” እና “ጌታ ኢየሱስ መሲሕ” በጥብቅ ተያይዘው አንድ አካልን እንደሚያመለክቱ ሊገነዘብ ይችላል፤ ወይም ሁለት የተለያዩ አካላትን እንደሚያመለክቱ ሊገነዘብ ይችላል። ትርጉሙ የግሪኩን ጥብቅ አወቃቀር ሳይፈታ ይጠብቃል።
    reason: alternative_reading
