- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: እናንተም በእርሱ እንድትከብሩ
  rationale: የሁለቱን ወገኖች ተመጣጣኝ አወቃቀር ይጠብቃል፤ αὐτῷ በተፈጥሮ ጌታ ኢየሱስን እንደሚያመለክት በወንድ ጾታ ‘እርሱ’ ተተርጉሟል።
