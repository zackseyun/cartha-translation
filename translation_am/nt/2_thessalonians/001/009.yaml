- issue: «የዘላለም ጥፋት» የሚያመለክተው
  choice: የግሪኩን አገላለጽ ሳይገድቡ «የዘላለም ጥፋት» ብሎ መተርጎም
  alternative: ቃሉን ወይም ፍጹም መጥፋትን ወይም ዘላለማዊ ሕሊናዊ ሥቃይን እንደሚወስን መተርጎም
  rationale: ሐረጉ ቅጣቱን ይገልጻል፤ የመጨረሻ ቅጣትን ትክክለኛ ሁኔታ በሚመለከተው ሰፊ የሥነ መለኮት ክርክር ግን በራሱ የተወሰነ መደምደሚያ አይሰጥም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ከጌታ ፊት» የመጽሐፍ ቅዱስን ክብር ያለው ፈሊጣዊ አገላለጽ ሲጠብቅ፣ «ተለይተው» ለዘመናዊ አንባቢ የታሰበውን ግንኙነት ግልጽ ያደርጋል።
