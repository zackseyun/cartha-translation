  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: am
  text: እነዚህ ከጌታ ፊትና ከኃይሉ ክብር ተለይተው፣ የዘላለም ጥፋት የሆነውን ቅጣት ይከፍላሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከጌታ ፊትና ከኃይሉ ክብር የሚመጣ የዘላለም ጥፋት የሆነውን ቅጣት ይከፍላሉ።» የግሪኩ መስተዋድድ መለየትን («ከ… ተለይተው») ወይም ምንጭን («ከ… የሚመጣ») ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: እነዚህ
  rationale: በቀደመው ቁጥር የተጠቀሱትን ተቃዋሚዎች መልሶ ያመለክታል፤ «እነዚህ» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δίκην τίσουσιν
  choice: ቅጣትን ይከፍላሉ
  rationale: የግሪኩ ጥምር አገላለጽ በፍርድ የተወሰነን ቅጣት መቀበል ወይም መክፈል ያመለክታል፤ ይህ ትርጉም ሕጋዊ የፍርድ ገጽታውን ይጠብቃል።
- source_word: ὄλεθρον
  choice: ጥፋት
  rationale: ቃሉ በዚህ የፍርድ አውድ ከባድ ውድመትን ወይም ጥፋትን ያመለክታል፤ «ጥፋት» የቅጣቱን ትክክለኛ ባሕርይ ከጽሑፉ በላይ ሳይወስን ክብደቱን ይጠብቃል።
- source_word: αἰώνιον
  choice: የዘላለም
  rationale: በዚህ የመጨረሻ ፍርድ አውድ ዘላቂነትንና ፍጻሜያዊነትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: ከጌታ ፊት ... ተለይተው
  rationale: πρόσωπον ቃል በቃል «ፊት» ሲሆን በዚህ ፈሊጥ መገኘትን ያመለክታል። ἀπόን የመለየት ትርጉም በመስጠት «ተለይተው» ተጨምሯል፤ ሌላው ሰዋሰዋዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: ከኃይሉ ክብር
  rationale: δόξα «ክብር»፣ ἰσχύς «ኃይል» ተብለው ተተርጉመዋል፤ የዘር አገናኙ የጌታ ኃይል የሚገለጥበትን ክብር ሳያብራራ ይጠብቃል።
theological_decisions:
- issue: በመጨረሻው ፍርድ አውድ የἀπό ትርጉም
  choice: መለየት/መገለል፤ «ከጌታ ፊትና ከኃይሉ ክብር ተለይተው»
  alternative: ምንጭ/መነሻ፤ ጥፋቱ ከጌታ ፊትና ከኃይሉ ክብር ይመጣል
