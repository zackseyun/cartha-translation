  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: am
  text: ከእግዚአብሔር አብና ከጌታ ኢየሱስ መሲሕ[a] ጸጋና ሰላም ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός “ክርስቶስ” ወይም “መሲሕ” ተብሎ ሊተረጎም ይችላል፤ እዚህ “መሲሕ” የሚለው የማዕረጉን ትርጉም ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ ሰላምታዎች ውስጥ የሰላምታውንም የሥነ መለኮታዊውንም ክብደት የሚጠብቅ የተለመደ አማርኛ ቃል ነው።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: በቡራኬና በሰላምታ አገላለጽ ውስጥ የዳቲቭን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የግሪኩን መሠረታዊ ፍቺና የደኅንነትና የሙሉነት ዳራውን የሚጠብቅ መደበኛ ትርጉም ነው።
- source_word: ἀπὸ
  choice: ከ…
  rationale: የጸጋና የሰላም ምንጭ ወይም መነሻ ማን እንደሆነ በግልጽ ያሳያል።
- source_word: θεοῦ πατρὸς
  choice: እግዚአብሔር አባታችን
  rationale: በታተመው ግሪክ ἡμῶν ባይኖርም፣ የጳውሎስ የተለመደ ሰላምታ አገላለጽና ተፈጥሯዊ አማርኛ ‘አባታችን’ የሚለውን ዘመዳዊ አገላለጽ ይደግፋሉ።
- source_word: κυρίου
  choice: ጌታ
  rationale: የማዕረግ ኃይሉንና በአዲስ ኪዳን የተለመደውን አጠቃቀም ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ መሆኑን ‘መሲሕ’ በቀጥታ ይገልጣል፤ ‘ክርስቶስ’ የተለመደ አማራጭ ሆኖ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በታተመው ግሪክ ያልተገለጸውን ‘ችን’ ከ‘አባት’ ጋር መጨመር
  choice: እግዚአብሔር አባታችን
  alternative: እግዚአብሔር አብ
  rationale: ግሪኩ θεοῦ πατρὸς ብሎ ያነባል፤ ሆኖም የጳውሎስ የሰላምታ ቀመርና በዘመናዊ አማርኛ ያለው ተፈጥሯዊ አገላለጽ ‘አባታችን’ን ይደግፋሉ። ይህም በዐውዱ ያለውን ዘመዳዊ ፍቺ ያስተላልፋል እንጂ አዲስ የእምነት አቋም አይጨምርም።
- issue: Χριστόςን እንደ ትርጉም ወይም እንደ ተለምዶአዊ የድምፅ ዝውውር ማቅረብ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ‘መሲሕ’ የΧριστόςን የማዕረግ ትርጉም፣ ማለትም ‘የተቀባው’ የሚለውን ይጠብቃል፤ ‘ክርስቶስ’ ግን በአማርኛ በስፋት የታወቀ ባሕላዊ አጠራር ስለሆነ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ የቡራኬ አገላለጽ ተጠቅሟል። በግሪክ ግስ ባይገለጽም፣ በአማርኛ የሰላምታ ቀመሩን ለማሟላት ‘ይሁን’ ተጨምሯል።
