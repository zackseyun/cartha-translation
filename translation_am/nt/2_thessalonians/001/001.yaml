base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: am
  text: ጳውሎስ፣ ስልዋኖስና ጢሞቴዎስ፣ በእግዚአብሔር በአባታችንና በጌታ ኢየሱስ መሲሑ[a] ውስጥ ላለችው ለተሰሎንቄ ሰዎች ቤተ ክርስቲያን፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός የሚለው ማዕረግ “መሲሕ” ወይም በባህላዊው አጠራር “ክርስቶስ” ተብሎ ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: ጳውሎስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይጠብቃል።
- source_word: Σιλουανὸς
  choice: ስልዋኖስ
  rationale: በግሪክ ምንጩ ያለውን ሙሉ ስም በቀጥታ ያቀርባል፤ ወደ አጭሩ ‘ሲላስ’ አልተስተካከለም።
- source_word: Τιμόθεος
  choice: ጢሞቴዎስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἐκκλησίᾳ
  choice: ቤተ ክርስቲያን
  rationale: በጳውሎስ ደብዳቤዎች የሚታየውን የተሰበሰበ የአማኞች ማኅበር በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: Θεσσαλονικέων
  choice: የተሰሎንቄ ሰዎች
  rationale: የግሪኩን የሕዝብ መጠሪያ ይጠብቃል፤ ቃሉን በቀጥታ ‘በተሰሎንቄ’ ወደሚል የቦታ ሐረግ አይለውጠውም።
- source_word: ἐν
  choice: በ…ለምትኖር
  rationale: ቤተ ክርስቲያኒቱ ከእግዚአብሔርና ከጌታ ኢየሱስ ጋር ያላትን የሕልውና፣ የኅብረት ወይም የመመሥረት ግንኙነት ሳይወስን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θεῷ πατρὶ ἡμῶν
  choice: አባታችን እግዚአብሔር
  rationale: ἡμῶν የሚለውን ግልጽ ባለቤትነት ‘አባታችን’ በማለት ይጠብቃል።
- source_word: κυρίῳ
  choice: ጌታ
  rationale: እዚህ ለኢየሱስ የተሰጠውን κύριος የክብርና የሥልጣን ማዕረግ በተለመደው አማርኛ ያቀርባል።
- source_word: Χριστῷ
  choice: መሲሕ
  rationale: Χριστός እዚህ ከኢየሱስ ስም ጋር የተያያዘ ማዕረግ ስለሆነ ‘መሲሕ’ ተብሎ ትርጉማዊ ኃይሉ ተጠብቋል።
theological_decisions:
- issue: በἸησοῦ Χριστῷ ውስጥ Χριστόςን እንዴት ማቅረብ እንደሚገባ
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός በዚህ ሰላምታ የማዕረግ ኃይሉን ይዞ ስለሚታይ ‘መሲሕ’ ተመርጧል፤ ባህላዊው ትርጉም ግን በማስታወሻ ተጠብቋል።
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ የሚገልጠው ግንኙነት
  choice: በአባታችን በእግዚአብሔርና በጌታ በኢየሱስ መሲሕ ለምትኖር
  alternative: የአባታችን የእግዚአብሔርና የጌታ የኢየሱስ መሲሕ የሆነች
  rationale: ይህ አቀራረብ ἐνን ወደ ባለቤትነት ብቻ ሳይቀይር፣ የመኖር፣ የኅብረትና የመመሥረት የተጠቀለለ ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግል ስሞች በተለመደው መጽሐፍ ቅዱሳዊ ቅርጽ ቀርበዋል፤ የደብዳቤው መክፈቻ አጭርነትና ክብርም ተጠብቋል።
