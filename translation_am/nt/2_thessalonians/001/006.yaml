  naturalness: «በእግዚአብሔር ዘንድ ፍትሐዊ ነውና» is natural, appropriately dignified modern Amharic. Removing the redundant object and supplied noun makes the recipient phrase more idiomatic.
  terminology: «ፍትሐዊ», «በእግዚአብሔር ዘንድ», «መመለስ», and «መከራ» suitably preserve the judicial register and do not specify the timing or mode of divine recompense.
  issues:
  - severity: medium
    issue: Redundant object and added noun in the phrase for τοῖς θλίβουσιν ὑμᾶς.
    rationale: The suffix -አችሁ in «የሚያስጨንቋችሁ» already means ‘who afflict you’; the preceding «እናንተን» duplicates that object. «ሰዎች» has no explicit Greek counterpart and is not needed because the participle is substantival.
  revised_text: ለሚያስጨንቋችሁ መከራን መመለስ በእግዚአብሔር ዘንድ ፍትሐዊ ነውና።[a]
