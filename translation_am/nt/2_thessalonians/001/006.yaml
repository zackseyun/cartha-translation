  text: ለሚያስጨንቋችሁ መከራን መመለስ በእግዚአብሔር ዘንድ ፍትሐዊ ነውና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለሚያስጨንቋችሁ መከራን መመለስ በእግዚአብሔር ዘንድ በእርግጥ ፍትሐዊ ከሆነ።»
    reason: የεἴπερን የሁኔታ አማራጭ ንባብ ለመጠበቅ።
lexical_decisions:
- source_word: εἴπερ
  choice: ነውና
  rationale: በዚህ አውድ ቃሉ ጳውሎስ እውነት እንደሆነ ተቀብሎ የሚያቀርበውን ምክንያት ያመለክታል፤ በአማርኛም «ነውና» ይህን የምክንያት ግንኙነት በተፈጥሮ ያሳያል። ሆኖም የሁኔታ ንባቡ «ከሆነ» በግርጌ ማስታወሻ ተጠብቋል።
- source_word: δίκαιον
  choice: ፍትሐዊ
  rationale: ቃሉ በእግዚአብሔር ፍርድ ውስጥ በሥነ ምግባር ትክክልና ፍትሕ የሆነውን ያመለክታል፤ «ፍትሐዊ» የፍርድ አውዱን በግልጽ ይይዛል።
- source_word: παρὰ θεῷ
  choice: በእግዚአብሔር ዘንድ
  rationale: ይህ አገላለጽ ነገሩ በእግዚአብሔር ግምገማና መለኪያ ፍትሐዊ መሆኑን ያሳያል፤ «በእግዚአብሔር ዘንድ» የግሪኩን ግንኙነታዊ አገላለጽ ሳያጠብ በተፈጥሮ ያስተላልፋል።
- source_word: ἀνταποδοῦναι
  choice: መመለስ
  rationale: በሰዎቹ ድርጊት ምላሽ ተመጣጣኝ ፍዳ መስጠትን ያመለክታል። «መመለስ» የበቀል ስሜትን ሳያክል የምላሽ ፍርድን ያሳያል።
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: እናንተን ለሚያስጨንቋችሁ ሰዎች
  rationale: θλίβω ጫና፣ መከራ ወይም ስደት ማድረስን ያካትታል። «ለሚያስጨንቋችሁ» በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የተደጋጋሚውን ጫና ይገልጣል።
- source_word: θλῖψιν
  choice: መከራን
  rationale: ቃሉ በፍርድ ምላሽ የሚደርስን ከባድ ጭንቀትና ሥቃይ ያመለክታል፤ «መከራ» ለዘመናዊ አንባቢ ግልጽና ክብደቱን የጠበቀ ነው።
theological_decisions:
- issue: የመለኮታዊ ፍዳ ባሕርይና ጊዜ
  choice: እግዚአብሔር መከራ ለሚያደርሱት መከራን መመለሱ ፍትሐዊ መሆኑን ብቻ መግለጽ
  alternative: ይህን ፍዳ የፍጻሜ ዘመን ፍርድ ብቻ አድርጎ መወሰን፣ ወይም የአሁኑንና የመጨረሻውን ፍርድ በግልጽ እንደሚያካትት መተርጎም
  rationale: ይህ ሐረግ የፍዳውን ፍትሐዊነት ያረጋግጣል እንጂ ጊዜውንና አፈጻጸሙን ሙሉ በሙሉ አይወስንም፤ ትርጉሙም ይህን ሥነ መለኮታዊ ክፍትነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሐረግ ከቀጣዩ ቁጥር ጋር በሰዋስው የተያያዘ ቢሆንም፣ «ነውና» የአውዱን ምክንያታዊ ግንኙነት ይጠብቃል።
