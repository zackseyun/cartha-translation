base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: am
  text: ለእናንተም፣ መከራ ለሚደርስባችሁ፣ ከእኛ ጋር እፎይታን ይሰጣችኋል፤ ይህም ጌታ ኢየሱስ ከሰማይ ከኃይሉ መላእክት ጋር[a] በሚገለጥበት ጊዜ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከኃያላን መላእክቱ ጋር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θλιβομένοις
  choice: መከራ ለምትቀበሉት
  rationale: የአሁን ጊዜ ተደራጊ አሳታፊው በአሁኑ ጊዜ ጫናና መከራ እየደረሰባቸው ያሉትን ያመለክታል። ‘መከራ ለምትቀበሉት’ ተደራጊነቱንና ቀጣይነቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄνεσιν
  choice: እፎይታን
  rationale: ቃሉ ከጫና መላቀቅን፣ እረፍትን ወይም መቅለልን ሊያመለክት ይችላል። ‘እፎይታ’ ከአሁኑ መከራ ጋር ያለውን ንጽጽር በግልጽ ያሳያል።
- source_word: μεθ’ ἡμῶν
  choice: ከእኛ ጋር
  rationale: የኅብረት ትርጉሙን በቀጥታ ይጠብቃል፤ ጳውሎስና ባልደረቦቹም በተስፋው እፎይታ እንደሚካፈሉ ያሳያል።
- source_word: ἐν τῇ ἀποκαλύψει
  choice: በሚገለጥበት ጊዜ
  rationale: ἐν እዚህ የጊዜ ኃይል አለው። የስም አወቃቀሩን በግስ ሐረግ መተርጎም በአማርኛ ተፈጥሯዊ ሲሆን መገለጡ እፎይታው የሚሰጥበት ጊዜ መሆኑን ያሳያል።
- source_word: ἀποκαλύψει
  choice: በሚገለጥበት
  rationale: ἀποκάλυψις የተሸፈነ ነገር መገለጥን ወይም መጋለጥን ያመለክታል። ‘መገለጥ’ የመጨረሻውን ዘመን ክብደት ሳያጠፋ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριοςን እንደ ማዕረግ በተለመደውና ክብር ባለው የአማርኛ ቃል ይተረጉማል።
- source_word: ἀπ’ οὐρανοῦ
  choice: ከሰማይ
  rationale: ἀπό የመነሻ ምንጭን ያመለክታል፤ ‘ከሰማይ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: ከኃያላን መላእክቱ ጋር
  rationale: የግሪኩ የባለቤትነት አወቃቀር ቃል በቃል ‘ከኃይሉ መላእክት ጋር’ ነው፤ ይህም መላእክቱ ኃያላን መሆናቸውን ወይም ከእርሱ ኃይል ጋር የተያያዙ መሆናቸውን ሊያመለክት ይችላል። ዋናው ጽሑፍ ተፈጥሯዊውን አገላለጽ ይጠቀማል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የμετ’ ἀγγέλων δυνάμεως αὐτοῦ የባለቤትነት ሐረግ ትርጉም
  choice: ከኃያላን መላእክቱ ጋር
  alternative: ከኃይሉ መላእክት ጋር
  rationale: የግሪኩ ሐረግ የታመቀና ከአንድ በላይ ልዩነት ያለው ነው። ዋናው ትርጉም በአማርኛ ተፈጥሯዊ የሆነውን የጥራት ትርጉም ይሰጣል፤ መላእክቱ ከጌታ ኃይል ጋር ያላቸውን ግንኙነት የሚያጎላው ቃል በቃል አማራጭ ግን በማስታወሻ ተቀምጧል።
- issue: የἐν τῇ ἀποκαλύψει ጊዜያዊ ኃይል
  choice: ጌታ ኢየሱስ ... በሚገለጥበት ጊዜ
  alternative: በጌታ ኢየሱስ መገለጥ
  rationale: ሐረጉ ተስፋ የተሰጠውን እፎይታ ከጌታ ኢየሱስ መገለጥ ጋር በጊዜ ያያይዛል። የግስ ሐረጉ ይህን ግንኙነት ያለ ትርጓሜያዊ ጭማሪ በግልጽ አማርኛ ያቀርባል።
- issue: በግሪኩ ያልተደገመውን ግስ በአማርኛ ማሟላት
  choice: ይሰጣችኋል ... ይሆናል
  alternative: ግሱን ሳይጨምሩ የሐረግ ቁራጩን መተው
  rationale: ቁጥር 7 በግሪኩ ከቀደመው አረፍተ ነገር ጋር የተያያዘ ሲሆን ግሱ ከአውዱ ይሞላል። በአማርኛ ግሱን ማሟላት ትርጉሙን አይለውጥም፤ አረፍተ ነገሩን ግን ሙሉና ለመረዳት ቀላል ያደርገዋል።
