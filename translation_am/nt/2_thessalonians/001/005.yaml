review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys ἔνδειγμα, God’s righteous judgment, the passive sense of καταξιωθῆναι (‘be counted worthy’), and the ongoing suffering. However, its reordered phrase ‘ስለ እርሷ’ precedes its antecedent ‘መንግሥት,’ and the construction ‘መከራ እየተቀበላችሁ ላላችሁት’ is grammatically and syntactically awkward. A revision can retain the source’s connections more clearly.
  naturalness: Most wording is understandable and appropriately formal, but ‘ስለ እርሷ … ለ…መንግሥት’ creates an avoidable unclear pronoun reference, and ‘ላላችሁት’ is not natural in this context. Placing the suffering clause after its antecedent yields fluent modern standard Amharic.
  terminology: ‘የእግዚአብሔር የጽድቅ ፍርድ,’ ‘ብቁ ሆናችሁ እንድትቈጠሩ,’ and ‘የእግዚአብሔር መንግሥት’ are suitable biblical-register renderings. ‘መከራ እየተቀበላችሁ ነው’ naturally represents the present-tense πάσχετε without suggesting that suffering earns worthiness.
  issues:
  - severity: medium
    issue: The relative pronoun in ‘ስለ እርሷ’ occurs before its antecedent, ‘የእግዚአብሔር መንግሥት.’
    rationale: Although recoverable, this order is unclear and unnatural in Amharic. The Greek relative pronoun follows its antecedent; placing the suffering clause after ‘መንግሥት’ makes the reference explicit.
  - severity: medium
    issue: ‘መከራ እየተቀበላችሁ ላላችሁት’ is awkward and does not naturally express the independent present indicative πάσχετε.
    rationale: The phrase unnecessarily turns the suffering statement into an ill-formed modifier. ‘መከራ እየተቀበላችሁ ነው’ clearly and idiomatically states the ongoing suffering.
