  text: በዚያ ቀን፣ እርሱ በቅዱሳኑ መካከል[a] ክብርን ሊቀበልና ባመኑ ሁሉ ዘንድ ሊደነቅ ይመጣል፤ ምክንያቱም ለእናንተ የሰጠነው ምስክርነታችን ታምኖ ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቅዱሳኑ ውስጥ።” የግሪኩ መስተዋድድ እርሱ በቅዱስ ሕዝቡ መካከል ክብርን እንደሚቀበል ወይም ክብሩ በእነርሱ ውስጥ እንደሚገለጥ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
