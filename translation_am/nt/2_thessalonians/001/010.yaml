  choice: ይመጣል
  rationale: በዐውዱ የተወሰነውን የወደፊት መምጣት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ ‘በዚያ ቀን’ የሚለው የጊዜ ሐረግ የὅτανን ኃይል ያሳያል።
- source_word: ἐνδοξασθῆναι
  choice: ክብርን ሊቀበል
  rationale: የተገብሮ ትርጉሙንና መለኮታዊ ክብር የሚገለጥበትን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: በቅዱሳኑ መካከል
  rationale: ‘ቅዱሳኑ’ የክርስቶስን ቅዱስ ሕዝብ ያመለክታል፤ ‘መካከል’ የማኅበራዊ መገኘትን ያሳያል፣ ነገር ግን ἐν የ‘በውስጣቸው’ ትርጉም ሊኖረው ስለሚችል በማስታወሻ ተጠብቋል።
- source_word: θαυμασθῆναι
  choice: ሊደነቅ
  rationale: በእርሱ የሚነሣውን አስደናቂ አክብሮትና አድናቆት ያስተላልፋል።
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: ባመኑት ሁሉ ዘንድ
  rationale: የአማኞቹን ስብስብ እና የπιστεύσασινን ግሳዊ ኃይል ይጠብቃል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ተሰሎንቄዎች በአመኑት ሁሉ መካከል የሚካተቱበትን ምክንያት በግልጽ ሁኔታ ያሳያል።
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς
  choice: ለእናንተ የመሰከርነውን ምስክርነት አምናችኋል
  rationale: የግሪኩን ተገብሮ ‘ምስክርነታችን ታምኖአል’ ብሎ በግድ ከመከተል ይልቅ፣ ምስክርነቱ ወደ ተቀባዮቹ መድረሱንና በእነርሱ መታመኑን በግልጽ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: በዚያ ቀን
  rationale: የፍጻሜውን ቀን የሚያመለክተውን መደበኛ የጊዜ አገላለጽ በተፈጥሯዊ አማርኛ ይሰጣል።
theological_decisions:
- issue: ‘በቅዱሳኑ’ ውስጥ ያለው ἐν እና የቅዱሳኑ ማንነት
  choice: ‘በቅዱሳኑ መካከል’ ተብሎ የክርስቶስን ቅዱስ ሕዝብ እንደሚያመለክት ተተርጉሟል።
  alternative: ‘በቅዱሳኑ ውስጥ’፣ ማለትም ክብሩ በእነርሱ እንደሚገለጥ።
  rationale: ቀጥሎ ያለው ‘ባመኑት ሁሉ’ የሚለው ሐረግ ቅዱሳኑ አማኞች መሆናቸውን ይደግፋል። ሆኖም ἐν የውስጥ መገለጥ ፍቺንም ሊሸከም ስለሚችል አማራጩ በማስታወሻ ተቀምጧል።
- issue: πιστεύσασιν እና ἐπιστεύθη ከሐዋርያዊው ምስክርነት ጋር ያላቸው ግንኙነት
  choice: ሁለቱም በመደበኛው የማመን ቃል ተተርጉመዋል።
  alternative: ‘የታመኑት’ ወይም ‘በእምነት የተቀበሉት’ ብሎ መተርጎም።
  rationale: ጽሑፉ ልዩ የሥነ መለኮት ቴክኒካዊ ፍቺ ሳይጭን፣ ምስክርነቱን መቀበልና ማመን የሚለውን ቀጥተኛ ሐሳብ ይሰጣል።
- issue: ‘በዚያ ቀን’ የሚለው ሐረግ ከየትኛው ክፍል ጋር እንደሚያያዝ
  choice: ለተፈጥሯዊ አማርኛ በዓረፍተ ነገሩ መጀመሪያ ተቀምጦ የመምጣቱን ክስተት በሙሉ ያቅፋል።
  alternative: የግሪኩን ቅደም ተከተል በመከተል በዓረፍተ ነገሩ መጨረሻ ማስቀመጥ።
  rationale: የመጨረሻው አቀማመጥ የአገባቡን ግንኙነት በተለየ መንገድ ሊያሰማ ስለሚችል በማስታወሻ ተጠብቋል።
