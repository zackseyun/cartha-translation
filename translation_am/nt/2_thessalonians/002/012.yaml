base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: am
  text: እውነትን ያላመኑ፣ ነገር ግን በክፋት ደስ የተሰኙ ሁሉ እንዲፈረድባቸው ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲኮነኑ።” የግሪኩ ግስ በመሠረቱ “እንዲፈረድባቸው” ማለት ቢሆንም፣ በዚህ አውድ የኩነኔ ፍርድን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: እንዲ... ነው
  rationale: ከቀደመው አውድ ጋር ያለውን የዓላማ ወይም የውጤት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ ከሁለቱ አንዱን ብቻ አይወስንም።
- source_word: κριθῶσιν
  choice: እንዲፈረድባቸው
  rationale: የκρίνωን መሠረታዊ የፍርድ ትርጉም ይጠብቃል። አውዱ አሉታዊ ፍርድን ቢያመለክትም፣ ‘እንዲኮነኑ’ በማለት በግሪኩ ከተገለጠው በላይ አይተረጉምም።
- source_word: πάντες
  choice: ሁሉ
  rationale: ተከታዮቹን ተውላጠ ግሶች የሚያጠቃልል ቀጥተኛና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: οἱ μὴ πιστεύσαντες
  choice: ያላመኑ
  rationale: በጽሑፉ ያለውን ያለፈ ድርጊት እና ‘እውነት’ የሚለውን ቀጥተኛ ተሳቢ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῇ ἀληθείᾳ
  choice: እውነትን
  rationale: ከ‘ማመን’ ጋር በአማርኛ ቀጥተኛ ተሳቢ መጠቀም ተፈጥሯዊ ነው፤ አውዱም የተወሰነውን የወንጌል እውነት ያመለክታል።
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: እውነትን አለማመንንና በክፋት ደስ መሰኘትን በግልጽ ያነጻጽራል።
- source_word: εὐδοκήσαντες
  choice: ደስ የተሰኙ
  rationale: ግሱ ያለውን የፈቃድና የስሜት ገጽታ ይጠብቃል፤ እንደ ‘የተቀበሉ’ ብቻ ወደ አእምሯዊ ማጽደቅ አያጠበውም።
- source_word: τῇ ἀδικίᾳ
  choice: በክፋት
  rationale: ἀδικία ያለውን ሰፊ የሞራል በደልና ክፉነት በዘመናዊ፣ ለተራ አንባቢ ግልጽ በሆነ ቃል ያስተላልፋል። ‘በዓመፅ’ ከሚለው ይልቅ የአካላዊ ጥቃት ብቻ እንዳይመስል ያደርጋል።
theological_decisions:
- issue: κριθῶσιν እንደ ‘እንዲፈረድባቸው’ ወይስ እንደ ‘እንዲኮነኑ’ መተርጎም
  choice: እንዲፈረድባቸው
  alternative: እንዲኮነኑ
  rationale: አውዱ አሉታዊ ውጤትን በግልጽ ቢያመለክትም፣ κρίνω በመሠረቱ ሰፊውን የመፍረድ ሐሳብ ይይዛል። ዋናው ጽሑፍ የግሪኩን መጠን ይጠብቃል፤ አውዳዊው የኩነኔ ትርጉም በማስታወሻ ቀርቧል።
