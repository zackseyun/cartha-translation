  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: am
  text: ማንም በምንም መንገድ እንዳያታልላችሁ፤ ዓመፁ[a] አስቀድሞ ካልመጣና ሕግን የማይጠብቅ ሰው[b]፣ የጥፋት ልጅ፣ ካልተገለጠ በቀር ያ ቀን አይመጣምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክህደቱ» ወይም «ከእምነት መውደቁ»። የግሪኩ ቃል ወሳኝ ዓመፅን ሊያመለክት ይችላል፤ ብዙ ጊዜም ሃይማኖታዊ ክህደት ተደርጎ ይታያል።
    reason: alternative_reading
  - marker: b
    text: አንዳንድ ቅጂዎች «ሕግን የማይጠብቅ ሰው» በሚለው ፈንታ «የኃጢአት ሰው» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: እንዳያታልላችሁ
  rationale: ግሱ ማታለልን ወይም ማሳሳትን ያመለክታል፤ «ማታለል» በዚህ የማስጠንቀቂያ አውድ ተፈጥሯዊና ግልጽ ነው።
- source_word: κατὰ μηδένα τρόπον
  choice: በምንም መንገድ
  rationale: ማንኛውንም የማታለያ ዘዴ የሚከለክለውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: —ምና
  rationale: በአማርኛ ምክንያትን በተፈጥሯዊ ሁኔታ የሚያሳየው የግስ ቅጥያ «አይመጣምና» ሆኖ ተተርጉሟል።
- source_word: ἐὰν μὴ ἔλθῃ
  choice: ካልመጣ ... በቀር ... አይመጣም
  rationale: አንድ ነገር በቅድሚያ መፈጸሙ አስፈላጊ ሁኔታ መሆኑን የሚያሳይ ግልጽ የአማርኛ አገባብ ነው።
- source_word: ἀποστασία
  choice: ዓመፁ
  rationale: ቃሉ ዓመፅን፣ ክህደትን ወይም ከእምነት መውደቅን ሊያመለክት ይችላል። «ዓመፁ» ትርጉሙን በሃይማኖታዊ ክህደት ብቻ ሳይገድብ ሰፊውን ስሜት ይጠብቃል።
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: የክስተቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀποκαλυφθῇ
  choice: ካልተገለጠ
  rationale: የግሪኩን ተደራጊ ቅርጽና የሰውየውን ይፋ መሆን ይጠብቃል።
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: የዓመፀኝነት ሰው
  rationale: የSBLGNT ንባብ ἀνομίας ሕግን የመጣስንና የዓመፀኝነትን ሐሳብ ይዟል፤ «የዓመፀኝነት ሰው» በዘመናዊ አማርኛ ግልጽ ሲሆን የኃጢአት ሰው የሚለው የቅጂ ልዩነት በማስታወሻ ቀርቧል።
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: የጥፋት ልጅ
  rationale: የግሪኩን ሴማዊ ዘይቤ ይጠብቃል፤ ይህም በጥፋት የሚታወቅን ወይም ለጥፋት የተመደበን ሰው ሊያመለክት ይችላል።
theological_decisions:
- issue: የ«አይመጣም»ን የተሰወረ ባለቤት ከቀደመው ቁጥር ማሟላት
  choice: «ያ ቀን» በዋናው ጽሑፍ ተጨምሯል
  alternative: የግሪኩን አረፍተ ነገር እንደተሰወረ መተው፤ «... ካልመጣ በቀር»
  rationale: የተሰወረው ባለቤት ከቁጥር 2 የጌታ ቀን መሆኑ በአውዱ ግልጽ ነው። በአማርኛ ሐሳቡ ያልተሟላ እንዳይመስል «ያ ቀን» ተጨምሯል፤ ይህ የአውዱ ማብራሪያ እንጂ አዲስ ትርጓሜ አይደለም።
- issue: የἀποστασία ትርጉም
  choice: ዓመፁ
  alternative: ክህደቱ፤ ከእምነት መውደቁ
  rationale: ቃሉ ሰፊ ዓመፅን ወይም በተለይ ሃይማኖታዊ ክህደትን ሊያመለክት ይችላል። ዋናው ጽሑፍ የትንቢታዊውን ክስተት በአንድ አተረጓጎም እንዳይገድብ «ዓመፁ» ይላል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- issue: በτῆς ἀνομίας ላይ ያለው የጽሑፍ ልዩነት
  choice: የSBLGNTን «የዓመፀኝነት» ንባብ መከተል
  alternative: በአንዳንድ ቅጂዎች የሚገኘው «የኃጢአት ሰው»
  rationale: የቀረበው የምንጭ ጽሑፍ ἀνομίας ስለሚል ዋናው ትርጉም ይህንኑ ተከትሏል። የታወቀው ἁμαρτίας የሚለው ልዩ ንባብ ለጽሑፋዊ ግልጽነት በማስታወሻ ተጠቅሷል።
- issue: «የጥፋት ልጅ» የሚለው ሴማዊ አገላለጽ
  choice: ቅርጹን በቀጥታ መጠበቅ
  alternative: «ለጥፋት የተመደበው» ብሎ ትርጉሙን መፍታት
  rationale: የምንጩ አገላለጽ አንዱን ትርጓሜ ብቻ አያስገድድም፤ ስለዚህ «የጥፋት ልጅ» የሚለው ቅርጽ ሥነ መለኮታዊ ውጥረቱንና አሻሚነቱን ይጠብቃል።
