id: 2TH.2.7
reference: 2 Thessalonians 2:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: am
  text: ሕግን የመጣስ ምሥጢር አስቀድሞ እየሠራ ነውና፤ አሁን የሚገታው ብቻ ከመካከል እስኪወጣ ድረስ ይገታል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: ምሥጢር
  rationale: በጳውሎሳዊው አጠቃቀም ተሰውሮ የነበረን ነገር የሚያመለክተውን ትርጉም ይጠብቃል፤ እንደ ተራ እንቆቅልሽም አያቀርበውም።
- source_word: ἐνεργεῖται
  choice: እየሠራ ነው
  rationale: ድርጊቱ ቀድሞውኑ ጀምሮ በአሁኑ ጊዜ እየቀጠለ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀνομίας
  choice: የዓመፅ
  rationale: ቃሉ ሕግንና የእግዚአብሔርን ሥርዓት የመቃወም ሐሳብ አለው፤ «ዓመፅ» በአውዱ ውስጥ ይህን በአጭርና በተለመደ መንገድ ያስተላልፋል።
- source_word: μόνον
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር በኋላ ገዳቢ ማብራሪያ እንደሚከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ κατέχων
  choice: ገትቶ የያዘው
  rationale: የመግታትን ወይም ወደ ኋላ አድርጎ የመያዝን ሐሳብ ይጠብቃል፤ የገቺውን ማንነት ግን አይወስንም።
- source_word: ἄρτι
  choice: አሁን
  rationale: የመግታቱ ተግባር በአሁኑ ጊዜ እየሆነ መሆኑን በግልጽ ያሳያል።
- source_word: ἕως ἐκ μέσου γένηται
  choice: ከመካከል እስኪወጣ ድረስ
  rationale: የግሪኩን ምሳሌያዊና በድርጊት ፈጻሚ ረገድ ግልጽ ያልሆነ አገላለጽ ይጠብቃል፤ ሌላ አካል እንደሚያስወግደው አይወስንም።
theological_decisions:
- issue: የὁ κατέχων (‘የሚገታው’) ማንነት
  choice: «አሁን ገትቶ የያዘው» ተብሎ ማንነቱ ሳይገለጽ ቀርቧል።
  alternative: የሮም መንግሥት፣ ሰብዓዊ መንግሥት፣ መንፈስ ቅዱስ፣ መልአክ፣ ወይም ጳውሎስና ሐዋርያዊው ስብከት ተብሎ መለየት።
  rationale: ግሪኩ ገቺውን ይጠቅሳል እንጂ በዚህ ቁጥር ማንነቱን አይገልጽም፤ ትርጉሙም ይህን የነገረ መለኮት አሻሚነት አልፈታም።
- issue: በἕως ἐκ μέσου γένηται ውስጥ የማስወገዱ ፈጻሚ
  choice: «ከመካከል እስኪወጣ ድረስ» ተብሎ ፈጻሚው ሳይጨመር ተተርጉሟል።
  alternative: «እስኪወገድ ድረስ» ወይም «ከመንገድ እስኪወገድ ድረስ» ማለት።
  rationale: γένηται ከἐκ μέσου ጋር ከመካከል የመውጣትን ወይም ከመንገድ ውጭ የመሆንን ውጤት ሊያመለክት ይችላል፤ ግሪኩ ያልገለጸውን የድርጊቱን ፈጻሚ ትርጉሙ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ የሚገባ አማርኛ ተጠቅሟል። «መገደቡን ይቀጥላል» የሚለው በግሪኩ የተተወውን ግስ ለአማርኛ ግልጽነት ያሟላል፤ የገቺውን ማንነት ወይም የመውጣቱን ፈጻሚ አይወስንም።
