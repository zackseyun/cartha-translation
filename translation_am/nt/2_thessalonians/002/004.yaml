- issue: ναός “ቤተ መቅደስ” ወይስ “መቅደስ” ተብሎ መተርጎሙ
  choice: የእግዚአብሔር ቤተ መቅደስ
  alternative: የእግዚአብሔር መቅደስ
  rationale: “ቤተ መቅደስ” ለተራ አንባቢ ግልጽና ተፈጥሯዊ ሲሆን፣ ጳውሎስ ቃሉን በቀጥታ ሕንፃ ወይም በምሳሌያዊ ቅዱስ ስፍራ ማለቱን አስቀድሞ አይወስንም።
