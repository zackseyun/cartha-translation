source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: am
  text: እርሱም አምላክ ተብሎ ከሚጠራው ሁሉ ወይም ከሚመለክ ነገር ሁሉ በላይ የሚቃወምና ራሱን ከፍ የሚያደርግ ነው፤ እስከዚህም ድረስ ወደ እግዚአብሔር ቤተ መቅደስ[b] ገብቶ ይቀመጣል፤ ራሱ እግዚአብሔር መሆኑን እያሳየ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራሱ አንድ አምላክ መሆኑን እያሳየ።”
    reason: በመጨረሻው θεός ላይ ያለውን ሰዋሰዋዊ የ“አንድ አምላክ” አማራጭ ለማሳየት።
  - marker: b
    text: ወይም፣ “የእግዚአብሔር መቅደስ።”
    reason: ναός ከ“ቤተ መቅደስ” ይልቅ “መቅደስ/ቅዱስ ስፍራ” ተብሎም ሊተረጎም ስለሚችል።
lexical_decisions:
- source_word: ἀντικείμενος
  choice: የሚቃወም
  rationale: በአንቀጽ የተገለጸውን ቀጣይነት ያለው ተቃውሞ ያስቀምጣል፤ ግሪኩ በግልጽ ያልሰጠውን ቴክኒካዊ ማዕረግ አያስገባም።
- source_word: ὑπεραιρόμενος
  choice: ራሱን ከፍ የሚያደርግ
  rationale: የራስን ማንሳትና ከሌሎች በላይ ራስን ማድረግ የሚለውን መካከለኛ/ተገብሮ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: አምላክ ተብሎ በሚጠራው ... ሁሉ ላይ
  rationale: λεγόμενον የሚያመለክተውን ስያሜ ያስጠብቃል፤ የተጠራው በእውነት አምላክ መሆኑን አያረጋግጥም። ἐπί ከራስን ከፍ ማድረግ ጋር ከሁሉ በላይ የመሆንን አቅጣጫ ይሰጣል።
- source_word: σέβασμα
  choice: የሚመለከው ነገር
  rationale: ቃሉ አምላክን ብቻ ሳይሆን ሃይማኖታዊ አክብሮት ወይም አምልኮ የሚቀርብለትን ማንኛውንም ነገር ሊያካትት ስለሚችል ስፋቱን ይጠብቃል።
- source_word: ὥστε
  choice: እስከዚህም ድረስ
  rationale: ቀድሞ የተገለጸው ራስን ከፍ ማድረግ ያስከተለውን ውጤት በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: በእግዚአብሔር ቤተ መቅደስ ውስጥ
  rationale: ναός የቤተ መቅደሱን ቅዱስ ስፍራ ሊያመለክት ቢችልም፣ “ቤተ መቅደስ” በአማርኛ ግልጽና ተፈጥሯዊ ሲሆን ምስሉን ከልክ በላይ አያጠብም።
- source_word: καθίσαι
  choice: ተቀምጦ
  rationale: የመቀመጥን ተግባር በግልጽ ያሳያል፤ ጽሑፉ በቀጥታ ያልገለጸውን “በዙፋን መቀመጥ” የሚል ትርጓሜ አይጨምርም።
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: ራሱን ... ያሳያል
  rationale: ራሱን በይፋ እንደዚያ ማቅረቡን ያሳያል፤ ይህን የግድ መደበኛ የቃል አዋጅ አድርጎ አይተረጉመውም።
- source_word: ὅτι ἔστιν θεός
  choice: አምላክ መሆኑን
  rationale: ዐውደ ንባቡ በእግዚአብሔር ቤተ መቅደስ የሚቀመጥን ከፍተኛ የመለኮት ይገባኛል ጥያቄ ያሳያል። ሆኖም θεός ያለ አመልካች መስተዋድድ ስለመጣ “አንድ አምላክ” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
