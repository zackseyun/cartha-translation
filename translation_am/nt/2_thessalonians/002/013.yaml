  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: am
  text: እኛ ግን፣ በጌታ የተወደዳችሁ ወንድሞችና እህቶች[a]፣ እግዚአብሔር ለመዳን እንደ የመጀመሪያ ፍሬ[b] እንድትሆኑ ስለመረጣችሁ፣ በመንፈስ ቅድስናና በእውነት እምነት ስለ እናንተ ሁልጊዜ እግዚአብሔርን ልናመሰግን ይገባናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” የሚለው የግሪክኛውን ተባዕታይ ብዙ ቁጥር ἀδελφοί ይተረጉማል፤ በዚህ አድራሻ ውስጥ ግን መላውን የአማኞች ማኅበረሰብ፣ ሴቶችንም ጨምሮ፣ ሊያመለክት ይችላል።
    reason: cultural_note
  - marker: b
    text: አንዳንድ ቅጂዎች፣ “እግዚአብሔር ከመጀመሪያ ለመዳን መረጣችሁ” የሚል ንባብ አላቸው። ዋናው ጽሑፍ ἀπαρχήν፣ “የመጀመሪያ ፍሬ” የሚለውን ንባብ ይከተላል፤ ሌላው ንባብ ἀπ’ ἀρχῆς፣ “ከመጀመሪያ” የሚል ነው።
    reason: textual_variant
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: እኛ ግን
