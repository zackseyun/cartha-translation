- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: በጌታ የተወደዳችሁ
  rationale: የፍጹም ጊዜ ተገብሮ አንቀጽን እንደ ቀጣይ ሁኔታ ይገልጣል፤ κύριος ደግሞ ጌታ ተብሏል።
- source_word: εἵλατο
  choice: መረጣችሁ
  rationale: የመምረጥን ቀጥተኛ ትርጉም ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የአንድ ወገን የምርጫ ትምህርት አይጨምርም።
- source_word: ἀπαρχὴν
  choice: እንደ በኩራት
  rationale: የSBLGNT ዋና ንባብ የሆነውን ‘የመጀመሪያ ፍሬ/በኩራት’ ምሳሌያዊ ሐሳብ ይጠብቃል፤ ሌላው የቅጂ ንባብ በማስታወሻ ቀርቧል።
- source_word: εἰς σωτηρίαν
  choice: ለመዳን
  rationale: εἰς የሚያሳየውን ግብ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: በመንፈስ በመቀደስ
  rationale: የቅድስናን ሂደትና የἐνን የመሣሪያ/የሁኔታ ኃይል ይጠብቃል፤ መንፈስ ከቅዱስ መንፈስ ጋር እንዲገናኝ ያስችላል ነገር ግን በግሪክኛው የሌለውን ‘ቅዱስ’ ቃል አይጨምርም።
- source_word: πίστει ἀληθείας
  choice: እውነትን በማመን
  rationale: የግሪክኛውን የባለቤት አገባብ በተፈጥሯዊ አማርኛ እንደ እውነት ላይ የተደረገ እምነት ያቀርባል።
