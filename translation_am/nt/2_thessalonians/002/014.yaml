- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: በዋናው ጽሑፍ «መሲሕ»
  alternative: «ክርስቶስ»
  rationale: በዚህ አውድ Χριστός የቅቡዑን ማዕረግ እንደያዘ መተርጎሙ የቃሉን ትርጉም ይጠብቃል፤ ባህላዊው አጠራር በማስታወሻ ቀርቧል።
- issue: ' believers'' relation to the Lord''s glory'
  choice: «ክብር እንድታገኙ»
  alternative: «ክብሩን እንድትወርሱ» ወይም «በክብሩ እንድትካፈሉ»
  rationale: ግሪኩ περιποίησις ማግኘትንና ይዞታን ሊያመለክት ይችላል፤ «መካፈል» ተገቢ የአውድ ማብራሪያ ቢሆንም ብቸኛው የቃሉ ትርጉም አይደለም።
