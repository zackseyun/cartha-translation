lexical_decisions:
- source_word: εἰς ὃ
  choice: ለዚህም
  rationale: የግሪኩ አንጻራዊ አገላለጽ በቀደመው አውድ የተጠቀሰውን መዳንና መቀደስ ያመለክታል፤ «ለዚህም» ዓላማውን ሳያጠብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκάλεσεν ὑμᾶς
  choice: ጠራችሁ
  rationale: የግሪኩን ቀላል «ጠራ» አገላለጽ ይጠብቃል፤ ጥሪውን «ግብዣ» ብቻ አያደርገውም፣ አንድን የሥነ መለኮት ሥርዓትም አይጨምርበትም።
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: በወንጌላችን አማካይነት
  rationale: διά ከዘር ቅጽ ጋር የመንገድ ወይም የመሣሪያ ሐሳብ ይገልጣል። «ወንጌላችን» የሐዋርያትን ስብከት ያመለክታል እንጂ የተለየ ወንጌል ማለት አይደለም።
- source_word: εἰς περιποίησιν δόξης
  choice: ክብር እንድታገኙ
  rationale: περιποίησις ማግኘትን፣ መያዝን ወይም የራስ ማድረግን ሊገልጥ ይችላል። ከ«ክብር» ጋር «እንድታገኙ» ዓላማውን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: የጌታችንን የኢየሱስ መሲሕን
  rationale: κύριος በተለመደው የአዲስ ኪዳን ማዕረግ «ጌታ» ተብሏል፤ Χριστός ደግሞ በዚህ ስፍራ የቅቡዕነት ማዕረጉን እንዲያሳይ «መሲሕ» ተብሏል።
theological_decisions:
- issue: የእግዚአብሔር ጥሪ ባሕርይ
  choice: «ጠራችሁ» ተብሎ ያለ ተጨማሪ የሥነ መለኮት መግለጫ ተተርጉሟል።
