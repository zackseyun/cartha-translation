  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: am
  text: ለዚህም በወንጌላችን አማካይነት ጠራችሁ፤ ይኸውም የጌታችን ኢየሱስ መሲሕ[a] ክብርን እንድታገኙ[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊው አጠራር፣ «ኢየሱስ ክርስቶስ»።
    reason: alternative_reading
  - marker: b
    text: «ክብርን እንድታገኙ» የሚለው «ክብሩን የራሳችሁ እንድታደርጉ» ወይም «በክብሩ እንድትካፈሉ» ተብሎም ሊተረጎም ይችላል።
