    text: ወይም፣ “አሳሳች ኃይል፣” “የማታለል እንቅስቃሴ፣” ወይም በባህላዊ አተረጓጎም “ብርቱ ማሳሳት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህም
  rationale: የቀደመውን እውነትን ለመውደድ አለመቀበል እንደ ምክንያት ያመለክታል፤ ‘ስለዚህም’ ይህን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: πέμπει
