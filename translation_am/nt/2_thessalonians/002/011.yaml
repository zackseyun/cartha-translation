  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የአረፍተ ነገሩ ቅደም ተከተል ዓላማውን (‘ውሸቱን እንዲያምኑ’) ከዋናው ግስ በፊት በማቅረብ ተፈጥሯዊ የአማርኛ ፍሰት ይሰጣል።
