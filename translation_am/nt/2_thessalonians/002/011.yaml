  rationale: የግሪኩን የአሁን ጊዜ ግስና እግዚአብሔር ቀጥተኛ አድራጊ መሆኑን ይጠብቃል፤ ‘-ባቸው’ የተላከው ተጽእኖ በእነርሱ ላይ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐνέργειαν πλάνης
  choice: የማሳሳት ተጽእኖ
  rationale: ἐνέργεια የሚሠራ ኃይልን ወይም ውጤታማ እንቅስቃሴን፣ πλάνη ደግሞ ማሳሳትን ወይም ስህተትን ያመለክታል። ‘የማሳሳት ተጽእኖ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ንቁ አሳሳች ኃይልና የሚፈጠር ውጤት ያለውን አሻሚነት አያጠፋም።
- source_word: εἰς τὸ πιστεῦσαι
  choice: እንዲያምኑ
  rationale: የግሪኩን ዓላማዊ ወይም ውጤታዊ ኃይል ሁለቱንም ሳይለይ በአማርኛ በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: τῷ ψεύδει
  choice: ውሸቱን
  rationale: አንቀጹንና ነጠላ ቁጥሩን በመጠበቅ በዐውዱ የተጠቀሰውን የተወሰነ ውሸት ያመለክታል፤ አጠቃላይ ‘ሐሰት’ ብሎ አያደበዝዘውም።
theological_decisions:
- issue: በፍርዳዊ ማደንደን ውስጥ የእግዚአብሔር አድራጊነት
  choice: እግዚአብሔር … ይልክባቸዋል
  alternative: እግዚአብሔር የማሳሳት ተጽእኖ እንዲመጣባቸው ይፈቅዳል / ለማሳሳት አሳልፎ ይሰጣቸዋል
  rationale: በግሪኩ የπέμπει ቀጥተኛ ባለቤት እግዚአብሔር ነው። ትርጉሙ ይህን ወደ ፈቃድ ብቻ አያለዝበውም፤ በሰው እውነትን መ拒ትና በመለኮታዊ ፍርድ መካከል ያለውን የጽሑፉን ነገረ መለኮታዊ ውጥረት እንዳለ ይተዋል።
