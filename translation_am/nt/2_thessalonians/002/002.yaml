  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: am
  text: የጌታ ቀን ደርሷል[b] በሚል መንፈስ[a]፣ መልእክት ወይም ከእኛ የመጣ በሚመስል ደብዳቤ ምክንያት ከአእምሯችሁ ቶሎ እንዳትናወጡ ወይም እንዳትደናገጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መንፈሳዊ ንግግር» ወይም «ትንቢታዊ መገለጥ»።
    reason: lexical_alternative
  - marker: b
    text: «ደርሷል» የሚለው «አሁን እዚህ ነው» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ፍጹም ግስ የጌታ ቀን አስቀድሞ መጥቶ አሁን መኖሩን የሚናገር ክስ ሊገልጥ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: ቶሎ
  rationale: ጥንታዊው ቃል ስለ ፈጣን መናወጥ የሚሰጠውን ማስጠንቀቂያ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
