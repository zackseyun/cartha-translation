- source_word: πνεύματος
  choice: መንፈስ
  rationale: በዐውዱ የተነገረ መንፈሳዊ መገለጥ ሊሆን ቢችልም የግሪኩን አሻሚነት በዋናው ጽሑፍ ይጠብቃል።
- source_word: λόγου
  choice: መልእክት
  rationale: ከደብዳቤ የተለየ የቃል ሪፖርት ወይም ትምህርት መሆኑን ከ«ቃል» ይልቅ በግልጽ ያስተላልፋል።
- source_word: ἐπιστολῆς ὡς δι’ ἡμῶν
  choice: ከእኛ እንደተላከ በሚነገር ደብዳቤ
  rationale: ደብዳቤው በጳውሎስና ባልደረቦቹ ስም በሐሰት መቅረቡን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐνέστηκεν
  choice: ደርሷል
  rationale: ፍጹም ግሱ ቀኑ መጥቶ አሁን እዚህ ነው የሚለውን ክስ ያስተላልፋል፤ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἡμέρα τοῦ κυρίου
  choice: የጌታ ቀን
  rationale: የፍጻሜ ዘመንን የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
