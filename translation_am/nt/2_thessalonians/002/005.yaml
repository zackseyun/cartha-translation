  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: am
  text: እኔ ገና ከእናንተ ጋር ሳለሁ እነዚህን ነገሮች እነግራችሁ እንደነበር አታስታውሱምን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: አታስታውሱምን?
  rationale: በአሁን ጊዜ መልክ የቀረበውን የአጽንዖት ጥያቄ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἔτι
  choice: ገና
  rationale: ጳውሎስ በዚያን ጊዜ ከእነርሱ ጋር መኖሩ እንደቀጠለ የሚያመለክተውን ጊዜያዊ ሐሳብ ይጠብቃል።
- source_word: ὢν πρὸς ὑμᾶς
  choice: ከእናንተ ጋር ሳለሁ
  rationale: የግሪኩን አጋር ግስ ጊዜያዊ አገባብና በእነርሱ መካከል በአካል መገኘቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የብዙ ቁጥር አመልካቹን ይጠብቃል፤ በዐውዱ ውስጥ ከዚህ በፊት የተነሱትን ጉዳዮች ያመለክታል።
- source_word: ἔλεγον
  choice: እነግራችሁ እንደነበር
  rationale: የግሪኩ ያልተፈጸመ ያለፈ ጊዜ ቅርጽ የሚያሳየውን ቀጣይነት ወይም ድግግሞሽ ከቀላል ‘ነገርኳችሁ’ ይልቅ በግልጽ ይጠብቃል።
- source_word: οὐ ... ὅτι
  choice: እንደነበር አታስታውሱምን?
  rationale: ὅτι የሚያስገባውን የትውስታ ይዘትና οὐ ያለበትን መልሱ ‘አዎ’ እንዲሆን የሚጠብቅ የአጽንዖት ጥያቄ ያስተላልፋል።
