  choice: የእውነትን ፍቅር
  alternative: ለእውነት ያላቸውን ፍቅር
  rationale: ዐውዱ እውነትን መውደድና መቀበልን በጽኑ ይደግፋል፤ ሆኖም የግሪኩን የጄኒቲቭ ቅርጽ በቀጥታ መያዝ የሐረጉን ቅርጽና የቀረውን ጥቃቅን አሻሚነት ይጠብቃል።
