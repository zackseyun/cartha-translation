base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: am
  text: ከእናንተ ጋር በነበርንበት ጊዜ እንኳ ይህን እናዝዛችሁ ነበርና፤ “ማንም መሥራት ፈቃደኛ ካልሆነ[a]፣ አይብላ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል መሥራትን አለመፈለግ ወይም ፈቃደኛ አለመሆንን ያመለክታል፤ መሥራት አለመቻልን አይገልጽም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንዳይበላ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: እንኳ … ነበርና
  rationale: ካί የሚሰጠውን አጽንዖት ‘እንኳ’ ይገልጣል፤ γάρ የሚያሳየውን ከቀደመው ሐሳብ ጋር ያለ ምክንያታዊ ግንኙነት ደግሞ በ‘ነበርና’ መደምደሚያ በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: ከእናንተ ጋር በነበርንበት ጊዜ
  rationale: πρός እዚህ በሰዎች መካከል በአካል አብሮ መኖርን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: ይህን እናዝዛችሁ ነበር
  rationale: ‘ይህን’ ቀጥሎ የሚመጣውን የትእዛዙን ይዘት ያመለክታል። ያልተፈጸመው የግሪክ የአለፈ ጊዜ ግስ የቀጣይነት ወይም የልማድ ኃይል ‘እናዝዛችሁ ነበር’ በሚለው ተጠብቋል።
- source_word: εἴ τις οὐ θέλει ἐργάζεσθαι
  choice: ማንም ሊሠራ የማይፈልግ ከሆነ
  rationale: θέλει ፈቃደኛነትን ወይም ፍላጎትን እንጂ አለመቻልን አያመለክትም። ‘ማንም … ከሆነ’ የሁኔታውን አጠቃላይ ወሰን ይጠብቃል።
- source_word: μηδὲ ἐσθιέτω
  choice: አይብላ
  rationale: የአማርኛው ክልከላዊ ይሁንታ የግሪኩን የሦስተኛ መደብ ትእዛዝ ኃይል በአጭርና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: ንግግሩ መሥራት የማይችልን ወይስ መሥራት የማይፈልግን ሰው እንደሚመለከት
  choice: ‘ሊሠራ የማይፈልግ’ ተብሎ ፈቃደኛ አለመሆንን መግለጽ
  alternative: ‘መሥራት የማይችል’
  rationale: θέλει የፈቃድን ጉዳይ ይገልጣል። እንደ አለመቻል መተርጎም ጽሑፉ ያላለውን ከባድ ማኅበራዊ ድምዳሜ ያስገባል።
- issue: በμηδὲ ἐσθιέτω ያለውን የትእዛዝ ኃይል መግለጽ
  choice: ‘አይብላ’
  alternative: ‘እንዳይበላ’
  rationale: ‘አይብላ’ የሦስተኛ መደብ ክልከላዊ ትእዛዝን በቀጥታ ይገልጣል፤ ‘እንዳይበላ’ ደግሞ በአውድ ላይ የሚደገፍ አማራጭ አገላለጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የሁኔታ አወቃቀርና የትእዛዝ ኃይል ተጠብቀዋል።
