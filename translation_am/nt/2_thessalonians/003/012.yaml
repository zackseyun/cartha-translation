base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: am
  text: እንደነዚህ ያሉትን ግን፣ በጸጥታ እየሠሩ የራሳቸውን እንጀራ እንዲበሉ፣ በጌታ በኢየሱስ መሲሕ[a] እናዛቸዋለን፣ እንማጸናቸዋለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «መሲሕ»፦ ወይም «ክርስቶስ»። የግሪኩ Χριστός እዚህ እንደ ማዕረግ አገልግሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: እንደነዚህ ያሉትን ግን
  rationale: የግሪኩ ሐረግ በቀደመው አውድ የተጠቀሱትን ሥራ ፈትና ሥርዓት የማይከተሉ ሰዎች ወደኋላ ይጠቁማል፤ δέ ያለው ቀላል ንጽጽር «ግን» በሚለው ተጠብቋል።
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: እናዛቸዋለን፣ እንማጸናቸውማለን
  rationale: የመጀመሪያው ግስ ያለውን የሥልጣን ኃይልና ሁለተኛው ግስ ያለውን አጥብቆ የመለመን ስሜት ሳያደበዝዝ ሁለቱንም ይጠብቃል።
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: በጌታ በኢየሱስ መሲሕ
  rationale: ἐν የትእዛዙንና የልመናውን የሥልጣንና የኅብረት መሠረት ስለሚገልጥ «በ» ተብሏል፤ Χριστός እዚህ ማዕረግ ስለሆነ «መሲሕ» ተብሏል።
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: በጸጥታ እየሠሩ
  rationale: ይህ ሐረግ የድምፅ አልባነትን ብቻ ሳይሆን ከረባሽ ሥራ ፈትነት በተቃራኒ ያለ ሰከን ያለና ሥርዓታማ የሥራ አኗኗርን ያመለክታል።
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: የራሳቸውን እንጀራ እንዲበሉ
  rationale: «እንጀራ» የἄρτοςን ተጨባጭ ምስል ጠብቆ፣ በአውዱ ግን ሰዎቹ በራሳቸው ሥራ የሚያገኙትን መተዳደሪያ ያመለክታል፤ ἵνα ከንዑስ አንቀጹ ጋር ያለው የትእዛዝ ይዘት «እንዲበሉ» ተብሎ ተገልጧል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ ከኢየሱስ ስም ጋር የተያያዘ ሕያው ማዕረግ ሆኖ ስለሚሠራ፣ «የተቀባው» የሚለውን ትርጉሙን የሚያሳየው «መሲሕ» ተመርጧል።
- issue: የሐዋርያዊው ንግግር ሁለት ገጽታ
  choice: «እናዛቸዋለን» እና «እንማጸናቸውማለን» ሁለቱንም ማቆየት
  alternative: ሁለቱን በአንድ አጠቃላይ ግስ መተርጎም
  rationale: ጽሑፉ ሥልጣን ያለውን ትእዛዝና አጥብቆ የሚቀርብን የእረኝነት ልመና አንድ ላይ ይዟል፤ አንዱን ብቻ ማቆየት ይህን ውጥረት ያጠፋል።
- issue: ἐν κυρίῳ የሚለው ሐረግ
  choice: በጌታ በኢየሱስ መሲሕ
  alternative: በጌታ በኢየሱስ መሲሕ ሥልጣን
  rationale: «በሥልጣን» ብቻ ብሎ መጨመር ἐν ሊያመለክተው የሚችለውን ኅብረትና መስክ ያጠባል፤ ቀጥተኛው «በ» ሆን ተብሎ ያልተፈታውን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እንጀራ» የምንጩን ተጨባጭ ምስል ሲጠብቅ፣ «በጸጥታ እየሠሩ» ደግሞ ከአውዱ ረባሽ ሥራ ፈትነት ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
