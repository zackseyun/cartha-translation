lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: እናንተ ግን
  rationale: በግልጽ የተጠቀሰው እናንተ አጽንዖቱን፣ ግን ደግሞ ከቀደመው ስለ ሥርዓት አልባዎች ንግግር ጋር ያለውን ንፅፅር ያስቀምጣሉ።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩን ወንድ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ በዚህ የጉባኤ አድራሻ ውስጥ ሴቶችንም ሊያካትት እንደሚችል በእግር ማስታወሻ ተገልጿል።
- source_word: μὴ ἐγκακήσητε
  choice: አትታክቱ
  rationale: ክልከላውን እና መልካም ሥራን በመቀጠል ላይ መድከም ወይም ተስፋ መቁረጥ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καλοποιοῦντες
  choice: መልካም ማድረግን
  rationale: ተካፋዩ የሚያመለክተውን ቀጣይ የመልካም ድርጊት ሂደት በግልጽና በዘመናዊ አማርኛ ይገልጻል።
