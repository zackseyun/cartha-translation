source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: am
  text: ከጠማማና ክፉ ሰዎችም[a] እንድንድን፤ ሁሉም እምነት ያላቸው አይደሉምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከያልተገቡና ክፉ ሰዎች»። የግሪኩ ቅጽል «ያልተገባ፣ የማይመስል፣ ምክንያተ ቢስ» ማለት ሊሆን ይችላል፤ በዚህ አውድ ግን የተዛባ ባሕርይ ያላቸውን ተቃዋሚዎች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: እንድንድን
  rationale: የግሪኩ የተገብሮ ንዑስ አንቀጽ ከጠላት ሰዎች መታደግን ወይም መዳንን ያመለክታል፤ በአማርኛም «እንድንድን» የዓላማውን አገባብ በተፈጥሮ ያስተላልፋል።
- source_word: ἀτόπων
  choice: ጠማማ
  rationale: ቃሉ ያልተገባ፣ የተዛባ ወይም ምክንያተ ቢስ የሆነን ባሕርይ ሊገልጽ ይችላል። ከ πονηρῶν ጋር በዚህ አውድ ሲጣመር «ጠማማ» የሥነ ምግባር መዛባቱን ያሳያል፣ ከ«ክፉ»ም ፍጹም አይደጋገምም።
- source_word: πονηρῶν
  choice: ክፉ
  rationale: ይህ የተለመደ የሥነ ምግባር ክፋትን የሚገልጽ ቃል ሲሆን «ክፉ» ግልጽና ተፈጥሯዊ አማርኛ ነው።
- source_word: ἀνθρώπων
  choice: ሰዎች
  rationale: በዚህ ብዙ ቁጥር አገባብ ተቃዋሚ ሰዎችን ያመለክታል፤ «ሰዎች» የግሪኩን ሰብአዊ ማጣቀሻ ያለ አላስፈላጊ ጾታዊ ገደብ በተፈጥሮ ያስተላልፋል።
- source_word: πίστις
  choice: እምነት
  rationale: በአውዱ ውስጥ የሐዋርያትን ተልእኮ የሚቃወሙት ሰዎች እምነት እንደሌላቸው መግለጹ በጣም የተፈጥሮ ንባብ ነው፤ የ«ታማኝነት» አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: ሁሉም እምነት የላቸውምና
  rationale: የግሪኩ ቀጥተኛ አገባብ «እምነት የሁሉ አይደለችም» የሚል ነው። የተመረጠው አማርኛ «ሁሉም አይደሉም» የሚለውን ወሰን በተፈጥሮ ይገልጻል እንጂ ማንም እምነት የለውም አይልም።
theological_decisions:
- issue: በአሻሚው አንቀጽ ውስጥ πίστις የሚለውን መተርጎም
  choice: እምነት
  alternative: ታማኝነት፤ «ሁሉም ታማኞች አይደሉም»
  rationale: የቅርቡ አውድ ከወንጌል ተልእኮ ጋር የሚቃወሙ ሰዎችን ስለሚመለከት፣ «እምነት» ዋናው ንባብ ሆኗል። ሆኖም πίστις «ታማኝነት» ማለትም ሊሆን ስለሚችል እውነተኛው የትርጉም ውጥረት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጠማማና ክፉ» የሁለቱን የግሪክ ቅጽሎች ልዩነት ይጠብቃል፤ ሴሚኮሎኑም የምክንያት አንቀጹን ከጥያቄው ይለያል።
