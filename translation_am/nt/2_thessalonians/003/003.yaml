id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: am
  text: ነገር ግን ጌታ ታማኝ ነው፤ እርሱም ያጸናችኋል፣ ከክፉውም[a] ይጠብቃችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ከክፋት።” የግሪኩ τοῦ πονηροῦ “ክፉው” ወይም “ክፋት” ተብሎ ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: ታማኝ
  rationale: የጌታን አስተማማኝነትና ቃሉን የመጠበቅ ባሕርይ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: δέ
  choice: ነገር ግን
  rationale: በቀደመው ንግግር ላይ ከተጠቀሰው የሰዎች እምነት ማጣት ጋር ያለውን ንጽጽር ያሳያል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: የግሪኩን ማዕረግ ሳያብራራ እንዳለ ይጠብቃል፤ በዐውዱ የጌታ ኢየሱስ ማመልከቱ ተፈጥሯዊ ቢሆንም ትርጉሙ ይህን በቀጥታ አይጨምርም።
- source_word: στηρίξει
  choice: ያጸናችኋል
  rationale: ጽኑ ማድረግን፣ ማበርታትንና ማቋቋምን የሚያካትተውን ትርጉም በዐውዱ ተስማሚ በሆነ አማርኛ ያቀርባል።
- source_word: φυλάξει
  choice: ይጠብቃችኋል
  rationale: ንቁ ጥበቃንና ከአደጋ መከላከልን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ
  choice: ከ
  rationale: ከተጠቀሰው አደጋ መጠበቅን የሚያሳይ ተፈጥሯዊ የአማርኛ ቅድመ ቅጥያ ነው።
- source_word: τοῦ πονηροῦ
  choice: ከክፉው
  rationale: በዋናው ጽሑፍ የግል ተጠቃሽን፣ ‘ክፉውን’፣ ያስቀድማል፤ ሆኖም የግሪኩ ቅርጽ ‘ክፋት’ ተብሎም ሊነበብ ስለሚችል ይህ አማራጭ በእግር ማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የτοῦ πονηροῦ ተጠቃሽ
  choice: ክፉው
  alternative: ክፋት
  rationale: የግሪኩ ቅርጽ በሰዋሰው ወንድ ፆታ ሆኖ ‘ክፉውን’ ወይም ገለልተኛ ፆታ ሆኖ ‘ክፋትን’ ሊያመለክት ይችላል። ዋናው ጽሑፍ በአዲስ ኪዳን አጠቃቀም የተለመደውን የግል ንባብ ይይዛል፤ እውነተኛውን አሻሚነት ለመጠበቅ ሌላው ንባብ በእግር ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የብዙ ተቀባዮች ቅጥያዎች የግሪኩን ὑμᾶς ያንጸባርቃሉ፤ ‘እርሱም’ የὃςን ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
