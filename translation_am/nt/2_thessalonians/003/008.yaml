    text: ወይም፣ “ከማንም ዘንድ እንጀራ ያለ ዋጋ አልበላንም።” በግሪክኛው “እንጀራ” የሚለው ቃል በቀጥታ ቢገኝም፣ በሰፊው ምግብን ወይም ቁሳዊ ድጋፍን ሊያመለክት ይችላል።
