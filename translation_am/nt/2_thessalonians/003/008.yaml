lexical_decisions:
- source_word: δωρεὰν
  choice: በነጻ
  rationale: ስጦታ ሆኖ ወይም ዋጋ ሳይከፈልበት መቀበልን ያመለክታል፤ “በነጻ” የኢኮኖሚያዊውን ፍቺ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: ቃሉ በቀጥታ “እንጀራ” ማለት ነው። ምግብን በአጠቃላይ ሊወክል ቢችልም፣ ተጨባጩን አገላለጽ በዋናው ጽሑፍ በመጠበቅ ሰፊው ፍቺ በማስታወሻ ተገልጿል።
- source_word: παρά τινος
  choice: የማንንም
  rationale: παρά ከዘር ቅጽ ጋር ምንጭን ያመለክታል፤ በአማርኛ “የማንንም እንጀራ” የሚለው አገላለጽ ይህን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: በድካምና በልፋት
  rationale: ሁለቱ ተቀራራቢ ቃላት ከባድ ጥረትንና መከራን በተደራራቢ ኃይል ያጎላሉ፤ የአማርኛው ጥምረትም ይህን ይጠብቃል።
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ሌሊትና ቀን
  rationale: በሁለቱም የጊዜ ክፍሎች የቀጠለ ጥረትን የሚያሳይ ተፈጥሯዊ አማርኛ አገላለጽ ነው።
- source_word: ἐργαζόμενοι
  choice: እየሠራን ነበር
  rationale: ተሳቢው ጳውሎስና ባልደረቦቹ ሸክም ላለመሆን ያደረጉትን ቀጣይ ሥራ ያብራራል።
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: ሸክም እንዳንሆን
  rationale: የዓላማ ግንባታውን ይጠብቃል፤ በዚህ አውድ ለሌሎች ቁሳዊ ወይም የገንዘብ ጫና አለመሆንን ያመለክታል።
- source_word: τινα ὑμῶν
  choice: ከእናንተ በማንም ላይ
  rationale: ነጠላው ያልተወሰነ ተውላጠ ስም ከብዙ ቁጥር ተውላጠ ስም ጋር ያለውን አከፋፋይ ፍቺ ይጠብቃል።
- source_word: οὐδὲ ... ἀλλ’
  choice: አል...ም፤ ነገር ግን
  rationale: የነጻ ድጋፍ አለመቀበልንና በከባድ ጥረት መሥራትን የሚያነጻጽረውን ንግግራዊ መዋቅር ይጠብቃል።
