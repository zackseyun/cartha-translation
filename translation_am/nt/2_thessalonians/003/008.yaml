  text: ከማንም ዘንድ እንጀራ በነጻ አልበላንም[a]፤ ነገር ግን ከእናንተ በማናችሁም ላይ ሸክም እንዳንሆን፣ ሌሊትና ቀን በድካምና በልፋት እየሠራን ነበር።
  philosophy: optimal-equivalence
  footnotes:
