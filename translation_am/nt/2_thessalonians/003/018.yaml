  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: am
  text: የጌታችን የኢየሱስ ክርስቶስ[a] ጸጋ ከሁላችሁ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ክርስቶስ” ማለት “መሲሕ” ወይም “የተቀባው” ማለት ነው።
    reason: የግሪክኛውን Χριστός የመጠሪያ ትርጉም ግልጽ ለማድረግ።
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች የተለመደውን፣ በክርስቶስ የሚሰጠውን የእግዚአብሔር ቸርነትና ስጦታ የሚያመለክት የቡራኬ ቃል በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: κυρίου
  choice: ጌታ
  rationale: የኢየሱስን ሥልጣንና ክብር የሚገልጠውን ክርስቶሳዊ መጠሪያ በግልጽ ሁኔታ ያስተላልፋል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ ክርስቶስ
  rationale: ኢየሱስ የሚለውን ስምና Χριστός የሚለውን በአማርኛ ክርስቲያናዊ ንግግር በስፋት የሚታወቀውን መጠሪያ ይጠብቃል፤ የመጠሪያው ትርጉም “መሲሕ” መሆኑ በማስታወሻ ተገልጧል።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር
  rationale: μετά ከወራሽ ቅጽ ጋር “ከ…ጋር” የሚለውን ያመለክታል፤ πάντων ὑμῶν ደግሞ ቡራኬው የማኅበሩን አባላት ሁሉ እንደሚያካትት ያሳያል። “ይሁን” የቡራኬውን ኃይል በተፈጥሯዊ አማርኛ ያሟላል።
theological_decisions:
- issue: በመዝጊያው ቡራኬ Χριστοῦን መተርጎም
  choice: ክርስቶስ
  alternative: መሲሕ
  rationale: Χριστός በመሠረቱ “የተቀባው” ወይም “መሲሕ” የሚል መጠሪያ ቢሆንም፣ “ኢየሱስ ክርስቶስ” በዘመናዊ መደበኛ አማርኛ እጅግ የተለመደና በቀላሉ የሚታወቅ ነው። የመጠሪያው ትርጉም እንዳይጠፋ “መሲሕ” የሚለው በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የቡራኬ አገላለጽ ተጠቅሟል። የግሪክኛው ሐረግ ግስ ባይኖረውም፣ በአማርኛ ተፈጥሯዊ የቡራኬ ቅርጽ “ይሁን” ተጨምሯል።
