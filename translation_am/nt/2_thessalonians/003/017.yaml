  choice: ሰላምታው
  rationale: በደብዳቤ መዝጊያ የሚቀርብን ሰላምታ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: በእኔ በጳውሎስ እጅ የተጻፈ
  rationale: ጳውሎስ ይህን ክፍል ራሱ በእጁ እንደጻፈ የሚያሳየውን የግሪክ ዳቲቭ አገላለጽና Παύλου የሚለውን ራስን የመግለጫ አቀማመጥ ይጠብቃል።
- source_word: σημεῖον
  choice: ምልክት
  rationale: የግል የእጅ ጽሑፉ ደብዳቤውን ለማረጋገጥ የሚያገለግል መለያ መሆኑን በቀጥታ ያሳያል።
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: በእያንዳንዱ ደብዳቤ
  rationale: πάσῃ ያለውን ነጠላ መልክ እና የተደጋጋሚ ልማድ ሐሳብ ይጠብቃል፤ “ደብዳቤ” ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
- source_word: οὕτως γράφω
  choice: የምጽፈው እንዲህ ነው
  rationale: οὕτως የአጻጻፉን መንገድ ሊያመለክት የሚችለውን ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
