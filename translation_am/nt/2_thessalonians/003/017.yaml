  choice: ሰላምታውን ጳውሎስ ራሱ በእጁ መጻፉ በደብዳቤዎቹ የማረጋገጫ ምልክት እንደሆነ ቀርቧል።
  alternative: የመጨረሻው ሐረግ ይህንን ሰላምታ ብቻ በማመልከት “እንዲህ እጽፋለሁ” ተብሎ ሊተረጎም ይችላል።
  rationale: “በእያንዳንዱ ደብዳቤ ምልክት” የሚለው አቅራቢያ ያለ ንግግር የማረጋገጫ ተግባሩን ይደግፋል፤ የοὕτως አሻሚነት ግን በማስታወሻው ተጠብቋል።
