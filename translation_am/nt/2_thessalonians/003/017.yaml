  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: am
  text: ሰላምታው በእኔ በጳውሎስ እጅ የተጻፈ ነው፤ ይህም በእያንዳንዱ ደብዳቤ ምልክት ነው። እንዲህ እጽፋለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰላምታው በእኔ በጳውሎስ እጅ የተጻፈ ነው፤ ይህም በእያንዳንዱ ደብዳቤ ምልክት ነው፤ እንዲህ እጽፋለሁ።” የመጨረሻው ሐረግ በይበልጥ ቃል በቃል “እንዲህ እጽፋለሁ” ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
