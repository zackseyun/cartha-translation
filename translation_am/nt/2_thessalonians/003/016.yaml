    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: ራሱ
  rationale: ከ«ጌታ» ጋር የተያያዘው አጽንዖታዊ አጠቃቀም ባለቤቱን በግል ያጎላል፤ «ራሱ» ይህን አጽንዖት በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: δὲ
  choice: (በግልጽ ቃል አልተተረጎመም)
  rationale: እዚህ ላይ ቀላል የንግግር ሽግግርን ያመለክታል፤ በአማርኛ የመዝጊያ ቡራኬው ያለ ተጨማሪ ማያያዣ ተፈጥሯዊ ነው።
- source_word: κύριος
  choice: ጌታ
  rationale: የማዕረግ ስያሜውን በተለመደውና ክብር ባለው ዘመናዊ አማርኛ ይገልጻል።
- source_word: τῆς εἰρήνης
  choice: የሰላም
  rationale: የግሪኩን የዝምድና አገላለጽ «የሰላም ጌታ» በሚለው ስያሜያዊ ቅርጽ ያቆያል።
- source_word: δῴη
  choice: ይስጣችሁ
  rationale: የቡራኬና የጸሎት ምኞትን እንጂ ቀጥተኛ አረጋጋጭ ንግግርን አይገልጽም።
- source_word: τὴν εἰρήνην
  choice: ሰላምን
  rationale: የድርጊቱን ቀጥተኛ ተሳቢ በግልጽ ያሳያል።
- source_word: διὰ παντὸς
  choice: ሁልጊዜ
  rationale: ያለማቋረጥ በጊዜ ሁሉ የሚለውን ሰፊ የጊዜ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν παντὶ τρόπῳ
  choice: በሁሉም መንገድ
  rationale: τρόπος የአደራረግን ወይም የሁኔታን ስፋት ያመለክታል፤ ትርጉሙን ሳያጠብ በተለመደ አማርኛ ይገልጻል።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር
  rationale: πάντων የሚያሳየውን ሁሉን አካታች ስፋት በግልጽና ተፈጥሯዊ ቅርጽ ያቆያል።
theological_decisions:
- issue: በቡራኬው ውስጥ «ጌታ» የሚለው ማንን እንደሚያመለክት
  choice: ጽሑፉ እንዳለው «ጌታ» ብቻ ተብሎ ተተርጉሟል።
  alternative: «ጌታ ኢየሱስ» ብሎ በግልጽ መጨመር፣ ወይም ስያሜውን በአጠቃላይ እግዚአብሔርን እንደሚያመለክት መግለጽ።
  rationale: የግሪኩ ጽሑፍ ὁ κύριος ብቻ ይላል። ዐውደ ንባቡ ጌታ ኢየሱስን ሊያመለክት ቢችልም፣ ትርጉሙ ጽሑፉ ያልጨመረውን መለያ አያክልም።
- issue: የመጨረሻው ሐረግ ኃይል
  choice: «ጌታ ከሁላችሁ ጋር ይሁን» ተብሎ እንደ ቡራኬያዊ ምኞት ተተርጉሟል።
  alternative: «ጌታ ከሁላችሁ ጋር ነው» የሚል አረጋጋጭ ንግግር።
  rationale: በግሪኩ ግስ በግልጽ ባይኖርም፣ ዐውደ ንባቡ የመዝጊያ ቡራኬ ነው፤ «ይሁን» ይህን ተግባር በአማርኛ ያሳያል።
