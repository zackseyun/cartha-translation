  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ፤ የሐዋርያዊውን ትእዛዝ ጥንካሬ ሳያለዝብ ተፈጥሯዊ አገባብ ተጠቅሟል።
