  text: እኛም በጌታ ስለ እናንተ እንተማመናለን፤ የምናዝዛችሁን እያደረጋችሁ እንዳላችሁ እና ወደፊትም እንደምታደርጉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: እንተማመናለን
  rationale: የግሪኩን ፍጹም ጊዜ የሚያመለክተውን፣ አሁንም የቀጠለ እምነትና መተማመን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν κυρίῳ ἐφ’ ὑμᾶς
  choice: ስለ እናንተ በጌታ
  rationale: መተማመናቸው ስለ ተቀባዮቹ ቢሆንም መሠረቱና የሚከናወንበት ክልል ጌታ መሆኑን ይጠብቃል።
- source_word: παραγγέλλομεν
  choice: የምናዝዛችሁን
  rationale: ቃሉ ተራ ምክር ሳይሆን ሥልጣን ያለውን መመሪያ ወይም ትእዛዝ ያመለክታል።
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: እያደረጋችሁ ነው፣ ወደፊትም ታደርጉታላችሁ
  rationale: የአሁኑን ቀጣይ ተግባርና የወደፊቱን ተግባር ልዩነት በግልጽ አማርኛ ይገልጣል።
theological_decisions:
- issue: የመተማመኑ ምንጭና ተመልካች
  choice: ስለ እናንተ በጌታ እንተማመናለን
  alternative: በጌታ ስለ እናንተ እንተማመናለን
  rationale: ሁለቱም የግሪኩን አወቃቀር ሊያስተላልፉ ይችላሉ፤ የተመረጠው ቅደም ተከተል መተማመኑ ስለ እነርሱ ሲሆን በጌታ የተመሠረተ መሆኑን በተፈጥሯዊ አነጋገር ያቆያል።
