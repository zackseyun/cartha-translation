id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: am
  text: እርሱ ብቻ አለመሞት አለው፤ ሊቀረብ በማይቻል ብርሃን ውስጥ ይኖራል፤ ከሰዎች ማንም አላየውም፣ ሊያየውም አይችልም። ክብርና ዘላለማዊ ሥልጣን ለእርሱ ይሁን።[a] አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንዶች ይህን ገለጻና ምስጋና በሰፊው አውድ ይበልጥ በቀጥታ ጌታ ኢየሱስ መሲሕን እንደሚያመለክት ይረዱታል፤ ነገር ግን ማንም ሰው እንዳላየውና ሊያየውም እንደማይችል የሚናገረው ቋንቋ በተፈጥሮው ወደ አምላክ ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: እርሱ ብቻ
  rationale: የግሪኩን የብቸኝነትና የልዩነት አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔχων ἀθανασίαν
  choice: የማይሞትነት ያለው
  rationale: ያለመሞት በባሕርይ የእርሱ መሆኑን ይጠብቃል፤ ከቃል በቃል አቀራረብ ይልቅ ተፈጥሯዊ ነው።
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: ሊቀረብበት በማይቻል ብርሃን ውስጥ ይኖራል
  rationale: οἰκῶνን ‘ይኖራል’፣ ἀπρόσιτονንም ማንም ሊቀርበው የማይችል ብርሃን ብሎ በግልጽ አማርኛ ያቀርባል።
- source_word: οὐδεὶς ἀνθρώπων
  choice: ከሰዎች ማንም
  rationale: የግሪኩን ከፊል-አመልካች አወቃቀርና ሰውን ሁሉ የሚያካትተውን ትርጉም በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: ሊያየውም አይችልም
  rationale: δύναται የሚገልጠውን አለመቻል በግልጽ ያሳያል።
- source_word: τιμὴ
  choice: ክብር
  rationale: በምስጋና ንግግር ውስጥ የተለመደና የተከበረ አማርኛ ቃል ነው።
- source_word: κράτος αἰώνιον
  choice: ዘላለማዊ ገዢነት
  rationale: κράτος እዚህ ተግባራዊ የገዥነት ኃይልን ስለሚያመለክት፣ ‘ገዢነት’ ከተራ ኃይል ይልቅ አውዱን ይስማማል።
- source_word: ἀμήν
  choice: አሜን
  rationale: በአማርኛ የእምነት ቋንቋ የተለመደውን ቅርጽ ይጠቀማል።
theological_decisions:
- issue: የገላጭ ሐረጎቹና የምስጋናው ተቀባይ
  choice: በቀደመው አውድ ‘ብፁዕና ብቸኛ ገዥ’ ተብሎ የተጠቀሰውን አምላክ እንደሚያመለክቱ በዋናው ጽሑፍ ተተርጉሟል።
  alternative: አንዳንዶች በሰፊው የዓረፍተ ነገሩ አውድ ምክንያት ገለጻውንና ምስጋናውን ይበልጥ በቀጥታ ከጌታ ኢየሱስ መሲሕ ጋር ያያይዙታል።
  rationale: ‘ማንም አላየውም፣ ሊያየውም አይችልም’ የሚለው ቋንቋ በተፈጥሮው ወደ አምላክ ያመለክታል፤ ሆኖም የሰፊው አውድ ሌላውን ንባብ እንዲነሳ ስለሚያደርግ በማስታወሻ ተጠብቋል።
- issue: ἀνθρώπων አተረጓጎም
  choice: ከሰዎች
  alternative: ከሰው ልጆች
  rationale: የግሪኩ ቃል በዚህ አውድ የሰውን ዘር በአጠቃላይ ያመለክታል፤ ‘ከሰዎች’ ጾታን ሳያዛባ ይህን ትርጉም በዘመናዊ አማርኛ ይገልጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ገላጭ ሐረጎች በአማርኛ እንዳይከብዱ ወደ ተያያዙ ዋና ሐረጎች ተከፍለዋል። በቀረበው የእንግሊዝኛ ንባብ [a] ማስታወሻ ከ‘immortality’ በኋላ ቢቀመጥም የማስታወሻው ይዘት ስለ ‘no human being’ ነው፤ ይህ ከዋናው ግሪክ ጋር የተለየ አማራጭ ስላልሆነ አልተደገመም።
