  naturalness: The overall register is clear and suitably dignified. The revised opening has more natural Amharic word choice, and ሊቀረብ በማይቻል is smoother than the more cumbersome ሊቀረብበት በማይቻል.
  terminology: Use አለመሞት for “immortality” and ዘላለማዊ ሥልጣን for κράτος αἰώνιον. ክብር, አሜን, and ከሰዎች ማንም are appropriate.
  issues:
