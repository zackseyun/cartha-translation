  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: am
  text: 'አንተ ግን፣ የእግዚአብሔር ሰው ሆይ፣ ከእነዚህ ነገሮች ሽሽ፤ ነገር ግን ጽድቅን[a]፣ እግዚአብሔርን ማክበርን፣ እምነትን[b]፣ ፍቅርን፣ ጽናትንና ገርነትን[c] ተከታተል።


    [a] ወይም፣ “ፍትሕን።”

    [b] ወይም፣ “ታማኝነትን” ወይም “መታመንን።”

    [c] ይህ እምብዛም የማይገኝ የግሪክ ቃል “የዋህነትን፣” “ታጋሽነትን” ወይም “በትዕግሥት የተሞላ የዋህነትን” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ታማኝነትን” ወይም “መታመንን።”
    reason: lexical_alternative
  - marker: c
    text: ይህ እምብዛም የማይገኝ የግሪክ ቃል “የዋህነትን፣” “ታጋሽነትን” ወይም “በትዕግሥት የተሞላ የዋህነትን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: አንተ ግን
  rationale: አጽንዖት ያለውን የሁለተኛ መደብ ተውላጠ ስምና ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: የእግዚአብሔር ሰው ሆይ
  rationale: በቀጥታ ለጢሞቴዎስ የተነገረውን ተባዕታይ ነጠላ የአድራሻ ቅርጽና መጽሐፍ ቅዱሳዊ ስያሜ ይጠብቃል።
- source_word: ταῦτα φεῦγε
  choice: ከእነዚህ ነገሮች ሽሽ
  rationale: ወደ ቀደሙት ክፋቶችና ስሕተቶች የሚመለሰውን ጠቋሚ ቃል ግልጽ ያደርጋል፤ “ሽሽ” የትእዛዙን ኃይል ይጠብቃል።
- source_word: δίωκε δὲ
  choice: ነገር ግን … ተከታተል
  rationale: ከክፉ መሸሽን ከበጎ ነገር ንቁ ሆኖ መከታተል ጋር ያነጻጽራል።
- source_word: δικαιοσύνην
  choice: ጽድቅን
  rationale: በዚህ የበጎ ምግባራት ዝርዝር ውስጥ የሞራልና የግንኙነት ቅንነትን የሚያመለክተው የተለመደ አቻ ቃል ነው፤ “ፍትሕ” በማስታወሻ ተጠብቋል።
- source_word: εὐσέβειαν
  choice: እግዚአብሔርን ማክበርን
  rationale: ለመደበኛ አንባቢ ግልጽ በሆነ ቋንቋ ለእግዚአብሔር ያደረና አክብሮት ያለውን ኑሮ ይገልጣል።
- source_word: πίστιν
  choice: እምነትን
  rationale: የተለመደውን ዋና ትርጉም ይጠብቃል፤ በዚህ የበጎ ምግባራት ዝርዝር ውስጥ ሊኖሩ የሚችሉት “ታማኝነት” እና “መታመን” በማስታወሻ ተጠብቀዋል።
- source_word: ἀγάπην
  choice: ፍቅርን
  rationale: ግልጽ፣ ተፈጥሯዊና የተለመደ አቻ ቃል ነው።
- source_word: ὑπομονήν
  choice: ጽናትን
  rationale: በችግር ውስጥ ሳይታክቱ መቆየትንና መጽናትን በአጭር እና ተፈጥሯዊ ቃል ያስተላልፋል።
- source_word: πραϋπαθίαν
  choice: ገርነትን
  rationale: የቃሉን የዋህነትና ራስን በትዕግሥት የመግታት ሐሳብ በቀላሉ የሚያቀርብ ዋና ትርጉም ነው፤ የቃሉ ሰፊ ጥላዎች በማስታወሻ ቀርበዋል።
theological_decisions:
- issue: በὦ ἄνθρωπε θεοῦ ያለው ጾታዊ አድራሻ
  choice: የእግዚአብሔር ሰው ሆይ
  alternative: የእግዚአብሔር ሰው
  rationale: ግሪኩ ተባዕታይ ነጠላ ሲሆን በቀጥታ ለጢሞቴዎስ የተነገረ ነው፤ “ሆይ” የጥሪውን ቅርጽ ያሳያል።
- issue: የδικαιοσύνη ትርጉም ስፋት
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: የበጎ ምግባራት ዝርዝሩ “ጽድቅ”ን ዋና ምርጫ ያደርገዋል፤ የማኅበራዊ ፍትሕ ገጽታው እንዳይጠፋ አማራጩ በማስታወሻ ተጠብቋል።
- issue: በበጎ ምግባራት ዝርዝር ውስጥ የπίστις ትርጉም
  choice: እምነት
  alternative: ታማኝነት ወይም መታመን
  rationale: “እምነት” ዋናውን ትርጉም ይጠብቃል፤ ነገር ግን ዐውደ ንባቡ ታማኝነትንም ሊያመለክት ስለሚችል ያ ጥርጣሬ በማስታወሻ ተገልጧል።
- issue: የእምብዛም የማይገኘው πραϋπαθία ትርጉም
  choice: ገርነት
  alternative: የዋህነት፣ ታጋሽነት፣ ወይም በትዕግሥት የተሞላ የዋህነት
  rationale: አንድ የአማርኛ ቃል የግሪኩን ሙሉ ጥላ አይይዝም፤ ተነባቢው ዋና ምርጫ በጽሑፉ ውስጥ፣ ሌሎቹ አማራጮች በማስታወሻ ቀርበዋል።
