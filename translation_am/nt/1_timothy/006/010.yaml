- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: ከእምነቱ ርቀው ተቅበዝብዘዋል
  rationale: ግሱ ከመንገድ መሳትን ወይም መቅበዝበዝን የሚያሳይ ሲሆን ἀπό ከነበረ አቋም መራቅን ያመለክታል። ‘እምነቱ’ በዚህ ዐውድ የክርስትናን እምነት እንደ የጋራ እምነት ያቀርባል።
- source_word: περιέπειραν
  choice: ራሳቸውንም … ወግተዋል
  rationale: ግሱ መውጋትን ወይም አሳልፎ መበሳትን የሚያሳይ ሕያው ምስል አለው። ‘ራሳቸውን ወግተዋል’ ይህን ምስልና ድርጊቱ በራሳቸው ላይ መድረሱን ይጠብቃል።
