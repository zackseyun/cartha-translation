  rationale: ቃሉ በቀጥታ ገንዘብን ወይም ብርን መውደድን ያመለክታል። ይህ አተረጓጎም ‘ስግብግብነት’ ከሚለው ይበልጥ የቃሉን የተወሰነ ምስል ይጠብቃል።
