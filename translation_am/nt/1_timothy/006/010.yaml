  choice: አንዱ ሥር
  rationale: ግሪክኛው ῥίζα ያለ የተወሰነ አመልካች በግስ በፊት የቆመ የፍርድ ስም ነው። ‘አንዱ ሥር’ የሚለው ገንዘብን መውደድ ብቸኛው የክፋት ምንጭ ነው የሚል ፍጹም አባባል ሳያስገባ ምስሉን ይጠብቃል።
- source_word: πάντων τῶν κακῶν
  choice: ለሁሉም ዓይነት ክፋቶች
