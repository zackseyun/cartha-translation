base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: am
  text: ገንዘብን መውደድ ለሁሉም ዓይነት ክፋቶች ሥር ከሆኑት አንዱ ነውና።[a] አንዳንዶች ይህን በጽኑ በመሻታቸው ከእምነቱ ተስተው ሄደዋል፤[b] ራሳቸውንም በብዙ ሥቃዮች ወግተዋል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ገንዘብን መውደድ የክፋት ሁሉ ሥር ነው።” ግሪክኛው ግን “ለሁሉም ዓይነት ክፋቶች ሥር ከሆኑት አንዱ” የሚለውን ትርጉም በተፈጥሮ ይፈቅዳል፤ ይህም ክፋት ሁሉ አንድ ምንጭ ብቻ አለው የሚል አንድምታ ያስወግዳል።
    reason: alternative_reading
  - marker: b
    text: ወይም፦ “ከእምነት ስተዋል።” እዚህ “እምነቱ” የሚለው ምናልባት የክርስትናን እምነት እንደ የጋራ እምነትና ትምህርት ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፦ “ራሳቸውን በብዙ ሐዘኖች” ወይም “በብዙ ጭንቀቶች ወግተዋል።”
    reason: lexical_alternative
