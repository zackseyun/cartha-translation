    text: በተለምዶ፣ “የነገሥታት ንጉሥና የጌቶች ጌታ” ተብሎ ይተረጎማል። ግሪኩ ግን ቃል በቃል “የሚነግሡት ንጉሥና የሚገዙት ጌታ” የሚል አሳታፊ ግሶችን ይጠቀማል።
