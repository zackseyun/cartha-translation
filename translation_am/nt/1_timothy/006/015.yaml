lexical_decisions:
- source_word: ἣν
  choice: ያን መገለጥ
  rationale: አንስታይ ነጠላው አንጻራዊ ተውላጠ ስም በቁጥር 14 ያለውን ἐπιφάνειαν (‘መገለጥ’) ያመለክታል። ቁጥሩ ለብቻው ሲነበብም ግልጽ እንዲሆን ስሙ ተደግሟል።
- source_word: καιροῖς ἰδίοις
  choice: በራሱ በወሰናቸው ጊዜያት
  rationale: καιρός የተወሰነን ወይም የተመደበን ጊዜ ያመለክታል፤ የግሪኩ ብዙ ቁጥርም ‘ጊዜያት’ በማለት ተጠብቋል። ἰδίοις ጊዜያቱ በሚያሳየው አካል እንደተወሰኑ ያሳያል።
- source_word: δείξει
  choice: ያሳያል
  rationale: የወደፊት ጊዜ ግስ ሲሆን መገለጡን በግልጽ እንዲታይ የማድረግን  concrete ኃይል ይጠብቃል።
- source_word: ὁ μακάριος
  choice: የተባረከው
  rationale: እዚህ ማκάριος በስም ተግባር የገባ መለኮታዊ ማዕረግ ነው፤ ‘ደስተኛ’ ከማለት ይልቅ ‘የተባረከው’ ክብሩንና የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: μόνος δυνάστης
  choice: ብቸኛው ገዢ
  rationale: δυνάστης የመግዛት ሥልጣን ያለውን ያመለክታል፤ ‘ገዢ’ በዘመናዊ አማርኛ ግልጽ ሲሆን μόνος የሚያሳየውን ልዩነት ‘ብቸኛው’ ይጠብቃል።
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: በሚነግሡት ላይ ንጉሥ
  rationale: βασιλευόντων ስም ሳይሆን ‘የሚነግሡ’ የሚል አሳታፊ ግስ ነው። ትርጉሙ የግሪኩን ግሳዊ ኃይልና በእነርሱ ላይ ያለውን የበላይነት ይጠብቃል።
- source_word: κύριος τῶν κυριευόντων
  choice: በሚገዙትም ላይ ጌታ
  rationale: κύριος እንደ የሥልጣን ማዕረግ ‘ጌታ’ ተብሏል፤ κυριευόντων ደግሞ ‘የሚገዙ’ የሚል አሳታፊ ግስ ስለሆነ የግሪኩ ቅርጽ ተጠብቋል።
theological_decisions:
- issue: መገለጡን የሚያሳየው ማንነት
  choice: የግሪኩን አቀራረብ በመከተል ርዕሰ ጉዳዩ ‘እርሱ’ ተብሎ ቀጥሎ በቁጥሩ ማዕረጎች ተገልጿል።
  alternative: ከአውዱ በመነሳት ‘እግዚአብሔር አብ’ ብሎ በግልጽ መሰየም።
  rationale: የግሪክ ጽሑፉ እዚህ የተገቢውን ርዕሰ ጉዳይ በታላላቅ ማዕረጎች እንጂ በግልጽ የግል ስም አይጠራውም። ስለዚህ ትርጉሙ ከጽሑፉ በላይ የሆነ የሥነ መለኮት መለያ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። አንቀጹ ከቁጥር 14 የሚቀጥል ቢሆንም፣ ብቻውን ሲነበብ ግልጽ እንዲሆን ‘መገለጥ’ ተደግሟል።
