  to: እንከን የሌለበትንና ነቀፋ የማይቀርብበትን ትእዛዝ ጌታችን ኢየሱስ መሲሕ[a] እስኪገለጥ ድረስ ጠብቅ።
  rationale: The revision removes the unexpressed idea of making the commandment faultless, renders the two Greek adjectives as direct modifiers of ትእዛዝ, and uses a more precise natural expression for being beyond reproach. Footnote b is omitted because the Greek morphology syntactically attaches both adjectives to 'the commandment.'
