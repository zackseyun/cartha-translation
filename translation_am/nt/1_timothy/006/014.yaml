    text: ወይም፣ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός ቃል “መሲሕ” ተብሎ እንደ ማዕረግ ሊተረጎም ወይም “ክርስቶስ” ተብሎ እንደ ተለመደ የስም አካል ሊቀርብ ይችላል።
