lexical_decisions:
- source_word: τηρῆσαί
  choice: ጠብቀው
  rationale: በዐውዱ ውስጥ ትእዛዙን በታማኝነት መፈጸምና ይዞ መቀጠልን ያመለክታል፤ ‘ጠብቀው’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐντολήν
  choice: ትእዛዙን
  rationale: የታወቀ ነጠላ ትእዛዝን ያመለክታል፤ ከቀደመው አደራ ጋር ያለውን ግንኙነትና የቃሉን ክብደት ይጠብቃል።
- source_word: ἄσπιλον
  choice: እንከን የሌለበት
  rationale: እድፍ ወይም ነውር የሌለበትን ሁኔታ ያሳያል፤ በዘመናዊ አማርኛ ግልጽና ክብር ያለው አገላለጽ ነው።
- source_word: ἀνεπίλημπτον
  choice: ነቀፋ የማያስከትል
  rationale: ሕጋዊ ወይም ተገቢ የሆነ ነቀፋ ሊቀርብበት የማይችልን ሁኔታ ያስተላልፋል።
- source_word: μέχρι τῆς ἐπιφανείας
  choice: እስኪገለጥ ድረስ
  rationale: እስከ ወደፊቱ መገለጥ የሚዘልቀውን ጊዜ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ዳግም’ የሚል በግሪኩ ያልተገለጸ ቃል አልተጨመረም።
- source_word: κυρίου ἡμῶν
  choice: ጌታችን
  rationale: κύριος የክብርና የሥልጣን ማዕረግ ሆኖ በአጭርና በተለመደ አማርኛ ተተርጉሟል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Ἰησοῦς እንደ ስም ተጽፏል፤ Χριστός በዚህ የፍጻሜ ዘመን አውድ የቅቡዕነት ማዕረጉን እንዲያሰማ ‘መሲሕ’ ተብሏል።
theological_decisions:
- issue: Χριστός በἸησοῦ Χριστοῦ ውስጥ እንዴት እንደሚተረጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ክቡርና የፍጻሜ ዘመን አገላለጽ ውስጥ የማዕረጉ ትርጉም ጎልቶ ይሰማል፤ ስለዚህ ትርጉሙን የሚያሳየው ‘መሲሕ’ በዋናው ጽሑፍ ተመርጧል።
- issue: ἄσπιλον ἀνεπίλημπτον ከἐντολήν ወይም ከτηρῆσαί ጋር ያላቸው ግንኙነት
  choice: በዋናው ጽሑፍ ከትእዛዙ ጋር የሚያያዝ አገላለጽ፣ አሻሚነቱም በማስታወሻ
  alternative: ጢሞቴዎስ ትእዛዙን እንከን በሌለበትና ነቀፋ በማያስከትል ሁኔታ እንዲጠብቅ
  rationale: የግሪኩ አጭር አወቃቀር ቅጽሎቹ ትእዛዙን ራሱን ወይም የጥበቃውን ሁኔታ እንዲገልጹ ያስችላል፤ አንዱን ብቻ በግድ ሳይወስን ማስታወሻው ሁለቱንም ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ሐረግ በአማርኛ የቀጥታ ትእዛዝ ቅርጽ ቀርቧል፤ ይህም ከቀደመው ጥቅስ የሚቀጥለውን የአደራ ኃይል ይጠብቃል።
