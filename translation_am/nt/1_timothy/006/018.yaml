  verdict: revise
  source_fidelity: The four exhortational infinitives are represented accurately, including the wealth metaphor in πλουτεῖν and the two related but distinct qualities of generosity and sharing. However, the draft adds «እዘዛቸው» (“command them”), which is not present in verse 18 itself; it belongs to the governing command in the preceding verse.
  naturalness: The wording is clear and modern. «ሀብታሞች እንዲሆኑ» is slightly more idiomatic than «ባለጠጎች እንዲሆኑ» for the metaphorical expression while retaining the contrast with material riches.
  terminology: «መልካም ሥራዎች», «ለጋሶች», and «ለማካፈል ዝግጁዎች» are suitable modern-standard renderings. They preserve the ethical sense without importing theological interpretation.
  issues:
