  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀγαθοεργεῖν, πλουτεῖν ἐν ἔργοις καλοῖς, εὐμεταδότους εἶναι, κοινωνικούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/018.yaml
  text: to do good, to be rich in good works, to be generous, ready to share,
translation:
  language: am
  text: መልካም ነገር እንዲያደርጉ፣ በመልካም ሥራዎች ሀብታሞች እንዲሆኑ፣ ለጋሶችና ለማካፈል ዝግጁዎች እንዲሆኑ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: መልካም ነገር እንዲያደርጉ
  rationale: የግሱን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያቆያል፤ ‘መልካም ሥራዎችን’ ብሎ ከቀጣዩ ሐረግ ጋር መደጋገምንም ይቀንሳል።
- source_word: πλουτεῖν ἐν ἔργοις καλοῖς
  choice: በመልካም ሥራዎች ባለጠጎች እንዲሆኑ
  rationale: πλουτεῖν ያለውን የሀብት ምስል ጠብቆ፣ በዐውዱ ካለው ቁሳዊ ሀብት ጋር የታሰበውን ንፅፅር ያስቀራል። ἐν ἔργοις καλοῖς ደግሞ የብልጽግናውን መስክ ያመለክታል።
- source_word: εὐμεταδότους
  choice: ለጋሶች
  rationale: ሀብትን ለሌሎች ለመስጠት ፈቃደኛ የመሆንን ባሕርይ በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κοινωνικούς
  choice: ለማካፈል ዝግጁዎች
  rationale: ከሌሎች ጋር ለመካፈል ያለውን ዝንባሌና ፈቃደኝነት ያሳያል፤ ቃሉን በዘመናዊ ፖለቲካዊ ወይም ተቋማዊ ትርጉም እንዳያስተላልፍም ይከላከላል።
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: ለጋሶችና ለማካፈል ዝግጁዎች እንዲሆኑ
  rationale: የመጀመሪያውን የመስጠት ለጋስነትና የሁለተኛውን የማካፈል ዝግጁነት እንደ ተዛማጅ ግን ልዩ ሐሳቦች ይጠብቃል።
theological_decisions:
- issue: የπλουτεῖν የሀብት ምስል
  choice: ባለጠጎች እንዲሆኑ
  alternative: እንዲበዙ
  rationale: ይህ ምርጫ በአካባቢው ዐውድ ካለው ቁሳዊ ባለጠግነት ጋር የሚፈጠረውን ሥነ ንግግራዊ ንፅፅር ግልጽ አድርጎ ይጠብቃል፤ መልካም ሥራዎች የድነት ዋጋ ናቸው የሚል ተጨማሪ ዶክትሪናዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። የቁጥሩ ግሶች በቀደመው ዐውድ ያለውን ‘እዘዛቸው’ የሚለውን ዋና ትእዛዝ እንዲከተሉ ተተርጉመዋል፤ ጥቅሱ ብቻውንም ሙሉ ሐረግ ሆኖ እንዲነበብ ዋናው ግስ በመጨረሻ ተካቷል።
