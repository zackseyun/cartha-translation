    text: ወይም «አገልጋዮች» ወይም «በውል የታሰሩ አገልጋዮች»፤ ግሪክኛው δοῦλοι ነው። እዚህ «ባሪያዎች» የተባለው «ቀንበር ሥር» የሚለው ሐረግ የባርነት ሁኔታውን ግልጽ ስለሚያደርግ ነው።
