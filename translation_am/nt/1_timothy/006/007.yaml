  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: am
  text: ምክንያቱም ወደ ዓለም ምንም አላመጣንም፤[a] ከዓለምም ምንም ይዘን መውጣት አንችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል፦ “ምክንያቱም ወደ ዓለም ምንም አላመጣንም፤ ምንም ይዘን መውጣትም አንችልም።” ወይም ὅτι ምክንያትን እንደሚያመለክት ከተወሰደ፦ “ምክንያቱም ወደ ዓለም ምንም አላመጣንም፤ ምንም ይዘን መውጣት ስለማንችል።” የግሪኩ አያያዥ ቃል ምክንያትን (‘ስለ’) እንደሚገልጥ ወይም ተመጣጣኙን ሁለተኛ ንግግር እንደሚያስገባ ሊወሰድ ይችላል።
    reason: alternative_reading
lexical_decisions:
