  choice: በማይታመን ሀብት ላይ
  rationale: ἀδηλότης የሀብትን እርግጠኛ ያለመሆንና የማይታመን ባሕርይ ይገልጻል፤ የግሪክኛውን አጭር አወቃቀር ይጠብቃል።
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: ሳይሆን … በእግዚአብሔር ላይ
