  rationale: ጽሑፉ የሚናገረውን ሰፊ አቅርቦት ይጠብቃል፤ ወደ መሠረታዊ ፍላጎት ብቻ አይገድበውም፣ የብልጽግና ተስፋም አያስገባም።
- issue: የθεῷ የጽሑፍ ልዩነት
