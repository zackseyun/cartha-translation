- source_word: πλουσίως
  choice: በብዛት
  rationale: የመስጠቱን ብዛትና ልግስና በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ሀብታም አድርጎ’ በማለት የብልጽግና ትርጉም አያስገባም።
- source_word: εἰς ἀπόλαυσιν
  choice: ለደስታችን
