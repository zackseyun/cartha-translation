  text: But if we have food and covering[a], we will be content with these.
translation:
  language: am
  text: ነገር ግን ምግብና መሸፈኛ[a] ካለን፣ በእነዚህ እንረካለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልብስ”፤ የግሪኩ ቃል ሰውን የሚሸፍንን ነገር በሰፊው ሊያመለክት ስለሚችል መጠለያንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: ካለን
  rationale: የግሱ አጋዥ ቅርጽ ለዋናው ግስ ሁኔታን ይገልጻል፤ በዘመናዊ አማርኛ ካለን የሚለው ሁኔታዊ አገላለጽ ተፈጥሯዊ ሲሆን ከግሪኩ በላይ የሆነ ምክንያታዊ ትርጉም አያስገባም።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ንፅፅርና የሐሳብ ሽግግር በግልጽ ያሳያል።
- source_word: διατροφὰς
  choice: ምግብ
  rationale: ቃሉ የመኖሪያ ሲሳይን፣ በተለይም ምግብን ያመለክታል፤ ምግብ በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ምርጫ ነው።
- source_word: σκεπάσματα
  choice: መሸፈኛ
  rationale: ቃሉ ሰውን የሚሸፍንን ነገር በሰፊው ሊያመለክት ስለሚችል፣ መሸፈኛ ማለት ትርጉሙን ወደ ልብስ ብቻ ወይም ወደ መጠለያ ብቻ አያጠብም።
- source_word: τούτοις
  choice: በእነዚህ
  rationale: አመልካች ተውላጠ ስሙ ከዚህ በፊት የተጠቀሱትን መሠረታዊ ፍላጎቶች ይመለከታል፤ በእነዚህ የሚለው ይህን አመልካች ኃይል ይጠብቃል።
- source_word: ἀρκεσθησόμεθα
  choice: እንረካለን
  rationale: የወደፊት ጊዜ አመልካች ቅርጹንና የመብቃቃት/የመርካት ሐሳቡን ይጠብቃል፤ እንርካ የሚለው የትእዛዝ ወይም የማሳሰቢያ ንባብ በጽሑፉ ላይ አይጫንም።
theological_decisions:
- issue: የσκεπάσματα ወሰን
  choice: ልብስንና ምናልባትም መጠለያን ሊያካትት የሚችል ሰፊ መሸፈኛ
  alternative: ልብስ ብቻ ወይም መጠለያ ብቻ
  rationale: ጥቅሱ በመሠረታዊ ፍላጎቶች መርካትን ያስተምራል፤ የግሪኩ ቃል ግን ከአንድ ዓይነት መሸፈኛ የሰፋ ሊሆን ስለሚችል ትርጉሙ እርግጠኛ ያልሆነውን ወሰን አያጠብም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። መሸፈኛ የሚለው ቃል በዋናው ጽሑፍ የግሪኩን ሰፊ የትርጉም ክልል ይጠብቃል፤ የግርጌ ማስታወሻውም ልብስ የሚለውን ተፈጥሯዊ አማራጭና መጠለያ ሊካተት የሚችልበትን እድል ያብራራል።
