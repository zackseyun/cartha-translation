base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: am
  text: 'ነገር ግን ሀብታም ለመሆን[a] የሚፈልጉ ሰዎች በፈተና፣ በወጥመድ፣ እንዲሁም ሰዎችን ወደ ውድመትና ጥፋት በሚያሰጥሙ ብዙ ሞኝነት የተሞሉና ጎጂ ምኞቶች ውስጥ ይወድቃሉ።


    [a] የግሪኩ ቃል ሀብታም መሆንን ወይም ሀብት ማካበትን የመፈለግ ሐሳብ ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል ሀብታም መሆንን ወይም ሀብት ማካበትን የመፈለግ ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: ነገር ግን … የሚፈልጉ
  rationale: βούλομαι የተረጋጋ ፍላጎትን ወይም ዓላማን ያመለክታል፤ ይህ አተረጓጎም ተሳቢውን ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πλουτεῖν
  choice: ሀብታም ለመሆን
  rationale: ቃሉ ሀብታም መሆንን ወይም ሀብት ማካበትን ሊያመለክት ይችላል፤ ዋናው ትርጉም ሁለቱንም ሳይገድብ ይይዛል።
- source_word: ἐμπίπτουσιν
  choice: ውስጥ ይወድቃሉ
  rationale: ወደ አሉታዊ ሁኔታ የመግባትን ምሳሌያዊ አገላለጽ በግልጽ አማርኛ ያስተላልፋል።
- source_word: πειρασμόν
  choice: ፈተና
  rationale: በዚህ የማስጠንቀቂያ አውድ ቃሉ ወደ ኃጢአት የሚስብን ፈተና ያመለክታል።
- source_word: παγίδα
  choice: ወጥመድ
  rationale: የማጥመድን ምስልና ሥነ ምግባራዊ አደጋውን የሚጠብቅ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: ብዙ ሞኝነት የተሞሉና ጎጂ የሆኑ ምኞቶች
  rationale: ἐπιθυμίαι ምኞቶችን፣ ἀνόητος አስተዋይነት የጎደለውን ባሕርይ፣ βλαβερός ደግሞ ጉዳት አድራሽነትን ያመለክታሉ።
- source_word: βυθίζουσι
  choice: ያሰጥሙ
  rationale: βυθίζω አንድን ነገር ወደ ጥልቅ የማስገባት ወይም የማስጠም ሕያው ምስል አለው፤ ‘ያሰጥሙ’ ይህን ኃይል ይጠብቃል።
- source_word: τοὺς ἀνθρώπους
  choice: ሰዎችን
  rationale: ἄνθρωποι እዚህ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: ውድመትና ጥፋት
  rationale: ሁለቱን ተዛማጅ ግን የተለያዩ ቃላት በሁለት የአማርኛ ቃላት በመተርጎም የተደራራቢውን ክብደት ይጠብቃል።
theological_decisions:
- issue: ὄλεθρον καὶ ἀπώλειαν የዘላለም ፍርድን ብቻ እንደሚያመለክቱ መወሰን
  choice: ውድመትና ጥፋት
  alternative: ዘላለማዊ ጥፋት ወይም ኩነኔ
  rationale: የግሪኩ ቃላት እጅግ ከባድ መዘዝን ያሳያሉ፣ ነገር ግን በዚህ ቁጥር ብቻ የመዘዙን ወሰን ዘላለማዊ ኩነኔ ብለው አይገድቡትም። አጠቃላይ ቃላቱን መጠበቅ የጽሑፉን ክብደትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ያሰጥሙ’ የግሪኩን ሕያው ምስል ይጠብቃል፤ የውድመትና የጥፋት ድርብ አገላለጽም ሆን ተብሎ ተጠብቋል።
