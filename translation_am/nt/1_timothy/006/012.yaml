base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: am
  text: የእምነትን መልካም ትግል ታገል[a]፤ የተጠራህበትን የዘላለም ሕይወት አጥብቀህ ያዝ፤ በብዙ ምስክሮች ፊትም መልካሙን እውቅና ሰጥተሃል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መልካሙን የእምነት ትግል ታገል።” የግሪክኛው አገላለጽ በእምነት የሚካሄድን ትግል ወይም ለክርስቲያናዊው እምነት የሚደረግን ትግል ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “እናም በብዙ ምስክሮች ፊት መልካሙን እውቅና ሰጥተሃል።” የግሪክኛው ጽሑፍ የዚህን እውቅና ይዘት በግልጽ አይገልጽም፤ ሆኖም ከዘላለም ሕይወት ጥሪ ጋር በቅርብ የተያያዘ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: መልካም ትግል ታገል
  rationale: የግስና የስም የአንድ ሥር ቅርርብን በተፈጥሯዊ አማርኛ ይጠብቃል፤ የቀጣይ ብርቱ ጥረትንም ያሳያል።
- source_word: τῆς πίστεως
  choice: የእምነትን
  rationale: πίστιςን “እምነት” ብሎ ይተረጉማል፤ የግሪክኛውን የባለቤትነት አወቃቀር ሳያጠብ በዋናው ጽሑፍ ትርጉሙን ክፍት ያደርጋል።
- source_word: ἐπιλαβοῦ
  choice: አጥብቀህ ያዝ
  rationale: ወሳኝና ንቁ በሆነ መንገድ መያዝን የሚያሳየውን ዘይቤ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῆς αἰωνίου ζωῆς
  choice: የዘላለም ሕይወት
  rationale: የተስፋ ቃሉን የተወሰነ ሕይወት በተለመደና ግልጽ የአማርኛ አገላለጽ ያቀርባል።
- source_word: εἰς ἣν ἐκλήθης
  choice: የተጠራህበትን
  rationale: ጥሪው ወደ ዘላለም ሕይወት ያመራል የሚለውን የግሪክኛውን የግብ ግንኙነት በአጭር አማርኛ ይገልጣል።
- source_word: τὴν καλὴν ὁμολογίαν
  choice: መልካሙን የእምነት መግለጫ
  rationale: ὁμολογίαን ከኃጢአት ኑዛዜ ጋር ሳያምታታ ይፋዊ የእምነት እውቅና እንደሆነ ያሳያል፤ καλόςንም “መልካም” በማለት ከቀደመው ሐረግ ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: በብዙ ምስክሮች ፊት
  rationale: ይፋዊ መገኘትን በግልጽና በተለመደ አማርኛ ይገልጣል፤ μάρτυρες እዚህ “ምስክሮች” ማለት ነው።
theological_decisions:
- issue: በτῆς πίστεως ውስጥ πίστις ያለው ትርጉም
  choice: የእምነትን መልካም ትግል
  alternative: መልካሙን የእምነት ትግል፤ ማለትም በእምነት የሚካሄድ ትግል
  rationale: የግሪክኛው ሐረግ የክርስቲያንን እምነት የሚመለከት ትግልን ወይም በእምነት የሚለይ ትግልን ሊያመለክት ይችላል። ዋናው ትርጉም የመጀመሪያውን በትንሹ ያስቀድማል፤ ሌላው ግን በማስታወሻ ተጠብቋል።
- issue: የὁμολογία ከዘላለም ሕይወት ጥሪ ጋር ያለው ግንኙነት
  choice: የተያያዙ ነገር ግን በይዘት በግልጽ ያልተመሳሰሉ ሐረጎች
  alternative: የእምነት መግለጫው ስለተጠራበት ዘላለም ሕይወት እንደሆነ በግልጽ ማያያዝ
  rationale: ግሪክኛው καί ብቻ ይጠቀማል፤ ስለዚህ የመግለጫውን ትክክለኛ ይዘት በዋናው ጽሑፍ አልተጨመረም። የቅርብ ግንኙነቱ እንደ አማራጭ በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ትግል ታገል” የሚለው የግሪክኛውን የአንድ ሥር አገላለጽ ያስተጋባል፤ “የእምነት መግለጫ” ደግሞ ይፋዊ እውቅናን ከኃጢአት ኑዛዜ ይለያል።
