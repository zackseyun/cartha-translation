  to: ጢሞቴዎስ ሆይ፣ አደራ የተሰጠህን ጠብቅ፤ ከርኩስ ባዶ ንግግሮችና በሐሰት “እውቀት” ተብሎ ከሚጠራው ተቃርኖዎች[a] ራቅ።
