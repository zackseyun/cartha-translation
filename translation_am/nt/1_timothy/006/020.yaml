lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: ጢሞቴዎስ ሆይ
  rationale: Ὦ ያለውን የክብደትና የቀጥታ ጥሪ ስሜት “ሆይ” በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παραθήκην
  choice: አደራ የተሰጠህን
  rationale: παραθήκη ለጥበቃ የተሰጠ ነገርን ያመለክታል፤ “አደራ” ዘይቤውን ጠብቆ የቃሉን ይዘት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: φύλαξον
  choice: ጠብቅ
  rationale: ለአደራ የተሰጠውን በንቃት የመጠበቅና የመከላከል ትእዛዝ በግልጽ ያስተላልፋል።
- source_word: ἐκτρεπόμενος
  choice: ራቅ
  rationale: ከአንድ ነገር ፊትን የማዞርና የመራቅ ሐሳብን ከዋናው ትእዛዝ ጋር በተፈጥሯዊ የአማርኛ አገባብ ይገልጣል።
- source_word: βεβήλους
  choice: ርኩስ ከሆነው
  rationale: ከቅዱስነት ውጭ የሆነውንና የተዋረደውን የንግግሩን ባሕርይ ያሳያል።
- source_word: κενοφωνίας
  choice: ባዶ ንግግር
  rationale: ይዘትና ጥቅም የሌለውን ንግግር ግልጽና ዘመናዊ በሆነ አገላለጽ ያቀርባል።
- source_word: ἀντιθέσεις
  choice: ተቃርኖ
  rationale: ቃሉ ተቃራኒ አባባሎችን ወይም ተቃውሞዎችን ሊያመለክት ይችላል፤ “ተቃርኖ” ዋናውን የመጋጨት ሐሳብ ይጠብቃል።
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: “እውቀት” ተብሎ በሐሰት ከተጠራው
  rationale: ψευδώνυμος የ“እውቀት” ስያሜው ትክክለኛ እንዳልሆነ ይክዳል፤ የጥቅስ ምልክቱም ይህን ርቀት በአማርኛ በግልጽ ያሳያል።
theological_decisions:
- issue: በዚህ አውድ የπαραθήκη ይዘት
  choice: “አደራ የተሰጠህን” ተብሎ ይዘቱ ሳይጠበብ ተተርጉሟል።
  alternative: “ወንጌልን”፣ “የሐዋርያትን ትምህርት” ወይም “የአገልግሎት ኃላፊነትህን” ብሎ መግለጽ።
  rationale: አውዱ የተሰጠውን መልእክት ሊያመለክት ቢችልም፣ ግሪክኛው ስም በዚህ ቁጥር ይዘቱን በግልጽ አይወስንም፤ ትርጉሙም ይህን ክፍትነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ሆይ” የግሪክኛውን የክብደት ጥሪ ይጠብቃል፤ አላስፈላጊ የቤተ እምነት ቃላት አልገቡም።
