- from: 'ጢሞቴዎስ ሆይ፣ አደራ የተሰጠህን ጠብቅ፤ ርኩስ ከሆነው ባዶ ንግግርና “እውቀት” ተብሎ በሐሰት ከተጠራው ተቃርኖ[a] ራቅ።


