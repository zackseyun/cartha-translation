  text: በአእምሯቸው የተበላሹና ከእውነት የተነጠቁ ሰዎች መካከል የማያቋርጥ ግጭት[a] ይኖራል፤ እነርሱም ለእግዚአብሔር በአክብሮት መኖርን የትርፍ መንገድ[b] አድርገው ያስባሉ።
  philosophy: optimal-equivalence
  footnotes:
