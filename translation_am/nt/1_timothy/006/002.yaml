  rationale: በጥንቱ የባርነት ቤተሰባዊ ሥርዓት ውስጥ ሥልጣንና ባለቤትነት ያላቸውን ያመለክታል፤ «ጌቶች» በአማርኛ የተለመደው አቻ ነው።
- source_word: καταφρονείτωσαν
  choice: አይናቋቸው
  rationale: ንቀትንና ክብር መንፈግን በግልጽና ጠንካራ አማርኛ ያስተላልፋል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩን ወንድ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ በክርስቲያናዊው አጠቃቀም የእምነት ቤተሰብ አባላትን ሊያመለክት ይችላል።
- source_word: μᾶλλον δουλευέτωσαν
  choice: ይልቁንም ከዚህ የበለጠ ያገልግሏቸው
  rationale: δουλεύω በባርነት ሁኔታ ውስጥ አገልግሎት መስጠትን ያመለክታል፤ አውዱ ማኅበራዊ ሁኔታውን ስለሚያሳይ «ያገልግሏቸው» ተፈጥሯዊ ነው፣ μᾶλλονም «ከዚህ የበለጠ» ተብሎ ተጠብቋል።
