  rationale: በክርስቶስ የሚያምኑ ሰዎችን እንጂ ታማኝ ሰዎችን ብቻ እንደማያመለክት ግልጽ ያደርጋል።
- source_word: ἀγαπητοὶ
  choice: የተወደዱ
  rationale: በእምነት ማኅበሩ ውስጥ ያለውን ፍቅራዊ ግንኙነት ይጠብቃል።
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ከመልካም አገልግሎቱ የሚጠቀሙት
  rationale: የተጨመቀውን የግሪክ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል፤ εὐεργεσία መልካም ውለታን ወይም ጥቅምን፣ ἀντιλαμβάνομαι ደግሞ ከእርሱ መጠቀምን ያመለክታል። የሚጠቀሙት አማኝ ጌቶች መሆናቸው በአውዱ የሚቀርበው አብዛኛው ንባብ ነው።
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: እነዚህን አስተምር፤ አጥብቀህም ምከር
  rationale: ሁለቱንም የአሁን ጊዜ ትእዛዛት በግልጽ አማርኛ ያስተላልፋል፤ παρακάλει በዚህ የምክር አውድ ጽናት ያለውን ማሳሰቢያ ይገልጣል።
