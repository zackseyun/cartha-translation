base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: am
  text: የሚያምኑ ጌቶች ያሏቸውም፣ ወንድሞች ስለሆኑ አይናቋቸው[a]፤ ይልቁንም የበለጠ ያገልግሏቸው፣ ምክንያቱም ውለታውን የሚቀበሉት አማኞችና የተወደዱ ናቸው[b]። እነዚህን አስተምርና አሳስብ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወንድሞችና እህቶች»፤ የግሪኩ ቃል በቀጥታ «ወንድሞች» ይላል።
    reason: lexical_alternative
  - marker: b
    text: «ውለታውን የሚቀበሉት» የሚለው ሐረግ ለመተርጎም አስቸጋሪ ነው። በአውዱ እጅግ የሚመስለው፣ የባሪያዎቹን አገልግሎት የሚቀበሉትን አማኝ ጌቶች ማመልከቱ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: የሚያምኑ
  rationale: በዚህ አውድ ቃሉ በክርስቶስ የሚያምኑ ጌቶችን ያመለክታል፤ ታማኝነታቸውን ብቻ አያመለክትም።
