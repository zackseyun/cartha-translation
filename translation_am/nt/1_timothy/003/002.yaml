    issue: የበላይ ተመልካቹ for ἐπίσκοπον
    rationale: This expression is unnatural in modern standard Amharic and primarily denotes someone who watches/views. It does not naturally communicate an entrusted supervisory role.
  - severity: medium
    issue: The terms for νηφάλιον and σώφρονα are insufficiently distinguished
    rationale: ራሱን የሚገዛ is a good rendering for σώφρονα, but it was assigned to νηφάλιον. A distinct expression for temperance/clear-headed restraint better preserves the Greek list's lexical differentiation.
  - severity: low
    issue: እንግዳ ተቀባይ is somewhat ambiguous
    rationale: It can be understood as one who receives a guest, but explicitly expressing welcome to guests is more immediately natural and clearly conveys φιλόξενον.
