review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the inferential force of οὖν, the necessity of δεῖ, the male-specific and deliberately non-resolved wording of μιᾶς γυναικὸς ἄνδρα, and all qualifications in the Greek list. However, its renderings of νηφάλιον and σώφρονα are better differentiated: the former concerns temperance/clear-headed restraint, while the latter concerns sound judgment and self-control.'
  naturalness: የበላይ ተመልካቹ is not a natural Amharic designation for ἐπίσκοπος and can suggest a mere 'viewer.' ተቆጣጣሪው is clear, idiomatic, and retains the functional sense without importing a later ecclesiastical title. The revised list also uses more natural parallel Amharic expressions.
  terminology: The revised text retains ተቆጣጣሪ for 'overseer,' preserves the formal የአንዲት ሚስት ባል, and maintains the alternative-reading footnote without deciding disputed implications about marriage or remarriage.
  issues:
