  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: am
  text: ስለዚህ ተቆጣጣሪው ነቀፋ የማይገኝበት፣ የአንዲት ሚስት ባል[a]፣ በመጠን የሚኖር፣ ራሱን የሚገዛ፣ ሥርዓታማ፣ እንግዶችን በደስታ የሚቀበል፣ ማስተማር የሚችል መሆን አለበት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለአንዲት ሴት ብቻ የታመነ ወንድ።” ሐረጉ የጋብቻ ሁኔታን ብቻ ሳይሆን ለሚስቱ ታማኝ መሆንን ሊያጎላ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: መሆን አለበት
  rationale: የግዴታንና የአስፈላጊነትን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የድምዳሜ ግንኙነት በግልጽ ይጠብቃል።
- source_word: ἐπίσκοπον
  choice: የበላይ ተመልካቹ
  rationale: በኋላ የዳበረ የቤተ ክርስቲያን ማዕረግ ሳያስገባ፣ የቃሉን የቁጥጥርና የእንክብካቤ ትርጉም በሚገባ ያሳያል።
- source_word: ἀνεπίλημπτον
  choice: ነቀፋ የማይገኝበት
  rationale: ኃጢአት ፈጽሞ የሌለበት ማለትን ሳያመለክት፣ ትክክለኛ ክስ የማይቀርብበትን የሥነ ምግባር ስም ይገልጻል።
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: የአንዲት ሚስት ባል
  rationale: የግሪክኛውን ወንድ-ተኮር አገላለጽ በቅርብ ይጠብቃል፤ ቃሉ የጋብቻ ሁኔታን ብቻ ወይም ለሚስት ታማኝ መሆንን እንደሚያመለክት በዋናው ጽሑፍ አይወስንም።
- source_word: νηφάλιον
  choice: ራሱን የሚገዛ
  rationale: ከመጠጥ መታቀብን ብቻ ሳይሆን የአእምሮና የባሕርይ ንቃትንና መጠን መጠበቅን ያስተላልፋል።
- source_word: σώφρονα
  choice: ልባም
  rationale: በማስተዋል የተመራ ጤናማ ፍርድንና የተገራ አኗኗርን ይገልጻል፤ ከνηφάλιον ጋርም ትርጉማዊ ልዩነቱን ይጠብቃል።
- source_word: κόσμιον
  choice: ሥርዓታማ
  rationale: ተገቢ፣ የተደራጀና ክብር ያለውን ምግባር በአጭርና ተፈጥሯዊ ቃል ያሳያል።
- source_word: φιλόξενον
  choice: እንግዳ ተቀባይ
  rationale: እንግዶችንና መጻተኞችን በፍቅር የመቀበልን ባሕርይ በተለመደ ዘመናዊ አማርኛ ይገልጻል።
- source_word: διδακτικόν
  choice: ማስተማር የሚችል
  rationale: ለማስተማር ፈቃደኛ ብቻ ሳይሆን ብቃት ያለው መሆኑን በግልጽ ያሳያል።
theological_decisions:
- issue: በቤተ ክርስቲያን ኃላፊዎች መስፈርት ውስጥ μιᾶς γυναικὸς ἄνδρα የሚለው ሐረግ ትርጓሜ
  choice: በዋናው ጽሑፍ «የአንዲት ሚስት ባል» ተብሎ በቅርብ መተርጎም
  alternative: «ለአንዲት ሴት ብቻ የታመነ ወንድ» ወይም «ለሚስቱ ታማኝ»
  rationale: ሐረጉ የጋብቻ ታማኝነትን፣ ከአንድ በላይ ሚስት አለማግባትን ወይም ሌሎች የጋብቻ ገደቦችን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ ክርክሩን አይወስንም፤ የታማኝነት አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የባሕርይ ዝርዝሩ አጭርና ትይዩ ሆኖ ተጠብቋል፤ በአከራካሪው የጋብቻ ሐረግ ላይ ያለው እርግጠኛ ያልሆነ ትርጓሜ በማስታወሻ ተገልጿል።
