  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: am
  text: ነገር ግን ብዘገይ፣ በእግዚአብሔር ቤተሰብ ውስጥ እንዴት መመላለስ እንደሚገባ እንድታውቅ እጽፍልሃለሁ፤ ይኸውም የሕያው እግዚአብሔር ጉባኤ[a]፣ የእውነት ዓምድና መደገፊያ[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደው አተረጓጎም፣ “የሕያው እግዚአብሔር ቤተ ክርስቲያን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የእውነት ዓምድና ምሽግ፤” “መሠረት” የሚለውም ለ“መደገፊያ” እንደ አማራጭ ቀርቧል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: ብዘገይ
  rationale: በዐውዱ የጳውሎስን መምጣት መዘግየት ያመለክታል፤ ሥነ ምግባራዊ ዝግተኝነትን አያመለክትም። ቅድመ ሁኔታውንም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἵνα εἰδῇς
  choice: እንድታውቅ
  rationale: የዓላማውን ንዑስ ሐረግ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δεῖ
  choice: እንደሚገባው
  rationale: ግዴታና ተገቢነትን ያሳያል፤ በዐውዱ ያለውን መደበኛ መመሪያ ሳያከርር ይገልጣል።
- source_word: ἐν οἴκῳ θεοῦ
  choice: በእግዚአብሔር ቤተ ሰብ መካከል
  rationale: οἶκος እዚህ ሕንፃን ብቻ ሳይሆን የእግዚአብሔርን ሕዝብ እንደ ቤተ ሰብ ያመለክታል፤ ተከታዩ ገላጭ ሐረግም ይህን ይደግፋል።
- source_word: ἀναστρέφεσθαι
  choice: ሰው እንዴት መኖር
  rationale: ግሱ በማኅበረ እምነቱ ውስጥ የሚገባውን አኗኗርና ባሕርይ ያመለክታል። ‘ራስን መምራት’ ከሚለው ይልቅ ይህ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
- source_word: ἥτις
  choice: ይህ ቤተ ሰብ
  rationale: አመልካች ተውላጠ ስሙን ብቻ ከመጠቀም ይልቅ የቀደመውን ተጠቃሽ በግልጽ ይደግማል፤ ገላጭ ግንኙነቱንም ይጠብቃል።
- source_word: ἐκκλησία
  choice: ጉባኤ
  rationale: ቃሉ የተሰበሰበውን የእግዚአብሔር ሕዝብ ያጎላል፤ የተቋም ወይም የሕንፃ ትርጉም አያስገባም። የተለመደው አተረጓጎም በማስታወሻ ተጠብቋል።
- source_word: θεοῦ ζῶντος
  choice: የሕያው እግዚአብሔር
  rationale: የግሪኩን የባለቤትነት ሐረግና ‘ሕያው’ የሚለውን ሥነ መለኮታዊ አጽንዖት በቀጥታ ይጠብቃል።
- source_word: στῦλος
  choice: ዓምድ
  rationale: የሕንፃውን ዘይቤ በግልጽና በተለመደ አማርኛ ይወክላል።
- source_word: ἑδραίωμα
  choice: መደገፊያ
  rationale: ብርቅዬው ስም ጽናት የሚሰጥን ነገር ያመለክታል። ‘መደገፊያ’ ዘይቤውን ይጠብቃል፤ ‘መሠረት’ ብሎ ትርጉሙን አይወስንም።
- source_word: τῆς ἀληθείας
  choice: የእውነት
  rationale: በዐውዱ የታወቀውንና የተወሰነውን ‘እውነት’ ያመለክታል።
theological_decisions:
- issue: ἐκκλησία በማኅበረ እምነት ዐውድ የሚተረጎምበት መንገድ
  choice: ጉባኤ
  alternative: ቤተ ክርስቲያን፤ ማኅበር
  rationale: ‘ጉባኤ’ የተሰበሰበውን ሕዝብ ዋና ትርጉም ያቆያል፤ በኋላ የተጨመሩ ተቋማዊ ወይም የሕንፃ ግንዛቤዎችን አያስገባም። ባህላዊው አተረጓጎም በማስታወሻ ቀርቧል።
- issue: ‘የእውነት ዓምድና ἑδραίωμα’ የሚለው ዘይቤ
  choice: የእውነት ዓምድና መደገፊያ
  alternative: የእውነት ዓምድና ምሽግ፤ የእውነት ዓምድና መሠረት
  rationale: የግሪኩ አገባብ ይህን ሚና ለሕያው እግዚአብሔር ጉባኤ ይሰጣል። ‘መደገፊያ’ ከፍተኛውን የጉባኤ ሚና ይጠብቃል፤ ጉባኤው የእውነት ምንጭ ነው የሚል ተጨማሪ ድምዳሜ ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ዓላማ ሐረግ በተፈጥሯዊ አገባብ ቀርቧል፤ ‘ይህን እጽፍልሃለሁ’ የሚለው በቀዳሚው ቁጥር ከተገለጸው γράφω ተግባር በአማርኛ ለንባብ ግልጽነት ተደግሟል። ሁለቱም የማስታወሻ ምልክቶች [a] እና [b] ከሚመለከታቸው ቃላት ጋር ተቀምጠዋል።
