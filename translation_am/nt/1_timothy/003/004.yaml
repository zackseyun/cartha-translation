  choice: የራሱን ቤተሰብ
  rationale: οἶκος ቤትንም ሆነ በቤቱ ያለውን ቤተሰብ ሊያመለክት ይችላል፤ በዚህ የቤት አመራር አውድ ‘ቤተሰብ’ የሚለው የቃሉን ግንኙነታዊ ስፋት በተፈጥሯዊ አማርኛ ያሳያል። ἰδίου የሚያጎላውም ‘የራሱን’ በሚለው ተጠብቋል።
