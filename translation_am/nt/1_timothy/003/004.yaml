  alternative: ክብሩ የልጆቹን ታዛዥነት ብቻ ወይም የአባቱን አመራር ብቻ እንደሚገልጥ መወሰን።
  rationale: የግሪኩ አገባብ μετὰ πάσης σεμνότητος የልጆቹን ታዛዥነት ወይም የቤተሰቡን አጠቃላይ አመራርና ሥርዓት ሊገልጥ የሚችል አሻሚነት አለው፤ ይህም በማስታወሻው ተጠብቋል።
