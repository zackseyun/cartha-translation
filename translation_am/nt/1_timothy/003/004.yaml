  rationale: የግሪኩ ἔχοντα ከἐν ὑποταγῇ ጋር በመሆን ልጆቹ በታዛዥነት ሥር እንዲኖሩ ማድረግን ይገልጣል። በአማርኛ ‘ታዛዥ አድርጎ የሚይዝ’ የአገባቡን ኃይል በግልጽ ያስተላልፋል።
- source_word: ἐν ὑποταγῇ
  choice: ታዛዥ
  rationale: ὑποταγή መገዛትን ወይም በሥርዓት ሥር መሆንን ያመለክታል። ‘ታዛዥ’ በዚህ የልጆች አውድ ግልጽና ተፈጥሯዊ ሲሆን፣ የውጫዊ ቁጥጥርን ብቻ አያመለክትም።
