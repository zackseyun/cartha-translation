  choice: መልካም ምስክርነት ሊኖረው
  rationale: የግሪኩን የምስክርነትና የመልካም ማረጋገጫ ሐሳብ በቅርበት ይጠብቃል፤ ‘መልካም ስም’ ከሚለው ይልቅ የሰዎችን ማረጋገጫ ጎን በግልጽ ያሳያል።
- source_word: ἀπὸ τῶν ἔξωθεν
