  text: ከውጭ ባሉትም ዘንድ መልካም ምስክርነት ሊኖረው ይገባል፤[a] ወደ ነቀፋ[b] እና ወደ ዲያብሎስ ወጥመድ[c] እንዳይወድቅ።
  philosophy: optimal-equivalence
  footnotes:
