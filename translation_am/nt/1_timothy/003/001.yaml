lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: ይህ አባባል የታመነ ነው
  rationale: በእረኝነት መልእክቶች ውስጥ አስተማማኝ ንግግርን የሚያስተዋውቀውን ቀመራዊ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ λόγος እዚህ ‘ቃል’ ከሚለው ይልቅ ‘አባባል’ የሚለውን ይደግፋል።
- source_word: εἴ τις
  choice: ማንም … ቢመኝ
  rationale: τις ያልተወሰነና በራሱ ወንድን ብቻ የማያመለክት ተውላጠ ስም ስለሆነ፣ ‘ማንም’ የግሪኩን አጠቃላይ ሁኔታዊ አገላለጽ ይጠብቃል።
- source_word: ἐπισκοπῆς
  choice: የበላይ ተመልካችነትን
  rationale: ቃሉ መቆጣጠርን፣ ክትትልንና ከዚህ ጋር የተያያዘውን ኃላፊነት ያመለክታል። ይህ ምርጫ ከቀጣዩ ἐπίσκοπος ጋር ያለውን ቃላዊ ግንኙነት ይጠብቃል፤ የኋለኛውን ዘመን የቤተ ክርስቲያን ማዕረግ ግን በጽሑፉ ላይ አይጭንም።
- source_word: ὀρέγεται
  choice: ቢመኝ
  rationale: ὀρέγομαι ወደ አንድ ነገር መዘርጋትን፣ መሻትን ወይም ለእርሱ መጓጓትን ያመለክታል። ‘ቢመኝ’ ሁኔታዊ አወቃቀሩን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καλοῦ ἔργου
  choice: መልካም ሥራን
  rationale: ቀጥተኛውን ‘መልካም ሥራ’ የሚለውን ትርጉም በመጠበቅ ጉዳዩ የማዕረግ ብቻ ሳይሆን ሥራ መሆኑን ያጎላል።
- source_word: ἐπιθυμεῖ
  choice: ይመኛል
  rationale: ቃሉ መፈለግን ወይም አጥብቆ መሻትን ያመለክታል። ‘ይመኛል’ ከὀρέγεται ጋር ያለውን ትይዩነት ይጠብቃል፤ ከግሪኩ በላይ አያጠነክረውም።
theological_decisions:
