- issue: τις በሁኔታዊው ሐረግ ውስጥ ወንድን ብቻ እንደሚያመለክት ይተርጎም ወይስ አጠቃላይነቱ ይጠበቅ
  choice: ማንም
  alternative: አንድ ወንድ
  rationale: የግሪኩ ያልተወሰነ ተውላጠ ስም በራሱ ወንድን ብቻ አይገድብም። ስለዚህ ትርጉሙ ይህ ሐረግ በቀጥታ ከሚናገረው በላይ ጾታዊ ገደብ አያስገባም።
