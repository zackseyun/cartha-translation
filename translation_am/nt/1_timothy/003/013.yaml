  text: በሚገባ ያገለገሉ ሰዎች ለራሳቸው መልካም አቋምንና በመሲህ[c] ኢየሱስ ባለው እምነት[b] ታላቅ ድፍረትን[a] ያገኛሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታላቅ መተማመንን።” የግሪኩ ቃል ድፍረትን፣ መተማመንን ወይም ግልጽነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመሲህ ኢየሱስ ባለው ታማኝነት።” የግሪኩ πίστις ቃል “እምነት፣” “መታመን” ወይም “ታማኝነት” ማለት ሊሆን ይችላል፤ ዋናው ጽሑፍ “እምነት” የሚለውን ይከተላል።
    reason: alternative_reading
  - marker: c
    text: በግሪክ “ክርስቶስ”፤ ቃሉ እዚህ እንደ ማዕረግ ስለሚሠራ “መሲህ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
