    text: ወይም፣ “እንደ ዲያቆናት ያገልግሉ።” የግሪኩ ግስ “ማገልገል” ማለት ነው፤ እዚህ ግን ዐውደ ንባቡ የዲያቆናትን ብቃት ስለሚያብራራ የተወሰነ የዲያቆንነት አገልግሎትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
