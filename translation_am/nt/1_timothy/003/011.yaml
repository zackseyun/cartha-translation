  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: am
  text: ሴቶችም[a] እንዲሁ ክቡራን፣ ሐሜተኞች ያልሆኑ፣ ራሳቸውን የሚገዙ፣ በሁሉም ነገር ታማኞች ሊሆኑ ይገባል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሚስቶችም እንዲሁ ክቡራን...” በዚህ አውድ γυναῖκας የሚለው የግሪክ ቃል “ሴቶች” ወይም “ሚስቶች” ማለት ይችላል፤ ጽሑፉ ግን “ሚስቶቻቸው” ብሎ በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: ሴቶች
  rationale: γυνή በዚህ አውድ ‘ሴቶች’ ወይም ‘ሚስቶች’ ማለት ይችላል። በግሪክ ጽሑፉ ‘የእነርሱ’ የሚል ባለቤትነት አመልካች ስለሌለ፣ ዋናው ጽሑፍ ‘ሴቶች’ ይላል፤ ‘ሚስቶች’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὡσαύτως
  choice: እንዲሁ
  rationale: ቃሉ ይህን ቡድን ከቀደመው የብቃት ዝርዝር ጋር ያገናኛል፤ ‘እንዲሁ’ ይህን መዋቅራዊ ትይዩነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σεμνάς
  choice: የተከበሩ
  rationale: σεμνός ክብርን፣ ጨዋነትንና ለአክብሮት የሚገባ ባሕርይን ያመለክታል፤ ‘የተከበሩ’ ይህን ሥነ ምግባራዊ ክብደት በግልጽ ቋንቋ ይይዛል።
- source_word: μὴ διαβόλους
  choice: ሐሜተኞች ያልሆኑ
  rationale: διάβολος እዚህ የስድብና የሐሰት ክስ ባሕርይን የሚገልጽ እንጂ ‘ዲያብሎስ’ የሚለው የተወሰነ መጠሪያ አይደለም። ‘ሐሜተኞች ያልሆኑ’ በዘመናዊ አማርኛ ዋናውን ሐሳብ ያስተላልፋል።
- source_word: νηφαλίους
  choice: ራሳቸውን የሚገዙ
  rationale: νηφάλιος ከስካር ነጻ መሆንን ብቻ ሳይሆን የአእምሮና የባሕርይ ቁጥጥርንም ሊያመለክት ይችላል። ‘ራሳቸውን የሚገዙ’ ሰፊውን ሥነ ምግባራዊ ፍቺ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πιστὰς
  choice: የታመኑ
  rationale: πιστός እዚህ ታማኝነትንና አስተማማኝነትን ይገልጻል፤ ‘የታመኑ’ ሁለቱንም ገጽታዎች ይይዛል።
- source_word: ἐν πᾶσιν
  choice: በሁሉም
  rationale: ሐረጉ ሁሉን አቀፍ ነው፤ ‘በሁሉም’ የግሪኩን ስፋት በአጭርና ግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: በብቃት ዝርዝሩ ውስጥ γυναῖκας የሚያመለክታቸው እነማን እንደሆኑ
  choice: ሴቶች
  alternative: ሚስቶች
  rationale: ግሪኩ ቃል ‘ሴቶች’ ወይም ‘ሚስቶች’ ማለት ስለሚችል፣ ጥቅሱ በአገልግሎት ሚና ያሉ ሴቶችን ወይም የወንድ ዲያቆናትን ሚስቶች ሊያመለክት ይችላል። ጽሑፉ ‘የእነርሱ’ አይልም፣ ὡσαύτωςም ከቀደመው ዝርዝር ጋር ትይዩነት ይፈጥራል። ስለዚህ ዋናው ጽሑፍ ሰፊውን አጠራር ይጠቀማል፣ ሌላውን ንባብ ግን በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ ዓረፍተ ነገር ግስ በቀደመው አውድ እንዲሟላ የሚጠይቅ በመሆኑ፣ በአማርኛ የብቃት መስፈርትነቱን ግልጽ ለማድረግ ‘ሊሆኑ ይገባል’ ተጨምሯል።
