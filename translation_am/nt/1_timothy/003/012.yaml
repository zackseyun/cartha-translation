  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: am
  text: ዲያቆናት የአንዲት ሚስት ባሎች[a]፣ ልጆቻቸውንና የራሳቸውን ቤተሰቦች በሚገባ የሚመሩ ይሁኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአንዲት ሴት ወንዶች።” ይህ አገላለጽ በጋብቻ ታማኝ መሆንን የሚያጎላ ሊሆን ይችላል፤ አንዳንዶች ግን ከአንድ በላይ ሚስት ማግባትን ወይም ዳግመኛ ማግባትን በተለይ እንደሚከለክል ይረዱታል።
    reason: የአገላለጹን ፈሊጣዊ ቅርጽና ዋና ዋና አማራጭ ትርጉሞች ሳይወስን ለማሳየት።
lexical_decisions:
- source_word: διάκονοι
  choice: ዲያቆናት
  rationale: በዚህ የቤተ ክርስቲያን ኃላፊነት ዐውድ ቃሉ አገልጋዮችን በአጠቃላይ ሳይሆን የታወቀውን የዲያቆንነት ሥራ ያመለክታል።
- source_word: ἔστωσαν
  choice: ይሁኑ
  rationale: የግሪኩን የትእዛዝና የመሥፈርት ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: የአንዲት ሚስት ባሎች
  rationale: የግሪኩን አጭርና ፈሊጣዊ አገላለጽ በቅርበት በመከተል ለአንዲት ሴት ታማኝ መሆንን፣ አንድ ሚስት ብቻ ማግባትን ወይም ዳግመኛ አለማግባትን እንደሚያመለክት በዋናው ጽሑፍ አይወስንም።
- source_word: τέκνων
  choice: ልጆቻቸውን
  rationale: ባለቤትነቱ በግሪክ በቀጥታ ባይገለጽም ከአሳቡና ከተከታዩ ‘የራሳቸውን ቤተሰብ’ ከሚለው ጋር በተፈጥሯዊ አማርኛ ይገባል።
- source_word: καλῶς
  choice: በሚገባ
  rationale: ኃላፊነቱ ጥሩና ተገቢ በሆነ ሁኔታ መከናወኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: προϊστάμενοι
  choice: የሚመሩ
  rationale: በቤተሰብ ዐውድ ውስጥ ያለውን ኃላፊነት ያለበት አመራርና ክትትል ያሳያል፤ ‘የሚገዙ’ ከሚለው ያነሰ አምባገነናዊ ድምፅ አለው።
- source_word: τῶν ἰδίων οἴκων
  choice: የራሳቸውን ቤተሰብ
  rationale: οἶκος እዚህ ሕንፃን ብቻ ሳይሆን የቤት ሰዎችንና የቤት አስተዳደርን ያካተተ ክፍል ያመለክታል።
theological_decisions:
- issue: በቤተ ክርስቲያን ኃላፊነት መሥፈርት ውስጥ μιᾶς γυναικὸς ἄνδρες የሚለው አገላለጽ ትርጉም
  choice: በቅርብ አተረጓጎም ‘የአንዲት ሚስት ባሎች’ ተብሎ ቀርቧል፤ ዋናው ትኩረት የጋብቻ ታማኝነት፣ አንድ ሚስት ብቻ ማግባት ወይም ዳግመኛ አለማግባት መሆኑ አልተወሰነም።
  alternative: ‘ለሚስቶቻቸው ታማኝ የሆኑ’፣ ‘የአንዲት ሴት ወንዶች’ ወይም ‘አንድ ጊዜ ብቻ ያገቡ’
  rationale: የግሪኩ አገላለጽ አጭርና ፈሊጣዊ ሲሆን ትርጉሙ አከራካሪ ነው። ቅርብ ትርጉሙ ጽሑፉ ራሱ ያልወሰነውን የእምነት ክርክር በትርጉም እንዳይወሰን ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ዲያቆናት’ የቤተ ክርስቲያን ሹመቱን፣ ‘ቤተሰብ’ ደግሞ ከሕንፃ ይልቅ የቤት ማኅበራዊ ክፍልን ያሳያሉ።
