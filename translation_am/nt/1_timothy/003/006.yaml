  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: am
  text: አዲስ አማኝ መሆን የለበትም፤ በትዕቢት ተነሥቶ በዲያብሎስ ፍርድ ውስጥ እንዳይወድቅ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዲያብሎስ በተፈረደበት ተመሳሳይ የጥፋተኝነት ፍርድ ውስጥ እንዳይወድቅ»፤ ወይም፣ «ከዲያብሎስ ጋር በተያያዘ ፍርድ ሥር እንዳይወድቅ» ሊል ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: አዲስ አማኝ
  rationale: ቃሉ በቀጥታ «አዲስ የተተከለ» ማለት ሲሆን፣ እዚህ በእምነት አዲስ የሆነን ሰው በምሳሌ ያመለክታል። «አዲስ አማኝ» ይህን ትርጉም ለዘመናዊ አንባቢ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τυφωθεὶς
  choice: እንዳይታበይ
  rationale: ግሱ በትዕቢት መነፋትን ወይም መታበይን ያመለክታል። «መታበይ» የሥነ ምግባር ማስጠንቀቂያውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κρίμα
  choice: ፍርድ
  rationale: κρίμα ፍርድን ወይም የጥፋተኝነት ፍርድን ሊያመለክት ይችላል። «ፍርድ» ሰፊውን የቃሉን ወሰን ይጠብቃል።
- source_word: τοῦ διαβόλου
  choice: በዲያብሎስ
  rationale: የግሪኩ የባለቤትነት ቅርጽ ፍርዱ በዲያብሎስ ላይ የደረሰው መሆኑን ወይም ከዲያብሎስ ጋር የተያያዘ መሆኑን ሊጠቁም ይችላል። «በዲያብሎስ ፍርድ» ይህን ግልጽ ያልሆነ ግንኙነት በዋናው ጽሑፍ ይጠብቃል።
- source_word: ἐμπέσῃ
  choice: እንዳይወድቅ
  rationale: «መውደቅ» ወደ አደገኛ ሁኔታ ወይም ውጤት መግባትን የሚያሳየውን የምንጩን ምስላዊ አገላለጽ ይጠብቃል።
- source_word: ἵνα μὴ
  choice: እንዳይ… ነው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት በግልጽና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የεἰς κρίμα ἐμπέσῃ τοῦ διαβόλου ሐረግ ትርጉም
  choice: «በዲያብሎስ ፍርድ ውስጥ እንዳይወድቅ» ተብሎ አሻሚነቱ ተጠብቋል።
  alternative: «ዲያብሎስ በደረሰበት ተመሳሳይ የጥፋተኝነት ፍርድ እንዳይወድቅ» ወይም «ከዲያብሎስ ጋር በተያያዘ ፍርድ ሥር እንዳይወድቅ»
  rationale: τοῦ διαβόλου በዲያብሎስ ላይ የተላለፈውን ፍርድ ወይም ከእርሱ ጋር የተያያዘን ፍርድ ሊያመለክት ይችላል። ትርጉሙ አንዱን ብቻ በመምረጥ የምንጩን ሥነ መለኮታዊ ውጥረት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አዲስ አማኝ» ከቃል በቃል «አዲስ የተተከለ» ይልቅ በአውዱ ተፈጥሯዊ ነው፤ የመጨረሻው ሐረግ ግን የግሪኩን አሻሚነት እንዲጠብቅ ተደርጓል።
