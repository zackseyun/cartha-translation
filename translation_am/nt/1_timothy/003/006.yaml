review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies a recent convert and preserves the warning against pride and falling into judgment. However, «በዲያብሎስ ፍርድ» uses በ in a way that naturally suggests judgment administered by the devil, whereas the Greek genitive is left formally relational and must not be narrowed to agency.
  naturalness: «አዲስ አማኝ» is natural modern Amharic. Recasting the final phrase with «የዲያብሎስ ፍርድ» better represents the possessive/genitival construction, while «በትዕቢት ተነሥቶ» expresses the causal sense of τυφωθείς naturally and clearly.
  terminology: «ፍርድ» appropriately retains the breadth of κρίμα. «ዲያብሎስ» is the standard term. «የዲያብሎስ ፍርድ» is preferable to the draft's instrumental-sounding phrasing because it retains the source ambiguity as far as idiomatic Amharic permits.
  issues:
  - severity: medium
    issue: The main text renders τοῦ διαβόλου as «በዲያብሎስ».
    rationale: The preposition በ ordinarily conveys instrumentality, agency, or location and can make the devil the one who issues the judgment. The Greek has a genitive relation, whose precise sense is disputed. A possessive construction is a closer and less interpretively restrictive correspondence.
  - severity: low
    issue: «እንዳይታበይና» weakens the causal participial relation of τυφωθείς.
    rationale: The Greek states that being puffed up is the condition leading to the fall. «በትዕቢት ተነሥቶ» preserves both the pride concept and the causal connection without imposing an interpretation of the final genitive.
  revised_text: አዲስ አማኝ መሆን የለበትም፤ በትዕቢት ተነሥቶ በዲያብሎስ ፍርድ ውስጥ እንዳይወድቅ።[a]
  revised_footnotes:
