- issue: የἐν πνεύματι ማመልከቻ
  choice: በዋናው ጽሑፍ ‘በመንፈስ’ በማለት አሻሚነቱን መጠበቅ
  alternative: ‘በመንፈስ ቅዱስ አማካይነት’ ወይም ‘በመንፈሳዊው የሕልውና ዘርፍ’
  rationale: ግሪኩ ያለ መስተዋድድ አንቀጽ የተጻፈ አጭር ሐረግ ሲሆን፣ የመንፈስ ቅዱስን ድርጊት ወይም ከሥጋ ጋር የተነጻጸረ መንፈሳዊ ሕልውናን ሊያመለክት ይችላል፤ ትርጉሙ አንዱን አስገድዶ አይወስንም።
