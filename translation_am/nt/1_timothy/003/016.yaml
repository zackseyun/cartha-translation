source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: am
  text: '16 በሁሉም ዘንድ እንደሚታመነውም፣ የእግዚአብሔር መምሰል ምስጢር ታላቅ ነው፦


    እርሱ[a] በሥጋ ተገለጠ፣


    በመንፈስ ጻድቅ መሆኑ ተረጋገጠ፣[b]


    በመላእክት ታየ፣


    በብሔራት መካከል ታወጀ፣[c]


    በዓለም ታመነበት፣


    በክብር ወደ ላይ ተወሰደ።[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች ‘እርሱ በሥጋ ተገለጠ’ በሚለው ፈንታ ‘እግዚአብሔር በሥጋ ተገለጠ’ ይላሉ። እዚህ የተከተለው ትችታዊ የግሪክ ጽሑፍ ‘እርሱ/ማን’ የሚል ተዛማጅ ተውላጠ ስም ያነባል።
    reason: textual_variant
  - marker: b
    text: ወይም ‘በመንፈስ ቅዱስ አማካይነት ጻድቅ መሆኑ ተረጋገጠ’ ወይም ‘በመንፈስ ጻድቅ መሆኑ ተረጋገጠ።’ የግሪኩ አጭር ሐረግ የመንፈስ ቅዱስን አድራጊነት ወይም የመንፈሳዊ ሕይወትን ዘርፍ ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: c
    text: ወይም ‘በአሕዛብ መካከል ታወጀ።’
    reason: lexical_alternative
  - marker: d
    text: ወይም ‘ወደ ክብር ተወሰደ።’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: እንደሚታመነውም
  rationale: ቃሉ በጋራ የታመነና በግልጽ የታወቀ ነገርን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የጋራ እምነትን ያሳያል።
- source_word: μέγα ἐστὶν
  choice: ታላቅ ነው
  rationale: የግሪኩን አጽንዖት ጠብቆ በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: የእግዚአብሔር አምልኮ ምስጢር
  rationale: μυστήριον ቀድሞ ተሰውሮ አሁን የተገለጠን መለኮታዊ እውነት ያመለክታል፤ εὐσέβεια ደግሞ ለእግዚአብሔር ያደረ አምልኮንና ኑሮን ይጨምራል።
- source_word: Ὃς
  choice: እርሱ
  rationale: የSBLGNT ንባብ ወንድ ፆታ ያለው ‘እርሱ/የሆነው’ የሚል አንጻራዊ ተውላጠ ስም ነው፤ በአማርኛ የመዝሙራዊውን ንግግር በተፈጥሮ ለመቀጠል ‘እርሱ’ ተመርጧል።
- source_word: ἐφανερώθη ἐν σαρκί
  choice: በሥጋ ተገለጠ
  rationale: መገለጥንና እውነተኛ ሰብአዊ ሕልውናን በአጭር እና በክብር ይገልጣል።
- source_word: ἐδικαιώθη
  choice: ጻድቅ መሆኑ ተረጋገጠ
  rationale: በዚህ አውድ ቃሉ ጻድቅ መደረግን ሳይሆን በትክክል መሆኑ መገለጡንና መረጋገጡን ያመለክታል።
- source_word: ἐν πνεύματι
  choice: በመንፈስ
  rationale: አጭሩን የግሪክ አገላለጽ ይጠብቃል፤ መንፈስ ቅዱስ ፈጻሚ መሆኑን ወይም መንፈሳዊውን የሕልውና ዘርፍ ማመልከቱን ያለ አስገዳጅ ውሳኔ ክፍት ያደርጋል።
- source_word: ὤφθη ἀγγέλοις
  choice: በመላእክት ታየ
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ በክርስቶሳዊው አውድ ἀγγέλοις የሰማይ መላእክትን ማመልከቱ የበለጠ የተስማማ ነው።
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: በብሔራት መካከል ታወጀ
  rationale: κηρύσσω ይፋዊ አዋጅን ያመለክታል፤ ἔθνη ብሔራትን ወይም አሕዛብን ሊያመለክት ስለሚችል ሰፊው ትርጉም በዋናው ጽሑፍ ተመርጧል።
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: በዓለም ታመነበት
  rationale: የተደራጊውን ቅርጽና በግለሰቡ ላይ እምነት የመጣልን ሐሳብ ይጠብቃል።
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: በክብር ወደ ላይ ተወሰደ
  rationale: ወደ ላይ መወሰዱን በግልጽ ያሳያል፤ ἐν δόξῃ ‘በክብር’ ወይም ‘ወደ ክብር’ ሊባል የሚችል በመሆኑ አማራጩ በማስታወሻ ተቀምጧል።
theological_decisions:
- issue: በመዝሙራዊው ክፍል መጀመሪያ ያለው የጽሑፍ ልዩነት፦ Ὃς / θεός / ὅ
  choice: የትችታዊውን ግሪክ ጽሑፍ በመከተል ‘እርሱ’
  alternative: ‘እግዚአብሔር በሥጋ ተገለጠ’ ወይም ‘ይህም በሥጋ ተገለጠ’
