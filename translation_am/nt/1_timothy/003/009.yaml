  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: am
  text: የእምነትን ምስጢር በንጹሕ ሕሊና የሚይዙ ሊሆኑ ይገባል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእምነቱን ምስጢር በንጹሕ ሕሊና የሚይዙ ሊሆኑ ይገባል።»
    reason: τῆς πίστεως የሚለው ሐረግ በአማርኛ በተወሰነ ቅርጽ «የእምነቱን» ተብሎም ሊቀርብ ይችላል፤ ሆኖም ዋናው ጽሑፍ «የእምነትን» በማለት የግሪኩን ትርጉም በተፈጥሯዊ አማርኛ ያስቀምጣል።
lexical_decisions:
- source_word: ἔχοντας
  choice: የሚይዙ ሊሆኑ ይገባል
  rationale: የአሁን ጊዜ አድራጊ ቦዝ አንቀጽ ሲሆን፣ በቀደመው ቁጥር የተጠቀሱትን አገልጋዮች ያመለክታል። አማርኛው ቁጥሩን እንደ ሙሉ የባሕርይ መስፈርት እንዲነበብ የግዴታውን ኃይል ከአውዱ ገልጦአል፤ «የሚይዙ»ም ቀጣይ መጽናትንና መጠበቅን ያሳያል።
- source_word: μυστήριον
  choice: ምስጢር
  rationale: በጳውሎስ አጠቃቀም ቀድሞ የተሰወረ ነገር ግን በእግዚአብሔር የተገለጠ እውነትን ሊያመለክት ይችላል። «ምስጢር» ቃሉን ሳይተረጉምለት ይህን ስፋት ይጠብቃል።
- source_word: τῆς πίστεως
  choice: የእምነቱን
  rationale: የግሪኩ የተወሰነ አመልካች እዚህ ግለሰባዊ የማመን ተግባርን ብቻ ሳይሆን ማኅበሩ የሚያምንበትን እምነት በተለይ ሊያመለክት ይችላል። «እምነቱ» ይህን የተወሰነ አገባብ ይጠብቃል።
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: በንጹሕ ሕሊና
  rationale: «በ» ἐνን በተፈጥሯዊ አማርኛ ያቀርባል፤ «ንጹሕ ሕሊና» ደግሞ καθαράን እና συνείδησιςን በቀጥተኛና በተለመደ የሥነ ምግባር አገላለጽ ይተረጉማል።
theological_decisions:
- issue: በτῆς πίστεως ውስጥ «እምነት» የሚለው ትርጉም
  choice: ማኅበሩ የሚያምንበት የክርስቲያን እምነት («እምነቱ»)
  alternative: ግለሰባዊ ማመን ወይም ታማኝነት
  rationale: በማኅበር አገልጋዮች መስፈርት አውድ ውስጥ የሚጠበቀውን የእምነት ይዘት ማመልከቱ ይበልጥ የተፈጥሮ ነው። ሆኖም ቃሉ ከግለሰባዊ ማመን ጋር ያለውን ትርጉማዊ ግንኙነት ስለማያጣ፣ የግድ ኋለኛ ቴክኒካዊ የዶግማ ትርጉም አልተጫነበትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መዝገበ ቃል ተጠቅሟል። «ምስጢር» እና «ሕሊና» በአማርኛ የመጽሐፍ ቅዱስና የዘወትር የሥነ ምግባር ንግግር ውስጥ የተለመዱ ሲሆኑ፣ ከመጠን በላይ ጥንታዊ አገላለጽ ተወግዷል።
