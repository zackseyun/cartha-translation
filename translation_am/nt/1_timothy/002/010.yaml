  text: ἀλλ’ ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν, δι’ ἔργων ἀγαθῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: am
  text: ነገር ግን አምላክን እንደሚያከብሩ ለሚገልጹ ሴቶች ተገቢ በሆነው፣ ማለትም በመልካም ሥራዎች፣ ይዋቡ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: በቁጥር 9 ከተጠቀሰው ውጫዊ ጌጥ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὃ πρέπει
  choice: በሚገባው
  rationale: ‘ተገቢ በሆነው’ የሚለውን የሥነ ምግባር ተስማሚነት በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: γυναιξὶν
  choice: ለሴቶች
  rationale: አውዱ ባለትዳር ሴቶችን ብቻ ሳይሆን በጉባኤው ያሉ ሴቶችን በአጠቃላይ ያመለክታል።
- source_word: ἐπαγγελλομέναις
  choice: ለሚገልጹ
  rationale: ቃሉ ራስን ከአንድ እምነት ወይም አኗኗር ጋር በግልጽ ማያያዝን ያመለክታል፤ ‘ለሚገልጹ’ መሐላ ወይም ቃል ኪዳን ሳያስገባ ይህን ይይዛል።
- source_word: θεοσέβειαν
  choice: አምላክን እንደሚያከብሩ
  rationale: ለአምላክ ያለ አክብሮትንና በተግባር የሚገለጥ ትጋትን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: δι’ ἔργων ἀγαθῶν
  choice: በመልካም ሥራዎች
  rationale: διά ከዝርያ አገባብ ጋር መንገድን ወይም መሣሪያን ያመለክታል፤ እዚህ መልካም ሥራዎች ለሴቶቹ ተገቢው ጌጥ መሆናቸውን ይገልጣል።
theological_decisions:
- issue: መልካም ሥራዎች አምላክን ከማክበር መግለጫ ጋር ያላቸው ግንኙነት
  choice: መልካም ሥራዎች አምላክን እንደሚያከብሩ ለሚገልጹ ሴቶች ተገቢ ጌጥና ውጫዊ መግለጫ እንደሆኑ ተተርጉሟል።
  alternative: መልካም ሥራዎች በአምላክ ፊት ተቀባይነትን የሚያስገኙ መሠረት ናቸው ብሎ መተርጎም።
  rationale: ሰዋስዋዊውና የአውዱ ንጽጽር በውጫዊ ጌጥና አምላክን ማክበር በሚገለጥበት ሥነ ምግባር መካከል ነው፤ ጥቅሱ ራሱ ያልተናገረው የድነት ትምህርት አልተጨመረም።
- issue: በአማርኛ የተሟላ ግስ ማቅረብ
  choice: ከቁጥር 9 የሚቀጥለውን የጌጥ ሐሳብ ግልጽ ለማድረግ ‘ይዋቡ’ ተጨምሯል።
  alternative: የግሪኩን ሐረግ ያለ ግልጽ ግስ መተው።
  rationale: የግሪኩ ሐረግ ከቀደመው ቁጥር ጋር በሰዋስው የተያያዘ ነው፤ በአማርኛ ግን ‘ይዋቡ’ ማቅረብ ትርጉሙን ሳይቀይር ግንኙነቱን ግልጽ ያደርጋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘አምላክን ማክበር’ ከአሁኑ አጠቃቀም ጋር የሚስማማ ሲሆን የθεοσέβειαን የአክብሮትና የትጋት ስፋት ያስቀምጣል።
