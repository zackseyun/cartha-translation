  text: For Adam was formed first[a], then Eve.
translation:
  language: am
  text: ምክንያቱም፣ አዳም አስቀድሞ ተሠራ[a]፤ ከዚያም ሔዋን ተሠራች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተበጀ።” ግሱ በዘፍጥረት የፍጥረት ታሪክ ውስጥ ያለውን ቅርጽ ሰጥቶ የመሥራት አገላለጽ ያስተጋባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: በእርግጥ
  rationale: ቃሉ ቀደም ሲል ለተነገረው ሐሳብ ምክንያት ወይም መሠረት ያቀርባል። ሆኖም በአማርኛው የአንቀጹ ፍሰት ውስጥ በግልጽ አልተተረጎመም፤ የምክንያት ግንኙነቱ ከአውዱ ይታያል።
- source_word: Ἀδὰμ
  choice: አዳም
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የግል ስም ቅርጽ ነው።
- source_word: πρῶτος
  choice: አስቀድሞ
  rationale: ከሔዋን መሠራት አንጻር ያለውን የጊዜ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπλάσθη
  choice: ተሠራ
  rationale: የπλάσσωን የመቅረጽና ቅርጽ ሰጥቶ የመሥራት ሐሳብ ይይዛል፤ ከአጠቃላዩ ‘ተፈጠረ’ ይልቅ በዘፍጥረት ያለውን የአፈጣጠር ቋንቋ በቅርብ ያስተጋባል።
- source_word: εἶτα
  choice: ከዚያም
  rationale: ቀጣዩን የጊዜ ደረጃ በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: Εὕα
  choice: ሔዋን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የግል ስም ቅርጽ ነው።
theological_decisions:
- issue: በቤተ ክርስቲያን አውድ ክርክር ከሚያስነሳው ጉዳይ ጋር የፍጥረት ቅደም ተከተሉ ያለው ግንኙነት
  choice: ጥቅሱን እንደ ቀላል የጊዜ ቅደም ተከተል መግለጫ መተርጎም፦ አዳም አስቀድሞ ተሠራ፤ ከዚያም ሔዋን።
  alternative: ስለ ሥልጣን ወይም ስለ ሚና ልዩነት የሚያመለክተውን አንድምታ በትርጉሙ ውስጥ በቀጥታ ማካተት።
  rationale: የግሪክ ጽሑፉ የመሠራታቸውን ቅደም ተከተል ብቻ በግልጽ ይናገራል፤ በዚህ ጥቅስ ብቻ ተጨማሪ ሥነ መለኮታዊ ድምዳሜን አይገልጽም። ስለዚህ ትርጉሙ ያልተጻፈን ዶክትሪን ሳያስገባ የጽሑፉን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። አጭር የግሪክ አወቃቀሩና የጊዜ ቅደም ተከተሉ ተጠብቀዋል።
