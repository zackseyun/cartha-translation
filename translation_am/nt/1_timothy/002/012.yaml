  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: am
  text: ነገር ግን ሴት እንድታስተምር ወይም በወንድ ላይ ሥልጣንን እንድትጠቀም[a][b] አልፈቅድም፤ ይልቁንም በጸጥታ[c] ትሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሚስት … በባሏ ላይ።” የግሪኩ ቃላት አጠቃላይ ፍቺ (“ሴት/ወንድ”) ወይም የጋብቻ ፍቺ (“ሚስት/ባል”) ሊኖራቸው ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በወንድ ላይ ሥልጣን እንዲኖራት”፤ ምናልባትም፣ “በኃይል እንድትገዛው።” የግሪኩ ግስ ብርቅ ሲሆን የትርጉሙ ልዩ ገጽታ አከራካሪ ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ዝም ብላ።” የግሪኩ ቃል እንደ ዐውደ ንባቡ ጸጥታን፣ መረጋጋትን ወይም ዝምታን ሊያመለክት ይችላል።
    reason: lexical_alternative
