  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ጥቅም ላይ ውሏል። ሴሚኮሎኖቹ የግሪኩን ‘አንድ አምላክ … አንድ አስታራቂ’ ትይዩ አወቃቀር በግልጽ ያሳያሉ፤ በግሪኩ በቀጥታ ያልተጻፈው ‘አለ/ነው’ በአማርኛ ሙሉና ተፈጥሯዊ ዓረፍተ ነገር ለመፍጠር ተጨምሯል።
