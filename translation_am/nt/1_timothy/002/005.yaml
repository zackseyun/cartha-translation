  source_fidelity: The rendering accurately preserves the one-God/one-mediator parallel, the parties involved, and the explicit identification of the mediator as human and as Messiah Jesus. However, አስታራቂ means specifically ‘reconciler’ and can add the action/result of reconciliation; μεσίτης more basically denotes one who stands between parties as an intermediary or mediator.
