  rationale: ብዙ ቁጥሩ አጠቃላይ ሰብአዊነትን ሲያመለክት፣ ነጠላው የኢየሱስን እውነተኛ ሰብአዊነትና የውክልና ሚና ያጎላል። ትርጉሙ ይህን ግንኙነት ሳያጠፋ በተፈጥሯዊ አማርኛ ያቀርባል።
