- source_word: ἄνθρωπος
  choice: ሰው የሆነው
  rationale: የአስታራቂውን እውነተኛ ሰብአዊነት በተፈጥሯዊ አማርኛ ያሳያል፤ ከቀደመው ‘ሰዎች’ ጋር ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: Χριστὸς
  choice: መሲሕ
  rationale: Χριστός በዚህ ስፍራ የኢየሱስን የተቀባ ንጉሥነት የሚያመለክት ማዕረግ ስለሆነ ‘መሲሕ’ ተብሎ ተተርጉሟል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግል ስሙ በአማርኛ በተለመደው መልክ ተጽፏል።
theological_decisions:
- issue: በἀνθρώπων እና በἄνθρωπος መካከል ያለው የቃልና የአሳብ ግንኙነት
  choice: ‘ሰዎች … ሰው የሆነው’ ተብሎ ተተርጉሟል።
