  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: ቃሉ በዚህ አውድ እንደ ማዕረግ የሚሠራ በመሆኑ ‘መሲሕ’ የትርጉም ኃይሉን ይገልጻል፤ የግሪኩ የቃላት ቅደም ተከተልም ተጠብቋል።
- issue: ‘ሰው’ የሚለው ክርስቶሎጂያዊ አጽንዖት
  choice: የኢየሱስን ሰብአዊነት በቀጥታ ማረጋገጥ
  alternative: ቃሉን በማለዘብ ማቅረብ ወይም ኢየሱስ ሰው ብቻ እንደሆነ የሚያስመስል ማብራሪያ መጨመር
  rationale: ጥቅሱ የአስታራቂውን ሰብአዊነት በግልጽ ያጎላል። ትርጉሙ ይህን ያስቀምጣል፤ ነገር ግን ጥቅሱ ያልተናገረውን ስለ መለኮታዊነቱ አይክድም ወይም ተጨማሪ ትርጓሜ አያስገባም።
