  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: am
  text: እንዲሁም ሴቶች በተገቢ አለባበስ[a]፣ በልከኝነትና ራስን በመግዛት ራሳቸውን ያስውቡ፤ በተጎነጎነ ፀጉር፣ በወርቅ፣ በዕንቁ ወይም ውድ በሆነ ልብስ ሳይሆን[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጨዋ አለባበስ” ወይም “ሥርዓታማ አለባበስ።”
    reason: lexical_alternative
  - marker: b
    text: “በተጎነጎነ ፀጉር፣ በወርቅ፣ በዕንቁ ወይም ውድ በሆነ ልብስ” የሚለው በሁሉም ሁኔታ ፀጉርን መጎንጎን ወይም ጌጣጌጥ መጠቀምን ከመከልከል ይልቅ፣ የተጋነነ የውጫዊ ጌጥና የሀብት ማሳያን ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: እንዲሁም
  rationale: የቀደመውን ምክር ከዚህ መመሪያ ጋር ያገናኛል፤ ὡσαύτως እና καί በተፈጥሯዊ አማርኛ በአንድነት ተገልጸዋል።
- source_word: γυναῖκας
  choice: ሴቶች
  rationale: በዚህ አጠቃላይ የምክር አውድ ውስጥ ቃሉን ‘ሚስቶች’ ብሎ የሚገድብ የጋብቻ ምልክት የለም።
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: በጨዋ አለባበስ
  rationale: καταστολή ልብስን ወይም አለባበስን፣ κόσμιος ደግሞ ሥርዓታማነትንና ተገቢነትን ያመለክታል፤ ‘ጨዋ አለባበስ’ በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው ነው።
- source_word: μετὰ αἰδοῦς
  choice: በአግባብነት
  rationale: αἰδώς ከማይገባ ነገር የሚከለክል የጨዋነት፣ የእፍረትና የተገቢነት ስሜትን ያካትታል፤ ‘በአግባብነት’ ትርጉሙን በልብስ ብቻ አይገድበውም።
- source_word: σωφροσύνης
  choice: ራስን በመግዛት
  rationale: ቃሉ ጤናማ አስተሳሰብን፣ ጥንቃቄንና ራስን መቆጣጠርን ያካትታል፤ ይህ ምርጫ በአማርኛ ግልጽና ተለምዷዊ ነው።
- source_word: κοσμεῖν ἑαυτάς
  choice: ራሳቸውን ያስውቡ
  rationale: κοσμέω ማስዋብን ወይም በሥርዓት ማዘጋጀትን ያመለክታል፤ ይህ አገላለጽ ከሚከተለው የውጫዊ ጌጥ ንጽጽር ጋር ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: μὴ ἐν πλέγμασιν
  choice: በተሸለመ ፀጉር ... አይሁን
  rationale: πλέγματα የተጎነጎነ ወይም በውበት የተሸለመ የፀጉር አሠራርን ያመለክታል፤ ‘በተሸለመ ፀጉር’ የጌጥ አውዱን ይጠብቃል።
- source_word: χρυσίῳ
  choice: ወርቅ
  rationale: የግሪኩን ሰፊ አገላለጽ ሳያጠብ የጌጥ መንገድ ወይም ቁሳቁስ መሆኑን ያሳያል።
- source_word: μαργαρίταις
  choice: ዕንቁ
  rationale: የቃሉ መደበኛና ቀጥተኛ ትርጉም ነው።
- source_word: ἱματισμῷ πολυτελεῖ
  choice: ውድ በሆነ ልብስ
  rationale: ἱματισμός ልብስን፣ πολυτελής ደግሞ ከፍተኛ ዋጋ ያለውን ነገር ያመለክታል፤ አገላለጹ ግልጽና ዘመናዊ ነው።
theological_decisions:
- issue: ቁጥሩ በአጠቃላይ ሴቶችን ወይስ በተለይ ሚስቶችን እንደሚመለከት
  choice: ሴቶች
  alternative: ሚስቶች
  rationale: γυναῖκας ሁለቱንም ሊያመለክት ቢችልም፣ በቅርብ አውዱ ውስጥ ትርጉሙን በባለትዳር ሴቶች ብቻ የሚገድብ ምልክት የለም።
- issue: ክልከላው ፀጉርን መሸለምንና ጌጣጌጥን ሁሉ ፈጽሞ ይከለክል እንደሆነ ወይስ የተጋነነ የሀብት ማሳያን እንደሚቃወም
  choice: የግሪኩ ዝርዝር በዋናው ጽሑፍ ቃል በቃል ቀርቦ፣ የታሪካዊ አውዱ አንድምታ በማስታወሻ ተገልጿል
  alternative: በሁሉም ሁኔታ ፀጉርን መሸለምን፣ ወርቅን፣ ዕንቁንና ውድ ልብስን ፍጹም የሚከለክል ትርጉም
  rationale: አገባቡ ጨዋና ራስን በመግዛት የሚደረግን አቀራረብ ከውጫዊ ውድ ጌጥ ጋር ያነጻጽራል። ዋናው ጽሑፍ ዝርዝሩን ሳይቀይር ያቆየዋል፤ ማስታወሻውም አውዳዊውን አንድምታ እንጂ ፍጹም ክልከላ አይደነግግም።
