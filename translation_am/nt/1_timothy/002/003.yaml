  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: am
  text: ይህ በአዳኛችን በእግዚአብሔር ፊት መልካምና ተቀባይነት ያለው ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: ይህ
  rationale: ገለልተኛ ነጠላ አመልካች ቃሉ በቀደመው ክፍል የተሰጠውን የጸሎት መመሪያ ወደኋላ ያመለክታል፤ «ይህ» ያንን ግንኙነት በተፈጥሮ ይጠብቃል።
- source_word: καλὸν
  choice: መልካም
  rationale: በዚህ የሥነ ምግባርና የተገቢነት አውድ ውስጥ ቃሉ ውበትን ሳይሆን መልካምነትን ያመለክታል።
- source_word: ἀπόδεκτον
  choice: ተቀባይነት ያለው
  rationale: ቃሉ አንድ ነገር በመልካም እንደሚቀበል ያሳያል፤ «ተቀባይነት ያለው» ይህን የግምገማ ትርጉም ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
- source_word: ἐνώπιον
  choice: በ…ፊት
  rationale: እዚህ ቃሉ ነገሩ በእግዚአብሔር እይታና ግምገማ ያለውን ሁኔታ ይገልጣል፤ «በ…ፊት» አጭር፣ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: σωτῆρος
  choice: አዳኛችን
  rationale: σωτήρ በመልእክቱ ውስጥ የተጫነ መለኮታዊ ማዕረግ ነው፤ «አዳኝ» በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደና ግልጽ ነው። የἡμῶν ትርጉም በቅጥያው «-ችን» ተይዟል።
- source_word: ἡμῶν
  choice: -ችን (በ«አዳኛችን»)
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር ባለቤትነት በአማርኛ በተፈጥሮ በስሙ ላይ በሚጨመረው «-ችን» ቅጥያ ተገልጧል።
- source_word: θεοῦ
  choice: እግዚአብሔር
  rationale: θεός እዚህ ከ«አዳኛችን» ጋር በተዛማጅ ስማዊ አገባብ እግዚአብሔርን ራሱን አዳኛችን ብሎ ይለያል፤ «እግዚአብሔር» የተለመደውና ክብር ያለው አማርኛ አቻ ነው።
theological_decisions:
- issue: በτοῦ σωτῆρος ἡμῶν θεοῦ ውስጥ ያለው የስም ተዛምዶ
  choice: «በአዳኛችን በእግዚአብሔር ፊት»
  alternative: «በእግዚአብሔር በአዳኛችን ፊት»
  rationale: የግሪኩ የዘር ሐረግ θεόςን ከσωτήρ ጋር በተዛማጅ ስማዊ አገባብ ያቀርባል፣ ማለትም እግዚአብሔር አዳኛችን እንደሆነ ይለያል። የተመረጠው አገባብ የምንጩን ቅደም ተከተልና ማንነት ጠብቆ በአማርኛም ግልጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ምንም የግርጌ ማስታወሻ አያስፈልግም።
