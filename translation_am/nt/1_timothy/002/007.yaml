base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: am
  text: ለዚህም[a] እኔ አዋጅ ነጋሪና ሐዋርያ—እውነትን እናገራለሁ፤ አልዋሽም—በእምነትና በእውነት[c] የአሕዛብ[b] አስተማሪ ሆኜ ተሾምሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለዚህ ነገር ምክንያት ተሾምሁ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የሕዝቦች።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በታማኝነትና በእውነት።”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: ለዚህም
  rationale: ወደ ቀደመው የማዳን ዓላማና ምስክርነት የሚያመለክተውን የዓላማ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐτέθην
  choice: ተሾምሁ
  rationale: በዚህ አውድ አካላዊ መቀመጥን ሳይሆን ለአገልግሎት መመደብንና መሾምን ያመለክታል።
- source_word: κῆρυξ
  choice: አዋጅ ነጋሪ
  rationale: በሌላ ሥልጣን ስም በይፋ የሚያውጅን ሰው የሚያመለክተውን መደበኛ ሚና ይጠብቃል።
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: በጳውሎስ ራስ-ገለጻ ውስጥ የታወቀውን የአገልግሎት ማዕረግ በመደበኛው የአማርኛ መጽሐፍ ቅዱስ ቃል ያቀርባል።
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: እውነትን እናገራለሁ፤ አልዋሽም
  rationale: ድርብና አጽንዖታዊውን ማረጋገጫ ቀጥተኛና ዘመናዊ በሆነ አማርኛ ይጠብቃል።
- source_word: διδάσκαλος ἐθνῶν
  choice: የአሕዛብ አስተማሪ
  rationale: ἐθνῶν በዚህ የጳውሎስ አውድ አይሁድ ያልሆኑ ሕዝቦችን በተለይ ያመለክታል፤ ሰፊው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: በእምነትና በእውነት
  rationale: የትምህርቱን ወይም የአገልግሎቱን ክልል/አካሄድ ሊገልጽ የሚችለውን አሻሚነት ይጠብቃል፤ πίστις እንደ ‘ታማኝነት’ ሊተረጎም የሚችለው አማራጭም በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በጳውሎስ ተልእኮ ውስጥ የἐθνῶν ትርጉም
  choice: አሕዛብ
  alternative: ሕዝቦች
  rationale: የጳውሎስ አጠቃቀምና የአውዱ የማዳን ስፋት በተለይ አይሁድ ያልሆኑትን ያመለክታሉ፤ ሆኖም የቃሉ ሰፊ ትርጉም በማስታወሻ ተጠብቋል።
- issue: ἐν πίστει καὶ ἀληθείᾳ ውስጥ የπίστις አተረጓጎም
  choice: እምነት
  alternative: ታማኝነት
  rationale: ‘እምነት’ የቃሉን መደበኛና በዚህ አውድ ተስማሚ ፍቺ ይሰጣል፤ የባሕርይ ታማኝነት ፍቺው ግን ሊኖር ስለሚችል በማስታወሻ ተካቷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክ ዓረፍተ ነገር መካከለኛ ማብራሪያ በረጅም ሰረዝ ተጠብቋል፤ በመጨረሻም ‘ተሾምሁ’ በመድገም በአማርኛ የአረፍተ ነገሩ ግንኙነት ግልጽ ተደርጓል።
