  to: ስለ ነገሥታትና በከፍተኛ ቦታ ላይ ስላሉ ሁሉ[a]፣ በሁሉም እግዚአብሔርን በማክበርና በጨዋነት የተሞላ የተረጋጋና ጸጥተኛ ኑሮ እንድንመራ።
