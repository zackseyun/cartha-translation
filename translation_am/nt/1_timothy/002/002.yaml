base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: am
  text: ስለ ነገሥታትና በከፍተኛ ቦታ ላይ ስላሉ ሁሉ[a]፣ በሁሉም እግዚአብሔርን በማክበርና በጨዋነት የተሞላ የተረጋጋና ጸጥተኛ ኑሮ እንድንመራ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሥልጣን ላላቸው ሁሉ።” የግሪኩ ሐረግ በቃል በቃል፣ “በከፍተኛነት ላይ ያሉ ሁሉ” የሚል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: ስለ
  rationale: ከቀደመው የጸሎትና የምልጃ ጥሪ ጋር ሲነበብ፣ ለተጠቀሱት ሰዎች የሚቀርብ ጸሎትን ያመለክታል፤ ‘ስለ’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: βασιλέων
  choice: ነገሥታት
  rationale: ቃሉ በቀጥታ ነገሥታትን ያመለክታል፤ ወደ አጠቃላይ ‘ገዥዎች’ አልተስፋፋም።
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: በከፍተኛ ሥፍራ ስላሉ ሁሉ
  rationale: ὑπεροχή የሥልጣንንም ሆነ የከበሬታን ከፍተኛነት ሊያመለክት ይችላል፤ ይህ አተረጓጎም ሐረጉን በሕጋዊ ሥልጣን ብቻ አይገድበውም።
- source_word: ἵνα
  choice: ይህም … እንድንኖር ነው
  rationale: የጸሎቱን ዓላማ በተፈጥሯዊ የአማርኛ አገባብ ግልጽ ያደርጋል።
- source_word: ἤρεμον
  choice: ሰላማዊ
  rationale: ከረብሻና ከመናወጥ ነጻ የሆነ ሁኔታን ይገልጣል፤ ከἡσύχιον ጋር ያለው ልዩነትም ተጠብቋል።
- source_word: ἡσύχιον
  choice: ጸጥተኛ
  rationale: የጸጥታንና የሰከነ ኑሮን ሐሳብ ይይዛል።
- source_word: βίον / διάγωμεν
  choice: ኑሮ እንድንኖር
  rationale: βίος በዚህ አውድ ምድራዊ አኗኗርን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: በፍጹም እግዚአብሔርን በማክበር
  rationale: εὐσέβεια በሕይወት የሚገለጥ ለእግዚአብሔር ያለ አክብሮትና ታማኝ አምልኮን ያመለክታል፤ ‘በፍጹም’ የπάσῃን ሙሉነት ያንጸባርቃል።
- source_word: σεμνότητι
  choice: በክብር የተሞላ
  rationale: ቃሉ ክብር የሚገባውን ጨዋነትና ቁምነገር ያመለክታል፤ አገላለጹ በዘመናዊ አማርኛ ግልጽ ነው።
theological_decisions:
- issue: ለሲቪል ገዥዎች የሚቀርብ ጸሎት ወሰንና ዓላማ
  choice: አማኞች በሰላም፣ እግዚአብሔርን በማክበርና በክብር እንዲኖሩ ለነገሥታትና በከፍተኛ ሥፍራ ላሉ ሁሉ መጸለይ
  alternative: ጥቅሱን ለገዥዎች ፍጹም መገዛትን እንደሚያዝ ማቅረብ፣ ወይም ሐረጉን በሕጋዊ ሥልጣን ላሉ ብቻ መገደብ
  rationale: ግሪኩ የጸሎቱን ተቀባዮችና የሚፈለገውን ማኅበራዊ ሁኔታ ይገልጣል፤ ሁሉንም ገዥ ያለገደብ ስለመደገፍ ወይም ስለ ሕጋዊነቱ ተጨማሪ የፖለቲካ ትምህርት አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ነገሥታት’ የቃሉን ታሪካዊና መዝገበ ቃላዊ ልዩነት ይጠብቃል፤ የὑπεροχή ሰፊ ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
