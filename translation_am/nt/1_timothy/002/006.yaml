- source_word: τὸ μαρτύριον
  choice: ምስክርነት
  rationale: ቃሉ የክርስቶስን ራስን መስጠት በማጠቃለል ወይም በተቀጽላ ሊገልጥ ይችላል። ‘ምስክርነት’ ይህን ይዘት በወቅታዊና ክቡር አማርኛ ያስተላልፋል።
