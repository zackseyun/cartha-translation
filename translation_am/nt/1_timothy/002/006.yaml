  choice: ቤዛ
  alternative: የመተኪያ ቤዛ፤ በሁሉ ፈንታ የተከፈለ ቤዛ
  rationale: ቃሉ የቤዛነትና የመተካት ጥላ ሐሳብ አለው፤ ሆኖም በዋናው ጽሑፍ ማስፋት ከትርጉም ወደ ትርጓሜ ሊያልፍ ይችላል።
- issue: τὸ μαρτύριον καιροῖς ἰδίοις ከቀደመው ንግግር ጋር ያለው አገናኝ
  choice: ይህም በተገቢዎቹ ጊዜያት የተሰጠ ምስክርነት ነው
  alternative: በተገቢዎቹ ጊዜያት የሆነው ምስክርነት፤ ወይም በተገቢዎቹ ጊዜያት የተገለጠው ምስክርነት
  rationale: የግሪኩ አገባብ የታመቀ ሲሆን የክርስቶስ ራስን መስጠት ራሱ ምስክርነቱ መሆኑን፣ ወይም ምስክርነቱ በተወሰኑት ጊዜያት መሰጠቱን ሊያመለክት ይችላል። ዋናው አተረጓጎም በአማርኛ ሙሉና ተፈጥሯዊ ንግግር ለመፍጠር የታሰበውን አገናኝ ያሳያል፤ አማራጮቹ በማስታወሻ ተጠብቀዋል።
