  rationale: ከቁጣ ጋር ያለው ጥምረት የጉባኤን ጠበኛ ክርክር እንደሚመለከት ያመዝናል። ሆኖም ‘ጥርጥር’ በቃሉ የፍቺ ክልልና በትርጉም ታሪክ የሚታወቅ አማራጭ ስለሆነ በግርጌ ማስታወሻ ተካቷል።
