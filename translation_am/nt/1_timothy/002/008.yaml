- source_word: προσεύχεσθαι
  choice: እንዲጸልዩ
  rationale: በΒούλομαι ላይ የተመሠረተውን የግሪክ የማድረጊያ ግስ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: τοὺς ἄνδρας
