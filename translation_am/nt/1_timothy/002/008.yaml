  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: am
  text: ስለዚህ ወንዶች በየስፍራው ያለ ቁጣና ክርክር[a] ቅዱሳን እጆችን እያነሡ እንዲጸልዩ እፈልጋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለ ቁጣና ጥርጥር።” የግሪኩ ቃል ውስጣዊ አሳብን ወይም ጥርጥርን ሊያመለክት ይችላል፤ እዚህ ግን በጉባኤው ውስጥ የሚኖርን ጠበኛ ክርክር የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
