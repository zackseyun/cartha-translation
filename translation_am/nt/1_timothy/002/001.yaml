id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: am
  text: ስለዚህ[a] ከሁሉ አስቀድሞ፣ ስለ ሰዎች ሁሉ[b][c] ልመናዎች፣ ጸሎቶች፣ ምልጃዎችና ምስጋናዎች እንዲቀርቡ አጥብቄ እለምናለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንግዲህ።»
    reason: lexical_alternative
  - marker: b
    text: «ስለ» የሚለው እዚህ «ለሰዎች ሁሉ ጥቅም» ወይም «ሰዎችን ሁሉ ወክሎ» የሚለውን ሐሳብ ሊያካትት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: አንዳንዶች «ሰዎች ሁሉ» የሚለውን «ከሁሉም ዓይነት ሰዎች» ብለው ይረዱታል፤ የግሪኩ ጽሑፍ ግን በቀጥታ «ሰዎች ሁሉ» ይላል። «ሰዎች» የሚለውም ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: አጥብቄ እለምናለሁ
  rationale: ቃሉ ተራ ጥያቄ ሳይሆን ከልብ የቀረበ ጠንካራ ማሳሰቢያን ያመለክታል፤ ይህ አተረጓጎም ኃይሉን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የድምዳሜ ወይም የውጤት ግንኙነት በግልጽ ያሳያል።
- source_word: πρῶτον πάντων
  choice: ከሁሉ አስቀድሞ
  rationale: ሐረጉ በዋናነት ቅድሚያን ያጎላል፤ የተራ ቁጥር የመጀመሪያ ነገር ብቻ መሆኑን አያስገድድም።
- source_word: ποιεῖσθαι
  choice: እንዲቀርቡ
  rationale: አራቱንም የጸሎት ዓይነቶች በአንድነት የሚገዛ ተፈጥሯዊ አማርኛ ሲሆን፣ ያልተጠቀሰ የሥርዓተ አምልኮ ፍቺ አያስገባም።
- source_word: δεήσεις
  choice: ልመናዎች
  rationale: ከፍላጎት ወይም ከችግር የሚነሱ አጥብቆ የሚቀርቡ ጥያቄዎችን ያሳያል።
- source_word: προσευχάς
  choice: ጸሎቶች
  rationale: የግሪኩን አጠቃላይ የጸሎት ቃል ቀጥተኛና የተለመደ በሆነ አማርኛ ይተረጉማል።
- source_word: ἐντεύξεις
  choice: ምልጃዎች
  rationale: በዚህ ዐውድ ለሌሎች ሰዎች ሲባል የሚቀርብ ጸሎትን ያመለክታል።
- source_word: εὐχαριστίας
  choice: ምስጋናዎች
  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ ከሌሎቹ የጸሎት ቃላትም የሚለየውን የምስጋና ትርጉም በግልጽ ያስተላልፋል።
- source_word: ὑπὲρ
  choice: ስለ
  rationale: ከሰዎች ጥቅም ወይም ከእነርሱ ወክሎ ጸሎት መቅረቡን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πάντων ἀνθρώπων
  choice: ሰዎች ሁሉ
  rationale: ἄνθρωπος እዚህ ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ የሚያመለክት ስለሆነ፣ ይህ ምርጫ የምንጩን ስፋት በግልጽ ይጠብቃል።
theological_decisions:
- issue: የπάντων ἀνθρώπων ወሰን
  choice: ሰዎች ሁሉ
  alternative: ከሁሉም ዓይነት ሰዎች
  rationale: የግሪኩ ሐረግ በቀጥታ «ሰዎች ሁሉ» ይላል። ጳውሎስ እያንዳንዱን ግለሰብ ወይስ ሁሉንም የሰዎች ወገን ማለቱ እንደሆነ የሚነሳውን ሥነ መለኮታዊ ክርክር ጥቅሱ በራሱ አይወስንም፤ ስለዚህ ዋናው ጽሑፍ የምንጩን ሰፊ አነጋገር ይጠብቃል።
- issue: የὑπὲρ ግንኙነት
  choice: ስለ ሰዎች ሁሉ
  alternative: ሰዎችን ሁሉ ወክሎ
  rationale: ὑπέρ ከመስተዋድድ ዘር ጋር ሲመጣ ለአንድ ሰው ጥቅም ወይም እርሱን ወክሎ የሚደረግን ነገር ሊያመለክት ይችላል። «ስለ» በዚህ ዐውድ ሁለቱንም ገጽታዎች ሳያጠብ በተፈጥሯዊነት ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መዝገበ ቃላት ተጠቅሟል። «አጥብቄ እለምናለሁ» የሐዋርያዊውን ማሳሰቢያ ኃይል ይጠብቃል፤ የጸሎት አራቱ ቃላትም ልዩነታቸው እንዲታይ በተለያዩ የአማርኛ ቃላት ቀርበዋል።
