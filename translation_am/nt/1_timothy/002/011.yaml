  rationale: ቅርብ ዐውዱ የጋብቻ ግንኙነትን በግልጽ አይገድብም። ‘ሴት’ ቃሉን ያለ ተጨማሪ ገደብ ያቀርባል፤ ‘ሚስት’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
