  alternative: «ደግፍ» ወይም «ተንከባከብ»
  rationale: በ1 ጢሞቴዎስ 5 ያለው ቅርብ አውድ ለመበለቶች ስለሚደረግ ቁሳዊ እንክብካቤ ይናገራል፤ ሆኖም የግሪኩ ግስ ከገንዘብ ድጋፍ የሰፋ ነው። ስለዚህ ዋናው ጽሑፍ ትርጉሙን አያጠብም፣ አውዳዊው አማራጭ ግን በማስታወሻ ተጠብቋል።
