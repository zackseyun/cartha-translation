lexical_decisions:
- source_word: Χήρας
  choice: መበለቶችን
  rationale: χῆραι ባሎቻቸው የሞቱባቸውን ሴቶች ያመለክታል፤ በግሪክ የትእዛዙ ቀጥተኛ ተሳቢ ስለሆነ በአማርኛም «መበለቶችን» ተብሎ ተተርጉሟል።
- source_word: τίμα
  choice: አክብር
  rationale: τιμάω ማክበርን፣ ክብር መስጠትንና ዋጋ መስጠትን ያመለክታል። በዚህ አውድ ተግባራዊና ቁሳዊ እርዳታንም ሊያካትት ቢችልም፣ «አክብር» የግሪኩን ሰፊ ትርጉም ሳያጠብ ይጠብቃል።
- source_word: τὰς ὄντως χήρας
  choice: በእውነት መበለት የሆኑትን መበለቶች
