  rationale: የግሪኩ ግስ ‘ማግባት’ ብቻ ይላል፤ እንደገና ማግባታቸው ከመበለትነታቸው የሚገባ እንጂ በግሱ በግልጽ አልተጨመረም።
- source_word: τεκνογονεῖν
  choice: ልጆችን እንዲወልዱ
  rationale: ልጅ መውለድን በትክክልና በተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: οἰκοδεσποτεῖν
