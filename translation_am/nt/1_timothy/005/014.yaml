base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: am
  text: ስለዚህ ወጣት መበለቶች እንዲያገቡ[a]፣ ልጆችን እንዲወልዱ፣ ቤታቸውን እንዲያስተዳድሩ፣ ተቃዋሚው ለመሳደብ ምንም አጋጣሚ እንዳይሰጡ እፈልጋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በቀጥታ “እንዲያገቡ” ይላል፤ እዚህ ስለ መበለቶች ስለሚነገር፣ “እንደገና እንዲያገቡ” የሚለው ሐሳብ ከአውዱ ይገኛል።
    reason: lexical_alternative
lexical_decisions:
