  rationale: ቃሉ በቀጥታ ‘ወጣቶቹን ሴቶች’ ቢልም፣ በአውዱ የሚነገረው ስለ መበለቶች ስለሆነ በአማርኛ የተገመተው ስም ተጨምሯል።
- source_word: γαμεῖν
