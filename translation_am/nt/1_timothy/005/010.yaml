  rationale: በጳውሎስ አጠቃቀም ቃሉ በተለምዶ ለእግዚአብሔር የተለዩትን ክርስቲያኖች ያመለክታል። ዋናው ጽሑፍ ቁልፍ ቃሉን ይጠብቃል፤ ማስታወሻው ደግሞ በዚህ አውድ ያለውን ትርጉም ያብራራል።
