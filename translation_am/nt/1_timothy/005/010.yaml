base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: am
  text: በመልካም ሥራዎች መልካም ምስክርነት ያላት፣ ልጆችን ያሳደገች ከሆነ፣ እንግዶችን የተቀበለች[a] ከሆነ፣ የቅዱሳንን[b] እግሮች ያጠበች ከሆነ፣ በመከራ ያሉትን የረዳች ከሆነ፣ ለመልካም ሥራ ሁሉ የተጋች[c] ከሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንግዳ ተቀባይነትን ያሳየች።” የግሪኩ ግስ በተለይ እንግዶችን ወይም መጻተኞችን በቤቷ መቀበልን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ቅዱሳን” የሚለው የእግዚአብሔርን ቅዱስ ሕዝብ፣ ማለትም ባልንጀራ አማኞችን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “መልካም ሥራን ሁሉ የተከተለች።” የግሪኩ አገላለጽ መልካም ሥራን በንቃት መከተልንና ለእርሱ መሰጠትን ያጎላል።
    reason: lexical_alternative
