review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the repeated qualifying εἰ clauses, hospitality toward guests, help for afflicted people, and the reference to the saints. Two expressions need adjustment: the opening passive participle is not idiomatic Amharic as written, and the plural Greek πόδας should be represented as plural “feet.” The final phrase is semantically aimed correctly but its literal wording is unnatural in Amharic; a rendering of active commitment is both natural and faithful to ἐπηκολούθησεν in this ethical list.'
  naturalness: “በመልካም ሥራዎች የተመሰከረላት” is grammatically possible but awkward and unclear as a description of reputation. “በመልካም ሥራዎች መልካም ምስክርነት ያላት” is clear, standard Amharic. “መልካም ሥራን ሁሉ ... የተከታተለች” is also less idiomatic than expressing devoted effort toward every good work.
  terminology: “ቅዱሳን” appropriately retains the established biblical term for God’s holy people. The explanatory footnote is revised to use natural, inclusive standard Amharic (“ባልንጀራ አማኞች”).
  issues:
  - severity: medium
    issue: Opening reputation phrase is awkward and semantically imprecise.
    rationale: μαρτυρουμένη is a present passive participle describing a woman attested or well spoken of in/by good works. The draft’s “የተመሰከረላት” can suggest testimony given on her behalf and does not naturally express established reputation.
  - severity: low
    issue: “እግር” is singular although πόδας is plural.
    rationale: The Greek explicitly refers to the feet of the saints. Plural “እግሮች” preserves this detail and is natural here.
  - severity: medium
    issue: The final phrase is overly literal and awkward in Amharic.
    rationale: ἐπηκολούθησεν conveys active following after or commitment to every good work. “ለመልካም ሥራ ሁሉ የተጋች” communicates this sense naturally without imposing a doctrinal interpretation.
