  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በእንክብካቤዋ ሥር» የሚለው ጭማሪ የግሪኩ ἔχει በዚህ አውድ የቤተሰብ ኃላፊነትን እንጂ ባለቤትነትን እንዳያስመስል የተደረገ ተፈጥሯዊ ማብራሪያ ነው።
