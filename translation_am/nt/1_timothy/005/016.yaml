review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the feminine singular subject of τις πιστή and retains the textual-variant note. It also accurately communicates the contrast between private provision and provision by the church. However, the rendering of βαρείσθω is not idiomatic or grammatically well formed in its current wording, and the final purpose clause should more directly express that the church is enabled to support the genuinely widowed.
  naturalness: '«ሸክም አይጫንባት» is awkward here: it suggests that an unspecified party must not place a burden on the church, rather than that the church itself should not bear the support burden. A direct imperative is clear and natural. The revised purpose clause also removes the somewhat detached «ይህም … ነው».'
  terminology: «የምታምን ሴት», «መበለቶች», «ቤተ ክርስቲያን», and «በእውነት መበለቶች የሆኑት» are appropriate modern-standard Amharic choices. «ድጋፍ ትስጣቸው» gives ἐπαρκέω its contextually specific sense of sufficient material support more clearly than the broader «ትርዳቸው».
  issues:
  - severity: medium
    issue: The clause «ቤተ ክርስቲያንም ሸክም አይጫንባት» does not naturally render the passive imperative μὴ βαρείσθω.
    rationale: The Amharic wording means, more literally, “let no burden be placed on it,” with an unstated external agent, and is syntactically awkward as an imperative. The Greek directs that the church not bear this burden.
  - severity: low
    issue: «ይህም … ነው» weakens the explicit purpose relation of ἵνα.
    rationale: A direct purpose clause following the instruction makes clear that relieving the church’s burden enables it to provide for the genuinely widowed.
  revised_text: የምታምን ሴት በኃላፊነቷ ውስጥ ያሉ መበለቶች ካሏት፣[a] ድጋፍ ትስጣቸው፤ ቤተ ክርስቲያንም ይህን ሸክም አትሸከም፣ በእውነት መበለቶች የሆኑትን እንድትረዳ።
