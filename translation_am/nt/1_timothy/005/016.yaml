source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: am
  text: የምታምን ሴት በኃላፊነቷ ውስጥ ያሉ መበለቶች ካሏት፣[a] ድጋፍ ትስጣቸው፤ ቤተ ክርስቲያንም ይህን ሸክም አትሸከም፣ በእውነት መበለቶች የሆኑትን እንድትረዳ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ «የሚያምን ወንድ ወይም ሴት በኃላፊነቱ ውስጥ ያሉ መበለቶች ካሉት» ወይም «የሚያምን ሰው በኃላፊነቱ ውስጥ ያሉ መበለቶች ካሉት» የሚል ንባብ አላቸው፤ ይህም መመሪያውን በተለይ ሴትን ከሚያመለክት ንባብ የበለጠ ያሰፋዋል።
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: የምታምን ሴት
  rationale: πιστή በሴት ጾታ ነጠላ ቅርጽ ስለሆነ የግሪኩን ጾታዊ መለያ በግልጽ ያስቀምጣል። «የምታምን» በዚህ አውድ የክርስቲያን እምነት ማንነትን ያመለክታል።
- source_word: ἔχει χήρας
  choice: በእንክብካቤዋ ሥር ያሉ መበለቶች ካሏት
  rationale: ቀጥተኛው «መበለቶች ካሏት» በአማርኛ የባለቤትነት ወይም የወለደቻቸው የሚመስል ግራ መጋባት ሊፈጥር ይችላል። አውዱ በቤተሰብ ኃላፊነቷ ውስጥ ያሉ መበለቶችን ስለመደገፍ መሆኑን ይህ አገላለጽ በተፈጥሯዊ መንገድ ያሳያል።
- source_word: χήρας
  choice: መበለቶች
  rationale: የχήρα ብዙ ቁጥርንና የምዕራፉን የቁሳዊ ድጋፍ አውድ በቀጥታ ያስተላልፋል።
- source_word: ἐπαρκείτω αὐταῖς
  choice: እርሷ ትርዳቸው
  rationale: ἐπαρκέω ተግባራዊና በቂ ድጋፍ መስጠትን ያመለክታል። «ትርዳቸው» ተፈጥሯዊ ሲሆን የሴቷን ርዕሰ ጉዳይ ያቆያል።
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  choice: ቤተ ክርስቲያንም ሸክም አይጫንባት
  rationale: የተገብሮ ትእዛዙንና የድጋፍ ግዴታውን ሸክም በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: ἡ ἐκκλησία
  choice: ቤተ ክርስቲያን
  rationale: በዚህ አውድ የክርስቲያኖችን ጉባኤና ማኅበረሰብ የሚያመለክተው የተለመደ አማርኛ ቃል ነው።
- source_word: ταῖς ὄντως χήραις
  choice: በእውነት መበለት የሆኑትን
  rationale: ὄντως የሚያሳየውን አጽንዖት ይጠብቃል፤ በምዕራፉ አውድ ብቻቸውን የቀሩና የጉባኤው ድጋፍ በእርግጥ የሚያስፈልጋቸውን ይለያል።
- source_word: ἐπαρκέσῃ
  choice: እንድትረዳ
  rationale: ከቀደመው ἐπαρκείτω ጋር ተመሳሳይ ትርጉም ይጠብቃል፤ ἵνα የዓላማ አንቀጽ መሆኑም «እንድት… ነው» በሚለው ቅርጽ ተገልጿል።
theological_decisions:
- issue: በመክፈቻው አንቀጽ የባለቤቱ ጾታ
  choice: በተለይ ሴትን የሚያመለክት «የምታምን ሴት»
  alternative: «የሚያምን ሰው» ወይም «የሚያምን ወንድ ወይም ሴት»
  rationale: የቀረበው SBLGNT ጽሑፍ τις πιστή ይላል፤ πιστή በሴት ጾታ ነጠላ ቅርጽ ነው። ስለዚህ ዋናው ጽሑፍ ጾታውን አያጠፋም፤ ሰፋ ያለው የእጅ ጽሑፍ ልዩነት በማስታወሻ ተጠብቋል።
- issue: «በእውነት መበለቶች» የሚለው ምድብ
  choice: የግሪኩን አጽንዖት በቀጥታ ማቆየት
  alternative: «ድጋፍ የሌላቸው መበለቶች» ብሎ ትርጉሙን ሙሉ በሙሉ መፍታት
  rationale: አውዱ ብቻቸውን የቀሩትን ሲያመለክትም ὄντως ያለውን አገላለጽና የምዕራፉን የምድብ ውጥረት ሳይደመስስ መተርጎም ተመርጧል።
