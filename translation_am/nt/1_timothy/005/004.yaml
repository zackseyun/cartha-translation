  verdict: revise
  source_fidelity: The draft correctly identifies the widow's children or grandchildren as the subject of the plural imperative and retains the priority of family responsibility. However, “በመንከባከብ እምነታቸውን በተግባር ማሳየት” makes the means of piety explicit beyond the wording and renders εὐσεβεῖν as personal ‘faith,’ rather than godly/pious conduct. The main text also over-specifies τοῖς προγόνοις by naming both parents and former generations.
  naturalness: The revision uses natural modern standard Amharic while preserving the paired infinitives and their relation to the plural command. “ተቀባይ ነው” is more idiomatic and closer to ἀπόδεκτον than “ተቀባይነት አለው.”
  terminology: መበለት, የልጅ ልጆች, ገዛ ቤተሰብ, and ውለታ መመለስ are suitable. The revised wording expresses εὐσεβεῖν as conduct honoring God without reducing it to generic faith, and “ቀደምት ወላጆቻቸው” retains the semantic range of πρόγονοι without asserting an exhaustive list.
  issues:
  - severity: medium
    issue: εὐσεβεῖν is rendered interpretively as “በመንከባከብ እምነታቸውን በተግባር ማሳየት.”
    rationale: This adds ‘by caring’ to the main text and shifts piety/godly conduct into ‘their faith.’ Family care is clearly the context, but the translation should retain the theological sense of εὐσεβεῖν without making the explanatory implication part of the text.
  - severity: medium
    issue: τοῖς προγόνοις is expanded in the main text to “ለወላጆቻቸውና ለቀደሙት ትውልዶች.”
    rationale: The Greek means forebears/ancestors and, in context, may include parents or grandparents. Naming both categories in the text over-specifies the referent; the alternatives belong in a note.
  - severity: low
    issue: “ተቀባይነት አለው” is less direct than the source adjective.
    rationale: “ተቀባይ ነው” is idiomatic and directly reflects ἀπόδεκτον.
