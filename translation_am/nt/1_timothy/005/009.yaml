source:
  edition: SBLGNT
  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: am
  text: መበለት ዕድሜዋ ከስልሳ ዓመት ያላነሰ፣ የአንድ ባል ሚስት የነበረች[a] ከሆነ ብቻ በዝርዝሩ ትመዝገብ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ሐረግ “የአንድ ወንድ ሴት” ተብሎም ሊገለጽ ይችላል፤ የጋብቻ ታማኝነቷን ወይም መልካም ስሟን የሚያመለክት ሊሆን ይችላል። አንዳንዶች ግን “አንድ ጊዜ ብቻ ያገባች” ማለት እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: መበለቲቱ
  rationale: ቃሉ ባሏ የሞተባትን ሴት ያመለክታል፤ እዚህ በዐውዱ የተወሰነችውን መበለት ስለሚጠቅስ የተወሰነ አመልካች ተጠቅሟል።
- source_word: καταλεγέσθω
  choice: በዝርዝሩ ትመዝገብ
  rationale: ግሱ በይፋዊ ዝርዝር ውስጥ መካተትን ያመለክታል፤ ‘ትመዝገብ’ የአስተዳደራዊ ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: ከስልሳ ዓመት ያላነሰች ... ከሆነ ብቻ
  rationale: ሐረጉ ዝቅተኛውን የዕድሜ መስፈርት ይወስናል። γεγονυῖα የደረሰችበትን የዕድሜ ሁኔታ በፈሊጣዊ መንገድ ስለሚገልጽ፣ ‘ያላነሰች ... ከሆነ’ ተብሎ ተፈጥሯዊ ሆኖ ቀርቧል።
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: የአንድ ባል ሚስት የነበረች
  rationale: የግሪኩን ፈሊጣዊ አገላለጽና ያለውን ትርጓሜያዊ አሻሚነት በአንጻራዊ ቀጥተኛነት ይጠብቃል። ‘የነበረች’ የመበለትነቷን ሁኔታ በተፈጥሯዊ አማርኛ ያንጸባርቃል።
theological_decisions:
- issue: የἑνὸς ἀνδρὸς γυνή ትርጉም
  choice: በዋናው ጽሑፍ ‘የአንድ ባል ሚስት የነበረች’ የሚለውን ፈሊጣዊ አገላለጽ ማቆየት
  alternative: ‘ለባሏ ታማኝ የነበረች’ ወይም ‘አንድ ጊዜ ብቻ ያገባች’
  rationale: የግሪኩ ሐረግ የጋብቻ ታማኝነትንና መልካም ስምን ሊያመለክት ይችላል፤ አንዳንዶች ግን አንድ ጊዜ ብቻ ማግባትን እንደሚያመለክት ይረዱታል። ዋናው ጽሑፍ ጉዳዩን በግልጽ ስለማይወስን፣ አሻሚነቱ ተጠብቆ አማራጮቹ በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትእዛዙ ኃይል ‘ትመዝገብ’ በሚለው የምኞት/ትእዛዝ ቅርጽ ተጠብቋል፤ የግሪኩ ትርጓሜያዊ አሻሚነትም አልተወገደም።
