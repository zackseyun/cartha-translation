  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: am
  text: ከዚህም ጋር ከቤት ወደ ቤት እየዞሩ ሥራ ፈት መሆንን ይለምዳሉ፤ ሥራ ፈት ብቻም ሳይሆኑ ወሬኞች[a]ና በማይመለከታቸው ነገር ጣልቃ የሚገቡ[b] ይሆናሉ፤ ሊናገሩት የማይገባውንም ይናገራሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከንቱ ነገር የሚያወሩ”። የግሪክ ቃሉ በሰፊው ሞኝነት ያለበትን ወይም ባዶ ንግግርን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ወሬንም የሚያካትት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የሌሎችን ጉዳይ የሚነካኩ”።
    reason: lexical_alternative
lexical_decisions:
