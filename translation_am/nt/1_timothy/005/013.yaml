- source_word: μανθάνουσιν
  choice: መሆንን ይለምዳሉ
  rationale: እዚህ መደበኛ ትምህርትን ሳይሆን ቀስ በቀስ የሚያዳብሩትን ልማድ ያመለክታል።
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: ከቤት ወደ ቤት እየዞሩ
  rationale: ከአንድ ቤት ወደ ሌላ መዘዋወርን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: φλύαροι
  choice: ወሬኞች
  rationale: ቃሉ ከንቱ፣ የማይጠቅም ወይም ጥንቃቄ የጎደለው ንግግርን ሊያመለክት ይችላል፤ በዚህ አውድ ‘ወሬኞች’ የተግባራዊ ኃይሉን ያስተላልፋል።
- source_word: περίεργοι
