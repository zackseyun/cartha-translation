  rationale: የሌሎችን ጉዳይ ያለአግባብ መነካካትን በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: ሊናገሩት የማይገባውንም ይናገራሉ
  rationale: የንግግሩን ድርጊትና ተገቢ አለመሆኑን በግልጽ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: የሴት ብዙ ቁጥር ቅርጾች ማጣቀሻ
  choice: ይለምዳሉ ... ይሆናሉ ... ይናገራሉ
  alternative: እነዚህ ሴቶች ...
  rationale: የግሪክ ቅርጾቹ የሴት ብዙ ቁጥር ሆነው በአውዱ ያሉትን ወጣት መበለቶች ያመለክታሉ። አማርኛ በሦስተኛ መደብ ብዙ ቁጥር ጾታን ስለማይለይ፣ ተውላጠ ስሙን ሳይደግሙ አውዱ ማጣቀሻውን እንዲወስን ተደርጓል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ሥራ ፈት’ የሚለው ድግግሞሽ ሆን ተብሎ የግሪኩን አጽንዖት ለመጠበቅ ተይዟል።
