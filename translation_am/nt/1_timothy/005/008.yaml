review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the conditional structure, the broader-to-narrower sequence of τῶν ἰδίων and οἰκείων, the completed-force denial of τὴν πίστιν, and the comparative judgment. However, “ለራሱ ወገኖች” is less precise and less natural here: ወገኖች can suggest compatriots or an ethnic group rather than one’s own people/dependents. “የራሱ ሰዎች” better retains the source’s broad, relational reference.'
  naturalness: The sentence is generally clear and appropriately dignified. Recasting the opening as “ማንም ሰው ለየራሱ ሰዎች … እንክብካቤ የማያደርግ ከሆነ” makes the generic subject and possessive relationship more idiomatic. “የቤተ ሰቡ አባላት” naturally communicates the specially emphasized household subset.
  terminology: “እምነትን ክዷል” aptly renders τὴν πίστιν ἤρνηται without imposing a theological expansion. “ከማያምን ሰው የከፋ” is a clear and faithful rendering of ἀπίστου χείρων.
  issues:
  - severity: medium
    issue: “ለራሱ ወገኖች” for τῶν ἰδίων
    rationale: In modern Amharic, ወገኖች can denote compatriots, a people group, or associates. The Greek is broad but concerns persons belonging to one’s own sphere of responsibility; “የራሱ ሰዎች” is both more idiomatic and contextually accurate.
  - severity: low
    issue: Footnote a repeats the potentially misleading term “ወገኖች.”
    rationale: The note should use the revised wording so that its explanation of the broader referent agrees with the main text.
  - severity: low
