  rationale: በጾታ ሳይወሰን አጠቃላይ የሆነውን የግሪክ ነጠላ አመልካች በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν ἰδίων
  choice: ለራሱ ወገኖች
  rationale: ከአንድ ጣራ በታች በሚኖሩት ብቻ ሳይወሰን የገዛ ዘመዶችንና በእርሱ ኃላፊነት ሥር ያሉትን የሚያካትተውን ሰፊ ትርጉም ይጠብቃል።
- source_word: μάλιστα
  choice: በተለይም
  rationale: ከሰፊው ቡድን ውስጥ የቤተሰብ አባላት የተለየ ቅድሚያ እንዳላቸው ያሳያል።
- source_word: οἰκείων
  choice: ለቤተሰቡ አባላት
  rationale: በተለይ ከአንድ ቤት ጋር የተያያዙትንና የእርሱ የቅርብ ኃላፊነት የሆኑትን ሰዎች በግልጽ ያመለክታል።
- source_word: προνοεῖ
  choice: እንክብካቤ የማያደርግ
  rationale: ቃሉ አስቀድሞ ማሰብን ብቻ ሳይሆን በተግባር መንከባከብንና ፍላጎትን ማሟላትን ያመለክታል፤ ይህ አገላለጽ ሁለቱንም በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: τὴν πίστιν
  choice: እምነትን
  rationale: በዚህ አውድ ሰውየው የተቀበለውንና የሚመሰክረውን ክርስቲያናዊ እምነት ያመለክታል፤ ቃሉን ያለ አስተምህሮአዊ ማስፋፊያ ይጠብቃል።
- source_word: ἤρνηται
  choice: ክዷል
  rationale: የግሪኩን ፍጹም ጊዜ ያለውን ቀጣይ ውጤትና የድርጊቱን ከባድነት በአጭርና ጠንካራ አገላለጽ ያቀርባል።
- source_word: ἀπίστου
  choice: ከማያምን ሰው
  rationale: በዚህ ንጽጽር ከእምነት ውጭ ያለን ሰው እንጂ ታማኝነት የጎደለውን ሰው ብቻ አያመለክትም።
- source_word: χείρων
  choice: የከፋ
  rationale: የሞራል ንጽጽሩን ቀጥተኛ፣ ጠንካራና ለዘመናዊ አንባቢ ግልጽ በሆነ ቃል ያስተላልፋል።
theological_decisions:
- issue: በአጠቃላይ ነጠላ አገላለጽ ውስጥ የጾታ ውክልና
  choice: “ማንም” በሚለው ጾታ-ያልተወሰነ አገላለጽ መተርጎም
  alternative: “ማንኛውም ወንድ” በማለት ለወንዶች ብቻ የተወሰነ አገላለጽ መጠቀም
  rationale: τις በዚህ ስፍራ አጠቃላይ ኃይል አለው፤ የአማርኛው “ማንም” ወንድንም ሴትንም ሳያስቀር የምንጩን ወሰን በትክክል ይጠብቃል።
- issue: በ“τὴν πίστιν ἤρνηται” ውስጥ πίστις የሚያመለክተው
  choice: ሰውየው የሚመሰክረው ክርስቲያናዊ እምነት
  alternative: የግል መታመን ወይም ታማኝነት
  rationale: በእረኛ መልእክቶች አውድ “እምነት” ብዙ ጊዜ የተቀበሉትንና የሚመሰክሩትን እምነት ያመለክታል፤ ለገዛ ወገኖች እንክብካቤ አለማድረግ ያንን እምነት በተግባር መካድ እንደሆነ ንጽጽሩ ያሳያል።
