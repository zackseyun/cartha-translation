  source_fidelity: 'The draft correctly conveys the explanatory γάρ, the two coordinated citations, and the principle that a worker merits earned compensation. However, in the first quotation, የሚወቃውን grammatically modifies እህል (‘the grain that is threshed’) rather than በሬ, reversing the participle’s referent. The Greek ἀλοῶντα modifies Βοῦν: the ox is doing the threshing.'
