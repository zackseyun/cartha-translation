  terminology: መጽሐፍ ቅዱስ is the normal Amharic rendering of ἡ γραφή in this authoritative scriptural citation. ሠራተኛው and ደመወዙ accurately render ὁ ἐργάτης and τοῦ μισθοῦ αὐτοῦ. The singular possessive remains intact without forcing an unnatural pronoun.
