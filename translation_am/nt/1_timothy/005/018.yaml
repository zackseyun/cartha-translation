base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: am
  text: ምክንያቱም መጽሐፍ ቅዱስ፣ “እህል እየወቃ ያለውን በሬ አፉን አትዝጋ”[a]፣ እንዲሁም፣ “ሠራተኛው ደመወዙ ይገባዋል”[b] ይላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እህል እየረገጠ ያለውን በሬ።” የግሪኩ አሳታፊ ግስ በሬው እህል በመውቃት ሥራ ላይ መሆኑን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሠራተኛው ክፍያው ይገባዋል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: ምክንያቱም መጽሐፍ ... ይላል
  rationale: γάρ ከቀደመው አሳብ ጋር ያለውን የምክንያት ግንኙነት ያሳያል፤ ἡ γραφή በመጽሐፍ ቅዱሳዊ አጠቃቀም ‘መጽሐፍ’ ተብሎ ተተርጉሟል።
- source_word: Βοῦν ἀλοῶντα
  choice: እህል የሚወቃውን በሬ
  rationale: ἀλοάω እህልን በመርገጥ ወይም በሌላ ዘዴ የመውቃት ሥራን ያመለክታል፤ ይህ አተረጓጎም ድርጊቱንና በሬው በሥራው ላይ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐ φιμώσεις
  choice: አፉን አትሸብብ
  rationale: የግሪኩ የወደፊት ጊዜ ቅርጽ እዚህ የክልከላ ኃይል አለው፤ ‘አትሸብብ’ በቀጥታ የእንስሳውን አፍ እንዳይበላ ማሰርን ይገልጣል።
- source_word: Ἄξιος ὁ ἐργάτης
  choice: ሠራተኛው ... ይገባዋል
  rationale: ἄξιος ከግሳዊ አገላለጽ ጋር ‘ይገባዋል’ ተብሎ በተፈጥሯዊ አማርኛ ተላልፏል፤ ἐργάτης የሚሠራን ሰው በአጠቃላይ ያመለክታል።
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: ደመወዙ
  rationale: μισθός እዚህ ለሥራ የሚከፈል ክፍያ ነው፤ የሦስተኛ መደብ ወንድ ነጠላ ባለቤትነት αὐτοῦ በ‘-ዙ’ ተጠብቋል።
theological_decisions:
- issue: የγραφή ወሰን ከሁለቱ ጥቅሶች ጋር
  choice: ሁለቱንም ጥቅሶች ‘መጽሐፍ ... ይላል’ በሚለው መግቢያ ሥር ማቅረብ
  alternative: ‘መጽሐፍ’ የሚለውን በመጀመሪያው ጥቅስ ብቻ ላይ እንደሚያመለክት መገደብ
  rationale: የግሪኩ አገባብ ሁለቱን ጥቅሶች በአንድ መግቢያ ያስተባብራል፤ ትርጉሙ የቀኖናን አሳብ ከጽሑፉ በላይ ሳይወስን ይህን ውጥረት ይጠብቃል።
- issue: የαὐτοῦ ፆታና ቁጥር
  choice: ደመወዙ
  alternative: ደመወዛቸው
  rationale: የምንጩ ቅርጽ ወንድ ነጠላ ሲሆን በአማርኛው ‘-ዙ’ ይህን ይጠብቃል፤ አባባሉ በአጠቃላይ ሊሠራ ቢችልም ወደ ብዙ ቁጥር አልተለወጠም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የሕጋዊውን ክልከላ ኃይል ለማቆየት ‘አትሸብብ’ ተመርጧል፤ ሁለቱ የግርጌ ማስታወሻ ምልክቶች በዋናው ጽሑፍ ውስጥ ተካትተዋል።
