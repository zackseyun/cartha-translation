  text: For some have already turned aside to follow Satan.
translation:
  language: am
  text: አንዳንዶች አስቀድመው ሰይጣንን ለመከተል ፈቀቅ ብለዋልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከሰይጣን በኋላ ፈቀቅ ብለዋል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ከወዲሁ
  rationale: ድርጊቱ አስቀድሞ መፈጸሙንና አሁንም ጠቀሜታ ያለው መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τινες
  choice: አንዳንዶች
  rationale: ያልተገለጸ የሰዎች ክፍልን በግልጽና በተለመደ ቋንቋ ይጠቁማል።
- source_word: ἐξετράπησαν
  choice: ፈቀቅ ብለው
  rationale: ከትክክለኛው መንገድ የመውጣትን ምሳሌያዊ ሐሳብ ይጠብቃል፤ ሌላ አካል እንዳሳታቸው የሚያመለክት ምክንያታዊ ትርጉም አያስገባም።
- source_word: ὀπίσω
  choice: ተከትለዋል
  rationale: ቃሉ በቀጥታ ‘ከኋላ/በኋላ’ ማለት ቢችልም፣ ከሰው ወይም ከግለሰብ ስም ጋር እዚህ መከተልን ያመለክታል፤ ይህ አገላለጽ ትርጉሙን በዘመናዊ አማርኛ ግልጽ ያደርገዋል።
- source_word: Σατανᾶ
  choice: ሰይጣን
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊና አጠቃላይ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠቀማል።
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶ የሚለው ሐረግ ቃል በቃል ‘ከሰይጣን በኋላ’ ተብሎ ወይስ ትርጉሙን በግልጽ ‘ሰይጣንን ተከትለዋል’ ተብሎ መተርጎም እንዳለበት።
  choice: ሰይጣንን ተከትለዋል
  alternative: ከሰይጣን በኋላ ሄደዋል / ወደ ሰይጣን ፈቀቅ ብለዋል
  rationale: ሐረጉ ወደ ሰይጣን የሚያመራ መከተልን ወይም ወገንተኝነትን በምሳሌ ይገልጣል። ‘ተከትለዋል’ የሚለው ምርጫ የማስጠንቀቂያውን ክብደት ሳያለዝብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃል በቃል ያለው አማራጭ ደግሞ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ፈቀቅ ብለው’ የመንገድ መሳትን ምሳሌ ሲጠብቅ፣ ‘ተከትለዋል’ ደግሞ ὀπίσω በዚህ አውድ ያለውን ግልጽ ሐሳብ ያቀርባል።
