  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: am
  text: በሽማግሌ[a] ላይ የሚቀርብ ክስ፣ በሁለት ወይም በሦስት ምስክሮች[b] ላይ የተመሠረተ ካልሆነ በቀር፣ አትቀበል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ዕድሜው የገፋ ወንድ ላይ።’ πρεσβυτέρου የሚለው ቃል የጉባኤ ሽማግሌነትን ሳይሆን ዕድሜን የሚያመለክት ሆኖ ከተወሰደ።
    reason: alternative_reading
  - marker: b
    text: ይህ አገላለጽ አንድ ጉዳይ ‘በሁለት ወይም በሦስት ምስክሮች’ እንዲጸና የሚያዘውን የብሉይ ኪዳን የፍርድ መርሕ ያንጸባርቃል፤ ዘዳግም 19፥15ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: በሽማግሌ ላይ
  rationale: πρεσβύτερος በዚህ አውድ የጉባኤ መሪን ማመልከቱ ይበልጥ የሚመስል ሲሆን፣ ‘ሽማግሌ’ ይህን ትርጉም በተፈጥሯዊና በክብር ባለው አማርኛ ያስተላልፋል፤ ቃሉ በዕድሜ የገፋን ወንድም ሊያመለክት የሚችለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: κατηγορίαν
