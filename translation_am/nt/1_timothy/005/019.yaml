  rationale: የአሁን ጊዜ ክልከላው ክሱን ለምርመራ መቀበልን ወይም ቦታ መስጠትን ይከለክላል፤ ‘አትቀበል’ የሂደቱን ትርጉም በተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ἐκτὸς εἰ μὴ
  choice: ካልሆነ
  rationale: ይህ የግሪክ አገላለጽ ልዩ ሁኔታን ያስገባል፤ በአማርኛው አሉታዊ ሁኔታዊ አወቃቀር ያንኑ ‘ካልሆነ በቀር’ የሚል ኃይል በቀላሉ ያስተላልፋል።
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: በሁለት ወይም በሦስት ምስክሮች ላይ የተመሠረተ
