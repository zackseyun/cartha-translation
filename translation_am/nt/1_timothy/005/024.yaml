  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: am
  text: የአንዳንድ ሰዎች ኃጢአቶች ግልጽ ናቸው፤[a] ወደ ፍርድ ቀድመው ይሄዳሉ፤[b] ለሌሎች ግን በኋላ ይከተሏቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የአንዳንድ ሰዎች ኃጢአቶች በግልጽ ይታያሉ፤ ወደ ፍርድም ቀድመው ይሄዳሉ።»
    reason: lexical_alternative
  - marker: b
    text: በዚህ ዐውድ «ፍርድ» አሁን የሚደረግን ግምገማ ሊያመለክት ይችላል፤ አነጋገሩ ግን ሰፋ ያለውን መለኮታዊ ፍርድም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: የአንዳንድ ሰዎች ኃጢአት
  rationale: የግሪኩን የባለቤትነት አወቃቀር በተፈጥሯዊ አማርኛ ይወክላል፤ ἄνθρωπος እዚህ ሰዎችን በአጠቃላይ ሊያመለክት ስለሚችል «ሰዎች» ተመርጧል።
- source_word: πρόδηλοί
  choice: ግልጽ ነው
  rationale: ኃጢአቶቹ በግልጽ እንደሚታወቁ የሚያሳየውን የቃሉን ዘመናዊና ተፈጥሯዊ ፍቺ ይሰጣል።
- source_word: προάγουσαι
  choice: ቀድሞአቸው ይሄዳል
  rationale: ኃጢአቶች ከሰዎቹ ቀድመው እንደሚሄዱ የሚያቀርበውን ሰውኛ ምስል ጠብቆ ያቀርባል፤ «አቸው» በዐውዱ የተገኙትን ሰዎች ያመለክታል።
- source_word: εἰς κρίσιν
  choice: ወደ ፍርድ
  rationale: የεἰςን አቅጣጫዊ ኃይል ይጠብቃል፤ «ፍርድ» ደግሞ የአሁኑን ግምገማም ሆነ ሰፊውን መለኮታዊ ፍርድ ሳይወስን ይተዋል።
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: የሌሎች ግን ተከትሎአቸው ይመጣል
  rationale: ከመጀመሪያው ቡድን ጋር ያለውን ንፅፅር ግልጽ ያደርጋል፤ ኃጢአቶቹ ከሰዎቹ በኋላ እንደሚከተሉ የግሪኩን ሰውኛ ምስል ይጠብቃል።
theological_decisions:
- issue: የκρίσις («ፍርድ») ወሰን
  choice: ቃሉ «ፍርድ» ተብሎ በአጠቃላይ ተተርጉሟል።
  alternative: በቅርብ ዐውዱ ያለ የማኅበር ግምገማ፣ ወይም የመጨረሻው መለኮታዊ ፍርድ።
  rationale: የቅርብ ዐውዱ ሰዎችን ስለመመርመር ቢናገርም፣ ቃሉ ሰፊ የመለኮታዊ ፍርድ ትርጉምንም ሊሸከም ይችላል፤ ትርጉሙ ይህን ውጥረት አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ«ቀድሞ መሄድ/ተከትሎ መምጣት» ምስል ተጠብቋል፤ የፍርዱ ዓይነት ደግሞ ሆን ተብሎ አልተወሰነም።
