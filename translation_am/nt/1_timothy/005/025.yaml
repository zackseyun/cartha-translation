id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: am
  text: እንዲሁም መልካም ሥራዎች ግልጽ ናቸው፤ እንደዚያ ያልሆኑትም[a] ሊሰወሩ አይችሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሌላ ሁኔታ ያሉት” ወይም “የተለዩት”፤ አንዳንዶች ከቀደመው ቁጥር ጋር በማነጻጸር ይህ በተለይ ክፉ ሥራዎችን እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: እንዲሁም
  rationale: ከቁጥር 24 ጋር ያለውን ትይዩነት በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἔργα τὰ καλά
  choice: መልካም ሥራዎች
  rationale: የἔργαን ተግባራዊ ትርጉምና የκαλάን መልካምነት የሚጠብቅ የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: πρόδηλα
  choice: ግልጽ ናቸው
  rationale: ሥራዎቹ የተገለጡና ሊታወቁ የሚችሉ መሆናቸውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ ἄλλως ἔχοντα
  choice: እንደዚያ ያልሆኑት
  rationale: ከግልጽ መልካም ሥራዎች ጋር ያለውን ንጽጽር ይጠብቃል፤ ግሪኩ በግልጽ ‘ክፉ’ ስለማይል የሥነ ምግባር ትርጉሙን አስቀድሞ አይወስንም።
- source_word: κρυβῆναι οὐ δύνανται
  choice: ሊሰወሩ አይችሉም
  rationale: የአለመቻልን ኃይል በቀጥታ ያስተላልፋል፤ አሁን ግልጽ ያልሆኑ ሥራዎችም በመጨረሻ ተሰውረው እንደማይቀሩ ከአውዱ ይገባል።
theological_decisions:
- issue: τὰ ἄλλως ἔχοντα በተለይ ክፉ ሥራዎችን ወይስ ገና ግልጽ ያልሆኑ ሥራዎችን ያመለክታል?
  choice: በሰፊው ‘እንደዚያ ያልሆኑት’ ተብሎ ተተርጉሟል።
  alternative: ‘ክፉ ሥራዎች’ ተብሎ በግልጽ መተርጎም።
  rationale: ግሪኩ ‘ክፉ’ የሚል ቃል አልጨመረም። ከቁጥር 24 በመነሳት ክፉ ሥራዎች ሊታሰቡ ቢችሉም፣ ሰፊውን አገላለጽ መጠበቅ የጽሑፉን አሻሚነት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሥራዎች’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ዓረፍተ ነገሩም የግሪኩን ትይዩ አወቃቀር በተፈጥሯዊ መንገድ ይከተላል።
