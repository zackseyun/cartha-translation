  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: am
  text: በዕድሜ የገፉ ሴቶችን እንደ እናቶች፣ ወጣት ሴቶችንም እንደ እህቶች በፍጹም ንጽሕና[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ንጽሕና’ እዚህ ሰፊ የሥነ ምግባር ንጽሕናን የሚያመለክት ሲሆን፣ በዐውዱ የጾታ ንጽሕናንና ተገቢ ምግባርንም አጥብቆ ያካትታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: በዕድሜ የገፉ ሴቶችን
  rationale: ቃሉ ከνεωτέρας ጋር በዕድሜ የሚደረግን ንጽጽር ያሳያል እንጂ የቤተ ክርስቲያንን ሹመት አያመለክትም። ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽና ክብር ያለው ነው።
- source_word: ὡς
  choice: እንደ
  rationale: የቤተሰብ ግንኙነትን ምሳሌ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μητέρας
  choice: እናቶች
  rationale: የግሪኩን የቤተሰብ ምሳሌ ይጠብቃል፤ በምንጩ የሌለውን ‘የራስህ’ የሚል ባለቤትነት አይጨምርም።
- source_word: νεωτέρας
  choice: ወጣት ሴቶችን
  rationale: በπρεσβυτέρας ተቃራኒ የሆነውን የዕድሜ ልዩነት በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἀδελφὰς
  choice: እህቶች
  rationale: የቀጠለውን የቤተሰብ ምሳሌ በቀጥታ ያስተላልፋል፤ ‘እህቶችህ’ ብሎ በምንጩ የሌለ ቃል አይጨምርም።
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: በፍጹም ንጽሕና
  rationale: πάσῃ የሚያሳየውን ሙሉነት ‘ፍጹም’ ያስተላልፋል፤ ‘ንጽሕና’ ደግሞ አጠቃላይ የሥነ ምግባር ንጽሕናን ሳያጠብ በዐውዱ ያለውን የወሲብ ሥነ ምግባር አንድምታ ይይዛል።
theological_decisions:
- issue: በወጣት ሴቶች ላይ በተሰጠው መመሪያ ውስጥ የἁγνεία ወሰን
  choice: በፍጹም ንጽሕና
  alternative: በፍጹም የጾታ ንጽሕና
  rationale: ἁγνεία ሰፊ የሥነ ምግባር ንጽሕናን ሊያመለክት ሲችል፣ በዚህ ዐውድ የጾታ ንጽሕናንና ተገቢ ምግባርን አጥብቆ ያካትታል። ዋናው ጽሑፍ ቃሉን በጾታዊ ትርጉም ብቻ በመገደብ የምንጩን ስፋት አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ጥቅሱ ከቀደመው ሐረግ ግስ ጋር የሚቀጥል በመሆኑ የምንጩ አጭር ትይዩ አወቃቀር ተጠብቋል።
