  text: እውነተኛ መበለት የሆነችና ብቻዋን የቀረች[a] ግን ተስፋዋን በእግዚአብሔር ላይ ጥላለች[b]፤ ሌሊትና ቀንም በልመናና በጸሎት[c] ትጸናለች።
  philosophy: optimal-equivalence
