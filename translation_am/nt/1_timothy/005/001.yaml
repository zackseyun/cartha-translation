  text: በዕድሜ የገፋውን ወንድ[a] አትገሥጸው፤ ይልቁንም እንደ አባትህ ተመልክተህ ምከረው፤ ወጣት ወንዶችንም እንደ ወንድሞችህ ተመልክተህ ምከራቸው።
