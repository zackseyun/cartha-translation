lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: በዕድሜ የገፋውን ወንድ
  rationale: ቃሉ እዚህ በስም ፈንታ የገባ ቅጽል ሲሆን፣ በዚሁ ቁጥር ካለው νεωτέρους (‘ወጣት ወንዶች’) ጋር ያለው ንጽጽር የዕድሜ ትርጉሙን ይደግፋል።
- source_word: μὴ ἐπιπλήξῃς
  choice: አትገሥጸው
  rationale: ἐπιπλήσσω በቃል መውቀስን ወይም መገሠጽን ያመለክታል፤ ‘መገሠጽ’ በአማርኛ አጭር፣ ግልጽና ክብር ያለው አቻ ነው።
- source_word: ἀλλὰ παρακάλει
  choice: ይልቁንም … ለምነው
  rationale: παρακαλέω መለመን፣ መምከር፣ ማበረታታት ወይም አጥብቆ መጠየቅን ሊያመለክት ይችላል። ከገሠጻ ጋር በተደረገው ንጽጽርና በቤተሰባዊው ምሳሌ ውስጥ ‘ለምነው’ አክብሮታዊውን አቀራረብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὡς πατέρα
  choice: እንደ አባት
  rationale: ὡς ንጽጽርን ያስገባል፤ ‘እንደ አባት’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: νεωτέρους
  choice: ወጣት ወንዶችን
  rationale: በስም ፈንታ የገባው የወንድ ፆታ ብዙ ቁጥር ቅጽል፣ በሚከተለው ἀδελφούς እና በቀጣዩ ቁጥር በተለይ ከተጠቀሱት ሴቶች አንጻር፣ ‘ወጣት ወንዶች’ ተብሎ መተርጎሙ የፆታውን ልዩነት ይጠብቃል።
- source_word: ὡς ἀδελφούς
  choice: እንደ ወንድሞች
  rationale: እዚህ ἀδελφούς በዕድሜና በፆታ በተከፋፈሉ ቡድኖች ውስጥ የወንድ ፆታን በተለይ ስለሚያመለክት ‘ወንድሞች’ የሚለው ትክክለኛ ነው።
theological_decisions:
- issue: Πρεσβυτέρῳ የቤተ ክርስቲያንን ሹመት (‘ሽማግሌ’) ወይስ በዕድሜ የገፋን ወንድ ያመለክታል?
  choice: የዕድሜ ትርጉም፦ ‘በዕድሜ የገፋ ወንድ’
  alternative: ‘ሽማግሌ’
  rationale: ቁጥሩና የሚቀጥለው ቁጥር በዕድሜና በፆታ የተደራጁ ቤተሰባዊ ንጽጽሮችን ያቀርባሉ፦ በዕድሜ የገፋ ወንድ/አባት፣ ወጣት ወንዶች/ወንድሞች፣ በዕድሜ የገፉ ሴቶች/እናቶች፣ ወጣት ሴቶች/እህቶች። ስለዚህ የዕድሜ ትርጉሙ ይበልጥ የተገባ ነው፤ ሌላው ትርጉም ግን በማስታወሻ ተጠብቋል።
- issue: ἀδελφούς ሁሉን አቀፍ በሆነ አገላለጽ መተርጎም ይገባል?
  choice: ‘ወንድሞች’
  alternative: ‘ወንድሞችና እህቶች’
  rationale: በዚህ አውድ የወንድ ፆታ ብዙ ቁጥር አጠቃላይ ሳይሆን፣ በፆታ ከተለዩት የምክር ቡድኖች አንዱ ነው፤ ስለዚህ ‘ወንድሞች’ የምንጩን ልዩነት ይጠብቃል።
