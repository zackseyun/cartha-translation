  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: am
  text: በእግዚአብሔር፣ በመሲሑ በኢየሱስና በተመረጡት መላእክት[a] ፊት አጥብቄ አዝዝሃለሁ፤ እነዚህን ነገሮች ያለ ቅድመ ፍርድ ጠብቅ፤ በአድልዎም ምንም አታድርግ[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምርጦቹ መላእክት።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ለአንዱ ወገን በማድላት ምንም አታድርግ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: አጥብቄ አዝሃለሁ
  rationale: በምክር ደብዳቤ ውስጥ ያለውን የከበደ ማሳሰቢያና ትእዛዝ ያስተላልፋል፤ ተራ ምስክርነት ብቻ አይደለም።
- source_word: ἐνώπιον
  choice: በ…ፊት
  rationale: መለኮታዊ ምስክሮች ፊት የሚሰጥ ከባድ ትእዛዝን በተፈጥሯዊና በክቡር አማርኛ ይገልጣል።
- source_word: Χριστοῦ Ἰησοῦ
  choice: በመሲሑ በኢየሱስ
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ይዞ ስለሚታይ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የአማርኛ ሰዋስውን ለማጥራት ሁለቱም ስሞች የመሣሪያ/ማጣቀሻ ቅጥያ ተቀብለዋል።
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: በተመረጡት መላእክት
  rationale: ἐκλεκτός የመመረጥን ቀጥተኛ ትርጉም ያስቀምጣል፤ አገላለጹ መላእክቱ የተመረጡ መሆናቸውን እንጂ ሌላ የእምነት ሥርዓት አያስገባም።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: ወደ ቀደሙት መመሪያዎች የሚያመለክተውን ሰፊ የጠቋሚ ቃሉን ሳያጠብ ይጠብቃል።
- source_word: φυλάξῃς
  choice: ጠብቅ
  rationale: በታማኝነት መጠበቅንና መፈጸምን የሚያካትት አጭርና የተለመደ አማርኛ ነው።
- source_word: χωρὶς προκρίματος
  choice: አስቀድመህ ሳትፈርድ
  rationale: πρόκριμα ጉዳዩን በሚገባ ከመመርመር በፊት የሚደረግን ፍርድ ያመለክታል። ይህ አገላለጽ ከቀጣዩ πρόσκλισις ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: በአድልዎም ምንም አታድርግ
  rationale: የግሪኩ አሳታፊ ግስ በተፈጥሯዊ የአማርኛ ትእዛዝ ተገልጧል፤ πρόσκλισις ወደ አንድ ወገን ማዘንበልን ወይም ወገንተኝነትን ያመለክታል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: በዚህ ክቡር ጥሪ ውስጥ Χριστός የቅቡዕነት ማዕረጉን ስለሚይዝ ‘መሲሕ’ የትርጉም ይዘቱን በግልጽ ያቀርባል፤ የተለመደው ‘ክርስቶስ’ ግን ትክክለኛ የተቀበለ አማራጭ ነው።
- issue: የἐκλεκτῶν ἀγγέλων ትርጉም
  choice: የተመረጡት መላእክት
  alternative: ምርጦቹ መላእክት
  rationale: ቀጥተኛው አገላለጽ መላእክቱ ከሌሎች እንዴት እንደሚለዩ ሳይወስን የግሪኩን እውነተኛ ግልጽ ያልሆነ ገጽታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ከባድ የምስክር-ፊት ትእዛዝ ተጠብቋል፤ πρόκριμα እና πρόσκλισις የሚያመለክቱት ቅድመ ፍርድና አድልዎ በተለያዩ አገላለጾች ተለይተዋል።
