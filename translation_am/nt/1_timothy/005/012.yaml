  text: ἔχουσαι κρίμα ὅτι τὴν πρώτην πίστιν ἠθέτησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/012.yaml
  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: am
  text: የቀድሞ እምነታቸውን[a] ወደ ጎን ስላደረጉ፣ ፍርድ ያለባቸው ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመጀመሪያ የገቡትን ቃል ኪዳን” ወይም “የቀድሞ ቁርጠኝነታቸውን።” የግሪኩ ቃል “እምነት” ማለት ሊሆን ይችላል፤ በዚህ አውድ ግን አንዳንዶች መበለቶች በዝርዝር ከመመዝገባቸው ጋር የተያያዘ ቀዳሚ ቃል ኪዳን ወይም ግዴታ እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: ይደርስባቸዋል
  rationale: ቃሉ በቀጥታ ‘ያላቸው’ ማለት ቢሆንም፣ ከ κρίμα ጋር ሲጣመር በፍርድ ሥር መውደቅን ያመለክታል፤ ‘ፍርድ ይደርስባቸዋል’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: κρίμα
  choice: ፍርድ
  rationale: ‘ፍርድ’ የፍርድ ውሳኔን ወይም ኩነኔን ሊያመለክት የሚችለውን ሰፊ ትርጉም ይጠብቃል፤ ጥቅሱ ያልገለጸውን ዘላለማዊ ኩነኔ አይወስንም።
- source_word: ὅτι
  choice: ስላደረጉ
  rationale: ምክንያትን የሚያስገባው ὅτι በአማርኛው ‘ስለ-’ በሚለው ምክንያታዊ አገባብ ተተርጉሟል።
- source_word: τὴν πρώτην πίστιν
  choice: የቀድሞውን እምነታቸውን
  rationale: πρώτην እዚህ ጊዜያዊ ቅድሚያን ስለሚያመለክት ‘የቀድሞውን’ ተብሏል። πίστις በዋናው ጽሑፍ ‘እምነት’ ተብሎ ተጠብቋል፤ ‘ቃል ኪዳን/ቃል መግባት’ የሚለው አውዳዊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἠθέτησαν
  choice: ወደ ጎን ስላደረጉ
  rationale: ἀθετέω መተውን፣ አለመቀበልን ወይም ዋጋ ማሳጣትን ሊያመለክት ይችላል። ‘ወደ ጎን ማድረግ’ ያለፈውን እምነት ወይም ግዴታ መተዋቸውን ያሳያል፣ ነገር ግን ከአውዱ በላይ ቴክኒካዊ ፍቺ አይጭንም።
theological_decisions:
- issue: በአውዱ ውስጥ τὴν πρώτην πίστιν የሚለው ሐረግ ትርጉም
  choice: የቀድሞውን እምነታቸውን
  alternative: መጀመሪያ የገቡትን ቃል ኪዳን፤ የቀድሞውን ቁርጠኝነታቸውን
  rationale: πίστις በተለምዶ ‘እምነት’ ማለት ነው፤ ስለዚህ ይህ በዋናው ጽሑፍ ተጠብቋል። ሆኖም በዚህ አውድ ቃሉ መበለቶች በዝርዝር ሲመዘገቡ ከገቡት ቀዳሚ ቃል ወይም ግዴታ ጋር እንደሚዛመድ የሚረዱ አሉ። ግሪኩ ያለው አሻሚነት በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምክንያታዊ አገናኝ ተጠብቋል፤ የ πίστις አሻሚነት ዋናውን ንባብ ሳይቀይር በማስታወሻ ቀርቧል።
