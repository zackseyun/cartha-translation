review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys κρίμα, the causal force of ὅτι, and ἀθετέω, and it appropriately preserves the debated sense of τὴν πρώτην πίστιν in a footnote. However, «ይደርስባቸዋል» introduces an explicit future event not expressed by the present participle ἔχουσαι (“having/incurring”).
  naturalness: The wording is generally clear and suitably formal. «የቀድሞ እምነታቸውን» is more idiomatic than «የቀድሞውን እምነታቸውን», and «ፍርድ ያለባቸው ናቸው» naturally expresses the Greek idiom without a future shift.
  terminology: «እምነት» and «ፍርድ» are appropriate. The alternative «ቃል ኪዳን» / «ቁርጠኝነት» properly remains footnoted rather than being imposed in the text.
  issues:
  - severity: medium
    issue: Explicit future tense in «ፍርድ ይደርስባቸዋል»
    rationale: ἔχουσαι is a present participle and, with κρίμα, denotes having or incurring judgment. A future construction adds temporal force not stated in the Greek.
  - severity: low
    issue: Slightly unnatural possessive phrasing
    rationale: For “their former faith,” «የቀድሞ እምነታቸውን» is smoother modern standard Amharic than «የቀድሞውን እምነታቸውን».
