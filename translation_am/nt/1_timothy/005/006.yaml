review_pass:
  verdict: revise
  source_fidelity: The contrast marked by δέ, the ongoing self-indulgent manner of life in σπαταλῶσα, and the deliberate paradox between ζῶσα and τέθνηκεν are retained. However, ሞታለች more directly and idiomatically represents the Greek perfect τέθνηκεν than የሞተች ናት.
  naturalness: The revised wording is concise, natural modern standard Amharic, and preserves the forceful paradox, ‘alive yet dead.’
  terminology: ተድላ suitably conveys pleasure-oriented, self-indulgent living in this context. The revised footnote gives a natural Amharic alternative for the lexical sense without the awkward reflexive construction in the draft.
  issues:
  - severity: low
    issue: The rendering of τέθνηκεν as የሞተች ናት is less direct than an Amharic perfect verb.
    rationale: Although understandable, it is adjectival/periphrastic. ሞታለች naturally expresses a completed death with a present resultant state and strengthens the intended paradox with በሕይወት ሳለች.
  - severity: low
    issue: The footnote alternative ራሷን በተድላ የምታኖር is unnatural.
    rationale: One does not naturally ‘live oneself in pleasure’ in Amharic. ራሷን ለተድላ የምትሰጥ clearly conveys ‘is self-indulgent.’
  revised_text: ነገር ግን ለተድላ የምትኖር ሴት፣ በሕይወት ሳለች ሞታለች።[a]
  revised_footnotes:
