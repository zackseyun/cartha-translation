  revision_rationale: The revision replaces the periphrastic የሞተች ናት with the natural perfect ሞታለች, preserving the Greek perfect’s resultant-state force. It also makes the lexical-alternative footnote idiomatic. The feminine noun remains appropriate in the immediate widow context and makes the substantival feminine participle explicit for Amharic readers.
