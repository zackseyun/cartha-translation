  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: am
  text: ነገር ግን ለተድላ የምትኖር ሴት፣ በሕይወት ሳለች ሞታለች።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ራሷን ለተድላ የምትሰጥ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: ለተድላ የምትኖር
  rationale: ቃሉ በቅንጦትና በራስ ደስታ ላይ ያተኮረ ቀጣይ የኑሮ ዘይቤን ያመለክታል፤ «ለተድላ የምትኖር» ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ζῶσα
  choice: በሕይወት ሳለች
  rationale: ይህ አባባል ከተከታዩ ፍጹም ግስ ጋር ጊዜያዊና ተቃርኗዊ ግንኙነት አለው፤ «በሕይወት ሳለች» የአካላዊ ሕይወትንና የሞትን ምሳሌያዊ ሁኔታ ንፅፅር ግልጽ ያደርጋል።
- source_word: τέθνηκεν
  choice: የሞተች ናት
  rationale: የግሪክኛው ፍጹም ጊዜ ከሞት የተነሣ አሁንም የሚቀጥል ሁኔታን ያጎላል፤ «የሞተች ናት» ይህን ውጤታዊ ሁኔታ ያስጠብቃል።
- source_word: ἡ ... σπαταλῶσα
  choice: ለተድላ የምትኖር ሴት
  rationale: የዐንቀጽና የተሳቢ ግስ ጥምረቱ በሴት ነጠላ ጾታ ስማዊ ሆኖ ያገለግላል፤ «ሴት» ማለት የሰዋሰውን ጾታና የአውዱን ማጣቀሻ ሳያሰፋ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው በእግዚአብሔር ተስፋ ከምታደርገው መበለት ገለጻ ጋር ያለውን ተቃርኖ በግልጽ ያመለክታል።
theological_decisions:
- issue: በሕይወት ሳለች «የሞተች» መሆኗ
  choice: የሞትን ምሳሌያዊ ቃል ሳይፈታ ማቆየት
  alternative: «በመንፈስ የሞተች» ወይም «በሥነ ምግባር የሞተች» ብሎ መግለጽ
  rationale: ጽሑፉ አካላዊ ሕይወትን ከምሳሌያዊ ሞት ጋር በማነጻጸር ሆን ብሎ የተፈጠረ ተቃርኖ ይዟል። ትርጉሙ «መንፈሳዊ» ወይም «ሥነ ምግባራዊ» በማለት ከጽሑፉ በላይ ሳይወስን ይህን ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ተድላ» የደስታ ፍለጋንና ራስን የማስደሰት ኑሮን ያሳያል፤ የጽሑፉ አጭርነትና ተቃርኗዊ ኃይልም ተጠብቀዋል።
