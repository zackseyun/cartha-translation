  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: am
  text: ከእነርሱም መካከል ሄሜኔዎስና እስክንድር ይገኛሉ፤ እነርሱንም እንዳይሳደቡ በተግሣጽ እንዲማሩ ለሰይጣን አሳልፌ ሰጥቻቸዋለሁ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለሰይጣን አሳልፌ ሰጥቻቸዋለሁ” የሚለው አገላለጽ “ለሰይጣን አስረክቤያቸዋለሁ” ተብሎም ሊተረጎም ይችላል። ሐረጉ ከመጨረሻ ኩነኔ ይልቅ ለማረም የታሰበ ከባድ ተግሣጽን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “በተግሣጽ እንዲማሩ” የሚለው “እንዲማሩ፣” “እንዲሠለጥኑ፣” ወይም “እንዲታረሙ” ተብሎም ሊተረጎም ይችላል፤ የግሪክኛው ቃል የማረም ዓላማ ያለውን ትምህርት ያካትታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: ከእነርሱም መካከል … ይገኙበታል
  rationale: የአካልነት ወይም የከፊልነት ግንኙነቱን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: ሄሜኔዎስና እስክንድር
  rationale: ሄሜኔዎስ ከግሪክኛው የተቀራረበ የፊደል ግልባጭ ነው፤ እስክንድር ደግሞ በአማርኛ የተለመደው የἈλέξανδρος ስም ቅርጽ ነው።
- source_word: παρέδωκα
  choice: አሳልፌ ሰጥቻቸዋለሁ
  rationale: የπαραδίδωμιን ጠንካራ የማስረከብ ሐሳብ ይጠብቃል፤ በዐውዱ ያለውን የድርጊቱን ቀጣይ ውጤትም ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: τῷ Σατανᾷ
  choice: ለሰይጣን
  rationale: በአማርኛ አዲስ ኪዳን አጠቃቀም የተለመደውን የግል መጠሪያ ይጠቀማል።
- source_word: ἵνα παιδευθῶσι
  choice: በተግሣጽ እንዲማሩ
  rationale: παιδεύω የማስተማርንና የማረምን ሁለቱንም ገጽታዎች ይይዛል፤ ይህ አገላለጽ ቅጣትን ከልክ በላይ ሳያጎላ በማረሚያ ሥነ ሥርዓት መማርን ያስተላልፋል።
- source_word: μὴ βλασφημεῖν
  choice: እንዳይሳደቡ
  rationale: βλασφημέω የስድብንና የክፉ ንግግርን ከባድነት ይጠብቃል፤ የተሳዳቢውን ዒላማ ግን ግሪክኛው በዚህ ሐረግ ስላልገለጠ ትርጉሙም አይጨምርም።
theological_decisions:
- issue: “ለሰይጣን አሳልፌ ሰጥቻቸዋለሁ” የሚለው ሐረግ ትርጉም
  choice: ሐረጉን በቀጥታ ማቆየት፣ ዓላማው ግን ማረምና ማስተማር መሆኑን በዓላማ ሐረጉ ማሳየት
  alternative: የአካል ሥቃይ ተአምራዊ ቅጣት ብቻ ወይም የመጨረሻ ፍርድ እንደሆነ መተርጎም
  rationale: ἵνα παιδευθῶσι የተግሣጹ ዓላማ ማረምና ማስተማር መሆኑን ያመለክታል፤ ጽሑፉ ግን የድርጊቱን ትክክለኛ ሥነ ሥርዓታዊ መንገድ አይገልጥም።
- issue: βλασφημεῖν የስድቡ ዒላማ
  choice: ዒላማውን ሳይጨምር “እንዳይሳደቡ” ብሎ መተርጎም
  alternative: “እግዚአብሔርን/እምነቱን እንዳይሳደቡ” ብሎ መግለጽ
  rationale: ዐውዱ መለኮታዊ ወይም እምነታዊ ስድብን ሊጠቁም ቢችልም፣ ቀጥተኛው የግሪክኛ ሐረግ ተሳዳቢውን ዒላማ በግልጽ አይሰይምም።
