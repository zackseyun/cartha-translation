translation:
  language: am
  text: በፆታ ብልግና ለሚሳተፉ፣ ከወንዶች ጋር የግብረ ሥጋ ግንኙነት ለሚፈጽሙ ወንዶች፣[a] ሰዎችን ለባርነት ለሚነግዱ፣ ለሐሰተኞች፣ በሐሰት ለሚምሉ፣ እንዲሁም ለጤናማ ትምህርት ለሚቃወም ማንኛውም ሌላ ነገር፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከወንድ ጋር የሚተኙ ወንዶች።» ἀρσενοκοῖται የሚለው የግሪክ ቃል ብርቅ ሲሆን ትክክለኛ ወሰኑ አከራካሪ ነው፤ ሆኖም የወንድና ወንድ የፆታ ድርጊትን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: ዝሙት ለሚፈጽሙ
  rationale: ቃሉ በሰፊው የፆታ ብልግናን የሚፈጽሙ ሰዎችን ያመለክታል፤ «ዝሙት ለሚፈጽሙ» በዘመናዊ አማርኛ ግልጽ ሲሆን ትርጉሙን በአንድ የፆታ ጥፋት ዓይነት ብቻ አይገድብም።
- source_word: ἀρσενοκοίταις
  choice: ከወንዶች ጋር የግብረ ሥጋ ግንኙነት ለሚፈጽሙ ወንዶች
  rationale: ብርቅና አከራካሪ የሆነው የግሪክ ቃል ወንድንና የወሲብ መኝታን የሚያመለክቱ ቃላትን ያጣምራል። ይህ አተረጓጎም የወንድና ወንድ የፆታ ድርጊትን ያሳያል፤ ዘመናዊ የማንነት ምድብን ግን ወደ ጽሑፉ አያስገባም።
- source_word: ἀνδραποδισταῖς
  choice: ሰዎችን አፍነው በባርነት ለሚሸጡ
  rationale: ቃሉ ሰዎችን በግድ ይዘው ለባርነት የሚያቀርቡ ወይም የሚነግዱባቸውን ያመለክታል። ሙሉ ሐረጉ ከተራ አፋኝነት ይልቅ ከባርነት ንግድ ጋር ያለውን ግንኙነት ግልጽ ያደርጋል።
- source_word: ψεύσταις
  choice: ለሐሰተኞች
  rationale: ቀጥተኛ፣ ተፈጥሯዊና በዘመናዊ አማርኛ የተለመደ አቻ ቃል ነው።
- source_word: ἐπιόρκοις
  choice: በሐሰት ለሚምሉ
  rationale: መሐላን በሐሰት የሚፈጽሙትን በግልጽና ተደራሽ አማርኛ ያሳያል።
- source_word: καὶ εἴ τι ἕτερον
  choice: እንዲሁም ... ለሌላ ማናቸውም ነገር
  rationale: ዝርዝሩን ወደ ሌሎች ተመሳሳይ ነገሮች የሚያሰፋውን ክፍት ትርጉም ይጠብቃል።
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ጤናማውን ትምህርት
  rationale: ὑγιαίνω ያለውን የጤንነት ዘይቤ ይጠብቃል፤ «ትምህርት»ም ከከባድ ሃይማኖታዊ ቴክኒካዊ ቃል ይልቅ ለአጠቃላይ አንባቢ ተደራሽ ነው።
- source_word: ἀντίκειται
  choice: ለሚቃወም
  rationale: ከትምህርቱ ጋር የሚጋጭ ወይም በተቃራኒው የሚቆም መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: አከራካሪውን ἀρσενοκοίταις መተርጎም
