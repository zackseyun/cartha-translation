base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: am
  text: በእምነት እውነተኛ ልጄ ለሆንከው ለጢሞቴዎስ[a]፤ ከእግዚአብሔር አብና ከመሲሕ[b] ኢየሱስ ጌታችን ጸጋ፣ ምሕረትና ሰላም ይሁንልህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በእምነት እውነተኛ ልጄ።”
    reason: lexical_alternative
  - marker: b
    text: ባህላዊ አተረጓጎም፦ “ክርስቶስ ኢየሱስ።”
    reason: alternative_rendering
lexical_decisions:
- source_word: γνησίῳ
  choice: እውነተኛ
  rationale: የጳውሎስና የጢሞቴዎስን እውነተኛ መንፈሳዊ ዝምድና ያሳያል፤ የሥጋ ዘር መሆንን አያመለክትም።
- source_word: τέκνῳ
  choice: ልጄ
  rationale: τέκνον በጾታ ያልተወሰነውን ‘ልጅ’ ያመለክታል፤ እዚህ የመንፈሳዊ ወላጅነት ዘይቤውን ይጠብቃል።
- source_word: ἐν πίστει
  choice: በእምነት
  rationale: የጋራ እምነትን ወይም እምነት የሆነበትን ሕይወት ሊያመለክት የሚችለውን ሰፊ አገላለጽ ሳያጠብ ያቆያል።
- source_word: χάρις
  choice: ጸጋ
  rationale: የጳውሎስን የሰላምታ ቃል ትርጉምና መጽሐፍ ቅዱሳዊ ክብደት የሚጠብቅ የተለመደ አቻ ነው።
- source_word: ἔλεος
  choice: ምሕረት
  rationale: የግሪኩን ቃል ቀጥተኛ ትርጉምና የሰላምታውን ሦስትዮሽ አወቃቀር ይጠብቃል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: ቀጥተኛ፣ ተፈጥሯዊና የተለመደ የአማርኛ አቻ ነው።
- source_word: θεοῦ πατρὸς
  choice: እግዚአብሔር አብ
  rationale: የግሪኩን ጥምረት በአማርኛ በተለመደና በክብር ባለው አገላለጽ ያቀርባል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός እዚህ ከኢየሱስ ስም ጋር የተጣመረ የማዕረግ ስም ስለሆነ ‘መሲሕ’ ተብሎ ተተርጉሟል።
- source_word: κυρίου
  choice: ጌታችን
  rationale: የκύριοςን ትርጉምና ከἡμῶν ጋር ያለውን የአንደኛ መደብ ብዙ ቁጥር ባለቤትነት ይጠብቃል።
theological_decisions:
- issue: የΧριστοῦ Ἰησοῦ አተረጓጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ሐረግ የማዕረግ ኃይሉን እንደያዘ በመቁጠር ትርጉሙ ‘መሲሕ’ ተመርጧል፤ ባህላዊው የድምፅ ቅጂ ግን በማስታወሻ ቀርቧል።
- issue: የἐν πίστει ኃይል
  choice: በእምነት
  alternative: በእምነቱ
  rationale: ያለ ወሳኝ መስተዋድድ የቀረበውን ግሪክ በመከተል፣ ሐረጉ የጢሞቴዎስን ማመን ወይም የጋራውን ክርስቲያናዊ እምነት ሊያመለክት የሚችለውን ውጥረት ሳይፈታ ተቀምጧል።
