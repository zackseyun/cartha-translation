source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: am
  text: ነገር ግን የጌታችን ጸጋ፣ በመሲሑ ኢየሱስ ያሉት እምነትና ፍቅር ጋር፣ እጅግ በዛ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: እጅግ በዛ
  rationale: የግሱን ከመጠን በላይ የመብዛት አጽንዖት በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የኃጢአትና የአለማመን ገለጻ ጋር ያለውን ንጽጽር ያሳያል።
- source_word: χάρις
  choice: ጸጋ
  rationale: ለመለኮታዊ ሞገስና በጎ ስጦታ የተለመደውና ተገቢው የአማርኛ ቃል ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: የκύριοςን ማዕረግ በተለመደ የአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም ይጠብቃል።
- source_word: μετὰ
  choice: ከ…ጋር
  rationale: ጸጋው ከእምነትና ከፍቅር ጋር እንደበዛ የሚያሳየውን የግሪኩን ሰዋስዋዊ ግንኙነት ይጠብቃል።
- source_word: πίστεως
  choice: እምነት
  rationale: በዚህ አውድ πίστιςን በቀጥታና በተለመደ መንገድ ይተረጉማል።
- source_word: ἀγάπης
  choice: ፍቅር
  rationale: የἀγάπη ተፈጥሯዊና መደበኛ የአማርኛ አቻ ነው።
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ ካሉት
  rationale: የተወሰነው ሐረግ እምነትንና ፍቅርን በአንድነት እንደሚገልጽ በብዙ ቁጥር ያሳያል፤ Χριστόςንም እንደ ማዕረግ ‘መሲሕ’ ብሎ ያቀርባል።
theological_decisions:
- issue: ‘ከእምነትና ከፍቅር ጋር’ ከጸጋ ጋር ያለው ግንኙነት
  choice: ጸጋው በመሲሑ ኢየሱስ ካሉት እምነትና ፍቅር ጋር እንደበዛ ተተርጉሟል።
  alternative: እምነትና ፍቅር በጸጋ የተፈጠሩ ባሕርያት ናቸው ብሎ በግልጽ መተርጎም።
  rationale: የግሪኩ አገባብ μετὰ πίστεως καὶ ἀγάπηςን ከበዛው ጸጋ ጋር ያያይዛል፤ ትርጉሙ ምክንያታዊ ግንኙነትን ሳይጨምር ይህን ያቆያል።
- issue: Χριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የተቀባውን ንጉሥ የሚያመለክተውን የማዕረግ ትርጉሙን ይዞ ስለሚታይ ‘መሲሕ’ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አማርኛ አንባቢ ግልጽ የሆነ አገላለጽ። ‘እጅግ በዛ’ የግሪኩን አጽንዖት ያቆያል፤ ሐረጉ ለግልጽነት በነጠላ ሰረዞች ተለይቷል።
