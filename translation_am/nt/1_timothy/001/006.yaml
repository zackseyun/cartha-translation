  text: አንዳንዶች ከእነዚህ ስተው[a] ወደ ከንቱ ንግግር[b] ፈቀቅ አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ከእነዚህ ፈቀቅ ብለው።’ ግሱ ዒላማን መሳትን ወይም ከእርሱ መራቅን ሊያመለክት ይችላል።
    reason: lexical_alternative
