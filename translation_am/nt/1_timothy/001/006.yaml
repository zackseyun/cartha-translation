lexical_decisions:
- source_word: ὧν
  choice: እነዚህን
  rationale: የዝምድና ተውላጠ ስሙ በቁጥር 5 ወደተጠቀሱት ነገሮች ወደኋላ ያመለክታል፤ በአማርኛ ‘እነዚህን’ ማለት ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: τινες
  choice: አንዳንዶች
  rationale: ያልተወሰኑ ጥቂት ሰዎችን ያመለክታል፤ ‘አንዳንዶች’ የግሪኩን አለመወሰን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀστοχήσαντες
  choice: ሳቱና
  rationale: ግሱ ዒላማን መሳት ወይም ከታሰበው መንገድ መውጣትን ያመለክታል፤ ‘ሳቱ’ ይህን ምሳሌያዊና አውዳዊ ኃይል በአጭሩ ይይዛል።
- source_word: ἐξετράπησαν
  choice: ፈቀቅ አሉ
  rationale: ከትክክለኛው አቅጣጫ መዞርን የሚገልጸውን የእንቅስቃሴ ምስል ይጠብቃል፤ በዚህ ዐውድ ‘ፈቀቅ አሉ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: εἰς
  choice: ወደ
  rationale: ወደ አንድ ሁኔታ ወይም ተግባር የሚደረግን እንቅስቃሴና ውጤት ያመለክታል።
- source_word: ματαιολογίαν
  choice: ከንቱ ንግግር
  rationale: ፍሬ ቢስ፣ ባዶና ጥቅም የሌለውን ንግግር ያመለክታል፤ ‘ከንቱ ንግግር’ የተከበረ፣ ግልጽና ዘመናዊ አገላለጽ ነው።
theological_decisions:
- issue: የὧν ማጣቀሻ
  choice: በቁጥር 5 የተጠቀሱትን ሥነ ምግባራዊና መንፈሳዊ ዓላማዎች በአጠቃላይ ‘እነዚህን’ ብሎ ማመልከት
  alternative: ማጣቀሻውን ‘ንጹሕ ልብ፣ በጎ ሕሊናና ግብዝነት የሌለበት እምነት’ በሚለው ሦስትዮሽ ብቻ ላይ ማጥበብ፣ ወይም በቃል ቅርብ ‘ከእነዚህ’ ማለት
  rationale: ሰዋሰዋዊ አወቃቀሩ በቀደመው ቁጥር ላይ ይደገፋል። ‘እነዚህን’ የኋላ ማጣቀሻውን ግልጽ ሲያደርግ ከዐውዱ በላይ ትርጉሙን አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሳቱ’ እና ‘ፈቀቅ አሉ’ የሁለቱን የግሪክ ግሶች የተለያየ ምስላዊ ኃይል ይጠብቃሉ፤ የጊዜ አመልካች ረዳት ግስ ሳይጨመር የግሪኩ ቀዳሚ ድርጊትና ዋና ድርጊት በ‘-ና’ ተያይዘዋል።
