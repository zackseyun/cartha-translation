  choice: መሲሑ ኢየሱስን በቀጥታ “ተስፋችን” ብሎ የሚገልጽ አፖዚሽናዊ ንባብ
  alternative: “ተስፋችን የሆነው መሲሑ ኢየሱስ” የሚል የተስፋፋ ንባብ
  rationale: የግሪኩን አጭርና ጠንካራ መለያ ሳይፈታ መሲሑ ኢየሱስ ራሱ ተስፋችን መሆኑን ይጠብቃል።
- issue: καὶ የሚያገናኛቸው አካላት
  choice: ትእዛዙ ከእግዚአብሔርና ከመሲሑ ኢየሱስ የመጣ እንደሆነ ማንበብ
  alternative: “የእግዚአብሔር ትእዛዝ” እና “የመሲሑ ኢየሱስ ሐዋርያ” ብሎ ማገናኘት
  rationale: በቅርብ ያሉትን ሁለት የዝርያ ሐረጎች θεοῦ… καὶ Χριστοῦ… ከἐπιταγήν ጋር ማያያዝ ቀጥተኛው ንባብ ነው፤ ሌላው ሰዋስዋዊ አማራጭ በማስታወሻ ተጠብቋል።
