  alternative: ክርስቶስ
  rationale: በዚህ አውድ ቃሉ የኢየሱስን የቅቡዕነት ማዕረግ እንደሚያሳይ ተወስዷል፤ ስም መሰል አጠቃቀሙ ግን በማስታወሻ ተጠብቋል።
