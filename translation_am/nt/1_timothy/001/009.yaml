  choice: ይህን እያወቅን
  rationale: የግሪኩን የአሁን ጊዜ አሳታፊ ቅርጽና ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ትስስር ይጠብቃል፤ በዐውዱ ጳውሎስንና ጢሞቴዎስን የሚያካትት አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: δικαίῳ
  choice: ለጻድቅ ሰው
  rationale: ነጠላውንና ወኪላዊውን አገላለጽ በግልጽ ዘመናዊ አማርኛ ያቆያል።
- source_word: νόμος οὐ κεῖται
  choice: ሕግ የተደነገገው ... ሳይሆን
  rationale: κεῖται በዚህ ሕጋዊ ዐውድ ያለውን ‘መቀመጥ፣ መደንገግ’ ሐሳብ ይገልጣል፤ ‘አይመለከትም’ ከሚለው ይልቅ ትርጓሜን አያሰፋም።
- source_word: ἀνόμοις
  choice: ሕግ ለሌላቸው
  rationale: የሕግ ገደብን እንደማይቀበሉ የሚያመለክተውን የቃሉን የሥነ ምግባርና የሕግ ኃይል ይጠብቃል።
- source_word: ἀνυποτάκτοις
  choice: ለዓመፀኞች
  rationale: ለሥልጣን ለመገዛት አለመፈለግን በተለመደና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: ἀσεβέσι
  choice: እግዚአብሔርን ለማያከብሩ
  rationale: የቃሉን እግዚአብሔርን ያለመፍራትና ያለማክበር ትርጉም ለዘመናዊ አንባቢ በግልጽ ያቀርባል።
- source_word: ἁμαρτωλοῖς
  choice: ለኃጢአተኞች
  rationale: መደበኛውንና ቀጥተኛውን የአማርኛ አቻ ይጠቀማል።
- source_word: ἀνοσίοις
  choice: ቅዱስ ላልሆኑ
  rationale: ቅድስና የጎደላቸውን የሚያመለክተውን ሐሳብ ይጠብቃል።
- source_word: βεβήλοις
  choice: ቅዱሱን ለሚያረክሱ
  rationale: ቅዱስ የሆነውን እንደ ተራ ወይም እንደ ርኩስ የመቁጠርን ሐሳብ ይገልጣል፤ ከἀνοσίοις ያለውንም ልዩነት ያቆያል።
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: አባቶቻቸውን ለሚገድሉና እናቶቻቸውን ለሚገድሉ
  rationale: ብርቅዬዎቹ ቃላት መምታትን ወይም መግደልን ሊያመለክቱ ቢችሉም፣ ከἀνδροφόνοις ጋር ባለው የክፉ ድርጊቶች ዝርዝር ውስጥ ‘መግደል’ የሚለው ትርጉም የበለጠ ይስማማል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀνδροφόνοις
  choice: ለነፍሰ ገዳዮች
  rationale: ሕገ ወጥ ሰው መግደልን የሚገልጥ የተለመደ አማርኛ አቻ ነው።
theological_decisions:
- issue: በδικαίῳ ያለው ነጠላና ወኪላዊ አገላለጽ
  choice: ለጻድቅ ሰው
  alternative: ለጻድቅ፤ ለጻድቅ ሰው ሁሉ
  rationale: የግሪኩን ነጠላ ቅርጽ ይጠብቃል፤ ‘ሰው’ በአማርኛ ሁሉን የሚወክል እንጂ ወንድን ብቻ የሚገድብ አይደለም።
- issue: የπατρολῴαις / μητρολῴαις የትርጉም ስፋት
  choice: አባቶቻቸውን ለሚገድሉና እናቶቻቸውን ለሚገድሉ
  alternative: አባቶቻቸውን ለሚመቱና እናቶቻቸውን ለሚመቱ
  rationale: ዐውዱ ከገዳዮች ጋር ስለሚያያዘው ‘መግደል’ ተመርጧል፤ ነገር ግን የቃላቱ እውነተኛ የትርጉም አሻሚነት በማስታወሻ ተገልጧል።
- issue: ሕግ ለጻድቅ ሰው ያልተደነገገ መሆኑ
  choice: ሕግ የተደነገገው ለጻድቅ ሰው ሳይሆን
  alternative: ሕግ ጻድቅን አይመለከትም
  rationale: ጽሑፉ ስለ ሕጉ መደንገግ የሚናገረውን ብቻ በመጠበቅ፣ ሕጉ ከጻድቅ ጋር ምንም ግንኙነት የለውም የሚል ሰፊ ትርጓሜ አይጨምርም።
