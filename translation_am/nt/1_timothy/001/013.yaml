  source_fidelity: The three former descriptors and the passive statement of mercy are conveyed accurately. However, “ስለፈጸምሁት” supplies an unexpressed object (“it/what I did”), whereas ἐποίησα is objectless here. The revised wording retains the causal force of ὅτι and the concurrent senses of ἀγνοῶν and ἐν ἀπιστίᾳ without adding that object.
