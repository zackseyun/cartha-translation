  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: am
  text: በአደራ የተሰጠኝ የብፁዕ አምላክ የክብር ወንጌል[a] መሠረት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ፈሊጣዊ በሆነ አገላለጽ፣ «የብፁዕ አምላክ ክቡር ወንጌል»።
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: መሠረት
  rationale: κατά ከተሳቢ ጋር ቀደም ሲል ለተነገረው ነገር መለኪያውን ወይም ደንቡን ያመለክታል፤ «… መሠረት» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐαγγέλιον
  choice: ወንጌል
  rationale: በጳውሎሳዊ አገባብ የተለመደውንና የሥነ መለኮት ክብደቱን የሚጠብቀውን ቃል ይይዛል።
- source_word: τῆς δόξης
  choice: የ… ክብር
  rationale: የግሪኩን የዝምድና አወቃቀር በማቆየት ትርጉሙን «ክቡር» ወደሚል ቅጽል አይገድበውም።
- source_word: μακαρίου
  choice: ብፁዕ
  rationale: ስለ አምላክ ሲነገር μακάριος የሚያመለክተውን የተባረከና ፍጹም ደስታ ያለው ሁኔታ በክብር የሚገልጽ የአማርኛ አቻ ነው።
- source_word: θεοῦ
  choice: አምላክ
  rationale: θεόςን በቀጥታና በተለመደ አማርኛ ይተረጉማል።
- source_word: ὃ ἐπιστεύθην ἐγώ
  choice: በአደራ በተሰጠኝ
  rationale: ἐπιστεύθην እዚህ «አመንሁ» ሳይሆን «በአደራ ተሰጠኝ» ማለት ነው፤ የአማርኛው አገላለጽ ወንጌሉ ለጳውሎስ ኃላፊነት ሆኖ መሰጠቱን ያሳያል።
theological_decisions:
- issue: በτὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ ውስጥ ያለው የዝምድና አገባብ
  choice: የብፁዕ አምላክ ክብር ወንጌል
  alternative: የብፁዕ አምላክ ክቡር ወንጌል
  rationale: ዋናው ጽሑፍ «የክብር ወንጌል» የሚለውን የግሪክ አወቃቀር ይጠብቃል፤ የዝምድናውን ትክክለኛ አይነት ሳይወስን ክብሩ የአምላክ መሆኑን ያሳያል። ቅጽላዊውና ይበልጥ ፈሊጣዊው አገላለጽ በማስታወሻ ተጠብቋል።
- issue: የἐπιστεύθην ትርጉም
  choice: በአደራ በተሰጠኝ
  alternative: ያመንሁት
  rationale: በዚህ ተገብሮ ቅርጽና በዐውደ ንባቡ πιστεύω የሚያመለክተው ተልእኮን ወይም ነገርን በአደራ መስጠት ነው፤ «ማመን» የሚለው ትርጉም እዚህ አይስማማም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ብፁዕ» በዕለታዊ ንግግር ያነሰ ቢሆንም ለአምላክ በዚህ አገባብ ትክክለኛና ክብር ያለው ቃል ነው። ከቀዳሚው ቁጥር ጋር ያለውን ሰዋሰዋዊ ትስስር ለማሳየት ዐረፍተ ነገሩ «… መሠረት ነው» ተብሎ ቀርቧል።
