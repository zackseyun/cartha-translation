  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: am
  text: እምነትንና መልካም ሕሊናን ይዘህ ቀጥል፤ አንዳንዶች ግን መልካም ሕሊናን ገፍተው በመተው በእምነት ረገድ መርከብ ሰበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχων
  choice: ይዘህ ቀጥል
  rationale: የአሁን ጊዜው አድራጊ ቅጽ ከቀደመው ትእዛዝ ጋር ተያይዞ የሚቀጥል እርምጃን ያመለክታል፤ ይህ አተረጓጎም እምነትንና ሕሊናን አጥብቆ መያዝን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πίστιν
  choice: እምነትን
  rationale: በዚህ ዐውድ ቃሉ በዋናነት ክርስቲያናዊ እምነትን ያመለክታል፤ ‘መታመን’ የሚለው የትርጉም ገጽታ ቢኖረውም ‘እምነት’ ግልጽና የተለመደ ነው።
- source_word: ἀγαθὴν συνείδησιν
  choice: መልካም ሕሊናን
  rationale: ‘መልካም’ ἀγαθήን በቀጥታ ይወክላል፤ ‘ንጹሕ ሕሊና’ የሚለው ግን ትርጉሙን በጥቂቱ ያጠባል።
- source_word: ἥν
  choice: ይህን
  rationale: የግሪኩ አንስታይ ነጠላ አገናኝ ተውላጠ ስም በቅርብ ያለውን συνείδησιν፣ ‘ሕሊናን’፣ በተፈጥሮ ይመለከታል። አማርኛ ሰዋሰዋዊ ጾታን እዚህ ስለማያሳይ አሻሚነቱ በማስታወሻ ተገልጿል።
- source_word: ἀπωσάμενοι
  choice: ገፍተው በመተዋቸው
  rationale: ግሱ ሆን ብሎ ከራስ ማራቅን የሚያሳይ ጠንካራ ምስል አለው፤ ‘ገፍተው መተው’ ይህን ምስልና የመቃወም ሐሳብ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: περὶ τὴν πίστιν
  choice: በእምነት ረገድ
  rationale: περί ከአኩሳቲቭ ጋር የጥፋቱን መስክ ወይም አንፃር ያመለክታል፤ ‘በ…ረገድ’ ይህን ግንኙነት ግልጽ ያደርጋል።
- source_word: ἐναυάγησαν
  choice: መርከባቸው ተሰብሯል
  rationale: የምንጩን የመርከብ መሰበር ዘይቤ ያቆያል፤ በአማርኛም ከባድ ውድቀትን በሚገባ የሚያሳይ ምስላዊ አገላለጽ ነው።
theological_decisions:
- issue: ἥν የሚያመለክተው
  choice: በዋናነት ‘መልካም ሕሊናን’ እንደሚያመለክት መውሰድ
  alternative: ‘እምነትንና መልካም ሕሊናን’ ሁለቱንም በጋራ እንደሚያጠቃልል መውሰድ
  rationale: ἥν አንስታይ ነጠላ ሲሆን በቅርብ ካለው συνείδησιν ጋር በሰዋሰው ይስማማል። ይሁን እንጂ ሰፋ ያለው መረዳት የሚቻል ስለሆነ በማስታወሻ ተጠብቋል።
- issue: πίστις በመጨረሻው ሐረግ
  choice: እምነት
  alternative: የእምነት ትምህርት / መታመን
  rationale: ὁριστικό አመልካቹ እና ዐውዱ የክርስቲያናዊውን እምነት ወይም የእምነት ዓለም ይጠቁማሉ፤ ሆኖም ዋናው ጽሑፍ ‘እምነት’ ብሎ በመተርጎም በግል መታመንና በሚታመነው ነገር መካከል ያለውን የትርጉም ውጥረት አይዘጋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመርከብ መሰበር ዘይቤው ተጠብቋል፤ በቀደመው ቁጥር ካለው ትእዛዝ ጋር ያለው ትስስር ‘ይዘህ ቀጥል’ በሚለው ተፈጥሯዊ አገላለጽ ተላልፏል።
