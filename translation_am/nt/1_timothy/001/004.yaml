  source_fidelity: The draft accurately conveys the overall contrast, but it adds the governing verb “እዘዛቸው,” which is not present in the Greek text of this verse (though it is supplied by the preceding context). It also makes the divine genitive more specific by saying “an entrusted responsibility given by God,” and adds “fruitless,” neither of which is expressed directly here.
  naturalness: The Amharic is generally clear, but “ተረት ለሆኑ ነገሮች” is unnecessarily circumlocutory, and “ከእግዚአብሔር የተሰጠ አደራ” is less natural while narrowing the source’s ambiguity. The revised wording is concise and idiomatic modern standard Amharic.
  terminology: “ተረቶች” directly renders μύθοις. “የዘር ሐረግ ዝርዝሮች” clearly expresses genealogies. “የእግዚአብሔር አስተዳደር” retains a principal sense of οἰκονομία without importing the unstated passive notion “given.” “በእምነት የሆነው” preserves the deliberately broad force of ἐν πίστει.
