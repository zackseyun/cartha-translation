    rationale: This finite governing verb belongs to the preceding verse and is not in the supplied Greek text. The dependent infinitive can be rendered as a continuation without inserting it.
  - severity: medium
    issue: “ከእግዚአብሔር የተሰጠ አደራ” over-specifies οἰκονομίαν θεοῦ.
    rationale: The wording adds “given” and selects a source-genitive reading, whereas the Greek can indicate God's administration, arrangement, plan, or stewardship. The main text should preserve this ambiguity more closely.
  - severity: low
    issue: “ፍሬ የሌላቸውን” adds an explicit evaluative qualifier to ἐκζητήσεις.
    rationale: The context supports an unfavorable evaluation, but the noun itself denotes inquiries, disputes, or speculations; the negative implication can remain implicit.
