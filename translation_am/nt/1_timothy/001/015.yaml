language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: am
  text: ይህ ቃል የታመነ ነው፤ ሙሉ በሙሉም ሊቀበሉት ይገባል፤ መሲሕ ኢየሱስ[a] ኃጢአተኞችን ሊያድን ወደ ዓለም መጣ፣ ከእነርሱም ቀዳሚው እኔ ነኝ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶስ ኢየሱስ»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ከሁሉ የከፋው» ወይም «ዋነኛው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: ቃሉ የታመነ
  rationale: በእረኛ መልእክቶች ውስጥ ያለውን የታመነ አጭር አባባል የሚያስተዋውቅ ቀመር በቀጥታና በክብር ያስተላልፋል።
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: ሙሉ በሙሉ ሊቀበሉት የሚገባ
  rationale: πάσης የሚሰጠውን ሙሉነትና ἀποδοχή የሚያመለክተውን መቀበል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: በሁለት ነጥብ የቀረበ የቃሉ ይዘት
  rationale: ὅτι በዚህ ስፍራ ምክንያትን ሳይሆን የታመነውን ቃል ይዘት ያስተዋውቃል፤ የአማርኛው ሥርዓተ ነጥብ ይህን ግንኙነት በተፈጥሮ ያሳያል።
- source_word: Χριστὸς Ἰησοῦς
  choice: መሲሕ ኢየሱስ
  rationale: Χριστόςን እዚህ እንደ ማዕረግ ‘መሲሕ’ ብሎ መተርጎም የቅቡዕነት ትርጉሙን ያቆያል፤ ‘ክርስቶስ’ የሚለው የተለመደ አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: ወደ ዓለም መጣ
  rationale: የመንቀሳቀስ አቅጣጫውንና የሐረጉን ሥነ መለኮታዊ ድምፀት ያለ ትርጓሜያዊ ማስፋፋት ያቆያል።
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: ኃጢአተኞችን ሊያድን
  rationale: ስማዊ ሆኖ የቀረበውን ἁμαρτωλούς እና በድነት አውድ ያለውን σῴζω በተለመዱና ትክክለኛ የአማርኛ ቃላት ይገልጣል።
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: ከእነርሱም ቀዳሚው እኔ ነኝ
  rationale: πρῶτος ያለውን ‘ቀዳሚ/ዋነኛ’ የደረጃ ምስል ሳይፈታ ያቆያል፤ ἐγώ የሚሰጠውን አጽንዖትም ‘እኔ ነኝ’ ይገልጣል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: በዚህ የእምነት አጭር አባባል ውስጥ Χριστός የማዕረግ ኃይሉን ስለሚያቆይ ‘መሲሕ’ ተመርጧል፤ እንደ ስም የሚሰማው ባህላዊ ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
- issue: የπρῶτος የደረጃ ትርጉም
  choice: ቀዳሚው
  alternative: ከሁሉ የከፋው ወይም ዋነኛው
  rationale: ጳውሎስ ስለ ራሱ የሚናገረውን አጽንዖት በማቆየት የግሪኩን ‘መጀመሪያ/ቀዳሚ’ ምስል አይፈታም፤ ‘ከሁሉ የከፋው’ የትርጓሜ ማብራሪያ ስለሆነ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የታመነውን አባባል ቀመር በአጭር ንግግር አቆይቶ፣ የπρῶτοςን እውነተኛ የትርጉም ስፋት በዋናው ጽሑፍና በማስታወሻ ጠብቋል።
