lexical_decisions:
- source_word: ἠλεήθην
  choice: ምሕረትን ያገኘሁት
  rationale: የግሪኩን ተደራጊ አወቃቀርና ያልተጠቀሰውን አድራጊ በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: πρώτῳ
  choice: ከሁሉ ቀዳሚ
  rationale: ከቁጥር 15 ጋር ያለውን ግንኙነት ሳያጠፋ፣ ‘ከሁሉ የከፋ’ የሚለውን ትርጓሜ በግልጽ አያስገባም።
- source_word: ἐνδείξηται
  choice: እንዲያሳይ
  rationale: የዓላማ ንዑስ ሐረጉንና የትዕግሥቱን ግልጥ መታየት በቀላል አማርኛ ያስተላልፋል።
- source_word: Χριστὸς Ἰησοῦς
  choice: መሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግ እንደሆነ ያሳያል፤ የተለመደው አማራጭ ‘ክርስቶስ ኢየሱስ’ በማስታወሻ ተጠቅሷል።
- source_word: ἅπασαν μακροθυμίαν
  choice: ትዕግሥቱን ሁሉ
  rationale: ἅπασαν የሚያጠናክረውን ሙሉነትና μακροθυμία የሚያመለክተውን ታጋሽ እገዳ በክቡርና ተፈጥሯዊ ቋንቋ ይይዛል።
- source_word: ὑποτύπωσιν
  choice: ምሳሌ
  rationale: ለቀጣዮቹ አማኞች የቀረበ ንድፍ ወይም አርአያ የሚለውን ሐሳብ ለተራ አንባቢ በግልጽ ያቀርባል።
- source_word: τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ
  choice: ወደፊት በእርሱ አምነው
  rationale: μέλλω ከጳውሎስ ልምምድ አንጻር የወደፊት ጊዜን እንደሚያመለክት ይጠብቃል፤ πιστεύειν ἐπ’ αὐτῷ ደግሞ በእርሱ ላይ እምነት ማድረግን ያሳያል።
- source_word: εἰς ζωὴν αἰώνιον
  choice: የዘላለምን ሕይወት ለሚያገኙት
  rationale: εἰς የሚያመለክተውን ግብ ወይም ውጤት በተፈጥሯዊ አማርኛ ይገልጻል፤ ቀጥተኛው ‘ለዘላለም ሕይወት’ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: የግሪኩን ማዕረጋዊ ትርጉም በዋናው ጽሑፍ ያሳያል፤ የተለመደውን የድምፅ ዝውውር ግን አያስቀርም።
- issue: የምሕረቱ አድራጊና የትዕግሥቱ ባለቤት
  choice: የምሕረቱ አድራጊ ሳይጠቀስ ቀርቷል፤ ትዕግሥቱን የሚያሳየው መሲሑ ኢየሱስ ነው
  alternative: የምሕረቱን አድራጊ በግልጽ ‘እግዚአብሔር’ ወይም ‘ኢየሱስ’ ብሎ መጨመር
  rationale: ተደራጊው ἠλεήθην አድራጊውን አይጠቅስም፤ የዓላማው ሐረግ ግን መሲሑ ኢየሱስን የትዕግሥቱ አሳይ አድርጎ በግልጽ ይጠቅሳል። ትርጉሙ ይህን ልዩነት ይጠብቃል።
- issue: πρὸς ὑποτύπωσιν የሚገልጸው ምሳሌ
  choice: ጳውሎስ ለወደፊት አማኞች ምሳሌ እንዲሆን
  alternative: የትዕግሥቱ መገለጥ ራሱ ምሳሌ እንደሆነ በስም ማቅረብ
  rationale: በጳውሎስ ላይ የታየው ሙሉ ትዕግሥት ነው የምሳሌነቱ መሠረት፤ ተፈጥሯዊው የአማርኛ አገላለጽ ጳውሎስን ምሳሌ ብሎ ቢያቀርብም ይህን ግንኙነት አያጠፋም።
