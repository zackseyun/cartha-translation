  text: ነገር ግን ለዚህ ምሕረት አገኘሁ፤ መሲሑ ኢየሱስ[a] በእኔ፣ ከሁሉ ቀዳሚ በሆንሁት[b]፣ ትዕግሥቱን ሁሉ እንዲያሳይ፣ ወደፊት በእርሱ ለሚያምኑት ለዘላለም ሕይወት[c] ምሳሌ እንድሆን ነው።
  philosophy: optimal-equivalence
