  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: am
  text: ለዘመናት ንጉሡ፣ ለማይጠፋው፣ ለማይታየው፣ ለብቸኛው አምላክ[a] ክብርና ግርማ ከዘላለም እስከ ዘላለም ይሁን። አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፦ “ለብቸኛው ጥበበኛ አምላክ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: ለዘመናት ንጉሥ
  rationale: የግሪኩን የባለቤትነት አገባብና αἰών የሚለውን የዘመን ሐሳብ በግልጽ ሁኔታ ይጠብቃል፤ እግዚአብሔር በዘመናት ሁሉ ላይ ንጉሥ መሆኑን ያሳያል።
- source_word: ἀφθάρτῳ
  choice: ለማይጠፋው
  rationale: ከመበስበስ፣ ከመጥፋትና ከሞት ነጻ የመሆንን ሰፊ ትርጉም ይይዛል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: ἀοράτῳ
  choice: ለማይታየው
  rationale: ‘የማይታይ’ የሚለውን ዋና ትርጉም ቀጥታና ግልጽ በሆነ አማርኛ ያቀርባል።
- source_word: μόνῳ θεῷ
  choice: ለብቸኛው አምላክ
  rationale: የምንጩን ግልጽ የአንድ አምላክነት አረጋገጥ ይጠብቃል፤ በዋናው የSBLGNT ንባብ የሌለውን ‘ጥበበኛ’ አይጨምርም።
- source_word: τιμὴ καὶ δόξα
  choice: ክብርና ግርማ
  rationale: ሁለቱን የተለያዩ ቃላት በተፈጥሯዊ የአማርኛ የውዳሴ አገላለጽ ያቀርባል፤ ‘ክብር’ τιμήን፣ ‘ግርማ’ δόξαን ይወክላሉ።
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ከዘላለም እስከ ዘላለም
  rationale: የማያቋርጥ ዘመንን የሚያመለክተውን የግሪክ ፈሊጥ በተለመደ፣ ክቡርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀμήν
  choice: አሜን
  rationale: በአማርኛ መጽሐፍ ቅዱስና በአምልኮ በተለመደው መልክ ተጠብቋል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ያለው የንግግር ሽግግር በአማርኛው የውዳሴ አረፍተ ነገር አወቃቀር በቂ ስለሚገለጥ፣ ‘አሁን’ የሚል ጊዜያዊ ትርጉም አልተጨመረም።
theological_decisions:
- issue: μόνῳ θεῷ የሚለውን የአንድ አምላክነት አገላለጽ እንዴት መተርጎም እንደሚገባ
  choice: ለብቸኛው አምላክ
  alternative: ለአምላክ ብቻ
  rationale: የምንጩን ግልጽ አረጋገጥ ያለ ተጨማሪ የእምነት ማብራሪያ ይጠብቃል፤ የጽሑፉን ሥነ መለኮታዊ ውጥረት በትርጉም አያስወግድም።
- issue: ከμόνῳ በኋላ σοφῷ (‘ጥበበኛ’) የሚል ቃል ያካተተው የእጅ ጽሑፍ ልዩነት
  choice: ‘ጥበበኛ’ ከዋናው ጽሑፍ ተትቶ ልዩነቱ በማስታወሻ ተገልጿል
  alternative: ለብቸኛው ጥበበኛ አምላክ
  rationale: የቀረበው SBLGNT ዋና ጽሑፍ σοφῷን አያካትትም፤ ሌላው ንባብ ግን በአንዳንድ የእጅ ጽሑፎች ስለሚገኝ ለአንባቢው በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የውዳሴ ቋንቋ ተጠቅሟል። ተከታታይ የ‘ለ-’ አገባብ በግሪኩ ያሉትን ተመሳሳይ የተሳቢ ቅጾች ያሳያል፤ አረፍተ ነገሩም ለመደበኛ አማርኛ አንባቢ ተፈጥሯዊ ሆኖ ይቀራል።
