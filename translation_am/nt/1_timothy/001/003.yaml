source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: am
  text: ወደ መቄዶንያ በምሄድበት ጊዜ በኤፌሶን እንድትቆይ አጥብቄ እንደጠየቅሁህ፣ አንዳንድ ሰዎች የተለየ ትምህርት እንዳያስተምሩ እንድታዛቸው[a]፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንዳንድ ሰዎችን ሌላ ትምህርት እንዳያስተምሩ ጥብቅ መመሪያ እንድትሰጣቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: እንደ
  rationale: የቀድሞውን ልመና እያስታወሰ ከሚከተለው ዓላማ ጋር የሚያያይዘውን ንጽጽራዊና መልሶ አንሺ ኃይል ይጠብቃል።
- source_word: παρεκάλεσά
  choice: አጥብቄ ጠየቅሁህ
  rationale: ቃሉ በልመናና በጽኑ ማሳሰብ መካከል ያለውን ኃይል ይይዛል፤ እንደ ቀጥተኛ ትእዛዝ አያጠነክረውም።
- source_word: προσμεῖναι
  choice: እንድትቆይ
  rationale: በአንድ ቦታ መቆየትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν Ἐφέσῳ
  choice: በኤፌሶን
  rationale: የቦታውን ስምና የἐνን ቦታዊ ግንኙነት በተለመደው አማርኛ አጠራር ያቀርባል።
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: ወደ መቄዶንያ በምሄድበት ጊዜ
  rationale: አድራጊው ጳውሎስ መሆኑንና የተሳቢውን ጊዜያዊ ግንኙነት ግልጽ ያደርጋል።
- source_word: ἵνα
  choice: እንድታዛቸው
  rationale: የዓላማው አንቀጽ በአማርኛው የ‘እንድ-’ አወቃቀር ተጠብቋል።
- source_word: παραγγείλῃς
  choice: እንድታዛቸው
  rationale: παραγγέλλω በዚህ የተወከለ ሥልጣንና የማረም አውድ ውስጥ ከቀላል ምክር የጠነከረ ትእዛዝ ወይም ጥብቅ መመሪያ ያመለክታል።
- source_word: τισὶν
  choice: አንዳንድ ሰዎች
  rationale: የተወሰኑ ነገር ግን ስማቸው ያልተጠቀሰ ሰዎችን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἑτεροδιδασκαλεῖν
  choice: የተለየ ትምህርት ማስተማር
  rationale: ከሐዋርያዊው መለኪያ የተለየ ትምህርት የሚለውን የቃሉን ቀጥተኛ ሐሳብ ይጠብቃል፤ ‘ሐሰተኛ’ የሚለውን የበለጠ ትርጓሜያዊ ፍርድ አይጨምርም።
theological_decisions:
- issue: በቤተ ክርስቲያናዊ እርማት አውድ παραγγείλῃς ምን ያህል ኃይል እንዳለው
  choice: እንድታዛቸው
  alternative: እንድታስጠነቅቃቸው / መመሪያ እንድትሰጣቸው
  rationale: የሐዋርያዊ ውክልናንና ትምህርትን የማረም ሥልጣንን ለማሳየት ‘ማዘዝ’ የግሪኩን ኃይል በቀጥታ ይይዛል፤ የመመሪያ ትርጉሙ በማስታወሻ ቀርቧል።
- issue: ἑτεροδιδασκαλεῖν በሥነ መለኮታዊ ፍርድ ማጠናከር ወይም የቃሉን ልዩነት መጠበቅ
  choice: የተለየ ትምህርት እንዳያስተምሩ
  alternative: ሐሰተኛ ትምህርት እንዳያስተምሩ / ሌላ ትምህርት እንዳያስተምሩ
  rationale: የተዋሐደው ግስ የሚያጎላው የትምህርቱን ልዩነት ነው። ‘ሐሰተኛ’ ማለት በአውዱ ሊገባ ቢችልም ከቃሉ ቀጥተኛ ይዘት በላይ ፍርድ ስለሚጨምር አልተመረጠም።
