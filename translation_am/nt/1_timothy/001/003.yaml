  source_fidelity: 'The translation faithfully represents the Greek syntax and sense: Paul''s prior earnest appeal to Timothy to remain in Ephesus while Paul was traveling to Macedonia, with the purpose that Timothy direct certain unnamed people not to teach a different doctrine. The open-ended comma appropriately preserves the fact that the Greek sentence continues into the following verse.'
