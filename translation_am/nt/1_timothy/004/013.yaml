  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: am
  text: እስክመጣ ድረስ፣ ለሕዝብ ንባብ[a]፣ ለማበረታታትና ለማስተማር ትኩረት ስጥ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቅዱሳት መጻሕፍትን ለማንበብ።” የግሪኩ ጽሑፍ “ንባብ” ብቻ ይላል፤ በአውዱ ግን ይህ በጉባኤ ውስጥ የሚደረግን የቅዱሳት መጻሕፍት ንባብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: እስክመጣ ድረስ
  rationale: የጳውሎስ መምጣት ድረስ የሚቆየውን የጢሞቴዎስ ኃላፊነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρόσεχε
  choice: ራስህን ስጥ
  rationale: ትእዛዙ ጊዜያዊ ትኩረትን ብቻ ሳይሆን ቀጣይነት ያለውን ትጋትና ቁርጠኝነት ይጠይቃል።
- source_word: τῇ ἀναγνώσει
  choice: በሕዝብ ፊት ለማንበብ
  rationale: ἀνάγνωσις በዚህ የጉባኤ አውድ የሕዝብ ንባብን ሳይሆን አይቀርም፤ ነገር ግን ግሪኩ የሚነበበውን ነገር በስም አይጠቅስም።
- source_word: τῇ παρακλήσει
  choice: ለማበረታታት
  rationale: παράκλησις ማበረታታትን፣ መምከርን ወይም ማሳሰብን ሊያመለክት ይችላል፤ እዚህ ላይ ‘ማበረታታት’ ሰፊውን የእረኝነት ስሜት በተፈጥሯዊ ቋንቋ ይገልጣል።
- source_word: τῇ διδασκαλίᾳ
  choice: ለማስተማር
  rationale: የማስተማርን ተግባር ግልጽ በሆነ ዘመናዊ አማርኛ ያሳያል፤ ‘ትምህርተ እምነት’ የሚለውን ጠባብ ወይም ሥርዓታዊ ትርጉም አያስገባም።
theological_decisions:
- issue: ἀνάγνωσις በዋናው ጽሑፍ ውስጥ በግልጽ የቅዱሳት መጻሕፍት ንባብ ተብሎ መገለጽ አለበት ወይስ የለበትም?
  choice: በሕዝብ ፊት ለማንበብ
  alternative: ቅዱሳት መጻሕፍትን በሕዝብ ፊት ለማንበብ፤ ወይም ለማንበብ
  rationale: የቤተ ክርስቲያን አውዱ የቅዱሳት መጻሕፍትን ሕዝባዊ ንባብ አጥብቆ ያመለክታል፤ ሆኖም የግሪኩ ጽሑፍ ‘ቅዱሳት መጻሕፍት’ የሚል ቀጥተኛ ተሳቢ አልያዘም። ስለዚህ ዋናው ጽሑፍ ሕዝባዊ ሁኔታውን ያሳያል፣ ያልተጠቀሰውን ተሳቢ ግን በግልጽ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተከታታይ የዓላማ አገላለጾቹ (‘ለማንበብ፣ ለማበረታታትና ለማስተማር’) የግሪኩን ሦስት ትይዩ ስሞች በተፈጥሯዊ አማርኛ ያቀርባሉ።
