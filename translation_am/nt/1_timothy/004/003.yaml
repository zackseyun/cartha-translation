  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: am
  text: ማግባትን የሚከለክሉ፣ እግዚአብሔር በምስጋና እንዲቀበሏቸው ለሚያምኑና እውነትን ላወቁ ሰዎች የፈጠራቸውን ምግቦች እንዲታቀቡ የሚያዝዙ ናቸው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማግባትን የሚከለክሉና ከምግቦች መታቀብን የሚያዙ።” ዋናው ጽሑፍ እነዚህ አስተማሪዎች ከምግቦች መታቀብን እንደሚያዙ ግልጽ ያደርጋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: የሚከለክሉ
  rationale: የአሁን ጊዜ አሳታፊ ቅርጹ ከቀደመው ቁጥር የቀጠለውን የሐሰት አስተማሪዎች መግለጫ ያሳያል፤ ይህ ምርጫ የመከልከልን ግልጽ ኃይል ይጠብቃል።
- source_word: γαμεῖν
  choice: ማግባትን
  rationale: የግስ ስም ቅርጹ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ‘ማግባትን መከልከል’ የሚለውን ትርጉም በቀጥታ ያቀርባል።
- source_word: ἀπέχεσθαι
  choice: እንዲታቀቡ የሚያዝዙ
  rationale: ቃሉ በቀጥታ ‘መታቀብ’ ማለት ነው፤ ከዓረፍተ ነገሩ አወቃቀር የሚገባውን የማዘዝ ኃይል ዋናው ጽሑፍ በተፈጥሯዊ አማርኛ ግልጽ አድርጎታል።
- source_word: βρωμάτων
  choice: ከምግቦች
  rationale: ብዙ ቁጥር ያለውን የግሪክ ቃል ይጠብቃል፤ ከ‘መታቀብ’ ጋርም ተፈጥሯዊ የአማርኛ አገባብ ነው።
- source_word: ἔκτισεν
  choice: ከፈጠራቸው
  rationale: κτίζω ያለውን የፍጥረት ትርጉም ‘ፈጠረ’ በግልጽ ያስተላልፋል።
- source_word: εἰς μετάλημψιν
  choice: እንዲቀበሏቸው
  rationale: ሐረጉ የፍጥረቱን ዓላማ ያመለክታል፤ ምግቦቹ ተቀብለው እንዲበሉ መፈጠራቸውን በተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: μετὰ εὐχαριστίας
  choice: በምስጋና
  rationale: ለእግዚአብሔር ምስጋና እየቀረበ መቀበልን በግልጽና በተለመደ መንገድ ያሳያል።
- source_word: τοῖς πιστοῖς
  choice: ያመኑ ... ሰዎች
  rationale: እዚህ πιστοῖς በተፈጥሯዊ ሁኔታ አማኞችን ያመለክታል፤ ‘ያመኑ’ የሚለው የእምነትን ግሳዊ ሐሳብ ግልጽ ያደርጋል።
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: እውነትን ያወቁ
  rationale: ፍጹም አሳታፊው ቀድሞ እውነትን ወደ ማወቅ የመጡና በዚያ እውቀት የሚኖሩ ሰዎችን ያመለክታል፤ አጭሩ የአማርኛ አገላለጽ ይህን በተፈጥሯዊ ሁኔታ ይይዛል።
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν አንድ ቡድን ወይስ ሁለት ቡድኖችን ያመለክታል?
  choice: ‘ያመኑና እውነትን ያወቁ ሰዎች’ በማለት በሁለት ባሕርያት የተገለጸ አንድ ቡድን
  alternative: ‘ለአማኞችና እውነትን ላወቁት’ በማለት ሁለት ቡድኖች
  rationale: አንዱ መስተዋድድ አንቀጽ ከተቀናጁት ሁለት መግለጫዎች ጋር መጠቀሙ አንድን ቡድን ከሁለት አንጻር እንደሚገልጽ በበለጠ ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አሳታፊ አወቃቀር ከቀደመው ቁጥር ጋር ያለውን ቀጣይነት እንዲጠብቅ ‘የሚከለክሉ ... የሚያዝዙ ናቸው’ ተብሏል፤ የ‘ማዘዝ’ ሐሳብ ግን ከአገባቡ የተገለጸ መሆኑ በማስታወሻ ተጠቁሟል።
