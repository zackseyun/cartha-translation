lexical_decisions:
- source_word: πιστὸς
  choice: የታመነ
  rationale: በዚህ ቀመራዊ አገላለጽ ቃሉ አባባሉ እምነት ሊጣልበት የሚችልና አስተማማኝ መሆኑን ያመለክታል። ‘የታመነ’ ይህን ትርጉም በተፈጥሯዊና በክብር ባለው አማርኛ ያስተላልፋል።
- source_word: ὁ λόγος
  choice: ይህ አባባል
  rationale: λόγος እዚህ አንድን የተወሰነ አባባል ወይም መግለጫ ያመለክታል፤ ‘ይህ አባባል’ ቀመራዊውን አገላለጽ በግልጽ ሁኔታ ይጠብቃል።
- source_word: πάσης
  choice: ሙሉ በሙሉ
  rationale: ከἀποδοχῆς ጋር ሲጣመር የተሟላና ያልተከፋፈለ መቀበልን ያመለክታል፤ ‘ሙሉ በሙሉ’ የጠቅላላነቱን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀποδοχῆς
  choice: ሊቀበሉት
  rationale: ἀποδοχή መቀበልን ወይም በደስታ መቀበልን ያመለክታል። በአማርኛ የግስ አገላለጹ ከ‘የሚገባ’ ጋር ተፈጥሯዊ ነው።
- source_word: ἄξιος
  choice: የሚገባ
  rationale: ἄξιος ከገዢ ዘርፍ ጋር ‘የሚገባው’ ወይም ‘ብቁ የሆነ’ ማለት ነው፤ ‘ሊቀበሉት የሚገባ’ የምንጩን ግንኙነት በግልጽና ተፈጥሯዊ መንገድ ያስተላልፋል።
