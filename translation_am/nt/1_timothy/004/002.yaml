lexical_decisions:
- source_word: ἐν
  choice: አማካይነት
  rationale: ከቀደመው ሐረግ ጋር ሲያያዝ መንገድን ወይም መሣሪያነትን ያመለክታል፤ «አማካይነት» ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑποκρίσει
  choice: ግብዝነት
  rationale: የውሸት መልክ መያዝንና ሐቀኛ አለመሆንን በቀጥታ የሚገልጽ የተለመደ ቃል ነው።
- source_word: ψευδολόγων
  choice: የሐሰተኞች
  rationale: የብዙ ቁጥር የባለቤትነት ቅርጹን ከ«ግብዝነት» ጋር በማያያዝ፣ በውሸት የታወቁ ሰዎችን በአጭሩ ይገልጻል።
- source_word: κεκαυστηριασμένων
  choice: በጋለ ብረት የተተኮሰ
  rationale: የማቃጠል፣ የመተኮስ ወይም በጋለ ብረት ምልክት የማድረግን ምስል ይጠብቃል፤ ፍጹም የስሜት ማጣትን በትርጉሙ ውስጥ በግልጽ አይጨምርም። የተፈጸመው ድርጊት ውጤት እንደቀጠለ የሚያሳየውን ፍጹም ተሳቢ አንቀጽ በሁኔታ ገላጭ ቅርጽ ያቀርባል።
- source_word: τὴν ἰδίαν συνείδησιν
  choice: የራሳቸው ሕሊና
  rationale: የግሪኩን ነጠላ ቁጥርና የἰδίανን አጽንዖት በ«የራሳቸው» ይጠብቃል፤ በአማርኛም ይህ በየግለሰቡ ያለውን ሕሊና በተፈጥሯዊ ሁኔታ ሊያመለክት ይችላል።
theological_decisions:
- issue: የκεκαυστηριασμένων ዘይቤያዊ ኃይል
  choice: «በጋለ ብረት የተተኮሰ» በማለት የማቃጠልንና ምልክት የማድረግን ምስል ማቆየት
  alternative: «የደነዘዘ» ወይም «ስሜት ያጣ» በማለት ውጤቱን ብቻ መግለጽ
  rationale: የግሪኩ ምስል ሕሊናው በምልክት እንደተቃጠለ ወይም በመተኮስ ደንዝዞ እንደሆነ ሊያመለክት ይችላል። ትርጉሙ የመጨረሻና የማይቀለበስ መንፈሳዊ ውድቀት ነው ብሎ አይወስንም፤ ዘይቤውንና የትርጉም ውጥረቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። «ሕሊና» በሃይማኖታዊና በዕለታዊ አጠቃቀም የታወቀ ሲሆን፣ «በጋለ ብረት የተተኮሰ» የግሪኩን ጠንካራ ምስል ያቆያል።
