translation:
  language: am
  text: በሕሊናቸው በጋለ ብረት የተቃጠለባቸው ሐሰተኞች ግብዝነት አማካይነት፣[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በራሳቸው ሕሊና ምልክት የተደረገባቸው» ወይም «በራሳቸው ሕሊና የተቃጠሉና የደነዘዙ»። የግሪኩ ምስል ሕሊናቸው በምልክት እንደተቃጠለ ወይም ስሜቱን እንዳጣ ሊያመለክት ይችላል።
