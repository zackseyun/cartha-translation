  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: am
  text: በእግዚአብሔር ቃልና በጸሎት[b] ይቀደሳልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቅዱስ ይደረጋል።”
    reason: lexical_alternative
  - marker: b
    text: “ጸሎት” የተባለው “ምልጃ” ወይም “ልመና” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: ይቀደሳል
  rationale: የአሁን ጊዜ ተደራጊ ግስ መሆኑን ይጠብቃል፤ በቀደመው አውድ የተጠቀሰውን ምግብ ያመለክታል። ቃሉ የቅድስናን ትርጉም ሳያጠብ በዚህ አውድ ለመጠቀም የተለየ መሆንን ያሳያል።
- source_word: γὰρ
  choice: -ና
  rationale: ለቀደመው ንግግር ምክንያት የሚሰጠውን ገላጭ ግንኙነት በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: διὰ
  choice: በ-
  rationale: ከመስተዋድድ ቅጽ ጋር የተገለጠውን የመንገድ ወይም የመሣሪያነት ትርጉም በአማርኛ በተፈጥሮ ያስተላልፋል።
- source_word: λόγου θεοῦ
  choice: በእግዚአብሔር ቃል
  rationale: የዝምድናውን አገባብ ቀጥተኛና የተለመደ በሆነ መንገድ ይተረጉማል፤ እዚህ ላይ 'ቃል' በትክክል ምንን እንደሚያመለክት አይወስንም።
- source_word: ἐντεύξεως
  choice: ጸሎት
  rationale: በምግብ ምስጋና አውድ ውስጥ ሰፊውን የጸሎት ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃሉ ልመናን ወይም ምልጃን ሊያመለክት መቻሉ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በአውዱ ውስጥ የቅድስና ቃል ወሰን
  choice: ጥቅሱ ምግብ ለመጠቀም የተለየ መሆኑን ይናገራል፤ ይህን በትርጉሙ ላይ ተጨማሪ ሐረግ በማከል አይገድብም።
  alternative: ቃሉን 'ቅዱስ ይደረጋል' ብሎ በሰፊ ሃይማኖታዊ ትርጉም መረዳት።
  rationale: የ1 ጢሞቴዎስ 4፥3-4 ቅርብ አውድ በምስጋና ስለሚቀበሉት ምግብ ይናገራል። 'ይቀደሳል' የግሪኩን የቅድስና ቋንቋ ይጠብቃል፤ የሥነ ሥርዓት ወይም የድነት አስተምህሮ ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምክንያት ግንኙነቱ በግሱ መጨረሻ ባለው “-ና” ተገልጧል።
