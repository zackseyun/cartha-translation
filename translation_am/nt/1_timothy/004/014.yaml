- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: በአንተ ውስጥ ያለውን ስጦታ
  rationale: ἐν σοὶ የስጦታውን በጢሞቴዎስ ውስጥ መኖር በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἐδόθη σοι
  choice: ተሰጥቶሃል
  rationale: የግሪኩን ተደራጊ አወቃቀር ይጠብቃል፤ ጽሑፉ ሰጪውን በግልጽ ስላልጠቀሰ አይጨምርም።
- source_word: διὰ προφητείας
  choice: በትንቢት
  rationale: διά ከዘር ቅጽ ጋር አማካይነትን ወይም መንገድን ሊያመለክት ይችላል፤ አጭርና ምንጩን የሚከተል አተረጓጎም ነው።
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: እጆቹን በአንተ ላይ ከመጫኑ ጋር
  rationale: የእጅ መጫንን ሥርዓታዊ ድርጊት በተፈጥሯዊ አማርኛ ይገልጻል፤ μετὰ የሚያሳየውን አብሮነትም ይጠብቃል።
- source_word: πρεσβυτερίου
  choice: የሽማግሌዎች ሸንጎ
  rationale: አንድን ሽማግሌ ሳይሆን የሽማግሌዎችን የጋራ አካል ያመለክታል፤ የኋለኛ ዘመን የቤተ ክርስቲያን አስተዳደር ስያሜን ከማስገባት ይቆጠባል።
theological_decisions:
- issue: χάρισμα የተለየ መንፈሳዊ ወይም አገልግሎታዊ ትርጉም በግልጽ ይጨመርበት እንደሆነ
