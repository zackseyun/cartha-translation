- issue: πρεσβυτέριον የኋለኛ ዘመን የቤተ ክርስቲያን አስተዳደር አቋምን ሳያስገባ እንዴት እንደሚተረጎም
  choice: የሽማግሌዎች ሸንጎ
  alternative: የሽማግሌዎች ማኅበር
  rationale: በእጅ መጫኑ የተሳተፈው የሽማግሌዎች የጋራ አካል መሆኑን ያስተላልፋል፤ በተወሰነ የእምነት ቡድን የኋለኛ ጊዜ ሥርዓት አይወስነውም።
- issue: διὰ προφητείας ትንቢቱ ስጦታውን ያስተላለፈበት መንገድ ወይም ከስጦታው መሰጠት ጋር የተጓዘ ንግግር መሆኑ
  choice: በትንቢት
  alternative: በትንቢታዊ ንግግር
  rationale: አገላለጹ አማካይነትን ሊያሳይ ቢችልም ትንቢቱ መሰጠቱን አጅቦ እንደነበርም ሊገባ ይችላል፤ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል።
