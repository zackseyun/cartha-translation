base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: am
  text: በአንተ ውስጥ ያለውን ስጦታ ቸል አትበል፤ ይህም ስጦታ በትንቢት[b]፣ የሽማግሌዎች ሸንጎ[a] እጆቹን በአንተ ላይ ከመጫኑ ጋር ተሰጥቶሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሽማግሌዎች ማኅበር።” ቃሉ ሽማግሌዎችን በጋራ እንደ አንድ አካል ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በትንቢታዊ ንግግር።” ሐረጉ ትንቢቱ ስጦታው ሲሰጥ አብሮ እንደነበር ወይም የመሰጠቱ መንገድ እንደሆነ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέλει
  choice: ቸል አትበል
  rationale: μή ከአሁን ትእዛዝ ጋር የሚያመለክተውን ቀጣይ ክልከላ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: χάρισμα
