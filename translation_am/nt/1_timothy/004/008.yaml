base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: am
  text: የሰውነት ልምምድ[a] ለጥቂት[b] ይጠቅማልና፤ ለእግዚአብሔር ያደረ ኑሮ ግን ለአሁኑ ሕይወትም ሆነ ለሚመጣው ሕይወት የተስፋ ቃል ስላለው[c]፣ በሁሉ ይጠቅማል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አካላዊ ሥልጠና» ወይም «የሰውነት እንቅስቃሴ»።
    reason: lexical_alternative
  - marker: b
    text: «ለጥቂት» የሚለው የግሪክ አገላለጽ «ለአጭር ጊዜ» ወይም «በጥቂቱ፣ በውሱን መጠን» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: c
