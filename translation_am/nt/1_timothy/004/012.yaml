id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: am
  text: ማንም በወጣትነትህ አይናቅህ፤ ነገር ግን በንግግር፣ በኑሮ፣ በፍቅር፣ በእምነት[a]ና በንጽሕና ለአማኞች ምሳሌ ሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በታማኝነት።” የግሪኩ ቃል በዚህ አውድ እምነትን ወይም ታማኝነትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: ማንም ... አይናቅህ
  rationale: የግሪኩን የክልከላ ምክር በተፈጥሯዊና በግልጽ ዘመናዊ አማርኛ ያቀርባል፤ καταφρονέω የሚያመለክተውን ንቀትም ይጠብቃል።
- source_word: τῆς νεότητος
  choice: በወጣትነትህ
  rationale: νεότης ወጣትነትን ወይም ወጣት ዕድሜን ያመለክታል፤ ይህ አገላለጽ ንቀቱ በጢሞቴዎስ ወጣትነት ምክንያት እንዳይሆን ያሳያል።
- source_word: τύπος γίνου
  choice: ምሳሌ ሁን
  rationale: τύπος ሌሎች ሊከተሉት የሚገባ አርአያን ያመለክታል፤ በአማርኛ ‘ምሳሌ ሁን’ ግልጽና ተፈጥሯዊ ነው።
- source_word: τῶν πιστῶν
  choice: ለአማኞች
  rationale: በዚህ አውድ πιστοί የሚያመለክተው የሚያምኑ ሰዎችን ነው፤ የተሰጠው የአማርኛ ቅርጽ ጢሞቴዎስ ለእነርሱ ምሳሌ እንዲሆን የታዘዘ መሆኑን ያብራራል።
- source_word: ἐν λόγῳ
  choice: በንግግር
  rationale: λόγος በዚህ የበጎ ባሕርያት ዝርዝር ውስጥ የንግግርን መንገድ ያመለክታል።
- source_word: ἐν ἀναστροφῇ
  choice: በኑሮ
  rationale: ἀναστροφή አኗኗርን ወይም ምግባርን ያመለክታል፤ ‘በኑሮ’ አጠቃላይ የሕይወት አካሄድን በቀላሉ ይገልጣል።
- source_word: ἐν ἀγάπῃ
  choice: በፍቅር
  rationale: ἀγάπηን በቀጥታና በተለመደው መንገድ ይተረጉማል።
- source_word: ἐν πίστει
  choice: በእምነት
  rationale: πίστις በዚህ አውድ እምነትን ወይም ታማኝነትን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ‘እምነት’ የሚለውን ሰፊና የተለመደ ትርጉም ይጠቀማል፣ ሌላውን አማራጭ ግን በማስታወሻ ይጠብቃል።
- source_word: ἐν ἁγνείᾳ
  choice: በንጽሕና
  rationale: ἁγνεία የሥነ ምግባር ንጽሕናን፣ በተለይም ወሲባዊ ንጽሕናን ሊያካትት ይችላል፤ ‘ንጽሕና’ ያንን ስፋት ሳያጠብ ያስቀምጣል።
theological_decisions:
- issue: በበጎ ባሕርያት ዝርዝር ውስጥ πίστιςን መተርጎም
  choice: እምነት
  alternative: ታማኝነት
  rationale: አውዱ በእግዚአብሔር ላይ ያለ እምነትንም ሆነ በተግባር የሚታይ ታማኝነትን ሊደግፍ ይችላል። ዋናው ጽሑፍ የተለመደውን ‘እምነት’ ይይዛል፤ አማራጩም የግሪኩን እውነተኛ አሻሚነት ለመጠበቅ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ ἐν በእያንዳንዱ የበጎ ባሕርይ ክፍል ‘በ-’ ተብሎ ተጠብቋል።
