  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: am
  text: ለዚህ ዓላማ እንደክማለንና እንሰደባለን[a]፤ ምክንያቱም ተስፋችንን በሕያው አምላክ ላይ አድርገናል[b]። እርሱም የሰዎች ሁሉ፣ በተለይም የአማኞች አዳኝ ነው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደክማለን፣ ነቀፋም ይደርስብናል።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ተስፋችንን በሕያው አምላክ ላይ ጥለናል።»
    reason: lexical_alternative
  - marker: c
    text: «የሰዎች ሁሉ፣ በተለይም የአማኞች አዳኝ» የሚለው ሐረግ እንደተጻፈ ተተርጉሟል። እዚህ «አዳኝ» የሚለው ቃል አምላክ ሰዎችን ሁሉ በጥበቃው እንደሚያኖር፣ ለሁሉ የመዳን ዝግጅት እንዳደረገ፣ ወይም መዳን በተለይ በአማኞች ላይ ተፈጻሚ እንደሆነ ማመልከቱን ተርጓሚዎች በተለያየ መንገድ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ለዚህ ዓላማ
  rationale: ሐረጉ ቀደም ሲል የተገለጠውን ዓላማ ያመለክታል፤ «ለዚህ ዓላማ» የአቅጣጫና የዓላማ ኃይሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: γάρ ከቀደመው ሐሳብ ጋር የሚያያዝ ማብራሪያዊ ምክንያትን ያስገባል፤ በአማርኛ የአንቀጹ አወቃቀር መሠረት በተስፋው ሐረግ ፊት «ምክንያቱም» ተቀምጧል።
- source_word: κοπιῶμεν
  choice: እንደክማለን
  rationale: ግሱ አድካሚና ብርቱ ሥራን ያመለክታል፤ «እንደክማለን» ይህን ኃይል በአጭርና በተፈጥሯዊ አነጋገር ያስተላልፋል።
- source_word: ὀνειδιζόμεθα
  choice: ነቀፋም ይደርስብናል
  rationale: የግሱ ተደራጊ ቅርጽ ሰዎች የሚያደርሱትን የቃል ውርደትና ነቀፋ ያሳያል፤ ይህ አተረጓጎም ተደራጊነቱን በግልጽ አማርኛ ይጠብቃል።
- source_word: ἠλπίκαμεν ἐπὶ
  choice: ተስፋችንን … ላይ ጥለናል
  rationale: የፍጹም ጊዜው ቅርጽ ቀደም ሲል የተደረገና ውጤቱ የቀጠለ የተረጋጋ ተስፋን ያሳያል፤ የአማርኛው አባባል ድርጊቱንና ቀጣይ ሁኔታውን ያስተላልፋል።
- source_word: θεῷ ζῶντι
  choice: በሕያው አምላክ
  rationale: «ሕያው አምላክ» የግሪኩን ቅጽል አወቃቀር የሚጠብቅ፣ የታወቀና ክብር ያለው መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
- source_word: σωτὴρ
  choice: አዳኝ
  rationale: σωτήρ ከአደጋ አውጪን ወይም ጠባቂን ሊያመለክት ቢችልም፣ «አዳኝ» በእረኛ መልእክቶች ውስጥ ያለውን ጠንካራ ሥነ መለኮታዊ ክብደት በተሻለ ሁኔታ ይጠብቃል።
- source_word: πάντων ἀνθρώπων
  choice: የሰዎች ሁሉ
  rationale: ἄνθρωποι እዚህ ጾታን ሳይለይ የሰው ልጆችን በአጠቃላይ ያመለክታል፤ «ሰዎች ሁሉ» ይህን አካታች ትርጉም በዘመናዊ አማርኛ ይገልጣል።
- source_word: μάλιστα
  choice: በተለይም
  rationale: ቃሉ ከሁሉ በተለየ ወይም በላቀ መልኩ የሚለውን ያሳያል፤ «በተለይም» በሁሉና በአማኞች መካከል ያለውን የጽሑፉን ውጥረት ሳያጠፋ ይጠብቃል።
- source_word: πιστῶν
  choice: የአማኞች
  rationale: በዚህ አውድ πιστῶν በእምነት የሚታወቁትን ያመለክታል፤ «አማኞች» ግልጽና በዘመናዊ አማርኛ የተለመደ ነው።
theological_decisions:
- issue: «የሰዎች ሁሉ፣ በተለይም የአማኞች አዳኝ» የሚለው ትርጉም
  choice: ጽሑፉ ስለ ሰዎች ሁሉ የሚናገረውን ሰፊ አረፍተ ነገርና ከአማኞች ጋር ያለውን ልዩ ግንኙነት «በተለይም» በማለት እንደተጻፈ ማቆየት
  alternative: «አዳኝ»ን ለሁሉ ጠባቂ፣ ለአማኞች ደግሞ ቤዛዊ አዳኝ ብሎ መለየት፤ ሁሉም ይድናሉ ብሎ መተርጎም፤ ወይም «ሰዎች ሁሉ»ን «ከሰዎች ወገን ሁሉ» ብሎ ማጥበብ
  rationale: የግሪኩ ጽሑፍ ሁለንተናዊውን «ሰዎች ሁሉ» እና ልዩነቱን «በተለይም አማኞች» በአንድነት ያስቀምጣል። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ይጠብቃል እንጂ ወደ አንድ የትርጓሜ ሥርዓት አያጠበውም።
