  rationale: መስተዋድዱና የሐሰት ትምህርት አውዱ “እምነት”ን እንደሚታመንበት ይዘት ለመረዳት ይደግፋሉ፤ ይህም ስለ እምነት መተው የተለየ የእምነት ሥርዓት ድምዳሜ አያስገባም።
- issue: “የአጋንንት ትምህርቶች” የሚለው የግሪክ የባለቤት አገባብ
  choice: ከአጋንንት የመነጩ ወይም ከእነርሱ ጋር የተያያዙ ትምህርቶች
  alternative: ስለ አጋንንት የሚያስተምሩ ትምህርቶች
  rationale: አውዱ አጋንንትን የትምህርቶቹ ምንጭ ወይም ባሕርይ አድርጎ መረዳትን ይደግፋል፤ ቀጥተኛው አገላለጽ ግን የግሪኩን አጭርነት ይጠብቃል።
