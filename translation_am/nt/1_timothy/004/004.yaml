- issue: λαμβανόμενον ከμετὰ εὐχαριστίας ጋር ያለው ሁኔታዊ ኃይል
  choice: በምስጋና ከተቀበሉት
  alternative: በምስጋና ሲቀበሉት፤ በምስጋና ተቀብሎ
  rationale: የግሪኩን ተሳቢ በተፈጥሯዊ አማርኛ ሁኔታዊ አነጋገር ይገልጻል፤ ከጽሑፉ በላይ የሆነ የትምህርተ እምነት ድምዳሜ አይጨምርም።
