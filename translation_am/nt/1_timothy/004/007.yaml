lexical_decisions:
- source_word: βεβήλους
  choice: ርኩስ
  rationale: ቅዱስ ከሆነው ተቃራኒ የሆነውን፣ ለቅዱስ ነገር ክብር የሌለውን ሐሳብ በአጭሩ ያስተላልፋል።
- source_word: γραώδεις
  choice: የአሮጊቶች ተረት የሆኑትን
  rationale: ቃሉ በቀጥታ ‘የአሮጊቶች ባሕርይ ያላቸውን’ የሚል ንቀት ያዘለ አገላለጽ ነው፤ በአማርኛ ተፈጥሯዊ እንዲሆን ‘ተረት’ ተካትቷል።
- source_word: μύθους
  choice: አፈ ታሪኮች
  rationale: በዚህ ዐውድ የተፈበረኩ ወይም ግምታዊ ታሪኮችን የሚያመለክት ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
- source_word: παραιτοῦ
  choice: አትቀበል
  rationale: የመካድ፣ የመ拒ት ወይም ራስን ከነገሩ የማራቅ ትእዛዝን ግልጽ በሆነ አማርኛ ያቀርባል።
- source_word: γύμναζε
  choice: አሠልጥን
  rationale: ግስ የአካል ልምምድና ሥልጠና ምስል አለው፤ ‘አሠልጥን’ ይህን ምስል በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: σεαυτόν
  choice: ራስህን
  rationale: ጢሞቴዎስ ራሱ የሥልጠናው ተቀባይ መሆኑን በቀጥታ ያሳያል።
- source_word: πρὸς εὐσέβειαν
  choice: ለእግዚአብሔር አምላኪ ኑሮ
  rationale: πρός ዓላማን ያመለክታል፤ εὐσέβεια ደግሞ በእግዚአብሔር ክብርና ፍርሃት የሚመራ ኑሮን ያመለክታል። ‘አምላኪ ኑሮ’ ከአምልኮ ሥርዓት ብቻ ይልቅ ሰፊውን የኑሮ ትርጉም ያስተላልፋል።
- source_word: δὲ ... δὲ
  choice: ነገር ግን ... ይልቁንም
  rationale: የመጀመሪያው δέ ከቀደመው ነገር ጋር ያለውን ንጽጽር፣ ሁለተኛውም አሉታዊውን ትእዛዝ በአዎንታዊ ተቃራኒ ትእዛዝ መተካቱን ያሳያሉ።
theological_decisions:
- issue: የግሪኩን γραώδεις μύθους ንቀት ያዘለ አገላለጽ መተርጎም
  choice: የአሮጊቶች ተረት የሆኑትን አፈ ታሪኮች
  alternative: የሞኞች አፈ ታሪኮች፤ የአሮጊቶች ተረቶች
  rationale: ምንጩ ሴትና ዕድሜን የጠቀሰ ባሕላዊ ንቀት ያዘለ አገላለጽ ነው። ‘የሞኞች’ ማለት ምስሉን ያጠፋል፤ በዋናው ጽሑፍ ምስሉን መጠበቅና በማስታወሻ ንቀት ያዘለ ባሕርዩን መግለጽ የምንጩን ድምፅ ሳያለዝብ ያቀርባል።
- issue: εὐσέβεια የሚያመለክተው የኑሮ ስፋት
  choice: ለእግዚአብሔር አምላኪ ኑሮ
  alternative: ለአምላካዊነት፤ ለቅድስና፤ ለአምልኮ
  rationale: ቃሉ በእረኛ መልእክቶች በእግዚአብሔር ፍርሃትና ክብር የተቀረጸ ሙሉ ኑሮን ያመለክታል። ‘ቅድስና’ የተለየ ግሪክ ጽንሰ ሐሳብን ሊያስገባ ይችላል፤ ‘አምልኮ’ም ትርጉሙን ወደ ሥርዓታዊ አምልኮ ብቻ ሊያጠብ ይችላል።
