    text: በግሪክኛው ቃል በቃል፣ “የአሮጊት ሴቶች ባሕርይ ያላቸው አፈ ታሪኮች” ማለት ነው፤ ይህ ንቀት ያዘለ አገላለጽ ነው። ወይም፣ “የአሮጊት ሴቶች ተረቶች።”
