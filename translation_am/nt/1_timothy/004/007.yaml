  text: ነገር ግን ቅዱስ ያልሆኑና የአሮጊት ሴቶች ባሕርይ ያላቸውን አፈ ታሪኮች[a] አትቀበል፤ ራስህንም ለአምላክ ክብር ያለው ኑሮ አሠልጥን።
  philosophy: optimal-equivalence
  footnotes:
