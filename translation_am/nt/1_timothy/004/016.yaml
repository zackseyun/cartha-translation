  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: am
  text: ራስህንና ትምህርቱን በጥንቃቄ ተከታተል፤ በእነዚህም ጸንተህ ቀጥል። ይህን በማድረግህ ራስህንም የሚሰሙህንም ታድናለህ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ታድናለህ» የሚለው «ትጠብቃለህ» ወይም «ከአደጋ ታወጣለህ» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል እንደ አውዱ ማዳንን፣ መጠበቅን ወይም ከአደጋ ማውጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: በጥንቃቄ ተከታተል
  rationale: ትእዛዙ ራስንና ትምህርትን ለቀጣይነት ባለው ንቃት መጠበቅን ያመለክታል፤ ይህ አገላለጽ ከአንድ ጊዜ ትኩረት ይልቅ ዘላቂ ክትትልን ያሳያል።
- source_word: σεαυτῷ
  choice: ራስህን
  rationale: የግሪኩ መስተዋድዳዊ ቅርጽ የትኩረቱን ዒላማ ያሳያል፤ በአማርኛ ቀጥተኛ ተሳቢ ተፈጥሯዊ ነው።
- source_word: τῇ διδασκαλίᾳ
  choice: ትምህርቱን
  rationale: διδασκαλία የማስተማርን ይዘት ወይም ተግባር ሊያመለክት ይችላል፤ እዚህ «ትምህርቱ» ቀላል፣ ክቡርና ከአንድ ወገናዊ የእምነት ቃላት የራቀ ነው።
- source_word: ἐπίμενε αὐτοῖς
  choice: በእነዚህም ጸንተህ ቀጥል
  rationale: ἐπίμενε ዘላቂና ጽኑ መቀጠልን ያሳያል፤ αὐτοῖς ቀደም ሲል የተጠቀሱትን ራስንና ትምህርቱን መከታተል በአንድነት ያመለክታል።
- source_word: τοῦτο γὰρ ποιῶν
  choice: ይህን በማድረግህ
  rationale: የግሪኩ ተሳቢ ግስ ዘዴን ወይም አብሮ የሚሄድ ተግባርን ይገልጣል፤ የአማርኛው ቅርጽ ዘዴን በግልጽ ያሳያል።
- source_word: σώσεις
  choice: ታድናለህ
  rationale: σῴζω ዋናውን «ማዳን» ትርጉም ይይዛል። ቃሉን «ትጠብቃለህ» ብሎ ማቅለል የጽሑፉን ሥነ መለኮታዊ ክብደት ሊያሳንስ ስለሚችል ቀጥተኛው ትርጉም ተጠብቋል።
- source_word: τοὺς ἀκούοντάς σου
  choice: የሚሰሙህን
  rationale: የአሁን ጊዜ አሳታፊው ጢሞቴዎስን በቀጣይነት የሚሰሙትን ያመለክታል፤ አጭሩ የአማርኛ አገላለጽ ይህን ይይዛል።
theological_decisions:
- issue: በእረኛዊ ምክር ውስጥ «ማዳን» የሚለው ትርጉም
  choice: «ታድናለህ» የሚለውን በዋናው ጽሑፍ ማቆየት፣ ነገር ግን ወሰኑን በትርጉሙ አለመወሰን
  alternative: «ትጠብቃለህ» ወይም «በደኅና ታሳልፋለህ» ብሎ መተርጎም፤ ወይም ቃሉን በመጨረሻው ዘመን ድነት ብቻ መገደብ
  rationale: ጥቅሱ ጢሞቴዎስ በኑሮውና በትምህርቱ መጽናቱን ከራሱና ከሰሚዎቹ መዳን ጋር ያገናኛል። ይህ ራስን በሥራ ማዳንን በግልጽ አያስተምርም፣ ነገር ግን ትርጉሙ የጽሑፉን ውጥረት ሳያጠፋ መቆየት አለበት።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በእነዚህም ጸንተህ ቀጥል» የግሪኩን የቀጣይ ጽናት ኃይል ያስቀምጣል፤ «ታድናለህ» ደግሞ የምንጩን እውነተኛ ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
