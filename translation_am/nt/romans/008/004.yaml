  text: 'የሕጉ ጻድቅ መስፈርት[a] በእኛ ውስጥ እንዲፈጸም፣ በሥጋ[b] ሳይሆን በመንፈስ[c] በምንመላለስ በእኛ ውስጥ ነው።


    [a] ወይም፣ “የሕጉ መስፈርት።”


    [b] እዚህ “ሥጋ” የሚለው ቃል በኃጢአት የወደቀውን የሰው ተፈጥሮ፣ ወይም ከእግዚአብሔር የራቀ የኑሮ አቅጣጫን ያመለክታል፤ አንዳንዶች “ኃጢአተኛ ተፈጥሮ” ብለው ይተረጉሙታል።


    [c] በሮሜ 8 ዐውድ ይህ ቃል ምናልባት መንፈስ ቅዱስን ያመለክታል፤ ሆኖም የሰውን መንፈስ በማመልከትም ሊነበብ ይችላል።'
  philosophy: optimal-equivalence
