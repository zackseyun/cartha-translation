  terminology: Use “የሕጉ ጻድቅ መስፈርት” for δικαίωμα, retaining both its normative and righteous sense. Retain “ሥጋ” and “መንፈስ.” Since Amharic has no capitalization contrast, the Spirit/spirit ambiguity should be explained rather than presenting identical wording as an alternative.
