    reason: lexical_alternative
  - marker: b
    text: «ለሁላችን ሲል» የሚለው «ስለ ሁላችን» ወይም «ሁላችንን ወክሎ» ተብሎም ሊቀርብ ይችላል።
    reason: alternative_reading
  - marker: c
