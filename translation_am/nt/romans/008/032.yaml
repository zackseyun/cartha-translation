    issue: ሳይራራለት is not the most precise rendering of οὐκ ἐφείσατο.
    rationale: The Greek means that God did not spare or hold back his Son. ሳይራራለት foregrounds pity rather than sparing/withholding; ያልቆጠበው directly expresses the source sense.
  - severity: medium
    issue: Footnote a adds an unspecified recipient in ‘በእጃቸው አሳልፎ ሰጠው.’
    rationale: παρέδωκεν αὐτόν does not specify whose hands receive him. A lexical alternative must not add that detail.
