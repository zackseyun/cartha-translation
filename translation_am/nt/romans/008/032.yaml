  text: የገዛ ልጁን እንኳ ያልቆጠበው፣ ለሁላችን ሲል አሳልፎ የሰጠው[a][b] እርሱ፣ ከእርሱ ጋር ሁሉንም ነገር በጸጋ አይሰጠንም?[c]
  philosophy: optimal-equivalence
