id: ROM.8.35
reference: Romans 8:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: am
  text: ከመሲሑ ፍቅር[a] ማን ይለየናል? መከራ ወይስ ጭንቀት ወይስ ስደት ወይስ ራብ ወይስ እርቃን ወይስ አደጋ ወይስ ሰይፍ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኛ ለመሲሑ ካለን ፍቅር።” የግሪኩ የዝምድና ቅጥ በዚህ መንገድም ሊነበብ ይችላል፤ አውዱ ግን “መሲሑ ለእኛ ያለውን ፍቅር” ይበልጥ ይደግፋል።
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: ማን
  rationale: ግላዊ ጠያቂ ተውላጠ ስምንና የጳውሎስን አጽንዖታዊ ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: χωρίσει
  choice: ይለየናል
  rationale: የወደፊት ወይም የሊሆን የመለየት ተግባርን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: ἀγάπης
  choice: ፍቅር
  rationale: የቃሉ መደበኛና ግልጽ የአማርኛ አቻ ነው።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ / ከመሲሑ
  rationale: Χριστός እዚህ ማዕረግ ስለሆነ “መሲሕ” ተብሎ ተተርጉሟል፤ ከἀπό ጋር ተያይዞ “ከመሲሑ ፍቅር” የሚለው ቅርጽ ተፈጥሯዊ ነው።
- source_word: θλῖψις
  choice: መከራ
  rationale: ሰፊውን የግፊትና የመከራ ሐሳብ በክቡርና በሚገባ ታዋቂ ቃል ያስተላልፋል።
- source_word: στενοχωρία
  choice: ጭንቀት
  rationale: የመጨናነቅና የውስጥ ጫናን ስሜት በዘመናዊ አማርኛ ይገልጣል።
- source_word: διωγμός
  choice: ስደት
  rationale: በእምነት ምክንያት የሚደርስን ማሳደድ የሚገልጽ መደበኛ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: λιμός
  choice: ራብ
  rationale: ከባድ የምግብ እጥረትን በቀጥታ የሚገልጽ ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: γυμνότης
  choice: እርቃን
  rationale: ቀጥተኛውን ምስል እና የልብስ እጦትን የሚያመለክተውን ኃይል ይጠብቃል።
- source_word: κίνδυνος
  choice: አደጋ
  rationale: በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ የሆነ አቻ ነው።
- source_word: μάχαιρα
  choice: ሰይፍ
  rationale: ቃል በቃል ያለውን ምስልና የግድያ ስጋትን ሳያለዝብ ይጠብቃል።
theological_decisions:
- issue: በτοῦ Χριστοῦ ያለው የዝምድና ቅጥ ትርጉም
  choice: መሲሑ ለእኛ ያለው ፍቅር (“ከመሲሑ ፍቅር”)
  alternative: እኛ ለመሲሑ ያለን ፍቅር
  rationale: የግሪኩ የዝምድና ቅጥ በሁለቱም መንገድ ሊነበብ ቢችልም፣ የሮሜ 8፥31–39 አውድ መሲሑ ለአማኞች ያለውን ፍቅር ይበልጥ ይደግፋል፤ ሌላው ንባብ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተከታታይ አማራጮቹ የግሪኩን የንግግር ምት ለመጠበቅ “ወይስ” በሚለው ቃል ተያይዘዋል።
