review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the scriptural quotation, direct address to God, continual time expression, and the reckoning/slaughter image. However, “ለሞት እንዳረጋለን” is not a valid or natural rendering of the present passive θανατούμεθα and must be corrected to an ongoing passive sense.
  naturalness: The revised wording uses clear modern standard Amharic. “እንገደላለን” naturally conveys “we are being killed/put to death,” and “ለእርድ የሚሆኑ በጎች” is an idiomatic, non-interpretive expression for sheep destined for slaughter.
  terminology: “ስለ አንተ,” “ተቆጠርን,” and “እርድ” preserve the causal address, passive reckoning, and grave slaughter imagery without doctrinal expansion.
  issues:
  - severity: high
    issue: Invalid and unclear verb form in the clause rendering θανατούμεθα
    rationale: “ለሞት እንዳረጋለን” is malformed and does not clearly express the Greek present passive, “we are being put to death.” Replacing it with “እንገደላለን” restores both meaning and natural Amharic.
  - severity: low
    issue: The slaughter comparison can be made more idiomatic
    rationale: “ለእርድ እንደሚወሰዱ በጎች” is understandable but adds the action “being taken.” “ለእርድ የሚሆኑ በጎች” stays closer to the source image of sheep for slaughter.
  revised_text: እንደተጻፈው፦ “ስለ አንተ ቀኑን ሙሉ እንገደላለን፤ ለእርድ የሚሆኑ በጎች ተቆጠርን።”
