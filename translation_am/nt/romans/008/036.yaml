reference: Romans 8:36
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: am
  text: እንደተጻፈው፦ “ስለ አንተ ቀኑን ሙሉ እንገደላለን፤ ለእርድ የሚሆኑ በጎች ተቆጠርን።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: የቅዱሳት መጻሕፍትን ጥቅስ የሚያስተዋውቀውን ንጽጽራዊ ኃይልና የጽሑፉን ጸንቶ መኖር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἕνεκεν σοῦ
  choice: ስለ አንተ
  rationale: ምክንያታዊውን ‘በአንተ ምክንያት/ስለ አንተ’ ትርጉምና ወደ እግዚአብሔር የቀረበውን ቀጥተኛ ንግግር ይጠብቃል።
- source_word: θανατούμεθα
  choice: ለሞት እንዳረጋለን
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና ቀጣይ የሆነውን ለሞት መጋለጥ በክብደት ያቀርባል።
- source_word: ὅλην τὴν ἡμέραν
  choice: ቀኑን ሙሉ
  rationale: የጊዜ ቆይታውን ሙሉነትና ቀጣይነት በተለመደ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐλογίσθημεν
  choice: ተቈጠርን
  rationale: ‘እንደ አንድ ነገር መቈጠር/መታየት’ የሚለውን ተደራጊ ትርጉም በአጭርና ቀጥተኛ መንገድ ይጠብቃል።
- source_word: πρόβατα σφαγῆς
  choice: ለእርድ እንደሚወሰዱ በጎች
  rationale: ለመታረድ የተመደቡ በጎችን ምስል ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: በመከራ አውድ ውስጥ የመዝሙር 44፥22 ጥቅስ
  choice: ሕዝቡ በጋራና ያለማቋረጥ ለሞት እንደተዳረገ የሚገልጸውን ሰቆቃ ያለ ተጨማሪ ትርጓሜ ማቆየት
  alternative: ጥቅሱን በተለይ ስለ ሰማዕትነት ብቻ እንዲናገር አድርጎ መተርጎም
  rationale: ግሪኩ የጋራውን ሰቆቃና ለሞት የተመደቡ መስሎ መታየትን ያቀርባል፤ ትርጉሙ ይህን ኃይልና ውጥረት ሳያጠብ መጠበቅ አለበት።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የቅዱስ ጽሑፍ ጥቅስነቱ በኮሎንና በጥቅስ ምልክት ተጠብቋል።
