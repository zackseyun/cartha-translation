revisions:
- from: የአሁኑ ዘመን መከራዎች፣ ወደፊት ለእኛ ከሚገለጠው ክብር[a] ጋር ለመነጻጸር የሚበቁ እንዳልሆኑ እቆጥራለሁና።
  to: ምክንያቱም የአሁኑ ዘመን መከራዎች፣ ወደፊት ለእኛ ከሚገለጠው ክብር[a] ጋር የሚመጣጠኑ እንዳልሆኑ እቆጥራለሁ።
  rationale: 'The revision retains every principal source element: Paul’s reasoned judgment (Λογίζομαι), the explanatory connective (γάρ), present sufferings, their non-correspondence to the future glory, the future passive revelation, and the primary “to us” sense of εἰς ἡμᾶς. It replaces an awkward comparison phrase with an idiomatic expression of disproportion and preserves the interpretively significant alternative in the footnote.'
