  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: am
  text: ምክንያቱም የአሁኑ ዘመን መከራዎች፣ ወደፊት ለእኛ ከሚገለጠው ክብር[a] ጋር የሚመጣጠኑ እንዳልሆኑ እቆጥራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእኛ ከሚገለጠው ክብር።”
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: እቆጥራለሁ
  rationale: የታሰበበትንና በምክንያት ላይ የተመሠረተውን ግምገማ ይገልጣል፤ ተራ ስሜትን ብቻ አያመለክትም።
- source_word: γὰρ
  choice: እና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር ፍጻሜ ያሳያል።
- source_word: οὐκ ἄξια … πρὸς
  choice: ጋር ለመነጻጸር የሚበቁ እንዳልሆኑ
  rationale: በሁለቱ መካከል ያለውን እጅግ ትልቅ የክብደት ልዩነት ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: τὰ παθήματα
  choice: መከራዎች
  rationale: በሰዎች ላይ የሚደርሱ ሥቃዮችንና መከራዎችን በግልጽና በተለመደ ቃል ያስተላልፋል።
- source_word: τοῦ νῦν καιροῦ
  choice: የአሁኑ ዘመን
  rationale: የአሁኑን ጊዜ ወይም ወቅት ያለ ተጨማሪ ትርጓሜ ይገልጣል።
- source_word: τὴν μέλλουσαν δόξαν
  choice: ወደፊት … ክብር
  rationale: μέλλουσαν የሚያሳየውን ወደፊት የመሆን አቅጣጫ ይጠብቃል።
- source_word: ἀποκαλυφθῆναι
  choice: ከሚገለጠው
  rationale: ክብሩ ወደፊት እንደሚገለጥ የሚያሳየውን ተደራጊ ቅርጽ ይጠብቃል።
- source_word: εἰς ἡμᾶς
  choice: ለእኛ
  rationale: ክብሩ ለአማኞች እንደሚገለጥ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘በእኛ’ የሚለው አማራጭ ትርጉም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: εἰς ἡμᾶς ከክብሩ መገለጥ ጋር ያለው ትርጉም
  choice: ለእኛ ከሚገለጠው
  alternative: በእኛ ከሚገለጠው
  rationale: የግሪኩ ሐረግ ክብሩ ለእኛ መገለጡን ወይም በእኛ መገለጡን ሊያመለክት ይችላል። ዋናው ጽሑፍ ተፈጥሯዊውን ‘ለእኛ’ ይጠቀማል፤ ትርጓሜያዊ ክብደት ያለው ሌላው አማራጭ ግን በማስታወሻ ተቀምጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። ‘የሚበቁ’ የሚለው ቃል መከራዎቹና የሚመጣው ክብር ለንጽጽር እኩል ክብደት እንደሌላቸው በተፈጥሯዊ ንግግር ያሳያል።
