base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: am
  text: 'ከፍታም፣ ጥልቀትም፣ ሌላ ማንኛውም የተፈጠረ ነገርም[a] በጌታችን በመሲሑ ኢየሱስ[b] ውስጥ ካለው የእግዚአብሔር ፍቅር[c] ሊለየን አይችልም።


    [a] “በፍጥረት ውስጥ ያለ ሌላ ማንኛውም ነገር” ወይም “ሌላ ማንኛውም ፍጡር” ተብሎም ሊተረጎም ይችላል።

    [b] “መሲሑ ኢየሱስ” በተለምዶ “ክርስቶስ ኢየሱስ” ተብሎ ይተረጎማል።

    [c] እዚህ “የእግዚአብሔር ፍቅር” ማለት ከሁሉ ይልቅ እግዚአብሔር ለእኛ ያለው ፍቅር ማለት ይመስላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በፍጥረት ውስጥ ያለ ሌላ ማንኛውም ነገር” ወይም “ሌላ ማንኛውም ፍጡር” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “መሲሑ ኢየሱስ” በተለምዶ “ክርስቶስ ኢየሱስ” ተብሎ ይተረጎማል።
    reason: lexical_alternative
  - marker: c
    text: እዚህ “የእግዚአብሔር ፍቅር” ማለት ከሁሉ ይልቅ እግዚአብሔር ለእኛ ያለው ፍቅር ማለት ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: ከፍታ
  rationale: ከβάθος ጋር ተጣምሮ የቦታ መጠንን የሚያመለክት ተቃራኒ ጥንድ ስለሆነ፣ ቀጥተኛውንና ተፈጥሯዊውን ቃል ይጠብቃል።
- source_word: βάθος
  choice: ጥልቀት
  rationale: ከὕψωμα ጋር ያለውን የከፍታና የጥልቀት ንጽጽር በግልጽ ያስተላልፋል።
- source_word: κτίσις ἑτέρα
  choice: ሌላ ማንኛውም የተፈጠረ ነገር
  rationale: κτίσις ፍጥረትን ወይም ፍጡርን ሊያመለክት ይችላል፤ ይህ አተረጓጎም በተፈጠረው ሥርዓት ውስጥ ያለ ምንም ነገር ሊለየን እንደማይችል ያሳያል፣ ἑτέραንም “ሌላ” ብሎ ይጠብቃል።
- source_word: δυνήσεται
  choice: ሊለየን አይችልም
  rationale: በአማርኛ ተፈጥሯዊ በሆነ አሉታዊ የችሎታ አገላለጽ የወደፊቱን የማይቻልነት ያስተላልፋል።
- source_word: χωρίσαι
  choice: ሊለየን
  rationale: በእግዚአብሔር ፍቅርና በአማኞች መካከል መለያየትን ቀጥተኛና ግልጽ በሆነ ቃል ይገልጣል።
- source_word: ἀγάπης τοῦ θεοῦ
  choice: የእግዚአብሔር ፍቅር
  rationale: የግሪኩን የባለቤትነት አወቃቀር ጠብቆ የፍቅሩን አቅጣጫ በዋናው ጽሑፍ አይገድብም።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ ውስጥ
  rationale: Χριστόςን እንደ ማዕረግ “መሲሕ” ብሎ ይተረጉማል፤ ἐνንም “በ…ውስጥ” በማለት የግሪኩን አገላለጽ ይጠብቃል።
- source_word: κυρίῳ ἡμῶν
  choice: በጌታችን
  rationale: κύριοςን በተለመደውና ክብር ባለው “ጌታ” ይተረጉማል፣ ἡμῶνንም በቅጥያ ያስተላልፋል።
theological_decisions:
- issue: “የእግዚአብሔር ፍቅር” የሚለው የግሪክ የባለቤትነት አወቃቀር ትርጉም
  choice: በዋናው ጽሑፍ አሻሚነቱን መጠበቅ፤ በአውዱ ግን እግዚአብሔር ለእኛ ያለው ፍቅር እንደሆነ በማስታወሻ ማመልከት
  alternative: እኛ ለእግዚአብሔር ያለን ፍቅር፣ ወይም ሁለቱንም የሚያካትት ሰፊ ትርጉም
  rationale: ሮሜ 8፥31-39 የእግዚአብሔርን ለሕዝቡ የሚያደርገውን ተግባር ያጎላል፤ ሆኖም የምንጩን ሰዋሰዋዊ ቅርጽ በዋናው ጽሑፍ መጠበቅ አግባብ ነው።
- issue: Χριστός እንደ ማዕረግ ወይስ እንደ ተለምዶ ስም መቅረብ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: የግሪኩ ቃል “የተቀባው/መሲሑ” የሚል ማዕረግ ስለሆነ ትርጉሙን የሚገልጠው ቅርጽ በዋናው ጽሑፍ ተመርጧል፤ ባህላዊው ቅርጽ በማስታወሻ ቀርቧል።
