  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ ተከታታይ የክህደት አገላለጽ በ“-ም” ቅጥያ ተጠብቋል።
