lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: እንግዲህ ... ምን እንላለን?
  rationale: የግሪኩን መደምደሚያ አገናኝነትና የምክክር መልክ ያለውን የወደፊት ጊዜ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πρὸς ταῦτα
  choice: ስለ እነዚህ ነገሮች
  rationale: πρός እዚህ ቀደም ሲል ከተነገሩት ጉዳዮች ጋር ያለውን ማጣቀሻ ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: εἰ
  choice: ከሆነ
  rationale: የግሪኩን ሁኔታዊ ቅርጽ ይጠብቃል፤ አውዱ ግን የእግዚአብሔርን ድጋፍ ጥርጣሬ ውስጥ እንደማያስገባ ያሳያል።
- source_word: ὑπὲρ ἡμῶν
  choice: ከእኛ ጋር
  rationale: በዚህ አውድ ያለውን የድጋፍና የወገንተኝነት ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ለእኛ’ የሚለውም የቅርብ አማራጭ ነው።
- source_word: τίς καθ’ ἡμῶν
  choice: ማን ይቃወመናል?
  rationale: የተቃውሞን ፍቺና የአነጋገሩን ድል አድራጊ የአጻጻፍ ጥያቄ በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የεἰ ὁ θεὸς ὑπὲρ ἡμῶν ሁኔታዊ ኃይል
  choice: ዋናው ጽሑፍ ‘እግዚአብሔር ከእኛ ጋር ከሆነ’ ብሎ የሁኔታውን ቅርጽ ጠብቋል።
  alternative: ‘እግዚአብሔር ከእኛ ጋር ስለሆነ’
  rationale: εἰ በቅርጹ ‘ከሆነ’ ነው፤ ነገር ግን የጥያቄው አውድ ሁኔታውን እንደ እውነት ተቀብሎ የሚናገር ስለሆነ ‘ስለሆነ’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- issue: የὑπὲρ ἡμῶν ትርጉም
  choice: ‘ከእኛ ጋር’ ተብሎ የድጋፍና የወገንተኝነት ሐሳቡ ተገልጧል።
  alternative: ‘ለእኛ’ ወይም ‘በእኛ ወገን’
  rationale: ὑπέρ በዚህ ስፍራ እግዚአብሔር ለሕዝቡ እንደሚደግፍ ይገልጣል፤ ‘ከእኛ ጋር’ በአማርኛ ተፈጥሯዊ ሲሆን ይህን አቋም በግልጽ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ተከታታይ የአጻጻፍ ጥያቄዎችና የοὖν መደምደሚያ ኃይል ተጠብቀዋል።
