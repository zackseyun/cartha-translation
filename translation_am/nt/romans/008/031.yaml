translation:
  language: am
  text: 31 እንግዲህ ስለ እነዚህ ነገሮች ምን እንላለን?[a] እግዚአብሔር በእኛ ወገን ከሆነ፣[b] ማን ይቃወመናል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእነዚህ ነገሮች ምን እንላለን?”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እግዚአብሔር በእኛ ወገን ስለሆነ፣ ማን ይቃወመናል?”
