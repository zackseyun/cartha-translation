  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ጥቅሱ በግሪክ እንደሚያደርገው ወደ ቁጥር 39 የሚቀጥል ዝርዝር ስለሆነ በነጠላ ሰረዝ ተዘግቷል። ይሁንና πέπεισμαι በተሰጠው የቁጥር ክፍል ውስጥ ስላለ፣ ዋናው ጽሑፍ በራሱ ሲታይ ‘እኔ እርግጠኛ ነኝ’ የሚለውን መግቢያ መያዝ ይገባዋል።
