theological_decisions:
- issue: ἀρχαὶ እና δυνάμεις ለመንፈሳዊ ፍጥረታት ቴክኒካዊ ስያሜዎች እንደሆኑ መተርጎም አለመተርጎም
  choice: በዋናው ጽሑፍ ‘ገዥዎች’ እና ‘ኃይላት’ የሚሉትን ሰፊ አቻዎች መጠቀም
  alternative: ‘አለቆችና ኃይላት’ ወይም በግልጽ ‘መንፈሳዊ ገዥዎችና ኃይላት’ ማለት
  rationale: ዝርዝሩ ኮስሚክ ወይም መንፈሳዊ ሥልጣናትን ሳይጨምር አይቀርም፤ ሆኖም የግሪክ ቃላት ራሳቸው ሰፊ ናቸው። ትርጉሙ ይህን ስፋትና የሥነ መለኮት ውጥረት ሳይፈታ ይጠብቃል።
