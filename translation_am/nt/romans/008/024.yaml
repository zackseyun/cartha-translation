  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: am
  text: በተስፋ ድነናልና።[a] የሚታይ ተስፋ ግን ተስፋ አይደለም፤[b] የሚያየውን ማን ተስፋ ያደርጋል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በተስፋ አማካይነት ድነናል።»
    reason: alternative_reading
  - marker: b
    text: ይህም ተስፋ ገና ያልታየውን ነገር እንደሚመለከት ማለት ነው።
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: በተስፋ
  rationale: የግሪኩ ዳቲቭ እዚህ የሁኔታን ወይም የአኳኋንን ትርጉም ሊያመለክት ይችላል። «በተስፋ» በአማርኛ ይህን ትርጉም በተፈጥሮ ይይዛል፤ ይሁንና እንደ መሣሪያም ሊሰማ ስለሚችል ሌላው ንባብ በማስታወሻ ተገልጧል።
- source_word: ἐσώθημεν
  choice: ድነናል
  rationale: የአንድ ጊዜ የተፈጸመውን የግሪክ አኦሪስት እና ተገብሮአዊ ድምፁን በተፈጥሮ አማርኛ ያስተላልፋል፤ መዳኑ የተፈጸመ ሆኖ የአሁን ውጤት እንዳለውም ያሳያል።
- source_word: ἐλπὶς ... βλεπομένη
  choice: የሚታይ ተስፋ
  rationale: የግሪኩን ተሳቢ ቅጽ በተፈጥሮ የአማርኛ አገናኝ ሐረግ በመተርጎም በተስፋና በማየት መካከል ያለውን ተቃርኖ ይጠብቃል።
- source_word: οὐκ ἔστιν ἐλπίς
  choice: ተስፋ አይደለም
  rationale: የግሪኩን ጥራታዊ አሉታዊ ፍርድ ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὃ γὰρ βλέπει
  choice: የሚያየውን
  rationale: ገለልተኛውን አንጻራዊ ተውላጠ ስም እንደ ነገር በመያዝ «የሚያየውን» ተብሎ ተተርጉሟል፤ አገላለጹ ሰውየው የሚያየውን ነገር ያመለክታል።
- source_word: τίς ἐλπίζει
  choice: ማን ተስፋ ያደርጋል?
  rationale: የግሪኩን አጠቃላይ አነጋገርና የክርክር ጥያቄ በቀጥታ ያስተላልፋል፤ ጾታን አይወስንም።
theological_decisions:
- issue: በτῇ ἐλπίδι ἐσώθημεν ውስጥ በመዳንና በተስፋ መካከል ያለው ግንኙነት
  choice: ዋናው ጽሑፍ «በተስፋ ድነናል» ይላል፤ ይህም መዳን እውን እንደሆነና ሙሉ መገለጡ ግን ገና እንደሚጠበቅ ያለውን ውጥረት ይጠብቃል።
  alternative: «ተስፋ አድርገን ድነናል» ወይም ተስፋን የመዳን መሣሪያ አድርጎ የሚያሰማ ንባብ።
  rationale: አውዱ መዳን አሁን የተገኘ ሆኖ ፍጻሜው ወደፊት እንደሚገለጥ ያሳያል። ትርጉሙ ተስፋን የመዳን ውጤታማ ምክንያት አድርጎ ሳይወስን ይህን ውጥረት ይጠብቃል።
