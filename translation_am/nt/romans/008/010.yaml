- source_word: διὰ ἁμαρτίαν
  choice: በኃጢአት ምክንያት
  rationale: διά ከተሳቢ ጋር እዚህ ምክንያትን ያሳያል፤ ‘በ…ምክንያት’ የጳውሎስን ምክንያታዊ አመክንዮ በግልጽ አማርኛ ያስተላልፋል።
