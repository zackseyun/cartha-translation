  rationale: σῶμα አካላዊውን ሰውነት ያመለክታል፤ ከπνεῦμα ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ለማቆየት ‘ሥጋችሁ’ ተመርጧል። የሁለተኛ መደብ ብዙ ቁጥር አመልካች ቅጥያው ከὑμῖν ተሟልቷል።
- source_word: νεκρὸν
