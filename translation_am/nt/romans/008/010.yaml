lexical_decisions:
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ይዞ ስለሚታይ፣ በዘመናዊ አማርኛ የተለመደውንና የተቀባውን ‘መሲሕ’ የሚያመለክተው ‘መሲሑ’ ተመርጧል።
- source_word: σῶμα
