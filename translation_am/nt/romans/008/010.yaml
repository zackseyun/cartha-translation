  rationale: ግሪኩ በቀጥታ ‘የሞተ’ ይላል። ይህ በኃጢአት ሥር ያለውን ሟችነት ሊያመለክት ቢችልም፣ ዋናው ጽሑፍ የምንጩን ጠንካራ አገላለጽ ይጠብቃል።
- issue: የδικαιοσύνη ትርጉም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ በዚህ የጳውሎስ አገባብ የተለመደና ሰፊ ትርጉሙን የሚጠብቅ ነው፤ ‘ፍትሕ’ ብቻ ማለት ትርጉሙን ወደ ሕጋዊ ፍትሕ ሊያጠብ ይችላል።
