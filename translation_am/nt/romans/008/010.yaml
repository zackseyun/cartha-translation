- source_word: διὰ δικαιοσύνην
  choice: በጽድቅ ምክንያት
  rationale: δικαιοσύνη በጳውሎስ አጠቃቀም ‘ጽድቅ’ ተብሎ በተፈጥሯዊና የተለመደ መንገድ ይተረጎማል፤ διά የምክንያት ኃይሉን ጠብቆ ‘በ…ምክንያት’ ተብሏል።
theological_decisions:
