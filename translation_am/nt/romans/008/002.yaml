  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: am
  text: ምክንያቱም በመሲሑ ኢየሱስ[c] ያለው የሕይወት መንፈስ የሆነው ሕግ[a] ከኃጢአትና ከሞት ሕግ ነፃ አውጥቶሃል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መርሕ”፦ “የሕይወት መንፈስ መርሕ።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “አንተን” በሚለው ፈንታ “እኔን” ይላሉ።
    reason: textual_variant
  - marker: c
    text: በተለምዶ፦ “በክርስቶስ ኢየሱስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ሕግ
  rationale: በሁለቱም ቦታዎች የጳውሎስን የቃል ድግግሞሽና የምሳሌያዊ ንጽጽር ውጥረት ለመጠበቅ “ሕግ” ተብሎ ተተርጉሟል፤ “መርሕ” የሚለው ትርጉም ቢቻልም የቃሉን የትርጉም ስፋት ቀድሞ ይገድባል።
- source_word: πνεύματος
  choice: መንፈስ
  rationale: በሮሜ 8 ዐውድ ውስጥ ሕይወትን የሚሰጠውን ቅዱስ መንፈስ እንደሚያመለክት ተወስዷል።
- source_word: ζωῆς
  choice: ሕይወት
  rationale: “የሕይወት መንፈስ” የሚለውን የግሪክ ሐረግ ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστός እንደ ማዕረግ “መሲሕ” ተብሎ ተተርጉሟል፤ ἐν ደግሞ ጳውሎስ ከመሲሑ ጋር ስላለው ኅብረት የሚገልጽበትን ቋንቋ ለመጠበቅ “በ” ተብሎ ቀርቧል።
- source_word: ἠλευθέρωσέν
  choice: ነፃ አውጥቶሃል
  rationale: የተፈጸመውን የነፃ ማውጣት ተግባርና አሁን ያለውን ውጤቱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: σε
  choice: አንተን (በግስ ቅጥ፦ ነፃ አውጥቶሃል)
  rationale: የSBLGNTን ሁለተኛ መደብ ነጠላ ንባብ ተከትሏል፤ የ“እኔን” ልዩ ንባብ በማስታወሻ ተጠብቋል።
- source_word: ἁμαρτίας
  choice: ኃጢአት
  rationale: መደበኛውን ትርጉም ይጠብቃል፤ ነጠላ ቁጥሩም ኃጢአትን እንደ ገዢ ኃይልም ሆነ እንደ አጠቃላይ እውነታ ለማሳየት ይስማማል።
- source_word: θανάτου
  choice: ሞት
  rationale: መደበኛው ትርጉም ሲሆን “ኃጢአትና ሞት” የሚለውን የተጣመረ ሐረግ በአጭሩ ይጠብቃል።
theological_decisions:
- issue: πνεύματος ቅዱስ መንፈስን ወይስ የሰውን መንፈስ/መንፈሳዊ መርሕ ያመለክታል?
  choice: ቅዱስ መንፈስን እንደሚያመለክት “መንፈስ”
  alternative: የሰው መንፈስ ወይም መንፈሳዊ መርሕ
  rationale: በሮሜ 8 ውስጥ በሥጋ፣ በኃጢአትና በሞት ተቃራኒ ሆኖ ሕይወትን የሚሰጠው መለኮታዊ መንፈስ በግልጽ ስለሚታይ፣ ይህ ንባብ ከዐውዱ ጋር ይበልጥ ይስማማል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ምክንያቱም” የγὰρን ምክንያታዊ ግንኙነት ያሳያል፤ የ“ሕግ” ድግግሞሽና የ“በመሲሑ ኢየሱስ” ኅብረት ቋንቋ ተጠብቀዋል።
