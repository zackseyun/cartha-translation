  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: am
  text: ነገር ግን የማናየውን ተስፋ ብናደርግ፣ በትዕግሥት[a] እንጠብቀዋለን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጽናት።”
    reason: lexical_alternative
  - marker: b
    text: “እንጠብቀዋለን” የሚለው ግስ “በጉጉት እንጠብቀዋለን” የሚል ጥላ ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን ... ከሆነ
  rationale: የεἰን ሁኔታዊ ኃይልና የδέን መጠነኛ ንጽጽራዊ ቅጥያ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὃ οὐ βλέπομεν
  choice: የማናየውን
  rationale: ገለልተኛውን አንጻራዊ ተውላጠ ስም በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ማየት የማንችለውን’ በማለት የችሎታ ሐሳብ አይጨምርም።
- source_word: ἐλπίζομεν
  choice: ተስፋ የምናደርግ
  rationale: ቀጣይነት ያለውን የተስፋ አቋም በዘመናዊና ክቡር አማርኛ ይገልጣል።
- source_word: δι’ ὑπομονῆς
  choice: በትዕግሥት
  rationale: ὑπομονή በመዘግየትና በችግር ውስጥ ጸንቶ መቆየትን ያካትታል፤ ‘ትዕግሥት’ ተፈጥሯዊና ሰፊ ትርጉም ያለው ምርጫ ነው።
- source_word: ἀπεκδεχόμεθα
  choice: እንጠብቀዋለን
  rationale: የሚጠበቀውን ነገር በተስፋ መጠበቅን በግልጽ አማርኛ ይገልጣል፤ የጉጉት ጥላ ትርጉሙ በአማራጭ ማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የክርስቲያናዊ ተስፋ ከማይታየው የወደፊት ፍጻሜ ጋር ያለው ግንኙነት
  choice: የተስፋው ነገር ‘የማናየው’ ተብሎ ብቻ ቀርቧል።
  alternative: ከአውዱ በመነሳት ‘ድነት፣’ ‘ቤዛነት’ ወይም ‘ትንሣኤ’ ብሎ ማስፋት።
  rationale: ቅርብ አውዱ የተስፋውን ነገር ቢያብራራም፣ ጥቅሱ ራሱ በአንጻራዊው ሐረግ ብቻ ይገልጠዋል፤ ትርጉሙም ይህን ጽሑፋዊ ገደብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። አጭሩ የግሪክ ዓረፍተ ነገር መዋቅር በተፈጥሯዊ የአማርኛ ሁኔታዊ አገባብ ቀርቧል።
