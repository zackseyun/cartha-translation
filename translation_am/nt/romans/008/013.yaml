  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: am
  text: ምክንያቱም በሥጋ[a] ብትኖሩ ልትሞቱ ነው፤ ነገር ግን በመንፈስ የሰውነትን ሥራዎች ብትገድሉ፣ ትኖራላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በሥጋ» በዚህ አውድ በሥጋዊ ፍላጎት መመራትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: የቁጥሩን ሐሳብ ከቀደመው ክርክር ጋር የሚያያይዘውን ማብራሪያዊ ኃይል ይጠብቃል።
- source_word: κατὰ σάρκα
  choice: እንደ ሥጋ
  rationale: κατά የሚያመለክተውን መመሪያ ወይም አኗኗር እና የσάρξን ጥሬ ምስላዊ ቃል ይጠብቃል፤ ትርጉሙን ‘የኃጢአት ተፈጥሮ’ በማለት አይወስንም።
- source_word: ζῆτε
  choice: ብትኖሩ
  rationale: በሁኔታዊው አረፍተ ነገር ውስጥ ያለውን የአሁን ጊዜ ቀጣይ አኗኗር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μέλλετε ἀποθνῄσκειν
  choice: ልትሞቱ ነው
  rationale: μέλλω ከግስ ስም ጋር የሚሰጠውን የሚመጣ ወይም የተጠበቀ ውጤት በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የመሣሪያ ወይም የአድራጊ ኃይል ዳቲቭን ይጠብቃል፤ በሮሜ 8 አውድ ‘መንፈስ’ በዋናነት መንፈስ ቅዱስን ያመለክታል።
- source_word: τὰς πράξεις τοῦ σώματος
  choice: የሰውነትን ሥራዎች
  rationale: የπράξειςን ተግባራዊ ሥነ ምግባራዊ ትርጉምና የτοῦ σώματοςን የባለቤትነት ግንኙነት በግልጽነት ይጠብቃል።
- source_word: θανατοῦτε
  choice: ብትገድሉ
  rationale: የግሱን ጠንካራ እና ወሳኝ ኃይል በቀጥተኛና ለዘመኑ ተናጋሪ ግልጽ ቃል ይገልጣል።
- source_word: ζήσεσθε
  choice: በሕይወት ትኖራላችሁ
  rationale: የወደፊት ጊዜውን ተስፋ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘መኖር’ ከቀደመው ሞት ጋር ያለውን ንፅፅር ይጠብቃል።
theological_decisions:
- issue: πνεύματι መንፈስ ቅዱስን ወይስ የሰውን መንፈስ ያመለክታል?
  choice: በዋናው ጽሑፍ ‘በመንፈስ’ ተብሎ መንፈስ ቅዱስን እንዲያመለክት ተደርጓል።
  alternative: በሰው መንፈስ፣ ወይም ሆን ብሎ ያልተወሰነ ‘መንፈስ’
  rationale: በሮሜ 8 ያለው ቀጥተኛ አውድ ኃጢአታዊ ተግባርን ለመግደል ኃይል የሚሰጠው መንፈስ ቅዱስ መሆኑን በጠንካራ ሁኔታ ይደግፋል።
- issue: σάρξን በትርጓሜ መወሰን
  choice: ‘ሥጋ’ የሚለውን የምንጭ ምስላዊ ቃል በዋናው ጽሑፍ ማቆየት
  alternative: ‘ኃጢአተኛ ተፈጥሮ’
  rationale: ‘ኃጢአተኛ ተፈጥሮ’ በአውዱ የሚቻል ማብራሪያ ቢሆንም የጳውሎስን ‘ሥጋ/ሰውነት’ የቃላት ውጥረት እና የσάρξን ሰፊ ትርጉም ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሥጋ’ እና ‘ሰውነት’ በመለየት የσάρξ እና σώμα ልዩነት ተጠብቋል።
