  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: am
  text: የሥጋ[a] አስተሳሰብ ሞት ነውና፤ የመንፈስ[b] አስተሳሰብ ግን ሕይወትና ሰላም ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የኃጢአት ባሕርይ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ እዚህ «መንፈስ» የሰውን መንፈስ ወይም መንፈስን በጠቅላላ ትርጉሙ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ነውና
  rationale: የቁጥሩን ሐሳብ ከቀደመው ክርክር ጋር የሚያገናኘውን ምክንያታዊና ገላጭ ኃይል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: φρόνημα
  choice: አስተሳሰብ
  rationale: ቃሉ የአእምሮ ድርጊትን ብቻ ሳይሆን የጸና ዝንባሌንና አቅጣጫንም ያመለክታል፤ «አስተሳሰብ» ይህን ስፋት በዘመናዊ አማርኛ ይይዛል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: የጳውሎስን ቁልፍ ቃልና የሥነ መለኮት ውጥረቱን ይጠብቃል፤ ትርጓሜያዊው «ኃጢአተኛ ባሕርይ» በማስታወሻ ቀርቧል።
- source_word: θάνατος
  choice: ሞት
  rationale: የግሪኩን ቀጥተኛ ትርጉምና ከ«ሕይወት» ጋር ያለውን ጠንካራ ተቃርኖ ይጠብቃል።
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: በሮሜ 8 ዐውድ ውስጥ በዋናነት የእግዚአብሔርን መንፈስ ያመለክታል፤ አማርኛ የአቢይና ንዑስ ፊደል ልዩነት ስለሌለው አማራጩ ትርጉም በማስታወሻ ተገልጧል።
- source_word: ζωή
  choice: ሕይወት
  rationale: ቀጥተኛና የተለመደ ትርጉም ሲሆን ከ«ሞት» ጋር ያለውን አጭር ተቃርኖ ይጠብቃል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የቃሉን ሰፊ ሥነ መለኮታዊ ክብደት በተፈጥሯዊ አማርኛ የሚገልጥ መደበኛ ትርጉም ነው።
theological_decisions:
- issue: πνεῦμα መንፈስ ቅዱስን ወይስ የሰውን መንፈስ ያመለክታል?
  choice: በዐውዱ መሠረት «መንፈስ» የሚለው መንፈስ ቅዱስን እንደሚያመለክት ተወስዷል።
  alternative: የሰው መንፈስ ወይም መንፈስ በጠቅላላ ትርጉሙ።
  rationale: በሮሜ 8 ቅርብ ዐውድ ሥጋ ሕይወትን ከሚሰጠው መለኮታዊ መንፈስ ጋር በተደጋጋሚ ይነጻጸራል። ሆኖም የግሪኩ ቃልና የአማርኛው አጻጻፍ ሌላውን ንባብ በራሳቸው አይዘጉም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ መደበኛ አማርኛን ይጠቀማል። «የ… አስተሳሰብ» የሚለው ትይዩ አወቃቀር የግሪኩን ሚዛናዊ ተቃርኖ ይጠብቃል፤ «ነውና» ደግሞ γὰρ ያለውን ከቀደመው ሐሳብ ጋር የማገናኘት ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
