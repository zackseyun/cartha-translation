id: ROM.8.11
reference: Romans 8:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: am
  text: ነገር ግን በእናንተ ውስጥ የሚኖረው መንፈስ ኢየሱስን ከሙታን ካስነሣው የሆነ ከሆነ፣ መሲሕ ኢየሱስን[b] ከሙታን ያስነሣው፣ በእናንተ ውስጥ በሚኖረው በመንፈሱ ምክንያት[a] ሟች ሰውነቶቻችሁንም ሕያዋን ያደርጋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእናንተ ውስጥ በሚኖረው በመንፈሱ አማካይነት።”
    reason: alternative_reading
  - marker: b
    text: ግሪክኛው “ክርስቶስ ኢየሱስ” ይላል፤ ክርስቶስ በዚህ ስፍራ የማዕረግ ኃይል ስላለው “መሲሕ ኢየሱስ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: በጳውሎስ አሳብ ውስጥ ጠቋሚው የእግዚአብሔር መንፈስ ስለሆነ፣ ቃሉ በሁለቱም ስፍራ በዚህ መልኩ ተተርጉሟል።
- source_word: ἐγείραντος / ἐγείρας
  choice: ያስነሣው
  rationale: በዚህ ዐውድ ቃሉ ከሞት መነሣትን የሚያመለክት ሲሆን፣ የአማርኛው አገላለጽም ድርጊቱን በግልጽ ያሳያል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: የብዙ ቁጥር የግሪክ አገላለጹን በቀጥታና በተለመደ አማርኛ ያቀርባል።
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: የሚኖር / በሚኖረው
  rationale: የውስጥ መኖርን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ በሁለቱ የተዛመዱ ቃላትም መካከል የቃል ተከታታይነትን ይጠብቃል።
- source_word: Χριστὸν Ἰησοῦν
  choice: መሲሕ ኢየሱስን
  rationale: Χριστός በዚህ ስፍራ የማዕረግ ኃይሉን እንዲያቆይ “መሲሕ” ተብሎ ተተርጉሟል፤ የግሪኩ የስም ቅደም ተከተልም ተጠብቋል።
- source_word: ζῳοποιήσει
  choice: ሕያዋን ያደርጋል
  rationale: የወደፊት ጊዜውንና ሕይወት የመስጠት ድርጊቱን ግልጽ አድርጎ ያቀርባል።
- source_word: θνητὰ σώματα
  choice: ሟች ሰውነቶቻችሁ
  rationale: የሰውነቶቹን ሟችነትና አካላዊነት ሳያደበዝዝ በአጭር አማርኛ ይገልጣል።
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: በእናንተ ውስጥ በሚኖረው በመንፈሱ ምክንያት
  rationale: በቀረበው የSBLGNT ንባብ διά ከመስተዋድድ ተሳቢ ጋር ስለመጣ፣ ዋናው ጽሑፍ የምክንያት ፍቺውን ይከተላል።
theological_decisions:
- issue: በመጨረሻው ሐረግ διά ከመስተዋድድ ተሳቢ ጋር ያለው የምክንያት ወይም የመሣሪያ ፍቺ
  choice: በመንፈሱ ምክንያት
  alternative: በመንፈሱ አማካይነት
  rationale: ዋናው ጽሑፍ በቀረበው የግሪክ ንባብ ያለውን ቀጥተኛ ሰዋሰዋዊ ፍቺ ይይዛል፤ በትርጉም ባህል የተለመደው የመሣሪያ ፍቺ ግን በማስታወሻ ተጠብቋል።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ተለመደ ስያሜ መቅረቡ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ዐውድ የማዕረግ ኃይሉን እንዳለ ማቅረብ ተመርጧል፤ በአማርኛ የተለመደው ቅርጽ በማስታወሻ ቀርቧል።
