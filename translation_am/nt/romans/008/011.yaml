  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “የሚኖር/በሚኖረው” የሚለው ድግግሞሽ በግሪኩ οἰκεῖ/ἐνοικοῦν መካከል ያለውን የቃል ግንኙነት ለማሳየት ሆን ተብሎ ተጠብቋል።
