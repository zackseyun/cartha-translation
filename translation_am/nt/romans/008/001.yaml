lexical_decisions:
- source_word: Οὐδὲν
  choice: ከቶ ... የለባቸውም
  rationale: የግሪክኛውን ፍጹም አሉታዊ አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄρα
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: νῦν
  choice: አሁን
  rationale: ጳውሎስ የሚያጎላውን የአሁኑን እውነታ በግልጽ ይጠብቃል።
- source_word: κατάκριμα
  choice: የኩነኔ ፍርድ
  rationale: ቃሉ የሚያመለክተውን የፍርድ ቤት የጥፋተኝነት ውሳኔና ቅጣት ይገልጣል፤ ስሜታዊ የበደለኝነት ስሜት ብቻ እንዳይመስልም «ፍርድ» ተጨምሯል።
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሕ ኢየሱስ ውስጥ ላሉት
  rationale: ἐν የሚለውን «ውስጥ» በማለት ጠብቆ፣ ከመሲሑ ጋር ያለውን ኅብረትና ተሳትፎ ያልፈታ ሰፊ ሐሳብ ያስቀራል።
- source_word: Χριστῷ
  choice: መሲሕ
  rationale: የቅቡዕ ንጉሥ ማዕረግ ትርጉሙ በዐውዱ ሕያው ስለሆነ ትርጉሙን የሚያሳየው «መሲሕ» ተመርጧል፤ «ክርስቶስ» በማስታወሻ ቀርቧል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: በአማርኛ የተለመደው የግሪክኛው የግል ስም አጻጻፍ ነው።
theological_decisions:
- issue: «በመሲሕ ኢየሱስ ውስጥ» የሚለው ሐረግ ትርጉም
  choice: የመሲሕ የሆኑትንና ከእርሱ ጋር ኅብረት ያላቸውን የሚጠቁም የኅብረት/የተሳትፎ ሐረግ ሆኖ ተጠብቋል።
  alternative: «በመሲሕ ኢየሱስ ምክንያት» የሚል የምክንያት ትርጉም።
  rationale: ἐν የሚለውን «ውስጥ» ብሎ መተርጎም የጳውሎስን የኅብረትና የተሳትፎ ትርጉም ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ኩነኔ» የፍርድ ቃል መሆኑን ለማጉላት «ፍርድ» ጋር ተጣምሯል፤ የግሪክኛው ድምዳሜ፣ የጊዜ አጽንዖትና የ«ውስጥ» ምስል ተጠብቀዋል።
