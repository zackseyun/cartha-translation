    text: አንዳንድ የኋለኞቹ የእጅ ጽሑፎች፦ «እንደ ሥጋ የማይመላለሱት» የሚለውን ይጨምራሉ። እጅግ ጥንታዊ የሆኑት የግሪክኛ ምስክሮች ግን እዚህ አጭሩን ንባብ ይደግፋሉ።
