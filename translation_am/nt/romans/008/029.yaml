  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: am
  text: ምክንያቱም አስቀድሞ ያወቃቸውን[a]፣ ከልጁ አምሳል ጋር ተመሳሳይ እንዲሆኑ አስቀድሞ ወሰናቸው፤ ይህም እርሱ በብዙ ወንድሞች[b] መካከል በኵር እንዲሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀድሞ ያወቃቸውን።” አንዳንዶች እዚህ ያለውን “ማወቅ” በግንኙነታዊ ትርጉም፣ ማለትም “አስቀድሞ ትኩረቱን ያደረገባቸውን” ብለው ይረዱታል።
    reason: alternative_reading
  - marker: b
    text: “ወንድሞች” በሰዋስው ወንዳዊ ቃል ቢሆንም፣ እዚህ በእግዚአብሔር ቤተሰብ ያሉትን ወንዶችና ሴቶች ሁሉ ሊያካትት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: አስቀድሞ ያወቃቸውን
  rationale: የግሪኩን ‘አስቀድሞ ማወቅ’ ቀጥተኛ ትርጉም ይጠብቃል፤ ማወቁ የእውቀት ብቻ ወይም የግንኙነት ምርጫ መሆኑን በትርጉሙ አይወስንም።
- source_word: προώρισεν
  choice: አስቀድሞ ወሰናቸው
  rationale: ግሱ የሚገልጸውን አስቀድሞ መወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: συμμόρφους τῆς εἰκόνος
  choice: የልጁን አምሳል የሚመስሉ እንዲሆኑ
  rationale: የቅርጽና የመልክ መመሳሰልን ይገልጻል፤ ‘አምሳል’ የεἰκώνን መጽሐፍ ቅዱሳዊ ድምፀት ይጠብቃል።
- source_word: υἱοῦ αὐτοῦ
  choice: የልጁን
  rationale: ግልጽ የልጅነት ማዕረጉን በቀጥታ ይጠብቃል።
- source_word: εἰς τὸ εἶναι
  choice: ይህም … እንዲሆን ነው
  rationale: የግሪኩን ዓላማ ወይም ውጤት የሚገልጽ አወቃቀር ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πρωτότοκον
  choice: በኵር
  rationale: ‘የመጀመሪያ ልጅ’ የሚለውን መሠረታዊ ምሳሌያዊ ቃልና ከእርሱ ጋር የተያያዘውን ቀዳሚነት ይጠብቃል።
- source_word: ἀδελφοῖς
  choice: ወንድሞች
  rationale: በግሪክ ያለውን ወንዳዊ ብዙ ቁጥር በዋናው ጽሑፍ ይወክላል፤ ሴቶችንም ሊያካትት የሚችለው አጠቃቀም በማስታወሻ ተገልጿል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት ያሳያል።
