- issue: στεναγμοῖς ἀλαλήτοις የሚያመለክተው ድምፆች ሊነገሩ የማይችሉ ናቸው ወይስ በቃል ያልተነገሩ
  choice: በቃላት ሊገለጹ በማይችሉ የልቅሶ ድምፆች
  alternative: በቃል ባልተነገሩ የልቅሶ ድምፆች
  rationale: ἀλάλητος ሁለቱንም ጥላዎች ሊይዝ ይችላል። ዋናው ትርጉም በዐውዱ የሚስማማውን “ሊገለጹ የማይችሉ” ይጠቀማል፤ ሌላው እውነተኛ የቃሉ አማራጭ በማስታወሻ ተጠብቋል።
