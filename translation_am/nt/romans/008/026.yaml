- source_word: στεναγμοῖς ἀλαλήτοις
  choice: በቃላት ሊገለጹ በማይችሉ የልቅሶ ድምፆች
  rationale: στεναγμοῖς የጥልቅ ሐዘን ወይም ምጥ ድምፅን ያመለክታል፤ ἀλαλήτοις ግን “ያልተነገሩ” ወይም “ሊገለጹ የማይችሉ” ሊሆን ስለሚችል ዋናው ጽሑፍ ተፈጥሯዊውን አገላለጽ ይጠቀማል፣ አማራጮቹም በማስታወሻ ተጠብቀዋል።
