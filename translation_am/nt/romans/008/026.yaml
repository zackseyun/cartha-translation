  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: am
  text: እንዲሁም መንፈስ በድካማችን ይረዳናል፤ ምክንያቱም እንደሚገባ ምን እንድንጸልይ አናውቅም፤ ነገር ግን መንፈስ ራሱ በቃላት ሊገለጹ በማይችሉ ማቃሰቶች[a] ስለ እኛ ይማልዳል፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቃል ባልተነገሩ ማቃሰቶች” ወይም “ቃል በሌላቸው ማቃሰቶች።”
