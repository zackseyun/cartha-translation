lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: እንዲሁም
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ተመሳሳይነትና ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συναντιλαμβάνεται
  choice: ይረዳናል
  rationale: ግሱ ከሰው ጋር አብሮ ሸክምን መያዝና ወደ እርዳታ መምጣትን ያመለክታል፤ በዐውዱ ውስጥ “ይረዳናል” ተፈጥሯዊና ግልጽ ነው።
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: በድካማችን
  rationale: ነጠላውን የግሪክ ቅርጽ ይጠብቃል፤ የሰውን ውሱንነት ያለ አላስፈላጊ ማጥበብ ይገልጻል።
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: ምክንያቱም እንደሚገባ ምን እንድንጸልይ
  rationale: τίን “ምን” ብሎ በማቆየት፣ καθὸ δεῖን ደግሞ የተገቢነት ሐሳብ ባለው “እንደሚገባ” ይተረጉማል፤ “ስለ ምን” ብሎ ትርጉሙን አያጠብም።
- source_word: αὐτὸ τὸ πνεῦμα
  choice: መንፈስ ራሱ
  rationale: αὐτό የሚሰጠውን አጽንዖት ይጠብቃል፤ የአማርኛው “ራሱ” በዐውዱ የመንፈስን ግላዊ ተግባር በተፈጥሮ ያሳያል።
- source_word: ὑπερεντυγχάνει
  choice: ስለ እኛ ይማልዳል
