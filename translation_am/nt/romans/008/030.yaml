  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: am
  text: አስቀድሞ የወሰናቸውንም[a] ጠራቸው፤ የጠራቸውንም ጻድቃን አድርጎ ቆጠራቸው፤ ጻድቃን አድርጎ የቆጠራቸውንም ክብር ሰጣቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አስቀድሞ የመደባቸውን»።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ «ክብር ሰጣቸው» የሚለውን በያለፈ ጊዜ ይጠቀማል። አንዳንዶች ይህን የወደፊቱ ክብር እጅግ እርግጠኛ ስለሆነ አስቀድሞ እንደተፈጸመ ተደርጎ የተነገረ እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: አስቀድሞ ወሰነ
  rationale: ግሱ አስቀድሞ መወሰንን ወይም መመደብን ያመለክታል። ይህ አተረጓጎም የግሪኩን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ የአንድን ወገን ሥነ መለኮታዊ ሥርዓትም አያስገባም።
- source_word: ἐκάλεσεν
  choice: ጠራቸው
  rationale: ‘ጠራ’ የκαλέωን መደበኛ ትርጉምና በጳውሎስ ተከታታይ አሳብ ውስጥ ያለውን ሥነ መለኮታዊ ትስስር ይጠብቃል።
- source_word: ἐδικαίωσεν
  choice: ጻድቃን አድርጎ ቈጠራቸው
  rationale: δικαιόω በዚህ የጳውሎስ አጠቃቀም የፍርድ ቤታዊ ውሳኔ ኃይል አለው። ‘ጻድቃን አድርጎ ቈጠረ’ በዘመናዊ አማርኛ ይህን ግልጽ ያደርጋል፣ ውስጣዊ ለውጥን ብቻ እንዳያመለክትም ይጠነቀቃል።
- source_word: ἐδόξασεν
  choice: አከበራቸው
  rationale: የግሪኩ ግስ ያለፈ ጊዜ አኦሪስት ነው፤ ስለዚህ ያለፈ ጊዜው በዋናው ጽሑፍ ተጠብቋል። ‘አከበረ’ የδόξα ቤተሰብን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὓς ... τούτους
  choice: የ...አቸውንም ...አቸው
  rationale: የግሪኩን ተደጋጋሚ ተዛማጅ አወቃቀር በተፈጥሯዊ የአማርኛ አንቀጽ ቅርጽ በመድገም፣ በሁሉም ደረጃዎች የሚነገረው ስለዚያው ቡድን መሆኑን ይጠብቃል።
- source_word: καὶ / δὲ
  choice: -ም
  rationale: የአማርኛው ‘-ም’ በዚህ አወቃቀር የግሪኩን ለስላሳ ማያያዣና ጭማሪያዊ ‘ደግሞ/እንዲሁም’ ኃይል በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
theological_decisions:
