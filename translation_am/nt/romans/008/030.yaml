- issue: ἐδικαίωσεν እንደ ሥነ ምግባራዊ ለውጥ ወይስ እንደ ፍርዳዊ ውሳኔ መቅረብ
  choice: ጻድቃን አድርጎ ቈጠራቸው
  alternative: አጸደቃቸው
  rationale: ይህ ሐረግ በጳውሎስ አጠቃቀም ያለውን የፍርድ ውሳኔ ገጽታ ያሳያል፣ ሆኖም የጽድቅን ሙሉ ሥነ መለኮታዊ ዘዴ አይወስንም።
- issue: ἐδόξασεν በያለፈ ጊዜ ወይስ በወደፊት ጊዜ መተርጎም
  choice: አከበራቸው
  alternative: ያከብራቸዋል
  rationale: የግሪኩ ቅርጽ አኦሪስት አመልካች ስለሆነ ያለፈ ጊዜው በዋና ጽሑፍ ተጠብቋል። ይህ ለወደፊቱ የሚፈጸም ክብር እጅግ እርግጠኛ ስለሆነ እንደተፈጸመ የተነገረ ሊሆን እንደሚችል በማስታወሻ ተጠብቋል።
