- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: በወደደን በእርሱ
  rationale: ስም ሆኖ የሚሠራውን አርቲክል ያለው የአኦሪስት ተሳቢ አገላለጽ ስሙን ሳይጨምር በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀγαπήσαντος
  choice: ወደደን
