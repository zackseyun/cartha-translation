theological_decisions:
- issue: ‘የወደደን’ ማንነት
  choice: በዋናው ጽሑፍ ‘በወደደን በእርሱ’ ተብሎ ስሙ ሳይጨመር ቀርቧል።
  alternative: ወዲያውኑ ባለው ዐውድ ክርስቶስ እንደሆነ መግለጽ፣ ወይም በክርስቶስ የሚሠራውን እግዚአብሔር እንደሚያመለክት መረዳት።
  rationale: ሮሜ 8፥35 ቅርብ ዐውድ ወደ ክርስቶስ በጠንካራ ሁኔታ ያመለክታል፤ ሆኖም ግሪኩ በዚህ ቁጥር ስሙን በግልጽ ስለማይጠቅስ ዋናው ጽሑፍ ያንን አሻሚነት ጠብቋል።
