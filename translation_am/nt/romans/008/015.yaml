- source_word: Αββα ὁ πατήρ
  choice: አባ! አባት ሆይ!
  rationale: “አባ”ን በድምፅ አቀራረቡ አቆይቶ፣ ὁ πατήρን በተፈጥሯዊው የአማርኛ መጠሪያ “አባት ሆይ” ይተረጉማል።
theological_decisions:
- issue: πνεῦμα υἱοθεσίας መንፈስ ቅዱስን በግልጽ ይጠቁማል ወይስ “መንፈስ” የሚለውን ትይዩ አገላለጽ ይጠብቃል?
  choice: ዋናው ጽሑፍ “መንፈስ” ብቻ ይላል፤ “በእርሱም” የሚለው ግን ግለሰባዊውን ንባብ ክፍት ያደርገዋል።
  alternative: “ልጆች ሆነን የምንቀበልበትን መንፈስ ቅዱስ”
  rationale: በሮሜ 8 አውድ የሚጠቀሰው መንፈስ ቅዱስ መሆኑ ጠንካራ ነው፤ ሆኖም የግሪኩ ጽሑፍ እዚህ “ቅዱስ” አይልም እና “የባርነት መንፈስ” ከሚለው ጋር ያለውን ትይዩነት ይጠብቃል።
- issue: υἱοθεσία የጉዲፈቻን ብቻ ወይስ የሕጋዊ ልጅነትንና የወራሽነትን ሁኔታ ያመለክታል?
  choice: “ልጆች ሆናችሁ የምትቀበሉበት” ተብሎ ተተርጉሞ፣ ሕጋዊው ገጽታ በማስታወሻ ተገልጿል።
  alternative: “የጉዲፈቻ ልጅነት መንፈስ” ወይም “የልጅነት መንፈስ”
  rationale: “ጉዲፈቻ” ብቻ በዘመናዊ አማርኛ በቃሉ ውስጥ ያለውን የወራሽነትና የተሰጠ ማዕረግ ገጽታ ሊያጠብ ይችላል፤ “ልጅነት” ብቻም ልጅ ሆኖ የመቀበልን ገጽታ ሊደብቅ ይችላል።
