base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: am
  text: እናንተ እንደገና ወደ ፍርሃት የሚመልስ የባርነት መንፈስ አልተቀበላችሁምና፤ ነገር ግን ልጅ አድርጎ የመቀበል መንፈስ[a] ተቀብላችኋል፤ በእርሱም[b]፣ “አባ፣ አባት ሆይ!” ብለን እንጮኻለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የልጆች ጉዲፈቻ መንፈስ” ወይም “ልጆች አድርጎ የመቀበል መንፈስ”። የግሪኩ ቃል አንድ ሰው ሙሉ የልጅነትና የወራሽነት መብት እንዲኖረው በልጅነት መቀበሉን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በዚህ [መንፈስ]።” የግሪኩ ተዛማጅ ቃል ገለልተኛ ጾታ ያለው ሲሆን ከ“መንፈስ” ጋር ይስማማል፤ በአውዱ ግን መንፈስን በግለሰባዊ መልኩ ማመልከቱ ይቻላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: የባርነት መንፈስ
  rationale: የδουλείαን የባርነት ኃይል እና ከሚከተለው የልጅነት ንጽጽር ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: πάλιν εἰς φόβον
  choice: እንደገና ወደ ፍርሃት የሚወስዳችሁን
  rationale: πάλινን “እንደገና” እና εἰς φόβονን “ወደ ፍርሃት” በማለት ጠብቆ፣ በአማርኛ ተፈጥሯዊ በሆነ የዝምድና ሐረግ ያቀርባል።
- source_word: πνεῦμα υἱοθεσίας
  choice: ልጆች ሆናችሁ የምትቀበሉበትን መንፈስ
  rationale: υἱοθεσία የሚያመለክተውን በቤተሰብ ውስጥ ልጅ ሆኖ መቀበል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሕጋዊና የውርስ ገጽታው በማስታወሻው ተገልጿል።
- source_word: ἐν ᾧ
  choice: በእርሱም
  rationale: ቃል በቃል ያለውን “በእርሱ” ይጠብቃል፤ መንፈስን እንደ ግለሰብ የሚያመለክተውን አውዳዊ ንባብም አይደብቅም።
