  to: 'ልጆች ከሆንን፣ ወራሾችም ነን፤ የእግዚአብሔር ወራሾች፣ ከመሲሑ[a] ጋርም አብረው የሚወርሱ ነን፤ በእርግጥ ከእርሱ ጋር መከራ የምንቀበል ከሆነ፣ ከእርሱ ጋር ደግሞ ክብርን እንድንካፈል ነው።


