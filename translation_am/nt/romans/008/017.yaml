  rationale: 'The revision restores the source order and clear force of εἴπερ … ἵνα: suffering with him is stated as the real condition, followed by the purpose/result of sharing glory with him. It also replaces an active-ambiguous rendering of the passive glorification verb with a natural expression for participation in glory. The ambiguity of the conditional construction is retained, and no meritorious interpretation is introduced.'
  reviewer_model: gpt-5.6-terra
