id: ROM.8.17
reference: Romans 8:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: am
  text: 'ልጆች ከሆንን፣ ወራሾችም ነን፤ የእግዚአብሔር ወራሾች፣ ከመሲሑ[a] ጋርም አብረው የሚወርሱ ነን፤ በእርግጥ ከእርሱ ጋር መከራ የምንቀበል ከሆነ፣ ከእርሱ ጋር ደግሞ ክብርን እንድንካፈል ነው።


    [a] ወይም፣ “ከክርስቶስ”።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከክርስቶስ”።
    reason: Χριστός በአማርኛ “መሲሕ” ወይም በተለመደው ቅርጽ “ክርስቶስ” ሊተረጎም ይችላል።
lexical_decisions:
- source_word: τέκνα
  choice: ልጆች
  rationale: የግሪኩ ጾታን የማይለይ ብዙ ቁጥር የልጅነትን ሁኔታ ይገልጣል፤ “ልጆች” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κληρονόμοι
  choice: ወራሾች
  rationale: ውርስን የሚቀበሉ ሰዎችን የሚያመለክተውን ሕጋዊና ቤተሰባዊ ቃል በትክክል ይገልጣል።
- source_word: θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት/ምንጭ ግንኙነት በቀጥታ ይጠብቃል።
- source_word: συγκληρονόμοι
  choice: አብረን ወራሾች
  rationale: συν- የሚያመለክተውን የጋራ ውርስ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: Χριστοῦ
  choice: ከመሲሑ ጋር
  rationale: Χριστός የተቀባውን ንጉሣዊ ማዕረግ ስለሚያመለክት “መሲሕ” የማዕረጉን ኃይል ይጠብቃል፤ የተለመደው “ክርስቶስ” በማስታወሻ ቀርቧል።
- source_word: εἴπερ
  choice: በእርግጥ … ከሆነ
  rationale: እውነተኛውን ሁኔታዊ ኃይልና የጳውሎስን አጽንዖት አብሮ ያስተላልፋል።
- source_word: συμπάσχομεν
  choice: ከእርሱ ጋር መከራን የምንቀበል
  rationale: የσυν-ን አብሮነት በግልጽ ሁኔታ ያሳያል፤ መከራው ከመሲሑ ጋር የሚጋራ መሆኑን ይጠብቃል።
- source_word: ἵνα
  choice: ዘንድ
  rationale: የዓላማ/ውጤት ግንኙነቱን በክቡርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: συνδοξασθῶμεν
  choice: ከእርሱ ጋር ደግሞ እንከብር
  rationale: የግሱን ተደራጊ ትርጉምና የσυν-ን የጋራ ተሳትፎ ይጠብቃል።
theological_decisions:
- issue: εἴπερ συμπάσχομεν መከራን ክብርን የሚያስገኝ ዋጋ አድርጎ ያቀርባል ወይስ ከመሲሑ ጋር ያለውን ኅብረት የሚከተል ሁኔታ ነው?
  choice: “በእርግጥ … ከሆነ” በማለት እውነተኛው ሁኔታዊ አነጋገር ተጠብቋል፤ መከራ ክብርን የሚያስገኝ ዋጋ ነው የሚል ሐሳብ አልተጨመረም።
  alternative: “ከእርሱ ጋር መከራን ስለምንቀበል” ብሎ ሁኔታዊነቱን ማለዘብ፣ ወይም መከራውን እንደ ዋጋ መተርጎም።
  rationale: ግሪኩ እውነተኛ ሁኔታዊ ኃይል አለው፤ ዐውደ ንባቡ ግን ከመሲሑ ጋር ስለሚኖር ተሳትፎ ይናገራል እንጂ መከራ ውርስን እንደሚያስገኝ ዋጋ አያቀርብም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር—ወራሾች፣ አብረን ወራሾች፣ አብሮ መከራ መቀበል፣ አብሮ መከበር—በሚቻለው መጠን ተጠብቋል።
