  rationale: ግሪኩ ግልጽ ባለቤትነት ተውላጠ ስም ባይኖረውም፣ በአማርኛ «እንደ ዓላማ» ያልተሟላና እንግዳ ይሰማል፤ ዐውዱም ዓላማው የእግዚአብሔር መሆኑን ያመለክታል። ግልጽ ባለቤትነት የሌለው ቀጥተኛ ንባብ በማስታወሻ ቀርቧል።
