  rationale: ሁለተኛው የዳቲቭ ሐረግ ከመጀመሪያው ቡድን ጋር ያለውን ገላጭ ግንኙነት «ማለትም» በማለት ያብራራል፤ «ዓላማው» የሚለውም በአማርኛ የዐውዱን መለኮታዊ ባለቤትነት በተፈጥሯዊ ሁኔታ ይገልጣል።
