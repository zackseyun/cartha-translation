id: ROM.8.5
reference: Romans 8:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: am
  text: በሥጋ መሠረት የሚኖሩ የሥጋን ነገር ያስባሉ፤ በመንፈስ መሠረት የሚኖሩ ግን የመንፈስን ነገር ያስባሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: በሥጋ መሠረት የሚኖሩ
  rationale: κατά with σάρξ describes an orientation or mode of life. “በ… መሠረት የሚኖሩ” communicates this naturally while retaining the repeated contrast.
- source_word: φρονοῦσιν
  choice: ያስባሉ
  rationale: The verb concerns directing one’s thought, concern, or outlook. “ያስባሉ” is clear modern Amharic and, with its object, conveys setting one’s thought upon something without overexplaining.
- source_word: τὰ τῆς σαρκὸς
  choice: የሥጋን ነገር
  rationale: This preserves the broad expression “the things of the flesh” rather than narrowing it to particular deeds or desires.
- source_word: κατὰ πνεῦμα
  choice: በመንፈስ መሠረት
  rationale: The anarthrous πνεῦμα is rendered simply as “መንፈስ,” preserving the Greek wording and the parallel with σάρξ without adding an interpretive qualifier.
theological_decisions:
- issue: Whether πνεῦμα explicitly denotes the Holy Spirit
  choice: መንፈስ
  alternative: መንፈስ ቅዱስ
  rationale: The immediate context strongly permits reference to the Holy Spirit, but the Greek does not include ἅγιον here. The unqualified rendering preserves that formal ambiguity and avoids adding wording.
- issue: Whether σάρξ should be interpreted as sinful nature
  choice: ሥጋ
  alternative: ኃጢአተኛ ባሕርይ
  rationale: “ሥጋ” retains Paul’s repeated theological term and its contextual tension; “sinful nature” would resolve its meaning too narrowly.
translation_notes:
  register: Modern standard Amharic with dignified, readily understandable syntax. The balanced repetition reflects the Greek antithesis, while the second clause supplies the verb explicitly for natural Amharic clarity.
