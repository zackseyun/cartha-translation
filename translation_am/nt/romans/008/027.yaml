  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: am
  text: ልቦችን የሚመረምረውም የመንፈስ አሳብ ምን እንደሆነ ያውቃል፤ ምክንያቱም መንፈስ ስለ ቅዱሳን እንደ እግዚአብሔር [a] ይማልዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደ እግዚአብሔር ፈቃድ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: የሚመረምረው
  rationale: የἐραυνάωን በጥልቀት የመፈተሽና የመመርመር ንቁ ስሜት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καρδίας
  choice: ልቦችን
  rationale: የምንጩን ሥዕላዊ አገላለጽ ጠብቆ በመጽሐፍ ቅዱሳዊና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: τί τὸ φρόνημα
  choice: አሳብ ምን እንደሆነ
  rationale: φρόνημα በዚህ አውድ የአእምሮ ችሎታን ብቻ ሳይሆን ውስጣዊ አሳብንና ዝንባሌን ያመለክታል፤ «አሳብ» አጭርና ተፈጥሯዊ ሆኖ ይህን ስፋት ይጠብቃል።
- source_word: τοῦ πνεύματος
  choice: የመንፈስ
  rationale: የሮሜ 8 ቅርብ አውድ የሚያመለክተው መንፈስ ቅዱስን ነው፤ የአማርኛው የተወሰነ ስም አጠቃቀምም ይህን ያሳያል።
- source_word: ἐντυγχάνει
  choice: ይማልዳል
  rationale: በቁጥር 26–27 የጸሎትና በሌሎች ፈንታ የመቅረብን ትርጉም በግልጽ እና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጣል።
- source_word: ὑπὲρ ἁγίων
  choice: ስለ ቅዱሳን
  rationale: ὑπέρ ከዘር ሁኔታ ጋር እዚህ «በእነርሱ ፈንታ/ለእነርሱ» የሚለውን የምልጃ ግንኙነት ያሳያል፤ «ስለ ቅዱሳን» ተፈጥሯዊ ነው።
- source_word: κατὰ θεὸν
  choice: እንደ እግዚአብሔር
  rationale: በግሪኩ ያለውን አጭርና በመጠኑ ክፍት አገላለጽ ይጠብቃል፤ «ፈቃድ» የሚለውን በዋናው ጽሑፍ ሳይጨምር ትርጉሙን በማስታወሻ ያቀርባል።
theological_decisions:
- issue: κατὰ θεὸν የሚለውን «እንደ እግዚአብሔር ፈቃድ» ብሎ ግልጽ ማድረግ ወይስ የምንጩን አጭር አገላለጽ መጠበቅ
  choice: በዋናው ጽሑፍ «እንደ እግዚአብሔር» ተብሎ ቀርቧል።
  alternative: «እንደ እግዚአብሔር ፈቃድ»
  rationale: አውዱ ከእግዚአብሔር ፈቃድ ጋር መስማማትን በጠንካራ ሁኔታ ቢያመለክትም፣ የግሪኩ ጽሑፍ «ፈቃድ» የሚል ቃል በግልጽ አልያዘም። ስለዚህ የምንጩ ጥቅጥቅ ያለ አገላለጽና የትርጓሜ ክፍተት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የዓረፍተ ነገር ትስስር ተጠብቆ፣ በሁለተኛው ሐረግ የድርጊቱ ባለቤት ግልጽ እንዲሆን «መንፈስ» ተደግሟል።
