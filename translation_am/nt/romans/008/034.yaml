  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: am
  text: የሚኮንነው ማን ነው? መሲሑ[a] የሞተው ነው—ይልቁንም የተነሣው[b]፣ በእግዚአብሔር ቀኝ[c] ያለው፣ ስለ እኛም[d] የሚማልደው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪክኛው ግስ ተደራጊ ነው፤ “የተነሣው” የሚለው ትርጉም ይህን ያመለክታል።
    reason: source_voice_note
  - marker: c
    text: “በእግዚአብሔር ቀኝ” ማለት የከፍተኛ ክብርና ሥልጣን ስፍራን የሚያመለክት መጽሐፍ ቅዱሳዊ አነጋገር ነው።
    reason: cultural_note
  - marker: d
    text: ወይም፣ “በእኛ ፈንታ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: የሚኮንነው
  rationale: በግሪክኛው ስም ሆኖ የቀረበውን የአሁን ጊዜ አድራጊ ቅጽ፣ የኩነኔ ፍርድ የሚሰጥን ሰው በሚያመለክት አጭር የአማርኛ አገላለጽ ያቀርባል።
- source_word: Χριστός
  choice: መሲሑ
  rationale: ቃሉ እዚህ እንደ ማዕረግ የሚሠራውን ‘የተቀባው’ ትርጉም እንዲታይ ያደርጋል፤ ‘ክርስቶስ’ በግርጌ ተጠቅሷል። የግሪክ ምንጩ ‘ኢየሱስ’ የሚለውን ስም አልያዘም።
- source_word: ἀποθανών
  choice: የሞተው
  rationale: የተፈጸመውን ታሪካዊ ድርጊት በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: μᾶλλον δὲ
  choice: ይልቁንም
  rationale: ከሞቱ ወደ ትንሣኤው የሚያድገውን አጽንዖትና ማረሚያዊ ሽግግር ይጠብቃል።
- source_word: ἐγερθείς
  choice: የተነሣው
  rationale: በአማርኛ የተለመደውን የትንሣኤ አገላለጽ ይጠቀማል፤ የግሪክኛው ቅጽ ተደራጊ መሆኑ በግርጌ ተገልጿል።
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: በእግዚአብሔር ቀኝ
  rationale: የመጽሐፍ ቅዱስን የተለመደ ምስላዊ አነጋገር በአጭሩ ይጠብቃል።
- source_word: ἐντυγχάνει
  choice: የሚማልደው
  rationale: ለሌሎች ጥቅም በእነርሱ ፈንታ መጠየቅን በተለመደና ክብር ባለው የአማርኛ ቃል ያሳያል።
- source_word: ὑπὲρ ἡμῶν
  choice: ስለ እኛ
  rationale: ቀላልና ተፈጥሯዊ ሲሆን ‘ለእኛ/በእኛ ፈንታ’ የሚለውን የውክልና ሐሳብ ይፈቅዳል።
