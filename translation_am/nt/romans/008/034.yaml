  rationale: የመጀመሪያው አማራጭ ተደራጊነቱን ሊያደበዝዝ ይችላል፤ ሁለተኛው ደግሞ በዚህ ሐረግ ያልተጠቀሰውን አድራጊ በግልጽ ያስገባል። ዋናው ጽሑፍ ተፈጥሯዊ ሆኖ ሲቀርብ የግሪክኛው ድምፅ በግርጌ ተጠብቋል።
