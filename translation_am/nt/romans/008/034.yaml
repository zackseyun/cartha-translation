  source_fidelity: The draft accurately renders the rhetorical question, Christ/Messiah as the subject, his death, resurrection, exalted position at God's right hand, and intercession for us. It appropriately does not add the name Jesus, which is absent from the cited Greek text. The passive force of ἐγερθείς is responsibly retained in the note without naming an agent absent from the verse.
