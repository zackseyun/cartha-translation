base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: am
  text: ምክንያቱም የሥጋ አስተሳሰብ[a] በእግዚአብሔር ላይ ጠላትነት[b] ነው፤ ለእግዚአብሔር ሕግ አይገዛምና፤ እንኳ መገዛት አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የኃጢአተኛ ተፈጥሮ አስተሳሰብ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእግዚአብሔር ላይ ጥላቻ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ምክንያቱም
  rationale: የቀደመውን ንግግር ምክንያት የሚያስረዳውን የግሪክ ቃል ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: φρόνημα
  choice: አስተሳሰብ
  rationale: ቃሉ ተራ ሐሳብን ብቻ ሳይሆን የአእምሮን ዝንባሌና አቅጣጫ ያመለክታል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: የጳውሎስን ምሳሌያዊ አጠቃቀም ሳይፈታ የምንጩን ቃል ይጠብቃል፤ ትርጓሜያዊው አማራጭ በማስታወሻ ተቀምጧል።
- source_word: ἔχθρα εἰς θεόν
  choice: በእግዚአብሔር ላይ ጠላትነት
  rationale: የጥላቻውን ንቁ ተቃውሞና ወደ እግዚአብሔር መ directed መሆኑን ይገልጣል፤ የስም አገላለጹንም ይጠብቃል።
- source_word: ὑποτάσσεται
  choice: አይገዛም
  rationale: ለሥልጣን ሥር መሆንን ወይም መገዛትን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: νόμῳ τοῦ θεοῦ
  choice: ለእግዚአብሔር ሕግ
  rationale: የግሪኩን ባለቤትነት ግንኙነት እና ከὑποτάσσεται ጋር ያለውን የተቀባይ ግንኙነት በአማርኛ ያሳያል።
- source_word: οὐδὲ γὰρ δύναται
  choice: እንዲያውም መገዛት አይችልም
  rationale: οὐδέ የሚሰጠውን አጽንዖትና δύναται የሚገልጠውን አለመቻል ይጠብቃል፤ በግሪኩ የተገመተውን ‘መገዛት’ ለአማርኛ ግልጽነት ይደግማል።
theological_decisions:
- issue: σάρξን በቀጥታ ‘ሥጋ’ ብሎ መተርጎም ወይስ ትርጓሜያዊ አገላለጽ መጠቀም
  choice: በዋናው ጽሑፍ ‘ሥጋ’ ተብሏል።
  alternative: ኃጢአተኛ ተፈጥሮ
  rationale: አውዱ ምሳሌያዊ ቢሆንም፣ ‘ሥጋ’ የምንጩን ምስልና የጳውሎስን ቃላዊ ግንኙነት ይጠብቃል፤ ትርጓሜያዊው አማራጭ በማስታወሻ ቀርቧል።
- issue: የመጨረሻው ሐረግ ፈቃደኛ አለመሆንን ወይስ አለመቻልን እንደሚገልጥ
  choice: ‘መገዛት አይችልም’ ተብሎ የአለመቻል ንግግሩ በግልጽ ተጠብቋል።
  alternative: መገዛት አይፈልግም
  rationale: δύναται ችሎታን የሚገልጥ ስለሆነ፣ ጽሑፉ የሚያስቀምጠውን ሥነ መለኮታዊ ውጥረት ሳያለዝብ የአለመቻል አገላለጽ ተጠብቋል።
- issue: ἔχθραን በስም ወይም በቅጽል መተርጎም
  choice: ‘ጠላትነት ነው’ የሚለው የስም አገላለጽ ተጠብቋል።
  alternative: ለእግዚአብሔር ጠላት ነው
  rationale: ግሪኩ ἔχθρα ስም ሲሆን፣ ይህ አቀራረብ የንግግሩን ጥንካሬ እና ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሴሚኮሎኖቹ የሐረጎቹን ተከታታይ ምክንያታዊ ግንኙነት ያሳያሉ።
