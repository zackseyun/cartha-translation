lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: መንፈሱ ራሱ
  rationale: αὐτό የሚሰጠውን አጽንዖት «ራሱ» በተፈጥሯዊ አማርኛ ይጠብቃል፤ የግሪኩ ሰዋሰዋዊ ጾታ በአማርኛ ልዩ ተውላጠ ስም አያስፈልገውም።
- source_word: συμμαρτυρεῖ
  choice: ከ… ጋር ይመሰክራል
  rationale: ግሱ አብሮ ወይም ከሌላ ምስክር ጋር መመስከርን ያመለክታል፤ ይህ አገላለጽ የጋራ ምስክርነቱን በግልጽ ያስተላልፋል።
- source_word: τῷ πνεύματι ἡμῶν
  choice: ከመንፈሳችን ጋር
  rationale: የዳቲቭ ቅርጹ ከσυμμαρτυρεῖ ጋር የአብሮነት ወይም የተባባሪነት ሐሳብ ስለሚሰጥ፣ «ከ… ጋር» ይህን ግንኙነት ይጠብቃል።
- source_word: ὅτι ἐσμὲν
  choice: እኛ … እንደሆንን
  rationale: ὅτι የምስክርነቱን ይዘት የሚያስገባ ሲሆን፣ በአማርኛ «እንደሆንን» በተፈጥሯዊ ሁኔታ ይገልጸዋል።
- source_word: τέκνα θεοῦ
  choice: የእግዚአብሔር ልጆች
  rationale: τέκνα በጾታ ያልተወሰነ «ልጆች» ማለት ነው፤ ይህ ምርጫ የቤተሰብ ግንኙነቱን ሳያጠብ ያስተላልፋል።
theological_decisions:
- issue: የመንፈሱ እና የሰው መንፈስ ምስክርነት ግንኙነት
  choice: ከመንፈሳችን ጋር ይመሰክራል
  alternative: ለመንፈሳችን ይመሰክራል
  rationale: συμμαρτυρεῖ በመሠረታዊነት አብሮ መመስከርን ያመለክታል። ሆኖም ዳቲቩን እንደ ተቀባይ የሚወስድ አማራጭ ንባብ ስላለ፣ ያ በግርጌ ማስታወሻ ተጠቅሷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «መንፈሱ ራሱ» የግሪኩን አጽንዖት ይጠብቃል፤ «ልጆች» ደግሞ የτέκναን ጾታ-አካታች ትርጉም ያስተላልፋል።
