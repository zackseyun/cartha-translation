  terminology: «መንፈሱ ራሱ» appropriately retains the emphasis without importing a denominationally loaded expansion. «የእግዚአብሔር ልጆች» accurately preserves the gender-inclusive sense of τέκνα. «ከመንፈሳችን ጋር» is the preferred rendering of the συνεργative dative.
