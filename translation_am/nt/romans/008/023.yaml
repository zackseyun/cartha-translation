  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እኛ ራሳችንም» የግሪኩን አጽንዖት ይጠብቃል፤ «እያቃሰትን» ደግሞ ከቀደመው የፍጥረት ማቃሰት ጋር ያለውን ትስስር ያስቀጥላል።
