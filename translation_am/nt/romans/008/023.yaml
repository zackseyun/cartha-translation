  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: am
  text: 'ሮሜ 8፥23


    ይህ ብቻ ሳይሆን፣ የመንፈስን በኩራት[a] ያለን እኛም ራሳችን በውስጣችን እያቃሰትን፣ ልጅነትን[b]፣ ይኸውም የሰውነታችንን ቤዛነት[c]፣ በጉጉት እንጠባበቃለን።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መንፈስ ራሱን እንደ በኩራት»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «እንደ ልጆች መቀበልን»። የግሪኩ ቃል በቃል የወንድ ልጅነትን ያካትታል፤ በዚህ አውድ ግን የልጅነትና የወራሽነት ሁኔታን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: በግሪክኛ፣ «ሰውነት» የሚለው ቃል በነጠላ ቁጥር ነው፤ ለእያንዳንዱ ሰው ሰውነት በማመልከት ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: ይህም ብቻ አይደለም፤
  rationale: ከቀደመው ቁጥር ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስቀጥላል።
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: እኛ ራሳችንም
  rationale: በግሪኩ ያለውን የተደጋገመ አጽንዖት ያለ አላስፈላጊ ድግግሞሽ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: የመንፈስን በኩራት
  rationale: ἀπαρχή የመጀመሪያውን ፍሬ ወይም የመጀመሪያውን ድርሻ ያመለክታል፤ ይህ አገላለጽ የመንፈስ ስጦታ ነው ወይስ መንፈስ ራሱ በኩራት ነው የሚለውን አሻሚነት በማስታወሻ ይጠብቃል።
- source_word: ἔχοντες
  choice: ያለን
  rationale: የግሪኩን አሳታፊ ግስ በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ ሐረግ ያቀርባል።
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: በውስጣችን እያቃሰትን
  rationale: የማቃሰቱን ውስጣዊነት ይጠብቃል፤ στενάζομενንም በአውዱ ውስጥ ፍጥረት ከሚያቃስተው ጋር ያለውን ቃላዊ ትስስር በሚጠብቅ መንገድ ይተረጉማል።
- source_word: υἱοθεσίαν
  choice: ልጆች ሆነን መቀበላችንን
  rationale: የማደጎ ልጅነትን ሐሳብ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል፤ በቃሉ ያለው የወንድ ልጅነትና የወራሽነት ገጽታ በማስታወሻ ተገልጧል።
- source_word: ἀπεκδεχόμενοι
  choice: በጉጉት እንጠባበቃለን
  rationale: የቃሉን ጽኑ የተስፋ መጠባበቅ ስሜት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν ἀπολύτρωσιν
  choice: ቤዛነት
  rationale: የጳውሎስን የነጻ መውጣትና የመዋጀት ሥነ መለኮታዊ ቃላት ይጠብቃል።
- source_word: τοῦ σώματος ἡμῶν
  choice: የሰውነታችንን
  rationale: የግሪኩን ነጠላ ቁጥር ይጠብቃል፤ በአማርኛም የእያንዳንዱን ሰውነት በስርጭታዊ ነጠላ መግለጽ ተፈጥሯዊ ነው።
theological_decisions:
- issue: υἱοθεσίαν የሚለውን ቃል የወንድ ልጅነትና የወራሽነት ምስሉን ሳያጠፋ፣ ሴቶችን ከተጠቃሾቹ ውጭ እንዳያደርግ መተርጎም
  choice: ልጆች ሆነን መቀበላችንን፣ ከማስታወሻ ጋር
  alternative: ልጅነትን፤ ወይም እንደ ወንድ ልጆች መቀበልን
  rationale: ዋናው ጽሑፍ ሁሉንም አማኞች የሚያካትተውን የልጅነት ሁኔታ በግልጽ አማርኛ ይገልጣል፤ ማስታወሻው ደግሞ በግሪኩ ያለውን የወንድ ልጅነትና የሕጋዊ ወራሽነት ገጽታ ይጠብቃል።
- issue: «የመንፈስ በኩራት» ማለት ከመንፈስ የተሰጠ የመጀመሪያ ድርሻ ነው ወይስ መንፈስ ራሱ በኩራት ነው?
  choice: የመንፈስን በኩራት
  alternative: መንፈስን እንደ በኩራት
  rationale: የግሪኩ የባለቤትነት አገባብ ከአንድ በላይ ትርጓሜ ሊኖረው ስለሚችል፣ ዋናው ጽሑፍ ቀጥተኛውን አገላለጽ ይዞ አማራጩን በማስታወሻ ያቀርባል።
