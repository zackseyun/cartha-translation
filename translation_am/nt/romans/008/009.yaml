  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በሥጋ/በመንፈስ” የሚለው መጽሐፍ ቅዱሳዊ አገላለጽ ተጠብቆ፣ ሁኔታዊው አንቀጽ ለአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል።
