base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: am
  text: እናንተ ግን በሥጋ[a] ሳይሆን በመንፈስ ናችሁ፣ የእግዚአብሔር መንፈስ በእናንተ ውስጥ በእርግጥ የሚኖር ከሆነ። ማንም የመሲሑን[b] መንፈስ ከሌለው፣ የእርሱ አይደለም[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኃጢአተኛ ባሕርይ።” በግሪክኛ ቃል በቃል፣ “በሥጋ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የክርስቶስን።”
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “የእርሱ አይደለም።” በአውዱ ቅርብ ያለው ተጠቃሽ መሲሑ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: ሥጋ
  rationale: የጳውሎስን ዋና ቃልና ከመንፈስ ጋር ያለውን ነገረ መለኮታዊ ውጥረት ለመጠበቅ “ሥጋ” ተብሏል፤ በዚህ አውድ ከሥጋዊ አካል ብቻ የሰፋ ትርጉም አለው።
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: በአውዱ “የእግዚአብሔር መንፈስ” እና “የመሲሑ መንፈስ” ስለሚባል፣ የሰውን ዝንባሌ ሳይሆን መለኮታዊውን መንፈስ ያመለክታል።
- source_word: οἰκεῖ
  choice: የሚኖር
  rationale: በውስጥ የተረጋጋ መኖርን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ በመጠቀሙ “መሲሕ” ተመርጧል፤ “ክርስቶስ” በማስታወሻ ተጠቅሷል።
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: የመሲሑ አይደለም
  rationale: የግሪክኛውን የባለቤትነት/ዝምድና አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በዋናው ጽሑፍ ቅርብ ያለው ተጠቃሽ መሲሕ መሆኑ ግልጽ ተደርጓል፣ ቃል በቃል ቅርጹም በማስታወሻ ተጠብቋል።
- source_word: εἴπερ
  choice: በእርግጥ … ከሆነ
  rationale: ሁኔታዊውን ቅርጽ እየጠበቀ ጸሐፊው ይህን ስለአንባቢዎቹ እንደሚገምት ያለውን አጽንዖት ያሳያል።
- source_word: Ὑμεῖς
  choice: እናንተ
  rationale: በግሪክኛ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: οὗτος
  choice: እርሱ
  rationale: የግሪክኛውን ነጠላ ተወካይ ቅርጽ በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: “በሥጋ” እና “በመንፈስ” የሚለው ንጽጽር
  choice: በመንፈስ መኖር የሚወስነውን የሕልውና መስክ የሚያሳይ አገላለጽ ሆኖ ተጠብቋል።
  alternative: “በኃጢአተኛ ባሕርይ” ወይም “በመንፈስ የሚመራ ሕይወት” ብሎ በትርጓሜ ማስፋት።
  rationale: “ሥጋ” እና “መንፈስ” የሚሉትን የጳውሎስ ምድቦች እንዳሉ በመጠበቅ ጽሑፉን በአንድ ጠባብ የሥነ ልቦና ወይም የእምነት ሥርዓት ትርጓሜ አይገድበውም።
- issue: “የእርሱ” የሚለው ተውላጠ ስም ማንን እንደሚያመለክት
  choice: በዋናው ትርጉም “መሲሑ” ተብሎ ተገልጿል።
  alternative: ሰፊውን አውድ በመከተል “እግዚአብሔር” ብሎ መረዳት፣ ወይም ቃል በቃል “የእርሱ” ማለት።
  rationale: በአማርኛ “የእርሱ” ብቻ ቢባል ተጠቃሹ ከግሪክኛው ይልቅ የበለጠ ሊደበዝዝ ይችላል፤ ቅርብ ያለው ሰዋሰዋዊ ተጠቃሽ መሲሕ ነው። የግሪክኛው ቃል በቃል ቅርጽ ግን በማስታወሻ ተጠብቋል።
