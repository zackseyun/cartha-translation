revisions:
- from: ፍጥረት ራሱም ከመበስበስ ባርነት ነፃ ወጥቶ፣ ወደ እግዚአብሔር ልጆች የክብር ነፃነት ይገባልና።[a]
  to: ምክንያቱም ፍጥረት ራሷም ከመበስበስ ባርነት ነፃ ትደረጋለች፤ ወደ የእግዚአብሔር ልጆች የክብር ነፃነትም ትገባለች።[a]
  rationale: The revision replaces the active perfective converb with the future passive «ነፃ ትደረጋለች», corrects the emphatic pronoun to feminine agreement, and makes the causal ὅτι explicit. «የክብር ነፃነት» is retained to preserve the source’s genitive-chain ambiguity rather than reducing it to an adjectival or doctrinal interpretation.
