id: ROM.8.21
reference: Romans 8:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: am
  text: ምክንያቱም ፍጥረት ራሷም ከመበስበስ ባርነት ነፃ ትደረጋለች፤ ወደ የእግዚአብሔር ልጆች የክብር ነፃነትም ትገባለች።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ወደ የእግዚአብሔር ልጆች የክብር ነፃነት።”
    reason: የግሪኩን ተከታታይ የስም አገናኝ አወቃቀር በግልጽ ለማሳየት።
lexical_decisions:
- source_word: ὅτι
  choice: ይገባልና
  rationale: የግሪኩን ምክንያታዊ ኃይል ከአማርኛው ዐረፍተ ነገር መጨረሻ ባለው «-ና» በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: ፍጥረት ራሱም
  rationale: «ራሱ» አጽንዖቱን፣ «-ም» ደግሞ የκαὶን ጭማሪያዊ ኃይል ይጠብቃሉ፤ κτίσις እዚህ ጠቅላላውን ፍጥረት ያመለክታል።
- source_word: ἐλευθερωθήσεται
  choice: ነፃ ወጥቶ … ይገባል
  rationale: መጪውን ነፃ መውጣትና ወደ አዲስ ሁኔታ መግባት በተፈጥሯዊ አማርኛ ይገልጣል፤ ድርጊቱ በፍጥረት ላይ እንደሚፈጸምም ዐውዱ ያሳያል።
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: ከመበስበስ ባርነት
  rationale: δουλείαን በጠንካራው የባርነት ምስል ይጠብቃል፤ φθορά በፍጥረት ዐውድ የመበስበስና የመጥፋት ሁኔታን ያመለክታል።
- source_word: εἰς τὴν ἐλευθερίαν
  choice: ወደ … ነፃነት ይገባል
  rationale: εἰς ከአንድ ሁኔታ ወደ ሌላ የሚደረገውን ሽግግር ይገልጣል።
- source_word: τῆς δόξης
  choice: የክብር
  rationale: የግሪኩን የስም አገናኝ አወቃቀር ሳይፈታ ይጠብቃል፤ «ክቡር» ወይም «የከበረ» ብሎ በቅጽል አይተረጉመውም።
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: የእግዚአብሔር ልጆች
  rationale: τέκνα ሁለቱንም ፆታዎች የሚያካትተውን «ልጆች» ይጠይቃል፤ የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽም ይጠብቃል።
theological_decisions:
- issue: τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ የሚለውን ተከታታይ የጄኒቲቭ አወቃቀር እንዴት መተርጎም እንደሚገባ
  choice: የእግዚአብሔር ልጆች የክብር ነፃነት
  alternative: የእግዚአብሔር ልጆች ክቡር ነፃነት
  rationale: «የክብር» የሚለው የግሪኩን አወቃቀርና ትርጉማዊ ውጥረት ይጠብቃል፤ ክብሩ ነፃነቱን የሚገልጥ ብቻ ነው ወይስ የልጆቹ ክብር ነው የሚለውን በአንድ ትርጓሜ አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መበስበስ» በፍጥረታዊው ዐውድ የφθοράን አካላዊ መበላሸትና ጥፋት ያሳያል፤ «ባርነት» ደግሞ የግሪኩን ጠንካራ ምስል ይጠብቃል።
