  register: ዘመናዊ፣ የተፈጥሮ ፍሰት ያለውና ክብር የጠበቀ አማርኛ። ‘እግዚአብሔር መንፈስ’ የሚለው አወቃቀር ከግሱ ጋር ተያይዞ መንፈሱ መሪው መሆኑን ግልጽ ያደርጋል።
