  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: am
  text: በእግዚአብሔር መንፈስ የሚመሩ ሁሉ፣ እነዚህ የእግዚአብሔር ልጆች[a] ናቸውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የእግዚአብሔር ወንዶች ልጆች።” ይህ አገላለጽ በአውዱ የጉዲፈቻንና የርስትን ሐሳብ ያካትታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: … ሁሉ
  rationale: የብዙ ቁጥር አጠቃላይ ወሰኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በዓረፍተ ነገሩ መጨረሻ ያሳያል።
- source_word: πνεύματι θεοῦ
  choice: እግዚአብሔር መንፈስ
  rationale: ከ‘የሚመራቸው’ ጋር በመጣመር የግሪኩን መሣሪያዊ ዳቲቭ ‘በእግዚአብሔር መንፈስ’ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἄγονται
  choice: የሚመራቸው
  rationale: የአሁን ጊዜውን ተገብሮ የመመራት ሐሳብ ይጠብቃል፤ በአማርኛ የመንፈሱን አድራጊነት ግልጽ ያደርጋል።
- source_word: οὗτοι
  choice: እነርሱ
  rationale: የግሪኩን አመልካች አጽንዖት በተፈጥሯዊና ክብር ባለው አማርኛ ይጠብቃል።
- source_word: υἱοί
  choice: ልጆች
  rationale: በዚህ አጠቃላይ ብዙ ቁጥር አውድ ወንዶችንና ሴቶችን ያካተተውን ትርጉም በዘመናዊ አማርኛ በግልጽ ያስተላልፋል፤ የ‘ወንዶች ልጆች’ ቃል በግርጌ ማስታወሻ ተጠብቋል።
- source_word: θεοῦ
  choice: የእግዚአብሔር
  rationale: በሁለቱም ስፍራ ያለውን የባለቤትነት ጄኒቲቭ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: υἱοί θεοῦ የሚለው ‘የእግዚአብሔር ወንዶች ልጆች’ ወይስ ‘የእግዚአብሔር ልጆች’ ተብሎ መተርጎም እንዳለበት
  choice: የእግዚአብሔር ልጆች
  alternative: የእግዚአብሔር ወንዶች ልጆች
  rationale: υἱοί በቅርጹ ተባዕታይ ብዙ ቁጥር ቢሆንም፣ በዚህ አውድ መንፈሱ የሚመራቸውን ሁሉ ያካትታል። ‘ልጆች’ ይህን ስፋት በተፈጥሯዊ አማርኛ ያሳያል፤ የጉዲፈቻና የርስት ጥላ ትርጉሙ እንዳይጠፋ የቃል በቃሉ አማራጭ በማስታወሻ ቀርቧል።
