  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: am
  text: አንዱ ሰው ሁሉን መብላት እንደሚችል ያምናል፤[a] ደካማው ግን አትክልት ይበላል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉን መብላት እንደሚችል እርግጠኛ ነው።”
    reason: lexical_alternative
  - marker: b
    text: በዚህ ዐውድ “ደካማው” የሚለው ከምግብ ልማዶች ጋር በተያያዘ በእምነት ወይም በሕሊና ደካማ የሆነውን ያመለክታል፤ ሮሜ 14፥1ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: አንዱ ሰው
  rationale: የንጽጽሩን የመጀመሪያ አካልና ነጠላ ወካይነቱን በተፈጥሯዊ አማርኛ ያሳያል፤ ጾታንም አላስፈላጊ ሁኔታ አይገድብም።
- source_word: πιστεύει
  choice: ያምናል
  rationale: እዚህ ቃሉ ከመብላት ጋር የተያያዘን የግል እምነት ወይም እርግጠኝነት ያመለክታል፤ የማዳን እምነትን አይጠቅስም።
- source_word: φαγεῖν πάντα
  choice: ሁሉን መብላት እንደሚችል
  rationale: πάντα የምግብ ገደብ አለመኖሩን ያሳያል። እንደሚችል የሚለው በዐውዱ ያለውን የተፈቀደነት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ δὲ
  choice: ደካማው ግን
  rationale: δὲ የሁለተኛውን የንጽጽር አካል ያስገባል፤ የአማርኛው አደራደር ተፈጥሯዊ እንዲሆን ግን ከስሙ በኋላ ተቀምጧል።
- source_word: ἀσθενῶν
  choice: ደካማው
  rationale: ተሳቢው እንደ ስም ሆኖ ደካማ የሆነውን ሰው ያመለክታል። ቁጥሩ ራሱ ‘በእምነት’ ስለማይል፣ ይህ ማብራሪያ በዋናው ጽሑፍ አልተጨመረም።
- source_word: λάχανα
  choice: አትክልት
  rationale: ቃሉ የአትክልት ቦታ ምርትን ወይም የሚበሉ አትክልቶችን ያመለክታል፤ ‘አትክልት’ በዘመናዊ አማርኛ ግልጽና ሰፊ አቻ ነው።
- source_word: ἐσθίει
  choice: ይበላል
  rationale: ግሱ ሰውየው የሚበላውን ብቻ ይገልጣል። በግሪክ ጽሑፉ ‘ብቻ’ በግልጽ ስለሌለ፣ በዋናው ትርጉም አልተጨመረም።
theological_decisions:
- issue: የἀσθενῶν ድካም ምንነት
  choice: ‘ደካማው’ ተብሎ ያለ ተጨማሪ መግለጫ ተተርጉሟል።
  alternative: ‘በእምነት ደካማ የሆነው’
  rationale: የቅርብ ዐውዱ፣ በተለይ ሮሜ 14፥1፣ ድካሙ ከእምነት ወይም ከሕሊና ጥንቃቄ ጋር እንደሚያያዝ ያሳያል። ይሁንና ይህ ቁጥር ‘ደካማው’ ብቻ ስለሚል፣ ትርጉሙ የጥቅሱን አጭር አገላለጽ ጠብቆ ማብራሪያውን ለማስታወሻ ትቷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪክ ንጽጽር በ‘አንዱ … ግን’ ተጠብቋል፤ በምንጩ ያልተገለጸው ‘ብቻ’ አልተጨመረም።
