    text: ወይም፣ “አከራካሪ አስተሳሰቦችን ለመፍረድ አይሁን” ወይም “ስለ አስተሳሰቦች ለመጨቃጨቅ አይሁን።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: ደካማ የሆነውን ሰው
  rationale: በመስተዋድድ የተጠቀሰውን የአሁን ጊዜ አድራጊ ቅጽ እንደ ሰው ገላጭ በተፈጥሯዊ አማርኛ ያቀርባል፤ ድክመቱንም ‘በሕሊና’ ብሎ ከምንጩ በላይ አይወስንም።
- source_word: τῇ πίστει
  choice: በእምነት
  rationale: ድክመቱ የሚታይበትን ረገድ ያመለክታል። እዚህ ‘እምነት’ ከ‘ትምህርተ እምነት’ ይልቅ የግለሰቡን እምነታዊ እርግጠኝነት ሊያመለክት ይችላል።
- source_word: προσλαμβάνεσθε
  choice: ተቀበሉት
  rationale: ትእዛዛዊው ግስ ሰውየውን ወደ ኅብረትና ወደ ማኅበር መቀበልን ይገልጣል፤ ‘እንግዳ ተቀበሉት’ ብሎ ለጊዜያዊ መስተንግዶ ብቻ አይገድበውም።
- source_word: μὴ εἰς
  choice: … ለመከራከር አይሁን
  rationale: ሰውየውን መቀበል የማይገባውን ዓላማ በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: διακρίσεις
  choice: ለመከራከር
  rationale: በዐውዱ ያለውን የመመዘን፣ የመፈራረድ ወይም የክርክር አሻሚነት ሙሉ በሙሉ ሳይደብቅ፣ ዋናውን የጭቅጭቅ ሐሳብ በግልጽ አማርኛ ያቀርባል።
- source_word: διαλογισμῶν
  choice: በአሳቦቹ ላይ
  rationale: የሰውየውን ውስጣዊ አስተሳሰቦች፣ አመለካከቶች ወይም አሳቦች ያለ አላስፈላጊ ሥነ መለኮታዊ ገደብ ያመለክታል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: በዓረፍተ ነገሩ ሁለተኛ ክፍል ያለውን ተቃራኒ ገደብ በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ የሌለውን ‘አሁን’ አያስገባም።
theological_decisions:
- issue: የ πίστις ትርጉም
  choice: እምነት
  alternative: መታመን፣ ታማኝነት
  rationale: ዐውዱ ስለ አንድ አማኝ በሚያከራክሩ ልማዶች ዙሪያ ስላለው እምነታዊ እርግጠኝነት ይናገራል። ‘እምነት’ ዋናውን የቃሉን ስፋት ይጠብቃል፤ ‘ታማኝነት’ ግን እዚህ ከዐውዱ ጋር ያነሰ ይስማማል።
- issue: የ διακρίσεις διαλογισμῶν አሻሚነት
  choice: በአሳቦቹ ላይ ለመከራከር
  alternative: አከራካሪ አሳቦችን ለመፍረድ፤ በአስተሳሰቦች ላይ ለመጨቃጨቅ
  rationale: የግሪኩ አገላለጽ ‘ክርክሮችን’፣ ‘ፍርዶችን’ ወይም ‘ልዩነት ማውጣትን’ ሊያመለክት ይችላል። ዋናው ትርጉም በዐውዱ ግልጽ የሆነውን ክርክር ይይዛል፤ ሌላው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በሕሊና ደካማ’ የሚለው ከምንጩ በላይ የሚወስን ስለሆነ አልገባም፤ የመቀበልና የመፍረድ/የመከራከር አሻሚነቶች በማስታወሻዎች ተጠብቀዋል።
