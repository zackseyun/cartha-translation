  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: am
  text: በእምነት ደካማ የሆነውን ተቀበሉ፤[a] ስለ አስተሳሰቦች ለመከራከር ግን አይሁን።[b]
  philosophy: optimal-equivalence
  footnotes:
