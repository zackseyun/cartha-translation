    text: ወይም፣ “ወደ ኅብረታችሁ ተቀበሉት።” የግሪኩ ግስ አንድን ሰው ወደ ራስ ማቅረብን ወይም ወደ ኅብረት መቀበልን ሊያመለክት ይችላል።
    reason: lexical_alternative
