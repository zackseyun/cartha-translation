review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force (ἄρα), distributive subject (ἕκαστος ἡμῶν), and singular reflexive phrase (περὶ ἑαυτοῦ). However, it adds «ለእግዚአብሔር», which is not present in the SBLGNT text of verse 12. Although God is named in the preceding context, the supplied source wording does not express the recipient here.
  naturalness: «እያንዳንዳችን ስለ ራሱ ሂሳብ ይሰጣል» is clear, idiomatic modern standard Amharic and naturally conveys the judicial/accountability idiom λόγον δώσει.
  terminology: Replace the general «መልስ ይሰጣል» with «ሂሳብ ይሰጣል», which more specifically represents λόγον δώσει (‘give/render an account’) in this context. Retain «ስለ ራሱ» as a faithful rendering of περὶ ἑαυτοῦ.
  issues:
  - severity: high
    issue: Addition of «ለእግዚአብሔር»
    rationale: The recipient is absent from Romans 14:12 in the supplied Greek text. Its addition imports information from the preceding verse and exceeds the wording of the verse under review.
  - severity: low
    issue: «መልስ ይሰጣል» is less precise for λόγον δώσει
    rationale: It can mean simply ‘will answer/respond,’ whereas the Greek idiom denotes giving an account. «ሂሳብ ይሰጣል» preserves that accountability sense more directly.
  revised_text: ስለዚህ፣ እያንዳንዳችን ስለ ራሱ ሂሳብ ይሰጣል።
