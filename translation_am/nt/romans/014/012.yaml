  text: So then[a], each of us will give an account of himself.
translation:
  language: am
  text: ስለዚህ፣ እያንዳንዳችን ስለ ራሱ ሂሳብ ይሰጣል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἕκαστος ἡμῶν
  choice: እያንዳንዳችን
  rationale: የἕκαστοςን አከፋፋይ ኃይልና የἡμῶνን አካልነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περὶ ἑαυτοῦ
  choice: ስለ ራሱ
  rationale: περί ከባለቤት ቅጽ ጋር ያለውን ‘ስለ/በተመለከተ’ ትርጉምና የግለሰብ ነጸብራቃዊ አገላለጹን ይጠብቃል።
- source_word: λόγον δώσει
  choice: መልስ ይሰጣል
  rationale: በፍርድ ወይም በግምገማ አውድ ‘ስለ ራስ ሂሳብ/መግለጫ መስጠት’ የሚለውን ግሪካዊ ፈሊጥ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የመልሱ ተቀባይ
  choice: ለእግዚአብሔር
  alternative: ተቀባዩን በግልጽ አለመጥቀስ
  rationale: በቀደመው ቁጥር ያለው τῷ θεῷ የአረፍተ ነገሩን የፍርድ አውድ በግልጽ ያደርጋል፤ ሆኖም በቁጥር 12 የቀረበው የSBLGNT ጽሑፍ ቃሉን በቀጥታ አልያዘም።
- issue: የἑαυτοῦ ነጠላ ነጸብራቃዊ ቅርጽ
  choice: ስለ ራሱ
  alternative: ስለ ራሳችን
  rationale: ግሪኩ እያንዳንዱን ግለሰብ በነጠላ ቅርጽ ያቀርባል፤ አማርኛውም ይህን አከፋፋይ አገላለጽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ። ‘መልስ ይሰጣል’ የλόγον δώσειን ፈሊጣዊ ትርጉም ተፈጥሯዊ አድርጎ ያቀርባል።
