  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: am
  text: ያለህን እምነት[a] በእግዚአብሔር ፊት ለራስህ ያዝ። በሚፈቅደው ነገር ራሱን የማይኮንን ብፁዕ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለህን እርግጠኝነት።” በዚህ አውድ “እምነት” አከራካሪ በሆኑ ጉዳዮች ላይ ያለን የግል እርግጠኝነት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: እምነት
  rationale: የπίστιςን መደበኛ የቁልፍ ቃል ትርጉም ይጠብቃል፤ በዚህ አውድ ግን አከራካሪ በሆነው ጉዳይ ላይ በእግዚአብሔር ፊት ያለ የግል እርግጠኝነትንም ያመለክታል።
- source_word: κατὰ σεαυτὸν
  choice: ለራስህ ያዝ
  rationale: እምነቱን ወይም የግል እርግጠኝነቱን በሌሎች ላይ ሳይጭን ለራሱ እንዲይዝ የሚያዝዘውን ፈሊጣዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: የግል እምነቱ ከሰዎች ጋር የማይገፋፋ ቢሆንም በእግዚአብሔር ፊትና ተጠያቂነት ሥር መሆኑን ይጠብቃል።
- source_word: μακάριος
  choice: ብፁዕ
  rationale: በግላዊ ደስታ ብቻ ሳይወሰን የቃሉን ሥነ ምግባራዊና መለኮታዊ ክብደት ይጠብቃል።
- source_word: κρίνων ἑαυτὸν
  choice: ራሱን የማይፈርድ
  rationale: κρίνω ፍርድንም ኩነኔንም ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ አሻሚነቱን በ‘ይፈርድ’ ይጠብቃል።
- source_word: ἐν ᾧ δοκιμάζει
  choice: በሚያጸድቀው ነገር
  rationale: δοκιμάζω ከመመርመር በኋላ መቀበልን ወይም ማጽደቅን ያመለክታል፤ ‘በ’ ደግሞ የἐνን መሣሪያዊ ወይም የዘርፍ ግንኙነት ያስቀምጣል።
theological_decisions:
- issue: በአከራካሪ የሥነ ምግባር ጉዳይ አውድ የπίστις ትርጉም
  choice: በጉዳዩ ላይ በእግዚአብሔር ፊት ያለን የግል እርግጠኝነት የሚያካትት ‘እምነት’
  alternative: ‘እርግጠኝነት’ ወይም በአጠቃላይ በእግዚአብሔር መታመን
  rationale: የቅርብ አውዱ ስለ አከራካሪ ልማዶችና ሕሊና ይናገራል። ‘እምነት’ የቁልፍ ቃሉን ወጥነት ሲጠብቅ፣ አውዱ የግል እርግጠኝነት ልዩ ጥላውን ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ብፁዕ’ መጽሐፍ ቅዱሳዊ ክብደቱን ይጠብቃል፤ ዓረፍተ ነገሩ ግን ለዘመናዊ አንባቢ ቀጥተኛ ሆኖ ተቀርጿል።
