- source_word: πρόσκομμα
  choice: ማሰናከያ
  rationale: ሌላው በእምነት ወይም በሥነ ምግባር እንዲሰናከል የሚያደርግን ነገር የግሪኩን ምስላዊ አገላለጽ ጠብቆ ያሳያል።
- source_word: τῷ ἀδελφῷ
  choice: በወንድም ፊት
  rationale: የግሪኩን ተወካይ ተባዕታይ ነጠላ ቁጥር ይጠብቃል፤ በዐውዱ ግን የእምነት ወንድምን ወይም እኅትን በአጠቃላይ ሊያመለክት መቻሉ በማስታወሻ ተብራርቷል።
