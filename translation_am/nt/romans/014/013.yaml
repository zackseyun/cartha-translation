  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: am
  text: ስለዚህ ከእንግዲህ ወዲህ እርስ በርሳችን አንፋረድ፤ ይልቁንም በወንድም[a] ፊት ማሰናከያ ወይም የመውደቅ ምክንያት[b] ላለማኖር ይህን ወስኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በወንድም ወይም በእኅት ፊት።” ግሪኩ “ወንድም” የሚለውን ቃል በነጠላ ቁጥር ይጠቀማል፤ እዚህ ግን የእምነት ባልንጀራን ያመለክታል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ወጥመድ” ወይም “የሚያሰናክል ነገር።” እዚህ ቃሉ ሌላው በእምነቱ ወይም በሥነ ምግባሩ እንዲወድቅ የሚያደርግን ነገር እንጂ ስሜቱን ብቻ የሚጎዳን ነገር አያመለክትም።
    reason: lexical_alternative
