  rationale: οὖν ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ ያመለክታል፤ Μηκέτι ደግሞ ሲደረግ የነበረው ተግባር እንዲቆም ያሳስባል።
- source_word: ἀλλήλους κρίνωμεν
  choice: እርስ በርሳችን አንፋረድ
  rationale: የመጀመሪያ ሰው ብዙ ቁጥር አሳሳቢ ንዑስ አንቀጽን በተፈጥሯዊ የአማርኛ ከልካይ አገላለጽ ያስተላልፋል።
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: ይልቁንም ... ይህን ወስኑ
