  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: am
  text: አንዱ ሰው አንድን ቀን ከሌላው ቀን ይልቅ የበለጠ አስፈላጊ አድርጎ ይቆጥራል፤[a] ሌላው ግን ቀኖችን ሁሉ እኩል ይቆጥራል።[b] እያንዳንዱ በራሱ አሳብ ሙሉ እርግጠኛ ይሁን።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንዱ ሰው አንድን ቀን ከሌላው ቀን የበለጠ ይመለከታል።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “እያንዳንዱን ቀን”፤ በዐውዱ የሚሰጠው ሐሳብ “ቀኖችን ሁሉ እኩል” ወይም “ቀኖች ሁሉ አንድ ናቸው” የሚል ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ሙሉ በሙሉ እርግጠኛ ይሁን” ወይም “ፈጽሞ ተረጋግጦ ይሁን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: ከፍ አድርጎ ይቆጥራል / እኩል አድርጎ ይቆጥራል
  rationale: እዚህ κρίνω የሚያመለክተው መኮነንን ሳይሆን ግምገማ ማድረግንና ልዩነት መለየትን ነው። ይህ አተረጓጎም የሁለቱን አቋሞች ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: አንዱን ቀን ከሌላው ቀን ይልቅ ከፍ አድርጎ
  rationale: παρά በዚህ አገባብ በቀናት መካከል ንጽጽርንና ልዩነትን ያመለክታል። ጥቅሱ ያልጠቀሳቸውን ሰንበት፣ በዓል ወይም የጾም ቀን አይጨምርም።
- source_word: πᾶσαν ἡμέραν
  choice: ቀንን ሁሉ እኩል አድርጎ
  rationale: ቃል በቃል ‘ቀንን ሁሉ’ ቢሆንም፣ ከመጀመሪያው ሐረግ ጋር ያለው ንጽጽር ቀናትን እኩል አድርጎ መቁጠርን ያመለክታል።
- source_word: ἕκαστος
  choice: እያንዳንዱ
  rationale: ነጠላና አከፋፋይ ኃይሉን የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: በራሱ አሳብ
  rationale: νοῦς አእምሮን፣ አሳብን ወይም ማስተዋልን ያመለክታል። ‘በራሱ አሳብ’ የግለሰቡን የውስጥ ፍርድና እምነት በግልጽ አማርኛ ያሳያል።
- source_word: πληροφορείσθω
  choice: ፈጽሞ ይተማመን
  rationale: የአሁን ጊዜ ተገብሮ ትእዛዝ ሙሉ እርግጠኝነትንና የጸና የውስጥ እምነትን ያመለክታል።
theological_decisions:
- issue: የተጠቀሱት ቀናት ምንነት
  choice: ‘ቀን’ የሚለውን አጠቃላይ ማመልከቻ መጠበቅ
  alternative: የአይሁድ ሰንበትና በዓላት ወይም የጾምና የልዩ አምልኮ ቀናት ናቸው ብሎ መግለጽ
  rationale: ጳውሎስ የቀናቱን ዓይነት በግልጽ አልለየም፤ ትርጉሙም ይህን ሆን ብሎ ያልተወሰነ አገላለጽ ይጠብቃል።
- issue: የነጠላ ተውላጠ ስም አቀራረብ
  choice: ‘በራሱ’ የሚለውን ወካይ ነጠላ ቅርጽ መጠቀም
  alternative: በብዙ ቁጥር መተርጎም
  rationale: የግሪክ አገላለጹ ነጠላና ወካይ ነው፤ የአማርኛው ‘እያንዳንዱ ... በራሱ’ ይህንን የግለሰብ አጽንዖት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይቆጥራል’ እዚህ የቁጥር ስሌትን ሳይሆን እንደ አንድ ነገር መመልከትን ወይም መገመትን ያመለክታል።
