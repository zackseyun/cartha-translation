- source_word: πέπεισμαι
  choice: በፍጹምም አምናለሁ
  rationale: የፍጹም ጊዜውን የጸናና የተረጋጋ እምነት ለማሳየት ይረዳል፤ ከοἶδα ጋርም ያለውን ልዩነት ይጠብቃል።
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: በጌታ በኢየሱስ
  rationale: ἐν የሚያመለክተውን በጌታ ውስጥ የተመሠረተ እውቀትና እምነት ሳይገድብ ይጠብቃል፤ ‘በኢየሱስ’ የሚለው የ‘ጌታ’ን መጠሪያ ይገልጻል።
- source_word: κοινόν
  choice: ርኩስ
  rationale: በዚህ የአይሁድ የንጽሕና አውድ κοινός ተራ ወይም የጋራ ከመሆን ይልቅ ለሥርዓታዊ አገልግሎት ያልተገባን ወይም የረከሰን ያመለክታል፤ ‘ርኩስ’ ይህን ትርጉም በግልጽ ያቀርባል።
- source_word: δι’ ἑαυτοῦ
