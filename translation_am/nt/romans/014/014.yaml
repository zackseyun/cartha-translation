    text: ወይም፣ “ተራ።” የግሪኩ ቃል እዚህ በአብዛኛው በሥርዓት እንደረከሰ ወይም እንደ ቅዱስ ያልሆነ የሚቆጠርን ነገር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
