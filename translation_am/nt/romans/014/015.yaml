language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: am
  text: ምክንያቱም ወንድምህ በምግብ ምክንያት ልቡ የሚያዝን ከሆነ፣ ከእንግዲህ በፍቅር መሠረት እየኖርክ አይደለህም። መሲሑ የሞተለትን ያንን ሰው በምግብህ አታጥፋው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አታጥፋው” የሚለው “አታበላሸው” ወይም “እንዲጠፋ አታድርገው” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ ከባድ ጉዳትን ሊያመለክት ይችላል፤ ጥቅሱ ግን ትክክለኛውን የሥነ መለኮት ውጤት አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: ምግብ / በምግብህ
  rationale: ቃሉ በአጠቃላይ ምግብን ያመለክታል እንጂ ሥጋን ብቻ አይደለም፤ በሁለተኛው አጠቃቀም በ- የምክንያትን ወይም የመሣሪያን ኃይል ይጠብቃል።
- source_word: ἀδελφός
  choice: ወንድምህ
  rationale: የግሪኩን ተባዕታይ ነጠላ ቅርጽ በቀጥታ ይጠብቃል፤ በአውዱ ግን የእምነት ወንድምን ያመለክታል።
- source_word: λυπεῖται
  choice: የሚያዝን
  rationale: የሐዘንንና የስሜት ጉዳትን ክብደት ሳያሰፋ ያስተላልፋል።
- source_word: κατὰ ἀγάπην περιπατεῖς
  choice: በፍቅር መሠረት እየኖርክ
  rationale: κατά የሚገልጠውን መስፈርት ‘በ…መሠረት’ ይጠብቃል፤ የ‘መራመድ’ ሥነ ምግባራዊ ዘይቤ በአማርኛ ‘መኖር’ ተብሎ በተፈጥሯዊ መንገድ ተላልፏል።
- source_word: ἀπόλλυε
  choice: አታጥፋው
  rationale: የግሱን ከባድ ማስጠንቀቂያ ይጠብቃል፣ የመጨረሻ ጥፋት ወይም ከባድ መንፈሳዊ ጉዳት መሆኑን ግን ትርጉሙ አይወስንም።
- source_word: ἐκεῖνον
  choice: ያንን ሰው
  rationale: አመልካቹ በግለሰቡ ላይ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑπὲρ οὗ Χριστὸς ἀπέθανεν
  choice: መሲሑ የሞተለትን
  rationale: ὑπέρ ያለውን ‘ስለ/ለእርሱ’ የመወከል ሐሳብ በ‘ሞተለት’ ያስተላልፋል፤ Χριστός እንደ ማዕረግ ‘መሲሑ’ ተብሏል።
theological_decisions:
- issue: የἀπόλλυε ኃይል
  choice: አታጥፋው
  alternative: አታበላሸው፤ እንዲጠፋ አታድርገው
  rationale: ቃሉ ከባድ ነው፤ ሆኖም ጥቅሱ ጊዜያዊ መንፈሳዊ ጉዳትን ወይም የመጨረሻ ጥፋትን እንደሚያመለክት አይወስንም።
- issue: የἀδελφός ወሰን
  choice: ወንድምህ
  alternative: የእምነት ወንድምህ ወይም እህትህ
  rationale: ዋናው ጽሑፍ ተባዕታይ ነጠላውን ይጠብቃል፤ በማኅበረ ምእመናን ውስጥ በወኪልነት ሊያገለግል የሚችለው ትርጉም ግን አልተካደም።
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ Χριστός እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን ግልጽ የሚያደርገው ‘መሲሑ’ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ አመክንዮ፣ የፍቅር መስፈርትና የማስጠንቀቂያው ክብደት ተጠብቀዋል።
