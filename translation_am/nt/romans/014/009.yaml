  rationale: ‘ሞተ እና ሕያው ሆነ’ የሚለው ቅንጅትና በሙታንና በሕያዋን ላይ ስለመግዛቱ የሚናገረው ዐውድ የትንሣኤ ሕይወትን ያመለክታሉ። ዋናው ትርጉም ይህን ያሳያል፤ የግሪኩ አጭር አገላለጽ ግን በማስታወሻ ተጠብቋል።
- issue: κυριεύσῃ የሚገልጸው የመሲሕ ሥልጣን
  choice: ‘በሙታንም በሕያዋንም ላይ እንዲገዛ’።
  alternative: ‘የሙታንም የሕያዋንም ጌታ እንዲሆን’።
