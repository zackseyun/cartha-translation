  terminology: “ክርስቶስን የሚያገለግል” appropriately renders service to Christ. “እግዚአብሔርን ደስ የሚያሰኝ” gives εὐάρεστος naturally. “ሰዎች” correctly retains the inclusive sense of τοῖς ἀνθρώποις; no footnotes are needed.
