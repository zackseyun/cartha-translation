  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። በግሪኩ ያለው ተከታታይ የመታቀብ አወቃቀር በ«አለመ—» ቅርጽ ተጠብቋል።
