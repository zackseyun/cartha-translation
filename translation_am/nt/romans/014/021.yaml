base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: am
  text: ሥጋ አለመብላት፣ የወይን ጠጅም አለመጠጣት፣ ወይም ወንድምህ የሚደናቀፍበትን፣ የሚሰናከልበትን ወይም የሚዳከምበትን ማንኛውንም ነገር አለማድረግ መልካም ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ወንድምህ» በዐውዱ «ወንድምህ ወይም እህትህ»፣ ማለትም አብሮህ የሚያምን ሰውን በሚያካትት መልኩ ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: መልካም ነው
  rationale: በዚህ ዐውድ ድርጊቱ በሥነ ምግባር የተገባና የሚመሰገን መሆኑን ይገልጣል፤ «መልካም ነው» ተፈጥሯዊና ሰፊ አቻ ነው።
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: ሥጋ አለመብላት
  rationale: κρέα በዐውዱ ለምግብ የሚቀርብ ሥጋን ያመለክታል፤ የግሪኩን የድርጊት ስም አወቃቀርም ይጠብቃል።
- source_word: μηδὲ πιεῖν οἶνον
  choice: የወይን ጠጅም አለመጠጣት
  rationale: μηδέ ሌላ መታቀብን ያክላል፤ «የወይን ጠጅ» የοἶνον ግልጽና የተለመደ አቻ ነው።
- source_word: μηδὲ ἐν ᾧ
  choice: ወይም ... ማንኛውንም ነገር አለማድረግ
  rationale: በግሪኩ የመጨረሻው ክፍል ግስ ሳይደገም ቀርቷል። አማርኛው የታሰበውን ድርጊት በግልጽ ይሞላል፣ ትርጉሙን ግን አያጥብም።
- source_word: ὁ ἀδελφός σου
  choice: ወንድምህ
  rationale: የግሪኩን ተባዕታይ ነጠላ ቅርጽ በቀጥታ ይጠብቃል፤ በዐውዱ ማንኛውንም አብሮ አማኝ ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: προσκόπτει
  choice: የሚደናቀፍበትን
  rationale: ቃሉ በመሠረቱ አንድ ነገር ጋር ተጋጭቶ መደናቀፍን ያመለክታል፤ እዚህ መንፈሳዊና ሥነ ምግባራዊ እንቅፋትን በምሳሌ ይገልጣል።
- source_word: σκανδαλίζεται
  choice: የሚሰናከልበትን
  rationale: ተሳቢውን ቅርጽና አንድ ሰው በእንቅፋት ምክንያት ወደ ጥፋት የመግባቱን ሐሳብ ይገልጣል። «ይደናቀፋል» ከሚለው ጋር ያለውን የትርጉም መደራረብ ሳያጠፋ የቃላቱን ልዩነት ይጠብቃል።
- source_word: ἀσθενεῖ
  choice: የሚዳከምበትን
  rationale: ቃሉ አካላዊ ወይም ምሳሌያዊ ድካምን ሊያመለክት ይችላል፤ እዚህ «የሚዳከም» በሕሊናና በእምነት የሚደርስን ድካም ተጨማሪ ትርጓሜ ሳያስገባ ያስተላልፋል።
theological_decisions:
- issue: ἀδελφός ተወካይ በሆነ ሰፊ ትርጉም መጠቀሙ
  choice: ወንድምህ
  alternative: ወንድምህ ወይም እህትህ / አብሮ አማኝህ
  rationale: ዋናው ጽሑፍ የግሪኩን ተባዕታይ ነጠላ ቅርጽ ይጠብቃል። በዐውዱ ሴት አማኞችንም የሚያካትተው ሰፊ አጠቃቀም በግርጌ ማስታወሻ ተቀምጧል።
- issue: προσκόπτει፣ σκανδαλίζεται እና ἀσθενεῖ ያላቸውን የትርጉም መደራረብና ልዩነት መጠበቅ
  choice: የሚደናቀፍበትን፣ የሚሰናከልበትን ወይም የሚዳከምበትን
  alternative: የሚደናቀፍበትን፣ ቅር የሚሰኝበትን ወይም የሚዳከምበትን
  rationale: «ቅር የሚሰኝ» የስሜት መጎዳትን ብቻ ሊያስተላልፍ ይችላል። «የሚሰናከል» ግን σκανδαλίζεται ያለውን ወደ መንፈሳዊ ጥፋት የመገፋት ኃይል ይጠብቃል፤ ከπροσκόπτει ጋር ያለውን ቅርብነትም አይደብቅም።
