  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: am
  text: የሌላ ሰው የቤት ባሪያን[a] ለመፍረድ አንተ ማን ነህ? እርሱ በገዛ ጌታው[b] ፊት ይቆማል ወይም ይወድቃል። ነገር ግን እንዲቆም ይደረጋል፤ ጌታ[c] ሊያቆመው ይችላልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: οἰκέτης በተለይ ከቤተሰብ ወይም ከቤት ጋር የተያያዘ አገልጋይን ያመለክታል፤ ‘የቤት አገልጋይ’ ወይም ‘የቤት ባሪያ’ ተብሎ ሊተረጎም ይችላል። እዚህ ‘የቤት ባሪያ’ የባርነት ማኅበራዊ ግንኙነትን ለማሳየት ተመርጧል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘ለገዛ ጌታው።’ የግሪኩ κύριος በዚህ የባሪያ ምሳሌ ውስጥ ‘ጌታ’ ወይም ‘አለቃ’ ሊባል ይችላል፤ ‘ጌታ’ የሚለው ቃል በመጨረሻው ሐረግ ካለው ተመሳሳይ ቃል ጋር ያለውን ትስስር ያሳያል።
    reason: lexical_alternative
  - marker: c
    text: ‘ጌታ’ የሚለው ቃል የምሳሌውን የባሪያውን ጌታ ሊያመለክት ይችላል፤ በጳውሎስ አውድ ደግሞ አማኙን ማቆም የሚችለውን መለኮታዊ ጌታ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: የምትፈርድ አንተ ማን ነህ?
  rationale: የግሪኩን አጽንዖት ያለውን የተግሣጽ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል፤ ὁ κρίνων በዝምድና ሐረግ ‘የምትፈርድ’ ተተርጉሟል።
- source_word: ἀλλότριον οἰκέτην
  choice: የሌላ ሰውን የቤት ባሪያ
  rationale: οἰκέτης በተለይ የቤት ሠራተኛ ወይም ባሪያ ማለት ነው። ‘የቤት ባሪያ’ የቤተሰቡን አባልነትና የታሰረውን ማኅበራዊ ግንኙነት ይጠብቃል፤ ἀλλότριον ደግሞ ‘የሌላ ሰውን’ ተብሏል።
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: በገዛ ጌታው ፊት
  rationale: የዳቲቭ አገባቡ ባሪያው ተጠያቂ የሚሆንለትን የራሱን ጌታ ያመለክታል። ‘በ…ፊት’ የመጠየቅንና የመፈረድን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: στήκει ἢ πίπτει
  choice: ይቆማል ወይም ይወድቃል
  rationale: የመቆምና የመውደቅን ተቃራኒ ምስል በቀጥታ ይጠብቃል፤ የመጽደቅ ወይም የመወገድ ትርጉሙን በማብራሪያ አይተካም።
- source_word: σταθήσεται
  choice: እንዲቆም ይደረጋል
  rationale: የግሪኩን የወደፊት ጊዜ ተደራጊ ቅርጽ ይጠብቃል፤ ድርጊቱን የሚፈጽም ወኪል በቀጣዩ ሐረግ ጌታ መሆኑ ይገለጣል።
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: ጌታ ሊያቆመው ይችላልና
  rationale: γάρ የምክንያት ግንኙነትን ‘-ና’ በሚለው ቅጥያ ያሳያል፤ δυνατεῖ ችሎታን ይገልጣል፤ στῆσαι ደግሞ ከቀደመው ‘መቆም’ ጋር ያለውን የቃል ትስስር ይጠብቃል።
theological_decisions:
- issue: በመጨረሻው ሐረግ ያለው ὁ κύριος ማንን እንደሚያመለክት
  choice: ‘ጌታ’ በመለኮታዊ ትርጉሙ ቀርቧል፤ በጳውሎስ አውድ ክርስቶስን ማመልከቱ ይበልጥ የሚመስል ነው።
