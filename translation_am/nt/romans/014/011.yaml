base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: am
  text: ተጽፎአልና፦ “በሕይወቴ እንደምኖር፣ ይላል ጌታ፣ ጉልበት ሁሉ ለእኔ ይንበረከካል፤ ምላስም ሁሉ ለእግዚአብሔር ትናዘዛለች[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እውቅና ትሰጣለች” ወይም “እግዚአብሔርን ታመሰግናለች።” የግሪኩ ግስ እንደ ዐውዱ የመናዘዝን፣ እውቅና የመስጠትን ወይም የማመስገንን ፍቺ ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ተጽፎአል
  rationale: ቅዱስ ጽሑፍን ለመጥቀስ የሚያገለግለውን ፍጹም ተደራጊ አገላለጽ በተለመደና ሥልጣናዊ ቅርጽ ያስተላልፋል።
- source_word: Ζῶ ἐγώ
  choice: እኔ ሕያው እንደ ሆንሁ
  rationale: የመሐላ ዓይነት ያለውን አጽንዖት ሳይጨምር የግሪኩን አነጋገር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κύριος
  choice: ጌታ
  rationale: ለκύριος መደበኛና ቀጥተኛ የአማርኛ አቻ ነው፤ ጽሑፉ ራሱ ያልጻፈውን መለኮታዊ ስም አያስገባም።
- source_word: ἐμοὶ
  choice: ለእኔ
  rationale: የዳቲቭ ቅርጹን በቀጥታ ያስተላልፍና ከመንበርከክ ምስል ጋር በአማርኛ ይስማማል።
- source_word: κάμψει πᾶν γόνυ
  choice: ጉልበት ሁሉ ይንበረከካል
  rationale: የሰውነት ምስሉንና የመገዛትን ትርጉም በተፈጥሯዊ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: πᾶσα γλῶσσα
  choice: ምላስም ሁሉ
  rationale: የመጀመሪያውን ሥጋዊ ምስልና የቅዱስ ጽሑፉን ድምፅ ከማጠቃለያ ትርጉም ይልቅ ይጠብቃል።
- source_word: ἐξομολογήσεται
  choice: ይናዘዛል
  rationale: የግሪኩን የመናዘዝና በግልጽ የማመን መሠረታዊ ሐሳብ ይይዛል፤ ሌሎቹ የእውቅናና የምስጋና ፍንጮች በማስታወሻ ተጠብቀዋል።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ዳቲቩን በግልጽ ያስተላልፍና ከቀደመው ‘ለእኔ’ ጋር ያለውን የጽሑፉን ልዩነት አያስወግድም።
theological_decisions:
- issue: በጥቅሱ ውስጥ ‘ጌታ’ እና ‘እግዚአብሔር’ ያላቸው ግንኙነት
  choice: ‘ይላል ጌታ ... ለእግዚአብሔር ይናዘዛል’ የሚለውን የጽሑፉን ቅርጽ ማቆየት
  alternative: የንጽጽሩን ቅርጽ ለማለስለስ የመጨረሻውን ሐረግ ‘ለእኔ ይናዘዛል’ ብሎ መተርጎም፣ ወይም በትርጉሙ ውስጥ በቀጥታ ክርስቶሎጂያዊ መደምደሚያ ማስገባት
  rationale: ጳውሎስ በመለኮታዊው ንግግር ‘ለእኔ’ ካለ በኋላ ‘ለእግዚአብሔር’ ይላል። ትርጉሙ ይህን ለውጥ ማስተካከልም ሆነ የተወሰነ ዶክትሪናዊ መደምደሚያ በጽሑፉ ላይ መጫን የለበትም።
