id: ROM.14.17
reference: Romans 14:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: am
  text: የእግዚአብሔር መንግሥት ጽድቅና[a] ሰላም፣ በመንፈስ ቅዱስም የሚገኝ ደስታ እንጂ መብላትና መጠጣት አይደለምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ”። የግሪኩ δικαιοσύνη ጽድቅን ወይም ፍትሕን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: መንግሥት
  rationale: በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ በዚህ አውድም የእግዚአብሔርን ግዛትና የግዛቱን ሥርዓት በስፋት ሊያመለክት ይችላል።
- source_word: βρῶσις καὶ πόσις
  choice: መብላትና መጠጣት
  rationale: ሁለቱንም የግሪክ ድርጊታዊ ስሞች በተመጣጣኝ መልኩ ያቀርባል፤ የምዕራፉንም የምግብና የመጠጥ ክርክር ይገልጣል።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: δικαιοσύνηን በጳውሎሳዊ አውድ ለመተርጎም የተለመደና ሰፊ ትርጉሙን የሚጠብቅ ቃል ነው፤ የፍትሕ ገጽታው በማስታወሻ ተጠብቋል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: በዚህ አውድ ያለውን የግንኙነትና የማኅበራዊ ኅብረት ስምምነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: χαρά
  choice: ደስታ
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ፣ ግልጽና ክብር ያለው የχαρά አቻ ነው።
- source_word: ἐν πνεύματι ἁγίῳ
  choice: በመንፈስ ቅዱስ የሚገኝ
  rationale: የἐνን የሉላዊነትና የመሣሪያነት ጥምር ፍንጭ ሳይወስን፣ ደስታው ከመንፈስ ቅዱስ ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γάρ
  choice: ነውና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር መዝጊያ ይጠብቃል።
theological_decisions:
- issue: የδικαιοσύνη ትርጉም በጳውሎሳዊ አውድ
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ጽድቅ የቃሉን የግል፣ የግንኙነትና የኪዳን ቅንነት ስፋት የሚሸከም የተለመደ ትርጉም ነው፤ ፍትሕ የሚለው እውነተኛ የትርጉም አማራጭ ግን በማስታወሻ ተጠብቋል።
- issue: ἐν πνεύματι ἁγίῳ የሚያመለክተው ማንነትና ግንኙነት
  choice: በመንፈስ ቅዱስ የሚገኝ
  alternative: በቅዱስ መንፈስ / በመንፈስ ቅዱስ
  rationale: በጳውሎስ አጠቃቀም ሐረጉ መንፈስ ቅዱስን በተፈጥሮ ያመለክታል። ትርጉሙ ደስታው በመንፈስ ቅዱስ ውስጥ ወይም በእርሱ አማካይነት የሚሆን መሆኑን በአንዱ ብቻ ሳይገድብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት እንጂ…አይደለም በሚለው ተቃርኖ ተጠብቋል፤ γάρ በመጨረሻው “ነውና” ተወክሏል።
