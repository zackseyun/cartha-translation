  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: am
  text: ቀኑን[a] የሚያከብር ለጌታ ያከብረዋል። የሚበላም ለጌታ ይበላል፤ ለእግዚአብሔር ያመሰግናልና። የማይበላም ለጌታ አይበላም፤ ለእግዚአብሔርም ያመሰግናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቀኑን የሚያከብር” የሚለው “ለቀኑ ግምት የሚሰጥ” ወይም “ስለ ቀኑ የሚያስብ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ አእምሮን በአንድ ነገር ላይ ማድረግን ወይም ለእርሱ ግምት መስጠትን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ቀንን ማክበር የሚለውን ሐሳብ ይዟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ (φρονέω)
  choice: የሚያከብር / ያከብረዋል
  rationale: በτὴν ἡμέραν ጋር በዚህ አውድ ግሱ ስለ ቀኑ በአእምሮ ማሰብን ብቻ ሳይሆን ለቀኑ ልዩ ግምት መስጠትንና በተግባር ማክበርን ያመለክታል። “ማክበር” በዘመናዊ አማርኛ ይህን ትርጉም በተፈጥሮ ያስተላልፋል፤ የግሱ ሌሎች አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: τὴν ἡμέραν
  choice: ቀኑን
  rationale: የግሪኩን የተወሰነ አመልካች ጠብቆ፣ በቅርብ አውዱ እየተወያዩበት ያለውን ቀን ያመለክታል። የትኛው ቀን እንደሆነ አይወስንም።
- source_word: κυρίῳ
  choice: ለጌታ ብሎ
  rationale: ዳቲቩ ድርጊቱ ወደ ጌታ ያተኮረ ወይም ለእርሱ ሲባል የተደረገ መሆኑን ያሳያል። “ለጌታ ብሎ” ይህን አቅጣጫና ዓላማ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐσθίων / ἐσθίει
  choice: የሚበላ / ይበላል
  rationale: የአሁን ጊዜው አሳታፊና ግስ በምግብ ጉዳይ ላይ ያለን የተለመደ ልማድ ይገልጣሉ። የአማርኛው የተለመደ አሁን ጊዜ ይህን በትክክል ይይዛል።
- source_word: εὐχαριστεῖ
  choice: ያመሰግናል
  rationale: ግሱ ለእግዚአብሔር የሚቀርብን ግልጽ የምስጋና ድርጊት ያመለክታል።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ከεὐχαριστεῖ ቀጥሎ ያለው ዳቲቭ ምስጋናው ለማን እንደሚቀርብ ያሳያል።
- source_word: ὁ μὴ ἐσθίων
  choice: የማይበላ
  rationale: የግሪኩን አሉታዊ አሳታፊ በቀጥታ ይመልሳል፤ ከ“የሚበላ” ጋር ያለውን ትይዩነትም ይጠብቃል።
theological_decisions:
- issue: “ቀኑን” የማክበር ትርጉም
  choice: በሮሜ 14 ውስጥ አከራካሪ በሆነው ልማድ አንድን የተወሰነ ቀን ልዩ አድርጎ ማየትንና ማክበርን በአጠቃላይ ማመልከት
  alternative: በተለይ ሰንበትን፣ የአይሁድን በዓላት ወይም የጾም ቀናትን ማመልከት
  rationale: ጳውሎስ በዚህ ቁጥር የቀኑን ዓይነት አይገልጽም። ትርጉሙ ይህን ሆን ተብሎ የተተወ ስፋት መጠበቅ አለበት፤ ከጽሑፉ ያልተገለጸ ልዩ ሃይማኖታዊ መለያ መጨመር የለበትም።
- issue: የκύριος ተጠቃሽ
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: በጳውሎስ አጠቃቀምና በአውዱ κύριος በተፈጥሮ ጌታ ኢየሱስን ያመለክታል፤ ምስጋናው ግን በግልጽ θεός ለተባለው እግዚአብሔር ይቀርባል። ሁለቱን ቃላት አንድ በማድረግ ፋንታ የጽሑፉ ልዩነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ለጌታ ብሎ” የሚለው አገላለጽ የግሪኩን የዓላማ/አቅጣጫ ዳቲቭ በተፈጥሯዊ አማርኛ ይገልጣል፤ የሦስቱ ክፍሎች ትይዩ አወቃቀርም ተጠብቋል።
