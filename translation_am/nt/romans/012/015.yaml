  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛ። ሁለቱ ሐረጎች በትይዩ ተዋቅረዋል፤ «ጋር» የሌሎችን ደስታና ሐዘን መጋራትን ያጎላል።
