  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: am
  text: ከሚደሰቱት ጋር ደስ ይበላችሁ፤ ከሚያለቅሱት ጋር አልቅሱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ መደበኛ ቅርጽ፦ «ከሚደሰቱት ጋር ደስ መበል፤ ከሚያለቅሱት ጋር ማልቀስ።»
    reason: የግሪክኛው የድርጊት ስም ቅርጽ በዚህ የምክር ዐውድ ትእዛዛዊ ኃይል አለው፤ ዋናው ጽሑፍ ይህን ኃይል በተፈጥሯዊ አማርኛ በትእዛዝ ቅርጽ ያሳያል።
lexical_decisions:
- source_word: χαίρειν
  choice: ደስ ይበላችሁ
  rationale: በግሪክኛው የድርጊት ስም ቅርጽ ቢሆንም፣ በዚህ የምክርና የትእዛዝ ዐውድ የማሳሰቢያ ኃይል አለው። «ደስ ይበላችሁ» ደስታን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μετὰ
  choice: ጋር
  rationale: ከዘርፍ አመልካች ተሳቢ ጋር ያለውን አብሮነትና ተካፋይነት በትክክል ይገልጣል።
- source_word: χαιρόντων
  choice: ደስ ከሚላቸው
  rationale: የአሁን ጊዜ ንቁ ተሳቢውን እንደ ስም በመተርጎም፣ አጠቃላይ ብዙ ቁጥሩንና ከዋናው ግስ ጋር ያለውን የቃል ትይዩነት ይጠብቃል።
- source_word: κλαίειν
  choice: አልቅሱ
  rationale: ይህም የድርጊት ስም ቅርጽ ቢኖረውም በዐውዱ ትእዛዛዊ ነው። «አልቅሱ» የκλαίωን የሐዘን ልቅሶ ትርጉም በክብር ያስተላልፋል።
- source_word: κλαιόντων
  choice: ከሚያለቅሱት
  rationale: ተሳቢውን እንደ ስም በተፈጥሯዊ አማርኛ ያቀርባል፤ ከመጀመሪያው ንግግር ጋር ያለውን ትይዩነትም ይጠብቃል።
theological_decisions:
- issue: በምክር ተከታታይ ውስጥ የድርጊት ስሞቹ ትእዛዛዊ ኃይል
