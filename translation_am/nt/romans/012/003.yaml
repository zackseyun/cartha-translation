  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: am
  text: ምክንያቱም በተሰጠኝ ጸጋ፣ ከእናንተ መካከል ላለው ለእያንዳንዱ እላለሁ፤ ሊያስብ ከሚገባው በላይ ስለ ራሱ ከፍ አድርጎ አያስብ፤ ይልቁንም፣ እግዚአብሔር ለእያንዳንዱ በከፈለው የእምነት መጠን መሠረት ጤናማ አስተሳሰብ እንዲኖረው ያስብ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይልቁንም ራስን የገዛ አስተሳሰብ እንዲኖረው ያስብ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የእምነቱ መጠን”፤ ደግሞም “የመታመን መጠን” ወይም “የታማኝነት መጠን” ሊሆን ይችላል። የግሪኩ ሐረግ ከእምነት ጋር የተያያዘ በእግዚአብሔር የተሰጠ መጠንን ሊያመለክት ይችላል፤ ትክክለኛውን ገጽታ ግን አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: ለእኔ በተሰጠው ጸጋ
  rationale: διά ከዝርያ ቅጽ ጋር የመንገድን ወይም የመሠረትን ሐሳብ ይገልጣል፤ ይህ አተረጓጎም ጳውሎስ የተሰጠውን ጸጋ የንግግሩ መሠረት አድርጎ መጥቀሱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: ከእናንተ መካከል ላለው ለእያንዳንዱ
  rationale: παντί ያለውን የእያንዳንዱን ኃይል እና ἐν ὑμῖν ያለውን የማኅበሩ ውስጥ መሆን ይጠብቃል።
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: ሊያስብ ከሚገባው በላይ ስለ ራሱ ከፍ አድርጎ አያስብ
  rationale: ὑπερφρονεῖν የራስን ግምት ከሚገባው ወሰን በላይ ማድረግን ያመለክታል፤ አተረጓጎሙ በφρονεῖν የተደጋገመውን የማሰብ ምስል ይጠብቃል።
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: ይልቁንም በልክ ያስብ
  rationale: σωφρονεῖν ጤናማ፣ ጥንቁቅና ራስን የገዛ አስተሳሰብን ይይዛል፤ “በልክ” ከቀደመው “ከሚገባው በላይ” ጋር ተፈጥሯዊ ተቃርኖ ይፈጥራል።
- source_word: ἐμέρισεν
  choice: ባከፋፈለው
  rationale: μερίζω መከፋፈልን ወይም ለየብቻ መድቦ መስጠትን ይገልጣል፤ ቅጹም ድርጊቱን እግዚአብሔር እንዳደረገው ያሳያል።
- source_word: μέτρον πίστεως
  choice: የእምነት መጠን
  rationale: “መጠን” የμέτρονን የመለኪያ፣ የድርሻ ወይም የወሰን ስፋት ሳያጠብ ይጠብቃል፤ πίστις ደግሞ በመደበኛው “እምነት” ተብሎ ተተርጉሟል።
theological_decisions:
- issue: የμέτρον πίστεως ትርጉም
  choice: የእምነት መጠን
  alternative: የመታመን መጠን፣ የታማኝነት መጠን፣ ወይም እምነትን እንደ መለኪያ የሚያመለክት ንባብ
  rationale: ቀጣዩ አውድ ወደ ተለያዩ ጸጋ ስጦታዎች ቢሄድም፣ ግሪኩ ሐረጉ አዳኝ እምነትን፣ የአገልግሎት ችሎታን ወይም መለኪያ የሆነ እምነትን ብቻ እንዲያመለክት አያስገድድም፤ ስለዚህ ሰፊው እና ያልተፈታው ንባብ ተጠብቋል።
