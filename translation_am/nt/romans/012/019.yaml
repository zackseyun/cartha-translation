base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: am
  text: የተወደዳችሁ ሆይ፣ ራሳችሁ በቀል አትውሰዱ፤ ይልቁንም ለቁጣው ስፍራ ስጡ[a]፤ እንዲህ ተብሎ ተጽፎአልና፤ “በቀል የእኔ ነው፤ እኔ እመልሳለሁ፤ ይላል ጌታ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለቁጣው ስፍራ ስጡ” የሚለው “ለቁጣው ቦታ ተዉ” ተብሎም ሊተረጎም ይችላል። ከሚከተለው ጥቅስ አንጻር የእግዚአብሔርን ቁጣ ማመልከቱ ይበልጥ ይመስላል፤ ሆኖም በግሪክኛው “የእግዚአብሔር” በግልጽ አልተጠቀሰም።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: ራሳችሁ በቀልን አትመልሱ
  rationale: የግሪክኛውን ተመላሽ አገላለጽ እና በዐውዱ ያለውን የትእዛዝ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀγαπητοί
  choice: ወዳጆች ሆይ
  rationale: የቅርብነትና የፍቅር ጥሪውን በክብር ያቆያል፤ “የተወደዳችሁ ሆይ” ከሚለው ይልቅ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
- source_word: ἀλλὰ δότε τόπον
  choice: ይልቁንም … ስፍራ ስጡ
  rationale: “ስፍራ መስጠት” የሚለውን ምሳሌያዊ አገላለጽ ያቆያል።
- source_word: τῇ ὀργῇ
  choice: ለቁጣው
  rationale: ግሪክኛው “ለቁጣው” ብቻ ስለሚል “የእግዚአብሔር” የሚለው በዋናው ጽሑፍ አልተጨመረም፤ ነገር ግን አመልካች የሆነው የተወሰነ መስተዋድድ በ“-ው” ተጠብቋል።
- source_word: γέγραπται γάρ
  choice: ምክንያቱም … ተብሎ ተጽፎአል
  rationale: ቅዱስ ጽሑፍን የሚያስገባውን የተለመደ ቀመርና የምክንያት ግንኙነቱን ይጠብቃል።
- source_word: Ἐμοὶ ἐκδίκησις
  choice: በቀል የእኔ ነው
  rationale: የዳቲቭ ተውላጠ ስሙን የባለቤትነት ትርጉም በቀጥተኛና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: ἐγὼ ἀνταποδώσω
  choice: እኔ ዋጋውን እከፍላለሁ
  rationale: በፍርድ ዐውድ የሚገኘውን የተገቢ ፍዳ መመለስ ሐሳብ በዘመናዊና ግልጽ አማርኛ ይገልጣል፤ ባህላዊው አገላለጽ በማስታወሻ ቀርቧል።
- source_word: λέγει κύριος
  choice: ይላል ጌታ
  rationale: የጥቅሱን የመለኮታዊ ተናጋሪ መግለጫ በተለመደ የአማርኛ ቅዱስ ጽሑፍ አገላለጽ ያቆያል።
theological_decisions:
- issue: በτῇ ὀργῇ ውስጥ “ቁጣው” የሚያመለክተው
  choice: በዋናው ጽሑፍ “ለቁጣው” የሚለውን አጭርና በመጠኑ አሻሚ አገላለጽ ማቆየት
