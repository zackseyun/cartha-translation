  rationale: ወዲያው የሚከተለው ከዘዳግም 32፥35 የተወሰደ ጥቅስ የፍርድና የበቀል ሥልጣን የጌታ መሆኑን ስለሚያሳይ፣ የእግዚአብሔር ቁጣ መሆኑ ይበልጥ የሚመስል ነው። ሆኖም ምንጩ “የእግዚአብሔር” ብሎ በግልጽ ስለማይናገር በዋናው ጽሑፍ አልተጨመረም።
