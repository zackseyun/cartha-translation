  edition: SBLGNT
  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: am
  text: በክፉ አትሸነፍ፤ ነገር ግን ክፉን በመልካም አሸንፍ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክፉ በሆነው ነገር አትሸነፍ፤ ክፉ የሆነውንም በመልካም በሆነ ነገር አሸንፍ።» የግሪኩ ጽሑፍ መስተዋድድ ያላቸውን ገለልተኛ ቅጽሎች ይጠቀማል፤ እነዚህም «ክፉ/መልካም» ወይም «ክፉ የሆነው/መልካም የሆነው» ተብለው ሊተረጎሙ ይችላሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: በክፉ አትሸነፍ
  rationale: μή ያለው የአሁን ጊዜ ተገብሮ ትእዛዝ ነው። «አትሸነፍ» የተገብሮውን ትርጉምና የድል/ሽንፈት ምስሉን በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ὑπὸ τοῦ κακοῦ
  choice: በክፉ
  rationale: ὑπό ከዝርያ ተሳቢ ጋር በተገብሮ ሐረጉ የድርጊቱን አድራጊ ያመለክታል። ገለልተኛ ነጠላው τοῦ κακοῦ «ክፉ» ወይም «ክፉ የሆነው» ሊባል ይችላል፤ «በክፉ» አጭርና ተፈጥሯዊ ነው።
- source_word: ἀλλὰ νίκα
  choice: ነገር ግን … አሸንፍ
  rationale: ἀλλά ጠንካራ ንፅፅርን ያሳያል፤ νίκα ደግሞ የአሁን ጊዜ አድራጊ ትእዛዝ ነው። «አሸንፍ» ከመጀመሪያው «አትሸነፍ» ጋር ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: ἐν τῷ ἀγαθῷ
  choice: በመልካም
  rationale: ἐν ከመስጫ ተሳቢ ጋር እዚህ የመሣሪያ ወይም የዘዴ ትርጉም አለው። «በመልካም» ክፉው የሚሸነፍበትን መንገድ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸ κακόν
  choice: ክፉውን
  rationale: ገለልተኛ ነጠላው በአጠቃላይ «ክፉን ነገር» ወይም «ክፋትን» ያመለክታል። «ክፉውን» የግሪኩን ቅጽ በቀረበ መንገድ ይከተላል፤ ከ«መልካም» ጋርም ያለውን ንፅፅር ይጠብቃል።
theological_decisions:
- issue: κακός/ἀγαθός እንደ ሥነ ምግባራዊ ምድቦች ወይስ እንደ ግለሰብ መተርጎም
  choice: «ክፉ» እና «መልካም» የሚሉ ሥነ ምግባራዊ ምድቦች
  alternative: «ክፉው አካል» በማለት የግል ማጣቀሻ መስጠት
  rationale: የግሪኩ ገለልተኛ ቅጾች ረቂቅ ወይም ባሕርያዊ ትርጉምን በተፈጥሮ ይደግፋሉ፤ አውዱም ለበደል ስለሚሰጥ ሥነ ምግባራዊ ምላሽ ነው። ጽሑፉ በግልጽ ያልጠቀሰውን የግል አካል አልጨመርንም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። አጭሩ ተቃርኖና «መሸነፍ/ማሸነፍ» የሚለው የግሪኩ የቃል ጨዋታ ተጠብቋል።
