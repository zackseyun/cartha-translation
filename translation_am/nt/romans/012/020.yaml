  rationale: የምስሉ ትክክለኛ አመልካች አከራካሪ ነው። አንዱን ትርጓሜ መምረጥ ግሪኩ የተወውን ጥርጣሬና ሥነ መለኮታዊ ውጥረት ያስወግዳል፤ ስለዚህ ምስሉ ተጠብቆ ሊሆኑ የሚችሉ ትርጓሜዎች በማስታወሻ ቀርበዋል።
