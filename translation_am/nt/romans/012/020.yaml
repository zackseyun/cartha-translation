review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the adversative conditional, singular ‘enemy,’ imperatives to provide food and drink, the instrumental sense of τοῦτο ποιῶν, the future result, and the deliberately uninterpreted coal image. However, the main-text phrase for ‘coals of fire’ is singular/collective in form (‘የሚነድ ፍም’) where the Greek explicitly has plural ἄνθρακας; a more exact and idiomatic collective rendering is ‘የእሳት ፍም.’
  naturalness: ‘ቢጠማ የሚጠጣ ስጠው’ is understandable but incomplete and less natural in modern standard Amharic. ‘ቢጠማ የሚጠጣ ነገር ስጠው’ is clear, natural, and does not specify water or another particular drink.
  terminology: ‘ጠላትህ,’ ‘አብላው,’ and ‘በራሱ ላይ … ትከምራለህ’ are suitable. Retaining the concrete ‘የእሳት ፍም’ image avoids deciding whether it denotes shame, conviction, repentance, or judgment.
  issues:
  - severity: medium
    issue: The coal phrase in the main text is rendered as singular/collective ‘የሚነድ ፍም.’
    rationale: ἄνθρακας πυρὸς is formally plural, ‘coals of fire.’ ‘የእሳት ፍም’ is a conventional, natural Amharic collective expression that more closely reflects the source phrase and preserves its image.
  - severity: low
    issue: The phrase ‘የሚጠጣ ስጠው’ omits ‘ነገር’ and sounds elliptical.
    rationale: Adding ‘ነገር’ makes the object explicit and idiomatic while retaining the Greek’s nonspecific sense of something to drink.
