  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: am
  text: በወንድማማች ፍቅር እርስ በርሳችሁ ከልብ ተዋደዱ፤ እርስ በርሳችሁን በማክበር ተቀዳደሙ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: በወንድማማች ፍቅር
  rationale: ቃሉ በእምነት ማኅበር ውስጥ ያለውን የቤተሰብ ዓይነት ፍቅር ያመለክታል፤ ይህ አተረጓጎም የዘመናዊ አማርኛን ተፈጥሯዊነት ከምንጩ ምስል ጋር ያስተባብራል።
- source_word: φιλόστοργοι
  choice: ከልብ ተዋደዱ
  rationale: ቃሉ የቤተሰብ አባላትን የሚመስል ሞቅ ያለ መተሳሰብንና ፍቅርን ይገልጣል፤ ‘ከልብ’ ይህን ሞቅ ያለ ዝንባሌ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῇ τιμῇ
  choice: በማክበር
  rationale: τιμή እዚህ ለሌላው ክብር መስጠትን ያመለክታል፤ የግስ ስም አገላለጹ በአማርኛ ግንኙነቱን ግልጽ ያደርጋል።
- source_word: προηγούμενοι
  choice: ተቀዳደሙ
  rationale: የግሱ ትርጉም ‘ቀድሞ መሄድ/መምራት’ እና ‘ቅድሚያ መስጠት’ መካከል ውጥረት አለው፤ ‘ተቀዳደሙ’ ሌሎችን በማክበር ቀዳሚ ለመሆን ያለውን አዎንታዊ ፉክክር ይጠብቃል።
theological_decisions:
- issue: προηγούμενοι በትእዛዙ ውስጥ የሚያመለክተው ተግባር
  choice: እርስ በርሳችሁን በማክበር ተቀዳደሙ
  alternative: እርስ በርሳችሁን በክብር አስቀድሙ
  rationale: ምንጩ ሌላውን ለማክበር ቀዳሚ መሆንን ወይም በዚህ ረገድ አንዱ ሌላውን መብለጥን ሊያመለክት ይችላል። የተመረጠው አተረጓጎም የግሪኩን ተለዋዋጭ ኃይል እና የEnglish POBን ‘outdo’ አቅጣጫ ሳያጠፋ በአማርኛ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁለቱ ትይዩ ሐረጎች በሰሚኮሎን ተለይተው የግሪኩን ሥነ አቀራረብ ያንጸባርቃሉ።
