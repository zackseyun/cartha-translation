  language: am
  text: ለማንም ክፉን በክፉ አትመልሱ፤ በሰዎች ሁሉ ፊት መልካም ነገርን ለማድረግ አስቀድማችሁ አስቡ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδενὶ
  choice: ለማንም
  rationale: የግሪኩን የተዘዋዋሪ ተሳቢ ተግባርና ሁሉን አካታች ወሰን ‘ለማንም’ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κακὸν ἀντὶ κακοῦ
  choice: ክፉን በክፉ
  rationale: በበቀል መልክ ክፉ ነገርን በክፉ ነገር መመለስን ይገልጻል፤ ‘ክፉ’ የቃሉን ሥነ ምግባራዊ ክብደት ይጠብቃል።
- source_word: ἀποδιδόντες
  choice: አትመልሱ
  rationale: ተካፋዩ በዐውዱ የማዘዝ ኃይል ስላለው፣ በአማርኛ ቀጥተኛ የክልከላ ትእዛዝ በተፈጥሯዊ ሁኔታ ቀርቧል።
- source_word: προνοούμενοι
  choice: ለማድረግ አስቡ
  rationale: ቃሉ አስቀድሞ ማሰብንና በጥንቃቄ ማቀድን ያመለክታል፤ ይህ አገላለጽ የውስጥ አሳብን ብቻ ሳይሆን ወደ ተግባር ያመራውን ጥንቃቄ ይገልጻል።
- source_word: καλὰ
  choice: መልካም የሆነውን
  rationale: ‘መልካም’ ሥነ ምግባራዊ መልካምነትን በሰፊው ይይዛል፤ የ‘የተከበረ/የተመሰገነ’ ገጽታው በማስታወሻ ተጠብቋል።
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: በሰው ሁሉ ፊት
  rationale: ሐረጉ የሕዝብ ፊት ታይነትንና ማኅበራዊ ተጠያቂነትን ያስተላልፋል፤ ‘ሰው ሁሉ’ ἀνθρώπωνን ሁሉን አካታች አድርጎ ይተረጉማል።
