    reason: alternative_reading
  - marker: b
    text: “መንፈሳዊ አምልኮአችሁ” ወይም “ምክንያታዊ አገልግሎታችሁ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ሐረግ ምክንያታዊ፣ ተገቢ ወይም መንፈሳዊ አገልግሎትን ወይም አምልኮን ሊያመለክት ይችላል።
