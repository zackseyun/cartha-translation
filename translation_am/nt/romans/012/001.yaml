base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: am
  text: 'ስለዚህ ወንድሞች ሆይ፣[a] በእግዚአብሔር ርኅራኄ ሰውነታችሁን ሕያው፣ ቅዱስና እግዚአብሔርን ደስ የሚያሰኝ መሥዋዕት እንዲሆን አድርጋችሁ እንድታቀርቡ እማጸናችኋለሁ፤ ይህም ምክንያታዊ አምልኮአችሁ ነው።[b]


    [a] “ወንድሞችና እህቶች ሆይ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል “ወንድሞች” ይላል፣ ነገር ግን ወንዶችንና ሴቶችን በአንድነት ለመጥራት ብዙ ጊዜ የወንድ ጾታ ቅርጽን ይጠቀማል።


    [b] “መንፈሳዊ አምልኮአችሁ” ወይም “ምክንያታዊ አገልግሎታችሁ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ሐረግ ምክንያታዊ፣ ተገቢ ወይም መንፈሳዊ አገልግሎትን ወይም አምልኮን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
