  choice: በተስፋ
  rationale: የመሣሪያ/የሁኔታ አገባቡን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ተስፋ የደስታው መሠረትና ክልል መሆኑን ይጠብቃል።
- source_word: χαίροντες
  choice: ደስ ይበላችሁ
  rationale: በአማርኛ ተፈጥሯዊ የሆነ ማሳሰቢያ ሲሆን፣ የግሪኩ ተሳቢ አንቀጾች በዐውደ ንባቡ የትእዛዝ ኃይል እንዳላቸው ያሳያል።
- source_word: θλίψει
  choice: በመከራ
  rationale: ጫናን፣ ጭንቀትንና ሥቃይን የሚያካትተውን ትርጉም በዘመናዊና በሰፊው የሚገባ ቃል ያቀርባል።
- source_word: ὑπομένοντες
  choice: ጸንታችሁ ቁሙ
  rationale: በችግር ሥር ሳይሸነፉ የመቆየትንና የመጽናትን ሙሉ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προσευχῇ
  choice: በጸሎት
  rationale: ስሙን በአጠቃላይ ያቀርባል፤ የግሪኩን መስተዋድዳዊ አገባብም በቀጥተኛና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: προσκαρτεροῦντες
  choice: ያለማቋረጥ ትጉ
  rationale: በጸሎት የመጽናትን፣ የመቀጠልንና ራስን ለእርሱ የመስጠትን ገጽታ ያሳያል፤ አጭር የማሳሰቢያ ቅርጹንም ይጠብቃል።
