translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የማሳሰቢያ አገላለጽ ተጠቅሟል። ሦስቱ ትይዩ ሐረጎች በሴሚኮሎን ተለይተው የግሪኩን አጭር ሦስትዮሽ ምት ይጠብቃሉ። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክቶችና ይዘቶች የተዛቡ ስለሚመስሉ፣ ለ προσκαρτεροῦντες ትክክለኛው አማራጭ ብቻ [a] ተደርጎ ቀርቧል፤ θλίψει በዋናው ጽሑፍ “መከራ” በሚለው ሰፊና ግልጽ ቃል ተተርጉሟል።
