review_pass:
  verdict: revise
  source_fidelity: The first two clauses communicate the Greek well overall. However, ያለማቋረጥ (“without interruption”) is stronger and more specific than προσκαρτεροῦντες, which denotes steadfast continuance or devoted persistence, not necessarily unceasing activity. ጸንታችሁ ቁሙ is understandable but more literally conveys ‘stand firm’ than the direct sense of enduring under affliction.
  naturalness: The draft is clear and suitably dignified. Replacing the expanded expressions with ታገሡ and በጸሎት ጽኑ retains the compact, balanced three-part exhortation and is natural modern standard Amharic.
  terminology: ተስፋ, መከራ, and ጸሎት are appropriate established terms. በጸሎት ጽኑ accurately renders steadfast devotion in prayer without importing the stronger ‘without stopping’ sense.
  issues:
  - severity: medium
    issue: ያለማቋረጥ adds an unceasing sense to προσκαρτεροῦντες.
    rationale: The Greek calls for steadfast persistence/devotion in prayer; it does not explicitly require uninterrupted prayer.
  - severity: low
    issue: ጸንታችሁ ቁሙ is less direct for ὑπομένοντες.
    rationale: It is a defensible idiom, but ታገሡ more directly expresses enduring adversity and preserves the concise parallelism.
  revised_text: በተስፋ ደስ ይበላችሁ፤ በመከራ ታገሡ፤ በጸሎት ጽኑ[a]።
