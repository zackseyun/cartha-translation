lexical_decisions:
- source_word: σπουδῇ
  choice: በትጋት
  rationale: σπουδή ትጋትን፣ ቅንዓትንና ከልብ መነሳሳትን ያመለክታል። “በትጋት” ከὀκνηροί ጋር ያለውን ቀጥተኛ ንፅፅር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὀκνηροί
  choice: አትስነፉ
  rationale: ቃሉ ስንፍናን፣ ዳተኝነትን ወይም ወደኋላ ማለትን ያመለክታል። “አትስነፉ” የምክሩን ቀጥተኛ ኃይል በዘመናዊና ግልጽ አገላለጽ ያቀርባል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የግሪኩ አገላለጽ የሰውን መንፈስ ወይም መንፈስ ቅዱስን ሊያመለክት ይችላል። “በመንፈስ” የቃሉን አሻሚነት በዋናው ጽሑፍ ይጠብቃል።
- source_word: ζέοντες
  choice: የጋላችሁ ሁኑ
  rationale: ζέω በቀጥታ “መፍላት” ማለት ሲሆን፣ እዚህ ለውስጣዊ ሙቀትና ብርቱ ቅንዓት በምሳሌያዊ ሁኔታ ተጠቅሟል። “የጋላችሁ ሁኑ” ይህን ምስል ሳያጠፋ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κυρίῳ
  choice: ጌታን
  rationale: በጳውሎስ አውድ κύριος በአብዛኛው የጌታን ማዕረግ ይይዛል፤ የአማርኛው ተሻጋሪ ግስ “አገልግሉ” ግን ተሳቢውን “ጌታን” ብሎ እንዲቀርብ ይጠይቃል።
- source_word: δουλεύοντες
  choice: አገልግሉ
  rationale: δουλεύω ባርነትን የሚያስታውስ ቢሆንም፣ በዚህ ምክራዊ አገባብ ለጌታ በመታዘዝና በመሰጠት ማገልገልን ያመለክታል። “አገልግሉ” የአገባቡን ተፈጥሯዊነት ይጠብቃል።
theological_decisions:
- issue: በτῷ πνεύματι ζέοντες ውስጥ πνεύματι የሚያመለክተው
  choice: በመንፈስ—በዋናው ጽሑፍ ማንነቱን ሳይወስኑ ማቅረብ
  alternative: “መንፈሳችሁ የጋለ ይሁን” ወይም “በመንፈስ ቅዱስ የጋላችሁ ሁኑ”
  rationale: የግሪኩ ጽሑፍ πνεῦμα የሰው ውስጣዊ መንፈስ መሆኑን ወይም መንፈስ ቅዱስን ማመልከቱን በግልጽ አይወስንም። ስለዚህ ትርጉሙ አንዱን አስተምህሮ ብቻ አይጫንም፤ አማራጩም በማስታወሻ ተጠብቋል።
