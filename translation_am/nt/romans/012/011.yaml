translation:
  language: am
  text: በትጋት አትስነፉ፤ በመንፈስ[a] የምትቃጠሉ ሁኑ፤ ጌታን አገልግሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመንፈስ” የአማኙን ውስጣዊ መንፈስ ሊያመለክት ይችላል፤ ወይም “በመንፈስ ቅዱስ” ተብሎ ሊገባ ይችላል።
