- issue: δοκιμάζειν ከእግዚአብሔር ፈቃድ ጋር ያለው ኃይል
  choice: መርምራችሁ እንድታውቁ
  alternative: ፈትናችሁ እንድታረጋግጡ
  rationale: ሰዎች በእግዚአብሔር ፈቃድ ላይ ፈራጆች እንደሆኑ ሳያስመስል፣ የታደሰ አእምሮ ፈቃዱን እንደሚለይና እንደሚያውቅ ያሳያል፤ የመፈተን ገጽታውንም “መርምራችሁ” ይጠብቃል።
- issue: εὐάρεστον ማንን ደስ እንደሚያሰኝ
  choice: ደስ የሚያሰኝ
  alternative: ተቀባይነት ያለው
  rationale: ግሪኩ በዚህ አጭር አወቃቀር ደስ የሚሰኘውን ወገን በግልጽ አይጠቅስም፤ ዋናው ጽሑፍ ይህን ግልጽ አለመሆን ጠብቆ ማብራሪያውን በማስታወሻ ይሰጣል።
