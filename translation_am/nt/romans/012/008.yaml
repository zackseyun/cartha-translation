base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: am
  text: የሚመክር ከሆነ፣ በመምከር ያድርግ፤ የሚያካፍል ከሆነ፣ በልግስና ያካፍል፤ የሚመራ ከሆነ፣ በትጋት ይምራ፤ ምሕረት የሚያደርግ ከሆነ፣ በደስታ ያድርግ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: የሚመክር … በመምከር
  rationale: የግሪኩን ዝምድና ያላቸውን ግስና ስም የቃል ትይዩነት በአማርኛ ይጠብቃል፤ ቃሉ ማበረታታትንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠቅሷል።
- source_word: ὁ μεταδιδοὺς
  choice: የሚያካፍል
  rationale: ከራስ ሀብት ለሌሎች የማካፈልን አሳታፊ ትርጉም ከአጠቃላዩ ‘መስጠት’ ይልቅ በግልጽ ያሳያል።
- source_word: ἐν ἁπλότητι
  choice: በልግስና
  rationale: ከሀብት ማካፈል ጋር ባለው ዐውድ የልግስና ትርጉሙ ተስማሚ ነው፤ የቅንነት ወይም የንጽሕና ሐሳብም ሊኖረው ይችላል።
- source_word: ὁ προϊστάμενος
  choice: የሚመራ
  rationale: አመራርንና ኃላፊነት መውሰድን በሰፊው ያሳያል፤ ጥቅሱ ያልገለጸውን የተወሰነ የቤተ ክርስቲያን ሹመት አያስገባም።
- source_word: ἐν σπουδῇ
  choice: በትጋት
  rationale: ቃሉ የሚያመለክተውን ትጋት፣ ቅንዓትና ቁርጠኝነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὁ ἐλεῶν
  choice: ምሕረትን የሚያደርግ
  rationale: የተሳቢውን ንቁና ተግባራዊ ባሕርይ ይጠብቃል።
- source_word: ἐν ἱλαρότητι
  choice: በደስታ
  rationale: ምሕረት በደስተኝነትና በፈቃደኝነት እንዲደረግ የሚያሳየውን ትርጉም በተፈጥሯዊ አገላለጽ ያቀርባል።
theological_decisions:
- issue: የ προϊστάμενος ወሰን
  choice: በአጠቃላይ ‘የሚመራ’ ተብሎ ተተርጉሟል።
  alternative: ‘የሚገዛ፣’ ‘የሚያስተዳድር’ ወይም የተወሰነ የቤተ ክርስቲያን ሹመት
  rationale: ጥቅሱ የጸጋ ስጦታዎችን በሰፊ የተሳቢ ቅርጽ ይዘረዝራል እንጂ ግልጽ የሹመት ቃል አይጠቀምም፤ ስለዚህ አጠቃላይ ትርጉሙ የጽሑፉን ስፋት ይጠብቃል።
- issue: በማካፈል ዐውድ የ ἁπλότης ትርጉም
  choice: በልግስና
  alternative: በቅንነት ወይም በንጹሕ ልብ
  rationale: በቅርብ ዐውዱ ከሀብት ማካፈል ጋር ስለተያያዘ ልግስና የሚለው ትርጉም ይበልጥ ይስማማል፤ ሌላው የቃሉ ትርጉም ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር የዝርዝር አወቃቀር እንዳይደበዝዝ ትይዩ ሐረጎች ተጠብቀዋል፤ ከቁጥር 7 የቀጠለውን የተዘዋዋሪ ትእዛዝ በአማርኛ ግልጽ ለማድረግ ‘ይጋ/ያድርግ’ ተሟልቷል።
