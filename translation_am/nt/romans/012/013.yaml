  rationale: በዚህ ዐውድ χρεία የተግባርና የቁሳዊ እጥረትን ያመለክታል፤ ‘ችግር’ በዘመናዊ አማርኛ የሰዎቹን እርዳታ የሚሻ ሁኔታ በተፈጥሯዊ አነጋገር ያሳያል።
- source_word: ἁγίων
