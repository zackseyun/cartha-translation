- source_word: φιλοξενίαν
  choice: እንግዳ መቀበልን
  rationale: φιλοξενία በተለይ እንግዶችን በፍቅር መቀበልን ያመለክታል። ‘እንግዳ መቀበል’ በአማርኛ ተፈጥሯዊ ሲሆን የቃሉን ውጫዊ አቅጣጫ በግልጽ ያሳያል።
- source_word: διώκοντες
  choice: በትጋት ተከታተሉ
  rationale: διώκω በንቃት መከታተልንና ለማግኘት መጣርን ይገልጣል፤ ‘በትጋት ተከታተሉ’ ተራ ልማድን ሳይሆን ዕድልን ፈልጎ የሚደረግ ንቁ ጥረትን ያስተላልፋል።
theological_decisions:
- issue: ‘ቅዱሳን’ የሚለው ማንን እንደሚያመለክት
  choice: አማኞችን፣ ማለትም ለእግዚአብሔር የተለየውን ሕዝብ
