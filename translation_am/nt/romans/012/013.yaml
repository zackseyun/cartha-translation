  source_fidelity: The first clause in the draft, “የቅዱሳንን ችግር በመካፈል,” can suggest sharing the saints’ troubles or suffering alongside them. In this context κοινωνοῦντες with χρείαις denotes active participation in supplying their practical needs. The second clause conveys φιλοξενία and the active force of διώκοντες well, but can be stated more directly in natural Amharic.
  naturalness: The revised wording is modern, clear, and suitably exhortative. “ለቅዱሳን ፍላጎቶች አበርክቱ” naturally communicates practical contribution, and “እንግዶችን ለመቀበል በትጋት ፈልጉ” expresses purposeful pursuit rather than mere routine hospitality.
  terminology: “ቅዱሳን” appropriately retains Paul’s corporate designation for believers without importing a later restricted sense. “ፍላጎቶች” is preferable here to “ችግር,” since χρείαις refers to needs/necessities. The hospitality footnote retains the literal stranger-welcoming nuance of φιλοξενία.
