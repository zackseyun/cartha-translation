lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: እኛም … አሉን
  rationale: የግሪኩን ተሳቢ አገባብ በተፈጥሯዊ የአማርኛ ዋና ግስ ገልጿል፤ δὲ እዚህ ለስላሳ ሽግግር ስለሚያመለክት «ም» ተጠቅሟል።
- source_word: χαρίσματα
  choice: ስጦታዎች
  rationale: በጳውሎስ አጠቃቀም ከጸጋ የሚመነጩ መንፈሳዊ ስጦታዎችን የሚገልጽ ግልጽና የተለመደ ቃል ነው።
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: በተሰጠን ጸጋ መሠረት
  rationale: κατά የመመዘኛን ወይም የመስማማትን ግንኙነት ያሳያል፤ χάρις ደግሞ እዚህ በነፃ የተሰጠ መለኮታዊ ጸጋን ያመለክታል።
- source_word: διάφορα
  choice: የተለያዩ
  rationale: የስጦታዎቹን ልዩነት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἴτε προφητείαν
  choice: ትንቢት ከሆነ
  rationale: εἴτε የስጦታዎችን ዝርዝር የሚጀምር ሁኔታዊ አገባብ ነው፤ የግሪኩን አጭር አቀራረብ በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: ከእምነት ጋር በሚመጣጠን መጠን
  rationale: ἀναλογία መጠናዊ ተመጣጣኝነትንም ሆነ መስማማትን ሊያመለክት ይችላል፤ ይህ አተረጓጎም ሁለቱንም አማራጮች ሳይዘጋ የግሪኩን ሰፊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως የሚለው ሐረግ ትርጉም
  choice: ከእምነት ጋር በሚመጣጠን መጠን
  alternative: እያንዳንዱ ባለው የእምነት መጠን፤ ወይም ከክርስቲያናዊው እምነት ይዘት ጋር በሚስማማ መልኩ
  rationale: የግሪኩ ሐረግ የተናጋሪውን የእምነት መጠን ወይም ትንቢቱ ከክርስቲያናዊው እምነት ጋር መስማማቱን ሊያመለክት ይችላል። ዋናው ጽሑፍ አሻሚነቱን ጠብቆ፣ አማራጮቹን በማስታወሻ ያቀርባል።
- issue: በግሪኩ ያልተገለጸው የማድረግ ግስ
  choice: እንጠቀምበት
  alternative: የግሪኩን ስም-ብቻ አገባብ እንዳለ መተው
  rationale: ከቁጥር 6-8 ያለው ዝርዝር በግሪክ ግስ የጎደለው ሲሆን የማሳሰቢያ ኃይል አለው። «እንጠቀምበት» በአማርኛ አሳቡን ተፈጥሯዊ ያደርገዋል፣ ነገር ግን ትንቢቱን እንደ ግለሰብ ባለቤትነት አያቀርብም።
