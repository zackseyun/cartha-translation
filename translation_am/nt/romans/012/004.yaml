  - severity: medium
    issue: The opening እንዲሁም does not convey καθάπερ γὰρ.
    rationale: It means “likewise/also,” whereas the Greek says “for just as” and deliberately opens a comparison whose corresponding clause follows in verse 5.
  - severity: low
    issue: ክፍሎች is somewhat generic for μέλη.
