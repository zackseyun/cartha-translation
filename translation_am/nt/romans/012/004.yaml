  verdict: revise
  source_fidelity: The draft preserves the one-body/many-members image and the contrast in function, but እንዲሁም means “likewise/also” and does not render καθάπερ γὰρ (“for just as”), which begins a comparison completed in the following verse. The revision retains both the explanatory γάρ and the comparative force.
