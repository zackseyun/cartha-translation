  - marker: b
    text: ወይም፣ “አንድ ዓይነት እንቅስቃሴ።” የግሪኩ ቃል እንቅስቃሴን ወይም ተግባርን ሊያመለክት ይችላል፤ እዚህ “ተግባር” ከሰውነት ምሳሌውና ከልዩ ልዩ ድርሻዎች ዐውድ ጋር ይስማማል።
