  rationale: ጳውሎስ በሚቀጥለው ቁጥር ምሳሌውን ከማኅበረ አማኞች ጋር ያዛምዳል፤ ይህ ቁጥር ግን ንጽጽሩን ብቻ ያቀርባል። ትርጉሙ ይህን የጽሑፉን ቅደም ተከተል ይጠብቃል።
