  choice: ‘አንድ ሰውነት’ እና ‘ብዙ ክፍሎች’ የሚለውን ምሳሌ ብቻ ማቅረብ፣ በዚህ ቁጥር ‘ቤተ ክርስቲያን’ ብሎ አለመጨመር
