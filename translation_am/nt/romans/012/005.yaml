id: ROM.12.5
reference: Romans 12:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: am
  text: እንዲሁ እኛ ብዙ ብንሆንም፣ በመሲሑ[a] አንድ አካል ነን፤ እያንዳንዳችን ደግሞ እርስ በርሳችን የአካል ብልቶች ነን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በክርስቶስ።” የግሪኩ Χριστός “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ እዚህ “መሲሑ” የሚለው የማዕረግነቱን ስሜት ለመጠበቅ ተመርጧል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁም
  rationale: ከቀደመው የአካል ምሳሌ ጋር ያለውን ንጽጽራዊና ድምዳሜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ πολλοὶ
  choice: እኛ ብዙ ብንሆንም
  rationale: በዐውዱ የተካተተውን የመጀመሪያ መደብ ብዙ ቁጥር ግልጽ ያደርግና የብዛትና የአንድነትን ንጽጽር ይጠብቃል።
- source_word: ἓν σῶμά
  choice: አንድ አካል
  rationale: የጋራ አንድነትን የሚገልጠውን የአካል ዘይቤ ቀጥታና ግልጽ በሆነ መንገድ ያስተላልፋል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: Χριστός የቅብዓት ማዕረግ መሆኑን ይጠብቃል፤ በ- ደግሞ የግሪኩን ἐν እና የጳውሎስን ከመሲሑ ጋር ያለ ኅብረት አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ δὲ καθ’ εἷς
  choice: እያንዳንዳችንም
  rationale: የሐረጉን አከፋፋይ ኃይል፣ ማለትም እያንዳንዱን ሰው ለየብቻ ማመልከቱን፣ በግልጽ አማርኛ ያሳያል።
- source_word: ἀλλήλων
  choice: የእርስ በርሳችን
  rationale: በአማኞች መካከል ያለውን ተ reciprocal የሆነ የመተሳሰብና የአባልነት ግንኙነት ይገልጣል።
- source_word: μέλη
  choice: ብልቶች
  rationale: ከσῶμα ጋር ያለውን የሰውነት ዘይቤ በቀጥታ ይጠብቃል፤ በዚህ ዐውድ የአካል ክፍሎችን ያመለክታል።
theological_decisions:
- issue: በἐν Χριστῷ ውስጥ Χριστῷን መተርጎም
  choice: በመሲሑ
  alternative: በክርስቶስ
  rationale: Χριστός በመሠረቱ ‘የተቀባው/መሲሕ’ የሚል ማዕረግ ስለሆነ፣ ‘መሲሑ’ የማዕረጉን ስሜት ይጠብቃል። ‘በክርስቶስ’ በአማርኛ የተለመደና ቀጥተኛ የቃሉ ዝውውር ቢሆንም፣ ዋናው ጽሑፍ የማዕረጉን ትርጉም ቀዳሚ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ሥርዓተ ነጥቡ የብዛትና የአንድነት አንቀጽን ከግለሰባዊ የእርስ በርስ አባልነት ይለያል።
