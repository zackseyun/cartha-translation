base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: am
  text: እርስ በርሳችሁ ተመሳሳይ አስተሳሰብ ይኑራችሁ፤ ከፍ ያሉ ነገሮችን አትመኙ፤[a] ይልቁንም ከዝቅተኞች ጋር ተቀላቀሉ።[b] በራሳችሁ ግምት ጥበበኞች አትሁኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከፍ ያሉ ነገሮችን አታስቡ” ወይም “አትታበዩ።”
    reason: lexical_alternative
  - marker: b
    text: “ዝቅተኞች” የሚለው ትሑታን ወይም ዝቅተኛ ማኅበራዊ ደረጃ ያላቸው ሰዎች ማለት ሊሆን ይችላል፤ የግሪኩ ቃል ደግሞ “ዝቅተኛ ነገሮች” ተብሎ ሊነበብ ይችላል። “ተቀላቀሉ” ደግሞ “አብራችሁ ተጓዙ” ወይም “ራሳችሁን ለዝቅተኛ ነገሮች ስጡ” ተብሎ ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: እርስ በርሳችሁ አንድ አሳብ ይኑራችሁ
  rationale: የግሪኩ አገላለጽ ፍጹም ተመሳሳይ ሐሳብን ብቻ ሳይሆን የጋራ አመለካከትንና ስምምነትን ያመለክታል፤ ይህ አተረጓጎም የእርስ በርስ አቅጣጫውን ይጠብቃል።
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: ከፍ ያሉትን ነገሮች አትመኙ
  rationale: ቃል በቃል ‘ከፍ ያሉትን አታስቡ’ የሚለውን ምስል በተፈጥሯዊ አማርኛ ያቀርባል፤ የኩራት ዝንባሌንም ሆነ ከፍ ያለ ማኅበራዊ ደረጃን የመሻት ፍቺ ሊይዝ ይችላል።
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: ዝቅ ካሉት ጋር ተባበሩ
  rationale: συναπαγόμενοι አብሮ መሄድን ወይም አብሮ መቀላቀልን ያመለክታል። ‘ተባበሩ’ በአማርኛ ተፈጥሯዊ ሆኖ ማኅበራዊ ቅርበቱን ይገልጣል፤ τοῖς ταπεινοῖς ሰዎችን ወይም ዝቅተኛ ነገሮችን ሊያመለክት የሚችለው ግራ አጋቢነት በማስታወሻ ተጠብቋል።
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: በራሳችሁ አስተያየት ጥበበኞች አትሁኑ
  rationale: παρ’ ἑαυτοῖς ሰው በራሱ ግምት ጥበበኛ መስሎ መታየቱን የሚገልጥ ፈሊጥ ነው፤ ‘በራሳችሁ አስተያየት’ ይህን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: τὰ ὑψηλά እና τοῖς ταπεινοῖς የሚያመለክቱት ኩራትን፣ ማኅበራዊ ደረጃን ወይም ነገሮችን መሆኑ
  choice: ዋናው ጽሑፍ ከፍ ያሉትን ነገሮች ከመመኘት ይልቅ ዝቅ ካሉት ጋር መተባበርን ይገልጣል፤ የሰዎችና የነገሮች አማራጭ በማስታወሻ ቀርቧል።
  alternative: ‘አትታበዩ፤ ከትሑታን ጋር ተባበሩ’ ወይም ‘ከፍ ያሉ ነገሮችን አትመኙ፤ ዝቅተኛ ሥራዎችን ተቀበሉ።’
  rationale: የግሪኩ ቅጽ ለአመለካከትና ለማኅበራዊ ደረጃ ሁለቱም ፍቺዎች ክፍት ነው። ትርጉሙ አንዱን ብቻ በመምረጥ ያለውን የትርጉም ውጥረት አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ብዙ ቁጥር ሁለተኛ መደብ የትእዛዝ ቅርጾች የግሪኩን የማኅበረሰብ አቅጣጫ ይጠብቃሉ።
