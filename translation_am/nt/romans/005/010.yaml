id: ROM.5.10
reference: Romans 5:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: am
  text: ምክንያቱም ጠላቶች ሳለን በልጁ ሞት ከእግዚአብሔር ጋር ከታረቅን፣ ከታረቅን በኋላማ ይልቁን በሕይወቱ[a] እንድናለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሕይወቱ ውስጥ»።
    reason: ἐν τῇ ζωῇ αὐτοῦ መሣሪያዊ እንዲሁም የተሳትፎ ወይም የስፍራ ኃይል ሊኖረው ይችላል።
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ምክንያቱም … ከ…
  rationale: «ምክንያቱም» የγάρን ማብራሪያዊ ትስስር ይጠብቃል፤ በግሱ ላይ ያለው «ከ-» ደግሞ የεἰን ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐχθροὶ ὄντες
  choice: ጠላቶች ሳለን
  rationale: የὄντεςን አብሮነትና ከእርቅ በፊት የነበረውን የግንኙነት ሁኔታ በግልጽ ቋንቋ ይገልጣል።
- source_word: κατηλλάγημεν / καταλλαγέντες
  choice: ከእግዚአብሔር ጋር ከታረቅን / ከታረቅን በኋላ
  rationale: «መታረቅ» የκαταλλάσσωን የተመለሰ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሁለተኛው አገላለጽ እርቁ ከወደፊቱ መዳን እንደሚቀድም ያሳያል።
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: በልጁ ሞት
  rationale: በዘርፍ የመጣውን διά የመንገድና የመሣሪያ ትርጉም በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: πολλῷ μᾶλλον
  choice: ከዚህ እጅግ ይበልጥ
  rationale: የጳውሎስን ከትንሹ ወደ ትልቁ የሚሄድ ክርክርና አጽንዖት ያስተላልፋል።
- source_word: σωθησόμεθα
  choice: እንድናለን
  rationale: የግሱን የወደፊት ጊዜና የመዳን ትርጉም ይጠብቃል።
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: በሕይወቱ አማካይነት
  rationale: ዋናው ንባብ ἐνን እንደ መሣሪያ በመውሰድ ከ«በልጁ ሞት» ጋር ያለውን የሞትና የሕይወት ተቃርኖ ግልጽ ያደርጋል።
theological_decisions:
- issue: የἐν τῇ ζωῇ αὐτοῦ ኃይል
  choice: የመሣሪያ ትርጉም፦ «በሕይወቱ አማካይነት»
  alternative: የስፍራ/የተሳትፎ ትርጉም፦ «በሕይወቱ ውስጥ»
  rationale: ከ«በልጁ ሞት» ጋር ያለው ቀጥተኛ ንጽጽር የመሣሪያውን ትርጉም ይደግፋል፤ ሆኖም ἐν የስፍራ ወይም የተሳትፎ ኃይል ሊኖረው ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ከታረቅን … ከታረቅን በኋላማ» የሚለው መደጋገም የግሪኩን አነጋገርና አጽንዖት ለመጠበቅ ሆን ተብሎ ተቀምጧል።
