  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአዳምና የክርስቶስ ተግባር፣ ኩነኔና መጽደቅ ያላቸው የፍርድ ንጽጽሮች ተጠብቀዋል።
