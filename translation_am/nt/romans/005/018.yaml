  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: am
  text: እንግዲህ፣ በአንድ በደል ምክንያት ኩነኔ ወደ ሰዎች ሁሉ እንደ ደረሰ፣ እንዲሁም በአንድ የጽድቅ ተግባር ምክንያት ሕይወትን የሚያስገኝ መጽደቅ[a] ወደ ሰዎች ሁሉ ደረሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “... ወደ ሕይወት መጽደቅ።”
    reason: የδικαίωσιν ζωῆςን የግሪክ አወቃቀርና የትርጉም አማራጭ ለማሳየት።
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: እንግዲህ
  rationale: የሐሳብ መደምደሚያና ውጤት የሚያመለክተውን የግሪክ አገናኝ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: παραπτώματος
  choice: በደል
  rationale: ከአጠቃላዩ ‘ኃጢአት’ ይልቅ የተፈጸመን የተሳሳተ ድርጊት ያመለክታል፤ በአማርኛም ግልጽና የተለመደ ነው።
- source_word: κατάκριμα
  choice: የፍርድ ኩነኔ
  rationale: የቃሉን የፍርድ ቤት አውድና የማስወቀስ ፍርድ ውጤት በግልጽ ሁኔታ ያሳያል።
- source_word: δικαιώματος
  choice: የጽድቅ ተግባር
  rationale: ነጠላ የሆነውን የክርስቶስ ወሳኝ ትክክለኛ ተግባር ያመለክታል፤ ድርጊቱን ከ‘መጽደቅ’ የፍርድ ውጤት ይለያል።
- source_word: δικαίωσιν ζωῆς
  choice: ሕይወትን የሚያስገኝ መጽደቅ
  rationale: የግሪኩን የግስ ስም የፍርድ ትርጉም ጠብቆ፣ የ‘ζωῆς’ን ዝምድና ሕይወትን የሚያመጣ መጽደቅ በሚል ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πάντας ἀνθρώπους
  choice: ሰዎች ሁሉ
  rationale: የግሪኩን አካታች ሰብአዊ ወሰን በሁለቱም የንጽጽር ክፍሎች በተመሳሳይ መንገድ ይጠብቃል።
theological_decisions:
- issue: ሁለተኛው ‘ሰዎች ሁሉ’ ሥነ መለኮታዊ ውጥረቱን ለመቀነስ ተገድቦ መተርጎም አለበት ወይስ የለበትም
  choice: በሁለቱም ክፍሎች ‘ሰዎች ሁሉ’ የሚለውን ያለ ትርጓሜያዊ ገደብ ማቆየት
  alternative: ‘የጸደቁት ሁሉ’ ወይም ‘የሚያምኑት ሁሉ’
  rationale: ግሪኩ በሁለቱም የንጽጽር ክፍሎች ተመሳሳዩን πάντας ἀνθρώπους ይደግማል። በትርጉሙ ውስጥ ወሰኑን ማጥበብ ጽሑፉ ራሱ ያልፈታውን ሥነ መለኮታዊ ውጥረት አስቀድሞ መፍታት ይሆናል።
- issue: ‘በአንድ በደል’ እና ‘በአንድ የጽድቅ ተግባር’ ያሉት አገላለጾች ሰውን ወይስ ተግባሩን ያመለክታሉ
  choice: የቁጥር 17 አውድን ተከትሎ ‘በአንድ ሰው’ በማለት ተዋናዩን ግልጽ ማድረግ፣ ነገር ግን ዋናውን ክብደት በተግባሩ ላይ ማቆየት
  alternative: ‘በአንድ በደል’ እና ‘በአንድ የጽድቅ ተግባር’ ብቻ በማለት የἑνόςን ሰዋዊ/ገለልተኛ አሻሚነት ሙሉ በሙሉ ማቆየት
  rationale: ἑνός በሰዋስው ከπαραπτώματος እና δικαιώματος ጋር ሊያያዝ ቢችልም፣ የቅርብ አውድ የአንዱን ሰው አዳምና የአንዱን ሰው ኢየሱስ ክርስቶስ ንጽጽር ይዟል። አማርኛው ‘በአንድ ሰው ... ተግባር’ ይህን አውዳዊ ዝምድና ግልጽ ያደርጋል።
