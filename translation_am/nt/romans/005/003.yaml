  - marker: b
    text: «መከራ» የሚለው ቃል «ሥቃይ» ወይም «ጭንቀት» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «ትዕግሥት» ወይም «በጽናት መቆየት»።
    reason: lexical_alternative
lexical_decisions:
