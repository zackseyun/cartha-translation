- source_word: ὑπομονήν
  choice: ጽናትን
  rationale: «ጽናት» በጫና ሥር በትዕግሥት መቆየትንና አለመተውን በአጭሩ ይገልጻል።
- source_word: κατεργάζεται
  choice: እንደሚያስገኝ
  rationale: ይህ አገላለጽ መከራ ጽናትን ውጤት አድርጎ እንደሚያመጣ የሚገልጸውን ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰδότες
  choice: እናውቃለንና
  rationale: የግሪኩን አሳቢ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ «-ና» ይህ እውቀት ለመመካቱ መሠረት መሆኑን ያሳያል።
