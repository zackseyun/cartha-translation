  choice: እንመካለን
  rationale: የግሪክ ቃሉ መመካትን፣ ሐሴት ማድረግን ወይም በደስታ ከፍ ከፍ ማለትን ሊገልጽ ይችላል። «እንመካለን» የቃሉን ዋና ኃይልና በአውዱ ያለውን አስገራሚ ውጥረት ይጠብቃል፤ ይህም ራስን በትዕቢት ማወደስ ሳይሆን በእግዚአብሔር ሥራ የተመሠረተ ደስታ ነው።
- source_word: θλίψεσιν / θλῖψις
  choice: በመከራዎች / መከራ
