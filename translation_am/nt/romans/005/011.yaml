base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: am
  text: ይህ ብቻ ሳይሆን፣ በጌታችን ኢየሱስ መሲሕ[a] አማካይነት በእግዚአብሔር ደግሞ እንመካለን[b]፤ በእርሱ አማካይነትም አሁን እርቅን ተቀብለናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ፦ ክርስቶስ፤ ትርጉሙም “መሲሕ” ማለት ነው።
    reason: alternative_reading
  - marker: b
    text: “በእግዚአብሔር ደስ ይለናል” ወይም “በእግዚአብሔር ሐሴት እናደርጋለን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: እንመካለን
  rationale: የግሪክኛውን የመመካት ቀጥተኛ ሐሳብ ይጠብቃል፤ በዚህ አውድ ራስን ማክበር ሳይሆን በእግዚአብሔር ያለ የደስታና የእምነት ኩራትን ያመለክታል።
- source_word: ἐν τῷ θεῷ
  choice: በእግዚአብሔር
  rationale: ἐν እዚህ የመመካቱን መሠረትና ተሳቢ ያመለክታል፤ ተፈጥሯዊው የአማርኛ አገላለጽ “በእግዚአብሔር መመካት” ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: በአዲስ ኪዳን ክርስቶሳዊ አጠቃቀም κύριοςን በተፈጥሯዊና በተለመደ መንገድ ይተረጉማል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός እዚህ የቅቡዕ ንጉሥ መጠሪያ ስለሆነ “መሲሕ” የማዕረጉን ትርጉም በግልጽ ያስተላልፋል።
- source_word: καταλλαγὴν
  choice: እርቅን
  rationale: በቀደመው አውድ የተገለጠውን፣ ከጠላትነት ወደ ታደሰ ግንኙነት መምጣትን ያመለክታል። በአማርኛ ተሳቢ ስም ላይ የግሪክኛውን የተወሰነ አመልካች በተናጠል መግለጽ አያስፈልግም።
- source_word: νῦν … ἐλάβομεν
  choice: አሁን … ተቀብለናል
  rationale: νῦνን በግልጽ ይይዛል፤ የተፈጸመው የመቀበል ድርጊት አሁን ያለውን ውጤት እንደሚያመጣ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: Χριστόςን እንደ ክርስቶሳዊ ማዕረግ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: “መሲሕ” የቅቡዕ ንጉሥ ማዕረግ መሆኑን በግልጽ ሲያሳይ፣ “ክርስቶስ” በአማርኛ ባህላዊና የተለመደ አቻ ነው፤ አማራጩ በማስታወሻ ተጠብቋል።
- issue: καυχάομαι በእግዚአብሔር ላይ ሲውል የሚያሳየው ሐሳብ
  choice: በእግዚአብሔር እንመካለን
  alternative: በእግዚአብሔር ደስ ይለናል / ሐሴት እናደርጋለን
  rationale: ቀጥተኛው “መመካት” የጳውሎስን የቃል ምርጫ ይጠብቃል፤ አውዱ ግን ኃጢአተኛ ራስን ማክበርን ሳይሆን በእግዚአብሔር ያለ ደስታና እምነትን ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረጅሙ የግሪክኛ ዐረፍተ ነገር ትርጉሙንና የ“በእርሱ አማካይነት” ግንኙነትን ሳያጣ በሁለት ንዑስ ክፍሎች ቀርቧል።
