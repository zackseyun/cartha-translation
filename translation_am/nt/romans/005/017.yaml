  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: am
  text: አንዱ ባደረገው በደል ምክንያት ሞት በአንዱ በኩል ከነገሠ፣ የጸጋን ብዛትና የጽድቅን[a] ስጦታ የሚቀበሉት በአንዱ፣ በኢየሱስ መሲሑ[b] በኩል እጅግ ይበልጥ በሕይወት ይነግሣሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የፍትሕን ስጦታ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ኢየሱስ ክርስቶስ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: በደል
  rationale: «በደል» ሕግን ወይም ትእዛዝን የመተላለፍን ሐሳብ በተፈጥሯዊና በቀላሉ በሚገባ አማርኛ ያስተላልፋል።
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: ነግሦ / ይነግሣሉ
  rationale: የንግሥናውን ዘይቤ በሁለቱም የግስ ቅርጾች ጠብቆ የሞትንና የሕይወትን ተቃርኖ ያሳያል።
- source_word: περισσείαν
  choice: ብዛት
  rationale: በብዛት የተትረፈረፈ መሆንን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: χάριτος
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች የመለኮታዊ ሞገስንና ነጻ ስጦታን ለማመልከት የተለመደው ትክክለኛ ቃል ነው።
- source_word: δωρεᾶς
  choice: ስጦታ
  rationale: የተሰጠን ነገር በቀጥታ ይገልጣል፤ የነጻነቱ ሐሳብ በ«ጸጋ» አውድም ይታያል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በቅርብ የሚገኘውን የመጽደቅ አውድ የሚስማማ ሲሆን የቃሉን መደበኛ ጳውሎሳዊ አጠቃቀም ይጠብቃል፤ «ፍትሕ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: λαμβάνοντες
  choice: የሚቀበሉት
  rationale: ተሳቢው በመቀበል የሚለዩትን ሰዎች እንደሚገልጽ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: ἐν ζωῇ
  choice: በሕይወት
  rationale: አጭሩን የግሪክ አገላለጽና ከሞት ጋር ያለውን ተቃርኖ ሳያሰፋ ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ በመሆኑ «መሲሕ» የሚለው ትርጉሙን በግልጽ ያስተላልፋል፤ በአማርኛ ከስሙ በኋላ ያለ የተለየ አመልካች መቅረቡ ተፈጥሯዊ ነው።
theological_decisions:
- issue: δικαιοσύνης በጳውሎሳዊው ሐረግ የሚኖረው ትርጉም
  choice: የጽድቅ ስጦታ
  alternative: የፍትሕ ስጦታ
  rationale: «ጽድቅ» ከሮሜ 5 የመጽደቅ አውድ ጋር በቅርብ ይስማማል፤ ቃሉ የፍትሕንና ትክክለኛ ሥርዓትን ሐሳብ ሊይዝ ስለሚችል ያ አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: «መሲሕ» የΧριστόςን የማዕረግ ኃይል በቀጥታ ያሳያል፤ «ክርስቶስ» የሚለው ባህላዊና ስም-መሰል አማራጭ በማስታወሻ ተጠብቋል።
