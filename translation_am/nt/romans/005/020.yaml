- source_word: ἵνα πλεονάσῃ
  choice: እንዲበዛ ነው
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የሚያሳየውን የዓላማ ኃይል ይጠብቃል፤ ሥነ መለኮታዊውን ውጥረት ወደ ውጤት ብቻ አያለዝበውም።
- source_word: τὸ παράπτωμα
  choice: በደሉ
  rationale: በዚህ አገባብ የተፈጸመ ጥሰትን ወይም በደልን በግልጽና በተለመደ አማርኛ ያሳያል።
- source_word: ἁμαρτία
  choice: ኃጢአት
  rationale: በጳውሎስ ጽሑፎች የተለመደውን እና በአማርኛ ግልጽ የሆነውን አቻ ቃል ይጠቀማል።
- source_word: ὑπερεπερίσσευσεν
  choice: እጅግ አብልጦ ተትረፈረፈ
  rationale: የተጠናከረው ውሁድ ግስ ከመብዛት የሚያልፍ እጅግ የበዛ ሙላትን ያሳያል፤ ‘ተትረፈረፈ’ የሞላ ፍሰትን፣ ‘እጅግ አብልጦ’ ደግሞ ማጠናከሩን ይጠብቃል።
- source_word: ἡ χάρις
  choice: ጸጋው
  rationale: χάριςን በመደበኛው ሥነ መለኮታዊ ቃል ይተረጉማል፤ ቅጥያውም የግሪኩን የወሰን አመልካች ያንጸባርቃል።
theological_decisions:
- issue: ἵνα የሚያሳየው ሕጉ ከበደል መብዛት ጋር ያለው የዓላማ ወይም የውጤት ግንኙነት
  choice: የዓላማ አገላለጽ፦ ‘በደሉ እንዲበዛ ነው’
