  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ደግሞ’ የδὲን መሸጋገሪያ ኃይል ይይዛል፤ ያልተገለጸ የጊዜ ቃል አልተጨመረም።
