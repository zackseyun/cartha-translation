  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: am
  text: ሕጉ ደግሞ በደሉ እንዲበዛ በተጨማሪ ገባ[a]፤ ነገር ግን ኃጢአት በበዛበት ጸጋው እጅግ አብልጦ ተትረፈረፈ[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አብሮ ገባ” ወይም “ገባ”፤ የግሪኩ ቃል ከሌላ ነገር ጎን ወይም በተጨማሪ መግባትን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ጸጋው ከዚያ እጅግ ይበልጥ በዛ”።
