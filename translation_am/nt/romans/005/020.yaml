  rationale: የግሪኩ ἵνα ከንዑስ አንቀጽ ጋር የዓላማ ኃይል አለው። ይህን መጠበቅ በጳውሎስ ክርክር ያለውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ያቀርባል፤ አገላለጹ ኃጢአትን በሥነ ምግባር ማጽደቅን በራሱ አያመለክትም።
