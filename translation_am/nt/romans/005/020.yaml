lexical_decisions:
- source_word: νόμος
  choice: ሕጉ
  rationale: የወሰን አመልካቹን ጠብቆ በጳውሎስ የአገባብ ሁኔታ የሙሴን ሕግ በተፈጥሮ ያመለክታል።
- source_word: παρεισῆλθεν
  choice: በተጨማሪ ገባ
