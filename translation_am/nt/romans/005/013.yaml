  rationale: ሮሜ 5 ከአዳም እስከ ሙሴ ያለውን ዘመን ስለሚያነጻጽር የሙሴ ሕግ በአውዱ ይጠቁማል፤ ሆኖም ትርጉሙ በግሪክ ጽሑፍ የሌለውን መለያ አይጨምርም።
- issue: የἐλλογεῖται ነገረ መለኮታዊ ክብደት
