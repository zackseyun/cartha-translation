  alternative: ‘በሰው ላይ አይመዘገብም’ ወይም ‘አይቈጠርበትም’ ብሎ መተርጎም።
  rationale: ግሱ የሒሳብና በሰው ላይ የመመዝገብ ሐሳብ አለው፤ ዋናው ትርጉም ይህን ያለ ትምህርታዊ ጭነት ይጠብቃል፣ ሌሎቹም አማራጮች በማስታወሻ ቀርበዋል።
