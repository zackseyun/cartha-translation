  verdict: revise
  source_fidelity: The draft correctly renders the principal causal chain and preserves the disputed sense of ἐφ’ ᾧ in a footnote. However, ተዛመተ normally means “was related/connected,” not “spread” or “passed through,” and the causal clause has been moved ahead of the statement that death reached all people.
  naturalness: Most wording is clear modern Amharic. Replacing ተዛመተ with ደረሰ gives an idiomatic expression for death reaching all humanity. Restoring the source order also makes the extended comparison easier to follow.
  terminology: ኃጢአት, ሞት, ዓለም, and ሰዎች ሁሉ are appropriate. The footnote retains the traditional alternative without presenting it as the main translation.
  issues:
  - severity: medium
    issue: ተዛመተ is not an appropriate rendering of διῆλθεν in this context.
    rationale: In modern Amharic, መዛመት primarily denotes relation or connection rather than movement, transmission, or spread. ሞት ... ደረሰ naturally conveys that death reached all people.
  - severity: low
    issue: The causal phrase ሁሉም ኃጢአት ስለሠሩ is placed before the statement that death reached all people.
    rationale: Greek places ἐφ’ ᾧ πάντες ἥμαρτον after ὁ θάνατος διῆλθεν. Keeping that order better preserves the source syntax and the rhetorical progression.
