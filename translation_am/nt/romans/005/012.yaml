id: ROM.5.12
reference: Romans 5:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: am
  text: ስለዚህ፣ ኃጢአት በአንድ ሰው በኩል ወደ ዓለም እንደገባ፣ ሞትም በኃጢአት በኩል እንደመጣ፣ እንዲሁ ሞት ወደ ሰዎች ሁሉ ደረሰ፣ ሁሉም ኃጢአት ስለሠሩ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በባሕላዊው አተረጓጎም፣ “በእርሱ ሁሉም ኃጢአት ሠሩ።”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚደረስበትን ድምዳሜ በተፈጥሯዊና አጭር አማርኛ ያመለክታል።
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: በአንድ ሰው በኩል
  rationale: διά ከዘር ቅጽ ጋር ያለውን የመካከለኛ አድራጊነት ይጠብቃል፤ በዐውዱ አንዱ ሰው አዳም መሆኑ ግልጽ ስለሆነ ‘ሰው’ የሚለው ተፈጥሯዊ ነው።
- source_word: ἡ ἁμαρτία
  choice: ኃጢአት
  rationale: የጳውሎስን መደበኛ ሐሳብ ያለ ተጨማሪ ትርጓሜ የሚያቀርብ የተለመደ ቃል ነው።
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: ወደ ዓለም እንደገባ
  rationale: εἰς የሚገልጠውን ወደ ውስጥ የመግባት አቅጣጫ ይጠብቃል።
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: ሞትም በኃጢአት በኩል እንደመጣ
  rationale: ኃጢአት በአንድ ሰው በኩል፣ ሞትም በኃጢአት በኩል የመምጣቱን ትይዩ አወቃቀር ይጠብቃል። ‘መጣ’ በአማርኛ ተፈጥሯዊ ሲሆን በግሪኩ የታሰበውን ‘ገባ’ ያሟላል።
- source_word: οὕτως
  choice: እንዲሁም
  rationale: ውጤታዊውን ተዛማጅነት በለስላሳ አማርኛ ያሳያል።
- source_word: εἰς πάντας ἀνθρώπους
  choice: ወደ ሰዎች ሁሉ
  rationale: ወንዶችን ብቻ ሳይሆን የሰውን ዘር ሁሉ የሚያካትተውን አጠቃላይ ፍቺ ይጠብቃል።
- source_word: ὁ θάνατος διῆλθεν
  choice: ሞት … ተዛመተ
  rationale: ሞት ወደ ሰው ዘር ሁሉ መድረሱንና መስፋፋቱን በግልጽ፣ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐφ’ ᾧ
  choice: ስለ
  rationale: በዚህ ዐውድ ምክንያታዊውን ‘ምክንያቱም/ስለ’ ፍቺ በተፈጥሯዊ አማርኛ ይሰጣል፤ አከራካሪው ባሕላዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πάντες ἥμαρτον
  choice: ሁሉም ኃጢአት ሠሩ
  rationale: የግሪኩን አኦሪስት እንደ ቀላል ያለፈ ጊዜ ይተረጉማል፤ ‘ሁሉም’ የπάντεςን ሙሉ ወሰን ይጠብቃል።
theological_decisions:
- issue: የἐφ’ ᾧ πάντες ἥμαρτον ፍቺ
  choice: ምክንያታዊ፦ ‘ሁሉም ኃጢአት ስለሠሩ’
  alternative: ውክልናዊ/አካታች፦ ‘በእርሱ ሁሉም ኃጢአት ሠሩ’
  rationale: የግሪኩ ሐረግ በዐውዱ ምክንያታዊ ፍቺን በተፈጥሮ ሊያሳይ ይችላል። ሆኖም ሐረጉ በአዳምና በሰው ዘር ግንኙነት ላይ ትልቅ ሥነ መለኮታዊ ክርክር ያለበት ስለሆነ፣ የውክልና ንባቡ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ንጽጽራዊ ዓረፍተ ነገርና በሰረዝ የሚቀጥለው ያልተጠናቀቀ አወቃቀር ተጠብቋል።
