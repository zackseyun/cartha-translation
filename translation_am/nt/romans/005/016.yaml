  choice: በአንዱ ኃጢአት በሠራው ሰው በኩል
  rationale: የግሪኩን ግላዊ ማጣቀሻና አጭር አገባብ ይጠብቃል፤ የሚነጻጸረውን ያልተጠቀሰ ውጤት “ከመጣው” በማለት ያሳያል።
- source_word: κρίμα
  choice: ፍርዱ
  rationale: በዐውደ ንባቡ የዳኝነት ውሳኔን ያመለክታል፤ “ፍርድ” ከኩነኔና ከጽድቅ ፍርድ ጋር ያለውን ሕጋዊ ንጽጽር ይጠብቃል።
- source_word: ἐξ ἑνὸς
  choice: ከአንድ በደል
  rationale: በኋላ ካለው “ከብዙ በደሎች” ጋር በመነጻጸሩ አንዱ የሚያመለክተው በደልን ሊሆን ይችላል፤ ሆኖም የግሪኩ አገባብ አሻሚ ስለሆነ ቃል በቃል አማራጩና ግላዊ ንባቡ በማስታወሻ ተጠብቀዋል።
- source_word: κατάκριμα
  choice: ኩነኔ
  rationale: የውግዘት የዳኝነት ውሳኔን የሚገልጽ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ሲሆን ከጽድቅ ፍርድ ጋር ያለውን ተቃርኖ በአጭሩ ያሳያል።
- source_word: χάρισμα
  choice: የጸጋው ስጦታ
  rationale: χάρισμα ከጸጋ ጋር ያለውን የቃልና የትርጉም ግንኙነት ይጠብቃል፤ ከመጀመሪያው δώρημα ደግሞ በመጠኑ ይለያል።
- source_word: παραπτωμάτων
  choice: በደሎች
  rationale: የሞራልና የሕግ ጥሰትን በዘመናዊና ለአንባቢ ግልጽ ቃል ይገልጻል።
- source_word: δικαίωμα
  choice: ጽድቅ ፍርድ
  rationale: ከκατάκριμα ጋር ያለውን የዳኝነት ተቃርኖ ያሳያል፤ በዚህ ዐውድ ከአጠቃላይ “ጽድቅ” ይልቅ የጽድቅ ውሳኔን በቀጥታ ይገልጻል።
