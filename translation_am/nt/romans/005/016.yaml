- issue: ἐξ ἑνὸς የሚያመለክተው አንድ በደል ወይስ አንድ ሰው
  choice: በዋናው ጽሑፍ “ከአንድ በደል”
  alternative: ከአንድ ሰው፤ ቃል በቃል “ከአንድ”
  rationale: “ከብዙ በደሎች” የሚለው ተጓዳኝ ሐረግ የበደልን ንባብ ይደግፋል፤ ነገር ግን ግሪኩ ስም ሳይጨምር በአጭሩ ስለቀረበ የግለሰብ ንባቡ እንዳይጠፋ በማስታወሻ ተመዝግቧል።
