  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: am
  text: 'ስጦታውም ኃጢአት በሠራው በአንዱ በኩል ከመጣው ጋር አይመሳሰልም።[a] ፍርዱ ከአንድ በደል ተነሥቶ ወደ ኩነኔ አመራ፤ የጸጋ ስጦታው ግን ከብዙ በደሎች ተነሥቶ ወደ የጽድቅ ውሳኔ አመራ።[b][c]


    [a] ወይም፦ “ስጦታውም ኃጢአት በሠራው በአንድ ሰው በኩል ከመጣው ጋር አይመሳሰልም።”


    [b] ቃል በቃል፦ “ከአንድ።” ይህም “ከአንድ በደል” ወይም “ከአንድ ሰው” ማለት ሊሆን ይችላል።


    [c] ወይም፦ “ወደ ንጹሕ ነው የሚል ፍርድ” ወይም “ወደ ነፃ የሚያደርግ ፍርድ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
