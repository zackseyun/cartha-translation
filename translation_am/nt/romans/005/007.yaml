  text: ለጻድቅ ሰው[a][b] የሚሞት እምብዛም ነው፤ ምናልባት ግን ለመልካም ሰው ለመሞት እንኳ የሚደፍር ሰው ሊኖር ይችላል።
  philosophy: optimal-equivalence
