  rationale: ድርጊቱ እጅግ አልፎ አልፎ የሚፈጸም መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ‘በጭንቅ/ከሞላ ጎደል አይሆንም’ ስሜት ይጠብቃል።
