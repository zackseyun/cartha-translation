theological_decisions:
- issue: በδικαίου እና ἀγαθοῦ መካከል ያለውን ልዩነት መጠበቅ
  choice: ቃላቱን ‘ጻድቅ ሰው’ እና ‘መልካም ሰው’ በማለት ለይቶ መተርጎም።
  alternative: ሁለቱን እንደ ተመሳሳይ ቃላት በአንድ የአማርኛ ቃል መተርጎም።
  rationale: የጳውሎስ አነጋገር በቅንነት/ጽድቅ የሚታወቅ ሰውን ከመልካም ወይም በጎ ሰው ሆኖ ከሚታይ ሰው ሆን ብሎ ሊለይ ይችላል፤ ትርጉሙ ይህን አሻሚነት አያስወግድም።
- issue: δικαίου በሰዋስው ወንድ ፆታ መሆኑ
  choice: በአማርኛ ‘ሰው’ በማለት አጠቃላይ ኃይሉን ማቅረብ።
  alternative: ‘ጻድቅ ወንድ’ ወይም ‘ጻድቅ ሰውዬ’ ብሎ በግልጽ ወንድ ፆታ መተርጎም።
  rationale: የግሪኩ ወንድ ቅርጽ በዚህ አጠቃላይ አባባል ውስጥ ለማንኛውም ሰው የሚሠራ ይመስላል፤ ነገር ግን መደበኛው የወንድ ቅርጽ በማስታወሻ ተጠቅሷል።
