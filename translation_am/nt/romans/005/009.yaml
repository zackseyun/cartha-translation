base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: am
  text: እንግዲህ አሁን በደሙ[b] ጻድቃን ተደርገን፣ እጅግ ይልቁን በእርሱ ከቁጣው[c] እንድናለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ወይም፣ «በደሙ አማካይነት»።
    reason: lexical_alternative
  - marker: c
    text: ይህም አውዱ የሚያመለክተውን መለኮታዊ ቁጣ ማለት ነው።
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: እንግዲህ ... እጅግ ይልቁን
  rationale: «እንግዲህ» የοὖνን ከቀደመው ሐሳብ ጋር የሚያያዝ ድምዳሜ ያሳያል፤ «እጅግ ይልቁን» ደግሞ πολλῷ ... μᾶλλον ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δικαιωθέντες
  choice: ከጸደቅን
  rationale: የተፈጸመው ድርጊት ከወደፊቱ መዳን እንደሚቀድም የአዮሪስት ተደራጊ አሳታፊውን ግንኙነት ይጠብቃል፤ በጳውሎስ መልእክቶች ያለውን የδικαιόω ቁልፍ ቃልም ሳይፈታ ያቆያል።
- source_word: νῦν
  choice: አሁን
  rationale: ከመጽደቁ የተነሣ ያለውን የአሁኑን ሁኔታ በቀጥታ ያሳያል።
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: በደሙ
  rationale: ἐν በዚህ አውድ መንገድን ወይም መሠረትን ሊያመለክት ስለሚችል፣ «በደሙ» የምንጩን አጭርነትና የመሥዋዕትነት አገላለጹን ይጠብቃል።
- source_word: σωθησόμεθα
  choice: እንድናለን
  rationale: የወደፊት ተደራጊ ግሱን በግልጽና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ
  rationale: διά ከጄኒቲቭ ጋር የሚያሳየውን ወኪልነት ወይም መካከለኛነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπὸ τῆς ὀργῆς
  choice: ከቁጣው
  rationale: የግሪኩን የተወሰነ መስተዋድድ በ«-ው» ይጠብቃል፤ ቁጣው የእግዚአብሔር መሆኑን አውዱ ቢያመለክትም በዋናው ጽሑፍ የሌለውን ስም አይጨምርም።
theological_decisions:
- issue: δικαιωθέντες የሚያመለክተው የመጽደቅ ቋንቋ
  choice: በዋናው ጽሑፍ «ከጸደቅን» ተብሎ ተቀምጧል።
  alternative: «ጻድቃን ተብለን ከተቈጠርን»
  rationale: የጳውሎስን ቁልፍ ቃልና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ አንድን የተለየ የእምነት ትርጓሜ በዋናው ጽሑፍ አያስገባም።
- issue: የἡ ὀργή ባለቤት
  choice: «ከቁጣው» ተብሎ ያለ ተጨማሪ ስም ተተርጉሟል።
  alternative: «ከእግዚአብሔር ቁጣ»
  rationale: አውዱ መለኮታዊ ቁጣን ያመለክታል፤ ሆኖም ግሪኩ «እግዚአብሔር» የሚለውን ቃል በግልጽ ስለማያካትት ትርጉሙ ይህን አሻሚነት ጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «መጽደቅ»፣ «መዳን» እና «ቁጣ» የተባሉት መጽሐፍ ቅዱሳዊ ቁልፍ ቃላት ወጥነታቸውን እንዲጠብቁ ተደርጓል፤ የግሪኩ ንዑስ ሐረጎች ግን በተፈጥሯዊ የአማርኛ ቅደም ተከተል ቀርበዋል።
