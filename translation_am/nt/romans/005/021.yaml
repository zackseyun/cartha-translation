  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: am
  text: ይህም፣ ኃጢአት በሞት እንደነገሠ፣ እንዲሁ ጸጋም በጽድቅ[a] አማካይነት በኢየሱስ መሲሕ፣ በጌታችን አማካይነት ወደ ዘላለም ሕይወት እንድትነግሥ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በፍትሕ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ይህም ... እንዲያደርስ ነው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: እንደነገሠ / ነግሦ
  rationale: ጳውሎስ ኃጢአትንና ጸጋን እንደ ንጉሥ አድርጎ የሚገልጽበትን ዘይቤ ይጠብቃል።
- source_word: ἐν τῷ θανάτῳ
  choice: በሞት
  rationale: ἐν የሚያመለክተውን የግዛት ወይም የሁኔታ ስፍራ በአጭርና በተፈጥሯዊ መንገድ ያቀርባል፤ የመሣሪያ ትርጉሙንም አያስገድድም።
- source_word: ἡ χάρις
  choice: ጸጋ
  rationale: የጳውሎስን ሰውኛ አድርጎ የመግለጽ ዘይቤና ከኃጢአት ጋር ያለውን ንፅፅር የሚጠብቅ የተለመደ አቻ ቃል ነው።
- source_word: διὰ δικαιοσύνης
  choice: በጽድቅ አማካይነት
  rationale: διά ከባለቤት አገባብ ጋር የሚገልጸውን መንገድ ወይም አማካይነት ያሳያል፤ δικαιοσύνηንም በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ያቀርባል።
- source_word: εἰς ζωὴν αἰώνιον
  choice: ወደ ዘላለም ሕይወት
  rationale: εἰς ያለውን የአቅጣጫና የውጤት ኃይል ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: በጌታችን በኢየሱስ መሲሕ አማካይነት
  rationale: Χριστόςን እንደ ማዕረግ 'መሲሕ' ብሎ ያቀርባል፤ τοῦ κυρίου ἡμῶνንም ከኢየሱስ መሲሕ ጋር በግልጽ አገባብ ያያይዛል።
theological_decisions:
- issue: የδικαιοσύνη ትርጉም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: በዚህ የጳውሎስ አገባብ 'ጽድቅ' ዋናውን ሥነ መለኮታዊ እና ግንኙነታዊ ስፋት ይጠብቃል፤ 'ፍትሕ' የሚለው የፍርድና የቅንነት ገጽታ በማስታወሻ ተጠብቋል።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም መቅረቡ
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: በግሪክ አገባቡ Χριστός ያለውን የተቀባው ንጉሥ ማዕረግ በግልጽ ለማሳየት 'መሲሕ' ተመርጧል፤ በአማርኛ የተለመደው 'ክርስቶስ' ግን ሊሆን የሚችል አማራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የኃጢአትና የጸጋ ንጉሣዊ ዘይቤ ተጠብቋል፤ የግሪኩ የዓላማ/ውጤት አገባብ በአማርኛ ተፈጥሯዊ ተደርጓል።
