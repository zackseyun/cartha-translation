  to: ይህም፣ ኃጢአት በሞት እንደነገሠ፣ እንዲሁ ጸጋም በጽድቅ[a] አማካይነት በኢየሱስ መሲሕ፣ በጌታችን አማካይነት ወደ ዘላለም ሕይወት እንድትነግሥ ነው።
