  revision_rationale: The revision restores the grammatical role of grace as the subject of the ἵνα-clause and renders βασιλεύσῃ with the feminine subjunctive “እንድትነግሥ.” It retains the royal metaphor, the means phrase “በጽድቅ አማካይነት,” the directional expression “ወደ ዘላለም ሕይወት,” and Messiah as the rendering of Χριστός. The footnote anchor and its lexical alternative are preserved.
