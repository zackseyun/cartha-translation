source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: am
  text: በእርሱ አማካይነትም በእምነት ወደዚህ አሁን ወደምንቆምበት ጸጋ መግቢያ አግኝተናል፤ እንዲሁም በእግዚአብሔር ክብር ተስፋ እንመካለን[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ደስ ይለናል” ወይም “ሐሴት እናደርጋለን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: መግባት
  rationale: በዚህ ዐውደ ንባብ አማኞች ወደ ጸጋው ያገኙትን መዳረሻ በተፈጥሯዊ አማርኛ ይገልጻል፤ “መቅረብ” ወይም “መግቢያ” የሚሉትም አማራጮች ናቸው።
- source_word: πίστει
  choice: በእምነት
  rationale: የመሣሪያውን ወይም የመንገዱን ሐሳብ በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: χάριν
  choice: ጸጋ
  rationale: በጳውሎስ ደብዳቤዎች የተለመደውን የእግዚአብሔር ነፃ ቸርነትና ሞገስ የሚገልጽ ቃል ነው።
- source_word: ἑστήκαμεν
  choice: ወደቆምንበት
  rationale: የግሪኩ ፍጹም ጊዜ የሚገልጸውን፣ ቀድሞ በተፈጸመ ነገር የተገኘውንና አሁንም የቀጠለውን ሁኔታ ይጠብቃል።
- source_word: καυχώμεθα
  choice: እንመካለን
  rationale: ቃሉ የሚያመጣውን ሆን ተብሎ የተጠበቀ የመመካት ኃይል ያቆያል፤ የደስታና የሐሴት ትርጉሞች በማስታወሻ ቀርበዋል።
- source_word: ἐπ’ ἐλπίδι
  choice: በ… ተስፋ
  rationale: ተስፋው የመመካቱ መሠረት ወይም ዙሪያ መሆኑን በቀጥታ ያሳያል።
- source_word: δόξης τοῦ θεοῦ
  choice: የእግዚአብሔር ክብር
  rationale: የግሪኩን የባለቤትነት አገናኝ በግልጽና በክብር ባለው አማርኛ ያቀርባል።
theological_decisions:
- issue: καυχώμεθα የሚለውን ቃል የጳውሎስን ሥነ መለኮታዊ ውጥረት ሳያለዝብ መተርጎም
  choice: እንመካለን
  alternative: ደስ ይለናል / ሐሴት እናደርጋለን
  rationale: “እንመካለን” በአማርኛ አንዳንዴ አሉታዊ ሊሰማ ቢችልም፣ ጳውሎስ ቃሉን በአዎንታዊና በሆን ተብሎ በተጠበቀ ኃይል የተጠቀመበትን አነጋገር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተመርጧል። “በእርሱም አማካይነት” የδι’ οὗን መካከለኛነት ያሳያል፤ አሻሚነቱን ለመጠበቅ በግሪኩ የሌሉ ተጨማሪ ሥነ መለኮታዊ ማብራሪያዎች አልገቡም።
