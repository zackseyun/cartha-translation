  issues:
  - severity: medium
    issue: The phrase «ወደዚህ ወደቆምንበት ጸጋ» is awkward and has an unclear attachment.
    rationale: The Greek ἐν ᾗ ἑστήκαμεν means “in which we stand,” with grace as the antecedent. Adding «አሁን» and using the present relative form clearly expresses the ongoing state without adding theological content.
