  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: am
  text: ነገር ግን ስጦታው[a] እንደ በደሉ አይደለም፤ በአንዱ ሰው በደል ብዙዎቹ ከሞቱ፣ የእግዚአብሔር ጸጋና በአንዱ ሰው፣ በኢየሱስ መሲሕ ጸጋ የተሰጠው ስጦታ እጅግ የበለጠ ለብዙዎቹ ተትረፈረፈ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጸጋ ስጦታው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: በደል
  rationale: የስነ ምግባር ጥፋትንና መተላለፍን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ በአዳምና በመሲሑ መካከል ያለውን ንፅፅርም ይጠብቃል።
- source_word: χάρισμα
  choice: ስጦታ
  rationale: ከበደሉ ጋር ያለውን ቀጥተኛ ንፅፅር በግልጽ ቃል ያቀርባል፤ የጸጋ ባሕርዩ በቀጣዩ ሐረግ ይገለጣል።
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: ብዙዎቹ / ለብዙዎቹ
  rationale: የግሪኩን የተወሰነ አመልካች ይጠብቃል፣ አንዱንና ብዙዎቹን የሚያነፃፅረውን አገላለጽ ሳይፈታው ‘ሁሉ’ ብሎ አይተረጉመውም።
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: የእግዚአብሔር ጸጋ
  rationale: የግሪኩን የባለቤትነት አወቃቀር በቀጥታና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: በጸጋ የመጣው ስጦታ
  rationale: ἐν የሚያሳየውን የመንገድ ወይም የግንኙነት ሐሳብ ተፈጥሯዊ በሆነ አማርኛ ይገልጣል፣ ‘በጸጋ ውስጥ’ የሚለውን አሻሚ ቀጥተኛ ቅጂ ያስወግዳል።
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: በአንዱ ሰው
  rationale: በአንዱና በብዙዎቹ መካከል ያለውን የጳውሎስ የተዋቀረ ንፅፅር ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ያስተላልፋል፤ የአማርኛ የተወሰነ ቅጽ ‘መሲሑ’ እና የተፈጥሯዊው ቃላት ቅደም ተከተል ተጠብቀዋል።
- source_word: ἐπερίσσευσεν
  choice: ተትረፈረፈ
  rationale: ከመጠን በላይ መብዛትን የሚያሳየውን የπερισσεύω ኃይለኛ ትርጉምና ‘እጅግ ይልቅ’ የሚለውን አመክንዮ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: በአዳምና በመሲሑ ንፅፅር ውስጥ ‘ብዙዎቹ’ የሚለው የሚያመለክተው ወሰን
  choice: የግሪኩን ‘ብዙዎቹ’ የሚል አገላለጽ ሳይፈታ ማቆየት
  alternative: ‘ሁሉ’ ብሎ በመተርጎም የወካይነቱን ወሰን ግልጽ ማድረግ
  rationale: ጳውሎስ በዚህ ቦታ ሆን ብሎ የአንዱንና የብዙዎቹን አነፃፃሪ አገላለጽ ይጠቀማል። ‘ብዙዎቹ’ ማለት የጽሑፉን ውጥረት ይጠብቃል፣ ከሰፊው ክፍል የሚነሳውን ሥነ መለኮታዊ መደምደሚያም በዚህ አንድ ቁጥር ላይ አስቀድሞ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የአንዱ/ብዙዎቹ ትይዩነትና የጸጋ/ስጦታ ቃላዊ ትስስር ተጠብቀዋል።
