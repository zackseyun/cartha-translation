base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: am
  text: እኛ ገና ደካሞች ሳለን፣ መሲሑ በተገቢው ጊዜ ስለ እግዚአብሔርን የማይፈሩ ሰዎች[a] ሞተ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔርን የማይፈሩ ሰዎችን ወክሎ።”
    reason: ὑπέρ ከ“ስለ” በተጨማሪ “ወክሎ” የሚል ስሜት ሊኖረው ስለሚችል አማራጩን ያሳያል።
lexical_decisions:
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ ባህላዊውን ድምፅ ተከትሎ ከመጻፍ ይልቅ ትርጉሙን ‘መሲሕ’ በወሰን አመልካች ቅጥ አቅርቧል።
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: እኛ ገና ደካሞች ሳለን
  rationale: የግሪኩን genitive absolute በተፈጥሯዊ የጊዜ ንዑስ ሐረግ ይገልጻል፤ ‘ደካሞች’ የሰውን ሰፊ አቅመ ቢስነት ይጠብቃል እንጂ ወደ አካላዊ ድካም ወይም ወደ አንድ የተወሰነ አስተምህሮ አያጠብበውም።
- source_word: ἔτι
  choice: ገና
  rationale: ሁኔታው እየቀጠለ እንደነበር በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ ያለውን ድግግሞሽ ቃል በቃል መድገም በአማርኛ አስቸጋሪ ስለሚሆን አንድ ግልጽ ‘ገና’ በቂ ነው።
- source_word: κατὰ καιρὸν
  choice: በተገቢው ጊዜ
  rationale: የተስማማውን ወይም ትክክለኛውን ጊዜ ያሳያል፤ ‘የተወሰነው’ ብሎ ከምንጩ በላይ የመለኮታዊ ቀጠሮ ሐሳብ አይጨምርም።
- source_word: ὑπὲρ
  choice: ሲል
  rationale: በዚህ አገባብ ‘ለእነርሱ ጥቅም/ስለ እነርሱ’ የሚለውን ኃይል በተፈጥሯዊ አማርኛ ይይዛል፣ የውክልናና የመተካት ዝርዝር ግን በትርጉሙ ላይ አይጭንም።
- source_word: ἀσεβῶν
  choice: ፈሪሃ እግዚአብሔር ለሌላቸው ሰዎች
  rationale: ἀσεβής የሚያመለክተውን ለእግዚአብሔር ክብርና ፍርሃት የሌለውን ሃይማኖታዊና ሥነ ምግባራዊ ሁኔታ ይገልጻል፤ ‘ኃጢአተኞች’ ብሎ ወደ ሌላ የግሪክ ቃል አያጠቃልለውም።
- source_word: ἀπέθανεν
  choice: ሞተ
  rationale: የግሪኩን aorist ግስ ያለ አላስፈላጊ ማስፋፊያ ቀጥታ ይተረጉማል።
