base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: am
  text: ነገር ግን ሞት ከአዳም እስከ ሙሴ ድረስ፣ ከአዳም መተላለፍ ጋር በሚመሳሰል መልኩ ኃጢአት ባልሠሩትም ላይ ነገሠ። አዳምም ለሚመጣው አርአያ[a] ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምሳሌ” ወይም “አስቀድሞ የሚያመለክት ምልክት።”
    reason: lexical_alternative
  - marker: b
    text: “ለሚመጣው” የሚለው በዐውዱ ክርስቶስን ያመለክታል።
    reason: alternative_reading
