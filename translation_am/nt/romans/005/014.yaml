- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: ከአዳም እስከ ሙሴ ድረስ
  rationale: የጊዜውን ክልል ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: ኃጢአት ባልሠሩትም ላይ
  rationale: የሞት ንግሥና እነዚህንም እንደሚያጠቃልል የሚያሳየውን καί እና ἐπί በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπὶ τῷ ὁμοιώματι
  choice: ባለው አምሳያ
