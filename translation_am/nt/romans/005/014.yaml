- source_word: παραβάσεως
  choice: መተላለፍ
  rationale: የተሰጠን ትእዛዝ ወይም ድንበር የማለፍ ሐሳብ የሚያስተላልፍ ግልጽና የተለመደ ምርጫ ነው።
- source_word: τύπος
  choice: አምሳያ
  rationale: አዳም በኋላ ለሚመጣው ሰው ቅድመ ምሳሌ ወይም ንድፍ መሆኑን ያሳያል፤ የቃሉን ትርጉም ወደ አንድ ቴክኒካዊ ቃል አያጠብም።
- source_word: τοῦ μέλλοντος
  choice: ሊመጣ ላለው
  rationale: የግሪኩን ስማዊ የአሁን ክፍለ ግስ በተፈጥሯዊ አማርኛ ይገልጻል፤ በዋናው ጽሑፍ ውስጥ ‘ክርስቶስ’ ብሎ በመጨመር ማጣቀሻውን አይፈታም።
theological_decisions:
- issue: “ሊመጣ ላለው” የሚለው ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ የግሪኩን ክፍት አገላለጽ “ሊመጣ ላለው” በማለት መጠበቅ፤ ማጣቀሻው ክርስቶስ መሆኑን በማስታወሻ መግለጽ
  alternative: በዋናው ጽሑፍ “ለሚመጣው ክርስቶስ” ብሎ በግልጽ መተርጎም
  rationale: ሮሜ 5፥12–21 አዳምንና ክርስቶስን ያነጻጽራል፤ ሆኖም ግሪኩ በዚህ ስፍራ ስሙን በቀጥታ አይጠቅስም። ስለዚህ ትርጉሙ የጽሑፉን አገላለጽ ይጠብቃል፣ ማጣቀሻውንም በማስታወሻ ያብራራል።
