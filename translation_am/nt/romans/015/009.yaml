  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: am
  text: 'አሕዛብም ስለ ምሕረቱ እግዚአብሔርን እንዲያከብሩም፤[a] እንደ ተጻፈው፣


    “ስለዚህ በአሕዛብ መካከል አመሰግንሃለሁ፤


    ለስምህም እዘምራለሁ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በሕዝቦች መካከል» ተብሎም ሊተረጎም ይችላል (ἔθνη/ἔθνεσι ለተባሉት ሁለቱም አጠቃቀሞች)። የጳውሎስ ክርክር ጥቅሱን በተለይ ከአሕዛብ ጋር ያያይዘዋል፤ የተጠቀሰው መዝሙር ግን «ሕዝቦች» የሚለውን ሰፊ ትርጉምም ይዟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: አሕዛብ / በአሕዛብ መካከል
  rationale: በሮሜ መልእክት አውድ ቃሉ ከአይሁድ የተለዩትን ሕዝቦች በተለይ ያመለክታል። «አሕዛብ» ይህን የጳውሎስን አጠቃቀም ይጠብቃል፤ በጥቅሱ የመዝሙር አውድ ግን «ሕዝቦች» የሚለው ሰፊ ትርጉምም ሊኖረው ይችላል።
- source_word: ὑπὲρ ἐλέους
  choice: ስለ ምሕረቱ
  rationale: ὑπέρ ከዝርዝር ቅጽ ጋር በዚህ ስፍራ ምክንያትን ወይም መሠረትን ያሳያል። የቃሉ አውድ ምሕረቱ የእግዚአብሔር መሆኑን ስለሚያሳይ «ምሕረቱ» ተብሏል።
- source_word: δοξάσαι
  choice: እንዲያከብሩ ነው
  rationale: የግስ ስም ቅጹ ከቀደመው ቁጥር ሐሳብ ጋር የተያያዘ ዓላማን ወይም ውጤትን ያሳያል። ይህ አተረጓጎም ጥገኛውን አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καθὼς γέγραπται
  choice: እንደ ተጻፈው
  rationale: የቅዱሳት መጻሕፍት ጥቅስን የሚያስተዋውቅ መደበኛ አገላለጽ ነው።
- source_word: ἐξομολογήσομαί
  choice: አመሰግንሃለሁ
  rationale: በዚህ የአምልኮ አውድ ግሱ ኃጢአትን መናዘዝ ሳይሆን ለእግዚአብሔር በይፋ ምስጋና ማቅረብን ያመለክታል።
- source_word: ψαλῶ
  choice: የምስጋና መዝሙር እዘምራለሁ
  rationale: ψάλλω በኮይኔ ግሪክ ለአምላክ ምስጋና መዘመርን ያመለክታል። ይህ አገላለጽ የአምልኮውን ኃይል በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: τῷ ὀνόματί σου
  choice: ለስምህ
  rationale: የግሪኩን የተቀባይ ቅጽ እና ለእግዚአብሔር ስም ምስጋና የማቅረብን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የመክፈቻው የግስ ስም ሐረግ ተዛምዶና ኃይል
  choice: ሐረጉ ከቁጥር 8 የቀጠለ ሆኖ፣ የክርስቶስ አገልግሎት አሕዛብ ስለ እግዚአብሔር ምሕረት እንዲያከብሩት የሚያደርግ መሆኑን በ«እንዲያከብሩ ነው» ተገልጧል።
  alternative: ቃል በቃል የቀረበ ነገር ግን በአማርኛ ያልተሟላ «አሕዛብም ስለ ምሕረት እግዚአብሔርን ሊያከብሩ» የሚል ንባብ።
  rationale: የግሪኩ አገባብ በቁጥር 8 ላይ የተጀመረውን ሐሳብ ይዞ ይቀጥላል። አማርኛው ይህን ግንኙነት ግልጽ ያደርጋል፤ በተጨማሪም ጽሑፉ በእስራኤል ዘንድ የተረጋገጡትን ተስፋዎችና አሕዛብ ምሕረት ያገኙበትን አጽንዖት ሳያጠፋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አሕዛብ» መጽሐፍ ቅዱሳዊ ቢሆንም በዚህ የአይሁድና የአይሁድ ያልሆኑ ሕዝቦች ንጽጽር አውድ ትክክለኛና የታወቀ ቃል ነው።
