id: ROM.15.13
reference: Romans 15:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: am
  text: የተስፋ አምላክ በማመናችሁ ደስታንና ሰላምን ሁሉ ይሙላችሁ፤ ይህም በመንፈስ ቅዱስ ኃይል በተስፋ እንድትትረፈረፉ ዘንድ ይሁን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: የተስፋ አምላክም
  rationale: የግሪኩን የባለቤትነት አገላለጽ ‘የተስፋ አምላክ’ በሚል ተፈጥሯዊ ሁኔታ ያቀርባል፤ -ም የδὲን ለስላሳ አያያዥነት ያሳያል እንጂ ተቃርኖን አያጠናክርም።
- source_word: πληρώσαι
  choice: ይሙላችሁ
  rationale: የምኞትና የበረከት ጸሎት ቅርጹን ያስቀምጣል፣ የመሙላትንም ምስላዊ አገላለጽ ይጠብቃል።
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: ደስታንና ሰላምን ሁሉ
  rationale: πάσης የሚያሳየውን ሙሉነት በ‘ሁሉ’ ያስተላልፋል፤ ‘ደስታ’ እና ‘ሰላም’ ግልጽና የተለመዱ ቃላት ናቸው።
- source_word: ἐν τῷ πιστεύειν
  choice: በማመናችሁ
  rationale: የማመንን ተግባርና በዚያ ውስጥ የሚፈጸመውን ሁኔታ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι
  choice: በተስፋ እንድትትረፈረፉ
  rationale: εἰς τὸ + የግስ ስም የሚያሳየውን ዓላማ ወይም የታሰበ ውጤት በ‘እንድት…’ ያቀርባል፤ ‘ትትረፈረፉ’ ደግሞ περισσεύειν የሚያመለክተውን ብዛት ይጠብቃል።
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ ኃይል
  rationale: ἐν እዚህ የመሣሪያነትን ወይም የአፈጻጸምን መንገድ ስለሚያሳይ፣ ‘በ…ኃይል’ ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: የπνεύματος ἁγίου አተረጓጎም
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ
  rationale: በጳውሎሳዊው አውድ ሐረጉ መለኮታዊውን መንፈስ ያመለክታል። ‘መንፈስ ቅዱስ’ በአማርኛ የተለመደውንና ግልጹን ስያሜ ይጠቀማል፣ ጽሑፉ ያላለውንም ተጨማሪ የእምነት ዝርዝር አያስገባም።
- issue: εἰς τὸ + infinitive ዓላማ ወይስ ውጤት
  choice: የታሰበ ውጤትን በ‘እንድት…’ መግለጽ
  alternative: ቀጥተኛ ውጤትን በ‘ስለዚህ…’ መግለጽ
  rationale: በዚህ የበረከት ጸሎት ውስጥ ዓላማና ውጤት በቅርብ የተያያዙ ናቸው። ‘እንድት…’ ሁለቱንም ሊሸከም የሚችል ሲሆን አሻሚነቱን ያለአስፈላጊ ውሳኔ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። የበረከት ጸሎቱ ቅርጽ በ‘ይሙላችሁ’ ተጠብቋል፤ አረፍተ ነገሩ ግን ረዥም እንዳይሆን በከፊል ምልክት ተከፍሏል። የግርጌ ማስታወሻ አላስፈለገም።
