  text: May the God of peace be with all of you. Amen.
translation:
  language: am
  text: የሰላም አምላክም ከሁላችሁ ጋር ይሁን። አሜን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን ቀላል አያያዥነትን ያሳያል፤ ከ«አምላክ» ጋር የተያያዘው «-ም» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θεὸς τῆς εἰρήνης
  choice: የሰላም አምላክ
  rationale: የግሪኩን የባለቤትነት አገባብና የጳውሎስን የታወቀ መጠሪያ በቀጥታ ይጠብቃል።
- source_word: εἰρήνης
  choice: ሰላም
  rationale: በዚህ የበረከት ንግግር ውስጥ እርቅን፣ ደኅንነትንና ሙሉነትን ሊያካትት የሚችለው መደበኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር ይሁን
  rationale: በግሪኩ ግስ ባይገለጽም ሐረጉ የበረከት ምኞት ነው፤ «ይሁን» ይህን ተግባር ያሳያል፣ «ሁላችሁ» ደግሞ πάντων ὑμῶν ያለውን አካታች አጽንዖት ይጠብቃል።
- source_word: ἀμήν
  choice: አሜን
  rationale: የአምልኮ መደምደሚያ ቃል ስለሆነ በአማርኛ የተለመደው ቅርጽ ተጠብቋል።
theological_decisions:
- issue: ግስ የሌለውን ሐረግ እንደ መግለጫ ወይስ እንደ በረከት ምኞት መተርጎም
  choice: «ይሁን» በማለት እንደ በረከት ምኞት ተተርጉሟል።
  alternative: «የሰላም አምላክም ከሁላችሁ ጋር ነው።»
  rationale: ግሪኩ ግልጽ የምኞት ግስ ባይኖረውም፣ በመልእክት መደምደሚያ የሚገኘው ይህ አገባብ በተፈጥሮ ጸሎታዊ በረከትን ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ከሁላችሁ ጋር» የብዙ ቁጥር አድራሻውንና የበረከቱን አካታችነት ይጠብቃል።
