lexical_decisions:
- source_word: Διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚደረሰውን መደምደሚያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσλαμβάνεσθε ἀλλήλους
  choice: እርስ በርሳችሁ ተቀባበሉ
  rationale: ትእዛዙንና የ互相 መቀበልን ኃይል ጠብቆ፣ በማኅበረሰባዊ አውድ ውስጥ ሞቅ ያለ ተቀባይነትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καθὼς καὶ
  choice: …ም … እንደ… ሁሉ
  rationale: ንጽጽሩንና የκαίን ጭማሪ በአማርኛ ልማድ ይጠብቃል።
- source_word: ὁ Χριστὸς
  choice: መሲሑ
  rationale: በዚህ ስፍራ ቃሉ እንደ ማዕረግ ስለሚሠራ፣ የተቀባው ንጉሥ የሚለውን መሲሐዊ ትርጉም ያስቀምጣል።
- source_word: προσελάβετο ὑμᾶς
  choice: እናንተን እንደተቀበላችሁ
  rationale: ከትእዛዙ ጋር ያለውን የግስ ትይዩነት ይጠብቃል፤ የሁለተኛ መደብ ብዙ ቁጥርም በግልጽ ተገልጧል።
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: ለእግዚአብሔር ክብር
  rationale: የዓላማን ወይም የውጤትን ኃይል በአጭርና ክቡር አማርኛ ያቆያል፤ በንግግሩ መጨረሻ መቀመጡም የሚያመለክተውን ወሰን በአስፈላጊው መጠን ክፍት ያደርገዋል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: መግለጫ አንቀጹ ቃሉ እዚህ እንደ ማዕረግ መሥራቱን ይደግፋል። አማራጩ በግርጌ ማስታወሻ ተጠብቋል።
- issue: በቤተ እምነት ማኅበረሰብ ውስጥ የπροσλαμβάνομαι ስፋት
  choice: እርስ በርሳችሁ ተቀባበሉ
  alternative: እርስ በርሳችሁን ተቀበሉ
  rationale: በሮሜ 14–15 ያለውን የጋራ ኑሮ አውድ በመጠበቅ ንቁና ግንኙነታዊ መቀበልን ይገልጣል፤ ከጽሑፉ ያልተገኘ የአንድ ወገን ትምህርት አያስገባም።
- issue: የεἰς δόξαν τοῦ θεοῦ ዓላማ ወይም ውጤት
  choice: ለእግዚአብሔር ክብር
  alternative: እግዚአብሔር እንዲከብር
  rationale: ዋናው አተረጓጎም በግሪኩ ያለውን የዓላማ/ውጤት ውጥረት ሳይፈታ ያቆያል፤ አማራጩ የዓላማውን ንባብ ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ተቀባበሉ” የጋራና ሞቅ ያለ መቀበልን በተፈጥሯዊ ሁኔታ ይገልጣል፤ የመጨረሻው ሐረግ የግሪኩን አቀማመጥና አሻሚነት ለመጠበቅ በመጨረሻ ቀርቧል።
