base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: am
  text: ስለዚህ፣ እርስ በርሳችሁ ተቀባበሉ[b]፤ መሲሑም[a] እናንተን እንደተቀበለ፣ ለእግዚአብሔር ክብር[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መሲሑ” ወይም “ክርስቶስ።”
