base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: am
  text: ደግሞም፦ “ብሔራት ሁሉ[a]፣ ጌታን[b] አመስግኑ፤ ሕዝቦችም ሁሉ ያመስግኑት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አሕዛብ ሁሉ።” የግሪኩ ἔθνη “ብሔራት” ወይም “አሕዛብ” ማለት ይችላል፤ እዚህ ጥቅሱ ሁሉን አቀፍ ትርጉም ሲኖረው፣ ስለ አሕዛብ ከሚያቀርበው የጳውሎስ ሐሳብም ጋር ይስማማል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እግዚአብሔርን።” ይህ አተረጓጎም የጥቅሱን የዕብራይስጥ ምንጭ ያንጸባርቃል፤ በዚያ ያለው መለኮታዊ ስም በግሪክ κύριος (“ጌታ”) ተብሎ ተወክሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: ደግሞም
  rationale: ጳውሎስ ሌላ የመጽሐፍ ቅዱስ ጥቅስ እያከለ መሆኑን የሚያሳይ ተፈጥሯዊ የአማርኛ ማያያዣ ነው።
- source_word: Αἰνεῖτε
  choice: አመስግኑ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዛዊ አነጋገሩን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πάντα τὰ ἔθνη
  choice: ብሔራት ሁሉ
  rationale: በጥቅሱ ያለውን ሁሉን አቀፍ ትርጉም ያስቀድማል፤ ἔθνη በሮሜ 15 ዐውድ ‘አሕዛብ’ ማለትም ከአይሁድ ውጭ ያሉትን ሊያመለክት መቻሉ በማስታወሻ ተጠብቋል።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: κύριοςን በቀጥታ ይተረጉማል፤ ጥቅሱ በዕብራይስጥ ምንጩ የመለኮታዊውን ስም ማመልከቱ በማስታወሻ ተገልጿል።
- source_word: ἐπαινεσάτωσαν
  choice: ያመስግኑት
  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዛዊ ኃይሉን በተፈጥሯዊ የአማርኛ አነጋገር ይጠብቃል።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: ወደ ‘ጌታን’ የሚመለሰውን ተውላጠ ስም በግልጽ ሁኔታ ይወክላል።
- source_word: πάντες οἱ λαοί
  choice: ሕዝቦችም ሁሉ
  rationale: λαοίን ከἔθνη በተለየ ቃል በመተርጎም የግሪኩን ትይዩ አወቃቀርና የቃላት ልዩነት ይጠብቃል።
theological_decisions:
- issue: በብሉይ ኪዳን ጥቅስ ውስጥ κύριος የእስራኤልን አምላክ ማመልከቱ
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የSBLGNT ግሪክ ጽሑፍ κύριος ስለሚል ዋናው ጽሑፍ ‘ጌታ’ ይላል፤ ሆኖም የተጠቀሰው የዕብራይስጥ ምንጭ መለኮታዊውን ስም ስለሚጠቀም ‘እግዚአብሔር’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- issue: በጳውሎስ የአይሁድና የአሕዛብ ዐውድ ἔθνηን መተርጎም
  choice: ብሔራት ሁሉ
  alternative: አሕዛብ ሁሉ
  rationale: ጥቅሱ ሁሉን አቀፍ የአምልኮ ጥሪ ስለሆነ ‘ብሔራት’ ሰፊውን ትርጉም ይጠብቃል፤ በሮሜ 15 ዐውድ ግን ‘አሕዛብ’ የሚለው ትርጉምም ተገቢ ስለሆነ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅስ ቅርጹና ትይዩ አወቃቀሩ ተጠብቋል፤ ‘ብሔራት’ እና ‘ሕዝቦች’ በመለየት የἔθνη እና λαοί ልዩነት ተንጸባርቋል።
