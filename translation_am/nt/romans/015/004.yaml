base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: am
  text: ምክንያቱም አስቀድሞ የተጻፈው ሁሉ እኛን ለማስተማር ተጽፏል፤ ይህም በትዕግሥትና በቅዱሳት መጻሕፍት ማበረታቻ[a] ተስፋ እንዲኖረን[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ማጽናኛ’፤ παράκλησις ማበረታቻ፣ ማጽናኛ ወይም ማሳሰቢያ ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘ተስፋ ይኖረን ዘንድ’።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: የተጻፈው ሁሉ
  rationale: የግሪኩን ሰፊና አጠቃላይ ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προεγράφη
  choice: አስቀድሞ የተጻፈው
  rationale: προ- የሚያመለክተውን ቀድሞ መጻፍ ይጠብቃል፤ በዚህ አውድ በአደባባይ መለጠፍን አያመለክትም።
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: እኛን ለማስተማር
  rationale: የዓላማውን ኃይል በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐγράφη
  choice: ተጽፏል
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ በአማርኛ የቃል ድግግሞሹን ያለ ከባድነት ያቀርባል።
- source_word: ἵνα
  choice: ይህም ... እንዲኖረን ... ነው
  rationale: የዓላማ ግንኙነቱን ግልጽ አድርጎ ይጠብቃል።
- source_word: διὰ τῆς ὑπομονῆς
  choice: በጽናት
  rationale: ὑπομονή በችግር ውስጥ የሚታይን ትዕግሥትና መጽናት ያመለክታል፤ ‘ጽናት’ አጭርና የተለመደ ነው።
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: ቅዱሳት መጻሕፍት በሚሰጡት ማበረታቻ
  rationale: παράκλησις ማበረታታትን፣ ማጽናናትን ወይም ምክርን ሊያመለክት ይችላል፤ በተስፋ አውድ ‘ማበረታቻ’ በቂ ስፋት አለው።
- source_word: τῶν γραφῶν
  choice: ቅዱሳት መጻሕፍት
  rationale: በጳውሎስ አጠቃቀም γραφαί የታወቁትን ቅዱሳን ጽሑፎች ያመለክታል።
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: ተስፋ እንዲኖረን
  rationale: የἵνα ዓላማንና የንዑስ አንቀጹን ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ቅዱሳት መጻሕፍት ተስፋን በማስገኘት ያላቸው ሚና
  choice: ‘ቅዱሳት መጻሕፍት በሚሰጡት ማበረታቻ’ በማለት የመጻሕፍትን ማበረታቻ ከጽናት ጋር ተስፋ የሚያስገኝ መንገድ አድርጎ ያቀርባል።
  alternative: ጽናቱንም ሆነ ማበረታቻውን ሁለቱንም ቅዱሳት መጻሕፍት እንደሚሰጡ በግልጽ ማያያዝ፣ ወይም በመጻሕፍት ውስጥ የተቀመጡ ምሳሌዎች እንደሆኑ መተርጎም።
  rationale: የግሪኩ ቅደም ተከተል ‘የቅዱሳት መጻሕፍት’ የሚለውን በቀጥታ ከ‘ማበረታቻ’ ጋር ያያይዛል፤ ትርጉሙም ጽናትን ከዚህ ጋር በግድ ሳያያይዝ ይህን መዋቅር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቅዱሳት መጻሕፍት’ የታወቀውን ቅዱስ ጽሑፍ የሚያመለክት የተለመደ አገላለጽ ነው።
