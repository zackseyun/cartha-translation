  rationale: φιλοτιμούμενον የጳውሎስን የግል ጉጉትና ዓላማ ይገልጣል እንጂ ለሁሉ የተሰጠ ትእዛዝ አይደለም፤ ትርጉሙ ይህን ሳያሰፋ ይጠብቃል።
