id: ROM.15.16
reference: Romans 15:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: am
  text: ለአሕዛብ[a] የመሲሕ ኢየሱስ አገልጋይ እሆን ዘንድ፣ የእግዚአብሔርን ወንጌል በክህነት እያገለገልሁ[b]፣ የአሕዛብ መባ[c] በመንፈስ ቅዱስ[d] የተቀደሰ ሆኖ ተቀባይነት እንዲያገኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሕዝቦች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንደ ካህን እያገለገልሁ” ወይም “የክህነት አገልግሎት እያከናወንሁ።”
    reason: lexical_alternative
  - marker: c
    text: ምናልባት አሕዛብ ራሳቸው ለእግዚአብሔር እንደ መባ መቅረባቸውን ያመለክታል፤ እንደ አማራጭ ግን፣ “አሕዛብ ያቀረቡት መባ።”
    reason: alternative_reading
  - marker: d
    text: ወይም፣ “በመንፈስ ቅዱስ ውስጥ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: አገልጋይ
  rationale: ቃሉ ሕዝባዊ ወይም ሃይማኖታዊ አገልግሎትን ሊያመለክት ይችላል፤ እዚህ «አገልጋይ» የአገልግሎትን ሐሳብ በግልጽ ያስተላልፋል፣ ቀጥሎ ያለው የክህነት ቃልም ቅዱስ አገልግሎቱን ያብራራል።
- source_word: Χριστοῦ Ἰησοῦ
  choice: የመሲሑ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ የማዕረግ ስም ሆኖ «መሲሕ» የሚለውን ትርጉም ይይዛል፤ የአማርኛው አገባብ ደግሞ ከ«አገልጋይ» ጋር ያለውን የባለቤትነት ግንኙነት ያሳያል።
- source_word: εἰς τὰ ἔθνη
  choice: ለአሕዛብ
  rationale: በሮሜ መልእክት የአይሁድ ያልሆኑትን ሕዝቦች የሚያመለክተው ዐውደ ንባብ «አሕዛብ»ን ይደግፋል፤ «ለአገራት/ለሕዝቦች» የሚለው ይበልጥ ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἱερουργοῦντα
  choice: በክህነት እያገለገልሁ
  rationale: ግሱ አጠቃላይ አገልግሎትን ብቻ ሳይሆን በተለይ የካህንነት ተግባርን ያመለክታል፤ ይህ አገላለጽ የመባውን ምሳሌያዊ ምስል ሳያጠፋ በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: የእግዚአብሔርን ወንጌል
  rationale: «ወንጌል» የምሥራችን የሚያመለክት በአማርኛ የተለመደ የመጽሐፍ ቅዱስ ቃል ሲሆን የግሪኩን የባለቤትነት መዋቅርም ይጠብቃል።
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: የአሕዛብ መባ
  rationale: የግሪኩን የባለቤትነት አገባብና ያለውን አሻሚነት ይጠብቃል። ዐውደ ንባቡ አሕዛብ ራሳቸው ለእግዚአብሔር የሚቀርቡ መባ መሆናቸውን ይበልጥ ይደግፋል፤ ነገር ግን አሕዛብ ያቀረቡት መባ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: εὐπρόσδεκτος
  choice: ተቀባይነት እንዲያገኝ
  rationale: በመባ ዐውድ «ተቀባይነት ማግኘት» በእግዚአብሔር ፊት ተቀባይ መሆንን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡγιασμένη
  choice: የተቀደሰ ሆኖ
  rationale: የግሪኩ ፍጹም ተገብሮ አንቀጽ ከቀደመ የመቀደስ ድርጊት የተገኘን ቀጣይ ሁኔታ ያሳያል፤ «የተቀደሰ ሆኖ» ይህን በግልጽ ይጠብቃል።
- source_word: ἐν πνεύματι ἁγίῳ
  choice: በመንፈስ ቅዱስ
  rationale: ἐν እዚህ የመቀደሱን ፈጻሚ ወይም መንገድ ሊያመለክት ይችላል፤ «በመንፈስ ቅዱስ» ይህን በአጭርና ተፈጥሯዊ ሁኔታ ያቀርባል። «በመንፈስ ቅዱስ ውስጥ» የሚለው የስፍራ/የሕልውና አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ጳውሎስ አገልግሎቱን በክህነት ቃላት መግለጹ
  choice: የጳውሎስ የአሕዛብ ወንጌል አገልግሎት በካህናዊ ምሳሌ ቀርቧል፤ ጽሑፉ ግን ሌላ የማስተሰረያ መሥዋዕትን ወይም ከጊዜ በኋላ የተመሠረተን የቤተ ክርስቲያን ሹመት አያስረግጥም።
  alternative: ቃሉን እንደ መደበኛ የካህንነት ሹመት መረዳት፣ ወይም በተቃራኒው ካህናዊውን ምስል ሙሉ በሙሉ አጥፍቶ እንደ አጠቃላይ አገልግሎት ብቻ መተርጎም።
  rationale: λειτουργός፣ ἱερουργέω እና προσφορά በአንድነት የክህነትና የመባ ምስል ይፈጥራሉ። ስለዚህ ምስሉ መጠበቅ አለበት፤ የተገለጸው ግን የወንጌል አገልግሎትና አሕዛብ እንደ ተቀባይነት ያለው መባ መቅረባቸው ነው።
- issue: «የአሕዛብ መባ» የሚለው የሚያመለክተው
  choice: የወንጌል አገልግሎቱ ፍሬ የሆኑት አሕዛብ ራሳቸው ለእግዚአብሔር እንደሚቀርቡ መባ መረዳት ይበልጥ የተመረጠ ነው።
  alternative: አሕዛብ ያቀረቡት መባ።
  rationale: በቅርብ ዐውደ ንባብ ያለው የክህነት ምሳሌና የጳውሎስ የአሕዛብ ተልእኮ አሕዛብ ራሳቸው መባው መሆናቸውን ይደግፋሉ። ሆኖም የግሪኩ የባለቤትነት አገባብ ሁለተኛውንም ንባብ ስለሚፈቅድ ዋናው ጽሑፍ አሻሚነቱን ጠብቆ ማስታወሻው ሁለቱን ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ወንጌል፣ መሲሕ፣ ክህነት፣ መባ፣ መንፈስ ቅዱስ» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሆነው የግሪኩን ካህናዊ ምስልና ሥነ መለኮታዊ ክብደት ይጠብቃሉ።
