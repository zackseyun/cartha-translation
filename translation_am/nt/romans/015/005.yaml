  rationale: ግሪኩ መሲሑ ኢየሱስን እንደ መስፈርት ወይም አርአያ ያቀርባል፤ ትርጉሙ ይህን ግንኙነት ይጠብቃል እንጂ ‘ፈቃድ’ የሚል በግሪኩ የሌለ ቃል አይጨምርም።
