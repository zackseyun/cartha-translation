    text: ወይም፣ “የመመካት ምክንያት አለኝ” ወይም “ለመመካት መሠረት አለኝ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው፣ “በክርስቶስ ኢየሱስ።” Χριστός እዚህ ማዕረግ ስለሆነ፣ “በመሲሑ ኢየሱስ” ተብሎ ተተርጉሟል።
