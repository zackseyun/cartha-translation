  alternative: አጠቃላይ የግል ኩራት ወይም የውስጥ ደስታ ብቻ አድርጎ መተርጎም
  rationale: ‘በመሲሑ ኢየሱስ’ እና ‘ከእግዚአብሔር ጋር በተያያዙ ጉዳዮች’ የሚሉት ሐረጎች መመካቱን ይገድባሉ፤ ዋናው ጽሑፍ ይህን ግንኙነት ያስቀምጣል እንጂ ተጨማሪ ሥነ መለኮታዊ ማብራሪያ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪክኛውን ሐሳብ ቅደም ተከተል በተፈጥሯዊ የአማርኛ አገባብ አደራጅቶ፣ የመመካቱን መሠረትና ወሰን ሳያጠብ ያቀርባል።
