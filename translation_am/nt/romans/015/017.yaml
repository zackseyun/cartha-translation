  source_fidelity: The draft conveys the inferential οὖν, Paul's possession of καύχησις/grounds for boasting, the sphere marked by ἐν Χριστῷ Ἰησοῦ, and the broad sense of τὰ πρὸς τὸν θεόν. A small syntactic revision makes the relation of the two prepositional phrases clearer in idiomatic Amharic.
