  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ ከግል ስም ይልቅ ‘የተቀባው’ የሚለውን ማዕረግ ይዞ ስለሚገኝ፣ ትርጉሙን የሚያሳየው ‘መሲሕ’ ተመርጧል።
