  terminology: “መሲሕ” appropriately renders Χριστός as an active title, and “እግዚአብሔር” is standard. “እግዚአብሔርን በሚመለከቱ ጉዳዮች” preserves the deliberately broad wording of τὰ πρὸς τὸν θεόν without narrowing it to ministry or cultic service.
