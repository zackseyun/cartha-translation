source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: am
  text: እኛ ጠንካሮች የሆንነው የደካሞችን ድክመቶች[a] ልንሸከም ይገባናል፤ ራሳችንንም ደስ ማሰኘት የለብንም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጉድለቶች።” የግሪክ ቃሉ ድክመቶችን፣ ውሱንነቶችን ወይም ጉድለቶችን ሊያመለክት ይችላል፤ እዚህ ግን በቀደመው ምዕራፍ የተነሱትን የሕሊና ጥንቃቄዎች ወይም ገደቦች የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: ልንሸከም ይገባናል
  rationale: የግሥ አመልካች ቅርጹን ጠብቆ የሞራል ግዴታን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: ቃሉ እዚህ ለስላሳ የንግግር ሽግግር ያመለክታል፤ በአማርኛ ቁጥሩን በማይፈለግ የጊዜ ወይም የንጽጽር ቃል እንዳያስጀምር በአወቃቀሩ ብቻ ተንጸባርቋል።
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: እኛ ጠንካሮች
  rationale: አጽንዖት ያለውን ተውላጠ ስምና በስምነት የቆመውን ቅጽል ያቆያል፤ በአውዱም የሕሊና ጥንካሬን ያመለክታል።
- source_word: τὰ ἀσθενήματα
  choice: ድክመት
  rationale: አካላዊ ሕመምን ወይም ሞራላዊ ኃጢአትን ብቻ ሳያመለክት፣ የሕሊና ገደቦችንና ተጠራጣሪነትን ሊያካትት የሚችል ሰፊ ቃል ነው።
- source_word: τῶν ἀδυνάτων
  choice: የደካሞችን
  rationale: በሮሜ 14–15 የተመሠረተውን በጠንካሮችና በደካሞች መካከል ያለውን ንጽጽር ይጠብቃል።
- source_word: βαστάζειν
  choice: ልንሸከም
  rationale: የሌላውን ሸክም የመሸከምን ዘይቤ ያቆያል፤ ትእዛዙንም በመታገሥ ብቻ አይገድበውም።
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: ራሳችንንም ደስ ለማሰኘት መፈለግ የለብንም
  rationale: ቃል በቃል ሊከሰት የሚችለውን አሻሚነት በመቀነስ፣ የራስን ፍላጎት ማስቀደም የለብንም የሚለውን ሥነ ምግባራዊ ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: “ደካሞች” እና “ጠንካሮች” የሚሉት ቃላት ትርጉም
  choice: በዋናነት የእምነት ሕሊናቸው ወይም የነጻነት ግንዛቤያቸው የተለያየ አማኞችን ያመለክታሉ
  alternative: በማኅበራዊ ኃይል ወይም በአካላዊ ብርታት የተለያዩ ሰዎች
  rationale: የሮሜ 14 ቅርብ አውድ ስለ ምግብና ስለ ቀናት የሚነሱ የሕሊና ልዩነቶችን ይወያያል፤ ትርጉሙ ግን ይህን በማብራሪያ ወደ ዋናው ጽሑፍ ሳያስገባ የጠንካራ/ደካማ ንጽጽሩን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ልንሸከም ይገባናል” የግዴታውን ኃይልና የመሸከምን ዘይቤ አንድ ላይ ያቆያል።
