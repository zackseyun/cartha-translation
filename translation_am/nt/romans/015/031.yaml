source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: am
  text: በይሁዳ ካሉት የማይታዘዙ ሰዎች[a] እንድዳን፣ ለኢየሩሳሌምም የማቀርበው አገልግሎት በቅዱሳን ዘንድ ተቀባይነት እንዲያገኝ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በይሁዳ ካሉት የማያምኑ ሰዎች።” የግሪኩ ቃል ለማመን እምቢ ማለትን፣ በዚህም ምክንያት አለመታዘዝን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: እንድድን፣ ... እንዲያገኝ
  rationale: አንዱ ἵνα የሚመራቸውን ሁለት የጸሎት ዓላማዎች በተፈጥሯዊ የአማርኛ አገባብ ያስተሳስራል።
- source_word: ῥυσθῶ
  choice: እንድድን
  rationale: ከአደጋ ወይም ከጎጂ ሰዎች መታደግን የሚገልጸውን ተገብሮ ንዑስ አንቀጽ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: ካሉት የማይታዘዙ ሰዎች
  rationale: ቃሉ አለማመንንም ሆነ አለመታዘዝን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ የአለመታዘዝን ገጽታ ሲጠብቅ ሌላው አማራጭ በማስታወሻ ተቀምጧል።
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: በይሁዳ
  rationale: የቦታውን ስምና ἐν የሚያሳየውን የመገኛ ትርጉም በመደበኛ አማርኛ ይገልጻል።
- source_word: διακονία
  choice: አገልግሎት
  rationale: የገንዘብ ስጦታውን የማድረስ ተግባር የሚያካትተውን ሰፊ የአገልግሎት ትርጉም ይጠብቃል።
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: ለኢየሩሳሌም ... የማቀርበው
  rationale: አገልግሎቱ ወደ ኢየሩሳሌም የተመራ መሆኑን ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: εὐπρόσδεκτος
  choice: ተቀባይነት እንዲያገኝ
  rationale: በመልካም ሁኔታ መቀበልንና ተቀባይ መሆንን ግልጽ በሆነ ዘመናዊ አገላለጽ ያስተላልፋል።
- source_word: τοῖς ἁγίοις
  choice: በቅዱሳን ዘንድ
  rationale: የጳውሎስን የተለመደ የአማኞች መጠሪያ ይጠብቃል፤ የተቀባይነቱንም ፈራጆች በትክክል ያመለክታል።
- source_word: γένηται
  choice: እንዲያገኝ
  rationale: ‘ወደ መሆን መምጣት’ የሚለውን እንቅስቃሴያዊ ገጽታ በ‘ተቀባይነት ማግኘት’ በሚለው ተፈጥሯዊ አገላለጽ ያስቀምጣል።
theological_decisions:
- issue: በይሁዳ ያሉትን የጳውሎስ ተቃዋሚዎች በሚመለከት የἀπειθούντων ትርጉም
  choice: የማይታዘዙ ሰዎች
  alternative: የማያምኑ ሰዎች
  rationale: የግሪኩ ቃል ለማመን እምቢ ማለትንና ከዚያ የሚመጣውን አለመታዘዝ ሁለቱንም ሊይዝ ይችላል። ዋናው ጽሑፍ ሰፊውን የአለመታዘዝ ገጽታ ይዟል፤ የአለማመን አማራጭም አሻሚነቱን ለመጠበቅ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ቅዱሳን’ የሚለው የጳውሎስ ቃል ተጠብቋል፤ ‘አገልግሎት’ ደግሞ ጽሑፉ በቀጥታ ካለው በላይ ‘እርዳታ’ ብሎ እንዳይገድብ ተመርጧል።
