review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the quotation's introduction, Jesse, the root image, the nations/Gentiles, and their hope in him. However, it adds “ይመጣል” (“will come”) after “የሚነሣው,” although the Greek has no verb meaning “come”; the single Ἔσται governs both coordinated nominative expressions.
  naturalness: The register is clear and suitably dignified. Retaining the future copula for the second coordinated expression makes the Amharic complete and avoids the unsupported added action.
  terminology: “የእሴይ ሥር,” “አሕዛብ,” “ለመግዛት,” and “በእርሱ ተስፋ ያደርጋሉ” are appropriate modern-standard, Scripture-register choices. “የሚነሣው” preserves the source wording without specifying resurrection.
  issues:
  - severity: medium
    issue: 'Unsupported addition: “ይመጣል.”'
    rationale: The source reads “there will be the root of Jesse, and the one rising to rule nations”; it does not say that the rising one will come. The addition narrows and changes the stated predicate.
  revised_text: ደግሞም ኢሳይያስ እንዲህ ይላል፦ “የእሴይ ሥር ይሆናል፤ አሕዛብንም ለመግዛት የሚነሣው ይሆናል፤ አሕዛብ በእርሱ ተስፋ ያደርጋሉ።”
  revised_footnotes: []
  revision_rationale: “ይመጣል” has been replaced with “ይሆናል,” corresponding to the source's Ἔσται. Repeating the copula in Amharic supplies the predicate that Greek shares across the coordinated phrases, without introducing a new event or resolving the coordination as an explanatory apposition.
