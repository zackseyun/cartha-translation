  to: ደግሞም ኢሳይያስ እንዲህ ይላል፦ “የእሴይ ሥር ይሆናል፤ አሕዛብንም ለመግዛት የሚነሣው ይሆናል፤ አሕዛብ በእርሱ ተስፋ ያደርጋሉ።”
