id: ROM.15.12
reference: Romans 15:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: am
  text: ደግሞም ኢሳይያስ እንዲህ ይላል፦ “የእሴይ ሥር ይሆናል፤ አሕዛብንም ለመግዛት የሚነሣው ይሆናል፤ አሕዛብ በእርሱ ተስፋ ያደርጋሉ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: የእሴይ ሥር
  rationale: የግሪኩን የዘርና የመሲሐዊ ምስል በቀጥታ የሚጠብቅ አገላለጽ ነው።
- source_word: Ἔσται
  choice: ይሆናል
  rationale: የወደፊት ጊዜውንና ‘ይሆናል/ይኖራል’ የሚለውን ሰፊ ትርጉም ይጠብቃል፤ ‘ይመጣል’ ብሎ አያጠብበውም።
- source_word: ὁ ἀνιστάμενος
  choice: የሚነሣው
  rationale: የግሪኩን ክፍለ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ቃሉ ሊኖረው የሚችለውን ‘መነሣት/ብቅ ማለት’ ምስል አያጠፋም።
- source_word: ἄρχειν ἐθνῶν
  choice: አሕዛብን ለመግዛት
  rationale: ἄρχω እዚህ የመምራትና የመግዛት ሥልጣንን ያመለክታል፤ የዓላማ ኢንፊኒቲቩንም ‘ለመግዛት’ በማለት ያሳያል።
- source_word: ἔθνη
  choice: አሕዛብ
  rationale: በዚህ የአይሁድና የአሕዛብ አውድ የሚታወቀውን ባህላዊና ትክክለኛ የአማርኛ ቃል ይጠቀማል።
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: በእርሱ ተስፋ ያደርጋሉ
  rationale: የተስፋውን መደገፊያ በግልጽ ያሳያል፤ በአማርኛም የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
theological_decisions:
- issue: ‘የእሴይ ሥር’ እና ‘የሚነሣው’ አንድ ወይም ሁለት ማጣቀሻዎች መሆናቸው
  choice: ሁለቱን በ‘ም’ ተያያዥነት አቀረበ፣ ነገር ግን አንድ ግለሰብ ናቸው ብሎ በግልጽ አልጨመረም
  alternative: ‘የእሴይ ሥር፣ ማለትም አሕዛብን ለመግዛት የሚነሣው’ ብሎ በማብራሪያ ማያያዝ
  rationale: ግሪኩ καί የሚለውን ቅንጅት ይጠብቃል፤ ጽሑፉ በቀጥታ ያልገለጸውን የሰዋሰው ግንኙነት አይጫንም።
- issue: ἀνιστάμενος የትንሣኤ ልዩ ማጣቀሻ መሆኑ
  choice: ‘የሚነሣው’ ተባለ
  alternative: ‘ከሙታን የሚነሣው’ ወይም ‘ብቅ የሚለው’
  rationale: ዋናው ጽሑፍ ‘ከሙታን’ አይልም፤ ስለዚህ የትንሣኤ ትርጉምን በግድ ሳይጨምር የቃሉን ሆን ብሎ ያልተገደበ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በሕዝብ ንባብ ለመረዳት ቀላል የአማርኛ አገላለጽ ተመርጧል። ‘ደግሞም’ እና ‘እንዲህ ይላል’ የጥቅሱን መግቢያ ተፈጥሯዊ ያደርጉታል።
