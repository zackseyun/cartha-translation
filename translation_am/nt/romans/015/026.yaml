  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: am
  text: ማክዶንያና አካይያ በኢየሩሳሌም ካሉት ቅዱሳን መካከል ላሉ ድሆች መዋጮ[a] ለማድረግ በደስታ ወደዋልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመካፈል ስጦታ ለማድረግ።” የግሪኩ አገላለጽ በቁሳዊ ድጋፍ የሚገለጠውን ኅብረትና መካፈል ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: በደስታ ፈቅደዋል
  rationale: የግሱን በጎ ፈቃድና ደስተኛ ዝንባሌ በአንድነት ያሳያል፤ ብቻውን ‘ወሰኑ’ ከማለት ይልቅ የግሪኩን አዎንታዊ ፈቃድ ይጠብቃል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: ማክዶንያና አካይያ
  rationale: ግሪኩ ክልሎቹን ለክርስቲያን ማኅበረሰቦቻቸው በውክልና ይጠቀማል፤ ‘አማኞች’ ወይም ‘ቤተ ክርስቲያናት’ የሚል ያልተጻፈ ቃል ሳይጨመር የቦታዎቹ ስም ተጠብቋል።
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: አንድ መባ ለማድረግ
  rationale: በዚህ የርዳታ አውድ κοινωνία በቁሳዊ ድጋፍ የተገለጠ መካፈልን ያመለክታል፤ ‘መባ’ የተግባራዊውን ስጦታ ያሳያል፣ ‘አንድ’ ደግሞ τινά ያለውን ያልተወሰነ ትርጉም ይጠብቃል።
- source_word: εἰς τοὺς πτωχοὺς
  choice: ለድሆች
  rationale: εἰς የተቀባዮችን ጥቅምና የስጦታውን ዓላማ ያሳያል፤ ‘ለድሆች’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: τῶν ἁγίων
  choice: ከቅዱሳን መካከል
  rationale: ድሆቹ የቅዱሳኑ ቡድን ክፍል መሆናቸውን ግልጽ ያደርጋል፤ የጳውሎስን መደበኛ የአማኞች መጠሪያ ‘ቅዱሳን’ ይጠብቃል።
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: በኢየሩሳሌም ካሉት
  rationale: የቦታ ሐረጉ ቅዱሳኑን እንደሚገልጽ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በጳውሎስ አጠቃቀም ἅγιοι የሚለውን መተርጎም
  choice: ቅዱሳን
  alternative: ቅዱሳን ሕዝብ / የእግዚአብሔር ሕዝብ
  rationale: ‘ቅዱሳን’ የጳውሎስን የአማኞች መደበኛ መጠሪያ በቁልፍ ቃል ደረጃ ይጠብቃል፤ በኋላ ዘመን ልዩ ዕውቅና ያገኙ ግለሰቦችን ብቻ እንደሚያመለክት ሳይወሰን እዚህ ሁሉንም አማኞች ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የስፍራ ስሞቹ በግሪኩ ያለውን ውክልናዊ አጠቃቀም እንዲጠብቁ በቀጥታ ቀርበዋል።
