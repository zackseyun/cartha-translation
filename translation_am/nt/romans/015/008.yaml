  rationale: የግሪኩ የባለቤትነት አገላለጽ ተስፋዎቹ ለአባቶች እንደተሰጡ በተፈጥሯዊ አማርኛ ተገልጿል፤ «አባቶች» የእስራኤልን ቀደምት አባቶች የሚያመለክተውን የድነት ታሪካዊ ትኩረት ይጠብቃል።
