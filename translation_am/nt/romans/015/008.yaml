- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: ስለ እግዚአብሔር እውነት
  rationale: ὑπέρ እዚህ ምክንያትን ወይም ዓላማን ያሳያል። ἀλήθεια θεοῦ የእግዚአብሔርን እውነት ወይም እውነተኝነት ሊያመለክት ስለሚችል ዋናው ጽሑፍ ሰፊውን አገላለጽ ይዞ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: εἰς τὸ βεβαιῶσαι
  choice: ለማጽናት
