  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: am
  text: በአንድ ልብና በአንድ አፍም[a] የጌታችን ኢየሱስ መሲሕ አምላክንና አባትን እንድታከብሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ተፈጥሯዊ በሆነ አገላለጽ፣ “በአንድ ድምፅ።” ግሪኩ “በአንድ አፍ” ይላል፤ ይህም የተባበረ ውዳሴን አጉልቶ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: እንድታከብሩ ነው
  rationale: የቀደመውን ምክር ዓላማና ውጤት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ὁμοθυμαδόν
  choice: አንድ ልብ ሆናችሁ
  rationale: በአሳብና በዓላማ የተባበረ ማኅበራዊ አንድነትን በተለመደና ክቡር አማርኛ ይገልጣል።
- source_word: ἐν ἑνὶ στόματι
  choice: በአንድ አፍም
  rationale: የግሪኩን ግልጽ የአካል ምስል ጠብቆ የተባበረ ውዳሴን ያሳያል።
- source_word: δοξάζητε
  choice: እንድታከብሩ
  rationale: በውዳሴ አውድ ውስጥ ‘ክብር መስጠት’ን በተፈጥሯዊና ክቡር መንገድ ያስተላልፋል።
- source_word: τὸν θεὸν καὶ πατέρα
  choice: አምላክና አባት
  rationale: ሁለቱን መጠሪያዎች ለአንድ አካል የሚያያይዘውን የግሪክ አገባብ ሳይተረጉምበት ይጠብቃል።
- source_word: τοῦ κυρίου ἡμῶν
  choice: የጌታችንን
  rationale: κύριοςን ‘ጌታ’፣ ἡμῶνንም ‘ችን’ በማለት ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ መሲሕን
  rationale: Ἰησοῦን እንደ ስም በተለመደው ቅርጽ ያቀርባል፤ Χριστόςንም እንደ ማዕረግ ‘መሲሕ’ ብሎ ትርጉሙን ይጠብቃል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός በዚህ ስፍራ የመሲሓዊ ማዕረግን ይይዛል፤ ‘መሲሕ’ የሚለው ትርጉም ይህን ይገልጣል፣ የተለመደውን ‘ክርስቶስ’ ግን በማስታወሻ ያቀርባል።
- issue: τὸν θεὸν καὶ πατέρα አንድነት
  choice: አምላክና አባት
  alternative: አምላክን፣ ማለትም አባትን
  rationale: በግሪኩ አንድ መስተዋድድ ሁለቱን ስሞች ይመራል፤ ትርጉሙ የቅርብ ግንኙነታቸውን ይጠብቃል እንጂ ወደ ገላጭ ድጋሜ አይቀይረውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አንድ ልብ” ተፈጥሯዊ የአንድነት አገላለጽ ሲሆን፣ “በአንድ አፍ” ደግሞ የምንጩን ምስላዊ አነጋገር ጠብቋል።
