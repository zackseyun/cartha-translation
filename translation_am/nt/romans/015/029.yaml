  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: am
  text: 'ወደ እናንተ ስመጣም፣ በየመሲሑ በረከት ሙላት እንደምመጣ አውቃለሁ።


    [a] ወይም፣ “የክርስቶስ በረከት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የክርስቶስ በረከት።”
    reason: “Χριστός” የሚለውን ማዕረግ በትርጉሙ “መሲሕ” ከማቅረብ ይልቅ በተለመደው የግሪክ ቅርጽ “ክርስቶስ” ለማቅረብ ያለውን አማራጭ ያሳያል።
lexical_decisions:
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: የጳውሎስን እርግጠኛ እውቀት በቀጥታ ይገልጻል፤ ወደ ግምት ወይም ወደ ተስፋ አያለዝበውም።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ንግግሩን ወደፊት የሚያስኬድ ለስላሳ አያያዥ ነው፤ በአማርኛ ከግሱ ጋር የተያያዘው “-ም” ተፈጥሯዊ ነው።
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: ወደ እናንተ ስመጣ
  rationale: አድራጊ አንቀጹ ከዋናው የወደፊት ጊዜ ግስ ጋር ያለውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν πληρώματι
  choice: በ…ሙላት
  rationale: የብዛትንና የተሟላነትን ምስላዊ አገላለጽ ጠብቆ፣ ἐν የሚያመለክተውን ሁኔታ ወይም አብሮነት ያስተላልፋል።
- source_word: εὐλογίας
  choice: በረከት
  rationale: εὐλογία እዚህ ለጋስ የሆነን መለኮታዊ በጎ ስጦታ ወይም ሞገስ የሚገልጽ ሲሆን፣ “በረከት” በአማርኛ የተለመደና ክብር ያለው አቻ ነው።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ “መሲሕ” የቃሉን ‘የተቀባው’ የሚለውን ማዕረጋዊ ትርጉም ያቆያል፤ የተወሰነው ቅርጽ “መሲሑ” በዐውዱ ተፈጥሯዊ ነው።
- source_word: ἐλεύσομαι
  choice: እንደምመጣ
  rationale: የግሪኩን የወደፊት መምጣት በ“አውቃለሁ” ሥር ባለ ተያያዥ አንቀጽ በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ እንደ ማዕረግ ስለሚሠራ “መሲሑ” ትርጉሙን በግልጽ ያቀርባል። “ክርስቶስ” የተለመደውን የግሪክ ቃል ቅርጽ የሚያቆይ አማራጭ ሆኖ በማስታወሻ ቀርቧል።
- issue: የΧριστοῦ የሰዋስው ግንኙነት
  choice: የመሲሑ በረከት የሚል የባለቤትነት/ምንጭ ግንኙነት
  alternative: በመሲሑ የሚገለጽ በረከት
  rationale: የግሪኩ የዝምድና ቅርጽ በረከቱ ከመሲሑ ጋር ያለውን ግንኙነት ያሳያል፤ ትርጉሙ ምንጭን፣ ባለቤትነትን ወይም ባሕርይን በጠባብ ሁኔታ እንዳይወስን “በመሲሑ በረከት” የሚለው አገላለጽ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በ…ሙላት” የሚለው ቅርጽ በግሪኩ ያለውን የተሟላ ብዛት ምስል ለመጠበቅ ተመርጧል።
