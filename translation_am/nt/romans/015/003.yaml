- from: መሲሑ እንኳ ራሱን ደስ አላሰኘምና፤[a] ነገር ግን፣ “አንተን የሚሰድቡ ሰዎች ስድብ በእኔ ላይ ወደቀ” ተብሎ እንደተጻፈው ሆነ።
  to: መሲሑ[a] እንኳ ራሱን ደስ አላሰኘምና፤ ይልቁንም፣ እንደ ተጻፈው፦ “የሚሰድቡህ ሰዎች ስድቦች በእኔ ላይ ወደቁ።”
  rationale: The revision removes the unsupported “it happened,” retains the contrast and conventional citation formula, corrects the plural agreement within the quotation, and relocates the alternative-rendering footnote anchor to መሲሑ. It does not identify the quotation’s “me” beyond the wording of the cited text.
