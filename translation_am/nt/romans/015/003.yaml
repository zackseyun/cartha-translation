id: ROM.15.3
reference: Romans 15:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: am
  text: መሲሑ[a] እንኳ ራሱን ደስ አላሰኘምና፤ ይልቁንም፣ እንደ ተጻፈው፦ “የሚሰድቡህ ሰዎች ስድቦች በእኔ ላይ ወደቁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: እንኳ … አላሰኘምና
  rationale: የምክንያት ግንኙነቱን በአማርኛው -ና እና አጽንዖቱን በ‘እንኳ’ ያሳያል።
- source_word: ὁ Χριστός
  choice: መሲሑ
  rationale: እዚህ Χριστός እንደ ማዕረግ ስለሚሠራ፣ ገላጭ አንቀጹንም በ‘-ሑ’ በመያዝ ‘መሲሑ’ ተብሏል።
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: ራሱን ደስ አላሰኘም
  rationale: የ‘ማስደሰት’ን ግስ እና የተመላሽ ተውላጠ ስምን በቅርብ ይጠብቃል።
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: ነገር ግን፣ … ተብሎ እንደተጻፈው ሆነ
  rationale: የንጽጽር ለውጡንና የቅዱሳት መጻሕፍት ጥቅስ መግቢያውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὀνειδισμοί / τῶν ὀνειδιζόντων σε
  choice: ስድብ / አንተን የሚሰድቡ
  rationale: የግስና የስም የአንድ ሥር ድግግሞሽን ጠብቆ የቃላዊ ውርደትን ሐሳብ በዘመናዊና ክብር ባለው ቋንቋ ያሳያል።
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: በእኔ ላይ ወደቀ
  rationale: የግሪኩን ምሳሌያዊ አገላለጽና ያለፈ ጊዜውን በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ ቃሉ የግል ስም ከመሆን ይልቅ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ነው። ሌላው የተለመደ አተረጓጎም በማስታወሻ ቀርቧል።
- issue: በጥቅሱ ውስጥ ያለው ተናጋሪ
  choice: ‘እኔ’ የሚለው በጥቅሱ እንዳለ ተጠብቋል
  alternative: ‘እኔ’ን በትርጉሙ ውስጥ መሲሑ እንደሆነ በግልጽ መለየት
  rationale: ጳውሎስ ጥቅሱን ለመሲሑ ቢያውለውም፣ ዋናው ጽሑፍ የተናጋሪውን ማንነት ከጥቅሱ በላይ እንዳንገልጽ ይጠይቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝሙሩ ጥቅስ ያለው መዋቅራዊ ድግግሞሽ ‘ስድብ/የሚሰድቡ’ ተጠብቋል።
