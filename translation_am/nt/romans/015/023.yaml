  text: አሁን ግን በእነዚህ አካባቢዎች ከእንግዲህ ወዲህ ስፍራ[a] ስለሌለኝ፣ ወደ እናንተ ለመምጣትም ከብዙ ዓመታት ጀምሮ ከፍተኛ ፍላጎት ስለነበረኝ፣
  philosophy: optimal-equivalence
  footnotes:
