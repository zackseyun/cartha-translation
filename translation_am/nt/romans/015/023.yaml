- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: ወደ እናንተ ለመምጣት
  rationale: የግሪኩን ቀጥተኛ የመምጣት አገላለጽ ይጠብቃል፤ ‘ለመጎብኘት’ የሚለውን ተጨማሪ ትርጉም አያስገባም።
