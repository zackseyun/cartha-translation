    text: ወይም፣ “ቦታ” ወይም “መስክ።” የግሪኩ አገላለጽ በእነዚህ አካባቢዎች ለአገልግሎት የቀረ ሰፊ የሥራ መስክ እንደሌለ ሊያመለክት ይችላል፤ አካላዊ ቦታ እንደሌለ ብቻ ማለት አይደለም።
