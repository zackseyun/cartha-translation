  terminology: '"ሥራዎች," "የሚጠራው," and "ያገለግላል" are suitable. "ታላቁ/ታናሹ" appropriately preserves the comparative breadth of μείζων/ἐλάσσων; no explicit sibling terms should be placed in the main text. The footnote may identify the Jacob–Esau context without making it part of the translation.'
