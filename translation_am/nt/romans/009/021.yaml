  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: am
  text: 'ወይስ ሸክላ ሠሪው በጭቃው ላይ ሥልጣን[a] የለውምን፤ ከዚያው የጭቃ ክምር[b] አንዱን ዕቃ ለክብር፣ ሌላውንም ለውርደት[c] እንዲሠራ?[d]


    [a] ወይም፣ “በጭቃው ላይ መብት።”


    [b] ወይም፣ “ከዚያው የጭቃ ስብስብ” ወይም “ከዚያው የተቀላቀለ ጭቃ።”


    [c] ወይም፣ “አንዱን ዕቃ ለክብር አገልግሎት፣ ሌላውንም ለተራ አገልግሎት።”


    [d] ይህ ምሳሌ በኢሳይያስ 29፥16፤ 45፥9 እና በኤርምያስ 18፥1–6 የሚገኙትን የሸክላ ሠሪና የጭቃ ምሳሌዎች ያስታውሳል።'
  philosophy: optimal-equivalence
  footnotes:
