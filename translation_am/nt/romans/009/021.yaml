  rationale: ἐξουσία ተራ ችሎታን ሳይሆን ሕጋዊና ተገቢ ሥልጣንን ያመለክታል፤ የአሉታ ጥያቄውም በአማርኛ ተጠብቋል።
- source_word: ὁ κεραμεὺς
  choice: ሸክላ ሠሪው
  rationale: ከጭቃ ዕቃ የሚሠራውን ባለሙያ በግልጽ ይጠቅሳል፣ የትንቢታዊውንም ምሳሌ ይጠብቃል።
- source_word: τοῦ πηλοῦ
  choice: በጭቃው ላይ
  rationale: ከ‘ሥልጣን’ ጋር በተፈጥሯዊ አማርኛ የቁጥጥርና የባለመብትነት ግንኙነቱን ይገልጻል።
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: ከዚያው የጭቃ ብሉቃጥ
  rationale: φυράμα የተቀላቀለና አንድ ሆኖ የተሰበሰበ ቁስን ያመለክታል፤ ‘ብሉቃጥ’ የአንድነቱንና የጭቃ ክምሩን ምስል ያቆያል።
- source_word: ποιῆσαι
  choice: ለመሥራት
  rationale: የመፍጠርን ወይም የመቅረጽን ተግባር ያለ ተጨማሪ ትርጓሜ በቀጥታ ያቀርባል።
- source_word: ὃ μὲν ... ὃ δὲ
  choice: አንዱን ... ሌላውንም
  rationale: የሁለቱን ዕቃዎች ንጽጽር በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: εἰς τιμὴν
  choice: ለክብር
  rationale: የግሪኩን የክብር ምድብ በአጭሩ ይጠብቃል፣ የዕቃውን ተግባር ከጽሑፉ በላይ አይወስንም።
- source_word: σκεῦος
  choice: ዕቃ
  rationale: በሸክላ ሠሪው ምሳሌ ውስጥ የተሠራ መያዣን ወይም አገልግሎታዊ ነገርን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: εἰς ἀτιμίαν
  choice: ለውርደት
  rationale: ከ‘ክብር’ ጋር ያለውን የግሪክ ክብር–ውርደት ተቃርኖ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: ἐξουσία እንደ ‘ሥልጣን’ ወይም ‘መብት’ መተርጎሙ
  choice: ሥልጣን
  alternative: መብት፣ ኃይል
  rationale: ‘ሥልጣን’ የሸክላ ሠሪውን ተገቢ ሥልጣን ያሳያል፤ ነገር ግን ስለ መለኮታዊ ሉዓላዊነትና ስለ ሰው ኃላፊነት ያለውን ውጥረት በአንድ የእምነት ሥርዓት አይፈታውም።
- issue: εἰς τιμὴν / εἰς ἀτιμίανን እንደ ክብር–ውርደት ወይም እንደ ተግባራዊ አገልግሎት መግለጹ
  choice: ለክብር ... ለውርደት
  alternative: ለክብር አገልግሎት ... ለተራ አገልግሎት
  rationale: የግሪኩ ጽሑፍ የክብርና የውርደት ቃላትን በቀጥታ ይጠቀማል። ይህን መጠበቅ ምሳሌውን በቤት ውስጥ አገልግሎት ብቻ እንዳይገደብ ያደርጋል።
