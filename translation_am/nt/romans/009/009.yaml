  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: am
  text: የተስፋ ቃል ይህ ነውና፦ “በዚህ ጊዜ እመጣለሁ[a]፤ ሣራም ወንድ ልጅ ይኖራታል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እመለሳለሁ።” እዚህ ያለው የግሪክ ጽሑፍ “እመጣለሁ” ይላል፤ አንዳንድ ትርጉሞች ግን የዘፍጥረትን ዳራ ተከትለው “እመለሳለሁ” ብለው ይተረጉማሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: የተስፋው
  rationale: λόγοςን የሚወስን የባለቤትነት ቅርጽ ሲሆን፣ በዐውዱ ያለውን መለኮታዊ ተስፋ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λόγος
  choice: ቃል
  rationale: እዚህ የተጠቀሰውን ንግግር ራሱን ያመለክታል፤ “ቃል” አጭር፣ የተለመደና ከምንጩ ጋር የቀረበ ነው።
- source_word: γὰρ
  choice: ነውና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: በዚህ ጊዜ
  rationale: የተወሰነውን የፍጻሜ ጊዜ ያመለክታል፤ የግሪኩን አገላለጽ በግልጽና ቀጥተኛ መንገድ ያቀርባል።
- source_word: ἐλεύσομαι
  choice: እመጣለሁ
  rationale: ግሱ በቀጥታ “እመጣለሁ” ማለት ነው፤ የዘፍጥረት ዳራን ተከትሎ “እመለሳለሁ” ማለት ቢቻልም ይህ ምርጫ በሮሜ ያለውን የግሪክ ቃል ቅድሚያ ይሰጣል።
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: ሣራም ወንድ ልጅ ይኖራታል
  rationale: ቃል በቃል “ለሣራ ወንድ ልጅ ይሆናል” የሚለውን የግሪክ አገላለጽ ትርጉሙን ሳያጣ በተፈጥሯዊ አማርኛ የባለቤትነት አገላለጽ ያቀርባል።
- source_word: Σάρρᾳ
  choice: ሣራ
  rationale: የግል ስሙ በአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ልማድ መሠረት ቀርቧል።
- source_word: υἱός
  choice: ወንድ ልጅ
  rationale: ቃሉ በተለይ ወንድ ልጅን ያመለክታል፤ ይህም በአብርሃምና በሣራ የተስፋ ዐውድ ውስጥ ጠቃሚ ስለሆነ ጾታው በግልጽ ተጠብቋል።
theological_decisions:
- issue: የአብርሃም ተስፋ ጥቅስና መለኮታዊ አድራጊነት
  choice: ተስፋውን ምንም የትርጓሜ ጭማሪ ሳይደረግበት እንደ እግዚአብሔር ቀጥተኛ ንግግር ማቅረብ።
  alternative: ከአንዳንድ የብሉይ ኪዳን ትርጉም ልማዶች ጋር ለማስማማት “እመለሳለሁ” ማለት።
  rationale: የጳውሎስ ክርክር የይስሐቅን መወለድ በመለኮታዊው ተስፋ ላይ ይመሠርታል። “እመጣለሁ” የሚለው በሮሜ ያለውን ግሪክ ይከተላል፤ አማራጩ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ መግቢያ በ፦ ቀርቦ፣ የምክንያት ግንኙነቱ “ነውና” በሚለው ተጠብቋል።
