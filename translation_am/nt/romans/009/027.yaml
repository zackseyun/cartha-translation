- source_word: τῶν υἱῶν Ἰσραήλ
  choice: የእስራኤል ልጆች
  rationale: ቃል በቃል ያለውን ባሕላዊ የቃል ኪዳን መጠሪያ ይጠብቃል፤ በአማርኛም «ልጆች» ሁለቱንም ፆታዎች በተፈጥሮ ሊያካትት ይችላል።
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: እንደ ባሕር አሸዋ
