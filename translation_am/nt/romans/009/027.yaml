  rationale: «ይድናል» በሮሜ 9–11 ዐውድ ያለውን ሰፊ የድነት ክብደት ይጠብቃል፤ የኢሳይያስን ታሪካዊ የመዳን ዳራ ሳይክድ ወደ አንድ የቡድን ትምህርት አያጠበውም።
