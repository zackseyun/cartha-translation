  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: am
  text: ኢሳይያስም ስለ እስራኤል ይጮኻል፦ “የእስራኤል ልጆች[a] ቁጥር እንደ ባሕር አሸዋ ቢሆንም[b]፣ የተረፈው ብቻ ይድናል።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእስራኤል ልጆች» ወይም «እስራኤላውያን»። ግሪኩ «የእስራኤል ልጆች» ይላል፤ ይህም ሕዝቡን የሚያመለክት ባሕላዊ የቃል ኪዳን መጠሪያ ነው።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «የእስራኤል ልጆች ቁጥር እንደ ባሕር አሸዋ ቢሆን።» የግሪኩ ቅርጽ ሁኔታዊ ነው፤ በዚህ ዐውድ ግን የተቃርኖ ኃይል አለው።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ «ከጥፋት ይተርፋል» ወይም «ነፃ ይወጣል»። አነጋገሩ ስለሚተርፍ ቅሬት የተናገረውን የኢሳይያስ ትንቢት ያስተጋባል።
    reason: cross_reference
lexical_decisions:
