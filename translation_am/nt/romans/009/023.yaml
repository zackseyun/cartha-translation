id: ROM.9.23
reference: Romans 9:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: am
  text: እንዲሁም በምሕረት ዕቃዎች ላይ የክብሩን ብልጽግና እንዲያሳውቅ፤ እነዚህንም ለክብር አስቀድሞ አዘጋጃቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: የክብሩን ባለጠግነት
  rationale: የግሪኩን ‘የክብሩ ብልጽግና/ባለጠግነት’ አገባብ በተፈጥሯዊና ክቡር አማርኛ ይጠብቃል።
- source_word: ἐπὶ σκεύη ἐλέους
  choice: ለምሕረት ዕቃዎች
  rationale: ἐπί እዚህ የመገለጡን ተቀባዮች/ዒላማ ያመለክታል፤ ‘ለ’ በአማርኛ ግልጽ ነው፣ σκεύη የሚለውን የዕቃ ዘይቤም ይጠብቃል።
- source_word: ἃ προητοίμασεν εἰς δόξαν
  choice: እነዚህንም ለክብር አስቀድሞ አዘጋጃቸው
  rationale: የπρο- ቅድመነትን፣ የεἰς δόξανንም ዓላማ/መድረሻ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: የἵνα ሐረግ ከቁጥር 22 ጋር ያለው ሰዋሰዋዊ ግንኙነት
  choice: ‘ለማሳወቅ ፈለገ’ በማለት ከቀዳሚው θέλων ጋር አገናኝቷል
  alternative: ‘እንዲያሳውቅም’ ብቻ በማለት ግሱን ከቀዳሚው ቁጥር እንዲሞላ መተው
  rationale: ቁጥሩ ብቻውን ሲነበብ ተፈጥሯዊ እንዲሆን የቁጥር 22ን ‘ፈለገ’ በግልጽ ይደግማል፤ የዓላማውን ግንኙነት አይለውጥም።
- issue: ‘ለምሕረት ዕቃዎች’ የሚለው ዘይቤ
  choice: የዕቃውን ዘይቤ እንዳለ መጠበቅ
  alternative: ‘ምሕረቱን የተቀበሉ ሰዎች’ ብሎ መፍታት
  rationale: ጳውሎስ የተጠቀመበትን ዘይቤና ከቁጥር 21–22 ጋር ያለውን ንጽጽር ይጠብቃል፤ ትርጓሜውን አስቀድሞ አይወስንም።
- issue: የπροητοίμασεν ባለቤት
  choice: ከአውዱ የሚታወቀውን እግዚአብሔር በሦስተኛ ወንድ ነጠላ ግስ ማመልከት
  alternative: ‘እግዚአብሔር አስቀድሞ አዘጋጃቸው’ ብሎ ስሙን መጨመር
  rationale: የግሪኩ ጽሑፍ ስሙን በዚህ ቁጥር አይደግምም፤ አማርኛውም ያንን የአውድ ጥገኝነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ምሕረት’ እና ‘ዕቃ’ የተለመዱትን መጽሐፍ ቅዱሳዊ ቃላት ሲጠብቁ አረፍተ ነገሩ በዘመናዊ አገባብ ተቀርጿል።
