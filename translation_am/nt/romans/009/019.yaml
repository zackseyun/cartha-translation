revisions:
- from: እንግዲህ እንዲህ ትለኛለህ፦ “ታዲያ እርሱ አሁንም ለምን ይወቅሳል? ፈቃዱን[a] ማን ተቃውሞታል?”
  to: እንግዲህ እንዲህ ትለኛለህ፦ “ታዲያ እርሱ አሁንም ለምን ይወቅሳል? ፈቃዱን[a] ማን ተቃውሟል?”
  rationale: The revision corrects the final verb and explicitly retains ፈቃዱን as its object, yielding a grammatical, natural expression for the Greek question while preserving its rhetorical force and theological tension. The footnote is lightly refined to give more precise modern-Amharic alternatives for βούλημα without selecting a doctrinal interpretation.
