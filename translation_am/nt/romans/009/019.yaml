id: ROM.9.19
reference: Romans 9:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: am
  text: እንግዲህ እንዲህ ትለኛለህ፦ “ታዲያ እርሱ አሁንም ለምን ይወቅሳል? ፈቃዱን[a] ማን ተቃውሟል?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ዓላማውን” ወይም “ውሳኔውን።” የግሪኩ βούλημα ፈቃድን፣ ዓላማን ወይም የተወሰነ ውሳኔን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: ትለኛለህ
  rationale: የወደፊት ጊዜ አመልካች ግስ የጳውሎስን የሚጠበቅ ተቃውሞ በአማርኛ ተፈጥሯዊ በሆነ የንግግር ሁኔታ ያስተዋውቃል፤ μοιም በ“-ኛለህ” ውስጥ ተካትቷል።
- source_word: οὖν
  choice: እንግዲህ / ታዲያ
  rationale: ሁለቱንም የመደምደሚያ አያያዥ ቃላት በተፈጥሯዊ አማርኛ ይወክላል፤ የክርክሩን ቀጣይ ደረጃና የጥያቄውን አጽንዖት ይጠብቃል።
- source_word: Τί οὖν ἔτι μέμφεται
  choice: ታዲያ እርሱ አሁንም ለምን ይወቅሳል?
  rationale: τί ከወቀሳ ግስ ጋር “ለምን” የሚል ምክንያታዊ ጥያቄ ይፈጥራል፤ ἔτι በ“አሁንም” ተጠብቋል፣ μέμφεταιም በግልጽና ክቡር “ይወቅሳል” ተተርጉሟል።
- source_word: τῷ βουλήματι αὐτοῦ
  choice: ፈቃዱን
  rationale: βούλημα የተወሰነ ፈቃድ፣ ዓላማ ወይም አሳብ ሊያመለክት ይችላል። “ፈቃዱ” በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የቃሉ ስፋት በግርጌ ማስታወሻ ተጠብቋል።
- source_word: τίς ἀνθέστηκεν
  choice: ማን ተቃውሞታል?
  rationale: ፍጹም ጊዜውንና የመቋቋም/የመቃወም ሐሳቡን በተፈጥሯዊ አማርኛ ያቀርባል፤ የንግግሩ መልስ የማይጠብቅ ጥያቄነትም አልተዳከመም።
theological_decisions:
- issue: በመለኮታዊ ሉዓላዊነትና በሰው ተጠያቂነት ዐውድ βούλημαን መተርጎም
  choice: ፈቃዱ
  alternative: ዓላማው / ያሰበው
  rationale: “ፈቃዱ” የተወሰነውን መለኮታዊ አሳብ በቀጥታ ይገልጣል፤ የግሪኩን የትርጉም ስፋት በማስታወሻ በመግለጽ በእግዚአብሔር ሉዓላዊነትና በሰው ተጠያቂነት መካከል ያለውን የጥቅሱን ውጥረት አይፈታም፣ የአንድንም ወገናዊ ትምህርት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛው ተቃውሞ በጥቅስ ምልክት ተለይቷል፤ የግሪኩ ሁለት οὖν በ“እንግዲህ”ና “ታዲያ” ተወክለዋል።
