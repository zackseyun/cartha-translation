  text: ነገር ግን፣ የእግዚአብሔር ቃል ከሽፏል ማለት አይደለም። ከእስራኤል የሆኑ ሁሉ[a] እስራኤል[b] አይደሉምና።
  philosophy: optimal-equivalence
  footnotes:
