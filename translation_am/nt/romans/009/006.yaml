    reason: lexical_alternative
  - marker: b
    text: በሁለተኛው “እስራኤል” አጠቃቀም ከመጀመሪያው የተለየ ልዩነት ተጠቁሟል። ጥቅሱ የዚህን ልዩነት ትክክለኛ ወሰን አይገልጽም።
    reason: cross_reference
