base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: am
  text: እንደተጻፈው፣ “እነሆ፣ በጽዮን የማሰናከያ ድንጋይና የእንቅፋት ዓለት አኖራለሁ፤[a] በእርሱ የሚያምን[b][c] እፍረት አይደርስበትም።”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ጳውሎስ እዚህ ከኢሳይያስ 8፥14 እና 28፥16 የተወሰዱ ቃላትን አጣምሮ ይጠቅሳል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “በእርሱ ላይ የሚያምን።” ግሪኩ፣ “በእርሱ ላይ” ይላል።
    reason: lexical_alternative
  - marker: c
    text: አንዳንድ ትርጉሞች “በእሱ” ብለው ይተረጉማሉ፤ ይህም ወደ ድንጋዩ ይመልሳል። በጳውሎስ ዐውድ ግን ይህ ምስል በግላዊ መልኩ ተተግብሯል።
    reason: alternative_reading
  - marker: d
    text: ወይም፣ “አይዋረድም” ወይም “ተስፋ አይቆርጥም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: ቅዱሳት መጻሕፍትን የሚያስተዋውቀውን የተለመደ ቀመር በተፈጥሯዊና ክቡር አማርኛ ያቀርባል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የጥቅሱን ትኩረት ሰጪ ኃይል የሚጠብቅ፣ በመጽሐፍ ቅዱሳዊ ንባብም የታወቀ ቃል ነው።
- source_word: τίθημι
  choice: አኖራለሁ
  rationale: የአሁን ጊዜውን ትንቢታዊ አቀራረብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከድንጋይ ምስል ጋርም ይስማማል።
- source_word: λίθον προσκόμματος
  choice: የማሰናከያ ድንጋይ
  rationale: ድንጋዩ ለመሰናከል ምክንያት መሆኑን የግሪኩን የስም ግንኙነት በግልጽ አማርኛ ያሳያል።
- source_word: πέτραν σκανδάλου
  choice: የመውደቂያ ዓለት
  rationale: ከቀደመው ሐረግ ጋር ያለውን ትይዩነት እየጠበቀ፣ σκάνδαλον የሚያመለክተውን የውድቀት ምክንያት በሚገባ ያቀርባል።
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: በእርሱ የሚያምን
  rationale: ἐπί ቃል በቃል ‘በእርሱ ላይ’ ሊባል ቢችልም፣ ‘በእርሱ ማመን’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የመታመንን ሐሳብ ይጠብቃል።
- source_word: οὐ καταισχυνθήσεται
  choice: አያፍርም
  rationale: የወደፊት ጊዜውን ውጤትና የክብር–እፍረት ትርጉሙን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የαὐτῷ ተውላጠ ስም ማመልከቻ
  choice: “በእርሱ” ተብሎ በግላዊ መልኩ ተተርጉሟል።
  alternative: “በእሱ/በድንጋዩ” ተብሎ ለምሳሌያዊው ድንጋይ በኢ-ግላዊ መልኩ ሊጠቀስ ይችላል።
  rationale: የግሪኩ ተውላጠ ስም ከድንጋዩ ጋር ሰዋሰዋዊ ግንኙነት ቢኖረውም፣ በሮሜ 9፥32–33 እና 10፥11 ያለው ዐውድ ጳውሎስ ምስሉን በግል ላይ እንደሚያውለው ያሳያል። የአማርኛው “እርሱ” ይህን ያንጸባርቃል፣ ምሳሌያዊውን ድንጋይም አያጠፋም።
- issue: πέτραν σκανδάλου የሚያሳየው ውጤት
  choice: “የመውደቂያ ዓለት”
  alternative: “የማስቀየሚያ ዓለት” ወይም “የእንቅፋት ዓለት”
  rationale: σκάνδαλον እንቅፋትን፣ ውድቀትን ወይም ቅሬታን ሊያመለክት ይችላል። ከπροσκόμματος ጋር ባለው ትይዩ አገባብ “መውደቂያ” የምስሉን ዋና ኃይል ይጠብቃል፣ የቅሬታ ገጽታውን ግን ብቻውን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆ” የጥቅሱን ቅዱስ መጽሐፋዊ ቅርጽ ይጠብቃል፤ ከመጠን በላይ ጥንታዊ ወይም የአንድ ቤተ እምነት ልዩ ቃላት አልገቡም።
