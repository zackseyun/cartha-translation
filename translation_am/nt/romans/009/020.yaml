  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: am
  text: አይ፣ ይልቁንም፣ አንተ ሰው ሆይ፣ ለእግዚአብሔር መልሰህ የምትከራከር ማን ነህ? የተሠራው ነገር፣ “ለምን እንዲህ አደረግኸኝ?” ብሎ ለሠራው ይላልን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ የጥያቄ አቀራረብ አሉታዊ መልስ ይጠብቃል፤ እንዲሁም፣ “የተሠራው ነገር … አይለውም አይደል?” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: ነገር ግን
  rationale: ቅንጣቢው ከቀደመው ሐሳብ ጋር የሚቃረንና የሚያርም ሽግግር ያሳያል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የተግሣጹን ኃይል ይጠብቃል።
- source_word: ὦ ἄνθρωπε
  choice: አንተ ሰው
  rationale: ቀጥተኛውን ነጠላ ጥሪና አንድን ሰው የሰው ልጅ ተወካይ አድርጎ የመናገርን የንግግር ኃይል ይጠብቃል።
- source_word: σὺ τίς εἶ
  choice: ማን ነህ?
  rationale: ይህ ማንነትን የሚጠይቅ ተራ ጥያቄ ሳይሆን የሰውን ሥፍራ የሚያስገነዝብ የተግሣጽ ጥያቄ ነው።
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: ለእግዚአብሔር መልሰህ የምትከራከር
  rationale: ἀνταποκρίνομαι ተራ መልስ መስጠትን ሳይሆን በተቃውሞ መልሶ መከራከርን ያመለክታል፤ የተመረጠው አገላለጽ ይህን ይዘት በግልጽ አማርኛ ያስተላልፋል።
- source_word: μὴ ἐρεῖ
  choice: ይለዋልን?
  rationale: μή ከወደፊት አመልካች ጋር መጥቶ አሉታዊ መልስ የሚጠበቅበትን የንግግር ጥያቄ ያቀርባል፤ የአማርኛው -ን የጥያቄ ቅርጽ ይህን ኃይል በተፈጥሮ ይይዛል።
- source_word: τὸ πλάσμα / τῷ πλάσαντι
  choice: የተሠራው ነገር / ሠሪውን
  rationale: በሁለቱ የአንድ ሥር ቃላት መካከል ያለውን የተሠራና የሠራ ንጽጽር ያቆያል።
- source_word: Τί με ἐποίησας οὕτως;
  choice: ለምን እንዲህ አድርገህ ሠራኸኝ?
  rationale: οὕτως ያለውን ‘እንዲህ/በዚህ መልኩ’ ትርጉም ግልጽ አድርጎ ሲያቀርብ፣ የመፍጠርን ሐሳብ በ‘ሠራኸኝ’ ያቆያል።
theological_decisions:
- issue: የἄνθρωπε ተወካይ አጠቃቀም
  choice: “አንተ ሰው” ተብሎ ተተረጎመ
  alternative: “አንተ የሰው ልጅ”
  rationale: ግሪኩ አንድን ሰው በቀጥታ ሲጠራ በእርሱ አማካይነት ሰውን በአጠቃላይ ይወክላል፤ አጭሩ አገላለጽ የተግሣጹን ቀጥተኛነት ይጠብቃል።
- issue: በፈጣሪና በተፈጠረው መካከል ያለው የሥልጣን ልዩነት
  choice: “መልሰህ የምትከራከር” በሚል ጠንካራ አገላለጽ ተጠበቀ
  alternative: “መልስ የምትሰጥ”
  rationale: ጽሑፉ ተራ ውይይትን ሳይሆን የተፈጠረው ፈጣሪውን በተቃውሞ መጠየቁን ይገሥጻል፤ ይህን ውጥረት ማለዘብ አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሠራ/የተሠራ” የሚለው የቃል ድግግሞሽ የግሪኩን πλάσμα/πλάσαντι የፈጣሪና የተፈጠረ ንጽጽር ለማንጸባረቅ ሆን ተብሎ ተጠብቋል።
