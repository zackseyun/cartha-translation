  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: am
  text: እንደ ተጻፈው፦ «ያዕቆብን ወደድሁ[b]፣ ዔሳውን ግን ጠላሁ[a]።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጠላሁ” የሚለው “አልተቀበልሁትም” ወይም “ከያዕቆብ ያነሰ ወደድሁ” ተብሎም ሊረዳ ይችላል። ጥቅሱ ከሚልክያስ 1፥2–3 የተወሰደ ሲሆን፣ አንዳንዶች ቃሉ ስሜታዊ ጥላቻን ሳይሆን ከቃል ኪዳን ጋር በተያያዘ አለመቀበልን ወይም አንዱን ከሌላው ማስቀደምን እንደሚያመለክት ይረዱታል።
    reason: lexical_alternative
  - marker: b
    text: ጥቅሱ ከሚልክያስ 1፥2–3 የተወሰደ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው ... ይላል
  rationale: የቅዱሳት መጻሕፍት ጥቅስን የሚያስተዋውቀውን የግሪክኛ ቀመር በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: Ἰακὼβ
  choice: ያዕቆብ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἠγάπησα
  choice: ወደድሁት
  rationale: የግሪክኛውን ቀጥተኛ የፍቅር ትርጉምና ያለፈ ጊዜ አኳኋን ይጠብቃል፤ የተሳቢ ቅጥያውም ያዕቆብን በተፈጥሯዊ አማርኛ ይመለከታል።
- source_word: δὲ
  choice: ግን
  rationale: በያዕቆብና በዔሳው መካከል ያለውን ንጽጽር በግልጽ አማርኛ ያሳያል።
- source_word: Ἠσαῦ
  choice: ዔሳው
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ባህል የተለመደውን የስሙን ቅርጽ ይጠቀማል።
- source_word: ἐμίσησα
  choice: ጠላሁት
  rationale: የμισέωን ቀጥተኛና ጠንካራ የቃል ትርጉም ይጠብቃል፤ እንደ “ናቅሁት” ወይም “አሳንሼ ወደድሁት” ያሉ ትርጓሜያዊ ማለዘቢያዎችን ወደ ዋናው ጽሑፍ አያስገባም።
theological_decisions:
- issue: “ጠላሁት” የሚለውን በመለኮታዊ ምርጫና በሴማዊ አነጋገር ዙሪያ ባሉ ክርክሮች ምክንያት ማለዘብ ይገባ እንደሆነ
  choice: በዋናው ጽሑፍ “ጠላሁት” የሚለውን ቀጥተኛ ትርጉም ማቆየት
  alternative: “ናቅሁት” ወይም “ከያዕቆብ ያነሰ ወደድሁት”
  rationale: የግሪክኛው ጥቅስ μισέω የሚለውን ጠንካራ ግስ ይጠቀማል። ዋናው ጽሑፍ ይህን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል፤ የቃሉ ሌሎች ሊሆኑ የሚችሉ አረዳዶች በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ባህላዊ የመጽሐፍ ቅዱስ ስሞች ተጠብቀዋል፤ ከመጠን በላይ ጥንታዊ አገላለጽ ግን ተወግዷል። የማስታወሻ ምልክቶቹ ከሚመለከታቸው ሐረጎች ቀጥለው ተቀምጠዋል።
