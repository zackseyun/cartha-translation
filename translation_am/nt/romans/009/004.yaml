  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: am
  text: እነርሱ እስራኤላውያን ናቸው፤ ልጅነት[a]፣ ክብር[b]፣ ቃል ኪዳኖች፣ ሕግ መሰጠት፣ አምልኮ[c] እና ተስፋዎች የእነርሱ ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልጅ አድርጎ መቀበል” ወይም “የልጅነት ስፍራ።”
    reason: lexical_alternative
  - marker: b
    text: “ክብር” የሚለው ምናልባት እግዚአብሔር በእስራኤል መካከል የገለጠውን መገኘቱን ያመለክታል።
    reason: cross_reference
  - marker: c
    text: ይህም እስራኤል በቃል ኪዳኑ መሠረት በእግዚአብሔር ፊት የሚያቀርበው አምልኮና አገልግሎት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: እነርሱ እስራኤላውያን ናቸው
  rationale: የቀደመውን ሐሳብ የሚያብራራውን ዝምድናዊ አገባብ በተፈጥሯዊ አማርኛ ያቀርባል፤ የሕዝቡንም ታሪካዊና የቃል ኪዳን ማንነት ይጠብቃል።
- source_word: ὧν
  choice: የእነርሱ ናቸው
  rationale: የዘመድ ተውላጠ ስሙን የባለቤትነት ኃይል በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: υἱοθεσία
  choice: ልጅነት
  rationale: ቃሉ ሕዝቡ በእግዚአብሔር ዘንድ ያለውን የልጅነት ስፍራ ያመለክታል፤ አጭሩ አገላለጽ የግሪኩን ሥነ መለኮታዊ ስፋት ሳያጠብ ይጠብቃል።
- source_word: δόξα
  choice: ክብር
  rationale: ግሪኩ በቀጥታ ‘ክብር’ ይላል፤ ስለዚህ በዋናው ጽሑፍ የእግዚአብሔር የተገለጠ መገኘት ብሎ በማስፋት አልተተረጎመም።
- source_word: διαθῆκαι
  choice: ቃል ኪዳኖች
  rationale: በግሪክ ያለውን ብዙ ቁጥር ይጠብቃል፤ ‘ቃል ኪዳን’ም የተለመደና ግልጽ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: νομοθεσία
  choice: ሕግ መሰጠት
  rationale: ቃሉ ሕጉን ብቻ ሳይሆን ሕጉ የተሰጠበትን ድርጊት ያመለክታል።
- source_word: λατρεία
  choice: አምልኮ
  rationale: ለእግዚአብሔር የሚቀርበውን የቃል ኪዳን አገልግሎትና አምልኮ ይገልጣል፤ ቃሉን በቤተ መቅደስ አገልግሎት ብቻ አያጠብም።
- source_word: ἐπαγγελίαι
  choice: ተስፋዎች
  rationale: የግሪኩን ብዙ ቁጥር በመጠበቅ ለእስራኤል የተሰጡትን መለኮታዊ ተስፋዎች በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በእስራኤል አውድ ውስጥ የυἱοθεσία ትርጉም
  choice: ልጅነት
  alternative: ልጅ አድርጎ መቀበል
  rationale: አውዱ የእስራኤልን የሕዝብነት የቃል ኪዳን መብት ይዘረዝራል። ‘ልጅነት’ የመጽሐፍ ቅዱሱን ዘይቤ ይጠብቃል፣ ግን በዚህ ስፍራ የግለሰብ ድነትን ዝርዝር አያስገባም።
- issue: የἡ δόξα ማመልከቻ
  choice: በዋናው ጽሑፍ ‘ክብር’ ብቻ ተብሏል
  alternative: የእግዚአብሔር የተገለጠ ክብር
  rationale: በአውዱ የእግዚአብሔርን በእስራኤል መካከል የተገለጠ መገኘት ሊያመለክት ይችላል፤ ግሪኩ ግን ‘ክብር’ ብቻ ስለሚል ያ ጥልቀት በዋናው ጽሑፍ አልተጠበበም።
- issue: የλατρεία ወሰን
  choice: አምልኮ
  alternative: የቤተ መቅደስ አገልግሎት
  rationale: ቃሉ የእስራኤልን የተደነገገ ቅዱስ አገልግሎት ይጨምራል፤ ሆኖም ‘የቤተ መቅደስ’ በማለት ጽሑፉ ከሚፈቅደው በላይ እንዳይጠብ ሰፊው ቃል ተመርጧል።
