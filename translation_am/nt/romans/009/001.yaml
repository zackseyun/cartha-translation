  terminology: «መሲሕ» appropriately preserves the titular force of Χριστός in accordance with the stated translation choice. «ሕሊና» and «መንፈስ ቅዱስ» are standard, clear, and suitable for the register. The alternative note for πνεύματι ἁγίῳ retains the possible non-proper reading without overstating it.
