  source_fidelity: 'The draft accurately represents the three assertions and the key expressions Ἀλήθειαν λέγω, οὐ ψεύδομαι, συμμαρτυρούσης μοι, and ἐν πνεύματι ἁγίῳ. However, «በመሲሑ ሆኜ» is not a safe idiomatic rendering of ἐν Χριστῷ: ሆኜ can suggest ‘having become/being made’ rather than Paul’s locative-relational expression. Removing it preserves the Greek ambiguity and relation more directly.'
