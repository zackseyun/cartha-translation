  rationale: διώκω እዚህ አንድን ግብ በትጋት መከታተልን ያሳያል፤ አማርኛውም ይህን የመጣር ስሜት ይይዛል።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: በጳውሎስ አጠቃቀም ያለውን ሥነ ምግባራዊ፣ ሕጋዊና ኪዳናዊ ስፋት ሳያጠብ የሚያስተላልፍ የተለመደ የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: κατέλαβεν
  choice: አገኙ
  rationale: በአውዱ ያልተከታተሉትን ነገር ማግኘታቸውን ያመለክታል፤ በአማርኛም ግልጽና ተፈጥሯዊ ነው።
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: እርሱም ከእምነት የሆነው ጽድቅ ነው
  rationale: የተገኘውን ጽድቅ ዓይነት የሚገልጸውን አፖዚሽናዊ አወቃቀር ግልጽ ያደርጋል፤ ἐκ የሚያሳየውን ‘ከ’ ግንኙነት ያለ ትምህርታዊ ማስፋፊያ ይጠብቃል።
- source_word: πίστεως
  choice: እምነት
  rationale: በዚህ አውድ πίστις በዋናነት እምነትን ወይም መታመንን ያመለክታል፤ የ‘ታማኝነት’ ዕድል ግን በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በጳውሎስ ክርክር ውስጥ የδικαιοσύνη ትርጉም
  choice: በዋናው ጽሑፍ ‘ጽድቅ’ ተብሎ ተተርጉሟል፤ እንደ አንድ ብቻ የሥነ መለኮት ዘዴ አልተገደበም።
  alternative: ፍትሕ፤ በእግዚአብሔር ፊት ትክክለኛ አቋም፤ የኪዳን አባልነት ሁኔታ
  rationale: ጥቅሱ የጳውሎስን ንጽጽር ያቀርባል እንጂ የጽድቅን ሙሉ ሥነ መለኮታዊ አሠራር አይዘረዝርም፤ ‘ጽድቅ’ የቃሉን ስፋት ይጠብቃል።
- issue: ἐκ πίστεως የሚለው ግንኙነት
  choice: ‘ከእምነት የሆነው’ ተብሎ ተተርጉሟል።
  alternative: በእምነት፤ በእምነት መሠረት፤ ከታማኝነት
  rationale: ‘ከ’ የግሪኩን ἐκ ቅርጽ ይጠብቃል፤ በጽሑፉ ውስጥ የሌሉ እንደ ‘በእምነት ብቻ’ ያሉ ኋለኛ ትምህርታዊ ቀመሮችን አያስገባም።
- issue: δὲ በመጨረሻው ሐረግ ያለው ተግባር
  choice: በአማርኛ ‘እርሱም’ በሚል ገላጭ ቅጥ ቀርቧል።
  alternative: ‘ነገር ግን’ በሚል ተቃርኖ መተርጎም
  rationale: በዚህ ስፍራ የተገኘውን ጽድቅ ዓይነት ይገልጻል፤ ጠንካራ ተቃርኖ ማስገባት የአወቃቀሩን ገላጭ ተግባር ሊያደበዝዝ ይችላል።
