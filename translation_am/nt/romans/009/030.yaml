  text: እንግዲህ ምን እንላለን? ጽድቅን[a] የማይከታተሉ አሕዛብ[b] ጽድቅን አገኙ፤ ይኸውም ከእምነት[c] የሚመጣውን ጽድቅ።
  philosophy: optimal-equivalence
