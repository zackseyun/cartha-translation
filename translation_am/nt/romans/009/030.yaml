  verdict: revise
  source_fidelity: 'The draft accurately renders the main Greek argument: the Gentiles did not pursue righteousness, yet attained righteousness, specified as righteousness from faith. However, «እርሱም … ነው» turns the final appositional specification into an independent explanatory clause and adds a slightly awkward pronominal predicate not present in the Greek. A direct appositional continuation more closely reflects δικαιοσύνην δὲ τὴν ἐκ πίστεως.'
  naturalness: «ያልተከታተሉ» is understandable but can sound completed/perfective rather than characteristically ongoing. «የማይከታተሉ አሕዛብ» is natural modern Amharic and better conveys the present participle. «ከእምነት የሚመጣው ጽድቅ» is smoother than «ከእምነት የሆነው ጽድቅ» while retaining the source relation without doctrinal expansion.
  terminology: «ጽድቅ», «አሕዛብ», and «እምነት» are appropriate established biblical Amharic terms. The lexical footnotes are generally suitable; footnote a needs a small wording correction because the verse itself does not contain further repeated occurrences beyond the two in this verse.
  issues:
  - severity: medium
    issue: 'The final phrase is rendered as an independent clause: «እርሱም ከእምነት የሆነው ጽድቅ ነው።»'
    rationale: Greek repeats δικαιοσύνην in apposition/specification. Keeping it as «ከእምነት የሚመጣውን ጽድቅ» preserves the syntactic flow and avoids the added pronoun/copula.
  - severity: low
    issue: «ያልተከታተሉ» may underrepresent the present participle’s characteristic/ongoing sense.
    rationale: «የማይከታተሉ» naturally expresses those not engaged in pursuing righteousness.
