    reason: lexical_alternative
  - marker: c
    text: ወይም ‘ከእምነት የሆነው ጽድቅ’፤ እዚህ የመሆን ዕድሉ ያነሰ ቢሆንም ‘ከታማኝነት የሚመጣው ጽድቅ’ ተብሎም ሊገባ ይችላል።
