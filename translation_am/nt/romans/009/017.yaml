source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: am
  text: መጽሐፍ ቅዱስ ለፈርዖን እንዲህ ይላልና፤ “ለዚሁ ዓላማ አስነሳሁህ፤ ኃይሌን በአንተ እንዳሳይ እና ስሜ በምድር ሁሉ እንዲታወጅ ነው።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γραφή
  choice: መጽሐፍ ቅዱስ
  rationale: ነጠላውንና የተወሰነውን አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል፤ ጳውሎስም የተጻፈውን ቃል እንደሚናገር አድርጎ ማቅረቡን ያስቀራል።
- source_word: λέγει ... τῷ Φαραώ
  choice: ፈርዖንን ... ይለዋል
  rationale: የግሪኩን የአሁን ጊዜ አነጋገርና መጽሐፍ ቅዱስ እንደሚናገር መቅረቡን ይጠብቃል።
- source_word: γὰρ
  choice: ይለዋልና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ማብራሪያዊ ግንኙነት በአማርኛው ቅጥያ -ና ያሳያል።
- source_word: Εἰς αὐτὸ τοῦτο
  choice: ለዚሁ ዓላማ
  rationale: የሐረጉን ዓላማና አጽንዖት በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐξήγειρά σε
  choice: አስነሳሁህ
  rationale: ቃሉ ማስነሳትን፣ ወደ ፊት ማምጣትን ወይም ቆሞ እንዲኖር ማድረግን ሊያመለክት የሚችለውን ሰፊ ኃይል ይጠብቃል፤ ስለ ፈርዖን የተወሰነ ሥነ መለኮታዊ ትርጓሜ አያስገባም።
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: ኃይሌን በአንተ እንዳሳይ
  rationale: ὅπως የሚያሳየውን ዓላማ፣ ἐνδείξωμαι የሚያመለክተውን ግልጽ ማሳየት፣ እና ἐν σοὶ ያለውን ‘በአንተ’ አገላለጽ ይጠብቃል።
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: ስሜም እንዲታወጅ
  rationale: የዓላማውን ሁለተኛ ክፍልና የሕዝብ ፊት ሰፊ አዋጅ የሚለውን የδιαγγέλλω ኃይል ያስተላልፋል።
- source_word: ἐν πάσῃ τῇ γῇ
  choice: በምድር ሁሉ
  rationale: የንግግሩን ሰፊና ዓለም አቀፍ ወሰን ይጠብቃል፤ ‘በሀገሩ ሁሉ’ ብሎ አያጠበውም።
theological_decisions:
