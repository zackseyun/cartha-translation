  rationale: ግሪኩ በአብርሃም ዘርነትና በልጅነት መካከል ልዩነት ያደርጋል፤ ትርጉሙ ይህን ውጥረት ይጠብቃል እንጂ ከቁጥሩ በላይ አይተረጉምም።
