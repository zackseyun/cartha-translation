review_pass:
  verdict: revise
  source_fidelity: The draft retains the key contrast between Abrahamic physical descent and childship, and it renders the Genesis citation closely. However, the added closing formula “ተብሎአል” is not present in the Greek and should be removed. The initial construction can also state the force of οὐδὲ ὅτι more naturally and explicitly.
  naturalness: “እንዲሁም ... ስለሆኑ ብቻ ሁሉም ልጆቹ አይደሉም” is understandable but somewhat compressed and less idiomatic. “... ሁሉም ልጆቹ ናቸው ማለት አይደለም” clearly expresses the Greek logical assertion in modern standard Amharic.
  terminology: ዘር appropriately preserves the collective-singular force of σπέρμα, and ልጆቹ appropriately conveys τέκνα in its contextual relationship to Abraham. “በይስሐቅ ... ይጠራል” preserves the wording and productive ambiguity of the citation. Footnote b should not introduce “ይለያል” as though it were a straightforward translation of κληθήσεται; the formal alternative should remain closer to “ይጠራል/ይሰየማል.”
  issues:
  - severity: medium
    issue: The quotation is followed by “ተብሎአል.”
    rationale: This adds an explicit reporting verb (“it has been said”) not found in οὐδὲ ... ἀλλ᾽· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα. The quotation should stand directly after the contrast.
  - severity: low
    issue: The opening negated proposition is stylistically compressed.
    rationale: Recasting it as “... ሁሉም ልጆቹ ናቸው ማለት አይደለም” better represents “Nor is it the case that ... they are all children” without adding theological interpretation.
