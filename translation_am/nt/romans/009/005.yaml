  alternative: የመጨረሻውን አንቀጽ የተለየ ውዳሴ አድርጎ፣ “ከሁሉ በላይ ያለው አምላክ ለዘላለም የተባረከ ይሁን” ብሎ ማንበብ ይቻላል።
  rationale: ὁ ὢν የሚለው አንቀጽ ከὁ χριστός ጋር ተያይዞ መሲሑን መግለጹ በግሪኩ አገባብና በንግግሩ ፍሰት ተፈጥሯዊ ነው። ሆኖም በጥንታዊዎቹ ጽሑፎች ዘመናዊ ሥርዓተ ነጥብ ስለሌለ ታሪካዊው አማራጭ በማስታወሻ ተጠብቋል።
