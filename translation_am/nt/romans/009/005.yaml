    reason: lexical_alternative
  - marker: b
    text: የመጨረሻውን አንቀጽ እንደ ተለየ ውዳሴ በመውሰድ፣ “ከሁሉ በላይ ያለው አምላክ ለዘላለም የተባረከ ይሁን። አሜን።” ብሎ ማንበብም ይቻላል፤ በዋናው ጽሑፍ ግን ይህ አንቀጽ መሲሑን እንደሚገልጽ ተወስዷል።
    reason: alternative_reading
