  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: am
  text: ስለዚህ[a] ይህ በሚሻውም ሆነ በሚሮጠው[b] ላይ አይመሠረትም፤ ይልቁንም ምሕረት በሚያሳየው በእግዚአብሔር ላይ ይመሠረታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በበለጠ መደበኛ አገላለጽ፣ “ስለዚህ፣ ይህ የሚሻው ወይም የሚሮጠው አይደለም፤ ነገር ግን ምሕረት የሚያሳየው የእግዚአብሔር ነው” ሊባል ይችላል። የግሪክኛው አገላለጽ ሞላ ጎደል ነው፤ የተጠቆመው ርእሰ ጉዳይ ከአውዱ፣ በተለይም ከእግዚአብሔር ዓላማና ምሕረት ይገባል።
    reason: lexical_alternative
  - marker: b
    text: “የሚሮጥ” የሚለው የሰውን ጥረት ወይም ትጋት በምሳሌ ሊያመለክት ይችላል፤ የግሪክኛው ግስ ግን ቃል በቃል “ይሮጣል” ማለት ነው።
    reason: cultural_note
