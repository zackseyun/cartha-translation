  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: am
  text: 'ስለዚህ[a] እርሱ ለሚፈልገው ሰው ምሕረት ያሳያል፤ የሚፈልገውንም ሰው ያደነድናል[b]።


    [a] ወይም፣ «እንግዲያስ»።


    [b] «ያደነድናል» የሚለው «ግትር ያደርጋል» ወይም «እልከኛ ያደርጋል» ተብሎም ሊተረጎም ይችላል፤ የግሪክኛው ግስ አድራጊ ነው፣ ስለዚህ ድርጊቱን መፍቀድ ብቻ ብሎ አይገልጽም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንግዲያስ»።
    reason: lexical_alternative
  - marker: b
    text: «ያደነድናል» የሚለው «ግትር ያደርጋል» ወይም «እልከኛ ያደርጋል» ተብሎም ሊተረጎም ይችላል፤ የግሪክኛው ግስ አድራጊ ነው፣ ስለዚህ ድርጊቱን መፍቀድ ብቻ ብሎ አይገልጽም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ስለዚህ
  rationale: ሁለቱ የድምዳሜ ቃላት ከቀደመው ሐሳብ የሚወጣውን ውሳኔ ያጠናክራሉ፤ «ስለዚህ» ይህን አመክንዮአዊ ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὃν θέλει
  choice: ለሚፈልገው / የሚፈልገውን
  rationale: θέλει የፈቃድን ወይም የመሻትን ቀጥተኛ አገላለጽ ስለሚይዝ «የሚፈልገው» ተመርጧል፤ በሁለቱም ሐረጎች መደገሙ የግሪክኛውን ትይዩነት ይጠብቃል።
- source_word: ἐλεεῖ
  choice: ምሕረት ያደርጋል
  rationale: ግሱ ምሕረትን በተግባር ማድረግን ያመለክታል፤ ይህ አገላለጽ ግልጽ፣ ክቡርና በዘመናዊ አማርኛ የተለመደ ነው።
- source_word: σκληρύνει
  choice: ያደነድናል
  rationale: ቃሉ ማደንደንን ወይም ግትር ማድረግን ይገልጻል። «ያደነድናል» የግሪክኛውን አድራጊ ግስ በቀጥታ ይጠብቃል፤ ድርጊቱን ወደ መፍቀድ ብቻ አያለዝበውም።
theological_decisions:
- issue: በ θέλει ውስጥ የተገለጸው መለኮታዊ ፈቃድ
  choice: የእግዚአብሔርን መፈለግ በቀጥታ «የሚፈልገው» ብሎ ማቆየት
  alternative: ቃሉን ወደ መፍቀድ ብቻ በሚያዘነብል አገላለጽ መተርጎም
  rationale: ግሪክኛው በሁለቱም ሐረጎች መለኮታዊውን ፈቃድ በቀጥታ ይገልጻል። ትርጉሙ በመለኮታዊ ሥልጣንና በሰው ኃላፊነት መካከል ያለውን ውጥረት አይፈታም።
- issue: በ σκληρύνει ውስጥ የድርጊቱ አድራጊ
  choice: «ያደነድናል» በሚል አድራጊ ግስ መተርጎም
  alternative: «እንዲደነድን ይፈቅዳል» ብሎ ማለዘብ
  rationale: የግሪክኛው ግስ አድራጊ ነውና ድርጊቱን ለሐረጉ ባለቤት በቀጥታ ያስጠጋል። ወደ ፈቃድ ብቻ መለወጥ ከምንጩ ቃል በላይ የሚሄድ ትርጓሜ ይሆናል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። «እርሱ» የሚለው ተውላጠ ስም ከአውዱ የተገነዘበውን እግዚአብሔርን በአማርኛ ግልጽ ለማድረግ ተጨምሯል፤ በግሪክኛው የግሱ መልክ ሦስተኛ መደብ ነጠላ ባለቤትን ያሳያል።
