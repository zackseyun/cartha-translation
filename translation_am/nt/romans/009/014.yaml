  verdict: revise
  source_fidelity: The draft accurately conveys the transitional question, the rhetorical allegation of injustice in relation to God, and Paul's emphatic rejection. The wording of the second footnote, however, labels a slightly expanded Amharic paraphrase as though it were the Greek wording.
  naturalness: The main text is clear, modern, and suitably dignified. “በእግዚአብሔር በኩል” naturally expresses the intended sense ‘on God’s part.’ “ፈጽሞ አይሁን!” is an effective emphatic denial.
  terminology: “ኢፍትሐዊነት” appropriately represents ἀδικία in this context. The alternative “አለመጽደቅ” is acceptable as a lexical alternative, though less direct in this judicial-moral context. No theological expansion is introduced.
  issues:
  - severity: low
    issue: Footnote b presents “እንዲህ ከቶ አይሁን!” as the Greek wording.
    rationale: The Greek is simply μὴ γένοιτο, literally represented by “ከቶ አይሁን!”; “እንዲህ” is an interpretive addition. Removing it makes the audit note more exact without altering the translation’s meaning.
  revised_text: ታዲያ ምን እንላለን? በእግዚአብሔር በኩል ኢፍትሐዊነት[a] አለን? ፈጽሞ አይሁን![b]
