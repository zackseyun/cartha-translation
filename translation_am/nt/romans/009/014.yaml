  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: am
  text: ታዲያ ምን እንላለን? በእግዚአብሔር በኩል ኢፍትሐዊነት[a] አለን? ፈጽሞ አይሁን![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አለመጽደቅ።”
    reason: lexical_alternative
  - marker: b
    text: በግሪክ፣ “ከቶ አይሁን!” ይህ እጅግ ጠንካራ ክህደት ነው፤ “በፍጹም!” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: ታዲያ ምን እንላለን?
  rationale: የጳውሎስን መደበኛ የሽግግርና የክርክር ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የወደፊት ጊዜውንም የምክክር ኃይል ይጠብቃል።
- source_word: μὴ
  choice: …አለን?
  rationale: μή አሉታዊ መልስ የሚጠብቅ የክርክር ጥያቄ መሆኑን በአማርኛ የጥያቄ አወቃቀር ያሳያል።
- source_word: ἀδικία
  choice: ኢፍትሐዊነት
  rationale: በዚህ አውድ የተጠየቀውን የፍትሕ መጓደል ወይም የጽድቅ ማጣት የሞራልና የፍርድ ትርጉም በግልጽ ዘመናዊ ቃል ይገልጻል።
- source_word: παρὰ τῷ θεῷ
  choice: በእግዚአብሔር በኩል
  rationale: ሐረጉ እዚህ ‘በእግዚአብሔር ወገን’ ወይም ‘ከእግዚአብሔር በኩል’ ማለት ስለሆነ፣ የኃላፊነትን አቅጣጫ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: የግሪኩን ምኞታዊ ቅርጽና የጳውሎስን እጅግ ጠንካራ ክህደት በአጭርና ክብር ባለው አማርኛ ይጠብቃል።
theological_decisions:
- issue: በሮሜ 9 ያለውን የእግዚአብሔር ፍትሕ ጥያቄ የተወሰነ የሥነ መለኮት ሥርዓት ሳይጨመርበት ማቅረብ
  choice: ጥቅሱ በእግዚአብሔር በኩል ኢፍትሐዊነት ሊኖር ይችላልን የሚለውን የክርክር ጥያቄ ያቀርባል፤ ከዚያም በጽኑ ይክደዋል።
  alternative: “እግዚአብሔር ኢፍትሐዊ ነውን?” ብሎ በቀጥታ መተርጎም ወይም ስለ ምርጫና ውድቅነት ማብራሪያ መጨመር።
  rationale: የግሪኩ ጽሑፍ አጭር ሲሆን ተቃውሞውንና ጽኑ ክህደቱን ብቻ ይገልጻል። ትርጉሙም ይህን ውጥረት ይጠብቃል እንጂ በጥቅሱ ያልተገለጸ የአስተምህሮ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ታዲያ” የክርክሩን ሽግግር በተፈጥሯዊ ሁኔታ ያሳያል፤ “ፈጽሞ አይሁን” ደግሞ የግሪኩን ጽኑና ምኞታዊ ክህደት ይጠብቃል።
