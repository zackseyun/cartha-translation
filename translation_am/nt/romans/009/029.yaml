  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: am
  text: 29 እንዲሁም፣ ኢሳይያስ አስቀድሞ እንደተናገረው፣ “የሠራዊት ጌታ[a] ዘር[b] ባያስቀርልን ኖሮ፣ እንደ ሰዶም ሆነን እንደ ገሞራም ተመስለን ነበር።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታ ሳባዎት።” የግሪኩ Σαβαώθ ብዙውን ጊዜ “የሠራዊት ጌታ” ወይም “የሰራዊቶች ጌታ” ተብሎ የሚተረጎመውን የዕብራይስጥ መለኮታዊ ማዕረግ በድምፅ የተጻፈ ቃል ነው።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ዘር” ማለት ከጥፋት የተረፉ ተወላጆችን ወይም ዘሮችን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ከኢሳይያስ 1፥9 የተጠቀሰ።
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: እንደተናገረው
  rationale: καθὼς ያለውን የንጽጽር ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ καί በአማርኛው የንግግር ፍሰት ውስጥ በግልጽ ሳይደገም ተካትቷል።
- source_word: προείρηκεν
  choice: አስቀድሞ እንደተናገረው
  rationale: የቀደመውን ንግግርና አሁንም ያለውን ጠቀሜታ ያሳያል፤ ቃሉን የወደፊት ትንቢት ብቻ አድርጎ አይገድበውም።
- source_word: κύριος Σαβαὼθ
  choice: የሠራዊት ጌታ
  rationale: Σαβαώθ ከዕብራይስጥ የተላለፈ መለኮታዊ ማዕረግ ስለሆነ ትርጉሙን የሚገልጠው ‘የሠራዊት ጌታ’ ተመርጧል።
- source_word: ἐγκατέλιπεν ἡμῖν
  choice: ባያስቀርልን ኖሮ
  rationale: የተተወ ወይም ከጥፋት የተረፈ ነገር የሚለውን ሐሳብ እና ተቃራኒ-እውነታዊውን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: σπέρμα
  choice: ዘር
  rationale: የግሪኩን ምስላዊና የቃል ቅርበት ይጠብቃል፤ በዚህ አውድ ዘሮችን ወይም ከጥፋት የተረፉ ተወላጆችን እንደሚያመለክት በማስታወሻ ተብራርቷል።
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: እንደ ሰዶም በሆንን ... ነበር
  rationale: ὡς ያለውን ንጽጽርና ἄν ያለውን ተቃራኒ-እውነታዊ ውጤት ያስተላልፋል።
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: እንደ ገሞራ በተመሰልን ነበር
  rationale: የὁμοιόωን ተገብሮ ቅርጽ በመጠበቅ ከቀደመው ‘በሆንን’ የተለየውን ግስ ያሳያል።
theological_decisions:
- issue: በብሉይ ኪዳን ጥቅስ ውስጥ κύριος Σαβαὼθ እንዴት እንደሚተረጎም
  choice: የሠራዊት ጌታ
  alternative: ጌታ ሳባዎት፤ የሰራዊቶች ጌታ
  rationale: ግሪኩ κύριος እና ከዕብራይስጥ የተጻፈው Σαβαώθ የማዕረጉን ትርጉም እንዲገልጡ ተተርጉመዋል፤ ከግሪኩ ሳይነሳ የዕብራይስጡን መለኮታዊ ስም በዋናው ጽሑፍ አልተጨመረም።
- issue: σπέρμαን ‘ቅሬታ’ በሚል ሥነ መለኮታዊ ቃል መተርጎም ወይም የቃሉን ምስል መጠበቅ
  choice: ዘር
  alternative: ተወላጆች፤ ቅሬታ
  rationale: ሰፊው አውድ ስለ ቅሬታ ቢናገርም፣ እዚህ ያለው ቃል σπέρμα ነው። ‘ዘር’ የቃሉን ምስልና አሻሚነት ይጠብቃል፤ የአውዱ ትርጉም በማስታወሻ ይገለጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሁለት የተለያዩ ግሶች—‘መሆን’ እና ‘መመሰል’—ተለይተው ተጠብቀዋል፤ የኢሳይያስ ጥቅስም በግልጽ የጥቅስ ምልክት ቀርቧል።
