revisions:
- from: ለሙሴ እንዲህ ይላልና፦ “የምምረውን እምራለሁ፤ የምራራለትንም እራራለታለሁ።”[a]
  to: ለሙሴ እንዲህ ይላልና፦ “ለማንም ምሕረት የማደርግለት ምሕረት አደርጋለሁ፤ ለማንም ርኅራኄ የማደርግለት ርኅራኄ አደርጋለሁ።”[a]
  rationale: The revision retains the source’s present-tense introduction, causal connector, indefinite relative force, future declarations, and emphatic lexical parallelism. It uses unambiguous modern Amharic terminology for mercy and compassion while avoiding any doctrinal expansion.
