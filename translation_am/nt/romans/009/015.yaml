id: ROM.9.15
reference: Romans 9:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: am
  text: ለሙሴ እንዲህ ይላልና፦ “ለማንም ምሕረት የማደርግለት ምሕረት አደርጋለሁ፤ ለማንም ርኅራኄ የማደርግለት ርኅራኄ አደርጋለሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ከዘፀአት 33፥19 የተጠቀሰ።
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: ለሙሴ
  rationale: የተሳቢ ቅርጹ ከλέγει ጋር የንግግሩን ተቀባይ ያመለክታል፤ «ለሙሴ» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት «ይላልና» በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: λέγει
  choice: እንዲህ ይላል
  rationale: የግሪኩን የአሁን ጊዜ የጥቅስ አቀራረብ ይጠብቃል፤ በዘፀአት አውድ ተናጋሪው እግዚአብሔር ነው። «እንዲህ» ጥቅሱን በአማርኛ በግልጽ ያስገባል።
- source_word: Ἐλεήσω … ἐλεῶ
  choice: የምምረውን እምራለሁ
  rationale: የἐλεέωን ድግግሞሽና አጽንዖት በአንድ የአማርኛ ግስ ይጠብቃል፤ በጽሑፉ የሌለውን «የመረጥኩትን» የሚል ማብራሪያ አይጨምርም።
- source_word: ὃν ἂν
  choice: የም…ውን
  rationale: ግልጽ ያልተወሰነውን ተሳቢ «ማንንም/የም…ውን» በአማርኛ አንጻራዊ አወቃቀር ያቀርባል።
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: የምራራለትንም እራራለታለሁ
  rationale: ከἐλεέω የተለየውን የርኅራኄ ገጽታ በ«መራራት» ይገልጣል፣ የግሪኩንም ትይዩ ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: በጥቅሱ መግቢያ የተናጋሪው ማንነት
  choice: «ይላል» በማለት ተናጋሪውን በግል ማቅረብ
  alternative: «መጽሐፉ ይላል» ብሎ መተርጎም
  rationale: በግሪክ ግልጽ ስም ባይኖርም፣ በዘፀአት 33፥19 አውድ ይህን ቃል ለሙሴ የሚናገረው እግዚአብሔር ነው፤ «ይላል» የግሪኩን ግላዊ አቀራረብ አያዳክምም።
- issue: በምሕረትና በርኅራኄ የተገለጠው መለኮታዊ ነጻነት
  choice: ድግግሞሹን ሳይለዝቡ መጠበቅ
  alternative: «የመረጥኩትን እምራለሁ» ብሎ ትርጉሙን ማብራራት
  rationale: ጥቅሱ በምሕረትና በርኅራኄ ላይ ያለውን መለኮታዊ ነጻነት በአጽንዖት ያቀርባል። በግሪኩ የሌለውን «መምረጥ» የሚል ቃል መጨመር የትርጓሜ ክርክሩን አስቀድሞ ሊወስን ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለአብዛኛው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መማር» እና «መራራት» የተባሉት ትይዩ ግሶች የግሪኩን ሁለት የተለያዩ ቃላትና ድግግሞሻቸውን ይጠብቃሉ።
