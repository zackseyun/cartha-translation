  rationale: የሕግና የጽድቅን ዝምድና ሳይፈታ የግሪኩን አጭር አገላለጽ ይጠብቃል። አማርኛ የግድ የእንግሊዝኛውን ያልተወሰነ መስተዋድድ በተለየ ቃል ስለማይገልጽ፣ አገላለጹ ሕጉን ከመጠን በላይ የታወቀ አያደርገውም።
