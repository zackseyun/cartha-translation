base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: am
  text: ነገር ግን ከመሲሑ[a] ጋር ከሞትን፣ ከእርሱ ጋር ደግሞ እንኖራለን ብለን እናምናለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ”፤ በግሪክ Χριστῷ (Christō)።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን … ከሆነ/ከሞትን
  rationale: εἰ የሁኔታ አንቀጽን ያስገባል፤ δέ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ሽግግር ወይም ንጽጽር ያሳያል። በአማርኛ «ነገር ግን … ከሞትን» ሁለቱንም ተግባር በተፈጥሮ ያስተላልፋል።
- source_word: ἀπεθάνομεν
  choice: ከሞትን
  rationale: የግሪኩ አዎንታዊ ያለፈ ጊዜ ድርጊት፣ በአማርኛው የሁኔታ አንቀጽ ውስጥ «ከሞትን» ተብሎ በቀጥታ ተገልጧል።
- source_word: σὺν Χριστῷ
  choice: ከመሲሑ ጋር
  rationale: σύν አብሮነትን ወይም ተሳትፎን ያመለክታል። Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተመርጧል፤ የተለመደው «ክርስቶስ» በአማራጭ ማስታወሻ ቀርቧል።
- source_word: πιστεύομεν
  choice: እናምናለን
  rationale: የእምነትን ግልጽ መግለጫ በተፈጥሯዊና ቀጥተኛ አማርኛ ያቀርባል።
- source_word: ὅτι
  choice: … ብለን
  rationale: ὅτι የእምነቱን ይዘት ያስገባል፤ በአማርኛ «… ብለን እናምናለን» የሚለው አወቃቀር ይህን በተፈጥሮ ያሳያል።
- source_word: καὶ
  choice: ደግሞ
  rationale: ከመሲሑ ጋር መሞትን ከእርሱ ጋር ከሚሆነው የወደፊት ሕይወት ጋር የሚያያይዘውን ተጨማሪ ሐሳብ ያስተላልፋል።
- source_word: συζήσομεν αὐτῷ
  choice: ከእርሱ ጋር ደግሞ እንኖራለን
  rationale: συζάω ከአንድ ሰው ጋር መኖርን ይገልጣል፤ የወደፊት ጊዜውም «እንኖራለን» በሚለው ቅርጽ በግልጽ ተጠብቋል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ክርክር ውስጥ እንደ ማዕረግ ስለሚሠራ «መሲሑ» በዋናው ጽሑፍ ተመርጧል። ሆኖም «ክርስቶስ» የሚለው የተለመደ ቅርጽ በእግር ማስታወሻ ተጠብቋል።
- issue: የσυζήσομεν αὐτῷ የወደፊት ሕይወት ባሕርይ
  choice: ከእርሱ ጋር ደግሞ እንኖራለን
  alternative: ከእርሱ ጋር የትንሣኤን ሕይወት እንካፈላለን
  rationale: ግሪኩ ከእርሱ ጋር ስለሚሆን የወደፊት ሕይወት ይናገራል፣ ነገር ግን እዚህ የሚፈጸምበትን ልዩ መንገድ አይገድብም። ትርጉሙም ይህን ስፋትና ሥነ መለኮታዊ ውጥረት ጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «እንኖራለን ብለን እናምናለን» የሚለው አወቃቀር የወደፊት ጊዜውን ግልጽ ሲያደርግ በአማርኛም ተፈጥሯዊ ነው።
