- issue: εἰς τὸν θάνατον የሚያመለክተው ሞት በግልጽ የመሲሑ ሞት ተብሎ መስፋፋት አለበት ወይስ የለበትም
  choice: በዋናው ጽሑፍ ‘ወደ ሞት’ ብሎ የግሪኩን አጭር አገላለጽ ማቆየት
