  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: am
  text: 'ስለዚህ፣ በጥምቀት ወደ ሞት[a] ከእርሱ ጋር ተቀበርን፤ ይህም መሲሕ በአብ ክብር ከሙታን እንደተነሣ፣ እኛም እንዲሁ በሕይወት አዲስነት እንድንመላለስ ነው።


    [a] ወይም፦ ክርስቶስ።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ ክርስቶስ።
    reason: Χριστός በዋናው ጽሑፍ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ ‘ክርስቶስ’ ደግሞ በተለመደ አጠቃቀም የሚገኝ አማራጭ ነው።
lexical_decisions:
- source_word: συνετάφημεν
  choice: ከእርሱ ጋር ተቀበርን
  rationale: የσυν-ን አብሮነት ‘ከእርሱ ጋር’ በሚለው ተፈጥሯዊ አገላለጽ ያስተላልፋል፤ የአኦሪስት ተደራጊ ቅርጹንም እንደ ተፈጸመ ድርጊት ያቀርባል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: διὰ τοῦ βαπτίσματος
  choice: በጥምቀት
  rationale: διά ከዘር ቅጽ ጋር የሚያሳየውን መሣሪያዊ ወይም አማካይነታዊ ግንኙነት ያቆያል፣ ነገር ግን ልዩ የሃይማኖት ሥርዓት ትርጓሜ አያስገባም።
- source_word: εἰς τὸν θάνατον
  choice: ወደ ሞት
  rationale: የεἰςን አቅጣጫዊ ኃይል በቀጥታ ይጠብቃል።
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: Χριστός በዚህ አውድ የማዕረግ ኃይሉን ስለሚይዝ ‘መሲሑ’ ተብሎ ተተርጉሟል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: ከሙታን መካከል መነሣትን በተፈጥሯዊና በተለመደ አማርኛ ይገልጻል።
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: በአብ ክብር
  rationale: የδιάን መሣሪያዊ አገልግሎትና የδόξαን ‘ክብር’ ትርጉም ይጠብቃል፤ ቃሉን ‘ኃይል’ ብሎ አያጠብም።
- source_word: ἐν καινότητι ζωῆς περιπατήσωμεν
  choice: በአዲስ ሕይወት እንድንመላለስ
  rationale: የπεριπατέωን የመመላለስ ምሳሌያዊ አገላለጽ ይጠብቃል፤ ‘በአዲስ ሕይወት’ ደግሞ የκαινότης ζωῆςን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: διὰ τοῦ βαπτίσματος የተወሰነ የጥምቀት አስተምህሮ እንዲያመለክት ማድረግ ወይም አለማድረግ
