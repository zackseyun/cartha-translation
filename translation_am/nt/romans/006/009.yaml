source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: am
  text: መሲሑ[a] ከሙታን ተነሥቶ ከእንግዲህ እንደማይሞት፣ ሞትም ከእንግዲህ በእርሱ ላይ እንደማይገዛ እናውቃለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ክርስቶስ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: እናውቃለን
  rationale: የግሪኩ ቦዝ አንቀጽ ተናጋሪዎቹ በጋራ የሚያውቁትን እውነት የቀደመውን ክርክር ለመደገፍ ያቀርባል። በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን በዋና ግስ ተተርጉሟል፤ የምክንያት ግንኙነቱ ግን በ“ስለምናውቅ” ተብሎ አልተወሰነም።
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: በዚህ አውድ Χριστός ትርጉም ያለው ማዕረግ ስለሆነ “መሲሑ” ተብሏል፤ “ክርስቶስ” የሚለው የተለመደ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐγερθεὶς
  choice: ተነሥቶ
  rationale: የትንሣኤውን ድርጊትና ከ“አይሞትም” በፊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: ከሞቱት መካከል መነሣትን የሚገልጸውን የግሪክ አገላለጽ በአጭርና በተለመደ መንገድ ያስተላልፋል።
- source_word: οὐκέτι
  choice: ከእንግዲህ
  rationale: በሁለቱም ቦታዎች ድርጊቱ ወይም ሥልጣኑ እንደማይደገም የሚያሳየውን የመጨረሻነት ኃይል ይጠብቃል።
- source_word: ἀποθνῄσκει
  choice: እንደማይሞት
  rationale: የአሁን ጊዜውን ቀጣይ እውነታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θάνατος
  choice: ሞት
  rationale: ስሙ በቀጥታ ተተርጉሞ በጳውሎስ አገላለጽ እንደ ገዢ ኃይል የቀረበበትን ሰውኛ ምስል ይጠብቃል።
- source_word: κυριεύει
  choice: በእርሱ ላይ እንደማይገዛ
  rationale: ግሱ የበላይነትንና የገዢነትን ሥልጣን ያመለክታል። “በ…ላይ መግዛት” ይህን ምስል በግልጽ ዘመናዊ አማርኛ ያቆያል።
theological_decisions:
- issue: በጳውሎስ ንግግር Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ ላይ እንደ ስም ብቻ ሳይሆን የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ ይሠራል። ስለዚህ የማዕረጉን ትርጉም የሚያስጠብቀው “መሲሑ” ተመርጧል፤ የተለመደው “ክርስቶስ” በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ቦዝ አንቀጽ በአማርኛ የተሟላ ሐረግ እንዲሆን “እናውቃለን” ተብሎ ቀርቧል፤ ሁለቱ ዋና አረፍተ ነገሮች በነጠላ ሰረዝ ተለይተው የመጀመሪያው አባባልና የሞት ገዢነት ምስል ተጠብቀዋል።
