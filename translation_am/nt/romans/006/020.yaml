  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: am
  text: የኃጢአት ባሪያዎች በነበራችሁ ጊዜ፣ ከጽድቅ[a][b] አንጻር ነጻ ነበራችሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከጽድቅ ነጻ ነበራችሁ።»
    reason: lexical_alternative
  - marker: b
    text: «ጽድቅ» ወይም «ፍትሕ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: በሮሜ 6 ያለውን የሁለት ተቃራኒ ጌቶች ባርነት ምስል በግልጽ ያስቀምጣል፤ «አገልጋዮች» የግዴታውንና የባለቤትነቱን ኃይል ሊያለዝብ ይችላል።
- source_word: ἁμαρτίας
  choice: ኃጢአት
  rationale: የግሪኩ የባለቤትነት ግንኙነት «የኃጢአት ባሪያዎች» በሚለው የአማርኛ አወቃቀር በተፈጥሮ ይገለጣል።
- source_word: ἐλεύθεροι
  choice: ነጻ
  rationale: ጳውሎስ በኃጢአት ባርነት ውስጥ ሳሉ ከጽድቅ አንጻር «ነጻ» እንደነበሩ የሚናገርበትን ሹልና አስገራሚ ተቃርኖ ይጠብቃል።
- source_word: τῇ δικαιοσύνῃ
  choice: ከጽድቅ አንጻር
  rationale: ዳቲቩን እንደ ማጣቀሻ ወይም አንጻር በመውሰድ የግሪኩን አሻሚነት ይጠብቃል፤ ጽድቅን እንደ ጨቋኝ ኃይል አያቀርብም።
- source_word: δικαιοσύνῃ
  choice: ጽድቅ
  rationale: በጳውሎሳዊው አጠቃቀም ውስጥ δικαιοσύνη የሚይዘውን ሰፊ የትክክለኛነትና በእግዚአብሔር ፊት የቀና ሁኔታ ትርጉም ይጠብቃል፤ «ፍትሕ» እንደ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: γὰρ
  choice: -ና
  rationale: የቁጥሩን ከቀደመው ሐሳብ ጋር ያለውን ማብራሪያዊ ግንኙነት በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር መጨረሻ ያሳያል።
theological_decisions:
- issue: ከጽድቅ ጋር ያለውን ግንኙነት በጳውሎስ ተቃርኖ ውስጥ እንዴት መግለጽ እንደሚገባ
  choice: ከጽድቅ አንጻር ነጻ ነበራችሁ
  alternative: ከጽድቅ ነጻ ነበራችሁ
  rationale: ይህ ንባብ ጽድቅን አሉታዊ አስገዳጅ ኃይል ሳያስመስል፣ በግሪኩ ያለውን የማጣቀሻ ወይም የመለየት አሻሚነትና የጳውሎስን ሥነ ምግባራዊ ተቃርኖ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ባሪያዎች» የጳውሎስን የባርነት ምስል ሆን ብሎ ይጠብቃል፤ «ከጽድቅ አንጻር» ደግሞ የግሪኩን የዳቲቭ ግንኙነት ያለ ትርጓሜያዊ ማጥበብ ያቀርባል።
