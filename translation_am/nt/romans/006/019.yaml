  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “የሰውነታችሁ ክፍሎች” ከጥንታዊው “ብልቶቻችሁ” ይልቅ የዘመኑን ግልጽነት ይሰጣል፤ “ባሪያዎች” ግን የምንጩን ጠንካራ ምስል ለመጠበቅ ተይዟል።
