  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: am
  text: ሥጋችሁ[a] ደካማ ስለሆነ፣ በሰው አነጋገር እናገራለሁ። ከዚህ በፊት የሰውነታችሁን ክፍሎች ለርኩሰትና ለዓመፅ ባሪያዎች አድርጋችሁ ወደ ዓመፅ የሚያመራ መልኩ እንዳቀረባችሁ፣ አሁንም የሰውነታችሁን ክፍሎች ለጽድቅ[b] ባሪያዎች አድርጋችሁ ለቅድስና አቅርቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሥጋ” የሚለው እዚህ ሰፋ ያለ ትርጉም አለው፤ አንዳንድ ጊዜ “ኃጢአተኛ ባሕርይ” ተብሎ በትርጓሜ ሊገለጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ፍትሕ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: በሰው አነጋገር እናገራለሁ
  rationale: የጳውሎስን ከሰው የዕለት ተዕለት ግንዛቤ ጋር የተስማማ አነጋገር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀσθένειαν
  choice: ደካማ
  rationale: አካላዊና ሥነ ምግባራዊ ውሱንነትን ሳያጠብ የግሪኩን ሰፊ ትርጉም ይጠብቃል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: ከ“ኃጢአተኛ ባሕርይ” ይልቅ የግሪኩን ሰፊና ያልተወሰነ አገላለጽ ይጠብቃል።
- source_word: παρεστήσατε / παραστήσατε
  choice: አቀረባችሁ / አቅርቧቸው
  rationale: በቀደመው ድርጊትና በአሁኑ ትእዛዝ መካከል ያለውን የግሥ ድግግሞሽ ይጠብቃል።
- source_word: μέλη
  choice: የሰውነታችሁን ክፍሎች
  rationale: በዘመናዊ አማርኛ ግልጽ ሲሆን የአካል ክፍሎችንና አቅሞችን የሚያመለክተውን ምሳሌያዊ አጠቃቀም ይይዛል።
- source_word: δοῦλα
  choice: ባሪያዎች
  rationale: በሮሜ 6 ያለውን የጌትነትና የታዛዥነት ጠንካራ የባርነት ምስል ሳያለዝብ ያስተላልፋል።
- source_word: ἀκαθαρσίᾳ
  choice: ርኩሰት
  rationale: የሥነ ምግባር ንጽሕና ማጣትን በተለመደና ክቡር አማርኛ ይገልጻል።
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: ዓመፅ / ዓመፅ
  rationale: በአማርኛ የሕግ ጥሰትንና አመንዝራነትን የሚያሳይ ተፈጥሯዊ ምርጫ ሲሆን የምንጩን ድግግሞሽ ይጠብቃል።
- source_word: εἰς τὴν ἀνομίαν
  choice: ከዓመፅ ወደ ዓመፅ እንድትሄዱ
  rationale: εἰς የሚያመለክተውን አቅጣጫና ውጤት በተፈጥሯዊ መንገድ ግልጽ ያደርጋል።
- source_word: δικαιοσύνῃ
  choice: ጽድቅ
  rationale: በጳውሎሳዊ አጠቃቀም ዋናውን ሥነ ምግባራዊና ግንኙነታዊ ሐሳብ ይይዛል፤ “ፍትሕ” በማስታወሻ ተጠብቋል።
- source_word: ἁγιασμόν
  choice: ቅድስና
  rationale: በአማርኛ ተፈጥሯዊና ለአንባቢ ግልጽ ሲሆን የመቀደስን ውጤትና አቅጣጫ በአውዱ ይገልጻል።
theological_decisions:
- issue: “የሥጋችሁ ድካም” በሚለው ሐረግ ውስጥ σάρξ የሚለውን መተርጎም
  choice: ሥጋ
  alternative: ኃጢአተኛ ባሕርይ
  rationale: ጥቅሱ በወደቀ ሰብአዊ ሕይወት ውስጥ ያለውን ድካም ሊያመለክት ቢችልም፣ ግሪኩ በግልጽ “ኃጢአተኛ ባሕርይ” ብሎ አይወስነውም።
- issue: δικαιοσύνη በጳውሎሳዊ አውድ መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ከርኩሰትና ከዓመፅ ጋር የተደረገው ሥነ ምግባራዊ ንጽጽር “ጽድቅ”ን ይደግፋል፤ ሕጋዊና ማኅበራዊ ገጽታው እንዳይጠፋ “ፍትሕ” በማስታወሻ ቀርቧል።
- issue: ἁγιασμός እንደ ሂደት ወይም ውጤት
  choice: ወደ ቅድስና እንድትደርሱ
  alternative: ለመቀደስ
  rationale: εἰς የሚያሳየውን አቅጣጫ/ውጤት ይጠብቃል፤ ቃሉ ሂደትንም ሆነ የተቀደሰ ሁኔታን ሊያካትት የሚችለውን ውጥረት አይዘጋም።
