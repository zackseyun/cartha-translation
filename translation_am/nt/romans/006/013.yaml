  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: am
  text: የሰውነታችሁንም ክፍሎች የኢ-ጽድቅ የጦር መሣሪያዎች[a] አድርጋችሁ ለኃጢአት አታቅርቡ፤ ይልቁንም ከሙታን መካከል ወደ ሕይወት እንደመጣችሁ ራሳችሁን ለእግዚአብሔር አቅርቡ፤ የሰውነታችሁንም ክፍሎች የጽድቅ[b] የጦር መሣሪያዎች አድርጋችሁ ለእግዚአብሔር አቅርቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መሣሪያዎች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም “ፍትሕ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: አታቅርቡ / አቅርቡ
  rationale: የግሱን ድግግሞሽና በኃጢአትና በእግዚአብሔር መካከል ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል።
- source_word: μέλη
  choice: የሰውነታችሁ ክፍሎች
  rationale: የጳውሎስን የአካል ክፍሎች ሐሳብ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὅπλα
  choice: የጦር መሣሪያዎች
  rationale: የግሪኩን የውጊያ ምስል ይጠብቃል፤ ሰፊው ትርጉም በእግር ማስታወሻ ቀርቧል።
- source_word: ἀδικίας
  choice: ዓመፅ
  rationale: ከጽድቅ ጋር ያለውን ሥነ ምግባራዊና ሥነ መለኮታዊ ተቃርኖ ይጠብቃል።
- source_word: ἁμαρτίᾳ
  choice: ኃጢአት
  rationale: ግሪኩን በቀጥታ ይከተላል፤ በአውዱ ያለውን የኃጢአት ሰውኛ አቀራረብም ክፍት ያደርገዋል።
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: ከሙታን መካከል ሕያዋን እንደሆናችሁ
  rationale: ὡσεὶ ያለውን የንጽጽር ኃይልና ከሞት ወደ ሕይወት የመሻገርን ምስል ያቆያል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በጳውሎሳዊ አውድ የቃሉን ሥነ ምግባራዊና ሥነ መለኮታዊ ስፋት ይጠብቃል፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: ኃጢአትና እግዚአብሔር እንደ ተቃራኒ ጌቶች የቀረቡበት ሁኔታ
  choice: ‘ለኃጢአት’ እና ‘ለእግዚአብሔር’ የሚሉት ቀጥተኛ ግንኙነቶች ተጠብቀዋል።
  alternative: ‘ኃጢአትን ለማገልገል’ እና ‘እግዚአብሔርን ለማገልገል’
  rationale: ግሪኩ አቅጣጫንና ታማኝነትን በቂ ሁኔታ ያመለክታል፤ ተጨማሪ ትርጓሜ ሳይገባ የሥነ መለኮት ኃይሉ ተጠብቋል።
- issue: ὡσεὶ የሚገልጸው ንጽጽርና የትንሣኤ ምስል
  choice: ‘ከሙታን መካከል ሕያዋን እንደሆናችሁ’
  alternative: ‘ከሞት ወደ ሕይወት እንደመጣችሁ’
  rationale: ዋናው ትርጉም የግሪኩን ምስልና አሻሚነት ይጠብቃል፤ የመንፈሳዊ ለውጥ ወይም የትንሣኤ አመልካችነቱን በአንድ ብቻ አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘የሰውነታችሁ ክፍሎች’ ከጥንታዊው ‘ብልቶቻችሁ’ ይልቅ ለዘመናዊ አንባቢ ግልጽ ነው፤ ‘ዓመፅ/ጽድቅ’ የሚለው ጥንድ ግን የክፍሉን ሥነ መለኮታዊ ክብደት ይጠብቃል።
