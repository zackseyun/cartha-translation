id: ROM.6.16
reference: Romans 6:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: am
  text: ራሳችሁን ለመታዘዝ ባሪያዎች አድርጋችሁ ለምትቀርቡለት፣ ለዚያ ለምትታዘዙለት ባሪያዎች እንደሆናችሁ አታውቁምን? ይኸውም ወደ ሞት የሚያደርስ የኃጢአት ባሪያዎች ወይም ወደ ጽድቅ[a] የሚያደርስ የመታዘዝ ባሪያዎች ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ፍትሕ።
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε
  choice: የምታቀርቡለት
  rationale: ‘ማቅረብ’ አንድ ሰው ራሱን በሌላው እጅ ሥር ለማዋል የሚያሳየውን ተጨባጭ ምስል ይጠብቃል፤ ‘ለ...’ ደግሞ የተቀባዩን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δούλους / δοῦλοί
  choice: ባሪያዎች
  rationale: ቃሉ የባለቤትነትና የግዴታ ተገዥነት ሁኔታን ያመለክታል፤ ‘አገልጋዮች’ ይህን ኃይለኛ ምስል ሊያለዝበው ይችላል።
- source_word: εἰς ὑπακοήν
  choice: ለመታዘዝ
  rationale: εἰς እዚህ የዓላማ አቅጣጫ አለው፤ ‘ለመታዘዝ’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ᾧ ὑπακούετε
  choice: የምትታዘዙለት
  rationale: የግሪኩን ዳቲቭ ግንኙነት በአማርኛው ‘ለ’ ይገልጻል፤ አውዱ ተገዥነት የሚቀበለውን እንደ ጌታ ሳይጨምር ያሳያል።
- source_word: ἁμαρτίας
  choice: ኃጢአት
  rationale: ግሪኩ በቀጥታ ‘ኃጢአት’ ይላል፤ ኃጢአትን እንደ ገዢ ኃይል የሚያቀርበው ሰውኛ አገላለጽ በባርነት ምስሉ እንዲገለጥ ተተው።
- source_word: εἰς θάνατον
  choice: ወደ ሞት የሚያደርስ
  rationale: የεἰςን አቅጣጫዊና ውጤታዊ ኃይል በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὑπακοῆς
  choice: መታዘዝ
  rationale: የስም ቅርጹንና ከ‘ኃጢአት’ ጋር ያለውን ትይዩ ንፅፅር ይጠብቃል።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: ‘ጽድቅ’ የጳውሎስን ሰፊ ሥነ መለኮታዊና ሥነ ምግባራዊ አጠቃቀም ይጠብቃል፤ ‘ፍትሕ’ ሕጋዊና ማኅበራዊ ገጽታውን ብቻ ሊያጎላ ስለሚችል በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በጳውሎስ የንፅፅር አውድ δικαιοσύνηን መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: አውዱ ኃጢአት ወደ ሞት ሲያደርስ፣ መታዘዝ ወደ δικαιοσύνη የሚያደርስ መሆኑን ያነጻጽራል። ‘ጽድቅ’ ይህን ሥነ ምግባራዊና ሥነ መለኮታዊ ስፋት ይጠብቃል፤ ‘ፍትሕ’ ግን ትክክለኛ የቃል አማራጭ ስለሆነ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘ባሪያ’ ድግግሞሽ የግሪኩን የገዢነትና የተገዥነት ምስል ለማቆየት ሆን ተብሎ ተጠብቋል።
