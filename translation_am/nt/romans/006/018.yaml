review_pass:
  verdict: revise
  source_fidelity: The first participial clause accurately conveys release from sin, but the main verb ἐδουλώθητε is aorist passive ('you were enslaved/made slaves'), whereas ባሪያዎች ሆናችሁ more naturally means 'having become slaves' and does not clearly retain the passive action. The revised wording explicitly represents both aorist passive forms.
  naturalness: ከኃጢአት ነፃ ሆናችሁ is natural modern standard Amharic. ለጽድቅ ባሪያዎች ተደረጋችሁ is idiomatic enough in this elevated biblical register and clearly preserves the force of the slavery metaphor.
  terminology: ኃጢአት, ጽድቅ, and ባሪያዎች are appropriate and preserve the Pauline personification and the unsoftened δουλόω metaphor. ፍትሕ remains a suitable lexical-alternative footnote for δικαιοσύνη.
  issues:
  - severity: medium
    issue: The rendering ባሪያዎች ሆናችሁ does not explicitly express the passive voice of ἐδουλώθητε.
    rationale: The Greek says that the addressees were acted upon ('were enslaved/made slaves'), not merely that they came to be slaves. Since Amharic can express this directly with ተደረጋችሁ, the passive should be retained in the main text rather than relegated to a footnote.
  revised_text: ከኃጢአትም ነፃ ሆናችሁ፣ ለጽድቅ[a] ባሪያዎች ተደረጋችሁ[b]።
  revised_footnotes:
