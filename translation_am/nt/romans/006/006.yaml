    rationale: The Greek presents the crucifixion first, followed by the ἵνα purpose and then the τοῦ μηκέτι infinitival result/purpose. Restoring that sequence improves optimal-equivalence fidelity and avoids making the logical flow less clear.
  - severity: medium
    issue: “ይህን እናውቃለን” turns γινώσκοντες into an independent indicative clause.
    rationale: A participial form such as “ይህን እያወቅን” better retains the Greek participle's connective force.
