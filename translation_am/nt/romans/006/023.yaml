  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: am
  text: የኃጢአት ደመወዝ ሞት ነውና፤ የእግዚአብሔር ስጦታ[a] ግን በጌታችን በመሲሕ ኢየሱስ ውስጥ የዘላለም ሕይወት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የጸጋ ስጦታ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: ደመወዝ
  rationale: ቃሉ ለተሠራ ሥራ የሚከፈልን ዋጋ ያመለክታል፤ «ደመወዝ» ከስጦታ ጋር ያለውን የጳውሎስን ንፅፅር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἁμαρτίας
  choice: የኃጢአት
  rationale: የግሪኩን የባለቤትነት/የዝምድና ግንኙነት በአጭርና በግልጽ መንገድ ይጠብቃል።
- source_word: θάνατος
  choice: ሞት
  rationale: ቀጥተኛውን ትርጉምና ሥነ መለኮታዊ ክብደቱን ያለ ተጨማሪ ትርጓሜ ያስቀምጣል።
- source_word: χάρισμα
  choice: ስጦታ
  rationale: ከተገኘ ደመወዝ ጋር ያለውን ንፅፅር በተፈጥሯዊ ቋንቋ ይገልጣል፤ በቃሉ ውስጥ ያለው የጸጋ ሐሳብ በማስታወሻው ተገልጧል።
- source_word: ζωὴ αἰώνιος
  choice: የዘላለም ሕይወት
  rationale: የጊዜ ቀጣይነቱንና የሐረጉን ሥነ መለኮታዊ አጠቃቀም የሚጠብቅ የተለመደ አማርኛ ነው።
- source_word: ἐν
  choice: ውስጥ
  rationale: የሉልነትን ወይም ከመሲሑ ጋር ያለን ኅብረት የሚያሳየውን የጳውሎስ አገላለጽ ይጠብቃል፤ ወደ «በኩል» ብቻ አያጠበውም።
- source_word: Χριστῷ
  choice: በመሲሕ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግን ስለሚይዝ «መሲሕ» ተብሎ ተተርጉሟል።
- source_word: κυρίῳ
  choice: በጌታችን
  rationale: የግሪኩን የእምነት አዋጅና ሥነ መለኮታዊ ክብደት ይጠብቃል።
theological_decisions:
- issue: የἐν Χριστῷ Ἰησοῦ ኃይል
  choice: «በመሲሕ ኢየሱስ ውስጥ»
  alternative: «በመሲሕ ኢየሱስ በኩል»
  rationale: ἐν በዚህ ስፍራ መንገድን ብቻ ሳይሆን ሉልነትን ወይም ኅብረትንም ሊገልጥ ይችላል፤ «ውስጥ» ይህን የጳውሎስ ሥነ መለኮታዊ ውጥረት ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሴሚኮሎኑ በ«ደመወዝ» እና «ስጦታ» መካከል ያለውን ጠንካራ ንፅፅር ያሳያል።
