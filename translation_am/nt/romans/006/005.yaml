language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: am
  text: ከእርሱ ጋር ሞቱን በሚመስል መልክ አንድ ሆነን ከሆነ[a]፣ በእርግጥ ትንሣኤውንም በሚመስል መልክ ከእርሱ ጋር አንድ እንሆናለን[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእርሱ ጋር በሞቱ ምሳሌ አብረን አድገን ከሆነ»።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «የትንሣኤም እንሆናለን»፤ «ከእርሱ ጋር አንድ» እና «በሚመስል መልክ» የሚሉት ሐሳቦች ከመጀመሪያው ክፍል ይሟላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: ከእርሱ ጋር አንድ ሆነን
  rationale: ቃሉ አብሮ ማደግን ወይም በሕይወት የተሳሰረ አንድነትን ሊያመለክት ይችላል። «ከእርሱ ጋር አንድ ሆነን» የግንኙነቱን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል፤ የ«አብረን አድገን» አማራጭም በማስታወሻ ተጠብቋል።
- source_word: γεγόναμεν
  choice: ሆነን ከሆነ
  rationale: የግሪኩ ፍጹም ጊዜ ቀድሞ የተፈጠረና አሁንም ውጤቱ የሚኖር ሁኔታን ያሳያል፤ ይህ አገላለጽ በአማርኛ የሁኔታውን ዘላቂነት በተፈጥሮ ያቀርባል።
- source_word: τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ
  choice: ሞቱን በሚመስል ሞት
  rationale: ὁμοίωμα ያለውን «መመሳሰል/አምሳያ» ሐሳብ ሳያጠፋ፣ የዳቲቭን ትክክለኛ ዝምድና በተነባቢ አማርኛ ያቀርባል።
- source_word: ἀλλὰ καὶ
  choice: በእርግጥ ... ም
  rationale: የሁለተኛውን ክፍል አጽንዖትና ወደ ላይ የሚያድግ ንጽጽር ያሳያል።
- source_word: τῆς ἀναστάσεως ἐσόμεθα
  choice: ትንሣኤውንም በሚመስል ትንሣኤ ... ከእርሱ ጋር አንድ እንሆናለን
  rationale: ግሪኩ በሁለተኛው ክፍል የመጀመሪያውን መስተዋድድና σύμφυτοιን በዝምታ ይሸከማል። አማርኛው ለግልጽነት ይህን ሐሳብ ይደግማል፣ የግሪኩ አጭር አወቃቀር ግን በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ከክርስቶስ ጋር ያለውን አንድነት ከግሪኩ በላይ ምሥጢራዊ፣ ሥርዓተ እምነታዊ ወይም ዘይቤያዊ አድርጎ መወሰን
  choice: «ሞቱን በሚመስል ሞት ከእርሱ ጋር አንድ ... ትንሣኤውንም በሚመስል ትንሣኤ ... አንድ» የሚለውን ሚዛን መጠበቅ
  alternative: «ከሞቱና ከትንሣኤው ጋር ተዋሕደናል» ወይም «የሞቱንና የትንሣኤውን ንድፍ ተከትለናል»
  rationale: ጥቅሱ እውነተኛ ተሳትፎን ሲገልጥ ὁμοίωμα በሚለው ቃል የመመሳሰልንም ገደብ ይጠብቃል። ትርጉሙ ይህን ውጥረት ሳይፈታ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ትንሣኤ» የተለመደውን መጽሐፍ ቅዱሳዊ ክብር ይጠብቃል።
