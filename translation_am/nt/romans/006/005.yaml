  to: ከእርሱ ጋር ሞቱን በሚመስል መልክ አንድ ሆነን ከሆነ[a]፣ በእርግጥ ትንሣኤውንም በሚመስል መልክ ከእርሱ ጋር አንድ እንሆናለን[b]።
