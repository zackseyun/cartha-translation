  text: አሁን ግን፣ ከኃጢአት ነፃ ወጥታችሁ ለእግዚአብሔርም ባሪያዎች ሆናችሁ፣ ለቅድስና[a] የሚያደርስ ፍሬ አላችሁ፤ ፍጻሜውም[b] የዘላለም ሕይወት ነው።
