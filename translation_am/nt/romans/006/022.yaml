lexical_decisions:
- source_word: νυνὶ δέ
  choice: አሁን ግን
  rationale: የቀድሞውን ሁኔታ ከአሁኑ ጋር የሚያነጻጽረውን ጠንካራ ሽግግር በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: ከኃጢአት ነፃ ወጥታችሁ
  rationale: የተቀበሉትን የተፈጸመ ነፃ መውጣት ያሳያል፤ ነጠላው ‘ኃጢአት’ም ኃጢአትን እንደ ገዢ ኃይል ሊያመለክት የሚችለውን አገላለጽ ይጠብቃል።
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: ለእግዚአብሔር ባሪያዎች ከሆናችሁ በኋላ
  rationale: δουλόω ያለውን ጠንካራ የባርነት ምስል ሳያለዝብ ይጠብቃል፤ ተገብሮ ቅርጹንም ‘ሆናችሁ’ በሚለው ተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: ያላችሁ ፍሬ
  rationale: καρπός የሚለውን የግብርና ምሳሌ ከ‘ጥቅም’ ወይም ‘ውጤት’ ይልቅ በቀጥታ ይጠብቃል።
- source_word: εἰς ἁγιασμόν
  choice: ወደ ቅድስና ይመራል
  rationale: εἰς የሚያሳየውን አቅጣጫና ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ቅድስና’ ἁγιασμόςን ለተራ አንባቢ በግልጽ ሁኔታ ይገልጻል።
- source_word: τὸ δὲ τέλος
  choice: ፍጻሜውም
  rationale: τέλος የመጨረሻ ግብን ወይም ውጤትን የሚያመለክተውን ክፍትነት በአጭር እና ክብር ባለው ቃል ይጠብቃል።
- source_word: ζωὴν αἰώνιον
  choice: የዘላለም ሕይወት
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደና ትክክለኛ አተረጓጎም ነው።
theological_decisions:
- issue: ከእግዚአብሔር ጋር ያለው የባርነት ምስል
  choice: ‘ለእግዚአብሔር ባሪያዎች’ በማለት ጠንካራውን ምስል ማቆየት
  alternative: ‘የእግዚአብሔር አገልጋዮች’ ወይም ‘ለእግዚአብሔር የተሰጣችሁ’
  rationale: ሮሜ 6 ለኃጢአት ባሪያ መሆንን ለእግዚአብሔር ባሪያ ከመሆን ጋር ሆን ብሎ ያነጻጽራል፤ ምስሉን ማለዘብ የጳውሎስን ክርክር ያዳክማል።
- issue: የἁγιασμός ሂደት/ሁኔታ ክፍትነት
  choice: ‘ወደ ቅድስና’
  alternative: ‘ለመቀደስ’
  rationale: ‘ቅድስና’ የተቀደሰ ሁኔታን ሊያመለክት ሲችል፣ ‘ለመቀደስ’ ደግሞ ሂደቱን ይበልጥ ያጎላል፤ አማራጩ በማስታወሻ ተጠብቋል።
- issue: የτέλος ትርጉም
  choice: ‘ፍጻሜው’
  alternative: ‘የመጨረሻው ውጤት’
  rationale: የግብና የመጨረሻ ውጤት ሁለቱንም የትርጉም ገጽታዎች ሳይወስን ያቆያል፤ ግልጽ የውጤት ንባቡ በማስታወሻ ቀርቧል።
