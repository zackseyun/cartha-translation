  terminology: “ኃጢአት,” “ባሪያዎች,” “ቅድስና,” “ፍጻሜ,” and “የዘላለም ሕይወት” are suitable modern-standard, biblically recognizable terms. “ባሪያዎች” appropriately preserves the deliberately strong δουλόω metaphor without doctrinal softening.
  issues:
