  source_fidelity: The draft retains the contrast, the singular collective sense of sin, the slavery imagery, the fruit metaphor, sanctification, and eternal life. However, “ለእግዚአብሔር ባሪያዎች ከሆናችሁ በኋላ” introduces a conditional sense (“if/after you became”) not present in the two coordinated Greek participles. The phrasing of the fruit clause is also less direct than ἔχετε.
