  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: am
  text: ሞቱን ለኃጢአት[a] አንድ ጊዜ ለዘላለም ሞቷልና፤ የሚኖረውን ሕይወት ግን ለእግዚአብሔር ይኖራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ ኃጢአት» ወይም «ከኃጢአት አንጻር»።
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: እርሱ የሞተው ሞት ... ሞቷልና
  rationale: ገለልተኛው አንጻራዊ ተውላጠ ስም ከተደገመው ግስ ጋር የሞቱን ክስተት ያመለክታል፤ ይህ አገላለጽ የግሪኩን አጽንዖት እና γάρ የሚያሳየውን ምክንያታዊ ትስስር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τῇ ἁμαρτίᾳ
  choice: ለኃጢአት
  rationale: የመድረሻ አመልካቹን የግንኙነት ወይም የአቅጣጫ ፍቺ ይጠብቃል፣ ከ«ለእግዚአብሔር» ጋር ያለውንም ትይዩነት ያስቀራል። በአማርኛ ግን «ስለ ኃጢአት» የሚለውን ፍቺም ሊያሰማ ስለሚችል አማራጮቹ በማስታወሻ ተገልጠዋል።
- source_word: ἐφάπαξ
  choice: አንድ ጊዜ ለዘላለም
  rationale: አንድ ጊዜ ብቻ የተፈጸመና የማይደገም ድርጊት መሆኑን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὃ δὲ ζῇ
  choice: አሁን የሚኖረውንም ሕይወት
  rationale: ከመጀመሪያው ክፍል ጋር ያለውን የሞትና የሕይወት ትይዩነት ይጠብቃል፤ «አሁን» በዐውዱ ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ከ«ለኃጢአት» ጋር ያለውን ሰዋሰዋዊና ሥነ ንግግራዊ ሚዛን በመጠበቅ ሕይወቱ ወደ እግዚአብሔር ያቀና መሆኑን ያሳያል።
theological_decisions:
- issue: τῇ ἁμαρτίᾳ የሚለው ሐረግ ክርስቶስ የግል ኃጢአት እንዳለበት እንዳያስመስል እንዴት መተርጎም እንዳለበት
  choice: ለኃጢአት
  alternative: ስለ ኃጢአት፤ ከኃጢአት አንጻር
  rationale: ዋናው ንባብ የግሪኩን «ለኃጢአት / ለእግዚአብሔር» ተቃርኖ ይጠብቃል። ሐረጉን በትርጓሜ በመዝጋት ፋንታ ከኃጢአት ጋር ያለውን ግንኙነት በእውነተኛ አሻሚነቱ ያቆያል፤ አማራጭ ፍቺዎችም በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሞት ... ሞቷል» እና «ሕይወት ... ይኖራል» የሚሉት ትይዩ አገላለጾች የግሪኩን አወቃቀርና አጽንዖት ይጠብቃሉ።
