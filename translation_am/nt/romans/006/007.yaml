  rationale: ἀπό መለየትን ወይም ነፃ መሆንን ያመለክታል። “ከኃጢአት” ተፈጥሯዊ ሲሆን ኃጢአትን ለግል በደል ብቻ ወይም ለገዢ ኀይል ብቻ አይገድበውም።
