  choice: አሳልፎ የተሰጣችሁለትን
  rationale: የግሪኩን ተደራጊ አነጋገርና አማኞች ለትምህርቱ እንደተላለፉ የሚያሳየውን አስገራሚ ምስል ይጠብቃል።
- source_word: εἰς ὃν
  choice: የተሰጣችሁለትን
