- source_word: ἐκ καρδίας
  choice: ከልባችሁ
  rationale: የκαρδίαን ተጨባጭ ምስልና የውስጥ ቅን መታዘዝን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τύπον διδαχῆς
  choice: የትምህርት ንድፍ
  rationale: τύπος ቅርጽ፣ ንድፍ ወይም መለኪያ ሊያመለክት ስለሚችል፣ ‘ንድፍ’ የሚለው ቃል ምስሉን ሳያጠፋ የአስተምህሮውን ተቀርጾ የቀረበ ይዘት ያሳያል።
