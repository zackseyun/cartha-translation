  rationale: በዚህ አገባብ χάρις ረቂቅ ‘ጸጋ’ን ሳይሆን ለእግዚአብሔር የሚቀርብ ምስጋናን ያመለክታል፤ δέ ደግሞ ተቃርኖውን ‘ነገር ግን’ በማለት ይጠብቃል።
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: የኃጢአት ባሪያዎች
