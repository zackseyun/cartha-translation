- issue: παρεδόθητεን ትምህርቱ ለአማኞች እንደተሰጠ አድርጎ ማዋቀር ወይም አማኞች ለትምህርቱ እንደተሰጡ ማቆየት
  choice: አሳልፎ የተሰጣችሁለትን የትምህርት ንድፍ
  alternative: ለእናንተ የተሰጠውን ትምህርት
  rationale: የግሪኩ ሰዋስው አማኞቹን የተደራጊው ርዕሰ ጉዳይ ያደርጋል። ትርጉሙ ይህን ምስል አልገለበጠውም።
