  text: ነገር ግን ለእግዚአብሔር ምስጋና ይሁን! ቀድሞ የኃጢአት ባሪያዎች ብትሆኑም፣ ለዚያ አሳልፎ ለተሰጣችሁት የትምህርት ንድፍ[a] ከልብ ታዘዛችሁ።[b]
  philosophy: optimal-equivalence
  footnotes:
