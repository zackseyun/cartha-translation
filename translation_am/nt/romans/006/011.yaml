  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: am
  text: 'እንዲሁም እናንተ ራሳችሁን ለኃጢአት እንደ ሞታችሁ፣ ለእግዚአብሔር ግን በመሲሕ ኢየሱስ[c] ሕያዋን[b] እንደሆናችሁ ቁጠሩ[a]።


    [a] ወይም፣ “እንደሆናችሁ አስቡ” ወይም “እንደሆናችሁ ተመልከቱ”።


    [b] ወይም፣ “ለእግዚአብሔር የምትኖሩ”።


    [c] ግሪክኛው “በክርስቶስ ኢየሱስ” ይላል፤ “መሲሕ” የግሪክኛው Χριστός ማዕረግ ትርጉም ነው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደሆናችሁ አስቡ” ወይም “እንደሆናችሁ ተመልከቱ”።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለእግዚአብሔር የምትኖሩ”።
    reason: lexical_alternative
  - marker: c
    text: ግሪክኛው “በክርስቶስ ኢየሱስ” ይላል፤ “መሲሕ” የግሪክኛው Χριστός ማዕረግ ትርጉም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: እንዲሁም
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የድምዳሜና የንጽጽር ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: λογίζεσθε
  choice: ቁጠሩ
  rationale: አንድን ነገር እውነት እንደሆነ መቁጠርን ወይም እንደዚያ መመልከትን የሚገልጸውን የግሪክኛውን የአእምሮ ግምገማ ኃይል ይጠብቃል።
- source_word: ἑαυτοὺς
  choice: ራሳችሁን
  rationale: በግሪክኛው በግልጽ የተጠቀሰውን ተመላሽ ተውላጠ ስም ይጠብቃል።
- source_word: εἶναι
  choice: እንደሆናችሁ
  rationale: ከ‘ቁጠሩ’ ጋር ተፈጥሯዊ የአማርኛ አገባብ በመፍጠር በግሪክኛው ያለውን ‘መሆን’ በግልጽ ያስተላልፋል።
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: ለኃጢአት የሞታችሁ
  rationale: የዳቲቭን ግንኙነት ‘ለኃጢአት’ በማለት ይጠብቃል፤ μέν እና δέ የሚፈጥሩት ተቃርኖ ‘ግን’ በሚለው ቃል በሁለተኛው ሐረግ ተገልጿል።
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: ለእግዚአብሔር ግን … ሕያዋን
  rationale: ከ‘የሞታችሁ’ ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል፤ የቃል በቃል አማራጩ ‘የምትኖሩ’ በማስታወሻ ተጠቅሷል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: ἐνን ‘በ’ በማለት የጳውሎስን በመሲሑ ውስጥ የመሆን ወይም የሕይወት ክበብ ቋንቋ ሳይፈታ ይጠብቃል፤ Χριστόςን እዚህ እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል።
theological_decisions:
- issue: Χριστῷ እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ Χριστός የተቀባውን ንጉሥ የሚያመለክተውን የማዕረግ ኃይል እንደያዘ ተተርጉሟል፤ የተለመደው የድምፅ ዝውውር ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- issue: ἐν Χριστῷ Ἰησοῦ የሚገልጸው ግንኙነት
  choice: በመሲሑ ኢየሱስ
  alternative: በመሲሑ ኢየሱስ በኩል / በመሲሑ ኢየሱስ ምክንያት
  rationale: ‘በኩል’ ወይም ‘ምክንያት’ ብሎ በመፍታት የመሣሪያነትን ወይም የምክንያትነትን ትርጉም ብቻ አይጭንም፤ የግሪክኛውን ሰፊ እና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘ሞት/ሕያውነት’ ተቃርኖና ‘በመሲሑ’ የሚለው ክፍት ሥነ መለኮታዊ አገላለጽ ተጠብቀዋል።
