  text: ኃጢአት በእናንተ ላይ አይገዛምና፤[a] ምክንያቱም እናንተ ከሕግ በታች[b] ሳትሆኑ ከጸጋ በታች ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእናንተ ላይ ሥልጣን አይኖረውም።”
    reason: lexical_alternative
  - marker: b
    text: “ከሕግ በታች” ማለት በሕግ ሥልጣን ወይም አገዛዝ ሥር መሆንን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: ኃጢአት
  rationale: የግሪኩን መደበኛ ትርጉም ይጠብቃል፤ በዐውዱ ኃጢአት እንደ ገዥ ኃይል ተዋሕዶ ቢቀርብም ተጨማሪ ትርጓሜ አልተጫነበትም።
- source_word: κυριεύσει
  choice: በእናንተ ላይ አይገዛም
  rationale: ጌትነትን ወይም ሥልጣንን መጠቀም የሚለውን ፍቺ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል፤ ኃጢአትንም እንደ ገዥ የሚያቀርበውን ምስል ይጠብቃል።
- source_word: ὑπὸ νόμον
  choice: ከሕግ በታች
  rationale: ከሕግ ሥልጣን ወይም አገዛዝ በታች መሆንን የሚገልጠውን የጳውሎስን አገላለጽ በቅርብ ይይዛል።
- source_word: χάριν
  choice: ጸጋ
  rationale: በጳውሎስ የሕግና የጸጋ ንጽጽር ውስጥ የተለመደውንና ሥነ መለኮታዊ ክብደቱን የሚጠብቀውን ቃል ይጠቀማል።
- source_word: γὰρ … γάρ
  choice: -ና፤ … እንጂ
  rationale: የመጀመሪያው γὰρ ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ትስስር በ“-ና” ያሳያል፤ ሁለተኛው γάρ በሕግና በጸጋ መካከል ባለው ንጽጽር ውስጥ የማብራሪያ ኃይሉ በአማርኛው አጠቃላይ አወቃቀር ተገልጧል።
theological_decisions:
- issue: ኃጢአትን እንደ ገዥ ኃይል የማቅረቡን ሰውኛ አነጋገር ምን ያህል ግልጽ ማድረግ እንዳለበት
  choice: “ኃጢአት በእናንተ ላይ አይገዛም” ብሎ የግዛትን ምስል ማቆየት
  alternative: “ኃጢአት አይገዛችሁም” ወይም “ኃጢአት ጌታችሁ አይሆንም”
  rationale: ግሪኩ ኃጢአትን እንደ ገዥ ኃይል ያቀርባል፤ የተመረጠው አገላለጽ ይህን ምስል ሳያጠናክር ወይም ወደ አንድ የተወሰነ ዶክትሪናዊ ትርጓሜ ሳይወስድ ይጠብቃል።
- issue: “ὑπὸ νόμον” የሚለውን የሕግ አገዛዝ በትርጉሙ ውስጥ ማብራራት ወይስ በግርጌ ማስታወሻ መግለጥ
  choice: በዋናው ጽሑፍ “ከሕግ በታች” ብሎ ማቆየትና ፍቺውን በግርጌ ማብራራት
  alternative: “በሕግ ሥልጣን ሥር” ብሎ በዋናው ጽሑፍ መተርጎም
  rationale: ይህ የጳውሎስን አጭርና ጥቅጥቅ ያለ አገላለጽ ይጠብቃል፤ አገላለጹ የሥልጣን ወይም የአገዛዝ ግንኙነትን እንደሚያመለክት ግን ለአንባቢው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሕግና የጸጋ ትይዩነት ተጠብቋል፤ የግርጌ ምልክቶቹም ከሚያብራሩት ክፍል ቀጥለው ተቀምጠዋል።
