- source_word: ἐροῦμεν
  choice: ምን እንበል?
  rationale: የወደፊት ጊዜ የምክክር ጥያቄውን በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
- source_word: ἐπιμένωμεν
  choice: መኖራችንን እንቀጥልን?
  rationale: የአሁን ጊዜ ንዑስ ግስ የሚያመለክተውን ቀጣይነት እና ስለሚታሰብ ድርጊት የቀረበውን የምክክር ጥያቄ ይጠብቃል።
- source_word: τῇ ἁμαρτίᾳ
  choice: በኃጢአት
  rationale: ከἐπιμένωμεν ጋር ያለው የዳቲቭ አገባብ በኃጢአት ሁኔታ ወይም ልማድ ውስጥ መቆየትን ያመለክታል፤ «በኃጢአት መኖር» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἵνα
  choice: እንዲ
  rationale: በጥያቄው የቀረበውን ዓላማ ወይም የታሰበ ውጤት በግልጽ ያሳያል።
- source_word: ἡ χάρις
  choice: ጸጋ
  rationale: በጳውሎስ ክርክር ውስጥ የእግዚአብሔርን በጎ ስጦታና ሞገስ የሚወክል የተለመደና ትክክለኛ ቃል ነው።
- source_word: πλεονάσῃ
  choice: እንዲበዛ
  rationale: በመጠን ወይም በስፋት መጨመርን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የጳውሎስ ጥያቄ ፈቃድን፣ ግዴታን ወይም ተራ ትንበያን እንደሚገልጽ መቅረጽ
  choice: ስለታሰበ ሥነ ምግባራዊ አካሄድ የሚጠይቅ የምክክር ጥያቄ፦ «በኃጢአት መኖራችንን እንቀጥልን?»
  alternative: «በኃጢአት መኖር እንቀጥል?» ወይም «በኃጢአት እንኑርን?»
  rationale: የግሪኩ ንዑስ ግስ ስለቀረበ የድርጊት አካሄድ የሚጠይቅ ንግግራዊ ጥያቄ ነው። ይህ አተረጓጎም ሥነ ምግባራዊ ክብደቱን ሳይደብቅ ተጨማሪ የእምነት ትምህርት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጸጋ» የተለመደውን መጽሐፍ ቅዱሳዊ ክብር ይጠብቃል፤ «መኖራችንን እንቀጥልን?» ደግሞ የቀጣይ ልማድንና የምክክር ጥያቄውን በተፈጥሯዊ አነጋገር ያሳያል።
