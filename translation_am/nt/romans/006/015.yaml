  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: am
  text: እንግዲህስ ምን? ከሕግ በታች ሳይሆን ከጸጋ በታች ስለሆንን ኃጢአት እንሥራ?[a] ፈጽሞ አይሁን![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ኃጢአት ልንሠራ ነው?»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በፍጹም አይደለም!»
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: እንግዲህ ምን እንበል?
  rationale: የጳውሎስን የክርክር ሽግግር በተፈጥሯዊ አማርኛ ያሳያል። ቃል በቃል «እንግዲህ ምን?» ማለት ቢቻልም፣ «ምን እንበል?» በአማርኛ የአጻጻፉን የክርክር ቅርጽ በግልጽ ያቀርባል።
- source_word: ἁμαρτήσωμεν
  choice: ኃጢአት እንሥራ?
  rationale: የመጀመሪያ ሰው ብዙ ቁጥር የውይይት ጥያቄን ያስተላልፋል፤ ሐሳቡ ኃጢአትን እንደ አንድ እውነተኛ አማራጭ አቅርቦ ወዲያው መካድ ነው።
- source_word: ὅτι
  choice: ስለሆንን
  rationale: ጥያቄው የሚያቀርበውን ምክንያት፣ ማለትም ከሕግ በታች አለመሆንንና ከጸጋ በታች መሆንን፣ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὑπὸ νόμον
  choice: ከሕግ በታች
  rationale: በግሪክ ያለውን አጠቃላይ የሕግ አገላለጽ ይጠብቃል፤ «ከሙሴ ሕግ በታች» ብሎ ትርጉሙን አያጠብም።
- source_word: ὑπὸ χάριν
  choice: ከጸጋ በታች
  rationale: χάριςን በተለመደውና ትክክለኛው «ጸጋ» ተርጉሞ፣ ከሕግ ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: የግሪኩን ጠንካራ የክህደት አገላለጽ በክብር ያለውና ለዘመናዊ አንባቢ ግልጽ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: በጳውሎስ ንጽጽር ውስጥ νόμος የሚያመለክተው ወሰን
  choice: «ሕግ» ተብሎ በአጠቃላይ ተተርጉሟል።
  alternative: «የሙሴ ሕግ» ወይም የተወሰነ ሕግ
  rationale: ግሪኩ መስተዋድድ የሌለው νόμον ይጠቀማል። ዋናው ጽሑፍ የሕጉን ወሰን በትርጓሜ ቀድሞ እንዳይወስን፣ የጳውሎስን ሥነ መለኮታዊ ውጥረት ጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ሕግ/ጸጋ» የሚለው ትይዩ አገላለጽ ተጠብቋል፤ የግሪኩ ጠንካራ ክህደትም በ«ፈጽሞ አይሁን!» ተላልፏል።
