- source_word: διδάσκαλον
  choice: መምህር
  rationale: የቃሉ መደበኛ ትርጉም ሲሆን ከ«አስተማሪ» ጋር ያለውን የግሪኩን ትይዩ ግንባታም ይጠብቃል።
- source_word: νηπίων
  choice: ሕፃናት
