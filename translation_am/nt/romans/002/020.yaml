lexical_decisions:
- source_word: παιδευτὴν
  choice: አስተማሪ
  rationale: ቃሉ ማሠልጠንን፣ ማስተማርንና ሥነ ምግባር ማስያዝን ሊያመለክት ይችላል፤ «አስተማሪ» በዐውዱ ያለውን የትምህርት ጉራ በተፈጥሯዊ አማርኛ ያቀርባል።
