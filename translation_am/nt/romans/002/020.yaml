  alternative: «የእውቀትና የእውነት ቅርጽ»
  rationale: ግሪኩ ቃል አዎንታዊ «ተጨባጭ መገለጫ» ወይም ቀላል «ቅርጽ» ሊሆን ይችላል። ትርጉሙ የጳውሎስን ሙግት አስቀድሞ ሳይወስን ሁለቱንም ዕድሎች ይጠብቃል።
