  rationale: የግሪኩን አሁናዊ ባለቤትነት በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል፤ ከቀደመው ሁለተኛ መደብ ነጠላ አድራሻ ጋርም ይገናኛል።
- source_word: μόρφωσιν
  choice: ተጨባጭ መልክ
  rationale: ቃሉ «ቅርጽ/መልክ» ወይም «ተጨባጭ መገለጫ» ሊሆን ይችላል። «ተጨባጭ መልክ» ሕጉ እውቀትንና እውነትን በሚታይ መልክ እንደሚያቀርብ ያሳያል፤ የ«ቅርጽ» አማራጭ በማስታወሻ ተጠብቋል።
- source_word: γνώσεως
  choice: እውቀት
  rationale: የቃሉ ቀጥተኛና ተፈጥሯዊ አቻ ሲሆን ከ«እውነት» ጋር ያለውን ጥምረት ይጠብቃል።
