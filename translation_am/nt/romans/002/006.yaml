translation:
  language: am
  text: እርሱም ለእያንዳንዱ እንደ ሥራዎቹ[a][b] ይከፍላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደ ተግባሮቹ»።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ «የእርሱ» የሚል ተባዕታይ ነጠላ ቅርጽ አለው፤ እዚህ ግን በወካይነት «የእያንዳንዱ ሰው» ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: እርሱም
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው አውድ ወደ ተጠቀሰው እግዚአብሔር ይመለሳል፤ በአማርኛ የንግግር ፍሰቱን ለማስጠበቅ «እርሱም» ተመርጧል።
- source_word: ἀποδώσει
  choice: ይከፍለዋል
  rationale: ግሱ በፍርድና በዋጋ መመለስ አውድ የሚገባውን መመለስ ወይም መክፈል ያመለክታል፤ «ይከፍለዋል» ይህን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἑκάστῳ
  choice: ለእያንዳንዱ
  rationale: የነጠላ አከፋፋይ አጽንዖቱን ይጠብቃል፤ ፍርዱ ለየግለሰቡ መሆኑን ያሳያል።
- source_word: κατὰ
  choice: እንደ
  rationale: እዚህ የመለኪያን ወይም የመመዘኛን ግንኙነት ያሳያል፤ «እንደ» አጭር፣ ግልጽና ተፈጥሯዊ ነው።
- source_word: τὰ ἔργα
  choice: ሥራው
  rationale: «ሥራ» የἔργον ቀጥተኛ አቻ ሲሆን በጳውሎሳዊ አጠቃቀም ያለውን የቃል ወጥነት ይጠብቃል፤ የግሪኩ ብዙ ቁጥር በአማርኛ ከአከፋፋዩ «እያንዳንዱ» ጋር በተፈጥሯዊ ሁኔታ በነጠላ የወል ስም ተገልጧል።
- source_word: αὐτοῦ
  choice: -ው (ሥራው)
  rationale: የግሪኩን ተወካይ ተባዕታይ ነጠላ ቅርጽ በቅርብ ይከተላል፤ ትርጉሙ ግን የእያንዳንዱን ሰው ሥራ ያመለክታል።
theological_decisions:
- issue: በሥራ መሠረት የሚሰጥ ፍርዳዊ ክፍያ
  choice: «እንደ ሥራው ይከፍለዋል» የሚለውን ቀጥተኛ የፍርድና የዋጋ መመለስ አገላለጽ ማቆየት
  alternative: «እንደ ሥራው ያደርግበታል» ወይም «ይሸልመዋል» ብሎ ማለዘብ
  rationale: ጥቅሱ በሥራ መሠረት የሚደረግን ክፍያ በግልጽ ይናገራል፤ ከሌሎች የጳውሎስ ስለ ጽድቅ ንግግሮች ጋር በትርጉሙ ውስጥ በማስማማት ይህን ውጥረት ማለዘብ አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ይከፍለዋል» ፍርዳዊውን የመመለስ ኃይል ሳያጠፋ ተፈጥሯዊ ነው።
