lexical_decisions:
- source_word: οἴδαμεν
  choice: እናውቃለን
  rationale: οἶδα ፍጹም ቅርጽ ቢኖረውም አሁናዊ ትርጉም ስላለው፣ ቀጥተኛና ተፈጥሯዊው አማርኛ አቻ ይህ ነው።
- source_word: δέ
