review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys God''s judicial judgment, its adverse direction toward those concerned, and the truth-conformity expressed by κατὰ ἀλήθειαν. However, the participial phrase is awkwardly formed in Amharic: «በሚያደርጉት ላይ» leaves the agent insufficiently explicit and can momentarily suggest that the preceding things, rather than people, are the object of the judgment.'
  naturalness: A clearer modern-standard Amharic construction is to use «በሚያደርጉ ሰዎች ላይ». Rendering κατὰ ἀλήθειαν as «በእውነት መሠረት» is idiomatic while retaining the source's explicit reference to truth.
  terminology: «የእግዚአብሔር ፍርድ» appropriately renders τὸ κρίμα τοῦ θεοῦ. «በእውነት መሠረት» avoids reducing the phrase to merely «በትክክል» and preserves the theological and judicial force of ἀλήθεια.
  issues:
  - severity: medium
    issue: The phrase «እንደዚህ ያሉትን ነገሮች በሚያደርጉት ላይ» is grammatically and stylistically unclear.
    rationale: The source refers to people who practice such things (τοὺς ... πράσσοντας), not to the things themselves. Adding «ሰዎች» and using the standard relative form «በሚያደርጉ ሰዎች ላይ» makes the referent and the judicial direction explicit without adding meaning.
  - severity: low
    issue: «ከእውነት ጋር የሚስማማ» is accurate but somewhat periphrastic in the main text.
    rationale: «በእውነት መሠረት» is a more direct and idiomatic formal Amharic equivalent of κατὰ ἀλήθειαν; the fuller explanatory wording can be retained in the note.
  revised_text: እኛም የእግዚአብሔር ፍርድ እንደዚህ ያሉ ነገሮችን በሚያደርጉ ሰዎች ላይ በእውነት መሠረት እንደሆነ እናውቃለን።[a]
