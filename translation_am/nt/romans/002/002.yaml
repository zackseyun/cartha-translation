  rationale: δέ እዚህ ጠንካራ ተቃርኖን ሳይሆን የንግግር ቀጣይነትን ያመለክታል፤ ዐውዱን የማያደበዝዝ ተፈጥሯዊ አማርኛ ለማቅረብ በተለየ ቃል አልተተረጎመም።
- source_word: κρίμα
  choice: ፍርድ
  rationale: ቃሉ የእግዚአብሔርን የዳኝነት ፍርድ ያመለክታል፤ «ፍርድ» ውጤቱን ወደ «ኩነኔ» ሳያጠብ ሰፊ ትርጉሙን ይጠብቃል።
- source_word: κατὰ ἀλήθειαν
  choice: ከእውነት ጋር የሚስማማ
  rationale: ሐረጉ ፍርዱ ከእውነት ወይም ከነገሩ እውነተኛ ሁኔታ ጋር መጣጣሙን ይገልጣል። ይህ አገላለጽ «በትክክል» ከሚለው ይበልጥ የἀλήθειαን ግልጽ ይዘት ይጠብቃል።
- source_word: ἐπὶ
  choice: በ...ላይ
  rationale: በዳኝነት ዐውድ ፍርዱ ወደ ሚደርስባቸው ሰዎች መቅናቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ τοιαῦτα
  choice: እንደዚህ ያሉትን ነገሮች
  rationale: በቀደመው ዐውድ የተጠቀሱትን አድራጎቶች የሚመለከተውን ገለልተኛ ብዙ ቁጥር ሐረግ በግልጽ ያስተላልፋል።
- source_word: πράσσοντας
  choice: በሚያደርጉት
  rationale: የአሁን ጊዜ ቦዝ አንቀጹ ቀጣይ ወይም ባሕርይ የሆነ ድርጊትን ሊያመለክት ይችላል፤ አማርኛው ይህን የተደጋጋሚ አድራጊነት በዐውዱ ያስተላልፋል።
theological_decisions:
- issue: κατὰ ἀλήθειαν በትርጉም የበለጠ አብራሪ በሆነ «በትክክል» ይቅረብ ወይስ የ«እውነት»ን ቃል በግልጽ ይጠብቅ?
  choice: ከእውነት ጋር የሚስማማ
  alternative: በትክክል፤ እንደ እውነት
  rationale: የጳውሎስን የሥነ ምግባርና የዳኝነት አጽንዖት ሳያጠብ፣ መለኮታዊው ፍርድ ከእውነትና ከነገሩ እውነተኛ ሁኔታ ጋር መጣጣሙን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የአረፍተ ነገር ትኩረት በተፈጥሯዊ አማርኛ የቃላት ቅደም ተከተል ቀርቧል።
