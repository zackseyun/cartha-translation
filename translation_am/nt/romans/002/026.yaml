language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: am
  text: ስለዚህ ያልተገረዘ ሰው ሕጉ የሚጠይቀውን ቢጠብቅ፣ አለመገረዙ እንደ መገረዝ አይቆጠርለትምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ስለዚህ አለመገረዝ የሕጉን መስፈርቶች ቢጠብቅ፣ አለመገረዙ እንደ መገረዝ አይቈጠርምን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: ያልተገረዘ ሰው / አለመገረዙ
  rationale: የግሪኩ ስም ቃል በቀጥታ ‘አለመገረዝ’ ማለት ቢሆንም፣ በመጀመሪያው አጠቃቀም ሰውን ይወክላል፤ αὐτοῦ (‘የእርሱ’) የሚለውም ይህን ያጠናክራል። በአማርኛ ተፈጥሯዊነትንና የመነሻውን የቃል ድግግሞሽ ለማቆየት በመጀመሪያ ‘ያልተገረዘ ሰው’፣ በኋላ ‘አለመገረዙ’ ተብሏል።
- source_word: δικαιώματα
  choice: ሕጉ የሚጠይቀውን
  rationale: ብዙ ቁጥር ያለው ቃል ሕጉ የሚያዘውን ወይም የሚጠይቀውን ያመለክታል። ‘ሕጉ የሚጠይቀውን’ ዘመናዊና ግልጽ ሲሆን በግሪኩ ያልተገለጸ ተጨማሪ አጽንዖት አያስገባም።
- source_word: νόμου
  choice: ሕጉ
  rationale: በዐውደ ንባቡ የሙሴን ሕግ ያመለክታል፤ በአማርኛ ከδικαιώματα ጋር ‘ሕጉ የሚጠይቀውን’ የሚለው ተፈጥሯዊ ነው።
- source_word: φυλάσσῃ
  choice: ቢጠብቅ
  rationale: ‘መጠበቅ’ ትእዛዝን ወይም ሕግን መፈጸም በሚለው መጽሐፍ ቅዱሳዊና ተለምዷዊ አማርኛ ተገቢ ነው።
- source_word: λογισθήσεται
  choice: አይቆጠርለትምን?
  rationale: ‘መቈጠር’ የግሪኩን የሂሳብና የመቈጠር ምስል ያቆያል። ‘-ለት’ የሚለው ቅጥ ነገሩ ለዚያ ሰው እንደ መገረዝ መቈጠሩን በተፈጥሮ ያሳያል።
- source_word: εἰς περιτομήν
  choice: እንደ መገረዝ
  rationale: እዚህ εἰς የሁኔታ ወይም የምድብ ትርጉም አለው፤ ‘እንደ መገረዝ’ ያልተገረዘ ሁኔታው በመገረዝ ምድብ እንደሚቈጠር ያስተላልፋል።
- source_word: οὐχ
  choice: አይ...ምን?
  rationale: οὐχ አዎንታዊ መልስን የሚጠብቅ አሉታዊ ጥያቄ ይጀምራል። የአማርኛው ‘አይ...ምን?’ ቅርጽ ይህን የንግግር ኃይል ይጠብቃል።
theological_decisions:
- issue: ያልተገረዘው ሰው ማንነትና ሕጉን የመጠበቁ ወሰን
  choice: ጥቅሱ እንደሚለው ሁኔታዊ አገላለጽ ሆኖ ተተርጉሟል፤ ሰውየው አሕዛብ መሆኑ ወይም ሕጉን ሙሉ በሙሉ መፈጸሙ በትርጉሙ ውስጥ አልተጨመረም።
  alternative: ‘አሕዛብ ሕጉን ሁሉ ቢፈጽሙ’ በማለት ግልጽ ማድረግ።
  rationale: የግሪኩ ጽሑፍ ἀκροβυστία እና ἐὰν የሚሉትን ብቻ ይጠቀማል፤ የሰውየውን ማንነት ወይም የመታዘዙን ፍጹምነት በትርጉም መወሰን የጽሑፉን ሥነ መለኮታዊ ውጥረት ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሕግን መጠበቅ’ እና ‘መቈጠር’ የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ አገላለጾች ሲሆኑ ጥንታዊ ወይም ከልክ በላይ ቴክኒካዊ ቃና የላቸውም።
