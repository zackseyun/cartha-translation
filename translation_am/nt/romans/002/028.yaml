  rationale: የግሪክ አነጋገር ውጫዊውንና ውስጣዊውን ይነጻጽራል፤ የአይሁድን ማንነት ምድብ በሙሉ አያጠፋም። “እውነተኛ” የሚለው በግሪኩ የተዘለለውን ስም ለአማርኛ ግልጽነት ይሞላል፣ ነገር ግን የቃሉ ገደብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሐረግ ስምን በመዝለሉ በአማርኛ አሻሚ እንዳይሆን “አይሁዳዊነት” እና “እውነተኛ ግርዛት” ተሞልተዋል፤ ቃል በቃል አማራጩ በእግር ማስታወሻ ቀርቧል።
