  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: am
  text: 'ምክንያቱም በውጭ[a] አይሁዳዊ የሆነ አይሁዳዊ አይደለም፤ በሥጋ[b] በውጭ የሆነ ግርዛትም ግርዛት አይደለም።


    [a] “በውጭ” የሚለው “በሚታየው” ወይም “በውጫዊ ሁኔታ” ተብሎም ሊተረጎም ይችላል።


    [b] “በሥጋ” የሚለው አካላዊ ግርዛትን ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
