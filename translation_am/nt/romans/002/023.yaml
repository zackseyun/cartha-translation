review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the rhetorical second-person question, the boasting 'in the law,' and the means expressed by διὰ τῆς παραβάσεως τοῦ νόμου. The proposed revision retains these correspondences.
  naturalness: “እግዚአብሔርን ታዋርዳለህን?” is understandable, but it is less idiomatic and can suggest lowering God rather than bringing dishonor upon him. “ክብር ታሳጣዋለህን?” is natural modern standard Amharic for the intended sense.
  terminology: “ሕጉ” appropriately retains the contextual definiteness of νόμος without adding “የሙሴ.” “እግዚአብሔር” is a standard reverent biblical equivalent for θεός. “ክብር ማሳጣት” accurately conveys ἀτιμάζω without imposing theological interpretation.
  issues:
  - severity: low
    issue: The rendering of ἀτιμάζεις is slightly unnatural in context.
    rationale: “ታዋርዳለህ” is intelligible but is not the most idiomatic way to say that one dishonors God. A formulation with “ክብር ማሳጣት” better expresses the source verb’s sense of dishonoring.
  revised_text: በሕጉ የምትመካ አንተ፣ ሕጉን በመተላለፍህ[a] እግዚአብሔርን ክብር ታሳጣዋለህን?
  revised_footnotes:
