  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: am
  text: በሕጉ የምትመካ አንተ፣ ሕጉን በመተላለፍህ[a] እግዚአብሔርን ክብር ታሳጣዋለህን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕጉን በመጣስህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: በሕጉ
  rationale: የግሪኩን ἐν የቦታ/የመሠረት አገላለጽ በቀጥታ ይጠብቃል፤ በዐውዱም የተወሰነውን የአይሁድ ሕግ ያመለክታል።
- source_word: καυχᾶσαι
  choice: የምትመካ
  rationale: የጳውሎስን ወቃሽ ንግግርና ሰውየው በሕጉ ላይ የሚያደርገውን ትምክህት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: ሕጉን በመተላለፍህ
  rationale: διὰ የሚገልጠውን መንገድ/ምክንያት እና παράβασις የሚያመለክተውን ድንበር ማለፍ በተፈጥሯዊ አማርኛ ይገልጣል፤ የሁለተኛ መደብ ነጠላ ቅርጹም በ“-ህ” ተጠብቋል።
- source_word: τὸν θεὸν
  choice: እግዚአብሔርን
  rationale: በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደ፣ ግልጽና ክቡር የθεός አተረጓጎም ነው።
- source_word: ἀτιμάζεις
  choice: ታዋርዳለህን?
  rationale: “ክብር ማሳጣት” የሚለውን ዋና ትርጉም ይይዛል፤ የግሪኩን የክስ መልክ ያለው ጥያቄም ይጠብቃል።
theological_decisions:
- issue: νόμος በጳውሎስ ክርክር
  choice: ሕጉ
  alternative: የሙሴ ሕግ
  rationale: ዐውዱ የአይሁድን ሕግ በግልጽ ቢያመለክትም፣ ግሪኩ “የሙሴ” የሚለውን ስም አልጨመረም። ስለዚህ ትርጉሙ የተገለጠውን ብቻ ይይዛል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አንተ” የሚለው ተውላጠ ስም የግሪኩን ὃς የአጽንዖት ኃይል ለማሳየት ተካቷል።
