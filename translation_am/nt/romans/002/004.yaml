  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: am
  text: ወይስ የእርሱን የቸርነት፣ የታጋሽነትና የትዕግሥት ብዛት ትንቃለህ? የእግዚአብሔር ቸርነት ወደ ንስሐ እየመራህ እንደሆነ አታውቅምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ቸርነት» የሚለው በሁለቱም ስፍራዎች «መልካምነት» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: ብዛት
  rationale: የግሪኩን የተትረፈረፈ ሀብት ዘይቤያዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «ሀብት» ቀጥተኛ አማራጭ ቢሆንም ከሦስቱ ባሕርያት ጋር «ብዛት» ይበልጥ ተፈጥሯዊ ነው።
- source_word: χρηστότητος / τὸ χρηστόν
  choice: ቸርነት
  rationale: በሁለቱም ስፍራዎች የቃሉን ወጥነት ይጠብቃል፤ በዐውዱም የእግዚአብሔርን ደግና ለሰው የሚያዝን አያያዝ በግልጽ ያሳያል።
- source_word: ἀνοχῆς
  choice: ታጋሽነት
  rationale: ፍርድን በመግታት ወይም በመዘግየት የመታገሥን ሐሳብ ያስተላልፋል፤ ከμακροθυμία ጋርም የተወሰነ የቃላት ልዩነት ይጠብቃል።
- source_word: μακροθυμίας
  choice: ትዕግሥት
  rationale: ለረጅም ጊዜ ቁጣን በመግታት መታገሥን በዘመናዊና ክቡር አማርኛ ይገልጻል።
- source_word: καταφρονεῖς
  choice: ትንቃለህ
  rationale: የግሪኩን ጠንካራ የወቀሳ ኃይል በአጭርና ቀጥተኛ መንገድ ይጠብቃል።
- source_word: ἀγνοῶν
  choice: አታውቅምን?
  rationale: የተያያዘውን ተሳቢ አገላለጽ በተፈጥሯዊ የአማርኛ የአጻጻፍ ሥርዓት ወደ ጥያቄው ያዋህዳል፤ ሆን ብሎ ችላ ማለትን አያስገባም።
- source_word: εἰς μετάνοιάν
  choice: ወደ ንስሐ
  rationale: εἰς ያለውን አቅጣጫዊ ኃይል ይጠብቃል፤ «ንስሐ» ደግሞ μετάνοιαን በተለመደ፣ በግልጽና በሥነ መለኮት ያልጠበበ መንገድ ያስተላልፋል።
- source_word: ἄγει
  choice: እየመራህ እንደሆነ
  rationale: የአሁን ጊዜውን ቀጣይ ድርጊትና ወደ ንስሐ የሚያመራውን አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: χρηστότης / χρηστόνን «ቸርነት» ወይም «መልካምነት» ብሎ መተርጎም
  choice: በሁለቱም ስፍራዎች «ቸርነት»
  alternative: በአንዱ ወይም በሁለቱም ስፍራዎች «መልካምነት»
  rationale: ዐውዱ ኃጢአተኛውን ወዲያው ካለመቅጣት ጋር የተገለጠውን የእግዚአብሔር ደግ አያያዝ ያጎላል፤ «ቸርነት» ይህን ግላዊና ግንኙነታዊ ኃይል በተሻለ ሁኔታ ያስተላልፋል።
- issue: ἄγει የሚለው መለኮታዊ እርምጃ የግድ ውጤት እንደሚያስከትል መግለጽ ወይም አቅጣጫውን ብቻ መጠበቅ
  choice: «ወደ ንስሐ እየመራህ» በማለት የጽሑፉን አቅጣጫዊና ቀጣይ ድርጊት መጠበቅ
  alternative: «ንስሐ እንድትገባ ያደርግሃል» በማለት ውጤቱን አስገዳጅ አድርጎ መግለጽ
  rationale: ግሪኩ መምራትን ይናገራል እንጂ በዚህ ጥቅስ የመጨረሻውን የሰው ምላሽ አይወስንም፤ ትርጉሙ ይህን የሥነ መለኮት ውጥረት ክፍት ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አንድ ረጅም የንግግር ጥያቄ ለአማርኛ ንባብ ግልጽነት በሁለት ተያያዥ ጥያቄዎች ቀርቧል፤ የወቀሳው ኃይልና ምክንያታዊ ግንኙነቱ ተጠብቋል።
