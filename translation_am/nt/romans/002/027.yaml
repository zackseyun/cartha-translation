  text: በተፈጥሮው ያልተገረዘ ሰው[a] ሕጉን ቢፈጽም፣ የተጻፈው ሕግና ግርዛት እያለህ ሕግን የምትተላለፍ አንተን ይፈርድብሃል።[b]
  philosophy: optimal-equivalence
  footnotes:
