- source_word: νόμον
  choice: ሕጉን / ሕግን
  rationale: በዐውዱ የሙሴን ሕግ የሚያመለክት የታወቀ ሕግ ነው፤ የመጀመሪያው መጠቀሻ በውስን ቅጽ “ሕጉን” ተተርጉሟል።
- source_word: διὰ γράμματος
  choice: የተጻፈው ሕግ … እያለህ
  rationale: γράμμα በዚህ ሥፍራ የሕጉን የጽሑፍ ቅርጽ ያመለክታል። διὰ እዚህ የሰውየውን ጥቅም ወይም የተሰጠውን መንገድ ስለሚጠቁም፣ በተፈጥሯዊ አማርኛ “እያለህ” ተብሎ ቀርቧል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: περιτομῆς
