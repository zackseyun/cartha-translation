  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: am
  text: “አታመንዝር” የምትል አንተ፣ ታመነዝራለህን? ጣዖታትን የምትጸየፍ አንተ፣ የጣዖት ቤቶችን ትዘርፋለህን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በሰፊው፣ “ቅዱስ ነገርን ታረክሳለህን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: የምትል አንተ
  rationale: በግሪኩ ያለው አመልካች ከአሁን ጊዜ አካፋይ ጋር ሆኖ አንድን ተወካይ ሰው በቀጥታ ይጠራል፤ ይህ አተረጓጎም የጳውሎስን ቀጥተኛ የክርክር ንግግር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μὴ μοιχεύειν
  choice: አታመንዝር
  rationale: μή ከግስ ስም ጋር የተነገረውን የክልከላ ይዘት ያሳያል፤ “አታመንዝር” ቀጥተኛ፣ ግልጽና የተለመደ አማርኛ ነው።
- source_word: μοιχεύεις
  choice: ታመነዝራለህን?
  rationale: የአሁን ጊዜ አመልካች ግስ በአጠቃላይ የወቀሳ ኃይል ባለው የንግግር ጥያቄ ቀርቧል፤ የአማርኛው አሁን ጊዜ ይህን ይጠብቃል።
- source_word: ὁ βδελυσσόμενος
  choice: የምትጸየፍ አንተ
  rationale: βδελύσσομαι ከፍተኛ ጥላቻና እርኩስ ነው ብሎ መራቅን ያመለክታል፤ “መጸየፍ” በአማርኛ ይህን ኃይል በክቡርና ተፈጥሯዊ አነጋገር ያስተላልፋል።
- source_word: τὰ εἴδωλα
  choice: ጣዖታትን
  rationale: በዚህ አውድ εἴδωλα ለአምልኮ የተዘጋጁ ምስሎችን ወይም ጣዖታትን ያመለክታል፤ “ጣዖታት” ግልጽና የተለመደው ቃል ነው።
- source_word: ἱεροσυλεῖς
  choice: ቤተ ጣዖት ትዘርፋለህን?
  rationale: ἱεροσυλέω በቀጥተኛ ትርጉሙ ቤተ መቅደስን ወይም ንብረቱን መዝረፍን ያመለክታል። በአማርኛ “ቤተ መቅደስ” የእስራኤልን ቤተ መቅደስ ሊያስመስል ስለሚችል፣ ከጣዖታት ጋር ያለውን አውድ ግልጽ ለማድረግ “ቤተ ጣዖት” ተመርጧል፤ ሰፊው የቅድስና መድፈር ትርጉም በማስታወሻ ተጠብቋል።
