- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: በልባቸው እንደተጻፈ
  rationale: የውስጣዊ ጽሑፍን ምሳሌያዊ አነጋገር በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: ሕሊናቸውም አብሮ ይመሰክራል
  rationale: συν- የሚያመለክተውን አብሮ የመመስከር ሐሳብ በግልጽ ሁኔታ ያስተላልፋል።
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: ሐሳቦቻቸውም እርስ በርሳቸው
  rationale: የግሪኩን የመደጋገፍ ወይም የመተያየት አነጋገር ሳያስወግድ የአገባቡን ጥቅጥቅነት ይጠብቃል።
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: ይከሷቸዋል ወይም ደግሞ ይከላከሉላቸዋል
  rationale: κατηγορέωን ‘መክሰስ’፣ ἀπολογέομαιን ደግሞ ‘መከላከል’ ብሎ ይተረጉማል፤ ‘ደግሞ’ የἢ καὶን አጽንዖት ያንጸባርቃል።
theological_decisions:
- issue: ጳውሎስ በአጠቃላይ ውስጣዊ የሥነ ምግባር ግንዛቤን ወይስ በተለይ ‘ሕጉ የሚጠይቀውን’ ማመልከቱ
  choice: በዋናው ጽሑፍ ‘የሕጉ ሥራ’ የሚለውን አነስተኛ ትርጓሜ የተጨመረበት አገላለጽ ማቆየት
  alternative: ‘ሕጉ የሚጠይቀው’ ወይም ‘የሕጉ መስፈርት’
  rationale: የግሪኩ አገላለጽ አጭርና ከአማራጮቹ ያነሰ ገላጭ ነው፤ ቀጥተኛውን አገላለጽ ማቆየት ያለውን ሥነ መለኮታዊ ውጥረት አስቀድሞ አይፈታውም።
- issue: ‘ሐሳቦች’ እርስ በርሳቸው ይከሳሉ/ይከላከላሉ ወይስ ሰዎቹን ይከሳሉ/ይከላከላሉ
  choice: ሐሳቦቹ ሰዎቹን እንደሚከሱ ወይም እንደሚከላከሉላቸው በግስ ቅጥያው ማሳየት፣ የἀλλήλωνን ተደጋጋፊ ሐሳብ ግን በጽሑፉ ማቆየት
  alternative: ሐሳቦቹ እርስ በርሳቸውን ይከሳሉ ወይም ይከላከላሉ
  rationale: ይህ ንባብ የሐሳቦቹን ውስጣዊ መስተጋብር እያቆየ፣ የክሱና የመከላከያው ተቀባዮች በአውዱ ያሉት ሰዎች መሆናቸውን ያሳያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ይጠቀማል። ‘ሕሊና’ በዚህ አውድ የσυνείδησιςን የሥነ ምግባር ምስክርነት በተለመደ መንገድ ያስተላልፋል፤ ሰዋሰዋዊው ጥቅጥቅነት በሰሚኮሎኖች ተከፍሎ ተነባቢነቱ ተጠብቋል።
