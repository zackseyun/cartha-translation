  rationale: የግሱን ማስረጃ ሰጪ ኃይል ሳያጋንን፣ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τὸ ἔργον τοῦ νόμου
  choice: የሕጉ ሥራ
