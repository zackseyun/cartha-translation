  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: am
  text: እነርሱ የሕጉ ሥራ[a] በልባቸው ተጽፎ መኖሩን ያሳያሉ፤ ሕሊናቸውም አብሮ ሲመሰክር፣ ሐሳቦቻቸውም እርስ በርሳቸው[b] ሲከሱ ወይም ደግሞ ሲከላከሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕጉ የሚጠይቀው” ወይም “የሕጉ መስፈርት።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አገላለጽ ቃል በቃል “እርስ በርሳቸው” የሚል ተደጋጋፊ ሐሳብ አለው። የሐሳቦቹ መካከል ያለውን ውስጣዊ ክስ ወይም መከላከል በአጭር ሰዋሰዋዊ አገላለጽ ያቀርባል።
    reason: alternative_reading
