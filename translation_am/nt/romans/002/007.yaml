review_pass:
  verdict: revise
  source_fidelity: The draft correctly carries forward the governing verb from Romans 2:6 and preserves the conditional relationship without doctrinal expansion. However, it renders ἀφθαρσίαν (“incorruptibility/imperishability”) as “the life that does not perish,” which adds “life” and obscures the Greek three-item series before ζωὴν αἰώνιον (“eternal life”).
  naturalness: The revised wording is natural, formal modern standard Amharic. “መልካም ሥራን በጽናት በመሥራት” clearly expresses persevering in doing good.
  terminology: δόξα and τιμή should be distinguished as “ክብር” and “ማዕረግ/ክብር” rather than “ውዳሴ” (praise). Here “ክብርንና ማዕረግን” maintains the distinction. “አለመጥፋትን” appropriately represents ἀφθαρσίαν without duplicating “ሕይወት.”
  issues:
  - severity: high
    issue: ἀφθαρσίαν is rendered as “የማይጠፋውን ሕይወት.”
    rationale: The source lists glory, honor, and imperishability as three objects sought, followed by eternal life as the result. Adding “ሕይወት” to ἀφθαρσίαν conflates the third object with ζωὴν αἰώνιον and weakens the source structure.
  - severity: medium
    issue: τιμή is rendered “ውዳሴ.”
    rationale: “ውዳሴ” principally means praise, whereas τιμή here is honor. “ማዕረግ” naturally preserves the distinct sense alongside “ክብር.”}],
  - severity: low
    issue: The expression for persevering good work is somewhat awkward.
    rationale: Recasting it as doing good work with perseverance is clearer while retaining the same meaning.
  revised_text: መልካም ሥራን በጽናት በመሥራት ክብርንና ማዕረግን እንዲሁም አለመጥፋትን ለሚፈልጉ የዘላለም ሕይወትን ይሰጣቸዋል።
  revised_footnotes: []
  revision_rationale: 'The revision restores the Greek sequence: those who seek glory, honor, and imperishability through persevering good work receive eternal life. It retains the explicitly supplied Amharic verb, whose antecedent is Romans 2:6, and does not resolve or alter the verse’s theological formulation.'
