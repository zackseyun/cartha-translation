revisions:
- from: በመልካም ሥራ በመጽናት ክብርን፣ ውዳሴንና የማይጠፋውን ሕይወት ለሚፈልጉ የዘላለም ሕይወትን ይሰጣቸዋል።
  to: መልካም ሥራን በጽናት በመሥራት ክብርንና ማዕረግን እንዲሁም አለመጥፋትን ለሚፈልጉ የዘላለም ሕይወትን ይሰጣቸዋል።
  rationale: 'The revision restores the Greek sequence: those who seek glory, honor, and imperishability through persevering good work receive eternal life. It retains the explicitly supplied Amharic verb, whose antecedent is Romans 2:6, and does not resolve or alter the verse’s theological formulation.'
  reviewer_model: gpt-5.6-terra
