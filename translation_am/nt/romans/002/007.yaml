  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: am
  text: መልካም ሥራን በጽናት በመሥራት ክብርንና ማዕረግን እንዲሁም አለመጥፋትን ለሚፈልጉ የዘላለም ሕይወትን ይሰጣቸዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: በመልካም ሥራ በመጽናት
  rationale: የጽናትን ቀጣይነትና ከመልካም ሥራ ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δόξαν καὶ τιμὴν
  choice: ክብርን፣ ውዳሴን
  rationale: ሁለቱን የግሪክ ቃላት ሳያዋህድ፣ δόξαን እንደ ክብር፣ τιμήንም እንደ ውዳሴ ለይቶ ያቀርባል።
- source_word: ἀφθαρσίαν
  choice: የማይጠፋውን ሕይወት
  rationale: ቃሉ መበስበስንና ጥፋትን የማያይ ሁኔታን ያመለክታል፤ በአማርኛ ግልጽ እንዲሆን ተተርጉሟል።
- source_word: ζωὴν αἰώνιον
  choice: የዘላለም ሕይወትን
  rationale: የተለመደ፣ ግልጽና የምንጩን ዘላለማዊ ሕይወት ትርጉም የሚጠብቅ አገላለጽ ነው።
theological_decisions:
- issue: የዘላለም ሕይወትና የመልካም ሥራ ግንኙነት
  choice: የጽሑፉን ቀጥተኛ ሁኔታዊ አገላለጽ ማቆየት
  alternative: የመልካም ሥራን ሚና በትርጓሜያዊ ቃላት ማብራራት ወይም ማለዘብ
  rationale: ጥቅሱ በመጽናት መልካም የሚያደርጉትንና የዘላለም ሕይወትን በቀጥታ ያገናኛል፤ ትርጉሙ ይህን ሥነ-መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
- issue: ያልተገለጸው ዋና ግስ
  choice: ከቁጥር 6 የሚገባውን ‘ይሰጣቸዋል’ ማሟላት
  alternative: ጥቅሱን እንደ ሐረግ ብቻ መተው
  rationale: የግሪኩ አወቃቀር ከቀዳሚው ቁጥር ግስ ይቀበላል፤ ለተፈጥሯዊና ሙሉ የአማርኛ ዓረፍተ ነገር ግሱ በግልጽ ተሟልቷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ትይዩ ዝርዝርና የጽናት ሐሳብ ተጠብቋል።
