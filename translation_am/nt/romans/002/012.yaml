  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: am
  text: ምክንያቱም ሕግ ሳይኖራቸው[a] ኃጢአት የሠሩ ሁሉ፣ ሕግ ሳይኖራቸው ደግሞ ይጠፋሉ፤ በሕግ ሥር ሆነው[b] ኃጢአት የሠሩ ሁሉ ደግሞ፣ በሕግ አማካኝነት[c] ይፈረድባቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሕግ ሳይኖራቸው” የሚለው ለሁለቱም አጋጣሚዎች “ከሕግ ውጭ” ወይም “ያለ ሕግ” ተብሎም ሊተረጎም ይችላል።
