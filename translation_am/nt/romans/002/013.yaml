source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: am
  text: ሕጉን የሚሰሙት በእግዚአብሔር ፊት ጻድቃን አይደሉምና፤ ነገር ግን ሕጉን የሚፈጽሙት ጻድቃን ተብለው ይቆጠራሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይጸደቃሉ”፤ ወይም፣ “ትክክል መሆናቸው ይረጋገጣል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: የሚሰሙት
  rationale: የግሪኩን ‘ሰሚዎች’ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ከ‘የሚፈጽሙት’ ጋር ያለውን ተቃርኖም ይጠብቃል።
- source_word: νόμου
  choice: ሕግን
  rationale: በዐውዱ የተጠቀሰውን ሕግ በተፈጥሯዊ አማርኛ ያመለክታል፤ ከ‘መስማት’ና ከ‘መፈጸም’ ጋር ቀጥተኛ ተሳቢ ሆኖ ቀርቧል።
- source_word: δίκαιοι
  choice: ጻድቃን
  rationale: የጽድቅን ፍቺ እና በሮሜ መልእክት ያለውን የቃላት ቀጣይነት ይጠብቃል።
- source_word: παρὰ τῷ θεῷ
  choice: በእግዚአብሔር ፊት
  rationale: በእግዚአብሔር ግምገማ ወይም ፍርድ ያለውን አቋም በግልጽና በተለመደ አገላለጽ ያሳያል።
- source_word: ποιηταὶ
  choice: የሚፈጽሙት
  rationale: ሕጉን በተግባር ማድረግን ያመለክታል፤ ከ‘የሚሰሙት’ ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል።
- source_word: δικαιωθήσονται
  choice: ይጸድቃሉ
  rationale: የወደፊት ጊዜ ተገብሮን በአጭር መልክ ይይዛል፤ የጳውሎስን የጽድቅ ቃላት ቀጣይነት ሳያጠብ ሕጋዊና ውጤታዊ የፍቺ ገጽታዎቹን ክፍት ያደርጋል።
theological_decisions:
- issue: δικαιωθήσονται የሚለውን የጳውሎስ የጽድቅ ቃል ያለ ጠባብ ትርጓሜ ማቅረብ
  choice: ይጸድቃሉ
  alternative: ጻድቃን መሆናቸው ይታወጃል፤ ንጹሓን መሆናቸው ይረጋገጣል
  rationale: ዋናው ትርጉም ከጽድቅ ቃላት ጋር ያለውን መዝገበ ቃላዊና ሥነ መለኮታዊ ቀጣይነት ይጠብቃል፤ ተለዋጭ የፍርድ አገላለጾች ግን አንዱን ትርጓሜ ብቻ በጽሑፉ ላይ እንዳይጫኑ በማስታወሻ ተቀምጠዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሕዝብ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የሚሰሙት/የሚፈጽሙት’ የሚለው ትይዩ አወቃቀር የግሪኩን ንግግራዊ ተቃርኖ በተፈጥሯዊ መንገድ ያስተላልፋል።
