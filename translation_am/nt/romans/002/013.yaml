revisions:
- from: ሕግን የሚሰሙት በእግዚአብሔር ፊት ጻድቃን አይደሉምና፤ ነገር ግን ሕግን የሚፈጽሙት ይጸድቃሉ።[a]
  to: ሕጉን የሚሰሙት በእግዚአብሔር ፊት ጻድቃን አይደሉምና፤ ነገር ግን ሕጉን የሚፈጽሙት ጻድቃን ተብለው ይቆጠራሉ።[a]
  rationale: The revision makes the future passive sense of δικαιωθήσονται explicit in idiomatic modern Amharic, while preserving Paul’s δικαι-/ጽድቅ word connection through ጻድቃን. It also corrects the footnote so that its second alternative corresponds to ‘will be vindicated’ rather than ‘will be shown innocent/pure.’
