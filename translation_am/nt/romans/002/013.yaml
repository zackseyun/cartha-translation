review_pass:
  verdict: revise
  source_fidelity: The draft preserves the central antithesis between those who hear the law and those who do it, as well as the future result. However, ይጸድቃሉ can be read as an intransitive ‘will become righteous’ and does not clearly represent the future passive δικαιωθήσονται (‘will be justified’).
  naturalness: The paired expressions ሕጉን የሚሰሙት / ሕጉን የሚፈጽሙት are natural, clear modern Amharic. Using ሕጉን makes explicit the specific law in view and reads smoothly in this context.
  terminology: ጻድቃን appropriately renders δίκαιοι. For δικαιωθήσονται, ጻድቃን ተብለው ይቆጠራሉ clearly conveys the passive judicial sense while retaining the root terminology of righteousness. The existing footnote’s ‘ንጹሓን’ means ‘innocent/pure’ and is not an appropriate equivalent for ‘vindicated.’
  issues:
  - severity: medium
    issue: The rendering ይጸድቃሉ does not clearly mark the passive force of δικαιωθήσονται.
    rationale: 'The Greek verb is future passive: ‘will be justified.’ A form that can mean ‘will become righteous’ weakens the judicial/passive sense in this context.'
  - severity: medium
    issue: The footnote renders ‘vindicated’ as ንጹሓን መሆናቸው ይረጋገጣል.
    rationale: ንጹሕ means ‘pure’ or ‘innocent,’ not ‘vindicated.’ The alternative should express confirmation that one is right/justified without introducing purity language.
  revised_text: ሕጉን የሚሰሙት በእግዚአብሔር ፊት ጻድቃን አይደሉምና፤ ነገር ግን ሕጉን የሚፈጽሙት ጻድቃን ተብለው ይቆጠራሉ።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ “ይጸደቃሉ”፤ ወይም፣ “ትክክል መሆናቸው ይረጋገጣል።”
    reason: lexical_alternative
  revision_rationale: The revision makes the future passive sense of δικαιωθήσονται explicit in idiomatic modern Amharic, while preserving Paul’s δικαι-/ጽድቅ word connection through ጻድቃን. It also corrects the footnote so that its second alternative corresponds to ‘will be vindicated’ rather than ‘will be shown innocent/pure.’
