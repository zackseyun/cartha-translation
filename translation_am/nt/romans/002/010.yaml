source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: am
  text: ነገር ግን መልካም ለሚያደርግ ሁሉ፣ አስቀድሞ ለአይሁዳዊው፣ እንዲሁም ለግሪኩ[a] ግርማ፣ ክብረትና ሰላም ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ግሪክ” የሚለው እዚህ በሰፊው አይሁዳዊ ያልሆነውን፣ ማለትም ከአሕዛብ የሆነውን ሰው ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: ክብር
  rationale: በዚህ የፍርድና የዋጋ አውድ ውስጥ ያለውን የከበረ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τιμή
  choice: ሞገስ
  rationale: ከδόξα ጋር ያለውን ልዩነት በተቻለ መጠን ጠብቆ፣ የሚሰጥ ክብርና የተወደደ ስፍራ ሐሳብን ያስተላልፋል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የቃሉን ሰፊ መጽሐፍ ቅዱሳዊ ትርጉም ሳያጠብ ቀጥተኛና የተለመደ አቻ ነው።
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: ለሚያደርግ ሁሉ
  rationale: ተሳቢው የሚገልጠውን ቀጣይና ባሕርይን የሚያሳይ ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τὸ ἀγαθόν
  choice: መልካም
  rationale: ‘መልካም ማድረግ’ ተፈጥሯዊ የአማርኛ አገላለጽ ሲሆን ‘መልካም የሆነውን’ የሚለውንም ፍቺ ይይዛል።
- source_word: Ἰουδαίῳ
  choice: ለአይሁዳዊው
  rationale: ተወካይ ነጠላውን ቅርጽ ጠብቆ የሕዝብ ማንነቱን በግልጽ ይገልጣል።
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: የግሪኩን ቅደም ተከተል በአማርኛ ዐረፍተ ነገር ውስጥ በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: Ἕλληνι
  choice: ለግሪኩ
  rationale: የምንጩን ‘ግሪክ’ የሚለውን ቃል ይጠብቃል፤ በዚህ ንጽጽር ውስጥ ያለው ሰፊ የአሕዛብ ፍቺ በማስታወሻ ተብራርቷል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቁጥር 9 የቁጣና የመከራ ንግግር ጋር ያለውን ተቃርኖ በግልጽ ያሳያል።
theological_decisions:
- issue: በአይሁዳዊና በἝλλην ንጽጽር ውስጥ የἝλληνι ፍቺ
  choice: በዋናው ጽሑፍ ‘ለግሪኩ’ ተብሎ ተተርጉሞ፣ ሰፊው የአሕዛብ ፍቺ በማስታወሻ ተገልጿል።
  alternative: ለአሕዛቡ
  rationale: ‘ግሪክ’ የምንጩን ቀጥተኛ አገላለጽ ይጠብቃል፤ በሮሜ መልእክት ያለው አይሁዳዊ/አይሁዳዊ ያልሆነ ሰፊ ንጽጽር ግን ሳይጠፋ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የዋናው ዐረፍተ ነገር ቅደም ተከተል ለተፈጥሯዊ አማርኛ ተስተካክሏል፤ የቅደም ተከተልና የንጽጽር አጽንዖት ግን ተጠብቋል።
