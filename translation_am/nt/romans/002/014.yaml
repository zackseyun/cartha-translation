id: ROM.2.14
reference: Romans 2:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: am
  text: ምክንያቱም ሕግ የሌላቸው አሕዛብ[a] በተፈጥሮ[b] የሕጉን ነገሮች[c] ሲያደርጉ፣ እነዚህ ሕግ ባይኖራቸውም ለራሳቸው ሕግ ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሕዝቦች»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በደመ ነፍስ»።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «ሕጉ የሚጠይቀውን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: አሕዛብ
  rationale: በዚህ የጳውሎስ አውድ ከአይሁድና ከሙሴ ሕግ ጋር ያለውን ንጽጽር በግልጽ ያሳያል፤ «አገሮች» የሚለው ሰፊ አማራጭ በግርጌ ማስታወሻ ተጠቅሷል።
- source_word: νόμον / νόμου / νόμος
  choice: ሕግ / ሕጉ
  rationale: የቃሉን ተደጋጋሚነትና በመጨረሻው «ለራሳቸው ሕግ ናቸው» የሚለውን ዘይቤያዊ አጠቃቀም አንድ ወጥ አድርጎ ይጠብቃል።
- source_word: φύσει
  choice: በተፈጥሮ
  rationale: የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ ቃሉ ውስጣዊ የሥነ ምግባር እውቀትን፣ በደመ ነፍስ ማድረግን ወይም ሌላ ተፈጥሯዊ ሁኔታን ብቻ እንዲያመለክት አያጥበውም።
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: የሕጉን ነገሮች ያደርጋሉ
  rationale: የምንጩን አገላለጽና የሕግ ቃል ድግግሞሽ ይጠብቃል፤ ይበልጥ ለስላሳው «ሕጉ የሚጠይቀውን ያደርጋሉ» በግርጌ ማስታወሻ ቀርቧል።
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: ለራሳቸው ሕግ ናቸው
  rationale: የዳቲቭ ቅርጹን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ራሳቸው ሕግ እንደሚያወጡ ከግሪኩ በላይ አጠንክሮ አይናገርም።
theological_decisions:
- issue: φύσει ከሥነ ምግባር እውቀትና ከሕሊና ጋር ያለውን ግንኙነት ምን ያህል በግልጽ መተርጎም እንዳለበት
  choice: በዋናው ጽሑፍ «በተፈጥሮ» ተብሎ ሰፊው አገላለጽ እንዲቆይ
  alternative: «በደመ ነፍስ» ወይም «በተፈጥሯዊ ስሜታቸው» ብሎ በትርጓሜ ማቅረብ
  rationale: φύσει ብቻውን አንድን የሥነ መለኮት ማብራሪያ አያስገድድም፤ ስለዚህ የጳውሎስን ክርክር ክፍትነትና ውጥረት ሳይፈታ መጠበቅ ይገባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። «አሕዛብ» የመጽሐፍ ቅዱስ አውድን የሚገልጽ የታወቀ ቃል ሲሆን፣ የዓረፍተ ነገሩ አወቃቀር ለተፈጥሯዊ አማርኛ ተስተካክሎ የግሪኩ ምክንያታዊ «γὰρ» በመጨረሻው «ና» ተንጸባርቋል።
