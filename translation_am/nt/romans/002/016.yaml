revisions:
- from: እግዚአብሔር የሰዎችን የተሰወሩ ነገሮች በመሲሑ ኢየሱስ[a] አማካይነት በሚፈርድበት ቀን፣ እንደ ወንጌሌ።
  to: በወንጌሌ መሠረት፣ እግዚአብሔር የሰዎችን ስውር ነገሮች በመሲሕ ኢየሱስ[a] አማካይነት በሚፈርድበት ቀን።
  rationale: The revision improves Amharic syntax by placing “according to my gospel” where it plainly modifies the judgment, replaces a less idiomatic definite title form with the normal title-name expression, and slightly streamlines “the hidden things of people.” It does not alter the source’s scope, temporal force, agency, or theological ambiguity.
