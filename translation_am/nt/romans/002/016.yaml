  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: am
  text: በወንጌሌ መሠረት፣ እግዚአብሔር የሰዎችን ስውር ነገሮች በመሲሕ ኢየሱስ[a] አማካይነት በሚፈርድበት ቀን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በክርስቶስ ኢየሱስ።”
    reason: Χριστός በተለመደው “ክርስቶስ” ቅጽም ሊተረጎም ይችላል።
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: በሚፈርድበት ቀን
  rationale: የግሪኩን ግልጽ የቀን ማመልከቻና የወደፊት ፍርድ አውድ በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ያቀርባል።
- source_word: κρίνει
  choice: በሚፈርድበት
  rationale: የግሪኩ ግስ በአሁን ጊዜ ቅርጽ ቢሆንም በፍርድ ቀን አውድ ያለውን የወደፊት ትርጉም የአማርኛው የጊዜ አንቀጽ በተፈጥሮ ይገልጣል።
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: የሰዎችን የተሰወሩ ነገሮች
  rationale: τὰ κρυπτὰን እንደ “ምስጢራት” በመተርጎም ሊፈጠር የሚችለውን የሃይማኖታዊ ምሥጢር ትርጉም ያስወግዳል፤ ἀνθρώπωνንም ለወንዶችና ለሴቶች በሚያገለግለው “ሰዎች” ይተረጉማል።
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: እንደ ወንጌሌ
  rationale: የጳውሎስን የባለቤትነት ቅጥ በአጭርና በቀጥታ ይጠብቃል፤ ይህም የሚሰብከውን ወንጌል እንጂ እርሱ የፈጠረውን መልእክት አያመለክትም።
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ አማካይነት
  rationale: διά ከባለቤት ቅጥ ጋር የሚገልጸውን አማካይነት ይጠብቃል፤ Χριστόςንም እዚህ እንደ ማዕረግ “መሲሕ” ብሎ ያቀርባል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይስ እንደ ስም አካል መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: በዚህ አውድ Χριστός የተቀባውን የሚያመለክት የማዕረግ ኃይሉን እንደያዘ ሊነበብ ስለሚችል “መሲሑ” በዋናው ጽሑፍ ተመርጧል፤ የተለመደው ቅጽ በማስታወሻ ተጠብቋል።
- issue: κατὰ τὸ εὐαγγέλιόν μου ከፍርዱ ጋር ያለው ግንኙነት
  choice: እንደ ወንጌሌ
  alternative: እኔ የምሰብከው ወንጌል እንደሚለው
  rationale: የግሪኩን አጭር አገላለጽና ከቀደመው አረፍተ ነገር ጋር ያለውን ሰዋሰዋዊ ትስስር ይጠብቃል፤ ትርጉሙን በተጨማሪ ግስ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥሩ በግሪክ ከቀደመው ሐረግ ጋር የተያያዘ ስለሆነ፣ በብቸኝነት ሙሉ አረፍተ ነገር እንዲሆን ያልተገኘ ግስ አልተጨመረም።
