  rationale: አጭሩ የግሪክ አገባብ ያለውን ጊዜያዊና መሣሪያዊ ጥምር ኃይል ሳያስገድድ የፍርዱ ተግባር ራሱ ለራስ ፍርድ መንገድ መሆኑን ይጠብቃል።
