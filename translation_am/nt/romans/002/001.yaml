base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: am
  text: ስለዚህ፣ አንተ ሰው ሆይ[a]፣ የምትፈርድ ሁሉ፣ ማመኻኛ የለህም። በሌላ ሰው ላይ በምትፈርድበት ጊዜ ራስህን ትኮንናለህና፤ የምትፈርደው አንተ ራስህ ተመሳሳዩን ነገሮች ታደርጋለህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሰው” የሚለው ቃል በግሪክ ተባዕታይ ነጠላ ቅርጽ ቢሆንም፣ ንግግሩ በአጠቃላይ ማንኛውንም ሰው ያመለክታል።
    reason: lexical_alternative
