- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: ያንኑ ነገር ታደርጋለህ
  rationale: αὐτά የሚያሳየውን ‘ተመሳሳዩን ነገር’ ጠብቆ፣ የአሁን ጊዜውን ቀጣይ የተግባር ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የጳውሎስ ነጠላ ተባዕታይ የጥሪ አነጋገር እና አጠቃላይ አመልካችነቱ
