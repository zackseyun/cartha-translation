review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential force of Διό, the universal address to the person judging, and the causal logic of self-condemnation. However, it does not adequately distinguish κατακρίνεις (“you condemn”) from the preceding κρίνεις (“you judge”), and its singular “ያንኑ ነገር” weakens the plural τὰ αὐτά (“the same things”).
  naturalness: The proposed revision is natural modern standard Amharic while retaining the direct, solemn rhetorical address. “ራስህን ትኮንናለህ” clearly communicates the stronger judicial force without introducing a doctrinally expanded sense.
  terminology: “ማመኻኛ የለህም” suitably renders ἀναπολόγητος. “ስትፈርድ” renders κρίνεις, while “ትኮንናለህ” renders the stronger κατακρίνεις. “ተመሳሳዩን ነገሮች” retains the plural and ethical-practice sense of τὰ αὐτὰ πράσσεις.
  issues:
  - severity: medium
    issue: The translation renders both κρίνεις and κατακρίνεις with forms of “መፍረድ.”
    rationale: κατακρίνεις has a stronger condemnatory/judicial sense than κρίνεις. Rendering it as “ራስህን ትኮንናለህ” preserves Paul’s deliberate verbal contrast.
  - severity: low
    issue: “ያንኑ ነገር” is singular.
    rationale: The Greek τὰ αὐτά is plural, “the same things.” The revision uses “ተመሳሳዩን ነገሮች.”
  - severity: low
    issue: “በሌላው ላይ” can sound less specific than the Greek reference to another person.
    rationale: “በሌላ ሰው ላይ” explicitly and naturally conveys τὸν ἕτερον without altering the meaning.
  revised_text: ስለዚህ፣ አንተ ሰው ሆይ[a]፣ የምትፈርድ ሁሉ፣ ማመኻኛ የለህም። በሌላ ሰው ላይ በምትፈርድበት ጊዜ ራስህን ትኮንናለህና፤ የምትፈርደው አንተ ራስህ ተመሳሳዩን ነገሮች ታደርጋለህ።
