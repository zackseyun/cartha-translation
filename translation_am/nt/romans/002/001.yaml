  alternative: “አንተ ማንኛውም ሰው” ወይም “ሰው ሆይ” ብሎ የጥሪውን ቅርጽ ማለስለስ
  rationale: ይህ የግሪኩን የንግግር ጥንካሬና ነጠላ አድራሻ ይጠብቃል፤ በተመሳሳይም πᾶς ὁ κρίνων ንግግሩ ለሚፈርድ ሰው ሁሉ እንደሚደርስ ግልጽ ያደርጋል።
- issue: κρίνεις እና κατακρίνεις መካከል ያለው የኃይል ልዩነት
  choice: የመጀመሪያውን “ስትፈርድ”፣ ሁለተኛውን “በራስህ ላይ ትፈርዳለህ” ብሎ መተርጎም
  alternative: ሁለቱንም በተመሳሳይ “ትፈርዳለህ” ማቅረብ ወይም κατακρίνειςን “ትኮንናለህ” ማለት
  rationale: አገባቡ የሌላው ዳኝነት በፈራጁ ራስ ላይ የጥፋተኝነት ፍርድ እንደሚያመጣ ያሳያል፤ ነገር ግን የመጨረሻ መለኮታዊ ኩነኔን ከጽሑፉ በላይ አያስገባም።
