  text: For there is no partiality with God[a].
translation:
  language: am
  text: ምክንያቱም በእግዚአብሔር ዘንድ አድልዎ የለም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወገንተኝነት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ይህ ቃል ጥቅሱ ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσωπολημψία
  choice: አድልዎ
  rationale: በማኅበራዊ ደረጃ፣ በውጫዊ ሁኔታ ወይም በሌላ ምክንያት ለአንዱ ወገን ያለአግባብ ማድላትን የሚገልጽ ዘመናዊና ግልጽ ቃል ነው።
- source_word: παρὰ τῷ θεῷ
  choice: በእግዚአብሔር ዘንድ
  rationale: παρά ከዳቲቭ ጋር ያለውን የግንኙነት/የመገኘት ሐሳብ የሚጠብቅና በአማርኛ ክቡር እና ተፈጥሯዊ የሆነ አገላለጽ ነው።
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: ምክንያቱም በእግዚአብሔር ዘንድ አድልዎ የለም
  rationale: የግሪኩን ሕልውና ገላጭ አወቃቀር ይጠብቃል፤ ‘እግዚአብሔር አያዳላም’ ብሎ ወደ ግሳዊ አገላለጽ ሳይቀይር በዘመናዊ አማርኛ ግልጽ ነው።
theological_decisions:
- issue: የእግዚአብሔር አለማድላት አገላለጽ
  choice: አረፍተ ነገሩን ‘በእግዚአብሔር ዘንድ አድልዎ የለም’ በማለት ስለ እግዚአብሔር አጠቃላይ እውነት አድርጎ መተርጎም።
  alternative: ‘እግዚአብሔር አያዳላም’ ብሎ በግሳዊ አገላለጽ መተርጎም።
  rationale: ሁለቱም ተመሳሳይ እውነት ያስተላልፋሉ፤ የተመረጠው ግን በግሪክ ያለውን ሕልውና ገላጭ አወቃቀር በቅርበት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። ‘በእግዚአብሔር ዘንድ’ የሚለው ቅርጽ የግሪኩን አወቃቀር ሲጠብቅ ለተራ አንባቢም የሚገባ ነው።
