id: ROM.2.25
reference: Romans 2:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: am
  text: መገረዝስ ሕጉን ብትፈጽም ይጠቅማል፤ ሕጉን የምትተላለፍ ከሆንክ ግን፣ መገረዝህ አለመገረዝ ሆኗል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “መገረዝህ አለመገረዝ ሆኗል።” ይህም ሕጉ ሲተላለፍ ከመገረዝ ጋር የተያያዘው የቃል ኪዳን ጥቅም እንደሚጠፋ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: መገረዝ
  rationale: የግሪኩን ረቂቅ ስም እና ከ‘አለመገረዝ’ ጋር ያለውን ትይዩነት በቀጥታ ይጠብቃል።
- source_word: μὲν γὰρ
  choice: -ስ
  rationale: በአማርኛ የንጽጽሩን መነሻ በተፈጥሯዊ አገላለጽ ያመለክታል፤ ተከታዩ ‘ግን’ የግሪኩን μὲν...δὲ አወቃቀር ያሳያል።
- source_word: ὠφελεῖ
  choice: ይጠቅማል
  rationale: እውነተኛ ጥቅምን ወይም ዋጋን በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐὰν νόμον πράσσῃς
  choice: ሕጉን ብትፈጽም
  rationale: πράσσω የሚያመለክተውን ሕጉን በተግባር ማድረግን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παραβάτης νόμου
  choice: ሕጉን የምትተላለፍ
  rationale: ‘ሕግ’ን በግልጽ በመድገም የግሪኩን የሕግና የቃል ኪዳን ክብደት ይጠብቃል።
- source_word: ἡ περιτομή σου
  choice: መገረዝህ
  rationale: የጳውሎስን ቀጥተኛ ሁለተኛ መደብ ንግግር ይጠብቃል።
- source_word: ἀκροβυστία
  choice: አለመገረዝ
  rationale: በዚህ አውድ ቃሉ የሥጋ ክፍልን ብቻ ሳይሆን ከመገረዝ ተቃራኒ የሆነውን የቃል ኪዳን ምድብ ያመለክታል።
- source_word: γέγονεν
  choice: ሆኗል
  rationale: የፍጹም ጊዜውን ወደ አሁን የዘለቀ ውጤት እና የሁኔታ ለውጥ ይገልጻል።
theological_decisions:
- issue: የመጨረሻው ሐረግ ሥጋዊ ሁኔታን በቃል በቃል ይገልጻል ወይስ የቃል ኪዳን አቋምን?
  choice: ‘መገረዝህ አለመገረዝ ሆኗል’ የሚለውን ጠንካራ እና ተጨባጭ አገላለጽ በዋናው ጽሑፍ ማቆየት
  alternative: ‘መገረዝህ እንደ አለመገረዝ ይቆጠራል’
  rationale: γέγονεν ተራ ግምገማን ብቻ ሳይሆን የቃል ኪዳን መብት የተገለበጠበትን ሁኔታ በጠንካራ አነጋገር ያቀርባል፤ ጳውሎስ የፈጠረውን ውጥረት ትርጉሙ አያለዝበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡር እና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። ‘ሕጉን ብትፈጽም’ የሚለው ተፈጥሯዊ ሲሆን የተግባርን አጽንዖት ይጠብቃል፤ የመጨረሻው ተቃርኖም ሳይለዝብ ቀርቧል።
