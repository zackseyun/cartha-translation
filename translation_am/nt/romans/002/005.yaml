lexical_decisions:
- source_word: κατὰ δὲ
  choice: ነገር ግን … ምክንያት
  rationale: δέ ያለውን መጠነኛ ተቃርኖ “ነገር ግን” ይጠብቃል፤ κατά በዚህ አውድ የሚያሳየውን ምክንያታዊ ግንኙነት “ምክንያት” በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σκληρότητά σου
  choice: በግትርነትህ
  rationale: የሞራል ድንዛዜንና እምቢተኝነትን የሚያመለክተውን የ‘ጥንካሬ’ ዘይቤ በተለመደ አማርኛ ይጠብቃል።
- source_word: ἀμετανόητον καρδίαν
  choice: ንስሐ በማይገባ ልብህ
  rationale: የግሪኩን የልብ አገላለጽ ሳይቀይር፣ ንስሐ አለመግባትን በግልጽና በዘመናዊ ቋንቋ ይገልጣል።
- source_word: θησαυρίζεις
  choice: እያከማቸህ ነው
  rationale: ግሱ ያለውን የመሰብሰብና ከጊዜ ወደ ጊዜ የመጨመር ምስል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σεαυτῷ
  choice: በራስህ ላይ
  rationale: ድርጊቱ በተናጋሪው ተቀባይ ራስ ላይ የሚያመጣውን ግላዊ ውጤት በአማርኛ ተፈጥሯዊ በሆነ አገላለጽ ያሳያል።
- source_word: ὀργή
  choice: ቁጣ
  rationale: በፍርድ አውድ ያለውን ከባድ መለኮታዊ ቁጣ የሚያስተላልፍ ግልጽና የተለመደ ቃል ነው።
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: በቁጣውና … በሚገለጥበት ቀን
  rationale: ἐν ἡμέρᾳ ያለውን ጊዜያዊ ኃይል “በ…ቀን” ይጠብቃል። የስም አገላለጹን በአማርኛ ግልጽ ለማድረግ “በሚገለጥበት” የሚለው ዝምድናዊ ግስ ገብቷል፣ ሁለቱም አንድን ቀን እንዲገልጹ ተደርጓል።
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: የእግዚአብሔር ፍትሐዊ ፍርድ
  rationale: δικαιοκρισία የፍርዱን ትክክለኛነትና ፍትሐዊነት ያጎላል፤ “ፍትሐዊ ፍርድ” ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: “ቁጣ” የሰው ስሜታዊ ቁጣ ብቻ እንዳይመስል ወይስ በጽሑፉ ያለው ፍርዳዊ ውጥረት እንዲጠበቅ
  choice: “ቁጣ” የሚለውን ቃል ጠብቆ ከእግዚአብሔር ፍትሐዊ ፍርድ መገለጥ ጋር ማያያዝ
  alternative: “የፍርድ ቅጣት” ብሎ መተርጎም
  rationale: ὀργή ቁጣን በቀጥታ ይገልጣል፤ “ቅጣት” ማለት ትርጉሙን በትርጓሜ ይገድበዋል። አውዱ ፍርዳዊ ኃይሉን በቂ ያደርገዋል።
- issue: የግሪኩን ስማዊ አወቃቀር በቀጥታ መጠበቅ ወይስ በአማርኛ ዝምድናዊ ሐረግ ማድረግ
  choice: “የእግዚአብሔር ፍትሐዊ ፍርድ በሚገለጥበት ቀን” ብሎ መግለጽ
  alternative: “በቁጣ ቀንና በእግዚአብሔር ፍትሐዊ ፍርድ መገለጥ” ብሎ ስማዊ አወቃቀሩን በቀጥታ መጠበቅ
  rationale: ቀጥተኛው ስማዊ አወቃቀር በአማርኛ ያልተሟላና ግራ የሚያጋባ ይሆናል። ዝምድናዊው ሐረግ ግሪኩ የሚያመለክተውን የመገለጥ ሐሳብ ሳይጨምር በተፈጥሯዊ አማርኛ ያቀርባል።
