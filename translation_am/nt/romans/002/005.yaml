review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the causal contrast, moral hardness, impenitent heart, accumulation of wrath, and God''s righteous judgment. However, its relative clause makes both wrath and judgment appear to be revealed, whereas ἀποκαλύψεως modifies only God''s righteous judgment. The source instead has one coordinated expression: the day of wrath and of the revelation of God''s righteous judgment.'
  naturalness: “ንስሐ በማይገባ ልብ” is understandable but less idiomatic than “ንስሐ የማይገባ ልብ.” Rendering the final temporal expression with the compact nominal phrase “በቁጣና ... መገለጥ ቀን” is natural enough in formal modern Amharic and avoids the ambiguity introduced by the relative clause.
  terminology: “ግትርነት,” “ንስሐ,” “ቁጣ,” and “ፍትሐዊ ፍርድ” are appropriate modern standard Amharic biblical-register terms. “ለራስህ” more directly reflects the Greek reflexive dative than “በራስህ ላይ.”
  issues:
  - severity: medium
    issue: The phrase “በቁጣውና የእግዚአብሔር ፍትሐዊ ፍርድ በሚገለጥበት ቀን” can grammatically attach “በሚገለጥበት” to both “ቁጣ” and “ፍርድ.”
    rationale: In Greek, ἀποκαλύψεως is a coordinated noun with ὀργῆς, and δικαιοκρισίας τοῦ θεοῦ is specifically what is revealed. The translation should not state or strongly imply that wrath itself is revealed.
  - severity: low
    issue: “ንስሐ በማይገባ ልብ” is somewhat awkward.
    rationale: “ንስሐ የማይገባ ልብ” is the more natural attributive expression for an unrepentant heart.
  - severity: low
    issue: “በራስህ ላይ” gives an interpretive ‘against yourself’ sense.
    rationale: The reflexive dative σεαυτῷ is most directly rendered “ለራስህ,” while the context still makes the adverse consequence clear.
