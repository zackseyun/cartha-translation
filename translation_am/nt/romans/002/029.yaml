source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: am
  text: ነገር ግን በውስጡ አይሁዳዊ የሆነው እርሱ ነው፤ ግርዛትም የልብ ነው—በመንፈስ[a] ነው እንጂ በፊደል አይደለም። የእርሱም ምስጋና ከሰዎች ሳይሆን ከእግዚአብሔር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመንፈስ” የሚለው ሐረግ መንፈስ ቅዱስን ሊያመለክት ይችላል፤ ወይም ውስጣዊ መንፈሳዊ እውነታን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: በውስጡ
  rationale: የጳውሎስን ውስጣዊና ውጫዊ ንፅፅር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ሐረጉን እንደ ምስጢር ወይም እንደ ቦታ ብቻ አያቀርበውም።
- source_word: Ἰουδαῖος
  choice: አይሁዳዊ
  rationale: በሮሜ 2 ያለው ንፅፅር መልክዓ ምድራዊ ሳይሆን ሃይማኖታዊና የቃል ኪዳን ማንነትን የሚመለከት ነው።
- source_word: περιτομὴ καρδίας
  choice: ግርዛትም የልብ ነው
  rationale: የምንጩን የግርዛት ዘይቤ እና የልብ ላይ የሆነውን ትኩረት በግልጽ አማርኛ ይጠብቃል።
- source_word: ἐν πνεύματι
  choice: በመንፈስ[a]
  rationale: ἐν ያለውን ሰፊ የመንገድ፣ የመስክ ወይም የመሣሪያ ግንኙነት ይጠብቃል። መንፈስ መንፈስ ቅዱስን ወይም ውስጣዊ መንፈሳዊ እውነታን ሊያመለክት ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: οὐ γράμματι
  choice: በፊደል አይደለም
  rationale: γράμμα የሚለውን ቀጥተኛ ምስልና የመንፈስ/ፊደል ንፅፅር ይጠብቃል፤ ‘በተጻፈ ሕግ’ ብሎ ከምንጩ በላይ አይተረጉምም።
- source_word: οὗ ὁ ἔπαινος
  choice: የእርሱም ምስጋና
  rationale: ተውላጠ ስሙን ከውስጥ አይሁዳዊው ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἐξ ἀνθρώπων
  choice: ከሰዎች
  rationale: ἀνθρώπων አጠቃላይ የሰው ልጆች ብዙ ቁጥር በመሆኑ ፆታን ሳይወስን ትክክለኛውን ምንጭ ያሳያል።
- source_word: ἐκ τοῦ θεοῦ
  choice: ከእግዚአብሔር
  rationale: የግሪኩን ሐረግ ያለ አላስፈላጊ ማስፋፊያ በቀጥታና በተለመደ አማርኛ ያቀርባል።
theological_decisions:
- issue: πνεύματι መንፈስ ቅዱስን ወይስ የሰውን መንፈስ/ውስጣዊ መንፈሳዊ እውነታ ያመለክታል?
  choice: በዋናው ጽሑፍ ‘በመንፈስ’ በሚል ሆን ተብሎ ክፍት ተደርጓል።
  alternative: ‘በመንፈስ ቅዱስ’ ወይም ‘በውስጣዊ መንፈሳዊ እውነታ’
  rationale: የመንፈስና የፊደል ንፅፅሩ የመንፈስ ቅዱስን ሥራ በጠንካራ ሁኔታ ሊያመለክት ቢችልም፣ የግሪኩ ቅርጽ ሌላውን አተረጓጎም ፈጽሞ አይዘጋም። ስለዚህ እውነተኛው አሻሚነት አልተወገደም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አጭር ንፅፅሮች ተጠብቀው፣ የመጨረሻው የምስጋና ሐረግ ለአማርኛ ተፈጥሯዊነትና ግልጽነት ወደ ሙሉ ዓረፍተ ነገር ተዘርግቷል።
