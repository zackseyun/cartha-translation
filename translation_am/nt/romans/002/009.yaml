  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: am
  text: መከራና ጭንቀት ክፉውን በሚያደርግ ሰው ሁሉ ነፍስ ላይ ይመጣል፤ በመጀመሪያ በአይሁዳዊ ላይ፣ እንዲሁም በግሪካዊ ላይ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλῖψις
  choice: መከራ
  rationale: ከባድ ሥቃይንና ጫናን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ከ στενοχωρία ጋር ያለውን የተደራራቢ ኃይልም ይጠብቃል።
- source_word: στενοχωρία
  choice: ጭንቀት
  rationale: የመጨናነቅንና የውስጥ ሥቃይን ሐሳብ በግልጽ ሁኔታ ያስተላልፋል፤ ከ“መከራ” ጋርም ተፈጥሯዊ ጥምረት ይፈጥራል።
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: በሰው ሁሉ ነፍስ ላይ
  rationale: ψυχή የሚለውን “ነፍስ” በማለት የምንጩን ምስላዊና ክቡር አነጋገር ይጠብቃል፤ ἀνθρώπου ለሰው ሁሉ የሚሆን አጠቃላይ ትርጉም እንዳለውም ያሳያል።
- source_word: τοῦ κατεργαζομένου
  choice: በሚያደርግ
  rationale: በዚህ የሥነ ምግባር አውድ ተሳቢውን በቀላልና ቀጥተኛ አማርኛ ይተረጉማል፤ ድርጊቱን ከማቃለል ወይም የልማድ ትርጉም ከመጨመር ይቆጠባል።
- source_word: τὸ κακόν
  choice: ክፉውን
  rationale: የግሪኩን አጠቃላይ የ“ክፉ” ሐሳብ በአጭር ቅርጽ ይጠብቃል።
- source_word: Ἰουδαίου
  choice: አይሁዳዊው
  rationale: በሮሜ መልእክት ውስጥ ያለውን የሕዝብና የሃይማኖት መለያ በተለመደው አማርኛ ይገልጣል።
- source_word: Ἕλληνος
  choice: ግሪካዊው
  rationale: የጳውሎስን ቀጥተኛ “አይሁዳዊ/ግሪካዊ” ንጽጽር ይጠብቃል፤ “አሕዛብ” ብሎ ትርጓሜያዊ ማስፋትን አያደርግም።
- source_word: πρῶτον
  choice: በመጀመሪያ
  rationale: የቅድሚያውን ቅደም ተከተል ያለ ተጨማሪ ትርጓሜ በግልጽ ያቀርባል።
theological_decisions:
- issue: በግሪኩ አጭር ስማዊ ሐረግ ውስጥ ያልተገለጠውን ግስ በአማርኛ ማሟላት
  choice: መከራና ጭንቀት ይደርሳል
  alternative: መከራና ጭንቀት፣ በሰው ሁሉ ነፍስ ላይ…
  rationale: አማርኛ የተሟላና ተፈጥሯዊ ዓረፍተ ነገር እንዲሆን ግስ ያስፈልገዋል። “ይደርሳል” የፍርዱን መምጣት ያሳያል እንጂ ተጨማሪ የእምነት አቋም አያስገባም።
translation_notes:
  register: ትርጉሙ ክቡር ነገር ግን ለዘመናዊ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ሰረዞቹ የአይሁዳዊውንና የግሪካዊውን ቅደም ተከተል ከዋናው የፍርድ አረፍተ ነገር ጋር በግልጽ ያያይዛሉ።
