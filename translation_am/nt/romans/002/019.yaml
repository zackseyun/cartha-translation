  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: am
  text: አንተም ራስህን ለዕውሮች መሪና በጨለማ ላሉት ብርሃን እንደሆንክ ታምናለህ፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: እርግጠኛ ነህ
  rationale: የግሱ ፍጹም ጊዜ ቅርጽ የጸና እምነትንና ራስን መተማመንን ያመለክታል፤ «እርግጠኛ ነህ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τε
  choice: አንተም
  rationale: «-ም» ን ከ«አንተ» ጋር በማያያዝ ይህ ንግግር ከቀደመው ዝርዝር ጋር ያለውን አያያዥ ኃይል በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: σεαυτὸν
  choice: ራስህ
  rationale: በግሪክኛው ያለውን አጽንዖታዊ አንጸባራቂ ተውላጠ ስም በመጠበቅ፣ ሰውየው ስለራሱ ያለውን ግምት ያጎላል።
- source_word: ὁδηγὸν
  choice: መሪ
  rationale: ዕውሮችን መንገድ የሚመራ ሰውን በግልጽና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τυφλῶν
  choice: ለዕውሮች
  rationale: ከ«መሪ» ጋር ያለውን የግሪክኛ የግንኙነት ቅርጽ በአማርኛ «ለዕውሮች መሪ» በሚል ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: φῶς
  choice: ብርሃን
  rationale: መንፈሳዊ ወይም ሥነ ምግባራዊ መመሪያን የሚያመለክተውን ዘይቤ ሳይፈታ ይጠብቃል።
- source_word: τῶν ἐν σκότει
  choice: በጨለማ ላሉት
  rationale: የግሪክኛውን ዘይቤና ግላዊ አመልካችነት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: «ብርሃን» እና «ጨለማ» የሚሉት ዘይቦች ትርጉም
  choice: ዘይቦቹን በቀጥታ እንዳሉ ማቆየት
  alternative: እንደ «እውቀት የሚሰጥ» እና «ባለማወቅ ውስጥ ያሉ» በማለት መፍታት
  rationale: ጥቅሱ ጨለማው የእውቀት፣ የሥነ ምግባር ወይም የመንፈሳዊ ሁኔታ ጨለማ መሆኑን በዚህ ቦታ አይገድብም፤ ስለዚህ የጽሑፉ ሰፊ ዘይባዊ ኃይል ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ንግግሩ ከቀደሙትና ከሚከተሉት የጳውሎስ ዝርዝር ሐረጎች ጋር የተያያዘ በመሆኑ በፍጻሜው ሴሚኮሎን ተቀምጧል።
