lexical_decisions:
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ክርክር የሚወጣውን መደምደሚያዊ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διδάσκων
  choice: የምታስተምር
  rationale: ተሳቢውን እንደ ገላጭ አንቀጽ በመተርጎም ቀጣይነት ያለውን የሰውየውን ተግባር ይጠብቃል።
- source_word: ἕτερον
  choice: ሌላውን
  rationale: የግሪኩን ነጠላ ቁጥር ይጠብቃል፤ ያለ አስፈላጊነትም ወደ ብዙ ቁጥር አያሰፋውም።
- source_word: σεαυτὸν
  choice: ራስህን
  rationale: ሌላውን በማስተማርና ራስን ባለማስተማር መካከል ያለውን ጠንካራ ንጽጽር ይጠብቃል።
- source_word: οὐ διδάσκεις;
  choice: አታስተምርምን?
  rationale: የግሪኩን አሉታዊ የንግግር ጥያቄና የወቀሳ ኃይል ይጠብቃል።
- source_word: κηρύσσων
  choice: የምታውጅ
  rationale: ይፋዊ ማወጅን ይገልጻል፤ ቃሉንም በዘመናዊ ቤተ ክርስቲያን አገልግሎት ትርጉም ብቻ አይገድበውም።
- source_word: μὴ κλέπτειν
  choice: “አትስረቅ” ብለህ
  rationale: የታወጀውን ይዘት በተፈጥሯዊ የአማርኛ ቀጥተኛ ክልከላ ያቀርባል።
- source_word: κλέπτεις;
  choice: ትሰርቃለህን?
  rationale: የጳውሎስን ቀጥተኛና ከሳሽ የንግግር ጥያቄ በአጭር የአሁን ጊዜ አገላለጽ ይጠብቃል።
