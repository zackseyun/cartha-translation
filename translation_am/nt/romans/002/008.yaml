base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: am
  text: ነገር ግን በራስ ወዳድነት ለሚመሩ[a]፣ ለእውነት የማይታዘዙና ለዓመፅ የሚታዘዙ[b] ቁጣና ንዴት ይሆንባቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለራሳቸው ጥቅም ብቻ ለሚሯሯጡ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለኢፍትሐዊነት የሚታዘዙ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: በራስ ወዳድ ምኞት ለሚነዱ
  rationale: ἐκ የሚያመለክተውን የድርጊት ምንጭና ἐριθεία የያዘውን የግል ጥቅም ፈላጊነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: እውነትን የማይታዘዙ
  rationale: ግሱ ተራ አለማመንን ሳይሆን ለእውነት አለመታዘዝን ያሳያል።
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: ዓመፅን የሚታዘዙ
  rationale: ከእውነት አለመታዘዝ ጋር ያለውን ትይዩ አወቃቀርና ተቃራኒ ታማኝነት ይጠብቃል።
- source_word: ἀδικίᾳ
  choice: ዓመፅ
  rationale: በእግዚአብሔር ፊት ያለውን ሞራላዊ ክፋትና ከጽድቅ ተቃራኒ መሆን የሚያካትት የአማርኛ አገላለጽ ነው፤ ‘ኢፍትሐዊነት’ የሚለው ጠባብ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὀργὴ
  choice: ቁጣ
  rationale: በፍርድ ዐውድ ያለውን ከባድና የተረጋጋ የቁጣ ኃይል ያስተላልፋል።
- source_word: θυμός
  choice: ንዴት
  rationale: ከ‘ቁጣ’ ጋር ተደርቦ የአገላለጹን ጥንካሬ የሚጨምር ተፈጥሯዊ ዘመናዊ ቃል ነው።
- source_word: implicit verbal ellipsis
  choice: ይሆንባቸዋል
  rationale: ግሪኩ ግስ ባይገልጽም በአማርኛ የተሟላና ተፈጥሯዊ ዓረፍተ ነገር ለመፍጠር ከሰፊው ዐውድ የሚገባውን ውጤት በአጭሩ ገልጿል።
theological_decisions:
- issue: በመለኮታዊ ፍርድ ዐውድ ἀδικίαን መተርጎም
  choice: ዓመፅ
  alternative: ኢፍትሐዊነት
  rationale: ‘ዓመፅ’ ለእውነት መቃወምንና ከእግዚአብሔር ጽድቅ የራቀ ሞራላዊ ክፋትን በስፋት ይገልጻል፤ ‘ኢፍትሐዊነት’ የፍትሕን ገጽታ በግልጽ ቢያሳይም ትርጉሙን ሊያጠብ ይችላል።
