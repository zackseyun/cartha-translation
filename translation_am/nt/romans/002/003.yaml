  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: am
  text: ነገር ግን፣ እንዲህ ያሉ ነገሮችን በሚያደርጉ ሰዎች ላይ የምትፈርድና አንተው ደግሞ የምታደርጋቸው ሰው ሆይ፣[a] አንተ ከእግዚአብሔር ፍርድ እንደምታመልጥ ታስባለህን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘አንተ ሰው ሆይ።’ የግሪኩ ቃል በነጠላ ቁጥር የቀረበ ሲሆን የሰውን ሁሉ ሁኔታ የሚወክል አንድ ሰው በቀጥታ ይጠራል።
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: ታስባለህን
  rationale: ግሱ አንድን ነገር በአእምሮ ማሰብንና እውነት እንደሆነ መገመትን ያመለክታል፤ ይህ አተረጓጎም የጥያቄውን ወቃሽ ኃይል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἄνθρωπε
  choice: ሰው ሆይ
  rationale: የጥሪ ቅርጹንና ጳውሎስ ተወካይ የሆነን አንድ ሰው በቀጥታ መናገሩን ይጠብቃል።
- source_word: κρίνων
  choice: የምትፈርድ
  rationale: በሌሎች ድርጊት ላይ የሚሰጠውን የሥነ ምግባር ፍርድ በቀጥታ ያሳያል፤ ‘የምትኮንን’ ከሚለው የበለጠ ሰፊና ከግሪኩ ጋር የቀረበ ነው።
- source_word: πράσσοντας
  choice: በሚያደርጉ
  rationale: ተደጋጋሚ ወይም የተለመደ ምግባርን ሊያመለክት የሚችለውን አሁናዊ ክፍለ ግስ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ποιῶν αὐτά
  choice: አንተው ደግሞ የምታደርጋቸው
  rationale: የከሳሹን ንጽጽርና ተናጋሪው ራሱ ተመሳሳዩን ነገር እንደሚያደርግ የሚያሳየውን አጽንዖት ‘አንተው’ በማለት ያጎላል።
- source_word: ἐκφεύξῃ
  choice: እንደምታመልጥ
  rationale: ከሚመጣ ፍርድ ማምለጥን በግልጽ ያሳያል፤ ከλογίζῃ ጋር ተያይዞ የጥያቄውን የወደፊት አቅጣጫ ይጠብቃል።
- source_word: κρίμα
  choice: ፍርድ
  rationale: በዚህ አውድ የእግዚአብሔርን ዳኝነታዊ ፍርድ በሰፊው ያመለክታል፤ ቃሉን በ‘የቅጣት ውሳኔ’ ብቻ አይገድበውም።
