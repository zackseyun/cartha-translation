  source_fidelity: 'The draft correctly renders the topic phrase, the present-tense citation formula, the duration, and both participles. However, the placement of ወደ before እጆቼን reverses the intended syntactic relation: the hands, not the people, are made the object of the directional phrase. Reordering is required to express ἐξεπέτασα τὰς χεῖράς μου πρὸς λαόν faithfully.'
