base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: am
  text: ነገር ግን ስለ እስራኤል[a] እንዲህ ይላል፦ “ቀኑን ሙሉ እጆቼን ወደ የማይታዘዝ[b] እና የሚቃወም[c] ሕዝብ ዘርግቻለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነገር ግን ለእስራኤል እንዲህ ይላል።” የግሪኩ አገባብ ንግግሩ ለእስራኤል በቀጥታ እንደተነገረ ወይም ስለ እስራኤል እንደተነገረ ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: “የማይታዘዝ” የሚለው ቃል “የማያምን” ወይም “ለመታመን እምቢ የሚል” የሚል ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “የሚቃረን፣” “ተቃውሞ የሚናገር” ወይም “የሚቃወም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: ነገር ግን ስለ እስራኤል
  rationale: πρός ከ λέγει ጋር በዚህ አውድ ንግግሩ ስለ እስራኤል መሆኑን ሊጠቁም ይችላል፤ ቀጥተኛ ንግግር ‘ለእስራኤል’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: λέγει
  choice: እንዲህ ይላል
  rationale: የግሪኩን የአሁን ጊዜ የጥቅስ አቀራረብ ይጠብቃል፤ ባለቤቱን ‘እግዚአብሔር’ ብሎ በግልጽ አልጨመረም።
- source_word: Ὅλην τὴν ἡμέραν
  choice: ቀኑን ሙሉ
  rationale: የጊዜውን ቆይታ በተፈጥሯዊና በዘመናዊ አማርኛ ያሳያል።
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: እጆቼን ዘርግቻለሁ
  rationale: የተዘረጉ እጆችን ምስላዊ አገላለጽ በቀጥታ ይጠብቃል፤ ድርጊቱንም ከአሁን ጋር ተዛማጅ ሆኖ የሚቀርብ በአማርኛ ተፈጥሯዊ ፍጹም ጊዜ ያቀርባል።
- source_word: πρὸς λαὸν
  choice: ወደ ... ሕዝብ
  rationale: የተዘረጉት እጆች ወደ ሕዝቡ የተመሩ መሆናቸውን ያሳያል።
- source_word: ἀπειθοῦντα
  choice: የማይታዘዝ
  rationale: ቃሉ አለመታዘዝን እንዲሁም አለማመንን ወይም ለማመን እምቢ ማለትን ሊያካትት ይችላል፤ ዋናው ትርጉም የሥነ ፈቃድ እምቢተኝነቱን ያስቀድማል።
- source_word: ἀντιλέγοντα
  choice: የሚቃወም
  rationale: ቃሉ መቃወምን፣ መቃረንን ወይም ተቃውሞ መናገርን ያመለክታል፤ ‘የሚቃወም’ ንቁ ተቃውሞውን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: እስራኤል ለእግዚአብሔር ጥሪ የሰጠው ምላሽ
  choice: ‘የማይታዘዝ እና የሚቃወም ሕዝብ’ ተብሎ ተተርጉሟል።
  alternative: ‘የማያምን እና ተቃውሞ የሚናገር ሕዝብ’
  rationale: የእግዚአብሔርን ቀጣይ ተነሳሽነትና የሕዝቡን እምቢተኛ ተቃውሞ አብሮ ይጠብቃል፤ ስለ እስራኤል አጠቃላይ ሁኔታ ጥቅሱ ከሚናገረው በላይ የሆነ የአንድ ወገን ዶክትሪን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ነቢያዊ ክብደትና የተዘረጉ እጆች ምስል ተጠብቋል።
