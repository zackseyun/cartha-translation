  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: am
  text: ነገር ግን እጠይቃለሁ፤ “ታዲያ አልሰሙምን?” በእርግጥ ሰምተዋል፤ “ድምፃቸው[a] በምድር ሁሉ ወጣ፣[c] ቃላቸውም እስከ የሰው መኖሪያ ዓለም[b] ዳርቻዎች ደረሱ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ድምፀታቸው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም በአጭሩ፣ “ዓለም።” የግሪኩ ቃል “የሰው መኖሪያ ዓለም” ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: ጳውሎስ መዝሙር 19፥4ን ጠቅሶ ቋንቋውን መልእክቱ በስፋት መድረሱን ለመግለጽ ይጠቀምበታል።
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: ታዲያ አልሰሙምን?
  rationale: ድርብ አሉታው አዎንታዊ መልስን የሚጠብቅ የአጽንዖት ጥያቄ ነው፤ ይህ አተረጓጎም ያንን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μενοῦνγε
  choice: በእርግጥ ሰምተዋል
  rationale: ቃሉ ጥያቄውን በጠንካራ አዎንታዊ መልስ ይመልሳል፤ በአማርኛ ግሱን በግልጽ መድገም ተፈጥሯዊ ነው።
- source_word: φθόγγος
  choice: ድምፅ
  rationale: በጥቅሱ ውስጥ በስፋት የወጣን የሚሰማ ድምፅ ያመለክታል፤ “ድምፅ” ከቀጣዩ “ቃላቸው” ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: γῆ
  choice: ምድር
  rationale: የግጥማዊውን ጥቅስ ዓለም አቀፋዊ ስፋት ያሳያል፤ ከተወሰነ አገር ይልቅ “ምድር” ይስማማል።
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: የግሪኩን አኦሪስት በቀጥታ በአማርኛ ያለፈ ጊዜ ይወክላል፤ የድምፅ ወይም የወሬ መስፋፋትንም በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: πέρατα
  choice: ዳርቻዎች
  rationale: “እስከ ... ዳርቻዎች” የሚለው በአማርኛ ተፈጥሯዊ ሲሆን የሩቅ ጫፎችን ግጥማዊ ምስል ይጠብቃል።
- source_word: οἰκουμένης
  choice: ሰው የሚኖርበት ዓለም
  rationale: ቃሉ በተለይ ሰው የሚኖርበትን ዓለም ያመለክታል፤ ይህ አገላለጽ የግሪኩን ልዩ ትርጉም በግልጽ ያስቀምጣል።
- source_word: ῥήματα
  choice: ቃላቸው
  rationale: ቀጥተኛውን የቃሉን ትርጉምና ከ“ድምፃቸው” ጋር ያለውን ግጥማዊ ትይዩነት ይጠብቃል።
theological_decisions:
- issue: በመዝሙር ጥቅሱ ውስጥ “እነርሱ” የሚለው ተውላጠ ስም ማንን እንደሚያመለክት
