base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: am
  text: ምክንያቱም፣ የእግዚአብሔርን ጽድቅ[a][b] ሳያውቁና የራሳቸውን ጽድቅ ለማቋቋም ሲጥሩ፣ ለእግዚአብሔር ጽድቅ አልተገዙም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በሁለቱም ስፍራ «ጽድቅ» የሚለው «ፍትሕ» ተብሎም ሊተረጎም ይችላል። በጳውሎስ አጠቃቀም δικαιοσύνη ጽድቅን፣ ፍትሕን ወይም እግዚአብሔር ሰዎችን ትክክለኛ አቋም ላይ የሚያደርግበትን የጽድቅ መንገድ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «የእግዚአብሔር ጽድቅ» የሚለው «ከእግዚአብሔር የሚገኝ ጽድቅ» ወይም «የእግዚአብሔር የራሱ ጽድቅ» ተብሎም ሊገባ ይችላል፤ የግሪኩ አገላለጽ ከአንድ በላይ ተያያዥ ፍቺዎችን ይፈቅዳል።
    reason: alternative_reading
