- source_word: ὁμολογήσῃς
  choice: ብትመሰክር
  rationale: በአፍ የሚደረግ ግልጽ እውቅናንና መግለጫን ያሳያል፤ በአውዱም የእምነት ምስክርነት ነው።
- source_word: ἐν τῷ στόματί σου
  choice: በአፍህ
  rationale: የግሪኩን መሣሪያዊ አገባብ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κύριον Ἰησοῦν
  choice: ኢየሱስ ጌታ እንደሆነ
  rationale: የሚመሰከረውን ይዘት ግልጽ ያደርጋል፤ Ἰησοῦν እንደ ባለቤት ስም፣ κύριον ደግሞ እንደ ተሳቢ ማዕረግ ያቀርባል።
