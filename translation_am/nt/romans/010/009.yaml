  text: ምክንያቱም፣ በአፍህ ኢየሱስ ጌታ እንደሆነ ብትመሰክር[a]፣ በልብህም እግዚአብሔር ከሙታን እንዳስነሣው ብታምን፣ ትድናለህ።
  philosophy: optimal-equivalence
