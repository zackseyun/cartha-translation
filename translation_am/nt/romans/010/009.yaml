  rationale: ይህ ቅርጽ የሚመሰከረውን ይዘት ግልጽ ያደርጋል፤ ሐረጉን እንደ ቋሚ የተዋሐደ ማዕረግ ብቻ አያቀርበውም። ትክክለኛው የቅርጽ አማራጭ በማስታወሻ ተጠብቋል።
- issue: σωθήσῃ ያለው የመዳን ኃይል
  choice: ትድናለህ
  alternative: ትታደጋለህ / ነፃ ትወጣለህ
  rationale: አውዱ ስለ ድነት ስለሚናገር ‘ትድናለህ’ ትክክለኛውን ሥነ መለኮታዊ ኃይል ይጠብቃል፤ ጽሑፉ ያልገለጸውን የመዳን ዝርዝር ግን አይጨምርም።
