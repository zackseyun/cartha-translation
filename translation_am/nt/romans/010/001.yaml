  rationale: ὑπέρ እዚህ ለእነርሱ ጥቅም የሚቀርብ ጸሎትን ያመለክታል፤ «ስለ እነርሱ» በዚህ የአማርኛ ዐረፍተ ነገር ውስጥ ቀላልና ግልጽ ነው።
