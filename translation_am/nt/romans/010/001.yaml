- source_word: εἰς σωτηρίαν
  choice: እነርሱ እንዲድኑ
  rationale: εἰς የጸሎቱን ግብ ያመለክታል፤ «እንዲድኑ» ይህን ግብ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
