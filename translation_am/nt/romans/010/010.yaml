- source_word: σωτηρίαν
  choice: ድነት
  rationale: በጳውሎሳዊው የመዳን አውድ ተፈጥሯዊና መደበኛ አማርኛ ሲሆን የአሁኑንና የወደፊቱን ልኬት ሊይዝ ይችላል።
theological_decisions:
- issue: እምነትና ምስክርነት ከጽድቅና ከድነት ጋር ያላቸው ግንኙነት
  choice: ሁለቱን ትይዩ ሐረጎች ‘ለጽድቅ’ እና ‘ለድነት’ በማለት በቀጥታ ማቅረብ
  alternative: ምስክርነትን የድነት ማስረጃ ብቻ አድርጎ መግለጽ፣ ወይም ድነትን የሚያስገኝ ተጨማሪ የብቃት ሥራ አድርጎ መተርጎም
  rationale: ግሪኩ ሁለት ትይዩ ሐረጎችን ከεἰς ጋር ያቀርባል። ትርጉሙ የድነትን ሥርዓት በዝርዝር ሳይወስንና ምስክርነትን የሚያስመሰግን ሥራ ሳያደርግ ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በልቡ/በአፉ’ እና ‘ለጽድቅ/ለድነት’ የሚሉት ጥንዶች የምንጩን ትይዩ አወቃቀር ይጠብቃሉ።
