review_pass:
  verdict: revise
  source_fidelity: The draft retains the key lexical correspondences and the parallel movement of καρδίᾳ/στόματι and εἰς δικαιοσύνην/εἰς σωτηρίαν. However, its relative-clause construction makes the first clause mean approximately “what a person believes is for righteousness,” rather than stating that a person believes with the heart. The revision restores the Greek’s generalizing verbal assertions without adding an explanation of how belief, righteousness, confession, and salvation relate.
  naturalness: The proposed revision is idiomatic modern standard Amharic. Using finite generic verbs (ያምናል / ይመሰክራል) is clearer and more natural than the draft’s nominalized relative verbs (የሚያምነው / የሚመሰክረው).
  terminology: ጽድቅ appropriately renders δικαιοσύνη in this Pauline context, with the lexical alternative ፍትሕ retained in the footnote. ድነት is appropriate for σωτηρία. ይመሰክራል suitably conveys public verbal confession in the immediate context, while retaining a natural Amharic register.
  issues:
  - severity: high
    issue: The relative-clause/copular syntax changes the clause’s predication.
    rationale: “ሰው በልቡ የሚያምነው ለጽድቅ ነውና” grammatically foregrounds “that which/the one who believes” as the subject of “is for righteousness,” rather than translating πιστεύεται as the general assertion that one believes with the heart. The same problem recurs in the confession clause.
