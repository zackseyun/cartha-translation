lexical_decisions:
- source_word: καρδίᾳ
  choice: በልቡ
  rationale: የመሣሪያነትን ወይም የውስጣዊ ማንነትን ማመልከቻ የሆነውን ዳቲቭ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ነውና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πιστεύεται
  choice: ሰው … የሚያምነው
