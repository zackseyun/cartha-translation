- source_word: ὁμολογεῖται
  choice: ሰው … የሚመሰክረው
  rationale: በቁጥር 9 አውድ ውስጥ በአፍ የሚደረገውን ግልጽ እውቅናና ኑዛዜ ያመለክታል፤ የግሪኩን አጠቃላይ አገላለጽም ይጠብቃል።
- source_word: εἰς σωτηρίαν
  choice: ለድነት
