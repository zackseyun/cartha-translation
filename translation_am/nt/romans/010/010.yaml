- source_word: εἰς δικαιοσύνην
  choice: ለጽድቅ
  rationale: εἰς የሚያሳየውን ግብ ወይም ውጤት አጭር አድርጎ ይጠብቃል፤ ግንኙነቱንም ከልክ በላይ አይተረጉምም።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: በጳውሎስ ደብዳቤዎች የቃሉን ሕጋዊ፣ ቃል ኪዳናዊና ሥነ ምግባራዊ ስፋት ለመጠበቅ የተለመደውና ተስማሚው አማርኛ ቃል ነው።
