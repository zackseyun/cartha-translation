  rationale: የግሱን ተደራጊ ቅርጽና በላኪ ላይ ያለውን ጥገኝነት በቀጥታ ይገልጣል፤ «-ስ» ደግሞ የጥያቄውን ተከታታይ አመክንዮ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: ይህ የተለመደውን የቅዱስ ጽሑፍ ጥቅስ መግቢያ በአጭርና በክብር ያቀርባል።
- source_word: ὡραῖοι
