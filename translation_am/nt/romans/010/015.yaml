  rationale: የውበትና የደስ የሚያሰኝ መልክን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተወደደ ወይም በጊዜው የደረሰ መልእክተኛ ስሜት በማስታወሻ ተጠብቋል።
- source_word: πόδες
  choice: እግሮች
  rationale: የመልእክተኞቹን መምጣት የሚያሳየው የጥቅሱ ምስላዊ አነጋገር ሳይፈታ ተጠብቋል።
- source_word: εὐαγγελιζομένων
  choice: የሚያበስሩ
  rationale: የምሥራች ማወጅን የሚገልጽ ተፈጥሯዊና ክብር ያለው የአማርኛ አገላለጽ ነው።
