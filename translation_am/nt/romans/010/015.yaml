  rationale: የጳውሎስ የአመክንዮ ሰንሰለት መላክንና ማወጅን ያገናኛል፤ ነገር ግን ከኢሳይያስ የተወሰደው ምስል በሰፊው መልካም ዜና የሚያመጡትን ያከብራል። ትርጉሙ የተወሰነ ቤተ ክርስቲያናዊ ሹመት ሳያስገባ ሁለቱንም ይጠብቃል።
