base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: am
  text: ካልተላኩስ እንዴት ያውጃሉ? እንደተጻፈው፣ “ስለ መልካም ነገሮች ምሥራች የሚያመጡ[b] ሰዎች እግሮች እንዴት ያማሩ[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዴት ደስ የሚያሰኙ ናቸው” ወይም “እንዴት በወቅቱ የደረሱ ናቸው።” የግሪኩ ቅጽል ውበትን ብቻ ሳይሆን፣ የመልእክተኛው መምጣት ተወዳጅና በጊዜው መሆኑንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “መልካም ነገሮችን የምሥራች የሚያደርጉ/የሚያበስሩ።”
    reason: lexical_alternative
