theological_decisions:
- issue: በአውዱ የ«ጌታ» ተጠቃሽ
  choice: ቃሉ በአቅራቢያው አውድ ኢየሱስን እንደ ጌታ ከመመስከር ጋር ይያያዛል፤ ከዚሁ ጋር ጌታን ስለ መጥራት ያለውን የቅዱስ ጽሑፍ ድምፅ ይጠብቃል።
