- source_word: πλουτῶν εἰς πάντας
  choice: ለ...ሁሉ በልግስናው የበለጸገ
  rationale: የሀብትን ዘይቤ በ«የበለጸገ» ይጠብቃል፤ «በልግስናው» ደግሞ በዚህ አውድ ሀብቱ ለሚጠሩት የሚደርስ ቸርነት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: እርሱን ለሚጠሩት
