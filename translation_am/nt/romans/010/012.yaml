- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: የሁሉ ጌታ አንድ ነው
  rationale: የግሪኩን ስማዊ ዓረፍተ ነገር በተፈጥሯዊ አማርኛ ያቀርባል፤ «የሁሉ» የπάντωνን ቀጥተኛ ኃይል ይጠብቃል።
