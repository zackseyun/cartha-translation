  rationale: ሮሜ 10፥9-13 ኢየሱስን ጌታ ብሎ በመመስከር ላይ ያተኩራል፤ ትርጉሙ ተጨማሪ ማብራሪያ ሳይጨምር «ጌታ» የሚለውን ማዕረግ በማቆየት የጳውሎስን አገላለጽ ከአውዱ እንዲታወቅ ያደርጋል።
- issue: የ«ሁሉ» ወሰን
  choice: «ሁሉ» የሚለው «እርሱን ለሚጠሩት» በሚለው ሐረግ የተወሰነ ነው።
  alternative: የሁሉንም ሰው ያለምንም ገደብ መዳን እንደሚናገር መውሰድ።
  rationale: የግሪኩ ሰዋሰው ተጠቃሚዎቹን «እርሱን የሚጠሩት ሁሉ» ብሎ በግልጽ ይገልጻል፤ ትርጉሙ ለአይሁዳዊና ለግሪካዊ ያለውን እኩል ክፍትነትና የመጥራትን መግለጫ ሁለቱንም ይጠብቃል።
