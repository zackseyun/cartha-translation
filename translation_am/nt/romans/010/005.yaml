    text: “በውስጧ ይኖራል” ተብሎም ሊተረጎም ይችላል። ጳውሎስ ዘሌዋውያን 18፥5ን እያስተጋባ ነው፤ በዚያም ሰው ትእዛዛቱን በመፈጸም “በእነርሱ” እንደሚኖር ይናገራል።
    reason: alternative_reading
