  - marker: b
    text: በግሪክ የተጠቀሰው ስም በሰዋስው ወንድ ፆታ ቢሆንም፣ እዚህ ይህን የሚፈጽምን ማንኛውንም ሰው ይወክላል።
    reason: cultural_note
