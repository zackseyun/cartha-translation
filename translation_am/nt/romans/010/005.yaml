  text: ሙሴ ከሕግ ስለሚገኘው ጽድቅ[a]፣ “ይህን የሚፈጽም ሰው[b] በእርሷ ይኖራል[c]” ብሎ ይጽፋልና።
  philosophy: optimal-equivalence
