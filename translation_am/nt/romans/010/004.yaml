lexical_decisions:
- source_word: τέλος
  choice: ፍጻሜ
  rationale: «ፍጻሜ» መቋጫንም ሆነ ወደ ታሰበው ግብ መድረስን ሊያመለክት ስለሚችል፣ የግሪኩን የትርጉም ስፋት በዋናው ጽሑፍ ይጠብቃል።
- source_word: νόμου
