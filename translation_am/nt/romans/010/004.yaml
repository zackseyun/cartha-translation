  rationale: በዚህ አውድ ቃሉ ከእስራኤል ሕግና የቃል ኪዳን ተስፋ ጋር የተያያዘ ማዕረግ በመሆኑ «መሲሕ» ተብሎ ተተርጉሟል።
- source_word: εἰς δικαιοσύνην
