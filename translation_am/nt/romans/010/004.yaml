- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: «ጽድቅ» የቃሉን ሥነ ምግባራዊና የግንኙነት መስክ የሚሸፍን የተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ነው፤ «ፍትሕ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: παντὶ τῷ πιστεύοντι
  choice: ለሚያምን ሁሉ
  rationale: የግሪኩን ነጠላ አሳታፊ ቅርጽና ሁሉን አቀፍነት በግልጽ፣ ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ነውና
  rationale: ጥቅሱ ለቀደመው ሐሳብ ምክንያት ወይም ማብራሪያ መስጠቱን በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር ፍጻሜ ያሳያል።
theological_decisions:
- issue: τέλος νόμου ከሙሴ ሕግ ጋር ያለው ትርጉም
  choice: በዋናው ጽሑፍ «የሕግ ፍጻሜ»
  alternative: «የሕግ ግብ» ወይም «የሕግ ፍጹም መድረሻ»
  rationale: የግሪኩ τέλος መቋጫን፣ ግብን ወይም የፍጻሜ መድረሻን ሊያመለክት ይችላል። «ፍጻሜ» ይህን መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል፣ አማራጮቹም በማስታወሻ ቀርበዋል።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ጥቅሱ ኢየሱስን ከእስራኤል ሕግና የቃል ኪዳን ታሪክ ጋር ስለሚያያይዝ፣ የማዕረጉን ትርጉም የሚያሳየው «መሲሕ» ተመርጧል።
- issue: δικαιοσύνη በጳውሎስ አጠቃቀም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: «ጽድቅ» ዋናውን የነገረ መለኮትና የግንኙነት ትርጉም ይጠብቃል፤ «ፍትሕ» ሕጋዊና ማኅበራዊ ድምፁን ሊያጎላ ስለሚችል በማስታወሻ ተቀምጧል።
