base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: am
  text: ከእምነት የሆነው ጽድቅ[a] ግን እንዲህ ይላል፤ “በልብህ፣ ‘ወደ ሰማይ ማን ይወጣል?’ አትበል።” ይህ ማለት መሲሑን[b] ማውረድ ነው።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእምነት የሆነው ፍትሕ።” ግሪክኛው δικαιοσύνη በአውዱ እንደ “ጽድቅ” ወይም “ፍትሕ” ሊገባ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ክርስቶስ” ይላል፤ እዚህ ቃሉ እንደ ማዕረግ ስለሚያገለግል “መሲሕ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
  - marker: c
    text: ጳውሎስ ዘዳግም 30፥12ን በማስተጋባት ከመሲሑ ጋር ያዛምደዋል።
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: በሮሜ መልእክት ያለውን የጽድቅ፣ የትክክለኛ አቋምና የፍርድ አውድ ለማቆየት የተለመደውና ተስማሚው አማርኛ ቃል ነው።
- source_word: ἐκ πίστεως
  choice: ከእምነት የሆነው
  rationale: ἐκ የሚያመለክተውን ምንጭ በቀጥታ ያሳያል፤ በአውዱም በሕግ ላይ ከተመሠረተ ጽድቅ ጋር ያለውን ንፅፅር ይጠብቃል።
- source_word: οὕτως λέγει
  choice: እንዲህ ይላል
  rationale: የግሪክኛውን የአሁን ጊዜ አነጋገርና ጽድቅን እንደ ተናጋሪ የሚያቀርበውን ሰውኛ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: በልብህ … አትበል
  rationale: የጥቅሱን ውስጣዊ ንግግር፣ ሐሳብና ፈቃድ የሚያመለክተውን καρδία በቅርብና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: ወደ ሰማይ የሚወጣ ማን ነው?
  rationale: ἀναβαίνω የሚሰጠውን ወደ ላይ የመውጣት ትርጉም በግልጽ አማርኛ ይጠብቃል።
- source_word: Χριστόν
  choice: መሲሑን
  rationale: በዚህ የቅዱስ መጽሐፍ ማብራሪያ አውድ Χριστός እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚገልጸው “መሲሕ” ተመርጧል። የግሪክኛው ቅርጽ በማስታወሻ ተጠብቋል።
- source_word: καταγαγεῖν
  choice: ወደ ታች ለማውረድ
  rationale: የግሪክኛውን ወደ ታች የማምጣት አቅጣጫ በግልጽ ያሳያል፤ የአንቀጹን ማብራሪያዊ ዓላማም ይጠብቃል።
theological_decisions:
- issue: “ከእምነት የሆነው ጽድቅ” ሰውኛ ባሕርይ ተሰጥቶት መቅረቡ
  choice: “ከእምነት የሆነው ጽድቅ … ይላል” ተብሎ ተጠብቋል።
  alternative: “በእምነት ስለሚገኘው ጽድቅ እንዲህ ተብሏል” በማለት አገላለጹን ማለስለስ።
  rationale: δικαιοσύνη የλέγει ሰዋሰዋዊ ባለቤት ነው፤ የጳውሎስን ስነ ንግግራዊ ሰውኛ አቀራረብና ከቀደመው ቁጥር ጋር ያለውን ንፅፅር መጠበቅ ተገቢ ነው።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም መተርጎሙ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዘዳግም ጥቅስ ላይ በተመሠረተው የድነት ታሪክ ማብራሪያ ውስጥ ቃሉ እንደ ማዕረግ ይሠራል፤ “መሲሕ” ይህን ትርጉም ይገልጻል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የጳውሎስ ሰውኛ አገላለጽና የዘዳግም ጥቅስ ቅርጽ ተጠብቀዋል።
