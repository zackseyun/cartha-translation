  rationale: ጳውሎስ ዘዳግም 32፥21ን ይጠቅሳል። ዋናው ጽሑፍ የጥቅሱን ውጥረት ሳይፈታ ያቆያል፤ የሚቻለው ማመልከቻ በእግር ማስታወሻ ብቻ ይገለጻል።
