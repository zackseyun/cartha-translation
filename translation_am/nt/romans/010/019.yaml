  rationale: ἔγνω በቀጥታ ‘አወቀ’ ማለት ሲሆን በዐውዱ ‘የሰማውን ፍቺ ተረዳ’ የሚለውንም ሊያካትት ይችላል። የግሪኩን የአጻጻፍ ውጥረት ሳይፈታ ‘አላወቀምን?’ ተብሎ ቀርቧል።
