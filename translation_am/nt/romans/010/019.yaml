    rationale: The Greek ἔθνει denotes a people/nation. Although οὐκ is rhetorically negating its status as a nation, the phrase still designates persons. “ሕዝብ ባልሆነ ሕዝብ” preserves both the personal referent and the intentional paradox.
  revised_text: ነገር ግን እጠይቃለሁ፤ እስራኤል አላወቀምን?[a] በመጀመሪያ ሙሴ እንዲህ ይላል፦ “ሕዝብ ባልሆነ ሕዝብ አስቀናችኋለሁ፤[b] ማስተዋል በሌለው ሕዝብ አስቆጣችኋለሁ።”
