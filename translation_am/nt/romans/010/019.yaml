    text: ወይም፣ “እስራኤል አልተረዳምን?” የግሪኩ ግስ ‘ማወቅ’ ወይም ‘መረዳት’ ሊል ይችላል፤ በዚህ ዐውድ የተሰማውን ነገር ፍቺ ማስተዋልን ሊያመለክት ይችላል።
