id: ROM.10.8
reference: Romans 10:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: am
  text: ነገር ግን ምን ይላል? “ቃሉ በአጠገብህ ነው፤ በአፍህና በልብህ ነው።”[b] ይኸውም እኛ የምናውጀው የእምነት ቃል[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የእምነት መልእክት” ተብሎም ሊተረጎም ይችላል። እንዲሁም πίστις የሚለው የግሪክ ቃል በአንዳንድ አውዶች “መታመን” ወይም “ታማኝነት” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ጳውሎስ የዘዳግም 30፥14ን ንግግር በማስተጋባት ለሚታወጀው የምሥራች መልእክት ይተገብረዋል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τί λέγει
  choice: ምን ይላል?
  rationale: በግሪኩ በግልጽ ያልተጠቀሰውን ‘መጽሐፍ ቅዱስ’ የሚል ቃል ሳይጨምር፣ የጥቅሱን ሰውኛ አነጋገር ይጠብቃል።
- source_word: Ἐγγύς σου
  choice: በአጠገብህ ነው
  rationale: የቅርበትን ሥዕላዊና ዘይቤያዊ ትርጉም በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τὸ ῥῆμα
  choice: ቃሉ
  rationale: በጥቅሱና በጳውሎስ ማብራሪያ መካከል ያለውን የቃል ድግግሞሽ ይጠብቃል፤ ‘መልእክት’ የሚለው ትርጉም ቢቻልም ይበልጥ ትርጓሜያዊ ነው።
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: በአፍህና በልብህ ነው
  rationale: የምንጩን አካላዊና ውስጣዊ ምስል በቀጥታ ይጠብቃል።
- source_word: τοῦτ’ ἔστιν
  choice: ይኸውም
  rationale: ጳውሎስ ከጥቅሱ በኋላ የሚሰጠውን ማብራሪያ በአጭርና ተፈጥሯዊ መንገድ ያስተዋውቃል።
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: የእምነት ቃል
  rationale: ῥῆμα የሚለውን ‘ቃል’ ብሎ በመድገም የጽሑፉን ትስስር ይጠብቃል፤ የግሪኩን ጥቅጥቅ ያለ አገላለጽም ትርጉሙን ከልክ በላይ ሳይወስን ያስቀምጣል።
- source_word: ὃ κηρύσσομεν
  choice: እኛ የምናውጀው
  rationale: κηρύσσω ያለውን ይፋዊ የማወጅ ሐሳብ ያሳያል፤ የብዙ ቁጥር ተናጋሪውንም በግልጽ ይጠብቃል።
theological_decisions:
- issue: በτὸ ῥῆμα τῆς πίστεως ውስጥ πίστεως የሚለው አተረጓጎም
  choice: እምነት
  alternative: መታመን፣ ታማኝነት
  rationale: በዚህ አውድ ‘እምነት’ የጳውሎስን የተለመደ አጠቃቀም በሰፊው ይይዛል፤ የዘርፉን ግንኙነት የመልእክቱ ይዘት ወይም ባሕርይ ብሎ ከልክ በላይ አይወስንም። ሌሎቹ ሊሆኑ የሚችሉ ፍቺዎች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዘዳግምን ጥቅስ ምስላዊ አነጋገር ለመጠበቅ ‘አፍ’፣ ‘ልብ’ እና ‘ቃል’ በቀጥታ ተተርጉመዋል። የማስታወሻ ምልክቶቹ ከሚያብራሩት አገላለጽ ጋር በቀጥታ እንዲያያዙ ተቀምጠዋል።
