  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: am
  text: እንግዲህ እምነት ከመስማት ይመጣል፤ መስማትም በመሲሑ ቃል[a] በኩል ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ መሲሑ በሚነገረው ቃል” ወይም “መሲሑን በሚመለከተው መልእክት።” የግሪኩ የግንኙነት ቅርጽ ከአንድ በላይ መንገድ ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: እንግዲህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና በዘመናዊ አማርኛ ያመለክታል።
- source_word: πίστις
  choice: እምነት
  rationale: በአውዱ የተሰበከውን መልእክት በመስማት የሚነሣውን የሰው ምላሽ ያመለክታል፤ እዚህ ዋናው ትርጉም ‘ታማኝነት’ አይደለም።
- source_word: ἐξ ἀκοῆς
  choice: ከመስማት ይመጣል
  rationale: ἐξ ምንጭን ወይም መነሻን ያመለክታል፤ በግሪኩ ያልተገለጸው ግስ በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን ‘ይመጣል’ ተብሎ ተሟልቷል።
- source_word: ἀκοή
  choice: መስማት
  rationale: ቃሉ የመስማትን ድርጊት ወይም የተሰማውን መልእክት ሊያመለክት ይችላል፤ እዚህ ‘መስማት’ በሁለቱም ሐረጎች የግሪኩን ድግግሞሽ ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: ጠንካራ ተቃርኖ ሳይፈጥር ሁለተኛውን ሐረግ ከመጀመሪያው ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: διὰ
  choice: በ…በኩል
  rationale: ከተከታዩ የግሪክ ስም ቅርጽ ጋር መንገድን ወይም አማካይነትን ያመለክታል።
- source_word: ῥήματος
  choice: ቃል
  rationale: ῥῆμα የተነገረ ቃልን ወይም ንግግርን ሊያመለክት ይችላል፤ ‘ቃል’ የምንጩን ቅርጽና የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός እዚህ የማዕረግ ስም ስለሆነ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የአማርኛው ባለቤትነት ቅርጽ ‘የመሲሑ ቃል’ የግሪኩን የትርጉም ስፋት በመጠኑ ይጠብቃል።
theological_decisions:
- issue: በዚህ አውድ የπίστις ትርጉም
  choice: እምነት
  alternative: መታመን፤ ታማኝነት
  rationale: የቅርብ አውዱ የሚያተኩረው ለተሰበከው ወንጌል በሚሰጠው የሰው ምላሽ ላይ ነው፤ ‘እምነት’ ይህን ያለ ተጨማሪ የእምነት ክፍል ትርጓሜ ያስተላልፋል።
- issue: በῥήματος Χριστοῦ ውስጥ ያለው የΧριστοῦ ግንኙነት
  choice: የመሲሑ ቃል
  alternative: ስለ መሲሑ የሚነገረው ቃል፤ መሲሑን የሚመለከተው መልእክት
  rationale: የግሪኩ ቅርጽ ቃሉ ከመሲሑ የመጣ መሆኑን ወይም ስለ መሲሑ የሚናገር መሆኑን ሊያመለክት ይችላል። ዋናው ጽሑፍ መደበኛውንና በአንጻራዊነት ቀጥተኛውን አተረጓጎም ሲጠብቅ፣ ሌላውን ንባብ የግርጌ ማስታወሻው ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ጥቅም ላይ ውሏል። የግሪኩ ትይዩ አወቃቀርና ‘መስማት’ የሚለው ድግግሞሽ ተጠብቋል።
