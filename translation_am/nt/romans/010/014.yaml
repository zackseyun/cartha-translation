revisions:
- from: እንግዲህ ባላመኑበት እንዴት ይጠሩታል? ስለ እርሱ ሳይሰሙስ እንዴት ያምናሉ?[a] የሚሰብክም ከሌለ እንዴት ይሰማሉ?
  to: እንግዲህ በእርሱ ያላመኑትን እንዴት ይጠሩ? ስለ እርሱ ሳይሰሙስ እንዴት ያምናሉ? የሚሰብክ ሰው ከሌለስ እንዴት ይሰማሉ?
  rationale: The revision preserves the three parallel rhetorical questions and their logical progression. It clarifies the first relative clause, retains the source's faith vocabulary, and removes a footnote whose proposed Amharic alternative introduces a less faithful sense. No footnote is needed because «ስለ እርሱ ሳይሰሙ» is the normal Amharic expression for the intended genitive relation.
