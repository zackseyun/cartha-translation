id: ROM.10.14
reference: Romans 10:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: am
  text: እንግዲህ በእርሱ ያላመኑትን እንዴት ይጠሩ? ስለ እርሱ ሳይሰሙስ እንዴት ያምናሉ? የሚሰብክ ሰው ከሌለስ እንዴት ይሰማሉ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: እንግዲህ … እንዴት
  rationale: የοὖνን ከቀደመው ሐሳብ ጋር የሚያያዝ ድምዳሜያዊ ኃይልና የጥያቄውን አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπικαλέσωνται
  choice: ይጠሩታል
  rationale: እዚህ ἐπικαλέω ጌታን ለእርዳታና ለድነት መጥራትን ያመለክታል፤ የአማርኛው አገላለጽ ከቁጥር 13 ጋር ያለውን ቃላዊ ትስስር ይጠብቃል።
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: ባላመኑበት
  rationale: πιστεύω εἰς የሚያመለክተውን በእርሱ ማመን በተፈጥሯዊና አጭር የአማርኛ አንጻራዊ አወቃቀር ይገልጣል።
- source_word: πιστεύσωσιν
  choice: ያምናሉ
  rationale: በΠῶς የተጀመረውን የንግግር ጥያቄ በተፈጥሯዊ የአማርኛ ወደፊት አመልካች ይወክላል፤ πιστεύωንም በመደበኛው «ማመን» ይተረጉማል።
- source_word: οὗ οὐκ ἤκουσαν
  choice: ስለ እርሱ ሳይሰሙ
  rationale: የግሪኩ የዝምድና ተውላጠ ስም በዚህ አገባብ ስለ ክርስቶስ የሚነገረውን መስማት ሊያመለክት ይችላል፤ «ስለ እርሱ» በአማርኛ ግልጽና ተፈጥሯዊ ነው። ሌላው ሊሆን የሚችለው ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἀκούσωσιν
  choice: ይሰማሉ
  rationale: የመስማትን ቀጥተኛ ትርጉምና ከቀደመው ἤκουσαν ጋር ያለውን ቃላዊ ትስስር ይጠብቃል።
- source_word: χωρὶς κηρύσσοντος
  choice: የሚሰብክም ከሌለ
  rationale: κηρύσσοντος ሰባኪነትን እንደ ሹመት ሳይሆን የማወጅን ተግባር የሚያጎላ አሳታፊ ግስ ነው፤ ይህ አገላለጽ ተግባሩን በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የπιστεύω የእምነት ቋንቋ
  choice: ማመን
  alternative: መታመን / እምነት ማድረግ
  rationale: «ማመን» የπιστεύω መደበኛና ተፈጥሯዊ የአማርኛ አቻ ሲሆን ጽሑፉ ያልገለጸውን ልዩ የእምነት ትርጉም አይጨምርም።
- issue: በοὗ οὐκ ἤκουσαν ውስጥ የመስማት ነገር
  choice: ስለ እርሱ ሳይሰሙ
  alternative: እርሱን ሳይሰሙ
  rationale: የዝምድና ተውላጠ ስሙ ስለ እርሱ የተነገረውን መስማት ወይም እርሱን ራሱን መስማት የሚል አሻሚነት ይፈቅዳል። ዋናው ጽሑፍ በአገባቡ የተለመደውን «ስለ እርሱ» ይጠቀማል፤ ሌላውን ንባብ ግን በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱ ተከታታይ የንግግር ጥያቄዎችና ከማመን ወደ መጥራት፣ ከመስማት ወደ ማመን፣ ከመስበክ ወደ መስማት ያለው ምክንያታዊ ሰንሰለት ተጠብቋል።
