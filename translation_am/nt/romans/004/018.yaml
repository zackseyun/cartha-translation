  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ“ተስፋ ... በተስፋ” ድግግሞሽ የግሪኩን አያዎ ንጽጽር ለማቆየት ሆን ተብሎ ተጠብቋል።
