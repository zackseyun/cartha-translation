base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: am
  text: እርሱም ተስፋ በማይኖርበት ሁኔታ[a] በተስፋ አመነ፤ ይህም፣ “ዘርህ እንዲሁ ይሆናል” ተብሎ በተነገረው መሠረት፣ የብዙ ሕዝቦች አባት እንዲሆን ነበር።[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተስፋን በሚቃረን ሁኔታ” ወይም “ከተስፋ ባሻገር።”
    reason: lexical_alternative
  - marker: b
    text: ከዘፍጥረት 15፥5 የተጠቀሰ፤ ዘፍጥረት 17፥5ንም ያነጻጽሩ።
    reason: cross_reference
  - marker: c
    text: “ዘርህ” የግሪኩን ነጠላ የስብስብ ምስል ይጠብቃል፤ ወይም “ትውልድህ” ወይም “ዘሮችህ” ሊባል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: ተስፋ ሊደረግበት በማይችልበት ሁኔታ
  rationale: παρά ከወደቀ ተሳቢ ጋር የተለመደውን ተስፋ ወይም ግምት የሚቃረን ሁኔታ ያመለክታል። ይህ አተረጓጎም የግሪኩን አያዎ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπ’ ἐλπίδι
  choice: በተስፋ
  rationale: አብርሃም ያመነበትን ሁኔታ ወይም መሠረት ያሳያል፤ ከቀደመው ተስፋ አልባ ሁኔታ ጋር ያለውን አያዎ ንጽጽርም ያቆያል።
- source_word: ἐπίστευσεν
  choice: አመነ
  rationale: የπιστεύωን ቀጥተኛ የእምነት ቃላዊ ግንኙነት ይጠብቃል፤ ተጨማሪ ትርጓሜም አያስገባም።
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: እንዲሆን
  rationale: የεἰς τό ከኢንፊኒቲቭ ጋር ያለውን የዓላማ ወይም የውጤት አሻሚነት ሳያጠፋ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: የብዙ ሕዝቦች አባት
  rationale: ἔθνη በዘፍጥረት የተስፋ ቃል ዐውድ ብዙ ሕዝቦችን ወይም ብሔራትን ያመለክታል፤ አይሁድ ያልሆኑት ብቻ ብሎ አያጠብም።
- source_word: κατὰ τὸ εἰρημένον
  choice: ተብሎ በተነገረው መሠረት
  rationale: የቀድሞውን መለኮታዊ ንግግርና ቀጣይ ተፈጻሚነቱን በክብር ያቀርባል።
- source_word: Οὕτως ἔσται
  choice: እንዲሁ ይሆናል
  rationale: የጥቅሱን ትንቢታዊ አገላለጽ በዘመናዊና የተከበረ አማርኛ ያስተላልፋል።
- source_word: τὸ σπέρμα σου
  choice: ዘርህ
  rationale: የσπέρμαን ነጠላ የስብስብ ምስል በቀጥታ ይጠብቃል፤ በአማርኛም ዘርንና ትውልድን ሊያመለክት ይችላል።
theological_decisions:
- issue: በአብርሃም የተስፋ ቃል ውስጥ የπολλῶν ἐθνῶν ማጣቀሻ
  choice: “ብዙ ሕዝቦች” ተብሎ ተተርጉሟል።
  alternative: “ብዙ አሕዛብ” ወይም “ብዙ ብሔራት”
  rationale: ጳውሎስ የዘፍጥረትን የአብርሃም ተስፋ ቃል እያስተጋባ ነው። “አሕዛብ” የአይሁድና የአሕዛብን ንጽጽር ከሚገባው በላይ ሊያስገባ ስለሚችል፣ “ሕዝቦች” የብሉይ ኪዳኑን ሰፊ ዐውድ ይጠብቃል።
- issue: የεἰς τὸ γενέσθαι ዓላማ ወይም ውጤት
  choice: “እንዲሆን” ተብሎ ዓላማንም ውጤትንም ሊሸከም በሚችል አገላለጽ ቀርቧል።
  alternative: “በዚህም ... ሆነ”
  rationale: የግሪኩ አወቃቀር ዓላማን ወይም ውጤትን ሊያመለክት ስለሚችል፣ ትርጉሙ አንዱን ብቻ አይወስንም።
