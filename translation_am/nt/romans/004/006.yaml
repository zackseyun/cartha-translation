theological_decisions:
- issue: በἀνθρώπου ያለው ተወካይ ነጠላ አገላለጽ
  choice: ሰው
  alternative: ወንድ ሰው
  rationale: ἀνθρώπου እዚህ አንድን ወንድ ብቻ ሳይሆን ተወካይ ሰውን ያመለክታል፤ «ሰው» ይህን ነጠላነትና ሰፊ ማጣቀሻ በአማርኛ በትክክል ይይዛል።
- issue: የጳውሎስ δικαιοσύνη
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: «ጽድቅ» በዚህ የመቁጠር ዐውድ ውስጥ የጳውሎስን አገላለጽ በተሻለ ሁኔታ ይጠብቃል፤ «ፍትሕ» የቃሉ ሌላ ክፍል ቢሆንም እዚህ ዋና ንባብ አይደለም።
- issue: λογίζεται እንደ መቁጠር ወይም መመዝገብ
  choice: ይቆጥርለታል
  alternative: ይመዘግብለታል
  rationale: «ይቆጥርለታል» የግሪኩን ሒሳባዊ ምሳሌ በቀጥታ ይጠብቃል፤ በማን መለያ ላይ እንደተመዘገበ ከሚያመለክተው «ይመዘግብለታል» ጋር ትርጉሙ ይቀራረባል።
