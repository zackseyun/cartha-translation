lexical_decisions:
- source_word: παρεδόθη
  choice: አሳልፎ ተሰጠ
  rationale: የግሪኩን ተደራጊ አቀራረብ የሚጠብቅና ለዘመናዊ አንባቢ ተፈጥሯዊ የሆነ አገላለጽ ነው፤ አድራጊውንም ጽሑፉ እንዳልጠቀሰ ሳይጨምር ይተዋል።
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: ስለ በደሎቻችን
  rationale: διά ከተሳቢ ጋር በዚህ የመጀመሪያ ሐረግ ምክንያትን ያመለክታል፤ «ስለ» ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παραπτώματα
  choice: በደሎች
  rationale: ሕግን ወይም ትክክለኛውን መንገድ የመተላለፍን ሥነ ምግባራዊ ኃጢአት ይገልጣል፤ ከአጠቃላዩ «ኃጢአቶች» ይልቅ παράπτωμαን በቅርብ ይወክላል።
- source_word: ἠγέρθη
  choice: ከሞት ተነሣ
  rationale: ቀላሉን ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በዐውዱ የትንሣኤ ትርጉም ግልጽ እንዲሆን «ከሞት» ተጨምሯል።
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: እኛንም ጻድቃን ለማድረግ
  rationale: ዋናውን የዓላማ/ውጤት ንባብ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ በምክንያት የሚያነበው ሰዋሰዋዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: δικαίωσιν
  choice: ጻድቃን ማድረግ
  rationale: የፍርድ ቤታዊውን ትርጉም—ጻድቅ ተብሎ መቈጠርን ወይም ነፃ መባልን—ለመደበኛ አንባቢ በቀጥታ ያስተላልፋል፤ አማራጭ ቃላት በማስታወሻ ተገልጸዋል።
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν ዓላማ/ውጤትን («ለጽድቃችን») ወይስ ምክንያትን («በጽድቃችን ምክንያት») ያመለክታል?
  choice: እኛንም ጻድቃን ለማድረግ
  alternative: ጻድቃን ስለተደረግን
  rationale: የዓላማ/ውጤት ንባብ የመሲሑን ትንሣኤ ከአማኞች ጽድቅ ጋር በቀጥታ ያያይዛል፤ ሆኖም διά ከተሳቢ ጋር ምክንያታዊ ንባብንም ሊፈቅድ ስለሚችል ያ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሰረዝ ነጥቡ የግሪኩን ትይዩ አወቃቀር ያጎላል፤ «እርሱም» የግሪኩን ὃς ከቀዳሚው ዐውድ ጋር ያገናኛል።
