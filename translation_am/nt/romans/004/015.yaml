  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: am
  text: ሕግ[a] ቁጣን ያመጣልና፤ ሕግ በሌለበት ግን መተላለፍ[b] የለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሕጉ»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ሕግን መጣስ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ሕግ
  rationale: የግሪክኛውን ቃል ሰፊ ትርጉም ለመጠበቅና እዚህ ላይ የሙሴን ሕግ ብቻ እንዲያመለክት አስቀድሞ ላለመወሰን፣ በዋናው ጽሑፍ «ሕግ» ተብሏል።
- source_word: ὀργή
  choice: ቁጣ
  rationale: በጳውሎስ አጠቃቀም ያለውን የፍርድና የመለኮታዊ ቅጣት ክብደት ሳያጠፋ በተፈጥሯዊ አማርኛ የሚገልጽ ቃል ነው።
- source_word: κατεργάζεται
  choice: ያመጣል
  rationale: ሕግ ቁጣን የሚያስከትል መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὗ δὲ
  choice: በሌለበት ግን
  rationale: የቦታዊውን አንጻራዊ አገባብና የδέን ለስላሳ ተቃርኖ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: παράβασις
  choice: መተላለፍ
  rationale: የታወቀን ድንበር ወይም ትእዛዝ የመጣስን ሐሳብ ይይዛል፤ ይህም ሕግ ከሌለ መተላለፍ እንደሌለ ከሚለው የጳውሎስ ነጥብ ጋር ይስማማል።
theological_decisions:
- issue: በጳውሎስ ክርክር ውስጥ የνόμος ወሰን
  choice: ሕግ
  alternative: ሕጉ
  rationale: ዋናው ጽሑፍ ሐሳቡን ወዲያውኑ በሙሴ ሕግ ብቻ ሳይገድብ፣ በትእዛዝና በመተላለፍ መካከል ያለውን ሰፊ መርሕ ይጠብቃል፤ የሙሴ ሕግ ዳራ ግን አልተካደም።
- issue: ቁጣው የማን እንደሆነ
  choice: ቁጣን
  alternative: የእግዚአብሔርን ቁጣ
  rationale: የግሪክኛው ጽሑፍ ባለቤቱን በግልጽ ስለማይጠቅስ፣ ትርጉሙ የእግዚአብሔር ቁጣ ነው ብሎ በጽሑፉ ውስጥ አልጨመረም፤ የነገሩ መለኮታዊና የፍርድ ክብደት ግን በ«ቁጣ» ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ያመጣል» ተፈጥሯዊ ንባብን ሲሰጥ፣ «መተላለፍ» የጽሑፉን ሕጋዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
