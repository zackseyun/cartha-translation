id: ROM.4.9
reference: Romans 4:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: am
  text: 'እንግዲህ ይህ በረከት ለተገረዙት ብቻ ነውን? ወይስ ላልተገረዙትም ጭምር? ምክንያቱም፣ “የአብርሃም እምነት እንደ ጽድቅ[a] ተቈጠረለት” እንላለን።


    [a] ወይም፣ “ፍትሕ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ።”
    reason: δικαιοσύνη በአንዳንድ አውዶች “ፍትሕ” ተብሎ ሊተረጎም ይችላል፤ እዚህ ግን “ጽድቅ” የጳውሎስን የክርክር አውድ ይበልጥ ይስማማል።
lexical_decisions:
- source_word: μακαρισμός
  choice: በረከት
  rationale: በዚህ አውድ ቃሉ በሮሜ 4፥6-8 የተገለጸውን የተባረከ ሁኔታ ይመለከታል፤ “በረከት” ተፈጥሯዊና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: περιτομή
  choice: የተገረዙት
  rationale: የግሪኩ ስም በቀጥታ “ግርዛት” ማለት ቢሆንም፣ እዚህ በግርዛት ምልክት የታወቁትን ሰዎች በዘይቤ ይወክላል።
- source_word: ἀκροβυστία
  choice: ያልተገረዙት
  rationale: ቃሉ እዚህ ያለመገረዝን ሁኔታ ብቻ ሳይሆን ያልተገረዙ ሰዎችን ይወክላል።
- source_word: πίστις
  choice: እምነት
  rationale: በዚህ የዘፍጥረት ጥቅስና በጳውሎስ ክርክር ውስጥ “እምነት” የቃሉን ዋና ትርጉም በግልጽ ያስተላልፋል።
- source_word: ἐλογίσθη
  choice: ተቈጠረለት
  rationale: ይህ አተረጓጎም የλογίζομαιን የመቁጠር ምስል ይጠብቃል፤ የግሪኩን ተደራጊ አቀራረብና ለአብርሃም መቈጠሩንም ያሳያል።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: “ጽድቅ” በጳውሎስ ክርክር ውስጥ ያለውን ትርጉምና አብርሃም በእግዚአብሔር ፊት ያለውን አቋም በተለመደ የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ያስተላልፋል፤ “ፍትሕ” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: εἰς δικαιοσύνην
  choice: እንደ ጽድቅ
  rationale: “እንደ ጽድቅ” እምነቱ ከጽድቅ አንጻር መቈጠሩን ያሳያል፤ ጥቅሱ ከሚናገረው በላይ የሥነ መለኮት ማብራሪያ አይጨምርም።
theological_decisions:
- issue: የአብርሃም እምነትና ጽድቅ ግንኙነት
  choice: “የአብርሃም እምነት እንደ ጽድቅ ተቈጠረለት።”
  alternative: “የአብርሃም እምነት ለጽድቅ ተቈጠረለት።”
  rationale: የተመረጠው አተረጓጎም የግሪኩን የመቁጠር ቋንቋ ይጠብቃል፤ ጥቅሱ ራሱ የማይገልጸውን ሙሉ የሥነ መለኮት ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ብቻ” እና “ጭምር” በግሪኩ ጥያቄ ውስጥ ያለውን የቡድኖቹን ንጽጽር በተፈጥሯዊ አማርኛ ግልጽ ያደርጋሉ።
