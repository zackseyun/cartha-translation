  naturalness: 'The revision uses natural modern Amharic and makes the paired alternatives fully parallel: “ተገርዞ ሳለ / ሳይገረዝ ሳለ.” Modern spelling “ተቆጠረለት” is used.'
  terminology: “ተቆጠረለት” suitably renders λογίζομαι in the Romans 4 context without forcing a financial sense. The footnote gives restrained lexical alternatives and does not add theological interpretation.
  issues:
