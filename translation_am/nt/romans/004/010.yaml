base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: am
  text: ታዲያ እንዴት ተቆጠረለት?[a] ተገርዞ ሳለ ነው ወይስ ሳይገረዝ ሳለ? ተገርዞ ሳለ አይደለም፤ ሳይገረዝ ሳለ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተቆጠረለት” ፋንታ “ተመዘገበለት” ወይም “እንደ ሆነ ታሰበለት” ሊል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: ታዲያ እንዴት
  rationale: የጥያቄውን ሁኔታዊ ኃይልና οὖν በክርክሩ ውስጥ ያለውን የመደምደሚያ/የቀጣይነት ሚና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐλογίσθη
  choice: ተቈጠረለት
  rationale: የλογίζομαιን ተገብሮ ቅርጽ እና ለአብርሃም እንደ ጽድቅ የመቈጠሩን አውድ ይጠብቃል፤ አማራጭ ትርጉሞችም በማስታወሻ ተጠቅሰዋል።
- source_word: ἐν περιτομῇ ὄντι
  choice: በተገረዘበት ጊዜ
  rationale: ቃል በቃል ‘በግርዛት ውስጥ ሳለ’ ከማለት ይልቅ የአብርሃምን ሁኔታና የጊዜ ጥያቄ በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν ἀκροβυστίᾳ
  choice: ሳይገረዝ ሳለ
  rationale: በዚህ አውድ ἀκροβυστία ያለመገረዝን ሁኔታ ያመለክታል፤ ምርጫው ከ‘በተገረዘበት ጊዜ’ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አገላለጽ ያቆያል።
- source_word: οὐκ ... ἀλλ’
  choice: አይደለም፤ ... ነው
  rationale: የግሪኩን ግልጽ ‘አይደለም ... ነገር ግን ...’ ተቃርኖ በአማርኛ በጠንካራና ተፈጥሯዊ አረፍተ ነገር ያስተላልፋል።
