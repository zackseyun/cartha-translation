    issue: The expression “በተገረዘበት ጊዜ” may be read as the time of the circumcision event.
    rationale: ἐν περιτομῇ ὄντι denotes Abraham’s condition of being circumcised, contrasted with being uncircumcised. “ተገርዞ ሳለ” expresses that state directly and parallels the following clause.
  - severity: low
    issue: The draft uses the less usual modern spelling “ተቈጠረለት.”
    rationale: “ተቆጠረለት” is the standard contemporary orthography and retains the same meaning.
