  - marker: b
    text: አንዳንዶች “በሥጋ” የሚለውን ከ“አግኝቷል” ጋር ያያይዙታል፤ በዚህ ንባብ ጥያቄው፣ አብርሃም በሰብአዊ አቅም ወይም ከሰብአዊ አመለካከት ምን አግኝቷል የሚል ነው።
