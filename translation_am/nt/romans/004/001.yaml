  choice: -ችን
  rationale: ‘የቀድሞ አባታችን’ ውስጥ በባለቤትነት ቅጥያ ተገልጦ፣ ጳውሎስ ራሱንና አንባቢዎቹን ከአብርሃም ጋር በጋራ ማያያዙን ይጠብቃል።
- source_word: κατὰ σάρκα
  choice: በሥጋ
  rationale: የጳውሎስን አጭርና ትርጉም የተሸከመ አገላለጽ ይጠብቃል። በዋናው አቀራረብ አካላዊ የዘር ግንኙነትን ያመለክታል፤ ይበልጥ ግልጽ አማራጭ በማስታወሻ ተሰጥቷል።
theological_decisions:
- issue: የκατὰ σάρκα (‘በሥጋ’) ሰዋሰዋዊ ወሰን
  choice: ‘በሥጋ’ ከ‘የቀድሞ አባታችን’ ጋር እንዲያያዝና አብርሃም አካላዊ የዘር አባት መሆኑን እንዲገልጽ ቀርቧል።
  alternative: ሐረጉ ከ‘እንዳገኘ’ ጋር ተያይዞ፣ አብርሃም በሰብአዊ አቅም ወይም ከሰብአዊ አመለካከት ምን እንዳገኘ የሚጠይቅ ሊሆን ይችላል።
  rationale: ‘አብርሃም፣ የቀድሞ አባታችን’ የሚለው ተጨማሪ መግለጫ ሐረጉን ከዘር ግንኙነት ጋር ማያያዙን ይደግፋል። ሆኖም የግሪኩ የቃላት አቀማመጥ ሁለተኛውን ንባብ ፈጽሞ ስለማይዘጋው አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። ‘በሥጋ’ የሚለው የጳውሎስ አገላለጽ ሆን ተብሎ በዋናው ጽሑፍ ተጠብቋል፤ በዚህ ዐውድ የኃጢአተኛ ባሕርይን ሳይሆን አካላዊ የዘር ግንኙነትን ያመለክታል።
