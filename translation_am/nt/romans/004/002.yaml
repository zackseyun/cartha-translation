- source_word: Ἀβραὰμ
  choice: አብርሃም
  rationale: በአማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: ἐξ ἔργων
  choice: በሥራዎች
  rationale: ሥራዎችን የመጽደቅ መሠረት አድርጎ የሚያቀርበውን ἐκ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ἐδικαιώθη
  choice: ጸድቆ ቢሆን
  rationale: የግሪኩን ሁኔታዊ አቀራረብ ይጠብቃል፤ የፍርድ ቤት ትርጉሙን ‘ጻድቅ ተብሎ ቢፈረድለት’ በሚለው አማራጭ ማስታወሻ ያሳያል።
- source_word: ἔχει καύχημα
