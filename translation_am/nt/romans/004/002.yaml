  rationale: የκαύχημαን ስማዊ ኃይል ሳያጠፋ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: ነገር ግን በእግዚአብሔር ፊት አይደለም
  rationale: πρὸς θεόν በዚህ አውድ የእግዚአብሔርን ግምገማ ወይም ፊት ያመለክታል፤ ይህ አተረጓጎም ንጽጽሩን በግልጽ ይጠብቃል።
theological_decisions:
- issue: ሁኔታዊው ንግግር እውነተኛ ክስተትን ወይስ መላምታዊ ሐሳብን እንደሚያቀርብ
  choice: “አብርሃም በሥራዎች ጸድቆ ቢሆን” ተብሎ ያለ ተጨማሪ ትርጓሜ ቀጥታ ተተርጉሟል።
  alternative: “አብርሃም በሥራዎች ጸድቆ ቢሆን ኖሮ” ወይም “በእርግጥ በሥራዎች ጸድቆ ከሆነ”
  rationale: የግሪኩ εἰ ሁኔታዊ አቀራረብ ብቻውን ተጠብቋል። የጳውሎስን ቀጣይ መደምደሚያ በዚህ ሐረግ ውስጥ ቀድሞ ማስገባት የጽሑፉን ውጥረት ያስወግዳል።
- issue: ἐδικαιώθη እንደ ለውጥ ወይስ እንደ ፍርድ መግለጫ መተርጎም
  choice: በዋናው ጽሑፍ “ጸድቆ” የሚለው የተለመደ ሰፊ ቃል ተጠቅሟል።
  alternative: “ጻድቅ ተብሎ ቢፈረድለት”
  rationale: ዋናው አተረጓጎም የጳውሎስን ቃላዊ ትስስር ይጠብቃል፤ ሕጋዊ/ፍርዳዊ ንባቡ ግን እንደ ትክክለኛ አማራጭ በማስታወሻ ተቀምጧል።
