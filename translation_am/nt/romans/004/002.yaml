  text: 'ምክንያቱም አብርሃም በሥራዎች ጸድቆ ቢሆን[a]፣ የሚመካበት ነገር አለው[b]፤ ነገር ግን በእግዚአብሔር ፊት አይደለም።


    [a] ወይም፦ “ጻድቅ ተብሎ ቢፈረድለት።”

    [b] ወይም፦ “ለመመካት ምክንያት አለው።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ጻድቅ ተብሎ ቢፈረድለት።”
