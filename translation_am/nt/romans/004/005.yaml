review_pass:
  verdict: revise
  source_fidelity: The draft conveys the works/faith contrast and the accounting result, but it unnecessarily supplies “God,” although the Greek says only “the one who justifies,” and its rendering of δικαιόω should retain clearer lexical continuity with δικαιοσύνη. The dative/passive construction is also more directly represented without the added beneficiary suffix.
  naturalness: The proposed revision is natural, modern standard Amharic and retains a dignified biblical register. “በ… ላይ ለሚያምነው” naturally expresses πιστεύειν ἐπί.
  terminology: Use ማጽደቅ for δικαιόω and ጽድቅ for δικαιοσύνη to preserve Paul's key-term connection. ኃጢአተኛ retains the established, comprehensible Amharic rendering for ἀσεβής, though it is somewhat broader than “ungodly.”
  issues:
  - severity: medium
    issue: “በእግዚአብሔር” is added to the main text.
    rationale: God is inferable from the immediate literary context, but τὸν δικαιοῦντα does not name God in this verse. The translation should not make the implicit referent explicit where it is not necessary for Amharic grammar.
  - severity: medium
    issue: “ጻድቅ ብሎ በሚቆጥረው” weakens the δικαιόω/δικαιοσύνη lexical connection and duplicates the later accounting imagery.
    rationale: “በሚያጸድቀው” preserves the key Pauline term without forcing a doctrinal explanation; λογίζεται should carry the distinct counting/reckoning language.
  - severity: low
    issue: “ጽድቅ ሆኖ ይቆጠርለታል” adds a beneficiary suffix and can sound more like identity than the Greek accounting idiom.
    rationale: “እንደ ጽድቅ ይቆጠራል” directly expresses being counted as righteousness.
  revised_text: ለማይሠራው ግን፣ ኃጢአተኛውን በሚያጸድቀው ላይ ለሚያምነው፣ እምነቱ እንደ ጽድቅ ይቆጠራል።
