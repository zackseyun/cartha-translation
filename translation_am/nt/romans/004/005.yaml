id: ROM.4.5
reference: Romans 4:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: am
  text: ለማይሠራው ግን፣ ኃጢአተኛውን በሚያጸድቀው ላይ ለሚያምነው፣ እምነቱ እንደ ጽድቅ ይቆጠራል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: ለማይሠራው
  rationale: የግሪኩን ስም ሆኖ የቀረበ ተሳቢ አጭርና ተፈጥሯዊ በሆነ መንገድ ይጠብቃል፤ በአውዱም ከማመን ጋር ያለውን ንጽጽር እንጂ ሥራን ሁሉ የሚኮንን አያደርገውም።
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: ይልቁንም ... በእግዚአብሔር ለሚያምነው
  rationale: “ማመን” የπίστις/πιστεύωን የቃል ቤተሰብ ይጠብቃል፤ ἐπί የሚገልጸውን መደገፍና መታመንም በተፈጥሯዊ አማርኛ ያስተላልፋል። በግሪኩ ያልተጠቀሰው “እግዚአብሔር” በአማርኛ የአመልካቹን ማንነት ግልጽ ለማድረግ ከአውዱ ተሟልቷል።
- source_word: τὸν δικαιοῦντα
  choice: ጻድቅ ብሎ በሚቆጥረው
  rationale: δικαιόω በዚህ የጳውሎስ ክርክር ያለውን የፍርድ መግለጫ ኃይል ያስተላልፋል፤ “የሚያጸድቀው” ከሚለው ይልቅ ለዘመናዊ አንባቢ ግልጽ ሲሆን የሥነ መለኮት ሥርዓትን አያስገባም።
- source_word: τὸν ἀσεβῆ
  choice: ኃጢአተኛውን
  rationale: ἀσεβής እግዚአብሔርን የማያከብርን ወይም የማይፈራን ሰው ያመለክታል። “ኃጢአተኛ” በአማርኛ የተለመደና በአውዱ ግልጽ ነው።
- source_word: λογίζεται
  choice: ይቆጠርለታል
  rationale: የλογίζομαιን የመቁጠር/የመመዝገብ አሳብ ይጠብቃል፤ የጥቅሙ ተቀባይ ማንነትም በ“-ለታል” ግልጽ ይሆናል።
- source_word: ἡ πίστις αὐτοῦ
  choice: እምነቱ
  rationale: πίστις ከπιστεύω ጋር ያለውን የቃል ግንኙነት በ“ያምናል/እምነት” ይጠብቃል፤ በዚህ አውድ “ታማኝነት” ከማለት ይልቅ የማመንን አቋም ይገልጻል።
- source_word: εἰς δικαιοσύνην
  choice: ጽድቅ ሆኖ
  rationale: λογίζομαι ... εἰς የሚለውን “እንደ አንድ ነገር መቆጠር” ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: δικαιοσύνη በጳውሎስ ክርክር ቁልፍ ቃል ስለሆነ “ጽድቅ” የተለመደውን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ትስስር ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የጽድቅ ክርክር ውስጥ δικαιοῦνταን መተርጎም
  choice: ጻድቅ ብሎ በሚቆጥረው
  alternative: በሚያጸድቀው
  rationale: ዋናው ንባብ የግሱን የፍርድ መግለጫ ገጽታ በግልጽ አማርኛ ይይዛል፣ ነገር ግን የጽድቅ ሂደትን ወይም የአንድ ወገን ልዩ የሥነ መለኮት አቋምን አይጨምርም።
- issue: πίστις/πιστεύωን በአከራካሪ የሥነ መለኮት አውድ መተርጎም
  choice: እምነት / ማመን
  alternative: መታመን / መደገፍ
  rationale: የቃል ቤተሰቡን ወጥነት ይጠብቃል፤ በቅርብ አውዱ ከሥራ ጋር ያለው ንጽጽር “ታማኝነት” ሳይሆን የማመን አቋምን ያመለክታል።
- issue: εἰς δικαιοσύνην ያለውን ግንኙነት ማቅረብ
  choice: ጽድቅ ሆኖ ይቆጠርለታል
  alternative: ለጽድቅ ይቆጠርለታል
  rationale: “ሆኖ” የመቆጠሩን ውጤታዊ ግንኙነት ግልጽ ያደርጋል፤ እምነትና ጽድቅ በሁሉም መልኩ አንድ ናቸው የሚል ተጨማሪ ሥነ መለኮታዊ መደምደሚያ ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ድርብ δέ ንጽጽር “ነገር ግን ... ይልቁንም” ተብሎ ተገልጧል። በዋናው ጽሑፍ የግሪኩ አሻሚነት ተጨማሪ ማብራሪያ የማያስፈልገው በመሆኑ የግርጌ ማስታወሻ አልተጨመረም።
