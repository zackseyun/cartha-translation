revisions:
- from: ነገር ግን ለማይሠራው፣ ይልቁንም ኃጢአተኛውን ጻድቅ ብሎ በሚቆጥረው በእግዚአብሔር ለሚያምነው፣ እምነቱ ጽድቅ ሆኖ ይቆጠርለታል።
  to: ለማይሠራው ግን፣ ኃጢአተኛውን በሚያጸድቀው ላይ ለሚያምነው፣ እምነቱ እንደ ጽድቅ ይቆጠራል።
