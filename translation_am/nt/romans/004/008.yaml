  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: am
  text: ጌታ ኃጢአትን ፈጽሞ የማይቆጥርበት ሰው[a] ብፁዕ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ሰው» የሚለው ወንድን ብቻ ሳይሆን ማንኛውንም ሰው በወካይነት ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ጌታ ኃጢአትን በእርሱ ላይ በፍጹም አይቆጥርም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ብፁዕ ነው
  rationale: የመጽሐፍ ቅዱስን የበረከት አዋጅ ክብደት የሚጠብቅ ሲሆን፣ እንደ «ደስተኛ» በስሜት ብቻ አይወሰንም።
- source_word: ἀνήρ
  choice: ሰው
  rationale: በዚህ አውድ ያለውን ወካይ ነጠላ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ትርጉሙ ወንድን ብቻ አይገድብም።
- source_word: οὗ
  choice: የማይቆጥርበት
  rationale: የግሪኩን ዝምድናዊ ባለቤት አመልካች በአማርኛ «በ-» አወቃቀር በተፈጥሮ ያቀርባል፤ ኃጢአትን በዚያ ሰው ላይ አለመቁጠርን ያሳያል።
- source_word: οὐ μὴ
  choice: ፈጽሞ የማይ-
  rationale: ድርብ እምቢታው ያለውን ጠንካራ አሉታዊ አጽንዖት በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λογίσηται
  choice: ይቆጥር
  rationale: በሮሜ 4 ዙሪያ ያለውን የሒሳብ ንጽጽር ይጠብቃል፤ ከጽሑፉ በላይ ቴክኒካዊ የሥነ መለኮት ቃል አያስገባም።
- source_word: κύριος
  choice: ጌታ
  rationale: በቅዱስ መጽሐፋዊ ጥቅስ አውድ የተለመደውንና የተገባውን አጠራር ይጠቀማል።
- source_word: ἁμαρτίαν
  choice: ኃጢአትን
  rationale: የግሪኩን ነጠላ ቅርጽ እንደ አጠቃላይ ምድብ ይጠብቃል።
theological_decisions:
- issue: ወካይ ተባዕታይ አገላለጽ
  choice: በዋናው ጽሑፍ «ሰው» ተብሏል።
  alternative: «ወንድ»
  rationale: ἀνήρ በሰዋሰው ተባዕታይ ነጠላ ቢሆንም እዚህ ወካይ ትርጉም አለው። «ሰው» ይህን ትርጉም በትክክል ያቀርባል፤ «ወንድ» ግን ትርጉሙን ያለምንጭ ወደ ወንዶች ብቻ ሊገድብ ይችላል።
- issue: የአሉታዊ አጽንዖት ኃይል
  choice: «ፈጽሞ የማይቆጥርበት»
  alternative: «የማይቆጥርበት»
  rationale: οὐ μὴ የተጠናከረ እምቢታን ስለሚገልጽ «ፈጽሞ» የሚለው ቃል አጽንዖቱን ግልጽ ያደርጋል፤ ይህም በጌታ ድርጊት ላይ ያለውን ፈጽሞ አለመቁጠር ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ብፁዕ» የቅዱስ መጽሐፍ የበረከት አዋጅን ክብደት ሲጠብቅ፣ «ይቆጥር» በምዕራፉ ያለውን የሒሳብ ምስል ይጠብቃል።
