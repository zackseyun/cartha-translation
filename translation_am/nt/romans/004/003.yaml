id: ROM.4.3
reference: Romans 4:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: am
  text: ምክንያቱም መጽሐፍ ቅዱስ ምን ይላል? “አብርሃም እግዚአብሔርን አመነ፤ ይህም ለእርሱ እንደ ጽድቅ ተቆጠረለት[a][b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእርሱ እንደ ጽድቅ ታሰበለት” ወይም “ለእርሱ እንደ ጽድቅ ተመዘገበለት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ፍትሕ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: መጽሐፍ
  rationale: በጳውሎስ አጠቃቀም ቃሉ ቅዱሱን የተጻፈ መጽሐፍ ያመለክታል፤ ‘መጽሐፍ’ በአማርኛ የተለመደና ከአገባቡ ግልጽ ነው።
- source_word: Ἐπίστευσεν
  choice: አመነ
  rationale: ቀጥተኛውን የπιστεύω ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከምንጩ በላይ የሆነ ትርጓሜ አይጨምርም።
- source_word: τῷ θεῷ
  choice: እግዚአብሔርን
  rationale: ከπιστεύω ጋር ያለው የመስጫ ቅጽ አብርሃም እግዚአብሔር የተናገረውን ማመኑን ያጎላል፤ ‘በእግዚአብሔር አመነ’ የሚለውን ሰፋ ያለ ትርጉም አልተጫነበትም።
- source_word: ἐλογίσθη
  choice: ተቆጠረለት
  rationale: የግሱን ተደራጊ ቅርጽና ለአብርሃም መቆጠሩን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: εἰς δικαιοσύνην
  choice: እንደ ጽድቅ
  rationale: የግሪኩን አገባብ በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ጽድቅ’ በዚህ የጳውሎስ አውድ ዋናውን ሃይማኖታዊና የፍርድ ስፋት ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የጽድቅ አውድ δικαιοσύνηን መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ የቃሉን የቀናነትና በእግዚአብሔር ፊት ትክክል ሆኖ የመቆጠር ገጽታ በተሻለ ሁኔታ ይጠብቃል፤ ‘ፍትሕ’ ሊሆን የሚችለው የቃል አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሰፊው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ የመጽሐፍ ቅርጽ በጥቅስ ምልክት ተለይቷል፤ γάρ ‘እንግዲህ’ ተብሎ ከቀደመው ክርክር ጋር ያለውን ግንኙነት ጠብቋል።
