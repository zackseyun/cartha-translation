  alternative: አብርሃም ያለ ተጨማሪ መስፈርት የተገረዙት ሁሉ አባት ነው።
  rationale: οὐκ… μόνον ἀλλὰ καί የሚለው አወቃቀር የተገረዙትን ቡድን ‘መገረዝ ብቻ’ እና ‘በእምነት ፈለግም መሄድ’ በሚል ይገድባል፤ ትርጉሙ ይህን ያለ ተጨማሪ ሥነ መለኮታዊ ማብራሪያ ይጠብቃል።
