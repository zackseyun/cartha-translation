lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: የተገረዙት አባት
  rationale: ቃል በቃል ‘የመገረዝ አባት’ ማለት በአማርኛ ከሥርዓቱ ጋር የሚያያዝ የማይለመድ አገላለጽ ይሆናል፤ ዐውዱ አብርሃም ለተገረዙት ሰዎች አባት መሆኑን ያመለክታል። ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: የተገረዙ ብቻ ለሆኑት ሳይሆን
  rationale: ‘ከመገረዝ ብቻ የሆኑ’ የሚለውን ግሪክኛ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ውጫዊ መገረዝ ብቻውን ከአብርሃም እምነት ጋር ከተባበረ መገረዝ የሚለየውን ንፅፅር ይጠብቃል።
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: በ… እምነት ፈለግ ለሚሄዱት
  rationale: στοιχεῖν በሥርዓት መሄድን ወይም መከተልን፣ ἴχνη ደግሞ የእግር ፈለግን ያመለክታል። ‘በፈለግ መሄድ’ የመምሰልና የመከተልን ምስል ይጠብቃል።
- source_word: πίστεως
  choice: እምነት
  rationale: በዐውዱ የሚጠቀሰው አብርሃም በእግዚአብሔር ያመነበት ምላሽ ነው፤ ‘እምነት’ ይህን በግልጽና በተለመደ መንገድ ያስተላልፋል።
- source_word: ἐν ἀκροβυστίᾳ
  choice: ሳይገረዝ ሳለ
  rationale: ቃል በቃል ‘ባለመገረዝ ሁኔታ’ የሚለውን ሐሳብ በተፈጥሯዊ የጊዜና የሁኔታ አገላለጽ ያቀርባል።
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: አባታችን አብርሃም … በነበረው
  rationale: የግሪክኛውን የባለቤትነት ግንኙነት ለአማርኛ አንባቢ በግልጽ ያስፋፋል፤ ‘አባታችን’ የሚለውን ማኅበራዊ መጠሪያም ይጠብቃል።
theological_decisions:
- issue: አብርሃም ያለ ልዩነት የተገረዙት ሁሉ አባት ነው ወይስ መገረዛቸውን ከእምነቱ ፈለግ መከተል ጋር ያያዙት አባት ነው?
