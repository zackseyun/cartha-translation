  register: ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተስማሚ አማርኛ ተጠቅሟል። ‘በእምነት ፈለግ መሄድ’ የግሪክኛውን ምስላዊ አገላለጽ ሳያጠፋ በአማርኛ ሊገባ የሚችል ነው።
