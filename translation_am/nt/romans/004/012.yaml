  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: am
  text: እንዲሁም የተገረዙት አባት[a] ነው፤ እነርሱም መገረዛቸው ብቻ ሳይሆን፣ አባታችን አብርሃም ሳይገረዝ ሳለ የነበረውን እምነት ፈለግ የሚከተሉ ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የመገረዝ አባት።”
