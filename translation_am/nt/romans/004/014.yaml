source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: am
  text: ምክንያቱም ከሕግ የሆኑት[a] ወራሾች ከሆኑ፣ እምነት ከንቱ ሆኗል[b]፤ ተስፋውም ውጤት አልባ ሆኗል[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሕግ የሚመነጩት።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “እምነት ባዶ ተደርጓል።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ተስፋው እንዳይሠራ ተደርጓል” ወይም “ዋጋ አጥቷል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: ከሕግ የሆኑት
  rationale: የጳውሎስን አጭርና ትርጉሙን ሙሉ በሙሉ ያልወሰነ አገላለጽ ይጠብቃል፤ ‘ሕጉን የሚፈጽሙ’ ወይም ‘በሕግ የሚተማመኑ’ ብሎ ከልክ በላይ አይተረጉመውም።
- source_word: κληρονόμοι
  choice: ወራሾች
  rationale: በርስትና በተስፋ ቃል አውድ ውስጥ የተለመደና ግልጽ የአማርኛ ቃል ነው።
- source_word: κεκένωται
  choice: ከንቱ ሆኗል
  rationale: ፍጹም ጊዜው የሚያመለክተውን የቀጠለ ውጤት ያሳያል፤ እምነት ኃይልና ይዘት እንደሌለው መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πίστις
  choice: እምነት
  rationale: በሮሜ 4 አውድ ርስትን በሕግ ከማግኘት ጋር የሚነጻጸረውን በእምነት መቀበል በግልጽ ያሳያል።
- source_word: κατήργηται
  choice: ውጤት አልባ ሆኗል
  rationale: ፈጽሞ መጥፋትን ሳያመለክት፣ እንዳይሠራና ፍሬ እንዳያፈራ መደረጉን ይገልጣል።
- source_word: ἡ ἐπαγγελία
  choice: የተስፋው ቃል
  rationale: ጳውሎስ ከዚህ በፊት የተናገረውን የተወሰነ መለኮታዊ ተስፋ የሚያመለክት ተፈጥሯዊ አማርኛ ነው።
theological_decisions:
- issue: በሕግ (νόμος) እና በπίστις መካከል ባለው የጳውሎስ ንጽጽር πίστηςን መተርጎም
  choice: እምነት
  alternative: መታመን፤ ታማኝነት
  rationale: የሮሜ 4 ሰፊው ክርክር ርስቱ በሕግ ሳይሆን በእምነት መሆኑን ያነጻጽራል፤ ‘እምነት’ ይህን የሐሳብ መስመር ሳይወስን በግልጽ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ከሕግ የሆኑት’ የግሪኩን እውነተኛ አሻሚነት ለመጠበቅ ሆን ተብሎ በአንጻራዊ መደበኛነት ቀርቧል።
