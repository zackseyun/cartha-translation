  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: am
  text: ነገር ግን ስለ እኛም ጭምር ነው፤ ለእኛ—ጌታችንን ኢየሱስን ከሙታን ባስነሣው ለምናምን[b]—ይህ ሊቆጠርልን ነው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሊመዘገብልን ነው» ወይም «ሊታሰብልን ነው»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ለምንታመን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: ነገር ግን ... እኛም ጭምር
  rationale: የተቃርኖውንና የመጨመሩን ኃይል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δι’ ἡμᾶς
  choice: ስለ እኛ
  rationale: διά ከተሳቢ ጋር በዚህ አውድ ጽሑፉ እኛን ታሳቢ እንዳደረገ ያሳያል።
- source_word: μέλλει λογίζεσθαι
  choice: ይቆጠራል
  rationale: የወደፊት አቅጣጫውንና በሮሜ 4 ያለውን የሒሳብ ንጽጽር በግልጽ ዘመናዊ ቃል ይጠብቃል።
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: በምናምንበት
  rationale: እምነቱ ወደ አንድ ሰው የሚያመራ መሆኑን የአማርኛው በ... ማመን አገባብ በተፈጥሮ ይገልጣል።
- source_word: τὸν ἐγείραντα
  choice: ያስነሣውን
  rationale: እግዚአብሔርን በፈጸመው ድርጊት የሚጠቅሰውን የግሪክ አሳታፊ ቅርጽ ይጠብቃል።
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: ጌታችንን ኢየሱስን
  rationale: የባለቤትነት አገባቡንና κύριος የሚለውን ማዕረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: የትንሣኤን አገላለጽ በአጭርና በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የλογίζεσθαι ያልተገለጸውን ተሳቢ እንዴት ማቅረብ እንደሚገባ
  choice: ዐውዱን የሚያመለክተውን «ይህም» መጠቀም
  alternative: «ጽድቅ ይቆጠርልናል» ብሎ ተሳቢውን በግልጽ መጨመር
  rationale: ግሪኩ ተሳቢውን ሳይደግም ከቀደመው ዐውድ ያስገነዝባል። «ይህም» በአማርኛ ዓረፍተ ነገሩን ሙሉ ሲያደርግ የመነሻውን ሆን ተብሎ የተተወ ተሳቢ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረዥሙ የግሪክ አገባብ ትርጉሙ ሳይጠፋ በሰሚኮሎን ተከፍሏል።
