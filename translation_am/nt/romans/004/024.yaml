- from: ነገር ግን ስለ እኛም ጭምር ነው፤ ይህም ለእኛ ይቆጠራል[a]፤ ይኸውም ጌታችንን ኢየሱስን ከሙታን ያስነሣውን በምናምንበት[b] በእኛ ነው።
  to: ነገር ግን ስለ እኛም ጭምር ነው፤ ለእኛ—ጌታችንን ኢየሱስን ከሙታን ባስነሣው ለምናምን[b]—ይህ ሊቆጠርልን ነው[a]።
