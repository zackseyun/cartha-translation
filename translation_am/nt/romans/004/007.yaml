source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: am
  text: '«የሕግ ጥሰቶቻቸው ይቅር የተባሉላቸው፣[a]

    ኃጢአቶቻቸውም የተሸፈኑላቸው ብፁዓን ናቸው።»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በደሎቻቸው ይቅር የተባሉላቸው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: ብፁዓን ናቸው
  rationale: መለኮታዊ ሞገስንና የተባረከ ሁኔታን የሚያመለክተውን የብፅዕና አዋጅ ይጠብቃል፤ እንደ «ደስተኞች» በስሜታዊ ደስታ ብቻ አይወስነውም።
- source_word: ἀφέθησαν
  choice: ይቅር የተባለላቸው
  rationale: የἀφίημιን የይቅርታና የስርየት ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ድርጊቱ ተፈጽሞ ያስገኘውን ውጤትም ያሳያል።
- source_word: ἀνομίαι
  choice: ዓመፀኛ ሥራቸው
  rationale: ቃሉ ከአጠቃላይ በደል በላይ ሕግን የመጣስን ኃይል ይዟል፤ «ዓመፀኛ ሥራ» ይህን በዘመናዊና ለአንባቢ ግልጽ ቋንቋ ያሳያል።
- source_word: ἐπεκαλύφθησαν
  choice: የተሸፈነላቸው
  rationale: በመዝሙር 32፥1 ጥቅስ ውስጥ ያለውን «መሸፈን» ዘይቤ ሳይተረጉም በቀጥታ ይጠብቃል።
- source_word: ἁμαρτίαι
  choice: ኃጢአታቸው
  rationale: ለἁμαρτία የተለመደና ግልጽ የአማርኛ አቻ ሲሆን፣ ከἀνομίαι የቃላት ልዩነትንም ይጠብቃል።
theological_decisions:
- issue: በ«ἀνομίαι» እና «ἁμαρτίαι» መካከል ያለው ግንኙነት
  choice: ሁለቱን በ«ዓመፀኛ ሥራ» እና «ኃጢአት» ተለያይተው መተርጎም
  alternative: ሁለቱንም «ኃጢአት» በሚል አንድ አጠቃላይ ቃል መተርጎም
  rationale: ጳውሎስ የመዝሙሩን ትይዩ አገላለጽ ሲጠብቅ ተዛማጅ ነገር ግን ተመሳሳይ ያልሆኑ ሁለት ቃላትን ይጠቀማል። ልዩነታቸውን ማቆየት ጥቅሱ ከሚናገረው በላይ የሆነ ሥነ መለኮታዊ ልዩነት ሳይጭን ምንጩን ያንጸባርቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ የሚገባ አማርኛ ተጠቅሟል። የመዝሙር ጥቅሱን ግጥማዊ ትይዩነት ለማሳየት ሁለት መስመሮች ተጠብቀዋል፤ «ብፁዓን» የመጽሐፍ ቅዱስ ክብርን ሲጠብቅ በዘመናዊ አጠቃቀምም የሚታወቅ ነው።
