    rationale: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα literally contrasts things not being with things being. «አድርጎ» introduces a causative step absent from the Greek and narrows the retained ambiguity. «የሌሉ ነገሮችን እንዳሉ ይጠራል» remains close while sounding clear in Amharic.
