  alternative: የሌሉትን ወደ መኖር ይጠራል
  rationale: ሐረጉ የመለኮታዊ የፈጠራ ኃይልን ሊያመለክት ቢችልም፣ የግሪኩ አነጋገር የታመቀና ከዚያ የሰፋ ነው። ዋናው ጽሑፍ ይህን ውጥረት ይጠብቃል፤ ግልጽ ትርጓሜው በማስታወሻ ቀርቧል።
