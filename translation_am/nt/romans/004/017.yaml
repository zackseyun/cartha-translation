base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: am
  text: ተጽፎ እንዳለ፣ “የብዙ ሕዝቦች [b] አባት አድርጌሃለሁ”—ይህም እርሱ ባመነበት በእግዚአብሔር ፊት ነው፤ እርሱም ሙታንን ሕያዋን የሚያደርግ፣ የሌሉ ነገሮችንም እንዳሉ የሚጠራ ነው። [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ በትርጓሜ ሲቀርብ፣ “የሌሉ ነገሮችን ወደ መኖር ይጠራል።”
    reason: alternative_reading
  - marker: b
    text: “ሕዝቦች” የሚለው “አሕዛብ” ተብሎም ሊገባ ይችላል፤ ነገር ግን በዚህ የዘፍጥረት ጥቅስ ውስጥ ሰፊው ትርጉም ይበልጥ የተገባ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: ተጽፎ እንዳለ
  rationale: የቅዱሳት መጻሕፍትን ጥቅስ የሚያስተዋውቅ ተፈጥሯዊ የአማርኛ አገላለጽ ሲሆን፣ የግሪኩን ፍጹም ተደርጎ የቆየ ሁኔታ ያሳያል።
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: የብዙ ሕዝቦች አባት
  rationale: በዘፍጥረት ጥቅሱ ውስጥ ἔθνη በሰፊው ሕዝቦችን ወይም ብሔራትን ያመለክታል፤ በተለይ አሕዛብ ብሎ መወሰን አያስፈልግም።
- source_word: τέθεικά σε
  choice: አድርጌሃለሁ
  rationale: ፍጹም ጊዜው የተፈጸመና ውጤቱ የሚቀጥል መሆኑን ያሳያል፤ ይህ አገላለጽም በአማርኛ ተፈጥሯዊ ነው።
- source_word: κατέναντι
  choice: በእግዚአብሔር ፊት
  rationale: የ‘በፊት/በመገኘት’ ግንኙነታዊ ትርጉሙን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὗ ἐπίστευσεν
  choice: እርሱ ባመነበት
  rationale: የአብርሃም እምነት ወደ እግዚአብሔር የተመራ መሆኑን በአማርኛ የተለመደ አገባብ ያሳያል።
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: ሙታንን ሕያዋን ያደርጋል
  rationale: የሕይወት ሰጪነትን በግልጽ ያሳያል፤ ‘ሕይወት ይሰጣል’ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: የሌሉትን እንዳሉ አድርጎ ይጠራል
  rationale: የግሪኩን የታመቀ አነጋገርና ትርጓሜያዊ ክፍትነት ይጠብቃል፤ ፍጥረትን ከምንም ወደ መኖር ማምጣት ብቻ ብሎ በዋናው ጽሑፍ አይወስነውም።
theological_decisions:
- issue: የመጨረሻው ሐረግ ከምንም የመፍጠርን ትምህርት በቀጥታ እንደሚገልጽ መተርጎም ወይስ የግሪኩን ሰፊ ክፍትነት መጠበቅ
