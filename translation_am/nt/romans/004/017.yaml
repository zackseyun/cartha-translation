  verdict: revise
  source_fidelity: The draft conveys the principal sense, including the Genesis citation, Abraham's faith in God, God's life-giving power, and the deliberately compressed final clause. However, «እንዳሉ አድርጎ ይጠራል» adds an instrumental/causative element not expressed by ὡς ὄντα, and its wording tends to resolve the clause more explicitly than the Greek does.
