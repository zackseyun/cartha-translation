  terminology: '«ሕዝቦች» appropriately renders ἐθνῶν in the Genesis quotation without prematurely restricting it to «አሕዛብ». «ሙታንን ሕያዋን የሚያደርግ» is natural and faithful. The footnotes should be attached to the words they explain: the lexical note to «ሕዝቦች» and the interpretive alternative to the final clause.'
