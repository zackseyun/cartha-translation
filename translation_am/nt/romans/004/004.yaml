  terminology: “ደመወዝ” fits μισθός in this employment-payment context. “ስጦታ” clearly conveys the unearned-gift force of κατὰ χάριν without obscuring the alternative “ጸጋ,” which is supplied in the note. “ዕዳ” is a valid direct rendering of ὀφείλημα; the footnote appropriately provides “እንደሚገባው ክፍያ” and “እንደ ግዴታ” as clarifying alternatives. The Amharic footnote anchors are correctly attached to the terms they discuss.
