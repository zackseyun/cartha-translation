  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: am
  text: ለሚሠራ ሰው ግን ደመወዙ እንደ ስጦታ[a] ሳይሆን እንደ ዕዳ[b] ይቆጠርለታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ ጸጋ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንደሚገባው ክፍያ” ወይም “እንደ ግዴታ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: ለሚሠራ ሰው
  rationale: በመስራት የሚታወቅን ማንኛውንም ሰው የሚያመለክተውን ባለአንቀጽ የአሁን ጊዜ ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ልዩነትና የንግግር ሽግግር ያሳያል፤ በአማርኛም ከመጀመሪያው ሐረግ በኋላ መቀመጡ ተፈጥሯዊ ነው።
- source_word: μισθὸς
  choice: ደመወዙ
  rationale: በሥራና በክፍያ አውድ ውስጥ የተሠራበትን ዋጋ በግልጽ ያመለክታል።
- source_word: λογίζεται
  choice: ይቆጠርለታል
  rationale: አንድ ነገር ለሰውየው በሂሳብ እንደሚመዘገብ ወይም እንደሚታሰብ የሚያሳየውን የጳውሎስን የሂሳብ ንግግር ይጠብቃል።
- source_word: κατὰ χάριν
  choice: እንደ ስጦታ
  rationale: ከተገቢ የሥራ ክፍያ ጋር በተደረገው ንጽጽር ያልተገባ ችሮታን ወይም በነፃ የተሰጠን ነገር በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: ὀφείλημα
  choice: እንደ ዕዳ
  rationale: መከፈል ያለበትንና በሌላው ላይ የተጣለን የክፍያ ግዴታ በቀጥታ ይገልጻል።
theological_decisions:
- issue: በሥራና በክፍያ ንጽጽር ውስጥ χάριςን መተርጎም
  choice: እንደ ስጦታ
  alternative: እንደ ጸጋ
  rationale: ዋናው ጽሑፍ የተገባ ደመወዝን በነፃ ከሚሰጥ ነገር ጋር ያነጻጽራል። “እንደ ስጦታ” ይህን ንጽጽር ግልጽ ያደርጋል፤ “ጸጋ” የሚለው ሰፊ ሥነ መለኮታዊ ትርጉም ግን በአማራጭ ማስታወሻ ተጠብቋል።
- issue: ὀφείλημα የሚያመለክተው ዕዳ ወይስ ግዴታ
  choice: እንደ ዕዳ
  alternative: እንደሚገባው ክፍያ / እንደ ግዴታ
  rationale: “ዕዳ” የቃሉን ቀጥተኛ የሚከፈል ነገር ምስል ይጠብቃል፤ በዚህ አውድ ግን የሥነ ምግባር በደል ሳይሆን ለሠራተኛው ሊከፈል የሚገባ ክፍያ መሆኑ በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የሂሳብ ምስል “ይቆጠርለታል” በሚለው፣ የሥራ ክፍያ ንጽጽሩም “ደመወዝ—ስጦታ—ዕዳ” በሚለው የቃላት ሰንሰለት ተጠብቋል።
