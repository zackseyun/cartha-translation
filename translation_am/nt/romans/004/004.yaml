  source_fidelity: 'The translation accurately represents the Greek contrast: the worker''s wages are not reckoned on the basis of χάρις (rendered contextually as a gift) but on the basis of ὀφείλημα (an amount owed/debt). “ይቆጠርለታል” appropriately retains λογίζεται’s reckoning/accounting sense.'
