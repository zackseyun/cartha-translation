  text: 'እርሱም ሳይገረዝ ሳለ በነበረው እምነት ያለው ጽድቅ[a] ማኅተም እንዲሆን፣ የግርዛትን ምልክት ተቀበለ፤ ይህም ሳይገረዙ የሚያምኑ ሁሉ አባት እንዲሆንና ጽድቅ ለእነርሱም እንዲቈጠር[b] ነው።


    [a] “ጽድቅ” የሚለው ቃል እዚህና በቁጥሩ በኋላ በተደገመበት ቦታ “ፍትሕ” ተብሎም ሊተረጎም ይችላል።


    [b] ወይም “እንዲቈጠርላቸው” ወይም “በእነርሱ ሒሳብ እንዲጻፍ”።'
