  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔርን አጥብቆ የሚፈልግ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: የሚያስተውል
  rationale: ይህ ቃል በጥልቀት መረዳትንና ነገርን በማስተዋል መገንዘብን ያመለክታል፤ “የሚያስተውል” በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው አገላለጽ ነው።
- source_word: ἐκζητῶν
  choice: የሚፈልግ
  rationale: የግሱን መሠረታዊ የመፈለግ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ሊኖረው የሚችለው የጽናት ወይም የትጋት አጽንዖት በግርጌ ማስታወሻ ተጠብቋል።
- source_word: οὐκ ἔστιν
  choice: ማንም የለም
  rationale: የግሪኩን ፍጹምና አጠቃላይ ክህደት በተለመደ የአማርኛ አገባብ ያስተላልፋል።
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: የሚያስተውል / የሚፈልግ
  rationale: ስማዊ አገልግሎት ያላቸውን የግሪክ አሳታፊ ግሶች በአማርኛ ተፈጥሯዊ በሆኑ አንጻራዊ አገላለጾች ይተረጉማል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውንና ተገቢውን የአምላክ ስያሜ ከተሳቢ ምልክት ጋር ያቀርባል።
theological_decisions:
- issue: በጳውሎስ የጥቅሶች ሰንሰለት ውስጥ የክህደቱ ወሰን
  choice: “ማንም የለም” የሚለውን ፍጹም አገላለጽ በሁለቱም ሐረጎች መጠበቅ
  alternative: “በእውነት የሚያስተውል የለም፤ እግዚአብሔርንም በእውነት የሚፈልግ የለም” ብሎ ማለዘብ
  rationale: የግሪኩ አገላለጽ ምንም የማለዘቢያ ቃል ሳይጨምር ፍጹም ክህደትን ያቀርባል፤ ትርጉሙም ይህን ኃይል ሳያዳክም ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። የግሪኩ ተደጋጋሚ አወቃቀር ለአጽንዖት ተጠብቋል፤ በእንግሊዝኛው የምክክር ጽሑፍ ውስጥ [a] ከ“understands” ቀጥሎ ቢታይም፣ የማስታወሻው ይዘት ἐκζητῶνን ስለሚመለከት ምልክቱ በአማርኛው “የሚፈልግም” ከሚለው ቀጥሎ ተቀምጧል።
