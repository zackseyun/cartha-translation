  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: am
  text: እንደተጻፈው፦ “ጻድቅ የለም፤ አንድም እንኳ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: እንደ
  rationale: ከጥቅስ ማስገቢያው ግስ ጋር ሲጣመር ‘እንደ’ የግሪኩን የማነጻጸር እና የማጣቀስ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γέγραπται
  choice: ተጽፏል
  rationale: ፍጹም ተገብሮ አድራጊውን ሳይጠቅስ የተጻፈው ቃል እስካሁን ጸንቶ መኖሩን ያሳያል፤ በ‘እንደተጻፈው’ ውስጥ ተፈጥሯዊ ሆኖ ተዋህዷል።
- source_word: ὅτι
  choice: ፦
  rationale: ὅτι እዚህ የጥቅሱን ይዘት ያስገባል፤ በዘመናዊ አማርኛ ይህን በግልጽ ሥርዓተ ነጥብ ማቅረብ ከ‘እንዲህ ተብሎ’ ያልተጻፈ ቃል ከመጨመር ይሻላል።
- source_word: Οὐκ ἔστιν
  choice: የለም
  rationale: የመኖር አሉታዊነቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δίκαιος
  choice: ጻድቅ
  rationale: የቃሉን የሥነ ምግባርና የእግዚአብሔር ፊት ትክክለኛ መሆን ስፋት የሚጠብቅ፣ በአማርኛ መጽሐፍ ቅዱሳዊ ንግግርም የተለመደ ቃል ነው።
- source_word: οὐδὲ εἷς
  choice: አንድም እንኳ
  rationale: አሉታዊውን ፍርድ እስከ አንድ ሰው ድረስ የሚያሰፋውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ንግግሩን በግለሰብ ላይ ያተኮረ ‘ጻድቅ ሰው የለም’ ብሎ ማቅረብ ወይስ የግሪኩን አጠቃላይና ፍጹም አጽንዖት መጠበቅ።
  choice: ጻድቅ የለም፤ አንድም እንኳ።
  alternative: አንድም ጻድቅ ሰው የለም።
  rationale: ግሪኩ δίκαιος የሚለውን ያለ ‘ሰው’ ስም ይጠቀማል፤ የተመረጠው አቀራረብ ያልተጻፈውን ቃል ሳይጨምር አጠቃላይነቱንና ‘አንድም እንኳ’ የሚለውን ሹል አጽንዖት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀጥተኛ የሆነ አማርኛ። ‘ጻድቅ’ መጽሐፍ ቅዱሳዊ ክብደቱን ሲጠብቅ፣ አጠቃላይ አገባቡ ግን ጥንታዊ ወይም የትምህርት ቤት ቋንቋ እንዳይሆን ቀላል ተደርጓል።
