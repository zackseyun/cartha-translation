  text: ጉሮሯቸው የተከፈተ መቃብር ነው፤ በምላሳቸው ያታልላሉ።[a] ከንፈሮቻቸው ሥር የእፉኝቶች መርዝ አለ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምላሳቸው ያታልሉ ነበር።” ይህ አተረጓጎም የግሪኩን ግስ ቀጣይ ድርጊት የሚያመለክት ገጽታ ይበልጥ ያሳያል።
