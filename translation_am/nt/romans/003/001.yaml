  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: am
  text: እንግዲህ አይሁዳዊው[b] ያለው ልዩ ጥቅም ምንድን ነው? ወይስ መገረዝ ምን ፋይዳ አለው?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መገረዝ ምን ጥቅም አለው?»
    reason: lexical_alternative
  - marker: b
    text: በግሪክ «አይሁዳዊው» የሚለው ነጠላ ቃል አይሁዳዊ ሰዎችን እንደ አንድ ምድብ በወኪልነት ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: እንግዲህ … ምን
  rationale: የጳውሎስን ከቀደመው ሐሳብ የሚነሳ መደምደሚያዊ ሽግግርና የጥያቄውን አወቃቀር በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: τὸ περισσὸν τοῦ Ἰουδαίου
  choice: አይሁዳዊ መሆን … ጥቅም
  rationale: περισσόν በዚህ አውድ የላቀነትን ሳይሆን ልዩ ጥቅምን ያመለክታል። የግሪኩ ነጠላ ስም አንድን ወኪል ሰው በመጥቀስ ምድቡን በሙሉ የሚያመለክት ቢሆንም፣ «አይሁዳዊ መሆን» በአማርኛ የጥያቄውን ምድባዊ ትርጉም በግልጽና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἢ τίς
  choice: ወይስ … ምን
  rationale: ሁለተኛውን ትይዩ የአጠያየቅ ክፍል በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἡ ὠφέλεια
  choice: ጥቅም
  rationale: ὠφέλεια የሚያመለክተውን ጥቅም ወይም ፋይዳ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል። በግሪኩ περισσόν እና ὠφέλεια መካከል ትንሽ የቃል ልዩነት ቢኖርም፣ በአማርኛ «ብልጫ» የዘር የበላይነትን በስህተት ሊያሰማ ስለሚችል «ጥቅም» በሁለቱም ጥያቄዎች ተመርጧል።
- source_word: τῆς περιτομῆς
  choice: መገረዝ
  rationale: የኪዳኑን ምልክት የሆነውን ሥርዓት በቀጥታ፣ በተለመደና በሚገባ በሚታወቅ አማርኛ ይጠራል።
theological_decisions:
- issue: Ἰουδαίου የተወሰነ ነጠላ ስም በምድባዊ ወኪልነት መጠቀሙ
  choice: አይሁዳዊ መሆን
  alternative: የአይሁዳዊው ጥቅም / አይሁዳዊው ምን ብልጫ አለው
  rationale: ግሪኩ «አይሁዳዊው» የሚለውን ነጠላ ቅርጽ ለምድቡ ወኪል አድርጎ ይጠቀማል። በአማርኛ «አይሁዳዊ መሆን» ይህን ምድባዊ ትርጉም የጾታ ወይም የአንድ የተወሰነ ሰው ገደብ ሳያስገባ ያቆያል፤ የሐዋርያውንም ጥያቄ አይፈታውም።
- issue: περισσόνን እንደ ጥቅም ወይም ብልጫ መተርጎም
  choice: ጥቅም
  alternative: ብልጫ
  rationale: «ብልጫ» በዘመናዊ አማርኛ የብሔር ወይም የሰው የበላይነትን ሊያሰማ ይችላል። አውዱ ግን በአይሁዳዊነትና በመገረዝ የሚገኝ ልዩ ጥቅም ስለመኖሩ ይጠይቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ የአማርኛ አገላለጽ ተጠቅሟል። ሁለቱ ትይዩ ጥያቄዎች ተጠብቀዋል፤ «ብልጫ» ሊያስከትለው የሚችለውን የዘር የበላይነት ግንዛቤ ለማስወገድ «ጥቅም» ተመርጧል።
