  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር አወቃቀር ለአማርኛ ግልጽነት ‘ታዲያ … ለምን አንልም?’ ተብሎ ተፈትቷል፤ የጥቅሱ ምጸታዊ ጥያቄና የፍርድ ቃና ተጠብቀዋል።
