source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: am
  text: ታዲያ፣ እኛ በሐሰት እንደምንሰደብና አንዳንዶችም እኛ እንዲህ እንላለን ብለው እንደሚናገሩት፣ “መልካም ነገር እንዲመጣ ክፉ ነገር እናድርግ” ለምን አንልም? የእነርሱ ፍርድ ፍትሐዊ ነው።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፦ “እኛ እንዲህ እንላለን ተብለን እንደምንሰደብና አንዳንዶችም እኛ እንዲህ እንላለን ብለው እንደሚናገሩት፣ ‘መልካም ነገር እንዲመጣ ክፉ ነገር እናድርግ’ አንበል?”
    reason: lexical_alternative
  - marker: b
    text: “የእነርሱ ፍርድ” በቅርብ አውድ ይህን የሐሰት ክስ የሚያቀርቡትን ያመለክታል፤ በሰዋስው ግን የማጣቀሻው ወሰን በግልጽ አልተገለጸም።
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: እኛን በሐሰት እንደሚወነጅሉን
  rationale: በዚህ አውድ ግሱ የጳውሎስን ንግግር በጠላትነት አዛብቶ መክሰስን ያመለክታል፤ ‘በሐሰት መወንጀል’ ይህን ትርጉም በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: φασίν τινες
  choice: አንዳንዶችም … እንደሚናገሩት
  rationale: የአንዳንድ ሰዎችን የተዘገበ ክስ በቀጥታ ይገልጣል፤ ከጽሑፉ ቃል በላይ ‘ያስተምራሉ’ የሚል ትርጓሜ አይጨምርም።
- source_word: λέγειν
  choice: እኛ እንዲህ እንደምንል
  rationale: የግሱን ቀጥተኛ ትርጉም ‘ማለት’ በተፈጥሯዊ የአማርኛ አገባብ ይጠብቃል።
- source_word: Ποιήσωμεν
  choice: እናድርግ
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር የማበረታቻ ንዑስ አንቀጽን (‘እናድርግ’) በትክክል ያስተላልፋል።
- source_word: τὰ κακὰ
  choice: ክፉ ነገር
  rationale: በአማርኛ ተፈጥሯዊ የሆነ አጠቃላይ አገላለጽ ሲሆን የግሪኩን በቅጽል የተገለጸ ስም ይወክላል።
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: መልካም ነገር እንዲመጣ
  rationale: የἵναን ዓላማ ወይም ውጤት ክፍት በማድረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κρίμα
  choice: የጥፋተኝነት ፍርድ
  rationale: በዚህ ቦታ አጠቃላይ ፍርድን ሳይሆን በተከሳሽ ላይ የሚሰጥ አሉታዊ የፍርድ ውሳኔን ያመለክታል።
- source_word: ἔνδικόν
  choice: ፍትሐዊ ነው
  rationale: የቃሉን ሕጋዊና ሥነ ምግባራዊ ትክክለኛነት በክብር ባለው ዘመናዊ አገላለጽ ይጠብቃል።
- source_word: καὶ μὴ
  choice: ታዲያ … ለምን አንልም?
  rationale: ግሪኩ ከቀደመው ቁጥር የቀጠለ አጭርና የተዘለለ አገባብ ነው፤ ይህ ቅርጽ የተጠቆመውን ጥያቄ በአማርኛ ግልጽ ያደርገዋል።
theological_decisions:
- issue: ὧν (‘የእነርሱ’) የሚያመለክተው ማንን እንደሆነ
  choice: በዋናው ጽሑፍ ‘በእነርሱ ላይ’ ተብሎ ተተርጉሞ፣ በማስታወሻ እነርሱ የሐሰት ክሱን የሚያቀርቡ ወይም ይህን አስተሳሰብ የሚደግፉ ሰዎች መሆናቸው ተገልጿል።
  alternative: እነዚህን ቃላት እንደሚናገሩ የተከሰሱትን ጳውሎስንና ባልደረቦቹን እንደሚያመለክት መውሰድ።
  rationale: በሰዋስውና በአውዱ ὧν በቅርብ የተጠቀሱትን የሐሰት ከሳሾችና የክፉ አመክንዮውን ደጋፊዎች ማመልከቱ ይበልጥ ተፈጥሯዊ ነው፤ የማጣቀሻው ተግባራዊ ግልጽነት በማስታወሻ ተጠብቋል።
