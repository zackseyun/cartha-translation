  source_fidelity: The rhetorical question, the accusation that Paul and his associates allegedly say this, the hortatory ‘let us do,’ and the final affirmation of the justice of the adverse judgment are preserved. However, the opening Amharic expression is syntactically strained, and the final clause can more closely follow the Greek possessive expression while retaining its referential ambiguity.
