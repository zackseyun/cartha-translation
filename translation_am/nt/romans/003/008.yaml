  terminology: ‘ክፉ ነገር,’ ‘መልካም ነገር,’ and ‘ፍትሐዊ’ suitably convey the key terms. ‘እንደምንሰደብ’ naturally renders βλασφημούμεθα here as hostile slander rather than blasphemy against God.
