  choice: ሁለቱን ‘በእምነት’ እና ‘በእምነት አማካይነት’ በማለት የቅድመ ቃላቱን ልዩነት መጠበቅ፣ ነገር ግን በመካከላቸው የግድ የትምህርት ልዩነት አለ ብሎ አለመወሰን
  alternative: ሁለቱንም ‘በእምነት’ ብሎ እንደ ቅጥ ልዩነት ብቻ መተርጎም፣ ወይም አንዱን መሠረት ሌላውን መንገድ የሚያመለክት አድርጎ መተርጎም
  rationale: ግሪኩ ሁለት የተለያዩ ቅድመ ቃላትን ይጠቀማል፤ ትርጉሙ ይህን ልዩነት ይጠብቃል፣ አውዱ ግን ጠንካራ የሥነ መለኮት ንፅፅር እንድንወስን አያስገድድም።
