id: ROM.3.27
reference: Romans 3:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: am
  text: ታዲያ መመካት የት አለ? ተገልሏል። በምን ዓይነት ሕግ? የሥራ ሕግ? አይደለም፤ ነገር ግን በእምነት ሕግ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: መመካት
  rationale: የራስን ብቃት ወይም ሥራ መሠረት አድርጎ መኩራራትን የሚገልጽ ተፈጥሯዊና ከአውዱ ጋር የሚስማማ ምርጫ ነው።
- source_word: ἐξεκλείσθη
  choice: ተወግዷል
  rationale: የተገለለ ወይም ቦታ ያጣ መሆኑን በግልጽ ያሳያል፤ ተገብቶ መቆለፍን የሚያስመስል ግድ የለሽ ቃል በቃል አተረጓጎምን ያስወግዳል።
- source_word: διὰ ποίου νόμου
  choice: በምን ዓይነት ሕግ
  rationale: ποίου የሚጠይቀውን የዓይነት ወይም የባሕርይ ጥያቄ ጠብቆ ያቀርባል።
- source_word: νόμου πίστεως
  choice: በእምነት ሕግ
  rationale: የግሪኩን አጭርና ትርጉማዊ ውጥረት ያለበትን አገላለጽ ይጠብቃል፤ νόμος እዚህ የሙሴን ሕግ ብቻ ሳይሆን መርሕ ወይም ሥርዓት ሊያመለክት የሚችለውን አሻሚነት አይዘጋም።
theological_decisions:
- issue: νόμος በዚህ ጥቅስ ያለው ትርጉም
  choice: ሕግ
  alternative: መርሕ / ሥርዓት
  rationale: ጳውሎስ ሕግ የሚለውን ቃል በቃላዊ ጨዋታ የሚጠቀምበትን የጽሑፉን ውጥረት ለመጠበቅ በዋናው ጽሑፍ ‘ሕግ’ ተብሏል፤ አንድን የአስተምህሮ ትርጓሜ ብቻ አያስገድድም።
- issue: πίστις እንደ እምነት ወይም ታማኝነት
  choice: እምነት
  alternative: ታማኝነት
  rationale: በቅርብ አውድ ከሥራ ጋር የተቃረነውን በእምነት መቀበል ይበልጥ በቀጥታ ያሳያል፤ ሆኖም የπίστιςን ሰፊ የቃል ክልል በአስተምህሮ ጭነት አልተዘጋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ አጫጭር ጥያቄዎችና ቀጥተኛ መልሶች ተጠብቀዋል።
