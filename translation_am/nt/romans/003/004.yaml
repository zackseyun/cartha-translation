id: ROM.3.4
reference: Romans 3:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: am
  text: ፈጽሞ አይሁን! ይልቁንም፣ እግዚአብሔር እውነተኛ ይሁን፤ ሰው ሁሉ ግን ሐሰተኛ ይሁን። እንደተጻፈውም፣ “በቃሎችህ ጻድቅ ሆነህ እንድትገኝ[a]፣ በምትፈረድበትም ጊዜ[b] እንድታሸንፍ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ትክክለኛ መሆንህ እንዲገለጥ” ወይም “ከነቀፋ ነጻ ሆነህ እንድትገኝ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በምትፈርድበት ጊዜ።” ይህ የመዝሙር 51፥4ን የዕብራይስጥ አነጋገር ይበልጥ በቀጥታ ያንጸባርቃል፤ በሮሜ ያለው የግሪክ አነጋገር ግን በተፈጥሮ “በምትፈረድበት ጊዜ” ተብሎ ይነበባል።
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: የጳውሎስን አጽንዖት ያለው ፍጹም እምቢታ እና የግሱን ምኞታዊ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: እግዚአብሔር እውነተኛ ይሁን
  rationale: የγινέσθωን ትእዛዛዊ ኃይል ይጠብቃል፤ ከ«ሐሰተኛ» ጋር ያለውንም ግልጽ ተቃርኖ ያቆያል።
- source_word: πᾶς ... ἄνθρωπος
  choice: ሰው ሁሉ
  rationale: ἄνθρωπος በዚህ ስፍራ ወንድን ብቻ ሳይሆን ማንኛውንም ሰው ይጠቅሳል፤ አተረጓጎሙም የπᾶςን አጠቃላይና አከፋፋይ ስሜት ይጠብቃል።
- source_word: ψεύστης
  choice: ሐሰተኛ
  rationale: ውሸትን የሚናገር ወይም እውነተኛ ያልሆነ ሰውን በቀጥታና በተለመደ አማርኛ ይገልጣል።
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈውም
  rationale: መጽሐፍ ቅዱስን ለመጥቀስ የሚያገለግለውን የተለመደ ቀመር በአጭርና በተፈጥሯዊ ቋንቋ ያቀርባል።
- source_word: δικαιωθῇς
  choice: ጻድቅ ሆነህ እንድትገኝ
  rationale: እግዚአብሔር ጻድቅ እንደሚሆን ሳይሆን ጻድቅና ትክክለኛ መሆኑ በፍርድ እንደሚገለጥ የሚያሳየውን ፎረንሲክ ትርጉም ይጠብቃል።
- source_word: λόγοις
  choice: በቃሎችህ
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ የሚያስተላልፍና በመዝሙሩ ጥቅስ ውስጥ ተፈጥሯዊ የሆነ አተረጓጎም ነው።
- source_word: νικήσεις
  choice: እንድታሸንፍ
  rationale: በፍርድ አውድ ውስጥ ድል ማድረግን በግልጽ ይገልጣል፤ ከὅπως ጋር ያለውንም የዓላማ አገባብ በአማርኛ ያስተካክላል።
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: በምትፈረድበትም ጊዜ
  rationale: የሮሜ ግሪክ ንባብ በተፈጥሮ ተደራጊ እንደሆነ፣ ማለትም ‘በአንተ ላይ ሲፈረድ’ የሚል እንደሆነ ያስተላልፋል።
theological_decisions:
- issue: δικαιωθῇς ስለ እግዚአብሔር ሲነገር ያለው የፍርድ ትርጉም
  choice: ጻድቅ ሆነህ እንድትገኝ
  alternative: ትክክለኛ መሆንህ እንዲገለጥ / ከነቀፋ ነጻ ሆነህ እንድትገኝ
  rationale: አውዱ እግዚአብሔር ጻድቅ ይሆናል የሚል ለውጥን ሳይሆን፣ ከሰው ሐሰተኝነት በተቃራኒ የእርሱ እውነተኝነትና ትክክለኝነት በፍርድ እንደሚረጋገጥ ያሳያል።
- issue: ἐν τῷ κρίνεσθαί σε ተደራጊ ወይስ አድራጊ ንባብ
  choice: በምትፈረድበት ጊዜ
  alternative: በምትፈርድበት ጊዜ
  rationale: የሮሜ ግሪክ አገባብ በተፈጥሮ ‘በአንተ ላይ ሲፈረድ’ የሚል ተደራጊ ንባብን ይደግፋል፤ የመዝሙር 51፥4 ዕብራይስጥ ግን ‘በምትፈርድበት’ የሚለውን አድራጊ ንባብ ይደግፋል፣ ስለዚህ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጳውሎስ አጽንዖት፣ የግሪኩ ትእዛዛዊ ቅርጽና የፍርድ ቃላት ተጠብቀዋል፤ የግሪኩና የዕብራይስጡ ንባብ ልዩነትም በማስታወሻ ቀርቧል።
