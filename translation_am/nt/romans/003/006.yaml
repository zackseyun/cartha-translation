lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: ይህ አገላለጽ ቀደም ሲል የቀረበውን ሐሳብ በጽኑ የሚክድ የጳውሎስ የተለመደ አነጋገር ነው። የግሱን ምኞታዊ ቅርጽ ሳያጠፋ፣ በዘመናዊ አማርኛ ያለውን ኃይለኛ ውድቅ ማድረግ ያስተላልፋል።
- source_word: ἐπεὶ
  choice: አለበለዚያስ
  rationale: በዚህ የክርክር አውድ ውድቅ የተደረገው ሐሳብ እውነት ቢሆን የሚከተለውን የማይቻል ውጤት ያስገባል፤ «አለበለዚያስ» ይህን ፍሰት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κρινεῖ
  choice: ይፈርዳል
  rationale: የግሪኩን የወደፊት ጊዜ አመልካች ቅርጽ በቀጥታ ይጠብቃል፤ «ሊፈርድ ይችላል» የሚል ተጨማሪ የችሎታ ትርጉም አያስገባም።
- source_word: κόσμον
  choice: ዓለምን
  rationale: በዚህ አውድ የእግዚአብሔር ፍርድ ተቀባይ የሆነውን ዓለም በሰፊ ትርጉም ያመለክታል፤ «ዓለም» መደበኛና ግልጽ አቻ ነው።
theological_decisions:
