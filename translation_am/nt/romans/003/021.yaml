lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: አሁን ግን
  rationale: የጊዜውን ለውጥና በጳውሎስ ሐሳብ ውስጥ ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: χωρὶς νόμου
  choice: ከሕጉ ውጭ
  rationale: χωρίς የመለየትን ሐሳብ ይገልጣል፤ በአውዱም ሕጉ በዋናነት የሙሴን ሕግ ያመለክታል።
- source_word: δικαιοσύνη θεοῦ
  choice: የእግዚአብሔር ጽድቅ
  rationale: «ጽድቅ» የδικαιοσύνηን ሰፊ የጽድቅና የፍትሕ መስክ ይይዛል፤ የ«እግዚአብሔር» ባለቤትነት ቅርጽም ግሪኩ ያልወሰነውን የባለቤትነት፣ የምንጭ ወይም የባሕርይ/ድርጊት ግንኙነት አይዘጋም።
- source_word: πεφανέρωται
  choice: ተገልጧል
  rationale: የግሪኩን ፍጹም ጊዜ ማለትም ቀድሞ የተፈጸመና ውጤቱ አሁን የሚኖር መገለጥ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μαρτυρουμένη
  choice: ስለ እርሱ ይመሰክራሉ
  rationale: የግሪኩን የምስክርነት ሐሳብ ይጠብቃል፤ አማርኛው ግልጽ እንዲሆን ተሳቢው አገላለጽ ወደ ተፈጥሯዊ አድራጊ አረፍተ ነገር ተቀይሯል።
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: ሕጉና ነቢያት
  rationale: ይህ በዋናነት የታወቀውን የቅዱሳት መጻሕፍት መጠሪያ ያመለክታል፤ ቅርጹም በአማርኛ የመጽሐፍ ቅዱስ ንግግር የተለመደ ነው።
theological_decisions:
- issue: የ«δικαιοσύνη θεοῦ» ተዛማጅ ትርጉሞች
  choice: የእግዚአብሔር ጽድቅ
  alternative: ከእግዚአብሔር የሚመጣ ጽድቅ፤ የእግዚአብሔር ፍትሕ
  rationale: ይህ ሐረግ የእግዚአብሔርን የጽድቅ ባሕርይና ተግባር፣ እንዲሁም ከእርሱ የሚመጣውን ለማዳን የሚሰጥ ጽድቅ ሊያስተጋባ ይችላል። ዋናው ጽሑፍ ይህን የትርጉም ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጽድቅ» የመጽሐፍ ቅዱስ ትርጉማዊ ክብደቱን ሲጠብቅ፣ የግሪኩ ተሳቢ አገላለጽ ለተፈጥሯዊነት ወደ አድራጊ ሐረግ ተለውጧል።
