  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: am
  text: እንግዲህ ምንድን ነው? እኛ እንበልጣለን?[a] በፍጹም አይደለም፤ አይሁድንም ግሪኮችንም ሁሉ በኃጢአት ሥር[b] እንደሆኑ አስቀድመን ከሰናቸዋልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እኛ የተለየ ጥቅም አለን?»
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «በኃጢአት ኃይል ሥር»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: እንግዲህ ምንድን ነው?
  rationale: የοὖνን መደምደሚያዊ አገናኝነት በ«እንግዲህ» ያሳያል፤ በግሪክ የሌለውን «ምን እንበል?» የሚል ሐረግ ሳይጨምር አጭር ጥያቄውን ይጠብቃል።
- source_word: προεχόμεθα
  choice: እኛ እንበልጣለን?
  rationale: በአውዱ ውስጥ የአይሁድን አንጻራዊ ብልጫ የሚጠይቀውን ንባብ በቀጥተኛና ተፈጥሯዊ አማርኛ ያቀርባል፤ የ«ጥቅም አለን?» አማራጭ በማስታወሻ ተጠብቋል።
- source_word: οὐ πάντως
  choice: በፍጹም አይደለም
  rationale: በአውዱ ያለውን ጠንካራ እምቢታ ግልጽና ዘመናዊ በሆነ አማርኛ ይገልጣል።
- source_word: προῃτιασάμεθα
  choice: አስቀድመን ከሰናቸዋል
  rationale: ግሱ አስቀድሞ ክስ ማቅረብን ያመለክታል፤ «ከሰናቸዋል» የጳውሎስን የፍርድ ክርክር ቅርጽ ይጠብቃል።
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: አይሁድንም ግሪኮችንም
  rationale: የτε καὶን ጥንድ አወቃቀር በአማርኛው «-ም ... -ም» ይጠብቃል፤ የምንጩን «ግሪኮች» የሚል ቃልም አይቀይርም።
- source_word: πάντας
  choice: ሁሉ
  rationale: ሁለቱንም ቡድኖች ያለ ልዩነት የሚያካትተውን አጠቃላይነት በአጭሩ ይገልጣል።
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: በኃጢአት ሥር እንደሆኑ
  rationale: የጳውሎስን የበታችነት ወይም የተገዥነት ምስል በቅርብ ይጠብቃል፤ «በኃጢአት ኃይል ሥር» የሚለው ገላጭ አማራጭ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በπροεχόμεθα ውስጥ ያለው የመጀመሪያ መደብ ብዙ ቁጥር ትርጉም
  choice: ጥያቄው የአይሁድን አንጻራዊ ብልጫ እንደሚመለከት «እኛ እንበልጣለን?» ተብሎ ተተርጉሟል።
  alternative: ጥያቄው «እኛ ምንም ጥቅም አለን?» በሚል የአይሁድን ልዩ ጥቅም እንደሚጠይቅ ሊነበብ ይችላል።
  rationale: የሮሜ 3፥1-9 አውድ የአይሁድን መብትና ተጠያቂነት ይመለከታል። ዋናው ንባብ የዘር ወይም የቡድን ሥነ ምግባራዊ ብልጫን መካድ ያሳያል፤ ሌላው በቃሉ ሊቻል የሚችል ንባብ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «በኃጢአት ሥር» የሚለው የጳውሎስ አጭር ምሳሌያዊ አነጋገር እንዳይለሰልስ ተጠብቋል።
