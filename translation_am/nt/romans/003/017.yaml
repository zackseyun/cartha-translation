  rationale: የግሪኩን አያያዥ καὶ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ «-ም» በመተርጎም፣ ጳውሎስ በተከታታይ የሚያቀርባቸውን ክሶች እንዲቀጥሉ ያደርጋል።
