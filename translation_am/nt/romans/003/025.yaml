- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι ያለውን ሐረግ እንዴት ማያያዝ እንደሚገባ
  choice: በደሙ በማመን
  alternative: በእምነት፣ በደሙ
  rationale: ዋናው ንባብ እምነት ወደ ክርስቶስ ደም/የመሥዋዕት ሞት የተመራ እንደሆነ የሚያሳየውን የተለመደ አረዳድ ይከተላል፤ ደሙን እንደ መሣሪያዊ ምክንያት የሚያነበው አማራጭ በማስታወሻ ተጠብቋል።
- issue: δικαιοσύνηን በጳውሎስ ዐውድ እንዴት መተርጎም እንደሚገባ
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ የቃሉን ሰፊ ጳውሎሳዊ አጠቃቀም ይጠብቃል፤ በዚህ ዐውድ የእግዚአብሔር ፍትሕ የሚጎላበት ንባብም እንዳይጠፋ በማስታወሻ ቀርቧል።
