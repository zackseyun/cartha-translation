  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: am
  text: እርሱንም እግዚአብሔር በደሙ በሚደረግ እምነት[b] የማስተሰረያ መሥዋዕት[a] አድርጎ በግልጽ አቀረበው፤ ይህም እግዚአብሔር ቀድሞ የተፈጸሙ ኃጢአቶችን ሳይቀጣ በማለፉ ምክንያት ጽድቁን[c] ለማሳየት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቁጣን የሚያረግብ መሥዋዕት”፤ ወይም፣ “የስርየት መክደኛ”—በብሉይ ኪዳን የማስተሰረያ ደም ይረጭበት የነበረው የታቦቱ የወርቅ መክደኛ።
    reason: lexical_alternative
  - marker: b
    text: ሐረጉ፣ “በእምነት፣ በደሙ” ተብሎም ሊገባ ይችላል፤ ዋናው ጽሑፍ ግን “በደሙ በሚደረግ እምነት” የሚለውን ንባብ ይከተላል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “ፍትሑን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: በግልጽ አቀረበው
  rationale: ቃሉ በዐውድ የሚያመለክተውን በሰዎች ፊት የማቅረብ ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ‘በግልጽ’ የሕዝባዊ መገለጥን አውዳዊ ኃይል ያሳያል።
- source_word: ἱλαστήριον
  choice: የማስተሰረያ መሥዋዕት
  rationale: የመሥዋዕትነቱንና ኃጢአትን የማስወገድ/የማስተሰረይ ተግባሩን ለተራ አንባቢ በሚገባ ያሳያል፤ ቃሉን በእግዚአብሔር ቁጣ ማርገብ ወይም በታቦቱ ላይ ባለው የስርየት መክደኛ ትርጉም ብቻ አይገድበውም።
- source_word: διὰ πίστεως
  choice: በማመን
  rationale: የπίστιςን የእምነት/የመታመን ፍቺ በቀላልና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: በደሙ
  rationale: የግሪኩን አጭር አገላለጽ ይጠብቃል፤ ከ‘በማመን’ ጋር ሲነበብ በደሙ ማመንን ያመለክታል፣ ሌላው ሰዋሰዋዊ አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: εἰς ἔνδειξιν
  choice: ለማሳየት
  rationale: የዓላማን ወይም የውጤትን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δικαιοσύνης
  choice: ጽድቁን
  rationale: በጳውሎስ አጠቃቀም የተለመደውን ‘ጽድቅ’ ይጠብቃል፤ ‘ፍትሕ’ የሚለው ተቀራራቢ ፍቺ በማስታወሻ ተጠብቋል።
- source_word: πάρεσιν
  choice: ሳይቀጣ በማለፉ
  rationale: ቃሉ ከሙሉ ይቅርታ ይልቅ ቀደም ያለ ኃጢአትን ለጊዜው ሳይቀጡ ማለፍን እንደሚያመለክት ግልጽ ያደርጋል።
- source_word: προγεγονότων ἁμαρτημάτων
  choice: ቀድሞ የተፈጸሙትን ኃጢአቶች
  rationale: የጊዜውን ቅድሚያና የተፈጸመ ድርጊትን በግልጽ ዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ἱλαστήριον የሚለውን አከራካሪ ቃል እንዴት መተርጎም እንደሚገባ
  choice: የማስተሰረያ መሥዋዕት
  alternative: ቁጣን የሚያረግብ መሥዋዕት፤ ወይም የስርየት መክደኛ
