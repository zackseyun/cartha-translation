  rationale: ጽድቅ የግሪኩን ቃል ሥነ ምግባራዊና ፍርዳዊ ስፋት በጥሩ ሁኔታ የሚይዝ የተለመደ የአማርኛ አቻ ነው፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
