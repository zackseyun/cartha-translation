  terminology: “የእግዚአብሔር ጽድቅ,” “ኢየሱስ መሲሕ,” and “ልዩነት” are appropriate. The two notes preserve the lexical alternative for δικαιοσύνη and the genuinely disputed reading of πίστεως Ἰησοῦ Χριστοῦ.
