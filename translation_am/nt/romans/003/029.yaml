  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: am
  text: ወይስ እግዚአብሔር የአይሁድ ብቻ ነው? የአሕዛብስ[a] ደግሞ አይደለምን? አዎን፣ የአሕዛብም ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ἐθνῶν የሚለውን ቃል ይበልጥ ቃል በቃል ‘ብሔራት’ ብሎ መተርጎም ይቻላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: በጳውሎስ ክርክር ውስጥ ቀጣዩን አማራጭ ጥያቄ በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: Ἰουδαίων
  choice: የአይሁድ
  rationale: የባለቤትነት አገባቡን ጠብቆ ‘የአይሁድ አምላክ’ የሚለውን ግንኙነት በግልጽ ያሳያል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በዚህ ነጠላና የታወቀ ማጣቀሻ ውስጥ θεόςን በተለመደውና በክብር ባለው የአማርኛ መጠሪያ ይተረጉማል።
- source_word: μόνον
  choice: ብቻ
  rationale: የማግለል ትርጉሙንና የጥያቄውን አጽንዖት በቀጥታ ያስተላልፋል።
- source_word: οὐχὶ
  choice: አይደለምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪኩን አሉታዊ አጠያየቅ በተፈጥሯዊ የአማርኛ ጥያቄ ይገልጣል።
- source_word: ἐθνῶν
  choice: የአሕዛብ
  rationale: ከአይሁድ ጋር በተደረገው ንጽጽር አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል፤ ‘አሕዛብ’ ይህን ልዩ አገባባዊ ትርጉም ይጠብቃል።
- source_word: ναὶ
  choice: አዎን
  rationale: ለንግግራዊው ጥያቄ የተሰጠውን አጭርና ግልጽ አዎንታዊ መልስ ያስተላልፋል።
- source_word: καὶ
  choice: ደግሞ / -ም
  rationale: አሕዛብን ከአይሁድ ጋር አብሮ የሚያካትተውን አጽንዖት በተፈጥሯዊ የአማርኛ ቅርጾች ያሳያል።
theological_decisions:
- issue: ἐθνῶν እንደ ‘አሕዛብ’ ወይም ‘ብሔራት’ መተርጎም
  choice: አሕዛብ
  alternative: ብሔራት
  rationale: አይሁድና ἐθνῶν በቀጥታ ስለተነጻጸሩ፣ ቃሉ በዋናነት አይሁድ ያልሆኑ ሕዝቦችን እንጂ የፖለቲካ አገራትን አያመለክትም። ‘አሕዛብ’ አንዱ እግዚአብሔር የአይሁድም የአይሁድ ያልሆኑትም መሆኑን የሚገልጠውን የጳውሎስን ክርክር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በሁለተኛው ጥያቄ በግሪክ የተዘለለው ‘እግዚአብሔር’ በአማርኛም ከአውዱ እንዲገባ ተዘሏል፤ ይህም የግሪኩን አጭር ንግግራዊ ኃይል ይጠብቃል።
