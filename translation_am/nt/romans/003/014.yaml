translation:
  language: am
  text: አፋቸው በእርግማንና በምሬት የተሞላ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: አፋቸው
  rationale: የዝምድናው ተውላጠ ስም በአማርኛ በባለቤትነት ቅጥያው «-ቸው» በተፈጥሯዊ ሁኔታ ተገልጿል፤ ይህም በቀደመው አውድ የተጠቀሱትን ሰዎች ያመለክታል።
- source_word: στόμα
  choice: አፍ
  rationale: ነጠላውን ስም እንደ ምንጩ ጠብቆ፣ የንግግር ምንጭን በተለመደው አማርኛ ይገልጻል።
- source_word: ἀρᾶς
  choice: እርግማን
  rationale: ሌላው ላይ ጉዳት የሚጠራ ወይም መጥፎ የሚመኝ ንግግርን የሚያመለክተውን የግሪኩን ስም በቀጥታ ያስተላልፋል።
- source_word: πικρίας
  choice: ምሬት
  rationale: የመራራነትን ሥነ ምግባራዊና የንግግር ኃይል የሚጠብቅ ግልጽና የተለመደ አማርኛ ነው።
- source_word: γέμει
  choice: የተሞላ ነው
  rationale: የአሁን ጊዜ ሁኔታን በተፈጥሯዊ አማርኛ ይገልጻል፤ «ሞልቷል» የሚለውን አማራጭ ትርጉምም ሳያስወግድ የመሞላቱን የቆየ ሁኔታ ያጎላል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አገላለጽ። የምንጩ ነጠላ «አፍ» በብዙ ባለቤት ቅጥያ ቀርቧል፤ «እርግማንና ምሬት» የሚለውም ሁለቱን የግሪክ ስሞች በአጭርና ቀጥተኛ መንገድ ያቀርባል።
