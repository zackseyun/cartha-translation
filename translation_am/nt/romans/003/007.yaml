  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: am
  text: ነገር ግን የእግዚአብሔር እውነተኛነት በእኔ ውሸት ምክንያት ለእርሱ ክብር የበለጠ በዝቶ ከሆነ፣ ታዲያ በእኔ ላይ እንደ ኃጢአተኛ ፍርድ የሚሰጠው እስካሁን ለምን ነው?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: የእግዚአብሔር እውነተኛነት
  rationale: በቁጥር 4–7 ያለው ንጽጽር የእግዚአብሔርን እውነተኛነት ከሰው ውሸት ጋር ያነጻጽራል፤ ይህ አተረጓጎም የግሪኩን የግብረ ገብ ታማኝነት ሐሳብ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: በእኔ ውሸት
  rationale: ἐν እዚህ የመሣሪያን ወይም የምክንያትን ግንኙነት ሊያመለክት ይችላል፤ ‘በ’ የግሪኩን አጭርነትና አሻሚነት ይጠብቃል።
- source_word: ψεύσματι
  choice: ውሸት
  rationale: ቀጥተኛ፣ ዘመናዊና በቀላሉ የሚገባ አማርኛ ሲሆን ከእውነተኛነት ጋር ያለውን ንጽጽር ያጎላል።
- source_word: ἐπερίσσευσεν
  choice: እጅግ በዝቶ ከታየ
  rationale: ግሱ መብዛትን ወይም በብዛት መገለጥን ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ሆኖ የውጤቱን ታይነት ያቀርባል።
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: ለእርሱ ክብር
  rationale: εἰς የውጤትን ወይም የዓላማን አቅጣጫ ሊገልጥ ይችላል፤ ‘ለ’ ሁለቱንም ሳያጠብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τί ἔτι
  choice: እስካሁን ለምን
  rationale: የἔτιን ቀጣይነት በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: κἀγώ ያለውን ጨማሪ ስሜት ‘-ም’ በተፈጥሯዊነት ይጠብቃል።
- source_word: κρίνομαι
  choice: እፈረድብኛለሁ
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና በሰውየው ላይ ፍርድ መሰጠቱን ያሳያል፤ ወዲያውኑ ‘መኮነን’ ብሎ አያጠበውም።
- source_word: ὡς ἁμαρτωλὸς
  choice: እንደ ኃጢአተኛ
  rationale: የግሪኩን የሁኔታ አገላለጽ ቀጥተኛና የተለመደ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ እንደ አጠቃላይ ‘እውነት’ ወይስ እንደ ግላዊና ሥነ ምግባራዊ ‘እውነተኛነት’ መተርጎሙ
  choice: የእግዚአብሔር እውነተኛነት
  alternative: የእግዚአብሔር እውነት
  rationale: በሮሜ 3፥4–7 እግዚአብሔር እውነተኛ መሆኑ ከሰው ውሸታምነት ጋር ይነጻጸራል። ‘እውነተኛነት’ ይህን ንጽጽር ያሳያል፤ የ‘እውነት’ አማራጭ ግን የስም ቅርጹን ይበልጥ በቀጥታ ይከተላል።
- issue: εἰς τὴν δόξαν αὐτοῦ ዓላማን ወይስ ውጤትን እንደሚያመለክት
  choice: ለእርሱ ክብር
  alternative: ወደ እርሱ ክብር
  rationale: የግሪኩ ሐረግ የዓላማና የውጤት ንባብን ይፈቅዳል፤ ‘ለእርሱ ክብር’ አንዱን ብቻ በግድ ሳይወስን ተፈጥሯዊ አማርኛ ይሰጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መዝገብ ተጠቅሟል። የጥያቄው ክርክራዊ ቃና በ‘ታዲያ’ እና ‘እኔም’ ተጠብቋል። የአማርኛ ጽሑፉ ማስታወሻ ስለማያስፈልገው የግርጌ ማስታወሻ አልተጨመረም።
