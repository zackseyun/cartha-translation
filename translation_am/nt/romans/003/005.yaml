base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: am
  text: ነገር ግን፣ የእኛ ኢፍትሐዊነት የእግዚአብሔርን ጽድቅ[a] የሚያሳይ ከሆነ፣ ምን እንላለን? እግዚአብሔር ቁጣን ስለሚያመጣ ኢፍትሐዊ ነውን? (ይህን የምለው እንደ ሰው አስተሳሰብ ነው።)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእኛ ኢፍትሐዊነት የእግዚአብሔርን ፍትሕ የሚያሳይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: ዓመፃ
  rationale: ከእግዚአብሔር ጽድቅ ጋር ያለውን ሥነ ምግባራዊና ግንኙነታዊ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ኢፍትሐዊነት’ የሚለው የፍርድ አማራጭ በማስታወሻው ተጠብቋል።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: የጳውሎስን ሰፊ የጽድቅ ቃላት አጠቃቀም ይጠብቃል፤ ‘ፍትሕ’ በዚህ አውድ ሊሆን የሚችል አማራጭ ሆኖ በማስታወሻ ቀርቧል።
- source_word: συνίστησιν
  choice: የሚያሳይ
  rationale: የሰው ዓመፃ የእግዚአብሔርን ጽድቅ ግልጽ እንደሚያደርግ የሚገልጠውን የአውዱን ትርጉም በቀላልና ዘመናዊ አማርኛ ያቀርባል።
- source_word: μὴ ἄδικος
  choice: ፍትሕ የለሽ ነውን?
  rationale: μή አሉታዊ መልስ የሚጠብቀውን የክርክር ጥያቄ ያመለክታል፤ ትርጉሙ ግን ይህን በተጨማሪ የመለያ ጥያቄ ሳይፈታ በቀጥታ ያቀርበዋል።
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: ቁጣውን የሚያመጣው
  rationale: ἐπιφέρωን በቅርብ ሁኔታ ይከተላል፣ ὀργήንም በመጽሐፍ ቅዱሳዊና ተፈጥሯዊው ‘ቁጣ’ ይተረጉማል።
- source_word: κατὰ ἄνθρωπον λέγω
  choice: ይህን የምለው በሰው አስተሳሰብ ነው
  rationale: ጳውሎስ ክርክሩን ከሰው አመለካከት እያቀረበ መሆኑን የሚጠቁመውን ፈሊጥ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ስለ እግዚአብሔር ፍትሕና ቁጣ የቀረበውን የጳውሎስ የክርክር ጥያቄ አቀራረብ
  choice: “እግዚአብሔር ፍትሕ የለሽ ነውን?” ብሎ ቀጥተኛ ጥያቄ ማቅረብ
  alternative: “እግዚአብሔር ፍትሕ የለሽ አይደለም፣ ነውን?” ብሎ አሉታዊ መልስን በግልጽ ማመልከት
  rationale: μή ጥያቄው አሉታዊ መልስ እንደሚጠብቅ ቢጠቁምም፣ የግሪኩን የክርክር ውጥረት ሳይፈታና ተጨማሪ አጽንዖት ሳይጨምር ቀጥተኛው ጥያቄ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ጽድቅ’ የመጽሐፍ ቅዱስን ቃላዊ ትስስር ይጠብቃል፣ ሐረጎቹ ግን በዘመናዊ አገባብ ተቀርጸዋል።
