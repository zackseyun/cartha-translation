  rationale: ግሱ አለማመንንም ሆነ ታማኝ አለመሆንን ሊያመለክት ይችላል፤ እዚህ ከἀπιστία እና ከመለኮታዊ πίστις ጋር ያለውን ተቃርኖ ለመጠበቅ «ያልታመኑ» ተመርጧል።
