  text: ሕጉ የሚለውን ሁሉ በሕጉ ሥር ላሉት[a] እንደሚናገር እናውቃለን፤ ይህም አፍ ሁሉ እንዲዘጋ[b]፣ ዓለምም ሁሉ ለእግዚአብሔር ተጠያቂ[c] እንዲሆን ነው።
