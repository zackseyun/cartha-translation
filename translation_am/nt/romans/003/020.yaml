review_pass:
  verdict: revise
  source_fidelity: The first clause accurately retains the universal negation, the judicial sense of δικαιωθήσεται, and the phrase “before him.” However, “ኃጢአት ምን እንደሆነ የሚታወቀው” narrows ἐπίγνωσις ἁμαρτίας to knowing the definition of sin, whereas the Greek more broadly expresses knowledge or recognition of sin.
  naturalness: The draft is clear and readable modern Amharic. “የኃጢአት እውቀት” is both natural in this formal biblical register and more concise.
  terminology: “የሕግ ሥራዎች” and “ይጸድቃል” appropriately preserve the source wording and its judicial register without imposing a denominational interpretation. “ማንም” is an acceptable contextual rendering of πᾶσα σὰρξ.
  issues:
