    issue: The rendering of ἐπίγνωσις ἁμαρτίας is overly restrictive.
    rationale: “ኃጢአት ምን እንደሆነ የሚታወቀው” means knowing what sin is, potentially limiting the statement to definition. The Greek states that knowledge/recognition of sin comes through the law.
