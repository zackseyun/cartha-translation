id: ROM.3.20
reference: Romans 3:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: am
  text: ምክንያቱም የሕግን ሥራዎች በመሥራት በእርሱ ፊት የሚጸድቅ ማንም የለም፤ በሕግ አማካይነት የኃጢአት እውቀት ይመጣልና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: የሕግን ሥራዎች በመሥራት
  rationale: የἐκን መሠረት/መንገድ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል፤ ἔργων νόμουንም በቀጥታ ይጠብቃል።
- source_word: οὐ δικαιωθήσεται
  choice: የሚጸድቅ ... የለም
  rationale: የወደፊት ተደራጊ ቅርጹን በአማርኛ ተፈጥሯዊ አገላለጽ ያቀርባል፤ መጽደቅ የፍርድ አውድን ይጠብቃል።
- source_word: πᾶσα σὰρξ
  choice: ማንም
  rationale: በዚህ አውድ የሰው ልጅን በሙሉ የሚያመለክተውን ሴማዊ አገላለጽ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐνώπιον αὐτοῦ
  choice: በእርሱ ፊት
  rationale: የፍርድና የተጠያቂነት አውዱን የሚጠብቅ ቀጥተኛና የተለመደ አገላለጽ ነው።
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: ኃጢአት ምን እንደሆነ የሚታወቀው
  rationale: ἐπίγνωσιςን እንደ እውቀት/መገንዘብ ያቀርባል፤ ኃጢአትን ማወቅ ማለት ኃጢአት መሥራት እንዳይመስል በተፈጥሯዊ አማርኛ ያብራራል።
theological_decisions:
- issue: δικαιόω የፍርድ ወይም የሥነ ምግባር ትርጉም
  choice: ይጸድቃል
  alternative: ጻድቅ ሆኖ ይቆጠራል
  rationale: «መጽደቅ» የግሪኩን የፍርድ ገጽታ ሳያስወግድ በአማርኛ መጽሐፍ ቅዱሳዊ ቋንቋ የታወቀ ነው፤ የአንድን ወገን ዝርዝር የአስተምህሮ ቀመር አያስገባም።
- issue: ἔργα νόμου ወሰን
  choice: የሕግ ሥራዎች
  alternative: ሕጉ የሚያዘውን ማድረግ
  rationale: የግሪኩን ክፍት አገላለጽ ይጠብቃል፤ ቃሉን ሥነ ሥርዓታዊ ትእዛዛት ብቻ ወይም ሕጉን ሁሉ ብቻ ብሎ አስቀድሞ አይወስንም።
- issue: πᾶσα σὰρξ ቃል በቃል ወይም ተግባራዊ አተረጓጎም
  choice: ማንም
  alternative: ሥጋ የለበሰ ሁሉ
  rationale: የአዲሱን ኪዳን ፈሊጣዊ አገላለጽ ዓላማ ለዘመናዊ አንባቢ ግልጽ ያደርጋል፤ «ሥጋ» ሥጋዊ አካልን ብቻ እንዳያመለክት ይከላከላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ምክንያታዊ ትስስር διότι/γάρ በ«ምክንያቱም» እና «ነውና» ተጠብቋል። የግርጌ ማስታወሻ ስለሌለ ምልክት አልገባም።
