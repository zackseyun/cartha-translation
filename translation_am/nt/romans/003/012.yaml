base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: am
  text: ሁሉም አፈነገጡ፤ በአንድነት የማይጠቅሙ ሆነዋል።[a] መልካምነትን የሚያደርግ የለም፤[b] አንድም እንኳ የለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአንድነት ዋጋ ቢስ ሆነዋል” ወይም “ተበላሽተዋል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መልካም ነገርን የሚያደርግ የለም።” የግሪኩ ቃል “ደግነት” የሚል ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: ሁሉም
  rationale: በግሪክ ያለውን ሁሉን አቀፍ ብዙ ቁጥር ተጨማሪ ስም ሳይገባ ይጠብቃል።
- source_word: ἐξέκλιναν
  choice: ከመንገድ ወጥተዋል
  rationale: ከትክክለኛው የሥነ ምግባር መንገድ መ desviትን በተፈጥሯዊ አማርኛ ይገልጣል፤ የተፈጸመውንም ውጤት ያሳያል።
- source_word: ἅμα
  choice: በአንድነት
  rationale: ሁሉም ይህን ሁኔታ በጋራ እንደሚጋሩ የሚያሳየውን ስብስባዊ ኃይል ይጠብቃል።
- source_word: ἠχρεώθησαν
  choice: የማይጠቅሙ ሆነዋል
  rationale: የግሪኩን ተደራጊና ውጤታዊ ትርጉም በተፈጥሯዊ አማርኛ ይይዛል፤ ‘ዋጋ ቢስ’ ከሚለው ይልቅ ከጥቅም ውጭ መሆንን በግልጽ ያሳያል።
- source_word: ποιῶν
  choice: የሚያደርግ
  rationale: የአሁን ጊዜውን ተሳቢ አወቃቀርና የተደጋጋሚ ተግባር ኃይል በአማርኛ አንጻራዊ ግስ ይጠብቃል።
- source_word: χρηστότητα
  choice: መልካምነትን
  rationale: የሥነ ምግባር መልካምነትን ይገልጣል፤ ቃሉ ደግነትንም ሊያመለክት ስለሚችል ይህ በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἔστιν
  choice: የለም
  rationale: ጠንካራውን አሉታዊ አገላለጽ በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἕως ἑνός
  choice: አንድም እንኳ የለም
  rationale: የግሪኩን ፈሊጣዊና አጽንዖታዊ መደምደሚያ በተፈጥሯዊ አማርኛ ይገልጣል።
