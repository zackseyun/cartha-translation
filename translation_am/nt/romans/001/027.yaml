  rationale: በግሪኩ ያለውን የቃሉን ድግግሞሽና የፆታ አመልካችነት ይጠብቃል።
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: ነውርን እየፈጸሙ
  rationale: የἀσχημοσύνηን የሞራል ክብደት ሳያሰፋ ያቆያል፤ የተሳቢውንም ቀጣይ ድርጊት ያሳያል።
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: የሚገባውን ብድራት
  rationale: ἀντιμισθία የሚያመለክተውን ተመጣጣኝ መልስ ወይም ፍዳ፣ ἔδει የሚያመለክተውንም ተገቢነት ያካትታል።
