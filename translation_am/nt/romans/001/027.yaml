  rationale: የχρῆσιςን ‘መጠቀም’ የሚለውን ቅርብ ፍቺ ያቆያል፤ የἀφέντεςንም ከዋናው ግስ በፊት የተፈጸመ ድርጊት ያሳያል።
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
