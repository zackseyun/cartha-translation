review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Greek male/female wording, the reciprocal desire, the morally weighted ἀσχημοσύνη, and the corresponding recompense. However, “ሴቷን በተፈጥሮ መጠቀምን” makes the female appear as the direct object of “use” and does not naturally express the genitive phrase τῆς θηλείας. The final finite verb “ተቀበሉ” also weakens the Greek's coordinated participial construction.
  naturalness: The revised wording uses idiomatic modern standard Amharic while retaining the formal register and the source's sexual context. “ከሴቷ ጋር ያለውን ተፈጥሯዊ ግንኙነት” is clearer and more natural than the draft's construction. Coordinating “እየፈጸሙና እየተቀበሉ” also better matches the flow of the sentence.
  terminology: “ወንዶቹ … ሴቷ … ወንዶች ከወንዶች ጋር” retains the biologically marked contrast without importing relational or doctrinal terminology. “ነውር” suitably conveys ἀσχημοσύνη. “የሚገባው ብድራት” retains the breadth of ἀντιμισθία better than an unqualified “ቅጣት.”
  issues:
  - severity: medium
    issue: The phrase “ሴቷን በተፈጥሮ መጠቀምን” is syntactically and semantically awkward.
    rationale: It can be read as treating “the female” as the direct object of use, whereas the Greek refers to the natural sexual use/relations of the female. A relational expression communicates the contextual sense naturally without adding a doctrinal interpretation.
  - severity: low
    issue: “ተቀበሉ” changes the final participle into a separate finite action.
    rationale: κατεργαζόμενοι and ἀπολαμβάνοντες are coordinated present participles. Rendering both with coordinated imperfective participial forms better preserves their grammatical relation to “were inflamed.”},{
