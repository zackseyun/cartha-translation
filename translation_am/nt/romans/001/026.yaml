  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: am
  text: 'ስለዚህ እግዚአብሔር ለአሳፋሪ ምኞቶች አሳልፎ ሰጣቸው፤ የእነርሱ ሴቶችም[a] እንኳ ተፈጥሯዊውን ግንኙነት[b] በተፈጥሮ ተቃራኒ በሆነው[c] ተኩት።


    [a] ወይም በቃል በቃል፣ “እንስቶቻቸው።”


    [b] ወይም “ተፈጥሯዊውን አጠቃቀም።”


    [c] ወይም “ከተፈጥሮ ጋር ተቃራኒ የሆነው።”'
  philosophy: optimal-equivalence
