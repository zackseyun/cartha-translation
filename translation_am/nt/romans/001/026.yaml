  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭርነትና ሥነ ምግባራዊ ውጥረት ተጠብቋል፤ የቃል በቃል አማራጮች ዋናውን ጽሑፍ እንዳያከብዱ በማስታወሻ ቀርበዋል።
