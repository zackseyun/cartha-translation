  rationale: ጥቅሱ ራሱ የሥነ ምግባር ግምገማ ስላለው ያንን ኃይል መጠበቅ ያስፈልጋል፤ ነገር ግን ጽሑፉ ከሚለው በላይ የዘመኑን ሥነ ማኅበራዊ ወይም እምነታዊ ምድቦች መጨመር አይገባም።
