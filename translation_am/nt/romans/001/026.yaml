theological_decisions:
- issue: የጳውሎስን ሥነ ምግባራዊ ግምገማ ማጠንከር ወይም ማለስለስ
  choice: “አሳፋሪ” እና “ተፈጥሮን በሚቃረነው” የሚሉትን ገላጭ ቃላት ማቆየት
