  text: ማስተዋል የሌላቸው፣ ቃላቸውን የማይጠብቁ[a]፣ የቤተሰብ ፍቅር የሌላቸው[b]፣ ምሕረት የሌላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «የማይታመኑ» ወይም «ቃል ኪዳን የሚያፈርሱ»።
    reason: lexical_alternative
  - marker: b
    text: ይህ አገላለጽ በተለይ በቤተሰብ መካከል ሊኖር የሚገባው ተፈጥሯዊ ፍቅር የሌላቸው ማለት ነው።
