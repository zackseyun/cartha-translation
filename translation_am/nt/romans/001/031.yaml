lexical_decisions:
- source_word: ἀσυνέτους
  choice: ማስተዋል የሌላቸው
  rationale: ቃሉ የማስተዋልና የመለየት እጥረትን ያመለክታል፤ ይህ አተረጓጎም ቃሉን ተራ የአእምሮ ችሎታ እጥረት አድርጎ ሳያቀርብ ሥነ ምግባራዊውንና አእምሯዊውን ኃይል ይጠብቃል።
- source_word: ἀσυνθέτους
  choice: ቃላቸውን የማይጠብቁ
  rationale: ቃሉ ስምምነትን ወይም የገቡትን ቃል የማይጠብቁ ሰዎችን ያመለክታል። የተመረጠው አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ከ‘ቃል ኪዳን’ ብቻ የሰፋውን የቃሉን ክልል ይጠብቃል።
- source_word: ἀστόργους
  choice: የቤተሰብ ፍቅር የሌላቸው
  rationale: ቃሉ በተለይ በቤተሰብና በዘመድ መካከል ሊኖር የሚገባውን ተፈጥሯዊ ፍቅር መጣት ያመለክታል። ግልጽ አተረጓጎም የግሪኩን ልዩ ትርጉም ከአጠቃላይ ‘ፍቅር የሌላቸው’ በተሻለ ያስተላልፋል።
- source_word: ἀνελεήμονας
  choice: ምሕረት የሌላቸው
  rationale: ቃሉ ለሌሎች ምሕረትና ርኅራኄ የማያሳዩ መሆንን በቀጥታ ያመለክታል፤ ይህም ግልጽና የተለመደ ዘመናዊ አማርኛ ነው።
