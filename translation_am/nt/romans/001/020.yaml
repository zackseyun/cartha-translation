base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: am
  text: ምክንያቱም የማይታዩት ባሕርያቱ[a]፣ ማለትም ዘላለማዊ ኃይሉና መለኮታዊነቱ[b]፣ ዓለም ከተፈጠረ ጀምሮ በተፈጠሩት ነገሮች በኩል በአእምሮ ተረድተው በግልጽ ይታያሉ፤ ስለዚህ እነርሱ ምንም ማመካኛ የላቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እርሱ የማይታዩት ነገሮች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መለኮታዊ ባሕርዩ።” እዚህ ላይ ያለው የግሪክ ቃል θειότης ሲሆን፣ ይህም መለኮታዊ ባሕርይን ወይም ጥራትን ያመለክታል፤ እንደ θεότης ያለ ይበልጥ ጠንካራ ቃል አይደለም።
    reason: lexical_alternative
