id: ROM.1.9
reference: Romans 1:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: am
  text: በመንፈሴ በልጁ የምሥራች ቃል የማገለግለው እግዚአብሔር፣ ሳላቋርጥ እንደምጠቅሳችሁ ምስክሬ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: ምስክሬ
  rationale: በዚህ እንደ መሐላ በሚመስል አገላለጽ ውስጥ፣ እግዚአብሔር የጳውሎስን ንግግር እውነተኛነት የሚመሰክር መሆኑን ያሳያል።
- source_word: λατρεύω
  choice: የማገለግለው
  rationale: ቃሉ ሃይማኖታዊ አገልግሎትንና አምልኮን ሊያመለክት ይችላል፤ ‘ማገልገል’ የጳውሎስን ሙሉ ቁርጠኝነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῷ πνεύματί μου
  choice: በመንፈሴ
  rationale: የግሪኩን ἐν ሆን ብሎ ሳይገድብ፣ ውስጣዊ ማንነትንም ሆነ የአገልግሎቱን መንገድ ሊያመለክት የሚችል አጭርና ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: ስለ ልጁ በሚናገረው የምሥራች ቃል
  rationale: εὐαγγέλιονን በተለመደውና በቀላሉ በሚገባው ‘የምሥራች ቃል’ ይተረጉማል። የወራሽነት ግንኙነቱ የልጁ የሆነውን ወይም ስለ ልጁ የሚናገረውን ወንጌል ሊያመለክት ስለሚችል፣ እዚህ የይዘት ትርጉሙ በተፈጥሯዊ አማርኛ ተመርጧል።
- source_word: ἀδιαλείπτως
  choice: ሳላቋርጥ
  rationale: ቃሉ ቀጣይነት ያለውንና የማይቋረጥ ድርጊት ያሳያል፤ በአማርኛ ይህ አገላለጽ ከ‘እንደማነሣችሁ’ ጋር ተፈጥሯዊ ነው።
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: እንደማነሣችሁ
  rationale: የግሪኩ ፈሊጥ ቃል በቃል ‘ስለ እናንተ መጥቀስን አደርጋለሁ’ ማለት ነው፤ ‘አነሣችኋለሁ’ ይህን ሳይጨምር በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἐν τῷ πνεύματί μου ቦታን ወይም መንገድን/መሣሪያን የሚያመለክት መሆኑ
  choice: በመንፈሴ
  alternative: ከመንፈሴ ጋር / በውስጤ
  rationale: ‘በመንፈሴ’ የግሪኩን አሻሚነት በአብዛኛው ይጠብቃል፤ አገልግሎቱ በውስጣዊ ማንነቱ የሚፈጸም መሆኑንም ሆነ መንፈሱ የአገልግሎቱ መንገድ መሆኑን አይዘጋም።
- issue: τοῦ υἱοῦ αὐτοῦ የወራሽነት ግንኙነት
  choice: ስለ ልጁ በሚናገረው
  alternative: የልጁ በሆነው
  rationale: የይዘት ወራሽነት—የምሥራቹ ቃል ስለ እግዚአብሔር ልጅ መሆኑ—በአማርኛ ግልጽና ተፈጥሯዊ ነው። አማራጩ የባለቤትነት ወይም የምንጭነት ግንኙነትን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረዥም ዓረፍተ ነገር ግንኙነት ተጠብቆ፣ ዋናው ሐሳብ ‘እግዚአብሔር ... ምስክሬ ነው’ በግልጽ እንዲታይ ተደርጓል።
