lexical_decisions:
- source_word: ὃ
  choice: ይህን ወንጌል
  rationale: ተውላጠ ስሙ በሮሜ 1፥1 ወደተጠቀሰው ወንጌል ይመለሳል፤ በአማርኛ የአንቀጹን ግንኙነት በተፈጥሮ ግልጽ ለማድረግ ስሙ ተደግሟል።
- source_word: προεπηγγείλατο
  choice: አስቀድሞ … ተስፋ ሰጥቶ ነበር
  rationale: የግሱን የቀደመ ጊዜና የተስፋ ቃል ኃይል ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: በነቢያቱ አማካኝነት
  rationale: διὰ ከወራሽ ቅጽ ጋር ያለውን የመካከለኛ ወኪልነት ያሳያል፤ αὐτοῦ ደግሞ በባለቤትነት ቅጥያው ተጠብቋል።
- source_word: ἐν γραφαῖς ἁγίαις
  choice: በቅዱሳት መጻሕፍት
  rationale: ἐν የጽሑፍ ስፍራን ወይም መድረክን ያመለክታል፤ γραφαῖς በዚህ አውድ የታወቁትን ቅዱሳት መጻሕፍት ስለሚያመለክት ይህ የተለመደ አገላለጽ ተመርጧል።
