  choice: ቅዱሳት መጻሕፍት
  alternative: ቅዱሳት ጽሑፎች
  rationale: በጳውሎስ አጠቃቀምና በዚህ አውድ γραφαί ተራ ጽሑፎችን ሳይሆን እንደ ቅዱስ ቃል የታወቁ መጻሕፍትን ያመለክታል፤ አማራጩ ግን የግሪኩን ቀጥተኛ ሰፊ ትርጉም ይጠብቃል።
