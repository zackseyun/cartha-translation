source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: am
  text: በመጀመሪያ፣ ስለ ሁላችሁ በኢየሱስ መሲሕ[a] አማካይነት አምላኬን አመሰግናለሁ፤ ምክንያቱም እምነታችሁ[b] በዓለም ሁሉ እየታወጀ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ክርስቶስ።
    reason: alternative_rendering
  - marker: b
    text: ወይም፣ ታማኝነታችሁ፤ እንዲሁም መታመናችሁ ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: በመጀመሪያ
  rationale: የጳውሎስን የንግግር መክፈቻ ያመለክታል፤ μὲν በአማርኛ በተለየ ቃል ሳይተረጎም በሐረጉ ውስጥ ተዋሕዷል።
- source_word: εὐχαριστῶ
  choice: አመሰግናለሁ
  rationale: ቀጥተኛውን የምስጋና ትርጉምና የመጀመሪያ መደብ ነጠላ ቅርጹን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῷ θεῷ μου
  choice: አምላኬን
  rationale: የግል አድራጊነቱንና የጳውሎስን የአምልኮ ቅርበት ይጠብቃል።
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሕ አማካይነት
  rationale: διά ከወራሽ ቅጽ ጋር ያለውን የአማካይነት ትርጉም ይጠብቃል፤ Χριστός እንደ ማዕረግ በትርጉሙ ‘መሲሕ’ ተብሏል።
- source_word: περὶ πάντων ὑμῶν
  choice: ስለ ሁላችሁ
  rationale: በምስጋናው ዐውድ ውስጥ περί የሚያመለክተውን ‘ስለ/ስለ ጉዳይ’ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἡ πίστις ὑμῶν
  choice: እምነታችሁ
  rationale: πίστις በዚህ ዐውድ የሮማውያንን የማመን ምላሽ በተሻለ ሁኔታ ይገልጣል፤ የታማኝነትና የመታመን አማራጭ ገጽታዎቹ በማስታወሻ ተጠብቀዋል።
- source_word: καταγγέλλεται
  choice: እየታወጀ ነው
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና ቀጣይ የሕዝብ አዋጅ ሐሳቡን ያስተላልፋል።
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: በዓለም ሁሉ
  rationale: በዐውዱ ያለውን ሰፊና አጽንዖታዊ የዓለም ወሰን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በδιὰ Ἰησοῦ Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός የቅቡዕ ማዕረግ ስለሆነ ‘መሲሕ’ ትርጉሙን በግልጽ ያቀርባል፤ ባህላዊው የድምፅ ቅጂ ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- issue: በἡ πίστις ὑμῶν ውስጥ πίστιςን መተርጎም
  choice: እምነታችሁ
  alternative: ታማኝነታችሁ፤ እንዲሁም መታመናችሁ
  rationale: ‘እምነት’ በዚህ ስፍራ ዋናውን የማመን ሐሳብ ይይዛል፤ የቃሉ ሌሎች ትርጉማዊ ገጽታዎች ግን እንዳይጠፉ በማስታወሻ ተገልጠዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተደራጊና ቀጣይ ተግባር ‘እየታወጀ ነው’ በሚለው ተጠብቋል፤ የ‘ዓለም ሁሉ’ አገላለጽም የጳውሎስን ሰፊ የንግግር አጽንዖት ሳያጠብ ቀርቧል።
