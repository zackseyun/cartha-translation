- source_word: ὑπερηφάνους
  choice: ትዕቢተኞች
  rationale: “ትዕቢተኞች” ራስን ከሌሎች ከፍ አድርጎ የማየትን ባሕርይ በተለመደና ክብር ባለው አማርኛ ያስተላልፋል።
