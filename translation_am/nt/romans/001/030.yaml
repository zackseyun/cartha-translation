  rationale: ቃሉ ሌሎችን በስተጀርባ በማጥላላት የሚናገሩ ሰዎችን ያመለክታል፤ “ሐሜተኞች” በዘመናዊ አማርኛ ይህን ሥነ ምግባራዊ ኃይል በተፈጥሮ ያስተላልፋል።
