  rationale: የግሪክኛው የባለቤትነት አገባብ በሮሜ መልእክት ውስጥ ሥነ መለኮታዊ ክብደትና እውነተኛ አሻሚነት አለው፤ ዋናው ጽሑፍ ይህን አይፈታውም።
