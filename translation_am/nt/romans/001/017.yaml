- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: “ጽድቅ” የቃሉን ባህላዊና ሥነ መለኮታዊ ስፋት ይጠብቃል፤ “ፍትሕ” የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪክኛውን የባለቤትነት አገባብ በግልጽ መልኩ ይጠብቃል፤ ይህም የእግዚአብሔር የራሱ ጽድቅ ወይም ከእርሱ የሚመጣ ጽድቅ መሆኑን አስቀድሞ አይወስንም።
- source_word: ἐν αὐτῷ
  choice: በዚህ ወንጌል
  rationale: የግሪክኛው ገለጻ በቀደመው ቁጥር ወደተጠቀሰው ወንጌል ይመለሳል። በአማርኛ “በእርሱ” ሰውን ሊያመለክት ስለሚመስል፣ ተመላሹ ስም በግልጽ ተጠቅሷል።
- source_word: ἀποκαλύπτεται
  choice: ይገለጣል
  rationale: የአሁን ጊዜ ተደራጊ ግስን በተፈጥሯዊና ቀጥተኛ አማርኛ ያቀርባል።
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: ከእምነት ወደ እምነት
  rationale: ሁለቱን መስተዋድዶችና የπίστιςን ድግግሞሽ በመጠበቅ የአከራካሪውን ሐረግ ትርጉም አስቀድሞ አይወስንም።
- source_word: δίκαιος
  choice: ጻድቁ
  rationale: በግሪክኛው ያለውን በስም ፈንታ የቆመ ነጠላ ቅጽ በአጭርና በተለመደ አማርኛ ይወክላል።
- source_word: ἐκ πίστεως
  choice: በእምነት
  rationale: በዕንባቆም ጥቅስ ውስጥ የመኖርን መንገድ በተፈጥሯዊ አማርኛ ያሳያል፤ የሐረጉ ሌላ ሰዋሰዋዊ ትስስር በማስታወሻ ተጠብቋል።
- source_word: ζήσεται
  choice: ይኖራል
  rationale: የወደፊት ጊዜውን ኃይል በክብር ባለውና ለጥቅስ ተስማሚ በሆነ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የδικαιοσύνη θεοῦ ትርጉም
  choice: የእግዚአብሔር ጽድቅ
