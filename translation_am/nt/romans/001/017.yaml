- issue: በዕንባቆም ጥቅስ ውስጥ የἐκ πίστεως ትስስር
  choice: ጻድቁ በእምነት ይኖራል
  alternative: በእምነት ጻድቅ የሆነው ይኖራል
  rationale: የግሪክኛው ሐረግ “ጻድቅ” ከሚለው ወይም “ይኖራል” ከሚለው ጋር ሊያያዝ ይችላል። ዋናው ጽሑፍ ተፈጥሯዊውንና የተለመደውን አቀራረብ ሲጠቀም፣ ሌላውን ትስስር በማስታወሻ ይጠብቃል።
- issue: በጥቅሱ መጀመሪያ ያለው δὲ
