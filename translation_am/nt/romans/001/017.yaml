  alternative: ነገር ግን
  rationale: እዚህ δὲ ጥቅሱን ከማብራሪያው ጋር ያያይዛል፤ “ነገር ግን” በአማርኛ ያልተፈለገ ጠንካራ ተቃርኖ ሊፈጥር ይችላል። መደበኛው አማራጭ በማስታወሻ ተጠብቋል።
