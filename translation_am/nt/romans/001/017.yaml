base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: am
  text: 'ሮሜ 1፥17


    ምክንያቱም በዚህ ወንጌል የእግዚአብሔር ጽድቅ[a] ከእምነት ወደ እምነት[b] ይገለጣል፤ እንዲህ ተብሎ ተጽፏልና፦ “ጻድቁ በእምነት ይኖራል”[c][d]።


    [a] ወይም፣ “የእግዚአብሔር ፍትሕ።”


    [b] “ከእምነት ወደ እምነት” የሚለው የግሪክኛ ሐረግ ትርጉሙ አከራካሪ ነው። ይህ ትርጉም ሁለቱንም መስተዋድዶችና “እምነት” የሚለውን ድግግሞሽ ይጠብቃል። ሌሎች ትርጉሞች፦ “ከእምነት ለእምነት፣” “ከመጀመሪያ እስከ መጨረሻ በእምነት፣” ወይም “በእምነት፣ ለእምነት” ሊሆኑ ይችላሉ።


    [c] ወይም፣ “በእምነት ጻድቅ የሆነው ይኖራል።”


    [d] በግሪክኛው ጥቅስ ውስጥ አንድ አያያዥ ቃል ስላለ፣ “ነገር ግን ጻድቁ በእምነት ይኖራል” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር ፍትሕ።”
    reason: lexical_alternative
  - marker: b
    text: “ከእምነት ወደ እምነት” የሚለው የግሪክኛ ሐረግ ትርጉሙ አከራካሪ ነው። ይህ ትርጉም ሁለቱንም መስተዋድዶችና “እምነት” የሚለውን ድግግሞሽ ይጠብቃል። ሌሎች ትርጉሞች፦ “ከእምነት ለእምነት፣” “ከመጀመሪያ እስከ መጨረሻ በእምነት፣” ወይም “በእምነት፣ ለእምነት” ሊሆኑ ይችላሉ።
    reason: alternative_reading
  - marker: c
