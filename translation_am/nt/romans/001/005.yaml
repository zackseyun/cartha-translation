source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: am
  text: በእርሱ በኩል ስለ ስሙ፣ በሕዝቦች ሁሉ መካከል[b] የእምነት መታዘዝ[a] እንዲኖር ጸጋንና ሐዋርያነትን ተቀበልን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእምነት የሚመጣ መታዘዝ»፤ ወይም «እምነት የሆነ መታዘዝ»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «በአሕዛብ ሁሉ መካከል»።
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: በእርሱ በኩል
  rationale: διά ከዘር አመልካች ጋር የመካከለኛ አድራጊነትን ያመለክታል፤ ይህ አተረጓጎምም ከቀደመው የኢየሱስ ክርስቶስ ማጣቀሻ ጋር ያለውን ዝምድና ይጠብቃል።
- source_word: ἐλάβομεν
  choice: ተቀበልን
  rationale: የግሪኩን የመጀመሪያ መደብ ብዙ ቁጥር ሳይፈታ እንዳለ ይጠብቃል።
- source_word: χάριν
  choice: ጸጋን
  rationale: በጳውሎስ አጠቃቀም የተለመደውን የχάρις ትርጉም ይይዛል።
- source_word: καὶ ἀποστολήν
  choice: እና ሐዋርያነትን
  rationale: በግሪኩ የተስተካከሉትን ሁለት ስሞች ሳያዋሕድ ያቀርባል፤ ሐዋርያነትም የተሰጠውን ተልእኮና ሥልጣን ያመለክታል።
- source_word: εἰς
  choice: እንዲኖር
  rationale: በዚህ አውድ εἰς ዓላማን ወይም የታሰበውን ውጤት ያመለክታል፤ የአማርኛው የዓላማ አገላለጽ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ὑπακοὴν πίστεως
  choice: የእምነት መታዘዝ
  rationale: የዘር አመልካች አወቃቀሩን በቅርብ ይጠብቃል፤ መታዘዙ ከእምነት የሚመጣ መሆኑን ወይም እምነት ራሱ መታዘዝ መሆኑን በዋናው ጽሑፍ አይወስንም።
- source_word: πίστεως
  choice: እምነት
  rationale: የπίστιςን መደበኛ የጳውሎስ አጠቃቀም ይጠብቃል።
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: በሕዝቦች ሁሉ መካከል
  rationale: ἔθνη ሕዝቦችን ወይም አሕዛብን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ሰፊውን የብሔራት ወሰን ሲያቀርብ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: ስለ ስሙ
  rationale: ὑπέρ በዚህ ስፍራ ለስሙ ሲባል ወይም ለስሙ ክብር የሚደረግን ነገር ያመለክታል፤ «ስለ ስሙ» ይህን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የὑπακοὴν πίστεως ትርጉም
  choice: የእምነት መታዘዝ
  alternative: ከእምነት የሚመጣ መታዘዝ፤ ወይም እምነት የሆነ መታዘዝ
  rationale: ሐረጉ በሰዋስው የታመቀና በሥነ መለኮት የሚያከራክር ነው። ትርጉሙ በዋናው ጽሑፍ አንዱን ብቻ አይመርጥም፤ እውነተኛውን አሻሚነት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ጸጋ» እና «ሐዋርያነት» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ስለሆኑ ተጠብቀዋል፤ የቃላት አደራደሩ ግን ለተፈጥሯዊ አማርኛ ተስተካክሏል።
