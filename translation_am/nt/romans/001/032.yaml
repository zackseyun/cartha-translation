  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: am
  text: እነርሱም፣ እንዲህ ያሉትን ነገሮች የሚያደርጉ ሰዎች ሞት እንደሚገባቸው የሚለውን የእግዚአብሔርን ፍትሐዊ ፍርድ[a] ቢያውቁም፣ እነዚህን ነገሮች ራሳቸው ማድረጋቸው ብቻ ሳይሆን፣ የሚያደርጉትንም ያጸድቃሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ፍትሐዊ ድንጋጌ»፣ «ፍትሐዊ መስፈርት» ወይም «ፍትሐዊ የፍርድ ውሳኔ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: እነርሱም
  rationale: ከቀደመው አውድ የተጠቀሱትን ሰዎች የሚቀጥል አንጻራዊ መግለጫ ነው፤ «እነርሱም» በአማርኛ የአረፍተ ነገሩን ቀጣይነት በተፈጥሮ ያሳያል።
- source_word: δικαίωμα
  choice: ፍትሐዊ ፍርድ
  rationale: ቃሉ በዚህ አውድ የእግዚአብሔርን ትክክለኛ የሕግና የሥነ ምግባር ውሳኔ ያመለክታል፤ ተከታዩ ሐረግም ሞት እንደሚገባቸው በመግለጽ ይህን የፍርድ ገጽታ ያጠናክራል።
- source_word: ἐπιγνόντες
  choice: ቢያውቁም
  rationale: አድራጊ ቦዝ አንቀጹ በአውዱ የተቃርኖ ሐሳብ ይዟል፤ የእግዚአብሔርን ፍርድ እያወቁ እንኳ በዚያው ድርጊት እንደሚቀጥሉ ያሳያል።
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: እንዲህ ያሉትን ነገሮች የሚያደርጉ ሰዎች
  rationale: የአሁን ጊዜው አድራጊ ቦዝ አንቀጽ የቀጣይ ወይም የተለመደ ምግባርን ያሳያል፤ የአማርኛው አገላለጽ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἄξιοι θανάτου
  choice: ሞት እንደሚገባቸው
  rationale: የግሪኩን የፍርድ ክብደት በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ የሞቱን ዓይነት ግን ከጽሑፉ በላይ አይወስንም።
- source_word: ποιοῦσιν
  choice: ራሳቸው ያደርጋሉ
  rationale: «ራሳቸው» የሚለው በ«ብቻ ሳይሆን» አወቃቀር ውስጥ ያለውን ንጽጽር ያጎላል፤ «ያደርጋሉ» ደግሞ ποιέωን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: συνευδοκοῦσιν
  choice: ይደግፋሉ
  rationale: ግሱ በሌሎች ድርጊት መስማማትን፣ ማጽደቅን ወይም ድጋፍ መስጠትን ያመለክታል፤ «ይደግፋሉ» ከተራ መስማማት የበለጠውን ይህን አዎንታዊ ስምምነት ያሳያል።
- source_word: τοῖς πράσσουσιν
  choice: ይህን የሚያደርጉትን
  rationale: የቀጣይ ድርጊት ስሜትን ጠብቆ ከቀደመው አገላለጽ ጋር ትይዩነቱን ይይዛል።
theological_decisions:
- issue: «ሞት እንደሚገባቸው» የሚለው ሐረግ ወሰን
  choice: የመለኮታዊ ፍርድ ውሳኔ እንደሆነ ተተርጉሟል፤ የሞቱ ዓይነት ግን አልተወሰነም።
  alternative: በዋናነት የሲቪል ሞት ቅጣት እንደሆነ መግለጽ፣ ወይም የመጨረሻውን ፍርድና ዘላለማዊ ሞትን በግልጽ ማካተት።
  rationale: ጳውሎስ እንዲህ የሚያደርጉ ሰዎች ሞት እንደሚገባቸው ይናገራል፤ ይህ ቁጥር ብቻውን የሞቱን ሙሉ ወሰን አይገልጽም። ስለዚህ ትርጉሙ የፍርዱን ክብደት ይጠብቃል እንጂ አንዱን ትርጓሜ አይጫንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አወቃቀር ተነባቢ እንዲሆን በሥርዓተ ነጥብ ተከፍሏል፤ «ፍትሐዊ ፍርድ» የሕግና የሥነ ምግባር ገጽታውን ሳያጠፋ ለዘመናዊ አንባቢ ግልጽ ነው።
