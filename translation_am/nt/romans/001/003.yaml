- source_word: σπέρματος Δαυὶδ
  choice: ከዳዊት ዘር
  rationale: σπέρμα የሚለውን ምሳሌያዊ ቃልና የዳዊትን የዘር ሐረግ ሁለቱንም ይጠብቃል።
- source_word: κατὰ σάρκα
