  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በሥጋ» የሚለው ባህላዊና ሥነ መለኮታዊ ክብደት ያለው አገላለጽ በማብራሪያ ማስታወሻ ተጠብቋል።
