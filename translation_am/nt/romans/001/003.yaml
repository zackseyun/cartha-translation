  rationale: ጽሑፉ ልጅነቱንና እውነተኛውን የዳዊት ዘር ሐረግ አንድ ላይ ያቀርባል እንጂ ምሥጢሩን በኋለኛ የትምህርት ቃላት አይፈታውም።
