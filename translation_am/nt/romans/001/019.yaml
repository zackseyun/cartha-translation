lexical_decisions:
- source_word: διότι
  choice: ነውና
  rationale: ከቀደመው ንግግር ጋር ያለውን የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: ስለ እግዚአብሔር ሊታወቅ የሚችለው
  rationale: ገላጩ ቅጽ በስም ምትክ የቆመ ሲሆን፣ እዚህ ለሰው እውቀት ሊደረስበት የሚችለውን ነገር ያመለክታል፤ የθεοῦ ዝምድናም ‘ስለ እግዚአብሔር’ ተብሎ በተፈጥሯዊ አማርኛ ተሰጥቷል።
- source_word: φανερόν
  choice: ግልጽ
  rationale: በግልጥ የሚታይንና የሚታወቅን ሁኔታ በዘመናዊና ቀላል ቃል ያስተላልፋል።
- source_word: ἐν αὐτοῖς
  choice: በመካከላቸው
  rationale: ሐረጉ ሕዝባዊ/የጋራ አውድን ወይም ውስጣዊ ሁኔታን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ በአደባባይ የተገለጠውን ሐሳብ ይይዛል፣ ሌላው ዕድል ግን በማስታወሻ ተጠብቋል።
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: እግዚአብሔር ራሱ ግልጽ አድርጎላቸዋል
  rationale: ከφανερόν ጋር ያለውን የቃል ትስስር ‘ግልጽ’ በማለት ይጠብቃል፤ የግሪኩ ቀዳሚ የስም አቀማመጥም ‘ራሱ’ በማለት ትኩረቱን ያሳያል።
theological_decisions:
- issue: የἐν αὐτοῖς ትርጉም
  choice: በመካከላቸው
  alternative: በውስጣቸው
  rationale: የግሪኩ ሐረግ እውነተኛ አሻሚነት አለው። አውዱ በፍጥረት የሚገኘውን ግልጽ መገለጥ ስለሚያጎላ፣ ዋናው ጽሑፍ የጋራ/ሕዝባዊውን አንባብ ይዟል፤ ውስጣዊው አንባብ ግን ሳይወገድ በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምክንያት ትስስሩና በφανερόν/ἐφανέρωσεν መካከል ያለው የቃል ድግግሞሽ ተጠብቀዋል።
