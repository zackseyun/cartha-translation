  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: am
  text: ስለ እግዚአብሔር ሊታወቅ የሚችለው በመካከላቸው ግልጽ ነውና፤[a] እግዚአብሔር ግልጽ አድርጎላቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በውስጣቸው።”
