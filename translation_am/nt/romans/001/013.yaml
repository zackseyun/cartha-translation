base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: am
  text: ወንድሞች[a] ሆይ፣ ብዙ ጊዜ ወደ እናንተ ለመምጣት ማቀዴን፣ ነገር ግን እስከ አሁን ድረስ ተከልክዬ መቆየቴን ሳታውቁ እንድትቀሩ አልፈልግም፤ ይህም በቀሩት አሕዛብ[c] መካከል እንዳለ ሁሉ፣ በእናንተም መካከል የተወሰነ ፍሬ[b] እንዳገኝ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞችና እህቶች” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ፍሬ” የሚያመለክተው ጳውሎስ በእነርሱ መካከል በሚያደርገው አገልግሎት የሚገኘውን ውጤት ነው።
    reason: cultural_note
  - marker: c
    text: ወይም “በቀሩት ሕዝቦች”።
    reason: lexical_alternative
