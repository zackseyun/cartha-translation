id: ROM.1.24
reference: Romans 1:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: am
  text: ስለዚህ እግዚአብሔር በልባቸው ምኞቶች ውስጥ ወደ ርኩሰት አሳልፎ ሰጣቸው፤ ይኸውም ሰውነቶቻቸው በመካከላቸው እንዲዋረዱ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመካከላቸው” የሚለው “እርስ በርሳቸው” ወይም “በራሳቸው ውስጥ” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: παρέδωκεν
  choice: አሳልፎ ሰጣቸው
  rationale: ግሱ ሰዎችን ለአንድ ኃይል ወይም ሁኔታ አሳልፎ የመስጠትን ከባድ ትርጉም ይጠብቃል፤ ‘ተዋቸው’ ከሚለው ይልቅ ምንጩን በቅርብ ይከተላል።
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: በልባቸው ምኞት
  rationale: ἐν የሚያመለክተውን የሁኔታ ወይም የአሠራር መስክ በ‘በ’ ያቆያል፤ ‘ልብ’ም የምንጩን ሰውነታዊና ውስጣዊ አመለካከት ይጠብቃል።
- source_word: ἐπιθυμίαις
  choice: ምኞት
  rationale: ቃሉን ወዲያውኑ በጾታዊ ምኞት ብቻ ሳይገድብ፣ የግሪኩን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἀκαθαρσίαν
  choice: ርኩሰት
  rationale: የሥነ ምግባር ንጽሕና ማጣትን በዘመናዊ፣ የተከበረ እና መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: τοῦ ἀτιμάζεσθαι
  choice: ለማዋረድ
  rationale: የዓላማ ወይም የውጤት ግንኙነት ሊያመለክት የሚችለውን የarticular infinitive አወቃቀር በ‘ለ-’ ቅርጽ ያቆያል፤ የግሪኩ መካከለኛ/ተደራጊ ቅርጽ በዐውዱ ውስጥ በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: τὰ σώματα αὐτῶν
  choice: ሰውነታቸውን
  rationale: የጳውሎስን በአካል ላይ ያተኮረ አገላለጽ በቀጥታና በተለመደ አማርኛ ያቆያል።
- source_word: ἐν αὐτοῖς
  choice: እርስ በርሳቸው
  rationale: በዐውዱ ያለውን የጋራ/ተዋዋይ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል፤ የሐረጉ አማራጭ ትርጉሞች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: παρέδωκενን እንደ ‘ፈጽሞ ተዋቸው’ ወይም ግልጽ የፍርድ ትርጓሜ አጠናክሮ መተርጎም
  choice: አሳልፎ ሰጣቸው
  alternative: ተዋቸው / በፍርድ አሳልፎ ሰጣቸው
  rationale: ጽሑፉ መለኮታዊውን አሳልፎ መስጠት በግልጽ ይናገራል፣ ነገር ግን ‘ፈጽሞ መተው’ ወይም የተሟላ ሥርዓተ እምነታዊ ፍርድ የሚል ተጨማሪ ትርጓሜ አይጨመርም።
- issue: τοῦ ἀτιμάζεσθαι ዓላማን ወይስ ውጤትን ብቻ እንደሚገልጥ መወሰን
  choice: ይህም ... ለማዋረድ ነበር
  alternative: ስለዚህ ሰውነታቸው ተዋረደ
  rationale: የምንጩን infinitive አወቃቀር በቅርብ ይጠብቃል፤ ውጤት ብቻ እንደሆነ በግድ አይወስንም፣ የዓላማ/ውጤት ውጥረቱንም አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አመክንዮአዊ ግንኙነት፣ የአሳልፎ መስጠት ክብደት፣ እና የἐν αὐτοῖς አሻሚነት ተጠብቀዋል።
