base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: am
  text: በሮም ላሉ፣ በእግዚአብሔር ለተወደዱና ቅዱሳን ተብለው ለተጠሩ[a] ሁሉ፤ ከአባታችን ከእግዚአብሔርና ከጌታ ከኢየሱስ መሲሕ[b] ጸጋና ሰላም ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቅዱሳን ተብለው የተጠሩ።” በተለምዶ፣ “ቅዱሳን እንዲሆኑ የተጠሩ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ክርስቶስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: በሮም ለሚኖሩ ... ሁሉ
  rationale: የመገኛ ቦታውንና ሁሉን አቀፍ አድራሻውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀγαπητοῖς θεοῦ
  choice: በእግዚአብሔር ለተወደዱ
  rationale: የግሪኩን ቅጽል ኃይልና እግዚአብሔር የፍቅሩ አድራጊ መሆኑን ይጠብቃል።
- source_word: κλητοῖς ἁγίοις
  choice: ቅዱሳን እንዲሆኑ ለተጠሩ
  rationale: በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን፣ መጠራትንና ቅድስናን በአንድነት ያቀርባል፤ የቅርጽ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎሳዊ ሰላምታ ውስጥ የተለመደና ሥነ መለኮታዊ ጥልቀቱን የሚጠብቅ ቃል ነው።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የሰላምታውንም ሆነ የሥነ መለኮት ትርጉሙን በቀጥታ ያስተላልፋል።
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: ከአባታችን ከእግዚአብሔር
  rationale: የምንጭነት ἀπόን በ«ከ» ይገልጻል፤ በአማርኛም የአባትነትና የመለኮት ስያሜውን በክብር ያቀርባል።
- source_word: κυρίου
  choice: ጌታ
  rationale: የκύριοςን ክርስቶሳዊ ክብደት የሚጠብቅ መደበኛ አማርኛ ነው።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός ቅቡዕ ወይም መሲሕ የሚለውን የማዕረግ ትርጉም ስለሚይዝ፣ ትርጉሙን በግልጽ ያስተላልፋል።
theological_decisions:
- issue: κλητοῖς ἁγίοις እንዴት እንደሚተረጎም
  choice: ቅዱሳን እንዲሆኑ ለተጠሩ
  alternative: የተጠሩ ቅዱሳን
  rationale: ግሪኩ ሁለት ቅጽሎችን ቢጠቀምም፣ «የተጠሩ ቅዱሳን» በአማርኛ ጥሪያቸውን ሳይሆን በስም የተጠሩ የሚል አሻሚነት ሊፈጥር ይችላል። ዋናው ትርጉም ተፈጥሯዊ ግልጽነትን ይመርጣል፤ የግሪኩ አጭር ቅርጽ በማስታወሻ ይቀርባል።
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ተለምዶአዊ ስም መቅረቡ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ሰላምታ ውስጥ ቃሉ ማዕረጋዊ መነሻውን እንዲያሳይ «መሲሕ» ተመርጧል፤ በአማርኛ የተለመደው «ክርስቶስ» በማስታወሻ ቀርቧል።
