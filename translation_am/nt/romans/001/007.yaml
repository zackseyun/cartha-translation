  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጳውሎስ ሰላምታ ቅርጽ ተጠብቆ፣ በአማርኛ የተፈጥሮ አገባብ መሠረት የምንጭ «ከ» ለሁለቱም ስያሜዎች ተደግሟል።
