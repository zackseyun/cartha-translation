id: ROM.1.25
reference: Romans 1:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: am
  text: እነርሱም የእግዚአብሔርን እውነት በሐሰት ለወጡ፤ ከፈጣሪ ይልቅ ፍጥረትን አከበሩ፣ አገለገሉም። ፈጣሪ ለዘላለም የተባረከ ነው። አሜን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν ... ἐν τῷ ψεύδει
  choice: በሐሰት ለወጡ
  rationale: የመለወጥና አንዱን በሌላው የመተካት ሐሳብን በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩን የተወሰነ አመልካች በአማርኛ በግድ “ሐሰቱ” ብሎ መተርጎም አያስፈልግም።
- source_word: ἐσεβάσθησαν
  choice: አከበሩ
  rationale: ቃሉ የአክብሮትንና የሃይማኖታዊ ማምለክን ስፋት ሊይዝ ስለሚችል፣ ከἐλάτρευσαν ጋር ያለውን ልዩነት ለማቆየት “አመለኩ” ከማለት ይልቅ “አከበሩ” ተመርጧል።
- source_word: ἐλάτρευσαν
  choice: አገለገሉ
  rationale: የሃይማኖታዊ አገልግሎትን ሐሳብ ያስተላልፋል፣ ከ“አከበሩ”ም ይለያል።
- source_word: τῇ κτίσει ... τὸν κτίσαντα
  choice: ፍጥረትን ... ፈጣሪ
  rationale: በተፈጠረውና በፈጠረው መካከል ያለውን የግሪክ ቃላዊ ንፅፅር ግልጽ አድርጎ ያቆያል።
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: ለዘላለም የተባረከ
  rationale: የውዳሴ አገላለጹንና ዘላለማዊ ጊዜውን በተለመደ ክቡር አማርኛ ያቀርባል።
theological_decisions:
- issue: παρά በፈጣሪና በፍጥረት መካከል ያለው ንፅፅር
  choice: ከፈጣሪ ይልቅ
  alternative: ፈጣሪን ትተው / ከፈጣሪ ጎን ለጎን
  rationale: እዚህ παρά የተሳሳተ ምርጫንና ቅድሚያን የሚገልጽ ሲሆን፣ “ከ... ይልቅ” ይህን ያለ ተጨማሪ የእምነት ትርጓሜ ያስተላልፋል።
- issue: ὅς ἐστιν εὐλογητός የሚያመለክተው
  choice: ፈጣሪ ለዘላለም የተባረከ ነው
  alternative: እርሱም ለዘላለም የተባረከ ነው
  rationale: የግሪኩ አንጻራዊ ተውላጠ ስም ቅርብ ያለውን “ፈጣሪ” ያመለክታል፤ ስሙን መድገም በአማርኛ ግልጽነትን ይጨምራል እንጂ አዲስ ትርጓሜ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ሁለት ግሶች—አክብሮት/ማምለክ እና አገልግሎት—በተለያዩ የአማርኛ ግሶች ተጠብቀዋል።
