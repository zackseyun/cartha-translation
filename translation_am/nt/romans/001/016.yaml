language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: am
  text: ምክንያቱም በምሥራቹ[a] አላፍርም፤ እርሱ ለሚያምን ሁሉ ለመዳን የእግዚአብሔር ኃይል ነውና፤ በመጀመሪያ ለአይሁዳዊው፣ እንዲሁም ለግሪኩ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንጌሉ።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ግሪክ” የሚለው ቃል በሰፊው አይሁዳዊ ያልሆነን፣ ማለትም ከአሕዛብ የሆነን ሰው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: አላፍርም
  rationale: የግሱን የማፈርና በውርደት ወደ ኋላ የማለት ሐሳብ በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: εὐαγγέλιον
  choice: ምሥራች
  rationale: የቃሉን ‘መልካም ዜና’ የሚል መሠረታዊ ፍቺ በተለመደና ክብር ባለው አማርኛ ይገልጣል።
- source_word: δύναμις
  choice: ኃይል
  rationale: የእግዚአብሔርን ውጤታማ የማዳን አቅምና ተግባር በትክክል ይገልጣል።
- source_word: εἰς σωτηρίαν
  choice: የሚያድን
  rationale: የεἰςን ዓላማና ውጤት በተፈጥሯዊ አማርኛ ያሳያል፤ ቃል በቃል ‘ለመዳን’ ማለትም ይቻላል።
- source_word: παντὶ τῷ πιστεύοντι
  choice: ለሚያምን ሁሉ
  rationale: የπαντίን አካታች ስፋትና የπιστεύοντιን ተሳቢ ግስ በግልጽ ሁኔታ ይጠብቃል።
- source_word: Ἰουδαίῳ
  choice: አይሁዳዊ
  rationale: ከἝλληνι ጋር ባለው የዘርና የሃይማኖት ንጽጽር ውስጥ ተገቢውን ፍቺ ይሰጣል።
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: በግሪኩ ያለውን ቅደም ተከተል ሳያብራራ ወይም ሳይፈታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Ἕλληνι
  choice: ግሪክ
  rationale: የምንጩን ቀጥተኛ የብሔር መጠሪያ ይጠብቃል፤ ሰፋ ያለው አሕዛብን የማመልከት አጠቃቀም በማስታወሻ ተገልጧል።
- source_word: τε ... καί
  choice: እንዲሁም
  rationale: ከቅድሚያው በኋላ የሚመጣውን ጭማሪ በለስላሳና ግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: “አስቀድሞ ለአይሁዳዊው” የሚለው የπρῶτον ቅደም ተከተል
  choice: የቅድሚያውን አገላለጽ ሳይብራራ በዋናው ጽሑፍ ማቆየት
  alternative: ቅድሚያውን ታሪካዊ፣ ጊዜያዊ ወይም ደረጃዊ ብሎ በትርጉሙ ውስጥ መወሰን
  rationale: ግሪኩ ‘መጀመሪያ/አስቀድሞ’ ይላል እንጂ የቅድሚያውን ዓይነት በዚህ ሐረግ አይፈታም፤ ስለዚህ ያለው ሥነ መለኮታዊ ውጥረት ተጠብቋል።
- issue: Ἕλληνι በ‘አይሁዳዊውና ግሪኩ’ ንጽጽር
  choice: በዋናው ጽሑፍ ‘ግሪክ’ ማለትና ሰፊውን የአሕዛብ ፍቺ በማስታወሻ መግለጽ
  alternative: በዋናው ጽሑፍ ‘አሕዛብ’ ማለት
  rationale: ይህ የግሪክ ምንጩን ቃል በግልጽነት ሲጠብቅ፣ በጳውሎስ አጠቃቀም ለአይሁድ ያልሆኑትን በሰፊው ሊወክል እንደሚችልም ያሳውቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩን ምክንያታዊ አወቃቀር ለማንጸባረቅ “ምክንያቱም” እና “ነውና” ተጠቅመዋል፤ ሐረጉ በአማርኛ ተፈጥሯዊ እንዲሆን የመዳን ሐሳብ “የሚያድን” ተብሎ ተገልጧል።
