  source_fidelity: The draft accurately conveys the concessive participle, the failure to honor and thank God, the futility of their reasonings, and the darkening of the singular collective 'heart.' However, διότι, which introduces the explanatory ground, is not represented in the translation text. The source's passive ἐσκοτίσθη is best retained by an explicitly passive Amharic form.
