  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: am
  text: ምክንያቱም እግዚአብሔርን ቢያውቁም፣ እግዚአብሔር እንደሆነ ክብር አልሰጡትም ወይም አላመሰገኑትም፤ ነገር ግን በአስተሳሰባቸው[a] ከንቱ ሆኑ፣ ማስተዋል የጎደለውም ልባቸው[b] ጨለመባቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአመዛዘናቸው፣” “በሐሳቦቻቸው” ወይም “በግምቶቻቸው።”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ “ልብ” ነጠላ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ምክንያቱም (በአማርኛው የዓረፍተ ነገሩ ምክንያታዊ ግንኙነት በአወቃቀሩ ተጠብቋል)
  rationale: ቃሉ ከቀደመው ሐሳብ ጋር የሚያገናኝ ምክንያትን ያስገባል። በተተረጎመው ጥቅስ የምክንያቱ ኃይል በአውዱና በቢያውቁም አወቃቀር ተሸክሟል።
- source_word: γνόντες τὸν θεὸν
  choice: እግዚአብሔርን ቢያውቁም
  rationale: የአውዱን አሳላፊ ተቃርኖ በተፈጥሯዊ አማርኛ ይገልጣል፤ እውቀቱ ቢኖርም ተገቢው ምላሽ አልተሰጠም።
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: እንደ እግዚአብሔር አላከበሩትም
  rationale: ὡς θεόν የሚጠቁመውን ለእግዚአብሔርነቱ የሚገባውን ክብር አለመስጠት ያቆያል። አከበሩትም በዘመናዊ አማርኛ ግልጽ ሲሆን የδοξάζωን ክብር የመስጠት ሐሳብ ይይዛል።
- source_word: ἢ ηὐχαρίστησαν
  choice: ወይም አላመሰገኑትም
  rationale: ምስጋናን ወደ እግዚአብሔር የማቅረብ ተግባርን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐματαιώθησαν
  choice: ከንቱ ሆኑ
  rationale: የግሱን ወደ ከንቱነትና ፍሬ ቢስነት መድረስ ይገልጣል፤ በጽሑፉ ያልተገለጸ ውጫዊ አድራጊ አያስገባም።
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: በአስተሳሰባቸው
  rationale: διαλογισμοί ሊያመለክት የሚችለውን ሐሳብ፣ አመዛዛኝነት ወይም የውስጥ ምክክር በሰፊና ተፈጥሯዊ ቃል ያቀርባል።
- source_word: ἐσκοτίσθη
  choice: ጨለመ
  rationale: የጨለማውን ምሳሌያዊ የሥነ ምግባርና የማስተዋል ሐሳብ በአማርኛ ይጠብቃል።
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: ማስተዋል የጎደለው ልባቸው
  rationale: ἀσύνετοςን እንደ ተራ የአእምሮ ዝቅተኝነት ሳይሆን የማስተዋል እጦት አድርጎ ይገልጣል፤ καρδία ነጠላ መሆኑንም ልባቸው በሚለው የጋራ ውስጣዊ ማንነት አነጋገር ይጠብቃል።
theological_decisions:
- issue: የγνόντες አሳላፊ ተቃርኖ
  choice: እግዚአብሔርን ቢያውቁም
  alternative: እግዚአብሔርን አውቀው / ባወቁ ጊዜ
  rationale: አውዱ እውቀት ቢኖራቸውም እግዚአብሔርን በተገቢው ሁኔታ እንዳላከበሩና እንዳላመሰገኑ ያጎላል። ይህ ሰዋሰዋዊና አውዳዊ ውሳኔ ነው፤ ከጽሑፉ ውጭ የሆነ የእምነት ሥርዓት አይጨምርም።
- issue: የἐματαιώθησαν ተገብሮ ቅርጽና አድራጊው
  choice: ከንቱ ሆኑ
  alternative: ከንቱ ተደረጉ
  rationale: የግሪኩ ተገብሮ ቅርጽ አድራጊውን አይጠቅስም። ከንቱ ሆኑ ውጤቱን ይገልጣል እንጂ አድራጊውን በመሙላት ሥነ መለኮታዊ ውጥረቱን አይፈታም።
