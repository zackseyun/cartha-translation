lexical_decisions:
- source_word: ἐπιποθῶ
  choice: እናፍቃለሁ
  rationale: ጠንካራና ግላዊ የሆነውን የጳውሎስን ናፍቆት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: γὰρ
  choice: -ና
  rationale: ንግግሩ ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ἰδεῖν
  choice: ለማየት
  rationale: ግሱን በቀጥታ ይተረጉማል፤ ጉብኝት እንደሚያመለክት በግልጽ ሳይጨምር የምንጩን ቃል ይጠብቃል።
- source_word: ἵνα
  choice: ይኸውም … ነው
  rationale: የጳውሎስን የማየት ፍላጎት ዓላማ በግልጽና ተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: τι
  choice: አንዳች
  rationale: በግሪክኛው ያለውን አለመወሰን ይጠብቃል።
- source_word: μεταδῶ
  choice: ላካፍላችሁ
  rationale: አንድን ነገር ለሌላ ሰው ማካፈልን ወይም ማስተላለፍን የሚገልጸውን የግሱን ሐሳብ ያስተላልፋል።
- source_word: χάρισμα
  choice: ስጦታ
  rationale: ቃሉን በአጭርና በተለመደ መንገድ ይተረጉማል፤ በዚህ ስፍራ ያልተገለጸን ልዩ የስጦታ ዓይነት አይጨምርም።
- source_word: πνευματικὸν
  choice: መንፈሳዊ
  rationale: ቅጽሉን በተፈጥሯዊ አማርኛ ይተረጉማል፤ ቃሉ የመንፈስ ቅዱስን ስጦታ በቀጥታ ወይም ሰፊ መንፈሳዊ ጥቅምን ማመልከቱን ሳይወስን ክፍት ይተዋል።
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: እናንተ እንድትጸኑ
  rationale: የግሪክኛውን ተደራጊ ቅርጽና የዓላማ/ውጤት ሐሳብ በሚነበብ አማርኛ ይጠብቃል።
theological_decisions:
- issue: “መንፈሳዊ ስጦታ” የተወሰነ ተአምራዊ ጸጋን ወይስ ሰፊ መንፈሳዊ ጥቅምን እንደሚያመለክት
  choice: አንዳች መንፈሳዊ ስጦታ
  alternative: አንዳች የመንፈስ ስጦታ፤ አንዳች በጸጋ የተሰጠ መንፈሳዊ ጥቅም
  rationale: የግሪክኛው ሐረግ በግድ የተወሰነ ቴክኒካዊ ወይም ተአምራዊ ትርጉም አይጠይቅም፤ ስለዚህ ትርጉሙ የምንጩን ስፋትና አሻሚነት ይጠብቃል።
- issue: የጳውሎስ ድርሻ በአንባቢዎቹ መጽናት ውስጥ በአድራጊ ወይም በተደራጊ ቅርጽ መገለጹ
  choice: እናንተ እንድትጸኑ
  alternative: እናንተን ለማጽናት
  rationale: ምንጩ στηριχθῆναι የሚለውን ተደራጊ ቅርጽ ይጠቀማል። ዋናው ጽሑፍ ይህን ይጠብቃል፤ ተፈጥሯዊው አድራጊ አቀራረብ በማስታወሻ ቀርቧል።
