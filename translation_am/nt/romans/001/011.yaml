  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዓላማ ሐረጉ በአማርኛ ተፈጥሯዊ እንዲሆን የቃላት ቅደም ተከተሉ ተስተካክሏል፤ አሻሚው የ“መንፈሳዊ ስጦታ” ትርጉም ግን ሳይጠበብ ተቀምጧል።
