    text: ወይም፣ “እናንተን ለማጽናት።”
    reason: alternative_reading
  revision_rationale: The revision uses እንድትጸኑ ዘንድ to express the intended result/purpose of εἰς τὸ στηριχθῆναι ὑμᾶς and supplies እፈልጋለሁ to make the Greek purpose clause idiomatic in Amharic. It retains አንዳች መንፈሳዊ ስጦታ and ላካፍላችሁ, preserving both the indefinite scope and the broad sense of μεταδῶ. Footnote b is retained as the active alternative, but its anchor is omitted from the revised main text because the passive/result-oriented phrasing is already represented directly by እንድትጸኑ ዘንድ.
