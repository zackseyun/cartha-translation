  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: am
  text: ብቻውን ጥበበኛ ለሆነው አምላክ፣ በኢየሱስ መሲሕ በኩል፣ ለእርሱ ክብር ለዘላለም ይሁን። አሜን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር በሮሜ 16፥25-27 ያለውን የመዝጊያ ውዳሴ ይደመድማል። በሮሜ 16፥25 እንደተገለጸው፣ ይህ ውዳሴ በጥንታዊ የእጅ ጽሑፎች ውስጥ የሚገኝበት ስፍራና መካተቱ በእጅጉ ይለያያል፤ እዚህ ግን በባይዛንታይን አብዛኛው የእጅ ጽሑፍ ወግ መሠረት ተጠብቆ ቀርቧል።
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: ብቻውን
  rationale: ከ«ጥበበኛ ለሆነው አምላክ» ጋር ተያይዞ አምላክ ብቻውን ፍጹም ጥበበኛ መሆኑን ያጎላል።
- source_word: σοφῷ
  choice: ጥበበኛ ለሆነው
  rationale: የግሪኩን ቅጽል በተፈጥሯዊና በክብር የተሞላ የአማርኛ አገላለጽ ያቀርባል።
- source_word: διὰ
  choice: በ…በኩል
  rationale: ከወራሽ ስም ጋር ያለው διὰ መካከለኛነትን ወይም አማካይነትን ስለሚገልጥ «በኩል» ተመርጧል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός የማዕረግ ስም ስለሆነ «መሲሕ» ተብሎ ተተርጉሟል፤ እዚህ በግሪኩ የተወሰነ አመልካች የለም፣ አማርኛውም «ኢየሱስ መሲሕ» በተፈጥሮ ይነበባል።
- source_word: ᾧ
  choice: ለእርሱ
  rationale: የዝምድና ተውላጠ ስሙን ይጠብቃል፤ ቀዳሚው አመልካች አምላክ ወይም ኢየሱስ መሲሕ ሊሆን የሚችልበትን ሰዋሰዋዊ ውጥረት በግልጽ ስም በመተካት አይወስንም።
- source_word: εἰς τοὺς αἰῶνας
  choice: ለዘላለም
  rationale: ቃል በቃል «ወደ ዘመናት» የሚለውን መደበኛ የግሪክ ፈሊጥ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የᾧ ቀዳሚ አመልካች
  choice: «ለእርሱ» በማለት አሻሚነቱን መጠበቅ
  alternative: «ለአምላክ» ወይም «ለኢየሱስ መሲሕ» ብሎ በግልጽ መወሰን
  rationale: የግሪኩ ᾧ በቅርብ ከኢየሱስ መሲሕ ቀጥሎ ቢመጣም፣ የውዳሴው ዋና ተቀባይ «ብቻውን ጥበበኛ የሆነው አምላክ» ነው፤ ትርጉሙ ጽሑፉ ያልፈታውን ውጥረት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የውዳሴው ሐረግ አጭርነትና ሥነ ሥርዓታዊ ድምፅ ተጠብቋል።
