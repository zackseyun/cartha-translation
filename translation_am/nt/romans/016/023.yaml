  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: am
  text: እኔንም ሆነ መላውን ቤተ ክርስቲያን በእንግድነት የሚቀበለው ጋይዮስ ሰላምታ ያቀርብላችኋል። የከተማው ገንዘብ ያዥ ኤራስቶስና ወንድም ቁዋርቶስም ሰላምታ ያቀርቡላችኋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የከተማው አስተዳዳሪ” ተብሎም ሊተረጎም ይችላል። የግሪክኛው ቃል በሰፊው የከተማ አስተዳደር ኃላፊን ሊያመለክት ይችላል፤ እዚህ ግን “ገንዘብ ያዥ” የሚለው ሊገመት የሚችል የከተማ የገንዘብ ሹመትን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: ሰላምታ ያቀርብላችኋል
  rationale: በጳውሎስ መልእክቶች መደምደሚያ ያለውን የሰላምታ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ξένος
  choice: በእንግድነት የሚቀበለው
  rationale: በዚህ ዐውድ ξένος እንግዶችን የሚያስተናግድ አስተናጋጅን ያመለክታል፤ ይህ አገላለጽም ጋይዮስ ጳውሎስንና መላውን ማኅበር የተቀበለ መሆኑን በግልጽ ያሳያል።
- source_word: ὅλης τῆς ἐκκλησίας
  choice: መላውን ቤተ ክርስቲያን
  rationale: ἐκκλησία እዚህ የክርስቲያኖችን ማኅበር ያመለክታል፤ ὅλης የሚያሳየው ሁሉን አቀፍነትም ‘መላውን’ በሚለው ተጠብቋል።
- source_word: οἰκονόμος τῆς πόλεως
  choice: የከተማው ገንዘብ ያዥ
  rationale: οἰκονόμος በሲቪክ ዐውድ የከተማውን ገንዘብ ወይም አስተዳደር የሚቆጣጠር ባለሥልጣንን ሊያመለክት ይችላል፤ ‘ገንዘብ ያዥ’ የሚለው በዚህ ስፍራ የሚገመተውን የገንዘብ ኃላፊነት በአጭር ያሳያል።
- source_word: ἀδελφός
  choice: ወንድም
  rationale: ግሪክኛው ቃል ተባዕታይ ነጠላ ሲሆን ቁዋርጦስን እንደ እምነት ወንድም ይጠቅሳል፤ በምንጩ ያልተገለጸ ‘የእኛ’ የሚል ባለቤትነት አልተጨመረም።
theological_decisions:
- issue: ἐκκλησίαን በዚህ የሰላምታ ዐውድ መተርጎም
  choice: ቤተ ክርስቲያን
  alternative: ማኅበር / ጉባኤ
  rationale: በጳውሎስ አጠቃቀም ἐκκλησία በተለምዶ የክርስቲያኖችን ማኅበር ያመለክታል፤ ‘ቤተ ክርስቲያን’ በአማርኛ የተለመደና በዚህ ዐውድ ተፈጥሯዊ ነው።
- issue: ἀδελφός የሚለው የቤተሰብ ቃል
  choice: ወንድም
  alternative: የእምነት ባልንጀራ / ወንድማችን
  rationale: ምንጩ ተባዕታይ ነጠላ ቃልን ይጠቀማል፤ ‘ወንድም’ ይህን በቀጥታ ይጠብቃል፣ ‘ወንድማችን’ ግን በግሪክኛው የሌለ ባለቤትነትን ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጋይዮስ መስተንግዶ ተግባር በተፈጥሯዊ ሐረግ ተገልጿል፤ የοἰκονόμος ትርጉም ስፋት በማስታወሻ ተጠብቋል።
