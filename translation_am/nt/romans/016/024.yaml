  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: am
  text: የጌታችን የኢየሱስ መሲሕ[a] ጸጋ ከሁላችሁ ጋር ይሁን።[b] አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός በባህላዊው የቃል ዝውውር “ክርስቶስ” ተብሎም ሊቀርብ ይችላል፤ እዚህ “መሲሕ” የተባለው የማዕረጉን ትርጉም ለማሳየት ነው።
    reason: alternative_reading
  - marker: b
    text: አንዳንድ የጥንት ቅጂዎች ይህን ቁጥር ይዘዋል፤ ሌሎች ግን አያካትቱትም። ብዙ ዘመናዊ የግሪክ እትሞች በሮሜ መልእክት መደምደሚያ ያለ የጽሑፍ ልዩነት መሆኑን በቅንፍ ወይም በሌላ ምልክት ያሳያሉ።
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች የእግዚአብሔርን ነፃ ቸርነትና ስጦታ የሚገልጽ የተለመደ እና ትርጉሙን የሚጠብቅ ቃል ነው።
- source_word: κυρίου
  choice: ጌታችን
  rationale: የኢየሱስን ጌትነት በተፈጥሯዊና በተለመደ የአማርኛ አገላለጽ ያሳያል፤ ἡμῶν የሚለውንም በቅጥያው ይይዛል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: ኢየሱስ የግል ስም ሆኖ ተጽፏል፤ Χριστός ደግሞ ‘የተቀባው’ የሚለውን የማዕረግ ትርጉም ግልጽ ለማድረግ ‘መሲሕ’ ተብሏል። የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠቅሷል።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር
  rationale: μετά ከጄኒቲቭ ጋር ‘ከ…ጋር’ ማለት ሲሆን፣ πάντων ὑμῶν መልእክቱ ተቀባዮችን ሁሉ እንደሚያካትት ያሳያል።
- source_word: Ἀμήν
  choice: አሜን
  rationale: በአማርኛ የእምነትና የአምልኮ ንግግር የተለመደው ቅጽ ስለሆነ ተጠብቋል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστόςን እንደ ማዕረግ ወይም እንደ ተለመደ የስም ቅጽ መወከል
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: የግሪኩ ቃል ‘የተቀባው’ የሚለውን ማዕረጋዊ ኃይል እንዳያጣ ‘መሲሕ’ ተመርጧል፤ ሆኖም ‘ክርስቶስ’ በአማርኛ የተስፋፋና ትክክለኛ ባህላዊ ቅጽ ስለሆነ እንደ አማራጭ ተጠቅሷል።
- issue: የቁጥር 24 የጽሑፍ ልዩነት
  choice: ቁጥሩን በዋናው ጽሑፍ ማካተት እና ልዩነቱን በማስታወሻ መግለጽ
  alternative: ቁጥሩን ከዋናው ጽሑፍ ማስቀረት
  rationale: SBLGNT ንባቡን በልዩ ምልክት ያቀርበዋል፤ የቅጂዎቹን ልዩነት ሳይደብቁ ለአንባቢው ግልጽ ለማድረግ ንባቡ ተካትቶ ማስታወሻ ተጨምሯል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። “ይሁን” የሚለው የቡራኬ አገላለጽ የግሪኩን ግስ-አልባ የምኞት አወቃቀር በተፈጥሯዊ አማርኛ ይወክላል።
