    issue: The greeting verb is plural with Timothy and the three named men as one explicit subject.
    rationale: The Greek has singular Ἀσπάζεται with Timothy, followed by καὶ clauses adding Lucius, Jason, and Sosipater. Although the plural does not substantially alter the overall message, separate clauses better preserve the source’s syntax and emphasis.
  - severity: low
    issue: The explanatory wording in the footnote is somewhat abstract and less idiomatic.
    rationale: “የዘርና የሕዝብ ወገንተኝነት” can be replaced with clearer modern wording while preserving the stated lexical alternatives.
