  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: am
  text: አብሮኝ የሚሠራው ጢሞቴዎስ ሰላምታ ያቀርብላችኋል፤ ሉቅዮስ፣ ያሶንና ሶሲጳጥሮስ ወገኖቼ[a]ም ሰላምታ ያቀርቡላችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዘመዶቼ” ወይም “የአይሁድ ወገኖቼ።” የግሪኩ ቃል የሥጋ ዘመዶችን ወይም ሰፋ ያለ የዘመድነት ወይም የአንድ ሕዝብ ግንኙነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: ሰላምታ ያቀርቡላችኋል
  rationale: በደብዳቤ አውድ ውስጥ የሚገኘውን ‘ሰላምታ ማቅረብ’ የሚለውን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ὑμᾶς ብዙ ቁጥር መሆኑም ‘ለእናንተ’ በሚለው የግስ ቅጥ ተጠብቋል።
- source_word: συνεργός μου
  choice: አብሮኝ የሚሠራው
  rationale: ጢሞቴዎስ ከጳውሎስ ጋር በጋራ የሚሠራ መሆኑን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል፤ ከንግድ ወይም ከቢሮ ሥራ ጋር ብቻ የሚያያዝ ድምፀትን ያስወግዳል።
- source_word: Λούκιος, Ἰάσων, Σωσίπατρος
  choice: ሉቅዮስ፣ ያሶን፣ ሶሲጳጥሮስ
  rationale: የግሪክ ስሞቹን ቅርጽ የሚከተሉና በአማርኛ መጽሐፍ ቅዱሳዊ አጠራር የተለመዱ የስም ቅጾች ናቸው።
- source_word: οἱ συγγενεῖς μου
  choice: ወገኖቼ
  rationale: ‘ወገኖቼ’ የቅርብ ዘመድነትንም ሆነ ሰፋ ያለ የዘር/የሕዝብ አንድነትን ሊያመለክት ስለሚችል፣ የግሪኩን ሆን ብሎ ያልተወሰነ ስፋት ከ‘ዘመዶቼ’ ይልቅ በተሻለ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ አጠቃቀም συγγενεῖς μου የሚያመለክተው
  choice: ወገኖቼ
  alternative: ዘመዶቼ፤ ወይም የአይሁድ ወገኖቼ
  rationale: ቃሉ የሥጋ ዘመዶችን ወይም ሰፋ ባለ መልኩ አንድ ሕዝብ የሆኑ ወገኖችን ሊያመለክት ይችላል። ጥቅሱ የትኛው ትርጉም እንደታሰበ በግልጽ ስለማይወስን፣ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፤ አማራጮቹም በማስታወሻ ቀርበዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። በአማርኛ የተዋሐደው የስም ዝርዝር ብዙ ቁጥር ግስን ስለሚጠይቅ፣ የግሪኩ ነጠላ ቁጥር ግስ በተፈጥሯዊ መልኩ ‘ያቀርቡላችኋል’ ተብሎ ቀርቧል።
