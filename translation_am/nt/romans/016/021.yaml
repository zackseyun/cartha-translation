  naturalness: The proposed revision is idiomatic modern standard Amharic. It avoids attaching “my kinsmen” before the names in a way that can momentarily make the apposition less clear, and it uses the customary repeated greeting construction for the added names.
  terminology: “አብሮኝ የሚሠራው” suitably conveys συνεργός μου without over-specifying the work. “ወገኖቼ” appropriately retains the source term’s ambiguity between relatives and a wider ethnic/kinship connection. The names are retained in appropriate established Amharic forms.
  issues:
