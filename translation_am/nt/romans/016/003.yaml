theological_decisions:
- issue: በጳውሎስ አገላለጽ ἐν Χριστῷ Ἰησοῦ ውስጥ Χριστῷን እንዴት መተርጎም እንደሚገባ
  choice: በመሲሑ ኢየሱስ
