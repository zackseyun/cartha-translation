  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: am
  text: መታዘዛችሁ ለሁሉም ደርሷልና፤[a] ስለዚህ በእናንተ ደስ ይለኛል።[b] ነገር ግን በመልካም ነገር ጥበበኞች፣ በክፉ ነገርም ንጹሓን[c] እንድትሆኑ እፈልጋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሁሉም ታውቋል።” ግሪኩ ቃል በቃል “መታዘዛችሁ ወደ ሁሉም ደርሷል” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእናንተ ምክንያት ደስ ይለኛል።”
    reason: lexical_alternative
  - marker: c
    text: “ንጹሓን” የሚለው “ያልተቀላቀሉ” ወይም “ተንኮል የሌለባቸው” የሚል ፍቺም ሊኖረው ይችላል።
    reason: lexical_alternative
