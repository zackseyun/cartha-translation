  rationale: የግሪኩን ‘ደረሰ’ የሚለውን ምስላዊ አገላለጽና የπάνταςን ሰፊ ነገር ግን አጋኖአዊ ኃይል ይጠብቃል።
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: በእናንተ ደስ ይለኛል
  rationale: ἐπί ከዳቲቭ ጋር የደስታውን መሠረት ወይም ምክንያት ሊገልጽ ይችላል፤ አማርኛው ሆን ብሎ ይህን ስፋት ይጠብቃል።
