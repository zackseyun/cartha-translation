  rationale: ἀκέραιος ያልተቀላቀለ፣ ንጹሕ፣ ተንኮል የሌለበት የሚለውን የፍቺ ስፋት አለው፤ ‘ንጹሓን’ ከክፉ ጋር በሚኖር ግንኙነት አለመበከልን በክብር ያስተላልፋል።
