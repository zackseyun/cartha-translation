  rationale: ግሱ ፌቤን በመልካም ሁኔታና በእንግዳ ተቀባይነት ወደ ማኅበሩ መቀበልን ያመለክታል፤ ይህ ምርጫ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἐν κυρίῳ
