- source_word: ἀξίως τῶν ἁγίων
  choice: ቅዱሳንን በሚገባ ሁኔታ
  rationale: ἀξίως የአቀባበሉን ሁኔታ ሲገልጥ፣ ἅγιοι ደግሞ የእግዚአብሔርን ቅዱስ ሕዝብ ያመለክታል።
- source_word: παραστῆτε αὐτῇ
  choice: እርዷት
  rationale: በዚህ ዐውድ ግሱ ከጎኗ መቆምን፣ ማገዝንና የሚያስፈልጋትን ድጋፍ መስጠትን ያመለክታል፤ ‘እርዷት’ ይህን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: ከእናንተ እርዳታ በምትፈልግበት በማንኛውም ጉዳይ
  rationale: πρᾶγμα ሰፊ ትርጉም ያለው ‘ጉዳይ’ ሲሆን፣ χρῄζῃ ὑμῶν ከእነርሱ የምትፈልገውን እርዳታ ያሳያል።
- source_word: προστάτις
  choice: ደጋፊ
  rationale: ቃሉ ለሌሎች የቆመች፣ ድጋፍ የሰጠች እና ምናልባትም ቁሳዊ ወይም ማኅበራዊ ድጋፍ ያደረገች ሴትን ያመለክታል። ‘ደጋፊ’ ከቀላል ‘ረዳት’ የሰፋ ሲሆን የተወሰነ መደበኛ ሹመትንም አያስገባም።
- source_word: ἐμοῦ αὐτοῦ
  choice: ለእኔም ጭምር
  rationale: የአጽንዖት ተውላጠ ስሙንና የκαίን ጨማሪ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
