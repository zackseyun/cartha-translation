  choice: ደጋፊ
  alternative: በጎ አድራጊ፣ ጠባቂ፣ ረዳት
  rationale: የግሪኩ ቃል ተራ እርዳታን ብቻ ሳይሆን ትልቅ ማኅበራዊ ወይም ቁሳዊ ድጋፍን ሊያመለክት ይችላል። ‘ደጋፊ’ የፌቤን ጉልህ ሚና ይጠብቃል፤ ቃሉን ግን ወደ ኋለኛ ዘመን የቤተ ክርስቲያን ሹመት አይለውጠውም። ሙሉውን የድጋፍ ወይም የባለውለታነት ጥላ በአንድ የአማርኛ ቃል ማስተላለፍ ስለሚከብድ አማራጮቹ በማስታወሻ ቀርበዋል።
