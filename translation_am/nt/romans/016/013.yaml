lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላም በሉ
  rationale: የብዙ ሰዎች ትእዛዝ ሲሆን፣ በደብዳቤ መዝጊያ ውስጥ ሰላምታን እንዲያደርሱ የሚጠይቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: Ῥοῦφον
  choice: ሩፎስ
  rationale: የግል ስሙ በአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ልማድ መሠረት በድምፅ ተገልብጧል።
- source_word: ἐκλεκτὸν
  choice: የተመረጠውን
  rationale: ቃሉ ‘የተመረጠ’ ወይም ‘ምርጥ/የላቀ’ ሊል ይችላል። ዋናው ጽሑፍ ‘የተመረጠ’ የሚለውን ሰፊ እና ሥነ መለኮታዊ ውጥረቱን የማይዘጋ ፍቺ ይዟል፤ ሌላው ፍቺ በማስታወሻ ቀርቧል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: በአማርኛ ‘በጌታ’ የሚለው ከጌታ ጋር ያለውን ግንኙነት ወይም በእርሱ ውስጥ ያለውን ሁኔታ በተፈጥሯዊ መንገድ ይገልጣል፤ መራጩ ጌታ እንደሆነ በግልጽ አይወስንም።
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: እናቱንም፣ እናቴም የሆነችውን
  rationale: የግሪኩን ‘የእርሱንም የእኔንም እናት’ የሚል ነጠላ አመልካች ይጠብቃል፤ ሁለት የተለያዩ እናቶችን እንዳያመለክትም በተፈጥሯዊ አማርኛ ተቀርጿል።
theological_decisions:
- issue: የἐκλεκτὸν ἐν κυρίῳ ትርጉም
  choice: ሩፎስ ‘በጌታ የተመረጠ’ ተብሎ ተገልጧል።
  alternative: በጌታ ምርጥ ወይም የላቀ ሰው ነው።
  rationale: ሐረጉ መለኮታዊ ምርጫን ወይም በክርስቲያናዊው ማኅበር ውስጥ የላቀ መሆንን ሊያመለክት ይችላል። ዋናው ትርጉም ይህን ወደ አንድ የተወሰነ የሥነ መለኮት ሥርዓት ሳይገድበው ያቆየዋል።
- issue: ‘እናቱንም፣ እናቴም የሆነችውን’ የሚለው ግንኙነት
  choice: ጳውሎስ የሩፎስን እናት በፍቅርና በዝምድና አገላለጽ የራሱ እናት ብሎ ይጠራታል።
  alternative: እርሷ ቃል በቃል የጳውሎስም ወላጅ እናት ናት።
  rationale: የደብዳቤውና የማኅበራዊው አውድ የፍቅር፣ የእንክብካቤና የእምነት ቤተሰብ ግንኙነትን ያመለክታል፤ ትርጉሙ የአንዲት ሴት ማመልከቱን ጠብቆ ተፈጥሯዊውን ግንዛቤ ያስችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ሰላም በሉ’ የሚለው የደብዳቤ ሰላምታ ተፈጥሯዊነትን ይጠብቃል፤ ስለ እናቱ ያለው ሐረግም ሞቅ ያለውን ግላዊ አነጋገር ሳያጣ ግልጽ ተደርጓል።
