  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: am
  text: በመሲሑ የሥራ ባልደረባችን የሆነውን ኡርባኖስንና የምወደውን እስጣኩስን ሰላም በሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላም በሉ
  rationale: የብዙ ቁጥር ትእዛዙን በዘመናዊና ተፈጥሯዊ የአማርኛ ሰላምታ አገላለጽ ያስተላልፋል።
- source_word: Οὐρβανὸν
  choice: ኡርባኖስ
  rationale: የግሪክኛውን የግል ስም ድምፅ በግዕዝ ፊደል የሚወክል ንባብ ነው።
- source_word: συνεργὸν ἡμῶν
  choice: የሥራ ባልደረባችን
  rationale: አብሮ የመሥራትንና የጋራ አገልግሎትን ሐሳብ በግልጽ ዘመናዊ አማርኛ ይገልጣል፤ የባለቤትነት ቅጥያውም ἡμῶνን ያካትታል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: Χριστός እዚህ የቅብዓት ማዕረጉን እንደያዘ ተተርጉሟል፤ ቅጥያውም የታወቀውን መሲሕ ያመለክታል።
- source_word: Στάχυν
  choice: እስጣኩስ
  rationale: የግሪክኛውን የግል ስም በአማርኛ ለማንበብ የሚመች የፊደል ግልባጭ ነው።
- source_word: ἀγαπητόν μου
  choice: የምወደውን
  rationale: የጳውሎስን የግል ፍቅርና ሞቅ ያለ አቀራረብ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በἐν Χριστῷ ውስጥ Χριστόςን መተርጎም
  choice: በመሲሑ
  alternative: በክርስቶስ
  rationale: በዚህ ሐረግ የቅቡዕነት ማዕረጉ ግልጽ ሆኖ ስለሚቆይ «መሲሕ» ተመርጧል፤ «ክርስቶስ» ግን በአማርኛ የተለመደና ትክክለኛ አማራጭ ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «የሥራ ባልደረባ» ከጥንታዊው «የሥራ ባልንጀራ» ይልቅ በዘመናዊ አጠቃቀም ተፈጥሯዊ ነው።
