- source_word: ἐπιταγήν
  choice: ትእዛዝ
  rationale: ወንጌሉ ለሕዝቦች ሁሉ እንዲታወቅ የተደረገው በአምላክ ሥልጣናዊ መመሪያ መሆኑን ይገልጣል።
- source_word: ὑπακοὴν πίστεως
  choice: በእምነት እንዲታዘዙ
  rationale: የግሪኩ የባለቤትነት ግንኙነት እምነት የሚያስገኘውን ታዛዥነት ወይም እምነት ራሱ የሆነውን ታዛዥነት ሊያመለክት ይችላል፤ ይህ አገላለጽ ግንኙነቱን ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πάντα τὰ ἔθνη
  choice: ሕዝቦች ሁሉ
  rationale: የወንጌሉን ዓለም አቀፍ ወሰን ያሳያል፤ በዚህ አውድ «አሕዛብ» ብሎ ለአይሁድ ያልሆኑት ብቻ እንዳይገደብ «ሕዝቦች ሁሉ» ተመርጧል።
- source_word: γνωρισθέντος
  choice: ታውቋል
  rationale: «እንዲታወቅ ተደርጓል» የሚለውን ሐሳብ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ከ«ተገልጦአል» ጋር ያለውን የግሶቹን ልዩነትም ይጠብቃል።
theological_decisions:
- issue: የὑπακοὴ πίστεως ትርጉም
  choice: በእምነት እንዲታዘዙ
  alternative: የእምነት ታዛዥነት እንዲኖር
  rationale: የግሪኩ ሐረግ «ከእምነት የሚመጣ ታዛዥነት»፣ «እምነትን መታዘዝ» ወይም «እምነት የሆነ ታዛዥነት» የሚሉ ተዛማጅ ንባቦችን ይፈቅዳል። የተመረጠው አገላለጽ ይህን መለኮታዊ ውጥረት በአንድ ትርጓሜ አይዘጋውም።
- issue: πάντα τὰ ἔθνη የሚያካትተው ወሰን
  choice: ሕዝቦች ሁሉ
  alternative: አሕዛብ ሁሉ
  rationale: ጳውሎስ ἔθνηን ለአይሁድ ያልሆኑ ሕዝቦች ሊጠቀምበት ቢችልም፣ πάντα የሚለው አጽንዖትና የውዳሴው አውድ ሁሉን አቀፍ የሆነውን የወንጌል መታወቅ ያጎላሉ።
