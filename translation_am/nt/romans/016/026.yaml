  text: ነገር ግን አሁን ተገልጦ፣[a] በዘላለማዊው አምላክ ትእዛዝ መሠረት፣ በነቢያዊ መጻሕፍት አማካይነት፣ ለሕዝቦች ሁሉ የእምነት ታዛዥነት እንዲኖር ታውቋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር በሮሜ 16፥25–27 ያለው የመዝጊያ ውዳሴ ቀጣይ ክፍል ነው። ስለ ስፍራውና ስለ ብራና ማስረጃዎቹ በሮሜ 16፥25 ያለውን ማስታወሻ ይመልከቱ።
