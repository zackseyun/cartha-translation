lexical_decisions:
- source_word: Συνίστημι
  choice: አደራ እላችኋለሁ
  rationale: በደብዳቤ አውድ አንድን ሰው ለተቀባዮች በመልካም ማስተዋወቅና እንዲቀበሉት መጠየቅን ያመለክታል፤ ይህ አገላለጽ በአማርኛ የምስጋናና የምክር ደብዳቤውን ተግባር በተፈጥሮ ያስተላልፋል።
- source_word: δὲ
  choice: በአማርኛው በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን ቀላል የንግግር ሽግግር ያመለክታል፤ በአማርኛ ያለ ተጨማሪ ማገናኛ በተፈጥሮ ይገለጣል።
- source_word: Φοίβην
  choice: ፌቤን
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደ አጻጻፍ ያቀርባል፤ -ን የቀጥተኛ ተሳቢ ምልክት ነው።
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: እህታችንን
  rationale: የጳውሎስን የእምነት ቤተሰብ አገላለጽ ያለ ማብራሪያ ቀጥታ ይጠብቃል።
- source_word: οὖσαν καὶ
  choice: የሆነችውን … -ም
  rationale: የአሳታፊውን ገላጭ ተግባርና የκαίን ጭማሪ ኃይል በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: διάκονον
  choice: ዲያቆን
  rationale: ቃሉ አገልጋይን በአጠቃላይ ወይም በጉባኤ ውስጥ የታወቀ የአገልግሎት ሚናን ሊያመለክት ይችላል። ከተወሰነች ጉባኤ ጋር ያለው ግንኙነት “ዲያቆን” የሚለውን ምርጫ ይደግፋል፤ አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: τῆς ἐκκλησίας
  choice: ቤተ ክርስቲያን
  rationale: በጳውሎስ ደብዳቤዎች ያለውን የክርስቲያን ጉባኤ ትርጉም በመደበኛና ግልጽ የአማርኛ ቃል ያቀርባል።
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: በቀንክርያ ያለችው
  rationale: የቦታውን ስም በተለመደ አማርኛ አጻጻፍ ያቀርብና ἐν የሚገልጠውን የቦታ ግንኙነት በተፈጥሮ ይተረጉማል።
theological_decisions:
- issue: διάκονον አጠቃላይ የአገልግሎት ቃል ነው ወይስ የጉባኤ አገልግሎት ሚና?
  choice: ዲያቆን
  alternative: አገልጋይ ወይም አገልጋይት
  rationale: “በቀንክርያ ያለችው ቤተ ክርስቲያን” የሚለው ገላጭ ሐረግ ፌቤ ከተወሰነች ጉባኤ ጋር የሚታወቅ የአገልግሎት ግንኙነት እንዳላት ይጠቁማል። “ዲያቆን” ይህን ዕድል ይጠብቃል፣ ነገር ግን የኋለኛውን ዘመን የቤተ እምነት መዋቅር አይጨምርም፤ አጠቃላይ የአገልጋይነት ትርጉሙም በማስታወሻ ተጠብቋል።
