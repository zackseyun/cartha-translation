  text: 'እነርሱ ስለ ሕይወቴ ሲሉ የራሳቸውን አንገት ለሞት አሳልፈው ሰጡ፤[a] ለእነርሱም ምስጋና የማቀርበው እኔ ብቻ አይደለሁም፤ የአሕዛብ አብያተ ክርስቲያናት ሁሉም ያመሰግኗቸዋል።[b]


    [a] ቃል በቃል፣ «የራሳቸውን አንገት»። ግሪክኛው «አንገት» የሚለውን በነጠላ ቁጥር ይጠቀማል፤ ይህም ራስን ለሞት አደጋ ማጋለጥን የሚገልጽ ፈሊጣዊ አነጋገር ነው።


    [b] ወይም፣ «የብሔራት አብያተ ክርስቲያናት»።'
