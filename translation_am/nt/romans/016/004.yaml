  terminology: «ሕይወት», «አሕዛብ», and «አብያተ ክርስቲያናት» are appropriate. The alternative for τῶν ἐθνῶν should be «የአሕዛት/የብሔራት» only if it reflects “nations”; «የብሔራት» most directly does so.
