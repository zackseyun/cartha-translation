  source_fidelity: The draft correctly understands ψυχή as Paul’s life and ἐθνῶν as Gentiles. However, its footnote for the neck idiom inaccurately paraphrases ὑπέθηκαν as «አስገቡ», and the second footnote does not provide the relevant alternative, “nations.”
