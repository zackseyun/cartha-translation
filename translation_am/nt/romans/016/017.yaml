- issue: ἀδελφοί ለሮም ጉባኤ ያለው ወካይ አጠቃቀም
  choice: በዋናው ጽሑፍ «ወንድሞች ሆይ» ተብሎ ተቀምጦ፣ መላውን ጉባኤ ሊያካትት መቻሉ በእግር ማስታወሻ ተገለጸ።
