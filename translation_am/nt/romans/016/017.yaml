  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: am
  text: ወንድሞች ሆይ፣[a] የተማራችሁትን ትምህርት በመቃረን ክፍፍሎችንና ማሰናከያዎችን የሚያስከትሉትን ሰዎች እንድትጠነቀቁ፣ ከእነርሱም ፈቀቅ እንድትሉ እለምናችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወንድሞችና እኅቶች»፤ የግሪኩ ቃል «ወንድሞች» ይላል፣ ነገር ግን ምናልባት መላውን ጉባኤ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: አጥብቄ እማጸናችኋለሁ
  rationale: የግሱን ጠንካራና እረኛዊ ልመና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር የጥሪ ቅርጽ ይጠብቃል፤ በዐውዱ መላውን ጉባኤ ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
- source_word: σκοπεῖν
  choice: እንድትጠነቀቁ
  rationale: በንቃት ማየትንና ከተጠቀሱት ሰዎች መጠንቀቅን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διχοστασίας
  choice: መከፋፈልን
  rationale: በማኅበሩ ውስጥ የሚፈጠርን መለያየትና ክፍፍል በግልጽ ቃል ያስተላልፋል።
- source_word: σκάνδαλα
  choice: ማሰናከያዎችን
  rationale: የመሰናከልን ምስላዊ ኃይል ይጠብቃል፤ ቃሉን ወደ ተራ ቅሬታ አያሳንሰውም።
- source_word: παρὰ τὴν διδαχήν
  choice: ከተማራችሁት ትምህርት በተቃራኒ
  rationale: παρά ከተሳቢ ጋር የሚያሳየውን ከተቀበሉት ትምህርት መውጣትና መቃረን ይገልጣል።
- source_word: ἐμάθετε
  choice: እናንተ ከተማራችሁት
  rationale: አማኞቹ ቀድሞ የተማሩትን ትምህርት በቀጥታ ያመለክታል።
- source_word: ποιοῦντας
  choice: የሚፈጥሩትን ሰዎች
  rationale: ተሳቢው ሰዎችን እንደሚገልጽና ክፍፍሉንና ማሰናከያዎቹን እንደሚያስከትሉ በግልጽ ያሳያል።
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: ከእነርሱም ፈቀቅ እንድትሉ
  rationale: ከእነርሱ ዘወር ማለትን የሚያሳየውን አቅጣጫዊ ምስልና የትእዛዙን ኃይል ይጠብቃል።
