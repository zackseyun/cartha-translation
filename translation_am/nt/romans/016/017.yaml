  rationale: የግሪኩ ቃል በቅርጹ ተባዕታይ ብዙ ቁጥር ነው፤ በጳውሎስ አጠቃቀም ግን ወንዶችንና ሴቶችን ያካተተውን ጉባኤ በአጠቃላይ ሊጠራ ይችላል። ይህ ሁለቱንም ገጽታዎች ሳይደብቅ ይጠብቃል።
