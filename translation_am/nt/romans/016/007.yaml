base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: am
  text: አንድሮኒቆስንና ዩንያን[a] ሰላም በሉልኝ፤ እነርሱ ወገኖቼና አብረውኝ የታሰሩ ናቸው። በሐዋርያት መካከል የተከበሩ ናቸው[b]፤ ከእኔም በፊት በመሲሑ ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዩንያ፦ እንደ አማራጭ “ዩንያስ” የተባለ የወንድ ስም ተደርጎ ሊወሰድ ይችላል፤ ሆኖም የግሪኩ ቅርጽና የታሪክ አጠቃቀም የሴት ስሙን የበለጠ ይደግፋሉ።
    reason: alternative_reading
  - marker: b
    text: ወይም “በሐዋርያት መካከል ታዋቂዎች ናቸው።” ሐረጉ “በሐዋርያት ዘንድ በደንብ የታወቁ ናቸው” ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
