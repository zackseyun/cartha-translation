    rationale: The predicate construction is not wrong, but it is less direct than an appositional rendering and adds no source-based nuance.
  - severity: medium
    issue: «ከናርኪሶስ ሰዎች መካከል» may imply a more definite category of Narcissus's own people.
    rationale: τοὺς ἐκ τῶν Ναρκίσσου indicates association with Narcissus but leaves the exact relationship unstated. The revised wording retains that restraint more clearly.
  - severity: low
    issue: Footnote b uses awkward wording and risks over-specifying the association.
    rationale: The likely household/estate sense belongs in the note, but it should be expressed as a probability and in natural modern Amharic.
