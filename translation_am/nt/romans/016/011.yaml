  terminology: «ወገኔ» suitably preserves the breadth of συγγενής, and «በጌታ ያሉት» preserves the source's Pauline idiom. The footnote is revised for more natural Amharic and to avoid the awkward, overly concrete phrase «ንብረት ክበብ».
  issues:
