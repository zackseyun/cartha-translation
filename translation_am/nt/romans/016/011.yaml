base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: am
  text: ወገኔን[a]፣ ሄሮድዮንን ሰላም በሉት። ከናርኪሶስ ጋር ከተቆራኙት[b] መካከል በጌታ ያሉትን ሰላም በሏቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዘመዴ» ወይም «ከእኔ ሕዝብ የሆነ»። የግሪኩ ቃል የደም ዘመድን ወይም ከጳውሎስ ሕዝብ የሆነን ሰው ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ምናልባት አማኞች ከሆኑ የናርኪሶስ ቤት ወይም ንብረት ጋር የተያያዙ ሰዎችን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላም በሉት / ሰላም በሏቸው
  rationale: የብዙ ሰዎች ትእዛዝ መሆኑንና በደብዳቤ ሰላምታ አውድ ያለውን ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል፤ የተሳላሚውን ነጠላና ብዙ ቁጥርም ይለያል።
- source_word: Ἡρῳδίωνα
  choice: ሄሮድዮን
  rationale: የግሪኩን የግል ስም በዘመናዊ አማርኛ የተለመደ የፊደል ዝውውር መሠረት ያቀርባል።
- source_word: συγγενῆ μου
  choice: ወገኔ
  rationale: «ወገኔ» የደም ዘመድንም ሆነ ከአንድ ሕዝብ ወይም ወገን መሆንን ሊያመለክት ስለሚችል፣ የግሪኩን ሰፊ ትርጉም ያለ አላስፈላጊ መወሰን ይጠብቃል።
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: ከናርኪሶስ ሰዎች መካከል
  rationale: ከናርኪሶስ ጋር ያላቸውን ዝምድና ወይም ቁርኝት ያሳያል፣ ነገር ግን በግሪኩ በግልጽ ያልተጠቀሰውን «ቤተሰብ» ወይም «ቤት» ወደ ዋናው ጽሑፍ አይጨምርም።
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: በጌታ ያሉትን
  rationale: የጳውሎስን «በጌታ» የሚለውን አገላለጽና ሥነ መለኮታዊ ጥልቀቱን ከማብራሪያ ትርጉም ይልቅ በቀጥታ ይጠብቃል።
- source_word: κυρίῳ
  choice: ጌታ
  rationale: በጳውሎስ ደብዳቤዎች በዚህ አውድ κύριος የሚገልጸውን የተለመደ ክርስቲያናዊ አጠቃቀም በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በጳውሎስ ሰላምታዎች συγγενής የሚለው ቃል ያለው ትርጉም
  choice: «ወገኔ» ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: «ዘመዴ» ወይም «አብሮኝ አይሁዳዊ የሆነ»
  rationale: ቃሉ የደም ዘመድን ወይም ከጳውሎስ ሕዝብ የሆነን ሰው ሊያመለክት ይችላል። ይህ ቁጥር ከሁለቱ አንዱን ስለማያስገድድ፣ አሻሚነቱ ተጠብቋል።
- issue: ከናርኪሶስ ጋር የተቆራኙት ሰዎች ማንነት
  choice: «ከናርኪሶስ ሰዎች መካከል» ተብሎ የግሪኩ አጭርና ያልተወሰነ አገላለጽ ተጠብቋል።
  alternative: «ከናርኪሶስ ቤተሰብ ወይም ቤት ሰዎች መካከል»
  rationale: አገላለጹ ምናልባት የናርኪሶስን ቤት፣ አገልጋዮች ወይም ንብረት ክበብ ሊያመለክት ቢችልም፣ «ቤት» ወይም «ቤተሰብ» የሚል ስም በግሪኩ የለም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሰላም በሉት/በሏቸው» ተፈጥሯዊ የደብዳቤ ሰላምታን ይገልጻል፤ «በጌታ ያሉት» ደግሞ የምንጩን ልዩ አገላለጽ ይጠብቃል።
