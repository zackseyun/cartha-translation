    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላምታ አቅርቡላት
  rationale: በደብዳቤ መደምደሚያ ውስጥ ሰላምታን እንዲያደርሱ የሚሰጥ ትእዛዝ ነው፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: Μαριάμ
  choice: ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይከተላል።
- source_word: ἥτις
  choice: የደከመችውን
  rationale: አንጻራዊው ሐረግ ማርያምን እንዲገልጽ በአማርኛ ተፈጥሯዊ በሆነ የአንጻራዊ ግስ ቅርጽ ተተርጉሟል።
- source_word: πολλὰ
  choice: እጅግ
  rationale: ከἐκοπίασεν ጋር በተውሳከ ግስነት የድካሙን መጠንና ብርታት ያሳያል።
- source_word: ἐκοπίασεν
  choice: የደከመችውን
  rationale: κοπιάω ከባድና አድካሚ ሥራን ያመለክታል፤ ‘ደከመች’ በዚህ አውድ በትጋት መሥራቷን በክብር የሚገልጽ የተለመደ አገላለጽ ነው።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ
  rationale: የSBLGNT ንባብ አቅጣጫን ወይም ለሰዎቹ ጥቅም መሥራትን ያመለክታል፤ ‘ለእናንተ’ ይህን በአጭርና በተፈጥሯዊ መንገድ ያስተላልፋል።
theological_decisions:
- issue: በመጨረሻው ሐረግ ያለው የንባብ ልዩነት
  choice: ለእናንተ
  alternative: ለእኛ፤ በመካከላችሁ
  rationale: ዋናው ጽሑፍ የቀረበውን SBLGNT εἰς ὑμᾶς ይከተላል፤ ትርጉም ያላቸው ሌሎች የእጅ ጽሑፍ ንባቦች ግን በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እጅግ የደከመችውን’ የግሪኩን አድካሚ ሥራ ሐሳብ ይጠብቃል።
