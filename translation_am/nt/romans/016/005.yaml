base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: am
  text: በቤታቸውም ያለችውን ቤተ ክርስቲያን[a] ሰላም በሉ። የምወደውን ኤጳይኔጦስንም ሰላም በሉ፤ እርሱ ለመሲሑ የእስያ[b] የበኩራት ፍሬ[c] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቤታቸው የምትሰበሰበውን ቤተ ክርስቲያን።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “እስያ” የሚለው የጥንቱን የሮም አውራጃ እንጂ የዘመናችንን የእስያ አህጉር አያመለክትም።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በእስያ ወደ መሲሑ የመጣ የመጀመሪያው አማኝ።”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: በቤታቸው ያለችውን ቤተ ክርስቲያን
  rationale: የግሪኩን ‘ከቤታቸው ጋር የተያያዘችውን ጉባኤ’ የሚለውን ቅርጽ በቅርብ ይጠብቃል፤ በቤቱ የሚሰበሰበው ማኅበር መሆኑን በአማራጭ ማስታወሻ ያብራራል።
- source_word: ἀσπάσασθε
  choice: ሰላም በሉ
  rationale: በደብዳቤ ሰላምታ ዝርዝር ውስጥ የተለመደ፣ ግልጽና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: Ἐπαίνετον
  choice: ኤጳይኔጦስ
  rationale: የግሪኩን የግል ስም በተለመደው የአማርኛ ቅዱስ መጽሐፍ አጻጻፍ ይተረጉማል።
- source_word: ἀγαπητόν μου
  choice: የምወደውን
  rationale: የጳውሎስን ሞቅ ያለ የግል ፍቅር በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያሳያል።
- source_word: ἀπαρχὴ
  choice: በኩራት ፍሬ
  rationale: የመጀመሪያውን ፍሬ ምስል ይጠብቃል፤ ቃሉን ‘የመጀመሪያው አማኝ’ ብሎ በዋናው ጽሑፍ አይፈታውም።
- source_word: τῆς Ἀσίας
  choice: የእስያ
  rationale: የግሪኩን የባለቤትነት ቅርጽ ይጠብቃል፤ እስያ የሮም አውራጃ መሆኗ በማስታወሻ ተብራርቷል።
- source_word: εἰς Χριστόν
  choice: ለመሲሑ
  rationale: ከἀπαρχή ጋር ያለውን የዓላማ ወይም የግንኙነት ሐሳብ ያሳያል፤ Χριστόςንም በዚህ አውድ እንደ ማዕረግ ‘መሲሕ’ ብሎ ያቀርባል።
theological_decisions:
- issue: የΧριστόν አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ እንደ ማዕረግ ስለሚሠራ፣ ‘መሲሕ’ የተቀባው ንጉሥ የሚለውን ትርጉም ያስጠብቃል።
- issue: የἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν ትርጉም
  choice: ለመሲሑ የእስያ በኩራት ፍሬ
  alternative: በእስያ ለመሲሑ የመጀመሪያው አማኝ
  rationale: ዋናው ጽሑፍ የጳውሎስን ‘በኩራት ፍሬ’ ምስልና የεἰςን የግንኙነት አሻሚነት ይጠብቃል፤ በአውዱ የሚገኘው የመጀመሪያ አማኝ የሚለው ፍቺ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ በኩራት-ፍሬ ምስል ተጠብቆ፣ ቀጥተኛው ፍቺ በግርጌ ማስታወሻ ተሰጥቷል።
