  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: am
  text: እንደነዚህ ያሉ ሰዎች የገዛ ሆዳቸውን[b] እንጂ ጌታችንን መሲሕን[a] አያገለግሉም፤ በጣፋጭ ንግግርና በሽንገላ ተንኮል የሌለባቸውን ሰዎች[c] ልቦች ያታልላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታችንን ክርስቶስን።”
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “የገዛ ሆዳቸውን።” ይህ ራስን ለማርካት ያለን ምኞት የሚያሳይ ሕያው ምስል ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ያልጠረጠሩትን” ወይም “ንጹሓንን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: እንደነዚህ ያሉ ሰዎች
  rationale: የቀደመው ቁጥር የጠቀሳቸውን ከፋፋይ ሰዎች ወደ ኋላ ያመለክታል፤ አገላለጹም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: ጌታችንን መሲሕን
  rationale: ἡμῶν የሚለውን የባለቤትነት አገናኝ ይጠብቃል፤ Χριστόςም እንደ ማዕረግ ‘መሲሕ’ ተብሎ ተተርጉሟል። በግሪኩ የሌለው ‘ኢየሱስ’ አልተጨመረም።
- source_word: δουλεύουσιν
  choice: አያገለግሉም
  rationale: ግሱ በባርነት መገዛትን ሊያመለክት ቢችልም፣ እዚህ በአማርኛ ‘ማገልገል’ የጌታንና የሆድን ተቃርኖ በግልጽ ያስተላልፋል።
- source_word: κοιλίᾳ
  choice: ሆዳቸውን
  rationale: የጳውሎስን ሕያው ምስል ይጠብቃል፤ ቃሉን ‘ምኞት’ ብሎ በመተርጎም ትርጉሙን አስቀድሞ አይወስንም።
- source_word: χρηστολογίας
  choice: ጣፋጭ ንግግር
  rationale: ሰውን ለማባበል የሚያስደስትና ለዘብተኛ የሚመስል ንግግርን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εὐλογίας
  choice: ሽንገላ
  rationale: በዚህ አውድ ቃሉ እውነተኛ በረከትን ሳይሆን ለማታለል የሚነገር ውዳሴን ያመለክታል።
- source_word: ἐξαπατῶσι
  choice: ያታልላሉ
  rationale: የተጠናከረውን የማሳሳት ሐሳብ በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: καρδίας
  choice: ልብ
  rationale: የሰውን ውስጣዊ ማንነት የሚያመለክተውን መጽሐፍ ቅዱሳዊ ምስል ይጠብቃል።
- source_word: ἀκάκων
  choice: ያልተጠራጠሩ ሰዎች
  rationale: በማስጠንቀቂያው አውድ በቀላሉ ለማታለል የተጋለጡ ሰዎችን ያመለክታል፤ ቃሉ ንጹሕ ወይም ተንኮል የሌለበት ማለትም ሊሆን ይችላል።
theological_decisions:
- issue: በጳውሎስ የማዕረግ ሐረግ ውስጥ Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: Χριστός እዚህ እንደ ግል ስም ብቻ ሳይሆን እንደ ማዕረግ ይሠራል፤ ‘መሲሕ’ ይህን ማዕረጋዊ ኃይል በግልጽ ያሳያል፣ የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩን ተቃርኖ ለማጉላት ‘ሆዳቸውን እንጂ … አያገለግሉም’ የሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ተመርጧል።
