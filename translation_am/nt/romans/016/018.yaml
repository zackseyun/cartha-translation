  source_fidelity: The central contrast, the metaphor of serving one’s own belly, and the two kinds of deceptive speech are conveyed accurately. However, ያልተጠራጠሩ means ‘those who have not doubted,’ which is not an appropriate rendering of ἀκάκων (‘innocent, guileless,’ and contextually unsuspecting). The plural καρδίας is also better represented explicitly as ልቦች.
  naturalness: The wording is generally modern and clear. Recasting the final phrase as ‘the hearts of guileless people’ is both idiomatic and closer to the Greek.
  terminology: ጌታችን መሲሕ appropriately renders κύριος ἡμῶν Χριστός without adding ‘Jesus’; the traditional form ክርስቶስ is suitably retained in a footnote. ሆዳቸውን, ጣፋጭ ንግግር, and ሽንገላ are suitable contextual renderings.
  issues:
  - severity: medium
    issue: ያልተጠራጠሩ is used for ἀκάκων.
    rationale: This expression denotes people who have not doubted or questioned, whereas ἀκάκων denotes those who are innocent/guileless, with the contextual implication that they are unsuspecting.
  - severity: low
    issue: ልብ is singular although καρδίας is plural.
    rationale: A collective singular is possible in Amharic, but ልቦች more directly preserves the source’s plural and reads naturally in this possessive construction.
