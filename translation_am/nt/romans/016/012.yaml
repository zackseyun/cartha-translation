base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: am
  text: በጌታ በትጋት የሠሩትን ጥሩፋይናንና ጥሩፎሳን[a] ሰላም በሉ። በጌታ እጅግ በትጋት የሠራችውን ፐርሲስን፣ የተወደደችውን[b] ሰላም በሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጌታ በትጋት የሚሠሩትን” ወይም “በጌታ የለፉትን።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእንግሊዝኛ ትርጉሞች “የምወዳት ፐርሲስ” ይላሉ፤ ግሪኩ ግን “የተወደደችው” ብቻ ነው የሚለው፣ “የእኔ” የሚል ግልጽ ቃል የለውም።
    reason: lexical_alternative
