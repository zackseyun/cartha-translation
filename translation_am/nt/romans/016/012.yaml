- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: የደከሙትን / የደከመችውን
  rationale: κοπιάω የሚያመለክተውን ከባድና አድካሚ ጥረት ያሳያል፤ በሁለቱ አጠቃቀሞች ያለውን የቃል ድግግሞሽም ይጠብቃል።
- source_word: ἐν κυρίῳ
