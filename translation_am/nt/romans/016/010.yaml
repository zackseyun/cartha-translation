base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: am
  text: በመሲሑ[a] የተፈተነና የተረጋገጠውን አጵሌስን ሰላም በሉት። ከአርስጦቡሎስ ቤት የሆኑትንም ሰላም በሏቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊው አገላለጽ፣ “በክርስቶስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላም በሉት / ሰላም በሏቸው
  rationale: የብዙ ሰዎች ትእዛዝ ሲሆን ሰላምታን እንዲያደርሱ ይጠይቃል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: Ἀπελλῆν
  choice: አጵሌስ
  rationale: የግሪክ የግል ስም በአማርኛ የመጽሐፍ ቅዱስ ስሞች አጻጻፍ ልማድ መሠረት በድምፅ ተቀራራቢነት ተጽፏል።
- source_word: τὸν δόκιμον
  choice: የተፈተነና የተረጋገጠውን
  rationale: δόκιμος ከፈተና በኋላ እውነተኛነቱ ወይም ብቃቱ የተረጋገጠን ሰው ያመለክታል፤ ሁለቱንም የፍተሻና የተቀባይነት ገጽታዎች ለማቆየት ይህ አገላለጽ ተመርጧል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: ἐν የጳውሎስን የኅብረትና የሕይወት ክልል አገላለጽ እንዲቆይ ‘በ’ ተብሏል፤ Χριστός በዚህ ስፍራ የማዕረግ ትርጉሙን እንዲያሳይ ‘መሲሕ’ ተብሏል።
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: ከአርስጦቡሎስ ቤት የሆኑትን
  rationale: የግሪኩ አገላለጽ አርስጦቡሎስን ራሱን ሳይሆን ከቤቱ ወይም ከንብረቱ ጋር የተያያዙትን ሰዎች ሊያመለክት ይችላል፤ ‘ከ…ቤት የሆኑት’ ይህን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἐν Χριστῷ የሚለውን የጳውሎስ አገላለጽ መተርጎም
  choice: በመሲሑ
  alternative: በክርስቶስ
  rationale: ‘መሲሕ’ የΧριστόςን የማዕረግ ትርጉም ያሳያል፤ ‘በ’ ደግሞ ጳውሎስ የሚጠቀምበትን የኅብረት ወይም የሕይወት ክልል ቋንቋ ሳይፈታ ያቆያል። የተለመደው አገላለጽ በማስታወሻ ተጠብቋል።
