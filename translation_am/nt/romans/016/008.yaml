  source_fidelity: The draft correctly represents the plural imperative, the SBLGNT name form Ampliatus, Paul's personal designation 'my beloved,' and the qualifying phrase 'in the Lord.' However, the greeting construction is more idiomatic and syntactically clear in Amharic with ለ before the recipient.
  naturalness: ለአምፕሊያቱስ ሰላም በሉልኝ is the natural modern Amharic epistolary form. It avoids the less natural direct-object construction አምፕሊያቱስን ሰላም በሉልኝ.
  terminology: በጌታ preserves ἐν κυρίῳ without adding 'Jesus.' የምወደውን faithfully expresses μου with the affectionate force of ἀγαπητόν. አምፕሊያቱስ follows the SBLGNT reading.
