base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: am
  text: በጌታ የምወደውን አምፕሊያቱስን[a] ለእርሱ ሰላም በሉልኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክኛው ስም “አምፕሊያስ” ተብሎም ሊጻፍ ይችላል፤ እዚህ ላይ የSBLGNT ንባብ “አምፕሊያቱስ” የሚለውን ቅርጽ ይደግፋል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላም በሉልኝ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዝ ሲሆን፣ በደብዳቤ የሚቀርብን ሰላምታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἀμπλιᾶτον
  choice: አምፕሊያቱስን
  rationale: የSBLGNTን Ἀμπλιᾶτον ንባብ በመከተል ስሙ በመደበኛ ቅርጹ አምፕሊያቱስ ተብሎ ተጽፏል፤ የአማርኛው -ን የቀጥተኛ ተሳቢነቱን ያሳያል።
- source_word: ἀγαπητόν μου
  choice: የምወደውን
  rationale: የጳውሎስን የግል ፍቅርና የሐረጉን ሙቀት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጌታን ግንኙነት ወይም የክርስቲያናዊ ሕይወትን ዓውድ የሚገልጸውን የጳውሎስ የተለመደ አነጋገር ይጠብቃል፤ በግሪክኛው የሌለው “ኢየሱስ” አልተጨመረም።
theological_decisions:
- issue: የጳውሎስ ፍቅርና የἐν κυρίῳ አገናኝነት
  choice: “በጌታ የምወደውን” በማለት ፍቅሩ በጌታ ያለውን የክርስቲያናዊ ኅብረት ዓውድ እንዳለው ተገልጿል።
  alternative: ሐረጉን ተራ የግል ወዳጅነት ብቻ እንደሚያመለክት መተርጎም፣ ወይም “በጌታ”ን ከሰላምታው ተግባር ጋር ማያያዝ።
  rationale: የግሪክኛው የቃላት አደራደር τὸν ἀγαπητόν μου ἐν κυρίῳ የሚለውን ሁሉ ከአምፕሊያቱስ ጋር ማያያዝን በተፈጥሮ ይደግፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ሰላም በሉልኝ” የደብዳቤ ሰላምታን በተፈጥሯዊ አገላለጽ ያቀርባል።
