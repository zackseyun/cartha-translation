  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: am
  text: ደብዳቤውን የጻፍኩት እኔ ጤርጥዮስ፣ በጌታ ሰላም እላችኋለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሌላ ሊሆን የሚችል፣ ግን ያነሰ ዕድል ያለው አተረጓጎም፦ «ደብዳቤውን በጌታ የጻፍኩት እኔ ጤርጥዮስ፣ ሰላም እላችኋለሁ።» የግሪኩ «በጌታ» የሚለው ሐረግ ከ«የጻፍኩት» ጋር ሊያያዝ ይችላል፤ ይበልጥ ተፈጥሯዊው ግን ሰላምታውን እንዲገልጽ መውሰድ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: ሰላምታ አቀርብላችኋለሁ
  rationale: በደብዳቤ መዝጊያ አውድ ውስጥ የሚቀርብን ሰላምታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ በግሪኩ ያልተገለጸ ተጨማሪ ስሜት አያክልም።
- source_word: ὑμᾶς
  choice: -ላችኋለሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተቀባዮችን በግስ ቅጥያው በግልጽ ያሳያል።
- source_word: ἐγὼ Τέρτιος
  choice: እኔ ጠርጥዮስ
  rationale: ግልጽ ተውላጠ ስሙንና የተናጋሪውን ራስ-መግለጫ ይጠብቃል። ጠርጥዮስ የግሪኩን Τέρτιος በተለመደ የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ያቀርባል።
- source_word: ὁ γράψας
  choice: የጻፍኩት
  rationale: አርቲክላዊውን ያለፈ ጊዜ ቦዝ አንቀጽ ከተናጋሪው አንደኛ መደብ ንግግር ጋር በተፈጥሯዊ አማርኛ ያስማማል፤ ጠርጥዮስ ደብዳቤውን በእጁ የጻፈው ሰው መሆኑን ይገልጣል።
- source_word: τὴν ἐπιστολήν
  choice: ይህን ደብዳቤ
  rationale: «ደብዳቤ» ለዘመናዊ አንባቢ ተፈጥሯዊ ነው። ግሪኩ የተወሰነ አመልካች ባይኖረውም፣ የአማርኛው «ይህን» በእጃቸው ያለውን ደብዳቤ በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: ἐν κυρίῳ
  choice: በጌታ ሆኜ
  rationale: የክርስቲያናዊ ኅብረትን ወይም ከጌታ ጋር ያለን ግንኙነት የሚገልጠውን የጳውሎስ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል። κύριος እንደ «ጌታ» ተተርጉሟል።
theological_decisions:
- issue: የἐν κυρίῳ ትስስርና ትርጉም
  choice: «በጌታ ሆኜ» ከሰላምታው ጋር ተያይዟል፤ ጠርጥዮስ በጌታ ያለውን ኅብረት መሠረት አድርጎ ሰላምታ ያቀርባል።
  alternative: ሐረጉን «ይህን ደብዳቤ በጌታ ሆኜ የጻፍኩት» በማለት ከመጻፉ ጋር ማያያዝ።
  rationale: በዚህ የደብዳቤ መዝጊያ አውድ ሐረጉ ከዋናው የሰላምታ ግስ ጋር መያያዙ ይበልጥ ተፈጥሯዊ ነው። ሆኖም የግሪኩ አቀማመጥ ከ«የጻፈው» ጋር እንዲያያዝ ስለሚፈቅድ፣ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ አገላለጽ ተጠቅሟል። የቃላት ቅደም ተከተሉ ራስ-መግለጫውን በተፈጥሯዊ ሁኔታ ሲያቀርብ፣ የግሪኩን የἐν κυρίῳ ሰዋሰዋዊ አሻሚነት በግርጌ ማስታወሻ ይጠብቃል።
