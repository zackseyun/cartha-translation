  rationale: ቃሉ ከኢየሱስ ጋር የተያያዘ ማዕረግ ሆኖ ሊሰማ ስለሚችል፣ ትርጉሙን የሚያሳየው «መሲሕ» በዋናው ጽሑፍ ተመርጧል። ስም መሰል የሆነውና በቤተ ክርስቲያን ንባብ የተለመደው «ክርስቶስ» ግን እውነተኛውን የአገላለጽ አማራጭ ለመጠበቅ በግርጌ ማስታወሻ ተሰጥቷል።
