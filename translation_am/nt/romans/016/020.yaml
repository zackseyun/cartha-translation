  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: am
  text: ነገር ግን የሰላም አምላክ ሰይጣንን በቅርቡ ከእግራችሁ በታች ይደቅቀዋል። የጌታችን ኢየሱስ መሲሕ[a] ጸጋ ከእናንተ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
