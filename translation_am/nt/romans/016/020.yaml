    text: ወይም በተለመደው አተረጓጎም፣ «ኢየሱስ ክርስቶስ»።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: የሰላምም አምላክ
  rationale: የግሪኩን የባለቤትነት አገላለጽና የጳውሎስን የተለመደ መለኮታዊ ስያሜ በቀጥታ ይጠብቃል፤ δὲ የሚያሳየው የንግግር ሽግግርም «ም» በሚለው አያያዥ ተገልጧል።
- source_word: συντρίψει
  choice: ይደቅቀዋል
  rationale: የወደፊት ጊዜውንና የፍጹም ድል ምስልን ይጠብቃል፤ ከእግር በታች ከሚለው አገላለጽ ጋርም ተፈጥሯዊ ነው።
- source_word: τὸν Σατανᾶν
  choice: ሰይጣንን
  rationale: በአማርኛ የአዲስ ኪዳን አጠቃቀም የተለመደውን የግል ስም ይጠብቃል፤ «ባላጋራው» ብሎ አይተረጉመውም።
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: ከእግራችሁ በታች
  rationale: የድልና የመገዛትን ምስላዊ አገላለጽ ጠብቆ፣ ὑμῶν ብዙ ቁጥር መሆኑን «እግራችሁ» በማለት ያሳያል።
- source_word: ἐν τάχει
  choice: በቅርቡ
  rationale: በዚህ አውድ የጊዜን ቅርበት በተፈጥሯዊ አማርኛ ይገልጣል፤ የድርጊቱን ፍጥነት ብቻ አያመለክትም።
- source_word: ἡ χάρις
  choice: ጸጋ
  rationale: የጳውሎስን ቁልፍ መለኮታዊ ቃልና የቡራኬውን ቀመር የሚጠብቅ የተለመደ አማርኛ ነው።
- source_word: τοῦ κυρίου ἡμῶν
  choice: የጌታችን
  rationale: የግሪኩን የባለቤትነት ግንኙነት በአጭርና በተፈጥሯዊ መልኩ ያስተላልፋል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ መሲሕ
  rationale: Χριστός ከመሲሐዊ ማዕረጉ ጋር እንዲሰማ በአማርኛ የተለመደው «መሲሕ» ተመርጧል፤ ባህላዊው «ክርስቶስ» በማስታወሻ ቀርቧል።
- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር ይሁን
  rationale: በግሪክ የታሰበውን ግስ በአማርኛ ለተፈጥሯዊ የቡራኬ አገላለጽ ግልጽ ያደርጋል፤ የሁለተኛ መደብ ብዙ ቁጥርንም ይጠብቃል።
theological_decisions:
