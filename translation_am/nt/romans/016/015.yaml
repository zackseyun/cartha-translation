  source_fidelity: 'The draft represents all source constituents accurately: the imperative greeting, the four named referents, Nereus''s sister, and all the saints associated with them. The footnote responsibly preserves the historically discussed masculine alternative for Ἰουλίαν without displacing the more probable feminine reading.'
  naturalness: The object-marked forms with -ን are less idiomatic with the Amharic greeting expression «ሰላም በሉ», which normally takes the addressee with «ለ-». The coordination can also be made more direct and natural without the additive sequence «-ም እንዲሁም».
  terminology: «ቅዱሳን» is an appropriate, established rendering of πάντας ἁγίους in this Pauline context. The personal-name forms are serviceable modern Amharic transliterations. The Julia/Julias note is accurate and suitably non-dogmatic.
  issues:
