  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: am
  text: ለፊሎሎጎስና ለዩልያ[a]፣ ለኔሬዎስና ለእኅቱ፣ ለኦሊምጳስም እንዲሁም ከእነርሱ ጋር ላሉት ቅዱሳን ሁሉ ሰላም በሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ዩልያስ»፣ ስሙ የወንድ እንደሆነ ከተወሰደ፤ የግሪኩ ቅርጽ ግን በተለምዶ «ዩልያ» የሚለው የሴት ስም እንደሆነ ይታወቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላም በሉ
  rationale: የብዙ ሰዎች ትእዛዝ የሆነውን ግስ በዘመናዊና ተፈጥሯዊ የአማርኛ ደብዳቤ አነጋገር ያስተላልፋል።
- source_word: Φιλόλογον
  choice: ፊሎሎጎስን
  rationale: የግል ስም በግዕዝ ፊደል ተጽፎ፣ በአማርኛው የቀጥታ ተሳቢ ምልክት -ን ተጨምሮበታል።
- source_word: Ἰουλίαν
  choice: ዩልያን
  rationale: የግሪኩ ቅርጽ በተለምዶ የሴት ስም የሆነውን ዩልያ ያመለክታል፤ የወንድ ስም የመሆን አማራጭ በማስታወሻ ተጠብቋል።
- source_word: Νηρέα
  choice: ኔሬዎስን
  rationale: የግል ስሙ በአማርኛ ድምፅ አቀራረብ ተጽፏል።
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: እኅቱን
  rationale: የዝምድናውንና የባለቤትነት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል፤ ተውላጠ ስሙ በቅርብ የተጠቀሰውን ኔሬዎስን ያመለክታል።
- source_word: Ὀλυμπᾶν
  choice: ኦሊምጳስን
  rationale: የግል ስሙ በተለመደ የግዕዝ ፊደል ድምፅ አቀራረብ ተጽፏል።
- source_word: τοὺς σὺν αὐτοῖς
  choice: ከእነርሱ ጋር ያሉትን
  rationale: σύν የሚያሳየውን አብሮነት በግልጽና ተፈጥሯዊ የአማርኛ አነጋገር ያቀርባል።
- source_word: πάντας ἁγίους
  choice: ቅዱሳን ሁሉ
  rationale: ቅዱሳን በጳውሎስ ደብዳቤዎች የእምነት ማኅበሩን ለመጥራት የሚያገለግለውን ἅγιοι በአጭርና በተለመደ መንገድ ያስተላልፋል፤ ሁሉ ደግሞ πάνταςን ያሳያል።
theological_decisions:
- issue: በጳውሎስ ሰላምታ ውስጥ ἅγιοι የሚለውን መተርጎም
  choice: ቅዱሳን
  alternative: የተቀደሱት / የእግዚአብሔር ቅዱስ ሕዝብ
  rationale: እዚህ ቃሉ ከተጠቀሱት ሰዎች ጋር ያሉትን አማኞች ያመለክታል። «ቅዱሳን» የጳውሎስን የተለመደ የማኅበር መጠሪያ ይጠብቃል፤ ከጊዜ በኋላ የተፈጠረን የተለየ የቅድስና ማዕረግ በግድ አያመለክትም።
- issue: Ἰουλίαν የሚለው ስም ጾታ
  choice: ዩልያ
  alternative: ዩልያስ
  rationale: የግሪኩ ቅርጽና የስም አጠቃቀሙ የሴት ስም የሆነውን «ዩልያ» እንደ ዋና ንባብ ይደግፋሉ። በትርጉም ታሪክ የተነሣው የወንድ ስም አማራጭ ግን ለግልጽነት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሰላም በሉ» የደብዳቤውን የሰላምታ ትእዛዝ በተፈጥሯዊ አገላለጽ ይሰጣል፤ የሰዎቹ ስሞች በግዕዝ ፊደል የድምፅ ቅርባቸውን በመከተል ቀርበዋል።
