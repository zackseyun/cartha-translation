    issue: Case marking with «ሰላም በሉ»
    rationale: In natural modern Amharic, those to whom greetings are conveyed are normally introduced with «ለ-» (for example, «ለX ሰላም በሉ»), rather than marked as direct objects with -ን. Revising this improves idiom while retaining the directive force of ἀσπάσασθε.
