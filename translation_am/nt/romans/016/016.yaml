  text: በተቀደሰ መሳሳም[b] እርስ በርሳችሁ ሰላምታ ተለዋወጡ። የመሲሑ አብያተ ክርስቲያናት ሁሉ ሰላምታ ያቀርቡላችኋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የክርስቶስ አብያተ ክርስቲያናት ሁሉ ሰላምታ ያቀርቡላችኋል።”
    reason: alternative_reading
  - marker: b
    text: “የተቀደሰ መሳሳም” በአማኞች መካከል ቅዱስ ፍቅርንና ኅብረትን የሚገልጽ፣ በዚያ ዘመን በባህሉ የታወቀ የሰላምታ ልማድ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: እርስ በርሳችሁ ሰላምታ ተለዋወጡ
  rationale: የግሪክኛውን የጋራ ሰላምታ ትእዛዝ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ ἀλλήλους የሚያመለክተውን መደጋገፍም ይጠብቃል።
- source_word: ἐν φιλήματι ἁγίῳ
  choice: በተቀደሰ መሳሳም
  rationale: ἐν እዚህ የሰላምታውን መንገድ ያመለክታል፤ φίλημα መሳሳምን፣ ἁγίῳ ደግሞ ለእግዚአብሔር የተለየና ንጹሕ ባሕርይ ያለውን ያሳያል።
- source_word: Ἀσπάζονται ὑμᾶς
  choice: ሰላምታ ይልኩላችኋል
  rationale: የደብዳቤ አጻጻፍ አውድ ውስጥ ያለውን ‘ሰላምታ ያቀርቡላችኋል’ የሚለውን ትርጉም ተፈጥሯዊ በሆነ አማርኛ ያቀርባል፤ የብዙ ቁጥር ὑμᾶς በ‘ላችኋል’ ተጠብቋል።
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: አብያተ ክርስቲያናት ሁሉ
  rationale: የግሪክኛውን ሙሉ ስብስባዊ አጽንዖት ይጠብቃል፤ በአማርኛም የተለመደና ክቡር አገላለጽ ነው።
