  text: ለአሱንክሪቶስ፣ ለፍሌጎን፣ ለሄርሜስ፣ ለፓትሮባስ፣ ለሄርማስ፣ እንዲሁም ከእነርሱ ጋር ላሉት ወንድሞች[a] ሰላምታ አቅርቡ።
