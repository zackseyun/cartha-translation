id: ROM.7.15
reference: Romans 7:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: am
  text: ምክንያቱም የማደርገውን አልገባኝም፤ የምፈልገውን አላደርግምና፣ ይልቁንም የምጠላውን ያንኑ አደርጋለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: የማደርገውን
  rationale: በዚህ አውድ ‘የምፈጽመው/የማደርገው’ የሚለውን ያመለክታል፤ ተፈጥሯዊ አማርኛ ለመሆን ‘የማደርገውን’ ተመርጧል።
- source_word: οὐ γινώσκω
  choice: አልገባኝም
  rationale: እዚህ γινώσκω ተራ መረጃን ‘ማወቅ’ ሳይሆን የራስን ድርጊት አለመረዳትን ያሳያል።
- source_word: πράσσω
  choice: አላደርግም
  rationale: በተደጋጋሚ ማድረግን ወይም በተግባር መፈጸምን ያመለክታል፤ በአማርኛ አውዱን በቀላሉ የሚያስተላልፍ አገላለጽ ተመርጧል።
- source_word: ποιῶ
  choice: አደርጋለሁ
  rationale: ከπράσσω ጋር ያለውን ጥቃቅን የቃል ልዩነት በአማርኛ በግድ ማጉላት ተፈጥሯዊ ስላልሆነ፣ ግልጽ የሆነው ‘አደርጋለሁ’ ተጠቅሟል።
- source_word: τοῦτο
  choice: ያንኑ
  rationale: ‘ያንኑ ነገር’ የሚለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የግሱ ተናጋሪ ማንነትና መንፈሳዊ ሁኔታ
  choice: በጥቅሱ የመጀመሪያ መደብ ንግግር ብቻ ተጠብቋል፤ ተናጋሪው ጳውሎስን፣ ያልታደሰን ሰው ወይም የታደሰን አማኝ እንደሚወክል አልተወሰነም።
  alternative: ተናጋሪውን በትርጉሙ ውስጥ በግልጽ ከአንድ የሥነ መለኮት አቋም ጋር ማያያዝ።
  rationale: የግሪኩ ጥቅስ ራሱ ይህን የትርጓሜ ክርክር አይወስንም፤ ስለዚህ ያለው አሻሚነት ተጠብቋል።
- issue: γάρ በሁለተኛው ሐረግ ያለው ግንኙነት
  choice: ‘ምክንያቱም’
  alternative: ‘እንዲህ ነውና’ ወይም ምልክት ሳይደረግ ሐረጎቹን ማያያዝ።
  rationale: ሁለተኛው γάρ የመጀመሪያውን አባባል ምክንያት ወይም ማብራሪያ ይሰጣል፤ ‘ምክንያቱም’ ይህን ግንኙነት በግልጽ ይገልጣል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተቃርኖ—የሚፈለገውን አለማድረግና የሚጠላውን ማድረግ—በቀጥታ ተጠብቋል።
