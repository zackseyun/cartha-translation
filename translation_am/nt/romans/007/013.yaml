  to: ታዲያ መልካም የሆነው ነገር ለእኔ ሞት ሆነልኝን? ፈጽሞ አይሁን! ይልቁንም፣ ኃጢአት እንደ ኃጢአት እንዲገለጥ፣ በመልካም በሆነው ነገር አማካይነት በእኔ ሞትን በማስከተል የሠራው ኃጢአት ነበር፤ ይህም ኃጢአት በትእዛዙ እጅግ ኃጢአተኛ እንዲሆን ነው።
  rationale: The revision corrects the opening interrogative, renders the predicate force of «φανῇ ἁμαρτία» idiomatically as “sin might be revealed as sin,” and clarifies sin’s agency in producing death through the good thing. The two supplied footnotes are retained in their existing form and anchors.
