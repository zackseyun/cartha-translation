id: ROM.7.13
reference: Romans 7:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: am
  text: ታዲያ መልካም የሆነው ነገር ለእኔ ሞት ሆነልኝን? ፈጽሞ አይሁን! ይልቁንም፣ ኃጢአት እንደ ኃጢአት እንዲገለጥ፣ በመልካም በሆነው ነገር አማካይነት በእኔ ሞትን በማስከተል የሠራው ኃጢአት ነበር፤ ይህም ኃጢአት በትእዛዙ እጅግ ኃጢአተኛ እንዲሆን ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: መልካም የሆነው ነገር
  rationale: በግሪክኛው በስም ፈንታ የቆመውን ገላጭ ቃል ጠብቆ፣ በዘመናዊ አማርኛ ተፈጥሯዊ እና ግልጽ ነው።
- source_word: ἐγένετο θάνατος
  choice: ሞት ሆነብኝ
  rationale: የγίνομαιን የመሆን ፍቺና ἐμοί የሚያመለክተውን የግል ግንኙነት በተፈጥሯዊ የአማርኛ አገላለጽ ያቆያል።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: የጳውሎስን ጠንካራ እምቢታ በክቡርና በወቅታዊ አማርኛ ይገልጣል።
- source_word: ἵνα φανῇ ἁμαρτία
  choice: ኃጢአት ኃጢአት መሆኑ እንዲገለጥ
  rationale: የተደገመውን ἁμαρτία እና የφανῇን የመገለጥ ሐሳብ ጠብቆ የዓላማውን ንዑስ አረፍተ ነገር ግልጽ ያደርጋል።
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: መልካም በሆነው ነገር አማካይነት
  rationale: διά ያለውን የመሣሪያነት ኃይል ያሳያል፤ ከቁጥሩ መጀመሪያ ካለው ἀγαθόν ጋርም የቃል ትስስሩን ይጠብቃል።
- source_word: μοι κατεργαζομένη θάνατον
  choice: በእኔ ሞትን አስከተለ
  rationale: ኃጢአት ሞትን እንደሚያስገኝ የሚያሳየውን የκατεργάζομαι ውጤታማ ተግባር በግልጽ አማርኛ ይገልጣል።
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: እጅግ ኃጢአተኛ
  rationale: የκαθ’ ὑπερβολήνን ከፍተኛ ማጠናከሪያ እና የἁμαρτωλόςን ገላጭ ኃይል ጠብቆ የጳውሎስን ሆን ብሎ የተጠቀመበትን ድግግሞሽ አያለሰልስም።
- source_word: διὰ τῆς ἐντολῆς
  choice: በትእዛዙ
  rationale: በዐውደ ንባቡ የተጠቀሰውን የታወቀ ትእዛዝ ያመለክታል፤ διάንም በአማርኛ ተፈጥሯዊ በሆነ መሣሪያዊ ቅርጽ ያቀርባል።
theological_decisions:
- issue: መልካሙ ትእዛዝና ሞት በማምጣት የኃጢአት ድርሻ
  choice: ሞትን ያስከተለው መልካሙ ነገር ሳይሆን፣ በመልካሙ ነገር አማካይነት የሠራው ኃጢአት እንደሆነ ተተርጉሟል።
  alternative: ነፃ ትርጉም ትእዛዙ ራሱ ሞትን እንዳስከተለ ሊያስመስል ይችላል።
  rationale: ከμὴ γένοιτο በኋላ ያለው ἀλλὰ ἡ ἁμαρτία ተጠያቂነቱን በኃጢአት ላይ ያደርጋል፤ ትርጉሙ ይህን የድርጊት አወቃቀር ጠብቆ በመልካሙ ትእዛዝና በኃጢአት አሠራር መካከል ያለውን ሥነ መለኮታዊ ውጥረት አይፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ኃጢአት ኃጢአተኛ» የሚለው ያልተለመደ ድግግሞሽ የግሪክኛውን ሆን ተብሎ የተደረገ አጽንዖት ለመጠበቅ ተቀምጧል።
