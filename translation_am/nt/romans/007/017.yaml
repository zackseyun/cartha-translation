language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: am
  text: አሁን ግን ያንን የማደርገው ከእንግዲህ እኔ አይደለሁም፤[a] ይልቁንም በውስጤ የሚኖረው ኃጢአት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነገር ግን ከእንግዲህ ያንን የማደርገው እኔ ሳልሆን፣ በውስጤ የሚኖረው ኃጢአት ነው።”
    reason: የግሪኩን አገባብ በቀጥተኛ የአማርኛ አወቃቀር የሚያቀርብ አማራጭ።
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: አሁን ግን
  rationale: ጊዜያዊውን ሽግግርና ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκέτι ἐγὼ
  choice: ከእንግዲህ እኔ አይደለሁም
  rationale: οὐκέτι የሚያሳየውን ‘ከእንግዲህ አይደለም’ ትርጉም ይጠብቃል፤ ግልጽ የሆነውን ἐγώም በ‘እኔ’ አጽንዖት ያቆያል።
- source_word: κατεργάζομαι αὐτό
  choice: ያንን የማደርገው
  rationale: ግሱ በዐውዱ የተጠቀሰውን ድርጊት መፈጸም ያመለክታል፤ αὐτό ወደ ቀደመው ድርጊት ስለሚመለስ ‘ያንን’ ተብሏል።
- source_word: ἀλλὰ
  choice: ይልቁንም
  rationale: በሁለቱ አድራጊዎች መካከል ያለውን ጠንካራ ተቃርኖ በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: በውስጤ የሚኖረው ኃጢአት
  rationale: የοἰκέωን በውስጥ መኖር ምስልና ኃጢአትን እንደ አድራጊ የሚያቀርበውን ሰውኛ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ ‘እኔ’ እና ‘በውስጤ የሚኖረው ኃጢአት’ ብሎ የሚያደርገው ልዩነት ኃላፊነትን እንደ መሸሽ ሊነበብ ይችላል።
  choice: የጽሑፉን ግልጽና ጠንካራ ልዩነት ያለ ማብራሪያዊ ማለስለስ ማቆየት።
  alternative: የውስጥ ትግልን በማጉላት አድራጊነትን የሚያለሰልስ ትርጉም።
  rationale: ጥቅሱ ራሱ ውጥረቱን ሳይፈታ ስለሚያቀርብ፣ ትርጉሙም ያንኑ ሥነ መለኮታዊ ውጥረት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘በውስጤ የሚኖረው’ የሚለው አገላለጽ የግሪኩን ምስላዊ ክብደት ሳይጠፋ ተፈጥሯዊ ነው።
