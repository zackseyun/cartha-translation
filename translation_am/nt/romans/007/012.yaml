  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: am
  text: ስለዚህ ሕጉ ቅዱስ ነው፤ ትእዛዙም ቅዱስ፣ ጻድቅና መልካም ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: νόμος
  choice: ሕጉ
  rationale: በዐውዱ የሙሴን ሕግ ሊያመለክት ቢችልም፣ ጽሑፉ የሰጠውን አጠቃላይ አገላለጽ ሳያጠብ ይጠብቃል።
- source_word: ἅγιος
  choice: ቅዱስ
  rationale: የተለየ መሆንንና የሥነ ምግባር ንጽሕናን የሚያካትተውን መደበኛ መጽሐፍ ቅዱሳዊ ትርጉም ይጠብቃል።
- source_word: ἐντολή
  choice: ትእዛዙ
  rationale: በሕጉ ውስጥ ያለን የተወሰነ ትእዛዝ የሚያመለክተውን ግሪክኛ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δικαία
  choice: ጻድቅ
  rationale: ትእዛዙ ከፍትሕና ከትክክለኛነት ጋር ያለውን የሥነ ምግባር ባሕርይ ያሳያል፤ ከጳውሎሳዊው የጽድቅ ቃላት ጋርም ቀጣይነትን ይጠብቃል።
- source_word: ἀγαθή
  choice: መልካም
  rationale: የሥነ ምግባር መልካምነትንና ጠቃሚነትን ሳያብራራ በሰፊው ሊያካትት የሚችል ግልጽ ትርጉም ነው።
- source_word: μὲν
  choice: በአገባቡ ተዋሕዷል
  rationale: ቅንጣቱ ቀላል አጽንዖት ቢሰጥም ተከታይ የንጽጽር δέ የለም፤ በአማርኛም በተፈጥሯዊ የድምዳሜ አወቃቀር ውስጥ መተዉ ተገቢ ነው።
theological_decisions:
- issue: νόμος በዐውዱ የሚያመለክተው
  choice: ሕጉ
  alternative: የሙሴ ሕግ
  rationale: ዐውዱ የሙሴን ሕግ የሚያመለክት ቢሆንም፣ ግሪክኛው በዚህ አንቀጽ ውስጥ ያንን ስያሜ በግልጽ አልጨመረም፤ ስለዚህ ትርጉሙ ከምንጩ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሕጉ» እና «ትእዛዙ» የግሪክኛውን የተወሰነ መስተዋድድ ያንጸባርቃሉ፤ የሁለተኛው ሐረግ ሦስት ቅጽሎችም በተፈጥሯዊ የአማርኛ ዝርዝር ተያይዘዋል።
