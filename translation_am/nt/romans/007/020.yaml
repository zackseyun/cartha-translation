review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional contrast, the unwanted action, the emphatic distinction of the speaker from sin, and sin's indwelling presence. ‘ያን የሚፈጽመው’ appropriately renders κατεργάζομαι αὐτό while retaining a modest distinction from the preceding ποιῶ.
  naturalness: The opening construction ‘የማልፈልገውን የማደርግ ከሆነ’ is grammatically possible but markedly awkward in modern standard Amharic. The conditional form ‘የማልፈልገውን ባደርግ’ is direct, idiomatic, and preserves the Greek condition without altering its meaning.
  terminology: ‘ኃጢአት’ is the correct direct equivalent of ἁμαρτία; no doctrinally interpretive substitution is introduced. ‘በውስጤ የሚኖረው’ naturally preserves the participial image of sin dwelling in the speaker. No footnote is required for this verse in Amharic.
