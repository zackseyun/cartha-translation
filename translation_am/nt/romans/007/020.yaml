id: ROM.7.20
reference: Romans 7:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: am
  text: ነገር ግን የማልፈልገውን ባደርግ፣ ያን የሚፈጽመው ከእንግዲህ እኔ አይደለሁም፤ ይልቁንም በውስጤ የሚኖረው ኃጢአት ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን … ከሆነ
  rationale: የቀደመውን ሐሳብ በመጠነኛ ንጽጽር የሚቀጥለውን ሁኔታዊ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: የማልፈልገውን የማደርግ
  rationale: የዝምድናና የአመልካች አወቃቀሩን በተፈጥሯዊ አማርኛ አጠር አድርጎ ሲያቀርብ፣ ποιῶን በቀጥተኛው ‘ማድረግ’ ይተረጉማል።
- source_word: οὐκέτι ἐγὼ
  choice: ከእንግዲህ እኔ አይደለሁም
  rationale: οὐκέτι ያለውን ‘ከእንግዲህ’ የሚል ጊዜያዊና ምክንያታዊ አጽንዖት፣ እንዲሁም በἐγώ ላይ ያለውን አጽንዖት ይጠብቃል።
- source_word: κατεργάζομαι αὐτό
  choice: ያን የሚፈጽመው
  rationale: κατεργάζομαιን ከቀደመው ποιῶ በመጠኑ ለይቶ፣ ድርጊቱን ማከናወን ወይም ማስፈጸም የሚለውን ኃይል ያሳያል። αὐτό ወደ ማይፈለገው ድርጊት እንደሚመለስ ‘ያን’ ተብሏል።
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: በውስጤ የሚኖረው ኃጢአት
  rationale: ኃጢአትን በቀጥታ ይጠራል፤ ‘ኃጢአተኛ ተፈጥሮ’ ወደሚል ትርጓሜ ሳይቀይር፣ የοἰκοῦσαን በውስጥ የመኖር ምስል ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ ‘እኔ’ንና ‘በውስጤ የሚኖረውን ኃጢአት’ የሚለየው አነጋገር የግል ኃላፊነትን ይሽራል ወይስ ኃጢአትን ተራ ረቂቅ ሐሳብ ያደርገዋል?
  choice: ‘እኔ’ እና ‘በውስጤ የሚኖረው ኃጢአት’ የሚለው ንጽጽር ያለ ማብራሪያዊ ማለስለስ ተጠብቋል።
  alternative: አነጋገሩን በማብራራት የግል ኃላፊነትን ለማጉላት ወይም ‘ኃጢአት’ን ‘ኃጢአተኛ ተፈጥሮ’ ብሎ መተርጎም።
  rationale: ግሪኩ ἁμαρτία ይላል እንጂ σάρξ አይልም። ስለዚህ ትርጉሙ በጳውሎስ አነጋገር ያለውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። ‘የሚፈጽመው’ የሚለው አገላለጽ ποιῶንና κατεργάζομαιን ሙሉ በሙሉ ሳያደበዝዝ የግሪኩን ልዩነት በተፈጥሯዊ አማርኛ ያሳያል። በቀረበው የእንግሊዝኛ ምክክር ጽሑፍ ያለው የ[a] አማራጭ ከምልክቱ ቦታ ጋር የማይጣጣምና በግሪኩ ውስጥ ተጨማሪ የትርጉም አማራጭ የማያስፈልገው በመሆኑ በዚህ ረቂቅ የግርጌ ማስታወሻ አልተጨመረም።
