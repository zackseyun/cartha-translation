  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። “ከሌላ ወንድ ጋር ብትሆን” የምንጩን ትዳር-መሰል ግንኙነት ያሳያል፣ “ብትጋባ” በማለት ግን አላስፋፋውም።
