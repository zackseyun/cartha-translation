  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: am
  text: ስለዚህ ባሏ በሕይወት ሳለ፣ የሌላ ወንድ ብትሆን[a] አመንዝራ ትባላለች። ባሏ ቢሞት ግን ከሕጉ[b] ነፃ ናት፤ ስለዚህ የሌላ ወንድ ብትሆንም አመንዝራ አይደለችም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሌላ ወንድ ጋር ብትተሳሰር።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ ላይ “ሕጉ” በቅርብ የሚያመለክተው የጋብቻን ግንኙነት የሚገዛውን ሕጋዊ እስራት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ስለዚህ
  rationale: ሁለቱ የድምዳሜ ቃላት ከቀደመው ምሳሌ የሚወጣውን ውጤት ያመለክታሉ፤ “ስለዚህ” ይህን ትስስር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ζῶντος τοῦ ἀνδρός
  choice: ባሏ በሕይወት ሳለ
  rationale: የግሪኩን በአንድ ጊዜ መሆን የሚያሳይ አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μοιχαλὶς
  choice: አመንዝራ
  rationale: ቃሉ በተለይ ዝሙት የፈጸመችን ሴት ያመለክታል፤ “አመንዝራ” ትክክለኛና የታወቀ የአማርኛ ቃል ነው።
- source_word: χρηματίσει
  choice: ትባላለች
  rationale: በዚህ አውድ ግሱ ስያሜ መሰጠትን ወይም በአንድ ስም መታወቅን ያመለክታል፤ የወደፊት ጊዜ ኃይሉም ተጠብቋል።
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: ከሌላ ወንድ ጋር ብትሆን
  rationale: የግሪኩ አገላለጽ ከሌላ ወንድ ጋር ወደ ትዳር-መሰል ግንኙነት መግባትን ያመለክታል። ይህ ትርጉም “ብትጋባ” ብሎ ከምንጩ በላይ ሳይወስን ግንኙነቱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐλευθέρα ἐστὶν
  choice: ነፃ ናት
  rationale: ከአስገዳጅ ግዴታ ወይም እስራት መለቀቅን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπὸ τοῦ νόμου
  choice: ከሕጉ
  rationale: “ሕጉ” የግሪኩን አጠቃላይ አገላለጽ ይጠብቃል፤ አውዱና የግርጌ ማስታወሻው በቅርብ የታሰበውን የጋብቻ ሕጋዊ እስራት ያብራራሉ።
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: ስለዚህ … አመንዝራ አትሆንም
  rationale: የሞቱን ውጤት እና የሴቲቱን አዲስ ሕጋዊ ሁኔታ በግልጽ አማርኛ ያስተሳስራል።
theological_decisions:
- issue: በምሳሌው ውስጥ የνόμος ወሰን
  choice: በዋናው ጽሑፍ “ሕጉ” ተብሎ ተተርጉሟል፤ በቅርብ አውዱ የጋብቻን ግንኙነት የሚያስር ሕጋዊ ግዴታ ያመለክታል።
  alternative: “የጋብቻ ሕግ” ብሎ ማብራራት፣ ወይም ቃሉን ስለ ሙሴ ሕግ በሰፊው እንደተነገረ መውሰድ።
  rationale: አውዱ ባልየው በሕይወት መኖር ወይም መሞት በሚስቱ ሕጋዊ ሁኔታ ላይ ስለሚያመጣው ለውጥ ይናገራል። “ሕጉ” የጳውሎስን ቃል ይጠብቃል፤ የግርጌ ማስታወሻውም ያለ አስፈላጊ የእምነት አቋም ማስገባት የቅርብ አውዱን ያብራራል።
