id: ROM.7.21
reference: Romans 7:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: am
  text: ስለዚህ መልካሙን ማድረግ ለምፈልገው ለእኔ፣ ክፉው ቅርብ ሆኖ የሚገኝበትን ሕግ[a] አገኛለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “መርህ” ወይም “ደንብ”።
    reason: alternative_reading
lexical_decisions:
- source_word: Εὑρίσκω
  choice: አገኛለሁ
  rationale: የግሪኩን የአሁን ጊዜ አገላለጽ እና ቀጣይ ምልከታን ይጠብቃል።
- source_word: ἄρα
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: νόμον
  choice: ሕግ
  rationale: የግሪኩን ቃልና ጳውሎስ በ‘ሕግ’ ቃል የሚፈጥረውን ድምፀት ይጠብቃል፤ በዚህ አውድ ግን ‘መርህ’ ወይም ‘ደንብ’ ማለት ሊሆን ይችላል።
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: መልካሙን ማድረግ ስፈልግ
  rationale: የግሪኩን ዳቲቭ አወቃቀር በግድ ሳይከተል፣ የθέλωን የፈቃድ ኃይልና የግሱን ሐሳብ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τὸ καλὸν
  choice: መልካሙን
  rationale: የተወሰነውን ስማዊ ቅጽ ‘መልካሙ’ ብሎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ κακὸν
  choice: ክፉው
  rationale: ስማዊ ሆኖ የቀረበውን ቅጽ ይጠብቃል፤ ሐሳቡን ‘ክፉ ነገር’ ብሎ አይገድበውም።
- source_word: παράκειται
  choice: በአጠገቤ እንዳለ
  rationale: ክፉው ቅርብ ሆኖ መገኘቱን ወይም አብሮት መኖሩን የሚያሳየውን የግሪኩን ምስል በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: νόμον የሙሴን ሕግ ወይስ የሚሠራ መርህን/ደንብን ያመለክታል?
  choice: በዋናው ጽሑፍ ‘ሕግ’ ተብሎ ቀርቧል።
  alternative: ‘መርህ’ ወይም ‘ደንብ’
  rationale: ‘ሕግ’ የሚለው ትርጉም የግሪኩን ቃልና የጳውሎስን የቃል ድምፀት ይጠብቃል፤ ነገር ግን አውዱ አንድን የሚሠራ መርህ ወይም ተደጋጋሚ ሁኔታ ሊያመለክት ስለሚችል አማራጩ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክቡር የአማርኛ አገላለጽን ይጠቀማል። የግሪኩ አወቃቀር በቀጥታ ቢተረጎም ግትር ስለሚሆን፣ የፈቃድና የክፉው ቅርበት ሐሳብ ሳይጠፋ በተፈጥሯዊ የጊዜ ንዑስ አረፍተ ነገር ቀርቧል።
