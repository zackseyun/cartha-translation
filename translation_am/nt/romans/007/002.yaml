  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: am
  text: ባለትዳር ሴት ባሏ በሕይወት እስካለ ድረስ ለባሏ በሕግ የታሰረች ናት፤ ባልየው ቢሞት[a] ግን ከባሏ ሕግ ነፃ ትሆናለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከባሏ ጋር ካስተሳሰራት ሕግ ነፃ ትሆናለች።” ግሪኩ ምናልባት ከባሏ ጋር ያስተሳሰራትን ሕጋዊ ትስስር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: ባለትዳር ሴት
  rationale: የጋብቻ ትስስር ውስጥ ያለችን ሴት በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: τῷ ζῶντι ἀνδρί
  choice: ባሏ በሕይወት ሳለ … ከእርሱ ጋር
  rationale: የባልየው በሕይወት መኖር ሕጋዊው ትስስር የሚቆይበት ጊዜ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δέδεται
  choice: የታሰረች ናት
  rationale: ፍጹም ተደራጊው ግስ ከቀደመ የማሰር ተግባር የተገኘውንና አሁንም የሚቆየውን ሁኔታ ይጠብቃል።
- source_word: νόμῳ
  choice: በሕግ
  rationale: እዚህ ላይ ያለ መስተዋድድ የቀረበውን ሕጋዊ መርሕ ወይም የጋብቻ ግዴታ ያለማወላወል ይገልጻል።
- source_word: κατήργηται
  choice: ነፃ ትሆናለች
  rationale: በዚህ የሕግ አውድ ውስጥ ግሱ የግዴታው ኃይል ከእርሷ ላይ መወገዱን ያመለክታል፤ ከቃል በቃል ‘ተሽሯል’ ይልቅ ተፈጥሯዊ ነው።
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: ከባሏ ሕግ
  rationale: የግሪኩን የተጨመቀ የባለቤትነት አገባብ ይጠብቃል፤ አገላለጹ ባልየው ሕግ ሰጪ ነው ተብሎ እንዳይገባ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: νόμῳ / τοῦ νόμου በተለይ የሙሴን ሕግ ወይስ አጠቃላይ የጋብቻ ሕጋዊ ትስስርን ያመለክታል?
  choice: አጠቃላይ የጋብቻ ሕጋዊ ትስስር
  alternative: በጋብቻ ላይ የሚሠራው የሙሴ ሕግ
  rationale: የቅርብ አውዱ ጋብቻን እንደ ምሳሌ ይጠቀማል፣ የመጀመሪያው νόμῳም ያለ መስተዋድድ መቅረቡ አጠቃላይ ሕጋዊ መርሕን ይደግፋል፤ ሆኖም ትርጉሙ ‘ሕግ’ የሚለውን ቃል በመጠበቅ የአውዱን ሥነ መለኮታዊ ውጥረት አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ባለትዳር ሴት’ ከጥንታዊ ወይም ከቃል በቃል አገላለጽ ይልቅ ተፈጥሯዊ ሲሆን፣ ‘የታሰረች’ የሕጋዊ ትስስሩን ምስል ይጠብቃል።
