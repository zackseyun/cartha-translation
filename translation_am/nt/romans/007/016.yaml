  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: am
  text: ነገር ግን የማልፈልገውን ባደርግ፣ ሕጉ መልካም እንደሆነ እስማማለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን … ከሆነ
  rationale: የεἰን ሁኔታዊ ኃይልና የδέን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὃ … τοῦτο
  choice: የማልፈልገውን
  rationale: የግሪኩን ተዛማጅ አወቃቀር ትርጉሙን ሳያጣ በተፈጥሯዊ አማርኛ ያቀርባል፤ በአማርኛው የተሳቢ ምልክት -ን የድርጊቱን ተሳቢ ግልጽ ያደርጋል።
- source_word: θέλω
  choice: እፈልጋለሁ
  rationale: በድርጊቱ ተቃራኒ የሆነውን ውስጣዊ ፍላጎት በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ποιῶ
  choice: አደርጋለሁ
  rationale: የግሪኩን ቀላል የአሁን ጊዜ ግስ ቀጥተኛ በሆነ አማርኛ ይመልሳል።
- source_word: σύμφημι
  choice: እስማማለሁ
  rationale: ተናጋሪው ሕጉ ስለሚሰጠው ፍርድ መስማማቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῷ νόμῳ
  choice: ሕጉ
  rationale: የግሪኩን የተወሰነ ስም ይጠብቃል፤ አማርኛው ከ‘እስማማለሁ’ ጋር በተፈጥሮ ሲቀርብ ‘ሕጉ መልካም እንደሆነ’ የሚለውን ይዘት የስምምነቱ ነገር ያደርጋል።
- source_word: καλός
  choice: መልካም
  rationale: የሕጉን አዎንታዊ ሥነ ምግባራዊ ባሕርይ ያለ ትርጓሜያዊ ጭማሪ በቀጥታ ይገልጣል።
theological_decisions:
- issue: ንግግሩ ስለ ሕጉ ራሱ አዎንታዊ ግምገማ መስጠቱ
  choice: “ሕጉ መልካም እንደሆነ እስማማለሁ” ተብሎ ተተርጉሟል።
  alternative: “ሕጉ ትክክል እንደሆነ አረጋግጣለሁ”
  rationale: ጳውሎስ የሕጉን መልካምነት በግልጽ የሚያምንበትን ንግግር ይጠብቃል፤ በሰውየው ፍላጎትና ድርጊት መካከል ያለውን ሥነ መለኮታዊ ውጥረትም አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ጥቅም ላይ ውሏል። “የማልፈልገውን የማደርግ ከሆነ” የሚለው አወቃቀር ተደጋጋሚ ወይም የባሕርይ ድርጊትን ሳይጨምር የግሪኩን ቀላል ሁኔታዊ ንግግር ያስተላልፋል።
