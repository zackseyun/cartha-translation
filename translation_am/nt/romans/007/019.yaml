  choice: ‘አደርጋለሁ’ እና ‘እፈጽማለሁ’ በማለት የቃል ልዩነቱ ተጠብቋል፣ ነገር ግን ትርጉማቸው እንደሚደራረብ በማስታወሻ ተገልጿል።
