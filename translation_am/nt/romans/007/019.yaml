  text: ምክንያቱም የምፈልገውን መልካም ነገር አላደርግም፤ ነገር ግን የማልፈልገውን ክፉ ነገር፣ ይህንኑ እፈጽማለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እፈጽማለሁ” የተባለው “አደርጋለሁ” ተብሎም ሊተረጎም ይችላል፤ በግሪክ ግን በቁጥሩ መጀመሪያ ከተጠቀሰው “አደርጋለሁ” (ποιῶ) የተለየ ግስ (πράσσω) ነው፣ ትርጉማቸውም በእጅጉ ይደራረባል።
