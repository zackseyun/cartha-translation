- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: በአእምሮዬ ... በሥጋዬ ግን
  rationale: የአእምሮና የሥጋ ተቃርኖን እና μὲν...δέ ያለውን አወቃቀር ያቆያል።
