base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: am
  text: በጌታችን በኢየሱስ መሲሕ[c] በኩል ለእግዚአብሔር ምስጋና ይሁን! እንግዲህ እኔ ራሴ በአእምሮዬ የእግዚአብሔርን ሕግ አገለግላለሁ፤ በሥጋዬ[a] ግን የኃጢአትን ሕግ[b] አገለግላለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በሥጋዬ” ወይም “በኃጢአተኛ ባሕርዬ።”
    reason: lexical_alternative
  - marker: b
    text: “የኃጢአትን ሕግ” ወይም “የኃጢአትን መርሕ።”
    reason: alternative_reading
  - marker: c
    text: ግሪኩ፦ “በኢየሱስ ክርስቶስ በጌታችን በኩል፤” “መሲሕ” የሚለው Χριστόςን እዚህ እንደ ማዕረግ ያሳያል።
    reason: lexical_alternative
