  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: am
  text: ነገር ግን በሰውነቴ ክፍሎች ውስጥ ሌላ ሕግ[a]፣ የአእምሮዬን ሕግ የሚዋጋና በሰውነቴ ክፍሎች ውስጥ ባለው የኃጢአት ሕግ ሥር[b] ምርኮኛ የሚያደርገኝ አያለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሕግ” የሚለው ቃል በዚህ ቁጥር በተደጋጋሚ በተጠቀመባቸው ስፍራዎች “መርሕ” ወይም “ኃይል” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በኃጢአት ሕግ”፤ “በኃጢአት ሕግ ሥር” የሚለው አተረጓጎም ተናጋሪው በዚያ ሕግ ኃይል ሥር ምርኮኛ መሆኑን ያሳያል።
    reason: lexical_alternative
