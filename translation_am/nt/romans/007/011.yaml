  rationale: በግሪኩ ኃጢአት የሦስቱም ድርጊቶች ሰዋሰዋዊ ባለቤት ነው። ትርጉሙ ይህን ሥነ ንግግራዊና ሥነ መለኮታዊ ውጥረት ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
