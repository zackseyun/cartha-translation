  rationale: የማታለልን ቀጥተኛ ትርጉምና የመጀመሪያ መደብ ተሳቢውን በአጭርና ግልጽ አማርኛ ያቀርባል።
- source_word: δι’ αὐτῆς
  choice: በእርሱም
  rationale: ተውላጠ ስሙ ወደ ‘ትእዛዙ’ እንዲመለስ በማድረግ የመሣሪያነቱን ትርጉም ይጠብቃል።
- source_word: ἀπέκτεινεν
  choice: ገደለኝ
  rationale: የግሪኩን ጠንካራና ቀጥተኛ የሞት አገላለጽ ያለ ትርጓሜያዊ ማስፋፊያ ያስተላልፋል።
