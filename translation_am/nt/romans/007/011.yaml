- source_word: διὰ τῆς ἐντολῆς
  choice: በትእዛዙ
  rationale: ትእዛዙ መሣሪያ ወይም መንገድ ሆኖ መቅረቡን እና ነጠላ መሆኑን ይጠብቃል።
- source_word: ἐξηπάτησέν με
