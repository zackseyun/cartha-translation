base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: am
  text: ታዲያ ምን እንላለን? ሕጉ ኃጢአት ነውን? ፈጽሞ አይደለም! ነገር ግን በሕግ ባይሆን ኖሮ ኃጢአትን ባላወቅሁም ነበር። ምክንያቱም ሕጉ፣ “አትመኝ” ባላለ ኖሮ፣ መመኘትን[a] ባላወቅሁም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መመኘትን” የሚለው የግሪክ ቃል (ἐπιθυμία) “ምኞትን” ተብሎም ሊተረጎም ይችላል፤ ነገር ግን ወዲያው የተጠቀሰው ትእዛዝ እዚህ የተለየውን የመመኘት ትርጉም ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: ታዲያ ምን እንላለን?
  rationale: የጳውሎስን የክርክር ሽግግር ጥያቄ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὁ νόμος
