  rationale: በዐውዱ የሙሴን ሕግ የሚያመለክተውን የተወሰነ ቅርጽ ይጠብቃል።
- source_word: ἁμαρτία
  choice: ኃጢአት
  rationale: ቀጥተኛና የተለመደ ሥነ መለኮታዊ አቻ ቃል ነው።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይደለም!
  rationale: ጥያቄውን በኃይል የሚክደውን የጳውሎስ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: ነገር ግን ኃጢአትን ያወቅሁት በሕጉ ነው
  rationale: εἰ μὴ የሚያሳየውን ብቸኛ መንገድ—ኃጢአት በሕግ በኩል መታወቁን—በግልጽ አማርኛ ይገልጻል፤ ἀλλὰ የሚያመጣውም ተቃራኒ ሽግግር በ“ነገር ግን” ተጠብቋል።
