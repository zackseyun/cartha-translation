source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: am
  text: ወይስ አታውቁም፣ ወንድሞችና እህቶች[a]—ሕግን ለሚያውቁ ነውና የምናገረው—ሕግ ሰው በሕይወት እስካለ ድረስ እንደሚገዛው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞችና እህቶች” የግሪኩን ተባዕታይ ብዙ ቁጥር ἀδελφοί ይተረጉማል፤ በዚህ አውድ ቃሉ በአድማጮቹ መካከል ያሉትን ሴቶችም ያካትታል።
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: ወይስ
  rationale: የጳውሎስን ከቀደመው ክርክር ጋር የሚያያዝ አማራጭ የጥያቄ መሸጋገሪያ ይጠብቃል።
- source_word: ἀγνοεῖτε
  choice: አታውቁም
  rationale: የጋራ እውቀታቸውን የሚያስታውስ አጽንኦታዊ ጥያቄን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀδελφοί
  choice: ወንድሞችና እህቶች
  rationale: ቃሉ በቅርጹ ተባዕታይ ብዙ ቁጥር ቢሆንም፣ በዚህ የተደባለቀ ማኅበር አድማጮችን የሚያካትት የዝምድና አድራሻ ነው፤ ግልጽነቱም በማስታወሻ ተጠብቋል።
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: ሕግን ለሚያውቁ ነውና የምናገረው
  rationale: የγάρን ማብራሪያዊ ኃይልና የγινώσκουσινን ተሳቢ ሐሳብ በግልጽና ተፈጥሯዊ አማርኛ ይይዛል።
- source_word: νόμον / ὁ νόμος
  choice: ሕግ / ሕግ
  rationale: የግሪኩን ስፋት ሳያጠብ በተመሳሳይ ቃል ይተረጉማል፤ የሙሴ ሕግን ወይም ሕግን በአጠቃላይ በትርጉሙ ውስጥ አይወስንም።
- source_word: κυριεύει
  choice: ሥልጣን አለው
  rationale: የመግዛትንና የበላይነትን ፍቺ በዘመናዊና ክቡር አማርኛ ያስተላልፋል።
- source_word: τοῦ ἀνθρώπου
  choice: ሰው / በእርሱ ላይ
  rationale: ἄνθρωπος እዚህ ወንድን ብቻ ሳይሆን ማንኛውንም ሰው የሚወክል ነጠላ ነው።
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: በሕይወት እስካለ ድረስ
  rationale: የጊዜውን ገደብ በተፈጥሯዊ የአማርኛ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የνόμος ወሰን
  choice: “ሕግ” ተብሎ ሳይጠበብ ተተርጉሟል።
  alternative: “የሙሴ ሕግ” ወይም “ሕጋዊ መርሕ”
  rationale: አውዱ ወደ ሙሴ ሕግ ቢያመለክትም፣ የግሪኩ አገላለጽ ሰፊ ነው፤ ትርጉሙ ይህን የትርጓሜ ውጥረት አይዘጋውም።
- issue: የκυριεύει የሥልጣን ምስል
  choice: “በእርሱ ላይ ሥልጣን አለው”
  alternative: “ይገዛዋል”
  rationale: ሁለቱም የግሪኩን የበላይነት ሐሳብ ሊያስተላልፉ ይችላሉ፤ ዋናው ንባብ የሕጉን ሕጋዊ ሥልጣን በግልጽ ያሳያል።
