  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: am
  text: አሁን ግን ይዞን ለነበረው ነገር ሞተን፣ ከሕጉ ነፃ ወጥተናል፤ ስለዚህ በተጻፈው ሕግ አሮጌ አኳኋን ሳይሆን በመንፈስ አዲስነት እናገለግላለን።[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ይዞን ለነበረው ነገር»፣ ወይም «በእርሱ የታሰርንበት ነገር»።
    reason: lexical_alternative
  - marker: b
    text: «በመንፈስ አዲስነት» የሚለው «በመንፈስ አዲስ አኳኋን» ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
  - marker: c
    text: «በተጻፈው ሕግ አሮጌ አኳኋን» የሚለው በቃል በቃል «በፊደል አሮጌነት» ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: ከሕጉ ነፃ ወጥተናል
  rationale: የተገብሮ ግሱ ሕጉ መኖሩን እንዳቆመ ሳይሆን፣ እኛ ከሕጉ አስገዳጅ ግንኙነት ነፃ እንደወጣን ያሳያል።
- source_word: ἀποθανόντες
  choice: ስለሞትን
  rationale: የሞቱት አማኞች እንጂ ሕጉ አለመሆኑን ግልጽ ያደርጋል፤ የግሪኩን ቅድመ ሁኔታም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν ᾧ κατειχόμεθα
  choice: ይዞን ለነበረው ነገር
  rationale: κατέχω የሚያሳየውን አጥብቆ የመያዝ ወይም የማሰር ሐሳብ በቀላልና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: δουλεύειν
  choice: እናገለግላለን
  rationale: ግሱ የባርነት ጥላ ትርጉም ቢኖረውም፣ እዚህ የአገልግሎትን አዲስ ሁኔታ ያነጻጽራል፤ «እናገለግላለን» በአማርኛ ተፈጥሯዊ ነው።
- source_word: καινότητι πνεύματος
  choice: በመንፈስ አዲስነት
  rationale: καινότης የሚለውን ረቂቅ ስም እና ከπαλαιότης ጋር ያለውን ስነ ንግግራዊ ንጽጽር ይጠብቃል።
- source_word: παλαιότητι γράμματος
  choice: በፊደል አሮጌነት
  rationale: የግሪኩን «ፊደል» የሚል ምሳሌያዊ አገላለጽና ከ«አዲስነት» ጋር ያለውን ትይዩነት ይጠብቃል።
theological_decisions:
- issue: የሞተው ሕጉ ነው ወይስ አማኞች?
  choice: የሞትነው እኛ ነን፤ «ይዞን ለነበረው ነገር ስለሞትን»
  alternative: ሕጉ በእኛ ላይ ሞተ
  rationale: ἀποθανόντες ባለብዙ ቁጥር የሆነ የስም ቦታ ተሳቢ ሲሆን፣ የተሰወረውን «እኛ» የሚለውን ባለቤት ይመለከታል።
- issue: πνεύματος መንፈስ ቅዱስን ወይስ የሰውን መንፈስ ያመለክታል?
  choice: «መንፈስ»—በዐውዱ መንፈስ ቅዱስ እንደሆነ የተወሰደ
  alternative: የሰው መንፈስ ወይም መንፈሳዊ አኳኋን
  rationale: የጳውሎስ «መንፈስ/ፊደል» ንጽጽርና የአዲስ ኪዳን ዐውድ መንፈስ ቅዱስን ያመለክታሉ፤ የግሪኩ አሻሚነት ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «አዲስነት/አሮጌነት» የሚለው ትይዩ አገላለጽ የግሪኩን ስነ ንግግራዊ አወቃቀር ለመጠበቅ ተመርጧል።
