  rationale: νόμος በሮሜ መልእክት ያለውን የተለመደ የጳውሎስ አጠቃቀምና ሥነ መለኮታዊ ክብደት ለመጠበቅ “ሕግ” ተብሎ ተተርጉሟል።
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: በውስጣዊው ሰውነቴ
  rationale: κατά እዚህ ውስጣዊ አንጻርን ወይም የተመለከተውን ስፍራ ያሳያል፤ አገላለጹም የጳውሎስን “ውስጣዊ ሰው” ዘይቤ በተፈጥሯዊ አማርኛ ያቀርባል። በግሪኩ “የእኔ” በግልጽ ባይኖርም፣ የአንደኛ መደብ ግሡ በአማርኛ የባለቤትነት ቅጥያውን ተፈጥሯዊ ያደርገዋል።
