source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: am
  text: ስለዚህ፣ ወንድሞቼ[a]፣ እናንተም በመሲሑ[b] ሰውነት አማካኝነት ለሕጉ ተገድላችኋል፤ ይህም የሌላው እንድትሆኑ[c]፣ ማለትም ከሙታን የተነሣው የሆነው እንድትሆኑ፣ እኛም ለእግዚአብሔር ፍሬ እንድናፈራ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞቼ” የሚለው የግሪክኛ ቃል ወንዶችንና ሴቶችን በአንድነት ለማነጋገር ሊያገለግል ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ “ክሪስቶስ”፤ ትርጉሙ “መሲሕ” ነው። “ክርስቶስ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “የሌላው እንድትሆኑ”፤ ይህ አነጋገር በቀደሙት ቁጥሮች ያለውን የጋብቻ ምሳሌ ይቀጥላል።
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው የጋብቻ ምሳሌ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀδελφοί μου
  choice: ወንድሞቼ
  rationale: የግሪክኛውን ወንድ ጾታ ብዙ ቁጥር አጠራር ይጠብቃል፤ ድብልቅ ማኅበረሰብን ሊያካትት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: ἐθανατώθητε
  choice: ተገድላችኋል
  rationale: የግሪክኛውን ተደራጊ አንቀጽ ይጠብቃል፤ አማኞች በሕጉ ዘንድ በራሳቸው እንደሞቱ ሳይሆን ድርጊት እንደተፈጸመባቸው ያሳያል።
- source_word: τῷ νόμῳ
  choice: ለሕጉ
  rationale: ከሞት ምስሉ ጋር የተያያዘውን የግሪክኛ ዳቲቭ በቅርብ ይከተላል፤ “ከሕጉ” ብሎ በትርጓሜ አይፈታውም።
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: በመሲሑ ሥጋ አማካይነት
  rationale: διά ከጄኒቲቭ ጋር ያለውን የመሣሪያነት ወይም የአማካይነት ሐሳብ ያሳያል፤ የመሲሑን ሥጋዊ ሞት ያመለክታል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: ቃሉ እዚህ እንደ ማዕረግ ስለሚሠራ፣ “የተቀባው” የሚለውን መሠረታዊ ትርጉም የሚያስተላልፈው “መሲሕ” ተመርጧል።
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: የሌላው እንድትሆኑ
  rationale: የዓላማ አንቀጹንና ከቀደመው የጋብቻ ምሳሌ ጋር ያለውን የባለቤትነት ግንኙነት ይጠብቃል።
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: ከሙታን የተነሣው የእርሱ
  rationale: አንቀጹ የሚያመለክተው ከሙታን የተነሣውን መሲሕ መሆኑን ያብራራል፣ የተደራጊውንም ቅርጽ ይጠብቃል።
- source_word: ἵνα καρποφορήσωμεν
  choice: እኛም … ፍሬ እንድናፈራ
  rationale: የዓላማውን ኃይልና የፍሬውን ዘይቤ ይጠብቃል፤ ከ“እናንተ” ወደ “እኛ” የሚደረገውን የሰው መለወጥም አያስወግድም።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ፍሬው ለእግዚአብሔር እንደሚፈራ በተፈጥሯዊ አማርኛ ያሳያል።
