  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: am
  text: ነገር ግን ኃጢአት በትእዛዙ አጋጣሚ[a] አግኝታ በእኔ ውስጥ ልዩ ልዩ ምኞትን[b] ሁሉ አመጣች፤ ሕግ ከሌለ ግን ኃጢአት ሙት ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መነሻ አግኝታ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «መመኘትን ሁሉ»፤ በዚህ አውድ ግን ቃሉ በተለይ የሌላውን ነገር መመኘትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: አጋጣሚውን
  rationale: ቃሉ ኃጢአት ትእዛዙን እንደ መነሻ ተጠቅሞ ያገኘውን ዕድል ያመለክታል፤ «አጋጣሚ» ይህን ምስላዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λαβοῦσα
  choice: ተጠቅሞ
  rationale: ከἀφορμήν ጋር ተያይዞ ኃጢአት አጋጣሚውን በንቃት መጠቀሙን ያሳያል፤ የአማርኛው አገላለጽ የድርጊቱን ኃይል ይጠብቃል።
- source_word: ἡ ἁμαρτία
  choice: ኃጢአት
  rationale: ጳውሎስ ኃጢአትን እንደሚሠራ ኃይል ሰውኛ አድርጎ ያቀርበዋል፤ ቀጥተኛው ትርጉም ይህን ሰውኛ አቀራረብ ይጠብቃል።
- source_word: διὰ τῆς ἐντολῆς
  choice: በትእዛዙ
  rationale: ነጠላው ቅርጽ በቀደመው አውድ የተጠቀሰውን የአትመኝ ትእዛዝ ያመለክታል፤ «በ» ኃጢአት ትእዛዙን መጠቀሚያ ማድረጉን ያስተላልፋል።
- source_word: κατειργάσατο
  choice: ፈጠረ
  rationale: ግሱ አንድን ውጤት ማስገኘትን ወይም ማምጣትን ያመለክታል፤ «ፈጠረ» ግልጽና ጠንካራ አገላለጽ ነው።
- source_word: πᾶσαν ἐπιθυμίαν
  choice: ልዩ ልዩ መመኘትን ሁሉ
  rationale: πᾶσαν የዓይነት ብዛትን የሚያሳይ ሲሆን፣ በቅርብ አውዱ ἐπιθυμία የሌላውን ነገር መመኘትን ያመለክታል። አገላለጹ ሁለቱንም ገጽታዎች ይጠብቃል።
- source_word: χωρὶς γὰρ νόμου
  choice: ሕግ በሌለበት ... ነውና
  rationale: χωρίς ከሕግ ተለይቶ ወይም ሕግ በሌለበት የሚለውን ሁኔታ ያሳያል፤ γάρ የምክንያት ማብራሪያ መሆኑ «ነውና» በሚለው ተጠብቋል።
- source_word: νεκρά
  choice: የሞተ
  rationale: የግሪኩን ጠንካራ ምሳሌያዊ ቃል ሳይተረጉም ይጠብቃል፤ «የማይሠራ» በማለት ትርጉሙን አያጠብም።
theological_decisions:
- issue: ኃጢአትን ሰውኛ አድርጎ ማቅረብና «የሞተ» የሚለውን ምሳሌያዊ ቋንቋ መጠበቅ
  choice: ኃጢአት አጋጣሚውን ተጠቅሞ እንደሠራ ማቅረብና νεκράን «የሞተ» ብሎ መተርጎም
  alternative: ኃጢአትን እንደ ረቂቅ ጽንሰ ሐሳብ ማቅረብ ወይም «የማይሠራ» ብሎ መተርጎም
  rationale: የግሪኩ ጽሑፍ ኃጢአትን የሚሠራ ኃይል አድርጎ ያቀርባል፤ «የሞተ» የሚለውም ሆን ተብሎ የተመረጠ ጠንካራ ምሳሌ ነው። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ትእዛዙ» ነጠላውን ቅርጽ ይጠብቃል፤ «ኃጢአት ... ፈጠረ» የሚለውም የምንጩን ሰውኛ አቀራረብ ሳያለዝብ ያቀርባል። የግሪኩን ቃላት በትክክል ለማጣመር የማስታወሻ ምልክቶቹ በ«አጋጣሚው»ና በ«መመኘትን» ላይ ተቀምጠዋል።
