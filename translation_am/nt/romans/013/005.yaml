  to: ስለዚህ፣ በቁጣ ምክንያት ብቻ ሳይሆን፣ በሕሊናም ምክንያት መገዛት[a] የግድ ነው።
  rationale: The wording is revised solely for clear Amharic scope and to preserve the source’s unstated referent for ‘wrath.’ The lexical-alternative footnote remains anchored to ‘መገዛት.’ The alternative-reading footnote should be anchored to ‘ቁጣ’ in production; its content is retained unchanged in substance.
