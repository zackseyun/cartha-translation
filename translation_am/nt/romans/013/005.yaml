lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: ἀνάγκη
  choice: የግድ ነው
  rationale: ግሪኩ የሚገልጸውን አስፈላጊነት አጭርና ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
- source_word: ὑποτάσσεσθαι
  choice: መገዛት
  rationale: በዐውዱ ውስጥ ለባለሥልጣናት ተገዢ የመሆንን አቋም ይገልጻል፤ ከጽሑፉ በላይ ፍጹም ታዛዥነትን አያስገባም።
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: ብቻ ሳይሆን፣ … ም
  rationale: የግሪኩን ተዛማጅ ንጽጽር በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: διὰ τὴν ὀργὴν
  choice: በቁጣው ምክንያት
  rationale: διά ከተሳቢ ቅጽ ጋር የሚገልጸውን ምክንያት ይጠብቃል፤ ὀργήንም ‘ቅጣት’ ብሎ ሳይተረጉም የቃሉን ዋና ትርጉምና አሻሚነት ይጠብቃል።
- source_word: διὰ τὴν συνείδησιν
  choice: በሕሊናም ምክንያት
  rationale: ሕሊናን ለመገዛት ውስጣዊ ምክንያት አድርጎ በቀጥታና በሚገባ ያቀርባል።
theological_decisions:
- issue: የὀργή (‘ቁጣ’) ባለቤት ማንነት
  choice: ‘ቁጣው’ ተብሎ ባለቤቱ ሳይወሰን ቀርቧል።
  alternative: ‘የእግዚአብሔር ቁጣ’ ወይም ‘የባለሥልጣኑ ቅጣት’
  rationale: የቅርብ ዐውዱ የእግዚአብሔርን ሥርዓትና ሰይፍ የያዘውን ባለሥልጣን ሁለቱንም ይጠቅሳል፤ ግሪኩ እዚህ የቁጣውን ባለቤት በግልጽ ስለማይለይ ትርጉሙ ይህን አሻሚነት ጠብቋል።
- issue: ὑποτάσσεσθαι ለመንግሥታዊ ሥልጣን የሚያመለክተው አቋም
  choice: መገዛት
  alternative: ተገዢ መሆን
  rationale: ቃሉ የሚጠይቀውን ተገዢ አቋም በግልጽ ያሳያል፤ ጽሑፉ ያልተናገረውን ወሰን የሌለው ታዛዥነት ግን አያክልም።
