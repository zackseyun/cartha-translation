  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘የግድ ነው’ የግሪኩን ግዴታ በተፈጥሯዊ አነጋገር ያቀርባል፤ ‘ቁጣው’ ደግሞ የምንጩን ሥነ መለኮታዊ አሻሚነት ይጠብቃል።
