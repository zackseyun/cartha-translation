base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: am
  text: ስለዚህ ሥልጣኑን የሚቃወም የእግዚአብሔርን ሥርዓት[a] ተቃውሟል፤ የተቃወሙትም በራሳቸው ላይ ፍርድን[b] ይቀበላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሥርዓት” የሚለው “እግዚአብሔር የደነገገው አደረጃጀት” ወይም “ትእዛዝ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ፍርድ” የሚለው “ኩነኔ” ወይም “የፍርድ ውሳኔ” ተብሎም ሊተረጎም ይችላል፤ እዚህ ያለው የግሪክ ቃል ግን የመጨረሻ ኩነኔ የሚለውን ጠንካራ ትርጉም የግድ አያመለክትም።
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር የሚወጣውን ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὁ ἀντιτασσόμενος
  choice: የሚቃወም
  rationale: በተለምዶ ይህን የሚያደርግን ሰው የሚያመለክተውን የአሁን ጊዜ ተሳቢ አገባብ ይጠብቃል።
- source_word: τῇ ἐξουσίᾳ
  choice: ሥልጣኑን
  rationale: ነጠላና የታወቀ መሆኑን ይጠብቃል፤ የመንግሥታዊ ሥልጣን ማጣቀሻው ከሮሜ 13፥1 አውድ ይገኛል።
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: የእግዚአብሔርን ሥርዓት
  rationale: διαταγή የሚያመለክተውን በእግዚአብሔር የተደነገገ አደረጃጀት ወይም ሥርዓት ያስተላልፋል።
- source_word: ἀνθέστηκεν
  choice: ተቃውሟል
  rationale: የተፈጸመና አሁንም ውጤት ያለውን የግሪኩን ፍጹም ጊዜ በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: የተቃወሙትም
  rationale: ቀድሞ ተቃውሞ የቆሙትን ሰዎች በአጭርና ተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἑαυτοῖς
  choice: በራሳቸው ላይ
  rationale: የድርጊቱ ውጤት ወደ ተቃዋሚዎቹ ራሳቸው እንደሚመለስ ግልጽ ያደርጋል።
- source_word: κρίμα
  choice: ፍርድ
  rationale: የመጨረሻ ዘላለማዊ ኩነኔን ሳያስገድድ κρίμα ያለውን ሰፊ የፍርድ ትርጉም ይጠብቃል።
- source_word: λήμψονται
  choice: ይቀበላሉ
  rationale: የወደፊቱን ውጤት ሳይጨምር ቀጥተኛውን ‘ይቀበላሉ’ የሚለውን ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: የκρίμα ወሰን
  choice: ፍርድ
  alternative: ኩነኔ
  rationale: ጥቅሱ የሚመጣባቸውን ፍርድ ያስጠነቅቃል፤ ነገር ግን ይህን በግልጽ እንደ ዘላለማዊ ኩነኔ አይወስነውም።
- issue: የἐξουσία ማጣቀሻ
  choice: በአውዱ ያለው የመግዛት ሥልጣን
  alternative: በአጠቃላይ ማንኛውም ዓይነት ሥልጣን
  rationale: ሮሜ 13፥1 ያለው ቅርብ አውድ የሚገዙ ባለሥልጣናትን ይመለከታል፤ ዋናው ጽሑፍ ግን የግሪኩን ነጠላና አጭር አገላለጽ በመከተል ‘ሥልጣኑን’ ይላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሴሚኮሎኑ በጥቅሱ ሁለት ክፍሎች መካከል ያለውን ቅርብ የምክንያትና ውጤት ግንኙነት ይጠብቃል።
