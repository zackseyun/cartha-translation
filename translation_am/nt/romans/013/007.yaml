id: ROM.13.7
reference: Romans 13:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: am
  text: ለሁሉም የሚገባቸውን ስጡ፤ ግብር ለሚገባው ግብርን፣ ቀረጥ ለሚገባው ቀረጥን፣ ፍርሃት ለሚገባው ፍርሃትን፣ ክብር ለሚገባው ክብርን ስጡ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: ስጡ
  rationale: The imperative means to give or render what is due. ስጡ is natural modern Amharic and, with የሚገባቸውን, communicates rendering an obligation rather than making a voluntary gift.
- source_word: τὰς ὀφειλάς
  choice: የሚገባቸውን
  rationale: This expresses the plural dues or obligations owed to the respective recipients without awkwardly suggesting only monetary debt.
- source_word: φόρον
  choice: ግብር
  rationale: φόρος denotes a tax or tribute, especially a direct levy; ግብር is the standard, accessible Amharic equivalent.
- source_word: τέλος
  choice: ቀረጥ
  rationale: τέλος here distinguishes a toll, customs charge, or other revenue duty from φόρος; ቀረጥ preserves that fiscal distinction.
- source_word: φόβον
  choice: ፍርሃት
  rationale: This retains the source text's literal and theologically open sense of fear rather than reducing it to respect.
- source_word: τιμήν
  choice: ክብር
  rationale: ክብር naturally conveys honor or esteem and remains distinct from ፍርሃት.
theological_decisions:
- issue: Whether φόβος should be softened to respect or reverence
  choice: ፍርሃት
  alternative: አክብሮት
  rationale: The Greek explicitly says φόβος, and the immediate context does not require the translator to resolve it into the milder idea of respect. The literal term preserves the passage's tension while the following τιμή carries the distinct idea of honor.
translation_notes:
  register: Modern standard Amharic in Ge'ez script, using dignified but ordinary vocabulary. The source's emphatic repetition is retained, with a final ስጡ supplied to make the governed list clear and natural in Amharic.
