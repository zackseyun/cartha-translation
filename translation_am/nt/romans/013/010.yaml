  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: am
  text: ፍቅር ባልንጀራን አይጎዳም[a]፤ ስለዚህ ፍቅር የሕግ ፍጻሜ ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍቅር በባልንጀራ ላይ ክፉ ነገር አያደርግም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ፍቅር የሕግ ሙላት ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊና የተለመደ አቻ ሲሆን፣ በቁጥሩ ውስጥ ቃሉ ሁለት ጊዜ መደገሙንም ይጠብቃል።
- source_word: τῷ πλησίον
  choice: ባልንጀራን
  rationale: እዚህ ቃሉ በአጠቃላይ የቅርብ ሰውን ወይም ጎረቤትን የሚያመለክት ሲሆን፣ የግሪኩ ዳቲቭ በአማርኛ እንደ ድርጊቱ ተጽእኖ ተቀባይ በቀጥተኛ ተሳቢ ተገልጿል።
- source_word: κακὸν οὐκ ἐργάζεται
  choice: አይጎዳም
  rationale: በዚህ የሥነ ምግባር አውድ ‘ክፉ ነገር አያደርግም’ የሚለውን ሐሳብ በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል፤ ይበልጥ ቃል በቃል የሆነው አማራጭ በማስታወሻ ቀርቧል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚወጣውን ድምዳሜ በግልጽ ያመለክታል።
- source_word: πλήρωμα
  choice: ፍጻሜ
  rationale: ሕጉን ወደታሰበለት ሙላት ወይም ፍጹምነት የሚያደርስ ነገር የሚለውን ሐሳብ ይይዛል፤ ‘ሙላት’ የሚለው የቅርብ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: νόμου
  choice: የሕግ
  rationale: በአውዱ የታወቀውን ሕግ ያመለክታል፤ የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ፍቅር ከሕግ ጋር ያለው ግንኙነት
  choice: ፍቅር የሕግ ፍጻሜ ነው
  alternative: ፍቅር የሕግ ሙላት ነው፤ ወይም፣ ፍቅር ሕግን ይፈጽማል
  rationale: ግሪኩ ስማዊ ዓረፍተ ነገር ነው፤ ግልጽ ግሳዊ አነጋገር አይደለም። ይህ ትርጉም አገባቡንና የጳውሎስን አስተምህሮ ይጠብቃል፣ ፍቅር እያንዳንዱን ትእዛዝ በምን መንገድ እንደሚፈጽምም ከአውዱ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ባልንጀራ’ የሚለው ቃል እዚህ በፆታ ያልተገደበ አጠቃላይ ሰውን ያመለክታል።
