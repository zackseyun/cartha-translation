base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: am
  text: ሰው ሁሉ ለበላይ ሥልጣናት[a] ይገዛ፤ ከእግዚአብሔር በቀር ሥልጣን የለምና፤ ያሉትም ሥልጣናት በእግዚአብሔር ተሹመዋል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከፍ ላሉ ሥልጣናት” ወይም “የበላይ ሥልጣናት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእግዚአብሔር ተቋቁመዋል” ወይም “በእግዚአብሔር ተደርድረዋል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: ሰው ሁሉ
  rationale: ቃል በቃል ‘ነፍስ ሁሉ’ ቢሆንም፣ በኮይኔ ግሪክ እያንዳንዱን ሰው የሚያመለክት ፈሊጣዊ አገላለጽ ነው። ‘ሰው ሁሉ’ ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: ለበላይ አስተዳዳሪዎች
  rationale: ἐξουσίαις ሥልጣን የሚያካሂዱትን ባለሥልጣናት፣ ὑπερεχούσαις ደግሞ በበላይነት የሚገዙትን ያመለክታል። ሐረጉ ሲቪላዊውን አውድ ግልጽ ያደርጋል።
- source_word: ὑποτασσέσθω
  choice: ይገዛ
  rationale: የአሁን ጊዜ ትእዛዛዊው ቅርጽ በሥርዓት ሥር መሆንን ያመለክታል፤ ‘ይገዛ’ በአማርኛ ተፈጥሯዊና የተከበረ አገላለጽ ነው።
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: ከእግዚአብሔር ያልሆነ ሥልጣን የለምና
  rationale: ὑπὸ θεοῦ እዚህ የሥልጣንን ምንጭ ወይም አድራጊ ያሳያል። ‘ከእግዚአብሔር’ አሻሚነቱን ሳያጠፋ በአማርኛ ተፈጥሯዊ ነው።
- source_word: αἱ δὲ οὖσαι
  choice: ያሉትም ሥልጣናት
  rationale: ሴት ጾታ ብዙ ቁጥር ያለው አሳታፊ ቅርጽ ወደ ἐξουσίαις ይመለሳል፤ በአማርኛ ስሙን መድገም ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: τεταγμέναι
  choice: ተሠርተው ተደርድረዋል
  rationale: የτάσσω ፍጹም ተገብሮ ቅርጽ ከመደርደር፣ ከመሾም ወይም ከመወሰን የተገኘን የቀጠለ ሁኔታ ያሳያል። ይህ ምርጫ መለኮታዊ ሥርዓትን ያስተላልፋል።
theological_decisions:
- issue: የሲቪል ሥልጣን ከእግዚአብሔር ጋር ስላለው ግንኙነት የጳውሎስ ንግግር ወሰንና ኃይል
  choice: ገዢ ሥልጣናት ሥልጣናቸውን ከእግዚአብሔር እንደሚያገኙና ያሉትም በእርሱ ሥርዓት ውስጥ እንደተቀመጡ መተርጎም።
  alternative: እያንዳንዱ መንግሥትና እያንዳንዱ የገዢ ድርጊት በእግዚአብሔር ሙሉ የሥነ ምግባር ይሁንታ እንዳለው ማስፋት፣ ወይም ጥቅሱ ስለ ረቂቅ የሥልጣን መርሕ ብቻ እንደሚናገር ማዳከም።
  rationale: ግሪኩ ስላሉ ተጨባጭ ሥልጣናት ይናገራል፤ ነገር ግን የገዢዎችን ድርጊት ሁሉ በሥነ ምግባር እንደሚያጸድቅ አይናገርም። ትርጉሙ ይህን ውጥረት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሰው ሁሉ’ ፈሊጣዊውን የግሪክ አገላለጽ ያቀርባል፤ የአማራጭ ቃላትና የτάσσω ክልል በማስታወሻዎች ተጠብቀዋል።
