source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: am
  text: ገዥዎች መልካም ሥራ ለሚሠራ ሳይሆን ክፉ ሥራ ለሚሠራ የሚያስፈሩ ናቸውና።[a] ሥልጣኑን ላለመፍራት ትፈልጋለህ? መልካም ነገር አድርግ፤ ከእርሱም ምስጋናን ታገኛለህ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ገዥዎች ለመልካም ሥራ ሳይሆን ለክፉው የፍርሃት ምክንያት ናቸው።” ግሪኩ መልካሙንና ክፉውን በአጠቃላይ ሥነ ምግባራዊ ትርጉም ያነጻጽራል።
    reason: lexical_alternative
  - marker: b
    text: “ከእርሱ” ማለት ከሥልጣኑ ማለት ነው።
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: ገዥዎች
  rationale: በመንግሥታዊ አውድ ውስጥ የሚገዙትን ወይም የአስተዳደር ሥልጣን የያዙትን በቀጥታ ይገልጻል።
- source_word: φόβος
  choice: የሚያስፈሩ
  rationale: የግሪኩን ‘የፍርሃት ምክንያት/ነገር’ ትርጉም በተፈጥሯዊ አማርኛ ግሳዊ አገላለጽ ያስተላልፋል።
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: መልካም ሥራ ለሚሠራ … ክፉ ሥራ ለሚሠራ
  rationale: አንዱን ተውሳከ ስም በሌላው ውስጥ ያለውን ἔργῳ በመሙላት ንጽጽሩን ግልጽና ተፈጥሯዊ ያደርጋል።
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: ላለመፍራት ትፈልጋለህ?
  rationale: የግሪኩን ቀጥተኛ የአጻጻፍ ጥያቄ ይጠብቃል፤ ወደ ሁኔታዊ አረፍተ ነገር አይለውጠውም።
- source_word: ἐξουσίαν
  choice: ባለሥልጣኑን
  rationale: በዚህ አውድ ἐξουσία ሥልጣኑን የሚወክለውን ገዥ አካል ያመለክታል፤ ‘ባለሥልጣን’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: τὸ ἀγαθὸν ποίει
  choice: መልካም ነገር አድርግ
  rationale: መልካሙን እንደ አጠቃላይ ሥነ ምግባራዊ ምድብ ያቆያል።
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: ከእርሱም ምስጋናን ታገኛለህ
  rationale: ἔπαινοςን ‘ምስጋና’ ብሎ ያስተላልፋል፤ የአማርኛው ተውላጠ ስም ወደ ‘ባለሥልጣኑ’ በግልጽ ይመለሳል።
theological_decisions:
- issue: ስለ ገዥዎች የተነገረው ወሰን
  choice: ንግግሩን ስለ መንግሥታዊ ሥልጣን መደበኛ ተግባር እንደተነገረ በቀጥታ መተርጎም
  alternative: ሁሉም ገዥዎች ሁልጊዜ መልካሙን ያመሰግናሉ ብሎ ፍጹም ዓለም አቀፋዊ ድምዳሜ ማከል፣ ወይም ንግግሩን ያለ ጽሑፋዊ ምልክት እንደ ምጸት መተርጎም
  rationale: ጽሑፉ የሚናገረውን አያጠናክርም ወይም አያዳክምም፤ በታሪካዊ ልምድና በዓረፍተ ነገሩ መካከል ያለውን ውጥረት እንዳለ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአጻጻፍ ጥያቄ ተጠብቋል፤ ነገር ግን የግሪኩ ስማዊ አገላለጽ ለአማርኛ ተፈጥሯዊነት በግሳዊ መዋቅር ቀርቧል።
