  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: am
  text: ለጥቅምህ የእግዚአብሔር አገልጋይ ነውና። ክፉ ነገር ብታደርግ ግን ፍራ፤ ሰይፍን በከንቱ[a] አይታጠቅምና። ክፉ በሚያደርገው ሰው ላይ ቁጣ የሚያመጣ ተበቃይ፣ የእግዚአብሔር አገልጋይ[b] ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለ ዓላማ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ክፉ በሚያደርገው ሰው ላይ ቁጣን የሚፈጽም የእግዚአብሔር አገልጋይ።”
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: አገልጋይ
  rationale: የሌላውን ተልእኮ የሚፈጽም አገልጋይ ወይም ወኪል የሚለውን ሰፊ ትርጉም ያስጠብቃል፤ ቃሉንም በቤተ ክርስቲያን ሹመት ብቻ አይወስነውም።
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: ለበጎህ
  rationale: ሥልጣኑ ለተናጋሪው ተጠቃሚ በሆነ በጎ ዓላማ እንደሚያገለግል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸ κακὸν ποιῇς
  choice: ክፉ ነገር ብታደርግ
  rationale: κακόν በዚህ አውድ የሞራል ክፋትን ያመለክታል፤ አገላለጹም ግልጽና ዘመናዊ ነው።
- source_word: φοβοῦ
  choice: ፍራ
  rationale: የግሪኩን ቀጥተኛ የትእዛዝ አኳኋን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰκῇ
  choice: በከንቱ
  rationale: ‘ያለ ምክንያት ወይም ዓላማ’ የሚለውን ፍቺ የሚይዝ የተለመደ አገላለጽ ነው።
- source_word: τὴν μάχαιραν φορεῖ
  choice: ሰይፍን የታጠቀው
  rationale: የሰይፉን ተጨባጭ ምስልና የቅጣት ሥልጣን ምልክትነት ያስጠብቃል፤ φορέω የሚያመለክተውንም ልማዳዊ መሸከም በአማርኛ ‘መታጠቅ’ ይገልጣል።
- source_word: ἔκδικος
  choice: ተበቃይ
  rationale: ፍትሐዊ ብድራትን ወይም ቅጣትን የሚፈጽም ወኪል የሚለውን የግሪኩን ኃይል ያስጠብቃል።
- source_word: εἰς ὀργὴν
  choice: ቁጣን የሚያደርስ
  rationale: የቁጣውን የቅጣት ውጤት በተፈጥሯዊ አማርኛ ያቀርባል፤ ቁጣው ‘የእግዚአብሔር’ እንደሆነ ግን በግልጽ አይጨምርም።
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: ክፉ በሚያደርገው ሰው ላይ
  rationale: የአሁን ጊዜ ተሳቢ አንቀጹን ክፉ ሥራን በተግባር የሚፈጽም ሰው በሚል ግልጽ መንገድ ይተረጉማል።
theological_decisions:
- issue: የመንግሥታዊው ሥልጣን የቅጣት ተግባርና ከመለኮታዊ ቁጣ ጋር ያለው ግንኙነት
  choice: “ቁጣን የሚያደርስ” ተብሎ ተተርጉሟል፤ ቁጣው በዋናው ጽሑፍ ‘የእግዚአብሔር’ ተብሎ አልተገለጸም።
  alternative: “የእግዚአብሔርን ቁጣ የሚያደርስ” ወይም “የሚቀጣ”
  rationale: አውዱ ሥልጣኑ የእግዚአብሔር ወኪል መሆኑን ቢያመለክትም፣ εἰς ὀργὴν በራሱ ‘የእግዚአብሔር’ አይልም። ስለዚህ የጽሑፉ አጭርነትና ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የማብራሪያ ፍሰት በ“ነውና/አይደለምና” ተጠብቋል፤ ያልተገለጸው የሥልጣን ማጣቀሻ ከአውዱ እንዲገባ ተደርጓል።
