  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: am
  text: ለዚህም ምክንያት ግብርም ትከፍላላችሁ፤ እነርሱ በዚሁ ነገር ላይ በጽናት የሚተጉ የእግዚአብሔር አገልጋዮች ናቸውና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: ግብር ትከፍላላችሁ
  rationale: φόρος በዚህ ዐውድ ለመንግሥት የሚከፈልን ቀጥተኛ ግብር ያመለክታል፤ τελεῖτε ደግሞ የመክፈልን ተግባር ይገልጣል።
- source_word: λειτουργοὶ θεοῦ
  choice: የእግዚአብሔር አገልጋዮች
  rationale: λειτουργοί የሕዝብ ወይም የሥራ አገልጋዮችን ሊያመለክት ሲችል፣ እዚህ የመንግሥት ባለሥልጣናትን ከእግዚአብሔር አገልግሎት ጋር ያያይዛል።
- source_word: εἰς αὐτὸ τοῦτο προσκαρτεροῦντες
  choice: ለዚሁ ተግተው የሚሠሩ
  rationale: προσκαρτεροῦντες በአንድ ተግባር ላይ በጽናት መቆየትንና መትጋትን ይገልጣል፤ εἰς αὐτὸ τοῦτο የሚለውም በቅርቡ የተጠቀሰውን ሕዝባዊ ኃላፊነት ያመለክታል።
- source_word: γὰρ ... γὰρ
  choice: ስለዚህም ... ናቸውና
  rationale: የሁለቱን γάρ ምክንያታዊ ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ይጠብቃል።
theological_decisions:
- issue: ባለሥልጣናት ‘የእግዚአብሔር አገልጋዮች’ መባላቸው
  choice: የእግዚአብሔር አገልጋዮች
  alternative: ለእግዚአብሔር የሚያገለግሉ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ይጠብቃል፤ ጥቅሱ ስለ ግለሰባዊ እምነታቸው ወይም ስለ ሥነ ምግባራዊ ፍጹምነታቸው የማይናገረውን አይጨምርም።
- issue: εἰς αὐτὸ τοῦτο የሚያመለክተው
  choice: ለዚሁ
  alternative: ግብር ለመሰብሰብ
  rationale: የግሪኩን ሆን ብሎ ያልተወሰነ ማጣቀሻ ይጠብቃል፤ ሐረጉን በግብር አሰባሰብ ብቻ አይገድብም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቁጥሩ ርዕሰ ጉዳይ ከቀደመው ዐውድ የሚታወቅ ቢሆንም፣ በአማርኛ ግልጽነት ሲባል ‘ሥልጣን ያላቸው’ ተጨምሯል።
