base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: am
  text: ከእርስ በርሳችሁ መዋደድ በስተቀር፣ ለማንም ምንም ዕዳ አይኑርባችሁ፤ ሌላውን[a] የሚወድ ሰው ሕጉን ፈጽሟልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሌላ ሰውን።” ግሪክኛ፦ “ሌላውን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: ለማንም ምንም ዕዳ አይኑርባችሁ
  rationale: የሁለቱን አሉታዊ ቃላት ሙሉ አድማስ (‘ለማንም፣ ምንም’) ይጠብቃል፤ ὀφείλετε የዕዳንም ሆነ የግዴታን ሐሳብ ስለሚይዝ ‘ዕዳ አይኑርባችሁ’ ተፈጥሯዊና ቅርብ ነው።
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: እርስ በርሳችሁ ከመዋደድ በቀር
  rationale: εἰ μὴ የሚያስገባውን ብቸኛ ቀጣይ ግዴታ በግልጽ ያሳያል፤ የግስ ኃይሉንም ይጠብቃል።
- source_word: ὁ γὰρ ἀγαπῶν
  choice: የሚወድ ሰው … ና
  rationale: የግሪክኛውን ነጠላ ተወካይ ቅርጽ በተፈጥሯዊ አማርኛ ይገልጻል፤ γὰρ የምክንያት ግንኙነቱ በ‘ና’ ተጠብቋል።
- source_word: τὸν ἕτερον
  choice: ሌላውን
  rationale: ‘ባልንጀራውን’ የሚለውን ከቀጣዩ አውድ ሳያስገባ፣ የግሪክኛውን ‘ሌላውን/the other’ በቀጥታ ይጠብቃል።
- source_word: νόμον πεπλήρωκεν
  choice: ሕጉን ፈጽሟል
  rationale: ፈጽሟል የፍጹም ጊዜውን የተከናወነና ውጤቱ የሚቀጥል ሐሳብ በአጭሩ ይይዛል፤ ‘ሕጉን’ በዐውዱ የታወቀውን ሕግ ያመለክታል።
theological_decisions:
- issue: የዕዳ ክልከላው ወሰን
  choice: ጥቅሱ የሚለውን የዕዳ ክልከላና የመዋደድ ልዩ ግዴታ በቀጥታ ማቅረብ
  alternative: እንደ ማንኛውም ብድር ፍጹም ክልከላ መተርጎም፣ ወይም የገንዘብ ዕዳን ሳይጨምር እንደ ሥነ ምግባር ግዴታ ብቻ መውሰድ
  rationale: ግሪክኛው የዕዳ/ግዴታ ቋንቋን ተጠቅሞ መዋደድን እንደ ቀጣይ ግዴታ ያስቀምጣል፤ ትርጉሙ ጥቅሱ ራሱ ያልፈታውን ሰፊ የሥነ ምግባር ክርክር አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እርስ በርሳችሁ’ የጋራ ግንኙነቱን፣ ‘ሌላውን’ ደግሞ የምንጩን ትንሽ ያልተወሰነ አገላለጽ ይጠብቃሉ።
