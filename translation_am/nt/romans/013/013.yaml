- source_word: περιπατήσωμεν
  choice: እንመላለስ
  rationale: የምክር ወይም የጋራ ጥሪ ኃይልን ይጠብቃል፤ ጳውሎስ ‘መመላለስን’ ለአኗኗር ዘይቤ አድርጎ የሚጠቀምበትንም አገላለጽ ያስቀራል።
- source_word: κώμοις
