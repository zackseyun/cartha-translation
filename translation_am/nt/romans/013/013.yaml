- source_word: ἀσελγείαις
  choice: በልቅነት
  rationale: እፍረት የለሽና ገደብ የለሽ ምግባርን ይገልጣል፤ ጾታዊ ፍቺውን ሳያስወግድ ቃሉን ከሚያመለክተው በላይ አያጠብበውም።
- source_word: ἔριδι
