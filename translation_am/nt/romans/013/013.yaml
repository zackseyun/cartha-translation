base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: am
  text: በቀን እንደሚገባ በጨዋነት[a] እንመላለስ፤ በፈንጠዝያና በስካር፣ በዝሙትና በልቅነት፣ በጠብና በቅናት[b] ሳይሆን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአግባቡ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በምቀኝነት።” የግሪክ ቃል ቅናትን ወይም ምቀኝነትን ሊያመለክት ይችላል፤ እዚህ ግን በክፉ ባሕርያት ዝርዝር ውስጥ ስለተጠቀሰ አሉታዊ ትርጉም አለው።
