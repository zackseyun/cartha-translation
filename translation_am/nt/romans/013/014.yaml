  to: ነገር ግን ጌታ ኢየሱስ ክርስቶስን ልበሱ፤ የሥጋንም[a] ምኞቶች ለማርካት ለሥጋ አስቀድማችሁ ዝግጅት አታድርጉ።
  rationale: The revision replaces the bare prohibition against planning with an idiomatic expression for making advance preparation, thereby representing πρόνοιαν μὴ ποιεῖσθε more fully. It retains «ሥጋ» and preserves the source's purpose relation—provision for the flesh directed toward satisfying its desires—without importing a narrower doctrinal interpretation.
