  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: am
  text: ነገር ግን ጌታ ኢየሱስ ክርስቶስን ልበሱ፤ የሥጋንም[a] ምኞቶች ለማርካት ለሥጋ አስቀድማችሁ ዝግጅት አታድርጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የኃጢአት ተፈጥሮን።” ግሪክኛው “ሥጋ” ይላል፤ ጳውሎስ ይህን ቃል ብዙ ጊዜ እግዚአብሔር ከሚመራው ሕይወት ጋር በተቃራኒ ያሉትን በኃጢአት የወደቁ የሰው ዝንባሌዎች ለማመልከት ይጠቀምበታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: ልበሱ
  rationale: የመልበስን ምስላዊ አነጋገር በቀጥታ ይጠብቃል፤ በዚህ አውድ የጌታ ኢየሱስን ባሕርይና አኗኗር መያዝን ያመለክታል።
- source_word: κύριον
  choice: ጌታ
  rationale: የኢየሱስን ማዕረግና ሥልጣን የሚጠብቅ የተለመደ አማርኛ አቻ ነው።
- source_word: Χριστόν
  choice: ክርስቶስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስና የክርስቲያን ንግግር ውስጥ እንደ ማዕረግ የተለመደውን ቅርጽ ይጠብቃል።
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: አስቀድማችሁ አታቅዱ
  rationale: πρόνοια የቅድመ ሐሳብን፣ ዕቅድን ወይም ዝግጅትን ያመለክታል። ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ሆን ብሎ ለምኞት መንገድ ማዘጋጀትን ይከለክላል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: የጳውሎስን ቃልና ምስላዊ ውጥረት ሳይፈታ ይጠብቃል፤ ‘የኃጢአት ተፈጥሮ’ የሚለው አማራጭ በማስታወሻ ተገልጿል።
- source_word: εἰς ἐπιθυμίας
  choice: ምኞቶች ለማርካት
  rationale: ሐረጉ ዕቅዱ የሚያመራበትን ዓላማ ወይም ውጤት ያሳያል፤ ይህ ቅርጽ ግንኙነቱን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በሥነ ምግባራዊ አውድ ውስጥ σάρξን መተርጎም
  choice: ሥጋ
  alternative: የኃጢአት ተፈጥሮ
  rationale: አውዱ ከእግዚአብሔር ፈቃድ የሚቃረኑ የሰው ምኞቶችን ቢያመለክትም፣ ‘የኃጢአት ተፈጥሮ’ ብሎ መተርጎም የጳውሎስን ምስል በጠባብ ትርጓሜ ይወስነዋል። ዋናው ጽሑፍ ‘ሥጋ’ የሚለውን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ልበሱ’ የሚለው የመልበስ ምስል ተጠብቋል፤ ‘አስቀድማችሁ አታቅዱ’ ደግሞ πρόνοιαን እንደ ቅድመ ዕቅድ በተፈጥሯዊ አማርኛ ያቀርባል።
