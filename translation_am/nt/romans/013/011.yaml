  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: am
  text: ይህንም አድርጉ፤ ወቅቱን እያወቃችሁ፣ ከእንቅልፍ የምትነቁበት ሰዓት አሁን ደርሷልና።[a] አሁን መዳናችን ካመንንበት ጊዜ ይልቅ ይበልጥ ቀርቧልና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች «ከእንቅልፍ የምንነቃበት» ይላሉ፤ ዋናው ጽሑፍ ግን «ከእንቅልፍ የምትነቁበት» ይላል።
    reason: textual_variant
  - marker: b
    text: ወይም፣ «መጀመሪያ ካመንንበት ጊዜ ይልቅ።» የግሪኩ ጽሑፍ በቀጥታ «ባመንን ጊዜ» ብቻ ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: ይህንም አድርጉ
  rationale: በቀደሙት ቁጥሮች የተሰጡትን ሥነ ምግባራዊ ማሳሰቢያዎች ወደኋላ የሚያመለክት ሲሆን፣ በአማርኛ ተፈጥሯዊ እንዲሆን በግልጽ የትእዛዝ አገላለጽ ተተርጉሟል።
- source_word: εἰδότες τὸν καιρόν
  choice: ዘመኑን ታውቃላችሁና
  rationale: የግሪኩ አሳታፊ ግስ በዐውዱ የምክንያት ኃይል አለው፤ καιρός ደግሞ ተራ የሰዓት ፍሰትን ሳይሆን ወሳኙን ወቅት ያመለክታል።
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: የምትነቁበት ሰዓት አሁን ደርሷል
  rationale: ὥρα የሚያሳየውን አስቸኳይነት በ“ሰዓት” ጠብቆ፣ ἤδη የሚያጠናክረውን የአሁንነት ሐሳብ “አሁን ደርሷል” በሚል ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: ከእንቅልፍ የምትነቁበት
  rationale: የመንፈሳዊ ንቃትን የሚጠይቀውን ዘይቤ ሳይፈታ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἡ σωτηρία
  choice: መዳናችን
  rationale: ለአማኞች የሆነውንና ገናም እየቀረበ ያለውን የድነት እውነታ ሳያጠብ ይጠብቃል።
- source_word: ἐγγύτερον
  choice: ይበልጥ ቀርቧል
  rationale: የንጽጽር ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል፤ ወደፊት የሚፈጸመው ድነት በጊዜ እየቀረበ መሆኑን ይጠብቃል።
- source_word: ἢ ὅτε ἐπιστεύσαμεν
