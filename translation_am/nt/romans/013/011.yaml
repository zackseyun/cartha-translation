  rationale: ጥቅሱ መዳንን የአማኞች የአሁን እውነታ (“መዳናችን”) እና ገና እየቀረበ ያለ ፍጻሜ አድርጎ ያቀርባል። ትርጉሙ ይህን የ‘አሁንና ገና’ ውጥረት በአንድ የአስተምህሮ ደረጃ አይገድበውም።
