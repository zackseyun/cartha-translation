  rationale: ግሪኩ “መጀመሪያ” አይልም፤ ስለዚህ ተጨማሪ ትርጓሜ ሳይገባ “ባመንን ጊዜ” የሚለው ቀላል የግስ አገላለጽ ተጠብቋል።
theological_decisions:
