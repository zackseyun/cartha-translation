id: ROM.13.9
reference: Romans 13:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: am
  text: ምክንያቱም፣ “አታመንዝር፣ አትግደል[a]፣ አትስረቅ፣ አትመኝ” የሚሉት ትእዛዛትና ሌላ ማንኛውም ትእዛዝ ቢኖር፣ “ባልንጀራህን እንደ ራስህ ውደድ” በሚለው በዚህ ቃል[b] ውስጥ ይጠቃለላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ያለው የግሪክ ግስ በአጠቃላይ ማንኛውንም መግደል ሳይሆን ሕገ ወጥ ሰው መግደልን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “በዚህ አባባል።” የግሪኩ ቃል በዚህ አውድ “ቃል፣” “ንግግር” ወይም “አባባል” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: ምክንያቱም
  rationale: γάρ ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ትስስር ያሳያል፤ የግሪኩ ገላጭ መግቢያ በአማርኛ በተፈጥሮ በዓረፍተ ነገሩ አወቃቀር ተካቷል።
- source_word: μοιχεύσεις
  choice: አታመንዝር
  rationale: በአሥርቱ ትእዛዛት ጥቅስ ውስጥ ያለውን የዝሙት ክልከላ በቀጥተኛና በተለመደ የአማርኛ የትእዛዝ ቅርጽ ያቀርባል።
- source_word: φονεύσεις
  choice: አትግደል
  rationale: φονεύω በዚህ የሕግ አውድ ሕገ ወጥ ሰው መግደልን ያመለክታል፤ አማርኛው የተለመደውን የትእዛዙን አነጋገር ይጠብቃል፣ የቃሉ ወሰንም በማስታወሻ ተገልጿል።
- source_word: κλέψεις
  choice: አትስረቅ
  rationale: የግሪኩን ክልከላ በግልጽና በተፈጥሮአዊ የአማርኛ የትእዛዝ ቅርጽ ይተረጉማል።
- source_word: ἐπιθυμήσεις
  choice: አትመኝ
  rationale: ἐπιθυμέω ሰፊ የመሻት ትርጉም ሊኖረው ቢችልም፣ በአሥርቱ ትእዛዛት አውድ የሌላውን ነገር በመጥፎ ምኞት መመኘትን ያመለክታል።
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: ሌላም ማንኛውም ትእዛዝ ቢኖር
  rationale: τις ያለውን ያልተወሰነ ስፋትና ἑτέρα የሚያመለክተውን ሌላ ትእዛዝ በተፈጥሮአዊ አማርኛ ይጠብቃል።
- source_word: ἀνακεφαλαιοῦται
  choice: ይጠቃለላል
  rationale: ትእዛዛቱ በአንድ ዋና አሳብ ሥር መሰብሰባቸውን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: በዚህ ቃል
  rationale: λόγος እዚህ አንድን የማጠቃለያ ንግግር ወይም አባባል ያመለክታል፤ “ቃል” የግሪኩን አጭርነትና የቅዱስ ቃሉን ቅላጼ ይጠብቃል።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: በአማርኛ አዎንታዊ ትእዛዝን በተፈጥሮ የሚገልጽ ቅርጽ ሲሆን የቀረበውን የቅዱስ መጽሐፍ ጥቅስ ኃይል ይጠብቃል።
- source_word: πλησίον
  choice: ባልንጀራህን
  rationale: ቃሉ ከቤት አጠገብ የሚኖርን ጎረቤት ብቻ ሳይሆን ከሰው ጋር ያለውን ሰፊ የባልንጀርነት ግንኙነት ያመለክታል፤ ይህ ምርጫ ከዘሌዋውያን ጥቅስ ጋር ያለውን ትስስርም ይጠብቃል።
- source_word: ὡς σεαυτόν
  choice: እንደ ራስህ
  rationale: የግሪኩን አጭር ንጽጽር ተጨማሪ ትርጓሜ ሳይጨምር በተፈጥሮአዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የአሥርቱ ትእዛዛት ክልከላዎች አቀራረብ
  choice: ቀጥተኛ የአማርኛ የትእዛዝ ቅርጽ፦ “አታመንዝር፣ አትግደል…”
  alternative: በወደፊት ጊዜ ቅርጽ ቃል በቃል መቅረብ
  rationale: ግሪኩ በወደፊት ጊዜ አመልካች ቅርጽ ቢቀርብም በጥቅሱ ውስጥ እንደ ትእዛዝ ያገለግላል። አማርኛ ይህን የትእዛዝ ኃይል በክልከላ ቅርጽ በተፈጥሮ ያስተላልፋል።
- issue: λόγος በἐν τῷ λόγῳ τούτῳ ያለው ወሰን
  choice: “ቃል”፣ ማጠቃለያ ንግግርን የሚያመለክት
  alternative: “አባባል” ወይም “ንግግር”
  rationale: ጳውሎስ አንዲትን ነጠላ የመዝገበ ቃል ሳይሆን ቀጥሎ ያለውን የቅዱስ መጽሐፍ አነጋገር ያመለክታል። “ቃል” ይህን የትርጉም ስፋት በማስታወሻ እየጠበቀ የምንጩን ቅላጼ ያስቀራል።
- issue: የፍቅር ትእዛዝ እንደ ሌሎቹ ትእዛዛት ማጠቃለያ
  choice: “በዚህ ቃል ይጠቃለላል”
  alternative: ሌሎቹ ትእዛዛት ተሽረዋል ብሎ የሚያስመስል አቀራረብ
  rationale: ἀνακεφαλαιοῦται ትእዛዛቱን በአንድ ርዕስ ሥር መሰብሰብን ያመለክታል፤ መሻራቸውን አይናገርም። ትርጉሙ ይህን ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትእዛዛቱ ቅላጼ በቀጥተኛ የአማርኛ ትእዛዝ ቅርጽ ተጠብቋል። በቀረበው የእንግሊዝኛ የምክክር ጽሑፍ ውስጥ የማስታወሻ ምልክቶቹ ከማስታወሻዎቹ ይዘት ጋር አልተዛመዱም ነበር፤ በዚህ ረቂቅ [a] ከ“አትግደል” ጋር፣ [b] ደግሞ ከ“ቃል” ጋር በትክክል ተያይዘዋል።
