  terminology: “ቸርነት” suitably renders χρηστότης, “ጥብቅነት” is an acceptable non-overstated rendering of ἀποτομία, and “ትቆረጣለህ” accurately preserves the passive cutting-off image. The footnote's proposed alternative “ከዛፉ ትለያለህ” is too interpretive and is not a close lexical alternative to ἐκκοπήσῃ.
  issues:
  - severity: medium
    issue: 'Added clause: “ይህ ይሆንልሃል.”'
