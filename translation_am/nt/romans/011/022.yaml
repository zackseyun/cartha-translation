    issue: Footnote alternative “ከዛፉ ትለያለህ.”
    rationale: It paraphrases the surrounding olive-tree imagery rather than offering a lexical alternative for “will be cut off.” A note may mention the imagery, but the alternative itself should remain close to cutting/breaking off.
