  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: am
  text: ስለዚህ የእግዚአብሔርን ቸርነትና ጥብቅነት ተመልከት፤ በወደቁት ላይ ጥብቅነት፣ በአንተ ላይ ግን የእግዚአብሔር ቸርነት፣ በቸርነቱ ውስጥ ብትቀጥል፤ አለበለዚያ አንተም ትቆረጣለህ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ትቆረጣለህ” ወይም “ትሰበራለህ።” የግሪኩ ግስ ቃል በቃል “ትቆረጣለህ” ማለት ነው፤ “ትሰበራለህ” የሚለው በአካባቢው ባለው የወይራ ዛፍ ምሳሌ መሠረት የተሰጠ አማራጭ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: ተመልከት
  rationale: ቀጥተኛውን ‘እይ’ ትርጉም ከማሰብና ከማጤን ጥሪው ጋር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: χρηστότητα / χρηστότης
  choice: ቸርነት
  rationale: የእግዚአብሔርን በጎነትና ለሰዎች የሚገለጥ ደግነት የሚያመለክት ሲሆን፣ ከጥብቅነት ጋር ያለውን ንጽጽር በግልጽ ያቆያል።
- source_word: ἀποτομίαν / ἀποτομία
  choice: ጥብቅነት
  rationale: በፍርድ የሚገለጠውን የማያወላውል ከባድ አያያዝ ያስተላልፋል፤ ‘ጭካኔ’ ከሚለው ይልቅ የግሪኩን ሐሳብ ሳያጋንን ይገልጣል።
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: በወደቁት ላይ
  rationale: የἐπίን አቅጣጫዊ ግንኙነትና የπεσόνταςን ስማዊ ተሳቢ ቅርጽ ይጠብቃል።
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: በቸርነቱ ውስጥ ብትቀጥል
  rationale: የሁኔታውን አንቀጽ እና በእግዚአብሔር ቸርነት ውስጥ መቀጠልን ያለ ሥነ መለኮታዊ ማለስለሻ ይገልጣል።
- source_word: ἐπεὶ
  choice: አለበለዚያ
  rationale: በዚህ አውድ ሁኔታው ካልተፈጸመ የሚከተለውን አሉታዊ ውጤት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἐκκοπήσῃ
  choice: ትቆረጣለህ
  rationale: የወይራ ዛፉን ምሳሌ በመጠበቅ የወደፊት ተደራጊ ቅርጹንና የግሱን ቀጥተኛ የ‘መቁረጥ’ ኃይል ያስተላልፋል።
theological_decisions:
- issue: በመለኮታዊ ቸርነትና ፍርድ መካከል ያለው ሁኔታዊ ማስጠንቀቂያ
  choice: በቸርነቱ ውስጥ ብትቀጥል… አለበለዚያ አንተም ትቆረጣለህ
  alternative: ማስጠንቀቂያውን እንደ ባዶ መላምት ማለስለስ፣ ወይም የግለሰብና የማኅበር አተረጓጎምን በትርጉሙ ውስጥ አስቀድሞ መወሰን
  rationale: ግሪኩ ቀጥተኛ ሁኔታዊ ማሳሰቢያና ማስጠንቀቂያ ያቀርባል፤ ትርጉሙም ስለ ጽናት፣ መውደቅ፣ ወይም የማኅበርና የግለሰብ ተፈጻሚነት ያሉ ኋለኛ የእምነት ክርክሮችን አይፈታም።
