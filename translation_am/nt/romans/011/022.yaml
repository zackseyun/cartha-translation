  register: ዘመናዊ፣ የተከበረ እና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንጽጽሩን አወቃቀርና የማስጠንቀቂያውን ኃይል ለመጠበቅ አጭር ትይዩ ሐረጎች ተመርጠዋል።
