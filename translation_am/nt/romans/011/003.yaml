review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the address, the killing of the prophets, the destruction of the altars, and Elijah’s claim to be the sole survivor. However, “ሕይወቴን ይፈልጋሉ” is not a natural Amharic threat expression and can sound as though they are merely looking for his life; the Greek idiom unambiguously concerns an attempt on his life.
  naturalness: The register and syntax are generally clear, modern, and appropriately reverent. Recasting the final clause as “ሕይወቴን ለማጥፋት ይፈልጋሉ” gives the intended sense in idiomatic modern Amharic.
  terminology: “ጌታ ሆይ,” “ነቢያትህን,” and “መሠዊያዎችህን” are appropriate. “ብቻዬን ቀረሁ” suitably expresses μόνος while retaining Elijah’s claimed numerical isolation.
  issues:
  - severity: medium
    issue: The final clause is overly literal and unnatural in Amharic.
    rationale: ζητοῦσιν τὴν ψυχήν μου is a Greek idiom meaning that they seek to take Elijah’s life. “ሕይወቴን ይፈልጋሉ” does not naturally communicate this threat in modern Amharic; adding “ለማጥፋት” conveys the source sense without importing doctrine.
  revised_text: “ጌታ ሆይ፣ ነቢያትህን ገደሉ፤ መሠዊያዎችህንም አፈረሱ፤ እኔም ብቻዬን ቀረሁ፤ ሕይወቴን ለማጥፋትም ይፈልጋሉ።”[a]
  revised_footnotes:
