base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: am
  text: “ጌታ ሆይ፣ ነቢያትህን ገደሉ፤ መሠዊያዎችህንም አፈረሱ፤ እኔም ብቻዬን ቀረሁ፤ ሕይወቴን ለማጥፋትም ይፈልጋሉ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ነፍሴን ይፈልጋሉ”፤ ይህ የግሪክ አገላለጽ እዚህ ሕይወቴን ለማጥፋት ይፈልጋሉ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ለእግዚአብሔር በቀጥታ የቀረበ የጥሪ ቅርጽ ነው፤ ‘ጌታ ሆይ’ በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው አቻ ነው።
- source_word: ἀπέκτειναν
  choice: ገደሉ
  rationale: ግሱ በራሱ የ‘ግድያ’ን ተጨማሪ ሕጋዊ ወይም ሥነ ምግባራዊ ፍርድ ሳይጨምር መግደልን ያመለክታል።
- source_word: τὰ θυσιαστήριά σου
  choice: መሠዊያዎችህን
  rationale: θυσιαστήριον መሥዋዕት የሚቀርብበትን መሠዊያ ያመለክታል፤ የአማርኛው ቃል ትርጉሙን በበቂ ሁኔታ ይይዛል።
- source_word: κατέσκαψαν
  choice: አፈረሱ
  rationale: መሠዊያዎቹን እስከ መሠረታቸው ድረስ የማፍረስን ተግባር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: እኔም ብቻዬን ቀረሁ
  rationale: የኤልያስን ብቸኛ ቀሪነት ይጠብቃል፤ በአማርኛ የተፈጥሮ አነጋገር ሲሆን ተጨማሪ ‘እንኳ’ አያስገባም።
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: ሕይወቴን ይፈልጋሉ
  rationale: ψυχή በዚህ የማስፈራሪያ አገላለጽ ‘ሕይወት’ ማለት ነው፤ የግሪኩን አገላለጽ ሳይፈታ ትርጉሙን ያቀርባል።
theological_decisions:
- issue: ζητοῦσιν τὴν ψυχήν μου በተባለው የማስፈራሪያ አገላለጽ ψυχήን መተርጎም
  choice: ሕይወቴን
  alternative: ነፍሴን
  rationale: አውዱ የኤልያስን ሕይወት ለማጥፋት መፈለጋቸውን እንጂ ስለ ሰው ነፍስ ተፈጥሮ የሚሰጥ ትምህርት አይደለም፤ ‘ሕይወቴን’ የሚለው የምንጩን ተግባራዊ ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የዋናው ንባብ ተከታታይ የ‘እና’ አያያዝን በ‘-ም’ እና በሥርዓተ ነጥብ በተፈጥሯዊ መንገድ ያሳያል።
