base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: am
  text: እነርሱም ቢሆኑ ባለማመን ካልቀጠሉ[a]፣ ወደ ዛፉ ይቀጠላሉ[b]፤ እግዚአብሔር እንደገና ሊቀጥላቸው ይችላልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለመታመን ካልቀጠሉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተመልሰው ወደ ዛፉ ይቀጠላሉ።” በግሪኩ “እንደገና” የሚለው ቃል በግልጽ የተጻፈው በሁለተኛው ሐረግ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: እነርሱም ቢሆኑ
  rationale: የκαίን ጨማሪና በዐውዱ ያልተጠበቀ መካተትን የሚያሳይ ኃይል፣ እንዲሁም የἐκεῖνοιን አመልካች ተውላጠ ስም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: ካልጸኑ
  rationale: በአንድ ሁኔታ ውስጥ መቀጠልን ወይም መጽናትን ይገልጣል፤ አሉታዊ ሁኔታዊው አገባብም በ«ካል-» ተጠብቋል።
- source_word: τῇ ἀπιστίᾳ
  choice: ባለማመናቸው
  rationale: በሮሜ 11 ዐውድ ያለውን የማመንና ያለማመን ተቃርኖ በግልጽ ያሳያል፤ የ«አለመታመን» ትርጉም ግን በማስታወሻ ተጠብቋል።
- source_word: ἐγκεντρισθήσονται
  choice: ወደ ዛፉ ይቀጠላሉ
  rationale: የወይራ ዛፍ ቅርንጫፍን የመቀጠል ምሳሌ በአማርኛ የእጽዋት ቃላት አጠቃቀም ያስተላልፋል። «ወደ ዛፉ» የሚለው በአማርኛ የግሱን የመካተት አቅጣጫ ግልጽ ያደርጋል።
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: እግዚአብሔር ... ሊቀጥላቸው ይችላልና
  rationale: የእግዚአብሔርን ችሎታ በተፈጥሯዊ አማርኛ ያቀርባል፤ «-ና» የγάρን ምክንያታዊ ግንኙነት ይጠብቃል።
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: እንደገና ሊቀጥላቸው
  rationale: πάλιν የሚገልጠውን የመመለስ ወይም የድጋሚ ድርጊት በ«እንደገና» በግልጽ ይጠብቃል።
theological_decisions:
- issue: በዐውዱ ውስጥ የἀπιστία ትርጉም
  choice: አለማመን
  alternative: አለመታመን
  rationale: በሮሜ 11 ያለው ቀጥተኛ የማመንና ያለማመን ተቃርኖ «አለማመን»ን ይደግፋል፤ ቃሉ ሊኖረው የሚችለው የ«አለመታመን» ጥላ ትርጉም ግን እንዳይጠፋ በእግር ማስታወሻ ቀርቧል።
- issue: በመጀመሪያው የመቀጠል ግስ ውስጥ መመለስን በግልጽ ማካተት
  choice: «ይቀጠላሉ» ብቻ ተተርጉሞ፣ «እንደገና» በሁለተኛው ሐረግ ተቀምጧል
  alternative: «ተመልሰው ይቀጠላሉ»
  rationale: በግሪኩ πάλιν የሚገኘው በሁለተኛው ሐረግ ብቻ ነው። ስለዚህ የምንጩ አጽንዖትና የቃላት አቀማመጥ እንዳይቀየር የመመለስ ሐሳብ በዚያው ቦታ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የወይራ ዛፉ ምሳሌ በ«መቀጠል» ግስ ተጠብቋል፤ ለአማርኛ ግልጽነት «ወደ ዛፉ» ተጨምሯል።
