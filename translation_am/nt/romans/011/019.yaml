  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: am
  text: እንግዲህ፣ “እኔ እንድቀጠብ ቅርንጫፎች ተሰበሩ” ትላለህ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: ትላለህ
  rationale: የወደፊት ጊዜ አመልካችና ሁለተኛ መደብ ነጠላ ቅርጽ መሆኑን ጠብቆ፣ ጳውሎስ ለሚገምተው ተከራካሪ በቀጥታ የሚናገርበትን ዘይቤ ያሳያል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ሐሳብ የሚነሳውን መደምደሚያና የክርክሩን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἐξεκλάσθησαν
  choice: ተሰበሩ
  rationale: የἐκκλάωን የተደራጊ ቅርጽ እና የወይራ ዛፍ ምሳሌውን ይጠብቃል፤ ‘ተቆረጡ’ ከሚለው ይልቅ የቅርንጫፍ መሰበርን በቀጥታ ያሳያል።
- source_word: κλάδοι
  choice: ቅርንጫፎች
  rationale: በወይራ ዛፉ ምሳሌ ውስጥ ያለውን ቃል ቀጥተኛና ግልጽ በሆነ ዘመናዊ አማርኛ ይተረጉማል።
- source_word: ἵνα
  choice: እንድ-
  rationale: በአማርኛ የዓላማን ወይም የውጤትን ግንኙነት በተፈጥሯዊ የግስ ቅርጽ ያሳያል።
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና አጽንዖት ያለውን የመጀመሪያ መደብ ተውላጠ ስም በግልጽ ይጠብቃል።
- source_word: ἐγκεντρισθῶ
  choice: እንድተከል
  rationale: የተደራጊውን ትርጉም እና በዛፍ ላይ ቅርንጫፍን የመከተብ ምሳሌ በተለመደ አማርኛ ያስተላልፋል፤ ‘በመካከላቸው’ የሚል በዚህ ቁጥር የሌለ ሐረግ አልተጨመረም።
theological_decisions:
- issue: ተናጋሪው ጳውሎስ በክርክሩ ውስጥ የሚገምተው ሰው መሆኑን በግልጽ መጨመር ወይም አለመጨመር
  choice: ምንጩ እንደሚለው ቀጥተኛውን ሁለተኛ መደብ ንግግር ‘ትላለህ’ ብሎ ማቆየት
  alternative: ‘አንድ ሰው እንዲህ ይላል’ ወይም ‘እንዲህ ልትል ትችላለህ’
  rationale: የክርክር ዘይቤው ከአውዱ ይታወቃል፤ ምንጩ ግን ‘አንድ ሰው’ አይልም። ተጨማሪ ማብራሪያ ሳይገባ የግሪክኛው ቀጥተኛ አነጋገር ተጠብቋል።
- issue: የἵνα ሐረግን ስለ መለኮታዊ ዓላማ የተረጋገጠ አስተምህሮ አድርጎ ማቅረብ ወይም የተናጋሪው ጥያቄያዊ ድምዳሜ እንደሆነ ማቆየት
  choice: ‘እኔ እንድተከል’ ብሎ የተናጋሪውን የዓላማ/ውጤት አባባል ቀጥታ ማቅረብ
  alternative: ‘እግዚአብሔር እኔን ለመትከል’ ብሎ ተዋናዩንና መለኮታዊ ዓላማውን መጨመር
  rationale: ቁጥሩ የሚያቀርበው የሚገመተው አሕዛብ ተናጋሪ ድምዳሜ ነው፤ ጳውሎስ እንደተቀበለው መለኮታዊ ቀመር ማጠናከር አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው የወደፊት ጊዜ፣ ተደራጊ ድምፅ፣ የ‘እኔ’ አጽንዖትና የዛፍ ምሳሌ ተጠብቀዋል።
