review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the inferential connective, future second-person address, passive breaking-off of branches, and the purpose clause with the emphatic first-person pronoun. However, እንድተከል means ‘that I might be planted,’ not ‘that I might be grafted in’; it fails to preserve the specific olive-tree grafting image of ἐγκεντρισθῶ.
  naturalness: The sentence order and direct-address formulation are natural modern standard Amharic. Replacing the planting verb with the normal passive grafting expression makes the metaphor clear and idiomatic.
  terminology: ቅርንጫፎች and ተሰበሩ appropriately preserve the branch/breaking imagery. እንድቀጠብ preserves the passive sense and the technical horticultural image of being grafted, whereas እንድተከል does not.
  issues:
  - severity: medium
    issue: The rendering እንድተከል translates planting rather than grafting.
    rationale: ἐγκεντρισθῶ is an aorist passive subjunctive meaning ‘I might be grafted in.’ The surrounding olive-tree metaphor requires a grafting term; ‘be planted’ changes the image and weakens source fidelity.
  revised_text: እንግዲህ፣ “እኔ እንድቀጠብ ቅርንጫፎች ተሰበሩ” ትላለህ።
  revised_footnotes: []
