base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: am
  text: ነገር ሁሉ ከእርሱ፣ በእርሱና ወደ እርሱ ነውና። ለእርሱ ለዘላለም[a] ክብር ይሁን። አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ወደ ዘመናት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ነውና
  rationale: በአማርኛ ከግስ ጋር የተያያዘው ‘-ና’ አስቀድሞ ለተነገረው ምክንያት ወይም መሠረት እንደሚቀርብ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἐξ αὐτοῦ
  choice: ከእርሱ
  rationale: የሁሉን ምንጭና መነሻ በአጭርና በግልጽ አማርኛ ያስተላልፋል።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ
  rationale: የድርጊትን አማካይነት ወይም መንገድ ያሳያል፤ ግሪኩ ያለውን አጭር አቀራረብም ይጠብቃል።
- source_word: εἰς αὐτὸν
  choice: ወደ እርሱ
  rationale: የአቅጣጫ፣ የመድረሻ ወይም የዓላማ ኃይልን ‘ለእርሱ’ ብሎ ወደ አንድ ትርጉም ሳያጠብ ይጠብቃል።
- source_word: τὰ πάντα
  choice: ነገር ሁሉ
  rationale: የጽሑፉን ሁሉን አቀፍ ስፋት በተለመደና በክብር ያለው የአማርኛ አገላለጽ ያቀርባል።
- source_word: αὐτῷ ἡ δόξα
  choice: ለእርሱ … ክብር ይሁን
  rationale: ግስ የሌለውን የግሪክ ውዳሴ በአማርኛ ተፈጥሯዊ የምስጋና አገላለጽ ያቀርባል።
- source_word: εἰς τοὺς αἰῶνας
  choice: ለዘላለም
  rationale: ‘ወደ ዘመናት’ የሚለውን ግሪካዊ ፈሊጥ በዘመናዊ አማርኛ የማያቋርጥ ጊዜ በሚያመለክት ተፈጥሯዊ ቃል ይተረጉማል።
- source_word: ἀμήν
  choice: አሜን
  rationale: በአማርኛ የእምነትና የአምልኮ ንግግር የተለመደውን ቅጽ ይጠብቃል።
theological_decisions:
- issue: የተደጋገሙት αὐτοῦ/αὐτὸν/αὐτῷ ተውላጠ ስሞች ተጠቃሽ
  choice: በሁሉም ቦታ ‘እርሱ’ የሚለውን ተውላጠ ስም መጠበቅ
  alternative: ተውላጠ ስሙን ‘እግዚአብሔር’ በሚለው ስም መተካት
  rationale: የቅርብ አውዱ ተጠቃሹ እግዚአብሔር መሆኑን ቢያሳይም፣ ጽሑፉ ራሱ የሚጠቀመውን ተውላጠ ስምና የንግግሩን ድግግሞሽ መጠበቅ ተገቢ ነው።
- issue: αὐτῷ ἡ δόξα የሚለው ግስ አልባ የውዳሴ አባባል
  choice: ‘ለእርሱ … ክብር ይሁን’
  alternative: ‘ክብር የእርሱ ነው’
  rationale: ‘ይሁን’ የምስጋናና የአምልኮ ኃይሉን ይጠብቃል፤ ‘የእርሱ ነው’ ግን አባባሉን ወደ ተራ መግለጫ ሊቀይረው ይችላል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የአማርኛ አጻጻፍ ተመርጧል። የግሪኩ ሦስትዮሽ አወቃቀር—ከእርሱ፣ በእርሱ፣ ወደ እርሱ—ለንባብና ለውዳሴ ተስማሚ ሆኖ ተጠብቋል።
