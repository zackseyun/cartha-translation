  rationale: በዚህ ክርስቲያናዊ ጽሑፍ ውስጥ θεόςን ለመግለጽ የተለመደና የተከበረ የአማርኛ አጠራር ነው።
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: እንደ ተፈጥሮአቸው የወይራው ዛፍ የሆኑትን ቅርንጫፎች
  rationale: κατὰ φύσιν የሚለውን ‘እንደ ተፈጥሮአቸው’ ብሎ በመተርጎም የተፈጥሮአዊ አባልነትን ሐሳብ ጠብቋል። ‘የወይራው ዛፍ’ የሚለው ከቅርብ ዐውደ ንባብ የተወሰደ ሲሆን በአማርኛ ሐረጉን ግልጽ ያደርጋል፤ ምሳሌያዊውን አገላለጽ ግን አይፈታውም።
