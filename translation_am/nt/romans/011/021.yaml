- source_word: οὐδὲ σοῦ φείσεται
  choice: ለአንተም አይራራልህም
  rationale: οὐδέ የሚያመጣውን አሉታዊ ተጓዳኝነት ‘ም … አይ…ም’ በሚለው የአማርኛ አወቃቀር ገለጸ። σοῦ ነጠላ ሁለተኛ መደብ መሆኑን ‘አንተ’ ጠብቋል።
theological_decisions:
- issue: በወይራ ዛፉ ምሳሌ ውስጥ ‘እንደ ተፈጥሮአቸው የሆኑት ቅርንጫፎች’ የሚያመለክታቸው
  choice: ምሳሌው በዋናው ጽሑፍ ተጠብቋል፤ ቅርንጫፎቹ ‘እስራኤል’ ናቸው ተብሎ በግልጽ አልተተካም።
  alternative: ‘የእስራኤል ሕዝብ’ ብሎ ትርጉማዊ መግለጫ ማከል።
  rationale: ዐውደ ንባቡ ይህን ማጣቀሻ በጠንካራ ሁኔታ ቢያሳይም፣ ጳውሎስ በዚህ ጥቅስ ምሳሌያዊ ቃል ይጠቀማል። ትርጉሙ ዐውደ ንባቡ እንዲያብራራው በመተው ይህን ጠብቋል።
- issue: ‘ለአንተም አይራራልህም’ የሚለው ማስጠንቀቂያ
  choice: ማስጠንቀቂያው ቀጥተኛ ተደርጎና ነጠላው ‘አንተ’ ተጠብቆ ተተርጉሟል።
  alternative: ስለ ጽናት፣ ክህደት፣ ወይም የግለሰብና የማኅበረሰብ ምርጫ አንድ የእምነት ሥርዓት በትርጉሙ ውስጥ ማስገባት።
  rationale: ግሪክኛው እውነተኛና ቀጥተኛ ማስጠንቀቂያ ይሰጣል፤ ነገር ግን በዚህ ጥቅስ ብቻ ሰፊ የሥነ መለኮት ክርክሮችን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ቅርንጫፎች’ የወይራ ዛፉን ምሳሌ ይጠብቃል፤ ‘አንተ’ ደግሞ የግሪክኛውን ነጠላ አድራሻ ያስቀጥላል።
