  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: am
  text: እናንተ ቀድሞ ለእግዚአብሔር እንዳልታዘዛችሁ፣ አሁን ግን በእነርሱ አለመታዘዛቸው ምክንያት ምሕረትን እንደተቀበላችሁ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: እንዳልታዘዛችሁ ... እንደተቀበላችሁ
  rationale: ὥσπερ የሚያስገባውን ንጽጽር በአማርኛ ተፈጥሯዊ በሆነው ‘እንደ...’ አወቃቀር ያቀርባል። γάρ ከቀደመው ክርክር ጋር ያለው ማብራሪያዊ ግንኙነት በቁጥሩ የማይጠናቀቅ ንጽጽራዊ አወቃቀር ውስጥ ተጠብቋል።
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርን በግልጽ ያሳያል፤ ‘አሕዛብ’ የሚለውን ከአውዱ ጨምሮ አያስገባም።
- source_word: ποτε
  choice: ቀድሞ
  rationale: ከνῦν ‘አሁን’ ጋር ያለውን የጊዜ ንጽጽር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἠπειθήσατε
  choice: አልታዘዛችሁ
  rationale: ἀπειθέω የመታዘዝ እምቢተኝነትንና አለማመንን ሊያመለክት ይችላል። ‘አልታዘዛችሁ’ ከἀπείθεια ጋር ያለውን የቃል ግንኙነትና በእግዚአብሔር ፊት ያለውን ግንኙነታዊ-ሥነ ምግባራዊ ገጽታ ይጠብቃል።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ከ‘መታዘዝ’ ጋር የሚሄደውን የግሪክ ዳቲቭ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: የቀድሞውን አለመታዘዝና የአሁኑን ምሕረት በግልጽ ያነጻጽራል።
- source_word: ἠλεήθητε
  choice: ምሕረትን እንደተቀበላችሁ
  rationale: የግሪኩን ተደራጊ ቅርጽና ምሕረቱ ከሌላ ሰጪ መገኘቱን በአማርኛ ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: በእነርሱ አለመታዘዝ ምክንያት
  rationale: ዳቲቩ መሣሪያዊ ወይም ምክንያታዊ ሊሆን የሚችለውን አገናኝ በግልጽ ያቀርባል፤ τούτωνን ‘እነርሱ’ ብሎ በመተርጎም ማጣቀሻውን ከአውዱ በላይ አይገልጽም።
theological_decisions:
- issue: በጳውሎስ የድነት አውድ ውስጥ የἀπειθέω / ἀπείθεια ትርጉም
  choice: አለመታዘዝ
  alternative: አለማመን
  rationale: ሁለቱ የግሪክ ቃላት አለማመንንም ሊያካትቱ ቢችሉም፣ ‘አለመታዘዝ’ በግስና በስም መካከል ያለውን ቃላዊ ትስስር ይጠብቃል፤ የጳውሎስን አገላለጽ ወደ አእምሯዊ አለማመን ብቻ አያጠብም። አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ቁጥሩ በቀጣዩ ቁጥር የሚሟላ ንጽጽራዊ ሐረግ ስለሆነ የመጨረሻ ነጥብ ሳይሆን ነጠላ ሰረዝ ተጠቅሟል።
