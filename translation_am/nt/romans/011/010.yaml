id: ROM.11.10
reference: Romans 11:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: am
  text: እንዳያዩ ዓይኖቻቸው ይጨልሙ[a]፤ ጀርባቸውንም ሁልጊዜ[b] አጉብጥ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይታወሩ»። ግሪክኛው በቀጥታ «ይጨልሙ» ይላል፤ ይህም በምንጩ ጽሑፍ ያለውን የጨለማ ምስል ይጠብቃል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ያለማቋረጥ»። ሐረጉ ቀጣይ ወይም ቋሚ ቆይታን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: ይጨልሙ
  rationale: ሦስተኛ መደብ ተደራጊ ትእዛዝ/ምኞት ነው። «ይጨልሙ» የጨለማውን ምስልና የመዝሙር ጥቅሱን ዳራ ይጠብቃል፤ «ይታወሩ» ግን ትርጓሜውን ይበልጥ ይወስናል።
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ዓይኖቻቸው
  rationale: የአካል ምስሉን በቀጥታ የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: τοῦ μὴ βλέπειν
  choice: እንዳያዩ
  rationale: ዓላማን ወይም ውጤትን ሊያመለክት የሚችለውን የግሪክኛ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል፤ ከሁለቱ አንዱን ብቻ አይወስንም።
- source_word: τὸν νῶτον
  choice: ጀርባቸውን
  rationale: በግሪክኛው ያለውን ነጠላ የአካል ስም በአማርኛ በተፈጥሮ የሚሠራውን የተከፋፋይ ባለቤትነት አገላለጽ ይጠብቃል።
- source_word: διὰ παντός
  choice: ሁልጊዜ
  rationale: ቀጣይነትንና ቋሚነትን ይገልጻል፤ «ለዘላለም» ሊያመጣ የሚችለውን ከጽሑፉ የበለጠ የመጨረሻነት ሐሳብ አያስገባም።
- source_word: σύγκαμψον
  choice: አጉብጥ
  rationale: እግዚአብሔርን በቀጥታ የሚያነጋግረውን ነጠላ ትእዛዝ እና ጀርባን የማጉበጥ አካላዊ ምስል ይጠብቃል።
theological_decisions:
- issue: የፍርድ ልመና እና መለኮታዊ አድራጊነት
  choice: «ዓይኖቻቸው ይጨልሙ … ጀርባቸውንም … አጉብጥ» በሚል የልመና/ትእዛዝ ኃይሉን ማቆየት
  alternative: እንደ ትንቢታዊ መግለጫ መተርጎም («ዓይኖቻቸው ይጨልማሉ») ወይም መለኮታዊ አድራጊነቱን በማስወገድ እንደ ተፈጥሯዊ ውጤት ማቅረብ
  rationale: ጳውሎስ ጥቅሱን የፍርድ ልመና ኃይሉን እንደያዘ ያቀርበዋል። ትርጉሙ ይህን ከባድነት ወደ ትንቢት ወይም ወደ ግላዊ ያልሆነ ውጤት አያለዝበውም፤ ከጽሑፉም በላይ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ግጥማዊ ትይዩነት በፍርደ ነጥብ ተጠብቋል፤ የዓላማ/ውጤት አሻሚነትም «እንዳያዩ» በሚለው አገላለጽ ሳይፈታ ቀርቧል።
