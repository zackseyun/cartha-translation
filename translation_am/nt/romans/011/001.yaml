  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥያቄው አጽንዖትና የጳውሎስ ጠንካራ መቃወሚያ ተጠብቀዋል።
