base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: am
  text: እንግዲህ እጠይቃለሁ፤ እግዚአብሔር ሕዝቡን ጥሎታልን?[a] በፍጹም አይሁን![b] እኔም እስራኤላዊ ነኝና፤ ከአብርሃም ዘር፣[c] ከብንያም ነገድ ነኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሕዝቡን ገፍቶታልን?»
    reason: lexical_alternative
  - marker: b
    text: ግሪክ፣ «አይሁን!» ይህ ጠንካራ የመቃወሚያ አገላለጽ ሲሆን «በፍጹም!» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «ከአብርሃም ዘር።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: እንግዲህ እጠይቃለሁ
  rationale: οὖν ከቀደመው ሐሳብ ጋር ያለውን ድምዳሜያዊ ግንኙነት ያሳያል፤ λέγω ደግሞ በዚህ አውድ የንግግር ዘገባ ሳይሆን የአጠያየቅ መግቢያ ስለሆነ «እጠይቃለሁ» ተፈጥሯዊ ነው።
- source_word: μὴ ἀπώσατο
  choice: ጥሎታልን?
  rationale: ἀπωθέομαι ማለት መግፋት፣ መጣል ወይም አለመቀበል ነው። «ጥሎታልን?» በዘመናዊ አማርኛ ግልጽ ሲሆን የቃሉን የመተውና የመቃወም ኃይል ይጠብቃል፤ μή ጥያቄው አሉታዊ መልስ እንደሚጠብቅ ያመለክታል።
- source_word: τὸν λαὸν αὐτοῦ
  choice: ሕዝቡን
  rationale: የአማርኛው ባለቤትነት ቅጥያ የαὐτοῦን ትርጉም በአጭሩ ይጠብቃል፤ «ሕዝብ» የλαός መደበኛና ኪዳናዊ አውድን ሊሸከም የሚችል ቃል ነው።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: ይህ የጳውሎስ ጠንካራ የመቃወሚያ አገላለጽ ነው። «ፈጽሞ አይሁን!» የግሪኩን ምኞታዊ ቅርጽና አጽንዖት ያስቀምጣል።
- source_word: καὶ γὰρ ἐγὼ
  choice: እኔ ራሴም ... ነኝና
  rationale: «እኔ ራሴ» የἐγώን አጽንዖት፣ የአማርኛው «-ና» ደግሞ የγάρን ምክንያታዊ ኃይል ያሳያል። «-ም» የκαίን ‘እኔም’ የሚል አካታች ኃይል ይጠብቃል።
- source_word: Ἰσραηλίτης
  choice: እስራኤላዊ
  rationale: የዘርና የኪዳን ማንነትን በተፈጥሯዊ አማርኛ የሚገልጽ መደበኛ አቻ ነው።
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: ከአብርሃም ዘር የተወለድሁ
  rationale: σπέρμα ቃል በቃል «ዘር» ማለት ሲሆን ἐκ የዘር ሐረግን ያመለክታል። «ከ...ዘር የተወለድሁ» በአማርኛ ግልጽና ተፈጥሯዊ ሆኖ ይህን ትርጉም ይጠብቃል።
- source_word: φυλῆς Βενιαμίν
  choice: ከብንያም ነገድ
  rationale: φυλή በዚህ የትውልድ አውድ «ነገድ» ነው፤ «ከ» የወገንነትን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ጥያቄው እግዚአብሔር የእስራኤልን ሕዝብ ሙሉ በሙሉ ወይም ለዘላለም መተዉን ያመለክት እንደሆነ
  choice: «እግዚአብሔር ሕዝቡን ጥሎታልን?» ብሎ ያለ ተጨማሪ ገላጭ ቃል መተርጎም
  alternative: «እግዚአብሔር ሕዝቡን ሙሉ በሙሉ ጥሎታልን?» ወይም «ለዘላለም ትቶታልን?»
  rationale: የግሪኩ ጽሑፍ «ሙሉ በሙሉ» ወይም «ለዘላለም» የሚል ተውሳከ ግስ የለውም። የጥያቄውን ወሰን ቀጣዩ አውድ እንዲያብራራ በመተው የሥነ መለኮት ውጥረቱ ተጠብቋል።
