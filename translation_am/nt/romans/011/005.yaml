  rationale: ዋናው ንባብ ጸጋ የምርጫው ምንጭ፣ መሠረት ወይም ባሕርይ መሆኑን በአንዱ ብቻ ሳይወስን የግሪኩን አጭርና ክብደት ያለው አገላለጽ ይጠብቃል።
