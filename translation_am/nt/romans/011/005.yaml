    reason: lexical_alternative
  revision_rationale: The revision renders οὕτως οὖν καὶ with a more natural inferential and parallel Amharic sequence, keeps the present-era contrast, and replaces ተገኝቷል with ተፈጥሯል to represent the perfect γέγονεν. “የጸጋ ምርጫ” retains the Greek genitive’s compactness and does not decide whether grace is construed as the election’s source, basis, or defining quality. The footnote is moved to its relevant phrase.
