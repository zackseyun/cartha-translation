- source_word: ζωὴ ἐκ νεκρῶν
  choice: ከሙታን የሚገኝ ሕይወት
  rationale: የግሪኩን አጭርና ቀስቃሽ ምስል ይጠብቃል፤ ሐረጉን ‘ትንሣኤ’ ብሎ በመተርጎም ከጽሑፉ በላይ አይወስንም።
- source_word: εἰ μὴ
  choice: ካልሆነ ሌላ
