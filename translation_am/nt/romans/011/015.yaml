  text: ምክንያቱም፣ እነርሱ ውድቅ መደረጋቸው ለዓለም እርቅ ከሆነ፣ ተቀባይነት ማግኘታቸው[a] ከሙታን የሚገኝ ሕይወት[b] ካልሆነ በቀር ምን ይሆናል?
  philosophy: optimal-equivalence
