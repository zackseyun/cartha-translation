  rationale: በዚህ አውድ የመገለልን ወይም ያለመቀበልን ግንኙነታዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘መጣል’ የሚለው ከልክ በላይ ቃል በቃል ሊሆን ይችላል።
- source_word: καταλλαγὴ
