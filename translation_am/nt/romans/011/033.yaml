base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: am
  text: የእግዚአብሔር ብልጽግና፣ ጥበብና እውቀት ምንኛ ጥልቅ ናቸው![a] ፍርዶቹ ምንኛ የማይመረመሩ፣ መንገዶቹም ምንኛ ሊከተሉ የማይቻሉ ናቸው![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእግዚአብሔር ጥበብና እውቀት ብልጽግና ጥልቀት ምንኛ ታላቅ ነው!» የግሪኩ አገባብ «ብልጽግና»ን ከተከታዮቹ ከ«ጥበብ»ና ከ«እውቀት» ጋር ይበልጥ አጥብቆ ማያያዝን ይፈቅዳል፤ ዋናው ጽሑፍ ግን ሦስቱንም የእግዚአብሔር ባሕርያት አድርጎ ይወስዳል።
    reason: alternative_reading
  - marker: b
    text: «ሊከተሉ የማይቻሉ» የተባለው፣ በፈለግ ተከትሎ ሊደረስበት የማይችል ወይም ከመከታተል በላይ የሆነ ማለት ነው፤ ይህም «የማይመረመሩ» ከሚለው የተለየ ጥላ ትርጉም ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: ምንኛ … ነው!
  rationale: የግሪኩን የመደነቅ ኃይል በዘመናዊና ተፈጥሯዊ የአማርኛ አጋኖ አገላለጽ ያስተላልፋል፤ ቃል በቃል «ኦ» ማለት በዘመናዊ ንግግር ከባድ ወይም ጥንታዊ ሊመስል ይችላል።
- source_word: βάθος
  choice: ጥልቅ
  rationale: የእግዚአብሔርን ብልጽግና፣ ጥበብና እውቀት የማይለካ ጥልቀት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πλούτου
  choice: ብልጽግና
