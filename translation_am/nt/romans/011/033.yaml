- source_word: ὁδοὶ
  choice: መንገዶች
  rationale: የእግዚአብሔርን የአሠራር መንገዶች የሚያመለክተውን የምንጭ ጽሑፉን ዘይቤ ይጠብቃል።
theological_decisions:
- issue: «የእግዚአብሔር» ከብልጽግና፣ ከጥበብና ከእውቀት ጋር ያለው ግንኙነት
  choice: ሦስቱንም ስሞች የሚወስን እንደሆነ በዋናው ጽሑፍ ማቅረብ
  alternative: «የጥበቡና የእግዚአብሔር እውቀት ብልጽግና ጥልቀት» ብሎ ብልጽግናን ከሚከተሉት ሁለት ስሞች ጋር በጠበቀ ሁኔታ ማያያዝ
  rationale: የግሪኩ አገባብ ሁለቱንም ንባቦች ሊፈቅድ ቢችልም፣ በአውዱ የእግዚአብሔርን ብልጽግና፣ ጥበብና እውቀት በሦስትዮሽ የሚያወድሰው ንባብ ተፈጥሯዊ ነው። ሌላው ንባብ በማስታወሻ ተጠብቋል።
- issue: ἀνεξεραύνητα እና ἀνεξιχνίαστοιን መለየት
  choice: «የማይመረመሩ» እና «ዱካቸው ሊገኝ የማይችል» በሚሉ ሁለት የተለያዩ አገላለጾች መተርጎም
  alternative: ሁለቱንም «የማይመረመሩ» በማለት ወይም በተመሳሳይ ቅርብ ቃላት መተርጎም
  rationale: የምንጭ ጽሑፉ ተዛማጅ ግን የተለያዩ ሁለት ቃላትን ይጠቀማል፤ የተለያዩ አገላለጾች የንግግሩን ጥልቀት ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የውዳሴ አገላለጽ ተመርጧል። «ምንኛ» የግሪኩን የመደነቅ ቃና ይጠብቃል፤ «ዱካ» ደግሞ የፈለግ መከተልን ዘይቤ በግልጽ አማርኛ ያስተላልፋል።
