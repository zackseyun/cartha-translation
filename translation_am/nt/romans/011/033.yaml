    rationale: The coordinated nouns «ብልጽግና፣ ጥበብና እውቀት» are best followed by plural «ጥልቅ ናቸው» in this construction.
  - severity: medium
    issue: Number agreement and idiom in the final clause
    rationale: «መንገዶቹ» is plural, but «የማይችል» is singular. «ሊከተሉ የማይቻሉ ናቸው» is grammatical modern Amharic and conveys what cannot be traced out.
