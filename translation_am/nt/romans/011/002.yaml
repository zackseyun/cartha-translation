  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: am
  text: እግዚአብሔር አስቀድሞ ያወቀውን[a] ሕዝቡን አልጣለም። ወይስ መጽሐፍ ቅዱስ ስለ ኤልያስ በሚናገረው ክፍል[b]፣ እርሱ በእስራኤል ላይ ለእግዚአብሔር እንዴት አቤቱታ እንደሚያቀርብ[c] አታውቁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አስቀድሞ ያወቀውን” የሚለው “ቀድሞ ያወቀውን” ተብሎም ሊተረጎም ይችላል። አንዳንዶች ቃሉ አስቀድሞ መምረጥን እንደሚያመለክት ይረዱታል፤ ይህ ትርጉም ግን ያንን የነገረ መለኮት ጥያቄ አይወስንም።
    reason: alternative_reading
  - marker: b
    text: በግሪክ “በኤልያስ”፤ ይህ ፈሊጥ “ስለ ኤልያስ በሚናገረው ክፍል” ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በእስራኤል ላይ ወደ እግዚአብሔር እንዴት እንደሚማጸን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: አልጣለም
  rationale: በዚህ አውድ ግሱ ‘አልተቀበለም/ከእርሱ አራቀ’ የሚል ሳይሆን ሕዝቡን እንዳልናቀውና እንዳልተወው ያመለክታል፤ ‘አልጣለም’ ይህን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν λαὸν αὐτοῦ
  choice: ሕዝቡን
  rationale: የቃሉን የኪዳን ሕዝብ ትርጉም ይጠብቃል፤ ‘እስራኤል’ የሚለውንም በመጀመሪያው ሐረግ ሳይጨምር በኋለኛው ሐረግ እንዳለ ይተዋል።
- source_word: προέγνω
  choice: አስቀድሞ ያወቀውን
  rationale: የግሪኩን ‘አስቀድሞ አወቀ’ የሚል መሠረታዊ ፍቺ ይጠብቃል፤ ‘አስቀድሞ የመረጠውን’ በማለት የነገረ መለኮት ውይይቱን በትርጉሙ ውስጥ አይወስንም።
- source_word: ἐν Ἠλίᾳ
  choice: ስለ ኤልያስ በሚናገረው ክፍል
  rationale: ይህ የግሪክ ፈሊጥ ‘ስለ ኤልያስ በሚናገረው የመጽሐፍ ክፍል’ ማለት ነው፤ ቃል በቃል ‘በኤልያስ ውስጥ’ ማለት በአማርኛ የተሳሳተ ምስል ይፈጥራል።
- source_word: ἡ γραφή
  choice: መጽሐፍ ቅዱስ
  rationale: በጳውሎስ አጠቃቀም ቃሉ ቅዱሳት መጻሕፍትን ያመለክታል፤ ‘መጽሐፍ ቅዱስ’ በዘመናዊ አማርኛ የተለመደና ግልጽ ነው።
- source_word: ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ Ἰσραήλ
  choice: በእስራኤል ላይ ለእግዚአብሔር እንዴት አቤቱታ እንደሚያቀርብ
  rationale: ἐντυγχάνω አቤቱታን፣ ልመናን ወይም ምልጃን ማቅረብ ሊያመለክት ይችላል። κατὰ ከተከተለው በኋላ ግን ድርጊቱ ለእስራኤል የሚደግፍ ምልጃ ሳይሆን በእስራኤል ላይ የቀረበ አቤቱታ መሆኑን ያሳያል።
