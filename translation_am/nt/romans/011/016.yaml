  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: am
  text: በኩራቱ ቅዱስ ከሆነ፣ ሊጡ በሙሉም ቅዱስ ነው፤ ሥሩም ቅዱስ ከሆነ፣ ቅርንጫፎቹም ቅዱሳን ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: በኩራቱ
  rationale: የመጀመሪያውን ክፍል ለእግዚአብሔር የማቅረብ መጽሐፍ ቅዱሳዊ ትርጉም ይጠብቃል፤ ነጠላ ቅርጹንም ያንጸባርቃል።
- source_word: ἁγία
  choice: ቅዱስ / ቅዱሳን
  rationale: የግሪኩን መጽሐፍ ቅዱሳዊ ምድብ ሳያጠብ ይጠብቃል፤ በአማርኛ ከስም ቁጥር ጋር እንዲስማማ ቅርጹ ተለውጧል።
- source_word: φύραμα
  choice: ሊጡም ሁሉ
  rationale: የተቦካውን ወይም የተደባለቀውን ሊጥ በግልጽና ተፈጥሯዊ አማርኛ ያመለክታል፤ ከበኩራቱ ጋር ያለውን የክፍልና የሙሉ ንጽጽር ይጠብቃል።
- source_word: ῥίζα
  choice: ሥሩ
  rationale: የዕፅዋት ምሳሌውን ቀጥተኛና የተለመደ ቃል ያስተላልፋል።
- source_word: κλάδοι
  choice: ቅርንጫፎቹ
  rationale: በዙሪያው ካለው የወይራ ዛፍ ምሳሌ ጋር የሚስማማ መደበኛ አገላለጽ ነው።
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: '... ከሆነ፣ ...ም ... ነው፤ ...ም ... ከሆነ፣ ...ም ... ናቸው'
  rationale: በግሪኩ በሁለተኛው ክፍል የተተወውን ግስ በአማርኛ በተፈጥሮ ይሞላል፤ የ‘እንዲሁም’ አመክንዮን በ‘-ም’ ያሳያል። δέ እንደ ለስላሳ ማያያዣ በአማርኛ ያለ ተጨማሪ የጊዜ ቃል ተወክሏል።
theological_decisions:
- issue: በበኩራት/ሥርና በሊጥ/ቅርንጫፎች ምሳሌ ውስጥ ያለው የቅድስና ባሕርይ
  choice: ‘ቅዱስ’ የሚለውን ቃል የቃል ኪዳን፣ የውክልና ወይም የድነት ቅድስና ብሎ ሳይወስን መተርጎም
  alternative: ‘የተቀደሰ’ ወይም ‘ለእግዚአብሔር የተለየ’ ብሎ ትርጉሙን በግልጽ መወሰን
  rationale: ጥቅሱ ቅድስናው ከመጀመሪያው ክፍል ወደ ሙሉው፣ ከሥሩም ወደ ቅርንጫፎቹ የሚዛመድ መሆኑን ያሳያል፤ ነገር ግን የቅድስናውን ዓይነት አይገልጽም። ትርጉሙ ይህን ሥነ መለኮታዊ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁለቱ አጭር ምሳሌዎች ትይዩነት ተጠብቋል፤ የግሪኩ ነጠላ ἀπαρχή ‘በኩራቱ’ ተብሎ ቀርቧል።
