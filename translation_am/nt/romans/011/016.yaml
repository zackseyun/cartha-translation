review_pass:
  verdict: revise
  source_fidelity: The two conditional analogies, the holiness predicate, and the root/branches imagery are faithfully retained. “በኩራቱ” is an acceptable definite singular rendering of ἀπαρχή and preserves its cultic resonance without defining the kind of holiness. The phrase for φύραμα should, however, state that the dough is whole more idiomatically.
  naturalness: “ሊጡም ሁሉ” is understandable but is not the most natural modern-standard expression for “the whole batch of dough.” “ሊጡ በሙሉም” is clearer and maintains the compact parallelism. The current footnote’s “የሊጡ ብዛት” is unnatural and does not clearly communicate a mass/lump of dough.
  terminology: Keep “ቅዱስ” rather than interpret it as covenantal, salvific, or consecrated holiness. Keep “በኩራቱ,” “ሊጥ,” “ሥር,” and “ቅርንጫፎች.” Revise the lexical alternative for φύραμα to “የሊጥ ክምር,” while explaining that the Greek denotes a mass or mixture of dough.
  issues:
  - severity: low
    issue: The wording “ሊጡም ሁሉ” is less idiomatic than a construction explicitly meaning “the dough in its entirety.”
    rationale: The Greek φύραμα denotes the dough mass/batch, and the contrast with the first portion naturally concerns the whole. “ሊጡ በሙሉም” conveys this clearly in modern Amharic.
  - severity: medium
    issue: The footnote alternative “የሊጡ ብዛት” is imprecise and stylistically unnatural.
    rationale: “ብዛት” normally means quantity or multitude, rather than a lump/mass of dough. “የሊጥ ክምር” supplies a natural lexical alternative and the explanation preserves the broader sense of φύραμα.
  revised_text: በኩራቱ ቅዱስ ከሆነ፣ ሊጡ በሙሉም ቅዱስ ነው፤ ሥሩም ቅዱስ ከሆነ፣ ቅርንጫፎቹም ቅዱሳን ናቸው።
  revised_footnotes:
