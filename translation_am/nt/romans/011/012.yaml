source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: am
  text: 'በደላቸው ለዓለም ሀብት፣ ጉድለታቸውም[a] ለአሕዛብ ሀብት ከሆነ፣ ሙላታቸውማ[b] እንዴት ያለ የበለጠ ሀብት ያመጣ ይሆን!


    [a] “ጉድለታቸው” የሚለው “ሽንፈታቸው” ወይም “መቀነሳቸው” ተብሎም ሊተረጎም ይችላል።


    [b] “ሙላታቸው” የሚለው “ሙሉ ቁጥራቸው” ወይም “ሙሉ በሙሉ መካተታቸው” የሚል ሐሳብ ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጉድለታቸው” የሚለው “ሽንፈታቸው” ወይም “መቀነሳቸው” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ሙላታቸው” የሚለው “ሙሉ ቁጥራቸው” ወይም “ሙሉ በሙሉ መካተታቸው” የሚል ሐሳብ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: በደል
  rationale: የስነ ምግባር ጥፋትንና ከትክክለኛው መንገድ መሳትን ያመለክታል፤ በዐውዱም የእስራኤልን ጥፋት ያለ አላስፈላጊ ማብራሪያ ያስተላልፋል።
- source_word: πλοῦτος
  choice: ሀብት
  rationale: ቃሉ በዚህ ስፍራ የመለኮታዊ በረከትን ብዛት በዘይቤ ይገልጣል፤ “ሀብት” ዘይቤውን ይጠብቃል።
- source_word: κόσμος
  choice: ዓለም
  rationale: ከእስራኤል ባሻገር በስፋት ተጠቃሚ የሆነውን ዓለም ያመለክታል።
- source_word: ἥττημα
  choice: ጉድለት
  rationale: የግሪኩ ቃል ኪሳራን፣ ሽንፈትን ወይም መቀነስን ሊያመለክት ይችላል። “ጉድለት” ይህን ስፋት በአንጻራዊ ሁኔታ ይጠብቃል፤ አማራጮቹም በማስታወሻ ቀርበዋል።
- source_word: ἔθνη
  choice: አሕዛብ
  rationale: በሮሜ መልእክት የአይሁድንና የአሕዛብን ንጽጽር በግልጽ የሚያሳይ የተለመደ አማርኛ አገላለጽ ነው።
- source_word: πόσῳ μᾶλλον
  choice: እንዴት እጅግ የበለጠ
  rationale: ከትንሹ ወደ ትልቁ የሚያመራውን የጳውሎስን ንጽጽራዊ ክርክር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πλήρωμα
  choice: ሙላት
  rationale: ቃሉ ሙሉነትን፣ ሙሉ ቁጥርን ወይም ሙሉ ተካትቶ መግባትን ሊያመለክት ስለሚችል “ሙላት” የግሪኩን ሆን ተብሎ የተተወ ስፋት ይጠብቃል።
theological_decisions:
- issue: የ“ሙላታቸው” (τὸ πλήρωμα αὐτῶν) ትርጉም
  choice: የእስራኤልን ሙሉ ቁጥር፣ ሙሉ መካተት ወይም ዳግም መመለስ እንደሆነ ሳይወሰን “ሙላታቸው” ተብሎ በሰፊው ተተርጉሟል።
  alternative: “ሙሉ ቁጥራቸው” ወይም “ሙሉ በሙሉ መካተታቸው”
  rationale: የግሪኩ አገላለጽ አጭርና ብዙ ፍቺ ሊሸከም የሚችል ነው። ዋናው ጽሑፍ ይህን ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ ዋና አማራጮቹም በማስታወሻ ተገልጸዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ መጨረሻ ሐረግ ግስ የተተወበት ቢሆንም፣ በአማርኛ የንጽጽሩን ኃይል ለማስጠበቅ “ይሆን” ተጨምሯል። በምንጩ ያልተገለጸ “አሁን” የሚል የንግግር ማያያዣ አልገባም።
