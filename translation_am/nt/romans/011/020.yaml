  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: am
  text: እውነት ነው፤[a] እነርሱ ባለማመናቸው ተሰብረው ተለዩ፤ አንተ ግን በእምነት[b] ቆመሃል። በትዕቢት አታስብ፤[c] ይልቁንም ፍራ።[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መልካም” ወይም “ይህ እውነት ነው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመታመን።”
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “ራስህን ከፍ አድርገህ አታስብ” ወይም “ትዕቢተኛ አትሁን።”
    reason: lexical_alternative
  - marker: d
    text: ይህም በትዕቢት ከመመካት ይልቅ በእግዚአብሔር ፊት በትሕትና፣ በአክብሮትና በጥንቃቄ መፍራትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: እውነት ነው
  rationale: በቀደመው ቁጥር ለተነገረው ሐሳብ የሚሰጥ የማረጋገጫ ምላሽ ነው፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: τῇ ἀπιστίᾳ
  choice: ባለማመናቸው
  rationale: የድርጊቱን ምክንያት ያሳያል፣ ከቀጣዩ ‘በእምነት’ ጋር ያለውንም ተቃርኖ ይጠብቃል።
- source_word: ἐξεκλάσθησαν
  choice: ተሰብረው ተለዩ
  rationale: በአውዱ ያለውን የወይራ ዛፍና የቅርንጫፎች ምሳሌ በግልጽ አማርኛ ይጠብቃል።
- source_word: τῇ πίστει
  choice: በእምነት
  rationale: የመቆሙን መሠረት ወይም መንገድ ያሳያል፤ ከἀπιστία ጋር ያለውን ተቃርኖም ያስቀራል።
- source_word: ἕστηκας
  choice: ቆመሃል
  rationale: የፍጹም ጊዜውን የአሁን የቆየ ሁኔታ በአጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: ὑψηλὰ φρόνει
  choice: በትዕቢት አታስብ
  rationale: ስለራስ ከፍ አድርጎ የማሰብን ፈሊጣዊ ትርጉም በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: φοβοῦ
  choice: ፍራ
  rationale: የግሡን ቀጥተኛና ሹል ማስጠንቀቂያ ሳያለዝብ ይጠብቃል፤ የፍርሃቱን ዓይነት አውዱ እንዲወስን ይተዋል።
theological_decisions:
- issue: የπίστις ትርጉም ከἀπιστία ጋር ባለው ተቃርኖ
  choice: እምነት
  alternative: መታመን
  rationale: ከ‘አለማመን’ ጋር ያለው ተቃርኖ የሰውን የእምነት ምላሽ ያመለክታል፤ ‘መታመን’ ግን ተቀባይነት ያለው አማራጭ ነው።
- issue: የφοβοῦ ኃይልና የትርጉም ወሰን
  choice: ፍራ
  alternative: በፍርሃት ኑር
  rationale: በእግዚአብሔር ፊት ትሕትናና ጥንቃቄ እንዲኖር የሚጠይቀውን ማስጠንቀቂያ ይጠብቃል፤ ፍርሃቱን ወደ ተራ አክብሮት አያለዝበውም፣ ወደ ድንጋጤም አያጠብበውም።
