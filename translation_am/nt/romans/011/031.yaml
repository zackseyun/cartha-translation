source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: am
  text: እንደዚሁም እነዚህ አሁን አልታዘዙም፤ ይህም ለእናንተ በተደረገላችሁ ምሕረት[a] እነርሱም አሁን ምሕረትን እንዲቀበሉ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «በእናንተ ምሕረት።» የግሪኩ ሐረግ በቀጥታ እንዲህ ሊተረጎም ይችላል፤ በአውዱ ግን እግዚአብሔር ለእናንተ ያደረገላችሁን ምሕረት የሚያመለክት ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ οὗτοι
  choice: እንደዚሁም እነዚህ
  rationale: ከቀደመው ንግግር ጋር ያለውን ንጽጽርና አመልካችነት በተፈጥሯዊ አማርኛ ይጠብቃል፤ «እነዚህ» በአውዱ እስራኤልን ያመለክታል።
- source_word: νῦν ἠπείθησαν
  choice: አሁን አልታዘዙም
  rationale: νῦν ያለውን ወቅታዊ አጽንዖት ይጠብቃል፤ ἀπειθέω አለመታዘዝንና አለማመንን ሊያካትት ቢችልም «አልታዘዙም» ሰፊውን ቃላዊ ክልል ይጠብቃል።
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: ለእናንተ በተደረገው ምሕረት
  rationale: በአውዱ መሠረት የአሕዛብ አማኞች የተቀበሉትን የእግዚአብሔር ምሕረት ያመለክታል፤ የግሪኩን የዳቲቭ አሻሚነት በማስታወሻ ያሳያል።
- source_word: ἵνα καὶ αὐτοὶ νῦν ἐλεηθῶσιν
  choice: እነርሱም አሁን ምሕረትን እንዲቀበሉ
  rationale: ἵνα የሚያሳየውን ዓላማ/ውጤት፣ αὐτοὶ የሚሰጠውን አጽንዖትና ሁለተኛውን νῦν ይጠብቃል፤ የተገብሮ ቅርጹም ምሕረት ከእግዚአብሔር እንደሚሰጥ ያሳያል።
theological_decisions:
- issue: «τῷ ὑμετέρῳ ἐλέει» ማለት አሕዛብ ያደረጉት ምሕረት ነው ወይስ ለእነርሱ የተደረገው የእግዚአብሔር ምሕረት?
  choice: ለእናንተ በተደረገው ምሕረት
  alternative: በእናንተ ምሕረት
  rationale: በሮሜ 11፥30-32 ያለው የክርክሩ ፍሰት ሁለቱም ቡድኖች ከአለመታዘዝ ወደ መለኮታዊ ምሕረት መምጣታቸውን ያነጻጽራል። ስለዚህ ዋናው ጽሑፍ ለአሕዛብ የተደረገውን ምሕረት ያሳያል፤ ይሁንና የግሪኩ ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ምሕረት» የመጽሐፍ ቅዱስን ክብር ሳያጣ በዘመናዊ አማርኛ የሚገባ ነው።
