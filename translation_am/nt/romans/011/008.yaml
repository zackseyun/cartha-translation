source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: am
  text: እንደተጻፈው፣ “እግዚአብሔር የድንዛዜ መንፈስ[a]፣ እንዳያዩ ዓይኖችንና እንዳይሰሙ ጆሮዎችን እስከ ዛሬ ድረስ ሰጣቸው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የከባድ እንቅልፍ መንፈስ።” ይህ ሐረግ ኢሳይያስ 29፥10ን ያስተጋባል፤ እዚህ የተጠቀሰው የግሪክ ቃል ግን ድንዛዜን ወይም መደንዘዝን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈውም
  rationale: የቅዱሳት መጻሕፍትን ጥቅስ የሚያስተዋውቀውን የተለመደ ሐረግ በተፈጥሯዊና በክብር ባለው አማርኛ ያቀርባል።
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: እግዚአብሔር … ሰጣቸው
  rationale: የግሪኩን ግልጽ ባለቤትና ቀላል ያለፈ ጊዜ ሳያለዝብ ይጠብቃል።
- source_word: πνεῦμα κατανύξεως
  choice: የድንዛዜ መንፈስ
  rationale: κατάνυξις የሚያመለክተውን ድንዛዜ፣ የስሜት መደንዘዝ ወይም የአእምሮ ድብዘዛ በአጭርና በጥቅሱ ክብር በሚስማማ አገላለጽ ያስተላልፋል፤ የኢሳይያስን ዳራ የሚያንጸባርቀው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: እንዳያዩ ዓይኖችን
  rationale: τοῦ μὴ ከግስ መደብ ጋር ያለውን የዓላማ ወይም የውጤት አንድምታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: እንዳይሰሙ ጆሮዎችን
  rationale: ከቀደመው ሐረግ ጋር ያለውን ትይዩነት ይጠብቃል፤ ἀκούεινንም እንደ መስማት ችሎታ በቀጥታ ያቀርባል።
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: እስከዚች ቀን ድረስ
  rationale: ጥቅሱ እስከ ጳውሎስ ዘመን ድረስ መፈጸሙን የሚገልጠውን አጽንዖት በክብር ባለው አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በመደንዘዝ ፍርድ ውስጥ የእግዚአብሔር ድርጊት
  choice: “እግዚአብሔር … ሰጣቸው” የሚለውን ቀጥተኛ ንግግር ማቆየት
  alternative: “እግዚአብሔር እንዲኖራቸው ፈቀደ” ወይም “አሳልፎ ሰጣቸው”
  rationale: የግሪኩ ጽሑፍ እግዚአብሔርን በግልጽ የድርጊቱ ባለቤት ያደርጋል። ትርጉሙ ይህን ወደ ፈቃድ ብቻ አያለዝብም፣ ከጳውሎስ ቃል ባለፈም የተወሰነ የእምነት ሥርዓት አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ ትይዩ አወቃቀርና ጥብቅ ዜማ ተጠብቀዋል።
