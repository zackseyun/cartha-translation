review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional contrast between grace and works and renders γίνεται with a verbal predicate. However, ἐξ ἔργων denotes source/basis (“from works”), not instrument (“by works”); the Amharic should therefore use ከሥራ የተነሣ rather than በሥራ.
  naturalness: The revised wording is natural, formal modern Amharic. Repeating ከእንግዲህ ወዲህ reflects οὐκέτι in both occurrences while retaining the compact rhetorical structure.
  terminology: ጸጋ is the established and appropriate rendering for χάρις. ሥራ remains appropriately general for ἔργα and does not add an interpretive qualifier.
  issues:
  - severity: medium
    issue: The phrase በሥራ renders ἐξ ἔργων imprecisely.
    rationale: ἐκ with the genitive marks origin or basis. In this antithesis, the selection is not derived from works; በሥራ can more readily express means or agency.
  revised_text: ነገር ግን፣ በጸጋ ከሆነ፣ ከእንግዲህ ወዲህ ከሥራ የተነሣ አይደለም፤ አለበለዚያ ጸጋ ከእንግዲህ ወዲህ ጸጋ አይሆንም።
