id: ROM.11.6
reference: Romans 11:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: am
  text: ነገር ግን፣ በጸጋ ከሆነ፣ ከእንግዲህ ወዲህ ከሥራ የተነሣ አይደለም፤ አለበለዚያ ጸጋ ከእንግዲህ ወዲህ ጸጋ አይሆንም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι / χάρις
  choice: በጸጋ / ጸጋ
  rationale: በጳውሎስ መልእክቶች የተለመደውን እና ያልተገባ መለኮታዊ ቸርነትን የሚገልጠውን ቃል ይጠብቃል።
- source_word: ἐξ ἔργων
  choice: በሥራ
  rationale: የምንጭን አመጣጥ/መሠረት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በዐውዱ ለማንኛውም ሰዋዊ ሥራ ክፍት ሆኖ ይቆያል።
- source_word: γίνεται
  choice: ይሆንም
  rationale: ‘መሆን/መሆን መቻል’ የሚለውን የግሱን ኃይል ይጠብቃል፤ በአማርኛ ‘ጸጋ መሆኑ ይቀራል’ የሚለውን የተፈጥሮ ውጤት ያሳያል።
- source_word: οὐκέτι
  choice: ከእንግዲህ … አይደለም / አይሆንም
  rationale: ‘ከእንግዲህ በኋላ አይደለም’ የሚለውን ግልጽ የለውጥ አመልካች ትርጉም በሁለቱም ቦታዎች ይጠብቃል።
theological_decisions:
- issue: በጸጋና በሥራ መካከል ያለው ንጽጽር
  choice: ጸጋ እና ሥራ የመሠረት አማራጮች እንደሆኑ በቀጥታ ማቅረብ
  alternative: ‘ሥራ በመሥራት የተገኘ’ ብሎ ማብራራት
  rationale: ግሪኩ አጭር ነው፤ ትርጉሙም የሥራዎቹን ዓይነት ወይም ሚና ከጽሑፉ በላይ ሳይወስን ተቃርኖውን ይጠብቃል።
- issue: γίνεται χάρις የሚለው አገላለጽ
  choice: ‘ጸጋ አይሆንም’
  alternative: ‘ጸጋነቱ ይቀራል’ ወይም ‘ጸጋ አይደለም’
  rationale: የምንጩን ‘becomes/is’ ግስ ያስቀራል፣ ነገር ግን ቃል በቃል ‘ጸጋ መሆን አይጀምርም’ የሚል ያልተፈለገ ጊዜያዊ ሐሳብ እንዳይሰማ ተፈጥሯዊ አማርኛ ይጠቀማል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ የአማርኛ አገላለጽ። የግሪኩ አጭር ሎጂካዊ ንጽጽር ተጠብቋል፤ ማብራሪያ የሚያስፈልገው የጽሑፍ ልዩነት ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
