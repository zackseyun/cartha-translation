  choice: ጥቅሱ መሰናከላቸው ወደ ውድቀት እንዲያመራ መሆኑን በጽኑ ይክዳል፤ “ተሰናከሉ” እና “ይወድቁ” የሚሉት ሁለት ግሶች ተለይተው ተተርጉመዋል።
