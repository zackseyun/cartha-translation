  alternative: ንጹሕ አሉታዊ ምቀኝነትን ማስነሳት፣ ወይም ተመሳሳይ ድነትን እንዲመኙ ብቻ ማነሳሳት።
  rationale: παραζηλόω ቅናትን ማስነሳትን ይገልጣል፤ ይህ ቅናት ተመሳሳይ በረከትን ወደ መፈለግ ሊያነሳሳ የሚችል ንዑስ ትርጉም አለው። ዋናው ጽሑፍ “ማስቀናት” ብሎ አሻሚነቱን ጠብቋል።
