  terminology: አዳኙ appropriately renders the title-like participle ὁ ῥυόμενος. Replacing ክፋትን avoids weakening ἀσεβείας. The footnote’s አማኙን ቅሬታ is erroneous Amharic for ‘believing remnant’ and should be አማኝ ቅሬታ.
