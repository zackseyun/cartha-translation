  verdict: revise
  source_fidelity: The verse accurately preserves the manner sense of οὕτως, the future passive sense of σωθήσεται, the citation formula, Zion and Jacob, and the open wording of πᾶς Ἰσραήλ. However, ἀσεβείας is more specifically irreverence/godlessness toward God than the broad ክፋት (‘evil/wickedness’).
