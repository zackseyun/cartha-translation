base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: am
  text: በዚህም መንገድ እስራኤል ሁሉ ይድናል፤[a][b] እንደተጻፈውም፣ “አዳኙ ከጽዮን ይመጣል፤[c] ከያዕቆብም እግዚአብሔርን የማይፈራ ኑሮን ያስወግዳል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲሁም እስራኤል ሁሉ ይድናል።” የግሪኩ οὕτως “እንዲሁ” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን ከዚህ በፊት የተገለጸውን አኳኋን የሚያመለክት “በዚህ መንገድ” የሚለው ትርጉም ይበልጥ የሚመስል ነው።
    reason: lexical_alternative
  - marker: b
    text: “እስራኤል ሁሉ” የሚለው አገላለጽ በአተረጓጎም አከራካሪ ነው። ጳውሎስ የዘር እስራኤልን በአጠቃላይ፣ አማኝ ቅሬታን፣ ወይም ሙሉውን የእግዚአብሔር ሕዝብ ማለቱ እንደሆነ ትርጉሙ ሳይወስን የግሪኩን አገላለጽ ይጠብቃል።
    reason: alternative_reading
  - marker: c
    text: የግሪኩ ἐκ Σιὼν ይበልጥ ቃል በቃል “ከጽዮን ወጥቶ” ተብሎም ሊቀርብ ይችላል።
    reason: lexical_alternative
