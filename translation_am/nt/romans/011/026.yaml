  rationale: የቃሉን የአኳኋን ትርጉም ይጠብቃል፤ ጳውሎስ ከዚህ በፊት የገለጸውን ሂደት ሊያመለክት ይችላል፣ ነገር ግን አንድን የሥነ መለኮት አተረጓጎም አያስገድድም።
