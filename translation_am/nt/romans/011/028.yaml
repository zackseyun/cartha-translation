  rationale: በሮሜ 9–11 አውድ «አባቶች» የሚለው ቃል የእግዚአብሔርን ተስፋዎች የተቀበሉትን የእስራኤል አባቶች በተፈጥሮ ያስታውሳል፤ ዋናው ጽሑፍ ግን የምንጩን አጭር አገላለጽ ይጠብቃል።
