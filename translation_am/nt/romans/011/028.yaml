- issue: «አባቶች» የሚለው ማንን እንደሚያመለክት
  choice: የእስራኤልን የቃል ኪዳን አባቶች፣ በተለይ አብርሃምን፣ ይስሐቅንና ያዕቆብን ያመለክታል።
