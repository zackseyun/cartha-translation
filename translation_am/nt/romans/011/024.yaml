review_pass:
  verdict: revise
  source_fidelity: The draft preserves the central olive-tree/grafting metaphor and the a-fortiori argument, but several formulations add or shift source details. In particular, “በተፈጥሮህ” makes “by nature” qualify the person rather than the wild olive tree, and “የዚያ ዛፍ” (“of that tree”) is not present in the Greek. The future passive conclusion should be stated directly as “will be grafted.”
  naturalness: The proposed revision uses fluent modern standard Amharic while retaining the elevated but accessible biblical register. “ይልቁንም ምንኛ” clearly expresses πόσῳ μᾶλλον, and “ወደ ... ይቀጠላሉ” naturally expresses the grafting destination.
  terminology: “የዱር ወይራ ዛፍ,” “የተከለሰ የወይራ ዛፍ,” and “መቀጠል” appropriately preserve the agricultural contrast and technical grafting image. “ገዛ” adequately conveys ἰδίᾳ. “ቅርንጫፎች” is supplied from the immediate metaphor and is documented by a footnote.
  issues:
  - severity: medium
    issue: “በተፈጥሮህ” attaches κατὰ φύσιν to “you.”
    rationale: 'In Greek, κατὰ φύσιν qualifies ἀγριελαίου: the source is a wild olive tree that is such by nature. The revision makes this attachment explicit without making a theological inference about the addressee.'
  - severity: medium
    issue: “የዚያ ዛፍ” adds an unsupported demonstrative and possessive relation.
    rationale: οὗτοι οἱ κατὰ φύσιν means “these, the ones/branches according to nature”; it does not say “of that tree.” The supplied “branches” is contextually warranted, but “that tree” should not be added.
  - severity: medium
    issue: The final rhetorical question uses present-negative wording (“አይቀጠሉም”).
    rationale: ἐγκεντρισθήσονται is future passive, “will be grafted.” A direct future statement better reflects the Greek while retaining the a-fortiori force.
  - severity: low
    issue: “ከተፈጥሮ ሥርዓት” adds “order.”
    rationale: The addition is not necessary in Amharic and slightly expands παρὰ φύσιν. “ከተፈጥሮ በተቃራኒ” is clear and preserves the direct contrast with “በተፈጥሮ.”}],
