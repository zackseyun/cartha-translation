reference: Romans 11:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: am
  text: አንተ በተፈጥሮ ከሆነው የዱር ወይራ ዛፍ ተቆርጠህ፣ ከተፈጥሮ በተቃራኒ በተከለሰ የወይራ ዛፍ ላይ ከተቀጠልህ፣ እነዚህ በተፈጥሮ የሆኑ ቅርንጫፎች[a] ይልቁንም ምንኛ ወደ ገዛ የወይራ ዛፋቸው ይቀጠላሉ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚህ፣ በተፈጥሮ የሆኑት።” ግሪኩ “እነዚህ፣ በተፈጥሮ የሆኑት” ብቻ ይላል፤ “ቅርንጫፎች” የሚለው በአውዱ ካለው የወይራ ዛፍ ምሳሌ የተሟላ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: ተቆርጠህ
  rationale: የግሱን ‘ተቆርጠህ ወጣህ’ የሚለውን የእርሻ ምሳሌያዊ ፍቺ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀγριελαίου
  choice: ከዱር ወይራ ዛፍ
  rationale: የማይለማ ወይራን ከተከለሰው ወይራ የሚለየውን ንጽጽር ግልጽ ያደርጋል።
- source_word: παρὰ φύσιν
  choice: ከተፈጥሮ ሥርዓት በተቃራኒ
  rationale: κατὰ φύσιν ከሚለው ተቃራኒ ንጽጽር ጋር የግሪኩን ኃይል ይጠብቃል፤ ‘ሥርዓት’ መጨመሩም በአማርኛ ንግግሩን ተፈጥሯዊ ያደርገዋል።
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: ተቀጠልህ / ይቀጠላሉ
  rationale: ‘መቀጠል’ ለዛፍ ቅርንጫፍ ማዳቀል በዘመናዊ አማርኛ የሚሠራ የእርሻ ቃል ነው፤ የግሪኩን ተደራጊ አቀራረብም ይጠብቃል።
- source_word: καλλιέλαιον
  choice: በተከለሰ የወይራ ዛፍ
  rationale: ከዱር ወይራ ጋር ያለውን የተንከባከበ/የለማ ዛፍ ንጽጽር ያሳያል፤ ‘መልካም’ የሚል ሥነ ምግባራዊ ግምገማ አያስገባም።
- source_word: πόσῳ μᾶλλον
  choice: እንዴት ይልቁን
  rationale: ከአነስተኛው ወደ ታላቁ የሚሄደውን የጳውሎስ አመክንዮአዊ ጥያቄ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: እነዚህ በተፈጥሮ የዚያ ዛፍ ቅርንጫፎች የሆኑት
  rationale: ‘ቅርንጫፎች’ በግሪኩ በቀጥታ ባይኖርም ከአውዱ የተሟላ ነው፤ የወይራውን ምሳሌ ግልጽ አድርጎ ይጠብቃል።
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: በገዛ የወይራ ዛፋቸው ላይ
  rationale: ἰδίᾳ የሚያጎላውን የራስነትና የባለቤትነት ሐሳብ ‘ገዛ’ በትክክል ይገልጣል።
theological_decisions:
- issue: ‘እነዚህ’ የሚያመለክታቸውን እስራኤላውያን/አይሁድ በግልጽ መጥቀስ ወይም አለመጥቀስ
  choice: የወይራውን ምሳሌ በመጠበቅ ‘እነዚህ ... ቅርንጫፎች’ ተብሏል።
  alternative: ‘እነዚህ አይሁድ’ ወይም ‘እነዚህ እስራኤላውያን’ ማለት።
  rationale: ሰፊው አውድ እስራኤልን ቢያመለክትም በዚህ ቁጥር ግሪኩ የዘር መጠሪያ አይጠቀምም፤ ስለዚህ ጽሑፉ ያልገለጠው በዋናው ንባብ አልተጨመረም።
- issue: በግሪኩ ያልተጻፈውን ‘ቅርንጫፎች’ መጨመር
  choice: ለአማርኛ ግልጽነት ‘ቅርንጫፎች’ ተጨምሯል።
  alternative: ‘እነዚህ በተፈጥሮ የሆኑት’ ብቻ ማለት።
  rationale: ከቁጥር 17 ጀምሮ ያለው የወይራ ቅርንጫፎች አውድ ይህን ስም በግልጽ ያሟላዋል፤ ያለሱ አማርኛው ደብዛዛ ይሆናል።
- issue: ‘ዳግመኛ/መልሰው’ የሚለውን የመመለስ ሐሳብ በዋናው ጽሑፍ መጨመር
  choice: የመመለስ ሐሳቡ በዋናው ጽሑፍ አልተጨመረም።
  alternative: ‘በገዛ የወይራ ዛፋቸው ላይ መልሰው ይቀጠላሉ’ ማለት።
  rationale: መመለሳቸው ከአውዱ የሚገባ ቢሆንም ἐγκεντρισθήσονται ራሱ ‘መልሰው’ የሚል ቅጥያ የለውም፤ ይህ ልዩነት በማስታወሻ ተጠብቋል።
