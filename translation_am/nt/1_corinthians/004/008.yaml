  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: am
  text: ቀድሞውኑ ጠግባችኋል፤ ቀድሞውኑ ባለጠጎች ሆናችኋል፤ ከእኛ ውጭ ነግሣችኋል። ምነው በእርግጥ ብትነግሡ ኖሮ፣ እኛም ከእናንተ ጋር እንድንነግሥ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ጳውሎስ በምፀት ይናገራል፤ የቆሮንቶስ አማኞች አስቀድመው እንደጠገቡ፣ እንደበለጸጉና እንደነገሡ ይቆጥራሉ።
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: አሁንስ
  rationale: የጳውሎስን ተደጋጋሚ ጊዜያዊ አጽንዖትና ምፀታዊ ቃና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κεκορεσμένοι ἐστέ
  choice: ጠግባችኋል
  rationale: ከተሟላ ድርጊት የተነሣውን የአሁን ሁኔታ በአጭርና በተለመደ አገላለጽ ያስተላልፋል።
- source_word: ἐπλουτήσατε
  choice: ባለጠጎች ሆናችኋል
  rationale: የመበልጸግን ለውጥና የአሁኑን ውጤት ይጠብቃል።
- source_word: χωρὶς ἡμῶν
  choice: ከእኛ ውጭ
  rationale: ከሐዋርያት ተለይተው የደረሱ ይመስላቸው የነበረውን ሁኔታ በቀጥታ ያሳያል።
- source_word: ἐβασιλεύσατε
  choice: ነግሣችኋል / ነግሣችሁ በሆነ
  rationale: የβασιλεύωን ግልጽ የንግሥና ምስል ይጠብቃል፤ ሁለተኛው አገላለጽ ያልተፈጸመ ምኞትን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὄφελόν γε
  choice: በእውነት ... በሆነ እንዴ
  rationale: ጠንካራውን ምኞት ከምፀታዊ ጥላው ጋር ይገልጻል።
- source_word: συμβασιλεύσωμεν
  choice: ከእናንተ ጋር እንድንነግሥ
  rationale: የσυν-ን አብሮነትና የመንገሥን ንጉሣዊ ምስል በግልጽ ያቆያል።
theological_decisions:
- issue: የመጀመሪያዎቹ ሦስት ንግግሮች ቃና
  choice: እንደ ምፀታዊ ማረጋገጫዎች ተተርጉመዋል።
  alternative: ቀጥተኛ የምስጋና መግለጫዎች አድርጎ መተርጎም።
  rationale: ዐውደ ንባቡ የቆሮንቶስ ሰዎችን ራስ-ግምት ከሐዋርያት መከራ ጋር በምፀት ያነጻጽራል፤ ይህም በጽሑፉ ያለ ከመጠን በላይ ማብራሪያ ተጠብቋል።
- issue: የንግሥና ቋንቋ ትርጉም
  choice: የመንገሥ ንጉሣዊ ምስል ተጠብቋል።
  alternative: እንደ ስኬት፣ ሥልጣን ወይም ከፍተኛ ደረጃ በጥቅሉ መተርጎም።
  rationale: ἐβασιλεύσατε እና συμβασιλεύσωμεν በግልጽ የንግሥና ቃላት ስለሆኑ የጳውሎስን ሥነ-መለኮታዊና የንግግር ንጽጽር ሳይደበዝዙ ተቀምጠዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንግሥና ምስልና የጳውሎስ ምፀታዊ ቃና ተጠብቀዋል።
