  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: am
  text: አንዳንዶች እኔ ወደ እናንተ የማልመጣ መስሏቸው፣ በትዕቢት ተነፍተዋል[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንዳንዶች እኔ ወደ እናንተ የማልመጣ መስሏቸው፣ ታብየዋል።”
    reason: lexical_alternative
  - marker: b
    text: ጳውሎስ ራስን ከፍ የማድረግን ትዕቢት ለመግለጽ “መነፋት” የሚለውን ምስል በ1 ቆሮንቶስ ደጋግሞ ይጠቀማል፤ 1 ቆሮ 4፥6፣ 4፥19፣ 5፥2፣ 8፥1፣ 13፥4ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: መስሎአቸው
  rationale: የአንዳንዶቹን የተሳሳተ ግምት የሚገልጸውን ንጽጽራዊና ግምታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: እኔ ወደ እናንተ የማልመጣ
  rationale: የግሪኩ አገባብ ጳውሎስ እንደማይመጣ በቀጥታ አያረጋግጥም፤ ከὡς ጋር ሆኖ የእነርሱን ግምት ይገልጻል።
- source_word: δέ
  choice: ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ቀላል ንጽጽራዊ ግንኙነት በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἐφυσιώθησάν
  choice: በትዕቢት ተነፍተዋል
  rationale: φυσιόω የሚያመለክተውን ‘መነፋት’ ምስል ይጠብቃል፤ ‘በትዕቢት’ የሚለውም በአማርኛ ምስሉ በሥጋዊ ትርጉም እንዳይወሰድ ያብራራል። የተፈጠረውን ውጤታዊ ሁኔታም ያሳያል።
- source_word: τινες
  choice: አንዳንዶች
  rationale: በጉባኤው ውስጥ ያሉትን ያልተወሰኑ ጥቂት ሰዎች በአጭርና በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ጳውሎስ የቆሮንቶስ ሰዎችን ትዕቢት የሚወቅስበት አገላለጽ
  choice: ‘በትዕቢት ተነፍተዋል’ በማለት የመነፋትን ምስል መጠበቅ
  alternative: ‘ታብየዋል’ ወይም ‘ትዕቢተኞች ሆነዋል’
  rationale: ይህ አተረጓጎም የግሪኩን ምስላዊ አገላለጽና ጳውሎስ በ1 ቆሮንቶስ ውስጥ ደጋግሞ የሚጠቀምበትን ቃል ይጠብቃል፤ በትርጓሜ ብቻ አይተካውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በትዕቢት” የሚለው ማብራሪያ የ“ተነፍተዋል”ን ምስላዊ ኃይል ሳያጠፋ ትርጉሙን ግልጽ ያደርጋል።
