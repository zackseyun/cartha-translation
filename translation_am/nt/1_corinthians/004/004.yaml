- issue: የκύριος ማንነት
  choice: ጌታ
  alternative: ጌታ ኢየሱስ
  rationale: በዚህ ጥቅስ ግሪኩ ‘ጌታ’ ብቻ ይላል፤ በጳውሎስ አውድ ክርስቶስ ሊታሰብ ቢችልም ጽሑፉ ያልገለጸውን ስም አልተጨመረም።
