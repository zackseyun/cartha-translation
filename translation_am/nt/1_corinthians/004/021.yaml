  choice: «የየዋህነት መንፈስ»—በዋናነት የጳውሎስን አኳኋን ወይም ዝንባሌ የሚገልጽ
  alternative: «የየዋህነት መንፈስ»ን የመንፈስ ቅዱስ ሥራ እንደሚያመለክት መረዳት
  rationale: አውዱ ጳውሎስ በተግሣጽ ጥብቅነት ወይም በፍቅርና በየዋህነት ስለመምጣቱ ያነጻጽራል። በግሪኩ πνεῦμα ያለ መስተዋድድ በመምጣቱ የግል አኳኋን መሆኑ ይበልጥ ይመስላል፤ ሆኖም አገላለጹ ይህ የዋህነት በመንፈስ ቅዱስ የተሠራ መሆኑን አያስቀርም።
