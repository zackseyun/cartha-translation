  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: am
  text: ምን ትፈልጋላችሁ? በበትር ወደ እናንተ ልምጣ፣ ወይስ በፍቅርና በየዋህነት መንፈስ[a] ልምጣ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በፍቅርና በዋህ መንፈስ» ተብሎም ሊተረጎም ይችላል። «የየዋህነት መንፈስ» የጳውሎስን የዋህ አኳኋን ሊያመለክት ይችላል፤ አንዳንዶች ግን እዚህ የመንፈስ ቅዱስ ሥራ በተዘዋዋሪ እንደተጠቀሰ ይረዱታል።
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: τί θέλετε
  choice: ምን ትፈልጋላችሁ?
  rationale: የግሪኩን ቀጥተኛና ተግዳሮታዊ የንግግር ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ῥάβδῳ
  choice: በበትር
  rationale: ῥάβδος በቀጥታ በትርን ወይም ዱላን ያመለክታል፤ «በበትር» የተግሣጽን ምስላዊ ኃይል ያቆያል፣ «በቅጣት» ግን ምስሉን በመተርጎም ይገድበዋል።
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: ወደ እናንተ ልምጣ
  rationale: የውሳኔ ጥያቄውን በአማርኛ ተፈጥሯዊ በሆነው «ልምጣ?» አገባብ ያስተላልፋል።
- source_word: ἢ
  choice: ወይስ
  rationale: በሁለት አማራጮች መካከል ያለውን ግልጽ የጥያቄ ንጽጽር ያሳያል።
- source_word: ἐν ἀγάπῃ
  choice: በፍቅር
  rationale: ከ«በበትር» ጋር ያለውን ሰዋሰዋዊ ትይዩነት ይጠብቃል፤ ἀγάπηንም በተለመደው «ፍቅር» ይተረጉማል።
- source_word: πνεύματί τε πραΰτητος
  choice: በየዋህነት መንፈስ
  rationale: πνεῦμαን «መንፈስ» ብሎ በግልጽ ያቆያል፤ πραΰτηςን «የዋህነት» በማለት ገርነትን፣ እርጋታንና ቁጥጥር ያለበትን አቀራረብ ያመለክታል።
