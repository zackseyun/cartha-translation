  rationale: ከ‘ዓለም’ና ከ‘ሰዎች’ ጋር ያለው አገባብ ቃሉ ሰማያዊ ፍጥረታትን እንደሚያመለክት ያጠናክራል፤ ከጽሑፉ በላይ የሆነ የዶክትሪን ማብራሪያ አልተጨመረም።
- issue: የἐπιθανατίους የፍርድ ወይም የእጣ አንድምታ
  choice: ለሞት እንደተፈረደባቸው ሰዎች
  alternative: ለሞት እንደተመደቡ ሰዎች
  rationale: ዋናው ጽሑፍ የአደባባይ ሞትን ምስል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የቃሉ ሰፋ ያለ አማራጭ ግን በማስታወሻ ተጠብቋል።
