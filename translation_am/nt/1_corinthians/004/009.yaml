base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: am
  text: ምክንያቱም፣ እኔ እንደማስበው እግዚአብሔር እኛን ሐዋርያትን ከሁሉ በኋላ፣ በሞት እንደተፈረደባቸው ሰዎች[a] አድርጎ በይፋ አቅርቦናል፤ ለዓለም፣ ለመላእክትም ለሰዎችም ትዕይንት[b] ሆነናልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለሞት እንደተመደቡ ሰዎች” ተብሎም ሊተረጎም ይችላል። የግሪክ ቃል ἐπιθανατίους ለሞት የተወሰነባቸውን ሰዎች ያመለክታል፤ ምናልባትም የአደባባይ ትዕይንት ምስልን ያሳያል።
    reason: lexical_alternative
  - marker: b
    text: በቃል በቃል “ቲያትር” ማለት ነው፤ እዚህ ግን ለሁሉ የቀረበ መታያ ወይም ትዕይንት ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: እኔ እንደማስበው
  rationale: የጳውሎስን ግላዊ ግምት በተፈጥሯዊ አማርኛ ያሳያል፤ γάρ የሚያመለክተው ማብራሪያዊ ግንኙነት በአውዱ ይገኛል።
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: እኛን ሐዋርያትን
  rationale: ‘ሐዋርያትን’ የሚለው ቃል ‘እኛን’ የሚለውን በተጨማሪ የሚገልጥበትን የግሪክ አገባብ ይጠብቃል።
- source_word: ἐσχάτους ἀπέδειξεν
  choice: ከሁሉ በኋላ አድርጎ በይፋ አቅርቦናል
  rationale: ἐσχάτους የመጨረሻና የዝቅተኛ ስፍራን ምስል ይጠብቃል፤ ἀπέδειξεν ደግሞ በሕዝብ ፊት ማቅረብን ያመለክታል።
- source_word: ὡς ἐπιθανατίους
  choice: ለሞት እንደተፈረደባቸው ሰዎች
  rationale: ለሞት የተመደቡ ወይም የተወሰነባቸው ሰዎችን፣ ምናልባትም በአደባባይ የሚገደሉትን የሚያስታውስ ምስል፣ በግልጽ አማርኛ ያቀርባል።
- source_word: θέατρον ἐγενήθημεν
  choice: ትዕይንት ሆነናል
  rationale: θέατρον እዚህ የቲያትር ሕንፃን ሳይሆን ለሕዝብ የቀረበ መታያን ያመለክታል።
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: ለዓለም፣ ለመላእክትም ለሰዎችም
  rationale: ዓለምን እንደ አጠቃላይ ተመልካች ያቀርባል፤ መላእክትና ሰዎች የሚለውንም የሰማያዊና የሰብአዊ ተመልካቾች ንጽጽር ይጠብቃል።
theological_decisions:
- issue: የἀγγέλοις ትርጉም
  choice: መላእክት፣ ማለትም ሰማያዊ ፍጥረታት
