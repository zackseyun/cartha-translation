  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁለተኛ መደብ ነጠላ ወንድ ቅርጽ የግሪኩን σε/ἔλαβες/καυχᾶσαι በቀጥታ ይጠብቃል፤ ጥያቄዎቹም የጳውሎስን ቀጥተኛ የተግሣጽ ኃይል ይዘዋል።
