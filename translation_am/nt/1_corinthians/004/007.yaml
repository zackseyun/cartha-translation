  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: am
  text: ለመሆኑ፣ ማን ልዩ ያደርግሃል?[a] ያልተቀበልኸውስ ምን አለህ? ተቀብለኸው ከሆነስ፣ እንዳልተቀበልኸው ይመስል ለምን ትመካለህ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ማን ከሌሎች ይለይሃል?» የግሪኩ ግስ «መለየት፣ ልዩነት ማድረግ ወይም ልዩ ማድረግ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: ለመሆኑ፣ ማን ልዩ ያደርግሃል?
  rationale: «ልዩ ያደርግሃል» የδιακρίνειን ተውሳከ-ተሳቢ አጠቃቀምና በአውዱ ያለውን ከሌሎች የመብለጥ ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል። «ለመሆኑ» የγάρን ከቀደመው ተግሣጽ ጋር የሚያገናኝ የምክንያትና የአጽንዖት ኃይል በንግግራዊ ጥያቄ ያንጸባርቃል።
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: ያልተቀበልኸውስ ምን አለህ?
  rationale: የAmharic -ስ አያያዥ የδὲን ቀላል መሸጋገሪያ ያሳያል፤ አንጻራዊውን ሐረግ በጥያቄው ፊት ማስቀመጥም ተፈጥሯዊ አማርኛ ሲሆን፣ ያለው ነገር ሁሉ የተቀበለው መሆኑን ያጎላል።
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: ተቀብለኸው ከሆነስ
  rationale: ይህ አገላለጽ ወደ ቀደመው ያልተጠቀሰ ነገር በተሳቢ ቅጥያው ይመለሳል፤ -ስ የδὲን ግንኙነትና የκαὶን አጽንዖት በአጭር ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: τί καυχᾶσαι
  choice: ለምን ትመካለህ?
  rationale: «መመካት» ለጳውሎሳዊው καυχάομαι የተለመደና ክብር ያለው አቻ ሲሆን፣ እየቀጠለ ያለውን የትዕቢት አቋም ይገልጣል።
- source_word: ὡς μὴ λαβών
  choice: እንዳልተቀበልኸው ሆነህ
  rationale: የግሪኩን ከእውነታው ተቃራኒ የሆነ የአኳኋን ንጽጽር—እንዳልተቀበለ ሆኖ መመካት—በግልጽ ያስተላልፋል።
theological_decisions:
- issue: የሰው ልዩነትና የተቀበለው ነገር ወሰን
  choice: ቃሉ ማንኛውም ልዩነት፣ ይዞታ ወይም ሁኔታ ከራስ የመነጨ ሳይሆን የተቀበሉት መሆኑን በሰፊው እንዲያመለክት ተተርጉሟል።
  alternative: ትርጉሙን በመንፈሳዊ ስጦታዎችና በአገልግሎት ሚናዎች ብቻ መወሰን፣ ወይም በግልጽ ሁሉንም ችሎታ፣ ደረጃና በረከት ያካትታል ብሎ ማስፋት።
  rationale: ቅርብ አውዱ ስለ ሐዋርያዊ አገልግሎት፣ ወገንተኝነትና መመካት ይናገራል፤ የጥቅሱ ቃላት ግን አጠቃላይ ናቸው። ስለዚህ ትርጉሙ ከጽሑፉ በላይ ሳያጠብ ወይም ሳያሰፋ ይህን ስፋት ጠብቋል።
