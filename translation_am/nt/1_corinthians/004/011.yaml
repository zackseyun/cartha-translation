  source_fidelity: The draft accurately renders the temporal phrase, hunger, thirst, inadequate clothing, and lack of a fixed dwelling. However, እንደበደባለን does not reliably express the Greek present passive κολαφιζόμεθα ('we are being struck/beaten') and must be corrected to an unambiguously passive, ongoing form.
