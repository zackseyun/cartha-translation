  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: am
  text: ነገር ግን ጌታ ቢፈቅድ፣ በቅርቡ ወደ እናንተ እመጣለሁ፤ በትዕቢት የተነፉ ሰዎችን[a] ንግግር ሳይሆን ኃይል አውቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በትዕቢት የተነፉ ሰዎች” የሚለው ጳውሎስ በዚህ መልእክት በትዕቢት ወይም በኩራት የተሞሉ ሰዎችን ለመግለጽ ደጋግሞ የሚጠቀምበትን ዘይቤያዊ ቃል ያስተላልፋል።
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι
  choice: እመጣለሁ
  rationale: የግሪኩን ቀላል የወደፊት ጊዜ ያስተላልፋል፤ ጳውሎስ ወደ ቆሮንቶስ ሰዎች መምጣቱን ከእነርሱ አንጻር ይናገራል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው አሳብ ጋር ያለውን መጠነኛ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ταχέως
  choice: በቅርቡ
  rationale: እዚህ ቃሉ የድርጊትን ፍጥነት ብቻ ሳይሆን ቅርብ ጊዜን ያመለክታል።
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: ጌታ ቢፈቅድ
  rationale: የጳውሎስ እቅድ በጌታ ፈቃድ ላይ የተመሠረተ መሆኑን በተፈጥሯዊና ታማኝ አገላለጽ ያቀርባል።
- source_word: γνώσομαι
  choice: እመረምራለሁ
  rationale: ቃሉ በቀጥታ ‘አውቃለሁ’ ሊባል ቢችልም፣ በግል ሄዶ እውነተኛውን ሁኔታ መፈተሽና ማወቅ የሚለውን ዐውደ-ንባባዊ ኃይል ‘እመረምራለሁ’ በግልጽ ያስተላልፋል።
- source_word: τὸν λόγον
  choice: ንግግር
  rationale: λόγος እዚህ ከδύναμις ጋር ተቃርኖ ውስጥ ስለሆነ፣ የቃል አገላለጽን ሳያጠብ የሚገልጽ መደበኛ አማርኛ ነው።
- source_word: τῶν πεφυσιωμένων
  choice: በትዕቢት የተነፉት
  rationale: የግሪኩን የመነፋት ዘይቤ እና በኩራት ውስጥ የቆዩበትን ሁኔታ ይጠብቃል።
- source_word: τὴν δύναμιν
  choice: ኃይላቸውን
  rationale: ከንግግራቸው ጋር ያለውን አጭርና ጠንካራ ተቃርኖ ይጠብቃል፤ የአማርኛው ባለቤትነት ቅጥያ ኃይሉ የተነፉት ሰዎች ነው ብለው ከሚሉት ነገር ጋር የሚነጻጸረው መሆኑን በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: “ጌታ” የሚለው ማንን እንደሚያመለክት
  choice: ጌታ
  alternative: ጌታ ኢየሱስ / እግዚአብሔር
  rationale: የግሪኩ ጽሑፍ ὁ κύριος ብቻ ይላል። ጥቅሱ ያልገለጸውን ማንነት በትርጉሙ ሳይጨምር ያለውን ሥነ-መለኮታዊ ክፍትነት ይጠብቃል።
- issue: በλόγος እና δύναμις መካከል ያለው ተቃርኖ
  choice: ንግግር ከኃይል ጋር በሰፊ ትርጉም እንዲነጻጸር ማድረግ
  alternative: የአስተምህሮ ይዘት ከተአምራዊ ኃይል ጋር፣ ወይም ንግግራዊ ችሎታ ከሐዋርያዊ ሥልጣን ጋር ብቻ ማነጻጸር
  rationale: ዐውደ-ንባቡ ትዕቢተኞችንና የእግዚአብሔርን መንግሥት ይመለከታል፤ ጽሑፉ ግን ኃይሉን ወደ አንድ ብቻ መገለጫ አያጠብም።
translation_notes:
  register: ዘመናዊ፣ መደበኛና ክብር ያለው አማርኛ ተጠቅሟል። የግሪኩ የመነፋት ዘይቤ ተጠብቆ ትርጉሙ በእግር ማስታወሻ ተብራርቷል፤ የ‘ንግግር—ኃይል’ ተቃርኖም ሳይጠብ ቀርቧል።
