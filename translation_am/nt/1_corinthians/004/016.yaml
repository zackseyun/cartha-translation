  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: am
  text: ስለዚህ እለምናችኋለሁ፤ እኔን የምትመስሉ ሁኑ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእኔን አርአያ ተከተሉ።”
    reason: lexical_alternative
  - marker: b
    text: ጳውሎስ በሌላ ስፍራ፣ “እኔ ደግሞ መሲሑን እንደምመስል፣ እናንተም እኔን ምሰሉ” ብሎ ይገልጻል (1 ቆሮ 11፥1)።
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: እለምናችኋለሁ
  rationale: በዚህ የምክርና የጥሪ አውድ የግሪኩን ጽኑ ልመና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ተራ ጥያቄን ብቻ አያመለክትም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ክርክር የሚወጣውን ድምዳሜና ምክንያታዊ ትስስር በግልጽ ሁኔታ ያሳያል።
- source_word: ὑμᾶς
  choice: -አችኋለሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተሳቢነቱ በግሱ ውስጥ በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: μιμηταί
  choice: የምትመስሉ
  rationale: የሌላውን አርአያ መከተልና እንደ እርሱ መሆንን የሚያመለክተውን μιμητής በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ተከታዮች’ ከሚለው ይበልጥ ትክክለኛ ነው።
- source_word: μου
  choice: እኔን
  rationale: ጳውሎስ ራሱ በቀጥታ የሚመሰል አርአያ መሆኑን ያሳያል።
- source_word: γίνεσθε
  choice: ሁኑ
  rationale: የአሁን ጊዜ ትእዛዛዊውን ጥሪ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ እንዲህ ያለውን ሁኔታ እንዲይዙ የሚጠራውን γίνεσθε ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ ራሱን እንዲመስሉት የሚያቀርበው ጥሪ ከሰፊው ክርስቶስን ማዕከል ካደረገ አውድ ተለይቶ ሊጋነን ይችላል፤ ይህ ቁጥር ግን ጳውሎስን በግልጽ አርአያ ያደርጋል።
  choice: ዋናው ጽሑፍ ‘እኔን የምትመስሉ ሁኑ’ ብሎ ቀጥተኛውን አነጋገር ይጠብቃል።
  alternative: ‘የእኔን አርአያ ተከተሉ’ ወይም ‘እኔን ተከተሉ’
  rationale: የግሪኩ ንባብ ጳውሎስን የመምሰል ቀጥተኛ ጥሪ ነው። ይህን ማለስለስ ከምንጩ ግልጽነት ያርቃል፤ ከ1 ቆሮንቶስ 11፥1 ጋር ያለው ክርስቶስን ማዕከል ያደረገ አውድ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እለምናችኋለሁ’ የጥሪውን ጽናት ሲያሳይ፣ ‘እኔን የምትመስሉ ሁኑ’ የምንጩን ቀጥተኛ ቅርጽና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
