base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: am
  text: ወንድሞች ሆይ፣[a] እነዚህን ነገሮች ለእናንተ ስል ለምሳሌ ወደ ራሴና ወደ አጵሎስ አዛውሬአቸዋለሁ፤ እንዲህም በእኛ ምሳሌ፣ “ከተጻፈው አትለፉ”[b] የሚለውን እንድትማሩ፣ ከዚያም አንዱን ደግፋችሁ በሌላው ላይ በኩራት እንዳትነፉ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች ሆይ”፤ በግሪክ “ወንድሞች” የሚለው ቃል ወንዶችና ሴቶች ያሉበትን ቡድን ሊያመለክት ይችላል።
    reason: cultural_note
  - marker: b
    text: የግሪኩ አገላለጽ አጭርና ግስ አልባ ነው፤ ቃል በቃል፣ “ከተጻፈው በላይ አትለፉ” የሚል የታመቀ ሐረግ ነው። መርሕ ቃል ወይም አጭር አባባል ሊሆን ይችላል።
    reason: lexical_alternative
