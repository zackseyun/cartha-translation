  rationale: ቀደም ያለውን ክርክር ለምሳሌ ወደ ራሱና ወደ አጵሎስ እንዳዛወረው በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δι’ ὑμᾶς
