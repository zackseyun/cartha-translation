  rationale: የግሪኩን አጭርና ግስ አልባ አገላለጽ በአማርኛ ሊገባ በሚችል የማስጠንቀቂያ ቅርጽ ያቀርባል፤ የምንባቡ መጨመቅ በማስታወሻ ተጠብቋል።
