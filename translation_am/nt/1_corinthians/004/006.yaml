  rationale: የጳውሎስን የመነፋት ምስላዊ አነጋገር ጠብቆ የኩራትን ትርጉም ግልጽ ያደርጋል።
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: አንዱን ደግፎ በሌላው ላይ
  rationale: በጉባኤው ውስጥ አንዱን ወገን በሌላው ላይ የማበላለጥን ከፋፋይ ዝንባሌ በተፈጥሯዊ አማርኛ ያሳያል።
