  rationale: በዐውዱ ያለውን የተጠቃሚነትና የእረኝነት ዓላማ ያስተላልፋል።
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: በእኛ ምሳሌ ... እንድትማሩ
  rationale: ἐν ἡμῖν ያለውን የታመቀ አገላለጽ ጳውሎስና አጵሎስ የትምህርቱ ምሳሌ እንደሆኑ በግልጽ አማርኛ ይገልጻል።
