id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: am
  text: ሰው እንዲህ ይቁጠረን፤ የመሲሑ[a] አገልጋዮችና የእግዚአብሔር ምሥጢራት መጋቢዎች እንደሆንን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: መሲሕ፦ ወይም «ክርስቶስ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: እንዲህ
  rationale: የግሪኩን የአኳኋን አመልካች ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: λογιζέσθω
  choice: ይቁጠረን
  rationale: በዚህ አውድ ያለውን ‘እንደዚህ ይመልከተን/ይገምተን’ የሚለውን የትእዛዝ ሐሳብ በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ቃሉ እዚህ አጠቃላይ ነው፤ ‘ሰው’ የጾታ ገደብ ሳይጨምር ይህን አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑπηρέτας
  choice: አገልጋዮች
  rationale: ከባርነት ይልቅ በክርስቶስ ሥር ያለ ተገዢ አገልግሎትን ያመለክታል።
- source_word: Χριστοῦ
  choice: የክርስቶስ
  rationale: ‘ክርስቶስ’ በአማርኛ የተለመደው የΧριστός አቻ ሲሆን የማዕረጉን ትርጉም የግርጌ ማስታወሻው ያብራራል።
- source_word: οἰκονόμους
  choice: መጋቢዎች
  rationale: በባለቤት የተሰጠውን ነገር በአደራ የሚያስተዳድር ሰው የሚለውን የቃሉን ምሳሌያዊ ኃይል ይጠብቃል።
- source_word: μυστηρίων θεοῦ
  choice: የእግዚአብሔር ምሥጢራት
  rationale: የግሪኩን ብዙ ቁጥርና የባለቤትነት/ምንጭ ግንኙነት ሳያብራራ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: የክርስቶስ
  alternative: የመሲሑ
  rationale: ‘ክርስቶስ’ ለአማርኛ አንባቢ የታወቀና ከግሪኩ ቅርጽ ጋር ቀጥተኛ የሆነ አቻ ነው፤ ቃሉ እዚህ ማዕረግ መሆኑን ለማሳየት ‘መሲሕ/የተቀባው’ የሚለው በማስታወሻ ተገልጧል።
- issue: የἄνθρωπος አጠቃላይ ኃይል
  choice: ሰው
  alternative: ማንም ሰው
  rationale: ነጠላው የግሪክ ቃል በዚህ አውድ ሁሉን አቀፍ ነው። ‘ሰው’ በአማርኛ ይህን ኃይል በተፈጥሮ ስለሚይዝ ያልተገለጸውን ‘ማንም’ አልጨመርንም።
- issue: የμυστηρίων ሥነ መለኮታዊ ይዘት
  choice: ምሥጢራት
  alternative: የተገለጡ ምሥጢራት
  rationale: ጽሑፉ በራሱ ‘የተገለጡ’ አይልም፤ ስለዚህ የጳውሎስን ቃልና ያለውን ሥነ መለኮታዊ ውጥረት ሳንፈታ ጠብቀናል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። ‘መጋቢዎች’ የአደራ አስተዳዳሪነትን ምሳሌ ይጠብቃል፤ የቤተ ክርስቲያን ልዩ ማዕረግ እንዳይመስል የ‘ምሥጢራት’ ተጨማሪ ገላጭ አውድ አብሮት ቀርቧል።
