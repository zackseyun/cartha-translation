    text: መሲሕ፦ ወይም «ክርስቶስ»።
    reason: lexical_alternative
  revision_rationale: The revision removes the misleading comparative repetition, retains the source’s generic singular and imperative force, and renders Χριστοῦ as the title ‘Messiah’ in line with the audit trail. No theological explanation has been added to the main text.
