  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: am
  text: የእግዚአብሔር መንግሥት በቃል[a] ሳይሆን በኃይል ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «በንግግር»፣ «በባዶ ቃላት»፤ ንፅፅሩ ባዶ ንግግርን ከውጤታማ ኃይል ጋር ያነፃፅራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: … ሳይሆን … ነውና
  rationale: γάρ ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ትስስር ለማሳየት በአማርኛ ተፈጥሯዊ የሆነው «ነውና» በአረፍተ ነገሩ መጨረሻ ተቀምጧል፤ οὐ … ἀλλά ደግሞ «… ሳይሆን …» ተብሎ ተተርጉሟል።
- source_word: ἐν λόγῳ
  choice: በቃል
  rationale: λόγος እዚህ «ቃል»፣ «ንግግር» ወይም «ወሬ» ሊሆን ይችላል። «በቃል» የግሪኩን አጭርና ጎልቶ የሚታይ ንፅፅር ይጠብቃል፤ የተፈለገው ትርጉም ባዶ ንግግር መሆኑን የግርጌ ማስታወሻው ያብራራል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: ይህ በአማርኛ የተለመደና ትክክለኛ አገላለጽ ሲሆን፣ βασιλεία የሚያመለክተውን ንግሥናም ሆነ የመንግሥት ግዛት አስቀድሞ ወደ አንዱ ሳያጠብ ይጠብቃል።
- source_word: ἀλλ’ ἐν δυνάμει
  choice: ሳይሆን በኃይል
  rationale: δύναμις በቀጥታ «ኃይል» ማለት ነው፤ ከλόγος ጋር ያለውን የንግግርና ውጤታማ ኃይል ተቃርኖ በግልጽ ያስቀምጣል።
theological_decisions:
- issue: በ«ቃል»ና በ«ኃይል» መካከል ያለው ንፅፅር
  choice: ጥቅሱ ባዶ ንግግርን ከውጤታማ ኃይል ጋር እንደሚያነፃፅር በሰፊው ተተወ።
  alternative: «ኃይል»ን በተለይ እንደ ተአምራት፣ የተለወጠ ሕይወትና የቤተ ክርስቲያን ተግሣጽ፣ የሐዋርያነት ሥልጣን ወይም በጠባብ ትርጉም የመንፈስ ሥራ አድርጎ መወሰን።
  rationale: የግሪኩ ጽሑፍ ከአጠቃላዩ ንፅፅር በላይ የኃይሉን ዓይነት አይወስንም፤ ስለዚህ ትርጉሙ ይህን ሥነ መለኮታዊ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ነውና» የምክንያት ትስስሩን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
