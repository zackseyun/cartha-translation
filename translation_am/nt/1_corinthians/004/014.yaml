  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: am
  text: እነዚህን የምጽፍላችሁ ላሳፍራችሁ[a] አይደለም፤ ነገር ግን እንደ የምወዳቸው ልጆቼ ለማረም ልመክራችሁ[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንድታፍሩ ላደርጋችሁ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንደ የምወዳቸው ልጆቼ ላስጠነቅቃችሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: ላሳፍራችሁ
  rationale: ከአሉታዊው Οὐκ ጋር የጳውሎስን ዓላማ ወይም አካሄድ ያሳያል፤ ‘ማሳፈር’ የክብርና የእፍረትን ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: γράφω ταῦτα
  choice: እነዚህን የምጽፍላችሁ
  rationale: የአሁኑን የመጻፍ ተግባርና የταῦταን ብዙ ቁጥር ያቆያል፤ ‘ላችሁ’ ደግሞ ተቀባዮቹን በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ἀλλ’
