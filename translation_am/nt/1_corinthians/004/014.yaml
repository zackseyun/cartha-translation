  rationale: በማሳፈርና በፍቅር መምከር መካከል ያለውን ግልጽ ንጽጽር ይጠብቃል።
- source_word: ὡς
  choice: እንደ
  rationale: ጳውሎስ ምክሩን የሚሰጥበትን የዝምድና መሠረት ያለ ትርጓሜ ጭማሪ ያቆያል።
- source_word: τέκνα μου ἀγαπητὰ
  choice: ተወዳጅ ልጆቼ
  rationale: τέκνα ሁለቱንም ፆታዎች የሚያካትት የልጅነት ግንኙነት ነው፤ ‘ተወዳጅ’ ደግሞ የἀγαπητάን ፍቅርና ሞቅታ ይጠብቃል።
- source_word: νουθετῶν
  choice: እየመከርኳችሁ
  rationale: ቃሉ ማስጠንቀቅን፣ ማስተማርንና ለማረም መምከርን ያካትታል፤ ‘መምከር’ በዘመናዊ አማርኛ የእርማት ኃይሉንና የአባታዊ ፍቅሩን በአንድነት ያስተላልፋል።
theological_decisions:
- issue: የጳውሎስ የእርማት ንግግር እረኛዊ ድምፀት
  choice: እንደ ተወዳጅ ልጆቼ እየመከርኳችሁ ነው
  alternative: እንደ ተወዳጅ ልጆቼ እያስጠነቀቅኳችሁ ነው
  rationale: የἐντρέπων አሉታዊ አገላለጽና የνουθετῶν አዎንታዊ አገላለጽ ተግሣጹን በፍቅር የተሞላ የልጅነት ግንኙነት ውስጥ ያኖሩታል። ‘እየመከርኳችሁ’ የእርማቱን ኃይል ሳያጠፋ የግንኙነቱን ርኅራኄ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአሁን ጊዜ አሳታፊ ቅርጽ በ‘እየመከርኳችሁ’ ተጠብቋል፤ የνουθετέω የማስጠንቀቅ ገጽታ በእግር ማስታወሻ ቀርቧል።
