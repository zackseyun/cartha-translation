  choice: ወይም በሰው ፍርድ
  rationale: ቃል በቃል «በሰው ቀን» የሚለውን ፈሊጣዊ አገላለጽ እንደ ሰው ግምገማ ወይም ፍርድ ያስተላልፋል፤ ከአውዱ የሚገኘውን ከጌታ ፍርድ ጋር ያለውን ንጽጽርም ይጠብቃል።
