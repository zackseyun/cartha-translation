  text: እኔ ግን በእናንተ ወይም በሰው ፍርድ[a] መመርመሬ ለእኔ እጅግ ትንሽ ነገር ነው፤ ነገር ግን ራሴን እንኳ አልመረምርም።
  philosophy: optimal-equivalence
  footnotes:
