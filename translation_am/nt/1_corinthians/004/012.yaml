id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: am
  text: በገዛ እጆቻችን እየሠራን እንደክማለን፤ ስንሰደብ እንመርቃለን፤ ስንሳደድም እንታገሣለን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: እንደክማለን
  rationale: ቃሉ ብዙ ጥረትና ድካም ያለበትን ሥራ ያመለክታል፤ ‘እንደክማለን’ ይህን ከተራ መሥራት ለይቶ ያሳያል።
- source_word: ἐργαζόμενοι
  choice: እየሠራን
  rationale: አሳታፊው የሐዋርያቱ ድካም በእጅ ሥራ እንደሆነ ይገልጣል፤ ዓላማውን ከጽሑፉ በላይ ሳያሰፋ ተተርጉሟል።
- source_word: ταῖς ἰδίαις χερσίν
  choice: በገዛ እጆቻችን
  rationale: ἰδίαις የሚሰጠውን አጽንዖት በ‘ገዛ’ በማስቀመጥ የራሳቸውን የእጅ ሥራ ያሳያል።
- source_word: λοιδορούμενοι
  choice: ስንሰደብ
  rationale: ተገብሮ የተደረገውን የቃል ጥቃት በተፈጥሯዊና በዘመናዊ አማርኛ ያቀርባል።
- source_word: εὐλογοῦμεν
  choice: እንመርቃለን
  rationale: እርግማንን ወይም ስድብን በበጎ ቃልና በምርቃት መመለስን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διωκόμενοι
  choice: ስንሳደድ
  rationale: በጳውሎሳዊው አውድ ያለውን የጠላትነት ስደት በግልጽ ሁኔታ ያሳያል።
- source_word: ἀνεχόμεθα
  choice: እንታገሣለን
  rationale: የሚደርስባቸውን ስደት ተቋቁመው መጽናታቸውን ይገልጣል፤ በግሪኩ ያልተገለጸ ቀጥተኛ ተሳቢ አልተጨመረም።
theological_decisions:
- issue: ለበደል የሚሰጥ ሥነ ምግባራዊ ምላሽ
  choice: ጥቅሱ ሐዋርያቱ ስድብን በምርቃት፣ ስደትንም በትዕግሥት እንደተቀበሉ የሚገልጽ ሆኖ ተተርጉሟል።
  alternative: ንግግሩን ቀጥተኛና አጠቃላይ ትእዛዝ አድርጎ ማቅረብ።
  rationale: የግሪኩ ጽሑፍ በአሁን ጊዜ የሐዋርያቱን ተግባር ይተርካል፤ ያለውን ሥነ ምግባራዊ ኃይል ጠብቆ ከጽሑፉ በላይ ወደ መደበኛ ትእዛዝ አልተስፋፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሦስት ተከታታይ ሐረጎች ምትና ተቃርኖ በአማርኛውም ተጠብቋል። የእንግሊዝኛው [a] ምልክት ከ‘labor’ ጋር የተያያዘ ቢመስልም የማስታወሻው ይዘት ‘reviled’ የሚለውን አማራጭ ይመለከታል፤ በአማርኛ ‘ስንሰደብ’ የλοιδορούμενοιን ፍቺ በቀጥታና በግልጽ ስለሚያስተላልፍ ማስታወሻ አልተጨመረም።
