  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: am
  text: ስለዚህ ጊዜው ሳይደርስ[a]፣ ጌታ እስኪመጣ ድረስ ምንም ነገር አትፍረዱ። እርሱም በጨለማ የተሰወሩትን ነገሮች ወደ ብርሃን ያወጣል፤ የልቦችንም ዓላማዎች[b] ይገልጣል[c]። በዚያን ጊዜ እያንዳንዱ ከእግዚአብሔር ምስጋናን ያገኛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከጊዜው በፊት” ወይም “ያለጊዜው።” የግሪኩ አገላለጽ ተገቢው ጊዜ ሳይደርስ ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የልቦችን አሳቦች” ወይም “ውስጣዊ ዓላማዎች።”
    reason: lexical_alternative
  - marker: c
    text: ማለትም፣ ጌታ ሲመጣ የተሰወሩትን ነገሮች ገልጦ የሚያደርገውን የመጨረሻ ግምገማ ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μὴ πρὸ καιροῦ
  choice: ጊዜው ሳይደርስ ... አትፍረዱ
  rationale: πρὸ καιροῦ ተገቢው ጊዜ ከመድረሱ በፊት ማድረግን ያመለክታል፤ ‘የተወሰነው’ የሚል በግሪኩ ያልተገለጸ ቃል አልተጨመረም።
- source_word: τι κρίνετε
  choice: በምንም ነገር አትፍረዱ
  rationale: τι የክልከላውን ስፋት ያሳያል፤ አገላለጹም በአማርኛ ግልጽ ነው።
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: ጌታ እስኪመጣ ድረስ
  rationale: የክልከላውን የጊዜ ወሰን በቀጥታ ይጠብቃል፤ κύριος በተለመደው መጠሪያ ‘ጌታ’ ተተርጉሟል።
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: በጨለማ የተሰወሩትን ነገሮች ወደ ብርሃን ያወጣል
  rationale: የφωτίσειን ዘይቤያዊ የመግለጥ ትርጉም እና የጨለማውን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: የልቦችንም ዓላማዎች ይገልጣል
  rationale: βουλαί ዓላማ፣ ሐሳብ ወይም ውስጣዊ አሳብ ሊሆን የሚችለውን ስፋት በ‘ዓላማዎች’ ይይዛል፤ የ‘ልቦች’ ብዙ ቁጥርም ተጠብቋል።
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: እያንዳንዱ ከእግዚአብሔር ምስጋናን ያገኛል
  rationale: የግሪኩን አከፋፋይ ἑκάστῳ እና የምስጋናውን ምንጭ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: የፍርዱ ወሰንና ጊዜ
  choice: የጌታን መምጣትና የተሰወረውን መግለጥ ሳይጠብቁ አስቀድሞ መፍረድን ይከለክላል።
  alternative: ጥቅሱ ማንኛውንም ዓይነት መለየት ወይም ፍርድ ፈጽሞ ይከለክላል።
  rationale: πρὸ καιροῦ እና ἕως ἂν ἔλθῃ ὁ κύριος ክልከላውን ከወደፊቱ የጌታ መምጣትና ግምገማ ጋር ያያይዙታል፤ ትርጉሙ ይህን የጊዜ ውጥረት ሳያጠብ ይጠብቃል።
- issue: የ‘ጌታ’ ማንነት
  choice: በወደፊቱ መምጣቱ የሚፈርደውን ኢየሱስን ያመለክታል።
  alternative: በአጠቃላይ እግዚአብሔርን ያመለክታል።
  rationale: በጳውሎስ አጠቃቀምና በመምጣቱ አውድ ὁ κύριος ኢየሱስን በተፈጥሮ ያመለክታል፤ ሆኖም ትርጉሙ ስሙን በማከል ሳይተረጉም ‘ጌታ’ የሚለውን መጠሪያ ብቻ ይጠብቃል።
- issue: ‘እያንዳንዱ ምስጋናን ያገኛል’ የሚለው አገላለጽ
  choice: የእያንዳንዱ ተገቢ ምስጋና ከእግዚአብሔር ይመጣል ብሎ የጽሑፉን አዎንታዊ አገላለጽ ይጠብቃል።
  alternative: አንዳንዶች ምስጋና ላያገኙ ይችላሉ ብሎ በትርጉሙ ውስጥ ማብራራት።
  rationale: ግሪኩ ἑκάστῳ እና ὁ ἔπαινος የሚሉትን በአዎንታዊ መልኩ ይጠቀማል፤ የመጨረሻውን ውጤት ከጽሑፉ በላይ መወሰን አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ወደ ብርሃን ያወጣል’ የግሪኩን ዘይቤ ተፈጥሯዊ በሆነ መልኩ ይጠብቃል፤ የግሪክ ረጅም ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሦስት ዓረፍተ ነገሮች ተከፍሏል።
