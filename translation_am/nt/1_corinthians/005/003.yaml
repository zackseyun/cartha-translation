  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: am
  text: 'ምክንያቱም እኔ፣ በሥጋ ባልገኝም በመንፈስ ግን እገኛለሁ[b]፤ በዚያ እንደተገኘሁ አድርጌ፣ ይህን ነገር እንዲህ ያደረገውን አስቀድሜ ፈርጃለሁ[a]።


    [a] ወይም፣ “አስቀድሜ ፍርድ ሰጥቻለሁ።”


    [b] “በመንፈስ እገኛለሁ” የሚለው ከቅዱስ መንፈስ ይልቅ የጳውሎስን የራሱን መንፈስ የሚያመለክት ይመስላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አስቀድሜ ፍርድ ሰጥቻለሁ።”
    reason: lexical_alternative
  - marker: b
    text: “በመንፈስ እገኛለሁ” የሚለው ከቅዱስ መንፈስ ይልቅ የጳውሎስን የራሱን መንፈስ የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: በሥጋ ባልገኝም
  rationale: የግሪኩን ከአካላዊ መገኘት አንጻር የተነገረ መቅረት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሞትን ወይም ነፍስ ከሥጋ መለየቷን አያመለክትም።
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: በመንፈስ ግን እገኛለሁ
  rationale: ከሥጋዊ አለመገኘት ጋር ያለውን ቀጥተኛ ንጽጽር ይጠብቃል፤ “መንፈስ” የጳውሎስ መንፈስ ወይም መንፈሳዊ መገኘቱ በሚል ያለውን የአገላለጹን ስፋት አይዘጋም።
- source_word: ἤδη κέκρικα
  choice: አስቀድሜ ፈርጃለሁ
  rationale: ፍርዱ አስቀድሞ ተደርሶበት አሁንም ተፈጻሚ መሆኑን የፍጹም ጊዜውን ኃይል ይጠብቃል።
- source_word: ὡς παρὼν
  choice: በዚያም እንዳለሁ
  rationale: ጳውሎስ በአካል በዚያ ያለ ያህል ፍርዱን መስጠቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν ... κατεργασάμενον
  choice: ባደረገው ሰው ላይ
  rationale: በስም ተግባር የቆመውን የግሪክ ተሳቢ አካል በአማርኛ ግልጽ ያደርጋል፤ “ፈጸመ” ብሎ ድርጊቱን ከሚተረጉመው በላይ አይገድበውም።
- source_word: οὕτως τοῦτο
  choice: ይህን ነገር እንዲህ
  rationale: τοῦτο የሚያመለክተውን ድርጊትና οὕτως የሚያጎላውን አስደንጋጭ አደራረግ ሁለቱንም ሳያጠፋ ያቀርባል።
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት ያሳያል።
- source_word: μὲν ... δὲ
  choice: ባልገኝም ... ግን እገኛለሁ
  rationale: የሁለቱን ሐረጎች ተቃርኖ በአማርኛ ተፈጥሯዊ በሆነ የማስማሚያና የተቃርኖ አወቃቀር ያስተላልፋል።
theological_decisions:
- issue: “በመንፈስ እገኛለሁ” የሚለው ትርጉም
  choice: ጳውሎስ በአካል ባይገኝም በራሱ መንፈስ፣ በአሳብና በፍርድ ከጉባኤው ጋር መገኘቱን ይናገራል።
  alternative: የቅዱስ መንፈስን መገኘት ወይም ልዩ ምሥጢራዊ መገኘትን ያመለክታል።
  rationale: σώματι እና πνεύματι ያላቸው ቀጥተኛ ንጽጽር በተፈጥሮ የጳውሎስን ሥጋና መንፈስ ያመለክታል። ዋናው ትርጉም ግን አገላለጹን ሳይፈታ ስለሚያቆየው የመገኘቱን ሁኔታ ከሚገባው በላይ አይወስንም።
