  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በሥጋ” እና “በመንፈስ” የሚለው መጽሐፍ ቅዱሳዊ ንጽጽር ተጠብቋል፤ የግሪኩ ረዥም ሐረግ ግን በሥርዓተ ነጥብ ተከፍሎ እንዲነበብ ቀላል ተደርጓል።
