id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: am
  text: ትምክህታችሁ መልካም አይደለም። ጥቂት እርሾ ሊጡን ሁሉ እንደሚያቦካ አታውቁምን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὸν
  choice: መልካም
  rationale: በዚህ አውድ የቆሮንቶስ ሰዎችን ትምክህት በሥነ ምግባርና በተገቢነት ይገመግማል፤ «መልካም» ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: καύχημα
  choice: ትምክህታችሁ
  rationale: ስሙ የመመካትን ድርጊት ወይም የትምክህትን ነገር ሊያመለክት ይችላል። «ትምክህታችሁ» የግሪኩን አሻሚነት በአጭርና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὐκ οἴδατε
  choice: አታውቁምን?
  rationale: የጳውሎስን የአጻጻፍ ልማድና የግሪኩን የአጽንዖት ጥያቄ በቀጥታ ያስተላልፋል።
- source_word: μικρὰ ζύμη
  choice: ጥቂት እርሾ
  rationale: «እርሾ» የጥንቱን የዳቦ ማቡካት ምስልና ዘይቤያዊ ኃይል ይጠብቃል፤ «ጥቂት» ደግሞ μικράን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὅλον τὸ φύραμα
  choice: ሊጡን ሁሉ
  rationale: φύραμα ተቦክቶ የተዘጋጀን ሊጥ ያመለክታል። «ሊጡን ሁሉ» የὅλονን ሙሉነት ግልጽና ዘመናዊ በሆነ አገላለጽ ያቀርባል።
- source_word: ζυμοῖ
  choice: ያቦካ
  rationale: ግሱ እርሾ ሊጡን እንዲቦካ ማድረጉን ያመለክታል። «ያቦካ» በአማርኛ የመጋገር አውድ የተለመደና ግልጽ ነው።
theological_decisions:
- issue: የእርሾው ዘይቤያዊ ምስል
  choice: የእርሾውን ምስል ሳይተረጉሙ እንዳለ ማቆየት
  alternative: «ጥቂት ኃጢአት ማኅበሩን ሁሉ ያበላሻል» ብሎ ትርጉሙን በግልጽ መጨመር
  rationale: ጳውሎስ በቁጥሩ ውስጥ ምሳሌያዊ አባባሉን ነው የሚናገረው፤ ሥነ ምግባራዊ አተገባበሩን አውዱ ያሳያል። ትርጉሙ በግሪኩ ያልተገለጸውን ትርጓሜ መጨመር የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖታዊ ጥያቄ ተጠብቋል። የእንግሊዝኛው [a] ማስታወሻ ከጽሑፉ ጋር አይዛመድም፤ ምልክቱ καλόν ላይ ቢቀመጥም ይዘቱ φύραμαን ይመለከታል። አማርኛው «ሊጡን ሁሉ» የሚለውን ትርጉም ግልጽ ስለሚያደርግ የግድ የሆነ ማስታወሻ አልተጨመረም።
