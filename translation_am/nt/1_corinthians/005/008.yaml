  source_fidelity: The draft preserves the inferential exhortation and the festival/leaven imagery, but it omits the essential meaning of ἀζύμοις (“unleavened”) in the main text. Also, ግፍ (“oppression/injustice”) is too narrow for πονηρία (“wickedness/evil”).
