    text: ግሪኩ ቃል በቃል፣ “በቅንነትና በእውነት ባልቦኩ [ነገሮች]” ይላል፤ “ቂጣ” የሚለው የፋሲካን ምስል ግልጽ ለማድረግ ተጨምሯል።
    reason: lexical_alternative
  - marker: b
