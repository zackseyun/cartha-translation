  text: ስለዚህ በአሮጌ እርሾ፣ ወይም በክፋትና በክፉነት እርሾ ሳይሆን፣ በቅንነትና በእውነት ባልቦካ ቂጣ[a] በዓሉን እናክብር[b]።
  philosophy: optimal-equivalence
  footnotes:
