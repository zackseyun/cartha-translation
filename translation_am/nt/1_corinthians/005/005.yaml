  rationale: በዐውዱ የተጠቀሰውን ወንድ ጥፋተኛ በግልጽ ሁኔታ ያመለክታል፤ በተመሳሳይም ጊዜ የግሪኩን አመዳደባዊ ቃና ይጠብቃል።
- source_word: Σατανᾷ
