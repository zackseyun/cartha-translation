  rationale: የስሙን የተለመደ የአማርኛ አጻጻፍ ይጠቀማል፤ ለ- የሚለውም የግሪኩን ተቀባይ ያመለክታል።
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: ሥጋው እንዲጠፋ
  rationale: ὄλεθρος የሚያመለክተውን ጥፋት ወይም ውድመት ያለማለዘብ ይገልጣል። ሥጋ የሚለውን ቃል በዋናው ጽሑፍ በማቆየት አካላዊ ፍርድን ወይም ኃጢአታዊ ዝንባሌን እንደሚያመለክት አይወስንም።
- source_word: ἵνα
  choice: ይህም … እንዲድን ነው
  rationale: የድርጊቱን ዓላማ ወይም የታሰበውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
