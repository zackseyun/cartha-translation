  alternative: “የሰውየው መንፈስ” ብሎ በግልጽ መግለጽ
  rationale: ዐውዱ የጥፋተኛውን የመጨረሻ ድነት በጠንካራ ሁኔታ ቢጠቁምም፣ ግሪኩ ግልጽ የባለቤትነት ተውላጠ ስም አልጨመረም።
- issue: “የጌታ ቀን” የሚለው ጽሑፋዊ ቅርጽ
  choice: የSBLGNTን “τοῦ κυρίου” ተከትሎ “በጌታ ቀን” ማለት
  alternative: “በጌታችን በኢየሱስ ቀን” ወይም “በጌታ በኢየሱስ ቀን”
  rationale: የቀረበው መሠረታዊ ጽሑፍ ‘ጌታ’ ብቻ ይላል፤ በአንዳንድ ቅጂዎች ያለው ማስፋፊያ በዋናው ጽሑፍ አልገባም፣ ነገር ግን በማስታወሻ ተጠቅሷል።
