  text: እንዲህ ያለውን ሰው ለሥጋ ጥፋት[a] ለሰይጣን አሳልፎ መስጠት፤ ይህም መንፈስ በጌታ ቀን[b] እንዲድን ነው።
  philosophy: optimal-equivalence
  footnotes:
