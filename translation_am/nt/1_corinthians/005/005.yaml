  alternative: ከባድ አካላዊ ፍርድ ወይም ሞት፤ ወይም የሰውየው ሥጋዊና ኃጢአታዊ ዝንባሌ መፍረስ
  rationale: የግሪኩ ሐረግ ከባድ የተግሣጽ ውጤትን ያመለክታል፤ ነገር ግን ከሁለቱ ትርጓሜዎች አንዱን ብቻ አያስገድድም።
- issue: “መንፈሱ” የሚያመለክተው
