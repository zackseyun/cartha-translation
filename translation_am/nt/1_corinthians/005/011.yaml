  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: am
  text: አሁን ግን፣ ወንድም ተብሎ የሚጠራ ማንኛውም ሰው ዝሙተኛ፣ ስግብግብ፣ ጣዖት አምላኪ፣ ተሳዳቢ፣ ሰካራም ወይም ቀማኛ ከሆነ፣ ከእንዲህ ያለ ሰው ጋር ህብረት እንዳታደርጉ ጻፍኩላችሁ፤ ከእንዲህ ያለ ሰው ጋር እንኳ አብራችሁ እንዳትበሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: አሁን ግን … ጻፍኩላችሁ
  rationale: የግሪኩን ያለፈ ጊዜ አገላለጽ በቀጥታ ይጠብቃል፤ ከቁጥር 9 የተጠቀሰውን የቀድሞ ደብዳቤ ወይም አሁን የሚጻፈውን መልእክት ማመልከቱ ሊወዛገብ ስለሚችል ግልጽ ትርጓሜ አልተጨመረም።
- source_word: μὴ συναναμίγνυσθαι
  choice: ከእርሱ ጋር እንዳትተባበሩ
  rationale: ቃሉ የቅርብ ማኅበራዊ ግንኙነትንና መቀላቀልን ይከለክላል፤ በዘመናዊ አማርኛ ተፈጥሯዊና ክቡር አገላለጽ ተመርጧል።
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: ወንድም ተብሎ የሚጠራ
  rationale: ὀνομαζόμενος የሚለውን የ‘ተብሎ መጠራት’ ሐሳብ ይጠብቃል፤ ሰውየው በእውነት ወንድም መሆኑን በትርጉም አይወስንም።
- source_word: πόρνος
  choice: ዝሙተኛ
  rationale: የወሲብ ብልግናን የሚፈጽም ሰውን በአጭርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጣል።
- source_word: πλεονέκτης
  choice: ስግብግብ
  rationale: ከመጠን ያለፈ የማግኘትና የመያዝ ፍላጎት ያለውን ሰው ይገልጣል።
- source_word: λοίδορος
  choice: ተሳዳቢ
  rationale: የሚሰድብ፣ የሚዘልፍ ወይም በንግግሩ ሌሎችን የሚጎዳ ሰውን ይገልጣል፤ ‘አስጨናቂ’ ከሚለው ሰፊ ትርጉም ይልቅ ለግሪኩ የቃል ጥቃት ትርጉም ቅርብ ነው።
- source_word: ἅρπαξ
  choice: ቀማኛ
  rationale: በግፍ፣ በማጭበርበር ወይም በብዝበዛ የሌሎችን ነገር የሚወስድ ሰውን ያመለክታል።
- source_word: μηδὲ συνεσθίειν
  choice: ከእንዲህ ያለውም ጋር እንኳ እንዳትበሉ
  rationale: μηδέ የሚሰጠውን ‘እንኳ’ አጽንዖትና συνεσθίειν የሚለውን ‘አብሮ መብላት’ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: ‘ወንድም ተብሎ የሚጠራ’ የሚለው ሰው እውነተኛ አማኝ መሆኑ
  choice: ወንድም ተብሎ የሚጠራ
  alternative: ወንድም ነኝ የሚል / ወንድም የሆነ
  rationale: የግሪኩ አገላለጽ ማኅበረሰቡ ለሰውየው የሚሰጠውን ስያሜ ወይም የሰውየውን የአማኝነት አቋም ሊያመለክት ይችላል፤ የመዳን ሁኔታውን ከጽሑፉ በላይ አይወስንም።
- issue: አብሮ አለመብላት ጌታ እራትን ብቻ ወይም ማንኛውንም ማኅበራዊ ምግብ ማመልከቱ
  choice: ከእንዲህ ያለውም ጋር እንኳ እንዳትበሉ
  alternative: ከእንዲህ ያለው ጋር የጌታን እራት እንኳ አትብሉ
  rationale: ግሪኩ συνεσθίειν በአጠቃላይ ‘አብሮ መብላት’ ይላል፤ ጌታ እራትን ብቻ እንደሚያመለክት በትርጉሙ ውስጥ አልተወሰነም።
- issue: የማኅበር መከልከሉ ስፋት
  choice: እንዳትተባበሩ
  alternative: ማንኛውንም ግንኙነት እንዳታደርጉ
  rationale: ጽሑፉ ማኅበራዊ ቅርርብን ይከለክላል፤ ነገር ግን ማንኛውንም ንግግር፣ የቤተሰብ ግዴታ ወይም ሌላ አስፈላጊ ግንኙነት ሙሉ በሙሉ እንደሚያግድ ከጽሑፉ በላይ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ዝርዝሩ በተመጣጣኝ ሥርዓት ቀርቧል፤ የግሪኩ አጽንዖት በ‘እንኳ’ ተጠብቋል። የጽሑፍ ልዩነት ወይም ለአንባቢ አስፈላጊ የሆነ አማራጭ ትርጉም ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
