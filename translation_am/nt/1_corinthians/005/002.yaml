- from: እናንተም በትዕቢት ተነፍታችኋል፤ ይልቁንስ ልታዝኑና ይህን ድርጊት የፈጸመው ሰው ከመካከላችሁ እንዲወገድ[a] ማድረግ አልነበረባችሁምን?
  to: እናንተ ግን ተነፍታችኋል፤ ይልቁንስ፣ ይህን ድርጊት የፈጸመው ሰው ከመካከላችሁ እንዲወገድ[a] ማዘን አልነበረባችሁምን?
