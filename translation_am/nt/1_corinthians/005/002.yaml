review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the contrast between the Corinthians’ inflated attitude and the grief expected of them, and it retains the broad passive sense of ἀρθῇ. However, its construction “ልታዝኑና ... ማድረግ” makes the readers explicitly responsible for causing the removal and coordinates mourning with “making” the removal happen. This does not reflect the Greek, where mourning is the stated response and the removal is expressed in a purpose/result clause with a passive verb.
  naturalness: “በትዕቢት ተነፍታችኋል” is understandable but somewhat cumbersome. More importantly, the latter half is syntactically heavy and less natural than a direct rhetorical question built around “ማዘን አልነበረባችሁምን?”
  terminology: “ተነፍታችኋል” retains Paul’s inflation metaphor, while “እንዲወገድ” appropriately renders the passive removal without specifying a mechanism. “ይህን ድርጊት የፈጸመው ሰው” is accurate and suitably restrained.
  issues:
  - severity: medium
    issue: The phrase “እንዲወገድ ማድረግ” adds an explicit causative action by the Corinthians.
    rationale: ἀρθῇ is passive, and the Greek does not say that the Corinthians are to ‘make’ the man be removed. The translation should preserve the passive and leave the agent unspecified.
  - severity: medium
    issue: The conjunction “ልታዝኑና” inaccurately coordinates mourning and causing removal.
    rationale: ἵνα introduces the intended outcome/purpose connected with mourning, not a second coordinated obligation.
  - severity: low
    issue: “በትዕቢት ተነፍታችኋል” unnecessarily explains the metaphor within the main text.
    rationale: The metaphor can be retained more directly and naturally as “ተነፍታችኋል,” without altering the meaning.
  revised_text: እናንተ ግን ተነፍታችኋል፤ ይልቁንስ፣ ይህን ድርጊት የፈጸመው ሰው ከመካከላችሁ እንዲወገድ[a] ማዘን አልነበረባችሁምን?
