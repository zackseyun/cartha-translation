base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: am
  text: እናንተ ግን ተነፍታችኋል፤ ይልቁንስ፣ ይህን ድርጊት የፈጸመው ሰው ከመካከላችሁ እንዲወገድ[a] ማዘን አልነበረባችሁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከመካከላችሁ እንዲወሰድ።” በአውዱ መሠረት ይህ በተግሣጽ ከጉባኤው መወገድን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: በትዕቢት ተነፍታችኋል
  rationale: የመነፋትን የግሪኩን ምሳሌያዊ አነጋገር ይጠብቃል፤ ፍጹም ጊዜውም የቀጠለ የትዕቢት ሁኔታን ያሳያል።
- source_word: οὐχὶ μᾶλλον
  choice: ይልቁንስ ... አልነበረባችሁምን?
  rationale: የጳውሎስን ወቀሳ ያዘለ ጥያቄና በነበራቸው ዝንባሌ እና ሊኖራቸው በሚገባው ምላሽ መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπενθήσατε
  choice: ልታዝኑ
  rationale: ከተራ መከፋት የበለጠ ከባድና የጋራ ሐዘንን የሚገልጽ ቃል ነው።
- source_word: ἵνα ἀρθῇ
  choice: እንዲወገድ ማድረግ
  rationale: የἵνα ዓላማዊ ኃይልንና የἀρθῇን ተደራጊ ቅርጽ በግልጽ አማርኛ ያሳያል፤ የማስወገዱን ዘዴ ግን አይወስንም።
- source_word: ἐκ μέσου ὑμῶν
  choice: ከመካከላችሁ
  rationale: የማኅበረሰቡን መካከል የሚያመለክተውን ግሪካዊ ፈሊጥ በቀጥታና በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: ይህን ድርጊት የፈጸመው ሰው
  rationale: ፈጻሚውን ይለያል፤ ἔργον የሚያመለክተውን ከባድ ድርጊትም ሳያቃልል ያስተላልፋል።
theological_decisions:
- issue: በበደለኛው ላይ የሚወሰደው እርምጃ ምንነት
  choice: ከመካከላችሁ እንዲወገድ
  alternative: ከቤተ ክርስቲያን እንዲወገድ፤ ወይም በእግዚአብሔር እንዲወሰድ
  rationale: ἀρθῇ በራሱ ሰፊ ትርጉም ሊኖረው ቢችልም፣ የአካባቢው ክፍል የማኅበሩን ተግሣጽ ያመለክታል። ትርጉሙ የማስወገድን ቋንቋ ይጠብቃል እንጂ ዘዴውን ወይም የእግዚአብሔርን ቀጥተኛ እርምጃ በግድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በትዕቢት ተነፍታችኋል” የጳውሎስን ምሳሌያዊ አነጋገር ጠብቆ ተፈጥሯዊ እንዲሆን ተደርጓል።
