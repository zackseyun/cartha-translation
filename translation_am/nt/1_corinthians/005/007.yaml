  text: አሮጌውን እርሾ አስወግዱ፤ አዲስ ሊጥ እንድትሆኑ፣ እርሾ የሌለባችሁ እንደሆናችሁ። የፋሲካችን በግ[a] የሆነው መሲሕ[b] ተሠውቷልና።
