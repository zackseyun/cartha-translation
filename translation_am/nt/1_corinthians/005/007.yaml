review_pass:
  verdict: revise
  source_fidelity: 'The principal terms are conveyed accurately: ἐκκαθάρατε is appropriately rendered as a forceful plural command, ζύμη/φύραμα retain the leaven-and-dough imagery, and ἐτύθη is correctly expressed sacrificially. The supplied “በግ” is a defensible contextual clarification of πάσχα and is properly qualified by a footnote. However, the order and punctuation of the middle clause obscure the Greek sequence and purpose relation: the purpose of removing the old leaven is becoming new dough, followed by the affirmation that they are unleavened.'
  naturalness: The wording is generally modern and clear. Reordering the purpose clause before “እርሾ የሌለባችሁ እንደሆናችሁ” produces a more natural Amharic flow and makes the intended logical relationship immediately clear.
  terminology: “እርሾ,” “ሊጥ,” “ፋሲካ,” “መሥዋዕት,” and “መሲሕ” are suitable modern-standard Amharic choices. “መሲሕ” appropriately retains the titular force of Χριστός in this context. The notes accurately preserve the literal ambiguity of τὸ πάσχα ἡμῶν and explain the title rendering.
  issues:
  - severity: medium
    issue: The purpose clause and the comparative/affirming clause are reversed in the main sentence.
    rationale: Greek has “clean out … so that you may be a new batch, just as you are unleavened.” The draft instead places “just as you are unleavened” before “so that you may be a new batch,” which makes the Amharic logical progression less clear and weakens the direct correspondence to the source.
