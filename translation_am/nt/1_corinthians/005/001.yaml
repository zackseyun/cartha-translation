  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጳውሎስ መደነቅ በ«በእርግጥ» ተጠብቋል፤ የግሪኩ አጭር የመጨረሻ አገላለጽም ያለ አስፈላጊ ትርጓሜ በዋናው ጽሑፍ ተቀምጧል።
