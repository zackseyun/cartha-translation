source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: am
  text: በእናንተ መካከል ዝሙት እንዳለ በእርግጥ ተሰምቷል፤ ይኸውም ከአሕዛብ[a] መካከል እንኳ የማይገኝ ዓይነት ዝሙት ነው፤ አንድ ሰው የአባቱን ሚስት ይዟል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሕዝቦች መካከል እንኳ»፤ አንዳንድ ትርጉሞች «ከአረማውያን መካከል እንኳ» ይላሉ።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «የአባቱን ሚስት መያዝ»፤ ይኸውም ከአባቱ ሚስት ጋር የጾታ ግንኙነት መኖር ማለት ነው። ሴቲቱ የእንጀራ እናቱ ልትሆን ትችላለች።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: በእርግጥ
  rationale: በዚህ አውድ ቃሉ መጠንን ሳይሆን የጳውሎስን መደነቅና አጽንዖት ያሳያል፤ «በእርግጥ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀκούεται
  choice: ይሰማል
  rationale: የማይታወቅ አድራጊ ያለውን የግሪኩን ሰዋሰዋዊ ቅርጽ ይጠብቃል፤ በአውዱም «ወሬው ተሰምቷል/ተዘግቧል» የሚል ፍቺ አለው።
- source_word: ἐν ὑμῖν
  choice: በእናንተ መካከል
  rationale: ድርጊቱ በቆሮንቶስ ማኅበረሰብ ውስጥ መኖሩን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πορνεία
  choice: ዝሙት
  rationale: ሕገ ወጥ የጾታ ግንኙነትን በሰፊው የሚያመለክት፣ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀምም የታወቀ አጭርና ክቡር ቃል ነው።
- source_word: τοιαύτη πορνεία
  choice: እንዲህ ያለ ዝሙት
  rationale: የድርጊቱን እጅግ አስደንጋጭ ዓይነት የሚያጎላውን የግሪኩን ጥራታዊ አጽንዖት ይጠብቃል።
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: ከአሕዛብ መካከል እንኳ የማይገኝ
  rationale: «አሕዛብ» የአይሁድ ያልሆኑትን በገለልተኛ ሁኔታ ያመለክታል፤ «የማይገኝ» በግሪኩ የተተወውን ግስ በተፈጥሯዊ አማርኛ ይሞላል።
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: የአባቱን ሚስት
  rationale: ልዩ የዝምድና ስያሜ ሳይጨምር የግሪኩን ቀጥተኛ አገላለጽ ይጠብቃል።
- source_word: ἔχειν
  choice: ይዟል
  rationale: ግሪኩ በዚህ ስፍራ ለጾታዊ ወይም ለትዳር መሰል ግንኙነት የተጠቀመውን ሆን ተብሎ አጭር የተደረገ አነጋገር ይጠብቃል።
theological_decisions:
- issue: ἔθνεσιν እንደ «አሕዛብ» ወይም እንደ አዋራጅ ሃይማኖታዊ መጠሪያ መተርጎም
  choice: አሕዛብ
  alternative: አረማውያን / ሕዝቦች
  rationale: የግሪኩ ቃል በጳውሎስ የአይሁድና የአይሁድ ያልሆኑትን ንጽጽር ይይዛል፤ «አሕዛብ» ከምንጩ በላይ አሉታዊ ግምገማ ሳይጨምር ይህን ይጠብቃል።
- issue: γυναῖκα τοῦ πατρὸς የተባለችውን «የእንጀራ እናቱ» ብሎ መግለጽ ወይም የምንጩን አገላለጽ መጠበቅ
  choice: የአባቱን ሚስት
  alternative: የእንጀራ እናቱን
  rationale: ምንም እንኳ ሴቲቱ የእንጀራ እናቱ ልትሆን ብትችልም፣ ግሪኩ ልዩ የዝምድና ቃል አይጠቀምም፤ ስለዚህ ጽሑፉ ያልወሰነውን ትርጉሙ አይወስንም።
- issue: ἔχειν የሚያመለክተውን ግንኙነት በዋናው ጽሑፍ በግልጽ ማብራራት
  choice: ይዟል
  alternative: ከአባቱ ሚስት ጋር የጾታ ግንኙነት አለው
  rationale: «ይዟል» የምንጩን አጭርና በተዘዋዋሪ የተነገረ አገላለጽ ይጠብቃል፤ በአውዱ ያለው ፍቺ በማስታወሻ ይገለጻል።
