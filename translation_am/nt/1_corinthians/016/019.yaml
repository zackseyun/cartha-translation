  rationale: ἀσπάζομαι በዚህ የመልእክት መዝጊያ አውድ ‘ሰላምታ ማቅረብ’ ማለት ነው፤ ይህም በዘመናዊ አማርኛ ተፈጥሯዊና የተከበረ አገላለጽ ነው።
