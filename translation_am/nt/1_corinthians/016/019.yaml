  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: am
  text: የእስያ[a] ቤተ ክርስቲያናት ሰላምታ ያቀርቡላችኋል። አቂላና ጵርስቃ[b]፣ በቤታቸው ካለችው ቤተ ክርስቲያን ጋር፣ በጌታ ከልብ ሰላምታ ያቀርቡላችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “እስያ” የሚለው በትንሿ እስያ ምዕራባዊ ክፍል የነበረውን የሮም እስያ ግዛት ያመለክታል እንጂ የዛሬውን የእስያ አህጉር አይደለም።
    reason: cultural_note
  - marker: b
    text: የግሪክ ጽሑፉ እዚህ “ጵርስቃ” ይላል፤ በሌሎች ስፍራዎች ይኸው ሰው “ጵርስቅላ” በሚለው ረዘም ያለ የስም ቅርጽም ተጠርታለች (ለምሳሌ፣ ሐዋ. 18፥2፣ 18፣ 26፤ ሮሜ 16፥3)።
    reason: lexical_alternative
lexical_decisions:
