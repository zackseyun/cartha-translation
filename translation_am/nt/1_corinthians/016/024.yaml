  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: am
  text: ፍቅሬ በመሲሕ ኢየሱስ[a] ከሁላችሁ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «በክርስቶስ ኢየሱስ።» የግሪኩ Χριστός የሚለው ማዕረግ «መሲሕ» ተብሎ ትርጉሙ ሊቀርብ ወይም በባህላዊው አጠራር «ክርስቶስ» ተብሎ ሊጻፍ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: ፍቅሬ
  rationale: ἀγάπηን በዘመናዊና ተፈጥሯዊ አማርኛ «ፍቅር» ብሎ ያቀርባል፤ -ሬ የሚለው ቅጥያም μου የሚያመለክተውን የጳውሎስን የግል ፍቅር ይገልጣል።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር
  rationale: μετά ከዝርዝሩ ጋር «ከ…ጋር» ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሟል፤ πάντων ὑμῶν ለመላው ማኅበር ያለውን አካታች አድማስ «ሁላችሁ» በማለት ይጠብቃል።
- source_word: ἐν
  choice: በ
  rationale: የጳውሎስን የግንኙነት ወይም የሕልውና ክልል አገላለጽ ሳይተረጉምበት በአጭሩ ይጠብቃል።
- source_word: Χριστῷ Ἰησοῦ
  choice: መሲሕ ኢየሱስ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግን ስለሚይዝ «መሲሕ» ተብሎ ተተርጉሟል፤ Ἰησοῦ ደግሞ «ኢየሱስ» ተብሎ ተጽፏል።
theological_decisions:
- issue: Χριστόςን በጳውሎስ የመዝጊያ አገላለጽ ውስጥ ማቅረብ
  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: የግሪኩን ማዕረግ ትርጉም ግልጽ ለማድረግ «መሲሕ» ተመርጧል፤ ባህላዊው «ክርስቶስ» ግን በግርጌ ማስታወሻ ተጠቅሷል።
- issue: ግስ በሌለው የግሪክ የቡራኬ ንግግር የተሰወረውን ግስ መሙላት
  choice: ይሁን
  alternative: ነው
  rationale: የግሪኩ ሐረግ ግስ የለውም፤ በደብዳቤው መዝጊያ የምኞትና የቡራኬ ቃና ስላለው «ይሁን» ይህን አንድምታ ከማረጋገጫ ንግግር ይልቅ በተገቢው ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ግልጽ የሆነ የደብዳቤ መዝጊያ ቃና ተጠብቋል። «ይሁን» የቡራኬውን የምኞት ኃይል ያሳያል።
