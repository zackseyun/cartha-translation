  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: am
  text: ታላቅና ውጤታማ የሆነ በር ተከፍቶልኛልና፤[a] የሚቃወሙኝም ብዙዎች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታላቅና ውጤታማ የሆነ አጋጣሚ ተከፍቶልኛል።” ጳውሎስ “በር” የሚለውን ቃል ለአገልግሎት የተከፈተን አጋጣሚ በምሳሌ ለማመልከት ተጠቅሞበታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: በር
  rationale: ቃሉ በቀጥታ ‘በር’ ማለት ሲሆን፣ እዚህ ለአገልግሎት የተገኘን መክፈቻ በምሳሌ ያመለክታል። ምሳሌያዊውን ምስል ለመጠበቅ ‘በር’ ተብሏል።
- source_word: γάρ
  choice: -ና
  rationale: ይህ አያያዥ በአውዱ የጳውሎስን የጉዞ ዕቅድ ምክንያት ያቀርባል፤ በአማርኛ ‘-ና’ ይህን ግንኙነት በተፈጥሮ ያሳያል።
- source_word: μοι
  choice: -ልኛል
  rationale: የግል ማጣቀሻውንና ጥቅሙ ለጳውሎስ መሆኑን ‘ተከፍቶልኛል’ በሚለው የግስ ቅርጽ ያሳያል።
- source_word: ἀνέῳγεν
  choice: ተከፍቶልኛል
  rationale: ፍጹም የግስ ቅርጹ ቀድሞ ተከፍቶ አሁንም ክፍት የሆነውን ሁኔታ ያመለክታል። ይህ አተረጓጎም ተገብሮአዊ መልኩን ይጠብቃል፤ ከፋቹን ግን አይጨምርም።
- source_word: μεγάλη
  choice: ታላቅ
  rationale: ‘ታላቅ’ የበሩን አካላዊ መጠን ብቻ ሳይሆን የመክፈቻውን ስፋትና አስፈላጊነትም ሊያመለክት ይችላል።
- source_word: ἐνεργής
  choice: ፍሬያማ
  rationale: በዚህ አውድ ቃሉ የሚሠራ፣ ውጤት የሚያመጣ ወይም ለአገልግሎት ፍሬ የሚኖረውን መክፈቻ ያመለክታል። ‘ፍሬያማ’ በዘመናዊ አማርኛ ይህን ትርጉም በተፈጥሮ ያስተላልፋል።
- source_word: ἀντικείμενοι
  choice: የሚቃወሙኝ
  rationale: በስም ተግባር የዋለው አሳታፊ ቅርጽ ጳውሎስንና ሥራውን በንቃት የሚቃወሙ ሰዎችን ያመለክታል። ‘የሚቃወሙኝ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: πολλοί
  choice: ብዙዎች
  rationale: የቁጥር ብዛትን በቀጥታና በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘በር’ ለአገልግሎት መክፈቻ የተጠቀሰ ምሳሌ መሆኑ
  choice: ‘በር’ የሚለውን የምንጩን ምሳሌያዊ አገላለጽ በዋናው ጽሑፍ ማቆየት
  alternative: ‘ታላቅና ፍሬያማ የአገልግሎት አጋጣሚ ተከፍቶልኛል’ ብሎ ትርጉሙን በግልጽ ማቅረብ
  rationale: የግሪክ ጽሑፉ የጳውሎስን የተለመደ የ‘በር’ ምሳሌ ይጠቀማል። ምስሉን ማቆየት የምንጩን አገላለጽ ይጠብቃል፤ የአገልግሎት አጋጣሚ መሆኑ በማስታወሻ ይብራራል።
