  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በር’ የሚለው ምሳሌ ተጠብቆ፣ ‘ፍሬያማ’ ደግሞ የἐνεργήςን ውጤታማነት በተፈጥሯዊ አማርኛ ያሳያል።
