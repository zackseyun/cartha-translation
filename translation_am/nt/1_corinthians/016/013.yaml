lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: ንቁ
  rationale: የአሁን ጊዜ ትእዛዝ ቅርጹ ቀጣይነት ያለውን ንቃትና ጥንቃቄ ያመለክታል፤ «ንቁ» ይህን በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: στήκετε
  choice: ጸንታችሁ ቁሙ
  rationale: ግሱ አካላዊ መቆምን ብቻ ሳይሆን አለመናወጥንና ጽናትን ያመለክታል፤ «ጸንታችሁ ቁሙ» ምሳሌያዊ ኃይሉን ይጠብቃል።
- source_word: ἐν τῇ πίστει
  choice: በእምነቱ
  rationale: በግሪክ ያለው የተወሰነ መስተዋድድ ሐረጉ የክርስቲያናዊውን እምነት ወይም የእምነት ይዘት ሊያመለክት እንደሚችል ያሳያል፤ «በእምነቱ» ይህን የተወሰነነት ይጠብቃል።
- source_word: ἀνδρίζεσθε
  choice: ደፋር ሁኑ
  rationale: ግሱ በቃል ደረጃ ከ«ወንድ» ጋር የተያያዘ ምስል ቢኖረውም፣ በዚህ ትእዛዛዊ አገባብ ዋና ትርጉሙ በድፍረት መቆም ነው። «ደፋር ሁኑ» ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን የፆታ ምስሉ በማስታወሻ ተጠብቋል።
- source_word: κραταιοῦσθε
  choice: በርቱ
  rationale: የግሪኩ የአሁን ጊዜ ተደራጊ ትእዛዝ በኃይል መጠንከርን ይጠይቃል። «በርቱ» አጭር፣ ግልጽና ተፈጥሯዊ ነው፤ ተደራጊው ገጽታ በማስታወሻ ተገልጿል።
