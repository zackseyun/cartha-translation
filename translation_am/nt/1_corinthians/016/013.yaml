  rationale: የምንጩን የወንድነት ምስል ቃል በቃል በዋናው ጽሑፍ ማስገባት በዘመናዊ አማርኛ ትእዛዙ ለወንዶች ብቻ እንደተሰጠ ሊያስመስል ይችላል። ፈሊጣዊው ኃይል በዋናው ጽሑፍ፣ ቃል በቃሉ ምስል ደግሞ በማስታወሻ ተጠብቋል።
- issue: የκραταιοῦσθε ተደራጊ ቅርጽ
  choice: በርቱ
