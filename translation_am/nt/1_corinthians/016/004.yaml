translation:
  language: am
  text: እኔም መሄዴ ተገቢ ከሆነ፣[a] ከእኔ ጋር ይሄዳሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔም መሄዴ የሚያዋጣ ከሆነ።” የግሪኩ አገላለጽ በዚያ ሁኔታ ተገቢ፣ ተገባቢ ወይም የሚያዋጣ መሆንን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ከሆነ
  rationale: ἐάν የሁኔታ አንቀጽን ያስገባል፤ δέ ቀላል አያያዥ ነው። በአማርኛ የሁኔታው ግንኙነት በ‘ከሆነ’ በተፈጥሮ ይገለጣል፤ የተለየ ተቃርኖ ማከል አያስፈልግም።
- source_word: ἄξιον ᾖ
  choice: ተገቢ ከሆነ
  rationale: ገለልተኛው ἄξιον ከመሆን ግስ ጋር በዚህ አውድ ‘ተገቢ፣ ሁኔታው የሚጠይቀው’ የሚል ተግባራዊ ብቃትን ያመለክታል፤ የጳውሎስን ሥነ ምግባራዊ ብቁነት አይገልጽም።
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: እኔም መሄዴ
  rationale: τοῦ ያለው የግስ ስም ለ‘ተገቢ’ የተባለውን ተግባር ይገልጻል፤ κἀμέ (= καὶ ἐμέ) ያለው የመደመር ኃይል በ‘እኔም’ ተጠብቋል።
- source_word: σὺν ἐμοὶ
  choice: ከእኔ ጋር
  rationale: σύν ከዳቲቭ ጋር አብሮነትን ያመለክታል፤ ‘ከእኔ ጋር’ ተፈጥሯዊና ትክክለኛ አማርኛ ነው።
- source_word: πορεύσονται
  choice: ይሄዳሉ
  rationale: የወደፊት ጊዜው ግስ መልእክተኞቹ እንደሚሄዱ ይገልጻል። ‘ይሄዳሉ’ ከመጀመሪያው πορεύεσθαι ጋር ያለውን የግስ ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ ከልዑካኑ ጋር ስለመሄዱ የተናገረው ሁኔታዊ ንግግር
  choice: የጳውሎስም መሄድ በሁኔታው ተገቢ ሆኖ ከተገኘ፣ ልዑካኑ ከእርሱ ጋር ይሄዳሉ።
  alternative: ‘ስጦታው እኔ እንድሄድ የሚያስችል ያህል ትልቅ ከሆነ’ ወይም ‘እኔ ለመሄድ ብቁ ከሆንኩ’
  rationale: ἄξιον እዚህ ገለልተኛና ኢ-ግለሰባዊ አገላለጽ ሲሆን፣ የግስ ስሙ ተገቢ ተብሎ የሚታሰበውን ተግባር ይጠቅሳል። አውዱም የስብስቡን አደራ ስለማድረስ ተግባራዊ ዝግጅት ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ተገቢ’ የአውዱን ተግባራዊ ተስማሚነት ይገልጻል፤ በግሪኩ ያለው የትርጉም ስፋት በግርጌ ማስታወሻ ተጠብቋል።
