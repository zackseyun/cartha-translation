base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: am
  text: ለቅዱሳን[a] ስለሚሰበሰበው መዋጮ፣ ለገላትያ ቤተ ክርስቲያናት በሰጠኋቸው መመሪያ መሠረት እናንተም እንዲሁ አድርጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእግዚአብሔር ሕዝብ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ስለ
  rationale: አዲስ ርዕስ የሚያስገባውን የደብዳቤ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በግሪክ ግልጽ የጊዜ ቃል ስለሌለ ‘አሁን’ አልተጨመረም።
- source_word: λογείας
  choice: የሚሰበሰበው መዋጮ
  rationale: ለተወሰነ ዓላማ የሚሰበሰብ ገንዘብን ያመለክታል፤ ‘መባ’ በማለት የአምልኮ ሥርዓት ትርጉም አያስገባም።
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: ለቅዱሳን
  rationale: መዋጮው የታሰበላቸውን ተቀባዮች ያሳያል፤ ‘ቅዱሳን’ ጳውሎስ አማኞችን የሚጠራበትን ቁልፍ ቃል ይጠብቃል።
- source_word: διέταξα
  choice: እንዳዘዝኩት
  rationale: የሐዋርያዊ መመሪያውን ሥልጣን በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἐκκλησίαις
  choice: ቤተ ክርስቲያናት
  rationale: በጳውሎስ አጠቃቀም ያሉትን የክርስቲያኖች ማኅበረ ምእመናን የሚያመለክት የተለመደ ትርጉም ነው።
- source_word: Γαλατίας
  choice: ገላትያ
  rationale: የግዛቱን ወይም የአካባቢውን ስም በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: እናንተም እንዲሁ አድርጉ
  rationale: ከገላትያ ቤተ ክርስቲያናት ጋር ያለውን ንጽጽርና የትእዛዙን ኃይል ይጠብቃል።
theological_decisions:
- issue: በገንዘብ እርዳታ አውድ ውስጥ ἅγιοι የሚለውን መተርጎም
  choice: ቅዱሳን
  alternative: የእግዚአብሔር ሕዝብ
  rationale: ጳውሎስ ἅγιοι የሚለውን ቃል በተለምዶ ለአማኞች ይጠቀምበታል። ‘ቅዱሳን’ ይህን የቃልና የሥነ መለኮት ቀጣይነት ይጠብቃል፤ ከጊዜ በኋላ የተፈጠረውን የተወሰኑ ሰዎች ቅድስና ጽንሰ ሐሳብ ግን አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘መዋጮ’ የገንዘብ ስብስቡን በተፈጥሯዊ ቋንቋ ሲገልጽ፣ ‘ቅዱሳን’ የጳውሎስን ቁልፍ ቃል ይጠብቃል።
