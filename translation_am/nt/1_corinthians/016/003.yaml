  rationale: δοκιμάζω መመርመርንና ብቁ ሆኖ ማግኘትን ሊያመለክት ቢችልም፣ እዚህ ማኅበሩ ተወካዮችን ስለሚመርጥ በዘመናዊ አማርኛ «የምትመርጧቸውን» በተፈጥሮ ይገልጸዋል።
- source_word: δι’ ἐπιστολῶν
  choice: ከደብዳቤዎች ጋር
  rationale: διά ከጄኒቲቭ ጋር አማካይነትን ወይም አብሮነትን ያመለክታል፤ ተወካዮቹ ደብዳቤዎችን ይዘው እንደሚላኩ በግልጽ ያሳያል። «የምስክር ደብዳቤዎች» ማለት በምንጩ ላይ የሌለ ትርጓሜ ስለሚጨምር አልተመረጠም።
- source_word: τούτους πέμψω
  choice: እልካቸዋለሁ
  rationale: τούτους ወደ ተመረጡት ሰዎች በአጽንዖት ይመለሳል፤ የአማርኛው የግስ ቅጥያ ተሳቢውን በቂ ሁኔታ ያመለክታል።
- source_word: ἀπενεγκεῖν
  choice: እንዲወስዱ
  rationale: የግስ ማስደገፊያው የመላኩን ዓላማ ይገልጻል፤ ከቆሮንቶስ ወደ ኢየሩሳሌም መውሰድን «እንዲወስዱ» በትክክል ያሳያል።
- source_word: τὴν χάριν ὑμῶν
