  rationale: በምዕራፉ አውድ χάρις ለኢየሩሳሌም ምእመናን የተሰበሰበውን ተጨባጭ ስጦታ ያመለክታል። «ስጦታችሁን» ግልጽ ሲሆን፣ የቸርነት ፍቺው በማስታወሻ ተጠብቋል።
- source_word: εἰς Ἰερουσαλήμ
