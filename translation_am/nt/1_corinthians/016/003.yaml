- source_word: ὅταν δὲ παραγένωμαι
  choice: እኔም በደረስሁ ጊዜ
  rationale: ὅταν ከንዑስ አንቀጽ ጋር ወደፊት የሚፈጸምን ሁኔታ ያመለክታል፤ «በደረስሁ ጊዜ» በአማርኛ ይህን በተፈጥሮ ያስተላልፋል። δέ ቀላል አያያዥ ስለሆነ «እኔም» ተብሏል።
- source_word: οὓς ἐὰν δοκιμάσητε
