review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Paul’s arrival, the sending of delegates, the transport of the Corinthians’ contribution, and the destination. However, «እኔም በደረስሁ ጊዜ» is not the most natural way to express the Greek future contingency. More importantly, «ከደብዳቤዎች ጋር» is positioned as modifying Paul’s sending, whereas δι’ ἐπιστολῶν stands directly with «whomever you approve» in Greek. Its precise attachment is debated; the primary rendering should retain its close connection to the approval, while a note preserves the alternative reflected in the English audit trail.
  naturalness: «እኔ ስደርስ» is idiomatic modern Amharic for “when I arrive.” «የምታጸድቋቸው» naturally communicates approval/authorization in the context of delegates and retains more of δοκιμάζω than mere selection. The revised sentence has a clear, formal-modern biblical register.
  terminology: «ስጦታችሁን» is suitable for χάρις in this collection context, and the existing lexical note appropriately records the sense “gracious gift/grace.” «መዋጮ» in the explanation accurately identifies the contextual referent. «ኢየሩሳሌም» and «ደብዳቤዎች» are standard forms.
  issues:
  - severity: medium
    issue: Future temporal expression is awkward
    rationale: «በደረስሁ ጊዜ» uses a completed-form expression where the Greek ὅταν + aorist subjunctive refers prospectively. «ስደርስ» is the natural Amharic future-temporal form.
  - severity: medium
    issue: Attachment of δι’ ἐπιστολῶν is not adequately preserved
    rationale: The Greek phrase follows δοκιμάσητε and may mean that the Corinthians approve/commend the delegates by letters. The draft instead makes the letters only accompaniments of Paul’s sending. Because the syntactic relationship is debated, the main text should reflect the nearer attachment and a footnote should preserve the alternative.
  - severity: low
    issue: «የምትመርጧቸው» is narrower than δοκιμάσητε
    rationale: Selection is appropriate in context, but δοκιμάζω includes examining and approving. «የምታጸድቋቸው» better represents the source without becoming unnatural.
