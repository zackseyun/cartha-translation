- source_word: διέρχομαι
  choice: በመቄዶንያ በኩል አልፋለሁ
  rationale: የግሪኩ የአሁን ጊዜ ቅርጽ በዚህ የጉዞ ዕቅድ አውድ የተወሰነውን መንገድ ያሳያል፤ የአማርኛው አገላለጽም በአሁኑ ሰዓት ጉዞው ተጀምሯል ብሎ ሳያስገድድ ይህን ያስተላልፋል።
