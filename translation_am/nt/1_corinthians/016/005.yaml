- source_word: πρὸς ὑμᾶς
  choice: ወደ እናንተ
  rationale: ከእንቅስቃሴ ግስ ጋር ወደ ሰዎች የሚደረግን አቅጣጫ ያመለክታል።
- source_word: ὅταν ... διέλθω
  choice: ካቋረጥሁ በኋላ
