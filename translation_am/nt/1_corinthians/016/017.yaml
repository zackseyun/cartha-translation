  rationale: ዐውዱ ሦስቱ ሰዎች ቆሮንቶስ ሰዎችን ወክለው በጳውሎስ ዘንድ መገኘታቸውን ሊያመለክት ይችላል፤ ሆኖም ግሪኩ በቀጥታ ‘አለመኖር’ አይልም። ስለዚህ ትርጉሙ አንድን ትርጓሜ ብቻ አያስገድድም።
