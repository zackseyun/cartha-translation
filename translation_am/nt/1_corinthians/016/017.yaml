  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: am
  text: የእስጢፋኖስ፣ የፎርቱናጦስና የአካይቆስ መምጣት ደስ ይለኛል፤ እነዚህ ሰዎች ከእናንተ የጎደለውን[a] አሟልተዋልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚህ ሰዎች እናንተ በአካል ባለመኖራችሁ የተፈጠረውን እጥረት አሟልተዋል።” ጳውሎስ የሚያመለክተው የቆሮንቶስ አማኞች በአካል ከእርሱ ጋር መገኘት አለመቻላቸውን እንጂ የሥነ ምግባር ጉድለታቸውን እንዳልሆነ ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: ደስ አሰኝቶኛል
  rationale: የጳውሎስን የግል ደስታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ በመምጣታቸው የተነሣው ደስታ አሁንም እንዳለ ያመለክታል።
- source_word: δὲ
  choice: (በአማርኛ ፍሰት በግልጽ አልተተረጎመም)
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን ለስላሳ ማያያዣ ነው፤ ‘ግን’ ማለት ያልተፈለገ ተቃርኖ ሊፈጥር ስለሚችል በዓረፍተ ነገሩ ፍሰት ተወክሏል።
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: መምጣት
  rationale: በዚህ ዐውድ παρουσία የሰዎቹን መድረስና በአካል መገኘት ያመለክታል፤ የፍጻሜ ዘመን ቴክኒካዊ ትርጉም የለውም።
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: እስጢፋኖስ፣ ፎርቱናጦስና አካይቆስ
  rationale: የግል ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ተጽፈዋል።
- source_word: ὅτι
  choice: -ና
  rationale: የጳውሎስን ደስታ ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ ቅጥያ ያሳያል።
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: ከእናንተ የጎደለውን
  rationale: ὑστέρημα የጎደለ ነገርን ወይም እጥረትን ያመለክታል። ጽሑፉ ያለውን አሻሚነት ለመጠበቅ ‘አለመኖራችሁን’ ብሎ በዋናው ጽሑፍ አልተወሰነም።
- source_word: οὗτοι
  choice: እነዚህ ሰዎች
  rationale: አመልካች ተውላጠ ስሙን አጽንዖትና ሦስቱን ወንዶች ማመልከቱን ግልጽ ያደርጋል።
- source_word: ἀνεπλήρωσαν
  choice: ሞልተዋል
  rationale: ግሱ የጎደለውን መሙላት ወይም ማሟላት ማለት ነው፤ ‘ሞልተዋል’ የግሪኩን ምስል በአጭርና ግልጽ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ‘ከእናንተ የጎደለው’ የሚለው ሐረግ የሚያመለክተው
  choice: በዋናው ጽሑፍ ቃላዊ አሻሚነቱን መጠበቅ
