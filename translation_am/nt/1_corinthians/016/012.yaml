  text: ወንድማችን አጵሎስን[a] በተመለከተ፣ ከወንድሞች ጋር ወደ እናንተ እንዲመጣ አጥብቄ ለመንኩት፤ ነገር ግን አሁን ለመምጣት ፈጽሞ ፈቃደኛ አልነበረም[b]። አመቺ ጊዜ ሲያገኝ ግን ይመጣል።
  philosophy: optimal-equivalence
  footnotes:
