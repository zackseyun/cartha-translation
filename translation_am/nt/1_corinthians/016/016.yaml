  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: am
  text: እናንተም ለእንደነዚህ ላሉ ሰዎች ራሳችሁን እንድታስገዙ[a]፣ እንዲሁም አብሮ ለሚሠራ[b] እና ለሚደክም ሁሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተም ለእንደነዚህ ላሉ ሰዎች እንድትገዙ።”
    reason: lexical_alternative
  - marker: b
    text: “አብሮ ለሚሠራ” የሚለው “ተባባሪ ለሆነ” ወይም “በሥራው ለሚተባበር” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: እንድታስገዙ
  rationale: የቀደመውን የጳውሎስ ልመና ይዘት የሚገልጽ ንዑስ አንቀጽ በአማርኛ በ«እንድ-» ቅርጽ ተፈጥሯዊ ሆኖ ተቀርጿል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
