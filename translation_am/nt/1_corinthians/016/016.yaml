- source_word: ὑποτάσσησθε
  choice: ራሳችሁን እንድታስገዙ
  rationale: የግሡን መካከለኛ/ተመላሽ ገጽታ ይጠብቃል፤ ሰው ራሱን በፈቃድ ከሌላው ሥር ማድረጉን ይገልጻል፣ ፍጹም ወይም ያልተገደበ ታዛዥነትን ግን አያስገባም።
- source_word: τοῖς τοιούτοις
  choice: ለእንደነዚህ ላሉ ሰዎች
  rationale: እንደ እስጢፋኖስ ቤተሰብ ያሉትን የሰዎች ዓይነት ያመለክታል፤ ጾታን ሳያስገድድ የምንጩን የክፍል ማመልከቻ ይጠብቃል።
- source_word: παντὶ τῷ συνεργοῦντι
  choice: አብሮ ለሚሠራ ሁሉ
  rationale: የአብሮነትን እና የጋራ አገልግሎትን ሐሳብ ይጠብቃል፤ በግሪኩ ያልተገለጸ ቀጥተኛ ተሳቢ አይጨምርም።
- source_word: καὶ κοπιῶντι
  choice: እና ለሚደክም
  rationale: κοπιάω የሚያመለክተውን አድካሚና ትጉህ ሥራ በዘመናዊ፣ ክብር ባለው አማርኛ ይገልጻል።
theological_decisions:
- issue: የታዘዘው መገዛት ባሕርይ
  choice: እንደ ተጠቀሱት ያሉ የክርስቲያን አገልጋዮችን በፈቃድ ማክበርና ራስን ለእነርሱ ማስገዛት
  alternative: ለተዋረዳዊ ሥልጣን ያልተገደበ ታዛዥነት
  rationale: አውዱ የእስጢፋኖስን ቤተሰብና ከእነርሱ ጋር የሚሠሩትን ይመለከታል። «ራሳችሁን እንድታስገዙ» የጽሑፉን ኃይል ይጠብቃል፣ ጥቅሱ ያልተናገረውን ፍጹም ወይም ተቋማዊ ተዋረድ ግን አያክልም።
