reference: 1 Corinthians 16:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: am
  text: አሁን በመንገድ ላይ እያለፍኩ ብቻ ላያችሁ አልፈልግምና፤ ጌታ ቢፈቅድ፣ ከእናንተ ጋር ለተወሰነ ጊዜ ለመቆየት ተስፋ አደርጋለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በማለፍ ላይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: አልፈልግም
  rationale: የጳውሎስን የግል ፍላጎትና ዕቅድ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἄρτι
  choice: አሁን
  rationale: የአሁኑን ጊዜና ሁኔታ በአጭሩ ያመለክታል።
- source_word: ἐν παρόδῳ
  choice: በመንገዴ ላይ ሳልፍ ብቻ
  rationale: በጉዞ መካከል የሚደረግን አጭርና ጊዜያዊ ጉብኝት በግልጽ አማርኛ ያሳያል፤ ‘ብቻ’ የታሰበውን አጭር ቆይታ ያጎላል።
- source_word: ἰδεῖν
  choice: ላያችሁ
  rationale: ‘ማየት’ የሚለውን ቀጥተኛ ትርጉም ጠብቆ በዐውዱ ውስጥ የመጎብኘትንም ሐሳብ ይሸከማል።
- source_word: ἐλπίζω
  choice: ተስፋ አደርጋለሁ
  rationale: ያልተረጋገጠ ግን የሚጠበቅ ፍላጎትን ያሳያል።
- source_word: χρόνον τινά
  choice: የተወሰነ ጊዜ
  rationale: ርዝመቱ በግልጽ ያልተጠቀሰ ነገር ግን ትርጉም ያለው የቆይታ ጊዜ መሆኑን ያስተላልፋል።
- source_word: ἐπιμεῖναι
  choice: ለመቆየት
  rationale: በአንድ ቦታ መቀጠልን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πρὸς ὑμᾶς
  choice: ከእናንተ ጋር
  rationale: ከሰዎች ጋር መቆየትንና በእነርሱ ኅብረት ውስጥ መሆንን በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: ጌታ ቢፈቅድ
  rationale: ዕቅዱ በጌታ ፈቃድ ላይ የተመሠረተ መሆኑን የግሪኩን ሁኔታዊ አገላለጽ ጠብቆ ያሳያል።
- source_word: κύριος
  choice: ጌታ
  rationale: የተለመደውን መጽሐፍ ቅዱሳዊ አቻ ይጠቀማል፤ ግሪኩ ተጨማሪ ስያሜ ስላልሰጠ ተጠቃሹን አይወስንም።
theological_decisions:
- issue: ‘ጌታ’ የሚለው የሚያመለክተው ማንን ነው?
  choice: ጌታ
  alternative: ጌታ ኢየሱስ፤ ወይም እግዚአብሔር
  rationale: የግሪኩ ጽሑፍ κύριος ብቻ ይላል፤ ስለዚህ ትርጉሙ ተጠቃሹን ከጽሑፉ በላይ ሳይወስን ‘ጌታ’ ብሎ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩ ሁለት γάρ አገናኞች በሁለቱም ሐረጎች ‘-ና’ ተንጸባርቀዋል፤ የዐረፍተ ነገሩ ቅደም ተከተል ለአማርኛ ተፈጥሯዊነት በመጠኑ ተስተካክሏል።
