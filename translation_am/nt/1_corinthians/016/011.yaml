base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: am
  text: ስለዚህ ማንም እርሱን አይናቀው። ወደ እኔ እንዲመጣ ግን በሰላም ሸኙት፤ እኔ እርሱን ከወንድሞች[a] ጋር እጠብቃለሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከወንድሞችና ከእህቶች ጋር”፤ “ወንድሞች” የሚለው ቃል ሰፊ የአማኞችን ወይም የአብሮ ሠራተኞችን ቡድን የሚያመለክት ከሆነ።
