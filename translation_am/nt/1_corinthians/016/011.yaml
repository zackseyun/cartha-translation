lexical_decisions:
- source_word: μή τις οὖν
  choice: ስለዚህ ማንም … አይ—
  rationale: μή ከአዮሪስት ሰብጃንክቲቭ ጋር የሚሰጠውን ክልከላ በተፈጥሯዊ የአማርኛ አሉታዊ ትእዛዝ ያቀርባል፤ οὖν ደግሞ ከቀደመው ሐሳብ ጋር ያለውን የውሳኔ ግንኙነት ‘ስለዚህ’ በማለት ይጠብቃል።
- source_word: ἐξουθενήσῃ
  choice: አይናቀው
  rationale: ግሱ አንድን ሰው ከንቱ አድርጎ ማየትን ወይም መናቅን ያመለክታል፤ ‘አይናቀው’ አጭር፣ ጠንካራና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: προπέμψατε
  choice: መንገዱን አሰናዱለት
  rationale: ቃሉ ለቀጣዩ ጉዞ ማሰናበትን፣ ማጀብን ወይም አስፈላጊውን እርዳታ ማድረግን ሊያካትት ይችላል። ይህ አተረጓጎም ባዶ ‘ላኩት’ ከማለት ይልቅ የጉዞ ድጋፉን ያሳያል።
- source_word: ἐν εἰρήνῃ
  choice: በሰላም
  rationale: የምንጩን ቅርጽ በቅርብ ይከተላል፤ በዚህ አውድ ግጭትና እንቅፋት የሌለበትን፣ በበጎ ፈቃድ የታጀበ መሰናበት ያመለክታል።
- source_word: ἵνα ἔλθῃ πρός με
  choice: ወደ እኔ ይመጣ ዘንድ
  rationale: ἵνα ከሰብጃንክቲቭ ጋር የሚገልጸውን ዓላማ ‘ዘንድ’ የሚለው የተከበረና ግልጽ የአማርኛ አገባብ ይጠብቃል።
- source_word: ἐκδέχομαι
  choice: እጠብቀዋለሁ
  rationale: የአሁን ጊዜው ግስ ቀጣይ መጠበቅንና መጠባበቅን ያሳያል፤ የአማርኛው ምርጫም ተፈጥሯዊና ግልጽ ነው።
- source_word: μετὰ τῶν ἀδελφῶν
  choice: ከወንድሞች ጋር
  rationale: ἀδελφῶν በሰዋስው ወንድ ፆታ ብዙ ቁጥር ስለሆነ ‘ወንድሞች’ የምንጩን ቅርጽ ይጠብቃል። በአውዱ ግን የተቀላቀለ የአማኞች ወይም የአብሮ ሠራተኞች ቡድን ሊያመለክት ስለሚችል ይህ በግርጌ ማስታወሻ ተገልጿል።
theological_decisions:
- issue: ἀδελφῶν ወንዶችን ብቻ ወይም የተቀላቀለ የክርስቲያኖች ቡድንን ሊያመለክት መቻሉ
  choice: ወንድሞች
  alternative: ወንድሞችና እህቶች
  rationale: ዋናው ጽሑፍ የግሪኩን ወንድ ፆታ ብዙ ቁጥር ሳይፈታ ይጠብቃል፤ ቃሉ ሰፊውን የእምነት ቤተሰብ ወይም አብረው የሚሠሩትን ቡድን ካመለከተ ሴቶችንም ሊያካትት የሚችለው አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
- issue: μετὰ τῶν ἀδελφῶν ከ‘እጠብቀዋለሁ’ ጋር ወይም ከሚጠበቀው ሰው ጋር ያለው የአገባብ ግንኙነት
  choice: እኔ ከወንድሞች ጋር እጠብቀዋለሁ
  alternative: እርሱን ከወንድሞች ጋር እጠብቃለሁ
  rationale: የግሪኩ ሐረግ ወንድሞቹ ከጳውሎስ ጋር እየጠበቁ መሆናቸውን ወይም ከጢሞቴዎስ ጋር እንደሚመጡ ሊያስተውል ይችላል። የተመረጠው አማርኛ አገባብ ሐረጉን ከግሱ ጋር በቅርብ አስቀምጦ ዋናውን ንባብ ያቀርባል፣ አገባቡንም ከሚገባው በላይ አያብራራም።
