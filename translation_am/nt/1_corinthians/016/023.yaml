  text: የጌታ ኢየሱስ ጸጋ ከእናንተ ጋር ይሁን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች የተለመደውን መለኮታዊ ቸርነትና በረከት የሚያመለክት ቃል በተፈጥሯዊና በተለመደ የአማርኛ አቻው «ጸጋ» ተተርጉሟል።
- source_word: κύριος
  choice: ጌታ
  rationale: የቃሉን የአዲስ ኪዳን ማዕረጋዊና ክርስቶሳዊ ክብደት በተለመደው «ጌታ» ይገልጣል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: የግል ስሙ በአማርኛ የተለመደውን አጻጻፍ ተከትሎ ተጽፏል።
- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር ይሁን
  rationale: ግሪኩ ቃል በቃል «ከእናንተ ጋር» ቢልም፣ የበረከት ምኞቱን በተፈጥሯዊ አማርኛ ለመግለጽ «ይሁን» ተጨምሯል። የብዙ ቁጥር ተውላጠ ስምም ተጠብቋል።
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: የጌታ ኢየሱስ
  rationale: የግሪኩን የባለቤትነት/ምንጭ ሊያመለክት የሚችል ጄኒቲቭ በአማርኛ «የ-» መዋቅር በመጠቀም ሳይገደብ ተጠብቋል።
theological_decisions:
- issue: ግስ ያልተገለጸበት የበረከት አገላለጽ
  choice: የምኞት ኃይሉን ለማሳየት «ይሁን» ተጨምሯል።
  alternative: «የጌታ ኢየሱስ ጸጋ ከእናንተ ጋር።»
  rationale: በግሪክ ግስ ባይኖርም ሐረጉ የመዝጊያ በረከት ነው፤ «ይሁን» ይህን የተለመደ ኃይል በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- issue: የτοῦ κυρίου Ἰησοῦ ጄኒቲቭ ምንጭ ወይም ባለቤትነት
  choice: «የጌታ ኢየሱስ ጸጋ»
  alternative: «ከጌታ ኢየሱስ የሚገኘው ጸጋ»
  rationale: «የ-» የግሪኩን እውነተኛ ሰዋሰዋዊ ስፋት ይጠብቃል፤ «ከ…የሚገኘው» ደግሞ የምንጭነትን ትርጉም ብቻ በግልጽ ይወስናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። «ጸጋ» እና «ጌታ» በአማርኛ የክርስቲያን ንባብ የተለመዱ ሲሆኑ እዚህም የግሪኩን የቃላትና የነገረ መለኮት ክብደት በተፈጥሯዊ ሁኔታ ይጠብቃሉ።
