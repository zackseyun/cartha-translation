  choice: የተወሰነ ገንዘብ አስቀምጣችሁ አጠራቅሙ
  rationale: τιθέτω ቀጣይነት ያለው ትእዛዝ ሲሆን θησαυρίζων ደግሞ የማስቀመጡን አካሄድ፣ ማለትም በጊዜ ሂደት ማጠራቀምን፣ ያሳያል። ገንዘብ የሚለው ከመዋጮው አውድ የተገኘ ግልጽ ማሟያ ነው።
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: በተሳካላችሁ መጠን
