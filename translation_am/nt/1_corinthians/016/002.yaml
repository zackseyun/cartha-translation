  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: am
  text: 'በየሳምንቱ በመጀመሪያው ቀን[a]፣ እያንዳንዳችሁ በግሉ[b] እንደ ተሳካለት መጠን[c] ለይቶ ያስቀምጥ፣ እያጠራቀመ፤ ይህም እኔ ስመጣ ያን ጊዜ መዋጮዎች እንዳይሰበሰቡ ነው።


    [a] ወይም፣ “በሳምንቱ የመጀመሪያ ቀን።” የግሪክኛው አገላለጽ እዚህ በየሳምንቱ የሚደገም ተግባርን ያመለክታል።


    [b] ቃል በቃል፣ “በራሱ ዘንድ” ወይም “ከራሱ ጋር።” ይህ እያንዳንዱ ሰው ገንዘቡን በግሉ፣ ምናልባትም በቤቱ፣ እንዲያስቀምጥ ማለት ሊሆን ይችላል።


    [c] ወይም፣ “እንደ ተሳካለት።” ሐሳቡ እያንዳንዱ ሰው ባገኘው ብልጽግና መጠን ገንዘብ እንዲያስቀምጥ ነው።'
  philosophy: optimal-equivalence
