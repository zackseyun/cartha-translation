  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: am
  text: 'እናንተ[b] የእግዚአብሔር ቤተ መቅደስ[a] እንደሆናችሁ፣ የእግዚአብሔርም መንፈስ በእናንተ[c] እንደሚኖር አታውቁምን?


    [a] ወይም፣ “የእግዚአብሔር መቅደስ።”

    [b] “እናንተ” የብዙ ቁጥር ነው፤ ጳውሎስ ማኅበሩን በአንድነት እያነጋገረ ነው።

    [c] ወይም፣ “በመካከላችሁ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር መቅደስ።”
    reason: lexical_alternative
  - marker: b
