    reason: cultural_note
  - marker: c
    text: ወይም፣ “በመካከላችሁ።”
    reason: alternative_reading
lexical_decisions:
- source_word: ναὸς
  choice: ቤተ መቅደስ
  rationale: ቃሉ አጠቃላይ የተቀደሰ ግቢን ሳይሆን በተለይ መቅደሱን ያመለክታል። “ቤተ መቅደስ” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን የቅዱስ ስፍራውን ምስል ይጠብቃል።
- source_word: θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት/የዝምድና አገባብ በተፈጥሯዊው የአማርኛ “የـ” ቅርጽ ያስተላልፋል።
- source_word: ἐστε
  choice: እንደሆናችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርን በግልጽ ይጠብቃል፤ በጥያቄው አወቃቀርም ተፈጥሯዊ ነው።
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: የእግዚአብሔር መንፈስ
  rationale: የግሪኩን የዝምድና አገባብ በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: οἰκεῖ
  choice: ይኖራል
  rationale: ቀጣይነት ያለውን መኖር ያሳያል፤ ከቤተ መቅደስ ምስሉም ጋር ይስማማል። በጥገኛው ሐረግ “እንደሚኖር” ሆኖ ቀርቧል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ
  rationale: “በእናንተ ውስጥ” ወይም “በመካከላችሁ” የሚለውን ሊያመለክት የሚችል አጭር አቀራረብ ነው፤ የማኅበሩን ጠቅላላ አድራሻ ሳያጠብ አሻሚነቱን ይጠብቃል።
- source_word: Οὐκ οἴδατε
  choice: አታውቁምን?
  rationale: የጳውሎስን አጽንዖት ያለው አሉታዊ የንግግር ጥያቄ በክብር ባለውና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ጥቅሱ በዋናነት ስለ ግለሰብ አማኞች ወይስ ስለ ማኅበሩ በአንድነት መናገሩ
  choice: ዋናው ጽሑፍ “እናንተ” የሚለውን የብዙ ቁጥር ቅርጽ ጠብቆ፣ በአውዱ ማኅበሩን በአንድነት እንደሚያመለክት በማስታወሻ ያብራራል።
  alternative: “እያንዳንዳችሁ የእግዚአብሔር ቤተ መቅደስ ናችሁ” ብሎ ግለሰባዊ ማድረግ፣ ወይም “እናንተ በአንድነት...” ብሎ የምንጩን ቃል በመጨመር ማኅበራዊነቱን ፍጹም ግልጽ ማድረግ።
  rationale: የግሪኩ ሁለተኛ መደብ ብዙ ቁጥር ማኅበሩን ያነጋግራል፤ ሆኖም “በአንድነት” የሚል ተጨማሪ ቃል የለውም። ስለዚህ ትርጉሙ የምንጩን አቀራረብና የሥነ መለኮት ውጥረቱን ይጠብቃል።
- issue: ἐν ὑμῖν ውስጣዊ መኖርን ወይስ በማኅበሩ መካከል መገኘትን ማመልከቱ
  choice: “በእናንተ” ተብሎ ሁለቱንም አቅጣጫዎች የማይዘጋ አቀራረብ ተመርጧል።
  alternative: “በእናንተ ውስጥ” ወይም “በመካከላችሁ”።
  rationale: ἐν ከብዙ ቁጥር ተውላጠ ስም ጋር “በእናንተ ውስጥ” ወይም “በመካከላችሁ” ሊሆን ይችላል። ዋናው ጽሑፍ ይህን አሻሚነት ይጠብቃል፣ አማራጩም በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “አታውቁምን?” የሚለው ቅርጽ የንግግር ጥያቄውን አጽንዖት ይጠብቃል፤ የብዙ ቁጥሩም በ“እናንተ” እና በግስ ቅጥያዎች ግልጽ ሆኗል።
