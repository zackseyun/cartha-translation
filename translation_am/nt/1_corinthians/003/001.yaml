base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: am
  text: እኔም፣ ወንድሞች[a]፣ እንደ መንፈሳውያን ልናገራችሁ አልቻልኩም፤ ነገር ግን እንደ ሥጋውያን፣ በመሲሕ[b] እንዳሉ ሕፃናት አድርጌ አነጋገርኳችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች።” የግሪኩ ቃል በቀጥታ “ወንድሞች” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በክርስቶስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: እኔም
  rationale: የκαίን አያያዥ ኃይልና አጽንዖት ያለውን የመጀመሪያ መደብ ተውላጠ ስም በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር የጥሪ ቅርጽ በቀጥታ ይጠብቃል፤ ጉባኤው ሴቶችንም ሊያካትት መቻሉ በማስታወሻ ተገልጧል።
- source_word: οὐκ ἠδυνήθην
  choice: ልናገራችሁ አልቻልኩም
  rationale: በድርጊቱ ወቅት የነበረውን አለመቻል በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πνευματικοῖς
  choice: መንፈሳውያን
  rationale: በአውዱ ስማዊ ሆኖ የሚሠራውን ቅጽል ከ‘ሥጋውያን’ ጋር ያለውን ትይዩነት ጠብቆ ይተረጉማል።
- source_word: σαρκίνοις
  choice: ሥጋውያን
  rationale: ከσάρξ ጋር ያለውን የቃል ግንኙነትና ከ‘መንፈሳውያን’ ጋር ያለውን ተቃርኖ ይጠብቃል፤ ‘ዓለማውያን’ ወይም ‘ኃጢአተኞች’ ብሎ ከልክ በላይ አይተረጉምም።
- source_word: νηπίοις
  choice: ሕፃናት
  rationale: የመንፈሳዊ አለመብሰልን ምሳሌያዊ ሐሳብ ክብር ባለውና በቀላሉ በሚገባ ቃል ያቀርባል።
- source_word: ἐν Χριστῷ
  choice: በመሲሕ
  rationale: ἐνን ‘በ’ በማለት እና Χριστόςን የማዕረግ ኃይሉን በሚጠብቀው ‘መሲሕ’ በማለት ያቀርባል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም
  choice: በመሲሕ
  alternative: በክርስቶስ
  rationale: በዚህ ሐረግ የΧριστός የማዕረግ ኃይል ተገቢ ስለሆነ ‘መሲሕ’ ተመርጧል፤ የተለመደው አማራጭ በማስታወሻ ተጠቅሷል።
- issue: ἀλλ’ ὡς በሚለው ክፍል ያለው የግስ መቅረት
  choice: አነጋገርኳችሁ የሚለውን ከቀደመው λαλῆσαι በመሙላት ሐረጉን ግልጽ ማድረግ
  alternative: ግሱን ሳይደግሙ አጭር አወቃቀር መጠቀም
  rationale: ግሪኩ ግሱን በሁለተኛው ክፍል በተረዳ መንገድ ይተዋል፤ በአማርኛ ዋናውን ፍቺ ሳይጨምር ግሱን መሙላት ንባቡን ተፈጥሯዊና ግልጽ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘መንፈሳውያን/ሥጋውያን’ የሚለው ትይዩ አወቃቀር የግሪኩን ንጽጽር ይጠብቃል።
