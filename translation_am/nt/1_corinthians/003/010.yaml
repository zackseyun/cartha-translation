  text: በእኔ ላይ በተሰጠው የእግዚአብሔር ጸጋ መሠረት፣ እንደ ጥበበኛ ዋና ግንበኛ[a] መሠረት ጣልሁ፤ ሌላ ሰውም በላዩ ይገነባል። ነገር ግን እያንዳንዱ እንዴት እንደሚገነባ ይጠንቀቅ።
  philosophy: optimal-equivalence
  footnotes:
