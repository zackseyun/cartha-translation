lexical_decisions:
- source_word: εἴ
  choice: ቢኖር
  rationale: የግሪኩን ቀላል ሁኔታዊ አረፍተ ነገር በአማርኛ ተፈጥሯዊ በሆነው የ‘ቢ-’ አወቃቀር ያቀርባል።
- source_word: τινος
  choice: የማንም ሰው
  rationale: የባለቤትነት አመልካቹን ያልተወሰነ ትርጉም በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸ ἔργον
  choice: ሥራ
  rationale: በዐውደ ንባቡ ያለውን የግንባታ ምሳሌ የሚስማማ ሰፊና ያልተገደበ ቃል ነው።
- source_word: μενεῖ
  choice: ጸንቶ ቢኖር
  rationale: ‘መቆየት፣ መጽናት’ የሚለውን ትርጉም ይጠብቃል፤ በእሳት መፈተን ዐውደ ንባብም ተፈጥሯዊ ነው።
- source_word: ὃ ἐποικοδόμησεν
  choice: በላዩ ላይ የገነባው
  rationale: ἐποικοδομέω በአንድ መሠረት ላይ የመገንባትን ሐሳብ ይዟል፤ ‘በላዩ ላይ’ የቀደመውን መሠረት ያመለክታል እንጂ በዚህ ቁጥር ያልተደገመውን ስም በግልጽ አይጨምርም።
- source_word: μισθὸν
  choice: ሽልማት
  rationale: በመለኮታዊ ምዘና ዐውደ ንባብ የሚሰጥን ዋጋ በተፈጥሯዊ አማርኛ ይገልጣል፤ የ‘ደመወዝ’ ወይም ‘ክፍያ’ ትርጉም ግን በማስታወሻ ተጠብቋል።
- source_word: λήμψεται
  choice: ይቀበላል
  rationale: የወደፊት ጊዜውንና የመቀበልን ቀጥተኛ ትርጉም በክቡርና ዘመናዊ አገላለጽ ያቀርባል።
