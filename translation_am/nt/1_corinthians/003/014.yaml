review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional structure, the enduring/remaning work, and the future reception of μισθός. However, the possessive opening with a later implicit subject is less direct in Amharic, and “በላዩ ላይ” is needlessly repetitive.
  naturalness: A finite conditional with an explicit indefinite subject is clearer and more idiomatic modern standard Amharic. “ቢጸና” naturally expresses the contextual sense of μενεῖ without prematurely specifying destruction or survival.
  terminology: “ሽልማት” is a suitable contextual rendering of μισθός. The alternatives “ደመወዝ” and “ክፍያ” appropriately preserve its remuneration/payment range. “በላዩ” retains the compound ‘build on’ sense without supplying an explicit foundation noun absent from this verse.
  issues:
  - severity: low
    issue: The phrase “በላዩ ላይ” is redundant, and the sentence begins with a possessive phrase although the recipient is the person concerned.
    rationale: Using “ማንም ሰው” as the explicit subject and reducing the locative to “በላዩ” makes the conditional sentence more natural while retaining the source meaning.
  revised_text: ማንም ሰው በላዩ የገነባው ሥራ ቢጸና[a]፣ ሽልማት[b] ይቀበላል።
  revised_footnotes:
