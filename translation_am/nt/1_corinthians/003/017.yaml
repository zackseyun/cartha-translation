id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: am
  text: ማንም የእግዚአብሔርን መቅደስ ቢያፈርስ፣ እግዚአብሔር እርሱን ያፈርሰዋል፤[a] የእግዚአብሔር መቅደስ ቅዱስ ነውና፤ እናንተም ያ መቅደስ ናችሁ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ያበላሸ» ወይም «ያረክስ» ተብሎም ሊተረጎም ይችላል፤ ተመሳሳዩ ግስ በሁለቱም ስፍራዎች ተጠቅሟል።
    reason: lexical_alternative
  - marker: b
    text: «እናንተ» የብዙ ቁጥር ነው፤ ጳውሎስ ማኅበሩን በጋራ የእግዚአብሔር መቅደስ እንደሆነ ይገልጻል።
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: መቅደስ
  rationale: ቃሉ እግዚአብሔር የሚኖርበትን ቅዱስ ስፍራ ያመለክታል፤ «መቅደስ» በአማርኛ ይህን ትርጉም በተፈጥሮ ያስተላልፋል።
- source_word: φθείρει / φθερεῖ
  choice: ቢያፈርስ / ያፈርሰዋል
  rationale: በሁለቱም አጠቃቀሞች ተመሳሳይ ግስ በመጠቀም የግሪኩን የቃል ድግግሞሽና የማስጠንቀቂያውን ክብደት ይጠብቃል። ግሱ «ማበላሸት» ወይም «ማርከስ» የሚል ሰፊ ትርጉምም ሊኖረው ስለሚችል አማራጮቹ በማስታወሻ ቀርበዋል።
- source_word: τοῦτον
  choice: እርሱን
  rationale: በመጀመሪያው «ማንም» የተጠቀሰውን ነጠላ ሰው በቀጥታ ያመለክታል።
- source_word: ἅγιος
  choice: ቅዱስ
  rationale: የመቅደሱን ለእግዚአብሔር መለየትና ቅድስና በግልጽ የሚገልጽ መደበኛ አማርኛ ቃል ነው።
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: ያም መቅደስ እናንተ ናችሁ
  rationale: ነጠላውን «መቅደስ» ከብዙ ቁጥር «እናንተ» ጋር በግልጽና ተፈጥሯዊ አማርኛ ያያይዛል።
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ይጠብቃል፤ ጳውሎስ ማኅበሩን በጋራ እንደ አንድ መቅደስ ይጠቅሳል።
theological_decisions:
- issue: ጥቅሱ በዋናነት ግለሰብን ወይስ ማኅበሩን በጋራ እንደ እግዚአብሔር መቅደስ ይጠቅሳል?
  choice: ብዙ ቁጥር ያለው «እናንተ» ማኅበሩን በጋራ እንደ አንድ የእግዚአብሔር መቅደስ ይለያል።
  alternative: ከሌሎች የመጽሐፍ ቅዱስ አውዶች በመነሳት ይህን ስለ ግለሰብ አማኝ እንደተነገረ ማንበብ።
  rationale: በዚህ አውድ ነጠላው «መቅደስ» ከብዙ ቁጥር «እናንተ» ጋር ተያይዟል፤ ስለዚህ ሰዎቹ በጋራ አንድ መቅደስ መሆናቸው ዋናው ንባብ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ያፈርሳል» የሚለው ጠንካራ አገላለጽ የግሪኩን ድግግሞሽና ከባድ ማስጠንቀቂያ ለማቆየት ተመርጧል።
