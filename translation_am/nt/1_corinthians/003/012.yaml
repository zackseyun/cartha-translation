reference: 1 Corinthians 3:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: am
  text: ማንም ደግሞ በመሠረቱ ላይ በወርቅ፣ በብር፣ በውድ ድንጋዮች፣ በእንጨት፣ በደረቅ ሣር፣ በገለባ ቢገነባ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: ማንም ደግሞ … ቢገነባ
  rationale: “ማንም” የτιςን አጠቃላይና ያልተወሰነ ማጣቀሻ ይጠብቃል፤ “ደግሞ” የδέን ለስላሳ የክርክር ሽግግር ያሳያል፤ የ“ቢ-” አወቃቀር ደግሞ የεἰን ሁኔታዊ ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: በመሠረቱ ላይ … ቢገነባ
  rationale: የቀጠለውን የሕንፃ ምሳሌ በቀጥታ ይጠብቃል፤ ἐπί የሚያመለክተውም በተቀመጠው መሠረት ላይ መገንባትን ነው።
- source_word: χρυσόν, ἄργυρον
  choice: በወርቅ፣ በብር
  rationale: የቁሳቁሶቹን ቀጥተኛ ትርጉምና የዝርዝሩን ቅደም ተከተል ይጠብቃል።
- source_word: λίθους τιμίους
  choice: በውድ ድንጋዮች
  rationale: τιμίους ዋጋቸው ከፍ ያለ ወይም የከበሩ ድንጋዮችን ሊያመለክት ስለሚችል፣ “ውድ ድንጋዮች” የከበሩ ዕንቁዎችን ብቻ ሳይወስን የግንባታ ምስሉንና የምንጩን ስፋት ይጠብቃል።
- source_word: ξύλα
  choice: በእንጨት
  rationale: በግንባታ ቁሳቁስ ዝርዝር ውስጥ የξύλαን አጠቃላይ ትርጉም በተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: χόρτον
  choice: በደረቅ ሣር
  rationale: χόρτος ሣርን ወይም ድርቆሽን ሊያመለክት ይችላል፤ በዚህ የግንባታ ቁሳቁስ ዝርዝር ውስጥ “ደረቅ ሣር” ትርጉሙን ግልጽ አድርጎ ከ“ገለባ” ይለየዋል።
- source_word: καλάμην
  choice: በገለባ
  rationale: በዚህ አውድ καλάμη ከእህል መከር በኋላ የሚቀረውን ደረቅ ግንድ ወይም ገለባ ያመለክታል፤ “ገለባ” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
