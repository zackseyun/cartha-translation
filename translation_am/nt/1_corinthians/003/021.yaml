review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of ὥστε, the general prohibition, the generic sense of ἀνθρώποις, and the possessive conclusion. However, ሁሉም can naturally be heard as “everyone/all people,” whereas πάντα is neuter and means “all things/everything.”
  naturalness: ስለዚህ ማንም በሰዎች አይመካ፤ is natural modern standard Amharic. Replacing ሁሉም with ሁሉ removes an avoidable personal connotation while retaining concise, idiomatic phrasing.
  terminology: በሰዎች appropriately retains the source’s broad, generic wording without importing “leaders.” መመካት is a suitable rendering of καυχάομαι in this context.
  issues:
  - severity: low
    issue: ሁሉም may imply persons rather than things.
    rationale: The Greek πάντα is neuter plural, “all things.” While ሁሉም may be used broadly, ሁሉ more clearly expresses the comprehensive nonpersonal sense required here.
  revised_text: ስለዚህ ማንም በሰዎች አይመካ፤ ሁሉ የእናንተ ነውና።
  revised_footnotes: []
