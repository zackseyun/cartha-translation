  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: am
  text: ስለዚህ ማንም በሰዎች አይመካ፤ ሁሉ የእናንተ ነውና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሙግት የሚደረስበትን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: μηδεὶς
  choice: ማንም … አይ-
  rationale: ለሁሉም የተሰጠውን አሉታዊ ትእዛዝ በመደበኛ የአማርኛ አገባብ ይገልጣል።
- source_word: καυχάσθω
  choice: አይመካ
  rationale: ግሱ በሰው ላይ ተመሥርቶ መኩራራትን ወይም መታበይን ይከለክላል፤ ‘መመካት’ ከἐν ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν ἀνθρώποις
  choice: በሰዎች
  rationale: ἀνθρώποις በአጠቃላይ ሰዎችን እንጂ ወንዶችን ብቻ አያመለክትም፤ አውዱ የሰው መሪዎችን ቢያካትትም ትርጉሙ የግሪኩን ሰፊ አነጋገር ይጠብቃል።
- source_word: πάντα
  choice: ሁሉም
  rationale: ሁሉን አቀፍ የሆነውን የገለልተኛ ፆታ ብዙ ቁጥር ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና
  rationale: ክልከላውን የሚደግፈውን ምክንያት በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: ὑμῶν ἐστιν
  choice: የእናንተ ነው
  rationale: የባለቤትነት ግንኙነቱን ቀጥተኛና የተለመደ በሆነ አማርኛ ይገልጣል፤ ‘ሁሉም’ እንደ አንድ ጠቅላላ ስብስብ ስለሚታይ ‘ነው’ ተፈጥሯዊ ነው።
theological_decisions:
- issue: ‘በሰዎች’ የሚለው ወሰን
  choice: የግሪኩን አጠቃላይ ‘ሰዎች’ የሚለውን አነጋገር መጠበቅ
  alternative: ‘በሰው መሪዎች’ ብሎ በአውዱ መገደብ
  rationale: በቀደመው አውድ ጳውሎስ፣ አጵሎስና ኬፋ ተጠቅሰዋል፤ ሆኖም ἀνθρώποις ራሱ ሰፊ ነው። ትርጉሙን ‘መሪዎች’ ብሎ መገደብ በጽሑፉ ያለውን ስፋት በዝምታ ይፈታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘በሰዎች አይመካ’ የግሪኩን አገባብ ሳያከብድ ይጠብቃል።
