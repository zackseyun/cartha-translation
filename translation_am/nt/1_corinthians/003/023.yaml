  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: am
  text: እናንተ ግን የመሲሑ[a] ናችሁ፤ መሲሑም የእግዚአብሔር ነው።
  philosophy: optimal-equivalence
  footnotes:
