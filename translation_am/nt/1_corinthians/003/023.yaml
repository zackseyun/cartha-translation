    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም ሲሆን፣ በአማርኛ ብዙነቱን በግልጽ ያሳያል።
- source_word: δὲ
  choice: ግን / -ም
  rationale: የመጀመሪያው δὲ በቀደመው ንግግር ላይ ያለውን ንጽጽርና ቀጣይነት በ‘ግን’ ያሳያል፤ ሁለተኛው ደግሞ የንግግሩን ትይዩነት በተፈጥሯዊው አማርኛ አያያዥ ‘-ም’ ይጠብቃል።
- source_word: Χριστοῦ / Χριστὸς
  choice: የመሲሑ / መሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ተወስዶ ‘መሲሕ’ ተብሏል፤ የመጀመሪያው የባለቤትነት አገባብ በ‘የመሲሑ’ ተገልጿል፣ ሁለተኛውም ተመሳሳይ ማዕረጉን ይደግማል።
- source_word: θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት አገባብ በቀጥታ ይጠብቃል፤ ‘እግዚአብሔር’ም በዘመናዊ መደበኛ አማርኛ የተለመደው የθεός ትርጉም ነው።
theological_decisions:
- issue: Χριστοῦ እና θεοῦ የሚሉትን ሁለት የባለቤትነት አገባቦች እንዴት መግለጽ እንደሚገባ
  choice: “የመሲሑ ናችሁ፤ መሲሑም የእግዚአብሔር ነው” በሚል ቀጥተኛና ትይዩ አገባብ መተርጎም
  alternative: “የመሲሑ ናችሁ፤ መሲሑም የእግዚአብሔር ነው” በሚለው ፋንታ “የመሲሑ ወገኖች ናችሁ፤ መሲሑም የእግዚአብሔር ነው” ወይም “ለመሲሑ ትገዛላችሁ” ማለት
  rationale: ግሪኩ አጭርና ግንኙነትን የሚገልጽ ነው፤ የግንኙነቱን ትክክለኛ ዓይነት አይተነትንም። ቀጥተኛው የአማርኛ የባለቤትነት አገባብ ትይዩነቱንና ሥነ መለኮታዊ ውጥረቱን ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ አጭር፣ ክቡርና ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ነው። ሴሚኮሎኑ የሁለቱን ሐረጎች ትይዩነት ያጎላል፤ ‘ናችሁ/ነው’ የቁጥር ልዩነቱን በግልጽ ይጠብቃል።
