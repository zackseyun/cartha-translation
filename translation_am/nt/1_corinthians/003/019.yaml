source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: am
  text: የዚህ ዓለም ጥበብ በእግዚአብሔር ዘንድ[a] ሞኝነት ነውና። ምክንያቱም እንዲህ ተብሎ ተጽፎአል፦ “እርሱ ጥበበኞችን በተንኮላቸው[b] ይይዛቸዋል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከእግዚአብሔር ጋር”፤ ማለትም በእግዚአብሔር ፊት ወይም በእርሱ ፍርድ።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በብልጣብልጥነታቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: ጥበብ
  rationale: የግሪኩን መደበኛ ትርጉም ይጠብቃል፤ በዚህ አውድ ዓለም ጥበብ ነው ብሎ የሚመካበትን ነገር ያመለክታል።
- source_word: κόσμου τούτου
  choice: የዚህ ዓለም
  rationale: κόσμος እዚህ ‘ዓለም’ ማለት ሲሆን τούτου የአሁኑን ዓለማዊ ሥርዓት ይለያል።
- source_word: μωρία
  choice: ሞኝነት
  rationale: ጳውሎስ በአቅራቢያው አውድ ደጋግሞ የሚጠቀምበትን ‘foolishness’ በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: παρὰ τῷ θεῷ
  choice: በእግዚአብሔር ዘንድ
  rationale: παρά ከዳቲቭ ጋር ያለውን በእግዚአብሔር ግምገማ ወይም ፊት የሚል አንጻራዊ ትርጉም በቀጥታ ይጠብቃል።
- source_word: γέγραπται
  choice: ተጽፎአል
  rationale: የተጠናቀቀውን ተገብሮ ግስና የቅዱስ ጽሑፍ ጥቅስ ማስገቢያውን በተለመደ አማርኛ ይገልጣል።
- source_word: δρασσόμενος
  choice: ይይዛቸዋል
  rationale: መጨበጥን፣ መያዝን ወይም በወጥመድ ማጥመድን የሚያመለክተውን ኃይለኛ ምስል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σοφοὺς
  choice: ጥበበኞችን
  rationale: ጥበብ አለን የሚሉትን ሰዎች ያመለክታል፤ የግሪኩን ብዙ ቁጥር ይጠብቃል።
- source_word: πανουργίᾳ
  choice: በተንኮላቸው
  rationale: ቃሉ እዚህ ያለውን አሉታዊ፣ ያልቀና ብልሃት በግልጽ ሁኔታ ይገልጣል።
theological_decisions:
- issue: ከኢዮብ 5፥13 የተወሰደውን ጥቅስ እና የአምላክን ተግባር መግለጽ
  choice: “እርሱ ጥበበኞችን በተንኮላቸው ይይዛቸዋል”
  alternative: “ጥበበኞችን በብልጣብልጥነታቸው የሚይዘው”
  rationale: የግሪኩ መስተዋድድ ያለበት አንቀጽ እግዚአብሔርን ያመለክታል። ‘እርሱ’ ማለት በአማርኛ ጥቅሱን ግልጽና ተፈጥሯዊ ያደርገዋል፤ ዓለማዊ ጥበብን እግዚአብሔር እንደሚያፈርስ ያለውን ውጥረትም አያለዝብም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በእግዚአብሔር ዘንድ” የምንጩን አገላለጽ ሲጠብቅ፣ የግምገማ ትርጉሙ በማስታወሻ ተብራርቷል።
