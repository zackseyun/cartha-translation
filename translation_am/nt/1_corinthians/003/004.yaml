  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: am
  text: ምክንያቱም አንዱ፣ “እኔ የጳውሎስ ነኝ” ሲል፣ ሌላውም፣ “እኔ የአጵሎስ ነኝ” ሲል፣ ሰዎች አይደላችሁምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰዎች ብቻ አይደላችሁምን?” ወይም፣ “እንደ ሰዎች አትመላለሱምን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ሲል
  rationale: ከሁለቱ ተከታታይ አንቀጾች ጋር የተደጋጋሚውን ወይም አጠቃላዩን ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት ይጠብቃል።
- source_word: λέγῃ τις
  choice: አንዱ … ሲል
  rationale: የግሪኩን ያልተወሰነ ነጠላ ሰው ትርጉም ከሚቀጥለው ἕτερος ጋር በተፈጥሯዊ ሁኔታ ያዛምዳል።
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: እኔ የጳውሎስ ነኝ
  rationale: የወገንተኝነትን ግንኙነት የሚገልጸውን የግሪክ አጭር አባባል ሳያሰፋ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἕτερος δέ
  choice: ሌላውም
  rationale: በμέν … δέ የተፈጠረውን ትይዩ ንጽጽር በለስላሳ አማርኛ ያሳያል።
- source_word: Ἐγὼ Ἀπολλῶ
  choice: እኔ የአጵሎስ ነኝ
  rationale: ከቀደመው አንቀጽ የታወቀውን ግስ በአማርኛ በመሙላት ትይዩነቱንና የወገንተኝነት ትርጉሙን ይጠብቃል።
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: ተራ ሰዎች ብቻ አይደላችሁምን?
  rationale: የክርክር ጥያቄውንና በዐውዱ ያለውን ‘በሰው ብቻ መለኪያ’ የመኖር ወቀሳ ያሳያል፤ ቀጥተኛው አገላለጽና የተግባር ትርጉሙ በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: “ሰዎች” የሚለው ቃል የሰውነት ተፈጥሮን ወይስ እንደ ተራ ሰዎች መኖርን ያመለክታል?
  choice: ተራ ሰዎች ብቻ አይደላችሁምን?
  alternative: እንደ ተራ ሰዎች እየኖራችሁ አይደለምን? / ሰዎች አይደላችሁምን?
  rationale: ዐውዱ የሚወቅሰው ሰው መሆናቸውን ሳይሆን ቅናትና ክርክር የሚታይበትን በሰው ብቻ መለኪያ የሚመራ ኑሮ ነው። ሆኖም የግሪኩን አጭርነትና አሻሚነት ሙሉ በሙሉ እንዳይጠፋ አማራጮቹ በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አንዱ … ሌላውም” የሚለው አወቃቀር የግሪኩን ትይዩ ንጽጽር ይጠብቃል፤ “የጳውሎስ/የአጵሎስ ነኝ” የሚለውም በአማርኛ የወገንተኝነት አባባል ሆኖ የምንጩን አጭርነት ያቆያል።
