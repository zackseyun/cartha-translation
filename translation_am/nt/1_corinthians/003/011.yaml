id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: am
  text: ከተጣለው መሠረት ሌላ መሠረት ማንም ሊጥል አይችልምና፤ ይህም ኢየሱስ መሲሑ[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ኢየሱስ ክርስቶስ።”
    reason: Χριστός የሚለውን ቃል በተለመደው የድምፅ ቅጂ የሚያቀርብ አማራጭ።
lexical_decisions:
- source_word: θεμέλιον
  choice: መሠረት
  rationale: በዐውደ ንባቡ ያለውን የሕንፃ ምሳሌ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ይገልጣል።
- source_word: ἄλλον
  choice: ሌላ
  rationale: ከተጣለው መሠረት የተለየ ወይም ተጨማሪ መሠረት ማለቱን ያስተላልፋል።
- source_word: οὐδεὶς δύναται θεῖναι
  choice: ማንም ሊጥል አይችልም
  rationale: የችሎታውን ፍጹም አሉታዊነት ያስቀምጣል፤ ‘መሠረት መጣል’ም ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: παρὰ τὸν κείμενον
  choice: ከተጣለው መሠረት ሌላ
  rationale: መሠረቱ አስቀድሞ በቦታው መኖሩንና ሌላ መሠረት መጣል የማይቻል መሆኑን ይጠብቃል።
- source_word: ὅς ἐστιν
  choice: ይህም … ነው
  rationale: አንጻራዊው ተውላጠ ስም ወደ ‘መሠረት’ እንደሚመለስና መሠረቱ ማን እንደሆነ የሚለይበትን አገባብ በግልጽ አማርኛ ያቀርባል።
- source_word: Ἰησοῦς Χριστός
  choice: ኢየሱስ መሲሑ
  rationale: Ἰησοῦςን እንደ ስም በተለመደው መልክ ያቀርባል፤ Χριστόςንም እንደ ማዕረግ ‘መሲሑ’ ብሎ ትርጉሙንና የተወሰነነቱን ይጠብቃል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: ኢየሱስ መሲሑ
  alternative: ኢየሱስ ክርስቶስ
  rationale: በዚህ አገባብ Χριστός የመሲሕነት ማዕረጉን ይዞ ስለሚታይ ‘መሲሑ’ ተብሎ ተተርጉሟል፤ በቤተ ክርስቲያናዊ አጠቃቀም የተለመደው የድምፅ ቅጂ ግን በማስታወሻ ቀርቧል።
- issue: መሠረቱን ከኢየሱስ ጋር ማንነታዊ ማድረግ
  choice: ይህም ኢየሱስ መሲሑ ነው
  alternative: እርሱም ኢየሱስ መሲሑ ነው
  rationale: የግሪኩ ὅς በሰዋሰው ወደ θεμέλιον ይመለሳል፤ ‘ይህም’ የመሠረቱን ምሳሌያዊ ማጣቀሻ ጠብቆ ቀጥተኛውን መለያ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መሠረት መጣል’ የሚለው ተፈጥሯዊ አገላለጽ የጳውሎስን የሕንፃ ምሳሌ ይጠብቃል።
