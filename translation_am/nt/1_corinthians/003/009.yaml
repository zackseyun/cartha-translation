  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: am
  text: ምክንያቱም እኛ የእግዚአብሔር ተባባሪ ሠራተኞች ነን፤[a] እናንተም የእግዚአብሔር እርሻ፣ የእግዚአብሔር ሕንፃ ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእግዚአብሔር ጋር ተባባሪ ሠራተኞች ነን።”
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνεργοί
  choice: አብረው ሠራተኞች
  rationale: የጋራ ሥራን የሚገልጠውን ብዙ ቁጥር ስም በግልጽና ተደራሽ አማርኛ ያቀርባል።
- source_word: θεοῦ (with συνεργοί)
  choice: የእግዚአብሔር
  rationale: በዐውዱ ውስጥ ሠራተኞቹ የእግዚአብሔር መሆናቸውንና በእርሱ አገልግሎት መሰማራታቸውን የሚያሳየውን ንባብ ይጠብቃል፤ “ከእግዚአብሔር ጋር” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: γεώργιον
  choice: እርሻ
  rationale: የታረሰና የሚለማ መሬትን የሚያመለክተውን የግብርና ዘይቤ በአጭርና ተፈጥሯዊ ቃል ያስተላልፋል።
- source_word: οἰκοδομή
  choice: ሕንፃ
  rationale: በቀጣዮቹ ቁጥሮች ለሚስፋፋው የግንባታ ዘይቤ የሚስማማ ግልጽ ቃል ነው።
- source_word: ἐστε
  choice: ናችሁ
  rationale: በግሪክ ያለውን የሁለተኛ መደብ ብዙ ቁጥር በግልጽ ይወክላል።
theological_decisions:
- issue: θεοῦ συνεργοί ማለት “የእግዚአብሔር አብረው ሠራተኞች” ነው ወይስ “ከእግዚአብሔር ጋር አብረው ሠራተኞች”?
  choice: የእግዚአብሔር አብረው ሠራተኞች
  alternative: ከእግዚአብሔር ጋር አብረው ሠራተኞች
  rationale: የግሪኩ ባለቤት አገባብ ለሁለቱም ክርክር ቦታ ቢሰጥም፣ የቅርብ ዐውዱ አገልጋዮቹ የእግዚአብሔር መሆናቸውንና በእርሱ ሥር ማገልገላቸውን ያጎላል። አማራጩ ግን እውነተኛውን የትርጉም አሻሚነት ለማቆየት በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “እርሻ” እና “ሕንፃ” የሚሉት ቃላት የግብርናና የግንባታ ዘይቤዎቹን በቀጥታ ይጠብቃሉ።
