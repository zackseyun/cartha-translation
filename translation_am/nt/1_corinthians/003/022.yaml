id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: am
  text: ጳውሎስም ቢሆን፣ አጵሎስም ቢሆን፣ ኬፋም ቢሆን፣ ዓለምም ቢሆን፣ ሕይወትም ቢሆን፣ ሞትም ቢሆን፣ አሁን ያሉትም ቢሆኑ፣ ወደፊት የሚመጡትም ቢሆኑ—ሁሉ የእናንተ ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: …ም ቢሆን …ም ቢሆን
  rationale: በግሪክ የተደጋገመውን የአማራጮች ዝርዝርና አጽንዖት በተፈጥሯዊ የአማርኛ አገላለጽ ያቆያል።
- source_word: Παῦλος
  choice: ጳውሎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: Ἀπολλῶς
  choice: አጵሎስ
  rationale: በአማርኛ የተለመደውን የግል ስም አጻጻፍ ይከተላል።
- source_word: Κηφᾶς
  choice: ኬፋ
  rationale: ጽሑፉ የተጠቀመውን ሴማዊ የስም ቅርጽ ይጠብቃል፤ በትርጉሙ ተመሳሳይ በሆነው ‘ጴጥሮስ’ አልተተካም።
- source_word: κόσμος
  choice: ዓለም
  rationale: በዚህ ዝርዝር ውስጥ ያለውን ሰፊ የዓለም ወይም የተፈጠረው ሥርዓት ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ζωή
  choice: ሕይወት
  rationale: የግሪኩ ስም ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: θάνατος
  choice: ሞት
  rationale: የግሪኩን ቃል በቀጥታ የሚያስተላልፍ ግልጽ አቻ ነው።
- source_word: ἐνεστῶτα
  choice: አሁን ያሉት
  rationale: በስምነት የሚሠራውን ተሳቢ ቃል በማንኛውም የአሁን እውነታዎች ላይ ክፍት ሆኖ ያቆያል።
- source_word: μέλλοντα
  choice: ወደፊት የሚመጡት
  rationale: የወደፊቱን እውነታዎች በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πάντα
  choice: ሁሉ
  rationale: ከሰዎችና ከነገሮች ዝርዝር በኋላ ያለውን ሁሉን አቀፍ አጽንዖት በአጭር ቅርጽ ይጠብቃል።
- source_word: ὑμῶν
  choice: የእናንተ ናቸው
  rationale: የባለቤትነት ወይም የመያዝ ግንኙነቱን ሳያብራራ በቀጥታ ይገልጻል።
theological_decisions:
- issue: ‘ሁሉ የእናንተ ናቸው’ የሚለው የባለቤትነት አገላለጽ ወሰን
  choice: የእናንተ ናቸው
  alternative: ሁሉ ለእናንተ ጥቅም ነው
  rationale: ግሪኩ በቀጥታ የባለቤትነት ዘርፍን ይጠቀማል። ይህ በአውዱ ምን ዓይነት ባለቤትነት እንደሆነ ሳይፈታ የጽሑፉን አጽንዖትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የ‘…ም ቢሆን’ ድግግሞሽ የግሪኩን ዝርዝራዊ ምት ይጠብቃል፤ ረጅሙን ዝርዝር ከመደምደሚያው ለመለየት ሰረዝ ተጠቅሟል።
