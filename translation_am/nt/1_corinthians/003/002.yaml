  rationale: ምንጩ ትምህርቱን በቀጥታ አይገልጽም፤ ዘይቤውን ማቆየት ትርጉሙን ከልክ በላይ እንዳንወስንና የነገረ መለኮት አቋም እንዳናስገባ ያደርጋል።
