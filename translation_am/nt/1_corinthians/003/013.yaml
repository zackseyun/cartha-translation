  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: am
  text: የእያንዳንዱ ሥራ ግልጥ ይሆናል፤ ቀኑ[a] ያሳውቀዋልና፤ ምክንያቱም ቀኑ በእሳት[b] ይገለጣል፣ እሳቱ ራሱም የእያንዳንዱ ሥራ ምን ዓይነት እንደሆነ ይፈትነዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ቀኑ’ የሚለው ወደፊት የሚሆነውን የመለኮታዊ ምዘና ወይም የፍርድ ቀን የሚያመለክት ይመስላል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ ‘ቀኑ በእሳት አማካይነት ይገለጣል።’ ἐν πυρί የሚለው የግሪክ ሐረግ ‘በእሳት ውስጥ’ ወይም በመሣሪያ ትርጉም ‘በእሳት አማካይነት’ ተብሎ ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: የእያንዳንዱ
  rationale: የግሪኩን አከፋፋይ ነጠላ ኃይል ይጠብቃል፤ ሥራው የእያንዳንዱ ሰው መሆኑን ያሳያል።
- source_word: τὸ ἔργον
  choice: ሥራ
  rationale: በዐውዱ የገንቢውን ውጤትና ጥራት በሰፊው የሚያመለክት ተፈጥሯዊ አማርኛ ነው።
- source_word: φανερὸν γενήσεται
  choice: ግልጥ ይሆናል
  rationale: ወደፊት ሥራው የሚታወቅና የሚገለጥ መሆኑን በቀጥታ ያስተላልፋል።
- source_word: ἡ ἡμέρα
  choice: ቀኑ
  rationale: የተወሰነውን ቀን የሚያመለክተውን የግሪክ ድርሻ ይጠብቃል፤ ትርጉሙም በማስታወሻ ተብራርቷል።
- source_word: δηλώσει
  choice: ያሳውቀዋል
  rationale: ሥራውን ግልጥ ማድረግና ማሳወቅ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν πυρὶ
  choice: በእሳት
  rationale: የአማርኛው ‘በ’ ቦታዊውን ‘በእሳት ውስጥ’ እና መሣሪያዊውን ‘በእሳት አማካይነት’ ንባብ ሊሸከም ስለሚችል የግሪኩን አሻሚነት በከፊል ይጠብቃል።
- source_word: ἀποκαλύπτεται
  choice: ይገለጣል
  rationale: የመገለጥን ተገብሮአዊ ሐሳብ ሳይጨምር ይጠብቃል።
- source_word: ὁποῖόν ἐστιν
  choice: ምን ዓይነት እንደሆነ
  rationale: ፈተናው የሥራውን ዓይነትና ጥራት እንደሚያሳይ በግልጥ ይገልጣል።
- source_word: τὸ πῦρ αὐτὸ
  choice: እሳቱ ራሱ
  rationale: αὐτό የሚሰጠውን አጽንዖት በ‘ራሱ’ ይጠብቃል።
- source_word: δοκιμάσει
  choice: ይፈትነዋል
  rationale: የሥራውን እውነተኛ ባሕርይና ጥራት ለማረጋገጥ መመርመርን የሚያመለክት ግልጥ ቃል ነው።
theological_decisions:
- issue: ἡ ἡμέρα ተራ ቀንን ወይስ የወደፊቱን የመለኮታዊ ምዘና ቀን ያመለክታል?
  choice: ‘ቀኑ’ ተብሎ ተተርጉሞ የወደፊቱን የመለኮታዊ ምዘና ቀን ሊያመለክት እንደሚችል በማስታወሻ ተገልጧል።
  alternative: ‘ቀን’ ብቻ በማለት እንደ ተራ ቀን መተርጎም።
  rationale: የውስን አመልካቹ እና ዐውዱ የታወቀውን የወደፊት የምዘና ቀን ያመለክታሉ፤ ሆኖም ይህን በዋናው ጽሑፍ ላይ የሌለ ማብራሪያ በመጨመር አልተወሰነም።
- issue: ἐν πυρί ቦታዊ ወይስ መሣሪያዊ ነው?
  choice: ‘በእሳት’ ተብሎ የሁለቱም ንባቦች ዕድል ተጠብቋል።
  alternative: ‘በእሳት ውስጥ’ ወይም ‘በእሳት አማካይነት’ ብሎ አንዱን ትርጉም መወሰን።
  rationale: የግሪኩ ሐረግ ሁለቱንም ሊፈቅድ ስለሚችል ትርጉሙ ያልተፈታውን አሻሚነት አልዘጋም።
