  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጥ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሥራ’፣ ‘ግልጥ’፣ ‘ይፈትነዋል’ የተለመዱ ሲሆኑ የክፍሉን የግንባታና የምዘና ዐውድ ይጠብቃሉ።
