base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: am
  text: እንግዲህ አጵሎስ ምንድን ነው? ጳውሎስስ ምንድን ነው?[a] እነርሱ እናንተ በእነርሱ አማካይነት ያመናችሁባቸው አገልጋዮች[b] ናቸው፤ ጌታም ለእያንዳንዱ እንደሰጠ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንግዲህ አጵሎስ ማን ነው? ጳውሎስስ ማን ነው?” ግሪኩ “ማን” ሳይሆን “ምን” የሚል አገላለጽ በመጠቀሙ፣ በማንነታቸው ሳይሆን በሚናቸው ላይ ያተኩራል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አገልጋዮች።” የግሪኩ ቃል እዚህ የአገልግሎት ፈጻሚዎችን ወይም ወኪሎችን ያመለክታል እንጂ የቤተ ክርስቲያንን የዲያቆንነት ሹመት የግድ አያመለክትም።
    reason: lexical_alternative
  - marker: c
    text: “ጌታም ለእያንዳንዱ እንደሰጠ” የሚለው አባባል በግሪኩ የግሱን ተሳቢ ሳይገልጽ ቀርቷል። አንዳንዶች፣ “ጌታ ለእያንዳንዱ እንደመደበለት” ብለው ይተረጉሙታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: ምንድን ነው?
  rationale: ግሪኩ ገለልተኛ ጠያቂ ተውላጠ ስም በመጠቀሙ የሰዎቹን ማንነት ሳይሆን ሚናቸውንና ደረጃቸውን ያተኩራል፤ ‘ምንድን ነው?’ ይህን አጽንዖት ይጠብቃል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: በዐውዱ ያለውን የድምዳሜና የሽግግር ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δέ
  choice: ጳውሎስስ
  rationale: የአማርኛው ‘-ስ’ ቅጥያ በሁለቱ የንግግር ጥያቄዎች መካከል ያለውን ቀላል ንጽጽርና ቀጣይነት በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: διάκονοι
  choice: አገልጋዮች
  rationale: ቃሉ እዚህ የአገልግሎት ፈጻሚዎችን እንጂ የተወሰነውን የቤተ ክርስቲያን ዲያቆንነት ሹመት አያመለክትም።
- source_word: δι’ ὧν
  choice: በእነርሱ አማካይነት
  rationale: διά ከዘር አገባብ ጋር የመንገድን ወይም የመሣሪያነትን ሐሳብ ስለሚገልጥ ‘በእነርሱ አማካይነት’ የሚለው ትርጉም ያንን ይጠብቃል።
- source_word: ἐπιστεύσατε
  choice: ያመናችሁ
  rationale: የእምነትን ድርጊት በቀጥታ ይገልጣል፤ በግሪኩ የሌለ ተጨማሪ ትርጓሜ አያስገባም።
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: ጌታ ለእያንዳንዱ እንደሰጠ
  rationale: ግሪኩ ‘ሰጠ’ የሚለውን ግስ ያለ ተገላጭ ተሳቢ ይተዋል። ይህ አጭር አቀራረብ ‘ሥራ’፣ ‘ድርሻ’ ወይም ‘ስጦታ’ ብሎ ሳይጨምር ያንን ክፍትነት ይጠብቃል።
- source_word: κύριος
  choice: ጌታ
  rationale: መደበኛውንና ከዐውዱ ጋር የሚስማማውን አጠራር ይጠቀማል፤ በዋናው ጽሑፍ ማንን እንደሚያመለክት ከሚገባው በላይ አይገድብም።
theological_decisions:
- issue: ‘ጌታ’ (κύριος) የሚያመለክተው ማንን ነው?
  choice: በዋናው ጽሑፍ ‘ጌታ’ ተብሎ እንዳለ ተቀምጧል፤ ዐውዱ በዋነኝነት አገልግሎትን ለአገልጋዮቹ የሚሰጠውን ጌታ ኢየሱስን ያመለክታል።
  alternative: በአጠቃላይ እግዚአብሔርን እንደሚያመለክት መረዳት።
  rationale: ትርጉሙ ‘ጌታ’ የሚለውን ብቻ በማስቀመጥ ምንጩን ይከተላል፤ በዋናው ጽሑፍ ‘ኢየሱስ’ ወይም ‘እግዚአብሔር’ ብሎ በመጨመር አያብራራም።
- issue: ‘ጌታ እንደሰጠ’ በሚለው ውስጥ የተተወው የግስ ተሳቢ
  choice: ‘ሥራ’፣ ‘ሚና’ ወይም ‘ስጦታ’ የሚል ተሳቢ ሳይጨመር የግሪኩ ምጥንነት ተጠብቋል።
  alternative: ‘ጌታ ለእያንዳንዱ ድርሻውን እንደመደበለት’ ወይም ‘ሚና እንደሰጠው’ ብሎ ማብራራት።
  rationale: ተሳቢ መጨመር ግሪኩ ክፍት ያደረገውን ትርጉም በአንድ ውሳኔ ይገድባል፤ ዋናው ትርጉም ይህን አያደርግም።
