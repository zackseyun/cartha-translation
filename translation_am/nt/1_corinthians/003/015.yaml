  text: 'የማንም ሥራ ተቃጥሎ ቢጠፋ፣ ኪሳራ ይደርስበታል፤ ራሱ ግን ይድናል፣ ሆኖም በእሳት ውስጥ አልፎ እንደሚድን ሰው ነው።[a]


    [a] ወይም፣ “ሆኖም በእሳት ውስጥ አልፎ ብቻ እንደሚድን ሰው ነው፤” ወይም፣ “ሆኖም ከእሳት እንደሚያመልጥ ሰው ነው።”'
  philosophy: optimal-equivalence
  footnotes:
