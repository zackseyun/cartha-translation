    reason: የοὕτως δὲ ὡς διὰ πυρόςን አጭር ምሳሌያዊ አገላለጽ ሊሆኑ የሚችሉ አማራጭ አገላለጾች፤ ዋናው ጽሑፍ ምስሉን ሳይፈታ ያቆያል።
