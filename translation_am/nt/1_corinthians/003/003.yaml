language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: am
  text: ገና ሥጋዊያን ናችሁና። በመካከላችሁ ቅናትና ጠብ ካለ፣ ሥጋዊያን ሆናችሁ እንደ ሰው አትመላለሱምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰው መንገድ ብቻ አትኖሩምን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ገና
  rationale: የቀጠለውን ሁኔታና የጳውሎስን ወቀሳ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: γὰρ
  choice: ና / ካለ
  rationale: የመጀመሪያው γὰρ ማብራሪያዊ ኃይል በ«ና» ቅጥያ ተጠብቋል፤ ሁለተኛው ደግሞ ሁኔታው ማስረጃ መሆኑን «ካለ» በሚለው ተፈጥሯዊ አወቃቀር ያሳያል።
- source_word: σαρκικοί
  choice: ሥጋዊያን
  rationale: ከσάρξ ጋር ያለውን የቃልና የምስል ግንኙነት ይጠብቃል፤ «ዓለማውያን» ወይም «ኃጢአተኞች» በማለት ትርጉሙን አያጠብም።
- source_word: ὅπου
  choice: ካለ
  rationale: በአማርኛ ተፈጥሯዊ በሆነ ሁኔታ «በመካከላችሁ ... ካለ» ተብሎ የነገሩ መኖር የሥጋዊነታቸው ማስረጃ መሆኑን ያሳያል።
- source_word: ζῆλος
  choice: ቅናት
  rationale: ከጠብ ጋር በቀረበበት አሉታዊ አውድ የተገባውን የምቀኝነት ወይም የቅናት ስሜት ይገልጻል።
- source_word: ἔρις
  choice: ጠብ
  rationale: አለመስማማትንና ግጭትን በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: οὐχὶ
  choice: አትመላለሱምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ የአጠያየቅ ቅርጽ ያለ ተጨማሪ አጽንዖት ይጠብቃል።
- source_word: κατὰ ἄνθρωπον
  choice: እንደ ሰው
  rationale: የነጠላውን ἄνθρωπον ቅርጽና በመንፈስ ከተመራ ኑሮ ጋር ያለውን ንጽጽር በግልጽ መልኩ ይጠብቃል።
- source_word: περιπατεῖτε
  choice: ትመላለሳላችሁ
  rationale: ጳውሎስ ለአኗኗርና ለምግባር የሚጠቀምበትን የመራመድ ምስል በአማርኛው «መመላለስ» ይጠብቃል።
theological_decisions:
- issue: የσαρκικοί ሥጋ-ነክ ቋንቋ
  choice: ሥጋዊያን
  alternative: ዓለማውያን / ኃጢአተኞች / በኃጢአተኛ ተፈጥሮ የምትመሩ
  rationale: ጳውሎስ አማኞችን ሥጋዊ በሆነ ምግባራቸው ይወቅሳል፤ ቃሉን ወደ አንድ የተወሰነ ሥነ መለኮታዊ ማብራሪያ ሳያሰፋ የሥጋን ዘይቤ መጠበቅ የጽሑፉን ውጥረት ያቆያል።
- issue: የκατὰ ἄνθρωπον አተረጓጎም
  choice: እንደ ሰው
  alternative: በሰው መንገድ ብቻ / እንደ ተራ ሰዎች
  rationale: ዋናው ጽሑፍ የግሪኩን አጭርና ግልጽ አነጋገር ይጠብቃል፤ «ብቻ» የሚለውን ትርጓሜያዊ አጽንዖት በማስታወሻ ያቀርባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «ሥጋዊያን» እና «መመላለስ» የጳውሎስን ቁልፍ ምስላዊ ቋንቋ ይጠብቃሉ። የማስታወሻው ምልክት በሚያብራራው «እንደ ሰው መመላለስ» ሐረግ መጨረሻ ላይ ተቀምጧል።
