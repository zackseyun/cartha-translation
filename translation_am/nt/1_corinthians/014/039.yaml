  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: am
  text: ስለዚህ፣ ወንድሞቼ ሆይ፣[a] ትንቢት ለመናገር በጣም ፈልጉ፤ በልሳናትም መናገርን አትከልክሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች ሆይ።” የግሪኩ ቃል “ወንድሞች” ይላል፤ ነገር ግን መላውን ጉባኤ በአካታችነት ሊጠራ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ውይይት የሚወጣውን ማጠቃለያዊ ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀδελφοί μου
  choice: ወንድሞቼ ሆይ
  rationale: የግሪኩን ባለቤትነት (‘የእኔ’) እና የጥሪ ቅርጽ ይጠብቃል፤ በዐውዱ ግን መላውን ጉባኤ ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ζηλοῦτε
  choice: በጣም ፈልጉ
  rationale: የአሁን ጊዜ ትእዛዙንና የጽኑ ምኞት አዎንታዊ ሐሳብ ግልጽና ዘመናዊ በሆነ ቋንቋ ያስተላልፋል።
- source_word: τὸ προφητεύειν
  choice: ትንቢት ለመናገር
  rationale: የግሪኩን አርቲክል ያለው የግስ ስም በተፈጥሯዊ የአማርኛ የዓላማ አገላለጽ ያቀርባል።
- source_word: μὴ κωλύετε
  choice: አትከልክሉ
  rationale: ቀጥተኛውን ክልከላ ይጠብቃል፤ κωλύω በዚህ የጉባኤ መመሪያ ዐውድ ‘መከልከል’ የሚለውን ጠንካራ ሐሳብ ይዟል።
- source_word: τὸ λαλεῖν γλώσσαις
  choice: በልሳናት መናገርን
  rationale: በምዕራፉ ውስጥ እየተወያየበት ያለውን ድርጊት በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አገላለጽ ያስተላልፋል፤ የግሪኩን የብዙ ቁጥር γλώσσαιςም ይጠብቃል።
theological_decisions:
