  choice: ወንድሞቼ ሆይ
  alternative: ወንድሞችና እህቶች ሆይ
  rationale: ዋናው ጽሑፍ የግሪኩን ሰዋሰዋዊ ወንድ ብዙ ቁጥርና ‘የእኔ’ የሚለውን ግንኙነት ይጠብቃል፤ ቃሉ በዐውዱ መላውን ጉባኤ በአካታችነት ሊጠራ እንደሚችል ግን በማስታወሻ ይገለጻል።
