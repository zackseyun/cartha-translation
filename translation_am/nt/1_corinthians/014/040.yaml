  text: But let everything be done decently and in order[a].
translation:
  language: am
  text: ነገር ግን፣ ሁሉም ነገር በተገቢው ሁኔታ[a]ና በሥርዓት ይደረግ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሚመጥን ሁኔታ።” የግሪኩ ቃል ተገቢና የሚመጥን አደራረግን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ሁሉም ነገር
  rationale: የግሪኩን ሰፊና አጠቃላይ ወሰን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ውይይት ወደ ማጠቃለያ መመሪያው የሚደረገውን ቀላል ንጽጽር ወይም ሽግግር ያሳያል።
- source_word: εὐσχημόνως
  choice: በሚገባ
  rationale: ተገቢ፣ የሚመጥንና ክብር ያለው አደራረግ የሚለውን ትርጉም በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: κατὰ τάξιν
  choice: በሥርዓት
  rationale: ነገሮች በተገቢ አደረጃጀት ወይም ቅደም ተከተል መከናወናቸውን በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: γινέσθω
  choice: ይደረግ
  rationale: የሦስተኛ መደብ ትእዛዛዊ ኃይሉን ይጠብቃል፤ በዚህ የማኅበር አውድም ከ‘ይሁን’ ይልቅ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በአምልኮ ስብሰባ አውድ ውስጥ የትእዛዙ ወሰን
  choice: በማኅበሩ ውስጥ ሁሉ ተገቢና ሥርዓታማ እንዲሆን የሚሰጥ አጠቃላይ መመሪያ
  alternative: የማይለወጥ የአምልኮ ፕሮግራም ቅደም ተከተልን የሚደነግግ ጠባብ ሕግ፣ ወይም ከቅርብ አውዱ ባሻገር ለሁሉም የቤተ ክርስቲያን ተግባር በቀጥታ የሚዘረጋ መርሕ
  rationale: ጥቅሱ ስለ ማኅበር ንግግርና ሥርዓት የቀደመውን ውይይት ያጠቃልላል። ትርጉሙ የግሪኩን አጠቃላይነት ይጠብቃል፤ የአንድን ቤተ እምነት ሥርዓተ አምልኮ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። “በሚገባና በሥርዓት” የሚለው ጥምረት የεὐσχημόνως እና κατὰ τάξιν ልዩነትን ሳያጠፋ ተፈጥሯዊ ንባብ ይሰጣል።
