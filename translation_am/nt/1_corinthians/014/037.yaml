  choice: “ማንም ... ሰው” በሚል አጠቃላይ ነጠላ አገላለጽ ማቅረብ
  alternative: በግልጽ የወንድ ተውላጠ ስም ማቅረብ
  rationale: አማርኛው ‘ማንም ... ሰው’ የግሪኩን አጠቃላይ ነጠላ ማጣቀሻ ይጠብቃል፤ የወንድ ተውላጠ ስም ሳያስገድድም ተፈጥሯዊ ነው።
