lexical_decisions:
- source_word: δοκεῖ
  choice: ራሱን ... እንደሆነ የሚያስብ
  rationale: በዚህ አውድ ቃሉ አንድ ሰው ስለ ራሱ ያለውን ግምት ወይም የሚያቀርበውን  दावा ያመለክታል፤ ይህ አተረጓጎም የጳውሎስን የማረሚያ ቃና ይጠብቃል።
- source_word: προφήτης
  choice: ነቢይ
  rationale: በመንፈሳዊ ስጦታዎችና በትንቢት ንግግር አውድ የተለመደውና ግልጽ አቻ ቃል ነው።
- source_word: πνευματικός
  choice: መንፈሳዊ ሰው
  rationale: ግሪኩ ስም ሳይጨምር የተጠቀመበትን ቅጽል በተፈጥሯዊ አማርኛ ያቀርባል፤ ሰውየው በመንፈስ እንደታደለ ወይም እንደሚመራ የሚያደርገውን ሰፊ  दावा ሳያጠብ ይጠብቃል።
- source_word: ἐπιγινωσκέτω
  choice: ይወቅ
  rationale: ትእዛዛዊውን ኃይል በቀላልና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ እዚህ ማወቅ የጳውሎስን ጽሑፍ ሥልጣን መቀበልንም ያካትታል።
- source_word: ἃ γράφω ὑμῖν
  choice: ለእናንተ የምጽፈው
  rationale: የግሪኩን ዝምድናዊ ሐረግና የአሁን ጊዜ ግስ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κυρίου ἐστίν
  choice: የጌታ ትእዛዝ መሆኑን
  rationale: ግሪኩ ቃል በቃል ‘የጌታ ነው’ የሚል አጭርና ስም የጎደለው አገላለጽ ነው። በአውዱ የጽሑፉን ከጌታ የመጣ አስገዳጅ ሥልጣን ግልጽ ለማድረግ ‘ትእዛዝ’ ተሞልቷል፣ ቃል በቃል አማራጩም በማስታወሻ ተጠብቋል።
theological_decisions:
