  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: am
  text: ማንም ራሱን ነቢይ ወይም መንፈሳዊ ሰው እንደሆነ የሚያስብ ከሆነ፣ ለእናንተ የምጽፈው የጌታ ትእዛዝ መሆኑን ይወቅ።[a]
  philosophy: optimal-equivalence
  footnotes:
