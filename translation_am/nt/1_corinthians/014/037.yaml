    text: ወይም፣ “ለእናንተ የምጽፈው የጌታ ነው።” ግሪኩ ቃል በቃል “የጌታ ነው” ይላል፤ “ትእዛዝ” የሚለው ቃል በግሪኩ በግልጽ የለም፣ ሐሳቡን ግልጽ ለማድረግ ተጨምሯል።
