review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the verse’s comparison, the instrumental image of speaking ‘through the tongue,’ the conditional clause, and the metaphor of speaking ‘into the air.’ However, ይታወቃል (‘will be known’) is less precise in this communicative context than an expression for being understood, which is the force of γνωσθήσεται here.
  naturalness: The wording is generally clear and appropriately formal. Replacing the somewhat indirect ሊገባ የሚችል ንግግር with ግልጽ ንግግር and recasting the final periphrastic expression produces more idiomatic modern standard Amharic without reducing the source imagery.
  terminology: ግልጽ ንግግር naturally conveys εὔσημον λόγον in this context. ሊረዳ የሚችል (‘can be understood’) in the footnote accurately states the relevant semantic emphasis. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: የሚነገረው እንዴት ይታወቃል?
    rationale: Although ‘be known’ can be literal, the Greek passive in this context asks whether hearers will understand the utterance. እንዴት ይገባል? is the more natural and contextually faithful Amharic expression.
  - severity: low
    issue: ወደ አየር የምትናገሩ ትሆናላችሁና
    rationale: This is understandable but overly calqued and awkward in Amharic. ወደ አየር ትናገራላችሁና preserves the future sense and metaphor more idiomatically.
  revised_text: እንዲሁም እናንተ፣ በምላሳችሁ ግልጽ ንግግር[a] ባታቀርቡ፣ የሚነገረው እንዴት ይገባል? ወደ አየር ትናገራላችሁና።
