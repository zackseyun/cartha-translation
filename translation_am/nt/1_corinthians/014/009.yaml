id: 1CO.14.9
reference: 1 Corinthians 14:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: am
  text: እንዲሁም እናንተ፣ በምላሳችሁ ግልጽ ንግግር[a] ባታቀርቡ፣ የሚነገረው እንዴት ይገባል? ወደ አየር ትናገራላችሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊለይ የሚችል ንግግር” ወይም “ግልጽ መልእክት።” የግሪኩ ቃል ሰሚዎች ሊለዩትና ሊረዱት የሚችሉትን ንግግር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንዲሁም እናንተ
  rationale: ጳውሎስ ከቀደመው ምሳሌ ጋር ያደረገውን ንጽጽርና ለቆሮንቶስ ሰዎች ያቀረበውን ቀጥተኛ ንግግር ይጠብቃል።
- source_word: διὰ τῆς γλώσσης
  choice: በምላሳችሁ
  rationale: ‘ምላስ’ የሚለውን ተጨባጭ ምስል ይጠብቃል፤ በዚህ ዐውድ በንግግር አማካይነት ማለት ነው።
- source_word: εὔσημον λόγον
  choice: ሊገባ የሚችል ንግግር
  rationale: ለሰሚዎች በቀላሉ የሚለይና የሚገባ ንግግር የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δῶτε
  choice: ባታቀርቡ
  rationale: የግሪኩን ‘መስጠት’ ሐሳብ በአማርኛ ከ‘ንግግር’ ጋር ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
- source_word: πῶς γνωσθήσεται τὸ λαλούμενον
  choice: የሚነገረው እንዴት ይታወቃል?
  rationale: የተነገረው በሰሚዎች መታወቁንና መገባቱን የሚመለከተውን ጥያቄ ይጠብቃል።
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: ወደ አየር የምትናገሩ ትሆናላችሁና
  rationale: ማንም ያልተረዳውን ከንቱ ንግግር የሚያሳየውን ‘ወደ አየር’ የሚለውን የግሪክ ዘይቤ ሳይፈታ ይጠብቃል።
