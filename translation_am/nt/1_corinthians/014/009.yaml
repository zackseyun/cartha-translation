revisions:
- from: እንዲሁም እናንተ በምላሳችሁ ሊገባ የሚችል ንግግር[a] ባታቀርቡ፣ የሚነገረው እንዴት ይታወቃል? ወደ አየር የምትናገሩ ትሆናላችሁና።
  to: እንዲሁም እናንተ፣ በምላሳችሁ ግልጽ ንግግር[a] ባታቀርቡ፣ የሚነገረው እንዴት ይገባል? ወደ አየር ትናገራላችሁና።
  rationale: The revision strengthens the communicative sense of the rhetorical question, improves the idiomatic flow of the concluding future expression, and uses a concise main rendering for εὔσημον λόγον. It retains the Greek’s concrete ‘tongue’ and ‘air’ imagery and keeps lexical alternatives in the footnote.
