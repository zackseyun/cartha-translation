  rationale: የተናጋሪዎቹን ቁጥር የሚገድበውን መመሪያ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል። “ሰዎች” ከአውዱ የተገነዘበውን ተናጋሪ ግልጽ ያደርጋል።
