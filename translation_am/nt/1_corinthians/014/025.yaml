  terminology: ‘ልብ,’ ‘ምስጢሮች,’ ‘ይሰግዳል,’ and ‘በመካከላችሁ’ are suitable modern-standard Amharic renderings in a dignified biblical register. The footnote preserves the source phrase’s contextual semantic range without doctrinally narrowing it.
