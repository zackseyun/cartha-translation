source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: am
  text: የልቡም ምስጢሮች ግልጽ ይሆናሉ፤ እንዲህም በግንባሩ ተደፍቶ ለእግዚአብሔር ይሰግዳል፤ “በእውነት እግዚአብሔር በመካከላችሁ አለ”[a] ብሎ ያውጃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በእውነት እግዚአብሔር በእናንተ ውስጥ አለ።”
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ κρυπτὰ τῆς καρδίας αὐτοῦ
  choice: የልቡ ምስጢሮች
  rationale: ልብ የሐሳብና የውስጣዊ ዓላማ ማዕከል የሆነበትን መጽሐፍ ቅዱሳዊ አነጋገር ይጠብቃል፤ ምስጢሮችም በሰውየው ውስጥ የተሰወሩትን ነገሮች በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: φανερὰ γίνεται
  choice: ግልጽ ይሆናሉ
  rationale: የተሰወሩት ነገሮች ወደ ግልጽነት መምጣታቸውን የγίνεται ሂደታዊ ኃይል ጠብቆ ይገልጻል።
- source_word: οὕτως
  choice: እንዲሁም
  rationale: የልብ ምስጢሮች መገለጥን ከሚከተለው ምላሽ ጋር በተፈጥሯዊ መንገድ ያገናኛል።
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: በግንባሩ ወድቆ
  rationale: የመውደቁንና የመደፋቱን ሥጋዊ አቀማመጥ በአጭርና በታወቀ የአማርኛ አነጋገር ያሳያል።
- source_word: προσκυνήσει τῷ θεῷ
  choice: ለእግዚአብሔር ይሰግዳል
  rationale: προσκυνέω በዚህ አውድ ለእግዚአብሔር የሚቀርብ አምልኮ ነው፤ ይሰግዳል የአምልኮውንና የመደፋቱን ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπαγγέλλων
  choice: ያውጃል
  rationale: ሰውየው የደረሰበትን መደምደሚያ በግልጽና በጽኑ ሁኔታ መናገሩን ያሳያል።
- source_word: Ὄντως
  choice: በእውነት
  rationale: የመጨረሻውን እውቅና እርግጠኝነትና አጽንዖት ይጠብቃል።
- source_word: ἐν ὑμῖν
  choice: በመካከላችሁ
  rationale: አውዱ ስለተሰበሰበው ጉባኤ ስለሆነ፣ በመካከላችሁ የእግዚአብሔርን በማኅበሩ መካከል መገኘት በግልጽ ያሳያል።
theological_decisions:
- issue: በመጨረሻው እውቅና ውስጥ የἐν ὑμῖν ትርጉም
  choice: በመካከላችሁ
  alternative: በእናንተ ውስጥ
  rationale: በቅርብ አውዱ ሰውየው በተሰበሰበው ቤተ ክርስቲያን ውስጥ በትንቢት አገልግሎት የተገለጠውን የእግዚአብሔር መገኘት ያውቃል። የግሪኩ ሐረግ ግን “በእናንተ ውስጥ” የሚለውንም ሊፈቅድ ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የመጽሐፍ ቅዱስ ቁልፍ ቃላት “ልብ” እና “ይሰግዳል” ተጠብቀዋል፤ የἐν ὑμῖν እውነተኛ አሻሚነትም በአማራጭ ማስታወሻ ተቀምጧል።
