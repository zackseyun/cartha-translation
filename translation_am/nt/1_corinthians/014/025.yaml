  verdict: revise
  source_fidelity: The draft correctly conveys the hidden matters of the person’s heart becoming evident, the resulting prostration and worship of God, and the confession that God is truly among the congregation. The alternative sense of ἐν ὑμῖν (‘in you’) is appropriately retained in a footnote.
