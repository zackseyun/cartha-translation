  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: am
  text: ድምፅ የሚያሰሙ ሕይወት የሌላቸው ነገሮች እንኳን—ዋሽንት ወይም በገና[a]—የተለያዩ ቅላጼዎችን ካላሰሙ፣ በዋሽንት የሚጫወተው ወይም በበገና የሚጫወተው እንዴት ይታወቃል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በገና” እዚህ የግሪኩ κιθάρα ተደርጎ ተተርጉሟል። κιθάρα በትክክል ከሊራ ጋር የሚመሳሰል ጥንታዊ ባለገመድ የሙዚቃ መሣሪያን ያመለክታል።
    reason: lexical_alternative
