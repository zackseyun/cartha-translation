lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: ካልሆነ ግን፣ ... ብት...
  rationale: የቀደመውን ክርክር ተከትሎ የሚመጣውን ሁኔታና ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὐλογῇς
  choice: ብትባርክ
  rationale: በአምልኮ ጊዜ በንግግር የሚቀርብን ቡራኬ ወይም ውዳሴ ያመለክታል፤ የግሪኩን ቀጥተኛ የቃል ግንኙነትም ይጠብቃል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የግሪኩን መሣሪያዊ ወይም የሁኔታ ፍቺ ሳይወስን ይጠብቃል፤ የሰውን መንፈስ ወይም በመንፈስ የሚሰጥን ንግግር ለይቶ አይወስንም።
- source_word: ὁ ἀναπληρῶν τὸν τόπον
  choice: ስፍራ የያዘው
  rationale: በጉባኤው ውስጥ አንድን ቦታ ወይም ሚና መያዝን የሚያሳየውን ምስላዊ አነጋገር ይጠብቃል።
- source_word: τοῦ ἰδιώτου
  choice: ያልተማረው ሰው
  rationale: በዚህ አውድ ዋናው ነጥብ የሚነገረውን ለመረዳት ልዩ ዕውቀት አለመኖሩ ነው፤ ሌሎች ሊሆኑ የሚችሉ ፍቺዎች በማስታወሻ ተጠብቀዋል።
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: “አሜን” እንዴት ይላል?
  rationale: በጉባኤ ውስጥ የሚሰጠውን የስምምነት ምላሽ በተፈጥሯዊ አማርኛ ያሳያል፤ “አሜን” የሚለውን የአምልኮ ቃል ይጠብቃል።
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: ለምስጋናህ
  rationale: “አሜን” ለሚቀርበው የምስጋና ንግግር የሚሰጥ ምላሽ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ ቃሉን እንደ ኋለኛው ቴክኒካዊ የቁርባን ስያሜ አይወስነውም።
- source_word: τί λέγεις οὐκ οἶδεν
  choice: የምትለውን ስለማያውቅ
  rationale: የሌላው ሰው ችግር የንግግሩ ትርጉም አለመታወቁ መሆኑን በቀጥታ ያሳያል።
theological_decisions:
- issue: በካሪዝማዊ የአምልኮ አውድ πνεύματι የሚለው ትርጉም
  choice: “በመንፈስ” ተብሎ በአጠቃላይ ተተርጉሟል።
  alternative: “በመንፈስህ” ወይም “በመንፈስ ቅዱስ”
  rationale: ጥቅሱ የተናጋሪውን የሰው መንፈስ ወይም በመንፈስ ቅዱስ የተነሣሣ ንግግርን በግልጽ ለይቶ አይወስንም፤ ትርጉሙ ይህን የሥነ መለኮት ውጥረት አልፈታውም።
- issue: εὐχαριστίᾳ የሚለው ቃል አጠቃቀም
  choice: “ምስጋና” ተብሎ ተተርጉሟል።
  alternative: “ቁርባን”
  rationale: የቅርብ አውዱ በጉባኤ ውስጥ በቃል ስለሚቀርብ ምስጋና ነው፤ ቃሉን “ቁርባን” ማለት የኋለኛውን ሥነ ሥርዓታዊ ልዩነት ያለማስረጃ ወደ ጥቅሱ ያስገባል።
