  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: am
  text: 'ካልሆነ ግን፣ በመንፈስ[b] ቡራኬ ብታቀርብ፣ ያልተማረው ሰው[a] ቦታ የያዘው የምትለውን ስለማያውቅ፣ በምስጋናህ[c] ላይ “አሜን” እንዴት ይላል?


    [a] “ያልተማረው ሰው” የሚለው “የውጭ ሰው፣” “ተራ ሰው” ወይም “ዕውቀት የሌለው ሰው” ተብሎም ሊተረጎም ይችላል።


    [b] “በመንፈስ” የሚለው “በመንፈስ ተጠቅመህ” ወይም “ከመንፈስ ጋር” የሚል ፍቺ ሊኖረው ይችላል፤ ግሪኩ እዚህ የበለጠ የተወሰነ ትርጉም እንድንመርጥ አያስገድድም።


    [c] እዚህ “ምስጋና” ማለት ምስጋናን መስጠት ማለት ነው፤ ቃሉ በኋላ ያገኘውን “ቁርባን” የሚል ልዩ ሥነ ሥርዓታዊ ትርጉም የግድ አያመለክትም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ያልተማረው ሰው” የሚለው “የውጭ ሰው፣” “ተራ ሰው” ወይም “ዕውቀት የሌለው ሰው” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “በመንፈስ” የሚለው “በመንፈስ ተጠቅመህ” ወይም “ከመንፈስ ጋር” የሚል ፍቺ ሊኖረው ይችላል፤ ግሪኩ እዚህ የበለጠ የተወሰነ ትርጉም እንድንመርጥ አያስገድድም።
    reason: alternative_reading
  - marker: c
    text: እዚህ “ምስጋና” ማለት ምስጋናን መስጠት ማለት ነው፤ ቃሉ በኋላ ያገኘውን “ቁርባን” የሚል ልዩ ሥነ ሥርዓታዊ ትርጉም የግድ አያመለክትም።
