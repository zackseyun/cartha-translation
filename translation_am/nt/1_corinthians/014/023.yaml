  source_fidelity: The draft preserves the conditional structure, the whole gathered congregation, the distinction between ἰδιῶται and ἄπιστοι, the rhetorical question, and the debated sense of γλώσσαι. A small revision makes the conditional force of συνέλθῃ explicit and avoids rendering ἰδιῶται as general lack of education.
  naturalness: The revised wording is smooth modern standard Amharic. “መላው ማኅበር ... ቢሰበሰብ” is more idiomatic and grammatically clear than a participial “ተሰብስቦ” within this conditional sentence.
  terminology: “ማኅበር,” “ልሳኖች,” and “የማያምኑ ሰዎች” are retained. “ያልተለማመዱ ሰዎች” better conveys people not acquainted with the congregation’s practice, rather than people lacking formal education.
