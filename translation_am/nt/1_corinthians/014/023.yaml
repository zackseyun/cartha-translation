  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ጥያቄ ኃይል ተጠብቋል፤ የግርጌ ማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ቀጥለው ተቀምጠዋል።
