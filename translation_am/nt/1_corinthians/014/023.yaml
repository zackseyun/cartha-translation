    issue: “ያልተማሩ ሰዎች” can naturally mean generally uneducated people.
    rationale: ἰδιῶται in this context concerns people unacquainted with or uninitiated in the relevant congregational practice; it is distinguished from unbelievers and should not be narrowed to educational status.
  - severity: low
    issue: The main clause uses “ተሰብስቦ” rather than an explicit conditional form.
    rationale: The Greek has ἐὰν συνέλθῃ. Rendering it as “ቢሰበሰብ” clearly carries the conditional relationship through the sentence.
