source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: am
  text: 'ስለዚህ፣ መላው ማኅበር በአንድ ስፍራ ቢሰበሰብና ሁሉም በልሳኖች ቢናገሩ[a]፣ ያልተለማመዱ ሰዎች[b] ወይም የማያምኑ ሰዎች ቢገቡ፣ “አብዳችኋል” አይሉምን?


    [a] ወይም፣ “በቋንቋዎች ቢናገሩ።” የግሪኩ ቃል “ቋንቋዎች” ማለት ሊሆን ይችላል፤ “ልሳኖች” የሚለው ግን የክስተቱን ባሕርይ ሳይወስን በዚህ አውድ የተለመደውን አገላለጽ ይጠብቃል።


    [b] ወይም፣ “ከማኅበሩ ውጭ ያሉ ሰዎች።” የግሪኩ ቃል ከዚህ ቀጥሎ ከተጠቀሱት “የማያምኑ ሰዎች” ተለይቶ፣ የማኅበሩን ልምምድ ያላወቁ ወይም ያልተለማመዱ ሰዎችን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቋንቋዎች ቢናገሩ።” የግሪኩ ቃል “ቋንቋዎች” ማለት ሊሆን ይችላል፤ “ልሳኖች” የሚለው ግን የክስተቱን ባሕርይ ሳይወስን በዚህ አውድ የተለመደውን አገላለጽ ይጠብቃል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ከማኅበሩ ውጭ ያሉ ሰዎች።” የግሪኩ ቃል ከዚህ ቀጥሎ ከተጠቀሱት “የማያምኑ ሰዎች” ተለይቶ፣ የማኅበሩን ልምምድ ያላወቁ ወይም ያልተለማመዱ ሰዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: ማኅበር
  rationale: በጳውሎስ አጠቃቀም የተሰበሰበውን የክርስቲያኖች ማኅበረሰብ ያመለክታል፤ “ማኅበር” በዚህ የመሰብሰብ አውድ ተፈጥሯዊ ነው።
- source_word: ὅλη
  choice: ሁሉ
  rationale: ማኅበሩ በሙሉ መሰብሰቡን ያጎላል።
- source_word: ἐπὶ τὸ αὐτό
  choice: በአንድ ስፍራ
  rationale: አንድ ላይ በተመሳሳይ ቦታ መሰብሰብን የሚያሳይ ፈሊጣዊ አገላለጽ ነው።
- source_word: λαλῶσιν γλώσσαις
  choice: በልሳኖች ቢናገሩ
  rationale: “ልሳኖች” በ1 ቆሮንቶስ 12–14 ለተገለጸው መንፈሳዊ የንግግር ክስተት የተለመደ ስያሜ ሲሆን፣ “ቋንቋዎች” ብሎ በመተርጎም የክስተቱን ባሕርይ አስቀድሞ አይወስንም።
- source_word: ἰδιῶται
  choice: ያልተማሩ ሰዎች
  rationale: በዚህ ሁኔታ ወይም ልምምድ ያልተማሩ፣ ያልተረዱ ወይም ያልተነሱ ሰዎችን ያመለክታል፤ ከ“የማያምኑ” ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: ἄπιστοι
  choice: የማያምኑ ሰዎች
  rationale: እምነት የሌላቸውን በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: μαίνεσθε
  choice: አብዳችኋል
  rationale: የግሪኩን ጠንካራ ክስ በቀጥተኛ፣ ተፈጥሯዊና ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: አይሉምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የንግግር ጥያቄ ቅርጽ ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የድምዳሜ ግንኙነት ያሳያል።
- source_word: συνέλθῃ
  choice: ተሰብስቦ
  rationale: በአንድ ላይ መሰብሰብን በተፈጥሯዊ አማርኛ ይገልጻል።
