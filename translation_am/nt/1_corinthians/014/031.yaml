  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: am
  text: ምክንያቱም ሁላችሁም አንድ በአንድ[a] ትንቢት መናገር ትችላላችሁ፤ ይህም ሁሉም እንዲማሩና ሁሉም እንዲበረታቱ[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአንድ ጊዜ አንድ ሰው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሁሉም እንዲመከሩ” ወይም “እንዲጽናኑ።” የግሪኩ ግስ እንደ አውዱ ማበረታታትን፣ መምከርን ወይም ማጽናናትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: መናገር ትችላላችሁ
  rationale: የችሎታንና የሚቻል መሆንን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው መመሪያ ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት ይጠብቃል።
- source_word: καθ’ ἕνα
  choice: አንድ በአንድ
  rationale: ተከታትሎ፣ በአንድ ጊዜ አንድ ሰው ብቻ እንዲናገር የሚያመለክተውን ፈሊጣዊ አነጋገር በግልጽ ያቀርባል።
- source_word: πάντες
  choice: ሁላችሁም / ሁሉም
  rationale: በመጀመሪያው የሁለተኛ መደብ ብዙ ቁጥር ግስ ጋር የሚስማማውን ‘ሁላችሁም’፣ በቀጣዮቹ ሐረጎች ደግሞ ‘ሁሉም’ በመጠቀም የቃሉን ሦስት ጊዜ መደገምና ስፋት ጠብቋል።
- source_word: προφητεύειν
  choice: ትንቢት መናገር
  rationale: የጳውሎስን የተለመደ ምድብ ሳያጠብ ወይም በትርጓሜ ሳይተካ በተለመደ አማርኛ ያቀርባል።
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μανθάνωσιν
  choice: እንዲማሩ
  rationale: ከἵνα ጋር ያለውን የዓላማ ሐሳብና አጠቃላይ የመማር ትርጉም ይጠብቃል።
- source_word: παρακαλῶνται
  choice: እንዲበረታቱ
  rationale: በጉባኤው የመታነጽ አውድ ውስጥ ማበረታታትን፣ መምከርን ወይም ማጽናናትን ሊያካትት የሚችለውን ሰፊ ትርጉም በተሻለ ሁኔታ ያቀርባል።
theological_decisions:
- issue: በጉባኤ መመሪያው ውስጥ የπάντες (‘ሁሉ’) ወሰን
  choice: የመጀመሪያውን ‘ሁላችሁም’፣ ቀጣዮቹን ሁለት ጊዜያት ‘ሁሉም’ ብሎ መተርጎም፣ ማንን እንደሚያመለክቱ ከአውዱ በላይ ሳይገድብ
  alternative: ‘ነቢያት ሁሉ’ ወይም ‘እያንዳንዳችሁ’ ብሎ ወሰኑን በግልጽ መጥበብ
  rationale: የግሪኩ ጽሑፍ πάντεςን ሦስት ጊዜ ይደግማል። የመጀመሪያው ትንቢት ሊናገሩ የሚችሉትን፣ ቀጣዮቹ ደግሞ ተሰብሳቢዎቹን ሊያመለክቱ ይችላሉ፤ ትርጉሙ ግን ይህን ከግሪኩ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ድግግሞሽና የዓላማ ግንኙነት ተጠብቀዋል፤ የπαρακαλέω ሰፊ የትርጉም ክልል በማስታወሻ ቀርቧል።
