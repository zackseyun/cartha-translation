  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: am
  text: ነገር ግን ሁሉም ትንቢት ቢናገሩና የማያምን ወይም ጉዳዩን የማያውቅ ሰው[a] ቢገባ፣ በሁሉም ይጋለጣል፤ በሁሉም ይመረመራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከማኅበሩ ውጭ ያለ ሰው።” የግሪክኛው ቃል ስለ ጉባኤው ልምምድ ወይም ስለሚነገረው ነገር ያልተዋወቀን፣ በዚያ ቡድን ውስጥ ያልተሳተፈን ሰው ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ሁሉም
  rationale: በአውዱ ውስጥ ትንቢት የሚናገሩትን የተሰበሰቡ ሰዎች በአጠቃላይ የሚያመለክተውን ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: προφητεύωσιν
  choice: ትንቢት ቢናገሩ
  rationale: በምዕራፉ ሁሉ ያለውን የጳውሎስን የትንቢት ምድብ ሳያጠብ ወይም እንደ ተራ መንፈሳዊ ንግግር ሳይተረጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄπιστος
  choice: የማያምን
  rationale: በዚህ የጳውሎስ አውድ ቃሉ የማያምንን ሰው ያመለክታል፤ ታማኝ ያልሆነ ማለት አይደለም።
- source_word: ἰδιώτης
  choice: ያልተማረ ሰው
  rationale: ከጉባኤው ንግግርና ልምምድ ጋር በቂ ዕውቀት ወይም ተሳትፎ የሌለውን ሰው ያመለክታል። ቃሉ አጠቃላይ የትምህርት እጦትን እንደማያስገድድና “ከማኅበሩ ውጭ የሆነ ሰው” የሚለውም አማራጭ እንደሆነ በግርጌ ማስታወሻ ተገልጧል።
- source_word: ἐλέγχεται
  choice: ይወቀሳል
  rationale: የሰውየው ሁኔታና ስህተት በሰማው ነገር እንዲጋለጥና ሕሊናው እንዲወቀስ የሚያመለክተውን ሥነ ምግባራዊ ኃይል ይይዛል።
- source_word: ἀνακρίνεται
  choice: ይመረመራል
  rationale: ቃሉ መመርመርንና በጥልቀት መገምገምን ያመለክታል፤ የመጨረሻ ፍርድን ከሚያመለክተው “ይፈረድበታል” ይልቅ የግሪክኛውን ስፋት ይጠብቃል።
- source_word: ὑπὸ πάντων
  choice: በሁሉም
  rationale: በግሪክኛው ሁለት ጊዜ የተደገመውን ሐረግ በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: δέ ... δέ
  choice: ነገር ግን ... -ና
  rationale: የመጀመሪያው δέ ከቀደመው ሁኔታ ጋር ያለውን ንጽጽር በ“ነገር ግን” ያሳያል፤ ሁለተኛው ደግሞ በአማርኛ የዓረፍተ ነገሩን ፍሰት ለማስተካከል በአያያዥ “-ና” ተወክሏል።
- source_word: τις
  choice: ሰው
  rationale: የግሪክኛውን ያልተወሰነ አመልካች በ“የማያምን ወይም ያልተማረ ሰው” በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ውስጥ ያስቀምጣል።
theological_decisions:
- issue: በጉባኤው አውድ የἰδιώτης ትርጉም
  choice: “ያልተማረ ሰው” ተብሎ ተተርጉሟል።
  alternative: “ከማኅበሩ ውጭ የሆነ ሰው” ወይም “ጉዳዩን የማያውቅ ሰው”
  rationale: ቅርብ አውዱ ንግግሩ ስለመገባቱና በቂ ግንዛቤ በሌላቸው ሰዎች ላይ ስለሚያሳድረው ተጽእኖ ይናገራል። ዋናው ትርጉም ይህን የዕውቀት እጥረት ያቆያል፤ ሰውየው ፈጽሞ ከክርስቲያን ማኅበር ውጭ መሆኑን ግን አይወስንም። ሌላው አሳማኝ ንባብ በግርጌ ማስታወሻ ተጠብቋል።
- issue: የἐλέγχεται የሥነ ምግባርና የማሳመን ኃይል
  choice: “ይወቀሳል” ተብሎ ተተርጉሟል።
  alternative: “ጥፋቱ ይገለጣል” ወይም “ይረታል”
  rationale: ግሱ መገለጥን፣ መወቀስንና በሕሊና መረታትን ሊያካትት ይችላል። “ይወቀሳል” ይህን ውጥረት ይጠብቃል፤ ሂደቱን እንደ መጨረሻ የፍርድ ውሳኔ አያቀርበውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪክኛው ተደጋጋሚ “በሁሉም” ለአጽንዖት እንዳለ ተጠብቋል፤ የἰδιώτης ሙሉ የትርጉም ስፋትም በግርጌ ማስታወሻ ቀርቧል።
