  choice: ተርጓሚ በሌለበት ጊዜ ትእዛዙ በተሰበሰበው ማኅበር ፊት የሚደረገውን ንግግር ይገድባል፤ ለራስና ለእግዚአብሔር መናገርን ፈጽሞ አይከለክልም።
  alternative: ተናጋሪው ማንኛውንም ንግግር ፈጽሞ ማቆም አለበት፤ ወይም ንግግሩን ለማኅበሩ በሚሰማ መልኩ መቀጠል ይችላል።
