base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: am
  text: ስለዚህ፣ የድምፁን ትርጉም[a] ባላውቅ፣ ለሚናገረው እንግዳ[b] እሆናለሁ፤ የሚናገረውም ለእኔ እንግዳ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የድምፁን ኃይል”፤ ማለትም ድምፁ የሚያስተላልፈውን ፍቺ ወይም ሐሳብ።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ባርባሮስ” ይላል፤ እዚህ በንግግሩ የማይግባባ ወይም በቋንቋ የተለየ ሰው ማለት ነው እንጂ የግድ ሥልጣኔ የሌለው ሰው ማለት አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν μὴ εἰδῶ
  choice: ስለዚህ፣ … ባላውቅ
  rationale: የοὖνን መደምደሚያዊ አገናኝነትና የἐὰνን ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ εἰδῶም ‘ማወቅ’ ተብሎ ተጠብቋል።
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: የድምፁን ትርጉም
  rationale: δύναμις በቀጥታ ‘ኃይል’ ሊሆን ቢችልም፣ ከφωνή ጋር በዚህ ዐውድ ድምፁ የሚያስተላልፈውን ፍቺ ወይም ትርጉም ያመለክታል። ‘ድምፅ’ የφωνήን ሆን ተብሎ ያልተወሰነ ስፋት ይጠብቃል።
- source_word: τῷ λαλοῦντι
  choice: ለሚናገረው
  rationale: የአሁን ጊዜ አሳታፊውን በቅርብና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βάρβαρος
  choice: እንግዳ
  rationale: በዐውዱ ቃሉ በንግግር የማይግባባ ወይም በቋንቋ የተለየ ሰውን እንጂ ‘ሥልጣኔ የሌለውን’ ሰው አያመለክትም። የተናጋሪዎቹን የእርስ በርስ ርቀትም ይገልጣል።
- source_word: ἐν ἐμοὶ
  choice: ለእኔ
  rationale: በዚህ ተመላላሽ አገባብ የግንኙነትን አንጻር የሚገልጥ ተፈጥሯዊ የአማርኛ አቻ ነው።
