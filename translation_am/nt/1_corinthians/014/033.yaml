    text: ወይም፣ “እግዚአብሔር የግራ መጋባት አምላክ ሳይሆን የሰላም አምላክ ነውና።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእግዚአብሔር ቅዱሳን ጉባኤዎች ሁሉ እንደሚታየው።” አንዳንዶች ይህን ሐረግ ከዚህ ቁጥር ይልቅ ከሚቀጥለው ቁጥር ጋር ያያይዙታል።
    reason: alternative_reading
