theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων የሚለው ሐረግ ከየትኛው ክፍል ጋር እንደሚያያዝ
  choice: ከቁጥር 33 ጋር ተያይዞ በቅዱሳን ጉባኤዎች ሁሉ ያለውን ልማድ እንደሚያነጻጽር ተተርጉሟል።
