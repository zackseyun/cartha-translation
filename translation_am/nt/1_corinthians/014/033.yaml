- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የግልና የተወሰነውን አምላክ በተፈጥሯዊ ሁኔታ ይጠቁማል።
- source_word: ὡς
  choice: እንደሚሆነው
