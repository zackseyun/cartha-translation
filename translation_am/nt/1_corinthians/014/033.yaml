  text: እግዚአብሔር የሁከት አምላክ ሳይሆን የሰላም አምላክ ነውና፤[a] በቅዱሳን ጉባኤዎች ሁሉ እንደሚታየው።[b]
  philosophy: optimal-equivalence
  footnotes:
