  rationale: ጥያቄው የቀደመውን ክርክር ተግባራዊ መደምደሚያ ይጠይቃል። ይህ አተረጓጎም ቃል በቃል ‘እንግዲህ ምንድን ነው?’ ከማለት ይልቅ በዘመናዊ አማርኛ የንግግሩን ተግባራዊ ኃይል በግልጽ ያሳያል።
