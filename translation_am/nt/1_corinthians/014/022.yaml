  choice: በልሳኖች መናገር
  alternative: በቋንቋዎች መናገር፤ ልዩ መንፈሳዊ ንግግር
  rationale: የግሪኩ ቃልና የምዕራፉ አውድ ትክክለኛውን የንግግሩን ባሕርይ ለትርጓሜ ውይይት ክፍት ያደርጋሉ፤ ይህ ምርጫ የአንድን ወገን አስተምህሮ አያስገባም።
- issue: σημεῖον ለማያምኑ ያለው ትርጉም
  choice: ምልክት
  alternative: የማረጋገጫ ምልክት፤ የፍርድ ምልክት
  rationale: የኢሳይያስ 28፥11–12 ጥቅስ የፍርድ ገጽታን ሊያመለክት ቢችልም፣ የግሪኩ ጽሑፍ ‘ምልክት’ ብቻ ይላል። ዋናው ጽሑፍ ይህን ክርክር አይወስንም።
