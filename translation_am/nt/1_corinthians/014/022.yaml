  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: am
  text: ስለዚህ፣ በልሳኖች መናገር[a] ለሚያምኑ ሳይሆን ለማያምኑ ምልክት[b] ነው፤ ትንቢት ግን ለማያምኑ ሳይሆን ለሚያምኑ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቋንቋዎች መናገር።” የግሪኩ ቃል ቋንቋዎችን ሊያመለክት ይችላል፤ ነገር ግን በ1 ቆሮንቶስ 12–14 “ልሳኖች” የጳውሎስን የተለመደ አጠቃቀም ይጠብቃል፤ አከራካሪውንም ትርጓሜ አስቀድሞ አይወስንም።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ ተርጓሚዎች፣ ከዚህ በፊት የተጠቀሰውን ኢሳይያስ 28፥11–12 ከግምት በማስገባት፣ “ምልክት” የፍርድ ምልክት ነው ብለው ይረዱታል።
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: γλῶσσαι
  choice: በልሳኖች መናገር
  rationale: በ1 ቆሮንቶስ 12–14 ያለውን የጳውሎስን ቃላዊ አጠቃቀም ይጠብቃል፤ የታወቁ የሰው ቋንቋዎች ወይም ሌላ ዓይነት ንግግር መሆኑን በትርጉሙ አስቀድሞ አይወስንም። በአማርኛ የንግግር ተግባሩን በግልጽ ለማሳየት ሐረጋዊ አተረጓጎም ተመርጧል።
- source_word: εἰς σημεῖόν
  choice: ምልክት
  rationale: የግሪኩን አጭርና ገለልተኛ አገላለጽ ይጠብቃል፤ ምልክቱ የማረጋገጫ ወይም የፍርድ መሆኑን አይወስንም።
- source_word: τοῖς πιστεύουσιν
  choice: ለሚያምኑ
  rationale: ስማዊ ሆኖ የሚሠራውን የግሪክ አሳታፊ ግስ ‘የሚያምኑት’ በሚለው ግሳዊ ኃይሉ ያቀርባል።
- source_word: τοῖς ἀπίστοις
  choice: ለማያምኑ
  rationale: ከ‘ለሚያምኑ’ ጋር ያለውን ቀጥተኛ ተቃርኖ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: προφητεία
  choice: ትንቢት
  rationale: በምዕራፉ ውስጥ ያለውን የትንቢት ስጦታና ተግባር በቀጥታ የሚያመለክት የተለመደ አማርኛ ቃል ነው።
- source_word: δὲ
  choice: ግን
  rationale: በልሳኖች መናገርና ትንቢት መካከል ያለውን ንጽጽራዊ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
