  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: am
  text: ነገር ግን አንድ ነገር መማር ቢፈልጉ፣ በቤት የራሳቸውን ባሎች ይጠይቁ፤ ለሴት[a] በጉባኤ[b] መናገር ነውር ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ለሚስት።” የግሪኩ ቃል እንደ አውዱ “ሴት” ወይም “ሚስት” ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “በቤተ ክርስቲያን” ወይም “በማኅበረ ምእመናን።” የግሪኩ ቃል ተሰብስቦ ያለውን ጉባኤ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
