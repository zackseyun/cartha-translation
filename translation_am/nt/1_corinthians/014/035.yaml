- source_word: τοὺς ἰδίους ἄνδρας
  choice: የራሳቸውን ባሎች
  rationale: ἄνδρας ‘ወንዶች’ ወይም ‘ባሎች’ ሊሆን ቢችልም፣ ‘የራሳቸውን’ የሚለው ገላጭና የቤት አውዱ የጋብቻ ትርጉሙን ይደግፋሉ።
