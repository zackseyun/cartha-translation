  rationale: የግሪኩ አንቀጽ የንግግሩን ዓይነት አይገልጽም፤ ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱን ጠብቆ የትርጓሜ ውሳኔን በጽሑፉ ውስጥ አያስገባም።
- issue: γυνή/ἀνήρን ‘ሴት/ወንድ’ ወይም ‘ሚስት/ባል’ ብሎ መተርጎም
