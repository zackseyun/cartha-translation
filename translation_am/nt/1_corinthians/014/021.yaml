  rationale: ጥቅሱ በኢሳይያስ ውስጥ የእስራኤልን አምላክ ንግግር ያስተጋባል፤ ሆኖም የግሪኩ ጽሑፍ κύριος ስለሚል «ጌታ» በዋናው ጽሑፍ ተመርጧል። የዕብራይስጡን መለኮታዊ ስም ዳራ የሚያንጸባርቀው «እግዚአብሔር» በማስታወሻ ተጠቅሷል።
