- issue: የወንድ ነጠላ ቅርጾች ተወካይ አጠቃቀም
  choice: ‘የሚናገር ራሱን’ በሚል የወንድ ነጠላ ቅርጽ መተርጎም
  alternative: ጾታን ያልገለጸ ብዙ ቁጥር መጠቀም
