- source_word: ὁ δὲ προφητεύων
  choice: ትንቢት የሚናገር ግን
  rationale: አንቀጸ ግሱን በተፈጥሯዊ አማርኛ ሲገልጥ፣ δέ በ‘ግን’ ተተርጉሞ በግለሰብና በማኅበሩ ጥቅም መካከል ያለውን ለስላሳ ንጽጽር ያሳያል።
