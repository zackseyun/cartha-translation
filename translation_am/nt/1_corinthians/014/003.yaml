  rationale: በግሪክኛው በስም ፈንታ የቆመውን የአሁን ጊዜ አሳታፊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ ደግሞ ከቀደመው ቁጥር ጋር ያለውን መጠነኛ ንጽጽር ያሳያል።
- source_word: ἀνθρώποις
