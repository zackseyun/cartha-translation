  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: am
  text: ፍቅርን ተከተሉ፤ መንፈሳዊ ነገሮችንም[a] አጥብቃችሁ ፈልጉ፤ ይበልጥ ግን[b] ትንቢት እንድትናገሩ ፈልጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመንፈስ ስጦታዎችን» ወይም «መንፈሳዊ ጉዳዮችን»። የግሪኩ አገላለጽ «ስጦታዎች» ከሚለው የሰፋ ቢሆንም፣ እዚህ ያለው ዐውድ በጉባኤ ውስጥ በሚታዩ የመንፈስ መገለጫዎች ላይ ያተኩራል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በተለይም ትንቢት እንድትናገሩ»።
    reason: alternative_rendering
lexical_decisions:
- source_word: Διώκετε
  choice: ተከታተሉ
  rationale: ቃሉ በትጋትና ያለማቋረጥ መከተልን ያመለክታል፤ «ተከታተሉ» ይህን ንቁ ኃይል ይጠብቃል።
- source_word: τὴν ἀγάπην
  choice: ፍቅርን
  rationale: የተለመደውንና ከምዕራፍ 13 ጋር ያለውን የቃል ትስስር የሚጠብቅ ግልጽ አተረጓጎም ነው።
- source_word: ζηλοῦτε
  choice: አጥብቃችሁ ፈልጉ
  rationale: የቃሉን ቅንዓት፣ ጽኑ ፍላጎትና ከፍተኛ ጉጉት በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ πνευματικά
  choice: መንፈሳዊ ነገሮችን
  rationale: የግሪኩን ሰፊ አገላለጽ ይጠብቃል፤ በዐውዱ የመንፈስ ስጦታዎችንና መገለጫዎችን ቢያካትትም «ስጦታዎች» የሚለውን ቃል በዋናው ጽሑፍ ላይ አይጨምርም።
- source_word: μᾶλλον δὲ
  choice: ይበልጥ ግን
  rationale: የንጽጽርና የቅድሚያ ኃይሉን ከδὲ የሽግግር ትርጉም ጋር ይጠብቃል።
- source_word: ἵνα προφητεύητε
  choice: ትንቢት እንድትናገሩ
  rationale: የἵνα ንዑስ ሐረግን ቅርጽ ይጠብቃል፤ προφητεύωንም በተለመደው መጽሐፍ ቅዱሳዊ አገላለጽ ይተረጉማል።
theological_decisions:
- issue: የτὰ πνευματικά ወሰን
  choice: መንፈሳዊ ነገሮችን
  alternative: የመንፈስ ስጦታዎችን
  rationale: ዐውዱ በጉባኤ ውስጥ ስለሚታዩ የመንፈስ ስጦታዎችና መገለጫዎች ቢናገርም፣ የግሪኩ ገለልተኛ ብዙ ቁጥር ቅጽ «ስጦታዎች» ከሚለው የሰፋ ነው። ዋናው ጽሑፍ ይህን ስፋት ጠብቆ የዐውዱን ትርጉም በማስታወሻ ያብራራል።
- issue: ለትንቢት የተሰጠው ቅድሚያ
  choice: ይበልጥ ግን
  alternative: በተለይም
  rationale: ትንቢት ከሌሎቹ መንፈሳዊ መገለጫዎች እንደሚቀድም ያሳያል፤ ሌሎቹን ፈጽሞ የሚያስወግድ ትርጉም ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሴሚኮሎኖቹ ሦስቱን ተያያዥ የማሳሰቢያ ክፍሎች ይለያሉ፤ በመጨረሻው ክፍል «ፈልጉ» በተፈጥሯዊ አማርኛ ለግልጽነት ተደግሟል።
