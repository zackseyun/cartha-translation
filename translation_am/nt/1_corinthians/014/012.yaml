base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: am
  text: እንዲሁ እናንተም፣ ለመንፈሳዊ ስጦታዎች[a] የምትጓጉ ስለሆናችሁ፣ ለቤተ ክርስቲያን መታነጽ እንድትበዙ ፈልጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ በቀጥታ “መንፈሳዊ ነገሮች” ወይም “መናፍስት” ሊተረጎም ይችላል፤ ዐውዱ ግን መንፈሳዊ ስጦታዎችን ወይም የመንፈስ መገለጫዎችን እንደሚያመለክት ያሳያል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንዲሁም እናንተ
  rationale: ከቀደመው ንጽጽር ጋር ያለውን ትስስርና የማጠቃለያ ኃይል በተፈጥሯዊ አማርኛ ያስቀጥላል።
- source_word: ἐπεὶ ζηλωταί ἐστε
  choice: ለማግኘት የምትጓጉ ከሆናችሁ
  rationale: ἐπεὶ ያለውን የምክንያት ንዑስ ሐረግ ይጠብቃል፤ ζηλωταί ደግሞ ብርቱ ፍላጎት ያላቸውን ሰዎች በዘመናዊ ንግግር ይገልጣል።
- source_word: πνευμάτων
  choice: መንፈሳዊ ስጦታዎችን
  rationale: ቃሉ በቀጥታ ‘መናፍስት’ ወይም ‘መንፈሳዊ ነገሮች’ ሊል ቢችልም፣ የ1 ቆሮንቶስ 12–14 ዐውድ የመንፈስን ስጦታዎችና መገለጫዎች ያመለክታል፤ የግሪኩ ጥቅጥቅ ያለ አገላለጽ በማስታወሻ ተጠብቋል።
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: ቤተ ክርስቲያንን ለማነጽ በሚጠቅሙት ነገሮች
  rationale: οἰκοδομή ያለውን የግንባታ ምሳሌ ‘ማነጽ’ በሚለው ይጠብቃል፤ πρὸς ደግሞ የዓላማ አቅጣጫውን ያሳያል።
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: ለመትረፍ ፈልጉ
  rationale: ζητεῖτε ያለውን ቀጥተኛ ትእዛዝ እና περισσεύητε ያለውን የመብዛት፣ የመትረፍ ሐሳብ ይጠብቃል፤ በምን እንደሚተርፉ ከቤተ ክርስቲያን መታነጽ ዓላማ ጋር በተፈጥሯዊ አማርኛ ተያይዟል።
theological_decisions:
- issue: የπνευμάτων ትርጉም
  choice: በዋናው ጽሑፍ ‘መንፈሳዊ ስጦታዎች’ ተብሏል።
  alternative: ‘መንፈሳዊ ነገሮች’ ወይም ‘መናፍስት’
  rationale: የምዕራፉ ዐውድ ለማኅበሩ መታነጽ የሚያገለግሉ የመንፈስ መገለጫዎችን ያወያያል። ሆኖም ግሪኩ ከዚህ የበለጠ አሻሚ ስለሆነ አማራጮቹ በማስታወሻ ተጠብቀዋል።
- issue: የἵνα περισσεύητε የተዘወተረ ነገር
  choice: መትረፉ ቤተ ክርስቲያንን ከሚያንጹ ነገሮች ጋር ተያይዟል።
  alternative: ‘በስጦታዎቹ ለመትረፍ’ ብሎ በግልጽ መጨመር
  rationale: ግሪኩ ‘በእነርሱ’ የሚል ግልጽ ተሳቢ አልያዘም። ትርጉሙ እንዳይታወክ የቤተ ክርስቲያንን መታነጽ የሚጠቅሙ ነገሮች ተጠቅሰዋል፣ ነገር ግን መትረፉን በስጦታዎቹ ብቻ ላይ በግልጽ አልገደበም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ አማርኛን ይጠቀማል። ‘ማነጽ’ የጳውሎስን የግንባታ ምሳሌ ይጠብቃል፤ ‘መትረፍ’ ደግሞ περισσεύω ያለውን የብዛት ኃይል ያስተላልፋል።
