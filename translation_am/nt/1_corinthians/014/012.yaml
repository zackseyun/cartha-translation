review_pass:
  verdict: revise
  source_fidelity: The draft correctly carries forward the comparison, the causal clause, and the church-edification goal. However, «ለማግኘት» adds an unexpressed purpose to ζηλωταί, and «በሚጠቅሙት ነገሮች» adds an object/category not stated in the Greek. The revised wording retains the open-ended force of ζητεῖτε ἵνα περισσεύητε while expressing its stated purpose.
  naturalness: The revision uses clear, modern standard Amharic. «ለ… መታነጽ እንድትበዙ ፈልጉ» is a natural exhortational construction and avoids the potentially misleading sense of «መትረፍ» as something being left over.
  terminology: «መንፈሳዊ ስጦታዎች» is contextually appropriate for πνευμάτων, provided that the more compressed Greek alternatives remain footnoted. «ቤተ ክርስቲያን» and «መታነጽ» appropriately preserve ἐκκλησία and Paul’s οἰκοδομή imagery.
  issues:
  - severity: medium
    issue: «ለማግኘት» is added to the description of their zeal.
    rationale: ζηλωταί ἐστε πνευμάτων says that they are zealous/eager for πνευμάτων; it does not explicitly say they are eager ‘to obtain’ them.
  - severity: medium
    issue: «በሚጠቅሙት ነገሮች» adds material not present in the source.
    rationale: The Greek directly states that they should seek to abound for the church’s building up. It does not identify an added class of ‘things that are beneficial.’
  - severity: low
    issue: «ለመትረፍ» can suggest surplus or remainder in modern Amharic.
    rationale: For περισσεύητε in this exhortation, «እንድትበዙ» more naturally conveys abounding/excelling without introducing a specific implied object.
  revised_text: እንዲሁ እናንተም፣ ለመንፈሳዊ ስጦታዎች[a] የምትጓጉ ስለሆናችሁ፣ ለቤተ ክርስቲያን መታነጽ እንድትበዙ ፈልጉ።
