  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: am
  text: ነገር ግን፣ ሌላ ተቀምጦ ላለ ሰው አንድ ነገር ቢገለጥለት፣[a] የመጀመሪያው ዝም ይበል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሌላ ተቀምጦ ላለ ሰው መገለጥ ቢሰጠው።»
    reason: lexical_alternative
  - marker: b
    text: ይኸውም፣ ሌላው እንዲናገር የመጀመሪያው ተናጋሪ መናገሩን ያቁም።
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ነገር ግን፣ … ቢ-
  rationale: δὲ በአውዱ ያለውን ቀላል ንፅፅር በ«ነገር ግን» ያሳያል፤ ἐὰν ደግሞ በአማርኛው የ«ቢ-» ሁኔታዊ አወቃቀር ተገልጧል።
- source_word: ἄλλῳ
  choice: ለሌላ ሰው
  rationale: ከሚናገረው ሰው የተለየ ሌላ ተሳታፊን በግልጽና ተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἀποκαλυφθῇ
  choice: አንድ ነገር ቢገለጥለት
  rationale: የግሱን ተገብሮ ቅርጽና የመገለጥን ሐሳብ ይጠብቃል፤ በግሪክ ጽሑፉ ያልተጠቀሰውን «መገለጥ» እንደ ስም በዋናው ጽሑፍ አይጨምርም።
- source_word: καθημένῳ
  choice: ተቀምጦ ላለው
  rationale: ἄλλῳን የሚገልጸውን የአሁን ጊዜ አጋኝ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ πρῶτος
  choice: የመጀመሪያው
  rationale: ግሪኩን አጭርና ቀጥተኛ አገላለጽ ይጠብቃል፤ ከአውዱ የመጀመሪያው ተናጋሪ መሆኑ ይታወቃል።
- source_word: σιγάτω
  choice: ዝም ይበል
  rationale: የሦስተኛ መደብ ትእዛዛዊ ኃይሉን በተለመደና ክብር ባለው የአማርኛ አገላለጽ ያስተላልፋል፤ በአውዱ ንግግሩን ማቆምን ያመለክታል።
theological_decisions:
- issue: በጉባኤያዊ ትንቢት ውስጥ የመገለጡ ባሕርይና ምንጭ
  choice: «አንድ ነገር ቢገለጥለት» ተብሎ ተገብሮው ተጠብቆ፣ የገለጠው አካል በግልጽ አልተጠቀሰም።
  alternative: «ከእግዚአብሔር መገለጥ ቢቀበል» ወይም «መገለጥ ቢሰጠው»
  rationale: በአውዱ የመገለጡ ምንጭ እግዚአብሔር መሆኑ ቢታሰብም፣ ይህ ቁጥር አድራጊውን አይጠቅስም። ትርጉሙ ይህን የጽሑፉን ገደብና አሻሚነት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። «የመጀመሪያው» የሚለው ቀጥተኛ አገላለጽ ተጠብቆ፣ በማስታወሻው የመጀመሪያው ተናጋሪ ማለት መሆኑ ተብራርቷል።
