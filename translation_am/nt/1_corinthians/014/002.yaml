  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: am
  text: ምክንያቱም በልሳን የሚናገር ሰው ለሰዎች ሳይሆን ለእግዚአብሔር ይናገራል፤ ማንም አይረዳውምና።[a] ይልቁንም በመንፈስ[b] ምሥጢራትን ይናገራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ማንም አይሰማውምና።’ የግሪኩ ግስ ‘መስማት’ ወይም በዚህ አውድ ‘መረዳት’ ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘በራሱ መንፈስ።’ የግሪኩ ሐረግ መንፈስ ቅዱስን ወይም የተናጋሪውን መንፈስ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: የሚናገር ሰው
  rationale: መስተዋድዱ ከአሁናዊ ቦዝ አንቀጽ ጋር ሆኖ ሰውን በአጠቃላይ ያመለክታል፤ ይህ አተረጓጎም ጾታን ሳይወስን በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: γλώσσῃ
  choice: በልሳን
  rationale: ነጠላውን የግሪክ ቃል ይጠብቃል፤ ከቃሉ በላይ ትርጓሜ የሚጨምረውን ‘በሌላ ቋንቋ’ የሚል አገላለጽ ያስወግዳል።
- source_word: ἀνθρώποις
  choice: ለሰዎች
  rationale: ቃሉ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: θεῷ
  choice: ለእግዚአብሔር
  rationale: ከλαλεῖ ጋር ያለውን ቀጥተኛ የተቀባይ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀκούει
  choice: አይረዳውም
  rationale: ግሱ በቀጥታ ‘ይሰማል’ ሊሆን ቢችልም፣ የምዕራፉ አውድ ሊገባ የማይችል ንግግርን ከሚገባ ንግግር ጋር ያነጻጽራል። ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የግሪኩ የተሳቢ ቅርጽ የአሠራርና የማጣቀሻ አሻሚነት አለው። ‘በመንፈስ’ የሚለው የአማርኛ አገላለጽ መንፈስ ቅዱስን ወይም የተናጋሪውን መንፈስ በቀጥታ ሳይወስን ሁለቱንም ዕድሎች ይጠብቃል።
- source_word: μυστήρια
  choice: ምሥጢራትን
  rationale: የጳውሎስን የቃሉን ክብደትና አሻሚነት ከሚያብራሩ ትርጓሜዎች ይልቅ በቀጥታ ይጠብቃል።
- source_word: δὲ
  choice: ይልቁንም
  rationale: ከቀደመው አሉታዊ ንግግር ጋር ያለውን ንጽጽር በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የπνεύματι ማጣቀሻ
  choice: በዋናው ጽሑፍ ‘በመንፈስ’ ተብሎ አሻሚነቱ እንዲቆይ ተደርጓል።
  alternative: ‘በመንፈስ ቅዱስ’ ወይም ‘በራሱ መንፈስ’
  rationale: የግሪኩ ሐረግ መንፈስ ቅዱስንም ሆነ የተናጋሪውን መንፈስ ሊያመለክት ይችላል፤ ትርጉሙ አንዱን የእምነት አቋም ብቻ እንዳይጭን አሻሚነቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ልሳን’ በዚህ አውድ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ስለሆነና γλῶσσαን ከመጠን በላይ ሳይተረጉም ስለሚያቀርብ ተመርጧል።
