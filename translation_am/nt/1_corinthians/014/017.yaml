- source_word: καλῶς
  choice: በሚገባ
  rationale: ድርጊቱ ጥሩ ወይም ተገቢ መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: εὐχαριστεῖς
  choice: ታመሰግናለህ
  rationale: በአውዱ ውስጥ ለእግዚአብሔር ምስጋና ማቅረብን ያመለክታል፤ የግሪኩን አመልካች አኳኋንና የአሁን ጊዜ ስሜት ይጠብቃል።
- source_word: ἀλλ’
  choice: ግን
  rationale: ዋናውን ተቃርኖ በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: ὁ ἕτερος
  choice: ሌላው
  rationale: በጉባኤው ውስጥ ያለውን ሌላ ሰው ሳያብራራ የግሪኩን አጭርና አሻሚ አገላለጽ ይጠብቃል።
- source_word: οὐκ οἰκοδομεῖται
  choice: አይታነጽም
  rationale: የοἰκοδομέωን የመገንባት ምስል በአማርኛ የተለመደውን የታነጸ አገላለጽ በመጠቀም ይጠብቃል።
theological_decisions:
- issue: በጉባኤ አውድ ውስጥ የοἰκοδομέω ጳውሎሳዊ ዘይቤ
  choice: አይታነጽም
  alternative: አይጠናከርም
  rationale: ዋናው ትርጉም የመገንባትን ዘይቤ ይጠብቃል፤ ይህም የሌላውን ሰው መጠቀምና መጠናከር ያመለክታል እንጂ ጠባብ የእምነት አቋም አያስገባም።
translation_notes:
