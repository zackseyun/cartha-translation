  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: am
  text: እንግዲህ ምን ይሆናል፣ ወንድሞች[a]? ስትሰበሰቡ፣ እያንዳንዳችሁ መዝሙር አላችሁ፣ ትምህርት አላችሁ፣ መገለጥ አላችሁ፣ ልሳን[b] አላችሁ፣ ትርጓሜም አላችሁ። ሁሉም ነገር ለማነጽ ይደረግ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” የሚለው ቃል እዚህ ወንዶችንና ሴቶችን ጨምሮ መላውን ጉባኤ ይጠራል።
    reason: lexical_alternative
  - marker: b
    text: “ቋንቋ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ልሳንን ወይም ቋንቋን ሊያመለክት ይችላል፤ እዚህ “ልሳን” የሚለው ትርጉም ጳውሎስ በዚህ ውይይት የተጠቀመበትን አነጋገር ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: እንግዲህ ምን ይሁን
  rationale: የግሪኩን የንግግር ጥያቄና ከቀደመው ሐሳብ ወደ ተግባራዊ ድምዳሜ የሚያሸጋግረውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የቃሉን ወንዳዊ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ በዐውዱ ውስጥ ሴቶችንም ጨምሮ ጉባኤውን እንደሚወክል በማስታወሻ ተገልጧል።
- source_word: ὅταν συνέρχησθε
  choice: በአንድነት በምትሰበሰቡበት ጊዜ
  rationale: የጉባኤውን ተደጋጋሚ መሰብሰብና የጊዜውን ግንኙነት ግልጽ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἕκαστος
  choice: እያንዳንዳችሁ
  rationale: በእያንዳንዱ የጉባኤ አባል ላይ ያለውን አከፋፋይ አጽንዖት በቀጥታ ያሳያል።
- source_word: ψαλμὸν
  choice: መዝሙር
  rationale: ከአጠቃላይ ‘ዘፈን’ ይልቅ የግሪኩን የውዳሴ መዝሙር ትርጉም ይጠብቃል።
- source_word: διδαχὴν
  choice: ትምህርት
  rationale: በጉባኤ የሚቀርብን ማስተማር በተለመደና ግልጽ ቃል ያስተላልፋል።
- source_word: ἀποκάλυψιν
  choice: መገለጥ
  rationale: በጉባኤው የሚሰጥን መገለጫ በመደበኛው መጽሐፍ ቅዱሳዊ ቃል ይወክላል።
- source_word: γλῶσσαν
  choice: ልሳን
  rationale: በ1 ቆሮንቶስ 12–14 ያለውን ልዩ አጠቃቀም ይጠብቃል፤ የታወቀ ሰብአዊ ቋንቋ ወይም ሌላ የንግግር ክስተት መሆኑን ከጽሑፉ በላይ አይወስንም።
- source_word: ἑρμηνείαν
  choice: ትርጓሜ
  rationale: ልሳን ለጉባኤው እንዲገባ የሚያደርገውን የመተርጎም ተግባር ያመለክታል።
- source_word: πρὸς οἰκοδομὴν
  choice: ለማነጽ
  rationale: የሕንጻ ምሳሌያዊ ምስልን ጠብቆ ጉባኤውን ማጠናከር የሚለውን ዓላማ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πάντα … γινέσθω
  choice: ሁሉም ነገር … ይደረግ
  rationale: የጳውሎስን አጠቃላይ መመሪያና ትእዛዛዊ ኃይል ይጠብቃል።
theological_decisions:
- issue: ጉባኤን የሚወክል ወንዳዊ አድራሻ
  choice: በዋናው ጽሑፍ “ወንድሞች” ተጠብቆ፣ ሴቶችንም እንደሚያካትት በማስታወሻ ተብራርቷል።
  alternative: ወንድሞችና እህቶች
  rationale: የግሪኩን ሰዋሰዋዊ ቅርጽ ሳይለውጥ በዐውዱ ያለውን አካታች የውክልና አገልግሎት ግልጽ ያደርጋል።
- issue: በምዕራፉ ውስጥ γλῶσσα የሚለው ቃል ትርጉም
  choice: ልሳን
  alternative: ቋንቋ
  rationale: “ልሳን” የጳውሎስን የውይይቱን ቃላት ይጠብቃል፤ ክስተቱ የታወቀ ቋንቋ ብቻ ወይም ሌላ ዓይነት ንግግር መሆኑን አስቀድሞ አይወስንም።
- issue: የἕκαστος ዝርዝር እንደ አማራጭ ወይም እንደ ሁሉንም የያዘ መግለጫ
  choice: ዝርዝሩን በአማርኛ ተፈጥሯዊ አማራጭ አያያዝ ለማቅረብ “ወይም” ተጠቅሟል።
  alternative: እያንዳንዱ ሁሉንም ነገር ‘አለው’ ብሎ መድገም
  rationale: የግሪኩ ዝርዝር የተለያዩ የጉባኤ አስተዋጽኦዎችን ያሳያል፤ ሁሉም ግለሰብ እያንዳንዱን እንደያዘ ለመግለጽ አይገድድም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ልሳን” እና “ማነጽ” የመጽሐፍ ቅዱስ ዐውድን የሚስማሙ ሲሆኑ ከመጠን በላይ ጥንታዊ አይደሉም።
