  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: am
  text: ምክንያቱም በልሳን[a] ብጸልይ፣ መንፈሴ ይጸልያል፤ አእምሮዬ[b] ግን ፍሬ አያፈራም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአንድ ቋንቋ።» የግሪኩ ቃል የሰውን ቋንቋ ወይም በዚህ ምዕራፍ ሁሉ «ልሳን» ተብሎ የተጠቀሰውን በመንፈስ የሚሰጥ ንግግር ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ማስተዋሌ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ምክንያቱም … ብ—
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት «ምክንያቱም» ያሳያል፤ ἐάν ደግሞ «ብጸልይ» በሚለው ሁኔታዊ አገላለጽ ተጠብቋል።
- source_word: προσεύχωμαι
  choice: ብጸልይ
  rationale: ከἐάν ጋር ያለውን ሁኔታዊ ንዑስ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γλώσσῃ
  choice: በልሳን
  rationale: የግሪኩን ነጠላ ቁጥር ይጠብቃል፤ ቃሉም በሰው ቋንቋና በዚህ ምዕራፍ በተጠቀሰው ልዩ የንግግር ክስተት መካከል ያለውን የትርጉም ስፋት እንዳይዘጋ ያደርጋል።
- source_word: τὸ πνεῦμά μου
  choice: መንፈሴ
  rationale: የባለቤትነት ቅጥያውን በቀጥታ ይጠብቃል፤ ከ«አእምሮዬ» ጋር ያለውን ንጽጽርም ሳያብራራ ያቀርባል።
- source_word: προσεύχεται
  choice: ይጸልያል
  rationale: የአሁን ጊዜውን ድርጊት በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ δὲ νοῦς μου
  choice: አእምሮዬ ግን
  rationale: νοῦςን በሰፊው «አእምሮ» ብሎ በመተርጎም ከ«መንፈሴ» ጋር ያለውን ተቃርኖ ይጠብቃል፤ δέ ደግሞ «ግን» ተብሏል።
- source_word: ἄκαρπός ἐστιν
  choice: ፍሬ አያፈራም
  rationale: የἄκαρποςን የፍሬ ዘይቤ በአማርኛ ተፈጥሯዊ በሆነ የግስ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የ«መንፈሴ» (τὸ πνεῦμά μου) ዋቢ
  choice: የተናጋሪው የራሱ መንፈስ በሚለው ቀጥተኛ አገላለጽ ቀርቧል
  alternative: በተናጋሪው ውስጥ ያለው መንፈስ ቅዱስ
  rationale: «የእኔ» የሚለው ባለቤትነትና ከ«አእምሮዬ» ጋር ያለው ንጽጽር የተናጋሪውን መንፈስ ይጠቁማሉ። ሆኖም ትርጉሙ «መንፈሴ» ብቻ በማለት ጽሑፉ ከሚናገረው በላይ የዶክትሪን ውሳኔ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ልሳን» የምዕራፉን ቁልፍ ቃል ሲጠብቅ፣ የቃሉ ሌላ ትርጉም በማስታወሻ ተገልጿል።
