  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: am
  text: ነገር ግን በቤተ ክርስቲያን ውስጥ፣ ሌሎችንም እንዳስተምር፣ በልሳን[a] አሥር ሺህ ቃላትን ከምናገር ይልቅ በአእምሮዬ አምስት ቃላትን መናገር እመርጣለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቋንቋ።” የግሪኩ ቃል “ምላስ” ወይም “ቋንቋ” ማለት ሊሆን ይችላል፤ እዚህ ግን በ1 ቆሮንቶስ 12–14 ምዕራፎች በሙሉ የተነገረውን የንግግር ዓይነት ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: በቤተ ክርስቲያን ጉባኤ
  rationale: በዚህ አውድ ቃሉ ለአምልኮ የተሰበሰበውን የክርስቲያኖች ማኅበር ያመለክታል፤ “ጉባኤ” የመሰብሰቡን ሁኔታ ግልጽ ያደርጋል።
- source_word: θέλω
  choice: እመርጣለሁ
  rationale: ቃሉ በቀጥታ ፍላጎትን ቢገልጽም፣ ከአሥር ሺህ ቃላት ጋር በተደረገው ንጽጽር ምርጫን ያሳያል።
- source_word: πέντε λόγους
  choice: አምስት ቃላትን
  rationale: የቁጥሩንና የቃላትን ቀጥተኛ ንጽጽር ይጠብቃል።
- source_word: τῷ νοΐ μου
  choice: በአእምሮዬ
  rationale: የአእምሮ ተሳትፎ ያለበትንና ሊገባ የሚችልን ንግግር ያሳያል፣ የምንጩንም ሥነ ሰብአዊ ቃል ይጠብቃል።
- source_word: κατηχήσω
  choice: እንዳስተምር
  rationale: በቃል ማስተማርን የሚያመለክተውን ፍቺ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፣ በኋላ የተፈጠረን ልዩ ሃይማኖታዊ ቴክኒካዊ ትርጉም አያስገባም።
- source_word: μυρίους λόγους
  choice: አሥር ሺህ ቃላትን
  rationale: የቁጥሩን መሠረታዊ ፍቺና ከአምስት ጋር ያለውን ጉልህ ንጽጽር ይጠብቃል።
- source_word: ἐν γλώσσῃ
  choice: በልሳን
  rationale: “ልሳን” የምላስና የቋንቋን ትርጉም የሚያስተጋባ ሲሆን በምዕራፎቹ ውስጥ ያለውን ልዩ የንግግር አጠቃቀም የክስተቱን ባሕርይ በትርጉም ሳይወስን ይጠብቃል።
