  text: ከነቢያትም ሁለት ወይም ሦስት ይናገሩ፤ ሌሎቹም የተነገረውን ይመዝኑ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይፍረዱ»፣ «ይለዩ» ወይም «ይገምግሙ»። የግሪኩ ግስ የትንቢታዊውን ንግግር መመርመርና መገምገምን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: ነቢያት
  rationale: ስሙ ነቢያትን ወይም ትንቢታዊ መልእክት የሚናገሩትን ያመለክታል፤ «ነቢያት» ቀጥተኛና በአማርኛ የተለመደ አቻ ነው።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን ወደ ቀጣዩ መመሪያ የሚያሸጋግር ነው፤ ከቃሉ ጋር የተያያዘው «-ም» ፍሰቱን በተፈጥሮ ያስጠብቃል።
- source_word: δύο ἢ τρεῖς
  choice: ሁለት ወይም ሦስት
  rationale: የቁጥሩን አገላለጽ በቀጥታ ያስተላልፋል።
- source_word: λαλείτωσαν
  choice: ይናገሩ
  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዛዊ ኃይልን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ ἄλλοι
  choice: ሌሎቹ
  rationale: ግሪኩ እነዚህ ሌሎች ማን እንደሆኑ አይወስንም፤ «ሌሎቹ» ይህን ክፍትነት ይጠብቃል።
- source_word: διακρινέτωσαν
  choice: የተነገረውን ይመዝኑ
  rationale: በዚህ አውድ ግሱ የትንቢታዊውን ንግግር በጥንቃቄ መመርመርና መገምገምን ያመለክታል፤ «ይመዝኑ» የፍርድ ውግዘትን ሳያጎላ ይህን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል። «የተነገረውን» የግሱን በአውዱ የተገነዘበ ተሳቢ ግልጽ ያደርጋል።
theological_decisions:
- issue: «ሌሎቹ» የሚለው በጉባኤው ውስጥ ማንን እንደሚያመለክት
  choice: ማንነታቸውን ሳይወስን «ሌሎቹ» ተብሎ ተተርጉሟል።
  alternative: «ሌሎቹ ነቢያት» ወይም «የቀረው ጉባኤ»
  rationale: የግሪኩ ጽሑፍ ከ«ሌሎቹ» በላይ ቡድኑን አይገልጽም፤ ትርጉሙም ጽሑፉ ያልወሰነውን ቤተ ክርስቲያናዊ ጥያቄ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛው «ይመዝኑ» የግምገማን ምሳሌያዊ ሐሳብ በአጭሩ ይገልጣል፤ የግሪኩ ሰፊ የትርጉም ክልል በማስታወሻው ተጠብቋል።
