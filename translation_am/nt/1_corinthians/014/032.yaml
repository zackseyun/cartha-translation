- source_word: προφητῶν
  choice: የነቢያት
  rationale: የባለቤትነት ወይም የግንኙነት አገባቡን በቀጥታ ይገልጣል።
- source_word: προφήταις
  choice: ለነቢያት
  rationale: ከὑποτάσσεται ጋር ያለውን የመገዛት ተቀባይ ያሳያል፤ ነቢያት በትንቢታዊው እንቅስቃሴ ላይ ኃላፊነት እንዳላቸው ያስተላልፋል።
- source_word: ὑποτάσσεται
  choice: ይገዛሉ
  rationale: ገለልተኛ ብዙ ቁጥር ባለቤት ከነጠላ ግስ ጋር የሚስማማበትን የግሪክ አገባብ፣ በአማርኛ ተፈጥሯዊ በሆነ ብዙ ቁጥር ግስ ያቀርባል፤ ትርጉሙም ከቁጥጥር ውጭ አለመሆንን ያመለክታል።
theological_decisions:
- issue: «የነቢያት መናፍስት» ከነቢያት ቁጥጥር ጋር ያለው ግንኙነት
  choice: በዋናው ጽሑፍ «የነቢያት መናፍስት» የሚለውን አሻሚ አገላለጽ ማቆየት፣ ዐውደ ንባቡ ግን ትንቢታዊ መነሳሳት ከነቢያት ኃላፊነትና ራስን ከመግዛት ውጭ እንዳልሆነ እንዲያሳይ ማድረግ
  alternative: የነቢያት ሰብአዊ መናፍስት ለሌሎች ነቢያት ይገዛሉ፤ ወይም ትንቢታዊ መልእክቶች በነቢያት ይመዘናሉ
  rationale: የ1 ቆሮንቶስ 14፥29-33 ዐውደ ንባብ በጉባኤ ውስጥ ሥርዓትንና ራስን መግዛትን ያጎላል። ሆኖም ግሪኩ አገላለጽ እነዚህን አማራጮች በግልጽ ስለማይለይ፣ ዋናው ትርጉም አንዱን ብቻ አይወስንም።
