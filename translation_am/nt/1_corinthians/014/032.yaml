lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ተጨማሪ የድጋፍ ሐሳብን የሚያያይዝ መስተጻምር ስለሆነ፣ በአማርኛ ተፈጥሯዊ በሆነው «-ም» ተተርጉሟል።
- source_word: πνεύματα
