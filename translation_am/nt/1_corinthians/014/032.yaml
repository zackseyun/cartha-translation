    text: ወይም፣ «የነቢያት የሆኑት መናፍስት ለነቢያት ይገዛሉ»። ይህ አገላለጽ ከነቢያት ጋር የተያያዘውን ትንቢታዊ መነሳሳት ወይም መንፈሳዊ እንቅስቃሴ ሊያመለክት ይችላል፤ በትንቢት ጊዜ ራስን መግዛትን ያጎላል።
