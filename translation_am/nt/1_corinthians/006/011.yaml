  rationale: የአምላካችን መንፈስ የሚለው በጳውሎስ አውድ በተፈጥሮ መንፈስ ቅዱስን ያመለክታል። ሆኖም ‘በ’ የመሣሪያነትንና በመንፈስ ውስጥ የመሆንን ሁለቱንም ገጽታዎች ሳይዘጋ ያቆያል።
- issue: የἐδικαιώθητε ፍቺ
