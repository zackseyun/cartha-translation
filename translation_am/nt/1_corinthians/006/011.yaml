  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: am
  text: ከእናንተም አንዳንዶች እንዲህ ያሉ ሰዎች ነበራችሁ። ነገር ግን ታጥባችኋል[a]፤ ነገር ግን ተቀድሳችኋል፤ ነገር ግን በጌታ ኢየሱስ ስምና በአምላካችን መንፈስ ጸድቃችኋል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ታጥባችኋል” ተብሎ የተተረጎመው የግሪክ ግስ “ራሳችሁን አጥባችኋል” ተብሎም ሊገባ ይችላል። ከሚከተሉት “ተቀድሳችኋል” እና “ጸድቃችኋል” ጋር በመያያዝ ግን ብዙዎች ይህን እግዚአብሔር ካደረገው የማዳን ሥራ አንዱ አድርገው ይረዱታል።
    reason: alternative_reading
  - marker: b
    text: “በጌታ ኢየሱስ ስም” የሚለው በስሙ ሥልጣን ወይም በእርሱ አማካይነት የሚል ፍቺ ሊኖረው ይችላል፤ “በአምላካችን መንፈስ” ደግሞ በመንፈሱ አማካይነት ወይም በመንፈሱ ውስጥ የሚል ፍቺ ሊያመለክት ይችላል።
    reason: lexical_alternative
