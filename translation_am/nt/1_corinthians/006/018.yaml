reference: 1 Corinthians 6:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: am
  text: ከዝሙት ሽሹ። ሰው የሚሠራው ማንኛውም ኃጢአት ከሰውነት ውጭ ነው፤ ዝሙትን የሚፈጽም ግን በራሱ ሰውነት ላይ ኃጢአት ይሠራል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φεύγετε
  choice: ሽሹ
  rationale: የአሁን ጊዜ ትእዛዛዊ ብዙ ቁጥር ሲሆን፣ አስቸኳይና ቀጣይ መራቅን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πορνείαν
  choice: ዝሙት
  rationale: ሕገ ወጥ የወሲብ ተግባርን በስፋት የሚያመለክት የተለመደና ክብር ያለው የአማርኛ ቃል ነው።
- source_word: πᾶν ἁμάρτημα
  choice: ማንኛውም ኃጢአት
  rationale: የግሪኩን አጠቃላይ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: ሰው የሚሠራው
  rationale: ἄνθρωπος እዚህ ወካይና አጠቃላይ ትርጉም ስላለው፣ ‘ሰው’ በዘመናዊ አማርኛ ጾታን ሳይወስን ትርጉሙን በትክክል ያቀርባል።
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: ከሰውነቱ ውጭ ነው
  rationale: የግሪኩን ቀጥተኛ ምሳሌያዊ አገላለጽና ከቀጣዩ ሐረግ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ὁ δὲ πορνεύων
  choice: ዝሙትን የሚፈጽም ግን
  rationale: የአሁን ጊዜውን ተሳቢ ግስ ተግባራዊ ኃይል ይጠብቃል፣ ከመጀመሪያው ‘ዝሙት’ ጋርም ግልጽ ቃላዊ ግንኙነት ይፈጥራል።
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: በራሱ ሰውነት ላይ ኃጢአት ይሠራል
  rationale: εἰς በዚህ አገባብ ኃጢአቱ በራስ ሰውነት ላይ መሆኑን ያሳያል፤ ‘በራሱ’ ደግሞ የἴδιονን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: በአጠቃላይ ንግግር ውስጥ የἄνθρωπος አተረጓጎም
  choice: ሰው
  alternative: ወንድ ሰው
  rationale: ቃሉ ሰውን በአጠቃላይ የሚወክል ነው፤ ‘ሰው’ ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- issue: ‘ማንኛውም ኃጢአት ከሰውነቱ ውጭ ነው’ የሚለው አስቸጋሪ አገላለጽ
  choice: ንግግሩን በቀጥታ ተርጉሞ ያለውን የትርጓሜ ውጥረት መጠበቅ
  alternative: የቆሮንቶስ ሰዎች ጥቅስ እንደሆነ ምልክት ማድረግ ወይም በማብራሪያ ማለዘብ
  rationale: የግሪኩ ጽሑፍ ንግግሩን በቀጥታ ያቀርባል፤ ትርጉሙ ከጽሑፉ በላይ የሆነ ሥነ መለኮታዊ መፍትሔ ማስገባት የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሽሹ’ የትእዛዙን አስቸኳይነት፣ ‘ዝሙት’ ደግሞ የπορνείαን ሰፊ የወሲብ ብልግና ትርጉም በአጭር ያቀርባሉ።
