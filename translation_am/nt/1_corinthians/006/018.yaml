  source_fidelity: The first occurrence of σώμα is definite ('the body') and is not modified by a possessive. The draft's ከሰውነቱ ውጭ ('outside his body') prematurely makes it refer to the person's own body, reducing the deliberate contrast with τὸ ἴδιον σῶμα ('his own body') in the final clause.
  naturalness: The revised wording is natural, concise modern standard Amharic and retains the urgent plural imperative and the verbal sense of the participle.
  terminology: ዝሙት appropriately conveys πορνεία in this register. ኃጢአት and ሰውነት are suitable. The generic ሰው faithfully conveys ἄνθρωπος without introducing a gender-specific meaning.
  issues:
  - severity: medium
    issue: Possessive added to the first occurrence of 'body'
    rationale: ከሰውነቱ ውጭ translates 'outside his body,' whereas the Greek reads ἐκτὸς τοῦ σώματος, 'outside the body.' The possessive is present only in the final clause (ἴδιον).
  - severity: low
    issue: Footnote does not match its anchor or the supplied audit-trail alternative
    rationale: The footnote is anchored after the first body clause but discusses a broad interpretive dispute. It neither supplies a textual alternative at that location nor reflects the audit trail's lexical note concerning ἄνθρωπος. Since the revised Amharic is clear and preserves the ambiguity, no footnote is needed.
