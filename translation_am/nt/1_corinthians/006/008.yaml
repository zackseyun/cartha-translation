  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: am
  text: ነገር ግን እናንተ ራሳችሁ በደል ትፈጽማላችሁ፣ ታሳጣላችሁም፤ ይህንም በወንድሞቻችሁ ላይ ታደርጋላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በወንድሞቻችሁና በእህቶቻችሁ ላይ”፤ የግሪክ ቃሉ “ወንድሞች” ይላል፣ ነገር ግን በአውዱ የእምነት ወገኖችን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑμεῖς
  choice: እናንተ ራሳችሁ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና አጽንዖት የያዘውን ተውላጠ ስም ይጠብቃል።
- source_word: ἀδικεῖτε
  choice: በደል ትፈጽማላችሁ
  rationale: በሌላ ሰው ላይ ኢፍትሐዊ ነገር የማድረግን ሰፊ የሥነ ምግባር ትርጉም ያስተላልፋል።
- source_word: ἀποστερεῖτε
  choice: ትበዘብዛላችሁ
  rationale: ሰውን የሚገባውን በማሳጣት ወይም በማታለል መጠቀምን ያመለክታል፤ ከክርክርና ከንብረት አውድ ጋርም ይስማማል።
- source_word: καὶ τοῦτο
  choice: ይህንም ... ታደርጋላችሁ
  rationale: ድርጊቱ በእምነት ወገኖቻቸው ላይ መፈጸሙን በአጽንዖት የሚገልጸውን የግሪክኛ አነጋገር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀδελφούς
  choice: ወንድሞቻችሁ
  rationale: የግሪክኛውን ተባዕታይ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ በዐውዱ ግን የእምነት ወገኖችን በሰፊው ሊያመለክት እንደሚችል በማስታወሻ ተገልጿል።
theological_decisions:
- issue: በድብልቅ ፆታ ያለውን የእምነት ማኅበረሰብ ἀδελφούς የሚለው ቃል እንዴት እንደሚያመለክት
  choice: ወንድሞቻችሁ
  alternative: ወንድሞቻችሁና እህቶቻችሁ / የእምነት ወገኖቻችሁ
  rationale: ዋናው ጽሑፍ የምንጩን ተባዕታይ ብዙ ቁጥር ቅርጽ ይይዛል፤ ቃሉ በጳውሎስ አጠቃቀም መላውን የእምነት ማኅበረሰብ በሰፊው ሊያካትት የሚችለው ግን በእግር ማስታወሻ ተጠብቋል።
