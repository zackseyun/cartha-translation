review_pass:
  verdict: revise
  source_fidelity: The explicit emphasis in ὑμεῖς is well represented by «እናንተ ራሳችሁ», and the final construction correctly conveys the rhetorical force of καὶ τοῦτο ἀδελφούς. However, «ትበዘብዛላችሁ» commonly suggests plundering or ruthless exploitation and is stronger and less precise than ἀποστερεῖτε, which here means depriving others of what is due to them / defrauding them.
  naturalness: The sentence is generally clear and idiomatic. A period rather than an exclamation mark better reflects the Greek, whose force is rhetorical but not marked as an exclamation. The revised wording retains a natural Amharic cadence.
  terminology: «ወንድሞቻችሁ» appropriately retains the masculine plural form in the main text. The contextual footnote responsibly notes the broader fellow-believer sense without making it the main-text rendering.
  issues:
  - severity: medium
    issue: «ትበዘብዛላችሁ» overstates ἀποστερεῖτε.
    rationale: The Amharic verb normally evokes plundering/exploitation, whereas the Greek denotes depriving or defrauding someone of what is owed, especially fitting the legal-property setting.
  - severity: low
    issue: The final exclamation mark is not warranted by the source punctuation or syntax.
    rationale: The verse is emphatic, but the Greek does not require an exclamatory rendering; a period preserves the rebuke without adding punctuation-based intensity.
