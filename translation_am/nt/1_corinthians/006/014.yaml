id: 1CO.6.14
reference: 1 Corinthians 6:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: am
  text: እግዚአብሔርም ጌታን አስነሣው፤ እኛንም በኃይሉ ያስነሣናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን ክርክሩን የሚቀጥል ለስላሳ አያያዥ ነው፤ ከ«እግዚአብሔር» ጋር የተያያዘው «-ም» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θεὸς
  choice: እግዚአብሔር
  rationale: θεόςን በመደበኛውና በተከበረው የአማርኛ መጠሪያ ይተረጉማል፤ የትንሣኤው ድርጊት ፈጻሚም በግልጽ እርሱ ነው።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: κύριος እዚህ ኢየሱስን የሚያመለክት ክርስቶሳዊ ማዕረግ ነው፤ «ጌታ» ተፈጥሯዊና የተለመደ ትርጉም ነው።
- source_word: ἤγειρεν
  choice: ከሙታን አስነሣው
  rationale: ያለፈ ጊዜው ግስ እግዚአብሔር ኢየሱስን ያስነሣበትን ታሪካዊ ድርጊት ያመለክታል። በአማርኛ «አስነሣው» ብቻውን ከመቀመጫ ማስነሣትንም ሊያመለክት ስለሚችል፣ «ከሙታን» የትንሣኤውን ትርጉም በግልጽ ያቀርባል።
- source_word: ἡμᾶς
  choice: እኛንም
  rationale: የመጀመሪያ ሰው ብዙ ቁጥር ተሳቢን ይጠብቃል፤ የተያያዘው «-ም» ከጌታ ትንሣኤ ጋር ያለውን καί ትይዩነት ያሳያል።
- source_word: ἐξεγερεῖ
  choice: ከሙታን ያስነሣናል
  rationale: የወደፊት ጊዜውንና ከἤγειρεν ጋር ያለውን የትንሣኤ ትይዩነት ያስቀምጣል። የἐξ- ቅድመ ቅጥያውን በአማርኛ በተለየ ቃል ለመወከል የሚያስገድድ ግልጽ የትርጉም ልዩነት የለም።
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: በኃይሉ
  rationale: διά ከጄኒቲቭ ጋር የመፈጸሚያ መንገድን ወይም መሣሪያነትን ያመለክታል፤ «በኃይሉ» የእኛ መነሣት በእግዚአብሔር ኃይል እንደሚፈጸም በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
theological_decisions:
- issue: በወደፊት ጊዜው ሐረግ ውስጥ የተጠቀሰው ትንሣኤ
  choice: የአማኞች የወደፊት ከሙታን መነሣት
  alternative: አጠቃላይ መለኮታዊ ፍትሕ ወይም ምሳሌያዊ መንፈሳዊ መነሣት
  rationale: ቅርብ ዐውዱ ስለ ሰውነት ይናገራል (6፥13-20)፤ «ጌታን አስነሣው» ከሚለው ጋር ያለው ትይዩነትም ምሳሌያዊ ትርጉምን ብቻ ሳይሆን የአማኞችን እውነተኛ የወደፊት ትንሣኤ በጽኑ ይደግፋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ከሙታን» በግሪክ ጽሑፉ በቃል ባይኖርም፣ ἐγείρω/ἐξεγείρω በዚህ ዐውድ ያላቸውን የትንሣኤ ስሜት በተፈጥሯዊ አማርኛ ለማስተላለፍ ተጨምሯል። ምንም የግርጌ ማስታወሻ አላስፈለገም።
