review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys God as the agent, the Lord's past raising, and our future raising by God's power. However, it twice adds «ከሙታን» (“from the dead”), which is not expressed in the Greek text. Resurrection is clearly intended by the context and verbs, but the added phrase is an unnecessary explicit expansion in an optimal-equivalence rendering.
  naturalness: The wording is fluent, clear, and suitably dignified modern standard Amharic. The paired enclitic «-ም» naturally represents the mild connective and the coordinated clauses.
  terminology: «እግዚአብሔር», «ጌታ», «አስነሣ/ያስነሣናል», and «በኃይሉ» are appropriate established terminology. The revised wording retains the resurrection sense without importing words absent from the source.
  issues:
  - severity: low
    issue: «ከሙታን» is supplied in both clauses.
    rationale: Although contextually valid, “from the dead” is not present in ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ. The Amharic verbs adequately convey the intended raising/resurrection in context, so removing the additions better preserves source form and avoids overtranslation.
  revised_text: እግዚአብሔርም ጌታን አስነሣው፤ እኛንም በኃይሉ ያስነሣናል።
  revised_footnotes: []
