  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: am
  text: ነገር ግን ወንድም ከወንድሙ ጋር ይካሰሳል፤ ይህም በማያምኑ ሰዎች ፊት ነውን?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በማያምኑት ፊት።” ሐረጉ ምናልባት ከእምነት ማኅበሩ ውጭ ባሉ ሰዎች የሚመራውን የዓለማዊ ፍርድ ቤት ያመለክታል፤ ግሪኩ ግን በቀጥታ “በማያምኑ ሰዎች ፊት” ይላል።
    reason: lexical_alternative
  - marker: b
    text: “ወንድም” የሚለው ተደጋጋሚ ቃል የክርስቲያን ማኅበሩ አባላት የሆኑ የእምነት ወገኖችን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ጠንካራ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: ወንድም ... ወንድሙ
  rationale: የግሪኩን ተደጋጋሚ ነጠላ ተባዕታይ ቅርጽና ጳውሎስ ለእምነት ማኅበሩ የሚጠቀምበትን የቤተሰብ ቋንቋ ይጠብቃል።
- source_word: μετὰ
  choice: ከ... ጋር
  rationale: በአማርኛ «ይካሰሳል» ከሚለው ጋር ሲጣመር በሁለቱ ወገኖች መካከል ያለውን የሕግ ክርክር በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: κρίνεται
  choice: ይካሰሳል
  rationale: በአውዱ ያለውን የፍርድ ቤት ክርክር ያመለክታል፤ የመካከለኛ/ተደራጊ ቅርጹን ከልክ በላይ ሳይወስን በዘመናዊ አማርኛ ግልጽ ያደርጋል።
- source_word: καὶ τοῦτο
  choice: ይህም
  rationale: የክሱን አሳፋሪ ሁኔታ በማጉላት የጥያቄውን ድንጋጤ ይጠብቃል።
- source_word: ἐπὶ ἀπίστων
  choice: በማያምኑ ሰዎች ፊት
  rationale: የፍርድ ጉዳዩ በእምነት ማኅበሩ ውጭ ባሉ ሰዎች ፊት መታየቱን ይገልጻል፤ «ዳኞች» የሚለውን በግሪኩ ያልተገለጸ ስም አይጨምርም።
theological_decisions:
- issue: በቤተ ክርስቲያን አውድ የἀδελφός ወካይ አጠቃቀም
  choice: ወንድም
  alternative: የእምነት ወገን፤ ወንድም ወይም እኅት
  rationale: የግሪኩ ተባዕታይ ነጠላ ቅርጽ እና የቤተሰብ ዘይቤ በዋናው ጽሑፍ ተጠብቀዋል፤ ቃሉ የክርስቲያን ማኅበሩን አባላት ወክሎ መጠቀሙ በማስታወሻ ተገልጿል።
- issue: የἀπίστων ወሰን
  choice: ማያምኑ ሰዎች
  alternative: የማያምኑ ዳኞች፤ ከማኅበሩ ውጭ ያሉ ሰዎች
  rationale: ግሪኩ በአማኞችና በማያምኑ ሰዎች መካከል ያለውን ንጽጽር ያቆያል፤ የሕግ አውዱ ዳኞችን ሊያመለክት ቢችልም ዋናው ጽሑፍ ያንን በግልጽ አይልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አንድ ዐረፍተ ነገር እና የአጻጻፍ ጥያቄ ቅርጽ ተጠብቀዋል።
