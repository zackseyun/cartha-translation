  rationale: የግሪክ ቃሉ በግልጽ የመግዛትን ቋንቋ ይጠቀማል። ይህን ምስል መጠበቅ ጽሑፉን ወደ አንድ ጠባብ የትምህርት አተረጓጎም እንዳይወስን ያደርጋል።
- issue: ሥጋዊ/አካላዊ ሥነ ምግባር
  choice: σῶμαን «ሰውነት» ብሎ በተጨባጭ መተርጎም
  alternative: «ራሳችሁ» ወይም «ሕይወታችሁ»
  rationale: የቅርብ አውዱ ስለ ሰውነትና ስለ ጾታዊ ምግባር ስለሚናገር፣ «ሰውነት» የጳውሎስን ክርክር በቀጥታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ተገዝታችኋል» የምንጩን ተደራጊ አገላለጽ ይጠብቃል፤ «በሰውነታችሁ» ደግሞ የግሪኩን ነጠላ ስምና የብዙ ቁጥር ባለቤትነት በተፈጥሯዊ አማርኛ ያቀርባል።
