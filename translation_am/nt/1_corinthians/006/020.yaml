  rationale: σῶμαን በተጨባጭ «ሰውነት» ብሎ ይተረጉማል፤ በ- ደግሞ የἐνን ቦታዊና መሣሪያዊ ስፋት ሳይገድብ ይጠብቃል።
theological_decisions:
- issue: የግዢ ምስል ያለው የመዋጀት አገላለጽ
  choice: «በዋጋ ተገዝታችኋል» በማለት የግዢውን ምስል መጠበቅ
