  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: am
  text: በዋጋ ተገዝታችኋልና፤[a] እንግዲህ[b] በሰውነታችሁ ለእግዚአብሔር ክብር ስጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዋጋ ተገዛችሁ።» የግሪክ አገላለጹ ዋጋ የተከፈለበትን የግዢ ምስል ይጠብቃል።
    reason: lexical_alternative
  - marker: b
    text: «እንግዲህ» የተተረጎመው ቃል «ስለዚህ» ወይም «አሁን እንግዲህ» ተብሎ ሊተረጎም፣ ወይም ሳይተረጎም ሊቀር ይችላል፤ ለትእዛዙ አጣዳፊነት ይጨምራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: ተገዝታችኋል
  rationale: የግሥ አድራጊውን ሳይጠቅስ የግዢን ምስል የሚጠብቅ ተፈጥሯዊ የአማርኛ ተደራጊ አገላለጽ ነው።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ማሳሰቢያ ጋር ያለውን የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τιμῆς
  choice: በዋጋ
  rationale: የተከፈለ ዋጋ ያለውን የግዢ ምስል በአጭርና ግልጽ ሁኔታ ይጠብቃል።
- source_word: δοξάσατε
  choice: አክብሩ
  rationale: ቀጥተኛውን ትእዛዝና ለእግዚአብሔር ክብር የመስጠትን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: δὴ
  choice: ስለዚህ
  rationale: ከተሰጠው ምክንያት የሚከተለውን አጣዳፊ ማሳሰቢያ ያመለክታል፤ ቅንጣቱ በአውዱ መሠረት «እንግዲህ» ሊባል ወይም ሳይተረጎም ሊቀርም ይችላል።
