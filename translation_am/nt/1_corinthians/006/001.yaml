base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: am
  text: ከእናንተ አንዱ በሌላ ሰው ላይ ክስ ሲኖረው፣ በቅዱሳን[b] ፊት ሳይሆን በኢፍትሐውያን[a] ፊት እንዲዳኝ ይደፍራልን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ኢፍትሐዊዎች» ወይም «ዓመፀኞች»። አንዳንድ ትርጉሞች ይህን «በማያምኑ ሰዎች ፊት» ብለው በትርጓሜ ያቀርቡታል፤ የግሪኩ ቃል ግን «ኢፍትሐውያን/ዓመፀኞች» ይላል።
    reason: lexical_alternative
  - marker: b
    text: «ቅዱሳን» በዚህ ስፍራ የእግዚአብሔርን ቅዱስ ሕዝብ፣ ማለትም አማኞችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: እንዴት ይደፍራል?
  rationale: የጳውሎስን የወቀሳ ኃይል ያለው የአጠያየቅ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τις ὑμῶν
  choice: ከእናንተ አንዱ
  rationale: የτιςን ነጠላ ያልተወሰነ ማጣቀሻና የὑμῶνን ከአንድ ቡድን ክፍል መሆን በግልጽ አማርኛ ይጠብቃል።
- source_word: πρᾶγμα ἔχων
  choice: ክስ ሲኖረው
  rationale: በዚህ የፍርድ አውድ πρᾶγμα ተጨባጭ የሕግ ጉዳይን ያመለክታል፤ «ክስ» አውዱን በተፈጥሯዊነት ይገልጣል።
- source_word: πρὸς τὸν ἕτερον
  choice: በሌላው ላይ
  rationale: በክርክርና በክስ አውድ ያለውን የተቃርኖ ግንኙነት ይገልጣል።
- source_word: κρίνεσθαι
  choice: ለመዳኘት
  rationale: የግሪኩን ተደራጊ የፍርድ ትርጉም ይጠብቃል፤ ጉዳዩን ወደ ፍርድ ማቅረብንም በአውዱ ያሳያል።
- source_word: ἐπὶ τῶν ἀδίκων
  choice: በዓመፀኞች ፊት
  rationale: ἀδίκων የሚለውን ሥነ ምግባራዊና ሥነ መለኮታዊ ግምገማ ይጠብቃል፤ «በማያምኑ ሰዎች» ብሎ ትርጉሙን አይተረጉምም።
- source_word: ἐπὶ τῶν ἁγίων
  choice: በቅዱሳን ፊት
  rationale: የጳውሎስን መደበኛ የአማኞች መጠሪያ ይጠብቃል፤ «ፊት» የፍርድ መቅረብን ያመለክታል።
theological_decisions:
- issue: ἀδίκων ከἁγίων ጋር ያለው ንጽጽር
  choice: ዓመፀኞች … ቅዱሳን
  alternative: የማያምኑ … አማኞች
  rationale: ግሪኩ በቀጥታ «የማያምኑ» አይልም፤ የሥነ ምግባርና የቅድስና ቃላትን ይጠቀማል። ትርጉሙ ይህን ውጥረት ይጠብቃል።
- issue: ἔχων የሚለው ተውሳከ ግስ ነጠላ ወንድ ቅርጽ
  choice: ከእናንተ አንዱ … ሲኖረው … ይደፍራል
  alternative: ከእናንተ ማንም … ሲኖራቸው … ይደፍራሉ
  rationale: የምንጩን ነጠላ ተወካይ አገላለጽ በአማርኛ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥያቄው የወቀሳ ኃይል «እንዴት ይደፍራል?» በሚለው ተጠብቋል።
