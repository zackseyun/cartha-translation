  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: am
  text: ወይስ ሰውነታችሁ በእናንተ ውስጥ ያለው፣ ከእግዚአብሔር ያላችሁት የመንፈስ ቅዱስ ቤተ መቅደስ እንደሆነ አታውቁምን?[a] እናንተም የራሳችሁ አይደላችሁም፤[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእናንተ ውስጥ ያለው የመንፈስ ቅዱስ ቤተ መቅደስ እንደሆነ፤ እርሱንም ከእግዚአብሔር እንዳላችሁት።”
    reason: የግሪኩ የዝምድና አንቀጽ ከመንፈስ ቅዱስ ጋር ያለውን ግንኙነት ይበልጥ ግልጽ የሚያደርግ አማራጭ አወቃቀር።
  - marker: b
    text: በግሪክ ጽሑፍ “ሰውነት” ነጠላ ሲሆን “የእናንተ” ግን ብዙ ቁጥር ነው፤ ይህም “የእያንዳንዳችሁ ሰውነት” ተብሎ ወይም በወካይነት ሊገባ ይችላል።
    reason: የምንጩን ነጠላ ስምና የብዙ ቁጥር ባለቤትነት አሻሚነት ለአንባቢው ማሳወቅ።
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: ከቀደመው ሐሳብ ጋር የተያያዘውን ስለታም የአማራጭ ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ οἴδατε
  choice: አታውቁምን?
  rationale: የግሪኩን የአጽንዖት አሉታዊ ጥያቄና የጳውሎስን የተለመደ አገላለጽ ይጠብቃል።
- source_word: τὸ σῶμα ὑμῶν
  choice: ሰውነታችሁ
  rationale: σῶμα በዐውዱ አካላዊውን ሰውነት ያመለክታል፤ የአማርኛው ቅርጽም ነጠላውን ስም ከብዙ ባለቤት ቅጥያ ጋር በመጠበቅ የምንጩን ቁጥር ውጥረት ያቆያል።
- source_word: ναὸς
  choice: ቤተ መቅደስ
  rationale: ከተቀደሰው የመቅደስ ውስጠኛ ስፍራ ጋር የተያያዘውን ኃይለኛ ዘይቤ በተለመደና ክቡር አማርኛ ያስተላልፋል።
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: በእናንተ ውስጥ ያለው ... የመንፈስ ቅዱስ
  rationale: ἐν ὑμῖνን በግልጽ ሁኔታ ይጠብቃል፤ የዝምድና አንቀጹን በአማርኛ ተፈጥሯዊ አደራደር ያቀርባል።
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: ከእግዚአብሔር የተቀበላችሁት
  rationale: ቃል በቃል ‘ከእግዚአብሔር ያላችሁት’ ከሚለው ይልቅ በአማርኛ ተፈጥሯዊ ሲሆን ἀπὸ θεοῦ የሚያመለክተውን ምንጭ በትክክል ያሳያል።
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: እናንተም የራሳችሁ አይደላችሁም
  rationale: የግሪኩን አጭር የባለቤትነት አገላለጽና ለሚቀጥለው ቁጥር የሚያዘጋጀውን ኃይል ይጠብቃል።
theological_decisions:
- issue: የοὗ ተዛማጅ ስምና የመንፈስ ቅዱስ ግላዊ አመልካችነት
  choice: አማርኛው የዝምድና አንቀጽ ‘ያለው ... የተቀበላችሁት’ በማለት መንፈስ ቅዱስን እንደ ተዛማጅ አካል ያቀርባል።
  alternative: አገላለጹን ኢ-ግላዊ በሚመስል መንገድ ማዋቀር።
  rationale: οὗ በሰዋስው ከἁγίου πνεύματός ጋር ይዛመዳል። የአማርኛው አወቃቀር ይህን ግንኙነት ሳይጨምር ይጠብቃል።
- issue: ነጠላ ‘ሰውነት’ ከብዙ ተደራሲዎች ጋር
  choice: ‘ሰውነታችሁ’ በማለት ነጠላውን ስምና የብዙ ቁጥር ባለቤትነትን ጠብቋል።
  alternative: ‘ሰውነቶቻችሁ’ ብሎ ወደ ብዙ ቁጥር መቀየር።
  rationale: τὸ σῶμα ነጠላ ሲሆን ὑμῶν ብዙ ቁጥር ነው። የምንጩን አወቃቀር መጠበቅ ንግግሩ ለእያንዳንዱ በተናጠል ወይም በወካይነት መሆኑን ሳይወስን ያቆያል።
