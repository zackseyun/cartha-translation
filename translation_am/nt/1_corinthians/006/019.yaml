review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical question, singular ‘body’ with plural possessive, temple metaphor, indwelling Holy Spirit, and concluding ownership statement. However, ἔχετε is present (‘you have’); ‘የተቀበላችሁት’ (‘which you received’) unnecessarily changes the verbal aspect to a completed reception.
  naturalness: The Amharic is clear, modern, and appropriately dignified. Replacing ‘የተቀበላችሁት’ with ‘ያላችሁት’ is also natural in this relative-clause construction.
  terminology: ‘ሰውነታችሁ,’ ‘ቤተ መቅደስ,’ ‘መንፈስ ቅዱስ,’ and ‘የራሳችሁ አይደላችሁም’ are suitable standard biblical Amharic terms. The singular/plural tension is properly retained and explained.
  issues:
  - severity: medium
    issue: ‘ከእግዚአብሔር የተቀበላችሁት’ renders ἔχετε as completed ‘received.’
    rationale: The Greek uses present ἔχετε, ‘you have.’ Although divine reception is implied by ἀπὸ θεοῦ, it is not explicitly expressed by a receiving verb and should not replace the source wording in an optimal-equivalence translation.
