id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: am
  text: ሌቦችም፣ ስግብግቦችም[a]፣ ሰካራሞችም፣ ተሳዳቢዎችም፣ በግፍ የሚቀሙም[b] የእግዚአብሔርን መንግሥት አይወርሱም[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሌላውን የሚመኙ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቀማኞች” ወይም “በዛቻ የሚነጥቁ።”
    reason: lexical_alternative
  - marker: c
    text: ማለትም፣ በእግዚአብሔር መንግሥት ድርሻ አያገኙም።
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: ሌቦች
  rationale: ለሚሰርቁ ሰዎች በዘመናዊ አማርኛ የተለመደና ቀጥተኛ ቃል ነው።
- source_word: πλεονέκται
  choice: ስግብግቦች
  rationale: በብዙ ለማግኘት ያለ የማይጠገብ ምኞትንና የስግብግብነት ባሕርይን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μέθυσοι
  choice: ሰካራሞች
  rationale: ቃሉ አንድ ጊዜ የሰከሩትን ብቻ ሳይሆን በስካር የሚታወቁ ሰዎችን ያመለክታል።
- source_word: λοίδοροι
  choice: ተሳዳቢዎች
  rationale: ሌሎችን በስድብና በሚያዋርድ ንግግር የሚጎዱ ሰዎችን ይገልጣል፤ ‘ሐሰት የሚናገሩ’ ብቻ ብሎ አያጠብበውም።
- source_word: ἅρπαγες
  choice: በግፍ የሚቀሙ
  rationale: ቃሉ ለትርፍ ሲሉ የሌሎችን ንብረት የሚነጥቁ ወይም የሚበዘብዙ ሰዎችን ያመለክታል፤ ከ‘ሌቦች’ ያለውን ልዩነትም ያሳያል።
- source_word: βασιλείαν θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ንግግር የተለመደ ሲሆን የእግዚአብሔርን ንግሥናና ግዛት የሚያካትተውን ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: κληρονομήσουσιν
  choice: አይወርሱም
  rationale: የወደፊት ርስትን ወይም እንደ ወራሽ ድርሻ መቀበልን በአጭርና በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የኃጢአት ዝርዝሩ ኃይልና የመንግሥቱ ርስት
  choice: ጽሑፉ በእነዚህ ድርጊቶች የሚታወቁ የሰዎች ዓይነቶችን ይዘረዝራል፤ ‘አይወርሱም’ የሚለውም የወደፊት ድርሻን የማያገኙ መሆኑን ይናገራል።
  alternative: ዝርዝሩ የተለየ አንድ ጊዜ ድርጊት የፈጸመን ሰው ሁሉ ያለ ሌላ አውድ እንደሚያመለክት መተርጎም።
  rationale: በግሪክኛው ያሉት የብዙ ቁጥር ስሞች በዚህ የኃጢአት ዝርዝር ውስጥ በእነዚህ ባሕርያት የሚገለጹ ሰዎችን ያመለክታሉ። ትርጉሙ እንደ ‘ንስሐ ያልገቡ’ ያለ ትርጓሜያዊ ቅጥያ በዋናው ጽሑፍ ሳይጨምር የንግግሩን ክብደት ጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። በየቃሉ የተደገመው οὔτε/οὐ በአማርኛው “-ም” ቅጥያና በመጨረሻው አሉታዊ ግስ ተፈጥሯዊ ሆኖ ተወክሏል።
