  text: ይህን የምለው ለእፍረታችሁ ነው። እንዲህ ነውን? በመካከላችሁ በአንድ ወንድምና በሌላው መካከል መፍረድ የሚችል አንድ ጠቢብ እንኳ የለምን?[a]
  philosophy: optimal-equivalence
  footnotes:
