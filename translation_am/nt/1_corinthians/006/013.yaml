  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: am
  text: ምግቦች ለሆድ፣ ሆድም ለምግቦች ነው፤ እግዚአብሔር ግን ይህንም እነዚህንም ያስወግዳል።[a] ሰውነት ግን ለጾታዊ ብልግና ሳይሆን ለጌታ ነው፤ ጌታም ለሰውነት ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ያስወግዳል” የተተረጎመው የግሪክ ግስ “ያጠፋል፣” “ይሽራል” ወይም “ሥራ አልባ ያደርጋል” ተብሎም ሊተረጎም ይችላል። “ይህንም እነዚህንም” የሚለው ሆድንና ምግቦችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ብዙ ተርጓሚዎች “ምግቦች ለሆድ፣ ሆድም ለምግቦች ነው” የሚለውን ጳውሎስ ጠቅሶ ከዚያ ያረመው የቆሮንቶስ ሰዎች መፈክር አድርገው ይወስዱታል። የግሪኩ ጽሑፍ ግን ይህን በጥቅስ ምልክት አይለየውም።
    reason: alternative_reading
lexical_decisions:
- source_word: βρώματα
  choice: ምግቦች
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በአማርኛም ተፈጥሯዊና ግልጽ ነው።
- source_word: κοιλίᾳ / κοιλία
  choice: ሆድ
  rationale: በዚህ አውድ የምግብ ፍላጎትንና መፈጨትን የሚመለከተውን ትርጉም በግልጽ ያስተላልፋል።
- source_word: καταργήσει
  choice: ያስወግዳል
  rationale: ግሱ አንድን ነገር ወደ ፍጻሜ ማምጣትን ወይም ሥራ አልባ ማድረግን ሊያመለክት ስለሚችል፣ ‘ያስወግዳል’ ፍጹም መደምሰስን ሳያስገድድ የወደፊት መቋረጥን ያሳያል።
- source_word: ταύτην καὶ ταῦτα
  choice: ይህንም እነዚህንም
  rationale: የግሪኩን ነጠላና ብዙ ቁጥር ተውላጠ ስሞች ይጠብቃል፤ እነርሱም በቅደም ተከተል ሆድንና ምግቦችን ያመለክታሉ።
- source_word: σῶμα
  choice: ሰውነት
  rationale: በጳውሎስ አጠቃቀም እዚህ የሚታሰበውን ተጨባጭ የሰው አካል በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: πορνείᾳ
  choice: ጾታዊ ብልግና
  rationale: πορνεία የሚያመለክተውን ሰፊ የተከለከለ ጾታዊ ምግባር በዘመናዊና ለአንባቢ ግልጽ በሆነ አገላለጽ ያቀርባል።
- source_word: κυρίῳ / κύριος
  choice: ጌታ
  rationale: የክርስቶስን ጌትነት እና የጳውሎስን መደበኛ አጠቃቀም የሚጠብቅ የተለመደ አቻ ቃል ነው።
- source_word: δὲ
  choice: ግን
  rationale: በምግብና በሆድ አባባል እና በሰውነት ላይ በሚከተለው የጳውሎስ ንግግር መካከል ያለውን ንፅፅር በግልጽ ያሳያል።
theological_decisions:
- issue: የመክፈቻው ንግግር የቆሮንቶስ ሰዎች መፈክር ነው ወይስ የጳውሎስ የራሱ ንግግር?
  choice: የጥቅስ ምልክት ሳይጨመር ንግግሩን በቀጥታ ማቅረብ
  alternative: እንደ ቆሮንቶስ ሰዎች መፈክር በጥቅስ ምልክት ማቅረብ ወይም ‘እናንተ እንደምትሉት’ የሚል መግቢያ መጨመር
  rationale: የግሪኩ ጽሑፍ ጥቅስ መሆኑን በቀጥታ አያመለክትም። ጥቅስ እንደሆነ የሚያዩ ብዙ ተርጓሚዎች ቢኖሩም፣ ዋናው ጽሑፍ ያንን አተረጓጎም አያስገድድም።
- issue: καταργήσει ስለ ሆድና ምግቦች የሚገልጸው ነገር
  choice: ወደፊት እንደሚወገዱ መግለጽ
  alternative: እግዚአብሔር ሁለቱንም ያጠፋል ወይም ይሽራል
  rationale: ቃሉ ተግባራቸው ወደ ፍጻሜ መምጣቱን ሊያመለክት ይችላል፤ ትርጉሙ ቁሳዊ መደምሰስን እንደ ብቸኛ አማራጭ አያስገድድም።
- issue: ‘ጌታም ለሰውነት’ የሚለው አጭር የመመላለስ አገላለጽ
  choice: አጭሩንና ትይዩውን አገላለጽ ያለ ማብራሪያ መጠበቅ
  alternative: ‘ጌታ ሰውነትን ይንከባከባል’ ወይም ‘ጌታ ለሰውነት ጥቅም ነው’ ብሎ ማስፋት
  rationale: የግሪኩ አገላለጽ አጭርና ትይዩ ነው። ማስፋት ጌታ ከሰውነት ጋር ያለውን ግንኙነት ጽሑፉ ከተናገረው በላይ ይተረጉማል።
