review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two rhetorical questions, the contemplated act expressed by ἄρας ... ποιήσω, the specific reference to a prostitute (πόρνης), and the emphatic repudiation μὴ γένοιτο. However, ሰውነታችሁ is formally singular for plural σώματα, and አካላት alone does not consistently convey μέλη as bodily members/parts in the Messiah–prostitute union analogy.
  naturalness: The draft is generally clear modern standard Amharic. Using ሰውነቶቻችሁ and explicitly saying የ… አካል ክፍሎች makes the singular/plural relations and Paul’s sustained body imagery more idiomatic and less liable to be understood as institutional or personal 'members.'
  terminology: የመሲሑ appropriately renders Χριστοῦ as a title in accordance with the supplied project decision, with the alternative የክርስቶስ retained in the footnote. ዝሙት አዳሪ is an accurate, non-archaic rendering of πόρνη. ፈጽሞ አይሁን! suitably renders the optative force and strong repudiation of μὴ γένοιτο.
  issues:
  - severity: medium
    issue: Plural σώματα is rendered with singular ሰውነታችሁ.
    rationale: Although a possessive singular may sometimes be read collectively in Amharic, the Greek explicitly refers to the believers’ individual bodies. ሰውነቶቻችሁ preserves this distinction clearly.
  - severity: medium
    issue: አካላት by itself weakens the bodily-part sense of μέλη.
    rationale: In the repeated expression, አካላት can be heard as persons, entities, or organizations. የ… አካል ክፍሎች directly retains the source’s body-member metaphor and its rhetorical force without adding interpretation.
  revised_text: ሰውነቶቻችሁ የመሲሑ[a] አካል ክፍሎች መሆናቸውን አታውቁምን? እንግዲህ የመሲሑን አካል ክፍሎች ወስጄ የአንዲት ዝሙት አዳሪ አካል ክፍሎች ላድርጋቸው? ፈጽሞ አይሁን![b]
