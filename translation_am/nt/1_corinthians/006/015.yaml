    text: ወይም፣ “የክርስቶስ።” የግሪኩ Χριστός የማዕረግ ትርጉሙን ይዞ “መሲሕ” ተብሎ፣ ወይም እንደ ስም በሚሠራው ቅርጽ “ክርስቶስ” ተብሎ ሊተረጎም ይችላል።
