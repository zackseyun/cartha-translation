  rationale: ጳውሎስ ዘፍጥረት 2፥24ን ከዝሙት አዳሪ ጋር ለሚደረግ ግንኙነት በንጽጽር ይተገብራል፤ ትርጉሙ ይህን ውጥረት ሳያጠፋ ከጥቅሱ ቃላት በላይ አይሄድም።
- issue: φησίν የሚለው ግስ ያልተገለጸ ርዕሰ ጉዳይ
