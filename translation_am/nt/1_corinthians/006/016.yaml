    text: “ይላል”፦ ጥቅሱ ከዘፍጥረት 2፥24 የተወሰደ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: ከቀደመው ሐሳብ ጋር የተያያዘውን የጥያቄ አማራጭ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ οἴδατε
  choice: አታውቁም?
  rationale: የግሪኩን የአጽንዖት አጠያየቅ ቀጥታና ተፈጥሯዊ በሆነ መንገድ ይጠብቃል።
- source_word: ὁ κολλώμενος
  choice: የሚጣበቅ ሰው
  rationale: κολλάομαι የመጣበቅን፣ የመዋሐድን ወይም ራስን ከሌላው ጋር የማያያዝን ሐሳብ ይይዛል፤ ይህ አገላለጽ ሆን ብሎ የሚፈጸመውን ግንኙነት ሳያሰፋ ያሳያል።
- source_word: τῇ πόρνῃ
  choice: ከዝሙት አዳሪ ሴት ጋር
  rationale: πόρνη በተለይ ሴት ዝሙት አዳሪን ያመለክታል፤ ሰፊውን ‘ሴሰኛ ሴት’ የሚል ትርጉም አይጨምርም።
- source_word: ἓν σῶμά ἐστιν
  choice: ከእሷ ጋር አንድ አካል እንደሆነ
  rationale: σῶμα ን በተለመደው ‘አካል’ ይተረጉማል፤ ‘ከእሷ ጋር’ በግሪኩ ውስጥ በግንኙነቱ የተገለጠውን ትርጉም በአማርኛ ግልጽ ያደርጋል።
- source_word: Ἔσονται γάρ
  choice: ምክንያቱም … ይሆናሉ
  rationale: γάρ ለቀደመው ንግግር ምክንያት እንደሚሰጥ ያሳያል፤ ἔσονται ከεἰς ጋር የመሆንን ወይም ወደ አንድነት የመግባትን ውጤት ይገልጣል።
- source_word: φησίν
  choice: ይላል
  rationale: የግሪኩን ነጠላ ግስ ሆን ብሎ ርዕሰ ጉዳዩን ሳይገልጽ ይጠብቃል።
- source_word: οἱ δύο
  choice: ሁለቱ
  rationale: የግሪኩን አጭርና ቀጥተኛ አገላለጽ ይከተላል።
- source_word: εἰς σάρκα μίαν
  choice: አንድ ሥጋ
  rationale: የዘፍጥረትን የተለመደ አገላለጽ በቀጥታ ይጠብቃል፤ ሥጋ እዚህ ግንኙነታዊና አካላዊ አንድነትን እንጂ ‘ኃጢአተኛ ባሕርይን’ አያመለክትም።
theological_decisions:
