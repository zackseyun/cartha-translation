  rationale: የግሪኩ ጽሑፍ ተናጋሪውን በስም አይገልጽም፤ ስለዚህ ትርጉሙ ይህን አሻሚነት ይጠብቃል፣ የጥቅሱ ምንጭ ግን በማስታወሻ ይገለጻል።
