  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: am
  text: መላእክትን እንደምንፈርድ አታውቁምን? የዚህን ሕይወት ጉዳዮችማ ይቅርና![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዚህን ሕይወት ጉዳዮች ይበልጥ!” የግሪኩ ቃል ከታላቁ ጉዳይ ወደ ቀላሉ ጉዳይ የሚደረግን ንጽጽር ያጠናክራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: አታውቁምን?
  rationale: የጳውሎስን የተለመደ አጽንዖታዊ ጥያቄ በክብር ባለውና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: እንደምን-
  rationale: ከ‘ማወቅ’ በኋላ ያለውን የይዘት ሐረግ በአማርኛ ተፈጥሯዊ በሆነ የግስ ቅርጽ ያስገባል።
- source_word: ἀγγέλους
  choice: መላእክትን
  rationale: በዚህ የወደፊት ፍርድ አውድ ቃሉ ሰማያዊ ፍጥረታትን ያመለክታል፤ ‘መላእክት’ የተለመደውና ግልጹ አቻ ቃል ነው።
- source_word: κρινοῦμεν
  choice: እንደምንፈርድ
  rationale: የግሪኩን የወደፊት ጊዜና የፍርድ ትርጉም ይጠብቃል፤ የፍርዱን መንገድ ወይም ወሰን አይወስንም።
- source_word: μήτιγε
  choice: እንዴት ይበልጥ
  rationale: ከታላቁ ወደ ታናሹ የሚሄደውን አጽንዖታዊ ንጽጽር ያስተላልፋል፤ የግሪኩን አጭርና ግስ ያልተደገመበት አነጋገርም በተቻለ መጠን ይጠብቃል።
- source_word: βιωτικά
  choice: የዚህን ሕይወት ጉዳዮች
  rationale: ቃሉ የዕለት ተዕለት ምድራዊ ሕይወትን የሚመለከቱ ጉዳዮችን በሰፊው ያመለክታል፤ ትርጉሙ በሕግ ክርክሮች ብቻ እንዳይገደብ ‘ጉዳዮች’ ተመርጧል።
theological_decisions:
- issue: አማኞች ‘መላእክትን መፍረዳቸው’ ምንነት
  choice: ‘መላእክትን እንደምንፈርድ’ የሚለውን ቀጥተኛ አነጋገር ማቆየት
  alternative: ‘በመላእክት ላይ እንገዛለን’ ወይም ‘የወደቁ መላእክትን እንፈርዳለን’
  rationale: ጥቅሱ የፍርዱን አፈጻጸም፣ ወሰን ወይም የትኞቹ መላእክት እንደሆኑ አይገልጽም። ስለዚህ ትርጉሙ ይህን የትርጓሜ ክፍተት ሳይዘጋ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጉዳዮችማ’ የሚለው የአጽንዖት ቅርጽ የግሪኩን ከታላቁ ወደ ታናሹ የሚሄድ ክርክር በተፈጥሯዊ አማርኛ ያሳያል።
