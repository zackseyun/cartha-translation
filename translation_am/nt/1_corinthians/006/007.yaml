  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: am
  text: እንግዲህማ፣ በመካከላችሁ የፍርድ ክሶች መኖራቸው ለእናንተ አስቀድሞ ፈጽሞ ሽንፈት ነው[a]። ለምን ይልቅ በደል አትቀበሉም? ለምን ይልቅ አትነጠቁም[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኪሳራ” ወይም “ውድቀት”። የግሪኩ ቃል ἥττημα ኪሳራን፣ ሽንፈትን ወይም ውድቀትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አትታለሉም” ወይም “አትከለከሉም”። የግሪኩ ቃል ἀποστερεῖσθε መነጠቅን፣ መታለልን ወይም መከልከልን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: እንግዲህ … ከወዲሁ ፍጹም
  rationale: የመደምደሚያውን ሽግግር፣ ሁኔታው አስቀድሞ መድረሱንና የግምገማውን አጽንዖት ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἥττημα
  choice: ሽንፈት
  rationale: ጳውሎስ የፍርድ ውጤቱን ሳይሆን ክሶቹ መኖራቸውን ራሱ የማኅበረሰቡ ሽንፈት አድርጎ የሚገልጽበትን ጠንካራ ንግግር ይጠብቃል።
- source_word: κρίματα
  choice: ክሶች
  rationale: በዐውዱ ውስጥ በፍርድ ቤት የሚቀርቡ የሕግ ክርክሮችን ያመለክታል፤ “ፍርዶች” የሚለው ከመጠን በላይ አጠቃላይ ይሆናል።
- source_word: μεθ’ ἑαυτῶν
  choice: እርስ በርሳችሁ
  rationale: ጉዳዩ በማኅበረሰቡ አባላት መካከል መሆኑን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀδικεῖσθε
  choice: በደል አትቀበሉም
  rationale: የግሱን ተደራጊ ትርጉምና የፍትሕ መጓደል ሐሳብ ይጠብቃል።
- source_word: ἀποστερεῖσθε
  choice: አትታለሉም
  rationale: በገንዘብ ወይም በንብረት ጉዳይ ሌላ ሰው በማታለል የሚያሳጣውን ሰፊ ትርጉም በተረዳ አማርኛ ያቀርባል፤ የመነጠቅ አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ጳውሎስ በአማኞች መካከል ያለውን ክስ የሚገመግምበት መንገድ
  choice: ἥττημα የሚለው “ሽንፈት” ተብሎ ተተርጉሟል፤ ክሶቹ መኖራቸው ራሱ ሽንፈት መሆኑን ያሳያል።
