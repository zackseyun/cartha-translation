review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical assessment of ἥττημα and the passive sense of ἀδικεῖσθε. However, it omits the dative reference in ὑμῖν (“for you”), and አትታለሉም primarily means “are you not deceived,” rather than being deprived/defrauded (ἀποστερεῖσθε).
  naturalness: The revision uses idiomatic modern standard Amharic. በመካከላችሁ የፍርድ ክሶች መኖራቸው clearly expresses disputes/lawsuits within the community, and አትነጠቁም retains the passive rhetorical form naturally.
  terminology: ሽንፈት appropriately renders ἥττημα. የፍርድ ክሶች makes the legal sense of κρίματα explicit in context. መነጠቅ renders deprivation/defrauding without reducing the meaning to mere deception.
  issues:
  - severity: medium
    issue: ὑμῖν (“for you”) is not represented.
    rationale: The original identifies the lawsuits as a defeat/loss pertaining to the Corinthian readers; adding ለእናንተ preserves this element without interpretive expansion.
  - severity: high
    issue: አትታለሉም is too broad for ἀποστερεῖσθε.
    rationale: It normally denotes being deceived or misled. In this legal-material context the Greek means being deprived, cheated, or defrauded; አትነጠቁም more directly preserves that sense.
  - severity: low
    issue: The footnote alternative “ንብረታችሁን አትነጠቁም” is structurally and semantically less suitable.
    rationale: It introduces an explicit object not stated in the Greek and is phrased as a full negated question rather than a lexical alternative. The revised note gives direct lexical alternatives.
