  rationale: የጽሑፉን ጠንካራ ሥነ ምግባራዊ ግምገማ ይጠብቃል፤ ግን ጽሑፉ በግልጽ ያልጠቀሰውን የትምህርተ እምነት ምድብ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በራሱ” የሚለው በግሪኩ ውስጥ በተናጠል የሌለ ቢሆንም፣ ὅτι የሚያስገባው ክሶች መኖራቸው ራሱ ሽንፈቱ መሆኑን በአማርኛ በግልጽ ያቀርባል።
