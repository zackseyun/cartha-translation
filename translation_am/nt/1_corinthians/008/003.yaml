  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: am
  text: ነገር ግን ማንም እግዚአብሔርን የሚወድ ከሆነ፣ እርሱ በእግዚአብሔር የታወቀ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእርሱ እውቅና ያገኘ ነው” ወይም “በእርሱ ታውቋል።” የግሪኩ ፍጹም ተደራጊ ቅርጽ በእግዚአብሔር የመታወቅን ቀጣይ ሁኔታ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: ነገር ግን ... ከሆነ
  rationale: የεἰን ሁኔታዊ ትርጉምና የδέን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τις
  choice: ማንም
  rationale: ጾታን ሳይወስን አጠቃላይ የሆነውን ያልተወሰነ ማመልከቻ ይጠብቃል።
- source_word: ἀγαπᾷ
  choice: የሚወድ
  rationale: የአሁን ጊዜውን የፍቅር ድርጊት በቀጥታና በተለመደ አገላለጽ ይሰጣል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን የአምላክ ስያሜ እንደ ቀጥተኛ ተሳቢ ያቀርባል።
- source_word: οὗτος
  choice: እርሱ
  rationale: ቀደም ብሎ የተገለጸውን ሰው በግልጽ ይመለከታል፤ በአማርኛም ከቃል በቃል ‘ይህ ሰው’ ይልቅ ተፈጥሯዊ ነው።
- source_word: ἔγνωσται
  choice: የታወቀ ነው
  rationale: የግሪኩን ፍጹም ተደራጊ ቅርጽ፣ ማለትም ከቀደመ ድርጊት የተገኘን ቀጣይ ሁኔታ፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑπ’ αὐτοῦ
  choice: በእግዚአብሔር
  rationale: የተውላጠ ስሙ መመለሻ እግዚአብሔር መሆኑን በአማርኛ ያለ ግራ መጋባት ግልጽ ያደርጋል።
theological_decisions:
- issue: በጳውሎስ ንግግር ውስጥ እግዚአብሔር ‘ማወቁ’ ያለው ትርጉም
  choice: የግንኙነት እውቅናን ወይም ቃል ኪዳናዊ ማወቅን ሊያካትት የሚችል ‘በእግዚአብሔር የታወቀ ነው’ የሚለው ሰፊ አገላለጽ
  alternative: በእግዚአብሔር ተቀባይነት አግኝቷል፤ ወይም በእግዚአብሔር እውቅና ተሰጥቶታል
  rationale: γινώσκω እግዚአብሔርን እንደ አድራጊ ሲያቀርብ ከመረጃዊ እውቀት በላይ የግንኙነት እውቅናን ሊያመለክት ይችላል፤ ነገር ግን ግሪኩ አንድን ጠባብ የዶክትሪን ትርጉም አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አጽንዖት ተጠብቆ ሳለ፣ የተውላጠ ስም ግራ መጋባትን ለማስወገድ ‘በእግዚአብሔር’ ተደግሟል።
