  text: ስለዚህ፣ ለጣዖታት የተሠዋውን ምግብ ስለ መብላት፣ ጣዖት በዓለም ምንም እንዳልሆነ[a]፣ ከአንድ በቀር አምላክ እንደሌለ[b] እናውቃለን።
  philosophy: optimal-equivalence
  footnotes:
