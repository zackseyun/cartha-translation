- source_word: οὐδὲν εἴδωλον
  choice: ጣዖት … ምንም እንዳልሆነ
  rationale: የግሪኩን አጭርና ኃይለኛ አነጋገር ይጠብቃል፤ የጣዖቱን ከንቱነት ወይም እውነተኛ ህልውና አለመኖር ሊያመለክት የሚችለውን ክፍትነትም አይዘጋም።
