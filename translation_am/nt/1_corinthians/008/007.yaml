base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: am
  text: ነገር ግን ይህ እውቀት በሁሉም ዘንድ የለም። አንዳንዶች ግን እስከ አሁን ድረስ ከጣዖት ጋር ባላቸው የቆየ ግንኙነት[a] ምክንያት፣ ምግቡን ለጣዖት እንደተሠዋ አድርገው ይበሉታል፤ ሕሊናቸውም ደካማ ስለሆነ[b] ይረክሳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል ይበልጥ፣ «እስከ አሁን ድረስ ከጣዖት ጋር ባላቸው ልማድ/ትውውቅ» ማለት ነው። የግሪኩ ሐረግ ለመተርጎም አስቸጋሪ ነው፤ ሐሳቡም አንዳንዶች ቀድሞ ከጣዖት አምልኮ ጋር የነበራቸው ግንኙነት እስካሁን ተጽዕኖ እንደሚያደርግባቸው ነው።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች «የጣዖቱ ሕሊና» የሚል ንባብ ወይም ከዚህ ጋር የሚዛመድ ልዩነት አላቸው። ዋናው ጽሑፍ የSBLGNTን ንባብ ይከተላል።
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: እውቀት
  rationale: በአውዱ ጣዖት ምንም እንዳልሆነ ከማወቅ ጋር ያለውን ትስስር ይጠብቃል።
- source_word: συνήθεια
  choice: ልምድ
  rationale: ተራ ልማድን ብቻ ሳይሆን ከቀድሞው የጣዖት አምልኮ ጋር የሰደደ ትውውቅንና ግንኙነትን በአውዱ ያመለክታል።
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: እስከ አሁን ድረስ ከጣዖት ጋር በነበራቸው
  rationale: የግሪኩን ጊዜያዊ አገላለጽ ይጠብቃል፤ ሐረጉ አገባባዊ አሻሚነት ስላለው የቃል በቃል አማራጭ በማስታወሻ ቀርቧል።
- source_word: εἰδωλόθυτον
  choice: ለጣዖት እንደተሠዋ
  rationale: ምግቡ ከጣዖት መሥዋዕት ጋር ያለውን ሥርዓታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνείδησις
  choice: ሕሊና
  rationale: በጳውሎስ ሥነ ምግባራዊ አጠቃቀም ያለውን የውስጥ ምስክርነትና ግንዛቤ ይገልጣል።
- source_word: ἀσθενής
  choice: ደካማ
  rationale: በዚህ ምዕራፍ ሕሊናው በዚህ ጉዳይ ጽኑ ያልሆነውን ሰው የሚገልጠውን የጳውሎስ ቃል ይጠብቃል።
- source_word: μολύνεται
  choice: ይረክሳል
  rationale: በሕሊና ላይ የሚደርሰውን ሥነ ምግባራዊ ብክለት በክብር ባለውና ግልጽ ቃል ያስተላልፋል።
theological_decisions:
- issue: ለጣዖት የተሠዋውን ምግብ ጣዖታት እውነተኛ አማልክት እንደሆኑ ሳያመለክት መግለጽ
  choice: ምግቡን ለጣዖት እንደተሠዋ አድርገው ይበሉታል
  alternative: ለጣዖት የተሠዋውን ምግብ ይበላሉ
  rationale: አገላለጹ ተመጋቢዎቹ ምግቡን እንዴት እንደሚቆጥሩት ያሳያል እንጂ ጣዖታት እውነተኛ አማልክት መሆናቸውን አያረጋግጥም፤ ጣዖት ምንም ባይሆንም ተሳትፎው ደካማውን ሕሊና ሊያረክስ እንደሚችል ያለውን ውጥረት ይጠብቃል።
