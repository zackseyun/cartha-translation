review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders γνῶσις, εἰδωλόθυτον, συνείδησις, ἀσθενής, and μολύνεται. Its treatment of the difficult phrase τῇ συνηθείᾳ ἕως ἄρτι τοῦ εἰδώλου generally preserves the intended connection with idol worship, but «እስከ አሁን ድረስ ... በነበራቸው ልምድ» is temporally and idiomatically strained: «እስከ አሁን» suggests an ongoing state, while «በነበራቸው» presents it as simply past. A wording that retains the source ambiguity while speaking natural Amharic is warranted.'
  naturalness: The verse is clear overall, but «ከጣዖት ጋር በነበራቸው ልምድ» is less natural than «ከጣዖት ጋር ባላቸው የቆየ ግንኙነት». The latter conveys an ingrained/continuing former association without reducing it to generic experience. The rest of the register is appropriate modern standard Amharic.
  terminology: «እውቀት», «ሕሊና», «ደካማ», and «ይረክሳል» are suitable. «ለጣዖት እንደተሠዋ አድርገው» appropriately reflects the participants’ perception of the food’s cultic status without affirming the idol’s reality. The textual-variant footnote should identify the variant more directly as «የጣዖቱ ሕሊና» rather than paraphrasing it as a conscience “related to” the idol.
  issues:
  - severity: medium
    issue: The main-text expression for συνήθεια ... ἕως ἄρτι is temporally awkward.
    rationale: «እስከ አሁን ድረስ» and «በነበራቸው» pull in different temporal directions. Revising it to «እስከ አሁን ድረስ ከጣዖት ጋር ባላቸው የቆየ ግንኙነት ምክንያት» is natural and retains the difficult Greek phrase’s contextual sense without claiming more precision than the source permits.
