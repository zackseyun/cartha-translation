id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: am
  text: እንግዲህ ወንድሞችን[a] በዚህ መንገድ በመበደልና ደካማ ሕሊናቸውን በማቁሰል፣ መሲሑን[b] ትበድላላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ወንድሞች” የሚለው የእምነት አጋሮችን ያመለክታል፤ እንደ አውዱም ወንዶችንና ሴቶችን ሊያካትት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ክርስቶስን።” የግሪኩ ማዕረግ Χριστός ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: እንግዲህ ... በዚህ መንገድ
  rationale: δὲ ከቀደመው ሐሳብ ጋር ያለውን ለስላሳ ትስስር በ“እንግዲህ” ያሳያል፤ οὕτως ደግሞ ወደ ቀደመው የድርጊት ሁኔታ የሚያመለክተውን “በዚህ መንገድ” በማለት ይጠብቃል።
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: ወንድሞችን ... በመበደል
  rationale: የአሁን ጊዜ ተሳቢው ከዋናው ግስ ጋር ያለውን የመንገድ/ሁኔታ ግንኙነት “በመበደል” ያሳያል። ከἁμαρτάνω ጋር εἰς በሰዎች ላይ የሚደረግን በደል ያመለክታል።
- source_word: τύπτοντες
  choice: በማቁሰል
  rationale: ግሱ በመሠረቱ “መምታት” ቢሆንም፣ እዚህ ሕሊናን ስለሚመለከት ዘይቤያዊ ነው፤ “ማቁሰል” የድርጊቱን ጉዳትና ጥንካሬ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: ደካማ ሕሊናቸውን
  rationale: የግሪኩን ነጠላ “ሕሊና” ከብዙ ባለቤት ቅጥያ ጋር በአማርኛ ተፈጥሯዊ በሆነ መልኩ ይጠብቃል፤ ἀσθενοῦσαν የሕሊናውን ደካማነት ያመለክታል።
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: መሲሑን ትበድላላችሁ
  rationale: εἰς የበደሉን ዒላማ ያሳያል፤ የአማርኛው ቀጥተኛ ተሳቢ ይህን በተፈጥሯዊነት ይገልጣል። Χριστός እዚህ እንደ ማዕረግ “መሲሕ” ተብሎ ተተርጉሟል።
theological_decisions:
- issue: ἐις τοὺς ἀδελφοὺς ውስጥ ያለው ἀδελφούς ማንን እንደሚያካትት
  choice: ወንድሞችን
  alternative: ወንድሞችንና እህቶችን / እምነት አጋሮችን
  rationale: ዋናው ጽሑፍ የግሪኩን ወንድ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ በዚህ የማኅበረ ምእመናን አውድ ግን ቃሉ ወንዶችንና ሴቶችን የሚያካትት የእምነት አጋሮችን ሊያመለክት ስለሚችል ይህ በማስታወሻ ተገልጧል።
- issue: Χριστόν እንደ ማዕረግ ወይም እንደ የተለመደ ስም መተርጎም
  choice: መሲሑን
  alternative: ክርስቶስን
  rationale: Χριστός በዚህ አውድ የተቀባውን ጌታ የሚጠቁም ማዕረግ ሆኖ የሚነበብ በመሆኑ “መሲሕ” ተመርጧል፤ ባህላዊው አማራጭ “ክርስቶስ” በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሁለቱ ተሳቢ ግሶች ክምችት “በመበደልና ... በማቁሰል” ተብሎ ተጠብቆ፣ ዋናው ክስ “ትበድላላችሁ” በመጨረሻ ተቀምጧል።
