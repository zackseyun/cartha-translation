  rationale: ጥቅሱ አብንና ኢየሱስ መሲሕን ሳያደባልቅ በ‘ከእርሱ’ እና ‘በእርሱ በኩል’ ይለያቸዋል፤ በተመሳሳይ ጊዜ ‘አንድ አምላክ’ እና ‘አንድ ጌታ’ የሚለውን ከፍተኛ ክርስቶሎጂያዊ ውጥረት ያቆያል።
