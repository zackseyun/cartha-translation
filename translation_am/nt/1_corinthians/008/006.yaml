base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: am
  text: ነገር ግን ለእኛ አንድ አምላክ፣ እርሱም አብ፣ አለ፤ ሁሉ ከእርሱ ነው፣ እኛም ለእርሱ ነን።[a] ደግሞም አንድ ጌታ፣ ኢየሱስ መሲሕ፣[b] አለ፤ ሁሉ በእርሱ በኩል ነው፣ እኛም በእርሱ በኩል ነን።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እኛም ወደ እርሱ ነን” ተብሎም ሊተረጎም ይችላል። ሐረጉ አቅጣጫን፣ ግብን ወይም ዓላማን ሊገልጥ ይችላል፤ “ለእርሱ” የተመረጠው አማኞች እግዚአብሔርን እንደ መጨረሻ ግባቸው ማድረጋቸውን ለማሳየት ነው።
    reason: lexical_alternative
  - marker: b
    text: “ኢየሱስ ክርስቶስ” ተብሎም ሊተረጎም ይችላል። የግሪኩ Χριστός እንደ ማዕረግ (“መሲሕ”) ወይም በአንዳንድ አውዶች እንደ ስም የቀረበ ቅጽ (“ክርስቶስ”) ሊሠራ ይችላል።
    reason: alternative_reading
  - marker: c
    text: “ሁሉ ከእርሱ ነው” እና “ሁሉ በእርሱ በኩል ነው” የሚሉት ትይዩ ሐረጎች አብን እንደ ምንጭ፣ ኢየሱስ መሲሕንም እንደ መካከለኛ አድራጊ የሚያሳየውን ልዩነት ይጠብቃሉ።
    reason: cross_reference
