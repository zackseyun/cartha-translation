language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: am
  text: ስለዚህ፣ ምግብ ወንድሜን ቢያሰናክል፣ ወንድሜን እንዳላሰናክል ለዘላለም ሥጋ ከቶ አልበላም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: ምግብ
  rationale: ቃሉ በአጠቃላይ የሚበላ ነገርን ወይም ምግብን ያመለክታል፤ ከቀጣዩ κρέα የተለየ ሆኖ ተጠብቋል።
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: የሚያሰናክል / እንዳላሰናክል
  rationale: የመሰናከያውን ምስላዊ አገላለጽና ሌላውን ወደ መንፈሳዊ ውድቀት የመምራት ሐሳብ ሳይገደብ ይጠብቃል።
- source_word: κρέα
  choice: ሥጋ
  rationale: ከአጠቃላዩ ‘ምግብ’ በተለየ መልኩ የሚበላ ሥጋን በቀጥታ ይገልጻል።
- source_word: οὐ μὴ φάγω
  choice: ከቶ አልበላም
  rationale: οὐ μή የሚገልጸውን ጠንካራና ቁርጥ አሉታዊ አጽንዖት ‘ከቶ’ ያስተላልፋል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: የግሪኩን ጊዜያዊ አገላለጽ በቀጥታ ይጠብቃል፤ ከጠንካራው አሉታዊ አገላለጽ ጋር ‘ፈጽሞ ዳግመኛ’ የሚለውን ኃይል ይሰጣል።
theological_decisions:
- issue: የ‘ማሰናከል’ ትርጉም
  choice: ምስላዊውን ‘ማሰናከል’ አገላለጽ ማቆየት
  alternative: ‘ኃጢአት እንዲሠራ ማድረግ’ ወይም ‘እምነቱን ማበላሸት’ ብሎ መግለጽ
  rationale: የግሪኩ ቃል የሚኖረውን የትርጉም ስፋትና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ አንድን ብቻ የትርጓሜ አቅጣጫ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የዓረፍተ ነገሩ ቅደም ተከተል የመጨረሻውን ዓላማ—ወንድሙን አለማሰናከል—በተፈጥሯዊ አማርኛ እንዲጎላ ተደርጓል።
