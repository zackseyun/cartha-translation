review_pass:
  verdict: revise
  source_fidelity: The draft accurately distinguishes βρῶμα (“ምግብ”) from κρέα (“ሥጋ”), preserves the emphatic future denial in οὐ μὴ φάγω with “ከቶ አልበላም,” and represents εἰς τὸν αἰῶνα as “ለዘላለም.” The final purpose clause and the repeated reference to the brother are retained without narrowing σκανδαλίζω’s meaning.
  naturalness: The conditional wording “ምግብ ወንድሜን የሚያሰናክል ከሆነ” is understandable but less idiomatic than a finite conditional verb. “ምግብ ወንድሜን ቢያሰናክል” is natural modern standard Amharic and conveys the Greek εἰ-clause directly.
  terminology: “ምግብ,” “ሥጋ,” “ወንድሜ,” and “ማሰናከል” are appropriate. Retaining “ማሰናከል” properly leaves the contextual moral and spiritual implications of σκανδαλίζω open rather than importing an interpretive gloss.
  issues:
  - severity: low
    issue: Conditional construction is somewhat literal and stiff.
    rationale: Replacing the relative-clause construction with “ቢያሰናክል” improves idiomatic flow without changing the conditional sense or any theological implication.
  revised_text: ስለዚህ፣ ምግብ ወንድሜን ቢያሰናክል፣ ወንድሜን እንዳላሰናክል ለዘላለም ሥጋ ከቶ አልበላም።
