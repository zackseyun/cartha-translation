    text: ወይም፣ “ድፍረት አያገኝምን?” ግሪኩ ቃል በቃል “አይታነጽምን?” ይላል፤ ጳውሎስ በተለምዶ ስለ ማነጽ የሚጠቀምበትን ቃል እዚህ ምናልባት በምጸት ተጠቅሞበታል።
