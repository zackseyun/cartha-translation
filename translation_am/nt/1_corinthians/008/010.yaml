review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional rhetorical question, the cultic setting, and the deliberately ironic use of οἰκοδομηθήσεται. However, its wording makes the conscience itself explicitly ‘weak,’ whereas the Greek marks the observing person as weak, and its rendering of the passive ‘be built up’ is not idiomatic Amharic.
  naturalness: The conditional opening is understandable, but “ለምግብ ተቀምጠህ” is less natural than “ለመብላት ተቀምጠህ.” Quotation marks around the rhetorical question are unwarranted, and “አይገነባምን?” normally means ‘will it not be constructed?’ rather than the figurative passive intended here.
  terminology: “እውቀት,” “ጣዖት ቤተ መቅደስ,” and the terminology for food sacrificed to idols are appropriate. “አይታነጽምን?” better retains Paul’s edification metaphor in normal Amharic ecclesial/literary usage; the footnote can supply the idiomatic sense, ‘be emboldened.’
  issues:
  - severity: medium
    issue: The weak condition is attached directly to the conscience.
    rationale: ἀσθενοῦς ὄντος describes the person whose conscience is in view. Rendering it as “የዚያ ደካማ ሰው ሕሊና” preserves this distinction.
  - severity: medium
    issue: “አይገነባምን?” inadequately renders the passive figurative verb.
    rationale: In modern Amharic it ordinarily denotes a building being constructed. “አይታነጽምን?” expresses being built up/edified while preserving the Greek’s ironic metaphor.
  - severity: low
    issue: The rhetorical question is placed in quotation marks and the footnote anchor follows the final punctuation.
    rationale: The Greek contains no quoted speech. Removing quotation marks and attaching the anchor to the term it explains gives a clean sentence and clear anchor.
  - severity: low
    issue: “ለምግብ ተቀምጠህ” is awkward.
    rationale: “ለመብላት ተቀምጠህ” naturally conveys reclining/sitting at a meal without claiming a literal posture that modern Amharic would misread.
  revised_text: ምክንያቱም አንድ ሰው እውቀት ያለህን አንተን በጣዖት ቤተ መቅደስ ውስጥ ለመብላት ተቀምጠህ ቢያይ፣ የዚያ ደካማ ሰው ሕሊና ለጣዖታት የተሠዋውን ምግብ እንዲበላ አይታነጽምን?[a]
