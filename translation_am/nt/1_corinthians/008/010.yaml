  text: ምክንያቱም አንድ ሰው እውቀት ያለህን አንተን በጣዖት ቤተ መቅደስ ውስጥ ለመብላት ተቀምጠህ ቢያይ፣ የዚያ ደካማ ሰው ሕሊና ለጣዖታት የተሠዋውን ምግብ እንዲበላ አይታነጽምን?[a]
  philosophy: optimal-equivalence
  footnotes:
