  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: am
  text: ለጣዖታት የተሠዋውን ምግብ[a] በተመለከተ፣ ሁላችንም እውቀት እንዳለን እናውቃለን[b]። እውቀት ያታብያል፤ ፍቅር ግን ያንጻል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለጣዖታት የቀረበው ሥጋ” ወይም “ለጣዖታት የተሠዉ ነገሮች።”
    reason: lexical_alternative
  - marker: b
    text: “ሁላችንም እውቀት አለን” የሚለው አባባል ጳውሎስ የቆሮንቶስ ሰዎችን መፈክር እያስተጋባ የተናገረው ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: በተመለከተ
  rationale: አዲስ ርዕስ የሚያስገባውን የደብዳቤ አገላለጽ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል፤ በግሪኩ ያልተገለጸ የጊዜ ቃል አይጨምርም።
- source_word: τῶν εἰδωλοθύτων
  choice: ለጣዖታት የተሠዋውን ምግብ
  rationale: በጣዖት አምልኮ የቀረቡ ነገሮችን፣ በዚህ አውድ በተለይም ምግብን ያመለክታል፤ ትርጉሙን በሥጋ ብቻ አያጠብም።
- source_word: οἴδαμεν
  choice: እናውቃለን
  rationale: ፍጹም ቅርጽ ያለውን ግስ አሁናዊ ትርጉሙን ጠብቆ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይተረጉማል።
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: ሁላችንም እውቀት እንዳለን
  rationale: የግሪኩን አጠቃላይ አባባል ያለ ተጨማሪ ገደብ ይጠብቃል፤ የቆሮንቶስ ሰዎች መፈክር ሊሆን የሚችለውን አገላለጽ በዋናው ጽሑፍ ውስጥ በጥቅስ ምልክት በመክተት አይወስንም።
- source_word: ἡ γνῶσις
  choice: እውቀት
  rationale: ከቀደመው γνῶσιν ጋር ያለውን የቃል ትስስር ይጠብቃል።
- source_word: φυσιοῖ
  choice: ያስታብያል
  rationale: የመንፋትን ምስል ቃል በቃል መተርጎም በአማርኛ ያልተፈጥሯዊ ስለሆነ፣ የምሳሌያዊውን ትርጉም—ሰውን በትዕቢት ማበጥ—በግልጽና ተፈጥሯዊ ቃል ያቀርባል።
- source_word: ἡ δὲ ἀγάπη
  choice: ፍቅር ግን
  rationale: የንጽጽሩን ኃይል በ‘ግን’ ይጠብቃል፤ ἀγάπηንም በተለመደውና ግልጽ ቃል ‘ፍቅር’ ይተረጉማል።
- source_word: οἰκοδομεῖ
  choice: ያንጻል
  rationale: የመገንባትን ምስል በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የሚታወቀውን ‘ማነጽ’ በመጠቀም ይጠብቃል፤ ፍቅር ሌሎችን እንደሚያበረታና እንደሚገነባ ያመለክታል።
theological_decisions:
- issue: πάντες (‘ሁሉ’) ያልተገደበ አጠቃላይ አባባል ነው ወይስ ጳውሎስ የቆሮንቶስ ሰዎችን አባባል በንግግሩ ውስጥ አካትቶ እየጠቀሰ ነው?
  choice: በዋናው ጽሑፍ ‘ሁላችንም እውቀት እንዳለን’ ተብሎ ያለ ገደብና ያለ ጥቅስ ምልክት ቀርቧል።
  alternative: ‘ሁሉም እውቀት አላቸው’ ወይም ‘ሁላችንም ይህ እውቀት አለን’ ብሎ መተርጎም፣ ወይም ሐረጉን በጥቅስ ምልክት ማስገባት።
  rationale: የግሪኩ ጽሑፍ ከአባባሉ ራሱን የሚያርቅ ግልጽ ምልክት አልያዘም። ስለዚህ ትርጉሙ የንግግሩን ኃይል ለአውዱ ይተዋል፤ እርግጠኛ ያልሆነውን ትርጓሜ በዋናው ጽሑፍ አይወስንም።
