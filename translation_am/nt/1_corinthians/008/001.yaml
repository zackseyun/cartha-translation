  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽር በአጭር ሁለት ሐረጎች ተጠብቋል፤ የግርጌ ማስታወሻዎቹም ከሚያብራሩት ቃልና ሐረግ ቀጥለው ተቀምጠዋል።
