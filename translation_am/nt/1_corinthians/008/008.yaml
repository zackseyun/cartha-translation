base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: am
  text: ነገር ግን ምግብ ወደ እግዚአብሔር አያቀርበንም[a]፤ ምክንያቱም ብንበላ ብልጫ አናገኝም፣ ባንበላም አንጎድልም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእግዚአብሔር ዘንድ ተቀባይ አያደርገንም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ብንበላ የተሻልን አንሆንም፤ ባንበላም የከፋን አንሆንም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: ምግብ
  rationale: ቃሉ አንድን የተወሰነ ምግብ ወይም ሥጋ ሳይሆን በአጠቃላይ የሚበላን ነገር ያመለክታል።
- source_word: παραστήσει τῷ θεῷ
  choice: በእግዚአብሔር ፊት አያቀርበንም
  rationale: παρίστημι የሚያመለክተውን ‘ማቅረብ/በፊት ማቆም’ በቅርብ ይይዛል፤ ምግብ በእግዚአብሔር ዘንድ ያለንን አቋም እንደማያሻሽል የሚያሳየውን አውድም አይዘጋውም።
- source_word: περισσεύομεν
  choice: ብልጫ አናገኝም
  rationale: በዚህ አውድ ግሱ ቁሳዊ ብዛትን ሳይሆን ተጨማሪ ጥቅምን ወይም ብልጫን ያመለክታል።
- source_word: ὑστερούμεθα
  choice: ጉድለት አይኖርብንም
  rationale: ግሱ መጉደልን ወይም አንድ ነገር ማነስን ያመለክታል፤ ይህ አተረጓጎም περισσεύομεν ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ … γὰρ
  choice: ነገር ግን … ፤
  rationale: δὲ ከቀደመው ሐሳብ ጋር ያለውን ለስላሳ ንጽጽር ያሳያል፤ የሁለተኛው ክፍል ማብራሪያዊ ግንኙነት በአማርኛው የአረፍተ ነገር አወቃቀርና በፍጻሜ ነጥቡ ተገልጧል።
theological_decisions:
- issue: ምግብ ሰውን ‘በእግዚአብሔር ፊት ማቅረቡ’ ሥርዓታዊ ተቀባይነትን ብቻ ወይስ አጠቃላይ መንፈሳዊ ብልጫን ያመለክታል?
  choice: ምግብ በራሱ በእግዚአብሔር ፊት ብልጫ እንደማያስገኝና አለመብላትም ጉድለት እንደማያመጣ ተተርጉሟል።
  alternative: ንግግሩ ስለ ሥርዓታዊ ተቀባይነት ብቻ ወይም ስለ ሕሊናና ፍቅር አውድ ብቻ እንደሆነ በግልጽ መገደብ።
  rationale: የቅርቡ አውድ ለጣዖት የተሠዋ ምግብንና የአማኞችን ሕሊና የሚመለከት ቢሆንም፣ የጥቅሱ ቃላት መብላትም ሆነ አለመብላት በራሱ በእግዚአብሔር ፊት ብልጫ ወይም ጉድለት እንደማያመጣ ይናገራሉ። ‘አያቀርበንም’ የሚለው ከምንጩ ጋር ቅርብ ሆኖ የሥነ መለኮት ልዩነቱን አስቀድሞ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው ተመጣጣኝ ሁለትዮሽ አወቃቀር “ብንበላ … ባንበላም” በሚል ተጠብቋል።
