translation:
  language: am
  text: ምክንያቱም በሰማይ ወይም በምድር አማልክት የሚባሉ ቢኖሩ እንኳ—በእርግጥም ብዙ አማልክትና ብዙ ጌቶች አሉ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ምክንያቱም
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን ማብራሪያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ የκαί አጽንዖት ደግሞ በቅናሻዊው ‘ቢኖሩም’ እና በ‘በእርግጥም’ ተንጸባርቋል።
- source_word: εἴπερ
  choice: ቢኖሩም
  rationale: ጳውሎስ ለክርክሩ ሲል የሚቀበለውን ቅናሻዊ ሁኔታ ያሳያል፤ ይህም ቃሉን ‘በእርግጥ ስላሉ’ ብሎ በቀጥታ ከመወሰን ይቆጠባል።
- source_word: λεγόμενοι θεοὶ
  choice: “አማልክት” የሚባሉ
  rationale: λεγόμενοι መጠራትን ወይም መሰየምን ያመለክታል። ይህ አተረጓጎም ጳውሎስ ከእነዚህ አማልክትነት ራሱን ማራቁን ያሳያል፣ ነገር ግን የግሪኩን ቃል ከሚፈቅደው በላይ አይወስንም።
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: በሰማይም ሆነ በምድር
  rationale: ሁለቱን ተቃራኒ ዓለማትና የንግግሩን አጠቃላይ ወሰን በዘመናዊና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὥσπερ
  choice: በእርግጥም
  rationale: ሰዎች ብዙዎችን አማልክትና ጌቶች ብለው እንደሚቀበሉ የሚያረጋግጠውን የጎንዮሽ አስተያየት ያሳያል።
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: ብዙ አማልክትና ብዙ ጌቶች
  rationale: የብዛት ተደጋጋሚ አጽንዖትን ይጠብቃል፤ κύριοι ደግሞ በቁጥር 6 ከተጠቀሰው አንዱ ጌታ ጋር ያለውን የቃል ግንኙነት ሳያጠፋ ‘ጌቶች’ ተብሏል።
theological_decisions:
- issue: ጳውሎስ ‘አማልክት’ ከሚባሉት ያለው ርቀት
  choice: “አማልክት” የሚባሉ
  alternative: አማልክት ተብለው የሚጠሩ
  rationale: የቁጥር 4–6 አውድ ከአንዱ እውነተኛ አምላክ ውጭ ሌሎቹ በተመሳሳይ ትርጉም አማልክት መሆናቸውን አያረጋግጥም። የተመረጠው አባባል የመጠሪያንና የእውነታን ልዩነት ክፍት ያደርጋል።
- issue: κύριοι ከቁጥር 6 ካለው አንዱ ጌታ ጋር ያለው ንጽጽር
  choice: ጌቶች
  alternative: ገዢዎች
  rationale: ‘ጌቶች’ የκύριοςን የቃል ትስስር ይጠብቃል፤ የብዙ ቁጥር እና አውዱ እነዚህን በቁጥር 6 ከተገለጠው አንዱ ጌታ ይለያቸዋል።
