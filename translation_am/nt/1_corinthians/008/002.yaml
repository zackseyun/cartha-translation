  rationale: ጽሑፉ ‘ማወቅ እንደሚገባው’ በማለት የማወቅን አኳኋን ወይም መስፈርት ይተቻል፤ ዕውቀትን ሁሉ አይክድም። ትርጉሙ ይህን ውጥረት ሳይፈታ ይጠብቃል።
