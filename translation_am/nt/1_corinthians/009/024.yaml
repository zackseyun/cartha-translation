- issue: የሩጫው ምሳሌ ከክርስቲያናዊ ጽናት ጋር ያለው ግንኙነት
  choice: የውድድሩንና የሽልማቱን ምስል ሳይቀየር ማቆየት፣ ነገር ግን ስለ ድነት፣ ስለ ብቃት ወይም ስለ ዘላለማዊ ሽልማት የተወሰነ ሥርዓተ እምነት አለመጨመር
