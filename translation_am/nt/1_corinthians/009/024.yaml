  rationale: ጳውሎስ በስነ ሥርዓትና በዓላማ እንዲጋደሉ በስፖርት ምሳሌ ያበረታታል፤ ትርጉሙ ጽሑፉ ያልገለጸውን የድነት፣ የጸጋ ወይም የዋጋ ክርክር አይወስንም።
