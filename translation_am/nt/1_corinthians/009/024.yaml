  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: am
  text: በሩጫ ሜዳ[a] የሚሮጡ ሁሉም እንደሚሮጡ፣ ነገር ግን ሽልማቱን የሚቀበለው አንድ ሰው ብቻ እንደሆነ አታውቁምን? እንግዲህ ሽልማቱን እንድታገኙ እንዲህ ሩጡ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በስታዲየም»። የግሪኩ στάδιον ሩጫው የሚካሄድበትን ቦታ፣ ማለትም ስታዲየምን ወይም የሩጫ ሜዳን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ለማሸነፍ እንዲህ ሩጡ» ወይም «እንድትጨብጡት እንዲህ ሩጡ»። የግሪኩ καταλάβητε «ማግኘት፣ መጨበጥ ወይም መድረስ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: አታውቁምን?
  rationale: የግሪኩን የእውቀት ግስ እና የጳውሎስን አጽንዖታዊ ጥያቄ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν σταδίῳ
  choice: በሩጫ ሜዳ
  rationale: στάδιον የሩጫውን ቦታ ያመለክታል፤ «የሩጫ ሜዳ» ተጨባጩን የስፖርት ምስል በዘመናዊ አማርኛ ያቆያል።
- source_word: τρέχοντες ... τρέχουσιν
  choice: የሚሮጡ ... እንደሚሮጡ
  rationale: የτρέχωን ድግግሞሽ እና ሕያው የሩጫ ምሳሌ ይጠብቃል።
- source_word: πάντες μὲν ... εἷς δὲ
  choice: ሁሉ ... ነገር ግን ... አንድ ሰው ብቻ
  rationale: በሁሉም ሯጮችና ሽልማቱን በሚቀበለው አንድ ሰው መካከል ያለውን ንጽጽር ግልጽ ያደርጋል።
- source_word: λαμβάνει
  choice: የሚቀበለው
  rationale: የግሪኩን ቀጥተኛ ትርጉም ይይዛል፤ «ያሸንፋል» ብሎ ከጽሑፉ በላይ አይተረጉምም።
- source_word: τὸ βραβεῖον
  choice: ሽልማቱን
  rationale: በውድድር ለአሸናፊው የሚሰጠውን ሽልማት በአጭርና በተለመደ ቃል ይገልጻል።
- source_word: οὕτως
  choice: እንዲህ
  rationale: ከቀደመው የሩጫ ምሳሌ ጋር ያለውን አመልካች ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τρέχετε
  choice: ሩጡ
  rationale: የብዙ ቁጥር ትእዛዙን በኃይለኛና ቀጥተኛ አገላለጽ ይጠብቃል፤ የአሁን ጊዜ ቅርጹ የቀጣይ ተግባርን ሊያመለክት ይችላል።
- source_word: ἵνα καταλάβητε
  choice: ሽልማቱን እንድታገኙ
  rationale: καταλαμβάνω እዚህ «ማግኘት፣ መድረስ፣ መጨበጥ» የሚሉ ጥላዎች አሉት፤ «እንድታገኙ» ከሽልማቱ ምስል ጋር ተፈጥሯዊ ሲሆን አሻሚነቱን በማስታወሻ ይጠብቃል።
