  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: am
  text: ሕግ ለሌላቸው ሰዎች[a] ደግሞ፣ ሕግ እንደሌለው ሰው ሆንሁላቸው፤ እኔ ግን ከእግዚአብሔር ሕግ ውጭ ሳልሆን፣ በመሲሑ ሕግ ሥር ነኝ፤ ይህም ሕግ የሌላቸውን ላገኛቸው ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሕግ ለሌላቸው” ማለት እዚህ በሙሴ ሕግ ሥር ያልሆኑትን ያመለክታል፤ የግድ ሕገ ወጥ ወይም ክፉ ሰዎች ማለት አይደለም።
    reason: lexical_alternative
  - marker: b
    text: “በመሲሑ ሕግ ሥር”፤ ወይም “በመሲሑ ሕግ ውስጥ ያለ።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: ሕግ ለሌላቸው / ሕግ እንደሌለኝ / ሕግ የሌላቸውን
  rationale: በአውዱ ቃሉ በሙሴ ሕግ ሥር ያልሆኑትን ይጠቁማል፤ ‘ዓመፀኞች’ ወይም ‘ሕገ ወጦች’ ቢባል በቀዳሚነት የሥነ ምግባር ክፋትን በስህተት ሊያመለክት ይችላል። የግሪኩን ድግግሞሽ በተቻለ መጠን ጠብቋል።
- source_word: ὡς
  choice: እንደ
  rationale: ጳውሎስ ፍጹም ሕግ አልባ እንደሆነ ሳይናገር፣ ራሱን ከእነርሱ ሁኔታ ጋር እንዳስማማ ያሳያል።
- source_word: μὴ ὢν
  choice: ሳልሆን
  rationale: የተቃርኖ ወይም የማስተካከያ ኃይሉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔννομος Χριστοῦ
  choice: በመሲሑ ሕግ ሥር ሆኜ
  rationale: ἔννομος በሕግ ወሰን ውስጥ መሆንን ወይም ለሕግ መገዛትን ያመለክታል። ‘በ…ሥር’ ይህን ግንኙነት በግልጽ ዘመናዊ አማርኛ ያቀርባል፤ Χριστοῦ ደግሞ እዚህ የማዕረግ ኃይሉን ስለሚይዝ ‘የመሲሑ’ ተብሏል።
- source_word: ἵνα κερδάνω
  choice: ለማትረፍ
  rationale: የዓላማ አንቀጹን በተፈጥሯዊ አማርኛ ያቀርባል፤ κερδαίνω በዚህ የወንጌል አውድ ሰዎችን ማግኘትን እንጂ የገንዘብ ትርፍን አያመለክትም።
theological_decisions:
- issue: በዚህ አውድ የἄνομος ትርጉም
  choice: በሙሴ ሕግ ሥር ያልሆኑ ሰዎችን፣ በተለይም አሕዛብን፣ ያመለክታል።
  alternative: በአጠቃላይ ክፉ፣ ዓመፀኛ ወይም ሕገ ወጥ ሰዎች
  rationale: በ1 ቆሮንቶስ 9፥20–21 ያለው ንጽጽር በሕግ ሥር ባሉትና ሕግ በሌላቸው መካከል ነው። ጳውሎስም ከእግዚአብሔር ሕግ ውጭ እንዳልሆነ ማብራራቱ የቃሉ ትኩረት የቃል ኪዳንና የሕግ አቋም መሆኑን ያሳያል።
- issue: የἔννομος Χριστοῦ ኃይል
  choice: ጳውሎስ በመሲሑ ሕግ ሥር እንዳለ ያረጋግጣል።
  alternative: በመሲሑ ሕግ ውስጥ / ለመሲሑ ሕግ ያለው
  rationale: ሐረጉ ጳውሎስ ሕግን ሁሉ የሚክድ አለመሆኑንና በመሲሑ በኩል ለተገለጠው የእግዚአብሔር ፈቃድ ተገዢ መሆኑን ይገልጣል፤ የግሪኩ አገላለጽ ግን ‘በሕጉ ውስጥ’ የሚለውንም ቃል በቃል ሊፈቅድ ይችላል።
- issue: የΧριστοῦ አተረጓጎም
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: በዚህ ሐረግ Χριστός እንደ ማዕረግ የሚሰማ በመሆኑ ‘መሲሕ’ ተመርጧል።
