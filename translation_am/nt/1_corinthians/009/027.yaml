  source_fidelity: 'The draft preserves the principal lexical images of body, rigorous discipline, enslavement, preaching, and disqualification. However, it reverses the Greek clause order: the feared outcome clause follows the two main verbs and should not be placed before them in the translation. The rendering of the feared result is also more idiomatic and precise as “እንዳልሆን” rather than “እንዳልቀር.”'
  naturalness: The proposed revision follows a natural Amharic progression and uses clear modern standard wording. “አጥብቄ እገሥጻለሁ” communicates rigorous bodily discipline, while the footnote retains the striking imagery.
  terminology: “ሰውነቴን” correctly retains σῶμα. “ባሪያዬ አደርገዋለሁ” preserves the strong δουλαγωγῶ metaphor. “ብቁ እንዳልሆን” maintains the athletic/testing force of ἀδόκιμος without deciding the debated theological scope.
  issues:
  - severity: medium
    issue: The translation places the purpose/apprehension clause before the main verbs.
    rationale: Greek has “But I discipline my body and enslave it, lest ... after preaching ... I myself become disqualified.” The draft begins with the latter clause, which weakens the source sequence and makes the sentence less direct in Amharic.
  - severity: low
    issue: “እንዳልቀር” is less exact for γένωμαι.
    rationale: The Greek expresses becoming/proving disqualified, not merely being left behind or remaining. “እንዳልሆን” is idiomatic and closer to the stated result.
  - severity: low
    issue: The footnote wording for ὑπωπιάζω should distinguish the literal image from the main metaphor more explicitly.
    rationale: The revised note retains the literal ‘strike below the eye’ sense and identifies its metaphorical use for severe self-discipline.
