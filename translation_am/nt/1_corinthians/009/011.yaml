source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: am
  text: እኛ ለእናንተ መንፈሳዊ ነገሮችን ከዘራን፣ ከእናንተ ቁሳዊ ነገሮችን[a] ብናጭድ ትልቅ ነገር ነውን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምድራዊ ነገሮችን።” ግሪኩ “መንፈሳዊ ነገሮችን” ከተለመደው የሥጋ ወይም የቁሳዊ ኑሮ ነገሮች ጋር ያነጻጽራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: መንፈሳዊ ነገሮችን
  rationale: ገላጩ ቃል በስም ተግባር የገባ ስለሆነ፣ የመንፈሳዊ አገልግሎትንና በረከትን ሰፊ ትርጉም ሳያጠብ ያስተላልፋል።
- source_word: ἐσπείραμεν
  choice: ከዘራን
  rationale: የቀደመውን የጳውሎስና የባልደረቦቹን አገልግሎት በመዝራት ምሳሌ ይገልጣል፤ ከቀጣዩ የማጨድ ምሳሌም ጋር ይጣጣማል።
- source_word: μέγα
  choice: ከመጠን ያለፈ
  rationale: በዚህ የንግግር ጥያቄ ውስጥ ጉዳዩ ትልቅ መሆኑን ብቻ ሳይሆን የማይገባ ወይም የበዛ መሆኑን ይጠይቃል።
- source_word: τὰ σαρκικὰ
  choice: ቁሳዊ ነገሮችን
  rationale: ከመንፈሳዊ ጥቅም ጋር በተቃርኖ ለዕለታዊ ሥጋዊ ኑሮ የሚያስፈልገውን ድጋፍ ያመለክታል፤ ‘ሥጋዊ’ ብቻ ቢባል የኃጢአት ዝንባሌን በስህተት ሊያስገባ ይችላል።
- source_word: θερίσομεν
  choice: ብናጭድ
  rationale: የወደፊት ግሱን በአማርኛ ሁኔታዊ የጥያቄ አገባብ በተፈጥሯዊ ሁኔታ ያቀርባል፤ የመዝራትና የማጨድ ምሳሌውንም ይጠብቃል።
- source_word: ὑμῶν
  choice: ከእናንተ
  rationale: የሚገኘው ቁሳዊ ድጋፍ ምንጭ የቆሮንቶስ ሰዎች መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪኩ ያለውን ግልጽ እና አጽንዖታዊ ተውላጠ ስም በመጠበቅ፣ በአገልጋዮቹ ዘር መዝራትና ድጋፍ ማግኘት መካከል ያለውን ንጽጽር ያጎላል።
theological_decisions:
- issue: በτὰ πνευματικὰ እና τὰ σαρκικὰ መካከል ያለው ተቃርኖ
  choice: መንፈሳዊ አገልግሎትን ከቁሳዊ ወይም ከሥጋዊ ኑሮ ድጋፍ ጋር ያነጻጽራል።
  alternative: τὰ σαρκικὰን ኃጢአታዊ ‘ሥጋዊ ነገሮች’ ብሎ መረዳት።
  rationale: በአውዱ ጳውሎስ ሐዋርያት ለአገልግሎታቸው ቁሳዊ ድጋፍ የመቀበል መብት እንዳላቸው እየተከራከረ ነው፤ ስለዚህ ተቃርኖው በቅድስናና በኃጢአት መካከል አይደለም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። የመዝራትና የማጨድ ግብርናዊ ምሳሌ ተጠብቋል፤ የጥያቄውም የክርክር ኃይል “ከመጠን ያለፈ ነውን?” በሚለው ተፈጥሯዊ አገላለጽ ቀርቧል።
