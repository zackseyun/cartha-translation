  to: እኛ ለእናንተ መንፈሳዊ ነገሮችን ከዘራን፣ ከእናንተ ቁሳዊ ነገሮችን[a] ብናጭድ ትልቅ ነገር ነውን?
  rationale: The revision makes the first dative relation explicit as ‘for you,’ maintaining the contrast with the later genitive/source relation ‘from you.’ It also renders μέγα with the broader, more literal Amharic expression ‘a great thing,’ without changing the rhetorical force or importing an interpretive nuance. The agricultural metaphor and the material-support sense remain intact.
