review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional rhetorical question, the sowing/reaping imagery, the contrast between spiritual and material provision, and the future-oriented sense of θερίσομεν. However, ὑμῖν in the first clause is most directly ‘for you’ (dative of advantage), whereas በመካከላችሁ means ‘among you’ and slightly shifts the stated relationship.
  naturalness: The proposed revision is idiomatic, clear modern standard Amharic and retains the formal rhetorical register. “ትልቅ ነገር ነውን?” reflects the Greek μέγα without making its rhetorical implication more explicit than the source does.
  terminology: መንፈሳዊ ነገሮች and ቁሳዊ ነገሮች appropriately render τὰ πνευματικὰ and τὰ σαρκικὰ in this context. The latter properly denotes practical material support, not sinful ‘fleshly’ matters. The lexical-alternative footnote is accurately anchored and appropriately preserves ‘earthly things’ as an alternative.
  issues:
  - severity: low
    issue: The first occurrence of ὑμῖν is rendered በመካከላችሁ (‘among you’).
    rationale: Although compatible with the ministry context, it is not the most direct expression of the Greek dative, which presents the spiritual things as sown for the Corinthians. Rendering it ለእናንተ preserves this distinction, especially since ὑμῶν in the second clause is separately and correctly rendered ከእናንተ (‘from you’).
  - severity: low
    issue: “ከመጠን ያለፈ” interprets μέγα as ‘excessive.’
    rationale: That rhetorical sense is defensible and supported by the English audit trail, but “ትልቅ ነገር” more closely retains the Greek adjective’s lexical openness while allowing the question’s context to supply the implication of unreasonable excess.
  revised_text: እኛ ለእናንተ መንፈሳዊ ነገሮችን ከዘራን፣ ከእናንተ ቁሳዊ ነገሮችን[a] ብናጭድ ትልቅ ነገር ነውን?
  revised_footnotes:
