  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: am
  text: እነዚህን የምናገረው ከሰው አመለካከት ብቻ[a] ነውን? ወይስ ሕጉም እነዚህን አይናገርምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ ሰው” / “ከሰው እይታ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: ነውን?
  rationale: የግሪክኛው አሉታዊ ጥያቄ በአውዱ አሉታዊ መልስን ይጠብቃል፤ የአማርኛው አገላለጽ ይህን የንግግር ኃይል በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: κατὰ ἄνθρωπον
  choice: ከሰው አመለካከት ብቻ
  rationale: ሐረጉ ነገሩን በሰው አመለካከት ወይም መሠረት ብቻ መናገርን ያመለክታል፤ ‘ብቻ’ ከሚቀጥለው የቅዱስ ጽሑፍ ማስረጃ ጋር ያለውን ንጽጽር ያሳያል።
- source_word: ταῦτα
  choice: እነዚህን
  rationale: የግሪክኛውን ብዙ ቁጥርና ወደ ቀደመው የጳውሎስ ሐሳብ የሚያመለክተውን የንግግር ግንኙነት ይጠብቃል።
- source_word: λαλῶ
  choice: የምናገረው
  rationale: በአሁኑ ክርክሩ ውስጥ ጳውሎስ የሚናገረውን ያመለክታል፤ በአማርኛ ጥያቄውን ተፈጥሯዊ ያደርገዋል።
- source_word: ἢ
  choice: ወይስ
  rationale: በጥያቄ ውስጥ ሁለተኛውን አማራጭ በግልጽ የሚያስገባ ተፈጥሯዊ የአማርኛ አያያዥ ነው።
- source_word: καὶ
  choice: -ም
  rationale: በ‘ሕጉም’ ላይ ያለው ቅጥያ የግሪክኛውን ተጨማሪ ምስክር የማከል ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ νόμος
  choice: ሕጉ
  rationale: ቀጣዩ ቁጥር ዘዳግም 25፥4ን ስለሚጠቅስ፣ ይህ በአጠቃላይ ሕግን ሳይሆን የሙሴን ሕግ የሚያመለክት የታወቀ መጠሪያ ነው።
- source_word: οὐ λέγει
  choice: አይናገርምን?
  rationale: አዎንታዊ መልስን የሚጠብቀውን የግሪክኛ አሉታዊ የንግግር ጥያቄ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ ክርክር ውስጥ ‘ሕጉ’ የሚያመለክተው
  choice: የሙሴ ሕግ፣ ማለትም የቅዱስ ጽሑፍ የሕግ ክፍል
  alternative: በአጠቃላይ የሕግ መርሕ
  rationale: ወዲያው የሚቀጥለው 1 ቆሮንቶስ 9፥9 ከዘዳግም 25፥4 ይጠቅሳል፤ ስለዚህ ‘ሕጉ’ የተወሰነውን የቅዱስ ጽሑፍ ማጣቀሻ ይጠብቃል፣ ተጨማሪ የእምነት ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁለቱ የንግግር ጥያቄዎችና በሰው አመለካከት እና በሕጉ ምስክርነት መካከል ያለው ውጥረት ተጠብቀዋል።
