  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጻጻፍ ጥያቄ፣ የ‘መብት’ ድግግሞሽና የዓላማ አንቀጹ ተጠብቀዋል። የግሪክ ተናጋሪው ያለፈውን ድርጊት ካለው የአሁን መርሕ ጋር ያገናኛል፤ ስለዚህ ‘አልተጠቀምንበትም’ እና ‘እንታገሣለን’ ተመርጠዋል።
