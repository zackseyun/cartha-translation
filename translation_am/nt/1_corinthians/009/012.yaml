  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: am
  text: ሌሎች በእናንተ ላይ ባለው በዚህ መብት ተካፋይ ከሆኑ፣ እኛማ ይበልጥ ተካፋይ አይደለንምን? ነገር ግን ይህን መብት አልተጠቀምንበትም፤ ይልቁንም ለመሲሑ ወንጌል ምንም እንቅፋት እንዳንሰጥ ሁሉን እንታገሣለን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለመሲሑ ወንጌል”፦ በግሪኩ “ለክርስቶስ ወንጌል” በሚል መልኩ ተገልጿል፤ ትክክለኛው የቃላቱ ግንኙነት “ለመሲሑ ወንጌል” ማለት ነው። Χριστός እዚህ የ“መሲሕ” ማዕረግን ያመለክታል፤ ባህላዊው አተረጓጎም “የክርስቶስ ወንጌል” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τῆς ὑμῶν ἐξουσίας / τῇ ἐξουσίᾳ ταύτῃ
  choice: በእናንተ ላይ ያላቸውን ይህን መብት / ይህን መብት
  rationale: ἐξουσία በዚህ አውድ ሐዋርያት ከቆሮንቶስ ሰዎች ቁሳዊ ድጋፍ ለመቀበል ያላቸውን ሕጋዊ መብት ያመለክታል። ‘በእናንተ ላይ ያላቸውን’ የሚለው ὑμῶν የመብቱን ግንኙነታዊ አቅጣጫ ይጠብቃል።
- source_word: μετέχουσιν
  choice: የሚጋሩ
  rationale: በአንድ መብት ተካፋይ መሆንን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: እኛማ ይበልጥ መብት የለንምን?
  rationale: የግሪኩን አጽንዖታዊ ንጽጽርና የአጻጻፍ ጥያቄ ይጠብቃል፤ ‘እኛማ’ ለἡμεῖς የተሰጠውን አጽንዖት ያሳያል።
- source_word: ἐχρησάμεθα
  choice: አልተጠቀምንበትም
  rationale: ያለንን መብት በተግባር ላይ አለማዋልን ግልጽና ዘመናዊ በሆነ አማርኛ ይገልጻል።
- source_word: πάντα στέγομεν
  choice: ሁሉን እንታገሣለን
  rationale: στέγω እዚህ መሸፈንን ሳይሆን ችግርንና እጦትን ታግሶ መሸከምን ያመለክታል፤ πάντα ያለውን ሰፊ አጠቃላይነትም ‘ሁሉን’ ይጠብቃል።
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: ምንም እንቅፋት እንዳንፈጥር
  rationale: የዓላማውን አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ἐγκοπή መንገድን የሚዘጋ ወይም እድገትን የሚያደናቅፍ ነገር ነው።
- source_word: τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: ለመሲሑ ወንጌል
  rationale: ‘ወንጌል’ በአማርኛ የተመሠረተና የተረዳ ቃል ነው። ὁ Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ ‘መሲሑ’ የሚለው የተቀባውን ንጉሥ ትርጉም ይጠብቃል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይስ እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: τοῦ Χριστοῦ በዚህ ሐረግ የመሲሓዊውን ማዕረግ ትርጉም ይዞ ይታያል። ‘መሲሑ’ ይህን ትርጉም በግልጽ ያቆያል፤ የተለመደው ‘ክርስቶስ’ ግን እንደ ግል ስም ሊሰማ ይችላል።
- issue: የሐዋርያዊ ἐξουσία ዓይነት
  choice: መብት
  alternative: ሥልጣን / በእናንተ ላይ ያለ ጥያቄ
  rationale: አውዱ በማኅበሩ ላይ የመግዛት ሥልጣንን ሳይሆን ቁሳዊ ድጋፍ ለመቀበል ያለን ተገቢ ድርሻ ያመለክታል።
