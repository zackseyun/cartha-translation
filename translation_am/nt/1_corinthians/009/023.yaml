- from: ነገር ግን ይህን ሁሉ የማደርገው ስለ ምሥራቹ ዜና[a] ነው፤ እኔም ከሌሎች ጋር በእርሱ ተካፋይ እንድሆን[b] ነው።
  to: ነገር ግን ሁሉን ለየምሥራች ዜና[a] አደርጋለሁ፤ በእርሱ ከሌሎች ጋር ተካፋይ እንድሆን[b]።
