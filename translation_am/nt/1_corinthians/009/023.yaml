  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: am
  text: ነገር ግን ሁሉን ለየምሥራች ዜና[a] አደርጋለሁ፤ በእርሱ ከሌሎች ጋር ተካፋይ እንድሆን[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለወንጌል»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በእርሱ እካፈል ዘንድ» ወይም «በእርሱ አጋር እንድሆን»።
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ይህን ሁሉ
  rationale: The neuter plural is comprehensive and contextually refers to all the actions Paul has just described. The demonstrative makes that backward reference natural in Amharic without narrowing its breadth.
- source_word: δὲ
  choice: ነገር ግን
  rationale: This expresses the mild contextual contrast marked by δέ in clear, dignified modern Amharic.
- source_word: ποιῶ
  choice: የማደርገው
  rationale: The present form describes Paul's customary action. The cleft construction is idiomatic Amharic and connects naturally with the following reason and purpose.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: ስለ ምሥራቹ ዜና
  rationale: διά with the accusative is represented broadly as acting for the sake of the good news. ምሥራቹ ዜና is accessible to ordinary readers, while the traditional term ወንጌል is retained in a footnote.
- source_word: ἵνα
  choice: እንድሆን
  rationale: The Amharic subordinate form naturally preserves the purpose force of ἵνα.
- source_word: συγκοινωνὸς
  choice: ከሌሎች ጋር ... ተካፋይ
  rationale: This wording makes the shared force of the συν- prefix explicit while avoiding a narrower interpretation such as ministry partner.
- source_word: αὐτοῦ
  choice: በእርሱ
  rationale: The pronoun refers back to the good news. The Amharic prepositional phrase is natural with ተካፋይ and does not specify whether the participation concerns its blessings, spread, or mission.
- source_word: γένωμαι
  choice: እንድሆን
  rationale: In this context ሆነ naturally conveys entering or coming into the state of being a participant; the purpose construction also reflects the subjunctive.
theological_decisions:
- issue: የጳውሎስ በምሥራቹ ዜና መካፈል ትርጉም
  choice: «ከሌሎች ጋር በእርሱ ተካፋይ» በሚለው ሰፊ አገላለጽ ተተርጉሟል።
  alternative: በበረከቶቹ መካፈል፣ በመስፋፋቱ መካፈል፣ ወይም በወንጌል አገልግሎት አጋር መሆን።
  rationale: The Greek does not specify the precise sphere of participation. The draft therefore preserves the theological breadth rather than selecting a sacramental, mystical, benefit-centered, or ministry-only reading.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; natural and dignified. The main text uses accessible ምሥራቹ ዜና and supplies ወንጌል as the familiar ecclesial alternative. The wording avoids resolving the intended kind of participation.
