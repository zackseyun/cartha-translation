  rationale: የውትድርና አገልግሎትን ያመለክታል፤ ይህ አተረጓጎም ጦርነትን ብቻ ሳይገድብ የሙያውን ምሳሌ ይጠብቃል።
- source_word: ἰδίοις ὀψωνίοις
  choice: በራሱ ወጪ
  rationale: ὀψώνιον በተለይ የወታደር ደመወዝን ወይም ስንቅን ሊያመለክት ቢችልም፣ በዚህ ጥያቄ ውስጥ ዋናው ሐሳብ ወታደር የአገልግሎቱን ወጪ ራሱ እንደማይሸፍን ነው።
- source_word: ποτέ
  choice: ማን ...?
  rationale: የግሪኩ ‘ከቶ/መቼም’ አጽንዖት በአማርኛው የአፈ ንግግር ጥያቄ ቅርጽ በተፈጥሮ ይተላለፋል፤ ‘ከቶ’ ማከል እንደ አማራጭ ይቻላል።
- source_word: φυτεύει ἀμπελῶνα
  choice: ወይን ቦታ ተክሎ
  rationale: የወይን ተክል ቦታን የመትከል የግብርና ምስል በቀጥታና በተፈጥሮ ይገልጣል።
- source_word: τὸν καρπὸν αὐτοῦ
  choice: ከፍሬው
  rationale: καρπός በዚህ የወይን ቦታውን ምርት ያመለክታል፤ ‘ፍሬ’ ምስሉን በቀጥታ ይጠብቃል።
- source_word: ποιμαίνει ποίμνην
  choice: መንጋ ጠብቆ
  rationale: ποιμαίνω መንጋን መጠበቅና መንከባከብን ያካትታል፤ ይህ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: ከመንጋው ወተት
  rationale: የምንጭና የከፊል ተካፋይነት ሐሳቡን ይጠብቃል፤ እረኛው መንጋው ከሚሰጠው ነገር እንደሚጠቀም ያሳያል።
- source_word: ἐσθίει
  choice: ይበላ / ይጠጣ
  rationale: ግሪኩ በሁለቱም ሐረጎች ‘ይበላል’ የሚለውን ግስ ይጠቀማል፤ በአማርኛ ግን ከወተት ጋር ‘ይጠጣል’ ማለት ተፈጥሯዊ ነው።
