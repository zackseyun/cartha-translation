base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: am
  text: ማን ከቶ በገዛ ወጪው ወታደር ሆኖ ያገለግላል? ማን የወይን እርሻ ተክሎ ከፍሬው አይበላም? ወይስ ማን መንጋ ጠብቆ ከመንጋው ወተት አይጠጣም?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በገዛ ደመወዙ/ስንቁ።” የግሪኩ ቃል የወታደርን ክፍያ ወይም ስንቅ ያመለክታል፤ ሐሳቡም ወታደር የራሱን የአገልግሎት ወጪ ራሱ እንደማይሸፍን ነው።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከመንጋው ወተት የማይበላ።” በግሪክ “መብላት” የሚለው ግስ ተጠቅሟል፤ በአማርኛ ግን ከወተት ጋር “መጠጣት” ማለት ተፈጥሯዊ ነው።
    reason: lexical_alternative
lexical_decisions:
