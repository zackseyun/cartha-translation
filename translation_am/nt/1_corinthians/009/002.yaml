base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: am
  text: ለሌሎች ሐዋርያ ባልሆን እንኳ፣ ለእናንተ ግን በእርግጥ ሐዋርያ ነኝ፤ ምክንያቱም እናንተ በጌታ የሐዋርያነቴ ማኅተም[a] ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሐዋርያነቴ ማረጋገጫ» ወይም «የሐዋርያነቴ እውነተኛነት ምስክር»። ግሪኩ «ማኅተም» የሚለውን ቃል በመጠቀም እውነተኛነትን የሚያረጋግጥ ነገር የሚለውን ምስል ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: በጳውሎስ ስለ ራሱ በሚናገርበት በዚህ አውድ ቃሉ ተራ መልእክተኛን ሳይሆን የተሰጠውን ሐዋርያዊ ተልእኮና ሥልጣን ያመለክታል።
- source_word: ἀλλά γε
  choice: ግን በእርግጥ … ነኝ
  rationale: «ግን» ንፅፅሩን፣ «በእርግጥ» ደግሞ γε የሚጨምረውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋሉ።
- source_word: σφραγίς
  choice: ማኅተም
  rationale: ይህ ምስላዊ ቃል አንድን ነገር እውነተኛ መሆኑን የሚያረጋግጥ ማኅተም የሚለውን ምስል ይጠብቃል፤ በአውዱም የማረጋገጫ ኃይል አለው።
- source_word: ἀποστολή
  choice: ሐዋርያነት
  rationale: ቃሉ በዚህ ስፍራ የጳውሎስን ሐዋርያዊ አገልግሎት፣ ተልእኮና ሥልጣን ያመለክታል፤ «ሐዋርያነት» የግልና የሹመት ገጽታውን ይይዛል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን የተለመደ ሐረግ በአጭሩ ይጠብቃል፤ ትርጉሙን «በጌታ አማካይነት» ብቻ በማለት ወደ መሣሪያዊ አገባብ አይገድበውም።
- source_word: ἄλλοις
  choice: ለሌሎች
  rationale: የግሪኩን ዳቲቭ ከ«ሐዋርያ መሆን» ጋር በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ ስለ ሐዋርያነቱ የሚያቀርበው ክርክር
  choice: ጳውሎስ ሌሎች ሐዋርያነቱን ባይቀበሉም፣ የቆሮንቶስ አማኞች ራሳቸው የሐዋርያነቱ ማረጋገጫ መሆናቸውን ይናገራል።
  alternative: ጳውሎስ ሐዋርያነቱ ለቆሮንቶስ ሰዎች ብቻ የተወሰነ ነው ማለቱ ነው።
  rationale: የንግግሩ አወቃቀርና የክፍሉ አውድ የሐዋርያነቱን ወሰን ለመግለጽ ሳይሆን በተቃዋሚዎች ፊት ለመከላከል የቀረበ የአጽንዖት ክርክር መሆኑን ያሳያሉ።
- issue: «በጌታ» የሚለው ሐረግ የሚያያዝበት ክፍል
  choice: ሐረጉ በቀጥታ ከ«የሐዋርያነቴ ማኅተም» ጋር እንዲቆይ ተደርጓል፣ የቆሮንቶስ ሰዎች ማረጋገጫ መሆናቸውን በጌታ ውስጥ ያስቀምጣል።
  alternative: «በጌታ» ሐዋርያነቱ በጌታ የተሰጠ መሆኑን ብቻ ያመለክታል።
  rationale: የግሪኩ ሐረግ ትክክለኛ የትስስር ወሰኑን ፈጽሞ አይዘጋም፤ ትርጉሙም ይህን መጠነኛ አሻሚነት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ማኅተም» የግሪኩን ምስል ሲጠብቅ፣ የግርጌ ማስታወሻው በአውዱ ያለውን የማረጋገጫ ፍቺ ያብራራል። በእንግሊዝኛው የምክክር ጽሑፍ ውስጥ [a] ከ«ሌሎች» በኋላ ቢታይም፣ የማስታወሻው ይዘት σφραγίς («ማኅተም»)ን ስለሚያብራራ ምልክቱ ከ«ማኅተም» በኋላ ተቀምጧል።
