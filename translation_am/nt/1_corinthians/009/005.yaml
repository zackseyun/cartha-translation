  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: am
  text: እኛስ አማኝ ሚስትን[a] አብረን ይዘን የመጓዝ መብት የለንምን? ሌሎቹ ሐዋርያት፣ የጌታ ወንድሞችና ኬፋ እንደሚያደርጉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እኅት የሆነች ሚስትን”፤ ማለትም በእምነት እኅት የሆነች ሚስትን።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: መብት
  rationale: በዚህ አውድ ጳውሎስ ስለ ረቂቅ ሥልጣን ሳይሆን ስለ ሕጋዊና ተገቢ ሐዋርያዊ መብት ይከራከራል።
- source_word: ἀδελφὴν γυναῖκα
  choice: አማኝ ሚስትን
  rationale: ሁለቱ ተያያዥ ቃላት ‘በእምነት እኅት የሆነች ሚስትን’ የሚለውን ፍቺ ይሰጣሉ፤ ‘አማኝ ሚስት’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል፣ ቀጥተኛው አገላለጽም በማስታወሻ ተጠብቋል።
- source_word: περιάγειν
  choice: አብረን ይዘን የመጓዝ
  rationale: ቃሉ በአገልግሎት ጉዞ አንድን ሰው አብሮ ይዞ መጓዝን ያመለክታል።
- source_word: ὡς καὶ
  choice: እንደ
  rationale: የንጽጽሩን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተጨማሪነቱ ሐሳብ በዝርዝሩ ውስጥ ግልጽ ነው።
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: ሌሎቹ ሐዋርያት
  rationale: λοιποί ከተጠቀሱት በተጨማሪ ያሉትን የዚያው ቡድን አባላት ይለያል፤ ‘ሌሎቹ’ በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: የጌታ ወንድሞች
  rationale: የግሪኩን የባለቤትነት አወቃቀር ቀጥታ ይጠብቃል፣ የዝምድናቸውንም ትክክለኛ ዓይነት በትርጉም አይወስንም።
- source_word: Κηφᾶς
  choice: ኬፋ
  rationale: ግሪኩ በዚህ ስፍራ የተጠቀመውን የስሙን ቅርጽ ይጠብቃል፤ ‘ጴጥሮስ’ ተብሎ አልተተካም።
theological_decisions:
- issue: ‘የጌታ ወንድሞች’ የሚለው ሐረግ ፍቺ
  choice: ሐረጉን ቀጥታ ‘የጌታ ወንድሞች’ ብሎ መተርጎም
  alternative: የኢየሱስ ሥጋዊ ወንድሞች፣ የእንጀራ ወንድሞች፣ ወይም የቅርብ ዘመዶች
  rationale: የግሪኩ ሐረግ ራሱ የዝምድናውን ዝርዝር አይወስንም፤ ትርጉሙም የኋለኛ ዘመን ሥነ መለኮታዊ ክርክርን በድብቅ አይፈታም።
- issue: ἀδελφὴν γυναῖκα የሚለው አገላለጽ
  choice: በዋናው ጽሑፍ ‘አማኝ ሚስትን’ ብሎ መተርጎም፣ ቀጥተኛውን ቅርጽ በማስታወሻ ማስቀመጥ
  alternative: ‘እኅት የሆነች ሚስትን’ ወይም ‘እኅትን እንደ ሚስት’
  rationale: ሐረጉ በእምነት እኅት የሆነችን ሚስት በተፈጥሮ ያመለክታል። ‘አማኝ ሚስት’ በአማርኛ ግልጽ ሲሆን፣ የግሪኩ ያልተለመደ ቃል በቃል ቅርጽ በእግር ማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የአሉታዊ ጥያቄው የክርክር ኃይል ‘የለንምን?’ በሚለው ቅርጽ ተጠብቋል።
