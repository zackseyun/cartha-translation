base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: am
  text: እኔ ግን ከእነዚህ አንዱንም አልተጠቀምሁባቸውም።[a] እነዚህንም የጻፍኩት ለእኔ እንዲህ እንዲደረግልኝ አይደለም፤ መሞት ይሻለኛል እንጂ—የምመካበትን ማንም ከንቱ አያደርገውም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ዐውዱን ይበልጥ ግልጽ በማድረግ፣ “ከእነዚህ መብቶች አንዱንም።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አረፍተ ነገር “ከ… ይልቅ—” ከሚለው በኋላ ድንገት ተቋርጦ፣ “የምመካበትን ማንም ከንቱ አያደርገውም” ብሎ ይቀጥላል። ብዙ ትርጉሞች ሐሳቡን፣ “ማንም የምመካበትን ከንቱ ከሚያደርገው መሞት ይሻለኛል” ብለው ያለሰልሱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: አልተጠቀምሁበትም
  rationale: የግሱን ፍጹም ጊዜ ውጤታዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ ጳውሎስ ቀደም ሲል የጠቀሳቸውን መብቶች እስካሁን እንዳልተጠቀመባቸው ይገልጣል።
- source_word: οὐδενὶ τούτων
  choice: ከእነዚህ አንዱንም
  rationale: ቃል በቃል ያለውን ‘ከእነዚህ አንዱንም’ ይጠብቃል፤ በዐውዱ የሚያመለክተው የድጋፍ መብቶቹን ነው።
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: ለእኔ እንዲህ እንዲደረግልኝ
  rationale: ጳውሎስ የጻፈው ለራሱ እንዲህ ያለ ድጋፍ ለማግኘት እንዳልሆነ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: ከምሞት ይሻለኛል እንጂ—
  rationale: የግሪኩን ቃል ቅደም ተከተልና በἤ ‘ከ…’ ላይ የሚቋረጠውን አነጋገር ለማቆየት፣ ‘መሞት ይሻለኛል’ የሚለውን ሐሳብ በአማርኛ በታሰበ መቋረጥ ያቀርባል።
- source_word: τὸ καύχημά μου
  choice: የምመካበትን
  rationale: καύχημα የመመካትን ድርጊት ብቻ ሳይሆን መሠረቱን ወይም ምክንያቱንም ሊያመለክት ይችላል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: κενώσει
  choice: ከንቱ አያደርገውም
  rationale: ‘ባዶ ማድረግ’ የሚለውን ዘይቤያዊ ፍቺ በተፈጥሯዊ አማርኛ ‘ዋጋ ወይም ኃይል ማሳጣት’ በሚል ስሜት ያስተላልፋል።
theological_decisions:
- issue: ከἤ በኋላ ያለው ድንገተኛ የአረፍተ ነገር መቋረጥ
  choice: ‘ከምሞት ይሻለኛል እንጂ—’ በሚል ሰረዝ መቋረጡን ማቆየት
  alternative: ‘ማንም የምመካበትን ከንቱ ከሚያደርገው መሞት ይሻለኛል’ ብሎ ማለስለስ
  rationale: ምንጩ ከ‘እንጂ/ከ…’ በኋላ ይቋረጥና በአዲስ አገላለጽ ይቀጥላል። ይህን መቋረጥ ማቆየት የጳውሎስን አጽንዖትና ስሜታዊ ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩ ድንገተኛ መቋረጥ ሳይለሰልስ ተጠብቋል።
