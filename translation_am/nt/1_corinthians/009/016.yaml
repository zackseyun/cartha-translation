  to: ወንጌልን ብሰብክ የምመካበት ምክንያት የለኝም፤ ግዴታ ተጥሎብኛልና። ምክንያቱም፣ ወንጌልን ካልሰበክሁ ወዮልኝ!
  rationale: The text is revised only to avoid a potentially concessive first condition and to restore the explanatory force of the second γάρ. The core renderings and the ambiguity concerning the source of Paul’s necessity are retained. Footnotes are retained as lexical/syntactic alternatives, with the first adjusted to match the revised conditional form.
