id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: am
  text: ወንጌልን ብሰብክ የምመካበት ምክንያት የለኝም፤ ግዴታ ተጥሎብኛልና። ምክንያቱም፣ ወንጌልን ካልሰበክሁ ወዮልኝ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: ወንጌልን ብሰብክ / ወንጌልን ባልሰብክ
  rationale: ግሱ መልካም ዜናን ማወጅን ያመለክታል፤ በዚህ የጳውሎስ አውድ ያልተገለጸው ቀጥተኛ ተሳቢ ወንጌል መሆኑ ግልጽ ነው። «ወንጌልን መስበክ» በዘመናዊ አማርኛ ተፈጥሯዊና የአዋጅነቱን ኃይል የሚጠብቅ ነው።
- source_word: καύχημα
  choice: የምመካበት ምክንያት
  rationale: ቃሉ የትምክህትን ተግባር ብቻ ሳይሆን ለመመካት መሠረት የሚሆነውን ነገር ያመለክታል።
- source_word: ἀνάγκη
  choice: ግዴታ
  rationale: ከራስ ምርጫ በላይ የተጫነ አስፈላጊነትን ወይም ግዴታን ያሳያል፤ ምንጩን ግን አይወስንም።
- source_word: ἐπίκειται
  choice: ተጥሎብኛል
  rationale: በጳውሎስ ላይ የተጫነና የሚጫነውን ግዴታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὐαί
  choice: ወዮልኝ
  rationale: የከባድ መከራን ወይም የሚመጣ ጥፋትን የሚያሰማውን ክቡድና ትንቢታዊ ቃና ይጠብቃል።
- source_word: ἐὰν μή
  choice: ባልሰብክ
  rationale: የአሉታዊውን ሁኔታዊ አነጋገር «ባል…» በሚል አጭርና ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: γάρ
  choice: -ና / ግን
  rationale: የመጀመሪያው γάρ ምክንያታዊ ትስስሩን በ«-ና» ይገልጻል። ከοὐαί ጋር ያለው γάρ በአማርኛ ተፈጥሯዊ ፍሰት ውስጥ በ«ግን» ቀርቧል፤ የክርክሩን ውጤታዊ አጽንዖት ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ ወንጌልን የመስበክ ግዴታ ምንነት
  choice: «ግዴታ ተጥሎብኛል» ተብሎ ምንጩ ሳይገለጽ ቀርቧል።
  alternative: «እግዚአብሔር እንድሰብክ አዞኛል» ወይም «ውስጣዊ ግፊት አለብኝ» ብሎ መተርጎም።
  rationale: የግሪኩ ጽሑፍ ግዴታው በጳውሎስ ላይ እንዳለ ይናገራል እንጂ በዚህ ቁጥር ምንጩን በግልጽ አይወስንም። ስለዚህ ትርጉሙ መለኮታዊ ተልእኮ፣ ውስጣዊ ግፊት ወይም ሌላ ሁኔታ ብሎ አይገድበውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡድና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ወንጌልን መስበክ» በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ሲጠብቅ፣ «የምመካበት ምክንያት» የκαύχημαን መሠረታዊ ፍቺ ግልጽ ያደርጋል።
