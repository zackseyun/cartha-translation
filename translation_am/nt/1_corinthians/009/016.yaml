review_pass:
  verdict: revise
  source_fidelity: 'The principal meanings are retained: Paul has no basis for boasting when he proclaims the gospel, an imposed necessity rests on him, and failure to do so brings woe. However, «-ም» in «ብሰብክም» can sound concessive (“even though I preach”), while ἐὰν is an ordinary conditional here. More significantly, rendering the second γάρ as «ግን» introduces adversative force (“but”) where the Greek marks explanation.'
  naturalness: The draft is generally clear and idiomatic modern standard Amharic. «ግዴታ ተጥሎብኛል» and «ወዮልኝ» are natural and suitably solemn. The revised wording improves the conditional and connective flow.
  terminology: «ወንጌልን መስበክ», «የምመካበት ምክንያት», «ግዴታ», and «ወዮልኝ» appropriately represent the key Greek terms without adding doctrinal specification.
  issues:
  - severity: medium
    issue: «ብሰብክም» may be read concessively.
    rationale: The suffix «-ም» commonly gives a concessive nuance in Amharic, whereas ἐὰν γὰρ εὐαγγελίζωμαι presents a conditional premise, “for if I proclaim the gospel.” Removing it preserves the source construction more closely.
  - severity: medium
    issue: The second γάρ is rendered «ግን».
    rationale: γάρ is explanatory, not adversative. «ግን» means “but” and can imply a contrast not present in the Greek. «ምክንያቱም» naturally preserves the explanatory connection.
  revised_text: ወንጌልን ብሰብክ የምመካበት ምክንያት የለኝም፤ ግዴታ ተጥሎብኛልና። ምክንያቱም፣ ወንጌልን ካልሰበክሁ ወዮልኝ!
  revised_footnotes:
