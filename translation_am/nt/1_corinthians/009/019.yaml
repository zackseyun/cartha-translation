  revision_rationale: 'The revision resolves the ambiguous and non-idiomatic elements while preserving every substantive feature of the Greek: γάρ’s concessive contextual flow, freedom in relation to all, voluntary enslavement to all, purpose, and the comparative “more.” No footnote is needed because the wording is direct and no textual ambiguity requires explanation.'
