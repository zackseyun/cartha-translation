id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: am
  text: ከሁሉም ነፃ ብሆንም፣ ተጨማሪ ሰዎችን ላገኝ ራሴን ለሁሉም ባሪያ አደረግሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεύθερος ... ὢν
  choice: ነፃ ብሆንም
  rationale: የግሪኩን ነፃነት እና ተቃርኖ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል። γὰρ ከአውዱ ጋር ሲነበብ ምክንያታዊ ግንኙነቱ በዐረፍተ ነገሩ ፍሰት ውስጥ ተጠብቋል።
- source_word: ἐκ πάντων
  choice: ከሁሉ
  rationale: ጳውሎስ ከማንም ቁጥጥር ወይም ግዴታ ነፃ መሆኑን በአጭር መልክ ያሳያል፤ ከቀጣዩ ‘ለሁሉ’ ጋርም ያለውን የንግግር ትይዩነት ይጠብቃል።
- source_word: πᾶσιν
  choice: ለሁሉ
  rationale: ድርጊቱ የተደረገላቸውን ሰዎች ያመለክታል፤ ‘ከሁሉ … ለሁሉ’ የሚለውን የግሪኩን ትይዩ አወቃቀር ይጠብቃል።
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: ራሴን ለሁሉ ባሪያ አደረግሁ
  rationale: δουλόω የባርነትን ጠንካራ ምስል ይዟል። ‘ባሪያ’ የሚለው ቃል ‘ነፃ’ ከሚለው ጋር ያለውን ዋና ተቃርኖ ይጠብቃል፤ ራሴን የሚለውም ይህ በፈቃድ የተደረገ ራስን ማስገዛት መሆኑን ያሳያል።
- source_word: ἵνα
  choice: ዘንድ
  rationale: የዓላማ ግንኙነቱን በክቡርና ግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς πλείονας
  choice: ይበልጡን ሰዎች
  rationale: ተነጻጻሪው ቅጽ ከዚያ በፊት ከሚገኘው ቁጥር የበለጠ ሰዎችን ያመለክታል፤ ‘በተቻለ መጠን ብዙ’ የሚል ከግሪኩ የበለጠ ትርጓሜ አይጨምርም።
- source_word: κερδήσω
  choice: አገኝ
  rationale: κερδαίνω በቀጥታ ‘ማግኘት/ማትረፍ’ የሚለውን የጥቅም ምስል ይይዛል። እዚህ ሰዎችን ለወንጌል ማግኘትን ያመለክታል፤ አውዱን ሳይተረጉም ምሳሌያዊ ግልጽነቱን ይጠብቃል።
theological_decisions:
- issue: የδουλόω የባርነት ቋንቋ አተረጓጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: በዚህ ጥቅስ ‘ነፃ’ ከሚለው ጋር ያለው ተቃርኖ የጳውሎስ ነጥብ ማዕከል ነው። ‘አገልጋይ’ የተግባሩን ረገድ ቢያሳይም፣ የግሪኩን ኃይለኛ የባርነት ምስል ያለዝባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ከሁሉ … ለሁሉ’ የሚለው አወቃቀር የምንጩን ርቱዕ ትይዩነት ይጠብቃል፤ ‘ባሪያ’ የሚለውም ታሪካዊ ክብደቱን ሳያለዝብ የጳውሎስን በፈቃድ ራስን ማስገዛት ይገልጣል።
