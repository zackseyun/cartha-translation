id: 1CO.9.9
reference: 1 Corinthians 9:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: am
  text: በሙሴ ሕግ እንዲህ ተብሎ ተጽፎአልና፦ “እህል የሚወቃ በሬ አፉን አትሰር።”[a] እግዚአብሔር ስለ በሬዎች ያስባልን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እህል እየረገጠ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: በሙሴ ሕግ ... ተጽፎአልና
  rationale: ἐν የሚያመለክተውን የጽሑፉን ስፍራ በተፈጥሯዊ አማርኛ ያቀርባል፤ γάρ ደግሞ በአረፍተ ነገሩ መጨረሻ ባለው «-ና» ተገልጿል።
- source_word: γέγραπται
  choice: እንዲህ ተብሎ ተጽፎአል
  rationale: የግሪኩን ፍጹም ተገብሮ አኳኋንና የቅዱስ ጽሑፍ ጥቅስ ማስገቢያ ቀመር ይጠብቃል።
- source_word: Οὐ κημώσεις
  choice: አፉን አትሰር
  rationale: κημόω በዚህ ዐውድ እንስሳው እንዳይበላ አፉን መዝጋትን ያመለክታል፤ «አትሰር» የሕጉን ክልከላ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: βοῦν
  choice: በሬ
  rationale: በእህል ውቂያ ሥራ ላይ የዋለ የቀንድ ከብትን በትክክልና በተለመደ መንገድ ይገልጻል።
- source_word: ἀλοῶντα
  choice: እህል የሚወቃውን
  rationale: የአሁን ጊዜ አሳታፊውን ቀጣይ ድርጊት ይጠብቃል፤ ἀλοάω የእህል ውቂያን ያመለክታል።
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: ታዲያ እግዚአብሔር ስለ በሬዎች ያስባልን?
  rationale: μή አሉታዊ መልስ የሚጠብቀውን የክርክር ጥያቄ የ«-ን?» ቅርጽ ያስተላልፋል፤ μέλειን «ያስባል» ብሎ መተርጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ጥያቄውን አይፈታውም።
theological_decisions:
- issue: ጳውሎስ ስለ እግዚአብሔር ለእንስሳት ስላለው እንክብካቤ ያቀረበው የክርክር ጥያቄ
  choice: ጥያቄውን «እግዚአብሔር ስለ በሬዎች ያስባልን?» በማለት ያለ ትርጓሜያዊ ጭማሪ ማቅረብ
  alternative: «እግዚአብሔር የሚያስበው ስለ በሬዎች ብቻ ነውን?»
  rationale: «ብቻ» የሚለው ቃል በግሪኩ በግልጽ የለም። ስለዚህ የጳውሎስን የክርክር ኃይል ሳያጠፋ፣ እግዚአብሔር ለእንስሳት ያለውን እንክብካቤ ፈጽሞ ይክዳል ወይስ ንጽጽራዊ ነጥብ ያቀርባል የሚለውን ውጥረት ክፍት ያደርገዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «አፉን አትሰር» ከቴክኒካዊ ወይም ጥንታዊ ቃል ይልቅ ተፈጥሯዊ ሲሆን የምንጩን ምስል ይጠብቃል። የግሪኩ ጽሑፍ ራሱ «እህል» ባይልም ἀλοάω በአማርኛ «መውቃት» ሲባል ግልጽ እንዲሆን ተሳቢ የሚፈልግ በመሆኑ «እህል» ተጨምሯል።
