    reason: lexical_alternative
  revision_rationale: The revision resolves the ambiguous Amharic relative construction by using «እህል የሚወቃ በሬ», explicitly denoting an ox that threshes grain. It also replaces the incomplete footnote with a grammatical lexical alternative and omits the nonessential added connector before the rhetorical question. No interpretive qualification, such as «ብቻ», has been introduced.
