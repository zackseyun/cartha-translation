  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: am
  text: ወይስ ይህን በእርግጥ ለእኛ ሲል ነው የሚናገረው? አዎን፤ ለእኛ ሲል ተጽፏል፤ ምክንያቱም የሚያርሰው ተስፋ አድርጎ ማረስ ይገባዋል፤ የሚወቃውም ድርሻ የማግኘት ተስፋ አድርጎ መውቃት ይገባዋል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: በቃል በቃል፣ «ድርሻ የማግኘት ተስፋ ላይ» ይላል። ድርሻው ከምን እንደሆነ በግልጽ አይጠቅስም፤ የግብርናው ዐውድ ግን ምርቱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντως
  choice: ሙሉ በሙሉ
  rationale: በአጻጻፉ ጥያቄውን የሚያጠናክር ተውሳክ ነው፤ «ሙሉ በሙሉ» የግሪኩን አጠቃላይ አጽንዖት ይጠብቃል።
- source_word: δι’ ἡμᾶς
  choice: ስለ እኛ
  rationale: διά ከተሳቢ ጋር ምክንያትን ወይም ጥቅምን ሊገልጽ ይችላል፤ እዚህ «ስለ እኛ» የጳውሎስን ክርክር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐγράφη
  choice: የተጻፈው
  rationale: የግሪኩን የተደራጊ ያለፈ ጊዜ በተፈጥሯዊ የአማርኛ አንጻራዊ አወቃቀር ያቀርባል።
- source_word: ὀφείλει
  choice: ይገባዋል
  rationale: ግዴታንና ተገቢነትን ያለ ከመጠን ያለፈ ግዳጅ ይገልጻል።
- source_word: ἐπ’ ἐλπίδι
  choice: ተስፋ አድርጎ
  rationale: ሥራው በሚጠበቅ ውጤት ተነሳስቶ መከናወኑን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: የሚያርሰው … ማረስ
  rationale: የግሪኩን አጠቃላይ ሰው ጠቋሚ ተሳቢና የግስ ድግግሞሽ ይጠብቃል።
- source_word: ὁ ἀλοῶν
  choice: የሚወቃው
  rationale: እህልን ከገለባ የሚለየውን የግብርና ሥራ በተለመደው አማርኛ ይገልጻል።
- source_word: τοῦ μετέχειν
  choice: ድርሻ የማግኘት
  rationale: μετέχω የሚያመለክተውን ተካፋይነት ይገልጻል፤ በግሪኩ ያልተገለጸውን ነገር ማለትም «ምርት» በዋናው ጽሑፍ ውስጥ አይጨምርም።
theological_decisions:
- issue: የμετέχειν ያልተገለጸ ተሳቢ
  choice: «ድርሻ የማግኘት» ተብሎ ተተርጉሟል፤ የድርሻው ነገር በዋናው ጽሑፍ አልተጨመረም።
  alternative: «ከምርቱ ድርሻ የማግኘት»
  rationale: የግብርናው ዐውድ ምርትን ቢያመለክትም ግሪኩ ተሳቢውን በግልጽ አይጠራም፤ ይህ አተረጓጎም ያንን ክፍትነት ይጠብቃል።
- issue: πάντως በአጻጻፉ ጥያቄ ውስጥ
  choice: በጥያቄው «ሙሉ በሙሉ»፣ ከዚያም አጽንዖቱን ለማሳየት «አዎን»
  alternative: «በእርግጥ» ወይም «ፈጽሞ»
  rationale: ተውሳኩ አጠቃላይነትን ወይም እርግጠኝነትን ሊያጎላ ይችላል፤ የግሪኩ አጽንዖት በጽሑፉና በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የማረስና የመውቃት ትይዩ አወቃቀር እንዲሁም የ«ተስፋ» ድግግሞሽ ተጠብቋል።
