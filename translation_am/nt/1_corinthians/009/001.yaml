reference: 1 Corinthians 9:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: am
  text: ነጻ አይደለሁምን? ሐዋርያ አይደለሁምን? ኢየሱስን፣ ጌታችንን አላየሁምን?[a] እናንተስ በጌታ የእኔ ሥራ አይደላችሁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታችን ኢየሱስን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: ነጻ
  rationale: የጳውሎስን ነጻነትና መብት በቀጥታ ያሳያል፤ ከቀደመው የነጻነት ውይይትም ጋር ይገናኛል።
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: እዚህ ቃሉ ተራ መልእክተኛን ሳይሆን የጳውሎስን የሐዋርያነት ሥልጣንና አገልግሎት ያመለክታል።
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: ጌታችን ኢየሱስን
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ የሆነውን የስምና የማዕረግ ቅደም ተከተል ይጠቀማል፤ የκύριοςን ክርስቶሳዊ ማዕረግ ‘ጌታ’ ብሎ ይጠብቃል።
- source_word: ἑόρακα
  choice: አላየሁምን?
  rationale: የግሪኩ ፍጹም ጊዜ የሚያመለክተውን ያለፈ ማየትና የቀጠለ አስፈላጊነቱን በአማርኛ ተፈጥሯዊ የአሉታዊ ጥያቄ ቅርጽ ያቀርባል።
- source_word: ἔργον
  choice: የሥራዬ ፍሬ
  rationale: ቆሮንቶሳውያን በጳውሎስ ሐዋርያዊ ድካም የተገኙ ውጤት መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን የተለመደ ሐረግ በአጭርና ግልጽ መልኩ ይጠብቃል፤ ሥራው በጌታ ውስጥ ያለውን መሠረትና ግንኙነት ያመለክታል።
- source_word: οὐκ / οὐχὶ / οὐ
  choice: አይደለሁምን? / አላየሁምን? / አይደላችሁምን?
  rationale: አዎንታዊ መልስ የሚጠብቁትን ተከታታይ አሉታዊ የንግግር ጥያቄዎች በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ ኢየሱስን እንዳየ የሚናገረው አባባል ኃይል
  choice: ኢየሱስን ማየቱ ለሐዋርያነቱ ማስረጃ ሆኖ እንዲታይ፣ ነገር ግን ‘ከሞት የተነሣውን’ የሚል ቃል ሳይጨመር
  alternative: ኢየሱስን በአጠቃላይ ማየቱን ብቻ የሚገልጽ ንባብ
  rationale: ዐውደ ንባቡ ይህን ማየት ከሐዋርያነቱ ጋር ያያይዘዋል፤ የግሪኩ ጽሑፍ ግን ‘ከሞት የተነሣ’ ብሎ በግልጽ ስለማይናገር ይህ ትርጓሜ ወደ ዋናው ጽሑፍ አልገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አራቱ ተከታታይ የንግግር ጥያቄዎችና የጳውሎስ አጽንዖት ተጠብቀዋል።
