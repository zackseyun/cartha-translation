  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አወቃቀር እንደ አንድ የአጽንዖት ጥያቄ ተጠብቋል፤ ትርጉማዊ ግልጽነትና የምንጩ አገላለጽ ሚዛናዊ እንዲሆኑ የቃል በቃል አማራጮች በማስታወሻዎች ቀርበዋል።
