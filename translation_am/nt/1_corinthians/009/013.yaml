base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: am
  text: በቤተ መቅደስ አገልግሎት የሚሠሩ ከቤተ መቅደሱ የሚገኝ ምግብ እንደሚበሉ፣[a] በመሠዊያው የሚያገለግሉም ከመሠዊያው ላይ ከሚቀርቡት መሥዋዕቶች ድርሻ እንደሚያገኙ አታውቁምን?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በቅዱሳት ነገሮች የሚሠሩ ከቤተ መቅደሱ የሚወጡትን ነገሮች ይበላሉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመሠዊያው አጠገብ የሚያገለግሉ ከመሠዊያው ጋር ይካፈላሉ”፤ ይህም በዚያ ከሚቀርቡት መሥዋዕቶች ድርሻ ያገኛሉ ማለት ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: አታውቁምን?
  rationale: የጳውሎስን የተለመደ የአጽንዖት ጥያቄ በተፈጥሯዊና ክቡር አማርኛ ይጠብቃል።
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: በቤተ መቅደስ የተቀደሱትን አገልግሎቶች የሚያከናውኑ
  rationale: τὰ ἱερά የሚለውን ‘ቅዱሳት ነገሮች’ ብሎ በድፍን ከመተርጎም ይልቅ የቤተ መቅደስ ቅዱስ አገልግሎትን የሚያመለክተውን ዐውደ ንባብ በግልጽ አማርኛ ያቀርባል፤ ቃል በቃል አማራጩ በማስታወሻ [a] ተጠብቋል።
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: ከቤተ መቅደሱ የሚገኘውን ይበላሉ
  rationale: የመብላትን የምንጩን ምስል ጠብቆ፣ አገልጋዮቹ ምግባቸውን ከቤተ መቅደሱ እንደሚያገኙ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἱεροῦ
  choice: ቤተ መቅደስ
  rationale: በዚህ ዐውደ ንባብ ἱερόν የቤተ መቅደሱን ስፍራና ተቋም ያመለክታል፤ ‘ቤተ መቅደስ’ ግልጽና የተለመደ አቻ ነው።
- source_word: οἱ τῷ θυσιαστηρίῳ παρεδρεύοντες
  choice: በመሠዊያው የሚያገለግሉ
  rationale: παρεδρεύοντες በመሠዊያው አጠገብ ተመድቦ መገኘትንና ማገልገልን ያመለክታል፤ ይህ አተረጓጎም የአገልግሎቱን ኃሳብ በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: θυσιαστηρίῳ
  choice: መሠዊያ
  rationale: የመሥዋዕት መሠዊያን የሚያመለክት መደበኛና ትክክለኛ አማርኛ ቃል ነው።
- source_word: συμμερίζονται
  choice: ከመሠዊያው ድርሻ ይቀበላሉ
  rationale: ግሱ አብሮ መካፈልን ወይም ድርሻ ማግኘትን ያመለክታል። ‘ከመሠዊያው ድርሻ ይቀበላሉ’ የመሥዋዕቱን ክፍል የመቀበል ኃሳብ ግልጽ ያደርጋል፤ የግሪኩ ቀጥተኛ አገላለጽ በማስታወሻ [b] ተጠብቋል።
theological_decisions:
- issue: የቤተ መቅደስ ምስልና ከቅዱስ አገልግሎት የሚገኝ ድጋፍ
  choice: ጥቅሱ በቤተ መቅደስና በመሠዊያ የሚያገለግሉት ከዚያው ምግብና ድርሻ እንደሚያገኙ ያሳያል።
  alternative: የመጨረሻውን ሐረግ ‘ከመሠዊያው ጋር ይካፈላሉ’ ብሎ በይበልጥ ቃል በቃል መተርጎም።
  rationale: የጳውሎስ ንጽጽር በቅዱስ አገልግሎት የተሰማሩ ሰዎች ከዚያ አገልግሎት ስንቅ እንደሚያገኙ በሚገልጸው መርሕ ላይ የተመሠረተ ነው። ትርጉሙ ይህን የአምልኮና የቁሳዊ ድጋፍ ግንኙነት ይጠብቃል፤ ከጥቅሱ በኋላ የተፈጠሩ የቤተ ክርስቲያን መዋቅሮችን ወደ ጽሑፉ አያስገባም።
