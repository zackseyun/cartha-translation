  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: am
  text: ታዲያ ሽልማቴ ምንድን ነው? መልካሙን ዜና[a] ስሰብክ ያለ ክፍያ እንዳቀርበው፣ በመልካሙ ዜና ላይ ያለኝን መብት ሙሉ በሙሉ እንዳልጠቀምበት ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በዚህ ቁጥር ሁሉ «ወንጌል»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በወንጌል አገልግሎት ያለኝን መብት ሙሉ በሙሉ እንዳልጠቀምበት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: ሽልማቴ
  rationale: በዚህ አውድ ቃሉ ቀጥተኛ ደመወዝን ብቻ ሳይሆን ጳውሎስ ከአገልግሎቱ የሚያገኘውን ዋጋ ወይም ሽልማት ያመለክታል።
- source_word: εὐαγγελιζόμενος
  choice: የምሥራቹን ቃል ስሰብክ
  rationale: ተሳቢው ድርጊት ከዋናው ድርጊት ጋር በአንድ ጊዜ መከናወኑን ያሳያል፤ ይህም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀδάπανον
