  rationale: ጳውሎስ የገንዘብ ድጋፍ ሳይጠይቅ መልእክቱን እንደሚያቀርብ በግልጽ ያሳያል።
- source_word: θήσω τὸ εὐαγγέλιον
  choice: ያለ ክፍያ ማቅረቤ
  rationale: ቃል በቃል ‘ማኖር/ማስቀመጥ’ ቢሆንም፣ በአውዱ የምሥራቹን ቃል ለሰዎች ማቅረብን ያመለክታል።
- source_word: εὐαγγέλιον
  choice: የምሥራቹ ቃል
  rationale: ‘መልካም ዜና’ የሚለውን መሠረታዊ ፍቺ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል፤ ‘ወንጌል’ የሚለው ባህላዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: καταχρήσασθαι
  choice: ሙሉ በሙሉ አለመጠቀሜ
  rationale: ግሱ መብቱን እስከ ሙሉ መጠን መጠቀምን ሊያመለክት ይችላል፤ ትርጉሙ መብቱን አላግባብ እንደተጠቀመ አያስመስልም።
- source_word: ἐξουσίᾳ
  choice: መብት
  rationale: በ1 ቆሮንቶስ 9 አውድ ጳውሎስ ስለ ቁሳዊ ድጋፍ ያለውን ሕጋዊ መብት ይናገራል።
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: በምሥራቹ ሥራ
  rationale: ሐረጉ ከምሥራቹ ስብከትና አገልግሎት ጋር ያለውን ግንኙነት ያመለክታል፤ ‘ሥራ’ በአማርኛ ይህን ግንኙነት በተፈጥሮ ይገልጻል።
theological_decisions:
- issue: በአውዱ የጳውሎስ ἐξουσία ምንነት
  choice: በምሥራቹ አገልግሎት ቁሳዊ ድጋፍ የማግኘት ትክክለኛ መብቱን ያመለክታል፤ ጳውሎስ ይህን መብት ሙሉ በሙሉ ላለመጠቀም በፈቃዱ መርጧል።
  alternative: በአጠቃላይ ሐዋርያዊ ሥልጣንን ያመለክታል፣ ወይም ሥልጣንን አላግባብ መጠቀምን ይጠቁማል።
  rationale: በምዕራፉ ዙሪያ ያለው ክርክር ሐዋርያው ቁሳዊ ድጋፍ የማግኘት መብት ላይ ያተኩራል፤ ስለዚህ ‘መብት’ እና ‘ሙሉ በሙሉ አለመጠቀም’ የሚሉት አገላለጾች አላግባብ መጠቀምን ሳያስገቡ አውዱን ይጠብቃሉ።
- issue: εὐαγγέλιον የሚለው ቃል
  choice: የምሥራቹ ቃል
  alternative: ወንጌል
  rationale: ዋናውን ‘መልካም ዜና’ የሚል ፍቺ በቀላል ዘመናዊ አማርኛ ያቀርባል፤ የተለመደው ‘ወንጌል’ በግርጌ ማስታወሻ ተጠብቋል።
