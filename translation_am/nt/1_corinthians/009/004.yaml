lexical_decisions:
- source_word: μὴ οὐκ
  choice: የለንምን?
  rationale: ሁለቱ አሉታዊ ቃላት አዎንታዊ መልስ የሚጠብቅ የንግግር ጥያቄ ይፈጥራሉ፤ «የለንምን?» ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔχομεν
  choice: የለንምን?
  rationale: የግሪኩ «አለን» ከአሉታዊ ጥያቄው ጋር በአማርኛ «የለንምን?» ተብሎ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: ἐξουσίαν
  choice: መብት
  rationale: በዚህ አውድ ቃሉ ጥሬ ኃይልን ወይም የአስተዳደር ሥልጣንን ሳይሆን ሕጋዊ ወይም ተገቢ የሆነ ነጻነትንና የመጠየቅ መብትን ያመለክታል።
- source_word: φαγεῖν καὶ πεῖν
  choice: የመብላትና የመጠጣት
  rationale: ሁለቱ ግሶች ከ«መብት» ጋር በተፈጥሯዊ የአማርኛ ስም-አገባብ ተተርጉመዋል፤ «እና» ወደ «-ና» ተዋሕዷል።
theological_decisions:
- issue: በአውዱ ውስጥ የሐዋርያዊው መብት ወሰን
  choice: ጳውሎስ እርሱና ሌሎች ሐዋርያት ምግብና መጠጥ የማግኘት፣ በአውዱም ከሚያገለግሏቸው ሰዎች ቁሳዊ ድጋፍ የመቀበል ተገቢ መብት እንዳላቸው ይጠይቃል።
  alternative: ይህ ስለ ማንኛውም ሰው ተራ የመብላትና የመጠጣት ነጻነት የተነገረ አጠቃላይ ንግግር ነው።
  rationale: የ1 ቆሮንቶስ 9 ቅርብ አውድ ስለ ጳውሎስ ሐዋርያነትና ከእርሱ ጋር ስለተያያዙ መብቶች፣ በተለይም ስለ ቁሳዊ ድጋፍ ይናገራል። ሆኖም «ድጋፍ» የሚለው ማብራሪያ በዋናው ጽሑፍ ላይ አልተጨመረም፤ የግሪኩ አጭርነትና የትርጉም ስፋት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ጥቅም ላይ ውሏል። አዎንታዊ መልስ የሚጠብቀው የንግግር ጥያቄ «የለንምን?» በሚለው ቅርጽ ተጠብቋል።
