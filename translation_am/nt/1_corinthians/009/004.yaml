  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመብላትና የመጠጣት ሥልጣን።» እዚህ «መብት» የሚለው ቃል ተገቢ የሆነን የመጠየቅ መብት ወይም ነጻነት ያመለክታል፤ በጳውሎስ ክርክር አውድም ቁሳዊ ድጋፍ መቀበልን የሚያመለክት ይመስላል።
