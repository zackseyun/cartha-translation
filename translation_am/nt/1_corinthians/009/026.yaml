  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: am
  text: ስለዚህ እኔ እንዲህ እሮጣለሁ፤ ያለ ግልጽ ዓላማ[a] አይደለም። እንዲሁም በቡጢ እዋጋለሁ፤ አየርን እንደምመታ አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለ እርግጠኝነት።” የግሪኩ ተውሳከ ግስ ግልጽነት ወይም የተወሰነ ዓላማ አለመኖርን ሊያመለክት ይችላል፤ በሩጫው ምሳሌ ውስጥ “ያለ ግልጽ ዓላማ” ግልጽ መድረሻ ሳይኖር መሮጥን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: ስለዚህ
  rationale: ከቀደመው የአትሌቲክስ ምሳሌ በመነሳት ጳውሎስ ወደ ራሱ አሠራር የሚያደርገውን ድምዳሜያዊ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὕτως
  choice: የምሮጠው… / የምዋጋውም…
  rationale: በግሪኩ ሁለት ጊዜ የተደገመው የአድራጎት አኳኋን፣ በአማርኛ በተመጣጣኝ ትይዩ አወቃቀር ተገልጧል፤ ቀጥተኛው ‘እንዲህ’ እዚህ ከሚኖረው ተፈጥሯዊነት ያነሰ ነው።
- source_word: τρέχω
  choice: የምሮጠው
  rationale: የሩጫውን ምሳሌና የአሁን ጊዜውን ልማዳዊ፣ ሕያው ራስ-ገለጻ ይጠብቃል።
- source_word: ἀδήλως
  choice: ያለ ግብ
  rationale: በሩጫ ምሳሌው ውስጥ ያለ ግልጽ መድረሻ ወይም ዓላማ መሮጥን በተፈጥሯዊ አማርኛ ያሳያል፤ የ‘በማያረጋግጥ ሁኔታ’ ትርጉም ዕድል በማስታወሻው ተጠብቋል።
- source_word: πυκτεύω
  choice: በቡጢ የምዋጋው
  rationale: ቃሉ በተለይ የቡጢ ውጊያን ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀέρα δέρων
  choice: አየርን እንደሚመታ ሰው
  rationale: ዒላማውን የማይነካ ከንቱ ምት የሚያሳየውን ቀጥተኛ ምስል ይጠብቃል።
