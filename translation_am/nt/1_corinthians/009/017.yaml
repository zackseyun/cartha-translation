reference: 1 Corinthians 9:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: am
  text: ይህን በፈቃዴ ባደርግ፣ ሽልማት አለኝ፤ ያለፈቃዴ ባደርግ ግን፣ አደራ ተሰጥቶኛል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አንድ የአገልግሎት ኃላፊነት በአደራ ተሰጥቶኛል።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκὼν
  choice: በፈቃዴ
  rationale: ቃሉ አንድን ነገር በገዛ ፈቃድ ማድረግን ያመለክታል፤ ከἄκων ጋር ያለውን ቀጥተኛ ተቃርኖም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοῦτο πράσσω
  choice: ይህን ... ባደርገው
  rationale: በአውዱ የተጠቀሰውን የወንጌል አገልግሎት ሳይጨምር ወይም ሳያጠብ በሰፊና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: μισθὸν
  choice: ዋጋ
  rationale: μισθός ደመወዝንም ሽልማትንም ሊያመለክት ይችላል፤ «ዋጋ» በዚህ አውድ የሚገኘውን ብድራት ያሳያል፣ ተራ ደመወዝ ብቻ እንደሆነም አይገድበውም።
- source_word: ἄκων
  choice: ያለፈቃዴ
  rationale: የἑκών ቀጥተኛ ተቃራኒ ሲሆን፣ ከጽሑፉ በላይ የሆነ የስሜት ጫና ሳይጨምር «ያለፈቃዴ» ይህን ተቃርኖ ይጠብቃል።
- source_word: οἰκονομίαν
  choice: አደራ
  rationale: ቃሉ በአደራ የተሰጠ የአስተዳደር ኃላፊነትን ያመለክታል። «አደራ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የታመነ ኃላፊነት የሚለውን ዋና ሐሳብ ይይዛል።
- source_word: πεπίστευμαι
  choice: ተሰጥቶኛል
  rationale: የግሡን ፍጹም ተደራጊ ቅርጽና ቀጣይ ውጤት ያሳያል፤ አደራው ከሌላ አካል እንደተሰጠውና አሁንም በእርሱ ላይ እንዳለ ይገልጻል።
theological_decisions:
- issue: በሁለተኛው ንዑስ ሐረግ የጳውሎስ አገልግሎት ባሕርይ
  choice: ጳውሎስ ያለፈቃዱ ቢያደርገውም እንኳ በአደራ የተሰጠው ኃላፊነት እንዳለበት ይናገራል።
  alternative: ያለፈቃዱ ቢያገለግል ሽልማት ሳይሆን ግዴታ ብቻ እንዳለበት ነው፤ ወይም መለኮታዊ ጥሪውን ሳይክድ በፈቃድ የሚደረግን አገልግሎት ከግዴታዊ ኃላፊነት ይለያል።
  rationale: ግሪኩ μισθὸν ἔχωን ከοἰκονομίαν πεπίστευμαι ጋር ያነጻጽራል። ትርጉሙ በፈቃድ ማገልገልና የተጣለ ግዴታ መካከል ያለውን ውጥረት ሳይፈታ ይጠብቃል፣ ለአንድ የቤተ እምነት አስተምህሮም አያደላም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በፈቃዴ/ያለፈቃዴ» የሚለው ትይዩ አገላለጽ የግሪኩን ተቃርኖ ጠብቋል፤ «አደራ ተሰጥቶኛል» ደግሞ ከአማርኛ አጠቃቀም ጋር ተፈጥሯዊ ሆኖ የኃላፊነት ምሳሌውን ያስቀራል።
