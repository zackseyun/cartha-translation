base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: am
  text: የሚወዳደር ሁሉ በሁሉም ነገር ራሱን ይገዛል። እነርሱ ይህን የሚያደርጉት የሚጠፋ አክሊል[a] ለማግኘት ነው፤ እኛ ግን የማይጠፋ አክሊል ለማግኘት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የድል ጉንጉን”፤ የግሪኩ ቃል በአትሌቲክስ ውድድር ለአሸናፊው የሚሰጠውን ከቅጠል ወይም ከአበባ የተሠራ አክሊል ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: የሚወዳደር ሁሉ
  rationale: በዐውደ ንባቡ ያለውን የአትሌቲክስ ውድድር ምሳሌ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ πᾶς የእያንዳንዱን ተወዳዳሪ አጠቃላይ ወካይነት ያሳያል።
- source_word: πάντα ἐγκρατεύεται
  choice: በሁሉም ነገር ራሱን ይገዛል
  rationale: πάντα የቁጥጥሩን ስፋት ያሳያል፤ ራሱን ይገዛል ደግሞ ἐγκρατεύεται የሚያመለክተውን ቀጣይና ተግባራዊ ራስን መቆጣጠር በተለመደ አማርኛ ይገልጣል።
- source_word: ἐκεῖνοι μὲν οὖν ἵνα ... λάβωσιν
  choice: እነርሱ ይህን የሚያደርጉት ... ለማግኘት ነው
  rationale: ἐκεῖνοι ወደ ተወዳዳሪዎቹ ይመለሳል፤ ἵνα የዓላማ ግንኙነትን ስለሚያሳይ ለማግኘት ተብሎ ተተርጉሟል።
- source_word: φθαρτὸν στέφανον
  choice: የሚጠፋ አክሊል
  rationale: φθαρτός ጊዜያዊና የሚበላሽ መሆንን ያመለክታል፤ አክሊል ደግሞ የድል ሽልማቱንና የክብር ምሳሌውን ይጠብቃል። የውድድሩ የአበባ ወይም የቅጠል አክሊል መሆኑ በማስታወሻ ተብራርቷል።
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: እኛ ግን የማይጠፋውን ለማግኘት ነው
  rationale: የግሪኩን ተቃርኖ ይጠብቃል፤ በሁለተኛው ሐረግ የተዘለለውን አክሊል የሚለውን ስም በተውላጠ ቅርጽ የማይጠፋውን ብሎ ያስተላልፋል።
theological_decisions:
- issue: የሽልማቱ ምሳሌያዊ ትርጉም
  choice: የአትሌቲክስ የድል አክሊል ምስልን ሳይገድብ መጠበቅ
  alternative: አክሊሉን በግልጽ እንደ ዘላለማዊ ሕይወት ወይም እንደ ሰማያዊ ሽልማት መተርጎም
  rationale: ጥቅሱ የሽልማቱን ሥነ መለኮታዊ ማንነት በትክክል አይገልጽም፤ ጊዜያዊውንና የማይጠፋውን ሽልማት ብቻ ያነጻጽራል። ስለዚህ ጽሑፉ ያልወሰነውን በአንድ የእምነት ሥርዓት አልተወሰነም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ δέ ተቃርኖ በ«ግን» ተጠብቋል፤ በመጀመሪያው ሐረግ ያለው δέ በአማርኛ በግድ መግለጽ ስለማያስፈልግ ተፈጥሯዊነትን ለመጠበቅ በተለየ ቃል አልተተረጎመም።
