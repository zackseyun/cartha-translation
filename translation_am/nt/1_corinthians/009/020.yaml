  rationale: ይህ ቁጥር ጳውሎስ በሕግ ሥር እንዳልሆነ ብቻ ይናገራል። ከቀጣዩ ቁጥር ማብራሪያ ሳይጨመር ንግግሩ ቀጥተኛ ሆኖ ተተርጉሟል፤ በዚህም የጽሑፉ ሥነ መለኮታዊ ውጥረት አልተወገደም።
