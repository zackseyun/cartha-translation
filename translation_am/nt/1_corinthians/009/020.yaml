base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: am
  text: ለአይሁድ እንደ አይሁዳዊ ሆንሁ፥ አይሁድን እንዳተርፍ[a]፤ በሕግ ሥር ላሉትም በሕግ ሥር እንዳለ ሰው ሆንሁ—እኔ ራሴ በሕግ ሥር ባልሆንም—በሕግ ሥር ያሉትን እንዳተርፍ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንዳተርፍ” የሚለው ግስ “ላገኝ” ወይም “ላሸንፍ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
