  text: ነገር ግን ለእያንዳንዱ ለጋራ ጥቅም[a] የመንፈስ መገለጥ ይሰጠዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጠቃሚ ለሆነው” ወይም “ለሁሉም ጥቅም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: ለእያንዳንዱ
  rationale: የግሪኩን ለእያንዳንዱ ግለሰብ የመከፋፈል ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ንጽጽር ወይም ሽግግር ያሳያል።
- source_word: δίδοται
  choice: ይሰጠዋል
  rationale: የግሪኩን የአሁን ጊዜ ተደራጊ ቅርጽና የስጦታነት ገጽታ ይጠብቃል።
- source_word: φανέρωσις
  choice: መገለጥ
  rationale: የመንፈስ ሥራ የሚታይ ወይም የሚታወቅ መሆኑን በግልጽና ወቅታዊ አማርኛ ይገልጻል።
- source_word: τοῦ πνεύματος
  choice: የመንፈስ
  rationale: በአውዱ የሚገኘውን የቅዱስ መንፈስ ማጣቀሻ ሲጠብቅ፣ በግሪኩ ያልተጨመረውን ‘ቅዱስ’ አይጨምርም።
- source_word: πρὸς τὸ συμφέρον
  choice: ለጋራ ጥቅም
  rationale: ቃሉ በጥሬው ጠቃሚ የሆነውን ሊያመለክት ቢችልም፣ በምዕራፉ የአካልና የእርስ በርስ ጥቅም አውድ ውስጥ ያለውን የጋራ አቅጣጫ ይገልጻል።
theological_decisions:
- issue: ‘መንፈስ’ የሚለው ማንን እንደሚያመለክት
  choice: ቃሉ ቅዱስ መንፈስን ያመለክታል፤ ትርጉሙ ግን ‘መንፈስ’ ብቻ ይላል።
  alternative: ‘ቅዱስ መንፈስ’ ብሎ በግልጽ መጨመር፣ ወይም አጠቃላይ መንፈስ አድርጎ መረዳት
  rationale: ቁጥር 4 እና 8–11 ተመሳሳዩን አንድ መንፈስ የስጦታዎቹ ምንጭ አድርገው ይገልጻሉ። ሆኖም የዚህ ቁጥር ግሪክ ‘ቅዱስ’ የሚለውን ስላልጨመረ፣ ትርጉሙም አያክለውም።
- issue: συμφέρον የሚያመለክተው የጥቅም ወሰን
  choice: ለጋራ ጥቅም
  alternative: ጠቃሚ ለሆነው፤ ለሁሉም ጥቅም
  rationale: የግሪኩ ሐረግ በአጠቃላይ ‘ጠቃሚ ለሆነው’ ሊተረጎም ይችላል፤ የምዕራፉ የአንድ አካልና የእርስ በርስ ግንባታ አውድ ግን የጋራ ጥቅምን ያጎላል። የአገላለጹ ሰፊ አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘መገለጥ’ የቤተ ክርስቲያን አጠቃቀምን ሳያጠብ፣ φανέρωσις የሚያመለክተውን የሚታይ መግለጫ በቀጥታ ያስተላልፋል።
