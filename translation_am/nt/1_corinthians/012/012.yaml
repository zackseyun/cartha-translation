base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: am
  text: ምክንያቱም፣ ልክ ሰውነት አንድ ሆኖ ብዙ ክፍሎች እንዳሉት፣ የሰውነት ክፍሎችም ሁሉ ብዙ ቢሆኑም አንድ ሰውነት እንደሆኑ፣ መሲሑም[a][b] እንዲሁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός “የተቀባው” የሚል ማዕረግ ስለሆነ፣ እዚህ “መሲሑ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: b
    text: የግሪኩ አገላለጽ ቃል በቃል “መሲሑም እንዲሁ” ይላል። ይህን አጭር አገላለጽ ተከታዮቹ ቁጥሮች ብዙ ክፍሎች አንድ ሰውነት ስለመሆናቸው በመናገር ያብራራሉ።
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: ምክንያቱም ልክ … እንደ
  rationale: “ምክንያቱም” የγάρን ምክንያታዊ ትስስር፣ “ልክ … እንደ” ደግሞ የκαθάπερን ጠንካራ ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋሉ።
- source_word: σῶμα
  choice: ሰውነት
  rationale: የጳውሎስን የሰውነት ምሳሌ በግልጽና በተለመደ አማርኛ የሚያቀርብ ቃል ነው።
- source_word: ἕν
  choice: አንድ
  rationale: የቁጥር አንድነትንም ሆነ በብዙነት ውስጥ ያለውን ኅብረት ይጠብቃል።
- source_word: μέλη
  choice: ክፍሎች
  rationale: በዚህ የሰውነት ምሳሌ ውስጥ μέλη የሰውነትን የተለያዩ ክፍሎች ያመለክታል፤ “ክፍሎች” ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን ቀጣዩን የማኅበረሰብ አገባብም አያግድም።
- source_word: πολλὰ ὄντα
  choice: ብዙ ቢሆኑም
  rationale: የአሳቢውን አስማሚ ተቃርኖ—ብዙ ቢሆኑም አንድ መሆናቸውን—በተፈጥሯዊ የአማርኛ አሳማኝ አወቃቀር ይገልጣል።
- source_word: οὕτως καὶ ὁ Χριστός
  choice: መሲሑም እንዲሁ ነው
  rationale: οὕτως καὶ ያለውን የንጽጽር መደምደሚያ በአጭሩ ይጠብቃል፤ ὁ Χριστόςን እንደ ማዕረግ “መሲሑ” ብሎ ያቀርባል።
theological_decisions:
- issue: ὁ Χριστός እንዴት እንደሚተረጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός በመሠረቱ “የተቀባው” የሚል ማዕረግ ነው። በዚህ ሥነ መለኮታዊ ንጽጽር ውስጥ “መሲሑ” የማዕረጉን ኃይል ይጠብቃል።
- issue: “መሲሑም እንዲሁ ነው” የሚለው አጭር አገላለጽ
  choice: የግሪኩን አጭርና አስደናቂ አገላለጽ ሳይስፋፋ ማቆየት
  alternative: “የመሲሑ አካልም እንዲሁ ነው” ወይም “ቤተ ክርስቲያንም እንዲሁ ናት”
  rationale: ግሪኩ “οὕτως καὶ ὁ Χριστός” ብቻ ይላል። “የመሲሑ አካል” ወይም “ቤተ ክርስቲያን” ብሎ ማስፋፋት ቀጣዮቹ ቁጥሮች የሚገልጹትን ትርጓሜ ወደ ጥቅሱ ውስጥ ያስገባል፤ ስለዚህ ያለው ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ንጽጽራዊ አረፍተ ነገር ተጠብቆ ሳለ፣ በሥርዓተ ነጥብና በተፈጥሯዊ የአማርኛ ግስ አወቃቀር እንዲነበብ ተደርጓል።
