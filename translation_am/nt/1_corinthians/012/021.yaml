review_pass:
  verdict: revise
  source_fidelity: The draft preserves the body-part imagery, contrast, and singular/plural distinction, but both quoted statements reverse the Greek's direction of need. Χρείαν σου/ὑμῶν οὐκ ἔχω means “I have no need of you,” not “You do not need me.”
  naturalness: The overall syntax is clear and natural in modern standard Amharic. Using አንቺ and እናንተ appropriately makes the singular hand and plural feet explicit.
  terminology: ዓይን፣ እጅ፣ ራስ፣ and እግሮች faithfully retain Paul's literal body imagery. No interpretive ecclesiological expansion is added.
  issues:
  - severity: high
    issue: The first quotation reverses the semantic roles of speaker and addressee.
    rationale: “አንቺ አታስፈልጊኝም” means “You do not need me,” whereas Χρείαν σου οὐκ ἔχω means “I do not need you.”
  - severity: high
    issue: The second quotation likewise reverses the semantic roles.
    rationale: “እናንተ አታስፈልጉኝም” means “You do not need me,” whereas Χρείαν ὑμῶν οὐκ ἔχω means “I do not need you [plural].”
  revised_text: ነገር ግን ዓይን እጅን፣ “አንቺን አላስፈልግም” ማለት አይችልም፤ ወይም ደግሞ ራስ እግሮችን፣ “እናንተን አላስፈልግም” ማለት አይችልም።
  revised_footnotes: []
  revision_rationale: The revision corrects the direction of the verb of need while retaining the source's inability construction, adversative connection, literal body-part metaphor, and the singular (hand) versus plural (feet) address. Because Amharic explicitly marks both number distinctions in the main text, no footnote corresponding to the English plural-you note is necessary.
