revisions:
- from: ነገር ግን ዓይን እጅን፣ “አንቺ አታስፈልጊኝም” ማለት አይችልም፤ ወይም ደግሞ ራስ እግሮችን፣ “እናንተ አታስፈልጉኝም” ማለት አይችልም።
  to: ነገር ግን ዓይን እጅን፣ “አንቺን አላስፈልግም” ማለት አይችልም፤ ወይም ደግሞ ራስ እግሮችን፣ “እናንተን አላስፈልግም” ማለት አይችልም።
