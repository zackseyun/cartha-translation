id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: am
  text: ነገር ግን ዓይን እጅን፣ “አንቺን አላስፈልግም” ማለት አይችልም፤ ወይም ደግሞ ራስ እግሮችን፣ “እናንተን አላስፈልግም” ማለት አይችልም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: ማለት አይችልም
  rationale: የግሪኩን አለመቻል ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የአካል ክፍሎች መደጋገፍ ሐሳብ ጋር ያለውን ንፅፅር ያሳያል።
- source_word: ὁ ὀφθαλμός
  choice: ዓይን
  rationale: የአካል ምሳሌውን በቀጥታ ይጠብቃል።
- source_word: τῇ χειρί
  choice: እጅን
  rationale: በአማርኛ ‘እጅን ... ማለት’ የተፈጥሮ አገላለጽ ሲሆን የተነገረላትን የአካል ክፍል ያመለክታል።
- source_word: Χρείαν σου οὐκ ἔχω
  choice: አንቺ አታስፈልጊኝም
  rationale: ‘አላስፈልግሽም’ ከሚለው ጋር እኩል የፍላጎት እጦትን ያሳያል፤ ከሴት ጾታ ስም ‘እጅ’ ጋርም ሰዋስዋዊ ስምምነት አለው።
- source_word: ἢ πάλιν
  choice: ወይም ደግሞ
  rationale: ሁለተኛውን ተመሳሳይ ምሳሌ በተፈጥሯዊ መንገድ ያስገባል።
- source_word: ἡ κεφαλή
  choice: ራስ
  rationale: ቀጥተኛውን የአካል ክፍል ምስል ይጠብቃል።
- source_word: τοῖς ποσίν
  choice: እግሮችን
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ሁኔታ ይጠብቃል።
- source_word: Χρείαν ὑμῶν οὐκ ἔχω
  choice: እናንተ አታስፈልጉኝም
  rationale: ὑμῶν ብዙ ቁጥር መሆኑን ‘እናንተ’ እና ብዙ ቁጥር ግስ በግልጽ ያሳያሉ።
theological_decisions:
- issue: የክርስቶስ አካል አባላት መደጋገፍን የሚገልጸው የአካል ምሳሌ
  choice: የዓይን፣ የእጅ፣ የራስና የእግሮች ምስል ያለ ትርጓሜያዊ ማስፋፊያ ተጠብቋል።
  alternative: በዋናው ጽሑፍ እነዚህን የቤተ ክርስቲያን አባላት ብሎ በግልጽ መተርጎም።
  rationale: የጳውሎስ ሥነ መለኮታዊ ነጥብ በምሳሌው ራሱ ላይ ስለተመሠረተ፣ ትርጓሜን በዋናው ጽሑፍ መጨመር ከምንጩ ያልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። አማርኛ በነጠላና ብዙ ቁጥር ተውላጠ ስም መካከል ግልጽ ልዩነት ስለሚያደርግ፣ የግሪኩ σου እና ὑμῶν ልዩነት በዋናው ጽሑፍ ‘አንቺ’ እና ‘እናንተ’ ተጠብቋል፤ ስለዚህ የእንግሊዝኛው የግርጌ ማስታወሻ በአማርኛ አያስፈልግም።
