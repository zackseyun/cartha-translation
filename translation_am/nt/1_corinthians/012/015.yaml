  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: am
  text: እግር፣ “እጅ ስላልሆንኩ የአካል ክፍል አይደለሁም” ቢል[a]፣ በዚህ ምክንያት የአካል ክፍል መሆኑን ያጣልን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደ አነጋገር፦ “እጅ ስላልሆንኩ የአካሉ ክፍል አይደለሁም … ይህ ግን የአካሉ ክፍል መሆኑን አያሳጣውም።”
    reason: lexical_alternative
lexical_decisions:
