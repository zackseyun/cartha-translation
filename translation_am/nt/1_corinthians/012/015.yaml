- source_word: ἐκ τοῦ σώματος
  choice: ከአካል
  rationale: ἐκ የሚለውን መነሻዊ/አባልነታዊ አገላለጽ በ‘ከ-’ ይጠብቃል፤ በሁለቱም ቦታ መደገሙም የግሪኩን አጻጻፍ ያንጸባርቃል።
- source_word: οὐ παρὰ τοῦτο
  choice: በዚህ ምክንያት
  rationale: የተነገረው ምክንያት ውጤቱን እንደማያስከትል በግልጽ ያሳያል።
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ከአካል ያልሆነ ይሆናልን?
  rationale: የግሪኩን አሉታዊ አገላለጽና መልሱ ‘አይሆንም’ የሚል የክርክር ጥያቄ መሆኑን ይጠብቃል።
