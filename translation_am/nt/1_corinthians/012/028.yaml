translation:
  language: am
  text: እግዚአብሔርም በቤተ ክርስቲያን እንዲህ አስቀምጧል፦ አንደኛ ሐዋርያትን፣ ሁለተኛ ነቢያትን፣ ሦስተኛ አስተማሪዎችን፣ ከዚያም ተአምራትን[a]፣ ከዚያም የፈውስ ጸጋ ስጦታዎችን፣ እርዳታዎችን፣ የማስተዳደር ችሎታዎችን[b]፣ የልሳናት ዓይነቶችን[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የኃይል ሥራዎችን።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የመምራት ችሎታዎችን» ወይም «አቅጣጫ የመስጠት ችሎታዎችን።»
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «የቋንቋዎች ዓይነቶችን።» የግሪኩ ቃል «ልሳናት» ወይም «ቋንቋዎች» ማለት ይችላል፤ ዋናው ጽሑፍ በዚህ አውድ የጳውሎስን አገላለጽ አሻሚነት ጠብቋል።
    reason: alternative_reading
