    issue: The main rendering በእኩል for τὸ αὐτό is overly specific.
    rationale: τὸ αὐτό literally expresses “the same [thing/care]”; in context it can imply impartial or equal care, but “equally” alone makes that implication the sole meaning. ተመሳሳይ እንክብካቤ retains the Greek’s shared/same-care expression.
  - severity: low
    issue: Footnote b duplicates the proposed more source-near wording rather than functioning as a genuine alternative.
    rationale: Once the main text uses “same/shared care,” the note should instead offer the legitimate interpretive alternative of equal mutual concern.
