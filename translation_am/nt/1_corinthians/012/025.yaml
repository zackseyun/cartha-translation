  terminology: አካል and የአካሉ ክፍሎች appropriately retain Paul’s body metaphor. መከፋፈል is a suitable nontechnical rendering of σχίσμα. The revised wording renders μεριμνῶσι positively as mutual care rather than anxiety.
  issues:
