  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: am
  text: ለሌላ ሰው በዚያው መንፈስ እምነት[a]፤ ለሌላ ሰውም በአንዱ መንፈስ የፈውሶች ስጦታዎች[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እምነት” የተባለው የግሪክ ቃል (πίστις) “ታማኝነት” ወይም “መታመን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ “የፈውሶች ስጦታዎች” ይላል፤ “ፈውሶች” እና “ስጦታዎች” የሚሉት ሁለቱም ብዙ ቁጥር ናቸው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ / ἄλλῳ
  choice: ለሌላው / ለሌላውም
  rationale: ሁለቱም ቃላት ከቀደመው ቁጥር የቀጠለውን ስጦታዎች ለየሰው የመከፋፈል ሐሳብ ያሳያሉ። በአማርኛ ያልተፈጥሯዊ ልዩነት ሳይጫንባቸው ‘ለሌላው’ ተብለዋል።
- source_word: πίστις
  choice: እምነት
  rationale: ‘እምነት’ የቃሉን መደበኛ የጳውሎስ አጠቃቀም ይጠብቃል፤ በዚህ የስጦታዎች አውድ ያለውን ልዩ አገልግሎታዊ ትርጉም ግን በተጨማሪ ትምህርት አይወስንም። ሌሎች ሊሆኑ የሚችሉ ትርጉሞች በማስታወሻ ተጠብቀዋል።
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: በዚያው መንፈስ
  rationale: ‘በ’ የግሪኩን ἐν መሣሪያዊ ወይም የአማካይነት ኃይል በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ዚያው’ ደግሞ αὐτῷ የሚያጎላውን አንድነት ያስቀምጣል።
- source_word: χαρίσματα ἰαμάτων
  choice: የፈውሶች ስጦታዎች
  rationale: በግሪኩ ሁለቱም ስሞች ብዙ ቁጥር ስለሆኑ በአማርኛውም ያ ልዩ አገላለጽ ተጠብቋል።
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: በአንዱ መንፈስ
  rationale: ἑνὶ የሚያጎላውን ‘አንድ’ የሚለውን ሐሳብ ሳያደበዝዝ ከቀደመው ‘በዚያው’ ጋር ያለውን የግሪክ አገላለጽ ልዩነት ይጠብቃል።
theological_decisions:
- issue: በመንፈሳዊ ስጦታዎች አውድ ውስጥ πίστις ያለው ትርጉም
  choice: እምነት
  alternative: ታማኝነት፤ መታመን
  rationale: ጽሑፉ በመንፈስ የሚሰጥ ስጦታ እንደሆነ ያሳያል፤ ነገር ግን የአንድን ወገን የመንፈሳዊ ልምምድ ትምህርት እንዲያመለክት አልተጨመረበትም።
- issue: πνεύματι የሚያመለክተው
  choice: መንፈስ፣ ማለትም መንፈስ ቅዱስ
  alternative: የሰው መንፈስ
  rationale: በ1 ቆሮንቶስ 12 ዙሪያ አውድ ስጦታዎችን የሚሰጠውና የሚያከፋፍለው መንፈስ ቅዱስ መሆኑ ግልጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥሩ ከቀደመው ሐረግ የቀጠለ ቢሆንም፣ በአማርኛ ሙሉና ተፈጥሯዊ እንዲሆን ‘ይሰጣሉ’ የሚለው ከቀደመው አውድ የሚገባ ግስ ተጨምሯል።
