  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: am
  text: የጸጋ ስጦታዎች[a] የተለያዩ ናቸው፤ ነገር ግን ያው መንፈስ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የስጦታዎች ክፍፍሎች” ወይም “የስጦታዎች ልዩነቶች።” ግሪክኛው ቃል የሚያጎላው በስጦታዎቹ ውስጥ ያለውን ብዝኃነት ነው እንጂ በቤተ ክርስቲያን ውስጥ ያለውን መከፋፈል አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: ልዩ ልዩ
  rationale: በዚህ አውድ ቃሉ በስጦታዎቹ መካከል ያሉትን ልዩነቶች ወይም ዓይነቶች ያመለክታል፤ በቤተ ክርስቲያን ውስጥ መከፋፈልን አያመለክትም።
- source_word: δὲ ... δὲ
  choice: …፤ … ግን
  rationale: የመጀመሪያው δέ በአማርኛ ያለ ግልጽ መስተዋድድ በተፈጥሯዊ የንግግር ሽግግር ተወክሏል፤ ሁለተኛው δέ በስጦታዎች ብዝኃነትና በመንፈሱ አንድነት መካከል ያለውን ንፅፅር ለማሳየት “ግን” ተብሏል።
- source_word: χαρισμάτων
  choice: የጸጋ ስጦታዎች
  rationale: χάρισμα በጸጋ የሚሰጥን ስጦታ ያመለክታል፤ “የጸጋ ስጦታዎች” በአማርኛ ግልጽ ሲሆን የቃሉን የጸጋ ገጽታም ይጠብቃል።
- source_word: τὸ ... αὐτὸ
  choice: ያው
  rationale: “ያው” ብዝኃነት ቢኖርም የመንፈሱ ማንነት አንድ መሆኑን በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: πνεῦμα
  choice: መንፈሱ
  rationale: የቅርብ አውዱ የስጦታዎቹ ምንጭ የሆነውን መንፈስ ያመለክታል፤ የተወሰነው ቅጽ “መንፈሱ” ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: የπνεῦμα ማመልከቻ
  choice: መንፈስ ቅዱስ
  alternative: የሰው መንፈስ ወይም መንፈሳዊ ኃይል/መርሕ
  rationale: በ1 ቆሮንቶስ 12፥3-11 ያለው አውድ ስጦታዎችን የሚያከፋፍለው መለኮታዊው መንፈስ መሆኑን ደጋግሞ ያሳያል። ዋናው ጽሑፍ “መንፈሱ” በማለት አውዱን ይጠብቃል እንጂ አላስፋፋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው የብዝኃነትና የአንድነት ንፅፅር በ“ልዩ ልዩ … ግን ያው” ተጠብቋል።
