lexical_decisions:
- source_word: διαιρέσεις
  choice: የተለያዩ
  rationale: በቁጥር 4–6 ያለው አውድ በአንድነት ውስጥ ያሉ ልዩ ልዩ ዓይነቶችን ይገልጣል እንጂ ክፍፍልን ወይም ጠብን አያመለክትም። ይህ ምርጫ የግሪኩን ብዙነትና ልዩነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διακονιῶν
  choice: አገልግሎቶች
  rationale: ቃሉ አገልግሎትን፣ የማገልገል ተግባርን ወይም የአገልግሎት ኃላፊነትን ሊያመለክት ይችላል። «አገልግሎቶች» በአማኞች መካከል ያሉትን የተለያዩ ተግባራት በግልጽና በተለመደ ቋንቋ ይገልጣል።
- source_word: ὁ αὐτὸς
  choice: ያው
  rationale: «ያው» በተለያዩ አገልግሎቶች መካከል ጌታ አንድና የማይለወጥ መሆኑን በተፈጥሯዊ አማርኛ ያጎላል።
- source_word: κύριος
  choice: ጌታ
  rationale: «ጌታ» የκύριοςን ማዕረግና ሥነ መለኮታዊ ክብደት ይጠብቃል፤ በዚህ የሦስትዮሽ አወቃቀር ውስጥ በአውዱ ጌታ ኢየሱስን ሳይሰይም ሊያመለክት ይችላል።
- source_word: καὶ
  choice: ም / ግን
  rationale: የመጀመሪያው καὶ ከቀደመው ትይዩ ንግግር ጋር በ«ም» ተያይዟል፤ ሁለተኛው ደግሞ የልዩነትና የአንድነት ንጽጽርን በአማርኛ ግልጽ ለማድረግ «ግን» ተብሏል።
- source_word: εἰσιν
  choice: ናቸው
  rationale: ብዙ የሆነውን ርዕሰ ጉዳይ የሚስማማና በአማርኛ ተፈጥሯዊ የሆነ የመኖር ግስ ነው።
theological_decisions:
