  rationale: ቁጥር 4–6 «መንፈስ፣ ጌታ፣ እግዚአብሔር» የሚል ትይዩ አወቃቀር አለው። ትርጉሙ ምናልባት ያለውን ክርስቶሳዊ አመልካችነት አያስወግድም፤ ነገር ግን «ኢየሱስ» ብሎ በመጨመር የምንጩን አሻሚነት አይፈታም።
