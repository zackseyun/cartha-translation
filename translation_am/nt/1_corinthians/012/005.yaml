  choice: በጽሑፉ ውስጥ «ጌታ» የሚለው ማዕረግ ያለ ማብራሪያ ተጠብቋል፤ በአውዱ ግን ጌታ ኢየሱስን ሳይሰይም ሊያመለክት ይችላል።
