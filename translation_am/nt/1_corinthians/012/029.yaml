  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: am
  text: ሁሉም ሐዋርያት አይደሉም፣ አይደል? ሁሉም ነቢያት አይደሉም፣ አይደል? ሁሉም አስተማሪዎች አይደሉም፣ አይደል? ሁሉም ተአምራትን አያደርጉም፣ አይደል?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በቃል “ኃይሎች” ማለት ነው፤ በዚህ ዐውድ ግን ተአምራዊ ሥራዎችን ወይም እነዚህን ሥራዎች ማድረግን በአጭር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: …ናቸውን? / …ያደርጋሉን?
  rationale: μή የሚያስገባው ጥያቄ አሉታዊ መልስን ይጠብቃል። በአማርኛ የጥያቄው ቅርጽና ተደጋጋሚነት ይህን የንግግር ኃይል በተፈጥሮ ያስተላልፋሉ።
- source_word: πάντες
  choice: ሁሉም
  rationale: የግሪኩን ‘ሁሉ’ ትርጉምና በእያንዳንዱ ጥያቄ ያለውን አጽንዖት ይጠብቃል።
- source_word: ἀπόστολοι
  choice: ሐዋርያት
  rationale: በጳውሎስ ዝርዝር ውስጥ ያለውን የታወቀ አገልግሎት ሚና የሚገልጽ መደበኛ የአማርኛ ቃል ነው።
- source_word: προφῆται
  choice: ነቢያት
  rationale: ትንቢት የሚናገሩትን ለመግለጽ የተለመደና ግልጽ አቻ ቃል ነው።
- source_word: διδάσκαλοι
  choice: አስተማሪዎች
  rationale: በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን የማስተማር ሚናውን በትክክል ይገልጻል።
- source_word: δυνάμεις
  choice: ተአምራትን ያደርጋሉ
  rationale: δυνάμεις በቃል በቃል ‘ኃይሎች’ ወይም ‘የኃይል ሥራዎች’ ማለት ቢችልም፣ እዚህ ተአምራዊ ሥራዎችን ወይም እነርሱን የሚያደርጉትን በአጭር ይወክላል። የተመረጠው አገላለጽ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በሚናዎችና በጸጋ ስጦታዎች ዝርዝር ውስጥ δυνάμειςን መተርጎም
  choice: ሁሉም ተአምራትን ያደርጋሉን?
  alternative: ሁሉም የኃይል ሥራዎች ናቸውን? / ሁሉም ተአምራትን የሚያደርጉ ናቸውን?
  rationale: የግሪኩ ስም በዝርዝሩ ውስጥ ተአምራዊ ሥራዎችን ማከናወን በአጭር ያመለክታል። በግስ መተርጎሙ ሰዎች ቃል በቃል ‘ኃይሎች’ ናቸው የሚል ያልተፈለገ ሐሳብ ሳያስገባ የዐውዱን ግልጽ ትርጉም ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ አራት ተደጋጋሚ የንግግር ጥያቄዎች ተጠብቀዋል፤ እያንዳንዱም የሚጠብቀው መልስ ‘አይደለም’ ነው።
