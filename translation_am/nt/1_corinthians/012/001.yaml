translation:
  language: am
  text: ስለ መንፈሳዊ ስጦታዎች[a]፣ ወንድሞች[b]፣ ሳታውቁ እንድትቀሩ አልፈልግም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መንፈሳዊ ነገሮች።” የግሪኩ አገላለጽ ከ“ስጦታዎች” የሰፋ ነው፤ ሆኖም የዚህ ምዕራፍ ዐውድ መንፈስ በሚሰጣቸው ስጦታዎች ላይ ያተኩራል።
    reason: alternative_reading
  - marker: b
    text: እዚህ “ወንድሞች” የሚለው ጳውሎስ ለጉባኤው የሚጠቀምበት የአጠራር ቃል ሲሆን፣ ሴቶችንም ሊያካትት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ስለ
  rationale: περί አዲስ ርዕስን ‘ስለ/በተመለከተ’ ብሎ ያስገባል፤ δέ ደግሞ ቀላል የንግግር ሽግግር ነው። በአማርኛ ‘ስለ’ ሁለቱንም በተፈጥሯዊ ሁኔታ ያቀርባል፤ በግሪኩ ግልጽ የጊዜ ‘አሁን’ ስለሌለ አልተጨመረም።
- source_word: τῶν πνευματικῶν
  choice: መንፈሳዊ ስጦታዎች
  rationale: ቅጽሉ በስም ፋንታ የቆመ ሲሆን ‘መንፈሳዊ ነገሮች’ ወይም በዚህ ዐውድ ‘መንፈሳዊ ስጦታዎች’ ሊሆን ይችላል። 12፥4-11 ስለ መንፈስ ስጦታዎችና መገለጦች ስለሚናገር፣ ይህ ምርጫ ለአንባቢው ግልጽና ከዐውዱ ጋር የሚስማማ ነው፤ የግሪኩ ሰፊ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር የጥሪ ቅጽ በቀጥታ ይወክላል። ጳውሎስ በዚህ አጠራር ሴቶችንም ጨምሮ መላውን ጉባኤ ማመልከቱ በማስታወሻ ተገልጧል።
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: ሳታውቁ እንድትቀሩ አልፈልግም
  rationale: የጳውሎስን ‘እንዳታውቁ/ያላወቃችሁ እንድትሆኑ አልፈልግም’ የሚለውን የማስተማር መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የስድብ ድምፅ ሊኖረው የሚችል አገላለጽን ያስወግዳል።
theological_decisions:
- issue: የτῶν πνευματικῶν አተረጓጎም
  choice: በዋናው ጽሑፍ ‘መንፈሳዊ ስጦታዎች’
  alternative: ‘መንፈሳዊ ነገሮች’፤ በሰዋሰዋዊ ደረጃ ‘መንፈሳዊ ሰዎች’ የሚለውም ሊታሰብ ይችላል
  rationale: የግሪኩ አገላለጽ በራሱ ከ‘ስጦታዎች’ የሰፋ ነው፤ ሆኖም ተከታዩ ክፍል መንፈስ ስለሚሰጣቸው ልዩ ልዩ ስጦታዎችና መገለጦች ይናገራል። ስለዚህ ዐውዳዊው ትርጉም በዋናው ጽሑፍ፣ እውነተኛው የቃል አሻሚነት ደግሞ በማስታወሻ ተጠብቋል።
