  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሳታውቁ እንድትቀሩ’ ተፈጥሯዊ ሲሆን የግሪኩን ሐሳብ ያለ ንቀት ያስተላልፋል።
