base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: am
  text: ጆሮም፣ “ዓይን ስላልሆንኩ፣ የሰውነት ክፍል አይደለሁም” ቢል፣ በዚህ ምክንያት የሰውነት ክፍል አይደለም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፦ «ከሰውነት አይደለሁም» … «በዚህ ምክንያት ከሰውነት አይደለም።» የግሪኩ ጽሑፍ «ከሰውነት» የሚለውን ሐረግ ለአጽንዖት ይደግማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን አያያዥ ከቀደመው የአካል ክፍል ምሳሌ ጋር በተፈጥሯዊ የአማርኛ አያያዝ ያገናኛል።
- source_word: ἐὰν εἴπῃ
  choice: ቢል
  rationale: ἐὰν ከአኦሪስት ሰብጅንክቲቭ ጋር የሚገልጸውን መላምታዊ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ οὖς
  choice: ጆሮ
  rationale: በምሳሌው ሰዋዊ ባሕርይ የተሰጠውን የአካል ክፍል በቀጥታ ይጠቅሳል።
- source_word: Ὅτι
  choice: ስላልሆንኩ
  rationale: ὅτι በዚህ ስፍራ የንግግሩን ይዘት ከምክንያታዊ ኃይል ጋር ያስገባል፤ የአማርኛው ምክንያታዊ ቅጥያ ሁለቱንም ተግባር በተፈጥሮ ይይዛል።
- source_word: ὀφθαλμός
  choice: ዓይን
  rationale: ቀጥተኛውን የአካል ክፍል ቃል ይጠብቃል።
- source_word: ἐκ τοῦ σώματος
  choice: ከሰውነት
  rationale: ἐκን በ«ከ» በመተርጎም ጳውሎስ ሐረጉን ሁለት ጊዜ መድገሙንና የክርክሩን ቅርጽ ይጠብቃል።
- source_word: οὐ παρὰ τοῦτο
  choice: በዚህ ምክንያት ... አይደለም
  rationale: የጆሮው ንግግር ያመጣውን ድምዳሜ በዚያ ምክንያት እንደማይከተል ያሳያል።
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ከሰውነት ያልሆነ አይደለም
  rationale: የግሪኩን የተደጋገመ አሉታዊ ቅርጽና «ከሰውነት» የሚለውን ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: የክርስቶስ አካል ምሳሌን በትርጓሜ ማለስለስ
  choice: የምንጩን «ከሰውነት» ድግግሞሽና ድርብ አሉታዊ አወቃቀር በዋናው ጽሑፍ ማቆየት
  alternative: «ይህም የሰውነት ክፍል ከመሆን አያስቀረውም» ብሎ በፈሊጣዊ አማርኛ ማለስለስ
  rationale: ጥቅሱ የአማኞችን በአካሉ ውስጥ መካተት በምሳሌ ያቀርባል፤ የምንጩን የክርክር ቅርጽ መጠበቅ ከጽሑፉ በላይ የሆነ የቤተ እምነት ማብራሪያ እንዳይገባ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። «ሰውነት» በዚህ አውድ ከ«አካል» ይልቅ ከጆሮና ከዓይን ጋር ያለውን ሥጋዊ ምስል በግልጽ ያቆያል፤ ዋናው ጽሑፍ ግን ሆን ብሎ የግሪኩን ጠንካራ ድርብ አሉታ ስለጠበቀ ከተለመደ ፈሊጣዊ አማርኛ ጥቂት ይበልጥ መደበኛ ነው።
