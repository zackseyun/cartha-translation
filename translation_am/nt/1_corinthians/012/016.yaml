review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional personification, the causal complaint, and the repeated body-membership expression. However, its final phrase, «ከሰውነት ያልሆነ አይደለም», is grammatically heavy and not idiomatic modern Amharic. Rendering the repeated expression as «የሰውነት ክፍል» accurately communicates ἐκ τοῦ σώματος in this body-member metaphor; the repetition and rhetorical negation remain evident.
  naturalness: «ጆሮም» is a suitable connective, but «... ያልሆነ አይደለም» is unnatural in this context. «የሰውነት ክፍል አይደለም» is clear, standard, and preserves the argument without introducing a doctrinal gloss.
  terminology: «ሰውነት» suitably retains the concrete anatomical image. «የሰውነት ክፍል» is the natural Amharic expression for a member/part belonging to the body and is used consistently in both occurrences.
  issues:
  - severity: medium
    issue: The final double-negative construction is not idiomatic Amharic.
    rationale: «ከሰውነት ያልሆነ አይደለም» is difficult to parse and sounds like an adjectival phrase lacking a natural referent. A direct repetition of «የሰውነት ክፍል አይደለም» produces the intended rhetorical rebuttal naturally.
  - severity: low
    issue: The main text’s use of «ከሰውነት» does not express body-membership as naturally as it could.
    rationale: Although formally motivated by ἐκ, Amharic normally states this relation as «የሰውነት ክፍል»; this remains faithful to the metaphor and avoids suggesting physical origin.
  revised_text: ጆሮም፣ “ዓይን ስላልሆንኩ፣ የሰውነት ክፍል አይደለሁም” ቢል፣ በዚህ ምክንያት የሰውነት ክፍል አይደለም።[a]
