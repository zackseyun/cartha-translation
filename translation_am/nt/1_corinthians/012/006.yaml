  rationale: አውዱ በቤተ ክርስቲያን አባላት መካከል ስለሚሠሩ የመንፈስ መገለጫዎች ቢናገርም፣ ግሪኩ πᾶσιν ብቻ ይላል። ስለዚህ ጽሑፉን ወደ አንድ የአስተምህሮ ትርጓሜ ሳያጠብ ሰፊነቱና ውጥረቱ ተጠብቋል።
