- source_word: ἐν πᾶσιν
  choice: በሁሉ ውስጥ
  rationale: ግሪኩ ስሙን በግልጽ ስለማይጠቅስ ያለውን እውነተኛ አሻሚነት ይጠብቃል፤ አውዱ ግን የማኅበሩን አባላት እንደሚያመለክት በማስታወሻ ተገልጧል።
