- source_word: ὁ δὲ αὐτὸς θεός
  choice: ነገር ግን ... አንድ ያው እግዚአብሔር ነው
  rationale: δέ የሚያሳየውን መጠነኛ ንጽጽር ይጠብቃል፤ αὐτός ደግሞ በልዩ ልዩ አሠራሮች መካከል ምንጩ ያው አንድ አምላክ መሆኑን ያጎላል።
- source_word: ὁ ἐνεργῶν
  choice: የሚያከናውን
  rationale: የአሁን ጊዜ ንቁና ቀጣይ ድርጊትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ πάντα
  choice: ሁሉን
