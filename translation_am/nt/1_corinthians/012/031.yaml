- source_word: δείκνυμι
  choice: አሳያችኋለሁ
  rationale: የግሪኩ ግስ በአሁን ጊዜ ቅርጽ ቢሆንም፣ ጳውሎስ በሚቀጥለው ክፍል ሊያቀርበው ያለውን መንገድ ስለሚያስተዋውቅ፣ የአማርኛው የወደፊት ጊዜ አገላለጽ ተፈጥሯዊ ነው።
