- source_word: χαρίσματα
  choice: የጸጋ ስጦታዎች
  rationale: χάρισμα ከጸጋ የሚሰጥ ስጦታን ያመለክታል። “የጸጋ ስጦታዎች” የቃሉን መሠረታዊ ግንኙነት ያሳያል፣ “መንፈሳዊ” የሚለውንም በዚህ ሐረግ ውስጥ ሳይጨምር አውዱ ትርጉሙን እንዲያብራራ ይተዋል።
- source_word: μείζονα
  choice: ከሁሉ የሚበልጡትን
  rationale: የንጽጽር ኃይሉንና የአስፈላጊነት ደረጃውን ያስጠብቃል፣ የተለየ የስጦታዎች ዝርዝር ግን አያስገባም።
