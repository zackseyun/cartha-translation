  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: am
  text: 'ነገር ግን የበለጡትን የጸጋ ስጦታዎች በብርቱ ፈልጉ[a]። እኔም ከዚህ በላይ እጅግ የላቀ መንገድ[b] አሳያችኋለሁ።


    [a] ወይም፣ “ነገር ግን የበለጡትን የጸጋ ስጦታዎች በብርቱ ትፈልጋላችሁ።” የግሪኩ ζηλοῦτε ቅርጽ በዚህ አውድ እንደ ትእዛዝም ሆነ እንደ መግለጫ ሊነበብ ይችላል።


    [b] በተለመደው አተረጓጎም፣ “ከዚህ በላይ የተሻለ መንገድ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነገር ግን የበለጡትን የጸጋ ስጦታዎች በብርቱ ትፈልጋላችሁ።” የግሪኩ ζηλοῦτε ቅርጽ በዚህ አውድ እንደ ትእዛዝም ሆነ እንደ መግለጫ ሊነበብ ይችላል።
    reason: alternative_reading
  - marker: b
