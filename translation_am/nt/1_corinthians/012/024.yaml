lexical_decisions:
- source_word: εὐσχήμονα
  choice: የተከበሩ የሰውነታችን ክፍሎች
  rationale: ቃሉ በቀደመው ቁጥር ከተጠቀሱት አነስተኛ ክብር ካላቸው ክፍሎች ጋር ይነጻጸራል፤ አማርኛውም የውጫዊ ጨዋነትንና ክብርን ሐሳብ በተፈጥሯዊ አገላለጽ ይይዛል። ‘ክፍሎች’ ከዐውዱ ተሟልቷል።
- source_word: χρείαν ἔχει
  choice: ይህን አያስፈልጋቸውም
  rationale: ቀጥተኛውን ‘አያስፈልጋቸውም’ የሚለውን ፍቺ ይጠብቃል፤ ‘ይህን’ የሚለው በቀደመው ዐውድ የተጠቀሰውን ልዩ ክብር ወይም እንክብካቤ ያመለክታል።
- source_word: συνεκέρασεν
  choice: አዋሕዶታል
  rationale: ግሱ የተለያዩ ክፍሎችን አቀናጅቶ አንድ ሙሉ ነገር የማድረግን ሐሳብ ይይዛል። ‘አዋሕዶታል’ የአንድነት ውጤቱን ሳይጠፋ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σῶμα
  choice: ሰውነትን
  rationale: የጳውሎስን ዋና የሰውነት ዘይቤ በቀጥታ ይጠብቃል።
- source_word: τῷ ὑστεροῦντι
  choice: ክብር ለጎደለው ክፍል
  rationale: ተሳቢው ‘የጎደለውን’ ወይም ‘ያነሰውን’ ያመለክታል። የጎደለው ክብር መሆኑን ከሚከተለው τιμήν በመነሳት ግልጽ ያደርጋል፤ ይህም የክፍሉን ውስጣዊ ዋጋ እንደጎደለ አያሳይም።
- source_word: περισσοτέραν τιμήν
  choice: የበለጠ ክብር
  rationale: የንጽጽር ኃይሉን በግልጽና በዘመናዊ አማርኛ ይጠብቃል።
- source_word: δοὺς
  choice: በመስጠት
  rationale: የእግዚአብሔር ማዋሐድ ክብርን በመስጠት የተፈጸመ መሆኑን የመሣሪያ ወይም የአፈጻጸም ግንኙነት በግልጽ ያሳያል።
theological_decisions:
- issue: በሰውነት ዘይቤው ውስጥ የእግዚአብሔር ድርጊት ትርጉም
  choice: እግዚአብሔር ክብር ለጎደላቸው ክፍሎች የበለጠ ክብር በመስጠት ሰውነትን እንዳዋሐደ ቀርቧል።
  alternative: ድርጊቱን የአካል ክፍሎች አካላዊ ቅልቅል ብቻ አድርጎ መረዳት፣ ወይም ምሳሌውን ከቤተ ክርስቲያን ዐውድ በመለየት ለተፈጥሯዊ ሰውነት ብቻ ማድረግ።
  rationale: የቅርብ ዐውዱ ቤተ ክርስቲያንን እንደ ክርስቶስ ሰውነት የሚያቀርብ ሰፊ ዘይቤ ነው። ትርጉሙ ለተፈጥሯዊ ሰውነትና ለማኅበረ እምነቱ ያለውን የዘይቤ ግንኙነት ሳይገድብ የእግዚአብሔርን ዓላማ ያለው ማዋሐድና ክብር መስጠት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሰውነት ዘይቤውና የግሪኩ ግስ የማዋሐድ ኃይል ተጠብቀዋል።
