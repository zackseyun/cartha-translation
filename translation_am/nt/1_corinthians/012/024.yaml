  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: am
  text: ነገር ግን ውብ የሆኑት የሰውነታችን ክፍሎች ፍላጎት የላቸውም። ከዚህ ይልቅ እግዚአብሔር የክብር ጉድለት ላለበት ክፍል የበለጠ ክብር በመስጠት ሰውነትን አዋሕዶታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰውነትን አቀናጅቶታል።” የግሪኩ ግስ የተለያዩ ክፍሎችን በማዋሐድ አንድ ሙሉ ነገር ማድረግን ሊያጎላ ይችላል።
