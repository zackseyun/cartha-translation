base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: am
  text: መላው አካል ዓይን ቢሆን ኖሮ፣ መስማት[a] የት ይሆን ነበር? መላው አካል መስማት ቢሆን ኖሮ፣ ማሽተት የት ይሆን ነበር?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጆሮ የት ይሆን ነበር? … አፍንጫ የት ይሆን ነበር?” የግሪክ ጽሑፉ ግን የሚጠቅሰው የመስማትና የማሽተት ችሎታዎችን ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: መላው አካል
  rationale: የግሪኩን ሙሉነት በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጣል፤ ጳውሎስ መላውን አካል እንደ አንድ ክፍል የሚያቀርበውን ምናባዊ ሁኔታ ይጠብቃል።
- source_word: ὀφθαλμός
  choice: ዓይን
  rationale: ነጠላውን የአካል ክፍል ምሳሌ በቀጥታ ይጠብቃል።
- source_word: ποῦ
  choice: የት በሆነ?
  rationale: ‘የት?’ የሚለውን ጥያቄ ከምናባዊው የ‘ቢሆን ኖሮ’ ሁኔታ ጋር በተስማማ ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀκοή
  choice: መስማት
  rationale: ቃሉ የሚያመለክተውን የመስማት ችሎታ ይጠብቃል እንጂ ‘ጆሮ’ ብሎ ወደ አካል ክፍሉ አይለውጠውም።
- source_word: ὅλον
  choice: መላው አካል
  rationale: ግሪኩ በሁለተኛው ሐረግ ‘አካል’ን ቢያስቀርም፣ ‘መላው’ ብቻ በአማርኛ ያልተሟላ ስለሚመስል የተገነዘበው ስም ተደግሟል።
- source_word: ὄσφρησις
  choice: ማሽተት
  rationale: የአፍንጫን አካላዊ ክፍል ሳይጨምር በግሪኩ ያለውን የማሽተት ችሎታ በቀጥታ ይገልጣል።
theological_decisions:
- issue: የአካል ክፍሎች ምሳሌውን በስሜት ችሎታዎች ወይም በአካላዊ ብልቶች መግለጽ
  choice: ἀκοή እና ὄσφρησιςን ‘መስማት’ እና ‘ማሽተት’ ብሎ መተርጎም
  alternative: ‘ጆሮ የት በሆነ? … አፍንጫ የት በሆነ?’ ብሎ መተርጎም
  rationale: የግሪክ ቃላቱ የመስማትና የማሽተት ተግባራትን ይጠቅሳሉ፤ የአካል ብልቶቹን ስሞች አይጠቀሙም። ይህን ልዩነት መጠበቅ የምንጩን አገላለጽ በትክክል ያስተላልፋል።
