  text: If all were one member, where would the body be?
translation:
  language: am
  text: ሁሉም አንድ የአካል ክፍል ቢሆኑ ኖሮ፣ አካሉስ የት ነበር?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: ቢሆን ኖሮ
  rationale: መላምታዊውን ሁኔታ በተፈጥሯዊ የአማርኛ ሁኔታዊ አገላለጽ ያስተላልፋል።
- source_word: δὲ
  choice: —
  rationale: እዚህ ላይ ቀላል የንግግር ማያያዣ ነው፤ ተቃርኖው ከአውዱና ከሁኔታዊው አረፍተ ነገር ግልጽ ስለሆነ በአማርኛ ሳይገለጽ ተትቷል።
- source_word: ἦν
  choice: ቢሆን ኖሮ
  rationale: የግሱን መላምታዊ እና ከእውነታው ተቃራኒ የሆነ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ πάντα
  choice: ሁሉም
  rationale: በአውዱ የአካሉን ክፍሎች በጥቅል ያመለክታል እንጂ ረቂቅ የሆኑ ‘ነገሮችን ሁሉ’ አይደለም።
- source_word: ἓν μέλος
  choice: አንድ የአካል ክፍል
  rationale: μέλος በሰውነት ዘይቤው ውስጥ አንድን የሰውነት ክፍል ያመለክታል፤ ይህ አገላለጽ ከ‘አካል’ በሚገባ ይለየዋል።
- source_word: ποῦ
  choice: የት ይሆን ነበር?
  rationale: በመላምታዊው ሁኔታ አካሉ ሊኖር እንደማይችል የሚጠይቀውን የአጽንዖት ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ σῶμα
  choice: አካሉ
  rationale: የተወሰነውን ሙሉ አካል ያመለክታል፤ የአማርኛው ‘-ዉ’ ቅጥያ የግሪኩን የተወሰነነት ያሳያል።
theological_decisions:
- issue: የአካል ዘይቤው ወሰን
  choice: ጥቅሱ እንደሚለው ‘አካሉ’ ተብሎ ዘይቤው ብቻ ተጠብቋል።
  alternative: ‘የክርስቶስ አካል’ ብሎ በትርጓሜ ማስፋት
  rationale: ሰፊው አውድ ማኅበሩን እንደ ክርስቶስ አካል ቢያቀርብም፣ በዚህ ጥቅስ ውስጥ ግሪኩ ‘አካሉ’ ብቻ ይላል፤ ስለዚህ በጽሑፉ የሌለ ሥነ መለኮታዊ ማብራሪያ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘የአካል ክፍል’ እና ‘አካሉ’ የሚሉት ቃላት በμέλος እና σῶμα መካከል ያለውን ልዩነት ይጠብቃሉ።
