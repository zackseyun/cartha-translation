  rationale: በግሪክ ጥያቄዎቹን የሚያስገባው μή አሉታዊ መልስን ይጠብቃል። የአማርኛው የጥያቄ ቅርጽ የጳውሎስን ንግግራዊ አጽንዖት በተፈጥሯዊ ሁኔታ ያቀርባል፤ በዐውዱ መሠረት የሚጠበቀው መልስ ‘አይደለም’ ነው።
