  text: For the body is not one member, but many.
translation:
  language: am
  text: ሰውነት አንድ አካል ሳይሆን ብዙ አካላት ነውና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: ነውና
  rationale: የግሪኩን ሐሳብ አብራሪና ከቀደመው ክርክር ጋር አያያዥ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ σῶμα
  choice: ሰውነት
  rationale: ጳውሎስ የተጠቀመበትን የሰውነት ምሳሌ ሳይተረጉም በግልጽ ያቆያል።
- source_word: οὐκ ἔστιν
  choice: ሳይሆን
  rationale: አሉታዊውን አያያዝ በቀጥታ ያቀርባል፤ ከሚከተለው ἀλλά ጋርም ተፈጥሯዊውን ‘ሳይሆን…ነው’ አወቃቀር ይፈጥራል።
- source_word: ἓν μέλος
  choice: አንድ አካል ብቻ
  rationale: μέλος በዚህ የሰውነት አውድ ‘አካል’ ተብሎ በተፈጥሯዊ አማርኛ ይተረጎማል፤ ‘ብቻ’ የἕνን ንጽጽራዊ አጽንዖት ያሳያል።
- source_word: ἀλλὰ πολλά
  choice: ብዙ አካላት ነው
  rationale: በግሪኩ ‘አካላት’ በቀደመው μέλος የሚገባ ቢሆንም፣ በአማርኛ ግልጽነትና ተፈጥሯዊነት ሲባል ስሙን መድገም ያስፈልጋል።
theological_decisions:
- issue: ‘ሰውነት’ የሚለው ምሳሌያዊ ማጣቀሻ
  choice: በዋናው ጽሑፍ ‘ሰውነት’ ብቻ ተብሎ እንዲቆይ
  alternative: ‘የክርስቶስ ሰውነት’ ብሎ ማስፋት
  rationale: ሰፊው አውድ ስለ ቤተ ክርስቲያን ቢናገርም፣ ይህ ቁጥር τὸ σῶμα ብቻ ይላል። ስለዚህ ምሳሌውን በጽሑፉ እንዳለ ማቆየት እንጂ አውዳዊውን ትርጓሜ ወደ ዋናው ጽሑፍ ማስገባት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። ‘አካል/አካላት’ የሰውነትን ምሳሌ በተፈጥሯዊ ቋንቋ ያቆያል፤ የግሪኩ አብራሪ ግንኙነት በ‘-ና’ ተገልጿል።
