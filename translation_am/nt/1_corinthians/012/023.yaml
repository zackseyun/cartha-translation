  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: am
  text: 'ክብራቸው ያነሰ እንደሆኑ የምናስባቸውን የሰውነት ክፍሎች[a] የበለጠ ክብር እንሰጣቸዋለን፤ ለእይታ የማይመቹ የሰውነታችን ክፍሎችም የበለጠ ተገቢ ገጽታ[b] አላቸው።


    [a] ወይም፣ “ብዙም ክብር የማይሰጣቸው ክፍሎች።”


    [b] ወይም፣ “የበለጠ ለእይታ የሚመች መልክ” ወይም “የበለጠ ውበት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብዙም ክብር የማይሰጣቸው ክፍሎች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የበለጠ ለእይታ የሚመች መልክ” ወይም “የበለጠ ውበት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: እንደሆኑ የምናስባቸውን
  rationale: δοκέω በዚህ ስፍራ ተጨባጭ ሁኔታን ሳይሆን የሰውን ግምገማ ያሳያል፤ ይህ አተረጓጎም የጳውሎስን ንጽጽር ይጠብቃል።
- source_word: ἀτιμότερα
  choice: ክብር ያነሳቸው
  rationale: የንጽጽር ደረጃውን ‘ያነሰ’ በሚለው ይጠብቃል፤ ከτιμή ጋር ያለውን የክብር ቃላዊ ተቃርኖም በግልጽ ያሳያል።
- source_word: τοῦ σώματος
  choice: የሰውነት ክፍሎች
  rationale: የሰውነት ምሳሌው ለአንቀጹ ዋና በመሆኑ በቀጥታ ተጠብቋል።
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: የበለጠ ክብር እንሰጣቸዋለን
  rationale: περιτίθημι ቃል በቃል ‘በላዩ ማኖር’ ማለት ቢችልም፣ ከክብር ጋር አማርኛው ‘ክብር መስጠት’ ተፈጥሯዊና ግልጽ ነው።
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: ለእይታ የማይመቹ የሰውነታችን ክፍሎች
  rationale: ቃሉ በሕዝብ ፊት ለመታየት የማይመችን ነገር ያመለክታል፤ ትርጉሙ አላስፈላጊ የሥነ ምግባር ኩነኔ ሳይጨምር የአካልና የማኅበራዊ አቀራረብ ሐሳቡን ያስተላልፋል።
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: የበለጠ ጨዋነት ይኖራቸዋል
  rationale: εὐσχημοσύνη ተገቢ መልክን፣ ሥርዓታማ አቀራረብን ወይም ጨዋነትን ያመለክታል፤ ‘ጨዋነት’ በዚህ የአካል መሸፈን አውድ ውስጥ አጭርና ተፈጥሯዊ ነው።
theological_decisions:
- issue: የሰውነት ምሳሌና ማኅበራዊ ክብር
  choice: ተጨባጩን የሰውነት ክፍሎች አነጋገር ማቆየት
  alternative: ንግግሩን በቀጥታ አነስተኛ ክብር ስላላቸው የቤተ ክርስቲያን አባላት ብቻ እንደሚናገር አድርጎ መተርጎም
  rationale: የጳውሎስ ክርክር በተፈጥሯዊው ሰውነት አያያዝና በክርስቶስ ሰውነት መካከል ባለው ምሳሌ ላይ የተመሠረተ ነው፤ ተጨባጩን ምስል ማቆየት መንፈሳዊ አተገባበሩ ከጽሑፉ እንዲወጣ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የአካል ክፍሎችን በግልጽ የሚያሳየው ንግግር ሳይለዝብ ተጠብቋል፤ ነገር ግን ጸያፍ ወይም ከልክ በላይ ሕክምናዊ ቃላት አልገቡም።
