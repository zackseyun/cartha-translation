  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: am
  text: ነገር ግን፣ እነዚህን ሁሉ የሚያከናውነው[a] አንዱና ያው መንፈስ[b] ነው፤ እርሱም እንደ ፈቃዱ[d] ለእያንዳንዱ ለየብቻ ያከፋፍላል[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚያስገኘው» ወይም «ውጤት እንዲኖራቸው የሚያደርገው»።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ፣ «አንዱና ያው መንፈስ»፤ ይህም ልዩ ልዩ ስጦታዎቹ ከአንድ ምንጭ እንደሚመጡ አጽንዖት ይሰጣል።
    reason: cross_reference
  - marker: c
    text: ወይም፣ «ለእያንዳንዱ ድርሻውን ይመድባል»።
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ «እንደ ምርጫው»። የግሪኩ ግስ መፈለግን፣ መምረጥን ወይም መሻትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: ነገር ግን፣ እነዚህን ሁሉ
  rationale: πάντα ταῦτα የተዘረዘሩትን የመንፈስ መገለጫዎች በሙሉ ያጠቃልላል፤ δέ ደግሞ ከዝርዝሩ ወደ አንድ ምንጭ የሚደረገውን መጠነኛ ንጽጽር ለማሳየት «ነገር ግን» ተብሏል።
- source_word: ἐνεργεῖ
  choice: የሚያከናውነው
  rationale: ቃሉ ንቁ አሠራርንና ውጤትን ማስገኘትን ያመለክታል። «ያከናውናል» የግሱን ኃይል ሳያጠብ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: አንዱና ያው መንፈስ
  rationale: የግሪኩ አገላለጽ ልዩ ልዩ ስጦታዎች ከአንድ እና ከዚያው ምንጭ መምጣታቸውን አጽንዖት ይሰጣል።
- source_word: διαιροῦν
  choice: ያከፋፍላል
  rationale: ይህ ተሳቢ ግስ መንፈሱ ሥራውን እያከናወነ ስጦታዎቹን ለሰዎች እንደሚመድብ ያሳያል፤ «ያከፋፍላል» የድርሻ መስጠትን ያስቀምጣል።
- source_word: ἰδίᾳ ἑκάστῳ
  choice: ለእያንዳንዱ ለየብቻ
  rationale: ἑκάστῳ የእያንዳንዱን ተቀባይ ነጠላ አከፋፋይነት፣ ἰδίᾳ ደግሞ ለግለሰቡ በተለየ ሁኔታ መሰጠቱን ያሳያል።
- source_word: καθὼς βούλεται
  choice: እንደ ፈቃዱ
  rationale: βούλεται ፈቃድን፣ ምርጫን ወይም ሐሳብን ያመለክታል። «እንደ ፈቃዱ» የመንፈሱን ሆን ብሎ የሚያደርግ ግላዊ አድራጊነት በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የπνεῦμα ማንነትና በβούλεται የተገለጠው ግላዊ አድራጊነት
  choice: «መንፈስ» የሚያመለክተው መንፈስ ቅዱስን ነው፤ «እንደ ፈቃዱ» የሚለውም የመንፈሱን ግላዊ ፈቃድ ያሳያል።
  alternative: የግሪኩን ሰዋሰዋዊ ጾታ በመከተል ግላዊነቱን ያልገለጠ አቀራረብ መጠቀም፣ ወይም «እንደተፈለገ» ብሎ አድራጊውን መተው።
  rationale: πνεῦμα በግሪክ ሰዋስው ገለልተኛ ጾታ ቢኖረውም፣ βούλεται ፈቃድን ለመንፈሱ ይሰጣል። ዐውደ ንባቡም መንፈሱን ስጦታዎችን በፈቃዱ የሚያከፋፍል ግላዊ መለኮታዊ አድራጊ አድርጎ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት «አንዱና ያው» ተጠብቋል፤ የስጦታ አከፋፈሉም ለእያንዳንዱ ለየብቻ መሆኑ በግልጽ ተቀምጧል።
