  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ግስ አልባ ዝርዝር ከቀደመው አውድ ጋር እንዲያያዝ በአማርኛም ተጨማሪ ግስ ሳይገባ ተጠብቋል። ‘መናፍስት’ እና ‘ልሳናት’ የሚሉት ቃላት የምንጩን አሻሚነት ይጠብቃሉ።
