  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: am
  text: ለሌላው ተአምራትን ማድረግ[a]፣ ለሌላው ትንቢት፣ ለሌላው መናፍስትን መለየት፣ ለሌላው የልሳናት ዓይነቶች[b]፣ ለሌላውም ልሳናትን መተርጎም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የኃይል ሥራዎች” ወይም “ኃያላን ሥራዎችን ማድረግ።”
    reason: lexical_alternative
  - marker: b
    text: “ልሳናት” የሚለው የግሪክኛ ቃል “ቋንቋዎች” ማለትም ሊሆን ይችላል፤ ስለዚህ “የቋንቋዎች ዓይነቶች” እና “ቋንቋዎችን መተርጎም” ተብሎም ሊተረጎም ይችላል። እዚህ “ልሳናት” የሚለው አባባል ቃሉ በመንፈሳዊ ስጦታዎች ዐውድ ያለውን አሻሚነት ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: ተአምራትን ማድረግ
  rationale: ቃል በቃል ‘የኃይሎች አሠራሮች’ የሚል ቢሆንም፣ በዚህ የመንፈሳዊ ስጦታዎች ዐውድ ተአምራዊ ሥራዎችን ያመለክታል። የተመረጠው አባባል በዘመናዊ አማርኛ ተፈጥሯዊ ነው፤ ቃል በቃል አማራጮቹም በማስታወሻ ተጠብቀዋል።
- source_word: προφητεία
  choice: ትንቢት
  rationale: ስጦታውን ሳያጠብ የሚገልጽ መደበኛና ግልጽ አማርኛ ነው።
- source_word: διακρίσεις πνευμάτων
  choice: መናፍስትን መለየት
  rationale: የመናፍስቱን ማንነት ወይም ምንጭ ሳይወስን፣ የመመርመርና የመለየትን ሐሳብ ያስተላልፋል።
- source_word: γένη γλωσσῶν
  choice: የተለያዩ ልሳናት
  rationale: γένη የዓይነቶችን ብዛት ያመለክታል፤ ‘ልሳናት’ ደግሞ ቃሉ ልሳናትን ወይም ቋንቋዎችን ሊያመለክት የሚችለውን አሻሚነት ይጠብቃል።
- source_word: ἑρμηνεία γλωσσῶν
  choice: ልሳናትን መተርጎም
  rationale: የልሳናቱን ይዘት ለሌሎች እንዲገባ ማድረግን በቀላልና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἄλλῳ / ἑτέρῳ
  choice: ለሌላው
  rationale: ስጦታዎቹ ለተለያዩ ሰዎች መከፋፈላቸውን ያሳያል፤ በሁለቱ የግሪክኛ ቃላት መካከል በዚህ ዐውድ የማይረጋገጥ ጠንካራ ልዩነት አልተጫነም።
theological_decisions:
- issue: በመንፈሳዊ ስጦታዎች ዝርዝር ውስጥ δυνάμεων የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘ተአምራትን ማድረግ’ ተብሏል።
  alternative: ‘የኃይል ሥራዎች’ ወይም ‘ኃያላን ሥራዎችን ማድረግ’
  rationale: በዚህ ዐውድ δυνάμεις በአብዛኛው ተአምራዊ ሥራዎችን ያመለክታል፤ ሆኖም ቃሉ በቀጥታ ‘ኃይሎች’ የሚለውን ስሜት ስላለው አማራጩ በማስታወሻ ተጠብቋል።
- issue: γλωσσῶν ልሳናትን ወይስ ቋንቋዎችን ያመለክታል?
  choice: በዋናው ጽሑፍ ‘ልሳናት’ ተብሏል።
  alternative: ‘ቋንቋዎች’
  rationale: የግሪክኛው ቃል ሁለቱንም ሊያመለክት ስለሚችል፣ ‘ልሳናት’ በማለት ጉዳዩ የታወቁ የሰው ቋንቋዎችን፣ ልዩ መንፈሳዊ ንግግርን ወይም ሰፊ ምድብን ስለማመልከቱ ያለው ውጥረት አልተፈታም።
- issue: በ‘መናፍስትን መለየት’ ውስጥ πνευμάτων የሚያመለክተው
  choice: ‘መናፍስት’ ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: መንፈሳዊ ንግግሮች፣ ከንግግሮች በስተጀርባ ያሉ መናፍስት፣ የሰው መናፍስት ወይም ክፉ መናፍስት
  rationale: ግሪክኛው ትክክለኛውን ማጣቀሻ አይወስንም፤ ስለዚህ አንድ የትርጓሜ ድምዳሜ ወደ ጽሑፉ አልገባም።
