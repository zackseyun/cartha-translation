  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: am
  text: ምክንያቱም፣ እኛ ሁላችን—አይሁድም ሆንን ግሪኮች፣ ባሪያዎችም ሆንን ነጻ ሰዎች—በአንድ መንፈስ[a] ወደ አንድ አካል ተጠመቅን፤ ሁላችንም አንድ መንፈስ እንድንጠጣ ተደረግን[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በአንድ መንፈስ” የሚለው “በአንድ መንፈስ አማካይነት” ወይም “በአንድ መንፈስ ውስጥ” ተብሎም ሊገባ ይችላል፤ የግሪኩ ἐν ሁኔታን/ስፍራን ወይም መንገድን/አድራጊነትን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: “አንድ መንፈስ” የሚለው በአውዱ መንፈስ ቅዱስን አጥብቆ ያመለክታል፤ አንዳንዶች ግን የጋራ መንፈሳዊ እውነታን እንደሚያመለክት ይወስዳሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ምክንያቱም (በአማርኛው አገባብ በሙሉ ዓረፍተ ነገሩ የተገለጸ)
  rationale: ጥቅሱ ከቀደመው ሐሳብ ጋር ያለውን አብራሪና አጽንዖታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ ቃሉን በግድ መድገም ዓረፍተ ነገሩን ከባድ ያደርገዋል።
- source_word: ἐν ἑνὶ πνεύματι
  choice: በአንድ መንፈስ
  rationale: የአማርኛው ‘በ’ መስተዋድድ ስፍራን፣ መንገድን ወይም አድራጊነትን ሊያመለክት ስለሚችል የግሪኩን ἐν እውነተኛ አሻሚነት ሳይወስን ይጠብቃል።
- source_word: ἡμεῖς πάντες
  choice: እኛ ሁላችን
  rationale: ግልጽ ተውላጠ ስሙንና πάντεςን በመጠበቅ የግሪኩን የጋራ አጽንዖት ያስተላልፋል።
- source_word: εἰς ἓν σῶμα ἐβαπτίσθημεν
  choice: ወደ አንድ አካል ተጠመቅን
  rationale: εἰς የመግባትንና የመካተትን ውጤት ያሳያል፤ ‘ተጠመቅን’ ደግሞ በጳውሎሳዊ የማኅበር አገባብ የተለመደውን የጥምቀት ቃል ይጠብቃል።
- source_word: Ἰουδαῖοι εἴτε Ἕλληνες
  choice: አይሁድም ሆንን ግሪኮች
  rationale: በዚህ የብሔርና የሃይማኖት ንጽጽር Ἰουδαῖοι ‘አይሁድ’፣ Ἕλληνες ደግሞ በቀጥታ ‘ግሪኮች’ ነው፤ ‘አሕዛብ’ ብሎ ማስፋት አልተመረጠም።
- source_word: δοῦλοι εἴτε ἐλεύθεροι
  choice: ባሪያዎችም ሆንን ነጻ ሰዎች
  rationale: በሕጋዊና ማኅበራዊ ባርነት እና ነጻነት መካከል ያለውን ግልጽ ንጽጽር በትክክል ያሳያል፤ ‘አገልጋዮች’ የባርነቱን ሁኔታ ያለሰልሳል።
- source_word: πάντες ἓν πνεῦμα ἐποτίσθημεν
  choice: ሁላችንም ከአንድ መንፈስ እንድንጠጣ ተሰጠን
  rationale: የποτίζωን የማጠጣት ምሳሌና የግሱን ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል፤ ‘ከ’ የመጠጡን ምንጭ ግልጽ ያደርጋል።
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι መንፈስን እንደ የጥምቀቱ አድራጊ ወይስ እንደ ሁኔታ/ስፍራ ማቅረብ
  choice: በአንድ መንፈስ
  alternative: በአንድ መንፈስ አማካይነት / በአንድ መንፈስ ውስጥ
  rationale: ‘በ’ የግሪኩን ሰፊ የትርጉም ክልል በአማርኛ ሊሸከም ስለሚችል አንድን አወዛጋቢ ሥነ መለኮታዊ ንባብ ብቻ አያስገድድም።
- issue: በሁለተኛው ክፍል ἓν πνεῦμα መንፈስ ቅዱስን ወይስ የጋራ መንፈሳዊ እውነታን ማመልከቱ
  choice: አንድ መንፈስ
  alternative: አንድ መንፈሳዊ እውነታ
  rationale: የአውዱ ዋና አቅጣጫ ወደ መንፈስ ቅዱስ ያመለክታል፤ ሆኖም የግዕዝ ፊደል እንደ እንግሊዝኛ የአቢይ/ንዑስ ፊደል ልዩነት ስለሌለው አማራጩ በማስታወሻ ተጠብቋል።
- issue: δοῦλοι በማኅበራዊ ደረጃ ንጽጽር ውስጥ
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: ከἐλεύθεροι ጋር ያለው ንጽጽር የታሰረ ማኅበራዊና ሕጋዊ ሁኔታን በግልጽ ስለሚያሳይ ‘ባሪያዎች’ ትክክለኛ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር አንድነት ተጠብቆ፣ ሁለቱ ጥንድ ንጽጽሮች በሰረዝ ተለይተዋል።
