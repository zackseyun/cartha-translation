language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: am
  text: አንዱ የአካል ክፍል ቢሠቃይ፣ የአካል ክፍሎቹ ሁሉ ከእርሱ ጋር ይሠቃያሉ፤ አንድ የአካል ክፍል ክብር ቢያገኝ[a]፣ የአካል ክፍሎቹ ሁሉ ከእርሱ ጋር ደስ ይላቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቢከብር።” በዚህ አውድ ውስጥ ትርጉሙ አንዱ የአካል ክፍል ክብር ሲያገኝ መላው አካል ደስታውን እንደሚካፈል የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: ቢ…፣ …ቢ…
  rationale: የግሪኩን ሁለት ተያያዥ ሁኔታዎች በተፈጥሯዊ የአማርኛ ሁኔታዊ አገላለጽ ያቀርባል።
- source_word: πάσχει
  choice: ቢሠቃይ
  rationale: አካላዊም ሆነ ሌላ ዓይነት መከራን ሳይገድብ የግሪኩን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἓν μέλος
  choice: አንዱ የአካል ክፍል
  rationale: ἓν ያለውን አንድነት ግልጽ ያደርጋል፤ ‘የአካል ክፍል’ ደግሞ የሰውነትንና የማኅበሩን ዘይቤ ያስቀጥላል።
- source_word: συμπάσχει
  choice: ከእርሱ ጋር ይሠቃያሉ
  rationale: በσυν- የተገለጠውን አብሮ መከራ መቀበል በግልጽ ያሳያል።
- source_word: πάντα τὰ μέλη
  choice: የአካል ክፍሎቹ ሁሉ
  rationale: የአካል ዘይቤውንና በሁለቱ ሐረጎች ያለውን ድግግሞሽ ይጠብቃል።
- source_word: δοξάζεται
  choice: ክብር ቢያገኝ
  rationale: በዚህ የአካል ክፍሎች መተሳሰብ አውድ ውስጥ ያለውን ክብር መቀበል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μέλος
  choice: አንድ የአካል ክፍል
  rationale: በሁለተኛው ሐረግ ግሪኩ ἕν ባይኖረውም፣ ያልተወሰነውን ነጠላ ስም በተፈጥሯዊ አማርኛ ለማቅረብ ‘አንድ’ ተጠቅሟል።
- source_word: συγχαίρει
  choice: ከእርሱ ጋር ደስ ይላቸዋል
  rationale: የጋራ ደስታን የሚያመለክተውን συν- ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በአካሉ ዘይቤ ውስጥ የδοξάζεται ትርጉም
  choice: ክብር ቢያገኝ
  alternative: ክብር ቢጎናጸፍ / ቢከብር
  rationale: የቅርብ አውዱ የአካል ክፍሎችን እርስ በርስ መተሳሰብ ይመለከታል፤ ስለዚህ ሐረጉ መለኮታዊ ወይም የፍጻሜ ዘመን ክብርን በግድ ሳያስገባ ማኅበራዊ ክብርን ይገልጻል። ሆኖም የ‘ክብር’ ቃል የግሪኩን ሰፊ የክብር ገጽታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የአካል ክፍል’ የሰውነት ዘይቤውን በግልጽ ሲጠብቅ፣ ‘ከእርሱ ጋር’ የሚለው የጋራ መከራንና ደስታን አጉልቶ ያሳያል። የግሪኩን ሥርዓተ ነጥብና ትይዩ አወቃቀር ለማስጠበቅ ከፊል ነጥብ ተጠቅሟል።
