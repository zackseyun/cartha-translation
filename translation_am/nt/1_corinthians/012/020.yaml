    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: እንደ ሆነው
  rationale: ከቀደመው መላምታዊ ንግግር በተቃራኒ አሁን ያለውን እውነታ ያመለክታል፤ በዚህ ዐውድ ጊዜን ብቻ ከሚያመለክተው «አሁን» ይልቅ «እንደ ሆነው» የክርክሩን አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ተቃርኖና ወደ ዋናው ሐሳብ መመለስ ያሳያል።
- source_word: πολλὰ ... μέλη
  choice: የአካል ክፍሎች ብዙ ናቸው
  rationale: μέλη በሰውነት ምሳሌው ውስጥ ሰውነትን የሚያ组成ትን ክፍሎች ያመለክታል፤ «የአካል ክፍሎች» ምስሉን ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: μὲν ... δὲ
  choice: ብዙ ናቸው፤ አካሉ ግን አንድ ነው
  rationale: የብዙነትና የአንድነት ሚዛናዊ ንጽጽርን ያሳያል፤ ሁለቱን ቅንጣቶች ቃል በቃል ሳይደግም በአማርኛ የሚፈለገውን ተቃርኖ በ«ግን» ይገልጣል።
- source_word: ἓν
  choice: አንድ
  rationale: ከብዙ ክፍሎች ጋር በተቃርኖ የአካሉን አንድነት ያጎላል።
- source_word: σῶμα
  choice: አካል
  rationale: የጳውሎስን የሰውነት ምሳሌና በልዩነት ውስጥ ያለውን አንድነት ይጠብቃል፤ «አካል» በዚህ ዐውድ ግልጽና የተለመደ ነው።
theological_decisions:
- issue: በሰውነት ምሳሌው ውስጥ μέλη የሚለውን መተርጎም
  choice: የአካል ክፍሎች
  alternative: ብልቶች
  rationale: «የአካል ክፍሎች» ሰውነታዊውን ምስል በዘመናዊ አማርኛ ግልጽ ያደርጋል፤ «ብልቶች» ከግሪኩ ጋር ይበልጥ ቀጥተኛ ቢሆንም በዘመናዊ አጠቃቀም የተወሰነ ወይም አሻሚ ትርጉም ሊያስነሳ ይችላል፤ ስለዚህ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ሴሚኮሎኑ በብዙ ክፍሎችና በአንድ አካል መካከል ያለውን ሚዛናዊ ተቃርኖ ያሳያል።
