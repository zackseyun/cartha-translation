id: 1CO.2.8
reference: 1 Corinthians 2:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: am
  text: ይህችንም የዚህ ዘመን ገዥዎች[a] አንዳቸውም አላወቋትም፤ ቢያውቋት ኖሮ፣ የክብርን ጌታ ባልሰቀሉት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የዚህ ዘመን ገዥዎች” የሚለው ሰብዓዊ ባለሥልጣናትን፣ መንፈሳዊ ኃይላትን፣ ወይም ሁለቱንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: ይህችንም
  rationale: የሴት ጾታ ነጠላ አንጻራዊ ተውላጠ ስም ቀደም ሲል የተጠቀሰችውን ‘ጥበብ’ ያመለክታል፤ በአማርኛ ይህን ማጣቀሻ በግልጽና በተፈጥሯዊ ሁኔታ ያስቀጥላል።
- source_word: ἀρχόντων
  choice: ገዥዎች
  rationale: ሥልጣንን የሚጠቀሙ አካላትን ያመለክታል፤ ሰብዓዊ መሪዎችን፣ መንፈሳዊ ኃይላትን ወይም ሁለቱንም ሊያካትት የሚችለውን ስፋት አይዘጋም።
- source_word: αἰῶνος τούτου
  choice: የዚህ ዘመን
  rationale: αἰών እዚህ ከቦታዊ ‘ዓለም’ ይልቅ ዘመናዊ ሥርዓትን ወይም የጊዜ ክፍልን ያመለክታል።
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: አላወቋትም / ቢያውቋት ኖሮ
  rationale: ‘ማወቅ’ የግሪኩን ግስ በቀጥታ ይወክላል፤ ሁለተኛው አገላለጽ እውነታን የሚቃረን የሁኔታ ንግግርን በተፈጥሯዊ አማርኛ ያቀርባል። የሴት ጾታ ተሳቢ ቅጥ ‘ጥበብን’ ይመለከታል።
- source_word: κύριον τῆς δόξης
  choice: የክብርን ጌታ
  rationale: የግሪኩን የባለቤትነት አወቃቀርና ከፍ ያለ ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: ἐσταύρωσαν
  choice: ባልሰቀሉትም ነበር
  rationale: የመስቀል ላይ ሞትን በታሪካዊ ግልጽነት ይገልጣል፤ ከእውነታ ተቃራኒውንም ውጤት ያሳያል።
theological_decisions:
- issue: ‘የዚህ ዘመን ገዥዎች’ ማንነት
  choice: ማንነታቸውን ሳይወስን ‘የዚህ ዘመን ገዥዎች’ ተብሎ ተተርጉሟል።
  alternative: ሰብዓዊ የፖለቲካ ወይም የሃይማኖት ገዥዎች፤ መንፈሳዊ ወይም ክፉ ኃይላት፤ ወይም ሁለቱንም የሚያካትት ድርብ ማጣቀሻ።
  rationale: የግሪኩ ሐረግ እነዚህን አማራጮች ሊሸከም ስለሚችል፣ ዋናው ጽሑፍ አሻሚነቱን እንዳለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይህችን’ እና የሴት ጾታ ተሳቢ ቅጦች በቀደመው ዐውድ ወደተጠቀሰችው ‘ጥበብ’ የሚያመለክቱ ሲሆን፣ ሐረጉ እንደ ቀጣይ ንዑስ አንቀጽ መሆኑን ይጠብቃሉ።
