  - severity: low
    issue: “ከንቱ እየሆኑ ያሉት” is understandable but less idiomatic and less specific about καταργέω’s sense of being rendered ineffective.
    rationale: “ኃይላቸው እየተወገደ ያለ” naturally conveys an ongoing removal of efficacy without deciding whether the rulers are human, spiritual, or both.
