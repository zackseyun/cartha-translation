  verdict: revise
  source_fidelity: The draft correctly renders the repeated σοφία as “ጥበብ,” preserves αἰών as “ዘመን,” leaves ἄρχοντες broad as “ገዢዎች,” and expresses the ongoing passive force of καταργουμένων. However, “ይህም” is a less precise antecedent for the second, explicitly repeated “wisdom,” and the sentence can more clearly retain the Greek contrast without altering its ambiguity.
  naturalness: The revision uses fluent modern standard Amharic. “ይህች ጥበብ” makes the referent explicit and produces a more natural transition. “ኃይላቸው እየተወገደ ያለ” is clearer than “ከንቱ እየሆኑ ያሉት” while retaining the process implied by the present passive participle.
  terminology: “የበሰሉት,” “ጥበብ,” “ዘመን,” and “ገዢዎች” are appropriate. The footnotes preserve the lexical option for τέλειοι, the range of καταργέω, and the disputed referent of “rulers of this age” without resolving it doctrinally.
