  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: am
  text: ነገር ግን በበሰሉት[a] መካከል ጥበብን እንናገራለን፤ ይህች ጥበብ ግን የዚህ ዘመን ወይም ኃይላቸው እየተወገደ ያለ[b] የዚህ ዘመን ገዢዎች[c] ጥበብ አይደለችም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍጹማን በሆኑት”፤ እዚህ ላይ ምናልባት በመንፈሳዊ የበሰሉትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እያለፉ ያሉት፣” “እየተሻሩ ያሉት፣” ወይም “ዋጋ ቢስ እየተደረጉ ያሉት።”
    reason: lexical_alternative
  - marker: c
    text: “የዚህ ዘመን ገዢዎች” የሚለው የሰው ባለሥልጣናትን፣ መንፈሳዊ ኃይላትን፣ ወይም ሁለቱንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: ጥበብን / ጥበብ
  rationale: የσοφία መደበኛና ተፈጥሯዊ አማርኛ አቻ ነው፤ በግሪኩ ያለውን ድግግሞሽ ለመጠበቅ በሁለቱም ስፍራ ተደግሟል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው አውድ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λαλοῦμεν
  choice: እንናገራለን
  rationale: λαλέω በመሠረቱ “መናገር” ማለት ስለሆነ፣ “እናውጃለን” ከማለት ይልቅ ቀጥተኛውን ፍቺ ይጠብቃል።
- source_word: ἐν τοῖς τελείοις
  choice: በበሰሉት መካከል
  rationale: በዚህ አውድ τέλειοι ኃጢአት የሌለባቸውን ሳይሆን የደረሱትን ወይም የበሰሉትን ሰዎች ማመልከቱ ይበልጥ የተፈጥሮ ነው፤ “መካከል” ደግሞ የግሪኩን ፈሊጣዊ አጠቃቀም ያስተላልፋል።
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: የዚህ ዘመን ጥበብ አይደለም
  rationale: αἰώνን “ዘመን” ብሎ መተርጎም ከκόσμος (“ዓለም”) ጋር ሳያደባልቅ ጊዜያዊውንና የአሁኑን ሥርዓት የሚያመለክተውን ስፋት ይጠብቃል።
- source_word: ἀρχόντων
  choice: ገዢዎች
  rationale: ቃሉ ሰብዓዊ ገዢዎችን፣ መንፈሳዊ ኃይላትን፣ ወይም ሁለቱንም ሊያመለክት ስለሚችል፣ ሰፊው “ገዢዎች” የሚለው ተመርጧል።
- source_word: τῶν καταργουμένων
  choice: ከንቱ እየሆኑ ያሉት
  rationale: የአሁን ጊዜ ተሳቢ አንቀጹን ቀጣይነት በመጠበቅ፣ ኃይል ማጣትንና ወደ ምንም መምጣትን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: “የዚህ ዘመን ገዢዎች” የሚያመለክተው
  choice: ሰብዓዊ ወይም መንፈሳዊ መሆናቸውን ሳይወስን “ገዢዎች” ተብሎ በሰፊው ተተርጉሟል።
  alternative: የፖለቲካና የሃይማኖት ሰብዓዊ ገዢዎች፣ መንፈሳዊ ኃይላት፣ ወይም ሁለቱም።
  rationale: የግሪኩ ሐረግ ከእነዚህ አንዱን ብቻ እንድንመርጥ አያስገድድም፤ ስለዚህ ዋናው ጽሑፍ አሻሚነቱንና ሥነ መለኮታዊ ውጥረቱን ጠብቋል።
