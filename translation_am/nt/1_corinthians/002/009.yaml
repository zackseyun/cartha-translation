base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: am
  text: ነገር ግን እንደተጻፈው፦ “ዓይን ያላየው፣ ጆሮም ያልሰማው፣ ወደ ሰው ልብም ያልገባው[a][b]—እግዚአብሔር ለሚወዱት ያዘጋጀው ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወደ ሰው ልብ ያልገባው” የሚለው “በሰው ልብ ያልታሰበው” ወይም “ለማንም ያልታሰበው” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሰው” የሚለው ቃል ወንድንና ሴትን ጨምሮ የሰው ልጆችን በአጠቃላይ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: የቅዱሳት መጻሕፍትን የጥቅስ መግቢያ ቀመርና የግሱን የተፈጸመ ሁኔታ ይጠብቃል።
- source_word: Ἃ ... ὅσα
  choice: ያላየው ... ያዘጋጀው
  rationale: በግሪኩ ያለውን የመነሻና የድጋሚ ማመልከቻ አወቃቀር በአማርኛ ስማዊ የግስ ቅርጾች ያቀርባል፤ የግጥም ትይዩነቱንም ይጠብቃል።
- source_word: ὀφθαλμὸς
  choice: ዓይን
  rationale: ነጠላ ቁጥሩንና አጠቃላይ አመልካችነቱን በቀጥታ ያስተላልፋል።
- source_word: οὖς
  choice: ጆሮ
  rationale: ከ“ዓይን” ጋር ያለውን ነጠላ ቁጥር ትይዩነት ይጠብቃል።
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: በሰውም ልብ ያልታሰበው
  rationale: የግሪኩ ቃል በቃል “በሰው ልብ ላይ ያልወጣው” የሚል ምስላዊ አነጋገር ነው። “በልብ ያልታሰበው” በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የሐሳቡን ይዘት ያስተላልፋል፤ “ልብ”ንም አይተካም።
- source_word: ἡτοίμασεν
  choice: ያዘጋጀው
  rationale: እግዚአብሔር ያከናወነውን የተጠናቀቀ ድርጊት የሚገልጽ ተፈጥሯዊ የአማርኛ አቀራረብ ነው።
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: ለሚወዱት
  rationale: በአሁን ጊዜ ቦዝ አንቀጹ የተገለጸውን ቀጣይ ባሕርይ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የአጠቃላይ አመልካች ἀνθρώπου አተረጓጎም
  choice: በሰው ልብ
  alternative: በሰው ልጅ ልብ / በማንም ልብ
  rationale: “ሰው” የግሪኩን ነጠላ አጠቃላይ አመልካች ይጠብቃል፤ በዚህ አውድ ወንድንና ሴትን ጨምሮ ሰውን ሁሉ ያመለክታል።
- issue: የἋ ... ὅσα ዝምድና
  choice: የመጀመሪያዎቹን ሦስት ሐረጎች ከእግዚአብሔር ካዘጋጀው ጋር በሰረዝና “ነው” ማያያዝ
  alternative: አረፍተ ነገሩን ያለ “ነው” እንደ ስማዊ ሐረግ መተው
  rationale: የግሪኩን ድጋሚ አመልካችና ግጥማዊ ውጥረት ይጠብቃል፤ “ነው” ደግሞ በአማርኛ የሐሳቡን ትስስር ግልጽ ያደርጋል እንጂ አዲስ ሥነ መለኮታዊ ይዘት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ግጥማዊ ትይዩነት በ“ዓይን… ጆሮ… ልብ” ቅደም ተከተልና በተደጋጋሚ ስማዊ የግስ ቅርጽ ተጠብቋል።
