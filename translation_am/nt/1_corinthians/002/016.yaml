lexical_decisions:
- source_word: τίς γὰρ ἔγνω
  choice: ያወቀ ማን ነው?
  rationale: የግሪኩን ርቱዕ ጥያቄና ከቀደመው ሐሳብ ጋር ያለውን ማብራሪያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል፤ γὰρ በተናጠል መተርጎም አማርኛውን ከባድ ስለሚያደርግ በአገባቡ ውስጥ ተካቷል።
- source_word: νοῦν κυρίου
  choice: የጌታን ሐሳብ
  rationale: νοῦς እዚህ የማሰብን ይዘት፣ ግንዛቤንና አሳብን ያመለክታል፤ ‘ሐሳብ’ በዚህ የጥቅስ አገባብ ተፈጥሯዊና ክቡር ነው። κύριος የመጽሐፍ ቅዱስን የኢሳይያስ ድምፅ ለመጠበቅ ‘ጌታ’ ተብሏል።
- source_word: ὃς συμβιβάσει αὐτόν
  choice: እንዲያስተምረው
  rationale: συμβιβάζω በዚህ አገባብ ‘ማስተማር/መምራት’ የሚለውን ፍቺ ይይዛል፤ የግሪኩን አንጻራዊ ሐረግ በተፈጥሯዊ የዓላማ/ውጤት አገላለጽ ያስተላልፋል።
- source_word: ἡμεῖς δὲ
  choice: እኛ ግን
  rationale: በሰው አለማወቅና በአማኞች የተነገረው ይዞታ መካከል ያለውን ጠንካራ ንጽጽር ይጠብቃል።
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: የመሲሑ ሐሳብ አለን
  rationale: ἔχομεν ቀጥተኛ የይዞታ መግለጫ ስለሆነ ‘አለን’ ተብሏል። Χριστός እዚህ የቅቡዕነት ማዕረጉን ስለሚያሳይ ‘መሲሕ’ ተመርጧል።
theological_decisions:
- issue: νοῦν የሚለው ቃል የእውቀት ብቻ ወይስ የአስተሳሰብና ዝንባሌ ስፋት አለው?
  choice: ሐሳብ
  alternative: አእምሮ / አስተሳሰብ
  rationale: ‘ሐሳብ’ የጌታ የማሰብ ይዘትንና ፈቃድን ሳይገድብ ይገልጣል፤ ጽሑፉ አማኞች በተፈጥሮ ሁሉን ያውቃሉ የሚል የተጋነነ ድምዳሜ እንዳይሰጥም ይረዳል።
- issue: Χριστοῦ እንደ ማዕረግ ወይስ እንደ ስም መተርጎም
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: በዚህ ሐረግ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ በግልጽ ይሰማል፤ ‘መሲሕ’ ይህን የዕብራይስጥ መሠረት ያቆያል።
