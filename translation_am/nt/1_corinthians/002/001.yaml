language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: am
  text: እኔም፣ ወንድሞች[a]፣ ወደ እናንተ በመጣሁ ጊዜ፣ የእግዚአብሔርን ምስክርነት[b] ለእናንተ ሳውጅ በላቀ ንግግር ወይም በጥበብ አልመጣሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” የሚለው ቃል በአጠቃላይ በጉባኤው ውስጥ ያሉ አማኞችን፣ ሴቶችንም ጨምሮ፣ ሊያመለክት ይችላል።
    reason: cultural_note
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “የእግዚአብሔርን ምስጢር” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: እኔም
  rationale: የκαίን አያያዥ ኃይልና በἐγώ ላይ ያለውን አጽንዖት ሳያጋንን ይጠብቃል።
- source_word: ἐλθὼν … ἦλθον
  choice: በመጣሁ ጊዜ … አልመጣሁም
  rationale: የግሪኩን አሳታፊ ግስና ዋና ግስ በተፈጥሯዊ የአማርኛ ጊዜ ሐረግ ይገልጻል፤ የ‘መምጣት’ን ድግግሞሽም ይጠብቃል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩን ተባዕታይ የጥሪ ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ በዚህ አውድ ሴቶችንም ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: በላቀ ንግግር ወይም ጥበብ
  rationale: ὑπεροχή የሚያመለክተውን ልቀትና የንግግር ግርማ በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: καταγγέλλων
  choice: ሳውጅላችሁ
  rationale: የአሳታፊውን ግስ ከዋናው አረፍተ ነገር ጋር በተፈጥሯዊ ሁኔታ ያገናኛል፤ የሕዝብ ፊት ማወጅንም ያሳያል።
- source_word: μαρτύριον
  choice: ምስክርነት
  rationale: የSBLGNTን ዋና ንባብ በቀጥታ ይከተላል፤ የታወቀው ተለዋጭ ንባብ በማስታወሻ ተጠቅሷል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: የግሪኩን የባለቤትነት አገባብ በመጠበቅ ምስክርነቱ ከእግዚአብሔር የመጣ ወይም ስለ እግዚአብሔር የሆነ መሆኑን አስቀድሞ አይወስንም።
theological_decisions:
- issue: በμαρτύριον ላይ ያለው የጽሑፍ ልዩነት
  choice: የእግዚአብሔርን ምስክርነት
  alternative: የእግዚአብሔርን ምሥጢር
  rationale: የSBLGNT ዋና ጽሑፍ μαρτύριον (‘ምስክርነት’) ይላል። μυστήριον (‘ምሥጢር’) የሚለው ጠቃሚ ተለዋጭ ንባብ በግርጌ ማስታወሻ ተጠብቋል።
- issue: τοῦ θεοῦ የሚለው የባለቤትነት አገባብ
  choice: የእግዚአብሔርን
  alternative: ከእግዚአብሔር የመጣውን / ስለ እግዚአብሔር የሆነውን
  rationale: የግሪኩ አገባብ ከምንጭ ወይም ከይዘት ጋር ሊያያዝ ስለሚችል፣ ትርጉሙ ያንን ግልጽ ያልሆነ ግንኙነት አልፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እኔም’ የጳውሎስን አጽንዖት፣ ‘ሳውጅላችሁ’ ደግሞ ይፋዊ ማወጁን ይጠብቃሉ። የግርጌ ምልክቶቹ ከሚመለከቷቸው ቃላት ቀጥለው ተቀምጠዋል።
