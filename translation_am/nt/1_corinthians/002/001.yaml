  to: እኔም፣ ወንድሞች[a]፣ ወደ እናንተ በመጣሁ ጊዜ፣ የእግዚአብሔርን ምስክርነት[b] ለእናንተ ሳውጅ በላቀ ንግግር ወይም በጥበብ አልመጣሁም።
