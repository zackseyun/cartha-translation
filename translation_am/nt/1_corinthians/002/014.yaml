base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: am
  text: ተፈጥሯዊው ሰው[a] የእግዚአብሔር መንፈስ የሆኑትን ነገሮች አይቀበልም፤ ለእርሱ ሞኝነት ናቸውና፤ በመንፈሳዊ መንገድ የሚመረመሩ[b] ስለሆኑም ሊያውቃቸው አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መንፈሳዊ ያልሆነው ሰው»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የሚመዘኑ» ወይም «የሚለዩ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: ተፈጥሯዊው
  rationale: ከπνευματικός ጋር ያለውን ንጽጽር በማቆየት፣ ቃሉን ‘ሥጋዊ’ ብሎ ከሌላው የጳውሎስ ቃል ጋር እንዳይቀላቀል ያደርጋል። አማራጩ በማስታወሻ ተሰጥቷል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በዚህ አውድ ለማንኛውም ሰው የሚወክለውን አጠቃላይ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δέχεται
  choice: አይቀበልም
  rationale: መልእክቱን እንደ እውነት መቀበልን ወይም አለመቀበልን በግልጽ ያሳያል።
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: የእግዚአብሔርን መንፈስ ነገሮች
  rationale: የግሪኩን ሰፊ የባለቤትነት ግንኙነት ይጠብቃል፤ ነገሮቹ የሚገለጡበትን ወይም የሚሰጡበትን መንገድ ከምንጩ በላይ አይወስንም።
- source_word: μωρία
  choice: ሞኝነት
  rationale: በ1ኛ ቆሮንቶስ ውስጥ በተደጋጋሚ የሚታየውን በእግዚአብሔር ጥበብና በሰው ፍርድ መካከል ያለውን ንጽጽር ይጠብቃል።
- source_word: γνῶναι
  choice: ሊያውቃቸው
  rationale: የግሪኩን ‘ማወቅ’ ቀጥተኛ ኃይል ያቆያል፣ በአውዱም ነገሮቹን ማስተዋልና እውነተኛነታቸውን መገንዘብን ሊያካትት ይችላል።
- source_word: πνευματικῶς
  choice: በመንፈሳዊ መንገድ
  rationale: የማመዛዘኑን ሁኔታ ወይም ዘርፍ የሚገልጠውን ተውሳከ ግስ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἀνακρίνεται
  choice: የሚመረመሩ
  rationale: የመመርመር፣ የመመዘንና የመለየትን ትርጉም ሊይዝ የሚችለውን ግስ በማይገድብ ቃል ይተረጉማል።
theological_decisions:
- issue: Ψυχικὸς ἄνθρωπος ከመንፈሳዊ ማስተዋል ጋር ያለው ንጽጽር
  choice: ተፈጥሯዊው ሰው
  alternative: መንፈሳዊ ያልሆነው ሰው
  rationale: የግሪኩን ንጽጽርና አሻሚነት ያቆያል፤ ‘መንፈስ የሌለው’ ብሎ ከጽሑፉ በላይ የሆነ ትርጓሜ አያስገባም።
- issue: ἀνακρίνεται የሚያመለክተው መለየት ወይም መመዘን
  choice: የሚመረመሩ
  alternative: የሚመዘኑ / የሚለዩ
  rationale: በዚህ አውድ ትክክለኛ መንፈሳዊ ግንዛቤን ሲያመለክትም፣ ቃሉ ያለውን የመመርመርና የመመዘን ስፋት ሙሉ በሙሉ አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ተከፍሏል፤ ምክንያታዊ ግንኙነቱ በ‘-ና’ እና ‘ስለሆኑም’ ተጠብቋል።
