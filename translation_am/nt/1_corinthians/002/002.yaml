  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: am
  text: በመካከላችሁ ኢየሱስ መሲሕን—የተሰቀለውን እርሱን—ከማወቅ በቀር ሌላ ምንም እንዳላውቅ ወስኜ ነበርና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκρινά
  choice: ወስኜ ነበር
  rationale: በዚህ አውድ κρίνω የፍርድ ውሳኔን ሳይሆን ጸንቶ የተወሰነ ዓላማን ያመለክታል፤ «ወስኜ ነበር» የጳውሎስን ሆን ብሎ መወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τι εἰδέναι
  choice: ሌላ ምንም ላለማወቅ
  rationale: ከ οὐ እና εἰ μὴ ጋር የተገናኘው ሐረግ ከተጠቀሰው በቀር ሌላ ምንም እንዳይታወቅ የሚገድብ ነው፤ ይህ አገላለጽ ያንን ገዳቢ ኃይል ይጠብቃል።
- source_word: ἐν ὑμῖν
  choice: በመካከላችሁ
  rationale: የጳውሎስን በቆሮንቶስ ሰዎች መካከል መገኘትና ማገልገል የሚያመለክት ቀጥተኛና ተፈጥሯዊ አገላለጽ ነው።
- source_word: εἰ μὴ
  choice: ከ… በቀር
  rationale: የግሪክኛውን የማግለል አወቃቀር በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: Χριστόν
  choice: መሲሕን
  rationale: በዚህ ስፍራ Χριστός የኢየሱስን መሲሓዊ ማንነትና ተግባር እንደ ማዕረግ ያጎላል፤ «መሲሕ» የማዕረጉን ትርጉም በግልጽ ያስተላልፋል።
- source_word: τοῦτον ἐσταυρωμένον
  choice: እርሱንም እንደተሰቀለ
  rationale: «እርሱንም» የአመልካች ተውላጠ ስሙን አጽንዖት ይጠብቃል፤ «እንደተሰቀለ» ደግሞ ኢየሱስን በተሰቀለበት ሁኔታ የሚያቀርበውን ፍጹም ተገብሮ አንቀጽ በተፈጥሯዊ አማርኛ ያንጸባርቃል።
theological_decisions:
- issue: የ Χριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ ቃሉ እንደ ስም ብቻ ሳይሆን የኢየሱስን መሲሓዊ ማዕረግና ከመስቀል ጋር ያለውን የማዳን ሥራ ያጎላል። ስለዚህ «መሲሕ» በዋናው ጽሑፍ ተመርጧል፤ የተለመደው «ክርስቶስ» ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሰረዝ መሰል ምልክቶቹ የ «καὶ τοῦτον»ን አጽንዖት ያጎላሉ፤ የዋናው ግሪክኛ አጭርና ክብደት ያለው አገላለጽም በተቻለ መጠን ተጠብቋል።
