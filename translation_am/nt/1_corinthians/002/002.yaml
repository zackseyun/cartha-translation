revisions:
- from: በመካከላችሁ ኢየሱስ መሲሕን[a]—እርሱንም እንደተሰቀለ—ከማወቅ በቀር ሌላ ምንም ላለማወቅ ወስኜ ነበርና።
  to: በመካከላችሁ ኢየሱስ መሲሕን—የተሰቀለውን እርሱን—ከማወቅ በቀር ሌላ ምንም እንዳላውቅ ወስኜ ነበርና።
  rationale: The revision changes only the malformed rendering of τοῦτον ἐσταυρωμένον to an idiomatic Amharic relative-participial apposition. It retains the demonstrative emphasis (‘that very one/him’) through «እርሱን» and the completed passive sense through «የተሰቀለውን». The footnote is also made more precise while preserving its lexical-alternative function.
