  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: am
  text: መንፈሳዊው ሰው[a] ግን ሁሉን ነገር ይመረምራል፤[b] እርሱ ራሱ ግን በማንም አይመረመርም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መንፈሳዊው ሰው” የሚለው በግሪክኛ በስም ፋንታ የቆመ ቅጽ ሲሆን፣ በመንፈስ የሚመራን ሰው በአጠቃላይ ያመለክታል።
    reason: cultural_note
  - marker: b
    text: “ይገመግማል፣” “ይለያል” ወይም “ይፈርዳል” ተብሎም ሊተረጎም ይችላል፤ በሁለተኛውም አጠቃቀም ተመሳሳዩ አማራጭ ይሠራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: መንፈሳዊው ሰው
  rationale: በግሪክኛ በስም ፋንታ የቆመውን ነጠላ ቅጽ በተፈጥሮአዊ አማርኛ ያቀርባል፤ ማጣቀሻውም በመንፈስ የሚመራ ሰውን በአጠቃላይ እንጂ ወንድን ብቻ አያመለክትም።
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: ይመረምራል / አይመረመርም
  rationale: ጥንቃቄ ያለውን መመርመርና መገምገም ይገልጣል፤ በሁለቱም ክፍሎች አንድ ሥር ያለው ቃል መጠቀሙ የግሪኩን ድግግሞሽና ንቁ/ተደራጊ ተቃርኖ ይጠብቃል።
- source_word: τὰ πάντα
  choice: ሁሉን ነገር
  rationale: የግሪኩን ሰፊና ያልተገደበ አገላለጽ በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: αὐτὸς
  choice: እርሱ ራሱ
  rationale: የተውላጠ ስሙን አጽንዖት በተፈጥሮአዊ አማርኛ ይጠብቃል።
- source_word: ὑπ’ οὐδενὸς
  choice: በማንም
  rationale: ከአሉታዊው ግስ ጋር ተጣምሮ ‘በማንም አይ…’ የሚለው አገላለጽ ፍጹም አሉታውን በተፈጥሮአዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: መንፈሳዊው ሰው ስለሚመረምረው ነገርና ስለማይመረመርበት ሰው የንግግሩ ወሰን
  choice: “ሁሉን ነገር” እና “በማንም አይመረመርም” የሚሉትን ያልተገደቡ አገላለጾች እንዳሉ ማቆየት
  alternative: በዋናው ጽሑፍ ውስጥ ትርጉሙን በግልጽ ‘መንፈሳዊ ጉዳዮችን’ ብቻ በማለት መገደብ
  rationale: ጥቅሱ ራሱ ንግግሩን ያለገደብ ያቀርባል፤ ዐውደ ንባቡ የትርጓሜውን ማዕቀፍ ቢሰጥም በዋናው ጽሑፍ ተጨማሪ ገደብ ማስገባት በግሪኩ ያልተገለጸውን ውጥረት በቅድሚያ ይፈታል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩነት እንዲታይ “ይመረምራል/አይመረመርም” ተጠብቋል፤ የጾታ ውስንነት እንዳይገባም “ሰው” አጠቃላይ ትርጉም እንዳለው በማስታወሻ ተብራርቷል።
