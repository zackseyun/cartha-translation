  text: እነዚህንም የምንናገረው በሰው ጥበብ በተማሩ ቃላት ሳይሆን፣ በመንፈስ ቅዱስ በተማሩ ቃላት ነው፤ መንፈሳዊ ነገሮችን በመንፈሳዊ ቃላት እየገለጽን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መንፈሳዊ ነገሮችን ለመንፈሳዊ ሰዎች እየተረጎምን።” የግሪኩ πνευματικοῖς የሚለው ቅጽ፣ የተገነዘበ “ቃላት” ጋር ተያይዞ “በመንፈሳዊ ቃላት” ወይም ተባዕታይ ብዙ ቁጥር ሆኖ “ለመንፈሳዊ ሰዎች” ተብሎ ሊነበብ ይችላል።
