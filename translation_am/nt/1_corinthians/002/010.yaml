id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: am
  text: ምክንያቱም እግዚአብሔር እነዚህን[a] በመንፈሱ ገልጦልናል፤ መንፈሱ ሁሉን ነገር፣ የእግዚአብሔርን ጥልቅ ነገሮችም[b] ጭምር ይመረምራልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነርሱን።” በግሪክኛው የግሱ ቀጥተኛ ተሳቢ በግልጽ አልተጠቀሰም፤ ከቀደመው አውድ ይታወቃል።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “የእግዚአብሔርን ጥልቆች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: ገልጦልናል
  rationale: የተፈጸመውን መለኮታዊ መግለጥና አሁን ለተቀባዮቹ ያለውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡμῖν
  choice: -ልናል
  rationale: ተቀባዮቹ ‘እኛ’ መሆናቸውን በግሱ ውስጥ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: እነዚህን
  rationale: በግሪክኛው ቀጥተኛ ተሳቢው ያልተገለጸ ቢሆንም፣ ከቀደመው አውድ የሚመጡትን ነገሮች ያመለክታል።
- source_word: διὰ τοῦ πνεύματος
  choice: በመንፈሱ
  rationale: διά ከወራጅ ስም ጋር መንገድን ወይም አማካይነትን ያሳያል፤ ‘በመንፈሱ’ በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: πνεῦμα
  choice: መንፈሱ
  rationale: አውዱ መለኮታዊ መግለጥንና የእግዚአብሔርን ጥልቅ ነገሮች ማወቅን ስለሚናገር፣ መንፈስ ቅዱስን ያመለክታል።
- source_word: ἐραυνᾷ
  choice: ይመረምራል
  rationale: የግሱን በጥልቀት የመፈተሽና የመፈለግ ኃይል በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πάντα
  choice: ሁሉን ነገር
  rationale: የቃሉን ሰፊና አጠቃላይ ወሰን በግልጽ አማርኛ ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: በአማርኛ የማጠናከሪያ ወይም ወደ ከፍተኛው ነጥብ የሚያደርስ አገናኝ ሆኖ ‘የእግዚአብሔርን ... ነገሮችም’ በሚለው ተገልጧል።
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: የእግዚአብሔርን ጥልቅ ነገሮች
  rationale: የጥልቀትን ዘይቤ ይጠብቃል፤ በተመሳሳይም ጊዜ ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ነው።
theological_decisions:
- issue: πνεῦμα መንፈስ ቅዱስን ወይስ የሰውን መንፈስ ያመለክታል?
  choice: በሁለቱም ቦታዎች መንፈስ ቅዱስ
  alternative: በአጠቃላይ የሰው መንፈስ
  rationale: መንፈሱ የመለኮታዊ መግለጥ አማካይ መሆኑና የእግዚአብሔርን ጥልቅ ነገሮች መመርመሩ መንፈስ ቅዱስን እንደሚያመለክት በጽኑ ይደግፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይመረምራልና’ የግሪክኛውን γάρ ምክንያታዊ ግንኙነት ይጠብቃል።
