base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: am
  text: እኛ ግን የዓለምን መንፈስ ሳይሆን፣ ከእግዚአብሔር የሆነውን መንፈስ ተቀበልን፤ ይህም እግዚአብሔር ለእኛ በጸጋ የሰጣቸውን[b] ነገሮች እንድናውቅ[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንድንረዳ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በነፃ የሰጣቸውን» ወይም «እንደ ስጦታ የሰጣቸውን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: ቃሉ በሁለቱም ቦታ መንፈስ ተብሎ ተተርጉሟል፤ በአማርኛ የአጻጻፍ ሥርዓት የእንግሊዝኛውን spirit/Spirit የፊደል ከፍታ ልዩነት ስለማያሳይ፣ «ከእግዚአብሔር የሆነው» የሚለው አውድ ሁለተኛውን እንደ መንፈስ ቅዱስ ያመለክታል።
- source_word: κόσμου
  choice: ዓለም
  rationale: ከእግዚአብሔር ጋር በተቃርኖ የቀረበውን የአሁኑን የሰው ሥርዓት በተለመደና ሰፊ ትርጉም ያሳያል።
- source_word: ἐλάβομεν
  choice: ተቀበልን
  rationale: የአኦሪስት ግሱን እንደ ተፈጸመ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: ከእግዚአብሔር የሆነውን
  rationale: ἐκ የሚገልጸውን ምንጭ ይጠብቃል፤ «የመጣውን» ብሎ ያልተጻፈ የእንቅስቃሴ ሐሳብ አያክልም።
- source_word: ἵνα εἰδῶμεν
  choice: እንድናውቅ
  rationale: የዓላማውን አረፍተ ነገር በግልጽ ያቆያል፤ οἶδα የሚያመለክተውን ማወቅ ያስተላልፋል።
- source_word: χαρισθέντα
  choice: በጸጋ የሰጠንን
  rationale: ከχαρίζομαι የሚመጣውን የጸጋና የስጦታ ትርጉም ይጠብቃል፤ ተራ «የሰጠንን» ከማለት ይልቅ የግሱን ልዩ ገጽታ ያሳያል።
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: በጸጋ የሰጠንን ነገሮች
  rationale: ግሪኩ ገለልተኛ ብዙ ቁጥር ስለሆነ፣ ትርጉሙን በተወሰኑ መንፈሳዊ ስጦታዎች ላይ ሳይገድብ ሰፊነቱን ይጠብቃል።
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦ በተለይ መንፈስ ቅዱስን ያመለክት እንደሆነ
  choice: «ከእግዚአብሔር የሆነውን መንፈስ» ተብሎ ተተርጉሟል፤ አውዱ መንፈስ ቅዱስን ያመለክታል።
