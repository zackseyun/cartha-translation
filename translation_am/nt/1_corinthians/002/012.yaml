  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን μὲν/δέ ንጽጽር «ግን ... እንጂ ... አይደለም» በሚል ተፈጥሯዊ አወቃቀር በማቅረብ፣ ከእግዚአብሔር የሆነው መንፈስ በአረፍተ ነገሩ ቀድሞ እንዲጎላ ተደርጓል።
