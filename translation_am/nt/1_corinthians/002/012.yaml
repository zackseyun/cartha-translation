  rationale: ከ«የዓለም መንፈስ» ጋር ያለው ቀጥተኛ ንጽጽርና የምዕራፉ አውድ በአማኞች የተቀበለውን መለኮታዊ መንፈስ ይጠቁማሉ፤ ሆኖም ትርጉሙ «መንፈስ ቅዱስ» የሚለውን ግልጽ ስያሜ በግሪኩ ላይ አልጨመረም።
