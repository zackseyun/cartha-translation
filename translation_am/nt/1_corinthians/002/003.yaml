base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: am
  text: እኔም በድካም፣ በፍርሃትና በብዙ መንቀጥቀጥ ከእናንተ ጋር ነበርሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔም በድካም፣ በፍርሃትና በብዙ መንቀጥቀጥ ወደ እናንተ መጣሁ።”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγώ
  choice: እኔም
  rationale: καί የሚያሳየውን ከቀደመው ንግግር ጋር ያለ ትስስር በ«-ም» ያስተላልፋል፤ የጳውሎስንም ራስ-ማመልከቻ በግልጽ ይጠብቃል።
- source_word: ἐν ἀσθενείᾳ
  choice: በድካም
  rationale: ἀσθένεια የአቅም ማነስን ወይም ደካማነትን በሰፊው ሊያመለክት ይችላል፤ «ድካም» በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ይህን ስፋት ይጠብቃል።
- source_word: ἐν φόβῳ
  choice: በፍርሃት
  rationale: የጳውሎስን የተገለጸ ሁኔታ ያለማለዘብ በቀጥታ ያስተላልፋል፤ ወደ «አክብሮት» ወይም «ጥንቃቄ» ብቻ አይገድበውም።
- source_word: ἐν τρόμῳ πολλῷ
  choice: በብዙ መንቀጥቀጥ
  rationale: τρόμος መንቀጥቀጥን፣ πολλῷ ደግሞ መጠኑን ያመለክታል፤ ቀጥተኛው አተረጓጎም የግሪኩን አጽንዖት ይጠብቃል።
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: ከእናንተ ጋር ነበርሁ
  rationale: በአውዱ ውስጥ ጳውሎስ በቆሮንቶስ ሰዎች መካከል የነበረበትን ሁኔታ ይገልጻል፤ ሆኖም ሐረጉ «ወደ እናንተ መጣሁ» የሚለውን የመምጣት ትርጉምም ሊሸከም ስለሚችል በማስታወሻ ተጠብቋል።
theological_decisions: []
