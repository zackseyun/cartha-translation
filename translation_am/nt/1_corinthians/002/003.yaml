  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሦስት ትይዩ የἐν ሐረጎች በ«በ-» ተጠብቀዋል፤ የἐγενόμην πρὸς ὑμᾶς እርግጠኛ ያልሆነ የመኖር/የመምጣት ልዩነት በግርጌ ማስታወሻ ቀርቧል።
