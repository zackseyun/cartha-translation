base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: am
  text: ከሰዎች መካከል የሰውን ነገር በውስጡ ካለው የሰው መንፈስ በቀር የሚያውቅ ማን ነው?[a] እንደዚሁም የእግዚአብሔርን ነገር ከእግዚአብሔር መንፈስ በቀር ማንም ፈጽሞ አላወቀም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰውን ነገር” የሚለው “የሰውን ሐሳብ” ተብሎም ሊተረጎም ይችላል፤ ሆኖም የግሪኩ አገላለጽ ከሐሳብ ብቻ የሰፋ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: ሰዎች / ሰው
  rationale: በዐውዱ የወንድ ፆታን ብቻ ሳይሆን ሰውን በአጠቃላይ ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: τὰ τοῦ ἀνθρώπου
  choice: የሰውን ውስጣዊ ነገር
  rationale: ሐረጉ ከሐሳብ ብቻ የሰፋ ሲሆን የሰውን ውስጣዊ ጉዳይ ያመለክታል። እንዲሁም τὰ τοῦ θεοῦ ከሚለው ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: በእርሱ ውስጥ ካለው ከራሱ መንፈስ
  rationale: የግሪኩን የባለቤትነትና የውስጥ መኖር አገላለጽ ይጠብቃል፤ በአማርኛም የተጠቀሰው ሰው ራሱ መንፈስ መሆኑን ግልጽ ያደርጋል።
- source_word: οὕτως καὶ
  choice: እንደዚሁም
  rationale: በሰው ውስጣዊ እውቀትና በእግዚአብሔር ውስጣዊ እውቀት መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔγνωκεν
  choice: አውቆ አያውቅም
  rationale: የግሪኩን ፍጹም ጊዜ ከአሁናዊ ውጤቱ ጋር የሚያንጸባርቅ የአማርኛ አገላለጽ ነው።
- source_word: τὰ τοῦ θεοῦ
  choice: የእግዚአብሔርን ውስጣዊ ነገር
  rationale: ትርጉሙን ወደ ‘ሐሳብ’ ብቻ ሳያጠብ፣ ከሰው ውስጣዊ ነገር ጋር ያለውን የጽሑፉን ትይዩነት ይጠብቃል።
- source_word: πνεῦμα τοῦ θεοῦ
  choice: የእግዚአብሔር መንፈስ
  rationale: በቅርብ ዐውዱ የእግዚአብሔርን ጥልቅ ነገር የሚመረምርና የሚገልጥ የእግዚአብሔር ራሱ መንፈስ ነው፤ የአማርኛው ሐረግ ይህን ያለ ተጨማሪ የእምነት ትርጓሜ ያስተላልፋል።
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ እንደ መለኮታዊ ማንነት ወይስ እንደ ግላዊ ያልሆነ ኃይል መተርጎሙ
  choice: የእግዚአብሔር መንፈስ
  alternative: ከእግዚአብሔር የሆነ መንፈስ
  rationale: የቅርብ ዐውዱ መንፈሱ የእግዚአብሔርን ጥልቅ ነገር እንደሚያውቅ ይናገራል። የባለቤትነት አወቃቀሩን በቀጥታ መጠበቅ የጽሑፉን አመለካከት ያቀርባል፤ ከዐውዱ በላይ የሆነ ዝርዝር ዶክትሪንም አይጨምርም።
