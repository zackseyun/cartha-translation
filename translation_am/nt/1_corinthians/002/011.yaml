  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሰውና የእግዚአብሔር ‘ነገር’ መካከል ያለው ትይዩነት ተጠብቋል፤ ‘ውስጣዊ’ የሚለው ቃል በአማርኛ ሐረጉን ግልጽ ለማድረግ ተጨምሯል።
