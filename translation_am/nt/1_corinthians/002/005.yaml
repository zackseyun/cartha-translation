  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: am
  text: ይህም እምነታችሁ በሰዎች ጥበብ[a] ላይ ሳይሆን፣ በእግዚአብሔር ኃይል ላይ እንዲሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰብአዊ ጥበብ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ይህም … እንዲመሠረት ነው
  rationale: የግሪኩን የዓላማ አንቀጽ በተፈጥሯዊ አማርኛ ያሳያል፤ «ይህም» አንቀጹን ከቀደመው ሐሳብ ጋር ያገናኛል።
- source_word: πίστις ὑμῶν
  choice: እምነታችሁ
  rationale: በዚህ አውድ πίστις የቆሮንቶስ ሰዎችን እምነት ወይም መታመን ያመለክታል፤ «እምነት» የተለመደና ግልጽ አቻ ነው።
- source_word: ἐν σοφίᾳ ἀνθρώπων
  choice: በሰዎች ጥበብ ላይ
  rationale: ἀνθρώπων እዚህ ሁሉንም ሰዎች በአጠቃላይ ያመለክታል። «ላይ» ከ«እንዲመሠረት» ጋር በመጣመር እምነቱ የሚደገፍበትን መሠረት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀλλ’ ἐν δυνάμει θεοῦ
  choice: ሳይሆን፣ በእግዚአብሔር ኃይል ላይ
  rationale: ἀλλά የሚያሳየውን ጠንካራ ተቃርኖ ይጠብቃል፤ የሰዎች ጥበብና የእግዚአብሔር ኃይል ትይዩ ሆነው ቀርበዋል።
theological_decisions:
- issue: እምነት «በ» አንድ ነገር መሆኑ የሚያመለክተው ግንኙነት
  choice: «… ላይ እንዲመሠረት» ተብሎ ተተርጉሟል
  alternative: «… ውስጥ እንዲሆን»
  rationale: ἐν እዚህ እምነት የሚደገፍበትን መሠረት ወይም ምንጭ ያመለክታል። «ውስጥ እንዲሆን» ቃል በቃል ቢሆንም በአማርኛ የማይፈስ ነው፤ የተመረጠው አገላለጽ ንጽጽሩን ሳይፈታ ትርጉሙን ግልጽ ያደርጋል።
- issue: ἀνθρώπων የሚያመለክተው ጾታና ወሰን
  choice: «ሰዎች»
  alternative: «ወንዶች» ወይም «ሰብአዊ»
  rationale: የግሪኩ ቃል በዚህ ስፍራ ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ ያመለክታል። «ሰዎች» ይህን ወሰን በትክክልና በተፈጥሯዊ አማርኛ ይገልጣል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። «እንዲመሠረት» የሚለው አገላለጽ የግሪኩን ἐν በቃል በቃል ሳይከተል እምነት የሚደገፍበትን መሠረት በተፈጥሯዊ አማርኛ ያቀርባል።
