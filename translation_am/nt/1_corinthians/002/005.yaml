review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the purpose clause, the contrast, the plural possessive ‘your faith,’ and the generic sense of ἀνθρώπων. However, ‘እንዲመሠረት’ (‘might be founded/based’) makes the metaphor of foundation explicit where the Greek more simply says that faith might ‘be in’ human wisdom or God’s power. This is a plausible interpretation but is an avoidable narrowing in an optimal-equivalence rendering.
  naturalness: The revised wording is fluent, modern standard Amharic and retains the balanced contrast between the two prepositional phrases.
  terminology: ‘እምነት,’ ‘ሰዎች ጥበብ,’ ‘እግዚአብሔር,’ and ‘ኃይል’ are appropriate and clear. ‘ሰዎች’ accurately conveys the generic-human reference of ἀνθρώπων; the footnote’s alternative remains suitable.
  issues:
  - severity: medium
    issue: ‘እንዲመሠረት’ adds a foundation metaphor not explicit in μὴ ᾖ ... ἀλλ’ ἐν ...
    rationale: The Greek uses the ordinary verb ‘be’ (ᾖ). Rendering it as ‘be based/founded’ interprets the relationship as foundation and can slightly constrain the broader sense of faith’s locus, basis, or reliance. ‘እንዲሆን’ retains the source’s modest wording while remaining natural in the contrast.
  revised_text: ይህም እምነታችሁ በሰዎች ጥበብ[a] ላይ ሳይሆን፣ በእግዚአብሔር ኃይል ላይ እንዲሆን ነው።
