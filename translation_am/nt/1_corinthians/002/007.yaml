  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: am
  text: ነገር ግን በምስጢር[a] የተሰወረውን የእግዚአብሔርን ጥበብ እንናገራለን፤ ይህንም ጥበብ እግዚአብሔር ከዘመናት በፊት[c] ለክብራችን አስቀድሞ ወሰነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በስውር»። ግሪኩ «ምስጢር» የሚል ቃል ይጠቀማል፤ ጳውሎስ ይህን ቃል ቀድሞ ተሰውሮ አሁን ለተገለጠው የእግዚአብሔር ዕቅድ ብዙ ጊዜ ይጠቀምበታል።
    reason: lexical_alternative
  - marker: b
