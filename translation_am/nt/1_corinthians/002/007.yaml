  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩን ተያያዥ አገባብ ለአማርኛ ንባብ ግልጽ ለማድረግ «ይህንም ጥበብ» ተደግሟል፤ ነገር ግን አዲስ ሐሳብ አልተጨመረም።
