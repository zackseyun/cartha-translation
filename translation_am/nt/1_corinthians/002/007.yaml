    text: ወይም፣ «ከዘመናት ሁሉ በፊት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: እንናገራለን
  rationale: የግሱን ቀጥተኛና ተራ ትርጉም ያስቀምጣል፤ እንደ «እናውጃለን» ያለ ተጨማሪ የይፋ አዋጅ ሐሳብ አያስገባም።
- source_word: θεοῦ σοφίαν
  choice: የእግዚአብሔርን ጥበብ
  rationale: ጥበቡ የእግዚአብሔር መሆኑንና ከእርሱ መምጣቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν μυστηρίῳ
  choice: በምስጢር
  rationale: ሙስτήριον በጳውሎስ አጠቃቀም ቀድሞ ተሰውሮ አሁን የተገለጠን መለኮታዊ ዕቅድ ሊያመለክት ስለሚችል፣ «ምስጢር» ይህን የትርጉም ስፋት ይጠብቃል።
- source_word: τὴν ἀποκεκρυμμένην
  choice: የተሰወረውን … ጥበብ
  rationale: የግሪኩ አሳታፊ ቃል «ጥበብ»ን የሚመለከት መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προώρισεν
  choice: አስቀድሞ ወሰነው
  rationale: ግሱ አስቀድሞ መወሰንን ያመለክታል፤ ይህ አተረጓጎም የግሪኩን ኃይል ሳያዳክም የአንድ ወገንን ልዩ የእምነት ሥርዓት አያስገባም።
- source_word: πρὸ τῶν αἰώνων
  choice: ከዘመናት በፊት
  rationale: αἰῶνες የሚለውን በቀጥታ «ዘመናት» ብሎ በመተርጎም የጳውሎስን የጊዜና የፍጥረት ማዕቀፍ ይጠብቃል።
- source_word: εἰς δόξαν ἡμῶν
  choice: ለክብራችን
  rationale: የአቅጣጫና የዓላማ ሐረጉን ቀጥተኛ ትርጉም ይሰጣል፤ «መክበራችን» ብሎ ትርጓሜውን አያጠብም።
theological_decisions:
- issue: προώρισεν በጳውሎስ አውድ ያለውን የእምነት ክብደት መተርጎም
  choice: አስቀድሞ ወሰነው
  alternative: አስቀድሞ መደበው
  rationale: ቃሉ ቀድሞ የተደረገ ውሳኔን ያሳያል። «አስቀድሞ ወሰነው» ይህን የቃሉን ኃይል ይጠብቃል፣ ነገር ግን ጥቅሱ ከሚናገረው በላይ የተወሰነ የቤተ እምነት አስተምህሮ አይጭንበትም።
- issue: ἐν μυστηρίῳ የሚለው ሐረግ ምስጢራዊ አነጋገርን ወይም የተሰወረ መለኮታዊ ዕቅድን ማመልከቱ
  choice: በምስጢር
  alternative: በስውር
  rationale: «በምስጢር» የግሪኩን ሆን ተብሎ ያልተፈታ ስፋት ይጠብቃል፤ ቀጥሎ ያለው «የተሰወረውን» የሚለው ቃልም አውዱን ያብራራል።
