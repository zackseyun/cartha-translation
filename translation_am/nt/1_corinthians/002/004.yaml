  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: am
  text: ንግግሬና ስብከቴም በሚያሳምን ጥበብ[a] ሳይሆን፣ በመንፈስ ቅዱስ[b]ና በኃይል ማሳያ ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሚያሳምኑ የጥበብ ቃላት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመንፈስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: ንግግር
  rationale: በዚህ አውድ ቃሉ የጳውሎስን የንግግር መንገድ ያመለክታል፤ ከκήρυγμα ለይቶም ያቆየዋል።
- source_word: κήρυγμα
  choice: ስብከት
  rationale: የአዋጅን ወይም የሕዝብ ፊት ማወጅን ሐሳብ በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: πειθοῖ σοφίας
  choice: በሚያሳምን ጥበብ
  rationale: በግሪኩ ውስጥ ‘ቃላት’ የሚል ስም በግልጽ ስለሌለ፣ ዋናው ጽሑፍ ቃሉን አይጨምርም፤ የሚያሳምን የሰው ጥበብ ከመንፈስና ከኃይል ማስረጃ ጋር ያለውን ንፅፅር ይጠብቃል።
- source_word: ἀποδείξει
  choice: ማስረጃ
  rationale: ከንግግራዊ ማሳመን በተቃራኒ የሆነውን ግልጽ ማሳየትና ማረጋገጥ ይገልጻል።
- source_word: πνεύματος
  choice: መንፈስ
  rationale: አውዱ የእግዚአብሔርን መንፈስ ቢያመለክትም፣ የአማርኛው ቃል በራሱ የግሪኩን ሰዋሰዋዊ አሻሚነት ይጠብቃል፤ አማራጩ ትርጉም በማስታወሻ ተገልጿል።
- source_word: δυνάμεως
  choice: ኃይል
  rationale: በጳውሎስ አጠቃቀም የተለመደና ግልጽ ትርጉም ሲሆን ከመንፈስ ጋርም ተፈጥሯዊ ጥምረት ይፈጥራል።
theological_decisions:
- issue: πνεύματος መንፈስ ቅዱስን ወይስ መንፈስን/መንፈሳዊ አቋምን እንደሚያመለክት
  choice: መንፈስ
  alternative: መንፈስ ቅዱስ፤ ወይም መንፈስ
  rationale: ሰፊው አውድ የእግዚአብሔርን መንፈስ በጠንካራ ሁኔታ ያመለክታል፤ ሆኖም ግሪኩ በዚህ ሐረግ ‘ቅዱስ’ አይልም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ ማስታወሻውም ሌላውን ንባብ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። “ንግግር” እና “ስብከት” የሁለቱን የግሪክ ስሞች ልዩነት ይጠብቃሉ፤ የንፅፅሩ መዋቅርም “ሳይሆን” በሚለው ተፈጥሯዊ የአማርኛ አገባብ ተላልፏል።
