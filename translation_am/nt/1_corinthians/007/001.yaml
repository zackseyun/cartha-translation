  text: ስለ ጻፋችሁት ጉዳዮችስ፣ ለወንድ ሴትን አለመንካት መልካም ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሴትን መንካት” የሚለው ቃል በቃል አገላለጽ ነው፤ በዚህ አውድ የጾታ ግንኙነትን የሚያመለክት ለዘብተኛ አነጋገር ነው።
    reason: የግሪኩን ቀጥተኛ ምስል በዋናው ጽሑፍ ሳይተው የአውዱን ፍቺ ለአንባቢው ያብራራል።
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: ስለ ጻፋችሁት ጉዳይስ
  rationale: የግሪኩን ወደ አዲስ ርዕስ የሚያሸጋግር አነጋገር በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ በግልጽ ያልተጻፈውን ‘ለእኔ’ አይጨምርም።
- source_word: καλὸν
  choice: መልካም ነው
  rationale: የቃሉን ሥነ ምግባራዊ ወይም ተገቢነትን ሊያመለክት የሚችል ሰፊ ትርጉም ይጠብቃል።
- source_word: ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι
  choice: ወንድ ሴትን አለመንካቱ
  rationale: በዚህ ተቃራኒ ጾታዊ አወቃቀር ἀνθρώπῳ ወንድን ያመለክታል፤ ‘መንካት’ ደግሞ የግሪኩን ቀጥተኛ ምስልና ጾታዊ ፍቺውን አብሮ ይጠብቃል።
theological_decisions:
- issue: ንግግሩ የቆሮንቶስ ሰዎች ጥቅስ መሆኑ ወይም የጳውሎስ ቀጥተኛ አባባል መሆኑ
