- issue: ‘ሴትን መንካት’ የሚለው አገላለጽ
  choice: የቀጥተኛውን ምስል በዋናው ጽሑፍ ማቆየትና ጾታዊ ፍቺውን በማስታወሻ ማብራራት
  alternative: ‘ከሴት ጋር የጾታ ግንኙነት አለማድረግ’ ብሎ በግልጽ መተርጎም
  rationale: ቀጥተኛው አገላለጽ ሆን ብሎ የተጠቀመበትን ለዘብተኛ ዘይቤና የፍቺውን ስፋት ይጠብቃል።
