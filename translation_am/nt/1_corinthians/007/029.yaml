lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: ነገር ግን፣ … የምለው ይህን ነው
  rationale: የጳውሎስን የማብራሪያ መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ δέ የሚያሳየውንም የንግግር ሽግግር በ«ነገር ግን» ይጠብቃል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በዚህ አውድ ግን የእምነት ማኅበሩን ወንዶችና ሴቶች በአጠቃላይ ሊያመለክት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: ὁ καιρός
  choice: ጊዜው
  rationale: አጭርና ተፈጥሯዊ ሲሆን በአውዱ ውስጥ ያለውን ወሳኝ ወይም የተወሰነ ጊዜ ያሳያል።
- source_word: συνεσταλμένος ἐστίν
  choice: አጥሯል
  rationale: የፍጹም ጊዜውን አሁን የሚቀጥል ውጤት በተፈጥሯዊ አማርኛ ያሳያል፤ ተገብሮአዊውን «አሳጥሯል» ብሎ በማቅረብ በግሪኩ ያልተጠቀሰ ፈጻሚ ከመጨመር ይቆጠባል።
- source_word: τὸ λοιπὸν
  choice: ከእንግዲህ
  rationale: ለቀረው ጊዜ የሚሰጠውን ተግባራዊ መመሪያ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα
  choice: የሚከተለው የትእዛዝ ቅርጽ
  rationale: በአማርኛ የአረፍተ ነገሩ ፍሰት «ከእንግዲህ … ይሁኑ» በሚለው ቅርጽ የአጭሩ ጊዜ ተግባራዊ ውጤትን ያሳያል፤ ዓላማ ወይም ውጤት መሆኑን ከሚገባው በላይ አይወስንም።
- source_word: οἱ ἔχοντες γυναῖκας
  choice: ሚስቶች ያሏቸው
  rationale: γυναῖκας በዚህ የጋብቻ አውድ «ሚስቶች» ማለት መሆኑን በቀጥታ ያቀርባል።
- source_word: ὡς μὴ ἔχοντες
  choice: እንደሌሏቸው
  rationale: የንጽጽር አነጋገሩን ጥንካሬ ሳያለዝብ በተፈጥሯዊ አማርኛ ይጠብቃል፤ የጋብቻ ግዴታን መሻር ወይም ስሜታዊ መራቅ የሚል ትርጓሜ አይጨምርም።
theological_decisions:
- issue: ጳውሎስ ስለ ጋብቻ የሰጠው መመሪያ የእረኝነትና የሥነ መለኮት ኃይል
  choice: «ሚስቶች ያሏቸው እንደሌሏቸው ይሁኑ» ተብሎ የንግግሩ ጥንካሬ በቀጥታ ተጠብቋል።
  alternative: «ለጋብቻቸው ከልክ በላይ ሳይጣበቁ ይኑሩ» ብሎ በትርጓሜ ማለዘብ።
  rationale: ጥቅሱ በአጭር ጊዜ ግንዛቤ የተመሠረተውን፣ መደበኛ ማኅበራዊ ሁኔታዎችን አንጻራዊ የሚያደርግ አጣዳፊ መመሪያ ይዟል። ይህን ውጥረት መተርጎም እንጂ በማብራሪያ መፍታት አይገባም።
