  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: am
  text: ነገር ግን፣ ወንድሞች ሆይ፣ የምለው ይህን ነው፤ ጊዜው አጥሯል።[a] ከእንግዲህ ሚስቶች ያሏቸውም እንኳ እንደሌሏቸው ይሁኑ፤[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የተወሰነው ጊዜ አጥሯል።»
    reason: lexical_alternative
  - marker: b
    text: «ወንድሞች» የሚለው በግሪክ ተባዕታይ ብዙ ቁጥር የሆነውን ἀδελφοί ይተረጉማል፤ ቃሉ ወንድና ሴት የእምነት ባልንጀሮችን በአንድነት ሊያነጋግር ይችላል።
