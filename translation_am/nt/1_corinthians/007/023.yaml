  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: am
  text: በዋጋ ተገዝታችኋል፤ የሰዎች ባሪያዎች አትሁኑ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: በዋጋ
  rationale: የዋጋን ወይም የክፍያን ሐሳብ በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል፤ የተከፈለውን መጠን አይወስንም።
- source_word: ἠγοράσθητε
  choice: ተገዝታችኋል
  rationale: የግሪኩን ያለፈ ጊዜ ተደራጊ አንቀጽና የብዙ ሰዎች አድራሻ ይጠብቃል፤ የመግዛትን ዘይቤም በግልጽ ያቆያል።
- source_word: μὴ γίνεσθε
  choice: አትሁኑ
  rationale: በአማርኛ ተፈጥሯዊ የሆነ ክልከላ ሲሆን ‘ወደዚህ ሁኔታ አትግቡ/አትለወጡ’ የሚለውን የγίνομαι ኃይል በዐውዱ ያስተላልፋል።
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: በዚህ ዐውድ የባለቤትነትና የተገዥነት ዘይቤው ዋና ስለሆነ፣ ‘አገልጋዮች’ ከሚለው ይልቅ የግሪኩን ትርጉም በትክክል ይጠብቃል።
- source_word: ἀνθρώπων
  choice: የሰዎች
  rationale: ἀνθρώπων እዚህ የሰው ልጆችን በአጠቃላይ ያመለክታል፤ ‘የሰዎች’ የጾታ ገደብ ሳይጨምር ከጌታ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: δοῦλοι ἀνθρώπων የሚለውን የባለቤትነትና የተገዥነት ዘይቤ መተርጎም
  choice: የሰዎች ባሪያዎች
  alternative: የሰዎች አገልጋዮች
  rationale: በዋጋ ከመገዛት ጋር ያለው ቀጥተኛ የዘይቤ ግንኙነት ‘ባሪያዎች’ በሚለው ይጠበቃል። ጥቅሱ የሰውን ሁሉን አቀፍ የመጨረሻ ጌትነት ይከለክላል እንጂ ማንኛውንም ሰብዓዊ አገልግሎት በግልጽ አይከለክልም፤ ትርጉሙ ይህን የሥነ መለኮት ውጥረት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘በዋጋ ተገዝታችኋል’ የግሪኩን ንግዳዊ-ቤዛዊ ዘይቤ በቀጥታ ያቆያል፤ ‘የሰዎች’ ደግሞ ἀνθρώπωνን በአካታች መልኩ በትክክል ስለሚያስተላልፍ የግርጌ ማስታወሻ አላስፈለገም።
