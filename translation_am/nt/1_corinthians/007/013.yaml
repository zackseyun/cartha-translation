base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: am
  text: እናም፣ የማያምን ባል ያላት ሴት ካለች፣ እርሱም ከእሷ ጋር ለመኖር ፈቃደኛ ከሆነ፣ ባሏን መተው[a] የለባትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከባሏ አትፋታ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ በቀጥታ “መተው” ወይም “መልቀቅ” ማለት ሊሆን ይችላል፤ እዚህ ግን የጋብቻ ግንኙነቱን ማቋረጥን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις
  choice: አንዲት ሴት
  rationale: የግሪኩ አገላለጽ አጠቃላይ ሁኔታን ያቀርባል፤ ‘አንዲት ሴት’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ቀጥሎ ያለው ‘ባል’ የጋብቻውን አውድ ግልጽ ያደርጋል።
- source_word: ἔχει ἄνδρα ἄπιστον
  choice: የማያምን ባል ቢኖራት
  rationale: ἄνδρα በዚህ የጋብቻ አውድ ‘ባል’ ማለት ነው፤ ἄπιστον ደግሞ የጋብቻ ታማኝነት ማጣትን ሳይሆን ክርስቲያናዊ እምነትን አለመጋራትን ስለሚጠቁም ‘የማያምን’ ተመርጧል።
- source_word: οὗτος
  choice: እርሱም
  rationale: ጠቋሚው ተውላጠ ስም ወደ ባልየው ይመለሳል፤ ‘እርሱም’ ይህን በግልጽና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνευδοκεῖ
  choice: ፈቃደኛ ከሆነ
  rationale: ግሱ በፈቃድ መስማማትን ያመለክታል፤ ‘ፈቃደኛ ከሆነ’ የግድ ሳይሆን ፈቃደኝነት መኖሩን ያስተላልፋል።
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: ከእሷ ጋር ለመኖር
  rationale: ሐረጉ በአንድነት የሚቀጥል የቤተሰብ ኑሮን ያመለክታል፤ ይህ አተረጓጎም ግልጽና ወቅታዊ ነው።
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: ባሏን አትተወው
  rationale: ἀφίημι በጋብቻ አውድ ግንኙነቱን ማቋረጥን ሊያመለክት ይችላል፤ ‘አትተወው’ የግሱን የቅርብ ትርጉምና በግሪኩ ያለውን መጠነኛ አሻሚነት ይጠብቃል። ‘ባሏን’ የታወቀውን የጋብቻ አጋር በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በተለያየ እምነት ያሉ ባልና ሚስትን አስመልክቶ ἀφιέτω የሚለውን መተርጎም
  choice: ባሏን አትተወው
  alternative: ከባሏ አትፋታ
  rationale: ጽሑፉ የማያምነው ባል አብሮ ለመኖር ፈቃደኛ ሲሆን ጋብቻውን እንዳታቋርጥ ያዛል። ‘አትተወው’ የግሪኩን ሰፊ የቃል ክልል ይጠብቃል፤ ‘አትፋታ’ የሕጋዊ ፍቺን ብቻ በመጥቀስ ትርጉሙን ሊያጠብ ይችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘አትተወው’ የሚለው የቃል ምርጫ የመነሻውን አሻሚነት ይጠብቃል፣ የጋብቻ ማቋረጥ ሐሳብም በግርጌ ማስታወሻው ተገልጿል።
