  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: am
  text: ያገባ ወንድ ግን የዓለም ጉዳዮች[a] ያሳስቡታል፤ ሚስቱንም እንዴት ደስ ማሰኘት እንደሚችል ያሳስበዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዓለማዊ ጉዳዮች» ወይም «የዓለም ኑሮ ጉዳዮች»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: ያገባው ሰው ግን
  rationale: የግሪኩ መስተዋድዳዊ የአንቀጽ ቅርጽ ያገባውን ወንድ ከአላገባው ጋር ያነጻጽራል። «ሰው» በአማርኛ ተፈጥሯዊ ሲሆን በአውዱ የተጋባ ወንድን ያመለክታል።
- source_word: μεριμνᾷ
  choice: ያስባል
  rationale: ግሱ መጨነቅን፣ መጠንቀቅን ወይም ጉዳዩን በሐሳብ መያዝን ሊገልጽ ይችላል። እዚህ «ያስባል» ኃጢአተኛ ጭንቀት ነው ብሎ ሳይወስን የትዳርን ተግባራዊ ጉዳይ ያሳያል።
- source_word: τὰ τοῦ κόσμου
  choice: ስለዓለም ጉዳዮች
  rationale: ይህ አገላለጽ ከመደበኛው የዓለም ኑሮ ጋር የተያያዙ ጉዳዮችን ያመለክታል። ትርጉሙ ብዙ ቁጥሩን ይጠብቃል፣ ክፉነትንም አስቀድሞ አይጫንም።
- source_word: πῶς ἀρέσῃ
  choice: እንዴት ደስ እንደሚያሰኝ
  rationale: የጭንቀቱን ወይም የሐሳቡን ይዘት—ሚስቱን ደስ ማሰኘት—በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: τῇ γυναικί
  choice: ሚስቱን
  rationale: በጋብቻው አውድ γυνή «ሚስት» ማለት ነው፤ የባለቤትነት ቅጥያውም በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: κόσμος በዚህ ስፍራ የግድ ክፉ ወይም ኃጢአታዊ ትርጉም ይኑረው እንደሆነ
  choice: «የዓለም ጉዳዮች» ተብሎ በገለልተኛ አገላለጽ ተተርጉሟል።
  alternative: «ዓለማዊ ነገሮች» ተብሎ አሉታዊ ወይም ኃጢአታዊ ፍቺ መስጠት።
  rationale: አውዱ ባለትዳር ሰው ያሉበትን ተግባራዊ ግዴታዎች ከማይከፋፈል ለጌታ መሰጠት ጋር ያነጻጽራል፤ ጋብቻን ወይም መደበኛ ኃላፊነቶችን በሙሉ እንደ ክፉ አይፈርጅም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ንጽጽር «ግን» ያስቀምጣል፤ የκόσμοςን ሥነ ምግባራዊ ድምዳሜ ሳይጨምር አሻሚነቱን ይጠብቃል።
