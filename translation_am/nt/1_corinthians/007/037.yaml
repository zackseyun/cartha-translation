id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: am
  text: ነገር ግን በልቡ ጸንቶ የቆመ፣ ምንም ግዴታ የሌለበት[a]፣ በገዛ ፈቃዱም ላይ ሥልጣን ያለው፣ ይህንም—የራሱን ድንግል[b] ለመጠበቅ—በራሱ ልብ የወሰነ ሰው፣ መልካም ያደርጋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምንም ነገር ያልተገደደ።”
    reason: lexical_alternative
  - marker: b
    text: “የራሱን ድንግል” የሚለው ድንግል ልጁን ወይም ድንግል እጮኛውን ሊያመለክት ይችላል፤ የግሪኩ አገላለጽ አከራካሪ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: በልቡ ጸንቶ የቆመ
  rationale: የፍጹም ጊዜውን የጸናና የተረጋጋ ውሳኔ ሐሳብ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: μὴ ἔχων ἀνάγκην
  choice: ምንም ግዴታ የሌለበት
  rationale: ἀνάγκη የግድ፣ የአስገዳጅነት ወይም የጫና ሐሳብ ሊይዝ ስለሚችል፣ ‘ግዴታ’ ዋናውን ሐሳብ ሳያጠብ ያቀርባል።
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: በገዛ ፈቃዱም ላይ ሥልጣን ያለው
  rationale: ἐξουσίαን ‘ሥልጣን’፣ θέλημαን ‘ፈቃድ’ በማለት የምንጩን አወቃቀርና ከውጫዊ ግዴታ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: κέκρικεν
  choice: የወሰነ
  rationale: አስቀድሞ የተደረገና ጸንቶ የቆየ ውሳኔን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: τηρεῖν
  choice: ለመጠበቅ
  rationale: τηρέω የሚለውን መጠበቅ፣ እንዳለ ማቆየት የሚለውን መሠረታዊ ፍቺ ይይዛል፤ ‘ሳያገባ ማቆየት’ የሚለውን ትርጓሜ ወደ ዋናው ጽሑፍ አያስገባም።
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: የራሱን ድንግል
  rationale: παρθένοςን በቀጥታ ‘ድንግል’ ብሎ በመተርጎም፣ ይህች ሴት ድንግል ልጁ ወይም እጮኛው መሆኗን የሚመለከተውን እውነተኛ የትርጓሜ አሻሚነት ይጠብቃል።
- source_word: καλῶς ποιήσει
  choice: መልካም ያደርጋል
  rationale: ተግባሩ ተገቢና የሚመሰገን መሆኑን በተለመደ አማርኛ የሚገልጽ አገላለጽ ነው።
theological_decisions:
- issue: τὴν ἑαυτοῦ παρθένον የሚያመለክተው ማንን እንደሆነ
  choice: በዋናው ጽሑፍ ‘የራሱን ድንግል’ የሚለውን አሻሚ አገላለጽ ማቆየት
  alternative: ‘ድንግል ልጁን’ ወይም ‘ድንግል እጮኛውን’ ብሎ በግልጽ መተርጎም
  rationale: የግሪኩ አገላለጽ አባት/አሳዳጊን እና ድንግል ልጁን ይመለከት ወይስ ወንድንና ድንግል እጮኛውን ይመለከት የሚለው አከራካሪ ነው። ጥቅሱ ራሱ ጉዳዩን በውል ስለማይወስን፣ አንዱን ትርጓሜ በዋናው ጽሑፍ መጫን አልተመረጠም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። የ‘ልብ’ መጽሐፍ ቅዱሳዊ ፈሊጥ ተጠብቋል፤ ረጅሙን የግሪክ ዓረፍተ ነገር ግልጽ ለማድረግ ሰረዝ ተጠቅሟል። የግርጌ ማስታወሻዎቹ ምልክቶች ከሚመለከቷቸው ሐረጎች ጋር ተያይዘዋል።
