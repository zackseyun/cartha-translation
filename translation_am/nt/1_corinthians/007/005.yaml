    text: ወይም፣ “እርስ በርሳችሁ የሚገባችሁን አትንፈጉ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “እንደገና በአንድነት ሁኑ።” ይህ አገላለጽ ባልና ሚስት የጋብቻ ኑሯቸውን መልሰው መቀጠላቸውን ያመለክታል።
    reason: lexical_alternative
