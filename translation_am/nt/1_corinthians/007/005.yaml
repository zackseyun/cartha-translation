theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτε የጾታ ግንኙነትን በግልጽ መጥቀስ አለበት ወይስ የጋብቻ አንድነትን በአጠቃላይ ማሳየት አለበት?
