  verdict: revise
  source_fidelity: The draft correctly preserves the reciprocal marital instruction, mutual consent, temporary duration, prayer, Satan, and lack of self-control. However, አትከላከሉ means ‘do not prevent/oppose’ and does not convey ἀποστερεῖτε (‘do not deprive/withhold from’). The revised wording restores this central sense and places the reunion before the stated purpose of avoiding temptation, as in the Greek.
  naturalness: The revised Amharic is modern, clear, and appropriately restrained in its reference to marital intimacy. በጋራ ስምምነት and ለተወሰነ ጊዜ are more idiomatic than በሁለታችሁ ስምምነት and ለጥቂት ጊዜ in this formal context.
  terminology: ሰይጣን, ጸሎት, and ራሳችሁን መግዛት ባለመቻላችሁ are suitable standard renderings. The footnote on the reunion appropriately explains the marital sense without making the main text more explicit than the Greek.
  issues:
  - severity: high
    issue: The main rendering አትከላከሉ does not translate ἀποστερεῖτε accurately.
    rationale: ከለከለ means ‘prevent’ or ‘forbid,’ whereas the Greek means to deprive or withhold what is due. አትነፋፈጉ preserves the reciprocal force and is natural in Amharic.
  - severity: medium
    issue: The exception is expressed as ሊሆን ይችላል, which sounds like an external permission rather than the Greek’s limited conditional exception.
    rationale: Using ብቻ ቢሆን እንጂ more directly represents ‘except ... only if.’
  - severity: low
    issue: The original sentence places the Satan clause before the instruction to come together again.
    rationale: Reordering the final clauses follows the Greek sequence and improves readability without altering meaning.
