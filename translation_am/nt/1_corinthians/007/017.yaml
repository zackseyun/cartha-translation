base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: am
  text: ይሁን እንጂ፣ ጌታ ለእያንዳንዱ እንደመደበለት[a]፣ እግዚአብሔርም እያንዳንዱን እንደጠራው፣ እንዲሁ ይመላለስ[b]። እንዲሁም በአብያተ ክርስቲያናት ሁሉ አዝዛለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «መደበለት» የሚለው «ከፈለለት» ወይም «ዕጣ አደረገለት» ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ ጌታ ለእያንዳንዱ ያከፋፈለውን ወይም የመደበውን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: «መመላለስ» በመጽሐፍ ቅዱስ የአንድን ሰው አኗኗር የሚያመለክት የተለመደ ዘይቤ ነው፤ «ይኑር» ወይም «ሕይወቱን ይምራ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: ይሁን እንጂ
  rationale: በዚህ አውድ ጥብቅ ሁኔታዊ ንግግር ሳይሆን ከቀደመው ውይይት ወደ አጠቃላይ መመሪያ የሚያሸጋግር ተቃርኖአዊ አገናኝ ነው።
- source_word: ἑκάστῳ / ἕκαστον
  choice: ለእያንዳንዱ / እያንዳንዱን / እያንዳንዱ
  rationale: የግሪኩን ድግግሞሽና ለየግለሰቡ የሚሰጠውን አጽንዖት ይጠብቃል።
- source_word: ἐμέρισεν
  choice: መደበለት
  rationale: ጌታ ለእያንዳንዱ የከፈለውን ወይም የሰጠውን የሕይወት ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κέκληκεν
  choice: እንደጠራው
  rationale: የተፈጸመውንና ውጤቱ የቀጠለውን መለኮታዊ ጥሪ በአውዱ ውስጥ በግልጽ ሁኔታ ያቀርባል።
- source_word: περιπατείτω
  choice: ይመላለስ
  rationale: የአኗኗርን ሁኔታ የሚያመለክተውን የጳውሎስን የመመላለስ ዘይቤ ይጠብቃል።
- source_word: διατάσσομαι
  choice: የማዝዘው
  rationale: ቃሉ ያለውን ሥልጣናዊ መመሪያ በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: በማኅበራት ሁሉ
  rationale: በጳውሎስ አውድ ያሉትን የአማኞች አጥቢያ ማኅበራት ያመለክታል።
theological_decisions:
- issue: በ«ጌታ»ና በ«እግዚአብሔር» መካከል ያለው የስያሜ ልዩነት
  choice: ሁለቱንም ስያሜዎች በተለያዩበት መልክ ማቆየት
  alternative: ሁለቱን እንደ አንድ መለኮታዊ ስያሜ በአንድ ቃል ማቅረብ
  rationale: የግሪኩ ጽሑፍ ሁለት የተለያዩ መለኮታዊ ስያሜዎችን በትይዩ ስለሚጠቀም ትርጉሙ ሳያዋህዳቸው ልዩነቱን ይጠብቃል።
- issue: በπεριπατείτω ያለው የሥነ ምግባር ዘይቤ
  choice: «ይመላለስ» በማለት ዘይቤውን ማቆየት
  alternative: «ይኑር» በማለት ትርጉሙን ቀጥተኛ ማድረግ
  rationale: «መመላለስ» በመጽሐፍ ቅዱሳዊ አማርኛ የአኗኗርን ሁኔታ የሚገልጽ የሚታወቅ ዘይቤ ሲሆን የምንጩን ምስላዊነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የምንጩ ድግግሞሽና የ«መመላለስ» ዘይቤ ተጠብቀዋል፤ የመጨረሻው ሐረግ የκαὶ οὕτωςን ቅርጽና የδιατάσσομαιን ሥልጣናዊ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
