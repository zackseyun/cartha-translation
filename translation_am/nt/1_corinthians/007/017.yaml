review_pass:
  verdict: revise
  source_fidelity: The two explicit distributive expressions and the distinct titles «ጌታ» and «እግዚአብሔር» are retained. The draft's final nominal construction («የማዝዘው ... ነው») weakens the direct present verbal force of διατάσσομαι and adds a relative-clause framing not present in Greek. «ማኅበራት» is too generic for ἐκκλησίαις in this Pauline context.
  naturalness: The revised wording is natural modern standard Amharic while retaining the biblical metaphor «ይመላለስ». Removing the unnecessary third explicit «እያንዳንዱ» makes the sentence less repetitive without omitting any explicitly repeated Greek term.
  terminology: «አብያተ ክርስቲያናት» accurately identifies the local church communities denoted by ἐκκλησίαις. «አዝዛለሁ» suitably conveys the authoritative force of διατάσσομαι without doctrinal expansion.
  issues:
  - severity: medium
    issue: «በማኅበራት ሁሉ» for ἐν ταῖς ἐκκλησίαις πάσαις
    rationale: «ማኅበራት» can denote associations or groups generally. In Paul's usage here, ἐκκλησίαις refers specifically to church communities, which should be stated explicitly.
  - severity: medium
    issue: «የማዝዘው እንዲሁ ነው» for καὶ οὕτως ... διατάσσομαι
    rationale: This turns Paul's direct present assertion, “and thus I direct,” into “what I command is thus,” adding a relative formulation and reducing the direct verbal correspondence.
  - severity: low
    issue: A third explicit «እያንዳንዱ» before «ይመላለስ»
    rationale: The Greek explicitly uses ἕκαστος twice; Amharic can supply the subject of the final verb from the preceding clauses. Omitting the additional explicit noun improves flow while preserving the distributive sense.
  revised_text: ይሁን እንጂ፣ ጌታ ለእያንዳንዱ እንደመደበለት[a]፣ እግዚአብሔርም እያንዳንዱን እንደጠራው፣ እንዲሁ ይመላለስ[b]። እንዲሁም በአብያተ ክርስቲያናት ሁሉ አዝዛለሁ።
