id: 1CO.7.27
reference: 1 Corinthians 7:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: am
  text: ከሚስት ጋር ታስረሃልን? መፈታትን አትፈልግ።[a] ከሚስት ተፈትተሃልን? ሚስት አትፈልግ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ትርጉሙን ይበልጥ በመግለጽ፦ «አግብተሃልን? ፍቺን አትፈልግ። ተፋተሃልን? ሚስት አትፈልግ።» ግሪኩ በቀጥታ ሲተረጎም “መታሰር” እና “መፈታት” የሚሉ ቃላትን ይጠቀማል።
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: ታስረሃል
  rationale: የግሪኩን ፍጹም ጊዜ እና የመታሰር ምስላዊ አነጋገር ይጠብቃል፤ በአማርኛም ከ«ከሚስት ጋር» ጋር ሲነበብ የጋብቻ ትስስሩ ግልጽ ነው።
- source_word: γυναικί
  choice: ከሚስት ጋር
  rationale: በዚህ የጋብቻ አውድ γυνή «ሚስት» ማለት ነው፤ የግሪኩን ዳቲቭ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ζήτει
  choice: አትፈልግ
  rationale: የζητέωን የመፈለግ ትርጉምና የክልከላ ትእዛዙን በቀጥታ ያስተላልፋል።
- source_word: λύσιν
  choice: መፈታትን
  rationale: «መፈታት» የመላቀቅን ምስል ይጠብቃል፣ ከቀጣዩ «ተፈትተሃል» ጋርም ያለውን የቃል ግንኙነት ያሳያል፤ «ፍቺ» ብሎ ከግሪኩ የበለጠ አያጠብም።
- source_word: λέλυσαι
  choice: ተፈትተሃል
  rationale: ከδέδεσαι ጋር ያለውን ተቃርኖና ከλύσιν ጋር ያለውን የቃል ትስስር ይጠብቃል፤ ፍቺን፣ መለያየትን ወይም ሌላ ያላገባ ሁኔታን አስቀድሞ አይወስንም።
- source_word: ἀπὸ γυναικός
  choice: ከሚስት
  rationale: ἀπό የመለየት መነሻን «ከ» በማለት ይገልጻል፤ γυνή በዚህ አውድ «ሚስት» ነው።
- source_word: γυναῖκα
  choice: ሚስት
  rationale: የንባቡ አውድ ሚስት ለማግባት መፈለግን ስለሚመለከት «ሚስት» ከ«ሴት» ይበልጥ ትክክለኛ ነው።
theological_decisions:
- issue: ጥቅሱ ግልጽ የጋብቻና የፍቺ ቃላትን ይጠቀም ወይስ የግሪኩን የመታሰርና የመፈታት ምስል ይጠብቅ?
  choice: በዋናው ጽሑፍ የመታሰርና የመፈታት ምስል ተጠብቋል።
  alternative: «አግብተሃልን? ፍቺን አትፈልግ። ተፋተሃልን? ሚስት አትፈልግ።»
  rationale: ግሪኩ በግልጽ የማግባትና የመፋታት ቃላት ፈንታ δέω/λύω የሚለውን ምስላዊ ቋንቋ ይጠቀማል። ይህን ማቆየት ለምንጩ ታማኝ ሲሆን ትርጉሙን ወደ አንድ ሕጋዊ ሁኔታ ብቻ አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለተኛ መደብ ነጠላ ወንድ ጾታ ቅርጾች በ«-ሃል» ተወክለዋል፤ የመታሰር/መፈታት ትይዩነት በተፈጥሯዊ አማርኛ ተጠብቋል።
