lexical_decisions:
- source_word: τοῦτο
  choice: ይህን
  rationale: አመልካች ተውላጠ ስሙ በአውዱ ውስጥ ወዲያው የተነሳውን ነገር ያመለክታል፤ ከኋላ ወይም ከፊት ያለውን ሐሳብ መሆኑን ሳያስገድድ “ይህን” ተፈጥሯዊ ነው።
- source_word: δὲ
