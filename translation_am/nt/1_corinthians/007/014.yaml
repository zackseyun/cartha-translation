  rationale: የግሪኩ ጽሑፍ ከἀνήρ ይልቅ ἀδελφός ይጠቀማል። የምንጩን ልዩነት በጽሑፉ ጠብቆ ሊሆን የሚችለውን አመልካች በማስታወሻ ማብራራት ግልጽነትንና ታማኝነትን ያጣምራል።
