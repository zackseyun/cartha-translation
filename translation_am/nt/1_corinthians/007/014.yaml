base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: am
  text: የማያምነው ባል በሚስቱ ቅዱስ ሆኗልና።[b] የማታምነውም ሚስት በወንድም[a] ቅድስት ሆናለች። ያለዚያ ግን ልጆቻችሁ ርኩሳን ናቸው፤ አሁን ግን ቅዱሳን ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሚያምነው ባል።” ግሪኩ “በወንድም” ይላል፤ ጳውሎስ “ወንድም” የሚለውን ቃል ብዙ ጊዜ አብሮ የሚያምን ሰውን ለማመልከት ይጠቀምበታል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ቅዱስ ሆኗል” የሚለው ከሚያምነው የትዳር አጋርና ከቤተሰቡ ጋር ባለው ዝምድና የተለየ ወይም የተቀደሰ ሁኔታን ያመለክታል፤ ይህ በግድ የግል ድነት ማለት አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: ቅዱስ ሆኗል / ቅድስት ሆናለች
  rationale: የግሪኩን ፍጹም ተደራጊ ግስ የተገኘውንና የቀጠለውን ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል፤ በራሱም የግል ድነትን አይወስንም።
- source_word: ἄπιστος
  choice: የማያምነው / የማታምነው
  rationale: በዚህ የትዳር አውድ እምነት የሌለውን ይገልጣል እንጂ ታማኝነት የጎደለውን አይደለም።
- source_word: ἐν
  choice: በ
  rationale: የግሪኩን ቅርጽ በአጭሩ ይጠብቃል፤ በዚህ አውድ ከአማኙ የትዳር አጋር ጋር ባለው ዝምድና ወይም በእርሱ አማካይነት የሚል ኃይል አለው።
- source_word: γυνή / ἀνήρ
  choice: ሚስት / ባል
  rationale: የቅርብ አውዱ ስለ ትዳር ስለሆነ ከ‘ሴት/ወንድ’ ይልቅ የትዳር ትርጉማቸው ትክክለኛ ነው።
- source_word: ἀδελφῷ
  choice: በወንድሙ
  rationale: ምንጩ ‘በወንድሙ’ ይላል፤ ይህን በዋናው ጽሑፍ ጠብቆ የሚያምነውን ባል ሊያመለክት እንደሚችል ማስታወሻው ያብራራል።
- source_word: ἐπεὶ ἄρα
  choice: ይህ ባይሆን ኖሮ
  rationale: ቀዳሚው ነገር እውነት ባይሆን የሚከተለውን ውጤት በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: ἀκάθαρτα
  choice: ርኩሳን
  rationale: የሥርዓታዊና የቃል ኪዳናዊ ንጽሕና ተቃራኒ የሆነውን ቅላጼ ይጠብቃል።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: ከታሰበው ተቃራኒ ሁኔታ ጋር የሚደረገውን የእውነተኛው ሁኔታ ንጽጽር በቀጥታ ያሳያል።
- source_word: ἅγια
  choice: ቅዱሳን
  rationale: ከἡγίασται ጋር ያለውን የቃል ግንኙነትና የመለኮታዊ ቅላጼውን ይጠብቃል።
theological_decisions:
- issue: የማያምነው የትዳር አጋር ‘ቅዱስ መሆን’
  choice: የግሪኩን የቅድስና ቃል በዋናው ጽሑፍ መጠበቅና የግል ድነት ማለት እንዳይገደድ በማስታወሻ ማብራራት
  alternative: በትዳሩ ምክንያት ድኗል ብሎ መተርጎም፣ ወይም ንግግሩን በትዳሩ ሕጋዊነት ብቻ መገደብ
  rationale: ጳውሎስ የትዳሩንና የልጆቹን ሁኔታ ያያይዛል፤ ጽሑፉ ግን ያለግል እምነት ድነትን በግልጽ አይናገርም።
- issue: የἀδελφῷ አመልካች
