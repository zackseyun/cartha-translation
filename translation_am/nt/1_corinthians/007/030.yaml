  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: am
  text: የሚያለቅሱም የማያለቅሱ ያህል፣ ደስ የሚላቸውም ደስ የማይላቸው ያህል፣ የሚገዙም ይዞታ እንደሌላቸው ያህል ይሁኑ፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίοντες
  choice: የሚያለቅሱ
  rationale: በመስተዋድድ የቀረበው የአሁን ጊዜ አሳታፊ ቅርጽ ‘የሚያለቅሱ’ የሚለውን ቡድን ያመለክታል፤ ቃሉ ድርጊቱን በቀጥታ ያስተላልፋል።
- source_word: ὡς μὴ κλαίοντες
  choice: እንደማያለቅሱ
  rationale: ὡς μή ከአሳታፊ ጋር የሚገልጸው ድርጊቱ አለመከሰቱን ሳይሆን የኑሮ አቋምን ወይም አያያዝን ነው፤ ይህ ምርጫ የግሪኩን አጭርና ተደጋጋሚ አወቃቀር ይጠብቃል።
- source_word: χαίροντες
  choice: ደስ የሚላቸው
  rationale: χαίρω እዚህ ደስታን መለማመድ ወይም መደሰትን ያመለክታል፤ ‘ደስ የሚላቸው’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ὡς μὴ χαίροντες
  choice: እንደማይደሰቱ
  rationale: ከቀደመው ክፍል ጋር ያለውን ትይዩነት ይጠብቃል፤ ደስታውን አይክድም፣ ነገር ግን በዚያ ያልተያዘ አኗኗርን ይጠቁማል።
- source_word: ἀγοράζοντες
  choice: የሚገዙ
  rationale: በዕለታዊ ንግድ ነገርን መግዛት የሚለውን ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: κατέχοντες
  choice: ያላቸው
  rationale: κατέχω መያዝ፣ ማቆየት ወይም በባለቤትነት መያዝ ሊሆን ይችላል። ከመግዛት ጋር ባለው ንፅፅር ‘ያላቸው’ የገዙትን ነገር እንደ ጸና ይዞታ መቁጠርን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ
  choice: ም
  rationale: ተደጋጋሚው καὶ እያንዳንዱን ትይዩ ቡድን ያገናኛል፤ በአማርኛ የተያያዘው ‘-ም’ ይህን ድምርና ምት በተፈጥሯዊ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: የተደጋገመው ὡς μή (‘እንደማይ…’) ያለው አገላለጽ ኃይል
  choice: ማልቀስን፣ መደሰትንና መግዛትን እንዳልተከሰቱ አይክድም፤ አማኞች በእነዚህ የዘመኑ ልምምዶችና ንብረቶች እንዳይያዙ የኑሮ አቋማቸውን ይገልጻል።
  alternative: ድርጊቶቹን በራሳቸው የማይገቡ አድርጎ የሚከለክል ጥብቅ አስኬታዊ ንባብ፣ ወይም የአውዱን የዘመን ፍጻሜ እይታ የሚተው ሥነ ልቦናዊ ንባብ።
  rationale: በ1 ቆሮንቶስ 7፥26፣31 ያለው አውድ ‘አሁን ያለውን ጭንቀት’ እና ‘የዚህ ዓለም መልክ እያለፈ ነው’ የሚለውን ያጎላል። ὡς μή + አሳታፊ ፍጹም ክልከላን ሳይሆን አካሄድን ወይም አቋምን ይገልጻል፤ ትርጉሙም ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የ‘-ም … እንደማይ…’ ድግግሞሽ የግሪኩን ሦስትዮሽ ምትና የጳውሎስን የንግግር ጥብቅነት ይጠብቃል። ‘ይሁኑ’ ከአንቀጽ 29 የሚቀጥለውን የማሳሰቢያ ኃይል በአማርኛ ግልጽ ያደርጋል።
