review_pass:
  verdict: revise
  source_fidelity: The three coordinated groups and the participial contrasts are retained. The draft’s bare እንደማያለቅሱ / እንደማይደሰቱ can be read too readily as a direct factual negation; adding ያህል more clearly conveys the Greek ὡς μὴ construction as a comparative manner or stance. The final contrast should explicitly refer to possessing what is bought.
  naturalness: The revised wording is idiomatic modern standard Amharic, preserves the compact threefold rhythm, and makes the intended comparative force readily understandable.
  terminology: ያለቅሱ, ደስ ይላቸው, ይገዙ, and ይዞታ እንዳላቸው retain the emotional, commercial, and possessive senses of κλαίοντες, χαίροντες, ἀγοράζοντες, and κατέχοντες without importing ascetic interpretation.
  issues:
  - severity: medium
    issue: The main text’s repeated bare እንደማይ… phrasing may sound like an assertion that the people do not actually weep or rejoice.
    rationale: Greek ὡς μὴ + participle here describes how they are to live in relation to real experiences, not the nonoccurrence of those experiences. ያህል naturally marks this comparative force.
  - severity: low
    issue: እንደሌላቸው leaves the object of possession fully implicit.
    rationale: Although understandable in context, ይዞታ እንዳላቸው makes the κατέχοντες contrast clearer while avoiding an overly narrow term such as ownership.
  revised_text: የሚያለቅሱም የማያለቅሱ ያህል፣ ደስ የሚላቸውም ደስ የማይላቸው ያህል፣ የሚገዙም ይዞታ እንደሌላቸው ያህል ይሁኑ፤
