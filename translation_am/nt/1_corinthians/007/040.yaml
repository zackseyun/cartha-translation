base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: am
  text: ነገር ግን በዚሁ ሁኔታ ብትቀር ይበልጥ ደስተኛ ናት[a]፤ ይህም በእኔ ፍርድ ነው። እኔም የእግዚአብሔር መንፈስ እንዳለኝ ይመስለኛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይበልጥ የተባረከች።” የግሪኩ ማካሪዮቴራ (μακαριωτέρα) የበለጠ ደስታን እንዲሁም የበለጠ የተባረከ ሁኔታን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: ይበልጥ ደስተኛ
  rationale: የንጽጽር ቅርጹን በግልጽ ያሳያል፤ በዚህ የተግባራዊ ምክር አውድ ‘ደስተኛ’ ተፈጥሯዊ ሲሆን ‘የተባረከች’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐὰν οὕτως μείνῃ
  choice: እንዳለች ብትኖር
  rationale: μένω የሚያመለክተውን በዚያው ሁኔታ መቆየት በተፈጥሯዊ አማርኛ ይገልጣል፤ οὕτως በአውዱ ወደ መበለትነቷ ይመለሳል እንጂ በትርጉሙ ላይ ከአውዱ በላይ አልተገለጸም።
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: እንደ እኔ አስተያየት
  rationale: γνώμη የግል ነገር ግን የታሰበበትን ፍርድ ወይም አስተያየት ያመለክታል፤ ይህ የጌታ ቀጥተኛ ትእዛዝ ሳይሆን የጳውሎስ የታሰበበት ምክር መሆኑን ይጠብቃል።
- source_word: δοκῶ
  choice: ይመስለኛል
  rationale: የጳውሎስን ትሕትና ያለበት የንግግር አቀራረብ ይጠብቃል፤ ነገር ግን ንግግሩን ተራ ጥርጣሬ አያደርገውም።
- source_word: κἀγὼ
  choice: እኔም
  rationale: ‘እኔ ደግሞ’ የሚለውን ጭማሪና አጽንዖት በአጭርና ተፈጥሯዊ አማርኛ ይይዛል።
- source_word: πνεῦμα θεοῦ
  choice: የእግዚአብሔር መንፈስ
  rationale: በጳውሎስ አጠቃቀምና በዚህ አውድ ሐረጉ አጠቃላይ መንፈሳዊ ዝንባሌን ሳይሆን የእግዚአብሔርን መንፈስ ያመለክታል።
- source_word: ἔχειν
  choice: እንዳለኝ
  rationale: ቀጥተኛውን ‘መኖር/መያዝ’ ትርጉም በአማርኛ ለመንፈስ ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
theological_decisions:
- issue: πνεῦμα θεοῦ መንፈስ ቅዱስን ወይስ አጠቃላይ መንፈሳዊ ዝንባሌን ያመለክታል?
  choice: የእግዚአብሔር መንፈስ
  alternative: መለኮታዊ መንፈሳዊ ግንዛቤ ወይም ከእግዚአብሔር የሆነ መንፈስ
  rationale: ሐረጉ በጳውሎስ ጽሑፎች በተለምዶ የእግዚአብሔርን መንፈስ ያመለክታል፤ እዚህም ጳውሎስ ምክሩ በመንፈስ የተመራ መሆኑን በትሕትና ያረጋግጣል።
- issue: δοκῶ ... πνεῦμα θεοῦ ἔχειν የሚለው የጳውሎስ ንግግር እርግጠኝነት
  choice: ትሕትና ያለበት ነገር ግን እውነተኛ የመንፈስ መመራት ማረጋገጫ
  alternative: መንፈሱ እንዳለው የሚጠራጠርበት ንግግር
  rationale: ‘ይመስለኛል’ የአነጋገሩን ትሕትና ይጠብቃል፤ አውዱ ግን ጳውሎስ መንፈሱ እንዳለው እየተጠራጠረ መሆኑን አያመለክትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ሁለቱ አረፍተ ነገሮች የጳውሎስን የታሰበበት የግል ፍርድና ትሕትና ያለበትን የመንፈስ መመራት ማረጋገጫ ሳያደበዝዙ ያቀርባሉ።
