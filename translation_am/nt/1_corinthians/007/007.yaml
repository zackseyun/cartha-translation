source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: am
  text: ነገር ግን ሰዎች ሁሉ እኔ እንዳለሁት እንዲሆኑ እፈልጋለሁ፤ ሆኖም እያንዳንዱ ከእግዚአብሔር የራሱ ስጦታ አለው፤ አንዱ በዚህ መንገድ፣ ሌላው ደግሞ በዚያ መንገድ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ἀνθρώπους
  choice: ሰዎች ሁሉ
  rationale: ἀνθρώπους በዚህ አጠቃቀም ሰዎችን በአጠቃላይ ያመለክታል፤ በአማርኛም «ሰዎች ሁሉ» የተፈጥሮ እና የጾታ ያልተገደበ አተረጓጎም ነው።
- source_word: ὡς καὶ ἐμαυτόν
  choice: እኔ እንዳለሁት
  rationale: ዐውደ ንባቡ የጳውሎስን ያላገባ ሁኔታ ይጠቁማል፤ ምንጩ ግን ይህን እዚህ በግልጽ ስም ስለማይጠራው አገላለጹ ክፍት ሆኖ ተጠብቋል።
- source_word: χάρισμα
  choice: ስጦታ
  rationale: ቃሉ በእግዚአብሔር የተሰጠን ጸጋዊ ስጦታ ያመለክታል፤ «ስጦታ» በዚህ ዐውደ ንባብ ተፈጥሯዊና ግልጽ ነው።
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: የአንዱ እንዲህ ነው፣ የሌላውም እንዲያ ነው
  rationale: የግሪኩን ተቃርኖና ሆን ብሎ ያልተወሰነ አገላለጽ ይጠብቃል፤ የስጦታዎቹን ዓይነት ከምንጩ በላይ አይገልጽም።
theological_decisions:
- issue: «እኔ እንዳለሁት» የሚያመለክተው ሁኔታ
  choice: ሁኔታውን በቁጥሩ ውስጥ በስም አለመግለጽ
  alternative: «እንደ እኔ ያላገቡ» ብሎ መተርጎም
  rationale: ቅርብ ዐውደ ንባቡ ያላገባነትን ቢጠቁምም፣ የግሪክ ጽሑፉ በዚህ ሐረግ ውስጥ ቃሉን በቀጥታ አይጠቀምም፤ ስለዚህ እውነተኛው የአገላለጽ ክፍተት ተጠብቋል።
- issue: የጋብቻና ያላገባነት ስጦታነት
  choice: «እያንዳንዱ ... የራሱ ስጦታ አለው» ብሎ ሁለቱንም ቅርጾች ክፍት ማድረግ
  alternative: ያላገባነትን ብቻ እንደ ስጦታ መግለጽ
  rationale: «ὁ μὲν οὕτως, ὁ δὲ οὕτως» የተለያዩ ስጦታዎችን ያመለክታል፤ ጽሑፉ የትኛውንም ብቻ እንደ ስጦታ አይገድብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር ተቃርኖ እና ያልተወሰነ መደምደሚያ ተጠብቀዋል።
