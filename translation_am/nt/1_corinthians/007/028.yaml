  rationale: ጳውሎስ እዚህ ስለሰው ኃጢአተኛ ባሕርይ እያስተማረ ሳይሆን ከጋብቻ ጋር ስለሚያያዙ ተግባራዊ፣ ምድራዊ ችግሮች እያስጠነቀቀ ነው። ቀጥተኛውን አገላለጽ መጠበቁ ያልተገባ ሥነ መለኮታዊ ትርጓሜ ከመጫን ይቆጠባል።
- issue: φείδομαι የሚገልጠው ጊዜና ዓላማ
  choice: ‘ይህን ላድናችሁ እፈልጋለሁ’—የጳውሎስን የእረኝነት ዓላማ የሚገልጥ
  alternative: ‘እቆጥባችኋለሁ’ ወይም ‘እየቆጠብኳችሁ ነው’
  rationale: የግሪኩ የአሁን ጊዜ ቅርጽ በቀጥታ ‘እቆጥባችኋለሁ’ ሊባል ቢችልም፣ በአውዱ የማስጠንቀቂያውን ዓላማ ይገልጣል። ዋናው ጽሑፍ ይህን በተፈጥሯዊነት ይገልጣል፣ አማራጩም በማስታወሻ ተጠብቋል።
