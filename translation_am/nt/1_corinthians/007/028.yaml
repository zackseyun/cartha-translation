base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: am
  text: ነገር ግን ብታገባም ኃጢአት አልሠራህም፤ ድንግሊቱም ብታገባ ኃጢአት አልሠራችም። ሆኖም እንደነዚህ ያሉት በሥጋቸው መከራ ይኖራቸዋል፤[a] እኔ ግን ልቆጥባችሁ እፈልጋለሁ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በሥጋቸው መከራ” የሚለው “በሥጋቸው ችግር” ወይም “ጭንቀት” ተብሎም ሊተረጎም ይችላል። ሐረጉ በተለይ “ኃጢአተኛ ባሕርይን” ሳይሆን፣ ከጋብቻ ጋር የተያያዙ ምድራዊ ወይም አካላዊ ችግሮችን የሚያመለክት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እኔ ግን እቆጥባችኋለሁ” ወይም “ልቆጥባችሁ እሻለሁ።” ጳውሎስ ስለዚህ ችግር ሲያስጠነቅቅ የእረኝነት ዓላማውን ይገልጣል።
    reason: lexical_alternative
