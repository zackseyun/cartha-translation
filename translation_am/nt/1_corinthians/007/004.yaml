  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: am
  text: ሚስት በራሷ ሰውነት ላይ ሥልጣን የላትም[a]፤ ባሏ ግን አለው። እንደዚሁም ባል በራሱ ሰውነት ላይ ሥልጣን የለውም፤ ሚስቱ ግን አላት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በራሷ/በራሱ ሰውነት ላይ ሥልጣን አትጠቀምም/አይጠቀምም።» የግሪኩ ግስ ሥልጣን መያዝን ወይም ሥልጣንን መጠቀምን ሊያመለክት ይችላል፤ እዚህ ላይ የባልና የሚስትን የእርስ በርስ ሥልጣን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ሚስት
  rationale: በ1 ቆሮንቶስ 7 የጋብቻ ዐውድ ውስጥ γυνή ያገባችን ሴት ስለሚያመለክት፣ ከአጠቃላዩ «ሴት» ይልቅ «ሚስት» ትክክለኛ ነው።
- source_word: ἀνήρ
  choice: ባል
  rationale: ከγυνή ጋር በጋብቻ ዐውድ የተጣመረ ስለሆነ፣ ከአጠቃላዩ «ወንድ» ይልቅ «ባል» ተመርጧል።
- source_word: ἰδίου σώματος
  choice: በራሷ ሰውነት ላይ / በራሱ ሰውነት ላይ
  rationale: ἴδιος የራስ የሆነውን የባለቤትነት አጽንዖት ያሳያል፤ «የራሷ/የራሱ ሰውነት» ይህን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἐξουσιάζει
  choice: ሥልጣን የላትም / የለውም
  rationale: ግሱ ሥልጣን መያዝን ወይም መጠቀምን ሊያመለክት ይችላል። «ሥልጣን የለውም» የግሪኩን ቀጥተኛ ኃይልና የሁለቱን የተመጣጠነ አወቃቀር ይጠብቃል።
- source_word: ἀλλά
  choice: ግን
  rationale: በራስ ሰውነት ላይ ሥልጣን አለመኖርንና የትዳር ጓደኛው ሥልጣን መኖሩን የሚያነጻጽረውን አλλά በተፈጥሯዊ አማርኛ «ግን» ይገልጣል።
- source_word: ὁμοίως δὲ καὶ
  choice: እንደዚሁም
  rationale: ይህ ሐረግ ሁለተኛው ንግግር ከመጀመሪያው ጋር ፍጹም ትይዩ መሆኑን ያጎላል፤ «እንደዚሁም» ይህን በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
theological_decisions:
- issue: በጋብቻ ውስጥ ያለው ሥልጣን ባሕርይ
  choice: የባልና የሚስትን የእርስ በርስ ሥልጣን በትይዩ አገላለጽ ማቆየት
  alternative: ንግግሩን «ሰውነቷ/ሰውነቱ የራሷ/የራሱ አይደለም» ብሎ ማለዘብ፣ ወይም «አንዱ የሌላውን ሰውነት ይቆጣጠራል» ብሎ ማጠንከር
  rationale: የግሪኩ አወቃቀር ሚስትና ባልን በእኩል ትይዩነት ያቀርባል። ትርጉሙ አንድ-ወገናዊ ተዋረድን ወይም ግዴታዊ ቁጥጥርን ሳያስገባ፣ ይህን የእርስ በርስነት መጠበቅ አለበት።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር በሁለት ሚዛናዊ ዓረፍተ ነገሮች ተጠብቋል።
