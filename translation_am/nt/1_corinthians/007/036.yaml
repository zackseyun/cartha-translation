  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው አሻሚነት በዋናው ጽሑፍ ተጠብቆ፣ ዋና ዋናዎቹ አማራጭ ንባቦች በእግር ማስታወሻ ተገልጠዋል።
