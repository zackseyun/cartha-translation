source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: am
  text: ነገር ግን ማንም በራሱ ድንግል[a] ላይ ተገቢ ባልሆነ ሁኔታ እየተመላለሰ እንደሆነ ቢያስብ፣ እርሷም የወጣትነት ዘመኗ ያለፈ ከሆነና እንዲሁ ሊሆን የሚገባ ከሆነ፣ የፈለገውን ያድርግ፤ ኃጢአት አይሠራም። ይጋቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በታጨችለት ድንግል ላይ።” በባህላዊ ትርጓሜ ደግሞ “በድንግል ልጁ ላይ” ተብሎ ተረድቷል። የግሪክኛው አገላለጽ አሻሚ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: ተገቢ ያልሆነ ነገር እያደረገ
  rationale: ግሱ ያልተገባ ወይም የማይመጥን አካሄድን ያመለክታል፤ ይህ አተረጓጎም የግብረ ገብና የማኅበራዊ አግባብ ጉድለትን ሳያጋንን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: በራሱ ድንግል ላይ
  rationale: παρθένος ‘ድንግል’ ማለት ነው፤ αὐτοῦ በዚህ አውድ እጮኛን ወይም በአባት/አሳዳጊ እንክብካቤ ሥር ያለች ድንግል ልጅን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ አሻሚነቱን ጠብቋል።
- source_word: ὑπέρακμος
  choice: የወጣትነት ዘመኗ ያለፈ
  rationale: ቃሉ የወጣትነትን አበባማ ወይም ዋነኛ ዘመን ማለፍን ያመለክታል፤ ይህ ምርጫ የዘመናዊ የዕድሜ ወሰን ሳያስገባ ትርጉሙን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: እንዲሁ ሊሆን የሚገባ ከሆነ
  rationale: ὀφείλει ግዴታን ወይም አስፈላጊነትን፣ γίνεσθαι ደግሞ መሆንን ያመለክታል፤ የግሪክኛውን አጠቃላይነት ሳይገድብ ጠብቋል።
- source_word: ὃ θέλει ποιείτω
  choice: የፈለገውን ያድርግ
  rationale: የሦስተኛ መደብ ፈቃጅ ትእዛዙን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐχ ἁμαρτάνει
  choice: ኃጢአት እየሠራ አይደለም
  rationale: የአሁን ጊዜውን ቅርጽና ድርጊቱ ኃጢአት አለመሆኑን በግልጽ ይጠብቃል።
- source_word: γαμείτωσαν
  choice: ይጋቡ
  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዝ ሲሆን፣ ሁለቱ ወገኖች ጋብቻ እንዲፈጽሙ የሚሰጠውን ፈቃድ/ትእዛዝ በአጭሩ ይገልጣል።
theological_decisions:
- issue: “በራሱ ድንግል” (παρθένον αὐτοῦ) የሚለው ማንን እንደሚያመለክት
  choice: ዋናው ጽሑፍ “በራሱ ድንግል ላይ” በማለት አሻሚነቱን ጠብቋል።
  alternative: “በእጮኛው/በታጨችለት ድንግል ላይ” ወይም “በድንግል ልጁ ላይ”
  rationale: የግሪክኛው አገላለጽ በእውነት አሻሚ ሲሆን አውዱም በሁለቱም መንገድ ተተርጉሟል፤ ስለዚህ አንዱን ብቻ በዋናው ጽሑፍ መወሰን ከምንጩ በላይ መተርጎም ይሆናል።
