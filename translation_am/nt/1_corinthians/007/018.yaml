base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: am
  text: ማንም ሰው ተገርዞ ሳለ ተጠርቶ ነበርን? ግርዛቱን ለመቀልበስ አይሞክር[a]። ማንም ሰው ያልተገረዘ ሳለ ተጠርቶ ነበርን? አይገረዝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፣ “ያልተገረዘ ለመሆን አይሞክር።” ይህም የግርዛትን ምልክት ለመደበቅ ወይም ለመቀልበስ የሚደረግ ሙከራን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: ተገርዞ ሳለ
  rationale: የግሪኩ ፍጹም አካፋይ ግስ ግርዛቱ ተፈጽሞ የቀጠለውን ሁኔታ ያመለክታል፤ ይህ አተረጓጎም ያንን ሁኔታና ከመጠራቱ ጋር ያለውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκλήθη / κέκληταί
  choice: ተጠራን
  rationale: ቃሉ በዐውደ ንባቡ የእግዚአብሔርን ጥሪ ያመለክታል። ሁለቱንም የግሪክ ግስ ቅርጾች በተመሳሳይ የአማርኛ አገላለጽ መተርጎም የአንቀጹን ትይዩነት ይጠብቃል።
- source_word: ἐπισπάσθω
  choice: የግርዛቱን ምልክት ለመደበቅ አይሞክር
  rationale: ግሱ የግርዛትን የሚታይ ምልክት ለመለወጥ፣ ለመቀልበስ ወይም ለመደበቅ የሚደረግን ጥረት ያመለክታል። ይህ ለዘመናዊ አንባቢ ግልጽ ሲሆን ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐν ἀκροβυστίᾳ
  choice: ሳይገረዝ
  rationale: ሐረጉ ሰውየው በተጠራበት ጊዜ ያልተገረዘ መሆኑን ያመለክታል፤ ይህ ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: περιτεμνέσθω
  choice: አይገረዝ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር የሚሰጠውን ክልከላ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በሁለቱም ሐረጎች ያለው “ተጠራ” የሚለው ትርጉም
  choice: አንድ ሰው ባለበት ማኅበራዊና ሃይማኖታዊ ሁኔታ ሳለ እግዚአብሔር ወደ ክርስቲያናዊ ሕይወት መጥራቱ
