  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: am
  text: ስለ ደናግል[a] ግን፣ ከጌታ የመጣ ትእዛዝ የለኝም፤ ነገር ግን ከጌታ ምሕረት አግኝቼ ታማኝ እንድሆን እንደተደረግሁ ሰው ፍርዴን[b] እሰጣለሁ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ደናግል” የሚለው “ያላገቡ ሴቶች” ወይም፣ አውዱን አንዳንዶች በሚረዱበት መንገድ፣ “ድንግል ሴት ልጆች” ማለት ሊሆን ይችላል። ግሪክኛው በቀጥታ “ደናግል” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “አስተያየቴን” ወይም “ምክሬን”። ጳውሎስ በዚህ ስፍራ የሰጠውን ፍርድ ከጌታ የመጣ ቀጥተኛ ትእዛዝ ጋር ይለያል።
    reason: alternative_reading
  - marker: c
    text: “ታማኝ እንድሆን” የሚለው “የሚታመንበት እንድሆን” ተብሎም ሊተረጎም ይችላል። የግሪክኛው ቃል “ታማኝ” ወይም “የሚታመንበት” ማለት ሊሆን ይችላል፤ በዚህ አውድ ጳውሎስ በጌታ ምሕረት ሊታመንበት የሚችል መሆኑን ይገልጻል።
    reason: lexical_alternative
