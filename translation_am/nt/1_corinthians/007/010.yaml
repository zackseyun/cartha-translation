  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: am
  text: ለተጋቡት ግን ይህን አዝዛለሁ—የማዝዘውም እኔ ሳልሆን ጌታ ነው፤ ሚስት ከባሏ እንዳትለይ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባሏን እንዳትፈታ።” የግሪኩ ግስ በትዳር ውስጥ መለያየትን ሊያመለክት ይችላል፤ በዚህ አውድ ፍቺንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: ለተጋቡት ግን
  rationale: የፍጹም ጊዜው አሳታፊ ግስ በጋብቻ ሁኔታ ውስጥ ያሉትን ያመለክታል፤ የዳቲቭ ተቀባይነት ‘ለ-’ በሚለው ተጠብቋል። δὲ ደግሞ የንግግር ሽግግሩን በቀላል ‘ግን’ ያሳያል።
- source_word: παραγγέλλω
  choice: ይህን አዝዛለሁ
  rationale: ግሱ ሥልጣን ያለውን ትእዛዝ ያመለክታል፤ አተረጓጎሙም ቀጥተኛና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: የማዝዘውም እኔ ሳልሆን ጌታ ነው
  rationale: በእኔና በጌታ መካከል ያለውን አጽንዖታዊ ንፅፅር በተፈጥሯዊ አማርኛ ይጠብቃል፤ የጳውሎስን ሥልጣን መካድ የሚል ትርጓሜ አያስገባም።
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: ሚስት ከባሏ
  rationale: የጋብቻው አውድ γυνήን ‘ሚስት’፣ ἀνήρንም ‘ባል’ እንደሚል ይወስናል፤ የባለቤትነት ቅጥያው የግንኙነቱን ሐሳብ ተፈጥሯዊ ያደርገዋል።
- source_word: μὴ χωρισθῆναι
  choice: እንዳትለይ
  rationale: ትእዛዙን የሚያስረዳ አሉታዊ የይዘት አንቀጽ ነው። ‘መለየት’ የትዳር መለያየትን ያሳያል፣ ነገር ግን ሐረጉን በዘመናዊ ሕጋዊ ፍቺ ብቻ አያጥበውም።
theological_decisions:
- issue: “እኔ ሳልሆን ጌታ” የሚለው ሐረግ ትርጉም
  choice: ጳውሎስ ቀድሞውኑ በጌታ ኢየሱስ ከተሰጠ ትምህርት የመጣውን ትእዛዝ ከራሱ ቀጣይ ሐዋርያዊ አተገባበር ይለያል።
  alternative: ጳውሎስ የራሱን ቃል ሥልጣን እየካደ ነው።
  rationale: ቀጥተኛው አውድ በጌታ የተሰጠን ትምህርትና ጳውሎስ ለሌላ ሁኔታ የሚሰጠውን መመሪያ ያነፃፅራል፤ ትርጉሙ ንፅፅሩን ይጠብቃል እንጂ ከጽሑፉ በላይ አይፈታውም።
- issue: χωρισθῆναι በጋብቻ አውድ ያለው ወሰን
  choice: መለየት
  alternative: መፋታት
  rationale: በቁጥር 10–11 ያለው የቃላት አጠቃቀም መለያየትን ይገልጻል፤ ‘መለየት’ የሕጋዊ ፍቺን እድል ሳይክድ ቃሉን በዚያ ብቻ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመጨረሻው ሰረዝ ንግግሩ በቀጣዩ ቁጥር እንደሚቀጥል ያሳያል።
