  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: am
  text: ነገር ግን፣ ከወሲብ ኃጢአቶች[a] የተነሣ እያንዳንዱ ወንድ የራሱ ሚስት ይኑረው፤ እያንዳንዷም ሴት የራሷ ባል ይኑራት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከወሲብ ኃጢአት የተነሣ።” በግሪክኛው “የወሲብ ኃጢአቶች” የሚለው ብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: ነገር ግን፣ … የተነሣ
  rationale: δέ ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ንጽጽር በ“ነገር ግን” ያሳያል፤ διά ከተሳቢ ቅጽ ጋር ምክንያትን ስለሚገልጥ “የተነሣ” ተብሏል።
- source_word: τὰς πορνείας
  choice: ከዝሙት ድርጊቶች
  rationale: πορνεία ከጋብቻ ሥርዓት ውጭ የሆነን የወሲብ ኃጢአት በሰፊው ያመለክታል። የግሪክኛውን ብዙ ቁጥር ለማቆየት “ድርጊቶች” ተጨምሯል፤ ተፈጥሯዊው ነጠላ አገላለጽ በእግር ማስታወሻ ቀርቧል።
- source_word: ἕκαστος
  choice: እያንዳንዱ ወንድ
  rationale: የወንድ ፆታ ነጠላ ቅጹ ከἑκάστη ጋር በትይዩ በመቆሙ እዚህ ወንድን ያመለክታል። “ባል” ማለት ከጽሑፉ በላይ የጋብቻ ሁኔታን አስቀድሞ ስለሚወስን “ወንድ” ተመርጧል።
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: የራሱ ሚስት
  rationale: γυνή “ሴት” ወይም “ሚስት” ሊሆን ቢችልም፣ ከἄνδρα ጋር ባለው የጋብቻ ትይዩነት “ሚስት” ተፈጥሯዊ ነው። ἑαυτοῦ የራስን ባለቤትነት “የራሱ” በማለት ያጎላል።
- source_word: ἐχέτω
  choice: ይኑረው / ይኑራት
  rationale: የሦስተኛ መደብ ትእዛዛዊ ቅጹን በአማርኛ ተፈጥሯዊ ትእዛዛዊ አገላለጽ ያቀርባል፤ “ያግባ” ወይም “የጋብቻ ግዴታውን ይፈጽም” የሚል ትርጓሜ አልተጨመረም።
- source_word: καὶ ἑκάστη
  choice: እያንዳንዷም ሴት
  rationale: የሴት ፆታ ነጠላ አከፋፋይ ቅጹን ከመጀመሪያው ሐረግ ጋር በትይዩ ያቆያል።
- source_word: τὸν ἴδιον ἄνδρα
  choice: የራሷ ባል
  rationale: ἀνήρ “ወንድ” ወይም “ባል” ሊሆን ቢችልም፣ ከγυναῖκα ጋር ባለው የጋብቻ ዐውድ “ባል” ይገባል። ἴδιον የሚያጎላው የራስ የሆነውን በመሆኑ “የራሷ” ተብሏል።
theological_decisions:
- issue: ጥቅሱ ዝሙትን ለመከላከል ጋብቻን እንደ ፈቃድ ያቀርባል ወይስ ስለ ጋብቻ ግንኙነት ትእዛዝ ይሰጣል?
  choice: “ይኑረው/ይኑራት” የሚለውን ትእዛዛዊ አነጋገር በቀጥታ ማቆየት፣ ከጽሑፉም በላይ ስለ ጋብቻ ሰፊ የእምነት ድምዳሜ አለመጨመር።
  alternative: “ያግባ” ወይም “የጋብቻ ግዴታውን ይፈጽም” ብሎ በትርጓሜ ማቅረብ።
  rationale: ግሪክኛው ἐχέτω፣ “ይኑረው” ይላል እንጂ በግልጽ “ያግባ” ወይም “የጋብቻ ግንኙነትን ይፈጽም” አይልም። ይህ ምርጫ የጽሑፉን ቀጥተኛነትና የትርጓሜ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ዝሙት” መጽሐፍ ቅዱሳዊ ክብሩን የጠበቀና በዘመናዊ አማርኛ የሚታወቅ ቃል ነው፤ የግሪክኛው ብዙ ቁጥር “ድርጊቶች” በሚል ግልጽ ሆኗል።
