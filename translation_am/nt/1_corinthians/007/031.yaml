base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: am
  text: ዓለምን የሚጠቀሙም፣ ሙሉ በሙሉ እንደማይጠቀሙባት ይሁኑ[a]፤ የዚህ ዓለም ያሁኑ መልክ[b] እያለፈ ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እስከ ሙሉ ድረስ እንደማይጠቀሙባት»፤ ግሱ «አላግባብ እንደማይጠቀሙባት» የሚል ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ውጫዊ መልክ» ወይም «አኳኋን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: የሚጠቀሙት
  rationale: ቃሉ ከዓለም ነገሮች ጋር መገናኘትንና እነርሱን መጠቀምን ያመለክታል፤ «የሚጠቀሙት» ቀጥተኛና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: κόσμον
  choice: ዓለምን
  rationale: በዐውዱ ውስጥ የአሁኑን ማኅበራዊና ቁሳዊ የዓለም ሥርዓት ያመለክታል፤ «ዓለም» የግሪኩን ሰፊ ትርጉም ሳያጠብ ያቆያል።
- source_word: ὡς μὴ καταχρώμενοι
  choice: ሙሉ በሙሉ እንደማይጠቀሙበት
  rationale: καταχράομαι የχράομαιን ትርጉም አጠናክሮ «እስከ ሙሉ ድረስ መጠቀም» ወይም በአንዳንድ ዐውድ «አላግባብ መጠቀም» ሊል ይችላል። ዋናው አተረጓጎም በሁለቱ ግሶች መካከል ያለውን የቃላት ጨዋታና የዓለም ነገሮችን ፍጹም አድርጎ አለመያዝን ያቆያል።
- source_word: παράγει
  choice: እያለፈ ነው
  rationale: የአሁን ጊዜው ግስ ቀጣይ ሂደትን ያሳያል፤ «እያለፈ ነው» የዓለሙን ጊዜያዊነት በግልጽ ያስተላልፋል።
- source_word: σχῆμα
  choice: ያሁኑ መልክ
  rationale: σχῆμα የሚታየውን መልክ፣ አቀማመጥ ወይም ጊዜያዊ አኳኋን ያመለክታል። «ያሁኑ መልክ» በዐውዱ የተገለጠውን ጊዜያዊነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ κόσμου τούτου
  choice: የዚህ ዓለም
  rationale: «የዚህ» የሚለው ጠቋሚ ቃል τούτουን በግልጽ ጠብቆ የአሁኑን እያለፈ ያለ የዓለም ሥርዓት ያመለክታል።
theological_decisions:
- issue: በχρώμενοι እና καταχρώμενοι መካከል ያለው ዝምድና
  choice: አማኞች ዓለምን ሲጠቀሙ ፍጹም ተጠምደውበት ወይም እስከ ሙሉ ድረስ እንዳይጠቀሙበት የሚያሳስብ ንባብ
  alternative: ዓለምን አላግባብ ከመጠቀም ብቻ የሚከለክል ንባብ፤ ወይም «እንደማይጠቀሙ» የሚል ንባብ
  rationale: የሁለቱ ዝምድና በ«መጠቀም/ሙሉ በሙሉ መጠቀም» ተጠብቋል፤ ነገር ግን ግሱ «አላግባብ መጠቀም» የሚለውንም ትርጉም ሊይዝ ስለሚችል በማስታወሻ ተገልጧል።
- issue: የσχῆμα ትርጉም
  choice: ጊዜያዊው የዓለም መልክ ወይም አቀማመጥ
  alternative: የዓለም ውጫዊ ገጽታ ብቻ፤ ወይም የዓለም መሠረታዊ ባሕርይ
  rationale: በዐውዱ σχῆμα የሚያመለክተው የዓለምን ዘላቂ ማንነት ሳይሆን አሁን ያለውንና እያለፈ ያለውን አቀማመጥ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አንቀጽ ከቀደመው ሐሳብ ጋር የተያያዘ ቢሆንም፣ «ይሁኑ» የሚለው ቃል በአማርኛ የሐሳቡን ማሳሰቢያዊ አወቃቀር ተፈጥሯዊ ያደርገዋል።
