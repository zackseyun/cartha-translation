id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: am
  text: እርሱም ተከፋፍሏል። ያላገባች ሴት፣ ማለትም ድንግል[a]፣ በሥጋም በመንፈስም ቅድስት እንድትሆን የጌታን ነገሮች ታስባለች፤ ያገባች ሴት ግን ባሏን እንዴት ደስ እንደምታሰኝ የዓለምን ነገሮች ታስባለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያላገባች ሴትና ድንግል የጌታን ነገሮች ያስባሉ።” ግሪክኛው ያላገባችውን ሴትና ድንግሏን አንድ ምድብ አድርጎ ከመግለጽ ይልቅ ሁለት ምድቦች አድርጎ እንደሚዘረዝር ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: ተከፋፍላለች
  rationale: ፍጹም ተደራጊ ቅርጹ የተፈጠረና የቀጠለ የፍላጎት መከፋፈልን ያሳያል፤ ቃሉን ወደ ‘ትጨነቃለች’ ሳይተረጉም የመከፋፈልን ዘይቤ ይጠብቃል።
- source_word: γυνὴ ἡ ἄγαμος
  choice: ያላገባች ሴት
  rationale: γυνή ሴት ወይም ሚስት ሊሆን ቢችልም፣ ከἄγαμος ጋር በዚህ ንጽጽር ያላገባች ሴትን ያመለክታል።
- source_word: παρθένος
  choice: ድንግል
  rationale: የግሪክኛውን ቃል የተለየ ትርጉም በቀጥታና በተለመደ የአማርኛ ቃል ይጠብቃል።
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: ያላገባች ሴት፣ ማለትም ድንግል
  rationale: የነጠላው μεριμνᾷ ግስ ሁለተኛውን ስም እንደ ማብራሪያ ለመውሰድ ይደግፋል፤ ሆኖም ሁለት ምድቦች የሚዘረዝር ንባብ በማስታወሻ ተጠብቋል።
- source_word: μεριμνᾷ
  choice: ታስባለች
  rationale: በዚህ አውድ ቃሉ የኃጢአት ጭንቀትን ሳይሆን ትኩረት የሚሰጥበትን ጉዳይ ያሳያል፤ ‘ታስባለች’ ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὰ τοῦ κυρίου
  choice: የጌታን ነገሮች
  rationale: ከ‘የዓለምን ነገሮች’ ጋር ያለውን የጳውሎስ ተመጣጣኝ ንጽጽር ይጠብቃል።
- source_word: ἵνα ᾖ ἁγία
  choice: ቅድስት እንድትሆን
  rationale: የἵνα ዓላማን ወይም ውጤትን የሚገልጽ ኃይልና ግልጽ የቅድስና ቃል ተጠብቀዋል።
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: በሥጋም በመንፈስም
  rationale: የቅድስናውን ሁለቱን ዘርፎች καὶ ... καὶ በሚያሳይ ተመጣጣኝ የአማርኛ አገባብ ይገልጻል።
- source_word: ἡ δὲ γαμήσασα
  choice: ያገባች ሴት ግን
  rationale: በትዳር ሁኔታ ያለችውን ሴት በተፈጥሯዊ አማርኛ ይገልጻል፣ δέ የሚያሳየውንም ንጽጽር ‘ግን’ ያስተላልፋል።
- source_word: τὰ τοῦ κόσμου
  choice: የዓለምን ነገሮች
  rationale: ከ‘የጌታን ነገሮች’ ጋር ያለውን መዋቅራዊ ንጽጽር ይጠብቃል፤ አውዱ ከሚፈቅደው በላይ ክፉ ትርጉም አይጨምርም።
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: ባሏን እንዴት ደስ እንደምታሰኝ
  rationale: ἀνήρ በጋብቻ አውድ ‘ባል’ ማለት ነው፤ ሐረጉም የምታስብበትን ጉዳይ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ‘ያላገባች ሴት’ እና ‘ድንግል’ አንድን ምድብ የሚገልጹ ናቸው ወይስ ሁለት ምድቦችን ይዘረዝራሉ?
  choice: እንደ ማብራሪያ፣ ‘ያላገባች ሴት፣ ማለትም ድንግል’
  alternative: እንደ ሁለት የተቀናጁ ምድቦች፣ ‘ያላገባች ሴትና ድንግል’
  rationale: የግሪክኛው አገባብ የታመቀ ሲሆን የነጠላው ግስ እንደ አንድ ርዕሰ ጉዳይ መውሰድን ይደግፋል። ሌላው ንባብ ግን ሰዋሰዋዊ ዕድል ስላለው በማስታወሻ ተጠብቋል።
- issue: ‘የዓለምን ነገሮች’ የሚለው በዚህ አውድ የግድ ኃጢአታዊ ነገሮችን ያመለክታልን?
  choice: ያለ ተጨማሪ ክፉ ፍርድ ‘የዓለምን ነገሮች’ ተብሎ ተተርጉሟል
  alternative: ‘ዓለማዊ ጉዳዮች’ ብሎ መተርጎም
  rationale: ቀጥሎ ያለው ሐረግ ባሏን ደስ ማሰኘትን ያብራራል፤ ስለዚህ ትርጉሙ ጽሑፉ ከሚለው በላይ የሥነ ምግባር ኩነኔ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሥጋ’፣ ‘መንፈስ’፣ ‘ቅድስት’ እና ‘ጌታ’ የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል፤ አገባቡ ግን ከጥንታዊ ወይም ከከባድ ቅርጽ ተቆጥቧል።
