  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: am
  text: መገረዝ ምንም አይደለም[a]፤ አለመገረዝም ምንም አይደለም፤ ነገር ግን የእግዚአብሔርን ትእዛዛት መጠበቅ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በሁለቱም ስፍራ «ምንም ዋጋ የለውም»።
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: መገረዝ
  rationale: በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል፤ እዚህ ድርጊቱን ብቻ ሳይሆን የተገረዘ የመሆንን ሁኔታና የቃል ኪዳን መለያነትን ያመለክታል።
- source_word: οὐδέν ἐστιν
  choice: ምንም አይደለም
  rationale: የግሪኩን አጭርና አጽንዖት ያለው አገላለጽ እንዲሁም በሁለቱ አንቀጾች ያለውን ድግግሞሽ ይጠብቃል። ‘ምንም ዋጋ የለውም’ የሚለው ትርጉም በማስታወሻ ተጠቅሷል።
- source_word: ἀκροβυστία
  choice: አለመገረዝ
  rationale: ከ‘መገረዝ’ ጋር ያለውን ቀጥተኛ ተቃርኖና የንግግሩን ትይዩነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀλλά
  choice: ነገር ግን
  rationale: ውጫዊ የሁኔታ መለያዎቹን ከእግዚአብሔር ትእዛዛት መጠበቅ ጋር የሚያነጻጽረውን ግልጽ ተቃርኖ ያሳያል።
- source_word: τήρησις
  choice: መጠበቅ
  rationale: ‘ትእዛዛትን መጠበቅ’ በአማርኛ ተፈጥሯዊና የተለመደ አገላለጽ ሲሆን የስሙን የማክበርና የመታዘዝ ሐሳብ ይጠብቃል።
- source_word: ἐντολῶν θεοῦ
  choice: የእግዚአብሔርን ትእዛዛት
  rationale: የግሪኩን ብዙ ቁጥርና የባለቤትነት ግንኙነት በግልጽና ክቡር አማርኛ ይገልጻል።
theological_decisions:
- issue: ጳውሎስ ስለ መገረዝና አለመገረዝ የሰጠው ዋጋ
  choice: ጥቅሱ መገረዝንና አለመገረዝን ከእግዚአብሔር ትእዛዛት መጠበቅ ጋር ሲያነጻጽር እንደ ሁኔታ መለያዎች ዋጋቸውን ያሳንሳል።
  alternative: ጥቅሱ መገረዝ በሁሉም ሁኔታና በማንኛውም ትርጉም ምንም ዓይነት ሥነ ምግባራዊ ጠቀሜታ እንደሌለው ይደነግጋል።
  rationale: የግሪኩ ንግግር ሁለቱም ‘ምንም አይደሉም’ ብሎ ከዚያ የእግዚአብሔርን ትእዛዛት መጠበቅ ጋር ያነጻጽራቸዋል። ትርጉሙ ይህን ውጥረት ይጠብቃል እንጂ ከጥቅሱ የሚያልፍ ሥነ መለኮታዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የግሪኩን ሦስት ክፍል ትይዩ አወቃቀርና ድግግሞሽ ለማቆየት ሐረጎቹ በነጠላ ሰረዝ ተለያይተዋል፤ በመጨረሻው ክፍል በአማርኛ የሚያስፈልገው ‘ነው’ ተጨምሯል።
