  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: am
  text: ባል ለሚስቱ የሚገባትን[a] ይስጣት፤ እንደዚሁም ሚስት ለባሏ የሚገባውን ትስጠው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ለእርስዋ የሚገባትን ዕዳ ወይም ግዴታ።” በዚህ አውድ ባልና ሚስት እርስ በርሳቸው ያለባቸውን የትዳር ግንኙነት ግዴታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί / γυνή
  choice: ሚስት / ሚስቱ
  rationale: በዚህ የጋብቻ አውድ γυνή በአጠቃላይ ‘ሴት’ ሳይሆን ‘ሚስት’ ማለት ነው።
- source_word: ἀνήρ / ἀνδρί
  choice: ባል / ባሏ
  rationale: ከγυνή ጋር በተመጣጣኝ የጋብቻ አውድ ‘ወንድ’ ሳይሆን ‘ባል’ የሚለው ይስማማል።
- source_word: ὀφειλήν
  choice: የሚገባትን / የሚገባውን
  rationale: ቃሉ በመሠረቱ የሚገባ ዕዳን ወይም ግዴታን ያመለክታል። ይህ አተረጓጎም የቃሉን ስፋት ይጠብቃል፤ የጋብቻ አውዱንም ሳይደብቅ ከልክ በላይ አይተረጉመውም።
- source_word: ἀποδιδότω
  choice: ይስጣት / ትስጠው
  rationale: የትእዛዝ ኃይሉንና ተደጋጋሚ ግዴታውን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὁμοίως δὲ καὶ
  choice: እንደዚሁም
  rationale: በባልና በሚስት መካከል ያለውን የጋራና እኩል ግዴታ በአጭሩ ያሳያል።
theological_decisions:
- issue: ὀφειλή የሚያመለክተውን የጋብቻ ግዴታ ምን ያህል ግልጽ ማድረግ እንዳለበት
  choice: በዋናው ጽሑፍ ‘የሚገባትን/የሚገባውን’ ማለት፣ የጋብቻ ግዴታ መሆኑን በማስታወሻ ማብራራት
  alternative: ‘የጋብቻ ግዴታዋን/ግዴታውን’ ወይም ‘የትዳር መብቷን/መብቱን’ ማለት
  rationale: የአካባቢው አውድ የባልና የሚስትን የጾታ ግንኙነት ግዴታ ያመለክታል፤ ነገር ግን ስሙ ራሱ ሰፋ ያለ ‘የሚገባ ነገር/ግዴታ’ ነው። ስለዚህ ዋናው ጽሑፍ የቃሉን ስፋት ሲጠብቅ ማስታወሻው አውዱን ያብራራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘የሚገባትን/የሚገባውን’ የሚለው ተመጣጣኝ አገላለጽ የግሪኩን የጋራ ግዴታ እና የሁለቱን እኩልነት ይጠብቃል።
