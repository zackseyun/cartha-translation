  alternative: ‘ድንግል እጮኛውን የሚያገባ መልካም ያደርጋል፤ የማያገባት ግን የተሻለ ያደርጋል’፤ ሌላው የተለመደ ትርጓሜ ደግሞ ድንግሏን ‘ድንግል ሴት ልጁ’ ብሎ መረዳት ነው።
  rationale: 1 ቆሮንቶስ 7፥36–38 የትርጓሜ ክርክር ያለበት ክፍል ነው። γαμίζω ‘ለትዳር መስጠት’ የሚለውን ትርጉም የበለጠ ይደግፋል፤ ነገር ግን ድንግሏ ሴት ልጅ፣ በአደራ ሥር ያለች ወይም እጮኛ መሆኗ አከራካሪ ነው። ትርጉሙ ግሪኩ በግልጽ ከሚደግፈው በላይ አንድን ማኅበራዊ ሁኔታ አይጭንም።
