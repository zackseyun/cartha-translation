base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: am
  text: ስለዚህ[a] የራሱን ድንግል ለትዳር የሚሰጥ መልካም ነገር ያደርጋል፤ ለትዳር የማይሰጣት ግን የተሻለ ነገር ያደርጋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ድንግል እጮኛውን የሚያገባ መልካም ነገር ያደርጋል፤ የማያገባት ግን የተሻለ ነገር ያደርጋል።” ሌላው የተለመደ ትርጓሜ “ድንግል ሴት ልጁ” የሚል ነው። እዚህ ያለው የግሪክ ግስ በተለምዶ “ለትዳር መስጠት” ማለት ስለሆነ፣ ዋናው ጽሑፍ ይህን ትርጉም ይጠብቃል፤ ትክክለኛውን የዝምድና ዓይነት ግን አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን መደምደሚያ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: γαμίζων
  choice: ለትዳር የሚሰጥ
  rationale: ግሱ በተለምዶ ‘ማግባት’ ሳይሆን ሌላን ሰው ‘ለትዳር መስጠት’ የሚለውን አስደራጊ ትርጉም ይይዛል።
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: የራሱን ድንግል
  rationale: παρθένος የሚለውን ‘ድንግል’ በማለትና ἑαυτοῦ የሚያሳየውን የግል ግንኙነት ‘የራሱን’ በማለት ይጠብቃል፤ ድንግሏ ሴት ልጅ፣ በአደራ ሥር ያለች ወይም እጮኛ መሆኗን በዋናው ጽሑፍ አይወስንም።
- source_word: καλῶς ποιεῖ
  choice: መልካም ያደርጋል
  rationale: የግሪኩን አዎንታዊ ግምገማ በግልጽና ክብር ባለው አማርኛ ያቀርባል።
- source_word: μὴ γαμίζων
  choice: ለትዳር የማይሰጣት
  rationale: ከመጀመሪያው ግስ ጋር የአስደራጊውን ትርጉም በወጥነት ይጠብቃል፤ ‘-አት’ የሚለው ቅጥያ ከቀደመው ሐረግ የታወቀችውን ድንግል ያመለክታል።
- source_word: κρεῖσσον ποιήσει
  choice: የተሻለ ያደርጋል
  rationale: κρεῖσσον ንጽጽራዊ እንጂ የበላይነት ደረጃ አይደለም፤ ስለዚህ ‘የተሻለ’ የጳውሎስን ንጽጽራዊ ፍርድ ሳያጋንን ያስተላልፋል።
theological_decisions:
