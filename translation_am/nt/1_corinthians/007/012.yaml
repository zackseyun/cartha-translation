  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: am
  text: ለቀሩት ግን ጌታ ሳይሆን እኔ እላለሁ፤ አንድ ወንድም የማታምን ሚስት ቢኖረውና እርሷም ከእርሱ ጋር ለመኖር ብትስማማ፣ አይፍታት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አይተዋት» ወይም «አያሰናብታት»። የግሪኩ ግስ ቃል በቃል «መተው» ወይም «ማሰናበት» ተብሎ ሊተረጎም ይችላል፤ እዚህ ግን ትዳሩን ማቋረጥን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: ለቀሩት ግን
  rationale: λοιποί ቀደም ባለው መመሪያ ያልተካተቱትን ቀሪ ወገኖች ያመለክታል፤ δέ ደግሞ ለስላሳ ሽግግርን ወይም ንጽጽርን ስለሚያሳይ «ግን» ተብሏል።
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: ጌታ ሳይሆን እኔ እላለሁ
  rationale: ἐγώ ያለውን አጽንዖት «እኔ» በግልጽ በመጥቀስ ይጠብቃል፤ አገላለጹም የጳውሎስን መመሪያ ከጌታ በቀጥታ ከተናገረው ቃል ይለያል።
- source_word: ἀδελφὸς
  choice: ወንድም
  rationale: በዚህ ዐውደ ንባብ ነጠላው ተባዕታይ ስም ከሚስቱ ጋር በንጽጽር የቀረበውን አማኝ ወንድ በተለይ ያመለክታል።
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: የማታምን ሚስት ቢኖረው
  rationale: ἔχει γυναῖκα የትዳር ግንኙነትን የሚገልጽ ነው፤ «የማታምን» የሚለውም ἄπιστον እዚህ ላይ በክርስቶስ የማታምን መሆኗን እንጂ በትዳር ታማኝ አለመሆኗን እንዳያመለክት ያደርጋል።
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: እርሷም ... ብትስማማ
  rationale: συνευδοκέω በፈቃድ መስማማትን ወይም መፍቀድን ያሳያል፤ «ብትስማማ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: ከእርሱ ጋር ለመኖር
  rationale: οἰκέω ከ μετά ጋር በአንድ ቤት የሚካሄድን የጋራ የትዳር ኑሮ ያመለክታል።
- source_word: μὴ ἀφιέτω αὐτήν
  choice: አይፍታት
  rationale: ἀφίημι መሠረታዊ ትርጉሙ መተው ወይም መልቀቅ ቢሆንም፣ በዚህ የትዳር ዐውድ ግን ትዳሩን መፍታትን ያመለክታል፤ «አይፍታት» ይህን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: «ጌታ ሳይሆን እኔ» የሚለው የጳውሎስ ንግግር
  choice: በምድራዊ አገልግሎቱ ጊዜ ኢየሱስ በቀጥታ በተናገረው ቃልና ጳውሎስ አሁን በሚሰጠው ሐዋርያዊ መመሪያ መካከል ያለውን ልዩነት ማቆየት
  alternative: ይህን ሥልጣን የሌለው የጳውሎስ የግል አስተያየት እንደሆነ መተርጎም
  rationale: ጽሑፉ ራሱ ያለውን ንጽጽር ትርጉሙ ይጠብቃል፤ ነገር ግን የሐዋርያዊውን መመሪያ ሥልጣን ወይም መነሳሳት የሚክድ ተጨማሪ ፍርድ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «አይፍታት» በትዳር ዐውድ ግልጽ ሲሆን የግሪኩ ሰፊ የቃል ክልል በእግር ማስታወሻው ተጠብቋል።
