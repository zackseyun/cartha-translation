  rationale: ‘አስባለሁ’ የሚለውና ‘አሁን ባለው መከራ ምክንያት’ የሚለው መሠረት ሁኔታዊ የእረኝነት ምክርን ያመለክታሉ፤ ጽሑፉ ያላለውን ዘላለማዊ ክልከላ አልተጨመረም።
