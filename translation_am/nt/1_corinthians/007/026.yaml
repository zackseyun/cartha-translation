  terminology: “መልካም” appropriately retains the repetition of καλόν. “መከራ” is a defensible contextual rendering of ἀνάγκη, while the alternatives retain the lexical range. “ሰው” properly preserves the generic ambiguity of ἀνθρώπῳ.
  issues:
