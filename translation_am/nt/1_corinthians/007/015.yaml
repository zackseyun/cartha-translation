base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: am
  text: ነገር ግን የማያምነው ሰው[a] ቢለይ፣ ይለይ። በእንዲህ ባሉ ሁኔታዎች ወንድም ወይም እኅት በባርነት ሥር አይደለም[b]፤ እግዚአብሔር ግን በሰላም ጠርቶናል[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የማያምነው።” በዚህ አውድ የማያምነውን የትዳር ጓደኛ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አልታሰረም።” የግሪኩ ግስ “ባሪያ ማድረግ፣ በባርነት ሥር ማዋል” ከሚለው δουλόω የመጣ ነው፤ በተለምዶ “ማሰር” ለሚለው ከሚጠቀሙበት ግስ የተለየ ነው።
    reason: lexical_alternative
  - marker: c
    text: አንዳንድ የእጅ ጽሑፎች “ጠርቷችኋል” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: የማያምነው ሰው
  rationale: የግሪኩን ስማዊ አገላለጽ ‘የማያምነው’ ይጠብቃል፤ ከአውዱ የማያምነውን የትዳር ጓደኛ እንደሚያመለክት የግርጌ ማስታወሻው ያብራራል።
- source_word: χωρίζεται / χωριζέσθω
  choice: ቢለይ፣ ይለይ
  rationale: የሁለቱን የግሪክ ግሶች ድግግሞሽ ይጠብቃል፤ መለየትን ይገልጻል እንጂ ሕጋዊ ፍቺ ወይም አካላዊ መሄድ ብቻ እንደሆነ አይወስንም።
- source_word: οὐ δεδούλωται
  choice: በባርነት ሥር አይደሉም
  rationale: δουλόω የባርነትን ሐሳብ ይይዛል፤ በአማርኛ ተፈጥሯዊ ሆኖ ይህን ትርጉም ያስተላልፋል፣ ‘የታሰረ’ የሚለውን የተለየ ግስ በዋናው ጽሑፍ አያስገባም።
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: ወንድሙም ሆነ እኅቱ
  rationale: ጳውሎስ የተጠቀመውን የእምነት ቤተሰብ ቃላትና ሁለቱንም ፆታዎች በግልጽ ይጠብቃል።
- source_word: ἐν τοῖς τοιούτοις
  choice: በእንዲህ ያለ ሁኔታ
  rationale: ከዚህ በፊት የተገለጸውን ዓይነት ሁኔታ በግልጽና በዘመናዊ አማርኛ ያመለክታል።
- source_word: ἐν δὲ εἰρήνῃ
  choice: በሰላም
  rationale: የጥሪውን ድባብ ወይም ሁኔታ በቀጥታ ይገልጻል፣ የግሪኩን አሻሚነትም ‘ወደ ሰላም’ ብሎ አይገድብም።
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: እግዚአብሔር ... ጠርቶናል
  rationale: የፍጹም ጊዜውን የቀጠለ ውጤት በተፈጥሯዊ አማርኛ ያሳያል፤ የSBLGNTን ‘እኛን’ ንባብ ይከተላል።
theological_decisions:
- issue: οὐ δεδούλωται ከጋብቻ መፍረስና ዳግም ጋብቻ ጋር ያለው ግንኙነት
  choice: ‘በባርነት ሥር አይደሉም’ ተብሎ በቃሉ የባርነት ሐሳብ ተጠብቋል፤ የነፃነቱ ሙሉ ወሰን አልተወሰነም።
  alternative: ‘አልታሰሩም’ ብሎ ለዳግም ጋብቻ ቴክኒካዊ ፈቃድ እንደሚሰጥ መተርጎም፣ ወይም ነፃነቱን የሄደውን ጓደኛ በግድ ከመከተል ብቻ ጋር ማያያዝ።
  rationale: ጥቅሱ የነፃነቱን ሙሉ የሕጋዊና የትዳር ውጤት በግልጽ አይወስንም፤ ስለዚህ የቤተ እምነት ልዩ ድምዳሜ አልገባም።
- issue: ὁ ἄπιστος የሚያመለክተው ማንን እንደሆነ
  choice: በዋናው ጽሑፍ ‘የማያምነው ሰው’ ተብሎ የግሪኩ አጠቃላይ አገላለጽ ተጠብቋል።
  alternative: ‘የማያምነው የትዳር ጓደኛ’ ብሎ አውዳዊ ፍቺውን በዋናው ጽሑፍ ግልጽ ማድረግ።
  rationale: የጋብቻ አውዱ የትዳር ጓደኛን እንደሚያመለክት ግልጽ ቢሆንም፣ ዋናው ጽሑፍ ግሪኩ በቀጥታ ያላለውን ስም አይጨምርም።
