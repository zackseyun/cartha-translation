  rationale: “-ም” ተፈጥሯዊ ሆኖ መጠነኛውን የመፍቀድ ስሜት ይጠብቃል፤ ማስታወሻውም የግሪኩን እውነተኛ አገባባዊ አሻሚነት ያሳያል።
