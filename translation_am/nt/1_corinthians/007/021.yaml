id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: am
  text: ባሪያ ሳለህ ተጠርተሃልን? ይህ አያሳስብህ። ነገር ግን ነፃ መሆን ብትችልም፣ ይልቁንም ተጠቀምበት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይልቁንም በአሁኑ ሁኔታህ ተጠቀም፤” ማለትም፣ እንዳለህ ቆይ። በግሪኩ “ይልቁንም ተጠቀም” የሚለው አገላለጽ የሚጠቀምበትን ነገር በግልጽ አይጠቅስም፤ ስለዚህ በሁለቱም መንገድ ተረድቷል።
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: ባሪያ
  rationale: ቃሉ የታሰረ ማኅበራዊና ሕጋዊ ሁኔታን ያመለክታል፤ ከነፃ መሆን ጋር በግልጽ ስለሚነጻጸር፣ ‘አገልጋይ’ የሚለው የሁኔታውን ክብደት በቂ አያሳይም።
- source_word: ἐκλήθης
  choice: ተጠራህ
  rationale: የግሪኩን አጭር አገላለጽ ጠብቆ፣ በአውዱ የእግዚአብሔርን ጥሪ እንዲያመለክት ተተወ፤ ‘በእግዚአብሔር’ ወይም ‘ወደ እምነት’ የሚል በግሪኩ የሌለ ማብራሪያ አልተጨመረም።
- source_word: μή σοι μελέτω
  choice: ይህ አያሳስብህ
  rationale: አገላለጹ ጭንቀትንና መታወክን የሚመለከት ሲሆን፣ ይህ ትርጉም የግሪኩን የማጽናናት ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐλεύθερος γενέσθαι
  choice: ነፃ መሆን
  rationale: ከባርነት ወደ ነፃነት የሚደረገውን የማኅበራዊ ሁኔታ ለውጥ ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይገልጻል።
- source_word: μᾶλλον χρῆσαι
  choice: ይልቁንም ተጠቀምበት
  rationale: χρῆσαι ‘ተጠቀም’ ማለት ቢሆንም የሚጠቀምበት ነገር በግሪኩ አልተጠቀሰም። የአማርኛው ተውላጠ ስም በአቅራቢያው ያለውን የነፃነት ዕድል እንዲያመለክት ያስችላል፤ ሌላው ታሪካዊ ንባብ ግን በግርጌ ማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የμᾶλλον χρῆσαι ትርጓሜያዊ አሻሚነት
  choice: ጳውሎስ፣ ነፃ የመሆን ዕድል ካለ ባሪያው ዕድሉን እንዲጠቀም ያበረታታል፤ ‘ይልቁንም ተጠቀምበት።’
  alternative: ጳውሎስ ባሪያው አሁን ያለበትን ሁኔታ እንዲጠቀምበት፣ ማለትም እንዳለ እንዲቆይ ይነግረዋል።
  rationale: በቅርቡ ያለው አገባብ፣ ‘ነፃ መሆን የምትችል ከሆነ’ በሚለው ውስጥ የታሰበውን ዕድል የχρῆσαι ያልተገለጸ ተሳቢ አድርጎ መረዳትን ይደግፋል። ሆኖም ግሪኩ ተሳቢውን በግልጽ ስለማይጠቅስና ሌላው ንባብ ረጅም የትርጓሜ ታሪክ ስላለው፣ አሻሚነቱ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ባሪያ’ የሚለው ቃል የጥንቱን ማኅበራዊ ሁኔታ ሳያለዝብ ያሳያል፤ ዓረፍተ ነገሩም የግሪኩን አጭር የጥያቄና የማጽናኛ ቅርጽ ይጠብቃል።
