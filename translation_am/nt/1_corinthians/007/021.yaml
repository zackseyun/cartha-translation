    reason: alternative_reading
  revision_rationale: The revision corrects the Amharic conditional construction and relocates the footnote marker to the phrase whose object is left unstated in Greek. It otherwise preserves the draft’s chosen reading, its lexical precision concerning slavery and freedom, and the source’s ambiguity through the footnote.
