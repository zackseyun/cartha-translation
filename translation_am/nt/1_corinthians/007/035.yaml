id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: am
  text: ይህን የምለው ለራሳችሁ ጥቅም ነው፤ በእናንተ ላይ ወጥመድ ለመጣል ሳይሆን፣ ተገቢ ለሆነውና ለጌታ ያለ መበታተን በቋሚነት እንድትሰጡ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: ጥቅም
  rationale: ቃሉ ለተቀባዮች የሚበጅና የሚጠቅም ነገርን ያመለክታል፤ ‘ለራሳችሁ ጥቅም’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: βρόχον
  choice: ወጥመድ
  rationale: ቃሉ በቀጥታ ማነቂያ ወይም የሚይዝ ወጥመድ ማለት ነው፤ እዚህ ጳውሎስ ገዳቢ ጫና ለመጫን እንዳልፈለገ የሚያሳየውን ምስላዊ አገላለጽ ይጠብቃል።
- source_word: εὔσχημον
  choice: ተገቢውን
  rationale: በሥነ ምግባርና በማኅበራዊ አኳኋን የሚገባውን፣ የተከበረውን ድርጊት ያመለክታል።
- source_word: εὐπάρεδρον
  choice: በትጋት እንድትገዙ
  rationale: ቃሉ በጌታ ፊት በቋሚነት መቆየትንና ራስን ለእርሱ ማዋልን ይገልጣል፤ በአማርኛ አንድ ቃል በትክክል ስለማይሸፍነው ትርጉማዊ ሐረግ ተመርጧል።
- source_word: ἀπερισπάστως
  choice: ሳትከፋፈሉ
  rationale: አእምሮና ትኩረት በሌሎች ጉዳዮች ሳይሳብ ወይም ሳይከፈል መኖርን ያሳያል።
theological_decisions:
- issue: የጳውሎስ ምክር ግዴታ ነው ወይስ ለጥቅማቸው የቀረበ መመሪያ?
  choice: ‘ለራሳችሁ ጥቅም’ እና ‘ወጥመድ ለመጣል ሳይሆን’ ተብሎ ተተርጉሟል።
  alternative: ‘እናንተን ለመገደብ ሳይሆን’ ብሎ ምስሉን ማብራራት።
  rationale: የግሪኩን ግልጽ ምስል በመጠበቅ፣ ምክሩ ጫና ወይም ሕጋዊ ግዴታ ለመጫን እንዳልሆነ ያሳያል።
- issue: εὐπάρεδρον ተሳትፎን፣ መገዛትን ወይስ በፊት መቀመጥን ያመለክታል?
  choice: ‘ለጌታ በትጋት እንድትገዙ’
  alternative: ‘በጌታ ፊት በቋሚነት እንድትቆዩ’
  rationale: በዐውደ ንባቡ የተረጋጋና የተሰጠ አገልግሎትን ያሳያል፤ ነገር ግን የቃሉን ሃይማኖታዊ ይዘት ከአንድ ልዩ የአምልኮ ቅርጽ ጋር አያጠብቅም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ βρόχον ምስላዊነት ‘ወጥመድ’ በሚለው ተጠብቋል፤ በመጀመሪያ ያለው δέ የንግግር ሽግግር በአማርኛ ያለ ተጨማሪ ‘አሁን’ በተፈጥሯዊ ሁኔታ ቀርቧል።
