- issue: ለሞት የተጠቀመው ለዘብተኛ አገላለጽ
  choice: ‘ቢያንቀላፋ’ የሚለው ምስላዊ አገላለጽ በዋናው ጽሑፍ ተጠብቋል።
  alternative: ‘ቢሞት’
