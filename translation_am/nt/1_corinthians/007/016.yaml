base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: am
  text: ምክንያቱም፣ ሚስት ሆይ፣ ባልሽን ታድኚ እንደሆነ እንዴት ታውቂያለሽ?[a] ወይስ፣ ባል ሆይ፣ ሚስትህን ታድን እንደሆነ እንዴት ታውቃለህ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ በተለመደ አነጋገር፣ ‘ሚስት ሆይ፣ ባልሽን ልታድኚ ትችዪ እንደሆነ እንዴት ልታውቂ ትችያለሽ?’ የግሪኩ ግስ የወደፊት ጊዜ ነው፤ በተዘዋዋሪ ጥያቄው ውስጥ ‘ታድኚ እንደሆነ’ የሚል ትርጉም አለው። በሁለተኛው ጥያቄም ተመሳሳይ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: እንዴት ታውቂያለሽ? / እንዴት ታውቃለህ?
  rationale: τί ከ οἶδας ጋር በዚህ የአጠያየቅ አገባብ ‘ምን ታውቃለህ?’ ሳይሆን ‘እንዴት ታውቃለህ?’ ተብሎ በተፈጥሯዊ አማርኛ ይተረጎማል። γάρ ከቀደመው አውድ ጋር ያለው ምክንያታዊ ትስስር በአማርኛው የንግግር ፍሰት ውስጥ በቀጥታ ተዋሕዷል።
- source_word: γύναι
  choice: ሚስት ሆይ
  rationale: γυνή ሴት ወይም ሚስት ሊል ቢችልም፣ የጋብቻው አውድ ‘ሚስት’ የሚለውን ይጠይቃል፤ የጥሪው ቅርጽም ‘ሆይ’ በሚለው ተጠብቋል።
- source_word: ἄνερ
  choice: ባል ሆይ
  rationale: ἀνήρ ሰው ወይም ባል ሊል ቢችልም፣ በዚህ የጋብቻ አውድ ‘ባል’ ትክክለኛ ነው።
- source_word: σώσεις
  choice: እንደምታድኚ / እንደምታድን
  rationale: የግሪኩ የወደፊት ጊዜ ግስ በአማርኛ በ‘እንደምታድኚ/እንደምታድን’ ተጠብቋል። ይህ የሚጠይቀው የመሆኑን ዕድል እንጂ የተረጋገጠ ትንቢት አይደለም።
- source_word: τὸν ἄνδρα
  choice: ባልሽን
  rationale: በቀጥታ ሚስትን በሚያናግረው አውድ የተወሰነው ስም የእርሷን ባል ያመለክታል፤ አማርኛም ይህን በባለቤትነት ቅጥያ በተፈጥሮ ይገልጣል።
- source_word: τὴν γυναῖκα
  choice: ሚስትህን
  rationale: በቀጥታ ባልን በሚያናግረው አውድ የእርሱን ሚስት ያመለክታል፤ ባለቤትነቱ በአማርኛ ቅጥያ ተገልጧል።
- source_word: ἢ
  choice: ወይስ
  rationale: ሁለቱን ተመሳሳይ የአጠያየቅ ክፍሎች በተፈጥሯዊ አማርኛ ለማገናኘት ‘ወይስ’ ተመርጧል።
theological_decisions:
- issue: በጋብቻው አውድ ውስጥ ‘ማዳን’ የሚለው ትርጉም
  choice: ‘ማዳን’ የሚለውን የጽሑፉን ቃል ሳያጠብ ማቆየት
  alternative: ወደ እምነት ማምጣት፤ ጋብቻውን መጠበቅ፤ በሰፊ መንፈሳዊ ትርጉም ማዳን
  rationale: σῴζω በጳውሎስ አጠቃቀም ብዙ ጊዜ የድነት ክብደት አለው። እዚህም ቃሉን ‘ጋብቻን መጠበቅ’ ብሎ ማጥበብ ወይም ‘ወደ እምነት ማምጣት’ ብሎ መተርጎም የጽሑፉን ሥነ መለኮታዊ ውጥረት አስቀድሞ ይፈታዋል። ‘ማዳን’ የሚለው እንዳለ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሴትና የወንድ የግስ ልዩነቶች በትክክል ተጠብቀዋል፤ ትይዩ አወቃቀሩም ተይዟል።
