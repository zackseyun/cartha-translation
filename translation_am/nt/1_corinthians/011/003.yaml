source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: am
  text: ነገር ግን ይህን እንድታውቁ እፈልጋለሁ፤ የእያንዳንዱ ወንድ ራስ[a] መሲሕ ነው፣ የሴት ራስ ደግሞ ወንዱ[b] ነው፣ የመሲሕም ራስ እግዚአብሔር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ራስ” የሚለው የግሪክ ዘይቤ “ምንጭ” ወይም “በላይ ሥልጣን ያለው” ተብሎም ሊገባ ይችላል፤ ዋናው ጽሑፍ ግን ዘይቤውን እንዳለ ይዟል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሴት” እና “ወንድ” የሚሉት ቃላት “ሚስት” እና “ባል” ተብለውም ሊነበቡ ይችላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: ነገር ግን ይህን እንድታውቁ እፈልጋለሁ
  rationale: የጳውሎስን ግላዊ ፍላጎትና የንግግሩን መሸጋገር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: παντὸς ἀνδρὸς
  choice: የእያንዳንዱ ወንድ
  rationale: ἀνήρ ወንድንም ባልንም ሊያመለክት ቢችልም፣ የአረፍተ ነገሩ አጠቃላይ ትይዩነት ‘ወንድ’ የሚለውን ዋና ንባብ ይደግፋል።
- source_word: κεφαλή
  choice: ራስ
  rationale: የግሪኩን ዘይቤ በቀጥታ ይጠብቃል፤ ‘ምንጭ’ ወይም ‘ሥልጣን ያለው’ ብሎ ትርጓሜያዊ ክርክሩን በዋናው ጽሑፍ አይወስንም።
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: መሲሕ / የመሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ ‘መሲሕ’ ተብሎ ተተርጉሟል።
- source_word: γυναικός ... ὁ ἀνήρ
  choice: የሴት ... ወንዱ
  rationale: የቃላቱን አጠቃላይ ‘ሴት/ወንድ’ ትርጉም በዋናው ጽሑፍ ይይዛል፤ ‘ሚስት/ባል’ የሚለው ተለዋጭ ንባብ በማስታወሻ ተጠብቋል።
- source_word: ὁ θεός
  choice: እግዚአብሔር
  rationale: θεόςን ለመተርጎም የተለመደውና ክቡር የአማርኛ አጠራር ነው።
theological_decisions:
- issue: በሦስቱ ትይዩ ሐረጎች ውስጥ የκεφαλή ትርጉም
  choice: ዘይቤውን ‘ራስ’ ብሎ ማቆየት
  alternative: ‘ምንጭ’ ወይም ‘ሥልጣን ያለው’ ብሎ መተርጎም
  rationale: የግሪኩ ቃል ራስ የሚለውን ዘይቤ ይጠቀማል፤ ዋናው ጽሑፍ አከራካሪውን ትርጉም በትርጓሜ መወሰን የለበትም።
- issue: ἀνήρ እና γυνή ‘ወንድ/ሴት’ ወይስ ‘ባል/ሚስት’ ማለታቸው
  choice: በዋናው ጽሑፍ ‘ወንድ/ሴት’
  alternative: ‘ባል/ሚስት’
  rationale: የትይዩ አወቃቀሩ አጠቃላይ ንባብን ይደግፋል፤ ሆኖም ቃላቱ የትዳር አጋሮችንም ሊያመለክቱ ስለሚችሉ ይህ ንባብ በማስታወሻ ቀርቧል።
- issue: ‘የመሲሕ ራስ እግዚአብሔር ነው’ የሚለው የመጨረሻ ሐረግ
  choice: የግሪኩን አባባል ሳያዳክሙና ሳያሰፉ በቀጥታ መተርጎም
  alternative: ግንኙነቱን ‘ተግባራዊ ሥርዓት’ ብቻ ብሎ የሚወስን ትርጓሜያዊ ማብራሪያ
  rationale: ቀጥተኛው ትርጉም የጽሑፉን አባባልና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ በትርጉሙ ውስጥ ተጨማሪ ዶክትሪናዊ ማብራሪያ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። የግሪኩ ሦስት ትይዩ ሐረጎች በአማርኛም ተጠብቀዋል።
