- issue: ἀγγέλους የሚያመለክተው
  choice: መላእክት
  alternative: መልእክተኞች
  rationale: ἄγγελος ‘መልእክተኛ’ ማለት ሊሆን ቢችልም፣ በዚህ ያልተገደበ ብዙ ቁጥር አጠቃቀም ‘መላእክት’ የሚለው ይበልጥ የሚሆን ነው። ጥቅሱ መላእክትን ለምን እንደጠቀሰ የሚገልጽ የተለየ ንድፈ ሐሳብ አልገባም።
- issue: γυνή የሚያመለክተው ወሰን
  choice: ሴቲቱ
  alternative: ሚስቱ
  rationale: አውዱ ስለ ወንድና ሴት በሰፊው ስለሚናገር፣ ትርጉሙን ወደ ጋብቻ ብቻ ማጥበብ አያስፈልግም።
