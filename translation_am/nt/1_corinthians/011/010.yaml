theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς የሚለው ሐረግ ትርጉም
  choice: በራሷ ላይ ሥልጣን ሊኖራት
  alternative: በራሷ ላይ የሥልጣን ምልክት ልታደርግ / የራስ መሸፈኛ ልትለብስ
