  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: am
  text: ነገር ግን ራሷን ሳትሸፍን[b] የምትጸልይ ወይም ትንቢት የምትናገር ሴት ሁሉ ራሷን[a] ታዋርዳለች፤ ይህም ራሷን ከተላጨች ሴት ጋር አንድ ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ራሷን ሳትሸፍን የምትጸልይ ወይም ትንቢት የምትናገር ሚስት ሁሉ ባሏን/ራሷን ታዋርዳለች።» የግሪኩ γυνή “ሴት” ወይም “ሚስት” ማለት ሊሆን ይችላል፤ “ራስ”ም ከአውዱ አንጻር ቃል በቃል ወይም በምሳሌያዊ ትርጉም ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: «ሳትሸፍን» የሚለው ቃል ብቻውን የሽፋኑን ዓይነት በትክክል አይገልጽም፤ ጳውሎስ በተለይ መጋረጃን ማለቱ እንደሆነ ወይም በአጠቃላይ ያልተሸፈነ ራስን ማመልከቱ እንደሆነ ተርጓሚዎች ይለያያሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ሴት
  rationale: ቃሉ «ሴት» ወይም «ሚስት» ሊል ይችላል። እዚህ «የምትጸልይ ወይም ትንቢት የምትናገር ሴት ሁሉ» የሚለው አገባብ በቀጥታ የጋብቻ ሁኔታን ስለማይወስን «ሴት» ተመርጧል፤ «ሚስት» በማስታወሻ ተጠብቋል።
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: የምትጸልይ ወይም ትንቢት የምትናገር
  rationale: የአሁን ጊዜ አሳታፊ ግሶቹ ሴቲቱ በእነዚህ ተግባራት ላይ መሆኗን ያሳያሉ፤ የዝምድና ሐረጉ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: ራሷን ሳትሸፍን
  rationale: ይህ አገላለጽ ራሷ ባልተሸፈነበት ሁኔታ መሆኗን ያሳያል። ሽፋኑ ጸጉር፣ መጋረጃ ወይም ሌላ ነገር መሆኑን ሳይወስን ጥቅል ትርጉሙን ይጠብቃል።
- source_word: καταισχύνει
  choice: ታዋርዳለች
  rationale: ግሱ ማሳፈርን፣ ማዋረድን ወይም ክብር ማሳጣትን ያመለክታል። «ታዋርዳለች» በዘመናዊ አማርኛ የማኅበራዊ ክብርና ውርደት አውዱን በግልጽ ያስተላልፋል።
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: ራሷን
  rationale: የግሪኩን «የእርሷን ራስ» በተፈጥሯዊ አማርኛ ይገልጻል። «ራስ» አካላዊ ራሷን ወይም በአውዱ ምሳሌያዊ ራሷን/ባሏን ሊያመለክት ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: አንድና ያው ነውና
  rationale: የሁለቱን ሁኔታዎች ተመሳሳይነት አጽንዖት የሚሰጠውን የግሪክ ፈሊጥ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῇ ἐξυρημένῃ
  choice: ራሷ ከተላጨች
  rationale: ፍጹም አሳታፊው ከመላጨት በኋላ ያለውን ሁኔታ ያሳያል፤ «ከተላጨች» ይህን ውጤታዊ ሁኔታ በአማርኛ ይጠብቃል።
theological_decisions:
- issue: «ራሷን ታዋርዳለች» ውስጥ ያለው ሁለተኛው κεφαλή ምን እንደሚያመለክት
  choice: ዋናው ጽሑፍ «ራሷን» ብሎ የግሪኩን አሻሚነት ይጠብቃል።
  alternative: አካላዊ ራሷን፤ ወይም በምሳሌያዊ ትርጉም ባሏን/ወንዱን።
  rationale: ቀጥተኛው አገላለጽ አካላዊ ራስን ሊያመለክት ሲችል፣ የአካባቢው አውድ ምሳሌያዊ ንባብንም ያስነሳል። ጽሑፉ አንዱን ብቻ ስለማያስገድድ ትርጉሙ ውጥረቱን አልፈታም።
- issue: «ሳትሸፍን» የሚለው ሽፋን ዓይነት
  choice: የሽፋኑን ዓይነት ሳይወስን «ራሷን ሳትሸፍን» ተብሏል።
  alternative: መጋረጃ ሳታደርግ፤ ወይም ጸጉሯ ሳይሸፈን/እንደተፈታ።
  rationale: ግሪኩ ያለመሸፈንን ይገልጻል እንጂ ሽፋኑ በትክክል ምን እንደሆነ አይወስንም። «መጋረጃ» ወይም «ጸጉር» ማለት ከጽሑፉ በላይ የትርጓሜ ውሳኔ ማስገባት ይሆናል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ትንቢት የምትናገር» ከከበደው «የምትተነብይ» ይልቅ ግልጽ ነው፤ የሽፋኑና የ«ራስ» ትርጉም አሻሚነት ሳይወገድ ተጠብቋል።
