  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: am
  text: በሁሉም ነገር ስለምታስቡኝና እንዳስተላለፍኩላችሁ ትውፊቶቹን[a] አጥብቃችሁ ስለያዛችሁ አመሰግናችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ትምህርቶቹን” ወይም “መመሪያዎቹን”፤ የግሪኩ ቃል “ትውፊቶቹን” የሚል ሲሆን፣ አሳልፎ የተሰጠ ነገርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: አመሰግናችኋለሁ
  rationale: እዚህ ግሱ የቆሮንቶስን ሰዎች ማድነቅንና መልካም ነገራቸውን መቀበልን ያመለክታል፤ «አመሰግናችኋለሁ» በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ አዎንታዊውን ድምፅ ይጠብቃል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: δέ እዚህ የዋህ የንግግር ሽግግር ነው፤ በአማርኛ የዓረፍተ ነገሩ አወቃቀር ሽግግሩን ስለሚያሳይ «አሁን» ወይም ጠንካራ «ነገር ግን» ማከል አላስፈለገም።
- source_word: πάντα μου μέμνησθε
  choice: በሁሉም ነገር ስለምታስቡኝ
  rationale: πάντα ሰፊውን «በሁሉም ነገር» የሚል ወሰን ይጠብቃል፤ μέμνησθε ደግሞ በአእምሮ መያዝንና ቀጣይ ማስታወስን ያሳያል። «ምታስቡኝ» በዚህ አውድ ከቃል በቃል «ምታስታውሱኝ» ይልቅ ተፈጥሯዊ ነው።
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: እኔም አሳልፌ እንደሰጠኋችሁ
  rationale: παραδίδωμι የተቀበሉትን ትምህርት ወይም ልማድ ለሌሎች ማስተላለፍን ያመለክታል፤ «አሳልፌ ሰጠሁ» ይህን የማስተላለፍ ገጽታ ይጠብቃል።
- source_word: τὰς παραδόσεις
  choice: ወጎቹን
  rationale: παράδοσις በቃል መሠረቱ የተላለፈውን ነገር ያመለክታል። «ወጎቹን» የተላለፉ ትምህርቶችንና መመሪያዎችን ሊያካትት የሚችል እኩያ ቃል ሲሆን ከጊዜ በኋላ የተፈጠረ የቤተ እምነት ፍቺ አያስገባም።
- source_word: κατέχετε
  choice: አጥብቃችሁ ስለያዛችሁ
  rationale: κατέχω መጠበቅን፣ ሳይለቁ መያዝንና መጽናትን ያሳያል፤ «አጥብቃችሁ ያዛችሁ» ይህን ንቁ መጣበቅ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በቤተ ክርስቲያን አውድ παραδόσειςን መተርጎም
  choice: ወጎቹን
  alternative: ትምህርቶቹን፤ መመሪያዎቹን
  rationale: ጥቅሱ ጳውሎስ ራሱ ለቆሮንቶስ ሰዎች ያስተላለፈውን ነገር ያመለክታል። «ወጎቹን» የማስተላለፍ ዋና ሐሳብን ይጠብቃል፤ ቃሉን ወደ ትምህርት ብቻ አያጠብም ወይም የኋለኛ ዘመን የእምነት ቡድን አቋም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የሁለተኛ መደብ ብዙ ቁጥር በግሶቹ ተጠብቋል፤ የግሪኩ δέ የዋህ ሽግግር በአማርኛው አወቃቀር ተወክሏል።
