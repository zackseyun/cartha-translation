  terminology: ‘የራሱን እራት’ suitably maintains the lexical link with the Lord’s Supper in the context. ‘ይሰክራል’ accurately and plainly expresses μεθύει. The distributive singular wording is natural in Amharic and does not require a gender-explicit expansion.
