  text: ስለዚህ፣ ማንም ሰው የጌታን እንጀራ ተገቢ ባልሆነ ሁኔታ[b] ቢበላ ወይም ጽዋውን ተገቢ ባልሆነ ሁኔታ[b] ቢጠጣ፣ በጌታ ሥጋና ደም ላይ በደል የፈጸመ ይሆናል[a]።
  philosophy: optimal-equivalence
  footnotes:
