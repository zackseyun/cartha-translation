review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential force, the indefinite subject, the disjunctive “or,” and the culpability expressed by ἔνοχος. However, placing “ተገቢ ባልሆነ ሁኔታ” directly after “እንጀራ” most naturally modifies only the eating clause, whereas Greek ἀναξίως governs both eating and drinking. The revised wording makes its shared scope explicit. The Greek has one “of the Lord” governing both bread and cup; rendering the cup as “ጽዋውን” naturally preserves that shared reference without needlessly repeating the genitive.
  naturalness: “በጌታ ሥጋና ደም ላይ በደለኛ” is understandable but somewhat compressed. “በጌታ ሥጋና ደም ላይ በደል የፈጸመ ይሆናል” is more idiomatic modern Amharic while retaining the serious culpability/liability sense.
  terminology: 'Retain established biblical terms: “ጌታ,” “እንጀራ,” “ጽዋ,” “ሥጋ,” and “ደም.” “ተገቢ ባልሆነ ሁኔታ” correctly reflects the adverbial force of ἀναξίως and should not be construed as a statement about a participant’s inherent worth.'
  issues:
  - severity: medium
    issue: The placement of “ተገቢ ባልሆነ ሁኔታ[b]” can be read as modifying only “የሚበላ.”
    rationale: ἀναξίως modifies both ἐσθίῃ and πίνῃ. Recasting both actions in parallel conditional clauses and repeating the manner phrase makes the scope unambiguous in Amharic.
  - severity: low
    issue: “በጌታ ሥጋና ደም ላይ በደለኛ ይሆናል” is less natural than an explicit verbal expression of wrongdoing.
    rationale: The revision preserves the source’s liability/culpability without deciding the precise legal nuance of the genitive construction.
