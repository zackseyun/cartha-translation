  alternative: በባሕርዩ የማይገባ ሰው መሳተፉን ያወግዛል።
  rationale: ἀναξίως ግሶቹን የሚያሻሽል ተውሳከ ግስ ነው፤ ትርጉሙ የድርጊቱን ሁኔታ እንጂ የሰውየውን ውስጣዊ ብቃት አይገልጥም።
- issue: በመብላትና በመጠጣት መካከል ያለው ἢ
  choice: ማስጠንቀቂያው ከሁለቱ ድርጊቶች አንዱ ተገቢ ባልሆነ ሁኔታ ቢፈጸምም ይሠራል።
  alternative: ሁለቱ ድርጊቶች እንደ የማይነጣጠል ጥንድ፣ ‘እና’ በሚል ኃይል ይነበባሉ።
  rationale: ግሪኩ በግልጽ ἢ፣ ‘ወይም’፣ ይጠቀማል፤ ትርጉሙም ይህን ልዩነት ይጠብቃል።
- issue: ἔνοχος ከጌታ ሥጋና ደም ጋር ያለው ግንኙነት
  choice: ‘በጌታ ሥጋና ደም ላይ በደለኛ’ ተብሎ ተተርጉሟል።
  alternative: ‘የጌታን ሥጋና ደም የበደለ’ ወይም ‘ስለ ጌታ ሥጋና ደም ተጠያቂ’።
  rationale: ይህ አገላለጽ የጥፋተኝነቱን ክብደት ይጠብቃል፤ የጄኔቲቩን ትክክለኛ ሕጋዊ ወይም መሥዋዕታዊ ልዩነት ግን ከጽሑፉ በላይ አይወስንም።
