  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: am
  text: ወንድ ከሴት የመጣ አይደለምና፤ ሴት ግን ከወንድ የመጣች ናት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ባል ከሚስት የመጣ አይደለምና፤ ሚስት ግን ከባል የመጣች ናት።” የግሪክ ቃላቱ “ወንድ/ሴት” ወይም “ባል/ሚስት” ማለት ይችላሉ፤ እዚህ ሰፊው የፍጥረት አውድ ይመረጣል።
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: -ና
  rationale: ይህ ቅጥያ ንግግሩ ቀደም ላለው ሐሳብ ምክንያት ወይም ማብራሪያ እንደሚሰጥ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀνήρ / ἀνδρός
  choice: ወንድ / ከወንድ
  rationale: ቃሉ ‘ባል’ ሊል ቢችልም፣ እዚህ ያለው የፍጥረትና የመገኛ አውድ ሰፊውን ‘ወንድ’ ትርጉም ይደግፋል።
- source_word: γυνή / γυναικός
  choice: ሴት / ከሴት
  rationale: ቃሉ ‘ሚስት’ ሊል ቢችልም፣ ከἀνήρ ጋር በፍጥረት አውድ የተደረገው ንጽጽር ‘ሴት’ የሚለውን ሰፊ ትርጉም ይጠቁማል።
- source_word: ἐκ / ἐξ
  choice: ከ...ተገኘ
  rationale: መስተዋድዱ ምንጭን ወይም መገኛን ያመለክታል፤ ‘ከ...ተገኘ’ ይህን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀλλά
  choice: ግን
  rationale: በሁለቱ አረፍተ ነገሮች መካከል ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐστιν
  choice: ተገኘ
  rationale: ከἐκ ጋር የተገለጸውን የምንጭ ግንኙነት በአማርኛ ‘ከ...ተገኘ’ ማለት ከቃል በቃል ‘ነው’ ይልቅ ግልጽና ተፈጥሯዊ ነው፤ በሁለተኛው ክፍል ግሱ በግሪክ ቢታሰብም በአማርኛ ለግልጽነት ተደግሟል።
theological_decisions:
- issue: ἀνήρ/γυνήን ‘ወንድ/ሴት’ ወይስ ‘ባል/ሚስት’ ብሎ መተርጎም
  choice: ወንድ/ሴት
  alternative: ባል/ሚስት
  rationale: ጳውሎስ ንግግሩን በፍጥረት ታሪክና በመገኛ ላይ ይመሠርታል። ‘ወንድ/ሴት’ ማለት ይህን ሰፊ የፍጥረት አውድ ይጠብቃል፤ ነገር ግን የግሪክ ቃላት የትዳር ትርጉምም ሊኖራቸው ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ከ...ተገኘ’ የመገኛን ሐሳብ በተፈጥሯዊ አገላለጽ ይይዛል።
