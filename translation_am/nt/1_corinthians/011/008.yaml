  revision_rationale: The revision replaces the potentially misleading ተገኘ with የመጣ ... ነው/ናት, a natural Amharic expression for source or origin. It preserves the Greek contrast, the explanatory force of -ና, and the broader man/woman reading, while avoiding an added assertion that the woman was “created” from the man.
