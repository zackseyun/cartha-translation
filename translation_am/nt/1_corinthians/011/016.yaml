lexical_decisions:
- source_word: δοκεῖ
  choice: ቢመስለው
  rationale: δοκεῖ የሚለውን ‘ይመስለዋል/ያስባል’ በሚለው ስፋት ያቀርባል፤ ሰውየው ራሱን እንደዚያ ማሰቡን ወይም ዝንባሌው እንደዚያ መታየቱን በፍጹም አይወስንም።
- source_word: φιλόνεικος
  choice: ጠብ ወዳድ
  rationale: ለክርክርና ለጠብ የሚያዘነብልን ሰው በተፈጥሯዊና በግልጽ አማርኛ ይገልጻል።
- source_word: τοιαύτην
  choice: እንዲህ ያለ
  rationale: ወደ አንድ ዓይነት ተግባር ወይም ልማድ የሚያመለክተውን የግሪክ አገላለጽ ያለ ተጨማሪ ትርጓሜ ያቆያል።
- source_word: συνήθειαν
  choice: ልማድ
  rationale: የተለመደ ወይም በማኅበር የተቀበለ አሠራርን ሊያመለክት የሚችል ተፈጥሯዊ ምርጫ ነው።
- source_word: οὐκ ἔχομεν
  choice: የለንም
  rationale: ‘የለንም’ የሚለው የግሪኩን ቀጥተኛ አገላለጽ ያስተላልፋል፤ ‘አንከተልም’ ወይም ‘አንፈቅድም’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: የእግዚአብሔር ቤተ ክርስቲያናት
  rationale: የባለቤትነት ሐረጉን ጠብቆ በዘመናዊ መደበኛ አማርኛ የጉባኤዎቹን ብዙ ቁጥር ያሳያል።
theological_decisions:
- issue: ‘እንዲህ ያለ ልማድ’ የሚለው ሐረግ የሚያመለክተው
  choice: ትርጉሙ ‘እንዲህ ያለ ልማድ’ ብሎ አመልካቹን ሳይወስን ያቆየዋል።
  alternative: የጠብ ወዳድነት ልማድ ወይም በቀደሙት ቁጥሮች የተነሣው አከራካሪ ልማድ።
  rationale: τοιαύτην συνήθειαν አጭር ሲሆን አመልካቹ በዐውዱ አከራካሪ ነው። አንዱን አተረጓጎም በዋናው ጽሑፍ ላይ መጫን ሳይኖር የምንጩ እርግጠኛ ያልሆነ አመልካች ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቤተ ክርስቲያናት’ በአማርኛ የተለመደውን ክርስቲያናዊ መዝገብ ይጠብቃል።
