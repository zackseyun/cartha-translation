  text: ነገር ግን፣ ማንም ሰው ጠብ ወዳድ መሆኑ ቢመስለው[a]፣ እኛ እንዲህ ያለ ልማድ[b] የለንም፤ የእግዚአብሔር ቤተ ክርስቲያናትም የላቸውም።
