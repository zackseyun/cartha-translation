    text: ወይም፣ “ጠበኛ” ወይም “ክርክር ወዳድ።”
    reason: lexical_alternative
  - marker: b
    text: “እንዲህ ያለ ልማድ” የሚለው ጠብ ወዳድ የመሆንን ልማድ ወይም በቀደሙት ቁጥሮች የተነገረውን አከራካሪ አሠራር ሊያመለክት ይችላል።
