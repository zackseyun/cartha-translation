review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders δοκιμαζέτω, ἄνθρωπος, and the paired imperatives to eat and drink. However, οὕτως means “thus/in this way,” not merely “then”; ከዚያም reduces the stated manner to sequence.
  naturalness: The wording is otherwise clear, dignified modern Amharic. Replacing ከዚያም with እንዲሁም gives a natural biblical-prose expression while retaining the Greek connection between self-examination and participation.
  terminology: ሰው is an appropriate generic rendering of ἄνθρωπος. ራሱን ይመርምር, እንጀራ, and ጽዋ are suitable and do not introduce doctrinal conditions absent from the verse.
  issues:
  - severity: medium
    issue: οὕτως is rendered as ከዚያም.
    rationale: The Greek adverb denotes manner (“thus,” “in this way”) in conjunction with the preceding self-examination. ከዚያም primarily signals temporal succession (“then/after that”), losing this nuance.
  revised_text: ነገር ግን ሰው ራሱን ይመርምር፤ እንዲሁም ከእንጀራው ይብላ፣ ከጽዋውም ይጠጣ።
  revised_footnotes: []
  revision_rationale: The sole revision restores the manner force of καὶ οὕτως without adding any requirement that a person be judged worthy or abstain. The rest of the draft faithfully and naturally conveys the source.
