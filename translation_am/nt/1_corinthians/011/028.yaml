  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: am
  text: ነገር ግን ሰው ራሱን ይመርምር፤ እንዲሁም ከእንጀራው ይብላ፣ ከጽዋውም ይጠጣ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: ይመርምር
  rationale: The verb calls for testing or examining oneself; ይመርምር is natural modern Amharic and preserves the deliberate self-examination.
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: In this context the Greek noun refers generically to a person; ሰው is the ordinary, inclusive Amharic equivalent without adding a specifically male restriction.
- source_word: οὕτως
  choice: ከዚያም
  rationale: Here it indicates proceeding to eat and drink on the basis of the examination. ከዚያም expresses the contextual sequence naturally without specifying an unstated result of the examination.
- source_word: ἐκ τοῦ ἄρτου ... ἐκ τοῦ ποτηρίου
  choice: ከእንጀራው ... ከጽዋው
  rationale: The repeated ἐκ is retained with ከ-, while እንጀራ here functions in its established broad biblical sense of bread rather than naming only the Ethiopian flatbread.
theological_decisions:
- issue: Whether ἄνθρωπος should be rendered as an explicitly male individual
  choice: ሰው
  alternative: ወንድ ሰው
  rationale: Although grammatical gender and older English usage can yield “man,” the Greek ἄνθρωπος is generic here and the exhortation applies to every participant. An explicitly male Amharic phrase would narrow the referent.
- issue: Whether self-examination implies abstaining if found unworthy
  choice: The verse says to examine oneself and then eat and drink, without adding a condition.
  alternative: Add wording such as “if found worthy” or direct the person to abstain
  rationale: Neither condition nor abstention is stated in the Greek. The translation preserves the command's tension and does not resolve it doctrinally.
translation_notes:
  register: Modern standard Amharic in Ge'ez script, using dignified but readily understandable biblical prose. The paired jussive forms preserve the exhortational force of the Greek imperatives.
source_grounding:
