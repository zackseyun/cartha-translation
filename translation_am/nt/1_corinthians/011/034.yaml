base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: am
  text: ማንም ቢራብ፣ ለፍርድ[a] እንዳትሰበሰቡ በቤት ይብላ። የቀሩትንም ጉዳዮች ስመጣ መመሪያ እሰጣለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ለኩነኔ»። የግሪኩ κρίμα «ፍርድ» ወይም «ኩነኔ» ማለት ሊሆን ይችላል። በዚህ ስፍራ «ፍርድ» የሚለው ትርጉም ከቅርብ ዐውዱ ጋር ይበልጥ ይስማማል፤ በቁጥር 29–32 ጳውሎስ ከመጨረሻ ኩነኔ ይልቅ ስለ ጌታ ወቅታዊ ፍርድና ተግሣጽ ይናገራል።
    reason: lexical_alternative
lexical_decisions:
