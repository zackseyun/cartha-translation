- source_word: ἐσθιέτω
  choice: ይብላ
  rationale: የሦስተኛ መደብ ነጠላ ትእዛዝን በአጭርና ተፈጥሯዊ መልኩ ያስተላልፋል።
- source_word: εἰς κρίμα
  choice: ለፍርድ
  rationale: κρίμα ፍርድን ወይም የፍርድ ውሳኔን ሊያመለክት ይችላል። «ለፍርድ» የማስጠንቀቂያውን ክብደት ይጠብቃል፤ የመጨረሻ ኩነኔ መሆኑን ግን አስቀድሞ አይወስንም።
- source_word: συνέρχησθε
  choice: እንዳትሰበሰቡ
  rationale: በምዕራፉ ውስጥ የማኅበሩን መሰብሰብ የሚገልጸውን ተደጋጋሚ ግስ ግልጽ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: Τὰ δὲ λοιπὰ
