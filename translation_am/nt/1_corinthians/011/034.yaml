- source_word: ὡς ἂν ἔλθω
  choice: ስመጣ
  rationale: የወደፊቱን ጉብኝት ጊዜ በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ያስተላልፋል።
- source_word: διατάξομαι
  choice: መመሪያ እሰጣለሁ
  rationale: በተግባራዊ ጉዳዮቹ ላይ ማዘዝን፣ ማደራጀትን ወይም ደንብ ማስያዝን በግልጽ ዘመናዊ አማርኛ ይገልጻል።
