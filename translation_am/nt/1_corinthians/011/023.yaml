  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: am
  text: እኔ ለእናንተ ያስተላለፍኩትን ከጌታ ተቀበልኩና፤ ይኸውም፣ ጌታ ኢየሱስ አሳልፈው በሚሰጡበት ሌሊት[a] እንጀራ ወሰደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በባህላዊ አተረጓጎም፣ «በተከዳበት ሌሊት»።
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: የተቀበልኩትን
  rationale: የጳውሎስን ትምህርት ወይም ወግ መቀበል ያመለክታል፤ ከ«አስተላልፌአለሁ» ጋር ያለውን ተቀበለ/አስተላለፈ ትስስርም ይጠብቃል።
- source_word: ἀπὸ τοῦ κυρίου
  choice: ከጌታ
  rationale: ምንጩን በቀጥታ ይገልጣል፤ «ጌታ» የሚለውንም ሳያሰፋ ይጠብቃል።
- source_word: παρέδωκα
  choice: አስተላልፌአለሁ
  rationale: የተቀበለውን ትምህርት ለሌሎች ማስተላለፍን በተፈጥሯዊ አማርኛ ይገልጣል፤ በኋላ ካለው παρεδίδετο ጋር የሚፈጠርን የአማርኛ ግራ መጋባትም ያስወግዳል።
- source_word: ὅτι
  choice: ይኸውም
  rationale: የተላለፈውን ነገር ይዘት በግልጽና ተፈጥሯዊ ሁኔታ ያስገባል።
- source_word: κύριος
  choice: ጌታ
  rationale: የቃሉን ክብራዊና ክርስቶሳዊ ኃይል የሚጠብቅ መደበኛ አማርኛ ነው።
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: በ…ሌሊት
  rationale: የጊዜውን አንጻራዊ ሐረግ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: παρεδίδετο
  choice: አሳልፎ በተሰጠበት
  rationale: የግሱን ተገብሮ የመሰጠት/አሳልፎ የመስጠት ሰፊ ትርጉም ይጠብቃል፤ ድርጊቱን በይሁዳ ክህደት ብቻ አያጥብም።
- source_word: ἔλαβεν ἄρτον
  choice: እንጀራ ወሰደ
  rationale: ቀጥተኛ፣ ተፈጥሯዊና በጌታ እራት ትረካ የታወቀ አገላለጽ ነው።
theological_decisions:
- issue: በጌታ እራት ትረካ παρεδίδετο የሚለው አተረጓጎም
  choice: አሳልፎ በተሰጠበት
  alternative: በተከዳበት
  rationale: παραδίδωμι እንደ ዐውዱ አሳልፎ መስጠት፣ ለባለሥልጣን መስጠት ወይም መክዳትን ሊያመለክት ይችላል። ዋናው ጽሑፍ ሰፊውን ትርጉምና ሥነ መለኮታዊ ውጥረቱን ይጠብቃል፤ ባህላዊው አተረጓጎም ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተቀበለ/አስተላለፈ አወቃቀር ተጠብቋል፤ παρεδίδετο ያለው አሻሚነትም በዋናው ጽሑፍና በማስታወሻው ተወክሏል።
