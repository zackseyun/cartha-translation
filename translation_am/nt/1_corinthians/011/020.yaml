  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: am
  text: ስለዚህ[a] በአንድ ስፍራ ስትሰበሰቡ፣ የምትበሉት የጌታ እራት አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለዚህ በአንድ ስፍራ ስትሰበሰቡ፣ የጌታን እራት እየበላችሁ አይደለም።” ይህም በአድራጎታቸው ምክንያት ምግቡ የጌታ እራት ተብሎ ሊቆጠር እንደማይችል ያጎላል።
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: ስትሰበሰቡ
  rationale: ከὑμῶν ጋር የተሠራው የግስ አገባብ ጊዜን ይገልጣል፤ “ስትሰበሰቡ” የጋራ መሰብሰቡን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ስለ መከፋፈል ከተሰጠው ተግሣጽ የሚነሣውን ድምዳሜ ያሳያል።
- source_word: ἐπὶ τὸ αὐτό
  choice: በአንድ ስፍራ
  rationale: ሐረጉ በአንድ ቦታ ወይም በአንድ ጉባኤ መሰብሰብን ያመለክታል፤ ይህ አተረጓጎም የቦታውን ገጽታ ይጠብቃል።
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: የምትበሉት ... አይደለም
  rationale: የግሪክ አገባቡ አጭርና ፈሊጣዊ ነው። በቁጥር 21–22 ያለው አውድ በክፍፍላቸው ምክንያት ምግባቸው በትክክል “የጌታ እራት” ሊባል እንደማይችል ያሳያል።
- source_word: κυριακὸν
  choice: የጌታ
  rationale: ቅጽሉ “የጌታ የሆነ” ወይም “ለጌታ የሚገባ” የሚል የባለቤትነት ሐሳብ አለው፤ “የጌታ” ግልጽና የተለመደ ነው።
- source_word: δεῖπνον
  choice: እራት
  rationale: ቃሉ ዋናውን ምግብ፣ በዚህ አውድም ከኢየሱስ መታሰቢያ ጋር የተያያዘውን የጋራ ምግብ ያመለክታል። “እራት” የታወቀውን ክርስቲያናዊ አጠራር ይጠብቃል።
- source_word: κυριακὸν δεῖπνον
  choice: የጌታ እራት
  rationale: የግሪኩን ቅጽልና ስም ጥምረት በቀጥታ የሚያስተላልፍና በአማርኛ ክርስቲያናዊ ንግግር የሚታወቅ አገላለጽ ነው።
theological_decisions:
- issue: ጳውሎስ እራቱን መብላት እንደማይቻል እየተናገረ ነው ወይስ የእነርሱ አድራጎት የጌታ እራት ሊባል እንደማይገባ እየገለጠ ነው?
  choice: በክፍፍል የተሞላው አሰባሰባቸውና አመጋገባቸው የጌታ እራት ተብሎ ሊጠራ እንደማይገባ መግለጽ
  alternative: “የጌታን እራት መብላት አይቻልም” ወይም “የጌታን እራት እየበላችሁ አይደለም”
  rationale: የቁጥር 21–22 አውድ ጳውሎስ የሚወቅሰው የምግቡን መኖር ሳይሆን የሚበሉበትን ከፋፋይና አሳፋሪ ሁኔታ መሆኑን ያሳያል። ዋናው ትርጉም ይህን የግምገማ ኃይል ያስተላልፋል፤ የግሪኩ አገባብ ሌላ አተረጓጎም ሊፈቅድ መቻሉ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ አማርኛን ይጠቀማል። “የጌታ እራት” የታወቀውን አጠራር ይጠብቃል፤ የግሪኩ አጭር አገባብ በተፈጥሯዊ አማርኛ ተገልጦ፣ አሻሚነቱ በእግር ማስታወሻ ተጠብቋል።
