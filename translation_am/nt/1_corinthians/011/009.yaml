id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: am
  text: ምክንያቱም ወንድ ለሴት አልተፈጠረም፤ ሴት ግን ለወንድ ተፈጠረች።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሴት ምክንያት … በወንድ ምክንያት።” የግሪኩ መስተዋድድ ምክንያትን ወይም ዓላማን ሊያመለክት ይችላል፤ እዚህ ከፍጥረት ጋር የተያያዘውን ክርክር ለማንጸባረቅ “ለ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ምክንያቱም
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን ማብራሪያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ καί የሚጨምረው ቀላል አጽንዖት በአውዱ ውስጥ ተጠብቋል።
- source_word: ἐκτίσθη
  choice: ተፈጠረ
  rationale: የκτίζωን መሠረታዊ የፍጥረት ትርጉም በቀጥታ ያስተላልፋል፤ ጥቅሱም ወደ ፍጥረት ታሪክ ይመለከታል።
- source_word: ἀνὴρ / γυνὴ
  choice: ወንድ / ሴት
  rationale: ቃላቱ በዚህ የፍጥረት አውድ ከባልና ሚስት ይልቅ ወንድና ሴትን በአጠቃላይ ያመለክታሉ።
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: ለሴት / ለወንድ
  rationale: διά ከተሳቢ ሁኔታ ጋር ምክንያትን ወይም ዓላማን ሊገልጽ ይችላል፤ እዚህ «ለ» የፍጥረት ዓላማን ወይም ተጠቃሚነትን ከልክ በላይ ሳይወስን በአጭር ይገልጻል።
- source_word: ἀλλὰ
  choice: ግን
  rationale: በሁለቱ ንጽጽራዊ ክፍሎች መካከል ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ἀνήρ/γυνή እንደ «ወንድ/ሴት» ወይስ «ባል/ሚስት» መተርጎም
  choice: ወንድ/ሴት
  alternative: ባል/ሚስት
  rationale: «ተፈጠረ» የሚለው ግስ ክርክሩን በፍጥረት ታሪክ ላይ ስለሚመሠርት፣ ሰፊው የወንድና የሴት ትርጉም ይመረጣል፤ ትርጉሙ ጉዳዩን በጋብቻ ግንኙነት ብቻ አይገድብም።
- issue: διά ዓላማን ወይስ ምክንያትን እንደሚገልጽ
  choice: በዋናው ጽሑፍ «ለ» ተብሎ የዓላማ/ተጠቃሚነት ንባብ ተጠብቋል
  alternative: «በሴት/በወንድ ምክንያት»
  rationale: የግሪኩ መስተዋድድ ሁለቱንም አቅጣጫዎች ሊፈቅድ ስለሚችል ዋናው ጽሑፍ ተፈጥሯዊውን የፍጥረት-ዓላማ ንባብ ይይዛል፤ ሌላው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ትይዩ አወቃቀሩ ተጠብቆ የδιά ትርጉም አሻሚነት በግርጌ ማስታወሻ ተገልጿል።
