base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: am
  text: ነገር ግን፣ ይህን መመሪያ ስሰጥ[a] አላመሰግናችሁም፤ ምክንያቱም የምትሰበሰቡት ለተሻለው ሳይሆን ለከፋው ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን ሳዝዝ።” የግሪኩ አሳታፊ ግስ መመሪያ መስጠትን፣ መምራትን ወይም ማዘዝን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ይህን
  rationale: ገለልተኛው አመልካች ተውላጠ ስም ጳውሎስ ከዚህ በኋላ ወደሚሰጠው መመሪያ ያመለክታል፤ በአማርኛም ከ‘ሳዝዝ’ ጋር ‘ይህን’ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ወደ ወቀሳ የሚያሸጋግር መጠነኛ ተቃርኖን ያሳያል።
- source_word: παραγγέλλων
  choice: ሳዝዝ
  rationale: ቃሉ ማስተማርን፣ መመሪያ መስጠትን ወይም ማዘዝን ሊያመለክት ይችላል። ‘ሳዝዝ’ የሐዋርያዊውን ሥልጣን ያሳያል፤ የትርጉም ስፋቱም በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἐπαινῶ
  choice: አላመሰግናችሁም
  rationale: ἐπαινέω ማመስገን ወይም ማድነቅ ማለት ነው፤ ይህ አገላለጽ በቁጥር 2 ካለው ምስጋና ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ጳውሎስ የማያመሰግናቸውን ምክንያት የሚያስገባ ምክንያታዊ አያያዥ ነው።
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: ለበጎ ሳይሆን
  rationale: εἰς ከንጽጽራዊ ቅጽል ጋር ውጤትን ወይም አቅጣጫን ያሳያል፤ ‘ለበጎ’ አጭርና ተፈጥሯዊ ነው።
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: ለከፋ
  rationale: ከ‘ለበጎ’ ጋር ያለውን ንጽጽራዊ ተቃርኖ በቀጥታ ይጠብቃል፤ ጉዳት የሚለውን ተጨማሪ ፍቺ አያስገባም።
- source_word: συνέρχεσθε
  choice: መሰብሰባችሁ
  rationale: በዚህ ዐውድ የማኅበሩን አንድ ላይ መሰብሰብ ያመለክታል፤ የስም አገባቡ በዘመናዊ አማርኛ የምክንያት ሐረጉን ተፈጥሯዊ ያደርገዋል።
