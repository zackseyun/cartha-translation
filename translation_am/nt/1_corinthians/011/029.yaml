  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የመብላትና የመጠጣት ድግግሞሽ ሆን ተብሎ ተጠብቋል፤ የ«ሥጋው» ማመልከቻም በዋናው ጽሑፍ አልተወሰነም።
