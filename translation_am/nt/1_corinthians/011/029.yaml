  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: am
  text: አካሉን ሳይለይ የሚበላና የሚጠጣ ሰው፣ በራሱ ላይ ፍርድን ይበላል፣ ይጠጣልም።[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች «አካሉን» በሚለው ፈንታ «የጌታን አካል» ይላሉ።
    reason: textual_variant
  - marker: b
    text: ወይም፣ «አካሉን ሳያስተውል»። ይህ የጌታን እራት ትርጉም መገንዘብን፣ የተሰበሰቡትን ምእመናን እንደ አንድ አካል ለይቶ ማየትን፣ ወይም ሁለቱንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: ፍርድ
  rationale: ቃሉ የፍርድ ውሳኔን ወይም ፍርድን ያመለክታል፤ በቁጥር 32 ካለው ከዓለም ጋር ከመፈረድ ልዩ የሆነ የጌታ ተግሣጽ አውድ አንጻር፣ «ኩነኔ» ከሚለው ይልቅ «ፍርድ» የቃሉን ስፋት ይጠብቃል።
- source_word: ἑαυτῷ
  choice: በራሱ ላይ
  rationale: የተመላሽ ተሳቢው፣ የሚበላውና የሚጠጣው ሰው ፍርድን በራሱ ላይ እንደሚያመጣ ያሳያል።
- source_word: διακρίνων
  choice: ለይቶ ማወቅ
  rationale: ግሱ ተገቢውን ልዩነት ማድረግን፣ መመዘንን ወይም በትክክል መገንዘብን ሊያመለክት ይችላል፤ «ለይቶ ማወቅ» ይህን ስፋት በዘመናዊ አማርኛ ይጠብቃል።
- source_word: τὸ σῶμα
  choice: ሥጋውን
  rationale: የግሪኩ ጽሑፍ «ሥጋውን» ብቻ ይላል፤ ይህ የክርስቶስን ሥጋ፣ የምእመናንን አካል ወይም ሁለቱንም የሚያመለክት መሆኑን ትርጉሙ አይወስንም። በአማርኛ የተወሰነው መስተዋድድ በባለቤት ቅጥ «-ውን» በተፈጥሮ ተገልጧል።
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: የሚበላና የሚጠጣ ሰው
  rationale: የግሪኩን አጠቃላይ ነጠላ ተሳቢ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: μὴ διακρίνων
  choice: ሳይለይ
  rationale: የአሉታዊውን ተውሳከ ግስ ቅርጽ በአማርኛ ተጓዳኝ የሆነው «ሳይ-» ቅጥ ይወክላል፤ ይህም ድርጊቱ ሥጋውን ሳይለይ እንደሚፈጸም ያሳያል።
theological_decisions:
- issue: «ሥጋው» የሚለው ማንን ወይም ምንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ «ሥጋውን» ብሎ የምንጩን አሻሚነት መጠበቅ
  alternative: «የጌታን ሥጋ» ወይም «የምእመናንን አካል» ብሎ መወሰን
  rationale: አውዱ የጌታን እራትና የተሰበሰቡትን ምእመናን አያያዝ ሁለቱንም ያካትታል፤ ግሪኩም «ሥጋው» ብቻ ስለሚል ትርጉሙ አንዱን ብቻ አይወስንም።
- issue: የκρίμα ኃይል
  choice: ፍርድ
  alternative: ኩነኔ
  rationale: በቅርብ አውዱ የተጠቀሰው የጌታ ተግሣጽ ነው፤ «ኩነኔ» የመጨረሻ ጥፋትን በማመልከት የግሪኩን ቃል ከሚገባው በላይ ያጠብበዋል።
