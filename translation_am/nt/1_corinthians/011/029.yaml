- from: የሚበላና የሚጠጣ ሰው፣ ሥጋውን ሳይለይ [b] ቢበላና ቢጠጣ፣ በራሱ ላይ ፍርድን ይበላል፣ ይጠጣልም።[a]
  to: አካሉን ሳይለይ የሚበላና የሚጠጣ ሰው፣ በራሱ ላይ ፍርድን ይበላል፣ ይጠጣልም።[b][a]
  rationale: The revision replaces «ሥጋ» with «አካል» throughout, preserving the Greek noun's meaning and deliberate ambiguity. It also restores a natural Amharic participial structure corresponding to μὴ διακρίνων, while retaining the Greek's emphatic repetition of “eats and drinks.” Both footnotes are revised to match the corrected terminology, and footnote b now supplies a real alternative rendering.
