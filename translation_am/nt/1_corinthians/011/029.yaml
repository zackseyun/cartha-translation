review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the repeated eating-and-drinking imagery and renders κρίμα appropriately as «ፍርድ». However, translating σῶμα as «ሥጋ» narrows and shifts the Greek term. In this context σῶμα must remain «አካል», which can preserve the source text's unresolved reference to Christ's body, the congregational body, or both. The conditional «ቢበላና ቢጠጣ» also unnecessarily recasts the Greek substantival participle and produces an awkward doubled conditional construction.
  naturalness: «አካሉን ሳይለይ የሚበላና የሚጠጣ ሰው…» is clear, idiomatic modern standard Amharic and represents the participial relation directly. It avoids the draft's less natural sequence «…ሳይለይ ቢበላና ቢጠጣ».
  terminology: Use «አካል» consistently for σῶμα, not «ሥጋ». «ሥጋ» normally denotes flesh and cannot naturally carry the ecclesial sense that remains possible in the Greek. «ፍርድ» is retained for κρίμα rather than the stronger «ኩነኔ».
  issues:
  - severity: high
    issue: σῶμα is translated as «ሥጋ» in the text and footnotes.
    rationale: The Greek σῶμα means “body,” whereas «ሥጋ» primarily means flesh. This changes the term and obscures the intentional ambiguity between Christ's body and the gathered body of believers.
  - severity: medium
    issue: The construction «ሥጋውን ሳይለይ ቢበላና ቢጠጣ» is structurally awkward and adds a conditional recasting.
    rationale: The Greek has a generic substantival participle followed by a negative participle. A direct Amharic participial construction is clearer and closer to the source.
  - severity: medium
    issue: Footnote b repeats the main-text wording as its stated alternative.
    rationale: The alternative-reading note should give a genuine alternative expression for διακρίνων, such as «ሳያስተውል», while explaining the interpretive range without resolving it.
  revised_text: አካሉን ሳይለይ የሚበላና የሚጠጣ ሰው፣ በራሱ ላይ ፍርድን ይበላል፣ ይጠጣልም።[b][a]
