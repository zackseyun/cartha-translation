  text: ምክንያቱም በመጀመሪያ ደረጃ፣ በጉባኤ[a] ስትሰበሰቡ በመካከላችሁ ክፍፍሎች እንዳሉ እሰማለሁ፤ ይህንም በከፊል አምናለሁ።
