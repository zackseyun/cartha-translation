- source_word: συνερχομένων ὑμῶν
  choice: ስትሰበሰቡ
  rationale: የግሪኩ አወቃቀር ጊዜን ያመለክታል፤ ቃሉም በዚህ አውድ ማኅበሩ በአንድ ቦታ መሰብሰቡን ይገልጣል።
- source_word: ἐν ἐκκλησίᾳ
