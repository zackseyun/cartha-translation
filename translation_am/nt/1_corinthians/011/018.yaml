- source_word: ἀκούω
  choice: እሰማለሁ
  rationale: የአሁን ጊዜውን እና ጳውሎስ መረጃውን በሪፖርት እንደተቀበለ የሚያሳየውን ስሜት ይጠብቃል።
- source_word: σχίσματα
  choice: ክፍፍል
  rationale: በማኅበሩ ውስጥ ያለን መለያየት ወይም መሰንጠቅ ይገልጣል፤ “ክፍፍል” ከሚያስፈልገው በላይ መደበኛ ወገኖችን ሳያመለክት ትርጉሙን ያስተላልፋል።
- source_word: ὑπάρχειν
  choice: እንዳለ
  rationale: ክፍፍሉ በመካከላቸው መኖሩን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ μέρος τι
  choice: ይህንም በከፊል
