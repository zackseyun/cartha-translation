base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: am
  text: ነገር ግን፣ በጌታ ሴት ያለ ወንድ አይደለችም፤ ወንድም ያለ ሴት አይደለም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጌታ ሚስት ያለ ባል አይደለችም፤ ባልም ያለ ሚስት አይደለም።” የግሪኩ ቃላት ‘ሴት/ወንድ’ ወይም ‘ሚስት/ባል’ ሊሉ ይችላሉ፤ ንግግሩ በጋብቻ ብቻ የተወሰነ ሳይሆን አጠቃላይ መስሎ ስለሚታይ፣ ሰፊው ትርጉም ተመርጧል።
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ በኋላ ሚዛናዊ ማስተካከያን ወይም ተቃራኒ መዞርን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γυνή
  choice: ሴት
  rationale: ቃሉ ‘ሚስት’ ማለትም ሊሆን ቢችልም፣ የቅርብ አውዱ ስለ ወንድና ሴት በአጠቃላይ የሚናገር ስለሚመስል ሰፊው ትርጉም ተመርጧል።
- source_word: ἀνήρ
  choice: ወንድ
  rationale: ቃሉ ‘ባል’ ሊሆን ቢችልም፣ ከγυνή ጋር ያለው ሚዛናዊ ንጽጽር እዚህ አጠቃላይ የወንድና የሴት ግንኙነትን የሚገልጥ ነው።
- source_word: χωρὶς
  choice: ያለ
  rationale: መለየትን ወይም ከሌላው ነጥሎ መኖርን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ገለልተኛ’ የሚለውን ትርጓሜ በግልጽ አያስገባም።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: መደበኛውን የጳውሎስ አገላለጽ ጠብቆ፣ ከጌታ ጋር ያለውን የግንኙነት ወይም የሕይወት መስክ ያሳያል።
- source_word: οὔτε ... οὔτε
  choice: አይደለችም፤ ... አይደለም
  rationale: ሁለቱን ተመጣጣኝ አሉታዊ ንግግሮች በግልጽ አማርኛ ያገናኛል፣ የግሪኩንም ትይዩነት ይጠብቃል።
theological_decisions:
- issue: γυνή / ἀνήρን ‘ሴት/ወንድ’ ወይስ ‘ሚስት/ባል’ ብሎ መተርጎም
  choice: ሴት/ወንድ
  alternative: ሚስት/ባል
  rationale: አውዱ ፍጥረትንና አምልኮን በማንሳት ስለ ወንድና ሴት የጋራ ግንኙነት ሚዛናዊ መግለጫ ያቀርባል። ሰፊው አተረጓጎም ተመርጧል፤ የጋብቻው አማራጭ ግን በማስታወሻ ተጠብቋል።
- issue: χωρὶς ጥገኝነትን ወይም መለየትን እንዴት እንደሚገልጥ
  choice: ያለ
  alternative: ከ... ነጥላ/ነጥሎ ወይም ገለልተኛ ሆና/ሆኖ
  rationale: ‘ያለ’ የምንጩን አጭርነትና አሻሚነት ይጠብቃል፤ ጳውሎስ ሕልውናን፣ ነፃነትን ወይም ግንኙነትን ብቻ እያለ መሆኑን አይወስንም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ ሚዛናዊ አወቃቀር በሁለት ትይዩ ሐረጎች ተጠብቋል።
