base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: am
  text: ምክንያቱም፣ ይህን እንጀራ በበላችሁ እና ጽዋውን[b] በጠጣችሁ ቁጥር፣ የጌታን ሞት እርሱ እስኪመጣ ድረስ ታውጃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: በግሪክኛው በዚህ ጥቅስ “ጽዋውን” ይላል እንጂ “ይህን ጽዋ” አይልም፤ ሆኖም የቅርቡ አውድ የትኛው ጽዋ እንደሆነ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: በ... ቁጥር
  rationale: ድርጊቱ በተፈጸመ ጊዜ ሁሉ የሚደጋገም መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በአማርኛ በተፈጥሯዊ የዓረፍተ ነገር መዝጊያ ያሳያል።
- source_word: ἐσθίητε
  choice: በበላችሁ
  rationale: በያልተወሰነ ጊዜ ሐረግ ውስጥ ያለውን የአሁን ጊዜ ንዑስ አንቀጽ በአማርኛ የተለመደ ጊዜያዊ አገባብ ይተረጉማል።
- source_word: ἄρτον τοῦτον
  choice: ይህን እንጀራ
  rationale: ἄρτος በዚህ አውድ ‘እንጀራ/ኅብስት’ ሲል ምግብ የሆነውን ዳቦ ያመለክታል፤ ‘እንጀራ’ በመጽሐፍ ቅዱሳዊ አማርኛ የታወቀና ለዘመናዊ አንባቢም ግልጽ ነው።
- source_word: ποτήριον
  choice: ጽዋውን
  rationale: በግሪኩ የተወሰነ መስተዋድድ አለ እንጂ ‘ይህ’ የሚል አመልካች የለም፤ ‘ጽዋውን’ ይህን ልዩነት ይጠብቃል።
- source_word: καταγγέλλετε
  choice: ታውጃላችሁ
  rationale: ቃሉ በይፋ ማሳወቅንና መናገርን ያመለክታል፤ ‘ማወጅ’ ይህን ክብደት በአጭሩ ይይዛል።
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: የጌታን ሞት
  rationale: የግሪኩን የባለቤትነት ግንኙነትና የሐረጉን ክብደት በቀጥታ ያስተላልፋል።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος በጳውሎስ አጠቃቀምና በቅርብ አውዱ ለኢየሱስ የሚውለውን የተለመደ ማዕረግ በትክክል ይወክላል።
- source_word: ἄχρι οὗ ἔλθῃ
  choice: እርሱ እስኪመጣ ድረስ
  rationale: የማወጁን የጊዜ ወሰን በተፈጥሯዊ አማርኛ ያሳያል፤ ‘እርሱ’ የሚያመለክተው ቀደም ብሎ የተጠቀሰውን ጌታ ነው።
theological_decisions:
- issue: በἄχρι οὗ ἔλθῃ ውስጥ ያልተገለጸው የግስ ባለቤት
  choice: ‘እርሱ’ የሚለው ጌታ ኢየሱስን ያመለክታል።
  alternative: ባለቤቱን ሳይገልጡ ‘እስኪመጣ ድረስ’ ማለት።
  rationale: በቅርብ ያለው ተስማሚ ቀዳሚ ስም ‘ጌታ’ ነው፤ አማርኛ ግልጽ ባለቤት ሲኖረው ይበልጥ ተፈጥሯዊ ስለሆነ ‘እርሱ’ ተጨምሯል።
- issue: የጌታ እራትን ሥርዓታዊ ትርጉም መግለጽ
  choice: እንጀራን መብላት፣ ጽዋውን መጠጣትና የጌታን ሞት ማወጅ ብቻ በቀጥታ ተገልጿል።
  alternative: የተወሰነ ምሥጢራዊ ወይም የመታሰቢያ ትርጓሜ ወደ ጽሑፉ መጨመር።
  rationale: ጥቅሱ የሥርዓቱን ሙሉ ሥነ መለኮታዊ ትርጓሜ አይወስንም፤ ስለዚህ ትርጉሙ የቤተ እምነት ልዩ አቋም አያስገባም።
