  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: am
  text: ነገር ግን በራሳችን ላይ ብንፈርድ[a] ኖሮ፣ በእኛ ላይ አይፈረድም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ራሳችንን ብንመረምር» ወይም «ራሳችንን ብንለይ»። የግሪኩ ግስ መገምገምን ወይም መለየትን ሊያመለክት ይችላል፤ «በራሳችን ላይ ብንፈርድ» የሚለው ግን ከሚቀጥለው «በእኛ ላይ አይፈረድም» ጋር ያለውን የቃላት ተዛምዶ ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን ... ብን... ኖሮ
  rationale: εἰ የሁኔታ አንቀጽን ያስገባል፤ δέ ደግሞ ከቀደመው ሐሳብ ጋር መጠነኛ ንፅፅር ወይም ሽግግር ያሳያል። ይህ አተረጓጎም ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἑαυτοὺς
  choice: እኛ ራሳችንን
  rationale: የግሱ ተመላሽ ቀጥተኛ ተሳቢ ነው፤ ግልጽነትንና አጽንዖትን ለመጠበቅ ‘እኛ ራሳችንን’ ተብሏል።
- source_word: διεκρίνομεν
  choice: ብንመረምር
  rationale: διακρίνω እዚህ ራስን በጥንቃቄ መገምገም፣ መለየት ወይም በራስ ላይ መፍረድ ሊያመለክት ይችላል። ‘ራሳችንን ብንመረምር’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የራስ ግምገማውን ይጠብቃል፤ ሌሎቹ የቃሉ አማራጮች በማስታወሻ ቀርበዋል።
- source_word: οὐκ ἂν
  choice: አን...ም ነበር
  rationale: ከኢምፐርፌክት ግስ ጋር ሆኖ ያልተፈጸመ ሁኔታ ውጤትን ይገልጣል፤ ‘አንፈረድብንም ነበር’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκρινόμεθα
  choice: አንፈረድብንም ነበር
  rationale: κρίνω እዚህ በጌታ ፍርድ ሥር መሆንን ያመለክታል። ‘መፈረድ’ የግሪኩን መሠረታዊ ትርጉም ይጠብቃል፤ ‘መኮነን’ የሚለውን የመጨረሻ ፍርድ ኃይለኛ ትርጉም አያስገባም።
theological_decisions:
- issue: ሁለተኛው አንቀጽ የመጨረሻ ኩነኔን ወይስ ጊዜያዊውን መለኮታዊ ፍርድና ተግሣጽ ያመለክታል?
  choice: ቃሉ ‘አንፈረድብንም’ ተብሎ ያለ ተጨማሪ ማብራሪያ ተተርጉሟል፤ በአውዱ ግን የጌታ ተግሣጻዊ ፍርድ ይጠቆማል።
  alternative: የመጨረሻ ኩነኔ
  rationale: ቁጥር 32 የጌታን ፍርድና ተግሣጽ ከዓለም ጋር ከመኮነን ይለያል። ስለዚህ ἐκρινόμεθαን ‘እንኮነን’ ብሎ ማጠናከር ጽሑፉ ያልወሰነውን አስቀድሞ ይወስናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ብንመረምር ኖሮ ... አንፈረድብንም ነበር’ የግሪኩን ያልተፈጸመ ሁኔታ ተፈጥሯዊ በሆነ አገባብ ያሳያል።
