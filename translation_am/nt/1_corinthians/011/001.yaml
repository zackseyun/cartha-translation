    text: ወይም፦ “ክርስቶስን።”
    reason: alternative_reading
  revision_rationale: The revision corrects the Amharic verbal form and makes the comparative relationship grammatically complete. It retains the imperative, the imitation vocabulary, Paul’s additive “also,” and the Messiah/Christ alternative without imposing an interpretive expansion.
