lexical_decisions:
- source_word: μιμηταί
  choice: የምትመስሉ
  rationale: የሌላውን ሰው ምሳሌ መከተልንና እንደ እርሱ ለመሆን መጣርን በቀጥታ ያሳያል፤ ‘ተከታዮች’ የሚለው ይህን የመምሰል ኃይል ያዳክማል።
- source_word: γίνεσθε
  choice: ሁኑ
  rationale: የአሁን ጊዜ ትእዛዙ እንዲህ ያለ ሰው መሆንን ያዛል፤ ‘የምትመስሉ ሁኑ’ በአማርኛ የ‘Become imitators’ን ኃይል በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: καθὼς κἀγὼ
  choice: እኔም … እንደምመስል
  rationale: ንጽጽሩንና በκἀγώ ያለውን ‘እኔም’ የሚል ጭማሪ ይጠብቃል።
- source_word: Χριστοῦ
  choice: መሲሑን
  rationale: Χριστός እዚህ የኢየሱስን መሲሐዊ ማዕረግ ያመለክታል፤ የግሪኩ አገባብ ባለቤትነት ቢሆንም በአማርኛ ከ‘መምሰል’ ጋር ተሳቢ ሆኖ መቅረቡ ተፈጥሯዊ ነው።
theological_decisions:
- issue: Χριστοῦ እንዴት እንደሚተረጎም
  choice: መሲሑን
  alternative: ክርስቶስን
  rationale: በዚህ አውድ Χριστός እንደ ማዕረግ ስለሚሠራ ‘መሲሑ’ ትርጉሙን ግልጽ ያደርጋል፤ ለተለመደው ቤተ ክርስቲያናዊ አጠራር ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- issue: በκἀγὼ Χριστοῦ ያለው የተዘለለ ቃል
  choice: ‘እንደምመስል’ በማለት ትርጉሙን ግልጽ ማድረግ
  alternative: ‘እኔም የመሲሑ እንደሆንሁ’ ብሎ ቃል በቃል መተርጎም
  rationale: በግሪኩ ‘አስመሳይ’ የሚለው ከመጀመሪያው ሐረግ በቀላሉ ይሞላል። ቃል በቃል የቀረበው አማርኛ ግን ጳውሎስ የመሲሑ ንብረት ወይም ወገን ነው የሚል ሌላ ትርጉም ሊያስነሳ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። የግሪኩ ቅደም ተከተል ተጠብቆ፣ በመጨረሻው ሐረግ የተዘለለው ‘አስመሳይ’ በአማርኛ ግልጽነት ሲባል ‘እንደምመስል’ ተብሎ ቀርቧል።
