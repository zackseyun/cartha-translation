  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: am
  text: እኔም መሲሑን[a] እንደምመስለው፣ እናንተም እኔን የምትመስሉ ሁኑ።
  philosophy: optimal-equivalence
