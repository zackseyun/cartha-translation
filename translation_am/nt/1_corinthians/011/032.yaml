  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: am
  text: ነገር ግን በጌታ ስንፈረድ[a]፣ ከዓለም ጋር እንዳንወገዝ ተግሣጽ እንቀበላለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጌታ እየተፈረደብን፣ ተግሣጽ እንቀበላለን።” የግሪኩ የአሁን ጊዜ ቅርጾች ድርጊቱ ቀጣይ መሆኑን ሊያጎሉ ይችላሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: ስንፈረድ
  rationale: የግሪኩ የአሁን ጊዜ ተደራጊ አንቀጽ ከዋናው ግስ ጋር ጊዜያዊ ግንኙነትን በተፈጥሯዊ አማርኛ ያሳያል፤ ‘መፈረድ’ የፍርድን ትርጉም ይጠብቃል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የፍርድ ማስጠንቀቂያ ጋር ያለውን መጠነኛ ንፅፅር በግልጽ ያሳያል።
- source_word: ὑπὸ κυρίου
  choice: በጌታ
  rationale: ὑπό ከዝርያ ቅጽ ጋር የድርጊቱን አድራጊ ያመለክታል፤ ‘ጌታ’ የκύριοςን መደበኛና በአውዱ ግልጽ የሆነ ትርጉም ይሰጣል።
- source_word: παιδευόμεθα
  choice: እንቀጣለን
  rationale: በዚህ የመለኮታዊ ማስተካከያ አውድ ‘መቀጣት’ የተግሣጽና የማረም ኃይልን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ የመጨረሻ ውግዘትን ግን አያመለክትም።
- source_word: ἵνα μὴ
  choice: እንዳን-
  rationale: የዓላማ ወይም የውጤት ግንኙነቱን በተፈጥሯዊ የአማርኛ አሉታዊ ዓላማ ቅርጽ ይጠብቃል።
- source_word: σὺν τῷ κόσμῳ
  choice: ከዓለም ጋር
  rationale: σύν የጋራ ተሳትፎንና ተመሳሳይ ዕጣ መካፈልን ያሳያል፤ ‘ዓለም’ እዚህ ከእግዚአብሔር የተቃረነውን ዓለም በጥቅል ይወክላል።
- source_word: κατακριθῶμεν
  choice: እንዳንፈረድብን
  rationale: ‘ፈረደበት’ በአማርኛ የክስ ውሳኔንና ውግዘትን ያመለክታል፤ ከቀደመው ቀላል ‘ስንፈረድ’ በበቂ ሁኔታ ተለይቶ የκατακρίνωን አሉታዊ የፍርድ ኃይል ይጠብቃል።
theological_decisions:
- issue: አሁን ባለው መለኮታዊ ፍርድና በመጨረሻው ውግዘት መካከል ያለው ግንኙነት
  choice: ጥቅሱ የጌታን የአሁን ማረሚያ ቅጣት ከዓለም ጋር ከሚደርሰው የውግዘት ፍርድ ይለያል።
  alternative: ጥቅሱ የአማኝና የማያምን ልዩነትን ሳያመለክት በአጠቃላይ ስለ ጊዜያዊ ቅጣት እንደሚናገር ሊነበብ ይችላል።
  rationale: በκρινόμενοιና κατακριθῶμεν መካከል ያለው የቃላት ልዩነት፣ παιδευόμεθα እና ἵνα μὴ የሚለው የዓላማ ሐረግ፣ አሁን ያለውን ማረሚያ ቅጣት ለማስወገድ ከታሰበው ውግዘት ይለያሉ። ትርጉሙ ስለ ጽናት ወይም ስለ ቁርባን ውጤት የተሟላ የእምነት ሥርዓት አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ስንፈረድ’ እና ‘እንዳንፈረድብን’ የሚሉት ቅርጾች በκρίνωና κατακρίνω መካከል ያለውን የፍርድ ደረጃ ልዩነት በተፈጥሯዊ አማርኛ ያሳያሉ።
