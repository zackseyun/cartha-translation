id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: am
  text: ምክንያቱም ሴት[a] ከወንድ እንደመጣች፣ እንዲሁም ወንድ በሴት በኩል ይመጣል፤ ሁሉ ግን ከእግዚአብሔር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አውዱ በጠባብ መልኩ ስለ ጋብቻ እንደሚናገር ከተወሰደ፣ «ሚስት» እና «ባል» ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: እንደተገኘች ... ይገኛልና
  rationale: የንጽጽሩን አወቃቀር በ«እንደ... እንዲሁ» ያስቀምጣል፤ የγάρን ምክንያታዊ ትስስር ደግሞ በ«-ና» ያሳያል።
- source_word: ἡ γυνή
  choice: ሴት
  rationale: γυνή «ሴት» ወይም «ሚስት» ሊሆን ቢችልም፣ ከፍጥረትና ከሰው ልደት ጋር የተያያዘው አጠቃላይ አውድ «ሴት»ን ይደግፋል።
- source_word: ἐκ τοῦ ἀνδρός
  choice: ከወንድ
  rationale: ἐκ ምንጭንና መገኛን ያመለክታል፤ «ከወንድ» ሴት ከወንድ ስለመወሰዷ ያለውን የፍጥረት ጥቅስ ያስታውሳል።
- source_word: ὁ ἀνήρ
  choice: ወንድ
  rationale: ἀνήρ «ወንድ» ወይም «ባል» ሊሆን ይችላል፤ እዚህ ከγυνή ጋር ባለው አጠቃላይና ተመጣጣኝ ንጽጽር «ወንድ» ይሻላል።
- source_word: διὰ τῆς γυναικός
  choice: በሴት በኩል
  rationale: διά ከዝርያ ማስተናገጃው ጋር መንገድን ወይም አማካይነትን ይገልጣል። «በሴት በኩል» ወንድ በሴት በኩል ወደ ዓለም መምጣቱን ያሳያል፣ ἐκ ከሚለውም ይለየዋል።
- source_word: τὰ δὲ πάντα
  choice: ሁሉ ግን
  rationale: δέ ያለውን ለስላሳ ንጽጽርና ወደ መጨረሻው አጽንዖት የሚያደርገውን ሽግግር ይጠብቃል።
- source_word: ἐκ τοῦ θεοῦ
  choice: ከእግዚአብሔር ነው
  rationale: ἐκ የመጨረሻውን ምንጭ ያመለክታል፤ ይህ አተረጓጎም ሁሉ በመጨረሻ ከእግዚአብሔር መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በአውዱ ውስጥ የγυνή እና ἀνήρ ትርጉም
  choice: «ሴት» እና «ወንድ» የሚለው አጠቃላይ ንባብ
  alternative: «ሚስት» እና «ባል» የሚለው የጋብቻ ንባብ
  rationale: ቃላቱ ሁለቱንም ትርጉሞች ሊይዙ ቢችሉም፣ ጥቅሱ የፍጥረትን አመጣጥና የሰውን መወለድ አንድ ላይ ስለሚያነሳ ከጋብቻ የሰፋውን ንባብ ይደግፋል። አማራጩ ግን በማስታወሻ ተጠብቋል።
- issue: የሴትና የወንድ አመጣጥ የተገለጸበት ልዩነት
  choice: ἐκን «ከ»፣ διάን «በ... በኩል» ብሎ ለይቶ ማቅረብ
  alternative: ሁለቱንም «ከ» ብሎ ማስተካከል
  rationale: ጳውሎስ ሴት በፍጥረት ከወንድ መገኘቷንና ወንድ በልደት በሴት በኩል መምጣቱን ለይቶ ያቀርባል። ልዩነቱን መጠበቅ የጥቅሱን መደጋገፍና ሥነ-መለኮታዊ ውጥረት ሳያስወግድ ያስተላልፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ተገኘች/ይገኛል» በግሪክ ውስጥ በአጭሩ የቀረበውን የመገኛ ግንኙነት በአማርኛ ግልጽ ያደርጋል፤ «ከ» እና «በ... በኩል» የሚለው ልዩነት ግን በጥንቃቄ ተጠብቋል።
