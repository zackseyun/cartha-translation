language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: am
  text: ታዲያ የምትበሉበትና የምትጠጡበት ቤቶች የሏችሁምን? ወይስ የእግዚአብሔርን ቤተ ክርስቲያን ትንቃላችሁና ምንም የሌላቸውንስ[a] ታሳፍራላችሁ? ምን ልበላችሁ? ላመስግናችሁን? በዚህ ጉዳይ አላመሰግናችሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ድሆችን» ወይም «ምግብ የሌላቸውን»፤ የግሪኩ ቃል በቀጥታ «የሌላቸውን» ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: ቤት
  rationale: በአማርኛ ብዙ ባለቤት አመልካች ቅጥያው («የላችሁም») ለእያንዳንዳቸው ያለውን የግል መኖሪያ በተፈጥሮ ያመለክታል፤ ከተሰበሰበው ማኅበር ጋር ያለውንም ንፅፅር ይጠብቃል።
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: የምትበሉበትና የምትጠጡበት
  rationale: የግሪኩን የዓላማ ሐሳብ በተፈጥሮአዊ የአማርኛ አንጻራዊ አገላለጽ ያቀርባል።
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: የእግዚአብሔርን ቤተ ክርስቲያን
  rationale: የተሰበሰበውንና የእግዚአብሔር የሆነውን ማኅበረሰብ የሚያመለክተውን የጳውሎስ የተለመደ አጠቃቀም በታወቀው የአማርኛ ቃል ይገልጣል።
- source_word: καταφρονεῖτε
  choice: ትንቃላችሁ
  rationale: እንደ ከንቱ መቁጠርንና በንቀት መያዝን የሚገልጠውን ጠንካራ የሞራል ወቀሳ ይጠብቃል።
- source_word: καταισχύνετε
  choice: ታሳፍራላችሁ
  rationale: ሌሎችን ለእፍረት መዳረግ የሚለውን የምንጩን አንቀሳቃሽ ፍቺ በቀጥታ ያስተላልፋል።
- source_word: τοὺς μὴ ἔχοντας
  choice: ምንም የሌላቸውን
  rationale: «የሌላቸውን» የሚለውን ሰፊ የግሪክ አገላለጽ ይጠብቃል፤ ወዲያውኑ «ድሆች» ወይም «ምግብ የሌላቸው» ብሎ አያጠብም።
- source_word: τί εἴπω ὑμῖν;
  choice: ምን ልበላችሁ?
  rationale: የውስጥ ምክክር ዓይነት ጥያቄውንና የጳውሎስን የንግግር ግራ መጋባት በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπαινέσω ὑμᾶς;
  choice: ላመስግናችሁን?
  rationale: አሉታዊ መልስ የሚጠበቅበትን ምጸታዊ ጥያቄ በአጭርና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: ἐν τούτῳ
  choice: በዚህ ጉዳይ
  rationale: ወደተነጋገረበት ጉዳይ መመለሱን ግልጽ ያደርጋል፤ «ጉዳይ» የሚለው ቃል በአማርኛ ለተፈጥሯዊነት ተጨምሯል።
- source_word: οὐκ ἐπαινῶ
  choice: አላመሰግናችሁም
  rationale: ከቀደመው «ላመስግናችሁን?» ጋር የግሱን ድግግሞሽና የወቀሳውን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: በጌታ እራት አውድ ውስጥ τοὺς μὴ ἔχοντας የሚያመለክታቸው
  choice: ምንም የሌላቸውን
  alternative: ድሆችን፤ ምግብ የሌላቸውን
  rationale: አውዱ በንብረት ወይም በምግብ የተቸገሩ አማኞችን እንደሚያመለክት ቢያሳይም፣ የግሪኩ አገላለጽ በቃል ደረጃ «የሌላቸው» ብሎ ሰፋ ያለ ነው። ዋናው ጽሑፍ ይህን ስፋት ይጠብቃል፤ አማራጮቹ በማስታወሻ ተገልጸዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተከታታይ ጥያቄዎቹና የመጨረሻው ቀጥተኛ ወቀሳ የግሪኩን የክርክር ምት እንዲጠብቁ ተደርጓል።
