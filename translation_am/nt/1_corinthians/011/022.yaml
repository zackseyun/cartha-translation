review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rebuke, the rhetorical questions, and the repeated refusal to praise. However, οἰκίας is plural, and the second Greek question encompasses both despising God’s church and shaming those who lack; the Amharic punctuation currently separates these into two questions.
  naturalness: The Amharic is generally modern and clear. Keeping the two coordinated accusations within one question produces a smoother and more faithful rhetorical flow. Pluralizing “houses” is also natural in this distributive context.
  terminology: “የእግዚአብሔር ቤተ ክርስቲያን,” “ትንቃላችሁ,” and “ታሳፍራላችሁ” are appropriate established and natural renderings. “ምንም የሌላቸውን” preserves the deliberately broad expression τοὺς μὴ ἔχοντας; the footnote suitably supplies contextual alternatives.
  issues:
  - severity: low
    issue: οἰκίας is plural, while the draft has singular “ቤት.”
    rationale: The plural points to private homes, likely distributively among the addressees. “ቤቶች” preserves this explicit grammatical detail without reducing naturalness.
  - severity: medium
    issue: The punctuation divides “Do you despise the church of God and shame those who have nothing?” into two separate Amharic questions.
    rationale: The Greek coordinates καταφρονεῖτε and καταισχύνετε under one interrogative alternative (ἢ ... καί ...;). A single question better preserves the syntax and rhetorical force.
