  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: am
  text: ምክንያቱም ሴት[a] ራሷን የማትሸፍን[b] ከሆነ፣ ጸጉሯንም ታስቆርጥ፤ ነገር ግን ለሴት ጸጉሯን ማስቆረጥ ወይም ራሷን መላጨት አሳፋሪ ከሆነ፣ ራሷን ትሸፍን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚህ ቁጥር ሁሉ «ሚስት» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ gynē እንደ ዐውዱ «ሴት» ወይም «ሚስት» ማለት ይችላል።
    reason: alternative_reading
  - marker: b
    text: «ያልተጋረደች» ተብሎም ሊተረጎም ይችላል፤ ግሪኩ ስለ መሸፈን ይናገራል፣ በዐውዱም የራስ መሸፈኛ መሆኑ ይገባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: ራሷን የማትሸፍን / ራሷን ትሸፍን
  rationale: ግሱ መሸፈንን ወይም መጋረድን ያመለክታል። በዐውዱ የሚሸፈነው ራስ መሆኑ ስለሚገባ፣ «ራሷን መሸፈን» የተወሰነ የልብስ ዓይነት ሳይጨምር ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γυνή
  choice: ሴት
  rationale: γυνή እንደ ዐውዱ «ሴት» ወይም «ሚስት» ሊሆን ይችላል። ይህ ቁጥር ባልን በግልጽ ሳይጠቅስ ንግግሩን በአጠቃላይ ስለሚያቀርብ፣ «ሴት» ያልተገደበውን ትርጉም ይጠብቃል።
- source_word: κειράσθω / τὸ κείρασθαι
  choice: ጸጉሯንም ታስቆርጥ / ጸጉሯን ማስቆረጥ
  rationale: ቃሉ ጸጉርን ማስቆረጥን ወይም አጭር አድርጎ ማስቆረጥን ያመለክታል። «ማስቆረጥ» ድርጊቱ በእርሷ ላይ እንዲፈጸም የሚያሳየውን አገባብ ይጠብቃል፣ ከሚቀጥለው ሙሉ በሙሉ መላጨትም ይለያል።
- source_word: καὶ
  choice: -ም
  rationale: በ«ጸጉሯንም» ያለው «-ም» የክርክሩን «ደግሞ/እንዲሁም» የሚል ተከታታይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αἰσχρόν
  choice: አሳፋሪ
  rationale: ቃሉ በማኅበራዊ ክብርና ነውር ዙሪያ ያለውን ኃይል ይይዛል፤ «አሳፋሪ» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ξυρᾶσθαι
  choice: ራሷን መላጨት
  rationale: ግሱ በምላጭ መላጨትን ያመለክታል። የሚላጨው የራስ ጸጉር መሆኑን «ራሷን» በግልጽ ያሳያል፣ ከ«ማስቆረጥ»ም የተለየ ድርጊት ሆኖ ይቀራል።
- source_word: γὰρ ... δὲ
  choice: ከሆነ ... ነገር ግን
  rationale: የቀደመውን ክርክር የሚያብራራው γάρ በቁጥሩ የምክንያት ፍሰት ውስጥ ተካትቷል፤ δέ ደግሞ «ነገር ግን» ተብሎ የንጽጽሩን ለውጥ በግልጽ ያሳያል።
theological_decisions:
- issue: γυνή በዚህ ቁጥር «ሴት» ወይስ «ሚስት» ተብሎ መተርጎም
  choice: ሴት
  alternative: ሚስት
  rationale: ቁጥሩ ባልን በግልጽ አይጠቅስም፣ ንግግሩም አጠቃላይ ቅርጽ አለው። «ሴት» የግሪኩን ሰፊ የትርጉም ክልል ሳያጠብ ያቀርባል፤ «ሚስት» የሚለው ዐውዳዊ አማራጭ ግን በማስታወሻ ተጠብቋል።
- issue: κατακαλύπτεσθαι አጠቃላይ መሸፈንን ወይስ በመጋረጃ መሸፈንን ያመለክታል
  choice: ራሷን መሸፈን
  alternative: ተጋርዳ መሆን
  rationale: ግሪኩ መሸፈንን ያመለክታል እንጂ የራስ መሸፈኛውን የተወሰነ ቅርጽ አይገልጽም። ስለዚህ ዋናው ጽሑፍ የልብስ ዓይነት ሳይወስን አሻሚነቱን ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «ታስቆርጥ» እና «መላጨት» በግሪኩ መካከል ያለውን ልዩነት ይጠብቃሉ። የ[b] ምልክት ከሚመለከተው የመሸፈን ግስ ጋር ተቀምጧል።
