  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: am
  text: እንዲሁም ከእራት በኋላ ጽዋውን አንሥቶ እንዲህ አለ፦ “ይህ ጽዋ በደሜ የተደረገው አዲሱ ኪዳን[a] ነው። በጠጣችሁ ቁጥር[b] እኔን ለማሰብ ይህን ማድረጋችሁን ቀጥሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አዲስ ኑዛዜ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል “ኪዳን” ወይም “ኑዛዜ” ሊል ይችላል፤ እዚህ ግን ከመጽሐፍ ቅዱሳዊው ዳራ ጋር ይበልጥ የሚስማማው “ኪዳን” ነው።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በጠጣችሁ ጊዜ ሁሉ።” የግሪኩ አገላለጽ ተደጋጋሚ አጋጣሚዎችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
