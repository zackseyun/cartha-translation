  choice: እንዲሁም
  rationale: ከቀደመው የእንጀራ ድርጊት ጋር ያለውን ተመሳሳይነትና የκαίን ተጨማሪ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ποτήριον
  choice: ጽዋ
  rationale: በዚህ የመጽሐፍ ቅዱስ አውድ የተለመደ፣ ክብር ያለውና የግሪኩን ቀላል ትርጉም የሚያስተላልፍ ቃል ነው።
- source_word: μετὰ τὸ δειπνῆσαι
  choice: ከእራት በኋላ
  rationale: የጊዜውን ግንኙነት በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λέγων
  choice: ጽዋውን አንሥቶ እንዲህ አለ
  rationale: ግሪኩ ‘እያለ’ የሚል ተሳቢ አንቀጽ ሲጠቀም፣ ከቀደመው ትይዩ አወቃቀር የሚገባውን ድርጊት አማርኛው ሙሉና ተፈጥሯዊ እንዲሆን ገልጦ ያቀርባል።
- source_word: ἡ καινὴ διαθήκη
  choice: አዲሱ ኪዳን
  rationale: διαθήκη በዚህ አውድ የኪዳን ግንኙነትን ያመለክታል፤ የነቢያትንና የኪዳን ደምን ዳራ ይጠብቃል።
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: በደሜ የሆነው
  rationale: ἐνን ከመጠን በላይ ሳይተረጉም በአማርኛ የተለመደውን ‘በደሜ’ አገላለጽ ይጠቀማል፤ የጽዋውና የኪዳኑን ቀጥተኛ ንግግር አይፈታም።
- source_word: τοῦτο ποιεῖτε
  choice: ይህን ማድረጋችሁን ቀጥሉ
  rationale: የአሁን ጊዜ ትእዛዙንና በተደጋጋሚ የመፈጸምን ሐሳብ በግልጽ ያሳያል።
- source_word: ὁσάκις ἐὰν πίνητε
  choice: በጠጣችሁት ቁጥር
  rationale: በተደጋጋሚ አጋጣሚዎች ‘በጠጣችሁ ጊዜ ሁሉ’ የሚለውን ኃይል በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ት’ የሚለው ቅጥያ ጽዋውን እንደሚያመለክት ግልጽ ያደርጋል።
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: እኔን ለማሰብ
  rationale: ἀνάμνησις የሚያመለክተውን ንቁ የማስታወስና የመዘከር ድርጊት ለዘመናዊ አንባቢ በቀጥታ ያቀርባል።
