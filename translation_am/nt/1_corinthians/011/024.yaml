base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: am
  text: አመስግኖ ቆርሶም እንዲህ አለ፦ “ይህ ለእናንተ[a][b] የሆነው ሥጋዬ ነው። እኔን ለማስታወስ ይህን ደጋግማችሁ አድርጉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እናንተ” ወይም “ለእናንተ ጥቅም።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “የተቆረሰው” የሚለውን ቃል ይጨምራሉ፦ “ይህ ለእናንተ የተቆረሰው ሥጋዬ ነው።”
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: አመስግኖም
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን ምስጋና ያሳያል፤ «አመስግኖም» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔκλασεν
  choice: ቆረሰው
  rationale: ግሱ መቁረስን ወይም መስበርን ያመለክታል፤ በአማርኛ እንጀራን «ቆረሰ» ማለት ተፈጥሯዊ ሲሆን፣ «-ው» የሚለው ተውላጠ ስም ከአውዱ የሚታወቀውን እንጀራ ይጠቁማል።
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: ይህ … ሥጋዬ ነው
  rationale: የግሪኩን ቀጥተኛ የአገናኝ ግስ አወቃቀር ይጠብቃል፤ «ይወክላል» ወይም «ምሳሌ ነው» የሚል ትርጓሜ አይጨምርም።
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: ለእናንተ የሆነው
  rationale: ὑπέρ ከዝርያ አገባብ ጋር ለሌሎች ጥቅም ወይም በእነርሱ ፈንታ መሆንን ሊያመለክት ይችላል፤ ይህ አተረጓጎም የጥቅም ኃይሉን ሳያጠፋ አንድን የሥርየት ንድፈ ሐሳብ አይወስንም።
- source_word: τοῦτο ποιεῖτε
  choice: ይህን ደጋግማችሁ አድርጉ
  rationale: የአሁን ጊዜ ትእዛዛዊ ግሱ በዚህ አውድ ተደጋጋሚ ልማድን ይደግፋል፤ «ደጋግማችሁ» ይህን ቀጣይነት በግልጽ ያሳያል።
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: እኔን ለማስታወስ
  rationale: ἀνάμνησις ንቁ የማስታወስ ወይም የመዘከር ተግባርን ያመለክታል፤ የተመረጠው ሐረግ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: «ይህ ሥጋዬ ነው» የሚለው በጌታ እራት አውድ ያለው ትርጉም
  choice: የአገናኝ ግሱን አነጋገር «ይህ … ሥጋዬ ነው» በማለት ቀጥታ መተርጎም
  alternative: «ይህ ሥጋዬን ይወክላል» ብሎ ምሳሌያዊ ትርጉምን መወሰን፣ ወይም የመገኘቱን ሁኔታ በተጨማሪ ቃላት መግለጽ
  rationale: ግሪኩ የክርስቶስ መገኘት እንዴት እንደሆነ ተጨማሪ ማብራሪያ አይሰጥም፤ ቀጥተኛው ትርጉም የኋለኞቹን የእምነት ክርክሮች ሳይፈታ የጽሑፉን ውጥረት ይጠብቃል።
- issue: ὑπὲρ ὑμῶν የሚለው ሐረግ ኃይል
  choice: «ለእናንተ የሆነው»
  alternative: «በእናንተ ፈንታ» ወይም «ስለ እናንተ»
  rationale: ሐረጉ ለተቀባዮቹ ጥቅም ወይም በእነርሱ ምክንያት መሆንን ያሳያል፤ የተመረጠው አተረጓጎም ግሪኩ ከሚናገረው በላይ የተወሰነ የሥርየት ትምህርት አያስገባም።
