  alternative: ‘ለአሥራ ሁለቱ’ ብሎ መወሰን፣ ወይም ያዕቆብን በግልጽ በሐዋርያቱ ውስጥ ማካተት ወይም ማስወጣት
  rationale: ግሪኩ የቡድኑን ትክክለኛ አባላት አይገልጽም። ትርጉሙ ጳውሎስ ባስቀመጠው መሠረት ለያዕቆብ የሆነውን መታየትና ቀጥሎ ለ‘ሐዋርያት ሁሉ’ የሆነውን መታየት ሳያስማማ ወይም ሳይገድብ ይጠብቃል።
