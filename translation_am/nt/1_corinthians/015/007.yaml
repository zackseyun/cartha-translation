lexical_decisions:
- source_word: ἔπειτα
  choice: ከዚያም
  rationale: የትንሣኤውን መገለጦች ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὤφθη
  choice: ታየ
  rationale: የὁράω የተገብሮ ቅርጽ ቢሆንም፣ በትንሣኤ መገለጥ አውድ ‘ታየ’ የሚለው ተፈጥሯዊ ሲሆን የመታየቱን ክስተት ይጠብቃል።
- source_word: Ἰακώβῳ
  choice: ለያዕቆብ
  rationale: የግሪኩን ዳቲቭ በ‘ለ-’ መስተዋድድ በቀጥታ ያስተላልፋል፤ ያዕቆብም በአማርኛ የተለመደው የስሙ ቅርጽ ነው።
- source_word: εἶτα
  choice: ቀጥሎም
  rationale: በዝርዝሩ ውስጥ ያለውን ቀጣይ ደረጃ ግልጽ እና ተፈጥሯዊ በሆነ አማርኛ ያመለክታል።
- source_word: ἀποστόλοις
  choice: ለሐዋርያት
  rationale: በዚህ አውድ ቃሉ አጠቃላይ መልእክተኞችን ሳይሆን የታወቁ የተላኩ ምስክሮችን ያመለክታል፤ ‘ሐዋርያት’ የተመሰረተውን የአማርኛ ቃል ይጠብቃል።
- source_word: πᾶσιν
