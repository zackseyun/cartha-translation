  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: am
  text: እኔ ከሐዋርያት ሁሉ ዝቅተኛው ነኝና፤ ሐዋርያ ተብዬ ልጠራ የማይገባኝ[a] ነኝ፤ ምክንያቱም የእግዚአብሔርን ቤተ ክርስቲያን አሳድጄ ስለነበር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሐዋርያ ተብዬ ልጠራ ብቁ ወይም በቂ ያልሆንኩ።”
    reason: የግሪኩ ἱκανός ቃል፣ ‘የሚገባ’ ከሚለው ትርጉም በተጨማሪ፣ ‘ብቁ’ ወይም ‘በቂ’ የሚል ፍቺ ሊኖረው ይችላል።
lexical_decisions:
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλάχιστος
  choice: ከሐዋርያት ሁሉ ታናሹ
  rationale: አካላዊ መጠንን ሳይሆን ጳውሎስ ስለራሱ የገለጠውን ዝቅተኛ ደረጃና ትሕትና ያስተላልፋል።
- source_word: ἀπόστολος / ἀποστόλων
  choice: ሐዋርያ / ሐዋርያት
  rationale: በዚህ አውድ ቃሉ ተራ መልእክተኛን ሳይሆን የታወቀውን የሐዋርያነት ማዕረግና ቡድን ያመለክታል።
- source_word: ἱκανός
  choice: የማይገባኝ
  rationale: ጳውሎስ ቀድሞ ቤተ ክርስቲያንን በማሳደዱ ምክንያት ለሐዋርያነት ስም የማይገባ መሆኑን በትሕትና መግለጹን ያሳያል፤ የብቃት ትርጉሙ በማስታወሻ ተጠብቋል።
- source_word: καλεῖσθαι
  choice: ተብዬ ልጠራ
  rationale: የግሪኩን ተገብሮአዊ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ይወክላል።
- source_word: διότι
  choice: ምክንያቱም
  rationale: ጳውሎስ ራሱን ለሐዋርያነት የማይገባ አድርጎ የቆጠረበትን ግልጽ ምክንያት ያስገባል።
- source_word: ἐδίωξα
  choice: አሳድጄአለሁ
  rationale: በአማኞች ላይ ያደረገውን ጠላትነትና ስደት በትክክል ያሳያል።
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: የእግዚአብሔርን ቤተ ክርስቲያን
  rationale: የእግዚአብሔር የሆነውን የአማኞች ማኅበረሰብ በአማርኛ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይገልጣል።
- source_word: ὃς
  choice: የማይገባኝ ነኝ
  rationale: አንጻራዊውን ሐረግ ቃል በቃል ሳያደርግ ከተናጋሪው ጋር በግልጽ ያያይዛል።
theological_decisions:
- issue: ጳውሎስ ስለ ሐዋርያነቱ የተናገረው ነገር
  choice: ጳውሎስ ራሱን በእውነት ከሐዋርያት መካከል ያካትታል፤ ነገር ግን ቀድሞ ስለፈጸመው ስደት ይህን ስም ሊሸከም እንደማይገባው በትሕትና ይናገራል።
  alternative: ጳውሎስ ሐዋርያነቱን ፈጽሞ ይክዳል፤ ወይም ስለ ማኅበራዊ ደረጃው ብቻ ይናገራል።
  rationale: «ከሐዋርያት ሁሉ ታናሹ» ማለቱ በቡድኑ ውስጥ መካተቱን ያረጋግጣል፤ «ልጠራ የማይገባኝ» ማለቱ ደግሞ ከቀድሞ ስደቱ የመነጨውን ትሕትና ያሳያል። ትርጉሙ ሁለቱንም ሳያጠፋ ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ቤተ ክርስቲያን» እና «ሐዋርያ» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሆነው ሳለ፣ የአረፍተ ነገሩ አወቃቀር ቀላልና ወቅታዊ ነው።
