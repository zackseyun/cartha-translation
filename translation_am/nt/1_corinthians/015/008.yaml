  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: am
  text: ከሁሉ በኋላም፣ እንደ ያለጊዜው ተወለደ ሰው ለሆነኝ[a]፣ ለእኔም ታየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «እንደ ጨነገፈ ፅንስ» ወይም «እንደ ተጨናገፈ ፅንስ» ሊተረጎም ይችላል። ጳውሎስ ራሱን ለማሳነስ ኃይለኛ ምሳሌ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: ከሁሉም በመጨረሻ
  rationale: አገላለጹ ቀደም ሲል የተጠቀሱትን የትንሣኤውን ምስክሮች ተከታታይነት ያጠቃልላል፤ δὲ እዚህ ላይ ጠንካራ ተቃርኖ ሳይሆን የትረካውን ቀጣይነት ያሳያል።
- source_word: ὡσπερεὶ
  choice: እንደ
  rationale: የንጽጽሩን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃሉ ያለውን ግምታዊ ለስላሳነት በአውዱ ውስጥ ይጠብቃል።
- source_word: τῷ ἐκτρώματι
  choice: ያለጊዜው እንደ ተወለደ ሰው
  rationale: የጳውሎስን ከመደበኛው ጊዜና ሁኔታ ውጭ የመሆን ኃይለኛ ራስን ዝቅ የማድረግ ምሳሌ በሚነበብ ዘመናዊ አማርኛ ያቀርባል፤ ይበልጥ ቀጥተኛው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ὤφθη
  choice: ታየ
  rationale: በትንሣኤ መገለጥ አውድ የግሪኩን የተገለጠ/ታየ ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κἀμοί
  choice: ለእኔም
  rationale: καί እና ἐμοί የተዋሐዱበትን ቅርጽ እና ጳውሎስ በምስክሮቹ ተከታታይነት ውስጥ መጨመሩን ይጠብቃል።
theological_decisions:
- issue: ἐκτρώματι የሚለውን የጳውሎስ ራስን ዝቅ የማድረግ ምሳሌ መተርጎም
  choice: በዋናው ጽሑፍ «ያለጊዜው እንደ ተወለደ ሰው» ብሎ ማቅረብ፣ ይበልጥ ቀጥተኛውን አማራጭ በማስታወሻ መግለጽ
  alternative: «እንደ ጨነገፈ ፅንስ» ወይም «እንደ ተጨናገፈው»
  rationale: ግሪኩ እጅግ ጠንካራና አሳናሽ ምሳሌ ነው፤ ዋናው ጽሑፍ ያልተለመደውንና ያለጊዜው የሆነውን ሁኔታ ያቆያል፣ ማስታወሻውም የቃሉን ቀጥተኛና አስደንጋጭ ኃይል ሳይሰውር ያሳያል። ምሳሌው ለምን እንደተጠቀሰ የተለየ የእምነት ትርጓሜ አይጫንበትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። «ታየ» የሚለው አጭር የመጽሐፍ ቅዱስ አገላለጽ ተጠብቋል፤ የἐκτρώματι አስደንጋጭ ቀጥተኛ ስሜት በማስታወሻ ተገልጧል።
