language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: am
  text: ምክንያቱም ሙታን የማይነሡ ከሆነ፣ መሲሑም[a] እንኳ አልተነሣም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ክርስቶስ»። የግሪኩ ማዕረግ Χριστός «መሲሕ» ተብሎ ሊተረጎም፣ ወይም ከጥንት ጀምሮ በተለመደው አጠራር «ክርስቶስ» ተብሎ ሊቀርብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: የማይነሡ ከሆነ … አልተነሣምና
  rationale: የεἰን ሁኔታዊ አሳብ በ«ከሆነ»፣ የγάρን ምክንያታዊና አብራሪ ኃይል ደግሞ በዓረፍተ ነገሩ መጨረሻ ባለው «-ና» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: νεκροὶ
  choice: ሙታን
  rationale: በስምነት የተጠቀመውን ብዙ ቁጥር ቅጽ በአጭርና በተለመደ አማርኛ ይወክላል።
- source_word: ἐγείρονται
  choice: የማይነሡ
  rationale: በትንሣኤ አውድ ያለውን የአሁን ጊዜ አጠቃላይ አባባል ይጠብቃል፤ የአማርኛው «መነሣት» በዚህ አውድ የመነሣትንም ሆነ ከሞት የመነሣትን ትርጉም ተፈጥሯዊ ሆኖ ይሸከማል።
- source_word: οὐδὲ
  choice: እንኳ … አል…ም
  rationale: የግሪኩን አጽንዖት—«እርሱ እንኳ» የሚለውን ውጤት—ከቀላል «ደግሞ» ይልቅ በግልጽ ያሳያል።
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: Χριστός በመሠረቱ «የተቀባው» የሚለው ማዕረግ ስለሆነ፣ «መሲሑ» የማዕረጉን ኃይል በግልጽ ይጠብቃል። የታወቀውን ሰው ስለሚያመለክት «-ው» የተወሰነነት ቅጥያ ተጨምሯል።
- source_word: ἐγήγερται
  choice: አልተነሣም
  rationale: የተፈጸመና ውጤቱ የሚቀጥል ድርጊት መሆኑን በአማርኛ ፍጹም አሉታዊ ቅርጽ ያሳያል።
theological_decisions:
- issue: በትንሣኤ ክርክር ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: አውዱ Χριστόςን እንደ ማዕረግ እንዲሰማ ይፈቅዳል፤ «መሲሑ» ይህን ትርጉም ግልጽ ሲያደርግ፣ በጥንት የተለመደው «ክርስቶስ» ደግሞ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አልተነሣምና» የጳውሎስን ቀጣይ ምክንያታዊ ክርክር በተፈጥሯዊ የአማርኛ አወቃቀር ያገናኛል።
