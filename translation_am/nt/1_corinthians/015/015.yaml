  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: am
  text: ከዚህም በላይ፣ እግዚአብሔር መሲሑን እንዳስነሣ በእግዚአብሔር ላይ ስለመሰከርን፣ ስለ እግዚአብሔር ሐሰተኛ ምስክሮች[a] ሆነን እንገኛለን፤ ሙታን በእርግጥ የማይነሡ ከሆነ፣ እርሱ መሲሑን አላስነሣውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር ሐሰተኛ ምስክሮች።” በግሪኩ “የእግዚአብሔር” የሚለው አገላለጽ በቃል በቃል እንዲህ ቢሆንም፣ እግዚአብሔርን የሚመለከት ምስክርነትን ማለት ይችላል። ቀጥሎ ያለው “በእግዚአብሔር ላይ” የሚለው አገላለጽ የዚህን ሐሰተኛ ምስክርነት ክብደት ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: ሆነን እንገኛለን
  rationale: የአሁን ጊዜውን ተደራጊ አገላለጽና ‘እንደዚህ መሆናችን ይገለጣል’ የሚለውን ውጤታዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δὲ καὶ
  choice: እንግዲህ … ሆነን
  rationale: ከቀደመው ክርክር የሚወጣውን ድምዳሜ ያሳያል፤ καὶ የሚሰጠው አጽንዖት በአረፍተ ነገሩ አጠቃላይ አወቃቀር ተጠብቋል።
- source_word: ψευδομάρτυρες
  choice: ሐሰተኛ ምስክሮች
  rationale: የሐሰት ምስክርነትን በግልጽና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት ቅርጽ ጠብቆ የምስክርነቱ ማጣቀሻ እግዚአብሔር መሆኑን ያሳያል፤ ያለው ትርጉማዊ ጥርጣሬ በማስታወሻ ተገልጧል።
- source_word: ἐμαρτυρήσαμεν
  choice: መሰከርን
  rationale: አስቀድሞ የተሰጠውን ሐዋርያዊ ምስክርነትና የፍርድ ቤት ቃናውን ይጠብቃል።
- source_word: κατὰ τοῦ θεοῦ
  choice: በእግዚአብሔር ላይ
  rationale: κατά ከዝርያ ቅጽ ጋር ያለውን ጠንካራ ‘በ…ላይ/በ…ላይ ተቃርኖ’ ስሜት ይጠብቃል፤ በዚህ የሐሳብ ሙከራ መሠረት ሐዋርያት እግዚአብሔር ያላደረገውን እንዳደረገ አድርገው ይመሰክሩ ነበር።
- source_word: ἤγειρεν
  choice: እንዳስነሣው
  rationale: እግዚአብሔር መሲሑን ከሙታን እንዳስነሣ የሚገልጸውን አድራጊ ተግባር ያስቀምጣል።
- source_word: τὸν Χριστόν
  choice: መሲሕን
  rationale: Χριστός በዚህ አውድ እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚያሳየው ‘መሲሕ’ ተመርጧል።
- source_word: ὃν οὐκ ἤγειρεν
  choice: ያላስነሣውን
  rationale: ከቀደመው ግስ ጋር ያለውን የንግግር ተመሳሳይነትና አጽንዖት ይጠብቃል።
- source_word: εἴπερ ἄρα
  choice: በእርግጥ … ከሆነ
  rationale: ለክርክሩ ሲባል የተቀመጠውን ቅድመ ሁኔታና የ‘በእውነት ከሆነ’ አጽንዖት ያስተላልፋል።
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: ሙታን የማይነሡ
  rationale: ስለ ሙታን በአጠቃላይ የተነሣውን ክርክር ይገልጻል፤ የተደራጊው አቅጣጫ በአማርኛው አውድ በተፈጥሯዊ ሁኔታ ተጠብቋል።
theological_decisions:
- issue: የ Χριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ ከግል ስም ይልቅ እንደ ማዕረግ ይሠራል፤ ‘መሲሕ’ የቅቡዕነቱን ማዕረግ በግልጽ ያሳያል።
- issue: የ κατὰ τοῦ θεοῦ ኃይል
