  alternative: ስለ እግዚአብሔር
  rationale: κατά ከዝርያ ቅጽ ጋር በተለምዶ ‘በ…ላይ/በ…ላይ ተቃርኖ’ የሚል ኃይል አለው። ይህ የጳውሎስን የሐሳብ ሙከራ ክብደት ይጠብቃል፤ ሆኖም ‘ስለ’ የሚለው አማራጭ ሊታሰብ ይችላል።
- issue: የ τοῦ θεοῦ ዝምድና
  choice: የእግዚአብሔር ሐሰተኛ ምስክሮች
  alternative: ስለ እግዚአብሔር ሐሰት የመሰከሩ
  rationale: መደበኛው ትርጉም የግሪኩን ጄኒቲቭ ቅርጽ ይጠብቃል፤ ነገር ግን የማጣቀሻ/የተሳቢ ጄኒቲቭ ሆኖ ‘እግዚአብሔርን በሚመለከት’ ማለት እንደሚችል በማስታወሻ ተጠቅሷል።
