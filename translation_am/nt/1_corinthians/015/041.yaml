  text: የፀሐይ ክብር[a] አንድ ነው፤ የጨረቃም ክብር ሌላ ነው፤ የከዋክብትም ክብር ሌላ ነው፤ ኮከብ ከኮከብ በክብር ይለያልና።
  philosophy: optimal-equivalence
  footnotes:
