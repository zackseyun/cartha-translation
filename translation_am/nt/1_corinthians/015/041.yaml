    text: ወይም፣ በቁጥሩ ሁሉ «ድምቀት» ወይም «ብርሃን»። የግሪኩ δόξα በዚህ ስፍራ የሚታይ ድምቀትን ሊያመለክት ይችላል፤ «ክብር» ግን ጳውሎስ በዙሪያው ባለው ክርክር የደጋገመውን ቃል ይጠብቃል።
