  rationale: በዚህ ስፍራ ቃሉ የሚታይ ድምቀትን ወይም ብርሃንን ያመለክታል፤ «ክብር» ግን ጳውሎስ በትንሣኤ ክርክሩ ውስጥ ከሚጠቀምበት ተደጋጋሚ ቃል ጋር ያለውን ግንኙነት ይጠብቃል።
