  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: am
  text: ወንድሞች[a] ሆይ፣ ለእናንተ የሰበክሁትን፣ እናንተም የተቀበላችሁትንና በእርሱ የቆማችሁበትን የምሥራች አሳውቃችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች ሆይ።” የግሪኩ ቃል “ወንድሞች” ይላል፤ ብዙ ጊዜም ተባዕታይ ቅርጹን ተጠቅሞ መላውን የእምነት ማኅበር ይጠራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: አሳውቃችኋለሁ
  rationale: የአሁን ጊዜው ግስ ‘አሳውቃለሁ/እገልጻለሁ’ የሚለውን ቀጥተኛ ፍቺ ይሰጣል፤ ‘አስታውሳችኋለሁ’ የሚለውን ሐሳብ ሳያስገባ የጳውሎስን ዳግም ማቅረብ ያሳያል።
- source_word: δὲ
  choice: በተፈጥሯዊው የአማርኛ አወቃቀር በግልጽ አልተተረጎመም
  rationale: δέ እዚህ ቀላል የንግግር ሽግግር እንጂ ጠንካራ ንጽጽር አይደለም፤ እንደ ‘አሁን’ ቢተረጎም በግሪኩ የሌለ ጊዜያዊ አጽንዖት ሊፈጥር ይችላል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ተባዕታይ የጥሪ ቅርጽ በቀጥታ ይጠብቃል፤ በጳውሎስ አጠቃቀም መላውን የእምነት ማኅበር ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
- source_word: τὸ εὐαγγέλιον
  choice: የምሥራች
  rationale: ‘መልካም ዜና’ የሚለውን ግልጽ ፍቺ በተለመደና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: εὐηγγελισάμην
  choice: የሰበክሁትን
  rationale: መልካሙን ዜና በይፋ ማወጅን የሚገልጽ፣ በአማርኛ የመጽሐፍ ቅዱስ ንግግርም የታወቀ ተፈጥሯዊ ግስ ነው።
- source_word: παρελάβετε
  choice: የተቀበላችሁትን
  rationale: መልእክቱን ወይም የተላለፈውን ትምህርት መቀበልን ያሳያል፤ ‘ያመናችሁበትን’ ከሚለው ይልቅ የምንጩን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἐν ᾧ
  choice: በእርሱም
  rationale: የምሥራቹን እንደ መቆሚያ ወይም የጸና ሁኔታ ክልል ያሳያል፤ የቁጥር 2ን ‘በእርሱ ትድናላችሁ’ ሐሳብ ቀድሞ አያስገባም።
- source_word: ἑστήκατε
  choice: ጸንታችሁ የቆማችሁትን
  rationale: የፍጹም ጊዜውን፣ ከቀደመ ድርጊት የተገኘና አሁን የቀጠለ የመቆም ሁኔታ፣ በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
