  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የዝምድና ሐረግ በአማርኛ ተፈጥሯዊ ቅደም ተከተል ቀርቧል፤ የማስታወሻ ምልክቱ ከ‘ወንድሞች’ ጉዳይ ጋር እንዲታወቅ በቁጥሩ መጨረሻ ተቀምጧል።
