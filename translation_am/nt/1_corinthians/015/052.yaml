  rationale: የግሪኩን ግልጽ የመጀመሪያ ሰው ብዙ ቁጥር ይጠብቃል፤ በዚህ ቁጥር ያልተገለጸውን ‘በሕይወት የምንቀረው’ የሚል ማብራሪያ አይጨምርም።
