review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rapidity, final trumpet, resurrection of the dead as imperishable, and the first-person plural transformation. However, it adds “ድምፅ” (‘sound’) to the phrase ‘at the last trumpet,’ although σάλπιγξ itself—not its sound—is the noun in the source. The opening also unnecessarily supplies ‘ይሆናል’ (‘it will happen’), where Greek gives a sequence of temporal phrases.
  naturalness: “ዐይን በሚጨረግድበት ጊዜ” is understandable but less idiomatic for the fixed image of an eye’s rapid flicker/blink. “በዐይን ቅጽበት” is concise, natural, and retains the image. Removing the supplied finite verb produces a controlled literary ellipsis that suits the source and biblical register.
  terminology: “ቅጽበት,” “መለከት,” “ሙታን,” “የማይበሰብሱ,” and “እኛም እንለወጣለን” are appropriate modern-standard Amharic renderings. “መለከት ይነፋል” is an established and natural rendering of the trumpet’s sounding in this register.
  issues:
  - severity: medium
    issue: Addition of “ድምፅ” in “በመጨረሻው መለከት ድምፅ.”
    rationale: The Greek says “at the last trumpet” (ἐν τῇ ἐσχάτῃ σάλπιγγι), not explicitly ‘at the sound of the last trumpet.’ The addition is not needed for Amharic clarity and slightly narrows the wording.
  - severity: low
    issue: Supplied “ይሆናል” in the opening temporal sequence.
    rationale: The Greek intentionally presents adverbial phrases before explaining the event. Amharic can preserve this compact rhetorical sequence without adding an unspecified event.
  - severity: low
    issue: “ዐይን በሚጨረግድበት ጊዜ” is less idiomatic than the compact eye-instant expression.
    rationale: The source’s image is a very rapid movement/flicker of the eye. “በዐይን ቅጽበት” naturally communicates this without over-specifying eyelid closure.
  revised_text: በቅጽበት፣[a] በዐይን ቅጽበት፣ በመጨረሻው መለከት። መለከት ይነፋልና፤ ሙታንም የማይበሰብሱ ሆነው ይነሣሉ፣ እኛም እንለወጣለን።
