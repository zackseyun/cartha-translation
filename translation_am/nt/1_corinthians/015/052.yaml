  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: am
  text: በቅጽበት፣[a] በዐይን ቅጽበት፣ በመጨረሻው መለከት። መለከት ይነፋልና፤ ሙታንም የማይበሰብሱ ሆነው ይነሣሉ፣ እኛም እንለወጣለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በማይከፈል ቅጽበት።” የግሪኩ አገላለጽ እጅግ ፈጣን መሆንን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: በቅጽበት
  rationale: ቃሉ በቀጥታ የማይከፈልን ነገር ቢያመለክትም፣ በዚህ ዐውድ እጅግ አጭር የጊዜ ክፍልን ያመለክታል፤ ‘በቅጽበት’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: ዐይን በሚጨረግድበት ጊዜ
  rationale: ሐረጉ የዐይንን ፈጣን እንቅስቃሴ በማሳየት ድንገተኛነትንና ፍጥነትን ይገልጣል።
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: በመጨረሻው መለከት ድምፅ
  rationale: ἐν እዚህ የጊዜ ወይም የሁኔታ አገናኝ ነው፤ ‘ድምፅ’ መጨመሩ በአማርኛ ሐረጉን ግልጽ ያደርጋል እንጂ የፍጻሜ ዘመን ሥርዓትን አይጨምርም።
- source_word: σαλπίσει
  choice: መለከቱ ይነፋል
  rationale: ግሱ መለከት መንፋትን ያመለክታል፤ ከቀደመው σάλπιγγι ጋር ተያይዞ የተወሰነውን መለከት ያሳያል።
- source_word: οἱ νεκροὶ
  choice: ሙታን
  rationale: ስማዊ አጠቃቀሙ የሞቱ ሰዎችን በጋራ ያመለክታል፤ ‘ሙታን’ ቀጥተኛና የተለመደ ነው።
- source_word: ἐγερθήσονται
  choice: ይነሣሉ
  rationale: በትንሣኤ ዐውድ ያለውን መነሣት በተፈጥሯዊ የአማርኛ መጽሐፍ ቅዱሳዊ አገላለጽ ያስተላልፋል፤ የግሪኩ ተደራጊ ቅርጽ በአማርኛ አውድ በዚህ መንገድ ይገለጣል።
- source_word: ἄφθαρτοι
  choice: የማይበሰብሱ
  rationale: ቃሉ ከመበስበስና ከመጥፋት ነፃ መሆንን ያመለክታል፤ ይህ ምርጫ በዐውዱ ያለውን አካላዊ የትንሣኤ ንጽጽር በግልጽ ያቀርባል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪክ ግልጽ የሆነውን አጽንዖትና ከ‘ሙታን’ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ἀλλαγησόμεθα
  choice: እንለወጣለን
  rationale: የወደፊት ተደራጊውን ‘እንለወጣለን’ በሚል ቀጥተኛና ተፈጥሯዊ አማርኛ ያስተላልፋል።
