base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: am
  text: እያንዳንዱ ግን በራሱ ቅደም ተከተል፤ በኩራት መሲሑ[a]፣ ከዚያም በመምጣቱ[b] ጊዜ የመሲሑ የሆኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ክርስቶስ”። የግሪኩ Χριστός የሚለው ማዕረግ “የተቀባው” ማለት ነው።
    reason: alternative_reading
  - marker: b
    text: “መገኘት” ወይም “መድረስ” ተብሎም ሊተረጎም ይችላል፤ በዚህ ዐውድ ግን የወደፊቱን መምጣቱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: እያንዳንዱ
  rationale: ከቀደመው ዐውድ ጋር በመያያዝ በትንሣኤው ተራ ውስጥ ያለውን እያንዳንዱን ወገን በአከፋፋይ አገላለጽ ያመለክታል።
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: በየራሱ ተራ
  rationale: τάγμα ሥርዓትን፣ ደረጃን ወይም ቅደም ተከተልን ሊያመለክት ይችላል፤ እዚህ የትንሣኤው ቅደም ተከተል ስለሆነ ‘ተራ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀπαρχὴ
  choice: በኩራቱ
  rationale: ይህ ቃል ከመከር መጀመሪያ ለእግዚአብሔር የሚቀርበውን ድርሻ የሚያሳስብ ሲሆን፣ ቀጥሎ ስለሚመጣውም ዋስትና ያመለክታል፤ ‘በኩራት’ ይህን መጽሐፍ ቅዱሳዊ ምስል ይጠብቃል።
- source_word: Χριστός
  choice: መሲሑ
  rationale: በዚህ ዐውድ Χριστός እንደ ማዕረግ—‘የተቀባው’—ጎልቶ ስለሚሠራ፣ ‘መሲሑ’ የማዕረጉን ኃይል ይጠብቃል።
- source_word: οἱ τοῦ Χριστοῦ
  choice: የመሲሑ የሆኑት
  rationale: የግሪኩ የባለቤትነት አገላለጽ ከመሲሑ ጋር ያላቸውን አባልነትና ባለቤትነት በግልጽ ያሳያል።
- source_word: παρουσίᾳ
  choice: በመምጣቱ ጊዜ
  rationale: παρουσία መገኘትን ወይም መድረስንም ሊያመለክት ቢችል፣ በዚህ የወደፊት ትንሣኤ ዐውድ ‘በመምጣቱ ጊዜ’ የታሰበውን ክስተት በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: Χριστός በዚህ ቁጥር እንደ ማዕረግ ወይም እንደ ስም መተርጎሙ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ጳውሎስ መሲሑንና የእርሱ የሆኑትን በትንሣኤ ቅደም ተከተል ውስጥ ስለሚያነጻጽር፣ የ‘ተቀባው’ ማዕረጋዊ ትርጉም ጎልቶ ይታያል። ሌላው የተለመደ አጠራር በማስታወሻ ቀርቧል።
- issue: παρουσίαን በልዩ የመጨረሻ ዘመን ቴክኒካዊ ቃል መግለጽ ወይም ሰፊ የቃሉን ክልል መጠበቅ
  choice: በመምጣቱ ጊዜ
  alternative: በመገኘቱ ጊዜ / በመድረሱ ጊዜ
  rationale: ዐውዱ የመሲሑን የወደፊት መምጣት ያመለክታል፤ የበለጠ ዝርዝር የእምነት ሥርዓት ሳይጨመር ‘መምጣት’ ይህን በግልጽ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር ቅደም ተከተላዊ አወቃቀር በሰረዝ ነጥብና በነጠላ ሰረዝ ተጠብቋል፤ የመከር ምስሉም ‘በኩራት’ በሚለው ተለምዷዊ መጽሐፍ ቅዱሳዊ ቃል ተይዟል።
