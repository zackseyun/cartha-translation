review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the distributive resurrection sequence, the Messiah as the firstfruits, those belonging to him, and his coming. However, በኩራቱ is a possessive form (“his firstfruits”) not present in ἀπαρχὴ, which is an appositional nominative identifying the Messiah as firstfruits.
  naturalness: The proposed revision retains the concise, deliberately elliptical structure of the Greek while using natural modern standard Amharic. በራሱ ቅደም ተከተል is clearer and more idiomatic than በየራሱ ተራ in this context.
  terminology: መሲሑ appropriately renders Χριστός as a title, በኩራት preserves the biblical firstfruits image without adding possession, and በመምጣቱ ጊዜ is an appropriate contextual rendering of παρουσίᾳ. Footnote anchors remain correctly attached to these terms.
  issues:
  - severity: medium
    issue: በኩራቱ introduces an unsupported possessive suffix.
    rationale: The Greek reads ἀπαρχὴ Χριστός (“firstfruits, Messiah/Christ”), with ἀπαρχὴ in apposition to Χριστός. It does not say “his firstfruits.” Removing the suffix preserves both the grammar and the intended harvest metaphor.
  - severity: low
    issue: በየራሱ ተራ is less clear than a sequence-focused expression.
    rationale: τάγμα here concerns ordered sequence. በራሱ ቅደም ተከተል more directly conveys this sense without importing a military rank.
  revised_text: እያንዳንዱ ግን በራሱ ቅደም ተከተል፤ በኩራት መሲሑ[a]፣ ከዚያም በመምጣቱ[b] ጊዜ የመሲሑ የሆኑት።
