  rationale: ጳውሎስንና አብረውት ያሉትን በቀደመው የክርክር ሐሳብ ላይ የሚጨምረውን አገናኝ ትርጉም ያሳያል።
- source_word: ἡμεῖς
  choice: እኛስ
  rationale: ግልጽ የሆነውን ተውላጠ ስም ይጠብቃል፤ ‘-ስ’ ደግሞ በአውዱ ያለውን ንጽጽራዊ አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κινδυνεύομεν
  choice: ለአደጋ እንጋለጣለን
  rationale: ግሱ በአደጋ ውስጥ መሆንን ወይም ለአደጋ መጋለጥን ያመለክታል። ይህ አተረጓጎም ‘ሕይወታችንን እናውላለን’ ከሚል ይበልጥ የግሪኩን የትርጉም ስፋት ይጠብቃል።
- source_word: πᾶσαν ὥραν
  choice: በየሰዓቱ
  rationale: ቃል በቃል ያለውን ‘በየሰዓቱ’ የሚል ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል፤ በአውዱም ቀጣይነት ያለውን ለአደጋ መጋለጥ ያመለክታል።
theological_decisions:
- issue: በጳውሎስ የትንሣኤ ክርክር ውስጥ ያለው የንግግር ጥያቄ ኃይል
  choice: ከሙታን ትንሣኤ ከሌለ ሐዋርያት ለአደጋ መጋለጣቸው ምንም ምክንያት እንደሌለው የሚያጎላ የንግግር ጥያቄ ሆኖ ተተርጉሟል።
  alternative: ‘ምንድን ነው እኛም በየሰዓቱ ለአደጋ የምንጋለጠው?’ ብሎ ይበልጥ ቃል በቃል መተርጎም።
  rationale: የግሪኩ አገባብና የቅርብ አውዱ ቀላል የመረጃ ጥያቄን ሳይሆን የክርክር ጥያቄን ይደግፋሉ። ትርጉሙ ተጨማሪ የአስተምህሮ ድምዳሜ ሳያስገባ ይህን ውጥረት ይጠብቃል።
