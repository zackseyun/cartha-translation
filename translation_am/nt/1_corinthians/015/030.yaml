    text: ወይም ይበልጥ ቃል በቃል፣ “ምንድን ነው እኛም በየሰዓቱ ለአደጋ የምንጋለጠው?” በአውዱ ያለው ትርጉም፣ “እኛስ ደግሞ ለምን በየሰዓቱ ለአደጋ እንጋለጣለን?” የሚል ነው።
