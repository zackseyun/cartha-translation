lexical_decisions:
- source_word: τί
  choice: ለምን
  rationale: በዚህ የክርክር አውድ ጥያቄው ምክንያትን የሚጠይቅ ስለሆነ፣ ቀጥተኛውን ‘ምን’ ከማለት ይልቅ ‘ለምን’ የጥያቄውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ
