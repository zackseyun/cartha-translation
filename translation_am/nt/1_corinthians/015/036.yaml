review_pass:
  verdict: revise
  source_fidelity: The draft conveys the conditional relationship and preserves the agricultural image. However, its rendering of ἄφρων is unnecessarily periphrastic, and “ሕያው አይደረግም” is grammatically possible but unnatural for a seed in modern Amharic.
  naturalness: “አንተ አስተዋይነት የጎደለህ ሰው!” is cumbersome, since the explicit pronoun plus the long vocative produces an awkward address. “ሞኝ!” is the normal, direct modern-Amharic vocative and suitably reflects the sharp rebuke. “ሕይወት አያገኝም” is idiomatic and preserves the intended coming-to-life sense.
  terminology: Use “ሞኝ” for ἄφρων, with “ማስተዋል የሌለው ሰው” as a footnoted alternative. Retain “መዝራት” for σπείρω. The revised wording does not add theological explanation.
  issues:
  - severity: medium
    issue: The vocative is overly wordy and awkward.
    rationale: “አስተዋይነት የጎደለህ ሰው” is less natural than a direct vocative and weakens the rhetorical force of ἄφρων.
  - severity: medium
    issue: The rendering of ζῳοποιεῖται is unnatural in context.
    rationale: “ሕያው አይደረግም” is a literalized passive that does not read naturally of what is sown. “ሕይወት አያገኝም” communicates the seed's coming to life clearly, with the passive/life-giving nuance noted in a footnote.
  revised_text: ሞኝ![a] የምትዘራው ካልሞተ በቀር ሕይወት አያገኝም።[b]
