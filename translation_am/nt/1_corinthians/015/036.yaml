  rationale: ሁኔታዊውን ‘unless’ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀποθάνῃ
  choice: ካልሞተ
  rationale: በሁኔታዊው ሐረግ ውስጥ ቀላልና ትክክለኛ አገላለጽ ነው፤ ‘መጀመሪያ’ የሚል ያልተጻፈ ቃል አይጨምርም።
