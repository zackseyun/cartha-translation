  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: am
  text: የሞት መውጊያ ኃጢአት ነው፤ የኃጢአትም ኃይል[a] ሕግ[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ብርታት”፦ “የኃጢአት ብርታት ሕግ ነው።”
    reason: lexical_alternative
  - marker: b
    text: “ሕግ” በጳውሎስ ክርክር በተለይ የሙሴን ሕግ የሚያመለክት ይመስላል፤ ሆኖም አገላለጹ ሕግ ኃጢአትን በማጋለጥና በማባባስ ስለሚኖረው ሚና የሚገልጠውን ሰፊ ትርጉምም ይፈቅዳል።
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: መውጊያ
  rationale: ቃሉ ሹል መውጊያን ወይም መንደፊያን ሊያመለክት ይችላል፤ እዚህ ሞት ሰውን የሚጎዳበትን መሣሪያ በዘይቤ ስለሚገልጥ፣ “መውጊያ” ተፈጥሯዊና ከአውዱ ጋር የሚስማማ ነው።
- source_word: θανάτου
  choice: የሞት
  rationale: የግሪኩን የባለቤትነት/የግንኙነት አገላለጽ ቀጥታ ይጠብቃል፤ መውጊያው የሞት ነው።
- source_word: ἁμαρτία
  choice: ኃጢአት
  rationale: ነጠላ ቁጥሩን በመጠበቅ፣ ጳውሎስ ስለ ግለሰብ ኃጢአቶች ብቻ ሳይሆን ኃጢአትን እንደ ኃይል ወይም ገዢ መርህ መናገሩን ያሳያል።
- source_word: δύναμις
  choice: ኃይል
  rationale: ሕግ ለኃጢአት የሚሰጠውን አቅምና ተጽእኖ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ “ብርታት”ም የሚቻል አማራጭ ነው።
- source_word: νόμος
  choice: ሕግ
  rationale: የሙሴን ሕግ የሚያስታውሰውን የጳውሎስን አጠቃቀም ይጠብቃል፤ በተመሳሳይም አገላለጹን ከግሪኩ በላይ አጥብቦ አይወስነውም።
- source_word: δὲ
  choice: ፤ …ም
  rationale: ሁለቱ δὲ እዚህ ጠንካራ ተቃርኖን ሳይሆን ሐሳብን የሚያራምድና የሚያብራራ ግንኙነት ያመለክታሉ። የአማርኛው ሰሚኮሎንና “ም” ይህን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያሉ።
theological_decisions:
- issue: “ሕግ” ለኃጢአት ኃይል ነው የሚለው አገላለጽ የሚያመለክተው
  choice: “ሕግ” ተብሎ በአጠቃላይ ተተርጉሟል፤ በጳውሎስ አውድ የሙሴን ሕግ በተለይ ሊያመለክት ቢችልም ትርጉሙ ያንን ብቻ እንዲል አልተገደበም።
  alternative: “የሙሴ ሕግ” ብሎ በግልጽ መተርጎም፣ ወይም ሕግን እንደ አጠቃላይ መርህ ብቻ መውሰድ።
  rationale: የቅርብ አውዱ የሙሴን ሕግ በጠንካራ ሁኔታ ያስታውሳል፤ ሆኖም የግሪኩ አገላለጽ የሕግን ኃጢአትን የማጋለጥና የማባባስ ሚና በሰፊው እንዲያካትት ያስችላል። ትርጉሙ ይህን መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። “የሞት መውጊያ” የምንጩን ዘይቤ በአጭርና በተለመደ አገላለጽ ይጠብቃል።
