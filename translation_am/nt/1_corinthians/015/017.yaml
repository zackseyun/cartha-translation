id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: am
  text: ነገር ግን መሲሑ[a] ካልተነሣ፣ እምነታችሁ ከንቱ[b] ነው፤ አሁንም በኃጢአታችሁ ውስጥ ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።”
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ፍሬ ቢስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: የግሪኩን የቅቡዕነት ማዕረግ ትርጉም በግልጽ ያስተላልፋል፤ ዐውዱም መሲሐዊ ነው።
- source_word: ἐγήγερται
  choice: ካልተነሣ
  rationale: የትንሣኤው ክስተት እና አሁን ያለው ውጤት በተፈጥሯዊ አማርኛ ይገለጣሉ፤ በግሪኩ ያልተጠቀሰውን አድራጊ በግልጽ አይጨምርም።
- source_word: ματαία
  choice: ከንቱ
  rationale: በዚህ ዐውድ እምነቱ ውጤት አልባና ዓላማ ቢስ መሆኑን በአጭርና በተለመደ ቃል ይገልጣል።
- source_word: πίστις
  choice: እምነታችሁ
  rationale: እዚህ የቆሮንቶስ ሰዎችን የማመን ምላሽ ያመለክታል፤ የባሕርይ ታማኝነትን በዋናነት አያመለክትም።
- source_word: ἔτι
  choice: አሁንም
  rationale: ያ ሁኔታ እስከአሁን መቀጠሉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: በኃጢአታችሁ ውስጥ
  rationale: የግሪኩን ምሳሌያዊ አገላለጽ ሳያስወግድ በኃጢአት ሁኔታና ተጽእኖ ሥር መቆየትን ይገልጣል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ክርክር ጋር ያለውን ተቃርኖ በግልጽ ያሳያል።
theological_decisions:
- issue: የትንሣኤው አገላለጽና አድራጊው
  choice: ካልተነሣ
  alternative: ካልተነሳም / ካልተነሣ ከሆነ
  rationale: አማርኛው የትንሣኤን እውነታ በተፈጥሯዊ ሁኔታ ይገልጣል፤ ግሪኩ አድራጊውን በግልጽ ስላልጠቀሰ ትርጉሙም እግዚአብሔርን በጽሑፉ ውስጥ አይጨምርም።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ሥነ መለኮታዊ ዐውድ Χριστός የተቀባውን ገዥ የሚያመለክት ማዕረግ በመሆኑ መሲሕ የሚለው ትርጉሙን በግልጽ ያቀርባል፤ ባህላዊው ቅርጽ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ከንቱ” የተለመደውን መጽሐፍ ቅዱሳዊ ክብር ሲጠብቅ በዚህ ዐውድ ውጤት አልባነትን ግልጽ ያደርጋል።
