id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: am
  text: ነገር ግን በጌታችን በኢየሱስ በመሲሑ በኩል ድሉን ለሚሰጠን ለእግዚአብሔር ምስጋና ይሁን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: ምስጋና ይሁን
  rationale: በዚህ የምስጋና አገላለጽ χάρις ‘ጸጋ’ ሳይሆን ለእግዚአብሔር የሚቀርብ ምስጋናን ያመለክታል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከሞትና ከድል ቀዳሚው ንግግር ወደ ምስጋና የሚደረገውን ረጋ ያለ ንጽጽር ያሳያል።
- source_word: τῷ διδόντι ἡμῖν
  choice: ለሚሰጠን
  rationale: የአሁን ጊዜው ተሳቢ አምላክን ድል እንደሚሰጠን ይገልጣል፤ ይህ ቅርጽ ቀጣይነትን ወይም አጠቃላይ እውነትን ሳይገድብ ያቀርባል።
- source_word: τὸ νῖκος
  choice: ድሉን
  rationale: ከዚህ በፊት ስለተገለጸው በሞት ላይ ያለ የተወሰነ ድል ስለሚያመለክት የወሰን ቅጥያው ተጠብቋል።
- source_word: διὰ
  choice: በኩል
  rationale: ከባለቤት አገባብ ጋር ያለው διά መንገድን ወይም አማካይነትን ያመለክታል።
- source_word: τοῦ κυρίου ἡμῶν
  choice: በጌታችን
  rationale: κύριος የክርስቶስ ማዕረግ ሆኖ ‘ጌታ’ ተብሎ ተተርጉሟል፤ ἡμῶν ደግሞ ‘-ችን’ በሚለው ባለቤትነት ቅጥያ ተገልጧል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሕ
  rationale: Ἰησοῦ የግል ስም ሆኖ በተለመደው መልኩ ተጽፏል፤ Χριστός ደግሞ ‘የተቀባው’ የሚለውን ማዕረግ በግልጽ የሚያስተላልፈው ‘መሲሕ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን እንደ ማዕረግ ወይም እንደ ስም ክፍል ማቅረብ
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: በጳውሎስ አጠቃቀም ይህ ቃል ስምን የሚመስል የተለመደ ቅንብር ቢሆንም፣ ‘የተቀባው’ የሚለው የማዕረግ ትርጉም አሁንም ይኖረዋል። ‘መሲሕ’ በዘመናዊ አማርኛ ይህን ማዕረግ በግልጽ ያስተላልፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ አገላለጽ ይጠቀማል። የግሪኩ የምስጋና ቀመር በተፈጥሯዊው ‘ለእግዚአብሔር ምስጋና ይሁን’ ተጠብቋል።
