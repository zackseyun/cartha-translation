review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast, rhetorical interlocutor, two questions, qualitative force of ποίῳ, and the restrained rendering of ἔρχονται as “come.” However, σώματι denotes “body,” whereas ሥጋ normally means “flesh” in modern Amharic and is not a sufficiently exact equivalent here.
  naturalness: The sentence is fluent modern standard Amharic. Replacing ሥጋ with አካል improves both idiomatic clarity and lexical precision. The present-form ይላል is a natural Amharic rhetorical introduction for Greek future ἐρεῖ τις.
  terminology: Use አካል for σώμα. Retain ሙታን and ይነሣሉ as established, natural resurrection language. The note should describe Greek passive voice without asserting God explicitly as the agent, since the verse itself does not name the agent.
  issues:
  - severity: medium
    issue: ሥጋ is used for σώματι.
    rationale: ሥጋ primarily denotes flesh, while σώμα means body. In this verse Paul’s question concerns the kind of resurrection body; አካል accurately preserves this distinction.
  - severity: low
    issue: The footnote states the possible agency as “እግዚአብሔር” specifically.
    rationale: The Greek passive may imply divine agency, but God is not explicitly named in this clause. “መለኮታዊ አድራጊ” preserves the implication without adding an explicit subject.
  revised_text: ነገር ግን አንድ ሰው፣ “ሙታን እንዴት ይነሣሉ?[a] በምን ዓይነት አካልስ ይመጣሉ?” ይላል።
