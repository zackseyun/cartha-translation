  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: am
  text: ነገር ግን አንድ ሰው፣ “ሙታን እንዴት ይነሣሉ?[a] በምን ዓይነት አካልስ ይመጣሉ?” ይላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ግስ ተደራጊ ቅርጽ ነው፤ ቃል በቃል፣ “ሙታን እንዴት ይነሣሉ?” ማለት ነው። ይህም መለኮታዊ አድራጊን ሊጠቁም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ነገር ግን
  rationale: የቀደመውን ሐሳብ በመቃረን የሚነሣውን ጥያቄ በተፈጥሯዊና ግልጽ አማርኛ ያስተዋውቃል።
- source_word: ἐρεῖ τις
  choice: አንድ ሰው ... ይላል
  rationale: የወደፊት ጊዜው ቅርጽ አገባብ በአማርኛ ለምሳሌያዊ ተከራካሪ በሚስማማው የአሁን ጊዜ አቀራረብ ተተርጉሟል፤ ‘ይጠይቃል’ ሳይሆን ‘ይላል’ የግሪኩን ῥῆμα ይጠብቃል።
- source_word: Πῶς
  choice: እንዴት
  rationale: የአኳኋንን ወይም የመቻልን ጥያቄ በቀጥታ ያሳያል።
- source_word: ἐγείρονται
  choice: ይነሣሉ
  rationale: በአማርኛ የትንሣኤ አገላለጽ ተፈጥሯዊ ነው፤ የግሪኩ ቅርጽ ግን ተደራጊ መሆኑን የግርጌ ማስታወሻው ያብራራል።
- source_word: οἱ νεκροί
  choice: ሙታን
  rationale: ሰዎችን በጥቅል የሚያመለክተውን ስማዊ ቅጽል በአጭር፣ በተለመደና በክቡር አማርኛ ይገልጣል።
- source_word: ποίῳ ... σώματι
  choice: በምን ዓይነት ሥጋ
  rationale: ποίῳ የሚጠይቀውን የዓይነት ወይም የባሕርይ ጥያቄ ግልጽ ያደርጋል፤ የመሣሪያ/አብሮነት ዳቲቭም በ‘በ’ ተገልጿል።
- source_word: δὲ
  choice: -ስ
  rationale: ሁለተኛውን ጥያቄ ከመጀመሪያው ጋር በተፈጥሯዊ አማርኛ የሚያያይዝ ለስላሳ አገናኝ ነው።
- source_word: ἔρχονται
  choice: ይመጣሉ
  rationale: የἔρχομαιን ቀጥተኛ ትርጉም ይጠብቃል፤ ‘ይገለጣሉ’ ወይም ‘ይነሣሉ’ ብሎ አይተረጉመውም።
theological_decisions:
- issue: የትንሣኤው አገላለጽና አድራጊው
  choice: ሙታን እንዴት ይነሣሉ?
  alternative: ሙታን እንዴት ይነሣሉ/እንዴት ይነሳሉ? በተደራጊ አገላለጽ፦ ሙታን እንዴት ይነሣሉ (በሌላ አካል እንደሚነሡ በመጠቆም)።
  rationale: ዋናው ጽሑፍ በአማርኛ ተፈጥሯዊውን የትንሣኤ አገላለጽ ይጠቀማል፤ የግሪኩ ግስ ተደራጊ መሆኑና መለኮታዊ አድራጊን ሊጠቁም መቻሉ ግን በማስታወሻ ተጠብቋል፣ አድራጊውም በግልጽ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሥጋ’ የትንሣኤ አውድን በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያቀርባል፤ የጥያቄዎቹ ቅደም ተከተልና ክፍት ትርጉም ተጠብቋል።
