- issue: በቁጥሩ መጨረሻ ያለው ἐν κυρίῳ ከምን ጋር እንደሚያያዝ
  choice: ‘በጌታ የምትደክሙት ድካም’ በማለት ከአማኞች ድካም ጋር ተያያዘ።
