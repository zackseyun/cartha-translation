review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential opening, the vocative address, the Lord's work, and the assurance that labor in the Lord is not vain. However, የጸናችሁ is a completed/perfective description rather than the imperative force of γίνεσθε, እጅግ ትጉ stresses diligence rather than περισσεύοντες ('abounding'), and ዕወቁ recasts εἰδότες ('knowing') as an additional imperative.
  naturalness: The revised wording uses idiomatic modern standard Amharic. ጽኑና የማትናወጡ ሁኑ is a natural exhortation, and የበለጠ ተሳትፎ አድርጉ clearly communicates ongoing abundance in the Lord's work.
  terminology: ጌታ appropriately renders κύριος. ወንድሞቼ retains the masculine plural form of ἀδελφοί, while the footnote appropriately explains its potentially collective reference. The phrase በጌታ የምታደርጉት ድካም retains the weight of κόπος and attaches ἐν κυρίῳ to the believers' labor.
  issues:
  - severity: medium
    issue: The phrase የጸናችሁ ... ሁኑ does not accurately express γίνεσθε.
    rationale: የጸናችሁ normally describes people who have already become firm; γίνεσθε is a present imperative exhorting the audience to become/be steadfast.
  - severity: medium
    issue: እጅግ ትጉ narrows περισσεύοντες.
    rationale: It means 'be very diligent,' whereas περισσεύοντες emphasizes abundance or overflowing involvement, not merely diligence.
  - severity: low
    issue: ዕወቁ changes εἰδότες into a separate command.
    rationale: The Greek is a participle, 'knowing.' Amharic may use a finite expression for fluency, but the revised form better retains its grounding function.
  revised_text: ስለዚህ፣ የተወደዳችሁ ወንድሞቼ[a] ሆይ፣ ጽኑና የማትናወጡ ሁኑ፤ በጌታ ሥራ ሁልጊዜ የበለጠ ተሳትፎ አድርጉ፤ በጌታ የምታደርጉት ድካም ከንቱ እንዳልሆነ እያወቃችሁ።
