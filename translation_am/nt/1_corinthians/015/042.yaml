base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: am
  text: የሙታን ትንሣኤም እንዲሁ ነው፤ ሊጠፋ በሚችል ሁኔታ[a] ይዘራል፤ ሊጠፋ በማይችል ሁኔታ ይነሣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመበስበስ … ባለመበስበስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: እንዲሁ ነው
  rationale: ከቀደመው የዘር ምሳሌ ጋር ያለውን ንጽጽራዊና መደምደሚያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: የሙታን ትንሣኤ
  rationale: የግሪኩን የባለቤትነት አወቃቀር በትክክል የሚያስተላልፍ የተለመደና ግልጽ አገላለጽ ነው።
- source_word: σπείρεται
  choice: ይዘራል
  rationale: የግሪኩን ተደራጊ ቅርጽና የግብርናውን ምስል ይጠብቃል፤ በአማርኛም አድራጊውን ሳይጠቅስ ተደራጊ ትርጉም ሊሰጥ ይችላል።
- source_word: ἐν φθορᾷ
  choice: ሊጠፋ በሚችል ሁኔታ
  rationale: φθορά በዚህ አውድ የአሁኑን ሥጋ መጥፋትና መበስበስ ተገዥነት ያመለክታል። ይህ አገላለጽ ትርጉሙን በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἐγείρεται
  choice: ይነሣል
  rationale: በትንሣኤ አውድ የተለመደውን ቃል ይጠቀማል፤ ከ‘ይዘራል’ ጋር ያለውን ትይዩ አወቃቀርም ይጠብቃል።
- source_word: ἐν ἀφθαρσίᾳ
  choice: ሊጠፋ በማይችል ሁኔታ
  rationale: ከφθορά ጋር ያለውን ቀጥተኛ ተቃርኖ በተመሳሳይ አገላለጽ ያሳያል፤ የትንሣኤው አካል ከመጥፋት ነጻ መሆኑንም ግልጽ ያደርጋል።
theological_decisions:
- issue: በጳውሎስ ንጽጽር ውስጥ የትንሣኤው አካል ባሕርይ
  choice: የመዘራትና የመነሣትን አካላዊ ምስል ሳይፈታ መጠበቅ
  alternative: ‘ሥጋው ይቀበራል፤ የማይጠፋ ሆኖ ይነሣል’ በማለት ምስሉን በቀጥታ መተርጎም
  rationale: አውዱ ስለ አካላዊ ትንሣኤ የሚከራከር ቢሆንም፣ ጥቅሱ ራሱ የዘርን ምስል ይቀጥላል። ስለዚህ ትርጉሙ በአሁኑና በትንሣኤው አካል መካከል ያለውን ቀጣይነትና ለውጥ ሳይተረጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትንሣኤ’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የቃላቱ ትይዩነትም ተጠብቋል።
