- source_word: κατὰ τὰς γραφάς
  choice: እንደ መጻሕፍት
  rationale: ክስተቱ ከታወቀው የቅዱሳት መጻሕፍት ምስክርነት ጋር መስማማቱን በተለመደው የመጽሐፍ ቅዱስ አማርኛ ይገልጣል፤ የትኞቹ ጥቅሶች እንደሆኑ አይወስንም።
- source_word: καὶ ὅτι
