review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders burial and the temporal phrase, but «እንደ መጻሕፍት» is too indefinite for τὰς γραφάς, which in this Pauline formula denotes the sacred Scriptures. The resurrection form is idiomatic but does not by itself clearly carry the Greek perfect’s continuing relevance; the explanatory note can appropriately retain that nuance.
  naturalness: The creedal sequence with «እንደ…ም» is natural enough in formal modern Amharic. Moving the scriptural phrase after the resurrection clause follows the Greek order and reads more smoothly.
  terminology: «ቅዱሳት መጻሕፍት» is the clear, established Amharic designation for «the Scriptures» and avoids suggesting unspecified books. «እንደተነሣ» is a conventional and suitably dignified rendering in this context.
  issues:
  - severity: medium
    issue: «መጻሕፍት» lacks the definiteness and recognized sacred referent of τὰς γραφάς.
    rationale: In Paul, γραφαί does not mean books generally. Adding «ቅዱሳት» clarifies the lexical referent without identifying a canon or imposing an interpretation.
  - severity: low
    issue: The second footnote’s proposed alternative, «እንደተነሣም እንዳለ፣» is not a natural alternative translation of the clause.
    rationale: It is syntactically awkward and adds an explicit continuative assertion. The note should instead explain the perfect aspect while preserving a natural alternative such as «ተነሥቷል».
  revised_text: እንደተቀበረም[a]፣ በሦስተኛው ቀንም እንደተነሣ[b]፣ እንደ ቅዱሳት መጻሕፍት፣
