- issue: κατὰ τὰς γραφάς በቀጥታ ከምን ጋር እንደሚያያዝ
  choice: ከሦስተኛው ቀን ትንሣኤ ጋር በቅርብ እንዲያያዝ
  alternative: በቀደመው አውድ ያሉትን ሞትና መቀበርም በሰፊው እንዲያካትት
  rationale: በግሪኩ የቃላት ቅደም ተከተል ሐረጉ ከሦስተኛው ቀን ትንሣኤ በኋላ መጥቶ በቅርብ ከእርሱ ጋር ይያያዛል። አጠቃላይ የእምነት አዋጁን ሊያጠቃልል የሚችልበትን ሰፊ ንባብ ግን ትርጉሙ በፍጹም አይዘጋውም።
