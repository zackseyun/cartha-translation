id: 1CO.15.43
reference: 1 Corinthians 15:43
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: am
  text: በውርደት ይዘራል፤ በክብር ይነሣል። በድካም ይዘራል፤ በኃይል ይነሣል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: ይዘራል
  rationale: የግሪኩን የመዝራት ምሳሌ እና ተደራጊ አቀራረብ ይጠብቃል፤ በአውዱ የሚዘራው አካል መሆኑ ይገባል።
- source_word: ἀτιμίᾳ
  choice: ውርደት
  rationale: ክብር ከሚለው ተቃራኒ ጋር በተፈጥሮ የሚጣጣም ሲሆን፣ ክብር ማጣትንና ዝቅተኛነትን ያመለክታል።
- source_word: ἐγείρεται
  choice: ይነሣል
  rationale: በትንሣኤ አውድ ውስጥ የግሪኩን የመነሣት/የመነሳት ትርጉም በተለመደና ክቡር አማርኛ ያቀርባል፤ አስነሺውን በግልጽ አይጨምርም።
- source_word: δόξῃ
  choice: ክብር
  rationale: የδόξαን ሰፊ መጽሐፍ ቅዱሳዊ ትርጉም ይጠብቃል፣ ከውርደትም ጋር ያለውን ግልጽ ተቃርኖ ያሳያል።
- source_word: ἀσθενείᾳ
  choice: ድካም
  rationale: የአካልን ደካማነት ጨምሮ ሰፊውን የድክመት ሐሳብ የሚያስተላልፍ ተፈጥሯዊ ምርጫ ነው።
- source_word: δυνάμει
  choice: ኃይል
  rationale: ከድካም ጋር ያለውን ተቃርኖ በግልጽ ያሳያል፤ ቃሉን በአካላዊ ጥንካሬ ብቻ ሳይወስን የትንሣኤን ኃይል ሊያካትት ይችላል።
theological_decisions:
- issue: በትንሣኤ ንግግር ውስጥ ድርጊቱን የሚፈጽመው
  choice: አስነሺውን ሳይጠቅስ «ይነሣል» የሚለውን አቀራረብ መጠቀም
  alternative: «እግዚአብሔር ያስነሣዋል» ብሎ በግልጽ መተርጎም
  rationale: የግሪኩ ተደራጊ አቀራረብ አስነሺውን በስም አይጠቅስም፤ ይህን አለመግለጽ ምንጩን ይጠብቃል።
- issue: ያልተገለጸው የግስ ባለቤት
  choice: በአማርኛ ባለቤቱን ሳይደግሙ ከአውዱ እንዲገባ ማድረግ
  alternative: «አካሉ በውርደት ይዘራል» በማለት ባለቤቱን መጨመር
  rationale: ግሪኩ ባለቤቱን በዚህ ሐረግ አይደግምም፤ አማርኛም ከቅርብ አውድ የሚገባውን ባለቤት በተፈጥሮ ሊተው ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ትይዩ ተቃርኖዎችና የአረፍተ ነገሩ ምት ተጠብቀዋል። «ይነሣል» የሚለው አጻጻፍ ከ«ትንሣኤ» ጋር የሚስማማውን የተለመደ መጽሐፍ ቅዱሳዊ ቅርጽ ይጠብቃል።
