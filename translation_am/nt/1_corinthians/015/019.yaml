  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: am
  text: በዚህ ሕይወት ብቻ በመሲሑ[a] ተስፋ ያደረግን ከሆነ፣ ከሰዎች ሁሉ ይልቅ ልንራራላቸው የሚገባን ነን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በክርስቶስ።” Χριστός የሚለው የግሪክ ማዕረግ “ክርስቶስ” ወይም “መሲሕ” ተብሎ ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ከሰዎች ሁሉ የበለጠ ልንራራላቸው የሚገባን ነን።” የግሪኩ ንጽጽራዊ ቅርጽ ከ“ሁሉ” ጋር የላቀ ደረጃ ትርጉም ሊሰጥ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: ከሆነ
  rationale: የግሪኩን ሁኔታዊ አረፍተ ነገር በተፈጥሯዊ የአማርኛ አገባብ ያስተላልፋል።
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: በዚህ ሕይወት
  rationale: የአሁኑን ምድራዊ ሕይወት የሚያመለክተውን ቅድመ አቀማመጥ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: Χριστός እዚህ የማዕረግ ትርጉሙን ስለያዘ ‘መሲሕ’ ተመርጧል፤ ἐν የሚለውም ጳውሎሳዊውን ጥልቅ ግንኙነት ሳያጠፋ ‘በ’ ተብሎ ተጠብቋል።
- source_word: ἠλπικότες ἐσμὲν
  choice: ተስፋ ያደረግን
  rationale: የግሪኩን ፍጹም ጊዜ አቀራረብ፣ ቀድሞ የተመሠረተና እስከአሁን የዘለቀ ተስፋ መሆኑን፣ በተለመደ የአማርኛ አገላለጽ ያሳያል።
- source_word: μόνον
  choice: ብቻ
  rationale: ተስፋው በዚህ ሕይወት የተወሰነ መሆኑን ያሳያል፤ በዋናው ጽሑፍ ውስጥ ከ‘በዚህ ሕይወት’ ቀጥሎ መቀመጡ ይህን ወሰን ግልጽ ያደርጋል።
- source_word: ἐλεεινότεροι
  choice: ይልቅ የምናሳዝን
  rationale: ቃሉ ምሕረትን ወይም ኀዘኔታን የሚጠይቅ ሁኔታ ማለት ነው፤ ‘ይልቅ’ የግሪኩን ንጽጽራዊ ቅርጽ ይጠብቃል።
- source_word: πάντων ἀνθρώπων
  choice: ከሰዎች ሁሉ
  rationale: ἄνθρωποι ሁሉንም ሰው የሚያካትት በመሆኑ ጾታን ያልወሰነው ‘ሰዎች’ ተመርጧል።
theological_decisions:
- issue: በጳውሎሳዊው አገላለጽ ἐν Χριστῷ ውስጥ Χριστῷን መተርጎም
  choice: በመሲሑ
  alternative: በክርስቶስ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ ‘መሲሕ’ የቃሉን ትርጉም ያስቀድማል፤ ባሕላዊው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
- issue: የμόνον ወሰንና የክርስቲያናዊው ተስፋ አድማስ
  choice: ተስፋው በዚህ ሕይወት ብቻ ተወስኖ ከሆነ የሚል ሁኔታዊ ንግግር
  alternative: ‘በመሲሑ ተስፋ ማድረግ’ ብቻውን በዚህ ሕይወት የተፈጸመ ነገር እንደሆነ መውሰድ
  rationale: አውዱ የትንሣኤ ተስፋ ከዚህ ሕይወት ባሻገር ካልሆነ የሚከተለውን ውጤት ይናገራል፤ ትርጉሙ ከጽሑፉ በላይ የኋለኛውን ሕይወት ዝርዝር አስተምህሮ አይጨምርም።
- issue: ἐλεεινότεροι ንጽጽራዊ ወይስ የላቀ ደረጃ አገላለጽ
  choice: ከሰዎች ሁሉ ይልቅ የምናሳዝን
  alternative: ከሰዎች ሁሉ እጅግ የምናሳዝን
  rationale: ግሪኩ በቅርጹ ንጽጽራዊ ስለሆነ ‘ይልቅ’ ተጠብቋል፤ ከ‘ሁሉ’ ጋር በአገባቡ የላቀ ደረጃ ስሜት ሊኖረው መቻሉ በማስታወሻ ተገልጿል።
