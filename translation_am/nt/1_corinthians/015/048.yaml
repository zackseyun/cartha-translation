base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: am
  text: ከአፈር የሆነው ሰው እንዳለ ሁሉ፣ ከአፈር የሆኑትም እንዲሁ ናቸው፤ ሰማያዊው ሰው እንዳለ ሁሉ፣ ሰማያዊ የሆኑትም እንዲሁ ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: እንደሆነ ... እንደዚያው ናቸው
  rationale: የግሪኩን ተዛማጅ አወቃቀርና በአብነቱ እና በእርሱ ወገን በሆኑት መካከል ያለውን መመሳሰል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: χοϊκός
  choice: ከአፈር የሆነ
  rationale: ከአፈር መፈጠርን ወይም በአፈር ባሕርይ መታወቅን ያመለክታል፤ በቁጥር 47 ያለውን የአዳም አፈጣጠር ጥቅስ ያቆያል።
- source_word: ὁ χοϊκός
  choice: ከአፈር የሆነው ሰው
  rationale: በአውዱ ከሰማያዊው ሰው ጋር የተነጻጸረውን ወካይ ነጠላ ሰው በግልጽ ያሳያል።
- source_word: οἱ χοϊκοί
  choice: ከአፈር የሆኑት
  rationale: የአፈሩን ሰው ባሕርይ የሚጋሩ ሰዎችን ያመለክታል፤ χοϊκός በነጠላና በብዙ ቁጥር ያለውን ድግግሞሽ ይጠብቃል።
- source_word: ἐπουράνιος
  choice: ሰማያዊ
  rationale: የሰማይ የሆነን ወይም ከሰማይ ጋር የተያያዘን ያመለክታል፤ የቁጥር 47ን ‘ከሰማይ’ የሚል አገላለጽ ወደዚህ ቁጥር ሳያስገባ የግሪኩን ቅጽል ይጠብቃል።
- source_word: ὁ ἐπουράνιος
  choice: ሰማያዊው ሰው
  rationale: በቅርብ አውድ ከአዳም ጋር የተነጻጸረውን ክርስቶስ ያመለክታል፤ ከመጀመሪያው ንዑስ ሐረግ ጋር ያለውን የሰው ለሰው ንጽጽር ያቆያል።
- source_word: οἱ ἐπουράνιοι
  choice: ሰማያዊ የሆኑት
  rationale: የሰማያዊውን ሰው ባሕርይ የሚጋሩ ሰዎችን ያመለክታል፤ መላእክትን እንደሚያመለክት አያስመስልም።
theological_decisions:
- issue: በሁለቱ ነጠላ ስሞች ውስጥ ‘ሰው’ የሚለውን መጨመር
  choice: ‘ከአፈር የሆነው ሰው’ እና ‘ሰማያዊው ሰው’ ተብሎ ተተርጉሟል።
  alternative: ‘ከአፈር የሆነው’ እና ‘ሰማያዊው’
  rationale: ቁጥር 45–49 አዳምንና ክርስቶስን እንደ ወካይ ሰዎች ያነጻጽራል። ‘ሰው’ ማለት በአማርኛ ማጣቀሻውን ግልጽ ያደርጋል፤ ከአውዱ በላይ የሆነ የእምነት አቋም አይጨምርም።
- issue: οἱ ἐπουράνιοι መላእክትን ወይስ ከሰማያዊው ሰው ጋር የሚመሳሰሉ ሰዎችን ያመለክታል?
  choice: ሰዎችን እንደሚያመለክት ‘ሰማያዊ የሆኑት’ ተብሎ ተተርጉሟል።
  alternative: ‘ሰማያውያን’
  rationale: አውዱ ስለ ሰው ትንሣኤና ስለ ሰማያዊው ሰው መልክ ስለሚካፈሉት ይናገራል እንጂ ስለ መላእክት አይደለም። የተመረጠው አገላለጽ ይህን የሰው ማጣቀሻ ሳያሰፋ ይጠብቃል።
