review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast between what is sown and the future body, and it renders the contingent example of wheat or another kind. However, “ባዶ ፍሬ” means an empty fruit and does not adequately convey γυμνὸν κόκκον, a bare/naked seed or kernel.
  naturalness: The initial construction combines “የምትዘራውም” with the explicitly masculine “ትዘራለህ,” creating an avoidable person/gender-register inconsistency. Recasting the sentence as an equative contrast is natural modern Amharic and retains the Greek sense.
  terminology: “አካል” appropriately retains σῶμα in this resurrection context. “ዘር” is the natural general equivalent for κόκκον; “እርቃኑን ያለ” communicates γυμνόν without the misleading sense of an empty fruit.
  issues:
  - severity: medium
    issue: “ባዶ ፍሬ” is semantically inaccurate for γυμνὸν κόκκον.
    rationale: “ባዶ” normally denotes empty, and “ፍሬ” denotes fruit/produce. The Greek refers to a bare or naked grain/seed, in contrast with the body that will come to be.
  - severity: low
    issue: The verbal framing is inconsistent in person/gender nuance.
    rationale: “የምትዘራውም” is followed by “ትዘራለህ.” An impersonal equative formulation avoids this inconsistency while preserving the generic second-person illustration.
  revised_text: የምትዘራው ወደፊት የሚሆነው አካል አይደለም፤ ይልቁንም ምናልባት የስንዴ ወይም ከሌሎቹ ዓይነቶች የአንዱ እርቃኑን ያለ ዘር[a] ነው።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “ባዶ ዘር”፤ “እርቃኑን ያለ ፍሬ”።
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s future-oriented “body,” its bare-seed image, and its illustrative “perhaps” without adding interpretation. It replaces the inaccurate “empty fruit” wording with a natural, source-faithful expression for a bare seed and smooths the Amharic syntax.
