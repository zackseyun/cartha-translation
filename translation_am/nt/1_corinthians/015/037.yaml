  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: am
  text: የምትዘራው ወደፊት የሚሆነው አካል አይደለም፤ ይልቁንም ምናልባት የስንዴ ወይም ከሌሎቹ ዓይነቶች የአንዱ እርቃኑን ያለ ዘር[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባዶ ዘር”፤ “እርቃኑን ያለ ፍሬ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεις
  choice: ትዘራለህ / አትዘራም
  rationale: የግብርናውን የመዝራት ምስል በቀጥታ ይጠብቃል፤ በአማርኛም ተፈጥሯዊ ነው።
- source_word: σῶμα
  choice: አካል
  rationale: በጳውሎስ የትንሣኤ ክርክር ውስጥ ያለውን የ‘ሰውነት/አካል’ ትርጉም ይጠብቃል፤ ዘይቤውን ‘ተክል’ ብሎ አያጠብም።
- source_word: τὸ γενησόμενον
  choice: ወደፊት የሚሆነውን
  rationale: የወደፊት መሆንን ያሳያል፤ ሂደቱን ‘የሚበቅለው’ ብሎ ከሚገባው በላይ አይወስንም።
- source_word: γυμνὸν κόκκον
  choice: ባዶ ፍሬ
  rationale: γυμνός ያለውን ‘ባዶ/እርቃኑን’ ንፅፅር እና κόκκος ያለውን የነጠላ ዘር ፍሬ ሐሳብ ይጠብቃል።
- source_word: εἰ τύχοι
  choice: ምናልባት
  rationale: ሐረጉ የሚያቀርበውን ምሳሌያዊ አጋጣሚ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: σίτου ἤ τινος τῶν λοιπῶν
  choice: የስንዴ ወይም ከሌሎቹ የአንዱ የሆነ
  rationale: σίτοςን በተለይ ‘ስንዴ’ ብሎ ያቀርባል፤ τῶν λοιπῶν ያለውንም ከቀሩት ዓይነቶች አንዱ የሚለውን ክፍት ሐሳብ ይጠብቃል።
theological_decisions:
- issue: በዘሩና በትንሣኤው አካል መካከል ያለው ግንኙነት
  choice: ‘አካል’ እና ‘ወደፊት የሚሆነው’ የሚሉትን ቃላት በጽሑፉ ውስጥ ማቆየት
  alternative: ‘ወደፊት የሚበቅለውን ተክል’ ብሎ በሙሉ ወደ እፅዋት ምስል መተርጎም
  rationale: ጥቅሱ ቀጣይነትንና ለውጥን በዘር ምሳሌ ያቀርባል። ትርጉሙ የጳውሎስን ‘አካል’ የሚለውን ቁልፍ ቃል ይጠብቃል፤ ነገር ግን ጥቅሱ በግልጽ ከሚለው በላይ የትምህርተ እምነት ማብራሪያ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩን ነጠላ ሁለተኛ መደብ አነጋገር በ‘ትዘራለህ’ ይጠብቃል፤ ምሳሌውንም ሳይተረጉም ወይም ሳያሰፋ ያቀርባል።
