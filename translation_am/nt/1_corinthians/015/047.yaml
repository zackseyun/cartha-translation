  rationale: ጳውሎስ መገኛውንና ቁሳዊ ባሕርዩን በተያያዙ ግን በተለያዩ አገላለጾች ያቀርባል፤ ትርጉሙም ይህን ድግግሞሽ ሳያጠፋ የዘፍጥረትን ፍንጭ ይጠብቃል።
