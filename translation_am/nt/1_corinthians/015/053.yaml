  rationale: ከቀደመው ቁጥር ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በአማርኛ በተፈጥሯዊ የዓረፍተ ነገር መደምደሚያ ያሳያል።
- source_word: τὸ φθαρτὸν τοῦτο
  choice: ይህ የሚጠፋው ሰውነት
  rationale: φθαρτός ለመበስበስና ለመጥፋት ተገዢ መሆንን ያመለክታል፤ ‘ሰውነት’ ከትንሣኤ አውድ ተጨምሮ የሚያመለክተውን ግልጽ ያደርጋል።
- source_word: ἐνδύσασθαι
  choice: መልበስ
  rationale: የግሪኩን የልብስ ምሳሌያዊ አነጋገር በግልጽና በተለመደ አማርኛ ይጠብቃል።
- source_word: ἀφθαρσίαν
  choice: የማይጠፋውን
  rationale: ከφθαρτός ጋር ያለውን ቀጥተኛ ተቃርኖ ያስጠብቃል፤ ከእንግዳ ስማዊ ቅርጽ ይልቅ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: καὶ
  choice: ይህም
  rationale: ሁለቱን ትይዩ ንግግሮች በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: τὸ θνητὸν τοῦτο
  choice: ይህ ሟች ሰውነት
  rationale: θνητός ለሞት ተገዢ መሆንን ያሳያል፤ ‘ሰውነት’ ከአውዱ ተጨምሮ ማመልከቻውን ግልጽ ያደርጋል።
- source_word: ἀθανασίαν
  choice: የማይሞተውን
  rationale: ከ‘ሟች’ ጋር ያለውን ተቃርኖ በቀጥታ ያሳያል፤ የሞት ተገዢነት የሌለበትን ሁኔታ በተደራሽ ቋንቋ ይገልጣል።
theological_decisions:
- issue: በግሪኩ ጥቅስ σώμα ባይገኝም ‘ሰውነት’ን በሁለቱም ሐረጎች መጨመር
  choice: ‘ይህ የሚጠፋው ሰውነት’ እና ‘ይህ ሟች ሰውነት’
  alternative: ‘ይህ የሚጠፋው ... ይህ ሟቹ ...’ በማለት ሰውነትን ሳይጠቅሱ መተርጎም
  rationale: በቁጥር 42–54 ያለው ቅርብ አውድ የሰውነትን ትንሣኤና ለውጥ ይናገራል። ‘ሰውነት’ን መጨመር አዲስ የእምነት አቋም ሳያስገባ በግሪኩ ስማዊ ሆነው የቀረቡት ቅጽሎች የሚያመለክቱትን ያብራራል፤ መደበኛው ቅርጽ ግን በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘መልበስ’ ምሳሌያዊ አነጋገርና የመጥፋት/አለመጥፋት፣ የመሞት/አለመሞት ትይዩ ተቃርኖዎች ተጠብቀዋል።
