review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the explanatory γάρ, the necessity expressed by δεῖ, the two parallel clauses, and the resurrection-body referent supplied from the immediate context. However, rendering ἀφθαρσία and ἀθανασία as substantival relative adjectives ('የማይጠፋውን,' 'የማይሞተውን') leaves their abstract noun sense underexpressed and makes the clothing metaphor syntactically incomplete in Amharic.
  naturalness: The infinitival construction is understandable but somewhat heavy. Using finite verbs with 'ይገባዋልና' is modern, clear, and retains the required necessity. 'አለመጥፋት' and 'አለመሞት' are natural abstract complements of 'መልበስ' here.
  terminology: '''ሰውነት'' is a defensible contextual supply and is properly disclosed in the footnote. ''አለመጥፋት'' preserves the φθαρτός/ἀφθαρσία contrast, while ''አለመሞት'' accurately expresses ἀθανασία and pairs directly with ''ሟች.'''
  issues:
  - severity: medium
    issue: The objects of 'መልበስ' are rendered as relative-adjective forms rather than abstract nouns.
    rationale: ἀφθαρσίαν and ἀθανασίαν denote imperishability/incorruptibility and immortality, respectively. In Amharic, 'የማይጠፋውን' and 'የማይሞተውን' normally require an implied concrete noun and do not naturally express the abstract qualities being put on.
  - severity: low
    issue: The main translation and the footnote use an awkward infinitival syntax.
    rationale: A finite parallel construction makes the verse clearer without weakening δεῖ or losing the clothing metaphor.
  - severity: low
    issue: The footnote's formal alternative uses 'ሟቹ,' which introduces definiteness not represented by the Greek substantival adjective.
    rationale: Use 'ሟች' in the formal alternative; the Greek has 'τὸ θνητὸν τοῦτο' ('this mortal [one]').
  revised_text: ይህ የሚጠፋ ሰውነት አለመጥፋትን ሊለብስ፣ ይህም ሟች ሰውነት አለመሞትን ሊለብስ ይገባዋልና።[a]
