  language: am
  text: ይህ የሚጠፋ ሰውነት አለመጥፋትን ሊለብስ፣ ይህም ሟች ሰውነት አለመሞትን ሊለብስ ይገባዋልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በይበልጥ ቃል በቃል፣ “ይህ የሚጠፋው አለመጥፋትን ሊለብስ፣ ይህም ሟች አለመሞትን ሊለብስ ይገባዋልና።” የግሪኩ ጽሑፍ በዚህ ቁጥር “ሰውነት” የሚለውን ቃል በግልጽ አይደግምም፤ ነገር ግን ቅርብ አውዱ ስለ ሰውነት ትንሣኤ ስለሚናገር ማመልከቻው ግልጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: አለበት
  rationale: በትንሣኤ ጊዜ የሚከናወነውን አስፈላጊና የማይቀር ለውጥ በዘመናዊ አማርኛ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: γὰρ
