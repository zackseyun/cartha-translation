base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: am
  text: ነገር ግን በእግዚአብሔር ጸጋ እኔ የሆንኩት ነኝ፤ ለእኔ ያለውም ጸጋው ከንቱ አልሆነም።[a] በተቃራኒው፣ ከሁላቸው ይልቅ አብልጬ ደክሜአለሁ፤ የደከመው ግን እኔ ሳልሆን፣ ከእኔ ጋር የነበረው የእግዚአብሔር ጸጋ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ባዶ አልሆነም» ወይም «ያለ ፍሬ አልቀረም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: ነገር ግን በእግዚአብሔር ጸጋ
  rationale: በ- የተባለው ቅጥያ የድርጊቱን መሣሪያዊ ወይም ምክንያታዊ ኃይል ያሳያል፤ «ነገር ግን» ደግሞ δέ ከቀደመው አውድ ጋር ያለውን መጠነኛ ንፅፅር ያቆያል።
- source_word: εἰμι ὅ εἰμι
  choice: የሆንኩትን ሆኛለሁ
  rationale: የግሪኩን ድግግሞሽና ጳውሎስ አሁን ያለበትን ማንነትና ሁኔታ የሚያመለክተውን አገላለጽ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: ለእኔም የተሰጠው ጸጋው
  rationale: εἰς ἐμέ ጸጋው ወደ ጳውሎስ መምጣቱን ወይም ለእርሱ መደረጉን ያሳያል፤ «የተሰጠው» ይህን አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐ κενὴ ἐγενήθη
  choice: ከንቱ አልሆነም
  rationale: κενός ቃል በቃል «ባዶ» ማለት ቢችልም እዚህ ያለ ፍሬ ወይም ያለ ውጤት መሆንን ያመለክታል፤ «ከንቱ አልሆነም» ምሳሌያዊ ኃይሉንና የውጤት ሐሳቡን ያቆያል።
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: ከዚህ ይልቅ፣ ከሁሉም አብልጬ ደክሜአለሁ
  rationale: κοπιάω ከባድና አድካሚ ሥራን ያመለክታል፤ «ደክሜአለሁ» ይህን ኃይል ያስተላልፋል። περισσότερον αὐτῶν πάντων የሚለው ከሁሉም የበለጠ መድከሙን ያሳያል።
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: ይሁን እንጂ፣ እኔ ሳልሆን … የእግዚአብሔር ጸጋ ነው
  rationale: ይህ ጳውሎስ በእውነት መድከሙን እያረጋገጠ የድካሙን ውጤታማ ምንጭ ለእግዚአብሔር ጸጋ መስጠቱን ይጠብቃል።
- source_word: ἡ σὺν ἐμοί
  choice: ከእኔ ጋር የነበረው
  rationale: σύν ከዳቲቭ ጋር «ከ…ጋር» ማለት ነው፤ አንቀጹም ሐረጉን «የእግዚአብሔር ጸጋ» ከሚለው ጋር ያያይዘዋል።
theological_decisions:
- issue: በጳውሎስ ድካምና በመለኮታዊ ጸጋ መካከል ያለው ግንኙነት
  choice: ጳውሎስ በእውነት መድከሙና ውጤታማው የእግዚአብሔር ጸጋ ሁለቱም ሳይቀነሱ ተጠብቀዋል።
  alternative: «እግዚአብሔርና እኔ በጋራ ሠራን» በማለት የትብብርን ሐሳብ ማጠናከር፣ ወይም የጳውሎስን እውነተኛ ድካም በማሳነስ የመለኮታዊ ተግባርን ብቻ ማጉላት።
  rationale: ግሪኩ «ከሁሉም አብልጬ ደከምሁ» እና «እኔ ሳልሆን የእግዚአብሔር ጸጋ» የሚሉትን ሁለቱንም በግልጽ ያረጋግጣል። ትርጉሙ ይህን ውጥረት በኋለኛ ሥነ መለኮታዊ ሥርዓት ሳይፈታው ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። «ጸጋ» የሚለው ዋና የጳውሎስ ቃል ሳይተረጎም ተጠብቋል፤ የድካምና የጸጋ ንፅፅርም በተፈጥሯዊ ነገር ግን ቅርብ አገላለጽ ቀርቧል።
