  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሕያዋን ይደረጋሉ» የግሪኩን ተደራጊ ቅርጽ ሲጠብቅ፣ «ሁሉም… ሁሉም» ደግሞ የጥቅሱን የንጽጽር ሚዛን ይጠብቃል።
