  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: am
  text: ምክንያቱም በአዳም ሁሉም እንደሚሞቱ፣ እንዲሁ በመሲሑ[a] ሁሉም ሕያዋን ይደረጋሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በክርስቶስ።» Χριστός የሚለው የግሪክ ማዕረግ «ክርስቶስ» ተብሎ ሊቀርብ ወይም «መሲሕ» ተብሎ ሊተረጎም ይችላል፤ እዚህ ትርጉሙን ለማሳየት «መሲሕ» ተብሎ ተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ምክንያቱም … እንደሚ…
  rationale: γάρ ከቀደመው ክርክር ጋር ያለውን የማብራሪያ ግንኙነት በ«ምክንያቱም» ያሳያል፤ ὥσπερ ደግሞ ከοὕτως καὶ ጋር ያለውን ንጽጽር በ«እንደሚ… እንዲሁም» በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν τῷ Ἀδὰμ
  choice: በአዳም
  rationale: የἐνን አጭርና ውስብስብ ግንኙነት ሳይፈታ «በአዳም» ብሎ በቅርብ ይጠብቃል፤ «በአዳም አማካይነት» የመሣሪያነትን ትርጉም ከልክ በላይ ያጎላ ነበር።
- source_word: πάντες
  choice: ሁሉም
  rationale: በሁለቱም ሐረጎች ያለውን ሰፊና ያልተገደበ አገላለጽ እና ትይዩነት ይጠብቃል።
- source_word: ἀποθνῄσκουσιν
  choice: ይሞታሉ
  rationale: የግሪኩን የአሁን ጊዜ አጠቃላይ እውነት በተፈጥሯዊ የአማርኛ የአሁን ጊዜ አገላለጽ ያቀርባል።
- source_word: οὕτως καὶ
  choice: እንዲሁም
  rationale: ከὥσπερ ጋር ያለውን ተዛማጅ የንጽጽር መዋቅርና የκαίን ጭማሪ ኃይል በአጭሩ ይጠብቃል።
- source_word: ἐν τῷ Χριστῷ
  choice: በመሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተብሎ ለትርጉሙ ተተርጉሟል፤ የግሪኩ የተወሰነ መስተአምርም በ«መሲሑ» ተንጸባርቋል።
- source_word: ζῳοποιηθήσονται
  choice: ሕያዋን ይደረጋሉ
  rationale: የወደፊት ጊዜውንና የተደራጊ ቅርጹን ሁለቱንም ይጠብቃል፤ ድርጊቱን የሚፈጽመውን በትርጉሙ ሳይጨምር የመለኮታዊ ድርጊትን አመላካችነት ያስቀራል።
theological_decisions:
- issue: በሁለቱ ሐረጎች ያለው የ«ሁሉም» ወሰን
  choice: በሁለቱም ቦታ «ሁሉም» የሚለውን ያለ ተጨማሪ ገደብ መጠበቅ
  alternative: ሁለተኛውን «ሁሉም» በግልጽ «አማኞች ሁሉ» ብሎ መገደብ፣ ወይም ሁለቱ በሁሉም ረገድ ፈጽሞ አንድ ወሰን እንዳላቸው በትርጉሙ መወሰን
  rationale: ግሪኩ πάντες… πάντες የሚለውን ሆን ተብሎ የተደረገ ትይዩነት ያቀርባል፤ ቁጥሩ ራሱ የሁለተኛውን ወሰንና መንገድ በተጨማሪ አይገልጽም። ስለዚህ ትርጉሙ የነገረ መለኮታዊ ውጥረቱን ሳይፈታ ይጠብቃል።
- issue: Χριστόςን እንደ ማዕረግ ወይም እንደ ተለምዶአዊ ትርጉም ማቅረብ
  choice: በዋናው ጽሑፍ «መሲሑ» ማለት
  alternative: «ክርስቶስ» የሚለውን ተለምዶአዊ ቃል መጠቀም
  rationale: Χριστός በዚህ አውድ የቅቡዕነት ማዕረግ ነው። «መሲሑ» የማዕረጉን ትርጉም በግልጽ ያቀርባል፤ «ክርስቶስ» የሚለው የተለመደ አማራጭ ግን በማስታወሻ ተጠቅሷል።
