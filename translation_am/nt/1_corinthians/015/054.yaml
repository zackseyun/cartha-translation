base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: am
  text: ይህ የሚበሰብሰው የማይበሰብስነትን ሲለብስ፣ ይህም ሟች አለመሞትን ሲለብስ፣ በዚያን ጊዜ የተጻፈው ቃል እውን ይሆናል፤ “ሞት በድል ተዋጠ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ከኢሳይያስ 25፥8 የተጠቀሰ፤ አገላለጹ ጳውሎስ የጠቀሰውን የግሪክ ትርጉም ወግ ያንጸባርቃል። ‘እውን ይሆናል’ የተተረጎመው የግሪክ ግስ ቃል በቃል ‘ይሆናል’ ወይም ‘ይከሰታል’ ማለት ይችላል።
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: φθαρτὸν
  choice: የሚበሰብሰው
  rationale: በመበስበስና በመጥፋት ሥር ያለውን አሁናዊ ሰውነት የሚያመለክት ስማዊ ቅጽል ነው፤ ከ‘የማይበሰብሰው’ ጋር ያለውን ተቃርኖም ይጠብቃል።
- source_word: ἐνδύσηται
  choice: ሲለብስ
  rationale: የልብስን ምስል በቀጥታ ይጠብቃል፤ የግሪኩ መካከለኛ ድምፅ በአማርኛው ተፈጥሯዊ አገላለጽ ተሰጥቷል።
- source_word: ἀφθαρσίαν
  choice: የማይበሰብሰውን
  rationale: ግሪኩ ረቂቅ ስም ቢሆንም፣ በአማርኛ ‘የማይበሰብስነት’ ከሚለው ይልቅ ይህ ቅጽ ተፈጥሯዊ ሲሆን ከφθαρτόν ጋር ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: θνητὸν
  choice: ሟች
  rationale: ለሞት ተገዢ የሆነውን በአጭርና በተለመደ ቃል ይገልጣል።
- source_word: ἀθανασίαν
  choice: ያለመሞትን
  rationale: ሞት የሌለበትን ሁኔታ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γενήσεται
  choice: ይፈጸማል
  rationale: ቃሉ በመሠረቱ ‘ይሆናል/እውን ይሆናል’ ማለት ነው፤ ከተጻፈ ቃል ጋር በአማርኛ ‘ይፈጸማል’ ተፈጥሯዊ ነው፣ ይሁንና የትንቢት ቴክኒካዊ ቃል መሆኑን አያስገድድም።
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: የተጻፈው ቃል
  rationale: λόγοςን ‘ቃል’ ብሎ ይጠብቃል፣ የተጻፈ ንግግር መሆኑንም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Κατεπόθη
  choice: ተዋጠ
  rationale: የግሪኩን አኦሪስት ተደራጊ ቅርጽና የመዋጥ ምስል ይጠብቃል፤ ድርጊቱን ያደረገውን አካል አይጨምርም።
- source_word: εἰς νῖκος
  choice: በድል
  rationale: የሞትን ፍጹም መሸነፍ በተፈጥሯዊና በታወቀ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: γενήσεται ከተጻፈው ቃል ጋር ያለው ትርጉም
  choice: ይፈጸማል
  alternative: እውን ይሆናል / ይሆናል
  rationale: ‘ይፈጸማል’ በአማርኛ ከተጻፈ ቃል ጋር ተፈጥሯዊ ነው፤ የግሪኩን ‘ይከሰታል/እውን ይሆናል’ ሐሳብ ያስተላልፋል፣ ነገር ግን ግሪኩ ቴክኒካዊ የ‘ፍጻሜ’ ግስ አለመጠቀሙ በማስታወሻ ተገልጿል።
- issue: Κατεπόθη በወደፊት ዐውድ ውስጥ ያለው ጊዜያዊ አኳኋን
  choice: ሞት በድል ተዋጠ
  alternative: ሞት በድል ይዋጣል / ተውጦአል
  rationale: ጥቅሱ ወደፊት በሚፈጸመው ጊዜ ክስተቱን እንደተፈጸመ የሚያውጅ ስለሆነ፣ ያለፈ ጊዜ ቅርጹ የአኦሪስቱን ኃይልና የነቢያዊ አዋጁን ምስል ይጠብቃል።
