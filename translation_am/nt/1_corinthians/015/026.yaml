  alternative: የሚጠፋው
  rationale: «የሚወገደው» ሞት እንደ ጠላት ወደ ፍጻሜ መምጣቱንና ኃይሉ መሻሩን ያስተላልፋል፤ ግሱ በራሱ ከሚፈቅደው በላይ የሜታፊዚክስ ዝርዝር አይጨምርም። «የሚጠፋው» ተቀባይነት ያለው አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
