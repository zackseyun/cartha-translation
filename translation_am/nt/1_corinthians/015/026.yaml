  rationale: ተቃዋሚ ወይም ጠላት የሆነ ኃይልን ያመለክታል፤ ሞት እንደ ጠላት ሆኖ የቀረበበትን ሰውኛ አገላለጽ ይጠብቃል።
- source_word: καταργεῖται
