reference: 1 Corinthians 15:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: am
  text: ነገሮችን ሁሉ ከእግሮቹ በታች አስገዝቶአልና። “ነገሮች ሁሉ ተገዝተዋል” ሲባል ግን፣ ሁሉን ለእርሱ ያስገዛው በእነዚህ ሁሉ ውስጥ እንደማይካተት ግልጽ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: ሁሉን / ሁሉ
  rationale: ግሪክኛው ገለልተኛ ብዙ ቁጥር ሰዎችን ብቻ ሳይሆን ፍጥረትንና ነገሮችን ሁሉ በስፋት ያመለክታል፤ ‘ሁሉ’ ይህን ሰፊ ወሰን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑπέταξεν
  choice: አስገዝቶአል
  rationale: ὑποτάσσω አንድን ነገር ከሌላው ሥር ማድረግን ያመለክታል። የግሪክኛውን ወሳኝ ድርጊትና የድርጊቱን ቀጣይ ውጤት በዐውዱ ለማሳየት ‘አስገዝቶአል’ ተመርጧል።
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: ከእግሮቹ በታች
  rationale: ይህ የገዢነትንና የመገዛትን ምስላዊ አነጋገር ሲሆን ከመዝሙር 8 ጋር ያለውን ግንኙነት ለመጠበቅ ቃል በቃል ቀርቧል።
- source_word: ὅταν δὲ εἴπῃ
  choice: ሲባል ግን
  rationale: በግሪክኛው ያልተገለጸውን የግስ ባለቤት ‘እግዚአብሔር’ ወይም ‘መጽሐፍ’ ብሎ ሳይወስን፣ የተጠቀሰውን ንግግር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὑποτέτακται
  choice: ተገዝቶለታል
  rationale: የፍጹም ጊዜ ተደራጊ ቅርጹ የተፈጸመ ድርጊትንና የቀጠለውን ሁኔታ ያመለክታል፤ የአማርኛው ቅርጽም ተደራጊነቱን ይጠብቃል።
- source_word: δῆλον
  choice: ግልጽ ነው
  rationale: ጳውሎስ አንባቢው እንዲያውቀው የሚጠብቀውን አመክንዮአዊ መደምደሚያ ቀጥተኛና ዘመናዊ በሆነ አነጋገር ያሳያል።
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: ሁሉን ለእርሱ ያስገዛው ከዚህ ውጭ እንደሆነ
  rationale: ἐκτός ከተጠቀሰው ‘ሁሉ’ ውስጥ አንዱ እንደማይካተት የሚያሳይ የማግለል ትርጉም አለው። ይህ አቀራረብ ሁሉን ለወልድ ያስገዛው ራሱ ከተገዙት ‘ሁሉ’ ውጭ መሆኑን ያሳያል።
- source_word: αὐτῷ
  choice: ለእርሱ
  rationale: የመዳረሻ ተሳቢው ሁሉ የተገዛለትን፣ በዐውዱ መሠረት ወልድን/መሲሑን፣ በቀጥታ ያመለክታል።
theological_decisions:
- issue: በወልድና ሁሉን በሚያስገዛው መካከል ያለው ግንኙነት
  choice: ሁሉን ለወልድ ያስገዛው እግዚአብሔር ‘ሁሉ’ በተባሉት ውስጥ እንደማይካተት ጽሑፉ በግልጽ ያሳያል።
  alternative: ‘ሁሉን ለእርሱ ካስገዛው በስተቀር’ በማለት የግሪክኛውን ሰዋሰው ይበልጥ በቅርብ ማቅረብ።
  rationale: ትርጉሙ በዚህ የመገዛት ሥርዓት ውስጥ ወልድንና አብን አያደባልቅም፤ በተመሳሳይም የወልድን ክብር የሚቀንስ ተጨማሪ ሐሳብ አያስገባም። በጽሑፉ ያለውን ልዩነትና አመክንዮአዊ ማግለል ብቻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ከእግሮቹ በታች’ የሚለው መጽሐፍ ቅዱሳዊ ምስል ተጠብቋል፤ ‘ሲባል’ የሚለው ቅርጽ ደግሞ ግሪክኛው በግልጽ ያልሰየመውን የንግግሩን ባለቤት አይወስንም።
