  to: ነገሮችን ሁሉ ከእግሮቹ በታች አስገዝቶአልና። “ነገሮች ሁሉ ተገዝተዋል” ሲባል ግን፣ ሁሉን ለእርሱ ያስገዛው በእነዚህ ሁሉ ውስጥ እንደማይካተት ግልጽ ነው።
  rationale: 'The revision clarifies the referent and logical force of ἐκτός: the one who subjected all things to him is excluded from the totality of subjected things. It also renders the neuter plural πάντα explicitly as “ነገሮች ሁሉ.” The footnote preserves the more compact exception construction as a legitimate lexical alternative.'
