base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: am
  text: 'ወንድሞች ሆይ[a]፣ ይህን እላለሁ፤ ሥጋና ደም[b] የእግዚአብሔርን መንግሥት ሊወርሱ አይችሉም፤ የሚበሰብሰውም የማይበሰብሰውን አይወርስም።


    [a] “ወንድሞች” የሚለው “ወንድሞችና እህቶች” ተብሎም ሊተረጎም ይችላል፤ ግሪክኛው “ወንድሞች” ይላል፣ ነገር ግን መላውን ጉባኤ በአካታችነት ሊያመለክት ይችላል።


    [b] “ሥጋና ደም” ማለት አሁን ባለው ሁኔታ ሟችና ለመበስበስ የተገዛ የሰው ሕይወት ማለት ነው፤ ይህም የሥጋን ትንሣኤ መካድ አይደለም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” የሚለው “ወንድሞችና እህቶች” ተብሎም ሊተረጎም ይችላል፤ ግሪክኛው “ወንድሞች” ይላል፣ ነገር ግን መላውን ጉባኤ በአካታችነት ሊያመለክት ይችላል።
