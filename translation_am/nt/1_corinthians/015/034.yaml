lexical_decisions:
- source_word: ἐκνήψατε
  choice: ወደ ልቦናችሁ ተመለሱ
  rationale: የአንድ ጊዜ ወሳኝ ጥሪውንና ከስካር የመንቃት ዘይቤያዊ ሐሳቡን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቀጥተኛው ምስል በግርጌ ማስታወሻ ተጠብቋል።
- source_word: δικαίως
  choice: በትክክል
  rationale: ትእዛዙን የሚያሻሽል ተውሳከ ግስ ሆኖ ‘በተገቢው ሁኔታ’ የሚለውን ሐሳብ ያስተላልፋል፤ ከጽድቅ ጋር የተያያዘ ከባድ ቴክኒካዊ ፍቺ አያስገባም።
- source_word: μὴ ἁμαρτάνετε
  choice: ኃጢአት መሥራታችሁንም አትቀጥሉ
  rationale: ከμή ጋር ያለውን የአሁን ጊዜ ትእዛዝ ቀጣይነት ያሳያል፤ ሁሉም በዚያው ጊዜ ተመሳሳይ ኃጢአት እየሠሩ ነው ብሎ አይወስንም።
- source_word: ἀγνωσίαν θεοῦ
