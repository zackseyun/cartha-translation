  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: am
  text: 'በተገቢው ሁኔታ ልባችሁን መልሱ[a]፤ ኃጢአት መሥራታችሁንም አትቀጥሉ[b]። አንዳንዶች ስለ እግዚአብሔር እውቀት የላቸውምና። ይህን የምናገረው ለእፍረታችሁ ነው።


    [a] ወይም፣ “በተገቢው ሁኔታ ከስካር ንቁ።” ግሱ በቀጥታ ከስካር ማገገምን ወይም ልብን መመለስን ያሳያል፤ እዚህ ግን በዘይቤ ተጠቅሟል።


    [b] ወይም፣ “ኃጢአት አትሥሩ” ወይም “ኃጢአት መሥራት አቁሙ።” የግሪኩ የአሁን ጊዜ ትእዛዝ የቀጠለ ወይም የተለመደ ድርጊትን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
