- issue: የμὴ ἁμαρτάνετε ቀጣይነት
  choice: ኃጢአት መሥራታችሁን አትቀጥሉ
  alternative: ኃጢአት አትሥሩ / ኃጢአት መሥራት አቁሙ
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ወይም ልማዳዊ ድርጊትን ሊከለክል ይችላል፤ ሆኖም ይህ ገጽታዊ ፍቺ ፍጹም የማያሻማ ስላልሆነ አማራጮቹ በማስታወሻ ተጠብቀዋል።
