  rationale: ‘ስለ እግዚአብሔር አለማወቅ’ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ድንቁርና አላቸው’ የሚለውን አስቸጋሪ ቀጥተኛ ቅርጽ ያስወግዳል።
- source_word: τινες
  choice: አንዳንዶች
  rationale: ከአድማጮቹ ወይም ከእነርሱ ጋር ከተያያዙት መካከል ያለን ያልተወሰነ ክፍል በተፈጥሯዊነት ይገልጣል።
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: ይህን የምናገረው ለእፍረታችሁ ነው
  rationale: የጳውሎስን የገሠጻ ድምፅና ንግግሩ ከአድማጮቹ እፍረት ጋር ያለውን ግንኙነት ይጠብቃል፤ በግልጽ የዓላማ ንባብ ብቻ አይገድበውም።
theological_decisions:
