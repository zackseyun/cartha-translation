id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: am
  text: 'መሲሑ[a] ከሙታን እንደ ተነሣ የሚሰበክ ከሆነ፣ ከእናንተ መካከል አንዳንዶች፣ “የሙታን ትንሣኤ የለም” እንዴት ይላሉ?


    [a] ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ በዋናው ጽሑፍ የማዕረግ ትርጉሙ ተጠብቋል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ በዋናው ጽሑፍ የማዕረግ ትርጉሙ ተጠብቋል።
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: በዚህ አውድ ቃሉ እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚያሳየው “መሲሑ” ተመርጧል፤ “ክርስቶስ” በማስታወሻ ቀርቧል።
- source_word: κηρύσσεται
  choice: የሚሰበክ
  rationale: የአሁን ጊዜ ተገብሮ ቅርጹንና በሕዝብ ፊት በቀጣይነት የሚደረገውን አዋጅ ያሳያል።
- source_word: ἐκ νεκρῶν ἐγήγερται
  choice: ከሙታን እንደ ተነሣ
  rationale: የትንሣኤውን ድርጊትና የቀጠለውን ውጤት በተፈጥሯዊ አማርኛ ያቀርባል፤ ድርጊቱን ያደረገውን በግልጽ ባለመጥቀስ የግሪኩን መለኮታዊ ተገብሮ አመልካችነት አይዘጋውም።
- source_word: πῶς
  choice: እንዴት
  rationale: በአውዱ ያለውን የማይጣጣምነት አጽንዖት ያለው የክርክር ጥያቄ ይጠብቃል።
- source_word: ἐν ὑμῖν τινες
  choice: ከእናንተ መካከል አንዳንዶች
  rationale: በቆሮንቶስ ማኅበረሰብ ውስጥ ያሉ የተወሰኑ ሰዎችን በግልጽና ተፈጥሯዊ አማርኛ ይጠቁማል።
- source_word: ἀνάστασις νεκρῶν
  choice: የሙታን ትንሣኤ
  rationale: የግሪኩን የባለቤትነት ግንኙነትና በጥቅሉ የሙታንን ትንሣኤ የሚያመለክተውን የጳውሎስ አገላለጽ ይጠብቃል።
- source_word: οὐκ ἔστιν
  choice: የለም
  rationale: የመኖር ክህደቱን በአጭርና ተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በጳውሎስ ንግግር Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: እዚህ ቃሉ የተቀባውን ንጉሥ የሚያመለክት የማዕረግ ኃይል አለው፤ “መሲሑ” ይህን የትርጉም ኃይል ይጠብቃል፣ “ክርስቶስ”ም እንደ ተለመደ አማራጭ በማስታወሻ ቀርቧል።
- issue: ἐγήγερται የተገብሮ ቅርጽና ድርጊት አድራጊው
  choice: ከሙታን እንደ ተነሣ
  alternative: ከሙታን እንደ ተነሣ ተደረገ
  rationale: ተፈጥሯዊው የአማርኛ አገላለጽ ትንሣኤውን ያረጋግጣል፣ ድርጊቱን ያደረገውን ግን አይጨምርም፤ በዚህም የግሪኩ ተገብሮ ቅርጽ ሊያመለክተው የሚችለው የእግዚአብሔር ድርጊት ክፍት ሆኖ ይቀራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጳውሎስ የክርክር ጥያቄ አጽንዖት ተጠብቋል።
