revisions:
- from: አለበለዚያ፣ ስለ ሙታን[a] የሚጠመቁት ምን ያደርጋሉ? ሙታን ፈጽሞ የማይነሡ ከሆነ፣ ታዲያ ስለ እነርሱ ለምን ይጠመቃሉ?
  to: አለበለዚያ፣ ለሙታን[a] የሚጠመቁት ምን ያደርጋሉ? ሙታን ፈጽሞ የማይነሡ ከሆነ፣ ታዲያ ለእነርሱ ለምን ይጠመቃሉ?
  rationale: The revision replaces the potentially ‘concerning’ sense of ስለ with ለ, a natural Amharic equivalent for the broad and disputed ὑπέρ relation. It does not endorse proxy baptism or any doctrinal explanation. The repeated construction follows the Greek repetition, and the footnote explicitly preserves the interpretive uncertainty.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:51Z'
review_pass:
  verdict: revise
  source_fidelity: The two occurrences of ὑπέρ with the genitive should be represented by a more direct Amharic ‘for/on behalf of’ construction. ስለ ሙታን can naturally mean ‘concerning the dead’ and therefore weakens the relation expressed by ὑπέρ. ለሙታን retains a broad ‘for’ sense without deciding the disputed practice; the footnote preserves the principal alternatives.
  naturalness: The draft is generally clear and appropriately formal. The revised wording is idiomatic modern standard Amharic. The footnote’s final clause is adjusted because saying that the practice itself ‘is not certain’ is less natural than saying it is not known exactly what practice Paul refers to.
  terminology: ጥምቀት/ይጠመቃሉ and ይነሡ are suitable established biblical terms. The repetition of ለሙታን and ለእነርሱ preserves the Greek parallelism and antecedent.
  issues:
  - severity: medium
    issue: The main text renders ὑπὲρ τῶν νεκρῶν and ὑπὲρ αὐτῶν as ስለ ሙታን / ስለ እነርሱ.
    rationale: Although ስለ can sometimes convey a broad causal or beneficiary relation, its common sense ‘about/concerning’ is insufficiently precise for ὑπέρ here. ለ... preserves a direct but still noncommittal ‘for’ relation, while the note retains the debated alternatives.
  - severity: low
    issue: The footnote says the practice itself is ‘not certain.’
    rationale: The uncertainty concerns the precise historical practice Paul references, not whether there was a practice. Rephrasing this avoids an unnatural and potentially misleading statement.
  revised_text: አለበለዚያ፣ ለሙታን[a] የሚጠመቁት ምን ያደርጋሉ? ሙታን ፈጽሞ የማይነሡ ከሆነ፣ ታዲያ ለእነርሱ ለምን ይጠመቃሉ?
  revised_footnotes:
