    text: ወይም፦ “መጀመሪያ ተፈጥሯዊው አካል ... ከዚያ መንፈሳዊው አካል።” ጳውሎስ በዚህ ቁጥር “አካል” የሚለውን ቃል ቢተወውም፣ በአቅራቢያው አውድ ቃሉ በግልጽ ተጠቅሷል።
