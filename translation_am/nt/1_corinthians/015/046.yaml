review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence and the substantival force of πνευματικόν and ψυχικόν. However, the final added verb, “ይመጣል” (“comes”), is not present in the Greek, whose last two substantival adjectives remain elliptical. A revision can preserve this concise parallelism without reducing clarity.
  naturalness: “ተፈጥሯዊው አስቀድሞ ነው” is understandable, but the Greek’s corrective contrast is more naturally and economically expressed in Amharic with “... እንጂ.” Retaining the ellipsis in the last clause gives a formal, readable biblical register.
  terminology: “መንፈሳዊው” suitably renders πνευματικόν without adding “አካል.” “ተፈጥሯዊው” is an acceptable non-pejorative rendering of ψυχικόν in this resurrection-context contrast. The notes appropriately identify “ነፍሳዊው” as a more literal alternative and explain the contextual possibility of “አካል.”
  issues:
  - severity: low
    issue: The main text adds “ይመጣል” in the final clause.
    rationale: ἔπειτα τὸ πνευματικόν contains no verb. Although the addition is inferable from the context, it unnecessarily explicates the Greek’s deliberately compact, parallel construction.
  - severity: low
    issue: The corrective δεύτερον ἀλλά is rendered as an independent assertion rather than an explicit correction.
    rationale: Using “እንጂ” more directly represents the Greek “not X, but Y” contrast in idiomatic Amharic.
  revised_text: ነገር ግን መንፈሳዊው ቀድሞ አይደለም፤ ተፈጥሯዊው እንጂ፤ ከዚያም መንፈሳዊው።
  revised_footnotes:
