base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: am
  text: ነገር ግን መንፈሳዊው ቀድሞ አይደለም፤ ተፈጥሯዊው እንጂ፤ ከዚያም መንፈሳዊው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: ቃሉ የጊዜንና የቅደም ተከተልን ሐሳብ ያሳያል፤ “አስቀድሞ” በአማርኛ ይህን ንጽጽር በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: πνευματικόν
  choice: መንፈሳዊው
  rationale: ገላጭ ቃሉ ከስም ጋር ሳይቀርብ እንደ ስም ሆኖ ተጠቅሟል። “አካል”ን በዋናው ጽሑፍ ሳይጨምር የግሪኩን አጭርነትና ሰፊ አመልካችነት ይጠብቃል።
- source_word: ψυχικόν
  choice: ተፈጥሯዊው
  rationale: በዚህ አውድ ቃሉ የመደበኛው ሕያው ሕይወት የሆነውን ከመንፈሳዊው ጋር ያነጻጽራል። “ተፈጥሯዊው” ሥጋዊነትን ብቻ ወይም የሞራል እንከንን ሳያስገባ ሐሳቡን በቀላሉ ያቀርባል።
- source_word: ἔπειτα
  choice: ከዚያ
  rationale: ከመጀመሪያው ቀጥሎ የሚመጣውን የጊዜ ቅደም ተከተል ግልጽ ያደርጋል።
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: ነገር ግን ... አይደለም፤ ... ነው
  rationale: ጳውሎስ የተገመተውን ቅደም ተከተል የሚያርምበትን ድርብ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በψυχικόν እና πνευματικόν መካከል ያለው ንጽጽር
  choice: በትንሣኤ ክርክሩ ውስጥ ተፈጥሯዊው አስቀድሞ፣ መንፈሳዊውም ከዚያ እንደሚመጣ የሚያሳይ ቅደም ተከተል
  alternative: ንጽጽሩ በተፈጥሯዊ አካልና በመንፈሳዊ አካል መካከል ብቻ ነው፤ ወይም መንፈሳዊ ባልሆኑና መንፈሳዊ በሆኑ ሰዎች መካከል ነው
  rationale: በቁጥር 44 ላይ “አካል” በግልጽ ቢገኝም፣ በዚህ ቁጥር ቃሉ ተትቷል። ስለዚህ ትርጉሙ ንጽጽሩን ወደ “አካል” ብቻ ሳያጠብ የግሪኩን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በግሪኩ የተተወውን “አካል” በዋናው ጽሑፍ አለመጨመር የአውዱን ሥነ መለኮታዊ ውጥረትና አሻሚነት ይጠብቃል፤ ለአንባቢውም በማስታወሻ ተብራርቷል።
