  text: አትታለሉ፤ መጥፎ ማኅበር መልካም ሥነ ምግባርን ያበላሻል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መጥፎ ውይይቶች መልካም ሥነ ምግባርን ያበላሻሉ።” የግሪክ ቃሉ ማኅበርን ወይም ውይይትን ሊያመለክት ይችላል፤ በአውዱ ግን «ማኅበር» የሚለው ሰፊ ትርጉም ይበልጥ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: አትታለሉ
  rationale: የግሪክ አገላለጹን ተገብሮአዊ/መካከለኛ ቅርጽ ሳይገድብ፣ ማታለሉ ከራስም ሆነ ከሌሎች ሊመጣ የሚችል መሆኑን የሚጠብቅ ተፈጥሯዊ የአማርኛ ማስጠንቀቂያ ነው።
- source_word: φθείρουσιν
  choice: ያበላሻል
  rationale: በሥነ ምግባር ላይ የሚደርስን መበላሸት በግልጽና በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ያጠፋል’ ከሚለውም ያነሰ የተጋነነ ነው።
- source_word: ἤθη
  choice: ሥነ ምግባር
  rationale: ቃሉ በዚህ አውድ ማኅበራዊ ሥርዓትን ብቻ ሳይሆን የሰውን ሥነ ምግባራዊ ባሕርይና ልማድ ያመለክታል።
- source_word: χρηστὰ
  choice: መልካም
  rationale: ቃሉ ἤθηን በሥነ ምግባራዊ መልኩ ይገልጻል፤ ‘መልካም’ ቀላል፣ ክቡርና ትርጉሙን ያልጨመረ ምርጫ ነው።
- source_word: ὁμιλίαι
  choice: ጓደኝነት
  rationale: ቃሉ መተባበርን፣ አብሮነትን ወይም ውይይትን ሊያመለክት ይችላል። በዚህ ምሳሌያዊ ንግግር ሰው ከሌሎች ጋር የሚኖረውን ቅርብ ግንኙነት የሚያሳየው ‘ጓደኝነት’ ለዋናው ጽሑፍ ተፈጥሯዊ ነው፤ የ‘ውይይት’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: κακαί
  choice: መጥፎ
  rationale: በሥነ ምግባር ጎጂ የሆነውን ጓደኝነት በቀጥታ ይገልጻል፤ ‘ክፉ’ ከሚለው የበለጠ ተፈጥሯዊና ያልተጋነነ ነው።
