- source_word: οὕτως καὶ γέγραπται
  choice: እንዲሁም፣ … ተብሎ ተጽፎአል
  rationale: “እንዲሁም” ከቀደመው ሙግት ጋር ያለውን ትስስር ያስጠብቃል፤ “ተብሎ ተጽፎአል” ደግሞ የቅዱስ መጽሐፍ ጥቅስ ማስገቢያን በተፈጥሯዊ አማርኛ ያቀርባል።
