  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: am
  text: 'እንዲሁም፣ “የመጀመሪያው ሰው አዳም ሕያው ፍጡር ሆነ”[a] ተብሎ ተጽፎአል፤ የመጨረሻው አዳም ግን ሕይወት ሰጪ መንፈስ ሆነ።[b]


    [a] “ሕያው ነፍስ ሆነ” ተብሎም ሊተረጎም ይችላል፤ ይህም የዘፍጥረት 2፥7ን ባሕላዊ አተረጓጎም ያስተጋባል።


    [b] “ሕይወትን የሚሰጥ መንፈስ ሆነ” ተብሎም ሊተረጎም ይችላል። ሐረጉ የመጨረሻውን አዳም ከመጀመሪያው አዳም ጋር በማነጻጸር ይገልጸዋል፤ የግሪክ አገላለጹ ባሕርይን የሚገልጽ ነው እንጂ ክርስቶስን ከቅዱስ መንፈስ ጋር በቀጥታ የሚለይ መሆኑን የግድ አያሳይም።'
  philosophy: optimal-equivalence
