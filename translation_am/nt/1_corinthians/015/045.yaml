  rationale: የጳውሎስን የአዳምና የክርስቶስ ምሳሌያዊ ንጽጽር በተለመደና ትክክለኛ አገላለጽ ያስተላልፋል።
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: ሕይወት ሰጪ መንፈስ
