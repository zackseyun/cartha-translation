  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: am
  text: እንግዲህ፣ እኔ ብሆን ወይም እነርሱ ቢሆኑ፣ እንዲሁ[a] እንሰብካለን፤ እናንተም እንዲሁ አመናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «የምንሰብከው ይህንኑ ነው፤ እናንተም ያመናችሁት ይህንኑ ነው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: እኔም ሆንሁ እነርሱ
  rationale: የሁለት አማራጮችን ንጽጽር በተፈጥሯዊና በክቡር አማርኛ ያቀርባል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ስለ ትንሣኤ ምስክሮች የተነገረው ሐሳብ የሚወጣውን መደምደሚያ ያመለክታል።
- source_word: ἐκεῖνοι
  choice: እነርሱ
  rationale: በአውዱ የተጠቀሱትን ሌሎች ሐዋርያትና ምስክሮች ያመለክታል፤ ከዚያ በላይ መግለጫ አይጨምርም።
- source_word: οὕτως ... οὕτως
  choice: ይህንኑ ነው ... ይህንኑ ነው
  rationale: የተሰበከውና የታመነው መልእክት አንድ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ የምንባቡን ትይዩነትም ይጠብቃል። ‘እንዲሁ’ የሚለው ይበልጥ ቃል በቃል አማራጭ በማስታወሻ ቀርቧል።
- source_word: κηρύσσομεν
  choice: የምንሰብከው
  rationale: የሕዝብ ፊት የሚደረግን የወንጌል አዋጅ ይገልጻል፤ የብዙ ቁጥሩም ጳውሎስንና ሌሎቹን ሐዋርያት በአንድነት ያካትታል።
- source_word: ἐπιστεύσατε
  choice: ያመናችሁት
  rationale: ቆሮንቶሳውያን ከዚህ በፊት ለተሰበከላቸው መልእክት በእምነት ምላሽ መስጠታቸውን በቀጥታ ያሳያል።
theological_decisions:
- issue: የሐዋርያት ስብከት አንድነት ወሰን
  choice: ጳውሎስም ሆነ ሌሎቹ ሐዋርያት ያወጁት በቀደመው አውድ የተጠቃለለውን አንድ መልእክት መሆኑን፣ ቆሮንቶሳውያንም ያመኑት ይህንኑ መሆኑን ያሳያል።
  alternative: ተደጋጋሚው οὕτως በዋነኝነት የስብከቱንና የማመኑን ሁኔታ ወይም መንገድ እንደሚያጎላ መረዳት።
  rationale: የተደጋገመው οὕτως ስብከቱንና እምነቱን ከ15፥1-10 ይዘት ጋር ያያይዛል፤ ነገር ግን ጥቅሱ ከሚናገረው በላይ ስለ ቤተ ክርስቲያን ሥልጣን ወይም አወቃቀር የዶክትሪን ድምዳሜ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር በ«ይህንኑ ነው» ድግግሞሽ ተጠብቋል፤ ይበልጥ ቃል በቃል የሆነው አቀራረብ በማስታወሻ ቀርቧል።
