    text: አንዳንድ የእጅ ጽሑፎች በመጀመሪያው ሐረግ፣ “ሞት ሆይ፣ መውጊያህ የት ነው?” ይላሉ። ይህ ንባብ በኪንግ ጄምስ ትርጉምና በሌሎች ባህላዊ ትርጉሞች ተንጸባርቋል።
