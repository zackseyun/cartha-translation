lexical_decisions:
- source_word: ποῦ
  choice: ወዴት አለ?
  rationale: የፌዝና የተግዳሮት ኃይል ያለውን አጠያያቂ ተውሳከ ግስ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በግሪኩ የሌለውን ‘አሁን’ የሚል አጽንዖት አይጨምርም።
- source_word: σου
