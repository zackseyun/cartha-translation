- source_word: θάνατε
  choice: ሞት ሆይ
  rationale: የጥሪ ቅርጹንና ሞትን እንደ ሰው በቀጥታ የመናገሩን ግጥማዊ ኃይል ይጠብቃል።
- source_word: νῖκος
  choice: ድል
  rationale: ቃሉ ድልን ወይም አሸናፊነትን ያመለክታል፤ ‘ድል’ አጭር፣ ግልጽና ከቁጥር 54 አውድ ጋር የሚስማማ ነው።
- source_word: κέντρον
  choice: መውጊያ
  rationale: κέντρον የሚወጋ ጫፍን፣ መንደፊያን ወይም መውጊያን ሊያመለክት ይችላል። ‘መውጊያ’ በዚህ አውድ ሞት የሚጎዳበትን ኃይል በግልጽ ያሳያል፣ በቁጥር 56 ያለውንም ማብራሪያ ይደግፋል።
theological_decisions:
- issue: በመጀመሪያው ሐረግ ያለው የጽሑፍ ልዩነት
  choice: የSBLGNTን νῖκος ተከትሎ በዋናው ጽሑፍ ‘ድልህ’ ተብሏል።
  alternative: አንዳንድ የእጅ ጽሑፎችን ተከትሎ መጀመሪያውን ሐረግ ‘ሞት ሆይ፣ መውጊያህ ወዴት አለ?’ ብሎ መተርጎም።
  rationale: የቀረበው ዋና የግሪክ ጽሑፍ νῖκος የሚለውን ንባብ ይዟል፤ ይህም በቁጥር 54 ሞት በድል ስለመዋጡ ከተነገረው ጋር ይጣጣማል። ታዋቂው ተለዋጭ ንባብ ግን በማስታወሻ ተጠብቋል።
