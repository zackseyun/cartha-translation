  verdict: revise
  source_fidelity: The temporal sequence and both ὅταν clauses are retained accurately. «ሲያስረክብ» conveys παραδιδῷ well, «ለእግዚአብሔር አብ» appropriately presents the likely appositional sense, and «ሲሽር» preserves καταργήσῃ as ending/nullifying without asserting annihilation. However, «አለቅነት» is not the most natural modern equivalent for the abstract ἀρχή in this triad.
  naturalness: «መጨረሻው» is clearer in modern standard Amharic than «ፍጻሜው» for the primary text, while the latter remains a worthwhile footnote alternative. «አገዛዝ» is more idiomatic and suitably broad than «አለቅነት». Moving footnote a to the word it explains improves anchoring.
