  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: am
  text: 'ነገር ግን ሁሉ ነገር ለእርሱ በተገዛ ጊዜ፣[a] ወልድ ራሱም ሁሉን ነገር ለእርሱ ያስገዛው ለእርሱ ይገዛል፤ ይህም እግዚአብሔር በሁሉ ሁሉ እንዲሆን ነው።[b]


    [a] “ሁሉ ነገር” የሚለው “ሁሉ” ተብሎም ሊተረጎም ይችላል፤ ግሪክኛው τὰ πάντα የሚለውን አገላለጽ በተደጋጋሚ በመጠቀም የጳውሎስን ሐሳብ ሁሉን አቀፍ ስፋት ያሳያል።


    [b] “እግዚአብሔር በሁሉም ሰው ሁሉ እንዲሆን” ተብሎም ሊተረጎም ይችላል። የግሪክኛው አገላለጽ አጭርና ሰፊ ትርጉም ያለው ነው፤ ቃል በቃል “ሁሉ በሁሉ” ማለት ሲሆን፣ “በሁሉ ሁሉ” የሚለው ያንን ስፋትና አጽንዖት ይጠብቃል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሁሉ ነገር” የሚለው “ሁሉ” ተብሎም ሊተረጎም ይችላል፤ ግሪክኛው τὰ πάντα የሚለውን አገላለጽ በተደጋጋሚ በመጠቀም የጳውሎስን ሐሳብ ሁሉን አቀፍ ስፋት ያሳያል።
    reason: lexical_alternative
  - marker: b
    text: “እግዚአብሔር በሁሉም ሰው ሁሉ እንዲሆን” ተብሎም ሊተረጎም ይችላል። የግሪክኛው አገላለጽ አጭርና ሰፊ ትርጉም ያለው ነው፤ ቃል በቃል “ሁሉ በሁሉ” ማለት ሲሆን፣ “በሁሉ ሁሉ” የሚለው ያንን ስፋትና አጽንዖት ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ነገር ግን … በተገዛ ጊዜ
  rationale: ὅταν የጊዜ ንዑስ ሐረግን ያስገባል፤ δέ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ቀላል ንፅፅርና ቀጣይነት ያሳያል።
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: በተገዛ ጊዜ / ይገዛል
  rationale: ሁለቱም የὑποτάσσωን የመገዛት ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባሉ፤ ሁለተኛውም በወልድ ላይ የሚነገረውን የወደፊት ጊዜ ይጠብቃል።
- source_word: τὰ πάντα
  choice: ሁሉም ነገር / ሁሉን
  rationale: በዐውዱ ያለውን ሁሉን አቀፍ ስፋት ይጠብቃል፤ በአማርኛ የሰዋስው አገባብ መሠረት የስም ተሳቢና የቀጥታ ተሳቢ ቅርጾች ተጠቅመዋል።
- source_word: αὐτὸς ὁ υἱὸς
  choice: ወልድ ራሱም
  rationale: αὐτός የሚሰጠውን አጽንዖት “ራሱ” ይጠብቃል፤ “-ም” ደግሞ ወልድ በተጠቀሰው የመገዛት ቅደም ተከተል ውስጥ መካተቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῷ ὑποτάξαντι αὐτῷ τὰ πάντα
  choice: ሁሉን ለእርሱ ላስገዛለት
  rationale: ገላጭ የሆነውን የግሪክኛ ቦዝ አንቀጽ በአማርኛ ተዛማጅ አገላለጽ ያቀርባል፤ ሁሉን ያስገዛውና ወልድ የሚገዛለት አንድ መሆኑን ይጠብቃል።
- source_word: ἵνα ᾖ
  choice: እንዲሆን
  rationale: የἵνα ዓላማን ወይም ውጤትን የሚገልጽ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πάντα ἐν πᾶσιν
  choice: በሁሉ ሁሉ
  rationale: የግሪክኛውን አጭር፣ አጽንዖታዊና ሆን ተብሎ ሰፊ የተደረገ አገላለጽ ሳያጠብ ያቀርባል፤ አማራጭ ንባብ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: ወልድ ለሁሉን ላስገዛለት ያለው መገዛት
  choice: “ወልድ ራሱም … ይገዛል” ተብሎ የጽሑፉ ግልጽ አነጋገር ተጠብቋል።
  alternative: የመገዛቱን አነጋገር ማለዘብ ወይም በዋናው ጽሑፍ ውስጥ የኋለኛ ዘመን ሥነ መለኮታዊ ማብራሪያ መጨመር።
  rationale: ጥቅሱ በፍጻሜያዊው ቅደም ተከተል ውስጥ የወልድን መገዛት በግልጽ ይናገራል። ትርጉሙ ይህን አያደበዝዝም፣ በባሕርይ የበታችነትንም አይጨምርበትም።
- issue: የτὰ πάντα እና πάντα ἐν πᾶσιν ሁሉን አቀፍ ስፋት
  choice: “ሁሉም ነገር” እና “በሁሉ ሁሉ” የሚሉ ሰፊ አገላለጾች ተጠብቀዋል።
  alternative: የመጨረሻውን አገላለጽ ሰዎችን ብቻ እንዲያመለክት ጠበብ አድርጎ መተርጎም።
  rationale: የπᾶς ተደጋጋሚ አጠቃቀም ለጳውሎስ ሁሉን አቀፍ ክርክር ዋና ነው፤ ግሪክኛው ያልወሰነውን ትርጉሙም አይወስንም።
