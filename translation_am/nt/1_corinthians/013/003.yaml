id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: am
  text: ንብረቴንም ሁሉ አከፋፍዬ ብሰጥ፣ እንድቃጠልም[a] ሰውነቴን አሳልፌ ብሰጥ፣ ፍቅር ግን ከሌለኝ፣ ምንም አላተርፍም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች «እንድቃጠል» በሚለው ፈንታ «እንድመካ» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: አከፋፍዬ ብሰጥ
  rationale: ግሱ አንድን ነገር በክፍል በክፍል ለሌሎች የማደልን ሐሳብ ይዟል፤ ይህ አተረጓጎም የመስጠቱንም ሆነ የማከፋፈሉን ገጽታ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: ንብረቴን ሁሉ
  rationale: ሐረጉ የሰውየውን ቁሳዊ ንብረትና ይዞታ ያመለክታል፤ «ንብረቴን ሁሉ» አጭር፣ ግልጽና የተሟላነቱን አጽንዖት የሚጠብቅ ነው።
- source_word: παραδῶ
  choice: አሳልፌ ብሰጥ
  rationale: የራስን ሰውነት ለሚደርስበት ነገር አሳልፎ የመስጠትን ከባድ ሐሳብ ይጠብቃል፤ «መሥዋዕት ባደርግ» የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: τὸ σῶμά μου
  choice: ሰውነቴን
  rationale: ተጨማሪ ምሳሌያዊ ትርጓሜ ሳይጨመር ተጨባጩን የሰውነት ትርጉም በቀጥታ ያስተላልፋል።
- source_word: ἵνα καυθήσομαι
  choice: እንድቃጠል
  rationale: የSBLGNTን «መቃጠል» የሚለውን ንባብ በዓላማ ሐረግ መልክ ያስተላልፋል።
- source_word: ἀγάπην
  choice: ፍቅር
  rationale: «ፍቅር» በዘመናዊ አማርኛ ግልጽና ሰፊ ትርጉሙን የሚጠብቅ መደበኛ አቻ ነው።
- source_word: οὐδὲν ὠφελοῦμαι
  choice: ምንም አላተርፍም
  rationale: ግለሰቡ ከድርጊቶቹ ምንም ጥቅም ወይም ትርፍ እንደማያገኝ በተፈጥሯዊና አጭር አማርኛ ይገልጣል።
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: … ብሰጥ፣ …ም … ብሰጥ
  rationale: የግሪኩን ተደጋጋሚ ሁኔታዊ አወቃቀርና የሐሳቡን ደረጃ በደረጃ መጠናከር በአማርኛ ይጠብቃል።
theological_decisions:
- issue: በዓላማው ሐረግ ያለው የጽሑፍ ልዩነት
  choice: የSBLGNT ንባብ καυθήσομαι «እንድቃጠል» በዋናው ጽሑፍ ተተርጉሟል።
  alternative: καυχήσωμαι — «እንድመካ»
  rationale: የቀረበው መሠረታዊ ጽሑፍ SBLGNT ስለሆነ ዋናው ጽሑፍ የእሱን ንባብ ይከተላል። ልዩ ንባቡ ትርጉሙን በእጅጉ ስለሚለውጥ፣ ሳይደበቅ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ እንዲሆን ተደርጓል። የግሪኩ ሁለት ተከታታይ ሁኔታዊ ሐረጎችና በመጨረሻ ያለው የፍቅር ተቃርኖ ተጠብቀዋል። የግርጌ ማስታወሻው ምልክት ከሚመለከተው «እንድቃጠል» ንባብ በኋላ ተቀምጧል።
