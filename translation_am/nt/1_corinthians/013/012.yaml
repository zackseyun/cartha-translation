base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: am
  text: አሁን በመስታወት በኩል በእንቆቅልሽ መልክ እናያለን፤[a] ያን ጊዜ ግን ፊት ለፊት እናያለን። አሁን በከፊል አውቃለሁ፤ ያን ጊዜ ግን እኔም ሙሉ በሙሉ እንደታወቅሁ ሙሉ በሙሉ አውቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በመስታወት በኩል፣ በእንቆቅልሽ።” የግሪኩ አገላለጽ ቀጥተኛ ያልሆነና ግራ የሚያጋባ እይታን ያጎላል፤ “ደብዛዛ አድርገን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
