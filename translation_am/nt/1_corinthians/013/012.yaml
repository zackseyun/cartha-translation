- issue: በἐπεγνώσθην የተወው አዋቂ ማንነት
  choice: ‘እንደታወቅሁ’ በሚል ተደራጊ አገላለጽ ተጠብቋል።
  alternative: ‘እግዚአብሔር እንዳወቀኝ’
  rationale: በአውዱ እግዚአብሔር አዋቂው መሆኑ ሊገባ ቢችልም፣ ግሪኩ አዋቂውን በስም አይጠቅስም፤ ይህን ክፍትነት ትርጉሙ ጠብቋል።
