  rationale: የማየትን ምሳሌያዊ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἄρτι
  choice: አሁን
  rationale: ከτότε ጋር ያለውን የአሁንና የያኔ ንጽጽር በአጭሩ ያሳያል።
- source_word: δι’ ἐσόπτρου
  choice: በመስታወት
  rationale: διά ከዘር አገባብ ጋር የሚገልጸውን መካከለኛ መሣሪያ ያሳያል፤ ቃል በቃል ‘በመስታወት በኩል’ ማለት በአማርኛ ምስሉን ሊያዛባ ስለሚችል ተፈጥሯዊው አገላለጽ ተመርጧል።
- source_word: ἐν αἰνίγματι
  choice: እንቆቅልሽ በሆነ መንገድ
  rationale: αἴνιγμα የጨለማነትን ብቻ ሳይሆን ቀጥተኛ ያልሆነና ግራ የሚያጋባ ግንዛቤን ያመለክታል፤ የስሙን ምሳሌ ይጠብቃል።
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: ፊት ለፊት
  rationale: ቀጥተኛና ያልተሸፈነ ግንኙነትን የሚያሳይ የተለመደ አማርኛ ፈሊጥ ነው።
- source_word: γινώσκω ἐκ μέρους
  choice: በከፊል አውቃለሁ
  rationale: የአሁኑን ዕውቀት ውሱንነት በግልጽ እና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπιγνώσομαι
  choice: ሙሉ በሙሉ አውቃለሁ
  rationale: ከ‘በከፊል’ ጋር ያለውን ንጽጽር ይጠብቃል፤ ሁሉን አዋቂነትን የሚያመለክት ተጨማሪ ሐሳብ አያስገባም።
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: እኔም ሙሉ በሙሉ እንደታወቅሁ
