    issue: δι’ ἐσόπτρου is rendered only as በመስታወት.
    rationale: This can mean “in a mirror” or “by means of a mirror,” whereas διά with the genitive explicitly conveys mediated perception “through/by way of” a mirror. Adding በኩል preserves the source relation naturally.
