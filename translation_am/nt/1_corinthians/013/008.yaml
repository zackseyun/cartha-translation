  register: ዘመናዊ፣ ክቡርና ለመደበኛ አማርኛ አንባቢ ግልጽ የሆነ አጻጻፍ። የግሪኩ ሦስት ተከታታይ ሐረጎችና በπαύω እና καταργέω መካከል ያለው የግስ ልዩነት ተጠብቋል።
