base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: am
  text: ፍቅር ፈጽሞ አይከሽፍም።[a] ትንቢቶች ቢኖሩ ግን ይወገዳሉ፤ ልሳናት[b] ቢኖሩ ይቆማሉ፤ እውቀት ቢኖር ይወገዳል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍቅር ፈጽሞ አይወድቅም” ወይም “ፍቅር ፈጽሞ አያበቃም።”
    reason: lexical_alternative
  - marker: b
    text: “ልሳናት” የሚለው “ቋንቋዎች” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: c
    text: “ይወገዳሉ” እና “ይወገዳል” ተብለው በትንቢቶችና በእውቀት ሐረጎች የተተረጎሙት ከአንድ የግሪክ ግስ ናቸው።
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: የግሪኩን ሰፊ ትርጉም በተፈጥሯዊና በተለመደ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὐδέποτε
  choice: ፈጽሞ አይ-
  rationale: ፍጹም እምቢታውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πίπτει
  choice: አይወድቅም
  rationale: የግሪኩን መሠረታዊ ምስል ይጠብቃል፤ በአውዱም ፍቅር እንደማይፈርስና እንደማያበቃ ሊስተዋል ይችላል። ትርጉማዊ አማራጮቹ በማስታወሻ ቀርበዋል።
- source_word: προφητεῖαι
  choice: ትንቢቶች
  rationale: የትንቢት መልእክቶችን ወይም የመናገር ተግባራትን በተለመደው መጽሐፍ ቅዱሳዊ ቃል ይገልጣል።
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: ይወገዳሉ / ይወገዳል
  rationale: ከሥራ መውጣትን ወይም ተግባሩ መቋረጡን ያስተላልፋል፤ በሁለቱ ሐረጎችም የግሱን አንድነት ይጠብቃል።
- source_word: γλῶσσαι
  choice: ልሳናት
  rationale: በ1 ቆሮንቶስ 12–14 ያለውን የጸጋ ስጦታ አውድ የሚጠብቅ የተለመደ ቃል ነው፤ “ቋንቋዎች” የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: παύσονται
  choice: ይቆማሉ
  rationale: መቋረጥን በቀጥታ ይገልጣል፣ ከκαταργέω ትርጉምም የግስ ልዩነቱን ይጠብቃል።
- source_word: γνῶσις
  choice: እውቀት
  rationale: ከቀጣዩ አውድ ከከፊል ማወቅ ጋር ያለውን ትስስር የሚጠብቅ መደበኛ ትርጉም ነው።
theological_decisions:
- issue: በ“Ἡ ἀγάπη οὐδέποτε πίπτει” ውስጥ πίπτει ያለው ትርጉም
  choice: ፍቅር ፈጽሞ አይወድቅም
  alternative: ፍቅር ፈጽሞ አይከሽፍም / ፍቅር ፈጽሞ አያበቃም
  rationale: ዋናው ጽሑፍ የግሪኩን ምስልና ከቀጣዮቹ የመቋረጥ ግሶች ያለውን ልዩነት ይጠብቃል፤ የአውዱ ትርጉሞች በማስታወሻ ቀርበዋል።
- issue: በዚህ ምዕራፍ γλῶσσαι የሚለው ቃል ስሜት
  choice: ልሳናት
  alternative: ቋንቋዎች
  rationale: “ልሳናት” የጸጋ ስጦታውን የንግግር አውድ ይጠብቃል፤ ክስተቱ በትክክል ምን እንደነበር ያለውን ክርክር ግን አይወስንም።
- issue: በትንቢቶችና በእውቀት ሐረጎች καταργέω ያለው ትርጉም
  choice: ይወገዳሉ / ይወገዳል
  alternative: ይሻራሉ / ከሥራ ውጭ ይሆናሉ
  rationale: የግሪኩን አንድ ግስ በሁለቱም ሐረጎች ወጥነት ባለው መንገድ ያቀርባል፤ ፍጹም መጥፋትን አስገድዶ አያስገባም።
