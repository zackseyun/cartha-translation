base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: am
  text: ሕፃን ሳለሁ፣ እንደ ሕፃን እናገር ነበር፣ እንደ ሕፃን አስብ ነበር፣ እንደ ሕፃንም አመዛዝን ነበር። ወንድ ሰው በሆንኩ ጊዜ ግን፣ የሕፃኑን ነገሮች[a] ተውኩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «የሕፃኑ ነገሮች»፤ «የሕፃን ጠባይ» ወይም «የሕፃንነት መንገዶች» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: ሕፃን
  rationale: ቃሉ ትንሽ ልጅን እና ከዕድገት አንጻር ያለመብሰልን ሊያመለክት ይችላል። «ሕፃን» ከἀνήρ ጋር ያለውን የልጅነትና የአዋቂነት ንጽጽር በግልጽ ያስተላልፋል።
- source_word: ἐλάλουν
  choice: እናገር ነበር
  rationale: ያለፈውን ቀጣይ ወይም የተለመደ ድርጊት የሚያሳየውን የግሪኩን ኢምፐርፌክት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐφρόνουν
  choice: አስብ ነበር
  rationale: በዚህ ሦስትዮሽ ውስጥ አስተሳሰብን በአጭርና በተፈጥሯዊ አነጋገር ይገልጣል።
- source_word: ἐλογιζόμην
  choice: አመዛዝን ነበር
  rationale: ከ«አስብ ነበር» ተለይቶ የማገናዘብንና የመመዘንን ሂደት ያሳያል።
- source_word: γέγονα
  choice: በሆንኩ ጊዜ
  rationale: ወደ አዲስ የዕድገት ሁኔታ መሸጋገሩን በአማርኛ የጊዜ ሐረግ ተፈጥሯዊ በሆነ መንገድ ያቀርባል።
- source_word: ἀνήρ
  choice: ወንድ ሰው
  rationale: የግሪኩን ወንዳዊ ነጠላ ስም በግልጽ ይጠብቃል፤ ጳውሎስ የራሱን ከልጅነት ወደ አዋቂነት መድረስ ምሳሌ አድርጎ እየተናገረ ነው።
- source_word: κατήργηκα
  choice: ተውኩ
  rationale: በዚህ የዕድገት ምሳሌ ውስጥ የልጅነት ነገሮችን ወደ ኋላ መተውን በግልጽና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ τοῦ νηπίου
  choice: የሕፃንነትን ነገሮች
  rationale: የግሪኩን «የሕፃኑ ነገሮች» የሚለውን ሰፊ አገላለጽ ይጠብቃል፤ ከዚህ በፊት የተጠቀሱትን ንግግር፣ አስተሳሰብና አመዛዛን በጋራ ሊያካትት ይችላል።
