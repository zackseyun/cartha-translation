  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: am
  text: ምክንያቱም በከፊል[a] እናውቃለን፣ በከፊልም ትንቢት እንናገራለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ሙሉ በሙሉ ሳይሆን’፤ የግሪኩ ፈሊጣዊ አነጋገር ቃል በቃል ‘ከአንድ ክፍል’ ማለት ሲሆን፣ ለአጽንዖት በሁለቱም ሐረጎች ተደግሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: በከፊል
  rationale: የግሪኩን ‘ከአንድ ክፍል’ የሚል ፈሊጣዊ አነጋገር ‘በከፊል’ በማለት በተፈጥሮአዊ አማርኛ ያስተላልፋል፤ በሁለቱም ሐረጎች መደገሙም ከሚቀጥለው ሙሉነት ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን አብራሪ ወይም ምክንያታዊ ትስስር በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: γινώσκομεν
  choice: እናውቃለን
  rationale: የግሪኩን መሠረታዊ የማወቅ ትርጉም በቀጥታ ይጠብቃል፤ ወደ ‘በጥልቅ እንረዳለን’ የሚል ትርጓሜ አያጠብበውም።
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው አያያዥ ቅጥያ ሁለቱን ትይዩ ሐረጎች በተፈጥሮአዊ ሁኔታ ያገናኛል።
- source_word: προφητεύομεν
  choice: ትንቢት እንናገራለን
  rationale: በመንፈሳዊ ስጦታዎች ዐውድ ውስጥ ያለውን የትንቢታዊ ንግግር ሰፊ ትርጉም ይጠብቃል፤ ትርጉሙን ወደ ወደፊት ነገር መተንበይ ብቻ ወይም ወደ ስብከት ብቻ አያጠብበውም።
theological_decisions:
- issue: በቤተ ክርስቲያን ውስጥ የትንቢት ተግባር ምንነት
  choice: ትንቢት እንናገራለን
  alternative: የወደፊቱን እንተነብያለን፤ ወይም እንሰብካለን
  rationale: ዐውዱ ስለ መንፈሳዊ ስጦታዎች ይናገራል፤ የግሪኩ ቃል ከወደፊት ነገር መናገር ወይም ከአጠቃላይ ስብከት የሰፋ ትንቢታዊ ንግግርን ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም የምንጩን ሥነ መለኮታዊ ስፋት ክፍት ያደርጋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘በከፊል’ የሚለው መደጋገም የግሪኩን ትይዩ አወቃቀርና አጽንዖት ለመጠበቅ ሆን ተብሎ ተቀምጧል።
