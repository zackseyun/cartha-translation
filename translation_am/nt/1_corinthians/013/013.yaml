base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: am
  text: አሁን ግን እምነት፣ ተስፋና ፍቅር—እነዚህ ሦስቱ—ይኖራሉ፤ ከእነዚህ ግን የሚበልጠው ፍቅር ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: አሁንም
  rationale: νυνί የአሁኑን ወይም የመደምደሚያውን ሁኔታ ያመለክታል፤ δέ ደግሞ መጠነኛ ሽግግርን ወይም ንፅፅርን ያሳያል። «አሁንም» ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μένει
  choice: ይኖራሉ
  rationale: ግሡ መቆየትን፣ መኖርን ወይም መቀጠልን ያመለክታል። ከሦስቱ ስሞች ጋር «ይኖራሉ» ተፈጥሯዊና ግልጽ ሲሆን ጊዜያዊ ስጦታዎች ከሚያልፉበት ቀዳሚ ንፅፅር ጋርም ይስማማል።
- source_word: πίστις
  choice: እምነት
  rationale: በእምነት፣ ተስፋና ፍቅር ሦስትነት ውስጥ «እምነት» መደበኛና ተገቢው አተረጓጎም ነው፤ «መታመን» የሚለው ሐሳብ ቢኖረውም እዚህ ያለውን ሰፊ ጽንሰ ሐሳብ ሙሉ በሙሉ አይይዝም።
- source_word: ἐλπίς
  choice: ተስፋ
  rationale: በጳውሎስ አጠቃቀምና በዚህ ሦስትነት ውስጥ ἐλπίςን በቀጥታና በተፈጥሯዊነት የሚያስተላልፈው «ተስፋ» ነው።
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: «ፍቅር» የἀγάπηን ሰፊና መደበኛ ትርጉም በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: τὰ τρία ταῦτα
  choice: እነዚህ ሦስቱ
  rationale: ሐረጉ ቀደም ብለው የተጠቀሱትን እምነት፣ ተስፋና ፍቅር ይመለከታል፤ «እነዚህ ሦስቱ» የአመልካቹን ኃይል በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: μείζων
  choice: ታላቁ
  rationale: ቅርጹ ንፅፅራዊ ቢሆንም ከτούτων ጋር ያለው አገባብ ፍቅር ከሦስቱ የላቀ መሆኑን ያሳያል። «ታላቁ» ይህን ደረጃ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τούτων
  choice: ከእነዚህ
  rationale: ከμείζων ቀጥሎ ያለው የዘር ቅጽ በሦስቱ መካከል የሚደረገውን ንፅፅር ያሳያል፤ «ከእነዚህ» ቀጥተኛና ግልጽ ነው።
theological_decisions:
- issue: በጳውሎሳዊ አውድ πίστιςን መተርጎም
  choice: እምነት
  alternative: መታመን፣ ታማኝነት
  rationale: የእምነት፣ ተስፋና ፍቅር ሦስትነት «እምነት»ን ይደግፋል። «ታማኝነት» በዚህ አውድ የመጀመሪያው እድል አይደለም፤ የተለየ አስተምህሮም ወደ ጽሑፉ አልገባም።
- issue: የμείζων ንፅፅራዊ ቅርጽና የላቀነት ትርጉም
  choice: ከእነዚህ ግን ታላቁ ፍቅር ነው
  alternative: ፍቅር ከእነዚህ ይበልጣል
  rationale: ግሪኩ በቅርጹ «የሚበልጥ» ቢልም በሦስቱ ውስጥ ፍቅርን ከፍ አድርጎ ያስቀምጣል። «ታላቁ» ይህን በግልጽ ያሳያል፤ ተለዋጩ ደግሞ የንፅፅሩን ቅርጽ ይበልጥ በቀጥታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ግስ ነጠላ ቢሆንም በአማርኛ «እነዚህ ሦስቱ» ከሚለው ብዙ ቁጥር ባለቤት ጋር «ይኖራሉ» ተፈጥሯዊ ነው። በዚህ አጭር ቁጥር ውስጥ ለኅትመት አስፈላጊ የሆነ የግርጌ ማስታወሻ አልታከለም።
