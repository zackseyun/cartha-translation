- issue: በግሪኩ ያለው ወካይ ተባዕታይ ነጠላ አገላለጽ
  choice: ቆሜአለሁ ብሎ የሚያስብ
  alternative: ቆመዋል ብለው የሚያስቡ፤ እንደቆመ የሚያስብ ሰው
