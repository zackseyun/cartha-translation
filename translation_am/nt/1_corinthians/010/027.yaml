base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: am
  text: ከማያምኑ ሰዎች አንዱ ቢጋብዛችሁና መሄድ ብትፈልጉ፣ ስለ ሕሊና ሲባል ምንም ሳትጠይቁ[a] በፊታችሁ የቀረበውን ሁሉ ብሉ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምንም ሳትመረምሩ” ወይም “ምንም ሳታጣሩ።” ሐሳቡ የምግቡን አመጣጥ አትመርምሩ የሚል ነው።
    reason: lexical_alternative
  - marker: b
    text: “ሕሊና” የሚለው በሚቀጥለው ቁጥር ይብራራል፤ በዚያም ጳውሎስ የሌላውን ሰው ሕሊና ከራሱ ሕሊና ይለያል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: ከማያምኑት ሰዎች
  rationale: በዚህ አውድ ክርስቲያን ያልሆኑ አስተናጋጆችን የሚያመለክት ሲሆን፣ አጭርና ግልጽ የውስጥና የውጭ ልዩነቱን ያቆያል።
- source_word: καλεῖ
  choice: ቢጋብዛችሁ
  rationale: ቃሉ በምግብ ግብዣ አውድ ውስጥ ‘መጋበዝ’ ማለት ነው፤ ግስ ግንባታውም መላምታዊውን ሁኔታ ያሳያል።
- source_word: θέλετε πορεύεσθαι
  choice: መሄድ ብትፈልጉ
  rationale: ግብዣውን ለመቀበል ያለውን ፈቃድ ወይም ፍላጎት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: በፊታችሁ የቀረበውን ሁሉ
  rationale: በግብዣው ላይ የቀረበውን ምግብ ያመለክታል፤ ‘ሁሉ’ የπᾶνን ሰፊ ወሰን ይጠብቃል።
- source_word: ἐσθίετε
  choice: ብሉ
  rationale: የአሁን ጊዜ ትእዛዝ አጠቃላይ መመሪያን ይሰጣል፤ ‘ብሉ’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: μηδὲν ἀνακρίνοντες
  choice: ምንም ሳትጠይቁ
  rationale: የምግቡን አመጣጥ ለማጣራት ጥያቄ አታቅርቡ የሚለውን ተግባራዊ ኃይል ይገልጣል፤ የመመርመርን ሰፊ ትርጉም በማስታወሻ ይጠብቃል።
- source_word: διὰ τὴν συνείδησιν
  choice: ስለ ሕሊና ሲባል
  rationale: διά ከተሳቢ ጋር የሚገልጸውን ምክንያት ወይም ግምት ያስተላልፋል፤ ሕሊናው የማን እንደሆነ በዚህ ቁጥር አይወስንም።
theological_decisions:
- issue: በአውዱ ውስጥ የσυνείδησις ትርጉም
  choice: ‘ሕሊና’ የሚለው ቃል ባለቤቱን ሳይገልጽ እንደ አጠቃላይ የሥነ ምግባር ግምት ቀርቧል።
  alternative: በተለይ የአማኙን ራሱን ሕሊና ወይም በሚቀጥለው ቁጥር የተጠቀሰውን የሌላውን ሰው ሕሊና በግልጽ መጥቀስ።
  rationale: የግሪኩ አነጋገር በዚህ ቁጥር አጭርና ያልተወሰነ ነው፤ የሚቀጥለው ቁጥር ተጨማሪ ማብራሪያ ይሰጣል። ትርጉሙ ይህን አሻሚነት አያስወግድም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። የብዙ ቁጥር አድራሻና የክብር ቅርጽ በአማርኛ አንድ ስለሚመስሉ፣ ቅርጹ የግሪኩን የብዙ ቁጥር አድራሻ በተፈጥሯዊ ሁኔታ ይይዛል። የግሪኩ የአረፍተ ነገር ቅደም ተከተል በአማርኛ ተፈጥሯዊነት ምክንያት ተስተካክሏል።
