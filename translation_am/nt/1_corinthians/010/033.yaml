  text: እኔም እንደዚሁ በሁሉ ነገር ሁሉንም ሰው ደስ አሰኛለሁ፤ የራሴን ጥቅም ሳልፈልግ፣ የብዙዎችን ጥቅም እንጂ እፈልጋለሁ፣ እነርሱም እንዲድኑ ዘንድ።
  philosophy: optimal-equivalence
lexical_decisions:
