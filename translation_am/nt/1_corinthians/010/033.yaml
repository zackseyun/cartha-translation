  choice: ልክ … እንደ
  rationale: ከቀደመው ማሳሰቢያ ጋር የሚያገናኘውን የንጽጽር ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κἀγὼ
  choice: እኔም ደግሞ
  rationale: ‘እኔም’ የሚለውን ተጨማሪነትና ጳውሎስ ራሱን እንደ ምሳሌ ማቅረቡን ያሳያል።
- source_word: πάντα πᾶσιν
  choice: በሁሉ ነገር ሁሉን ሰው
  rationale: የግሪኩን ‘ሁሉን በሁሉ’ ያለውን ሰፊ አገላለጽ ይጠብቃል፤ የ9፥22ን የተለየ አነጋገርም አያስገባም።
- source_word: ἀρέσκω
  choice: ደስ እንደማሰኝ
  rationale: መደሰትን ወይም ደስ ማሰኘትን የሚገልጸውን መደበኛ ትርጉም ይይዛል፤ ቀጣዩ ሐረግ ዓላማው ሽንገላ ሳይሆን የሌሎች ጥቅም መሆኑን ያብራራል።
- source_word: μὴ ζητῶν
  choice: ሳልፈልግ
  rationale: ተጓዳኝ ሁኔታውንና የተናጋሪውን ዓላማ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: የራሴን ጥቅም
  rationale: σύμφορον የሚያመለክተውን ጠቃሚነት ወይም ጥቅም በግልጽ ቃል ያቀርባል።
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: የብዙዎችን ጥቅም እንጂ
  rationale: በግሪኩ የተዘለለውን σύμφορον በአማርኛ ለግልጽነት ይደግማል፤ ‘ብዙዎች’ የሚለውንም ሳያሰፋ ይጠብቃል።
- source_word: ἵνα σωθῶσιν
  choice: እነርሱ እንዲድኑ
  rationale: የዓላማውን አንቀጽና የግሱን ተገብሮ ቅርጽ ይጠብቃል፤ አዳኙንም ከጽሑፉ በላይ አይገልጽም።
