  verdict: revise
  source_fidelity: The draft accurately conveys the two consciences in view and preserves the rhetorical question. However, γάρ is left unrepresented, and «ይመዘናል» means 'is weighed/measured' more readily than the judicial/evaluative force of κρίνεται.
