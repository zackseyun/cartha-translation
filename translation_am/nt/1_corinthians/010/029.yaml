  - severity: medium
    issue: The explanatory particle γάρ is omitted.
    rationale: ἱνατί γὰρ explicitly connects the question to the clarification. «ምክንያቱም» naturally preserves this connection in Amharic.
  - severity: medium
    issue: «ይመዘናል» is not the most accurate rendering of κρίνεται.
    rationale: The Greek passive refers to being judged or evaluated. «ትፈረዳለች» retains the broad judicial/evaluative sense more directly.
  - severity: low
    issue: The initial contrast is syntactically elliptical in the draft.
    rationale: Using «የራስህን ... ሳይሆን ... ነው» clearly supplies the contrasted noun while retaining the contextual interpretation represented in the audit trail.
  - severity: low
