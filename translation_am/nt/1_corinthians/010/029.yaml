- issue: በሁለተኛው ክፍል ያለው የአጠያይቅ ድምፅ
  choice: ጥያቄው የጳውሎስ የራሱ ተቃውሞ ይሁን ወይም የሌላ ወገንን ተቃውሞ እያቀረበ ይሁን ሳይወሰን እንደ አጠያይቅ ቀርቧል።
