  rationale: የግሪኩ ጽሑፍ የተናጋሪ ለውጥን በጥቅስ ምልክት አያሳይም። ስለዚህ ትርጉሙ ሁለቱንም ሊሆኑ የሚችሉ ንባቦች ሳይዘጋ የሥነ መለኮት ውጥረቱን ይጠብቃል።
