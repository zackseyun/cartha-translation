base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: am
  text: እኛም መሲሑን[a] ለፈተና አናቅርበው፤ ከእነርሱ አንዳንዶቹ እንደፈተኑትና በእባቦች[b] እየጠፉ እንደነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “መሲሑን” በሚለው ፈንታ “ጌታን” ይላሉ።
    reason: textual_variant
  - marker: b
    text: “እባቦች” የሚለው ቃል “እፉኝቶች” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ግን በአጠቃላይ እባቦችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: እኛም … አንፈታተን
  rationale: በአውዱ ያሉትን ተከታታይ ክልከላዎች ይቀጥላል፤ የአማርኛው አሉታዊ የማሳሰቢያ ቅርጽ የግሪኩን ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: ἐκπειράζωμεν
  choice: አንፈታተን
  rationale: አንድን ሰው ያለአግባብ ለፈተና ማቅረብን የሚገልጸውን ጠንካራ የግስ ቅርጽ ይጠብቃል።
- source_word: τὸν Χριστόν
  choice: መሲሑን
  rationale: Χριστός በዚህ ስፍራ እንደ ማዕረግ ስለተጠቀሰ፣ ትርጉሙ በአማርኛ በተለመደው ‘መሲሕ’ ተገልጿል።
- source_word: καθώς
  choice: እንደ…
  rationale: የእስራኤላውያንን ምሳሌ ከአሁኑ ማሳሰቢያ ጋር የሚያነጻጽረውን ግንኙነት በተፈጥሮ ይገልጻል።
- source_word: τινες αὐτῶν
  choice: ከእነርሱ አንዳንዶቹ
  rationale: በምድረ በዳ ከነበረው ትውልድ መካከል የተወሰኑትን በግልጽ ያመለክታል።
- source_word: ἐπείρασαν
  choice: እንደፈተኑት
  rationale: ያለፈውን ታሪካዊ ድርጊት ይገልጻል፤ ተሳቢውም ከቀደመው ‘መሲሑን’ በግልጽ ተወስዷል።
- source_word: ὑπὸ τῶν ὄφεων
  choice: በእባቦች
  rationale: ὄφις በዘመናዊ አማርኛ በተፈጥሮ ‘እባብ’ ተብሎ ይተረጎማል፤ ‘በ’ የጥፋቱን አድራጊ ወይም ምክንያት ያሳያል።
- source_word: ἀπώλλυντο
  choice: እየጠፉ እንደነበር
  rationale: የግሪኩ ያልተጠናቀቀ የግስ ገጽታ ቀጣይ የነበረውን ጥፋት ያሳያል፤ ‘እየ… ነበር’ ይህን ገጽታ ይጠብቃል።
theological_decisions:
- issue: የτὸν Χριστόν ንባብና ተጠቃሽ
  choice: መሲሑን
  alternative: ጌታን፤ ወይም ክርስቶስን
  rationale: SBLGNT Χριστόν የሚለውን ንባብ ይከተላል፤ እሱም በምድረ በዳ የተፈተነውን ከመሲሑ ጋር በጠንካራ ሁኔታ ያያይዳል። አንዳንድ የእጅ ጽሑፎች ‘ጌታን’ ስለሚሉ፣ ልዩነቱ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የንጽጽር አወቃቀር በተፈጥሯዊ አማርኛ ለማቅረብ የታሪኩ ክፍል ቀድሟል፤ የክልከላው ኃይልና የἀπώλλυντο ቀጣይ ገጽታ ተጠብቀዋል።
