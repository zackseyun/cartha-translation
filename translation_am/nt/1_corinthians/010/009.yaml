revisions:
- from: ከእነርሱ አንዳንዶቹ መሲሑን[a] እንደፈተኑትና በእባቦች[b] እየጠፉ እንደነበር፣ እኛም መሲሑን አንፈታተን።
  to: እኛም መሲሑን[a] ለፈተና አናቅርበው፤ ከእነርሱ አንዳንዶቹ እንደፈተኑትና በእባቦች[b] እየጠፉ እንደነበር።
  rationale: The revision preserves the SBLGNT reading τὸν Χριστόν as መሲሑን, retains the implied pronoun in እንደፈተኑት, and represents the imperfect ἀπώλλυντο with እየጠፉ እንደነበር. It uses an idiomatic Amharic expression for improperly putting the Messiah to the test, restores the source's exhortation-then-example sequence, and corrects the textual footnote so that it reports only the actual manuscript variant.
