source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: am
  text: ነገር ግን አንድ ሰው፣ “ይህ ለመሥዋዕት የቀረበ ነው”[a] ቢላችሁ፣ ስለ ነገራችሁ ሰውና ስለ ሕሊና[b] ሲባል አትብሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ የመሥዋዕት ሥጋ ነው።” የግሪኩ ቅጽል ቃል ለመሥዋዕት የቀረበን ነገር ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ይህም የሌላውን ሰው ሕሊና ማለት ነው፤ የእናንተን ሕሊና አይደለም። ቀጣዩን ቁጥር ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: ነገር ግን አንድ ሰው … ቢላችሁ
  rationale: δέ ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር “ነገር ግን” በማለት ያሳያል፤ ἐὰν ከንዑስ አንቀጽ ጋር የሚፈጥረው ሁኔታዊ አነጋገር በተፈጥሯዊው የአማርኛ “ቢላችሁ” ተገልጧል።
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: ይህ ለመሥዋዕት የቀረበ ነው
  rationale: ἱερόθυτος ለሥርዓተ መሥዋዕት የቀረበን ነገር፣ በዚህ ዐውድ ምግብን ያመለክታል። “ለጣዖት” የሚለውን በዚህ ቃል ውስጥ በቀጥታ ስለሌለ ወደ ዋናው ጽሑፍ አልተጨመረም።
- source_word: μὴ ἐσθίετε
  choice: አትብሉት
  rationale: የክልከላውን ትእዛዝ በተፈጥሯዊ አማርኛ ይገልጣል፤ “-ት” የሚለው ተውላጠ ስም ቀደም ብሎ የተጠቀሰውን ምግብ ይመለከታል።
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: ስለ ነገራችሁ ሰው
  rationale: διά ከተሳቢ ጋር እዚህ ለዚያ ሰው ሲባል ወይም እሱን ከግምት በማስገባት መታቀብን ያሳያል፤ μηνύσαντα ደግሞ ነገሩን የገለጠውን ሰው ያመለክታል።
- source_word: καὶ τὴν συνείδησιν
  choice: እና ስለ ሕሊና
  rationale: συνείδησις “ሕሊና” ተብሎ ተተርጉሟል። የማን ሕሊና እንደሆነ ግሪኩ በዚህ ቁጥር ብቻ በቀጥታ አይገልጽም፤ ስለዚህ ዋናው ጽሑፍ አጭርነቱን ጠብቋል።
theological_decisions:
- issue: τὴν συνείδησιν የሚያመለክተው የማንን ሕሊና ነው?
  choice: በዋናው ጽሑፍ “ሕሊና” ብቻ ተብሎ የግሪኩ አጭርና ያልተገለጸ አነጋገር ተጠብቋል፤ ማብራሪያው የሌላውን ሰው ሕሊና እንደሚያመለክት ይጠቁማል።
  alternative: በዋናው ጽሑፍ “ስለ እርሱ ሕሊና” በማለት ባለቤቱን በግልጽ መጨመር።
  rationale: ቀጣዩ ቁጥር የተናጋሪው ዓላማ የራስን ሳይሆን የሌላውን ሰው ሕሊና እንደሚመለከት ያብራራል። ሆኖም በዚህ ቁጥር የግሪኩን አሻሚነት በዋናው ጽሑፍ ሳይፈቱ መጠበቅ የጳውሎስን የሐሳብ ፍሰት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “መሥዋዕት” በመጽሐፍ ቅዱሳዊና በሃይማኖታዊ አጠቃቀም የተለመደ ቃል ሲሆን፣ የግሪኩን ሥርዓታዊ መሥዋዕት ሳይገድብ ያስተላልፋል።
