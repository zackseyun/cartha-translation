id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: am
  text: የጌታን ጽዋና የአጋንንትን ጽዋ መጠጣት አትችሉም፤ ከጌታ ማዕድና ከአጋንንት ማዕድ መካፈል አትችሉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: አትችሉም
  rationale: የግሪኩን ተደጋጋሚና ቀጥተኛ የአለመቻል/የማይጣጣምነት አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ποτήριον
  choice: ጽዋ
  rationale: በመጽሐፍ ቅዱሳዊና በአምልኮ አውድ የተለመደ፣ ክብር ያለውና የመጠጫ ዕቃውን በግልጽ የሚያመለክት ቃል ነው።
- source_word: κυρίου
  choice: የጌታን / ከጌታ
  rationale: κύριοςን ‘ጌታ’ ብሎ ይጠብቃል፤ የአማርኛው ሰዋስው እንደሚጠይቀው በሁለቱ አንቀጾች የግንኙነትና የተሳትፎ ቅርጾች ተጠቅመዋል።
- source_word: πίνειν
  choice: መጠጣት
  rationale: ከ‘አትችሉም’ ጋር የሚስማማ ቀጥተኛና ተፈጥሯዊ የድርጊት ስም ነው።
- source_word: δαιμονίων
  choice: አጋንንት
  rationale: የδαιμόνιαን መንፈሳዊና ግላዊ ኃይሎች ፍቺ የሚጠብቅ መደበኛ የአማርኛ አቻ ነው።
- source_word: τραπέζης
  choice: ማዕድ
  rationale: በምግብና በኅብረት አውድ ‘ጠረጴዛ’ ከሚለው ይልቅ ተፈጥሯዊና ክብር ያለው ሲሆን፣ የጋራ ምግብና ተሳትፎ ምስሉን ይጠብቃል።
- source_word: μετέχειν
  choice: መካፈል
  rationale: በአንድ ነገር ውስጥ እውነተኛ ድርሻ ወይም ተሳትፎ መኖርን በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: καὶ
  choice: እና
  rationale: በእያንዳንዱ አንቀጽ ያሉትን ሁለት ተቃራኒ ተሳትፎዎች በቀጥታ ያገናኛል፤ የግሪኩ ትይዩነት ተጠብቋል።
theological_decisions:
- issue: በጌታ ማዕድና በአጋንንት አምልኮ መሳተፍ ያላቸው ግንኙነት
  choice: ሁለቱ ተሳትፎዎች ፈጽሞ የማይጣጣሙ መሆናቸውን በተደጋገመው ‘አትችሉም’ ማስተላለፍ
  alternative: እንደ ለስላሳ ምክር ወይም እንደ ተራ የንግግር ማጋነን መተርጎም
  rationale: οὐ δύνασθε በሁለቱም ትይዩ አንቀጾች መደገሙ ፍጹም አለመጣጣምን ያሳያል፤ ትርጉሙ ከጽሑፉ በላይ የዶክትሪን ማብራሪያ ሳይጨምር ይህን ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩ ሁለትዮሽ ትይዩ አወቃቀርና የተደጋገመው ክልከላ ተጠብቀዋል። የእንግሊዝኛው የግርጌ ማስታወሻ ከዚህ ጥቅስ ሁለተኛ አንቀጽ ጋር የማይዛመድ ስለሚመስል አልተካተተም።
