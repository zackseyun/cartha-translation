  rationale: ጥቅሱ ሦስቱን ወገኖች በግልጽ ይጠራል። ትርጉሙ የግሪክ ጽሑፉን ምድቦች ሳያሰፋ ወይም ሳያጠብ ጠብቋል፤ የምክሩንም ሥነ ምግባራዊ ኃይል ያሳያል እንጂ ጥቅሱ ያልገለጠውን የአስተምህሮ ድምዳሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “መሰናከያ አትሁኑ” የሚለው አገላለጽ በአማርኛ የመጽሐፍ ቅዱስ ንግግር የሚታወቅ ሲሆን የምንጩን ግንኙነታዊ ትርጉም በቀላሉ ያስተላልፋል።
