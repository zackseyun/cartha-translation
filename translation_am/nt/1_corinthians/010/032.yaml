- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: ለእግዚአብሔር ቤተ ክርስቲያን
  rationale: ἐκκλησία በጳውሎስ ዘንድ የአማኞችን ማኅበረሰብ በተለምዶ ያመለክታል፤ ‘የእግዚአብሔር’ የሚለው የባለቤትነት ግንኙነትም ተጠብቋል።
theological_decisions:
- issue: በጳውሎስ የሥነ ምግባር ምክር ውስጥ የተጠቀሱት ወገኖች
  choice: ጳውሎስ አይሁድን፣ ግሪኮችንና የእግዚአብሔርን ቤተ ክርስቲያን በስም ለይቶ በመጥቀስ፣ ለአንዳቸውም መሰናከያ እንዳይሆኑ ያዛል።
