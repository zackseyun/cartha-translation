  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: am
  text: ምክንያቱም፣ ወንድሞች ሆይ፣ እንዳታውቁ አልፈልግም፤ አባቶቻችን ሁሉ ከደመናው በታች ነበሩ፣ ሁሉም በባሕሩ ውስጥ አለፉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞችና እኅቶች ሆይ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ “ወንድሞች” የሚለው ቃል ወንዶችና ሴቶች ያሉበትን ጉባኤ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: እንዳታውቁ አልፈልግም
  rationale: የግሪኩን አሉታዊ አገላለጽ ይጠብቃል፤ በአማርኛም የጳውሎስን የተለመደ አገላለጽ በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: γὰρ
