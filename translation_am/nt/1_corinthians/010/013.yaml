  rationale: የጣዖት አምልኮና የኃጢአት ምኞት ማስጠንቀቂያ ያለበት የቅርብ ዐውድ የሞራል ፈተናን ያጠናክራል። ሆኖም “ፈተና” በአማርኛም መፈተንንና መከራን ሊያካትት ስለሚችል የግሪኩ አሻሚነት አልተወገደም።
- issue: “መውጫ” ፈተናውን ወዲያው ማስወገድ ወይስ በፈተናው ሥር መጽናትን የሚያስችል ዝግጅት መሆኑ
  choice: “የመውጫውን መንገድ” ተብሎ፣ ዓላማው “እንድትቋቋሙት” በሚለው ተገልጿል።
  alternative: “ማምለጫውን” ወይም “ውጤቱን”
  rationale: ἔκβασις መውጫን ወይም ውጤትን ሊያመለክት ይችላል፤ ነገር ግን τοῦ δύνασθαι ὑπενεγκεῖν የተሰጠው መንገድ ፈተናውን በጽናት ለመቋቋም እንደሚያስችል ያሳያል። ትርጉሙ ቀላል ማምለጥን አያስገባም።
