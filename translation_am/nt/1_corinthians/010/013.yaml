review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the verse’s central assertion: the experience is human/common to people, God is faithful, he does not permit it beyond the readers’ capacity, and he provides ἔκβασις so they can endure. However, the opening is redundantly and somewhat imprecisely phrased (“…በቀር ሌላ ፈተና”), and the final purpose clause awkwardly duplicates the object of endurance. The revision retains the source’s sequence and preserves the lexical breadth of πειρασμός in a note.'
  naturalness: The existing register is appropriate, but “የመውጫውን መንገድ” is pleonastic and “ፈተናውን ችላችሁ እንድትቋቋሙት” is not idiomatic modern standard Amharic. “መውጫውን” and “እንድትቋቋሙት እንድትችሉ” are clear and natural.
  terminology: “ፈተና,” “ታማኝ,” “አይፈቅድም,” and “መውጫ” are suitable. The note should give “መፈተን/to be tested” as the primary alternative rather than broadening it to “መከራ,” which is possible in some contexts but is not the direct lexical alternative identified by the source audit trail.
  issues:
  - severity: medium
    issue: The opening clause is redundant and obscures the Greek negation-plus-exception construction.
    rationale: “በሰው ሁሉ ላይ ከሚደርስ ፈተና በቀር ሌላ ፈተና አልደረሰባችሁም” adds “ሌላ” and is less direct than the source. “ለሰዎች የተለመደ ካልሆነ ፈተና አልደረሰባችሁም” faithfully expresses ‘no temptation has overtaken you except what is human/common.’
  - severity: medium
    issue: The final clause is awkward and uses a pleonastic rendering of ἔκβασις.
    rationale: “የመውጫውን መንገድ” literally compounds ‘the way of exit’; “መውጫውን” adequately renders ἔκβασις. The construction “ፈተናውን ችላችሁ እንድትቋቋሙት” is grammatically cumbersome. A purpose clause with “እንድትቋቋሙት እንድትችሉ” directly reflects τοῦ δύνασθαι ὑπενεγκεῖν.
  - severity: low
    issue: Footnote b introduces “መከራ” where the audit trail specifies ‘testing/to be tested.’
    rationale: The note should preserve the stated lexical alternative without unnecessarily shifting the semantic focus from testing to suffering.
