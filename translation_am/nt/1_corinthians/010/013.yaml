base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: am
  text: ለሰዎች የተለመደ ካልሆነ ፈተና አልደረሰባችሁም።[a] እግዚአብሔር ግን ታማኝ ነው፤ ከምትችሉት በላይ እንድትፈተኑ አይፈቅድም።[b] ነገር ግን ፈተናውን እንድትቋቋሙት እንድትችሉ፣ ከፈተናው ጋር መውጫውንም ያዘጋጃል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰብአዊ ከሆነ ፈተና በቀር” ወይም “ለሰዎች ሁሉ የተለመደ ከሆነ ፈተና በቀር።”
    reason: lexical_alternative
  - marker: b
    text: በዚህ ቁጥር “ፈተና” እና “እንድትፈተኑ” የተባሉት የግሪክ ቃላት “መፈተን” እና “እንድትፈተኑ” ተብለውም ሊተረጎሙ ይችላሉ።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ማምለጫውን” ወይም “ውጤቱን።” ሐረጉ እግዚአብሔር ፈተናውን በጽናት መቋቋም የሚያስችለውን እንደሚያዘጋጅ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
