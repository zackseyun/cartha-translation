- source_word: ποιήσει
  choice: ያዘጋጃል
  rationale: ποιέω በመሠረቱ “ያደርጋል/ይፈጥራል” ማለት ቢችልም፣ ከ“መውጫ” ጋር በዚህ ዐውድ የእግዚአብሔርን ንቁ ዝግጅት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: σὺν τῷ πειρασμῷ
  choice: ከፈተናው ጋር
  rationale: σύν የአብሮነትን ሐሳብ ይገልጻል፤ መውጫው ፈተናውን ወዲያው እንደሚያስወግድ ሳይሆን ከእርሱ ጋር እንደሚሰጥ ያሳያል።
- source_word: ἔκβασιν
  choice: የመውጫውን መንገድ
  rationale: ἔκβασις “መውጫ፣ ማምለጫ ወይም ውጤት” ሊሆን ይችላል። “የመውጫው መንገድ” በአማርኛ ግልጽ ሲሆን፣ ቀጣዩ ሐረግ ዓላማው በጽናት መቋቋም መሆኑን ይገድባል።
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: ችላችሁ እንድትቋቋሙት
  rationale: ዓላማን ወይም ውጤትን የሚገልጸውን የግሪክ አወቃቀር ይይዛል፤ ὑποφέρω በጫና ሥር ጸንቶ መቆየትን ያመለክታል።
theological_decisions:
- issue: πειρασμός/πειρασθῆναι የሞራል ፈተናን ወይስ መፈተንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ “ፈተና/እንድትፈተኑ” ተብሏል።
