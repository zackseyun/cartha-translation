  rationale: ἀνθρώπινος ሰብአዊ የሆነን ወይም ለሰዎች የተለመደን ነገር ያመለክታል። የተመረጠው አገላለጽ ፈተናቸው ለእነርሱ ብቻ የተለየ እንዳልሆነ በግልጽ ያሳያል።
- source_word: πιστός
  choice: ታማኝ
  rationale: ስለ እግዚአብሔር ሲነገር አስተማማኝነቱንና ቃሉን ጠብቆ መፈጸሙን የሚገልጽ የተለመደና ክቡር አማርኛ ነው።
- source_word: ἐάσει
  choice: አይፈቅድም
