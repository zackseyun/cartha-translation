  rationale: የግሪኩ ቃል ወደ ኃጢአት የሚስብ ፈተናንም ሆነ መፈተንን ወይም መከራን ሊያመለክት ይችላል። በቅርብ ዐውዱ የኃጢአት ማስጠንቀቂያ ቢበረታም፣ የአማርኛው “ፈተና” ይህን ሰፊ የትርጉም ክልል በተፈጥሮ ይይዛል።
- source_word: εἴληφεν
