lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: አይደለም፤ ይልቁንም
  rationale: በቀደመው ቁጥር ሊነሣ የሚችለውን የተሳሳተ ግንዛቤ የሚያርም ንጽጽራዊ አገላለጽ ነው፤ ቃል በቃል ከማቅረብ ይልቅ የግሪኩን የእርማት ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἃ θύουσιν
  choice: እነርሱ የሚሠዉትን
  rationale: ገለልተኛው አንጻራዊ ተውላጠ ስም የመሥዋዕቱን ነገር በአጠቃላይ ያመለክታል፤ ይህ አተረጓጎም ነገሩን ሳይጨምር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: θύουσιν
  choice: ይሠዉም
  rationale: ግሱ በአምልኮ አውድ መሥዋዕት ማቅረብን ያመለክታል፤ «መሠዋት» የሥርዓታዊ መሥዋዕትን ትርጉም በአጭሩ ይጠብቃል።
- source_word: δαιμονίοις
  choice: ለአጋንንት
  rationale: በአዲስ ኪዳን አጠቃቀም δαιμόνιον ገለልተኛ አናሳ አማልክትን ሳይሆን አጋንንትን ያመለክታል።
- source_word: καὶ οὐ θεῷ
  choice: እንጂ ለእግዚአብሔር አይሠዉም
  rationale: የግሪኩን «ለአጋንንት እና ለእግዚአብሔር አይደለም» ንጽጽር የአማርኛው «እንጂ ... አይ...» አወቃቀር ተፈጥሯዊና ግልጽ አድርጎ ያቀርባል። θεῷ በዚህ አውድ እውነተኛውን አምላክ ያመለክታል።
- source_word: οὐ θέλω δὲ
  choice: እናንተም ... አልፈልግም
  rationale: δέ ንግግሩን በለስላሳ ሽግግር ያስቀጥላል፤ በ«-ም» የተገለጸው ቅንብር በአማርኛ ፍሰቱን ይጠብቃል።
- source_word: κοινωνοὺς
  choice: ተካፋዮች
  rationale: κοινωνός በአንድ ነገር መካፈልንና ተሳታፊ መሆንን ያመለክታል። «ተካፋዮች» የእውነተኛ ተሳትፎን ክብደት ይጠብቃል፤ ግን ሙሉ ታማኝነትን በጽሑፉ ላይ አይጨምርም።
- source_word: τῶν δαιμονίων
  choice: ከአጋንንት ጋር
  rationale: ከκοινωνός ቀጥሎ ያለውን የባለቤት አገባብ አማርኛ በተፈጥሮ «ከ...ጋር» ብሎ ይገልጠዋል፤ ይህም ባለቤትነትን ሳይሆን የተሳትፎ ግንኙነትን ያሳያል።
- source_word: γίνεσθαι
  choice: እንድትሆኑ
  rationale: γίνομαι ወደ አንድ ሁኔታ መግባትን ያመለክታል። የአማርኛው «እንድትሆኑ» በዚህ የፍላጎት አወቃቀር ሁኔታውን መድረስ በተፈጥሯዊ መንገድ ይገልጣል።
