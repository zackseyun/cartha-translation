  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: am
  text: ነገር ግን፣ እነርሱ የሚሠዉትን ለአጋንንት እንጂ ለእግዚአብሔር እንደማይሠዉ ነው፤ እናንተም ከአጋንንት ጋር ተካፋዮች[a] እንድትሆኑ አልፈልግም።
  philosophy: optimal-equivalence
