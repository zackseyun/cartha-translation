  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: am
  text: ወይስ ጌታን ለቅንዓት እናነሣሣዋለን? ከእርሱ የበለጠ ብርቱዎች አይደለንም አይደል?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: ለቅንዓት እናነሣሣዋለን
  rationale: ግሱ አንድን ሰው ቅንዓት እንዲሰማው ማነሣሣትን ያመለክታል፤ ይህ አተረጓጎም የምንጩን ነገረ መለኮታዊ ውጥረት ሳያለዝብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: κύριος ያለውን ቀጥተኛ መጠሪያ ይጠብቃል፤ በዚህ አውድ የመለኮታዊውን ጌታ ያመለክታል።
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: ከእርሱ የበለጠ ብርቱዎች
  rationale: የንጽጽር ቅርጹንና የብዙ ቁጥር ተሳቢውን በግልጽ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የμὴ ጥያቄ የሚጠብቀው መልስ
  choice: አይደለንም አይደል?
  alternative: በእርግጥ ከእርሱ የበለጠ ብርቱዎች አይደለንም፣ አይደል?
  rationale: μὴ አሉታዊ መልስ የሚጠብቅ የንግግር ጥያቄ ነው። የተመረጠው ቅርጽ ይህን ግፊት ያስተላልፋል፣ ነገር ግን በግሪክ ውስጥ የሌለውን ግልጽ አጽንዖት አይጨምርም።
- issue: ለጌታ የተሰጠው የቅንዓት ቋንቋ
  choice: ለቅንዓት እናነሣሣዋለን
  alternative: ጌታን እናስቀናለን
  rationale: ምንጩ ለጌታ ቅንዓትን በቀጥታ ይጠቀማል። ይህን ምስላዊና የቃል ኪዳን ውጥረት እንዳለ ማቆየት ተመርጧል፤ ‘እናስቀናለን’ በዘመናዊ አማርኛ ሌላን ሰው እንዲቀና ማድረግ ወይም ምቀኝነትን ሊያስታውስ ስለሚችል አልተመረጠም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ሁለቱም የንግግር ጥያቄዎች ተጠብቀዋል፤ ምንም የግርጌ ማስታወሻ አልተጨመረም።
