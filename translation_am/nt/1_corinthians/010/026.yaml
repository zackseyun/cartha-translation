  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ከመዝሙር 24፥1 የተጠቀሰ። «በእርሷ ያለው ሁሉ» የሚለው በቃል በቃል «ሙላቷ» ማለት ነው።
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: የጌታ
  rationale: የግሪኩን የባለቤትነት ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ κύριοςንም በአዲስ ኪዳን አጠቃቀሙ መሠረት «ጌታ» ብሎ ያቀርባል።
- source_word: γάρ
  choice: ነውና
  rationale: ጥቅሱ ለቀደመው ክርክር ምክንያት እንደሚሰጥ በአማርኛ ተፈጥሯዊ የሆነው ድህረ ቅጥያ «-ና» ያሳያል።
- source_word: γῆ
  choice: ምድር
  rationale: በመዝሙሩ ጥቅስ ውስጥ ከ«ሙላቷ» ጋር ያለውን ዓለም አቀፋዊ ትርጉም ይጠብቃል።
- source_word: πλήρωμα
  choice: የሞላባት ሁሉ
  rationale: በዚህ አውድ πλήρωμα ምድርን የሞላውን ወይም በውስጧ ያለውን ሁሉ ያመለክታል፤ ይህ አገላለጽ ከቃል በቃሉ «ሙላቷ» ይልቅ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: αὐτῆς
  choice: -ባት
  rationale: የአንስታይ ነጠላዋ ተውላጠ ስም ወደ «ምድር» መመለሱን በአማርኛው ግስ ውስጥ በተገቢው መልክ ያሳያል።
theological_decisions:
- issue: በቅዱስ መጽሐፍ ጥቅስ ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: ጳውሎስ የጠቀሰው የግሪክ ጽሑፍ κύριος ይላል። «ጌታ» የአዲስ ኪዳኑን ቃል በቀጥታ ያስተላልፋል፤ የዕብራይስጡን መለኮታዊ ስም በትርጉሙ ውስጥ በግልጽ ቃል በመጨመር አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛ ተጠቅሟል። «የሞላባት ሁሉ» የመዝሙሩን ምስል እየጠበቀ የπλήρωμαን ሐሳብ በተፈጥሯዊ አነጋገር ያቀርባል።
