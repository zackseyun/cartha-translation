- source_word: λέγω
  choice: እናገራለሁ
  rationale: ከተከታዩ φημι ጋር ያለውን ቀላል የአነጋገር ልዩነት በመጠበቅ ‘መናገር’ የሚለውን ተፈጥሯዊ ግስ ይጠቀማል።
- source_word: κρίνατε
  choice: መርምሩ
  rationale: የታዘዘው ነገር የተነገረውን መመዘንና ፍርድ መስጠት ነው፤ ‘መርምሩ’ በዚህ ዐውድ የግምገማውን ኃይል ያሳያል።
