lexical_decisions:
- source_word: ὡς
  choice: እንደማናግር
  rationale: ጳውሎስ አድማጮቹን አስተዋዮች አድርጎ እንደሚያናግራቸው ያሳያል፤ በአማርኛ ዐውዱን በተፈጥሯዊ አነጋገር ያቀርባል።
- source_word: φρονίμοις
