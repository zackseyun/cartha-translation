  rationale: በግሪክ ያለውን ግልጽ አጽንዖት ይጠብቃል፤ ጳውሎስ እነርሱ ራሳቸው እንዲመዝኑ ይጠይቃል።
- source_word: ὅ
  choice: የምለውን
  rationale: ከφημι ጋር በአማርኛ ተፈጥሯዊ የሆነውን ‘የምለውን’ የሚል አንጻራዊ አገላለጽ ይፈጥራል።
- source_word: φημι
  choice: የምለውን
  rationale: ‘የምለው’ የሚለው አጭርና ተፈጥሯዊ አገላለጽ ‘what I say’ የሚለውን ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: የአድማጮቹ የንግግር ባሕርይ
  choice: ጳውሎስ ቆሮንቶሳውያንን በተግባራዊ ማስተዋል መመርመር የሚችሉ ሰዎች አድርጎ ያናግራቸዋል።
  alternative: ንግግሩ ምጸታዊ ሊሆን ወይም እነርሱን በሙሉ እንደ ጥበበኞች የሚያወድስ ሊታይ ይችላል።
  rationale: ‘አስተዋዮች’ የሚለው አዎንታዊ ነገር ግን መጠነኛ ነው፤ ጽሑፉ ምጸት መሆኑንም ሆነ ፍጹም ውዳሴ መሆኑን አስገድዶ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር የክርክር ዘይቤና በὑμεῖς ላይ ያለው አጽንዖት ተጠብቀዋል።
