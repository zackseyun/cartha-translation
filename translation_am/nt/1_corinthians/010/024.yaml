  rationale: ἕτερος ከራስ በተቃራኒ ያለውን ሌላ ሰው ያመለክታል፤ ‘ሰው’ ማከሉ በአማርኛ ግልጽ ያደርገዋል፣ ‘ጥቅም’ም በመጀመሪያው ሐረግ የተሞላውን ስም ይደግማል።
theological_decisions:
- issue: በτὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου ውስጥ ያልተገለጸውን ስም መሙላት
  choice: ‘የራሱን ጥቅም ... የሌላውን ሰው ጥቅም’
  alternative: ‘የራሱን ... የሌላውን’ ወይም ‘የራሱን ነገር ... የሌላውን ነገር’
