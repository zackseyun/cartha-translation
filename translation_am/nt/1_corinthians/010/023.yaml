  rationale: ሐረጉ ጳውሎስ የሚያስተካክለው የቆሮንቶስ ሰዎች መፈክር መሆኑ ከአውዱ አይቀርም። ሆኖም የጥንት የግሪክ ጽሑፎች ዘመናዊ የጥቅስ ምልክት ስላልነበራቸው ይህ የሥርዓተ ነጥብ ትርጓሜያዊ ውሳኔ እንጂ የጽሑፍ ልዩነት አይደለም። የጥቅስ ምልክቱ የክርክሩን መዋቅር ያብራራል፤ አማራጩም በማስታወሻ ተገልጿል።
