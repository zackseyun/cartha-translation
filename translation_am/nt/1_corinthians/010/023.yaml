lexical_decisions:
- source_word: Πάντα
  choice: ሁሉም ነገር
  rationale: በስም ፋንታ የቆመውን ገለልተኛ ብዙ ቁጥር እና ሰፊውን አጠቃላይ ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በሁለቱም ሐረጎች መደገሙም የግሪኩን አጽንዖት ይጠብቃል።
- source_word: ἔξεστιν
  choice: ተፈቅዶልኛል
