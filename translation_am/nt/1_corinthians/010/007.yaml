  alternative: «ሊፈነጥዙ» ወይም «በፈንጠዝያ ሊዝናኑ»
  rationale: ግሱ በቀጥታ «መጫወት» ሊል ይችላል፤ ነገር ግን በዘፀአት 32 አውድ ከወርቁ ጥጃ ጋር የተያያዘ የበዓል ፈንጠዝያን ሊያመለክት ይችላል። ቀጥተኛውን ፍቺ በዋናው ጽሑፍ ማቆየት አሻሚነቱን ይጠብቃል።
