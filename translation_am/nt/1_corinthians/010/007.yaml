base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: am
  text: ከእነርሱ አንዳንዶቹ እንደነበሩት ጣዖት አምላኪዎች አትሁኑ፤ እንደተጻፈው፣ “ሕዝቡ ሊበላና ሊጠጣ ተቀመጠ፤ ሊጫወትም[a] ተነሣ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊፈነጥዝ።” ይህ ጥቅስ ከዘፀአት 32፥6 የተወሰደ ነው፤ በዚያም «መጫወት» ከወርቁ ጥጃ ዙሪያ ከነበረው የጣዖት አምልኮ በዓል ጋር የተያያዘ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: አትሁኑ
  rationale: በአውዱ ያሉትን ተከታታይ ማስጠንቀቂያዎች በተፈጥሯዊ የአማርኛ ክልከላ ያቀርባል፤ የግሪኩ አያያዥ ኃይል በ«-ም» ተጠብቋል።
- source_word: εἰδωλολάτραι
  choice: ጣዖት አምላኪዎች
  rationale: ጣዖትን የሚያመልኩ ሰዎችን በግልጽና በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ይገልጣል።
- source_word: γίνεσθε
  choice: ሁኑ
  rationale: ከክልከላው ጋር «አትሁኑ» ተብሎ ሲቀርብ ወደዚህ ሁኔታ እንዳይገቡ የሚሰጠውን ማስጠንቀቂያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καθώς τινες αὐτῶν
  choice: ከእነርሱም አንዳንዶቹ እንደሆኑት
  rationale: በምድረ በዳ ከነበሩት እስራኤላውያን ጥቂቶች ጣዖት አምላኪዎች መሆናቸውን በግልጽ ያመለክታል።
- source_word: ὥσπερ γέγραπται
  choice: እንደተጻፈው
  rationale: የጥቅስ መግቢያውንና የተጻፈው ቃል ጸንቶ የመኖሩን ስሜት ይጠብቃል።
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: ሕዝቡ ሊበሉና ሊጠጡ ተቀመጡ
  rationale: የዘፀአትን ጥቅስ ቅደም ተከተል በመጠበቅ የዓላማ መስተዋድዶቹን በተፈጥሯዊ አማርኛ ያቀርባል፤ «ሕዝቡ» የስብስብ ስም ቢሆንም የብዙ ቁጥር ግስ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀνέστησαν παίζειν
  choice: ሊጫወቱም ተነሡ
  rationale: «ተነሡ» የትረካውን እንቅስቃሴ ይጠብቃል፤ «ሊጫወቱ» ደግሞ የπαίζεινን ቀጥተኛ የቃል ፍቺ ሳያሰፋ ያቀርባል።
theological_decisions:
- issue: በዘፀአት 32፥6 ጥቅስ ውስጥ παίζειν ያለውን የጣዖት በዓል አውድ ምን ያህል ግልጽ ማድረግ እንዳለበት
