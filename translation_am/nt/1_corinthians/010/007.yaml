  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ ቃላዊ ቅርጽ ተጠብቆ የአውዱ ተጨማሪ ፍቺ በግርጌ ማስታወሻ ቀርቧል።
