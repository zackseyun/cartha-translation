  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: am
  text: እኔ በምስጋና ብመገብ፣ እኔ ስለማመሰግንበት ነገር ለምን ክፉ ይነገርብኛል?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔ በጸጋ ብካፈል፣ እኔ ስለማመሰግንበት ነገር ለምን ክፉ ይነገርብኛል?” የግሪኩ χάριτι “በጸጋ” ተብሎም ሊተረጎም ይችላል፤ ሆኖም ከሚከተለው “አመሰግናለሁ” ጋር በተያያዘ፣ ብዙዎች እዚህ “በምስጋና” ብለው ይረዱታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: በምስጋና
  rationale: በምግብ አውድ ውስጥ ከሚከተለው εὐχαριστῶ (‘አመሰግናለሁ’) ጋር በመያያዝ፣ መመገቡ ከምስጋና ጋር መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετέχω
  choice: ከተመገብኩ
  rationale: ቃሉ በአጠቃላይ ‘መካፈል’ ሊል ቢችልም፣ እዚህ ያለው ቀጥተኛ አውድ ምግብ መብላት ስለሆነ ‘ተመገብኩ’ ግልጽና ተፈጥሯዊ ነው።
- source_word: βλασφημοῦμαι
  choice: እወቀሳለሁ
  rationale: እዚህ ግሱ በጳውሎስ ላይ የሚነገርን ክፉ ወይም የውግዘት ንግግር ያመለክታል፤ ‘እወቀሳለሁ’ መለኮታዊ ስድብን ሳያስገባ ይህን ትርጉም ያስተላልፋል።
- source_word: ὑπὲρ οὗ
  choice: ስላመሰገንኩበት ነገር
  rationale: የወቀሳውን ምክንያት ያሳያል፤ የአማርኛው ‘ስለ…’ አወቃቀር ይህን ምክንያታዊ ግንኙነት በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: εὐχαριστῶ
  choice: አመሰገንኩበት
  rationale: ‘ማመስገን’ የግሱን ቀጥተኛ ትርጉም ይጠብቃል። በግሪኩ በግልጽ ያልተጠቀሰውን ‘እግዚአብሔርን’ አልጨመረም።
- source_word: ἐγὼ ... ἐγὼ
  choice: እኔ ... እወቀሳለሁ/ስላመሰገንኩበት
  rationale: የመጀመሪያው ግልጽ ተውላጠ ስም ‘እኔ’ በመቆየቱ አጽንዖቱ ተጠብቋል፤ ቀጣዩ የመጀመሪያ ሰው አጽንዖት በአማርኛው ግስ ቅርጾች በተፈጥሯዊነት ተገልጧል።
- source_word: τί
  choice: ለምን
  rationale: በዚህ የክርክር ጥያቄ ውስጥ τί ምክንያትን የሚጠይቅ ስለሆነ ‘ለምን’ ተገቢ ነው።
theological_decisions:
- issue: χάριτι ከመብላትና ከምስጋና ጋር ያለው ትርጉም
  choice: በምስጋና
  alternative: በጸጋ
  rationale: ወዲያው የሚከተለው εὐχαριστῶ (‘አመሰግናለሁ’) እና የምግብ አውዱ χάριτιን ከምስጋና ጋር እንዲያያዝ ይደግፋሉ። ሆኖም ‘በጸጋ’ የሚለው ሕጋዊ አማራጭ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የክርክር ጥያቄ ቅርጽ ተጠብቋል፤ የχάριτι አማራጭ ትርጉም በእግር ማስታወሻ ቀርቧል።
