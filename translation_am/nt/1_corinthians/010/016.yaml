  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: am
  text: የምንባርከው የበረከት ጽዋ፣ በመሲሑ ደም መካፈል አይደለምን? የምንቆርሰው እንጀራ፣ በመሲሑ ሥጋ መካፈል አይደለምን?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተካፋይነት”፤ በተለምዶ፣ “ኅብረት።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክ፣ “ክርስቶስ” (Χριστός)፤ እዚህ ቃሉ እንደ ማዕረግ ስለሚሠራ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: ጽዋ
  rationale: የመጠጫ ዕቃን በግልጽ የሚገልጽና በቅዱስ ጽሑፍ አገባብም የተለመደ ቃል ነው።
- source_word: τῆς εὐλογίας
  choice: የበረከት
  rationale: የግሪኩን የዝምድና አገባብ በቀጥታ ይጠብቃል፤ ቃሉን ‘ምስጋና’ ብሎ ብቻ አያጠብበውም።
- source_word: ὃ εὐλογοῦμεν
  choice: የምንባርከው
  rationale: εὐλογία እና εὐλογοῦμεν ያላቸውን የቃል ድግግሞሽ በ‘በረከት/እንባርካለን’ ሥር ይጠብቃል።
- source_word: οὐχὶ
  choice: አይደለምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ የአጠያየቅ ኃይልና ቅርጽ ይጠብቃል።
- source_word: κοινωνία
  choice: መካፈል
  rationale: ተራ ማኅበራዊ ኅብረትን ብቻ ሳይሆን እውነተኛ ተካፋይነትን ያሳያል፤ የኋለኛውን ሥነ ሥርዓታዊ ቴክኒካዊ ቃል አያስገባም።
- source_word: τοῦ αἵματος
  choice: ደም
  rationale: የግሪኩን መሥዋዕታዊና የቃል ኪዳን ክብደት ያለ ትርጓሜያዊ መስፋፋት ይጠብቃል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός በዚህ አገባብ ማዕረግ ስለሆነ ‘መሲሕ’ ተመርጧል፤ የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- source_word: τὸν ἄρτον
  choice: እንጀራ
  rationale: በዘመናዊ አማርኛ ለዳቦ/እንጀራ አጠቃላይ የሚሆንና በመጽሐፍ ቅዱሳዊ አገባብ የተለመደ ቃል ነው፤ ጥቅሱ አንድ ሙሉ እንጀራ መሆኑን አያስገድድም።
- source_word: ὃν κλῶμεν
  choice: የምንቆርሰው
  rationale: ተጨባጩን የመቁረስ ተግባር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τοῦ σώματος
  choice: ሥጋ
  rationale: በዚህ አገባብ የመሲሑን አካላዊ ሥጋ በተፈጥሯዊና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጻል፤ የተለየ ቤተ እምነታዊ የቁርባን አተረጓጎም አይወስንም።
theological_decisions:
- issue: በቁርባናዊ አገባብ κοινωνίαን መተርጎም
  choice: መካፈል
  alternative: ተካፋይነት፤ ኅብረት
  rationale: ጥቅሱ በመሲሑ ደምና ሥጋ እውነተኛ ተካፋይነትን ይናገራል፤ ‘መካፈል’ ይህን ኃይል ሳያዳክም የተካፋይነቱን መንገድ በተመለከተ ያሉትን የቤተ እምነት ክርክሮች አስቀድሞ አይወስንም።
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: እዚህ ቃሉ ‘የተቀባው’ የሚለውን ማዕረጋዊ ኃይል ይዞ ስለሚሠራ ‘መሲሕ’ ተመርጧል፤ ባህላዊው አተረጓጎም በማስታወሻ ተጠብቋል።
- issue: ‘ሥጋና ደም’ የሚለው ቁርባናዊ ንግግር
  choice: ቀጥተኛውን ቃል ጠብቆ የመገኘቱን ሁኔታ አለመወሰን
  alternative: ምሳሌያዊ ወይም ቁሳዊ ትርጓሜን በጽሑፉ ውስጥ መጨመር
  rationale: ግሪኩ ተካፋይነትን በጽኑ ሁኔታ ያረጋግጣል፣ ነገር ግን የተካፋይነቱን ሥነ ምስጢራዊ መንገድ በዚህ ጥቅስ አይዘረዝርም።
