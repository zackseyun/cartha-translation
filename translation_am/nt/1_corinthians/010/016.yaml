  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ሁለት ትይዩ የአጠያየቅ ክፍሎችና ‘በረከት/መባረክ’ የሚለው ድግግሞሽ ተጠብቀዋል።
