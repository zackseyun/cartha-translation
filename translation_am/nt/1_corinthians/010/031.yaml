  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: am
  text: ስለዚህ ብትበሉም ብትጠጡም ወይም ማንኛውንም ነገር ብታደርጉ፣ ሁሉን ለእግዚአብሔር ክብር አድርጉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: ብት...ም ብት...ም ወይም ... ብት...
  rationale: የግሪክ ተዛማጅ አያያዦች አማራጭ ሁኔታዎችን ይዘረዝራሉ፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የንግግሩን ቅርጽ ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ውይይት የሚወጣውን መደምደሚያ በግልጽ ያመለክታል።
- source_word: ἐσθίετε
  choice: ብትበሉ
  rationale: የአሁን ጊዜው ግስ አንድ በዚያው ሰዓት የሚካሄድ ድርጊትን ሳይሆን አጠቃላይ ሁኔታን ያሳያል።
- source_word: πίνετε
  choice: ብትጠጡ
  rationale: እንደ ἐσθίετε ሁሉ አጠቃላይና የተለመደ ድርጊትን ያመለክታል።
- source_word: τι
  choice: ማንኛውንም ነገር
  rationale: ከመብላትና ከመጠጣት ባሻገር ማናቸውንም ድርጊቶች የሚያካትተውን ሰፊ ወሰን ይገልጣል።
- source_word: ποιεῖτε
  choice: ብታደርጉ / አድርጉ
  rationale: በመጀመሪያው ስፍራ ሁኔታዊ ሐረጉን፣ በሁለተኛው ደግሞ የግሪኩን የትእዛዝ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πάντα
  choice: ሁሉን
  rationale: የቃሉን አጠቃላይና ሁሉን አቀፍ ወሰን በአጭር ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς δόξαν
  choice: ለ... ክብር
  rationale: εἰς እዚህ የድርጊቱን ዓላማ ወይም ግብ ያመለክታል፤ «ለ... ክብር» ይህን በግልጽ ያስተላልፋል።
- source_word: θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት ዝምድና በመደበኛው የአማርኛ ቅርጽ ያሳያል።
theological_decisions:
- issue: የጳውሎስ ማሳሰቢያ ወሰን
  choice: መብላትንና መጠጣትን ጨምሮ ድርጊትን ሁሉ የሚያካትት አጠቃላይ መመሪያ
  alternative: በምግብና በመጠጥ ጉዳዮች ብቻ የተወሰነ መመሪያ
  rationale: ንግግሩ ከተወሰኑት ምሳሌዎች—መብላትና መጠጣት—ወደ «ማንኛውንም ነገር» እና «ሁሉን» ይሰፋል። ትርጉሙ አጠቃላይነቱን ያሳያል፣ ነገር ግን ከአውዱ የምግብና የመጠጥ ጉዳይ ጋር ያለውን ግንኙነት አይሰርዝም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «እግዚአብሔር» በመደበኛ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም መሠረት θεόςን ለመተርጎም ተመርጧል። የግሪኩ የአማራጭ ሁኔታዎች አወቃቀርና የመጨረሻው የትእዛዝ ኃይል ተጠብቀዋል።
