source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: am
  text: እነዚህም ነገሮች፣ እነርሱም ክፉ ነገሮችን እንደተመኙ፣ እኛም ክፉ ነገሮችን የምንመኝ እንዳንሆን ለእኛ ምሳሌዎች[a] ሆኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለእኛ ዓይነቶች» ወይም «ለእኛ ንድፎች።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: እነዚህም ነገሮች
  rationale: Ταῦτα ወደ ቀደሙት የምድረ በዳ ክስተቶች ያመለክታል፤ δὲ ደግሞ በአማርኛ በተፈጥሮ በተያያዥ አገባብ «-ም» ተገልጧል።
- source_word: τύποι ἡμῶν
  choice: ለእኛ ምሳሌዎች
  rationale: τύποι እዚህ የማስጠንቀቂያና የትምህርት ቅድመ ሁኔታዎችን ያመለክታል፤ «ምሳሌዎች» ለዘመናዊ አንባቢ ግልጽ ሲሆን ἡμῶν በተፈጥሮ «ለእኛ» ተብሏል።
- source_word: ἐγενήθησαν
  choice: ሆኑ
  rationale: γίνομαι እነዚህ ክስተቶች ለእኛ ምሳሌ ሆነው መገኘታቸውን ያሳያል፤ «ሆኑ» ይህን በቀጥታና በተፈጥሮ ይገልጣል።
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: እኛም … እንዳንሆን
  rationale: የዓላማ/ውጤት አገባቡን እና ἐπιθυμητάς የሚለውን ስም ቅርጽ ለመጠበቅ «የምንመኝ እንዳንሆን» ተብሏል።
- source_word: ἐπιθυμητὰς κακῶν
  choice: ክፉ ነገሮችን የምንመኝ
  rationale: ἐπιθυμητάς ፈላጊዎችን የሚጠቁም ስም ሲሆን κακῶν የምኞቱን ክፉ ነገሮች ያመለክታል። «የምንመኝ» የጾታ ምኞትን ብቻ የሚያሳስብ ቃል ሳይጠቀም ሰፊውን የኃጢአት ምኞት ይይዛል።
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: እነርሱ ክፉ ነገሮችን እንደተመኙ
  rationale: καθὼς የንጽጽር አገባብን «እንደ» ይገልጣል፤ κἀκεῖνοι ቀደም ሲል የተጠቀሱትን የምድረ በዳ ሰዎች ያመለክታል። የግስ ዕቃው ከ κακῶν ተመልሶ ስለሚገባ «ክፉ ነገሮችን» በግልጽ ተደግሟል።
theological_decisions:
- issue: በእስራኤል የምድረ በዳ ተሞክሮዎች ጋር የτύποι ትርጉም
  choice: ምሳሌዎች
  alternative: ዓይነቶች፤ ንድፎች
  rationale: በቅርቡ አውድ ዋናው ነጥብ ለማኅበሩ የሚሰጥ ሥነ ምግባራዊ ማስጠንቀቂያ ነው። «ምሳሌዎች» ይህን ኃይል ያስተላልፋል፤ የተወሰነ ሥነ መለኮታዊ ሥርዓትንም አያስገባም። ሆኖም የቃሉ ሰፊ ክልል በግርጌ ማስታወሻ ተጠብቋል።
- issue: የἐπιθυμία ቋንቋ ጥንካሬና ወሰን
  choice: መመኘት
  alternative: መጎምጀት፤ መፈለግ
  rationale: አውዱ ሰፊ የክፉ ነገሮች ምኞትን እንጂ በተለይ የጾታ ፍትወትን ብቻ አያመለክትም። «መመኘት» የግሪኩን ወሰንና የቃላት ድግግሞሽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ἐπιθυμητάς የስም ቅርጽ «የምንመኝ እንዳንሆን» በሚለው አገባብ ተጠብቋል፤ ንጽጽሩ በአማርኛ ተፈጥሯዊ ለመሆን ቀድሞ ተቀምጧል።
