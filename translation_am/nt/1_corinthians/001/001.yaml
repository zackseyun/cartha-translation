  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: am
  text: ጳውሎስ፣ በእግዚአብሔር ፈቃድ የመሲሑ ኢየሱስ[a] ሐዋርያ እንዲሆን የተጠራ፣ እና ወንድማችን ሶስቴንስ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ ኢየሱስ።”
    reason: Χριστός በአማርኛ ‘መሲሕ’ ተብሎ በትርጉም ወይም ‘ክርስቶስ’ ተብሎ በተለመደው ቅርጽ ሊቀርብ ይችላል።
lexical_decisions:
- source_word: Παῦλος
  choice: ጳውሎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠብቃል።
- source_word: κλητὸς ἀπόστολος
  choice: ሐዋርያ እንዲሆን የተጠራው
  rationale: κλητός የጳውሎስን ሐዋርያዊ ጥሪ እንደሚገልጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ἀπόστολοςንም በተመሰረተው ቴክኒካዊ ቃል ‘ሐዋርያ’ ይተረጉማል።
- source_word: Χριστοῦ Ἰησοῦ
  choice: የመሲሑ ኢየሱስ
  rationale: Χριστόςን እዚህ የቅብዓትና የንግሥና ማዕረግ እንደሆነ ‘መሲሕ’ ብሎ ያሳያል፤ የግሪኩንም ‘መሲሕ–ኢየሱስ’ ቅደም ተከተል ይጠብቃል።
- source_word: διὰ θελήματος θεοῦ
  choice: በእግዚአብሔር ፈቃድ
  rationale: διά ከዘር አመልካች ጋር የሚገልጸውን መንገድ ወይም ወኪልነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Σωσθένης
  choice: ሶስቴንስ
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደ አጻጻፍ ያቀርባል።
- source_word: ὁ ἀδελφὸς
  choice: ወንድማችን
  rationale: ቃል በቃል ‘ወንድሙ’ ሊባል ቢችልም፣ በደብዳቤ ሰላምታ አውድ የተወሰነው ስም የማኅበረሰቡን የጋራ ወንድምነት በተፈጥሯዊ ሁኔታ ‘ወንድማችን’ ብሎ ያሳያል።
theological_decisions:
- issue: በጳውሎስ የደብዳቤ መግቢያ Χριστόςን መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός እዚህ የኢየሱስን መሲሓዊ ማዕረግ ስለሚገልጥ ‘መሲሑ’ የሚለው ትርጉሙን ግልጽ ያደርጋል፤ የተለመደው ‘ክርስቶስ’ ቅርጽ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተፈጥሯዊ ነው። የግሪኩ ረዥም የደብዳቤ መግቢያ አወቃቀርና በቀጣዩ ቁጥር የሚቀጥለው ሐረግ ስለተጠበቀ ጥቅሱ በኮማ ይጨርሳል።
