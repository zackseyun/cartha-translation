base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: am
  text: መሲሑ[a] የላከኝ ለማጥመቅ ሳይሆን ወንጌልን ለማብሰር ነውና፤ በንግግር ጥበብ[b] ሳይሆን፣ የመሲሑ መስቀል ከንቱ እንዳይሆን[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ Χριστός፤ በባህላዊ አጠራር “ክርስቶስ”።
    reason: lexical_alternative
  - marker: b
    text: ወይም “በተራቀቀ የንግግር ብልሃት”፤ ቃል በቃል፣ “በቃል ጥበብ”።
    reason: lexical_alternative
  - marker: c
    text: ወይም “ባዶ እንዳይደረግ” ወይም “ኃይሉን እንዳያጣ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: መሲሑ / የመሲሑ
  rationale: Χριστός በዚህ ስፍራ የማዕረግ ትርጉሙን እንዲያስተላልፍ “መሲሕ” ተብሎ ተተርጉሟል፤ ሁለቱም አጠቃቀሞች በአንድነት ተይዘዋል።
- source_word: βαπτίζειν
  choice: ለማጥመቅ
  rationale: በዘመናዊ አማርኛ የተለመደውንና በዚህ ዐውድ ግልጽ የሆነውን የሃይማኖት ቃል ይጠብቃል፤ የአፈጻጸሙን ዘዴ አስቀድሞ አይወስንም።
- source_word: εὐαγγελίζεσθαι
  choice: ወንጌልን ለማብሰር
  rationale: የምሥራቹን ዜና የማወጅ ተግባር በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: σοφίᾳ λόγου
  choice: በንግግር ጥበብ
  rationale: የግሪኩን አገላለጽ ቅርጽ በቅርብ ይከተላል፤ ጥበብ ያለበትን ወይም የተራቀቀን የንግግር ዘይቤ ያመለክታል እንጂ ያልተጠቀሰ ትርጓሜ አይጨምርም።
- source_word: κενωθῇ
  choice: ከንቱ እንዳይሆን
  rationale: ተግባራዊ ዋጋውን ወይም ውጤቱን ማጣት የሚለውን የዐውዱን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግሪኩ ቀጥተኛ “ባዶ መደረግ” ምስል በማስታወሻ ተጠብቋል።
- source_word: σταυρὸς
  choice: መስቀል
  rationale: ቀጥተኛ፣ የተለመደና በጳውሎስ ዐውድ ትክክለኛ ቃል ነው።
