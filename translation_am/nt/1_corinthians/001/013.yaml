  - marker: b
    text: በቃል ቃል፣ “ወደ ጳውሎስ ስም ተጠመቃችሁን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: ተከፋፍሏል
  rationale: የግሪኩን ፍጹም ተደራጊ ቅርጽ እና ከተከፋፈለ በኋላ ያለውን ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ Χριστός
  choice: መሲሑ
  rationale: መስተዋድዱ የማዕረግን አጠቃቀም ያጎላል፤ “መሲሑ” ይህን ትርጉም በግልጽ ይጠብቃል።
- source_word: μὴ
  choice: በጥያቄው ቅርጽ የተገለጸ
  rationale: አሉታዊ መልስ የሚጠብቀው የንግግር ጥያቄ በአማርኛው “-ን?” ቅርጽ ተጠብቋል።
- source_word: ἐσταυρώθη
  choice: ተሰቀለ
  rationale: የግሪኩን ተደራጊ ቅርጽ በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: የሌላን ወገን ወክሎ ወይም ለእርሱ ጥቅም የመደረግን ሰፊ ክልል ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς τὸ ὄνομα
  choice: ወደ … ስም
  rationale: የεἰςን አቅጣጫዊና አካታች ኃይል ሳይተረጉም ይጠብቃል፤ የተለመደው “በ… ስም” በማስታወሻ ቀርቧል።
- source_word: ἐβαπτίσθητε
  choice: ተጠመቃችሁ
  rationale: የግሪኩን ተደራጊ ትርጉምና የብዙ ሰው አድራሻ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የንግግር ጥያቄ ውስጥ የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ከመስተዋድዱ ጋር ያለው Χριστός እዚህ የማዕረግ ኃይሉን ያጎላል፤ ባህላዊው አማራጭ ግን በማስታወሻ ተጠብቋል።
- issue: εἰς τὸ ὄνομα በጥምቀት አውድ
  choice: ወደ ጳውሎስ ስም
  alternative: በጳውሎስ ስም
  rationale: ዋናው ጽሑፍ የεἰςን አቅጣጫዊ ገጽታ ይጠብቃል፤ የአማርኛ ቤተ እምነታዊ አጠቃቀም የለመደው አማራጭ ሳይጠፋ በማስታወሻ ቀርቧል።
