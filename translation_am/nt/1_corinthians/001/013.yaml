  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: am
  text: 'መሲሑ ተከፋፍሏልን? ጳውሎስ ስለ እናንተ ተሰቀለን? ወይስ በጳውሎስ ስም ተጠመቃችሁን?[a][b]


    [a] ወይም፣ “ክርስቶስ ተከፋፍሏልን?”


    [b] በቃል ቃል፣ “ወደ ጳውሎስ ስም ተጠመቃችሁን?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ ተከፋፍሏልን?”
