- issue: በአንድነት ጥሪ ውስጥ ያለው የκατηρτισμένοι ምስል
  choice: ፍጹም የተጣጣማችሁ ሁኑ
  alternative: ተመልሳችሁ ታደሱ / አንድ ሆናችሁ ተያያዙ
  rationale: ቃሉ ቀላል ስምምነትን ብቻ ሳይሆን የተከፋፈለው እንደገና ተስተካክሎ በአግባቡ መያያዙን ሊያመለክት የሚችለውን ውጥረት ይጠብቃል።
