  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: am
  text: እናንተ ግን በመሲሑ ኢየሱስ ውስጥ የሆናችሁት ከእርሱ ነው፤ እርሱም ለእኛ ከእግዚአብሔር ጥበብ፣ ጽድቅ[a]፣ መቀደስና ቤዛነት ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: ከእርሱ ነው
  rationale: የምንጭንና የመነሻን ሐሳብ ይጠብቃል፤ አማኞች በመሲሑ ውስጥ መሆናቸው ከእግዚአብሔር እንደሚመነጭ ያሳያል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ ውስጥ
  rationale: የጳውሎስን ‘በመሲሑ ውስጥ’ የሚለውን የኅብረት አገላለጽ ሳይተረጉም ይጠብቃል፤ Χριστόςም እዚህ እንደ ማዕረግ ‘መሲሕ’ ተብሏል።
- source_word: ἐγενήθη
  choice: ሆነ
  rationale: γίνομαι የሚያመለክተውን ‘መሆን’ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σοφία
  choice: ጥበብ
  rationale: በምዕራፉ ውስጥ ያለውን የሰው ጥበብና የእግዚአብሔር ጥበብ ንጽጽር የሚጠብቅ ቀጥተኛ ትርጉም ነው።
- source_word: ἀπὸ θεοῦ
  choice: ከእግዚአብሔር
  rationale: የምንጭን ትርጉም ይጠብቃል። በአማርኛው አቀማመጥ ከ‘ጥበብ’ ጋር በቅርብ ሆኖ ሳለ ቀጣዮቹንም ስሞች ሊያካትት የሚችል ክፍትነት አለው።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: በጳውሎስ የድነት አውድ የተለመደና ትክክለኛ ቃል ነው፤ ‘ፍትሕ’ የሚለው ሌላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἁγιασμός
  choice: መቀደስ
  rationale: ቅዱስ መደረግን ወይም ለእግዚአብሔር መለየትን በግልጽ የሚያስተላልፍ የድርጊት ስም ነው።
- source_word: ἀπολύτρωσις
  choice: ቤዛነት
  rationale: በዋጋ የመፈታትንና ነፃ የመውጣትን የቃሉን የመዳን ፍቺ የሚይዝ የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
theological_decisions:
- issue: ‘ከእግዚአብሔር ጥበብ’ ከሚለው አገላለጽ ጋር የጽድቅ፣ የመቀደስና የቤዛነት ግንኙነት
  choice: አራቱ ስሞች በአንድ ተከታታይ ዝርዝር ቀርበዋል፤ ‘ከእግዚአብሔር’ ከ‘ጥበብ’ ጋር በቅርብ ቢቆምም የቀሩትን ስሞች እንዳይመለከት አልተገደበም።
  alternative: ‘ጽድቅ፣ መቀደስና ቤዛነት’ ጥበብን የሚያብራሩ ተጨማሪ መግለጫዎች ናቸው፤ ወይም ‘ከእግዚአብሔር’ አራቱንም ስሞች በእኩል ይገዛል።
  rationale: የግሪኩ አገባብ ከአንድ በላይ ግንኙነትን ይፈቅዳል። ትርጉሙ ይህን የሥነ መለኮትና የአገባብ ውጥረት በራሱ ሳይፈታ ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በመሲሑ ኢየሱስ ውስጥ’ የሚለው በአማርኛ ትንሽ ልዩ ቢሰማም የጳውሎስን ዋና ምስልና ሥነ መለኮታዊ ክብደት ለመጠበቅ ተመርጧል።
