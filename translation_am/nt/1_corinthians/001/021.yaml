review_pass:
  verdict: revise
  source_fidelity: The causal structure, the two occurrences of wisdom, God's saving purpose, and the referent ‘those who believe’ are substantially represented. However, the wording for διὰ τῆς μωρίας τοῦ κηρύγματος is grammatically compressed and can sound as though ‘foolishness’ is simply an apposition to the proclaimed message rather than the perceived foolishness associated with it.
  naturalness: ‘በታወጀው መልእክት ሞኝነት’ is not fully idiomatic modern Amharic. Recasting it as ‘በስብከቱ ሞኝነት’ is natural and retains the Greek expression’s possible reference to both the proclaimed content and its public proclamation. The initial causal clause is otherwise natural.
  terminology: ‘እግዚአብሔር,’ ‘ጥበብ,’ ‘ማዳን,’ and ‘የሚያምኑትን’ are suitable standard terms. ‘ስብከት’ is an established biblical term for κήρυγμα and, with a footnote, preserves rather than resolves the message/event ambiguity.
  issues:
  - severity: medium
    issue: The main rendering of διὰ τῆς μωρίας τοῦ κηρύγματος is awkwardly constructed.
    rationale: The phrase ‘በታወጀው መልእክት ሞኝነት’ lacks a clear natural possessive relationship in Amharic. ‘በስብከቱ ሞኝነት’ clearly renders ‘through the foolishness of the proclamation/preaching’ and permits the source expression’s ambiguity.
  - severity: low
    issue: Footnote a’s alternative is too narrow as written.
    rationale: ‘በስብከቱ’ is not merely an alternative wording if the main text is revised to use that term. The note should instead explain that the Greek can denote the proclaimed message or the act of proclaiming it.
