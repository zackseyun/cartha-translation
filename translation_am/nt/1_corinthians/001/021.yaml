  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: am
  text: ዓለም በእግዚአብሔር ጥበብ ውስጥ በጥበብ እግዚአብሔርን ስላላወቀ፣ እግዚአብሔር በስብከቱ[a] ሞኝነት[b] የሚያምኑትን ማዳን ወደደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል የሚያመለክተው የታወጀውን መልእክት ወይም የማወጁን ተግባር ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: ማለትም፣ ዓለም በስብከቱ ውስጥ እንደ ሞኝነት የሚቆጥረውን።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: ስላላወቀ
  rationale: የምክንያት ግንኙነቱን በአማርኛ የምክንያት አንቀጽ ያሳያል፤ የቁጥሩ አብራሪ ፍሰትም በአረፍተ ነገሩ አወቃቀር ይጠበቃል።
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: በእግዚአብሔር ጥበብ ውስጥ
  rationale: ἐν የሚያመለክተውን የወሰን፣ የአሠራር ወይም የመሣሪያ ግንኙነት በአንድ ትርጉም ሳይወስን አሻሚነቱን ይጠብቃል።
- source_word: οὐκ ἔγνω
  choice: አላወቀም
  rationale: የግሪኩን የማወቅ ሰፊ አእምሯዊና ግንኙነታዊ ትርጉም ይጠብቃል።
- source_word: ὁ κόσμος
  choice: ዓለም
  rationale: በጳውሎስ አጠቃቀም ሰብአዊውን ዓለምና የዓለምን ሥርዓት በማያጠብ መልኩ ያቀርባል።
- source_word: διὰ τῆς σοφίας
  choice: በጥበብ
  rationale: διά ከዘር አመልካች ጋር የሚያሳየውን መንገድ ወይም መሣሪያ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘በራሱ ጥበብ’ በማለት በግሪኩ የሌለው ባለቤትነት አልተጨመረም።
- source_word: εὐδόκησεν ὁ θεὸς
  choice: እግዚአብሔር … ወደደ
  rationale: የመለኮታዊ በጎ ፈቃድንና ደስ መሰኘትን ይጠብቃል፤ ‘ወሰነ’ ከሚለው ይልቅ የεὐδοκέωን ሙሉ ጣዕም ያቀርባል።
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: በታወጀው መልእክት ሞኝነት
  rationale: κήρυγμα በዋናነት የታወጀውን ይዘት እንዲያመለክት ያደርጋል፤ የማወጁን ተግባር ሊያካትት የሚችለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: σῶσαι
  choice: ማዳን
  rationale: የጳውሎስን የድነት ቋንቋ በመደበኛና ግልጽ መንገድ ይጠብቃል።
- source_word: τοὺς πιστεύοντας
  choice: የሚያምኑትን
  rationale: የአሁን ጊዜ ተሳቢውን በተፈጥሯዊ አማርኛ ያቀርባል፤ ግሪኩ ከሚናገረው በላይ የትምህርተ እምነት ዝርዝር አይጨምርም።
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος የሚያመለክተው
  choice: በዋናነት ዓለም ሞኝነት እንደሆነ የሚቆጥረው የታወጀ መልእክት
  alternative: የስብከቱ ወይም የማወጁ ተግባር ሞኝነት፤ ወይም መልእክቱንና የማወጁን ተግባር አንድ ላይ የሚያቅፍ አሻሚ አገላለጽ
  rationale: κήρυγμα ብዙ ጊዜ የታወጀውን ይዘት ያመለክታል፤ ነገር ግን ዐውዱ የሕዝብ ፊት የማወጁን ተግባርም ሊያስተጋባ ይችላል። ዋናው ጽሑፍ ይዘቱን ያስቀድማል፣ ማስታወሻው ግን ሌላውን አማራጭ ይጠብቃል።
- issue: ‘ሞኝነት’ በእግዚአብሔር ግምገማ ነው ወይስ በዓለም?
  choice: ዓለም እንደ ሞኝነት የሚቆጥረው
  alternative: መልእክቱ በራሱ ሞኝነት ነው
  rationale: በ1 ቆሮንቶስ 1 ሙሉ ክርክር ውስጥ ጳውሎስ የዓለምን የጥበብ መለኪያ በአሽሙር ይገለብጣል፤ እግዚአብሔር መልእክቱን በእውነት ሞኝነት እንደሚቆጥር አይናገርም።
