  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በእግዚአብሔር ጥበብ ውስጥ’ የሚለው አነጋገር ትንሽ መደበኛ ቢሆንም የἐνን እውነተኛ አሻሚነት ለመጠበቅ ተመርጧል።
