base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: am
  text: 'ምክንያቱም፣ እንዲህ ተብሎ ተጽፎአል፦

    “የጥበበኞችን ጥበብ አጠፋለሁ፤

    የአስተዋዮችንም ማስተዋል ከንቱ አደርጋለሁ።”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የአስተዋዮችን ማስተዋል ውድቅ አደርጋለሁ” ወይም “እሽራለሁ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: እንዲህ ተብሎ ተጽፎአል
  rationale: የቅዱሳት መጻሕፍትን ጥቅስ የሚያስተዋውቀውን ፍጹም ተደራጊ ቅርጽና እስከአሁን የሚኖረውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማስረጃና የማብራሪያ ግንኙነት በግልጽ ያስተላልፋል።
- source_word: Ἀπολῶ
  choice: አጠፋለሁ
  rationale: የἀπόλλυμιን ቀጥተኛና ኃይለኛ ትርጉም ሳያጋንን ይጠብቃል።
- source_word: σοφίαν
  choice: ጥበብ
  rationale: በምዕራፉ ውስጥ የሚደጋገመውን σοφία በተለመደና ተስማሚ ቃል ይተረጉማል።
- source_word: τῶν σοφῶν
  choice: የጥበበኞችን
  rationale: ከጥበብ ጋር ያለውን የቃል ዘር ድግግሞሽና የግሪኩን የባለቤትነት ግንኙነት ይጠብቃል።
- source_word: σύνεσιν
  choice: ማስተዋል
  rationale: የመረዳትንና የመለየትን ችሎታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τῶν συνετῶν
  choice: የአስተዋዮችን
  rationale: ከማስተዋል ጋር ያለውን የቃል ዘር ትይዩነት በመጠበቅ συνετός የሚያመለክተውን አስተዋይነት ያሳያል።
- source_word: ἀθετήσω
  choice: ከንቱ አደርጋለሁ
  rationale: ቃሉ በዚህ አውድ የሚያመለክተውን ውድቅ ማድረግና ውጤት አልባ ማድረግ በግልጽ ያስተላልፋል፤ ሌሎች የተገቡ አማራጮች በማስታወሻ ቀርበዋል።
theological_decisions:
- issue: የኢሳይያስን ጥቅስ የወደፊት ጊዜ ግሶችና የጥበብ/ማስተዋል ትይዩነት ማቅረብ
  choice: “አጠፋለሁ” እና “ከንቱ አደርጋለሁ” በሚሉ ቀጥተኛ የወደፊት ጊዜ ግሶች ማቅረብ
  alternative: “አፈርሳለሁ” እና “እተወዋለሁ/ውድቅ አደርጋለሁ” ብሎ መተርጎም
  rationale: ጥቅሱ እግዚአብሔር የሰውን ጥበብ እንደሚያፈርስ የሚያሳየውን ኃይል ይጠብቃል፤ ከግሪኩ በላይ የሆነ የሃይማኖት ትርጓሜ አይጨምርም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። የግጥም ትይዩነቱን ለማሳየት ጥቅሱ በሁለት መስመሮች ቀርቧል፤ “ጥበብ/ጥበበኞች” እና “ማስተዋል/አስተዋዮች” የሚሉት የግሪኩን የቃል ዘር ድግግሞሽ ያንጸባርቃሉ።
