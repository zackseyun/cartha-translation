  to: እኔ የምለው ይህ ነው፤ እያንዳንዳችሁ እንዲህ ትላላችሁ፦ “እኔ የጳውሎስ ነኝ” ወይም “እኔ የአጵሎስ ነኝ” ወይም “እኔ የኬፋ ነኝ” ወይም “እኔ የመሲሑ[a] ነኝ።”
