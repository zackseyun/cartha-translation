id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: am
  text: እኔ የምለው ይህ ነው፤ እያንዳንዳችሁ እንዲህ ትላላችሁ፦ “እኔ የጳውሎስ ነኝ” ወይም “እኔ የአጵሎስ ነኝ” ወይም “እኔ የኬፋ ነኝ” ወይም “እኔ የመሲሑ[a] ነኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የክርስቶስ።”
    reason: Χριστός በተለምዶ ‘ክርስቶስ’ ተብሎም ይጻፋል።
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: እኔ የምለው ይህን ነው
  rationale: የጳውሎስን ማብራሪያ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተዋውቃል።
- source_word: ἕκαστος ὑμῶν λέγει
  choice: እያንዳንዳችሁ ... ትላላችሁ
  rationale: ἕκαστος የሚያሳየውን የእያንዳንዱን ተሳትፎ ይጠብቃል፤ የብዙ ቁጥር ግስም በአማርኛ ለተናጋሪዎቹ በቀጥታ የሚደረገውን ንግግር ተፈጥሯዊ ያደርገዋል።
- source_word: εἰμι + genitive (Παύλου / Ἀπολλῶ / Κηφᾶ / Χριστοῦ)
  choice: የ... ነኝ
  rationale: የግሪኩን የወገንተኝነት ወይም የአባልነት ሐሳብ በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘እከተላለሁ’ ብሎ ትርጉሙን አያጠብም።
- source_word: Κηφᾶ
  choice: ኬፋ
  rationale: ጳውሎስ እዚህ Πέτρος ሳይሆን Κηφᾶς ስለሚጠቀም ስሙ ተጽፎአል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός የቅብዓት ንጉሥነትን የሚያመለክት ማዕረግ ስለሆነ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የባለቤትነት ቅርጹም ‘የመሲሑ’ ሆኗል።
theological_decisions:
- issue: Χριστοῦ በወገንተኝነት መፈክር ውስጥ ያለው አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός እዚህም የተቀባውን ንጉሥ የሚያመለክት ማዕረግ በመሆኑ ‘መሲሕ’ ተመርጧል። በአማርኛ የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የተደጋገመው ‘እኔ ... ነኝ’ የግሪኩን የወገን መፈክሮች አጽንዖት ይጠብቃል።
