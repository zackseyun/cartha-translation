review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders λόγος τοῦ σταυροῦ as “የመስቀሉ መልእክት,” preserves the ongoing force of both present participles, retains the contrast marked by μέν...δέ, and translates δύναμις θεοῦ faithfully. However, “እየዳንን ላለነው” is not the appropriate first-person plural relative form for “us who are being saved.”
  naturalness: The wording is otherwise clear, modern, and suitably dignified. Recasting the second group as “እየዳንን ላለን ለእኛ” is grammatically sound and natural while retaining the explicit “us.”
  terminology: “መልእክት,” “መስቀል,” “ሞኝነት,” and “የእግዚአብሔር ኃይል” are appropriate. The alternative “የመስቀሉ ቃል” appropriately preserves the lexical possibility for λόγος.
  issues:
  - severity: medium
    issue: The expression “እየዳንን ላለነው” has an unsuitable relative-form ending for the explicitly first-person plural referent.
    rationale: σῳζομένοις ἡμῖν means “to us who are being saved.” In modern standard Amharic, “እየዳንን ላለን ለእኛ” clearly and grammatically expresses that first-person plural, ongoing sense.
