reference: 1 Corinthians 1:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: am
  text: የመስቀሉ መልእክት[a] ለሚጠፉት ሞኝነት ነውና፤ እየዳንን ላለን ለእኛ[b] ግን የእግዚአብሔር ኃይል ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመስቀሉ ቃል።»
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አገላለጽ «እየዳንን ላለን ለእኛ» የሚል ሲሆን፣ እዚህ መዳን እየቀጠለ ያለ እውነታ ሆኖ ቀርቧል።
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: መልእክት
  rationale: እዚህ ቃሉ ስለ መስቀሉ የሚነገረውን ይዘት ስለሚያመለክት፣ «መልእክት» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው፤ «ቃል» የሚለው ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: σταυροῦ
  choice: መስቀል
  rationale: የግሪኩን አጭር አገላለጽና የጳውሎስን አጽንዖት በቀጥታ ይጠብቃል።
- source_word: ἀπολλυμένοις
  choice: ለሚጠፉት
  rationale: የአሁን ጊዜ አሳታፊ ቅርጹን እንደ ቀጣይ ሁኔታ ያቀርባል፤ «ለጠፉት» ብሎ ወደ ተጠናቀቀ ሁኔታ አይለውጠውም።
- source_word: μωρία
  choice: ሞኝነት
  rationale: ከእግዚአብሔር ኃይል ጋር ያለውን ተቃርኖ በግልጽና በተለመደ ዘመናዊ አማርኛ ያሳያል።
- source_word: σῳζομένοις
  choice: እየዳንን ላለነው
  rationale: የአሁን ጊዜ አሳታፊውን ቀጣይ ገጽታ ይጠብቃል፤ በተጨማሪም ἡμῖν ያለውን ራስን አካታች አገላለጽ ያስቀምጣል።
- source_word: δύναμις θεοῦ
  choice: የእግዚአብሔር ኃይል
  rationale: የግሪኩን የባለቤትነት አወቃቀርና የአረፍተ ነገሩን ሥነ መለኮታዊ ክብደት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በσῳζομένοις የተገለጠው የመዳን ገጽታ
  choice: እየዳንን ላለነው
  alternative: ለዳንነው
  rationale: የግሪኩ የአሁን ጊዜ አሳታፊ መዳንን እንደ ቀጣይ ወይም በአሁን ጊዜ እየተለማመዱት ያለ እውነታ ያቀርባል፤ ይህን ወደ ተጠናቀቀ ያለፈ ክስተት ብቻ አይቀንሰውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ነውና» የγὰρን ምክንያታዊ ግንኙነት ይጠብቃል፤ ሴሚኮሎኑም በሁለቱ ቡድኖች መካከል ያለውን ጠንካራ ተቃርኖ ያጎላል።
