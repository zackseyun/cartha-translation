reference: 1 Corinthians 1:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: am
  text: ምክንያቱም የእግዚአብሔር ሞኝነት ከሰዎች ይልቅ ጥበበኛ ነው፤ የእግዚአብሔርም ድካም ከሰዎች ይልቅ ብርቱ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: የቀደመውን ሐሳብ የሚያስረዳውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: የእግዚአብሔር ሞኝነት
  rationale: የግሪኩን ሆን ተብሎ የተቀመጠ አያዎአዊ አነጋገር ሳያለዝብ ይጠብቃል።
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: ከሰዎች ይልቅ ጥበበኛ
  rationale: የንጽጽር ደረጃውንና የἄνθρωποιን አጠቃላይ የሰው ልጆች ትርጉም በግልጽ ሁኔታ ያቀርባል።
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: የእግዚአብሔር ድካም
  rationale: ከመጀመሪያው ሐረግ ጋር ያለውን ትይዩ አወቃቀርና የግሪኩን አያዎአዊ ውጥረት ይጠብቃል።
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: ከሰዎች ይልቅ ብርቱ
  rationale: ἰσχυρόςን በተፈጥሯዊና ቀጥተኛ የአማርኛ ቃል ይተረጉማል።
theological_decisions:
- issue: ለእግዚአብሔር ሞኝነትና ድካም የሚያመስለው አያዎአዊ አነጋገር
  choice: ቀጥተኛውን «የእግዚአብሔር ሞኝነት» እና «የእግዚአብሔር ድካም» የሚሉትን አገላለጾች መጠበቅ
  alternative: «ሰዎች ሞኝነት/ድካም ብለው የሚቆጥሩት የእግዚአብሔር ሥራ» ብሎ በማብራራት መተርጎም
  rationale: ምንጩ ትርጉሙን በማብራሪያ አይፈታውም፤ ስለዚህ የጽሑፉ አያዎአዊ ኃይልና ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የሁለቱ ንጽጽሮች ትይዩነት ተጠብቋል፤ የጾታ ገለልተኛው ἄνθρωποι «ሰዎች» ተብሎ ተተርጉሟል።
