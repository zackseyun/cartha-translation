    reason: alternative_reading
  - marker: b
    text: “ምልክቶች” የሚለው “ተአምራዊ ምልክቶች” ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
  - marker: c
    text: “ግሪኮች” የሚለው በሰፊው “አሕዛብ” ተብሎ ሊተረጎም ይችላል፤ ሆኖም ከጥበብ ጋር ያለው ግንኙነት እዚህ የግሪክን የተለየ ባህላዊ ማዕቀፍ የሚያመለክት ይመስላል።
    reason: lexical_alternative
