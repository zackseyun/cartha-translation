  source_fidelity: The draft correctly retains the adversative contrast, God's repeated choosing, and the two purpose clauses. However, rendering the neuter plural substantives as “ሞኝ የሆኑትን” and “ደካማ የሆኑትን” naturally denotes persons in Amharic, whereas the Greek deliberately uses neuter plurals. The rendering should preserve the referential openness through “ነገሮች.”
  naturalness: The sentence is otherwise fluent and appropriately formal. “እንዲያሳፍር” gives the purpose-and-subjunctive sense of ἵνα καταισχύνῃ more explicitly and naturally than the infinitive construction in this parallel phrasing.
