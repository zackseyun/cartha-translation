  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: am
  text: ወንድሞቼ[a]፣ ስለ እናንተ በየክሎኤ ሰዎች ተነግሮኛልና፤ በመካከላችሁ ጠቦች እንዳሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞቼና እህቶቼ።” ግሪክኛው “ወንድሞች” ይላል፤ ይህ ቃል ግን መላውን የአማኞች ማኅበር በአካታች ሁኔታ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: የተነገረኝ ነገር አለ
  rationale: የግሪክኛውን ተደራጊ አኳኋን ይጠብቃል፤ መረጃው ለጳውሎስ እንደደረሰውም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γάρ
  choice: አለና
  rationale: ከቀደመው ማሳሰቢያ ጋር ያለውን ምክንያታዊና ገላጭ ግንኙነት በአማርኛ የአረፍተ ነገር መጨረሻ ቅጥያ ያሳያል።
- source_word: περὶ ὑμῶν
  choice: ስለ እናንተ
  rationale: የመስተዋድዱን ቀጥተኛ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἀδελφοί μου
  choice: ወንድሞቼ
  rationale: የግሪክኛውን ተባዕታይ ብዙ ቁጥር በዋናው ጽሑፍ ይጠብቃል፤ መላውን የአማኞች ማኅበር ሊያካትት እንደሚችል በግርጌ ማስታወሻ ተገልጿል።
- source_word: ὑπὸ τῶν Χλόης
  choice: በክሎኤ ሰዎች
  rationale: ከክሎኤ ጋር የተቆራኙ ሰዎችን ያመለክታል፤ “ቤተሰብ” ብሎ ያልተረጋገጠውን ግንኙነት አይወስንም።
- source_word: ἔριδες
  choice: ጠብ
  rationale: ቃሉ የሚያመለክተውን የግለሰቦች ግጭትና ክርክር በግልጽና በተለመደ አማርኛ ያስተላልፋል፤ ከሰፊው “መከፋፈል” ይለያል።
- source_word: ἐν ὑμῖν εἰσιν
  choice: በመካከላችሁ … እንዳለ
  rationale: የህልውና አገላለጹን በተፈጥሯዊ የአማርኛ አወቃቀር ይሰጣል።
theological_decisions:
- issue: በድብልቅ ፆታ ያለውን የእምነት ማኅበር ሲጠራ ἀδελφοίን መተርጎም
  choice: ወንድሞቼ
  alternative: ወንድሞቼና እህቶቼ
  rationale: የግሪክኛው ቃል በሰዋስው ተባዕታይ ብዙ ቁጥር ስለሆነ ይህ በዋናው ጽሑፍ ተጠብቋል፤ ቃሉ ሴቶችንም ጨምሮ መላውን ማኅበር ሊያመለክት የሚችለው ትርጉም ግን በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው ረዥም አረፍተ ነገር በአማርኛ ግልጽ እንዲሆን “እርሱም” በሚል ገላጭ ቅጥ ተዋቅሯል፤ የክሎኤ ሰዎች ማንነት ያለው አሻሚነት አልተወገደም።
