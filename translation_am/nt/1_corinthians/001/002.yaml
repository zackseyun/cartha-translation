  rationale: ዋናው ጽሑፍ በአማርኛ ተፈጥሯዊና ግልጽ እንዲሆን የዓላማ አገላለጽ ተጠቅሟል፤ የግሪኩ ሁለት ቅጽሎች ያሉበት ይበልጥ ቀጥተኛ አቀራረብ በማስታወሻ ቀርቧል።
- issue: የαὐτῶν καὶ ἡμῶν ትስስር
  choice: የተጨመቀውን ሐረግ ሳይፈታ ማቆየት
  alternative: ‘የእነርሱና የእኛ ስፍራ’ ወይም ‘የእነርሱና የእኛ ጌታ’ ብሎ መግለጽ
