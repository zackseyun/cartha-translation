    text: “የእነርሱም የእኛም” የሚለው ሐረግ አማኞች ጌታን የሚጠሩበትን ስፍራ ሊያመለክት ይችላል፤ ወይም ጌታው የእነርሱም የእኛም መሆኑን ሊገልጽ ይችላል።
