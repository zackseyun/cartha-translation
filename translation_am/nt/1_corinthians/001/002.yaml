review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the recipients, sanctification in Messiah Jesus, calling as holy people, and the inclusive phrase concerning all who call on the Lord’s name. However, the final name phrase has faulty Amharic case construction: «የጌታችንን የኢየሱስ መሲሕን ስም» marks the possessive modifiers as direct objects, whereas only «ስም» is the object of «የሚጠሩ».'
  naturalness: The register is appropriately formal and modern. «ለምትገኘው» does not agree naturally with the feminine noun «ቤተ ክርስቲያን»; «ላለችው» is idiomatic. «በስፍራ ሁሉ» is a smoother equivalent for “in every place.”
  terminology: «ቤተ ክርስቲያን», «ተቀደሱት», «መሲሕ», and «ስሙን መጥራት» are suitable choices. The wording for κλητοῖς ἁγίοις retains the traditional explicating sense, with the closer adjectival alternative supplied in a note.
  issues:
  - severity: medium
    issue: Incorrect case marking in the phrase for “the name of our Lord Jesus the Messiah.”
    rationale: In Amharic, the object suffix must attach to «ስም» («ስሙን»), not to the possessive phrases «የጌታችን» and «የኢየሱስ መሲሑ».
  - severity: low
    issue: Relative-clause gender disagreement for «ቤተ ክርስቲያን».
    rationale: «ቤተ ክርስቲያን» is feminine; «ላለችው» is the natural agreeing form.
