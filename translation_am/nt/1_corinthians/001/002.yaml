  rationale: በተፈጥሯዊ አማርኛ ጥሪውንና ቅዱስ ሕዝብ የመሆንን ማንነት በግልጽ ያቀርባል፤ ይበልጥ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
