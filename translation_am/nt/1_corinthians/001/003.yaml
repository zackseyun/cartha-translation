lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: የጳውሎስን የተለመደ የሰላምታ ቃልና ሰፊ ሥነ መለኮታዊ ክብደቱን የሚጠብቅ የተለመደ አማርኛ ነው።
