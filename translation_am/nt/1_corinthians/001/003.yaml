- issue: Χριστόςን እንደ ማዕረግ ወይም እንደ የተለመደ ስም ማቅረብ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: የግሪኩን ‘የተቀባው’ የሚለውን የማዕረግ ትርጉም በግልጽ ለማቆየት ‘መሲሕ’ ተመርጧል፤ በአማርኛ የተለመደው ቅጽ እንደ አማራጭ በማስታወሻ ቀርቧል።
