  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: am
  text: ከቀርስጶስና ከጋይዮስ በቀር ከእናንተ ማንንም ስላላጠመቅሁ አመሰግናለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: አመሰግናለሁ
  rationale: የግሪኩን የአሁን ጊዜ የምስጋና አገላለጽ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: ስለ...
  rationale: በዚህ ዐውድ የምስጋናውን መሠረት ወይም ይዘት የሚያስገባ ሲሆን፣ በአማርኛ ‘ስለ... አመሰግናለሁ’ የሚለው ተፈጥሯዊ ነው።
- source_word: οὐδένα ὑμῶν
  choice: ከእናንተ ማንንም ... አል-
  rationale: ከአድማጮቹ መካከል አንድንም ሰው እንዳላጠመቀ የሚገልጸውን አሉታዊ የባለቤት ሐረግ ግልጽ አድርጎ ያቀርባል።
- source_word: ἐβάπτισα
  choice: አጠመቅሁ
  rationale: βαπτίζω በአዲስ ኪዳን ዐውድ የሚኖረውን መደበኛ ትርጉም ይጠብቃል፤ የአጠማመቁን ሁኔታ በማከል የቡድን ልዩ አስተምህሮ አያስገባም።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: በዚህ የማግለያ አገባብ ‘except’ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Κρίσπον
  choice: ቀርስጶስ
  rationale: የግሪክ የግል ስም በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን አጻጻፍ ተከትሎ ተጽፏል።
- source_word: Γάϊον
  choice: ጋይዮስ
  rationale: የግሪክ የግል ስም ድምፁን በሚጠብቅና በአማርኛ ለንባብ ግልጽ በሆነ መልኩ ተጽፏል።
