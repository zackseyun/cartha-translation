  text: ምክንያቱም በእርሱ በሁሉም ነገር፣ በንግግር ሁሉና በእውቀት ሁሉ ባለጠጎች ተደርጋችኋል፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: አውዱ ይህን ሐረግ ጳውሎስ ቀደም ሲል ለገለጸው ምስጋና ምክንያት አድርጎ ያቀርበዋል።
- source_word: ἐν παντὶ
  choice: በሁሉ ነገር
  rationale: የግሪኩን ሰፊና አጠቃላይ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπλουτίσθητε
  choice: ባለጠጎች ሆናችኋል
  rationale: የመበልጸግን ዘይቤ ይጠብቃል፤ ተቀባይነቱንም ከ‘በእርሱ’ ጋር በማጣመር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: በክርስቶስ ውስጥ ያለ ሕብረትን ወይም የበረከቱን ክልል የሚያመለክተውን ጳውሎሳዊ አገላለጽ ሳያጠብ ይጠብቃል።
- source_word: ἐν παντὶ λόγῳ
  choice: በንግግር ሁሉ
  rationale: λόγος ከγνῶσις ጋር በተጣመረበት በዚህ አውድ የመናገርን ወይም ሐሳብን በቃል የመግለጽን ችሎታ የሚያመለክት መሆኑን በአጭርና ግልጽ መንገድ ያሳያል።
- source_word: πάσῃ γνώσει
  choice: በእውቀት ሁሉ
  rationale: የግሪኩን ሰፊ ትርጉምና ከ‘ንግግር ሁሉ’ ጋር ያለውን ትይዩነት ይጠብቃል።
theological_decisions:
- issue: ἐν αὐτῷ የሚያመለክተው ግንኙነት
  choice: በእርሱ
  alternative: በእርሱ አማካይነት
  rationale: ግሪኩ መሣሪያዊ አማካይነትን ሊያካትት ቢችልም፣ በክርስቶስ ውስጥ ያለ ሕብረትን ወይም ክልልን የሚገልጸውን እውነተኛ አሻሚነት ለመጠበቅ ‘በእርሱ’ ተመርጧል።
