  rationale: The revision removes the unsupported copula and supplies the natural Amharic purpose-clause ending ‘ዘንድ,’ faithfully representing ὅπως μή. It retains ‘ሥጋ’ in the main text to preserve the source’s imagery and ambiguity, while correcting the footnote’s literal gloss to ‘ሥጋ ሁሉ.’
