  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: am
  text: ስለዚህ፣ የጌታችንን ኢየሱስ ክርስቶስ[c] መገለጥ[b] በጉጉት እየጠበቃችሁ፣ አንዳችም ስጦታ[a] አይጎድላችሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መንፈሳዊ ስጦታ” ወይም “የጸጋ ስጦታ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የጌታችን ኢየሱስ ክርስቶስ መታየት።”
    reason: lexical_alternative
  - marker: c
    text: ግሪክኛ፣ “ኢየሱስ ክርስቶስ፤” የማዕረጉን ትርጉም ይበልጥ ግልጽ ለማድረግ “ኢየሱስ መሲሕ” ሊባልም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: በቀደመው አውድ የተገለጠው የእግዚአብሔር ጸጋ ያስገኘውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι
  choice: አንዳችም ስጦታ አይጎድላችሁም
  rationale: የምንም ዓይነት እጥረት አለመኖሩን በግልጽና ተፈጥሯዊ የአማርኛ አነጋገር ያስተላልፋል።
- source_word: χαρίσματι
  choice: ስጦታ
  rationale: በጸጋ የተሰጠን ነገር የሚያመለክተውን ቃል በአውዱ ተፈጥሯዊ በሆነ ሰፊ ቃል ተርጉሟል፤ የጸጋ ስጦታ እና መንፈሳዊ ስጦታ የሚሉት አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ἀπεκδεχομένους
  choice: በጉጉት እየጠበቃችሁ
  rationale: ቀጣይነት ያለውንና ከፍተኛ ተስፋ የተሞላበትን መጠባበቅ ያሳያል።
- source_word: ἀποκάλυψιν
  choice: መገለጥ
  rationale: የግሪኩን ቃል ቀጥተኛ ትርጉምና የጳውሎስን ፍጻሜያዊ አጠቃቀም ይጠብቃል።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος በአዲስ ኪዳን አጠቃቀሙ የሚገባውን የክብር ማዕረግ በመደበኛ አማርኛ ይገልጣል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ ክርስቶስ
  rationale: በዚህ አውድ ቃሉ እንደ ተለመደ ስምና ማዕረግ ጥምረት ስለሚሠራ፣ በአማርኛ የተለመደው ቅርጽ ተጠብቋል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ኢየሱስ ክርስቶስ
  alternative: ኢየሱስ መሲሕ
  rationale: በዚህ ስፍራ Χριστός በተለመደ ስም-መሰል ጥምረት ውስጥ ነው፤ ስለዚህ በአማርኛ የተለመደው ‘ክርስቶስ’ በዋናው ጽሑፍ ተመርጧል፣ ‘መሲሕ’ ግን የማዕረጉን ትርጉም ግልጽ የሚያደርግ አማራጭ ሆኖ ተጠብቋል።
- issue: ἀποκάλυψις መገለጥን ወይም መምጣትን/መታየትን እንደሚያመለክት
  choice: መገለጥ
  alternative: መታየት
  rationale: ‘መገለጥ’ የምንጩን ቃል በቀጥታ ይይዛል እና የወደፊቱን ጌታ መገለጥ ሳይገድብ ያስተላልፋል፤ ‘መታየት’ የአውድ አማራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ የተከበረ እና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተሳቢ አንቀጽ በአማርኛ ተፈጥሯዊ በሆነው “በጉጉት እየጠበቃችሁ” ተሰጥቷል፤ የውጤት ግንኙነቱም “ስለዚህ” በሚለው ተጠብቋል።
