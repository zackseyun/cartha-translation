  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: am
  text: 'ለተጠሩት ግን፣ አይሁድም ግሪኮችም፣ መሲሕ[a] የእግዚአብሔር ኃይልና የእግዚአብሔር ጥበብ ነው።


    [a] ወይም፣ «ክርስቶስ»።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶስ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: ለተጠሩት
  rationale: ቅጽሉ በስም ፈንታ ቆሞ በእግዚአብሔር ጥሪ የተለዩትን ሰዎች ያመለክታል፤ «ለተጠሩት» የግሪኩን የጥሪ ግሳዊ ሐሳብና የተሳቢ ቅርጽ ይጠብቃል።
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: አይሁድም ግሪኮችም
  rationale: ጳውሎስ የጠቀሰውን የአይሁድና የግሪኮች ንጽጽር በቀጥታ ይጠብቃል፤ «አሕዛብ» የሚለውን ሰፊ ትርጓሜ አያስገባም።
- source_word: Χριστόν
  choice: መሲሕ
  rationale: ቃሉ በዚህ ስፍራ የቅቡዕነት ማዕረግ ሆኖ ስለሚሠራ፣ «መሲሕ» የማዕረጉን ትርጉም ያሳያል፤ የተለመደው «ክርስቶስ» በማስታወሻ ቀርቧል።
- source_word: θεοῦ δύναμιν
  choice: የእግዚአብሔር ኃይል
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: θεοῦ σοφίαν
  choice: የእግዚአብሔር ጥበብ
  rationale: ከቀዳሚው ሐረግ ጋር ያለውን ትይዩ አወቃቀርና የ«እግዚአብሔር» ድግግሞሽ ይጠብቃል።
- source_word: implicit copula / verbless predicate relation
  choice: … ነው
  rationale: በግሪኩ የተሰወረውን አያያዥ ግስ በአማርኛ በግልጽ ማቅረብ የሐረጉን ተሳቢ ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: Χριστός እንደ መሲሓዊ ማዕረግ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: የማዕረጉን ዋና ትርጉም በግልጽ ያቀርባል፤ በአማርኛ የተለመደውን ቅጽ ሳይደብቅ በማስታወሻ ይሰጣል።
- issue: መሲሕ ከእግዚአብሔር ኃይልና ጥበብ ጋር ያለው ተሳቢ ግንኙነት
  choice: መሲሕ … ነው
  alternative: መሲሕ፣ የእግዚአብሔር ኃይልና የእግዚአብሔር ጥበብ
  rationale: ግሪኩ ከቀዳሚው ቁጥር ጋር የተያያዘ ግስ-አልባ አወቃቀር ቢኖረውም፣ «ነው» ማከል አዲስ ሥነ መለኮታዊ ትርጓሜ ሳያስገባ ተሳቢነቱን ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። የ«እግዚአብሔር» ድግግሞሽ የምንጩን አጽንዖትና ትይዩነት ለመጠበቅ ተይዟል።
