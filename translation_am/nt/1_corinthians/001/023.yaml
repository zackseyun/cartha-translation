  terminology: “መሲሕ” suitably presents Χριστός as a title, and the note appropriately supplies “ክርስቶስ” as an alternative. “አይሁድ,” “አሕዛብ,” and “ማሰናከያ” preserve the Jewish/Gentile contrast and the stumbling metaphor. The footnote correctly explains the broader sense of ἔθνεσιν.
  issues:
  - severity: low
    issue: The explicit clause “ይህም … ነው” is not represented directly in the Greek.
