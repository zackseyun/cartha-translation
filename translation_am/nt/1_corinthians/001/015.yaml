    text: ወይም፣ “በእኔ ስም።”
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek purpose construction and passive baptismal wording while moving the explicit directional force of εἰς (“ወደ”) into the main text. The more idiomatic Amharic expression using በ is retained in a footnote, preserving the lexical and theological ambiguity without resolving it interpretively.
