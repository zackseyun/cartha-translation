- source_word: ἐβαπτίσθητε
  choice: እንደተጠመቃችሁ
  rationale: የግሪኩን ተደራጊ ቅርጽና የብዙ ቁጥር ሁለተኛ መደብ በትክክል ይጠብቃል፤ “መጠመቅ”ም ገለልተኛና የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
