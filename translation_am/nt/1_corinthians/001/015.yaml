  rationale: “በእኔ ስም” በአማርኛ ተፈጥሯዊ ሲሆን ከስም ጋር ያለውን የጥምቀት ግንኙነት ይገልጣል። የεἰς ቀጥተኛ “ወደ/ውስጥ” ትርጉም የሚያሳየው አማራጭ ግን የሥነ መለኮት ውጥረቱ እንዳይጠፋ በግርጌ ማስታወሻ ተቀምጧል።
