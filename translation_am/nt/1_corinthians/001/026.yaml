review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s exhortation, the threefold ‘not many,’ wisdom judged by human criteria, power, and noble lineage. However, it renders κλῆσις (‘calling’) as ‘the situation in which you were called,’ which expands and shifts the referent from God’s call to a social circumstance. The first clause describing the wise is also grammatically unclear in Amharic and should be repaired.
  naturalness: ‘ጥበበኞች የነበራችሁ ብዙዎች አይደላችሁም’ can be understood as ‘you who had wise people,’ rather than ‘not many of you were wise.’ A parallel construction with ‘ብዙዎቻችሁ … አልነበራችሁም’ is clear, natural, and preserves the Greek repetition.
  terminology: Use ‘ጥሪያችሁን’ for κλῆσιν, retaining the established Pauline sense of calling. ‘በሰው መለኪያ’ appropriately communicates κατὰ σάρκα in this social-evaluative context. ‘ከከበረ ቤተሰብ የተወለዳችሁ’ naturally expresses noble birth without the less idiomatic ‘ዘር.’
  issues:
  - severity: medium
    issue: κλῆσις is translated as ‘የተጠራችሁበትን ሁኔታ.’
    rationale: The Greek means ‘your calling,’ not primarily the circumstances or social condition in which the readers were called. The following clauses explain the social makeup of those called but do not redefine κλῆσις.
  - severity: medium
    issue: The first ‘not many’ clause is grammatically ambiguous/unidiomatic.
    rationale: ‘ጥበበኞች የነበራችሁ’ may suggest possessing wise persons. Recasting all three clauses in matching form clearly states that not many of the addressees had those statuses.
  - severity: low
    issue: ‘ከከበረ ዘር’ is less natural in contemporary standard Amharic.
    rationale: ‘ከከበረ ቤተሰብ የተወለዳችሁ’ clearly and naturally denotes high-born social lineage.
  revised_text: ወንድሞች ሆይ፣ ጥሪያችሁን አስቡ፤ ብዙዎቻችሁ በሰው መለኪያ ጥበበኞች አልነበራችሁም፤ ብዙዎቻችሁ ኃያላን አልነበራችሁም፤ ብዙዎቻችሁም ከከበረ ቤተሰብ የተወለዳችሁ አልነበራችሁም።[a]
