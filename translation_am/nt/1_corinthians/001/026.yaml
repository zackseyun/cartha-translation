base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: am
  text: ወንድሞች ሆይ፣ ጥሪያችሁን አስቡ፤ ብዙዎቻችሁ በሰው መለኪያ ጥበበኞች አልነበራችሁም፤ ብዙዎቻችሁ ኃያላን አልነበራችሁም፤ ብዙዎቻችሁም ከከበረ ቤተሰብ የተወለዳችሁ አልነበራችሁም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ወንድሞች” የሚለው ቃል ጉባኤውን በአጠቃላይ የሚያመለክት ሲሆን፣ አማኝ ሴቶችንም እንዲሁም ወንዶችን ያካትታል።
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: አስቡ
  rationale: ቅርጹ እንደ ትእዛዝ ወይም እንደ መግለጫ ሊነበብ ቢችልም፣ በዚህ አውድ ጳውሎስ አንባቢዎቹ ስለ ራሳቸው ሁኔታ እንዲያሰላስሉ ያሳስባል፤ “አስቡ” ይህን የንግግር ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κλῆσιν ὑμῶν
  choice: የተጠራችሁበትን ሁኔታ
  rationale: κλῆσις የእግዚአብሔርን ጥሪ ያመለክታል፤ ከሚከተለው የማኅበራዊ ሁኔታ ዝርዝር ጋር “የተጠራችሁበትን ሁኔታ” በማለት ጥሪውንና በተጠሩ ጊዜ የነበራቸውን ሁኔታ በተፈጥሯዊ አገላለጽ ያገናኛል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን በሰዋስው ወንዳዊ ብዙ ቁጥር በቀጥታ ያቀርባል፤ ንግግሩ ግን መላውን ጉባኤ እንደሚያካትት በማስታወሻ ተገልጿል።
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: ጥበበኞች የነበራችሁ ብዙዎች አይደላችሁም
  rationale: በግሪኩ የተገለጸውን የቆሮንቶስ አማኞች ማጣቀሻ በአማርኛ ግልጽ ያደርጋል፣ እንዲሁም ጊዜውን ወደ ተጠሩበት ሁኔታ ያገናኛል።
- source_word: κατὰ σάρκα
  choice: በሰው መለኪያ
  rationale: ቃል በቃል “እንደ ሥጋ” ቢሆንም፣ እዚህ ላይ የሥጋ አካልን ወይም የኃጢአት ባሕርይን ሳይሆን ሰብአዊ ግምገማን ያመለክታል። “በሰው መለኪያ” ይህን ፈሊጣዊ ትርጉም በግልጽ አማርኛ ያስተላልፋል።
- source_word: δυνατοί
  choice: ኃያላን
  rationale: ማኅበራዊ ወይም ፖለቲካዊ ኃይልን የሚያካትት ሰፊ ትርጉም ይጠብቃል፣ የኃይሉንም ዓይነት ከልክ በላይ አይወስንም።
- source_word: εὐγενεῖς
  choice: ከከበረ ዘር የተወለዳችሁ
  rationale: ቃሉ የከፍተኛ ማኅበራዊ ዘር ወይም ትውልድ ማመልከቱን በዘመናዊና ግልጽ አማርኛ ይገልጣል።
theological_decisions:
- issue: κατὰ σάρκα የሚለው ሐረግ ትርጉም
  choice: በሰው መለኪያ
  alternative: እንደ ሥጋ
  rationale: አውዱ ሰዎች ጥበብንና ማኅበራዊ ደረጃን በሚመዝኑበት መንገድ ላይ ነው፤ ቃል በቃል አገላለጹ በአማርኛ የአካላዊ ሥጋ ወይም የኃጢአተኛ ባሕርይ ትርጉምን በስህተት ሊያስነሳ ይችላል።
