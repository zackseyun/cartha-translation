  rationale: ይህ ምርጫ የግሪኩን ሰዋሰዋዊ ቅርጽ ይጠብቃል፤ የጳውሎስ የጉባኤ አጠቃቀም ግን ሴቶችንም ሳይቀር ማኅበሩን በአጠቃላይ ሊያመለክት ስለሚችል ይህ በማስታወሻ ተጠቅሷል።
