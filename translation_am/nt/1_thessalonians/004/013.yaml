- source_word: ἵνα μὴ λυπῆσθε
  choice: እንዳታዝኑ
  rationale: ἵνα ከንዑስ ግስ ጋር ዓላማን ወይም ውጤትን ያሳያል። አቀራረቡ ጳውሎስ ሐዘንን ፈጽሞ መከልከሉን ሳያመለክት፣ ተስፋ ከሌለው ሐዘን ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: እንደ ሌሎቹ
  rationale: οἱ λοιποί ከአማኞች ማኅበረሰብ ውጭ ያሉትን ቀሪ ሰዎች ያመለክታል። «ሌሎቹ» አጭርና ተፈጥሯዊ ነው።
