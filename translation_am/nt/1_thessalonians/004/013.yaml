base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: am
  text: ነገር ግን፣ ወንድሞች ሆይ፣[a] ስለ አንቀላፉት[b] ሳታውቁ እንድትቀሩ አንፈልግም፤ ይህም ተስፋ እንደሌላቸው ሌሎች እንደሚያዝኑ እንዳታዝኑ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ወንድሞች» የሚለው ቃል ጉባኤውን የሚያነጋግር ሲሆን፣ ወንዶችንም ሴቶችንም ያካትታል ተብሎ ሊገባ ይችላል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ «ስለተኙት»፤ እዚህ ጳውሎስ «እንቅልፍን» ለሞቱ ምእመናን እንደ ዘይቤ ይጠቀምበታል።
    reason: lexical_alternative
lexical_decisions:
