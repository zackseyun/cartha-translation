  rationale: ἀγνοεῖν አለማወቅን ወይም መረጃ አለማግኘትን ያመለክታል። «ሳታውቁ እንድትቀሩ» ትርጉሙን ያለ ስድብ ስሜት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ በዚህ የጉባኤ አድራሻ ውስጥ ሴቶችንም ሊያካትት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: περὶ τῶν κοιμωμένων
