  rationale: δέ በዐውዱ ውስጥ ለስላሳ ሽግግርና ንጽጽር ያሳያል፤ «ነገር ግን» ይህን በተፈጥሯዊ አማርኛ ያቀርባል። θέλομεν ደግሞ «አንፈልግም» ተብሎ በቀጥታ ተተርጉሟል።
- source_word: ὑμᾶς ἀγνοεῖν
