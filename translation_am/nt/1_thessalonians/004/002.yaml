  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: am
  text: ምክንያቱም በጌታ ኢየሱስ በኩል[a] የትኞቹን ትእዛዞች እንደሰጠናችሁ ታውቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በጌታ ኢየሱስ ሥልጣን።»
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδατε
  choice: ታውቃላችሁ
  rationale: οἶδα ፍጹም ጊዜ ቅርጽ ቢኖረውም በኮይኔ ግሪክ የአሁን ጊዜ ትርጉም ይሰጣል፤ በአማርኛም «ታውቃላችሁ» ተፈጥሯዊ ነው።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በግልጽ አማርኛ ያሳያል።
- source_word: τίνας παραγγελίας
  choice: ምን ትእዛዞች
  rationale: τίνας የትእዛዞቹን ይዘት ያመለክታል፤ παραγγελία ደግሞ ሥልጣናዊ መመሪያን ወይም ትእዛዝን ሊያመለክት ስለሚችል «ትእዛዞች» የቃሉን ኃይል ይጠብቃል።
- source_word: ἐδώκαμεν ὑμῖν
  choice: እንደሰጠናችሁ
  rationale: የδίδωμιን ቀጥተኛ ትርጉምና የὑμῖνን ተቀባይነት በተፈጥሯዊ የአማርኛ ግስ ቅርጽ ያዋህዳል።
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: በጌታ በኢየሱስ በኩል
  rationale: διά ከዘር አገባብ ጋር መንገድን፣ አማካይነትን ወይም ወኪልነትን ሊያመለክት ይችላል። «በ…በኩል» የግሪኩን ግልጽ አወቃቀር ሳያጠብ ይጠብቃል።
- source_word: κυρίου Ἰησοῦ
  choice: ጌታ ኢየሱስ
  rationale: κύριος በመደበኛው «ጌታ» ተብሎ ተተርጉሟል፤ Ἰησοῦም በተለመደው የአማርኛ አጻጻፍ «ኢየሱስ» ተብሏል።
theological_decisions:
- issue: የδιὰ τοῦ κυρίου Ἰησοῦ ኃይል
  choice: በጌታ በኢየሱስ በኩል
  alternative: በጌታ በኢየሱስ ሥልጣን
  rationale: ሐረጉ ኢየሱስን እንደ አማካይ ወይም እንደ ሥልጣኑ ምንጭ ሊያመለክት ይችላል። ዋናው ጽሑፍ የግሪኩን «በኩል» የሚል አወቃቀር ይጠብቃል፤ የሥልጣን ትርጉሙም በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ትእዛዞች» የπαραγγελίαςን ሥልጣናዊ ኃይል ይጠብቃል፤ የδιά አሻሚነት በዋናው ጽሑፍና በእግር ማስታወሻው ተጠብቋል።
