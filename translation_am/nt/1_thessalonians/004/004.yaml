  source_fidelity: The draft correctly retains the contested literal terms σκεῦος (“vessel/object”) and κτᾶσθαι (“acquire”), rather than resolving them as body-control or marriage. However, the Amharic infinitival construction is less idiomatic than a finite ‘how he should acquire’ clause.
  naturalness: The wording is understandable, but “እንዴት ማግኘት እንዳለበት” is awkward in modern standard Amharic. “እንዴት እንደሚያገኝ ይወቅ” is natural while maintaining the source sense.
  terminology: “ዕቃ” represents the broad, deliberately figurative σκεῦος, though it is marked in this context. The footnote appropriately explains the principal interpretive options. “ቅድስና” and “ክብር” are accurate and suitable.
  issues:
  - severity: low
    issue: Awkward verbal construction
    rationale: The combination “እንዴት ማግኘት እንዳለበት” is grammatically interpretable but stylistically strained. A finite indirect-question clause is the normal modern Amharic expression.
