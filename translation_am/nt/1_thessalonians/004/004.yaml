translation:
  language: am
  text: እያንዳንዳችሁ የራሱን ዕቃ በቅድስናና በክብር እንዴት እንደሚያገኝ ይወቅ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የራሱን ዕቃ ማግኘት” የሚለው የግሪክ አገላለጽ “የራሱን ሰውነት መቆጣጠር” ወይም “ለራሱ ሚስት ማግኘት” ተብሎም ሊገባ ይችላል።
    reason: σκεῦος እና κτᾶσθαι በዚህ አውድ ያላቸውን እውነተኛ የትርጉም አሻሚነት ለአንባቢው ለማሳወቅ።
lexical_decisions:
- source_word: σκεῦος
  choice: ዕቃ
  rationale: ቃሉ በቀጥታ ‘ዕቃ/መያዣ’ ማለት ሲሆን በዚህ አውድ ሰውነትን ወይም ሚስትን ሊያመለክት ይችላል፤ የምንጩን አሻሚነት ለመጠበቅ ቀጥተኛው ቃል ተመርጧል።
- source_word: κτᾶσθαι
  choice: ማግኘት
  rationale: የግሱ መሠረታዊ ፍቺ ‘ለራስ ማግኘት/ማፍራት’ ነው፤ ‘መቆጣጠር’ የሚለውን አንድ ትርጓሜ ብቻ አያስገድድም።
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: በቅድስናና በክብር
  rationale: ሁለቱንም ሥነ ምግባራዊና ክብርን የሚገልጹ ቃላት በቅርብ የቃል አቀራረብ ያስተላልፋል።
theological_decisions:
- issue: ‘የራሱ ዕቃ’ የሚለው ሰውነትን ወይስ ሚስትን ያመለክታል?
  choice: በዋናው ጽሑፍ ‘የራሱን ዕቃ’ ብሎ አሻሚነቱን መጠበቅ
  alternative: ‘የራሱን ሰውነት መቆጣጠር’ ወይም ‘ሚስት ማግኘት’
  rationale: የግሪክ አገላለጽ ሁለቱንም ትርጓሜዎች ፈቅዶ ስለሚተው አንዱን በዋናው ጽሑፍ መወሰን የምንጩን እውነተኛ ውጥረት ያጠፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። ‘ዕቃ’ በአማርኛ ትንሽ እንግዳ ቢሰማም የግሪኩን ዘይቤና አሻሚነት ለመጠበቅ ተመርጧል።
