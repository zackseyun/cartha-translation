translation:
  language: am
  text: ከዚያም እኛ በሕይወት የምንኖር፣ የቀረን፣ በአንድ ጊዜ ከእነርሱ ጋር በደመናዎች ውስጥ ወደ ላይ እንነጠቃለን[a]፤ ጌታንም በአየር ለመገናኘት[b]። እንዲሁም ሁልጊዜ ከጌታ ጋር እንሆናለን።
  philosophy: optimal-equivalence
  footnotes:
