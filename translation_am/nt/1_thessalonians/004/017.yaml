    text: “በኃይል ወደ ላይ እንወሰዳለን” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ ድንገተኛና ኃይለኛ ድርጊትን ያጎላል።
    reason: lexical_alternative
