  terminology: No specialized theological terminology occurs. «እንዳዘዝናችሁ» appropriately renders the authoritative force of παρηγγείλαμεν. «በገዛ እጆቻችሁ» faithfully conveys ταῖς χερσὶν ὑμῶν.
