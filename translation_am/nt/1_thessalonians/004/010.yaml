  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: am
  text: ምክንያቱም በእርግጥ በመቄዶንያ ሁሉ ለሚኖሩ ወንድሞች ሁሉ ይህን እያደረጋችሁ ነው። ነገር ግን፣ ወንድሞች ሆይ፣[a] የበለጠ እንድትበዙ እንለምናችኋለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ወንድሞች” የሚለው የእምነት ወገኖችን የሚያመለክት ሲሆን፣ በጉባኤዎቹ ያሉትን ወንዶችና ሴቶች ሁሉ የሚያካትት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: በእርግጥም
  rationale: γάρ ያለውን ከቀደመው ሐሳብ ጋር የማስተሳሰር ኃይልና καί ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ποιεῖτε αὐτό
  choice: ይህንኑ እያደረጋችሁ ነው
  rationale: αὐτό ወደ ቀደመው የወንድማማች ፍቅር ይመለሳል፤ የአሁን ጊዜውም ቀጣይ ልማዳቸውን ያሳያል።
- source_word: εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: በመቄዶንያ ሁሉ ላሉት ወንድሞች ሁሉ
  rationale: εἰς የድርጊቱን ተቀባዮች በ‘ላሉት’ ያሳያል፤ ὅλῃ እና πάντας የየራሳቸውን ሙሉነት በሁለቱ ‘ሁሉ’ ይጠብቃሉ።
- source_word: παρακαλοῦμεν δὲ
  choice: ነገር ግን … እናሳስባችኋለን
  rationale: παρακαλέω በዚህ አውድ የልብ ማሳሰቢያን ያመለክታል፤ δέ ከምስጋና ወደ ተጨማሪ ማሳሰቢያ የሚደረገውን ሽግግር ያሳያል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ወንድ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ በጉባኤው ውስጥ ያሉ ሴቶችንም ሊያካትት የሚችለው ዐውዳዊ ስፋት በማስታወሻ ተገልጿል።
- source_word: περισσεύειν μᾶλλον
  choice: ከዚህም ይበልጥ እንድትበዙበት
  rationale: περισσεύω አሁን ካለው መጠን በላይ ማደግን ያመለክታል፤ የ‘-በት’ ቅጥያው ወደ ቀደመው የፍቅር ተግባር ይመልሳል።
