  rationale: የምንጩን ሰዋሰዋዊ ወንድ ብዙ ቁጥር በዋናው ጽሑፍ ጠብቆ፣ ቃሉ በዐውዱ ሴቶችንም የሚያካትት መሆኑን በእግር ማስታወሻ ያብራራል።
