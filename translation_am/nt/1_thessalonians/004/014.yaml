base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: am
  text: ምክንያቱም ኢየሱስ እንደሞተና ከሞት እንደተነሣ የምናምን ከሆነ፣ እግዚአብሔርም ያንቀላፉትን[a] በኢየሱስ በኩል[b] ከእርሱ ጋር ያመጣቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሞቱትን።” ጳውሎስ በዚህ አውድ የአማኞችን ሞት ለመግለጽ “ማንቀላፋት” የሚለውን ዘይቤ ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በኢየሱስ ያንቀላፉትን።” “በኢየሱስ በኩል” የሚለው ሐረግ እግዚአብሔር እነርሱን የሚያመጣበትን አማካይነት ሊያመለክት ይችላል፤ ወይም ከ“ያንቀላፉት” ጋር ተያይዞ ከኢየሱስ ጋር ያላቸውን ቅርብ ኅብረት ሊገልጽ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ πιστεύομεν
  choice: የምናምን ከሆነ ... ና
  rationale: የεἰን ሁኔታዊ ኃይልና የγάρን ምክንያታዊ ግንኙነት በተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: Ἰησοῦς ἀπέθανεν καὶ ἀνέστη
  choice: ኢየሱስ እንደሞተና ከሞት እንደተነሣ
  rationale: ሁለቱን ታሪካዊ ክስተቶች ግልጽ በሆነ የእምነት ንግግር ያቀርባል፤ ἀνέστη ኢ-ተደራጊ ቅርጽ ስለሆነ ‘ተነሣ’ ተብሏል።
- source_word: οὕτως καὶ
  choice: እንዲሁም
  rationale: በኢየሱስ ትንሣኤና እግዚአብሔር ለሞቱ አማኞች በሚያደርገው መካከል ያለውን ተዛማጅነት ይጠብቃል።
- source_word: τοὺς κοιμηθέντας
  choice: ያንቀላፉትን
  rationale: ጳውሎስ ለሞት የተጠቀመውን የእንቅልፍ ዘይቤ ሳያጠፋ በተለመደ አማርኛ ያስተላልፋል።
- source_word: διὰ τοῦ Ἰησοῦ
  choice: በኢየሱስ በኩል
  rationale: διά ከወራጅ ቅጽ ጋር ያለውን የአማካይነት ወይም የወኪልነት ፍቺ ይጠብቃል፤ የሐረጉ አያያዝ አሻሚ መሆኑ በማስታወሻ ተገልጿል።
- source_word: ἄξει σὺν αὐτῷ
  choice: ከእርሱ ጋር ያመጣቸዋል
  rationale: የἄξειን የወደፊት ጊዜና የσύνን አብሮነት በግልጽ ሁኔታ ያስተላልፋል፤ ‘እርሱ’ በአውዱ ኢየሱስን ያመለክታል።
theological_decisions:
- issue: የκοιμηθέντας የሞት ዘይቤ
  choice: ዘይቤውን ‘ያንቀላፉት’ በማለት ማቆየት
  alternative: ‘የሞቱት’
  rationale: እውነተኛውን ሞትና የወደፊቱን ትንሣኤ ተስፋ አብሮ የሚያስተጋባውን የጳውሎስ ዘይቤ ይጠብቃል።
- issue: የδιὰ τοῦ Ἰησοῦ አያያዝና ፍቺ
  choice: በዋናው ጽሑፍ ‘በኢየሱስ በኩል’ ማለትና አማራጩን በማስታወሻ ማቅረብ
  alternative: ‘በኢየሱስ ሆነው’ ወይም ‘በኢየሱስ ያንቀላፉትን’
  rationale: ሐረጉ ከ‘ያንቀላፉት’ ጋር ወይም ከ‘ያመጣቸዋል’ ጋር ሊያያዝ ይችላል፤ ትርጉሙን በአንድ አተረጓጎም ሳይዘጋ የግሪኩን አሻሚነት ይጠብቃል።
