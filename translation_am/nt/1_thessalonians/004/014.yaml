  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አንቀላፉ’ የሚለው የመጽሐፍ ቅዱስ ዘይቤ ተጠብቋል፤ ነገር ግን ጥንታዊ ወይም ከባድ የንግግር ቅርጾች አልተጨመሩም።
