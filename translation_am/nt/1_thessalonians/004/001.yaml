theological_decisions:
- issue: ለተሰሎንቄ አማኞች የቀረበው ጾታዊ አጠራር
  choice: በዋናው ጽሑፍ ‘ወንድሞች’ ብሎ ማስቀመጥና አካታች አጠቃቀሙን በግርጌ ማስታወሻ መግለጽ
