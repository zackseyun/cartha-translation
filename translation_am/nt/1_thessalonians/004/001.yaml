  alternative: መምህር
  rationale: በዚህ አውድ κύριος የኢየሱስን ሥልጣን የሚገልጽ ክርስቶሳዊ ማዕረግ ነው፤ ‘ጌታ’ ይህን ኃይል ሳያዳክም ያስተላልፋል።
