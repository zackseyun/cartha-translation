    text: ወይም፣ “ወንድሞችና እኅቶች።” የግሪኩ ቃል “ወንድሞች” ይላል፤ ነገር ግን ብዙ ጊዜ ወንዶችንና ሴቶችን በአንድነት ለመጥራት ይጠቀማል።
