source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: am
  text: የእግዚአብሔር ፈቃድ ይህ ነውና፤ መቀደሳችሁ፣[a] ማለትም ከዝሙት እንድትርቁ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቅድስናችሁ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛ፦ πορνεία፤ የማይፈቀድ የጾታ ምግባርን በሰፊው የሚያመለክት ቃል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: ፈቃድ
  rationale: እግዚአብሔር የሚፈልገውንና በሥልጣን የሚያዘውን ሐሳብ በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: እናንተ መቀደሳችሁ
  rationale: ἁγιασμός የመቀደስን ሁኔታና ሂደት ሁለቱንም ሊያመለክት የሚችለውን ስፋት ይጠብቃል፤ ቀጣዩ ሐረግም በዚህ አውድ ያለውን ሥነ ምግባራዊ ይዘት ያብራራል።
- source_word: ἀπέχεσθαι
  choice: እንድትርቁ
  rationale: የግሪኩ የመጠንቀቅና ራስን የማራቅ ኃይል በተፈጥሯዊ አማርኛ ይገለጣል፤ ኢንፊኒቲቩ መቀደስ በዚህ አውድ ምን እንደሚጨምር እንደሚያብራራም ተጠብቋል።
- source_word: πορνείας
  choice: ዝሙት
  rationale: በዘመናዊ መደበኛ አማርኛ ሕገ ወጥ ወይም ሥነ ምግባራዊ ያልሆነ የጾታ ግንኙነትን በሰፊው የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው፤ ስፋቱ በማስታወሻ ተብራርቷል።
- source_word: γάρ
  choice: ነውና
  rationale: ጥቅሱ ከቀደመው ማሳሰቢያ ጋር ያለውን የምክንያት ወይም የመሠረት ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በሥነ ምግባራዊ ማሳሰቢያው ውስጥ የἁγιασμός ትርጉም
  choice: “መቀደሳችሁ” ተብሎ ተተርጉሞ፣ ቀጣዩ ሐረግ በዚህ አውድ ያለውን ሥነ ምግባራዊ ይዘት እንዲገልጥ ተደርጓል።
  alternative: የውጤት ሁኔታን ለማጉላት “ቅድስናችሁ” ማለት።
  rationale: ቃሉን በአቋማዊ ቅድስና ወይም በሂደታዊ መቀደስ ብቻ ሳይወስን፣ ጳውሎስ የሚያሳየውን ለእግዚአብሔር የተለየ ሥነ ምግባራዊ ኑሮ ስፋት ይጠብቃል።
- issue: የπορνεία ወሰን
  choice: “ዝሙት” ተብሎ በሰፊ ትርጉሙ ተሰጥቶ፣ ወሰኑ በማስታወሻ ተገልጧል።
  alternative: እንደ አንድ የተወሰነ የጾታ በደል ብቻ የሚያስተላልፍ ጠባብ አባባል መጠቀም።
  rationale: የግሪኩ ቃል ከጋብቻ በፊት የሚፈጸምን ግንኙነት ብቻ ሳይሆን በሰፊው የማይፈቀድ የጾታ ምግባርን ሊያመለክት ስለሚችል፣ ትርጉሙ ያልተጠቀሰ ጠባብ የትምህርት ወሰን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “መቀደሳችሁ” የሃይማኖታዊ ቃሉን የተለመደ ድምፅ ሲጠብቅ፣ ዓረፍተ ነገሩ ግን ቀጥተኛና ተፈጥሯዊ ሆኖ ቀርቧል።
