  to: የእግዚአብሔር ፈቃድ ይህ ነውና፤ መቀደሳችሁ፣[a] ማለትም ከዝሙት እንድትርቁ።[b]
  rationale: 'The revision corrects the unidiomatic redundant pronoun, preserves the appositional structure of “God’s will: your sanctification,” and expresses the explanatory infinitive in natural Amharic. It retains the established theological vocabulary and the lexical breadth of πορνεία without adding doctrinal limits.'
