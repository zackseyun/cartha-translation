base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: am
  text: በውጭ ባሉት ሰዎች ፊት በአግባቡ እንድትኖሩና ምንም እንዳያስፈልጋችሁ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማንንም እንዳትፈልጉ።” ሐረጉ በሌሎች ላይ ጥገኛ አለመሆንን አጽንዖት ሊሰጥ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: እንድት…
  rationale: ከቀደመው ምክር ጋር የተያያዘውን ዓላማ ወይም ውጤት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: περιπατῆτε
  choice: እንድትኖሩ
  rationale: ቃሉ በቀጥታ ‘እንድትመላለሱ’ ማለት ቢሆንም፣ እዚህ የአኗኗርንና የሥነ ምግባርን ሁኔታ በዘይቤ ይገልጻል፤ ‘እንድትኖሩ’ ይህን ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εὐσχημόνως
  choice: በአግባቡ
  rationale: ተገቢ፣ የተከበረና ለሰዎች ፊት መልካም የሆነ አኗኗርን ያመለክታል፤ ቃሉን ከሥነ ምግባር አንድ ጠባብ ዘርፍ ጋር ብቻ አያያይዘውም።
- source_word: πρὸς τοὺς ἔξω
  choice: በውጭ ባሉት ሰዎች ፊት
  rationale: ከክርስቲያን ማኅበረሰብ ውጭ ካሉት ሰዎች ጋር በሚኖረው ሕዝባዊና ማኅበራዊ ግንኙነት የሚታየውን አኗኗር ይገልጻል፤ ‘የማያምኑ’ የሚለውን ከጽሑፉ የበለጠ ግልጽ ምድብ አያስገባም።
- source_word: μηδενὸς χρείαν ἔχητε
  choice: ምንም እንዳያስፈልጋችሁ
  rationale: የግሪኩን ሰፊ አገላለጽ በቅርብ ያስተላልፋል፤ በዐውዱ ውስጥ ለኑሮ በሌሎች ላይ አላስፈላጊ ጥገኛ አለመሆንን ሊያመለክት ቢችልም፣ ትርጉሙን በገንዘብ ወይም በሰዎች ብቻ አይገድበውም።
theological_decisions:
- issue: የመዝጊያው ሐረግ μηδενὸς χρείαν ἔχητε ትርጉም
  choice: ምንም እንዳያስፈልጋችሁ
  alternative: ማንንም እንዳትፈልጉ / በማንም ላይ ጥገኛ እንዳትሆኑ
  rationale: የግሪኩ ሰዋስው ‘ምንም’ የሚለውን ሰፊ ንባብ በቀጥታ ይደግፋል። ሆኖም ከዚህ በፊት ያለው በገዛ እጅ ስለ መሥራት የሚናገረው ዐውድ በሌሎች ላይ ጥገኛ አለመሆንን አማራጭ ግንዛቤ ያደርገዋል፤ ስለዚህ ይህ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እንድትኖሩ’ የሚለው የግሪኩን ዘይቤያዊ ‘መመላለስ’ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘በውጭ ባሉት ሰዎች’ የሚለውም ስያሜያዊ ፍርድ ሳይጨምር የማኅበሩን ውጭ ያመለክታል።
