  alternative: ‘በእግዚአብሔር ተምራችኋል’ ወይም ‘እግዚአብሔር አስተምሯችኋል’
  rationale: የግሪኩን ልዩ ቅጽል በተፈጥሯዊ አማርኛ ሲገልጽ የትምህርቱን መለኮታዊ ምንጭ ያስጠብቃል፤ የትምህርቱን ዘዴ ግን አይወስንም።
