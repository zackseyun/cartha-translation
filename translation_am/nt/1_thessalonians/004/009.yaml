  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: am
  text: ስለ ወንድማማች ፍቅር[a] ግን ማንም እንዲጽፍላችሁ አያስፈልጋችሁም፤[b] እርስ በርሳችሁ እንድትዋደዱ እናንተ ራሳችሁ እግዚአብሔር አስተምሯችኋልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእምነት ወንድሞችና እኅቶች ያለ ፍቅር”፤ የግሪኩ ቃል በክርስቲያን ማኅበረሰብ ውስጥ ያለውን ቤተሰባዊ ትስስር ያሳያል።
    reason: lexical_alternative
  - marker: b
    text: በግሪኩ ‘ለመጻፍ’ የሚለው ግስ ባለቤት በግልጽ አልተጠቀሰም፤ በአማርኛ ግልጽነት ምክንያት ‘ማንም’ ተጨምሯል።
    reason: lexical_alternative
lexical_decisions:
