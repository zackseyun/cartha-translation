  alternative: ‘እኛ ልንጽፍላችሁ’ ብሎ ጳውሎስንና አብረውት ያሉትን በግልጽ መጥቀስ
  rationale: ዐውዱ ‘እኛ’ የሚለውን ሊያመለክት ቢችልም፣ ግሪኩ በግልጽ አይጠቅሰውም፤ ትርጉሙ ይህን ክፍትነት ይጠብቃል።
- issue: θεοδίδακτοι የሚያመለክተው መለኮታዊ ትምህርት
