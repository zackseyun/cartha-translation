  rationale: እግዚአብሔር የትምህርቱ ምንጭና አስተማሪ መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: እርስ በርሳችሁ እንድትዋደዱ
