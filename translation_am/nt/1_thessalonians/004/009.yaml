- source_word: φιλαδελφίας
  choice: የወንድማማች ፍቅር
  rationale: በአማኞች ማኅበረሰብ ውስጥ ያለውን ቤተሰባዊ ፍቅር ይጠብቃል፤ በኋላ ከሚመጣው ἀγαπᾶν ጋር ያለውን የቃል ልዩነትም አያጠፋም።
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: ማንም ሊጽፍላችሁ አያስፈልጋችሁም
  rationale: የግሪኩ የግስ ማሟያ ግልጽ ባለቤት የለውም፤ አማርኛው ለተፈጥሯዊነት ያልተወሰነውን ‘ማንም’ ይጨምራል እንጂ ‘እኛ’ ብሎ አይወስንም።
