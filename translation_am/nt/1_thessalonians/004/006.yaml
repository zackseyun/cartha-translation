  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: am
  text: በዚህ ጉዳይ ማንም ወሰን አልፎ ወንድሙን[b] አይበዝብዝ[a]፤ ምክንያቱም ጌታ በእነዚህ ሁሉ ጉዳዮች ላይ በቀል የሚያደርግ ነው፤ እኛም አስቀድመን እንደነገርናችሁና አጥብቀን እንዳስጠነቀቅናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ጉዳይ ወንድሙን አያጭበረብር።” የግሪኩ ቃል ሌላውን ሰው ለራስ ጥቅም መጠቀምን ሊያመለክት ይችላል፤ አንዳንዶች ግን በጠበበ መልኩ ማጭበርበር ብለው ይረዱታል። በቅርብ ዐውዱ ማስጠንቀቂያው በዋናነት የወሲብ በደልን የሚመለከት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: “ወንድሙን” የተባለው በግሪክ ተባዕታይ ነጠላ ቅርጽ ካለው አገላለጽ ተተርጉሟል። ቃሉ በዋናነት የእምነት ወንድምን የሚያመለክት ቢመስልም፣ የሥነ ምግባር ማስጠንቀቂያው በማኅበሩ ውስጥ በሰፊው ሊሠራ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: ማንም ወሰን አልፎ … አይ…
  rationale: የግሪኩን የሞራል ወሰን ማለፍ ምስል በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል፤ አንቀጻዊው የግስ ስም በዐውዱ ያለውን አጠቃላይ ክልከላ ለማሳየት “ማንም” ተብሎ ተገልጿል።
- source_word: πλεονεκτεῖν
  choice: አይበዝብዝ
  rationale: ቃሉ በሌላው ሰው ኪሳራ ተገቢ ያልሆነ ጥቅም መውሰድን ያመለክታል። “መበዝበዝ” ትርጉሙን በገንዘብ ማጭበርበር ብቻ ሳይገድብ የጉዳቱን ክብደት ያሳያል።
- source_word: ἐν τῷ πράγματι
  choice: በዚህ ጉዳይ
  rationale: አገላለጹ በቃሉ አጠቃላይ ሆኖ በቅርብ ዐውድ ወደ ተነሣው የወሲብ ቅድስና ጉዳይ ያመለክታል፤ ትርጉሙ ከግሪኩ በላይ እንዳይጠብ በግልጽ አልተሰየመም።
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ወንድሙን
  rationale: የግሪኩን ተባዕታይ ነጠላ ቅርጽ ይጠብቃል፤ በዐውዱ በዋናነት የእምነት ወንድምን ሊያመለክት ይችላል።
- source_word: ἔκδικος κύριος
  choice: ጌታ … በቀልን የሚፈጽም ነው
  rationale: ἔκδικος ያለውን ፍትሐዊ ቅጣት ወይም በቀል የማስፈጸም ኃይል በተፈጥሯዊ አማርኛ ያቀርባል፤ κύριος “ጌታ” ተብሏል።
- source_word: περὶ πάντων τούτων
  choice: በእነዚህ ሁሉ ላይ
  rationale: በቀደመው ዐውድ የተነሡትን ኃጢአቶችና በደሎች በሰፊው ያካትታል።
- source_word: προείπαμεν
  choice: አስቀድመን እንደነገርናችሁ
  rationale: የቀደመ ንግግርን የሚያሳየውን የግሱን ጊዜያዊ ኃይል ይጠብቃል።
- source_word: διεμαρτυράμεθα
  choice: አጥብቀን እንዳስጠነቀቅናችሁ
  rationale: በዐውዱ ያለውን የጽኑ ምስክርነትና የከበደ ማስጠንቀቂያ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: “በዚህ ጉዳይ” የሚለው ማጣቀሻና የበደሉ ዓይነት
  choice: ቃሉ የቀደሙትን የወሲብ ቅድስና ትእዛዛት የሚቀጥል ሲሆን፣ የእምነት ወንድምን ወሰን በማለፍ ከመበዝበዝ ያስጠነቅቃል።
