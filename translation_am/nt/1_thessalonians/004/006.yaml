  rationale: ቁጥር 3–5 ስለ ቅድስና፣ ስለ ዝሙት መራቅና ራስን በክብር ስለመግዛት ይናገራሉ። ሆኖም πλεονεκτεῖν ሰፊ የመበዝበዝ ትርጉም ስላለው ዋናው ጽሑፍ ጉዳዩን በግልጽ “ወሲባዊ” ብሎ አይገድበውም።
- issue: ἀδελφός አተረጓጎም
  choice: ወንድሙን
  alternative: የእምነት ወንድሙን ወይም እኅቱን / ሌላውን አማኝ
  rationale: ዋናው ጽሑፍ የተባዕታይ ነጠላውን ቅርጽ ይጠብቃል፤ የሥነ ምግባር ትእዛዙ በማኅበረ እምነቱ ሌሎችንም ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- issue: κύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: በዚህ ዐውድ ፍርድን የሚፈጽመውን ጌታ ያመለክታል፤ “ጌታ” የተለመደውን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ቀጣይነት ይጠብቃል።
- issue: ἔκδικος ያለው የፍርድ ኃይል
  choice: በቀልን የሚፈጽም
  alternative: ፍትሕን የሚያስፈጽም / የሚበቀል
  rationale: “በቀልን የሚፈጽም” የቃሉን ጠንካራ የፍርድ ኃይል ሳያለዝብ በቀሉ የጌታ ፍትሐዊ ምላሽ መሆኑን ያሳያል።
