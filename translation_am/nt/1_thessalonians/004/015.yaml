reference: 1 Thessalonians 4:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: am
  text: ይህን በጌታ ቃል[a] እንነግራችኋለን፤ እኛ በሕይወት ያለን፣ እስከ ጌታ መምጣት[b] ድረስ የምንቀር፣ ያንቀላፉትን[c] ፈጽሞ አንቀድምም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከጌታ በመጣ ቃል።” የግሪኩ አገላለጽ ከጌታ ኢየሱስ የተነገረ ቃልን ወይም በጌታ ሥልጣን የተሰጠ ራእይን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: “መምጣት” ተብሎ የተተረጎመው የግሪክ ቃል παρουσία ሲሆን፣ “መገኘት” ወይም “መድረስ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: “ያንቀላፉት” የሚለው የሞቱ አማኞችን የሚያመለክት ዘይቤ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: በጌታ ቃል
  rationale: የጳውሎስ ንግግር በጌታ ቃል ላይ የተመሠረተና የጌታን ሥልጣን የያዘ መሆኑን ያሳያል፤ ይህም በቀጥታ የተጠቀሰ የኢየሱስ ንግግር ይሁን ወይም በራእይ የተሰጠ ቃል መሆኑን አይወስንም።
- source_word: παρουσίαν
  choice: መምጣት
  rationale: በዚህ የፍጻሜ ዘመን አውድ የጌታን ወደፊት መድረስ በተፈጥሯዊ አማርኛ ይገልጣል፤ ቃሉ ‘መገኘት’ ወይም ‘መድረስ’ የሚል ሰፊ ትርጉምም አለው።
- source_word: οἱ ζῶντες
  choice: በሕይወት ያለን
  rationale: የግሪኩን የአሁን ጊዜ አሳታፊ ቅርጽ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: οἱ περιλειπόμενοι
  choice: የምንቀር
  rationale: እስከተጠቀሰው ጊዜ ድረስ በሕይወት ቀርተው የሚገኙትን ያመለክታል፤ ‘የምንተርፍ’ የሚለው ሊያስገባ የሚችለውን ተጨማሪ የአደጋ ሐሳብ ያስወግዳል።
- source_word: οὐ μὴ φθάσωμεν
  choice: ፈጽሞ አንቀድምም
  rationale: οὐ μὴ ያለውን ጠንካራ እምቢታ ‘ፈጽሞ’ ይገልጣል፤ φθάνω በዚህ አውድ ‘መቅደም’ ማለት ነው።
- source_word: τοὺς κοιμηθέντας
  choice: ያንቀላፉትን
  rationale: ለሞቱ አማኞች የተጠቀመውን የእንቅልፍ ዘይቤ ይጠብቃል፤ ‘የሞቱት’ ብሎ በቀጥታ መተርጎም የጽሑፉን ሥነ ንግግራዊና ትንሣኤን አመልካች ገጽታ ያጠፋል።
- source_word: κύριος / κυρίου
  choice: ጌታ
  rationale: በዚህ የፍጻሜ ዘመን አውድ ኢየሱስን የሚያመለክተውን κύριος በተለመደውና የተከበረው የአማርኛ አቻ ይተረጉማል።
theological_decisions:
- issue: “በጌታ ቃል” የሚለው የጳውሎስ ማጣቀሻ ምንነት
  choice: የቃሉን የጌታ ሥልጣን ጠብቆ የተላለፈበትን መንገድ አለመወሰን
  alternative: የኢየሱስን የታወቀ ንግግር በቀጥታ እንደጠቀሰ ወይም ጳውሎስ በራእይ እንደተቀበለው በግልጽ መወሰን
  rationale: ἐν λόγῳ κυρίου የጌታን ሥልጣን ያረጋግጣል እንጂ ቃሉ በምን መንገድ እንደደረሰ በራሱ አይገልጥም።
- issue: κοιμηθέντας ያለው የእንቅልፍ ዘይቤ
  choice: ለሞቱ አማኞች የተጠቀመውን የእንቅልፍ ዘይቤ ማቆየት
  alternative: ‘የሞቱት’ ብሎ በቀጥታ መተርጎም
  rationale: ዘይቤው አካላዊ ሞትን ሳይክድ በትንሣኤ ተስፋ ብርሃን ውስጥ ያቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አረፍተ ነገር አጽንዖት በ‘ፈጽሞ አንቀድምም’ ተጠብቋል፤ የእንቅልፍ ዘይቤና ‘በጌታ ቃል’ ያለው አሻሚነትም አልተፈታም።
