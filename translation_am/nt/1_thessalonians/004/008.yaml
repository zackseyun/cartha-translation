  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: am
  text: ስለዚህ፣ ይህን ችላ የሚል ማንም ሰውን ሳይሆን እግዚአብሔርን፣ ቅዱስ መንፈሱንም ለእናንተ የሚሰጠውን፣ ችላ ይላል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  choice: ስለዚህ
  rationale: ከቀደመው ማሳሰቢያ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: ይህን የማይቀበል ማንም … የማይቀበለው
  rationale: የግሪኩን አጠቃላይ የሆነ አመልካች ኃይል ይጠብቃል፤ ግሱም ሥልጣን ያለውን ትምህርት አለመቀበል፣ ችላ ማለት ወይም ወደ ጎን ማድረግን ሊያመለክት ይችላል።
- source_word: οὐκ ἄνθρωπον … ἀλλὰ τὸν θεόν
  choice: ሰውን ሳይሆን እግዚአብሔርን
  rationale: በሰውና በእግዚአብሔር መካከል ያለውን አጭርና ጠንካራ ንጽጽር ይጠብቃል፤ ‘ሰው’ እዚህ አጠቃላይ ፍቺ አለው።
- source_word: τὸν καὶ διδόντα
  choice: እርሱም … ይሰጣል
  rationale: ካίን በ‘ም’ ያንጸባርቃል፤ የአሁን ጊዜውን ቦዝ አንቀጽም በተፈጥሯዊ የአማርኛ አንጻራዊ አገላለጽ ይሰጣል።
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: ቅዱስ መንፈሱን
  rationale: በጳውሎሳዊው አውድ የእግዚአብሔርን ቅዱስ መንፈስ ያመለክታል፤ የባለቤትነት ቅጥያው αὐτοῦን ያንጸባርቃል።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ
  rationale: εἰς በቀጥታ ‘ወደ/ውስጥ’ ሊሆን ቢችልም፣ ከ‘መስጠት’ ግስ ጋር ‘ለእናንተ’ ተፈጥሯዊ አማርኛ ሲሆን የተቀባይነትን ፍቺ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: ‘ቅዱስ መንፈሱ’ የሚያመለክተው
  choice: እግዚአብሔር ለአማኞች የሚሰጠውን ቅዱስ መንፈስ እንደሚያመለክት ተተርጉሟል።
  alternative: ቅዱስ የሆነ የውስጥ ዝንባሌ ወይም ግላዊ ያልሆነ ስጦታ
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον የሚለው አገባብና የጳውሎስ አውድ በተፈጥሮ የእግዚአብሔርን ቅዱስ መንፈስ ያመለክታሉ፤ ከጽሑፉ በላይ የሆነ የእምነት ሥርዓት አልተጨመረም።
- issue: ὁ ἀθετῶν ያለው አጠቃላይ ኃይል
  choice: ‘ይህን የማይቀበል ማንም’ ተብሎ ለሁሉም ሰው በሚሠራ መልኩ ተተርጉሟል።
  alternative: በወንድ ፆታ ብቻ የተገደበ አገላለጽ
  rationale: የግሪኩ ወንድ ነጠላ ቅርጽ እዚህ ወኪላዊና አጠቃላይ እንጂ ለወንዶች ብቻ የተወሰነ አይደለም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ‘እግዚአብሔር’ እና ‘ቅዱስ መንፈስ’ የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሆነው ተጠብቀዋል፤ አወቃቀሩ ግን ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
