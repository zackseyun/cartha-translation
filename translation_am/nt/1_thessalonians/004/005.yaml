translation:
  language: am
  text: በፍትወት ግለት ሳይሆን፣ እግዚአብሔርን እንደማያውቁ አሕዛብም እንደሚያደርጉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: በፍትወት ግለት አይሁን
  rationale: «ግለት» የπάθοςን ኃይለኛ ስሜት፣ «ፍትወት» ደግሞ በዚህ የወሲባዊ ሥነ ምግባር አውድ ያለውን ἐπιθυμία ይገልጣሉ። ሁለቱንም የግሪክ ስሞች በተፈጥሯዊ የአማርኛ አገላለጽ ያቆያል።
- source_word: καθάπερ καὶ
  choice: እንደማያውቁት ... ም አታድርጉ
  rationale: የንጽጽሩን ኃይል በአማርኛ ተፈጥሯዊ በሆነ ክልከላ ያስተላልፋል፤ «-ም» የκαὶን ተጨማሪ ኃይል ይጠብቃል።
- source_word: τὰ ἔθνη
  choice: አሕዛብ
  rationale: በጳውሎስ አጠቃቀም ከአይሁድ ውጭ ያሉትን ሕዝቦች የሚያመለክተውን የዘርና የሃይማኖት ምድብ ይጠብቃል፤ «ጣዖት አምላኪዎች» የሚለውን ትርጓሜያዊ ጭማሪ አያስገባም።
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: እግዚአብሔርን እንደማያውቁት
  rationale: የአሕዛብን ቀጣይ ሁኔታ የሚገልጠውን የአሁን ጊዜ አሳታፊ ቅርጽ በግልጽ የአማርኛ አንቀጽ ይመልሳል።
theological_decisions:
- issue: የἔθνη ትርጉም በሥነ ምግባር ምክር አውድ
  choice: አሕዛብ
  alternative: ሕዝቦች፤ ጣዖት አምላኪዎች
  rationale: «አሕዛብ» የጳውሎስን የተለመደ የአይሁድ ያልሆኑ ሕዝቦች ማመልከቻ ይጠብቃል። «ሕዝቦች» በዘመናዊ አማርኛ ከመጠን በላይ ሰፊ ሲሆን፣ «ጣዖት አምላኪዎች» ከጽሑፉ የበለጠ ትርጓሜ ያክላል።
- issue: የπάθει ἐπιθυμίας ኃይል
  choice: በፍትወት ግለት
  alternative: በኃይለኛ ምኞት፤ በፍትወታዊ ግለት
  rationale: አውዱ የተዛባ ወሲባዊ ምኞትን ያመለክታል። የተመረጠው አገላለጽ ሁለቱን ስሞች ይጠብቃል፣ ነገር ግን ግንኙነታቸውን ከሚገባው በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ጥቅሱ ከቀዳሚው ጥቅስ የሚቀጥል ቢሆንም፣ «አይሁን ... አታድርጉ» በማለት በራሱም ሲነበብ ግልጽ እንዲሆን ተደርጓል።
