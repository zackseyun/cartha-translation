- from: በፍትወት ግለት[a] አይሁን፤ እግዚአብሔርን እንደማያውቁት አሕዛብም[b] አታድርጉ።
  to: በፍትወት ግለት ሳይሆን፣ እግዚአብሔርን እንደማያውቁ አሕዛብም እንደሚያደርጉት።
  rationale: The revision retains the draft’s sound lexical choices while restoring the verse’s function as a continuation of 4:4. ሳይሆን conveys the negated manner, and እንደሚያደርጉት supplies the action naturally from the immediately preceding context without specifying a new action or doctrinal interpretation. The -ም on አሕዛብ preserves the comparative/additive force of καὶ.
