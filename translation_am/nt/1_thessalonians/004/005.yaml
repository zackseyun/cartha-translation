    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s sound lexical choices while restoring the verse’s function as a continuation of 4:4. ሳይሆን conveys the negated manner, and እንደሚያደርጉት supplies the action naturally from the immediately preceding context without specifying a new action or doctrinal interpretation. The -ም on አሕዛብ preserves the comparative/additive force of καὶ.
