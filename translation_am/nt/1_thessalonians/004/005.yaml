review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies πάθει ἐπιθυμίας as a negatively characterized desire and τὰ ἔθνη as አሕዛብ. However, it turns the source’s dependent negative prepositional phrase into two independent prohibitions (አይሁን … አታድርጉ), adding imperative force and an explicit action not present in this verse.
  naturalness: በፍትወት ግለት አይሁን is not a natural or well-formed way to continue the preceding exhortation, and the following አታድርጉ redundantly restructures the comparison. A participial continuation is more natural in Amharic and better reflects the Greek syntax.
  terminology: አሕዛብ is suitable for τὰ ἔθνη in this Pauline context. ፍትወት and ግለት adequately preserve the sexual/desiderative force of ἐπιθυμία and the intensity of πάθος. The alternatives in the notes are retained, with punctuation normalized.
  issues:
  - severity: medium
    issue: The clause is recast as independent prohibitions.
    rationale: Greek μὴ ἐν πάθει ἐπιθυμίας continues the preceding exhortation and is followed by a comparison. The draft’s አይሁን … አታድርጉ adds two finite prohibitions and an explicit command absent from the verse.
  - severity: medium
    issue: Comparison syntax is obscured.
    rationale: καθάπερ καὶ introduces “just as also the Gentiles who do not know God.” Rendering it with አታድርጉ makes the comparison sound like a separate command rather than the manner contrasted with the preceding verse.
  - severity: low
    issue: Footnote closing quotation marks are placed before terminal punctuation.
    rationale: Modern Amharic punctuation is clearer when the full stop follows the closing quotation mark in the alternatives.
  revised_text: በፍትወት ግለት ሳይሆን፣ እግዚአብሔርን እንደማያውቁ አሕዛብም እንደሚያደርጉት።
  revised_footnotes:
  - marker: a
    text: ወይም፣ «በፍትወታዊ ግለት» ወይም «በኃይለኛ ምኞት»።
    reason: lexical_alternative
  - marker: b
