- source_word: ἔργου τῆς πίστεως
  choice: የእምነታችሁን ሥራ
  rationale: የግሪኩን ስማዊ አገላለጽና የሦስቱን ተመሳሳይ አወቃቀር ይጠብቃል፤ እምነት ሥራውን የሚያፈልቅ ወይም የሚለይ መሆኑን ያለ ከልክ ማብራሪያ ያሳያል።
- source_word: κόπου τῆς ἀγάπης
  choice: የፍቅራችሁን ድካም
  rationale: κόπος የሚያመለክተውን ከባድና አድካሚ ጥረት ይይዛል፤ ከ‘ሥራ’ የተለየውን ኃይለ ቃልም ያቆያል።
- source_word: ὑπομονῆς τῆς ἐλπίδος
