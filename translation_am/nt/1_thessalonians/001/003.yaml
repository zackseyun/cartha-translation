- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: በጌታችን በኢየሱስ መሲሑ ላይ
  rationale: የዘር ሐረጉ ተስፋው የተመሠረተበትን አካል እንደሚገልጽ በተፈጥሯዊ አማርኛ ያሳያል፤ Χριστόςንም እንደ ማዕረግ ‘መሲሑ’ ብሎ ያቀርባል።
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: በአምላካችንና በአባታችን ፊት
  rationale: ἔμπροσθεν ያለውን በፊት/በመገኘት ሐሳብ በግልጽ ሁኔታ ይጠብቃል፤ ሁለቱን መጠሪያዎችም በቅርብ ግንኙነት ያቀርባል።
