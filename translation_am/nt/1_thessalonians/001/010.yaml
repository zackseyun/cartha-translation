base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: am
  text: እንዲሁም እግዚአብሔር ከሙታን ያስነሣውን፣ ከሚመጣው ቁጣ የሚያድነንን ኢየሱስን፣ ልጁን ከሰማያት እንድትጠብቁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከወደፊት ቁጣ የሚያድነን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένειν
  choice: እንድትጠብቁ
  rationale: ቃሉ በተስፋና በመጠባበቅ መጠበቅን ያመለክታል፤ በቁጥር 9 ከተጀመረው የተሰሎንቄዎች ወደ እግዚአብሔር መመለስ ገለጻ ጋር እንዲቀጥል የዓላማ አገባብ ተጠብቋል።
- source_word: υἱὸν αὐτοῦ
  choice: ልጁን
  rationale: የአባትና የወልድን ግንኙነት የሚገልጠውን ክርስቶሳዊ ማዕረግ ያለ ማስፋፋት በቀጥታ ያስተላልፋል።
- source_word: ἐκ τῶν οὐρανῶν
  choice: ከሰማያት
  rationale: የግሪኩን ብዙ ቁጥር በተፈጥሯዊና በተለመደ የአማርኛ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: እርሱም ከሙታን ያስነሣው
  rationale: ἐκ τῶν νεκρῶν የሚለውን መደበኛ የትንሣኤ አገላለጽ ይጠብቃል፤ የግሱ ባለቤትም በአገባቡ እግዚአብሔር መሆኑን ‘እርሱም’ ያሳያል።
- source_word: Ἰησοῦν
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: τὸν ῥυόμενον
  choice: የሚያድነን
  rationale: የአሁን ጊዜው ተሳቢ ኢየሱስን በአዳኝነት ባሕርይና ተግባር ይገልጣል፤ በግልጽ የወደፊት ጊዜ ግስ አልተተካም።
- source_word: ἐκ τῆς ὀργῆς
  choice: ከ…ቁጣ
  rationale: ὀργή ከአጠቃላይ ‘ፍርድ’ ይልቅ ‘ቁጣ’ በሚለው በትክክል ይተላለፋል፤ ἐκ ደግሞ ‘ከ’ ተብሎ ተተርጉሟል።
- source_word: τῆς ἐρχομένης
  choice: ከሚመጣው
  rationale: የሚቀርበውን ወይም ወደፊት የሚመጣውን ቁጣ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የ‘ሚመጣው ቁጣ’ ምንነት
  choice: ‘ከሚመጣው ቁጣ’ የሚለውን ሐረግ ያለ ተጨማሪ ትርጓሜ ማቆየት
  alternative: ‘ከሚመጣው ፍርድ’ ማለት፣ ወይም ሐረጉን በተለይ የመጨረሻው ፍርድ ወይም የፍጻሜ ዘመን መከራ ብሎ መወሰን
  rationale: ቁጥሩ በራሱ የቁጣውን ትክክለኛ መልክ አይወስንም፤ ስለዚህ የግሪኩ ሥነ መለኮታዊ ክብደትና ክፍትነት ተጠብቋል።
- issue: የῥυόμενον የጊዜ ኃይል
  choice: ‘የሚያድነን’ ብሎ መተርጎም
  alternative: ‘የሚያድነን ይሆናል’ ወይም ‘እያዳነን ያለው’ ብሎ መተርጎም
  rationale: አውዱ ወደፊት የሚመጣ ቁጣን ቢመለከትም፣ የግሪኩ የአሁን ጊዜ ተሳቢ ኢየሱስን እንደ አዳኝ ይገልጣል እንጂ ተግባሩን በግልጽ ለወደፊት ጊዜ ብቻ አይገድብም።
