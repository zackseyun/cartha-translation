review_pass:
  verdict: revise
  source_fidelity: 'The draft substantially mistranslates ἐκ τῶν οὐρανῶν by making it modify the Son as “the Son who is coming from heaven/heavens.” In the Greek it belongs with ἀναμένειν: the readers are to wait for God’s Son from heaven. The resurrection relative clause also needs an unambiguous subject in Amharic; the draft’s “እርሱም” naturally refers to the Son rather than to God.'
  naturalness: 'The current two-sentence construction is understandable but syntactically misleading and awkward: “እርሱም ከሙታን ያስነሣው” leaves the raiser unclear. A single dependent construction better reflects that this clause continues the thought of verse 9, while remaining readable in modern standard Amharic.'
  terminology: Retain ልጁን, ኢየሱስን, ከሙታን, ቁጣ, and የሚያድነን. “ከሰማያት” is acceptable biblical-standard Amharic for the plural Greek expression. The phrase “ከሚመጣው ቁጣ” appropriately preserves the source’s theological openness.
  issues:
  - severity: high
    issue: “ከሰማያት የሚመጣውን ልጁን” makes “from heaven/heavens” modify the Son as coming.
    rationale: 'The Greek word order and syntax attach ἐκ τῶν οὐρανῶν to “wait for”: “wait for his Son from heaven.” The Son’s coming may be contextually anticipated, but it is not asserted by this grammatical construction.'
  - severity: high
    issue: “እርሱም ከሙታን ያስነሣው” gives an unclear, and most naturally incorrect, referent for the raiser.
    rationale: The antecedent of “እርሱ” in the draft is the Son, whereas the Greek’s implied subject of ἤγειρεν is God, established in the preceding context. Explicit “እግዚአብሔር” is needed for clear Amharic.
  - severity: medium
    issue: The wording “... ኢየሱስ ነው” turns the Greek appositional phrase into an independent identification sentence.
    rationale: This weakens the syntactic continuation from verse 9 and contributes to the ambiguity of the resurrection clause. A dependent noun phrase preserves the source structure more closely.
  revised_text: እንዲሁም እግዚአብሔር ከሙታን ያስነሣውን፣ ከሚመጣው ቁጣ የሚያድነንን ኢየሱስን፣ ልጁን ከሰማያት እንድትጠብቁ።[a]
