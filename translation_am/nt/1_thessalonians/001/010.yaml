revisions:
- from: እንዲሁም ከሰማያት የሚመጣውን ልጁን እንድትጠብቁ ነው። እርሱም ከሙታን ያስነሣው፣ ከሚመጣው ቁጣ የሚያድነን ኢየሱስ ነው።[a]
  to: እንዲሁም እግዚአብሔር ከሙታን ያስነሣውን፣ ከሚመጣው ቁጣ የሚያድነንን ኢየሱስን፣ ልጁን ከሰማያት እንድትጠብቁ።[a]
  rationale: The revision places “ከሰማያት” with “እንድትጠብቁ,” as required by the Greek syntax, and explicitly identifies God as the one who raised Jesus, avoiding a false Son-as-subject reading. It keeps the present-characterizing force of “የሚያድነን” and does not define the nature or timing of the coming wrath beyond the source text.
