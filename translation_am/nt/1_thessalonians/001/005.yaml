reference: 1 Thessalonians 1:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: am
  text: ምክንያቱም ወንጌላችን ወደ እናንተ የመጣው በቃል ብቻ ሳይሆን፣ በኃይልም፣ በመንፈስ ቅዱስም፣ በታላቅ እርግጠኝነትም[a] ነው። ለእናንተ ሲባል በመካከላችሁ ምን ዓይነት ሰዎች እንደነበርን[b] እናንተ ራሳችሁ ታውቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በታላቅ ጽኑ እምነት» ወይም «በብዙ እርግጠኝነት»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ምን ዓይነት ሰዎች ሆነን እንደተገኘን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: ወንጌል
  rationale: በጳውሎስ መልእክቶች የሐዋርያትን የምሥራች መልእክት የሚያመለክተውን የተለመደ እና ተፈጥሯዊ የአማርኛ ቃል ይጠብቃል።
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: ወደ እናንተ የመጣው
  rationale: የወንጌሉን መድረስና በተሰሎንቄ ሰዎች መካከል መገለጥ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν λόγῳ μόνον
  choice: በቃል ብቻ
  rationale: የቃል አዋጅን ከአብሮት ከነበረው ኃይል ጋር የሚያነጻጽረውን የግሪክ አወቃቀር ይጠብቃል።
- source_word: ἐν δυνάμει
  choice: በኃይል
  rationale: የተደጋገመውን ἐν አወቃቀርና የሐረጎቹን ትይዩነት በአማርኛ ይይዛል።
- source_word: ἐν πνεύματι ἁγίῳ
  choice: በመንፈስ ቅዱስ
  rationale: እዚህ ሐረጉ የሰውን መንፈስ ወይም መንፈሳዊ ስሜትን ሳይሆን መለኮታዊውን መንፈስ ቅዱስ ያመለክታል።
- source_word: πληροφορίᾳ πολλῇ
  choice: በታላቅ እርግጠኝነት
  rationale: የሙሉ ማረጋገጥን፣ ጽኑ እምነትን ወይም እርግጠኝነትን ሊያመለክት የሚችለውን ሰፊ ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል፤ የእርግጠኝነቱን ባለቤት አይወስንም።
- source_word: καθὼς οἴδατε
  choice: እናንተው ታውቃላችሁ
  rationale: የተሰሎንቄ ሰዎች በራሳቸው የሚያውቁትን ማረጋገጫ አጽንዖት ሰጥቶ ያሳያል።
- source_word: οἷοι ἐγενήθημεν
  choice: ምን ዓይነት ሰዎች እንደሆንን
  rationale: የጳውሎስንና የባልደረቦቹን ባሕርይና በመካከላቸው የታየውን አኗኗር ያሳያል፤ የግሪኩን γίνομαι በተፈጥሯዊ አማርኛ ይተረጉማል።
- source_word: ἐν ὑμῖν
  choice: በመካከላችሁ
  rationale: በተሰሎንቄ ሰዎች መካከል የነበራቸውን መኖርና አኗኗር በግልጽ ያሳያል።
- source_word: δι’ ὑμᾶς
  choice: ለእናንተ ሲባል
  rationale: በዐውዱ ያለውን የጥቅምና የዓላማ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የ«πνεύματι ἁγίῳ» ማጣቀሻ
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ ወይም መንፈሳዊ ኃይል
  rationale: በጳውሎስ አጠቃቀምና ቃልን ከመለኮታዊ ኃይል ጋር በሚያነጻጽረው ዐውድ ሐረጉ መለኮታዊውን መንፈስ ቅዱስ ያመለክታል።
- issue: የ«πληροφορίᾳ πολλῇ» ትርጉምና የእርግጠኝነቱ ባለቤት
  choice: በታላቅ እርግጠኝነት
  alternative: በታላቅ ጽኑ እምነት፤ በፍጹም ማረጋገጥ
  rationale: ግሪኩ እርግጠኝነቱ በሰባኪዎቹ፣ በሰሚዎቹ ወይም በመልእክቱ አቀራረብ ውስጥ መሆኑን በግልጽ አይወስንም፤ ይህ አተረጓጎም ያንን ክፍትነት ይጠብቃል።
- issue: የ«οἷοι ἐγενήθημεν» አተረጓጎም
  choice: ምን ዓይነት ሰዎች እንደሆንን
  alternative: ምን ዓይነት ወንዶች ሆነን እንደተገኘን፤ እንዴት እንደኖርን
  rationale: ሐረጉ የተልእኮ ቡድኑን ባሕርይና የታየ አኗኗር ያመለክታል። «ሰዎች» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የቡድኑን ጾታ ላይ ዐውዱ ያልጠየቀውን አጽንዖት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር «በቃል… በኃይል… በመንፈስ ቅዱስ… በታላቅ እርግጠኝነት» ተጠብቋል፤ የእርግጠኝነቱ ባለቤት ሆን ተብሎ አልተወሰነም።
