  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: am
  text: እናንተም በብዙ መከራ ውስጥ ቃሉን ከመንፈስ ቅዱስ በሚመጣ ደስታ[a] ተቀብላችሁ፣ የእኛንና የጌታን ምሳሌ የምትከተሉ ሆናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመንፈስ ቅዱስ ደስታ”፤ ይህ ደስታ መንፈስ ቅዱስ ያስገኘው መሆኑን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: የምትመስሉ
  rationale: የሌላውን ምሳሌና አካሄድ መከተልን ያመለክታል፤ ‘ተከታዮች’ ከሚለው ይልቅ የመምሰልን ሐሳብ ይጠብቃል፣ ‘አስመሳዮች’ የሚለውንም አሉታዊ ትርጉም ያስወግዳል።
- source_word: ἐγενήθητε
  choice: ሆናችሁ
  rationale: ወደ አዲስ ሁኔታ መግባታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κυρίου
  choice: ጌታን
  rationale: በዚህ ስፍራ ቃሉ ኢየሱስን የሚያመለክት የክብር ስያሜ ነው።
- source_word: δεξάμενοι
  choice: ተቀብላችሁ
  rationale: ቃሉን በፈቃደኝነት መቀበላቸውን ያሳያል፤ የአማርኛው አገባብ ይህን ድርጊት ከ‘ሆናችሁ’ ጋር በተፈጥሮ ያያይዛል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: የተሰበከውን የወንጌል መልእክት ያመለክታል፤ የጳውሎስን የቃላት አጠቃቀምም ይጠብቃል።
- source_word: ἐν θλίψει πολλῇ
  choice: በብዙ መከራ ውስጥ
  rationale: ጫናን፣ ስቃይንና ተቃውሞን የሚያካትተውን ሰፊ ትርጉም ያቀርባል፤ የፍጻሜ ዘመን ልዩ ፍቺን አያስገባም።
- source_word: μετὰ χαρᾶς
  choice: በሆነ ደስታ
  rationale: ቃሉን በደስታ እንደተቀበሉ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πνεύματος ἁγίου
  choice: ከመንፈስ ቅዱስ
  rationale: ደስታው ከመንፈስ ቅዱስ እንደመጣ የሚያመለክተውን አውዳዊ ንባብ ያቀርባል፤ የግሪኩ የዝምድና አሻሚነት በማስታወሻው ተጠብቋል።
theological_decisions:
- issue: በχαρᾶς πνεύματος ἁγίου ውስጥ ያለው የዝምድና ፍቺ
  choice: ደስታው ከመንፈስ ቅዱስ የመጣ ነው
  alternative: ‘የመንፈስ ቅዱስ ደስታ’ ብሎ ዝምድናውን ሳይወስን መተርጎም፣ ወይም መንፈስ ቅዱስ ያስገኘው ደስታ ብሎ መግለጽ
  rationale: በብዙ መከራ መካከል ያለው ደስታ ምንጩ መንፈስ ቅዱስ መሆኑን አውዱ ይደግፋል፤ ግሪኩ ግን የዝምድናውን ዓይነት በግልጽ ስለማይወስን አማራጩ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የመምሰል ሐሳብ ለመጠበቅ ‘የምትመስሉ’ ተመርጧል፤ የቃላት ቅደም ተከተሉ ለተፈጥሯዊ አማርኛ ተስተካክሏል።
