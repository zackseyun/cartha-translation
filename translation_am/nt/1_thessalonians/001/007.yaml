lexical_decisions:
- source_word: ὥστε
  choice: በዚህም ምክንያት
  rationale: ከቀደመው አንቀጽ የሚመጣውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል፤ ὥστε ያለውን የውጤት ኃይል ይጠብቃል።
- source_word: γενέσθαι ὑμᾶς
  choice: ሆናችሁ
  rationale: የውጤት ኢንፊኒቲቭ አወቃቀሩን በተፈጥሯዊ የአማርኛ ሐረግ ያቀርባል፤ ሁለተኛ መደብ ብዙ ቁጥርንም በግልጽ ያሳያል።
- source_word: τύπον
  choice: ምሳሌ
  rationale: ሌሎች ሊከተሉት የሚገባ አርአያ ወይም ንድፍ የሚለውን ትርጉም በዘመናዊና ቀላል አማርኛ ያስተላልፋል።
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: ላሉ አማኞች ሁሉ
  rationale: የግሪኩን ስም ሆኖ የሚሠራ አሳታፊ ግስ ‘የሚያምኑ ሁሉ’ በሚለው ሐሳብ ይይዛል፤ የመገኛ ሐረጉን ከአማኞች ጋር በግልጽ ያያይዛል።
- source_word: ἐν τῇ Μακεδονίᾳ καὶ ἐν τῇ Ἀχαΐᾳ
  choice: በመቄዶንያና በአካይያ
  rationale: ሁለቱን የቦታ ሐረጎች ትይዩነት በመጠበቅ የክልሎቹን ስሞች በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
