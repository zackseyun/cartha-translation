source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: am
  text: ከእናንተ የጌታ ቃል በመቄዶንያና በአካይያ ብቻ ሳይሆን አስተጋብቷል፤ ወደ እግዚአብሔር ያላችሁ እምነትም[a] በየስፍራው ሁሉ ተሰራጭቷል፤ ስለዚህ እኛ ምንም ነገር እንድንናገር አያስፈልገንም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእግዚአብሔር ያላችሁ እምነት።” የግሪኩ አገላለጽ ቃል በቃል “ወደ እግዚአብሔር ያላችሁ እምነት” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: አስተጋብቷል
  rationale: የመሰማትና ከአንድ ምንጭ ወጥቶ የማስተጋባትን ምስል ይጠብቃል፤ የፍጹም ጊዜውንም የአሁን ውጤት ያሳያል።
- source_word: ὁ λόγος τοῦ κυρίου
  choice: የጌታ ቃል
  rationale: የጳውሎስን የተለመደ አገላለጽ ይጠብቃል፤ ቃሉ ከጌታ የሆነ ወይም ስለ ጌታ የሚናገር መሆኑን በግድ አይወስንም።
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: መቄዶንያና አካይያ
  rationale: የክልሎቹን ስሞች በአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ልማድ መሠረት ያቀርባል።
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: በየስፍራው ሁሉ
  rationale: የπαντίን አከፋፋይ ኃይልና የτόπῳን ግልጽ የቦታ ትርጉም ይጠብቃል።
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: ወደ እግዚአብሔር ያላችሁ እምነት
  rationale: πρὸς ያለውን አቅጣጫዊ ስሜት በ“ወደ” በማቆየት የግሪኩን አገላለጽ በቅርብ ይከተላል፤ ተፈጥሯዊው “በእግዚአብሔር ያላችሁ እምነት” በማስታወሻ ቀርቧል።
- source_word: ἐξελήλυθεν
  choice: ተሰራጭቷል
  rationale: ቃል በቃል “ወጥቷል” ከሚለው ይልቅ በአማርኛ የእምነታቸው ዝና በየስፍራው መድረሱን በተፈጥሮ ይገልጻል፤ የፍጹም ጊዜውንም ውጤት ይጠብቃል።
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: ስለዚህ እኛ … አያስፈልገንም
  rationale: ὥστε የሚያሳየውን ውጤትና የግሪኩን የአስፈላጊነት ፈሊጥ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: λαλεῖν τι
  choice: ምንም ነገር መናገር
  rationale: በዐውዱ ውስጥ ግልጽና ተፈጥሯዊ ሲሆን በግሪኩ ያልተጨመረ አጽንዖት አያስገባም።
theological_decisions:
- issue: የπίστις አተረጓጎም
  choice: እምነት
  alternative: ታማኝነት፤ መታመን
  rationale: በዚህ ዐውድ የተሰሎንቄ ሰዎች ወደ እግዚአብሔር ያደረጉትን የማመን ምላሽ ያመለክታል፤ በዋናነት የእነርሱን ታማኝነት አይጠቁምም።
- issue: የπρὸς τὸν θεόν አቅጣጫዊ አገላለጽ
  choice: ወደ እግዚአብሔር
  alternative: በእግዚአብሔር
  rationale: ዋናው ጽሑፍ የπρόςን ቀጥተኛ አቅጣጫዊ ኃይል ይጠብቃል፤ በአማርኛ ይበልጥ የተለመደው አማራጭ ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የድምፅ ምስሉ “አስተጋብቷል” በሚለው ተጠብቋል፤ ረጅሙ የግሪክ ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ተከፍሏል።
