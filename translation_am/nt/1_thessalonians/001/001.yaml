  choice: ጳውሎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግሪክ ስም ቅርጽ ይከተላል።
- source_word: Σιλουανὸς
  choice: ስልዋኖስ
  rationale: ምንጩ ያለውን Σιλουανός በቀጥታ የሚወክል ስም ነው፤ ‘ሲላስ’ የሌላውን የግሪክ ቅርጽ ይከተላል።
- source_word: Τιμόθεος
  choice: ጢሞቴዎስ
  rationale: በአማርኛ የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἐκκλησίᾳ
  choice: ማኅበር
  rationale: ቃሉ የተሰበሰበውን የአማኞች ማኅበረሰብ ያመለክታል፤ ‘ማኅበር’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል፣ ‘ቤተ ክርስቲያን’ ደግሞ ተለምዶ የሚጠቀም አማራጭ ነው።
- source_word: Θεσσαλονικέων
  choice: የተሰሎንቄ ሰዎች
  rationale: የብዙ ቁጥር ዝምድናውን በግልጽ አማርኛ ያሳያል።
- source_word: ἐν
  choice: በ…ለምትኖረው
  rationale: ἐν የሚገልጸውን የሕልውናና የግንኙነት ማዕቀፍ ‘በ’ በማለት ይጠብቃል፤ ለአማርኛ ሐረጉ ሙሉ እንዲሆን ‘ለምትኖረው’ ተጨምሯል።
- source_word: θεῷ πατρὶ
  choice: እግዚአብሔር አብ
  rationale: በግሪኩ ‘የእኛ’ የሚል ባለቤትነት ስለሌለ፣ ተጨማሪ ቃል ሳይገባ መስተዋድዳዊውን አገባብ ይጠብቃል።
- source_word: κυρίῳ
  choice: ጌታ
  rationale: በአዲስ ኪዳን አጠቃቀም κύριοςን በተፈጥሯዊና በተለመደ መንገድ ይተረጉማል።
- source_word: Ἰησοῦ Χριστῷ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግ እንደሆነ ለማሳየት ‘መሲሕ’ ተብሏል፤ ‘ክርስቶስ’ የተለመደ የፊደል ንባብ አማራጭ ነው።
- source_word: χάρις
  choice: ጸጋ
  rationale: የጳውሎስን የሰላምታ ቃልና ሥነ መለኮታዊ ድምፁን የሚጠብቅ መደበኛ ትርጉም ነው።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የግሪክና የአይሁድ የሰላምታ ድምፅን የሚያስተላልፍ ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: ጸጋና ሰላም ለእናንተ ይሁን
  rationale: የቡራኬ ሰላምታውን በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ይሁን’ በግሪኩ የተገመተውን ግስ ግልጽ ያደርጋል።
