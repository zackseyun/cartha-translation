base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: am
  text: ጳውሎስ፣ ስልዋኖስና ጢሞቴዎስ፣ በእግዚአብሔር አብና በጌታ ኢየሱስ መሲሕ[a] ውስጥ ላለችው የተሰሎንቄ ሰዎች ማኅበር[b]፦ ጸጋና ሰላም ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός “መሲሕ” ወይም “ቅቡዕ” ማለት ነው፤ “ክርስቶስ” የግሪኩን ቅርጽ የሚጠብቅ የተለመደ አጠቃቀም ነው።
