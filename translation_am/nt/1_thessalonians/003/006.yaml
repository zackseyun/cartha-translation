  alternative: ታማኝነታችሁ
  rationale: አውዱ ተሰሎንቄዎች በእምነት መጽናታቸውን የሚገልጽ ይመስላል፤ የቃሉ የታማኝነት ገጽታ ግን እንዳይጠፋ በግርጌ ማስታወሻ ተጠቅሷል።
