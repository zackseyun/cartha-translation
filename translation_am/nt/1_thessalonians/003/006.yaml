  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: am
  text: አሁን ግን ጢሞቴዎስ ከእናንተ ዘንድ ወደ እኛ መጥቶ፣ ስለ እምነታችሁ[a]ና ስለ ፍቅራችሁ የምሥራች ነግሮናል፤ እንዲሁም ሁልጊዜ ስለ እኛ መልካም ትዝታ እንዳላችሁ፣ እኛ እናንተን ለማየት እንደምንናፍቅ ሁሉ እናንተም እኛን ለማየት እንደምትናፍቁ ነግሮናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝነታችሁ።” የግሪኩ πίστις (ፒስቲስ) የሚለው ቃል እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: አሁን ግን
  rationale: የἄρτιን ወቅታዊ ሽግግርና የδέን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: ጢሞቴዎስ ከእናንተ ዘንድ ወደ እኛ መጥቶ
  rationale: የግሪኩን genitive absolute በአማርኛ ተፈጥሯዊ በሆነ ተያያዥ ሐረግ ያቀርባል።
- source_word: εὐαγγελισαμένου
  choice: የምሥራች ነግሮናል
  rationale: በዚህ አውድ ግሱ የወንጌል ስብከትን ሳይሆን ደስ የሚያሰኝ ዘገባን ያመለክታል፤ ሆኖም ከ‘የምሥራች’ ቋንቋ ጋር ያለውን ቃላዊ ግንኙነት ይጠብቃል።
- source_word: τὴν πίστιν
  choice: እምነታችሁ
  rationale: πίστις በዚህ አውድ በዋነኝነት ቀጣይ እምነታቸውን ያመለክታል፤ ‘ታማኝነት’ የሚለው ሊሆን የሚችል ፍቺ በማስታወሻ ተጠብቋል።
- source_word: τὴν ἀγάπην
  choice: ፍቅራችሁ
  rationale: ἀγάπηን በግልጽና በተለመደ መንገድ ይተረጉማል።
- source_word: μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: ሁልጊዜ በመልካም እንደምታስቡን
  rationale: ቃል በቃል ‘ስለ እኛ መልካም ትዝታ’ ከሚለው ይልቅ የμνείαν ἀγαθήνን ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: እኛን ለማየት እንደምትናፍቁ
  rationale: ἐπιποθέω የሚገልጸውን ጠንካራና ፍቅራዊ ናፍቆት ያሳያል።
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: እኛ እናንተን ለማየት እንደምንናፍቅ ... እናንተም
  rationale: በግሪኩ የተዘለለውን ግስ ለግልጽነት በመድገም የጋራ ናፍቆቱን ንፅፅር ይጠብቃል።
theological_decisions:
- issue: πίστις እንደ ‘እምነት’ ወይም ‘ታማኝነት’ ሊተረጎም መቻሉ
