  source_fidelity: The draft accurately renders σαίνεσθαι as being shaken/unsettled by the afflictions and preserves the emphatic αὐτοὶ and the passive idiom κείμεθα. However, the opening articular infinitive is left with an unanchored «ነው», which is not fully natural as a verse-unit in Amharic. An explicit purpose linker safely reflects its dependence on the preceding verse without adding substantive meaning.
  naturalness: «በእነዚህ መከራዎች ማንም እንዳይናወጥ[a][b] ነው» has awkward word order and an unsupported copula. Placing the afflictions after the subject and using «ዘንድ» produces clear, modern-standard Amharic. The explanatory second sentence reads more naturally when the knowledge clause follows «እናንተ ራሳችሁ».
  terminology: «መከራዎች», «እንዳይናወጥ», and «እንደተመደብን» are suitable, faithful modern terms. The alternatives in the notes appropriately preserve the unusual lexical range of σαίνεσθαι and the idiomatic force of κεῖμαι without imposing a theological system.
