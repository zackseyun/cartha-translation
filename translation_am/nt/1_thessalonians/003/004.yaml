  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: am
  text: እኛ ከእናንተ ጋር በነበርንበት ጊዜ መከራ ሊደርስብን እንደሆነ አስቀድመን ደጋግመን እንነግራችሁ ነበርና፤[a] እንደተናገርነውም ሆነ፤ ይህንም እናንተ ታውቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መከራ ሊደርስብን” የሚለው “ልንሰቃይ እንደሆነ” ወይም “ጭንቀት ሊደርስብን እንደሆነ” ተብሎም ሊተረጎም ይችላል። የግሪክኛው ግስ ጫናን፣ ጭንቀትን ወይም ስደትን መቀበልን ሊያመለክት ይችላል።
