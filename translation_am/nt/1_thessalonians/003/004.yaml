  rationale: የአካላዊ መገኘትንና አብሮነትን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: προελέγομεν
  choice: አስቀድመን ደጋግመን እንነግራችሁ ነበር
  rationale: አስቀድሞ መናገርን እንዲሁም በኢምፐርፌክት ግሱ የሚጠቆመውን ተደጋጋሚ ወይም ቀጣይ ድርጊት ይጠብቃል፤ ‘እናስጠነቅቃችሁ’ የሚለውን ከጽሑፉ በላይ የሆነ ትርጓሜ አያስገባም።
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: መከራ ሊደርስብን እንደሆነ
  rationale: μέλλομεν የሚገልጠውን የሚመጣ ወይም የተጠበቀ ክስተት በ‘ሊ...እንደሆነ’ ያሳያል፤ የተሳቢ ቅርጹም በ‘ሊደርስብን’ ተጠብቋል።
- source_word: θλίβεσθαι
