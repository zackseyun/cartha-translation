  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። “ሆይ” የግሪኩን የጥሪ ቅርጽ በመጽሐፍ ቅዱሳዊ ክብር ይጠብቃል፤ “ሳለን” ደግሞ የመከራው ሐረግ መጽናናቱ የተፈጸመበትን ሁኔታ እንደሚገልጽ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
