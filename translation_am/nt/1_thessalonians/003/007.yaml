  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: am
  text: ስለዚህ፣ ወንድሞች ሆይ[a]፣ በጭንቀታችንና በመከራችን ሁሉ ሳለን፣ ስለ እናንተ በእምነታችሁ[b] ተጽናናን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” ጳውሎስ ጉባኤውን ሲያነጋግር የሚጠቀምበት የተለመደ አጠራር ሲሆን፣ መላውን የአማኞች ማኅበረሰብ ሊያካትት ይችላል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “በታማኝነታችሁ።” የግሪኩ πίστις (ፒስቲስ) የሚለው ቃል እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል፤ እዚህ ላይ የተሰሎንቄ አማኞች በእምነታቸው ጸንተው የመቀጠላቸውን ሐሳብ የሚያካትት ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው የጢሞቴዎስ ዜና ጋር ያለውን የምክንያትና የድምዳሜ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρεκλήθημεν
  choice: ተጽናናን
  rationale: በመከራ ውስጥ ከጢሞቴዎስ ዜና የተገኘውን መጽናናትና የልብ እረፍት የሚገልጽ አግባብ ያለው ተገብሮ አነጋገር ነው።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን የጥሪ ቅርጽ ይጠብቃል፤ በጳውሎስ አጠቃቀም መላውን የአማኞች ማኅበረሰብ ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ἐφ’ ὑμῖν
  choice: ስለ እናንተ
  rationale: መጽናናቱ ከተሰሎንቄ አማኞች ጋር በተያያዘ መሆኑን ያሳያል፤ እነርሱ የመከራው ምክንያት እንደሆኑ አያስመስልም።
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: በጭንቀታችንና በመከራችን ሁሉ ሳለን
  rationale: መጽናናቱ የተፈጸመበትን አስቸጋሪ ሁኔታ ያመለክታል፤ ሁለቱንም የሥቃይ ቃላት ሳያዋሕድ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀνάγκῃ
  choice: ጭንቀት
  rationale: በዚህ አውድ ያለውን ጫና፣ አስጨናቂ ሁኔታና ችግር ይገልጻል፤ ‘አስፈላጊነት’ የሚለውን አሳሳች ቀጥተኛ ፍቺ ያስወግዳል።
- source_word: θλίψει
  choice: መከራ
  rationale: ግፊትን፣ ሥቃይንና መከራን የሚያመለክተውን የቃሉን ክብደት በዘመናዊና የተለመደ አማርኛ ይጠብቃል።
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: በእምነታችሁ
  rationale: διά ከዘር ቅጽ ጋር የመጽናናቱን መንገድ ወይም ምክንያታዊ መሣሪያ ያሳያል፤ አጭሩ የአማርኛ ቅርጽ ሁለቱንም ተዛማጅ ገጽታዎች አያጠብም።
- source_word: πίστεως
  choice: እምነት
  rationale: የπίστιςን መደበኛ ፍቺ ይጠብቃል፤ በዚህ አውድ የጽናት ወይም የታማኝነት ጥላ ሊኖረው ስለሚችል ያ አማራጭ በማስታወሻ ተቀምጧል።
theological_decisions:
- issue: πίστις የሚለው ቃል ቀጣይ ጽናትን ሊያመለክት በሚችልበት አውድ እንዴት እንደሚተረጎም
  choice: እምነት
  alternative: ታማኝነት
  rationale: ዋናው ጽሑፍ የቃሉን መደበኛና ሰፊ ፍቺ ይጠብቃል። የተሰሎንቄ አማኞች በእምነት መቀጠላቸው ጽናትንና ታማኝነትንም ስለሚያካትት፣ ይህ አግባብ ያለው አማራጭ በእግር ማስታወሻ ተጠብቋል።
