  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: am
  text: ጌታም እርስ በርሳችሁና ለሁሉም ባላችሁ ፍቅር እንድትበዙና እንድትትረፈረፉ ያድርጋችሁ፤ እኛም ለእናንተ ባለን ፍቅር እንደምንሆን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በጳውሎሳዊው የምኞትና የጸሎት አውድ የመለኮት/የክርስቶስ ማዕረግን ሳይተረጉም የሚያቆየው የተለመደ አማርኛ ነው።
- source_word: πλεονάσαι
  choice: እንዲያሳድግ
  rationale: የምኞት አገባቡንና ጌታ አድራጊ የሆነበትን አስደራጊ ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περισσεύσαι
  choice: እንዲያትርፍ ያድርጋችሁ
  rationale: ከπλεονάσαι ጋር ያለውን የትርጉም ማጠናከር ይጠብቃል፤ ፍቅሩ ከመጠን በላይ የበዛ እንዲሆን የሚለውን ሐሳብ ያስተላልፋል።
- source_word: τῇ ἀγάπῃ
  choice: ያላችሁን ፍቅር
  rationale: የግሪኩን የዘርፍ/የአንጻር ዳቲቭ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: εἰς ἀλλήλους
  choice: እርስ በርሳችሁ
  rationale: ፍቅሩ የሚያመለክትበትን የጋራ አቅጣጫ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ εἰς πάντας
  choice: ለሁሉም
  rationale: πάνταςን ወደ ‘ሰዎች ሁሉ’ ወይም ‘አማኞች ሁሉ’ ሳያጠብ ሰፊ እንደሆነ ያቆያል።
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: እኛም ለእናንተ እንደምናደርገው
  rationale: በግሪኩ ያልተደገመውን ግስ ከቀደመው ሐረግ በመረዳት ያለ ከመጠን በላይ ማብራሪያ በአማርኛ ያሟላል።
- source_word: δὲ
  choice: -ም
  rationale: ጠንካራ ተቃርኖ ሳይፈጥር ከቀደመው ንግግር ጋር ያለውን ለስላሳ ቅጥያ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የ‘ጌታ’ ተመላካች
  choice: በትርጉሙ ‘ጌታ’ ብቻ ተብሎ ተቀምጧል።
  alternative: በተለይ ክርስቶስን የሚያመለክት ወይም በአጠቃላይ መለኮታዊ ተመላካች መሆኑን መግለጽ።
  rationale: κύριος የሚለውን ማዕረግ ማብራሪያ ሳይጨምር ማቆየት የጥቅሱን ክፍትነት ይጠብቃል።
- issue: የπάντας ወሰን
  choice: ‘ሁሉም’ ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: ‘ሰዎች ሁሉ’ ወይም ‘አማኞች ሁሉ’ ብሎ መወሰን።
  rationale: ግሪኩ ራሱ ቡድኑን አይወስንም፤ ስለዚህ ትርጉሙ ሥነ መለኮታዊ ወሰን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሁለቱ የመጨመር ግሶች ያላቸው የአጽንዖት ልዩነት ተጠብቋል፤ የግሪኩ አጭር የመጨረሻ ሐረግ በአማርኛ እንዲገባ በትንሹ ተሟልቷል።
