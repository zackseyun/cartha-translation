  to: ጌታችን ኢየሱስ ከቅዱሳኑ ሁሉ[a] ጋር በሚመጣበት ጊዜ፣ በአምላካችንና በአባታችን ፊት ልባችሁን በቅድስና ነቀፋ የሌለባቸው አድርጎ ያጸና ዘንድ ነው።
