id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: am
  text: ጌታችን ኢየሱስ ከቅዱሳኑ ሁሉ[a] ጋር በሚመጣበት ጊዜ፣ በአምላካችንና በአባታችን ፊት ልባችሁን በቅድስና ነቀፋ የሌለባቸው አድርጎ ያጸና ዘንድ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከቅዱስ ሕዝቡ ሁሉ ጋር።» የግሪኩ «ቅዱሳን» በዚህ አውድ ቅዱሳን ሰዎችን፣ መላእክትን ወይም ሁለቱንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: ያጸና ዘንድ ነው
  rationale: አንቀጹ ከቀደመው ሐሳብ ጋር ያለውን የዓላማ ወይም የውጤት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: στηρίξαι
  choice: ያጸና
  rationale: ግሱ ማጠንከርንና ጽኑ ማድረግን ያመለክታል፤ «ያጸና» ከ«ልባችሁን» ጋር ተፈጥሯዊ ነው።
- source_word: καρδίας
  choice: ልባችሁን
  rationale: ቃሉ ስሜትን ብቻ ሳይሆን የውስጥ ሰውነትን ያመለክታል፤ «ልብ» ይህን ስፋት ይጠብቃል።
- source_word: ἀμέμπτους
  choice: ነቀፋ የሌለበት
  rationale: በተገቢ ምክንያት ሊወቀስ የማይችል መሆንን በግልጽና ተራ አማርኛ ያሳያል።
- source_word: ἐν ἁγιωσύνῃ
  choice: በቅድስና
  rationale: የቅዱስነትን ሁኔታ ወይም ባሕርይ በቀጥታ ይገልጣል።
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: በአምላካችንና በአባታችን ፊት
  rationale: በእግዚአብሔር እይታና ፊት መቆምን ይገልጣል፤ የግሪኩን «አምላካችንና አባታችን» የተቀናጀ አገላለጽ ይጠብቃል።
- source_word: παρουσίᾳ
  choice: መምጣት
  rationale: በዚህ የፍጻሜ ዘመን አውድ የጌታን ወደፊት መምጣት ወይም መድረስ ያመለክታል።
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: ጌታችን ኢየሱስ
  rationale: κύριος የክርስቶስን ማዕረግ «ጌታ» ብሎ ያቀርባል፤ ስሙም በተለመደው የአማርኛ አጻጻፍ ተጽፏል።
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: ከቅዱሳኑ ሁሉ ጋር
  rationale: «ቅዱሳኑ» የግሪኩን ሰፊ ትርጉም በተቻለ መጠን ጠብቆ፣ ሰዎችን፣ መላእክትን ወይም ሁለቱንም በግድ አይወስንም።
theological_decisions:
- issue: «ቅዱሳኑ ሁሉ» የሚያመለክታቸው
  choice: ቅዱሳኑ ሁሉ
  alternative: ቅዱስ ሕዝቡ ሁሉ / መላእክቱ ሁሉ
  rationale: ἁγίων በዚህ የፍጻሜ ዘመን አውድ ቅዱሳን ሰዎችን፣ መላእክትን ወይም ሁለቱንም ሊያመለክት ይችላል፤ ዋናው ጽሑፍና ማስታወሻው ይህን አሻሚነት ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አወቃቀር ለአማርኛ ፍሰት ተደራጅቷል፤ የ«ቅዱሳኑ» ማንነት ግን አልተወሰነም።
