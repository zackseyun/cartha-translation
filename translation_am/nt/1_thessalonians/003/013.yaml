review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the purpose of establishing the readers’ hearts, holiness before God our Father, and the eschatological setting. However, it redundantly renders παρουσία as both “መምጣት” and “ሲመጣ,” and its singular adjective “የሌለበት” does not agree with plural “ልባችሁን.” The explicit possessive force of αὐτοῦ is also clearer when the holy ones are syntactically tied to Jesus’ coming.
  naturalness: The revised wording uses a natural modern Amharic temporal clause for “at the coming,” avoids the awkward duplicated coming expression, and corrects plural agreement.
  terminology: “ያጸና,” “ልባችሁን,” “በቅድስና,” and “ቅዱሳኑ” are suitable. “ቅዱሳኑ” is retained with an anchored note because the Greek term can include holy people, angels, or both and should not be narrowed in the main text.
  issues:
  - severity: medium
    issue: Redundant rendering of the Lord’s coming
    rationale: “በ...መምጣት” followed by “ሲመጣ” represents the single Greek expression ἐν τῇ παρουσίᾳ twice. A single temporal clause naturally renders παρουσία together with μετὰ πάντων τῶν ἁγίων αὐτοῦ.
  - severity: medium
    issue: Number disagreement in “ነቀፋ የሌለበት”
    rationale: The phrase modifies “ልባችሁን” (your hearts), which is plural. It should read “ነቀፋ የሌለባቸው.”
  - severity: low
    issue: Footnote anchor placement
    rationale: The note concerns “ቅዱሳኑ ሁሉ”; attaching [a] directly to that expression makes its scope clear.
  revised_text: ጌታችን ኢየሱስ ከቅዱሳኑ ሁሉ[a] ጋር በሚመጣበት ጊዜ፣ በአምላካችንና በአባታችን ፊት ልባችሁን በቅድስና ነቀፋ የሌለባቸው አድርጎ ያጸና ዘንድ ነው።
