  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ምን ምስጋና መልሰን ልናቀርብ’ የሚለው አገባብ ከፈሊጣዊው አማራጭ ትንሽ መደበኛ ቢሆንም የግሪኩን ዘይቤና የአጻጻፍ ጫና ይጠብቃል።
