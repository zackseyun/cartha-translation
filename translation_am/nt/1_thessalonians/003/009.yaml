    rationale: ‘ስለምንደሰተው ደስታ’ may be read as ‘the joy that makes us glad.’ The Greek ᾗ χαίρομεν means ‘in/with which we rejoice,’ with deliberate χαρά/χαίρομεν cognate wording. ‘በምንደሰትበት ደስታ’ represents this more faithfully.
