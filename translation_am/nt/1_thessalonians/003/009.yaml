  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: am
  text: ስለ እናንተ፣ በእናንተ ምክንያት በአምላካችን ፊት በምንደሰትበት ደስታ ሁሉ ምክንያት፣ ለእግዚአብሔር ምን ምስጋና መልሰን ልናቀርብ እንችላለን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በተለመደ አነጋገር፣ “ስለ እናንተ እግዚአብሔርን በቂ ማመስገን እንዴት እንችላለን?” የግሪኩ ቃል በቃል አገባብ፣ “ስለ እናንተ ለእግዚአብሔር ምን ምስጋና መልሰን ልናቀርብ እንችላለን?” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: ምን
  rationale: εὐχαριστίανን የሚወስን የጥያቄ ቃል ነው፤ የግሪኩን ‘ምን ምስጋና’ የሚለውን አገባብና የምስጋናቸውን በቂ አለመሆን የሚገልጠውን የአጻጻፍ ኃይል ይጠብቃል።
- source_word: εὐχαριστίαν
  choice: ምስጋና
  rationale: ወደ እግዚአብሔር የሚቀርብን ምስጋናና ውለታ ማወቅ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δυνάμεθα
  choice: ልናቀርብ እንችላለን
  rationale: የመቻልን ትርጉምና የአጻጻፉን የጥያቄ ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἀνταποδοῦναι
  choice: መልሰን ልናቀርብ
  rationale: ግሱ መልሶ የመስጠትን ወይም በምላሹ የማቅረብን ሐሳብ ይዟል። ‘መልሰን ልናቀርብ’ ይህን ዘይቤ ይጠብቃል፣ ነገር ግን እግዚአብሔርን ቃል በቃል ዕዳ እንደሚከፍሉ አያሰማም።
- source_word: περὶ ὑμῶν
  choice: ስለ እናንተ
  rationale: περί ከባለቤት አገባብ ጋር ያለውን የማጣቀሻ ትርጉም በቀጥታ ያስተላልፋል፤ በኋላ ካለው δι’ ὑμᾶς ይለያል።
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: ስለምንደሰተው ደስታ ሁሉ
  rationale: ἐπί እዚህ የምስጋናውን መሠረት ወይም ምክንያት ያመለክታል፤ ‘ሁሉ’ የπάσῃን ሙሉነት ይጠብቃል።
- source_word: ᾗ χαίρομεν
  choice: ስለምንደሰተው ደስታ
  rationale: χαράና χαίρομεν ያላቸውን የቃል ዝምድና ‘ደስታ/እንደሰታለን’ በሚለው ተዛማጅ አገባብ ያንጸባርቃል።
- source_word: δι’ ὑμᾶς
  choice: በእናንተ ምክንያት
  rationale: διά ከተሳቢ አገባብ ጋር እዚህ ምክንያትን ያመለክታል፤ ከπερὶ ὑμῶν ያለውን ልዩነት ግልጽ ያደርጋል።
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: በአምላካችን ፊት
  rationale: በእግዚአብሔር መገኘት ውስጥ የሚለውን ምሳሌያዊ የቦታ አገላለጽ አጭርና ክቡር በሆነ መንገድ ይጠብቃል።
theological_decisions:
- issue: ምስጋናን ለእግዚአብሔር ‘መልሶ ማቅረብ’
  choice: ጳውሎስ ምስጋናን ለእግዚአብሔር መልሶ እንደማቅረብ ይናገራል፤ የጥያቄው አወቃቀር ግን የምስጋናቸውን በቂ አለመሆን ያጎላል።
  alternative: ‘ስለ እናንተ እግዚአብሔርን በቂ ማመስገን እንዴት እንችላለን?’ ብሎ በፈሊጣዊ አማርኛ መተርጎም።
  rationale: ἀνταποδοῦναι በምላሹ መስጠትን በግልጽ ያመለክታል። ዘይቤውን መጠበቅ የምንጩን ሐሳብ ያስቀራል፤ የንግድ ልውውጥ ወይም ዕዳ ክፍያ ትምህርት እንዳይመስል ደግሞ ‘ማቅረብ’ ተመርጧል።
