base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: am
  text: 'ስለዚህ፣ እኔም ከዚህ በላይ መታገሥ ስላልቻልሁ፣ ስለ እምነታችሁ[a] ለማወቅ ላክሁ፤ ፈታኙ ምናልባት ፈትኗችሁ ድካማችንም ከንቱ[b] ሆኖ እንዳይቀር ሰግቼ ነበር።


    [a] ወይም፣ “ታማኝነታችሁ።” የግሪኩ ቃል እንደ ዐውዱ እምነትንና ታማኝነትን ተደራርቦ ሊያመለክት ይችላል።


    [b] ወይም፣ “ያለ ፍሬ ሆኖ” ወይም “በከንቱ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝነታችሁ።” የግሪኩ ቃል እንደ ዐውዱ እምነትንና ታማኝነትን ተደራርቦ ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ያለ ፍሬ ሆኖ” ወይም “በከንቱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ወደ ቀደመው ሐሳብ የሚመለሰውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: በκἀγώ ውስጥ ያለውን καί በ“-ም” በግልጽ ይወክላል።
- source_word: μηκέτι στέγων
  choice: ከእንግዲህ መታገሥ ባልችል ጊዜ
  rationale: ትዕግሥቱ ገደቡ ላይ መድረሱን ተፈጥሯዊና ግልጽ በሆነ አማርኛ ይገልጣል።
- source_word: ἔπεμψα
  choice: ላክሁ
  rationale: በዚህ ቁጥር ተቀባዩ በግልጽ ስላልተጠቀሰ፣ ከቁጥር 2 ጢሞቴዎስን በጽሑፉ ውስጥ ሳይጨምር ግሱን ብቻ ይጠብቃል።
- source_word: εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν
  choice: ስለ እምነታችሁ ለማወቅ
  rationale: የዓላማውን አገላለጽ ይጠብቃል፤ “ስለ” የእምነታቸውን ሁኔታ ለማወቅ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν πίστιν ὑμῶν
  choice: እምነታችሁ
  rationale: በዐውዱ የተሰሎንቄ ሰዎች በወንጌል ያላቸውን ቀጣይ እምነት በቀጥታ ያመለክታል፤ ሌሎች ሊሆኑ የሚችሉ ስሜቶች በማስታወሻ ተጠብቀዋል።
- source_word: μή πως
  choice: ምናልባት … እንዳይቀር ሰግቼ
  rationale: ጳውሎስ የነበረውን ስጋት በአማርኛ ተፈጥሯዊ በሆነ የፍርሃት አረፍተ ነገር ያቀርባል።
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: ፈታኙ ምናልባት ፈትኗችሁ
  rationale: በግሪኩ ያለውን የፈተና ሥርወ ቃል ድግግሞሽ ይጠብቃል፤ “ፈታኙ” ወደ እምነት ክህደት የሚገፋውን ክፉ ሙከራ ያሳያል።
- source_word: εἰς κενὸν γένηται ὁ κόπος ἡμῶν
  choice: ድካማችንም ከንቱ ሆኖ እንዳይቀር
  rationale: κόπος ያለውን ከባድ ጥረት “ድካም” ያሳያል፤ εἰς κενόν ደግሞ ዓላማ ወይም ፍሬ አልባ መሆንን “ከንቱ” በማለት ይገልጣል።
theological_decisions:
- issue: በዚህ የጳውሎስ ዐውድ πίστιςን መተርጎም
  choice: እምነት
  alternative: ታማኝነት፤ መታመን
  rationale: በዐውዱ ዋናው ሐሳብ ተሰሎንቄዎች ለወንጌል የሰጡት አማኝ ምላሽ ቀጥሎ መኖሩ ነው። ሆኖም የግሪኩ ቃል ታማኝነትንና መታመንንም ሊያካትት ስለሚችል አማራጮቹ በማስታወሻ ተጠብቀዋል።
- issue: ὁ πειράζων ማንነት
  choice: ፈታኙ
  alternative: የሚፈትነው፤ ሰይጣን
  rationale: ዐውዱ ሰይጣንን ቢያመለክትም ግሪኩ ትክክለኛ ስሙን ሳይጠቀም ገላጭ ስያሜ ይጠቀማል፤ ትርጉሙም ይህንኑ ይጠብቃል።
- issue: በμή πως ሥር ያለው የፈተናና የድካም ውጤት ግንኙነት
  choice: ምናልባት ፈትኗችሁ … እንዳይቀር ሰግቼ
  alternative: ፈታኙ እንዳይፈትናችሁና ድካማችንም ከንቱ እንዳይሆን
  rationale: የግሪኩ ἐπείρασεν አንድ ጊዜ የተፈጸመ ሊሆን የሚችልን ፈተና ሲያቀርብ፣ γένηται ደግሞ ሊከተል የሚችለውን ውጤት ያሳያል። ትርጉሙ ይህን ጊዜያዊ ልዩነት ሳያጠፋ የጳውሎስን ስጋት ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ድግግሞሽ “ፈታኙ … ፈትኗችሁ” ተጠብቋል። በእንግሊዝኛው የማማከሪያ ጽሑፍ ውስጥ የማስታወሻ ምልክቶቹ ከማስታወሻዎቹ ይዘት ጋር የተለዋወጡ ስለነበሩ፣ [a] ከ“እምነታችሁ” እና [b] ከ“ከንቱ” ጋር በትክክል ተያይዘዋል።
