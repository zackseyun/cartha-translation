  text: ምክንያቱም[a] እናንተ በጌታ ጸንታችሁ ከቆማችሁ፣ እኛ አሁን እንኖራለን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በመጀመሪያ ያለው “ምክንያቱም” በአማርኛ በዐውዱ እንዲገባ ሳይገለጽ ሊቀር ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “እንኖራለን” የሚለው ምናልባት የአካላዊ ሕልውናን ብቻ ሳይሆን፣ የታደሰ ማበረታቻንና ሕያውነትን የሚገልጽ ንግግራዊ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: በአማርኛ በአረፍተ ነገሩ አወቃቀር በቀጥታ አልተገለጸም
  rationale: ὅτι ከቀደመው ሐሳብ ጋር የሚያያዝ ምክንያታዊና ገላጭ ኃይል አለው፤ በአማርኛ ግን ቅድመ አንቀጹን በመጀመሪያ ማቅረብ ይህን ግንኙነት በተፈጥሮ ያስተላልፋል። አማራጩ በማስታወሻ ተጠብቋል።
- source_word: νῦν
  choice: አሁን
  rationale: የጊዜውን አጽንዖት በቀጥታ ያስተላልፋል።
- source_word: ζῶμεν
  choice: በሕይወት እንኖራለን
  rationale: የግሪኩን ቀጥተኛ ምስል ይጠብቃል፤ በዐውዱ ያለውን የታደሰ ብርታትና ማበረታቻ በዋናው ጽሑፍ ውስጥ በትርጓሜ አይወስንም።
- source_word: ἐὰν
  choice: ከ-
  rationale: ከቆማችሁ የሚለው ቅርጽ የግሪኩን ሁኔታዊ ‘if’ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: በግሪኩ ያለውን ግልጽ ተውላጠ ስምና በተሰሎንቄ አማኞች ላይ ያለውን አጽንዖት ይጠብቃል።
- source_word: στήκετε
  choice: ጸንታችሁ ከቆማችሁ
  rationale: στήκω የሚያመለክተውን ጽናትና የማይናወጥ አቋም በተለመደና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን ሰፊ የግንኙነትና የኑሮ ክልል አገላለጽ ሳያጠብ ይጠብቃል።
theological_decisions:
- issue: “አሁን እንኖራለን” የሚለው ኃይል
  choice: ቀጥተኛውን የሕይወት አገላለጽ በዋናው ጽሑፍ ማቆየት
  alternative: “አሁን እንደ አዲስ ታደስን” ወይም “አሁን ብርታት አገኘን”
  rationale: በዐውዱ ይህ የታደሰ ማበረታቻንና ሕያውነትን የሚገልጽ ንግግራዊ አገላለጽ ሊሆን ይችላል፤ ሆኖም ዋናው ጽሑፍ ይህን ትርጓሜ አይጫንም።
- issue: “በጌታ” የሚለው ትርጉም
  choice: ሐረጉን ሰፊ ትርጉሙን እንደጠበቀ ማቅረብ
  alternative: “ከጌታ ጋር ባላችሁ ኅብረት” ወይም “ለጌታ ታማኞች ሆናችሁ”
  rationale: “በጌታ” ጽናትን ከጌታ ጋር ባለ ግንኙነትና በእርሱ ውስጥ ባለ የኑሮ ክልል ያቀርባል፤ አንድን የቡድን ትምህርት አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁኔታዊውን አንቀጽ በመጀመሪያ ማቅረብ ተፈጥሯዊ የአማርኛ ፍሰትን ይሰጣል፤ የዋናው ዓረፍተ ነገር ምስልና ሥነ መለኮታዊ ስፋት ተጠብቋል።
