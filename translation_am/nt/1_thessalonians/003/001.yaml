lexical_decisions:
- source_word: Διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: μηκέτι στέγοντες
  choice: ከዚህ በኋላ መታገሥ ባቃተን ጊዜ
  rationale: μηκέτι የመታገሡን ገደብ ሲያመለክት፣ στέγω በዚህ አውድ በስሜት ጫና ሥር መታገሥን ያመለክታል፤ ይህ አገላለጽ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εὐδοκήσαμεν
  choice: ወሰንን
  rationale: ግሡ በፈቃድ የተደረገን መልካም ውሳኔ ሊያመለክት ይችላል፤ «ወሰንን» በዚህ አውድ ግልጽና ተፈጥሯዊ ሲሆን የቡድኑን ፈቃደኛ ምርጫ ይጠብቃል።
- source_word: καταλειφθῆναι
  choice: ለመቅረት
  rationale: የግሪኩ ቃል ተገብሮአዊ ቅርጽ ቢኖረውም፣ በአማርኛ «ብቻችንን ለመቅረት» የሚለው አገላለጽ ትርጉሙን ያለ አላስፈላጊ አድራጊ በተፈጥሯዊ መንገድ ያስተላልፋል፤ ቀጥተኛው ተገብሮአዊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐν Ἀθήναις
  choice: በአቴና
  rationale: የቦታውን ስምና የመገኛ ትርጉሙን በመደበኛ ዘመናዊ አማርኛ ያቀርባል።
- source_word: μόνοι
  choice: ብቻችንን
  rationale: ተናጋሪዎቹ ያለ ሌሎች አብረዋቸው እንደቀሩ ያሳያል፤ የግሪኩን ብዙ ቁጥር ይጠብቃል።
theological_decisions:
- issue: የአንደኛ መደብ ብዙ ቁጥር ተውላጠ ስም ማንን እንደሚወክል
  choice: «ባቃተን»፣ «ብቻችንን» እና «ወሰንን» በማለት የግሪኩን ብዙ ቁጥር መጠበቅ
  alternative: ቃሉን ጳውሎስን ብቻ እንደሚያመለክት በመተርጎም ወደ ነጠላ ቁጥር መለወጥ
  rationale: εὐδοκήσαμεν እና μόνοι በብዙ ቁጥር ናቸው። ይህ የደብዳቤ ብዙ ቁጥር ይሁን ወይም የሚስዮናውያኑን ቡድን ይወክል የሚለውን ክርክር ትርጉሙ መፍታት የለበትም።
