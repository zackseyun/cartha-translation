  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: am
  text: ወንድሞች ሆይ፣[a] እንዲህ እንድታደርጉ እናሳስባችኋለን፤ ሥርዓት የሌላቸውን[b] ምከሩ፤ ድፍረት ያጡትን[c] አበረታቱ፤ ደካሞችን ደግፉ፤[d] ለሁሉም ታጋሾች ሁኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች ሆይ።” ጳውሎስ እዚህ መላውን ጉባኤ እያነጋገረ ነው።
    reason: alternative_reading
  - marker: b
    text: “ሥርዓት የሌላቸው” የሚለው “ሥራ ፈቶች” ወይም “የማይታዘዙ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ተስፋ የቆረጡትን አጽናኑ።”
    reason: lexical_alternative
  - marker: d
    text: “ደግፉ” የሚለው “አጥብቃችሁ ያዙ” ወይም “እርዷቸው” የሚለውንም ሐሳብ ይይዛል።
    reason: lexical_alternative
