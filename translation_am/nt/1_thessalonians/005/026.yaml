lexical_decisions:
- source_word: ἀσπάσασθε
  choice: ሰላምታ ስጡአቸው
  rationale: የብዙ ሰዎች ቀጥተኛ ትእዛዝ ሲሆን፣ ἀσπάζομαι የሚገልጸውን ማኅበራዊ ሰላምታ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀδελφοὺς
  choice: ወንድሞችን
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ ቃሉ መላውን የአማኞች ማኅበረሰብ ሊያመለክት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: πάντας
  choice: ሁሉ
  rationale: የቡድኑን ሙሉነት በአጭርና ተፈጥሯዊ አማርኛ ያጎላል።
- source_word: ἐν φιλήματι ἁγίῳ
  choice: በተቀደሰ መሳም
  rationale: ἐν እዚህ የአደራረግ መንገድን ያመለክታል፤ φίλημα በግልጽ መሳምን፣ ἁγίῳ ደግሞ በክርስቲያናዊ ኅብረት ውስጥ የተቀደሰና ንጹሕ መሆኑን ይገልጻል።
