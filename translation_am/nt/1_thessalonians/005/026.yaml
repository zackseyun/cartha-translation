    text: “ቅዱስ መሳም” በክርስቲያኖች መካከል ያለውን ኅብረትና ፍቅር የሚገልጽ፣ በዚያን ዘመን የታወቀ ባህላዊ የሰላምታ ምልክት ነበር።
