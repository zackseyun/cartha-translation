  choice: ወንድሞች
  alternative: ወንድሞችና እኅቶች
  rationale: የግሪኩ ቅርጽ ተባዕታይ ብዙ ቁጥር ስለሆነ ዋናው ጽሑፍ ይህን ይጠብቃል። ሆኖም በዚህ አውድ ሴት አማኞችንም ጨምሮ መላውን ጉባኤ ሊያመለክት የሚችለው ትርጉም በማስታወሻ ተቀምጧል።
