  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችንና እኅቶችን ሁሉ።” “ወንድሞች” የሚለው ቃል መላውን የአማኞች ማኅበረሰብ ሊያመለክት ይችላል።
