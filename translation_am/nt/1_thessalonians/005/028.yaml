translation:
  language: am
  text: የጌታችን የኢየሱስ መሲሕ ጸጋ ከእናንተ ጋር ይሁን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ የመዝጊያ ቡራኬዎች ውስጥ χάρις የእግዚአብሔርን ቸርነትና የጸጋ ስጦታ ያመለክታል፤ «ጸጋ» በአማርኛ የተለመደና ትርጉሙን በሚገባ የሚያስተላልፍ ቃል ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος እዚህ ለኢየሱስ የተሰጠ ማዕረግ ስለሆነ፣ ሥነ መለኮታዊ ክብደቱን የሚጠብቀው «ጌታ» ተመርጧል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: የግል ስም ስለሆነ በመደበኛው የአማርኛ አጻጻፍ «ኢየሱስ» ተብሎ ቀርቧል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός በመሠረቱ «የተቀባው» የሚለውን የመሲሕነት ማዕረግ ይገልጣል። በዚህ ሙሉ ማዕረጋዊ ሐረግ ውስጥ «መሲሕ» ያንን ትርጉም በግልጽ ያስተላልፋል።
- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር ይሁን
  rationale: የግሪኩ ሐረግ ቃል በቃል «ከእናንተ ጋር» ማለት ነው። ግስ የሌለውን የቡራኬ አገላለጽ በተፈጥሯዊ አማርኛ ለማቅረብ «ይሁን» ተጨምሯል።
theological_decisions:
- issue: በመዝጊያው ቡራኬ Χριστοῦን እንዴት መተርጎም እንደሚገባ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: እዚህ Χριστός ከ«ኢየሱስ» ጋር ቢገኝም የመሲሕነት ማዕረጉን ሊይዝ ይችላል። «መሲሕ» የቃሉን የዕብራይስጥ መሠረትና ማዕረጋዊ ኃይል ግልጽ ያደርጋል፤ «ክርስቶስ» ግን በአማርኛ ባህላዊና ስም-መሰል አቀራረብ ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ የአማርኛ የቡራኬ አገላለጽን ይጠቀማል። የግሪኩ ግስ-አልባ ሐረግ በአማርኛ «ይሁን» በሚለው ግስ ተሟልቷል።
