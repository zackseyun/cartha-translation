theological_decisions:
- issue: በἀπὸ παντὸς εἴδους πονηροῦ ውስጥ εἴδους የሚለው ቃል ትርጉም
  choice: ከማንኛውም ዓይነት ክፉ ነገር
  alternative: ከማንኛውም የክፋት መልክ፤ በባህላዊ አተረጓጎም፦ ክፉ ከሚመስል ሁሉ
  rationale: በዚህ ዐውድ εἶδος «ዓይነት/ዓይነተ ነገር» የሚለውን ትርጉም ሊይዝ ይችላል። «ክፉ ከሚመስል ሁሉ» የሚለው ባህላዊ አተረጓጎም ነገሩ ክፉ ባይሆንም ክፉ መስሎ ከታየ መራቅ እንዳለበት ሊያስገባ ስለሚችል፣ ዋናው ጽሑፍ «ዓይነት» ይላል፤ እውነተኛው የቃል አማራጭና ባህላዊው ንባብ ግን በማስታወሻ ተጠቅሰዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ራቁ» ቀጥተኛውን የብዙ ቁጥር ትእዛዝ ይጠብቃል፤ «ማንኛውም ዓይነት» ደግሞ የግሪኩን ሁሉን አቀፍነት በተፈጥሯዊ አገላለጽ ያቀርባል።
