lexical_decisions:
- source_word: ἀπέχεσθε
  choice: ራቁ
  rationale: የአሁን ጊዜ ትእዛዝ እና የብዙ ቁጥር አነጋገር ነው፤ ከክፉ ነገር ያለማቋረጥ መራቅን ያዛል። «ራቁ» በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ የትእዛዝ አገላለጽ ነው።
