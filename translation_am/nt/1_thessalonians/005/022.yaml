- source_word: εἴδους
  choice: ዓይነት
  rationale: በዚህ ዐውድ «ዓይነት» ወይም «መልክ» ማለት ይችላል፤ «ዓይነት» የውጫዊ መታየትን ትርጉም ሳያስገባ የክፋትን ልዩ ልዩ ዓይነቶች በግልጽ ያመለክታል።
- source_word: πονηροῦ
  choice: ክፉ ነገር
