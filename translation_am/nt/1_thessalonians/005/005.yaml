  rationale: The revision supplies “ወገን” in the final clause to express the source’s genitives of belonging in idiomatic modern Amharic. It retains the source’s inclusive emphasis, explanatory connection, light/day and night/darkness parallelism, and the shift from “you” to “we.” The revised note accurately identifies the masculine grammatical form without imposing an unnecessarily narrow male-only sense on the idiom.
