review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the inferential force of διὸ, the mutual nature of both imperatives, and the concluding commendation. However, the second imperative is incorrectly inflected as singular (ያንጽ), although οἰκοδομεῖτε is plural. The final clause is more convoluted than necessary and does not naturally reproduce καθώς.
  naturalness: The first reciprocal expression is understandable, but the sequence እያንዳንዳችሁም ሌላውን ያንጽ is grammatically mismatched and less natural than a parallel reciprocal formulation. A concise comparative closing is idiomatic modern standard Amharic.
  terminology: አበረታቱ suitably conveys παρακαλεῖτε in this context, with the lexical alternative retained in the footnote. አንጹ preserves the construction metaphor of οἰκοδομεῖτε and, unlike the draft, correctly addresses the plural audience.
  issues:
  - severity: high
    issue: ያንጽ is singular while the Greek οἰκοδομεῖτε is plural.
    rationale: The translation must retain the plural imperative addressed to the community.
  - severity: medium
    issue: The closing clause, ደግሞም እያደረጋችሁት ያላችሁት ይህንኑ ነው, is unnecessarily circumlocutory and weakens the direct comparative force of καθὼς.
    rationale: እንደምታደርጉትም directly and naturally conveys “just as you also do/are doing.”},{
  revised_text: ስለዚህ፣ እርስ በርሳችሁን አበረታቱ[a]፤ እርስ በርሳችሁንም አንጹ፤ እንደምታደርጉትም።
