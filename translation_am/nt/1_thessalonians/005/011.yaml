  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: am
  text: ስለዚህ፣ እርስ በርሳችሁን አበረታቱ[a]፤ እርስ በርሳችሁንም አንጹ፤ እንደምታደርጉትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርስ በርሳችሁን አሳስቡ።” παρακαλεῖτε በዚህ አውድ ማበረታታትን ወይም አጥብቆ ማሳሰብን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመጣውን ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: παρακαλεῖτε
  choice: አበረታቱ
  rationale: በዚህ የጋራ መጠናከርን በሚመለከት አውድ፣ ማበረታታትንና ማነሳሳትን የሚያካትት ተፈጥሯዊ ምርጫ ነው፤ የማሳሰብ ኃይሉን በግርጌ ማስታወሻ ያስቀምጣል።
- source_word: ἀλλήλους
  choice: እርስ በርሳችሁን
  rationale: የድርጊቱን መ взаимיות በተለመደ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: οἰκοδομεῖτε
  choice: ያንጽ
  rationale: የግንባታውን ዘይቤ በመጠበቅ መንፈሳዊና ማኅበረሰባዊ ማጠናከርን ያመለክታል።
- source_word: εἷς τὸν ἕνα
  choice: እያንዳንዳችሁም ሌላውን
  rationale: የግሪኩን የግለሰብ ለግለሰብ ትኩረትና የ gegenseitigkeit አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καθὼς καὶ ποιεῖτε
  choice: ደግሞም እያደረጋችሁት ያላችሁት ይህንኑ ነው
  rationale: ንጽጽሩን፣ የκαίን ተጨማሪ አጽንዖት፣ እንዲሁም ተግባሩ አሁንም እየቀጠለ መሆኑን ይጠብቃል።
