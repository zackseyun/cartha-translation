  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: am
  text: እኛ ግን ከቀን ወገን ስለሆንን፣ ሰከን ብለን እንሁን፤ የእምነትና የፍቅርን[a] የደረት ጥሩር ለብሰን፣ የመዳን ተስፋንም ራስ ቁር አድርገን[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝነት”። የግሪኩ πίστις (ፒስቲስ) ቃል “እምነት” ወይም “ታማኝነት” ማለት ሊሆን ይችላል፤ በዋናው ጽሑፍ “እምነት” የሚለው ትርጉም ተይዟል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የመዳን ተስፋንም እንደ ራስ ቁር አድርገን።”
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: እኛ ግን
  rationale: δέ ከቀደመው ስለ “እነርሱ” ከተነገረው ጋር ንጽጽርን ያሳያል፤ “እኛ ግን” ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡμέρας ὄντες
  choice: ከቀን ወገን ስለሆንን
  rationale: ሐረጉ የቀኑ ዘመን ላይ መኖርን ብቻ ሳይሆን የቀን ወገን መሆንን ወይም ከቀን ጋር መያያዝን ያመለክታል፤ ትርጉሙ የቀንና የሌሊትን ዘይቤ ጠብቋል።
- source_word: νήφωμεν
  choice: እንጠንቀቅ
  rationale: νήφω በቀጥታ ከስካር ነጻ መሆንን፣ በዘይቤም ንቁና ራስን የሚገዛ መሆንን ሊገልጥ ይችላል። “እንጠንቀቅ” በዐውደ ንባቡ ውስጥ ያለውን ንቃትና ራስን መግዛት በአጭር ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐνδυσάμενοι
  choice: ለብሰን … አድርገን
  rationale: የግሪኩ አንቀጽ ዋናውን ማሳሰቢያ የሚያጅብ የጦር ዕቃ መልበስን ያሳያል፤ የአማርኛው ግስ ቅርጽ ይህን አጃቢ ግንኙነት በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: θώρακα
  choice: የደረት ጥሩር
  rationale: ግልጽ የጦር ዕቃ ዘይቤ ስለሆነ፣ “የደረት ጥሩር” የሰውነትን የፊት ክፍል የሚከላከለውን ዕቃ በትክክል ይጠራል።
- source_word: πίστεως
  choice: እምነት
  rationale: πίστις “እምነት፣” “መታመን” ወይም “ታማኝነት” ሊሆን ይችላል። ከፍቅርና ከተስፋ ጋር በተደረደረበት በዚህ ስፍራ “እምነት” ተፈጥሯዊ ዋና ትርጉም ነው፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ἀγάπης
  choice: ፍቅር
  rationale: በጳውሎስ የበጎ ምግባር ሦስትዮሽ ውስጥ ἀγάπη በቀጥታና በተፈጥሯዊ ሁኔታ “ፍቅር” ነው።
- source_word: περικεφαλαίαν
  choice: ራስ ቁር
  rationale: መደበኛውን የጦር ዕቃ በግልጽና በተለመደ አማርኛ ይጠቅሳል።
- source_word: ἐλπίδα σωτηρίας
  choice: የመዳንን ተስፋ
  rationale: የግሪኩን የባለቤት አገባብ ጠብቆ፣ ተስፋው ወደ መዳን ያነጣጠረ ወይም በመዳን የተገለጸ መሆኑን ሳይገድብ ያስተላልፋል።
theological_decisions:
- issue: በጦር ዕቃው ዘይቤ ውስጥ የπίστις ትርጉም
  choice: እምነት
  alternative: ታማኝነት፤ መታመን
  rationale: ከፍቅርና ከመዳን ተስፋ ጋር መጣመሩ “እምነት”ን እንደ ዋና ንባብ ይደግፋል፤ የቃሉ እውነተኛ የትርጉም ስፋት ግን በማስታወሻ ተጠብቋል።
- issue: የἡμέρας ὄντες ኃይል
  choice: ከቀን ወገን ስለሆንን
  alternative: የቀን ስለሆንን፤ የቀን ወገኖች ስለሆንን
  rationale: ንባቡ በሰዓት ከቀን ላይ መሆንን ብቻ ሳይሆን ከቀን ጋር ያለንን ባለወገንነት ይገልጣል። ይህ ምርጫ ዘይቤውን ይጠብቃል እንጂ ተጨማሪ የእምነት ሥርዓት ሐሳብ አያስገባም።
- issue: የἐνδυσάμενοι ከዋናው ማሳሰቢያ ጋር ያለው ግንኙነት
  choice: ጥሩሩን ለብሰንና ተስፋውን ራስ ቁር አድርገን እንጠንቀቅ
  alternative: ከለበስን በኋላ እንጠንቀቅ
  rationale: የግሪኩ ተውሳከ ግስ የጦር ዕቃውን መልበስ እንደ ቀድሞ የተጠናቀቀ ተግባር ብቻ ከመግለጽ ይልቅ፣ ከመጠንቀቅ ጋር አብሮ የሚሄድ አኳኋን ወይም መንገድ ሊያሳይ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። “የደረት ጥሩር” እና “ራስ ቁር” የጦር ዕቃውን ዘይቤ ግልጽ ያደርጋሉ፤ “ከቀን ወገን” የቀንና የሌሊትን ንጽጽር ሳያጠፋ ተፈጥሯዊ ነው።
