review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the contrast, vocative address, darkness image, and thief simile. However, “ስለዚህ ... አይደርስባችሁም” turns the ἵνα + subjunctive construction into an independent, categorical future assertion and weakens καταλάβῃ (“catch/overtake”). “ያ ቀን” also adds a demonstrative nuance not expressed by the Greek article.
  naturalness: The revised wording is idiomatic modern standard Amharic while more closely reflecting the Greek clause relationship. “እንዲያገኛችሁ” naturally conveys the day’s catching or overtaking them; the thief comparison remains intact.
  terminology: “ወንድሞች ሆይ” appropriately retains the masculine vocative, with an inclusive-sense footnote. “በጨለማ ውስጥ” preserves the biblical metaphor. “ቀኑ” represents the definite “the day” without introducing the fuller contextual designation into the main text.
  issues:
  - severity: medium
    issue: The ἵνα clause is rendered as an independent consequence (“ስለዚህ ... አይደርስባችሁም”).
    rationale: This obscures the Greek subordinate construction and changes its nuanced purpose/result framing into an unqualified prediction. Recasting the sentence so that “ቀኑ ... እንዲያገኛችሁ” depends on “በጨለማ ውስጥ አይደላችሁም” preserves the ambiguity.
  - severity: medium
    issue: “አይደርስባችሁም” underrepresents καταλάβῃ.
    rationale: καταλάβῃ here denotes catching, overtaking, or coming upon, not merely arriving. “እንዲያገኛችሁ” better retains this sense without supplying the interpretive phrase “to surprise you.”
  - severity: low
    issue: “ያ ቀን” is more demonstrative than ἡ ἡμέρα.
    rationale: The Greek has a definite article, not a demonstrative. “ቀኑ” naturally conveys the contextually identifiable day in Amharic.
