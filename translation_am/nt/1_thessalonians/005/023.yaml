base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: am
  text: የሰላም አምላክ ራሱ ሙሉ በሙሉ ይቀድሳችሁ፤ መንፈሳችሁም፣ ነፍሳችሁም፣ አካላችሁም[b] ሙሉ በሙሉ ያለ ነቀፋ በጌታችን ኢየሱስ መሲሕ[a] መምጣት ጊዜ ይጠበቅ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደው አጠራር፣ “በጌታችን ኢየሱስ ክርስቶስ መምጣት ጊዜ።”
    reason: alternative_reading
  - marker: b
    text: ጳውሎስ “መንፈስ፣ ነፍስና አካል” ብሎ ይጠቅሳል። ተርጓሚዎች ይህ ሰው ሦስት ክፍሎች እንዳሉት ያስተምራል ወይስ የሰውን ሙሉ ማንነት አጽንዖት ሰጥቶ ይገልጻል በሚለው ላይ ይለያያሉ።
    reason: lexical_alternative
