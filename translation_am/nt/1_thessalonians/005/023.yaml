  choice: ሦስቱም ቃላት በግልጽ ተጠብቀው፣ ‘መላ ማንነታችሁ’ የሚለው የሙሉነት ሐሳብ ተጨምሯል።
  alternative: ጥቅሱን የሰው ተፈጥሮ በሦስት የተከፈለ መሆኑን የሚያስተምር ቴክኒካዊ መግለጫ አድርጎ መተርጎም፣ ወይም ሦስቱን ቃላት አጥፍቶ ‘መላ ሰውነታችሁ’ ብቻ ማለት።
  rationale: ግሪኩ ሦስቱንም በስም ይጠቅሳል፣ ነገር ግን ይህ በራሱ የሰው ተፈጥሮ በሦስት የተከፈለ ነው የሚል ሥርዓት እንዲወሰን አያስገድድም። ትርጉሙ ቃላቱንና የሙሉነት አጽንዖቱን ሁለቱንም ይጠብቃል።
- issue: Χριστοῦ እንደ ማዕረግ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ስለሆነ ‘መሲሕ’ ትርጉሙን ይገልጣል፤ ለተለመደው ቅርጽ የሚፈልጉ አንባቢዎች ‘ክርስቶስ’ን በማስታወሻ ያገኛሉ።
