  rationale: ድርጊቱን የሚፈጽመው አምላክ ራሱ መሆኑን የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያስጠብቃል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ያለው የንግግር ሽግግር በአማርኛው የጸሎት ምኞት አወቃቀር በቂ ስለሚገለጥ፣ ‘አሁን’ የሚል ጊዜያዊ ትርጉም አልተጨመረም።
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: የሰላም አምላክ
  rationale: የተለመደውን የጳውሎስ መጠሪያ በግልጽና ቀጥተኛ መንገድ ይጠብቃል።
- source_word: ἁγιάσαι
  choice: ይቀድሳችሁ
  rationale: የምኞት/የጸሎት ኃይል በአማርኛ ይሁንታ ቅርጽ ተገልጧል፤ ከቅድስና ጋር ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: ὑμᾶς
  choice: -አችሁ
  rationale: ለተሰሎንቄ አማኞች በብዙ ቁጥር የቀረበውን ቀጥተኛ ተሳቢ ይገልጣል።
- source_word: ὁλοτελεῖς
  choice: ፈጽሞ
  rationale: ቅድስናው ሙሉና የማይጎድል እንዲሆን የሚገልጠውን አጽንዖት በተፈጥሯዊ ተውሳከ ግስ ያቀርባል።
- source_word: ὁλόκληρον
  choice: መላ ማንነታችሁ
  rationale: የሙሉነትና ያለመጉደል ሐሳብን ያብራራል፤ ተከትለው የተዘረዘሩትን መንፈስ፣ ነፍስና ሥጋ አይሰርዝም።
- source_word: τὸ πνεῦμα
