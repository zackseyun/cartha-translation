- source_word: ἡ ψυχὴ
  choice: ነፍሳችሁ
  rationale: ከመንፈስና ከሥጋ የሚለየውን የግሪኩን ቃል ያስጠብቃል።
- source_word: τὸ σῶμα
  choice: ሥጋችሁ
  rationale: σῶμα በዚህ የሰው ማንነት ዝርዝር ውስጥ የሚያመለክተውን አካላዊ ሰውነት በተለመደው መጽሐፍ ቅዱሳዊ ቃል ይገልጣል።
- source_word: ἀμέμπτως
  choice: ያለ ነቀፋ
  rationale: የሚጠበቁበትን ነቀፋ የሌለበት ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῇ παρουσίᾳ
  choice: በ…መምጣት ጊዜ
  rationale: በጳውሎሳዊው የመጨረሻ ዘመን አውድ παρουσία የጌታን መምጣት/መገኘት ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ ባህላዊው ‘ክርስቶስ’ በማስታወሻ ቀርቧል።
theological_decisions:
