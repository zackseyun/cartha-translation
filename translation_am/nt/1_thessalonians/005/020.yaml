  rationale: ግሪኩ በጉባኤ ውስጥ የሚነገርን ትንቢታዊ ንግግር ሊያመለክት ቢችልም፣ አንድን የኋለኛ ዘመን የእምነት አቋም አይወስንም። ቀጥተኛውን ቃል ማቆየት የሥነ መለኮት ውጥረቱንና የጽሑፉን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የሁለተኛ መደብ ብዙ ቁጥር ትእዛዝ ‘አትናቁ’ የግሪኩን የጉባኤ አድራሻ ይጠብቃል።
