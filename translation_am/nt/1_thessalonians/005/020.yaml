  rationale: የግሪኩ ቃል የድርጊት ተቀባይ የሆነ ብዙ ቁጥር ነው፤ ከትንቢት አገልግሎት ወይም ከረቂቅ ጽንሰ ሐሳብ ይልቅ የተነገሩ ትንቢቶችን ያመለክታል። ‘ትንቢቶችን’ ብዙ ቁጥሩን በቀጥታ ይጠብቃል።
- source_word: μὴ
  choice: አት-
  rationale: ከትእዛዛዊ ግስ ጋር የመጣውን መከልከያ በተፈጥሯዊ የአማርኛ አሉታዊ ትእዛዝ ያቀርባል፤ ‘ፈጽሞ’ የሚል ተጨማሪ አጽንዖት አልገባም።
- source_word: ἐξουθενεῖτε
  choice: አትናቁ
  rationale: ግሱ እንደ ምንም መቁጠርን፣ መናቅንና በንቀት መመልከትን ያመለክታል። ‘አትናቁ’ ይህን ጠንካራ ስሜት በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘አትቃወሙ’ ወይም ‘አትቀበሉ’ ማለት ግን ትርጉሙን ወደ እምቢታ ብቻ ያጠባል።
theological_decisions:
- issue: በቀደመው የክርስቲያን ጉባኤ አውድ ‘ትንቢቶች’ የሚለው ትርጉም
  choice: ‘ትንቢቶች’ የሚለውን ሰፊ ቃል ሳይጠብ ማቆየት
