id: 1TH.5.10
reference: 1 Thessalonians 5:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: am
  text: እርሱ ስለ እኛ የሞተው፣ ነቅተንም ሆነ ተኝተን[a] ከእርሱ ጋር አብረን እንድንኖር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ነቅተንም ሆነ ተኝተን” የሚለው አገላለጽ በአካባቢው ያለውን ንቁ ሆኖ የመጠበቅ ምክር ሊያስተጋባ ይችላል፤ እዚህ ግን በዋናነት አማኞች በሕይወት ቢኖሩም ወይም ቢሞቱም የሚለውን ያመለክታል ተብሎ ይታሰባል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: ሞተ
  rationale: የግሪኩ ያለፈ ጊዜ አሳታፊ ከቀደመው ጥቅስ ጌታ ኢየሱስን ይጠቅሳል፤ በተፈጥሯዊ አማርኛ እንደ ዋና ግስ ተተርጉሟል።
- source_word: περὶ ἡμῶν
  choice: ስለ እኛ
  rationale: περί ከባለቤት አገባብ ጋር በዚህ የድነት አውድ ‘ለእኛ/ስለ እኛ’ የሚል የውክልና ትርጉም አለው፤ ‘ስለ እኛ’ የምንጩን ስፋት ያቆያል።
- source_word: ἵνα
  choice: እንድንኖር
  rationale: የዓላማን ወይም የታሰበ ውጤትን ኃይል በአማርኛው ‘እንድን-’ አወቃቀር ያሳያል።
- source_word: γρηγορῶμεν
  choice: ነቅተን ብንኖርም
  rationale: γρηγορέω ነቅቶ መኖርንም ንቁ መሆንንም ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ከሕይወት ጋር ያለውን ዋና ፍንጭ ሳይደብቅ የንቃትን ጥላ ይጠብቃል።
- source_word: καθεύδωμεν
  choice: ተኝተን ብንሆን
  rationale: ‘መተኛት’ ቀጥተኛውን ዘይቤ ይጠብቃል፤ በአውዱ የሞቱ አማኞችን ሊያመለክት ቢችልም ዋናው ጽሑፍ ይህን በግልጽ ‘ሞተን’ ብሎ አይፈታውም።
- source_word: ἅμα σὺν αὐτῷ
  choice: ከእርሱ ጋር አብረን
  rationale: ἅμα እና σύν የጋራ ሕይወትንና ከክርስቶስ ጋር መሆንን ያሳያሉ፤ የአማርኛው ጥምር አገላለጽ ይህን በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ζήσωμεν
  choice: እንድንኖር
  rationale: በἵνα ሥር ያለውን የዓላማ ንዑስ አገባብ በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል።
theological_decisions:
- issue: ‘ነቅተን ... ተኝተን’ የሚለው ትርጉም
  choice: በዋናነት በሕይወት መኖርን ወይም መሞትን ያመለክታል፤ ዘይቤው ግን በዋናው ጽሑፍ ተጠብቋል።
  alternative: በመንፈሳዊ ንቃት መኖርን ወይም ግድየለሽ መሆንን ያመለክታል።
  rationale: በቅርብ አውድ የሥነ ምግባር ንቃት ቃላት ቢኖሩም፣ ከ1 ተሰሎንቄ 4፥13-15 የሞቱ አማኞች ‘ተኝተዋል’ ከሚለው አጠቃቀም ጋር ያለው ግንኙነትና ሁለቱም ከእርሱ ጋር እንደሚኖሩ የሚገልጠው ዓላማ የሕያዋን/የሞቱን ንባብ ይደግፋል። ቢሆንም ጽሑፉ የንቃትን የቅርብ አውድ ሊያስተጋባ ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ዘይቤና የትርጉም አሻሚነት ተጠብቀዋል፤ የሐረጉ አወቃቀር ግን ለአማርኛ ተፈጥሯዊነት ተደራጅቷል።
