  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: am
  text: እናንተ ራሳችሁ የጌታ ቀን ሌባ በሌሊት እንደሚመጣ ሁሉ እንደሚመጣ በትክክል ታውቃላችሁና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: እናንተ ራሳችሁ
  rationale: በግሱ ውስጥ ያለውን የሁለተኛ መደብ ባለቤት አጉልቶ ያሳያል፤ ይህ አጽንዖት በአማርኛ «እናንተ ራሳችሁ» በተፈጥሮ ይገለጣል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በአማርኛ ከግሱ ጋር የተያያዘው «-ና» በተፈጥሮ ያስተላልፋል።
- source_word: ἀκριβῶς
  choice: በትክክል
  rationale: የእውቀቱን ትክክለኛነትና ጥንቃቄ በቀጥታ ይገልጣል፤ «እጅግ በደንብ» የሚለውም ይቻላል፣ ነገር ግን «በትክክል» የግሪኩን አጽንዖት ይበልጥ ይጠብቃል።
- source_word: οἴδατε
  choice: ታውቃላችሁ
  rationale: ቀጥተኛና ተፈጥሯዊ የአማርኛ አቻ ሲሆን ያለውን የተረጋገጠ እውቀት ያሳያል።
- source_word: ὅτι
  choice: እንደሚመጣ
  rationale: የሚታወቀውን ይዘት በአማርኛ ጥገኛ ሐረግ ያስገባል፤ የተለየ «እንደ» ቃል ከግሱ ጋር በመዋሐድ ይገለጣል።
- source_word: ἡμέρα κυρίου
  choice: የጌታ ቀን
  rationale: የሳምንቱን የአምልኮ ቀን ሳይሆን የመለኮታዊ ጣልቃ ገብነትና ፍርድ የፍጻሜ ዘመን ቀን የሚያመለክተውን የመጽሐፍ ቅዱስ ሐረግ ይጠብቃል።
- source_word: κυρίου
  choice: ጌታ
  rationale: በዚህ የተመሠረተ መጽሐፍ ቅዱሳዊ ሐረግ ውስጥ κύριος የሚለውን በተፈጥሮና በክብር ይተረጉማል።
- source_word: ὡς κλέπτης ἐν νυκτί
  choice: በሌሊት እንደሚመጣ ሌባ
  rationale: የሌባው መምጣት ያልተጠበቀ መሆኑን የሚያሳየውን ምሳሌ ይጠብቃል፤ በአማርኛ «በሌሊት እንደ ሌባ» የሚለው ቃል በቃል ቅርጽ ሌባው በሌሊት መሆኑን እንዳያሻማ ግሱን በግልጽ አክሏል።
- source_word: οὕτως
  choice: እንዲሁ
  rationale: ቀኑ ከሌባው መምጣት ጋር በምን መንገድ እንደሚመሳሰል በግልጽ ያገናኛል።
- source_word: ἔρχεται
  choice: ይመጣል / እንደሚመጣ
  rationale: የግሪኩን የአሁን ጊዜ ቅርጽና የወደፊት ፍጻሜ ማመልከቻ በአማርኛ ተፈጥሯዊ የወደፊት አነጋገር ያስተላልፋል።
theological_decisions:
- issue: ἡμέρα κυρίου የሚለው የፍጻሜ ዘመን ሐረግ
  choice: የጌታ ቀን
  alternative: የእሑድ ወይም የሳምንታዊ አምልኮ ቀን
  rationale: ዐውደ ንባቡ ስለ መለኮታዊ ጣልቃ ገብነትና ፍርድ ቀን መምጣት እንጂ ስለ ሳምንታዊ የአምልኮ ቀን አይናገርም።
- issue: «በሌሊት እንደሚመጣ ሌባ» የሚለው ምሳሌ
  choice: ያልተጠበቀውን መምጣት የሚገልጽ ምሳሌ ሆኖ እንዲቆይ
  alternative: ምስጢራዊ መምጣትን ወይም የተወሰነ የፍጻሜ ዘመን ሥርዓትን በትርጉሙ መጨመር
  rationale: ጥቅሱ የሚገልጸው የመምጣቱን ያልተጠበቀ ባሕርይ ነው፤ ጽሑፉ ያልገለጸውን የዶክትሪን ዝርዝር መጨመር አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በሌሊት እንደሚመጣ ሌባ» የሚለው አቀራረብ የሌሊት ሐረጉ ከሌባው መምጣት ጋር በግልጽ እንዲያያዝና ዋናው ምሳሌ እንዲጠበቅ ተመርጧል።
