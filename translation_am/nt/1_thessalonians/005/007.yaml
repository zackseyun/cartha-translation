  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: am
  text: የሚተኙ በሌሊት ይተኛሉና፤ የሚሰክሩም በሌሊት ይሰክራሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: -ና
  rationale: ቀዳሚውን ማሳሰቢያ የሚያብራራውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: የሚተኙ ... ይተኛሉ
  rationale: አጠቃላይ ቡድንን የሚያመለክተውን አንቀጽ ያለው ተሳቢ በተፈጥሯዊ መንገድ ይተረጉማል፤ የግሡን ድግግሞሽም በመጠበቅ የሐረጉን አጻጻፍ ያስቀራል።
- source_word: νυκτός
  choice: በሌሊት
  rationale: ጊዜን የሚገልጸውን የግሪክ የባለቤትነት ቅርጽ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: የሚሰክሩ ... ይሰክራሉ
  rationale: መስከርን እንደ ልማዳዊ ድርጊት ይገልጻል፤ የግሪኩን የተሳቢና የዋና ግስ ትይዩነትም ይጠብቃል።
- source_word: καί
  choice: -ም
  rationale: ሁለተኛውን ትይዩ ሐረግ ከመጀመሪያው ጋር በተፈጥሯዊ የአማርኛ አያያዝ ያገናኛል።
theological_decisions:
- issue: እንቅልፍንና ስካርን ቃል በቃል ወይስ በምሳሌያዊ ፍቺ መተርጎም
  choice: በዋናው ጽሑፍ እንቅልፍና ስካር የሚሉትን ቀጥተኛ ምስሎች ማቆየት
  alternative: መንፈሳዊ ንቃት ማጣትና ሥነ ምግባራዊ ልቅነት ብሎ በትርጓሜ መግለጽ
  rationale: በአቅራቢያው ዐውድ ጳውሎስ መንፈሳዊ ንቃትን ለማስረዳት የተለመደውን የሌሊት ባሕርይ እንደ ንጽጽር ይጠቀማል። ቀጥተኛውን ቃል ማቆየት ምሳሌውን ይጠብቃል፤ ትርጓሜንም ወደ ትርጉሙ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ትይዩ አወቃቀሩና የግሶቹ ድግግሞሽ ተጠብቀዋል።
