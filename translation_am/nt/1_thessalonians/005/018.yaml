  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: am
  text: በሁሉም ነገር[a] አመስግኑ፤ ምክንያቱም ይህ በመሲሑ ኢየሱስ[b] ለእናንተ ያለው የእግዚአብሔር ፈቃድ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በማንኛውም ሁኔታ።” የግሪኩ ቃል “በሁሉም ነገር” ይላል፤ ይህም አማኞች ባሉበት ሁኔታ ሁሉ እንዲያመሰግኑ ያመለክታል እንጂ ስለ ክፉ ነገር ራሱ እንዲያመሰግኑ የግድ አያመለክትም።
    reason: lexical_alternative
  - marker: b
    text: ባህላዊ አተረጓጎም፦ “በክርስቶስ ኢየሱስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: በሁሉም ነገር
  rationale: ἐν ከመስጫ ቅጽ ጋር የምስጋናውን ሁኔታ ወይም ክልል ያመለክታል። ይህ አተረጓጎም ‘ስለ ሁሉም ነገር’ ከማለት ይልቅ በማንኛውም ሁኔታ ምስጋና መስጠትን ያሳያል።
- source_word: εὐχαριστεῖτε
  choice: አመስግኑ
  rationale: የአሁን ጊዜ ንቁ ትእዛዝ፣ ሁለተኛ መደብ ብዙ ቁጥር ነው። ቀጣይ ልማድን ሊያመለክት ቢችልም ‘ሁልጊዜ’ የሚል ቃል ሳይጨመር ቀጥተኛው ትእዛዝ ተጠብቋል።
- source_word: τοῦτο
  choice: ይህ
  rationale: አመልካቹ በቅርብ ያለውን የማመስገን ትእዛዝ ወደኋላ ያመለክታል፤ የግሪኩን አጭርነት ይጠብቃል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ትእዛዙ የተሰጠበትን ምክንያት ያስገባል።
- source_word: θέλημα θεοῦ
  choice: የእግዚአብሔር ፈቃድ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: ἐν ሳይብራራ ተጠብቆ ጳውሎሳዊውን ከመሲሑ ጋር ያለ ግንኙነት ክፍት ያደርጋል። Χριστός እዚህ እንደ ማዕረግ በመሲሕ ተተርጉሟል።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ ያለው
  rationale: εἰς ከሰዎች ጋር ያለውን አቅጣጫ ወይም ማጣቀሻ ያመለክታል፤ ይህ ፈቃድ አማኞቹን እንደሚመለከት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: Χριστῷ እንደ ማዕረግ ወይም በባህላዊ ትርጉም መቅረቡ
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ሐረግ ውስጥ የቅቡዕነት ማዕረጉን ትርጉም ይዞ ስለሚታይ ‘መሲሑ’ ተመርጧል፤ በአማርኛ የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ይጠቀማል። የግሪኩ አጭር የትእዛዝና የምክንያት አወቃቀር ተጠብቋል፤ የግርጌ ማስታወሻ ምልክቶቹም ከሚመለከቷቸው ሐረጎች ቀጥለው ተቀምጠዋል።
