  source_fidelity: The draft accurately conveys the solemn force of ἐνορκίζω, the passive sense of ἀναγνωσθῆναι, and the scope of πᾶσιν τοῖς ἀδελφοῖς. However, «በጌታ ፊት» adds a spatial/witness nuance ('before the Lord') where the Greek construction more directly invokes the Lord as the authority by whom the recipients are bound. «በጌታ» is both closer and idiomatic in this oath formula.
