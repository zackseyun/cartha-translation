- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: ለወንድሞች ሁሉ
  rationale: ἀδελφοῖς በሰዋስው ወንድ ብዙ ቁጥር ነው፤ በጳውሎስ ደብዳቤዎች ግን ሴቶችንም ጨምሮ መላውን ጉባኤ ብዙ ጊዜ ያመለክታል። ዋናው ጽሑፍ የቃሉን መልክ ሲጠብቅ ይህ ስፋት በማስታወሻ ተገልጧል።
