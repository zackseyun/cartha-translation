  terminology: «ጌታ», «ደብዳቤ», and «ወንድሞች» are appropriate. The note on «ወንድሞች» correctly identifies the grammatical masculine plural and cautiously explains its likely congregational reference. The wording should avoid the awkward double-negative construction «ሳይሆን አይቀርም».
