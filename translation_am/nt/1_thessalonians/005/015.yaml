reference: 1 Thessalonians 5:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: am
  text: ማንም ለማንም ክፉን በክፉ እንዳይመልስ ተጠንቀቁ፤[a] ነገር ግን እርስ በርሳችሁም ሆነ ለሁሉም ሰው[b] ሁልጊዜ መልካሙን ተከታተሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ማንም ለማንም ክፉን በክፉ እንዳይመልስ ጥንቃቄ አድርጉ።”
    reason: lexical_alternative
  - marker: b
    text: “እርስ በርሳችሁ … ለሁሉም ሰው” የሚለው ሐረግ ከእምነት ማኅበሩ አባላት ወደ ሁሉም ሰዎች የሚሰፋ ይመስላል።
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε μή τις
  choice: ማንም … እንዳይመልስ ተጠንቀቁ
  rationale: ὁρᾶτε እዚህ በቃል ትርጉሙ ‘እዩ’ ሳይሆን ማኅበሩ ይህ እንዳይፈጸም ነቅቶ እንዲጠብቅ የሚያሳስብ ብዙ ቁጥር ትእዛዝ ነው።
- source_word: κακὸν ἀντὶ κακοῦ
  choice: ክፉን በክፉ
  rationale: የበቀልን ምላሽ የሚገልጸውን የምንጩን ድግግሞሽና ሰፊ ሥነ ምግባራዊ ትርጉም ይጠብቃል።
- source_word: τινι
  choice: ለማንም
  rationale: ድርጊቱ የሚደርስበትን ሰው ያመለክታል፤ አጠቃላይ ክልከላውንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀποδῷ
  choice: እንዳይመልስ
  rationale: ቀድሞ ለተፈጸመ ክፉ በክፉ መልሶ መክፈልን ያመለክታል።
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: የጊዜውን ቀጣይና ሁሉን አቀፍ ስፋት በተለመደ አማርኛ ይገልጻል።
- source_word: τὸ ἀγαθὸν
  choice: መልካሙን
  rationale: በአርቲክል የተሰየመውን ቅጽል፣ ማለትም ‘መልካም የሆነውን’፣ በአጭርና ተፈጥሯዊ አማርኛ ይወክላል።
- source_word: διώκετε
  choice: ተከታተሉ
  rationale: በትጋት መፈለግንና ከአንድ ዓላማ በኋላ በጽናት መሄድን የሚያሳየውን የትእዛዙን ኃይል ይጠብቃል።
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: እርስ በርሳችሁም ሆነ ለሁሉም ሰው
  rationale: የመልካም ድርጊቱን አቅጣጫ ይገልጻል፤ ከእርስ በርስ ግንኙነት ወደ ሰፊው የሰዎች ክበብ የሚደረገውን እንቅስቃሴም ይጠብቃል።
theological_decisions:
- issue: የሥነ ምግባራዊ ግዴታው ወሰን
  choice: ‘እርስ በርሳችሁ’ የማኅበሩን ውስጣዊ ግንኙነት፣ ‘ለሁሉም ሰው’ ደግሞ ሰፋ ያለውን ክበብ እንዲያመለክት ተተርጉሟል።
  alternative: ‘ሁሉም’ የሚለው የሚያመለክተው አማኞችን ብቻ ነው።
  rationale: εἰς ἀλλήλους καὶ εἰς πάντας የሚለው ጥምረት በተፈጥሮው ከውስጣዊው ክበብ ወደ ሰፊው ይሸጋገራል፤ ትርጉሙ ይህን አቅጣጫ ያሳያል እንጂ ከጽሑፉ በላይ የሆነ የትምህርት ድምዳሜ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ የሚገባ አማርኛ ተጠቅሟል። የግሪክ ጽሑፉ ማኅበራዊ ኃላፊነትና ንቁ የሆነ መልካምን መከተል በግልጽ የትእዛዝ ቅርጽ ተጠብቀዋል።
