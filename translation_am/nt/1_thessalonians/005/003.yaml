  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: am
  text: “ሰላምና ደኅንነት!” በሚሉ ጊዜ፣ በነፍሰ ጡር ሴት ላይ ምጥ እንደሚመጣ ድንገተኛ ጥፋት ይደርስባቸዋል፤ ከቶም አያመልጡም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው አጽንዖታዊ አሉታ አለ፤ “በምንም ዓይነት አያመልጡም” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: በሚሉበት ጊዜ
  rationale: ወደፊት የሚፈጸም ጊዜያዊ ሁኔታን በተፈጥሯዊ አማርኛ ይገልጣል፤ ያልተገለጸውን ብዙ ቁጥር ባለቤትም ይጠብቃል።
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: ሰላምና ደኅንነት
  rationale: ሁለቱንም ረቂቅ ስሞችና የሕዝብ አዋጅ መሰል አነጋገራቸውን ይጠብቃል፤ ἀσφάλεια ከአደጋ ነፃ የመሆንንና የመተማመንን ሐሳብ ይይዛል።
- source_word: αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος
  choice: ድንገተኛ ጥፋት ይደርስባቸዋል
  rationale: የጥፋቱን ድንገተኛ መምጣትና በእነርሱ ላይ መድረሱን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὄλεθρος
  choice: ጥፋት
  rationale: ከባድ ጥፋትን ወይም ውድመትን ይገልጣል፤ የፍርዱን ትክክለኛ አይነት ወይም ቆይታ በትርጉም አይወስንም።
- source_word: ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ
  choice: ምጥ ነፍሰ ጡርን እንደሚይዛት
  rationale: የግሪኩን የወሊድ ምጥ ምስልና ህመሙ በድንገት በሴቲቱ ላይ መምጣቱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: ከቶም አያመልጡም
  rationale: οὐ μή የተባለውን ጠንካራ የወደፊት እምቢታ በአጽንዖት ያስተላልፋል።
theological_decisions:
- issue: በፍጻሜያዊው ማስጠንቀቂያ ውስጥ የὄλεθρος ባሕርይ
  choice: ጥፋት
  alternative: ውድመት፣ መቅሰፍት
  rationale: ቃሉ ወሳኝና ከባድ ፍርድን ያመለክታል፤ ሆኖም ፍጹም መጥፋትን ወይም የሥቃይን ቆይታ በራሱ አይወስንም። ስለዚህ ትርጉሙ የጽሑፉን ክብደት ጠብቆ የተወሰነ የፍጻሜ ዘመን ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። የአዋጅ መሰሉ ንግግር በጥቅስ ምልክት ተጠብቋል፤ “ምጥ ነፍሰ ጡርን እንደሚይዛት” የሚለው አነጋገር ድንገተኛነትንና ማምለጥ አለመቻልን ተፈጥሯዊ በሆነ ምስል ያቀርባል።
