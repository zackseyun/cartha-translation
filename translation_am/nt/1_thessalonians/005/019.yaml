lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: መንፈሱን
  rationale: በግሪክኛው የተወሰነ መስተዋድድ ያለው ቃል ሲሆን፣ በቅርብ ዐውዱ ስለ ትንቢት መነገሩ በዋናነት መንፈስ ቅዱስን እንደሚያመለክት ይደግፋል። አማርኛው «መንፈሱ» ይህን ዕድለኛ ማጣቀሻ ይጠብቃል፤ ሌላው አነባበብ በግርጌ ማስታወሻ ቀርቧል።
- source_word: μὴ
