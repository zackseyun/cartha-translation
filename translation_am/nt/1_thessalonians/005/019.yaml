  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር ክልከላን ይገልጣል፤ በዘመናዊ አማርኛ ይህ በአሉታዊ ትእዛዝ «አታጥፉ» ተፈጥሯዊ ሆኖ ይተረጎማል።
- source_word: σβέννυτε
  choice: አታጥፉ
  rationale: σβέννυμι በቀጥታ እሳትን ወይም ብርሃንን ማጥፋት ማለት ነው። «ማጥፋት» የምንጩን የእሳት ዘይቤ ሳይፈታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
