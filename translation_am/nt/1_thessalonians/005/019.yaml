  rationale: ቃሉ በራሱ በአጠቃላይ «መንፈስ» ሊል ቢችልም፣ በቀጣዩ ቁጥር ትንቢትን አለመናቅ መጠቀሱ በጉባኤው ውስጥ የሚሠራውን መንፈስ ቅዱስ ማመልከቱን ይበልጥ ይደግፋል። ሆኖም የግሪክኛው የቃል ስፋት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: አጭር፣ ክቡርና በዘመናዊ መደበኛ አማርኛ በቀላሉ የሚገባ የብዙ ቁጥር ትእዛዛዊ አነጋገር ተጠቅሟል። «አታጥፉ» የመጀመሪያውን የእሳት ዘይቤ ይጠብቃል።
