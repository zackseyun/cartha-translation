- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: የእግዚአብሔርን ወንጌል
  rationale: የጳውሎስን የተለመደ ሐረግ ይጠብቃል፤ የዘርፍ ግንኙነቱ ምንጭን፣ ባለቤትነትን ወይም ይዘትን ሊያመለክት የሚችለውን አሻሚነት አይፈታም።
