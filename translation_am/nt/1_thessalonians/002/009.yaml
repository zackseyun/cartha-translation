  rationale: የግሪኩን ወንድ ፆታ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ በዐውዱ ግን መላውን ጉባኤ በአካታችነት ሊያመለክት ይችላል።
- source_word: κόπον καὶ μόχθον
  choice: ድካማችንንና ልፋታችንን
  rationale: ሁለቱን ተዛማጅ ቃላት ሳያዋሕድ፣ ከባድ ጥረትንና አድካሚ ሥራን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: νυκτὸς καὶ ἡμέρας
