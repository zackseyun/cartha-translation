  text: ወንድሞች ሆይ፣[a] ድካማችንንና ልፋታችንን ታስታውሳላችሁና፤ ከእናንተ ማንንም ሸክም እንዳንሆንበት ሌሊትና ቀን እየሠራን፣ የእግዚአብሔርን ወንጌል ለእናንተ አወጅን።
  philosophy: optimal-equivalence
  footnotes:
