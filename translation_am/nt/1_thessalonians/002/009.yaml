  rationale: የዓላማ አገላለጹን ይጠብቃል፤ እዚህ ላይ ἐπιβαρέω በማንም ላይ የገንዘብ ወይም የተግባር ጫና አለመጫንን ያመለክታል።
- source_word: ἐκηρύξαμεν
  choice: አወጅን
  rationale: κηρύσσω ያለውን በግልጽና በይፋ የማሳወቅ ኃይል ይጠብቃል፣ ከቤተ እምነት ልዩ የቃላት አጠቃቀምም ይርቃል።
- source_word: εἰς ὑμᾶς
