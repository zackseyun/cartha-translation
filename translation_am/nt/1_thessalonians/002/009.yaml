    text: “ወንድሞችና እኅቶች ሆይ” ተብሎም ሊተረጎም ይችላል፤ ግሪኩ “ወንድሞች” ይላል፣ በዐውዱ ግን መላውን ጉባኤ በአካታችነት ሊያነጋግር ይችላል።
