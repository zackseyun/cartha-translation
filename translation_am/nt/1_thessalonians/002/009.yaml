  rationale: ያላቋረጠና ከፍተኛ ጥረትን የሚያመለክተውን የግሪክ ፈሊጥ በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἐργαζόμενοι
  choice: እየሠራን
  rationale: ቦዝ አንቀጹ አዋጁ በምን ሁኔታ እንደተከናወነ ያብራራል፤ ቀደም ካሉት የድካም ቃላትም ጋር የማይደጋገም ተፈጥሯዊ ምርጫ ነው።
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
