  text: ነገር ግን፣ እንደምታውቁት፣ በፊልጵስዩስ አስቀድመን መከራ ከተቀበልንና በእብሪት ከተበደልን[a] በኋላ፣ በአምላካችን ደፍረን የእግዚአብሔርን ወንጌል ለእናንተ ለመናገር በብዙ ትግል ውስጥ[c] ነበርን[b]።
  philosophy: optimal-equivalence
  footnotes:
