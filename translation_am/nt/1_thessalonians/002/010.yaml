source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: am
  text: እናንተም ምስክሮች ናችሁ፣ እግዚአብሔርም ምስክር ነው፤ ለእናንተ ለምታምኑ እንዴት በቅድስና፣ በጽድቅና ነቀፋ በሌለበት ሁኔታ እንደኖርን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: እናንተም ምስክሮች ናችሁ፣ እግዚአብሔርም ምስክር ነው
  rationale: የግሪኩን ቀጥተኛ አድራሻና የምስክርነት ጥሪ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ὡς
  choice: ምንኛ ... እንደ
  rationale: የሐዋርያቱን አኗኗር ሁኔታ የሚያስተዋውቅ አማርኛዊ አገላለጽ ነው።
- source_word: ὁσίως
  choice: በቅድስና
  rationale: ቃሉ በእግዚአብሔር ፊት ያለን ታማኝና የተቀደሰ ምግባር ያመለክታል፤ «በቅድስና» አጭርና የተለመደ ነው።
- source_word: δικαίως
  choice: በጽድቅ
  rationale: ትክክለኛና ሥነ ምግባራዊ የሆነውን አኗኗር ይገልጣል።
- source_word: ἀμέμπτως
  choice: ነቀፋ በሌለበት ሁኔታ
  rationale: ትክክለኛ የክስ ምክንያት የማይሰጥ አኗኗርን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ὑμῖν
  choice: በእናንተ ... መካከል
  rationale: ዳቲቩ ለእነርሱ ያሳዩትን አኗኗር ወይም በመካከላቸው የኖሩትን ሕይወት ሊያመለክት ይችላል፤ ከἐγενήθημεν ጋር «መካከል» በአማርኛ ተፈጥሯዊ ነው።
- source_word: τοῖς πιστεύουσιν
  choice: በምታምኑት
  rationale: የአሁን ጊዜ ተሳቢውን የግስ ኃይል ጠብቆ ተሰሎንቄውያንን በቀጥታ ይጠቅሳል።
- source_word: ἐγενήθημεν
  choice: እንደኖርን
  rationale: ከሦስቱ የሁኔታ ተውሳኮች ጋር ቃሉ የእነርሱን አኗኗርና ምግባር ያመለክታል፤ «እንደኖርን» የግሪኩን ሰፊ ትርጉም ሳያጠብ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የሐዋርያቱን ምግባር የሚገልጡት ሦስት ቃላት
  choice: ቃላቱ በእግዚአብሔርና በአማኞች ፊት የታየውን ትክክለኛ አኗኗራቸውን እንደሚገልጡ ተተርጉመዋል።
  alternative: ንግግሩን እንደ ባዶ የራስ መከላከያ ወይም እንደ ፍጹም ኃጢአት አልባነት መግለጫ መውሰድ።
  rationale: ጥቅሱ ሰዋዊና መለኮታዊ ምስክሮችን በመጥራት የአኗኗራቸውን ታማኝነት ያስረግጣል፤ «ነቀፋ የሌለበት» የሚለው ሊነቀፍ የማይገባ ምግባርን ይገልጣል እንጂ ስለ ፍጹም ኃጢአት አልባነት ተጨማሪ ዶግማ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱ ተውሳኮች ያላቸው ትይዩነት በስም ሐረጎች ተጠብቋል፤ የὑμῖν ትርጉም አሻሚነት በግርጌ ማስታወሻ ተመዝግቧል።
