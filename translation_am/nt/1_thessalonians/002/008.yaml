    issue: The rendering እንዲሁም for οὕτως adds an additive conjunction.
    rationale: οὕτως means “thus/in this way” and modifies the affectionate longing; it does not mean “also.” እንዲህ preserves the adverbial relation without adding a connective.
  - severity: low
    issue: Footnote a’s first alternative is less idiomatic and does not precisely state the participle’s sense.
    rationale: “ጥልቅ ፍቅር እያሳየናችሁ” can suggest actively demonstrating love to the readers, while ὁμειρόμενοι expresses the speakers’ deep affectionate longing. “ለእናንተ ጥልቅ ፍቅር እያለን” is clearer.
  - severity: low
    issue: Footnote b refers to the speakers in the third person (ራሳቸውን).
    rationale: The verse speaks in the first-person plural. The explanatory note should likewise say ራሳችንን to retain the reference.
