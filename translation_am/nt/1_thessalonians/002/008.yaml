  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: am
  text: 'እንዲህ፣ እናንተን እጅግ እየናፈቅን[a]፣ የእግዚአብሔርን ወንጌል ብቻ ሳይሆን የራሳችንንም ሕይወት[b] ለእናንተ ለማካፈል ደስ ብሎን ነበር፤ ምክንያቱም ለእኛ ውድ ሆናችሁ ነበር።


    [a] ወይም፣ “ለእናንተ ጥልቅ ፍቅር እያለን” ወይም “እየናፈቅናችሁ።” ὁμειρόμενοι የተባለው ብርቅዬ የግሪክ ቃል ጽኑ ናፍቆትንና ፍቅርን ያመለክታል።


    [b] ወይም፣ “የራሳችንን ነፍስ” ወይም “ራሳችንን ጭምር።” እዚህ “ሕይወት” የሚለው ራሳችንን በግልና በመሥዋዕትነት መስጠታችንን ያሳያል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእናንተ ጥልቅ ፍቅር እያለን” ወይም “እየናፈቅናችሁ።” ὁμειρόμενοι የተባለው ብርቅዬ የግሪክ ቃል ጽኑ ናፍቆትንና ፍቅርን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የራሳችንን ነፍስ” ወይም “ራሳችንን ጭምር።” እዚህ “ሕይወት” የሚለው ራሳችንን በግልና በመሥዋዕትነት መስጠታችንን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁም
  rationale: ከቀደመው የምታጠባ እናት ምሳሌ ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁμειρόμενοι ὑμῶν
  choice: እናንተን እጅግ እየናፈቅን
  rationale: ብርቅዬው ግሪክ ቃል የሚገልጠውን ጽኑ ናፍቆትና የፍቅር ቁርኝት በግልጽ ያስተላልፋል።
- source_word: εὐδοκοῦμεν
  choice: ደስ ብሎን ነበር
  rationale: ቃሉ በፈቃደኝነት የተሞላ ደስታን እንጂ ተራ ፈቃድን ብቻ አይገልጥም።
- source_word: μεταδοῦναι
  choice: ለማካፈል
  rationale: ከራስ ያለውን ለሌላ ማካፈል የሚለውን ኃይል ይጠብቃል፤ ከወንጌልና ከሕይወት ጋርም ተፈጥሯዊ ነው።
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: የእግዚአብሔርን ወንጌል
  rationale: የተለመደውንና የጳውሎስን አጠቃቀም የሚመጥነውን ክርስቲያናዊ ቃል ጠብቆ የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ያቀርባል።
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: የራሳችንንም ሕይወት
  rationale: በዐውዱ ψυχή ግለሰባዊና መሥዋዕታዊ ራስን መስጠትን ያመለክታል፤ የሰውን ክፍሎች ስለሚለይ ትምህርት አይደለም።
- source_word: διότι
  choice: ምክንያቱም
  rationale: ራሳቸውን ለመስጠታቸው ምክንያቱን በግልጽ ያሳያል።
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: ለእኛ ውድ ሆናችሁ ነበር
  rationale: የተፈጠረውን ሞቅ ያለ ግላዊ ቁርኝት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በጳውሎስ ራስን ስለመስጠት ንግግር ውስጥ ψυχάς ያለው ትርጉም
  choice: ሕይወት
  alternative: ነፍስ፤ ራሳችን
