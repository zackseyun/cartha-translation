  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: am
  text: እነርሱም ጌታ ኢየሱስንና ነቢያትን የገደሉ[a]፣ እኛንም ያባረሩ[b]፣ እግዚአብሔርንም የማያስደስቱና ሰዎችን ሁሉ የሚቃወሙ ናቸው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታ ኢየሱስን ለሞት ያበቁ።”
    reason: lexical_alternative
  - marker: b
    text: ግሱ “ከቦታ አስወጡን” ወይም “አባረሩን” የሚል ይበልጥ የተወሰነ ፍቺ አለው፤ በአጠቃላይ “አሳደዱን” ከማለት ይልቅ የተለየ ነው።
    reason: lexical_alternative
  - marker: c
    text: ይህ ገለጻ በሰዋስው በቀደመው ቁጥር የተጠቀሰውን ቡድን መግለጹን ይቀጥላል፤ በዘመንና በቦታ ሁሉ ያሉ አይሁድን በሙሉ የሚመለከት አጠቃላይ ንግግር ተደርጎ መነበብ የለበትም።
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: የገደሉ
  rationale: የግሱን ‘መግደል/ለሞት ማብቃት’ የሚለውን ቀጥተኛ ፍቺ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ በግሱ ውስጥ በግልጽ ያልተጠቀሰውን የዓላማ ወይም የሕግ ፍርድ ሐሳብ አይጨምርም።
- source_word: κύριον Ἰησοῦν
  choice: ጌታ ኢየሱስን
  rationale: κύριος የክርስቶስ ማዕረግ ስለሆነ ‘ጌታ’ ተብሎ ተተርጉሟል፤ የተሳቢ ምልክቱም በሙሉ የስም ሐረጉ መጨረሻ ላይ በተፈጥሯዊ አማርኛ ተቀምጧል።
- source_word: τοὺς προφήτας
  choice: ነቢያትን
  rationale: የታወቁትን የእግዚአብሔር ነቢያት የሚያመለክተውን የብዙ ቁጥር ስም በመደበኛ አማርኛ ይገልጻል።
- source_word: ἐκδιωξάντων
  choice: ያባረሩ
  rationale: ግሱ በአጠቃላይ ማሳደድን ብቻ ሳይሆን ከቦታ አስወጥቶ መስደድን ወይም ማባረርን ያመለክታል፤ ‘ያባረሩ’ ይህን ተጨባጭ ኃይል ይጠብቃል።
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: እግዚአብሔርንም የማያስደስቱ
  rationale: የአሁን ጊዜውን ተሳቢ ግስ ቀጣይ ገላጭ ባሕርይ ባለው የአማርኛ አንቀጽ ይወክላል።
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: ሰዎችን ሁሉ የሚቃወሙ
  rationale: ἐναντίος የሚያመለክተውን ተቃውሞ በተፈጥሯዊና ክብር ባለው አማርኛ ይገልጻል፤ ‘ጠላት የሆኑ’ ከሚለው ይልቅ የግሪኩን ሰፊ የተቃውሞ ስፋት ይጠብቃል።
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: እነርሱም ... የገደሉ፣ ... ያባረሩ፣ ... የማያስደስቱና ... የሚቃወሙ ናቸው
  rationale: የግሪኩን ተከታታይ ተሳቢ ግሶች ከቀደመው ቁጥር ርዕሰ ጉዳይ ጋር በሚያገናኝ ተፈጥሯዊ የአማርኛ ገላጭ አወቃቀር ያቀርባል።
- source_word: καὶ
  choice: -ም / እና
  rationale: የመጀመሪያው καί ተጨማሪነትን በ‘እነርሱም’ ያሳያል፤ ቀሪዎቹ ደግሞ የክሶቹን ተከታታይ ኃይል በ‘እና’ እና በ‘-ም’ ይጠብቃሉ።
theological_decisions:
- issue: የተሳቢ ግሶቹ ገለጻ ማንን እንደሚያመለክት
  choice: ቁጥሩ ‘እነርሱም’ በማለት በቀደመው ቁጥር የተጠቀሰውን ቡድን መግለጹን ይቀጥላል።
