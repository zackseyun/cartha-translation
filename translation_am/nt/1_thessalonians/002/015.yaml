  rationale: የግሪኩ የወንድ ፆታ ብዙ ቁጥር የባለቤት አመልካችና ተሳቢ ግሶች ከ2፥14 ሰዋሰዋዊ ቀዳሚ ጋር በቀጥታ የተያያዙ ናቸው። ትርጉሙ ይህን ግንኙነት ይጠብቃል፤ ጽሑፉ ያላደረገውን ዘመን ተሻጋሪ አጠቃላይ ፍረጃ አይጨምርም።
