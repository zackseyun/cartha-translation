  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ተከፍሏል፤ የቃል ድግግሞሹና ሥነ-መለኮታዊ ውጥረቱ ግን ተጠብቋል።
