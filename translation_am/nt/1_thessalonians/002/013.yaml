source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: am
  text: ስለዚህም፣ እኛ ደግሞ ያለማቋረጥ እግዚአብሔርን እናመሰግናለን፤ ከእኛ የሰማችሁትን የእግዚአብሔርን ቃል[a] በተቀበላችሁ ጊዜ፣ የሰው ቃል አድርጋችሁ ሳይሆን፣ በእውነት እንደሆነ የእግዚአብሔር ቃል አድርጋችሁ ተቀብላችሁታል[b]። ይህ ቃልም በእናንተ በምታምኑ ሰዎች ውስጥ እየሠራ ነው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእኛ የሰማችሁትን ከእግዚአብሔር የሆነውን መልእክት።” የግሪኩ አገላለጽ የታመቀ ስለሆነ በአማርኛ ከአንድ በላይ ተፈጥሯዊ መንገድ ሊፈታ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንደ ሰው መልእክት ሳይሆን፣ በእውነት እንደሆነ እንደ እግዚአብሔር መልእክት ተቀበላችሁት።”
    reason: lexical_alternative
  - marker: c
    text: የግሪኩ የዝምድና ተውላጠ ስም እግዚአብሔርንም እንደሚመለከት ሊገባ ይችላል፦ “እርሱም በእናንተ በምታምኑ ሰዎች ውስጥ እየሠራ ነው።”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህም
  rationale: የምክንያትና የአውድ ትስስሩን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐχαριστοῦμεν ... ἀδιαλείπτως
  choice: ያለማቋረጥ እግዚአብሔርን እናመሰግናለን
  rationale: ቀጣይነት ያለውን የምስጋና ተግባር እና የአሁን ጊዜውን ኃይል ይጠብቃል።
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: ከእኛ የሰማችሁትን የእግዚአብሔርን ቃል
  rationale: የግሪኩን የታመቀ አገላለጽ በተፈጥሯዊ አማርኛ ይፈታል፤ ቃሉ ከሐዋርያት እንደተሰማና የእግዚአብሔር እንደሆነ ያሳያል።
- source_word: παραλαβόντες / ἐδέξασθε
  choice: በተቀበላችሁ ጊዜ / ተቀብላችሁታል
  rationale: በመጀመሪያ መልእክቱን መቀበላቸውን፣ ቀጥሎም የእግዚአብሔር ቃል ብለው በአዎንታ መቀበላቸውን የግሪኩን ድግግሞሽ በመጠበቅ ያሳያል።
- source_word: οὐ λόγον ἀνθρώπων
  choice: የሰው ቃል አድርጋችሁ ሳይሆን
  rationale: ἀνθρώπων የሚያመለክተውን አጠቃላይ ሰብአዊ ምንጭ በጾታ-ገለልተኛና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: በእውነት እንደሆነው የእግዚአብሔር ቃል አድርጋችሁ
  rationale: የጽሑፉን አጽንዖትና በሰው ቃልና በእግዚአብሔር ቃል መካከል ያለውን ተቃርኖ ይጠብቃል።
- source_word: ὃς καὶ ἐνεργεῖται
  choice: ይህ ቃልም ... እየሠራ ነው
  rationale: ὃς በቅርብ ያለውን λόγον እንደሚመለከት በግልጽ ያቀርባል፤ ἐνεργεῖται የሚገልጠውን ቀጣይና ውጤታማ እንቅስቃሴ ያስተላልፋል።
- source_word: ἐν ὑμῖν τοῖς πιστεύουσιν
  choice: በምታምኑት በእናንተ ውስጥ
  rationale: የእምነትን ቀጣይ ባሕርይ እና የቃሉን በአማኞች ውስጥ መሥራት ይጠብቃል።
theological_decisions:
- issue: የὃς አመልካች
  choice: የዝምድናው አንቀጽ ‘የእግዚአብሔር ቃልን’ እንደሚመለከት ተተርጉሟል።
  alternative: ‘በምታምኑት በእናንተ ውስጥ የሚሠራው’ እግዚአብሔር ነው ተብሎ ሊገባ ይችላል።
  rationale: ὃς በጾታና በቁጥር λόγος እና θεός ከሁለቱም ጋር ሊስማማ ቢችልም፣ ቅርብ የሆነው አመልካች λόγον ነው፤ አማራጩ ግን በማስታወሻ ተጠብቋል።
- issue: λόγος θεοῦ በሐዋርያዊው ስብከት
  choice: ‘የእግዚአብሔር ቃል’
  alternative: ‘የእግዚአብሔር መልእክት’
  rationale: ጥቅሱ የሰውን ቃል ከእግዚአብሔር ቃል ጋር በግልጽ ያነጻጽራል፤ ‘ቃል’ ይህን ድግግሞሽና ሥነ-መለኮታዊ ክብደት ያለ ተጨማሪ የእምነት ሥርዓት ማብራሪያ ይጠብቃል።
