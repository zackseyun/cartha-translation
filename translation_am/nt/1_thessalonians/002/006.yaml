  rationale: ἐξ ἀνθρώπων የሚለው ሐረግ የክብሩ ምንጭ ሰዎች መሆናቸውን ያሳያል፤ ስለዚህ ንባቡ መለኮታዊ ክብርን እንደመፈለግ አይተረጎምም።
