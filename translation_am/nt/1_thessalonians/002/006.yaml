- source_word: ἀφ’ ὑμῶν
  choice: ከእናንተም ... ዘንድ
  rationale: ለተሰሎንቄ አማኞች የቀረበውን ቀጥተኛ የሁለተኛ መደብ ብዙ ቁጥር ንግግር ይጠብቃል።
- source_word: ἀπ’ ἄλλων
  choice: ከሌሎች ዘንድ
  rationale: ከተሰሎንቄ ሰዎች ውጭ ያሉ ሌሎች ሰዎችን በአጭርና ተፈጥሯዊ ሁኔታ ያመለክታል።
