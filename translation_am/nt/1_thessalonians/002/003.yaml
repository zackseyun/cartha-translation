  rationale: ἐκ የምንጭን ሐሳብ ስለሚያሳይ፣ «ከስህተት የመነጨ» የሚለው አነጋገር የተሳሳተ እምነትን ወይም ውሸትን እንደ ምንጭ ያሳያል፤ ሆን ብሎ የማታለልን ሐሳብ የሚያጎላውን δόλος አይደግምም።
- source_word: ἀκαθαρσίας
  choice: ርኩሰት
