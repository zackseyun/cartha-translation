- source_word: ἐκ ... ἐξ ... ἐν
  choice: ከ... የመነጨ ... በ... አልቀረበም
  rationale: ἐκ/ἐξ ምንጭን፣ ἐν ደግሞ ሁኔታን ወይም ዘዴን የሚገልጹበት ልዩነት በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: γὰρ
  choice: በአማርኛው ዓረፍተ ነገር በቀጥታ አልተገለጸም
  rationale: γὰρ ከቀደመው ጥቅስ ጋር የሚያገናኝ ማብራሪያዊ አገናኝ ነው። በአማርኛ «ምክንያቱም» ማለት ያለ ቀጣይ ዋና ሐረግ ከባድ ስለሚሆን፣ ግንኙነቱ በጥቅሶቹ ቅደም ተከተል እንዲታወቅ ተደርጓል።
