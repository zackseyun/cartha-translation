lexical_decisions:
- source_word: παράκλησις
  choice: ማሳሰቢያ
  rationale: በዚህ አውድ ቃሉ ሰሚዎችን በጽኑ የመጥራትንና የማበረታታትን ሐሳብ ይይዛል። «ማሳሰቢያ» ቃሉን በማጽናናት ትርጉም ብቻ ሳይገድብ በተፈጥሯዊ አማርኛ ያቀርበዋል።
