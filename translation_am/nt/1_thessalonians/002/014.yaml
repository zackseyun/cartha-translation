  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩን የንጽጽር አወቃቀርና የምክንያት ግንኙነት በተፈጥሯዊ የአማርኛ ቃላት አቆይቷል።
