  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: am
  text: ወንድሞች ሆይ[a]፣ እናንተ በይሁዳ በመሲሑ ኢየሱስ[b] ያሉትን የእግዚአብሔር ቤተ ክርስቲያናት አርአያቸውን ተከታዮች ሆናችኋል፤ ምክንያቱም እናንተም ከገዛ ወገኖቻችሁ[d] ያንኑ መከራ ተቀብላችኋልና፣ እነርሱም ከአይሁድ[c] እንደ ተቀበሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ወንድሞች” የሚለው አጠራር የእምነት ማኅበሩን ሁሉ፣ ወንዶችንና ሴቶችን፣ ያካትታል።
    reason: inclusive_address
  - marker: b
    text: ወይም፣ “በክርስቶስ ኢየሱስ”። የግሪኩ Χριστός “መሲሕ፣ የተቀባው” የሚል የማዕረግ ትርጉም አለው።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “ከይሁዳውያን”። የግሪኩ Ἰουδαίων እንደ አውዱ “አይሁድ” ወይም “ይሁዳውያን” ማለት ይችላል። እዚህ የተጠቀሱት መከራውን ያደረሱት የተወሰኑ ሰዎች እንጂ አይሁድ ሁሉ አይደሉም።
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ “ከገዛ አገራችሁ ሰዎች”።
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: የምትመስሉ ሆናችኋል
  rationale: የመምሰልን ግልጽ ንጽጽርና ἐγενήθητε ያለውን የመሆን ለውጥ ያቆያል፤ ‘ተከታዮች’ ከሚለውም ይበልጥ የμιμηταίን ፍቺ ይጠብቃል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር ቀጥተኛ አጠራር ይጠብቃል፤ በዚህ የማኅበር አድራሻ ውስጥ ሴቶችንም እንደሚያካትት በማስታወሻ ተገልጿል።
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: የእግዚአብሔር ቤተ ክርስቲያናት
  rationale: በዘመናዊ አማርኛ ለጳውሎሳዊው ἐκκλησία የተለመደና ተፈጥሯዊ የማኅበር አገላለጽ ነው።
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: በይሁዳ የሚገኙትን
  rationale: ቤተ ክርስቲያናቱን በመልክዓ ምድር የሚለየውን የተሳቢ ሐረግ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστός የማዕረግ ትርጉሙን፣ ማለትም ‘መሲሕ/የተቀባው’ የሚለውን፣ በግልጽ ያቆያል።
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: ያንኑ መከራ ተቀብላችኋል
  rationale: πάσχω የሚገልጸውን መከራ መቀበል በተፈጥሯዊ አማርኛ ያሳያል፤ τὰ αὐτά ያለውንም ቀጥተኛ ንጽጽር በ‘ያንኑ’ ይጠብቃል።
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: ከገዛ ወገኖቻችሁ
  rationale: ἰδίων ያለውን ‘የገዛ’ አጽንዖትና συμφυλετῶν የሚያመለክተውን የአንድ ሕዝብ ወይም ማኅበረሰብ አባልነት ያለ ወንድ-ብቻ ጥቆማ ይገልጻል።
- source_word: τῶν Ἰουδαίων
  choice: ከአይሁድ
  rationale: በዚህ አውድ የተለመደውን የዘርና የሃይማኖት ፍቺ ያቀርባል፤ ‘ከይሁዳውያን’ የሚለው መልክዓ ምድራዊ አማራጭ ግን በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: Χριστῷ እንደ ማዕረግ ወይስ እንደ ስም ክፍል መተርጎም
  choice: በመሲሑ ኢየሱስ
  alternative: በክርስቶስ ኢየሱስ
  rationale: የጳውሎስ ሐረግ የተለመደ ቢሆንም Χριστός እዚህ የማዕረግ ፍቺውን ይዞ ነው፤ ‘መሲሑ’ ይህን የትርጉም ይዘት ያስቀምጣል።
- issue: τῶν Ἰουδαίων የሚያመለክተው ወሰን
  choice: ከአይሁድ
  alternative: ከይሁዳውያን
  rationale: ጥቅሱ የይሁዳን ቤተ ክርስቲያናት ያሳደዱትን የተወሰኑ ወገኖች እንጂ በየዘመኑና በየቦታው ያሉትን አይሁድ ሁሉ አያመለክትም። ዋናው ጽሑፍ ቃሉን ሳያሰፋ ያቆያል፤ የቦታ ፍቺውም በማስታወሻ ተጠብቋል።
