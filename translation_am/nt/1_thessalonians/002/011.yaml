  terminology: “አባት,” “የራሱ ልጆች,” and “እያንዳንዳችሁ” accurately preserve the familial comparison, reflexive emphasis, and individual distributive force. The existing footnote correctly identifies the ellipsis but should not use the unsupported verb “ይይዝ.”
