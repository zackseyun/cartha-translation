reference: 1 Thessalonians 2:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: am
  text: ምክንያቱም፣ በጌታችን ኢየሱስ መምጣት[a] ጊዜ በፊቱ ተስፋችን ወይም ደስታችን ወይም የምንመካበት አክሊል ማን ነው? እናንተም አይደላችሁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመገኘቱ” ወይም “በመድረሱ”። የግሪኩ παρουσία (ፓሩሲያ) መገኘትን ወይም መድረስን ሊያመለክት ይችላል፤ በዚህ አውድ ግን የጌታ ኢየሱስን የወደፊት መምጣት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ማን
  rationale: ቃሉ “ማን” ወይም “ምን” ሊሆን ይችላል። መልሱ ሰዎችን—የተሰሎንቄን አማኞች—ስለሚያመለክት፣ በአማርኛ “ማን” ተፈጥሯዊ ሲሆን የጥያቄውንም ኃይል ይጠብቃል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በግልጽ ያሳያል።
- source_word: ἐλπίς
  choice: ተስፋ
  rationale: የጳውሎስን በመጠባበቅ የተሞላ ተስፋ በቀጥታና በተለመደ ቃል ይገልጣል።
- source_word: χαρά
  choice: ደስታ
  rationale: የግሪኩን ስሜታዊ ኃይል በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: στέφανος καυχήσεως
  choice: የምንመካበት አክሊል
  rationale: στέφανος የክብር ወይም የድል አክሊልን ያመለክታል፤ የግሪኩን የመመካት ሐሳብ ግን በአማርኛ ተፈጥሯዊ በሆነ የዝምድና ሐረግ ተገልጧል።
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: በእርግጥ እናንተም አይደላችሁምን?
  rationale: οὐχί አዎንታዊ መልስ የሚጠብቀውን አጽንዖት “በእርግጥ” እና በአሉታዊ የንግግር ጥያቄ ያሳያል፤ καί ደግሞ “እናንተም” በሚለው ተጠብቋል።
- source_word: ἔμπροσθεν
  choice: በፊቱ
  rationale: በጌታ ፊት መቆምን በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κυρίου
  choice: ጌታ
  rationale: ለκύριος የተለመደውና በአውዱ የሚስማማው አተረጓጎም ነው።
- source_word: παρουσίᾳ
  choice: በሚመጣበት ጊዜ
  rationale: በዚህ የመጨረሻውን ዘመን በሚመለከት አውድ የጌታ ኢየሱስን የወደፊት መምጣት በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የቃሉ ሌሎች ትርጉሞች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: παρουσίᾳ በመጨረሻው ዘመን አውድ መተርጎም
  choice: በሚመጣበት ጊዜ
  alternative: በመገኘቱ ጊዜ፤ በሚደርስበት ጊዜ
  rationale: አውዱ የጌታ ኢየሱስን የወደፊት መምጣት ያመለክታል፤ ሆኖም παρουσία በቃል ደረጃ “መገኘት” ወይም “መድረስ” ሊል ስለሚችል ይህ ስፋት በማስታወሻው አልጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የንግግር ጥያቄ በአማርኛ ግልጽነት ሲባል በሁለት ተያያዥ ጥያቄዎች ተደርጓል፤ የአውዱ የጊዜ ሐረግ ወደ ፊት ተዛውሯል።
