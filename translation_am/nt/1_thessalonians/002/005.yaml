  text: ምክንያቱም ከቶ በሽንገላ ንግግር[a] አልመጣንም፣ እንደምታውቁትም፤ ስግብግብነትን ለመሸፈን በሚሆን ሰበብም[b] አልመጣንም—እግዚአብሔር ምስክር ነው።
  philosophy: optimal-equivalence
