- source_word: ἐν προφάσει πλεονεξίας
  choice: ስግብግብነትን ለመሸፈን በማስመሰያ
  rationale: πρόφασις ሐሰተኛ ምክንያትን፣ ማስመሰልን ወይም ውስጣዊ ዓላማን የሚሸፍን ሽፋንን ሊያመለክት ይችላል። πλεονεξία ከልክ በላይ ለማግኘት ያለን ስግብግብነት ያመለክታል። የተመረጠው አገላለጽ የተደበቀ የጥቅም ፍላጎትን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
