lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: ምክንያቱም … ከቶ … አል…ም
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ትስስር ‘ምክንያቱም’ በማለት ያሳያል፤ οὔτε ከ ποτέ ጋር ያለው ጠንካራ እምቢታ በተፈጥሯዊው የአማርኛ አገላለጽ ‘ከቶ … አል…ም’ ተተርጉሟል።
- source_word: ἐν λόγῳ κολακείας
  choice: በሽንገላ ንግግር
  rationale: λόγος እዚህ አንዲትን ቃል ሳይሆን ንግግርን ያመለክታል፤ κολακεία ሰውን ለማስደሰት የሚነገር የማባበያ ሽንገላ ነው። ἐν የአካሄድ ወይም የመንገድ ትርጉም በ‘በ’ ተጠብቋል።
- source_word: ἐγενήθημεν
  choice: አልቀረብንም
