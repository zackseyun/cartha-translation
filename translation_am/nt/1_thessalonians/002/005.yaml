theological_decisions:
- issue: ጳውሎስ ስለ ዘዴውና ስለ ውስጣዊ ዓላማው የሰጠው ክህደት ወሰን
  choice: ጥቅሱ በንግግር የሚደረግን ሽንገላና በማስመሰያ የሚሸፈንን ስግብግብነት ሁለቱንም ይክዳል።
  alternative: ጥቅሱን ማንኛውንም የአነጋገር ውበት እንደሚኮንን ወይም ስለ ገንዘብ ብዝበዛ ብቻ እንደሚናገር መተርጎም።
  rationale: የግሪኩ ጽሑፍ κολακείαንና πλεονεξίαን በተለይ ይጠቅሳል። ስለዚህ ትርጉሙ የንግግር ጥበብን በሙሉ አይኮንንም፤ ስግብግብነትንም ያለ ጽሑፋዊ ግዴታ በገንዘብ ብቻ አይወስንም።
