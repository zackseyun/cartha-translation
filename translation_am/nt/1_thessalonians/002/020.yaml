  rationale: በግልጽ የተጠቀሰውን የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስምና አጽንዖቱን ይጠብቃል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐστε
  choice: ናችሁ
  rationale: የአሁን ጊዜ አመልካች አገናኝ ግስን በሁለተኛ መደብ ብዙ ቁጥር በቀጥታ ይተረጉማል።
- source_word: δόξα
  choice: ክብር
  rationale: የቃሉን ሰፊ የክብርና የውዳሴ ትርጉም ይጠብቃል፤ በዚህ ግንኙነታዊ አውድ ‘የምንመካባችሁ’ ብሎ ከሚፈታው ይልቅ አሻሚነቱን ያቆያል።
- source_word: ἡμῶν
  choice: -አችን
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር ባለቤትነትን በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
- source_word: χαρά
  choice: ደስታ
  rationale: ደስ መሰኘትንና ሐሴትን የሚያመለክተውን ስም በቀጥታና በዘመናዊ አጠቃቀም ይገልጣል።
theological_decisions:
- issue: በጳውሎስ ግንኙነታዊ ንግግር ውስጥ δόξαን መተርጎም
  choice: ክብር
  alternative: መመኪያ / የምንመካበት
  rationale: ‘ክብር’ የግሪኩን ቃል ስፋትና የንግግሩን ክብደት ይጠብቃል፤ ተሰሎንቄዎች ለሐዋርያት የክብርና የደስታ ምንጭ መሆናቸውን ይገልጣል እንጂ ቃሉን ወደ ራስ መመካት ብቻ አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። በተነባቢነት ሲቀርብ አጽንዖት ያለውን ὑμεῖς ለማስጠበቅ ‘እናንተ’ በግልጽ ተጠቅሷል፤ γάρ ደግሞ በመጨረሻው ‘-ና’ ተገልጧል።
