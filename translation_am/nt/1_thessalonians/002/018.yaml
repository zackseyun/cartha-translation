base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: am
  text: ምክንያቱም ወደ እናንተ ለመምጣት ፈልገን ነበር—እኔ ጳውሎስም እንኳ ደጋግሜ[a]—ሰይጣን ግን አሰናከለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “አንድ ጊዜም ሁለት ጊዜም”፤ ይህም ከአንድ ጊዜ በላይ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ምክንያቱም
  rationale: ቀደም ሲል ለተነገረው ሐሳብ ምክንያት የሚያቀርበውን ገላጭ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἠθελήσαμεν
  choice: ፈልገን ነበር
  rationale: የቡድኑን ፍላጎትና ፈቃድ በዘመናዊ አማርኛ በግልጽ ሁኔታ ይገልጣል።
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: ወደ እናንተ ለመምጣት
  rationale: ወደ ተሰሎንቄ ሰዎች የሚደረገውን እንቅስቃሴ ያለ ተጨማሪ ትርጓሜ በቀጥታ ያቀርባል።
- source_word: ἐγὼ μὲν Παῦλος
  choice: በተለይም እኔ ጳውሎስ
  rationale: ከብዙ ቁጥር ‘እኛ’ መካከል ጳውሎስን ለይቶ የሚያጎላውን ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καὶ ἅπαξ καὶ δίς
  choice: ደጋግሜ
  rationale: ‘አንድ ጊዜም ሁለት ጊዜም’ የሚለውን ፈሊጣዊ አነጋገር በቀላሉ ይገልጣል፤ ቃል በቃል አቀራረቡ በማስታወሻ ተጠብቋል።
- source_word: ἐνέκοψεν
  choice: አገደን
  rationale: በመንገዳቸው ላይ እንቅፋት በመፍጠር መምጣታቸውን ማሰናከል የሚለውን ትርጉም ያስተላልፋል፤ ከምንጩ በላይ ፍጹም ውሳኔን አያስገባም።
- source_word: ὁ Σατανᾶς
  choice: ሰይጣን
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የግል ስም/መጠሪያ ይጠብቃል።
theological_decisions:
- issue: ጳውሎስና ባልደረቦቹ እንዳይጓዙ የሰይጣን አጋጅነት
  choice: ሰይጣን ግን አገደን
  alternative: ጠላት ግን አገደን / ሰይጣን ግን ከለከለን
  rationale: ጽሑፉ እንቅፋቱን በቀጥታ ለሰይጣን ይሰጣል። ትርጉሙም ይህን የግል አጋጅነት ሳያለዝብ ይጠብቃል፤ በተመሳሳይም ἐνέκοψεν ከሚፈቅደው በላይ ፍጹም የማይቀለበስ ክልከላ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ሰረዞቹ በብዙ ቁጥር የተነገረውን ‘ፈልገን’ እና ጳውሎስን ለይቶ የሚያጎላውን አጭር አስገባ ንግግር ያበራሉ።
