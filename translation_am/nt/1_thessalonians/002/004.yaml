  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: am
  text: ነገር ግን እግዚአብሔር ፈትኖ ተቀባይነት እንደሰጠንና ወንጌልን በአደራ እንደሰጠን፣ እንዲሁ እንናገራለን፤ ሰዎችን ለማስደሰት ሳይሆን፣ ልባችንን እግዚአብሔርን ለማስደሰት ነው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪኩ አገባብ፣ «ሰዎችን ደስ እያሰኙ ሳይሆን፣ እግዚአብሔርን [ደስ እያሰኙ]» የሚል አጭር ንጽጽር ነው፤ «ደስ ማሰኘት» የሚለው ግስ በሁለተኛው ክፍል በግልጽ አልተጻፈም፣ ነገር ግን በአገባቡ ይገባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: ፈትኖ ተቀባይነት እንደሰጠን
  rationale: የግሪኩ ፍጹም ዘመን ተፈትኖ መጽደቅንና ውጤቱ እንደቀጠለ ያሳያል። «ተቀባይነት ሰጠ» የፈተናውን አዎንታዊ ውጤት ያሳያል፤ «ብቁ አድርጎ አገኘን» ከሚለው ደግሞ ያነሰ ትርጓሜ ይጭናል።
- source_word: πιστευθῆναι
  choice: በአደራ እንደሰጠን
  rationale: እዚህ ላይ ትርጉሙ ወንጌልን ማመን ሳይሆን ወንጌል ለሐዋርያት በአደራ መሰጠቱ ነው።
- source_word: τὸ εὐαγγέλιον
  choice: ወንጌልን
  rationale: «ወንጌል» በአማርኛ የተለመደና የጳውሎስን ሃይማኖታዊ አጠቃቀም የሚጠብቅ ቃል ነው።
- source_word: οὕτως λαλοῦμεν
  choice: እንዲሁ እንናገራለን
  rationale: ንግግራቸውን ከእግዚአብሔር ፈተናና አደራ ጋር የሚያገናኘውን የግሪኩን አመክንዮ በቀጥታ ይጠብቃል።
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: ሰዎችን ደስ እንደምናሰኝ ሳይሆን
  rationale: የግሪኩን ተሳቢ የግስ ቅርጽና «እንደ» የሚለውን ንጽጽር በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἀλλὰ θεῷ
  choice: ልባችንን የሚፈትነውን እግዚአብሔርን ነው
  rationale: በሁለተኛው የንጽጽሩ ክፍል «ደስ ማሰኘት» የሚለውን ግስ ሳይደግም፣ የግሪኩን አጭርና የታጠፈ አገባብ ይጠብቃል።
- source_word: τῷ δοκιμάζοντι
  choice: የሚፈትነውን
  rationale: የአሁን ጊዜው አሳታፊ ግስ እግዚአብሔር ልብን የሚመረምርበትን ቀጣይ ተግባር ያሳያል፤ በቁጥሩ መጀመሪያ ካለው δοκιμάζω ጋር ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: τὰς καρδίας ἡμῶν
  choice: ልባችንን
  rationale: «ልብ» የግሪኩን መጽሐፍ ቅዱሳዊ የሰው ውስጣዊ ማንነት ገለጻ ይጠብቃል፤ ወደ «አእምሮ» ወይም «ሐሳብ» ብቻ አያጠበውም።
theological_decisions:
- issue: ሰዎችን ደስ በማሰኘትና እግዚአብሔርን ደስ በማሰኘት መካከል ያለውን ንጽጽር መተርጎም
  choice: በዋናው ጽሑፍ «ሰዎችን ደስ እንደምናሰኝ ሳይሆን፣ ... እግዚአብሔርን ነው» በማለት የግሪኩን የታጠፈ አገባብ መጠበቅ
  alternative: «ሰዎችን ደስ ለማሰኘት ሳይሆን፣ እግዚአብሔርን ደስ ለማሰኘት» ብሎ ሙሉ ግሱን በሁለቱም ክፍሎች መግለጽ
  rationale: በግሪኩ «ደስ ማሰኘት» የሚለው በመጀመሪያው የንጽጽር ክፍል ብቻ በግልጽ ተጽፎአል፤ በሁለተኛው ግን በአገባቡ ይገባል። ዋናው ጽሑፍ ይህን አጭርነት ይጠብቃል፤ ግልጽ ተለዋጩ በማስታወሻ ቀርቧል።
