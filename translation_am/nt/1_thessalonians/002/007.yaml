    text: ወይም፣ “እንደ የመሲሑ ሐዋርያት ሥልጣናችንን ልንጠቀም” ወይም “ጥያቄ ልናቀርብባችሁ”። የግሪኩ አገላለጽ በቀጥታ “በክብደት መሆን” ይላል።
