  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: am
  text: የመሲሑ ሐዋርያት በመሆናችን ክብደት ልናሳርፍባችሁ ብንችልም[a][b]፣ አጥቢ እናት የራሷን ልጆች በፍቅር እንደምትንከባከብ፣ እኛም በመካከላችሁ ገሮች ሆንን።
  philosophy: optimal-equivalence
  footnotes:
