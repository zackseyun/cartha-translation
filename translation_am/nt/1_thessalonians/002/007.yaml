  source_fidelity: The draft conveys the principal contrast and the maternal-care image, but ሸክም ልንሆንባችሁ narrows ἐν βάρει εἶναι toward being a burden, whereas the Greek can also denote exercising apostolic weight or making demands. The revised wording retains the broader sense. The final simile in the draft is syntactically mismatched with ነበርን and should be recast.
  naturalness: Most wording is modern and clear. የመሲሑ ሐዋርያት በመሆናችን is more idiomatic than እንደ መሆናችን. Reordering the comparison produces a complete, natural Amharic sentence.
  terminology: መሲሕ, ሐዋርያት, ገሮች, and የራሷን ልጆች are appropriate. አጥቢ እናት appropriately communicates τροφός in this context. The lexical footnote should distinguish the literal metaphor from its interpretive alternatives.
  issues:
  - severity: medium
    issue: The expression ሸክም ልንሆንባችሁ is too narrow for ἐν βάρει εἶναι.
    rationale: It primarily suggests imposing a burden, while the Greek wording deliberately permits the broader notion of apostolic weight, authority, or demands.
  - severity: high
    issue: The clause ending አጥቢ እናት ... እንደምትንከባከብ ነበርን has a grammatical and temporal mismatch.
    rationale: The plural first-person ነበርን does not naturally complete the third-person maternal comparison, and it weakens ἐγενήθημεν ('we became').
  - severity: low
