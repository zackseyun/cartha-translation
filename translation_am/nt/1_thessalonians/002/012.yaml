  text: እያበረታታናችሁ፣ እያጽናናናችሁና አጥብቀን እየመከርናችሁ[a]፣ ወደ ራሱ መንግሥትና ክብሩ ለሚጠራችሁ ለእግዚአብሔር ተገቢ በሆነ ሁኔታ እንድትመላለሱ[b]።
