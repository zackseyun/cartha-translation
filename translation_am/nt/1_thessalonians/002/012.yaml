review_pass:
  verdict: revise
  source_fidelity: The three coordinated participles, the purpose clause, the present sense of God's calling, and the reflexive emphasis in 'his own kingdom' are largely represented. However, the added final verb ‘አሳሰብናችሁ’ is not in the Greek and recasts this verse's dependent participial construction as an additional completed assertion; it also redundantly repeats the sense of the third participle.
  naturalness: The wording is generally clear and dignified, but the added final verb makes the sentence heavier and less faithful. ‘ለእግዚአብሔር በሚገባ ሁኔታ’ is better expressed as ‘ለእግዚአብሔር ተገቢ በሆነ ሁኔታ’ in this context. ‘ክብሩ’ naturally makes explicit that the coordinated glory is God's.
  terminology: ‘እያበረታታናችሁ,’ ‘እያጽናናናችሁ,’ and ‘አጥብቀን እየመከርናችሁ’ suitably preserve the distinct but overlapping pastoral force of the participles. ‘እንድትመላለሱ’ appropriately retains the biblical metaphor, with a useful explanatory note.
  issues:
  - severity: medium
    issue: An unsupported final finite verb has been added.
    rationale: ‘አሳሰብናችሁ’ has no direct counterpart in the Greek, which consists of three participles followed by a purpose infinitive. It adds a past completed action and duplicates the urging/reminding sense already conveyed by μαρτυρόμενοι.
  - severity: low
    issue: The coordinated possessive phrase is slightly unclear in Amharic.
    rationale: In ‘ወደ ራሱ መንግሥትና ክብር,’ the relation of ‘ክብር’ to God is less explicit. ‘ወደ ራሱ መንግሥትና ክብሩ’ reads naturally while retaining the Greek coordination.
