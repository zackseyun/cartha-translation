  rationale: የሚያውቁትን ነገር የሚያስገባውን ὅτι ከአሉታዊው ግስ ጋር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐ κενὴ
  choice: ከንቱ እንዳልሆነ
  rationale: መምጣታቸው ባዶ፣ ያለ ፍሬ ወይም ያለ ጥቅም እንዳልነበረ የሚያሳየውን ሰፊ የቃሉን ኃይል ይጠብቃል።
- source_word: γέγονεν
