base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: am
  text: እንዲህ በማለት፦ “ስምህን ለወንድሞቼ[a] አውጃለሁ፤ በጉባኤው[b] መካከል ምስጋናን እዘምርልሃለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለወንድሞቼና ለእህቶቼ።” የግሪኩ ቃል “ወንድሞች” ይላል፤ በዐውዱ ግን የእምነት ቤተሰብን ሁሉ ሊያካትት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በማኅበሩ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ በማለት
  rationale: ጥቅሱን የሚያስተዋውቀውን የአሁን ጊዜ አንቀጽ በተፈጥሯዊና ቀጥተኛ የአማርኛ አገላለጽ ያቀርባል።
- source_word: Ἀπαγγελῶ
  choice: አውጃለሁ
  rationale: በግልጽና በይፋ የመናገርን ኃይል ይጠብቃል፤ የወደፊት ጊዜውም ተጠብቋል።
- source_word: τὸ ὄνομά σου
  choice: ስምህን
  rationale: የምንጩን ‘ስም’ ቃል ሳያሰፋ በቀጥታ ይጠብቃል፤ ቃሉ ማንነትንና ባሕርይን ሊያመለክት የሚችለው ስፋት አልተወገደም።
- source_word: τοῖς ἀδελφοῖς μου
  choice: ለወንድሞቼ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በዐውዱ ሴቶችንም የሚያካትት የእምነት ቤተሰብ ሊሆን መቻሉ በማስታወሻ ተገልጿል።
- source_word: ἐν μέσῳ
  choice: በ…መካከል
  rationale: የምንጩን ቦታዊ አገላለጽና የጥቅሱን ከፍ ያለ የቅኔ ቃና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκκλησίας
  choice: ጉባኤው
  rationale: በመዝሙር ጥቅሱ ዐውድ የተሰበሰበውን ሕዝብ ያመለክታል፤ ከኋለኛው ተቋማዊ ‘ቤተ ክርስቲያን’ ትርጉም ይልቅ የመሰብሰብን መሠረታዊ ሐሳብ ያስቀድማል።
- source_word: ὑμνήσω
  choice: ምስጋናን እዘምርልሃለሁ
  rationale: ግሱ ምስጋናን በዝማሬ መግለጥን ስለሚያመለክት፣ የሙዚቃውን ገጽታ ግልጽ በሆነ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: σε
  choice: ለአንተ (በ‘እዘምርልሃለሁ’ ውስጥ)
  rationale: የሁለተኛ መደብ ነጠላ ተሳቢው በግሱ ቅጥያ ‘-ልሃለሁ’ ውስጥ በተፈጥሯዊ አማርኛ ተካትቷል።
theological_decisions:
- issue: ἀδελφοῖς የሚለውን ቤተሰባዊ ቃል አተረጓጎም
  choice: ወንድሞቼ
  alternative: ወንድሞቼና እህቶቼ / የእምነት ቤተሰቦቼ
  rationale: ዋናው ጽሑፍ የግሪኩን ተባዕታይ ቅርጽ ይጠብቃል፤ በዐውዱ የአማኞችን ቤተሰብ በሙሉ ሊያካትት መቻሉን ግን ማስታወሻው ሳይወስን ያሳያል።
- issue: በብሉይ ኪዳን ጥቅስ ውስጥ ἐκκλησία የሚለው አተረጓጎም
  choice: ጉባኤ
  alternative: ማኅበር / ቤተ ክርስቲያን
  rationale: የተሰበሰበውን ሕዝብ የሚያመለክተውን መሠረታዊ ስሜት ይጠብቃል፤ ጥቅሱ የማይጠይቀውን ኋለኛ ተቋማዊ ትርጉም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለንባብ ተፈጥሯዊ አማርኛን ይጠቀማል። የመዝሙር ጥቅሱን ከፍ ያለ ቃና ለመጠበቅ ‘በ…መካከል’ እና ‘ምስጋናን እዘምርልሃለሁ’ የሚሉ አገላለጾች ተመርጠዋል።
