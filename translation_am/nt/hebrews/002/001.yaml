  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: am
  text: ስለዚህ፣ ልንሸራተት[a] እንዳንችል፣ ለሰማናቸው ነገሮች እጅግ የበለጠ ትኩረት መስጠት ይገባናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አልፈን እንዳንሄድ” ወይም “ከእኛ እንዳያመልጡ።” የግሪኩ ግስ παραρυῶμεν በፍሰት የመንሸራተት፣ አልፎ የመሄድ፣ ወይም የማምለጥን ምስል ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊና ድምዳሜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δεῖ
  choice: ይገባናል
  rationale: የግዴታንና የአስፈላጊነትን ኃይል ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
- source_word: περισσοτέρως
  choice: እጅግ የበለጠ
  rationale: ትኩረቱ ከመደበኛው የላቀ መሆን እንዳለበት የሚያሳየውን ንጽጽራዊ አጽንዖት ይጠብቃል።
- source_word: προσέχειν ἡμᾶς
  choice: ትኩረት መስጠት ይገባናል
  rationale: አእምሮን ወደ አንድ ነገር ማዞርንና ልብ ብሎ መከታተልን በዘመናዊ አማርኛ በግልጽ ሁኔታ ይገልጣል።
- source_word: τοῖς ἀκουσθεῖσιν
  choice: ከሰማነው ነገር ... ለእርሱ
  rationale: የተሰማውን መልእክት በተፈጥሯዊ አማርኛ ይገልጣል፤ የፍጹም ተሳቢ ቅጹን ቀጣይ ጠቀሜታም ይጠብቃል።
- source_word: μήποτε
  choice: እንዳን-
  rationale: ሊከሰት የሚችልን አሉታዊ ውጤት የሚያስጠነቅቀውን ኃይል በአማርኛ የዓላማ/መከላከያ አገባብ ያሳያል።
- source_word: παραρυῶμεν
  choice: እንዳንንሳፈፍ
  rationale: ግሱ የሚያስነሳውን ቀስ በቀስ በፍሰት የመወሰድን ወይም አልፎ የመንሳፈፍን ምስል ይጠብቃል፤ አቅጣጫውን በዋናው ጽሑፍ ከልክ በላይ አይወስንም።
theological_decisions:
- issue: በπαραρυῶμεν ያለው የማስጠንቀቂያ ምሳሌ ተፈጥሮ
  choice: ሰሚዎቹ ከሰሙት ነገር በፍሰት እንዳይርቁ የሚያስጠነቅቅ ምስል ሆኖ ተተርጉሟል።
  alternative: የተሰማው ነገር ከእኛ እንዳያመልጥ፤ ወይም እኛ ከእርሱ አልፈን እንዳንንሳፈፍ።
  rationale: የግሪኩ ግስ ከሰሚዎቹ ወይም ከመልእክቱ አንጻር ሊታይ ይችላል። አገባቡ ሰሚዎቹን በቀጥታ ቢያስቀድምም፣ ትርጉሙ ስለ ክህደት የተወሰነ የእምነት ሥርዓት ሳያስገባ የማስጠንቀቂያውን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እንዳንንሳፈፍ” ምሳሌያዊውን ምስል ይጠብቃል፤ የአቅጣጫው ግልጽ አለመሆን በማስታወሻ ተገልጿል።
