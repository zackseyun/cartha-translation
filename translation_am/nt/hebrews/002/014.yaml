lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: ስለዚህ … ከሆነ
  rationale: የοὖνን የመደምደሚያ ኃይልና የἐπείን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰ παιδία
  choice: ልጆቹ
  rationale: በአውዱ ውስጥ ቀደም ሲል የተጠቀሱትን ልጆች በቀጥታ ያመለክታል።
- source_word: κεκοινώνηκεν
  choice: የሚካፈሉ
  rationale: ፍጹም ጊዜው የሚያመለክተውን ቀጣይ የተሳትፎ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αἵματος καὶ σαρκός
  choice: ደምና ሥጋን
  rationale: የግሪኩን ‘ደምና ሥጋ’ ቅደም ተከተል ጠብቆ ሁለቱንም በቃል ትርጉማቸው ያቀርባል።
- source_word: παραπλησίως
  choice: እንደዚሁ
  rationale: እውነተኛ ተመሳሳይነትን ያሳያል፤ ከጽሑፉ በላይ ፍጹም አንድነትን አይጨምርም።
- source_word: μετέσχεν τῶν αὐτῶν
  choice: በእነዚያው ተካፈለ
  rationale: ከልጆቹ ተሳትፎ ጋር ያለውን ትይዩነት ይጠብቃል፤ ‘እነዚያው’ ደምና ሥጋን መልሶ ያመለክታል።
- source_word: διὰ τοῦ θανάτου
  choice: በሞቱ
  rationale: διά ከዝርያ አገናዛቢ ጋር ያለውን የመንገድ/መሣሪያ ትርጉም ያስተላልፋል፤ የባለቤት ቅጥያው በአውዱ የእርሱን ሞት ግልጽ ያደርጋል።
- source_word: καταργήσῃ
  choice: ኀይል እንዲያሳጣው
  rationale: ግሱ ሕልውናን ማጥፋት ሳይሆን ውጤታማነትን ወይም ኀይልን ማስወገድ ሊያመለክት መቻሉን ይጠብቃል።
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: የሞትን ኀይል የያዘውን
  rationale: κράτοςን ‘ኀይል’ ብሎ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: ማለትም ዲያብሎስን
  rationale: ቀዳሚው መግለጫ ማንን እንደሚያመለክት በግልጽ የማብራሪያ ቅርጽ ያቀርባል።
theological_decisions:
- issue: ክርስቶስ በሰው ሕልውና መካፈሉ
  choice: ‘እርሱም ራሱ እንደዚሁ በእነዚያው ተካፈለ’ ተብሎ ተተርጉሟል።
  alternative: ‘እርሱም እንደ እነርሱ ሰው ሆነ’
  rationale: የግሪኩን ትይዩ አገላለጽና የተለየውን ግስ በመጠበቅ እውነተኛ ተሳትፎውን ይገልጣል፤ ጥቅሱ በቀጥታ ያልተናገረውን ኋለኛ የትምህርት ቀመር አያስገባም።
- issue: καταργήσῃ ለዲያብሎስ ሲውል ያለው ትርጉም
  choice: ‘ኀይል እንዲያሳጣው’
  alternative: ‘እንዲያጠፋው’
  rationale: የዲያብሎስ ሕልውና እንደተደመሰሰ ከማስመሰል ይልቅ ግሱ የሚፈቅደውን ኀይል አልባ ወይም ውጤት አልባ የማድረግ ሐሳብ ያቀርባል፤ ባሕላዊው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደምና ሥጋ’ የሚለው የምንጩን ቅደም ተከተል ይጠብቃል፤ ‘ኀይል እንዲያሳጣው’ የκαταργέωን የትርጉም ስፋት ያለ ኑፋቄያዊ ጭማሪ ያስተላልፋል።
