review_pass:
  verdict: revise
  source_fidelity: The main text accurately conveys the causal force of ἐν ᾧ γάρ, Christ’s emphatic personal suffering while being tempted, his present ability, and the ongoing experience of those being tempted. The lexical-alternative footnote, however, uses ተፈተሸ, which most readily suggests examination/inspection and is less suitable as the contextual alternative “tested” for πειράζω.
  naturalness: The verse is clear, dignified, and idiomatic modern standard Amharic. The construction መከራን ስለተቀበለ is natural and appropriately expresses suffering.
  terminology: መፈተን is an appropriate primary rendering for πειράζω here. The alternative should be expressed as መሞከር/መሞከር ደርሶበት (“to be tried”), rather than መፈተሽ, to preserve the trial/testing sense without implying mere inspection.
