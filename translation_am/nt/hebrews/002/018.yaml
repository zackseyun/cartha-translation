    issue: The footnote’s alternative rendering uses ተፈተሸ / እየተፈተሹ.
    rationale: In modern Amharic, መፈተሽ commonly denotes examining or inspecting. For the alternative contextual sense of πειράζω, መሞከር (“to try/test through trial”) is more accurate and natural. The footnote also should present parallel forms in both clauses.
