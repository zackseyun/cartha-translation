  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: am
  text: እርሱ ራሱ በተፈተነ ጊዜ መከራን ስለተቀበለ፣ እየተፈተኑ ያሉትን[a] ሊረዳ ይችላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በሁለቱም ስፍራ «በተሞከረ ጊዜ / እየተሞከሩ ያሉትን»፦ «እርሱ ራሱ በተሞከረ ጊዜ መከራን ስለተቀበለ፣ እየተሞከሩ ያሉትን ሊረዳ ይችላል።» የግሪኩ ግስ እንደ አውዱ «መፈተን» ወይም «መሞከር» ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: ስለተቀበለ
  rationale: ἐν ᾧ በዚህ አውድ ምክንያታዊ ኃይል አለው፤ γὰρ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ገላጭ ግንኙነት ያሳያል። በአማርኛ የ«ስለ-» አወቃቀር ሁለቱንም በተፈጥሯዊ ሁኔታ ይይዛል።
- source_word: πέπονθεν
  choice: መከራን ስለተቀበለ
  rationale: πάσχω የመከራ ልምምድን ያመለክታል። ፍጹም ጊዜው የተፈጸመው ልምምድ አሁንም ጠቀሜታ እንዳለው ያሳያል፤ ይህም በቀጣዩ «ሊረዳ ይችላል» በሚለው ሐሳብ ይገለጣል።
- source_word: αὐτὸς
  choice: እርሱ ራሱ
  rationale: አጽንዖታዊውን ተውላጠ ስም በግልጽ ሁኔታ ይጠብቃል፤ ወልድ ይህን ልምምድ በግሉ እንዳለፈ ያጎላል።
- source_word: πειρασθείς
  choice: በተፈተነ ጊዜ
  rationale: πειράζω «መፈተን» ወይም «መፈተሽ» ሊል ይችላል። «መፈተን» ዋናውን ንባብ ይጠብቃል፤ ሌላው የቃሉ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: δύναται
  choice: ሊረዳ ይችላል
  rationale: የችሎታን ኃይል በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς πειραζομένοις
  choice: እየተፈተኑ ያሉትን
  rationale: የአሁን ጊዜ ክፍለ ግስ ፈተናው ቀጣይ መሆኑን ያሳያል፤ «እየተፈተኑ ያሉትን» ይህን ገጽታ ይጠብቃል።
- source_word: βοηθῆσαι
  choice: ሊረዳ
  rationale: βοηθέω ለተቸገረ ሰው መርዳትን ወይም ወደ እርዳታው መድረስን ያመለክታል፤ «ሊረዳ» ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: πειράζω ለኢየሱስና ለአማኞች ሲውል ያለው ትርጉም
  choice: መፈተን
  alternative: መፈተሽ
  rationale: ዋናው ጽሑፍ «መፈተን»ን በመጠቀም ከዕብራውያን 4፥15 ጋር ያለውን ቅርብ ትይዩነትና የሰውን ፈተና በልምምድ መጋራቱን ይጠብቃል። ይህ ኢየሱስ ለኃጢአት እጅ ሰጥቷል ማለት አይደለም። ግሪኩ «መፈተሽ»ንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እርሱ ራሱ» የምንጩን አጽንዖት፣ «እየተፈተኑ ያሉትን» ደግሞ የቀጣይነት ገጽታውን ይጠብቃሉ።
