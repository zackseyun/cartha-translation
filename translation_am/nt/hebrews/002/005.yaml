  rationale: በግሪክ ግሱ ባለቤቱን በስም አይገልጽም፤ ከአውዱ ግን እግዚአብሔር መሆኑ ይታወቃል። በተፈጥሯዊ አማርኛ ግልጽነት ሲባል ስሙ ተጨምሯል፣ የሐሳቡን አቅጣጫ ሳይቀይር።
