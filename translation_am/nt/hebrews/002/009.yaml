  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: am
  text: ነገር ግን ከመላእክት ለጥቂት ጊዜ ዝቅ የተደረገውን፣ በሞት ሥቃይ ምክንያት በክብርና በማዕረግ ተቀዳጅቶ ያለውን ኢየሱስን እናያለን፤ ይህም ከእግዚአብሔር ውጭ[a] ለሁሉም ሰው ሞትን እንዲቀምስ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ከእግዚአብሔር ውጭ” በሚለው ፈንታ “በእግዚአብሔር ጸጋ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: ለጥቂት ጊዜ
  rationale: በመዝሙር 8 ጥቅስ ዐውድ ውስጥ ሐረጉ የደረጃ መጠንን ሳይሆን የተወሰነ ጊዜን እንደሚያመለክት ተተርጉሟል።
- source_word: παρ’ ἀγγέλους
  choice: ከመላእክት
  rationale: ከἠλαττωμένον ጋር ያለው παρά የንጽጽር ኃይል ስላለው ‘ከመላእክት ዝቅ’ ተብሏል።
- source_word: ἠλαττωμένον
  choice: ዝቅ የተደረገውን
  rationale: የግሪኩን ፍጹም ተደራጊ አንቀጽና የንጽጽር ሐሳብ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: በሞት መከራ ምክንያት
  rationale: διά ከተሳቢ ጋር እዚህ ምክንያትን ያመለክታል፤ አገላለጹም የሞትን መከራ ሳያቃልል ያቀርባል።
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: በክብርና በሞገስ ተቀዳጅቶአል
  rationale: στεφανόω የዘውድና የድል ምስል አለው፤ ‘ተቀዳጀ’ የመክበርንና የከፍታን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὅπως
  choice: ይህም … እንዲ… ነው
  rationale: የዓላማ ወይም የውጤት ግንኙነቱን በግልጽ አማርኛ ያስቀምጣል።
- source_word: χωρὶς θεοῦ
  choice: ከእግዚአብሔር ውጭ
  rationale: የቀረበው SBLGNT ጽሑፍ χωρὶς θεοῦ ስለሚል ይህ ንባብ በዋናው ጽሑፍ ተከትሏል። ‘ውጭ’ የ‘ተለይቶ’ ትርጓሜን በግድ ሳይጭን የግሪኩን እውነተኛ አሻሚነት በተቻለ መጠን ይጠብቃል።
- source_word: ὑπὲρ παντός
  choice: ለሁሉም ሰው
  rationale: በዐውዱ ὑπέρ የወካይነትን ሐሳብ፣ παντόςም እያንዳንዱን ሰው በአጠቃላይ ያመለክታል።
- source_word: γεύσηται θανάτου
  choice: ሞትን እንዲቀምስ
  rationale: የግሪኩን ዘይቤ በቀጥታ የሚጠብቅና በአማርኛም ሊገባ የሚችል አገላለጽ ነው።
theological_decisions:
- issue: በዓላማው ሐረግ ያለው የጽሑፍ ልዩነት
  choice: ከእግዚአብሔር ውጭ
  alternative: በእግዚአብሔር ጸጋ
  rationale: የተሰጠው ዋና የግሪክ ጽሑፍ χωρὶς θεοῦ (‘ከእግዚአብሔር ውጭ’) ይላል፤ χάριτι θεοῦ (‘በእግዚአብሔር ጸጋ’) የሚለው ግን ጥንታዊና ሰፊ ምስክርነት ያለው አማራጭ ንባብ ነው። ከምንጩ በመነሳት የመጀመሪያው በዋና ጽሑፍ፣ ሌላው ደግሞ በማስታወሻ ቀርቧል።
