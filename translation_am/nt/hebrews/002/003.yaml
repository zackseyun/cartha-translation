  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: am
  text: እንዲህ ያለውን ታላቅ ድነት ቸል ብንል፣ እኛ እንዴት እናመልጣለን? መጀመሪያ በጌታ አማካይነት መነገር የጀመረው ይህ ድነት[a]፣ እርሱን በሰሙት ሰዎች ለእኛ ተረጋገጠ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህ ድነት፣ መጀመሪያ በጌታ አማካይነት ተነግሮ፣ እርሱን በሰሙት ሰዎች ለእኛ ተረጋገጠ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς … ἐκφευξόμεθα
  choice: እኛ እንዴት እናመልጣለን?
  rationale: የግሪኩን የወደፊት ጊዜ ጥያቄና የማስጠንቀቂያ ኃይል ሳይቀይር ይጠብቃል።
- source_word: τηλικαύτης … σωτηρίας
  choice: እንዲህ ያለውን ታላቅ ድነት
  rationale: τηλικαύτης የሚያሳየውን ታላቅነትና አጽንኦት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ σωτηρία ደግሞ የመዳንንና የመታደግን ሐሳብ በሚይዘው «ድነት» ተተርጉሟል።
- source_word: ἀμελήσαντες
  choice: ቸል ብንል
  rationale: የግሪኩን ተሳቢ አንቀጽ በዐውዱ ያለውን ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: መጀመሪያ … መነገር ጀምሮ
  rationale: «መጀመሪያን ተቀብሎ» የሚለውን ፈሊጣዊ አገላለጽ የጅማሬ ትርጉሙንና የስሜት ተደራጊነቱን በማቆየት ይተረጉማል።
- source_word: διὰ τοῦ κυρίου
  choice: በጌታ በኩል
  rationale: διά ከባለቤት አገባብ ጋር ያለውን የአማካይነት ወይም የወኪልነት ሐሳብ ይጠብቃል፤ κύριος ደግሞ በተለመደው «ጌታ» ተተርጉሟል።
- source_word: ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη
  choice: እርሱን በሰሙት ሰዎች ለእኛ ተረጋገጠ
  rationale: የተደራጊ አወቃቀሩን ይጠብቃል፤ በዐውዱ የተገነዘበውን የመስማት ተሳቢ «እርሱን» ለግልጽነት ይጨምራል፤ εἰς ἡμᾶς ያለውን አቅጣጫ «ለእኛ» ይገልጻል።
theological_decisions:
- issue: የ«ጌታ» (τοῦ κυρίου) ዋቢ
  choice: መጀመሪያ ድነቱን የተናገረውን ኢየሱስን ያመለክታል።
  alternative: በአጠቃላይ እግዚአብሔርን እንደ ጌታ ማመልከት።
  rationale: ቀጥሎ ያለው «እርሱን በሰሙት» የሚለው አገላለጽና የዕብራውያን 2፥3-4 ዐውድ የኢየሱስን ምድራዊ አዋጅና የሰሚዎቹን ምስክርነት ያመለክታሉ።
- issue: የማስጠንቀቂያው ጥያቄ ኃይል
  choice: ንግግሩ እንደ ርቱዕ የማስጠንቀቂያ ጥያቄ ተጠብቋል።
  alternative: «በፍጹም አናመልጥም» ብሎ ወደ ግልጽ መግለጫ መቀየር።
  rationale: ግሪኩ የወደፊት ጊዜ ጥያቄን ይጠቀማል፤ የጥያቄውን ቅርጽ ማቆየት የጽሑፉን ውጥረትና ማስጠንቀቂያ ሳይፈታ ይጠብቃል።
- issue: የἥτις አወቃቀር
  choice: ለግልጽነት «ይህ ድነት» ተብሎ ዋቢው ተደግሟል።
  alternative: ከመጀመሪያው ጥያቄ ጋር «ይህም/እርሱም» በሚል አንጻራዊ አወቃቀር ማያያዝ።
  rationale: ይህ ምርጫ ዋቢውን ግልጽ ሲያደርግ የግሪኩን ገላጭ አንጻራዊ ሐረግ በአዲስ ዓረፍተ ነገር ያቀርባል፤ ሌላው አወቃቀር በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ቸል ብንል» ተፈጥሯዊ ሲሆን የማስጠንቀቂያውን ክብደት ይጠብቃል፤ «መነገር ጀምሮ» ደግሞ ትንሽ መደበኛ ቢሆንም የግሪኩን የጅማሬና የተደራጊነት አወቃቀር ለማቆየት ተመርጧል።
