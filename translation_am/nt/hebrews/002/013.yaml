  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: am
  text: እንደገናም፣ “እኔ በእርሱ እተማመናለሁ”[a]። እንደገናም፣ “እነሆ፣ እኔና እግዚአብሔር የሰጠኝ ልጆቹ”[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በእርሱ ተማምኜ እኖራለሁ” ወይም “በእርሱ እርግጠኛ እሆናለሁ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪኩ የዚህ ንግግር ተናጋሪ በስም አልተጠቀሰም፤ በአውዱ ግን የዕብራውያን መልእክት እነዚህን ጥቅሶች ለወልድ ያውላቸዋል።
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: ደግሞም / እንደገናም
  rationale: የሌላ ጥቅስ መግቢያ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ የሌለውን ‘እንዲህ ይላል’ አይጨምርም።
- source_word: Ἐγὼ
  choice: እኔ
  rationale: ግልጽ የመጀመሪያ መደብ ተውላጠ ስም በጥቅሱ ያለውን አጽንዖት ለማስጠበቅ ተተርጉሟል።
- source_word: ἔσομαι πεποιθὼς
  choice: እተማመናለሁ
  rationale: ወደፊት የሚኖር የተረጋጋ መታመንን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል፤ የቅርጹ ሰፋ ያለ ትርጉም በማስታወሻው ተጠብቋል።
- source_word: ἐπ’ αὐτῷ
  choice: በእርሱ
  rationale: ከመታመን ግስ ጋር ተፈጥሯዊ የሆነውን የአማርኛ አገባብ ይጠቀማል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የጥቅሱን ከፍ ያለ ዘይቤና ትኩረት ሰጪ ኃይል ይጠብቃል።
- source_word: τὰ παιδία
  choice: ልጆች
  rationale: በጥቅሱ ያለውን የዝምድና ትርጉም በሰፊና ተፈጥሯዊ ቃል ያቀርባል።
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: እግዚአብሔር የሰጠኝ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ ሳይጨምር በተፈጥሯዊ የአማርኛ ዝምድና ሐረግ ይተረጉማል።
- source_word: ὁ θεός
  choice: እግዚአብሔር
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውና የተከበረው የθεός ትርጉም ነው።
theological_decisions:
- issue: የጥቅሱ ተናጋሪና ክርስቶሎጂያዊ አተገባበሩ
  choice: የብሉይ ኪዳን ጥቅሶቹን በመጀመሪያ መደብ ንግግር አቅርቦ ተናጋሪውን በዋናው ጽሑፍ አለመጥቀስ
  alternative: ‘እርሱ ይላል’ ወይም ‘መሲሑ ይላል’ ብሎ መጨመር
  rationale: የዕብራውያን መልእክት ጥቅሶቹን ለወልድ ያውላቸዋል፤ ይሁን እንጂ በዚህ ጥቅስ የግሪኩ ጽሑፍ ተናጋሪውን በስም አይጠቅስም። ስለዚህ ትርጉሙ የአውዱን ክርስቶሎጂያዊ አተገባበር ሳይክድ ያልተጻፈ መለያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “እነሆ” የጥቅሱን ከፍ ያለ ዘይቤ ሲጠብቅ፣ የቀረው አገባብ ለዘመናዊ አንባቢ ተፈጥሯዊ እንዲሆን ተደርጓል።
