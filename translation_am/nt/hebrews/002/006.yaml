    reason: lexical_alternative
  - marker: b
    text: እዚህ «የሰው ልጅ» የሚለው ከመዝሙር 8፥4 የተወሰደ ሲሆን፣ በመዝሙሩ ውስጥ ሰውን በአጠቃላይ የሚገልጽ ግጥማዊ አገላለጽ ነው፤ በዕብራውያን ሰፊ አውድ ግን ጥቅሱ ለኢየሱስ ያለው አንድምታም ይገለጣል።
    reason: cross_reference
  - marker: c
    text: ወይም፣ «እርሱን ትጎበኘዋለህ?» ወይም «እርሱን ታስተዳድረዋለህ?» የግሪኩ ግስ በመጎብኘት ወይም በመንከባከብ የሚገለጥን ትኩረት ያለው አሳቢነት ሊያመለክት ይችላል።
