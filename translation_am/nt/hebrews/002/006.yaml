  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: am
  text: 'ነገር ግን አንድ ሰው በአንድ ስፍራ እንዲህ ሲል መስክሯል፦


    “ሰው ምንድር ነውና

    እርሱን ታስባለህ?[a]

    ወይስ የሰው ልጅ ምንድር ነውና

    እርሱን ትንከባከባለህ?[c][b]”'
  philosophy: optimal-equivalence
  footnotes:
