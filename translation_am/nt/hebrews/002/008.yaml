source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: am
  text: “ሁሉን ከእግሮቹ በታች አስገዛህ።” ሁሉን ለእርሱ[a] በማስገዛቱ፣ ለእርሱ ያልተገዛ ምንም አላስቀረም[b]። አሁን ግን ሁሉም ነገሮች ለእርሱ ተገዝተው ገና አናያቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እግሮቹ” እና “ለእርሱ” የሚሉት ተውላጠ ስሞች መዝሙር 8ን ያስተጋባሉ። በመዝሙሩ የመጀመሪያ አውድ ሰውን ሊያመለክቱ ይችላሉ፤ ዕብራውያን በሚያደርገው አተገባበር ግን ኢየሱስንም ሊያመለክቱ ይችላሉ።
    reason: የተውላጠ ስሞቹን ሆን ተብሎ ያልተወሰነ ማጣቀሻ ለመጠበቅ።
  - marker: b
    text: ወይም፣ “ሁሉን ለእርሱ ባስገዛ ጊዜ።” የግሪኩ አባባል በጊዜያዊ አገባብም ሊተረጎም ይችላል።
    reason: የἐν τῷ ... ὑποτάξαι ጊዜያዊ የትርጉም አማራጭን ለማሳየት።
lexical_decisions:
- source_word: πάντα
  choice: ሁሉን / ሁሉ
  rationale: ነገሮችን ብሎ ሳይገድብ የግሪኩን ሁሉን አቀፍ ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπέταξας
  choice: አስገዛህ
  rationale: የማስገዛትንና ከሥልጣን በታች የማድረግን ትርጉም ይጠብቃል፤ የሁለተኛ መደብ ነጠላ ግስም ግልጽ ነው።
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: ከእግሮቹ በታች
  rationale: የመዝሙር 8ን የግዛትና የመገዛት ምሳሌያዊ አነጋገር በቀጥታ ይጠብቃል።
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: ባስገዛ ጊዜ
  rationale: የግሪኩን ጊዜያዊ ንባብ በተፈጥሯዊ አማርኛ ያቀርባል፤ መዋቅሩ እንደ ሁኔታ ወይም እንደ ድርጊት አውድም ሊገባ እንደሚችል በማስታወሻው ተጠብቋል።
- source_word: οὐδὲν ἀφῆκεν
  choice: ምንም አላስቀረም
  rationale: ከማስገዛቱ ውጭ የቀረ አንዳችም እንደሌለ በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ἀνυπότακτον
  choice: ያልተገዛ
  rationale: በቁጥሩ ውስጥ የተደጋገመውን ὑποτάσσω የቃል ሥር በ‘መገዛት’ በተመሳሳይ ቃል ይጠብቃል።
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: አሁን ግን ... ገና አናይም
  rationale: በተገለጠው ሁሉን አቀፍ መገዛትና አሁን በሚታየው ሁኔታ መካከል ያለውን ንፅፅርና ‘ገና’ የሚለውን የወደፊት ጉጉት ያስተላልፋል።
- source_word: ὑποτεταγμένα
  choice: ተገዝቶ
  rationale: የተፈጸመ ድርጊት ውጤት የሆነውን የመገዛት ሁኔታ ያሳያል።
theological_decisions:
- issue: የαὐτοῦ / αὐτῷ ተውላጠ ስሞች ማጣቀሻ
  choice: ‘እግሮቹ’ እና ‘ለእርሱ’ ተብለው ያለ ስም ማብራሪያ ተተርጉመዋል።
  alternative: በትርጉሙ ውስጥ ‘ለሰው’ ወይም ‘ለኢየሱስ’ ብሎ በግልጽ መወሰን።
  rationale: መዝሙር 8 በመጀመሪያ አውዱ የሰውን ልጅ ሲመለከት፣ የዕብራውያን መልእክት ግን ንባቡን ወደ ኢየሱስ ያደርሳል። ተውላጠ ስሞቹን መጠበቅ ይህን አሳባዊ ውጥረት ያለ ጊዜው አይፈታውም።
- issue: በአሁኑ ጊዜ ሁሉ ተገዝቶ አለመታየቱ
  choice: የጽሑፉ ንፅፅር ‘አሁን ግን ... ገና አናይም’ ተብሎ ተጠብቋል።
  alternative: የመገዛቱን አፈጻጸም በትርጉም ውስጥ በመለኮታዊ ማብራሪያ መፍታት።
  rationale: ጥቅሱ በተነገረው ሁሉን አቀፍ ሥልጣንና ገና በማይታየው ፍጻሜ መካከል ያለውን ውጥረት ራሱ እንዲቆይ ይጠይቃል።
