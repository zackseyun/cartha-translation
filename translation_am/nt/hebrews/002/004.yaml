lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: አብሮ መስክሯል
  rationale: የσυν- አብሮነትን እና የἐπιμαρτυρέω ማረጋገጫ ምስክርነትን ያስቀራል፤ በአማርኛም ከቀደመው አውድ ጋር ተያይዞ ተፈጥሯዊ ነው።
- source_word: σημείοις
  choice: በምልክቶች
  rationale: የመሣሪያ ወይም የአማካይነት ዳቲቭን በ‘በ-’ ያሳያል፤ የማስረጃ ተግባሩንም ይጠብቃል።
- source_word: τέρασιν
  choice: በድንቅ ነገሮች
  rationale: አድናቆትና ድንጋጤ የሚያስከትሉ ድርጊቶችን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ποικίλαις δυνάμεσιν
  choice: በተለያዩ ተአምራት
  rationale: ποικίλαιςን ‘ተለያዩ’ ብሎ ያቀርባል፤ δυνάμεσιν በዚህ የምልክትና የድንቅ ነገር አውድ የኃይል መገለጫ የሆኑ ተአምራትን ያመለክታል።
- source_word: πνεύματος ἁγίου
  choice: የመንፈስ ቅዱስ
  rationale: የግሪኩን ጄኒቲቭ ግንኙነትና የተለመደውን መለኮታዊ ስያሜ ይጠብቃል።
- source_word: μερισμοῖς
  choice: ክፍፍሎች
  rationale: መከፋፈልን ወይም የተሰጡ ድርሻዎችን የሚያመለክተውን ቃል በቀጥታ ይወክላል፤ በግሪኩ የሌለውን ‘ስጦታዎች’ አይጨምርም።
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: እንደ ፈቃዱ
  rationale: ከፈቃዱ ጋር ያለውን መስማማት በተፈጥሯዊ አማርኛ ያሳያል፤ ተውላጠ ስሙም በአውዱ በተፈጥሮ ወደ እግዚአብሔር ይመለሳል።
theological_decisions:
- issue: ‘እንደ ፈቃዱ’ በሚለው ውስጥ የተውላጠ ስሙ ተመላሽ
  choice: ወደ እግዚአብሔር እንደሚመለስ ተተርጉሟል።
  alternative: በሰፊ አነባበብ ወደ መንፈስ ቅዱስ ሊመለስ ይችላል።
  rationale: የአረፍተ ነገሩ ተቆጣጣሪ ባለቤት ‘እግዚአብሔር’ ነው፤ ስለዚህ αὐτοῦ በተፈጥሮ ወደ እርሱ ይመለሳል።
- issue: πνεύματος ἁγίου እንደ መለኮታዊ ስያሜ መተርጎም
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ
  rationale: ‘መንፈስ ቅዱስ’ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደና የተከበረ ስያሜ ሲሆን ተጨማሪ የአንድ ወገን ትምህርት አያስገባም።
