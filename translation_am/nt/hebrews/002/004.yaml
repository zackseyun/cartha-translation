    text: ወይም፣ “በተለያዩ ኃይሎች” ወይም “በተለያዩ የኃይል ሥራዎች።” የግሪኩ ቃል የኃይል መገለጫዎችን፣ በዚህ አውድ ደግሞ ተአምራዊ ሥራዎችን ሊያመለክት ይችላል።
