  text: እግዚአብሔርም በምልክቶች፣ በድንቅ ነገሮች፣ በተለያዩ ተአምራት[a] እና በመንፈስ ቅዱስ ድርሻዎች[b] እንደ ፈቃዱ አብሮ እየመሰከረ ነበር።
  philosophy: optimal-equivalence
  footnotes:
