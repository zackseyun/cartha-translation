- source_word: πάντες
  choice: ሁሉ ... ናቸው
  rationale: የተቀደሱትንና የሚቀድሰውን በአንድነት የሚያካትተውን አጽንዖት በተፈጥሯዊ አማርኛ ይገልጻል።
