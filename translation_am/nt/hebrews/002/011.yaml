  rationale: የቅርብ ዐውዱ የሚቀድሰውን ከወልድ/ከኢየሱስ ጋር ያያይዛል፤ ἐξ ἑνὸς ግን ‘አንዱ’ እግዚአብሔር፣ አዳም፣ አብርሃም ወይም አንድ የጋራ የሰው ዘር መሆኑን አይወስንም።
