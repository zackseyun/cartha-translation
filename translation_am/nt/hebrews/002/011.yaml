  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ይቀድሳል/ይቀደሳሉ’ የሚለው የተለመደ መጽሐፍ ቅዱሳዊ ቃል ተጠብቆ፣ የምንጩ ተመሳሳይ ሥር ቃልና የአሁን ጊዜ ገጽታ በተቻለ መጠን ተንጸባርቋል።
