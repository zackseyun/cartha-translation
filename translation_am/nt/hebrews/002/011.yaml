- source_word: οὐκ ἐπαισχύνεται
  choice: አያፍርም
  rationale: የክብርና የእፍረት ትርጉሙን ያለ ትርፍ ማብራሪያ በቀጥታ ይጠብቃል።
- source_word: ἀδελφοὺς
  choice: ወንድሞች
