theological_decisions:
- issue: በδουλείας የተገለጸው ባርነት ምንነት
  choice: ጥቅሱ ከሞት ፍርሃት ጋር የተያያዘ እውነተኛ ባርነትን ይገልጻል፤ ትርጉሙ ይህን ከዚያ የጠበበ የእምነት ሥርዓት ገለጻ ጋር አያመሳስለውም።
  alternative: ለዲያብሎስ ባርነት፣ ለኃጢአት ባርነት፣ ወይም በሟችነት ሥር ያለ የህልውና ፍርሃት ብሎ በግልጽ መተርጎም።
  rationale: ቁጥር 14 ዲያብሎስንና የሞትን ኃይል ቢጠቅስም፣ ቁጥር 15 ራሱ ሁኔታውን «ሞትን በመፍራት…ለባርነት ተገዢ» ብሎ በአጠቃላይ ይገልጻል። ስለዚህ ከጽሑፉ የበለጠ የተወሰነ ዶክትሪናዊ ማብራሪያ አልገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቁጥር 15 አገባብ ከቁጥር 14 ጋር የተያያዘ የዓላማ ሐረግ መሆኑን «እንዲያወጣ» ጠብቋል።
