  rationale: τούτους ከὅσοι ጋር በመያያዝ የተገለጸውን ሁኔታ የሚያሟሉትን ሰዎች በሙሉ ያመለክታል፤ ይህ አገላለጽ የክፍል-አካታችነቱን ኃይል ይጠብቃል።
- source_word: φόβῳ θανάτου
  choice: ሞትን በመፍራት
  rationale: የግሪኩ ዳቲቭ ምክንያታዊ ወይም መሣሪያዊ ጥላ ትርጉም ሊኖረው ይችላል፤ «በመፍራት» ሁለቱንም ሳያጠብ ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: διὰ παντὸς τοῦ ζῆν
