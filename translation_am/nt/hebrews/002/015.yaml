  rationale: ἔνοχος ተገዢ፣ ተይዞ ወይም ተጠያቂ መሆንን ሊገልጽ ይችላል። ከδουλείας ጋር «ለባርነት ተገዢ» በባርነት ሥር የመሆንን እውነተኛ ሁኔታ ይገልጻል፣ የሕግ ተጠያቂነት ብቻ እንደሆነም አያቀርበውም።
- source_word: δουλείας
  choice: ባርነት
  rationale: ቃሉ የተገደደ ተገዢነትን፣ ባርያ መሆንን ይገልጻል፤ «ባርነት» የምስሉን ክብደት በግልጽ ይጠብቃል።
