  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: am
  text: በዚህም[a] ምክንያት፣ ስለ ሕዝቡ እንደሚያቀርብ ሁሉ፣ እንዲሁም ስለ ራሱ ስለ ኃጢአቶች ማቅረብ አለበት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በእርሷ ምክንያት” ማለት ነው፤ ይህም በቀደመው ቁጥር የተጠቀሰውን የሊቀ ካህኑን ድካም ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: በዚህም ምክንያት
  rationale: የδιά ከተሳቢ ጋር ያለውን ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ተውላጠ ስሙ የሚያመለክተውን ነገር በዋናው ጽሑፍ ከልክ በላይ አይወስንም።
- source_word: ὀφείλει
  choice: ማቅረብ አለበት
  rationale: የክህነት ግዴታን እንጂ ተራ ምክርን አይገልጽም።
- source_word: καθὼς ... οὕτως καὶ
  choice: እንደሚያቀርብ ሁሉ ... ስለ ራሱም
  rationale: የግሪኩን ተዛማጅ ንጽጽር በተነባቢ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: τοῦ λαοῦ
  choice: ስለ ሕዝቡ
  rationale: በዐውዱ የቃል ኪዳኑን ሕዝብ ያመለክታል፤ “እስራኤል” የሚል ማብራሪያ በዋናው ጽሑፍ አልተጨመረም።
- source_word: περὶ αὑτοῦ
  choice: ስለ ራሱም
  rationale: የመልሶ አመልካቹን ትርጉም በተፈጥሯዊና አጭር አማርኛ ይገልጻል።
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: ስለ ኃጢአቶች ማቅረብ
  rationale: በግሪኩ ግልጽ ቀጥተኛ ተሳቢ ስለሌለ “መሥዋዕት” ወይም “የኃጢአት መሥዋዕት” በዋናው ጽሑፍ አልተጨመረም፤ የመሥዋዕት አውዱ ግን ከአንቀጹ ግልጽ ነው።
theological_decisions:
- issue: “በዚህም ምክንያት” የሚለው የሚያመለክተው
  choice: በቁጥር 2 የተጠቀሰውን የሊቀ ካህኑን ድካም እንደሚያመለክት በማስታወሻ ማብራራት
  alternative: በአጠቃላይ የክህነት ሹመቱን ወይም ሁኔታውን እንደሚያመለክት መውሰድ
  rationale: በሰዋስውና በአውድ በጣም ቅርብ ያለው መወከሻ በቀደመው ቁጥር ያለው ἀσθένεια፣ “ድካም” ነው፤ ሆኖም ዋናው ጽሑፍ መወከሻውን በግልጽ ስም በመተካት አይወስነውም።
- issue: ከπροσφέρειν ጋር የመሥዋዕት ስም መጨመር
  choice: ግልጽ ተሳቢ ሳይጨመር “ማቅረብ” ብሎ መተርጎም
  alternative: “መሥዋዕት ማቅረብ” ብሎ የአውዱን ነገር ግልጽ ማድረግ
  rationale: የመሥዋዕት ድርጊት በአውዱ ግልጽ ቢሆንም፣ በዚህ ቁጥር ግሪኩ ቀጥተኛ ተሳቢ አልጠቀሰም። ይህን መተው የምንጩን አጭርነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽርና የግዴታ ኃይል ተጠብቋል፤ በምንጩ ያልተገለጸ የመሥዋዕት ስም አልተጨመረም።
