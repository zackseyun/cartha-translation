  rationale: ግሪኩ በቀጥታ ‘መታዘዝን ተማረ’ ይላል። ትርጉሙ ይህን የሥነ መለኮት ውጥረት በትርጓሜ ሳይፈታው ይጠብቃል፤ ማብራሪያው ግን ይህ በመከራ በተግባር የተለማመደ መታዘዝ እንጂ ከቀድሞ አለመታዘዝ መታረም እንዳልሆነ ያሳያል።
