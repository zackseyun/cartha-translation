  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: am
  text: 'እንደዚሁም መሲሑ ሊቀ ካህናት ለመሆን ራሱን አላከበረም፤[a] ይልቁንም፣


    “አንተ ልጄ ነህ፤


    እኔ ዛሬ ወልጄሃለሁ”[b]


    ብሎ ለእርሱ የተናገረው አከበረው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ራሱን አላከበረም” ወይም “ለራሱ ክብርን አልወሰደም።” የግሪኩ ግስ ማክበርን ወይም ክብር መስጠትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ከመዝሙር 2፥7 የተወሰደ ጥቅስ።
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: እንደዚሁም
  rationale: ከቀደመው ስለ ክህነት ሹመት የተነገረው ጋር ያለውን ንጽጽርና ተያያዥነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ Χριστὸς
  choice: መሲሑ
  rationale: በዚህ አውድ ቃሉ እንደ ግል ስም ሳይሆን እንደ ማዕረግ ይሠራል፤ የግሪኩን ‘የተቀባው’ ማዕረጋዊ ስሜት ይጠብቃል።
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: ራሱን አላከበረም
  rationale: δοξάζω በዚህ የሹመት አውድ ‘ክብር መስጠት/ማክበር’ የሚለውን ስሜት ይዟል፤ የአማርኛው ‘ራሱን አላከበረም’ ነጸብራቃዊውን አገባብ በግልጽነት ያቆያል።
- source_word: γενηθῆναι ἀρχιερέα
  choice: ሊቀ ካህናት ለመሆን
  rationale: ወደ ሥልጣን ወይም ሚና መግባትን የሚያመለክተውን γενηθῆναι በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: ነገር ግን … ያለው እርሱን አከበረው
  rationale: ግሪኩ በንጽጽሩ ውስጥ የሚታወቀውን ግስ ትቶታል። አማርኛው የአንቀጹን ንጽጽር ግልጽ ለማድረግ ‘አከበረው’ ብሎ ያሟላዋል፤ ‘ያለው’ ደግሞ የተሳቢውን አወቃቀር ይጠብቃል።
- source_word: Υἱός μου εἶ σύ
  choice: አንተ ልጄ ነህ
  rationale: የግሪኩን አጽንዖት በተፈጥሯዊና ክቡር የአማርኛ አነጋገር ያቀርባል።
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: ዛሬ ወልጄሃለሁ
  rationale: γεννάω የሚለውን ቃልና የመዝሙር 2፥7ን ጥቅስ በቀጥታ ይጠብቃል፤ ዙፋናዊ፣ ትንሣኤያዊ ወይም ሌላ ሥነ መለኮታዊ ትርጓሜ አይጨምርበትም።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ ከመለኮታዊ ሹመት ጋር የተያያዘ ማዕረግ ስለሆነ ‘መሲሑ’ የማዕረጉን ስሜት በግልጽ ይጠብቃል።
- issue: ‘ዛሬ ወልጄሃለሁ’ የሚለው ክርስቶሎጂያዊ ጥቅስ
  choice: ጥቅሱን ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ማቆየት
  alternative: በዋናው ጽሑፍ ውስጥ ዙፋን መውጣትን፣ ትንሣኤን ወይም ዘላለማዊ መወለድን የሚወስን ሐረግ መጨመር
  rationale: ዕብራውያን መዝሙር 2፥7ን ይጠቅሳል። ትርጉሙ ጥቅሱ ያለውን የሥነ መለኮት ውጥረትና ክፍትነት ጠብቆ፣ በኋላ የተነሱ ክርክሮችን በጽሑፉ ላይ አይጫንም።
- issue: በἀλλ’ ὁ λαλήσας ውስጥ ያለው የተተወ ግስ
  choice: ‘ያለው እርሱን አከበረው’ ብሎ ማሟላት
  alternative: ‘ነገር ግን ያለው’ ብቻ ብሎ መተው
  rationale: የግሪኩ አገባብ ከ‘ራሱን አላከበረም’ የሚገባውን ተቃራኒ ሐሳብ በመተው ያሳያል። በአማርኛ ያለ ግስ አሻሚና ያልተሟላ ስለሚሆን ከአውዱ የተገኘው ግስ ተጨምሯል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሊቀ ካህናት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የጥቅሱ ቅኔያዊ አቀራረብም በመስመር ክፍፍል ታይቷል።
