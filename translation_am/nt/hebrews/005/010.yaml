  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: am
  text: እግዚአብሔርም በመልከ ጼዴቅ ሥርዓት መሠረት ሊቀ ካህናት ብሎ ሰየመው[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔር ሊቀ ካህናት ብሎ ጠራው” ወይም “እግዚአብሔር ሊቀ ካህናት አድርጎ ሾመው።”
    reason: lexical_alternative
  - marker: b
    text: ይህ አባባል “በመልከ ጼዴቅ ሥርዓት” ስለሆነው ክህነት የሚናገረውን መዝሙር 110፥4ን ያስተጋባል።
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: ሰየመው
  rationale: የግሪኩ አኦሪስት ተደራጊ አካፋይ እግዚአብሔር ኢየሱስን በይፋ ሊቀ ካህናት ብሎ መጥራቱን ወይም መሰየሙን ያሳያል። አማርኛው በአድራጊ አገባብ ቢቀርብም መለኮታዊውን ድርጊትና የግሱን መጥራት/መሰየም ትርጉም ይጠብቃል፤ ‘ሾመው’ ከግሱ በላይ የሹመት ሥነ ሥርዓት ሊያመለክት ስለሚችል በግርጌ ማስታወሻ ብቻ ቀርቧል።
- source_word: ὑπὸ τοῦ θεοῦ
  choice: እግዚአብሔርም
  rationale: ὑπό ከዘር አመልካች ጋር በተደራጊው አገባብ የድርጊቱን አድራጊ ያሳያል። ጽሑፉ ‘እግዚአብሔር’ ብቻ ስለሚል ‘አብ’ የሚለው አልተጨመረም።
- source_word: ἀρχιερεὺς
  choice: ሊቀ ካህናት
  rationale: በዘመናዊ መደበኛ አማርኛ የከፍተኛውን የክህነት ማዕረግ በግልጽና በክብር የሚገልጽ የተለመደ አቻ ቃል ነው።
- source_word: κατὰ
  choice: መሠረት
  rationale: በዚህ ሐረግ κατά መስማማትን ወይም ከአንድ ንድፍ/ሥርዓት ጋር መጣጣምን ያሳያል፤ ‘በ…መሠረት’ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τὴν τάξιν
  choice: ሥርዓት
  rationale: በዕብራውያንና በመዝሙር 110፥4 አውድ τάξις ተራን ብቻ ሳይሆን የክህነት ዓይነትን፣ ንድፍን ወይም ሥርዓትን ያመለክታል። ‘ሥርዓት’ ይህን ሰፊ ትርጉምና የመዝሙሩን ትይዩነት ይጠብቃል።
- source_word: Μελχισέδεκ
  choice: መልከ ጼዴቅ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ፊደላዊ ቅርጽ ይከተላል።
theological_decisions:
- issue: አካፋዩ የማንነት ለውጥን ወይስ መለኮታዊ ስያሜ/መግለጫን እንደሚያመለክት
  choice: እግዚአብሔር…ሊቀ ካህናት ብሎ ሰየመው
  alternative: እግዚአብሔር…ሊቀ ካህናት አድርጎ ሾመው
  rationale: ‘ሰየመው’ ኢየሱስ ሊቀ ካህናት መባሉን/መገለጹን ያሳያል፤ ግሱ በግልጽ ከሚለው በላይ የተቋማዊ ሹመት ሐሳብን አያስገባም። የ‘ጠራው’ እና የ‘ሾመው’ አማራጮች በማስታወሻው ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተደራጊ አገባብ በአማርኛ ተፈጥሯዊ ለመሆን እግዚአብሔርን እንደ አድራጊ በማቅረብ ተተርጉሟል፤ የቀዳሚው ቁጥር ዐረፍተ ነገር ቀጣይነት በ‘ም’ ተጠብቋል።
