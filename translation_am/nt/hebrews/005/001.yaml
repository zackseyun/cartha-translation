id: HEB.5.1
reference: Hebrews 5:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: am
  text: ምክንያቱም ሊቀ ካህናት ሁሉ ከሰዎች መካከል ተወስዶ፣ ለሰዎች ሲል ከእግዚአብሔር ጋር በተያያዙ ጉዳዮች ይሾማል፤ ይህም ስለ ኃጢአቶች ስጦታዎችንና መሥዋዕቶችን እንዲያቀርብ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: ሁሉ
  rationale: ከነጠላው ‘ሊቀ ካህናት’ ጋር የተጠቀሰውን አከፋፋይ አጠቃላይነት፣ ‘ሊቀ ካህናት ሁሉ’ በሚል ተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: γὰρ
  choice: የዐውደ ንባቡ የማብራሪያ ግንኙነት
  rationale: γὰρ ከቀደመው ሐሳብ ጋር የሚፈጥረው የማብራሪያ ግንኙነት በአማርኛው የንግግር ፍሰት በቀጥታ ተገልጧል፤ ‘ምክንያቱም’ ማለት እዚህ ከባድና ያልተፈጥሯዊ ይሆናል።
- source_word: ἀρχιερεὺς
  choice: ሊቀ ካህናት
  rationale: በአይሁድ የክህነት ሥርዓት ያለውን ልዩ ሹመት የሚገልጽ የተለመደና ትክክለኛ ቃል ነው።
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: ከሰዎች መካከል ተመርጦ
  rationale: የተደራጊውን አኳኋን ይጠብቃል፤ በዐውደ ንባቡም λαμβανόμενος ለክህነት ከሰዎች መካከል መወሰድን ስለሚያመለክት ‘ተመርጦ’ ተፈጥሯዊ ነው። ἄνθρωποι በአማርኛ ‘ሰዎች’ ተብሎ የሰውን ዘር በአጠቃላይ ያመለክታል።
- source_word: ὑπὲρ ἀνθρώπων
  choice: ስለ ሰዎች
  rationale: ὑπέρ የሚያሳየውን ለሰዎች ጥቅምና በእነርሱ ወክሎ የመሥራት ሐሳብ በዚህ ዐውደ ንባብ ይይዛል።
- source_word: καθίσταται
  choice: ይሾማል
  rationale: አንድ ሰው በክህነት ሹመት እንደሚቀመጥ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ πρὸς τὸν θεόν
  choice: በእግዚአብሔር ፊት ባሉ ጉዳዮች
  rationale: ቃላቱ ከእግዚአብሔር ጋር የተያያዙትን የአምልኮና የክህነት ጉዳዮች ያመለክታሉ፤ ‘በእግዚአብሔር ፊት’ ደግሞ የሊቀ ካህኑን ውክልና በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: ἵνα προσφέρῃ
  choice: እንዲያቀርብ ነው
  rationale: ἵνα የሚገልጸውን የዓላማ ግንኙነት በግልጽ ይጠብቃል።
- source_word: δῶρά τε καὶ θυσίας
  choice: ስጦታዎችንና መሥዋዕቶችን
  rationale: ሁለቱንም የአምልኮ መባዎች ሳያዋህድ ያቆያል፤ τε καὶ በ‘-ንና’ በተፈጥሯዊነት ተገልጧል።
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: ስለ ኃጢአቶች
  rationale: በመሥዋዕት ዐውድ መባዎቹ ከኃጢአቶች ጋር በተያያዘ እንደሚቀርቡ ያሳያል፣ የአማርኛውንም መጽሐፍ ቅዱሳዊ አጠቃቀም ይከተላል።
theological_decisions:
- issue: በἀνθρώπων ያለው ወካይ የጾታ አገላለጽ
  choice: ሁለቱንም ἀνθρώπων ‘ሰዎች’ ብሎ መተርጎም
  alternative: ‘ወንዶች’ ወይም ‘ሰዎች—ወንዶች’ ማለት
  rationale: ἄνθρωπος በብዙ ቁጥር እዚህ የሰውን ዘር በአጠቃላይ ሊያመለክት ይችላል፤ አማርኛው ‘ሰዎች’ ይህን ትርጉም በትክክል ይይዛል። ሊቀ ካህኑ ከሰው ወገን መሆኑንና ሰዎችን ወክሎ መሾሙን ሳያጠብ ያቀርባል፤ ‘ወንዶች’ ማለት ግን በዐውደ ንባቡ ካለው በላይ ጾታን ሊያጠናክር ይችላል።
- issue: τὰ πρὸς τὸν θεόν የሚያመለክተው የሊቀ ካህኑ ሚና
  choice: ‘በእግዚአብሔር ፊት ባሉ ጉዳዮች’ ብሎ የውክልናውንና የአምልኮውን ዐውድ መግለጽ
  alternative: ‘እግዚአብሔርን በሚመለከቱ ነገሮች’
  rationale: የግሪኩ ሐረግ ሰፊ ሲሆን የአምልኮና የክህነት አገልግሎትን ይጨምራል። ትርጉሙ ይህን ስፋት ሳይዘጋ ሊቀ ካህኑ ለሰዎች በእግዚአብሔር ፊት እንደሚያገለግል ያሳያል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ‘ሊቀ ካህናት’፣ ‘መሥዋዕት’ እና ‘ኃጢአት’ የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ስለሆኑ ተጠብቀዋል። በአማርኛ ‘ሰዎች’ የግሪኩን አጠቃላይ ἀνθρώπων በቀጥታ ስለሚወክል የጾታ አማራጭ ማስታወሻ አላስፈለገም።
