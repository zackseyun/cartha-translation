base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: am
  text: 'ነገር ግን ጠንካራ ምግብ ለበሰሉት ነው፤ እነርሱም በልምምድ[a] መልካሙንና ክፉውን ለመለየት የማስተዋል ችሎታቸው የሰለጠነላቸው ናቸው።


    [a] ወይም፣ “በልማድ” ወይም “ሁልጊዜ በመጠቀም።”


    [b] ቃል በቃል፣ “የስሜት ሕዋሳት።” እዚህ ላይ ቃሉ የሰውን የማስተዋል አቅም በምሳሌያዊ ሁኔታ ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በልማድ” ወይም “ሁልጊዜ በመጠቀም።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “የስሜት ሕዋሳት።” እዚህ ላይ ቃሉ የሰውን የማስተዋል አቅም በምሳሌያዊ ሁኔታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: ለጎለመሱ ሰዎች
  rationale: በቅርብ ዐውዱ ካሉት ሕፃናት ጋር የሚነጻጸሩ በመንፈሳዊ እድገትና በማስተዋል የበሰሉ ሰዎችን ያመለክታል፤ ኃጢአት የሌለባቸው “ፍጹማን” ናቸው የሚል ትርጉም አያስገባም።
- source_word: στερεὰ τροφή
  choice: ጠንካራ ምግብ
  rationale: ከወተት ጋር ያለውን የምግብ ንጽጽርና ምሳሌያዊ ምስሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: διὰ τὴν ἕξιν
  choice: በልምምድ
  rationale: ἕξις በተደጋጋሚ አጠቃቀም የሚገኝን ልምምድ፣ ልማድ ወይም የተለመደ አቋም ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ የሥልጠናውን ሂደት በግልጽ ያሳያል፤ አማራጮቹም በማስታወሻ ቀርበዋል።
- source_word: τὰ αἰσθητήρια
  choice: የማስተዋል ችሎታቸውን
  rationale: ቃሉ በቀጥታ የስሜት ሕዋሳትን ቢያመለክትም፣ እዚህ መልካሙንና ክፉውን የመለየት ውስጣዊ የግንዛቤ አቅምን በምሳሌ ይገልጣል። ቀጥተኛው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: γεγυμνασμένα ἐχόντων
  choice: ያሠለጠኑ ናቸው
  rationale: ፍጹም ተደራጊ አንቀጸ ግስ ከἐχόντων ጋር ሆኖ በልምምድ የተገኘን የሰለጠነ ሁኔታ ይገልጣል፤ አማርኛው ሐረግ ሰዎቹ ችሎታቸውን በተደጋጋሚ እንዳሠለጠኑ በተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: πρὸς διάκρισιν
  choice: ለመለየት
  rationale: πρός ከδιάκρισις ጋር የሥልጠናውን ዓላማ ወይም ውጤት ያሳያል፤ “ለመለየት” ከሚከተለው መልካምና ክፉ ጋር በቀጥታ ይያያዛል።
- source_word: καλοῦ τε καὶ κακοῦ
  choice: መልካሙንና ክፉውን
  rationale: τε καὶ የሁለቱንም ወገኖች ጥምረት ያሳያል፤ የአማርኛው “-ንና” አወቃቀር ይህን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: δέ
  choice: ነገር ግን
  rationale: ከቀደመው ስለ ሕፃናትና ወተት የተነገረው ሐሳብ ጋር ያለውን ተቃርኖ በግልጽ ያሳያል።
