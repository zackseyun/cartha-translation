  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: am
  text: በእርግጥ፣ ይህን ያህል ጊዜ ካለፈ በኋላ አስተማሪዎች መሆን ሲገባችሁ፣ የእግዚአብሔር ቃሎች[b] የመጀመሪያ መሠረታዊ ነገሮች[a] ምን እንደሆኑ እንደገና የሚያስተምራችሁ ሰው ያስፈልጋችኋል፤ ጠንካራ ምግብ ሳይሆን ወተት የሚያስፈልጋችሁ ሆናችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር ቃሎች የመጀመሪያ መርሖች።”
    reason: lexical_alternative
  - marker: b
    text: “የእግዚአብሔር ቃሎች” የሚለው አገላለጽ መለኮታዊ ንግግሮችን ወይም መገለጦችን ያመለክታል፤ በአረማዊ ኦራክሎች የሚነገር ንግግርን አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: መሆን ሲገባችሁ
  rationale: የሚጠበቅባቸውን ግዴታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ከመጠን በላይ ሕጋዊ አነጋገርን ያስወግዳል።
- source_word: διὰ τὸν χρόνον
  choice: ይህን ያህል ጊዜ ካለፈ በኋላ
  rationale: ያለፈው ጊዜ ብስለትን እንዲያስገኝ የነበረውን ግምት በግልጽ አማርኛ ያሳያል።
- source_word: διδάσκαλοι
  choice: አስተማሪዎች
  rationale: ሌሎችን ለማስተማር የበቁ ሰዎችን የሚገልጽ መደበኛና ግልጽ ቃል ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: ወደ ቀድሞው የመማር ደረጃ መመለሳቸውንና ድጋሚ ማስተማር ማስፈለጉን ያሳያል።
- source_word: τοῦ διδάσκειν ὑμᾶς
  choice: የሚያስተምራችሁ ሰው
  rationale: በግሪኩ በግልጽ ያልተጠቀሰውን የድርጊቱን ፈጻሚ ለአማርኛ ተፈጥሯዊነት ብቻ ግልጽ ያደርጋል።
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: መጀመሪያ የሆኑትን መሠረታዊ ነገሮች
  rationale: στοιχεῖα የመጀመሪያ ክፍሎችን ወይም መሠረቶችን ያመለክታል፤ ድርብ የመጀመሪያነት አገላለጹንም ሳያጠፋ በተነባቢ መንገድ ቀርቧል።
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: የእግዚአብሔር ቃሎች
  rationale: λόγια ተራ ንግግር ሳይሆን ከእግዚአብሔር የመጡ ቃሎችን ወይም መገለጦችን ያመለክታል፤ ዋናው ጽሑፍ ግን ለተራ አንባቢ ቀላል ሆኖ እንዲቀርብ ይህ አገላለጽ ተመርጧል።
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: የሚያስፈልጋችሁ ሆናችኋል
  rationale: ፍጹም ጊዜው ከጊዜ በኋላ የደረሱበትንና አሁንም የቀጠለውን ሁኔታ ያሳያል።
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: ጠንካራ ምግብ ሳይሆን ወተት
  rationale: የጸሐፊውን የወተትና የጠንካራ ምግብ ንጽጽር ያለ ትርጓሜያዊ መስፋፋት ይጠብቃል።
theological_decisions:
- issue: የወተትና የጠንካራ ምግብ ዘይቤያዊ ንጽጽር
  choice: ዘይቤው በቀጥታ ተጠብቋል።
  alternative: “የመጀመሪያ ትምህርት” እና “የላቀ ትምህርት” ብሎ በግልጽ መተርጎም።
  rationale: ጥቅሱ ራሱ ዘይቤውን አይፈታውም፤ ስለዚህ የአንባቢውን ትርጓሜ አስቀድሞ በመወሰን የአንድ ወገንን የደቀ መዝሙርነት ሥርዓት እንዳያስገባ ዋናው ምስል ተጠብቋል።
- issue: τινὰ የሚለው ቃል ትርጓሜ
  choice: ከστοιχεῖα ጋር ተያይዞ መሠረታዊ ነገሮችን እንደሚጠቁም ተተርጉሟል።
  alternative: “መሠረታዊ ነገሮቹ ምን እንደሆኑ” የሚል ቀጥተኛ ጥያቄያዊ አገላለጽ።
  rationale: የግሪኩ ቅርጽ τινά እንደ አውዱና እንደ አነባበቡ “የትኞቹ/ምን” ወይም “አንዳንድ” ሊሆን ይችላል፤ ዋናው ጽሑፍ የትምህርቶቹን መሠረታዊነት ይገልጣል፣ አማራጩም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገር ተጠብቆ በሰረዝና በድርብ ነጥብ ንባቡ ቀላል ሆኗል፤ የወተትና የጠንካራ ምግብ ምስል አልተፈታም።
