  rationale: ፍጹም አለማወቅን ሳይሆን የልምድና የብቃት ማነስን ያሳያል፤ ከመንፈሳዊ ዕድገት ዘይቤውም ጋር ይስማማል።
- source_word: λόγου δικαιοσύνης
