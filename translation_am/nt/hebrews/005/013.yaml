- source_word: ὁ μετέχων γάλακτος
  choice: ወተትን የሚመገብ
  rationale: የወተትን ዘይቤ በተፈጥሯዊ አማርኛ ያቆያል፤ ሐረጉን ‘በወተት ብቻ የሚኖር’ ብሎ ከምንጩ በላይ አያጠብበውም።
- source_word: ἄπειρος
