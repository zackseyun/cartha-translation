  rationale: የግሪኩን አጭርና ሆን ብሎ ክፍት የተደረገ የባለቤት ሐረግ ይጠብቃል፤ ‘ቃል’ መልእክትን ወይም ትምህርትን ሊያመለክት ይችላል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በሃይማኖታዊና በሥነ ምግባራዊ አገባብ የδικαιοσύνηን ዋና ትርጉም የሚወክል የተለመደ አማርኛ ነው፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: νήπιος
  choice: ሕፃን
  rationale: በወተት ዘይቤው ውስጥ ያለውን ያለመብሰል ጥንካሬ ይጠብቃል፤ ከሰፊው ‘ልጅ’ ይበልጥ ትክክለኛ ነው።
- source_word: γάρ
  choice: ስለሆነ
  rationale: ሁለቱን የምክንያት ግንኙነቶች በአማርኛ በተፈጥሯዊ የአንቀጽ አወቃቀር ያሳያል፤ የመጀመሪያው γάρ በአውዱ የሚታየውን ማብራሪያ በአረፍተ ነገሩ አጠቃላይ ፍሰት ተሸክሟል።
theological_decisions:
- issue: የδικαιοσύνη አተረጓጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ በዚህ የመንፈሳዊ ብስለትና ትምህርት አውድ የተሻለ ተስማሚነት አለው፤ ሆኖም የቃሉ የፍትሕ ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
- issue: የλόγου δικαιοσύνης የባለቤት ሐረግ ግንኙነት
  choice: የግሪኩን ክፍትነት በ‘ጽድቅ ቃል’ መጠበቅ
  alternative: ‘ስለ ጽድቅ የሚናገረው ቃል’ ወይም ‘የጽድቅ መልእክት’
  rationale: ግሪኩ ቃሉ ስለ ጽድቅ መሆኑን፣ ጽድቅን ማምጣቱን፣ ወይም በሌላ መንገድ ከጽድቅ ጋር መያያዙን በግልጽ አይወስንም፤ ዋናው ጽሑፍ ይህን አሻሚነት አያጠፋም።
- issue: የνήπιος ... ἐστιν ጾታዊ አገላለጽ
  choice: በአማርኛ የወንድ ተውላጠ ስም ሳይጨመር ‘ሕፃን ስለሆነ’ ማለት
  alternative: ‘እርሱ ሕፃን ነውና’
  rationale: ግሪኩ በሰዋሰው ወንድ ነጠላ ቢሆንም ጠቅላላ አመልካች ነው። አማርኛ ርዕሰ ነገሩን ሳይደግም በተፈጥሯዊ ሁኔታ ሊገልጠው ስለሚችል፣ ትርጉሙን ሳይለውጥ አላስፈላጊ የጾታ አጽንዖትን ያስወግዳል።
