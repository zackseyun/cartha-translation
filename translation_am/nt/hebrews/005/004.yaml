  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: am
  text: ይህን ክብር ማንም ለራሱ አይወስድም፤ ነገር ግን በእግዚአብሔር ይጠራል፥ አሮንም እንደተጠራው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τις ... οὐχ
  choice: ማንም ... አይወስድም
  rationale: አሉታዊውን ያልተወሰነ ተውላጠ ስም በተፈጥሯዊ አማርኛ ሁሉን አቀፍ ክልከላ አድርጎ ያቀርባል።
- source_word: ἑαυτῷ
  choice: ለራሱ
  rationale: ክብሩን በራስ ሥልጣን መውሰድን የሚያመለክተውን ዳቲቭ ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: λαμβάνει
  choice: አይወስድም
  rationale: ከእግዚአብሔር ጥሪ ጋር ያለውን ንፅፅር በመጠበቅ ራስን መሾም ወይም ክብሩን ለራስ መያዝ የሚለውን ሐሳብ ያስተላልፋል።
- source_word: τὴν τιμήν
  choice: ይህንም ክብር
  rationale: τιμήን በቀጥታ ‘ክብር’ ብሎ ይተረጉማል፤ ‘ይህን’ የሚለው በአውዱ የተጠቀሰውን የሊቀ ካህንነት ክብር ያመለክታል።
- source_word: ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ
  choice: ነገር ግን ... በእግዚአብሔር ይጠራል
  rationale: የግሪኩን ጠንካራ ንፅፅርና የመለኮታዊውን ጥሪ ተገብሮ ቅርጽ ይጠብቃል፤ በግሪኩ የሌለውን ‘ብቻ’ ወይም ‘ሲሆን’ አይጨምርም።
- source_word: καθώσπερ καὶ Ἀαρών
  choice: እንደ አሮን
  rationale: አሮንም በእግዚአብሔር እንደተጠራ የሚገልጠውን ንፅፅር በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የክህነት ክብር አሰጣጥ
  choice: ይህ ክብር በራስ የማይወሰድ፣ ከእግዚአብሔር ጥሪ ጋር የተያያዘ መሆኑን ማሳየት
  alternative: τιμήን በአጠቃላይ ስለማንኛውም ክብር እንደሚናገር መተርጎም፣ ወይም በቀጥታ ‘ሹመት’ ማለት
  rationale: የቅርብ አውዱ ስለ ሊቀ ካህንነት ይናገራል፤ ሆኖም τιμή በቀጥታ ‘ክብር’ ስለሆነ ቃሉን ‘ሹመት’ ብሎ በመጥበብ ከመፍታት ይልቅ የጽሑፉን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘እግዚአብሔር’ የተለመደውን መጽሐፍ ቅዱሳዊ አጠራር ይጠብቃል።
