  rationale: ποτέ የሚያመለክተውን ‘በማንኛውም ጊዜ’ የሚል ጠንካራ የክህደት ጥያቄ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀγγέλων
  choice: መላእክት
  rationale: የዕብራውያን 1 አውድ ሰማያዊ መላእክትን እንጂ ሰብአዊ መልእክተኞችን አያመለክትም።
- source_word: Υἱός μου εἶ σύ
  choice: አንተ ልጄ ነህ
  rationale: ቀጥተኛውን አድራሻና የወልድነት አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σήμερον
  choice: ዛሬ
  rationale: ጊዜን የሚያመለክተውን ቃል ያለ ትርጓሜያዊ ማስፋፋት በቀጥታ ይተረጉማል።
- source_word: γεγέννηκά σε
  choice: ወልጄሃለሁ
  rationale: የγεννάωን የመውለድ ምስልና የፍጹም ጊዜ ውጤታማነት ይጠብቃል፤ ወደ አንድ የንግሥና፣ የትንሣኤ ወይም የዘላለማዊ ዝምድና ትርጓሜ አይገድበውም።
- source_word: καὶ πάλιν
  choice: ደግሞስ
  rationale: ሌላ የቅዱስ ጽሑፍ ጥቅስ መግባቱን በአጭርና ተፈጥሯዊ አገናኝ ያሳያል።
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: እኔ ለእርሱ አባት እሆናለሁ
  rationale: የεἰς + ተሳቢ አወቃቀርንና የቃል ኪዳኑን መደበኛ ትይዩነት በሚገባ ይጠብቃል።
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: እርሱም ለእኔ ልጅ ይሆናል
  rationale: ከመጀመሪያው ክፍል ጋር ያለውን ሚዛናዊ ትይዩነትና የቃል ኪዳን የልጅነት አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በሁለቱ የብሉይ ኪዳን ጥቅሶች የልጅነት ቃላት አተረጓጎም
  choice: በሁለቱም ቦታ “ልጅ” የሚለውን ቃል መጠቀም፣ የመጀመሪያውን ቀጥተኛ አድራሻና የሁለተኛውን የቃል ኪዳን ቀመር በአገባቡ ማስለየት
  alternative: በሁለቱም ቦታ የክርስቶሳዊ ማንነት ክብርን በልዩ ፊደል ወይም በተጨማሪ ማዕረግ ማመልከት
  rationale: የግዕዝ ፊደል እንደ እንግሊዝኛ የአቢይና የንዑስ ፊደል ልዩነት የለውም። ሁለቱም ጥቅሶች በዕብራውያን አውድ ለወልድ ቢውሉም፣ ትርጉሙ ከምንጩ በላይ የተጨመረ ማዕረግ አያስገባም።
- issue: “ወልጄሃለሁ” የሚለው ትርጉም
  choice: የመውለድን አገላለጽ ሳይተነትኑ ማቆየት
  alternative: እንደ ንጉሣዊ ሹመት፣ ትንሣኤ ወይም ዘላለማዊ መወለድ በዋናው ጽሑፍ መተርጎም
  rationale: የመዝሙር 2፥7 ጥቅስ በክርስቶሳዊ ክርክሩ ውስጥ የጠለቀ ትርጉም አለው፤ ሆኖም የግሪኩ ጽሑፍ ከእነዚህ አተረጓጎሞች አንዱን በዚህ ቁጥር ብቻ አይወስንም።
