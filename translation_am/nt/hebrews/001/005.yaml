    reason: lexical_alternative
  - marker: b
    text: “ወልጄሃለሁ” የሚለው ከመዝሙር 2፥7 የተጠቀሰ ነው። ይህ አባባል ከንጉሣዊ ሹመት፣ ከትንሣኤ፣ ወይም ወልድ ከአብ ጋር ካለው ዘላለማዊ ዝምድና ጋር ተያይዞ ተረድቷል፤ ትርጉሙ ከእነዚህ መካከል አንዱን ሳይወስን የንባቡን አገላለጽ ይጠብቃል።
    reason: cross_reference
