  choice: ከመላእክት መካከል ... ለማን
  rationale: የጥያቄውን ተሳቢ ቅርጽና ከመላእክት መካከል አንዱን የሚለየውን ከፊልነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: የአገባቡ ምክንያታዊ ጥያቄ አወቃቀር
  rationale: ቁጥሩ ከቀደመው ሐሳብ ጋር ያለው አብራሪ ግንኙነት በአማርኛው የንግግር ፍሰት ውስጥ ተጠብቋል፤ “ምክንያቱም” ተብሎ በግድ አልተጨመረም።
- source_word: εἶπέν ποτε
