  rationale: የግሪክኛው ጽሑፍ κύριε የሚለውን ተጠሪ በግልጽ ይዟል፤ ትርጉሙ ተጨማሪ የእምነት ማብራሪያ ሳይጨምር ይህን መጠበቅ አለበት።
