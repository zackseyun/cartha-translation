lexical_decisions:
- source_word: καί
  choice: እንዲሁም
  rationale: በተከታታይ የቀረቡትን ጥቅሶች የሚያያይዝ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Σὺ
  choice: አንተ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: κατ’ ἀρχάς
  choice: በመጀመሪያ
  rationale: የፍጥረትን መነሻ የሚያመለክተውን ጊዜያዊ አገላለጽ በተፈጥሯዊና በተከበረ አማርኛ ያቀርባል፤ ሌላው የሚቻል አተረጓጎም በማስታወሻ ተጠብቋል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የκύριοςን ተጠሪ ቅርጽ እንደ ቀጥተኛ ንግግር በግልጽ ያስተላልፋል።
- source_word: τὴν γῆν
  choice: ምድርን
  rationale: ከሰማያት ጋር በፍጥረት አውድ ስለተጣመረ፣ አንድን አገር ሳይሆን ምድርን ያመለክታል።
- source_word: ἐθεμελίωσας
  choice: መሠረትህ
  rationale: የመሠረት መጣልን ምስላዊ አገላለጽ በአጭርና ተፈጥሯዊ የአማርኛ ግስ ይጠብቃል።
- source_word: ἔργα τῶν χειρῶν σού
  choice: የእጆችህ ሥራዎች
  rationale: የምንጩን የእጆች ምስላዊ አነጋገርና የሥራዎችን ብዙ ቁጥር በቅርብ ይጠብቃል።
- source_word: οἱ οὐρανοί
  choice: ሰማያት
  rationale: የግሪክኛውን ብዙ ቁጥርና የመጽሐፍ ቅዱስን የፍጥረት አነጋገር ይጠብቃል።
