  text: ደግሞም በኵሩን ወደ ዓለም በሚያስገባበት ጊዜ[a]፣ “የእግዚአብሔር መላእክት ሁሉ[b] ለእርሱ ይስገዱ” ይላል።
  philosophy: optimal-equivalence
