  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝሙራዊው የልብስ ምስልና በፍጥረት ለውጥ እና በተጠሪው ቋሚነት መካከል ያለው ቅኔያዊ ንጽጽር ተጠብቋል።
