base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: am
  text: እንደ መጎናጸፊያም ትጠቀልላቸዋለህ፤[a] እንደ ልብስም ይለወጣሉ። አንተ ግን ያው ነህ፤ ዓመታትህም አያልቁም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ትጠቀልላቸዋለህ” የሚለው “ታጣጥፋቸዋለህ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ዓመታትህም አያልቁም” የሚለው “ዓመታትህም አይቋረጡም” ወይም “ዓመታትህም ፍጻሜ አይኖራቸውም” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: እንደ
  rationale: ንጽጽሩን በተፈጥሯዊና ቀጥተኛ አማርኛ ያሳያል።
- source_word: περιβόλαιον
  choice: መጎናጸፊያ
  rationale: በሰውነት ዙሪያ የሚጎናጸፍ ውጫዊ ልብስን ያመለክታል፤ የልብሱን ምስልም ይጠብቃል።
- source_word: ἑλίξεις
  choice: ጠቅልለህ ታስቀምጣቸዋለህ
  rationale: የመጠቅለልን ወይም የማጣጠፍን ምስል በተፈጥሯዊ አማርኛ ይገልጣል፤ ፍጥረት እንደ ልብስ መጠቅለሉን ያሳያል።
- source_word: αὐτούς
  choice: ታስቀምጣቸዋለህ
  rationale: የብዙ ቁጥር ተውላጠ ስምን በግሱ ውስጥ ጠብቆ በቀደመው አውድ የተጠቀሱትን ሰማያት ያመለክታል።
- source_word: ὡς ἱμάτιον
  choice: እንደ ልብስ
  rationale: ሁለተኛውን የልብስ ንጽጽር በግልጽና የተለመደ ቃል ያቀርባል።
- source_word: ἀλλαγήσονται
  choice: ይለወጣሉ
  rationale: ፍጥረታት ለውጥ እንደሚደርስባቸው ያሳያል፤ የግሪኩን የተደራጊ ፍቺ በአማርኛ ተፈጥሯዊ አገላለጽ ይይዛል።
- source_word: σὺ δὲ
  choice: አንተ ግን
  rationale: በሚለወጠው ፍጥረትና በማይለወጠው ተናጋሪው የሚጠራው አካል መካከል ያለውን ጠንካራ ንጽጽር ያሳያል።
- source_word: ὁ αὐτὸς
  choice: ያው ነህ
  rationale: የማንነትና የቋሚነት ቀጣይነትን ሳይጨምር በቅርብና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ ἔτη σου
  choice: ዓመታትህ
  rationale: የጊዜ ዘመንን የሚያሳየውን ቅኔያዊ ምስል በቀጥታ ይጠብቃል።
- source_word: οὐκ ἐκλείψουσιν
  choice: አያልቁም
  rationale: ἐκλείπω እዚህ ማብቃትን ወይም መቋረጥን ያመለክታል፤ ‘አያልቁም’ ዘላቂነቱን በግልጽ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በክርስቶሳዊው ጥቅስ ውስጥ የመለኮታዊ ቋሚነት አገላለጽ
  choice: አንተ ግን ያው ነህ
  alternative: አንተ ግን ሳትለወጥ ትኖራለህ
  rationale: ‘ያው ነህ’ የὁ αὐτόςን አገላለጽ በቅርብ ይከተላል፤ ከጽሑፉ በላይ ቴክኒካዊ የሥነ መለኮት ቃላትን ሳያስገባ በሚለወጠው ፍጥረትና በወልድ ቋሚነት መካከል ያለውን ንጽጽር ይጠብቃል።
