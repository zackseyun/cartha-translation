lexical_decisions:
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: ባለፈው ቁጥር የተጠቀሱትን ሰማያትና ምድር ያመለክታል፤ ግልጽ ተውላጠ ስም መጠቀሙ ከ«አንተ ግን» ጋር ያለውን ንጽጽር ያስጠብቃል።
- source_word: ἀπολοῦνται
