- source_word: διαμένεις
  choice: ጸንተህ ትኖራለህ
  rationale: ቀጥሎ መኖርንና ዘላቂነትን ያሳያል፤ «ትቀራለህ» ከሚለው ይልቅ በአማርኛ አዎንታዊውን የዘላቂነት ኃይል በግልጽ ያቀርባል።
- source_word: πάντες
  choice: ሁሉም
  rationale: ቀደም ሲል የተጠቀሱትን የፍጥረት ክፍሎች በአጠቃላይ ያመለክታል።
- source_word: ὡς ἱμάτιον
  choice: እንደ ልብስ
  rationale: ἱμάτιον የልብስ ዓይነትን በሰፊው የሚያመለክት ስለሆነ «ልብስ» ምሳሌያዊውን ንጽጽር ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παλαιωθήσονται
  choice: ያረጃሉ
  rationale: ቃሉ ማርጀትንና በጊዜ መበላሸትን ይገልጻል፤ ከልብስ ምስል ጋር «ያረጃሉ» ሁለቱንም ገጽታዎች በአጭርና ተፈጥሯዊ አገላለጽ ይይዛል።
