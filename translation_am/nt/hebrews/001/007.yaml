  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: am
  text: 'ስለ መላእክትም እንዲህ ይላል፦


    “የእርሱን መላእክት ነፋሳት[a]፣

    የእርሱንም አገልጋዮች የእሳት ነበልባል ያደርጋል።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መናፍስት”፤ የግሪኩ ቃል “ነፋሳት” ወይም “መናፍስት” ማለት ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: ስለ መላእክትም
  rationale: πρός ከ λέγει ጋር በዚህ አውድ ንግግሩ መላእክትን የሚመለከት መሆኑን ያሳያል፤ ጥቅሱ በቀጥታ ለመላእክት የተነገረ አይደለም። μὲν የሚያዘጋጀውን ንጽጽር “ም” በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: λέγει
  choice: እንዲህ ይላል
  rationale: የጥቅስ ማስገቢያውን የአሁን ጊዜ አገላለጽ ይጠብቃል፤ “እንዲህ” ቀጥሎ የሚመጣውን ጥቅስ በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Ὁ ποιῶν
  choice: ያደርጋል
  rationale: የግሪኩን ንቁ እርምጃና የቀጣይ ባሕርይ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀγγέλους
  choice: መላእክቱን
  rationale: የዕብራውያን 1 አውድ ሰማያዊ መላእክትን ከወልድ ጋር ያነጻጽራል፤ “መልእክተኞች” የሚለው አጠቃላይ ትርጉም እዚህ አይመጥንም። ባለቤትነቱ በ“-ቱን” ተገልጿል።
- source_word: πνεύματα
  choice: ነፋሳት
  rationale: πνεύματα “ነፋሳት” ወይም “መናፍስት” ሊሆን ይችላል። ከመዝሙር 104፥4 ዕብራይስጥ ዳራና “የእሳት ነበልባል” ከሚለው ትይዩ ምስል አንጻር “ነፋሳት” በዋናው ጽሑፍ ተመርጧል፤ እውነተኛው አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: λειτουργοὺς
  choice: አገልጋዮቹን
  rationale: λειτουργός አገልግሎት የሚፈጽምን፣ አንዳንዴም ቅዱስ ወይም ይፋዊ አገልግሎት ያለውን ያመለክታል። “አገልጋዮቹን” ከዘመናዊ የቤተ ክርስቲያን ሹመት ጋር ሳያያይዝ የአገልግሎትን ሐሳብ በክብር ያስተላልፋል።
- source_word: πυρὸς φλόγα
  choice: የእሳት ነበልባል
  rationale: የነጠላውን የግሪክ ሐረግና ግጥማዊ ምስሉን በቀጥታና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: αὐτοῦ
  choice: መላእክቱን / አገልጋዮቹን
  rationale: የባለቤትነት ተውላጠ ስሙ በአማርኛ ቅጥያ “-ቱ” ተገልጾ በጥቅሱ አውድ እግዚአብሔርን ያመለክታል።
theological_decisions:
- issue: በመዝሙር 104፥4 ጥቅስ ውስጥ πνεύματα የሚለው ትርጉም
  choice: ነፋሳት
  alternative: መናፍስት
  rationale: ቃሉ በቃላት ደረጃ ሁለቱንም ትርጉሞች ሊይዝ ይችላል። “ነፋሳት” ከዕብራይስጡ የመዝሙር ዳራና ከትይዩው የእሳት ምስል ጋር ይበልጥ ይስማማል፤ ሆኖም ትርጉማዊና ሥነ መለኮታዊ ውጥረቱ እንዳይጠፋ “መናፍስት” በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ ግጥማዊ ትይዩነት በሁለት መስመሮች ተጠብቋል፤ የቤተ እምነት ልዩ ቃላት ወይም የአንድ ተርጓሚ የግል ትርጓሜ አልገባም።
