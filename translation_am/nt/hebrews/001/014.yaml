  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: am
  text: ሁሉም ለአገልግሎት የሚላኩ፣ መዳንን ሊወርሱ ላሉት ሲሉ አገልጋይ መናፍስት አይደሉምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መዳንን ለሚወርሱት።» የግሪኩ አገላለጽ የወደፊት ጊዜ አቅጣጫ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: አይደሉምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አጠያየቅ በተፈጥሯዊ የአማርኛ አሉታዊ ጥያቄ ያቀርባል።
- source_word: πάντες
  choice: ሁሉም
  rationale: የብዙ ቁጥር ቃሉን አጠቃላይ ወሰን በአጭሩ ይጠብቃል።
- source_word: λειτουργικὰ πνεύματα
  choice: የሚያገለግሉ መናፍስት
  rationale: λειτουργικός ያለውን የአገልግሎት ሐሳብ በዘመናዊና ክቡር አማርኛ ያስተላልፋል፤ እዚህ πνεύματα መላእክታዊ ፍጡራንን ያመለክታል።
- source_word: εἰς διακονίαν
  choice: ለአገልግሎት
  rationale: የዓላማ ትርጉሙን ግልጽ ያደርጋል፤ ልዩ የቤተ ክርስቲያን ሹመትን አያስገባም።
- source_word: ἀποστελλόμενα
  choice: የሚላኩ
  rationale: የአሁን ጊዜ ተደራጊ አንቀጽን በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ይገልጻል።
- source_word: διὰ τοὺς
  choice: ለ... ሰዎች ሲሉ
  rationale: ከተደራጊዎቹ ጥቅም አንጻር ያለውን የδιά ምክንያታዊ/ጥቅማዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς μέλλοντας
  choice: ሊ... ላሉት
  rationale: መጪውን ወይም የሚጠበቀውን ድርጊት ያመለክታል፤ ግን በግሪኩ ያልተገለጸ የዕጣ ፈንታ አስተምህሮ አያክልም።
- source_word: κληρονομεῖν
  choice: ሊወርሱ
  rationale: የውርስና የወራሽነት ምስሉን በቀጥታ ይጠብቃል።
- source_word: σωτηρίαν
  choice: መዳንን
  rationale: በዕብራውያን መልእክት ያለውን የσωτηρία መደበኛና ዐውዳዊ ትርጉም ያስተላልፋል።
theological_decisions:
- issue: የμέλλοντας κληρονομεῖν σωτηρίαν የጊዜና የትንቢታዊ ኃይል
  choice: መዳንን ሊወርሱ ላሉት
