- issue: ἐν τοῖς προφήταις የሚገልጠው ግንኙነት
  choice: ‘በነቢያት’ በማለት መሣሪያዊና አሳታፊ ንባቦችን ክፍት ማድረግ
  alternative: ‘በነቢያት አማካይነት’ ወይም ‘በነቢያት ውስጥ’
  rationale: ‘በነቢያት’ ለግሪኩ ἐν ቅርብ ሲሆን ነቢያት መልእክተኞች መሆናቸውን ይገልጣል፤ ሊኖር የሚችለውን ሰፋ ያለ አሳታፊ ሐሳብም አይዘጋም።
