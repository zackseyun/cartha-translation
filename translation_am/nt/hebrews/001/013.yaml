  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: am
  text: 'ነገር ግን፣ ከመላእክት መካከል ለማን መቼም እንዲህ ብሎ ተናግሯል?


    “በቀኜ ተቀመጥ፤


    ጠላቶችህን የእግሮችህ መርገጫ[a] እስካደርግ ድረስ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጠላቶችህን ከእግሮችህ በታች እስካኖር ድረስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: ነገር ግን፣ ከመላእክት መካከል ለማን
  rationale: πρός with τίνα after a verb of speaking is naturally expressed by ለማን; ነገር ግን preserves the contrast with the preceding argument.
- source_word: εἴρηκέν ποτε
  choice: እንዲህ ብሎ ያውቃል
  rationale: The Amharic experiential perfect idiom conveys ‘has he ever said’ naturally while retaining the continuing rhetorical force of the Greek perfect and ποτέ.
- source_word: Κάθου
  choice: ተቀመጥ
  rationale: A direct, dignified imperative corresponding to ‘Sit,’ without unnecessary paraphrase.
- source_word: ἐκ δεξιῶν μου
  choice: በቀኜ
  rationale: Natural Amharic for the fixed enthronement expression ‘at my right hand,’ preserving its honor and authority imagery.
- source_word: ἕως ἂν θῶ
  choice: እስካደርግ ድረስ
  rationale: Preserves the future endpoint expressed by ἕως ἂν and fits naturally with the predicate metaphor ‘make ... a footstool.’
- source_word: τοὺς ἐχθρούς σου
  choice: ጠላቶችህን
  rationale: Direct and idiomatic rendering of the plural object.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: ለእግሮችህ መርገጫ
  rationale: Preserves the scriptural footstool image in clear modern Amharic rather than replacing it with an explanatory statement about defeat.
theological_decisions:
- issue: Preserving the christological force and royal imagery of Psalm 110:1 in Hebrews’ contrast between the Son and angels
  choice: 'The direct enthronement oracle is retained: “በቀኜ ተቀመጥ ... ለእግሮችህ መርገጫ.”'
  alternative: Paraphrase the image as ‘until I completely defeat/subdue your enemies.’
  rationale: Hebrews’ argument relies on the wording and imagery of the citation. Keeping the right-hand enthronement and footstool metaphor preserves its force without adding an interpretive explanation.
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የቅዱስ መጽሐፉ ንጉሣዊ የዙፋን ምስል ተጠብቋል፤ ጥቅሱም ከዋናው የአገባብ ጥያቄ በግልጽ ተለይቷል።
