  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: am
  text: ስለ ወልድ ግን እንዲህ ይላል፦ “አምላክ ሆይ፣ ዙፋንህ ለዘላለም ነው፤[a] የቅንነትም[b] በትር የመንግሥትህ በትር ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሌላው፣ ግን የማይመረጠው አተረጓጎም፦ “አምላክ ለዘላለም ዙፋንህ ነው።” የግሪኩ አገባብ ክርክር ያለበት ቢሆንም፣ “አምላክ ሆይ፣ ዙፋንህ” የሚለው ቀጥተኛ ጥሪ ከአውዱና ከጥቅሱ ኃይል ጋር ይበልጥ ይስማማል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “የጽድቅ።” የግሪኩ ቃል ቅንነትን፣ ቀጥተኛነትን ወይም ጽድቅን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: ስለ ወልድ ግን እንዲህ ይላል
  rationale: πρός ከተሰወረው የመናገር ግስ ጋር ‘ስለ’ ወይም ‘ለ’ የሚል ኃይል ሊኖረው ይችላል። በዚህ የጥቅሶች ተከታታይ አውድ ‘ስለ ወልድ ... ይላል’ ተቃርኖውን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: υἱόν
  choice: ወልድ
  rationale: ቃሉ ከመስተዋድድ ጋር በመጣቱ የተወሰነና ማዕረጋዊ ነው። ‘ወልድ’ በአማርኛ የመጽሐፍ ቅዱስ ንግግር የታወቀ፣ ክቡርና ከመላእክት ጋር ያለውን ንጽጽር የሚጠብቅ ምርጫ ነው።
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: አምላክ ሆይ፣ ዙፋንህ
  rationale: ὁ θεός በአውዱና በመዝሙር 45 የግሪክ ጥቅስ አጠቃቀም የቀጥታ ጥሪ ሆኖ መነበቡ ይበልጥ ይስማማል። በአማርኛ ‘አምላክ ሆይ’ ይህን ጥሪ በግልጽ ያሳያል፤ ሰዋሰዋዊው አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: ለዘላለም ጸንቶ ይኖራል
  rationale: የግሪኩ ፈሊጥ የማያቋርጥ ቆይታን ያመለክታል። ከ‘ዙፋን’ ጋር በአማርኛ ተፈጥሯዊ እንዲሆን የመኖር ግስ ተጨምሯል፤ የጊዜው ኃይል ግን አልተቀየረም።
- source_word: ῥάβδος
  choice: በትር
  rationale: ῥάβδος በንጉሣዊ አውድ የገዥነትን ሥልጣን የሚወክል በትር ነው። ‘በትር’ በአማርኛ የንጉሥ ምልክትንም የሚያስተላልፍ የታወቀ ቃል ነው።
- source_word: τῆς εὐθύτητος
  choice: የቅንነት
  rationale: εὐθύτης ቀጥተኛነትን፣ ቅንነትን ወይም ጽድቅን ሊያመለክት ይችላል። ‘ቅንነት’ ቀጥተኛውን የቃሉን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ‘ጽድቅ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: የመንግሥትህ በትር
  rationale: βασιλεία መንግሥትን፣ ንግሥናን ወይም አገዛዝን ሊያመለክት ይችላል። ‘መንግሥት’ የንጉሣዊውን ምስል በግልጽ የሚያቀርብ ቀጥተኛና የታወቀ አቻ ነው።
theological_decisions:
