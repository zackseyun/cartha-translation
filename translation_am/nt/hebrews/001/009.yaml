  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: am
  text: ጽድቅን[a] ወደድህ፤ ሕግን መተላለፍንም ጠላህ። ስለዚህ አምላክ፣ አምላክህ፣ ከባልንጀሮችህ ይልቅ በደስታ ዘይት ቀባህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጽድቅ” የተተረጎመው የግሪክ ቃል “ፍትሕ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: ወደድህ
  rationale: የግሪኩ አኦሪስት በዚህ ጥቅስ ቀጥተኛና ክቡር በሆነ ያለፈ ጊዜ ተተርጉሟል።
- source_word: δικαιοσύνην
  choice: ጽድቅን
  rationale: ጽድቅ የቃሉን ሥነ ምግባራዊና ኪዳናዊ ስፋት ይጠብቃል፤ ‘ፍትሕ’ የሚለው ትርጉም በማስታወሻ ተጠቅሷል።
- source_word: ἐμίσησας
  choice: ጠላህ
  rationale: ከ‘ወደድህ’ ጋር ያለውን ጠንካራ ሥነ ምግባራዊ ተቃርኖ በቀጥታ ይጠብቃል።
- source_word: ἀνομίαν
  choice: ዓመፃን
  rationale: በአማርኛ የሕግንና የትክክለኛ ሥርዓትን መጣስ የሚያመለክት ተፈጥሯዊ ቃል ሲሆን፣ ከአጠቃላይ ‘ክፋት’ ይልቅ ἀνομίαን በቅርብ ያንጸባርቃል።
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: በፊት በተገለጸው ፍቅርና ጥላቻ እና በቀጣዩ ቅባት መካከል ያለውን ምክንያታዊ ግንኙነት በአጭሩ ይገልጻል።
- source_word: ἔχρισέν
  choice: ቀባህ
  rationale: የንጉሣዊና መሲሐዊ ቅባትን ምስል በተለመደው መጽሐፍ ቅዱሳዊ አማርኛ ይጠብቃል።
- source_word: ὁ θεός, ὁ θεός σου
  choice: አምላክ፣ አምላክህ
  rationale: በምንጩ ያለውን ድግግሞሽና ግንኙነታዊ ልዩነት ያለ ትርጓሜያዊ መስፋፋት በቀጥታ ይጠብቃል።
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: በደስታ ዘይት
  rationale: የቅባትን ምስልና የእልልታ ደስታን ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: παρὰ τοὺς μετόχους σου
  choice: ከባልንጀሮችህ ይልቅ
  rationale: παρά ያለውን የንጽጽርና የብልጫ ትርጉም ግልጽ ያደርጋል፤ μετόχουςን ደግሞ እዚህ ከግለሰቡ ጋር የሚጋሩ ወይም የሚተባበሩ ሰዎች በሚል ተፈጥሯዊ ቃል ይገልጻል።
theological_decisions:
- issue: በዚህ ንጉሣዊና መሲሐዊ ጥቅስ ውስጥ δικαιοσύνηን መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ የሥነ ምግባርና የኪዳን ትርጉሙን ስፋት ይጠብቃል፤ ‘ፍትሕ’ ግን ትክክለኛ የትርጉም አማራጭ ስለሆነ በማስታወሻ ቀርቧል።
- issue: ስለ ወልድ በሚናገረው አውድ ‘አምላክ፣ አምላክህ’ የሚለው ክርስቶሳዊ ውጥረት
  choice: የምንጩን አነጋገር ያለ ማብራሪያ ማቆየት
  alternative: የሥላሴን ግንኙነት የሚያብራራ ትርጓሜያዊ ማስፋፋት
  rationale: ጥቅሱ ለወልድ ከፍ ያለ አጠራር ሲጠቀም በተመሳሳይ ጊዜ ‘አምላክህ’ ይላል። ይህን የጽሑፉን ውጥረት ሳያለዝብ ወይም በትርጓሜ ሳይፈታ እንዳለ ማቆየት ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝሙራዊው ጥቅስ ክብር እንዲጠበቅ አጭር ትይዩ አወቃቀር ተመርጧል። የማስታወሻ ምልክቱ ከሙሉው ጥቅስ በኋላ ተቀምጦ የ‘ጽድቅ’ን አማራጭ ትርጉም ያመለክታል።
