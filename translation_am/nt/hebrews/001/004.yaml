  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: am
  text: ከመላእክት ይልቅ በዚያው መጠን የላቀ ሆኗል፤ ከእነርሱ ይልቅ የበለጠ የከበረ ስም ወርሷልና[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከመላእክት የተሻለ … ከእነርሱ ይልቅ ይበልጥ የተለየ ስም።”
    reason: lexical_alternative
  - marker: b
    text: “ስም” የሚለው በቀጣዩ አውድ የ“ወልድ” ማዕረግና ሁኔታ እንደሚያመለክት ይብራራል።
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: … በወረሰ መጠን፣ እርሱም …
  rationale: የግሪኩን ተመጣጣኝ ንጽጽር (‘በዚያው መጠን’) በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: κρείττων
  choice: የላቀ
  rationale: በዚህ አውድ የሥነ ምግባር ብልጫን ሳይሆን ከመላእክት በላይ ያለውን ደረጃ እና ክብር ያመለክታል።
- source_word: γενόμενος
  choice: ሆኗል
  rationale: የግሪኩን ‘መሆን’ ቀጥተኛ ትርጉምና ከተፈጸመው ነገር የተገኘውን አሁናዊ ሁኔታ ይጠብቃል፤ ‘ተፈጥሯል’ የሚል ያልተፈለገ ፍቺም አያስገባም።
- source_word: τῶν ἀγγέλων
  choice: ከመላእክት
  rationale: ከንጽጽር ቃል ጋር ያለውን የግሪክ ዝምድና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: διαφορώτερον
  choice: እጅግ የከበረ
  rationale: ስሙ ከመላእክት ጋር ሲነጻጸር ያለውን የላቀ ክብርና ልዩነት ይገልጻል።
- source_word: παρ’ αὐτοὺς
  choice: ከእነርሱ ይልቅ
  rationale: የንጽጽሩን መሠረት በግልጽ ሁኔታ ያሳያል፤ ግሪኩ በቀጥታ ‘ከእነርሱ ይልቅ’ ይላልና በዋናው ጽሑፍ ‘ከእነርሱ ስም ይልቅ’ ብሎ አያብራራውም።
- source_word: κεκληρονόμηκεν
  choice: የወረሰ
  rationale: ፍጹም ጊዜው ያለፈውን ድርጊትና የቀጠለውን ውጤት ይዟል፤ በአማርኛው ዋና ግስ ‘ሆኗል’ ከሚለው ጋር ተፈጥሯዊ የጊዜ ዝምድና ይፈጥራል።
- source_word: ὄνομα
  choice: ስም
  rationale: ቀጣዩ አውድ ይህን ስም ምን እንደሆነ እንዲያብራራ ቃሉን በቀጥታ ይጠብቃል።
theological_decisions:
- issue: γενόμενος (‘ሆነ’) ስለ ወልድ የሚያመለክተው
  choice: ‘ሆኗል’ ተብሎ በግልጽ ተተርጉሟል፤ አውዱ የሚያተኩረው በወልድ ከፍ ያለ ሥፍራና በወረሰው ስም ላይ ነው።
  alternative: ‘ተደርጓል’ ብሎ መተርጎም ወይም ከፍጥረት ጋር የሚያያዝ ፍቺ መስጠት።
  rationale: ቀጥተኛውን የግሪክ ግስ ይጠብቃል፤ ወልድ ተፈጥሮ ከዚያ በኋላ መለኮት ሆነ የሚል ትርጉም በጽሑፉ ላይ አይጭንም።
- issue: ‘ስም’ በአውዱ ያለው ትርጉም
  choice: በዋናው ጽሑፍ ‘ስም’ ተብሎ ተጠብቋል፤ ቀጣዮቹ ቁጥሮች ከወልድነቱ ማዕረግና ሁኔታ ጋር ያያይዙታል።
  alternative: በዋናው ጽሑፍ ‘ወልድ የሚለው ማዕረግ’ ብሎ በትርጓሜ መተካት።
  rationale: ጥቅሱ ራሱ የሚለውን ብቻ ይጠብቃል፤ ሥነ ጽሑፋዊውን ፍሰት ሳያቋርጥ ቀጣዩ አውድ እንዲያብራራው ይተዋል።
