  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተመጣጣኝ ንጽጽር በአማርኛ ተፈጥሯዊ በሆነ ‘በ…መጠን’ አወቃቀር ተላልፏል፤ ሐረጉም የዕብራውያንን ከፍ ያለ የንግግር ደረጃ ይጠብቃል።
