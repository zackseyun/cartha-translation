  terminology: Use the established loanword “ፓትርያርክ” for πατριάρχης, with an explanatory footnote, rather than a paraphrase that changes its sense. Retain “አሥረኛውን እጅ” for δεκάτην; “አሥራት” remains a valid lexical alternative. A footnote should also preserve the possible nuance that ἀκροθίνια may indicate the choicest spoils.
