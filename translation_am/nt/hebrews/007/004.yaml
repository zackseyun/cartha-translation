    rationale: This denotes a chief or leader over fathers, not a patriarch or ancestral father. It therefore alters the title's sense.
  - severity: low
    issue: “እንኳ” has been added
    rationale: The Greek emphasizes Abraham through the appositional title “the patriarch,” but does not contain an explicit ‘even.’ Omitting it preserves the source's wording and leaves the rhetorical implication to the context.
  - severity: low
