  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: am
  text: በዚህ ስፍራ የሚሞቱ ሰዎች አሥራትን ይቀበላሉ፤ በዚያ ግን ሕያው መሆኑ የተመሰከረለት[a] አሥራቱን ይቀበላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚያ ግን ሕያው እንደሆነ የተመሰከረለት አሥራቱን ይቀበላል።» የግሪኩ አገላለጽ መልከጼዴቅ ቃል በቃል የማይሞት መሆኑን በቀጥታ ከመናገር ይልቅ፣ ሕያው መሆኑ በቅዱስ ጽሑፍ ምስክርነት እንደቀረበ ያሳያል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: በዚህ ስፍራ
  rationale: ከἐκεῖ ጋር ያለውን የንጽጽር አመልካችነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δεκάτας
  choice: አሥራትን
  rationale: በሃይማኖታዊና በሕጋዊ አውድ የተለመደው አማርኛ ቃል ነው።
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: የሚሞቱ ሰዎች
  rationale: የአሁን ጊዜ አሳታፊውን ቅርጽ በቀጥታ በማቆየት የሌዋውያን ካህናትን ሟችነት ያጎላል።
- source_word: λαμβάνουσιν
  choice: ይቀበላሉ
  rationale: አሥራትን ስለመቀበል የሚናገረውን ቃል ያለ ተጨማሪ ትርጓሜ ያቀርባል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ከ‘በዚህ ስፍራ’ ጋር ያለውን የንጽጽር መዋቅር ይጠብቃል።
- source_word: μαρτυρούμενος
  choice: ተመስክሮለታል
  rationale: የግሪኩን ተደራጊ ቅርጽና የቅዱስ ጽሑፍ ምስክርነት ሐሳብ ይጠብቃል።
- source_word: ὅτι ζῇ
  choice: ሕያው እንደሆነ
  rationale: የአሁን ጊዜውን ሕያውነት በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በሌዋውያን ካህናትና በመልከጼዴቅ መካከል ያለው ንጽጽር
  choice: ሟች የሆኑትን ካህናት ቅዱስ ጽሑፍ ሕያው እንደሆነ ከሚመሰክርለት መልከጼዴቅ ጋር ማነጻጸር
  alternative: መልከጼዴቅ በራሱ ቃል በቃል የማይሞትና እስከዛሬ በአካል ሕያው ነው የሚል ትርጓሜ
  rationale: μαρτυρούμενος የሚለውን ተደራጊ የምስክርነት አገላለጽ በማቆየት ጽሑፉ የሚፈጥረውን ሥነ ጽሑፋዊና ሥነ መለኮታዊ ውጥረት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘የሚሞቱ ሰዎች’ የሚለው አገላለጽ ግሪኩን በቅርብ ይከተላል፤ በአውዱ ውስጥ የሚጠቁሙት ወንድ ካህናት ቢሆኑም ἄνθρωποι የሚለው ቃል ‘ሰዎች’ ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሟል።
