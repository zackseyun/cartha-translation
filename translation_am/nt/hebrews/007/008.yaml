    text: ወይም፣ «በዚያ ግን ሕያው እንደሆነ የተመሰከረለት አሥራቱን ይቀበላል።» የግሪኩ አገላለጽ መልከጼዴቅ ቃል በቃል የማይሞት መሆኑን በቀጥታ ከመናገር ይልቅ፣ ሕያው መሆኑ በቅዱስ ጽሑፍ ምስክርነት እንደቀረበ ያሳያል።
    reason: alternative_reading
