  to: በዚህ ስፍራ የሚሞቱ ሰዎች አሥራትን ይቀበላሉ፤ በዚያ ግን ሕያው መሆኑ የተመሰከረለት[a] አሥራቱን ይቀበላል።
  rationale: The revision supplies the receiving action and its implied object in the second half of the comparison, while preserving μαρτυρούμενος as testimony rather than turning the statement into an unqualified assertion about Melchizedek’s personal immortality. The footnote is aligned with the revised syntax and retains the source’s interpretive restraint.
