base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: am
  text: ስለዚህ ደግሞ በእርሱ በኩል ወደ እግዚአብሔር የሚቀርቡትን ፈጽሞ[a] ማዳን ይችላል፤ ስለ እነርሱ ለመማለድ ሁልጊዜ ሕያው ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለዘላለም ማዳን”፤ በተለምዶ፣ “እስከ መጨረሻው ማዳን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: ስለዚህ
  rationale: ከኢየሱስ ዘላቂ ክህነት በፊት ከቀረበው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καὶ
  choice: በአማርኛው የድምዳሜው አወቃቀር ውስጥ በተዘዋዋሪ ተካቷል
  rationale: ‘ደግሞ’ ብሎ በግልጽ መጨመር በዚህ ዐረፍተ ነገር አማርኛውን ሊያከብድ ይችላል፤ የመደመር ኃይሉ ከ‘ስለዚህ’ እና ከዐውዱ ይታያል።
- source_word: σῴζειν
  choice: ማዳን
  rationale: በድነት ዐውድ የተለመደና የቃሉን ሥነ መለኮታዊ ክብደት የሚጠብቅ አቻ ቃል ነው።
- source_word: εἰς τὸ παντελές
  choice: ፈጽሞ
  rationale: የማዳኑን ሙሉነት በአጭርና ተፈጥሯዊ አማርኛ ያሳያል፤ ሊኖረው የሚችለው የጊዜ ትርጉም በእግር ማስታወሻ ተጠብቋል።
- source_word: δύναται
  choice: ይችላል
  rationale: ከዘላቂ ክህነቱ የሚመነጨውን ችሎታ በግልጽና ዘመናዊ አማርኛ ይገልጣል።
- source_word: τοὺς προσερχομένους
  choice: የሚቀርቡትን
  rationale: በዕብራውያን መልእክት ያለውን ወደ እግዚአብሔር የመቅረብና የአምልኮ ፍቺ ከቀላል ‘የሚመጡት’ ይልቅ በተሻለ ይጠብቃል።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ በኩል
  rationale: ኢየሱስ አማላጅና ወደ እግዚአብሔር መድረሻ መሆኑን ያለ ትርጓሜያዊ መጨመር ይገልጣል።
- source_word: τῷ θεῷ
  choice: ወደ እግዚአብሔር
  rationale: ከ‘መቅረብ’ ግስ ጋር ተፈጥሯዊ የሆነና የግሪኩን አቅጣጫዊ ግንኙነት የሚጠብቅ አገላለጽ ነው።
- source_word: πάντοτε ζῶν
  choice: ሁልጊዜ ሕያው ነውና
  rationale: የማዳን ችሎታው መሠረት የሆነውን የማያቋርጥ ሕይወቱንና የአሳቢ አንቀጹን ምክንያታዊ ኃይል ያሳያል።
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: ለመማለድ
  rationale: በሌሎች ፈንታ ወደ እግዚአብሔር የመቅረብን የክህነት ተግባር በተለመደና ክቡር አማርኛ ይገልጣል።
- source_word: ὑπὲρ αὐτῶν
  choice: ስለ እነርሱ
  rationale: በእነርሱ ጥቅምና ፈንታ የሚደረገውን ልመና በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የεἰς τὸ παντελές የትርጉም ወሰን
  choice: በዋናው ጽሑፍ ‘ፈጽሞ’
  alternative: ‘ለዘላለም’ ወይም ‘እስከ መጨረሻው’
  rationale: ሐረጉ ሙሉ በሙሉ ማዳንንም ሆነ ለዘላለም ማዳንን ሊያመለክት ይችላል። ዐውዱ በሚከተለው የዘወትር ሕይወቱ ሐረግ ሁለቱንም ገጽታዎች ይደግፋል፤ ስለዚህ ዋናው ጽሑፍ ሙሉነቱን ሲያሳይ የጊዜው አማራጭ በማስታወሻ ተጠብቋል።
