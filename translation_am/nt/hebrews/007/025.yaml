  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘የሚቀርቡት’ እና ‘ለመማለድ’ የዕብራውያንን የክህነትና የአምልኮ ዐውድ ይጠብቃሉ፤ አንባቢውን የሚያርቁ ጥንታዊ ወይም ከመጠን በላይ ቤተ ክርስቲያናዊ አገላለጾች ተወግደዋል።
