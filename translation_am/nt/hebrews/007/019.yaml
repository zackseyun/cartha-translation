  terminology: ሕጉ, ፍጹም አደረገ, የተሻለ ተስፋ, and ወደ እግዚአብሔር እንቀርባለን preserve the passage’s key terminology and its access-to-God resonance. The revised wording distinguishes the introduction of hope from the hope itself.
