  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: am
  text: አብርሃምም ከሁሉ አንድ አሥረኛ ክፍል[a] ለእርሱ አካፈለ። በመጀመሪያ ስሙ “የጽድቅ ንጉሥ”[b] ተብሎ ይተረጎማል፤ ከዚያም “የሳሌም ንጉሥ”፣ ማለትም “የሰላም ንጉሥ” ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አሥራት።” ግሪኩ ቃል በቃል “አንድ አሥረኛ” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የፍትሕ ንጉሥ።” የግሪኩ δικαιοσύνη ቃል “ጽድቅ” ወይም “ፍትሕ” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: ለእርሱ
  rationale: የዝምድናው ተውላጠ ስም መልከጼዴቅን ያመለክታል፤ አብርሃም ክፍሉን ለእርሱ መስጠቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δεκάτην
  choice: አንድ አሥረኛ ክፍል
  rationale: የግሪኩን ቀጥተኛ ትርጉም ‘አንድ አሥረኛ’ ያቆያል፤ ‘አሥራት’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀπὸ πάντων
  choice: ከሁሉ
  rationale: ከጠቅላላው መጠን አንድ አሥረኛ መለየቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐμέρισεν
  choice: አካፈለ
  rationale: ግሱ መክፈልን ወይም ክፍል መመደብን ያመለክታል፤ ‘ሰጠ’ ከሚለው ይልቅ የመከፋፈልን ሥዕል ይጠብቃል።
- source_word: πρῶτον μὲν
  choice: በመጀመሪያ
  rationale: ባለሁለት ክፍሉን ማብራሪያ የሚጀምረውን ቅደም ተከተል ያሳያል።
- source_word: ἑρμηνευόμενος
  choice: ስሙ … ተብሎ ይተረጎማል
  rationale: ተሳቢው የመልከጼዴቅን ስም ትርጉም እንደሚያብራራ ግልጽ ያደርጋል፤ ‘ስሙ’ የሚለው ለተፈጥሯዊነት ተጨምሯል።
- source_word: βασιλεὺς δικαιοσύνης
  choice: የጽድቅ ንጉሥ
  rationale: δικαιοσύνηን በተለመደውና በዐውዱ ተስማሚ በሆነው ‘ጽድቅ’ ይተረጉማል፤ ‘ፍትሕ’ የሚለው የቃሉ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἔπειτα δὲ καὶ
  choice: ከዚያም
  rationale: ሁለተኛውን የስም ማብራሪያ የሚያስገባውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: βασιλεὺς Σαλήμ
  choice: የሳሌም ንጉሥ
  rationale: Σαλήμን እንደ ቦታ ስም በድምፅ ቀርቦ ያስተላልፋል።
- source_word: ὅ ἐστιν
  choice: ማለትም
  rationale: ቀጥሎ የሚመጣው ሐረግ ‘ሳሌም’ን እንደሚያብራራ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βασιλεὺς εἰρήνης
  choice: የሰላም ንጉሥ
  rationale: የ‘ሳሌም’ን የስም ማብራሪያ በቀጥታ ያስተላልፋል።
