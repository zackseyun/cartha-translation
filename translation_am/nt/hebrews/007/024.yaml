  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: am
  text: እርሱ ግን ለዘላለም ስለሚኖር፣ ዘላቂ ክህነት አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የማይለወጥ ክህነት አለው” ወይም “ወደ ሌላ የማይተላለፍ ክህነት አለው” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቅጽል ሁለቱንም ፍቺዎች ሊይዝ ይችላል፤ በዐውዱ ግን እርሱ ለዘላለም ስለሚኖር ክህነቱ ወደ ሌላ እንደማያልፍ ነጥቡ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱ ግን
  rationale: ὁ በዐውዱ ከቀድሞዎቹ ብዙ ካህናት በተቃራኒ ኢየሱስን ያመለክታል፤ δέ ደግሞ ንጽጽሩን “ግን” በማለት ያሳያል።
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: ስለሚኖር
  rationale: διά ከግሳዊው ስም ጋር ምክንያትን ይገልጣል። μένω በዚህ ዐውድ በሕይወት መቀጠልን ያመለክታል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: ይህ አገላለጽ ፍጻሜ የሌለውን ቆይታ በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀπαράβατον
  choice: ዘላቂ
  rationale: ቃሉ የማይለወጥ ወይም ወደ ሌላ የማይተላለፍ የሚል ፍቺ ሊኖረው ይችላል። “ዘላቂ” በዐውዱ ያለውን የቋሚነት ሐሳብ ሳያጠብ ያቀርባል፤ የፍቺው ልዩነትም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἔχει τὴν ἱερωσύνην
  choice: ክህነት አለው
  rationale: ἔχω እዚህ የክህነትን ሹመት መያዝን ወይም ባለቤት መሆንን ያመለክታል፤ “አለው” ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἱερωσύνην
  choice: ክህነት
  rationale: ቃሉ የካህንነትን ሹመት ወይም ሁኔታ ያመለክታል፤ “ክህነት” የተለመደውና ግልጽ ትርጉም ነው።
theological_decisions:
- issue: ἀπαράβατον ከክርስቶስ ክህነት ጋር ያለው ፍቺ
  choice: “ዘላቂ ክህነት” ተብሎ ተተርጉሟል፤ ይህም ኢየሱስ ለዘላለም ስለሚኖር ክህነቱ እንደማያበቃ ያጎላል።
  alternative: “የማይለወጥ ክህነት” ወይም “ወደ ሌላ የማይተላለፍ ክህነት”
  rationale: ዐውዱ የሚሞቱና በሌሎች የሚተኩ ካህናትን ለዘላለም ከሚኖረው ኢየሱስ ጋር ያነጻጽራል። ዋናው ጽሑፍ ይህን ቋሚነት ያሳያል፤ በግሪኩ ቃል ያለውን እውነተኛ የፍቺ ስፋት ግን የግርጌ ማስታወሻው ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ጥቅም ላይ ውሏል። “ዘላቂ” የዐውዱን ዋና ሐሳብ በቀላሉ ሲያቀርብ፣ የግሪኩን የፍቺ ስፋት ሙሉ በሙሉ ለአንድ አማራጭ አይወስንም።
