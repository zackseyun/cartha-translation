  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: am
  text: ምክንያቱም መልከ ጼዴቅ ከእርሱ ጋር በተገናኘ ጊዜ፣ ሌዊ ገና በአባቱ ወገብ ውስጥ ነበር[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ትርጉሙን ይበልጥ በመግለጽ፣ «ገና በትውልድ አባቱ አካል ውስጥ ነበር።» ግሪኩ ቃል በቃል «በአባቱ ወገብ ውስጥ» ይላል፤ ይህም ከትውልድ አባት መውረድን የሚያመለክት ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ገና
  rationale: በዚያ ያለፈ ጊዜ የቀጠለውን ሁኔታ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ቁጥር ጋር ያለውን የማብራሪያ ግንኙነት ያሳያል።
- source_word: ἐν τῇ ὀσφύϊ
  choice: በወገብ ውስጥ
  rationale: የግሪኩን ግልጽ አካላዊ ምስል ይጠብቃል፤ በዐውዱ ግን የዘር ሐረግንና የመውለድ ምንጭን የሚያመለክት ፈሊጥ ነው።
- source_word: τοῦ πατρὸς
  choice: የአባቱ
  rationale: የግሪኩን የዝምድና አገላለጽ ይጠብቃል፤ እዚህ «አባት» በሰፊ የትውልድ አባት ትርጉም አብርሃምን ያመለክታል።
- source_word: ἦν
  choice: ነበር
  rationale: የግሪኩን ያልተፈጸመ ያለፈ ጊዜ ግስ ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: ὅτε
  choice: በ…ጊዜ
  rationale: የሁለቱን ክስተቶች ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνήντησεν
  choice: ተገናኘ
  rationale: «ተገናኘ/አገኘ» የሚለውን ትርጉም አጭርና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: αὐτῷ
  choice: ከእርሱ ጋር
  rationale: የግሪኩን ተውላጠ ስም ይጠብቃል፤ በዐውዱ ተጠቃሹ አብርሃም ነው።
- source_word: Μελχισέδεκ
  choice: መልከ ጼዴቅ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን አጻጻፍ ይከተላል።
theological_decisions:
- issue: ሌዊ ከአብርሃም መውረዱን በፈሊጣዊ አነጋገር መወከል
  choice: «ገና በአባቱ ወገብ ውስጥ ነበር» የሚለውን ተጨባጭ ምስል በዋናው ጽሑፍ ማቆየት
  alternative: «ገና በትውልድ አባቱ አካል ውስጥ ነበር»
  rationale: የጸሐፊውን የዘር ሐረግና የውክልና አመክንዮ ይጠብቃል፤ ቴክኒካዊ የሥነ መለኮት ማብራሪያን ወደ ዋናው ጽሑፍ አያስገባም።
- issue: «አባቱ» የሚለውን ማንነት መግለጽ
  choice: በዋናው ጽሑፍ «አባቱ» ማለት
  alternative: «የትውልድ አባቱ አብርሃም»
  rationale: ዐውዱ ተጠቃሹን አብርሃም እንደሆነ ሲያሳይ፣ ትርጉሙ የግሪኩን «አባት» አገላለጽ ይጠብቃል እንጂ በዋናው ጽሑፍ ያልተጻፈ ስም አይጨምርም።
- issue: የተውላጠ ስሙን ተጠቃሽ መለየት
  choice: «ከእርሱ ጋር» የሚለውን ተውላጠ ስም ማቆየት
  alternative: «ከአብርሃም ጋር»
  rationale: ግሪኩ ተውላጠ ስም ይጠቀማል፣ ተጠቃሹም ከቀደመው ዐውድ ይታወቃል።
