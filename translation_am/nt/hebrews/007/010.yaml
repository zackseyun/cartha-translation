  register: ቋንቋው ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ ነው። «ወገብ» የሚለው ቃል የግሪኩን ምስል ስለሚጠብቅ በዋናው ጽሑፍ ቀርቷል፣ ፈሊጣዊ ትርጉሙም በማስታወሻ ተብራርቷል። የሐረግ ቅደም ተከተሉ ተጠቃሹን ሌዊን ግልጽ ለማድረግ ስሙን በአማርኛ አስገብቷል፤ ይህ ከቀደመው ቁጥር የተረዳውን ባለቤት ብቻ ያብራራል።
