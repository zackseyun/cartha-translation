id: HEB.7.12
reference: Hebrews 7:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: am
  text: ምክንያቱም ክህነት ሲለወጥ፣ የግድ የሕግም ለውጥ ይከሰታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሕጉም ለውጥ ይከሰታል»። በዐውዱ ይህ የሌዋውያንን ክህነት የደነገገውን የሙሴ ሕግ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: ሲለወጥ
  rationale: የግስ አገባቡ ክህነቱ መለወጡ ለሚከተለው የሕግ ለውጥ መነሻ መሆኑን ያሳያል፤ «ሲለወጥ» ጊዜያዊና ምክንያታዊውን ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἱερωσύνης
  choice: ክህነት
  rationale: ቃሉ የአንድን ካህን ተግባር ብቻ ሳይሆን የክህነትን ሥርዓትና ሹመት ያመለክታል።
- source_word: ἐξ ἀνάγκης
  choice: የግድ
  rationale: ከክህነት ለውጥ ጋር የሕግ ለውጥ በአስፈላጊነት እንደሚከተል የሚገልጠውን አመክንዮአዊ ግዴታ በግልጽ ያስተላልፋል።
- source_word: νόμου
  choice: የሕግ
  rationale: አንቀጽ የሌለውን የግሪክ አገባብ ከመጠን በላይ ሳያጠብ፣ ክህነትን የሚያስተዳድረውን ሕጋዊ ሥርዓት ያመለክታል፤ በዐውዱም የሙሴን ሕግ በተፈጥሮ ያካትታል።
- source_word: μετάθεσις
  choice: ለውጥ
  rationale: ከመጀመሪያው ግስ ጋር ያለውን የቃልና የሐሳብ ትይዩነት ይጠብቃል፤ «ዝውውር» ከሚለው ይልቅ በዚህ ዐውድ ተፈጥሯዊና ሰፊ ነው።
- source_word: γίνεται
  choice: ይሆናል
  rationale: በክህነት ለውጥ ምክንያት የሕግ ለውጥ መከሰቱን በቀጥተኛና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ
  choice: -ም
  rationale: በአማርኛ የተያያዥ ጭማሪን የሚያሳየው «-ም» የሕግ ለውጥ ከክህነት ለውጥ ጋር በተጓዳኝ እንደሚመጣ ያሳያል።
- source_word: γὰρ
  choice: በአገባቡ የተካተተ
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን ማብራሪያዊ ግንኙነት ያሳያል። በአማርኛ ነጠላ ቁጥሩ ራሱን ችሎ ሲቀርብ «ክህነት ሲለወጥ» የሚለው አገባብ ግንኙነቱን በተፈጥሮ ይይዛል።
theological_decisions:
- issue: νόμος ከክህነት ጋር ያለው ወሰን
  choice: በዋናው ጽሑፍ «የሕግ ለውጥ» ተብሎ ተተርጉሟል፤ ይህም ክህነትን የሚያስተዳድረውን ሕጋዊ ሥርዓት እንዲያመለክት ሰፊነቱን ይጠብቃል።
  alternative: «በሕጉም ላይ ለውጥ»፣ በቀጥታ የሙሴን ሕግ የሚያመለክት።
  rationale: ዐውዱ የሙሴን ሕጋዊ ሥርዓት በግልጽ ያካትታል፤ ሆኖም νόμου ያለ አንቀጽ ስለመጣ ዋናው ጽሑፍ አመለካከቱን ከሚገባው በላይ አያጠብም። ይበልጥ የተወሰነው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ክህነት» እና «ሕግ» በመጽሐፍ ቅዱሳዊ ክርክሩ የተለመዱ ቢሆኑም ለዘመናዊ አንባቢ ግልጽ ናቸው።
