  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: am
  text: ጌታችን ከይሁዳ እንደወጣ[a] ግልጽ ነውና፤ ሙሴም ስለዚህ ነገድ ካህናትን በተመለከተ ምንም አልተናገረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከይሁዳ እንደበቀለ።” የግሪኩ ግስ የመውጣትን ወይም የመብቀልን ምስል ያስነሣል፤ እዚህ በዋናነት የሚያመለክተው ከይሁዳ ነገድ መገኘቱን እንጂ ትንሣኤውን አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: ግልጽ ነው
  rationale: የነገሩን ግልጽነት በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: γὰρ
  choice: ነውና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት ያሳያል።
- source_word: ἐξ Ἰούδα
  choice: ከይሁዳ
  rationale: ἐκ የሚያመለክተውን ምንጭና የዘር መነሻ ይጠብቃል፤ ‘ነገድ’ በቀጣዩ ሐረግ ስለሚገኝ እዚህ አልተደገመም።
- source_word: ἀνατέταλκεν
  choice: እንደወጣ
  rationale: ግሱ ያለውን የመውጣት/የመብቀል ምስል በተፈጥሯዊ አማርኛ ይይዛል፤ በዐውዱ የይሁዳ ዘር መሆንን እንጂ በዋናነት ትንሣኤን አያመለክትም።
- source_word: ὁ κύριος ἡμῶν
  choice: ጌታችን
  rationale: ማዕረጉንና የመሪያውን ባለቤትነት በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς ἣν φυλήν
  choice: ስለዚህ ነገድ
  rationale: ወደ ቀድሞ የተጠቀሰው ይሁዳ ነገድ በግልጽ ይመልሳል፤ εἰς እዚህ ያለውን የማጣቀሻ ኃይል በአማርኛ ይገልጻል።
- source_word: περὶ ἱερέων οὐδὲν
  choice: ካህናትን በተመለከተ ምንም
  rationale: ጽሑፉ ስለ ረቂቅ ‘ክህነት’ ሳይሆን በብዙ ቁጥር ስለ ‘ካህናት’ መናገሩን ይጠብቃል።
- source_word: Μωϋσῆς ἐλάλησεν
  choice: ሙሴም … አልተናገረም
  rationale: λαλέω የሚለውን ተራ የመናገር ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ አሉታው ከοὐδέν ጋር ተጣምሯል።
theological_decisions:
- issue: ‘ጌታችን’ የሚያመለክተው
  choice: በዐውዱ ከይሁዳ የተገኘውንና ክህነቱ በሌዊ ዘር ላይ ያልተመሠረተውን ኢየሱስን ያመለክታል፤ ትርጉሙ ግን ‘ኢየሱስ’ ብሎ አይጨምርም።
  alternative: ‘ጌታችን ኢየሱስ’ ብሎ ስሙን በግልጽ መጨመር
  rationale: ዐውዱ ማንነቱን ያሳያል፤ የግሪኩን ማዕረግ ብቻ ማቆየት ግን በጽሑፉ የሌለ ቃል ከመጨመር ይቆጠባል።
- issue: የἀνατέταλκεν ኃይል
  choice: ከይሁዳ የመጣበትን የዘር መነሻ የሚያሳይ የመውጣት/የመብቀል ምስል
  alternative: ‘ከሙታን ተነሥቷል’ የሚል የትንሣኤ ትርጉም
  rationale: በቅርብ ዐውዱ የሚነገረው ስለ ነገድ መነሻና ስለ ካህንነት ነው፤ ስለዚህ ትንሣኤን እንደ ዋና ትርጉም መጫን አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ካህናት’ የግሪኩን ብዙ ቁጥር ይጠብቃል፤ የሐረጉ አወቃቀር ለአማርኛ ተፈጥሯዊነት ተስተካክሏል።
