  source_fidelity: The translation accurately represents the Greek logical connection (γάρ), the evidentness predicate, the Lord’s origin from Judah, and Moses’ silence about priests in relation to that tribe. “እንደወጣ” suitably renders the arising/coming-forth image of ἀνατέταλκεν without turning it into a resurrection statement.
