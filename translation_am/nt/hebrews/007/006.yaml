  language: am
  text: ነገር ግን ከእነርሱ የዘር ሐረግ ያልተመዘገበለት ሰው ከአብርሃም አሥራትን ወስዷል[a]፤ ተስፋዎች ያሉትንም ባርኮታል[b]።
  philosophy: optimal-equivalence
  footnotes:
