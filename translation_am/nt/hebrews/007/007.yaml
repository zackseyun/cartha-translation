lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: ያለ ምንም ክርክር
  rationale: ሐረጉ የሚቀጥለው አሳብ ክርክር የማያስፈልገው ግልጽ መርሕ መሆኑን ያሳያል። δέ እዚህ ላይ ደካማ የንግግር ሽግግር ስለሆነ፣ በአማርኛ ያልተፈጥሯዊ ማያያዣ ሳይጨመር ቀርቷል።
- source_word: τὸ ἔλαττον
  choice: ታናሹ
  rationale: በአውዱ የሚነጻጸረው መጠን ሳይሆን ደረጃ ወይም ማዕረግ ነው፤ «ታናሹ» ይህን ንጽጽር ያለ ሥነ ምግባራዊ ንቀት ይገልጣል።
- source_word: ὑπὸ τοῦ κρείττονος
  choice: በታላቁ
  rationale: ὑπό ከዝርያ ቅጽ ጋር በተገብሮ ዓረፍተ ነገር ፈጻሚውን ያመለክታል። «ታላቁ» ከፍ ያለውን ደረጃ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐλογεῖται
  choice: ይባረካል
  rationale: የአሁን ጊዜ ተገብሮ ቅጹን በቀጥታ ያስተላልፋል፤ በመልከጼዴቅና በአብርሃም አውድም ከቀላል «መልካም መናገር» ይልቅ የበረከት ተግባርን ያመለክታል።
theological_decisions:
- issue: በ«ታናሹ»ና በ«ታላቁ» መካከል ያለው ንጽጽር
  choice: የደረጃ መርሕ እንደተገለጸ በንጽጽራዊ ቃላት ማቆየት፤ በዝቅተኛ ደረጃ ያለው በከፍተኛ ደረጃ ባለው ይባረካል።
  alternative: ይህን እንደ ተራ ማኅበራዊ ልማድ ብቻ መተርጎም
  rationale: የዕብራውያን 7 አውድ ንግግሩን መልከጼዴቅ ከአብርሃም የላቀ መሆኑን ለሚያሳየው ክርክር ይጠቀምበታል። ትርጉሙ ይህን አንድምታ ሳያጠፋ ከጽሑፉ በላይ ማብራሪያ አይጨምርም።
translation_notes:
