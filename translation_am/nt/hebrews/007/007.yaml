    issue: The second footnote alternative is grammatically and semantically unsuitable.
    rationale: «ምንም ጥርጥር የለውም» is a finite clause (“it has no doubt”), rather than an alternative rendering of χωρὶς πάσης ἀντιλογίας. «ያለ ምንም ጥርጥር» preserves the phrase’s form and meaning.
