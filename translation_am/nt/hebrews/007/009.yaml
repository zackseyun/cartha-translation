  rationale: καί በዚህ ስፍራ ያለውን አጽንዖትና የክርክሩን አስገራሚ መስፋፋት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ δεκάτας λαμβάνων
