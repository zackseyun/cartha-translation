base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: am
  text: ሕጉ ድካም ያለባቸውን ሰዎች ሊቃነ ካህናት አድርጎ ይሾማልና፤ ከሕጉ በኋላ የመጣው የመሐላው ቃል ግን ለዘላለም ፍጹም የተደረገውን[b] ወልድ[a] ይሾማል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክኛው «ወልድ» የሚለውን ያለ አመልካች ያቀርባል፤ ይህም ከ«ሰዎች» ጋር ያለውን ንጽጽር ያጎላል። በዐውዱ ግን ኢየሱስን ያመለክታል።
    reason: alternative_reading
  - marker: b
    text: «ፍጹም የተደረገ» የሚለው ቃል «ወደ ፍጻሜ የተደረሰ» ወይም በክህነት ዐውድ «የተቀደሰ» የሚል ስሜትም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ሕጉ
  rationale: በዐውዱ የሙሴን ሕግ፣ በተለይም የክህነት ሥርዓቱን ያመለክታል።
- source_word: καθίστησιν
  choice: አድርጎ ይሾማል / ይሾማል
  rationale: የክህነት ሥልጣንን በይፋ ማቋቋም የሚለውን የዐውዱን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀνθρώπους
  choice: ሰዎች
  rationale: ከወልድ ጋር ያለውን የሟችና ደካማ ሰዎች ንጽጽር ያቆያል፤ ዐውዱ በታሪክ ወንዶች የነበሩትን ሊቀ ካህናት በቂ ሁኔታ ይወስናል።
- source_word: ἀρχιερεῖς
  choice: ሊቀ ካህናት
  rationale: በተከታታይ የተሾሙትን የእስራኤል ከፍተኛ ካህናት የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: ἔχοντας ἀσθένειαν
  choice: ድካም ያለባቸውን
  rationale: ἀσθένεια የሚያመለክተውን የሰው ደካማነትና ለኃጢአት ተጋላጭነት በስም መልክ ያቆያል።
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: የመሐላው ቃል
  rationale: በመዝሙር 110፥4 የተነገረውን የእግዚአብሔር ቃልና መሐላ መጽሐፍ ቅዱሳዊ ድምፁን ጠብቆ ያቀርባል።
- source_word: τῆς μετὰ τὸν νόμον
  choice: ከሕጉ በኋላ የመጣው
  rationale: የመሐላው ቃል ከሕጉ በኋላ መሰጠቱን ግልጽ ያደርጋል።
- source_word: υἱόν
  choice: ወልድ
  rationale: ያለ አመልካች የቀረበውን ግሪክኛ ቃል በተፈጥሯዊ አማርኛ ያቀርባል፤ በዕብራውያን ዐውድ ልዩ የሆነውን ኢየሱስን ስለሚያመለክት የክርስቶስ መጠሪያ የሆነው «ወልድ» ተመርጧል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: ዘላቂውን ክህነት በተፈጥሯዊና ግልጽ አማርኛ ይገልጻል።
- source_word: τετελειωμένον
  choice: ፍጹም የተደረገውን
  rationale: የፍጹምነት፣ ወደታሰበለት ፍጻሜ የመድረስና ለክህነት ብቁ የመሆን የቃሉን ስፋት ጠብቆ፣ የግሪኩን ፍጹም ተደራጊ አንቀጽ ያንጸባርቃል።
theological_decisions:
- issue: ያለ አመልካች የቀረበው υἱόν ከἀνθρώπους ጋር ያለው ንጽጽር
  choice: ወልድ
  alternative: አንድ ወልድ / ልጁ
  rationale: አማርኛ «አንድ ወልድ» ብሎ መተርጎም በግሪክኛው የሌለ ቁጥራዊ ወይም ያልተወሰነ ስሜት ሊያስገባ ይችላል፤ «ወልድ» ግን የቃሉን ያለ አመልካች ቅርጽና በዐውዱ ኢየሱስን መጥቀሱን በአንድነት ይጠብቃል።
- issue: τετελειωμένον በዕብራውያን የክህነት ሥነ መለኮት
  choice: ፍጹም የተደረገውን
  alternative: ለዘላለም የተቀደሰውን / ወደ ፍጻሜ የደረሰውን
  rationale: ቃሉን በ«ተቀደሰ» ብቻ በመወሰን የክህነት ትርጉሙን አያጠብም፤ በዕብራውያን ያለውን የፍጹምነትና የፍጻሜ የትርጉም ውጥረት ያቆያል።
