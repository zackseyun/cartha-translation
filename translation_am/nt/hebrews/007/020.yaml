lexical_decisions:
- source_word: Καὶ
  choice: ይህም
  rationale: Καὶ ከቀደመው ሐሳብ ጋር የሚያገናኝ ሲሆን፣ በአማርኛ ‘ይህም’ የክርክሩን ቀጣይነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: καθ’ ὅσον
  choice: ይህም
  rationale: በዚህ ያልተጠናቀቀ አንቀጽ ውስጥ ሐረጉ ቀጣዩን ንጽጽር የሚያስገባ ነው፤ ‘ይህም’ የመጠንና የመሠረት ግንኙነቱን ከአውዱ ጋር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: ያለ መሐላ አልሆነም
  rationale: ድርብ አሉታዊውን ‘not without’ በቀጥታ ይጠብቃል፤ ὁρκωμοσία የመሐላ ማረጋገጫን ያመለክታል።
- source_word: ὁρκωμοσίας
  choice: መሐላ
  rationale: ‘መሐላ’ በዘመናዊ አማርኛ የቃል ኪዳን መማልን ወይም በመሐላ ማረጋገጥን በግልጽና በክብር የሚገልጽ ቃል ነው።
- source_word: οἱ μὲν γὰρ
  choice: እነርሱማ
  rationale: γάρ ያለውን ማብራሪያዊ ግንኙነት ቅንፉና የዓረፍተ ነገሩ አወቃቀር ያሳያሉ፤ ‘-ማ’ ደግሞ μέν የሚያዘጋጀውን ከቀጣዩ ክፍል ጋር ያለ ንጽጽር ይጠብቃል።
- source_word: χωρὶς ὁρκωμοσίας
  choice: ያለ መሐላ
  rationale: በቁጥሩ ውስጥ የተደገመውን ሐረግ በአንድ ዓይነት ትርጉም ያቀርባል።
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: ካህናት ሆነዋል
  rationale: εἰμί ከ γεγονότες ጋር የሚገልጸውን፣ ወደ ክህነት የገቡበትን የተፈጸመ ክስተትና የውጤት ሁኔታ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ቀደምት ካህናትና በመሐላ የተሾመው ካህን መካከል ያለው ንጽጽር
  choice: ቁጥሩ ያለ መሐላ ካህናት የሆኑትን ቀደምት ካህናት በመሐላ ከተመሠረተው የኢየሱስ ክህነት ጋር ለማነጻጸር መንገድ ይከፍታል።
  alternative: ንጽጽሩን በአጠቃላይ በብሉይ ኪዳን ክህነትና በመሲሑ ዘላለማዊ ክህነት መካከል እንዳለ በዚህ ቁጥር ብቻ በስፋት መግለጽ።
  rationale: የዕብራውያን 7 አውድ መዝሙር 110፥4ን በመጥቀስ ይህን ንጽጽር ያዳብራል፤ ይህ ያልተጠናቀቀ ቁጥር ግን በግልጽ የሚናገረውን የመሐላ ንጽጽር ብቻ እንዲያዘጋጅ ተተርጉሟል።
