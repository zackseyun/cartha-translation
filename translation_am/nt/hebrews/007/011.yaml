  rationale: የሴት ጾታ ተውላጠ ስሙ በቅርብ ወዳለው የሌዋውያን ክህነት ይመለሳል። አተረጓጎሙ የሕዝቡ የሕግ ሥርዓት ከዚያ ክህነት ጋር ያለውን መሠረታዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: νενομοθέτηται
