  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: am
  text: ስለዚህ ፍጹምነት በሌዋውያን ክህነት በኩል የሚገኝ ቢሆን ኖሮ—ሕዝቡ በዚህ ክህነት ላይ ሕግ ተሰጥቶት ነበርና[a]—በመልከ ጼዴቅ ሥርዓት ሌላ ካህን እንዲነሣ፣ በአሮንም ሥርዓት እንደሆነ እንዳይባል፣ ደግሞ ምን አስፈለገ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝቡ በዚህ ክህነት ሥር ሕግ ተሰጥቶት ነበርና።” የግሪኩ ሐረግ በይበልጥ ቀጥተኛ መንገድ ሊተረጎም ይችላል፤ ዋናው ሐሳብ ግን ለእስራኤል የተሰጠው የሕግ ሥርዓት በሌዋውያን ክህነት ላይ የተመሠረተ መሆኑ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመልከ ጼዴቅ ሥርዓት ሌላ ካህን እንዲነሣና በአሮን ሥርዓት እንደሆነ እንዳይጠራ።”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: ፍጹምነት
  rationale: በዕብራውያን መልእክት ይህ ቃል ተራ ሥነ ምግባራዊ መሻሻልን ብቻ ሳይሆን፣ ሰውን በእግዚአብሔር ፊት ወደታሰበለት ሙሉ ሁኔታ ማድረስን ያመለክታል። “ፍጹምነት” ይህን ሰፊ ሥነ መለኮታዊ ክብደት ሳያጠብ ይጠብቃል።
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: በሌዋውያን ክህነት በኩል
  rationale: διά ከጄኒቲቭ ጋር መንገድን ወይም መሣሪያነትን ያሳያል። “በኩል” ፍጹምነት ሊገኝ ቢችል ክህነቱ የሚገኝበት መንገድ እንደሚሆን ያሳያል።
- source_word: ἐπ’ αὐτῆς
