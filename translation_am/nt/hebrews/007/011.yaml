  to: ስለዚህ ፍጹምነት በሌዋውያን ክህነት በኩል የሚገኝ ቢሆን ኖሮ—ሕዝቡ በዚህ ክህነት ላይ ሕግ ተሰጥቶት ነበርና[a]—በመልከ ጼዴቅ ሥርዓት ሌላ ካህን እንዲነሣ፣ በአሮንም ሥርዓት እንደሆነ እንዳይባል፣ ደግሞ ምን አስፈለገ?[b]
