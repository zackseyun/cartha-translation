  terminology: ሊቃነ ካህናት, መሥዋዕት, ኃጢአት, and ማቅረብ are appropriate established biblical terms. The alternative in footnote c, አንድ ጊዜ ፈጽሞ, does not naturally express ἐφάπαξ and should be replaced.
