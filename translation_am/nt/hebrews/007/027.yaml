    issue: Footnote c gives an unsuitable alternative for ἐφάπαξ
    rationale: አንድ ጊዜ ፈጽሞ is not an idiomatic equivalent of “once for all.” አንዴ ለሁልጊዜ preserves the definitive, nonrepeated sense naturally.
