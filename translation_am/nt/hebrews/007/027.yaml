base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: am
  text: እርሱ እንደ ሊቃነ ካህናቱ በየቀኑ[a] በመጀመሪያ ስለ ራሱ ኃጢአቶች፣ ከዚያም ስለ ሕዝቡ ኃጢአቶች[b] መሥዋዕቶችን ማቅረብ አያስፈልገውም። ራሱን ባቀረበ ጊዜ[d] ይህን አንድ ጊዜ ለዘላለም[c] አድርጓልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀን በቀን።” የግሪኩ አገላለጽ በየቀኑ የሚደገም ነገርን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከዚያም የሕዝቡን።” በግሪኩ “ኃጢአቶች” የሚለው ከቀደመው ሐረግ የሚገባ በመሆኑ ተትቷል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “አንዴ ለሁልጊዜ።”
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ “ራሱን በማቅረብ” ወይም “ራሱን አቅርቦ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: በየቀኑ
  rationale: የግሪኩን ተደጋጋሚ ዕለታዊ ሁኔታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀνάγκην
  choice: አያስፈልገውም
  rationale: ἔχει ἀνάγκην የሚለውን ‘ያስፈልገዋል’ በሚል ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: እንደ ሊቃነ ካህናቱ
  rationale: ከሌዋውያን ሊቃነ ካህናት ጋር የተደረገውን ንጽጽርና የግሪኩን ብዙ ቁጥር ይጠብቃል።
- source_word: πρότερον ... ἔπειτα
  choice: አስቀድሞ ... ከዚያም
  rationale: የመሥዋዕቱን ቅደም ተከተል ግልጽ አድርጎ ይገልጣል።
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: ስለ ራሱ ኃጢአቶች
  rationale: በመሥዋዕታዊ አውድ የὑπέρን ‘ስለ/ምክንያት’ ኃይል በአጭሩ ያስተላልፋል።
- source_word: θυσίας ἀναφέρειν
  choice: መሥዋዕቶችን ማቅረብ
  rationale: በአምልኮና በክህነት አውድ የἀναφέρωን መሥዋዕታዊ ትርጉም የሚገልጥ የተለመደ አማርኛ ነው።
- source_word: τῶν τοῦ λαοῦ
  choice: ስለ ሕዝቡ ኃጢአቶች
  rationale: ግሪኩ ቃሉን ቢተውም ‘ኃጢአቶች’ ከቀደመው ሐረግ የሚገባ ነው፤ በአማርኛ ግልጽነት ሲባል ተደግሟል።
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: ይህን ... አድርጓልና
  rationale: τοῦτο ወደ ቀደመው የመሥዋዕት ተግባር መመለሱን ይጠብቃል፤ γάρም በ‘ና’ ተገልጧል።
- source_word: ἐφάπαξ
  choice: አንድ ጊዜ ለዘላለም
  rationale: ድርጊቱ የማይደገምና ወሳኝ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἑαυτὸν ἀνενέγκας
  choice: ራሱን ባቀረበ ጊዜ
  rationale: የአኦሪስት ተሳቢውን ከዋናው ግስ ጋር በጊዜ ግንኙነት ያቀርባል፣ የመሥዋዕት ትርጉሙንም ይጠብቃል።
theological_decisions:
- issue: ‘ይህን’ የሚለው ተውላጠ ስም የሚያመለክተው
  choice: ክርስቶስ ራሱን በማቅረብ የፈጸመውን ወሳኝ የመሥዋዕት ተግባር በሰፊው እንዲያመለክት ተተርጉሟል።
  alternative: ‘ይህን’ ስለ ሕዝቡ ኃጢአቶች ማቅረብን ብቻ ያመለክታል።
  rationale: አውዱ ኢየሱስ ስለ ራሱ ኃጢአቶች መሥዋዕት እንዳቀረበ አያስተምርም፤ ነገር ግን τοῦτο የሚያመለክተውን በጽሑፉ ውስጥ በጠባብ መንገድ አልተወሰነም።
- issue: የክርስቶስ ራስን ማቅረብ
  choice: ‘ራሱን ባቀረበ’ ተብሎ የክህነትና የመሥዋዕት ኃይሉ ተጠብቋል።
  alternative: ‘ራሱን በሰጠ’
  rationale: በዕብራውያን መልእክት ውስጥ ኢየሱስ ካህንም መሥዋዕትም መሆኑ ዋና ነው፤ ‘ሰጠ’ ብቻ ይህን መሥዋዕታዊ አውድ ያዳክማል።
