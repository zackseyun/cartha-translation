  choice: ገላጮቹ በዋናው ጽሑፍ ተጠብቀዋል፤ “የእግዚአብሔርን ልጅ እንዲመስል ተደርጎ” የሚለውም መልከጼዴቅን ከልጁ ጋር ሳያስተካክል ዓይነታዊ ተመሳሳይነቱን ይጠብቃል።
  alternative: መልከጼዴቅ ከሥጋ መልበሱ በፊት የተገለጠው ልጅ ነው፣ ወይም በራሱ ማንነት ቃል በቃል ወላጅ የሌለውና ዘላለማዊ ነው።
  rationale: ἀφωμοιωμένος ከልጁ ጋር መመሳሰልን እንጂ አንድነትን አያመለክትም። ትርጉሙ የዘፍጥረትን ትረካዊ ዝምታ እና የዕብራውያንን ዓይነታዊ ክርክር የሚፈቅድ ሆኖ፣ ጽሑፉ የማይወስነውን ዶክትሪናዊ ውሳኔ አያስገባም።
