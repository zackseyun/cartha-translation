  terminology: «አባት የሌለው», «እናት የሌለው», «የዘር ሐረግ የሌለው», «የእግዚአብሔርን ልጅ», and «ካህን» are suitable. The rendering continues to express likeness rather than identity and therefore does not impose a doctrinal interpretation.
