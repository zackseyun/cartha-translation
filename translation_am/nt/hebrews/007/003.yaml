  text: አባት የሌለው፣[a] እናት የሌለው፣ የዘር ሐረግ የሌለው፣ የቀኖችም መጀመሪያ ሆነ የሕይወት ፍጻሜ የሌለው ሆኖ፣ ነገር ግን የእግዚአብሔርን ልጅ እንዲመስል ተደርጎ፣ ለዘላለም[b] ካህን ሆኖ ይኖራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተመዘገበ የዘር ሐረግ የሌለው።” ዘፍጥረት ስለ መልከጼዴቅ ወላጆችና የዘር ሐረግ መረጃ አይሰጥም፤ የዚህ መልእክት ጸሐፊም ይህን የትረካ ዝምታ በዓይነታዊ መንገድ ይጠቀምበታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሁልጊዜ” ወይም “ለዘወትር።” ሐረጉ በቅዱስ ጽሑፉ አቀራረብ የክህነቱን ዘላቂነት ያጎላል።
    reason: lexical_alternative
