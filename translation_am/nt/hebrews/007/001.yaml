lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: ምክንያቱም ይህ
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት ያሳያል፤ Οὗτος የሚሰጠውን አጽንዖት “ይህ” ይጠብቃል።
- source_word: Μελχισέδεκ
  choice: መልከ ጼዴቅ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን የስሙን ቅርጽ ይጠብቃል።
- source_word: βασιλεὺς Σαλήμ
  choice: የሳሌም ንጉሥ
  rationale: የግሪኩን ማዕረግና የቦታውን ስም በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: የልዑል እግዚአብሔር ካህን
  rationale: ὕψιστοςን እንደ መለኮታዊ ማዕረግ በመጠበቅ ሐረጉን በተፈጥሯዊና ክቡር አማርኛ ይገልጣል።
- source_word: συναντήσας
  choice: ተገናኘው
  rationale: የመልከ ጼዴቅን ድርጊትና አብርሃም የድርጊቱ ተቀባይ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑποστρέφοντι
  choice: ሲመለስ
  rationale: የመገናኘቱ ድርጊት አብርሃም በመመለስ ላይ ሳለ መፈጸሙን ያሳያል።
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: ነገሥታቱን ከጨፈጨፈ በኋላ
  rationale: κοπή የሚያመለክተውን ኃይለኛ የመቁረጥና የመግደል ስሜት ይጠብቃል፤ አነስተኛ ትርጓሜ ያለው “ማሸነፍ” በማስታወሻ ቀርቧል።
- source_word: εὐλογήσας αὐτόν
  choice: ባረከውም
  rationale: ከመገናኘቱ ጋር የተቀናጀውን ሁለተኛ ድርጊት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
