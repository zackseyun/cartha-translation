  text: ምክንያቱም ይህ መልከ ጼዴቅ፣ የሳሌም ንጉሥና የልዑል አምላክ ካህን[a]፣ አብርሃም ከነገሥታቱ ጭፍጨፋ ሲመለስ የተገናኘውና የባረከው፣
