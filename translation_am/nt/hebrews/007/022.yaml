  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: am
  text: በዚህ መጠን ኢየሱስ የተሻለ ቃል ኪዳን[a] ዋስ ሆኗል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኑዛዜ።” የግሪኩ ቃል “ቃል ኪዳን” ወይም በአንዳንድ አውዶች “ኑዛዜ” ማለት ይችላል፤ እዚህ ስለ ክህነትና ስለ መሐላ ከቀረበው ክርክር ጋር “ቃል ኪዳን” ይበልጥ ይስማማል።
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: በዚህ መጠን
  rationale: የደረጃንና የመጠንን ንጽጽር ያሳያል፤ ከቀደመው የመሐላ ክርክር ጋርም ያገናኛል።
- source_word: κρείττονος
  choice: የተሻለ
  rationale: በዕብራውያን መልእክት ተደጋግሞ የሚታየውን ንጽጽራዊ ኃይል በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διαθήκης
  choice: ቃል ኪዳን
  rationale: ቃሉ በአንዳንድ አውድ ‘ኑዛዜ’ ሊል ቢችልም፣ እዚህ ያለው የክህነትና የመሐላ አውድ ‘ቃል ኪዳን’ን ይደግፋል።
- source_word: γέγονεν
  choice: ሆኗል
  rationale: ፍጹም ጊዜው የተከናወነና ውጤቱ የቀጠለ ሁኔታን ያሳያል፤ ‘ሆኗል’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔγγυος
  choice: ዋስ
  rationale: ለግዴታ ወይም ለቃል ኪዳን መፈጸም ዋስትና የሚቆምን ሰው በአጭርና በሚገባ የሚታወቅ ቃል ይገልጣል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ አጻጻፍ ነው።
theological_decisions:
- issue: በዕብራውያን 7፥22 የδιαθήκη ትርጉም
  choice: ቃል ኪዳን
  alternative: ኑዛዜ
  rationale: አንቀጹ ስለ ኢየሱስ ክህነትና ይህን ስላጸናው መሐላ ይከራከራል፤ ስለዚህ ‘ቃል ኪዳን’ ከአውዱ ጋር ይስማማል። ሆኖም የግሪኩ ቃል በሌሎች አውዶች ‘ኑዛዜ’ ሊል የሚችለው የትርጉም ስፋት በማስታወሻው ተጠብቋል።
