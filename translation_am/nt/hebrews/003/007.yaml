source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: am
  text: 'ስለዚህ፣ መንፈስ ቅዱስ እንደሚለው፦


    “ዛሬ ድምፁን ብትሰሙ፣”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመነጨውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: καθὼς
  choice: እንደሚለው
  rationale: ከλέγει ጋር ተዋሕዶ የጥቅስ ማስተዋወቂያውን ‘እንደሚለው’ ብሎ በተፈጥሯዊ አማርኛ ያቀርባል፤ የ‘እንደ’ ንጽጽራዊ ኃይልም ይጠበቃል።
- source_word: λέγει
  choice: ይላል / እንደሚለው
  rationale: የግሪኩን የአሁን ጊዜ የጥቅስ አገላለጽ ይጠብቃል፤ ቅዱስ መጽሐፍ አሁንም እንደሚናገር ያለውን ሕያው አቀራረብ አያጠፋም።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውና የግሪኩን ስያሜ በትክክል የሚያስተላልፈው አገላለጽ ነው።
- source_word: Σήμερον
  choice: ዛሬ
  rationale: የጥቅሱን ቀጥተኛ ጊዜያዊ አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐὰν
  choice: ብት-
  rationale: የሁኔታ አንቀጹን ‘ብትሰሙ’ በሚለው የአማርኛ የሁኔታ ግስ ቅርጽ በቀጥታ ያሳያል።
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ድምፁን
  rationale: የἀκούω የዘርፍ ሙያዊ ተሳቢን በአማርኛ ቀጥተኛ ተሳቢ ማቅረብ ተፈጥሯዊ ነው፤ ‘ድምፁ’ የግለሰባዊ ንግግርን ሐሳብ ይጠብቃል።
- source_word: ἀκούσητε
  choice: ብትሰሙ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርንና የሁኔታውን አገላለጽ ይጠብቃል፤ ‘ብትታዘዙ’ ብሎ ትርጉሙን ከመጠን በላይ አይተረጉምም።
theological_decisions:
- issue: የመዝሙሩ ጥቅስ ተናጋሪ ማንነት
  choice: ጥቅሱ የመንፈስ ቅዱስ ንግግር እንደሆነ በቀጥታ ቀርቧል።
  alternative: መንፈስ ቅዱስ በመጽሐፍ ወይም በመዝሙረኛው በኩል ይናገራል።
  rationale: ግሪኩ ‘መንፈስ ቅዱስ ይላል’ ብሎ በግልጽ ይናገራል። ትርጉሙ ይህን ቀጥተኛ አመልካችነት ይጠብቃል፤ ስለ መነሳሳት ተጨማሪ ሥነ መለኮታዊ ማብራሪያ ግን አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ ዓረፍተ ነገር በቀጣዩ ቁጥር ስለሚቀጥል መጨረሻው በኮማ ተቀምጧል።
