  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: am
  text: እያንዳንዱ ቤት በአንድ ሰው ይሠራልና፤ ነገሮችን ሁሉ[a] የሠራው ግን እግዚአብሔር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉንም ነገር።”
    reason: የπάντα ሰፊ አጠቃላይ ፍቺ በ«ነገሮችን ሁሉ» ወይም «ሁሉንም ነገር» ሊገለጽ ይችላል።
lexical_decisions:
- source_word: πᾶς
  choice: እያንዳንዱ
  rationale: ከነጠላው οἶκος ጋር የተጠቀሰው πᾶς አከፋፋይ ትርጉም ስላለው፣ ‘እያንዳንዱ ቤት’ የሚለው አጠቃላይ መርሁን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: γὰρ
  choice: -ና
  rationale: γάρ ቀድሞ ለተነገረው ሐሳብ ማብራሪያና ምክንያት ያቀርባል፤ በአማርኛ ከግሱ ጋር የተያያዘው ‘-ና’ ይህን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: οἶκος
  choice: ቤት
  rationale: በዐውደ ንባቡ ያለውን የግንባታ ምስልና በዕብራውያን 3 ውስጥ ያለውን ቀጣይ ዘይቤ ያቆያል፤ ‘ቤተሰብ’ ማለት በዚህ ስፍራ ዘይቤውን አስቀድሞ መተርጎም ይሆናል።
- source_word: κατασκευάζεται
  choice: ይሠራል
  rationale: የአሁን ጊዜው ተደራጊ ቅርጽ ቤት በሠሪ እንደሚሠራ ያሳያል። አማርኛ ተደራጊ ቅርጽን በተፈጥሯዊ ሁኔታ ይገልጣል፣ እንዲሁም ከሁለተኛው κατασκευάσας ጋር የቃል ትስስሩን ያቆያል።
- source_word: ὑπό τινος
  choice: በአንድ ሰው
  rationale: ὑπό ከዘር አመልካች ጋር የድርጊቱን ፈጻሚ ያሳያል፤ τις እዚህ ያልተወሰነ ፈጻሚን ስለሚገልጥ ‘በአንድ ሰው’ ተፈጥሯዊ ነው። ቅርጹ ሰውን ወይም ነገርን ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- source_word: ὁ δὲ
  choice: የሠራው ግን
  rationale: ὁ ከተሳቢው ጋር ‘የሠራው’ የሚለውን ስማዊ አገላለጽ ይፈጥራል፤ δέ ደግሞ ከአጠቃላይ መርሁ ወደ ዋናው መለኮታዊ መግለጫ የሚደረገውን መጠነኛ ንጽጽር ‘ግን’ በማለት ያሳያል።
- source_word: πάντα
  choice: ሁሉንም ነገር
  rationale: ገለልተኛ ብዙ ቁጥሩ ሰፊና አጠቃላይ ወሰን አለው። ‘ሁሉንም ነገር’ ይህን ወሰን በግልጽ አማርኛ ይጠብቃል፣ ‘ዓለምን ሁሉ’ የሚል ተጨማሪ ትርጓሜም አያስገባም።
- source_word: κατασκευάσας
  choice: የሠራው
  rationale: ያለፈ ጊዜው ተሳቢ ሁሉንም ነገር ላዘጋጀው ወይም ለሠራው ፈጻሚ ያመለክታል። ‘የሠራው’ ከመጀመሪያው ግስ ጋር የቃል ትስስሩንና የንጽጽሩን መዋቅር ያቆያል።
- source_word: θεός
  choice: እግዚአብሔር
  rationale: θεός በዚህ ሐረግ ሁሉንም ነገር የሠራውን በግልጽ ይለያል፤ ‘እግዚአብሔር’ በዘመናዊ መደበኛ አማርኛ የተለመደና ክብር ያለው አቻ ነው።
theological_decisions:
- issue: የመጨረሻው ሐረግ እግዚአብሔርን ሁሉንም ነገር ከሠራው ጋር በግልጽ ማንነታዊ ግንኙነት ማስቀመጡ
