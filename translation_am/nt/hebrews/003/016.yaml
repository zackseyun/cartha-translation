  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: am
  text: ምክንያቱም፣ ሰምተው ያመፁት[a] እነማን ነበሩ? በሙሴ በኩል ከግብፅ የወጡት ሁሉ አልነበሩምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰምተው ያስቆጡት” (ወይም “ያስመረሩት”)። የግሪኩ ግስ ይበልጥ ቀጥተኛ በሆነ መንገድ እንዲህ ሊተረጎም ይችላል፤ እዚህ ግን በምድረ በዳ እስራኤል በዓመፁ አምላክን ማስቆጣቱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: እነማን
  rationale: የጥያቄውን ብዙ ቁጥርና የተወሰኑ ሰዎችን ማንነት የሚጠይቅ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γὰρ
  choice: በአማርኛው የተከታታይ ጥያቄ አወቃቀር ውስጥ ተካትቷል
  rationale: ቃሉ ከቀደመው ክርክር ጋር ያለውን የማብራሪያ ግንኙነት ያመለክታል፤ ‘ምክንያቱም’ ብሎ በቀጥታ መጀመር ግን ከሚከተለው ጥያቄ ጋር በዘመናዊ አማርኛ ይከብዳል።
- source_word: ἀκούσαντες
  choice: ሰምተው
  rationale: ዋናው ድርጊት ከመፈጸሙ በፊት መስማታቸውን የሚያሳየውን የግሪክ አንቀጽ በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: παρεπίκραναν
  choice: ያመፁት
  rationale: በምድረ በዳው አውድ የእስራኤላውያንን እምቢተኝነትና አምላክን ያስቆጣ ዓመፅ በግልጽ ዘመናዊ አማርኛ ያሳያል፤ ይበልጥ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀλλ’ οὐ πάντες
  choice: ሁሉ አልነበሩምን?
  rationale: የሚጠበቀው መልስ ‘አዎን’ የሆነውን አጽንዖታዊ ጥያቄ ይጠብቃል፤ ἀλλά ያለው የንግግር ኃይል በጥያቄው አወቃቀር ተካትቷል።
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
