- source_word: διὰ Μωϋσέως
  choice: በሙሴ አማካይነት
  rationale: διά ከባለቤት አገናዛቢ ጋር የሚያሳየውን አማካይነት ይጠብቃል፤ ‘በሙሴ መሪነት’ የሚለውን የትርጓሜ ማስፋፊያ አያስገባም።
theological_decisions:
