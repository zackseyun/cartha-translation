  choice: ያመፁት
  alternative: ያስመረሩት ወይም ያስቆጡት
  rationale: የእስራኤል ሕዝብ ከሰማ በኋላ ባለመታዘዝ አምላክን የተቃወመበትን ታሪካዊና ሥነ መለኮታዊ ኃይል ‘ዓመፁ’ በግልጽ ያሳያል፤ የግሪኩ ቀጥተኛ ምስል ግን በማስታወሻ ተጠብቋል።
- issue: ‘ሁሉ’ የሚለው አጠቃላይ አገላለጽ
  choice: ሁሉ
  alternative: አብዛኞቹ
  rationale: ግሪኩ πάντες በግልጽ ‘ሁሉ’ ይላል። በበረሃው ታሪክ ያሉ ልዩ ሰዎችን በማሰብ ‘አብዛኞቹ’ ብሎ መቀየር ጽሑፉ ያለውን አጽንዖትና ውጥረት በዝምታ ይፈታል።
