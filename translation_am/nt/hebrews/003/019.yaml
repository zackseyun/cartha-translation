  rationale: የአሁን ጊዜ ንቁ አመልካች የመጀመሪያ መደብ ብዙ ቁጥርን ቀጥተኛና ሕያው አድርጎ ያቀርባል።
- source_word: ὅτι
  choice: እንደሆነ
  rationale: የሚታየውን የይዘት አረፍተ ነገር በተፈጥሯዊ የአማርኛ አገባብ ያስተዋውቃል።
- source_word: οὐκ ἠδυνήθησαν
  choice: ሊገቡ ያልቻሉት
  rationale: የመቻል እጦትን በግልጽ ያስቀምጣል፤ ከመግባት ግስ ጋርም ተፈጥሯዊ የአማርኛ ግንባታ ይፈጥራል።
- source_word: εἰσελθεῖν
  choice: ሊገቡ
  rationale: በአውዱ የተነገረውን ወደ ተስፋው ምድርና ዕረፍት መግባት ሳይጨምር በአጭሩ ያስተላልፋል።
- source_word: δι’
  choice: ባለማመናቸው
  rationale: ከተሳቢ ጋር ያለውን የምክንያት ትርጉም በአማርኛ በ- ቅጥያ ይገልጻል።
- source_word: ἀπιστίαν
  choice: አለማመን
  rationale: በቅርብ አውዱ የእግዚአብሔርን ቃልና ተስፋ አለማመንን በግልጽ ይገልጻል፤ የታማኝነት ጉድለት ትርጉሙ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ἀπιστίαን ከπίστις የትርጉም ዘርፍ ጋር ማቅረብ
  choice: አለማመን
  alternative: ታማኝ አለመሆን
  rationale: የዕብራውያን 3 ቅርብ አውድ በእግዚአብሔር ተስፋ አለማመንንና እምነት አለመጣልን ያጎላል። ሆኖም ቃሉ ታማኝ አለመሆንንም ሊያመለክት ስለሚችል ያ ልዩነት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የመጀመሪያ መደብ ብዙ ቁጥር ‘እናያለን’ ተጠብቋል፤ የἀπιστία ሁለት ትርጉማዊ ገጽታዎች በዋና ጽሑፍና በማስታወሻ ተከፍለው ቀርበዋል።
