  rationale: የግሪኩን አያያዥ በአማርኛው -ም ቅጥያ በተፈጥሯዊ መንገድ በመግለጽ ከቀደመው ሐሳብ ጋር ያለውን ፍሰት ይጠብቃል።
- source_word: βλέπομεν
