    rationale: The supplied SBLGNT text reads “Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ” and contains no verb or adjective meaning “was faithful.” The idea may be inferred from the preceding contrast but must not be inserted into this verse’s translation.
  - severity: medium
    issue: “በእግዚአብሔር ቤት” over-specifies αὐτοῦ.
    rationale: The immediate context supports reference to God, but αὐτοῦ itself is a pronoun and the syntax permits a relationship to the Son. “በቤቱ ላይ” preserves the source wording’s referential openness.
  - severity: medium
    issue: Footnote b gives “እምነታችንን” as an alternative for παρρησία.
    rationale: παρρησία denotes boldness, openness, frankness, or confidence; “faith” is not an appropriate lexical alternative here.
  - severity: low
    issue: Footnote anchor a is placed after the full first clause rather than directly after the rendering of Χριστός.
    rationale: Moving it directly after “መሲሕ” makes its referent unambiguous.
