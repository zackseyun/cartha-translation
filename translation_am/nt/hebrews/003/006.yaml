  terminology: “መሲሕ” appropriately renders the titular force of Χριστός in this context, with “ክርስቶስ” supplied as an alternative. “ድፍረት” and “መመኪያ” preserve the distinct senses of παρρησία and καύχημα more accurately than the draft’s footnote alternative “እምነት.”
