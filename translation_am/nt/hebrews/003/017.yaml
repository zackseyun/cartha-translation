  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: am
  text: እግዚአብሔርስ ለአርባ ዓመት በእነማን ላይ ተቆጣ? ኃጢአት በሠሩት፣ ሬሳዎቻቸውም በምድረ በዳ በወደቁባቸው ላይ አልነበረምን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσώχθισεν
  choice: የተቆጣው
  rationale: ግሱ ቁጣንና መበሳጨትን ያመለክታል፤ «የተቆጣው» በዘመናዊ አማርኛ ግልጽና በአውዱ ተፈጥሯዊ ነው።
- source_word: τεσσεράκοντα ἔτη
  choice: ለአርባ ዓመት
  rationale: የጊዜ ቆይታውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἁμαρτήσασιν
  choice: ኃጢአት በሠሩት
  rationale: የአኦሪስት አሳታፊውን «ኃጢአት ያደረጉት» የሚለውን ቀጥተኛ ፍቺ በተለመደ አማርኛ ያቀርባል።
- source_word: κῶλα
  choice: ሬሳቸው
  rationale: ቃሉ በቀጥታ የአካል ክፍሎችን ሊያመለክት ቢችልም፣ በዚህ የሞትና የፍርድ አውድ የወደቁ ሬሳዎችን ያመለክታል፤ «ሬሳቸው» የንግግሩን ክብደት ይጠብቃል።
- source_word: ἔπεσεν
  choice: በወደቀው
  rationale: የግሪኩን «ወደቀ» ምስላዊ አገላለጽ ይጠብቃል፤ ሞት በአውዱ የተገለጠ ነው።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: የእስራኤልን የምድረ በዳ ጉዞ የሚያስታውስ የተለመደና የተከበረ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
theological_decisions:
- issue: የπροσώχθισεν ያልተገለጸ ባለቤት
  choice: እግዚአብሔር
  alternative: እርሱ
  rationale: የቀደመው አውድ ባለቤቱ እግዚአብሔር መሆኑን ያሳያል። በአማርኛ ጥያቄው ራሱን ችሎ ግልጽ እንዲሆን ስሙ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። «ምድረ በዳ» የሚለው የታወቀውን መጽሐፍ ቅዱሳዊ አውድ ይጠብቃል፤ ሁለቱ የንግግር ጥያቄዎችም በግሪኩ እንዳሉ ተጠብቀዋል።
