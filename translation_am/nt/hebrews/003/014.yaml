  source_fidelity: The draft correctly conveys participation in the Messiah, the perfect-resultative sense of γεγόναμεν, and the genuine conditional force. However, rendering ὑπόστασις as «እምነት» introduces the distinct concept of faith rather than the contextual sense of confidence/assurance. The revision uses «መተማመን» and retains the sense that this was held from the beginning.
  naturalness: The revised conditional construction is natural modern standard Amharic. «በመጀመሪያ የነበረንን መተማመን» idiomatically expresses the otherwise compressed Greek phrase while the footnote preserves its more literal form.
  terminology: «መሲሑ» appropriately represents Χριστός as a title, and «ተካፋዮች» naturally communicates μέτοχοι. «መተማመን» is preferable to «እምነት» for ὑπόστασις in this context. The alternatives in the revised note retain the wider lexical range without making a theological claim.
  issues:
