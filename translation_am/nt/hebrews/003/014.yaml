base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: am
  text: እኛ በመሲሑ ተካፋዮች[a] ሆነናልና፤ በመጀመሪያ የነበረንን መተማመን[b] እስከ መጨረሻ ጽኑ አድርገን ከያዝን ነው።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመሲሑ ተሳታፊዎች» ወይም «ከመሲሑ ጋር ድርሻ ያለን»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እርግጠኝነት»። የግሪኩ ቃል «መተማመን» ወይም «እርግጠኝነት» ማለት ሊሆን ይችላል፤ በሌሎች ዐውዶች ደግሞ «መሠረት»፣ «ማንነት» ወይም «እውነተኛ ሁኔታ» የሚል ትርጉም ይኖረዋል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «የመተማመናችንን መጀመሪያ እስከ መጨረሻ ጽኑ አድርገን ከያዝን»።
    reason: literal_rendering
lexical_decisions:
- source_word: μέτοχοι
  choice: ተካፋዮች
  rationale: ቃሉ በአንድ ነገር ድርሻ ያላቸውን ወይም ከሌላው ጋር የሚካፈሉትን ያመለክታል፤ «ተካፋዮች» ይህን ተሳትፎ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ማስጠንቀቂያ ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በተፈጥሯዊ የአማርኛ አያያዥ ይገልጣል።
- source_word: τοῦ Χριστοῦ
  choice: በመሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ይሠራል፤ የግሪኩ የድርሻ ግንኙነት በአማርኛ «በመሲሑ ተካፋዮች» በሚለው ተፈጥሯዊ አገላለጽ ቀርቧል።
- source_word: γεγόναμεν
  choice: ሆነናል
  rationale: የፍጹም ጊዜው ቅርጽ ቀድሞ የተፈጠረና ውጤቱ አሁንም የሚኖር ሁኔታን ያሳያል፤ «ሆነናል» ሁለቱንም ገጽታዎች ይጠብቃል።
- source_word: ἐάνπερ
  choice: ከ... ነው
  rationale: የሁኔታውን አጽንዖት የሚጠብቅ የአማርኛ አወቃቀር ነው፤ ሐረጉን እውነተኛ ሁኔታዊ ንግግር አድርጎ ያቀርባል።
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: በመጀመሪያ የነበረንን እምነት
  rationale: ይህ አገላለጽ በመነሻው የነበረውን ጽኑ የመተማመን አቋም ያመለክታል። «እምነት» በዚህ ዐውድ መተማመንን ያስተላልፋል፤ የὑπόστασις ሰፊ የትርጉም ክልል በማስታወሻ ተጠብቋል።
- source_word: μέχρι τέλους
  choice: እስከ መጨረሻው
  rationale: በሙሉ ጉዞው የሚቀጥል ጽናትን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βεβαίαν κατάσχωμεν
  choice: አጽንተን ከያዝን
  rationale: κατέχω መያዝንና ጠብቆ ማቆየትን፣ βεβαίαν ደግሞ ጽናትን ያመለክታል፤ የተዋሐደው አገላለጽ ሁለቱንም ይጠብቃል።
theological_decisions:
- issue: ሁኔታዊው ሐረግና እስከ መጨረሻ መጽናት
  choice: «አጽንተን ከያዝን ነው» ተብሎ እውነተኛ ሁኔታ ሆኖ ቀርቧል።
  alternative: መጽናት የቀድሞ ተሳትፎ ማስረጃ ብቻ ነው ወይም ተሳትፎው በመጽናት ብቻ ይቀጥላል ብሎ መተርጎም።
  rationale: የግሪኩ ጽሑፍ ሁኔታን በግልጽ ያቀርባል፣ ነገር ግን መጽናት፣ መውደቅና የቀድሞ ተሳትፎ ያላቸውን ሥነ መለኮታዊ ግንኙነቶች በሙሉ አይወስንም፤ ትርጉሙ ይህን ውጥረት አልፈታም።
