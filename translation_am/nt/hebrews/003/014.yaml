  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖትና ሁኔታዊ ውጥረት ተጠብቋል፤ የቃላት አሻሚነት በማስታወሻዎች ቀርቧል።
