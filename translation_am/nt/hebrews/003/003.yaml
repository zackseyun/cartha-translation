- from: ይህ ሰው ከሙሴ ይልቅ የላቀ ክብር ይገባዋል ተብሎአል፤ ቤቱን የሠራው ከቤቱ ይልቅ የላቀ ክብር እንዳለው ሁሉ።
  to: ይህ ከሙሴ ይልቅ የላቀ ክብር ለማግኘት ብቁ ሆኖ ተቆጥሯል፤ ቤቱን የሠራው ከቤቱ ይልቅ የላቀ ክብር ያለው በመሆኑ።
