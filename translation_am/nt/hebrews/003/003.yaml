language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: am
  text: ይህ ከሙሴ ይልቅ የላቀ ክብር ለማግኘት ብቁ ሆኖ ተቆጥሯል፤ ቤቱን የሠራው ከቤቱ ይልቅ የላቀ ክብር ያለው በመሆኑ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: በቀደመው አውድ የተጠቀሰውን ኢየሱስን የሚያመለክተውን አሳይ ተውላጠ ስም በተፈጥሯዊ አማርኛ ያቀርባል፤ ስሙን በግልጽ በማከል የምንጩን አገላለጽ አይተካም።
- source_word: πλείονος δόξης ... ἠξίωται
  choice: የላቀ ክብር ይገባዋል ተብሎአል
  rationale: ἠξίωται የሚያመለክተውን ‘ብቁ/የሚገባ ሆኖ ተቆጥሯል’ የሚለውን የፍርድ እና የክብር አሰጣጥ ሐሳብ ይጠብቃል።
- source_word: παρὰ Μωϋσῆν
  choice: ከሙሴ ይልቅ
  rationale: ቀጥተኛውን የንጽጽር ግንኙነት በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: καθ’ ὅσον
  choice: እንዳለው ሁሉ
  rationale: በሁለቱ የክብር ንጽጽሮች መካከል ያለውን መጠናዊ/ምሳሌያዊ ትይዩነት ይጠብቃል።
- source_word: ὁ κατασκευάσας αὐτόν
  choice: ቤቱን የሠራው
  rationale: κατασκευάζω በዚህ የቤት ምሳሌ ውስጥ ‘መሥራት/መገንባት’ ማለት ነው፤ ተሳቢው αὐτόν ቤቱን እንደሚያመለክት በግልጽ ያሳያል።
theological_decisions:
- issue: ‘ይህ ሰው’ ማንን እንደሚያመለክት
  choice: የምንጩን አሳይ አገላለጽ ‘ይህ ሰው’ ማቆየት
  alternative: ‘ኢየሱስ’ ብሎ በግልጽ መጻፍ
  rationale: ቀደም ያለው አውድ ማጣቀሻውን ያሳያል፤ ትርጉሙ በዚህ ቁጥር ያልተጻፈውን ስም ሳያክል የግሪኩን ቅርጽ ይጠብቃል።
- issue: የቤቱን ሠሪ ማንነት በቁጥሩ ውስጥ መወሰን
  choice: ‘ቤቱን የሠራው’ ብሎ ማቆየት
  alternative: ሠሪውን በቀጥታ ኢየሱስ ወይም እግዚአብሔር ብሎ መሰየም
  rationale: ቁጥሩ በምሳሌያዊ ንጽጽር ይናገራል፤ ማንነቱን ከዚህ ቁጥር ብቻ በላይ በመወሰን ያለውን የአውድ ውጥረት መፍታት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ይገባዋል ተብሎአል’ የግሪኩን ፍጹም ተደራጊ ቅርጽ ለማንጸባረቅ ተመርጧል፤ የቤት/ሠሪ ድግግሞሹም ለክርክሩ አስፈላጊ ስለሆነ ተጠብቋል።
