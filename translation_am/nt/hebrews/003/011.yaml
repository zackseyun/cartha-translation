  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: am
  text: በቁጣዬ እንደማልሁ፣ “ወደ ዕረፍቴ ፈጽሞ አይገቡም።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል፣ “ወደ ዕረፍቴ ቢገቡ” ይላል። ይህ “ወደ ዕረፍቴ በፍጹም አይገቡም” ማለት የሆነ የመሐላ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: እንደ
  rationale: የተጠቀሰውን የመሐላ ንግግር ከቀደመው ዐውድ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ὤμοσα
  choice: ማልሁ
  rationale: የὀμνύω ያለፈ ጊዜ ቅርጽ መሐላ መማልን ያመለክታል፤ “ማልሁ” ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἐν τῇ ὀργῇ μου
  choice: በቁጣዬ
  rationale: ὀργή በዚህ የፍርድ ማስጠንቀቂያ ዐውድ መለኮታዊ ቁጣን ያመለክታል፤ “ቁጣ” ክብደቱን ይጠብቃል።
- source_word: Εἰ εἰσελεύσονται
  choice: ፈጽሞ አይገቡም
  rationale: εἰ ከወደፊት ጊዜ ግስ ጋር የተጠቀመው ሴማዊ የመሐላ አገላለጽ ጽኑ እምቢታን ያመለክታል፤ በቃል ብቻ “ቢገቡ” ማለት በአማርኛ ሁኔታዊ ንግግር አስመስሎ ሊያሳስት ይችላል።
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: ወደ ዕረፍቴ
  rationale: “ዕረፍት” በመዝሙር 95 እና በዕብራውያን መልእክት ውስጥ የሚቀጥለውን ጭብጥ ሳያጠብ ይጠብቃል፤ “ወደ” ደግሞ εἰς የሚያሳየውን የመግባት አቅጣጫ ይገልጣል።
theological_decisions:
- issue: የመሐላውን አገላለጽ Εἰ εἰσελεύσονται መተርጎም
  choice: “ፈጽሞ አይገቡም” የሚል ግልጽ አሉታዊ መሐላ
  alternative: በቅርጹ ይበልጥ ቀጥተኛ፣ “ወደ ዕረፍቴ ቢገቡ”
  rationale: የግሪኩና የዕብራይስጡ የመሐላ ፈሊጥ ጽኑ እምቢታ ነው። ግልጽ አሉታዊ አተረጓጎሙ የንግግሩን ኃይል ይጠብቃል፤ የቃል በቃል ቅርጹ ግን እንደ ተራ ሁኔታ ሊሰማ ይችላል።
- issue: κατάπαυσιςን በዐውዱ መተርጎም
  choice: ዕረፍት
  alternative: ማረፊያ
  rationale: “ዕረፍት” ጽሑፉ ከመዝሙር 95 ጋር ያለውን ትስስርና በዕብራውያን ውስጥ የሚዳብረውን ሥነ መለኮታዊ ጭብጥ ይጠብቃል፤ መሬት፣ ሰማይ ወይም ውስጣዊ ሰላም ብቻ ብሎ አያጠበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ቁጣ” የፍርድ ክብደቱን፣ “ዕረፍት” ደግሞ የጽሑፉን ተደጋጋሚ ጭብጥ ይጠብቃሉ።
