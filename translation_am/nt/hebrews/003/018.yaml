  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: am
  text: እንግዲህ፣ ወደ ዕረፍቱ እንዳይገቡ ብሎ መሐላ የገባው ለማን ነበር? ላልታዘዙት ብቻ አይደለምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ላልታዘዙት” ተብሎ የተተረጎመው የግሪክ ግስ ቅርጽ ለመታዘዝ እምቢ ማለትን ሊያጎላ ይችላል፤ በዚህ አውድ ይህ አለመታዘዝ ከአለማመን ጋር በቅርብ የተያያዘ ነው (ዕብ. 3፥19ን ይመልከቱ)።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: ለማን
  rationale: የግሪኩን የጥያቄ ተውላጠ ስም እና የሰዎችን አመልካችነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: እንግዲህ
  rationale: ከቀደመው የክርክር ቅደም ተከተል ጋር ያገናኛል፤ ያልተገባ ተቃርኖ ሳይጨምር የንግግሩን መቀጠል ያሳያል።
- source_word: ὤμοσεν
  choice: ብሎ የማለላቸው
  rationale: የመሐላውን ክብደት ይጠብቃል፤ የመሐላው ይዘትና ተቀባዮቹ በአማርኛ በግልጽ እንዲታዩ ያደርጋል።
- source_word: μὴ εἰσελεύσεσθαι
  choice: አይገቡም
  rationale: ከመሐላው ጋር የተያያዘውን አሉታዊ ይዘት ቀጥተኛ ንግግር በሆነ ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: ወደ ዕረፍቱ
  rationale: የመግባትን አቅጣጫ እና በዕብራውያን ውስጥ ያለውን የእግዚአብሔር ዕረፍት ዋና ጭብጥ ይጠብቃል።
- source_word: εἰ μὴ
  choice: አልነበረምን?
  rationale: መልሱ የታወቀ የንግግር ጥያቄ መሆኑን በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል።
- source_word: τοῖς ἀπειθήσασιν
  choice: ላልታዘዙት
  rationale: ἀπειθέω የሚያመለክተውን ትእዛዝን ያለመቀበል ወይም አለመታዘዝ ይጠብቃል፤ ቃሉን በቀጥታ ‘አለማመን’ ብሎ አይተረጉመውም።
theological_decisions:
- issue: በማስጠንቀቂያው ክፍል ἀπειθήσασιν እንዴት እንደሚተረጎም
  choice: ላልታዘዙት
  alternative: ላላመኑት
  rationale: ቁጥር 19 አለማመንን በግልጽ ቢጠቅስም፣ ይህ ቁጥር ἀπειθέωን ይጠቀማል። ስለዚህ ትርጉሙ በአለማመንና በአለመታዘዝ መካከል ያለውን የአውዱን ጥብቅ ግንኙነት ሳያጠፋ፣ የቃላቱን ልዩነት ይጠብቃል።
