  to: እንግዲህ፣ ወደ ዕረፍቱ እንዳይገቡ ብሎ መሐላ የገባው ለማን ነበር? ላልታዘዙት ብቻ አይደለምን?[a]
  rationale: The revision restores the explicit oath in ὤμοσεν, retains the directional sense of entering God’s rest, and preserves ἀπειθήσασιν as disobedience. The rhetorical “if not” is idiomatically represented by “... ብቻ አይደለምን?” without adding doctrinal interpretation.
