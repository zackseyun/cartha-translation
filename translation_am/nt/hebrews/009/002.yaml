    text: በቃል በቃል፣ «የኅብስቶቹ አቀራረብ»፤ በባሕላዊ አጠራር «ገጸ ኅብስት»።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው «ቅዱሳን ስፍራዎች» የሚል የብዙ ቁጥር ቅርጽ አለው፤ እዚህ ግን የድንኳኑን የመጀመሪያ ክፍል፣ ማለትም ቅድስቱን ያመለክታል።
    reason: lexical_alternative
