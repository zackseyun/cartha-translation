  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: am
  text: በታቦቱም በላይ የክብር ኪሩቤል የስርየት መክደኛውን[a] ጥላ እያጠሉ ነበሩ፤ ስለ እነዚህ ነገሮች አሁን በዝርዝር ለመናገር አይቻልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚህ ዐውድ የታቦቱን ክዳን ያመለክታል፤ በባሕላዊ አጠራር “የምሕረት ዙፋን” ይባላል። የግሪኩ ቃል “ማስተሰረያ” የሚል ፍቺም ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: በታቦቱም ላይ
  rationale: የግሪኩ ተውላጠ ስም በቀደመው ቁጥር የተጠቀሰውን ታቦት ያመለክታል። በአማርኛ ማጣቀሻውን በስም መድገም ግልጽና ተፈጥሯዊ ነው።
- source_word: Χερουβὶν δόξης
  choice: የክብር ኪሩቤል
  rationale: የግሪኩን አጭር የባለቤትነት አገላለጽ ሳይፈታ ይጠብቃል፤ ‘ኪሩቤል’ ደግሞ የተለመደው ብዙ ቁጥር መጠሪያ ነው።
- source_word: κατασκιάζοντα
  choice: ጥላ አጥልተውበት ነበር
  rationale: የኪሩቤሉን ከመክደኛው በላይ ያለ አቀማመጥ በተፈጥሯዊ አማርኛ ይገልጣል፤ በግሪኩ የሌለውን ‘በክንፎቻቸው’ የሚል ማብራሪያ አይጨምርም።
- source_word: τὸ ἱλαστήριον
  choice: የስርየት መክደኛው
  rationale: በዚህ የመቅደስ ዕቃዎች ዐውድ ቃሉ በቀጥታ የታቦቱን ክዳን ያመለክታል፤ ‘የስርየት’ የሚለውም የቃሉን የማስተሰረያ ገጽታ ይጠብቃል።
- source_word: περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: ስለ እነዚህ ነገሮች አሁን በዝርዝር ለመናገር አይቻልም
  rationale: κατὰ μέρος የሚለውን ‘በዝርዝር’ በማለት የጸሐፊውን አጭር የንግግር ማስታወሻ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በመቅደሱ ዕቃዎች ዐውድ ውስጥ የἱλαστήριον አተረጓጎም
  choice: የስርየት መክደኛ
  alternative: የምሕረት ዙፋን፤ ማስተሰረያ
  rationale: የዚህ ቁጥር ቀጥተኛ ማጣቀሻ የታቦቱ ክዳን ስለሆነ ‘መክደኛ’ የቁሱን ማንነት ያሳያል፤ ‘የስርየት’ ደግሞ የቃሉን ሥርየታዊ ትርጉም ሳያጠፋ ይጠብቃል። ባሕላዊውና ይበልጥ ረቂቅ አማራጮች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመቅደስ ዐውዱን ለማሳየት ‘ታቦት’ እና ‘የስርየት መክደኛ’ የሚሉ ቃላት ተመርጠዋል።
