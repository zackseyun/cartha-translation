translation:
  language: am
  text: በውስጧ የወርቅ የዕጣን መሠዊያ[a] እና በየአቅጣጫው በወርቅ የተለበጠው የቃል ኪዳኑ ታቦት የነበራት፤ በዚያም ታቦት ውስጥ መናውን የያዘ የወርቅ ማሰሮ፣ ያቆጠቆጠው የአሮን በትር፣ እና የቃል ኪዳኑ ጽላቶች ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የወርቅ ማዕጠንት።” የግሪኩ θυμιατήριον ዕጣን የሚቃጠልበትን መሣሪያ ሊያመለክት ይችላል፤ በዚህ ስፍራ ያለው ትርጉም አከራካሪ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: θυμιατήριον
  choice: የዕጣን መሠዊያ
  rationale: ቃሉ ዕጣን የሚቃጠልበትን መሣሪያ ወይም መሠዊያ ሊያመለክት ይችላል። በዚህ የማደሪያው ዕቃዎች ዝርዝር ውስጥ ‘የዕጣን መሠዊያ’ ተፈጥሯዊ ነው፤ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: χρυσοῦν
  choice: የወርቅ
  rationale: ‘ወርቃማ’ ወይም ‘ከወርቅ የተሠራ’ የሚለውን ቀጥተኛ ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κιβωτὸν τῆς διαθήκης
  choice: የቃል ኪዳኑ ታቦት
  rationale: ለቅዱሱ ሣጥን በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደና በቀላሉ የሚታወቅ አገላለጽ ነው።
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: በየአቅጣጫው በወርቅ የተለበጠው
  rationale: ፍጹም ተገብሮ አንቀጹና πάντοθεν ታቦቱ በሁሉም ወገን በወርቅ መለበጡን ያጎላሉ።
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: መናውን የያዘ የወርቅ ማሰሮ
  rationale: στάμνος ማሰሮን ወይም ማስቀመጫ ዕቃን ያመለክታል፤ ‘የያዘ’ የἔχουσαን ሐሳብ ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: ያቆጠቆጠው የአሮን በትር
  rationale: ῥάβδος ‘በትር’ ተብሎ በትክክል ይተረጎማል፤ βλαστήσασα የታወቀውን የማቆጥቆጥ ክስተት ያመለክታል።
- source_word: πλάκες τῆς διαθήκης
  choice: የቃል ኪዳኑ ጽላቶች
  rationale: πλάκες ‘ጽላቶች’ ነው፤ በግሪክ ጽሑፉ ያልተገለጸው ‘የድንጋይ’ የሚለው አልተጨመረም።
- source_word: διαθήκης
  choice: ቃል ኪዳን
  rationale: በዚህ የአምልኮና የመጽሐፍ ቅዱስ አውድ ‘ቃል ኪዳን’ ትክክለኛና የተለመደ ነው።
theological_decisions:
- issue: በቅድስተ ቅዱሳኑ መግለጫ ውስጥ የθυμιατήριον ትርጉም
  choice: የዕጣን መሠዊያ
  alternative: የወርቅ ማዕጠንት
  rationale: θυμιατήριον የዕጣን መሠዊያን ወይም ዕጣን የሚታጠንበትን ዕቃ ሊያመለክት ስለሚችል በጥንት የማደሪያ ዕቃዎች አቀማመጥ ላይ የቆየ የትርጓሜ ጥያቄ አለ። ዋናው ጽሑፍ በዚህ ዝርዝር ውስጥ ተፈጥሯዊውን ‘የዕጣን መሠዊያ’ ይጠቀማል፤ እውነተኛውን የቃሉን አሻሚነት ለመጠበቅ ሌላው አማራጭ በግርጌ ማስታወሻ ቀርቧል።
- issue: ἐν ᾗ የሚያመለክተው ቦታና የታቦቱ ዕቃዎች
  choice: በታቦቱም ውስጥ ... ነበሩ
  alternative: ከታቦቱ ጋር የተያያዙ ... ነበሩ
  rationale: ἐν ᾗ በሰዋስው የቃል ኪዳኑን ታቦት ይመለከታልና ቀጥተኛው ‘በታቦቱ ውስጥ’ ተጠብቋል። ከሌሎች የብሉይ ኪዳን ዘገባዎች ጋር ያለውን ውጥረት ትርጉሙ በራሱ አልፈታውም።
