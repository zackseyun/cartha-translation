revisions:
- from: እነዚህም እስከ ማስተካከያው ጊዜ ድረስ የተጫኑ፣ ምግቦችንና መጠጦችን፣ የተለያዩ መታጠቦችንም ብቻ የሚመለከቱ ሥጋዊ ሥርዓቶች ናቸው።
  to: እነዚህም እስከ ማስተካከያው ጊዜ ድረስ የተጫኑ፣ ምግቦችንና መጠጦችን፣ የተለያዩ መታጠቦችንም ብቻ የሚመለከቱ ሥጋን የሚመለከቱ ሥርዓቶች ናቸው።
  rationale: The revision changes only the rendering of δικαιώματα σαρκὸς. It preserves the source’s ambiguity concerning the precise nature of the ‘time of reformation’ while making clear that the regulations concern the bodily/external sphere rather than implying moral fleshliness.
