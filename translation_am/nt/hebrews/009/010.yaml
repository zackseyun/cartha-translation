id: HEB.9.10
reference: Hebrews 9:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: am
  text: እነዚህም እስከ ማስተካከያው ጊዜ ድረስ የተጫኑ፣ ምግቦችንና መጠጦችን፣ የተለያዩ መታጠቦችንም ብቻ የሚመለከቱ ሥጋን የሚመለከቱ ሥርዓቶች ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαφόροις βαπτισμοῖς
  choice: የተለያዩ መታጠቦችን
  rationale: በዚህ የአምልኮ ሥርዓት አውድ βαπτισμοῖς የተለያዩ ሥርዓታዊ መታጠቦችን ያመለክታል፤ ስለዚህ የክርስቲያንን ጥምቀት ብቻ እንዳያስታውስ ‘መታጠቦች’ ተመርጧል።
- source_word: δικαιώματα σαρκὸς
  choice: ሥጋዊ ሥርዓቶች
  rationale: δικαιώματα በዚህ ቦታ የታዘዙ ሥርዓቶችን ያመለክታል፤ σαρκὸς ደግሞ የውጫዊውን ሥጋዊ አካል የሚመለከት መሆኑን ያሳያል። ‘ሥጋዊ’ የሚለው የግሪኩን አጭርነትና ውጥረት ይጠብቃል።
- source_word: ἐπικείμενα
  choice: የተጫኑ
  rationale: ቃሉ በሰዎች ላይ የተጣሉ ወይም የተጫኑ ግዴታዎችን ይገልጣል፤ ‘የተጫኑ’ ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καιροῦ διορθώσεως
  choice: የማስተካከያው ጊዜ
  rationale: διόρθωσις ነገሮችን ወደ ትክክለኛ ሁኔታ ማምጣትን ይጠቁማል። ‘ማስተካከያ’ የጽሑፉን ክፍት አገላለጽ ይጠብቃል።
theological_decisions:
- issue: ‘ሥጋዊ ሥርዓቶች’ የሚለው አገላለጽ ወሰን
  choice: ሥጋዊ ሥርዓቶች
  alternative: ሥጋን የሚመለከቱ ሥርዓቶች
  rationale: የግሪኩን የስም ጥምረት እና በቀዳሚው እንግሊዝኛ ውሳኔ የተጠበቀውን ‘fleshly’ ቅርጽ ይይዛል፤ ይህ ግን ሥርዓቶቹ ኃጢአተኛ ናቸው የሚል ትርጓሜ በግድ አያስገባም።
- issue: ‘የማስተካከያው ጊዜ’ ማንነት
  choice: ጊዜውን በጥቅሉ መተርጎም
  alternative: የአዲሱ ኪዳን ጊዜ ወይም የክርስቶስ መምጣት ብሎ በግልጽ መጨመር
  rationale: ግሪኩ ጊዜውን በዚህ ቁጥር በስም አይለየውም፤ ትርጉሙም የጽሑፉን እውነተኛ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥሩ ከ9፥9 የቀጠለ ሰዋሰዋዊ ክፍል ቢሆንም፣ በተናጠል ሲነበብ እንዲገባ ‘እነዚህም’ እና ‘ናቸው’ ተጨምረዋል።
