  footnotes:
  - marker: a
    text: ወይም፦ «ለአሁኑ ጊዜ ምልክት» ወይም «ለአሁኑ ጊዜ ምሳሌያዊ ሥዕል»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: ይህም
  rationale: ወደ ቀደመው የድንኳን ሥርዓት የሚያመለክተውን አንጻራዊ ትስስር በተፈጥሯዊ አማርኛ ያስቀጥላል።
- source_word: παραβολὴ
  choice: ምሳሌ
  rationale: የምሳሌያዊ ተዛምዶን ሰፊ ትርጉም ይጠብቃል፤ ‘ምልክት’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: ለአሁኑ ዘመን
  rationale: በክርክሩ ውስጥ በዚያን ጊዜ ያለውን ወይም ተግባራዊ የነበረውን ጊዜ በግልጽ አማርኛ ያሳያል።
- source_word: καθ’ ἣν
  choice: በዚህም መሠረት
  rationale: ከተጠቀሰው ምሳሌያዊ የድንኳን ሥርዓት ጋር የመሥዋዕቶቹን ገዥ ግንኙነት በተፈጥሯዊ አገላለጽ ይይዛል።
- source_word: δῶρά τε καὶ θυσίαι
  choice: ስጦታዎችና መሥዋዕቶች
  rationale: ሁለቱን የአምልኮ ቃላት ሳያዋህድ ይጠብቃል።
- source_word: προσφέρονται
  choice: ይቀርባሉ
  rationale: የአሁን ጊዜ ተደራጊ ቅርጽንና ቀጣይ የአምልኮ ተግባርን ያሳያል።
- source_word: μὴ δυνάμεναι
  choice: ማድረግ አይችሉም
  rationale: ስጦታዎቹና መሥዋዕቶቹ ያላቸውን አለመቻል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: κατὰ συνείδησιν
  choice: በሕሊናው ረገድ
  rationale: ፍጹም ማድረጉ የማይፈጸምበትን ዘርፍ ይገድባል፤ ተራ የግል ቅንነትን ብቻ አያመለክትም።
- source_word: τελειῶσαι
  choice: ፍጹም ማድረግ
  rationale: በዕብራውያን መልእክት የሚገኘውን ወደታሰበው ፍጻሜና ብቃት የማድረስ ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: τὸν λατρεύοντα
  choice: አምላኪውን
  rationale: በሥርዓታዊ አምልኮ የተሰማራውን ነጠላ ሰው በአጭርና ግልጽ ቃል ያመለክታል።
