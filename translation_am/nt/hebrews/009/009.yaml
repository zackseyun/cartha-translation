  text: ይህም ለአሁኑ ጊዜ ምሳሌ ነው፤[a] በዚህም መሠረት ስጦታዎችና መሥዋዕቶች ይቀርባሉ፤ እነዚህ ግን አምላኪውን በሕሊናው ረገድ ፍጹም ማድረግ አይችሉም።
