  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: am
  text: ነገር ግን መሲሑ፣ የተገኙት በጎ ነገሮች[a] ሊቀ ካህን ሆኖ በመጣ ጊዜ፣ በሰው እጅ ባልተሠራው፣ የበለጠ ታላቅና የበለጠ ፍጹም በሆነው ድንኳን በኩል—ይህም ማለት ከዚህ ፍጥረት ባልሆነው—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “ወደፊት የሚመጡት በጎ ነገሮች” ይላሉ።
    reason: textual_variant
  - marker: b
    text: የግሪኩ ዓረፍተ ነገር በቁጥር 12 ይቀጥላል፤ “በ... ድንኳን በኩል” የሚለው ሐረግ በዚያ ካለው “ገባ” ጋር ሊያያዝ ይችላል።
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: በዚህ አውድ የቅብዓት ማዕረጉን የሚያሳይ ስለሆነ ‘መሲሕ’ ተመርጧል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ምድራዊ ድንኳንና አገልግሎት ጋር ያለውን ንጽጽር ያሳያል።
- source_word: παραγενόμενος
  choice: መጣ
  rationale: የመሲሑን መምጣትና በሊቀ ካህናትነት መገኘት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀρχιερεὺς
  choice: ሊቀ ካህናት
  rationale: በዕብራውያን መልእክት ውስጥ ለተጠቀሰው የካህናት ሹመት የተለመደና ትክክለኛ ቃል ነው።
- source_word: τῶν γενομένων ἀγαθῶν
  choice: የመጡት በጎ ነገሮች
  rationale: የSBLGNTን γενομένων (‘የመጡት’) ንባብ በቀጥታ ይከተላል፤ ከ‘ወደፊት የሚመጡት’ ንባብ ይለያል።
- source_word: διὰ τῆς ... σκηνῆς
  choice: '... በሆነው ድንኳን'
  rationale: σκηνή የበረሃውን መቅደስ ምስል ያስታውሳል፤ διὰ የሚያመለክተውን ‘በ/በኩል’ ግንኙነትም ይጠብቃል።
- source_word: μείζονος καὶ τελειοτέρας
  choice: ይበልጥ ታላቅና ፍጹም
  rationale: የአካላዊ መጠን ብቻ ሳይሆን የበላይነትንና የፍጹምነትን ንጽጽር ይጠብቃል።
- source_word: οὐ χειροποιήτου
  choice: በሰው እጅ ባልተሠራው
  rationale: የሰው ሠራሽ ካልሆነው ሰማያዊ መቅደስ ጋር ያለውን ንጽጽር በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያቀርባል።
- source_word: τοῦτ’ ἔστιν
  choice: ይህም ማለት
  rationale: የሚከተለውን ማብራሪያ በግልጽ ሁኔታ ያስገባል።
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: የዚህ ፍጥረት ክፍል ባልሆነው
  rationale: ድንኳኑ የአሁኑ የተፈጠረ ሥርዓት አካል አለመሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የτῶν γενομένων ἀγαθῶν ጽሑፋዊ ልዩነት
  choice: የመጡት በጎ ነገሮች
  alternative: ወደፊት የሚመጡት በጎ ነገሮች
  rationale: ዋናው ጽሑፍ የSBLGNTን γενομένων ንባብ ይከተላል፤ በሌሎች የእጅ ጽሑፎች ያለው μελλόντων ንባብ ለግልጽነት በማስታወሻ ተጠብቋል።
- issue: የδιὰ τῆς ... σκηνῆς ሰዋሰዋዊ ትስስር
  choice: ሐረጉ ወደ ቁጥር 12 የሚቀጥለውን የመግባት ድርጊት ሊያብራራ የሚችል ሆኖ ተቀምጧል
  alternative: ሐረጉን ከ‘መጣ’ ጋር በቀጥታ ማያያዝ
  rationale: የግሪኩ ዓረፍተ ነገር እስከ ቁጥር 12 ይቀጥላል፤ ድንኳኑ የመሲሑ መምጣት መንገድ እንደሆነ የሚያስመስል ያልተገባ ግልጽነት አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሰፊው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሊቀ ካህናት’ እና ‘ድንኳን’ የዕብራውያንን የመቅደስ ቃላት ይጠብቃሉ።
