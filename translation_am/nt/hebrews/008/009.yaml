  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: am
  text: ከአባቶቻቸው ጋር ባደረግሁት ቃል ኪዳን የሚመሳሰል አይደለም፤ ከግብፅ ምድር ላወጣቸው እጃቸውን በያዝሁበት ቀን[a] ያደረግሁት አይደለም፤ እነርሱ በቃል ኪዳኔ ጸንተው አልቀጠሉምና፣ እኔም ቸል አልኋቸው[b]፤ ይላል ጌታ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በተለመደ አነጋገር፣ “እጃቸውን ይዤ ከግብፅ ምድር ባወጣኋቸው ጊዜ።”
