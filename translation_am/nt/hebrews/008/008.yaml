  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: am
  text: እነርሱን በመውቀስ እንዲህ ይላልና፦ “እነሆ፣ ቀናት ይመጣሉ፣ ይላል ጌታ፣ ከእስራኤል ቤትና ከይሁዳ ቤት ጋር አዲስ ኪዳን የማቋቋምበት፣”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: እነርሱን በመውቀስ
  rationale: ተሳቢውን ‘እነርሱን’ እንደ SBLGNT ዋና ንባብ ጠብቆ፣ μεμφόμενος የሚያመለክተውን ነቀፋ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የትንቢት መግቢያ በክቡርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጣል።
- source_word: συντελέσω
  choice: የምፈጽም
  rationale: ግሱ ኪዳኑን ማጠናቀቅ፣ በተግባር ማቋቋም ወይም ማድረስን ያመለክታል፤ ‘እፈጽማለሁ’ ይህን ስፋት ይጠብቃል።
- source_word: διαθήκην καινήν
  choice: አዲስ ኪዳን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ንግግር የተለመደውንና የቃሉን የቃል ኪዳናዊ ይዘት የሚጠብቀውን አገላለጽ ይጠቀማል።
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: ከእስራኤል ቤትና ከይሁዳ ቤት ጋር
  rationale: ‘ቤት’ የዘር፣ የሕዝብና የሥርወ መንግሥት ማኅበረሰብን ሊያመለክት የሚችለውን ምሳሌያዊ አገላለጽ ሳይፈታ ይጠብቃል።
theological_decisions:
- issue: የነቀፋው ተሳቢ
  choice: እነርሱን
  alternative: ኪዳኑን / በእነርሱ ላይ እንከን በማግኘት
  rationale: የቀረበው SBLGNT ጽሑፍ αὐτοὺς ይዟል፤ ስለዚህ ነቀፋውን በሰዎቹ ላይ ያደርጋል፣ የቀድሞውን ኪዳን በቀጥታ ጉድለት ያለበት ብሎ አይተረጉምም።
- issue: ኪዳኑ የሚመሠረትበት ግንኙነት
  choice: ከ... ጋር
  alternative: በ... ላይ
  rationale: ἐπί ከተሳቢ ጋር በዚህ የኪዳን አውድ ግንኙነትን ያሳያል፤ ‘ከ...ጋር’ በዘመናዊ አማርኛ ኪዳን በሁለት ወገኖች መካከል መደረጉን በተፈጥሮ ይገልጣል።
translation_notes:
