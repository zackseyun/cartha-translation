- source_word: ἀρχιερέα
  choice: ሊቀ ካህናት
  rationale: ለካህናት አለቃው ሹመት የተለመደና ትክክለኛ የመጽሐፍ ቅዱስ ቃል ነው።
- source_word: ἐκάθισεν
  choice: ተቀመጠ
