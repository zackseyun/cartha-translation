theological_decisions:
- issue: ‘ግርማ’ የሚለውን ለእግዚአብሔር የሚያመለክተውን ስያሜ ግልጽ ማድረግ
  choice: የግርማው
  alternative: የእግዚአብሔር ዙፋን
  rationale: ምንጩ ቀጥታ θεός ከማለት ይልቅ አክብሮታዊ ተዘዋዋሪ ስያሜ ይጠቀማል፤ ይህን የንግግር ደረጃና ትርጉማዊ ጥልቀት ተጠብቋል።
- issue: ἐκάθισενን የተጠናቀቀ የክህነት ሥራ ትርጓሜ በመጨመር መተርጎም
  choice: ተቀመጠ
  alternative: ሥራውን ፈጽሞ በድል ተቀመጠ
  rationale: የዕብራውያን መልእክት ዐውድ ይህን አንድምታ ቢያሳይም፣ በዚህ ጥቅስ ያልተጻፈ የትርጓሜ ማብራሪያ አልተጨመረም።
