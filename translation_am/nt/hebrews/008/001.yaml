lexical_decisions:
- source_word: Κεφάλαιον
  choice: ዋና ነጥብ
  rationale: በዚህ የንግግር ሽግግር ዐውድ ቃሉ የክርክሩን ዋና ሐሳብ ወይም ማጠቃለያ ያመለክታል፤ ቃል በቃል ‘ምዕራፍ’ ማለት አይደለም።
- source_word: δὲ
  choice: በአማርኛው የዓረፍተ ነገሩ አወቃቀር በተዘዋዋሪ ተገልጿል
  rationale: δέ እዚህ ጠንካራ ተቃርኖን ሳይሆን ለስላሳ የንግግር ሽግግርን ያመለክታል፤ ‘አሁን’ ማለት የጊዜ ትርጉም ሊያስገባ ስለሚችል አልተጨመረም።
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: የሚነገረው ነገር
  rationale: የግሪኩን የአሁን ጊዜ ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοιοῦτον
  choice: እንዲህ ያለ
  rationale: ቀደም ሲል የተገለጸውን ዓይነት ሊቀ ካህናት ወደ ኋላ በማመልከት ያገናኛል።
- source_word: ἔχομεν
  choice: አለን
