    text: ወይም፣ ‘ጎረቤቱን።’ የዕብራውያን የግሪክ ጽሑፍ ‘አብሮ ዜጋውን’ ይላል፤ መሠረት የሆነው የኤርምያስ ክፍል ግን በተለምዶ ‘ጎረቤቱን’ ተብሎ ይተረጎማል።
