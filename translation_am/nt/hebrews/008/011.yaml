lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: ፈጽሞ አያስተምርም
  rationale: οὐ μή ያለውን አጽንዖታዊ እምቢታ ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἕκαστος
  choice: እያንዳንዱ
  rationale: ቃሉ በማኅበረሰቡ ውስጥ ላሉ ግለሰቦች አንድ በአንድ የሚያመለክተውን አከፋፋይ ኃይል ይጠብቃል።
- source_word: πολίτην
  choice: ወገኑን
  rationale: πολίτης በመሠረቱ አብሮ የአንድ ማኅበረሰብ ወይም ከተማ አባል የሆነን ሰው ያመለክታል። ‘ወገን’ በአማርኛ ይህን የጋራ ማኅበረሰብ ትስስር በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ ‘ጎረቤት’ የኤርምያስን የተለመደ አተረጓጎም ቢያንጸባርቅም የዕብራውያንን የግሪክ ቃል በቀጥታ አይከተልም።
- source_word: ἀδελφόν
  choice: ወንድሙን
  rationale: የግሪክ ቃሉን ተባዕታይ ነጠላ ቅርጽና የቤተሰብ ትስስር ይጠብቃል።
- source_word: Γνῶθι
  choice: ዕወቅ
  rationale: የነጠላ ትእዛዝ ቅርጹን ቀጥተኛና ግልጽ በሆነ አማርኛ ያቀርባል።
- source_word: κύριον
  choice: ጌታን
  rationale: በቃል ኪዳናዊው የኤርምያስ ጥቅስ አውድ κύριοςን በተገቢው መንገድ ይተረጉማል።
- source_word: πάντες εἰδήσουσίν με
  choice: ሁሉም ያውቁኛል
  rationale: πάντες የሚያሳየውን ሁሉን አቀፍነትና με የሚለውን ግልጽ ተሳቢ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: ከታናሹ እስከ ታላቁ ድረስ
  rationale: በቡድኑ ውስጥ ካለው ዝቅተኛ እስከ ከፍተኛ ድረስ ሁሉን የሚያካትተውን ፈሊጣዊ ክልል ያስተላልፋል።
theological_decisions:
