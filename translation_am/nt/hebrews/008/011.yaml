  choice: ወገኑን
  alternative: ጎረቤቱን
  rationale: የዕብራውያን የግሪክ ጽሑፍ πολίτην ስለሚል፣ ዋናው ጽሑፍ የጋራ ማኅበረሰብ አባልነትን የሚያሳይ ‘ወገን’ ይጠቀማል። በኤርምያስ ጥቅስ የተለመደው ‘ጎረቤት’ ግን በማስታወሻ ተጠብቋል።
- issue: ἀδελφόν ያለውን ጾታዊ የቤተሰብ ቃል መተርጎም
  choice: ወንድሙን
  alternative: ወንድሙን ወይም እኅቱን
  rationale: ምንጩ ተባዕታይ ነጠላ ስለሆነ ቅርጹና የቤተሰብ ምስሉ ተጠብቋል፤ የተስፋው ሁሉን አቀፍ ወሰን ደግሞ πάντες እና ‘ከታናሹ እስከ ታላቁ’ በሚሉት ቃላት ግልጽ ነው።
