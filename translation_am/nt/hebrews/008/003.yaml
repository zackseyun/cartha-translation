id: HEB.8.3
reference: Hebrews 8:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: am
  text: እያንዳንዱ ሊቀ ካህናት መባዎችንም መሥዋዕቶችንም ያቀርብ ዘንድ ይመደባልና፤ ስለዚህ ይህም የሚያቀርበው አንዳች ነገር ሊኖረው ያስፈልጋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: እያንዳንዱ ሊቀ ካህናት ... ነውና
  rationale: πᾶς ከነጠላ ስም ጋር ያለውን አከፋፋይ ትርጉም ‘እያንዳንዱ’ ይጠብቃል፤ γάρ ደግሞ ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በ‘ነውና’ ያሳያል። ‘ሊቀ ካህናት’ በዕብራውያን የἀρχιερεύς የተለመደና ትክክለኛ ማቻ ነው።
- source_word: εἰς τὸ προσφέρειν
  choice: እንዲያቀርብ
  rationale: εἰς ከተውሳከ ግስ ጋር የዓላማ ኃይል አለው፤ ‘እንዲያቀርብ’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δῶρά τε καὶ θυσίας
  choice: ስጦታዎችንም መሥዋዕቶችንም
  rationale: τε καὶ ያጣመራቸውን ሁለት የአምልኮ ምድቦች ‘-ንም ... -ንም’ ያንጸባርቃል፤ δῶρα እና θυσίαι ሳይዋሃዱ ተለይተው ተጠብቀዋል።
- source_word: καθίσταται
  choice: ይሾማል
  rationale: በክህነት አውድ የተግባር ወይም የሹመት መመደብን ያመለክታል፤ ‘ይሾማል’ አጭርና ተፈጥሯዊ ነው።
- source_word: ὅθεν
  choice: ስለዚህ
  rationale: ከቀደመው አረፍተ ነገር የሚወጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: ἀναγκαῖον ἔχειν
  choice: ሊኖረው ያስፈልጋል
  rationale: የግዴታን ወይም የአስፈላጊነትን ሐሳብ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τι
  choice: አንዳች ነገር
  rationale: ያልተወሰነ ነገር ማመልከቱን ይጠብቃል፤ እዚህ የሚቀርብ ነገር ሆኖ ይገባል።
- source_word: καὶ τοῦτον
  choice: ይህኛውም
  rationale: τοῦτον ያለውን አመልካች ኃይል ‘ይህኛው’ ይጠብቃል፤ καί በ‘-ም’ ተንጸባርቋል። አውዱ ኢየሱስን ቢያመለክትም ዋናው ጽሑፍ ስሙን አይጨምርም።
- source_word: ὃ προσενέγκῃ
  choice: የሚያቀርበው
  rationale: ከτι ጋር ተያይዞ ‘ሊያቀርበው የሚችለው/የሚያቀርበው ነገር’ የሚለውን የታሰበ ወይም የሚቻል ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የτοῦτον (‘ይህኛው’) አመልካች
  choice: ዋናው ጽሑፍ ‘ይህኛውም’ ብሎ አመልካቹን ሳይፈታ ይተዋል፤ አውዱ ኢየሱስን እንደ ሊቀ ካህናት ያመለክታል።
  alternative: በዋናው ጽሑፍ ‘ኢየሱስም’ ወይም ‘ክርስቶስም’ ብሎ በግልጽ መጨመር።
  rationale: ግሪኩ ስም ሳይጠቅስ አመልካች ተውላጠ ስም ይጠቀማል። ስለዚህ ትርጉሙ የምንጩን አገላለጽና በአውዱ የሚፈታውን አመልካች ይጠብቃል።
- issue: የአምልኮ ቃላት
  choice: ‘ስጦታዎች’ እና ‘መሥዋዕቶች’ እንደ ሁለት የተለያዩ ምድቦች ተጠብቀዋል።
  alternative: ሁለቱን ‘መባዎች’ በሚል አንድ ቃል ማዋሃድ ወይም ‘የመሥዋዕት ስጦታዎች’ ብሎ መተርጎም።
  rationale: ጥቅሱ ሁለት የክህነት ምድቦችን ለይቶ ይጠቅሳል፤ ስለ ክርስቶስ መሥዋዕት ከጥቅሱ በላይ የሆነ ማብራሪያ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ይህኛውም’ የግሪኩን አመልካችነት ይጠብቃል፤ ትርጉሙን ለማሳለጥ የማያስፈልግ የግለሰብ ስም አልተጨመረም።
