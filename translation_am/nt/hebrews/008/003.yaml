  to: እያንዳንዱ ሊቀ ካህናት መባዎችንም መሥዋዕቶችንም ያቀርብ ዘንድ ይመደባልና፤ ስለዚህ ይህም የሚያቀርበው አንዳች ነገር ሊኖረው ያስፈልጋል።
