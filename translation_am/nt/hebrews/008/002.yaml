- source_word: λειτουργὸς
  choice: የሚያገለግል
  rationale: ቃሉ ሕዝባዊና በተለይም ካህናዊ የአምልኮ አገልግሎትን ይገልጣል፤ በአማርኛ የግስ አገላለጹ ተፈጥሯዊና ግልጽ ነው።
- source_word: σκηνῆς
  choice: ድንኳን
  rationale: በዕብራውያን መልእክት የሙሴን የመገናኛ ድንኳንና ሰማያዊውን አቻውን ያስታውሳል።
- source_word: ἀληθινῆς
  choice: እውነተኛው
  rationale: ምድራዊው ቅጂ ከሆነው ጋር ያለውን ንጽጽር ሳያብራራ የዋናውንና እውን የሆነውን ድንኳን ያመለክታል።
- source_word: ἔπηξεν
  choice: ተከለው
  rationale: ግሱ ድንኳንን መትከል ወይም ማቆም የሚለውን ምስል ይጠብቃል፤ በአማርኛም ድንኳንን ‘መትከል’ ተፈጥሯዊ ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: κύριος በዚህ አውድ በተለመደውና በክብር ባለው መንገድ ‘ጌታ’ ተብሎ ተተርጉሟል።
- source_word: οὐκ ἄνθρωπος
  choice: ጌታ እንጂ ሰው ባልተከለው
  rationale: የግሪኩን አጭር ንጽጽር በተፈጥሯዊ የአማርኛ ‘እንጂ’ አወቃቀር ያቀርባል፤ ‘ሰው’ የሰው ዘርን በአጠቃላይ ያመለክታል።
theological_decisions:
- issue: የτῶν ἁγίων ተሳቢና ከሰማያዊው መቅደስ ጋር ያለው ግንኙነት
  choice: የአምልኮ ቅዱሳን ስፍራዎች
  alternative: ቅዱሳን ሰዎች፤ ወይም መቅደሱ በነጠላ
  rationale: የዕብራውያን 8፥1-5 አውድ ስለ መሲሑ ሊቀ ካህናትነትና ስለ ሰማያዊው መቅደስ ይናገራል። ‘ቅዱሳን ስፍራዎች’ የአምልኮውን አውድና የግሪኩን ብዙ ቁጥር ይጠብቃል፤ ቃሉ በአማርኛ ‘ቅዱሳን ሰዎች’ እንዳይመስል ‘ስፍራዎች’ ተጨምሯል።
- issue: የοὐκ ἄνθρωπος አጠቃላይ ኃይል
  choice: ሰው ባልተከለው
  alternative: አንድ ሰው ባልተከለው፤ የሰው ልጅ ባልተከለው
  rationale: ንጽጽሩ በጌታ ሥራና በሰው ሥራ መካከል ነው። ‘ሰው’ በአማርኛ የሰውን ዘር በአጠቃላይ በግልጽና አጭር መንገድ ይወክላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥሩ ከ8፥1 የሚቀጥል ሰዋሰዋዊ ክፍል ቢሆንም፣ በተናጠል ሲነበብ ግልጽ እንዲሆን ‘ነው’ ተጨምሯል። የግሪኩ የመቅደስ ቋንቋና የጌታ/ሰው ንጽጽር ተጠብቀዋል።
