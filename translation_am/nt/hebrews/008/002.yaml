review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands τῶν ἁγίων in its cultic sense, preserves the tabernacle imagery of σκηνή, and retains the Lord-versus-human contrast. However, the Amharic relative construction "ጌታ እንጂ ሰው ባልተከለው" is syntactically unclear and can obscure that the Lord—not a human—set up the tabernacle. Rendering λειτουργός as a finite relative verb with "በ" also somewhat shifts the genitive sense from minister of the holy places/tabernacle to one serving merely in them.
  naturalness: '"የቅዱሳት ስፍራዎችና የእውነተኛው ድንኳን አገልጋይ" is a natural, concise modern Amharic nominal expression and better reflects the Greek genitives. "ጌታ የተከለው፣ ሰው ያልተከለው" is clear and retains the emphatic contrast without adding interpretation.'
  terminology: ቅዱሳት ስፍራዎች, አገልጋይ, እውነተኛው ድንኳን, ጌታ, and ሰው are appropriate in modern standard Amharic. The feminine form ቅዱሳት agrees with the feminine noun ስፍራዎች. "መትከል" is idiomatic for pitching or setting up a tent.
  issues:
  - severity: medium
    issue: The relative clause describing the tabernacle is unclear.
    rationale: '"ጌታ እንጂ ሰው ባልተከለው" does not cleanly express the Greek contrast that the Lord set it up and a human did not. A paired affirmative/negative relative clause makes both subjects and actions explicit.'
  - severity: low
    issue: The expression for λειτουργός weakens the genitive relation.
    rationale: '"በ... የሚያገለግል" primarily denotes service in a place, whereas the Greek calls him a minister of the holy places and of the tabernacle. A genitive-style nominal expression better preserves the construction.'
  revised_text: የቅዱሳት ስፍራዎችና[a] ጌታ የተከለው፣ ሰው ያልተከለው፣ የእውነተኛው ድንኳን አገልጋይ ነው።[b]
