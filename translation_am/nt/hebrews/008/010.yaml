id: HEB.8.10
reference: Hebrews 8:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: am
  text: “ይህ ከእነዚያ ቀኖች በኋላ ከእስራኤል ቤት ጋር የምገባው ቃል ኪዳን ነውና፤ ጌታ ይላል፦ ሕጎቼን በአእምሯቸው ውስጥ እያኖርኩ፣ በልቦቻቸውም ላይ እጽፋቸዋለሁ፤ እኔም አምላካቸው እሆናለሁ፣ እነርሱም ሕዝቤ ይሆናሉ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη / διαθήσομαι
  choice: ቃል ኪዳን / ቃል ኪዳን የምገባው
  rationale: በኤርምያስ የተመሠረተውን የኪዳን ትርጉም ይጠብቃል፤ የመጨረሻ ኑዛዜን አያመለክትም።
- source_word: οἴκῳ Ἰσραήλ
  choice: ከእስራኤል ቤት ጋር
  rationale: የትንቢቱን ማኅበራዊና ኪዳናዊ አገላለጽ ከማሳጠር ይልቅ ይጠብቃል።
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: ከእነዚያ ቀኖች በኋላ
  rationale: የግሪኩን ቀጥተኛ ጊዜያዊ አገላለጽና የትንቢት ድምፅ ያቆያል።
- source_word: διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν
  choice: ሕጎቼን በአእምሮአቸው ውስጥ እያኖርኩ
  rationale: νόμους የሚለውን ብዙ ቁጥር እና διάνοια የሚያመለክተውን የማሰብና የመረዳት አቅም ይጠብቃል፤ የግሪኩን አንቀጽ ቅርጽም በ“እያኖርኩ” ያንጸባርቃል።
- source_word: ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς
  choice: በልቦቻቸውም ላይ እጽፋቸዋለሁ
  rationale: “ላይ” የሚለው የመጻፍን ምስል በግልጽ ያቆያል፤ የሕጎቹ ብዙ ቁጥርም በተውላጠ ስሙ ይገለጣል።
- source_word: ἔσομαι αὐτοῖς εἰς θεόν ... αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: አምላካቸው እሆናለሁ ... ሕዝቤ ይሆናሉ
  rationale: የተለመደውንና ተፈጥሯዊውን የኪዳን ቀመር ያቆያል።
theological_decisions:
- issue: የኤርምያስን የኪዳን ጥቅስ ትስስር መጠበቅ
  choice: “የእስራኤል ቤት፣” “ሕጎቼ፣” “በልቦቻቸው ላይ፣” “አምላካቸው፣” እና “ሕዝቤ” የሚሉትን የኪዳን ቃላት ማቆየት
  alternative: የትንቢታዊውን አገላለጽ በዘመናዊ ሐረግ ማሳጠር
  rationale: የዕብራውያን ጸሐፊ የኤርምያስን ኪዳናዊ ቋንቋ በቀጥታ ይጠቀማል፤ ትርጉሙም ይህን የቅዱሳት መጻሕፍት ትስስር ሊያሳይ ይገባል።
- issue: διδοὺς የሚለውን አንቀጽና ἐπιγράψω የሚለውን የወደፊት ግስ ጥምረት
  choice: “እያኖርኩ፣ ... እጽፋቸዋለሁ” ብሎ የተለያየውን የግስ ቅርጽ ማቆየት
  alternative: “አኖራለሁ፣ ... እጽፋቸዋለሁ” ብሎ ሁለቱንም የወደፊት ግስ ማድረግ
  rationale: ዋናው ጽሑፍ የግሪኩን ትንሽ ያልተለመደ አወቃቀር ሳይደብቅ በሚገባ ያንጸባርቃል፤ ለስላሳው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለአብዛኛው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ቃል ኪዳን” እና “የእስራኤል ቤት” የሚሉት አገላለጾች የትንቢታዊውን ጥቅስ ድምፅና ትስስር ለመጠበቅ ታስበው ተመርጠዋል።
