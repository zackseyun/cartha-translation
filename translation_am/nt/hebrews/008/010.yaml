    rationale: διδοὺς is a participle, not a clause. The explanatory note should use ‘የግስ ተሳቢ ቅርጽ’ to avoid a grammatical error.
  - severity: low
    issue: Citation introduction is slightly awkwardly punctuated and ordered
    rationale: Placing ‘ጌታ ይላል፦’ before the promise is natural Amharic and preserves its function as the citation formula.
