  rationale: ቃሉ ወንዶችን ብቻ ሳይሆን የሰው ልጆችን በአጠቃላይ ያመለክታል፤ ‘ሰዎች’ ይህን አጠቃላይ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
