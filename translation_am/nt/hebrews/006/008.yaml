- source_word: ἀκάνθας καὶ τριβόλους
  choice: እሾህና አሜከላ
  rationale: ሁለቱን የሚወጉ እና የማይፈለጉ እፅዋት በተለመደ የአማርኛ የእርሻ ቃላት ይገልጣል።
- source_word: ἀδόκιμος
  choice: የማትጠቅም
  rationale: ፈተናውን ያላለፈችና ጥቅም የሌላት መሬት የሚለውን የእርሻ አውድ በግልጽ አማርኛ ያስተላልፋል፤ ‘የተጣለች’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: κατάρας ἐγγύς
  choice: እርግማንም ቀርቧታል
  rationale: የግሪኩን ስማዊ አገላለጽ ‘ለእርግማን ቅርብ’ ሳይለውጥ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἧς τὸ τέλος
  choice: መጨረሻዋም
  rationale: የሴት ፆታ አመልካቹን ከቀደመው ‘መሬት’ ጋር ያያይዛል፤ τέλος ያለውን የመጨረሻ ወይም የውጤት ኃይል ይጠብቃል።
- source_word: εἰς καῦσιν
  choice: መቃጠል ነው
  rationale: የዓላማንና የውጤትን አገላለጽ ይጠብቃል፤ ጽሑፉ በግልጽ ያልጠቀሰውን የፍርድ ዝርዝር አይጨምርም።
