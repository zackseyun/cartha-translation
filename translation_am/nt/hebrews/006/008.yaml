  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: am
  text: 'እሾህና አሜከላ የምታበቅል ከሆነ ግን፣ የማትጠቅም[a] ናት፤ ለእርግማንም ቅርብ ናት፤ መጨረሻዋም ለመቃጠል ነው።


    [a] ወይም፣ «የተጣለች»።'
  philosophy: optimal-equivalence
