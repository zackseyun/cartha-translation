  naturalness: The clause is otherwise clear and suitably formal modern Amharic. Removing the redundant verbal pairing makes the opening more concise and avoids suggesting a literal physical fall followed by a separate departure.
  terminology: '"ንስሐ," "የእግዚአብሔር ልጅ," and "በአደባባይ ለውርደት እያጋለጡት" are appropriate. "የራቁትን" preserves the seriousness of apostasy without imposing a technical doctrinal conclusion.'
