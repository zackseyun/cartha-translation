  alternative: ‘እኛን ወክሎ’ ወይም ‘በእኛ ምትክ’
  rationale: አውዱ ኢየሱስ ከአማኞች ቀድሞ ወደ ሰማያዊው ቅዱስ ስፍራ መግባቱን ያጎላል። ‘ለእኛ’ ይህን ስፋት ይጠብቃል፤ ጥቅሱ በግልጽ ያልወሰነውን የሥርየት ቀመር አያስገባም።
