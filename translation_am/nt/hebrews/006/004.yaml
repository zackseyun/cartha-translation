  source_fidelity: The draft accurately conveys the three participial descriptions, but it adds “እንደገና ለንስሓ ማደስ” (“to renew again to repentance”) from Hebrews 6:6. That wording is not present in the supplied Greek text of 6:4 and must not be imported into this verse. The revised text retains the deliberately unfinished syntax, since the Greek construction continues into the following verse.
  naturalness: “ብርሃን የተቀበሉትን” is a more natural modern Amharic way to preserve the passive image of being enlightened than “ብርሃንን ያገኙትን.” The retained dash and semicolon appropriately signal that the clause is incomplete at this verse boundary.
  terminology: “ሰማያዊውን ስጦታ” and “የመንፈስ ቅዱስ ተካፋዮች” are suitable and do not specify the disputed identity or extent of these experiences. The notes preserve the lexical and interpretive openness of φωτισθέντας, γευσαμένους, and μετόχους.
