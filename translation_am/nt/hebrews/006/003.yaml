  text: And this we will do[a], if indeed God permits.
translation:
  language: am
  text: ደግሞም እግዚአብሔር በእርግጥ ቢፈቅድ፣ ይህን እናደርጋለን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔር ቢፈቅድልን።” በግሪክኛው “በእርግጥ” ተብሎ የተተረጎመው ቃል ሁኔታዊውን ንግግር ያጠናክራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ደግሞም
  rationale: ከቀደመው ሐሳብ ጋር ያገናኛል፤ በዚህ አውድ ‘ደግሞም’ ተፈጥሯዊ የአማርኛ አገናኝ ነው።
- source_word: τοῦτο
  choice: ይህን
  rationale: ነጠላውን ገላጭ ተውላጠ ስም ይጠብቃል፤ በቀደመው ቁጥር የተገለጸውን ወደ ፍጹምነት የመሄድ እርምጃ ያመለክታል።
- source_word: ποιήσομεν
  choice: እናደርጋለን
  rationale: የወደፊት ጊዜ አመልካቹንና የመጀመሪያ ሰው ብዙ ቁጥርን በቀጥታ ይጠብቃል፤ ከአውዱ ትርጉም በላይ ‘እንቀጥላለን’ ብሎ አይተረጉምም።
- source_word: ἐάνπερ
  choice: በእርግጥ ቢፈቅድ
  rationale: ‘ቢ-’ ሁኔታዊነቱን፣ ‘በእርግጥ’ ደግሞ περ የሚጨምረውን አጽንዖት ያስተላልፋሉ።
- source_word: ἐπιτρέπῃ
  choice: ቢፈቅድ
  rationale: ἐάνπερ ከተከተለው የንዑስ አንቀጽ ግስ ጋር ያለውን እውነተኛ ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ θεός
  choice: እግዚአብሔር
  rationale: ለθεός በአማርኛ የመጽሐፍ ቅዱስ ንባብ የተለመደ፣ የተከበረና ለዘመናዊ አንባቢ ግልጽ ስያሜ ነው።
theological_decisions:
- issue: የእግዚአብሔርን ፈቃድ የሚመለከተው ሁኔታዊ ንግግር
  choice: የጸሐፊውን የወደፊት ዓላማ መግለጽ፣ ነገር ግን ፍጻሜውን በእግዚአብሔር ፈቃድ ሥር ማድረግ
  alternative: ‘እግዚአብሔር ቢሻ’ የሚል የላላ ፈሊጣዊ አባባል፣ ወይም ጽሑፉ ከሚለው በላይ የመለኮታዊ አስገዳጅነትን የሚያክል ትርጓሜ
  rationale: የግሪኩ ንግግር እውነተኛና አጽንዖት ያለውን ሁኔታ ይገልጻል። ትርጉሙ የሰውን ዓላማና የእግዚአብሔርን ፈቃድ አብሮ በማቆየት መለኮታዊ ውጥረቱን ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚነበብ አማርኛን ይጠቀማል። የግሪኩን አጭር አወቃቀር ለተፈጥሯዊ የአማርኛ ቅደም ተከተል አስተካክሏል፤ የሁኔታዊውን ንግግር አጽንዖት ግን ጠብቋል።
