base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: am
  text: ብዙ ጊዜ በላይዋ የሚዘንበውን ዝናብ የምትጠጣና፣ ለእነዚያ የሚጠቅም ተክል[a] የምታበቅል፣ ለእነዚያው ሲባል ደግሞ የምትታረሰው መሬት ከእግዚአብሔር በረከትን ትቀበላለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዕፅዋት፣” “ሣር፣” “ቅጠላ ቅጠል” ወይም “ሰብል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: መሬት
  rationale: በእርሻ ምሳሌው ውስጥ የሚታረስን መሬት በተፈጥሯዊና ሰፊ ትርጉም ያመለክታል።
- source_word: πιοῦσα
  choice: የምትጠጣ
  rationale: መሬቱ ዝናብን እንደሚጠጣ የሚያቀርበውን ሕያው ዘይቤ ይጠብቃል።
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: ብዙ ጊዜ በላይዋ የሚዘንበውን ዝናብ
  rationale: πολλάκιςን ‘ብዙ ጊዜ’ ብሎ ይጠብቃል፤ በአማርኛ የዝናብን መምጣት ‘መዝነብ’ ብሎ መግለጽ ተፈጥሯዊ ነው።
- source_word: τίκτουσα
  choice: የምታበቅል
  rationale: መሬት ተክልን ማፍራቷን በዘመናዊና ተፈጥሯዊ የእርሻ አገላለጽ ያሳያል።
- source_word: βοτάνην
  choice: ተክል
  rationale: ቃሉ በአጠቃላይ የሚበቅል ዕፅዋትን ያመለክታል፤ ‘ተክል’ ግልጽና ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
- source_word: εὔθετον
  choice: ጥቅም የሚሆን
  rationale: የተክሉን ተስማሚነትና ጠቃሚነት ግልጽ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: ለእነዚያው ሲባል ደግሞ ትታረሳለች
  rationale: διά ከወንድ ብዙ ተሳቢ ጋር የሚገልጸውን ምክንያት ወይም ዓላማ ‘ሲባል’ በማለት ይጠብቃል፤ καίም ‘ደግሞ’ ተብሎ ተካቷል።
- source_word: μεταλαμβάνει
  choice: ትቀበላለች
  rationale: መሬቱ ከእግዚአብሔር በረከት እንደሚያገኝ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: ከእግዚአብሔር በረከትን
  rationale: የበረከቱን ምንጭ በግልጽ ይጠብቃል፤ የግሪኩን ያልተወሰነ አገላለጽ ያለ ተጨማሪ ትርጓሜ ያስተላልፋል።
