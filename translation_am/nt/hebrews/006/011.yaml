  rationale: የግሪኩ ሐረግ የሰውን ውስጣዊ መተማመንና ከተስፋው ጋር የተያያዘውን የተረጋገጠ ተስፋ ቃል አንድ ላይ ሊያስተጋባ ይችላል። ትርጉሙ ይህን ውጥረት አይዘጋውም።
