lexical_decisions:
- source_word: καὶ οὕτως
  choice: እንዲሁም
  rationale: ከቀደመው ስለ አብርሃምና ስለ እግዚአብሔር መሐላ ከተነገረው ሐሳብ ጋር ያገናኛል፤ የአካሄድና የውጤት ስሜቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μακροθυμήσας
  choice: በትዕግሥት ከጠበቀ በኋላ
  rationale: የአንቀጹን ጊዜያዊ ቅደም ተከተልና ረጅም ጊዜ በትዕግሥት የመጽናትን ሐሳብ በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ἐπέτυχεν
  choice: አገኘ
  rationale: ግሱ አንድን ነገር መድረስ፣ ማግኘት ወይም መቀበልን ያመለክታል፤ «አገኘ» ከግሪኩ የተሳካ ድረሳ ስሜት ጋር ይስማማል።
- source_word: τῆς ἐπαγγελίας
  choice: የተስፋውን ቃል
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም «የተስፋ ቃል» የእግዚአብሔርን ቃል ኪዳናዊ ተስፋ በተፈጥሯዊ ሁኔታ ይገልጣል፤ በአውዱ ያለውን የተወሰነ ተስፋ ለማመልከት የይዞታ ቅጥ ተጠቅሟል።
theological_decisions:
- issue: ἐπέτυχεν τῆς ἐπαγγελίας አብርሃም የተስፋውን ሙሉ ፍጻሜ ተቀበለ ማለት ነው ወይስ የተስፋውን ቃል አገኘ ማለት ነው?
  choice: «የተስፋውን ቃል አገኘ» ተብሎ ተተርጉሟል፤ ሙሉ ፍጻሜውን እንደተቀበለ አልተገለጸም።
  alternative: «ተስፋ የተሰጠውን ነገር ተቀበለ»
  rationale: ግሪኩ በቀጥታ «ተስፋውን አገኘ» ይላል እንጂ «የተስፋውን ሙሉ ፍጻሜ አገኘ» አይልም። ስለዚህ በዕብራውያን መልእክት ውስጥ ያለው ሥነ መለኮታዊ ውጥረት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ትዕግሥት» የሚለው ቃል ከፍ ያለ ነገር ግን የተለመደ መጽሐፍ ቅዱሳዊ ምዝገባን ይጠብቃል።
