  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: am
  text: እግዚአብሔር ሥራችሁንና ለስሙ ያሳያችሁትን ፍቅር፣ ቅዱሳንን[b] አገልግላችሁ እና አሁንም እያገለገላችሁ፣ እንዲረሳ ፍትሕ የጎደለው አይደለምና።[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ ስሙ»።
    reason: lexical_alternative
  - marker: b
    text: እዚህ «ቅዱሳን» ማለት በኋላ በልዩ ሥርዓት ቅዱስ ተብለው የተሰየሙ ጥቂት ሰዎችን ሳይሆን፣ በክርስቶስ የሚያምኑትን የእግዚአብሔር የተቀደሱ ሕዝቦች ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ቃል በቃል፣ «ቅዱሳንን አገልግላችሁና እያገለገላችሁ»።
    reason: aspect_note
lexical_decisions:
- source_word: ἄδικος
  choice: ዓመፀኛ
  rationale: በዚህ አውድ እግዚአብሔር የእነርሱን ሥራና ፍቅር ችላ ቢል ከፍትሕ የሚቃረን መሆኑን ይገልጣል፤ «ዓመፀኛ» የግሪኩን የፍትሕ ተቃራኒ ሐሳብ በክብር ቋንቋ ያስተላልፋል።
- source_word: ἐπιλαθέσθαι
  choice: እንዲረሳ
  rationale: ቀጥተኛውን ‘መርሳት’ ትርጉም ይጠብቃል፤ አውዱም በተግባር አለማስታወስን ያመለክታል።
- source_word: ἔργου
  choice: ሥራችሁን
  rationale: ነጠላው ቃል የአንባቢዎቹን ተግባር በጥቅል የሚያመለክት ሲሆን «ሥራ» ተፈጥሯዊ አቻ ነው።
- source_word: ἀγάπης
  choice: ፍቅር
  rationale: የተገለጠውን ተግባራዊ ፍቅር በቀጥታ ያስተላልፋል።
- source_word: ἐνεδείξασθε
  choice: ያሳያችሁትን / የገለጣችሁትን
  rationale: ግሱ ፍቅራቸውን በተግባር ማሳየታቸውን ያመለክታል፤ ድግግሞሹ በአማርኛ የረጅሙን ሐረግ ግንኙነት ግልጽ ያደርጋል።
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: ለስሙ
  rationale: ወደ እግዚአብሔር ስም ያመራውን መወደድና ለስሙ ሲባል የተደረገውን አገልግሎት በአጭር መልኩ ይጠብቃል፤ ትክክለኛው ግንኙነት በማስታወሻ [a] ተብራርቷል።
- source_word: διακονήσαντες
  choice: በማገልገላችሁ
  rationale: የቀደመውን የአገልግሎት ተግባር ይገልጣል።
- source_word: τοῖς ἁγίοις
  choice: ቅዱሳንን
  rationale: የአዲስ ኪዳንን የተለመደ ቃል ይጠብቃል፤ እዚህ የሚያመለክተው የእግዚአብሔር የተቀደሱ ሕዝቦችን መሆኑ በማስታወሻ [b] ተገልጿል።
- source_word: διακονοῦντες
  choice: አሁንም በማገልገላችሁ
  rationale: የአሁኑ ጊዜ አሳታፊ ቅርጽ አገልግሎቱ እየቀጠለ መሆኑን ያሳያል፤ «አሁንም» ይህን ልዩነት በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: ጥቅሱ በእግዚአብሔር ፊት ስለ ሰው ሥራ ዋጋ ወይም እግዚአብሔር የአማኞችን ተግባር በታማኝነት ስለማስታወሱ መናገሩ
  choice: ትርጉሙ እግዚአብሔር ሥራቸውንና ፍቅራቸውን እንደማይረሳ ከፍትሑ ጋር ያያይዛል፤ ሥራቸው መዳንን እንደሚያስገኝላቸው አይጨምርም።
  alternative: የሰው ሥራ እግዚአብሔርን ዕዳ ውስጥ የሚያስገባ ዋጋ እንዳለው የሚያስተምር ንባብ።
  rationale: የግሪኩ ጽሑፍ እግዚአብሔር ሥራቸውንና ፍቅራቸውን ለመርሳት ዓመፀኛ እንዳልሆነ ብቻ ይናገራል፤ የሚገባቸውን የመዳን ደመወዝ እንዳለ አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ቅዱሳን» የሚለው የመጽሐፍ ቅዱስ ቃል ተጠብቆ የአውዱ ትርጉም በማስታወሻ ተብራርቷል።
