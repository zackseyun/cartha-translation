source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: am
  text: ነገር ግን፣ የተወደዳችሁ ወገኖች ሆይ፣ እንዲህ ብንናገርም እንኳ፣ ስለ እናንተ ከድነት ጋር የተያያዙ የተሻሉ ነገሮች እንዳሉ እርግጠኞች ነን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: እርግጠኞች ነን
  rationale: ፍጹም ጊዜው የጸና እምነትን ወይም መተማመንን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ቀደም ካለው ከባድ ማስጠንቀቂያ ወደ አጽናኝ ንግግር የሚደረገውን ንጽጽራዊ ሽግግር ያሳያል።
- source_word: περὶ ὑμῶν
  choice: ስለ እናንተ
  rationale: περί ከባለቤት አገባብ ጋር ያለውን ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀγαπητοί
  choice: ወዳጆች ሆይ
  rationale: የግሪኩን የፍቅር ጥሪ በክብር ያቀርባል፤ በዘመናዊ አማርኛም ከ“የተወደዳችሁ” ይልቅ ተፈጥሯዊ ነው።
- source_word: τὰ κρείσσονα
  choice: የተሻሉትን … ነገሮች
  rationale: የንጽጽር ኃይሉን ጠብቆ ግሪኩን ገለልተኛ ብዙ ቁጥር ገላጭ ስም በግልጽ አማርኛ ያቀርባል።
- source_word: ἐχόμενα σωτηρίας
  choice: ከድነት ጋር የተያያዙትን
  rationale: ከድነት ጋር ያለውን ግንኙነት ሳያጠብ ይገልጣል፤ እነዚህ ማስረጃዎች፣ ውጤቶች ወይም ምክንያቶች ናቸው ብሎ አይወስንም።
- source_word: εἰ καὶ
  choice: ብንናገርም እንኳ
  rationale: የአንቀጹን የቅናሽ ወይም የተቃርኖ ኃይል በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: οὕτως λαλοῦμεν
  choice: እንዲህ ብንናገርም
  rationale: ቀደም ያለውን የማስጠንቀቂያ ንግግር ይመለከታል፤ “እንዲህ” የንግግሩን ይዘትና አካሄድ በቀላሉ ያመለክታል።
theological_decisions:
- issue: በማስጠንቀቂያው አውድ ἐχόμενα ከ σωτηρίας ጋር ያለው ግንኙነት
  choice: “ከድነት ጋር የተያያዙትን” ተብሎ ተተርጉሟል።
  alternative: “ድነትን የሚያጅቡትን” ወይም “የድነት የሆኑትን”
  rationale: ግሪኩ ከድነት ጋር ትክክለኛ ግንኙነት ያላቸውን ነገሮች ያመለክታል፤ ነገር ግን እነሱ የድነት ማስረጃ፣ አጃቢ ወይም ውጤት መሆናቸውን በግልጽ አይወስንም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የፍቅር ጥሪው “ወዳጆች ሆይ” ተብሎ ሞቅ ያለና ክብር ያለው ቃና እንዲኖረው ተደርጓል።
