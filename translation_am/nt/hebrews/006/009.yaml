  to: ነገር ግን፣ የተወደዳችሁ ወገኖች ሆይ፣ እንዲህ ብንናገርም እንኳ፣ ስለ እናንተ ከድነት ጋር የተያያዙ የተሻሉ ነገሮች እንዳሉ እርግጠኞች ነን።
