  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: am
  text: እግዚአብሔር ለአብርሃም ተስፋ በሰጠ ጊዜ፣ የሚምልበት ከእርሱ የሚበልጥ ማንም ስላልነበረ፣ በራሱ ማለ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: ተስፋ በሰጠ ጊዜ
  rationale: የግሪኩን የተሳቢ ግስ ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ተስፋ ሰጠ’ የቃል ኪዳኑን ድርጊት በግልጽ ያሳያል።
- source_word: γὰρ
  choice: የአረፍተ ነገሩ ማብራሪያዊ ግንኙነት
  rationale: ጥቅሱ የቀደመውን ክርክር የሚያብራራ ስለሆነ፣ ይህ ግንኙነት በአማርኛው የንግግር ፍሰት ውስጥ በአረፍተ ነገሩ አቀራረብ ተጠብቋል።
- source_word: ἐπεὶ
  choice: ስላልነበረ
  rationale: ቃሉ እግዚአብሔር በራሱ የማለበትን ምክንያት ያስገባል፤ የምክንያት ቅጥያው ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: ከእርሱ የሚበልጥ ማንም
  rationale: οὐδενός በዐውዱ የመሐላ ማጣቀሻ የሆነን አካል ያመለክታል፤ ‘ማንም’ የግል አመልካቹን በግልጽ ይጠብቃል።
- source_word: ὀμόσαι / ὤμοσεν
  choice: ማለ
  rationale: ‘መማል’ የመሐላ ድርጊትን በቀጥታና በተለመደ አማርኛ ይገልጣል። የግሪኩ የግስ መደጋገም በአማርኛ በቃል በቃል ቢደገም አነጋገሩን ስለሚያከብድ፣ የመሐላ ግንኙነቱ በዐውዱ ተጠብቋል።
- source_word: καθ’ ἑαυτοῦ
  choice: በራሱ
  rationale: በመሐላ አገላለጽ κατά ከመልሶ አመልካች ጋር ሲመጣ ‘በራሱ’ ማለት ነው፤ ከእግዚአብሔር በላይ ሌላ ሥልጣን እንዳልጠቀሰ ያሳያል።
theological_decisions:
- issue: የእግዚአብሔር መሐላ ባሕርይ
  choice: ከእርሱ የሚበልጥ ማንም ስላልነበረ በራሱ ማለ
  alternative: የሚምልበት ከእርሱ የሚበልጥ ማንም ስላልነበረ በራሱ ማለ
  rationale: ዋናው ንባብ የእግዚአብሔርን ልዕልናና በራሱ መማሉን ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ይጠብቃል። አማራጩ የግሪኩን εἶχεν + ὀμόσαι አወቃቀር ይበልጥ በግልጽ ያሳያል፣ ግን በአማርኛ ከበድ ያለ ነው።
