theological_decisions:
- issue: መሠረታዊውን ስለ መሲሑ ትምህርት ‘መተው’ መካድን ወይስ ወደ ፊት መገስገስን ያመለክታል?
  choice: በአሁኑ ትኩረት ከመሠረታዊው ትምህርት አልፎ ወደ ብስለት መገስገስ
  alternative: ስለ መሲሑ ያለውን መልእክት ፈጽሞ መተው
  rationale: ቀጥሎ ‘መሠረት እንደገና አንጣል’ ማለቱ መሠረቱን መካድ ሳይሆን በእርሱ ላይ ወደ ፊት መገንባትን ያመለክታል።
- issue: τελειότης ፍጹምነትን ወይስ ብስለትን ያመለክታል?
  choice: ብስለት
  alternative: ፍጹምነት ወይም ሙሉነት
  rationale: በዚህ የማሳሰቢያ ዐውድ መሠረታዊ ትምህርት ከተሟላ እድገት ጋር ተነጻጽሯል፤ ‘ብስለት’ ይህን ሳያጠብ ያቀርባል።
- issue: የφερώμεθα ተገብሮ ድምፅ መጠበቅ አለበትን?
  choice: ‘እንሸከም’ በማለት ተገብሮ ድምፁን መጠበቅ
  alternative: ‘ወደ ፊት እንሂድ’
  rationale: ግሪኩ ተገብሮ ነው፤ ድምፁን መጠበቅ መንፈሳዊ እድገትን እንደ ራስ ጥረት ብቻ ከመግለጽ ይቆጠባል፣ ሆኖም የድርጊት አድራጊውን አይወስንም።
