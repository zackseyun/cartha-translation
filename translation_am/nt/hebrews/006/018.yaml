  rationale: የመሸሽን እንቅስቃሴና ተስፋውን በንቃት የመያዝን ውጥረት ሳያጠፋ የምንጩን ምስል ይጠብቃል።
- issue: የእግዚአብሔር እውነተኝነት
  choice: ‘እግዚአብሔር ሊዋሽ የማይችል’
  alternative: ‘እግዚአብሔር አይዋሽም’
