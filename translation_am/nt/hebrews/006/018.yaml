  rationale: ከቀደመው ንግግር የሚፈልቀውን ዓላማና ውጤት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: ሊለወጡ በማይችሉት በሁለት ነገሮች
  rationale: πράγματα የሚለውን ሰፊ ትርጉም ‘ነገሮች’ በማለት፣ ἀμετάθετος የሚያሳየውንም የማይለወጥ ባሕርይ ይጠብቃል፤ በአውዱ የተስፋውን ቃልና መሐላውን ያመለክታል።
- source_word: ἐν οἷς
  choice: በእነዚህም
  rationale: አንጻራዊውን አገናኝ ከቀደሙት ሁለት ነገሮች ጋር በግልጽ ሁኔታ ያስተሳስራል።
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: እግዚአብሔር ሊዋሽ የማይችል በመሆኑ
  rationale: እግዚአብሔር መዋሸት የማይቻለው መሆኑን በቀጥታ ይገልጣል፤ ከጽሑፉ በላይ የሆነ ፍልስፍናዊ ማብራሪያ አይጨምርም።
- source_word: ἰσχυρὰν παράκλησιν
  choice: ብርቱ ማበረታቻ
  rationale: παράκλησις በዚህ አውድ የሚያጠናክር ማበረታታትን ያሳያል፤ ἰσχυράν ደግሞ ጥንካሬውን ‘ብርቱ’ በማለት ያጎላል።
- source_word: οἱ καταφυγόντες
  choice: መጠጊያ ፈልገን የሸሸን እኛ
  rationale: ወደ ደኅንነት ቦታ የመሸሽን እንቅስቃሴና ዓላማ ሁለቱንም በማቆየት የመጠጊያውን ምስል ይጠብቃል።
- source_word: κρατῆσαι
  choice: አጥብቀን ለመያዝ
  rationale: ግሱ መጨበጥን፣ መያዝን ወይም አጥብቆ መያዝን ሊያመለክት ይችላል፤ ይህ ምርጫ ንቁ ተግባሩንና ጽናቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῆς προκειμένης ἐλπίδος
  choice: በፊታችን የተቀመጠውን ተስፋ
  rationale: ተስፋው ለእኛ በፊት የቀረበና የተዘረጋ መሆኑን የግሪኩን ምስል በመጠበቅ ያሳያል።
