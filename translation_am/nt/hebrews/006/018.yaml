base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: am
  text: ይህም፣ እግዚአብሔር ሊዋሽ የማይችልባቸው ሁለት የማይለወጡ ነገሮች በኩል፣ ወደ መጠጊያ የሸሸን እኛ በፊታችን የቀረበውን ተስፋ አጥብቀን ለመያዝ[a] ብርቱ ማበረታቻ እንዲኖረን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በፊታችን የቀረበውን ተስፋ ለመጨበጥ።” የግሪኩ ግስ “መያዝ፣” “መጨበጥ፣” ወይም “አጥብቆ መያዝ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
