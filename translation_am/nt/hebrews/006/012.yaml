review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast, faith, patience, imitation, and inheriting. However, «ስለዚህ» means “therefore” and does not represent the purpose clause ἵνα μή. Also, «የተስፋዎቹን ቃሎች» adds “words” and is not a natural or sufficiently direct rendering of τὰς ἐπαγγελίας (“the promises”).
  naturalness: «ዳተኞች» and «ምሰሉ» are natural, suitably dignified modern Amharic. Replacing the expanded, awkward promise expression with «ተስፋዎችን» improves clarity and preserves the Greek plural.
  terminology: «እምነት» for πίστις, with the lexical alternative footnote retained, is appropriate. «ትዕግሥት» and «ይወርሳሉ» accurately and naturally render μακροθυμία and κληρονομούντων.
  issues:
  - severity: medium
    issue: «ስለዚህ» for ἵνα μή
    rationale: The Greek introduces a purpose clause, “so that/in order that you may not,” rather than an inferential “therefore.” The Amharic purpose construction should be retained without adding an inferential connective.
  - severity: medium
    issue: «የተስፋዎቹን ቃሎች» for τὰς ἐπαγγελίας
    rationale: The source says “the promises.” Adding «ቃሎች» introduces an unexpressed noun and makes the phrase less idiomatic. «ተስፋዎችን» preserves both the direct sense and plural.
  revised_text: ዳተኞች እንዳትሆኑ፣ ይልቁንም በእምነት[a]ና በትዕግሥት ተስፋዎችን የሚወርሱትን ምሰሉ።
