source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: am
  text: ዳተኞች እንዳትሆኑ፣ ይልቁንም በእምነት[a]ና በትዕግሥት ተስፋዎችን የሚወርሱትን ምሰሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በታማኝነትና በትዕግሥት።» «እምነት» ተብሎ የተተረጎመው የግሪክ ቃል በአንዳንድ አውዶች «ታማኝነት» ወይም «መታመን» የሚል ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: ዳተኞች
  rationale: ቃሉ በምላሽና በጥረት የዘገየን ወይም የሰነፈን ሁኔታ ያመለክታል፤ «ዳተኞች» በአውዱ ያለውን የትጋት ተቃርኖ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: γένησθε
  choice: እንዳትሆኑ
  rationale: የመሆን ወይም ወደ አንድ ሁኔታ የመግባትን ሐሳብ ጠብቆ፣ ወደ ዳተኝነት እንዳይወድቁ የሚሰጠውን ማስጠንቀቂያ ያሳያል።
- source_word: μιμηταὶ
  choice: ምሰሉ
  rationale: ሌሎችን እንደ አርአያ በመውሰድ እንደነርሱ መሆንን የሚጠይቀውን ግልጽ ጥሪ ተፈጥሯዊ በሆነ የአማርኛ ግስ ያቀርባል።
- source_word: διὰ πίστεως
  choice: በእምነት
  rationale: πίστιςን ሰፊ ትርጉሙን ሳያጠብ «እምነት» ብሎ ይተረጉማል፤ διά እዚህ መንገድን ወይም መሣሪያን በ«በ-» ይገልጣል።
- source_word: μακροθυμίας
  choice: በትዕግሥት
  rationale: ረጅም ጊዜ በትዕግሥት መጠበቅንና ተስፋ ሳይቆርጡ መጽናትን በዘመናዊና ክቡር አማርኛ ይገልጣል።
- source_word: κληρονομούντων
  choice: የሚወርሱትን
  rationale: የአሁን ጊዜውን ተሳቢ ባሕርይ በባሕርይ ወይም በተደጋጋሚ እውነት መልክ ያቀርባል፤ የውርስ ምስሉንም በቀጥታ ይጠብቃል።
- source_word: τὰς ἐπαγγελίας
  choice: የተስፋዎቹን ቃሎች
  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ «የተስፋ ቃሎች» እግዚአብሔር የሰጣቸውን ቃል ኪዳናዊ ተስፋዎች በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἵνα μὴ
  choice: ስለዚህ … እንዳትሆኑ
  rationale: ከቀደመው ማሳሰቢያ ጋር ያለውን የዓላማ ወይም የውጤት ግንኙነት በአማርኛ ተፈጥሯዊ አገባብ ያሳያል።
theological_decisions:
- issue: በዚህ የማሳሰቢያ አውድ ውስጥ πίστις የሚሰጠው ልዩ ትርጉም
  choice: እምነት
  alternative: ታማኝነት ወይም መታመን
  rationale: «እምነት» በእግዚአብሔር መታመንን የሚያካትት መደበኛና ሰፊ ትርጉም ነው። የግሪኩ ቃል በአንዳንድ አውዶች «ታማኝነት»ን ሊያመለክት ስለሚችል ያ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ይልቁንም» የμὴ … δὲን ተቃርኖ ያጎላል፤ የውርስና የብዙ ተስፋዎች ምስል ተጠብቋል።
