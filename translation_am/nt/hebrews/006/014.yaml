  rationale: የግሪኩ ድግግሞሽ የዕብራይስጥ/የሰባ ሊቃናት አጽንዖታዊ አገላለጽን ያስተጋባል። ቃል በቃል ቅርጹ በዘመናዊ አማርኛ እንግዳ ስለሚመስል፣ አጽንዖቱንና የሁለቱን ክፍሎች ትይዩነት በ‘በእርግጥ … በእርግጥም’ መግለጽ ንባቡን ግልጽ ሲያደርግ የመሐላውን ኃይል ይጠብቃል።
