  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክኛው በሁለቱም ግሶች ላይ የተደጋገመ አጽንዖታዊ ቅርጽ ይጠቀማል፤ በቃል በቃል፦ “እየባረክሁ እባርክሃለሁ፤ እያበዛሁም አበዛሃለሁ።” ይህ ዘፍጥረት 22፥17ን የሚያስተጋባ አጽንዖታዊ አገላለጽ ነው።
    reason: የግሪኩን የግስ ድግግሞሽና ከዘፍጥረት 22፥17 ጋር ያለውን የቃላት ትስስር ለመጠበቅ
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: የመሐላውን ቃል በቀጥታ የሚያስተዋውቅ የአሁን ጊዜ አሳታፊ ግስ ነው፤ ይህ አተረጓጎም ከቀደመው ዐረፍተ ነገር ጋር ያለውን ትስስር ይጠብቃል።
- source_word: Εἰ μὴν
  choice: በእርግጥ
  rationale: እዚህ ላይ ቃሉ ሁኔታዊ አገላለጽ ሳይሆን የመሐላ ቃልን አጽንዖት የሚሰጥ ፈሊጣዊ አገላለጽ ነው።
- source_word: εὐλογῶν εὐλογήσω
  choice: እባርክሃለሁ
  rationale: የአሳታፊና የወደፊት ጊዜ ግስ ድግግሞሽ ሴማዊ አጽንዖትን ያሳያል፤ በዋናው ጽሑፍ ይህ በተፈጥሯዊ አማርኛና ‘በእርግጥ’ በሚለው ቃል ተገልጧል፣ ቃል በቃል ቅርጹም በማስታወሻ ተጠብቋል።
- source_word: σε
  choice: አንተን (በግስ ቅጥያው ‘-ሃ-’)
  rationale: ሁለተኛ መደብ ነጠላ ተሳቢ ሲሆን በጥቅሱ ውስጥ አብርሃምን ያመለክታል።
- source_word: καὶ
  choice: -ም
  rationale: ሁለቱን የተስፋ ቃል ድርጊቶች በተፈጥሯዊ አማርኛ የሚያስተሳስር አያያዥ ነው።
- source_word: πληθύνων πληθυνῶ
  choice: አበዛሃለሁ
  rationale: ሰውየውን እጅግ ብዙ ማድረግን፣ በአውዱም ዘሩን ማብዛትን የሚገልጽ ቀጥተኛ የግስ አተረጓጎም ነው፤ የግሪኩን ሁለተኛ ነጠላ ተሳቢ ሳይቀይር ይጠብቃል።
theological_decisions:
- issue: ከአብርሃም ተስፋ የተጠቀሰውን አጽንዖታዊ የመሐላ ቀመር ማቅረብ
  choice: በዋናው ጽሑፍ ‘በእርግጥ’ን ከሁለቱም የወደፊት ድርጊቶች ጋር በማያያዝ ተፈጥሯዊ አማርኛ መጠቀም፣ የግሪኩን ድግግሞሽ ደግሞ በማስታወሻ ማስቀመጥ
