base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: am
  text: በእርሱ ፊት የተሰወረ አንድም ፍጡር የለም፤ ነገር ግን ሁሉም ነገር ራቁትና የተጋለጠ[b] በዓይኖቹ ፊት ነው፤ እኛም ለእርሱ ሂሳብ መስጠት አለብን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የመጨረሻው የግሪክ ሐረግ በቃል ቀረብ ተደርጎ «ከእርሱ ጋር ጉዳይ አለን» ወይም «ቃላችን/ጉዳያችን ወደ እርሱ ነው» ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: «የተጋለጠ» ተብሎ የተተረጎመው ብርቅዬ የግሪክ ግስ አንገት ተገልጦ ወይም ወደ ኋላ ታጥፎ የመቅረብን ምስል ሊያስነሳ ይችላል፤ ዋናው ነጥብ በእግዚአብሔር ፊት ፍጹም መጋለጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: ፍጡር
  rationale: ቃሉ በነጠላ ቢሆንም ማንኛውንም የተፈጠረ ፍጡር በአጠቃላይ ያመለክታል፤ «ፍጡር» የመፈጠሩን ሐሳብ በአጭሩ ይጠብቃል።
- source_word: ἀφανὴς
  choice: የተሰወረ
  rationale: በዚህ ዐውድ ትርጉሙ የማይታይ መሆን ሳይሆን ከእግዚአብሔር ምርመራ ሊሰወር አለመቻል ነው።
- source_word: ἐνώπιον αὐτοῦ
  choice: በእርሱ ፊት
  rationale: የግሪኩን «በእርሱ ፊት» የሚለውን አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πάντα
  choice: ሁሉም ነገር
  rationale: የግሪኩን ሁሉን አቀፍ ስፋት በግልጽ አማርኛ ያስተላልፋል።
- source_word: γυμνὰ
  choice: ራቁቱን
  rationale: የሙሉ መጋለጥን ሕያው ምስል በቀጥታ ይጠብቃል።
- source_word: τετραχηλισμένα
  choice: ሙሉ በሙሉ የተጋለጠ
  rationale: ይህ ብርቅዬ ግስ አንገት ወደ ኋላ ተገልጦ ወይም ተከፍቶ የመታየትን ምስል ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ያልተረጋገጠውን ምስል ሳያስገድድ የተጠናቀቀውን የመጋለጥ ሁኔታ ያሳያል።
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: በዓይኖቹ ፊት
  rationale: ሁሉም ነገር ለመለኮታዊው እይታ ፍጹም የተጋለጠ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: እኛም ለእርሱ መልስ መስጠት አለብን
  rationale: የታመቀውን የግሪክ አገላለጽ በዐውዱ ውስጥ ያለውን የተጠያቂነት ኃይል በግልጽ አማርኛ ያስተላልፋል፤ ሌሎቹ ሊሆኑ የሚችሉ ፍቺዎች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: የπρὸς ὃν ἡμῖν ὁ λόγος ፍቺ
  choice: የሰው ልጆች ለእግዚአብሔር መልስ የመስጠት ተጠያቂነትን ይገልጣል።
  alternative: «ጉዳያችን ከእርሱ ጋር ነው» ወይም «ቃላችን/ጉዳያችን ወደ እርሱ ነው»
  rationale: አቅራቢያው ዐውድ የእግዚአብሔርን ሁሉን የሚመረምር እውቀትና ፍርድ ያጎላል። ዋናው ትርጉም የማስጠንቀቂያውን ኃይል ይጠብቃል፤ የአገላለጹ እውነተኛ አሻሚነት ግን በማስታወሻ ተቀምጧል።
