  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: am
  text: የእግዚአብሔር ቃል ሕያውና የሚሠራ ነውና፤ ከማንኛውም ባለ ሁለት ስለት ሰይፍ ይልቅ የተሳለ ነው፤ ነፍስና መንፈስ[a]፣ መገጣጠሚያዎችና መቅኒ እስከሚለያዩበት ድረስ ዘልቆ ይገባል[b]፤ የልብንም ሐሳቦችና ዓላማዎች የሚመዝን ነው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ነፍስና መንፈስ” የሚለው ሐረግ ስለ ሰው አወቃቀር አንድን የተወሰነ ትምህርት የግድ አያረጋግጥም፤ ዋናው ነጥብ የእግዚአብሔር ቃል እስከ ጥልቅ ውስጣዊ ሕይወት ዘልቆ እንደሚደርስ ማሳየት ነው።
    reason: alternative_reading
  - marker: b
