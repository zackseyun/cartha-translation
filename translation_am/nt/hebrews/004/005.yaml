lexical_decisions:
- source_word: ἐν τούτῳ
  choice: በሌላ ስፍራ
  rationale: ቃሉ ሌላ የቅዱስ ቃል ጥቅስ ወይም ስፍራ መጠቀሱን ያመለክታል። በአማርኛ የጥቅሱን መቀየር በተፈጥሮ ለማሳየት “በሌላ ስፍራ” ተመርጧል።
- source_word: πάλιν
  choice: ደግሞም
  rationale: ጸሐፊው እንደገና ሌላ የቅዱስ ቃል ማስረጃ እያቀረበ መሆኑን በተፈጥሮ ያሳያል።
- source_word: Εἰ εἰσελεύσονται
  choice: ፈጽሞ አይገቡም
  rationale: ቃል በቃል “ቢገቡ” የሚመስለው የግሪክ አገላለጽ ከዕብራይስጥ የመሐላ ዘይቤ የመጣ ጽኑ እምቢታ ነው። “ፈጽሞ አይገቡም” የዚያን አጽንዖት በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κατάπαυσίν
  choice: ዕረፍት
  rationale: በዕብራውያን 3–4 ውስጥ ተደጋግሞ የሚመጣውንና የእግዚአብሔርን ዕረፍት የሚያመለክተውን ቁልፍ ቃል ይጠብቃል።
- source_word: μου
  choice: የእኔ / -ቴ
  rationale: የመዝሙሩን መለኮታዊ ንግግር በቀጥታ በመጠበቅ “ዕረፍቴ” ተብሎ ተተርጉሟል።
