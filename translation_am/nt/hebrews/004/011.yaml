base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: am
  text: ስለዚህ፣ ወደዚያ ዕረፍት ለመግባት በትጋት እንጣር፤ ማንም ያንኑ የአለመታዘዝ ምሳሌ[a] በመከተል እንዳይወድቅ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ያንኑ የአለማመን ምሳሌ»። ይህ ቃል በበረሃ የነበረው ትውልድ በእግዚአብሔር እምነት ባለመጣሉ አንጻር ሊገባ ይችላል፤ የግሪኩ ቃል ግን በይበልጥ ቀጥታ «አለመታዘዝ» ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: በሙሉ ኃይላችን እንጣር
  rationale: የማበረታቻውን ኃይልና የትጋትን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ስለ እግዚአብሔር ዕረፍትና ስለ እስራኤል ውድቀት ከተነገረው ክርክር የሚወጣውን መደምደሚያ ያሳያል።
- source_word: εἰσελθεῖν
  choice: ለመግባት
  rationale: የግሪኩን የዓላማ ወይም የማሟያ ኢንፊኒቲቭ በቀጥታና በተፈጥሯዊ መንገድ ይተረጉማል።
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ወደዚያ ዕረፍት
  rationale: በአውዱ ቀደም ሲል የተብራራውን በእግዚአብሔር የተሰጠ ዕረፍት ሳያብራራ የአመልካቹን አጽንዖት ይጠብቃል።
- source_word: ἵνα μὴ
  choice: ማንም ... እንዳይወድቅ
  rationale: አሉታዊውን ዓላማ ወይም ውጤት እና የማስጠንቀቂያውን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: በዚያው ... ምሳሌ ተከትሎ
  rationale: የበረሃው ትውልድ አሉታዊ ቅድመ ምሳሌ እንደ ሚደገም ሥርዓት መሆኑን ያሳያል፤ ἐν ያለውን የመንገድ/የመሳሪያ ሐሳብም «ተከትሎ» በማለት ተፈጥሯዊ ያደርገዋል።
- source_word: πέσῃ
  choice: እንዳይወድቅ
  rationale: ከἵνα μή በኋላ ያለውን ንዑስ ግስ እና ከባዱን የማስጠንቀቂያ ቅላፄ ይጠብቃል።
- source_word: τῆς ἀπειθείας
  choice: የአለመታዘዝ
  rationale: ἀπείθεια በቀጥታ የሚያመለክተውን አለመታዘዝ ይገልጣል፤ በዕብራውያን ውስጥ ካለው አለማመን ጋር ያለውን ቅርብ ግንኙነት ግን በማስታወሻ ይጠብቃል።
theological_decisions:
- issue: ἀπείθεια ከበረሃው ትውልድ አለማመን ጋር ያለው ግንኙነት
  choice: በዋናው ጽሑፍ «አለመታዘዝ» ተብሏል።
  alternative: አለማመን
  rationale: የዕብራውያን መልእክት አለማመንንና አለመታዘዝን በቅርብ ያያይዛል፤ ሆኖም የἀπείθεια ቀጥተኛ የቃል ትርጉም «አለመታዘዝ» ነው። ይህ ምርጫ የሥነ መለኮት ውጥረቱን ሳያጠፋ የግሪኩን ቃል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በሙሉ ኃይላችን እንጣር» የማበረታቻውን ጉልበት ሲጠብቅ፣ «ዕረፍት» በአውዱ የተገነባውን ቁልፍ ቃል ያስቀጥላል።
