lexical_decisions:
- source_word: Ἰησοῦς
  choice: ኢያሱ
  rationale: የግሪኩ Ἰησοῦς የስም ቅርጽ ኢየሱስንም ኢያሱንም ሊያመለክት ቢችልም፣ ዐውደ ንባቡ እስራኤልን ወደ ምድሪቱ ያስገባውን የነዌን ልጅ ኢያሱን ያመለክታል።
- source_word: κατέπαυσεν
  choice: ዕረፍት ሰጥቷቸው
  rationale: ግሱ ማሳረፍን ወይም ከአንድ ነገር እንዲቆሙ ማድረግን ይገልጣል፤ ይህ አተረጓጎም አድራጊውን ትርጉምና የምዕራፉን የዕረፍት ጭብጥ ይጠብቃል።
- source_word: οὐκ ἂν ... ἐλάλει
  choice: ባልተናገረ ነበር
  rationale: ያልተፈጸመ የቀድሞ ሁኔታ ተቃራኒ ውጤትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: ስለ ሌላ ቀን
  rationale: ከኢያሱ ዘመን በኋላም ተስፋ የተሰጠበትን ሌላ ቀን በቀጥታ ያሳያል።
- source_word: μετὰ ταῦτα
  choice: ከዚያ በኋላ
  rationale: ንግግሩ ከኢያሱ ዘመን በኋላ መሆኑን የሚያሳየውን ጊዜያዊ ቅደም ተከተል ይጠብቃል።
- source_word: γὰρ
  choice: (በሁኔታዊው አገባብ ተካትቷል)
  rationale: γάρ ከቀደመው ንግግር ጋር የሚያያዝ ማብራሪያ ነው፤ በአማርኛ የ‘ቢሆን ኖሮ’ አገባብ ውስጥ ግንኙነቱ በተፈጥሮ ይሰማል፣ ‘ምክንያቱም’ ማለት ግን አረፍተ ነገሩን ያከብደዋል።
theological_decisions:
- issue: በዕብራውያን 4፥8 የἸησοῦς ማመልከቻ
  choice: የነዌ ልጅ ኢያሱ
  alternative: ኢየሱስ
  rationale: የክፍሉ ክርክር በኢያሱ መሪነት ወደ ምድሪቱ ስለገቡት እስራኤላውያንና ከዚያ በኋላ በመዝሙር 95 ስለተነገረው የዕረፍት ቀን ነው። የግሪኩ ስም ሁለቱንም ሊያመለክት መቻሉ በማስታወሻ ተጠብቋል።
- issue: በἐλάλει ውስጥ የተሰወረው ባለቤት
  choice: በአማርኛ ባለቤቱን ሳይጨምር ‘ባልተናገረ’
  alternative: ‘እግዚአብሔር ባልተናገረ’ ወይም ‘እርሱ ባልተናገረ’
  rationale: የግሪኩ ጽሑፍ ስሙን በግልጽ አይደግምም። የአማርኛው ግስ ባለቤቱን ሳይጨምር በተፈጥሮ ሊቆም ስለሚችል፣ ይህ ምርጫ ጽሑፉ ያልገለጸውን ባለቤት በስም ከመጨመር ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ዕረፍት’ የምዕራፉን ቁልፍ ቃል ወጥነት ይጠብቃል፤ የግሪኩ ያልተገለጸ የἐλάλει ባለቤትም በግልጽ ስም አልተጨመረበትም።
