  text: ምክንያቱም ኢያሱ[a] ዕረፍትን ሰጥቷቸው ቢሆን ኖሮ፣ እግዚአብሔር ከዚያ በኋላ ስለ ሌላ ቀን ባልተናገረ ነበር።
  philosophy: optimal-equivalence
  footnotes:
