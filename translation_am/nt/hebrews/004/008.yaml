    text: በግሪክ፦ “ኢየሱስ።” Ἰησοῦς የሚለው የስም ቅርጽ ኢየሱስንም ኢያሱንም ሊያመለክት ይችላል፤ እዚህ ግን ዐውደ ንባቡ የነዌን ልጅ ኢያሱን በግልጽ ያመለክታል።
