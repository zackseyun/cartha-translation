  rationale: በዕብራውያን መልእክት ውስጥ የኢየሱስን የክህነት አገልግሎት የሚገልጠውን ቁልፍ ማዕረግ በተለመደውና ትክክለኛው አማርኛ ያቀርባል።
- source_word: οὐ ... μὴ δυνάμενον συμπαθῆσαι
  choice: ሊራራ የማይችል አይደለም
  rationale: የግሪኩን አሉታዊ አገላለጽ (‘የማይችል አይደለም’) ይጠብቃል፤ συμπαθέω የሌላውን ድካም በመጋራት መራራትን ያመለክታል።
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: ከድካማችን ጋር
  rationale: ἀσθένεια አካላዊ ሕመምን ብቻ ሳይሆን ሰፊውን የሰው ድክመትና ተጋላጭነት ይጨምራል። በአማርኛ የጋራ መራራትን ለማሳየት ‘ከ...ጋር’ ተፈጥሯዊ ነው።
- source_word: πεπειρασμένον
  choice: የተፈተነ
  rationale: πειράζω ‘መፈተን’ ወይም ‘መፈታተን’ ሊሆን ይችላል። ‘የተፈተነ’ የክርስቶስን እውነተኛ ፈተና ያስተላልፋል፤ የሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: κατὰ πάντα
  choice: በሁሉም ነገር
  rationale: የፈተናውን ሁሉን አቀፍነት በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καθ’ ὁμοιότητα
  choice: እንደ እኛ
  rationale: ቃል በቃል ‘በመመሳሰል መሠረት’ የሚለው አማርኛ ግትርና ያልተፈጥሯዊ ስለሆነ፣ በዐውዱ ውስጥ የታሰበውን ከሰዎች ጋር መመሳሰል በግልጽ ያቀርባል። የግሪኩ አገላለጽ ቃል በቃል በማስታወሻ ተጠብቋል።
- source_word: χωρὶς ἁμαρτίας
  choice: ኃጢአት የሌለበት
  rationale: ከሙሉ ፈተናው ጋር በተቃርኖ የተገለጠውን የኃጢአት አለመኖር በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: πεπειρασμένον ከክርስቶስ ኃጢአት አልባነት ጋር ያለው ግንኙነት
  choice: የተፈተነ
  alternative: የተፈታተነ
  rationale: ዋናው ጽሑፍ እውነተኛውን ልምምድና ሙከራ ያሳያል፣ የውስጥ ኃጢአታዊ ዝንባሌን ግን አያስገባም። ቃሉ የፈተና/የፈታተና ሁለት ትርጉም ሊኖረው ስለሚችል ሌላው በማስታወሻ ተቀምጧል።
- issue: καθ’ ὁμοιότητα የሚያመለክተውን ንጽጽር ምን ያህል ግልጽ ማድረግ እንዳለበት
  choice: እንደ እኛ
  alternative: በመመሳሰል መሠረት
  rationale: ግሪኩ መመሳሰልን በግልጽ ቢናገርም የንጽጽሩን ሌላኛ ወገን በቃል አይደግምም። ዐውዱ ግን ‘እኛን’ በግልጽ ስለሚያሳይ ተፈጥሯዊው አማርኛ ‘እንደ እኛ’ ተመርጧል፤ የቃል ቅርበቱ በማስታወሻ ተጠብቋል።
