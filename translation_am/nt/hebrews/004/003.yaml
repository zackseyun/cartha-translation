  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: am
  text: 'ምክንያቱም እኛ ያመንን ወደ ዕረፍቱ እንገባለን፤ እንዲህ እንዳለ፦


    “በቁጣዬ እንደማልሁ፦

    ‘ወደ ዕረፍቴ ቢገቡ!’”[a]


    ምንም እንኳ ሥራዎቹ ዓለም ከተመሠረተበት ጊዜ ጀምሮ የተፈጸሙ ቢሆኑም።[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል፣ “ወደ ዕረፍቴ ቢገቡ” ይላል። ይህ የመሐላ አነጋገር “ወደ ዕረፍቴ ፈጽሞ አይገቡም” ማለት ነው።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ሥራዎቹ ዓለም ከተመሠረተበት ጊዜ ጀምሮ ተጠናቀው ነበር።”
    reason: lexical_alternative
