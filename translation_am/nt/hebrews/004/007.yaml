source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: am
  text: 'ደግሞም፣ “ዛሬ” ብሎ አንድ የተወሰነ ቀን ይወስናል፤ ከዚህ ያህል ረጅም ጊዜ በኋላ በዳዊት[a] በኩል እንዲህ በማለት፣ አስቀድሞ እንደተነገረው፦


    “ዛሬ ድምፁን ብትሰሙ፣


    ልባችሁን አታደንድኑ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዳዊት”፤ ማለትም ከዳዊት ጋር በተያያዘው መዝሙር ውስጥ።
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: ደግሞም
  rationale: በሐሳብ ፍሰቱ ውስጥ ዳግመኛ ወደሚወሰነው ቀን መመለሱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τινὰ ἡμέραν
  choice: አንድን የተወሰነ ቀን
  rationale: ቀኑ የተለየ እንጂ በመጀመሪያው ሐረግ በስም ያልተገለጠ መሆኑን ያቆያል።
- source_word: ὁρίζει
  choice: ይወስናል
  rationale: ቀኑን በሥልጣን መመደብንና መወሰንን ያሳያል፤ በዙሪያው ያለው ንባብ የተውላጠ ባለቤቱን ያስረዳል።
- source_word: Σήμερον
  choice: “ዛሬ”
  rationale: በመዝሙሩ ጥቅስ ውስጥ ያለውን አሁናዊ የምላሽ ጥሪ በቀጥታ ይጠብቃል።
- source_word: ἐν Δαυὶδ λέγων
  choice: በዳዊት አማካይነት ... ይላል
  rationale: ንግግሩ በዳዊት በኩል መቅረቡን በግልጽ አማርኛ ይገልጻል፤ የግሪኩን ቃል በቃል ‘በዳዊት’ የሚለውን አማራጭ በማስታወሻ ይጠብቃል።
- source_word: μετὰ τοσοῦτον χρόνον
  choice: ከእጅግ ረጅም ጊዜ በኋላ
  rationale: ከምድረ በዳው ትውልድ በኋላ ያለውን ረጅም የጊዜ ርቀት በተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: καθὼς προείρηται
  choice: አስቀድሞ እንደተባለው
  rationale: ቃሉ ቀደም ብሎ የተነገረ መሆኑንና አሁንም ለክርክሩ ጠቃሚ መሆኑን ያቆያል።
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: ድምፁን ብትሰሙ
  rationale: መስማት ምላሽን ቢያመለክትም ‘ታዘዙ’ ብሎ በመተርጎም የጥቅሱን ምስላዊ አነጋገር አያጠብም።
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: ልባችሁን አታደንድኑ
  rationale: ሆን ብሎ ግትር መሆንን የሚከለክለውን ማስጠንቀቂያና መጽሐፍ ቅዱሳዊውን ‘ልብ’ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: “ዛሬ” የሚለው በእግዚአብሔር ዕረፍት ክርክር ውስጥ ያለው ኃይል
  choice: አሁን ምላሽ ለመስጠት የተወሰነ ዕድል መሆኑን የሚያሳየውን “ዛሬ” በቀጥታ ማቆየት
  alternative: የመዝሙራዊው ታሪካዊ ቀን ብቻ ወይም ፍጹም የፍጻሜ ዘመን ቀን ብቻ አድርጎ መግለጽ
  rationale: ጥቅሱ ከምድረ በዳው ዘመን ከብዙ ጊዜ በኋላም የምላሽ ጥሪው እንዳለ ያሳያል፤ ትርጉሙ ይህን ያቆያል እንጂ የጊዜን ሥነ መለኮት አስቀድሞ አይወስንም።
- issue: ἐν Δαυὶδ የሚለው አገላለጽ
  choice: “በዳዊት አማካይነት”
  alternative: “በዳዊት”፣ ማለትም ከዳዊት ጋር በተያያዘው መዝሙር ውስጥ
  rationale: ዋናው ንባብ ንግግሩ በዳዊት በኩል መቅረቡን በተፈጥሯዊ አማርኛ ያሳያል፤ ግን ሐረጉ የመዝሙሩን ክፍል ሊያመለክት የሚችልበትን ዕድል በማስታወሻ ክፍት ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ቅኔያዊ አቀራረብ በመስመር ክፍፍል ተጠብቋል፤ የግሪኩ የድርጊት ባለቤት በአውዱ የሚታወቅ ስለሆነ ‘እግዚአብሔር’ የሚለው ስም በጽሑፉ አልተጨመረም።
