  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: am
  text: 'እኛም እንደ እነርሱ የምሥራች ተሰብኮልናልና፤ ነገር ግን የሰሙት ቃል አልጠቀማቸውም፤ ምክንያቱም በእምነት[b] ከሰሙት ሰዎች ጋር አልተቀላቀሉም[a]።


    [a] አንዳንድ የጽሑፍ ቅጂዎችንና ባህላዊውን አተረጓጎም በመከተል፦ “የሰሙት ቃል በሰሙት ሰዎች ውስጥ ከእምነት ጋር ስላልተዋሐደ ነው።”


    [b] የግሪክኛው ቃል “እምነት” ማለት ነው፤ “መታመን” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የጽሑፍ ቅጂዎችንና ባህላዊውን አተረጓጎም በመከተል፦ “የሰሙት ቃል በሰሙት ሰዎች ውስጥ ከእምነት ጋር ስላልተዋሐደ ነው።”
    reason: textual_variant
  - marker: b
    text: የግሪክኛው ቃል “እምነት” ማለት ነው፤ “መታመን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
