  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: am
  text: እንግዲህ፣ ሰማያትን[a] አልፎ የሄደ ታላቅ ሊቀ ካህናት፣ የእግዚአብሔር ልጅ ኢየሱስ፣ ስላለን፣ ኑዛዜአችንን አጥብቀን እንያዝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰማያትን የተሻገረ።” የግሪክኛው ጽሑፍ “ሰማያት” የሚለውን ብዙ ቁጥር ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: እንግዲህ … ስላለን
  rationale: የአሳቡን መደምደሚያና የማሳሰቢያውን ምክንያት በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪክኛውን ተሳቢ አገባብ በምክንያታዊ ንዑስ አረፍተ ነገር ይተረጉማል።
- source_word: ἀρχιερέα μέγαν
  choice: ታላቅ ሊቀ ካህናት
  rationale: በአማርኛ የታወቀውን የክህነት ማዕረግ በመጠቀም የμέγανን የላቀነት አጽንዖት ይጠብቃል።
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: ሰማያትን አልፎ የሄደ
  rationale: የተፈጸመውንና ዘላቂ ጠቀሜታ ያለውን መሻገር ያሳያል፤ የοὐρανούςን ብዙ ቁጥርም ‘ሰማያት’ በማለት ይጠብቃል።
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ ኢየሱስ
  rationale: የኢየሱስን ስምና ክርስቶሳዊ ማዕረግ በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: κρατῶμεν
  choice: አጥብቀን እንያዝ
  rationale: የማሳሰቢያ ንዑስ አንቀጹንና ቀጣይ ጽናትን የሚጠይቀውን ኃይል ይገልጣል።
- source_word: τῆς ὁμολογίας
  choice: ኑዛዜአችንን
  rationale: ማኅበረሰቡ በግልጽ የሚመሰክረውን የእምነት አቋም በአጭር ይገልጣል፤ የመጀመሪያው ጽሑፍ ተውላጠ ባለቤት ባይኖረውም፣ የጋራ ማሳሰቢያው በአማርኛ ‘-አችን’ን ተፈጥሯዊ ያደርገዋል።
theological_decisions:
- issue: የυἱὸς τοῦ θεοῦን ክርስቶሳዊ ማዕረግ አተረጓጎም
  choice: የእግዚአብሔር ልጅ
  alternative: የአምላክ ልጅ
  rationale: መደበኛውንና ግልጽ የአማርኛ ማዕረግ ይጠብቃል፤ ማዕረጉን አያቃልልም ወይም በትርጓሜ አይተካውም።
- issue: የτοὺς οὐρανούςን የሰማያዊ ምስል እና ብዙ ቁጥር መጠበቅ
  choice: ሰማያትን
  alternative: ሰማይን
  rationale: የግሪክኛውን ብዙ ቁጥርና የኢየሱስን ከፍ ያለ መሻገር ምስል ይጠብቃል፤ ጽሑፉ ከሚናገረው በላይ የተዋቀረ የሰማይ ሥርዓት አያስገባም።
- issue: ὁμολογία የሚያመለክተው የጋራ እምነት መግለጫ
  choice: ኑዛዜአችን
  alternative: የምንመሰክረው
  rationale: ስለ መልእክቱ ይዘት ያልተገለጸውን ክፍትነት ሳይሞላ፣ በአደባባይ የሚገለጽን የጋራ እምነት ያመለክታል።
