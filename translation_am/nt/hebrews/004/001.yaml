  text: ስለዚህ፣ ወደ ዕረፍቱ ለመግባት የተስፋ ቃል ገና ሳለ[b]፣ ከእናንተ ማንም ወደዚያ መድረስ ያቃተው ሆኖ እንዳይታይ[c] እንፍራ[a]።
