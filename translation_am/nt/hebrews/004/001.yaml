- source_word: μήποτε
  choice: እንዳይመስል
  rationale: ከማሳሰቢያው ጋር የተያያዘውን አሉታዊ ስጋት ‘እንዳይ…’ በሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: καταλειπομένης ἐπαγγελίας
  choice: የተሰጠው የተስፋ ቃል ገና እንዳለ
