- source_word: ὑστερηκέναι
  choice: ሳይደርስበት የቀረ
  rationale: የታሰበውን ግብ አለማግኘትን በግልጽ ያሳያል፤ የፍጹም ኢንፊኒቲቩንም የተጠናቀቀ ውጤት ያንጸባርቃል።
theological_decisions:
- issue: ማስጠንቀቂያው የእውነተኛ ፍርሃት ጥሪ ነው ወይስ ቀላል የጥንቃቄ ምክር?
  choice: እንፍራ
  alternative: እንጠንቀቅ
  rationale: φοβηθῶμεν ግልጽ የፍርሃት ጥሪ ነው። ይህን ኃይል ማቆየት ስለ ጽናት ወይም ክህደት የተወሰነ የእምነት ሥርዓት ሳይጨምር የጽሑፉን ከባድነት ያቆያል።
- issue: ‘ዕረፍቱ’ በዋናው ጽሑፍ የእግዚአብሔር ፍጻሜያዊ ዕረፍት ተብሎ በግልጽ ይተርጎም?
  choice: ዕረፍቱ
  alternative: የእግዚአብሔር ዕረፍት / የሰንበት ዕረፍቱ
  rationale: ግሪኩ ተውላጠ ስም ይጠቀማል። አውዱ ባለቤቱን ያሳያል፣ ነገር ግን በዚህ ቁጥር ያልተገለጸ ተጨማሪ የፍጻሜ ወይም የሰንበት ትርጓሜ አልተጨመረም።
- issue: δοκῇ የሚያሳየው መምሰል ይጠበቅ ወይስ እንደ የተረጋገጠ ውድቀት ይቀርብ?
  choice: እንዳይመስል
  alternative: እንዳይቀር / እንዳይወድቅ
  rationale: ግሪኩ የ‘መምሰል’ ወይም ‘መታየት’ ገጽታ አለው። ይህን ማቆየት ጽሑፉ ያለውን እውነተኛ አሻሚነት እንዳይዘጋ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘የተስፋ ቃል’ በተራ ‘ተስፋ’ ሊነሳ የሚችለውን የግል ምኞት ትርጉም ይከላከላል፤ ‘እንፍራ’ ደግሞ የመነሻውን ጠንካራ ድምፅ ይጠብቃል።
