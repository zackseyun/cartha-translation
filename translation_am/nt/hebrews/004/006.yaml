  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: am
  text: እንግዲህ፣ አንዳንዶች ወደዚያ እንዲገቡ አሁንም ስለሚቀር፣ ምሥራቹ አስቀድሞ የተነገራቸውም ባለመታዘዛቸው[a] አልገቡም፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ባለማመናቸው።» የግሪኩ ቃል በአለመታዘዝ የሚገለጥ ለማመን እምቢታን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: እንግዲህ፣ … ስለሆነ
  rationale: «እንግዲህ» የοὖνን ድምዳሜያዊ ኃይል፣ «ስለሆነ» ደግሞ የἐπείን ምክንያታዊና ሐሳብ አዘጋጅ ኃይል በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋሉ።
- source_word: ἀπολείπεται
  choice: አሁንም የቀረ
  rationale: የአሁን ጊዜ ተገብሮ ቅርጹ ወደዚያ የመግባት ዕድል እንደቀጠለ ያሳያል፤ «አሁንም» ይህን ቀጣይነት በግልጽ አማርኛ ያሳያል።
- source_word: τινὰς
  choice: አንዳንዶች
  rationale: ያልተወሰኑ ሰዎችን የሚያመለክተውን የግሪኩን ቃል በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: ወደዚያ እንዲገቡ
  rationale: «ወደዚያ» ቀደም ሲል የተጠቀሰውን የእግዚአብሔር ዕረፍት ያመለክታል፤ በዋናው ጽሑፍ የሌለውን ስም ሳይደግም የተውላጠ ስሙን ኃይል ይጠብቃል።
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: አስቀድሞ የምሥራቹ የተነገራቸው
  rationale: የεὐαγγελίζωን ተገብሮ ቅርጽ ጠብቆ፣ መልካም ዜናው ለእነርሱ እንደታወጀ በዘመናዊና ክብር ባለው ቋንቋ ይገልጻል።
- source_word: οὐκ εἰσῆλθον
  choice: አልገቡም
  rationale: ቀጥተኛውን የአኦሪስት አሉታዊ አገላለጽ ሳይጨምር ያስተላልፋል።
- source_word: δι’ ἀπείθειαν
  choice: ባለመታዘዛቸው
  rationale: ἀπείθεια በዋናነት አለመታዘዝን ያመለክታል፤ በዚህ አውድ ከአለማመን ጋር ያለው የትርጉም መደራረብ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በማስጠንቀቂያና በዕረፍት አውድ ውስጥ ἀπείθειαን መተርጎም
  choice: ባለመታዘዛቸው
  alternative: ባለማመናቸው
  rationale: ቃሉ የእግዚአብሔርን ቃል አምኖ አለመቀበልን ከሚገልጽ አለማመን ጋር ሊደራረብ ቢችልም፣ ዋናው የቃሉ ኃይል አለመታዘዝ ነው። ስለዚህ ዋናው ጽሑፍ ይህን ጠብቆ፣ ትክክለኛውን አማራጭ በማስታወሻ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ሰዋሰዋዊ ቀጣይነት በመጨረሻው ሰረዝ ተጠብቋል።
