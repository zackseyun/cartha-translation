base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: am
  text: እናንተ የአብርሃም ዘር[a] መሆናችሁን አውቃለሁ፤ ነገር ግን እኔን ለመግደል ትፈልጋላችሁ፤ ምክንያቱም ቃሌ በእናንተ ውስጥ ስፍራ የለውም[b]።
  philosophy: optimal-equivalence
  footnotes:
