lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: የአብርሃም ዘሮች
  rationale: σπέρμα በዚህ ስፍራ የዘር ሐረግን በጥቅል ያመለክታል። «ዘሮች» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ሲሆን አካላዊ የዘር ግንኙነቱን ይጠብቃል።
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: እኔን ለመግደል ትፈልጋላችሁ
  rationale: ζητέω ከግስ ማስደገፊያ ጋር አንድን ነገር ለማድረግ መፈለግን ወይም መጣርን ሊገልጽ ይችላል። ይህ አተረጓጎም የአሁን ጊዜውን ቀጣይ ዝንባሌ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: ቃሌ
  rationale: «ቃሌ» የλόγοςን ቀጥተኛ ትርጉምና በዮሐንስ ወንጌል ያለውን ቃላዊ ትስስር ይጠብቃል፤ «መልእክቴ» ከሚለው ያነሰ ትርጓሜ ይጨምራል።
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: በእናንተ ውስጥ ስፍራ የለውም
  rationale: χωρέω ለአንድ ነገር ቦታ መኖርን፣ መቀበልን ወይም መስፋፋትን ሊያመለክት ይችላል። «ስፍራ የለውም» የቦታውን ዘይቤ ጠብቆ ቃሉን ያለመቀበላቸውን ከመጠን በላይ ሳይተረጉም ያሳያል።
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: የአብርሃም ዘር መሆናቸውን በመቀበልና ኢየሱስን ለመግደል በመፈለጋቸው መካከል ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἶδα ὅτι
  choice: እንደሆናችሁ አውቃለሁ
  rationale: የግሪኩን የይዘት ሐረግ በአማርኛ ተፈጥሯዊ አገባብ በቀጥታ ያቀርባል።
theological_decisions:
- issue: በሥጋ ከአብርሃም መወለድና ከአብርሃም ጋር በእውነት መስማማት ያላቸው ግንኙነት
