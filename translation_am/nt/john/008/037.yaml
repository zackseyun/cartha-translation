    text: ወይም፣ «የአብርሃም ዘሮች» ወይም «ከአብርሃም የተወለዳችሁ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ቃሌ በእናንተ ውስጥ ቦታ አያገኝም»።
