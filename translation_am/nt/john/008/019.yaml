  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: am
  text: እንግዲህ እነርሱ፣ “አባትህ የት ነው?” እያሉት ነበር። ኢየሱስም፣ “እኔንም ሆነ አባቴን አታውቁም። እኔን ብታውቁ ኖሮ፣ አባቴንም ታውቁ ነበር” ብሎ መለሰ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: እያሉ ጠየቁት
  rationale: የግሪኩ ኢምፐርፌክት ጊዜ ቀጣይነት ወይም ድግግሞሽ ያመለክታል፤ በአማርኛ ጥያቄውን ተፈጥሯዊ በሆነ አነጋገር ለማቅረብ “እያሉ ጠየቁት” ተመርጧል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር ጋር ያለውን የውጤትና የትስስር ኃይል ይጠብቃል።
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: አባትህ የት ነው?
  rationale: የምንጩን ቀጥተኛ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: እኔንም ሆነ አባቴን አታውቁም
  rationale: οὔτε...οὔτε የሚያሳየውን “ሁለቱንም አይደለም” የሚል አሉታዊ ትይዩነት “እኔንም ሆነ...አታውቁም” በሚል ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: οἶδατε / ᾔδειτε
  choice: አታውቁም / ብታውቁ ኖሮ / ታውቁ ነበር
  rationale: “ማወቅ” የግሪኩን ሰፊ የእውቀትና የግንዛቤ ትርጉም ሳያጠብ በሦስቱም ቦታዎች የቃል ትስስሩን ይጠብቃል።
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: እኔን ብታውቁ ኖሮ፣ አባቴንም ታውቁ ነበር
  rationale: የግሪኩን ከእውነታ ተቃራኒ ሁኔታ በአማርኛ “ብታውቁ ኖሮ...ታውቁ ነበር” በሚል ግልጽ አወቃቀር ያቀርባል፤ καί ደግሞ በ“ም” ተንጸባርቋል።
theological_decisions:
- issue: “አባት” የሚለው ቃል መለኮታዊ አመልካችነት
  choice: አባትህ / አባቴን
  alternative: የአማርኛ ጽሑፍ የፊደል አቢይነት ስለማይለይ በቃሉ ላይ ተጨማሪ መለያ መጨመር
  rationale: ዐውደ ንባቡ አባት የሚለው እግዚአብሔርን እንደሚያመለክት ያሳያል። አማርኛ አቢይና ትንሽ ፊደል ስለሌለው ትርጉሙ ያለ ተጨማሪ ማብራሪያ ተጠብቋል።
- issue: ኢየሱስንና አብን “ማወቅ” ያለው ሥነ መለኮታዊ ስፋት
  choice: ማወቅ
  alternative: መለየት ወይም መረዳት
  rationale: “ማወቅ” የግል ግንዛቤን፣ መለየትንና እውቀትን ሊያካትት የሚችል ሰፊ ቃል ነው፤ የዮሐንስን ሥነ መለኮታዊ ውጥረት ወደ አእምሯዊ መረዳት ወይም ወደ ቀላል መለየት አያጠብም።
- issue: የሁኔታዊው ንግግር ጊዜና ከእውነታ ተቃራኒነት
  choice: እኔን ብታውቁ ኖሮ፣ አባቴንም ታውቁ ነበር
  alternative: እኔን አውቃችሁኝ ቢሆን ኖሮ፣ አባቴንም ባወቃችሁት ነበር
  rationale: የግሪኩ ኢምፐርፌክት እዚህ የአሁን ጊዜ ከእውነታ ተቃራኒ ሁኔታን በተፈጥሮ ሊገልጽ ይችላል። የተመረጠው አማርኛ ወደ ቀድሞ ጊዜ ብቻ ሳያዛውረው ይህን ኃይል ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እያሉ ጠየቁት” የኢምፐርፌክቱን ቀጣይ ገጽታ በተፈጥሯዊ ትረካ ያቀርባል። የግሪኩ ጥያቄ በቀጥታ “አሉት” ሊባል ቢችልም፣ “ጠየቁት” በአማርኛ የጥያቄውን ተግባር በግልጽ ያሳያል።
