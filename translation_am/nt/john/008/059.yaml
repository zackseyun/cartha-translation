id: JHN.8.59
reference: John 8:59
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: am
  text: ስለዚህ ወደ እርሱ ሊወረውሩ ድንጋዮችን አነሡ፤ ኢየሱስ ግን ተሰውሮ ከቤተ መቅደሱ[a] ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በትክክል ሲተረጎም፣ “ከቤተ መቅደሱ ግቢዎች” ወይም “ከቤተ መቅደሱ ስፍራ”፤ እዚህ ያለው የግሪክ ቃል ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን መላውን የቤተ መቅደስ ሕንጻና ግቢዎች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: አነሡ
  rationale: በዚህ ዐውድ ድንጋዮቹን ለመወርወር በእጅ ማንሣታቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ድርጊቱ ከቀደመው ንግግር የተነሣ ውጤት መሆኑን ያሳያል።
- source_word: λίθους
  choice: ድንጋዮችን
  rationale: በዚህ የድንጋይ ውርወራ ዐውድ የλίθος መደበኛና ግልጽ ትርጉም ነው።
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: ወደ እርሱ ሊወረውሩ
  rationale: ἵνα የሚገልጸውን ዓላማ በተፈጥሯዊ የአማርኛ የዓላማ አገላለጽ ያስተላልፋል፤ ἐπί ደግሞ ድንጋዮቹ ወደ እርሱ እንዲወረወሩ መታቀዱን ያሳያል።
- source_word: ἐκρύβη
  choice: ተሰውሮ
  rationale: የግሱን በዚህ ዐውድ ያለውን ራስን የመሰወር ፍቺ ይገልጻል፤ ሌላ ሰው ኢየሱስን እንደሰወረው አያመለክትም።
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: ከቦታው ወደ ውጭ መንቀሳቀሱን አጭርና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: ἐκ τοῦ ἱεροῦ
  choice: ከቤተ መቅደሱ
  rationale: በዋናው ጽሑፍ ለአንባቢ የሚታወቀውን መደበኛ አጠራር ይጠቀማል፤ ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን ግቢዎቹን ጨምሮ መላውን የቤተ መቅደስ ስፍራ ማመልከቱ በግርጌ ማስታወሻ ተብራርቷል።
theological_decisions:
- issue: ኢየሱስ ከአደጋው የወጣበት ሁኔታ
  choice: ጽሑፉ እንደሚለው ኢየሱስ ተሰውሮ ከቤተ መቅደሱ እንደወጣ ብቻ ተተርጉሟል።
  alternative: በተአምር በመካከላቸው አለፈ ወይም ከዓይን ተሰወረ ብሎ መጨመር።
  rationale: የቀረበው SBLGNT ጽሑፍ ተሰወረና ወጣ ብቻ ይላል፤ በአንዳንድ የኋለኛ ዘመን የእጅ ጽሑፎች የሚገኙ ተጨማሪ ዝርዝሮችን ወደ ትርጉሙ ማስገባት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “አነሡ” እና “ተሰውሮ” የተባሉት ቅርጾች ትክክለኛ ንባብን ለማገዝ በሆሄ ምልክት ቀርበዋል።
