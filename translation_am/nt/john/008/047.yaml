  text: ከእግዚአብሔር የሆነው[a] የእግዚአብሔርን ቃሎች ይሰማል። ስለዚህ እናንተ አትሰሙም፤ ከእግዚአብሔር ስላልሆናችሁ ነው[b]።
  philosophy: optimal-equivalence
