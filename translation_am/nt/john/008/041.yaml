  text: እናንተ የአባታችሁን ሥራዎች እየሠራችሁ ናችሁ።” እነርሱም፣ “እኛ ከዝሙት አልተወለድንም[a]፤ አንድ አባት አለን፤ እርሱም እግዚአብሔር ነው” አሉት።
  philosophy: optimal-equivalence
