  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: am
  text: በእናንተ ሕግም እንዲህ ተብሎ ተጽፏል፦ “የሁለት ሰዎች ምስክርነት እውነተኛ ነው።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμῳ
  choice: ሕግ
  rationale: በዚህ አውድ ኢየሱስ የሚጠቅሰውን የአይሁድ ቅዱስ መጽሐፋዊና ሕጋዊ ሥርዓት ያመለክታል።
- source_word: ὑμετέρῳ
  choice: በእናንተ
  rationale: የሁለተኛ መደብ ባለቤትነትንና የንግግሩን ርቀት ሳያጋንን ይጠብቃል።
- source_word: γέγραπται
  choice: ተብሎ ተጽፏል
  rationale: የቅዱስ መጽሐፍ ጥቅስ መግቢያ የሆነውን ፍጹም ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δύο ἀνθρώπων
  choice: የሁለት ሰዎች
  rationale: ἄνθρωπος እዚህ በሕጋዊ ብሂል ውስጥ ሰብዓዊ ምስክሮችን በአጠቃላይ ያመለክታል፤ የግሪኩ ἀνθρώπων በሥርዓተ ቃል ወንድ ጾታ የሚወስን ቅርጽ አይደለም።
- source_word: μαρτυρία
  choice: ምስክርነት
  rationale: የፍርድና የሕግ አውዱን በትክክል የሚያሳይ የተለመደ አማርኛ ቃል ነው።
- source_word: ἀληθής
  choice: እውነት
  rationale: የቃሉን መሠረታዊ ትርጉም ይጠብቃል፤ በአውዱ ያለው የሕጋዊ ተቀባይነት ፍንጭም እንዳለ ይተዋል።
- source_word: καὶ ... δὲ
  choice: እንዲሁም
  rationale: አያያዥና መጠነኛ አጽንዖት ያለውን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: “በእናንተ ሕግ” የሚለው የንግግር ኃይል
  choice: የግሪኩን ሁለተኛ መደብ ባለቤትነት በቀጥታ ማቆየት
  alternative: “በሕጉ” ወይም “በገዛ ሕጋችሁ”
  rationale: “በእናንተ” የኢየሱስን የንግግር ውጥረት ይጠብቃል፤ ነገር ግን ሕጉን እንደማይቀበል አድርጎ አይተረጉም።
- issue: δύο ἀνθρώπων በሕጋዊው ብሂል
  choice: “የሁለት ሰዎች”
  alternative: “የሁለት ወንዶች” ወይም “የሁለት ሰዎች ምስክሮች”
  rationale: ἀνθρώπων የἄνθρωπος ብዙ ቁጥር የባለቤት ቅርጽ ሲሆን ሰዎችን ወይም ሰብዓዊ ምስክሮችን በአጠቃላይ ሊያመለክት ይችላል። “ወንዶች” ማለት ግሪኩ በግልጽ ያልገደበውን ጾታ ይገድባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ዋናው ጽሑፍ የግሪኩን አጠቃላይ ἀνθρώπων በትክክል “ሰዎች” ስለሚል የቃል አማራጭ የግርጌ ማስታወሻ አላስፈለገም።
