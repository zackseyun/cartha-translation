review_pass:
  verdict: revise
  source_fidelity: The draft preserves the possessive force of ὑμετέρῳ, the scriptural-citation formula γέγραπται, and the legal sense of μαρτυρία. “የሁለት ሰዎች” appropriately renders the gender-inclusive ανθρώπων without importing a male-only limitation. However, ἀληθής is adjectival (“true”), for which “እውነተኛ ነው” is more exact than “እውነት ነው.”
  naturalness: “በእናንተ ሕግ ላይ” is understandable but less idiomatic for a text being written in a law; “በእናንተ ሕግም እንዲህ ተብሎ ተጽፏል” is natural modern standard Amharic and retains the connective emphasis.
  terminology: ሕግ, ምስክርነት, and ሰዎች are suitable, clear legal-register terms. No theological terminology is altered.
  issues:
  - severity: low
    issue: The locative phrase “በእናንተ ሕግ ላይ” is stylistically awkward in this citation formula.
    rationale: Amharic normally says that something is written “በ... ሕግ,” without “ላይ.”
  - severity: medium
    issue: “እውነት ነው” does not most directly represent the predicate adjective ἀληθής.
    rationale: “እውነተኛ ነው” naturally and accurately expresses “is true,” while leaving the legal implication implicit as in the Greek.
  revised_text: በእናንተ ሕግም እንዲህ ተብሎ ተጽፏል፦ “የሁለት ሰዎች ምስክርነት እውነተኛ ነው።”
  revised_footnotes: []
  revision_rationale: The revision removes an unnecessary locative element, places the citation formula in a more idiomatic order, and renders the Greek adjective ἀληθής with the Amharic predicate adjective “እውነተኛ.” It retains “በእናንተ” for the direct rhetorical possessive and “ሰዎች” for the non-sex-specific Greek ἀνθρώπων.
