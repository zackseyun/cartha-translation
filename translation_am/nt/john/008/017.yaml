revisions:
- from: እንዲሁም በእናንተ ሕግ ላይ፣ “የሁለት ሰዎች ምስክርነት እውነት ነው” ተብሎ ተጽፏል።
  to: በእናንተ ሕግም እንዲህ ተብሎ ተጽፏል፦ “የሁለት ሰዎች ምስክርነት እውነተኛ ነው።”
  rationale: The revision removes an unnecessary locative element, places the citation formula in a more idiomatic order, and renders the Greek adjective ἀληθής with the Amharic predicate adjective “እውነተኛ.” It retains “በእናንተ” for the direct rhetorical possessive and “ሰዎች” for the non-sex-specific Greek ἀνθρώπων.
