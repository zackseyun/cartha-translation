lexical_decisions:
- source_word: γνώσεσθε
  choice: ታውቃላችሁ
  rationale: የግሪኩን የወደፊት ጊዜ አገላለጽና የሁለተኛ መደብ ብዙ ቁጥር በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል። ቃሉ በዐውዱ ውስጥ ‘እያወቃችሁ ትመጣላችሁ’ የሚል ሂደታዊ ጥላ ሊኖረው ቢችልም፣ ዋናው ጽሑፍ ያንን አያስገድድም።
- source_word: τὴν ἀλήθειαν / ἡ ἀλήθεια
  choice: እውነቱን / እውነቱም
  rationale: በሁለቱም ስፍራዎች ያለውን የግሪክ መስተዋድድ እና የተወሰነነት ስሜት ‘እውነቱ’ በሚለው ቅርጽ ይጠብቃል፤ የምንጩንም ቃላዊ ድግግሞሽ አያጠፋም።
- source_word: ἐλευθερώσει
  choice: ነፃ ታወጣችኋለች
  rationale: ‘ነፃ ማውጣት’ የግሪኩን ከባርነት ወይም ከእስራት ነፃ የማድረግ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል። የነፃነቱን ዓይነት በዋናው ጽሑፍ አይጨምርም።
- source_word: ὑμᾶς
  choice: -አችኋለች
  rationale: በግሱ ላይ ያለው የተሳቢ ቅጥያ ሁለተኛ መደብ ብዙ ቁጥርን በግልጽ ያሳያል።
- source_word: καὶ ... καὶ
  choice: -ም ... -ም
  rationale: የአማርኛው አያያዥ ቅጥያ ‘-ም’ የሁለቱን καὶ አስተባባሪ ተግባር በተፈጥሯዊ ሁኔታ ያስተላልፍና የንግግሩን ምት ይጠብቃል።
theological_decisions:
- issue: ‘እውነቱም ነፃ ታወጣችኋለች’ በሚለው ውስጥ የነፃነቱ ባሕርይ
  choice: በዋናው ጽሑፍ ነፃነቱ ፖለቲካዊ፣ ሥነ ልቦናዊ ወይም በተለይ መንፈሳዊ መሆኑን አለመወሰን
  alternative: ‘ከኃጢአት ባርነት ነፃ ታወጣችኋለች’ ብሎ መተርጎም
  rationale: ተከታዮቹ ቁጥሮች ነፃነቱን ከኃጢአት ጋር ያያይዙታል፤ ይህ ቁጥር ግን ነፃነቱን በአጭሩ ብቻ ይገልጣል። ስለዚህ ዐውዱ እንዲተረጉመው መተው የምንጩን ሥነ መለኮታዊ ስፋትና ውጥረት ይጠብቃል።
