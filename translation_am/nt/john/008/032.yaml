    text: የዚህ ቁጥር አነጋገር የነፃነቱን ዓይነት በግልጽ አይወስንም፤ በዙሪያው ያለው ዐውድ ግን ከኃጢአት ነፃ መሆን ጋር ያያይዘዋል።
