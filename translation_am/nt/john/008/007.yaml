  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: am
  text: እነርሱ ግን[a] እርሱን መጠየቃቸውን ሲቀጥሉ፣ ቀና ብሎ እንዲህ አላቸው፦ “ከእናንተ መካከል ኃጢአት የሌለበት በእርሷ ላይ ቀድሞ ድንጋይ ይወርውር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር በዝሙት ሲፈጽም ስለተያዘችው ሴት የሚናገረው ታሪክ ክፍል ነው (ዮሐንስ 7፥53–8፥11)፤ ይህ ታሪክ በቀደሙት የግሪክ የእጅ ጽሑፎች ውስጥ የለም። በዮሐንስ 7፥53 ላይ ያለውን ማስታወሻ ይመልከቱ።
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: መጠየቃቸውን በቀጠሉ ጊዜ
  rationale: ያልተቋረጠውንና ቀጣይነት ያለውን የመጠየቅ ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀνακύψας
  choice: ቀና ብሎ
  rationale: ኢየሱስ ጎንበስ ብሎ ከነበረበት አቋም ወደ ላይ መነሣቱን አጭርና ተፈጥሯዊ በሆነ አገላለጽ ይገልጣል።
- source_word: ἀναμάρτητος
  choice: ኃጢአት የሌለበት
  rationale: ቃሉ የሚያካትተውን ሥነ ምግባራዊና የፍርድ አውድ ሳያጠብ የግሪኩን ‘ከኃጢአት ነጻ’ የሚል ሰፊ ትርጉም ይጠብቃል።
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: በእርሷ ላይ መጀመሪያ ድንጋይ ይወርውር
  rationale: የግሪኩን ቅደም ተከተልና የትእዛዙን ኃይል በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἀναμάρτητος ፍጹም ኃጢአት አልባነትን ወይስ በዚህ ጉዳይ ከበደል ነጻ መሆንን ያመለክታል?
  choice: ኃጢአት የሌለበት
  alternative: በዚህ ጉዳይ ጥፋት የሌለበት
  rationale: የግሪኩ ቃል ሰፊ ሲሆን ዐውዱ ሕጋዊ ክብደትም አለው፤ ትርጉሙን በዚህ ወንጀል ብቻ እንዳይገደብ ሰፊው አገላለጽ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ቀና ብሎ” የአካላዊውን እንቅስቃሴ በተፈጥሯዊ አገላለጽ ያሳያል፤ የጽሑፍ ልዩነቱም በ[a] ማስታወሻ በግልጽ ተጠቅሷል።
