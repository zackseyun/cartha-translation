  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ከእግዚአብሔር ወጥቼ መጥቻለሁ።”
    reason: lexical_alternative
  - marker: b
