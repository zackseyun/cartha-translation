  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: am
  text: እኔ በአብ ዘንድ ያየሁትን እናገራለሁ፤ እናንተም እንግዲህ ከአባታችሁ የሰማችሁትን ታደርጋላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
