  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: am
  text: ስለዚህ፣ በኃጢአቶቻችሁ ትሞታላችሁ ብዬ ነገርኳችሁ። ምክንያቱም፣ «እኔ ነኝ» ብላችሁ ካላመናችሁ[a]፣ በኃጢአቶቻችሁ ትሞታላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «እኔ ነኝ»። በግሪክኛው ከዚህ በኋላ ግልጽ ማሟያ የለም፤ ይህ አገላለጽ በዮሐንስ ወንጌል ውስጥ ጥልቅ ተያያዥ ፍቺ ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: ስለዚህ፣ … ነገርኳችሁ
  rationale: οὖν ያለፈውን ንግግር ከዚህ ውጤት ጋር ያገናኛል፤ «ስለዚህ» ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል። εἶπον ὑμῖν ደግሞ «ነገርኳችሁ» ተብሎ በቀላሉ ተተርጉሟል።
- source_word: ἀποθανεῖσθε
  choice: ትሞታላችሁ
  rationale: የወደፊት ጊዜውንና የብዙ ቁጥር አድራሻውን በቀጥታ ያስተላልፋል፤ «ትጠፋላችሁ» የሚለውን ተጨማሪ ትርጓሜ አያስገባም።
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: በኃጢአቶቻችሁ
  rationale: የἁμαρτίαιςን ብዙ ቁጥር ይጠብቃል፤ ἐν እዚህ ሰዎቹ በኃጢአታቸው ሁኔታ ውስጥ እንደቀሩ መሞታቸውን ያመለክታል።
- source_word: ἐὰν γὰρ μὴ πιστεύσητε
  choice: ካላመናችሁ … ትሞታላችሁና
  rationale: «ካላመናችሁ» አሉታዊውን ሁኔታ ያሳያል፤ የመጨረሻው «-ና» ደግሞ γάρ የሚሰጠውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὅτι ἐγώ εἰμι
  choice: እኔ እንደሆንኩ
  rationale: ግሪኩ ከ«እኔ ነኝ» በኋላ ግልጽ ማሟያ አይሰጥም። «እኔ እንደሆንኩ» ይህን ክፍትነት ይጠብቃል፤ «እኔ እርሱ እንደሆንኩ» የሚል በጽሑፉ የሌለ ማሟያ አያክልም።
theological_decisions:
- issue: ἐγώ εἰμι ያለ ግልጽ ማሟያ መተርጎም
  choice: እኔ እንደሆንኩ
  alternative: እኔ እርሱ እንደሆንኩ
  rationale: አገላለጹ ቀላል ራስን መለየትን ሊያመለክት ይችላል፤ በዮሐንስ ወንጌል ውስጥ ግን የጠለቀ ድምፀ ተያያዥነትም ሊኖረው ይችላል። ዋናው ጽሑፍ የግሪኩን አሻሚነት ይጠብቃል፤ ማስታወሻውም ምክንያቱን ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ኃጢአት» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የዓረፍተ ነገሩ አወቃቀር ግን ለዘመናዊ አንባቢ ተፈጥሯዊ እንዲሆን ተደርጓል።
