  text: አይሁዳውያኑም[a] መልሰው እንዲህ አሉት፦ “አንተ ሳምራዊ ነህ፣ ጋኔንም አለብህ[c] ብለን የምንናገረው ትክክል አይደለምን?[b]”
  philosophy: optimal-equivalence
  footnotes:
