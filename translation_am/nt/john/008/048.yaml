    text: በአንዳንድ አውዶች «የይሁዳ ነዋሪዎች» ወይም «የአይሁድ መሪዎች» ተብሎ ሊተረጎም ይችላል። በዮሐንስ ወንጌል «አይሁዳውያኑ» የሚለው ብዙ ጊዜ ኢየሱስን የሚቃወም የተወሰነ ቡድንን ያመለክታል እንጂ እያንዳንዱን አይሁዳዊ ያለ ልዩነት አያመለክትም።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «…ብለን በትክክል አንናገርምን?»
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «ጋኔን አለብህ»፤ አንዳንድ ትርጉሞች ይህን በትርጓሜ ሰፋ አድርገው «በጋኔን ተይዘሃል» ብለው ያቀርቡታል።
    reason: lexical_alternative
