source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: am
  text: ስለዚህ ኢየሱስ፣ “የሰውን ልጅ ከፍ ባደረጋችሁት ጊዜ[b]፣ ያን ጊዜ እኔ እንደሆንሁ[a]፣ ከራሴም ምንም እንደማላደርግ፣ ነገር ግን አብ እንዳስተማረኝ እነዚህን እንደምናገር ታውቃላችሁ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “እኔ ነኝ።” የግሪኩ አገላለጽ ገላጭ ቃል ሳይጨምር በቀጥታ “እኔ ነኝ” (ἐγώ εἰμι) ይላል።
    reason: alternative_reading
  - marker: b
    text: “ከፍ ማድረግ” በአካል ወደ ላይ ማንሣትንም፣ በዮሐንስ አጠቃቀም ወደ ክብር ከፍ ማድረግንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚቀጥለውን ውጤትና ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ὅταν
  choice: በ…ጊዜ
  rationale: በዐውዱ የተወሰነውን ወደፊት የሚፈጸም ክስተት ያመለክታል፤ ተደጋጋሚ ድርጊትን አያመለክትም።
- source_word: ὑψώσητε
  choice: ከፍ ባደረጋችሁት
  rationale: በዮሐንስ የሚታየውን በአካል ወደ ላይ መነሣትና ከፍ ከፍ መደረግ የተዋሐደ ፍቺ ሳይወስን ይጠብቃል።
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: የሰውን ልጅ
  rationale: የኢየሱስን የራስ መጠሪያና ከትንቢታዊ ጽሑፎች ጋር ያለውን ትስስር የሚጠብቅ የተለመደ አተረጓጎም ነው።
- source_word: γνώσεσθε
  choice: ታውቃላችሁ
  rationale: የወደፊት ጊዜ መገንዘብንና ማወቅን በግልጽና ተፈጥሯዊ ቋንቋ ያሳያል።
- source_word: ἐγώ εἰμι
  choice: እኔ እርሱ እንደሆንኩ
  rationale: በአማርኛ የዓረፍተ ነገሩን ተፈጥሯዊነት ይጠብቃል፤ በግሪክ ግን ገላጭ ቃል የሌለው መሆኑ በማስታወሻ ተገልጧል።
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ከራሴ
  rationale: የድርጊቱን ምንጭና ከራስ ተነሣሽነት አለማድረግን በአጭርና ቅርብ አገላለጽ ያስተላልፋል።
- source_word: ποιῶ οὐδέν
  choice: ምንም እንደማላደርግ
  rationale: የኢየሱስን አጠቃላይ መግለጫ በቀጥታ ይጠብቃል።
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: አብ እንዳስተማረኝ
  rationale: καθώς የሚያሳየውን ተዛማጅነት ይጠብቃል፤ ὁ πατήρ በዮሐንስ ዐውድ በተለመደው “አብ” ተተርጉሟል።
- source_word: ταῦτα λαλῶ
  choice: እነዚህን እንደምናገር
  rationale: ταῦτα የሚለውን አመልካች ቃል በግልጽ ይጠብቃል፤ λαλέωንም በተፈጥሯዊው “እናገራለሁ” ያቀርባል።
theological_decisions:
- issue: ገላጭ ቃል የሌለውን ἐγώ εἰμι መተርጎም
  choice: እኔ እርሱ እንደሆንኩ
  alternative: እኔ ነኝ
  rationale: ዋናው ጽሑፍ በአማርኛ ተፈጥሯዊ እንዲሆን ሲደረግ፣ የግሪኩ ገላጭ ቃል አልባነትና ሊኖረው የሚችለው መለኮታዊ ማጣቀሻ በማስታወሻ ተጠብቋል፤ አንዱን ትርጉም ብቻ በግድ አይወስንም።
- issue: በዮሐንስ ዐውድ የὑψώσητε ድርብ ፍቺ
  choice: ከፍ ባደረጋችሁት
  alternative: በመስቀል ላይ በሰቀላችሁት / ከፍ ከፍ ባደረጋችሁት
  rationale: ቃሉ በመስቀል ላይ በአካል ከፍ መደረግንና ክብር ከፍታን በአንድነት ሊያስተጋባ ስለሚችል፣ ትርጉሙ ከሁለቱ አንዱን ብቻ አልመረጠም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “አብ” እና “የሰው ልጅ” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ የዓረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
