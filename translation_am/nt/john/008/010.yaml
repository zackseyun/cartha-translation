id: JHN.8.10
reference: John 8:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: am
  text: ኢየሱስም[a] ቀና ብሎ፣ ከሴቲቱ በቀር ሌላ ማንንም ባላየ ጊዜ፣ “አንቺ ሴት፣ እነዚያ ከሳሾችሽ የት አሉ? ማንም አልፈረደብሽምን?” አላት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር በዝሙት ስትፈጽም ስለተያዘችው ሴት የሚናገረው ታሪክ (ዮሐንስ 7፥53–8፥11) ክፍል ነው፤ ይህ ታሪክ ከቀደሙት የግሪክ የእጅ ጽሑፎች ውስጥ አይገኝም። በዮሐንስ 7፥53 ላይ ያለውን ማስታወሻ ይመልከቱ።
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: ቀና ብሎ
  rationale: ኢየሱስ መሬት ላይ ለመጻፍ ከጎነበሰበት አቋሙን ከፍ ማድረጉን በተፈጥሯዊ አማርኛ ይገልጻል፤ የግድ ሙሉ በሙሉ መቆሙን አያስገባም።
- source_word: θεασάμενος
  choice: ባላየ ጊዜ
  rationale: የእይታ ግንዛቤውንና ሕዝቡ ሄዶ እንደነበር ማስተዋሉን ቀጥተኛና ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
- source_word: οἱ κατήγοροί σου
  choice: ከሳሾችሽ
  rationale: በሕጋዊ ወይም ከፊል ሕጋዊ አውድ በሴቲቱ ላይ ክስ ያቀረቡትን ሰዎች በትክክል ይጠቁማል።
- source_word: κατέκρινεν
  choice: ፈረደብሽ
  rationale: በጥፋተኝነት ላይ የቅጣት ፍርድ መስጠትን ያመለክታል፤ ተራውን 'መፍረድ' ብቻ ሳይሆን በሰውየዋ ላይ የተሰጠ ፍርድ መሆኑን '-ብሽ' ያሳያል።
theological_decisions:
- issue: የዮሐንስ 7፥53–8፥11 ጽሑፋዊ ሁኔታ
  choice: ቁጥሩ በዋናው ጽሑፍ ተተርጉሞ የጥንታዊ የእጅ ጽሑፎች ማስረጃ በማስታወሻ ተገለጸ
  alternative: ክፍሉን ከዋናው ጽሑፍ ማስወገድ ወይም ያለ ማስታወሻ ማቅረብ
  rationale: የቀረበው ባይዛንታይን ምንጭ ቁጥሩን ይዟል፤ ሆኖም ታሪኩ ከቀደሙት የግሪክ የእጅ ጽሑፎች አለመገኘቱ አንባቢው ሊያውቀው የሚገባ እውነተኛ ጽሑፋዊ ጉዳይ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አንቺ ሴት” የግሪኩን Ἡ γυνή ቀጥተኛ አድራሻ ይጠብቃል፤ በዚህ አውድ ንቀትን አያመለክትም።
