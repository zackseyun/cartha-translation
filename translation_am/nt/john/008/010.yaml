    issue: The phrase “ከሴቲቱ በቀር ማንንም ባላየ ጊዜ” lacks an explicit equivalent of “else/other.”
    rationale: Although comprehensible, adding “ሌላ” makes the exceptive construction idiomatic and clearly communicates that Jesus saw no person other than the woman.
