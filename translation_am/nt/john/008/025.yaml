  rationale: የግሪኩን አጭርና አሻሚ አገላለጽ በአማርኛ ሙሉ መልስ አድርጎ ያቀርባል፤ καί የሚሰጠውን “ይኸው/በትክክል” ዓይነት አጽንዖት በመልሱ ቅርጽ ይጠብቃል።
