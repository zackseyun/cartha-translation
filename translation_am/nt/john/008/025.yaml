- source_word: Τὴν ἀρχὴν
  choice: ከመጀመሪያው ጀምሮ
  rationale: በዚህ ዐውድ የጊዜ አነባበቡን “from the beginning” በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
