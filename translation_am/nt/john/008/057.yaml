  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: am
  text: ስለዚህ አይሁድ[a]፣ “ገና ሃምሳ ዓመት እንኳ አልሞላህም፤ አብርሃምንም አይተኸዋልን?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የይሁዳ ሰዎች” ወይም “የአይሁድ መሪዎች”፤ ትርጉሙ ዮሐንስ በዚህ አውድ οἱ Ἰουδαῖοι የሚለውን ስያሜ ምን ያህል ሰፊ አድርጎ እንደተጠቀመበት ይወሰናል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን ሰፊ የትረካ መጠሪያ በቀጥታ ይጠብቃል፤ አውዱ መሪዎችን ብቻ ብሎ አይገድበውም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው የኢየሱስ ንግግር የሚከተለውን ውጤታዊ ምላሽ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: ገና ሃምሳ ዓመት እንኳ አልሞላህም
  rationale: በግሪክ ዕድሜን ‘መያዝ’ በሚለው ፈሊጥ የተገለጠውን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ‘እንኳ’ የοὔπωን አጽንዖት ያሳያል።
- source_word: ἑώρακας
  choice: አይተኸዋልን
  rationale: የግሪኩን ፍጹም ጊዜ እና የጥያቄውን አለማመን በአማርኛ ፍጹም አወቃቀር ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: ከቀደመው ንግግር ጋር ያለውን ጭማሪና አነጻጻሪ ትስስር በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
- source_word: Ἀβραὰμ
  choice: አብርሃም
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚለውን መተርጎም
  choice: አይሁድ
  alternative: የይሁዳ ሰዎች፤ የአይሁድ መሪዎች
  rationale: ግሪኩ በዚህ ቦታ ማንነታቸውን ወደ መሪዎች ብቻ አያጠብብም። ስለዚህ ዋናው ጽሑፍ ሰፊውን መጠሪያ ይጠብቃል፤ አውዳዊ አማራጮቹ ግን በማስታወሻ ተጠቅሰዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ጥያቄው ያለውን የመደነቅና ያለማመን ስሜት ለማቆየት “እንኳ” እና የፍጹም ጊዜ አወቃቀር ተጠቅመዋል።
