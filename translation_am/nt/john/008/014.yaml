  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “መልሶ እንዲህ አላቸው” የግሪኩን ድርብ የትረካ አገላለጽ በተፈጥሯዊ መንገድ ያቀርባል፤ ምስክርነት የሚለውም ቃል በጥቅሱ ያለውን የምስክር/ሕግ ጥላ ይጠብቃል።
