  text: ኢየሱስም መልሶ እንዲህ አላቸው፦ “ስለ ራሴ ብመሰክር እንኳ፣[a] ከየት እንደመጣሁና ወዴት እንደምሄድ ስለማውቅ፣ ምስክርነቴ እውነት ነው፤ እናንተ ግን ከየት እንደምመጣ ወይም ወዴት እንደምሄድ[b] አታውቁም።”
  philosophy: optimal-equivalence
  footnotes:
