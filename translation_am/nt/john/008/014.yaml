  rationale: ጥቅሱ ራሱ የኢየሱስን ምንጭና መዳረሻ በዚህ ቦታ በዝርዝር አይገልጽም፤ ስለዚህ ሰፊው የዮሐንስ ክርስቶሎጂ ከዐውዱ እንዲታይ ተጨማሪ ዶግማዊ ቃላት አልገቡም።
