    text: ወይም፣ “ስለ ራሴ ምስክርነት ብሰጥም።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “ወይም ወዴት እንደምሄድ” በሚለው ፋንታ “እና ወዴት እንደምሄድ” ይላሉ።
    reason: textual_variant
