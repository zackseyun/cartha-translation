lexical_decisions:
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪኩ ኢምፐርፌክት ጊዜ በዚያ ሁኔታ ንግግሩ ቀጣይ ወይም ተደጋጋሚ መሆኑን ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም ያንን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Ὑμεῖς / ἐγὼ
  choice: እናንተ / እኔ
  rationale: በግሪኩ በአጽንዖት የተጠቀሱትን ተውላጠ ስሞች በመጠበቅ፣ በኢየሱስና በአድማጮቹ መካከል ያለው ተቃርኖ ጎልቶ እንዲታይ ተደርጓል።
- source_word: ἐκ τῶν κάτω
  choice: ከታች ናችሁ
  rationale: ከἐκ τῶν ἄνω ጋር ያለውን የአቅጣጫና የመንፈሳዊ ምስል ተቃርኖ በአጭርና በተፈጥሯዊ አማርኛ ይጠብቃል፤ ምስሉንም ከልክ በላይ አይተረጉምም።
- source_word: ἐκ τῶν ἄνω
  choice: ከላይ ነኝ
  rationale: “ከታች” ከሚለው ጋር ያለውን ቀጥተኛ ተቃርኖ እና በዮሐንስ የሚታየውን የላይና የታች ምስል ይጠብቃል።
- source_word: κόσμος
  choice: ዓለም
  rationale: κόσμος ሰፊ የትርጉም ክልሉን የሚጠብቀው መደበኛ አማርኛ አቻ “ዓለም” ነው፤ በዮሐንስ አውድ ከእግዚአብሔር የራቀውን የሰው ሥርዓትም ሊያመለክት ይችላል።
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: ከዚህ ዓለም
  rationale: በሁለቱም የግሪክ የቃላት አደራደሮች ያለው አመልካች ቅጽ ተጠብቆ፣ አድማጮቹ የሆኑበትና ኢየሱስ ያልሆነበት ክልል ተለይቷል።
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: እኔ ከዚህ ዓለም አይደለሁም
  rationale: የἐκን ምንጭና መገኛ ሐሳብ በአማርኛ በተፈጥሯዊ መንገድ ይጠብቃል፤ “የዚህ ዓለም ወገን አይደለሁም” ቢባል ወደ ዝምድና ወይም ታማኝነት ትርጉም ይጠጋ ነበር።
theological_decisions:
- issue: “ከታች/ከላይ” እና “ከዚህ ዓለም” የሚሉት ንጽጽሮች ትርጉም
  choice: ትርጉሙ የመገኛ፣ የምንጭና የክልል ቋንቋውን ሳያሰፋ ጠብቋል።
  alternative: ንጽጽሩን በግልጽ “ሰማያዊና ምድራዊ” ወይም “መልካምና ክፉ” በሚል ሥነ ምግባራዊ አነጋገር መተርጎም።
  rationale: ጥቅሱ በኢየሱስና በተቃዋሚዎቹ መካከል ጠንካራ የዮሐንስ ንጽጽር ያቀርባል፤ ሆኖም የግሪኩን ምስል ወደ አንድ ጠባብ ዶክትሪናዊ ማብራሪያ መቀየር አይገባም።
