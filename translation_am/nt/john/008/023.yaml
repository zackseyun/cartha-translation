base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: am
  text: 'እንዲህም ይላቸው ነበር፦ “እናንተ ከታች ናችሁ[a]፤ እኔ ከላይ ነኝ። እናንተ ከዚህ ዓለም[b] ናችሁ፤ እኔ ከዚህ ዓለም አይደለሁም።”


    [a] ወይም፣ “እናንተ ከታች ካለው ናችሁ፤ እኔ ከላይ ካለው ነኝ።”

    [b] በዮሐንስ ወንጌል “ዓለም” የሚለው ቃል ብዙ ጊዜ ምድርን ብቻ ሳይሆን፣ ከእግዚአብሔር የራቀውን የሰው ሥርዓት ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተ ከታች ካለው ናችሁ፤ እኔ ከላይ ካለው ነኝ።”
