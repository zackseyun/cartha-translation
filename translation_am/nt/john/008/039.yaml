  choice: ከሆናችሁ፣ … ትሠሩ ነበር
  rationale: የመጀመሪያውን የአሁን ጊዜ ሁኔታና በመጨረሻው የአልተፈጸመ ሁኔታ ጥላ ያለበትን ያለፈ ጊዜ ግስ በአማርኛ በሚቻል መጠን ይጠብቃል።
theological_decisions:
- issue: የአብርሃም ልጅነት ትርጉም
  choice: የልጅነትን ቃል በቀጥታ ማቅረብና ከአብርሃም ሥራዎች ጋር ያለውን ንጽጽር መጠበቅ
