  rationale: የምላሽንና የመናገርን ሁለት ግሶች ሳያጠፋ፣ በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ አነጋገር ያቀርባል።
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
