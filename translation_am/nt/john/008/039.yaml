- issue: የሁኔታዊው ንግግር እውነታዊ ወይም ከእውነት ተቃራኒ ኃይል
  choice: በዋናው ጽሑፍ “ከሆናችሁ … ትሠሩ ነበር” ብሎ የግሪኩን ውጥረት መጠበቅ
  alternative: “ብትሆኑ ኖሮ … ትሠሩ ነበር” ብሎ ሙሉ በሙሉ ከእውነት ተቃራኒ አድርጎ ማቅረብ
  rationale: ἐστε የአሁን ጊዜ አመልካች ሲሆን ἐποιεῖτε ያልተፈጸመን ሁኔታ ሊጠቁም የሚችል ያለፈ ጊዜ ነው። ዋናው ትርጉም ይህን ያልተለመደ ውህደት ይጠብቃል፤ ሌላው ንባብ በማስታወሻ ተገልጿል።
