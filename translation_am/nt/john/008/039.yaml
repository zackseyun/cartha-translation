    text: ወይም፣ “የአብርሃም ልጆች ብትሆኑ ኖሮ፣ የአብርሃምን ሥራዎች ትሠሩ ነበር።” የግሪኩ ያለፈ ጊዜ ግስ ሁኔታው ከእውነት ተቃራኒ እንደሆነ የሚጠቁም ሆኖ ሊገባ ይችላል።
