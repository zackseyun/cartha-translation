- source_word: τέκνα τοῦ Ἀβραάμ
  choice: የአብርሃም ልጆች
  rationale: τέκνα ሁለቱንም ፆታዎች የሚያካትት የልጅነት ግንኙነትን ስለሚገልጥ፣ “ልጆች” ትክክለኛና ተፈጥሯዊ ነው።
