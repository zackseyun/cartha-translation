    reason: lexical_alternative
  - marker: b
    text: በግሪኩ “በኃጢአታችሁ” የሚለው ነጠላ ቁጥር ነው። አንዳንድ ትርጉሞች “በኃጢአቶቻችሁ” ይላሉ፤ ነጠላው ግን ከየግል ድርጊቶች ይልቅ ቀጣይ የኃጢአት ሁኔታን ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ልትመጡ አትችሉም።”
    reason: lexical_alternative
