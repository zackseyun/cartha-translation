base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: am
  text: የእኔን አነጋገር የማትረዱት ለምንድር ነው? ቃሌን መስማት ስለማትችሉ ነው።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ንግግሬን” ወይም “ቋንቋዬን።” የግሪኩ ቃል የኢየሱስን የንግግር መንገድ ሊያመለክት ይችላል፤ እዚህም በሚቀጥለው ሐረግ ካለው “ቃሌን” የተለየ ቃል ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቃሌን መስማት አትችሉም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: አነጋገር
  rationale: ቃሉ ከንግግሩ ይዘት ይልቅ የኢየሱስን የንግግር መንገድ ሊያመለክት ስለሚችል፣ ቀጥሎ ካለው λόγος (‘ቃል’) ጋር ያለውን ልዩነት ‘አነጋገር’ ይጠብቃል።
- source_word: γινώσκετε
  choice: ትረዱ
  rationale: በዚህ ዐውድ ቃሉ ስለ ንግግሩ መረዳት እንጂ ስለ ቀላል ዕውቀት አይናገርም።
- source_word: ἀκούειν
  choice: መስማት
  rationale: መሠረታዊውን ‘መስማት’ የሚለውን ፍቺ ይጠብቃል፤ መቀበልን ወይም ታዛዥነትን በትርጉሙ ውስጥ አያስገባም።
- source_word: λόγον
  choice: ቃሌን
  rationale: ‘ቃል’ የኢየሱስን ንግግር ወይም መልእክት ሊያመለክት ይችላል፤ ከλαλιά (‘አነጋገር’) ያለውን የቃላት ልዩነትም ያቆያል።
- source_word: οὐ δύνασθε
  choice: ስለማትችሉ
  rationale: የግሪኩን የአለመቻል ኃይል በቀጥታ ያሳያል፤ ይህን አለመቻል እንደ ፈቃደኝነት ማጣት ብቻ አያቀርበውም።
- source_word: ὅτι
  choice: ስለ… ነው
  rationale: ከቀደመው ጥያቄ በኋላ ምክንያቱን በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: የእኔን / ቃሌን
  rationale: የባለቤትነት አገላለጹን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በመጀመሪያው ሐረግ ‘የእኔን’ የሚለው አጽንዖት፣ በሁለተኛውም ‘ቃሌን’ የሚለው ባለቤትነት ተጠብቋል።
theological_decisions:
- issue: ‘ቃሌን መስማት ስለማትችሉ’ ውስጥ የተገለጸው የአለመቻል ባሕርይ
  choice: አለመቻሉን በቀጥታ ማቅረብ፣ የሥነ መለኮት መንስኤውን ግን አለመወሰን
  alternative: እንደ ሥነ ምግባራዊ እምቢተኝነት፣ እንደ ፍርዳዊ ማደንደን፣ ወይም እንደ መንፈሳዊ አቅም ማጣት በግልጽ መተርጎም
  rationale: ጥቅሱ አለመቻልን ይገልጻል፤ የአለመቻሉን ሙሉ መንስኤ ግን በዚሁ ጥቅስ አይወስንም። ስለዚህ ትርጉሙ ያለውን የሥነ መለኮት ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አነጋገር’ እና ‘ቃል’ የሚሉት ቃላት በλαλιά እና λόγος መካከል ያለውን ልዩነት ይጠብቃሉ። የጥያቄውና የመልሱ ቅርጽ በተፈጥሯዊ አማርኛ ተይዟል።
