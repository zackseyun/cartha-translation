source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: am
  text: '[a] በሕጋችን ሙሴ እንደዚህ ያሉ ሴቶች በድንጋይ እንዲወገሩ አዝዟል። እንግዲህ አንተ ምን ትላለህ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ በዝሙት ስትፈጽም ስለተያዘችው ሴት ታሪክ (ዮሐንስ 7፥53–8፥11) ቀጣይ ክፍል ነው። በዮሐንስ 7፥53 ላይ ያለውን ማስታወሻ ይመልከቱ።
    reason: textual_critical
lexical_decisions:
- source_word: τοιαύτας
  choice: እንደነዚህ ያሉት ሴቶች
  rationale: የግሪኩ ቃል አንስታይ ብዙ ቁጥር ሲሆን፣ በዐውዱ እንዲህ ባለ ድርጊት የተያዙ ሴቶችን ያመለክታል።
- source_word: λιθοβολεῖσθαι
  choice: በድንጋይ እንዲወገሩ
  rationale: የአሁን ጊዜ ተገብሮ የሚያመለክተው በድንጋይ የሚፈጸም የሞት ቅጣት ነው፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐνετείλατο
  choice: አዝዟል
  rationale: የሙሴን ሥልጣናዊ ትእዛዝ በቀጥታና በተለመደ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ክርክር የሚነሳውን መደምደሚያዊ ጥያቄ ያሳያል፤ ጊዜያዊ ‘አሁን’ የሚል ትርጉም አይጨምርም።
theological_decisions:
- issue: የሙሴ ሕግ ትክክለኛ ድንጋጌ እና የከሳሾቹ አቀራረብ
  choice: የተናጋሪዎቹን አባባል ያለ ማብራሪያ በቀጥታ ማቅረብ
  alternative: በሕጉ ውስጥ ስለ ሁለቱም ወገኖች ወይም ስለ ሞት ቅጣቱ ዝርዝር ማከል
  rationale: ጥቅሱ የከሳሾቹን ንግግር ብቻ ይዘግባል፤ ትርጉሙ የሕጉን ዝርዝር በመጨመር ወይም የእነርሱን አባባል በማረም የጽሑፉን ውጥረት ሊፈታ አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አማርኛ አንባቢ ግልጽ የሆነ አገላለጽ ተጠቅሟል። የግሪኩ δέ እዚህ ቀላል የንግግር ማያያዣ ስለሆነ በተለየ ቃል አልተተረጎመም፤ οὖν ግን ‘እንግዲህ’ ተብሎ ተጠብቋል።
