  to: እነርሱም እንዲህ ብለው መለሱለት፦ “እኛ የአብርሃም ዘር[a] ነን፤ ለማንም ከቶ ባሪያ ሆነን አናውቅም[b]። ታዲያ አንተ፣ ‘ነፃ ትሆናላችሁ’ እንዴት ትላለህ?”
  rationale: The collective singular ዘር restores the form and sense of Σπέρμα without adding theological interpretation. Footnote c is removed because its proposed wording is not a faithful alternative to the Greek phrase and modern Amharic does not cleanly mark the slight “become” versus “be” distinction without awkwardness. The main wording ነፃ ትሆናላችሁ adequately conveys the future transition in context.
