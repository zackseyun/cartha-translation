base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: am
  text: እነርሱም እንዲህ ብለው መለሱለት፦ “እኛ የአብርሃም ዘር[a] ነን፤ ለማንም ከቶ ባሪያ ሆነን አናውቅም[b]። ታዲያ አንተ፣ ‘ነፃ ትሆናላችሁ’ እንዴት ትላለህ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአብርሃም ዘሮች።” ግሪክኛው አካላዊ ዝርያን ለመግለጽ በነጠላ ቅርጽ የቀረበ ስብስባዊ አገላለጽ ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለማንም ከቶ አገልግለን አናውቅም።” ግሱ “ማገልገል” ማለት ሊሆን ቢችልም፣ በዚህ አውድ የባርነትና የመገዛት ትርጉሙ የበለጠ ጎልቶ ይታያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: እነርሱም እንዲህ ብለው መለሱለት
  rationale: ቀጥተኛውን ምላሽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ πρὸς αὐτόν የምላሹን ተቀባይ በ‘ለት’ ያሳያል።
- source_word: Σπέρμα Ἀβραάμ
  choice: የአብርሃም ዘሮች
  rationale: σπέρμα በነጠላ ቅርጽ የቀረበ የዘር ሐረግ ስብስባዊ አገላለጽ ነው፤ ‘ዘሮች’ በዘመናዊ አማርኛ የሥጋ ዝርያን በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: ለማንም ከቶ ባሪያ ሆነን አናውቅም
  rationale: የፍጹም ጊዜውን እስከአሁን ያለ ልምድ በ‘አናውቅም’ ያሳያል፤ በአውዱ የነፃነትና የባርነት ንፅፅር ስላለ ‘ባሪያ ሆነን’ ከቀላሉ ‘አገልግለን’ ይልቅ የተሻለ ነው።
- source_word: πῶς σὺ λέγεις
  choice: ታዲያ አንተ፣ … እንዴት ትላለህ?
  rationale: πῶς የሚያሳየውን የመገረምና የተቃውሞ ጥያቄ ይጠብቃል፤ ግልጽ የሆነው σὺ በ‘አንተ’ ተጠብቆ ቀርቧል።
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: ነፃ ትሆናላችሁ
  rationale: ἐλεύθεροι የነፃነትን ሁኔታ ያሳያል፤ γενήσεσθε የሚያመለክተው ወደዚያ ሁኔታ መድረስ በአማርኛው ‘ትሆናላችሁ’ ውስጥ በተፈጥሯዊ ሁኔታ ተጠብቋል።
