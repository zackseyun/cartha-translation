  rationale: የግሪኩ ፍጹም ጊዜ እስከ አሁን የዘለቀውን አለማወቅ ሊያመለክት ይችላል፤ ይህ አተረጓጎም ቅርጹንና የአሁኑን ውጤት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οἶδα
  choice: አውቀዋለሁ
  rationale: οἶδα በቅርጹ ፍጹም ቢሆንም እንደ አሁን ጊዜ ሁኔታዊ ግስ ‘አውቃለሁ’ የሚል ፍቺ አለው።
