  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: am
  text: እናንተ ግን እርሱን አላወቃችሁትም፤[a] እኔ ግን አውቀዋለሁ። “እርሱን አላውቀውም” ብል፣[b] እንደ እናንተ ውሸታም እሆናለሁ። ነገር ግን እኔ አውቀዋለሁ፤ ቃሉንም እጠብቃለሁ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን አታውቁትም።” የግሪኩ ግስ በፍጹም ጊዜ ቅርጽ የተጻፈ ሲሆን፣ እስከ አሁን የዘለቀውን እውነተኛ አለማወቃቸውን ለማጉላት ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንኳ ብል።” የግሪኩ አገላለጽ ግምታዊ ሁኔታን ያቀርባል።
    reason: lexical_alternative
  - marker: c
    text: “እጠብቃለሁ” የሚለው “እታዘዛለሁ” ወይም “አከብራለሁ” ተብሎም ሊተረጎም ይችላል፤ በዮሐንስ ጽሑፎች ግሱ የእግዚአብሔርን ቃል በታማኝነት የመጠበቅና የማክበር ሐሳብ ብዙ ጊዜ ይይዛል።
    reason: lexical_alternative
lexical_decisions:
