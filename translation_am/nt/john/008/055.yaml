  rationale: ጥቅሱ ራሱ ኢየሱስንና ተቃዋሚዎቹን እግዚአብሔርን በማወቅና ቃሉን በመጠበቅ በጥብቅ ያነጻጽራል። ትርጉሙ ይህን ኃይል ሳያለሰልስና ከጥቅሱ በላይ ትምህርታዊ ማብራሪያ ሳይጨምር ያቆየዋል።
