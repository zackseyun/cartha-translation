  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: am
  text: አይሁድ እንዲህ አሉት፦ “አሁን ጋኔን እንዳለብህ[a] አወቅን። አብርሃም ሞተ፤ ነቢያትም ሞቱ። አንተ ግን፣ ‘ማንም ቃሌን ቢጠብቅ፣ ሞትን ለዘላለም አይቀምስም[b]’ ትላለህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ጋኔን አለህ።” ትርጉሙም “በጋኔን ተይዘሃል” ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ሞትን ለዘላለም አይቀምስም” የሚለው በግሪክኛ ጠንካራ እምቢታ ያለው አገላለጽ ሲሆን፣ “ሞትን በፍጹም አይቀምስም” የሚል ኃይል አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን የቡድን ስያሜ በቀጥታ ይተረጉማል፤ ‘የአይሁድ መሪዎች’ የሚለው በዚህ ቦታ ጽሑፉ በግልጽ ያልጨመረው ትርጓሜ ነው።
- source_word: Νῦν ἐγνώκαμεν
  choice: አሁን ... አወቅን
  rationale: ወደ አሁናዊ ዕውቀት ያደረሰውን ግንዛቤ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δαιμόνιον ἔχεις
  choice: ጋኔን አለብህ
  rationale: ‘ጋኔን አለህ’ የሚለውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ በቅርብ ይጠብቃል።
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: አብርሃም ሞተ፤ ነቢያትም ሞቱ
  rationale: ካὶ የሚያሳየውን መደመር በ‘ም’ ይገልጻል፤ በአማርኛ ግስን መድገም ንግግሩን ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: καὶ σὺ λέγεις
  choice: አንተ ግን ... ትላለህ
  rationale: በዐውዱ ያለውን ተቃርኖ ያሳያል፤ የአብርሃምና የነቢያት ሞት ከኢየሱስ ንግግር ጋር ተነጻጽሯል።
- source_word: Ἐάν τις
  choice: ማንም ... ቢ-
  rationale: አጠቃላይ ሁኔታዊ አገላለጹን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸν λόγον μου τηρήσῃ
  choice: ቃሌን ቢጠብቅ
  rationale: λόγοςን ‘ቃል’፣ τηρέωን ‘መጠበቅ’ በማለት የዮሐንስን አገላለጽ ይጠብቃል፤ ትርጉሙን ወደ ‘መታዘዝ’ ብቻ አያጠብም።
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: ሞትን ፈጽሞ ለዘላለም አይቀምስም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ ‘ፈጽሞ’ ይገልጻል፤ γεύομαι ያለውን ምሳሌያዊ ‘መቅመስ’ ይጠብቃል፤ εἰς τὸν αἰῶναንም ‘ለዘላለም’ በማለት በቀጥታ ያቀርባል።
theological_decisions:
- issue: ‘ሞትን መቅመስ’ የሚለው የኢየሱስ ተስፋ ምን ዓይነት ሞትን እንደሚመለከት
  choice: ‘ሞትን ... አይቀምስም’ የሚለውን ምሳሌያዊ አገላለጽ ሳይፈታ ማቆየት
  alternative: አካላዊ ሞት፣ መንፈሳዊ ሞት ወይም የመጨረሻ ሞት ብሎ በግልጽ መተርጎም
  rationale: ተቃዋሚዎቹ ንግግሩን ከአብርሃምና ከነቢያት አካላዊ ሞት ጋር ያነጻጽራሉ፤ የዮሐንስ ወንጌል ግን ብዙ ጊዜ ባለብዙ ደረጃ ትርጉም ይይዛል። ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱን ሳይፈታ ያቆየዋል።
