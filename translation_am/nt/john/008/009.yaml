id: JHN.8.9
reference: John 8:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: am
  text: እነርሱም[a] ይህን ሲሰሙ ሕሊናቸው ስለወቀሳቸው፣ ከታላላቆቹ ጀምረው እስከ መጨረሻዎቹ ድረስ[b] አንድ በአንድ ወጡ። ኢየሱስም ብቻውን ቀረ፤ ሴቲቱም በመካከል ቆማ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ክፍል በዝሙት ስትፈጽም ስለተያዘችው ሴት የሚናገረው ታሪክ (ዮሐንስ 7፥53–8፥11) ቀጣይ ነው። በዮሐንስ 7፥53 ላይ ያለውን ማስታወሻ ይመልከቱ።
    reason: textual_critical
  - marker: b
    text: ወይም፣ “እስከ መጨረሻው ድረስ።”
    reason: previous_rendering
lexical_decisions:
- source_word: συνείδησις
  choice: ሕሊና
  rationale: በዘመናዊ አማርኛ ትክክልና ስህተትን የሚመዝነውን ውስጣዊ የሥነ ምግባር ምስክር በተፈጥሯዊና በተለመደ መንገድ ይገልጻል።
- source_word: ἐλεγχόμενοι
  choice: ስለወቀሳቸው
  rationale: ተሳታፊዎቹ በሕሊናቸው የጥፋተኝነት ግንዛቤ እንደደረሰባቸው ያሳያል፤ ተግባሩን በሕሊና ላይ በማድረግ የግሪኩን የተደራጊ አቀራረብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πρεσβυτέρων
  choice: ታላላቆቹ
  rationale: በዚህ አውድ የሥልጣን ማዕረግን ሳይወስን በዕድሜ ወይም በአንጋፋነት የሚበልጡትን ይጠቁማል።
- source_word: ἐσχάτων
  choice: መጨረሻዎቹ
  rationale: ቃሉን ‘ታናናሾቹ’ ብሎ በመተርጎም ከጽሑፉ በላይ ሳይወስን፣ የቅደም ተከተሉን የመጨረሻ አባላት የሚያመለክተውን የግሪኩን ግልጽ ትርጉም ይጠብቃል።
- source_word: ἐν μέσῳ ἑστῶσα
  choice: በመካከል ቆማ ነበር
  rationale: የሴቲቱን ቀጣይ አቋም እና በስፍራው መካከል መኖሯን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘ከታላላቆቹ’ የሚለው ቃል የዕድሜ ወይስ የሥልጣን ማዕረግ መሆኑ
  choice: በዕድሜ/በአንጋፋነት የሚበልጡትን የሚጠቁም ‘ታላላቆቹ’
  alternative: ‘ሽማግሌዎቹ’ ወይም የማኅበረሰብ መሪዎች
  rationale: πρεσβύτερος የመሪነት ማዕረግ ሊያመለክት ቢችልም፣ እዚህ ከ‘መጨረሻዎቹ’ ጋር ያለው ተከታታይ ንጽጽር የዕድሜ ወይም የአንጋፋነት ሐሳብን ይደግፋል፤ ትርጉሙም መደበኛ ሹመትን አያስገድድም።
- issue: ‘እስከ መጨረሻዎቹ ድረስ’ የዕድሜ ክፍልን መወሰን
  choice: የግሪኩን ክፍት አገላለጽ መጠበቅ
  alternative: ‘እስከ ታናናሾቹ ድረስ’
  rationale: ἐσχάτων በቀጥታ ‘የመጨረሻዎቹ’ ማለት ነው፤ ‘ታናናሾቹ’ የሚለው አውዳዊ ትርጓሜ ሊሆን ቢችልም ጽሑፉ ያልወሰነውን በግድ አልተወሰነም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ሕሊናቸው ስለወቀሳቸው’ የውስጣዊ የሥነ ምግባር ግንዛቤን ይገልጻል፤ ‘ታላላቆቹ’ ደግሞ የቤተ እምነት ሹመትን ሳያስገድድ አንጋፋነትን ያሳያል።
