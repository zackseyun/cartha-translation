    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶν
  choice: የምመሰክረው
  rationale: ከመስተዋድድ አንቀጽ ጋር ያለው የአሁን ጊዜ ቦዝ አንቀጽ በስም ተግባር ‘የሚመሰክረው’ የሚል ነው፤ ይህ አተረጓጎም የሕጋዊ ምስክርነትን ስሜት ይጠብቃል።
- source_word: περὶ ἐμαυτοῦ
  choice: ስለ ራሴ
  rationale: περί ከወራጅ ሙያ ጋር እዚህ ‘ስለ/በተመለከተ’ ማለት ሲሆን፣ አንጸባራቂውን ἐμαυτοῦ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μαρτυρεῖ
  choice: ይመሰክራል
  rationale: የተደገመውን μαρτυρέω በተመሳሳይ የቃል ሥር መተርጎም የቁጥሩን የምስክርነት ጭብጥ ይጠብቃል።
- source_word: περὶ ἐμοῦ
  choice: ስለ እኔ
  rationale: የግሪኩን ‘ስለ እኔ/እኔን በተመለከተ’ ትርጉም በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ πέμψας με πατήρ
  choice: የላከኝ አብ
  rationale: በግሪኩ ያለውን ‘የላከኝ አብ’ በአንጻራዊ አንቀጽ ያቀርባል፤ በጽሑፉ ያልተገለጸውን ‘አባቴ’ አይጨምርም።
- source_word: ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: ግልጽ ተሳቢ የሚከተለውን የመሆን አገላለጽ በተፈጥሯዊ አማርኛ ይሰጣል፤ የἐγώን አጽንዖትም ይጠብቃል።
theological_decisions:
- issue: በዮሐንስ ዐውድ ውስጥ ‘አብ’ የሚያመለክተው
  choice: በግሪኩ መሠረት ‘አብ’ ብቻ ተብሎ ተተርጉሟል።
  alternative: ‘አባቴ’ ወይም ‘እግዚአብሔር አብ’
  rationale: ጽሑፉ ὁ ... πατήρ ይላል፤ ስለዚህ ያልተጻፈ የባለቤትነት ቅጥያ ወይም የማብራሪያ መለኮታዊ ስያሜ ሳይጨመር ግንኙነታዊው እና መለኮታዊው አባባል ተጠብቋል።
- issue: የምስክርነት ቃላትና ሕጋዊ ዳራ
  choice: μαρτυρέω በሁለቱም ቦታ ‘መመስከር’ ተብሎ ተተርጉሟል።
  alternative: ‘ምስክር መሆን’
  rationale: ‘መመስከር’ በዘመናዊ አማርኛ ግልጽ ሲሆን የዮሐንስን የፍርድ ቤት መሰል የምስክርነት ጭብጥና በሁለቱ ሐረጎች ያለውን የቃል ትስስር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ትይዩ አወቃቀርና የ‘መመስከር’ ድግግሞሽ ተጠብቋል።
