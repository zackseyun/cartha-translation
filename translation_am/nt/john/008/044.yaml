  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: am
  text: እናንተ ከአባታችሁ ከዲያብሎስ ናችሁ፤ የአባታችሁንም ፍላጎቶች ማድረግ ትፈልጋላችሁ። እርሱ ከመጀመሪያ ጀምሮ ነፍሰ ገዳይ ነበር፤ በእውነት ውስጥም አልቆመም፣[a] በእርሱ ውስጥ እውነት የለምና። ሐሰትን በሚናገርበት ጊዜ፣ ከራሱ ባሕርይ ይናገራል፤[b] እርሱ ሐሰተኛና የሐሰት አባት ነውና።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ አነጋገር ቃል በቃል፣ ‘በእውነት ውስጥ አልቆመም’ ይላል። ‘በእውነት ውስጥ አይቆምም’ ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ ‘ከራሱ ከሆነው ይናገራል’፤ ማለትም የራሱ ከሆነው ባሕርይ ወይም ጠባይ ይናገራል።
    reason: lexical_alternative
  - marker: c
    text: የግሪኩ ቃል በቃል፣ ‘እርሱ ሐሰተኛ ነው፣ የዚያም አባት ነው’ የሚል ነው። ‘የዚያ’ የሚለው በአውዱ በተፈጥሯዊ ሁኔታ ሐሰትን ያመለክታል። አንዳንዶች ግን በሰፊው ‘የውሸቶች አባት’ ብለው ይተረጉሙታል።
    reason: alternative_reading
