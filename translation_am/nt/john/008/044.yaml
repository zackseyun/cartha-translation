  choice: ‘በእውነት አልቆመም’ በማለት የግሪኩን ምስል መጠበቅ
  alternative: ‘በእውነት አልጸናም’ ወይም ‘በእውነት አልኖረም’
  rationale: አማራጮቹ ቀድሞ በእውነት ውስጥ ነበርና በኋላ ተወው የሚል ትርጉም ይበልጥ ሊያመለክቱ ይችላሉ። ዋናው ጽሑፍ ያንን የነገረ መለኮት ክርክር አይወስንም።
