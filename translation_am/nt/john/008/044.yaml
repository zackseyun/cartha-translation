  rationale: ἐκ የምንጭን፣ የመገኘትን ወይም የወገንነትን ሐሳብ ያሳያል። ይህ አተረጓጎም ዲያብሎስ የእነርሱ አባት መሆኑን በተፈጥሯዊ አማርኛ ያስቀምጣል።
