- source_word: ὅτι
  choice: ስለሚል
  rationale: እነርሱ የገመቱበትን ምክንያት፣ ማለትም ከኢየሱስ ንግግር ያወጡትን ድምዳሜ፣ ይገልጣል።
- source_word: λέγει
  choice: ስለሚል
  rationale: የግሪኩን የአሁን ጊዜ ግስ በምክንያታዊ ንዑስ አረፍተ ነገር ውስጥ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: እኔ ወደምሄድበት
