  choice: በዋናው ጽሑፍ “አይሁድ” የሚለውን ሰፊና ቀጥተኛ ትርጉም ማቆየት
  alternative: “የአይሁድ መሪዎች” ወይም “የይሁዳ ሰዎች”
  rationale: ቃሉ በመዝገበ ቃላዊ ደረጃ “አይሁድ” ማለት ነው። የዮሐንስ አውድ አንዳንድ ጊዜ ተቃዋሚ የይሁዳ ባለሥልጣናትን ወይም የአካባቢውን ሰዎች ሊያመለክት ቢችልም፣ ይህ ቁጥር ብቻውን ማጣቀሻውን በግልጽ አያጠብም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ ማስታወሻውም የአውዱን አማራጮች ያሳያል።
