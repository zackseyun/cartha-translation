- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ[a]
  rationale: የግሪኩን ሰፊና ቀጥተኛ ትርጉም በዋናው ጽሑፍ ይጠብቃል፤ በዮሐንስ አውድ የይሁዳ ሰዎችን ወይም የአይሁድ መሪዎችን ሊያመለክት የሚችለው አማራጭ በማስታወሻ ተገልጧል።
- source_word: Μήτι
  choice: ሊገድል ይሆን?
  rationale: μήτι አሉታዊ መልስ የሚጠበቅበትን ጥያቄ ያስገባል። “ይሆን?” በአማርኛ የጥርጣሬውን ኃይል በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἀποκτενεῖ ἑαυτόν
