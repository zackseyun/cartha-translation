  choice: ይሉ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በትረካው ውስጥ ቀጣይ ወይም ተደጋጋሚ ንግግርን ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ገጽታውን በተፈጥሯዊ አማርኛ ያስቀምጣል።
