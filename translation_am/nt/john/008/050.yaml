  rationale: አውዱ አብን እንዲያመለክት ቢጠቁምም፣ የግሪክ ጽሑፉ በዚህ ቁጥር ስሙን አይጠቅስም። ስለዚህ ትርጉሙ የጽሑፉን ጥንቃቄና ትርጉማዊ ውጥረት ይጠብቃል።
- issue: የζητῶν ያልተገለጸ ተሳቢ
  choice: በዋናው ጽሑፍ ተሳቢውን አለመጨመር።
  alternative: «ክብሬን የሚፈልገው» ብሎ የቀደመውን ተሳቢ መድገም።
  rationale: ζητῶν በግሪክ ጽሑፉ ግልጽ ተሳቢ የለውም፤ ከቀደመው «ክብሬን» መረዳት ይቻላል። አማርኛውም ያለ ተሳቢ ተፈጥሯዊና ሊገባ ስለሚችል ያልተገለጸውን ነገር አይጨምርም።
