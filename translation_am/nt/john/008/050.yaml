  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: am
  text: እኔ ግን የራሴን ክብር አልፈልግም፤ የሚፈልገውና የሚፈርደው አለ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ «የሚፈልገውና የሚፈርደው አለ።» «የሚፈልገው» ለሚለው ያልተገለጸው ተሳቢ ከቀደመው አንቀጽ የኢየሱስ ክብር እንደሆነ ሊገባ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ስሙ ያልተጠቀሰው ሰው ከአውዱ አንጻር አብን እንደሚያመለክት በሰፊው ይታሰባል፤ የግሪክ ጽሑፉ ግን በዚህ ስፍራ በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: እኔ ግን
  rationale: ግልጽ የሆነውን ተውላጠ ስም ለአጽንዖት ያቆያል፤ δὲ ያለውን የንጽጽር ኃይልም «ግን» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐ ζητῶ
  choice: አልፈልግም
