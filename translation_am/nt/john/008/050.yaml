- source_word: ἔστιν ὁ ζητῶν καὶ κρίνων
  choice: የሚፈልገውና የሚፈርደው አለ
  rationale: ስም ሳይጠቀስ በመስተዋድድ የቀረቡትን ተሳቢ አንቀጾች ይጠብቃል፤ «አለ»ም ἔστιν ያለውን የመኖር አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: የሚፈልገውና የሚፈርደው ያልተጠቀሰው አካል ማንነት
