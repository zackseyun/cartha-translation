  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: am
  text: ስለዚህ ኢየሱስ እርሱን ያመኑትን[a] አይሁድ፣ «እናንተ በቃሌ ብትቆዩ፣ በእውነት ደቀ መዛሙርቴ ናችሁ» እያለ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእርሱ ያመኑትን።» ግሪክኛው ቃል በቃል «እርሱን ያመኑትን» ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪክኛውን ያልተፈጸመ የግስ ገጽታ በመጠበቅ፣ ኢየሱስ ይህን እየተናገረ እንደነበር ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር ጋር ያለውን የትረካና የድምዳሜ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: እርሱን ያመኑትን አይሁድ
  rationale: ፍጹም አካፋዩ ከዚያ በፊት የተከናወነ እምነትን ያመለክታል፤ αὐτῷ ያለ እንደ εἰς ያለ ግልጽ መስተዋድድ በቀጥታ “እርሱን ያመኑትን” ተብሎ ተተርጉሟል።
- source_word: Ἐὰν ὑμεῖς μείνητε
  choice: እናንተ … ብትቆዩ
  rationale: Ἐὰν ከንዑስ አንቀጽ ጋር የሚፈጥረውን ሁኔታ “ብት-” ይገልጣል፤ ግልጽ የሆነው ὑμεῖς “እናንተ” ተብሎ አጽንዖቱ ተጠብቋል፤ μείνητε ደግሞ መቀጠልንና ጸንቶ መኖርን በሚያሳይ “ብትቆዩ” ተተርጉሟል።
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: በቃሌ
  rationale: λόγος እዚህ የኢየሱስን መልእክትና ትምህርት ሊያመለክት ቢችልም፣ “ቃል” የዮሐንስን የቃል አጠቃቀምና ሥነ መለኮታዊ አስተጋብኦ ሳያጠፋ በቀላሉ ይገባል።
- source_word: ἀληθῶς μαθηταί μού ἐστε
  choice: በእውነት ደቀ መዛሙርቴ ናችሁ
  rationale: ἀληθῶς እውነተኛነትን እና ትክክለኛ ማንነትን ያጎላል፤ μαθηταί በወንጌላት ዐውድ የተለመደውን “ደቀ መዛሙርት” ቃል ይፈልጋል።
theological_decisions:
- issue: πιστεύω ከዳቲቭ αὐτῷ ጋር ያለው አተረጓጎም
  choice: እርሱን ያመኑትን
  alternative: በእርሱ ያመኑትን
  rationale: ግሪክኛው αὐτῷ የሚለውን ዳቲቭ ይጠቀማል እንጂ εἰς የሚል ግልጽ መስተዋድድ የለውም። ስለዚህ ዋናው ጽሑፍ ከምንጩ ይበልጥ ሰፊ የሆነ ሥነ መለኮታዊ ትርጉም ሳይጨምር ቀጥተኛውን አተረጓጎም ይዟል፤ በዮሐንስ ዐውድ የሚጠበቀው አማራጭ ግን በማስታወሻ ተጠብቋል።
- issue: በኢየሱስ ቃል መቆየትና እውነተኛ ደቀ መዝሙርነት ያላቸው ግንኙነት
  choice: ሁኔታዊውን አነጋገር እንዳለ ማቆየት
  alternative: መቆየትን የደቀ መዝሙርነት ምክንያት ወይም ውጤት ብሎ በግልጽ መተርጎም
  rationale: ጥቅሱ በቃሉ መቆየትን ከእውነተኛ ደቀ መዝሙርነት ጋር በሁኔታዊ አነጋገር ያገናኛል፣ ነገር ግን የምክንያትና የውጤት ቅደም ተከተሉን አይገልጽም። ትርጉሙ ይህን ውጥረት አልፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ደቀ መዛሙርት” በዘመናዊ የክርስቲያን አማርኛ የታወቀ ሲሆን፣ “በቃሌ ብትቆዩ” ጥንታዊ ወይም የአንድ ቤተ እምነት ብቻ አገላለጽ ሳይሆን የመቀጠልን ሐሳብ በተፈጥሯዊ ቋንቋ ያቀርባል።
