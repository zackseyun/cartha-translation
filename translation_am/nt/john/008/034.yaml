  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: am
  text: ኢየሱስም መልሶ አላቸው፦ “እውነት እውነት እላችኋለሁ፤ ኃጢአትን የሚሠራ ሁሉ የኃጢአት ባሪያ ነው።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ ሲል መለሰላቸው
  rationale: የንግግር ምላሽነቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ “እንዲህ ሲል” ቀጥሎ ያለውን ቀጥተኛ ንግግር በግልጽ ያስገባል።
- source_word: Ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: በዮሐንስ ወንጌል የሚታየውን ድርብ የማረጋገጫ ቃልና አጽንዖቱን ይጠብቃል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን የአሁን ጊዜ አገላለጽ በአጭር፣ ተፈጥሯዊና ክብር ባለው አማርኛ ያቀርባል።
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: ኃጢአትን የሚያደርግ ሁሉ
  rationale: ποιῶν የአሁን ጊዜ አሳታፊ ቅርጽ ሲሆን ቀጣይ ወይም ባሕርያዊ ድርጊትን ሊያመለክት ይችላል፤ ይህ ቀጥተኛ አገላለጽ አንድ ጊዜ ብቻ የተፈጸመ ድርጊት ነው ብሎ ሳይገድብ፣ ግሪኩን አሻሚነት ይጠብቃል።
- source_word: δοῦλός ἐστιν τῆς ἁμαρτίας
  choice: የኃጢአት ባሪያ ነው
  rationale: ባሪያ የሚለው ቃል የδοῦλοςን የታሰረ ሁኔታና በኃጢአት ገዥነት ሥር መሆንን ከ“አገልጋይ” ይልቅ በጠንካራ ሁኔታ ያሳያል።
theological_decisions:
- issue: የኃጢአት ድርጊትና ባርነት ግንኙነት
  choice: “ኃጢአትን የሚያደርግ ሁሉ የኃጢአት ባሪያ ነው” ብሎ መተርጎም
  alternative: “ኃጢአትን የሚለማመድ ሁሉ የኃጢአት አገልጋይ ነው”
  rationale: የአሁን ጊዜው አሳታፊ ποιῶν ቀጣይ ወይም ባሕርያዊ ተግባርን ሊያመለክት ቢችልም፣ “የሚለማመድ” ትርጉሙን ከግሪኩ በላይ ሊወስን ይችላል። “የሚያደርግ” ግን ቅርጹንና የአውዱን ቀጣይነት አብሮ ይጠብቃል፤ “ባሪያ” ደግሞ የኃጢአትን ገዥነት ምሳሌ በሙሉ ኃይሉ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የድርብ Ἀμὴν አጽንዖት ተጠብቋል፤ ለዚህ አንድ ቁጥር አስፈላጊ ያልሆነ የግርጌ ማስታወሻ አልተጨመረም።
