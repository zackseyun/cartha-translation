review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Jesus as the speaker, the doubled solemn affirmation, the universal construction, and the forceful δοῦλος metaphor. However, “እንዲህ ሲል” is an unnecessary narrative addition, and “ኃጢአትን የሚሠራ” is the more idiomatic modern Amharic equivalent for ποιῶν τὴν ἁμαρτίαν.
  naturalness: The register is clear and suitably solemn. Replacing “የሚያደርግ” with “የሚሠራ” improves naturalness without making the present participle more specific than the Greek.
  terminology: “እውነት እውነት” appropriately retains the Johannine repetition. “የኃጢአት ባሪያ” rightly conveys the bondage and ownership force of δοῦλος better than the weaker “አገልጋይ.”
  issues:
  - severity: low
    issue: Unnecessary introductory expansion
    rationale: “እንዲህ ሲል” is not represented in Ἀπεκρίθη αὐτοῖς and can be omitted while retaining a fully natural Amharic dialogue introduction.
  - severity: low
    issue: Less idiomatic verb for committing sin
    rationale: Although “ኃጢአትን የሚያደርግ” is understandable, “ኃጢአትን የሚሠራ” is more standard and natural Amharic usage, while preserving the Greek present participle’s open-ended/characteristic sense.
  revised_text: ኢየሱስም መልሶ አላቸው፦ “እውነት እውነት እላችኋለሁ፤ ኃጢአትን የሚሠራ ሁሉ የኃጢአት ባሪያ ነው።”
  revised_footnotes: []
