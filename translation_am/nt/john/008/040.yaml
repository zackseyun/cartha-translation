id: JHN.8.40
reference: John 8:40
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: am
  text: አሁን ግን ከእግዚአብሔር የሰማሁትን እውነት የነገርኋችሁን ሰው የሆንኩትን እኔን ልትገድሉ ትፈልጋላችሁ። አብርሃም ይህን አላደረገም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: የνῦνን ጊዜያዊ ንጽጽርና የδέን ተቃራኒ ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: እኔን … ለመግደል እየፈለጋችሁ ነው
  rationale: የአሁን ጊዜውን ቀጣይ ፍለጋና የመግደል ዓላማ ሳያጠናክር ወይም ሳያለዝብ ይገልጣል።
- source_word: ἄνθρωπον
  choice: ሰው
  rationale: ኢየሱስ ስለ ራሱ የተናገረውን ግልጽ የሰውነት መግለጫ ያቆያል፤ በአማርኛም ተፈጥሯዊው ቀጥተኛ አቻ ነው።
- source_word: τὴν ἀλήθειαν
  choice: እውነት
  rationale: በአውዱ የታወቀውንና ኢየሱስ የነገራቸውን የተወሰነ እውነት ይጠብቃል።
- source_word: ὑμῖν λελάληκα
  choice: የነገርኋችሁን
  rationale: የተፈጸመው ንግግር አሁንም ያለውን ጠቀሜታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: ከእግዚአብሔር የሰማሁትን
  rationale: παρά ከዘር አመልካች ጋር የሚገልጠውን ምንጭ ‘ከእግዚአብሔር’ በሚል ቀጥተኛና ግልጽ አገላለጽ ይተረጉማል።
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: አብርሃም ይህን አላደረገም
  rationale: ከአብርሃም ተግባር ጋር የተደረገውን ንጽጽር በቀጥታና በተፈጥሯዊ የአማርኛ አወቃቀር ያቆያል።
theological_decisions:
- issue: በኢየሱስ ራስ-መግለጫ ውስጥ ἄνθρωπον የሚለውን መተርጎም
  choice: ሰው
  alternative: የሰው ልጅ / ሰብዓዊ ፍጡር
  rationale: ‘ሰው’ የግሪኩን ግልጽ ትርጉምና የኢየሱስን ሰውነት ያቆያል፤ ‘የሰው ልጅ’ የሚለው ግን በጽሑፉ የሌለውን ልዩ መጠሪያ ሊያስገባ ይችላል።
- issue: በπαρὰ τοῦ θεοῦ ውስጥ የመልእክቱ ምንጭ
  choice: ከእግዚአብሔር
  alternative: ከአብ
  rationale: የግሪኩ ጽሑፍ θεός ይላል እንጂ ‘አብ’ አይልም፤ ስለዚህ ትርጉሙ በዚህ ቁጥር ያልተገለጸውን ይበልጥ የተወሰነ ሥነ-መለኮታዊ መጠሪያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። በሁለት ነጠላ ሰረዞች የተከበበው ገላጭ ሐረግ የግሪኩን ἄνθρωπον እንደ እኔን የሚያብራራ ተጨማሪ መግለጫ አድርጎ ያቆያል።
