- from: አሁን ግን እኔን፣ ከእግዚአብሔር የሰማሁትን እውነት የነገርኋችሁን ሰው፣ ለመግደል እየፈለጋችሁ ነው። አብርሃም ይህን አላደረገም።
  to: አሁን ግን ከእግዚአብሔር የሰማሁትን እውነት የነገርኋችሁን ሰው የሆንኩትን እኔን ልትገድሉ ትፈልጋላችሁ። አብርሃም ይህን አላደረገም።
