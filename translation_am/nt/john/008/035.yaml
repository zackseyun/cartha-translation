  rationale: 'The revision corrects two source-sensitive distinctions: οἰκία is rendered with ቤት rather than the possessive “his family,” and υἱός is rendered as “the son” rather than the gender-inclusive “child.” The repetition of “remain,” the permanence phrase, the generic-yet-contextually resonant force of “the son,” and both footnote anchors are retained.'
