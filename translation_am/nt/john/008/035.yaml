base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: am
  text: ባሪያው[a] በቤቱ ውስጥ ለዘላለም አይቆይም፤ ወንድ ልጁ[b] ግን ለዘላለም ይቆያል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘አገልጋዩ’። የግሪኩ δοῦλος ሁለቱንም ሊያመለክት ይችላል፤ እዚህ ግን ‘ባሪያ’ ከወንድ ልጁ ጋር ያለውን የደረጃ ልዩነት ይበልጥ ይጠብቃል።
    reason: lexical_alternative
  - marker: b
    text: ‘ወንድ ልጁ’ የሚለው አገላለጽ እንደ አጠቃላይ የቤተሰብ አባባል ሆኖ ሳለ፣ በአቅራቢያው አውድ ኢየሱስንም በተዘዋዋሪ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: ባሪያ
  rationale: በቤተሰብ ውስጥ ያለውን የደረጃና የቋሚ አባልነት ልዩነት ከ‘ልጅ’ ጋር በግልጽ ስለሚያነጻጽር፣ የታሰረ አገልጋይነትን የሚያመለክተው ‘ባሪያ’ ተመርጧል።
- source_word: μένει
  choice: ይቆያል / አይቆይም
  rationale: በሁለቱም ሐረጎች ያለውን የግስ ድግግሞሽ ይጠብቃል፤ በዚህ አውድም የቀጣይ ቆይታንና የማይለወጥ ደረጃን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἰκία
  choice: ቤተሰብ
  rationale: ንግግሩ ስለ ሕንፃ ብቻ ሳይሆን በቤት ውስጥ ስላለ አባልነትና ደረጃ ስለሆነ፣ ‘ቤተሰብ’ የማኅበራዊና የዝምድና መስኩን ይጠብቃል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: ዘላቂነትን በግልጽና በተለመደ ዘመናዊ አማርኛ ያስተላልፋል፤ በሁለቱም ሐረጎች ተመሳሳይ ቅርጽ ተጠብቋል።
- source_word: υἱός
  choice: ልጅ
  rationale: በአማርኛ ‘ልጅ’ በቤተሰብ ውስጥ ያለውን የወንድ ልጅ ደረጃ በተፈጥሯዊ ሁኔታ ይገልጻል፤ የተወሰነው ቅጽ ‘ልጁ’ የግሪኩን ὁ υἱός ይከተላል።
- source_word: δὲ
  choice: ግን
  rationale: የንግግሩን ንጽጽር በተፈጥሯዊ አማርኛ ለማሳየት ‘ግን’ በሁለተኛው ተነጻጻሪ ሐረግ ተቀምጧል፤ ይህም አላስፈላጊ የጊዜ ትርጉም አይጨምርም።
theological_decisions:
- issue: ‘ልጁ’ በአውዱ ውስጥ ሊኖረው የሚችለው ክርስቶሳዊ አመልካችነት
  choice: ‘ልጁ’ የሚለው አጠቃላይ የቤተሰብ ንጽጽርን እንዲጠብቅ ተደርጓል።
  alternative: የኢየሱስን ማንነት በግልጽ የሚያመለክት ‘ወልድ’
  rationale: ጥቅሱ እንደ ቤተሰብ ምሳሌያዊ አባባል ይሠራል፣ ነገር ግን ቀጣዩን ጥቅስና የኢየሱስን ማንነት ሊያስተጋባ ይችላል። ‘ልጁ’ ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁለቱ ሐረጎች ትይዩነትና የμένει ድግግሞሽ ተጠብቋል።
