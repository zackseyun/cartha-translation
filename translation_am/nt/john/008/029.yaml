id: JHN.8.29
reference: John 8:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: am
  text: የላከኝ ከእኔ ጋር ነው፤ ብቻዬን አልተወኝም፤ ምክንያቱም እኔ ሁልጊዜ እርሱን ደስ የሚያሰኙትን አደርጋለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: የላከኝ
  rationale: በግሪክ ያለው በመስተዋድድ የተጠቀሰ ያለፈ ጊዜ አሳታፊ በስም ተግባር ላይ ነው። «የላከኝ» የሚለው ተፈጥሯዊ አማርኛ ሲሆን አብን በግልጽ ሳይጨምር የግሪኩን ዝምድናዊ አገላለጽ ይጠብቃል።
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: ከእኔ ጋር ነው
  rationale: μετά ከባለቤት ሁኔታ ጋር አብሮነትንና መገኘትን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: ብቻዬን አልተወኝም
  rationale: ἀφῆκεν ያለፈ ጊዜ ቅርጽ ቢሆንም አሉታዊው ፍጹም የአማርኛ ግስ «አልተወኝም» ያለፈውን ድርጊትና አሁን ያለውን ውጤት በተፈጥሮ ያስተላልፋል። «ብቻዬን» μόνον ከμε ጋር ያለውን ትስስር ያሳያል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዚህ አውድ ὅτι ምክንያትን ያስገባል፤ «ምክንያቱም» የምክንያታዊውን ግንኙነት ግልጽ ያደርጋል።
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: እርሱን ደስ የሚያሰኘውን
  rationale: ግሪኩ በቀጥታ «ለእርሱ ደስ የሚያሰኙትን ነገሮች» የሚል የገለልተኛ ብዙ ቁጥር ስማዊ ሐረግ ነው። የተመረጠው አገላለጽ ይህን የደስታ/የተቀባይነት ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ποιῶ πάντοτε
  choice: ሁልጊዜ … አደርጋለሁ
  rationale: የአሁን ጊዜው ግስ የተለመደና ቀጣይ ተግባርን ያሳያል፤ πάντοτε ደግሞ በ«ሁልጊዜ» ተጠብቋል።
theological_decisions:
- issue: «የላከኝ» የሚለው ማንን እንደሚያመለክት
  choice: አብን የሚያመለክተውን ዝምድናዊ አገላለጽ «የላከኝ» በጽሑፉ ውስጥ ማቆየት
  alternative: «የላከኝ አብ» ብሎ በግልጽ መጨመር
  rationale: የዮሐንስ አውድ ተጠቃሹ አብ መሆኑን ያሳያል፤ ግሪኩ ግን «አብ» የሚለውን ስም እዚህ አልጠቀሰም። የምንጩን አገላለጽ ማቆየት የዮሐንስን ዘይቤ ይጠብቃል።
- issue: የἀφῆκεν ጊዜና የአሁን ጠቀሜታ
  choice: «አልተወኝም» በሚለው የአማርኛ ፍጹም ግስ መተርጎም
  alternative: «ብቻዬን አይተወኝም» በሚል የአሁን ጊዜ አገላለጽ መተርጎም
  rationale: የግሪኩ አዎሪስት ያለፈ ድርጊትን ያቀርባል፤ የአማርኛው ፍጹም ቅርጽ ይህን ሳያጠፋ ከቀደመው «ከእኔ ጋር ነው» ጋር በመያያዝ የቀጠለውን መገኘት ያስገነዝባል።
- issue: ὅτι የሚያሳየው ግንኙነት
  choice: ምክንያታዊ ትርጉሙን «ምክንያቱም» ብሎ ማቅረብ
  alternative: በሰፊ ትርጉም «እንደ» ወይም «ይህም» ብሎ ማቅረብ
  rationale: በአውዱ የኢየሱስ ሁልጊዜ ደስ የሚያሰኘውን ማድረግ አብ ብቻውን እንዳልተወው ምክንያት ሆኖ ቀርቧል። ትርጉሙ ይህን የጽሑፉን ውጥረት ሳያቃልል ግልጽ ያደርጋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «የላከኝ» የሚለው አጭር ዝምድናዊ አገላለጽ የምንጩን ዘይቤ ይጠብቃል፤ በአማርኛ ግልጽነት የማያስፈልግ በመሆኑ የግርጌ ማስታወሻ አልተጨመረም።
