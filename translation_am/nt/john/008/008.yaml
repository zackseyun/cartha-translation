- source_word: ἔγραφεν
  choice: ይጽፍ ነበር
  rationale: የግሪኩን ያልተፈጸመ ያለፈ ጊዜ ቅርጽ በመጠበቅ ድርጊቱ በሂደት ላይ ወይም ቀጣይ እንደነበር ሳይገድብ ያሳያል።
- source_word: εἰς τὴν γῆν
  choice: መሬት ላይ
  rationale: በዐውዱ ከፊቱ ያለውን የምድር ገጽ የሚያመለክት ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
theological_decisions:
