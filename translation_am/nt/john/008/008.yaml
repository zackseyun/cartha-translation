  choice: ቁጥሩን በዋናው ጽሑፍ ማቅረብና የጽሑፍ ልዩነቱን በእግር ማስታወሻ መጠቆም
  alternative: የጽሑፍ ልዩነቱን ሳይጠቅሱ ቁጥሩን ብቻ ማቅረብ
  rationale: የተሰጠው የባይዛንታይን ምንጭ ቁጥሩን ይዟል፤ ሆኖም ክፍሉ የታወቀ የጽሑፍ ልዩነት ስላለው አንባቢውን በግልጽ ማስታወቂያ ማገልገል ተገቢ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ይጽፍ ነበር” የግሪኩን ኢምፐርፌክት ገጽታ ይጠብቃል።
