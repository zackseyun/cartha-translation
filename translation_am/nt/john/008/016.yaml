base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: am
  text: ነገር ግን እኔ ብፈርድ እንኳ[a]፣ ፍርዴ እውነተኛ ነው፤ ምክንያቱም ብቻዬን አይደለሁም፤ እኔና የላከኝ አብ ነን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብፈርድ” ወይም “ብፈርድ ቢሆን።” የግሪኩ ሁኔታዊ አገላለጽ በይበልጥ ቀጥታ ሊተረጎም ይችላል፤ እዚህ ግን “ብፈርድ እንኳ” የሚለው መፍቀጃ ትርጉም እንዳለው ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: ብፈርድ እንኳ
  rationale: ἐὰν ከአሁን ጊዜ ንዑስ አንቀጽ κρίνω ጋር ሁኔታዊ እድልን ያቀርባል፤ በዐውዱ ግን የመፍቀጃ ንጽጽር ኃይል ስላለው ‘ብፈርድ እንኳ’ ተመርጧል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖና የሐሳብ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: ፍርዴ
  rationale: የባለቤትነት አወቃቀሩን በአጭርና ተፈጥሯዊ መንገድ ይገልጣል፤ κρίσις ያለውን የፍርድ ቤታዊ ጥላ ይጠብቃል።
- source_word: ἀληθινή
  choice: እውነተኛ
  rationale: ቃሉ የእውነትነትን፣ የእውነተኛነትንና የተቀባይነትን አቅም ሳይገድብ ይጠብቃል።
- source_word: μόνος οὐκ εἰμί
  choice: ብቻዬን አይደለሁም
  rationale: ኢየሱስ ፍርዱን ከአብ ተለይቶ እንደማይሰጥ የሚያሳየውን ዝምድናዊ ነጥብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: እኔና የላከኝ አብ አለን
  rationale: የግሪኩ አነጋገር ግስን በግልጽ ባያቀርብም፣ በአማርኛ ዐረፍተ ነገሩን ተፈጥሯዊ ለማድረግ ‘አለን’ ተጨምሯል፤ ኢየሱስና የላከው አብ አብረው መሆናቸውን ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ ፍርድ ከአብ ምስክርነት ጋር ያለው ግንኙነት
  choice: የኢየሱስ ፍርድ እውነተኛ የሆነው ከላከው አብ ተለይቶ ስለማይሰጥ መሆኑ ተጠብቋል።
  alternative: ንግግሩ ሰፊ ሥነ መለኮታዊ አንድምታ ሳይኖረው በሕጋዊ የምስክርነት ጥያቄ ብቻ ላይ እንዳተኮረ ሊነበብ ይችላል።
  rationale: ጽሑፉ የፍርዱን እውነተኛነት ኢየሱስ ብቻውን ካለመሆኑና አብ ከእርሱ ጋር ከመሆኑ ጋር በግልጽ ያያይዛል። ትርጉሙ ይህን አሻሚነትና የሕግ ዐውድ ሳያጠፋ ከጽሑፉ በላይ የሆነ የኋላ ዘመን ትምህርት አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አብ’ የዮሐንስን ሥነ መለኮታዊ ቃላት ለመጠበቅ ተመርጧል።
