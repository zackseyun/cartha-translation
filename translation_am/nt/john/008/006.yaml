  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: am
  text: ይህንም የሚሉት[a] እርሱን ለመፈተንና በእርሱ ላይ የሚያቀርቡት ክስ እንዲኖራቸው ነበር። ኢየሱስ ግን ወደ ታች ጎንበስ ብሎ፣ ምንም ትኩረት ሳይሰጣቸው በጣቱ መሬት ላይ ይጽፍ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ በዝሙት ላይ ስትፈጽም ስለተያዘችው ሴት የሚናገረው ታሪክ ቀጣይ ክፍል ነው (ዮሐንስ 7፥53–8፥11)። በዮሐንስ 7፥53 ያለውን ማስታወሻ ይመልከቱ።
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: ለመፈተን
  rationale: በዚህ ዐውድ ጠያቂዎቹ ኢየሱስን በሕጋዊና በሃይማኖታዊ ወጥመድ ለመያዝ ይሞክራሉ፤ «ለመፈተን» የግሪኩን ቃል ሆን ብሎ የመፈተሽ እና የመጣል ሐሳብ ሳያጠብ ያስተላልፋል።
- source_word: κατηγορίαν
  choice: የሚከሱበትን ነገር
  rationale: ቃሉ ክስን ወይም የክስ ምክንያትን ያመለክታል። ይህ አገላለጽ ἵνα ἔχωσιν ከሚለው ጋር ተፈጥሯዊ አማርኛ ሆኖ «የሚከሱበት መሠረት እንዲኖራቸው» የሚለውን ያስተላልፋል።
- source_word: μὴ προσποιούμενος
  choice: ምንም ትኩረት ሳይሰጣቸው
  rationale: በባይዛንታይኑ ጽሑፍ ያለው ሐረግ እንዳላስተዋለ መሆንን ወይም ችላ ማለትን ያሳያል። ይህ ምርጫ ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ድርጊቱን ይገልጣል።
- source_word: ἔγραφεν
  choice: ይጽፍ ነበር
  rationale: የግሪኩ ያልተፈጸመ የግስ ቅርጽ በዚያ ጊዜ ቀጥሎ የነበረን ድርጊት ያሳያል፤ «ይጽፍ ነበር» ይህን ገጽታ ይጠብቃል።
