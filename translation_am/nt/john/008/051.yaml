id: JHN.8.51
reference: John 8:51
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: am
  text: “እውነት እውነት እላችኋለሁ፤ ማንም ቃሌን ቢጠብቅ፣ ለዘላለም ሞትን ከቶ አያይም።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የድግግሞሹን አጽንዖትና የኢየሱስን የተለመደ አነጋገር በቀጥታ ይጠብቃል።
- source_word: τὸν ἐμὸν λόγον
  choice: ቃሌን
  rationale: λόγος በዚህ አውድ የኢየሱስን ትምህርትና መልእክት የሚያመለክት ሲሆን፣ ቀጥተኛውና ተፈጥሯዊው አተረጓጎም ‘ቃሌን’ ነው።
- source_word: τηρήσῃ
  choice: ቢጠብቅ
  rationale: ‘መጠበቅ፣ መከተል፣ በታማኝነት መያዝ’ የሚለውን ሰፊ ትርጉም ሳያጠብ የዮሐንስን ቃላዊ ትስስር ይጠብቃል።
- source_word: θάνατον οὐ μὴ θεωρήσῃ
  choice: ሞትን ከቶ አያይም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ ‘ከቶ’ ያሳያል፤ θεωρέω የሚለውንም የማየት ምስል እንዳለ ይጠብቃል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: የጊዜውን ዘላቂነት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ‘ሞትን አያይም’ የሚለው አገላለጽ አይነት
  choice: ምሳሌያዊውን ‘ሞትን ከቶ አያይም’ አገላለጽ እንዳለ ማቆየት
  alternative: ‘ፈጽሞ አይሞትም’ ብሎ መተርጎም
  rationale: የግሪኩ ጽሑፍ ‘ሞትን ማየት’ የሚለውን አገላለጽ ይጠቀማል፤ በአውዱ ያለውን ሥጋዊና ዘላለማዊ ሞት የመረዳት ውጥረት በትርጉሙ ውስጥ አልተፈታም።
- issue: ἐάν τις የሚያካትተው ማንነት
  choice: ጾታን የማይለይ ‘ማንም’
  alternative: ‘ማንም ሰው’ ወይም ወንድ ጾታ ያለው ተውላጠ ስም
  rationale: የግሪኩ τις ሁሉን አካታች ያልተወሰነ ተውላጠ ስም ነው፤ ‘ማንም’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለሕዝብ ንባብ ተፈጥሯዊ የሆነ አማርኛ ተጠቅሟል። የመጀመሪያው ምንጭ ድግግሞሽ፣ ጠንካራ እምቢታ እና ‘ሞትን ማየት’ የሚለው ምስላዊ አገላለጽ ተጠብቀዋል።
