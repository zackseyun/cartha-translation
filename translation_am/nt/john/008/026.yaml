base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: am
  text: ስለ እናንተ[a] ለመናገርና ለመፍረድ ብዙ ነገሮች አሉኝ። ነገር ግን የላከኝ እውነተኛ ነው፤ እኔም ከእርሱ የሰማኋቸውን ነገሮች፣ እነዚህን ለዓለም እናገራለሁ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተን በተመለከተ።”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው “ከእርሱ የሰማኋቸውን ነገሮች፣ እነዚህን ለዓለም እናገራለሁ” በማለት “እነዚህን” የሚለው አመልካች ተውላጠ ስም ለአጽንዖት በግልጽ ተደግሟል።
    reason: lexical_alternative
