lexical_decisions:
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የጥሪ ቅርጹን በተፈጥሯዊ አማርኛ ያቀርባል፤ ቃሉ ‘ጌታ’ ወይም በአክብሮት ‘ጌታዬ/ክቡር’ ሊሆን ቢችልም፣ እዚህ የኢየሱስን ሥልጣን የሚያሳየው ባህላዊና ግልጽ አተረጓጎም ተመርጧል።
- source_word: κατακρίνω
  choice: እፈርድብሻለሁ
  rationale: በአውዱ የጥፋተኝነት ፍርድን ወይም የቅጣት ውሳኔን ያመለክታል፤ ‘አልፈርድብሽም’ ይህን የፍርድ ቤት ትርጉም በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: μηκέτι
  choice: ከእንግዲህም … አትሥሪ
  rationale: ከአሁን ወዲያ ድርጊቱን እንዳትቀጥል የሚጠይቀውን ጊዜያዊ አጽንዖት ያስተላልፋል።
- source_word: ἁμάρτανε
  choice: ኃጢአት አትሥሪ
  rationale: የአሁን ጊዜ ትእዛዛዊ ቅርጹን ከμηκέτι ጋር በማያያዝ፣ ኃጢአትን እንዳትቀጥል ወይም እንደገና እንዳትሠራ የሚሰጠውን ጥሪ ያቀርባል።
