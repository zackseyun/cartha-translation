  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: am
  text: 'እርሷም፣ “ጌታ ሆይ፣ ማንም የለም” አለች።[a] ኢየሱስም፣ “እኔም አልኮንንሽም፤ ሂጂ፣ ከእንግዲህም ኃጢአት አትሥሪ” አላት።


    [a] ይህ በዝሙት ስትፈጽም ስለተያዘችው ሴት የሚናገረው ታሪክ (ዮሐንስ 7፥53–8፥11) የመጨረሻ ቁጥር ነው። በዮሐንስ 7፥53 ላይ ያለውን ማስታወሻ ይመልከቱ።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ በዝሙት ስትፈጽም ስለተያዘችው ሴት የሚናገረው ታሪክ (ዮሐንስ 7፥53–8፥11) የመጨረሻ ቁጥር ነው። በዮሐንስ 7፥53 ላይ ያለውን ማስታወሻ ይመልከቱ።
