id: JHN.8.12
reference: John 8:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: am
  text: 'ዮሐንስ 8፥12


    እንግዲህ ኢየሱስ ደግሞ እንዲህ ሲል ተናገራቸው፦ “እኔ የዓለም ብርሃን ነኝ። እኔን የሚከተል በጨለማ ከቶ አይመላለስም[a]፤ ይልቁንም የሕይወት ብርሃን[b] ይኖረዋል።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጨለማ ፈጽሞ አይመላለስም።” ግሪኩ ጠንካራ እምቢታ (οὐ μή) ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: “የሕይወት ብርሃን” የሚለው “ሕይወትን የሚሰጥ ብርሃን” ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: እንግዲህ … ደግሞ
  rationale: የንግግሩን ቀጣይነትና መደገሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ οὖν ያለውን አገናኝ ኃይል ከልክ በላይ ምክንያታዊ አያደርገውም።
- source_word: ἐλάλησεν … λέγων
  choice: እንዲህ ሲል ተናገራቸው
  rationale: የመናገርን ግስና ቀጥተኛውን ንግግር የሚያስገባውን አንቀጽ በአማርኛ ተፈጥሯዊ ሥርዓት ይወክላል።
- source_word: Ἐγώ εἰμι
  choice: እኔ … ነኝ
  rationale: ከተከታዩ የስም ተሳቢ ጋር ያለውን ግልጽ ሰዋስዋዊ አወቃቀር ያስቀምጣል፤ ተጨማሪ ሥነ መለኮታዊ ማብራሪያ አያስገባም።
- source_word: τὸ φῶς τοῦ κόσμου
  choice: የዓለም ብርሃን
  rationale: የግሪኩን የባለቤትነት አገናኝ በአጭርና በተለመደ አማርኛ ያቆያል።
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: እኔን የሚከተል
  rationale: የተዋሰነውን ነጠላ ተወካይ አገላለጽ ያቆያል፤ ጾታንም ሳያስገድድ ተፈጥሯዊ ነው።
- source_word: οὐ μὴ περιπατήσῃ
  choice: ከቶ አይመላለስም
  rationale: οὐ μή የሚሰጠውን ጠንካራ እምቢታ ‘ከቶ’ ያሳያል፤ ‘ይመላለሳል’ ደግሞ περιπατέω ያለውን የሕይወት ጉዞ ምሳሌያዊ ጥልቀት ይጠብቃል።
- source_word: ἐν τῇ σκοτίᾳ
  choice: በጨለማ
  rationale: በዮሐንስ ውስጥ ያለውን ምሳሌያዊ የጨለማ ዓለም በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ἕξει
  choice: ይኖረዋል
  rationale: የἔχωን የወደፊት ጊዜ ትርጉም በተፈጥሯዊ የአማርኛ የይዞታ አገላለጽ ይሰጣል።
- source_word: τὸ φῶς τῆς ζωῆς
  choice: የሕይወት ብርሃን
  rationale: የግሪኩን አጭር የጄኒቲቭ አገላለጽ በመጠበቅ ብርሃኑ ከሕይወት የሚመነጭ፣ ሕይወትን የሚሰጥ ወይም ከሕይወት ጋር በሌላ መንገድ የተያያዘ መሆኑን ሳይወስን ይተዋል።
theological_decisions:
- issue: Ἐγώ εἰμι የሚለው የኢየሱስ ራስን መግለጫ ኃይል
  choice: “እኔ የዓለም ብርሃን ነኝ” ተብሎ ከተሳቢው ጋር በቀጥታ ተተርጉሟል።
  alternative: የመለኮታዊውን ስም ጥቅስ ለማመልከት አገላለጹን በትርጉሙ ውስጥ ይበልጥ ማጉላት።
  rationale: በዚህ ጥቅስ Ἐγώ εἰμι ከ“የዓለም ብርሃን” ከሚለው ተሳቢ ጋር በሰዋስው የተያያዘ ነው። ሰፊውን የዮሐንስ ሥነ መለኮታዊ ድምፅ ሳይከለክል ትርጉሙ ከጽሑፉ በላይ አይወስንም።
- issue: “የሕይወት ብርሃን” የሚለው የጄኒቲቭ አገላለጽ ትርጉም
  choice: ክፍት የሆነው “የሕይወት ብርሃን” ተጠብቋል።
  alternative: “ሕይወትን የሚሰጥ ብርሃን” ብሎ በትርጓሜ ማስፋት።
  rationale: ግሪኩ በብርሃንና በሕይወት መካከል ያለውን ዝምድና በአንድ ብቻ መንገድ አይወስንም፤ ቀጥተኛው አገላለጽ ይህን ሥነ መለኮታዊ ስፋት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ተናገራቸው፣” “ከቶ” እና “ይመላለስም” የሚሉት ቃላት የምንጩን ክብርና ምሳሌያዊ ኃይል ሳያጠፉ ተፈጥሯዊ ንባብን ያስገኛሉ። የእግር ማስታወሻ [a] ከጠንካራው እምቢታ ጋር፣ [b] ደግሞ ከ“የሕይወት ብርሃን” ጋር በትክክል ተያይዘዋል።
