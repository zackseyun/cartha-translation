  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: am
  text: የእኔ የሆነው ሁሉ የአንተ ነው፤ የአንተም የሆነው የእኔ ነው፤ እኔም በእነርሱ[a] ከብሬአለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእነርሱ አማካይነት” ወይም “በመካከላቸው።” የግሪኩ ሐረግ በቀጥታ “በእነርሱ” ይላል፤ በዚህ አውድ ቦታን፣ አማካይነትን ወይም መገለጥን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: የእኔ የሆነው ሁሉ
  rationale: ገለልተኛ ብዙ ቁጥር ያለው ሐረግ ኢየሱስ የእርሱ የሆነውን ሁሉ በሰፊው ያመለክታል፤ ይህ አተረጓጎም አጠቃላይነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σά
  choice: የአንተ ነው
  rationale: የባለቤትነት ቅጽን በአማርኛ ተፈጥሯዊ በሆነ የዝምድና አረፍተ ነገር ይገልጣል።
- source_word: τὰ σὰ ἐμά
  choice: የአንተም የሆነው የእኔ ነው
  rationale: ከመጀመሪያው ሐረግ ጋር ያለውን ትይዩነትና የጋራ ባለቤትነት ግልጽ አድርጎ ይጠብቃል።
- source_word: δεδόξασμαι
  choice: ከብሬአለሁ
  rationale: የግሪኩን ፍጹም ተደራጊ ቅርጽ—የተፈጸመና ውጤቱ የቀጠለ ተግባር—በተፈጥሯዊ የአማርኛ ግስ ያቀርባል። በአማርኛ ‘ከበርኩ’ የሚለው አውዳዊ ቅርጽ ተደራጊውን ሐሳብ በተፈጥሮ ይሸከማል።
- source_word: ἐν αὐτοῖς
  choice: በእነርሱ
  rationale: ἐν የሚለውን ቀጥተኛና ሆን ብሎ ያልተወሰነ ኃይል ይጠብቃል፤ በአውዱ እነርሱ አብ የሰጣቸውን ሰዎች ያመለክታል።
theological_decisions:
- issue: በወልድና በአብ መካከል ያለው የጋራ ባለቤትነት
  choice: የግሪኩን ቀጥተኛ የእርስ በርስ ባለቤትነት ንግግር ሳይዳከም ማቅረብ
  alternative: ንግግሩን የሥራ ትብብር ብቻ እንደሚያመለክት አድርጎ ማለዘብ
  rationale: ግሪኩ የጋራ ባለቤትነቱን በግልጽ ይናገራል፤ ትርጉሙም በጥቅሱ የሌለ በኋላ የተቀመረ ሥነ መለኮታዊ ቃል ሳያስገባ ይህን ይጠብቃል።
- issue: ἐν αὐτοῖς የሚለው ሐረግ ኃይል
  choice: በእነርሱ የሚለውን ቅርጽ በዋናው ጽሑፍ ማስቀመጥ
  alternative: በእነርሱ አማካይነት ወይም በመካከላቸው ብሎ ትርጉሙን መወሰን
  rationale: ἐν በአውዱ ቦታን፣ መሣሪያነትን ወይም መገለጥን ሊያመለክት ስለሚችል ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የሐረጎቹ ትይዩነት ተጠብቋል፤ የἐν አሻሚነት በዋናው ጽሑፍና በማስታወሻው ተወክሏል።
