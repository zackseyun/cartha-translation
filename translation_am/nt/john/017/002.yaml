  verdict: revise
  source_fidelity: The draft correctly renders the Father’s grant of authority, the universal scope of πάσης σαρκός, and the distinction between that authority and the people to whom eternal life is given. However, the second αὐτῷ (“to him”) is not expressed in the main text, and the purpose clause is made unnecessarily awkward by “ይህም ... ነው.”
  naturalness: “በሥጋ ለባሽ ሁሉ” is a natural modern Amharic way to retain the biblical image of “all flesh.” The revised purpose clause is more fluent and directly reflects the Greek syntax.
  terminology: ሥልጣን and የዘላለም ሕይወት are accurate, established terms. The collective expression “የሰጠኸውን ሁሉ” is retained, while the plural recipient is appropriately represented by እንዲሰጣቸው.
  issues:
