  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: am
  text: አንተ እንድሠራው የሰጠኸኝን ሥራ በመፈጸም፣ እኔ በምድር ላይ አከበርኩህ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንተ እንድሠራው የሰጠኸኝን ሥራ ፈጽሜ፣ በምድር ላይ አከበርኩህ።”
    reason: τελειώσας የዘዴ ትርጉም ብቻ ሳይሆን የቀደመ ወይም ተጓዳኝ ሁኔታን ሊገልጽ የሚችለውን ሰዋሰዋዊ አማራጭ ለማቆየት።
lexical_decisions:
- source_word: ἐδόξασα
  choice: አከበርኩህ
  rationale: በዮሐንስ አጠቃቀም አብን ማክበርና ክብሩን መግለጥ የሚያመለክተውን የδοξάζω ሃይማኖታዊ ክብደት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድር ላይ
  rationale: የἐπίን ቦታዊ ትርጉም በግልጽና በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τελειώσας
  choice: በመፈጸም
  rationale: የአኦሪስት አሳታፊውን ከዋናው ግስ ጋር እንደ ዘዴ ወይም ምክንያት ያገናኛል፤ ሥራውን ወደ ፍጻሜ ማድረስንም ያሳያል።
- source_word: τὸ ἔργον
  choice: ሥራ
  rationale: ἔργονን በቀጥታ የሚያስተላልፍና ኢየሱስ ከአብ የተቀበለውን ተልእኮ ለመግለጽ ተስማሚ ነው።
- source_word: δέδωκάς μοι
  choice: የሰጠኸኝን
  rationale: የተፈጸመና አሁንም ጠቀሜታው የሚቀጥል ስጦታ መሆኑን በአማርኛው አንጻራዊ አወቃቀር ያሳያል።
- source_word: ἵνα ποιήσω
  choice: እንድሠራው
  rationale: ሥራው ለኢየሱስ የተሰጠው እርሱ እንዲያደርገው መሆኑን የዓላማ አንቀጽ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐγώ σε
  choice: እኔ ... አከበርኩህ
  rationale: ግልጽ የሆነውን ἐγώ በ‘እኔ’ በማስቀመጥ የግሪኩን አጽንዖት ይጠብቃል፤ σε ደግሞ በግሱ ውስጥ ‘-ህ’ ተካትቷል።
theological_decisions:
- issue: τελειώσας ከ‘አከበርኩህ’ ጋር ያለው ግንኙነት
  choice: እንደ ዘዴ፦ ‘ሥራውን በመፈጸም ... አከበርኩህ’
  alternative: እንደ ጊዜ፦ ‘ሥራውን ፈጽሜ ... አከበርኩህ’፤ ወይም እንደ ተጓዳኝ ድርጊት፦ ‘አከበርኩህ፤ ሥራውንም ፈጸምኩ’
  rationale: አሳታፊው ኢየሱስ አብን እንዴት እንዳከበረ በተፈጥሮ ያብራራል። ይህም ታዛዥ ተልእኮውን መፈጸሙን ከአብ ክብር ጋር ያገናኛል፤ ነገር ግን የጊዜ/ተጓዳኝ ድርጊት ንባብ ሰዋሰዋዊ አማራጭ ሆኖ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘በመፈጸም’ የግሪኩን አሳታፊ ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል፤ ‘እኔ’ የምንጩን አጽንዖት ይጠብቃል።
