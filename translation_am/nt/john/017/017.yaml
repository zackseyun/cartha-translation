source:
  edition: SBLGNT
  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: am
  text: በእውነት ቀድሳቸው፤ ቃልህ እውነት[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቃልህ እውነቱ ነው።” በግሪኩ “እውነት” የሚለው ገላጭ ስም የውስንነት አመልካች የለውም፤ ይህም ቀላል መለያነትን ከመግለጽ ይልቅ የጥራት አጽንዖት (“እውነት ነው”) ሊሰጥ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: ቀድሳቸው
  rationale: የትእዛዝ አገላለጹን ይጠብቃል፤ ቃሉም ለእግዚአብሔር መለየትንና ቅድስናን አብሮ ሊያመለክት ይችላል።
- source_word: αὐτοὺς
  choice: -አቸው
  rationale: የብዙ ሰዎች ተሳቢ ተውላጠ ስም በግሱ ላይ በተፈጥሯዊ የአማርኛ አወቃቀር ተያይዟል።
- source_word: ἐν τῇ ἀληθείᾳ
  choice: በእውነት
  rationale: ἐν የሚያስችለውን ‘በእውነት ውስጥ’ እና ‘በእውነት አማካይነት’ የሚሉትን የስፍራና የመሣሪያ ፍቺዎች ሳይገድብ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ λόγος ὁ σὸς
  choice: ቃልህ
  rationale: ‘የአንተ ቃል’ የሚለውን ትርጉም በተፈጥሯዊና ክብር ባለው አጭር አገላለጽ ይሰጣል።
- source_word: ἀλήθειά ἐστιν
  choice: እውነት ነው
  rationale: ገላጭ ስሙ በግሪኩ የውስንነት አመልካች የሌለው መሆኑን በመጠበቅ የጥራት አጽንዖቱን ያስተላልፋል፤ ‘እውነት ነው’ እንጂ ‘እውነቱ ነው’ አይልም።
theological_decisions:
- issue: በሁለተኛው ሐረግ ἀλήθεια በጥራት ወይስ በውስን መለያ እንደተነገረ መተርጎም
  choice: ቃልህ እውነት ነው
  alternative: ቃልህ እውነቱ ነው
  rationale: ገላጭ ስሙ በግሪኩ የውስንነት አመልካች የለውም። ስለዚህ ዋናው ጽሑፍ የጥራት ኃይሉን ይጠብቃል፤ ውስን መለያ ያለው አተረጓጎም ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ቀድሳቸው” መጽሐፍ ቅዱሳዊ ክብደቱን ሳያጣ መለየትንና ቅዱስ ማድረግን ይይዛል።
