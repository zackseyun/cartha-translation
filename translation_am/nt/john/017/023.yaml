  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: am
  text: እኔ በእነርሱ ውስጥ ነኝ፤ አንተም በእኔ ውስጥ ነህ፤ ወደ ፍጹም አንድነት እንዲደርሱ[a]፣ ዓለምም አንተ እንደላክኸኝና እኔን እንደወደድኸኝ እነርሱንም እንደወደድካቸው እንዲያውቅ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍጹም ሆነው አንድ እንዲሆኑ” ወይም “ወደ አንድነት ፍጽምና እንዲደርሱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: በእነርሱ ውስጥ / በእኔ ውስጥ
  rationale: የዮሐንስን የመኖርና የውስጣዊ ኅብረት ቋንቋ ለማቆየት ἐν በ“ውስጥ” ተተርጉሟል።
- source_word: τετελειωμένοι εἰς ἕν
  choice: ወደ ፍጹም አንድነት እንዲደርሱ
  rationale: የተጠናቀቀ ድርጊት ያስገኘውን ሁኔታና ወደ አንድነት የሚያመራውን ውጤት በተፈጥሯዊ አማርኛ ይገልጣል፤ ፍጹም ኃጢአት አልባነትን ብቻ እንዳያመለክትም ይጠነቀቃል።
- source_word: γινώσκῃ
  choice: እንዲያውቅ
  rationale: ከἵνα በኋላ ያለውን የዓላማ ንዑስ ነገር ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: κόσμος
  choice: ዓለም
  rationale: በዮሐንስ ወንጌል ያለውን ሰፊና ሆን ተብሎ ያልተገደበ አጠቃቀም ያቆያል።
- source_word: ἀπέστειλας
  choice: እንደላክኸኝ
  rationale: የአብን የልጁን መላክ ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ያስተላልፋል።
- source_word: ἠγάπησας
  choice: እንደወደድኸኝ / እንደወደድሃቸው
  rationale: በግሪኩ ያለውን የግስ ድግግሞሽና የፍቅር ንጽጽር ይጠብቃል።
- source_word: καθὼς
  choice: እንደ… እነርሱንም እንደ…
  rationale: በአማርኛ የ“እንደ” ንጽጽር አወቃቀር የንጽጽሩን ኃይል ሳያለዝብ በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: “እኔን እንደወደድኸኝ እነርሱንም” የሚለው ንጽጽር ኃይል
  choice: ንጽጽሩን ሳያለዝብ “እኔን እንደወደድኸኝ እነርሱንም እንደወደድሃቸው” ተብሎ ተተርጉሟል።
  alternative: “እኔን በወደድኸኝ ዓይነት ፍቅር” የሚል የተለዘበ ወይም የተብራራ አተረጓጎም።
  rationale: καθὼς እውነተኛና ክብደት ያለውን ንጽጽር ያቀርባል፤ ጽሑፉ የሚፈጥረው ሥነ መለኮታዊ ውጥረት ሊጠበቅ ይገባል።
- issue: በዐውዱ ውስጥ የτετελειωμένοι ትርጉም
  choice: ወደ ፍጹም አንድነት መድረስ ተብሎ ቀርቧል።
  alternative: ፍጹም ኃጢአት አልባ መሆን ብቻን የሚያመለክት “ፍጹማን እንዲሆኑ” የሚል አተረጓጎም።
  rationale: ግሱ ወደ ሙላትና ፍጻሜ ማድረስን ሊያመለክት ይችላል፤ εἰς ἕν ደግሞ የታሰበውን የአንድነት ውጤት ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር አወቃቀር በአማርኛ ግልጽ እንዲሆን “እሆናለሁ” ተሟልቷል፤ ነገር ግን “በ… ውስጥ” የሚለው የመኖር ምስል ተጠብቋል።
