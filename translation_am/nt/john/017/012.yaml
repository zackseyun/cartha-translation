    text: ወይም፣ “ከእነርሱ አንድም አልጠፋብኝም።”
    reason: lexical_alternative
  - marker: b
    text: “የጥፋት ልጅ” የዕብራይስጥ ዓይነት አነጋገር ነው፤ በሌላ አገላለጽ፣ “ለጥፋት የሚሆነው ሰው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: ከእነርሱ ጋር ሳለሁ
  rationale: የጊዜውን ተጓዳኝ ሁኔታና ኢየሱስ ከደቀ መዛሙርቱ ጋር የነበረበትን ጊዜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐτήρουν
  choice: እጠብቃቸው ነበር
  rationale: የግሱን ቀጣይ ያለፈ ድርጊት ይጠብቃል፤ እንክብካቤንና በጥንቃቄ መጠበቅን ያመለክታል።
- source_word: ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι
  choice: ለእኔ በሰጠኸኝ ስምህ
  rationale: የግሪኩን ጾታና ቁጥር በመከተል የዝምድናው ሐረግ ‘ስምህን’ እንዲያመለክት ያደርጋል፤ ወደ ‘የሰጠኸኝ ሰዎች’ አያስተካክለውም።
- source_word: καὶ ἐφύλαξα
