  rationale: ከτηρέω የተለየውን የመከላከልና የጥበቃ ኃይል በተለየ ግስ ያሳያል።
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: ከእነርሱ አንድም አልጠፋም
  rationale: ἀπόλλυμι በዚህ አገባብ ‘መጥፋት’ ወይም ‘መጥፋት ላይ መድረስ’ የሚለውን ስፋት በአማርኛው ‘ጠፋ’ ያቆያል።
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: የጥፋት ልጅ
  rationale: ሴማዊውን የአነጋገር ዘይቤ በቅርብ መልኩ ያቆያል፤ ሐረጉን ወደ አንድ የተወሰነ አስተምህሮ አያስፋፋውም።
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: ይህም መጽሐፉ እንዲፈጸም ነው
