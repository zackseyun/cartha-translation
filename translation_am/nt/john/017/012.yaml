- issue: የὁ υἱὸς τῆς ἀπωλείας ትርጉም
  choice: የጥፋት ልጅ
  alternative: ለጥፋት የተወሰነው ሰው
  rationale: ዋናው ጽሑፍ ሴማዊውን ምስላዊ አነጋገርና መለኮታዊ ውጥረቱን ያቆያል፤ ፍቺውን እንደ ሙሉ የቀደመ ውሳኔ አስተምህሮ አይፈታውም።
- issue: የἵνα ዓላማና ውጤት ግንኙነት
  choice: መጽሐፉ እንዲፈጸም
  alternative: መጽሐፉ ተፈጸመ
  rationale: የግሪኩ አገባብ የሚያስቀምጠውን የዓላማ/ውጤት ውጥረት ሳይሰርዝ ያቆያል።
