revisions:
- from: ስለ እነዚህ ብቻ አልለምንም፤ ነገር ግን በእነርሱ ቃል[a] በእኔ ስለሚያምኑትም ጭምር እለምናለሁ።
  to: ስለ እነዚህ ብቻ አልለምንም፤ ነገር ግን በቃላቸው በእኔ ስለሚያምኑትም እለምናለሁ።
  rationale: The revision uses the idiomatic possessive በቃላቸው for “through their word,” retains the present-participial scope without specifying when people believe, and keeps the alternative sense of λόγος in a footnote anchored after ቃላቸው. The clause remains a prayer/request concerning both the immediate group and others who believe through their word.
