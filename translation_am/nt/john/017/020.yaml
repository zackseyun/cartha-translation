id: JHN.17.20
reference: John 17:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: am
  text: ስለ እነዚህ ብቻ አልለምንም፤ ነገር ግን በቃላቸው በእኔ ስለሚያምኑትም እለምናለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶ
  choice: እለምናለሁ
  rationale: ቃሉ በዮሐንስ 17 የኢየሱስን ወደ አብ የሚቀርብ ጥያቄ ያመለክታል። «እለምናለሁ» ይህን የጸሎት አውድ በተፈጥሯዊ አማርኛ ያሳያል፤ የቃሉንም መሠረታዊ የመጠየቅ ሐሳብ ይጠብቃል።
- source_word: περὶ τούτων
  choice: ስለ እነዚህ
  rationale: περί ከወራሽ መስተዋድድ ጋር «ስለ/በተመለከተ» የሚለውን ሐሳብ ይሰጣል። «እነዚህ» ማንን እንደሚያመለክት በጽሑፉ ውስጥ ተጨማሪ ሳይገለጽ የግሪኩን አመልካች ቅርጽ ይጠብቃል።
- source_word: μόνον
  choice: ብቻ
  rationale: የልመናውን ወሰን የሚገድበውን ቃል በቀጥተኛና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀλλὰ καὶ
  choice: ነገር ግን … ጭምር
  rationale: በቅርብ ያሉትን ብቻ ከመለመን ወደ ሌሎችም የሚዘረጋውን ንጽጽርና ጭማሪ በግልጽ አማርኛ ያሳያል።
- source_word: τῶν πιστευόντων
  choice: ስለሚያምኑት
  rationale: የአሁን ጊዜ አሳታፊውን እንደ ስም የሚሠራ ቅርጽ በግስ ኃይሉ ያቀርባል። የአማርኛው ቅርጽ እነዚህ በአሁኑ ጊዜ ወይም ወደፊት የሚያምኑ መሆናቸውን በግድ አይወስንም።
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: በእነርሱ ቃል
  rationale: διά እምነት የሚመጣበትን መንገድ ያሳያል፤ λόγος ደግሞ «ቃል» ወይም «መልእክት» ሊሆን ይችላል። «ቃል» ከምንጩ ጋር ቅርብ ሆኖ የዮሐንስን የቃል አጠቃቀም ይጠብቃል።
- source_word: εἰς ἐμέ
  choice: በእኔ
  rationale: πιστεύω εἰς በዮሐንስ ወንጌል በግለሰብ ላይ የሚደረግን እምነት ያመለክታል፤ «በእኔ ማመን» ተፈጥሯዊውን የአማርኛ አገላለጽ ይጠቀማል።
theological_decisions:
- issue: የኢየሱስ ልመና ከቅርብ ደቀ መዛሙርቱ አልፎ የሚደርስበት ወሰን
  choice: በደቀ መዛሙርቱ ቃል በኢየሱስ የሚያምኑትን ሌሎች ሰዎች ያካትታል፤ ጊዜያቸው ግን በትርጉሙ አልተወሰነም።
  alternative: አስቀድመው በደቀ መዛሙርቱ ቃል ማመን የጀመሩትን ጠባብ ቡድን ብቻ ያመለክታል።
  rationale: τῶν πιστευόντων ከδιὰ τοῦ λόγου αὐτῶν ጋር ተያይዞ «እነዚህ» ከተባሉት ውጭ ያሉትን ያካትታል። ግሪኩ ግን «ወደፊት የሚያምኑ» የሚል ግልጽ የወደፊት ጊዜ ቅርጽ ስለሌለው፣ ትርጉሙ የጊዜውን ሊኖሩ የሚችሉ ትርጓሜዎች ክፍት ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እለምናለሁ» የጸሎቱን አውድ ያሳያል፤ በሁለተኛው ክፍል ግሱን መድገም በግሪኩ የተዘለለውን ግስ በተፈጥሯዊ አማርኛ ግልጽ ያደርገዋል።
