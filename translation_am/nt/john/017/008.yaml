lexical_decisions:
- source_word: ῥήματα
  choice: ቃሎች
  rationale: የተነገሩ ቃሎችን ወይም ንግግሮችን የሚያመለክተውን ብዙ ቁጥር በቀጥታ ይጠብቃል፤ “መልእክት” ብሎ ወደ ነጠላ ቁጥር አይለውጠውም።
- source_word: ἔδωκάς ... δέδωκα
  choice: የሰጠኸኝን ... ሰጥቻቸዋለሁ
  rationale: የመጀመሪያውን ያለፈ ድርጊትና የሁለተኛውን የተፈጸመና ውጤቱ የሚታይ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔλαβον
  choice: ተቀብለዋቸዋል
  rationale: የተሰጣቸውን ቃሎች መቀበላቸውን ያሳያል፤ “ወሰዱ” ከሚለው አካላዊ ትርጉም ይልቅ ለዐውደ ንባቡ ይስማማል።
- source_word: ἔγνωσαν ἀληθῶς
  choice: በእውነት አውቀዋል
  rationale: ἀληθῶςን በግልጽ ሁኔታ ያቆያል፤ ወደ “በእርግጠኝነት” በማለት አይገድበውም።
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: ከአንተ እንደመጣሁ
  rationale: የመነሻ ወይም የምንጭ ግንኙነቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐπίστευσαν
  choice: አምነዋል
  rationale: ὅτι በሚያስገባው የእውነታ አረፍተ ነገር ላይ ያመኑ መሆናቸውን በቀጥታ ያሳያል።
- source_word: ἀπέστειλας
  choice: እንደላክኸኝ
  rationale: አብ ኢየሱስን መላኩን ያለ ተጨማሪ ትርጓሜ በቀጥታ ይገልጻል።
- source_word: ὅτι
  choice: -ና
  rationale: የመጀመሪያው ὅτι ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ወይም ማብራሪያዊ ግንኙነት በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθον የሚገልጸው የኢየሱስና የአብ ግንኙነት
  choice: እኔ ከአንተ እንደመጣሁ
  alternative: እኔ ከአንተ እንደወጣሁ
  rationale: ጽሑፉ የሚገልጸውን መነሻ ይጠብቃል፤ በኋላ የተዘጋጀ ሥነ መለኮታዊ ቃል ሳያስገባ የንግግሩን ክብደትና ክፍትነት ያቆያል።
- issue: πιστεύω ከὅτι አረፍተ ነገር ጋር ያለው አገባብ
  choice: አንተ እንደላክኸኝም አምነዋል
  alternative: አንተ እንደላክኸኝም ታምነዋል
  rationale: እዚህ እምነቱ የሚመለከተው “አንተ ላክኸኝ” የሚለውን እውነታ ስለሆነ፣ “አመኑ” የግሪኩን አገባብ በትክክል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የ“-ና” ቅጥያ የመክፈቻውን ὅτι ማብራሪያዊ ኃይል በተፈጥሯዊ መንገድ ይይዛል።
