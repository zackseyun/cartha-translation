  rationale: የግሪክ ቅጹ ሁለቱንም ፍቺዎች ይፈቅዳል። በዮሐንስ ጽሑፎች ያለው አጠቃቀምና የመለኮታዊ ጥበቃ አውድ ግላዊውን ማመልከቻ ይበልጥ ይደግፋሉ። ሆኖም እውነተኛው የቋንቋ አሻሚነት እንዳይጠፋ ‘ክፋት’ የሚለው አማራጭ በእግር ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘ነገር ግን … ነው’ የሚለው አወቃቀር οὐκ … ἀλλ’ ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
