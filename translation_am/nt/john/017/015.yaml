  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: am
  text: ከዓለም እንድታወጣቸው አልለምንም፤ ነገር ግን ከክፉው[a] እንድትጠብቃቸው ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከክፋት እንድትጠብቃቸው።” የግሪኩ τοῦ πονηροῦ ቃል “ክፉው” ወይም “ክፋት” ማለት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: እለምናለሁ / አልለምንም
  rationale: ἐρωτάω በዚህ የጸሎት አውድ ‘መለመን፣ መጠየቅ’ ማለት ነው። በአማርኛ ‘አልለምንም’ የአሁኑን የኢየሱስ ልመና በተፈጥሯዊና በክብር ያቀርባል።
- source_word: ἄρῃς
  choice: እንድታወጣቸው
  rationale: αἴρω ከἐκ τοῦ κόσμου ጋር እዚህ ‘ከ… ማውጣት፣ ማስወገድ’ የሚል ፍቺ አለው፤ ‘ከዓለም እንድታወጣቸው’ ተፈጥሯዊ አማርኛ ነው።
- source_word: κόσμου
  choice: ዓለም
  rationale: ‘ዓለም’ የκόσμοςን ሰፊ የዮሐንስ አጠቃቀም ይጠብቃል፤ በጽሑፉ ከተገለጠው በላይ የተወሰነ ትርጉም አይጭንም።
- source_word: τηρήσῃς
  choice: እንድትጠብቃቸው
  rationale: τηρέω እዚህ ‘መጠበቅ፣ ከጉዳት መከላከል’ የሚል ነው። ‘እንድትጠብቃቸው’ ግልጽና የተለመደ ሲሆን የጥበቃውን መንገድ አላስፈላጊ ሁኔታ አይወስንም።
- source_word: ἐκ
  choice: ከ-
  rationale: ከτηρέω ጋር ያለው ἐκ ከአንድ አደጋ መጠበቅን ያመለክታል፤ የአማርኛው ‘ከ-’ ይህን ግንኙነት በቀጥታ ያሳያል።
- source_word: τοῦ πονηροῦ
  choice: ክፉው
  rationale: በግሪክ አንቀጽ ያለው ቅጽ ተባዕታይ ‘ክፉው’ ወይም ገለልተኛ ‘ክፋት’ ሊሆን ይችላል። የዮሐንስ አጠቃቀም ግላዊውን ፍቺ ስለሚደግፍ ‘ክፉው’ በዋናው ጽሑፍ ተመርጧል፤ ሌላው ፍቺ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: τοῦ πονηροῦ ግላዊ (‘ክፉው’) ወይስ ግላዊ ያልሆነ (‘ክፋት’) ማመልከቱ
  choice: ክፉው
