source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: am
  text: እኔ ቃልህን ሰጥቻቸዋለሁ፤ ዓለምም ጠልቷቸዋል፤ ምክንያቱም እነርሱ ከዓለም[a] አይደሉም፣ እኔም ከዓለም እንዳልሆንኩ ሁሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዓለም አይደሉም።” በሁለቱም ቦታ ያለው የግሪኩ አገላለጽ ቃል በቃል “ከ” የሚለውን ይጠቀማል፤ ይህም ምንጭን ወይም አባልነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: ሰጥቻቸዋለሁ
  rationale: የግሪኩ ፍጹም ጊዜ ቀድሞ የተፈጸመው ድርጊት ውጤቱ እንደሚቀጥል ያመለክታል፤ ይህ የአማርኛ አገላለጽም ያንን ገጽታ በተፈጥሮ ያስተላልፋል።
- source_word: λόγον
  choice: ቃል
  rationale: በኢየሱስ በኩል ለደቀ መዛሙርቱ የተሰጠውን የአብ ቃል ያመለክታል፤ ‘ቃል’ የዮሐንስን አጠቃቀምና ሰፊ ትርጉም ይጠብቃል።
- source_word: κόσμος
  choice: ዓለም
  rationale: መደበኛውን አቻ ቃል ይጠቀማል፤ በዚህ ክፍል ያለው የተቃውሞ ሐሳብ ከዐውዱ ግልጽ ስለሆነ በትርጓሜ አልተስፋፋም።
- source_word: ἐμίσησεν
  choice: ጠልቷቸዋል
  rationale: የዓለምን የተፈጸመና አሁንም የሚታይ ጥላቻ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቀጣዩ ሐረግ ዓለም የጠላቸውን ምክንያት እንደሚሰጥ በግልጽ ያሳያል።
- source_word: ἐκ τοῦ κόσμου
  choice: ከዓለም
  rationale: ἐκ የሚያመለክተውን ምንጭ፣ መነሻ ወይም አባልነት ሳይወስን በቅርብ ይጠብቃል።
- source_word: καθὼς
  choice: እንዳልሆንኩ … አይደሉም
  rationale: የአማርኛው አወቃቀር ቢለወጥም፣ በኢየሱስና በደቀ መዛሙርቱ መካከል ያለውን ‘ልክ እንደ’ ንጽጽር በግልጽ ያስተላልፋል።
theological_decisions:
- issue: ደቀ መዛሙርቱና ኢየሱስ ከ‘ዓለም’ ጋር ያላቸው ግንኙነት
  choice: ‘እኔ ከዓለም እንዳልሆንኩ እነርሱም ከዓለም አይደሉም’ ተብሎ ቀጥተኛው ንጽጽር እና ἐκ የሚያመጣው የምንጭ/አባልነት ውጥረት ተጠብቋል።
  alternative: ‘እኔ የዓለም እንዳልሆንኩ እነርሱም የዓለም አይደሉም’
  rationale: ጽሑፉ በኢየሱስና በደቀ መዛሙርቱ መካከል እውነተኛ ንጽጽር ያደርጋል፤ ‘ከዓለም’ የሚለው አተረጓጎም ይህን ንጽጽር ሳያዳክም ከጽሑፉ በላይ የሆነ ሥነ ሕላዌያዊ ማብራሪያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ቅደም ተከተል በመጠኑ በማስተካከል ንጽጽሩ በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል።
