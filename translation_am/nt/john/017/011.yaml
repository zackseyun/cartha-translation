    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “ለእኔ በሰጠኸው ስምህ ጠብቃቸው” የሚለውን ንባብ ይይዛሉ፤ ሌሎች ግን “በስምህ ለእኔ የሰጠኸኝን ጠብቃቸው” በሚል መንገድ ይነበባሉ። ይህ ትርጉም “የሰጠኸው” የሚለው “ስምህን” እንዲያመለክት የሚያደርገውን የSBLGNT ንባብ ይከተላል።
