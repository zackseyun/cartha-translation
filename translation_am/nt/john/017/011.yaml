  rationale: The revision corrects the relative clause so that the Father’s name—not the disciples—is what has been given to Jesus, and it restores the purpose force of ἵνα. It retains the source’s ambiguity concerning the sense of ‘in your name’ and the textual alternative in a revised, idiomatic footnote.
