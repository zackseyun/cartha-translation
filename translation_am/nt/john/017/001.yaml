id: JHN.17.1
reference: John 17:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: am
  text: ኢየሱስ እነዚህን ነገሮች ተናግሮ፣ ዓይኖቹን ወደ ሰማይ አንሥቶ እንዲህ አለ፦ “አባት ሆይ፣ ሰዓቲቱ ደርሳለች። ልጅህን አክብር፤ ልጁም አንተን እንዲያከብር፣”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: ይህን ከተናገረ በኋላ
  rationale: Ταῦτα የቀደመውን ንግግር ያመለክታል፤ የግሪኩን ተከታታይ ድርጊት በተፈጥሯዊ አማርኛ ለማቅረብ ἐλάλησεν ከቀጣዩ ድርጊት ጋር ‘ከተናገረ በኋላ’ ተብሎ ተተርጉሟል።
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ዓይኖቹን … አንሥቶ
  rationale: የጸሎቱን አካላዊ እንቅስቃሴ በግልጽና በተለመደ አማርኛ ይጠብቃል።
- source_word: εἰς τὸν οὐρανόν
  choice: ወደ ሰማይ
  rationale: εἰς እዚህ የአቅጣጫ ምልክት ስለሆነ ‘ወደ’ ተመርጧል።
- source_word: Πάτερ
  choice: አባት ሆይ
  rationale: የግሪኩን ቀጥተኛ የጥሪ ቅርጽ ይጠብቃል፤ በምንጩ የሌለው ‘የእኔ’ አልተጨመረም።
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: ሰዓቲቱ ደርሳለች
  rationale: የፍጹም ጊዜውን የተወሰነችው ሰዓት አሁን በወሳኝነት መድረሷን ያሳያል፤ ‘ሰዓት’ የዮሐንስን የጭብጥ ቃል ይጠብቃል።
- source_word: δόξασόν / δοξάσῃ
  choice: አክብር / እንዲያከብር
  rationale: በዘመናዊ አማርኛ ‘ማክበር’ ክብርን መግለጥና መስጠት የሚለውን የδοξάζω ስፋት በተፈጥሯዊ ሁኔታ ይሸከማል፤ በሁለቱም ቦታ አንድ ግስ በመጠቀም የግሪኩ ተመጣጣኝነት ተጠብቋል።
- source_word: σου τὸν υἱόν / ὁ υἱὸς
  choice: ልጅህ / ልጅህ
  rationale: የመጀመሪያውን የባለቤትነት ግንኙነት በቀጥታ ይገልጣል። በአማርኛ ሁለተኛውን ‘ልጁ’ ማለት ማጣቀሻውን ሊያደበዝዝ ስለሚችል፣ የሚያመለክተውን ግልጽ ለማድረግ ‘ልጅህ’ ተደግሟል።
- source_word: ἵνα
  choice: እንዲያከብር
  rationale: የἵναን ዓላማ ወይም ውጤት በተፈጥሯዊው የአማርኛ የዓላማ አገባብ ይገልጣል።
theological_decisions:
- issue: በአብና በወልድ መካከል ያለው የተ reciprocal ክብር
  choice: “ልጅህ አንተን እንዲያከብር፣ ልጅህን አክብር” የሚለው ተመጣጣኝ አገላለጽ ተጠብቋል።
  alternative: ‘ለልጅህ ክብርን ስጥ፣ እርሱም ለአንተ ክብርን እንዲሰጥ’ ብሎ ማብራራት።
  rationale: የግሪኩን አንድ ግስና የእርስ በርስ ክብር አሰጣጥ ይጠብቃል፤ የክብሩን መንገድ በትርጓሜ አይወስንም።
- issue: υἱός እንደ ክርስቶሳዊ ማዕረግ
  choice: ‘ልጅህ’ ተብሎ ተተርጉሟል።
  alternative: ‘ወልድህ’ ወይም ‘አንድያ ልጅህ’ ማለት።
  rationale: ‘ልጅህ’ የυἱόςን መደበኛ ትርጉም በግልጽ ያቀርባል፤ ‘አንድያ’ በዚህ ቁጥር ምንጩ ውስጥ የለም፣ ‘ወልድ’ ደግሞ ለብዙ ዘመናዊ አንባቢዎች ቤተ እምነታዊ ቴክኒካዊ ቃል ሊመስል ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጸሎት ጥሪውን ለማክበር ‘ሆይ’ ተጠቅሟል፤ ነገር ግን ጥንታዊ ወይም ከመጠን በላይ ሥርዓተ አምልኮአዊ ቃላት አልገቡም።
