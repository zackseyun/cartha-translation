  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: am
  text: አንተ ወደ ዓለም እንደላክኸኝ፣ እኔም ወደ ዓለም ላክኋቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: እንደ
  rationale: የአብን መላክና የኢየሱስን መላክ በግልጽ ንጽጽር ያገናኛል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: ἐμὲ ἀπέστειλας
  choice: ላክኸኝ
  rationale: ἐμέ የግሱ ቀጥተኛ ተሳቢ ነው፤ በአማርኛ በግሱ ውስጥ በተፈጥሯዊ ሁኔታ ተካቷል። ἀποστέλλωን ‘ላከ’ ብሎ መተርጎም የመላክን ቀጥተኛ ትርጉምና የዮሐንስን የተልእኮ ቋንቋ ይጠብቃል።
- source_word: εἰς τὸν κόσμον
  choice: ወደ ዓለም
  rationale: εἰς የእንቅስቃሴን አቅጣጫ ያሳያል፤ ‘ወደ ዓለም’ በአማርኛ ተፈጥሯዊ ሆኖ የግሪኩን ሐሳብ ያስተላልፋል። κόσμος በዮሐንስ ውስጥ ያለውን ሰፊና አንዳንድ ጊዜ ውጥረት ያለበትን ትርጉም ሳይገድብ ‘ዓለም’ ተብሏል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: የκαὶ ἐγώን ጭማሪና አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπέστειλα αὐτοὺς
  choice: ላክኋቸው
  rationale: ከመጀመሪያው ἀπέστειλας ጋር ያለውን ሆን ተብሎ የተደረገ የግስ ትይዩነት ‘ላከ’ በማለት ይጠብቃል፤ αὐτούς በግሱ ውስጥ ‘-ኋቸው’ ተብሎ ተካቷል።
theological_decisions:
- issue: በአብ የተላከው ወልድና በወልድ የተላኩት ደቀ መዛሙርት መካከል ያለው የተልእኮ ንጽጽር
  choice: በሁለቱም ሐረጎች ‘ላከ’ የሚለውን ተመሳሳይ ግስ መጠቀም
  alternative: በሁለተኛው ሐረግ ‘አሰማራኋቸው’ ወይም ‘ተልእኮ ሰጠኋቸው’ ማለት
  rationale: የግሪኩ ጽሑፍ ἀποστέλλωን በሁለቱም ሐረጎች በመጠቀም ንጽጽሩን ያጎላል። ተመሳሳይ የአማርኛ ግስ መጠቀም ትይዩነቱን ይጠብቃል፤ ነገር ግን የወልድንና የደቀ መዛሙርቱን ማንነት ወይም ተልእኮ ፍጹም አንድ ነው ብሎ አይተረጉምም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁለቱ ሐረጎች ትይዩነት ‘ወደ ዓለም ... ወደ ዓለም’ እና ‘ላክኸኝ ... ላክኋቸው’ በሚለው አወቃቀር ተጠብቋል።
