  verdict: revise
  source_fidelity: The draft accurately conveys the movement toward the Father, the speaking in the world, Jesus' own joy, and its fullness. However, ἵνα ἔχωσιν is more directly represented by an expression in which the disciples have/possess the joy, and ἑαυτοῖς should retain its reflexive force.
  naturalness: The current wording is generally clear, but “በዓለም ሳለሁ” makes the temporal implication more explicit than the Greek, and “በእነርሱ ውስጥ” is less precise than a reflexive expression. The revision is idiomatic modern standard Amharic while retaining the Greek relationships.
  terminology: “ደስታዬ” appropriately renders Jesus' joy. “ሙሉ ሆኖ” naturally expresses joy brought to fullness without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The purpose clause does not explicitly express the disciples' having the joy.
    rationale: ἵνα ἔχωσιν means “so that they may have.” “ደስታዬ ... ሙሉ እንዲሆን” is understandable, but shifts the clause from the disciples' possession of joy to joy simply becoming full.
  - severity: low
    issue: The reflexive sense of ἐν ἑαυτοῖς is weakened.
    rationale: “በእነርሱ ውስጥ” can refer to them, but “በራሳቸው ውስጥ” more clearly preserves the Greek reflexive pronoun.
  - severity: low
    issue: “ሳለሁ” adds an explicit temporal nuance.
    rationale: ἐν τῷ κόσμῳ literally states the setting, “in the world.” The added “while I am” is contextually reasonable but not required.
  revised_text: አሁን ግን ወደ አንተ እየመጣሁ ነው፤ እነዚህንም ነገሮች በዓለም እናገራለሁ፥ ደስታዬ በራሳቸው ውስጥ ሙሉ ሆኖ እንዲኖራቸው[a]።
