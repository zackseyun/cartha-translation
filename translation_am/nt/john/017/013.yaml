- source_word: πρὸς σὲ ἔρχομαι
  choice: ወደ አንተ እየመጣሁ ነው
  rationale: ወደ አብ የሚደረገውን እንቅስቃሴና የአሁኑን ጊዜ አስፔክት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ταῦτα λαλῶ
  choice: እነዚህን ነገሮች ... እናገራለሁ
  rationale: የመናገርን ድርጊት በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: ἐν τῷ κόσμῳ
  choice: በዓለም ሳለሁ
