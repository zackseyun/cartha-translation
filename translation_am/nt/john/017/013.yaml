- source_word: ἐν ἑαυτοῖς
  choice: በእነርሱ ውስጥ
  rationale: ደስታው በደቀ መዛሙርቱ ውስጥ የሚገኝ ውስጣዊ ተሞክሮ መሆኑን በቅርብ መንገድ ያስተላልፋል፤ የቡድን መካከላዊ ትርጉምም ፈጽሞ አይዘጋም።
theological_decisions:
- issue: የ‘ደስታዬ’ ባሕርይ
