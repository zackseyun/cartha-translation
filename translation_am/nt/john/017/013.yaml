  alternative: ስለ ኢየሱስ የሚሰማቸው ደስታ
  rationale: ἐμὴν በተፈጥሮው ደስታው የኢየሱስ እንደሆነ ያመለክታል፤ ትርጉሙ ይህን ይጠብቃል እንጂ የተሳትፎን ወይም የኅብረትን ሥነ መለኮታዊ መንገድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል ለአማርኛ ተፈጥሯዊነት ተስተካክሏል፤ የዓላማው ግንኙነትና የደስታው ሙላት ሳይጠፉ ተጠብቀዋል።
