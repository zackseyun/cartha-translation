  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: am
  text: የዘላለም ሕይወትም ይህ ነው፤ አንተን፣ ብቸኛውን እውነተኛ አምላክ፣ እና የላክኸውን ኢየሱስን፣ መሲሑን፣ እንዲያውቁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊ አተረጓጎም፣ «የላክኸውን ኢየሱስ ክርስቶስን።» የግሪኩ Χριστός እንደ ማዕረግ («መሲሕ») ወይም በአንዳንድ አውዶች እንደ ስም የሚያገለግል መጠሪያ («ክርስቶስ») ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: ይህ ነው
  rationale: ገላጭ ንግግሩን በተፈጥሯዊ አማርኛ ያስተዋውቃል፤ δέ በአማርኛው የ«ም» አያያዥ ተጠብቋል።
- source_word: ἡ αἰώνιος ζωὴ
  choice: የዘላለም ሕይወት
  rationale: በዮሐንስ የተለመደውን፣ ዘላቂና ከሚመጣው ዘመን ጋር የተያያዘውን ሕይወት የሚገልጽ ግልጽ አማርኛ ነው።
- source_word: ἵνα γινώσκωσι
  choice: እንዲያውቁ
  rationale: የዘላለም ሕይወት ይዘት ምን እንደሆነ ይገልጻል፤ ግሱም የግንኙነትና ቀጣይ እውቀትን ሊያመለክት የሚችል ሆኖ ተተርጉሟል።
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: ብቸኛውን እውነተኛ አምላክ
  rationale: μόνον እና ἀληθινόν የሚሰጡትን «ብቸኛ» እና «እውነተኛ» ትርጉም በቀጥታ ይጠብቃል።
- source_word: ὃν ἀπέστειλας
  choice: የላክኸውን
  rationale: ኢየሱስን ከላከው አብ ጋር ያለውን የተልእኮ ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: Ἰησοῦν Χριστόν
  choice: መሲሑን ኢየሱስን
  rationale: Χριστόςን እንደ ማዕረግ «መሲሕ» ብሎ ያቀርባል፤ የአማርኛው የቃላት አደራደር ማዕረጉንና ስሙን በግልጽ ያያይዛል።
theological_decisions:
- issue: «ብቸኛው እውነተኛ አምላክ» ከኢየሱስ ጋር ያለው አገባባዊ ግንኙነት
  choice: አብ በቀጥታ «ብቸኛው እውነተኛ አምላክ» ተብሎ ሲጠራ፣ ኢየሱስም እርሱ የላከው ሆኖ ተለይቶ የቀረበበትን የግሪክ አገባብ ጠብቋል።
  alternative: የሥላሴ አስተምህሮን በማብራሪያ ወደ ጥቅሱ መጨመር ወይም በአብና በኢየሱስ መካከል ያለውን ሰዋሰዋዊ ልዩነት ማደብዘዝ
  rationale: ትርጉሙ የጥቅሱን የራሱን አነጋገርና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ ከጥቅሱ ውጭ ያለ ማብራሪያ አያስገባም።
- issue: የΧριστόν አተረጓጎም
  choice: መሲሑን
  alternative: ክርስቶስን
  rationale: በዚህ ገላጭና የእምነት አውድ ማዕረጋዊው ትርጉም ግልጽ ስለሆነ «መሲሕ» ተመርጧል፤ ባህላዊው ስም-መሰል አተረጓጎም በማስታወሻ ቀርቧል።
