  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጸሎቱን ቀጥተኛ ሁለተኛ መደብ ንግግርና የዓረፍተ ነገሩን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
