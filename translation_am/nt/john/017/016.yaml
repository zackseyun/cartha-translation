  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: am
  text: እኔ ከዓለም እንዳልሆንኩ ሁሉ፣ እነርሱም ከዓለም[a] አይደሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘የዓለም።’ የግሪኩ ἐκ (‘ከ’) ምንጭን፣ መነሻን ወይም አባልነትን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: ከ
  rationale: ἐκ ምንጭን፣ መነሻን ወይም አባልነትን ሊገልጽ ይችላል፤ ከκόσμος ጋር ሲመጣ ‘ከዓለም’ የሚለው ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: κόσμου
  choice: ዓለም
  rationale: የዮሐንስን ሰፊ ሥነ መለኮታዊ አጠቃቀም ሳያጠብ ቀላሉን ቃል ይጠብቃል፤ ‘የዓለም ሥርዓት’ የሚል ትርጓሜያዊ ማስፋት አልተጨመረም።
- source_word: οὐκ εἰσὶν
  choice: አይደሉም
  rationale: የεἰμίን የአሁን ጊዜ አሉታዊ አገላለጽ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: καθὼς
  choice: እንደ
  rationale: በኢየሱስና በደቀ መዛሙርቱ መካከል ያለውን ንጽጽር በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐγὼ οὐκ εἰμὶ
  choice: እኔ እንዳልሆንኩ
  rationale: ግልጽ የሆነውን ἐγώ በ‘እኔ’ በማቆየት የንጽጽሩን አጽንዖት ይጠብቃል።
- source_word: ἐκ τοῦ κόσμου
  choice: ከዓለም
  rationale: በሁለቱም ሐረጎች የተደገመው የግሪክ ሐረግ በተመሳሳይ መልኩ ተተርጉሟል፤ ይህም የምንጭ/መነሻን ፍቺ ሳያጠፋ የአባልነትንም ፍቺ ክፍት ያደርጋል።
theological_decisions:
- issue: በዮሐንስ ሥነ መለኮት ‘ዓለም’ የሚለው ቃል ያለው ፍቺ
  choice: በዋናው ጽሑፍ ‘ዓለም’ የሚለውን ቀላል ቃል ማቆየት
  alternative: ‘የዓለም ሥርዓት’ ወይም ‘አሁን ያለው የወደቀ ሥርዓት’
  rationale: κόσμος በዮሐንስ ዘንድ ጥልቅ ሥነ መለኮታዊ ልኬት ቢኖረውም፣ ይህ ቁጥር ትርጓሜያዊ ማስፋትን አያስገድድም። ቀላሉን ቃል ማቆየት የጽሑፉን ውጥረትና ሰፊ ፍቺ ይጠብቃል።
- issue: ἐκ የሚያመለክተው ምንጭ ወይም አባልነት
  choice: በዋናው ጽሑፍ ‘ከዓለም’ ብሎ ማስቀመጥና የአባልነት ፍቺውን በማስታወሻ መጥቀስ
  alternative: ‘የዓለም አይደሉም’
  rationale: ‘ከ’ የግሪኩን የምንጭ/መነሻ አቅጣጫ በቅርብ ይጠብቃል፤ ‘የ’ ደግሞ የአባልነትን ፍቺ ያጎላል። ሁለቱንም የፍቺ አቅጣጫዎች ሳይደመስስ ዋናው ጽሑፍና ማስታወሻው አብረው ያቀርቧቸዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩን የቃላት ቅደም ተከተል በግድ ከመከተል ይልቅ ተፈጥሯዊው የአማርኛ ንጽጽራዊ አወቃቀር ተመርጧል፤ የሁለቱ ሐረጎች ትይዩነት ግን ተጠብቋል።
