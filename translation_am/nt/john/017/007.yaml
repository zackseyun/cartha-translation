  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: am
  text: አሁን እነርሱ አንተ የሰጠኸኝ ሁሉ ከአንተ መሆኑን አውቀዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አንተ የሰጠኸኝ ሁሉ ከአንተ እንደሚመጣ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: አሁን
  rationale: የደቀ መዛሙርቱን አሁናዊ የመረዳት ደረጃና ውጤት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἔγνωκαν
  choice: አውቀዋል
  rationale: የግሪኩ ፍጹም ጊዜ ከቀድሞ መገንዘብ የተገኘውንና አሁን ያለውን የማወቅ ሁኔታ ያሳያል፤ የአማርኛው ፍጹም ቅርጽም ይህን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ὅτι
  choice: እንደሆነ
  rationale: የታወቀውን ይዘት የሚያስገባ ተፈጥሯዊ የአማርኛ አገባብ ነው።
- source_word: πάντα ὅσα
  choice: ሁሉ
  rationale: ጥምሩ የሚገልጠውን ሙሉ አጠቃላይነት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከ«የሰጠኸኝ» ጋር ተያይዞ ‘የሰጠኸኝ ነገር ሁሉ’ የሚለውን ይዘት ይሰጣል።
- source_word: δέδωκάς μοι
  choice: የሰጠኸኝ
  rationale: የመስጠቱን ተግባርና ቀጣይ ጠቀሜታውን የሚያሳይ ሲሆን፣ በአማርኛ ተውላጠ ስም ከግሱ ጋር መዋሃዱ ተፈጥሯዊ ነው።
- source_word: παρὰ σοῦ
  choice: ከአንተ
  rationale: παρά ከባለቤት አገባብ ጋር የምንጭን ወይም የመገኛን ሐሳብ ይገልጣል፤ «ከአንተ» ይህን ሳያሰፋ ያስተላልፋል።
- source_word: εἰσιν
  choice: እንደሆነ
  rationale: ምንም እንኳ የግሪኩ ግስ ብዙ ቁጥር ቢሆንም፣ «ሁሉ» በአማርኛ እንደ አንድ ጥቅል ይዘት ስለሚታይ ነጠላ ቅርጹ ተፈጥሯዊ ነው።
theological_decisions:
- issue: አብ ለወልድ በሰጠው ነገርና በምንጩ መካከል ያለው ግንኙነት
  choice: «አንተ የሰጠኸኝ ሁሉ ከአንተ እንደሆነ» በማለት የምንጭ መግለጫ ሆኖ ተተርጉሟል።
  alternative: «አንተ የሰጠኸኝ ሁሉ ከአንተ እንደሚመጣ»
  rationale: ጥቅሱ ወልድ የተቀበለው ሁሉ ምንጩ አብ መሆኑን ያጎላል፤ ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ማብራሪያ ሳይጨመር የግሪኩ የአመጣጥ ሐሳብ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አውቀዋል» የአሁኑን ውጤታዊ ሁኔታ ይይዛል፤ «ከአንተ እንደሆነ» ደግሞ የምንጭን ሐሳብ በቀጥታ ይገልጣል።
