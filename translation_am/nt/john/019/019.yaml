base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: am
  text: ጲላጦስም ጽሑፍ ጽፎ በመስቀሉ ላይ አኖረው። እንዲህም ተጽፎ ነበር፦ “ኢየሱስ ናዝራዊው፣ የአይሁድ[a] ንጉሥ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የይሁዳ ነዋሪዎች ንጉሥ።” የግሪኩ ቃል እንደ አውዱ በሰፊው አይሁድን ወይም በተለይ የይሁዳን ክልል ነዋሪዎች ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: ጽሑፍ
  rationale: በስቅለት አውድ ይህ ቃል በተፈረደበት ሰው መስቀል ላይ የሚቀመጥን የጽሑፍ ማስታወቂያ ያመለክታል፤ ‘ጽሑፍ’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: በመስቀሉ ላይ አኖረው
  rationale: የግሪኩን ‘በመስቀሉ ላይ’ የሚለውን ግልጽ አቀራረብ ያለ አውዳዊ ጭማሪ ይጠብቃል።
- source_word: ἦν ... γεγραμμένον
  choice: ተጽፎ ነበር
  rationale: የተጠናቀቀው የመጻፍ ተግባር ያስገኘውን የቆየ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ναζωραῖος
  choice: ናዝራዊው
  rationale: ግሪኩ የቦታ ቅጽል/መጠሪያ ቅርጽ ስለሚጠቀም፣ ‘ከናዝሬት’ ከሚል ገላጭ ሐረግ ይልቅ ይህ ቅርጹንና የመለያ ተግባሩን ይጠብቃል።
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: የአይሁድ ንጉሥ
  rationale: በሕማማት ታሪኩ ውስጥ ይህ ሐረግ ሕዝቡን የሚያመለክት ሕዝባዊና ፖለቲካዊ የንግሥና መጠሪያ ሆኖ ቀርቧል፤ በአማርኛም የተለመደውና ግልጹ አተረጓጎም ይህ ነው።
- source_word: δὲ καὶ
  choice: ም
  rationale: ቅጥያው ከቀደመው ትረካ ጋር ያለውን ቀጣይነትና ጭማሪ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ ቅርጽ ነው።
- source_word: Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: σταυροῦ
  choice: መስቀል
  rationale: በወንጌላት የስቅለት ታሪክ ውስጥ σταυρόςን ለመተርጎም መደበኛና አውዳዊ ተገቢነት ያለው ቃል ነው።
