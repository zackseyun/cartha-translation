    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: አንቅደደው
  rationale: ግሱ ጨርቅን መቅደድን ወይም መሰንጠቅን ያመለክታል፤ “መቅደድ” በዘመናዊ አማርኛ ለልብስ ተፈጥሯዊ ነው።
- source_word: αὐτόν
  choice: -ው (አንቅደደው)
  rationale: በሰዋስው ወንድ ጾታ ቢሆንም በዐውዱ ውስጥ ቀደም ሲል የተጠቀሰውን ቀሚስ ያመለክታል።
- source_word: λάχωμεν
  choice: ዕጣ እንጣጣልበት
  rationale: ባለቤቱን በዕጣ መወሰንን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ግልጽና የተለመደ ነው።
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: የማን እንደሚሆን
  rationale: የዕጣው ዓላማ ልብሱ ለማን እንደሚሆን መወሰን መሆኑን ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: የመጽሐፍ ቃል እንዲፈጸም
  rationale: የዮሐንስን የፍጻሜ አገላለጽ ጠብቆ፣ በመለኮታዊ ዓላማና በሰው ድርጊት ግንኙነት ላይ ከጽሑፉ ያለፈ ማብራሪያ አይጨምርም።
- source_word: ἡ γραφή
  choice: የመጽሐፍ ቃል
  rationale: በዐውዱ ቅዱስ መጽሐፍን ያመለክታል፤ “የመጽሐፍ ቃል” በአማርኛ የተለመደና ግልጽ ነው።
- source_word: ἡ λέγουσα
  choice: የሚለው
  rationale: የተጠቀሰውን ጥቅስ ተፈጥሯዊ በሆነ አማርኛ ያስተዋውቃል።
- source_word: Διεμερίσαντο
  choice: ተከፋፈሉ
  rationale: ልብሶቹን በመካከላቸው መከፋፈላቸውን ይገልጣል፤ የጥቅሱን ከፍ ያለ ነገር ግን ግልጽ አነጋገር ይጠብቃል።
- source_word: ἱμάτιά
  choice: ልብሶቼን
  rationale: ብዙ ቁጥሩንና የንብረት አመልካቹን በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἑαυτοῖς
  choice: እርስ በርሳቸው
  rationale: የማከፋፈሉ ተቀባዮች ወታደሮቹ ራሳቸው መሆናቸውን ያሳያል።
- source_word: ἱματισμόν
  choice: ልብሴ
  rationale: ከቀደመው ብዙ ቁጥር “ልብሶቼ” የተለየውን ነጠላ ቁጥር ጠብቆ ያቀርባል።
- source_word: ἔβαλον κλῆρον
  choice: ዕጣ ጣሉ
  rationale: የግሪኩን ነጠላ κλῆρον ይጠብቃል፤ በአማርኛም መደበኛ የዕጣ አገላለጽ ነው።
theological_decisions:
- issue: በወታደሮቹ ድርጊትና በመጽሐፍ ቃል ፍጻሜ መካከል ያለው ግንኙነት (ἵνα ἡ γραφὴ πληρωθῇ)
  choice: “የመጽሐፍ ቃል እንዲፈጸም ሆነ” በማለት የፍጻሜውን አገላለጽ በቀጥታ ማቅረብ
  alternative: “በዚህም የመጽሐፍ ቃል ተፈጸመ” ብሎ እንደ ውጤት ብቻ ማቅረብ፣ ወይም “እንዲፈጸም ዘንድ” የሚል ይበልጥ ቃል በቃል አገላለጽ
  rationale: ἵνα ያለውን ዓላማ/ውጤት የሚያስተናግድ ውጥረት ሳይፈታ ይጠብቃል፤ የመለኮታዊ አወሳሰንን ሁኔታ ከጽሑፉ በላይ አይገልጽም።
