  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: am
  text: ስለዚህ ወታደሮቹ መጥተው የመጀመሪያውን ሰው እግሮችና ከኢየሱስ ጋር የተሰቀለውን ሌላውን ሰው እግሮች ሰበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር ጋር ያለውን የውጤትና የትረካ ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: στρατιῶται
  choice: ወታደሮቹ
  rationale: በዐውዱ ያሉትን የሮም ወታደሮች በግልጽና በተለመደ ቃል ይገልጻል።
- source_word: τοῦ μὲν πρώτου
  choice: የመጀመሪያውን ሰው
  rationale: ግሪኩ ቃል በቃል «የመጀመሪያውን» ቢልም፣ በአማርኛ ተጠቃሹ ሰው መሆኑን ማብራራት ንባቡን ግልጽ ያደርገዋል።
- source_word: κατέαξαν
  choice: ሰበሩ
  rationale: በዚህ የቅጣት አፈጻጸም ዐውድ የግሪኩን «መስበር» ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: τὰ σκέλη
  choice: እግሮች
  rationale: σκέλη በዚህ ዐውድ የሚሰበሩትን እግሮች ያመለክታል፤ የባለቤትነት ግንኙነቱም በአማርኛው አገባብ በግልጽ ተገልጧል።
- source_word: τοῦ ἄλλου
  choice: የሌላውን ሰው
  rationale: ከኢየሱስ ጋር ከተሰቀሉት ሁለት ሰዎች ሁለተኛውን በግልጽ ያመለክታል።
- source_word: συσταυρωθέντος αὐτῷ
  choice: ከኢየሱስም ጋር የተሰቀለውን
  rationale: ተሳቢው ሌላውን ሰው ከኢየሱስ ጋር እንደተሰቀለ ይለያል፤ «ኢየሱስ» ብሎ መግለጽ በአማርኛ የተውላጠ ስሙን ተጠቃሽ ያብራራል።
theological_decisions:
- issue: የαὐτῷ ተጠቃሽ
  choice: ከኢየሱስ ጋር
  alternative: ከመጀመሪያው ሰው ጋር
  rationale: በዮሐንስ የስቅለት ትረካ ሁለቱ ሌሎች ሰዎች በዋናነት ከኢየሱስ ጋር ባላቸው ግንኙነት ይገለጻሉ፤ ስለዚህ ነጠላው ተውላጠ ስም ኢየሱስን ማመልከቱ በዐውዱ ይበልጥ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ሰዋሰዋዊ አወቃቀር በግድ ከመኮረጅ ይልቅ፣ በአማርኛ ግልጽነት ሲባል «ሰው» እና ሁለተኛው «እግሮች» ተጨምረዋል።
