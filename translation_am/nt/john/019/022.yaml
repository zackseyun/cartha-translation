  rationale: የግሪኩ ፍጹም ጊዜ የተጠናቀቀው ድርጊት ውጤት እንደጸና ሊያመለክት ይችላል። ‘ጽፌአለሁ’ ይህን ቀጣይ ውጤት ያሳያል፤ የአማርኛው አገባብ ግን የመጀመሪያውን ግስ በአንጻራዊ ቅርጽ እንዲቀርብ ይጠይቃል።
