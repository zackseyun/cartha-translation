  rationale: በራሱ እንደ ስም የሚሠራውን አንጻራዊ ተውላጠ ስም ‘የጻፍሁትን’ በማለት ተፈጥሯዊ በሆነ የአማርኛ አገባብ ያስተላልፋል።
