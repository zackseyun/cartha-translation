  alternative: “የጻፍሁትን ጻፍሁ”
  rationale: ንግግሩ ጲላጦስ ጽሑፉን ለመለወጥ እንዳልፈለገ የሚያሳይ የጸና መልስ ነው። የአማርኛው ፍጹም አወቃቀር የተጠናቀቀውን ድርጊትና ያለውን ውጤት ያሳያል፤ ከጽሑፉ በላይ ትርጓሜ አይጨምርም።
