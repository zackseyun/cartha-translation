    text: አንድ ሊትራ ወደ 327 ግራም የሚሆን የሮማውያን ፓውንድ ነበር፤ «ወደ መቶ ሊትራ» ማለት በግምት 32–33 ኪሎ ግራም ነው።
    reason: cultural_note
