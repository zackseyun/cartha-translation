- source_word: ἔλαβεν
  choice: ተቀበለ
  rationale: በሰፍነግ የቀረበለትን መጠጥ መቀበሉን በዐውዱ በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: τὸ ὄξος
  choice: የኮመጠጠውን ወይን ጠጅ
  rationale: ὄξος የኮመጠጠ ወይን ጠጅን ወይም የወይን ጠጅ ኮምጣጤን ያመለክታል። “የኮመጠጠ ወይን ጠጅ” ለዘመናዊ አንባቢ ከ“ኮምጣጤ” ይልቅ የመጠጡን ባሕርይ በግልጽ ያቀርባል።
- source_word: Τετέλεσται
  choice: ተፈጸመ
