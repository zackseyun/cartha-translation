base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: am
  text: 'ስለዚህ ኢየሱስ የኮመጠጠውን ወይን ጠጅ[a] ከተቀበለ በኋላ፣ “ተፈጸመ[b]” አለ፤ ራሱንም አዘንብሎ መንፈሱን አሳልፎ ሰጠ[c]።


    [a] ወይም “ኮምጣጤውን” ወይም “የወይን ጠጅ ኮምጣጤውን።” የግሪኩ ὄξος የኮመጠጠ ወይን ጠጅን ያመለክታል።

    [b] ወይም “ተከናውኗል” ወይም “ተጠናቋል።”

    [c] ወይም “የመጨረሻ እስትንፋሱን ተነፈሰ።” የግሪኩ ቃል በቀጥታ “መንፈሱን አሳልፎ ሰጠ” ይላል።'
  philosophy: optimal-equivalence
