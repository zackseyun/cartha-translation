- source_word: κλίνας τὴν κεφαλήν
  choice: ራሱን አዘንብሎ
  rationale: የራስን ወደ ታች ማዘንበል የሚያመለክተውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παρέδωκεν
  choice: አሳልፎ ሰጠ
  rationale: παραδίδωμι በመሠረታዊ ትርጉሙ “አሳልፎ መስጠት” ማለት ነው። ይህ ምርጫ ቃሉን ዝም ብሎ “ሞተ” ብሎ ሳያጠቃልል የሐረጉን ልዩ ክብደት ይጠብቃል።
- source_word: τὸ πνεῦμα
  choice: መንፈሱን
  rationale: πνεῦμα መንፈስን፣ እስትንፋስን ወይም የሕይወት ኃይልን ሊያመለክት ይችላል። “መንፈሱን” የቃሉን ሰፊ ትርጉምና የሐረጉን መንፈሳዊ ክብደት ይጠብቃል፤ ባለቤትነቱም በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα እንደ ተራ የሞት ፈሊጥ ብቻ ይተረጎም ወይስ የግሪኩ የግልና የመንፈስ አገላለጽ ይጠበቅ?
  choice: መንፈሱን አሳልፎ ሰጠ
  alternative: ሞተ፤ የመጨረሻ እስትንፋሱን ተነፈሰ
  rationale: የግሪኩ አገላለጽ ከተራ “ሞተ” የተለየና ዝርዝር ነው። ቀጥተኛውን ሐረግ መጠበቅ የኢየሱስን ሞት በዮሐንስ ትረካ ያለውን ክብደትና የፈቃደኝነት ፍንጭ ይጠብቃል፤ ነገር ግን ከጽሑፉ በላይ የሆነ የኋላ ዘመን ዶክትሪን አያስገባም።
