- source_word: ἀκούσας τῶν λόγων τούτων
  choice: እነዚህን ቃላት በሰማ ጊዜ
  rationale: የግሪኩን የጊዜ አመልካች ተውሳከ ግስ በግልጽ የጊዜ ሐረግ ይተረጉማል፤ λόγοι ደግሞ አሁን የተነገሩትን ቃላት ያመለክታል።
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: ኢየሱስን ወደ ውጭ አወጣው
  rationale: ወደ ውጭ የሆነውን እንቅስቃሴ በተፈጥሯዊና በግልጽ አማርኛ ይገልጣል።
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: በፍርድ ወንበሩ ላይ ተቀመጠ
  rationale: βῆμα በዚህ ዐውድ የባለሥልጣኑን የፍርድ መቀመጫ ያመለክታል። ዋናው ንባብ ጲላጦስ ራሱ እንደተቀመጠ ይወስዳል።
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: “በድንጋይ የተነጠፈ ስፍራ” በሚባለው … ስፍራ
  rationale: Λιθόστρωτον ግልጽ ትርጉም ያለው የግሪክ ስያሜ ስለሆነ ትርጉሙን በአማርኛ ያቀርባል፤ εἰς የድርጊቱን መድረሻ ስፍራ ያመለክታል።
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: በዕብራይስጥ ደግሞ “ገባታ”
  rationale: ዋናው ጽሑፍ ‘በዕብራይስጥ’ የሚለውን ቃል ይጠብቃል፤ δέ ቀላል አያያዥ ሆኖ ‘ደግሞ’ ተብሏል፣ Γαββαθαም እንደ ቦታ ስም በድምፅ ተጽፏል።
theological_decisions:
