base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: am
  text: ስለዚህ ጲላጦስ እነዚህን ቃላት በሰማ ጊዜ ኢየሱስን ወደ ውጭ አወጣው፤ በድንጋይ የተነጠፈ ስፍራ ተብሎ በሚጠራው፣ በዕብራይስጥ ደግሞ ገባታ በሚባለው ቦታ በፍርድ ወንበር ላይ ተቀመጠ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ኢየሱስን በፍርድ ወንበር ላይ አስቀመጠው።» የግሪኩ ግስ ተሻጋሪ ተደርጎ ሊገባ ይችላል፤ ይበልጥ አሳማኙ ትርጉም ግን ጲላጦስ ራሱ በፍርድ ወንበር ላይ እንደተቀመጠ የሚያሳየው ነው።
    reason: alternative_reading
  - marker: b
    text: «በዕብራይስጥ» የሚለው በዮሐንስ ወንጌል በአብዛኛው በአካባቢው ይነገር የነበረውን ሴማዊ ቋንቋ፣ ምናልባትም አራማይክን፣ ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
