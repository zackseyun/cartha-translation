  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: am
  text: ያየውም ሰው መስክሯል፤ ምስክርነቱም እውነት ነው። እርሱም እውነትን እንደሚናገር ያውቃል፤ እናንተም እንድታምኑ ዘንድ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: ያየው ሰው
  rationale: የግሪኩን በስም ፈንታ የቆመ ፍጹም አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ የማየቱን የተፈጸመ ድርጊትና የዓይን ምስክርነት ኃይል ይጠብቃል።
- source_word: μεμαρτύρηκεν
  choice: መስክሯል
  rationale: ፍጹም ጊዜው የተሰጠው ምስክርነት እስካሁን ያለውን ተጽእኖና ተቀባይነት እንዲያሳይ በአማርኛ ፍጹም ቅርጽ ተተርጉሟል።
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: ምስክርነቱ እውነት ነው
  rationale: የምስክርነቱን እውነተኛነትና ታማኝነት በቀጥታና በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐκεῖνος
  choice: እርሱ
  rationale: በአማርኛ የሦስተኛ መደብ አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል፤ ‘ያ ሰው’ የሚለውን ያልተፈለገ ርቀት ወይም ንቀት አያስገባም።
- source_word: οἶδεν
  choice: ያውቃል
  rationale: በቅርጹ ፍጹም ቢሆንም በአገልግሎቱ የአሁን ጊዜ ሁኔታን የሚገልጠውን ግስ ተፈጥሯዊ በሆነ የአሁን ጊዜ አማርኛ ይተረጉማል።
- source_word: ἀληθῆ λέγει
  choice: እውነትን እንደሚናገር
  rationale: የግሪኩን ፈሊጣዊ አገላለጽ ‘እውነተኛ ነገሮችን ይናገራል’ ብሎ በማያስቸግር ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: እናንተ ደግሞ እንድታምኑ
  rationale: ἵνα የሚገልጠውን ዓላማ በ‘እንድታምኑ’፣ καί የሚሰጠውን የማካተት አጽንዖት ደግሞ በ‘ደግሞ’ ይጠብቃል።
theological_decisions:
- issue: በቁጥሩ ውስጥ ያሉት አጽንዖታዊ ተውላጠ ስሞች ማንን እንደሚያመለክቱ
  choice: ምስክሩ ‘ያየው ሰው’ እና ‘እርሱ’ ተብሎ ተተርጉሟል፤ ማንነቱ አልተወሰነም።
  alternative: ተራኪው ስለ ራሱ በሦስተኛ መደብ እየተናገረ ነው፤ ወይም ከተራኪው የተለየ የዓይን ምስክር ነው።
  rationale: የግሪኩ ጽሑፍ ምስክሩን በግልጽ አይለይም፤ ስለዚህ ትርጉሙ የሦስተኛ መደብ አገላለጹን በመጠበቅ አሻሚነቱን አልፈታም።
- issue: የπιστεύητε ገጽታ
  choice: እንድታምኑ
  alternative: ማመናችሁን እንድትቀጥሉ
  rationale: የአሁን ጊዜ ንዑስ አንቀጽ ቀጣይነትን ሊያመለክት ቢችልም፣ በዮሐንስ አጠቃቀም መጀመሪያ ማመንንም ሆነ በማመን መቀጠልን ሊያስችል ይችላል። ዋናው ጽሑፍ ያልተወሰነውን አገላለጽ ይጠቀማል፤ ቀጣይነቱ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የምስክርነት ቃላት ግንኙነት ‘መስክሯል/ምስክርነቱ’ በሚሉ ተዛማጅ ቃላት ተጠብቋል።
