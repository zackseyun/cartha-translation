  text: ስለዚህ የአይሁድ የዝግጅት ቀን ስለነበረ[a]፣ መቃብሩም ቅርብ ስለነበር፣ ኢየሱስን በዚያ አኖሩት።
  philosophy: optimal-equivalence
  footnotes:
