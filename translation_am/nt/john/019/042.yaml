- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ የሚነሳውን ውጤትና ቀጣይነት ይጠብቃል።
- source_word: διὰ τὴν παρασκευὴν
  choice: የዝግጅት ቀን ስለነበረ
  rationale: διά ከተሳቢ ጋር የሚገልጸውን ምክንያት በተፈጥሯዊ አማርኛ ያሳያል፤ παρασκευή ከሰንበት ወይም ከበዓል በፊት ያለውን የዝግጅት ቀን ሊያመለክት ይችላል።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: የግሪኩን የባለቤትነት አገባብ ሳያሰፋ ወይም ሳያጠብ ያስተላልፋል።
- source_word: ὅτι
