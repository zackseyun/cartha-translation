- source_word: ἐγγὺς
  choice: ቅርብ
  rationale: መቃብሩ በአቅራቢያ መሆኑን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μνημεῖον
  choice: መቃብር
  rationale: በዚህ የቀብር አውድ የተዘጋጀውን የቀብር ቦታ በግልጽ ያመለክታል።
- source_word: ἔθηκαν
  choice: አኖሩት
  rationale: የኢየሱስን ሥጋ በመቃብር ውስጥ ማኖራቸውን በአማርኛ የቀብር አውድ ተስማሚ በሆነ መንገድ ይገልጻል።
- source_word: τὸν Ἰησοῦν
  choice: ኢየሱስን
  rationale: የግሱን ቀጥተኛ ተሳቢ በመደበኛው የአማርኛ የስም አጻጻፍ ያቀርባል።
theological_decisions:
- issue: በሕማማት ትረካ ውስጥ παρασκευήን መተርጎም
  choice: የዝግጅት ቀን
  alternative: ዝግጅት
  rationale: ቃሉ የቀን መቁጠሪያ ቴክኒካዊ መጠሪያ ሆኖ ሊሠራ ይችላል። “የዝግጅት ቀን” ለዘመናዊ አንባቢ ግልጽ ሲሆን ጽሑፉ ከሚለው በላይ የተወሰነ የቀን አቆጣጠር ወይም የእምነት ድምዳሜ አያስገባም።
- issue: በዮሐንስ ትረካ ውስጥ τῶν Ἰουδαίωνን መተርጎም
  choice: የአይሁድ የዝግጅት ቀን
  alternative: የአይሁድ ዝግጅት
  rationale: የግሪኩን አገባብ በግልጽ ያሳያል፤ በዚህ አውድ የአይሁድን የዝግጅት ቀን ያመለክታል እንጂ በአይሁድ ሕዝብ ላይ ሥነ መለኮታዊ ፍርድ አይሰጥም።
