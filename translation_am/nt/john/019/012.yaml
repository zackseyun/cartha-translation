  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: am
  text: ከዚያን ጊዜ ጀምሮ[a] ጲላጦስ እርሱን ለመልቀቅ ይሞክር ነበር። አይሁድ[b] ግን እንዲህ ብለው ጮኹ፦ “ይህን ሰው ብትለቅቀው የቄሳር ወዳጅ አይደለህም፤ ራሱን ንጉሥ የሚያደርግ ሁሉ ቄሳርን ይቃወማል።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ምክንያት ጲላጦስ እርሱን ለመልቀቅ ይሞክር ነበር።” ἐκ τούτου የሚለው የግሪክ ሐረግ “ከዚያን ጊዜ ጀምሮ” የሚል የጊዜ ወይም “በዚህ ምክንያት” የሚል የምክንያት ትርጉም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በዮሐንስ ወንጌል “አይሁድ” የሚለው አገላለጽ ብዙ ጊዜ መላውን የአይሁድ ሕዝብ ሳይሆን በተለይ የይሁዳ ባለሥልጣናትን ወይም በትረካው አውድ ውስጥ ያሉ አንዳንድ አይሁዳዊ ተቃዋሚዎችን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በቄሳር ላይ ይናገራል” ወይም “ራሱን ከቄሳር ጋር በተቃራኒ ያቆማል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: ከዚያን ጊዜ ጀምሮ
  rationale: በትረካው ውስጥ ከቀደመው ንግግር በኋላ የቀጠለውን ጊዜ በተፈጥሯዊ አማርኛ ያመለክታል፤ የምክንያት ትርጉሙ በማስታወሻ ተጠብቋል።
- source_word: ἐζήτει ἀπολῦσαι
  choice: ለመልቀቅ ይሞክር ነበር
  rationale: ያልተጠናቀቀው የግስ ጊዜ ቀጣይ ወይም ተደጋጋሚ ሙከራን ያሳያል፤ በፍርድ አውድ ‘መልቀቅ’ ከእስር ነፃ ማድረግን በግልጽ ይገልጣል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪክ ጽሑፉን ሰፊ አገላለጽ ሳያጠብ ‘የአይሁድ መሪዎች’ ብሎ ትርጓሜያዊ ገደብ አያስገባም፤ የአውዱ ማብራሪያ በማስታወሻ ቀርቧል።
- source_word: ἐκραύγασαν λέγοντες
  choice: እንዲህ ብለው ጮኹ
  rationale: ከፍ ባለ ድምፅ የተደረገውን ሕዝባዊ ጩኸትና የቀጥታ ንግግሩን መግቢያ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: φίλος τοῦ Καίσαρος
  choice: የቄሳር ወዳጅ
  rationale: የባለቤትነት መዋቅሩንና በንጉሠ ነገሥቱ ላይ ያለ ፖለቲካዊ ታማኝነትን የሚያስፈራራውን ክስ ይጠብቃል።
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: ራሱን ንጉሥ የሚያደርግ ሁሉ
  rationale: ‘ንጉሥ ነኝ የሚል’ ብሎ ከማቅለል ይልቅ የግሪኩን ቀጥተኛ አገላለጽና ጠንካራ የፖለቲካ ክስ ይጠብቃል።
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: ቄሳርን ይቃወማል
  rationale: በዚህ የፖለቲካና የሕግ አውድ ἀντιλέγω ከቃላዊ መቃወም ባለፈ በቄሳር ላይ መቆምን ያመለክታል፤ ‘ይቃወማል’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በዮሐንስ ወንጌል ‘አይሁድ’ የሚለው ቃል የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘አይሁድ’ የሚለውን የምንጭ ደረጃ አገላለጽ ማቆየት
  alternative: ‘የአይሁድ መሪዎች’ ወይም ‘ይሁዳውያን’ ብሎ ማጥበብ
  rationale: οἱ Ἰουδαῖοι የሚለውን ቃል በትርጉሙ ውስጥ ያልተገለጸ ማጥበብ ሳይጨምር ማቆየት ይገባል፤ አውዱ በተለይ የይሁዳ ባለሥልጣናትን ወይም በትረካው ውስጥ ያሉ ተቃዋሚዎችን ሊያመለክት እንደሚችል በማስታወሻ ተገልጧል።
- issue: ἀντιλέγει የሚለው የፖለቲካ ክስ ስፋት
  choice: ‘ቄሳርን ይቃወማል’
  alternative: ‘በቄሳር ላይ ይናገራል’
  rationale: የግሱን ቃላዊ ገጽታ ብቻ ማጉላት በአውዱ ያለውን የክህደትና የፖለቲካ ተቃውሞ ክስ ሊያዳክም ይችላል፤ የተመረጠው አገላለጽ የግሱን ሰፊ ክልል ይጠብቃል።
