  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: am
  text: እንደገናም ወደ ገዢው መኖሪያና ዋና መሥሪያ ቦታ[a] ገብቶ ኢየሱስን፣ “አንተ ከየት ነህ?” አለው። ኢየሱስ ግን ምንም መልስ አልሰጠውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፕራይቶሪየም”፤ ይህም የሮማዊው ገዢ ይፋዊ መኖሪያ ወይም ዋና መሥሪያ ቦታ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ገብቶ
  rationale: ወደ አንድ ስፍራ መግባትን በተፈጥሯዊ የአማርኛ ትረካ ይገልጻል፤ ከሚከተለው ዋና ግስ ‘አለው’ ጋር በግስ ተውሳክ ተያይዟል።
- source_word: πραιτώριον
  choice: የገዢው መኖሪያና መሥሪያ ግቢ
  rationale: ቃሉ የሮማዊውን ገዢ ይፋዊ መኖሪያና የአስተዳደር ዋና ስፍራ ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተግባሩን ግልጽ ያደርጋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ድርጊቱ መደገሙን በቀጥታና በተለመደ አማርኛ ይገልጻል።
- source_word: λέγει
  choice: አለው
  rationale: በግሪክ ያለው ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል።
- source_word: Πόθεν εἶ σύ
  choice: አንተ ከየት ነህ?
  rationale: ጥያቄው የመጣበትን ስፍራ ወይም ምንጭ ይጠይቃል፤ አገላለጹ ይህን ክፍትነት ሳይዘጋ ተፈጥሯዊ ነው።
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: ምንም መልስ አልሰጠውም
  rationale: ‘መልስ አልሰጠውም’ የሚለው የምንጩን ‘መልስ መስጠት’ የሚል አገላለጽ ይጠብቃል፤ ‘ምንም’ ፍጹም ዝምታውን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የተሰወረው የግስ ባለቤት ማንነት
  choice: ጲላጦስን በስም ሳይጨምር በአማርኛ የተሰወረ ባለቤት ተጠቅሟል።
  alternative: በዋናው ጽሑፍ ‘ጲላጦስም’ ብሎ በግልጽ መጨመር።
  rationale: የግሪኩ ጽሑፍ ባለቤቱን በስም አይጠቅስም፤ አውዱ ግን ጲላጦስ መሆኑን ግልጽ ያደርጋል። አማርኛም የግስ ባለቤትን በተፈጥሮ ሊሰውር ይችላል።
- issue: ‘ከየት’ የሚለው ጥያቄ ስፋት
  choice: ‘አንተ ከየት ነህ?’ ተብሎ የስፍራም ሆነ የጥልቅ ምንጭ ጥያቄ ሊሆን የሚችለው አሻሚነት ተጠብቋል።
  alternative: ‘መነሻህ ከየት ነው?’ ብሎ ትርጉሙን በግልጽ ወደ ምንጭ ማዘንበል።
  rationale: Πόθεν ተራ የትውልድ ወይም የመጣበትን ስፍራ ሊጠይቅ ይችላል፤ በዮሐንስ አውድ ደግሞ የኢየሱስን ጥልቅ መነሻ ሊያመለክት ይችላል። ትርጉሙ ሁለቱንም እድሎች ክፍት ይተዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘መኖሪያና መሥሪያ ግቢ’ የሮማዊውን ተቋም ተግባር ያብራራል፤ ታሪካዊው ቃል በማስታወሻ ተጠብቋል።
