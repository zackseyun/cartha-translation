  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: am
  text: ከዚያም ደቀ መዝሙሩን፣ “እነሆ፣ እናትህ!” አለው። ከዚያችም ሰዓት ጀምሮ ደቀ መዝሙሩ ወደ ቤቱ ወሰዳት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: እነሆ
  rationale: የማሳየትና ትኩረትን የመጥራት ኃይል ያለውን የግሪክ ትእዛዝ በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: εἰς τὰ ἴδια
  choice: ወደ ቤቱ
  rationale: ቃል በቃል ‘ወደ ራሱ ነገሮች/ወዳለው’ የሚለው አገላለጽ በዚህ ዐውድ ወደ ራሱ ቤትና እንክብካቤ መቀበልን ያመለክታል፤ ‘ወደ ቤቱ’ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: ከዚያች ሰዓት ጀምሮ
  rationale: ድርጊቱ ከዚያኑ ጊዜ እንደጀመረ የሚገልጠውን የጊዜ መነሻ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: “እናትህ” የሚለው አነጋገር ወሰን
  choice: ጽሑፉን ብቻ በቀጥታ “እናትህ” ብሎ ማቅረብ
  alternative: መንፈሳዊ ወይም ቤተ እምነታዊ እናትነትን በትርጉሙ ውስጥ በግልጽ መጨመር
  rationale: የግሪክ ጽሑፍ ግንኙነቱን ከዚህ በላይ አይተረጉምም፤ ስለዚህ ትርጉሙ የእምነት ትርጓሜን አይጨምርም።
- issue: ἔλαβεν αὐτὴν የሚያመለክተው ተግባር
  choice: “ወደ ቤቱ ወሰዳት”
  alternative: “እንደ እናቱ ተቀበላት” ወይም “ሊንከባከባት ወሰዳት”
  rationale: እንክብካቤ በዐውዱ ሊገባ ቢችልም፣ ጽሑፉ በቀጥታ የሚለው እርሷን ወደ ራሱ መውሰዱን ነው፤ ተጨማሪውን ትርጓሜ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። “ደቀ መዝሙር” በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ቃል ስለሆነ ተጠብቋል።
