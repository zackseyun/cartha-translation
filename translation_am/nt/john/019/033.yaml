  verdict: revise
  source_fidelity: The draft accurately represents the temporal/contrastive participial opening, the causal force of ὡς εἶδον, ἤδη (“already”), Jesus’ death, and the soldiers’ not breaking his legs. A small adjustment can better express τεθνηκότα as the continuing state resulting from death.
  naturalness: The sentence is generally fluent modern standard Amharic. “ሞቶ እንደነበር” is slightly more idiomatic in this context than “እንደሞተ” and better conveys the perfect participle’s resultant state. The cross-reference footnote marker should attach to the action of not breaking the legs, rather than to the arrival at Jesus.
  terminology: “ኢየሱስ,” “እግሮቹን,” and “አልሰበሩም” are accurate, natural, and appropriately restrained. The footnote’s Scripture quotation is made more idiomatic without importing its fulfillment claim into the verse’s main text.
  issues:
  - severity: low
    issue: Footnote [a] is anchored after “በመጡ ጊዜ.”
    rationale: Its content concerns the later scriptural connection to the soldiers’ action of not breaking Jesus’ legs. Moving it to the end of that action makes the anchor’s referent clear.
  - severity: low
    issue: “እንደሞተ” can sound like a simple prior event.
    rationale: The Greek perfect participle τεθνηκότα includes the resulting state, “being dead.” “ሞቶ እንደነበር” naturally retains that sense in Amharic.
  - severity: low
    issue: The footnote quotation “ከአጥንቶቹ አንዱ እንኳ” is less idiomatic.
    rationale: “ከአጥንቶቹ አንድም” is the more natural Amharic formulation for “not one of his bones.”
