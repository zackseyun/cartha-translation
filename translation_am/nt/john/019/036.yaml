  terminology: Use “መጽሐፍ ቅዱስ” for ἡ γραφή. The citation should retain the Greek singular “አጥንት,” while “አንድም” naturally expresses the comprehensive negation.
  issues:
  - severity: medium
    issue: The explanatory force of γάρ is not explicit.
