  - severity: medium
    issue: “የመጽሐፍ ቃል” is an imprecise rendering of ἡ γραφή.
    rationale: ἡ γραφή refers to Scripture, not merely to a word belonging to a book. “መጽሐፍ ቅዱስ” is clearer and standard in modern Amharic.
  - severity: low
    issue: The footnote’s literal Greek citation omits the possessive relationship clearly conveyed by αὐτοῦ.
    rationale: “የእርሱ አጥንት” is acceptable, but the note should explicitly identify the singular Greek noun and explain the idiomatic Amharic comprehensive negative.
