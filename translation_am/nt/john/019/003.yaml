    text: በቀጥታ “ደስ ይበልህ!” ማለት ነው፤ እዚህ ግን እንደ ሰላምታ የተነገረ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: ወደ እርሱም እየቀረቡ … ይሉት ነበር
  rationale: የሁለቱን የግሪክ ያልተፈጸመ ጊዜ ግሶች ቀጣይነትና ድግግሞሽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Χαῖρε
  choice: ሰላም ለአንተ
  rationale: በዚህ አውድ ቃሉ መደበኛ የሰላምታ እና የንጉሣዊ ክብር አገላለጽ ሲሆን፣ በወታደሮቹ አነጋገር ግን የማፌዝ ኃይል አለው።
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: የአይሁድ ንጉሥ ሆይ
  rationale: ማዕረጉን በቀጥታ ይተረጉማል፤ የጥሪውንም ቅርጽ በአማርኛ ያሳያል።
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: በጥፊም ይመቱት ነበር
  rationale: ῥαπίσματα የእጅ ምቶችን ወይም ጥፊዎችን ያመለክታል፤ አገላለጹም የግሱን ተደጋጋሚ ድርጊት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ወታደሮቹ ለኢየሱስ ያቀረቡት ሰላምታ ቃና
  choice: እንደ ንጉሥ የሚሰጥ ሰላምታ ሆኖ በማፌዝ ቃና እንዲሰማ ተተርጉሟል።
  alternative: ገለልተኛ የሆነ “ሰላም፣ የአይሁድ ንጉሥ” የሚል አተረጓጎም።
  rationale: የሕማማት ትረካው አውድና ከሰላምታው ጋር የተያያዘው ድብደባ ሰላምታው የማፌዝ መሆኑን ያሳያሉ፤ ትርጉሙ ግን ይህን በማብራሪያ ሳይጨምር ከአውዱ እንዲታወቅ ያደርጋል።
