  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የአሳታፊ አወቃቀር ትርጉሙንና ቅደም ተከተሉን ሳያጣ በተነባቢ አማርኛ ተደርድሯል።
