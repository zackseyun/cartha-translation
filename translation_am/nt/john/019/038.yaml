  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: am
  text: ከእነዚህ በኋላ፣ ከአርማትያ የመጣው ዮሴፍ፣ የኢየሱስ ደቀ መዝሙር የነበረው ነገር ግን አይሁድን[a] በመፍራት በምስጢር ደቀ መዝሙር የነበረው፣ የኢየሱስን አካል እንዲወስድ ጲላጦስን ለመነው። ጲላጦስም ፈቀደለት። ስለዚህ መጥቶ አካሉን ወሰደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚህ አውድ ይህ ቃል በተለይ “የይሁዳ ወይም የአይሁድ ባለሥልጣናትን” ሊያመለክት ይችላል። ዮሐንስ “አይሁድ” የሚለውን ቃል ብዙ ጊዜ ኢየሱስን ለሚቃወሙት ሲጠቀምበት እንጂ፣ ያለ ልዩነት የአይሁድን ሕዝብ በሙሉ ለማመልከት አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ከዚህ በኋላ
  rationale: የጊዜውን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ የብዙ ቁጥር ταῦτα በአማርኛ በዚህ ቋሚ አነጋገር በተገቢ ሁኔታ ይወከላል።
- source_word: ἀπὸ Ἁριμαθαίας
  choice: የአርማትያስ ሰው
  rationale: ἀπό የቦታ መገኛን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ከአርማትያስ መሆኑን ተፈጥሯዊ በሆነ መንገድ ያስረዳል።
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: የኢየሱስ ደቀ መዝሙር የነበረው
  rationale: የአሁን ጊዜ አሳታፊውን በተፈጥሯዊ የአማርኛ የገላጭ ሐረግ ይወክላል፤ μαθητής በተለመደው መጽሐፍ ቅዱሳዊ ቃል ‘ደቀ መዝሙር’ ተተርጉሟል።
- source_word: κεκρυμμένος
  choice: ደቀ መዝሙርነቱን ደብቆ የኖረው
  rationale: በግሪኩ ያልተገለጸው ነገር ግን ከአውዱ የሚታወቀው የተደበቀው ደቀ መዝሙርነቱ መሆኑን ግልጽ ያደርጋል፤ ፍጹም አሳታፊው የቆየ ሁኔታ መሆኑን ‘የኖረው’ ያንጸባርቃል።
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: አይሁድን በመፍራት
  rationale: የምክንያትን ግንኙነት በግልጽና ተፈጥሯዊ አማርኛ ያሳያል፤ Ἰουδαίων በዋናው ጽሑፍ ሳይጠብ ተጠብቋል።
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: የኢየሱስን ሥጋ እንዲወስድ
  rationale: የἵνα ዓላማ/የጥያቄ ይዘትን ‘እንዲ-’ በሚለው አወቃቀር ያቀርባል፤ αἴρω በዚህ አውድ ከመስቀል አውርዶ ለቀብር መውሰድን ያመለክታል።
- source_word: ἐπέτρεψεν
  choice: ፈቀደለት
  rationale: ፈቃድ መስጠትን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ተቀባዩም በ‘ለት’ ተወክሏል።
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: ስለዚህ መጥቶ ሥጋውን ወሰደ
  rationale: οὖν ያለውን ውጤታዊ ሽግግር ‘ስለዚህ’ ይወክላል፤ ἦρεν ከቀደመው ἄρῃ ጋር በ‘ወሰደ’ በቃላዊ ወጥነት ተተርጉሟል፣ αὐτοῦም በ‘ሥጋውን’ ተጠብቋል።
theological_decisions:
- issue: በዮሐንስ ወንጌል τῶν Ἰουδαίων የሚያመለክተውና አተረጓጎሙ
  choice: በዋናው ጽሑፍ ‘አይሁድ’ ብሎ ማቆየትና በማስታወሻ የአውዱን የበለጠ የተወሰነ ፍቺ ማብራራት
  alternative: ‘የአይሁድ መሪዎች’ ወይም ‘የይሁዳ ሰዎች’
  rationale: የግሪኩ ጽሑፍ በቀጥታ ‘አይሁድ’ ይላል፤ ትርጉሙን በዋናው ጽሑፍ ሳያጠብ የአውዱን ውስብስብነት መጠበቅ ተገቢ ነው። ሆኖም ይህ ለአይሁድ ሕዝብ በሙሉ እንደሚያመለክት እንዳይሳሳት ማስታወሻው በዚህ አውድ በተለይ ኢየሱስን የተቃወሙ የአይሁድ/የይሁዳ ባለሥልጣናትን ሊያመለክት እንደሚችል ያብራራል።
