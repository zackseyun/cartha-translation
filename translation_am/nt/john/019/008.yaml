id: JHN.19.8
reference: John 19:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: am
  text: ጲላጦስም ይህን ንግግር በሰማ ጊዜ፣ ይበልጥ ፈራ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: በሰማ ጊዜ
  rationale: የጲላጦስን ምላሽ ያስከተለውን ጊዜያዊ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὖν
  choice: -ም
  rationale: የትረካውን ቀጣይነትና ከቀደመው ንግግር ጋር ያለውን ትስስር በቀላሉ ያሳያል፤ ግልጽ የምክንያት ትርጉም አይጭንም።
- source_word: ἤκουσεν
  choice: በሰማ
  rationale: ከሌሎች የተነገረውን መረጃ መቀበሉን በተፈጥሯዊ የትረካ አገላለጽ ያቀርባል።
- source_word: ὁ Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ አጻጻፍ ነው።
- source_word: τοῦτον τὸν λόγον
  choice: ይህን ንግግር
  rationale: λόγος እዚህ አንዲትን ቃል ሳይሆን በቁጥር 7 የተነገረውን ሐሳብ ወይም መግለጫ ያመለክታል። ‘ንግግር’ ይህን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μᾶλλον
  choice: ይበልጥ
  rationale: ከቀድሞው የፍርሃት ሁኔታ ጋር ሲነጻጸር ፍርሃቱ መጨመሩን በትክክል ያሳያል።
- source_word: ἐφοβήθη
  choice: ፈራ
  rationale: የጲላጦስን ሥነ ልቦናዊ ምላሽ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል፤ ‘ይበልጥ’ ደግሞ ፍርሃቱ መጨመሩን ያሳያል።
theological_decisions:
- issue: የጲላጦስ ፍርሃት ባሕርይ
  choice: ፍርሃቱ እንደጨመረ ብቻ በቀጥታ መግለጽ
  alternative: ፍርሃቱን ፖለቲካዊ፣ አጉል እምነታዊ ወይም መለኮታዊ አንድምታ ያለው ብሎ መወሰን
  rationale: የግሪክ ጽሑፉ የፍርሃቱን ምክንያት በዝርዝር አይወስንም፤ ስለዚህ ትርጉሙ የትረካውን አሻሚነትና ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አጭር የትረካ አወቃቀር ተጠብቋል።
