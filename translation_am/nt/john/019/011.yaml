  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: am
  text: ኢየሱስም እንዲህ ሲል መለሰለት፦ “ከላይ[a] ባይሰጥህ ኖሮ በእኔ ላይ ምንም ሥልጣን አይኖርህም ነበር። ስለዚህ ለአንተ አሳልፎ የሰጠኝ[b] የበለጠ ኃጢአት አለበት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከሰማይ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል በቀጥታ “ከላይ” ይላል፤ በዮሐንስ ወንጌል ብዙ ጊዜ መለኮታዊ ምንጭን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ኢየሱስን አሳልፎ የሰጠው ማን እንደሆነ በዚህ ጥቅስ በግልጽ አልተጠቀሰም። አንዳንዶች ይሁዳን፣ ሌሎች ቀያፋን፣ ወይም የአይሁድን መሪዎች በአጠቃላይ እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: በዐውደ ንባቡ የጲላጦስን የፍርድና የአስተዳደር ሥልጣን በተፈጥሯዊ አማርኛ ያመለክታል፤ “ኃይል” የጉልበት ችሎታን ብቻ ሊያሰማ ይችላል።
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: በእኔ ላይ ምንም
  rationale: κατά ከἐξουσία ጋር በዚህ የፍርድ ዐውድ “በእኔ ላይ” ተብሎ ተፈጥሯዊ ሆኖ ይተረጎማል፤ “ምንም” የοὐδεμίανን አጽንዖት ይጠብቃል።
- source_word: δεδομένον σοι
  choice: ባይሰጥህ ኖሮ
  rationale: የተሰጠው ሥልጣን ከጲላጦስ የአሁኑ ድርጊት በፊት መሆኑንና የሁኔታውን አንቀጽ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἄνωθεν
  choice: ከላይ
  rationale: የግሪኩን ቃል ቀጥተኛ ትርጉምና በዮሐንስ ዘንድ ያለውን መለኮታዊ ምንጭ ጠቋሚነት ይጠብቃል፤ “ከሰማይ” በዋናው ጽሑፍ ትርጓሜውን ከሚገባው በላይ ይወስናል።
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የሐረጉን ምክንያታዊና ድምዳሜያዊ ግንኙነት በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὁ παραδούς μέ σοι
  choice: ለአንተ አሳልፎ የሰጠኝ
  rationale: በሕማማት ታሪኩ ውስጥ ያለውን የπαραδίδωμι ትርጉም ይጠብቃል፤ ግለሰቡን በስም ባለመጥቀስ የግሪኩን አሻሚነት አይፈታም።
- source_word: μείζονα ἁμαρτίαν
  choice: የበለጠ ኃጢአት
  rationale: በተዋናዮቹ መካከል ያለውን የተጠያቂነት ደረጃ ንጽጽር በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ἄνωθεν የሚያመለክተው የጲላጦስ ሥልጣን ምንጭ
  choice: “ከላይ” ተብሎ ተተርጉሞ መለኮታዊ ምንጩ እንዲጠቆም ተደርጓል፤ ከዚህ ክስተት ባለፈ ስለ ፖለቲካዊ ሥልጣን አጠቃላይ ትምህርት አልተጨመረም።
  alternative: “ከሰማይ” ወይም በአጠቃላይ “ከከፍተኛ ምንጭ”
  rationale: ጥቅሱ የጲላጦስን ሥልጣን ከላይ ከሆነ ምንጭ ጋር ያያይዛል፤ ትርጉሙ ግን ጽሑፉ ያልገለጠውን ሰፊ የፖለቲካ ሥነ መለኮት አያክልም።
- issue: ὁ παραδούς μέ σοι የሚያመለክተው ማንነት
  choice: “ለአንተ አሳልፎ የሰጠኝ” ተብሎ ማንነቱ ሳይወሰን ቀርቷል።
  alternative: ይሁዳ፣ ቀያፋ፣ ወይም የአይሁድ መሪዎች በጋራ
  rationale: የግሪኩ ጽሑፍ ግለሰቡን እዚህ በግልጽ አይለይም፤ አጠቃላይ አተረጓጎሙ እውነተኛውን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ጥቅም ላይ ውሏል። “ሥልጣን፣” “አሳልፎ የሰጠኝ፣” እና “ኃጢአት” የሚሉት ቃላት የፍርድና የሥነ መለኮት ክብደቱን ሳያጡ ተፈጥሯዊ ንባብን ይሰጣሉ። የማስታወሻ ምልክቶቹ ከሚመለከታቸው ቃላት ጋር ተያይዘዋል።
