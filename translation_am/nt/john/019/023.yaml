  verdict: revise
  source_fidelity: 'The draft correctly distinguishes the outer garments (ἱμάτια) from the tunic (χιτών), retains the sequence after Jesus’ crucifixion, and renders the tunic as without seams and woven from the top throughout. However, “ከሰቀሉ” leaves the object unexpressed and can mean simply ‘hung’; adding “በመስቀል” and the object suffix makes crucifixion explicit. The wording for making four portions is also grammatically and idiomatically deficient: “አራት ክፍል አደረጓቸው” should be a division into four portions.'
  naturalness: The revised wording uses natural modern standard Amharic. “በአራት ክፍሎች ከፈሏቸው” is clear and idiomatic, while “በአንድ ሙሉ ተሸምኖ” conveys the continuous, whole-garment sense without the potentially abstract wording “በአንድነት.”
  terminology: “የውጭ ልብሶቹ” and “የውስጥ ቀሚሱ” appropriately preserve the contextual distinction between ἱμάτια and χιτών. “ስፌት የሌለው” accurately renders ἄραφος. No symbolic interpretation is introduced.
  issues:
