    issue: The phrase “ኢየሱስን ከሰቀሉ በኋላ” does not explicitly state crucifixion and omits the expected object suffix on the verb.
    rationale: The Greek verb ἐσταύρωσαν specifically denotes crucifixion. “በመስቀል ከሰቀሉት” is precise, natural, and preserves the stated action.
  - severity: medium
    issue: “አራት ክፍል አደረጓቸው” is unidiomatic and uses a singular noun where plural portions are required.
    rationale: ἐποίησαν τέσσαρα μέρη means that they made/divided the garments into four portions. “በአራት ክፍሎች ከፈሏቸው” expresses this clearly.
  - severity: low
    issue: “ሙሉው በአንድነት የተሸመነ” is less natural and “በአንድነት” can sound abstract.
    rationale: “ከላይ ጀምሮ በአንድ ሙሉ የተሸመነ” directly describes the garment’s one-piece construction and its extent.
