review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the additional scriptural citation and the piercing. However, Ὄψονται with εἰς is more faithfully represented by a directed-looking verb than by the broader ያዩታል (“they will see him”).
  naturalness: The current wording is understandable, but placing the citation before ይላል and using a comma makes the Amharic citation formula less smooth. Introducing the quotation with እንዲህ ይላል፤ is natural modern formal Amharic.
  terminology: የቅዱስ መጽሐፍ ክፍል is an appropriate modern rendering of ἑτέρα γραφή in this context. ወጉ is suitable for ἐξεκέντησαν. The revised wording retains the Johannine form without importing wording from Zechariah’s Hebrew text.
  issues:
  - severity: medium
    issue: ያዩታል underrepresents the directed force of Ὄψονται εἰς.
    rationale: Although “see” is possible lexically, the construction here denotes looking toward/on a person. ይመለከታሉ more clearly preserves this force.
  - severity: low
    issue: The citation formula and punctuation are awkward in the current word order.
    rationale: In Amharic, እንዲህ ይላል፤ naturally introduces a direct quotation and avoids interrupting the formula with the quotation before the verb.
  - severity: medium
    issue: The footnote alternative, “ወደ ወጉት ይመለከታሉ,” is grammatically incomplete/unnatural.
    rationale: After ወደ, the relative expression needs an explicit nominal head, such as የወጉት ሰው, or a pronoun. The revision retains both the directional alternative and the pierced-person reference.
  revised_text: ደግሞ ሌላ የቅዱስ መጽሐፍ ክፍል እንዲህ ይላል፤ “የወጉትን ይመለከታሉ።”[a]
