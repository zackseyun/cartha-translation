revisions:
- from: ደግሞም ሌላ የቅዱስ መጽሐፍ ክፍል፣ “የወጉትን ያዩታል” ይላል።[a]
  to: ደግሞ ሌላ የቅዱስ መጽሐፍ ክፍል እንዲህ ይላል፤ “የወጉትን ይመለከታሉ።”[a]
  rationale: The revision uses ይመለከታሉ to preserve the directional sense of Ὄψονται εἰς while retaining the explicit relative object “the one whom they pierced.” It also regularizes the Amharic citation formula and repairs the grammatical incompleteness of the alternative rendering in the footnote. No theological expansion has been introduced.
