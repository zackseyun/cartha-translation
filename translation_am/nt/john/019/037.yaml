  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: am
  text: ደግሞ ሌላ የቅዱስ መጽሐፍ ክፍል እንዲህ ይላል፤ “የወጉትን ይመለከታሉ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ የወጉት ሰው ይመለከታሉ።” የግሪኩ አገላለጽ ‘የወጉትን ይመለከታሉ’ ወይም ‘ወደ የወጉት ሰው ይመለከታሉ’ ተብሎ ሊተረጎም ይችላል፤ ቃላቱም ዘካርያስ 12፥10ን ያስተጋባሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ደግሞም
  rationale: ተጨማሪ የቅዱስ መጽሐፍ ጥቅስ መቅረቡን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἑτέρα γραφή
  choice: ሌላ የቅዱስ መጽሐፍ ክፍል
  rationale: γραφή ቅዱስ መጽሐፍን የሚያመለክት ሲሆን፣ ἑτέρα ደግሞ ተጨማሪ የመጽሐፍ ምስክር መሆኑን ያሳያል፤ ‘ክፍል’ ማለት እዚህ የሚናገረው አንድ ጥቅስ ወይም ምንባብ መሆኑን በተፈጥሯዊነት ያስረዳል።
- source_word: λέγει
  choice: ይላል
  rationale: በግሪኩ ያለውን የአሁን ጊዜ የጥቅስ መግቢያ ይጠብቃል።
- source_word: Ὄψονται
  choice: ያዩታል
  rationale: ወደ ተወሰነው ሰው የሚመራ እይታን የሚገልጽ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: εἰς ὃν
  choice: የወጉትን
  rationale: የአማርኛው የተሳቢ ቅጥያ ‘-ን’ የእይታውን አቅጣጫና የግል ተሳቢውን በአጭርና ተፈጥሯዊ መንገድ ያስቀምጣል፤ ወደ እርሱ የመመልከት ንባብም በማስታወሻ ተጠብቋል።
- source_word: ἐξεκέντησαν
  choice: የወጉትን
  rationale: ‘ወጉ’ የመብሳትን ድርጊት በግልጽ ይገልጻል፣ ከስቅለቱ አውድና ከትንቢታዊው ጥቅስ ጋርም ይስማማል።
theological_decisions:
- issue: የዘካርያስን 12፥10 ጥቅስ የዮሐንስን ክርስቶሳዊ አጽንዖት ሳያጠፋና ከዕብራይስጥ ወይም ከሰብዓ ሊቃናት ትርጉም ተጨማሪ ቃላትን ሳያስገባ መተርጎም
  choice: የወጉትን ያዩታል
  alternative: ወደ ወጉት ይመለከታሉ
  rationale: ትርጉሙ የዮሐንስን የግሪክ አገላለጽ ይከተላል፣ የተወጋውንም ሰው በዐውዱ ከኢየሱስ ጋር እንዲታወቅ ይተዋል። ከዘካርያስ የመጀመሪያ ሰው መለኮታዊ አገላለጽን ወደ ዮሐንስ ጽሑፍ አያስገባም፤ εἰς የሚያስችለውን ‘ወደ’ ንባብ ግን በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የቅዱስ መጽሐፍ ክፍል’ የጥቅስ መግቢያውን በተፈጥሯዊነት ያቀርባል።
