  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: am
  text: ስለዚህ ከአይሁድ ብዙዎች ይህን ጽሑፍ አነበቡት፤ ኢየሱስ የተሰቀለበት ቦታ ከከተማይቱ ቅርብ ነበርና። ጽሑፉም በዕብራይስጥ[a]፣ በላቲንና በግሪክ ተጽፎ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአራማይስጥ»። ዮሐንስ «ዕብራይስጥ» የሚለውን ቃል ለአካባቢው ሴማዊ ቋንቋ ሊጠቀምበት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: ጽሑፍ
  rationale: በዚህ የስቅለት አውድ ቃሉ ከኢየሱስ በላይ የተለጠፈውን የጽሑፍ ማስታወቂያ ያመለክታል፤ «ጽሑፍ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: ከአይሁድ ብዙዎች
  rationale: የግሪኩን ከአንድ ስብስብ ከፊሉን የሚያመለክት አገባብ ይጠብቃል፤ ስለ አይሁድ ሁሉ አጠቃላይ ንግግር አያደርግም።
- source_word: ἀνέγνωσαν
  choice: አነበቡት
  rationale: ቀላል የማንበብ ድርጊትን ይገልጣል፤ ጮክ ብለው እንዳነበቡ የሚያስገድድ ምልክት በምንጩ የለም።
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: ቦታ ለከተማይቱ ቅርብ ነበር
  rationale: የግሪኩን ቀጥተኛ ትርጉም በተፈጥሯዊ አማርኛ ይሰጣል፤ «ለከተማይቱ» የታወቀችውን ኢየሩሳሌምን ያመለክታል እንጂ በምንጩ የሌለውን «በር» አይጨምርም።
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: ኢየሱስ የተሰቀለበት
  rationale: የግሪኩን ተደራጊ አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ ሐረግ ያቀርባል፤ ፈጻሚዎቹን አይጨምርም።
- source_word: γεγραμμένον
  choice: ተጽፎ ነበር
  rationale: ጽሑፉ ተጽፎ የነበረበትን ውጤታዊ ሁኔታ በግልጽ አማርኛ ያስተላልፋል።
- source_word: Ἑβραϊστί
  choice: በዕብራይስጥ
  rationale: የግሪኩን ግልጽ አጠራር በዋናው ጽሑፍ ይጠብቃል፤ በዮሐንስ አጠቃቀም አራማይስጥን ሊያመለክት የሚችለው አማራጭ በግርጌ ማስታወሻ ቀርቧል።
- source_word: Ῥωμαϊστί
  choice: በላቲን
  rationale: ቃሉ በቀጥታ «በሮማውያን ቋንቋ» የሚል ቢሆንም የሚያመለክተው የላቲን ቋንቋን ነው፤ «በላቲን» ግልጽና የተለመደ ነው።
- source_word: Ἑλληνιστί
  choice: በግሪክ
  rationale: የቋንቋውን ስም ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር ጋር ያለውን ትረካዊና ምክንያታዊ ትስስር ያሳያል።
theological_decisions:
- issue: በዮሐንስ አጠቃቀም Ἑβραϊστί እንዴት እንደሚተረጎም
  choice: በዋናው ጽሑፍ «በዕብራይስጥ»
  alternative: «በአራማይስጥ»
  rationale: የግሪክ ምንጩ «ዕብራይስጥ» ይላል፤ የምንጭ ቋንቋውን ቃል በዋናው ጽሑፍ መጠበቅ ተገቢ ነው። ሆኖም ቃሉ በዚያ ዘመን የአካባቢውን ሴማዊ ቋንቋ፣ ምናልባትም አራማይስጥን፣ ሊያመለክት ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
