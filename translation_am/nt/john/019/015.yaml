id: JHN.19.15
reference: John 19:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: am
  text: እነዚያም፣ “አስወግደው! አስወግደው! ስቀለው!” ብለው ጮኹ። ጲላጦስም፣ “ንጉሣችሁን ልስቅል?” አላቸው። የካህናት አለቆችም፣ “ከቄሳር በቀር ንጉሥ የለንም” ብለው መለሱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: ስለዚህ እነርሱ ... ብለው ጮኹ
  rationale: οὖν የውጤት ወይም የትረካ ቅደም ተከተልን ያሳያል፤ ἐκεῖνοι ያለውን አጽንዖት “እነርሱ” ያቆያል፤ ἐκραύγασαν ደግሞ ከፍ ባለ ድምፅ መጮኽን ያመለክታል።
- source_word: Ἆρον ἆρον
  choice: አስወግደው! አስወግደው!
  rationale: በዚህ የፍርድ አውድ የተደገመው ትእዛዝ እርሱን ከፊታቸው እንዲያስወግዱ የሚጠይቅ ኃይለኛ ጩኸት ነው፤ ዐውዱ የሚያመለክተው ተሳቢ በአማርኛ ግስ ውስጥ ተገልጿል።
- source_word: σταύρωσον αὐτόν
  choice: ስቀለው
  rationale: በሮማውያን የሞት ቅጣት አውድ σταυρόω በትክክል “መስቀል” ነው።
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: ንጉሣችሁን ልስቀለውን?
  rationale: የጲላጦስን አጽንዖትና ምጸት በመጠበቅ፣ የውይይታዊውን ንዑስ አንቀጽ በተፈጥሯዊ የአማርኛ ጥያቄ ያቀርባል።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ቁጥሩ በዚህ አውድ የካህናትን መሪ ባለሥልጣናት ያመለክታል።
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: ከቄሳር በቀር ንጉሥ የለንም
  rationale: εἰ μὴ ያለውን የማግለያ ትርጉም “ከ... በቀር” በግልጽ ይገልጻል፣ የንግግሩንም ፍጹም የፖለቲካ ታማኝነት አቋም ሳያለዝብ ያቆያል።
theological_decisions:
- issue: የካህናት አለቆች ስለ ንጉሣዊ ታማኝነት ያደረጉት መግለጫ
  choice: ከቄሳር በቀር ንጉሥ የለንም
  alternative: ቄሳር ብቻ ነው ንጉሣችን
  rationale: የመነሻውን የማግለያ አገባብና በትረካው ውስጥ ያለውን ከባድ ውጥረት በቀጥታ ይጠብቃል፤ ከጽሑፉ ባለፈ ሰፊ ሥነ መለኮታዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። የተደገመው አጭር ትእዛዝ የሕዝቡን ጩኸት ኃይል ያቆያል። በቀረበው የእንግሊዝኛ ማስታወሻ ውስጥ [a] የሚለው ምልክት ከማስታወሻው ጽሑፍ ጋር አይዛመድም፤ ማስታወሻው “except/but Caesar” የሚለውን አማራጭ የሚመለከት ሆኖ ምልክቱ ከ“cried out” በኋላ ተቀምጧል። የግሪክ ምንጩ በዚህ ትርጉም ላይ አስፈላጊ የግርጌ ማስታወሻ ስለማያስገድድ፣ የተሳሳተው ምልክት አልተካተተም።
