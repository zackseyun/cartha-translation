  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: am
  text: መስቀሉን ራሱ ተሸክሞ፣ በዕብራይስጥ[a] ጎልጎታ ወደሚባለው የራስ ቅል ስፍራ ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአራማይክ።» ዮሐንስ «በዕብራይስጥ» ሲል በይሁዳ ይነገር የነበረውን የአካባቢውን ሴማዊ ቋንቋ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: ተሸክሞ
  rationale: ቃሉ አንድን ነገር በአካል መሸከምን ያመለክታል፤ «ተሸክሞ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: αὑτῷ τὸν σταυρόν
  choice: መስቀሉን ራሱ
  rationale: የግሪኩን አንጸባራቂ አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል፤ ኢየሱስ መስቀሉን ራሱ እንደተሸከመ ያሳያል፣ ነገር ግን ያልተገለጸ ተጨማሪ ባለቤትነትን አያስገባም።
- source_word: σταυρός
  choice: መስቀል
  rationale: በሕማማቱ አውድ ውስጥ የግሪኩ መደበኛና የታወቀ አቻ ነው፤ «የመስቀል አግዳሚ እንጨት» የሚለውን ጠባብ ትርጉም ጽሑፉ አያስገድድም።
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: የግሪኩን «ወደ ውጭ ሄደ» የሚል ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: የራስ ቅል ስፍራ ወደሚባለው
  rationale: Κρανίον የሰውነትን የራስ ቅል ያመለክታል፤ ሐረጉም የቦታ ስም መሆኑን እያሳየ የግሪኩን ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: Ἑβραϊστί
  choice: በዕብራይስጥ
  rationale: ዋናው ጽሑፍ የግሪኩን ግልጽ አጠራር ይከተላል፤ ቃሉ የአካባቢውን ሴማዊ ቋንቋ፣ ምናልባትም አራማይክን፣ ሊያመለክት የሚችለው በግርጌ ማስታወሻ ተጠብቋል።
- source_word: Γολγοθα
  choice: ጎልጎታ
  rationale: የቦታ ስም ስለሆነ በአማርኛ በተለመደው ድምፃዊ ቅርጽ ተጽፏል።
theological_decisions:
- issue: Ἑβραϊστί የሚያመለክተው ቋንቋ
  choice: በዕብራይስጥ
  alternative: በአራማይክ
  rationale: የግሪኩ ጽሑፍ በቀጥታ «በዕብራይስጥ» ይላል፤ ስለዚህ ዋናው ጽሑፍ ይህን ይጠብቃል። በዮሐንስ አጠቃቀም ቃሉ በይሁዳ ይነገር የነበረውን አራማይክ ሊያመለክት የሚችል በመሆኑ አማራጩ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ራሱ» የሚለው አጽንዖት ከግሱ ጋር ተፈጥሯዊ በሆነ ቦታ ተቀምጧል፤ የቋንቋው ማስታወሻ ምልክትም ከሚመለከተው «በዕብራይስጥ» ቀጥሎ ተቀምጧል።
