base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: am
  text: ስለዚህ ጲላጦስ፣ “እኔን አታናግርም? ልለቅህ ሥልጣን እንዳለኝ፣ በመስቀል ልሰቅልህም ሥልጣን እንዳለኝ አታውቅም?” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሥልጣን” የተተረጎመው የግሪክኛው ἐξουσία (ኤክሱሲያ) ቃል “ኃይል” ወይም “መብት” ማለትም ሊሆን ይችላል። እዚህ ጲላጦስ በፍርድና በአስተዳደር አውድ ስለሚናገር “ሥልጣን” ተመርጧል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: ስለዚህ ጲላጦስ ... አለው
  rationale: οὖν ከቀደመው ንግግር የሚመነጨውን ትረካዊና ምክንያታዊ ትስስር በተፈጥሯዊው ‘ስለዚህ’ ያሳያል፤ αὐτῷ ደግሞ በ‘አለው’ ውስጥ ተጠብቋል።
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: እኔን አታናግረኝም?
  rationale: በἘμοὶ ላይ ያለውን አጽንዖት ‘እኔን’ በማስቀደም ይጠብቃል፤ የጥያቄውን የተግሣጽና የተበሳጨ ቃናም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ οἶδας ὅτι
  choice: እንዳለኝ ... አታውቅም?
  rationale: οἶδα የሚለውን መሠረታዊ ‘ማወቅ’ ትርጉም ይጠብቃል፤ ὅτι የሚያስገባው የይዘት ሐረግ በ‘እንደ-’ ቅርጽ በተፈጥሯዊ አማርኛ ተሰጥቷል።
- source_word: ἐξουσίαν ἔχω
  choice: ሥልጣን እንዳለኝ
  rationale: ἐξουσία በዚህ የሕግና የአስተዳደር አውድ ‘ሥልጣን’ ተብሎ በትክክል ይገለጻል፤ ባዶ ኃይልን ብቻ አያመለክትም።
- source_word: ἀπολῦσαί σε
  choice: ልለቅህ
  rationale: በፍርድ አውድ ἀπολύω እስረኛን መልቀቅን ያመለክታል፤ ‘ልለቅህ’ አጭር፣ ግልጽና ተፈጥሯዊ ነው።
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: ልሰቅልህም ሥልጣን እንዳለኝ
  rationale: በግሪኩ የተደገመውን ἐξουσίαν ἔχω በመጠበቅ በመልቀቅና በመስቀል መካከል ያለውን አጽንዖታዊ ንጽጽር ያሳያል።
theological_decisions:
- issue: ጲላጦስ የሚናገረው ἐξουσία ባሕርይ
  choice: ‘ሥልጣን’ ተብሎ ተተርጉሟል፤ ይህ የጲላጦስን የሕግና የአስተዳደር ይገባኛል ያሳያል እንጂ ንግግሩን ፍጹም ወይም ራሱን የቻለ ሥልጣን ነው ብሎ አያጸድቅም።
  alternative: ‘ኃይል’ ወይም ‘መብት’
  rationale: ቁጥሩ የጲላጦስን አባባል ዘግቦ ያቀርባል፤ በሚቀጥለው ቁጥር ኢየሱስ የሚሰጠውን መልስ ቀድሞ ሳይፈታ መለኮታዊ ውጥረቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጲላጦስ የተበሳጨ አጽንዖትና በሁለቱ ውጤቶች መካከል ያለው ንጽጽር ተጠብቋል።
