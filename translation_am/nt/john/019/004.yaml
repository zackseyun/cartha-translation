id: JHN.19.4
reference: John 19:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: am
  text: ከዚያም ጲላጦስ እንደገና ወደ ውጭ ወጥቶ፣ “እነሆ፣ በእርሱ ላይ ምንም የክስ ምክንያት እንዳላገኝ እንድታውቁ፣ ወደ ውጭ አውጥቼ ወደ እናንተ አመጣዋለሁ” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: ወደ ውጭ ወጥቶ
  rationale: የግሪኩን የቦታ እንቅስቃሴ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ በግሪኩ ያለውን መጠነኛ ድግግሞሽም አያከብድም።
- source_word: πάλιν
  choice: እንደገና
  rationale: ድርጊቱ መደገሙን በግልጽና በተለመደ አገላለጽ ያስተላልፋል።
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ይተረጉማል።
- source_word: Ἴδε
  choice: እነሆ
  rationale: ትኩረትን የሚስብ የማሳያ ቃል ሲሆን፣ በአማርኛ የመጽሐፍ ቅዱስ ንግግር ውስጥ የታወቀ፣ ክብር ያለውና ግልጽ ነው።
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: ወደ እናንተ አወጣዋለሁ
  rationale: ጲላጦስ ኢየሱስን ወደ ውጭ ለሕዝቡ እያቀረበ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα γνῶτε
  choice: እንድታውቁ
  rationale: የἵναን የዓላማ ኃይል አጭርና ተፈጥሯዊ በሆነ የአማርኛ የዓላማ አንቀጽ ያስተላልፋል።
- source_word: οὐδεμίαν αἰτίαν
  choice: ምንም የክስ ምክንያት
  rationale: αἰτία በዚህ የፍርድ አውድ የሚያመለክተውን ሕጋዊ ክስ ወይም ለክስ የሚሆን መሠረት በግልጽ ያሳያል።
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: በእርሱ ላይ ... እንዳላገኘሁ
  rationale: የግሪኩን ፍርዳዊ ፈሊጥ በአማርኛ የክስ አገላለጽ በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: ጲላጦስ ስለ ኢየሱስ ንጹሕነት የሰጠው ፍርዳዊ መግለጫ
  choice: በእርሱ ላይ ምንም የክስ ምክንያት እንዳላገኘሁ
  alternative: በእርሱ ምንም ጥፋት እንዳላገኘሁ
  rationale: ዋናው ንባብ αἰτίαን በትዕይንቱ የፍርድ አውድ መሠረት ያቀርባል፤ ይህም የጲላጦስን ሕጋዊ ግምገማ ያሳያል እንጂ በጥቅሱ ውስጥ በቀጥታ ያልተገለጸ ሰፊ ሥነ መለኮታዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “የክስ ምክንያት” የፍርድ አውዱን ለመጠበቅ ተመርጧል፤ “እነሆ” ደግሞ Ἴδε ያለውን የትኩረት ጥሪ በክብር ያቀርባል።
