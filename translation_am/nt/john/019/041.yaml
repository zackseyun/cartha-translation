source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: am
  text: እርሱ በተሰቀለበት ስፍራ አንድ አትክልት ስፍራ ነበረ፤ በአትክልት ስፍራውም ውስጥ ገና ማንም ያልተቀበረበት አዲስ መቃብር ነበረ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: —ም
  rationale: ቀላል የትረካ ቅጥልጥልን በአማርኛው ሁለተኛ ሐረግ ላይ በተያያዥ አገናኝ ቅጥያ በተፈጥሯዊ ሁኔታ አሳይቷል፤ ግልጽ የጊዜ ቃል አልተጨመረም።
- source_word: τόπῳ
  choice: ስፍራ
  rationale: በዚህ የትረካ አውድ ቀጥተኛና የተለመደ አቻ ቃል ነው።
- source_word: ὅπου ἐσταυρώθη
  choice: እርሱ በተሰቀለበት
  rationale: የግሪኩን ተደራጊ አወቃቀር ይጠብቃል፤ ከአውዱ የሚታወቀውን ተውላጠ ስም ግልጽ ያደርጋል።
- source_word: κῆπος
  choice: አትክልት ስፍራ
  rationale: ከ‘ፍራፍሬ እርሻ’ ይልቅ ሰፊውን የκήπος ትርጉም የሚያስተላልፍ ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
- source_word: μνημεῖον
  choice: መቃብር
  rationale: በቀብር አውድ የሚገኘውን የሬሳ ማኖሪያ ያመለክታል፤ በአማርኛም ለመቃብር ስፍራና ለመቃብር ክፍል ሊሠራ ይችላል።
- source_word: καινόν
  choice: አዲስ
  rationale: የቅጽሉን ቀጥተኛ ትርጉም ይጠብቃል፤ ‘ጥቅም ላይ ያልዋለ’ የሚለውን ሐሳብ የሚከተለው ንዑስ ሐረግ ያብራራዋል።
- source_word: οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: ገና ማንም ያልተቀበረበት
  rationale: የ‘ገና ማንም’ን ጊዜያዊና አሉታዊ ኃይል ይጠብቃል፤ በቀብር አውድ ‘ተቀበረ’ የሚለው ከቃል በቃል ‘ተቀመጠ’ ይልቅ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የμνημεῖον እና τεθειμένος የቀብር አውድ አገላለጽ
  choice: መቃብር ... ያልተቀበረበት
  alternative: መቃብር ... ያልተቀመጠበት
  rationale: አገላለጹ የቀብሩን ተጨባጭ አውድ በተፈጥሯዊ አማርኛ ያሳያል፤ ከትረካው በላይ የሆነ ሥነ መለኮታዊ ትርጓሜ አይጨምርም።
- issue: የἐσταυρώθη ድምፅ
  choice: እርሱ በተሰቀለበት
  alternative: እነርሱ በሰቀሉት
  rationale: ተደራጊውን የግሪክ አወቃቀር ይጠብቃል፤ በዚህ ሐረግ ያልተጠቀሰ አድራጊንም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘አትክልት ስፍራ’ ከአሻሚው ‘ገነት’ ይልቅ በዚህ ቦታዊ አውድ ግልጽ ነው። የግሪኩ አሻሚነት ወይም ሥነ መለኮታዊ ውጥረት በማብራሪያ አልተወገደም።
