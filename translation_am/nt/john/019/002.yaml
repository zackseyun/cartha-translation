  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: am
  text: ወታደሮቹም ከእሾህ አክሊል ጎንጉነው በራሱ ላይ አኖሩት፤ ሐምራዊ ልብስም አለበሱት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: ወታደሮቹ
  rationale: በዚህ የሮማውያን ወታደራዊ አውድ የተለመደና ትክክለኛ አማርኛ አቻ ነው።
- source_word: πλέξαντες
  choice: ጎንጉነው
  rationale: የእሾህ ቅርንጫፎችን እርስ በርስ በማጠላለፍ አክሊል ማበጀትን በተፈጥሯዊ አማርኛ ይገልጣል፤ ድርጊቱም ከዋናው ግስ በፊት መፈጸሙን ያሳያል።
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: ከእሾህ አክሊል
  rationale: “አክሊል” የንጉሣዊነት ምልክቱን ይጠብቃል፤ “ከእሾህ” ደግሞ የተሠራበትን ቁሳቁስ በግልጽ ያሳያል።
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: በራሱ ላይ አኖሩት
  rationale: የግሪኩን ፈሊጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የግሱ ተሳቢ “አክሊል” በ“-ት” ተወካይ ተጠብቋል።
- source_word: ἱμάτιον πορφυροῦν
  choice: ሐምራዊ ልብስ
  rationale: ἱμάτιον ሰፊ ትርጉም ያለው የውጭ ልብስ ስለሆነ “ልብስ” ያለማብራራት የምንጩን ስፋት ይጠብቃል፤ “ሐምራዊ” የቀለሙንና በአውዱ ያለውን ንጉሣዊ ፍንጭ ያስተላልፋል።
- source_word: περιέβαλον αὐτόν
  choice: አለበሱት
  rationale: ልብስን በሰው ላይ ማድረግ የሚለውን ትርጉም አጭርና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
theological_decisions:
- issue: ወታደሮቹ ያደረጉት የንጉሣዊነት ማሾፊያ ምስል
  choice: አክሊሉንና ሐምራዊውን ልብስ በቀጥታ መግለጽ፣ “ለማሾፍ” የሚል ትርጓሜ አለመጨመር
  alternative: “በንጉሥ ላይ እንደሚደረግ እያሾፉበት” የሚል ገላጭ ሐረግ መጨመር
  rationale: ማሾፉ ከአውዱና ከአክሊልና ከሐምራዊ ልብስ ምስሎች ይገባል፤ ቁጥሩ ግን ዓላማውን በግልጽ አይናገርም፣ ስለዚህ ትርጉሙ ተጨማሪ ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አክሊል” የመጽሐፍ ቅዱስ አውድን የሚስማማ ነው፤ ነገር ግን ዓረፍተ ነገሩ ቀላልና ተፈጥሯዊ ሆኖ ተዋቅሯል። በምንጩ ያልተገለጸውን የልብሱን ቅርጽ “ካባ” ብሎ ከመወሰን ይልቅ “ልብስ” ተመርጧል።
