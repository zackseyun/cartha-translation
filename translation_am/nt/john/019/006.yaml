base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: am
  text: ስለዚህ የካህናት አለቆችና ሹማምቱ ባዩት ጊዜ፣ “ስቀለው! ስቀለው!” እያሉ ጮኹ። ጲላጦስም፣ “እናንተው ውሰዱትና ስቀሉት፤[a] እኔ በእርሱ ላይ የሚቀርብ ምንም ክስ አላገኘሁም”[b] አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተ ራሳችሁ ውሰዱትና ስቀሉት።” በግሪክኛው “እናንተ” የሚለው ቃል በግልጽ ተጠቅሶ አጽንዖት ይሰጣል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእርሱ ምንም ጥፋት አላገኘሁም።” የግሪክኛው ቃል ሕጋዊ ክስን ወይም ለመክሰስ መሠረት የሚሆንን ጉዳይ ሊያመለክት ይችላል፤ በዚህ አውድ የፍርድ ቤት ትርጉሙ ዋነኛ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ስለዚህ … ባዩት ጊዜ
  rationale: ὅτε የሚያመለክተውን ጊዜና οὖν የሚያሳየውን የትረካ ቀጣይነትና ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ቃሉ አንድን ሊቀ ካህን ሳይሆን በኢየሩሳሌም የነበሩትን መሪ ካህናት በብዙ ቁጥር ያመለክታል።
- source_word: ὑπηρέται
  choice: ሹማምቱ
  rationale: በዮሐንስ አውድ ሥልጣን ላላቸው የአይሁድ መሪዎች የሚያገለግሉ የበታች ባለሥልጣናትን ያመለክታል፤ ጽሑፉ ራሱ ያልገለጸውን “የቤተ መቅደስ” የሚል መለያ አይጨምርም።
- source_word: ἐκραύγασαν λέγοντες
  choice: እያሉ ጮኹ
  rationale: ከፍ ባለ ድምፅ የተደረገውን የሕዝብ ጩኸትና የጩኸቱን ይዘት በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Σταύρωσον σταύρωσον
  choice: ስቀለው! ስቀለው!
  rationale: የተደጋገመውን ትእዛዝና አጽንዖት ይጠብቃል፤ በግሪክኛው ከአውዱ የሚታወቀው ተሳቢ በአማርኛው ግስ ውስጥ ተገልጿል።
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: እናንተው ውሰዱት
  rationale: በግሪክኛ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ὑμεῖς በ“እናንተው” ያስተላልፋል፤ ጲላጦስ ራሱን ከእነርሱ ጋር ያነጻጽራል።
- source_word: σταυρώσατε
  choice: ስቀሉት
  rationale: የግሪክኛውን የብዙ ቁጥር ትእዛዝ በቀጥታና በተለመደ አገላለጽ ያቀርባል።
- source_word: αἰτίαν
  choice: ክስ
  rationale: በዚህ የፍርድ አውድ ቃሉ ሕጋዊ ክስን ወይም የክስ መሠረትን ያመለክታል፤ “ክስ” ይህን የሕግ ትርጉም ግልጽ ያደርጋል።
