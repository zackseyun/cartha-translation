review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative connective, the taking of Jesus’s body, the linen cloths, and the Jewish burial-custom reference. However, its clause for καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν is grammatically incomplete/unnatural in Amharic, and “ሽቱዎቹ” can suggest perfume rather than the burial aromatics/spices denoted by ἀρώματα.
  naturalness: The main sentence is understandable, but “አይሁድ ለቀብር እንደሚያደርጉት ልማድ” does not form an idiomatic comparison after “እንደ.” Recasting it as “እንደ አይሁድ የቀብር ልማድ” is concise and natural modern standard Amharic.
  terminology: “ሥጋ” is suitable for σῶμα in this reverent narrative register. “በበፍታ ጨርቆች ጠቀለሉት” naturally conveys binding/wrapping in linen cloths. “የሽቱ ቅመሞች” more accurately identifies ἀρώματα as aromatic burial spices while retaining accessible language. “አይሁድ” appropriately renders τοῖς Ἰουδαίοις here; the geographic alternative remains appropriately footnoted.
  issues:
  - severity: medium
    issue: The customary-practice clause is unidiomatic and syntactically incomplete.
    rationale: “እንደሚያደርጉት ልማድ” needs a clearer possessive/comparative construction. The Greek means “as is the Jews’ custom for burial,” not merely a disconnected phrase about what they do.
  - severity: low
    issue: “ሽቱዎቹ” is narrower than the Greek burial-aromatics term.
    rationale: ἀρώματα refers to aromatic substances/spices used in burial. “የሽቱ ቅመሞች” avoids an overly perfume-specific sense.
  revised_text: ስለዚህ የኢየሱስን ሥጋ ወስደው፣ ከሽቱ ቅመሞች ጋር በበፍታ ጨርቆች ጠቀለሉት፤ ይህም እንደ አይሁድ የቀብር ልማድ ነው።[a]
