base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: am
  text: ስለዚህ የኢየሱስን ሥጋ ወስደው፣ ከሽቱ ቅመሞች ጋር በበፍታ ጨርቆች ጠቀለሉት፤ ይህም እንደ አይሁድ የቀብር ልማድ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አይሁድ” የሚለው ቃል በጂኦግራፊያዊ ትርጉም “የይሁዳ ነዋሪዎች” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን አውዱ በአጠቃላይ የአይሁድን የቀብር ልማድ ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον οὖν
  choice: ስለዚህ … ወስደው
  rationale: οὖν ከቀደመው ትረካ የሚከተለውን ውጤት ያመለክታል፤ ἔλαβον ደግሞ ሥጋውን ለቀብር ዝግጅት መውሰዳቸውን ይገልጣል።
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: የኢየሱስን ሥጋ
  rationale: σῶμα በአክብሮታዊው ትረካ ውስጥ ‘ሥጋ’ ተብሎ በተፈጥሮ ይተረጎማል፤ ‘አስከሬን’ ከግሪኩ ይልቅ ጠንካራ ነው።
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: በበፍታ ጨርቆች ጠቀለሉት
  rationale: δέω በመሠረቱ ማሰርን ያመለክታል፤ ከὀθόνια ጋር በቀብር ዝግጅት አውድ ‘ጠቀለሉት’ የድርጊቱን ተፈጥሯዊ ትርጉም ያቀርባል። ‘በበፍታ ጨርቆች’ የጨርቆቹን ቁሳቁስና ብዙ ቁጥር ይጠብቃል።
- source_word: μετὰ τῶν ἀρωμάτων
  choice: ከሽቱዎቹ ጋር
  rationale: ἀρώματα ለቀብር የሚጠቀሙባቸውን መዓዛማ ቅመሞች ወይም ሽቱዎች ያመለክታል፤ ‘ሽቱዎቹ’ በዚህ አውድ ግልጽና ተፈጥሯዊ ነው።
- source_word: καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν
  choice: አይሁድ ለቀብር እንደሚያደርጉት ልማድ
  rationale: ይህ አገላለጽ ድርጊቱ ከተለመደው የአይሁድ የቀብር ዝግጅት ጋር መስማማቱን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የτοῖς Ἰουδαίοις ትርጉም
  choice: አይሁድ
  alternative: የይሁዳ ነዋሪዎች
  rationale: በዚህ አውድ ቃሉ የአንድን ክልል ነዋሪዎች ብቻ ሳይሆን በሰፊው የአይሁድን የቀብር ልማድ ያመለክታል። የጂኦግራፊያዊው አማራጭ ግን በማስታወሻ ተጠብቋል።
