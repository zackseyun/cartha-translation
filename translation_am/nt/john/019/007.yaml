revisions:
- from: አይሁድም፣ “እኛ ሕግ አለን፤ በዚያም ሕግ መሠረት እርሱ ሊሞት ይገባዋል፤ ምክንያቱም ራሱን የእግዚአብሔር ልጅ አድርጓል” ብለው መለሱለት።
  to: አይሁድ እንዲህ ብለው መለሱለት፦ “እኛ ሕግ አለን፤ እና በዚያ ሕግ መሠረት እርሱ ሊሞት ይገባዋል፤ ምክንያቱም ራሱን የእግዚአብሔር ልጅ አድርጓል።”
  rationale: The revision corrects the unsupported and awkward opening -ም, supplies a natural Amharic narrative formula before the direct speech, and makes the Greek coordinating conjunction explicit. It retains the repeated legal reference and the accusers’ accusation without adding interpretation.
