id: JHN.19.7
reference: John 19:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: am
  text: አይሁድ እንዲህ ብለው መለሱለት፦ “እኛ ሕግ አለን፤ እና በዚያ ሕግ መሠረት እርሱ ሊሞት ይገባዋል፤ ምክንያቱም ራሱን የእግዚአብሔር ልጅ አድርጓል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: መለሱለት
  rationale: የትረካውን መደበኛ የመልስ ግስና αὐτῷ የሚያመለክተውን ‘ለእርሱ’ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: ግሪኩ በዚህ ቁጥር ቡድኑን በቀጥታ ይጠራል፤ ‘መሪዎች’ የሚል ገደብ በጽሑፉ ስላልተገለጸ አልተጨመረም።
- source_word: νόμον ἔχομεν
  choice: እኛ ሕግ አለን
  rationale: የመጀመሪያው νόμον ያለ አመልካች መጣጥፍ መሆኑንና የሕግ መሠረት ይዘናል የሚለውን ክርክር በቀጥታ ያሳያል።
- source_word: κατὰ τὸν νόμον
  choice: በዚያም ሕግ መሠረት
  rationale: ሁለተኛው የ‘ሕግ’ አጠቃቀም ቀድሞ የተጠቀሰውን ሕግ መልሶ እንደሚያመለክት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ὀφείλει ἀποθανεῖν
  choice: ሊሞት ይገባዋል
  rationale: ὀφείλει የሚገልጸውን ሕጋዊ ግዴታ ሳያጠነክር በግልጽ ያቀርባል።
- source_word: υἱὸν θεοῦ ἑαυτὸν ἐποίησεν
  choice: ራሱን የእግዚአብሔር ልጅ አድርጓል
  rationale: የግሪኩን አወቃቀርና የከሳሾቹን አነጋገር በቅርብ ይጠብቃል፤ ‘የእግዚአብሔር ልጅ’ በአማርኛ በተፈጥሮ የተወሰነውን የማዕረግ ፍቺ ሊሸከም ይችላል።
theological_decisions:
- issue: በጠላትነት ክስ ውስጥ υἱὸν θεοῦ የሚለውን መተርጎም
  choice: የእግዚአብሔር ልጅ
  alternative: አንድ የእግዚአብሔር ልጅ
  rationale: ያልተወሰነው አማራጭ የዮሐንስን ዐውድና የከሳሾቹን የልዩ መለኮታዊ ልጅነት ክስ ያዳክማል። የተመረጠው ንባብ የተናጋሪዎቹን ክስ ብቻ ያቀርባል እንጂ ተጨማሪ የእምነት ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የ‘ሕግ’ ድግግሞሽ ተጠብቆ፣ ሁለተኛው ቀዳሚውን እንደሚመለከት ‘በዚያም ሕግ’ ተብሏል። ለዚህ ረቂቅ አስፈላጊ የግርጌ ማስታወሻ አልታየም።
