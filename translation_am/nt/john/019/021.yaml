  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: am
  text: እንግዲህ የአይሁድ[a] የካህናት አለቆች ጲላጦስን፣ “የአይሁድ ንጉሥ ብለህ አትጻፍ፤ ይልቁንም ያ ሰው፣ ‘እኔ የአይሁድ ንጉሥ ነኝ’ እንዳለ ጻፍ” ይሉት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አይሁድ” በሚለው ፈንታ “የይሁዳ ሰዎች” ወይም “ይሁዳውያን” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል እንደ አውዱ አይሁድን በአጠቃላይ ወይም የይሁዳን ክልል ሰዎች በተለይ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉት ነበር
  rationale: የግሪኩን ያልተፈጸመ የጊዜ አንቀጽ ቀጣይ ወይም ተደጋጋሚ ንግግር እንደነበር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: የትረካውን ቀጣይነትና ከቀደመው ነገር የሚወጣውን ውጤት ያስተላልፋል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ሊቃነ ካህናት በአንድ ጊዜ ሥልጣን ይዘው ነበር የሚል ሐሳብ ሳያስገባ፣ የካህናትን መሪዎች በግልጽ ይገልጣል።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: በሕማማቱ ትረካ ውስጥ ያለውን የፖለቲካና የሃይማኖት መጠሪያ ‘የአይሁድ ንጉሥ’ በተለመደው አማርኛ ይጠብቃል፤ ‘የይሁዳ ሰዎች’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: Μὴ γράφε
  choice: አትጻፍ
  rationale: የክልከላውን ትእዛዝ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἀλλ’ ὅτι ἐκεῖνος εἶπεν
  choice: ይልቁንም ይህ ሰው … እንዳለ ጻፍ
  rationale: ἀλλά የሚያሳየውን ንጽጽር፣ ἐκεῖνος ያለውን አመልካችና ከርቀት የሚነገር ቅላፄ፣ እንዲሁም በአማርኛ ግልጽ የሆነውን የሚፈልጉትን ጽሑፍ በተፈጥሯዊ አገባብ ያቀርባል።
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: እኔ የአይሁድ ንጉሥ ነኝ
  rationale: ግሪኩ ከβασιλεύς በፊት የተወሰነ አመልካች ባይኖረውም፣ አማርኛ ያንን ልዩነት በተመሳሳይ መንገድ አያሳይም፤ ይህ አተረጓጎም ትርጉሙን ያለ ትርፍ ያቀርባል።
theological_decisions:
- issue: በዮሐንስ የሕማማት ትረካ Ἰουδαῖος/Ἰουδαίωνን መተርጎም
  choice: አይሁድ
  alternative: የይሁዳ ሰዎች / ይሁዳውያን
  rationale: በዚህ አውድ ‘የአይሁድ ንጉሥ’ የታወቀ የፖለቲካና የሃይማኖት መጠሪያ ነው። ሆኖም የግሪኩ ቃል በአንዳንድ አውዶች የይሁዳን ክልል ሰዎች በተለይ ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- issue: ἐκεῖνος የሚያሳየው የርቀት ቅላፄ
  choice: ይህ ሰው
  alternative: እርሱ
  rationale: ተራ ተውላጠ ስም ከመጠቀም ይልቅ አመልካቹን ጎላ አድርጎ ያቀርባል፤ ነገር ግን ንቀትን ከግሪኩ በላይ አያጠናክርም።
