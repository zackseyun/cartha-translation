  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የትእዛዙን ቀጥተኛነትና የካህናት አለቆቹን ተደጋጋሚ ጥያቄ ጠብቋል። በአማርኛ የተጠቀሱ ቃላትን በተከታታይ ጥቅስ ምልክቶች ከማወሳሰብ ይልቅ አገባቡ ግልጽ እንዲሆን የሐረግ አወቃቀሩ ተስተካክሏል።
