  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: am
  text: ነገር ግን ከጥብርያዶስ ጀልባዎች[a] ጌታ ካመሰገነ በኋላ እነርሱ እንጀራውን ከበሉበት ስፍራ አጠገብ መጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ትናንሽ ጀልባዎች።” የግሪኩ πλοιάρια የመጠን ማሳነሻ ቅርጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ትረካ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἦλθεν
  choice: ደረሱ
  rationale: በዚህ የትረካ አውድ የጀልባዎቹን መምጣትና በቦታው መድረስ በግልጽ ይገልጣል፤ የግሪኩ ነጠላ ግስ ከገለልተኛ ብዙ ስም ጋር ሲስማማ፣ አማርኛው በተፈጥሮ ብዙ ቁጥርን ይጠቀማል።
- source_word: πλοιάρια
  choice: ጀልባዎች
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው፤ የመጠን ማሳነሻው ልዩነት በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἐκ Τιβεριάδος
  choice: ከጥብርያዶስ የመጡ
  rationale: የጀልባዎቹን መነሻ ቦታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐγγὺς τοῦ τόπου
  choice: ስፍራ አጠገብ
  rationale: የቦታውን ቅርበት በግልጽና በተለመደ አገላለጽ ያቀርባል።
- source_word: ἔφαγον τὸν ἄρτον
  choice: እነርሱ እንጀራውን ከበሉበት
  rationale: የግሪኩን ሦስተኛ መደብ ብዙ ቁጥር ሳይገድብ ይጠብቃል፤ የታወቀውን እንጀራ ለማመልከት ‘እንጀራውን’ ተመርጧል።
- source_word: εὐχαριστήσαντος
  choice: ካመሰገነ በኋላ
  rationale: ምስጋናው እንጀራውን ከመብላታቸው በፊት መሆኑን የአኦሪስት አንቀጹ በሚፈቅደው መሠረት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ κυρίου
  choice: ጌታ
  rationale: ኢየሱስን የሚያመለክተውን የክብር ማዕረግና ክርስቶሳዊ ድምፀቱን ሳያጠብ ይጠብቃል።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት / አለቃ
  rationale: በዮሐንስ አውድ ማጣቀሻው ኢየሱስ ነው፤ ‘ጌታ’ የክብር ማዕረጉንና የክርስቶሳዊ ድምፀቱን ይጠብቃል፣ ነገር ግን ከጽሑፉ በላይ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአንቀጽ አወቃቀር በአማርኛ ተፈጥሯዊ ቅደም ተከተል ተደራጅቷል፤ የ‘እነርሱ’ ማጣቀሻ በምንጩ እንዳለው ሳይገደብ ተቀምጧል።
