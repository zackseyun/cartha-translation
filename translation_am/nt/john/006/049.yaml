- source_word: ἔφαγον
  choice: በሉ
  rationale: የἐσθίω ያለፈ ጊዜ ቅርጽ ስለሆነ፣ ቀላልና ተፈጥሯዊው የአማርኛ አቻ ‘በሉ’ ነው።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
