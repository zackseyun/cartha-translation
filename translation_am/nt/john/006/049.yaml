- source_word: τὸ μάννα
  choice: መናውን
  rationale: የግሪኩ የተወሰነ አመልካች በአማርኛው -ውን ተጠብቋል፤ ይህም በምድረ በዳ የተሰጠውን የታወቀ መና ያመለክታል።
- source_word: ἀπέθανον
