  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: am
  text: እዚህ አምስት የገብስ ዳቦና ሁለት ዓሣ ያለው አንድ ወንድ ልጅ አለ፤ እነዚህ ግን ለዚህ ያህል ብዙ ሰዎች ምን ያህል ይበቃሉ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እነዚህ ለዚህ ያህል ብዙ ሰዎች ምን ይሆናሉ?»
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδάριον
  choice: ወንድ ልጅ
  rationale: ቃሉ ሕፃንን ወይም ወጣት ወንድ ልጅን ያመለክታል። «ወንድ ልጅ» ጾታውን በግልጽ ያሳያል፣ ዕድሜውን ግን ከጽሑፉ በላይ አይወስንም።
- source_word: ὧδε
  choice: በዚህ
  rationale: የቦታ አመልካቹን በተፈጥሯዊና አጭር ዘመናዊ አማርኛ ይገልጣል።
- source_word: ὃς ἔχει
  choice: ያለው
  rationale: ልጁን በያዘው ምግብ የሚለየውን ዝምድናዊ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄρτους κριθίνους
  choice: የገብስ እንጀራ
  rationale: ἄρτοι ዳቦን ወይም እንጀራን፣ κριθίνους ደግሞ ከገብስ የተሠራ መሆኑን ያመለክታል። «የገብስ እንጀራ» በአማርኛ የሚገባና በቀላሉ የሚታወቅ ነው።
- source_word: ὀψάρια
  choice: ዓሣ
  rationale: በዚህ ዐውድ ከእንጀራው ጋር የሚበላ ዓሣን ያመለክታል። ቃሉ በግድ መጠኑን ስለማይወስን «ትንሽ» አልተጨመረም።
- source_word: ἀλλὰ
  choice: ግን
  rationale: ያለውን ጥቂት ምግብ ከብዙው ሕዝብ ጋር የሚያነጻጽረውን ተቃርኖ በአጭርና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ταῦτα τί ἐστιν
  choice: እነዚህ ምን ይሆናሉ?
  rationale: የግሪኩን ቀጥተኛ የአነጋገር ቅርጽና የአጻጻፍ ጥያቄውን ይጠብቃል፤ በአማርኛም የእነዚህ ነገሮች በቂ አለመሆንን ያመለክታል።
- source_word: εἰς τοσούτους
  choice: ለዚህ ሁሉ ሕዝብ
  rationale: ከብዙዎቹ ሰዎች አንጻር የምግቡን በቂነት የሚጠይቀውን ሐሳብ ግልጽ ያደርጋል፤ «ሕዝብ» በዐውዱ የተገነዘበ ማብራሪያ ነው።
