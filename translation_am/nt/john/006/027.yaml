  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: am
  text: የሚጠፋውን ምግብ ለማግኘት አትሥሩ፤ ይልቁንም ወደ ዘላለም ሕይወት የሚቆየውን ምግብ ለማግኘት ሥሩ፤ ይህንም የሰው ልጅ ይሰጣችኋል፤ እርሱን አብ፣ እግዚአብሔር፣ አትሞታል[a]ና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ “አትሞታል”፤ አገላለጹ ሥልጣን መስጠትን ወይም እውነተኛነትን ማረጋገጥን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: ለማግኘት አትሥሩ፤ ይልቁንም ... ለማግኘት ሥሩ
  rationale: ቀጥተኛውን የትእዛዝ ኃይልና የ‘አይደለም ... ይልቁንም’ ንፅፅር ይጠብቃል፤ በአማርኛም ‘ለምግብ መሥራት’ የሚለው እንዳያሻማ ‘ለማግኘት’ ተጨምሯል።
- source_word: βρῶσιν
  choice: ምግብ
  rationale: በዚህ አውድ ቃሉ የመብላትን ድርጊት ሳይሆን የሚበላውን ነገር ያመለክታል።
- source_word: ἀπολλυμένην
  choice: የሚጠፋውን
  rationale: የሚበላሸውን ብቻ ሳይሆን የሚያልፍና የማይቆይ መሆኑንም የሚያካትት ሰፊ አገላለጽ ነው።
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: ለዘላለም ሕይወት የሚኖረውን
  rationale: μένω የሚለውን ‘የሚኖር/የሚቆይ’ በማለት፣ εἰς የሚያሳየውን ግብ ወይም ውጤት ደግሞ ‘ለዘላለም ሕይወት’ በማለት ይገልጣል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: ራስን የመጥራት ማዕረጉንና ከዳንኤል መጽሐፍ ጋር ያለውን ትስስር የሚጠብቅ የተለመደ አተረጓጎም ነው።
- source_word: ὑμῖν δώσει
  choice: ይሰጣችኋል
  rationale: የወደፊት ጊዜ አመልካችና የብዙ ሰዎች ተቀባይነት በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: ἐσφράγισεν
  choice: በማኅተሙ አረጋግጦታል
  rationale: የማኅተምን ምስል ይጠብቃል፤ በተመሳሳይም የሥልጣን ማረጋገጫና እውቅና የሚለውን ትርጉም ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: እግዚአብሔር አብ
  rationale: አብ እግዚአብሔር መሆኑን የሚገልጠውን ተዛማጅ ስያሜ በተፈጥሯዊና በተለመደ አማርኛ ያቀርባል።
theological_decisions:
- issue: የὁ πατὴρ ... ὁ θεός ተዛማጅ ስያሜ
  choice: እግዚአብሔር አብ
  alternative: አብ፣ እግዚአብሔር
  rationale: የግሪኩን አብን እግዚአብሔር ብሎ የሚለየውን አገላለጽ ይጠብቃል፤ ከጽሑፉ በላይ ተጨማሪ የእምነት ቀመር አያስገባም።
- issue: ἐσφράγισεν ለየሰው ልጅ ያለው ትርጉም
  choice: በማኅተሙ አረጋግጦታል
  alternative: አትሞታል
  rationale: ቀጥተኛውን የማኅተም ምስል ከማጥፋት ይልቅ ይጠብቀዋል፤ ምስሉ የሚያመለክተውን መለኮታዊ ፈቃድ፣ እውቅና ወይም ማረጋገጫም ግልጽ ያደርጋል።
