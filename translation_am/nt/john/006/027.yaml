  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ለማግኘት’ የሚለው በአማርኛ የግሥን ዓላማ ለማብራራት ተጨምሯል፤ የግሪኩ ተቃርኖና የማኅተም ምስል ተጠብቀዋል።
