review_pass:
  verdict: revise
  source_fidelity: The contrast between perishable food and food remaining εἰς ζωὴν αἰώνιον, the future gift by the Son of Man, and the Father's sealing are substantially present. However, the draft's rendering of ἐσφράγισεν combines the seal image with an interpretive assertion ('authenticated') in the main text; the Greek's metaphor is better retained directly. The current footnote says 'sealed him' but is anchored only after a main-text rendering that already expands the expression.
  naturalness: The draft is generally clear modern Amharic. 'ለማግኘት' is understandable, but it adds 'to obtain' twice where the Greek simply commands work for the food. A more concise formulation is more natural and closer to the source. 'ወደ ዘላለም ሕይወት የሚቆየው' clearly expresses the goal/result force of εἰς.
  terminology: የሰው ልጅ and አብ are appropriate established terms. አብ፣ እግዚአብሔር preserves the Greek apposition without imposing a doctrinal paraphrase. አትሞታል retains the seal metaphor and is preferable in the text; its authorization/authentication sense belongs in a footnote.
  issues:
  - severity: medium
    issue: The main-text rendering of ἐσφράγισεν is interpretively expanded.
    rationale: ‘በማኅተሙ አረጋግጦታል’ explicitly supplies authentication in addition to the seal image. Since the Greek uses the seal metaphor, a direct rendering (‘አትሞታል’) best preserves both image and ambiguity; the explanatory sense can remain in the note.
  - severity: low
    issue: ‘ለማግኘት’ is added twice to render ἐργάζεσθε.
    rationale: The addition is intelligible but makes the command specifically about obtaining food. ‘ለ… ሥሩ’ adequately conveys work for and is closer to the Greek wording.
