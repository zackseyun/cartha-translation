    text: ወይም፣ «የይሁዳ ሰዎች በዓል»። የግሪኩ ቃል እንደ አውዱ አይሁድን በአጠቃላይ ወይም የይሁዳን ሰዎች በተለይ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: δέ እዚህ የትረካውን ፍሰት በቀላሉ የሚያገናኝ ነው፤ በአማርኛ የዓረፍተ ነገሩ አወቃቀር ይህን ተግባር በተፈጥሮ ስለሚያሳይ፣ ግልጽ ያልሆነ ተቃርኖ ወይም የጊዜ ትርጉም አልተጨመረም።
- source_word: ἐγγὺς
  choice: ቀርቦ ነበር
  rationale: ከἦν ጋር በመሆን በዓሉ በጊዜ መቅረቡን ያመለክታል፤ «ቀርቦ ነበር» ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: πάσχα
  choice: ፋሲካ
  rationale: በዚህ አውድ የአይሁድን የፋሲካ በዓል ያመለክታል፤ «ፋሲካ» በአማርኛ የተለመደው መጠሪያ ነው።
- source_word: ἑορτὴ
  choice: በዓል
  rationale: ἑορτή ሃይማኖታዊ የበዓል ክብረ በዓልን ያመለክታል፤ «በዓል» ክቡር፣ ዘመናዊና ለሁሉም አንባቢ የሚገባ ነው።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: ፋሲካ የመላው የአይሁድ ሕዝብ ሃይማኖታዊ በዓል ስለሆነ፣ በዚህ አውድ «የአይሁድ» የሚለው ከክልላዊው «የይሁዳ ሰዎች» ይልቅ ትክክለኛ ነው።
theological_decisions:
- issue: በዮሐንስ ትረካ Ἰουδαίωνን መተርጎም
  choice: የአይሁድ
  alternative: የይሁዳ ሰዎች
  rationale: Ἰουδαῖοι እንደ አውዱ የአይሁድን ሕዝብ በአጠቃላይ ወይም የይሁዳን ነዋሪዎች በተለይ ሊያመለክት ይችላል። እዚህ ግን ፋሲካ የሕዝቡ አጠቃላይ ሃይማኖታዊ በዓል ስለሆነ «የአይሁድ» ተመርጧል፤ የቃሉ ሌላ እድል በማስታወሻው ተጠብቋል።
translation_notes:
