  text: ነገር ግን እንዲህ አልኋችሁ፤ እኔንም አይታችሁኛል፣ ነገር ግን አታምኑም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπον ὑμῖν
  choice: እንዳልኋችሁ
  rationale: የቀደመውን ንግግር እና የብዙ ቁጥር ተደራሲዎችን በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ὅτι
  choice: እንደ- በሚለው የተዋሃደ አገባብ
  rationale: የተነገረውን ይዘት በአማርኛ ተፈጥሯዊ በሆነ የተዘዋዋሪ ንግግር አገባብ ያስገባል።
- source_word: καὶ ἑωράκατέ με
  choice: እኔን አይታችሁኛል
  rationale: የፍጹም ጊዜውን ያለፈ ድርጊትና አሁናዊ አግባብ በአማርኛው ፍጹም ግስ ያሳያል፤ የκαί አጽንዖት ግን በአውዱና በቀጣዩ ‘ሆኖም’ ይገለጣል።
- source_word: καὶ οὐ πιστεύετε
  choice: ሆኖም አታምኑም
  rationale: ሁለተኛውን καί እንደ ተቃርኖ አያያዥ በተፈጥሯዊ አማርኛ ይገልጣል፤ የአሁን ጊዜውን ቀጣይ አለማመንም ይጠብቃል።
theological_decisions:
- issue: በκαὶ ἑωράκατέ με ውስጥ ያለው የመጀመሪያው καί ኃይል
  choice: በዋናው ጽሑፍ ቀጥተኛውን አረፍተ ነገር መጠበቅ፣ አጽንዖቱንም በ‘ሆኖም’ ተቃርኖ ማሳየት
  alternative: ‘እኔን እንኳ አይታችሁኛል’ ወይም ‘ምንም እንኳ እኔን ብታዩኝም’
  rationale: καί እዚህ ‘በእርግጥ/እንኳ’ የሚል አጽንዖት ወይም የመደመር ኃይል ሊኖረው ይችላል። በአማርኛ ‘እኔን እንኳ’ የሚለው ትኩረቱን በ‘እኔን’ ላይ ሊያደርግ ስለሚችል፣ ዋናው ጽሑፍ አሻሚነቱን አያስወግድም፤ ተጨማሪው አጽንዖት በማስታወሻ ተገልጧል።
- issue: πιστεύετε አተረጓጎም
  choice: አታምኑም
  alternative: እምነት የላችሁም፤ አትታመኑብኝም
  rationale: ‘ማመን’ የግሱን ቀጥተኛ ትርጉም ይጠብቃል፤ ግሱ እዚህ ግልጽ ማሟያ ስለሌለው ‘በእኔ’ የሚልን አልጨመረም።
