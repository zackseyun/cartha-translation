  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: am
  text: እርሱን በባሕሩ ማዶ ባገኙት ጊዜ፣ “ረቢ፣ ወደዚህ መቼ መጣህ?” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτὸν
  choice: ባገኙት ጊዜ
  rationale: የግሪኩ ያለፈ ጊዜ አካፋይ ከዋናው ግስ በፊት የሆነውን ድርጊት ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ይጠብቃል። የΚαὶ አያያዥ ኃይል በ«-ም» ተገልጿል።
- source_word: πέραν τῆς θαλάσσης
  choice: በባሕሩ ማዶ
  rationale: πέραν ከባለቤት ቅጽ ጋር በባሕሩ ማዶ ያለውን ስፍራ ያመለክታል፤ «በባሕሩ ማዶ» ግልጽና ተፈጥሯዊ ነው።
- source_word: εἶπον αὐτῷ
  choice: አሉት
  rationale: የλέγωን ቀጥተኛ ትርጉም ይጠብቃል፤ ንግግሩ ጥያቄ ቢሆንም «ጠየቁት» ብሎ በትርጓሜ አይተካውም።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: የአይሁድን ታሪካዊ አውድና ልዩ የአክብሮት መጠሪያ ለመጠበቅ ቃሉ በድምፅ ተቀርጾ ቀርቧል።
- source_word: πότε ὧδε γέγονας
  choice: ወደዚህ መቼ መጣህ?
  rationale: γέγονας በዚህ አውድ ወደ ስፍራው መድረስን ያመለክታል፤ «ወደዚህ መቼ መጣህ?» የጥያቄውን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions: []
