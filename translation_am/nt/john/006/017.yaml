  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: am
  text: ወደ ጀልባም ገብተው፣ ባሕሩን እያቋረጡ ወደ ቅፍርናሆም[a] ይሄዱ ነበር። ቀድሞውኑም ጨልሞ ነበር[b]፤ ኢየሱስም ገና ወደ እነርሱ አልመጣም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ባሕሩ ማዶ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ጨለማም ቀድሞውኑ ወድቆ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: ወደ ጀልባም ገብተው
  rationale: የግሪኩን ቀዳሚ ድርጊት በተፈጥሯዊ የአማርኛ አያያዥ ግስ ያሳያል፤ πλοῖον በዐውዱ መሠረት ‘ጀልባ’ ተብሏል።
- source_word: ἤρχοντο
  choice: እየሄዱ ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይነት ያለው እንቅስቃሴ ይጠብቃል።
- source_word: πέραν τῆς θαλάσσης
  choice: ባሕሩን ተሻግረው
  rationale: ወደ ማዶ የሚደረገውን እንቅስቃሴ ተፈጥሯዊ በሆነ አማርኛ ይገልጣል፤ θάλασσα የሚለውም ‘ባሕር’ ተብሎ ተጠብቋል።
- source_word: εἰς Καφαρναούμ
  choice: ወደ ቅፍርናሆም
  rationale: የቦታውን ስም በተለመደው የአማርኛ ቅርጽ ያቀርባል።
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: ቀድሞውኑም ጨልሞ ነበር
  rationale: የፕሉፐርፌክት ቅርጹ የሚያሳየውን አስቀድሞ የተፈጠረ እና የቀጠለ ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς
  choice: ኢየሱስም ገና ወደ እነርሱ አልመጣም ነበር
  rationale: οὔπωን ‘ገና ... አል-’ በሚለው ተፈጥሯዊ አወቃቀር ያሳያል፤ πρὸς αὐτούςንም ሳይተረጉም ‘ወደ እነርሱ’ ብሎ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የትረካው የጊዜ ቅደም ተከተልና የግስ ገጽታ
  choice: ወደ ጀልባ መግባታቸውን እንደ ቀዳሚ ድርጊት፣ ጉዟቸውን እንደ ቀጣይ እንቅስቃሴ፣ ጨለማውንና የኢየሱስን አለመምጣት ደግሞ በዚያ ጊዜ እንደነበሩ ሁኔታዎች ማቅረብ
  alternative: ἤρχοντοን ‘ሄዱ’፣ ἐγεγόνειንም ‘ጨለማ ነበር’ በሚል ቀለል አድርጎ መተርጎም
  rationale: ይህ አቀራረብ የግሪኩን የጊዜና የግስ ገጽታ ልዩነት እንዲሁም ወደሚቀጥለው ትረካ የሚያመራውን ውጥረት ይጠብቃል፤ ተጨማሪ የሃይማኖት ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትረካው ተከታታይነት በ‘ገብተው ... እየሄዱ ነበር’ ተጠብቋል፤ የምንጩ አገናኞችም በ‘ም’ ቅጥያ በተፈጥሯዊ ሁኔታ ተንጸባርቀዋል።
