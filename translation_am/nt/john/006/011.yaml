  rationale: የትረካውንና የሐሳቡን ቅጥያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς ἄρτους
  choice: እንጀራዎቹን
  rationale: ብዙ ቁጥርን ጠብቆ በዚህ የማብላት ትረካ ውስጥ ያሉትን የእንጀራ ክፍሎች ወይም እንጀራዎች ያመለክታል።
- source_word: εὐχαριστήσας
  choice: ካመሰገነ በኋላ
  rationale: የአኦሪስት ቦዝ አንቀጹ ከዋናው ድርጊት በፊት የተፈጸመ መሆኑን ያሳያል፤ በግሪኩ ያልተገለጸውን ተቀባይ አይጨምርም።
- source_word: διέδωκεν
  choice: አከፋፈላቸው
  rationale: በሕዝቡ መካከል የማከፋፈልን ትርጉም ይጠብቃል፤ ተውላጠ ስሙም ወደ እንጀራዎቹ ይመለሳል።
- source_word: τοῖς ἀνακειμένοις
  choice: ለምግብ ተቀምጠው ለነበሩት
  rationale: ቃሉ በቀጥታ ለምግብ መደገፍን ወይም መጋደምን ቢያመለክትም፣ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ የሆነው ይህ ነው፤ ቀጥተኛው ምስል በማስታወሻ ተጠብቋል።
- source_word: ὁμοίως καὶ
  choice: እንዲሁ
  rationale: በእንጀራውና በዓሣው መካከል ያለውን ትይዩ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκ τῶν ὀψαρίων
  choice: ከዓሦቹም
  rationale: ὀψάριον ከእንጀራ ጋር የሚበላ ዓሣን፣ ምናልባትም ትንንሽ ዓሦችን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ግን ከልክ በላይ እንዳይወስን “ዓሦቹ” ተመርጧል።
- source_word: ὅσον ἤθελον
  choice: የፈለጉትን ያህል
  rationale: የሚበሉት መጠን በራሳቸው ፍላጎት መሠረት እንደነበር በግልጽና ተፈጥሯዊ ቋንቋ ይገልጻል።
theological_decisions:
- issue: በዚህ የማብላት ትረካ ውስጥ εὐχαριστήσας ሊኖረው የሚችለው የቁርባን አስተጋባ
  choice: “ካመሰገነ በኋላ” ተብሎ ያለ ሥርዓተ አምልኮ ማስፋፊያ ተተርጉሟል።
