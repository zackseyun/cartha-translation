  source_fidelity: The draft accurately conveys Jesus’ taking the loaves, giving thanks, distributing to the diners, and providing fish in the desired quantity. However, using a new verb, “ሰጣቸው,” for the fish slightly weakens the explicit parallel distributive action expressed by ὁμοίως καὶ and the understood repeated verb διέδωκεν. The wording for thanksgiving can also be made more idiomatic without specifying an unstated recipient.
