  rationale: ግሱ በቀጥታ “አመሰገነ” ማለት ነው። በዮሐንስ አውድ የቁርባን አስተጋባ ሊኖር ቢችልም፣ ትርጉሙ ያንን ትርጓሜ በጽሑፉ ላይ አይጭንም።
