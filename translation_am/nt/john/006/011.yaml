  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: am
  text: ስለዚህ ኢየሱስ እንጀራዎቹን ወስዶ፣ ምስጋና ካቀረበ በኋላ ለምግብ ተቀምጠው ለነበሩት[a] አከፋፈላቸው፤ ከዓሦቹም[b] እንዲሁ የፈለጉትን ያህል አከፋፈላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተደግፈው ወይም ተጋድመው ለነበሩት።” የግሪኩ ቃል በምግብ ላይ ተደግፎ የመመገብን አቀማመጥ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከትንንሾቹ ዓሦች።” የግሪኩ ቃል ከእንጀራ ጋር የሚበላ ዓሣን፣ ምናልባትም ትንንሽ ዓሦችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
