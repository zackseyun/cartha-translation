  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: am
  text: ሥጋዬ እውነተኛ ምግብ[a] ነውና፣ ደሜም እውነተኛ መጠጥ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እውን የሆነ ምግብ» እና «እውን የሆነ መጠጥ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: ከደም ጋር ያለውን ትይዩነት ይጠብቃል፤ ‘አካል’ የሚለውን ይበልጥ ትርጓሜያዊ አማራጭ አይጭንም።
- source_word: ἀληθής
  choice: እውነተኛ
  rationale: የግሪኩን ቀጥተኛ ኃይልና በዮሐንስ ጽሑፍ ያለውን ክብደት ይጠብቃል፤ ‘እውነተኛው’ የሚለው የተወሰነ አመልካች በግሪኩ ስለሌለ አልተጨመረም።
- source_word: βρῶσις
  choice: ምግብ
  rationale: ቃሉ የመብላትን ድርጊትም ሊያመለክት ቢችልም፣ በዚህ የተሳቢ አወቃቀርና ከπόσις ጋር ባለው ትይዩነት ‘ምግብ’ ተገቢ ነው።
- source_word: αἷμα
  choice: ደም
  rationale: የሥጋና የደምን ትይዩነት በቀጥታ ይጠብቃል።
- source_word: πόσις
  choice: መጠጥ
  rationale: ከ‘ምግብ’ ጋር ተፈጥሯዊ ትይዩ ሲሆን፣ በአውዱ የሚጠጣውን ነገር ያመለክታል።
theological_decisions:
- issue: በቁርባን ክርክር አውድ ἀληθήςን ‘እውነተኛ’ ወይስ ‘እውን/በእርግጥ ያለ’ ብሎ መተርጎም
  choice: እውነተኛ
  alternative: እውን የሆነ / በእርግጥ ያለ
  rationale: ‘እውነተኛ’ የግሪኩን ቃል ቀጥተኛ ኃይል ይጠብቃል፤ ቁጥሩ በቁርባን ሥነ መለኮታዊ ክርክሮች ውስጥ ያለውን ውጥረት ትርጉሙ አስቀድሞ እንዳይፈታ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የሥጋና የደም ትይዩነት፣ እንዲሁም የምግብና የመጠጥ ሚዛናዊ አወቃቀር ተጠብቋል።
