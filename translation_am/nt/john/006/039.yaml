id: JHN.6.39
reference: John 6:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: am
  text: እኔን የላከኝ ፈቃድ ይህ ነው፤ የሰጠኝን ሁሉ አንዳችም እንዳላጣ፣ ነገር ግን በመጨረሻው ቀን እንዳስነሣው ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ግላዊ አገላለጽ፦ “የሰጠኝን ሰዎች ሁሉ … እንዳስነሣቸው።” ግሪኩ በቃል በቃል “የሰጠኝ ሁሉ … እሱ” የሚል የስብስብ ነጠላ አገላለጽ ይጠቀማል።
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: ፈቃድ
  rationale: በዚህ ዐውድ የላኪውን ፍላጎትና ዓላማ በተለመደና ክቡር አማርኛ ያሳያል።
- source_word: τοῦ πέμψαντός με
  choice: እኔን የላከኝ
  rationale: የግሪኩን ግሳዊና ግንኙነታዊ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: እርሱ ከሰጠኝ ሁሉ
  rationale: πᾶν ὃ ያለውን ነጠላ የስብስብ አገላለጽ ይጠብቃል፤ በዐውዱ ሰዎችን ሊያመለክት ቢችልም በግልጽ ወደ ግለሰቦች አይቀይረውም።
- source_word: δέδωκέν
  choice: ሰጠኝ
  rationale: የመስጠቱን የተፈጸመ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል፤ የአሁን ውጤቱም ከዐውዱ ይገባል።
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: አንዳችም እንዳላጠፋ
  rationale: ἀπόλλυμι በዚህ ዐውድ ‘እንዲጠፋ ማድረግ/ማጣት’ የሚለውን ሰፊ ኃይል ይይዛል፤ ‘አንዳችም’ ደግሞ ከስብስቡ ምንም እንዳይጠፋ ያሳያል።
- source_word: ἀναστήσω αὐτὸ
  choice: እንዳስነሣው
  rationale: የፍጻሜ ዘመን ከሞት ማስነሣትን ያሳያል፤ -ው የተባለውም የግሪኩን ነጠላ የስብስብ ተውላጠ ስም ይጠብቃል።
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: በመጨረሻው ቀን
  rationale: የዮሐንስን የፍጻሜ ዘመን አገላለጽ በግልጽና በተለመደ አማርኛ ያቀርባል።
theological_decisions:
- issue: πᾶν ὃ ... αὐτό የሚለውን እንደ ስብስብ ነጠላ መተርጎም ወይስ በግልጽ እንደ ሰዎች ብዙ ቁጥር መተርጎም
  choice: እርሱ ከሰጠኝ ሁሉ ... እንዳስነሣው
  alternative: የሰጠኝን ሁሉ ... እንዳስነሣቸው
  rationale: የግሪኩ ቃላት ገለልተኛ ነጠላ ቅርጽ ያላቸው የስብስብ አገላለጾች ናቸው። ዋናው ትርጉም ይህን ቅርጽ ይጠብቃል፤ ዐውዱ ሰዎችን እንደሚያመለክት የሚያሳየው ግላዊ አቀራረብ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የስብስብ ነጠላው በ‘ሁሉ ... እንዳስነሣው’ ተጠብቋል።
