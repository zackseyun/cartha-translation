lexical_decisions:
- source_word: ἀνῆλθεν
  choice: ወጣ
  rationale: የቦታ እንቅስቃሴን በተፈጥሯዊ አማርኛ ይገልጣል፤ እዚህ ልዩ መንፈሳዊ ዕርገትን አያመለክትም።
- source_word: δὲ
  choice: ከዚያም
  rationale: ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያሳያል።
- source_word: εἰς τὸ ὄρος
  choice: ወደ ተራራው
  rationale: ከ‘ወጣ’ ጋር ተያይዞ ወደ ተወሰነው ተራራ ወይም ተራራማ ስፍራ መውጣትን በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩን የተወሰነ መስተዋድድም በ‘-ው’ ይጠብቃል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በመደበኛው የአማርኛ መጽሐፍ ቅዱስ ስያሜ ተተርጉሟል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ቀላልና ተፈጥሯዊ የቦታ አመልካች ነው።
- source_word: ἐκάθητο
  choice: ተቀመጠ
  rationale: በትረካ ውስጥ የመቀመጥን ድርጊትና ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ ጋር
  rationale: μετά የሚገልጠውን አብሮነት በ‘ከ…ጋር’ ያቀርባል፤ ‘ደቀ መዛሙርት’ ደግሞ የመምህርና የተከታይ ግንኙነትን የሚጠብቅ የተለመደ አማርኛ ቃል ነው።
