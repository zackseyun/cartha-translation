base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: am
  text: ከሰማይ የወረደው እንጀራ ይህ ነው፤ አባቶች[a] በልተው እንደሞቱት ሳይሆን፣ ይህን እንጀራ የሚበላ ለዘላለም[b] ይኖራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ቅድመ አያቶች።” የግሪክኛው “አባቶች” የሚለው ቃል መናውን የበሉትን የእስራኤል ቀደምት አባቶች የሚያመለክት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፦ “ወደ ዘመኑ [ወይም ዓለሙ]።” ይህ ለዘላለም የሚቀጥል ሕይወትን የሚገልጥ ፈሊጣዊ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: እንጀራ ይህ ነው
