- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: ከሰማይ የወረደው
  rationale: ያለፈ ድርጊትን የሚገልጠውን የግሪክኛ ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ የዝምድና ሐረግ ይተረጉማል።
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: አባቶች በልተው እንደሞቱት አይደለም
  rationale: የንጽጽሩን ኃይል ጠብቆ በአማርኛ ተፈጥሯዊ በሆነ አወቃቀር ያቀርባል፤ በግሪክኛው ያልተጠቀሰውን የበሉትን ነገር በዋናው ጽሑፍ አይጨምርም።
- source_word: οἱ πατέρες
  choice: አባቶች
  rationale: የወንድ ፆታ ብዙ ቁጥርን በቀጥታ ይጠብቃል፤ በአውዱ የእስራኤልን ቀደምት አባቶች የሚያመለክት መሆኑን የግርጌ ማስታወሻው ያብራራል።
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: ይህን እንጀራ የሚበላ
  rationale: በአማርኛ ተፈጥሯዊ የሆነ በአጠቃላይ ጊዜ የተገለጸ አገላለጽ ነው፤ τρώγω ሊኖረው የሚችለውን ግልጽ የማኘክ ምስል ሳያጋንን ‘ይበላል’ የሚለውን መሠረታዊ ትርጉም ይጠብቃል።
