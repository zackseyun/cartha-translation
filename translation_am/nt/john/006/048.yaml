  text: እኔ የሕይወት እንጀራው ነኝ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ
  choice: እኔ
  rationale: ግልጽ የመጀመሪያ መደብ ተውላጠ ስም ነው፤ ከ«ነኝ» ጋር በመሆን የኢየሱስን ጠንካራ ራስን መግለጫ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰμι
  choice: ነኝ
  rationale: በዚህ የስም ተሳቢ አወቃቀር ውስጥ ያለውን የአሁን ጊዜ ‘መሆን’ ግስ በተፈጥሯዊ የአማርኛ አያያዝ ይገልጻል።
- source_word: ὁ ἄρτος
  choice: እንጀራ
  rationale: ἄρτος የሚያመለክተውን ዋና የእህል ምግብ ‘እንጀራ’ በሚለው የተለመደና የመጽሐፍ ቅዱስ አማርኛ ቃል ያቀርባል። የግሪኩ መስተዋድድ ያለው የመለየት ኃይል በአማርኛው የስም ተሳቢ አወቃቀር ውስጥ በተፈጥሮ ይገኛል።
- source_word: τῆς ζωῆς
  choice: የሕይወት
  rationale: የግሪኩን የዝምድና አገናኝ በቀጥታ ይጠብቃል፤ ‘ሕይወትን የሚሰጥ’ ብሎ በመተርጎም ትርጓሜውን አይወስንም።
theological_decisions:
- issue: በዮሐንስ ወንጌል ያለው የ«እኔ ነኝ» ንግግር ክርስቶሎጂያዊ ክብደት
  choice: «እኔ … ነኝ» ተብሎ ቀጥተኛ ራስን መግለጫ ሆኖ ተተርጉሟል።
  alternative: «እኔው የሕይወት እንጀራ ነኝ»
  rationale: ἐγώ εἰμι እዚህ ተሳቢ ያለው ንግግር እንጂ ፍጹም የሆነ ብቸኛ ‘እኔ ነኝ’ አይደለም። ስለዚህ የኢየሱስን ጠንካራ ራስን መለየት ይጠብቃል፣ ነገር ግን በግሪኩ የሌለ ተጨማሪ ሥነ መለኮታዊ ሐረግ አያስገባም።
- issue: የ«የሕይወት» ዝምድና ትርጉም
  choice: የዝምድና አገናኙ ሳይፈታ «የሕይወት» ተብሎ ተጠብቋል።
  alternative: «ሕይወትን የሚሰጥ»
  rationale: τῆς ζωῆς የእንጀራውን ከሕይወት ጋር ያለ ዝምድና በጥቅል ይገልጻል። ‘ሕይወትን የሚሰጥ’ ትክክለኛ አንድምታ ሊሆን ቢችልም ከምንጩ የበለጠ ይተረጉማል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። አጭሩ የግሪክ ንግግር አጭርነቱንና ክብደቱን እንዲጠብቅ ተደርጓል፤ የግሪኩን የጾታ ቅርጽ በአማርኛ ላይ በማስገደድ «እንጀራው» አልተባለም።
