review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves both occurrences of οὖν, the Johannine term σημεῖον as ምልክት, the work-focused force of ἐργάζῃ, and the distinction created by πιστεύω with the dative σοι. However, አይተን (‘having seen/after seeing’) does not directly represent the coordinate subjunctive ἴδωμεν within the ἵνα clause. The source calls for ‘that we may see and believe you.’
  naturalness: The proposed revision uses a coordinated purpose expression, እንድናይና እንድናምንህ, which is clear and natural modern standard Amharic. Adding አንተ appropriately conveys the emphatic σὺ without making the challenge unnatural.
  terminology: ምልክት and ሥራ are suitable and retain the rhetorical distinction between ποιεῖς and ἐργάζῃ. እንድናምንህ properly maintains the dative construction’s sense, rather than replacing it with the distinct Johannine formulation ‘believe in you.’
  issues:
  - severity: medium
    issue: አይተን is used for ἴδωμεν.
    rationale: አይተን is a conjunctive participial form (‘having seen’), whereas ἴδωμεν is a subjunctive coordinated with πιστεύσωμεν under ἵνα. Rendering both with እንድና… forms preserves the purpose construction and coordination.
