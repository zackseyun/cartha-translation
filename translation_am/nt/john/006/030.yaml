  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: am
  text: ስለዚህ እንዲህ አሉት፤ “እንግዲያው፣ እኛ አይተን እንድናምንህ[a] አንተ ምን ምልክት ታደርጋለህ? ምን ሥራ ትሠራለህ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “በአንተ እንድናምን” ወይም “እንድንታመንብህ።” የግሪኩ ይበልጥ ቀጥተኛ ትርጉም “እንድናምንህ” የሚል ነው፤ በዮሐንስ ወንጌል ከተለመደው “በእርሱ ማመን” ከሚለው አገላለጽ ይልቅ ዳቲቭ ተውላጠ ስምን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: ስለዚህ እንዲህ አሉት
  rationale: የአነጋገሩን ምክንያታዊ ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Τί οὖν
  choice: እንግዲያው ... ምን
  rationale: ሁለተኛውን οὖν ሳይጥል የጠያቂዎቹን ተግዳሮታዊ አጽንዖት ይጠብቃል።
- source_word: ποιεῖς σὺ σημεῖον
  choice: ምን ምልክት ታደርጋለህ
  rationale: σημεῖονን የዮሐንስን ቁልፍ ቃል በሚጠብቀው ‘ምልክት’ ተርጉሞ፣ የσὺን አጽንዖት በግስ ውስጥ ባለው ሁለተኛ መደብ ቅጽ ያስተላልፋል።
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: እኛ አይተን እንድናምንህ
  rationale: ἵνα የሚያሳየውን ዓላማ ይጠብቃል፤ πιστεύω ከዳቲቭ σοι ጋር ያለውን ቀጥተኛ ‘አንተን/የምትለውን ማመን’ ትርጉም ‘እንድናምንህ’ በማለት ከ‘በአንተ ማመን’ ይለያል።
- source_word: τί ἐργάζῃ
  choice: ምን ሥራ ትሠራለህ
  rationale: ἐργάζομαι ያለውን የመሥራት/ሥራ ማከናወን ስሜት እና ከቀደመው ποιεῖς ጋር ያለውን ንግግራዊ ትይዩነት ይጠብቃል።
theological_decisions:
- issue: πιστεύω ከዳቲቭ σοι ጋር ያለው ኃይል
  choice: እንድናምንህ
  alternative: በአንተ እንድናምን / እንድንታመንብህ
  rationale: ግሪኩ εἰς ከአኩዛቲቭ ጋር የሚጠቀመውን የዮሐንስ የተለመደ አገላለጽ ሳይሆን ዳቲቭ ተውላጠ ስም ይጠቀማል። ዋናው ጽሑፍ ይህን ልዩነት ይጠብቃል፤ ሊኖሩ የሚችሉ ሌሎች አረዳዶች በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ምልክት’ እና ‘ሥራ’ የሚሉት ቃላት የግሪኩን ቁልፍ ቃላትና ትይዩ አወቃቀር ይጠብቃሉ።
