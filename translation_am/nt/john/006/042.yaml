  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: am
  text: እንዲህም ይሉ ነበር፦ “ይህ እኛ አባቱንና እናቱን የምናውቃቸው የዮሴፍ ልጅ ኢየሱስ አይደለምን? ታዲያ አሁን ‘ከሰማይ ወርጃለሁ’ እንዴት ይላል?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ ቀጣይነት ያለውን ወይም የተደጋገመውን ንግግር ስለሚያመለክት፣ የአማርኛው አገላለጽ ይህን ገጽታ ይጠብቃል።
- source_word: Οὐχ οὗτός ἐστιν
  choice: ይህ … አይደለምን?
  rationale: ሰሚዎቹ እንዲስማሙበት የሚጠበቅበትን አሉታዊ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: የዮሴፍ ልጅ
  rationale: የዝምድናውን አገላለጽ በግልጽና በተፈጥሯዊ አማርኛ ይጠብቃል፤ ሕዝቡ በሚያውቁት ሰብአዊ ቤተሰብ ላይ የሰጠውን አጽንዖትም አያጠፋም።
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: አባቱንና እናቱን እኛ እናውቃቸዋለን
  rationale: ἡμεῖς የሚለውን አጽንዖት ‘እኛ’ በማለት ይጠብቃል፤ አባቱንና እናቱን እንደሚያውቁ የሚናገሩትንም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πῶς νῦν λέγει
  choice: ታዲያ አሁን … እንዴት ይላል?
  rationale: πῶςን ‘እንዴት’፣ νῦνን ‘አሁን’ በማለት በቀጥታ ይጠብቃል፤ ‘ታዲያ’ ደግሞ ከቀደመው ክርክር ጋር ያለውን ተፈጥሯዊ የአማርኛ ግንኙነት ያሳያል።
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ
  rationale: የመነሻን ወይም የምንጭን ሐሳብ በመደበኛና በግልጽ አማርኛ ይገልጻል።
- source_word: καταβέβηκα
  choice: ወርጃለሁ
  rationale: የግሪኩን ፍጹም ጊዜ፣ የተፈጸመና አሁንም ጠቀሜታ ያለው መውረድ፣ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ሕዝቡ ኢየሱስ ከሰማይ ስለመጣ የተናገረውን የሚቃወምበት አገላለጽ
  choice: ‘ከሰማይ ወርጃለሁ’ የሚለውን ቀጥተኛ ንግግር እንዳለ ማቆየት
  alternative: ‘ከሰማይ መጥቻለሁ’ ወይም ምሳሌያዊ ትርጉም መስጠት
  rationale: ጽሑፉ ራሱ የሚያቀርበውን የሰማያዊ መነሻ ይገባኛል የሚለውን ንግግርና በዚህ ምክንያት የተነሳውን ቅሬታ ሳያለዝብ ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የትርጓሜ መፍትሔም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ይሉ ነበር’ የንግግሩን ቀጣይነት፣ ‘እኛ’ ደግሞ በግሪኩ ያለውን አጽንዖት ይጠብቃሉ። የጽሑፍ ልዩነቶቹ በዚህ አንቀጽ ዋናውን ትርጉም ስለማይቀይሩ የግርጌ ማስታወሻ አልተጨመረም።
