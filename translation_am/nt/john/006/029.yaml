base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አላቸው፤ “የእግዚአብሔር ሥራ[a] ይህ ነው፤ እርሱ በላከው እንድታምኑ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔር የሚፈልገው ሥራ” ወይም “እግዚአብሔር የሚሠራው ሥራ።” “የእግዚአብሔር ሥራ” የሚለው የግሪክ ሐረግ ከአንድ በላይ መንገድ ሊገባ ይችላል፤ እዚህ ያለው አተረጓጎም ይህን አሻሚነት እንዳለ ያቆየዋል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “እርሱ በላከው እንድትታመኑ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የሁለቱን የግሪክ ግሶች ትርጉም በተፈጥሯዊው የአማርኛ የንግግር አቀራረብ ያቆያል፤ “መልሶ አለ” ከሚለው ይበልጥ ለዘመናዊ አንባቢ ለስላሳ ነው።
- source_word: Τοῦτό ἐστιν
  choice: ይህ ነው
  rationale: አመልካች ተውላጠ ስሙንና አጽንዖቱን በቀጥታ ያስተላልፋል።
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: የእግዚአብሔር ሥራ
  rationale: የግሪኩን የባለቤትነት አገናኝ በቅርብ የሚከተል ሲሆን፣ እግዚአብሔር የሚፈልገውን ሥራ ወይም እርሱ የሚሠራውን ሥራ ሊያመለክት የሚችለውን አሻሚነት አይፈታም።
- source_word: ἵνα πιστεύητε
  choice: እንድታምኑ
  rationale: የἵνα አረፍተ ነገርን በተፈጥሯዊ የአማርኛ አያያዝ ያቀርባል፤ πιστεύωንም በመደበኛው “ማመን” ይተረጉማል።
- source_word: εἰς ὃν ἀπέστειλεν ἐκεῖνος
  choice: እርሱ በላከው
  rationale: πιστεύω εἰς የሚያመለክተውን በአንድ ሰው ላይ ማመን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ “እርሱ” የሚለው ላኪውን እግዚአብሔርን ያመለክታል።
theological_decisions:
- issue: የτοῦ θεοῦ አገናኝ ትርጉም
  choice: በዋናው ጽሑፍ “የእግዚአብሔር ሥራ” የሚለውን አሻሚ አገላለጽ ማቆየት
  alternative: “እግዚአብሔር የሚፈልገው ሥራ” ወይም “እግዚአብሔር የሚሠራው ሥራ”
  rationale: ዐውደ ንባቡ ሰዎች ምን ማድረግ እንዳለባቸው ለጠየቁት ጥያቄ መልስ ቢሆንም፣ የግሪኩ አገናኝ የሚፈለግ ሥራንም ሆነ እግዚአብሔር የሚያደርገውን ሥራ ሊያመለክት ይችላል፤ ትርጉሙ ይህን የሥነ መለኮት ውጥረት አይፈታም።
- issue: πιστεύητε / πιστεύω εἰς የሚለው አገላለጽ
  choice: “በ… እንድታምኑ”
  alternative: “በ… እንድትታመኑ”
  rationale: “ማመን” ለπιστεύω መደበኛና ግልጽ ትርጉም ነው፤ “መታመን” የእምነትን የመደገፍና የመተማመን ገጽታ እንደ ተቀባይነት ያለው አማራጭ በማስታወሻ ቀርቧል።
