  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “እግዚአብሔር” በመጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው ስያሜ ሆኖ ተመርጧል፤ አረፍተ ነገሩም የግሪኩን አጽንዖት ሳያጣ ተፈጥሯዊ ሆኖ ቀርቧል።
