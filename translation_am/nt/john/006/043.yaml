  rationale: በቡድኑ ውስጥ አንዱ ከሌላው ጋር የሚያደርገውን የጋራ ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውን የስሙን አጻጻፍ ይከተላል።
