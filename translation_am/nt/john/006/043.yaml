    text: “አታጉረምርሙ” የተተረጎመው ግስ “አታንጎራጉሩ” ወይም “ቅሬታ አታሰሙ” ተብሎም ሊተረጎም ይችላል፤ “አታጉረምርሙ” ግን በዚህ ስፍራ ያለውን መጽሐፍ ቅዱሳዊ የበረሃ ትረካ አስተጋብኦ በተሻለ ሁኔታ ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪክኛውን የንግግር መግቢያ ትርጉም ይጠብቃል፤ ሁለቱን ግሶች ቃል በቃል ‘መለሰና አለ’ ማለት በአማርኛ ከሚፈጥረው ክብደት ይልቅ ይህ አባባል ተፈጥሯዊና ክቡር ነው።
- source_word: Μὴ γογγύζετε
  choice: አታጉረምርሙ
