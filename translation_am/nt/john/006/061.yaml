lexical_decisions:
- source_word: εἰδὼς
  choice: ዐውቆ
  rationale: የግሪኩን አብሮ የሚከናወን አሳታፊ ግስ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: ἐν ἑαυτῷ
