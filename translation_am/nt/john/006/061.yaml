review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the disciples’ grumbling, its referent, and the question concerning σκανδαλίζει. However, “በውስጡ ዐውቆ” is an overly literal and less idiomatic rendering of ἐν ἑαυτῷ in this Amharic sentence.
  naturalness: “በራሱ አውቆ” naturally expresses Jesus’ inward, unreported awareness. “መሆናቸውን” also produces a smoother and clearer Amharic complement construction than “እንደሆነ.”
  terminology: “ደቀ መዛሙርቱ,” “እያጉረመረሙ,” and “ያሰናክላችኋል” are suitable. The main rendering retains the stumble/offense ambiguity, and the footnote appropriately supplies the offense sense.
  issues:
  - severity: low
    issue: “በውስጡ ዐውቆ” is not fully idiomatic in this context.
    rationale: Although it follows the English wording “in himself,” modern standard Amharic more naturally says “በራሱ አውቆ,” while still indicating inward knowledge rather than information received from others.
  - severity: low
    issue: The clause “...እያጉረመረሙ እንደሆነ” has a minor agreement/flow awkwardness.
    rationale: Since the subject is plural, “...እያጉረመረሙ መሆናቸውን” is clearer and idiomatic without changing the aspect or meaning.
  revised_text: ኢየሱስ ግን ደቀ መዛሙርቱ ስለዚህ እያጉረመረሙ መሆናቸውን በራሱ አውቆ፣ “ይህ ያሰናክላችኋል?[a]” አላቸው።
