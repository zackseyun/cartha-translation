  rationale: ኢየሱስ ይህን ከውጫዊ ዘገባ ሳይሆን በራሱ ውስጣዊ ዕውቀት እንዳወቀ የሚያሳየውን ሐሳብ ይጠብቃል።
- source_word: γογγύζουσιν
  choice: እያጉረመረሙ
  rationale: በእርካታ ማጣት የሚነገርን ዝቅተኛ ቅሬታ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περὶ τούτου
  choice: ስለዚህ
  rationale: ወደ ቀደመው የኢየሱስ ንግግር የሚመለሰውን አጭር የግሪክ ሐረግ ያለ ትርጓሜያዊ ጭማሪ ያቀርባል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: በዚህ አውድ ከአሥራ ሁለቱ የሚሰፋውን የተከታዮች ቡድን ሳያጠብ የተለመደውን የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
- source_word: Τοῦτο
  choice: ይህ
  rationale: ግሪኩ ያልጨመረውን ‘ትምህርት’ ወይም ‘ነገር’ የሚል ስም ሳይጨምር አመልካቹን በቀጥታ ያቀርባል።
- source_word: σκανδαλίζει
  choice: ያሰናክላችኋል
  rationale: ቃሉ ያለውን የመሰናከል ምስላዊ ኃይልና ከእምነት የመውደቅ አደጋ ይጠብቃል፤ ቀለል ያለው የቅር መሰኘት ትርጉም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: σκανδαλίζει የስሜታዊ ቅሬታን ወይም ወደ አለማመንና መራቅ የሚያደርስ መሰናከልን ሊያመለክት መቻሉ
  choice: ይህ ያሰናክላችኋል?
  alternative: ይህ ቅር ያሰኛችኋል?
  rationale: ዋናው ጽሑፍ የግሪኩን ምስላዊና ሥነ መለኮታዊ ክብደት ይጠብቃል፤ ሌላው በአውዱ ሊኖር የሚችለው የቅሬታ ትርጉም በእግር ማስታወሻ ቀርቧል።
