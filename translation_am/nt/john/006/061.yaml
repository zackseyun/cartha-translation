  text: ኢየሱስ ግን ደቀ መዛሙርቱ ስለዚህ እያጉረመረሙ መሆናቸውን በራሱ አውቆ፣ “ይህ ያሰናክላችኋል?[a]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
