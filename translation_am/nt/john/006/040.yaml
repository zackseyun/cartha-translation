    text: ወይም፣ “ወልድን በትኩረት የሚመለከት።” ግሱ ተራ በዓይን ማየትን ብቻ ሳይሆን በትኩረት መመልከትንም ሊያመለክት ይችላል።
    reason: lexical_alternative
