id: JHN.6.38
reference: John 6:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: am
  text: ምክንያቱም ከሰማይ የወረድኩት የራሴን ፈቃድ ለማድረግ ሳይሆን፣ የላከኝን ፈቃድ ለማድረግ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ ውስጥ ይህ ቃል ቀደም ሲል ለተነገረው ሐሳብ ምክንያትን ወይም ማብራሪያን ያቀርባል፤ «ምክንያቱም» ይህን አገናኝ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καταβέβηκα
  choice: የወረድኩት
  rationale: ግሱ የተፈጸመና አሁንም ተጽእኖ ያለውን ድርጊት ያመለክታል። የአማርኛው የትኩረት አወቃቀር «የወረድኩት ... ነው» የወረደበትን ዓላማ በግልጽ ያያይዛል።
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: ከሰማይ
  rationale: ሐረጉን በቀጥታና በተፈጥሯዊ አማርኛ ይተረጉማል፤ የሰማያዊ ምንጭን ምስልም ይጠብቃል።
- source_word: οὐχ ἵνα ... ἀλλὰ
  choice: '... ለማድረግ ሳይሆን፣ ... ለማድረግ'
  rationale: የአሉታዊና የአዎንታዊ ዓላማዎቹን ጠንካራ ንጽጽር በተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: ποιῶ
  choice: ለማድረግ
  rationale: «ማድረግ» የግሱ ቀጥተኛና ያልተስፋፋ አቻ ሲሆን፣ ከ«ፈቃድ» ጋር በአማርኛ በተፈጥሮ ይጣመራል።
- source_word: τὸ θέλημα
  choice: ፈቃድ
  rationale: በሁለቱም ቦታዎች ተመሳሳይ ቃል መጠቀም የግሪኩን ትይዩነትና የሐሳቡን ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: τὸ ἐμὸν
  choice: የራሴን
  rationale: የግሪኩን አጽንዖት በመጠበቅ የኢየሱስን ፈቃድ ከላኪው ፈቃድ ጋር በግልጽ ያነጻጽራል።
- source_word: τοῦ πέμψαντός με
  choice: የላከኝን
  rationale: የተወሰነውን አሳታፊ ግስ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ግሪኩ በዚህ ሐረግ ውስጥ ከሚናገረው በላይ የላኪውን ማንነት አይጨምርም።
theological_decisions:
- issue: የኢየሱስ ከሰማይ መውረድና ክርስቶሎጂ
  choice: «ከሰማይ የወረድኩት» በማለት የሰማያዊ ምንጩን አገላለጽ በቀጥታ ማቆየት
  alternative: ንግግሩን የመለኮታዊ ተልእኮ ምሳሌያዊ አገላለጽ ብቻ አድርጎ ማቅለል
  rationale: ጥቅሱ ራሱ መነሻውን በሰማያዊ ቦታ አነጋገር ያቀርባል፤ ትርጉሙ ይህን አያዳክምም፣ ከጽሑፉ በላይ የሆነ የዶክትሪን ማብራሪያም አይጨምርም።
- issue: የወልድ ፈቃድና የላኪው ፈቃድ ግንኙነት
  choice: «ፈቃድ» የሚለውን ቃል በሁለቱም ቦታዎች መጠቀምና ንጽጽሩን ሳይፈታ ማቆየት
  alternative: «እኔ የምፈልገውን / እርሱ የሚፈልገውን» በሚል ይበልጥ ተለዋዋጭ አገላለጽ መተርጎም
  rationale: ጽሑፉ በተልእኮና በታዛዥነት ዐውድ ውስጥ ያለውን እውነተኛ ልዩነት ያቀርባል። «ፈቃድ» ትይዩነቱንና ውጥረቱን ይጠብቃል፤ በኋላ የተቀመጡ ቴክኒካዊ ምድቦችንም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «የወረድኩት ... ሳይሆን ... ነው» የሚለው የትኩረት አወቃቀር የግሪኩን የዓላማ ንጽጽር ተፈጥሯዊ በሆነ መንገድ ያቀርባል። የግርጌ ማስታወሻ አላስፈለገም።
