  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ጥንታዊው ‘ዲናር’ ሳይተካ ተጠብቋል፤ የዋጋውን ዘመናዊ አቻ መገመት ተወግዷል።
