  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: am
  text: ፊልጶስም፣ “እያንዳንዳቸው ጥቂት እንኳ እንዲያገኙ፣ በሁለት መቶ ዲናር የሚገዛ እንጀራ እንኳ አይበቃቸውም” ብሎ መለሰለት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακοσίων δηναρίων
  choice: የሁለት መቶ ዲናር
  rationale: የጥንቱን የገንዘብ መለኪያ በመጠበቅ የግሪኩን ትርጉም በቀጥታ ያስተላልፋል።
- source_word: ἄρτοι
  choice: እንጀራ
  rationale: በዐውዱ ለሕዝቡ የሚገዛ የዕለት ምግብን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βραχύ τι
  choice: ጥቂት እንኳ
  rationale: እያንዳንዱ ሰው የሚያገኘው መጠን እጅግ አነስተኛ መሆኑን ያሳያል።
- source_word: ἀπεκρίθη αὐτῷ
  choice: መለሰለት
  rationale: ‘ለእርሱ መለሰ’ የሚለውን ትርጉም በተፈጥሯዊና አጭር አማርኛ ያቀርባል።
theological_decisions:
- issue: ἵνα የሚያመለክተው ዓላማ ወይም ውጤት
  choice: እያንዳንዳቸው ጥቂት እንኳ እንዲያገኙ
  alternative: እያንዳንዳቸው ጥቂት ቢያገኙ እንኳ
  rationale: የግሪኩን ዓላማ/ውጤት አወቃቀር ሳይጠብብ ይጠብቃል፤ ንግግሩም ሁሉም ጥቂት እንኳ እንዲያገኙ ይህ መጠን እንደማይበቃ ያሳያል።
