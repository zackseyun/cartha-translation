- source_word: ἦλθον εἰς Καφαρναούμ
  choice: ወደ ቅፍርናሆም መጡ
  rationale: የἔρχομαιን መሠረታዊ ‘መጣ’ ትርጉም በትረካዊ አማርኛ ይጠብቃል።
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: ኢየሱስን እየፈለጉ
  rationale: በዚህ አውድ ζητέω አንድን ሰው ለማግኘት መፈለግን ያመለክታል፤ አላስፈላጊ መንፈሳዊ ፍቺ አይጨምርም።
