base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: am
  text: ስለዚህ ሕዝቡ ኢየሱስ በዚያ እንዳልነበረና ደቀ መዛሙርቱም እንዳልነበሩ ባየ ጊዜ፣ እነርሱ ራሳቸው በጀልባዎቹ[a] ተሳፍረው ኢየሱስን እየፈለጉ ወደ ቅፍርናሆም መጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በትናንሽ ጀልባዎቹ”፤ የግሪኩ ቃል “ጀልባ” ለሚለው ቃል አነስተኛነትን የሚያመለክት ቅርጽ ነው።
    reason: lexical_alternative
lexical_decisions:
