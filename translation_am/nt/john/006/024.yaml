- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: ኢየሱስ በዚያ እንዳልነበረና ደቀ መዛሙርቱም እንዳልነበሩ
  rationale: የኢየሱስንና የደቀ መዛሙርቱን አለመኖር ለየብቻ በግልጽ ሁኔታ ያስቀምጣል።
- source_word: ἐνέβησαν αὐτοὶ
  choice: እነርሱ ራሳቸው … ተሳፍረው
  rationale: ἐνέβησανን ለጀልባ ተስማሚ በሆነ ‘ተሳፈሩ’ ይተረጉማል፤ αὐτοὶ ያለውን አጽንዖት ‘እነርሱ ራሳቸው’ ይጠብቃል።
- source_word: τὰ πλοιάρια
  choice: ጀልባዎቹ
