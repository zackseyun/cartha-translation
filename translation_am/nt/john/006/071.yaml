base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: am
  text: ኢየሱስ ስለ ስምዖን ልጅ ስለ አስቆሮቱ ይሁዳ ይናገር ነበር፤ ይህ ሰው ኢየሱስን ሊከዳ[a] የነበረ ከአሥራ ሁለቱ አንዱ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “አሳልፎ ሊሰጠው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: ኢየሱስ ይናገር የነበረው … ስለ … ይሁዳ ነበር
  rationale: የግሪኩ አላፊ ጊዜ ቀጣይ ወይም ገላጭ ድርጊትን ያመለክታል። በአማርኛ ማጣቀሻው ግልጽ እንዲሆን የተሰወረው ባለቤት ‘ኢየሱስ’ ተገልጧል፤ δέ የዋህ የንግግር ሽግግር ስለሆነ የተለየ ቃል አልተጨመረለትም።
- source_word: Σίμωνος Ἰσκαριώτου
  choice: የስምዖን ልጅ … አስቆሮቱ ይሁዳ
  rationale: ሁለቱን የግሪክ ባለቤትነት ቅርጾች ይሁዳን በአባቱ ስም እንደሚለዩት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: የአመልካቹን አጽንዖት ከተራ ‘እርሱ’ ይልቅ በግልጽና ተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: ἔμελλεν παραδιδόναι αὐτόν
  choice: ኢየሱስን ሊከዳው ነበር
  rationale: μέλλω ወደፊት ሊፈጸም ያለን ድርጊት ያሳያል፤ παραδίδωμι በይሁዳ ታሪክ አውድ ‘መክዳት’ የሚለውን ግንኙነታዊና ትረካዊ ኃይል ይይዛል። የተውላጠ ስሙ ማጣቀሻ በአማርኛ እንዳያሻማ ‘ኢየሱስን’ ተብሎ ተገልጧል።
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: ከአሥራ ሁለቱ አንዱ ሆኖ ሳለ
  rationale: ከዳተኛው ከአሥራ ሁለቱ መካከል መሆኑን የሚያጎላውን የአባሪ ሐረግ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: παραδιδόναι ለይሁዳ ድርጊት የተጠቀመበት ትርጉም
  choice: ሊከዳው
  alternative: አሳልፎ ሊሰጠው
  rationale: ግሱ ቃል በቃል ‘አሳልፎ መስጠት’ ሊባል ቢችልም፣ በዮሐንስ የሕማማት ትረካ የይሁዳን ድርጊት እንደ ክህደት ያቀርባል። ይህ ከአውዱ የተነሣ የቃላት ምርጫ እንጂ ተጨማሪ የእምነት አቋም አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ገላጭ ትረካ፣ የοὗτος አጽንዖትና ከአሥራ ሁለቱ አንዱ መሆኑ የሚፈጥረው ውጥረት ተጠብቋል።
