  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: am
  text: እነዚህን ነገሮች በቅፍርናሆም በምኩራብ ሲያስተምር ተናገረ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ይህን
  rationale: የግሪኩ ገለልተኛ ብዙ ቁጥር አመልካች ወደ ቀደመው ንግግር በአጠቃላይ ይመለሳል፤ በአማርኛ ‘ይህን’ ማለት ያንን የንግግር ይዘት ተፈጥሯዊ በሆነ መንገድ ይይዛል።
- source_word: εἶπεν
  choice: የተናገረው
  rationale: የλέγω ያለፈ ጊዜ ቅርጽ በቀጥታ የመናገርን ድርጊት ያመለክታል፤ የዓረፍተ ነገሩ አወቃቀር በግሪኩ በዐውዱ የሚታወቀውን ኢየሱስን ስሙን ሳይጨምር ያመለክታል።
- source_word: ἐν συναγωγῇ
  choice: በምኩራብ
  rationale: ‘ምኩራብ’ የአይሁድን የጉባኤና የትምህርት ስፍራ በመደበኛ የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይገልጻል። ግሪኩ መስተዋድድ ባይኖረውም በዐውዱ የቅፍርናሆምን የታወቀ ምኩራብ ሊያመለክት ይችላል፤ አማርኛ ግን እዚህ በተፈጥሮ ያለ ወሳኝ አመልካች ይቀርባል።
- source_word: διδάσκων
  choice: ሲያስተምር
  rationale: የአሁን ጊዜ አካፋይ ከዋናው ድርጊት ጋር በአንድ ጊዜ የተካሄደውን ቀጣይ የማስተማር ድርጊት ያሳያል።
- source_word: ἐν Καφαρναούμ
  choice: በቅፍርናሆም
  rationale: የቦታው ስም በአማርኛ የተለመደውን ‘ቅፍርናሆም’ ቅርጽ ይከተላል፤ ‘በ’ የግሪኩን የቦታ አመልካች በተፈጥሮ ያስተላልፋል።
