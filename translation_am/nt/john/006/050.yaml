base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: am
  text: ይህ ከሰማይ የሚወርደው እንጀራ ነው፤ ማንም ከእርሱ በልቶ እንዳይሞት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንዳይሞት” የሚለው አገላለጽ እዚህ በሰፊው ተቀምጧል፤ በአውዱ አንዳንዶች የመጨረሻ ሞትን፣ መንፈሳዊ ሞትን፣ ወይም በፍጻሜ የሚሆን ጥፋትን እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: ይህ
  rationale: ጠቋሚው ኢየሱስ እየለየ የሚጠቅሰውን እንጀራ ያመለክታል፤ ‘ይህ’ ቀጥተኛነቱን ይጠብቃል።
- source_word: ἄρτος
  choice: እንጀራ
  rationale: በአማርኛ ለመሠረታዊ ምግብና ለ‘bread’ የተለመደው ቃል ነው፤ በዮሐንስ 6 ያለውን ቀጥተኛና ምሳሌያዊ ኃይል ሳይተረጉም ይጠብቃል።
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: ከሰማይ የሚወርደው
  rationale: የአሁን ጊዜውን ተሳቢ ቅርጽ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል፤ ድርጊቱን እንደ ቀድሞ የተጠናቀቀ አያደርገውም።
- source_word: οὐρανός
  choice: ሰማይ
  rationale: በዮሐንሳዊው አውድ መለኮታዊውን ሰማያዊ መኖሪያ ያመለክታል፤ ቃሉም በአማርኛ ይህን ትርጉም በተፈጥሮ ይሸከማል።
- source_word: ἵνα
  choice: እንዳይ-
  rationale: የዓላማ/ውጤት ግንኙነቱን በተፈጥሯዊ የአማርኛ ግስ አገባብ ይገልጣል።
- source_word: τις
  choice: ማንም
  rationale: አጠቃላይና ላልተወሰነ ሰው ክፍት የሆነውን ኃይል ይጠብቃል።
- source_word: ἐξ αὐτοῦ
  choice: ከእርሱ
  rationale: ἐκ/ἐξ የሚገልጠውን ‘ከእሱ መብላት’ በቀጥታ ይጠብቃል፤ የእንጀራው ምሳሌያዊ ማጣቀሻ ሰዋዊ መሆኑን ስለሚጠቁም ‘ከእርሱ’ ተመርጧል።
- source_word: φάγῃ
  choice: በልቶ
  rationale: በἵνα ዓላማ ሐረግ ውስጥ ያለውን የአንድ ጊዜ ድርጊት በተፈጥሯዊ የአማርኛ ተያያዥ ግስ ያቀርባል።
- source_word: μὴ ἀποθάνῃ
  choice: እንዳይሞት
  rationale: ‘መሞት’ የግሱን ቀጥተኛ ትርጉም ይጠብቃል፤ መንፈሳዊ፣ ዘላለማዊ ወይም አካላዊ ሞት ብሎ አይገድበውም።
theological_decisions:
- issue: ‘እንዳይሞት’ የሚለው ሞት ባሕርይ
  choice: ‘እንዳይሞት’ የሚለውን ሰፊ አገላለጽ ሳይገድቡ ማቆየት
  alternative: ‘በመንፈስ እንዳይሞት’ ወይም ‘ለዘላለም እንዳይጠፋ’
  rationale: የሕይወት እንጀራ ንግግር ከተራ እንጀራ ጋር ቢያነጻጽርም፣ ይህ ቁጥር የሞቱን ዓይነት በግልጽ አይወስንም። ቀጥተኛውን አገላለጽ ማቆየት የዮሐንስን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአሁን ጊዜ ተሳቢ ‘የሚወርደው’ ተብሎ ተጠብቋል። ዋናው ጽሑፍ ከምንጩ የማይነሳ የትርጉም ገደብ እንዳያስገባ አንድ የማብራሪያ ማስታወሻ ብቻ ተጨምሯል።
