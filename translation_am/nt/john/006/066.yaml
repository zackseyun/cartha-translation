  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: am
  text: ከዚያን ጊዜ ጀምሮ ከደቀ መዛሙርቱ ብዙዎች ወደ ኋላ ተመለሱ፤ ዳግመኛም ከእርሱ ጋር አልሄዱም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ምክንያት ከደቀ መዛሙርቱ ብዙዎች ሄዱ”። የግሪኩ መክፈቻ የምክንያት ትርጉም ሊኖረው ይችላል፤ በዐውዱ ግን “ከዚያን ጊዜ ጀምሮ” የሚለው የለውጥ ነጥብ ሐሳብ ይበልጥ ይስማማል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: ከዚያን ጊዜ ጀምሮ
  rationale: በዐውዱ ውስጥ የጊዜ መለወጫ ነጥብን፣ ‘ከዚያን ጊዜ ጀምሮ’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የምክንያት ትርጉሙ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ ብዙዎች
  rationale: ἐκ የሚያመለክተውን ከትልቁ የደቀ መዛሙርት ቡድን መካከል ብዙዎች መሆናቸውን በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: ወደ ኋላ ተመለሱ
  rationale: ከቦታ መሄድን ብቻ ሳይሆን መሸሽንና ከቀድሞው ጉዞ ወደ ኋላ ማፈግፈግን የሚያሳየውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: οὐκέτι
  choice: ከእንግዲህ
  rationale: ከዚያ ነጥብ በኋላ ድርጊቱ መቋረጡን በግልጽ ያሳያል።
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: ከእርሱ ጋር ... አልተመላለሱም
  rationale: ‘ከእርሱ ጋር መራመድ’ የሚለውን ምስላዊ አነጋገር ጠብቆ ቀጣይ ኅብረትንና ተከታይነትን ያመለክታል፤ ‘መከተል’ ብሎ ትርጉሙን አያጠብም።
theological_decisions:
- issue: μαθηταί የሚለው ቃል አሥራ ሁለቱን ወይም እውነተኛ አማኞችን ብቻ ያመለክት እንደሆነ
  choice: ደቀ መዛሙርቱ
  alternative: ተከታዮቹ
  rationale: ጽሑፉ ከኢየሱስ ደቀ መዛሙርት መካከል ብዙዎች መመለሳቸውን ብቻ ይናገራል፤ ከአሥራ ሁለቱ ጋር አያንድም፣ ስለ ውስጣዊ እምነታቸውም በትርጉሙ ውስጥ የኋላ ዘመን የነገረ መለኮት ፍርድ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርት’ እና ‘ተመላለሱ’ በመጽሐፍ ቅዱሳዊ አውድ የታወቁ ቢሆኑም አሁንም ግልጽና ክቡር ናቸው።
