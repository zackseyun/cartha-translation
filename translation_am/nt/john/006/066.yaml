review_pass:
  verdict: revise
  source_fidelity: The temporal sense of Ἐκ τούτου, the partitive sense of ἐκ τῶν μαθητῶν αὐτοῦ, their withdrawal expressed by ἀπῆλθον εἰς τὰ ὀπίσω, and the cessation expressed by οὐκέτι are all conveyed. A small wording adjustment makes the final imperfect phrase more idiomatic while retaining its ongoing-association sense.
  naturalness: “አልተመላለሱም” can suggest repeated trips back and forth in ordinary modern Amharic. “ዳግመኛ ከእርሱ ጋር አልሄዱም” is clearer and idiomatic in this narrative context, while still representing the metaphorical/literal ‘walk with him.’
  terminology: “ደቀ መዛሙርቱ” is the appropriate established term and does not identify these people with the Twelve or prejudge their inward status. The footnote appropriately preserves the possible causal reading of Ἐκ τούτου.
  issues:
  - severity: low
    issue: The wording “ከእርሱም ጋር ከእንግዲህ አልተመላለሱም” is slightly unnatural and may imply repeated physical journeys.
    rationale: The Greek περιεπάτουν is an imperfect denoting their former continuing association with Jesus, not specifically repeated back-and-forth movement. Using “ዳግመኛ … አልሄዱም” naturally states that they no longer continued with him.
  revised_text: ከዚያን ጊዜ ጀምሮ ከደቀ መዛሙርቱ ብዙዎች ወደ ኋላ ተመለሱ፤ ዳግመኛም ከእርሱ ጋር አልሄዱም።[a]
