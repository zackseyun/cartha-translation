- from: ከዚያን ጊዜ ጀምሮ ከደቀ መዛሙርቱ ብዙዎች ወደ ኋላ ተመለሱ፤ ከእርሱም ጋር ከእንግዲህ አልተመላለሱም።[a]
  to: ከዚያን ጊዜ ጀምሮ ከደቀ መዛሙርቱ ብዙዎች ወደ ኋላ ተመለሱ፤ ዳግመኛም ከእርሱ ጋር አልሄዱም።[a]
