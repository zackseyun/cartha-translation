  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: am
  text: ስለዚህ እነርሱ፣ “ጌታ ሆይ፣[a] ይህን እንጀራ ሁልጊዜ ስጠን” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክቡር ሆይ።” የግሪኩ መጠሪያ ከ‘ጌታ’ ትርጉም በተጨማሪ የአክብሮት አነጋገር ሆኖም ሊያገለግል ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  choice: ስለዚህ እነርሱ … አሉት
  rationale: የንግግሩን ቀጣይነትና ውጤት የሚያመለክተውን οὖν በ‘ስለዚህ’ ያስተላልፋል፤ πρὸς αὐτόν የንግግሩን ተቀባይ በአማርኛው ‘አሉት’ ውስጥ በተፈጥሮ ይገልጣል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριος በቀጥታ ጥሪ የሚኖረውን ክብርና ሊኖረው የሚችለውን ጥልቅ ትርጉም ይጠብቃል፤ ‘ሆይ’ የጥሪውን ቅርጽ በተፈጥሮ ያሳያል።
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: ቀጣይ ወይም በሁሉም ጊዜ የሚደረግ አቅርቦትን የሚጠይቀውን ቀጥተኛ ትርጉም ይገልጣል።
- source_word: δὸς ἡμῖν
  choice: ስጠን
  rationale: የቀጥታ ልመናውን ትእዛዛዊ ቅርጽና የ‘ለእኛ’ን ተቀባይነት በአንድ ተፈጥሯዊ የአማርኛ ግስ ያቀርባል።
- source_word: τὸν ἄρτον τοῦτον
  choice: ይህን እንጀራ
  rationale: ἄρτοςን በተለመደው ‘እንጀራ’ ይተረጉማል፤ ይህ በአማርኛ አጠቃቀም ሰፊውን የምግብ እንጀራ/ዳቦ ጽንሰ ሐሳብ ሊወክል ይችላል። τοῦτον ደግሞ ከቀደመው ውይይት ጋር ያለውን ጠቋሚ ግንኙነት በ‘ይህን’ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስን በቀጥታ ሲጠሩ κύριος የሚለውን መተርጎም
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ሆይ
  rationale: ‘ጌታ ሆይ’ የግሪኩን የክብር መጠሪያ ይጠብቃል፤ ሕዝቡ ቃሉን በሙሉ ክርስቶሳዊ እውቅና ተጠቅሞበት እንደሆነ ሳይወስን፣ ቃሉ ከአክብሮታዊ አነጋገር እስከ ጥልቅ ጌትነት ድረስ ያለውን ክፍት ትርጉም ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛው ተፈጥሯዊ የንግግር ቅደም ተከተል ተከትሏል፤ የκύριος አሻሚነት በማስታወሻ ተጠብቋል።
