  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: am
  text: በማግስቱ፣ በባሕሩ ማዶ ቆሞ የነበረው ሕዝብ፣ ከአንዲት ትንሽ ጀልባ[a] በቀር ሌላ ትንሽ ጀልባ በዚያ እንዳልነበረች፣ ኢየሱስም ከደቀ መዛሙርቱ ጋር ወደ ጀልባው[b] እንዳልገባ፣ ደቀ መዛሙርቱ ግን ብቻቸውን እንደሄዱ አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጀልባ»፤ እዚህ ላይ የግሪኩ ቃል πλοιάριον አነስተኛነትን የሚያመለክት ቅርጽ አለው።
    reason: lexical_alternative
  - marker: b
    text: በዚህ ቁጥር አንዳንድ የእጅ ጽሑፎችና እትሞች «ትንሽ ጀልባ» (πλοιάριον) እና «ጀልባ» (πλοῖον) በሚሉት ቃላት ይለያያሉ፤ ትርጉሙ በእያንዳንዱ ሐረግ የታተመውን የግሪክ ጽሑፍ አንጸባርቋል።
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: በማግስቱ
  rationale: ቀጣዩን ቀን የሚያመለክት ተፈጥሯዊና አጭር የአማርኛ አገላለጽ ነው።
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: ቆሞ የነበረው ሕዝብ
  rationale: የፍጹም አንቀጽ ቅርጹ የቀጠለ ሁኔታን ያመለክታል፤ ይህ አገላለጽ ሕዝቡ በዚያ ቆሞ መቆየቱን ያሳያል።
- source_word: πέραν τῆς θαλάσσης
  choice: በባሕሩ ማዶ
  rationale: ከባሕሩ በሌላኛው ወገን ያለውን ስፍራ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἶδον
  choice: አየ
  rationale: ዋናውን የማየትና የመገንዘብ ትርጉም ይጠብቃል፤ በግሪኩ ብዙ ቁጥር ያለው ግስ ከነጠላው συλλογικό ስም ὄχλος ጋር ሲመጣ፣ በአማርኛ ግን «ሕዝብ» ከሚለው ነጠላ ስም ጋር ተፈጥሯዊው ነጠላ ግስ ተመርጧል።
- source_word: πλοιάριον
  choice: ትንሽ ጀልባ
  rationale: የግሪኩን የአነስተኛነት ቅርጽ ያንጸባርቃል።
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: ከአንዲት ትንሽ ጀልባ በቀር ሌላ ጀልባ በዚያ እንዳልነበረች
  rationale: አንዲት ብቻ እንደነበረች የሚያጎላውን የግሪኩን የማግለል አወቃቀር በግልጽ አማርኛ ይጠብቃል።
- source_word: συνεισῆλθεν
  choice: ከደቀ መዛሙርቱ ጋር ... እንዳልገባ
  rationale: ግሱ ቃል በቃል «አብሮ ገባ» ማለት ስለሆነ፣ ወደ ጀልባው ከእነርሱ ጋር አለመግባቱን በቀጥታ ይገልጻል።
- source_word: εἰς τὸ πλοῖον
  choice: ወደ ጀልባይቱ
  rationale: πλοῖον ከπλοιάριον ይልቅ መደበኛው «ጀልባ» የሚለውን ቃል ይጠይቃል፤ የተወሰነነቱም «-ይቱ» በሚለው ቅጥያ ተገልጿል።
- source_word: μόνοι
  choice: ብቻቸውን
  rationale: ደቀ መዛሙርቱ ኢየሱስ ሳይኖር መሄዳቸውን በተፈጥሯዊ አማርኛ ያጎላል።
- source_word: ἀπῆλθον
  choice: እንደሄዱ
  rationale: የመሄድን ወይም ከቦታው የመለየትን መሠረታዊ ፍቺ ይጠብቃል፤ በὅτι ንዑስ ሐረግ ውስጥ ስለሆነ «እንደ-» ቅርጽ ተጠቅሟል።
