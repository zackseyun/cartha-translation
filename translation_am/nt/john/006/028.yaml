source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: am
  text: እነርሱም እንዲህ አሉት፤ “የእግዚአብሔርን ሥራዎች እንድንሠራ ምን ማድረግ አለብን?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔርን ሥራዎች እንድንሠራ ምን እናድርግ?” የግሪኩ አነጋገር “እግዚአብሔር የሚፈልጋቸውን ሥራዎች” ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  choice: እነርሱም እንዲህ አሉት
  rationale: የትረካውን ቀጣይነት በ«-ም» ያሳያል፤ πρὸς αὐτόν ከንግግር ግስ ጋር ያለውን የተናጋሪና የተነጋጋሪ ግንኙነት «አሉት» በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Τί ποιῶμεν
  choice: ምን ማድረግ አለብን
  rationale: ይህ የምክክር ጥያቄ የሚጠይቀውን ተግባርና የግዴታ ኃይሉን በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα ἐργαζώμεθα τὰ ἔργα
  choice: ሥራዎችን እንድንሠራ
  rationale: «እንድን-» የἵναን ዓላማ ያሳያል፤ «ሥራዎችን እንድንሠራ» በἐργαζώμεθα እና ἔργα መካከል ያለውን የቃል ድግግሞሽ ይጠብቃል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: የግሪኩን የዝምድና ሐረግ በቀጥታ በመጠበቅ፣ ሥራዎቹ እግዚአብሔር የሚፈልጋቸው፣ የእርሱ የሆኑ ወይም ከእርሱ የሚመጡ ስለመሆናቸው ያለውን ክፍት ትርጉም አይዘጋም።
theological_decisions:
- issue: የ«τὰ ἔργα τοῦ θεοῦ» የዝምድና ሐረግ ትርጉም
  choice: በዋናው ጽሑፍ «የእግዚአብሔርን ሥራዎች» ብሎ የግሪኩን ክፍትነት መጠበቅ
  alternative: «እግዚአብሔር የሚፈልጋቸውን ሥራዎች» ወይም «እግዚአብሔር የሚሠራቸውን ሥራዎች»
  rationale: የግሪኩ የዝምድና ቅርጽ ብዙ አተረጓጎሞችን ሊይዝ ይችላል፤ ቁጥር 29 ያለውን የትርጉም ውጥረትም አስቀድሞ መፍታት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አገላለጽ ተመርጧል። «እግዚአብሔር» የተለመደውን የአማርኛ መጽሐፍ ቅዱሳዊ አጠራር ይጠብቃል፤ የጥያቄው አቀራረብ ግን ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
