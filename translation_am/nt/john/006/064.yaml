source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: am
  text: ነገር ግን ከእናንተ መካከል የማያምኑ አንዳንዶች አሉ። ኢየሱስ የማያምኑት እነማን እንደሆኑና እርሱን አሳልፎ የሚሰጠውም[a] ማን እንደሆነ ከመጀመሪያ ጀምሮ ያውቅ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን የሚክደውም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξ ὑμῶν
  choice: ከእናንተ መካከል
  rationale: ሰዎቹ ኢየሱስ እያነጋገረው ባለው ቡድን ውስጥ መሆናቸውን በግልጽና በተፈጥሯዊ አነጋገር ይገልጣል።
- source_word: οἳ οὐ πιστεύουσιν / οἱ μὴ πιστεύοντες
  choice: የማያምኑ / የማያምኑት
  rationale: የአሁን ጊዜውንና ቀጣይ የአለማመን ሁኔታ በተነባቢ አማርኛ ይጠብቃል።
- source_word: ᾔδει
  choice: ያውቅ ነበር
  rationale: በቀድሞ ጊዜ የቆየ የማወቅ ሁኔታን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξ ἀρχῆς
  choice: ከመጀመሪያው
  rationale: ‘መጀመሪያው’ የትኛው ነጥብ እንደሆነ ሳይወስን የግሪኩን ጊዜያዊ አሻሚነት ይጠብቃል።
- source_word: παραδώσων αὐτόν
  choice: እርሱን አሳልፎ የሚሰጠው
  rationale: የግሪኩን ‘አሳልፎ መስጠት’ መሠረታዊ ትርጉም ይጠብቃል፤ በዚህ ታሪካዊ አውድ ያለው የክህደት ስሜትም በማስታወሻ ተገልጧል።
theological_decisions:
- issue: በዮሐንስ ወንጌል ውስጥ πιστεύω የሚለውን መተርጎም
  choice: ማመን
  alternative: መታመን / እምነት መጣል
  rationale: ‘ማመን’ የቃሉን አእምሯዊና ግንኙነታዊ ስፋት ሳያጠብ በአማርኛ የተለመደውን አገላለጽ ይሰጣል።
- issue: παραδίδωμι የይሁዳን ድርጊት ሲያመለክት
  choice: አሳልፎ መስጠት
  alternative: መክዳት
  rationale: ዋናው ጽሑፍ የግሪኩን ሰፊ የቃል ትርጉም ይጠብቃል፤ አውዱ የሚያሳየው ክህደት ግን በአማራጭ ንባብ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክ ምንጩ ያልወሰነውን ‘ከመጀመሪያው’ የሚለውን የጊዜ መነሻ ትርጉሙ እንዳይጠብ ሆን ተብሎ አልተብራራም።
