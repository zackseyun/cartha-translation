    rationale: Replacing ‘ከመጀመሪያው’ with ‘ከመጀመሪያ ጀምሮ’ gives normal contemporary Amharic while retaining the source’s temporal ambiguity.
  - severity: low
    issue: The footnote alternative lacks the explicit object found in the main clause.
    rationale: Adding ‘እርሱን’ makes the alternative self-contained and clearly ties the betrayal to Jesus.
