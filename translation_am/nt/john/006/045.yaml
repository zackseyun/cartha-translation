base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: am
  text: በነቢያት መጻሕፍት፣ “ሁሉም በእግዚአብሔር የተማሩ ይሆናሉ”[a] ተብሎ ተጽፎአል። ከአብ ሰምቶ የተማረ ሁሉ ወደ እኔ ይመጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉም እግዚአብሔር-ያስተማራቸው ይሆናሉ።”
    reason: የδιδακτοὶ θεοῦን ጥቅጥቅ ያለ “God-taught” አገላለጽ እንደ አማራጭ ያሳያል፤ የዋናውን ንባብ ትርጉም አይለውጥም።
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: ተብሎ ተጽፎአል
  rationale: የተጻፈው ቃል ጸንቶ እንዳለ የሚያሳየውን ፍጹም ጊዜ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐν τοῖς προφήταις
  choice: በነቢያት መጻሕፍት
  rationale: ሐረጉ ነቢያት የተባለውን የቅዱሳት መጻሕፍት ክፍል ሊያመለክት መቻሉን በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: ሁሉም በእግዚአብሔር የተማሩ ይሆናሉ
  rationale: የወደፊት ጊዜውንና እግዚአብሔር የትምህርቱ ምንጭ ወይም አስተማሪ መሆኑን ይጠብቃል።
- source_word: πᾶς ὁ
  choice: ሁሉ
  rationale: በአማርኛ የነጠላ ስም አድራጊውን አጠቃላይ ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν
  choice: ከአብ ሰምቶ የተማረ
  rationale: መስማትና መማር ወደ ዋናው ግስ የሚቀድሙ ድርጊቶች መሆናቸውን ይጠብቃል፤ παρά ከዘር አመልካች ጋር ያለውን የምንጭ ትርጉም “ከአብ” ያሳያል።
- source_word: ἔρχεται πρὸς ἐμέ
  choice: ወደ እኔ ይመጣል
  rationale: የአሁን ጊዜውንና ወደ ኢየሱስ የመቅረብን ግላዊ አቅጣጫ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: በመለኮታዊ ትምህርትና ወደ ኢየሱስ በመምጣት መካከል ያለው ግንኙነት
  choice: ከአብ ሰምተው የተማሩት ወደ ኢየሱስ እንደሚመጡ የጽሑፉን ቅደም ተከተል ብቻ ማቆየት
