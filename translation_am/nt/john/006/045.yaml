  rationale: ግሪኩ ግንኙነቱን ይገልጻል እንጂ ሥነ መለኮታዊ አሠራሩን አያብራራም፤ ትርጉሙም ይህን ውጥረት ሳይፈታ ይጠብቃል።
- issue: የ“አብ” ማንነትና የኢየሱስ ሥልጣን
  choice: “አብ” እና “እኔ” የሚሉትን ቀጥተኛ ግንኙነት ማቆየት
  alternative: ከጥቅሱ በላይ የሚሄድ ክርስቶሎጂያዊ ማብራሪያ መጨመር
  rationale: ከአብ መማር ወደ ኢየሱስ እንደሚመራ ያለውን የዮሐንስ አጽንዖት ይጠብቃል፣ ጽሑፉ ያላለውን ግን አይጨምርም።
