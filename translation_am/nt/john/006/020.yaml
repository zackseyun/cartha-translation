id: JHN.6.20
reference: John 6:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: am
  text: እርሱ ግን “እኔ ነኝ፤[a] አትፍሩ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እኔ ነኝ” የሚለው አገላለጽ በዚህ አውድ “እኔው ነኝ” ብሎ ራሱን ማስተዋወቅ ሊሆን ይችላል፤ በዮሐንስ ወንጌል ግን ሰፋ ያለ ሥነ መለኮታዊ ድምፀትም ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱ ግን
  rationale: ὁ በዚህ ስፍራ ኢየሱስን የሚያመለክት ተውላጠ ስም ሆኖ ያገለግላል፤ δέ ደግሞ ቀላል የንግግር ሽግግርን ወይም ንጽጽርን ስለሚያሳይ “ግን” ተመርጧል።
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ቃል በታሪካዊ የአሁን ጊዜ ቢቀርብም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መጠቀም ትርጉሙን በግልጽ ያስተላልፋል። የተቀባዩ ብዙ ቁጥር መሆን በ“-አቸው” ተካትቷል።
- source_word: αὐτοῖς
  choice: -አቸው
  rationale: የግሪኩ ብዙ ቁጥር ተውላጠ ስም በአማርኛው ግስ ውስጥ በተፈጥሮ ተዋሕዷል፤ ጥቅሱ በግልጽ “ደቀ መዛሙርቱ” ብሎ ስለማይደግም ይህ አልተጨመረም።
- source_word: Ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: ይህ በዘመናዊ አማርኛ ተናጋሪው ራሱን የሚያስተዋውቅበት ተፈጥሯዊ አገላለጽ ሲሆን፣ “እኔ ነኝ/እኔ ነኝ” የሚለውን የግሪኩን ቀጥተኛ ቅርጽና በዮሐንስ ወንጌል ሊኖረው የሚችለውን ሰፊ ድምፀት በአንድ ጊዜ ይጠብቃል።
- source_word: μὴ φοβεῖσθε
  choice: አትፍሩ
  rationale: የብዙ ቁጥር ክልከላውን በተፈጥሯዊና ቀጥተኛ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: Ἐγώ εἰμι ቀላል ራስን ማስተዋወቅ ብቻ ነው ወይስ ሰፊ ሥነ መለኮታዊ ድምፀትም አለው?
  choice: በዋናው ጽሑፍ “እኔ ነኝ”
  alternative: “እኔው ነኝ” ወይም በአውዱ “እኔ ነኝና”
  rationale: በቅርብ አውዱ ኢየሱስ የፈሩትን ደቀ መዛሙርት ራሱን በማስተዋወቅ እያረጋጋቸው ነው። “እኔ ነኝ” ይህን ተግባር በተፈጥሮ ያስተላልፋል፤ ከዚሁ ጋር የግሪኩን ግልጽ ቅርጽ በመጠበቅ በዮሐንስ አጠቃቀም ሊሰማ የሚችለውን ሰፊ ሥነ መለኮታዊ ድምፀት አይዘጋም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ ነው። “አትፍሩ” ቀጥተኛና ተፈጥሯዊ ሲሆን፣ “እርሱ ግን” የግሪኩን ቀላል የንግግር ሽግግር ይጠብቃል።
