lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ የሚነሣውን ውጤትና ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γνοὺς
  choice: አውቆ
  rationale: የኢየሱስን መሄድ ምክንያት የሚገልጠውን ተውሳከ ግስ በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: μέλλουσιν ἔρχεσθαι
  choice: መጥተው … እንዳሰቡ
  rationale: ቅርብ የሆነውን የሕዝቡን ዕቅድ በተፈጥሯዊ አማርኛ ይገልጣል፤ μέλλω በዚህ አውድ የታቀደንም ሆነ የተቃረበን ድርጊት ሊያመለክት ይችላል።
- source_word: ἁρπάζειν
  choice: በኃይል ይዘውት
  rationale: ግሱ ያለውን የግዳጅና የኃይል ስሜት በግልጽ አማርኛ ይጠብቃል።
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: ንጉሥ ሊያደርጉት
  rationale: የἵνα የዓላማ ኃይልን በተፈጥሯዊው የአማርኛ የዓላማ አገላለጽ ያቀርባል።
- source_word: ἀνεχώρησεν
  choice: ሄደ
  rationale: ከሕዝቡ በመራቅ ወደ ተራራው መሄዱን በቀላልና ዘመናዊ አማርኛ ይገልጣል፤ ‘ፈቀቅ አለ’ ወይም ‘አፈገፈገ’ ከአውዱ በላይ የማፈግፈግ ስሜት ሊጨምሩ ይችላሉ።
- source_word: πάλιν
