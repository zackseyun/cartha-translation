review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the crowd’s coercive action (ἁρπάζειν) and their purpose of making Jesus king, as well as the repeated movement to the mountain and his solitude. However, “እንዳሰቡ” renders an intention rather than the imminent prospective force of μέλλουσιν ἔρχεσθαι, and “ሄደ” weakens ἀνεχώρησεν (‘withdrew’).
  naturalness: The existing wording is generally clear modern standard Amharic. “ሊመጡና … ሊያደርጉት እንደነበር አውቆ” naturally conveys the impending action, while “ፈቀቅ ብሎ … ሄደ” idiomatically conveys withdrawal without implying panic or defeat.
  terminology: “በኃይል ይዘውት” appropriately conveys the forceful nuance of ἁρπάζειν, and “ንጉሥ ሊያደርጉት” accurately conveys the intended kingship. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: medium
    issue: Imminence of μέλλουσιν ἔρχεσθαι is not retained.
    rationale: “መጥተው … እንዳሰቡ” says that they planned/intended to come, whereas the Greek presents them as about to come. “ሊመጡ … እንደነበር” preserves the prospective imminence.
  - severity: medium
    issue: ἀνεχώρησεν is understated as “ሄደ.”
    rationale: The verb denotes withdrawal from the situation, not simply going somewhere. “ፈቀቅ ብሎ … ሄደ” retains this avoidance/withdrawal nuance in natural Amharic.
  - severity: low
    issue: The footnote alternative does not correspond closely to the English audit-trail alternative.
    rationale: The English note offers ‘take him by force in order to make him king.’ The proposed Amharic note, ‘ነጥቀው ወስደውት,’ omits the purpose clause and is less directly parallel. A full alternative is clearer.
  revised_text: ስለዚህ ኢየሱስ፣ ሊመጡና በኃይል ይዘውት[a] ንጉሥ ሊያደርጉት እንደነበር አውቆ፣ እንደገና ብቻውን ወደ ተራራው ፈቀቅ ብሎ ሄደ።
