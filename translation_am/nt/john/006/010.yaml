base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: am
  text: ኢየሱስም፣ “ሕዝቡ እንዲቀመጥ አድርጉ” አለ። በዚያም ስፍራ ብዙ ሣር ነበረ። ስለዚህ ወንዶቹ[a] ተቀመጡ፤ ቁጥራቸውም አምስት ሺህ ያህል ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው መጀመሪያ “ሕዝቡን” (ἀνθρώπους) ይላል፤ በኋላ ግን “ወንዶቹ” (ἄνδρες) ይላል። ስለዚህ አምስት ሺህ ያህል የሚለው ቁጥር በተለይ ወንዶቹን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε … ἀναπεσεῖν
  choice: እንዲቀመጡ አድርጉ
  rationale: ποιέω ከተከታዩ የግስ ማሟያ ጋር ምክንያታዊ ትእዛዝን ይገልጣል፤ ይህ አተረጓጎም ትእዛዙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς ἀνθρώπους
  choice: ሕዝቡን
  rationale: ἀνθρώπους እዚህ የተሰበሰበውን ሕዝብ በአጠቃላይ ያመለክታል፤ በኋላ ከተጠቀሰው ወንድ-ተኮር ἄνδρες ጋር ያለውን ልዩነትም ይጠብቃል።
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: እንዲቀመጡ / ተቀመጡ
  rationale: ግሱ ለምግብ መደገፍን ወይም መቀመጥን ሊያመለክት ይችላል፤ በዚህ ከቤት ውጭ ባለ አውድ “መቀመጥ” ተፈጥሯዊና ግልጽ ነው።
- source_word: χόρτος πολὺς
  choice: ብዙ ሣር
  rationale: χόρτος በዚህ አውድ “ሣር” ማለት ሲሆን πολὺς ብዛቱን ይገልጣል።
- source_word: ἐν τῷ τόπῳ
  choice: በዚያም ስፍራ
  rationale: ቦታውን በተፈጥሯዊ የአማርኛ ትረካ ያመለክታል።
- source_word: οἱ ἄνδρες
  choice: ወንዶቹ
  rationale: ἄνδρες በተለይ ወንዶችን ያመለክታል፤ ከቀደመው አጠቃላይ ἀνθρώπους ጋር ያለው የቃል ልዩነት ተጠብቋል።
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: ቁጥራቸውም አምስት ሺህ ያህል ነበር
  rationale: ὡς ግምታዊ ቁጥርን ያሳያል፤ τὸν ἀριθμόν ደግሞ በግልጽ “ቁጥራቸው” ተብሎ ተላልፏል።
theological_decisions:
- issue: በሕዝቡና በተቆጠሩት ወንዶች መካከል ያለው የጾታ ልዩነት
  choice: ἀνθρώπουςን “ሕዝቡን”፣ ἄνδρεςን ደግሞ “ወንዶቹ” ብሎ መለየት
  alternative: ሁለቱንም “ሰዎቹ” ወይም “ሕዝቡ” ብሎ መተርጎም
  rationale: የግሪክኛው ጽሑፍ ከአጠቃላይ የሰው ቃል ወደ ወንድ-ተኮር ቃል ይሸጋገራል፤ ይህን ልዩነት መጠበቅ ቁጥሩ በቀጥታ የሚመለከተውን ቡድን ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ተቀመጡ” ከ“ተደገፉ” ይልቅ በዚህ የውጭ ስፍራ አውድ ተፈጥሯዊ ሲሆን የምንጩን የመመገቢያ አቀማመጥ ፍቺ አይክድም።
