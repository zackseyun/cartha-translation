  text: እንግዲህ፣ ሃያ አምስት ወይም ሠላሳ ስታዲዮን ያህል ከቀዘፉ በኋላ፣[a] ኢየሱስ በባሕሩ ላይ እየተራመደ ወደ ጀልባይቱ ሲቀርብ አዩት፤[b] ፈሩም።
  philosophy: optimal-equivalence
