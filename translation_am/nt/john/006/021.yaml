  rationale: ግሪክኛው ክስተቱን በአጭሩና በጎላ ድንገተኛነት ያቀርባል። ትርጉሙ ይህን የትረካና የሥነ መለኮት ውጥረት ሳይፈታው ይጠብቃል።
