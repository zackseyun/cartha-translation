review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the disciples’ willingness, receiving Jesus into the boat, and the immediate arrival. However, «ሆኑ» can make the imperfect ἤθελον sound merely ingressive (“they became willing”), rather than describing their disposition at that point in the narrative. «ሊቀበሉት ወደዱ» more directly reflects the Greek construction and avoids the slightly causative implication of «ሊያስገቡት».
  naturalness: The sentence is generally clear and modern. «ጀልባው ወደ ... ምድር ደረሰ» is understandable, but «ወደሚሄዱበት ምድር» is less idiomatic than a relative clause with an explicit antecedent, «ወደሚሄዱበት ወደ ምድሩ».
  terminology: «ጀልባ» is appropriate for πλοῖον. «ምድር» appropriately preserves the broad sense of γῆ without asserting that the boat was beached. The footnote’s «ዳርቻ» is a valid contextual alternative.
  issues:
  - severity: medium
    issue: Imperfect aspect of ἤθελον is weakened by «ፈቃደኛ ሆኑ».
    rationale: The expression can imply a transition to willingness. Rendering it as «ሊቀበሉት ወደዱ» retains the past narrative imperfect naturally without adding an ingressive nuance.
  - severity: low
    issue: «ሊያስገቡት» is slightly more causative than λαβεῖν αὐτὸν εἰς τὸ πλοῖον.
    rationale: λαμβάνειν in this setting is most directly “receive/take him into the boat.” «ሊቀበሉት» is natural Amharic and closer to the source.
  - severity: low
    issue: The destination relative phrase is awkwardly attached in «ወደሚሄዱበት ምድር».
    rationale: Adding «ወደ» before «ምድሩ» makes the destination construction smoother while preserving εἰς ἣν ὑπῆγον.
  revised_text: ስለዚህ እርሱን በጀልባው ውስጥ ሊቀበሉት ወደዱ፤ ወዲያውም ጀልባው ወደሚሄዱበት ወደ ምድሩ ደረሰ።[a]
  revised_footnotes:
