lexical_decisions:
- source_word: ἤθελον
  choice: ፈቃደኛ ሆኑ
  rationale: በዚህ ዐውደ ንባብ ግሱ ከፍርሃታቸው በኋላ እርሱን ለማስገባት ያላቸውን ፈቃድና ዝግጁነት ያሳያል፤ ከስሜታዊ ምኞት ይልቅ «ፈቃደኛ ሆኑ» ተፈጥሯዊ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር ጋር ያለውን የውጤት ወይም የትረካ ትስስር በግልጽ ያስተላልፋል።
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: እርሱን ወደ ጀልባው ሊያስገቡት
  rationale: በዚህ ተጨባጭ ሁኔታ λαμβάνω እርሱን በጀልባው ውስጥ መቀበልን ወይም ማስገባትን ያመለክታል፤ «ሊያስገቡት» በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: πλοῖον
  choice: ጀልባ
  rationale: በገሊላ ባሕር ዐውድ የሚገባውን መጠነኛ የውኃ መጓጓዣ ያመለክታል፤ «መርከብ» ከሚገባው በላይ ትልቅ ነገር ሊያስታውስ ይችላል።
- source_word: εὐθέως
  choice: ወዲያውም
  rationale: የክስተቱን ድንገተኛነትና ፈጣንነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: ጀልባው ... ምድር ደረሰ
  rationale: ἐγένετο ከቦታ ገላጭ ሐረግ ጋር ወደ አንድ ቦታ መድረስን ሊያመለክት ይችላል። «ምድር ደረሰ» በአማርኛ ግልጽ ሲሆን ጀልባው ደረቅ መሬት ላይ ወጣ የሚል አሳሳች ሐሳብ አያስከትልም።
- source_word: γῆς
  choice: ምድር
  rationale: γῆ እዚህ የጉዞአቸውን መዳረሻ መሬት ያመለክታል። «ምድር» የምንጩን ሰፊ ትርጉም ይጠብቃል፤ «ዳርቻ» ደግሞ በአውዱ የሚቻል አማራጭ ሆኖ በማስታወሻ ቀርቧል።
- source_word: εἰς ἣν ὑπῆγον
