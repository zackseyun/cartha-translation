    reason: lexical_alternative
  revision_rationale: The revision retains the source’s direct narrative sequence and marked immediacy, while using more idiomatic Amharic for receiving Jesus into the boat and for the destination clause. It does not explain or diminish the sudden arrival; the footnote preserves «ዳርቻ» as a contextual alternative for γῆ.
