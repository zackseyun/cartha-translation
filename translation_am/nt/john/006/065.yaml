  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: am
  text: እንዲህም ይል ነበር፦ “ስለዚህ፣ ከአብ ካልተሰጠው በቀር ማንም ወደ እኔ መምጣት እንደማይችል ነግሬአችኋለሁ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: ያልተፈጸመውን የግሪክ ኢምፐርፌክት ገጽታ ይጠብቃል፤ በንግግሩ ሂደት ይህን ይናገር እንደነበር ያሳያል።
- source_word: Διὰ τοῦτο
  choice: ስለዚህ
  rationale: ወደ ቀደመው ንግግር የሚመለሰውን ምክንያታዊ ትስስር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἴρηκα ὑμῖν
  choice: ነግሬአችኋለሁ
  rationale: ፍጹም ጊዜው ቀድሞ የተነገረው አሁንም ጠቀሜታ እንዳለው ያሳያል፤ ብዙ ተደራሲዎችን የሚያመለክተውን ὑμῖνም ይጠብቃል።
- source_word: οὐδεὶς δύναται
  choice: ማንም … እንደማይችል
  rationale: ሐረጉ ፈቃድ ማጣትን ሳይሆን አለመቻልን በግልጽ ያስተላልፋል።
- source_word: ἐλθεῖν πρός με
  choice: ወደ እኔ መምጣት
  rationale: የአቅጣጫና የግንኙነት ኃይል ያለውን የዮሐንስ አገላለጽ ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: ካልተሰጠው በቀር
  rationale: የመሰጠትን አስፈላጊ ሁኔታና ተገብሮ ቅርጹን በተፈጥሯዊ አማርኛ ይጠብቃል። የአማርኛው -ው ቅጥያ ነጠላ የሰው ተቀባይን ያመለክታል።
- source_word: ἐκ τοῦ πατρός
  choice: ከአብ
  rationale: ἐκ የምንጭን ወይም የመነሻን ሐሳብ ስለሚገልጥ “ከ” ተጠብቋል፤ πατήρ በዚህ የዮሐንስ አውድ “አብ” ተብሎ ተተርጉሟል።
theological_decisions:
- issue: ወደ ኢየሱስ በመምጣት ውስጥ መለኮታዊ መስጠትና የሰው ችሎታ
  choice: ከአብ የሚሰጠው ነገር ከሌለ ማንም መምጣት እንደማይችል ጽሑፉ እንደሚለው በቀጥታ ተተርጉሟል።
  alternative: መስጠቱ ውጤታማና ለተወሰኑ ሰዎች ብቻ ነው ብሎ መግለጽ፣ ወይም ለሁሉ የሚሰጥ ቀዳሚ አስችሎት ነው ብሎ ማስፋት።
  rationale: የግሪኩ ጽሑፍ አስፈላጊ ሁኔታን ይገልጣል፤ የመስጠቱን አይነት፣ መጠን ወይም ከሰው ምላሽ ጋር ያለውን ዝምድና ግን አይወስንም።
- issue: የαὐτῷ ነጠላ ተባዕታይ ቅርጽና አጠቃላይ ኃይል
  choice: “ካልተሰጠው” የሚለው ቅርጽ ነጠላ የሰው ተቀባይን ይጠብቃል።
  alternative: “ለዚያ ሰው ካልተሰጠ” ብሎ በግልጽ ማስፋት።
  rationale: በአማርኛ ጾታን የሚጠቁመው የነጠላ ሦስተኛ መደብ ቅጥያ ከግሪኩ ቅርጽ ጋር ይስማማል፤ ቢሆንም የአገላለጹ ኃይል ማንኛውንም ሰው በአጠቃላይ ያካትታል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “አብ” በክርስቲያናዊ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደና ግልጽ ስለሆነ ተመርጧል። የምንጭ ጽሑፉ የተግባር ገጽታ፣ የምንጭ ቅድመ አያያዝ እና የመለኮታዊ መስጠት ሥነ መለኮታዊ ውጥረት ሳይፈታ ተጠብቋል።
