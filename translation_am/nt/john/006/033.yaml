  source_fidelity: The draft preserves the principal lexical content and the explanatory force of γάρ. However, adding «እርሱ» makes the referent explicitly personal where the Greek construction can also refer to the bread. The masculine participles do not by themselves settle this question, since they grammatically agree with the masculine noun ἄρτος.
