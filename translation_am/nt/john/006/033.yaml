  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: am
  text: የእግዚአብሔር እንጀራ ከሰማይ የሚወርደውና ለዓለም ሕይወትን የሚሰጠው ነውና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሰማይ የሚወርደውና ለዓለም ሕይወትን የሚሰጠው እርሱ ነውና።” የግሪኩ የወንድ ጾታ ተሳቢዎች ከ«እንጀራ» ከሚለው የወንድ ጾታ ስም ጋር ይስማማሉ፤ ስለዚህ ቃላቱ በሰዋሰው ብቻ ግላዊ አመልካችነትን አያስገድዱም፣ ሆኖም በዐውደ ንባቡ ግላዊ ንባብ ሊኖራቸው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: እንጀራ
  rationale: በአማርኛ የዕለት ምግብን የሚወክል ተፈጥሯዊ ቃል ሲሆን፣ በዚህ ንግግር ያለውን ተጨባጭ የእንጀራ ምሳሌ ይጠብቃል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት ወይም የምንጭነት ግንኙነት ሳይገድብ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὁ καταβαίνων
  choice: የሚወርድ ... እርሱ
  rationale: የወንድ ነጠላ አመልካች ተሳቢውን ግላዊ አመልካችነት ይጠብቃል፤ የአሁን ጊዜ ቅርጹም ቀጣይ ወይም ባሕርያዊ ድርጊትን ያሳያል።
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ
  rationale: የመነሻን ወይም የምንጭን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ζωὴν
  choice: ሕይወትን
  rationale: በዮሐንስ ወንጌል ማዕከላዊ የሆነውን ቃል ቀጥተኛና ክብደት ባለው መልኩ ይጠብቃል።
- source_word: διδοὺς
  choice: የሚሰጥ
  rationale: ከ‘የሚወርድ’ ጋር ያለውን ተመሳሳይ የተሳቢ አወቃቀርና ባሕርያዊ ድርጊት ይጠብቃል።
- source_word: τῷ κόσμῳ
  choice: ለዓለም
  rationale: κόσμος ያለውን ሰፊ የዮሐንስ አጠቃቀም ሳያጠብ ይጠብቃል፤ ‘ለሰው ልጆች’ ወይም ‘ለሁሉም ሰዎች’ ብሎ አይወስነውም።
- source_word: γὰρ
  choice: ነውና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ‘የእግዚአብሔር እንጀራ ... ὁ καταβαίνων ... καὶ ζωὴν διδοὺς’ የግል ወይስ ግዑዝ አመልካች ነው?
  choice: ‘እርሱ’ በማለት ግላዊ አመልካችነቱን ማሳየት።
  alternative: ‘ከሰማይ የሚወርደውና ለዓለም ሕይወትን የሚሰጠው ነው’ ብሎ ይበልጥ ግዑዝ በሚመስል መንገድ መተርጎም።
  rationale: ἄρτος በግሪክ ወንድ ጾታ ስም ቢሆንም፣ ዐውደ ንባቡና የወንድ ነጠላ ተሳቢዎቹ ወደ ግላዊ አመልካችነት ያመራሉ። ይህ ኢየሱስ በኋላ ራሱን እንጀራው ብሎ ለሚገልጽበት ንግግር ይዘጋጃል፤ ሆኖም አማራጩ ሰዋሰዋዊ ዕድል በማስታወሻ ተጠብቋል።
- issue: κόσμος የሚያመለክተው ወሰን
  choice: ‘ዓለም’ የሚለውን ሰፊ ቃል መጠበቅ።
  alternative: ‘ለሰው ልጆች’ ወይም ‘ለሰዎች ሁሉ’ ብሎ መተርጎም።
  rationale: ጥቅሱ ስለ ሕይወት ሰጪው ተልእኮ ስፋት የሚናገረውን ሳያጠብ ለማቆየትና የትምህርት ክርክሮችን በትርጉሙ ውስጥ አስቀድሞ ላለመወሰን ‘ዓለም’ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እንጀራ፣’ ‘ሕይወት፣’ እና ‘ዓለም’ የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል፤ ‘ነውና’ ደግሞ γὰρ ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ ሐረግ መጨረሻ ያሳያል።
