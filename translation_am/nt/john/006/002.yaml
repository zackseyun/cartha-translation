  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: am
  text: ብዙ ሕዝብም ይከተለው ነበር፤ ምክንያቱም እርሱ በታመሙት ላይ ሲያደርግ የነበረውን ምልክቶች[a] ይመለከቱ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ተአምራት» ወይም «ተአምራዊ ምልክቶች»፤ ዮሐንስ የተጠቀመበት «ምልክቶች» የሚለው ቃል እነዚህ ሥራዎች ስለ ኢየሱስ የሚገልጡትን ነገር አጽንዖት ይሰጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: ይከተለው ነበር
  rationale: ያላለቀው የግስ አኳኋን ቀጣይነት ያለውን ያለፈ ድርጊት ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: በዚህ ስፍራ ጠንካራ ተቃርኖን ሳይሆን ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ በአማርኛም ቅጥያው ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ὄχλος πολύς
  choice: ብዙ ሕዝብ
  rationale: ብዛት ያለውን የሰዎች ስብስብ በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ἐθεώρουν
  choice: ይመለከቱ ነበር
  rationale: የግሱን ቀጣይ ወይም ተደጋጋሚ የመመልከት አኳኋን ይጠብቃል።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: ቃሉ ድርጊቶቹ ስለ ኢየሱስ የሚገልጡትን ትርጉም ጭምር ስለሚያመለክት፣ «ተአምራት» ብቻ ከማለት ይልቅ የዮሐንስን አጠቃቀም በቅርብ ይጠብቃል።
- source_word: ἐποίει
  choice: ያደርጋቸውን
  rationale: የሚቀጥል ወይም የሚደጋገም ድርጊትን ይገልጣል፤ የብዙ ቁጥር ተሳቢውም «ምልክቶች»ን ያመለክታል።
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: በታመሙት ላይ
  rationale: ምልክቶቹ በታመሙ ሰዎች ላይ መደረጋቸውን በተፈጥሯዊ አማርኛ ሲገልጥ የἐπίን ግንኙነትም በቅርብ ያንጸባርቃል።
- source_word: ἀσθενούντων
  choice: በታመሙት
  rationale: በዚህ ዐውድ አካላዊ ሕመም ያለባቸውን ሰዎች በግልጽ ያመለክታል።
