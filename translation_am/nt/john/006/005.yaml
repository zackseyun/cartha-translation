review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the narrative sequence, the large crowd''s approach, the first-person plural question, and the purpose that the people may eat. However, ἄρτους is better represented by ዳቦ than by እንጀራ in this setting: the latter normally denotes the specifically Ethiopian flatbread and unnecessarily narrows the Greek term.'
  naturalness: The construction ፊልጶስን … አለው is not standard for 'said to Philip.' Modern standard Amharic naturally uses ለፊልጶስ … አለው. The revised wording retains a clear, dignified narrative register.
  terminology: Use ዳቦ for ἄρτους ('bread/loaves') and retain a footnote for the possible count-noun sense, ዳቦዎች. Names and other terms are appropriate.
  issues:
  - severity: medium
    issue: The food term እንጀራ is overly specific.
    rationale: ἄρτος denotes bread or loaves generally. In contemporary Amharic, እንጀራ normally identifies a particular flatbread; ዳቦ preserves the source's broader sense.
  - severity: medium
    issue: ፊልጶስን … አለው does not naturally mark Philip as the addressee.
    rationale: For λέγει πρὸς Φίλιππον, standard Amharic idiom is ለፊልጶስ … አለው.
  - severity: low
    issue: The footnote's explanation of the alternative is imprecise in Amharic.
    rationale: The alternative should contrast bread generally with individual loaves without saying 'each bread.'
