id: JHN.6.5
reference: John 6:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: am
  text: ስለዚህ ኢየሱስ ዓይኖቹን አንሥቶ፣ ብዙ ሕዝብ ወደ እርሱ እየመጣ እንደሆነ ባየ ጊዜ፣ ለፊልጶስ፣ “እነዚህ እንዲበሉ ዳቦ[a] ከየት እንግዛ?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዳቦዎች።” የግሪኩ ቃል ዳቦን በአጠቃላይ ወይም ነጠላ ዳቦዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: ዓይኖቹን አንሥቶ
  rationale: የግሪኩን ፈሊጣዊ አነጋገር በተፈጥሯዊና በተከበረ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በቀደመው ትረካ ላይ የሚኖረውን የትስስርና የውጤት ኃይል ይጠብቃል።
- source_word: θεασάμενος
  choice: ባየ ጊዜ
  rationale: ብዙ ሕዝብ እየመጣ መሆኑን ኢየሱስ በትኩረት ማየቱን በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር ያሳያል።
- source_word: πολὺς ὄχλος
  choice: ብዙ ሕዝብ
  rationale: የሕዝቡን ብዛት በግልጽና በዘመናዊ አማርኛ ይገልጻል፤ ‘ታላቅ ሕዝብ’ የመጠን ሳይሆን የክብር ትርጉም ሊያሰማ ይችላል።
- source_word: ἔρχεται πρὸς αὐτόν
  choice: ወደ እርሱ እየመጣ እንደሆነ
  rationale: የእንቅስቃሴውን አቅጣጫና ቀጣይነት በግልጽ ሁኔታ ይይዛል።
- source_word: λέγει πρὸς Φίλιππον
  choice: ፊልጶስን ... አለው
  rationale: የታሪክ ጊዜውን በተፈጥሯዊ የአማርኛ አወቃቀር ሲያቀርብ ንግግሩ ለፊልጶስ መሆኑን ያሳያል።
- source_word: Πόθεν ἀγοράσωμεν
  choice: ከየት እንግዛ?
  rationale: ‘ከየት’ የΠόθενን ምንጭ ጠያቂ ኃይል በቀጥታ ይጠብቃል፤ የአንደኛ መደብ ብዙ ቁጥር ጥያቄውም በ‘እንግዛ’ ተጠብቋል።
- source_word: ἄρτους
  choice: እንጀራ
  rationale: በዐውዱ የሚበላ እህል-ምግብን በአጠቃላይ የሚያመለክት ተፈጥሯዊ ምርጫ ነው፤ የብዙ ቁጥር ‘እንጀራዎች’ ትርጉምም በማስታወሻ ቀርቧል።
- source_word: ἵνα φάγωσιν οὗτοι
  choice: እነዚህ እንዲበሉ
  rationale: የἵναን የዓላማ ኃይልና የοὗτοιን ቀጥተኛ አመልካችነት ይጠብቃል።
theological_decisions:
- issue: የታሪክ ጊዜና የተሳቢ ግሶች አቀራረብ
  choice: የግሪኩን የአሁን ጊዜ λέγει በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ‘አለው’ ማቅረብ፣ የተሳቢ ግሶቹንም እንደ ቅደም ተከተላቸው ማስተላለፍ
  alternative: በቅርጽ ይበልጥ ቀጥተኛ በሆነ መንገድ ‘ዓይኖቹን አነሣ፣ አየም፣ ... ይለዋል’ ማለት
  rationale: ይህ የትረካ ዘይቤ ምርጫ እንጂ የእምነት ትርጓሜ አይደለም፤ የድርጊቶቹን ቅደም ተከተል ሳያጠፋ በዘመናዊ አማርኛ ተፈጥሯዊ ንባብ ይሰጣል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። ‘ዓይኖቹን አንሥቶ’ የምንጩን ምስላዊ አነጋገር ይጠብቃል፤ ‘ከየት እንግዛ?’ ግን በአማርኛ ተፈጥሯዊ ነው። በቀረበው የእንግሊዝኛ ማማከሪያ ውስጥ የማስታወሻ ምልክቶቹ ከሚገልጹት ቃል ጋር ያልተጣጣሙ ስለነበር፣ በአማርኛው ረቂቅ ምልክቱ ከ‘እንጀራ’ ጋር በትክክል ተያይዟል።
