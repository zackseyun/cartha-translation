  rationale: የῥήματαን ብዙ ቁጥር ይጠብቃል፤ የዮሐንስን ‘ዘላለማዊ ሕይወት’ ጽንሰ ሐሳብም በተለመደው የአማርኛ ሐረግ ያቀርባል።
- source_word: ἔχεις
