  text: ኢየሱስም መለሰላቸው፦ “እኔ እናንተን፣ አሥራ ሁለቱን፣ አልመረጥኋችሁምን? ሆኖም ከእናንተ አንዱ ዲያብሎስ ነው።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዲያብሎስ” የሚለው የግሪክ ቃል “ስም አጥፊ” ወይም “ሐሰተኛ ከሳሽ” ማለት ሊሆን ይችላል፤ በብዙ አውዶችም ሰይጣንን ያመለክታል። እዚህ ያለው አነጋገር ግለሰቡን በቀጥታ ከሰይጣን ጋር አያመሳስለውም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ ሲል መለሰላቸው
  rationale: የግሪኩን መልስ የመስጠት ትርጉም በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ “እንዲህ ሲል” ቀጥሎ ያለውን ቀጥተኛ ንግግር በግልጽ ያስገባል።
- source_word: Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην;
  choice: እናንተን፣ አሥራ ሁለቱን፣ የመረጥኋችሁ እኔ አይደለሁምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ የአጻጻፍ ጥያቄ ይጠብቃል፤ “አሥራ ሁለቱን” የታወቀውን የደቀ መዛሙርት ቡድን ያመለክታል።
- source_word: καὶ
