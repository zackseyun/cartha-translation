  rationale: ቃሉን “ሰይጣን” ብሎ በቀጥታ ከዋናው ክፉ አካል ጋር እንዳያመሳስለው፣ እንዲሁም “ሐሰተኛ ከሳሽ” ብሎ የንግግሩን ጥንካሬ እንዳያለዝብ፣ የግሪኩ ቅርጽ በአማርኛ ተውሶ ቀርቧል። ያለ አመልካች መቅረቡ ገላጭ ወይም ጥራታዊ አነጋገሩን ይጠብቃል።
