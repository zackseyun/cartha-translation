- issue: ζωήን ከሰፊው የዮሐንስ ዐውድ ተነስቶ ‘ዘላለማዊ ሕይወት’ ብሎ ማስፋት
  choice: በዋናው ጽሑፍ ‘ሕይወት’ ብቻ ማለት
