lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: ባሕሩ
  rationale: θάλασσα በቀጥታ ‘ባሕር’ ማለት ነው። በዐውዱ የገሊላ ባሕር ቢሆንም ግሪኩ የተለመደውን ስም ስለተጠቀመ ‘ባሕሩ’ ተብሎ ተተርጉሟል፤ τε ያለው ቀላል አያያዥነት በአማርኛው የሐረግ ፍሰት ውስጥ በተፈጥሮ ተካቷል።
- source_word: ἀνέμου μεγάλου
  choice: ብርቱ ነፋስ
  rationale: ἄνεμος ‘ነፋስ’ ሲሆን μέγας ከአየር ሁኔታ ጋር ‘ብርቱ’ ተብሎ በተፈጥሮ ይገለጻል። ‘ኃይለኛ’ ሊባል ቢችልም ‘ብርቱ’ ኃይሉን ሳያጋንን ያስተላልፋል።
- source_word: πνέοντος
  choice: ይነፍስ ስለነበር
  rationale: የአሁን ጊዜ አድራጊ አንቀጸ ግስ የነፋሱን ቀጣይ እንቅስቃሴና የባሕሩ መናወጥ ሁኔታ መንስኤ ያሳያል። በአማርኛ ‘ይነፍስ ስለነበር’ ይህን ግንኙነትና ቀጣይነት በተፈጥሮ ያቀርባል።
- source_word: διεγείρετο
  choice: ይናወጥ ነበር
  rationale: የግሱ ያልተፈጸመ ጊዜና ተደራጊ ቅርጽ በባሕሩ ላይ እየተከሰተ ያለን ቀጣይ መናወጥ ያመለክታል። ‘ይናወጥ ነበር’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ግሪኩ በግልጽ ያልጠቀሰውን የማዕበል ምስል አይጨምርም።
