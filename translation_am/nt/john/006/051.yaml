    issue: “እኔም” renders δέ as an additive particle modifying the subject.
    rationale: The Greek δέ develops the statement (“and/now”), not “I also.” “ግን” naturally marks the discourse transition without adding subject emphasis.
  - severity: low
    issue: Footnote a says “እስከ ዘመኑ,” which is not a sound literal representation of εἰς τὸν αἰῶνα.
    rationale: “እስከ” denotes a limit ('until'), whereas εἰς is directional. The note should describe the Greek expression without presenting an inaccurate Amharic literal sentence.
