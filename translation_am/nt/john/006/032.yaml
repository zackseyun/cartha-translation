base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: am
  text: ስለዚህ ኢየሱስ እንዲህ አላቸው፦ “እውነት እውነት እላችኋለሁ፤ ከሰማይ የመጣውን እንጀራ የሰጣችሁ ሙሴ አይደለም፤[a] ነገር ግን አባቴ እውነተኛውን ከሰማይ የመጣውን እንጀራ[b] ይሰጣችኋል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሰማይ የመጣውን እንጀራ የሰጣችሁ ሙሴ አልነበረም።” በግሪኩ አሉታው ከ«ሙሴ» በፊት ስለሚመጣ፣ አጽንዖቱ በተለይ ሰጪው ማን እንደሆነ ላይ ነው።
    reason: lexical_alternative
  - marker: b
    text: «እውነተኛው እንጀራ» የሚለው «እውነተኛ» ወይም «ጥልቅ እውነታ ያለው» እንጀራ ማለት ሊሆን ይችላል፤ ከቀደመው መና ጋር በንጽጽር ይቀርባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ውይይት የሚቀጥለውን የሐሳብ ግንኙነትና ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የዮሐንስን አጽንዖታዊና የተደገመ የንግግር መግቢያ ሳያሳጥር በግልጽ አማርኛ ያቀርባል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛ አነጋገር ከክብር ያለው መግቢያ ጋር በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: የሰጣችሁ ሙሴ አይደለም
  rationale: አሉታው በሙሴ ላይ ያለውን የድርጊት ፈጻሚ አጽንዖት በተፈጥሯዊ የአማርኛ አጽንዖታዊ አወቃቀር ይጠብቃል።
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ የሆነውን እንጀራ
  rationale: የመገኛ ምንጩን ምስል በግልጽና በተለመደ አማርኛ ይጠብቃል።
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: ነገር ግን አባቴ … ይሰጣችኋል
  rationale: በሙሴና በአብ መካከል ያለውን ንጽጽር እንዲሁም δίδωσιν የሚያመለክተውን የአሁን ስጦታ ያስቀምጣል።
- source_word: τὸν ἀληθινόν
  choice: እውነተኛውን
  rationale: በዮሐንስ አጠቃቀም ያለውን ‘እውነተኛ፣ የተጨበጠ፣ ፍጹም እውነታ’ የሚል የትርጉም ስፋት ሳይገድብ ይጠብቃል።
theological_decisions:
- issue: በሙሴ የተያያዘው ያለፈ ስጦታና የአብ የአሁን ስጦታ
  choice: “የሰጣችሁ … አይደለም” እና “ይሰጣችኋል” በማለት የግሪኩን የጊዜና የአንጻር ልዩነት ማስቀመጥ
  alternative: “ሙሴ አልሰጣችሁም … አባቴ ይሰጣችኋል”
  rationale: ጥቅሱ የሚያነጻጽረው ፈጻሚዎቹን ብቻ ሳይሆን ከሙሴ ጋር የተያያዘውን የቀድሞ መናና አብ አሁን የሚሰጠውን ስጦታ ጭምር ነው።
- issue: “እውነተኛው እንጀራ” የሚለው ትርጉም
  choice: በዋናው ጽሑፍ “እውነተኛውን … እንጀራ” ብሎ ማቆየት
  alternative: “እውነተኛው ትክክለኛ እንጀራ” ወይም “ፍጹሙ እንጀራ” ብሎ በትርጓሜ ማስፋት
  rationale: ἀληθινός በዮሐንስ ውስጥ እውነተኛነትን፣ ጥልቅ እውነታንና ፍጻሜያዊነትን ሊያመለክት ስለሚችል ትርጉሙን ያለአስፈላጊ ሁኔታ አይገድብም።
