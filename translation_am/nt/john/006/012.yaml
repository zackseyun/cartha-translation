  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ታሪካዊው የአሁን ጊዜ ቅርጽ በዋናው ጽሑፍ ተጠብቆ፣ የተለመደው ያለፈ ጊዜ አማራጭ በማስታወሻ ቀርቧል።
