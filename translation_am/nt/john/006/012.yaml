  rationale: በምግብ ዐውድ ‘ተሞሉ’ ከሚለው ቃል በቃል አገላለጽ ይልቅ ተፈጥሯዊ ሲሆን፣ መሙላትንና መርካትን የሚያካትተውን የግሪክኛውን ፍቺ ይጠብቃል።
- source_word: λέγει τοῖς μαθηταῖς αὐτοῦ
  choice: እርሱ ደቀ መዛሙርቱን … ይላቸዋል
  rationale: λέγει የሚለውን ታሪካዊ የአሁን ጊዜ አገላለጽ ጠብቆ፣ μαθηταίን በተለመደውና ትክክለኛው ‘ደቀ መዛሙርት’ ይተረጉማል።
- source_word: Συναγάγετε
  choice: ሰብስቡ
  rationale: ቀጥተኛውን ብዙ ቁጥር ትእዛዝ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: የተረፉትን ቁርስራሾች
  rationale: περισσεύσαντα ከምግቡ በኋላ የተረፈውን፣ κλάσματα ደግሞ የተቆራረሱ የእንጀራ ቁራጮችን ያመለክታል፤ ‘ቁርስራሾች’ ሁለቱንም በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: ἵνα μή τι ἀπόληται
  choice: አንዳችም እንዳይጠፋ
  rationale: የዓላማውን አንቀጽና የτιን አጠቃላይ አሉታዊ ሐሳብ ይጠብቃል፤ ‘እንዳይባክን’ የዐውዱ ፍቺ ቢሆንም ‘እንዳይጠፋ’ ለἀπόληται ይበልጥ ቅርብ ነው።
theological_decisions:
- issue: በምልክቱ ዐውድ ἀπόληταιን ከመጠን በላይ በሥነ መለኮታዊ መንገድ የማንበብ አደጋ
  choice: “እንዳይጠፋ” ተብሎ በቅርብ የቁሳዊ ዐውዱ ተተርጉሟል።
  alternative: “እንዳይባክን” ወይም ሥነ መለኮታዊ ድምፅ ሊኖረው የሚችል “እንዳይጠፋ”ን በድነት ትርጉም መግለጽ።
  rationale: የቅርቡ ማጣቀሻ የተረፉት የምግብ ቁርስራሾች ናቸው። ሆኖም ቃል በቃል ቅርበቱን መጠበቅ በዮሐንስ ውስጥ ሊሰማ የሚችለውን ሰፊ ድምፅ ሳይጫንም ሳይደመስስም ይተወዋል።
