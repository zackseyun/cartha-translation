  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: am
  text: እነርሱም ከጠገቡ[a] በኋላ፣ እርሱ ለደቀ መዛሙርቱ እንዲህ ይላቸዋል[b]፦ “የተረፉትን ቁርስራሾች[c] ሰብስቡ፤ አንዳችም እንዳይጠፋ[d]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጠግበው ከበሉ በኋላ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው በታሪካዊ የአሁን ጊዜ አገላለጽ “ይላቸዋል” ይላል፤ በአማርኛ “አላቸው” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “የተቆራረሱትን ቁራጮች።”
