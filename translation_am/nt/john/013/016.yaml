  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: am
  text: 'እውነት[a] እውነት እላችኋለሁ፤ ባሪያ[b] ከጌታው[c] አይበልጥም፤ ሐዋርያም[d] ከላከው ሰው አይበልጥም።


    [a] ወይም፣ “አሜን፣ አሜን።” ቃሉ ሁለት ጊዜ መደገሙ ንግግሩን በጽኑ ያረጋግጣል።


    [b] ወይም፣ “አገልጋይ።” የግሪኩ ቃል በጌታ ሥልጣን ሥር ያለን ሰው ያመለክታል፤ “ባሪያ” ይህን ጠንካራ ማኅበራዊ ግንኙነት ይጠብቃል።


    [c] ወይም፣ “ባለቤቱ።” እዚህ “ጌታ” የባሪያውን ባለሥልጣን በሚያመለክተው ማኅበራዊ ትርጉሙ ገብቷል።


    [d] ወይም፣ “መልእክተኛ።”'
