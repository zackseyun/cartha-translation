lexical_decisions:
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ የትረካ አሁን ጊዜ በአማርኛ ትረካ በተፈጥሮ ባለፈ ጊዜ ይገለጻል፤ የድርጊቱ ሕያውነት ሳይጠፋ የቋንቋውን ልማድ ይከተላል።
- source_word: αὐτῷ
  choice: -ው (አለው)
  rationale: የተሳቢው ተውላጠ ስም በአማርኛ ከግሱ ጋር በተዋሐደ መልኩ ተገልጿል፤ ከዐውዱ ኢየሱስን ያመለክታል።
- source_word: Σίμων Πέτρος
  choice: ስምዖን ጴጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጻጻፍ የተለመደውን ቅርጽ ይከተላል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ ጥሪ ቅርጹንና የκύριοςን የክብርና የሥልጣን ኃይል ይጠብቃል።
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: ብቻ ሳይሆን ... -ም
  rationale: የግሪኩን ‘ብቻ ሳይሆን ደግሞ’ የሚል ንጽጽራዊ መስፋፋት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς πόδας μου
  choice: እግሮቼን
  rationale: የባለቤትነት ቅጥያውንና የብዙ ቁጥር ትርጉሙን በቀጥታ ይገልጻል።
- source_word: τὰς χεῖρας
  choice: እጆቼን
  rationale: በተያያዘው ዝርዝር ውስጥ ከμου የሚገባውን ባለቤትነት አማርኛ በግልጽ ይገልጻል።
- source_word: τὴν κεφαλήν
  choice: ራሴን
  rationale: ‘ራስ’ የκεφαλή መደበኛ ትርጉም ሲሆን የባለቤትነት ቅጥያውም በዐውዱ መሠረት ተጨምሯል።
- source_word: '[ellipsis of νίψῃς / wash]'
  choice: እጠበኝ
  rationale: በግሪኩ ይህ ግስ ከቀደመው ንግግር የሚገባ የተዘለለ አካል ነው፤ በአማርኛ ዐረፍተ ነገሩን ሙሉና ተፈጥሯዊ ለማድረግ በግልጽ ተገልጿል።
