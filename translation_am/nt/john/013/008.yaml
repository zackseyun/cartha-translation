  text: ጴጥሮስም፣ “እግሮቼን ፈጽሞ አታጥብም!” አለው። ኢየሱስም፣ “ካላጠብሁህ፣ ከእኔ ጋር ድርሻ የለህም[a]” ብሎ መለሰለት።
