lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: ፈጽሞ አታጥበኝም
  rationale: ድርብ አሉታው οὐ μή እና εἰς τὸν αἰῶνα የጴጥሮስን ጽኑ እምቢታ ያሳያሉ፤ “ፈጽሞ” ይህን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μου τοὺς πόδας
  choice: እግሮቼን
  rationale: የግሪኩን ግልጽ ብዙ ቁጥርና የባለቤትነት አገላለጽ በቀጥታ ይጠብቃል።
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: ኢየሱስም … ብሎ መለሰለት
  rationale: የትረካውን የመልስ ግስ በተፈጥሯዊ የአማርኛ የቀጥታ ንግግር አወቃቀር ያቀርባል።
- source_word: Ἐὰν μὴ νίψω σε
  choice: ካላጠብሁህ
  rationale: አሉታዊውን ሁኔታዊ ሐረግና የድርጊቱን ተቀባይ “አንተን” በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል፤ እዚህ ግሪኩ “እግሮችህን” ብሎ አይደግምም።
- source_word: οὐκ ἔχεις μέρος
  choice: ድርሻ የለህም
  rationale: μέρος ሊያመለክት የሚችለውን ተሳትፎ፣ ተካፋይነት ወይም እጣ ሳያጠብ የሚያስተላልፍ ሰፊና የተለመደ ቃል ነው።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: μετά ከወራሽ ቅጽ ጋር ያለውን የአብሮነትና የግንኙነት ትርጉም በቀጥታ ይጠብቃል፤ “በእኔ” የሚል ሌላ ዮሐንሳዊ አገላለጽ አያስገባም።
theological_decisions:
- issue: “ከእኔ ጋር ድርሻ” የሚለው የኢየሱስ ንግግር ትርጉም
  choice: ከኢየሱስ ጋር ያለ ተሳትፎና ኅብረትን የሚያመለክት ሰፊ አገላለጽ
  alternative: ጥምቀታዊ ወይም ሌላ ምሥጢራዊ መንጻት፤ የትሕትና አገልግሎት ምልክት ብቻ፤ ወይም የድነት አባልነትን ብቻ የሚገልጽ ንግግር
  rationale: ጥቅሱ የኢየሱስ ማጠብ ጴጥሮስ ከእርሱ ጋር ድርሻ እንዲኖረው አስፈላጊ መሆኑን ይናገራል፤ ነገር ግን μέρος ይህ በትክክል በምን ሥነ መለኮታዊ መንገድ እንደሚፈጸም አይወስንም። ስለዚህ ትርጉሙ ውጥረቱን ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ፈጽሞ” የጴጥሮስን ጽኑ እምቢታ ይገልጻል፤ “ድርሻ” ደግሞ ጥቅሱ ያልወሰነውን የሥነ መለኮት ዝርዝር ሳይጨምር የμέροςን ስፋት ይጠብቃል። የግርጌ ማስታወሻው ምልክት ትክክለኛው የቃል አማራጭ ባለበት “ድርሻ” በኋላ ተቀምጧል።
