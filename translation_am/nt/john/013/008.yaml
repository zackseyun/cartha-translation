review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Peter’s emphatic refusal, the explicit object “my feet,” Jesus’ conditional response, and the broad relational force of μέρος μετ’ ἐμοῦ. However, the first direct-speech verb form is grammatically and semantically defective: “አታጥበኝም” means “you do not/will not wash me,” whereas the Greek explicitly has “wash my feet.”'
  naturalness: The proposed wording is otherwise clear and modern. Replacing the defective verbal form with “እግሮቼን ፈጽሞ አታጥብም” is idiomatic and preserves the forceful future refusal. “ድርሻ የለህም” is natural in context.
  terminology: “ድርሻ” suitably renders the deliberately broad μέρος without deciding among doctrinal interpretations. “ክፍል” remains a valid lexical alternative in the footnote. The name ኢየሱስ and the title-free narrative register are appropriate.
  issues:
  - severity: medium
    issue: The phrase “እግሮቼን ፈጽሞ አታጥበኝም” mixes an explicit accusative object (“my feet”) with the object-suffix verb “wash me.”
    rationale: The Greek says μου τοὺς πόδας, “my feet,” not “me.” In Amharic, with “እግሮቼን” as the object, the verb should be “አታጥብም,” without -ኝ. The present draft is ungrammatical/semantically conflicting and obscures the source’s explicit object.
  revised_text: ጴጥሮስም፣ “እግሮቼን ፈጽሞ አታጥብም!” አለው። ኢየሱስም፣ “ካላጠብሁህ፣ ከእኔ ጋር ድርሻ የለህም[a]” ብሎ መለሰለት።
  revised_footnotes:
