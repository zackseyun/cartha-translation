- source_word: ποιῆτε
  choice: ብታደርጓቸው
  rationale: ትምህርቱን በተግባር መፈጸምን በአጭርና ቀጥተኛ አገላለጽ ያሳያል።
- source_word: αὐτά
  choice: -አቸው
  rationale: ወደ ‘እነዚህን ነገሮች’ የሚመለሰውን የብዙ ቁጥር ተውላጠ ስም በግሱ ውስጥ በተፈጥሯዊ አማርኛ ይይዛል።
