- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: ወደ ኢየሱስ ቀደም ሲል ያሳየውና ያስተማረው የሚመለሰውን የግሪኩን ገለልተኛ ብዙ ቁጥር ይጠብቃል።
- source_word: οἴδατε
