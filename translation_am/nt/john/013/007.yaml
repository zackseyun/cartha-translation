  text: ኢየሱስም መልሶ እንዲህ አለው፦ “እኔ የማደርገውን አንተ አሁን አታውቅም[a]፤ ግን ከእነዚህ በኋላ[b] ትረዳዋለህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ ጽሑፍ እዚህና በዓረፍተ ነገሩ መጨረሻ ላይ ሁለት የተለያዩ ግሶች ተጠቅመዋል፤ አንደኛው ብዙ ጊዜ ‘ማወቅ’፣ ሁለተኛውም ‘ማወቅ/መረዳት’ ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል ‘ከእነዚህ ነገሮች በኋላ’ ማለት ነው። ይህ በዚህ ክፍል የሚቀጥለውን ነገር ወይም የኢየሱስን ድርጊት በኋላ የሚያብራሩ ሰፋ ያሉ ክስተቶችን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: መልሶ እንዲህ አለው
  rationale: የግሪኩን ‘መለሰና አለው’ የሚለውን ድርብ የንግግር መግቢያ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል፤ የαὐτῷ ነጠላ ተቀባይም በ‘አለው’ ተጠብቋል።
- source_word: Ὃ ἐγὼ ποιῶ
  choice: እኔ የማደርገውን
  rationale: በወቅቱ እየተከናወነ ያለውን የኢየሱስ ተግባር ያመለክታል፤ ‘እኔ’ የሚለውም በምንጩ ያለውን ግልጽ ተውላጠ ስም ይጠብቃል።
- source_word: οὐκ οἶδας ἄρτι
  choice: አሁን አታውቅም
  rationale: οἶδαςን በመደበኛው ‘ማወቅ’ ትርጉም ያቀርባል፤ ἄρτιም በግልጽ ‘አሁን’ ተብሏል።
- source_word: γνώσῃ
  choice: ትረዳዋለህ
  rationale: ወደፊት የድርጊቱን ትርጉም በመገንዘብ የሚመጣውን እውቀት ያሳያል፤ ከοἶδας ጋር ያለውን የግስ ልዩነትም በአማርኛ ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: በአሁኑ አለማወቅና በኋላ መረዳት መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετὰ ταῦτα
  choice: ከዚህ በኋላ
  rationale: የግሪኩን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል፤ የሚያመለክተውን ትክክለኛ የኋላ ክስተት ግን አይወስንም።
theological_decisions:
- issue: ወደፊት የሚመጣው መረዳት የጊዜ ወሰን
  choice: ‘ከዚህ በኋላ’ ተብሎ በአጠቃላይ ቀርቧል።
