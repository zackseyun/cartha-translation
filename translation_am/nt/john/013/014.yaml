  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: am
  text: እንግዲህ ጌታ[a]ና መምህር የሆንሁት እኔ እግሮቻችሁን ካጠብኩ፣ እናንተም የእርስ በርሳችሁን እግሮች ልታጥቡ ይገባችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አለቃ»። የግሪክኛው κύριος ቃል እንደ ዐውዱ «ጌታ» ወይም «አለቃ» ሊተረጎም ይችላል፤ እዚህ እንደ ማዕረግ «ጌታ» ተብሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: እንግዲህ … ካጠብኩ
  rationale: የοὖνን የድምዳሜ ኃይል «እንግዲህ» ይገልጣል፤ የεἰ ሁኔታዊ አገባብ ደግሞ በ«ካጠብኩ» በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ለመጠበቅ «እኔ» ተገልጿል።
- source_word: ἔνιψα
  choice: ካጠብኩ
  rationale: ኢየሱስ አሁን ያጠናቀቀውን የእግር ማጠብ ድርጊት ይጠቁማል፤ የአማርኛው ፍጹም ድርጊት ቅርጽ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ὑμῶν τοὺς πόδας
  choice: እግሮቻችሁን
  rationale: የግሪክኛውን ባለቤትነትና ቀጥተኛ ተሳቢ በአንድ ተፈጥሯዊ የአማርኛ ቃል ይገልጣል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: κύριοςን እንደ ማዕረግ ይጠብቃል፤ በዐውዱም የኢየሱስን ሥልጣንና ትሕትናውን ያነጻጽራል።
- source_word: ὁ διδάσκαλος
  choice: መምህር
  rationale: ቃሉን እንደ ኢየሱስ ማዕረግ በቀጥታና በተለመደ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: «-ም» የκαίን ‘ደግሞ’ ኃይል ሲያሳይ፣ በግልጽ የተጠቀሰው «እናንተ» የὑμεῖςን አጽንዖት ይጠብቃል።
- source_word: ὀφείλετε
  choice: ልታጥቡ ይገባችኋል
  rationale: የቃሉን የግዴታና የሥነ ምግባር ዕዳ ሐሳብ ያስተላልፋል፤ ከግሪክኛው ይልቅ የከረረ ቀጥተኛ ትእዛዝ አያደርገውም።
- source_word: ἀλλήλων
  choice: የእርስ በርሳችሁን
  rationale: የተደጋጋሚ ግንኙነቱን ‘እርስ በርስ’ በሚለው መደበኛ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: νίπτειν τοὺς πόδας
  choice: እግር ልታጥቡ
  rationale: νίπτω የአካልን ክፍል ማጠብ የሚያመለክት ስለሆነ፣ ተጨባጩ የእግር ማጠብ ድርጊት ሳይጠቃለል ተጠብቋል።
theological_decisions:
- issue: κύριοςን እንደ ክርስቶሳዊ ማዕረግ መተርጎም
  choice: ጌታ
  alternative: አለቃ
  rationale: «ጌታ» የቃሉን መደበኛ የማዕረግ ትርጉም ይጠብቃል፤ በዚህ ዐውድ ኢየሱስ ከፍ ያለ ሥልጣን ቢኖረውም ዝቅ ብሎ ማገልገሉ የደቀ መዛሙርቱን ግዴታ መሠረት እንደሚሆን ያሳያል።
- issue: የእግር ማጠብ ንግግሩ ተጨባጭነት
  choice: «የእርስ በርሳችሁን እግር ልታጥቡ» ብሎ ተጨባጩን ድርጊት ማቆየት
  alternative: «በትሕትና እርስ በርሳችሁ ተገልገሉ» ብሎ ማጠቃለል
  rationale: ግሪክኛው በግልጽ እግር ማጠብን ይጠቅሳል። ድርጊቱ ሰፊ አርአያዊ ትርጉም ቢኖረውም፣ ዋናው ጽሑፍ ከምንጩ በላይ በማጠቃለል ያንን ተጨባጭ ንግግር አይተካም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጌታና መምህር የሆንሁት እኔ» የሚለው ቅርጽ የግሪክኛውን ግልጽ ἐγώ አጽንዖት ይጠብቃል፤ «ይገባችኋል» ደግሞ ግዴታውን በተፈጥሯዊ አማርኛ ይገልጣል።
