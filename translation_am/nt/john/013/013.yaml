  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: am
  text: እናንተ “መምህር”ና “ጌታ”[a] ብላችሁ ትጠሩኛላችሁ፤ በትክክልም ትላላችሁ፤ እኔ ነኝና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አለቃ።” የግሪኩ κύριος ሥልጣንን ወይም ጌትነትን ሊያመለክት ይችላል፤ እዚህ ግን “ጌታ” ለዚህ ማዕረግ መደበኛው ትርጉም ሆኖ ተጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: ብላችሁ ትጠሩኛላችሁ
  rationale: በዚህ የስም ወይም የማዕረግ አጠራር አወቃቀር ውስጥ የግሪኩን ‘እኔን X ብላችሁ ትጠራላችሁ’ የሚለውን ቀጥተኛ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ὁ διδάσκαλος
  choice: መምህር
  rationale: የኢየሱስን የማስተማር ማዕረግ በዘመናዊና ግልጽ አማርኛ ይገልጣል፤ የግሪኩ የተወሰነ መስተአምር በዚህ የአጠራር አወቃቀር በአማርኛ በተናጠል መተርጎም አያስፈልገውም።
- source_word: Ὁ κύριος
  choice: ጌታ
  rationale: κύριος እዚህ ኢየሱስ የተቀበለው የሥልጣንና የጌትነት ማዕረግ ነው፤ ‘ጌታ’ የአዲስ ኪዳንን የማዕረግ አጠቃቀም በጥሩ ሁኔታ ያቆያል።
- source_word: καλῶς λέγετε
  choice: እንዲህ ማለታችሁም ትክክል ነው
  rationale: የንግግራቸውን ትክክለኛነት የሚያረጋግጠውን የግሪኩን ኃይል ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: εἰμὶ γάρ
  choice: እኔ ነኝና
  rationale: አጭሩንና አጽንዖት ያለውን የራስ መግለጫ ይጠብቃል፤ -ና የምክንያት ግንኙነቱን ያሳያል።
theological_decisions:
- issue: κύριοςን ለኢየሱስ እንደ ማዕረግ መተርጎም
  choice: ጌታ
  alternative: አለቃ
  rationale: ጥቅሱ ደቀ መዛሙርቱ κύριος ብለው መጥራታቸውን ኢየሱስ እንደሚያጸድቅ ያሳያል። ‘ጌታ’ የማዕረጉን ሥነ መለኮታዊ ክብደት ሳያሰፋ ይጠብቃል፤ ‘አለቃ’ ግን የሥልጣን አማራጭ ትርጉሙን ያሳያል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ ነው። የግሪኩ አጭር ምክንያታዊ መደምደሚያ ‘እኔ ነኝና’ ተብሎ ተጠብቋል።
