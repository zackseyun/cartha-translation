  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: am
  text: ስለዚህ ስምዖን ጴጥሮስ፣ እርሱ የሚናገርለት ሰው ማን እንደሆነ እንዲጠይቀው፣ ለዚህ ደቀ መዝሙር በምልክት አሳየው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፦ “ስምዖን ጴጥሮስም እርሱ ስለማን እንደሚናገር እንዲጠይቅ ለእርሱ ምልክት አደረገ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: በምልክት ነገረው
  rationale: ግሱ በንግግር ሳይሆን በእጅ፣ በራስ ወይም በሌላ አካላዊ ምልክት መልእክት ማስተላለፍን ያመለክታል፤ አገላለጹ ምልክቱ በራስ ንቅናቄ ብቻ እንደተደረገ አይወስንም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር የሚከተለውን የትረካ ውጤትና ቅደም ተከተል ያሳያል።
- source_word: τούτῳ
  choice: ለዚህ ደቀ መዝሙር
  rationale: የግሪኩን ጠቋሚ ተውላጠ ስም ኃይል ጠብቆ፣ በቀደመው አውድ የተጠቀሰውን ደቀ መዝሙር በግልጽ ያመለክታል።
- source_word: πυθέσθαι
  choice: እንዲጠይቀው
  rationale: የጴጥሮስ ምልክት ዓላማ ደቀ መዝሙሩ ኢየሱስን እንዲጠይቅ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τίς ἂν εἴη
  choice: ማንን እንደሆነ
  rationale: የሚጠየቀው ሰው ማን እንደሆነ የማይታወቅበትን ሁኔታ በተፈጥሯዊ የዘወትር አማርኛ ይገልጻል፤ የἄν እና የoptative አሻሚነት በአማርኛው ቀጥተኛ ጥያቄ አወቃቀር ውስጥ ይጠበቃል።
- source_word: περὶ οὗ λέγει
  choice: ይናገርበት የነበረው
  rationale: περί የሚያመለክተውን ‘ስለ/በተመለከተ’ ግንኙነት በአማርኛው የግስ ቅጥያ -በት ያሳያል፤ የትረካውን ፍሰት ለማስማማት የግሪኩ የአሁን ጊዜ ግስ እንደ ቀድሞ ቀጣይ ድርጊት ተተርጉሟል።
