source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: am
  text: ልጆቼ ሆይ፣ ገና ጥቂት ጊዜ ከእናንተ ጋር እሆናለሁ። ትፈልጉኛላችሁ፤ ለአይሁድ[a]፣ “እኔ ወደምሄድበት እናንተ መምጣት አትችሉም[b]” እንዳልኳቸው፣ አሁን ለእናንተም እላለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለአይሁድ መሪዎች።” በዮሐንስ ወንጌል “አይሁድ” የሚለው ቃል እንደ አውዱ አንዳንድ ጊዜ በተለይ የይሁዳን ባለሥልጣናት ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “የመምጣት ችሎታ የላችሁም።” አገላለጹ አለመቻልን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: ልጆቼ ሆይ
  rationale: የቃሉን የቤተሰብ ምሳሌና የፍቅር አጠራር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃል በቃል ‘ትንንሽ ልጆች’ ማለት በዚህ አውድ ያልተፈጥሯዊ ነው።
- source_word: ἔτι μικρόν
  choice: ገና ጥቂት ጊዜ
  rationale: ከዚህ በኋላ የቀረው ጊዜ አጭር መሆኑን የሚገልጠውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ከእናንተ ጋር እሆናለሁ
  rationale: ከ‘ገና ጥቂት ጊዜ’ ጋር ተያይዞ በአማርኛ የቀረውን የመገኘት ጊዜ በግልጽና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ζητήσετέ με
  choice: ትፈልጉኛላችሁ
  rationale: የወደፊት ጊዜውንና ‘መፈለግ/መሻት’ የሚለውን ሰፊ ትርጉም ይጠብቃል።
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: ለአይሁድ … እንዳልኳቸው
  rationale: Ἰουδαίοιςን ሳያጠብ ‘ለአይሁድ’ ብሎ ያቀርባል፤ καθώς የሚገልጠውን ንጽጽርም ‘እንዳልኳቸው’ በማለት ይጠብቃል።
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: እኔ ወደምሄድበት
  rationale: የመሄድንና ከዚህ የመለየትን ሐሳብ ያለ ትርጓሜያዊ ጭማሪ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: መምጣት አትችሉም
  rationale: δύνασθε የሚገልጠውን አለመቻል በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: አሁን ለእናንተም እላለሁ
  rationale: ἄρτιን ‘አሁን’ ብሎ ይተረጉማል፤ የቀድሞው ንግግር አሁን ለደቀ መዛሙርቱም መነገሩን ‘-ም’ ያሳያል።
theological_decisions:
- issue: በዮሐንስ ወንጌል Ἰουδαίοις የሚለው ቃል ወሰን
  choice: ለአይሁድ
  alternative: ለአይሁድ መሪዎች
  rationale: የግሪክ ቃሉ በቀጥታ ‘አይሁድ’ ይላል። በአንዳንድ የዮሐንስ አውዶች በተለይ የይሁዳ ባለሥልጣናትን ሊያመለክት ቢችልም፣ ይህ ቁጥር በራሱ ትርጉሙን ወደ ‘መሪዎች’ እንድናጠብ አያስገድድም። ስለዚህ ዋናው ጽሑፍ የምንጩን ስፋት ይጠብቃል፣ የአውድ አማራጩም በማስታወሻ ተቀምጧል።
- issue: οὐ δύνασθε ἐλθεῖν የሚገልጠው አለመቻል
  choice: መምጣት አትችሉም
  alternative: ወደዚያ መምጣት አትችሉም
  rationale: ጽሑፉ አለመቻልን ይገልጣል እንጂ ምክንያቱን አይወስንም። ስለዚህ የመንፈሳዊ ብቃት፣ የፈቃድ ክልከላ ወይም የጊዜ ገደብ ብሎ አንዱን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ልጆቼ ሆይ’ የኢየሱስን ርኅራኄ ያለ ሕፃናዊ ወይም ያልተፈጥሯዊ አነጋገር ያስተላልፋል። በቀረበው የእንግሊዝኛ ማማከሪያ ምልክቶቹ ከማስታወሻዎቹ ጋር ያልተጣጣሙ ስለነበር፣ [a] ከ‘አይሁድ’ ጋር፣ [b] ደግሞ ከ‘መምጣት አትችሉም’ ጋር ተያይዘው በትክክለኛው ቦታ ተቀምጠዋል።
