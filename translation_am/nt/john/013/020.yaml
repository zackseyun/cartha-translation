base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: am
  text: እውነት እውነት እላችኋለሁ፤ እኔ የምልከውን ማንኛውንም ሰው[a] የሚቀበል እኔን ይቀበላል፤ እኔንም የሚቀበል የላከኝን[b] ይቀበላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «እኔ የምልከውን ማንንም የሚቀበል።» የግሪኩ አገላለጽ የሚላከውን ሰው አስቀድሞ አይወስንም።
    reason: lexical_alternative
  - marker: b
    text: በዚህ አውድ «የላከኝ» የሚለው አብን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የተደገመውን አጽንዖትና የኢየሱስን የተከበረ መግቢያ አገላለጽ በዘመናዊና ግልጽ አማርኛ ያቆያል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የአሁን ጊዜውን ግስና የብዙ ቁጥር ተደራሲዎችን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ λαμβάνων
  choice: የሚቀበል
  rationale: የግሪኩ ተሳቢ አገላለጽ አጠቃላይና ወካይ ትርጉም አለው፤ ይህ ምርጫ ትርጉሙን በጾታ ሳይገድብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄν τινα πέμψω
  choice: እኔ የምልከውን ማንኛውንም ሰው
  rationale: ἄν፣ τινα እና የንዑስ አንቀጽ ግሱ የሚገልጹትን ያልተወሰነና ክፍት ወሰን—ኢየሱስ ሊልከው የሚችለውን ማንኛውንም ሰው—ያቆያል።
- source_word: λαμβάνει
  choice: ይቀበላል
  rationale: አንድን ሰው መቀበል ወይም እውቅና መስጠትን ያመለክታል፤ ቃሉን በሦስቱም ስፍራዎች መድገም የውክልናውን ሰንሰለት ያጎላል።
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: እኔንም የሚቀበል
  rationale: δέ እዚህ ጠንካራ ተቃርኖ ሳይሆን አያያዥ ነው፤ «-ም» ትይዩውን አገላለጽ በተፈጥሯዊ ሁኔታ ያያይዛል።
- source_word: τὸν πέμψαντά με
  choice: የላከኝን
  rationale: ላኪውን በግንኙነታዊ አገላለጽ ይጠብቃል፤ በጥቅሱ ውስጥ በግልጽ ያልተጠቀሰውን «አብ» የሚለውን ስያሜ ወደ ዋናው ጽሑፍ አያስገባም።
theological_decisions:
