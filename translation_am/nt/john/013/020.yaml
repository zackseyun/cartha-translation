- issue: የወንድ ፆታ ቅርጽ ያለው አጠቃላይ ተሳቢ
  choice: የሚቀበል
  alternative: የሚቀበለው ወንድ
  rationale: የግሪኩ ወንድ ነጠላ ቅርጽ እዚህ ወካይና አጠቃላይ እንጂ ወንዶችን ብቻ የሚገድብ አይደለም።
