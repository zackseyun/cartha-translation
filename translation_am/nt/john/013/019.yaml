source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: am
  text: ከአሁን ጀምሮ፣ ነገሩ ከመሆኑ በፊት፣ በሚሆንበት ጊዜ እኔ እንደ ሆንሁ[a] እንድታምኑ እነግራችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እኔ እንደ ሆንሁ።” ወይም፣ “እኔ እርሱ እንደ ሆንሁ።” የግሪክ አገላለጹ ግልጽ ማሟያ የለውም፤ በኢሳይያስና በሌሎች የዮሐንስ ክፍሎች ያለውን መለኮታዊ ራስን መግለጥ ሊያስተጋባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: ከአሁን ጀምሮ
  rationale: የአሁኑን ጊዜ መነሻ አድርጎ ወደፊት የሚቀጥል ጊዜን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: λέγω ὑμῖν
  choice: እነግራችኋለሁ
  rationale: ቀጥተኛውን ንግግርና የአሁን ጊዜውን አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρὸ τοῦ γενέσθαι
  choice: ነገሩ ከመሆኑ በፊት
  rationale: πρό ከተውሳከ ግስ ጋር የሚያመለክተውን ቀዳሚ ጊዜ ይጠብቃል፤ በዐውዱ የታሰበውን ክስተት ‘ነገሩ’ በማለት ያለ ትርጓሜ ጭማሪ ያመለክታል።
- source_word: ἵνα
  choice: እንድታምኑ ነው
  rationale: የዓላማ አንቀጹን በአማርኛ ተፈጥሯዊ በሆነ የእንዲ- ግንባታ ይገልጻል።
- source_word: πιστεύσητε
  choice: እንድታምኑ
  rationale: የπιστεύωን ዋና ፍቺ ‘ማመን’ በመጠቀም ይጠብቃል፤ ከἵνα ጋር ያለውን የዓላማ ኃይልም ያስተላልፋል።
- source_word: ὅταν γένηται
  choice: ይህም በሚሆንበት ጊዜ
  rationale: ወደፊት የሚፈጸመውን ክስተትና የጊዜ ግንኙነቱን ያለ አላስፈላጊ ማጠናከር ይገልጻል።
- source_word: ὅτι ἐγώ εἰμι
  choice: እኔ እንደሆንሁ
  rationale: በግሪክ ጽሑፉ ግልጽ የሆነ ማሟያ ስለሌለ፣ ፍጹሙን ‘ἐγώ εἰμι’ በቅርብ መልኩ ይጠብቃል፤ የዮሐንስንና የኢሳይያስን የመለኮታዊ ራስን መግለጥ ድምፅ ሳይደብቅ አሻሚነቱን ያቆያል።
theological_decisions:
- issue: በዮሐንስ ዐውድ ፍጹም ሆኖ የቀረውን ἐγώ εἰμι እና ሊኖረው የሚችለውን የመለኮታዊ ራስን መግለጥ ጥቆማ መተርጎም
  choice: እኔ እንደሆንሁ
  alternative: እኔ እርሱ እንደሆንሁ
  rationale: የግሪክ ጽሑፉ ተሳቢ ወይም ግልጽ ማሟያ አልያዘም። ‘እኔ እንደሆንሁ’ ይህን አወቃቀርና ሊኖረው የሚችለውን ኢሳይያሳዊ ድምፅ ይጠብቃል፤ ‘እኔ እርሱ እንደሆንሁ’ ግን ለአማርኛ አንባቢ ይበልጥ ግልጽ ቢሆንም በምንጩ ያልተገለጸ ማሟያ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ἐγώ εἰμι አሻሚነት በዋናው ጽሑፍ ተጠብቆ፣ በግልጽነት ሊነበብ የሚችለው አማራጭ በማስታወሻ ቀርቧል።
