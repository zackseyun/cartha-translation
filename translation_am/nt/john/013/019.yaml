  to: ከአሁን ጀምሮ፣ ነገሩ ከመሆኑ በፊት፣ በሚሆንበት ጊዜ እኔ እንደ ሆንሁ[a] እንድታምኑ እነግራችኋለሁ።
  rationale: 'The revision keeps every source element while using a more natural Amharic sentence order: Jesus tells them beforehand for the purpose that, when the event occurs, they may believe. The absolute, potentially allusive ἐγώ εἰμι remains unexpanded in the text, and the supplied-predicate alternative is retained in a precisely framed footnote.'
