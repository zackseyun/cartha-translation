base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: am
  text: ስለዚህ፣ እርሱ ከወጣ በኋላ ኢየሱስ፣ “አሁን የሰው ልጅ ከብሯል፤ እግዚአብሔርም በእርሱ[a] ከብሯል” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእርሱ አማካይነት።” የግሪኩ ሐረግ እግዚአብሔር በእርሱ እንደከበረ ወይም በእርሱ አማካይነት እንደከበረ ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: ከወጣ በኋላም
  rationale: ὅτε የጊዜ ግንኙነቱን በ«በኋላ» ያሳያል፤ οὖν የትረካውን ቀጣይነት በአያያዥ «ም» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξῆλθεν
  choice: ከወጣ
  rationale: የይሁዳን ከቦታው መውጣት ያሳያል፤ «ወጣ» ከ«ሄደ» ይልቅ የግሪኩን የቦታ ትርጉም ይጠብቃል።
- source_word: λέγει
  choice: አለ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በዘመናዊ የአማርኛ ትረካ ተፈጥሯዊ በሆነው ያለፈ ጊዜ ተተርጉሟል።
- source_word: Νῦν
  choice: አሁን
  rationale: የንግግሩንና የጊዜውን አጽንዖት በቀጥታ ይጠብቃል።
- source_word: ἐδοξάσθη
  choice: ከብሯል
  rationale: የግሪኩን የመክበር ሐሳብና አሁን የተጀመረ እውነታ በተፈጥሯዊ አማርኛ ያሳያል፤ ቃሉ ክስተቱን በመስቀሉ ወይም በትንሣኤው ብቻ አይገድብም።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የታወቀ ራስ-መጠሪያና ከዳንኤል 7 ጋር ያለውን ጽሑፋዊ ግንኙነት ይጠብቃል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: θεόςን በዚህ አውድ ለመግለጽ በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር የተለመደና ግልጽ ስያሜ ነው።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: ἐν ያለውን ግንኙነታዊ ወይም ሥፍራዊ አቅጣጫ በቅርብ ይጠብቃል፤ መሣሪያዊው «በእርሱ አማካይነት» የሚለው አማራጭ በማስታወሻ ተቀምጧል።
theological_decisions:
- issue: የኢየሱስ መክበር የሚያመለክተው ክስተት
  choice: ቃሉን ለመስቀል፣ ለትንሣኤ ወይም ወደ አብ ለመመለስ ብቻ ሳይገድብ «ከብሯል» ተብሎ ተተርጉሟል።
