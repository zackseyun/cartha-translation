  rationale: በዮሐንስ ወንጌል መክበሩ ሞቱን፣ ትንሣኤውንና ወደ አብ መመለሱን በአንድነት ሊያቅፍ ይችላል፤ ትርጉሙ ይህን ስፋት አልዘጋም።
- issue: የἐν αὐτῷ ኃይል
  choice: በእርሱ
  alternative: በእርሱ አማካይነት
  rationale: የግሪኩ ሐረግ እግዚአብሔር በወልድ መክበሩን ወይም በወልድ አማካይነት መክበሩን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ቀጥተኛውን አቀራረብ ይዞ አማራጩን በማስታወሻ ጠብቋል።
