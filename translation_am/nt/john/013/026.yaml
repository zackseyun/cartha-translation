- source_word: βάψω
  choice: ነክሼ
  rationale: የዳቦውን ቁራሽ በወጥ ወይም በሳህኑ ውስጥ መንከርን ያመለክታል፤ የሥርዓታዊ መታጠብ ትርጉም አያስገባም። የወደፊት ጊዜው ከ“የምሰጠው” ጋር በሚገኘው የድርጊት ቅደም ተከተል ተገልጧል።
- source_word: ψωμίον
  choice: ቁራሹን
