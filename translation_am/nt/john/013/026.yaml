- source_word: βάψας οὖν
  choice: ስለዚህ ቁራሹን ነክሶ
  rationale: οὖν የሚያሳየውን ውጤታዊ ትስስርና ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ይጠብቃል።
- source_word: δίδωσιν
  choice: ሰጠው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ በአላፊ ጊዜ ተሰጥቷል።
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: ለአስቆሮቱ ስምዖን ልጅ ለይሁዳ
  rationale: የግሪኩን የቃላት ግንኙነት በቅርብ ተከትሎ “አስቆሮቱ” ከስምዖን ጋር እንዲያያዝ ያደርጋል፤ ሌላው ሰዋሰዋዊ አረዳድ በማስታወሻ ተጠብቋል።
