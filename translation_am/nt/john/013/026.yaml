  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: am
  text: ኢየሱስም፣ “እኔ የዳቦውን ቁራሽ ነክሼ የምሰጠው ሰው እርሱ ነው” ብሎ መለሰ። ከዚያም የዳቦውን ቁራሽ ነክሶ ለይሁዳ፣ ለስምዖን አስቆሮቱ ልጅ፣ ሰጠው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለስምዖን ልጅ ለይሁዳ አስቆሮቱ።” የግሪኩ አገላለጽ “አስቆሮቱ” የሚለውን ከስምዖን ወይም ከይሁዳ ጋር ለማያያዝ ያስችላል።
    reason: alternative_reading
lexical_decisions:
