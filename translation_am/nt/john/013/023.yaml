base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: am
  text: ከደቀ መዛሙርቱ አንዱ፣ ኢየሱስ የሚወደው፣ በማዕድ ከኢየሱስ አጠገብ ተጋድሞ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «በኢየሱስ እቅፍ ውስጥ»። ይህ አገላለጽ በማዕድ ላይ አንዱ ከሌላው አጠገብ ተጋድሞ የነበረበትን ቦታ ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: በማዕድ … ተጋድሞ ነበር
  rationale: ቃሉ በጥንታዊው የምግብ አቀራረብ ልማድ መሠረት ተጋድሞ መብላትን ያመለክታል፤ «በማዕድ» የሚለው የአውዱን የምግብ ሁኔታ ግልጽ ያደርጋል።
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ አንዱ
  rationale: የግሪኩን ከአንድ ስብስብ አንዱ የሚለውን ክፍላዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: ከኢየሱስ አጠገብ ተጠግቶ
  rationale: በማዕድ ላይ አንዱ ከሌላው በጣም ቅርብ ሆኖ የተጋደመበትን አቀማመጥ ለዘመናዊ አንባቢ ያለ አሳሳች ምስል ያስተላልፋል፤ ቀጥተኛው አገላለጽ በማስታወሻው ተጠብቋል።
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ኢየሱስ ይወደው የነበረው
  rationale: የዘመድ አንቀጹንና የἀγαπάωን መደበኛ ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የተወደደው ደቀ መዝሙር ከኢየሱስ አንጻር የነበረበትን ቦታ መተርጎም
  choice: በዋናው ጽሑፍ «ከኢየሱስ አጠገብ ተጠግቶ» ብሎ የማዕዱን አቀማመጥ በተፈጥሯዊ አገላለጽ ማቅረብ
  alternative: «በኢየሱስ እቅፍ ውስጥ» ወይም «በኢየሱስ ደረት አጠገብ»
  rationale: ሐረጉ በቀዳሚነት በራት ጊዜ የነበረውን የመጋደም አቀማመጥ ይገልጻል፤ ቀጥተኛው «እቅፍ» በዘመናዊ አማርኛ የተሳሳተ አካላዊ ምስል ሊፈጥር ይችላል። ሆኖም የግሪኩ ቃላዊ ምስልና በዮሐንስ ጽሑፍ ያለው አስተጋባ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ማዕድ» የራቱን አውድ በአጭሩ ሲያመለክት፣ «ተጋድሞ» ደግሞ ታሪካዊውን የምግብ አቀማመጥ ይጠብቃል።
