  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፦ “ገላውን የታጠበ[a] ሰው እግሮቹን ከመታጠብ በቀር ሌላ አያስፈልገውም፤ ሙሉ በሙሉ ንጹሕ ነው። እናንተም ንጹሓን ናችሁ፤ ነገር ግን ሁላችሁም ንጹሓን አይደላችሁም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ሁለት የተለያዩ የመታጠብ ግሶች ተጠቅመዋል፤ λούω ሙሉ ገላን መታጠብን፣ νίπτω ደግሞ እንደ እግር ያለን የአካል ክፍል ማጠብን ብዙ ጊዜ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ አለው
  rationale: በግሪክኛ ያለው ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል፤ αὐτῷ ያመለክተውም በ«አለው» ውስጥ ተጠብቋል።
- source_word: Ὁ λελουμένος
  choice: ገላውን የታጠበ ሰው
  rationale: የλoύω ፍጹም አሳታፊ ቅርጽ የተጠናቀቀ መታጠብንና የቀጠለውን ንጽሕና ያመለክታል። «ገላውን» ማከል ሙሉ አካልን የመታጠብ ትርጉሙን ከእግር መታጠብ ይለያል።
- source_word: οὐκ ἔχει χρείαν
  choice: ሌላ አያስፈልገውም
  rationale: የግሪክኛውን «አያስፈልገውም» ፈሊጥ በተፈጥሯዊ አማርኛ ያቀርባል፤ «ሌላ» የሚለው ቃል ቀጥሎ ያለውን ብቸኛ ልዩ ሁኔታ ግልጽ ያደርጋል።
- source_word: εἰ μὴ
  choice: ከ… በቀር
  rationale: ከቀደመው አሉታዊ ንግግር በኋላ ያለውን ብቸኛ ልዩ ሁኔታ በግልጽና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς πόδας νίψασθαι
  choice: እግሩን ከመታጠብ
  rationale: νίπτω እንደ እግር ያለን የአካል ክፍል ማጠብን ያመለክታል። ነጠላው «እግሩን» በአማርኛ ሁለቱንም እግሮች በጥቅል ሊያመለክት ይችላል።
- source_word: καθαρὸς ὅλος
  choice: ሙሉ በሙሉ ንጹሕ
  rationale: ὅλος የንጽሕናውን ሙሉነት ያጠናክራል፤ «ንጹሕ» ደግሞ ሥጋዊና ምሳሌያዊ ፍቺዎቹን ሳይዘጋ የመታጠብን ምስል ይጠብቃል።
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: እናንተም ንጹሓን ናችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር አድራሻውንና καθαρός የሚለውን ተደጋጋሚ ቁልፍ ቃል ይጠብቃል።
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: ነገር ግን ሁላችሁም ንጹሓን አይደላችሁም
  rationale: ከተናጋሪው ፊት ያለው ቡድን ውስጥ ልዩ የሆነ ሰው መኖሩን ግልጽ ያደርጋል፤ «ንጹሓን» በአማርኛ ለግልጽነት ተደግሟል።
theological_decisions:
- issue: ቃል በቃል የመታጠብ ምስልና ምሳሌያዊ/መንፈሳዊ ንጽሕና
  choice: «ገላውን የታጠበ»፣ «እግሩን መታጠብ» እና «ንጹሕ» የሚሉትን ቃላት በዋናው ጽሑፍ ምሳሌያዊ ፍቺያቸውን ሳይተረጉሙ ማቆየት
  alternative: «በመንፈስ ንጹሕ» ብሎ ማብራራት ወይም የሁለቱን የግሪክኛ የመታጠብ ግሶች ልዩነት ማጥፋት
  rationale: አውዱ ቃል በቃል በሚታየው የእግር መታጠብና በሰፊው ምሳሌያዊ ንጽሕና መካከል ያለውን ውጥረት ሆን ብሎ ይጠብቃል። ትርጉሙ ይህን ለአንባቢው ክፍት ያደርገዋል።
- issue: የነጠላ ተሳታፊው ሰዋሰዋዊ ጾታ
  choice: «ገላውን የታጠበ ሰው» በሚል አጠቃላይ ነጠላ አባባል መተርጎም
  alternative: ትርጉሙን ለወንድ ብቻ የሚወስን አገላለጽ
  rationale: የግሪክኛው ቅርጽ በሰዋሰው ተባዕታይ ነጠላ ቢሆንም በአባባሉ ውስጥ አጠቃላይ ነው። የአማርኛው ምርጫ ነጠላነቱን ጠብቆ የማያስፈልግ የጾታ ገደብ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ንጹሕ/ንጹሓን» የሚለው የተለመደ መጽሐፍ ቅዱሳዊ ቃል የመታጠብን ምስል እየጠበቀ ለዘመናዊ አንባቢም ግልጽ ነው።
