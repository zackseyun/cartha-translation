id: JHN.13.34
reference: John 13:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: am
  text: “አዲስ ትእዛዝ እሰጣችኋለሁ፤ እርስ በርሳችሁ ተዋደዱ።[a] እኔ እንደወደድኳችሁ፣ እናንተም እንዲሁ እርስ በርሳችሁ ተዋደዱ።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል ቅርብ፦ “እርስ በርሳችሁ እንድትዋደዱ።”
    reason: የመጀመሪያው ἵνα ንዑስ ሐረግ የትእዛዙን ይዘት ወይም ዓላማ ሊገልጽ ይችላል።
  - marker: b
    text: ይህም፦ “እናንተም እርስ በርሳችሁ እንድትዋደዱ” ተብሎ ሊተረጎም ይችላል።
    reason: ሁለተኛው ἵνα ንዑስ ሐረግ ትእዛዛዊ ኃይል ወይም ዓላማ/ውጤት ሊያሳይ ይችላል።
lexical_decisions:
- source_word: ἐντολὴν
  choice: ትእዛዝ
  rationale: የግሪኩን ቃል ሥነ ምግባራዊና አስገዳጅ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καινὴν
  choice: አዲስ
  rationale: ቃሉ በዚህ ጥቅስ የያዘውን አዲስነት ሳይተረጉም በቀጥታ ያቆያል።
- source_word: δίδωμι ὑμῖν
  choice: እሰጣችኋለሁ
  rationale: የአሁን ጊዜውን ግስና የተቀባዮቹን ሁለተኛ መደብ ብዙ ቁጥር በአንድ ተፈጥሯዊ የአማርኛ ግስ ያሳያል።
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: ተዋደዱ / ወደድኳችሁ
  rationale: የፍቅርን የቃላት ድግግሞሽ ይጠብቃል፤ የመጀመሪያውና የመጨረሻው ንዑስ ሐረግ የትእዛዙ ይዘት ስለሆነ በተፈጥሯዊ የብዙ ቁጥር ትእዛዛዊ ቅርጽ ተሰጥቷል።
- source_word: ἀλλήλους
  choice: እርስ በርሳችሁ
  rationale: የጋራ መዋደድን በግልጽና በተለመደ አማርኛ ያሳያል።
- source_word: καθὼς
  choice: እንደ
  rationale: የኢየሱስ ፍቅር ለደቀ መዛሙርቱ ፍቅር ምሳሌና መለኪያ መሆኑን በአጭሩ ያሳያል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም እንዲሁ
  rationale: በግሪኩ ያለውን ‘እናንተም’ የሚለውን አጽንዖት ይጠብቃል፤ ‘እንዲሁ’ ደግሞ ከቀደመው የንጽጽር ሐረግ ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ ያብራራል።
theological_decisions:
- issue: የትእዛዙ አዲስነት ምንነት
  choice: ‘አዲስ ትእዛዝ’ ተብሎ ያለ ተጨማሪ ማብራሪያ ተተርጉሟል።
  alternative: በጊዜ አዲስ፣ በባሕርይ አዲስ፣ ወይም በኢየሱስ ምሳሌ አዲስ ፍጻሜ ያገኘ ትእዛዝ ብሎ መግለጽ።
  rationale: ጥቅሱ ትእዛዙን ‘አዲስ’ ይለዋል እንጂ የአዲስነቱን ትክክለኛ ዓይነት በዚሁ ስፍራ አይወስንም፤ ስለዚህ ያለው ሥነ መለኮታዊ ውጥረት ተጠብቋል።
- issue: የሁለተኛው ἵνα ንዑስ ሐረግ ኃይል
  choice: ትእዛዛዊ ኃይሉን ለማሳየት ‘ተዋደዱ’ ተብሏል።
  alternative: ‘እናንተም እርስ በርሳችሁ እንድትዋደዱ’ ብሎ ዓላማን ወይም ውጤትን የሚያመለክት ንዑስ ሐረግ አድርጎ መተርጎም።
  rationale: ከ‘ትእዛዝ እሰጣችኋለሁ’ ጋር ያለው አውድ ትእዛዛዊ ኃይል አለው፤ ሆኖም የἵνα ሰዋሰዋዊ ቅርጽ ዓላማን ወይም ውጤትንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እርስ በርሳችሁ’ እና ‘ተዋደዱ’ የሚሉት ቃላት የንግግሩን ክብርና የጋራነት አጽንዖት ይጠብቃሉ።
