    [a] ወይም፣ “ጉርሻውን።” የግሪኩ ψωμίον ትንሽ የምግብ ቁራሽን ያመለክታል፤ እዚህ ላይ በምግብ ጊዜ የተነከረ የእንጀራ ቁራሽ ሊሆን ይችላል።


    [b] ወይም፣ “ፈጥነህ።” የግሪኩ τάχιον የንጽጽር ቅርጽ ስለሆነ “ይበልጥ ፈጥነህ” የሚለውን ፍቺ ይሰጣል።'
