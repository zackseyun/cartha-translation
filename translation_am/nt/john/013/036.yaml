  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: am
  text: ስምዖን ጴጥሮስ፣ “ጌታ ሆይ፣ ወዴት እየሄድክ ነው?” አለው። ኢየሱስም፣ “ወደምሄድበት አሁን ልትከተለኝ አትችልም፤[a] በኋላ ግን ትከተለኛለህ” ብሎ መለሰ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አትችልም” በሚለው ቦታ የግሪኩ ጽሑፍ መቻልን ወይም ችሎታን የሚገልጽ ግስ በግልጽ ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: “በኋላ ግን ትከተለኛለህ” የሚለው ንግግር ጴጥሮስ በኋላ ኢየሱስን በመከራ ወይም በሞት መከተሉን ሊያመለክት ይችላል፤ ቃላቱ ግን ይህ እንዴት እንደሚሆን አይገልጹም።
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አጻጻፍ በአማርኛ ትረካ ተፈጥሯዊ በሆነው ያለፈ ጊዜ ተተርጉሟል፤ የንግግሩ ቀጥተኛነት ግን ተጠብቋል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በቀጥታ ንግግር ውስጥ ክብርንና የማዕረጉን ሃይማኖታዊ ድምፀት የሚጠብቅ ተፈጥሯዊ የአማርኛ አጠራር ነው።
- source_word: ποῦ ὑπάγεις
  choice: ወዴት እየሄድክ ነው?
  rationale: የመሄድን ቀጣይ ሂደት የሚያሳይና መድረሻውን አስቀድሞ የማይተረጉም ዘመናዊ አገላለጽ ነው።
- source_word: ἀπεκρίθη
  choice: ብሎ መለሰ
  rationale: በውይይት ትረካ ውስጥ የተለመደና ግልጽ አማርኛ ነው።
- source_word: Ὅπου ὑπάγω
  choice: ወደምሄድበት
  rationale: ከጴጥሮስ ጥያቄ ጋር ያለውን የግስ ድግግሞሽ ይጠብቃል፤ መድረሻውንም አይወስንም።
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: አሁን ልትከተለኝ አትችልም
  rationale: δύναμαι የሚገልጸውን የችሎታ ወይም የመቻል ሐሳብ ‘አትችልም’ በሚለው ግስ በግልጽ ይጠብቃል፤ νῦνም ‘አሁን’ ተብሎ ተጠብቋል።
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: በኋላ ግን ትከተለኛለህ
  rationale: የወደፊቱን ጊዜ፣ በ‘አሁን’ና ‘በኋላ’ መካከል ያለውን ንጽጽር፣ እና δέ የሚያሳየውን ተቃርኖ ይጠብቃል።
theological_decisions:
- issue: ጴጥሮስ ወደፊት ኢየሱስን መከተሉ ምን እንደሚያመለክት
  choice: ዋናው ጽሑፍ ‘በኋላ ግን ትከተለኛለህ’ ብሎ ብቻ ይተረጉማል።
  alternative: ይህን በጴጥሮስ ሰማዕትነት፣ ከትንሣኤ በኋላ ባለው ደቀ መዝሙርነት፣ ወይም በመጨረሻው ክብር እንደሚፈጸም በግልጽ መወሰን።
  rationale: የግሪኩ ንግግር የመከተሉን መንገድ አይገልጽም፤ ስለዚህ ትርጉሙ ያለውን ትረካዊና ሥነ መለኮታዊ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ የተፈጥሮ ትረካ መሠረት በያለፈ ጊዜ ቀርቧል፤ የ‘መሄድ’ና ‘መከተል’ ቁልፍ ቃላት ግን በወጥነት ተጠብቀዋል።
