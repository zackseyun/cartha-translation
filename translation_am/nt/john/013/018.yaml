  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የመዝሙሩ ምሳሌያዊ አነጋገር ተጠብቆ ትርጉሙ በማስታወሻ ተብራርቷል።
