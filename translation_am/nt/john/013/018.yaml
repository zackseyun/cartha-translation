  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: am
  text: “ስለ ሁላችሁም አልናገርም።[a] የመረጥኳቸውን አውቃለሁ። ነገር ግን መጽሐፍ፣ ‘እንጀራዬን የሚበላ ተረከዙን በእኔ ላይ አነሣ’[c] የሚለው እንዲፈጸም ነው።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በይበልጥ ቃል በቃል፣ “ሁላችሁንም በተመለከተ አልናገርም።”
    reason: lexical_alternative
  - marker: b
    text: ከመዝሙር 41፥9 የተጠቀሰ ወይም የተወሰደ ሐሳብ።
    reason: cross_reference
  - marker: c
    text: ወይም፣ “ተረከዙን በእኔ ላይ አነሣ።” ይህ አነጋገር ጠላትነትንና ክህደትን የሚገልጽ ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: ስለ ሁላችሁም አልናገርም
  rationale: የπερὶን ‘ስለ’ የሚለውን ትርጉምና ክህደቱ በ‘ሁላችሁም’ ላይ ያለውን ወሰን በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: οἶδα በቅርጹ ፍጹም ቢሆንም በኮይኔ ግሪክ የአሁን ጊዜ ትርጉም ስላለው ‘አውቃለሁ’ ተብሏል።
- source_word: τίνας ἐξελεξάμην
  choice: የመረጥኳቸውን
  rationale: የግሱን ግላዊ ተሳቢና የ‘መምረጥ’ መሠረታዊ ፍቺ ይጠብቃል፤ ጥቅሱ ያልገለጸውን የምርጫ ሥነ መለኮታዊ ዓይነት አይወስንም።
- source_word: ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ
  choice: ነገር ግን መጽሐፍ … እንዲፈጸም ነው
  rationale: የተቃርኖ ግንኙነቱንና የዓላማ/ውጤት ሐረጉን ይጠብቃል፤ γραφή በዮሐንስ አጠቃቀም ቅዱስ መጽሐፍን ስለሚያመለክት ‘መጽሐፍ’ ተብሏል።
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: እንጀራዬን የሚበላ
  rationale: የ substantival participle ተግባርን በተፈጥሯዊ አማርኛ ይገልጻል፤ μου ከἄρτον ጋር ተያይዞ ‘እንጀራዬን’ ተብሏል።
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: ተረከዙን አነሣብኝ
  rationale: ከመዝሙሩ የመጣውን የተረከዝ ምሳሌያዊ አነጋገር ሳያጠፋ በአማርኛ አጭርና ተፈጥሯዊ አድርጎ ያቀርባል።
theological_decisions:
- issue: የኢየሱስ ምርጫ ከአሳልፎ ሰጪው ጋር ያለው ግንኙነት
  choice: ἐξελεξάμην በቀጥታ ‘የመረጥኳቸውን’ ተብሎ ተተርጉሟል፤ ይሁዳን በቃላቱ አያካትትም ወይም አያስወጣም።
  alternative: ምርጫው በተለይ የድነት ምርጫ ወይም ለሐዋርያነት ሹመት ብቻ እንደሆነ በትርጉሙ መወሰን።
  rationale: ጥቅሱ የምርጫውን ሥነ መለኮታዊ ምድብ አይገልጽም፤ ስለዚህ ትርጉሙ የጽሑፉን ውጥረት ሳይፈታ ይጠብቃል።
- issue: ἀλλ’ ἵνα ከክህደቱና ከመጽሐፍ ፍጻሜ ጋር ያለው ኃይል
  choice: ‘ነገር ግን መጽሐፍ … እንዲፈጸም ነው’ ተብሎ የፍጻሜው ንግግር ተጠብቋል።
  alternative: ክህደቱ በግድ እንዲከሰት መጽሐፉ እንዳስገደደ የሚገልጽ ተጨማሪ ምክንያታዊ ሐረግ ማስገባት።
  rationale: ግሪኩ የዓላማ/ውጤትና የመጽሐፍ ፍጻሜ ቋንቋ አለው፤ ነገር ግን ትርጉሙ ጽሑፉ ከሚለው በላይ የውሳኔ አስገዳጅነት አይጨምርም።
