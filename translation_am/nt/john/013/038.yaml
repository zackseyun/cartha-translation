review_pass:
  verdict: approve
  source_fidelity: The translation accurately conveys Jesus’ reply, the rhetorical question about laying down one’s life for him, the doubled ἀμὴν, the emphatic οὐ μή, the temporal limit, and Peter’s threefold denial. “ሕይወትህን ... ትሰጣለህን?” appropriately renders the idiomatic sense of τίθημι τὴν ψυχήν.
  naturalness: The phrasing is fluent, clear modern standard Amharic with an appropriately solemn biblical register. “እውነት እውነት እልሃለሁ” and “ዶሮ ከቶ አይጮኽም” are natural and retain the Greek emphasis.
  terminology: Key terms are handled well. “ሕይወት” correctly reflects ψυχή in this self-sacrificial context without forcing an anthropological sense of “soul.” “መካድ” directly represents ἀρνέομαι. The footnote supplies the viable lexical alternative “ነፍስህን” and is correctly anchored.
