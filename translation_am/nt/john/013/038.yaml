id: JHN.13.38
reference: John 13:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “ስለ እኔ ሕይወትህን[a] ትሰጣለህን? እውነት እውነት እልሃለሁ፤ ሦስት ጊዜ እስክትክደኝ ድረስ ዶሮ ከቶ አይጮኽም” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ነፍስህን።” የግሪኩ ψυχή “ነፍስ” ወይም “ሕይወት” ማለት ይችላል፤ እዚህ ግን ሐሳቡ ሕይወትን መስጠት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: መልሶ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ ቢሆንም፣ በአማርኛ ትረካ የተፈጥሮ አገላለጽ የሆነው ያለፈ ጊዜ ተጠቅሟል።
- source_word: ψυχήν
  choice: ሕይወትህን
  rationale: τίθημι τὴν ψυχήν በሚለው አገባብ ለሞት ራስን መስጠትን ያመለክታል፤ ‘ሕይወት’ ይህን ተጨባጭ ትርጉም ያስተላልፋል።
- source_word: ὑπὲρ ἐμοῦ
  choice: ስለ እኔ
  rationale: እዚህ ὑπέρ ለአንድ ሰው ሲባል ወይም በእርሱ ፈንታ መሆንን ያመለክታል፤ ‘ስለ እኔ’ ተፈጥሯዊና አጭር ነው።
- source_word: θήσεις
  choice: ትሰጣለህን
  rationale: ከ‘ሕይወት’ ጋር ‘መስጠት’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የመሥዋዕትነት ሐሳቡን ይጠብቃል።
- source_word: ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: በዮሐንስ ወንጌል የኢየሱስን አጽንዖታዊ የማረጋገጫ ቃል ድግግሞሹን ሳያጠፋ በግልጽ አማርኛ ያቀርባል።
- source_word: οὐ μὴ
  choice: ከቶ አይጮኽም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ ‘ከቶ’ በግልጽ ያሳያል።
- source_word: ἀλέκτωρ φωνήσῃ
  choice: ዶሮ ... አይጮኽም
  rationale: የዶሮን ጩኸት በዘመናዊ አማርኛ የሚገልጽ ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἕως οὗ
  choice: እስክት... ድረስ
  rationale: አሉታዊው ድርጊት እስከሚቆይበት ጊዜያዊ ወሰን በቀጥታ ይገልጻል።
- source_word: ἀρνήσῃ με
  choice: እስክትክደኝ
  rationale: ἀρνέομαι የሚገልጸውን ኢየሱስን መካድ ወይም ከእርሱ ጋር ያለውን ዝምድና አለመቀበል በቀጥታ ያስተላልፋል።
- source_word: τρίς
  choice: ሦስት ጊዜ
  rationale: ቁጥሩን በግልጽና በተለመደ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በደቀ መዝሙርነትና ራስን በመሥዋዕት መስጠት አውድ ውስጥ ψυχή የሚለውን መተርጎም
  choice: ሕይወት
  alternative: ነፍስ
  rationale: አውዱ ጴጥሮስ ለኢየሱስ ሲል ለመሞት ዝግጁ ነኝ ስላለው ነው። ‘ሕይወት’ የመሞትን ተጨባጭ ሐሳብ ይጠብቃል፤ አውዱ የማይጠይቀውን ጠባብ የሰው ተፈጥሮ ትምህርት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት በ‘እውነት እውነት’ እና ‘ከቶ’ ተጠብቋል።
