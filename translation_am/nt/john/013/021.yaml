- source_word: παραδώσει με
  choice: ይከዳኛል
  rationale: በቅርብ አውዱ ውስጥ ደቀ መዝሙሩ ኢየሱስን በተንኮል አሳልፎ የሚሰጥበትን ድርጊት በግልጽ አማርኛ ይገልጣል፤ የቃሉ ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
