  rationale: የግሪክኛውን ያለፈ ጊዜ አሳታፊ ሐረግ እንደ ጊዜ አመልካች ንዑስ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል፤ የድርጊቶቹንም ቅደም ተከተል ይጠብቃል።
- source_word: ἐταράχθη τῷ πνεύματι
  choice: በመንፈሱ ታወከ
  rationale: የኢየሱስን ውስጣዊ መናወጥና ጭንቀት ያለ ተጨማሪ የጥንካሬ ቃል ይገልጣል፤ የባለቤትነት ቅጥያውም τῷ πνεύματι በዚህ አውድ የኢየሱስን መንፈስ እንደሚያመለክት በተፈጥሯዊ አማርኛ ያሳያል።
