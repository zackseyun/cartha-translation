- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪክኛውን ቀጥተኛ አነጋገርና ለብዙ ሰዎች የተነገረ መሆኑን በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
