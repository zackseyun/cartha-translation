review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the temporal participle, Jesus’ inner disturbance, the emphatic double ἀμήν, the partitive ‘one of you,’ and the contextual sense ‘betray.’ The footnote appropriately preserves the more literal sense of παραδώσει. However, ἐμαρτύρησεν καὶ εἶπεν contains two coordinated finite verbs; ‘መስክሮም ... አለ’ recasts the first as a prior participial action. This is a slight loss of the source’s coordinated solemn assertion.
  naturalness: The Amharic is modern, clear, and appropriately reverent. ‘መሰከረና እንዲህ አለ’ is more natural and syntactically transparent here than ‘መስክሮም እንዲህ አለ.’
  terminology: ‘በመንፈሱ ታወከ’ suitably conveys inner agitation without unwarranted intensification. ‘መሰከረ’ preserves Johannine witness terminology. ‘ይከዳኛል’ is contextually fitting, while the footnote retains ‘አሳልፎ ይሰጠኛል.’
  issues:
  - severity: low
    issue: The coordinated verbs ἐμαρτύρησεν καὶ εἶπεν are rendered with a participle plus a finite verb.
    rationale: ‘መስክሮም እንዲህ አለ’ can imply that he first testified and then spoke, whereas the Greek presents ‘he testified and said’ as coordinated actions introducing the quotation. Rendering both as finite verbs preserves the structure and sense.
  revised_text: ኢየሱስ ይህን ከተናገረ በኋላ በመንፈሱ ታወከ፤ መሰከረና እንዲህ አለ፦ “እውነት እውነት እላችኋለሁ፤ ከእናንተ አንዱ ይከዳኛል[a]።”
