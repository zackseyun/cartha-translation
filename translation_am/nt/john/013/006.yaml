  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: am
  text: እንግዲህ ወደ ስምዖን ጴጥሮስ ይመጣል። ጴጥሮስም፣ “ጌታ ሆይ[a]፣ አንተ እግሮቼን ታጥባለህ?” ይለዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌታ ሆይ” የሚለው “ክቡር ሆይ” ተብሎም ሊተረጎም ይችላል። የግሪኩ κύριε የአክብሮት መጠሪያ ሆኖ ሊያገለግል ይችላል፤ እዚህ ግን “ጌታ ሆይ” የሚለው ዋና ትርጉም ሆኖ ተይዟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: ይመጣል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽና ወደ ጴጥሮስ የሚደረገውን እንቅስቃሴ ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በቀደመው ትረካ ምክንያት የሚከተለውን የትረካ እርምጃ የሚያገናኘውን ኃይል ይገልጣል።
- source_word: πρὸς Σίμωνα Πέτρον
  choice: ወደ ስምዖን ጴጥሮስ
  rationale: πρός ከተሳቢ ጋር ወደ አንድ ሰው መቅረብን ወይም መንቀሳቀስን ያመለክታል።
- source_word: λέγει αὐτῷ
  choice: ጴጥሮስም … አለው
  rationale: በአማርኛ ተናጋሪውን በስም ማብራራት ተፈጥሯዊ ሲሆን፣ የግሪኩን αὐτῷ የሚያንጸባርቀው ‘አለው’ ነው። የንግግር ግስ በአማርኛ ተፈጥሯዊ ትረካ ባለፈ ጊዜ ተቀርጿል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ክብር ያለውን አድራሻና በዮሐንስ ወንጌል ያለውን ክርስቶሳዊ ጥልቀት ሳያጠፋ የκύριεን መደበኛ ትርጉም ይጠብቃል።
- source_word: σύ
  choice: አንተ
  rationale: በግሪክ በግልጽ የተጠቀሰው ተውላጠ ስም አጽንዖት አለው፤ ‘አንተ’ ይህን የጴጥሮስን መደነቅ ያስተላልፋል።
- source_word: μου … τοὺς πόδας
  choice: እግሬን
  rationale: በአማርኛ ‘እግሬን’ የሚለው ነጠላ የሰውነት ክፍል አገላለጽ ሁለቱንም እግሮች በተፈጥሮ ሊያመለክት ይችላል፣ የμουንም ባለቤትነት ያካትታል።
- source_word: νίπτεις
  choice: ታጥበኛለህ
  rationale: νίπτω መላ ሰውነትን ከመታጠብ ይልቅ እንደ እግር ያለን የሰውነት ክፍል ማጠብን ያመለክታል፤ የአማርኛው አገላለጽ በዚህ ጊዜ እየተደረገ ያለውን ድርጊትና የጥያቄውን መደነቅ ያስተላልፋል።
theological_decisions:
- issue: ጴጥሮስ ለኢየሱስ የተጠቀመው κύριε እንዴት እንደሚተረጎም
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ሆይ
  rationale: ‘ጌታ ሆይ’ የአክብሮት አድራሻውን ያስተላልፋል፣ በዮሐንስ ወንጌል ሊኖረው የሚችለውን ክርስቶሳዊ ፍቺም ክፍት ያደርገዋል። ‘ክቡር ሆይ’ የአክብሮት ብቻ ፍቺውን ይገልጣል፤ ‘ጌታዬ’ ደግሞ በአማርኛ የμου ያልሆነን ባለቤትነት ሊያክል ይችላል።
