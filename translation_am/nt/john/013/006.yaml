  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በ‘ይመጣል’ ተጠብቋል፤ ‘አለው’ ግን በአማርኛ ትረካ ተፈጥሯዊነት ምክንያት ባለፈ ጊዜ ቀርቧል። የግሪኩ ጥያቄ መደነቅንና እምቢተኝነትን የሚፈቅድ ሆኖ ተጠብቋል።
