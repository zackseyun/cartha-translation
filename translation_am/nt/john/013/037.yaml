  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: am
  text: 'ጴጥሮስም እንዲህ አለው፦ “ጌታ ሆይ፣ አሁን ልከተልህ የማልችለው ለምንድን ነው?[a] ሕይወቴን[b] ስለ አንተ አሳልፌ እሰጣለሁ።”


    [a] ወይም ይበልጥ ቃል በቃል፣ “አሁኑኑ ልከተልህ የማልችለው ለምንድን ነው?”

    [b] በግሪክኛ “ነፍሴን”፤ በዚህ አገላለጽ ግን ትርጉሙ “ሕይወቴን” ማለት ነው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “አሁኑኑ ልከተልህ የማልችለው ለምንድን ነው?”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ “ነፍሴን”፤ በዚህ አገላለጽ ግን ትርጉሙ “ሕይወቴን” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: እንዲህ አለው
  rationale: የግሪክኛው ታሪካዊ የአሁን ጊዜ አገላለጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነው ያለፈ ጊዜ ተተርጉሟል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛ ጥሪውን፣ አክብሮቱንና ሊኖረው የሚችለውን ሥነ መለኮታዊ ክብደት ሳይገድብ ይጠብቃል።
- source_word: διὰ τί οὐ δύναμαί
  choice: የማልችለው ለምንድን ነው?
  rationale: የጥያቄውን ምክንያታዊ አወቃቀርና δύναμαι የሚገልጸውን መቻል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σοι ἀκολουθῆσαι
  choice: ልከተልህ
  rationale: “መከተል” አብሮ መሄድንም የደቀ መዝሙርነትንም ፍንጭ ስለሚይዝ የዮሐንስን ድርብ ትርጉም ይጠብቃል።
- source_word: ἄρτι
  choice: አሁን
  rationale: የጊዜውን አፋጣኝነት በቀላልና ተፈጥሯዊ አገላለጽ ያሳያል፤ “አሁኑኑ” የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: τὴν ψυχήν μου
  choice: ሕይወቴን
  rationale: ከτίθημι ጋር በዚህ አገላለጽ ψυχή ለሌላው ለመሞት የሚሰጥን ሕይወት ያመለክታል፤ “ነፍሴን” የሚለው ቃል ግን በአማርኛ ያልታሰበ ሜታፊዚካዊ ትርጉም ሊያስገባ ይችላል።
- source_word: ὑπὲρ σοῦ
  choice: ስለ አንተ
  rationale: ጴጥሮስ ለኢየሱስ ሲል ሕይወቱን እንደሚሰጥ ያሳያል፤ የὑπέρን ትክክለኛ ዝርዝር ግንኙነት ከሚገባው በላይ አይወስንም።
- source_word: θήσω
  choice: አሳልፌ እሰጣለሁ
  rationale: ቃል በቃል “አኖራለሁ” ከማለት ይልቅ ከψυχή ጋር ያለውን ለሞት ሕይወትን የመስጠት ፈሊጣዊ ትርጉም በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: በጴጥሮስ ንግግር ውስጥ የψυχή ትርጉም
  choice: ሕይወቴን
  alternative: ነፍሴን
  rationale: ዐውዱና τίθημι τὴν ψυχήν የሚለው ፈሊጥ ስለ ኢየሱስ ለመሞት ፈቃደኛ መሆንን ያመለክታሉ፤ “ሕይወት” ይህን ያልተጨመረ ሜታፊዚካዊ ፍቺ ሳያስገባ ያስተላልፋል።
- issue: የἀκολουθέω ድርብ ጥላ
  choice: ልከተልህ
  alternative: ከአንተ ጋር ልሂድ / ላጅብህ
  rationale: “መከተል” ወደሚሄድበት ቦታ አብሮ መሄድንና የደቀ መዝሙርነትን ጥሪ በአንድነት ይይዛል፤ የጽሑፉን ሥነ መለኮታዊ ውጥረት አያስወግድም።
- issue: የὑπὲρ σοῦ ግንኙነት
  choice: ስለ አንተ
  alternative: በአንተ ፈንታ / ለአንተ
  rationale: ግሪክኛው ለአንድ ሰው ሲባል፣ ለእርሱ ጥቅም ወይም ምክንያት የሚደረግን ተግባር ሊገልጽ ይችላል። “በአንተ ፈንታ” ብሎ መተርጎም በዚህ ስፍራ ግሪክኛው በግድ ያልወሰነውን ምትክነት ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛ ንግግሩ “ጌታ ሆይ” የሚለውን የአክብሮት ጥሪ ይጠብቃል፤ “ልከተልህ” እና “ስለ አንተ” የሚሉት አገላለጾች የምንጩን ሆን ተብሎ ያልተወሰነ ስፋት ይጠብቃሉ።
