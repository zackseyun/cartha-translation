id: JHN.13.35
reference: John 13:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: am
  text: በዚህ[a] ሁሉም የእኔ ደቀ መዛሙርት መሆናችሁን ያውቃሉ፤ እርስ በርሳችሁ ፍቅር ካላችሁ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ውስጥ” ወይም “በዚህ አማካይነት።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በእርስ በርሳችሁ መካከል ፍቅር ካላችሁ፤” ማለትም፣ እርስ በርስ ፍቅር ካሳያችሁ።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: በዚህ
  rationale: 'The phrase most naturally has an instrumental/evidential force here: this is the identifying sign by which others will know.'
- source_word: γνώσονται
  choice: ያውቃሉ
  rationale: This preserves the broad sense of coming to know or recognizing a fact without narrowing it unnecessarily.
- source_word: πάντες
  choice: ሁሉም
  rationale: The Greek is generic and universal; the Amharic form naturally includes everyone without a male-only implication.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: የእኔ ደቀ መዛሙርት እንደሆናችሁ
  rationale: This is the natural Amharic possessive construction and preserves the established Gospel term for disciples.
- source_word: ἐὰν
  choice: ካላችሁ
  rationale: The conditional construction directly preserves the Greek condition while fitting idiomatic modern Amharic.
- source_word: ἀγάπην
  choice: ፍቅር
  rationale: This is the standard, current Amharic equivalent for love and maintains the lexical connection with the surrounding passage.
- source_word: ἔχητε ἐν ἀλλήλοις
  choice: እርስ በርሳችሁ ፍቅር ካላችሁ
  rationale: This idiom clearly expresses possessing love mutually toward one another rather than a merely internal feeling.
theological_decisions:
- issue: The force of the condition introduced by ἐὰν
  choice: እርስ በርሳችሁ ፍቅር ካላችሁ
  alternative: እርስ በርሳችሁ ፍቅር ሲኖራችሁ
  rationale: The chosen form preserves the explicit conditional force. It presents mutual love as the public identifying evidence of discipleship without suggesting that love earns discipleship.
- issue: The scope of πάντες
  choice: ሁሉም
  alternative: ሰዎች ሁሉ
  rationale: Both are inclusive, but ሁሉም is concise and directly reflects the universal subject without importing a male-specific sense.
translation_notes:
  register: Modern standard Amharic in Ge'ez script, with dignified but ordinary vocabulary. The clause order broadly follows the Greek, while ይኸውም ... ነው makes the identifying condition clear and readable in Amharic.
