  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: am
  text: ምክንያቱም ተቀጣሪ ነው፤ ስለ በጎቹም ግድ የለውም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በቀደመው ሐረግ የተገለጸውን የተቀጣሪውን መሸሽ ምክንያት ያሳያል፤ በዘመናዊ አማርኛም ግልጽና ተፈጥሯዊ ነው።
- source_word: μισθωτός
  choice: ተቀጣሪ
  rationale: ቃሉ የራሱ ያልሆኑትን በጎች በደመወዝ የሚጠብቅ ሠራተኛን ያመለክታል። «ተቀጣሪ» ዘመናዊ፣ አጭርና የቃሉን ዋና ሐሳብ የሚያስተላልፍ ነው።
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: ስለ … ግድ የለውም
  rationale: ይህ አገላለጽ አለመጨነቅንና አለመቆርቆርን ያሳያል፤ «ግድ የለውም» የግሪኩን ሥነ ምግባራዊ ክብደት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τῶν προβάτων
  choice: በጎቹ
  rationale: ቀጥተኛውን የበግ ምስል ይጠብቃል፤ «መንጋው» ቢቻልም ከግሪኩ ይበልጥ ትርጓሜያዊ ነው።
theological_decisions:
- issue: ተቀጣሪው ከመልካሙ እረኛ ጋር ያለው ንጽጽር
  choice: ተቀጣሪው ለበጎቹ እንደማይቆረቆር ጥቅሱ የሚናገረውን ብቻ በቀጥታ መግለጽ
  alternative: ተቀጣሪውን ከአንድ የተወሰነ የሐሰት መሪዎች ቡድን ጋር መለየት፣ ወይም ንጽጽሩን ወደ ሙያዊ ርቀት ብቻ ማለስለስ
  rationale: ጥቅሱ ተቀጣሪው ለበጎቹ ግድ እንደሌለው ይገልጻል፤ ከዚህ በላይ ማንነቱን አይወስንም። ስለዚህ ትርጉሙ ንጽጽሩን ይጠብቃል እንጂ ያልተገለጸ የአስተምህሮ መለያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ተቀጣሪ» ከጥንታዊው «ምንደኛ» ይልቅ በዛሬው አጠቃቀም ግልጽ ነው።
