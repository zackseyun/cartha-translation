  text: የራሱ የሆኑትን ሁሉ ባወጣ[a] ጊዜ፣ በፊታቸው ይሄዳል፤ በጎቹም ድምፁን ስለሚያውቁ ይከተሉታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ገፍቶ አወጣ» ወይም «ወደ ውጭ መርቶ አወጣ»፤ የግሪኩ ግስ ከመከለያ ቦታ ወደ ውጭ የማውጣትን ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ካወጣ በኋላ
  rationale: ὅταν ከአዮርስት ሳብጃንክቲቭ ጋር ያልተወሰነ ጊዜያዊ ሁኔታን ያመለክታል፤ በዚህ ዐውድ ‘ካወጣ በኋላ’ የተግባሩን መጠናቀቅና ቀጣዩን እርምጃ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ ἴδια πάντα
  choice: የራሱ የሆኑትን ሁሉ
  rationale: የግሪኩን ‘የራሱ የሆኑት’ የሚለውን አገላለጽ ይጠብቃል፤ ‘በጎች’ የሚለውንም በግልጽ ከሚመጣበት የቀጣዩ ሐረግ በፊት አይጨምርም።
- source_word: ἐκβάλῃ
  choice: ካወጣ
  rationale: ግሱ ማስወጣትን፣ ገፍቶ ማውጣትን ወይም ወደ ውጭ መምራትን ሊያመለክት ይችላል። በእረኛና በጎቹ ዐውድ ‘አወጣ’ ወደ ውጭ የመንቀሳቀሱን ፍቺ ያለ አላስፈላጊ የኃይል ጥቆማ ያስተላልፋል።
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: በፊታቸው ይሄዳል
  rationale: እረኛው ከበጎቹ ቀድሞ እየሄደ እንደሚመራቸው የሚያሳየውን የቦታና የእንቅስቃሴ ምስል በቀጥታ ይጠብቃል።
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: በጎቹም … ይከተሉታል
  rationale: πρόβαταን ‘በጎቹ’፣ ἀκολουθεῖንም በተፈጥሯዊ አማርኛ ‘ይከተሉታል’ ብሎ ይተረጉማል።
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: ድምፁን ስለሚያውቁ
  rationale: ὅτι የመከተላቸውን ምክንያት ያቀርባል፤ οἴδασιν ያለውን የማወቅ ፍቺ ‘ያውቁ’ ይጠብቃል፣ በዐውዱም የድምፅ መለየትን ያካትታል።
theological_decisions:
- issue: የእረኝነት ምስልና የἐκβάλῃ ኃይል
