  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ἐκβάλῃ አማራጭ ጥንካሬ በዋናው ጽሑፍ ‘አወጣ’ በሚለው ሰፊ አገላለጽ ስለተጠበቀ የግድ የግርጌ ማስታወሻ አልተጨመረም።
