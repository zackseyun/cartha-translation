base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: am
  text: ኢየሱስም እንዲህ ሲል መለሰላቸው፦ “ከአብ[b] የመጡ ብዙ መልካም ሥራዎችን አሳየኋችሁ፤ ከእነዚህ ውስጥ በየትኛው ሥራ ምክንያት[a] በድንጋይ ትወግሩኛላችሁ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነዚህ ሥራዎች በየትኛው ምክንያት በድንጋይ ትወግሩኛላችሁ?”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ ትርጉሞች “ከአባቴ” ይላሉ፤ እዚህ ያለው የግሪክ ጽሑፍ ግን “ከአብ” ብቻ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰላቸው
  rationale: በትረካ ውስጥ ለሚቀርብ ምላሽ ተፈጥሯዊና የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: Πολλὰ ἔργα καλὰ
  choice: ብዙ መልካም ሥራዎችን
  rationale: ‘ሥራዎች’ በዮሐንስ ወንጌል የኢየሱስን ድርጊቶችና ምልክቶች የሚያመለክተውን ሥነ መለኮታዊ ጭብጥ ይጠብቃል፤ ‘መልካም’ ደግሞ καλὰ የሚያመለክተውን ጠቃሚና የተመሰገነ ባሕርይ ያስተላልፋል።
- source_word: ἔδειξα
  choice: አሳየኋችሁ
  rationale: ድርጊቶቹን በፊታቸው እንዲታዩና እንዲታወቁ ማድረጉን በቀጥታ ይገልጣል።
- source_word: ἐκ τοῦ πατρός
  choice: ከአብ የሆኑ
  rationale: ἐκ የሚያመለክተውን ምንጭ ይጠብቃል፤ በግሪኩ የባለቤትነት ተውላጠ ስም ስለሌለ ‘ከአባቴ’ ተብሎ አልተስፋፋም።
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: ከእነርሱ መካከል በየትኛው ሥራ ምክንያት
  rationale: διά ከተሳቢ ጋር የሚገልጠውን ምክንያት በግልጽ አማርኛ ያሳያል፤ αὐτῶν ወደተጠቀሱት ብዙ ሥራዎች መመለሱንም ይጠብቃል።
- source_word: λιθάζετε
  choice: በድንጋይ ትወግሩኛላችሁ
  rationale: ግሱን በአሁን ጊዜ በቀጥታ ያቀርባል፤ በግሪኩ በግልጽ ያልተባለውን ‘ልትወግሩኝ ትሞክራላችሁ’ የሚል ትርጓሜ አይጨምርም።
theological_decisions:
- issue: ኢየሱስ በተናገረው ውስጥ ያለው ‘አብ’ የሚለው አጠራር
  choice: ‘ከአብ’ ብሎ ማቆየት
  alternative: ‘ከአባቴ’
  rationale: የግሪኩ ጽሑፍ μου (‘የእኔ/አባቴ’) የሚል ቃል አልያዘም። ስለዚህ የኢየሱስን ከአብ ጋር ያለውን ግንኙነት ከጽሑፉ በላይ ሳያጠናክር የምንጭ ጽሑፉን አገላለጽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እንዲህ ሲል’ የቀጥታ ንግግሩን በተፈጥሯዊ ሁኔታ ያስገባል፤ የድንጋይ ውግራቱም እንደ ዓላማ ብቻ ሳይተረጎም በግሱ ያለው የአሁን ጊዜ ኃይል ተጠብቋል።
