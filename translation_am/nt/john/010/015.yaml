  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: am
  text: አብ እኔን እንደሚያውቀኝ፣ እኔም አብን አውቃለሁ፤ ሕይወቴንም[a] ለበጎቹ[b] አኖራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍሴን።” በዚህ ራስን በመሥዋዕት የመስጠት አውድ ትርጉሙ “ሕይወቴን” ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ስለ በጎቹ።” የግሪኩ ቅድመ ቃል ለእነርሱ ጥቅም ወይም እነርሱን ወክሎ የሚደረግን መሥዋዕታዊ ድርጊት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: እንደሚያውቀኝ
  rationale: ከቀደመው ንግግር ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል፤ καθὼς የሚያመለክተው ‘እንደ’ የሚለውን ጠንካራ ንጽጽር ነው።
- source_word: γινώσκει / γινώσκω
  choice: ያውቀኛል / አውቃለሁ
  rationale: የግሱን የእውቀትና የግንኙነት ስፋት ሳያጠብ የግሪኩን ተያያዥ አጠቃቀም ይጠብቃል።
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: አብ
  rationale: የዮሐንስን ልዩ አጠቃቀምና በሁለቱ ሐረጎች ያለውን ትይዩነት በተከበረና በተለመደ የአማርኛ መጽሐፍ ቅዱስ ቃል ይጠብቃል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: καί + ἐγώ ያለውን ቅንጅትና በአብ እና በወልድ መተዋወቅ መካከል ያለውን ሚዛናዊ አወቃቀር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ψυχήν μου
  choice: ሕይወቴን
  rationale: በራስን መስጠትና በሞት አውድ ψυχή የሚያመለክተው ሕይወትን ነው፤ ‘ነፍሴን’ ብሎ መተርጎም በዚህ አውድ የማይፈለግ ሥነ ሰብእ ግንዛቤ ሊያስከትል ይችላል።
- source_word: τίθημι
  choice: አሳልፌ እሰጣለሁ
  rationale: τίθημι τὴν ψυχήν የሚለውን ፈሊጣዊ አገላለጽ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል፤ ድርጊቱ ፈቃደኛ ራስን መስጠት መሆኑንም ያሳያል።
- source_word: ὑπὲρ
  choice: ለ
  rationale: ጥቅምን፣ ወክሎ መሆንንና መሥዋዕታዊ ኃይልን ሳይገድብ በአማርኛ በአጭሩና በተፈጥሯዊነት ያስተላልፋል።
- source_word: τῶν προβάτων
  choice: በጎቹ
  rationale: በምዕራፉ ውስጥ ያለውን የእረኛና የበጎች ምሳሌ በቀጥታ ይጠብቃል፤ ‘መንጋው’ ቢባል የግሪኩ ስም ይለወጣል።
theological_decisions:
- issue: በኢየሱስ ራስን መስጠት ውስጥ የὑπὲρ ኃይል
  choice: ‘ለበጎቹ’ ተብሎ ተተርጉሟል፤ ይህም ጥቅምንና መሥዋዕታዊ ውክልናን ሳይጠብ ይጠብቃል።
  alternative: ‘በበጎቹ ፈንታ’ ወይም ‘ስለ በጎቹ’
  rationale: ግሪኩ ድርጊቱ ለበጎቹ ጥቅም የሚደረግና መሥዋዕታዊ መሆኑን ያሳያል፤ ‘ለ’ ጽሑፉ ከሚናገረው በላይ አንድ የተወሰነ የትምህርት ቀመር ሳያስገባ ይህን ስፋት ይጠብቃል።
- issue: በዚህ አውድ የψυχή ትርጉም
  choice: ‘ሕይወቴን’ ተብሎ ተተርጉሟል።
  alternative: ‘ነፍሴን’
  rationale: መልካሙ እረኛ ስለ በጎቹ ሞትን በፈቃዱ መቀበሉ ባለበት አውድ ψυχή መላ ሕይወቱን ያመለክታል፤ ትርጉሙም ሰውን ከፍሎ የሚያሳይ አላስፈላጊ ግንዛቤን ያስወግዳል።
