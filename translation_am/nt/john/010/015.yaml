  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አብ’ የዮሐንስን የአባትነት ቃል አጠቃቀም በታወቀ ቅዱሳዊ ክብር ያቀርባል፤ ‘አሳልፌ እሰጣለሁ’ ደግሞ የግሪኩን ፈሊጥ በተፈጥሯዊ አማርኛ ያስተላልፋል።
