  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: am
  text: ስለዚህ አብ ይወደኛል፤ ሕይወቴን[a] አሳልፌ እሰጣለሁና፣ እንደገና እንድወስዳት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍሴን።” እዚህ ψυχή በተፈጥሮ የሚያመለክተው ኢየሱስ በሞት አሳልፎ የሚሰጠውንና እንደገና የሚወስደውን ሕይወት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የቀደመውን ንግግር ከሚከተለው ምክንያት ጋር በተፈጥሯዊ ዘመናዊ አማርኛ ያገናኛል።
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: አብ ይወደኛል
  rationale: በግሪክ ያለውን ‘አብ’ የሚለውን ግልጽ ባለቤትና ‘እኔን’ የሚለውን ተሳቢ ያስጠብቃል፤ ‘አባቴ’ የሚል ባለቤትነት አይጨምርም።
- source_word: ὅτι
  choice: –ና
  rationale: በ‘እሰጣለሁና’ ውስጥ ያለው ምክንያታዊ ቅጥያ የአብ ፍቅር ምክንያትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τίθημι τὴν ψυχήν μου
  choice: ሕይወቴን አሳልፌ እሰጣለሁ
  rationale: በዚህ አውድ τίθημι ከψυχή ጋር ሆኖ ራስን በፈቃድ ለሞት መስጠትን ያመለክታል፤ ይህ አገላለጽ የድርጊቱን ፈቃደኝነትና ሙሉነት ያስጠብቃል።
- source_word: ἵνα πάλιν λάβω αὐτήν
  choice: እንደገና እንድወስዳት
  rationale: ἵνα የሚያሳየውን የዓላማ ኃይል በ‘እንድ–’ ያስጠብቃል፤ πάλινን ‘እንደገና’ ብሎ ይገልጻል፤ λάβωንም ከሕይወት መልሶ መውሰድ አውድ ጋር ተስማሚ አድርጎ ያቀርባል።
theological_decisions:
- issue: በክርስቶስ ራስን መሥዋዕት አውድ ውስጥ የψυχή ትርጉም
  choice: ሕይወቴን
  alternative: ነፍሴን
  rationale: አውዱ ኢየሱስ በፈቃዱ መሞቱንና ሕይወቱን እንደገና መውሰዱን ይናገራል። ‘ነፍሴን’ ማለት ጥቅሱ ያላተኮረበትን የሰው አካልና ነፍስ ክፍፍል ሊያስገባ ይችላል።
- issue: ἵνα ከλάβω ጋር ያለው የዓላማ ወይም የውጤት ግንኙነት
  choice: እንድወስዳት
  alternative: እወስዳታለሁ
  rationale: የአማርኛው ‘እንድ–’ ቅርጽ የግሪኩን የዓላማ አቅጣጫ ሳያጠፋ ያቀርባል፤ ንግግሩን በቀላሉ ወደ ባዶ የወደፊት ጊዜ አይለውጠውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛን ይጠቀማል። ‘አብ’ የዮሐንስን አገላለጽ የሚያስጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ሲሆን፣ ‘አሳልፌ እሰጣለሁ’ ደግሞ የፈቃደኝነትን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል።
