  source_fidelity: The draft accurately represents the causal connection, the Father's love for Jesus, ψυχή as “life,” and the purpose of taking that life again. However, the ordering of the purpose clause before “I lay down/give” is less clear in Amharic than the Greek sequence and can momentarily obscure what “it” refers to.
