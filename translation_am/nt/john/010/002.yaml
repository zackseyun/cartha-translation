lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: በበሩ የሚገባው ግን
  rationale: ὁ ከአሁን ጊዜ አሳታፊ ግስ ጋር ሆኖ ሰውን የሚያመለክት ስማዊ አገልግሎት አለው፤ «የሚገባው» ይህን አጠቃላይ ባህርይ በተፈጥሯዊ አማርኛ ያስተላልፋል። δέ ከቀደመው ሌባና ወንበዴ ጋር ያለውን ንጽጽር ለማሳየት «ግን» ተብሏል።
