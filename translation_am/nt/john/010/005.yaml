  rationale: በእረኛና በበጎች ዘይቤ ውስጥ ይህ ቃል የበጎቹ ያልሆነውንና የማያውቁትን ሰው ያመለክታል፤ «እንግዳ» የዘር ወይም የአገር ልዩነትን ሳያጎላ ይህን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
