  language: am
  text: እኔ በሩ[a] ነኝ። ማንም በእኔ በኩል ቢገባ ይድናል፤ ይገባልም ይወጣልም፣ የግጦሽ ስፍራም ያገኛል።
  philosophy: optimal-equivalence
  footnotes:
