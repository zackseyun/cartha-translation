lexical_decisions:
- source_word: θύρα
  choice: ደጅ
  rationale: θύρα በመሠረታዊነት መግቢያን ወይም በርን ያመለክታል። «ደጅ» የመግቢያነቱን ምሳሌ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በበግ እረኝነት አውድ «በር» ሊባል ስለሚችል እንደ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: δι’ ἐμοῦ
  choice: በእኔ በኩል
  rationale: διά ከባለቤት አገባብ ጋር መንገድን ወይም አማካይነትን ያሳያል፤ «በእኔ በኩል» ኢየሱስ የመግቢያው መንገድ መሆኑን በግልጽ ያስተላልፋል።
- source_word: ἐάν τις εἰσέλθῃ
  choice: ማንም ... ቢገባ
  rationale: ἐάν ከንዑስ አንቀጽ ጋር አጠቃላይ ሁኔታዊ ንግግር ይፈጥራል፤ «ማንም ... ቢገባ» የτιςን ክፍትና ያልተወሰነ ወሰን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σωθήσεται
  choice: ይድናል
  rationale: σῴζω ማዳንን፣ መታደግን ወይም ነፃ ማውጣትን ሊያመለክት ይችላል። «ይድናል» በዮሐንስ ወንጌል ያለውን ሰፊ የድነት ትርጉም ሳያጠብ የእረኝነት ምስሉንም ይጠብቃል።
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: ይገባል፣ ይወጣልም
  rationale: የመግባትና የመውጣት ተጓዳኝ እንቅስቃሴ በቀጥታ ተጠብቋል፤ የነፃነት ወይም የደኅንነት ትርጓሜ በጽሑፉ ላይ አልተጨመረም።
- source_word: νομὴν
  choice: የግጦሽ ስፍራ
  rationale: νομή ከብቶች ወይም በጎች የሚሰማሩበትን ግጦሽ ያመለክታል። «የግጦሽ ስፍራ» በአማርኛ ግልጽ ሲሆን የበጎችን አውድ ይጠብቃል።
- source_word: εὑρήσει
  choice: ያገኛል
  rationale: εὑρίσκω በቀጥታ «ማግኘት» ማለት ነው፤ ቀላሉና ቀጥተኛው አገላለጽ ተጠብቋል።
theological_decisions:
