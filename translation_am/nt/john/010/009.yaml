- issue: የσωθήσεται የትርጉም ወሰን
  choice: ይድናል
  alternative: ይታደጋል / ነፃ ይወጣል
  rationale: ጽሑፉን ወደ አካላዊ ደኅንነት ብቻ አያጠብም፣ ከተነገረውም በላይ ወደ አንድ የተወሰነ ሥርዓተ እምነታዊ ቀመር አያሰፋውም። «ይድናል» መንፈሳዊ ድነትንና በእረኝነት ምስሉ ያለውን መታደግ አብሮ ክፍት ያደርጋል።
