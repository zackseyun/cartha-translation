    text: ወይም፣ «ደጅ»። የግሪኩ ቃል በርን ወይም ደጅን ሊያመለክት ይችላል፤ «በር» በዋናው ጽሑፍ የመግቢያውን ምስል እና የበጎች በረት አውድን ለመጠበቅ ተመርጧል።
