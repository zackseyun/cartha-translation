  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: am
  text: አብ የቀደሰውን[a] እና ወደ ዓለም የላከውን እኔን፣ ‘የእግዚአብሔር ልጅ ነኝ’ ስላልኩ፣ ‘ትሳደባለህ’ ትላላችሁን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የለየውን» ወይም «የቀደሰውን»።
    reason: ἡγίασεν በዚህ አውድ «መቀደስ» ወይም «መለየት» ማለት ሊሆን ይችላል።
lexical_decisions:
- source_word: ἡγίασεν
  choice: የቀደሰውን
  rationale: «ቀደሰ» የቅድስናን ቃላዊ ግንኙነት ይጠብቃል፤ በዚህ አውድ ለተልእኮ መለየትን ወይም መቀደስን ሊያመለክት ይችላል።
- source_word: ἀπέστειλεν
  choice: የላከውን
  rationale: ቀጥተኛውን የመላክ ትርጉምና በዮሐንስ ወንጌል የሚደጋገመውን የተልእኮ ቋንቋ ይጠብቃል።
- source_word: κόσμον
  choice: ወደ ዓለም
  rationale: በዮሐንስ ውስጥ κόσμος በተለምዶ «ዓለም» ተብሎ ይተረጎማል፤ አውዳዊ ሥነ መለኮታዊ ክብደቱንም ይጠብቃል።
- source_word: Βλασφημεῖς
  choice: እግዚአብሔርን ትሳደባለህ
  rationale: «ትሳደባለህ» ክሱን በተፈጥሯዊ አማርኛ ያቀርባል፤ ተሳዳቢነቱ በዚህ አውድ በእግዚአብሔር ላይ መሆኑ በግልጽ ተገልጧል።
- source_word: Υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: በዘመናዊ አማርኛ የተለመደና ተፈጥሯዊ ሲሆን የሐረጉን ክርስቶሎጂያዊ ክብደት ይጠብቃል።
- source_word: ὃν ὁ πατὴρ
  choice: አብ የቀደሰውን ... እኔን
  rationale: የግሪኩን አንጻራዊ ሐረግ በአማርኛ ተፈጥሯዊ አወቃቀር ያቀርባል፤ «እኔን» የሚለው በግሪኩ ግስ ውስጥ ያለውን ተናጋሪ በግልጽ ያሳያል።
- source_word: ὅτι ... ὅτι
  choice: ‘…’ ትሉኛላችሁን? ... ስላልኩ
  rationale: የመጀመሪያው ὅτι የክሱን ቀጥተኛ ንግግር፣ ሁለተኛውም የክሱን ምክንያት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ἡγίασεν ለወልድ መጠቀሙ
  choice: ቀደሰ
  alternative: ለየ / ለተልእኮ ቀደሰ
  rationale: ዋናው ጽሑፍ የቅድስናውን ቃላዊ ውጥረት ይጠብቃል፤ ይህም ወልድ ቀድሞ ቅዱስ አልነበረም ወይም በሥነ ምግባር ተሻሻለ ማለትን ሳያስገባ፣ ለተልእኮ መቀደስን/መለየትን ሊያካትት ይችላል።
- issue: Υἱὸς τοῦ θεοῦ ያለው ክርስቶሎጂያዊ ክብደት
  choice: የእግዚአብሔር ልጅ
  alternative: የአምላክ ልጅ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር የተለመደውን ማዕረግ በግልጽ ይጠብቃል፤ ከጽሑፉ በላይ የኋለኛ ዘመን ቀመር አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ረጅም ጥያቄ የሐረግ ትስስሩ እንዳይጠፋ ተጠብቋል፤ ምልክቱ [a] በዋናው ጽሑፍ ተካቷል።
