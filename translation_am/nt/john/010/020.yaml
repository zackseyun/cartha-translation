  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: am
  text: ከእነርሱ ብዙዎች ግን፣ “ጋኔን አለበት፤ አብዷልም። ለምን ታዳምጡታላችሁ?” ይሉ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጋኔን ተጠናውቶታል፤ እብድም ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በትዕይንቱ ውስጥ ቀጣይ ወይም ተደጋጋሚ ንግግርን ያመለክታል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ምላሽ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: ከእነርሱ ብዙዎች
  rationale: ንግግሩን የተናገሩት ከቡድኑ ውስጥ የተወሰኑ ብዙ ሰዎች መሆናቸውን የግሪኩን ከፊላዊ አገላለጽ በመጠበቅ ያሳያል።
- source_word: Δαιμόνιον ἔχει
  choice: ጋኔን አለበት
  rationale: የግሪኩን ‘ጋኔን አለው’ የሚል ቀጥተኛ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል፤ ‘ጋኔን ተጠናውቶታል’ ከሚለው ያነሰ ትርጓሜያዊ ነው።
- source_word: μαίνεται
  choice: አብዷል
  rationale: በዐውደ ንባቡ የተናጋሪዎቹን የእብደት ክስ በግልጽና ወቅታዊ አማርኛ ያስተላልፋል።
- source_word: τί αὐτοῦ ἀκούετε;
  choice: ለምን ታዳምጡታላችሁ?
  rationale: τί በዚህ ዐውደ ንባብ ‘ለምን?’ ማለት ሲሆን፣ ἀκούω ከዝርዝር ተሳቢ ጋር የማዳመጥን ሐሳብ ይገልጣል፤ ቅርጹም የጥያቄውን ወቀሳዊ ኃይል ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ላይ የቀረበውን የጥላቻ ክስ መተርጎም
  choice: ጋኔን አለበት፤ አብዷልም
  alternative: ጋኔን ተጠናውቶታል፤ እብድም ነው
  rationale: የተቃዋሚዎቹን ስድብ ሳያለዝብና ከግሪኩ በላይ የሆነ ክሊኒካዊ ወይም አስተምህሯዊ ማብራሪያ ሳይጨምር ቀጥተኛ አድርጎ ያቀርባል።
