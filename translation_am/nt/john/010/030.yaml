translation:
  language: am
  text: እኔና አብ አንድ ነን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ «አንድ» የሚለው ቃል ገለልተኛ ጾታ ነው፤ ይህም ኢየሱስና አብ አንድ ሰው ናቸው ሳይል አንድነታቸውን ያጎላል።
