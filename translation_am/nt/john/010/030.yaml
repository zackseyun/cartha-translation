lexical_decisions:
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪክ ጽሑፉ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን የመጀመሪያ ሰው ነጠላ ተውላጠ ስም ይጠብቃል።
- source_word: καὶ
  choice: ና
  rationale: ሁለቱን ባለቤቶች በተፈጥሯዊ ዘመናዊ አማርኛ የሚያገናኝ ቀላል አያያዥ ነው።
- source_word: ὁ πατὴρ
  choice: አብ
  rationale: በዮሐንስ አጠቃቀም የኢየሱስን አባት እንደ መለኮታዊ ማዕረግ የሚጠቅሰውን ቃል፣ በአማርኛ የመጽሐፍ ቅዱስ ንግግር የተለመደውንና የተከበረውን «አብ» በማለት ያቀርባል።
- source_word: ἕν
  choice: አንድ
  rationale: የምንጩን ገለልተኛ ጾታ ነጠላ ቅርጽ በቀጥታ ያቀርባል፤ አንድነቱን ያረጋግጣል እንጂ ኢየሱስንና አብን አንድ ሰው ናቸው ብሎ አያመሳስላቸውም።
- source_word: ἐσμεν
  choice: ነን
  rationale: የመጀመሪያ ሰው ብዙ ቁጥር የአሁን ጊዜ ግስ ነው፤ «እኔ» እና «አብ» ያላቸውን ልዩነት እየጠበቀ አንድነታቸውን ይናገራል።
theological_decisions:
- issue: በክርስቶስ ማንነት ረገድ ከፍተኛ ጠቀሜታ ባለው ንግግር ውስጥ ገለልተኛው ἕν ከብዙ ቁጥሩ ἐσμεν ጋር ያለው ትርጉም
  choice: ንግግሩ «እኔና አብ አንድ ነን» ተብሎ፣ በኢየሱስና በአብ መካከል እውነተኛ አንድነትን ሲያረጋግጥ የሁለቱን ግላዊ ልዩነትም እንዲጠብቅ ተተርጉሟል።
  alternative: «እኔና አብ በአንድነት ነን» ወይም «እኔና አብ አንድ ነገር ነን»
  rationale: «በአንድነት ነን» የሚለው አማራጭ ንግግሩን ወደ ሐሳብ መስማማት ብቻ ሊያዳክመው ይችላል፤ «አንድ ነገር» ደግሞ በአማርኛ የማይፈለግ ትርጉም ሊያስከትልና ሰዎችን እንደ ነገር ሊያቀርብ ይችላል። «አንድ ነን» የግሪኩን አጭርነትና መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። «አብ» በአማርኛ የመጽሐፍ ቅዱስ ቋንቋ የታወቀ መለኮታዊ ማዕረግ ሲሆን፣ «እኔና … አንድ ነን» የሚለው አገላለጽ የግሪኩን አጭርነትና አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
