source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: am
  text: ማንም ሕይወቴን ከእኔ አይወስድብኝም፤ እኔ ግን በራሴ ፈቃድ[a] እሰጣለሁ። ሕይወቴን ልሰጥ ሥልጣን[b] አለኝ፤ ደግሜም ልወስዳት ሥልጣን አለኝ። ይህን ትእዛዝ ከአባቴ ተቀብያለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከራሴ” ወይም “በራሴ ተነሳሽነት።” አገላለጹ ኢየሱስ ሕይወቱን በፈቃዱ እንደሚሰጥ ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መብት” ወይም “ኃይል።” የግሪኩ ቃል ችሎታንም ሆነ ተገቢ መብትን ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: ከእኔ አይወስዳትም
  rationale: አገላለጹ ሕይወቱን ከእርሱ መውሰድን ያመለክታል፤ የግሪኩን ተቃርኖም በቀጥታ ይጠብቃል።
- source_word: τίθημι αὐτὴν / θεῖναι αὐτήν
  choice: አሳልፌ እሰጣታለሁ / አሳልፌ ልሰጣት
  rationale: ሕይወትን ‘ማኖር’ በዘመናዊ አማርኛ የተፈለገውን ፍቺ በተፈጥሮ አያስተላልፍም። ‘አሳልፎ መስጠት’ የፈቃደኝነትንና የራስን ሕይወት ለሞት የመስጠትን ሐሳብ በተፈጥሮ ያስተላልፋል፤ የግሱ ድግግሞሽም ተጠብቋል።
- source_word: ἀπ’ ἐμαυτοῦ
  choice: በራሴ ፈቃድ
  rationale: ይህ የኢየሱስን ፈቃደኛ ራስ-ሰጪነት በተፈጥሯዊ አማርኛ ያሳያል፤ ከአብ ነጻ ሆኖ እንደሚሠራ ግን አያመለክትም።
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: ቃሉ ችሎታን ብቻ ሳይሆን ተገቢ መብትንና ፈቃድ ያለውን ሥልጣን ሊያካትት ይችላል፤ በአብ ትእዛዝ አውድም ‘ሥልጣን’ ተስማሚ ነው።
- source_word: πάλιν λαβεῖν αὐτήν
  choice: ደግሜም ልወስዳት
  rationale: πάλιν የሚለውን ድጋሚነትና λαμβάνω የሚያሳየውን ንቁ ድርጊት ይጠብቃል፤ ‘ልቀበላት’ የሚለው ሌላ ሊሆን የሚችል አተረጓጎም በማስታወሻ ቀርቧል።
- source_word: ἐντολήν
  choice: ትእዛዝ
  rationale: የግሪኩን ቀጥተኛ ትርጉምና በአብና በወልድ መካከል በጥቅሱ የተገለጠውን ግንኙነት ይጠብቃል።
- source_word: παρὰ τοῦ πατρός μου
  choice: ከአባቴ
  rationale: παρά ከዘርፍ አገባብ ጋር የምንጭን ሐሳብ ይገልጣል፤ የግልና የዝምድና ቋንቋውም ተጠብቋል።
theological_decisions:
- issue: የኢየሱስ ሞት ፈቃደኛነትና ከአብ ጋር ያለው ግንኙነት
  choice: ‘በራሴ ፈቃድ’ የሚለውን ከ‘ይህን ትእዛዝ ከአባቴ ተቀብያለሁ’ ጋር በአንድነት ማቆየት
  alternative: ‘በራሴ ተነሳሽነት’ ብሎ መተርጎም
  rationale: ጥቅሱ የኢየሱስን ፈቃደኛ ራስ-ሰጪነትና ከአብ የተቀበለውን ትእዛዝ አብሮ ያቀርባል። ትርጉሙ አንዱን በሌላው ሳያጠፋ ውጥረቱን ጠብቋል።
- issue: የἐξουσία ፍቺ
  choice: ሥልጣን
  alternative: ኃይል ወይም መብት
  rationale: ‘ሥልጣን’ ችሎታንና ተገቢ ፈቃድን አንድ ላይ ሊያመለክት ስለሚችል፣ የኢየሱስን ንቁ ድርጊት ወደ ጥሬ ኃይል አያጠብበውም።
- issue: የαὐτήν ተመላሽ ስም ዋቢ
  choice: የአንስታይ ነጠላ ተውላጠ ስምን በ‘አይወስዳትም፣ እሰጣታለሁ፣ ልሰጣት፣ ልወስዳት’ ማቆየት
  alternative: በእያንዳንዱ ቦታ ‘ሕይወቴን’ ብሎ መድገም
  rationale: የግሪኩ ተውላጠ ስም በቅርብ አውድ ወዳለው ‘ሕይወቴን’ ይመለሳል። ተውላጠ ስሙን ማቆየት የጽሑፉን ዘይቤ ይጠብቃል፤ ዋቢውም በማስታወሻ ተገልጿል።
