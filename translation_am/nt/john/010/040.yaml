  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: am
  text: እርሱም ደግሞ ዮሐንስ በመጀመሪያ ሲያጠምቅበት ወደ ነበረው ስፍራ፣ ከዮርዳኖስ ማዶ ሄደ፤ በዚያም ቆየ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ሄደ
  rationale: የመነሳትንና ከነበረበት ስፍራ የመሄድን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የአውዱ እንቅስቃሴም ይህን ግልጽ ያደርገዋል።
- source_word: πάλιν
  choice: ደግሞ
  rationale: ድርጊቱ እንደገና መፈጸሙን በተለመደና ቀላል አማርኛ ይገልጣል።
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ከዮርዳኖስ ማዶ
  rationale: πέραν ከዘር አገባብ ጋር የወንዙን ሌላ ወገን ያመለክታል፤ «ከዮርዳኖስ ማዶ» ተፈጥሯዊና በቦታ ረገድ ግልጽ ነው።
- source_word: εἰς τὸν τόπον
  choice: ወደነበረው ስፍራ
  rationale: εἰς የመዳረሻ አቅጣጫን ይገልጣል፤ «ወደ ... ስፍራ» ትክክለኛና ተፈጥሯዊ ነው።
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: ዮሐንስ በመጀመሪያ ያጠምቅበት ወደነበረው ስፍራ
  rationale: የግሪኩ ያልተጠናቀቀ ጊዜና ተሳቢ አንቀጽ የዮሐንስን ቀደምትና ቀጣይ የማጥመቅ ሥራ ያመለክታሉ፤ የአማርኛው አገላለጽ ይህን በለዘብተኛ የኋላ ጊዜ አንጻር ያቀርባል።
- source_word: ἔμεινεν ἐκεῖ
  choice: በዚያም ቆየ
  rationale: μένω በዚያ ቦታ ለጊዜው መቆየትን ያመለክታል፤ «ቆየ» ዘመናዊና ተፈጥሯዊ ምርጫ ነው።
