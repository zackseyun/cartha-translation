base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: am
  text: ስለዚህ እንደገና ሊይዙት ይፈልጉ ነበር፤ እርሱ ግን ከእጃቸው[a] ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእጆቻቸው” ወይም “ከያዙበት።” ግሪኩ ቃል በቃል “ከእጃቸው” ይላል፤ ይህም ከኃይላቸው ወይም ከቁጥጥራቸው መውጣትን የሚያመለክት ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ሞከሩ
  rationale: ያልተሳካ ጥረትን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ኢምፐርፌክት አውድ ቀጣይ ወይም የተሞከረ ተግባርን ሊገልጥ ይችላል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚከተለውን ውጤትና የትረካውን ትስስር ያሳያል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ድርጊቱ የተደገመ መሆኑን ቀጥተኛና ዘመናዊ በሆነ አገላለጽ ያስተላልፋል።
- source_word: πιάσαι
  choice: ሊይዙት
  rationale: ቃሉ በኃይል መያዝን ሊያመለክት ስለሚችል የጥላቻውን አውድ ይጠብቃል፤ በዋናው ጽሑፍ የሕጋዊ ‘እስር’ ልዩ ትርጉም አይጨምርም።
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: የግሪኩን መሠረታዊ ‘ወጣ’ ትርጉም ይጠብቃል፤ ‘አመለጠ’ በማለት በግልጽ ያልተጻፈውን አይጨምርም።
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: ከእጃቸው
  rationale: በግሪክ ነጠላ የሆነውን ‘እጅ’ ይጠብቃል፤ በአማርኛም ከቁጥጥር ወይም ከያዙበት መውጣትን በተፈጥሯዊ ፈሊጥ ያሳያል።
theological_decisions:
- issue: የኢየሱስን ከእነርሱ መዳን ‘አመለጠ’ ብሎ በግልጽ መተርጎም ወይስ የመነሻውን አገላለጽ መጠበቅ
  choice: ‘ከእጃቸው ወጣ’ የሚለውን ቀጥተኛ አገላለጽ መጠበቅ
  alternative: ‘አመለጣቸው’ ወይም ‘ከያዙበት አመለጠ’
  rationale: አውዱ ኢየሱስን መያዝ እንዳልቻሉ ያሳያል፤ ሆኖም ግሪኩ ግልጽ የማምለጥ ግስ ሳይጠቀም ‘ከእጃቸው ወጣ’ ይላል። ይህን መጠበቅ ትርጓሜያዊ ጭማሪን ይከላከላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከመነሻው ጽሑፍ ጋር ያለውን ቅርበትና የአማርኛን ተፈጥሯዊነት ለማመጣጠን ‘ከእጃቸው ወጣ’ የሚለው ፈሊጣዊ አገላለጽ ተመርጧል።
