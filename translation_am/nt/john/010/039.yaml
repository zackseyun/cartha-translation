  verdict: revise
  source_fidelity: ‘ሞከሩ’ communicates an attempted action, but as a completed perfective it does not adequately retain the imperfective force of ἐζήτουν (‘they were seeking/trying’). Recasting it with ‘ይፈልጉ ነበር’ preserves the ongoing or repeated attempt. ‘ከእጃቸው ወጣ’ appropriately retains the Greek wording without adding an explicit verb for escape.
  naturalness: The revised wording is natural, clear modern standard Amharic. The contrast marked by ‘ግን’ and the idiomatic expression ‘ከእጃቸው ወጣ’ are understandable in a dignified biblical register.
  terminology: ‘ሊይዙት’ suitably renders πιάσαι without prematurely specifying a legal arrest. ‘እንደገና’ correctly renders πάλιν. The footnote now gives the principal idiomatic alternatives while explaining that the Greek has singular ‘hand.’
  issues:
  - severity: medium
    issue: Imperfect aspect of ἐζήτουν is underrepresented by ‘ሞከሩ.’
    rationale: The aoristic perfective Amharic verb presents a completed attempt, whereas the Greek imperfect portrays their seeking/attempting as ongoing, repeated, or in progress. ‘ሊይዙት ይፈልጉ ነበር’ retains this aspect without changing the meaning.
  revised_text: ስለዚህ እንደገና ሊይዙት ይፈልጉ ነበር፤ እርሱ ግን ከእጃቸው[a] ወጣ።
