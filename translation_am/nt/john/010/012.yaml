base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: am
  text: በቅጥር የሚሠራው ሰው፣ እረኛ ያልሆነውና በጎቹም የራሱ ያልሆኑት፣ ተኩላው ሲመጣ አይቶ በጎቹን ትቶ[a] ይሸሻል፤ ተኩላውም ይነጥቃቸዋል፣ ይበትናቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጎቹን ጥሎ።” “ትቶ” የተባለው ግስ በአደጋ ጊዜ ጥሎ መሄድን የሚያመለክት ጠንካራ ትርጉም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
