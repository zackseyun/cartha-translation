  text: በዚያም ብዙዎች በእርሱ አመኑ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ በመተርጎም ከቀደመው ትረካ ጋር ያለውን ትስስር ይጠብቃል።
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: በስም ተግባር የቀረበውን ብዙ ሰዎች የሚያመለክት ብዙ ቁጥር አጭርና ተፈጥሯዊ በሆነ መልኩ ይገልጣል።
- source_word: ἐπίστευσαν
  choice: አመኑ
  rationale: የπιστεύωን አኦሪስት ግስ በቀጥታ ይተረጉማል፤ በግሪኩ ያልተገደበውን ‘ማመን ጀመሩ’ የሚል ጅማሬያዊ ትርጉም አይጨምርም።
- source_word: εἰς αὐτόν
  choice: በእርሱ
  rationale: ከπιστεύω ጋር ያለው አገባብ ወደ ኢየሱስ የተመራ እምነትን ያመለክታል፤ ‘በእርሱ አመኑ’ በአማርኛ የተለመደና ትርጉሙን የሚጠብቅ አነጋገር ነው።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: የማመኑን ቦታ በግልጽና ተፈጥሯዊ የቦታ ተውሳክ ይገልጣል።
theological_decisions:
- issue: πιστεύω εἰς αὐτόν በኢየሱስ ላይ የተመራ እምነትን ሲገልጥ
  choice: በእርሱ አመኑ
  alternative: እምነታቸውን በእርሱ ላይ ጣሉ
  rationale: የግሪኩን የእምነት ቋንቋ በቀጥታ ይጠብቃል፤ የግል እምነት ወደ ኢየሱስ መመራቱን ሳያዳክም ከመጠን በላይ አይተረጉምም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የቦታውን አጽንዖት ለመጠበቅ ‘በዚያም’ በአረፍተ ነገሩ መጀመሪያ ተቀምጧል።
