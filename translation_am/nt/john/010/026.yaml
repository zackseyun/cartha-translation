  text: ነገር ግን እናንተ ከበጎቼ ወገን ስላልሆናችሁ አታምኑም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነገር ግን እናንተ ከበጎቼ ወገን እንዳልሆናችሁ አታምኑም።” የግሪኩ አያያዥ ቃል ምክንያትን ከመግለጽ ይልቅ የማያምኑትን ይዘት እንደሚያስተዋውቅም ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὑμεῖς
