- source_word: οὐ πιστεύετε
  choice: አታምኑም
  rationale: አሉታዊውን የአሁን ጊዜ አመልካች በተፈጥሯዊ አማርኛ ይገልጣል፤ በዮሐንስ አውድም ‘ማመን’ ተገቢ ነው።
- source_word: ὅτι
  choice: ስላልሆናችሁ
  rationale: ὅτιን በዋናው ንባብ ምክንያታዊ ‘ስለ’ በሚል ያቀርባል፤ የይዘት አስተዋዋቂ ንባቡ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: οὐκ ἐστὲ
  choice: አልሆናችሁ
  rationale: አሉታዊውን አያያዥ ግስ በተፈጥሯዊ የአማርኛ አገላለጽ ይተረጉማል።
- source_word: ἐκ τῶν προβάτων
  choice: ከበጎች ወገን
  rationale: ἐκ በዚህ ስፍራ የቡድን አባልነትን ያመለክታል፤ ‘ከ…ወገን’ ይህን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν ἐμῶν
  choice: በጎቼ
  rationale: የባለቤትነት ቅጽን በቀጥታና በተፈጥሯዊ ሁኔታ ያሳያል።
