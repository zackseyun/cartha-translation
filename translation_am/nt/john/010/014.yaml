  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: am
  text: እኔ መልካሙ እረኛ ነኝ፤ የራሴ የሆኑትን[a] አውቃቸዋለሁ፤ የራሴ የሆኑትም ያውቁኛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጎቼን።” ግሪኩ በሁለቱም ሐረጎች ቃል በቃል “የራሴ የሆኑት” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμήν
  choice: እረኛ
  rationale: ቃሉ በዚህ ንግግር ውስጥ ያለውን የበግ ጠባቂ ምሳሌያዊ ምስል በቀጥታ ይጠብቃል፤ ከጊዜ በኋላ የተለመደውን የቤተ ክርስቲያን ማዕረግ አያስገባም።
- source_word: καλός
  choice: መልካሙ
  rationale: የግብረ ገብ መልካምነትንና ተገቢ የሆነ ክቡርነትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γινώσκω / γινώσκουσί με
  choice: አውቃቸዋለሁ / ያውቁኛል
  rationale: በኢየሱስና በእርሱ ወገኖች መካከል ያለውን የግልና የግንኙነት እውቀት በተመጣጣኝ ሁኔታ ይገልጣል፤ ‘ይለዩኛል’ ከሚለው የበለጠ የግሪኩን ጥልቀት ይጠብቃል።
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: የራሴ የሆኑት
  rationale: በግሪኩ ያለውን አጭር የባለቤትነትና የዝምድና አገላለጽ ይጠብቃል፤ በአውዱ በጎቹን ቢያመለክትም በዚህ ቁጥር ‘በጎች’ የሚለው ስም በግልጽ አልተደገመም።
- source_word: ἐγώ εἰμι
  choice: እኔ … ነኝ
  rationale: ግልጽ የሆነውን የአሁን ጊዜ ራስን የመግለጥ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καί
  choice: ፤ / ም
  rationale: የግሪኩን ተከታታይ አገናኝ አማርኛ በተፈጥሮ በሚጠቀምበት ሥርዓተ ነጥብና በ‘-ም’ አገናኝ ያስተላልፋል፤ ያልተጠየቀ አጽንዖት አይጨምርም።
theological_decisions:
- issue: በኢየሱስና በእርሱ ወገኖች መካከል ያለውን ተደጋጋፊ ግንኙነት የኋላ ዘመን የእምነት ቀመሮችን ሳያስገባ መተርጎም
  choice: የራሴ የሆኑት
  alternative: በጎቼ / የእኔ የሆኑት
  rationale: ይህ ምርጫ የግሪኩን የባለቤትነትና የግል ግንኙነት አጽንዖት ይጠብቃል፤ በአውዱ የታወቀውን ‘በጎች’ የሚለውን ቃል ወደ ዋናው ጽሑፍ አያክልም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘የራሴ የሆኑት’ የሚለው አገላለጽ በሁለቱም ሐረጎች በመደገሙ የግሪኩ ትይዩነት ተጠብቋል።
