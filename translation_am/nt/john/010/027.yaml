id: JHN.10.27
reference: John 10:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: am
  text: የእኔ በጎች ድምፄን ይሰማሉ፤ እኔም አውቃቸዋለሁ፤ እነርሱም ይከተሉኛል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόβατα
  choice: በጎች
  rationale: በእረኛውና በመንጋው ዘይቤ ውስጥ የግሪኩን መደበኛ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰ ἐμὰ
  choice: የእኔ
  rationale: ባለቤትነቱንና በግሪኩ ያለውን መጠነኛ አጽንዖት ይጠብቃል፤ «በጎቼ» የበለጠ አጭር ቢሆንም አጽንዖቱን ያሳንሳል።
- source_word: φωνῆς
  choice: ድምፄን
  rationale: በእረኛውና በበጎቹ መካከል ያለውን የግል ድምፅ ማወቅ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀκούουσιν
  choice: ይሰማሉ
  rationale: የግሱን ቀጥተኛ ትርጉምና የባሕርይ/ቀጣይነት አውድ ይጠብቃል፤ «ያዳምጣሉ» በግሱ ብቻ ያልተገለጸ የትኩረት ሐሳብ ሊጨምር ይችላል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: καί + ἐγώ ያለውን አያያዥነትና መጠነኛ አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γινώσκω
  choice: አውቃቸዋለሁ
  rationale: የግሪኩን ቀጥተኛ ሰፊ ትርጉም ይጠብቃል፤ በዮሐንስ አውድ ያለውን ግንኙነታዊ ጥልቀት ሳያጠብ ወይም በማብራሪያ ሳይገድብ ያስተላልፋል።
- source_word: αὐτά
  choice: -አቸው
  rationale: ወደ በጎቹ የሚመለሰውን የብዙ ቁጥር ተሳቢ ተውላጠ ስም በአማርኛ ግስ ውስጥ በተፈጥሯዊ መንገድ ያካትታል።
- source_word: ἀκολουθοῦσίν μοι
  choice: ይከተሉኛል
  rationale: ቀጣይ ወይም የተለመደ ባሕርይን የሚገልጠውን የአሁን ጊዜ ግስ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በእረኛና በበጎች ዘይቤ ውስጥ የγινώσκω ግንኙነታዊ ኃይል
  choice: «አውቃቸዋለሁ» ተብሎ ያለ ማስፋፊያ ተተርጉሟል።
  alternative: «በግል አውቃቸዋለሁ» ወይም «እለያቸዋለሁ»
  rationale: «አውቃቸዋለሁ» ግንኙነታዊ ጥልቀቱን ክፍት አድርጎ ይጠብቃል፤ «በግል» የሚለው የትርጓሜ ማስፋፊያ ሲሆን «እለያቸዋለሁ» ደግሞ ትርጉሙን ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ሦስቱ ሐረጎች በሰሚኮሎን ተለይተው የግሪኩን ተከታታይ አያያዝ ጠብቀዋል። የግሪኩ ጽሑፍ እዚህ ላይ ልዩ የጽሑፍ ወይም የትርጉም ማስታወሻ ስለማያስፈልገው የግርጌ ማስታወሻ አልተጨመረም።
