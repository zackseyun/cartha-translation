  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: am
  text: የአባቴን ሥራዎች የማልሠራ ከሆነ፣ አትመኑኝ[a]፤
  philosophy: optimal-equivalence
  footnotes:
