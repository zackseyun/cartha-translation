lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: የማላደርግ ከሆነ
  rationale: የግሪኩን ሁኔታዊ አረፍተ ነገርና የአሁን ጊዜ ተደጋጋሚ/ቀጣይ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τὰ ἔργα
  choice: ሥራዎች
  rationale: በዮሐንስ ወንጌል የኢየሱስን ተግባራትና ምልክቶች የሚያመለክተውን ሰፊ ትርጉም ይጠብቃል።
- source_word: τοῦ πατρός μου
  choice: የአባቴን
  rationale: የባለቤትነት/ግንኙነት ዘርፉን ቀጥታና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: μὴ πιστεύετέ μοι
  choice: አትመኑኝ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር የሚሰጠውን ክልከላ እና μοι የሚያመለክተውን በኢየሱስ ላይ የተመራ ማመን/እምነት በአጭር መልኩ ይገልጣል።
theological_decisions:
- issue: πιστεύω ከዳቲቭ μοι ጋር ያለው ኃይል
  choice: አትመኑኝ
  alternative: የምለውን አትመኑ
  rationale: የግሪኩ አገባብ አንድን ሰው ማመንንም ሆነ የሚናገረውን እውነት አድርጎ መቀበልን ሊያመለክት ይችላል። ዋናው ጽሑፍ ቀጥተኛውን የግሪክ አገባብ ይጠብቃል፤ የንግግሩን ትርጉም ግን በማስታወሻ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሥራዎች” የዮሐንስን ቁልፍ ቃል ይጠብቃል፤ ብዙ ቁጥር ትእዛዙም “አትመኑኝ” ተብሎ ተጠብቋል።
