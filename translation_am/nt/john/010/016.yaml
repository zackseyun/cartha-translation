  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: am
  text: የዚህ በረት ያልሆኑ ሌሎች በጎችም አሉኝ። እነርሱንም ማምጣት አለብኝ፤ ድምፄንም ይሰማሉ[a]። አንድ መንጋ ይሆናሉ፤ አንድ እረኛም ይሆናል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ድምፄን ያዳምጣሉ።» የግሪኩ ግስ «መስማት» ወይም «ማዳመጥ» ሊል ይችላል፤ እዚህ ግን ለሚሰሙት ምላሽ የመስጠትን ሐሳብም ሊያካትት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ «በረት» (αὐλή፣ የታጠረ ስፍራ) እና «መንጋ» (ποίμνη፣ የበጎች ስብስብ) የሚሉትን ይለያል። አንዳንድ ትርጉሞች የመጨረሻውን ሐረግ «አንድ በረት» ብለው ይተረጉማሉ፤ «አንድ መንጋ» ግን የግሪኩን ቃል በትክክል ያንጸባርቃል።
    reason: alternative_reading
