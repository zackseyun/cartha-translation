lexical_decisions:
- source_word: τούτῳ
  choice: ለእርሱ
  rationale: የአመልካች ተውላጠ ስም የተሳቢ ቅርጽ ሲሆን በቀደመው ቁጥር የተጠቀሰውን እረኛ ያመለክታል። ‘ለእርሱ’ የበር ጠባቂው ለዚያ ሰው እንደሚከፍት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ θυρωρός
  choice: በር ጠባቂው
  rationale: የመግቢያውን በር የሚጠብቅና የሚከፍት ሰው ማለት ነው፤ በበጎች በረት አውድ ውስጥ ግልጽና ዘመናዊ አገላለጽ ነው።
- source_word: ἀνοίγει
  choice: ይከፍትለታል
  rationale: ቀላል የአሁን ጊዜ ድርጊትን ይገልጣል፤ የአማርኛው ተጠቃሚ ቅጥ ‘ለእርሱ’ የሚለውን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: τὰ πρόβατα
  choice: በጎቹ
  rationale: የግሪክኛውን ብዙ ቁጥርና የታወቁ በጎች መሆናቸውን ያስተላልፋል።
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: ድምፁን ይሰማሉ
  rationale: የግሪክኛው ግስ በቅርጹ ነጠላ ቢሆንም ገለልተኛ ጾታ ያለው ብዙ ቁጥር ባለቤት ‘በጎቹ’ በትርጉም ብዙ ነው፤ ስለዚህ በአማርኛ ብዙ ቁጥር ግስ ተጠቅሟል። ‘ድምፁን ይሰማሉ’ ቀጥተኛውንና ግንኙነታዊውን ምስል ይጠብቃል።
- source_word: τὰ ἴδια πρόβατα
  choice: የራሱን በጎች
  rationale: ἴδια የባለቤትነትንና ልዩ ዝምድናን ያጎላል፤ ‘የራሱን’ ይህን አጽንዖት ይጠብቃል።
- source_word: φωνεῖ κατ’ ὄνομα
  choice: እያንዳንዳቸውን በስማቸው ጠርቶ
  rationale: κατ’ ὄνομα በጎቹን በየግላቸው በስማቸው መጥራትን ያመለክታል። ይህ አገላለጽ ያንን ግላዊነት በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐξάγει αὐτά
  choice: ወደ ውጭ ይመራቸዋል
  rationale: ἐξάγω ‘ወደ ውጭ ማውጣት’ ወይም ‘መርቶ ማውጣት’ ሊሆን ይችላል። በእረኛው ምስል ውስጥ ‘ይመራቸዋል’ የግል መሪነቱን በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: የእረኛው ምስልና የድርጊቱ ባለቤት
  choice: ድርጊቶቹ የእረኛው እንደሆኑ በቀጥታ ተተርጉመዋል፤ በር ጠባቂው ለእርሱ ይከፍታል፣ በጎቹ ድምፁን ይሰማሉ፣ የራሱን በጎች በስም ጠርቶ ይመራቸዋል።
  alternative: በቁጥሩ ቃላት ውስጥ የእረኛውን ማንነት በቀጥታ ‘ኢየሱስ’ ብሎ የሚገልጽ ትርጓሜያዊ አቀራረብ።
  rationale: የክፍሉ አውድ ምሳሌያዊ ቢሆንም ቁጥሩ ራሱ እረኛውን በስም አይጠራውም። ስለዚህ ትርጉሙ ሥነ መለኮታዊ መለያን በጽሑፉ ላይ ሳይጨምር የመጀመሪያውን ምስልና ውጥረት ጠብቋል።
