base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: am
  text: ኢየሱስም መለሰላቸው፤ “ነግሬአችኋለሁ፣ እናንተ ግን አታምኑም። እኔ በአባቴ ስም[a] የማደርጋቸው ሥራዎች፣ እነዚሁ ስለ እኔ ይመሰክራሉ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአባቴ ሥልጣን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እነዚህ ስለ እኔ ምስክርነት ይሰጣሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰላቸው
  rationale: በውይይት ውስጥ ለሚሰጥ መልስ ተፈጥሯዊና የተለመደ ዘመናዊ አማርኛ ነው።
- source_word: Εἶπον ὑμῖν
  choice: ነግሬአችኋለሁ
  rationale: ኢየሱስ ከዚህ በፊት ለእነርሱ የተናገረውን ያመለክታል፤ በአማርኛም ያለፈው ንግግር አሁን ላለው ሁኔታ ያለውን ተዛምዶ በተፈጥሮ ያሳያል።
- source_word: οὐ πιστεύετε
  choice: አታምኑም
  rationale: በዮሐንስ ወንጌል πιστεύω ያለውን ቁልፍ መዝገበ ቃላዊና ሥነ መለኮታዊ ቀጣይነት ‘ማመን’ በግልጽ ይጠብቃል።
- source_word: ἔργα
  choice: ሥራዎች
  rationale: የኢየሱስን ድርጊቶችና ምልክቶች ለማመልከት በዮሐንስ የሚደጋገመውን ቃል በቀጥታ ይይዛል።
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: በአባቴ ስም
  rationale: የግሪኩን አገላለጽ ጠብቆ ውክልናን፣ ሥልጣንንና ከአብ ጋር ያለውን ዝምድና ሳይገድብ ያስተላልፋል።
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: እነዚሁ ስለ እኔ ይመሰክራሉ
  rationale: ταῦτα ያለውን አጽንዖት ‘እነዚሁ’ ይጠብቃል፤ ‘ይመሰክራሉ’ ደግሞ በዮሐንስ የሚታየውን የምስክርነት ሕጋዊ ጥላ ትርጉም ያቆያል።
theological_decisions:
- issue: የኢየሱስ ሥራዎች ከአብ ስምና ሥልጣን ጋር ያላቸው ዝምድና
  choice: በአባቴ ስም
  alternative: በአባቴ ሥልጣን
  rationale: ‘በአባቴ ስም’ የሚለው ትርጉም መለኮታዊ ፈቃድንና ውክልናን ይጠቁማል፣ ነገር ግን ግሪኩ ከሚናገረው በላይ በመዘርጋት ሥነ መለኮታዊ ውሳኔ አይጭንም።
