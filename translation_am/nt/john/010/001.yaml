base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: am
  text: “እውነት እውነት እላችኋለሁ፤ ወደ በጎቹ በረት[b] በበሩ[a] የማይገባ፣ ነገር ግን በሌላ በኩል ወጥቶ የሚገባ፣ እርሱ ሌባና ወንበዴ[c] ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ θύρα እንደ ዐውዱ “በር” ወይም “መግቢያ በር” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ወደ በጎቹ አጥር” ወይም “ወደ በጎቹ ግቢ።” የግሪኩ αὐλή የታጠረ ግቢን ወይም የእንስሳት በረትን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ግሪኩ “ሌባ” (κλέπτης) እና “ወንበዴ” (λῃστής) ብሎ ይለያል፤ ሁለተኛው ቃል ብዙ ጊዜ በኃይል ወይም በግፍ የሚፈጸም ዝርፊያን ያመለክታል።
    reason: lexical_alternative
