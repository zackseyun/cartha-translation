- issue: የነጠላ ወንድ ጾታ ተሳቢው አቀራረብ
  choice: “የማይገባ … እርሱ” በማለት ነጠላውን ማቆየት
  alternative: ወደ ብዙ ቁጥር ወይም ወደ ረቂቅ አገላለጽ መቀየር
  rationale: ይህ የግሪኩን ነጠላ ተወካይ አገላለጽ ይጠብቃል፤ በአማርኛም ግልጽና ተፈጥሯዊ ነው።
