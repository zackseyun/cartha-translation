  rationale: በመግቢያው በኩል መግባትን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ቃሉ እንደ ዐውዱ በር ወይም በር በር/በርኖስ የሚል የመግቢያ ትርጉም ሊኖረው ይችላል።
