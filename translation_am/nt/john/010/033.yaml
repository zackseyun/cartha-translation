base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: am
  text: አይሁድ መልሰው፣ “ስለ መልካም ሥራ በድንጋይ አንወግርህም፤ ነገር ግን ስለ ስድብ ነው፤ ምክንያቱም አንተ ሰው ሆነህ ራስህን አምላክ ታደርጋለህ።[a]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራስህን አንድ አምላክ ታደርጋለህ።” በግሪኩ θεόν መስተዋድድ የለውም፤ ሆኖም በዚህ የስድብ ክስ ዐውድ “አምላክ” የሚለው ትርጉም ይበልጥ ተገቢ ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን ቀጥተኛ አጠራር ይጠብቃል፤ በዚህ ዐውድ ተናጋሪዎቹ ኢየሱስን በቤተ መቅደስ የተቃወሙት ቡድን ናቸው። ‘የአይሁድ መሪዎች’ ማለት ግን ጽሑፉ ከሚለው በላይ ማጥበብ ይሆናል።
- source_word: Περὶ καλοῦ ἔργου
  choice: ስለ መልካም ሥራ
  rationale: περί ከዝርያ ቅጽ ጋር በዚህ ስፍራ ምክንያቱን ወይም ጉዳዩን ያመለክታል፤ ነጠላውን ἔργου እና የκαλοῦን ሥነ ምግባራዊ ጥራት ይጠብቃል።
- source_word: λιθάζομέν
  choice: በድንጋይ የምንወግርህ
  rationale: የአሁን ጊዜውን ድርጊት ወይም ቅርብ ዓላማ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βλασφημίας
  choice: ስድብ
  rationale: በዐውዱ በእግዚአብሔር ላይ የሚደረግን ስድብ ያመለክታል፤ አጭርና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἄνθρωπος ὢν
  choice: ሰው ሆነህ
  rationale: የተናጋሪዎቹን ንጽጽር በቅርብ ይጠብቃል፤ ከ‘ሰው ብቻ ሆነህ’ ይልቅ በጽሑፉ የሌለውን ‘ብቻ’ አይጨምርም።
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: ራስህን አምላክ ስለምታደርግ
  rationale: ποιέω ከተመላሽ ተሳቢና ከተሳቢ ማሟያ ጋር ‘ራስን X ማድረግ’ የሚለውን ትርጉም ይሰጣል። የስድብ ክሱና የዮሐንስ አንድ-አምላካዊ ዐውድ ‘አምላክ’ን ይደግፋሉ፤ ሰዋሰዋዊው አማራጭ ግን በማስታወሻ ተጠብቋል።
