  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: am
  text: ብዙዎችም ወደ እርሱ መጡና እንዲህ ይሉ ነበር፦ “ዮሐንስ ምንም ምልክት አላደረገም፤[a] ነገር ግን ዮሐንስ ስለዚህ ሰው[b] የተናገረው ሁሉ እውነት ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዮሐንስ ምንም ምልክት አልፈጸመም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ስለ እርሱ።” የግሪኩ አገላለጽ በቀጥታ “ስለዚህኛው” ወይም “ስለዚህ ሰው” የሚል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ቅጽሉ እንደ ስም ሆኖ የሚሠራውን አጠቃቀም በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: ἦλθον πρὸς αὐτὸν
  choice: ወደ እርሱ መጡ
  rationale: πρός ከአኩዛቲቭ ጋር ወደ አንድ ሰው መቅረብን ያመለክታል፤ ይህም በአማርኛ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩን ያልተፈጸመ ግስ ቀጣይነት ወይም ድግግሞሽ ሳያጋንን ያስተላልፋል።
- source_word: σημεῖον
  choice: ምልክት
  rationale: በዮሐንስ ወንጌል ከድርጊቱ ባሻገር ወደ ትርጉሙ የሚያመለክተውን ጭብጥ ይጠብቃል፤ “ተአምር” የሚለው ይህን ልዩነት ሊያዳክም ይችላል።
- source_word: ἐποίησεν οὐδέν
  choice: ምንም ምልክት አላደረገም
  rationale: የግሪኩን ቀላል አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πάντα δὲ ὅσα
  choice: የተናገረው ሁሉ
  rationale: የግሪኩን አጠቃላይነት በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: περὶ τούτου
  choice: ስለዚህ ሰው
  rationale: τούτου ያለውን አመልካች ኃይል ይጠብቃል፤ በዚህ አውድ የሚያመለክተውም ኢየሱስን ነው።
- source_word: ἀληθῆ ἦν
  choice: እውነት ነበር
  rationale: “በኋላ እውነትነቱ ተረጋገጠ” የሚል ተጨማሪ ፍቺ ሳያስገባ ቀጥተኛውን የግሪክ ድምዳሜ ያስተላልፋል።
