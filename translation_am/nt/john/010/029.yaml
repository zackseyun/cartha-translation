- issue: πάντων μεῖζων የሚያካትተው የንጽጽር ወሰን
  choice: «ከሁሉ ይበልጣል» የሚለው ሰፊ አገላለጽ ተጠብቋል።
  alternative: «ከሰዎች ሁሉ ይበልጣል» ወይም «ከነገሮች ሁሉ ይበልጣል»
  rationale: πάντων ሰዎችን ብቻ ወይም ነገሮችን ብቻ ብሎ አይወስንም። ሰፊው ትርጉም የጽሑፉን ክፍትነት ይጠብቃል፣ ያልተገለጸ የእምነት አቋምም አያስገባም።
