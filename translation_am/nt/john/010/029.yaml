base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: am
  text: እነርሱን የሰጠኝ አባቴ[a] ከሁሉ ይበልጣል፤ ማንም ከአባቴ እጅ ሊነጥቃቸው አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በቃል ትርጉሙ፣ «አባቴ፣ የሰጠኝ ነገር ከሁሉ ይበልጣል።» በዚህ ቦታ ያለው የግሪክ አገላለጽ አስቸጋሪ ነው፤ አንዳንዶች በንጽጽሩ የተጠቀሰው የተሰጡት ሰዎች ሳይሆኑ ስጦታው ራሱ እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: አባቴ
  rationale: የግሪኩን የባለቤትነት አገላለጽ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያቀርባል፤ ኢየሱስ ከእግዚአብሔር ጋር ያለውን የአባትና የልጅ ግንኙነትም ይጠብቃል።
- source_word: ὃ δέδωκέν μοι
  choice: እነርሱን የሰጠኝ
  rationale: ገለልተኛ ነጠላው ὃ በአወቃቀርና በቅጂ ልዩነት ረገድ አስቸጋሪ ቢሆንም፣ በቁጥር 27–28 ያሉትን በጎች በጋራ እንደሚያመለክት ዐውዱ ይደግፋል። የፍጹም ጊዜው δέδωκεν የስጦታውን ዘላቂ ውጤት በ«የሰጠኝ» ያስተላልፋል።
- source_word: πάντων μεῖζων
  choice: ከሁሉ ይበልጣል
  rationale: ንጽጽሩን ሰዎች ወይም ነገሮች ብሎ ሳያጠብ፣ የግሪኩን ሰፊና ፍጹም አገላለጽ ይጠብቃል።
- source_word: οὐδεὶς δύναται
  choice: ማንም … አይችልም
  rationale: የችሎታ አለመኖርን በተፈጥሯዊ የአማርኛ አገላለጽ በግልጽ ያስተላልፋል።
- source_word: ἁρπάζειν
  choice: ሊነጥቃቸው
  rationale: በኃይል ወይም በድንገት የመውሰድን ሐሳብ ይይዛል፣ በቁጥር 28 ካለው አገላለጽም ጋር ይጣጣማል።
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: ከአብም እጅ
  rationale: ἐκ የሚያመለክተውን ከውስጥ ወደ ውጭ የመንጠቅ ሐሳብ በዐውዱ ያስተላልፋል፤ «እጅ» የጥበቃ፣ የባለቤትነትና የኃይል ዘይቤውን ይጠብቃል።
theological_decisions:
