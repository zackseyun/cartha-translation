  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: am
  text: እኔም የዘላለም ሕይወት እሰጣቸዋለሁ፤ ለዘላለምም ፈጽሞ አይጠፉም፤ ማንም ከእጄ አይነጥቃቸውም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: የዘላለም ሕይወት
  rationale: የግሪኩን የተለመደ የዮሐንስ አገላለጽ በተፈጥሯዊና በታወቀ አማርኛ ያቀርባል።
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: ለዘላለምም ፈጽሞ አይጠፉም
  rationale: οὐ μή የሚያሳየውን ጠንካራ እምቢታ «ፈጽሞ» ይገልጣል፤ εἰς τὸν αἰῶνα ደግሞ «ለዘላለም» ተብሎ በግልጽ ተጠብቋል።
- source_word: ἁρπάσει
  choice: አይነጥቃቸውም
  rationale: በኃይል መውሰድን ወይም መንጠቅን የሚያመለክተውን ግስ በቀጥታ ያስተላልፋል።
- source_word: ἐκ τῆς χειρός μου
  choice: ከእጄ
  rationale: የመነሻውን የእጅ ምስል ሳይቀይር በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የοὐ μή እና εἰς τὸν αἰῶνα ድርብ አጽንዖት
  choice: ለዘላለምም ፈጽሞ አይጠፉም
  alternative: ፈጽሞ አይጠፉም
  rationale: አጭሩ አማራጭ ጠንካራውን እምቢታ ቢገልጥም፣ εἰς τὸν αἰῶνα የሚለውን የጊዜ ሐረግ በግልጽ አያሳይም፤ የተመረጠው አተረጓጎም ሁለቱንም ይጠብቃል።
- issue: «ከእጄ» የሚለው ምስላዊ አነጋገር
  choice: ምስሉን በቀጥታ መጠበቅ
  alternative: ከጥበቃዬ ማንም አያወጣቸውም
  rationale: ምንጩ የእጅን ምስል ስለሚጠቀም፣ ትርጉሙን ወደ አንድ ትርጓሜ ከማጥበብ ይልቅ የጽሑፉን ምስላዊ ኃይልና ክፍትነት መጠበቅ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «እኔም» የκἀγώን አጽንዖት ይጠብቃል፤ ተከታታይ ሐረጎቹ በከፊል ምልክት ተለይተው የግሪኩን ሦስት ክፍል አወቃቀር ያንጸባርቃሉ።
