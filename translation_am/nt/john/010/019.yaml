  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: am
  text: በእነዚህ ቃሎች ምክንያት በአይሁድ[a] መካከል እንደገና ክፍፍል ተፈጠረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «በይሁዳ ነዋሪዎች መካከል»። በዮሐንስ ወንጌል ውስጥ «አይሁድ» የሚለው ቃል በአንዳንድ ዐውዶች የአይሁድ መሪዎችን ሊያመለክት ይችላል። እዚህ ያለው «አይሁድ» የግሪክኛውን አገላለጽ ያንጸባርቃል፤ ሆኖም በዮሐንስ ወንጌል ቃሉ ብዙ ጊዜ መላውን የአይሁድ ሕዝብ ሳይሆን በዐውዱ የተወሰነ ቡድን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: መለያየት
  rationale: ቃሉ መሰንጠቅን፣ መከፋፈልን ወይም አለመስማማትን ያመለክታል፤ በዚህ ዐውድ ሰዎቹ ለኢየሱስ ቃል የሰጡትን የተከፋፈለ ምላሽ ለመግለጽ «መለያየት» ተፈጥሯዊና ግልጽ ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: ድርጊቱ ቀደም ሲልም መከሰቱን የሚያሳየውን የድግግሞሽ ትርጉም በግልጽ ያስተላልፋል።
- source_word: ἐγένετο
  choice: ተፈጠረ
  rationale: መለያየቱ መከሰቱንና ወደ መኖር መምጣቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: በአይሁድ መካከል
  rationale: የግሪክኛውን ቀጥተኛ አገላለጽ ይጠብቃል፤ በዮሐንስ ወንጌል የቃሉ ማጣቀሻ እንደ ዐውዱ የይሁዳ ነዋሪዎችን ወይም የአይሁድ መሪዎችን ሊያመለክት ስለሚችል ማብራሪያ በግርጌ ማስታወሻ ቀርቧል።
- source_word: διὰ
  choice: በ… ምክንያት
  rationale: ከአክዩዛቲቭ ጋር ያለው διά የሚገልጠውን ምክንያታዊ ግንኙነት በግልጽ ያስተላልፋል።
- source_word: τοὺς λόγους τούτους
  choice: በእነዚህ ቃሎች
  rationale: ኢየሱስ ቀደም ሲል የተናገራቸውን ንግግሮች በቀላልና ቀጥተኛ አማርኛ ያመለክታል።
theological_decisions:
- issue: በዮሐንስ ወንጌል ውስጥ Ἰουδαῖοι የሚያመለክተው ቡድን
  choice: በዋናው ጽሑፍ «አይሁድ» ተብሎ ተተርጉሟል፤ የዐውዱ ገደብ ግን በግርጌ ማስታወሻ ተገልጿል።
  alternative: «የይሁዳ ነዋሪዎች» ወይም «የአይሁድ መሪዎች»
  rationale: ዋናው ጽሑፍ የግሪክኛውን አገላለጽ ሳይጠብብ ይጠብቃል፤ ሆኖም ቃሉ በዘመናዊ አንባቢ ዘንድ ለመላው የአይሁድ ሕዝብ የተሰጠ አጠቃላይ ፍርድ እንዳይመስል፣ የዮሐንስን ዐውዳዊ አጠቃቀም ማስታወሻው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «መለያየት ተፈጠረ» የሚለው አገላለጽ የግሪክኛውን ክስተታዊ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
