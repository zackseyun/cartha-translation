  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የብዙ ቁጥር ቅርጾች በአማርኛ በግልጽ ተጠብቀዋል፤ ‘የሰው ልጅ’ የሚለውም የተለመደውን ቅዱስ መጽሐፋዊ መጠሪያ ይጠብቃል።
