  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: am
  text: እርሱም እንዲህ አለው፦ “እውነት እውነት እላችኋለሁ፤[a] ሰማይ ተከፍቶ፣ የእግዚአብሔርም መላእክት በሰው ልጅ ላይ ሲወጡና ሲወርዱ ታያላችሁ።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ኢየሱስ በትረካው ለአንድ ሰው እየተናገረ ቢሆንም፣ “እላችኋለሁ” እና “ታያላችሁ” የሚሉት ቃላት በግሪክ የብዙ ቁጥር ናቸው።
    reason: lexical_alternative
  - marker: b
    text: ይህ ምስል በዘፍጥረት 28፥12 ያለውን የያዕቆብ ሕልም ያስታውሳል፤ እዚህ ግን ምስሉ በሰው ልጅ ላይ ያተኩራል።
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የተደገመውን አጽንዖትና የንግግሩን ክብደት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὑμῖν / ὄψεσθε
  choice: እላችኋለሁ / ታያላችሁ
  rationale: ሁለቱም የግሪክ ቅርጾች ብዙ ቁጥር ናቸው፤ አማርኛም ይህን በግልጽ የብዙ ቁጥር ቅጽ ማሳየት ይችላል።
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: ሰማይ ተከፍቶ
  rationale: ፍጹም አንቀጽ የሚያመለክተውን ተከፍቶ የመኖር ሁኔታ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: የእግዚአብሔር መላእክት
  rationale: በዚህ ራእያዊና ቅዱስ መጽሐፋዊ አውድ የታሰቡት ሰማያዊ መላእክት ናቸው።
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: ሲወጡና ሲወርዱ
  rationale: የእንቅስቃሴውን ተቃራኒ አቅጣጫዎች ያቆያል፣ ከዘፍጥረት 28፥12 ጋር ያለውንም የቃላት ግንኙነት አያጠፋም።
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: በሰው ልጅ ላይ
  rationale: ἐπί ከአኩዛቲቭ ጋር ያለውን ምስላዊ ግንኙነት ሳይፈታ ያቆያል፤ የተመሠረተውን ‘የሰው ልጅ’ የራስ መጠሪያም ይጠብቃል።
theological_decisions:
- issue: ንግግሩ በትረካው ለአንድ ሰው ቢቀርብም ቀጥተኛው ንግግር የብዙ ቁጥር ነው።
  choice: የብዙ ቁጥር የአማርኛ ቅርጾችን ‘እላችኋለሁ’ እና ‘ታያላችሁ’ መጠቀም።
  alternative: ንግግሩን ለናትናኤል ብቻ እንደተነገረ በነጠላ ቁጥር መተርጎም።
  rationale: የግሪኩን የቁጥር ለውጥ መጠበቅ የንግግሩን ስፋት በትርጉሙ ውስጥ በቀጥታ ያሳያል።
- issue: ወደ ላይ የሚወጡና የሚወርዱ መላእክት ምስል የያዕቆብን ሕልም ያስታውሳል።
  choice: ምስሉን ሳይተነትኑ በዋናው ጽሑፍ ማቆየትና ግንኙነቱን በማስታወሻ መጥቀስ።
  alternative: የያዕቆብን ሕልምና የኢየሱስን ሚና በዋናው ጽሑፍ በገለጻ መጨመር።
  rationale: ጥቅሱ ራሱ ግንኙነቱን በምስል ያቀርባል፤ ትርጉሙ ይህን ሥነ መለኮታዊ አንድምታ አስቀድሞ መፍታት የለበትም።
