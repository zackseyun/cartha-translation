  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: am
  text: በማግስቱ ዮሐንስ ኢየሱስ ወደ እርሱ ሲመጣ አየ፤ እንዲህም አለ፦ “እነሆ፣ የዓለምን ኃጢአት የሚያስወግድ የእግዚአብሔር በግ!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: በማግስቱ
  rationale: ቀጣዩን ቀን በተፈጥሯዊና በተለመደ አማርኛ ይገልጻል።
- source_word: βλέπει
  choice: አይቶ
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ አቀራረብ ያስተላልፋል።
- source_word: Ἴδε
  choice: እነሆ
  rationale: ትኩረት የሚስበውን ትእዛዛዊ አገላለጽ በክቡርና በቀላሉ ሊገባ በሚችል መልኩ ይጠብቃል።
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: የእግዚአብሔር በግ
  rationale: ዋናውን መስዋዕታዊ ምስል ሳይተረጉም በቀጥታ ይጠብቃል።
- source_word: ὁ αἴρων
  choice: የሚያስወግድ
  rationale: αἴρω በዚህ አውድ ኃጢአትን ማስወገድ የሚለውን ሐሳብ በግልጽ ያስተላልፋል።
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: የዓለምን ኃጢአት
  rationale: የግሪኩን ነጠላ ቁጥር ‘ኃጢአት’ እንዳለ ይጠብቃል።
theological_decisions:
- issue: የ‘የእግዚአብሔር በግ’ ምስል ትርጉም
  choice: ምስሉ በቀጥታ እንዲቆይ ተደርጓል።
  alternative: ‘እግዚአብሔር የሰጠው መስዋዕት’ ብሎ መተርጎም
  rationale: ጽሑፉ የምስሉን ትክክለኛ መነሻ በዚህ ቁጥር ብቻ አይወስንም፤ ስለዚህ የፋሲካ፣ የመስዋዕት ወይም ሌላ አንድ ትርጓሜ ብቻ አልተጫነበትም።
- issue: የαἴρων ትርጉም
  choice: የሚያስወግድ
  alternative: የሚሸከም
  rationale: ቃሉ በመሠረቱ ‘ማንሳት/መሸከም/ማስወገድ’ ሊያመለክት ቢችልም፣ ከኃጢአት ጋር በዚህ አገባብ ‘ማስወገድ’ ተፈጥሯዊና ጠንካራ ነው፤ የመሸከም ሐሳብን በትርጉም ላይ በግድ አይጨምርም።
