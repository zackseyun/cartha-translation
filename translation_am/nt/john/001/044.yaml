- source_word: δὲ
  choice: ም
  rationale: δέ ቀላል የትረካ ማያያዣ ነው፤ በስም ላይ የተጣበቀው «-ም» ያለ ጠንካራ ንፅፅር የንግግሩን ቀጣይነት ያሳያል።
- source_word: Φίλιππος
  choice: ፊልጶስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይከተላል።
- source_word: ἀπὸ Βηθσαϊδά
  choice: ከቤተ ሳይዳ
  rationale: ἀπό መነሻን ወይም መገኛን ያመለክታል፤ «ከ-» በአማርኛ ይህን በተፈጥሮ ይገልጣል። የቦታው ስም በተለመደው ቅርጽ ተጽፏል።
- source_word: ἐκ τῆς πόλεως
  choice: ከተማ
  rationale: πόλις «ከተማ» ወይም እንደ አውዱ «ከተሜ» ሊሆን ይችላል፤ «ከተማ» የምንጩን ቅርጽ ይጠብቃል። ἐκ የሚያመለክተው መነሻ በአማርኛው ሐረግ ውስጥ በ«ከ» ተገልጧል።
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: የእንድርያስና የጴጥሮስ
  rationale: የግሪኩ የባለቤትነት ቅርጽ ከπόλεως ጋር ተያይዞ የሁለቱን ከከተማው ጋር ያላቸውን የመገኛ ግንኙነት ያሳያል፤ ቀጥተኛው የአማርኛ አገላለጽ «የ… ከተማ» ነው።
