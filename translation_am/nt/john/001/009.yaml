  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: am
  text: ለእያንዳንዱ ሰው ብርሃንን የሚሰጠው እውነተኛው ብርሃን[a] ወደ ዓለም እየመጣ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ለእያንዳንዱ ወደ ዓለም ለሚመጣ ሰው ብርሃንን የሚሰጠው እውነተኛው ብርሃን ነበር።” በግሪክኛ «የሚመጣ» የሚለው ተሳቢ ከ«እያንዳንዱ ሰው» ጋር ሊያያዝ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ብርሃን
  rationale: የግሪኩን የተለመደ ስም በቀጥታ ይገልጻል፤ በዐውዱ ክርስቶስን ቢያመለክትም ልዩ መጠሪያ አልተጨመረም።
- source_word: ἀληθινόν
  choice: እውነተኛው
  rationale: ‘እውነተኛ፣ ትክክለኛ፣ ፍጹም የሆነ’ የሚለውን የዮሐንስ አጠቃቀም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: φωτίζει
  choice: ብርሃንን የሚሰጠው
  rationale: ቃሉን በግልጽና በተፈጥሯዊ አማርኛ ይገልጻል፤ በዐውዱ ያለውን ምሳሌያዊ ኃይልም አያጠብም።
- source_word: πάντα ἄνθρωπον
  choice: ለእያንዳንዱ ሰው
  rationale: ነጠላና አጠቃላይ የሆነውን አገላለጽ ጾታን ሳያጠብ በዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: ወደ ዓለም እየመጣ
  rationale: በዋናው ጽሑፍ ተሳቢውን ከ‘እውነተኛው ብርሃን’ ጋር በትርጉም ያያይዛል፤ ሰዋሰዋዊው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: κόσμον
  choice: ዓለም
  rationale: በዮሐንስ ወንጌል ለκόσμος የተለመደና በዚህ ዐውድ ተገቢ ትርጉም ነው።
- source_word: ἦν
  choice: ነበር
  rationale: ያለፈ ቀጣይ ድርጊትን ከ‘እየመጣ’ ጋር በማጣመር የግሪኩን ኢምፐርፌክት በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የἐρχόμενον (‘የሚመጣ/እየመጣ’) ሰዋሰዋዊ ትስስር
  choice: በዋናው ጽሑፍ ከ‘እውነተኛው ብርሃን’ ጋር ተያይዟል፦ ‘ወደ ዓለም እየመጣ ነበር።’
  alternative: ከ‘እያንዳንዱ ሰው’ ጋር ሊያያዝ ይችላል፦ ‘ወደ ዓለም ለሚመጣው ለእያንዳንዱ ሰው ብርሃንን የሚሰጠው እውነተኛው ብርሃን ነበር።’
  rationale: የግሪኩ ተሳቢ በሰዋስው ከἄνθρωπον ጋር ሊስማማ ይችላል፤ ሆኖም የዮሐንስ ዐውድና ‘ወደ ዓለም መምጣት’ የሚለው ክርስቶሳዊ አገላለጽ በዋናው ጽሑፍ ከብርሃኑ ጋር እንዲያያዝ ይደግፋሉ። እውነተኛው ጥርጣሬ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ብርሃንን የሚሰጠው’ የሚለው አገላለጽ ከከባድ ቴክኒካዊ ቃል ይልቅ ተፈጥሯዊነትንና የምሳሌውን ኃይል ያስጠብቃል።
