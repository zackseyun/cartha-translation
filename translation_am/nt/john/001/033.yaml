review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys John’s prior lack of knowledge, the sender’s commission to baptize in water, and the identifying sign. However, መንፈሱ (‘his spirit’) introduces a possessive absent from τὸ πνεῦμα, and the relative-clause order can make the Spirit rather than the person appear to be what is seen.
  naturalness: The opening and final identification are clear modern Amharic. Recasting the identifying clause with በማን ላይ makes the intended antecedent and the Spirit’s descending and remaining on that person natural and unambiguous.
  terminology: መንፈስ ቅዱስ is the established modern Amharic rendering and appropriately identifies the referent in light of the verse’s final phrase. ሲቀር naturally renders μένον (‘remaining’) without importing a doctrinal interpretation. The parallel በውሃ / በመንፈስ ቅዱስ is retained.
  issues:
  - severity: medium
    issue: The text uses መንፈሱ for τὸ πνεῦμα.
    rationale: The possessive suffix means ‘his Spirit’ and is not present in the Greek. The immediate context warrants identifying the referent as መንፈስ ቅዱስ, but not adding a possessive.
  - severity: medium
    issue: The relative clause መንፈሱ ... በእርሱ ላይ ሲኖር የምታየው is syntactically unclear.
    rationale: Its final relative expression can be read as referring to the Spirit. Fronting the interrogative-relative phrase, በማን ላይ, clearly identifies the person as the one on whom the Spirit descends and remains.
  revised_text: እኔም እርሱን አላውቀውም ነበር፤[a] ነገር ግን በውሃ እንዳጠምቅ የላከኝ እንዲህ አለኝ፦ “መንፈስ ቅዱስ በማን ላይ ሲወርድና ሲቀር የምታየው፣ እርሱ በመንፈስ ቅዱስ የሚያጠምቀው ነው።”
