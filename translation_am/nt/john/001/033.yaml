  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: am
  text: እኔም እርሱን አላውቀውም ነበር፤[a] ነገር ግን በውሃ እንዳጠምቅ የላከኝ እንዲህ አለኝ፦ “መንፈስ ቅዱስ በማን ላይ ሲወርድና ሲቀር የምታየው፣ እርሱ በመንፈስ ቅዱስ የሚያጠምቀው ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አልለየውም ነበር።” የግሪኩ ግስ በዚህ ዐውድ አለማወቅን ወይም ማንነቱን አለመለየትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: እኔም
  rationale: καί + ἐγώ ያለውን ቀጣይነትና በተናጋሪው ላይ የሚያደርገውን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκ ᾔδειν αὐτόν
  choice: እርሱን አላውቀውም ነበር
  rationale: የቀድሞውን ያለማወቅ ሁኔታ ይገልጣል፤ በዐውዱ ‘አልለየውም ነበር’ የሚለው ትርጉምም ሊኖረው ይችላል።
- source_word: ὁ πέμψας με
  choice: የላከኝ
  rationale: በግሪክ ያለውን አርቲክል የያዘ ተሳቢ አንቀጽ በአጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: βαπτίζειν ἐν ὕδατι
  choice: በውሃ እንዳጠምቅ
  rationale: ἐνን በ‘በ’ በመተርጎም ከመጨረሻው ‘በመንፈስ ቅዱስ’ ጋር ያለውን ትይዩነት ይጠብቃል፤ በአማርኛ ‘በ’ መሣሪያንም ሆነ ስፍራዊ ግንኙነትን ሊገልጥ ይችላል።
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: በእርሱ ላይ ... የምታየው
  rationale: ምልክቱ የሚታይበትን ሰው የሚለይ አንጻራዊ አገላለጽ ነው።
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον
  choice: መንፈሱ ሲወርድና ... ሲኖር
  rationale: ሁለቱን ተሳቢ ግሶች እንደ ተያያዙ ድርጊቶች ያቀርባል፤ μένω በዮሐንስ ጽሑፎች ያለውን ‘መኖር/መቆየት’ ፍቺ ይይዛል።
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: እርሱ በመንፈስ ቅዱስ የሚያጠምቀው ነው
  rationale: οὗτός ἐστιν ያለውን ግልጽ የመለያ አጽንዖት በ‘እርሱ ... ነው’ ያስተላልፋል።
theological_decisions:
- issue: πνεῦμα / πνεύματι ἁγίῳ የሚያመለክተው
  choice: መንፈሱ ... መንፈስ ቅዱስ
  alternative: መንፈስ ... ቅዱስ መንፈስ
  rationale: የመጨረሻው ሐረግ የሚወርደው መንፈስ መንፈስ ቅዱስ መሆኑን ያሳያል፤ ‘መንፈስ ቅዱስ’ በዘመናዊ አማርኛ የተለመደና የተከበረ አገላለጽ ነው።
- issue: ἐν በሁለቱ የጥምቀት ሐረጎች
  choice: በውሃ ... በመንፈስ ቅዱስ
  alternative: ውሃ ውስጥ ... በመንፈስ ቅዱስ
  rationale: ተመሳሳዩን የግሪክ መስተዋድድ በሁለቱም ሐረጎች ‘በ’ በማለት ትይዩነቱን ይጠብቃል፤ የአማርኛውን አሻሚነትም ሳይገድብ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀርና የመለያ አጽንዖት ተጠብቀዋል፤ የእንግሊዝኛው ማስታወሻ ምልክቶች ከይዘታቸው ጋር በትክክለኛ ቦታ ተደርድረዋል።
