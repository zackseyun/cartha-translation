id: JHN.1.22
reference: John 1:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: am
  text: ስለዚህ እንዲህ አሉት፦ “አንተ ማን ነህ? እኛን ለላኩን መልስ እንድንሰጣቸው፣ ስለ ራስህ ምን ትላለህ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ምልልስ የሚመነጨውን ድምዳሜያዊና ሽግግራዊ ትስስር ያሳያል።
- source_word: εἶπαν ... αὐτῷ
  choice: እንዲህ አሉት
  rationale: ቀጥተኛ ንግግርን በተፈጥሯዊ አማርኛ ያስገባል፤ የአቅጣጫው ተውላጠ ስምም በ‘አሉት’ ውስጥ ተጠብቋል።
- source_word: Τίς εἶ;
  choice: አንተ ማን ነህ?
  rationale: አጭሩንና ቀጥተኛውን የማንነት ጥያቄ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἵνα
  choice: እንድንሰጥ
  rationale: የዓላማ ግንኙነቱን በአማርኛው የ‘እንድ-’ አወቃቀር ይገልጣል።
- source_word: ἀπόκρισιν δῶμεν
  choice: መልስ እንድንሰጥ
  rationale: ‘መልስ መስጠት’ የግሪኩን ስምና ግስ አወቃቀር የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: እኛን ለላኩን
  rationale: በግሪክ አንቀጽ እንደ ስም የሚሠራውን አካል ‘ለላኩን’ በማለት አጭርና ግልጽ አድርጎ ያስተላልፋል።
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: ስለ ራስህ ምን ትላለህ?
  rationale: περί ከዘር ባለቤት ጋር ያለውን ‘ስለ/በተመለከተ’ ትርጉምና የσεαυτοῦን አንጸባራቂ ስሜት በተፈጥሯዊ አማርኛ ይጠብቃል።
