review_pass:
  verdict: revise
  source_fidelity: The draft conveys all principal elements, but it reverses the Greek sequence by placing the purpose clause before the initial identity question. Also, ለላኩን by itself identifies those who sent them but does not clearly express that the answer is to be given to those people; adding እንድንሰጣቸው preserves the Greek dative force.
  naturalness: The revised wording follows natural modern standard Amharic direct-speech syntax and makes the recipient of the answer explicit.
  terminology: መልስ, ስለ ራስህ, and the direct identity question are suitable, clear, and nonsectarian. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The clause order differs from the source.
    rationale: Greek first asks Τίς εἶ; and then states the purpose. Restoring this order better preserves the source discourse progression.
  - severity: medium
    issue: The recipient sense of τοῖς πέμψασιν ἡμᾶς is not explicit.
    rationale: The draft's እኛን ለላኩን identifies the senders, but እንድንሰጣቸው explicitly renders ‘that we may give [an answer] to them.’
  revised_text: ስለዚህ እንዲህ አሉት፦ “አንተ ማን ነህ? እኛን ለላኩን መልስ እንድንሰጣቸው፣ ስለ ራስህ ምን ትላለህ?”
