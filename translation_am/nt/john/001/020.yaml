    text: ወይም፣ “ክርስቶስ።” የግሪክኛው ማዕረግ Χριστός (ክርስቶስ) ነው። እዚህ መሲሐዊ ማዕረግ ሆኖ ስለቀረበ፣ በዋናው ጽሑፍ “መሲሑ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: አምኖ ተናገረ
  rationale: ቃሉ በግልጽና በይፋ ማመንን ወይም መግለጽን ያመለክታል። “አምኖ ተናገረ” ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በግሪክኛው ያለውን ድግግሞሽም ይጠብቃል።
- source_word: οὐκ ἠρνήσατο
  choice: አልካደምም
  rationale: የዮሐንስን አጠቃቀምና የአረፍተ ነገሩን አጽንዖት በቀጥታ የሚያስተላልፍ ተፈጥሯዊ አተረጓጎም ነው።
- source_word: καὶ ... καὶ ... καὶ
  choice: እርሱም ...፤ ...። እንዲህም ...
  rationale: ተደጋጋሚው καί የሚፈጥረውን የአጽንዖት ክምችት በአማርኛ ተፈጥሯዊ በሆነ ቅንብርና “-ም” አያያዥ ቅጥያ ያስተላልፋል።
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: እኔ ... አይደለሁም
  rationale: ግልጽ የሆነውን Ἐγώ በ“እኔ” መተርጎም የግሪክኛውን አጽንዖት ይጠብቃል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: በዚህ አውድ Χριστός የሚጠበቀውን የተቀባ አዳኝ የሚያመለክት ማዕረግ ነው፤ “መሲሑ” ይህን የአይሁድ ተስፋና የተወሰነውን ማዕረግ ያሳያል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: መጥምቁ ዮሐንስ እርሱ የሚጠበቀው የተቀባ አዳኝ እንዳልሆነ እየገለጸ ነው። ስለዚህ ቃሉ እንደ ስም ሳይሆን እንደ ማዕረግ የሚሠራ መሆኑን “መሲሑ” በግልጽ ያስተላልፋል።
