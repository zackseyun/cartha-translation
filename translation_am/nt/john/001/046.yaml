  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: am
  text: ናትናኤልም፣ “ከናዝሬት አንዳች መልካም ነገር ሊመጣ ይችላልን?[a]” አለው። ፊልጶስም፣ “መጥተህ እይ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ከናዝሬት አንዳች መልካም ነገር ሊሆን ይችላልን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል ትስስር በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያሳያል።
- source_word: Ναθαναήλ
  choice: ናትናኤል
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደ አጻጻፍ በድምፅ ይወክላል።
- source_word: Ἐκ Ναζαρὲτ
  choice: ከናዝሬት
  rationale: ἐκ የሚያመለክተውን ምንጭ ወይም መገኛ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: አንዳች መልካም ነገር ሊገኝ ይችላልን?
  rationale: δύναται የሚገልጠውን እድል/የመቻል ሐሳብ ይጠብቃል፤ εἶναιን ‘ሊገኝ’ ማለት ከቦታ ጋር ሲያያዝ በአማርኛ ተፈጥሯዊ ሲሆን ‘መሆን’ የሚለውን ቀጥተኛ አማራጭ በማስታወሻ ይጠብቃል።
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ይገልጣል።
- source_word: ὁ Φίλιππος
  choice: ፊልጶስ
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደ አጻጻፍ ይወክላል፤ መስተዋድዱ በስሙ ፊት አይተረጎምም።
- source_word: Ἔρχου καὶ ἴδε
  choice: መጥተህ እይ
  rationale: ሁለቱን የትእዛዝ ግሶች በተፈጥሯዊ የአማርኛ ተከታታይ ድርጊት ያቀርባል፤ ‘እይ’ የማየትንና የመገንዘብን ድምፀት ይጠብቃል።
theological_decisions:
- issue: ናትናኤል ስለ ናዝሬት የጠየቀው ጥያቄ ቃና
  choice: ጥርጣሬን የሚያሳይ ቀጥተኛ የንግግር ጥያቄ
  alternative: የንቀት ወይም የፌዝ ቃላትን በግልጽ መጨመር
  rationale: የግሪኩ ጥያቄ ጥርጣሬ ቢያመለክትም ፌዝን ወይም ንቀትን በግልጽ አይሰይምም፤ ትርጉሙም ከጽሑፉ በላይ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ቀላል ትረካ፣ ጥርጣሬ ያለበት ጥያቄና አጭር ግብዣ ተጠብቀዋል።
