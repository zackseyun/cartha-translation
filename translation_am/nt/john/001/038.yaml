  rationale: ζητέω መፈለግን፣ መሻትን ወይም መፈተሽን ሊያመለክት ይችላል። ‘ትፈልጋላችሁ’ በአማርኛ ተፈጥሯዊ ሲሆን ቀጥተኛውንም ጥያቄ እና ሊኖረው የሚችለውን ጥልቅ ትርጉም ያስቀራል።
- source_word: Ῥαββί
