- source_word: ἀκολουθοῦντας
  choice: ሲከተሉት
  rationale: በዚያን ጊዜ ቀጥሎ የነበረውን ድርጊት ይጠብቃል፤ ቃሉም አካላዊ መከተልንና የደቀ መዝሙርነት ጥላ ሐሳብን ሳያስገድድ ሊይዝ ይችላል።
- source_word: Τί ζητεῖτε;
