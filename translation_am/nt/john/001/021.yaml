  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: am
  text: እነርሱም፣ “ታዲያ ምን? አንተ ኤልያስ ነህ?” ብለው ጠየቁት። እርሱም፣ “አይደለሁም” ይላል።[b] “ነቢዩ[a] አንተ ነህ?” እርሱም፣ “አይ።” ብሎ መለሰ።
  philosophy: optimal-equivalence
  footnotes:
