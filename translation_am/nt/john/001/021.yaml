  rationale: የἐρωτάω የአንድ ጊዜ ያለፈ ድርጊትን በቀጥተኛና ተፈጥሯዊ የአማርኛ ትርጉም ያቀርባል፤ በግሥ ላይ ያለው -ት ተውላጠ ስም αὐτόνን ይወክላል።
- source_word: Τί οὖν;
