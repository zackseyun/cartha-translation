- source_word: σὺ Ἠλίας εἶ
  choice: አንተ ኤልያስ ነህ?
  rationale: σὺ የሚሰጠውን አጽንዖት ‘አንተ’ በማለት ይጠብቃል፤ Ἠλίαςም በተለመደው የአማርኛ የስም አጻጻፍ ‘ኤልያስ’ ተብሏል።
- source_word: Οὐκ εἰμί
  choice: አይደለሁም
  rationale: በግሪክኛው ያለውን አጭርና ቀጥተኛ ክህደት ተጨማሪ ትርጓሜ ሳይገባ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ὁ προφήτης
  choice: ነቢዩ
  rationale: የተወሰነው መስተዋድድ ὁ ማንኛውንም ነቢይ ሳይሆን ለጠያቂዎቹ የታወቀ የሚጠበቅ ሰው መሆኑን ያመለክታል፤ ‘ነቢዩ’ ይህን የተወሰነነት ይጠብቃል።
- source_word: λέγει
  choice: ይላል
  rationale: በትረካ መካከል የገባውን የግሪክኛ ታሪካዊ የአሁን ጊዜ ቅርጽ እና ሕያውነት ይጠብቃል።
- source_word: ἀπεκρίθη
  choice: መለሰ
  rationale: በትረካ ውስጥ የተሰጠን ቀጥተኛ መልስ በተለመደና ግልጽ አማርኛ ይገልጣል።
- source_word: Οὔ
