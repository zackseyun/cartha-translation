  text: And they had been sent from the Pharisees[a].
translation:
  language: am
  text: የተላኩትም ከፈሪሳውያን ነበሩ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እነርሱም በፈሪሳውያን ተልከው ነበሩ።» የግሪኩ አገላለጽ ይበልጥ ቀጥተኛ በሆነ መንገድ ከፈሪሳውያን መሆናቸውን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: ቀላሉን አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ «-ም» በመግለጽ የትረካውን ፍሰት ይጠብቃል።
- source_word: ἀπεσταλμένοι ἦσαν
  choice: የተላኩት … ነበሩ
  rationale: ፍጹም አንቀጽና ረዳት ግስ ያለውን የግሪክ አወቃቀር በተፈጥሯዊ አማርኛ ይገልጻል፤ ቀድሞ የተፈጸመውን መላክና የተላኩ ሰዎች መሆናቸውን ያሳያል።
- source_word: ἐκ
  choice: ከ-
  rationale: መነሻን ወይም ምንጭን የሚያመለክተውን የግሪክ ቅድመ አያያዥ ቀጥተኛ ትርጉም ይጠብቃል፤ «በ-» ቢባል አድራጊነትን ይበልጥ ያጎላል።
- source_word: τῶν Φαρισαίων
  choice: ፈሪሳውያን
  rationale: የታወቀውን የቡድኑን ስም በመደበኛው የአማርኛ አጠራር ያቀርባል።
theological_decisions:
- issue: የተላኩት ሰዎች ከፈሪሳውያን ጋር ያላቸው ግንኙነት
  choice: «ከፈሪሳውያን» በማለት የልዑካኑን ምንጭ ወይም መነሻ ማሳየት
  alternative: «በፈሪሳውያን ተልከው» በማለት ፈሪሳውያንን እንደ ቀጥተኛ አድራጊዎች ማጉላት
  rationale: ἐκ ከዘርፍ ተሳቢ ጋር በዋናነት ምንጭን ወይም መነሻን ያመለክታል። አውዱ ፈሪሳውያን ልከዋቸው ሊሆን እንደሚችል ቢያሳይም፣ ዋናው ጽሑፍ የግሪኩን አገላለጽ ከሚፈቅደው በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የተላኩት» የሚለው በቀዳሚው አውድ የተጠቀሱትን ሰዎች በተፈጥሯዊ ሁኔታ ያመለክታል።
