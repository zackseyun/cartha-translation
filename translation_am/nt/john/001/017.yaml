  terminology: ‘ሕጉ,’ ‘ጸጋ,’ and ‘እውነት’ are appropriate. Rendering Χριστός as ‘መሲሑ’ preserves its title sense. The traditional ‘ክርስቶስ’ alternative is suitably retained in a footnote.
