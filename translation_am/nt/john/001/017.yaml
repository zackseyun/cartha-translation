  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: am
  text: ምክንያቱም ሕጉ በሙሴ በኩል ተሰጠ፤ ጸጋና እውነት በኢየሱስ መሲሑ[a] በኩል መጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በተለመደው አጠራር፣ “በኢየሱስ ክርስቶስ በኩል”።
    reason: Χριστός የሚለውን ቃል በተለመደው የአማርኛ ቤተ ክርስቲያን አጠራር ያቀርባል።
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቀዳሚውን ንግግር የሚያብራራውን ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὁ νόμος
  choice: ሕጉ
  rationale: ከሙሴ ጋር የተያያዘውን የታወቀ ሕግ ያመለክታል፤ የአማርኛው ድርብ መለያ ‘-ው’ የግሪኩን የተወሰነነት ያሳያል።
- source_word: διὰ Μωϋσέως
  choice: በሙሴ በኩል
  rationale: διά ከዘር ቅጽ ጋር የሚያሳየውን መካከለኛ ወኪልነት ይጠብቃል፤ ከኢየሱስ ጋር ያለውንም ትይዩነት ያቆያል።
- source_word: ἐδόθη
  choice: ተሰጠ
  rationale: የግሪኩን ተገብሮ የተፈጸመ ግስ ቀጥታና ያለ ትርጓሜ ጭማሪ ይተረጉማል።
- source_word: ἡ χάρις καὶ ἡ ἀλήθεια
  choice: ጸጋና እውነት
  rationale: በዮሐንስ 1፥14 ያለውን ቃላዊ ትስስርና የሁለቱን ሐሳቦች ልዩነት ይጠብቃል።
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: በመሲሑ ኢየሱስ በኩል
  rationale: Χριστόςን ትርጉሙን በሚገልጥ ‘መሲሕ’ ተርጉሞ፣ Ἰησοῦን እንደ ስም ይጠብቃል፤ ‘በኩል’ የመካከለኛ ወኪልነትን ያሳያል።
- source_word: ἐγένετο
  choice: መጡ
  rationale: በዚህ አውድ ጸጋና እውነት በታሪክ ውስጥ መምጣታቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ሆኑ’ ሊያስከትል የሚችለውን የመለወጥ ግንዛቤ ያስወግዳል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ተለመደ የስም ክፍል መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός በመሠረቱ ‘የተቀባው/መሲሕ’ የሚል ማዕረግ ነው። ‘መሲሑ’ የማዕረጉን ትርጉም ለዘመናዊ አንባቢ ያሳያል፤ በቤተ ክርስቲያን ቋንቋ የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- issue: በἐδόθη እና ἐγένετο መካከል ያለው ንጽጽር
  choice: ‘ተሰጠ’ እና ‘መጡ’ በሚሉ የተለያዩ ግሶች መግለጽ
  alternative: ሁለቱንም በአንድ ዓይነት ግስ ማቀራረብ
  rationale: ጽሑፉ ሕጉን እንደ ተሰጠ ሲገልጥ፣ ጸጋና እውነትን ግን በኢየሱስ በኩል እንደ መጡ ይናገራል። ይህን ልዩነት ሳይጨምርም ሳይደመስስም ጠብቀናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። ከፊል ኮሎኑ የሁለቱን ትይዩ ሐረጎች ግንኙነትና ንጽጽር ያሳያል፤ በግሪኩ የሌለ ‘ግን’ አልተጨመረም።
