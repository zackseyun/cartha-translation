lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: መለሰላቸው
  rationale: የግሪኩን መልስ መስጠት ትርጉም በተፈጥሯዊና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: ተከትሎ የሚመጣውን የዮሐንስ ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: βαπτίζω
  choice: አጠምቃለሁ
  rationale: በዚህ ዐውድ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል፤ የአፈጻጸሙን ዘዴ ከጽሑፉ በላይ አይወስንም።
- source_word: ἐν ὕδατι
  choice: በውኃ
  rationale: ἐν የሚያመለክተውን የውኃ መካከለኛነት ወይም ስፍራ አሻሚነት በተፈጥሯዊ አማርኛ ሳይገድብ ያቀርባል።
- source_word: μέσος ὑμῶν
  choice: በመካከላችሁ
  rationale: በቡድኑ መካከል መገኘቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἕστηκεν
  choice: ቆሟል
  rationale: የግሪኩን ፍጹም ጊዜ የአሁን ሁኔታ ኃይል—ቆሞ መኖርን—በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: እናንተ የማታውቁት አንዱ
  rationale: οἶδαን ‘ማወቅ’ ብሎ በመተርጎም ‘አታውቁትም’ እና ‘አታስተውሉትም’ መካከል ያለውን የዐውዱን ስፋት አያጠብም።
- source_word: ὁ Ἰωάννης
  choice: ዮሐንስ
  rationale: ግሪኩ የሚሰጠውን ስም ብቻ ያቀርባል፤ ‘መጥምቁ’ የሚል ተጨማሪ መጠሪያ አያክልም።
theological_decisions:
- issue: በመካከላቸው የቆመው ያልተጠቀሰው ሰው ማንነት
  choice: አንዱ
