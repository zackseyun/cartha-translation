  text: ዮሐንስም እንዲህ ሲል መለሰላቸው፦ “እኔ በውኃ አጠምቃለሁ፤ እናንተ የማታውቁት አንድ ሰው በመካከላችሁ[a] ቆሞ አለ።”
  philosophy: optimal-equivalence
  footnotes:
