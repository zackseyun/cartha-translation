- source_word: σαρκὸς
  choice: ሥጋ
  rationale: እዚህ ቃሉ የሰውን ተፈጥሯዊ የመውለድ ፍላጎት ወይም ሥጋዊ ምንጭ ያመለክታል፤ «ሥጋ» የምንጩን ምስላዊና ቃላዊ ጥንካሬ ይጠብቃል።
- source_word: ἀνδρὸς
