  rationale: ἀνήρ በዚህ አውድ በመውለድ ውስጥ ያለውን የወንድ ሰው ሚና በተለይ የሚያመለክት ይመስላል፤ «ወንድ» ይህን ልዩነት ከጠቅላላው «ሰው» ይልቅ ይጠብቃል።
- source_word: ἐκ θεοῦ
  choice: ከእግዚአብሔር
  rationale: ἐκ የምንጭንና የመነሻን ሐሳብ ይገልጣል፤ «ከእግዚአብሔር» ከቀደሙት ሦስት የተከለከሉ የሰው ምንጮች ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ἐγεννήθησαν
