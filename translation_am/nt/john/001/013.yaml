theological_decisions:
- issue: በሰዋዊ ምንጭና በመለኮታዊ ምንጭ መካከል ያለው ንጽጽር
  choice: ጥቅሱ የእነዚህ ሰዎች መወለድ ከተፈጥሯዊ የሰው ዘር፣ ከሥጋዊ ፍላጎት ወይም ከወንድ ፈቃድ ሳይሆን ከእግዚአብሔር መሆኑን ይናገራል።
  alternative: አንዳንዶች ይህን በብሔራዊ ወይም በዘር ሐረግ ላይ ብቻ እንደሚያተኩር ሊያነቡት ይችላሉ፤ ሌሎች ደግሞ በኋለኛ ሥነ መለኮታዊ ወጎች መሠረት ምሥጢራዊ ወይም ህላዌያዊ ፍቺ ሊሰጡት ይችላሉ።
  rationale: ሦስቱ አሉታዊ ሐረጎች ተራውን የሰው መወለድ ከእግዚአብሔር ከሆነው መወለድ ጋር ያነጻጽራሉ። ትርጉሙ ይህን ንጽጽር ይጠብቃል እንጂ ጽሑፉ በግልጽ ያልወሰነውን የአንድ ወገን ልዩ ትምህርት አያስገባም።
