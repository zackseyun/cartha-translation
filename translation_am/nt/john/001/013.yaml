lexical_decisions:
- source_word: οἳ
  choice: እነርሱም
  rationale: የግሪኩ አንጻራዊ ተውላጠ ስም በቀደመው ቁጥር የተጠቀሱትን ሰዎች ያመለክታል፤ «እነርሱም» ይህን ትስስር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐξ αἱμάτων
  choice: ከደሞች
  rationale: αἱμάτων ብዙ ቁጥር ሆኖ የተፈጥሮ ዘር ወይም የሰው ወላጅነትን የሚያመለክት ያልተለመደ አገላለጽ ነው። ያልተለመደውን ቅርጽ በዋናው ጽሑፍ ጠብቆ ፍቺውን በእግር ማስታወሻ ማብራራት ተመርጧል።
- source_word: θελήματος
  choice: ፈቃድ
