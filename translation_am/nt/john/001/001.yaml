id: JHN.1.1
reference: John 1:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: am
  text: በመጀመሪያ[a] ቃሉ ነበረ፤ ቃሉም ከእግዚአብሔር ጋር ነበረ፤ ቃሉም እግዚአብሔር ነበረ።[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: «በመጀመሪያ» የሚለው አነጋገር ዘፍጥረት 1፥1ን ያስተጋባል፤ ቃሉንም ከፍጥረት መጀመሪያ ጋር ያገናኘዋል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ «ቃሉም መለኮታዊ ነበረ» ወይም «እግዚአብሔር በባሕርዩ የሆነው ቃሉም ነበረ።» የግሪኩ አጻጻፍ በመጨረሻው ሐረግ «እግዚአብሔር» የሚለውን በባሕርይ አኳያ ያቀርባል፤ የቃሉን ሙሉ መለኮት ሲያረጋግጥ፣ ቃሉን በቀደመው ሐረግ ከተጠቀሰው «እግዚአብሔር» ይለያል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: በመጀመሪያ
  rationale: የዘፍጥረት 1፥1ን አነጋገር ያስተጋባል፤ በዘመናዊ አማርኛም ተፈጥሯዊና ግልጽ ነው።
- source_word: ἦν
  choice: ነበረ
  rationale: የግሪኩን ያለፈ ጊዜ ቀጣይ ሁኔታ በቀላል አማርኛ ይገልጻል፤ በሦስቱም ሐረጎች ያለውን ድግግሞሽም ይጠብቃል።
- source_word: ὁ λόγος
  choice: ቃሉ
  rationale: λόγος በዚህ ክፍል የግል ማንነትን የሚያመለክት ስያሜ ሆኖ ቢሠራም፣ የንግግርና የመገለጥ ገጽታውን ሳያጠፋ በአማርኛ በተፈጥሮ የሚያስተላልፈው «ቃሉ» ነው።
- source_word: πρὸς τὸν θεόν
  choice: ከእግዚአብሔር ጋር
  rationale: πρός በዚህ አውድ የቅርበትና የግንኙነት ሐሳብ አለው፤ «ከ…ጋር» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸν θεόν
  choice: እግዚአብሔር
  rationale: የታወቀውንና የተወሰነውን አምላክ በአማርኛ መጽሐፍ ቅዱሳዊ ልማድ የሚገልጽ የተለመደ ስያሜ ነው።
- source_word: θεὸς ἦν ὁ λόγος
  choice: ቃሉም እግዚአብሔር ነበረ
  rationale: የግሪኩን የቃላት ግንኙነትና ጠንካራ ማረጋገጫ ይጠብቃል። አንቀጽ አልባው θεός በዋናነት የባሕርይ ኃይል አለው፤ ቃሉ የእግዚአብሔርን ሙሉ ባሕርይ እንዳለው ያረጋግጣል፣ ነገር ግን ቃሉን በቀደመው ሐረግ ከተጠቀሰው እግዚአብሔር ጋር በአካል አያዋሕድም።
theological_decisions:
- issue: በመጨረሻው ሐረግ አንቀጽ የሌለውን θεός መተርጎም
  choice: ቃሉም እግዚአብሔር ነበረ
  alternative: ቃሉም መለኮታዊ ነበረ፤ ወይም፣ እግዚአብሔር በባሕርዩ የሆነውን ቃሉም ነበረ
  rationale: ቀጥተኛው አተረጓጎም የግሪኩን ጠንካራ አረጋጋጭ ኃይል ይጠብቃል። በአንድ በኩል የቃሉን ሙሉ መለኮት ያረጋግጣል፤ በሌላ በኩል «ከእግዚአብሔር ጋር» የሚለው ቀዳሚ ሐረግ የማንነት ልዩነቱን ይጠብቃል። የባሕርይ ገጽታው በማስታወሻ ተገልጿል እንጂ በዋናው ጽሑፍ በትርጓሜ አልተተካም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሦስት ተመጣጣኝ ሐረጎችና «ነበረ» የሚለው ድግግሞሽ ተጠብቀዋል። የግጥም ፍሰቱን ለማሳየት ከፊል ነጥብ ተጠቅሟል።
