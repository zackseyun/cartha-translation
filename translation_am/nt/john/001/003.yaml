  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: am
  text: ሁሉም ነገር በእርሱ በኩል ወደ ሕልውና መጣ፤ ከእርሱም ውጭ ወደ ሕልውና የመጣ አንድም ነገር እንኳ ወደ ሕልውና አልመጣም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም የመጨረሻውን ሐረግ ከቁጥር 4 ጋር በማያያዝ፦ «ወደ ሕልውና የመጣው በእርሱ ሕይወት ነበር።»
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ሁሉም ነገር
  rationale: ገለልተኛ ብዙ ቁጥሩ የፍጥረትን አጠቃላይ ወሰን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና ሁሉን አቀፍ ነው።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ በኩል
  rationale: διά ከዘር አገናዛቢ ጋር መካከለኛ ወኪልነትን ወይም መሣሪያነትን ያሳያል፤ «በእርሱ በኩል» ይህን ግንኙነት በግልጽ ይጠብቃል።
- source_word: ἐγένετο
  choice: ወደ መኖር መጣ
  rationale: ግሱ ከሌለበት ወደ ሕልውና መምጣትን ያመለክታል፤ «ተፈጠረ» የሚለውን ሊያጠብ የሚችል የመሥራት ትርጉም ሳያስገባ የሕልውናውን ሐሳብ ይጠብቃል።
- source_word: χωρὶς αὐτοῦ
  choice: ከእርሱ ውጭ
  rationale: χωρίς መለየትንና ያለ አንድ አካል መሆንን ያሳያል፤ ይህ ቀጥተኛና ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: οὐδὲ ἕν
  choice: አንድም ነገር እንኳ ... አልመጣም
  rationale: οὐδέ እና ἕν የሚሰጡትን አጽንዖትና ፍጹም አሉታዊነት «አንድም ... እንኳ» በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὃ γέγονεν
  choice: ወደ መኖር ከመጣው
  rationale: በቀረበው ሥርዓተ ነጥብ መሠረት አንቀጹ ከቁጥር 3 ጋር ተያይዟል፤ የፍጹም ጊዜውን የተፈጸመና ውጤቱ የቀጠለ ድርጊት ሐሳብ በአውዱ ውስጥ ይጠብቃል።
theological_decisions:
- issue: ὃ γέγονεν የሚለው የመጨረሻ አንቀጽ ከየትኛው ቁጥር ጋር እንደሚያያዝ
  choice: ከቁጥር 3 ጋር በማያያዝ፣ «ወደ መኖር ከመጣው አንድም ነገር እንኳ ወደ መኖር አልመጣም»
  alternative: ከቁጥር 4 መጀመሪያ ጋር በማያያዝ፣ «ወደ መኖር የመጣው በእርሱ ሕይወት ነበረ»
  rationale: የጥንቶቹ የግሪክ ቅጂዎች የመጀመሪያ ሥርዓተ ነጥብ ስላልነበራቸው ሁለቱም አያያዞች በሰዋስው ይቻላሉ። ዋናው ጽሑፍ የቀረበውን SBLGNT ሥርዓተ ነጥብ ይከተላል፤ እውነተኛው አሻሚነት ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ወደ መኖር መጣ» የሚለው ትንሽ ከፍ ያለ አገላለጽ የመቅድሙን ክብር እና γίνομαι የሚያሳየውን ወደ ሕልውና የመምጣት ሐሳብ ይጠብቃል።
