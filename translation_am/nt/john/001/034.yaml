language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: am
  text: እኔም አይቻለሁ፤ ይህ የእግዚአብሔር የተመረጠው ነው[a] ብዬ መስክሬአለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች «የእግዚአብሔር የተመረጠው» በሚለው ፈንታ «የእግዚአብሔር ልጅ» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: እኔም
  rationale: καί + ἐγώ ያለውን የቀጣይነትና የአጽንዖት ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἑώρακα
  choice: አይቻለሁ
  rationale: የግሪኩን ፍጹም ጊዜ፣ ያለፈው ማየት አሁንም የሚጸና ውጤት እንዳለው፣ በተፈጥሯዊ የአማርኛ ፍጹም አቀራረብ ይገልጣል።
- source_word: μεμαρτύρηκα
  choice: መስክሬአለሁ
  rationale: የተፈጸመው ምስክርነት ቀጣይ  validity እንዳለው የሚያሳየውን ፍጹም ጊዜ ይጠብቃል።
- source_word: ὅτι
  choice: ብዬ
  rationale: ὅτι እዚህ የምስክርነቱን ይዘት ያስገባል፤ በአማርኛ ቀጥተኛና ተፈጥሯዊ የይዘት አገናኝ ነው።
- source_word: οὗτός
  choice: ይህ
  rationale: ወደ ኢየሱስ በቀጥታ የሚያመለክተውን የግሪክ አመልካች ቃል ይጠብቃል።
- source_word: ἐκλεκτός
  choice: የተመረጠው
  rationale: ከመስተዋድዱ ጋር በስም ተግባር የቀረበውን ቅጽ በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን የባለቤትነት/ግንኙነት ገላጭ ቅርጽ በተለመደው የአማርኛ የ- አወቃቀር ይወክላል።
theological_decisions:
- issue: በዮሐንስ 1፥34 ያለው ክርስቶሳዊ ማዕረግ
  choice: የእግዚአብሔር የተመረጠው
  alternative: የእግዚአብሔር ልጅ
  rationale: የቀረበው SBLGNT ጽሑፍ ὁ ἐκλεκτὸς τοῦ θεοῦ ይላል፤ ስለዚህ ዋናው ጽሑፍ ይህንኑ ይተረጉማል። ትርጉሙን ወደ ተለመደው ሌላ የንባብ ልዩነት ሳያስማማ፣ ጉልህ የሆነውን «የእግዚአብሔር ልጅ» ንባብ በግርጌ ማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ሁለቱ የግሪክ ፍጹም ግሶች በ«አይቻለሁ» እና «መስክሬአለሁ» ተጠብቀዋል፤ ፍቺው ተፈጥሯዊ እንዲሆን የምስክርነቱ ይዘት ከግሱ በፊት ቀርቧል።
