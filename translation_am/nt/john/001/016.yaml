id: JHN.1.16
reference: John 1:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: am
  text: ምክንያቱም ሁላችንም ከሙላቱ ተቀብለናል፤ ጸጋንም በጸጋ ፈንታ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጸጋ በጸጋ ላይ» ወይም «አንዱን ጸጋ ተከትሎ ሌላ ጸጋ»። የግሪኩ ሐረግ አንዱ ስጦታ ሌላውን ሲከተል ተከታታይ ጸጋን ሊያመለክት ይችላል፤ ἀντί ግን በቀጥታ «በፈንታ» ማለት ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: -ና
  rationale: በአማርኛ ከግስ ጋር የሚጣበቀው «-ና» በዚህ አውድ የግሪኩን ምክንያታዊና ማብራሪያዊ ኃይል በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: ከእርሱ ሙላት
  rationale: «ሙላት» የπλήρωμαን ሙሉነትና በእርሱ ያለውን ብዛት ይጠብቃል፤ «ከ» ደግሞ የተቀበሉት ከዚያ ምንጭ መሆኑን ያሳያል።
- source_word: ἡμεῖς πάντες
  choice: ሁላችንም
  rationale: ግልጽ ተውላጠ ስምና πάντες የሚሰጡትን አጽንዖት «ሁላችንም» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐλάβομεν
  choice: ተቀብለናል
  rationale: የተፈጸመው መቀበል አሁን ያለውን ውጤት ስለሚያመለክት፣ የአማርኛው ፍጹም ጊዜ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: καὶ
  choice: -ም
  rationale: «-ም» ሁለተኛውን ሐረግ ከመጀመሪያው ጋር በአማርኛ ተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: χάριν ἀντὶ χάριτος
  choice: ጸጋንም በጸጋ ፈንታ
  rationale: «በ…ፈንታ» የἀντίን መሠረታዊ «በምትክ/በፈንታ» ኃይል ይጠብቃል፤ በተከታታይ የሚመጣ ጸጋ የሚለውን አማራጭ ትርጉም ግን በማስታወሻ ይገልጻል።
theological_decisions:
- issue: የχάριν ἀντὶ χάριτος ትርጓሜ
  choice: ጸጋንም በጸጋ ፈንታ
  alternative: ጸጋ በጸጋ ላይ፤ አንዱን ጸጋ ተከትሎ ሌላ ጸጋ
  rationale: ሐረጉ አንዱ ጸጋ ሌላውን መተካቱን ወይም ጸጋ በተከታታይ መሰጠቱን ሊያመለክት ይችላል። ዋናው ጽሑፍ የἀντίን ቀጥተኛ ኃይል በመጠበቅ ይህን እውነተኛ አሻሚነትና ሥነ መለኮታዊ ውጥረት አይደመድምም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጸጋ» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ሐረጉ በግሪኩ ያለውን አሻሚነት ሆን ብሎ አልፈታም።
