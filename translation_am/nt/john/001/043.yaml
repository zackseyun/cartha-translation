- source_word: εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ
  rationale: ‘ወደ’ በአማርኛ ወደ መድረሻ የሚደረግን እንቅስቃሴ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: εὑρίσκει
  choice: አግኝቶ
  rationale: ከሚከተለው ‘አለው’ ጋር ተያይዞ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ የግሪኩ ታሪካዊ የአሁን ጊዜ በማስታወሻ ተገልጿል።
- source_word: λέγει αὐτῷ
