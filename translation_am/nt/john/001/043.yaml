  rationale: ቃሉ በአማርኛ ሁለቱንም—ከኢየሱስ ጋር መሄድንና ደቀ መዝሙሩ መሆንን—ሊያመለክት ስለሚችል የምንጩን ትርጉማዊ ስፋት ይጠብቃል።
- source_word: Φίλιππον
  choice: ፊልጶስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠቀማል፤ ‘-ን’ የቀጥተኛ ተሳቢነቱን ያሳያል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
