  choice: «ነበረ» እና «ሆነ» የሚሉትን የተለያዩ ግሶች በማቆየት «ዓለምም በእርሱ ሆነ» ተብሏል።
  alternative: «ዓለም በእርሱ ተፈጠረ» ብሎ መተርጎም።
  rationale: ጽሑፉ በἦν እና ἐγένετο መካከል ያደረገውን ልዩነት ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የኋለኛ ዘመን ቃላትንም አያክልም።
