lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: ዓለም
  rationale: ቃሉ በቁጥሩ ውስጥ ሦስት ጊዜ የተደገመ ሲሆን፣ «ዓለም» የተፈጠረውን ሥርዓት፣ የሰው ዘርንና ከእርሱ የራቀውን ዓለም ሊያመለክት የሚችለውን የዮሐንስን ሰፊ የትርጉም ክልል ይጠብቃል።
- source_word: ἦν
  choice: ነበረ
  rationale: ያለፈውን ቀጣይ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል፤ ከἐγένετο ጋር ያለውን የ«ነበረ» እና የ«ሆነ» ልዩነትም ያቆያል።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ
  rationale: διά ከዘር አገባብ ጋር የመካከለኛ ወኪልነትን ወይም መሣሪያነትን ይገልጣል። «በእርሱ» በአማርኛ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: «ሆነ» ወደ መኖር መምጣትን የሚገልጸውን መሠረታዊ ኃይል ይጠብቃል፣ ከ«ነበረ»ም ይለያል። «ተፈጠረ» የሚለው ግልጽ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἔγνω
  choice: አላወቀውም
  rationale: የግሪኩን «አወቀ» የሚለውን ቀጥተኛ ትርጉም ይጠብቃል፤ በዐውዱ ያሉትን የመለየትና የመቀበል ፍችዎች ሳይዘጋ ይተዋቸዋል።
- source_word: αὐτόν / αὐτοῦ
  choice: እርሱን / በእርሱ
  rationale: ተውላጠ ስሞቹ በቀደመው ዐውድ ወደተጠቀሰው ቃል (ሎጎስ) ይመለሳሉ፤ ግላዊ ማጣቀሻውንም ይጠብቃሉ።
theological_decisions:
