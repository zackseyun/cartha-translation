  edition: SBLGNT
  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: am
  text: ከእኔ በኋላ የሚመጣው፣ የጫማውን ማሰሪያ ለመፍታት የማይገባኝ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: ከእኔ በኋላ የሚመጣው
  rationale: በግስ አገባብ የቀረበውን የተወሰነ ሰው ያመለክታል፤ «ከእኔ በኋላ» ደግሞ ከቦታ ይልቅ በቅደም ተከተል መምጣቱን ሳይጨምር ይጠብቃል።
- source_word: οὗ
  choice: የጫማውን
  rationale: የግሪኩ የባለቤትነት ዝምድና በአማርኛ በተፈጥሯዊው የ- አወቃቀር ተገልጿል።
- source_word: οὐκ εἰμὶ ἄξιος
  choice: የማይገባኝ ነው
  rationale: የዮሐንስን ትሕትና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ብቁ አለመሆንን ወይም የተገባ አለመሆንን የሚያካትተውን ἄξιος አያጠብም።
- source_word: ἵνα λύσω
  choice: ለመፍታት
  rationale: ከብቁነት መግለጫ በኋላ ያለውን የታሰበ ድርጊት በአማርኛ ተፈጥሯዊ በሆነ የዓላማ አገባብ ያቀርባል።
- source_word: ἱμάντα
  choice: ማሰሪያ
  rationale: በዚህ የጫማ አውድ ἱμάς የጫማ ማሰሪያን ያመለክታል፤ «ማሰሪያ» ግልጽና ዘመናዊ ነው።
- source_word: τοῦ ὑποδήματος
  choice: ጫማ
  rationale: ὑπόδημα ጫማ ወይም ሰንደል ሊያመለክት ይችላል፤ «ጫማ» በዘመናዊ አማርኛ ለአንባቢው ቀጥተኛና ግልጽ ሲሆን ማሰሪያ የነበረውን ጥንታዊ ጫማ አያስቀርም።
theological_decisions:
- issue: «ከእኔ በኋላ» ከሚመጣው ጋር ያለው ዝምድና
  choice: በጊዜና በተከታታይነት፦ «ከእኔ በኋላ የሚመጣው»
  alternative: ከእኔ በስተኋላ የሚመጣው
  rationale: ንግግሩ በአገልግሎት ቅደም ተከተል ዮሐንስን ተከትሎ የሚመጣውን ያመለክታል፤ በአቅራቢያው ያሉ ቁጥሮችን ሙሉ ሥነ መለኮታዊ ይዘት በዚህ አገላለጽ ላይ ሳይጭን የጽሑፉን ውጥረት ይጠብቃል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «እንኳ» በዋናው ግሪክ ውስጥ በቃል የሌለ ቢሆንም፣ በአማርኛ የዝቅተኛውን የአገልጋይ ተግባር እንኳ ለመፈጸም የማይገባው መሆኑን ተፈጥሯዊ በሆነ አጽንዖት ያሳያል።
