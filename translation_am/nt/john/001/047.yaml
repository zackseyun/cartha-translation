id: JHN.1.47
reference: John 1:47
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: am
  text: ኢየሱስም ናትናኤል ወደ እሱ ሲመጣ አይቶ ስለ እሱ፣ “እነሆ፣ በእውነት ማታለል የሌለበት እስራኤላዊ!” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: እነሆ
  rationale: የተናጋሪውን ትኩረት ወደ ናትናኤል የሚጠራውን የግሪክ ቃል በተፈጥሯዊና ክቡር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: በእውነት ... እስራኤላዊ
  rationale: ἀληθῶς ለἸσραηλίτης የሚሰጠውን አጽንዖት ሳያጠብ ቀጥተኛውን ትርጉም ይጠብቃል።
- source_word: δόλος
  choice: ማታለል
  rationale: ቃሉ የሚያመለክተውን ተንኮል፣ ሸፍጥ ወይም በማታለል የሚፈጸም ማጭበርበር በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν ᾧ ... οὐκ ἔστιν
  choice: '... የሌለበት'
  rationale: የግሪኩን ‘በእርሱ ውስጥ የለም’ የሚለውን መዋቅር ተፈጥሯዊ በሆነ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
theological_decisions:
- issue: ‘በእውነት እስራኤላዊ’ የሚለው ሐረግ ወሰን
  choice: ቃሉን በቀጥታ ማቆየት
  alternative: ‘እውነተኛ እስራኤላዊ’ ብሎ መተርጎም
  rationale: ‘እውነተኛ’ የሚለው አማራጭ ስለ እስራኤላዊነት ማንነት የበለጠ ትርጓሜያዊ ጭነት ሊጨምር ይችላል፤ ‘በእውነት’ ግን የግሪኩን አሻሚነትና አጽንዖት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትረካው የአሁን ጊዜ λέγει በአማርኛ የተፈጥሯዊ ትረካ ቅደም ተከተል ‘አለ’ ተብሎ ቀርቧል።
