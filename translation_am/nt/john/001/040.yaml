  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: am
  text: ከዮሐንስ ሰምተው እርሱን ከተከተሉት ሁለቱ አንዱ፣ የስምዖን ጴጥሮስ ወንድም እንድርያስ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እርሱን” የሚለው በአውዱ ኢየሱስን ያመለክታል።
    reason: የተውላጠ ስሙን ተመላሽ ለአንባቢው ማብራራት፣ በዋናው ጽሑፍ ግን የግሪኩን አገላለጽ መጠበቅ።
lexical_decisions:
- source_word: ἦν
  choice: ነበር
  rationale: ያለፈ ጊዜን የሚገልጽ ቀላል አያያዥ ግስ ሆኖ እንድርያስን ከሁለቱ አንዱ እንደሆነ ይለያል።
- source_word: Ἀνδρέας
  choice: እንድርያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን አጻጻፍ ይከተላል።
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: የስምዖን ጴጥሮስ ወንድም
  rationale: የዘመድነቱን ቀጥተኛ ትርጉምና የስምዖንን ሁለቱንም መጠሪያዎች ይጠብቃል።
- source_word: εἷς ἐκ τῶν δύο
  choice: ከሁለቱ አንዱ
  rationale: የክፍል አመልካቹን አገላለጽ በተፈጥሯዊና ትክክለኛ አማርኛ ያቀርባል።
- source_word: τῶν ἀκουσάντων
  choice: ሰምተው
  rationale: መስማቱ መከተሉን እንደቀደመ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
- source_word: παρὰ Ἰωάννου
  choice: ከዮሐንስ
  rationale: παρά ከወገን መስማትን እንደሚገልጽ በቀጥታ ያስተላልፋል፤ ‘መጥምቁ’ የሚል በግሪኩ የሌለ መለያ አይጨምርም።
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: እርሱን ከተከተሉት
  rationale: ἀκολουθέωን ‘ተከተሉ’ ብሎ በቀጥታ ይተረጉማል፤ የተውላጠ ስሙንም ግልጽ ስም ሳይተካ ይጠብቃል።
theological_decisions:
- issue: የαὐτῷ ተውላጠ ስም ተመላሽ
  choice: በዋናው ጽሑፍ ‘እርሱን’ ተብሎ ተጠብቋል፤ በአውዱ ኢየሱስን ያመለክታል
  alternative: ተመላሹን በዋናው ጽሑፍ ‘ኢየሱስን’ ብሎ በግልጽ መጻፍ፣ ወይም ዮሐንስን እንደሚያመለክት መውሰድ
  rationale: ዮሐንስ 1፥35-39 ያለው የትረካ ፍሰት ሁለቱ የዮሐንስን ቃል ሰምተው ኢየሱስን እንደተከተሉ ያሳያል። ሆኖም ግሪኩ ስሙን ሳይደግም ተውላጠ ስም ስለሚጠቀም፣ ዋናው ትርጉምም ያንኑ ቅርጽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተፈጥሮ ፍሰት ያለውና ክብር የተሞላበት መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አንጻራዊ ሐረግ በአማርኛ ተፈጥሯዊ ቅደም ተከተል ቀርቧል።
