source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: am
  text: ናትናኤልም፣ “እንዴት ታውቀኛለህ?[a]” አለው። ኢየሱስም መልሶ፣ “ፊልጶስ ከመጥራቱ በፊት፣ ከበለስ ዛፉ በታች ሳለህ አየሁህ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ “ከየት ታውቀኛለህ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: እንዴት
  rationale: ቃሉ በቀጥታ ‘ከየት’ ማለት ቢሆንም፣ ከ γινώσκεις ጋር በዚህ አገባብ ኢየሱስ ናትናኤልን የሚያውቅበትን መንገድ ወይም ምንጭ ይጠይቃል። ‘እንዴት’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው፤ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: γινώσκεις
  choice: ታውቀኛለህ
  rationale: በዚህ አውድ ስለ ግለሰቡ ማወቅን የሚገልጽ ቀጥተኛና ተፈጥሯዊ አማርኛ ነው።
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: መልሶ ... አለው
  rationale: የሁለቱንም የግሪክ ግሶች የመልስና የንግግር ኃይል በተፈጥሯዊ የአማርኛ የትረካ አገላለጽ ይጠብቃል።
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: ፊልጶስ ከመጥራቱ በፊት
  rationale: ድርጊቱ ከፊልጶስ ጥሪ ቀድሞ መሆኑን ግልጽና ተፈጥሯዊ በሆነ መንገድ ያሳያል። የተሳቢው ተውላጠ ስም በአማርኛው ግስ እና በአውዱ ውስጥ በቂ ስለሆነ በተናጠል አልተደገመም።
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: ከበለስ ዛፍ በታች ሳለህ
  rationale: ተሳቢ አንቀጹ የናትናኤልን በዚያ ስፍራ መኖር እንደ አብሮ የሆነ ሁኔታ ያቀርባል፤ ‘ሳለህ’ ይህን ጊዜያዊና ሁኔታዊ ኃይል በአጭሩ ይገልጻል።
- source_word: εἶδόν σε
  choice: አየሁህ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ በቀጥታ ይተረጉማል፤ የድርጊቶቹ ቅደም ተከተል ‘ከመጥራቱ በፊት’ በሚለው ሐረግ በቂ ሁኔታ ተገልጿል።
- source_word: συκῆν
  choice: በለስ ዛፍ
  rationale: የዛፉን ዓይነት በዘመናዊ አማርኛ ግልጽ የሚያደርግ መደበኛ ቃል ነው።
theological_decisions:
- issue: ኢየሱስ ናትናኤልን ያወቀበትና ያየበት ሁኔታ
  choice: ንግግሩን ምንም ተጨማሪ ማብራሪያ ሳይጨመርበት ቀጥተኛ ማድረግ
  alternative: ይህን በግልጽ እንደ ተአምራዊ ቅድመ እውቀት መግለጽ፣ ወይም እንደ ተራ ቀደምት ምልከታ ማቅረብ
  rationale: ጥቅሱ ኢየሱስ ቀድሞ እንዳየው ይናገራል እንጂ እንዴት እንዳየው አይገልጽም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረትና አሻሚነት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። ‘መልሶ ... አለው’ የዮሐንስን የንግግር ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል።
