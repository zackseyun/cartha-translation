base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: am
  text: 'ቃሉም ሥጋ ሆነ፤ በመካከላችንም ኖረ[a]። ክብሩንም አየን፤ ይህም ከአብ የመጣ የአንድያ ልጅ እንደሚኖረው ያለ ክብር ነበር[b]፤ እርሱም ጸጋና እውነት የተሞላ ነበር።


    [a] ወይም፣ “በመካከላችን ድንኳን ተከለ።” ግሱ የድንኳንና የማደሪያ ምስልን ያስታውሳል።


    [b] “የአንድያ ልጅ” የሚለው “አንድያ የተወለደው ልጅ” ወይም “ልዩ ልጅ” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመካከላችን ድንኳን ተከለ።” ግሱ የድንኳንና የማደሪያ ምስልን ያስታውሳል።
    reason: lexical_alternative
  - marker: b
    text: “የአንድያ ልጅ” የሚለው “አንድያ የተወለደው ልጅ” ወይም “ልዩ ልጅ” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: ቃሉ
  rationale: በዮሐንስ መቅድም የግል መጠሪያ የሆነውንና ሰፊ መጽሐፍ ቅዱሳዊ ይዘት ያለውን ቃል በተለመደው አማርኛ ይጠብቃል።
- source_word: σὰρξ ἐγένετο
  choice: ሥጋ ሆነ
  rationale: ትርጉሙን ሳያለዝብ እውነተኛ ሰብአዊና ሥጋዊ ሕልውናን ያሳያል፤ የግሪኩን የለውጥ አገላለጽም ይጠብቃል።
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: በመካከላችንም ኖረ
  rationale: ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው፤ የድንኳንና የማደሪያ ፍንጩ በእግር ማስታወሻ ተጠብቋል።
- source_word: ἐθεασάμεθα τὴν δόξαν αὐτοῦ
  choice: እኛም ክብሩን አየን
  rationale: የቀጥታ ምስክርነትን በቀላልና በክቡር ዘመናዊ አማርኛ ያቀርባል።
- source_word: δόξαν ὡς μονογενοῦς παρὰ πατρός
  choice: ከአብ የመጣው የአንድያ ልጅ ክብር
  rationale: ὡς ያለውን የባሕርይ ወይም የሚገባውን ክብር ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ μονογενής የሚያጎላውን ልዩነት በ“አንድያ” ይገልጣል።
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: ጸጋና እውነት የተሞላ
  rationale: የግሪኩን የተሟላነት አገላለጽና የተለመደውን መጽሐፍ ቅዱሳዊ ቃላት ይጠብቃል።
theological_decisions:
- issue: በክርስቶስ ማንነት አውድ μονογενοῦςን መተርጎም
  choice: የአንድያ ልጅ
  alternative: አንድያ የተወለደው ልጅ፤ ልዩ ልጅ
  rationale: ዋናው ጽሑፍ የልጁን አቻ የሌለው ልዩነት ያሳያል፤ በታሪካዊ የክርስቲያን አገላለጽ ክብደት ያለው “አንድያ የተወለደው” ግን የግሪኩ ብቸኛ አስገዳጅ ፍቺ እንዳልሆነ በእግር ማስታወሻ ቀርቧል።
- issue: በἐσκήνωσεν ውስጥ ያለውን የማደሪያ ምስል በዋናው ጽሑፍ ማጉላት ወይም አለማጉላት
  choice: በመካከላችንም ኖረ
  alternative: በመካከላችን ድንኳኑን ተከለ
  rationale: ዋናው ጽሑፍ ተፈጥሯዊና ግልጽ ሆኖ ይቆያል፤ ከእስራኤል ማደሪያ ጋር ሊኖረው የሚችለው ጥልቅ ድምፀት ግን ሳይጠፋ በማስታወሻ ተገልጧል።
- issue: πλήρης በሰዋስው የሚጠቁመው ባለቤት
  choice: እርሱም ጸጋና እውነት የተሞላ ነው
  alternative: ክብሩ ጸጋና እውነት የተሞላ ነበር
  rationale: πλήρης በወንድ ነጠላ ስለሆነ ወደ λόγος/μονογενής የሚመለሰውን የግሪክ ዕድል በግልጽ አማርኛ ያሳያል፤ ወደ δόξα እንዲመለስ አያደርገውም።
