base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አለው፦ “ከበለስ ዛፉ በታች እንዳየሁህ ስለነገርኩህ ታምናለህን?[a] ከእነዚህ የሚበልጡ ነገሮችን ታያለህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የምታምነው ከበለስ ዛፉ በታች እንዳየሁህ ስለነገርኩህ ነውን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: ኢየሱስም መልሶ፣ … አለው
  rationale: የግሪኩን የትረካ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ‘መልሶ አለው’ ሁለቱንም ግሶች ያንጸባርቃል።
- source_word: Ὅτι … ὅτι
  choice: … ስለነገርኩህ
  rationale: የመጀመሪያውን ὅτι ምክንያታዊ ኃይልና የሁለተኛውን የንግግር ይዘት በተፈጥሯዊ የአማርኛ አወቃቀር ያሳያል።
- source_word: εἶδόν σε ὑποκάτω τῆς συκῆς
  choice: ከበለስ ዛፉ በታች እንዳየሁህ
  rationale: የግሪኩን ቀጥተኛ ምስል ይጠብቃል፤ ‘የበለስ ዛፍ’ ለσυκῆ ግልጽና የተለመደ አቻ ነው።
- source_word: πιστεύεις
  choice: ታምናለህን?
  rationale: የአሁን ጊዜ አመልካች ግሱን እንደ ጥያቄ ይጠብቃል፤ ዮሐንሳዊውን የማመን ቃል በቀጥታ ያስተላልፋል።
- source_word: μείζω τούτων
  choice: ከእነዚህ የሚበልጡትን
  rationale: በስም ተግባር የዋለውን ገለልተኛ ብዙ ቁጥር ንጽጽርና τούτων ያለውን የብዙ ቁጥር ማመልከቻ ይጠብቃል።
- source_word: ὄψῃ
  choice: ታያለህ
  rationale: የወደፊት ጊዜውን በግልጽና ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የπιστεύεις ጥያቄ ኃይል
  choice: እውነተኛ ንግግራዊ ጥያቄ፦ ‘ታምናለህን?’
  alternative: እንደ መጠነኛ ወቀሳ ‘የምታምነው … ስለሆነ ነውን?’ ወይም እንደ ዓረፍተ ነገር መተርጎም
  rationale: የግሪኩ አወቃቀር ጥያቄን ይደግፋል፤ ትርጉሙም ጽሑፉ በግልጽ ያልጨመረውን ወቀሳ ሳያጠናክር ንግግራዊ ኃይሉን ይጠብቃል።
- issue: የመጀመሪያው ὅτι ከጥያቄው ጋር ያለው ትስስር
  choice: ‘ስለነገርኩህ ታምናለህን?’
  alternative: ‘የምታምነው ስለነገርኩህ ነውን?’
  rationale: ሁለቱም በግሪኩ የሚቻሉ የጥያቄ አገላለጾች ናቸው፤ ዋናው ጽሑፍ የምክንያት ኃይሉን በአጭር መልክ ይጠብቃል፣ ሰፋ ያለው አገላለጽ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘መልሶ … አለው’ የግሪኩን ትረካዊ ቀመር በተፈጥሯዊነት ያቀርባል፤ የጥያቄው አሻሚነት በማስታወሻ ተጠብቋል።
