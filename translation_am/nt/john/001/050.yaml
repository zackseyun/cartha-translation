    issue: The substantival phrase የሚበልጡትን is not explicitly limited to “things.”
    rationale: Greek μείζω is neuter plural and means “greater things.” In Amharic, the substantivized relative adjective may be understood as persons or entities generally. Adding ነገሮች preserves the source’s reference clearly.
