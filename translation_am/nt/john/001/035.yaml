  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: am
  text: በማግስቱ[a] ዮሐንስ እንደገና ቆሞ ነበር፤ ከደቀ መዛሙርቱም ሁለት ከእርሱ ጋር ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በማግስቱ ዮሐንስ እንደገና ቆሞ ነበር፤ ከደቀ መዛሙርቱም ሁለት [በዚያ ነበሩ]።”
    reason: የግሪኩ ቀላል ተያያዥ አገባብ ሁለቱን ደቀ መዛሙርት በተለየ ሐረግ ለማቅረብ ያስችላል፤ በቅንፍ ያለው ግስ በግሪኩ በግልጽ ያልተጻፈ ነው።
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: በማግስቱ
  rationale: ይህ የጊዜ አገላለጽ ‘በሚቀጥለው ቀን’ የሚለውን ፍቺ በተፈጥሯዊና አጭር ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ከቀደመው ትዕይንት ጋር ያለውን ትስስርና ድግግሞሽ በግልጽ ያሳያል።
- source_word: εἱστήκει
  choice: ቆሞ ነበር
  rationale: የዮሐንስን በዚያ ጊዜ የቀጠለ የመቆም ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል፤ በግሪኩ የሌለውን ‘በዚያ’ አይጨምርም።
- source_word: ὁ Ἰωάννης
  choice: ዮሐንስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የተለመደውን የስሙን ቅርጽ ይጠቀማል፤ ዋናው ጽሑፍ ‘ዮሐንስ’ ብቻ ስለሚል ‘መጥምቁ’ አልተጨመረም።
- source_word: καὶ
  choice: ጋር
  rationale: በአማርኛው የዮሐንስንና የሁለቱን ደቀ መዛሙርት በአንድ ትዕይንት መገኘት በተፈጥሯዊ አገባብ ያሳያል፤ ቀጥተኛው ‘እና’ ደግሞ በእግር ማስታወሻው ተጠብቋል።
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: ከደቀ መዛሙርቱ ሁለቱ
  rationale: ἐκ የሚያሳየውን ከብዙዎቹ መካከል ሁለት የመሆን ከፊላዊ ግንኙነት ይጠብቃል፤ ‘ደቀ መዛሙርት’ ለμαθηταί የተለመደና ግልጽ አቻ ነው።
