  to: በማግስቱ[a] ዮሐንስ እንደገና ቆሞ ነበር፤ ከደቀ መዛሙርቱም ሁለት ከእርሱ ጋር ነበሩ።
  rationale: The revision replaces the overly definite ሁለቱ with ሁለት and restructures the sentence into natural coordinated Amharic clauses. It retains the source's temporal sequence, repeated setting, John’s standing, and the presence of two from among his disciples. The footnote continues to document the source’s elliptical coordination.
