  alternative: ‘ከእኔ ቀድሟል’ ወይም ‘ከእኔ ይበልጣል’
  rationale: ግሪኩ የፊትነትን፣ የቅድሚያን ወይም የማዕረግ ብልጫን ሊገልጽ ስለሚችል፣ ዋናው ጽሑፍ አንዱን ብቻ አይወስንም፤ አማራጮቹ በማስታወሻ ተብራርተዋል።
