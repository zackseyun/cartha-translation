- source_word: περὶ αὐτοῦ
  choice: ስለ እርሱ
  rationale: περί ከዝርያ ቅጽ ጋር ያለውን ‘ስለ/በተመለከተ’ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κέκραγεν
  choice: ድምፁንም ከፍ አድርጎ … ብሏል
  rationale: የግሪኩን ፍጹም ጊዜ በ‘ብሏል’ ያንጸባርቃል፤ ድምፅን ከፍ አድርጎ መናገር የκράζωን ጠንካራ የአዋጅ ስሜት በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: ይህ እኔ … ብዬ የተናገርኩለት ነው
  rationale: የተጠቀሰውን ሰው በግልጽ ይለያል፤ የቀደመው ንግግር በ‘የተናገርኩለት’ ተጠብቋል፣ የአማርኛው መለያ አረፍተ ነገርም ተፈጥሯዊ ሆኗል።
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: ከእኔ በኋላ የሚመጣው
  rationale: የአንቀጹን ተሳቢ ቅርጽና የቅደም ተከተል ሐሳብ በቀላል ዘመናዊ አማርኛ ያቆያል።
- source_word: ἔμπροσθέν μου γέγονεν
  choice: ከእኔ በፊት ሆኗል
  rationale: የγίνομαιን ፍጹም ጊዜና የἔμπροσθενን የፊት/ቅድሚያ ምስል ሳይተረጉምበት ያቆያል፤ የማዕረግ ብልጫ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቀዳሚውን አባባል የሚያስረዳውን ምክንያት ግልጽ አድርጎ ያገናኛል።
- source_word: πρῶτός μου ἦν
  choice: ከእኔ በፊት ነበር
  rationale: የቀዳሚነትን አባባል ከግሪኩ ቅርጽ ጋር በቅርብ ያቆያል፤ ‘ኖሮ ነበር’ የሚለውን የበለጠ ትርጓሜያዊ ማብራሪያ በዋናው ጽሑፍ ውስጥ አያስገባም።
theological_decisions:
- issue: የመጨረሻው ሐረግ ከክርስቶስ ቅድመ ሕልውና ጋር ያለው ግንኙነት
