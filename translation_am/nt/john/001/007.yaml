id: JHN.1.7
reference: John 1:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: am
  text: እርሱ ስለ ብርሃኑ እንዲመሰክር ለምስክርነት መጣ፤ ዓላማውም ሁሉም በእርሱ በኩል እንዲያምኑ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በእርሱ በኩል» በዐውዱ ውስጥ በዮሐንስ ምስክርነት በኩል ማለት ነው፤ አንዳንዶች ግን «እርሱ» ብርሃኑን እንደሚያመለክት ይወስዳሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: እርሱ
  rationale: የአመልካች ተውላጠ ስም ኃይል በዐውዱ ውስጥ ቀደም ብሎ የተጠቀሰውን ዮሐንስን ያመለክታል፤ «እርሱ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: ለምስክርነት መጣ
  rationale: εἰς ከማስረጃ/ምስክርነት ስም ጋር የመምጣቱን ዓላማ ያሳያል፤ ይህ አተረጓጎም የግሪኩን ስማዊ አገላለጽና የምስክርነት ሐሳብ ይጠብቃል።
- source_word: ἵνα μαρτυρήσῃ
  choice: እንዲመሰክር
  rationale: ἵνα የዓላማ ንዑስ አረፍተ ነገር ስለሚያስገባ፣ «እንዲመሰክር» ዓላማውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περὶ τοῦ φωτός
  choice: ስለ ብርሃኑ
  rationale: περί ከዝርያ ጋር «ስለ» የሚለውን ትርጉም ይሰጣል፤ ብርሃኑ በዐውዱ ውስጥ ለግለሰብ የተሰጠ ምሳሌያዊ መጠሪያ ነው።
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: ሁሉም … እንዲያምኑ
  rationale: ሁለተኛውን የዓላማ አንቀጽ ያቆያል፤ πάντες ያለገደብ «ሁሉም» ሲሆን πιστεύω በዚህ ዐውድ «ማመን» ነው።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ በኩል
  rationale: διά ከዝርያ ጋር መንገድን ወይም መካከለኛ አገልግሎትን ያመለክታል፤ «በእርሱ በኩል» ይህን በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በδι’ αὐτοῦ ውስጥ ያለው αὐτοῦ የሚያመለክተው ማንን ነው?
  choice: በዋናው ጽሑፍ «በእርሱ በኩል» ተብሎ ተቀምጦ፣ በዐውዱ ዮሐንስን እንደሚያመለክት ቅድሚያ ተሰጥቶታል።
  alternative: አንዳንዶች «እርሱ» ብርሃኑን እንደሚያመለክት ይወስዱታል።
  rationale: የቁጥሩ ዋና ተዋናይና በቅርብ የቀረበው የሰው ማጣቀሻ ዮሐንስ ነው፤ ቀጣዩም ቁጥር ዮሐንስን ከብርሃኑ ይለያል። ሆኖም የተውላጠ ስሙ ቅርጽ በራሱ አማራጩን ፈጽሞ ስለማይዘጋ፣ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት የዓላማ አንቀጾች ተጠብቀዋል፤ ሁለተኛው በአማርኛ ለስላሳነት «ይህም … ነው» በሚል ተያያዥ አወቃቀር ቀርቧል።
