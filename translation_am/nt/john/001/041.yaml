  rationale: የግሪኩ ማብራሪያ ሴማዊውን “መሲሕ” በግሪክ አቻው χριστός እንደሚተረጉመው በቀጥታ ይጠብቃል፤ የሁለቱም ቃላት ትርጉም በማስታወሻው ተገልጿል።
