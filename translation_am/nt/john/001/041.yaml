- source_word: Σίμωνα
  choice: ስምዖንን
  rationale: የግለሰቡ ስም በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፏል።
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
