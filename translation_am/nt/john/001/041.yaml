- source_word: Μεσσίαν
  choice: መሲሑን
  rationale: ሴማዊውን መሲሐዊ ማዕረግ በአማርኛ የታወቀው ቅርጽ ይጠብቃል።
- source_word: μεθερμηνευόμενον
  choice: ማለት ... ማለት ነው
