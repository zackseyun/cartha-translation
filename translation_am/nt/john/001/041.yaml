  choice: Μεσσίας “መሲሕ” ተብሎ፣ χριστός ደግሞ “ክርስቶስ” ተብሎ ቀርቧል።
  alternative: ሁለቱንም “መሲሕ” ብሎ መተርጎም፣ ወይም χριστόςን “የተቀባው” ብሎ መተርጎም።
  rationale: ሁለቱን በአንድ ቃል ማቅረብ የዮሐንስን ከሴማዊ ቃል ወደ ግሪክ አቻ የሚደረግ ማብራሪያ ያጠፋል። “ክርስቶስ” የግሪኩን አቻ በታሪካዊ መልኩ ይጠብቃል፤ “የተቀባው” የሚለው ትርጉም በማስታወሻ ተብራርቷል።
