  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: am
  text: እርሱንም ወደ ኢየሱስ አመጣው። ኢየሱስም ትኩር ብሎ ተመለከተውና፣ “አንተ የዮሐንስ[a] ልጅ ስምዖን ነህ፤ ኬፋ ተብለህ ትጠራለህ” አለው። (ኬፋ በትርጉም ጴጥሮስ[b] ማለት ነው።)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ዮሐንስ” በሚለው ፈንታ “ዮናስ” ይላሉ፤ የSBLGNT ጽሑፍ “ዮሐንስ” ይላል።
    reason: textual_variant
  - marker: b
    text: “ኬፋ” ከ“ጴጥሮስ” ጋር የሚዛመደው ሴማዊ ስም ሲሆን፣ “ዓለት” ወይም “ድንጋይ” የሚል ፍቺ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: እርሱንም ወደ ኢየሱስ አመጣው
  rationale: የተፈጸመውን ወደ አንድ ሰው የማምጣት ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ πρός ከተሳቢ ጋር ያለውን ወደ ሰው መቅረብም ይጠብቃል።
- source_word: ἐμβλέψας αὐτῷ
  choice: ትኩር ብሎ ተመለከተውና
  rationale: ἐμβλέπω ከተራ እይታ የበለጠ ትኩረት ያለበትን መመልከት ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ጥንካሬውን ሳያጋንን ይይዛል።
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: አንተ የዮሐንስ ልጅ ስምዖን ነህ
  rationale: ግልጽ የሆነውን σὺ በ“አንተ” በማቅረብ የንግግሩን ቀጥተኛነት ይጠብቃል፤ የSBLGNT ንባብ Ἰωάννου ደግሞ “ዮሐንስ” ተብሎ ተተርጉሟል።
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: ኬፋ ተብለህ ትጠራለህ
  rationale: የκαλέωን የወደፊት ጊዜ ተደራጊ ቅርጽ እና የስም መሰየሙን ሐሳብ ይጠብቃል፤ Κηφᾶς እንደ ግል ስም “ኬፋ” ተብሎ ተጽፏል።
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: ይህም ጴጥሮስ ተብሎ ይተረጎማል
  rationale: የግሪኩን ማብራሪያዊ ቅንፍ እና የἑρμηνεύεταιን ተደራጊ አገባብ ይጠብቃል፤ Πέτρος እንደ ግል ስም “ጴጥሮስ” ተብሎ ቀርቧል።
theological_decisions:
- issue: የΚηφᾶς/Πέτρος ማብራሪያ አተረጓጎም
  choice: በዋናው ጽሑፍ ሁለቱንም እንደ ግል ስሞች “ኬፋ” እና “ጴጥሮስ” ማቅረብ
  alternative: ሁለቱን ወይም አንዱን “ዓለት” ወይም “ድንጋይ” ብሎ በቀጥታ መተርጎም
  rationale: ጥቅሱ ለስምዖን የሚሰጠውን ስም ያቀርባል፤ ግሪኩም ሴማዊውን ስም በግሪክ ስም ያብራራል። ስለዚህ የስምነቱ ተግባር በዋናው ጽሑፍ ተጠብቆ፣ የቃሉ መሠረታዊ ፍቺ በማስታወሻ ተገልጿል፤ ከዚህ በኋላ የሚነሱ ሥነ መለኮታዊ ድምዳሜዎች በትርጉሙ ውስጥ አልተጫኑም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ ነው። “ትኩር ብሎ” የግሪኩን የተጠናከረ እይታ በተፈጥሯዊ አማርኛ ይገልጣል። የማስታወሻ ምልክቶቹ በሚመለከታቸው ቃላት ላይ ተቀምጠዋል።
