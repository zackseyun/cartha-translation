translation:
  language: am
  text: እርሱ በመጀመሪያ ከእግዚአብሔር ጋር ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ በመጀመሪያ ከእግዚአብሔር ጋር ነበር።”
    reason: የግሪኩ οὗτος የጠቋሚነት ኃይልን በቅርብ የሚያሳይ የቃላት አማራጭ።
lexical_decisions:
- source_word: οὗτος
  choice: እርሱ
  rationale: በአውዱ የቁጥር 1ን ‘ቃል’ ወደ ኋላ የሚያመለክት ነው። ‘እርሱ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የግሪኩን ጠቋሚ ኃይል ሙሉ በሙሉ እንዳይጠፋ ‘ይህ ነው’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἦν
  choice: ነበር
  rationale: የεἰμί ያልተፈጸመ ያለፈ ጊዜ ቅርጽን በተፈጥሯዊና ቀጣይ ሁኔታን ሊገልጥ በሚችል መንገድ ያስተላልፋል።
- source_word: ἐν ἀρχῇ
  choice: በመጀመሪያ
  rationale: የዮሐንስ 1፥1ን ድግግሞሽና ከዘፍጥረት 1፥1 ጋር ያለውን ሥነ ጽሑፋዊ ድምፅ ይጠብቃል።
- source_word: πρὸς
  choice: ከ… ጋር
  rationale: እዚህ πρός ከተሳቢ ጋር የሚያሳየውን ቅርበት፣ ግንኙነትና ልዩነት ሳያብራራ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν θεόν
  choice: እግዚአብሔር
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አገላለጽ የታወቀ፣ ክቡርና ለθεός ተፈጥሯዊ ትርጉም ነው፤ የግሪኩን የተወሰነ መስተካከያ በሰዋስው የማይመች መንገድ አያስገባም።
theological_decisions:
- issue: οὗτος በዮሐንስ 1፥1 ወዳለው ቃል መመለሱ
  choice: ጠቋሚው ወደ ‘ቃል’ እንደሚመለስ በግላዊው ‘እርሱ’ ተተርጉሟል።
  alternative: ‘ይህ ነው’ ብሎ የግሪኩን ጠቋሚ ቅርጽ በቅርብ መከተል።
  rationale: ቁጥሩ በቁጥር 1 የተጠቀሰውን λόγος ግንኙነት ይደግማል። ‘እርሱ’ ተመላሹን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል፤ ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ቃል አይጨምርም።
- issue: πρὸς τὸν θεόν የሚያሳየው ግንኙነት
  choice: ‘ከእግዚአብሔር ጋር’ ተብሎ የግንኙነት ቅርበትና ልዩነት ተጠብቋል።
  alternative: ‘ወደ እግዚአብሔር’ ወይም ‘በእግዚአብሔር ፊት’።
  rationale: ‘ከ… ጋር’ በዚህ አውድ የግሪኩን ግላዊ ግንኙነትና የተገናኞቹን ልዩነት በአጭሩ ይጠብቃል፤ ሜታፊዚካዊ ዝርዝርን በትርጉሙ ላይ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እግዚአብሔር’ የተለመደውን መጽሐፍ ቅዱሳዊ መዝገብ ይጠብቃል፤ ዋናው ዓረፍተ ነገር አጭርና ከቁጥር 1 ጋር የሚስማማ ነው።
