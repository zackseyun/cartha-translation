  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: am
  text: ኢየሱስ ሲሄድ ትኩር ብሎ ተመለከተውና፣ “እነሆ፣ የእግዚአብሔር በግ!” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: ትኩር ብሎ ተመለከተውና
  rationale: የግሱን የተመሰጠ ወይም የትኩረት እይታ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: περιπατοῦντι
  choice: ሲሄድ
  rationale: በዚህ አውድ የመራመድን ቀጣይ ድርጊት በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: Ἴδε
  choice: እነሆ
  rationale: ትኩረትን ወደ ኢየሱስ የሚጠራውን የማሳያ ትእዛዝ በክብር ያለውና ለአንባቢ የተለመደ ቃል ያቀርባል።
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: የእግዚአብሔር በግ
  rationale: ዋናውን ዘይቤና የግሪኩን የባለቤትነት ግንኙነት ሳይተረጉም ይጠብቃል።
- source_word: λέγει
  choice: አለ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል።
theological_decisions:
- issue: “የእግዚአብሔር በግ” የሚለው ማዕረግ ትርጉም
  choice: ዘይቤውን በቀጥታ ማቆየት
  alternative: “እግዚአብሔር ለመሥዋዕት ያዘጋጀው በግ” ብሎ መተርጎም
  rationale: ጥቅሱ ዘይቤውን እንጂ የተወሰነ አንድ ትርጓሜውን አይገልጽም፤ ስለዚህ የመሥዋዕት፣ የፋሲካ ወይም ሌሎች ሊሆኑ የሚችሉ ጥቆማዎችን ሳይገድብ የምንጩን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “እነሆ” ከዕለታዊው “ተመልከቱ” ይልቅ መጠነኛ ቅዱስ ጽሑፋዊ ክብር አለው፣ ነገር ግን ለዘመናዊ አንባቢ ግልጽ ነው።
