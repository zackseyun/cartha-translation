  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ተስተካክሏል፤ የስሞች ቅርጽ የተለመደውን የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም ይከተላል።
