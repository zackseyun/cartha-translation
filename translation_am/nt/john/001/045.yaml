  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: am
  text: ፊልጶስ ናትናኤልን አግኝቶ፣ “ሙሴ በሕግ፣ ነቢያትም ስለ እርሱ የጻፉትን አግኝተነዋል፤ እርሱም፦ የዮሴፍ ልጅ ኢየሱስ፣ ከናዝሬት የመጣው ነው” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: አግኝቶ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ ባለፈ ድርጊት ተተርጉሟል።
- source_word: λέγει
  choice: አለው
  rationale: ታሪካዊው የአሁን ጊዜ ቅርጽ ከአማርኛ የትረካ ፍሰት ጋር እንዲስማማ በቀላል ያለፈ ጊዜ ቀርቧል።
- source_word: Ὃν ... ἔγραψεν
  choice: ስለ እርሱ የጻፉትን
  rationale: በግሪኩ የዝምድና ተውላጠ ስም የተገለጠውን ግለሰባዊ ማጣቀሻ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሙሴንና ነቢያትን ሁለቱንም የጽሑፉ ባለቤቶች አድርጎ ያቆያል።
- source_word: ἐν τῷ νόμῳ
  choice: በሕጉ ውስጥ
  rationale: አጠቃላይ ሕግን ሳይሆን ከሙሴ ጋር የተያያዘውን የቅዱሳት መጻሕፍት ክፍል ያመለክታል።
- source_word: οἱ προφῆται
  choice: ነቢያት
  rationale: የትንቢታዊውን የመጽሐፍ ምስክርነት በተለመደው አማርኛ ቃል ይገልጣል።
- source_word: εὑρήκαμεν
  choice: አግኝተነዋል
  rationale: የግሪኩ ፍጹም ጊዜ የሚያመለክተውን፣ ያለፈው ግኝት አሁን ያለውን ውጤት፣ የአማርኛው ፍጹም ቅርጽ በተፈጥሮ ያስተላልፋል።
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: የዮሴፍ ልጅ
  rationale: የፊልጶስን ማኅበራዊ መለያ እንዳለ ይጠብቃል፤ በጥቅሱ ያልተገለጸ ክርስቶሎጂያዊ ማብራሪያ አይጨምርም።
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: ከናዝሬት የመጣው
  rationale: ἀπό የመነሻ ወይም የቦታ ግንኙነትን በቀጥታ ያመለክታል፤ በአማርኛም ተፈጥሯዊ መለያ ነው።
- source_word: Ναθαναήλ / Ἰησοῦν / Μωϋσῆς / Ἰωσὴφ / Ναζαρέτ
  choice: ናትናኤል / ኢየሱስ / ሙሴ / ዮሴፍ / ናዝሬት
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመዱት መጽሐፍ ቅዱሳዊ የስም ቅርጾች ተጠብቀዋል።
theological_decisions:
- issue: “የዮሴፍ ልጅ” የሚለው መለያና ክርስቶሎጂ
  choice: የዮሴፍ ልጅ
  alternative: የዮሴፍ ልጅ ተብሎ የሚታሰበው
  rationale: ጥቅሱ የፊልጶስን ቃል በተለመደ ማኅበራዊ መለያ ይዘግባል። ትርጉሙ ይህን ንግግር ሳይለውጥ ያቆያል፣ በጥቅሱም ውስጥ የሌለ ማስማሚያ አይጨምርም።
- issue: “ሙሴ በሕጉ ውስጥ፣ ነቢያትም” የሚለው የመጽሐፍ ምስክርነት
  choice: ሙሴና ነቢያት ስለ አንድ ግለሰብ እንደጻፉ ማቅረብ
  alternative: ቃሉን የተወሰነ የመሲሕ ትንቢት ብቻ አድርጎ መግለጽ
  rationale: የፊልጶስን ግልጽ የመጽሐፍ ምስክርነት ያቆያል፣ ነገር ግን ከንግግሩ በላይ የሆነ ዝርዝር ትርጓሜ አያስገባም።
