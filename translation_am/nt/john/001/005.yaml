id: JHN.1.5
reference: John 1:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: am
  text: ብርሃኑም በጨለማ ውስጥ ያበራል፤ ጨለማውም አላሸነፈውም[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጨለማውም አልተረዳውም” ወይም “አልጨበጠውም።” የግሪኩ ግስ ማሸነፍንም ሆነ መጨበጥን ወይም መረዳትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ብርሃኑ
  rationale: የግሪኩን የተወሰነ አመልካች ጠብቆ፣ በዮሐንስ መቅድም ውስጥ አስቀድሞ የተጠቀሰውን ጭብጣዊ ብርሃን ያመለክታል።
- source_word: σκοτίᾳ / σκοτία
  choice: በጨለማ / ጨለማው
  rationale: በመጀመሪያው ሐረግ ከአማርኛ አገባብ ጋር ተፈጥሯዊ የሆነው ‘በጨለማ ውስጥ’ ተጠቅሟል፤ በሁለተኛው ደግሞ የግሪኩን አመልካችና ከብርሃኑ ጋር ያለውን ጭብጣዊ ተቃርኖ ‘ጨለማው’ ይጠብቃል።
- source_word: φαίνει
  choice: ያበራል
  rationale: የአሁን ጊዜውን ቀጣይና ሕያው ተግባር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κατέλαβεν
  choice: አላሸነፈውም
  rationale: በብርሃንና በጨለማ ተቃርኖ ውስጥ ‘ማሸነፍ’ የግጭቱን ምስል በግልጽ ያቀርባል፤ የ‘መረዳት/መጨበጥ’ ትርጉም ግን በማስታወሻ ተጠብቋል።
- source_word: αὐτὸ
  choice: -ው
  rationale: በ‘አላሸነፈውም’ ውስጥ ያለው ተሳቢ ቅጥያ ብርሃኑን ያመለክታል፤ ይህም ከግሪኩ ገለልተኛ ነጠላ ተውላጠ ስም ጋር ተግባራዊ ተመጣጣኝነት አለው።
theological_decisions:
- issue: በብርሃንና በጨለማ ተቃርኖ ውስጥ የκατέλαβεν ትርጉም
  choice: አላሸነፈውም
  alternative: አልተረዳውም፤ ወይም አልጨበጠውም
  rationale: የግሪኩ ግስ ጠላትነትን የሚያሳይ ‘መያዝ/ማሸነፍ’ ወይም አእምሯዊ ‘መጨበጥ/መረዳት’ ሊያመለክት ይችላል። የብርሃንና ጨለማ ምስል ‘ማሸነፍን’ ይደግፋል፤ ሆኖም የዮሐንስን ሊሆን የሚችል ድርብ ፍቺ ላለማጥፋት ሌላው ንባብ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ያበራል’ ቀጣይ እውነታን በተፈጥሯዊ አገላለጽ ይገልጣል፤ የአገባብ ውጥረቱም በአጭር ተመጣጣኝ ሐረጎች ተጠብቋል።
