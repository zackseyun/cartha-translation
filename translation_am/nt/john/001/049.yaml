id: JHN.1.49
reference: John 1:49
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: am
  text: ናትናኤልም መልሶ፣ “ረቢ፣ አንተ የእግዚአብሔር ልጅ ነህ፤ አንተ የእስራኤል ንጉሥ ነህ” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መልሶ … አለው
  rationale: በአማርኛ የትረካ ንግግር ውስጥ ἀποκρίνομαιን ተፈጥሯዊና ትክክለኛ በሆነ መንገድ ያቀርባል።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: የአይሁድን ታሪካዊና ባህላዊ የአክብሮት መጠሪያ ከመተርጎም ይልቅ በድምፅ ቅርበት ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የግሪኩን የተወሰነ ክርስቶሳዊ መጠሪያ ሳያዳክም በተለመደውና ክቡር የአማርኛ አገላለጽ ያቀርባል።
- source_word: βασιλεὺς
  choice: ንጉሥ
  rationale: ቀጥተኛውን የንጉሣዊ ማዕረግ ይጠብቃል፤ ‘ገዢ’ የሚለውን ሰፊ ትርጉም አይጠቀምም።
- source_word: τοῦ Ἰσραήλ
  choice: የእስራኤል
  rationale: የዝምድና ቅርጹንና የማዕረጉን አወቃቀር በቀጥታ ይጠብቃል።
- source_word: σὺ εἶ … σὺ … εἶ
  choice: አንተ … ነህ፤ አንተ … ነህ
  rationale: በግሪኩ ያለውን አጽንዖታዊ ድግግሞሽና የእምነት ኑዛዜ ትይዩነት ይጠብቃል።
- source_word: Ναθαναήλ
  choice: ናትናኤል
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደ የድምፅ ቅርጽ ያቀርባል።
theological_decisions:
- issue: ‘የእግዚአብሔር ልጅ’ የሚለው የናትናኤል ክርስቶሳዊ ኑዛዜ
  choice: መጠሪያውን ‘የእግዚአብሔር ልጅ’ ብሎ ያለ ማስፋት ወይም ማዳከም ማቆየት
  alternative: ‘ከእግዚአብሔር ልጆች አንዱ’ ወይም በኋለኛ የእምነት ቀመር ማስፋት
  rationale: የዮሐንስን ጠንካራ ክርስቶሳዊና መሲሓዊ አገላለጽ እንዳለ ይጠብቃል፤ ጽሑፉ ያላለውንም አይጨምርም።
- issue: ‘የእስራኤል ንጉሥ’ የሚለው ንጉሣዊና መሲሓዊ ማዕረግ
  choice: ‘የእስራኤል ንጉሥ’ የሚለውን ግልጽ ማዕረግ መጠበቅ
  alternative: ‘በእስራኤል ላይ የምትገዛ’ ወይም ‘የእስራኤል ገዢ’
  rationale: የግሪኩን ንጉሣዊ ቃልና የእስራኤልን የሚጠበቅ ንጉሥ የሚያስታውሰውን መሲሓዊ አውድ ሳይተረጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖታዊ ‘አንተ … አንተ’ ድግግሞሽ ተጠብቋል፤ የግርጌ ማስታወሻ አላስፈለገም።
