base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: am
  text: እርሱም፣ “ኑ፤ ታያላችሁ” አላቸው። ስለዚህ ሄደው የት እንደሚቆይ አዩ፤ በዚያም ቀን ከእርሱ ጋር ቆዩ። አሥረኛው ሰዓት ገደማ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ፀሐይ ከወጣችበት ጊዜ ጀምሮ ቢቆጠር ከሰዓት በኋላ 4፡00 ገደማ ነው፤ አንዳንዶች ግን በሮማውያን የሰዓት አቆጣጠር ጠዋት 10፡00 ገደማ እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: ኑ
  rationale: የብዙ ቁጥር ግብዣዊ ትእዛዝን በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: ὄψεσθε
  choice: ታያላችሁ
  rationale: የወደፊት ጊዜ ቅርጹንና የግብዣውን ኃይል ይጠብቃል።
- source_word: ἦλθαν οὖν
  choice: ስለዚህ ሄደው
  rationale: οὖν የሚያመለክተውን ውጤት በ‘ስለዚህ’ ያሳያል፤ እንቅስቃሴውም ከተከታዮቹ የትረካ አተያይ በ‘ሄደው’ ተገልጿል።
- source_word: εἶδαν
  choice: አዩ
  rationale: ቀጥተኛውን የማየት ትርጉም ያስተላልፍና ‘ታያላችሁ’ ከሚለው ጋር ያለውን የቃል ድግግሞሽ ይጠብቃል።
- source_word: ποῦ μένει
  choice: የት እንደሚቆይ
  rationale: በዚህ አውድ μένω የሚያመለክተውን የመቆያ ስፍራ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: παρ’ αὐτῷ
  choice: ከእርሱ ጋር
  rationale: በቅርብ አብሮ መሆንንና በእርሱ ዘንድ መቆየትን በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἔμειναν
  choice: ቆዩ
  rationale: μένεῖν የሚለውን ትርጉም ይጠብቃል፤ ከ‘እንደሚቆይ’ ጋር ያለውን የቃል ግንኙነትም ያሳያል።
- source_word: τὴν ἡμέραν ἐκείνην
  choice: በዚያም ቀን
  rationale: ጽሑፉ ያልገለጸውን ‘ቀሪውን’ ወይም ‘ሙሉውን’ ሳይጨምር የጊዜውን መጠን ይጠብቃል።
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: ሰዓቱ አሥረኛው ሰዓት ገደማ ነበር
  rationale: ὡςን በ‘ገደማ’ ያስተላልፍና አከራካሪውን የሰዓት አቆጣጠር በዋናው ጽሑፍ ሳይወስን የግሪኩን አገላለጽ ይጠብቃል።
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: ታሪካዊውን የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ይገልጻል።
theological_decisions:
