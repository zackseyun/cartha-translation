  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: am
  text: እርሱንም ጠይቀው እንዲህ አሉት፦ “አንተ መሲሑም፣ ኤልያስም፣ ነቢዩም ካልሆንክ፣ ታዲያ ለምን ታጠምቃለህ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: ጠይቀው እንዲህ አሉት
  rationale: የግሪኩን ‘ጠየቁት’ እና ‘አሉት’ የሚሉ ሁለት ግሶች ይጠብቃል፤ በአማርኛም ተፈጥሯዊ የንግግር መግቢያ ነው።
- source_word: Τί οὖν
  choice: ታዲያ ለምን
  rationale: τί በዚህ አገባብ የድርጊቱን ምክንያት ወይም መሠረት ይጠይቃል፤ οὖν የሚያሳየውን ከቀደመው ንግግር የሚነሳ ድምዳሜ ‘ታዲያ’ ያስተላልፋል።
- source_word: βαπτίζεις
  choice: ታጠምቃለህ
  rationale: የአሁን ጊዜው ግስ ዮሐንስ በዚያን ጊዜ በቀጣይነት ያደርገው የነበረውን የማጥመቅ ሥራ ያመለክታል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: Χριστός እዚህ የግል ስም ሳይሆን በአይሁድ ዘንድ ይጠበቅ የነበረውን የተቀባ ንጉሥ የሚያመለክት ማዕረግ ነው፤ የመድረሻውን አንቀጽ በ‘-ው’ ይጠብቃል።
- source_word: Ἠλίας
  choice: ኤልያስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: ὁ προφήτης
  choice: ነቢዩ
  rationale: የግሪኩ የመድረሻ አንቀጽ ተናጋሪዎቹ የሚያውቁትንና ይመጣል ብለው የሚጠብቁትን የተወሰነ ነቢይ እንደሚያመለክት ‘ነቢዩ’ በሚለው ተጠብቋል።
- source_word: οὐδὲ ... οὐδὲ
  choice: …ም፣ …ም … ካልሆንክ
  rationale: በአማርኛ የተፈጥሮ አሉታዊ አሰላለፍ ሦስቱን አማራጮች በእኩልነት ያስተባብራል።
theological_decisions:
- issue: Χριστόςን በዮሐንስ የማንነት ጥያቄ ውስጥ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ እንደ ስም ሳይሆን እንደ ማዕረግ ያገለግላል፤ ‘መሲሑ’ የንግግሩን የአይሁድ ተስፋና አውድ በግልጽ ይጠብቃል።
- issue: ὁ προφήτης የተወሰነ የሚጠበቅ ነቢይ መሆኑ
  choice: ነቢዩ
  alternative: አንድ ነቢይ
  rationale: የመድረሻው አንቀጽ ማንኛውንም ነቢይ ሳይሆን የታወቀና የሚጠበቅ ሰው እንደሆነ ያመለክታል፤ ከሙሴ ጋር ያለው ግንኙነት በማስታወሻ ቀርቦ ትርጉሙ ከምንጩ በላይ እንዳይወስን ተደርጓል።
