  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እና ሕይወት እንዲኖራችሁ ወደ እኔ መምጣት አትፈልጉም።» የግሪኩ አያያዥ ቃል «እና» ተብሎ በቀጥታ ሊተረጎም ይችላል፤ θέλετεም «ትፈልጋላችሁ» ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በዮሐንስ ወንጌል «ሕይወት» ብዙ ጊዜ ከእግዚአብሔር የሚገኘውን ሕይወት፣ ማለትም ዘላለማዊ ሕይወትን፣ በሰፊው ያመለክታል፤ ሆኖም «ዘላለማዊ» የሚለው ቃል እዚህ አልተጠቀሰም።
    reason: cross_reference
