    text: ወይም፣ “በአባቴ ሥልጣን።” የግሪኩ “በስም” የሚለው አገላለጽ ስሙን ብቻ ሳይሆን ውክልናን ወይም ሥልጣንንም ሊያመለክት ይችላል።
    reason: lexical_alternative
