  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: am
  text: በዚህም ምክንያት አይሁድ[a] ኢየሱስን ያሳድዱት ነበር፤ እነዚህን ነገሮች በሰንበት ያደርግ ስለነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «የይሁዳ ሰዎች»፤ እንደ ዐውዱም «የአይሁድ መሪዎች»። በዮሐንስ ወንጌል ይህ ቃል ብዙ ጊዜ ኢየሱስን የሚቃወም የተወሰነ ቡድንን ያመለክታል እንጂ እያንዳንዱን አይሁዳዊ ያለ ልዩነት አያመለክትም።
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: በዚህም ምክንያት
  rationale: ይህ ሐረግ ከዚህ በፊት የተነገረውን ድርጊት የስደቱ ምክንያት አድርጎ ያመለክታል፤ የምክንያት ግንኙነቱን በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐδίωκον
  choice: ያሳድዱት ነበር
  rationale: ያልተጠናቀቀው የግስ አይነት ቀጣይ ወይም ተደጋጋሚ ጠላትነትን ያሳያል። «ያሳድዱት ነበር» ይህን ይጠብቃል፣ በቁጥር 18 የተገለጠውን የመግደል ዓላማ ግን አስቀድሞ አያስገባም።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን መደበኛ የብሔርና የሃይማኖት ስያሜ በቀጥታ ያቀርባል። በዚህ ቦታ «መሪዎች» ብሎ መተርጎም በቃሉ ውስጥ በግልጽ የሌለውን ገደብ ያስገባል፤ የዐውዱ ልዩነት በማስታወሻ ተገልጧል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: ብዙ ቁጥር ያለውን አመልካች በመጠበቅ ቀደም ሲል የተተረኩትን ድርጊቶች ያመለክታል።
- source_word: ἐποίει
  choice: ያደርግ ስለነበር
  rationale: የግሱን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል፤ ድርጊቱን እንደ አንድ የተጠናቀቀ ክስተት ብቻ አያቀርብም።
- source_word: ἐν σαββάτῳ
  choice: በሰንበት
  rationale: የሰንበትን ጊዜ በተለመደና ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚያመለክተው ወገንና አተረጓጎሙ
  choice: አይሁድ
  alternative: የአይሁድ መሪዎች፤ የይሁዳ ሰዎች
  rationale: ዋናው ጽሑፍ የግሪኩን ቀጥተኛ የቃል ዋጋ ይጠብቃል፤ በዐውዱ ግን ቃሉ ኢየሱስን የሚቃወሙ የተወሰኑ ሰዎችን ሊያመለክት ስለሚችል፣ ሁሉንም አይሁድ ያለልዩነት እንደሚወቅስ እንዳይታወቅ ማብራሪያ ተጨምሯል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ያልተጠናቀቀ የግስ አይነት በ«ነበር» አወቃቀር ተጠብቋል።
