  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: am
  text: በዚህ ምክንያትም አይሁድ[a] ሊገድሉት ይበልጥ ይፈልጉ ነበር፤ ሰንበትን ስለሚጥስ ብቻ ሳይሆን፣ እግዚአብሔርን የራሱ አባት[b] ብሎ በመጥራት ራሱን ከእግዚአብሔር ጋር እኩል ስለሚያደርግ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዮሐንስ ወንጌል “አይሁድ” የሚለው ቃል በብዙ ስፍራዎች ሁሉንም አይሁዳውያን ሳይለይ ሳይሆን፣ እንደ ዐውዱ የኢየሱስን በይሁዳ አገር የሚቃወሙ ሰዎችን ወይም የተወሰኑ የአይሁድ ባለሥልጣናትን ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “የገዛ አባቱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: ስለዚህም
  rationale: ሁለቱንም የምክንያትና የመደምደሚያ አገናኞች በተፈጥሯዊው የአማርኛ አገላለጽ ያጣምራል።
- source_word: μᾶλλον
  choice: ይበልጥ
  rationale: የተቃዋሚዎቹ የመግደል ፍላጎት መጠናከሩን የሚያሳየውን የንጽጽር ኃይል ይጠብቃል።
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: ሊገድሉት ይፈልጉ ነበር
  rationale: ያልተቋረጠውን ወይም የተደጋገመውን ጥረት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን ግልጽ የቡድን ስያሜ በዋናው ጽሑፍ ይጠብቃል፤ በዐውዱ የሚኖረው የተወሰነ ማጣቀሻ በማስታወሻ ተብራርቷል።
- source_word: ἔλυε τὸ σάββατον
  choice: ሰንበትን ይጥስ የነበረ
  rationale: λύω በዚህ ዐውድ የሰንበትን ሕግ መጣስ ወይም ወደ ጎን ማድረግን ያመለክታል፤ “ይጥስ” ግልጽና ተፈጥሯዊ ነው።
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: እግዚአብሔርንም የራሱ አባት ብሎ በመጥራት
  rationale: ἴδιον የሚያሳየውን “የራሱ” የተባለ አጽንዖት እና ἔλεγε ያለውን የመጥራት ሐሳብ ይጠብቃል።
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: ራሱን ከእግዚአብሔር ጋር እኩል ያደርግ ነበር
  rationale: የአሳታፊውን ሐረግ ቀጥተኛ ትርጉምና ክርስቶሎጂያዊ ኃይል ሳያለዝብ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ከእግዚአብሔር ጋር እኩል ስለመሆን የተነገረውን ክርስቶሎጂያዊ ኃይል ማለዘብ ወይም መጠበቅ
  choice: “ራሱን ከእግዚአብሔር ጋር እኩል ያደርግ ነበር” የሚለው ቀጥተኛ አገላለጽ ተጠብቋል።
  alternative: “ከእግዚአብሔር ጋር እኩልነት ይገባኛል ይል ነበር”
  rationale: የግሪኩ ጽሑፍ እኩልነቱን በግልጽ ይናገራል፤ ትርጉሙም ኃይሉን አያለዝብም፣ ነገር ግን በቁጥሩ ውስጥ ያልተጠቀሰ የኋላ ዘመን የእምነት ቃላትን አያስገባም።
- issue: “አይሁድ” የሚለው ስያሜ በዮሐንስ ዐውድ የሚያመለክተው
  choice: በዋናው ጽሑፍ “አይሁድ” ተጠብቆ፣ የዐውዱ ገደብ በማስታወሻ ተገልጿል።
  alternative: “የአይሁድ መሪዎች” ወይም “የይሁዳ ሰዎች”
  rationale: οἱ Ἰουδαῖοι የሚለውን በዋናው ጽሑፍ ማጥበብ ከቃሉ በላይ ትርጓሜ ሊጨምር ይችላል፤ ማስታወሻው ግን ስያሜው ሁሉንም አይሁዳውያን ያለ ልዩነት እንደማያመለክት ያብራራል።
