- source_word: ὑγιὴς γέγονας
  choice: ጤነኛ ሆነሃል
  rationale: ፍጹም ጊዜው የተፈጠረውን ለውጥና አሁን ያለውን የጤና ሁኔታ አንድ ላይ ያሳያል።
- source_word: μηκέτι ἁμάρτανε
  choice: ከእንግዲህ ወዲያ ኃጢአት አትሥራ
  rationale: ከዚህ ጊዜ ጀምሮ ኃጢአትን እንዲተው የተሰጠውን ትእዛዝ በግልጽ ዘመናዊ አማርኛ ይገልጣል፤ የግሱን ገጽታ ከሚገባው በላይ ‘መሥራትህን ቀጥል’ በሚል አይተረጉምም።
