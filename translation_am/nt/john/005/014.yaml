  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ የትረካ ቅደም ተከተልን ያሳያል፤ የግሪኩ የብዙ ቁጥር አገላለጽ ግን በማስታወሻው ተጠብቋል።
