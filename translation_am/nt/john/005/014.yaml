  rationale: የዓላማን ወይም የሚጠበቅ ውጤትን አሉታዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስቀምጣል፤ τι የሚሰጠውን ‘አንድ ነገር’ ትርጉምም ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ማስጠንቀቂያ ውስጥ በኃጢአትና በመከራ መካከል ያለው ግንኙነት
  choice: ሰውየው ከእንግዲህ ኃጢአት እንዳይሠራና የከፋ ነገር እንዳይደርስበት የተሰጠውን ማስጠንቀቂያ በቀጥታ ማቅረብ።
  alternative: የቀድሞው ሕመም የአንድ የተወሰነ ኃጢአት ቀጥተኛ ቅጣት እንደነበር፣ ወይም ‘የከፋው’ ነገር የምድራዊ መከራ ወይም የመጨረሻ ፍርድ ብቻ እንደሆነ መወሰን።
  rationale: የግሪክ ጽሑፉ ከኃጢአት እንዲርቅ ያስጠነቅቃል፤ ነገር ግን የቀድሞ ሕመሙን ትክክለኛ ምክንያትም ሆነ ‘የከፋውን’ ነገር ዓይነት በግልጽ አይወስንም። ትርጉሙ ይህን ያልተወሰነ ውጥረት ይጠብቃል።
