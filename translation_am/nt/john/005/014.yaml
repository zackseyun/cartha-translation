  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: am
  text: ከዚህ በኋላ[a] ኢየሱስ በቤተ መቅደስ አገኘውና፣ “እነሆ፣ ጤነኛ ሆነሃል[b]። ከእንግዲህ ወዲያ ኃጢአት አትሥራ፤ የከፋ ነገር እንዳይደርስብህ[c]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል፣ “ከእነዚህ ነገሮች በኋላ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አገላለጽ “ጤነኛ ሆነሃል” ሲሆን፣ በተፈጠረው ለውጥ ምክንያት አሁን ጤነኛ ሆኖ መኖሩን ያጎላል።
    reason: lexical_alternative
  - marker: c
    text: ይህ ማስጠንቀቂያ የቀድሞው ሕመም በአንድ የተወሰነ ኃጢአት የተከሰተ መሆኑን በግልጽ አይናገርም፤ “የከፋ ነገር” ማለትም ጊዜያዊ መከራን፣ የመጨረሻ ፍርድን ወይም ሁለቱንም ማመልከቱን አይወስንም።
    reason: alternative_reading
lexical_decisions:
