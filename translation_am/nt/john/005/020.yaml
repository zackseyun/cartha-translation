id: JHN.5.20
reference: John 5:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: am
  text: አብ ወልድን ይወዳልና፤ እርሱ ራሱ የሚያደርገውንም ሁሉ ያሳየዋል። ከእነዚህም የሚበልጡ ሥራዎችን ያሳየዋል፤ ይህም እናንተ እንድትደነቁ[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እናንተ ትደነቃላችሁ።» የግሪኩ ἵνα ከንዑስ አዋዋይ ግስ ጋር ዓላማን ሊገልጥ ይችላል፤ በዚህ ዐውድ ግን የኢየሱስ አድማጮች መደነቃቸውን እንደ ውጤትም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: ይወዳል
  rationale: በዮሐንስ አጠቃቀም φιλέω ከἀγαπάω ጋር ትርጉማዊ መደራረብ ሊኖረው ስለሚችል፣ ፍቅሩን ዝቅ የማያደርገውና ተፈጥሯዊው «ይወዳል» ተመርጧል።
- source_word: δείκνυσιν / δείξει
  choice: ያሳየዋል
  rationale: የአሁንና የወደፊት ግሶቹን የቃል ግንኙነት የሚጠብቅ ቀጥተኛ አቻ ነው፤ የአማርኛው ያልተፈጸመ ግስ እንደ ዐውዱ ቀጣይና ወደፊት ድርጊትን ይገልጣል።
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: እርሱ ራሱ የሚያደርገውንም ሁሉ
  rationale: πάντα ያለውን አጠቃላይ ወሰን «ሁሉ» ይጠብቃል፤ αὐτός የሚሰጠውን አጽንዖት «እርሱ ራሱ» ይወክላል።
- source_word: μείζονα τούτων ... ἔργα
  choice: ከእነዚህም የሚበልጡ ሥራዎች
  rationale: የንጽጽሩን አወቃቀር በተፈጥሯዊ አማርኛ ይገልጣል፤ «ሥራዎች» በዮሐንስ የኢየሱስን ድርጊቶች የሚያመለክተውን ቁልፍ ቃል ይጠብቃል።
- source_word: θαυμάζητε
  choice: እንድትደነቁ
  rationale: θαυμάζω የሚገልጠውን መደነቅና መገረም በዘመናዊና ክብር ባለው አማርኛ ያስተላልፋል።
theological_decisions:
- issue: φιλεῖ ስለ አብ ለወልድ ያለው ፍቅር የሚገልጠው ኃይል
  choice: «ይወዳል» ተብሎ ተተርጉሟል፤ ያነሰ ወይም ሰዋዊ ብቻ የሆነ ፍቅር እንደሆነ አልተገለጸም።
  alternative: «ይወድለታል» ወይም «ፍቅር አለው» በማለት የስሜት ቅርበቱን ይበልጥ ማጉላት።
  rationale: ቃሉ የአብና የወልድን የቅርብ ግንኙነት ይገልጣል፤ በዮሐንስ φιλέω እና ἀγαπάω ሊደራረቡ ስለሚችሉ ያልተጠየቀ ሥነ መለኮታዊ ልዩነት አልተጫነም።
- issue: ἵνα ὑμεῖς θαυμάζητε ዓላማን ወይም ውጤትን ማመልከቱ
  choice: «ይህም እናንተ እንድትደነቁ ነው» ተብሎ ተተርጉሟል።
  alternative: «ስለዚህ እናንተ ትደነቃላችሁ» የሚል የተረጋገጠ ውጤት።
  rationale: ἵνα ከንዑስ አዋዋይ ግስ ጋር ዓላማን ሊገልጥ ሲችል በዐውዱ የሚከተለውን መደነቅም ሊያመለክት ይችላል፤ ዋናው ጽሑፍና ማስታወሻው ይህን ግልጽ ሳያደርጉ የቀረውን ውጥረት ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «አብ» እና «ወልድ» የመጽሐፍ ቅዱስ ዐውድን በግልጽ ሁኔታ የሚጠብቁ የተለመዱ ክብር ያላቸው ቃላት ናቸው።
