  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: am
  text: ስለ እኔ የሚመሰክር ሌላ አለ[a]፤ ስለ እኔ የሚመሰክረው ምስክርነት እውነት እንደሆነም አውቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ እኔ ምስክርነት የሚሰጥ ሌላ አለ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: ሌላ
  rationale: ቃሉ ከኢየሱስ ራሱ ምስክርነት የተለየ ሌላ መስካሪ መኖሩን ያመለክታል፤ «ሌላ» ማንነቱን ሳይወስን የግሪኩን አጠቃላይነት ይጠብቃል።
- source_word: ὁ μαρτυρῶν
  choice: የሚመሰክር
  rationale: በአሁን ጊዜ የቀረበውን ገላጭ አሳታፊ በተፈጥሯዊ አማርኛ ይገልጣል፤ የምስክርነትንም ሕጋዊ ዳራ ይጠብቃል።
- source_word: περὶ ἐμοῦ
  choice: ስለ እኔ
  rationale: περί ከባለቤት አገባብ ጋር እዚህ የርእስን ወይም የማጣቀሻን ግንኙነት ያሳያል፤ «ስለ እኔ» ትክክለኛና ዘመናዊ አገላለጽ ነው።
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: የግሪኩን ቀጥተኛ የማወቅ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀληθής
  choice: እውነት
  rationale: ምስክርነቱ እውነተኛ መሆኑን በቀጥታ ይገልጣል፤ «ትክክለኛ» ወይም «የሚታመን» ብሎ ትርጉሙን አያጠብም።
- source_word: ἡ μαρτυρία
  choice: ምስክርነት
  rationale: የተሰጠን ማስረጃዊ ንግግር የሚያመለክት ሲሆን በአውዱ ያለውን የፍርድ ቤት ዓይነት ቃና ይጠብቃል።
- source_word: ἣν μαρτυρεῖ
  choice: የሚመሰክረው
  rationale: ከ«ምስክርነት» ጋር ያለውን የቃል ሥር ግንኙነትና የዮሐንስን ሆን ተብሎ የተደገመ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የ«ሌላ» (ἄλλος) ማንነት
  choice: ማንነቱን ሳይገልጽ «ሌላ» ተብሎ ተተርጉሟል።
  alternative: መጥምቁ ዮሐንስ፣ አብ፣ ወይም በሕጋዊ ትርጉም ሌላ ምስክር ብሎ መለየት።
  rationale: ቁጥሩ ራሱ ማጣቀሻውን በግልጽ አይለይም። አውዱ ለትርጓሜ መረጃ ቢሰጥም፣ ትርጉሙ ጽሑፉ ያልወሰነውን ማንነት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መመስከር/ምስክርነት» የሚለው የቃል ሥር ድግግሞሽ የግሪኩን ሥነ ጽሑፋዊና ሕጋዊ ቃና ለመጠበቅ ሆን ተብሎ ተይዟል።
