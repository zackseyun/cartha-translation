id: JHN.5.29
reference: John 5:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: am
  text: መልካም ያደረጉት ለሕይወት ትንሣኤ፣ ክፉ የሠሩት ግን ለፍርድ ትንሣኤ[a] ይወጣሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለፍርድ ትንሣኤ” በሚለው ፈንታ “ለኩነኔ ትንሣኤ” ሊባል ይችላል። ግሪኩ “ፍርድ” ይላል፤ ይህም ሰፋ ያለ ትርጉም አለው። “ኩነኔ” የሚለው በአንዳንድ ትርጉሞች የሚገኘውን የጠበበ ትርጓሜ ያንጸባርቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: ይወጣሉ
  rationale: በቁጥር 28–29 ያለው አውድ ሙታን ከመቃብር መውጣታቸውን ስለሚናገር፣ ይህ ቀጥተኛና ተፈጥሯዊ አማርኛ ነው።
- source_word: τὰ ἀγαθὰ
  choice: መልካም
  rationale: በግሪክ ያለው ቅጽ ‘መልካም ነገሮችን’ የሚል ኃይል ቢኖረውም፣ ‘መልካም ያደረጉት’ በአማርኛ አጭር፣ ተፈጥሯዊና የሥነ ምግባር ትርጉሙን የሚጠብቅ ነው።
- source_word: ποιήσαντες
  choice: ያደረጉት
  rationale: የተፈጸመውን ተግባር በአጠቃላይ ይገልጣል፤ ከ‘መልካም’ ጋርም በዘመናዊ አማርኛ ተስማሚ ነው።
- source_word: ἀνάστασιν ζωῆς
  choice: ለሕይወት ትንሣኤ
  rationale: εἰς የሚያመለክተውን አቅጣጫ በ‘ለ’ ያሳያል፤ የግሪኩን አጭርና ክፍት የስም ግንኙነትም ሳያብራራ ይጠብቃል።
- source_word: φαῦλα
  choice: ክፉ
  rationale: ቃሉ መጥፎ፣ ወራዳ ወይም ዋጋ ቢስ የሆነውን ሊያመለክት ይችላል፤ በዚህ የፍርድ አውድ ‘ክፉ’ የሥነ ምግባር ክብደቱን በግልጽ ያስተላልፋል።
- source_word: πράξαντες
  choice: የሠሩት
  rationale: ከቀደመው ποιήσαντες (‘ያደረጉት’) ያለውን የቃል ልዩነት በቀላሉ ያንጸባርቃል፤ የተግባር አኗኗርንም ሊያመለክት ይችላል።
- source_word: ἀνάστασιν κρίσεως
  choice: ለፍርድ ትንሣኤ
  rationale: κρίσις በመሠረታዊ ትርጉሙ ‘ፍርድ’ ነው። ‘ኩነኔ’ ብሎ ማጥበብ ግሪኩ በራሱ የማያስገድደውን የተወሰነ ውጤት ይጨምራል።
- source_word: δὲ
  choice: ግን
  rationale: በሁለቱ ወገኖችና በየዕጣ ፈንታቸው መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: κρίσεως በጠቅላላው ‘ፍርድ’ ወይስ በጠበበው ‘ኩነኔ’ ተብሎ መተርጎም
  choice: ፍርድ
  alternative: ኩነኔ
  rationale: ቁጥሩ ሁለት የተለያዩ ትንሣኤዎችን ቢያነጻጽርም፣ κρίσις በራሱ ‘ኩነኔ’ የሚለውን የጠበበ ትርጉም አያስገድድም። ‘ፍርድ’ የጽሑፉን ክብደትና የትርጉም ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትንሣኤ’ በመጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደና በስፋት የሚታወቅ ቃል ስለሆነ ተጠብቋል።
