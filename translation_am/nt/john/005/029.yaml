  source_fidelity: ትርጉሙ καὶ ἐκπορεύσονται የሚለውን ለሁለቱም ቡድኖች የሚመለከት «ይወጣሉ» ብሎ በትክክል ያስተላልፋል። τὰ ἀγαθὰ ποιήσαντες እና τὰ φαῦλα πράξαντες በ«መልካም ያደረጉት» እና «ክፉ የሠሩት» ተገቢ ሆነው ተላልፈዋል። ሁለቱ የεἰς ἀνάστασιν ሐረጎች «ለሕይወት ትንሣኤ» እና «ለፍርድ ትንሣኤ» በትይዩ መዋቅር ተጠብቀዋል። κρίσεως ለ«ፍርድ» መስጠቱ ከግሪኩ ሰፊ ትርጉም ጋር ይስማማል።
  naturalness: ጽሑፉ በዘመናዊ መደበኛ አማርኛ ተፈጥሯዊና ግልጽ ነው። በመጨረሻ የተቀመጠው «ይወጣሉ» ለሁለቱም ተዛማጅ ቡድኖች በተፈጥሮ ይሠራል፤ «ግን» ደግሞ የδὲን ተቃርኖ በግልጽ ያሳያል።
  terminology: «ትንሣኤ» በዘመናዊ መደበኛ አማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደ እና ተገቢ ቁልፍ ቃል ነው። «ፍርድ» κρίσιςን ያለ ዶክትሪናዊ ማጥበብ ያቀርባል። የ[a] ማስታወሻ አመልካች በ«ለፍርድ ትንሣኤ» ላይ በትክክል ተያይዟል፤ ማስታወሻውም «ኩነኔ»ን እንደ አማራጭ የጠበበ ንባብ ብቻ በትክክል ያብራራል።
