  text: አንድ መልአክ አልፎ አልፎ ወደ መታጠቢያው ይወርድና ውኃውን ያናውጥ ነበር። ስለዚህ ውኃው ከታወከ በኋላ ቀድሞ የገባው ሰው፣ በማንኛውም በሽታ ቢያዝም ይድን ነበር።[a][b]
  philosophy: optimal-equivalence
