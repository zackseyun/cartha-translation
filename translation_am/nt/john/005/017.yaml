  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: am
  text: እርሱ ግን፣ “አባቴ እስከ አሁን ድረስ እየሠራ ነው፤ እኔም እየሠራሁ ነው” ብሎ መለሰላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ክስ ጋር ያለውን መጠነኛ ንፅፅርና የንግግሩን እድገት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: መለሰላቸው
  rationale: ግሱንና ተዘዋዋሪ ተሳቢውን በአጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: Ὁ πατήρ μου
  choice: አባቴ
  rationale: የግል ዝምድናውንና የአባትነት መለኮታዊ አመልካችነቱን በቀጥታ ይጠብቃል።
- source_word: ἕως ἄρτι
  choice: እስከ አሁን ድረስ
  rationale: ድርጊቱ እስከ አሁኑ ጊዜ መቀጠሉን በግልጽ ያሳያል።
- source_word: ἐργάζεται
  choice: እየሠራ ነው
  rationale: የግሪኩን የአሁን ጊዜ ቀጣይ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: ኢየሱስ የራሱን ሥራ ከአብ ሥራ ጋር ጨምሮ የሚያቀርበውን አጽንዖት ይጠብቃል።
- source_word: ἐργάζομαι
  choice: እየሠራሁ ነው
  rationale: ከአብ ቀጣይ ሥራ ጋር ያለውን ሰዋሰዋዊና ሐሳባዊ ትይዩነት ይጠብቃል።
theological_decisions:
- issue: በሰንበት የኢየሱስ ሥራ ከአብ ሥራ ጋር ያለው ግንኙነት
  choice: “አባቴ እስከ አሁን ድረስ እየሠራ ነው፤ እኔም እየሠራሁ ነው” በማለት ትይዩነቱን በቀጥታ ማቅረብ።
  alternative: “አባቴ እስከ አሁን ይሠራል፤ እኔም እሠራለሁ።”
  rationale: ግሪኩ በአብ ቀጣይ ሥራና በኢየሱስ ሥራ መካከል የታሰበ ትይዩነት ያቀርባል። ትርጉሙ ስለ ሰንበት፣ ስለ መለኮታዊ ሥልጣን ወይም ስለ እኩልነት ጥቆማ ተጨማሪ ማብራሪያ ሳያስገባ ይህን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በአማርኛ “እየሠራ ነው” የሚለው ቀጣይነትን በግልጽ ስለሚያሳይ የእንግሊዝኛው የጊዜ አማራጭ ማስታወሻ አስፈላጊ አልሆነም።
