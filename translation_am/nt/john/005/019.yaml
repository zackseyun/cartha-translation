source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: am
  text: ስለዚህ ኢየሱስ መልሶ እንዲህ አላቸው፤ “እውነት እውነት እላችኋለሁ፤ ወልድ አብ አንድ ነገር ሲያደርግ ካላየ በቀር፣ ከራሱ ምንም ማድረግ አይችልም፤[a] እርሱ የሚያደርገውን ሁሉ ወልድም እንደዚያው ያደርጋል።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወልድ ከራሱ ምንም ማድረግ አይችልም፤ አብ ሲያደርግ ከሚያየው በቀር።”
    reason: lexical_alternative
  - marker: b
    text: «እርሱ» አብን በአጽንዖት ያመለክታል፤ ንግግሩም ወልድ አብ የሚያደርገውን ሁሉ በተመሳሳይ ማድረጉን ያሳያል።
    reason: cross_reference
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: ስለዚህ ኢየሱስ መልሶ እንዲህ አላቸው
  rationale: οὖν የሚያሳየውን ከቀደመው ንግግር ጋር ያለ ግንኙነት “ስለዚህ” ይጠብቃል። የግሪኩ “መለሰ እና ይላቸው ነበር” አወቃቀር በተፈጥሯዊ የአማርኛ ትረካ “መልሶ እንዲህ አላቸው” ተሰጥቷል።
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: እውነት እውነት እላችኋለሁ
  rationale: ድግግሞሹንና የተከበረውን አጽንዖት ለዘመናዊ አንባቢ ግልጽ በሆነ መንገድ ይጠብቃል።
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδέν
  choice: ወልድ ከራሱ ምንም ማድረግ አይችልም
  rationale: οὐ δύναται ያለውን የችሎታ አሉታዊ አገላለጽና ἀφ’ ἑαυτοῦ ያለውን የምንጭ/ራስን ብቻ መሠረት የማድረግ ሐሳብ ይጠብቃል። “ወልድ” እዚህ ልዩ የክርስቶስ ማዕረግ ነው።
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: አብ ሲያደርግ ካየው በቀር
  rationale: የἐὰν μή ልዩ ሁኔታን “ካየው በቀር” በማለት በተፈጥሯዊ አማርኛ ይገልጣል፤ የτι ያልተወሰነ ነገር በአማርኛው ግስና ተውላጠ ስም ውስጥ በቂ ሁኔታ ተካቷል።
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: እርሱ የሚያደርገውን ሁሉ
  rationale: relative + ἄν + subjunctive ያለውን አጠቃላይና ያልተወሰነ ትርጉም “የሚያደርገውን ሁሉ” ያሳያል፤ “እርሱ” የἐκεῖνοςን አጽንዖት ያንጸባርቃል።
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: ወልድም እንደዚያው ያደርጋል
  rationale: καί እና ὁμοίως ያላቸውን ተመሳሳይ አሠራርና ፍጹም መመሳሰል “ወልድም እንደዚያው” በሚል ግልጽ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የወልድን አለመቻል እና ከአብ ጋር ያለውን የድርጊት ግንኙነት እንዴት መግለጽ እንደሚገባ
  choice: ወልድ አብ ሲያደርግ ካየው በቀር ከራሱ ምንም ማድረግ አይችልም
  alternative: ወልድ በራሱ ተነሳስቶ ምንም አያደርግም
  rationale: የተመረጠው አተረጓጎም οὐ δύναται ያለውን ግልጽ የችሎታ ቃል ሳያለዝብ ያስቀምጣል። ጥቅሱ በድርጊት ያለውን የአብና የወልድ ፍጹም አንድነትና የወልድን ከአብ ያልተለየ አሠራር ይገልጣል፤ ከጽሑፉ በላይ የሆነ ኦንቶሎጂያዊ ድምዳሜ በዋናው ጽሑፍ አይጨመርም።
- issue: ὁ υἱός እና ὁ πατήρ እንደ መለኮታዊ ማዕረጎች መተርጎም
  choice: ወልድ / አብ
  alternative: ልጁ / አባቱ
  rationale: በዮሐንስ አውድ “ወልድ” እና “አብ” የኢየሱስንና የአብን ልዩ ግንኙነት የሚያሳዩ ማዕረጎች ናቸው። ይህ ምርጫ የግሪኩን የተወሰነ አጠቃቀም ይጠብቃል።
