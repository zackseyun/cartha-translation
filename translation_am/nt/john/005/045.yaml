  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: am
  text: «በአብ ፊት እኔ እከሳችኋለሁ ብላችሁ አታስቡ፤[a] የሚከሳችሁ አለ፤ እርሱም ተስፋችሁን የጣላችሁበት ሙሴ ነው።[b]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአብ ፊት ክስ እንደማቀርብባችሁ አታስቡ።»
    reason: lexical_alternative
  - marker: b
    text: ይኸውም፣ በተለይ ለሕጉ መካከለኛና ምስክር እንደሆነ የታመኑበት ሙሴ ከሳሻቸው ሆኖ ይቆማል።
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: አታስቡ
  rationale: የአሁን ጊዜ ትእዛዛዊ አሉታዊ አገላለጹን ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κατηγορήσω
  choice: የምከሳችሁ
  rationale: κατηγορέω የሕግ ክስ ማቅረብን ያመለክታል፤ ‘እፈርድባችኋለሁ’ ከሚለው ይልቅ የቃሉን ወሰን ይጠብቃል።
- source_word: πρὸς τὸν πατέρα
  choice: በአብ ፊት
  rationale: ክስ በሚቀርብበት ፊት ወይም መገኘት ያለውን የፍርድ ቤት ምስል በተፈጥሯዊ አማርኛ ያሳያል፤ ‘አብ’ የሚለውን የዮሐንስ መጠሪያም ይጠብቃል።
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: የሚከሳችሁ አለ
  rationale: ሌላ ከሳሽ መኖሩን ያስተዋውቃል፤ የአሁን ጊዜ አሳቢውንም ቀጣይ ኃይል ይጠብቃል።
- source_word: Μωϋσῆς
  choice: ሙሴ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: εἰς ὃν ὑμεῖς ἠλπίκατε
  choice: ተስፋችሁን የጣላችሁበት
  rationale: εἰς የሚያመለክተውን በአንድ ሰው ላይ ተስፋን ማኖርና የፍጹም ጊዜውን የቀጠለ ውጤት በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የክሱ ሕጋዊ ትርጉም
  choice: ‘የምከሳችሁ’ በሚል የሕግ ቃል ተተርጉሟል።
  alternative: ‘የምፈርድባችሁ’ ወይም ‘የምኮንናችሁ’
  rationale: κατηγορέω ክስ ማቅረብን እንጂ የመጨረሻ ፍርድን አያመለክትም፤ ስለዚህ ጽሑፉ ከሚለው በላይ የሆነ ሥነ መለኮታዊ ውሳኔ አልገባም።
- issue: በሙሴ ላይ የተጣለው ተስፋ
  choice: ተስፋው በቀጥታ በሙሴ ላይ እንደተጣለ ተጠብቋል።
  alternative: ‘በሙሴ ሕግ’ ወይም ‘በሙሴ ጽሑፎች’
  rationale: ዐውዱ የሙሴን ጽሑፎች ቢያካትትም፣ ግሪኩ ራሱን ሙሴን ይጠቅሳል፤ ትርጉሙም ይህን የጽሑፉን ግልጽ አገላለጽ ጠብቋል።
translation_notes:
  register: ትርጉሙ ቀጥተኛ፣ ክቡርና ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ነው። የሕግ ቃላት ምስሉን ሳያጠናክሩ ወይም ሳያዳክሙ ተጠብቀዋል፤ የግሪኩ ቀጥተኛ የሙሴ ማጣቀሻም አልተለወጠም።
