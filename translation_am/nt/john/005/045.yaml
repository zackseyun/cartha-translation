    rationale: «የምከሳችሁ እኔ ነኝ ብላችሁ አታስቡ» means, in effect, “Do not think that I am the one accusing you,” whereas μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν means “Do not think that I will accuse you.” The future action must be retained.
