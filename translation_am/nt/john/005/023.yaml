  text: ሁሉም አብን እንደሚያከብሩት ሁሉ ወልድንም እንዲያከብሩ ነው። ወልድን የማያከብር እርሱን የላከውን አብ አያከብርም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: እንዲያከብሩ ነው
  rationale: የግሪኩን የዓላማ/ውጤት ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ አንቀጹ ከቀደመው ሐሳብ ጋር ያለውን ትስስርም ይጠብቃል።
- source_word: πάντες
  choice: ሁሉም
  rationale: ሰዎችን በአጠቃላይ የሚያመለክተውን ብዙ ቁጥር በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: ያከብራሉ / የማያከብር / አያከብርም
  rationale: τιμάω የሚያመለክተውን ክብር መስጠት በቀጥታ ይገልጣል፤ በቁጥሩ ውስጥ ያለውን የግስ ድግግሞሽና ተጓዳኝነት ይጠብቃል።
- source_word: τὸν υἱὸν
  choice: ወልድን
  rationale: በዮሐንስ አውድ የክርስቶስ መጠሪያ መሆኑን የሚጠብቅ፣ በአማርኛ ክርስቲያናዊ ንግግር የታወቀና የተከበረ ቃል ነው።
- source_word: καθὼς
  choice: እንደሚያከብሩት ሁሉ
  rationale: በአብና በወልድ መካከል ካለው ክብር ጋር የተያያዘውን ጠንካራ ንጽጽር ሳያለዝብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: በአውዱ የእግዚአብሔር የግል መጠሪያ መሆኑን የሚያሳይ፣ በዘመናዊ መደበኛ አማርኛም የሚታወቅ አጭር ስያሜ ነው።
- source_word: ὁ μὴ τιμῶν
  choice: የማያከብር
  rationale: የግሪኩን መደባዊ፣ ማንኛውንም ሰው የሚመለከት አገላለጽ በአማርኛ የተለመደ የዝምድና ግስ ያስተላልፋል።
- source_word: τὸν πέμψαντα αὐτόν
  choice: እርሱን የላከውን
  rationale: አብ ላኪው እንደሆነ በግልጽ ያሳያል፤ αὐτόν ወደ ወልድ የሚመለሰውን ተውላጠ ስምም ሳያስወግድ ይጠብቃል።
- source_word: πέμψαντα
  choice: የላከውን
  rationale: πέμπω የሚለውን መሠረታዊ ‘መላክ’ ትርጉም ይጠብቃል፤ ‘ሾመ’ ወይም ‘ተልእኮ ሰጠ’ በማለት ያልተገለጸ ሐሳብ አይጨምርም።
theological_decisions:
- issue: ወልድን ማክበር ከአብን ማክበር ጋር ያለው የንጽጽር ኃይል
  choice: καθὼς የሚለውን ‘እንደሚያከብሩት ሁሉ’ በማለት ጠንካራውን ተጓዳኝነት መጠበቅ
  alternative: ‘እንደ’ ብቻ በማለት ደካማ ንጽጽር ማድረግ
  rationale: ግሪኩ ለወልድና ለአብ የሚሰጠውን ክብር በጠንካራ ንጽጽር ያቀርባል። ትርጉሙ ይህን ሳያለዝብ ይጠብቃል፤ ነገር ግን ከጥቅሱ በኋላ የተቀረጸ የእምነት ቃላትን አያስገባም።
- issue: ‘ወልድ’ እና ‘አብ’ እንደ መጠሪያዎች መተርጎም
  choice: በአውዱ የተወሰኑ መለኮታዊ/ግላዊ መጠሪያዎች እንደሆኑ ‘ወልድ’ እና ‘አብ’ መጠቀም
  alternative: አጠቃላይ የዝምድና ቃላት በሆኑት ‘ልጅ’ እና ‘አባት’ መተርጎም
  rationale: በዮሐንስ ንግግር ውስጥ ጠቋሚዎቹ ኢየሱስና እግዚአብሔር አብ መሆናቸው ግልጽ ነው። የተመረጡት ቃላት ይህን የመጠሪያ አጠቃቀም ያሳያሉ፤ ተጨማሪ የእምነት አቋም ግን አያስገቡም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። ‘አብ’ እና ‘ወልድ’ በክርስቲያናዊ አማርኛ የታወቁ ሲሆኑ፣ የጥቅሱን መጠሪያዊ ክብደትና ትይዩነት ይጠብቃሉ። የግሪኩ ድግግሞሽ በ‘ማክበር’ ግስ ወጥነት ተጠብቋል።
