- issue: የአሁን ጊዜው ἔχει እና የፍጹም ጊዜው μεταβέβηκεν ስለ ድነት የሚያሳዩት
  choice: የዘላለም ሕይወት አሁን ያለ ሀብት ነው፤ ከሞት ወደ ሕይወት መሻገሩም ተፈጽሞ ውጤቱ የቀጠለ ነው
  alternative: ሕይወቱና ከፍርድ ነፃ መሆኑ ወደፊት ብቻ የሚሆኑ ናቸው
  rationale: የግሶቹ ጊዜና ገጽታ አሁናዊ ባለቤትነትንና የተፈጸመ ነገር ቀጣይ ውጤትን ያሳያሉ፤ ይህን ማቅረብ ከጽሑፉ በላይ የሆነ የቤተ እምነት ሥርዓት አያስገባም።
