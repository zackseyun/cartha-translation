  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: am
  text: እውነት እውነት እላችኋለሁ፤ ቃሌን የሚሰማና የላከኝን የሚያምን የዘላለም ሕይወት አለው፤ ወደ ፍርድም[a] አይመጣም፤ ነገር ግን ከሞት ወደ ሕይወት ተሻግሯል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ኩነኔ።” የግሪኩ κρίσις በአጠቃላይ “ፍርድ” ወይም በዚህ አውድ መጥፎ ውጤት ያለውን ፍርድ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ፍጹም ጊዜ ግስ ሽግግሩ እንደተፈጸመና ውጤቱም እንደቀጠለ ያመለክታል፤ ስለዚህ “ተሻግሯል” ወይም “አልፏል” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የተደገመውን የማረጋገጫ ቃልና አጽንዖቱን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων
  choice: ቃሌን የሚሰማና … የሚያምን
  rationale: የአሁን ጊዜ አሳታፊ ግሶቹን አጠቃላይና ቀጣይ ባሕርይ የሚገልጽ ተዛማጅ አረፍተ ነገር አድርጎ ያቀርባል።
- source_word: τὸν λόγον μου
  choice: ቃሌን
  rationale: የኢየሱስን ንግግርና መልእክት ሲያመለክት የዮሐንስን የ‘ቃል’ አጠቃቀም ይጠብቃል።
- source_word: πιστεύων τῷ πέμψαντί με
  choice: የላከኝን የሚያምን
  rationale: πιστεύω ከመስጫ ቅጽ ጋር ያለውን ‘አንድን ሰው ማመን/መታመን’ ፍቺ በቀጥታ ያስተላልፋል።
- source_word: ἔχει ζωὴν αἰώνιον
  choice: የዘላለም ሕይወት አለው
  rationale: ἔχει የሚገልጸውን አሁናዊ ባለቤትነት ይጠብቃል፤ ‘የዘላለም ሕይወት’ም በዮሐንስ ወንጌል ያለውን የተለመደ ፍቺ በግልጽ ያቀርባል።
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: ወደ ፍርድም አይመጣም
  rationale: εἰς ያለውን አቅጣጫዊ ኃይል ይጠብቃል፤ κρίσιςንም በሰፊው ‘ፍርድ’ ብሎ በመተርጎም በቀጥታ ‘ኩነኔ’ ብሎ አይወስነውም።
- source_word: μεταβέβηκεν
  choice: ተሻግሯል
  rationale: የፍጹም ጊዜ ግሱ የሚያሳየውን የተፈጸመና ውጤቱ የቀጠለ ሽግግር ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: ከሞት ወደ ሕይወት
  rationale: የἐκ እና εἰςን አቅጣጫ እንዲሁም በሞትና በሕይወት መካከል ያለውን ጠንካራ ተቃርኖ ይጠብቃል።
theological_decisions:
- issue: በዚህ የድነት አውድ κρίσις የሚያመለክተው
  choice: ፍርድ
  alternative: ኩነኔ
