review_pass:
  verdict: revise
  source_fidelity: 'The main sense is faithful: the Father who sent Jesus is emphatically identified as the one who has testified concerning him; the audience has never heard his voice or seen his form. However, the first phrase has an incorrect object suffix: የላከኝም means “who sent me too/also,” not “who sent me.”'
  naturalness: Apart from that suffix, the wording is clear and modern. The paired clauses are more naturally punctuated with a comma rather than a semicolon in Amharic. Retaining ከቶ in both coordinated negatives makes πώποτε’s “ever” force unambiguously apply to both perfect verbs.
  terminology: አብ, መስክሯል, ድምፁን, and መልኩን are appropriate. መልኩን preserves the deliberate breadth of εἶδος without deciding between visible form and appearance. እርሱ ራሱ naturally conveys the emphasis of ἐκεῖνος without imposing doctrine.
  issues:
  - severity: high
    issue: የላከኝም is used instead of የላከኝ.
    rationale: The final -ም adds “also/too” and is not present in ὁ πέμψας με. This changes the source meaning and also creates an unintended contrastive implication.
  - severity: low
    issue: The second ከቶ is omitted.
    rationale: Greek πώποτε is syntactically associated with the coordinated “neither ... nor” construction. While the draft can be understood as extending it over both verbs, repeating ከቶ gives the full “neither ever ... nor ever ...” force clearly and naturally.
  revised_text: የላከኝ አብ፣ እርሱ ራሱ ስለ እኔ መስክሯል[a]። እናንተ ድምፁን ከቶ ሰምታችሁ አታውቁም፣ መልኩንም[b] ከቶ አይታችሁ አታውቁም፤
