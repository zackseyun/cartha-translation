review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the man, preserves Jesus’ unspecified knowledge, and renders the question as a desire for physical restoration. However, “መዳን” can naturally signify spiritual salvation in Amharic and does not adequately retain ὑγιὴς γενέσθαι, “to become well/healthy.” The duration expression is also unnecessarily awkward.
  naturalness: “ተኝቶ አይቶ” is understandable, but “ተኝቶ ሳለ አይቶ” more naturally makes clear that Jesus saw the man while he was lying down. “እንዲህም ሆኖ ከቆየ ብዙ ጊዜ እንደሆነ” is stilted modern Amharic; a condition-focused formulation is clearer and still avoids specifying how Jesus knew.
  terminology: Use “ጤናማ መሆን” for ὑγιὴς γενέσθαι. It directly denotes becoming healthy and avoids importing the potentially theological sense of “መዳን.”
  issues:
  - severity: medium
    issue: “መዳን” for ὑγιὴς γενέσθαι
    rationale: In modern Amharic, መዳን readily carries the meaning “salvation/deliverance.” The Greek question concerns becoming physically well; “ጤናማ መሆን” preserves this without added theological ambiguity.
  - severity: low
    issue: Awkward duration clause
    rationale: “እንዲህም ሆኖ ከቆየ ብዙ ጊዜ እንደሆነ” is not idiomatic. “ቀድሞውኑ ለረጅም ጊዜ በዚህ ሁኔታ እንደቆየ” is natural while retaining the condition-oriented contextual sense.
  - severity: low
    issue: Posture participle attachment
    rationale: Adding “ሳለ” to “ተኝቶ” clearly and naturally expresses that the man was lying down when Jesus saw him.
  revised_text: ኢየሱስም ይህን ሰው ተኝቶ ሳለ አይቶ፣ ቀድሞውኑ ለረጅም ጊዜ በዚህ ሁኔታ እንደቆየ አውቆ፣ “ጤናማ መሆን ትፈልጋለህ?” አለው።[a]
