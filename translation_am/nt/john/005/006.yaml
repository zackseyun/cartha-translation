base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: am
  text: ኢየሱስም ይህን ሰው ተኝቶ ሳለ አይቶ፣ ቀድሞውኑ ለረጅም ጊዜ በዚህ ሁኔታ እንደቆየ አውቆ፣ “ጤናማ መሆን ትፈልጋለህ?” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚያ ለረጅም ጊዜ እንደቆየ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: ይህን ሰው
  rationale: በአውዱ የተጠቀሰውን የታመመ ሰው በግልጽና በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἰδὼν
  choice: አይቶ
  rationale: የግሪኩን ቀዳሚ ድርጊት በተፈጥሯዊ የአማርኛ ቦዝ አንቀጽ ያቀርባል።
- source_word: κατακείμενον
  choice: ተኝቶ
  rationale: ሰውየው በዚያ ተዘርግቶ የነበረበትን አኳኋን በቀላል ዘመናዊ አማርኛ ይገልጣል።
- source_word: γνοὺς
  choice: አውቆ
  rationale: ኢየሱስ ሁኔታውን እንዳወቀ ይገልጣል፤ ይህን እውቀት እንዴት እንዳገኘ ግን አይወስንም።
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: እንዲህም ሆኖ ከቆየ ብዙ ጊዜ እንደሆነ
  rationale: በግሪኩ ግስ የሚታየውን የቆይታ ጊዜ ከሰውየው ሁኔታ ጋር ያያይዛል፤ በቦታው መቆየቱን ወይም ሕመሙን ብቻ በግድ አይወስንም።
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: Θέλεις
  choice: ትፈልጋለህ
  rationale: ፍላጎትን ወይም ፈቃደኝነትን በቀጥተኛና በዘመናዊ አነጋገር ይገልጣል።
- source_word: ὑγιὴς γενέσθαι
  choice: መዳን
  rationale: ከሕመም ወይም ከአካል ጉዳት ወደ ጤናማ ሁኔታ መለወጥን በአማርኛ የተለመደ አገላለጽ ያቀርባል።
theological_decisions:
- issue: በγνοὺς የተገለጠው የኢየሱስ እውቀት ምንጭ
  choice: ኢየሱስ እንዳወቀ ብቻ መግለጽ
  alternative: በተአምራዊ መንገድ አወቀ ወይም ከሰዎች ሰምቶ አወቀ ብሎ መወሰን
  rationale: ጥቅሱ እውቀቱን ይገልጣል እንጂ ምንጩን አይገልጥም፤ ትርጉሙም ይህን ገደብ ይጠብቃል።
- issue: ὑγιὴς γενέσθαι የሚያመለክተው የመዳን ዓይነት
  choice: በአውዱ ከሰውየው የአካል ሁኔታ መዳን
  alternative: መንፈሳዊ ድነትን በግልጽ መጨመር
  rationale: በቅርብ አውዱ ጥያቄው ስለ ሰውየው ጤናማ መሆን ነው፤ ትርጉሙ ተጨማሪ የነገረ መለኮት ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ዋናው ጽሑፍ የግሪኩን πολὺν ἤδη χρόνον ἔχει አጭርነትና የማጣቀሻ አሻሚነት ለመጠበቅ “እንዲህም ሆኖ ከቆየ” ይላል፤ የቦታ ትርጉሙ በማስታወሻ ቀርቧል።
