id: JHN.5.11
reference: John 5:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: am
  text: እርሱ ግን፣ “ጤናማ ያደረገኝ እርሱ ራሱ፣ ‘ምንጣፍህን አንሥተህ ተራመድ’ አለኝ” ብሎ መለሰላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰላቸው
  rationale: በትረካዊ ውይይት ውስጥ የተለመደና ቀጥተኛ አተረጓጎም ነው፤ αὐτοῖς የሚለውንም በድርጊቱ ውስጥ ያካትታል።
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: ያዳነኝ
  rationale: በዚህ የፈውስ ዐውድ ሰውየውን ከሕመሙ ጤናማ ማድረግን በተፈጥሯዊ አማርኛ ይገልጣል፤ ሰፊ መንፈሳዊ ትርጉም አያስገባም።
- source_word: ἐκεῖνός
  choice: እርሱ ራሱ
  rationale: በግሪኩ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Ἆρον
  choice: አንሥተህ
  rationale: እቃውን ከተቀመጠበት ማንሣትን የሚገልጽ ግልጽና ዘመናዊ ቃል ነው።
- source_word: κράβαττόν
  choice: ምንጣፍህን
  rationale: ቃሉ ቀላል የመኝታ ምንጣፍን ወይም ተነጣፊ አልጋን ያመለክታል፤ ‘አልጋ’ በዘመናዊ አንባቢ ዘንድ ትልቅ የቤት ዕቃ ሊያስታውስ ይችላል።
- source_word: περιπάτει
  choice: ተራመድ
  rationale: ትእዛዙን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል፤ የአሁን ጊዜውን ገጽታ ከዐውዱ በላይ አያጎላም።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ክስ ጋር ያለውን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የፈውሱ መግለጫ ሊኖረው የሚችለው ሰፊ መንፈሳዊ ፍቺ
  choice: ያዳነኝ
  alternative: ፍጹም ያደረገኝ / ያቀናኝ
  rationale: የቅርብ ዐውዱ አካላዊ ፈውስን ይናገራል። ከግሪኩ ያልተጠየቀ የመንፈሳዊ ፍጹምነት አስተምህሮ እንዳይገባ ተጨባጩ የፈውስ ትርጉም ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ἐκεῖνός አጽንዖት ‘እርሱ ራሱ’ በሚለው ተጠብቋል። የቀረበው የእንግሊዝኛ ጽሑፍ የግርጌ ማስታወሻ ምልክቶችና ይዘቶች የማይጣጣሙ ስለሆኑ፣ ከግሪክ ምንጭ የሚያስፈልግ ልዩ ማስታወሻ ባለመኖሩ በዋናው ጽሑፍ ውስጥ ምልክት አልገባም።
