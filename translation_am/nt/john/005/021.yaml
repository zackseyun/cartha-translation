id: JHN.5.21
reference: John 5:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: am
  text: ምክንያቱም አብ ሙታንን እንደሚያስነሣና ሕይወት እንደሚሰጣቸው፣ እንዲሁ ወልድም ለሚፈልጋቸው ሕይወት ይሰጣል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: እንደሚ…
  rationale: γάρ የሚያሳየው ማብራሪያዊ ግንኙነት በአማርኛው ዐውደ ንግግር በተፈጥሮ ይገባል፤ ὥσπερ የሚከፍተው ንጽጽር ደግሞ ‘እንደሚ… እንዲሁ’ በሚለው ተጠብቋል።
- source_word: ὁ πατὴρ
  choice: አብ
  rationale: በዮሐንስ ዐውድ እግዚአብሔርን እንደ አብ የሚጠቅሰውን መለኮታዊ መጠሪያ በክቡርና በተለመደ የአማርኛ ቃል ያስተላልፋል።
- source_word: ἐγείρει τοὺς νεκρούς
  choice: ሙታንን ያስነሣል
  rationale: በትንሣኤ ዐውድ ἐγείρω የሚያመለክተውን ‘ከሞት ማስነሣት’ በግልጽ ያስተላልፋል።
- source_word: ζῳοποιεῖ
  choice: ሕያዋን ያደርጋል
  rationale: ግሱ ሕይወትን መስጠትን ወይም ሕያው ማድረግን ያመለክታል፤ ‘ሕያዋን ያደርጋል’ ሁለቱንም ጊዜ በትይዩነት የሚያቀርብ ተፈጥሯዊ አማርኛ ነው።
- source_word: οὕτως καὶ
  choice: እንዲሁ …ም
  rationale: በአብና በወልድ ድርጊት መካከል ያለውን ተጓዳኝ ንጽጽር ይጠብቃል።
- source_word: ὁ υἱὸς
  choice: ወልድ
  rationale: በአብ–ወልድ ትይዩነት ውስጥ ያለውን ክርስቶሳዊ መጠሪያ በተለመደና ክቡር መልኩ ያቀርባል።
- source_word: οὓς θέλει
  choice: የሚፈልጋቸውን
  rationale: θέλω ያለውን የፈቃድና የምርጫ ኃይል በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል፤ ዘመድ ተውላጠ ስሙ ብዙ ሰዎችን መጥቀሱም ተጠብቋል።
theological_decisions:
- issue: አብና ወልድ ሕይወትን በመስጠት ያላቸው ትይዩነት
  choice: ‘እንደሚ… እንዲሁ ወልድም’ በሚል ግልጽ ትይዩነት ተተርጉሟል።
  alternative: የወልድን ድርጊት ከአብ ድርጊት ያነሰ እንዲመስል በለሰለሰ አገላለጽ መተርጎም።
  rationale: ግሪኩ ሁለቱን ሕይወት ሰጪ ድርጊቶች በቀጥታ ያነጻጽራል፤ ትርጉሙ ይህን ክርስቶሳዊ ኃይል ሳይቀንስና ተጨማሪ ሥነ መለኮታዊ ማብራሪያ ሳያክል ጠብቋል።
- issue: θέλει እና የወልድ ፈቃድ
  choice: ‘የሚፈልጋቸውን’
  alternative: ‘የወደዳቸውን’ ወይም ‘የፈቀደላቸውን’
  rationale: ‘የሚፈልጋቸውን’ የግሱን ቀጥተኛ የፈቃድ ትርጉም ይጠብቃል፤ ‘የፈቀደላቸውን’ የፈቃዱን አቅጣጫ ሊቀይር ሲችል፣ ‘የወደዳቸውን’ ደግሞ የፍቅር ሐሳብን ሊጨምር ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አብ’ እና ‘ወልድ’ በመጽሐፍ ቅዱሳዊ አጠቃቀም የተለመዱ ሲሆኑ፣ ‘ሕያዋን ያደርጋል’ የζῳοποιεῖን ድግግሞሽ በሁለቱም ሐረጎች አንድ ዓይነት ጠብቋል።
