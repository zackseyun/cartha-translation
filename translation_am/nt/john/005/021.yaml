revisions:
- from: አብ ሙታንን እንደሚያስነሣና ሕያዋን እንደሚያደርጋቸው፣ እንዲሁ ወልድም የሚፈልጋቸውን ሕያዋን ያደርጋል።
  to: ምክንያቱም አብ ሙታንን እንደሚያስነሣና ሕይወት እንደሚሰጣቸው፣ እንዲሁ ወልድም ለሚፈልጋቸው ሕይወት ይሰጣል።
  rationale: The revision supplies ‘ምክንያቱም’ for γάρ, preserves the ‘እንደሚ… እንዲሁ’ comparison, and renders both occurrences of ζῳοποιεῖ consistently as giving life. ‘ለሚፈልጋቸው’ naturally expresses ‘to whom he wishes’ without narrowing or interpreting the Son’s will.
