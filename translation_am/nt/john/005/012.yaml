id: JHN.5.12
reference: John 5:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: am
  text: ስለዚህ ጠየቁት፦ «‘አንሣውና ተራመድ’ ያለህ ሰው ማን ነው?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ጠየቁት
  rationale: የግሱን ያለፈ ጊዜና የብዙ ቁጥር አድራጊዎች፣ እንዲሁም αὐτόν የሚያመለክተውን ተሳቢ በተፈጥሯዊ አማርኛ ያሳያል፤ ከጽሑፉ በላይ የጥላቻ ስሜት አይጨምርም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር የሚቀጥለውን ምክንያታዊና ትረካዊ ግንኙነት ያሳያል።
- source_word: ὁ ἄνθρωπος
  choice: ሰው
  rationale: እዚህ ቃሉ አንድን የተወሰነ ወንድ ግለሰብ ያመለክታል፤ በአማርኛ ‘ሰው’ በዚህ ዐውድ ተፈጥሯዊና ግልጽ ነው።
- source_word: ὁ εἰπών σοι
  choice: ያለህ
  rationale: በግሪክኛው ያለውን ገላጭ ቦዝ አንቀጽና ሁለተኛ መደብ ነጠላ ተውላጠ ስም በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἆρον
  choice: አንሣው
  rationale: ትእዛዛዊ አንቀጹን ይጠብቃል። በግሪክኛ ተሳቢው በግልጽ ባይጠቀስም፣ የአማርኛው ‘-ው’ ከቀደመው ዐውድ የሚታወቀውን ምንጣፍ ወይም መኝታ ያመለክታል።
- source_word: καὶ περιπάτει
  choice: እና ሂድ
  rationale: የግሪክኛውን አያያዥና የመራመድ ትእዛዝ በተለመደ አማርኛ ያቀርባል፤ የግሱን ገጽታ ከልክ በላይ አይተረጉምም።
