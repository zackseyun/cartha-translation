review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal relation and the reference to the one sent by the Father. However, it obscures the Greek construction ἔχετε ... μένοντα ('you have ... abiding') by making the word simply the subject of 'does not remain,' and its final clause lacks the Amharic object pronoun needed to express believing the one sent.
  naturalness: «በውስጣችሁ የሚኖር የእርሱ ቃል የላችሁም» is clear, modern, and idiomatic while retaining the participial sense. «አታምኑትም» naturally and explicitly takes the sent one as the object of belief.
  terminology: «ቃል» appropriately renders λόγος and retains Johannine wording. «የሚኖር» conveys μένων without importing doctrinal implications; the alternative «የሚቀር» is supplied in a lexical footnote. The pronouns preserve the source's contextual references without inserting names absent from the verse.
  issues:
  - severity: medium
    issue: The opening clause does not adequately represent 'you do not have his word abiding in you.'
    rationale: «ቃሉም በውስጣችሁ ጸንቶ አይኖርም» makes the word the subject and omits the possessive/experiential force of ἔχετε. The revision restores this with «... ቃል የላችሁም».
  - severity: medium
    issue: The sent one is not grammatically marked as the object of belief in the final clause.
    rationale: «የላከውን ... አታምኑም» leaves the accusative relative phrase syntactically unresolved in natural Amharic. Adding «-ት» in «አታምኑትም» makes the intended personal object explicit.
  - severity: low
    issue: «ጸንቶ» adds a nuance of firmness not explicitly present in μένων.
    rationale: The participle primarily denotes continuing presence/remain. «የሚኖር» is more direct and preserves the aspect without additional emphasis.
  revised_text: በውስጣችሁ የሚኖር[a] የእርሱ ቃል የላችሁም፤ ምክንያቱም እርሱ የላከውን እናንተ አታምኑትም።
  revised_footnotes:
  - marker: a
    text: ወይም፣ «በውስጣችሁ የሚቀር»።
    reason: μέρων/μένων የሚያመለክተውን ቀጣይ መኖር ወይም መቅረት የሚያሳይ የቃል አማራጭ።
  revision_rationale: The revision restores the Greek 'have ... abiding' relationship, explicitly represents the personal object of πιστεύετε in idiomatic Amharic, and avoids the added firmness nuance of «ጸንቶ». It retains the source's causal connection and contextual pronouns without adding doctrinal interpretation.
