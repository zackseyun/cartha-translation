id: JHN.5.38
reference: John 5:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: am
  text: በውስጣችሁ የሚኖር[a] የእርሱ ቃል የላችሁም፤ ምክንያቱም እርሱ የላከውን እናንተ አታምኑትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በውስጣችሁ የሚቀር»።
    reason: μέρων/μένων የሚያመለክተውን ቀጣይ መኖር ወይም መቅረት የሚያሳይ የቃል አማራጭ።
lexical_decisions:
- source_word: λόγον
  choice: ቃሉ
  rationale: በዚህ አውድ የእግዚአብሔርን የተገለጠ ቃል ያመለክታል፤ «ቃል» የዮሐንስን አገላለጽና ሰፊ የትርጉም ግንኙነቱን ይጠብቃል።
- source_word: ἐν ὑμῖν μένοντα
  choice: በውስጣችሁ ጸንቶ አይኖርም
  rationale: μένω የሚያመለክተውን ቀጣይና ዘላቂ መኖር «ጸንቶ መኖር» በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል። የግሪኩን የ«መያዝ» አወቃቀር ቃል በቃል ማስተላለፍ በአማርኛ የማይፈጥሯዊ ስለሆነ እዚህ የመኖር አገላለጽ ተመርጧል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዚህ ስፍራ ቀጥሎ ያለው ሐረግ ቃሉ በውስጣቸው ጸንቶ የማይኖርበትን ምክንያት ይገልጣል።
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: እርሱ የላከውን
  rationale: ἐκεῖνος በአውዱ አብን ያመለክታል፤ የተላከው ደግሞ ኢየሱስ ነው። አገላለጹ ግልጽ ሆኖ ሳለ ግሪኩ በግልጽ ያልጠቀሰውን ስም አይጨምርም።
- source_word: τούτῳ ὑμεῖς οὐ πιστεύετε
  choice: እናንተ አታምኑም
  rationale: የተገለጸው ቀጥተኛ ተቃርኖና በὑμεῖς ላይ ያለው አጽንዖት «እናንተ»ን በግልጽ በማካተት ተጠብቋል፤ «ማመን» የπιστεύωን መሠረታዊ ትርጉም ያቀርባል።
theological_decisions:
- issue: በእነርሱ ውስጥ የእግዚአብሔር ቃል አለመኖርና በተላከው ማመን አለመቻላቸው ያላቸው ግንኙነት
  choice: ጥቅሱ በአብ የተላከውን አለማመናቸውን፣ የአብ ቃል በውስጣቸው ጸንቶ እንደማይኖር ምክንያት ወይም ማስረጃ አድርጎ ያቀርባል።
  alternative: ይህ በልባቸው ቅዱሳት መጻሕፍትን አለመጠበቃቸውን ወይም አለመታዘዛቸውን ብቻ እንደሚገልጥ ሊነበብ ይችላል።
  rationale: ትርጉሙ የጽሑፉን የምክንያት ግንኙነትና የዮሐንስን «መኖር» ጭብጥ ይጠብቃል፤ ስለ ዳግም መወለድ፣ መጽናት ወይም መንፈሳዊ ብርሃን የተለየ የእምነት ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጸንቶ መኖር» የμένωን ቀጣይነት ያሳያል፤ ከመጠን በላይ ቤተ ክርስቲያናዊ ወይም ጥንታዊ ቃላት አልተጨመሩም።
