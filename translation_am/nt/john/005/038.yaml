revisions:
- from: ቃሉም በውስጣችሁ ጸንቶ አይኖርም፤[a] ምክንያቱም እርሱ የላከውን እናንተ አታምኑም።
  to: በውስጣችሁ የሚኖር[a] የእርሱ ቃል የላችሁም፤ ምክንያቱም እርሱ የላከውን እናንተ አታምኑትም።
  rationale: The revision restores the Greek 'have ... abiding' relationship, explicitly represents the personal object of πιστεύετε in idiomatic Amharic, and avoids the added firmness nuance of «ጸንቶ». It retains the source's causal connection and contextual pronouns without adding doctrinal interpretation.
