  language: am
  text: ነገር ግን የተፈወሰው ሰው ማን እንደሆነ አላወቀም፤ በዚያ ስፍራ ሕዝብ ስለነበር፣ ኢየሱስ ሳይስተዋል ሄዶ ነበር[a]።
  philosophy: optimal-equivalence
  footnotes:
