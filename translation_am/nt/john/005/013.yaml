    text: ወይም፣ “ተሰውሮ ሄዶ ነበር” ወይም “ሾልኮ ወጥቶ ነበር።” የግሪኩ ግስ ኢየሱስ ሳይስተዋል ከዚያ መሄዱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: የተፈወሰው ሰው
  rationale: የግሪኩን ተደራጊ አንቀጽ በስምነት መጠቀሙንና ፈውሱ ከማወቅ በፊት መፈጸሙን ያሳያል።
- source_word: οὐκ ᾔδει
  choice: አላወቀም
  rationale: በዐውዱ ውስጥ የእውቀት እጦትን በቀላልና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τίς ἐστιν
  choice: ማን እንደሆነ
  rationale: በተዘዋዋሪ ንግግር የግል ማንነትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξένευσεν
  choice: ሳይታወቅ ሄዶ ነበር
  rationale: ግሱ ኢየሱስ ከሰዎች ትኩረት ውጭ በሆነ መንገድ መሄዱን ያመለክታል፤ ይህ አገላለጽ ያንን ስውር መሄድ ያሳያል።
- source_word: ὄχλου ὄντος
  choice: ብዙ ሰዎች ስለነበሩ
  rationale: የብዙ ሕዝብ መኖርንና ከኢየሱስ መሄድ ጋር ያለውን ምክንያታዊ ወይም ሁኔታዊ ግንኙነት በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: ἐν τῷ τόπῳ
  choice: በዚያ ቦታ
  rationale: ግልጽ የቦታ ማመልከቻ ሲሆን በአማርኛ ከቀደመው ዐውድ ጋር ተፈጥሯዊ ነው።
