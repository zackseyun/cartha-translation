  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: am
  text: ኢየሱስም፣ “ተነሥ፤ ምንጣፍህን[a] አንሥተህ ተራመድ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መኝታህን»። የግሪኩ ቃል ቀላል የመኝታ ምንጣፍን ወይም ንጣፍን ያመለክታል፤ የግድ ሙሉ አልጋ ማለት አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በአማርኛ ትረካ በተፈጥሯዊ ሁኔታ በያለፈ ጊዜ ተተርጉሟል፤ «ይለዋል» የሚለውም ቅርብ አማራጭ ነው።
- source_word: αὐτῷ
  choice: አለው
  rationale: ለሦስተኛ መደብ ወንድ ተቀባይ የሚያመለክተው «ለእርሱ» በአማርኛው ግስ ውስጥ በ«-ው» ተወክሏል።
- source_word: Ἔγειρε
  choice: ተነሥ
  rationale: በዚህ የፈውስ አውድ ወዲያውኑ ከተኛበት እንዲነሣ የሚያዝ ቀጥተኛና ተፈጥሯዊ ትእዛዝ ነው።
- source_word: ἆρον
  choice: አንሥተህ
  rationale: ነገሩን ከተቀመጠበት አንሥቶ መውሰድን ያሳያል፤ ከቀጣዩ ትእዛዝ ጋር ተፈጥሯዊ ለማድረግ በተያያዥ የትእዛዝ ቅርጽ ተሰጥቷል።
- source_word: κράβαττόν
  choice: ምንጣፍህን
  rationale: ቃሉ በቀላሉ ሊታጠፍና ሊሸከም የሚችል ቀላል የመኝታ ንጣፍን ያመለክታል፤ «አልጋ» ዘመናዊ ከባድ የቤት ዕቃን ሊያስታውስ ይችላል።
- source_word: περιπάτει
  choice: ተራመድ
  rationale: በዚህ አውድ ምሳሌያዊ ሳይሆን አካላዊ መራመድን ያመለክታል፤ «ተራመድ» ግልጽና ተፈጥሯዊ የትእዛዝ ቅርጽ ነው።
theological_decisions:
- issue: በፈውስ አውድ ውስጥ የኢየሱስ ትእዛዝ ባሕርይ
  choice: ሦስቱን አካላዊ ትእዛዞች ብቻ በቀጥታ ማቅረብ
  alternative: «ተነሥና ተፈወስ» የሚል የትርጓሜ ማስፋፊያ መጨመር
  rationale: ግሪኩ እንዲነሣ፣ ምንጣፉን እንዲያነሣና እንዲራመድ ያዛል። ፈውሱ ከአውዱ ቢታወቅም «ተፈወስ» የሚል ቃል በዚህ ቁጥር የለም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ የተፈጥሮ ልማድ መሠረት «አለው» ተብሏል። የግሥ ተቀባይ «-ው» ስለሚያሳየው «ለእርሱ» በተናጠል አልተደገመም።
