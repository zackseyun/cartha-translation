  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: am
  text: «እኔ ከራሴ[a] ምንም ማድረግ አልችልም። እንደምሰማው እፈርዳለሁ፤ ፍርዴም ፍትሐዊ ነው፤ ምክንያቱም የራሴን ፈቃድ አልሻም፤ ይልቅ የላከኝን ፈቃድ እሻለሁ።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ከራሴ» የሚለው «በራሴ» ወይም «ራሴን ችዬ» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ አገላለጽ ምንጭንና ከሌላው ተለይቶ መሥራትን ሁለቱንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: እኔ ... አልችልም
  rationale: የδύναμαιን የችሎታ ፍቺና በἐγώ ላይ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: ከራሴ ምንም ማድረግ
  rationale: ἀπ’ ἐμαυτοῦ የምንጭን ሐሳብም ሆነ ራስን ችሎ የመሥራትን ሐሳብ ሊይዝ ስለሚችል፣ ‘ከራሴ’ ይህን አሻሚነት ይጠብቃል።
- source_word: καθὼς ἀκούω
  choice: እንደምሰማው
  rationale: የκαθὼςን የመመሳሰል ኃይልና የἀκούωን ቀጣይነት በአጭርና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: እፈርዳለሁ / ፍርዴ
  rationale: በሁለቱ የግሪክ ቃላት መካከል ያለውን የፍርድ ቃላዊ ትስስር ይጠብቃል።
- source_word: δικαία
  choice: ትክክል
  rationale: ከፍርድ ጋር ሲገናኝ ፍርዱ ቀና፣ ፍትሐዊና ትክክለኛ መሆኑን በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: ζητῶ
  choice: እሻ
  rationale: በዚህ አውድ ζητέω ፈቃድን እንደ ዓላማ መፈለግን ያመለክታል፤ ‘እሻ’ ከ‘ፈቃድ’ ጋር ተፈጥሯዊ ሲሆን ዓላማዊ አቅጣጫውን ይጠብቃል።
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: የራሴን ፈቃድ
  rationale: በግሪኩ ያለውን አጽንዖት ‘የራሴን’ በማለት ያስተላልፋል።
- source_word: τοῦ πέμψαντός με
  choice: የላከኝን
  rationale: ግሪኩ በቀጥታ ‘አብ’ ሳይል በላኪነት ግንኙነት የሚገልጸውን አነጋገር ይጠብቃል።
theological_decisions:
- issue: በἀπ’ ἐμαυτοῦ የተገለጠው የወልድ አሠራር ከላኪው ጋር ያለው ግንኙነት
  choice: ከራሴ
  alternative: በራሴ / ብቻዬን
  rationale: ‘ከራሴ’ ኢየሱስ ከላኪው ተለይቶ ወይም ራሱን እንደ ብቸኛ ምንጭ አድርጎ እንደማይሠራ ያሳያል፤ ጥቅሱ ያለውን የችሎታና የጥገኝነት ውጥረት ያለ ዶግማዊ ማብራሪያ ይጠብቃል።
- issue: δικαία ከκρίσις ጋር ያለው የፍርድ ፍቺ
  choice: ፍርዴ ትክክል ነው
  alternative: ፍርዴ ጻድቅ ነው / ፍትሐዊ ነው
  rationale: ‘ትክክል’ ፍርዱ ከፈቃዱ ጋር በመስማማቱ ቀናና ፍትሐዊ መሆኑን ያሳያል፤ ‘ጻድቅ’ በዘመናዊ አማርኛ ከፍርድ ጋር ያነሰ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘እፈርዳለሁ/ፍርዴ’ ቃላዊ ትስስር ተጠብቋል፤ የግሪኩን አሻሚነት ለማቆየት ‘ከራሴ’ ተመርጧል።
