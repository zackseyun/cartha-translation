  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: am
  text: ነገር ግን እኔ አውቃችኋለሁ፤ በውስጣችሁ የእግዚአብሔር ፍቅር[a] የላችሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ግልጽ ተደርጎ፣ “ለእግዚአብሔር ያላችሁ ፍቅር።” የግሪኩ አገላለጽ በሰፊው “ከእግዚአብሔር የሚመጣው ፍቅር” ወይም “የእግዚአብሔር ፍቅር” ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ጠንካራ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔγνωκα ὑμᾶς
  choice: እኔ አውቃችኋለሁ
  rationale: የፍጹም ጊዜውን የጸና እውቀት ትርጉም በዘመናዊ አማርኛ የአሁን ሁኔታ በሚያመለክት አነጋገር ያቀርባል፤ የተናጋሪው ተውላጠ ስም አጽንኦቱን ይጠብቃል።
- source_word: ὅτι
  choice: ፤
  rationale: ኢየሱስ የሚያውቀውን ይዘት የሚከተለው አረፍተ ነገር በተፈጥሯዊ ሁኔታ እንዲገልጥ የአማርኛ ሥርዓተ ነጥብ ተጠቅሟል።
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: የእግዚአብሔር ፍቅር
  rationale: የግሪኩን የባለቤትነት አገባብ በቀጥታ በመጠበቅ ፍቅሩ ወደ እግዚአብሔር የሚመራ ወይም ከእግዚአብሔር የሚመጣ መሆኑን ሳይወስን ያቀርባል።
- source_word: οὐκ ἔχετε ἐν ἑαυτοῖς
  choice: በውስጣችሁ … የላችሁም
  rationale: ውስጣዊ መኖርን ወይም መያዝን በግልጽና ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: “የእግዚአብሔር ፍቅር” በሚለው ሐረግ ያለው የτοῦ θεοῦ ትርጉም
  choice: የእግዚአብሔር ፍቅር
  alternative: ለእግዚአብሔር ያላችሁ ፍቅር፤ ወይም ከእግዚአብሔር የሚመጣው/የእግዚአብሔር የሆነው ፍቅር
  rationale: የግሪኩ የባለቤትነት አገባብ ፍቅርን ወደ እግዚአብሔር የሚመራ አድርጎ ወይም ምንጩ/ባለቤቱ እግዚአብሔር የሆነ አድርጎ ሊያስረዳ ይችላል። ዋናው ጽሑፍ ይህን እውነተኛ አሻሚነት ጠብቆ፣ ማብራሪያው በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በውስጣችሁ” የውስጣዊ መኖርን ሐሳብ ይጠብቃል፤ የግሪኩ አሻሚ የባለቤትነት አገባብ በዋናው ጽሑፍ አልተፈታም።
