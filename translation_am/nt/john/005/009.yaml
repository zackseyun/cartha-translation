base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: am
  text: ወዲያውም ሰውየው ዳነ፤ የመኝታ ምንጣፉንም[a] አንሥቶ መራመድ ጀመረ።[b] ያም ቀን ሰንበት ነበር።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀላል መኝታውን።” የግሪኩ κράβαττον ተጠቅልሎ ሊወሰድ የሚችል ምንጣፍ፣ ቀላል መኝታ ወይም መኝታ ንጣፍ ያመለክታል፤ የግድ ትልቅ አልጋ ማለት አይደለም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ይራመድም ነበር።” የግሪኩ ኢምፐርፌክት ግስ የቀጠለ ድርጊትን ሊያጎላ ይችላል፤ እዚህ ግን ከተፈወሰ በኋላ መራመድ መጀመሩንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “በዚያ ቀን ሰንበት ነበር።”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: ወዲያውም
  rationale: የፈውሱን ፈጣንነት በተፈጥሯዊና ግልጽ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐγένετο ὑγιὴς
  choice: ዳነ
  rationale: በዐውዱ ውስጥ ‘ጤነኛ ሆነ/ደኅና ሆነ’ የሚለውን የሁኔታ ለውጥ በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩ ግስ በግልጽ ያልገለጠውን አድራጊ አያክልም።
- source_word: ὁ ἄνθρωπος
  choice: ሰውየው
  rationale: በትረካው የተጠቀሰውን የታወቀ ወንድ ሰው በተፈጥሯዊ አማርኛ ይጠቁማል።
- source_word: ἦρε
  choice: አንሥቶ
  rationale: ዕቃውን ከነበረበት አንሥቶ መውሰዱን በግልጽ ይገልጣል።
- source_word: κράβαττον
  choice: የመኝታ ምንጣፉን
  rationale: ቃሉ በቀላሉ ተጠቅልሎ ሊወሰድ የሚችል የመኝታ ምንጣፍ ወይም ቀላል መኝታ ያመለክታል፤ ‘አልጋ’ ትልቅ የቤት ዕቃ እንዳያስመስለው ይህ አገላለጽ ተመርጧል።
- source_word: περιεπάτει
  choice: መራመድ ጀመረ
  rationale: በፈውሱ ትረካ ውስጥ የተመለሰለትን የመራመድ ችሎታና የድርጊቱን መጀመር በተፈጥሯዊ አማርኛ ያሳያል፤ የኢምፐርፌክት ገጽታው ቀጣይ ድርጊትንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: Ἦν δὲ
  choice: ነበር
  rationale: δέ እዚህ ጠንካራ ተቃርኖ ሳይሆን ቀጣዩን ውዝግብ የሚያዘጋጅ የትረካ ማብራሪያ ነው፤ የአማርኛው ዓረፍተ ነገር ሽግግሩን በተፈጥሮ ያሳያል።
- source_word: σάββατον
  choice: ሰንበት
  rationale: የአይሁድን የዕረፍት ቀን በተለመደውና ክብር ባለው የአማርኛ ቃል ይገልጣል።
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ያም ቀን
  rationale: ‘በዚያ ቀን’ የሚለውን ትርጉም ከሰንበት ጋር በተፈጥሯዊ የአማርኛ አገባብ ያያይዛል።
theological_decisions:
- issue: በትረካው ውስጥ σάββατον የሚለውን መተርጎም
  choice: ያም ቀን ሰንበት ነበር
  alternative: በዚያም ቀን ሰንበት ነበር / ያ ቀን ሰንበት ነበር
