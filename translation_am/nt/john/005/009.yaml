- issue: የπεριεπάτει ኢምፐርፌክት ገጽታ
  choice: መራመድ ጀመረ
  alternative: ይራመድም ነበር / ይራመድ ጀመር
  rationale: ዐውዱ ከፈውሱ በኋላ የመራመዱን መጀመር ሊያጎላ ይችላል፤ ሆኖም ኢምፐርፌክቱ ቀጣይ ድርጊትንም ሊገልጥ ስለሚችል ይህ አማራጭ በእግር ማስታወሻ ተጠብቋል።
