id: JHN.5.28
reference: John 5:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: am
  text: በዚህ አትደነቁ፤ በመቃብሮች[a] ያሉት ሁሉ ድምፁን የሚሰሙበት ሰዓት ይመጣልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመቀበሪያ ስፍራዎች።» የግሪኩ μνημεῖα በአጠቃላይ የቀብር ስፍራዎችን ሊያመለክት ይችላል፤ «መቃብሮች» የሚለው ተጨባጭ ምስሉን ለመጠበቅ ተመርጧል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: አትደነቁ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር ክልከላን ያሳያል፤ «አትደነቁ» የθαυμάζωን ኃይል በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοῦτο
  choice: በዚህ
  rationale: ጠቋሚው ወደ ቀደመው ንግግር ይመለከታል፤ በአማርኛ «በዚህ አትደነቁ» ተፈጥሯዊ አገባብ ነው።
- source_word: ὅτι
  choice: —ና
  rationale: በግሪኩ ያለውን ምክንያታዊ ግንኙነት በአማርኛ የዓረፍተ ነገሩ መጨረሻ «ይመጣልና» በማለት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἔρχεται ὥρα
  choice: ሰዓት ይመጣል
  rationale: ὥραን «ሰዓት» ብሎ መተርጎም የዮሐንስን ቃላዊና ሥነ መለኮታዊ ክብደት ይጠብቃል፤ በግሪኩ የተወሰነ አመልካች ስለሌለውም «ያ ሰዓት» ተብሎ አልተጨመረም።
- source_word: ἐν ᾗ
  choice: የሚሰሙበት
  rationale: የአማርኛው አንጻራዊ ግስ ቅርጽ የግሪኩን «በእርሱ ውስጥ» ጊዜያዊ ግንኙነት ግልጽና ተፈጥሯዊ አድርጎ ይገልጣል።
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: በመቃብሮች ያሉት ሁሉ
  rationale: πάντες ከአንቀጹ ጋር «ያሉት ሁሉ» የሚል ስማዊ አገልግሎት አለው። μνημεῖα የመቀበሪያ ስፍራዎችን ያመለክታል፤ «መቃብሮች» ይህን ተጨባጭ ምስል ይጠብቃል።
- source_word: ἀκούσουσιν
  choice: የሚሰሙበት
  rationale: የወደፊት አመልካች ግሱ በ«ሰዓት ይመጣል» በተመራው አንጻራዊ የአማርኛ አወቃቀር የወደፊት ትርጉሙን ይዞ ቀርቧል።
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ድምፁን
  rationale: φωνή በዚህ የግለሰብን ድምፅ ያመለክታል፤ ከἀκούω ጋር ያለው የግሪክ የባለቤትነት ሁኔታ በአማርኛ ቀጥተኛ ተሳቢ «ድምፁን» ተብሎ በተፈጥሯዊ ሁኔታ ተተርጉሟል።
theological_decisions:
- issue: በመቃብር ያሉት ድምፁን መስማታቸው የሚያመለክተው ትንሣኤ
  choice: «በመቃብሮች ያሉት» የሚለውን ተጨባጭ የቀብር ምስል ማቆየት፣ ትንሣኤን በትርጉሙ ውስጥ በማብራሪያ አለማከል
  alternative: «የሞቱት ሁሉ» ብሎ የተተረጎመ ትርጉም መስጠት
  rationale: አውዱ ወደ ትንሣኤ ይጠቁማል፣ ነገር ግን ትርጉሙ ጽሑፉ ራሱ የሰጠውን ተጨባጭ ምስል ማስቀመጥ እንጂ ሥነ መለኮታዊ ማብራሪያን ማስገባት የለበትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ሰዓት» የሚለው ቃል የዮሐንስን ልዩ አጠቃቀም ለማቆየት «ጊዜ» ተብሎ አልተለወጠም።
