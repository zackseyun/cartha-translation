  alternative: የይሁዳ ሰዎች
  rationale: Ἰουδαῖος እንደ አውዱ ‘አይሁዳዊ’ ወይም ‘የይሁዳ ነዋሪ’ ሊያመለክት ይችላል። እዚህ ግን ቃሉ ‘በዓል’ን ይወስናልና ክልላዊ ማንነትን ሳይሆን የአይሁድን ሃይማኖታዊ አከባበር ያመለክታል።
