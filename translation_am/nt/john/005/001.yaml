  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: am
  text: ከእነዚህ ነገሮች በኋላ የአይሁድ[b] በዓል[a] ነበረ፤ ኢየሱስም ወደ ኢየሩሳሌም ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የበዓል ቀን»።
    reason: lexical_alternative
  - marker: b
    text: እዚህ «አይሁድ» የሚለው ከአይሁድ ሕዝብ በዓላት አከባበር ጋር ይያያዛል፤ በዮሐንስ ወንጌል ውስጥ በሌሎች አውዶች ግን Ἰουδαῖοι የሚለው «የይሁዳ ሰዎች» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ከዚህ በኋላ
  rationale: የግሪኩን የትረካ መሸጋገሪያ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃል በቃል ‘ከእነዚህ ነገሮች በኋላ’ ማለት በአማርኛ ከባድ ስለሚሆን ትርጉሙ ሳይጠፋ ተፈጥሯዊ አገላለጽ ተመርጧል።
- source_word: ἦν
  choice: ነበረ
  rationale: ያለፈ ጊዜን የሚያመለክተውን የεἰμί ኢምፐርፌክት በቀጥታና ተፈጥሯዊ ሁኔታ ይወክላል።
- source_word: ἑορτὴ
  choice: በዓል
  rationale: ቃሉ ሃይማኖታዊ የበዓል አከባበርን ያመለክታል፤ ‘በዓል’ በዘመናዊ አማርኛ ግልጽ፣ የተለመደና ከምንጩ አውድ ጋር የሚስማማ ነው።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: በዚህ አውድ ጄኒቲቩ በዓሉ በአይሁድ ሕዝብ የሚከበር መሆኑን ይገልጣል፤ ክልላዊው ‘የይሁዳ ሰዎች’ ከሚለው ይልቅ ‘የአይሁድ’ የአውዱን ፍቺ ይሻላል።
- source_word: ἀνέβη
  choice: ወጣ
  rationale: ወደ ኢየሩሳሌም ስለሚደረግ ጉዞ የሚጠቀመውን ‘ወደ ላይ መሄድ’ የሚለውን የግሪኩን ልማዳዊ አገላለጽ ይጠብቃል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የተለመደው የቦታው ስም ነው።
theological_decisions:
