  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ወጣ’ የኢየሩሳሌምን ጉዞ የሚገልጠውን ባህላዊ አገላለጽ ያቆያል፤ የእንግሊዝኛው የ[a] ምልክትና የማስታወሻው ይዘት የማይጣጣሙ ስለሆኑ ምልክቱ ትክክለኛው የ‘በዓል’ አማራጭ ላይ ተቀምጧል።
