base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: am
  text: ነገር ግን እርሱ የጻፋቸውን ጽሑፎች[a] የማታምኑ ከሆነ፣ የእኔን ቃሎች እንዴት ታምናላችሁ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእርሱን ደብዳቤዎች።” የግሪኩ ቃል ደብዳቤዎችን ወይም ጽሑፎችን ሊያመለክት ይችላል፤ እዚህ ግን ሙሴ የጻፋቸውን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን … ከሆነ
  rationale: የδέን ተቃርኖና የεἰን ሁኔታዊ አገባብ በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: እርሱ የጻፈውን
  rationale: γράμματα በዚህ አውድ የሙሴን የተጻፈ ምስክርነት ያመለክታል፤ ይህ አገላለጽ ‘ደብዳቤዎች’ የሚል የተሳሳተ ግንዛቤን ያስወግዳል፣ ‘መጻሕፍት’ ብሎም ከግሪኩ በላይ አይወስንም።
- source_word: οὐ πιστεύετε
  choice: የማታምኑ
  rationale: πιστεύω እዚህ የተጻፈውን ምስክርነት እውነት ብሎ መቀበልን ያመለክታል፤ ‘ማመን’ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: πῶς … πιστεύσετε
  choice: እንዴት ታምናላችሁ?
  rationale: πῶς ያለውን የአጻጻፍ ጥያቄና የπιστεύσετεን የወደፊት አቅጣጫ ይጠብቃል።
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: እኔ የምናገረውን
  rationale: ῥήματα የተነገሩ ቃላትን ወይም ንግግርን ያመለክታል፤ ይህ ምርጫ ከሙሴ የተጻፈ ምስክርነት ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የἐκείνου ተውላጠ ስም ማጣቀሻ
  choice: ‘እርሱ’ በቅርብ አውዱ ሙሴን ያመለክታል
  alternative: አጠቃላይ ወይም ያልተወሰነ ሌላ ማጣቀሻ
  rationale: ዮሐንስ 5፥45-46 ሙሴን በግልጽ ይጠቅሳል፤ ዋናው ጽሑፍ ግን እንደ ግሪኩ ተውላጠ ስሙን በመጠቀም የአውዱን ትስስር ይጠብቃል።
- issue: የπιστεύω ትርጉም
  choice: በሁለቱም ሐረጎች ‘ማመን’
  alternative: ‘መታመን’ ወይም ‘መተማመን’
  rationale: አውዱ የሙሴን ጽሑፍና የኢየሱስን ቃል እውነት ብሎ መቀበልን ያጎላል፤ በሁለቱም ቦታ ‘ማመን’ ማለት የንግግሩን ትይዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። ‘እርሱ የጻፈውን’ እና ‘እኔ የምናገረውን’ የሚሉት ተፈጥሯዊ አገላለጾች በጽሑፍና በንግግር መካከል ያለውን የግሪኩን ንጽጽር ይጠብቃሉ።
