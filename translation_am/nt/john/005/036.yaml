source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: am
  text: እኔ ግን ከዮሐንስ ምስክርነት የሚበልጥ ምስክርነት አለኝ[a]፤ ምክንያቱም አብ እንድፈጽማቸው የሰጠኝ ሥራዎች፣ ማለትም እኔ የማደርጋቸው እነዚሁ ሥራዎች፣ ስለ እኔ አብ እንደላከኝ ይመሰክራሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከዮሐንስ ምስክርነት የሚበልጥ ምስክር አለኝ።»
    reason: «ምስክርነት» ተብሎ የተተረጎመው μαρτυρία በዚህ ዐውድ «ምስክር» ተብሎም ሊቀርብ ይችላል።
lexical_decisions:
- source_word: μαρτυρίαν
  choice: ምስክርነት
  rationale: በዐውዱ የኢየሱስን ማንነትና ተልእኮ የሚያረጋግጥ ማስረጃዊ ምስክርነትን ያመለክታል፤ «ምስክርነት» ይህን ትርጉም በተፈጥሮ ያስተላልፋል።
- source_word: μείζω
  choice: የሚበልጥ
  rationale: የደረጃ ወይም የክብደት ብልጫን በቀጥታ ያሳያል፤ ጽሑፉ ብልጫውን በምን መልኩ እንደሆነ ከሚናገረው በላይ አይገድብም።
- source_word: τοῦ Ἰωάννου
  choice: ከዮሐንስ ምስክርነት
  rationale: የግሪኩ የባለቤትነት ቅርጽ በዐውዱ የዮሐንስን ምስክርነት በአጭሩ ያመለክታል። በአማርኛ ይህን በግልጽ ለማስተላለፍ «ምስክርነት» ተደግሟል፤ አጠር ያለው አማራጭ በእግር ማስታወሻ ቀርቧል።
- source_word: ἔργα
  choice: ሥራዎች
  rationale: በዮሐንስ ወንጌል ቃሉ ተአምራትን ብቻ ሳይሆን ኢየሱስ በአብ ተልኮ የሚፈጽመውን ድርጊት በስፋት ሊያመለክት ስለሚችል «ሥራዎች» ያንን ስፋት ይጠብቃል።
- source_word: δέδωκέν μοι
  choice: የሰጠኝ
  rationale: አብ ሥራዎቹን ለኢየሱስ እንዲፈጽማቸው የሰጠውን ተልእኮ በተፈጥሮአዊ የአማርኛ አገላለጽ ያቀርባል፤ የተፈጸመው ስጦታ ውጤትም እንደቀጠለ ዐውዱ ያሳያል።
- source_word: ὁ πατήρ
  choice: አብ
  rationale: በኢየሱስና በእግዚአብሔር መካከል ያለውን የአባትነት ግንኙነት የሚጠብቅ፣ በአማርኛ የመጽሐፍ ቅዱስ ንግግርም የተለመደ ማዕረግ ነው። ግሪኩ «አባቴ» የሚል ግልጽ ባለቤትነት አልጨመረም።
- source_word: ἵνα τελειώσω αὐτά
  choice: እንድፈጽማቸው
  rationale: የዓላማውን አገላለጽና ሥራዎቹን ወደታሰበላቸው ፍጻሜ የማድረስ ሐሳብ በአንድ ተፈጥሮአዊ ግስ ያስተላልፋል።
- source_word: αὐτὰ τὰ ἔργα
  choice: እነዚሁ … ሥራዎች
  rationale: የግሪኩን አጽንዖት በ«እነዚሁ» ጠብቆ፣ አሁን እየተሠሩ ያሉት ሥራዎች ቀደም ሲል የተጠቀሱት እነዚያው መሆናቸውን ያሳያል።
- source_word: ἃ ποιῶ
  choice: እየሠራኋቸው ያሉት
  rationale: የግሪኩን የአሁን ጊዜ ቀጣይ ድርጊት በዘመናዊና ተፈጥሮአዊ አማርኛ ያቀርባል።
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: ስለ እኔ … ይመሰክራሉ
  rationale: የሥራዎቹን ማስረጃዊ ተግባር ይጠብቃል። በአማርኛ ብዙ ቁጥር ባለቤት ስለሆኑ «ይመሰክራሉ» ተብሏል።
- source_word: ἀπέσταλκεν
  choice: እንደላከኝ
  rationale: የኢየሱስ መላክ በአብ የተፈጸመ እና ቀጣይ ጠቀሜታ ያለው ተልእኮ መሆኑን ይገልጣል፤ በ«እንደ» የተጀመረው ሐረግ ሥራዎቹ የሚመሰክሩትን ይዘት ያሳያል።
theological_decisions:
- issue: ኢየሱስን የሚያረጋግጠው ምስክርነት ምንነት
  choice: አብ እንዲፈጽማቸው የሰጠው ሥራዎች ከዮሐንስ ምስክርነት የሚበልጥ ምስክርነት ሆነው፣ አብ ኢየሱስን እንደላከው ይመሰክራሉ።
