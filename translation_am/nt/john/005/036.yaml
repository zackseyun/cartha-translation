- issue: ὁ πατήρ ከኢየሱስ ጋር ባለው ግንኙነት አተረጓጎም
  choice: አብ
  alternative: እግዚአብሔር፤ አባቴ
  rationale: የግሪኩ ጽሑፍ የማዕረግ አገላለጹን «ὁ πατήρ» ይጠቀማል፤ «አብ» ይህን ግንኙነት ይጠብቃል፣ በግልጽ ያልተጻፈውን «አባቴ» ግን አይጨምርም።
