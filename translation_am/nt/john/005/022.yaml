id: JHN.5.22
reference: John 5:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: am
  text: አብ እንኳ በማንም ላይ አይፈርድምና፤ ነገር ግን ፍርድን ሁሉ ለወልድ ሰጥቷል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: አብ እንኳ … አይፈርድምና
  rationale: የγάρን ማብራሪያዊ ኃይል በመጨረሻው «-ምና» ያሳያል፤ οὐδέ ያለውን አጽንዖት «እንኳ» ይጠብቃል።
- source_word: ὁ πατὴρ
  choice: አብ
  rationale: በዮሐንስ አውድ ከወልድ ጋር ያለውን የአምላክ ግንኙነት የሚገልጽ መጠሪያ ነው፤ «አብ» ይህን ርዕሳዊ አጠቃቀም በአጭሩ ይጠብቃል።
- source_word: κρίνει
  choice: ይፈርዳል
  rationale: የመፍረድን ተግባር በሰፊ ትርጉሙ ይጠብቃል፤ ትርጉሙን ወደ «ይኮንናል» ብቻ አያጠብም። በዓረፍተ ነገሩ ውስጥ በአሉታዊ መልክ «አይፈርድም» ተብሏል።
- source_word: οὐδένα
  choice: በማንም ላይ … አይፈርድም
  rationale: ከአሉታዊው ግስ ጋር ተያይዞ ማንንም ሳይቀር የሚያካትተውን ክልከላ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: በአብ አለመፍረድና ፍርድን ለወልድ መስጠቱ መካከል ያለውን ጠንካራ ንጽጽር በግልጽ ያሳያል።
- source_word: τὴν κρίσιν πᾶσαν
  choice: ፍርድን ሁሉ
  rationale: የκρίσιςን ስማዊ ቅርጽና የπᾶσανን ሙሉ አካታችነት ይጠብቃል፤ «የመፍረድ ሥልጣን» ብሎ ትርጉሙን አያሰፋም።
- source_word: δέδωκεν
  choice: ሰጥቶታል
  rationale: የግሪኩን ፍጹም ጊዜ፣ ማለትም የተፈጸመና ውጤቱ የቀጠለ ተግባርን፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῷ υἱῷ
  choice: ለወልድ
  rationale: በግሪኩ ያለውን የተወሰነ ክርስቶሳዊ መጠሪያ «ወልድ» በማለት ይጠብቃል፤ በምንጩ የሌለውን ግልጽ የባለቤትነት ተውላጠ ስም አይጨምርም።
theological_decisions:
- issue: በአብ መፍረድና በወልድ መፍረድ መካከል ያለው ግንኙነት
  choice: አብ በማንም ላይ እንደማይፈርድና ፍርድን ሁሉ ለወልድ እንደሰጠ የጽሑፉን ቀጥተኛ አነጋገር መጠበቅ።
  alternative: «አብ ከወልድ ተለይቶ በራሱ አይፈርድም» ብሎ ማብራራት፣ ወይም ፍርዱን በመጨረሻው ዘመን ፍርድ ብቻ መወሰን።
  rationale: ግሪኩ እነዚህን ማስማሚያ ገደቦች አይጨምርም፤ ስለዚህ በንባቡ ያለው ሥነ መለኮታዊ ውጥረት እንዳለ ተጠብቋል።
- issue: «ወልድ» የሚለው ክርስቶሳዊ መጠሪያ
  choice: «ወልድ» የሚለውን መጠሪያ መጠበቅ።
  alternative: «ልጁ» ብሎ መተርጎም።
  rationale: «ወልድ» በዚህ አውድ ያለውን ርዕሳዊ ክብደትና የአብና የወልድን ግንኙነት ይጠብቃል፤ «ልጁ» ግን በግሪኩ ያልተገለጸውን የባለቤትነት ቅጥያ ይጨምራል።
translation_notes:
  register: ትርጉሙ ዘመናዊና ግልጽ የአማርኛ አገባብን ይጠቀማል፤ «አብ» እና «ወልድ» የሚሉትን የተለመዱ፣ ክብር ያላቸው መጽሐፍ ቅዱሳዊ መጠሪያዎች ጠብቋል። ምንም የግርጌ ማስታወሻ አላስፈለገም።
