    text: ወይም፣ “የደረቁ” ወይም “የጠወለጉ።” የግሪክ ቃሉ በቀጥታ “ደረቅ” ወይም “ጠውላጋ” ማለት ሲሆን፣ በዚህ ዐውድ የሰለለ ወይም የጠወለገ የአካል ክፍል ያላቸውን ሰዎች ሊያመለክት ይችላል።
    reason: lexical_alternative
