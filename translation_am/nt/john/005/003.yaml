- source_word: τυφλῶν
  choice: ዕውሮች
  rationale: የማያዩ ሰዎችን በቀጥታና በተለመደ አማርኛ ይገልጻል።
- source_word: χωλῶν
  choice: አንካሶች
  rationale: በእግራቸው መራመድ የተሳናቸውን ወይም የተቸገሩትን የሚያመለክተው χωλός ቀጥተኛ አቻ ነው።
- source_word: ξηρῶν
  choice: አካላቸው የደረቀባቸው
  rationale: ξηρός በቀጥታ ‘የደረቀ’ ወይም ‘የጠወለገ’ ማለት ነው፤ በአካል ሁኔታ ዐውድ የደረቀ ወይም የሰለለ እጅና እግር ያላቸውን ያመለክታል። ትርጉሙ ይህን ምስል ሳይጠብብ ያቆያል።
