base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: am
  text: ታማሚውም እንዲህ ሲል መለሰለት፦ “ጌታ ሆይ፣ ውኃው በሚናወጥበት ጊዜ ወደ ገንዳው የሚያስገባኝ ሰው የለኝም፤ እኔ ስመጣ ግን ሌላ ሰው ከእኔ ቀድሞ ይወርዳል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: ታማሚው
  rationale: በዚህ ዐውድ የታመመውን ሰው በተፈጥሯዊና ግልጽ አማርኛ ያመለክታል።
- source_word: Κύριε
