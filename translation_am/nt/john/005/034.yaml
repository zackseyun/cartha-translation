id: JHN.5.34
reference: John 5:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: am
  text: እኔ ግን ከሰው ምስክርነትን አልቀበልም፤ ነገር ግን እናንተ እንድትድኑ እነዚህን ነገሮች እላለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: ከሰው
  rationale: παρά ከወራጅ ቅጽ ጋር የምንጭነትን ሐሳብ ይገልጣል፤ «ከሰው» የግሪኩን ነጠላ ቅጽና በዐውዱ ያለውን ሰብአዊ ምስክርነት ይጠብቃል።
- source_word: μαρτυρίαν
  choice: ምስክርነትን
  rationale: ቃሉ ከምስክሩ ሰው ይልቅ የምስክርነቱን ይዘት ያመለክታል፤ በአካባቢው ያለውን የማስረጃ ሐሳብም ይጠብቃል።
- source_word: λαμβάνω
  choice: አልቀበልም
  rationale: የአሁን ጊዜውን ግስና ከምስክርነት ጋር ያለውን ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ταῦτα
  choice: ይህን
  rationale: ግሪኩ ገለልተኛ ብዙ ቁጥር ቢሆንም፣ በአማርኛ «ይህን እላለሁ» የቀደመውን ንግግር በአጠቃላይ የሚያመለክት ተፈጥሯዊ አገላለጽ ነው፤ «እነዚህን ነገሮች» ቅርጹን ይበልጥ ቢከተልም ከባድ ይሰማል።
- source_word: λέγω
  choice: እላለሁ
  rationale: ቀላሉን የአሁን ጊዜ አመልካች ቅጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: እናንተ እንድትድኑ
  rationale: ἵνα የዓላማ አንቀጽ ነው፤ የአማርኛው «እንድትድኑ» ዓላማውንና የσωθῆτεን ተገብሮ ሐሳብ ያስተላልፋል። ግልጽ የሆነው «እናንተ» በግሪኩ የተገለጸውን ተውላጠ ስም አጽንዖት ይጠብቃል።
- source_word: δὲ ... ἀλλὰ
  choice: ግን ... ነገር ግን
  rationale: የመጀመሪያውን ተቃርኖና ከዚያ የሚቀርበውን የንግግሩን እውነተኛ ዓላማ በግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: በዐውዱ ውስጥ «እንድትድኑ» የሚለው ትርጉም
  choice: እናንተ እንድትድኑ
  alternative: እንድትድኑ ትችሉ ዘንድ፤ ከጥፋት እንድትድኑ
  rationale: σωθῆτε ሰፊውን የመዳን ሐሳብ ይዞ እንዲቆይ ተደርጓል፤ ወደ አካላዊ መታደግ ወይም ወደ አንድ የተወሰነ የድነት አስተምህሮ አልተገደበም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ከሰው» የግሪኩን ነጠላ ቅጽ ይጠብቃል፤ «ይህን» ግን የግሪኩን ብዙ ቁጥር ቃል በአማርኛ ተፈጥሯዊ በሆነ የንግግር ማጣቀሻ ያቀርባል።
