  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: am
  text: እርሱም እንዲህ አላት፦ “ሂጂ፣ ባልሽን ጥሪና ወደዚህ ነዪ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱም እንዲህ ይላታል።” ግሪክኛው በትረካ ውስጥ የተለመደውን ታሪካዊ አሁን ጊዜ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει αὐτῇ
  choice: እርሱም እንዲህ አላት
  rationale: በግሪክኛው ታሪካዊ አሁን ጊዜ የተጠቀሰ ቢሆንም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መጠቀም ይስማማል። አውዱ ተናጋሪውን ግልጽ ስለሚያደርግ “እርሱም” የተፈጥሯዊ ትረካ ነው።
- source_word: Ὕπαγε
  choice: ሂጂ
  rationale: ለአንዲት ሴት የተነገረ ቀጥተኛና ተፈጥሯዊ የትእዛዝ ቅርጽ ነው።
- source_word: φώνησον
  choice: ጥሪ
  rationale: በዚህ አውድ ሰውን ጠርቶ ማምጣትን የሚገልጽ ተራና ግልጽ ቃል ነው።
- source_word: τὸν ἄνδρα σου
  choice: ባልሽን
  rationale: ἀνήρ “ወንድ” ወይም “ባል” ሊሆን ይችላል፤ የባለቤትነት ተውላጠ ስምና ቀጣዩ አውድ “ባልሽን” የሚለውን ትርጉም ይደግፋሉ።
- source_word: καὶ ἐλθὲ ἐνθάδε
  choice: እና ወደዚህ ነዪ
  rationale: ሁለተኛውን ትእዛዝ በቀጥታ ያስተላልፋል። “ተመልሰሽ” የሚል ሐሳብ ከአውዱ ሊገባ ቢችልም በግሪክኛው በግልጽ ስላልተጠቀሰ አልተጨመረም።
