base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፦ “የእኔ ምግብ የላከኝን[b] ፈቃድ ማድረግና ሥራውን ማጠናቀቅ[a] ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሥራውን መጨረስ።”
    reason: lexical_alternative
  - marker: b
    text: “የላከኝ” የሚለው በዐውዱ አብን ያመለክታል፤ ግሪኩ ግን በዚህ ስፍራ ይህን ማዕረግ በግልጽ አይጠቅስም።
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: ምግብ
  rationale: ቃሉ በተለምዶ ‘ምግብ’ ማለት ነው፤ ደቀ መዛሙርቱ ስለ ሥጋዊ ምግብ በሚያስቡበት ዐውድ የኢየሱስን ግልጽ ዘይቤ ይጠብቃል።
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: የእኔ ምግብ … ነው
  rationale: ዘይቤውን ሳይፈታ በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር አወቃቀር ያቀርባል።
- source_word: ἵνα ποιήσω
  choice: ማድረግ
  rationale: ἵνα ከአንቀጹ ጋር የምግቡን ይዘት ወይም ዓላማ ይገልጣል፤ የአማርኛው የድርጊት ስም ይህን በተፈጥሮ ያስተላልፋል።
- source_word: τὸ θέλημα
  choice: ፈቃድ
  rationale: θέλημα የአንድን ሰው ፈቃድና የወሰነውን ዓላማ ያመለክታል፤ ‘ፈቃድ’ ትክክለኛና የተለመደ አቻ ቃል ነው።
- source_word: τοῦ πέμψαντός με
  choice: የላከኝን
  rationale: የግሪኩን ገላጭ የተውሳከ ግስ በአማርኛ በተፈጥሮ ያቀርባል፤ በግሪኩ ያልተጠቀሰውን ‘አብ’ ወይም ‘እግዚአብሔር’ በዋናው ጽሑፍ ላይ አይጨምርም።
- source_word: τελειώσω
  choice: ማጠናቀቅ
  rationale: τελειόω ሥራን እስከታሰበለት ፍጻሜ ማድረስን ያመለክታል፤ ‘ማጠናቀቅ’ የመፈጸምንና የመጨረስን ሐሳብ ይይዛል።
- source_word: ἔργον
  choice: ሥራ
  rationale: በዚህ ዐውድ የተሰጠውን ተልእኮ ለማመልከት ተፈጥሯዊና ሰፊ ትርጉም ያለው አቻ ቃል ነው።
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ አላቸው
  rationale: በግሪኩ ያለው ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል፤ ‘እንዲህ’ ቀጥሎ ያለውን ንግግር በግልጽ ያስገባል።
theological_decisions:
- issue: ‘የላከኝ’ የሚለው ማንነት
  choice: ዐውዱ አብን/እግዚአብሔርን እንደሚያመለክት ቢያሳይም፣ በዋናው ጽሑፍ ‘የላከኝ’ ተብሎ ተጠብቋል።
  alternative: ‘የላከኝን አብ’ ወይም ‘የላከኝን እግዚአብሔር’ ብሎ በግልጽ መተርጎም።
  rationale: የዮሐንስ ወንጌል ዐውድ ላኪው አብ መሆኑን ያሳያል፤ ይሁን እንጂ ይህ ቁጥር ማዕረጉን በቀጥታ አይጠቅስም። ትርጉሙ የምንጩን አገላለጽ ጠብቆ ዐውዳዊውን ማብራሪያ በማስታወሻ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምግብ ዘይቤው እና በላኪው ማንነት ዙሪያ ያለው የምንጩ የአገላለጽ መጠን ተጠብቀዋል።
