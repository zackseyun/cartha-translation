id: JHN.4.48
reference: John 4:48
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: am
  text: እንግዲህ ኢየሱስ ለእርሱ፣ “ምልክቶችንና ድንቆችን ካላያችሁ፣ በፍጹም አታምኑም” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ካላያችሁ” እና “አታምኑም” የሚሉት ግሶች በግሪክኛ የብዙ ቁጥር ቅርጽ አላቸው። ስለዚህ፣ ኢየሱስ በቀጥታ ለአንድ ሰው ቢናገርም፣ ንግግሩ ከእርሱ ባለፈ ሰፊ ቡድንን የሚመለከት ሊሆን ይችላል።
    reason: የግሪክኛውን ነጠላ ተቀባይ እና በንግግሩ ውስጥ ያለውን የብዙ ቁጥር የግስ ቅርጽ ልዩነት ለማብራራት።
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር ጋር ያለውን ትርክታዊና ምክንያታዊ ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς αὐτόν
  choice: ለእርሱ
  rationale: ኢየሱስ በቀጥታ የተናገረው ለአንድ ሰው መሆኑን ያስቀምጣል።
- source_word: Ἐὰν μὴ
  choice: ካላያችሁ
  rationale: አሉታዊውን ሁኔታ ‘ካል...’ በሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: በዮሐንስ ወንጌል ድርጊቶቹ ከራሳቸው አልፈው የሚያመለክቱትን ትርጉም የሚጠብቅ ቀጥተኛ አቻ ነው።
- source_word: τέρατα
  choice: ድንቆች
  rationale: እጅግ አስደናቂ የሆኑ ክስተቶችን በአጭር፣ ግልጽና የተለመደ ቃል ይገልጣል።
- source_word: ἴδητε
  choice: ካላያችሁ
  rationale: የግሪክኛውን የብዙ ቁጥር ሁለተኛ መደብ ቅርጽ በግልጽ ይጠብቃል።
- source_word: οὐ μὴ πιστεύσητε
  choice: ፈጽሞ አታምኑም
  rationale: οὐ μή የሚሰጠውን ጠንካራ አሉታዊ አጽንዖት ‘ፈጽሞ’ በሚለው ቃል ያሳያል፤ የብዙ ቁጥር ቅርጹንም ይጠብቃል።
- source_word: πιστεύσητε
  choice: አታምኑም
  rationale: πιστεύω በዮሐንስ ያለውን መደበኛ የማመን ትርጉም ሳያጠብ ወይም ሳያሰፋ ይገልጣል።
theological_decisions:
- issue: የተናጋሪው ቀጥተኛ ተቀባይና የንግግሩ ወሰን
  choice: የትረካውን ነጠላ ተቀባይ ‘ለእርሱ’ በማለት፣ በጥቅሱ ውስጥ ያሉትን ግሶች ግን በብዙ ቁጥር ‘ካላያችሁ ... አታምኑም’ በማለት ማቅረብ
  alternative: ንግግሩን ሙሉ በሙሉ ለባለሥልጣኑ ብቻ እንደተነገረ በነጠላ ቁጥር መተርጎም
  rationale: πρὸς αὐτόν አንድን ሰው ያመለክታል፤ ἴδητε እና πιστεύσητε ግን ብዙ ቁጥር ናቸው። ትርጉሙ ይህን ውጥረት ሳይፈታ ሁለቱንም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ምልክቶችና ድንቆች’ የምንጩን ቁልፍ የቃላት ጥምረት ይጠብቃል።
