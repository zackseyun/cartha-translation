  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: am
  text: እኔ እናንተ ያልለፋችሁበትን እንድታጭዱ[a] ላክኋችሁ፤ ሌሎች ለፍተዋል፣ እናንተም ወደ ልፋታቸው ገብታችኋል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንድትሰበስቡ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የልፋታቸውን ፍሬ ተቀብላችኋል” ወይም “በሥራቸው ተካፍላችኋል።” ግሪኩ ይበልጥ በቀጥታ፣ “ወደ ልፋታቸው ገብታችኋል” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: ላክኋችሁ
  rationale: የግሪኩን የተፈጸመ የመላክ ድርጊት በተፈጥሯዊ የአማርኛ አላፊ ጊዜ ያስተላልፋል፤ ‘አዘዝኋችሁ’ የሚለውን ተጨማሪ ፍቺ አያስገባም።
- source_word: θερίζειν
  choice: እንድታጭዱ
  rationale: በአውዱ ያለውን የእርሻ ምሳሌ በቀጥታ ይጠብቃል፤ ‘እንድትሰበስቡ’ የሚለው አማራጭ ከዚህ ይልቅ ሰፊ ፍቺ አለው።
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: እናንተ ያልደከማችሁበትን
  rationale: ὃን እንደ ነገር አመልካች ‘ያል...በትን’ በተፈጥሯዊ አማርኛ ያቀርባል፤ የቀደመው ድካም ከሚታጨደው ነገር ጋር ያለውን ዝምድናም ያሳያል።
- source_word: ἄλλοι κεκοπιάκασιν
  choice: ሌሎች ደክመዋል
  rationale: የፍጹም ጊዜውን የቀደመ ድካምና አሁን ያለውን ውጤት በአማርኛ ፍጹም ጊዜ ይገልጣል፤ የκοπιάωን የብርቱ ጥረት ስሜትም ይጠብቃል።
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: ወደ ድካማቸው ገብታችኋል
  rationale: የግሪኩን ቀጥተኛና ሆን ብሎ ክፍት የተደረገ አገላለጽ ይጠብቃል፤ ‘የድካማቸውን ፍሬ ተቀብላችኋል’ ወይም ‘በሥራቸው ተካፍላችኋል’ ብሎ አይተረጉመውም።
- source_word: ἐγὼ ... ὑμεῖς
  choice: እኔ ... እናንተ
  rationale: በግሪኩ በግልጽ የተጠቀሱትንና ትንሽ አጽንዖት ያላቸውን ተውላጠ ስሞች በአማርኛም በግልጽ ይይዛል።
- source_word: κόπον
  choice: ድካማቸው
  rationale: ከκοπιάω ጋር ያለውን የቃል ዝምድና በ‘ደከመ/ድካም’ ይጠብቃል፤ ከቀላል ‘ሥራ’ ይልቅ የብርቱ ጥረትን ስሜት ያስተላልፋል።
theological_decisions:
- issue: ‘ሌሎች’ የሚያመለክታቸው እነማን እንደሆኑ
  choice: ማንነታቸውን ሳይወስን ‘ሌሎች’ ተብሎ ቀርቧል።
  alternative: ‘ሌሎች’ ነቢያትን፣ መጥምቁ ዮሐንስን፣ ኢየሱስን ወይም ቀደምት ምስክሮችን በተለይ ያመለክታሉ ብሎ መግለጽ።
  rationale: ቁጥሩ ራሱ የ‘ሌሎችን’ ማንነት አይገድብም፤ ትርጉሙም ይህን እውነተኛ አሻሚነት ይጠብቃል።
- issue: ወደ ድካማቸው መግባት የሚለው ፍቺ
  choice: የግሪኩ ምስላዊ አገላለጽ በዋናው ጽሑፍ ተጠብቋል።
  alternative: ‘የድካማቸውን ፍሬ ተቀበላችሁ’ ወይም ‘በሥራቸው ተካፈላችሁ’ ብሎ ትርጉሙን መግለጽ።
  rationale: ግሪኩ የድካሙን ውጤት ወይም በሥራው መካፈልን በቀጥታ አይልም፤ ስለዚህ የሥነ መለኮታዊ ክብደቱንና ክፍትነቱን መወሰን አልተገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። ‘ማጨድ’ የእርሻ ምሳሌውን ሲጠብቅ፣ ‘ደከመ/ድካም’ ደግሞ በግሪኩ ያለውን የቃል ዝምድና በተፈጥሯዊ አማርኛ ያንጸባርቃል።
