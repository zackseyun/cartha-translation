revisions:
- from: እኔ እናንተ ያልደከማችሁበትን እንድታጭዱ[a] ላክኋችሁ፤ ሌሎች ደክመዋል፣ እናንተም ወደ ድካማቸው ገብታችኋል።[b]
  to: እኔ እናንተ ያልለፋችሁበትን እንድታጭዱ[a] ላክኋችሁ፤ ሌሎች ለፍተዋል፣ እናንተም ወደ ልፋታቸው ገብታችኋል።[b]
  rationale: The revision is limited to replacing the fatigue-oriented ደከመ/ድካም wording with the labor-oriented cognate pair ለፋ/ልፋት. It therefore better reflects κοπιάω/κόπος and maintains the source’s repeated-word connection, without resolving the metaphor or identifying “others.”
