review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the agricultural image, the broad reference of “others,” the repeated perfect-tense idea, and the deliberately non-specific expression of entering into others’ labor. However, ደከመ/ድካም most commonly denotes becoming tired or fatigue in current Amharic and weakens κοπιάω/κόπος as sustained labor or toil.
  naturalness: The sentence structure is clear and suitably formal. Replacing ደከመ/ድካም with ለፋ/ልፋት yields more idiomatic modern Amharic for laborious work while retaining the Greek wordplay between verb and noun. “ወደ ልፋታቸው ገብታችኋል” remains intentionally somewhat figurative, as does the Greek.
  terminology: ማጨድ is an appropriate rendering of θερίζειν. The pair ለፋ/ልፋት more faithfully represents the cognate relationship between κοπιάω and κόπος than ደከመ/ድካም. No theological interpretation of “others” is introduced.
  issues:
  - severity: medium
    issue: ደከመ/ድካም can primarily communicate fatigue rather than labor/toil.
    rationale: κοπιάω and κόπος refer here to strenuous prior work. ለፋ/ልፋት naturally conveys that work and preserves the lexical linkage in the Greek.
  revised_text: እኔ እናንተ ያልለፋችሁበትን እንድታጭዱ[a] ላክኋችሁ፤ ሌሎች ለፍተዋል፣ እናንተም ወደ ልፋታቸው ገብታችኋል።[b]
