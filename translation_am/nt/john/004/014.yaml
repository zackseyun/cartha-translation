id: JHN.4.14
reference: John 4:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: am
  text: እኔ ለእርሱ ከምሰጠው ውሃ የሚጠጣ ማንም ግን ለዘላለም አይጠማም፤ ይልቁንም እኔ ለእርሱ የምሰጠው ውሃ በውስጡ ወደ ዘላለም ሕይወት የሚፈልቅ የውሃ ምንጭ ይሆናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: ለዘላለም አይጠማም
  rationale: ድርብ አሉታውንና εἰς τὸν αἰῶνα የሚያሳየውን ጠንካራና ዘላቂ ክልከላ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πηγὴ ὕδατος
  choice: የውሃ ምንጭ
  rationale: በሰውየው ውስጥ የሚገኝና ውሃ የሚፈልቅበትን ምንጭ በቀጥታ ይገልጣል።
- source_word: ἁλλομένου
  choice: የሚፈልቅ
  rationale: የግሱን ሕያው እንቅስቃሴ—ወደ ላይ መዝለልን ወይም በኃይል መፍለቅን—በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: ζωὴν αἰώνιον
  choice: ዘላለም ሕይወት
  rationale: በዮሐንስ ወንጌል የተለመደውን የዘላለማዊ ሕይወት ጽንሰ ሐሳብ ግልጽ አድርጎ ይጠብቃል።
theological_decisions:
- issue: ውሃው ወደ ዘላለም ሕይወት የሚፈልቅበት ግንኙነት
  choice: ወደ ዘላለም ሕይወት የሚፈልቅ
  alternative: ለዘላለም ሕይወት የሚፈልቅ
  rationale: εἰς የአቅጣጫ፣ የውጤት ወይም የዓላማ ጥላዎችን ሊይዝ ስለሚችል፣ «ወደ» የሚለው የምንጭን እንቅስቃሴ ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩን ተቃርኖ በ«ግን… ይልቁንም» በተፈጥሯዊ አገባብ ጠብቋል።
