lexical_decisions:
- source_word: ἔδει
  choice: ማለፍ ነበረበት
  rationale: የግሱ ያለፈ ጊዜ ቅርጽ በትረካ ውስጥ አስፈላጊነትን ይገልጣል፤ «ነበረበት» ይህን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያመለክታል፤ ከ«እርሱ» ጋር የተያያዘው «-ም» ቀላል አያያዥነቱን ይጠብቃል።
- source_word: αὐτὸν
  choice: እርሱ
  rationale: በግሪክ የማያቋርጥ ግስ ሰዋሰው ምክንያት ተሳቢ ቅርጽ ቢኖረውም፣ በአማርኛ የ«ነበረበት» አወቃቀር ባለቤት በተፈጥሯዊ ሁኔታ «እርሱ» ይሆናል።
- source_word: διέρχεσθαι
  choice: ማለፍ
  rationale: ግሱ በአንድ አካባቢ ውስጥ ወይም በኩል መጓዝን ያመለክታል፤ «ማለፍ» አጭርና ተፈጥሯዊ ነው።
- source_word: διὰ τῆς Σαμαρείας
  choice: በሰማርያ በኩል
  rationale: διά ከባለቤት ሙያ ጋር በቦታ ውስጥ ወይም በዚያ አቅጣጫ የሚደረግ እንቅስቃሴን ያሳያል፤ «በሰማርያ በኩል» የመንገድን ሐሳብ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: በἔδει የተገለጠው የአስፈላጊነት ኃይል
  choice: «ነበረበት» በማለት እውነተኛ አስፈላጊነት ተገልጧል፤ መሠረቱ ግን አልተወሰነም።
  alternative: ይህን እንደ መልክዓ ምድራዊ አመቺነት ብቻ ወይም እንደ መለኮታዊ ተልእኮ አስፈላጊነት መተርጎም።
  rationale: ግሪኩ አስፈላጊነትን ይገልጣል፣ በዚህ ቁጥር ግን ምክንያቱን አይገልጽም። ትርጉሙም ይህን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሰማርያ» የተለመደውን የመጽሐፍ ቅዱስ የስፍራ ስም አጻጻፍ ይከተላል።
