  verdict: revise
  source_fidelity: The draft correctly conveys the past narrative necessity of ἔδει without defining its basis. However, «በሰማርያ በኩል» can lean toward ‘by way of/via Samaria,’ whereas διὰ τῆς Σαμαρείας directly denotes passage through the region. «በሰማርያ ማለፍ» preserves the spatial force more closely.
  naturalness: «እርሱም በሰማርያ ማለፍ ነበረበት» is natural modern standard Amharic. The attached -ም supplies a suitably light narrative linkage for δέ without forcing a contrast.
  terminology: «ሰማርያ» is an established biblical spelling. «ነበረበት» appropriately retains necessity while leaving open whether its basis was practical or divine.
  issues:
  - severity: low
    issue: The phrase «በሰማርያ በኩል» is slightly less precise for διά with a genitive.
    rationale: In Amharic it may suggest traveling by way of Samaria rather than passing through Samaria itself. Removing «በኩል» gives a closer and still idiomatic rendering.
  - severity: low
    issue: The footnote’s alternative uses «መሄዱ», which is broader than the main verb ‘pass through.’
    rationale: Using «በሰማርያ ማለፉ» aligns the alternative more closely with διέρχεσθαι and retains the geographic sense.
  revised_text: እርሱም በሰማርያ ማለፍ ነበረበት።[a]
