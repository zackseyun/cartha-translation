- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: የሚልሽ ማን እንደሆነ
  rationale: የተናጋሪውን ማንነት የሚያጎላውን የግሪክ አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Δός μοι πεῖν
