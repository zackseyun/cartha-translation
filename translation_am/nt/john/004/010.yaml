  rationale: ቃል በቃል ‘እጠጣ ዘንድ ስጪኝ’ ከሚለው ይልቅ ወቅታዊና ተፈጥሯዊ ሲሆን የጽሑፉን ትርጉም አይጨምርም።
- source_word: σὺ ἂν ᾔτησας αὐτόν
  choice: አንቺ እርሱን በጠየቅሽው ነበር
