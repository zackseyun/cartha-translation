review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Jesus’ response, the gift of God, the identity of the speaker, and “living water.” However, the two result clauses use the instrumental prefix በ- (በጠየቅሽው / በሰጠሽ), which means “by asking/giving” rather than expressing the Greek contrary-to-fact result: “you would have asked … and he would have given.”'
  naturalness: The opening and the rendering የምጠጣውን ስጪኝ are natural and appropriately dignified. Recasting the conditional result clauses with finite verbs makes the sentence grammatical, clear, and idiomatic in modern standard Amharic.
  terminology: ኢየሱስ, እግዚአብሔር, ስጦታ, and ሕያው ውሃ are suitable. ሕያው ውሃ preserves the literal and figurative force of ὕδωρ ζῶν; the footnote appropriately records its ordinary-water sense without resolving the Johannine ambiguity.
  issues:
  - severity: high
    issue: The clauses አንቺ እርሱን በጠየቅሽው ነበር and እርሱም ... በሰጠሽ ነበር use instrumental በ- forms.
    rationale: These forms state means (“by asking him” / “by giving you”) rather than the apodosis of the counterfactual condition. The Greek σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι requires “you would have asked him, and he would have given you.”
