base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አላት፤ “የእግዚአብሔርን ስጦታና ‘የምጠጣውን ስጪኝ’ የሚልሽ ማን እንደሆነ ብታውቂ ኖሮ፣ አንቺ እርሱን ትለምኚው ነበር፤ እርሱም ሕያው ውሃ[a] ይሰጥሽ ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚፈስ ውሃ” ወይም “ንጹሕ ውሃ”፤ አገላለጹ የሚፈስ ውሃን ሊያመለክት ይችላል፣ “ሕያው ውሃ” ግን ኢየሱስ እዚህ የተጠቀመበትን ድርብ ትርጉም ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: ኢየሱስም መልሶ እንዲህ አላት
  rationale: የግሪኩን የመልስና የንግግር ድርብ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: τὴν δωρεὰν τοῦ θεοῦ
