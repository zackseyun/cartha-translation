language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: am
  text: “ኑ፣ ያደረግሁትን ሁሉ የነገረኝን ሰው እዩ። ይህ መሲሑ[a] ይሆን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ክርስቶስ ይሆን?”
    reason: የχριστός ሌላ የትርጉም አማራጭ፤ ቃሉን እንደ ተለመደው ‘ክርስቶስ’ በማለት ያቀርባል።
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: ኑ፣ … እዩ
  rationale: ሁለቱን የብዙ ቁጥር የግብዣ ትእዛዞች በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: ἄνθρωπον
  choice: ሰው
  rationale: በአውዱ ወንድ ግለሰብን የሚያመለክት ቢሆንም፣ ‘ሰው’ በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን አጠቃላይ ስም በትክክል ይወክላል።
- source_word: ὃς εἶπέ μοι
  choice: የነገረኝን
  rationale: ተከታዩን የይዘት ሐረግ በተፈጥሯዊ አማርኛ የሚያገናኝ አገላለጽ ነው።
- source_word: πάντα ὅσα ἐποίησα
  choice: ያደረግሁትን ሁሉ
  rationale: πάντα ὅσα ያለውን የሙሉነት አጽንዖት ይጠብቃል፤ የግሪኩ አኦሪስትም በቀድሞ ድርጊቶቿ ላይ ያተኩራል።
- source_word: μήτι
  choice: ይሆን?
  rationale: ጥያቄውን እንደ ጥንቃቄ የተሞላበትና ሌሎችን እንዲያስቡ የሚጋብዝ ጥያቄ ያቀርባል፤ አሉታዊ መልስ የመጠበቁን ፍንጭ ከመጠን በላይ አያጠናክርም።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: በዚህ አውድ χριστός እንደ መሲሐዊ ማዕረግ ያገለግላል፤ ‘መሲሑ’ የአይሁድን የመሲሕ ተስፋ በግልጽ ያሳያል።
theological_decisions:
- issue: χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ግል ስም ሳይሆን እንደሚጠበቀው የተቀባ ንጉሥ ማዕረግ ይሠራል፤ ስለዚህ ‘መሲሑ’ ትርጉሙንና አውዱን በቀጥታ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ መደበኛ አማርኛ። የብዙ ቁጥር ግብዣው ‘ኑ … እዩ’ ተብሎ ተጠብቋል፤ የμήτι ማመንታትም ‘ይሆን?’ በሚለው ተፈጥሯዊ ጥያቄ ተወክሏል።
