  rationale: ἀφίημι በዚህ የቦታ አገባብ ‘ትቶ መሄድ’ን ያመለክታል፤ ‘ከይሁዳ ወጥቶ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ከቀጣዩ የጉዞ ግስ ጋር አቀላጥፎ ያገናኘዋል።
