base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: am
  text: ሴቲቱም መልሳ፣ “ባል የለኝም” አለችው። ኢየሱስም፣ “ባል የለኝም ማለትሽ ትክክል ነው።” አላት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν αὐτῷ
  choice: ሴቲቱም መልሳ … አለችው
  rationale: የግሪኩን የመልስና የንግግር ቀመር በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ “አለችው” የαὐτῷን ተቀባይ ያሳያል።
- source_word: Οὐκ ἔχω ἄνδρα
  choice: ባል የለኝም
  rationale: ἀνήρ በመሠረቱ “ወንድ” ወይም “ባል” ሊሆን ቢችልም፣ ቁጥር 18 ያለው የጋብቻ አውድ “ባል” የሚለውን ትርጉም ይጠይቃል። “ባል የለኝም” በአማርኛ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: ኢየሱስም … አላት
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ λέγει በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ቀርቧል።
- source_word: Καλῶς εἶπας
  choice: ማለትሽ ትክክል ነው
  rationale: ቃል በቃል “መልካም አልሽ” ከሚለው ይልቅ፣ ኢየሱስ የንግግሯን እውነተኛነት መቀበሉን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: “ባል የለኝም” ማለትሽ
  rationale: ὅτι የተነገረውን ይዘት ያስገባል፤ ቀጥተኛውን ጥቅስና የክፍሉን ድግግሞሽ ጠብቆ በአማርኛ ተፈጥሯዊ አወቃቀር ቀርቧል።
theological_decisions:
- issue: የἀνήρ ትርጉም
  choice: ባል
  alternative: ወንድ
  rationale: ቃሉ ሁለቱንም ሊያመለክት ቢችልም፣ ቀጣዩ ቁጥር የሴቲቱን የጋብቻ ታሪክ በግልጽ ስለሚጠቅስ “ባል” የአውዱ ትክክለኛ ምርጫ ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። በእንግሊዝኛው ላይ የቀረቡት ማስታወሻዎች በአማርኛ ዋና ጽሑፍ ውስጥ በቀጥታና ያለ ትርጉማዊ ኪሳራ ስለተወከሉ፣ የግርጌ ማስታወሻ አልተጨመረም።
