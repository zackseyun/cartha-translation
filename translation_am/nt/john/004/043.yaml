lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: ከሁለቱ ቀናት በኋላም
  rationale: μετά ከተሳቢ ጋር የጊዜ ቅደም ተከተልን፣ ማለትም ‘በኋላ’ የሚለውን ያመለክታል። በ‘ሁለቱ ቀናት’ ላይ ያለው የተወሰነነት መለያ ቀደም ሲል የተጠቀሱትን ሁለት ቀናት ያመለክታል። δέ በትረካው ያለውን ቀላል ትስስር ‘-ም’ በሚለው ቅጥያ ተገልጧል።
- source_word: ἐξῆλθεν
  choice: ተነሥቶ … ሄደ
  rationale: ቃሉ በቀጥታ ‘ወጣ’ ማለት ቢሆንም፣ በጉዞ ትረካ ውስጥ ከአንድ ስፍራ መነሣትንና መሄድን በተፈጥሯዊ አማርኛ ለማሳየት ‘ተነሥቶ … ሄደ’ ተመርጧል።
- source_word: ἐκεῖθεν
  choice: ከዚያ
  rationale: ከቀደመው የትረካ ስፍራ መነሣቱን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ
  rationale: εἰς ወደ መድረሻ የሚደረግን እንቅስቃሴ ያመለክታል፤ ‘ወደ ገሊላ’ ይህን ትርጉም በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጣል።
