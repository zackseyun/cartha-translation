review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the woman leaving her water jar and going into the town. However, λέγει is a historical present in the Greek and is likewise retained as “says” in the English audit trail; the Amharic should retain this vivid present rather than shift it to past tense. The definite town noun also requires feminine agreement in natural standard Amharic.
  naturalness: «የውሃ ማሰሮዋን ትታ» is clear and natural. «ወደ ከተማዋ» supplies correct feminine agreement for ከተማ, and «ለሰዎቹም እንዲህ ትላለች፦» is a natural narrative introduction to the following direct speech.
  terminology: «የውሃ ማሰሮ» suitably conveys ὑδρία. «ሰዎቹ» is a defensible general rendering of τοῖς ἀνθρώποις; although the immediate context concerns men of the town, this verse’s noun itself is ανθρωποι and does not require an unnecessarily narrowed rendering.
  issues:
  - severity: medium
    issue: The historical present λέγει is translated with past tense «አለች».
    rationale: The source explicitly changes to present tense at the final verb, and the English POB audit trail deliberately preserves “says.” Amharic can naturally preserve it with «ትላለች».
  - severity: low
    issue: «ከተማው» has masculine agreement.
    rationale: In modern standard Amharic, ከተማ is feminine; the definite form here should be «ከተማዋ».
  revised_text: ስለዚህ ሴቲቱ የውሃ ማሰሮዋን ትታ ወደ ከተማዋ ሄደች፤ ለሰዎቹም እንዲህ ትላለች፦
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek historical present and corrects the grammatical gender of the definite town noun, while retaining the draft’s clear, modern wording and its direct-speech introducer.
