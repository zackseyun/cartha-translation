  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: am
  text: ስለዚህ ሴቲቱ የውሃ ማሰሮዋን ትታ ወደ ከተማዋ ሄደች፤ ለሰዎቹም እንዲህ ትላለች፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρίαν
  choice: የውሃ ማሰሮ
  rationale: ቃሉ ውሃ ለመቅዳትና ለመያዝ የሚያገለግል ዕቃን ያመለክታል፤ «የውሃ ማሰሮ» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: πόλιν
  choice: ከተማው
  rationale: የግሪኩን የተወሰነ መስተዋድድ ይጠብቃል፤ በዐውዱ የታወቀውን ስፍራ ያመለክታል።
- source_word: τοῖς ἀνθρώποις
  choice: ለሰዎቹ
  rationale: γένοςን የማይወስነውን አጠቃላይ ትርጉም ይጠብቃል፤ «ለወንዶቹ» ብሎ አላስፈላጊ ጾታዊ ውሳኔ አያስገባም።
- source_word: λέγει
  choice: አለች
  rationale: በግሪክ ታሪካዊ አሁን ጊዜ ቢሆንም፣ በተፈጥሯዊ ዘመናዊ አማርኛ የትረካውን ቅደም ተከተል በአለፈ ጊዜ መቀጠል ይበልጥ ግልጽ ነው።
