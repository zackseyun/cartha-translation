  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: am
  text: ስለዚህ ልጁ የተሻለበትን ሰዓት ጠየቃቸው። እነርሱም፣ “ትናንት በሰባተኛው ሰዓት[a] ትኩሳቱ ለቀቀው” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሰዓቱ ከፀሐይ መውጫ የሚቆጠር ከሆነ፣ ይህ ከቀኑ አንድ ሰዓት ገደማ (13:00) ማለት ነው፤ አንዳንዶች ግን ዮሐንስ የተለየ የሰዓት አቆጣጠር እንደተጠቀመ ይረዳሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο
  choice: ጠየቃቸው
  rationale: ግሱ ስለ አንድ ነገር መጠየቅን ወይም ማጣራትን ያመለክታል፤ በዐውዱ አባቱ አገልጋዮቹን ሰዓቱን ይጠይቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር ጋር ያለውን የትረካ እና የውጤት ግንኙነት ያሳያል።
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: ሰዓት ጠየቃቸው
  rationale: παρά ከጄኒቲቭ ጋር የመረጃውን ምንጭ ቢያመለክትም፣ በተፈጥሯዊ አማርኛ ‘ጠየቃቸው’ በማለት በትክክል ይገለጣል።
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: መሻል የጀመረበትን
  rationale: κομψότερον ἔσχεν የጤና ሁኔታው መሻሻሉን የሚገልጽ ፈሊጣዊ አነጋገር ነው፤ ‘መሻል የጀመረበት’ የለውጡን ጅማሬ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπαν οὖν αὐτῷ
  choice: እነርሱም … አሉት
  rationale: የአገልጋዮቹን መልስ እና የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ἐχθὲς
  choice: ትናንት
  rationale: የግሪኩን የጊዜ ተውሳክ ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: ὥραν ἑβδόμην
  choice: በሰባተኛው ሰዓት
  rationale: የሰዓት አቆጣጠሩን ወደ ዘመናዊ ሰዓት ሳይለውጥ የምንጩን አገላለጽና አሻሚነት ይጠብቃል።
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: ትኩሳቱ ለቀቀው
  rationale: የግሪኩን ሰዋስዋዊ አወቃቀር ይጠብቃል፤ ትኩሳት ከሰውየው መለየቱንም በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: የ‘ሰባተኛው ሰዓት’ አቆጣጠር
  choice: በዋናው ጽሑፍ ‘በሰባተኛው ሰዓት’ የሚለውን ቀጥተኛ አገላለጽ ማቆየት
  alternative: ከፀሐይ መውጫ ቢቆጠር ከቀኑ ሰባት ሰዓት ገደማ፤ ሌሎች ግን ዮሐንስ የተለየ የሰዓት አቆጣጠር እንደተጠቀመ ይረዳሉ
  rationale: ጥቅሱ የትኛው የሰዓት አቆጣጠር እንደሆነ አይገልጽም፤ ስለዚህ ወደ ዘመናዊ ሰዓት በመቀየር አሻሚነቱን መፍታት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መሻል የጀመረበትን’ የጤና መሻሻሉን ተፈጥሯዊ በሆነ አነጋገር ያቀርባል፤ ‘ትኩሳቱ ለቀቀው’ ደግሞ የምንጩን ምስላዊ አገላለጽ ይጠብቃል።
