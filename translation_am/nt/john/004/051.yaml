source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: am
  text: እርሱም ቀድሞውኑ እየወረደ ሳለ፣ ባሪያዎቹ ተገናኙት፤ ልጁ[a] በሕይወት እንዳለ ነገሩት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድ ልጁ።” የግሪክኛው παῖς “ልጅ፣” “ወንድ ልጅ፣” ወይም በአንዳንድ አውዶች “አገልጋይ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ገና
  rationale: ድርጊቱ ስብሰባው ከመሆኑ በፊት ቀድሞውኑ በሂደት ላይ እንደነበር በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: ትረካውን ወደፊት የሚያስቀጥል ቀላል አያያዥ ነው፤ በአማርኛ ከተያያዘው -ም ጋር በተፈጥሮ ተላልፏል።
- source_word: καταβαίνοντος
  choice: እየወረደ ሳለ
  rationale: የዘመን መደራረብንና በሂደት ላይ የነበረውን ከቃና ወደ ቅፍርናሆም የመውረድ ጉዞ ያሳያል።
- source_word: δοῦλοι
  choice: ባሪያዎቹ
  rationale: በቤቱ ሥልጣን ሥር የነበሩ ታስረው የሚያገለግሉ ሰዎችን የሚያመለክተውን ማኅበራዊ እውነታ ከ‘አገልጋዮች’ ይልቅ በግልጽ ይጠብቃል።
- source_word: ὑπήντησαν
  choice: አግኝተውት
  rationale: ወደ እርሱ መጥተው እንደተገናኙት በተፈጥሯዊ የአማርኛ ትረካ ይገልጻል።
- source_word: λέγοντες
  choice: አሉት
  rationale: በግሪክኛው ያለውን አብሮ የተከናወነ የንግግር ድርጊት በተፈጥሯዊ ቀጥተኛ ንግግር ይገልጻል።
- source_word: παῖς
  choice: ልጅህ
  rationale: ‘ልጅ’ የቤተሰብ ግንኙነቱን ይጠብቃል፤ የዕድሜ ደረጃን አይወስንም። የቃሉ ሌላ ሊሆን የሚችል ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ζῇ
  choice: በሕይወት አለ
  rationale: የግሪክኛውን የአሁን ጊዜ ቅርጽና ‘ሕያው ነው’ የሚለውን ቀጥተኛ ፍቺ ይጠብቃል፤ ‘ዳነ’ የሚለውን ትርጓሜ አይጨምርም።
theological_decisions:
- issue: በፈውሱ ትረካ ውስጥ παῖς የሚያመለክተው
  choice: ልጅህ
  alternative: ወንድ ልጅህ፤ አገልጋይህ
  rationale: παῖς ልጅን፣ ወንድ ልጅን ወይም በአንዳንድ አውድ አገልጋይን ሊያመለክት ይችላል። የዮሐንስ 4 ሰፊ አውድ የቤተሰብ ግንኙነትን ደግፎ ስለሚያሳይ ‘ልጅህ’ ተመርጧል፤ ነገር ግን ወንድነቱን በዚህ ቃል ብቻ አልተወሰነም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ ትረካ ተጠቅሟል። ቀጥተኛ ንግግር ለተፈጥሯዊነት ተመርጧል፤ ‘ባሪያዎቹ’ የጥንቱን የቤተሰብ ሥልጣንና የባርነት ሁኔታ ይጠብቃል።
