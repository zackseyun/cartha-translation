lexical_decisions:
- source_word: λέγει
  choice: አለችው
  rationale: የግሪክ ጽሑፉ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በተፈጥሯዊ ዘመናዊ አማርኛ ትረካ ያለፈ ጊዜው ይቀርባል፤ የተውላጠ ስሙ ተሳቢነትም በ«-ው» ተገልጧል።
- source_word: ἡ γυνή
  choice: ሴቲቱም
  rationale: በዐውዱ የሰማርያዋን ሴት ያመለክታል እንጂ «ሚስት» ማለት አይደለም፤ «-ም» የትረካውን ተከታታይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριε የጥሪ ቅርጽ ስለሆነ «ጌታ ሆይ» ተብሏል። በዚህ ዐውድ የአክብሮት አጠራርም ሊሆን ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: θεωρῶ
  choice: አያለሁ
  rationale: ኢየሱስ የገለጠውን ተከትሎ ሴቲቱ የደረሰችበትን ግንዛቤ በተፈጥሯዊ አማርኛ ያሳያል፤ «እገነዘባለሁ» ከሚለው ይበልጥ የዕለት ተዕለትና ክብር ያለው ነው።
- source_word: ὅτι προφήτης εἶ σύ
  choice: ነቢይ እንደሆንህ
  rationale: ὅτι ያስገባውን የግንዛቤ ይዘት በአማርኛ «እንደሆንህ» በተፈጥሯዊ ሁኔታ ያቀርባል። προφήτης ያለ የተወሰነ መስተዋድድ ስለሆነ «ነቢዩ» ተብሎ አልተወሰነም።
theological_decisions:
- issue: κύριος ለኢየሱስ እንደ አጠራር መተርጎም
  choice: ጌታ ሆይ
  alternative: ጌታዬ / የአክብሮት አጠራር
  rationale: ዋናው ጽሑፍ κύριοςን «ጌታ» ብሎ ይጠብቃል፤ ሆኖም በወቅቱ ሴቲቱ ሙሉ ክርስቶሎጂያዊ እምነትን እየተናገረች መሆኗ አይገደድም። ስለዚህ የአክብሮት አጠራር ሊሆን የሚችለው ትርጉም በማስታወሻ ተገልጧል።
- issue: προφήτης የተወሰነ ማንነት እንዳለው ማቅረብ ወይም አለማቅረብ
  choice: ነቢይ
  alternative: ነቢዩ
  rationale: የግሪክ ሐረጉ ኢየሱስን «ያ ነቢይ» ብሎ በግልጽ አይለይም፤ ሴቲቱ ነቢይ መሆኑን እንደተገነዘበች ብቻ ያቀርባል።
