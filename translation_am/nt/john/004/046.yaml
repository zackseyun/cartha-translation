base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: am
  text: ስለዚህ እንደገና ወደ የገሊላ ቃና፣ ውኃውን ወይን ጠጅ ያደረገበት ቦታ፣ መጣ። በቅፍርናሆም ወንድ ልጁ ታሞ የነበረ አንድ የንጉሥ ባለሥልጣን[a] ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቤተ መንግሥት ሹም” ወይም “የንጉሥ አገልጋይ።” የግሪኩ βασιλικός ከንጉሥ፣ ከንጉሣዊ ቤተ መንግሥት ወይም ከንጉሣዊ አገልግሎት ጋር የተያያዘን ሰው ያመለክታል፤ ትክክለኛ ማዕረጉን ግን አይገልጽም።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ትረካ ከዚህ ክስተት ጋር የሚያያይዘውን የመደምደሚያና የትረካ ቅጥያ ኃይል ይጠብቃል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ወደ ቃና መመለሱን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: በገሊላ ወዳለችው ቃና
  rationale: የቦታውን ስምና ከገሊላ ጋር ያለውን ክልላዊ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: ውኃውን ወይን ጠጅ አድርጎ ነበር
  rationale: ‘ውኃውን ወይን አደረገ’ የሚለውን የግሪኩን ቀጥተኛ አነጋገር ይጠብቃል፤ ‘ነበር’ ድርጊቱ ከአሁኑ መምጣት በፊት መፈጸሙን ያሳያል።
- source_word: βασιλικός
  choice: የንጉሥ ባለሥልጣን
  rationale: ግለሰቡ ከንጉሣዊ አገልግሎት ወይም ቤተ መንግሥት ጋር የነበረውን ግንኙነት ያሳያል፤ የተወሰነ ማዕረግ ወይም የመኳንንት ዘር እንዳለው አይገምትም።
- source_word: τις
  choice: አንድ
  rationale: ያልተሰየመን የተወሰነ ሰው በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: ὁ υἱὸς ἠσθένει
  choice: ልጁ የታመመበት
  rationale: υἱός ወንድ ልጅን ቢያመለክትም ‘ልጁ’ በአማርኛ ተፈጥሯዊ ሲሆን በአውዱ የወንድ ልጁን ማመልከቱ ግልጽ ነው፤ ἠσθένει አካላዊ ሕመምን ያመለክታል።
- source_word: Καφαρναούμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታ ስም ይጠቀማል።
theological_decisions:
- issue: βασιλικός ታሪካዊ ማንነትንና ማዕረግን ሳይጨምሩ መተርጎም
