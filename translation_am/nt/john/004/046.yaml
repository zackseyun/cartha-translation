  alternative: መኰንን፤ የንጉሥ አገልጋይ፤ የቤተ መንግሥት ሹም
  rationale: ጽሑፉ ሰውየውን ከንጉሥ ወይም ከንጉሣዊ አገልግሎት ጋር ያያይዘዋል እንጂ ትክክለኛ ሹመቱን፣ የመኳንንት ዘሩን ወይም የትኛውን ገዥ እንደሚያገለግል አይወስንም።
