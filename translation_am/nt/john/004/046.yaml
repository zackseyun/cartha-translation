  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የትረካ ቅደም ተከተል ተጠብቆ ሳለ፣ የአማርኛ ተፈጥሯዊ አገባብ ተከትሏል።
