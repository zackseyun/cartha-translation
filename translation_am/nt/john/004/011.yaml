base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: am
  text: ሴቲቱም፣ “ጌታዬ[a]፣ ውኃ መቅጃ የለህም፤ ጉድጓዱም ጥልቅ ነው። ታዲያ ሕያው ውኃ[b] ከየት ታገኛለህ?” አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌታዬ” የሚለው የግሪክ ቃል በዚህ ዐውድ ቀላል የአክብሮት አጠራር፣ እንደ “ሰር” ወይም “ጌታዬ” ተብሎ የሚጠቀምበት፣ ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም “የሚፈስ ውኃ”፤ ማለትም ከቆመ ውኃ የተለየ ንጹሕ የምንጭ ውኃ። “ሕያው ውኃ” የሚለው አገላለጽ በኢየሱስ ቃል ያለውን ጥልቅ ፍቺም ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
