  choice: ሴቲቱም … አለችው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል፤ αὐτῷ ደግሞ በ‘አለችው’ ውስጥ ተካትቷል።
- source_word: Κύριε
  choice: ጌታዬ
  rationale: ቃሉን በመደበኛው ‘ጌታ’ ትርጉም ያቀርባል፤ የባለቤትነት ቅጥያውም በአማርኛ ቀጥተኛ ንግግር የተፈጥሮ አድራሻ ነው። በዚህ ዐውድ ‘ጌታዬ’ የአክብሮት አጠራርም ሊሆን ስለሚችል ይህ ጥርጣሬ በማስታወሻ ተጠብቋል።
- source_word: ἄντλημα
  choice: ውኃ መቅጃ
  rationale: ውኃን ከጉድጓድ ለማውጣት የሚያገለግል ዕቃ መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል፤ ቅርጹን በ‘ባልዲ’ ብሎ ሳይወስን የምንጩን ሰፊ ትርጉም ይጠብቃል።
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: ጉድጓዱም ጥልቅ ነው
  rationale: φρέαρ በዐውዱ የውኃ ጉድጓድን ያመለክታል፤ βαθύ ደግሞ ያለ ተጨማሪ ማጠናከሪያ ‘ጥልቅ’ ተብሏል። የግሪኩ καί ሁለተኛውን ሁኔታ ይጨምራል እንጂ ጥልቅነቱን አይክድም።
- source_word: πόθεν οὖν ἔχεις
  choice: ታዲያ … ከየት ታገኛለህ?
  rationale: οὖν ከቀደመው ምክንያት የሚነሳውን ድምዳሜ ‘ታዲያ’ በማለት ያሳያል፤ πόθεν ደግሞ የምንጩን ቦታ ይጠይቃል።
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: ሕያው ውኃ
  rationale: የግሪኩን ቀጥተኛ አገላለጽና በዮሐንስ ትረካ ያለውን ድርብ ፍቺ ይጠብቃል፤ በተለመደ ንግግር ‘የሚፈስ ውኃ’ ማለት ሊሆን ይችላል።
theological_decisions:
