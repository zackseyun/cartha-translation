  rationale: የወደፊት ሁኔታዊ ጊዜውንና በἐκεῖνος ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: ሁሉንም ይነግረናል
  rationale: መሲሑ ነገሮችን ለእነርሱ እንደሚያሳውቅ የሚገልጸውን ሐሳብ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል፤ “ሁሉንም” የἅπανταን አጠቃላይ ኃይል ይጠብቃል።
