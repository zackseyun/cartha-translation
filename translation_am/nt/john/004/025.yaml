    text: “መሲሕ” ከሴማዊ ቋንቋ የመጣ መጠሪያ ሲሆን፣ “ክርስቶስ” የግሪክ መጠሪያ ነው፤ ሁለቱም “የተቀባው” ማለት ናቸው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: ሴቲቱም … አለችው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ በኃላፊ ጊዜ ተተርጉሟል፤ የተሳቢው ወንድነትም በ“አለችው” ተጠብቋል።
- source_word: Οἶδα
