  rationale: ዮሐንስ ሴማዊውን “መሲሕ” በግሪኩ “ክርስቶስ” የሚያብራራበትን ሁለት-ቋንቋዊ መዋቅር ይጠብቃል።
- source_word: ὅταν ἔλθῃ ἐκεῖνος
