- source_word: Μεσσίας
  choice: መሲሕ
  rationale: ከሴማዊው መጠሪያ የመጣውን ቃል በአማርኛ የተለመደው ቅርጽ ያቆያል።
- source_word: ἔρχεται
  choice: እንደሚመጣ
  rationale: የአሁን ጊዜው ግስ እዚህ የወደፊት ትርጉም ስላለው፣ በተዘዋዋሪ ንግግሩ ውስጥ ይህ አገላለጽ ተፈጥሯዊ ነው።
- source_word: ὁ λεγόμενος χριστός
