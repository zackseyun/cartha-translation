- source_word: τὰς χώρας
  choice: እርሻዎቹን
  rationale: በመከር ዐውድ ውስጥ χώρας የሚያመለክተውን የተዘራ መሬት በግልጽ ይገልጻል።
- source_word: λευκαί εἰσιν
  choice: ነጭ ሆነዋል
  rationale: ‘ደርሰዋል’ ብሎ በቀጥታ ከመተርጎም ይልቅ በግሪኩ ያለውን ‘ነጭ’ የሚል ምስል ይጠብቃል።
- source_word: πρὸς θερισμόν
