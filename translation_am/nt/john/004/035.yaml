    text: ወይም፣ “ለመታጨድ ዝግጁ ናቸው።” የግሪኩ ጽሑፍ “ነጭ” ይላል፤ ይህም የመከሩን የእይታ ምስል ጠብቆ ለመታጨድ ዝግጁ መሆናቸውን ያመለክታል።
