- source_word: ὁ θερισμὸς ἔρχεται
  choice: መከሩ ይደርሳል
  rationale: የአሁን ጊዜውን ምሳሌያዊ አነጋገር ጠብቆ፣ የመከር ጊዜ መምጣቱን ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የንግግር ምልክት በክብር ያለውና በዘመናዊ የመጽሐፍ ቅዱስ አማርኛ የተለመደ ቃል ይወክላል።
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
