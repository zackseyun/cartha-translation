    text: ወይም፣ “ማንም የሚበላ ነገር አምጥቶለት አይሆንም፣ አይደል?” የግሪኩ ጥያቄ μή የሚለውን ቃል በመጠቀሙ አሉታዊ መልስ እንደሚጠበቅ ያሳያል።
