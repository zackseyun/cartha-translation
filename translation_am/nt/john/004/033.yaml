- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በዮሐንስ ወንጌል ውስጥ μαθηταίን የሚያመለክተው የተለመደና ትክክለኛ ቃል ነው።
- source_word: πρὸς ἀλλήλους
  choice: እርስ በርሳቸው
  rationale: በቡድኑ ውስጥ እርስ በርስ መነጋገራቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Μή τις
  choice: … ሰው ይኖር ይሆን?
  rationale: μή ጥያቄው አሉታዊ መልስን እንደሚጠብቅ ያመለክታል፤ ይህ አገላለጽ ጥያቄውን ክፍት አድርጎ ሲያቀርብ የጥርጣሬውን ዝንባሌ ይጠብቃል።
- source_word: ἤνεγκεν αὐτῷ
  choice: ያመጣለት
  rationale: የφέρωን በዚህ አውድ ያለውን ‘ማምጣት’ ትርጉምና የαὐτῷን ተቀባይነት በአንድ ተፈጥሯዊ የአማርኛ ግስ ያቀርባል።
- source_word: φαγεῖν
  choice: የሚበላ ነገር
  rationale: የመብላት ዓላማ ያለውን የተገመተ ነገር በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
