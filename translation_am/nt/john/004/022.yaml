  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: am
  text: እናንተ የማታውቁትን ታመልካላችሁ፤ እኛ የምናውቀውን እናመልካለን፤ ምክንያቱም መዳን ከአይሁድ[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከአይሁድ ሕዝብ»። በዮሐንስ መጽሐፍ በሌሎች አውዶች «የይሁዳ ነዋሪዎች» የሚለው ትርጉም ሊስማማ ይችላል፤ እዚህ ግን አውዱ በአምልኮና በድነት ታሪክ ጉዳይ ሳምራውያንንና አይሁድን ያነጻጽራል።
