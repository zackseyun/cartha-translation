- source_word: οἴδατε / οἴδαμεν
  choice: የማታውቁትን / የምናውቀውን
  rationale: «ማወቅ» የግሪኩን የእውቀት ትርጉምና የሁለቱን ወገኖች ሹል ንጽጽር በቀጥታ ያስተላልፋል።
- source_word: σωτηρία
  choice: መዳን
  rationale: «መዳን» በአማርኛ የእግዚአብሔርን የማዳን ሥራ በተፈጥሯዊና በሰፊ መንፈሳዊ ትርጉም የሚገልጽ የተለመደ ቃል ነው።
