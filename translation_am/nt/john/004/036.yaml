  rationale: በዚህ ሐረግ ውስጥ ራሱን የቻለ ‘አሁን/አስቀድሞ’ የሚል የግሪክኛ ቃል የለም፤ የአውዱን አጽንዖት በግስ ጊዜው ብቻ መግለጽ ከምንጩ ጋር ይበልጥ ይቀራረባል።
- issue: εἰς ζωὴν αἰώνιον ዓላማን ወይስ ውጤትን እንደሚያመለክት
  choice: ‘ለዘላለም ሕይወት’ ተብሎ ክፍት ተተርጉሟል።
  alternative: ‘ወደ ዘላለም ሕይወት’ ወይም ‘ዘላለም ሕይወት እንዲያስገኝ’
  rationale: የግሪክኛው ቅድመ አያያዥ ወደ ግብ መመራትን ወይም ውጤትን ሊያመለክት ይችላል፤ ትርጉሙ ከሁለቱ አንዱን ብቻ አይወስንም።
