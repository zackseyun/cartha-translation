theological_decisions:
- issue: የአሁን ጊዜውን አጽንዖት ‘አሁን’ ወይም ‘አስቀድሞ’ በሚል ተጨማሪ ቃል ማብራራት
  choice: ተጨማሪ የጊዜ ተውሳክ አልገባም፤ የአሁን ጊዜው በ‘ይቀበላል’ና ‘ይሰበስባል’ ተገልጧል።
