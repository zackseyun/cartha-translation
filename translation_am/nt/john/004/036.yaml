base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: am
  text: የሚያጭደው ደመወዙን[a] ይቀበላል፤ ለዘላለም ሕይወት[b] ፍሬ ይሰበስባል። ይህም የሚዘራውና የሚያጭደው አብረው ደስ እንዲላቸው ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዋጋውን” ወይም “ሽልማቱን።” የግሪክኛው ቃል ለተሠራ ሥራ የሚከፈል ደመወዝን ወይም የሚሰጥ ዋጋን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ወደ ዘላለም ሕይወት።” ሐረጉ ግብን ወይም ውጤትን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
