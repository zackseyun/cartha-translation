  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: am
  text: ስለዚህ ሳምራውያኑ ወደ እርሱ በመጡ ጊዜ፣ ከእነርሱ ጋር እንዲቆይ ይለምኑት ነበር[a]፤ እርሱም በዚያ ሁለት ቀን ቆየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለመኑት።» የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ አገላለጽ ልመናው የቀጠለ ወይም የተደጋገመ መሆኑን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: ስለዚህ ... በመጡ ጊዜ
  rationale: የοὖνን የውጤት/ትስስር ኃይል በ«ስለዚህ»፣ የὡςን ጊዜያዊ ትርጉም ደግሞ በ«በመጡ ጊዜ» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἦλθον πρὸς αὐτὸν
  choice: ወደ እርሱ በመጡ
  rationale: πρός ከተሳቢ ጋር ወደ አንድ ሰው መቅረብን ወይም መምጣትን ያመለክታል፤ «ወደ እርሱ መጡ» ይህን በግልጽ ያቀርባል።
- source_word: οἱ Σαμαρῖται
  choice: ሳምራውያኑ
  rationale: የተወሰነውን የሕዝብ ቡድን በተለመደው የአማርኛ የዘር/አካባቢ መጠሪያ ያቀርባል።
- source_word: ἠρώτων
  choice: ይለምኑት ነበር
  rationale: የግሪኩን ያልተፈጸመ የኃላፊ ጊዜ ገጽታ፣ ማለትም የቀጠለ ወይም የተደጋገመ ልመና ሊሆን የሚችለውን፣ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: ከእነርሱ ጋር እንዲቆይ
  rationale: μένωን «መቆየት»፣ παρά ከተሳቢ ጋር ያለውን የአብሮነት ሐሳብ ደግሞ «ከእነርሱ ጋር» ብሎ ያቀርባል።
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: እርሱም በዚያ ... ቆየ
  rationale: ከμεῖναι ጋር ያለውን የቃል ትስስር በ«ቆየ» ይጠብቃል፤ ἐκεῖም «በዚያ» ተብሎ በግልጽ ተወክሏል።
- source_word: δύο ἡμέρας
  choice: ሁለት ቀን
  rationale: የጊዜ ቆይታውን ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
