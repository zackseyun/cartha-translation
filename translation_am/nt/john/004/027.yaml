  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርቱ’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ‘ይነጋገር ስለነበር’ ደግሞ የቀጣይ ውይይትን ገጽታ በተፈጥሯዊ አማርኛ ያቀርባል።
