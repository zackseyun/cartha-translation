  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: am
  text: በዚያው ጊዜ ደቀ መዛሙርቱ መጡ፤ ከአንዲት ሴት ጋር ሲነጋገር በማየታቸው ተደነቁ። ሆኖም አንዳቸውም፣ “ምን ትፈልጋለህ?[a]” ወይም “ለምን ከእሷ ጋር ትነጋገራለህ?[b]” አላሉትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ምን ትፈልጋለህ?” የሚለው “ምን ትሻለህ?” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከእሷ ጋር ምን ትናገራለህ?” ማለት ነው፤ በዚህ አውድ ግን ትርጉሙ፣ “ለምን ከእሷ ጋር ትነጋገራለህ?” የሚል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: በዚያው ጊዜ
  rationale: አገላለጹ የቦታ ሳይሆን የጊዜ ትርጉም አለው፤ የትረካውን ቅጽበታዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐθαύμαζον
  choice: ተደነቁ
  rationale: የደቀ መዛሙርቱን የመገረም ምላሽ በግልጽና በተለመደ አማርኛ ይገልጣል፤ የግሱ ያልተፈጸመ ገጽታ በዐውዱ የሚታየውን ቀጣይ ሁኔታ ይደግፋል።
- source_word: μετὰ γυναικὸς
  choice: ከአንዲት ሴት ጋር
  rationale: γυνή በዚህ ዐውድ ‘ሴት’ ማለት ሲሆን፣ መስተዋድድ ስለሌለው ያልተወሰነነቱን ‘አንዲት’ ይጠብቃል።
- source_word: ἐλάλει / λαλεῖς
  choice: ይነጋገር / ትነጋገራለህ
  rationale: ‘መነጋገር’ ከሴቲቱ ጋር እየተካሄደ ያለውን ውይይት በተፈጥሯዊ አማርኛ ይገልጣል፤ በሁለቱ የግሪክ አጠቃቀሞች መካከል ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: μέντοι
  choice: ሆኖም
  rationale: ቢደነቁም ጥያቄያቸውን አለመናገራቸውን የሚያሳየውን ተቃርኖ በክብር ያለው ዘመናዊ አገላለጽ ያቀርባል።
- source_word: Τί ζητεῖς;
  choice: ምን ትፈልጋለህ?
  rationale: ζητέω ‘መፈለግ/መሻት’ ማለት ነው፤ ቀጥተኛ ተሳቢው ስላልተገለጸ፣ አማርኛውም ጥያቄውን ክፍት አድርጎ ይጠብቃል። ‘ምን ትሻለህ?’ የሚለው አማራጭ በማስታወሻ ተቀምጧል።
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: ለምን ከእሷ ጋር ትነጋገራለህ?
  rationale: ቃል በቃል τί ‘ምን’ ቢሆንም፣ ከμετά ጋር በዚህ ዐውድ የጥያቄው ተግባራዊ ኃይል ‘ለምን’ ነው። ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ኢየሱስ ከሴት ጋር በመነጋገሩ የተነሣው ማኅበራዊ አንድምታ
  choice: ደቀ መዛሙርቱ መደነቃቸውን ብቻ መግለጽ፣ ምክንያቱን በዋናው ጽሑፍ አለማስፋት
