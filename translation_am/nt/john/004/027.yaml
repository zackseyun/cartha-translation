  rationale: የግሪኩ ጽሑፍ ከሴት ጋር ሲነጋገር በማየታቸው መደነቃቸውን ብቻ ይናገራል፤ የማኅበራዊ ታሪክ ዳራው ጠቃሚ ቢሆንም ቁጥሩ ራሱ ምክንያቱን አይዘረዝርም።
