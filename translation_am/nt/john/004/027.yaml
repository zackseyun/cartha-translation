    rationale: The Greek presents the disciples’ amazement at Jesus’ ongoing conversation. ‘ከአንዲት ሴት ጋር ሲነጋገር በማየታቸው’ expresses this relationship naturally, while retaining the ongoing sense of ἐλάλει and avoiding an unnecessary explicit subject.
