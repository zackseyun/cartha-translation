    text: “አመኑ” የሚለው ግስ የአባቱን ማመን በተለይ የኢየሱስን ቃል ማመን አድርጎ ወይም በኢየሱስ ላይ የበለጠ እምነት ማድረግ አድርጎ ሊያመለክት ይችላል፤ የግሪኩ ጽሑፍ የእምነቱን ወሰን በግልጽ አይወስንም።
    reason: alternative_reading
