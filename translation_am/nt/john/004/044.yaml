  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: am
  text: ኢየሱስ ራሱ፣ «ነቢይ በገዛ አገሩ[a] ክብር የለውም» ብሎ መስክሯልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በገዛ የትውልድ ስፍራው» ወይም «በገዛ አካባቢው»። የግሪኩ πατρίς የአንድን ሰው አገር፣ የትውልድ ስፍራ ወይም የትውልድ አካባቢ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: -ና
  rationale: የግሪኩ γάρ ከአውዱ ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ ሐረግ መጨረሻ ያሳያል።
- source_word: αὐτὸς ... Ἰησοῦς
  choice: ኢየሱስ ራሱ
  rationale: αὐτός የሚሰጠውን አጽንዖት በተፈጥሯዊና ግልጽ አማርኛ ይጠብቃል።
- source_word: ἐμαρτύρησεν
  choice: መስክሮአል
  rationale: የμαρτυρέωን የምስክርነት ቃላዊ መስክ ይጠብቃል፤ በዮሐንስም ውስጥ ያለውን ጠቀሜታ አያጠፋም።
- source_word: ὅτι
  choice: “... ብሎ”
  rationale: የምስክርነቱን ይዘት በአማርኛ ቀጥተኛ ንግግር በተፈጥሯዊ ሁኔታ ያስገባል።
- source_word: προφήτης
  choice: ነቢይ
  rationale: አንቀጽ የሌለውን ነጠላ ስም እንደ አጠቃላይ ምሳሌያዊ አባባል ያቀርባል።
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: በገዛ አገሩ
  rationale: ἰδίᾳን ‘ገዛ’ በማለት አጽንዖቱን ይጠብቃል፤ πατρίςንም የትውልድ ስፍራ፣ የአገር ክፍል ወይም የገዛ አገር ሊያመለክት በሚችል ሰፊ ቃል ይተረጉማል።
- source_word: τιμὴν οὐκ ἔχει
  choice: ክብር የለውም
  rationale: የግሪኩን ስማዊ አገላለጽ ‘ክብር’ በማለት በቅርብና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በዮሐንስ ትረካ ውስጥ ‘የገዛ አገሩ’ የሚለው የሚያመለክተው ስፍራ
  choice: አባባሉን በአጠቃላይ መልኩ መተርጎምና ስፍራውን አለመወሰን
  alternative: ይሁዳ፣ ገሊላ ወይም ናዝሬት/የትውልድ አካባቢ
  rationale: ጥቅሱ ራሱ የትኛውን ስፍራ እንደሚያመለክት በግልጽ አይወስንም፤ ስለዚህ ትርጉሙ የትርጓሜ ውጥረቱን ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ቀጥተኛ ንግግር መጠቀሙ ὅτιን በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
