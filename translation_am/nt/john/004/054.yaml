    text: ወይም፣ «ተአምር»። ዮሐንስ የድርጊቱን ኃይል ብቻ ሳይሆን ትርጉሙንም ለማጉላት «ምልክት» የሚለውን ቃል ብዙ ጊዜ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ይህም
  rationale: የተዘገበውን ፈውስ ወደ ኋላ የሚያመለክት ሲሆን፣ δὲ ያለውን ቀላል አያያዥነትም «ም» ያሳያል።
- source_word: πάλιν δεύτερον
  choice: ሁለተኛው
  rationale: πάλιν ከ δεύτερον ጋር በመሆን ይህ በገሊላ የተደረገው በቅደም ተከተል ሁለተኛ ምልክት መሆኑን ያሳያል፤ «እንደገና ሁለተኛ» ማለት በአማርኛ ከባድና አላስፈላጊ ድግግሞሽ ይፈጥራል።
- source_word: σημεῖον
  choice: ምልክት
  rationale: በዮሐንስ ዘገባ ቃሉ ከተአምራዊ ኃይሉ ባሻገር ድርጊቱ ወደሚገልጠው እውነት ያመለክታል።
- source_word: ἐποίησεν
  choice: ያደረገው
  rationale: ποιέω ከ σημεῖον ጋር ያለውን የተለመደ አገባብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐλθὼν
  choice: ከመጣ በኋላ
  rationale: የአኦሪስት አሳታፊውን በዚህ አውድ ያለውን ጊዜያዊ ግንኙነት በግልጽ አማርኛ ይገልጣል።
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: ከይሁዳ ወደ ገሊላ
  rationale: የመነሻና የመድረሻ አቅጣጫውን በተፈጥሯዊ የአማርኛ አገባብ ይጠብቃል።
theological_decisions:
- issue: የዮሐንስ σημεῖον አጠቃቀም
  choice: ምልክት
  alternative: ተአምር
  rationale: «ምልክት» ድርጊቱን እንደ ኃይል ሥራ ብቻ ሳይሆን ወደ መገለጥ ትርጉሙ የሚያመለክት የዮሐንስን ሥነ ጽሑፋዊና ሥነ መለኮታዊ አጠቃቀም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። የግሪኩ የዓረፍተ ነገር አወቃቀር ቃል በቃል ሳይጫን፣ የአማርኛ ተፈጥሯዊ ግስ-መጨረሻ ሥርዓት ተከትሏል።
