  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: am
  text: የንጉሡ ባለሥልጣንም፣ “ጌታ ሆይ፣[a] ልጄ ሳይሞት ውረድ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ κύριε የሚለው ቃል “ጌታ” ማለት ሲሆን፣ እንደ “ጌታዬ” ያለ የአክብሮት አጠራርም ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: የንጉሡ ባለሥልጣን
  rationale: ቃሉ ከንጉሥ ወይም ከንጉሣዊ ቤተ መንግሥት ጋር የተያያዘን ሰው ያመለክታል። ይህ አተረጓጎም የማዕረግ መኳንንትነትን ሳይጨምር የንጉሡ ሹም መሆኑን በግልጽ ያሳያል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριε ለኢየሱስ የቀረበ ቀጥተኛ አጠራር ሲሆን ‘ጌታ’ የሚለውን ሰፊ ትርጉምና የአክብሮት አጠራር የመሆን ዕድሉን ይጠብቃል።
- source_word: κατάβηθι
  choice: ውረድ
  rationale: የቦታውን ከፍታና ወደ ታች የሚደረገውን ጉዞ የሚያመለክተውን የግሪኩን ትእዛዝ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρὶν ἀποθανεῖν
  choice: ሳይሞት
  rationale: πρίν ከዘርዓዊ ግስ ጋር የቀደመ ጊዜን ይገልጣል፤ ‘ሳይሞት’ ይህን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ παιδίον μου
  choice: ልጄ
  rationale: παιδίον ሕፃንን ወይም ልጅን ያመለክታል። ‘ልጄ’ ጾታን ሳይወስን የግሪኩን መሠረታዊ ትርጉም ይጠብቃል።
- source_word: λέγει πρὸς αὐτόν
  choice: አለው
  rationale: በግሪክ ታሪካዊ አሁን ጊዜ የተጻፈውን የንግግር መግቢያ ለአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ያቀርባል፤ ተውላጠ ስሙም ንግግሩ ወደ ኢየሱስ መቅረቡን ያሳያል።
theological_decisions:
- issue: κύριος ለኢየሱስ እንደ ቀጥተኛ አጠራር ሲጠቀስ
  choice: ጌታ ሆይ
