  text: በዚያም የያዕቆብ ምንጭ[a] ነበር። ስለዚህ ኢየሱስ ከጉዞው የተነሳ ደክሞ፣ እንደዚያው[b] በምንጩ አጠገብ ተቀምጦ ነበር። ስድስተኛው ሰዓት ገደማ[c] ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጉድጓድ።” የግሪኩ ቃል ምንጭን ወይም የውሃ ጉድጓድን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ባለበት ሁኔታ” ወይም “በዚህ ሁኔታ።” የግሪኩ ቃል የሚያመለክተው አኳኋን በትክክል አሻሚ ነው።
    reason: lexical_alternative
  - marker: c
    text: በአይሁድ የቀን ሰዓት አቆጣጠር ይህ ቀትር ገደማ ነው። የሮማውያን የሰዓት አቆጣጠር እዚህ ጥቅም ላይ ውሏል የሚለው አመለካከት ግን ጠዋት ስድስት ሰዓት ገደማ እንደሆነ ይወስደዋል።
    reason: alternative_reading
