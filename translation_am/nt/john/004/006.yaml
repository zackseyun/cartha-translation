  rationale: ‘ስድስተኛው ሰዓት’ የምንጩን አገላለጽ ይጠብቃል፤ ‘ገደማ’ ደግሞ ὡς የሚያሳየውን ግምታዊነት ይገልጣል። በዋናው ጽሑፍ ‘ቀትር’ ብሎ አለመተርጎም የጊዜ አቆጣጠሩን ክርክር አስቀድሞ ከመወሰን ይቆጠባል።
