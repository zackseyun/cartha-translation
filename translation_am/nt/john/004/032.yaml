id: JHN.4.32
reference: John 4:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: am
  text: እርሱ ግን እንዲህ አላቸው፦ «እኔ እናንተ የማታውቁት የምበላው ምግብ አለኝ።»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እናንተ የማታውቁት የምበላው ነገር አለኝ።» ከቀጣዩ አውድ እንደሚታየው፣ ኢየሱስ በዘይቤ እየተናገረ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በደቀ መዛሙርቱ አስተሳሰብና በኢየሱስ ምላሽ መካከል ያለውን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: የግሪኩን ‘ለእነርሱ አለ’ ትርጉም በአጭርና በተፈጥሯዊ የአማርኛ የትረካ አገላለጽ ያቀርባል።
- source_word: Ἐγὼ
  choice: የምበላው … አለኝ
  rationale: በግሪክ ግልጽ የሆነው የመጀመሪያ መደብ ተውላጠ ስም ያለው ንፅፅር በአማርኛው የግስ ቅርጽና ‘አለኝ’ ተጠብቋል፤ ‘እኔ’ ማከል ከሚያስፈልገው በላይ አጽንዖት ሊሰጥ ይችላል።
- source_word: βρῶσιν
  choice: ምግብ
  rationale: ቃሉ እዚህ የመብላትን ተግባር ሳይሆን የሚበላ ነገርን ያመለክታል፤ ‘ምግብ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἔχω φαγεῖν
  choice: የምበላው ምግብ አለኝ
  rationale: ‘ለመብላት ምግብ አለኝ’ ከሚለው ግትር ቅርጽ ይልቅ የመብላት ዓላማውንና የይዞታውን ሐሳብ በዘመናዊ አማርኛ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἣν ὑμεῖς οὐκ οἴδατε
  choice: እናንተ የማታውቁት
  rationale: ‘እናንተ’ የሚለው ግልጽ ተውላጠ ስም የግሪኩን ንፅፅር ይጠብቃል፤ አንጻራዊው አንቀጽም ወደ ‘ምግብ’ በግልጽ ይመለሳል።
theological_decisions:
- issue: ኢየሱስ ‘ምግብ’ የሚለውን በዘይቤ መጠቀሙ
  choice: በዋናው ጽሑፍ ‘ምግብ’ የሚለውን ቀጥተኛ ቃል ማቆየት
  alternative: ትርጉሙን ቀድሞ በመግለጽ ‘የአባቴን ፈቃድ መፈጸም ምግቤ ነው’ ብሎ መተርጎም
  rationale: ቀጣዩ አውድ ዘይቤውን ያብራራል፤ ይህ ቁጥር ግን የደቀ መዛሙርቱን አለመረዳት ሆን ብሎ ይተዋል። ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱን አስቀድሞ አይፍታውም።
- issue: οὐκ οἴδατε የሚያመለክተው የእውቀት ዓይነት
  choice: ‘የማታውቁት’ ብሎ አሻሚነቱን ማቆየት
  alternative: ‘ስለ እርሱ የማታውቁት’ ወይም ‘የሌላችሁ’ ብሎ መግለጽ
  rationale: ግሪኩ ደቀ መዛሙርቱ የምግቡን መኖር ወይም ባሕርይ እንደማያውቁ በግልጽ አይለይም፤ አጭሩ አማርኛ ይህን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ የአማርኛ የትረካ ቅጥ ተጠቅሟል። የግሪኩ አጽንዖት በ‘እናንተ’ ተጠብቋል፤ የ‘ምግብ’ ዘይቤም በዋናው ጽሑፍ ሳይተረጎም ቀርቷል።
