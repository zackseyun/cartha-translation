id: JHN.4.18
reference: John 4:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: am
  text: አምስት ባሎች ነበሩሽና[a]፤ አሁንም አብሮሽ ያለው ሰው ባልሽ አይደለም። ይህን በእውነት ተናግረሻል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ἀνήρ ቃል “ወንድ” ወይም “ባል” ማለት ይችላል። እዚህ በመጀመሪያው ሐረግ “አምስት ወንዶች” ተብሎ ሊተረጎም ቢችልም፣ አውዱ በሁለቱም ቦታዎች “ባል” የሚለውን ትርጉም ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: አምስት ባሎች ነበሩሽና
  rationale: πέντε is rendered directly as አምስት. In this relational context ἄνδρας naturally means husbands, while ነበሩሽ expresses that she had them in her past. The enclitic ና preserves the explanatory force of γάρ naturally in Amharic.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: አሁንም አብሮሽ ያለው ሰው
  rationale: A wooden rendering of ἔχεις as ‘the one you have’ would be unnatural and potentially objectifying in Amharic. ‘The man who is now with you’ conveys the present relational association while retaining the explicit human referent implied by the masculine relative pronoun.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: ባልሽ አይደለም
  rationale: The genitive σου and the contextual contrast identify ἀνήρ specifically as ‘your husband’; the standard natural Amharic equivalent is ባልሽ.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: ይህን በእውነት ተናግረሻል
  rationale: This keeps the demonstrative object and renders the perfect εἴρηκας with an Amharic perfect form. በእውነት preserves the manner/predicate force without changing the statement into a broader paraphrase.
theological_decisions:
- issue: Sense of ἀνήρ in its two occurrences
  choice: Render the first as ባሎች and the second as ባልሽ in the main text.
  alternative: Render more literally as ወንዶች / ወንድሽ or use ሰዎች / ሰው throughout.
  rationale: Although ἀνήρ may denote either a man or a husband, the contrast between the woman's previous five and the present man who is explicitly not her husband favors the marital sense in the first clause. A footnote preserves the genuine lexical breadth.
- issue: Force of the present relationship in ὃν ἔχεις
  choice: Use አብሮሽ ያለው ሰው, ‘the man who is with you.’
  alternative: Use ያለሽ ሰው, ‘the man you have.’
  rationale: The chosen form states association without specifying a form of cohabitation beyond what the Greek itself necessarily asserts, and it avoids an unnatural possessive expression in modern Amharic.
translation_notes:
  register: The draft uses modern standard Amharic, feminine second-person forms required by the discourse, and dignified but ordinary wording. The semicolon after the explanatory first clause preserves the Greek flow without producing an overly formal sentence.
