  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: am
  text: ከዚያች ከተማ የሆኑ ብዙ ሳምራውያን በሴቲቱ ቃል[a] ምክንያት በእርሱ አመኑ፤ ሴቲቱም፣ «ያደረግሁትን ሁሉ ነገረኝ» ብላ ትመሰክር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሴቲቱ መልእክት ምክንያት።» የግሪክ ቃሉ λόγος «ቃል፣» «መልእክት፣» ወይም «ዘገባ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: ከዚያችም ከተማ
  rationale: ἐκ የመነሻ ቦታን ያመለክታል፤ δέ በ«ም» እንደ ቀላል አያያዥ ተጠብቋል። πόλις በዚህ አውድ «ከተማ» ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: ከሳምራውያን ብዙዎች
  rationale: የግሪኩን ከፊልነት የሚያሳየውን የጄኒቲቭ አወቃቀር፣ ማለትም ከሳምራውያን መካከል ብዙዎች የሚለውን ኃይል ይጠብቃል።
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: በእርሱ አመኑ
  rationale: πιστεύω ከεἰς ጋር በሰውየው ላይ የተመራ እምነትን ወይም መታመንን ያሳያል፤ «በእርሱ አመኑ» ይህን በአማርኛ በቀጥታ ያስተላልፋል።
- source_word: διὰ τὸν λόγον
  choice: በ… ቃል ምክንያት
  rationale: διά ከአኩዛቲቭ ጋር ምክንያትን ያመለክታል። λόγος ቃል፣ መልእክት ወይም ዘገባ ሊሆን ስለሚችል «ቃል» የምንጩን ሰፊ የትርጉም ክልል ይጠብቃል።
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: ትመሰክር በነበረችው ሴት
  rationale: የአሁን ጊዜ ተሳቢ ግስ ሴቲቱ ምስክርነቷን እየሰጠች መሆኗን ያሳያል፤ «ትመሰክር በነበረችው» ይህን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Εἶπέν μοι
  choice: ነገረኝ
  rationale: λέγω ከተዘዋዋሪ ተቀባይ ጋር በዚህ አውድ «ነገረኝ» ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: πάντα ἃ ἐποίησα
  choice: ያደረግሁትን ሁሉ
  rationale: πάντα ἃ ሙሉ አጠቃላይነትን ያሳያል፤ የአዎሪስት ἐποίησα በትረካው ውስጥ በአማርኛ ፍጹም ያለፈ ጊዜ «ያደረግሁትን» ተብሎ በተፈጥሮ ተገልጧል።
theological_decisions:
- issue: በዮሐንስ አጠቃቀም ውስጥ የπιστεύω εἰς ትርጉም
  choice: በእርሱ አመኑ
  alternative: በእርሱ ታመኑ
  rationale: ጥቅሱ ወደ ኢየሱስ የተመራ እምነትን ይገልጣል፤ ከጽሑፉ በላይ የሆነ የእምነት ሥርዓት ፍቺ ሳይጨመር «በእርሱ አመኑ» ግንኙነታዊውን ኃይል ይጠብቃል።
