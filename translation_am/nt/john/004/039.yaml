  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አወቃቀር ትርጉም ተጠብቆ እንዲነበብ የአማርኛው ቃላት ቅደም ተከተል በተፈጥሯዊ መንገድ ተደራጅቷል።
