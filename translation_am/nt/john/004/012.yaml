lexical_decisions:
- source_word: μὴ σὺ
  choice: አንተ ... ትበልጣለህን?
  rationale: μή የሚጀምረው ጥያቄ አሉታዊ መልስን ይጠብቃል፤ የአማርኛው ቃለ ጥያቄ ይህን የተግዳሮት ኃይል በተፈጥሮ ያስተላልፋል፣ አንተም የσὺን አጽንዖት ይጠብቃል።
- source_word: μείζων
  choice: ትበልጣለህ
  rationale: እዚህ ያለው ንጽጽር የአካል መጠንን ሳይሆን ታላቅነትንና ደረጃን ያመለክታል።
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: ከአባታችን ከያዕቆብ
  rationale: የዘር አባትነትንና ሴቲቱ በያዕቆብ ቅርስ ላይ ያቀረበችውን ክርክር ይጠብቃል። የተደገመው ከ- በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἔδωκεν ἡμῖν
  choice: ሰጠን
  rationale: የአንድ ጊዜ ያለፈ ታሪካዊ ድርጊትን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ φρέαρ
  choice: ጕድጓድ
