- source_word: ἐξ αὐτοῦ
  choice: ከዚሁ
  rationale: ተውላጠ ስሙ ወደ ጕድጓዱ እንደሚመለስ ያሳያል፤ -ሁ ደግሞ የ‘ከዚያው’ን አጽንዖት ይሰጣል።
- source_word: ἔπιεν
  choice: ጠጥተዋል
  rationale: የያዕቆብን፣ የልጆቹንና የከብቶቹን ከጕድጓዱ መጠጣት አንድ ላይ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: ልጆቹ
  rationale: በአማርኛ ልጆቹ በዚህ የቤተሰብና የዘር አውድ የያዕቆብን ወንድ ልጆች በተፈጥሮ ያመለክታል፤ ‘ወንድ ልጆቹ’ ማለት የግሪኩን ጾታ ይበልጥ በግልጽ ቢያሳይም ከባድ ድግግሞሽ ይፈጥራል።
- source_word: τὰ θρέμματα αὐτοῦ
  choice: ከብቶቹ
  rationale: θρέμματα የሚያመለክተውን የቤት እንስሳት በስፋት የሚይዝ የተለመደ የአማርኛ ቃል ነው።
