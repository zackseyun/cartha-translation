    text: ወይም፦ “አንተ ከአባታችን ከያዕቆብ ትበልጣለህን?” የግሪኩ ጥያቄ μή በሚለው ቃል ስለሚጀምር፣ “አይደለም” የሚል መልስ ይጠብቃል።
