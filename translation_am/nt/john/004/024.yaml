  text: 'እግዚአብሔር መንፈስ ነው[b]፤ እርሱን የሚያመልኩትም በመንፈስና በእውነት[a] ሊያመልኩት ይገባል።


    [a] ወይም፣ “በመንፈስ ቅዱስና በእውነት።” የግሪክኛው አገላለጽ “መንፈስ” የሚለውን በይበልጥ ለይቶ መረዳትን ሊፈቅድ ይችላል፤ በዋናው ጽሑፍ ያለው አተረጓጎም ግን የሐረጉን ሰፊ ትርጉም ይጠብቃል።


    [b] “እግዚአብሔር መንፈስ ነው” የሚለው የእግዚአብሔርን ባሕርይ ይገልጻል፤ እርሱ ከሌሎች መንፈሳዊ ፍጡራን መካከል አንዱ ነው ማለት አይደለም።'
  philosophy: optimal-equivalence
