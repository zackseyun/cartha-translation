lexical_decisions:
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: ከግስ በፊት የመጣ ያለ መስተዋድድ የስም ተሳቢ ስለሆነ፣ አገላለጹ የእግዚአብሔርን ባሕርይ ይገልጻል እንጂ እርሱን ከብዙ መናፍስት እንደ አንዱ አይመድብም።
- source_word: ὁ θεός
