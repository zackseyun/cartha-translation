  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: am
  text: ኢየሱስም፣ “ሂድ፤ ወንድ ልጅህ በሕይወት አለ” አለው። ሰውየውም ኢየሱስ የነገረውን ቃል አመነ[ሀ]፣ መንገዱንም ቀጠለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: ሀ
    text: ወይም፣ “ኢየሱስ የነገረውን ቃል ታመነ።”
    reason: πιστεύω with τῷ λόγῳ may be expressed as “believed” or, contextually, “trusted.”
lexical_decisions:
- source_word: Πορεύου
  choice: ሂድ
  rationale: ቀጥተኛውን ትእዛዝ በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: ὁ υἱός σου
  choice: ልጅህ
  rationale: በአማርኛ ‘ልጅ’ ለወንድ ልጅም በተለምዶ የሚሠራ ሲሆን፣ ከዐውዱ የወንድነት መረጃው ግልጽ ነው፤ ‘ወንድ ልጅህ’ ከሚለው ይበልጥ ተፈጥሯዊ ነው።
- source_word: ζῇ
  choice: በሕይወት አለ
  rationale: የአሁን ጊዜውን አመልካች እና ልጁ ሕያው መሆኑን ያሳያል፤ ወደፊት ‘ይኖራል’ ብሎ አይተረጉመውም።
- source_word: ἐπίστευσεν
  choice: አምኖ
  rationale: πιστεύω እዚህ ለኢየሱስ ንግግር እውነተኛነት መታመንን ያመለክታል፤ ‘አመነ’ የቃሉን መደበኛ አቻ ይጠብቃል።
- source_word: ὁ ἄνθρωπος
  choice: ሰውየው
  rationale: ግሪኩ በዚህ ቁጥር ቀደም ሲል የተጠቀሰውን ሹምነት ሳይደግም ‘ሰውየው’ ይላል፤ ትርጉሙም ይህን ይጠብቃል።
- source_word: τῷ λόγῳ ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስ የነገረውን ቃል
  rationale: λόγοςን ‘ቃል’ ብሎ በመጠበቅ አንጻራዊውን ሐረግ በተፈጥሯዊ የአማርኛ ሥርዓት ያቀርባል።
- source_word: ἐπορεύετο
  choice: መንገዱን ቀጠለ
  rationale: ያለፈ ጊዜ ያልተፈጸመ ግሱ ሰውየው ጉዞውን ጀምሮ መቀጠሉን ያሳያል፤ ይህ አገላለጽ ከባዶ ‘ሄደ’ ይልቅ የትረካውን እንቅስቃሴ ይይዛል።
theological_decisions:
- issue: πιστεύω ለኢየሱስ ቃል በተሰጠ ምላሽ ውስጥ እንዴት እንደሚተረጎም
  choice: አምኖ
  alternative: ታምኖበት
  rationale: ‘አምኖ’ የπιστεύωን መደበኛ ትርጉም ይጠብቃል፤ ይህን ምላሽ እንደ ማዳን እምነት ወይም እንደ ተራ እምነት ብቻ በቅድሚያ ሳይወስን የዮሐንስን ትረካዊ ውጥረት ክፍት ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ምንም የግርጌ ማስታወሻ አልተጨመረም፤ በቀረበው የእንግሊዝኛ ንባብ ውስጥ [a] ከቃሉ አጠገብ የተሳሳተ ቦታ የታየ ሲሆን ማስታወሻው በአማርኛ ዋና ጽሑፍ ላይ ጠቃሚ የሆነ ተጨማሪ ልዩነት አያቀርብም።
