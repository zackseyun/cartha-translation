  to: ኢየሱስም፣ “ሂድ፤ ወንድ ልጅህ በሕይወት አለ” አለው። ሰውየውም ኢየሱስ የነገረውን ቃል አመነ[ሀ]፣ መንገዱንም ቀጠለ።
