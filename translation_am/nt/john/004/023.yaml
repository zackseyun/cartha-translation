id: JHN.4.23
reference: John 4:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: am
  text: ነገር ግን፣ እውነተኛ አምላኪዎች አብን በመንፈስ[a] እና በእውነት የሚያመልኩበት ሰዓት እየመጣ ነው፤ አሁንም ደርሷል። አብ እርሱን የሚያመልኩ እንደዚህ ያሉ ሰዎችን በእርግጥ ይፈልጋልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመንፈስ” የሚለው “በመንፈስ ቅዱስ” ተብሎም ሊገባ ይችላል፤ የግሪኩ አገላለጽ በመንፈስ ቅዱስ ኃይል የሚከናወን አምልኮን፣ በሰው መንፈስ የሚደረግ አምልኮን፣ ወይም በመንፈሳዊ እውነታ የተለየ አምልኮን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከዚህ በፊት ስለ አምልኮ ቦታ ከተነገረው ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  choice: ጊዜ ይመጣል፤ እርሱም አሁን ደርሷል
  rationale: የወደፊቱንና አስቀድሞ የተጀመረውን የአሁን እውነታ አብሮ ይጠብቃል፤ ὥρα በዚህ አውድ ‘ጊዜ’ ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: እውነተኛ አምላኪዎች
  rationale: የἀληθινοίን እውነተኛነትና ትክክለኛ ባሕርይ ያስቀምጣል፤ የቡድን ወይም የኑፋቄ ልዩነት አያስገባም።
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: አብን … የሚያመልኩበት
  rationale: የወደፊት ድርጊቱን በጊዜ አንቀጹ ውስጥ በተፈጥሯዊ የአማርኛ አገባብ ይገልጣል።
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: በመንፈስና በእውነት
  rationale: ሁለቱንም ስሞች ይጠብቃል፤ πνεῦμα የሰውን መንፈስ፣ መንፈስ ቅዱስን፣ ወይም መንፈሳዊ እውነታን ሊያመለክት የሚችለውን አሻሚነት ሳይፈታ ያቆያል።
- source_word: καὶ γὰρ
  choice: በእርግጥ … ና
  rationale: γάρ የምክንያት ግንኙነቱን፣ καί ደግሞ አጽንዖቱን በአማርኛ ያሳያሉ።
- source_word: ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: አብም እንዲህ የሚያመልኩትን … ይፈልጋል
  rationale: τοιούτουςን እንደ የዚህ ዓይነት አምላኪዎች ያቀርባል፤ የአሁን ጊዜውን ζητεῖ በቀላልና ክቡር የአማርኛ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የἐν πνεύματι ትርጉም
  choice: በመንፈስ
  alternative: በመንፈስ ቅዱስ፤ በሰው መንፈስ፤ መንፈሳዊ በሆነ መንገድ
  rationale: በግሪክ ጽሑፉ πνεύματι ያለ መስተዋድድ አንቀጽ መምጣቱና አውዱ ከአንድ በላይ ተዛማጅ ንባቦችን ስለሚፈቅድ፣ ዋናው ጽሑፍ አንዱን ብቻ አይወስንም።
- issue: ‘እውነተኛ አምላኪዎች’ የሚለው ወሰን
  choice: እውነተኛ/ትክክለኛ አምልኮን የሚያቀርቡ ሰዎች
  alternative: የተወሰነ ኑፋቄ ወይም ቡድን
  rationale: የዮሐንስን በቦታ ብቻ የታሰረ አምልኮና ከእግዚአብሔር እውነታ ጋር የሚስማማ አምልኮ መካከል ያለውን ንጽጽር ይጠብቃል፤ የኑፋቄ ልዩነት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር ለአማርኛ ተነባቢነት በሁለት ተከፍሏል፤ የምክንያት ግንኙነቱ ግን ተጠብቋል።
