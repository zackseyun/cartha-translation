review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central contrast, the coming-and-present hour, worship of the Father, and the Father’s seeking of worshipers. However, its rendering of the future verb is less explicit than the Greek, and the final participial phrase can momentarily be read as ‘those whom [someone] worships’ rather than ‘those who worship him.’
  naturalness: The phrasing is generally modern and clear. Using ሰዓት better retains the Johannine ‘hour’ diction, and an explicit finite future verb is more direct and natural in this context. The pronoun እርሱ for ጊዜ is avoidable.
  terminology: አብ, አምላኪዎች, በመንፈስ, and በእውነት are appropriate. The unqualified በመንፈስ rightly preserves the ambiguity of ἐν πνεύματι. The footnote should be attached to this expression, not to the preceding statement that the hour has arrived.
  issues:
  - severity: medium
    issue: The footnote anchor is misplaced.
    rationale: Footnote a explains በመንፈስ / ἐν πνεύματι, but the current anchor follows አሁን ደርሷል. It should immediately follow በመንፈስ.
  - severity: medium
    issue: The future force of προσκυνήσουσιν is not explicit.
    rationale: የሚያመልኩበት can work in a time-relative construction, but ያመልካሉ explicitly represents the Greek future indicative and avoids ambiguity.
  - severity: low
    issue: The final phrase does not explicitly represent αὐτόν (‘him’).
    rationale: እንዲህ የሚያመልኩትን is understandable from context but can be syntactically unclear. እርሱን የሚያመልኩ እንደዚህ ያሉ ሰዎችን clearly retains the object and τοιούτους (‘such [people]’).
  - severity: low
    issue: ጊዜ weakens the source’s repeated ‘hour’ terminology.
    rationale: ሰዓት is natural modern Amharic and more closely preserves ὥρα and its Johannine resonance.
