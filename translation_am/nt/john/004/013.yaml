base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አላት፦ “ከዚህ ውሃ የሚጠጣ ሁሉ እንደገና ይጠማል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῇ
  choice: መልሶ እንዲህ አላት
  rationale: የግሪኩን ሁለት የንግግር ግሶችና የሴት አድራሻውን በተፈጥሯዊ የአማርኛ ትረካ አገላለጽ ያቆያል።
- source_word: Πᾶς ὁ πίνων
  choice: የሚጠጣ ሁሉ
  rationale: የአሁን ጊዜው አሳታፊ ቅርጽ ያለውን አጠቃላይና ልማዳዊ ኃይል ያለ ጾታ ገደብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: ከዚህ ውሃ
  rationale: ἐκ የምንጭ ግንኙነትን፣ τούτουም በውይይቱ ያለውን ውሃ በቀጥታ መጠቆሙን ያሳያል።
- source_word: διψήσει πάλιν
  choice: እንደገና ይጠማል
  rationale: የወደፊት ግሱንና የድግግሞሽ ተውሳኩን በአማርኛ የወደፊትንም ሆነ አጠቃላይ ውጤትን በተፈጥሯዊ ሁኔታ በሚገልጥ ቅርጽ ያቀርባል።
theological_decisions:
- issue: ἀπεκρίθη … καὶ εἶπεν የተባለውን ድርብ የንግግር አገላለጽ ማቆየት
  choice: መልሶ እንዲህ አላት
  alternative: አላት ብቻ ወይም መለሰላት ብቻ
  rationale: የምንጩን ድርብ ቅርጽ ሳያጠፋ በዘመናዊ አማርኛ የተለመደና ክብር ያለው አገላለጽ ይሰጣል።
- issue: Πᾶς ὁ πίνων ያለው ሰዋሰዋዊ ተባዕታይ ቅርጽ
  choice: የሚጠጣ ሁሉ
  alternative: የሚጠጣ ወንድ ሁሉ
  rationale: በግሪክ ያለው ቅርጽ ወንዶችን ብቻ የሚገድብ ሳይሆን አጠቃላይ ነው፤ የአማርኛው ምርጫም ይህንኑ ሁሉን አቀፍ ኃይል ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ይጠማል” የግሪኩን διψήσει በቀጥታና በተፈጥሯዊ ሁኔታ ስለሚያስተላልፍ፣ በእንግሊዝኛው የተጠቀሰውን ‘will thirst’ አማራጭ ለማብራራት የግርጌ ማስታወሻ አላስፈለገም።
