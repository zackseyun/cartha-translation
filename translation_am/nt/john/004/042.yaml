id: JHN.4.42
reference: John 4:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: am
  text: ለሴቲቱም፣ “ከእንግዲህ ወዲህ የምናምነው በአንቺ ንግግር ምክንያት አይደለም፤ እኛ ራሳችን ሰምተናልና፣ ይህ በእውነት የዓለም አዳኝ እንደሆነ እናውቃለን” ይሉአት ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: ለሴቲቱም … ይሉአት ነበር
  rationale: የተቀባይነት ዳቲቭን፣ የτεን ቀላል አያያዥ ኃይል እና የኢምፐርፌክትን ቀጣይ/ተደጋጋሚ ያለፈ ድርጊት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: እንግዲህ የምናምነው አንቺ በተናገርሽው ምክንያት ብቻ አይደለም
  rationale: λαλιά እዚህ የሴቲቱን የቃል ምስክርነት ያመለክታል። በአማርኛ የተፈጥሮ አነጋገር ለማድረግ ‘ብቻ’ ተጨምሯል፤ ይህም እምነታቸው እንዳበቃ ሳይሆን የቀድሞው መሠረት አሁን ብቸኛ እንዳልሆነ ያሳያል።
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: እኛ ራሳችን ሰምተናልና
  rationale: αὐτοί ያለውን አጽንዖት ‘እኛ ራሳችን’ ይጠብቃል፤ ሰምተናል የፍጹም ጊዜውን አሁናዊ ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς
  choice: ይህም በእውነት … እንደሆነ እናውቃለን
  rationale: οὗτος ያለውን የጠቋሚ አጽንዖት ‘ይህ’ ይጠብቃል፤ ἀληθῶς በክብር ያለው ‘በእውነት’ ተብሎ ተተርጉሟል።
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: የዓለም አዳኝ
  rationale: የአዲስ ኪዳንን የσωτήρ መዳናዊ ክብደት በተለመደው ‘አዳኝ’ ይጠብቃል፤ κόσμος ሳይጠበብ ወይም ‘ሁሉ’ ሳይጨመር ‘ዓለም’ ተብሏል።
theological_decisions:
- issue: የሳምራውያኑ እምነት መሠረት
  choice: የሴቲቱ ምስክርነት እምነታቸውን ያስጀመረ ቢሆንም፣ አሁን የግል መስማታቸው ተጨማሪ መሠረት መሆኑን አሳይቷል።
  alternative: ከእንግዲህ ፈጽሞ አናምንም የሚል ንባብ
  rationale: Οὐκέτι ከπιστεύομεν ጋር ሲነበብ የተቋረጠው እምነት ሳይሆን ‘በንግግርሽ ምክንያት’ የሚለው ብቸኛ መሠረት ነው።
- issue: ‘የዓለም አዳኝ’ የሚለው ወሰን
  choice: የዓለም አዳኝ
  alternative: የሰዎች ሁሉ አዳኝ / ከዓለም የተመረጡት አዳኝ
  rationale: κόσμος ያለውን ሰፊ ወሰን እንዳለ በመተው፣ ጥቅሱ ያልገለጸውን የኋላ ዘመን ዶክትሪናዊ ገደብ ወይም ማስፋፊያ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩን አጽንዖት ለመጠበቅ ‘እኛ ራሳችን’ እና ‘ይህ’ ተጠቅመዋል፤ አስፈላጊ የጽሑፍ ወይም የትርጉም አማራጭ ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
