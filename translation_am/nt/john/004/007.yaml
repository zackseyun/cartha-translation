  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: am
  text: ከሰማርያ አንዲት ሴት ውኃ ልትቀዳ መጣች። ኢየሱስም፣ “የምጠጣውን ስጪኝ” አላት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “ትመጣለች … ይላታል”፤ የግሪክ ጽሑፉ በትረካው ውስጥ ታሪካዊ የአሁን ጊዜን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: መጣች
  rationale: በትረካ ውስጥ ያለው የግሪክ ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ አማርኛ ያለፈ ጊዜ ሆኖ ቀርቧል።
- source_word: γυνὴ
  choice: አንዲት ሴት
  rationale: በዚህ አውድ ቃሉ ሚስትን ሳይሆን እስካሁን ስሟ ያልተገለጠ ሴትን ያመለክታል።
- source_word: ἐκ τῆς Σαμαρείας
  choice: ከሰማርያ
  rationale: የመጣችበትን ስፍራ በቀጥታ ይገልጣል፤ ጽሑፉ በዚህ ቁጥር ‘ሳምራዊት’ ብሎ ከሚለው ይልቅ ከሰማርያ የመጣች ሴት ይላል።
- source_word: ἀντλῆσαι ὕδωρ
  choice: ውኃ ልትቀዳ
  rationale: የዓላማ አሳቢውን ይጠብቃል፤ ‘ውኃ መቅዳት’ ከጉድጓድ ውኃ ማውጣትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λέγει αὐτῇ
  choice: አላት
  rationale: ሌላውን የግሪክ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ያቀርባል።
- source_word: Δός μοι πεῖν
  choice: የምጠጣውን ስጪኝ
  rationale: የግሪኩን ‘እጠጣ ዘንድ ስጪኝ’ የሚል አወቃቀር ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የ‘ሰማርያ’ ማጣቀሻ
  choice: ሴቲቱ ከሰማርያ እንደመጣች ብቻ በትርጉሙ ዋና መስመር ተገልጧል።
  alternative: ‘አንዲት ሳምራዊት ሴት’ ወይም ‘ከሰማርያ ከተማ’
  rationale: የግሪክ ጽሑፉ ἐκ τῆς Σαμαρείας ይላል፤ ስለ ብሔር፣ ሃይማኖት ወይም ስለ ከተማዋ የሚጨመር ማብራሪያ በዚህ ቁጥር በግልጽ አልተነገረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የታሪካዊው የአሁን ጊዜ ልዩነት በግርጌ ማስታወሻ ተጠብቋል።
