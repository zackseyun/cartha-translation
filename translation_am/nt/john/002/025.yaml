  to: ደግሞም ማንም ስለ ሰው[a] እንዲመሰክር አያስፈልገውም ነበር፤ እርሱ ራሱ በሰው ውስጥ ያለውን ያውቅ ነበርና።
  rationale: The revision removes the unsupported recipient/benefactive sense in “እንዲመሰክርለት” and makes “ስለ ሰው” unambiguously modify the act of testifying. All other wording is retained because it accurately and naturally conveys the Greek while preserving its breadth.
