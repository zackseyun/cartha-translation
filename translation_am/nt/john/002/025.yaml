  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: am
  text: ደግሞም ማንም ስለ ሰው[a] እንዲመሰክር አያስፈልገውም ነበር፤ እርሱ ራሱ በሰው ውስጥ ያለውን ያውቅ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በነጠላ ቁጥር ቢሆንም፣ አንድን ሰው ወይም የሰውን ልጅ በአጠቃላይ ሊያመለክት ይችላል፤ በኋለኛውም ሐረግ «በሰው ውስጥ» ተብሎ ይደገማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: አያስፈልገውም ነበር
  rationale: የግሪኩን ‘አስፈላጊነት አልነበረውም’ የሚለውን ፍቺ በተፈጥሯዊና ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα τις μαρτυρήσῃ
  choice: ማንም እንዲመሰክርለት
  rationale: μαρτυρέω ያለውን የምስክርነት ኃይል ‘እንዲመሰክር’ ይጠብቃል፤ τις በአሉታዊው ዐውድ ‘ማንም’ ተብሎ በተፈጥሮ ተተርጉሟል።
- source_word: περὶ τοῦ ἀνθρώπου
  choice: ስለ ሰው
  rationale: ነጠላው ἄνθρωπος አንድን ሰውም ሆነ የሰውን ልጅ በአጠቃላይ ሊወክል የሚችለውን ሰፊ ፍቺ ይጠብቃል።
- source_word: αὐτὸς γὰρ
  choice: እርሱ ራሱ … ነበርና
  rationale: ‘እርሱ ራሱ’ የαὐτόςን አጽንዖት ይጠብቃል፤ የማብራሪያው γάρ ደግሞ በ‘ነበርና’ ተገልጿል።
- source_word: ἐγίνωσκεν
  choice: ያውቅ ነበር
  rationale: የግሪኩን ያልተቋረጠ ወይም ባሕርያዊ እውቀት በአማርኛ ተፈጥሯዊ በሆነ ያለፈ ጊዜ አገላለጽ ያቀርባል።
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: በሰው ውስጥ ያለውን
  rationale: ‘ውስጥ’ የἐνን ውስጣዊነት ሳይገድብ ይጠብቃል፤ ቀደም ካለው ‘ሰው’ ጋር ያለውን የቃል ድግግሞሽም ያስቀራል።
theological_decisions:
- issue: ኢየሱስ ስለ ሰው ያለው እውቀት ወሰን
  choice: ንግግሩን ሳይጠብ ወይም በትምህርታዊ ማብራሪያ ሳይሰፋ፣ ኢየሱስ በሰው ውስጥ ያለውን በቀጥታ እንደሚያውቅ ተተርጉሟል።
  alternative: እያንዳንዱ ሰው ውስጥ ያለውን፣ ወይም የሰውን ተፈጥሮ በአጠቃላይ
  rationale: የግሪኩ ነጠላ ἀνθρώπου/ἀνθρώπῳ ግለሰባዊና አጠቃላይ ወካይ ፍቺዎችን ሊይዝ ይችላል፤ ትርጉሙ ‘ሰው’ በማለት ይህን አሻሚነት አልፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ደግሞም’ የቁጥሩን ከቀደመው አሳብ ጋር ያለ ትስስር ይጠብቃል፤ ሴሚኮሎኑም ሁለተኛው ሐረግ ለመጀመሪያው ምክንያት መሆኑን ግልጽ ያደርጋል።
