  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: am
  text: ከዚህ በኋላ እርሱ ከእናቱ፣ ከወንድሞቹ[a] እና ከደቀ መዛሙርቱ ጋር ወደ ቅፍርናሆም ወረደ፤ በዚያም ብዙ ቀናት አልቆዩም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዘመዶቹ።” የግሪኩ ቃል በጠበበ ትርጉሙ ወንድሞችን፣ በአንዳንድ አውዶች ደግሞ ሰፋ ያለ የቤተሰብ ዝምድናን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: ከዚህ በኋላ
  rationale: የነጠላውን አመልካች ቃል ጠብቆ በዘመናዊ አማርኛ ተፈጥሯዊ የሆነ የጊዜ ሽግግርን ያሳያል።
- source_word: κατέβη
  choice: ወረደ
  rationale: ከቃና ወደ ቅፍርናሆም የተደረገውን የመልክዓ ምድር ቁልቁለት ጉዞ ይጠብቃል፤ የግሪኩን ነጠላ ግስም ከዋናው ተሳቢ ‘እርሱ’ ጋር ያስማማል።
- source_word: εἰς Καφαρναοὺμ
  choice: ወደ ቅፍርናሆም
  rationale: መድረሻን በተፈጥሯዊ አማርኛ ይገልጻል፤ የቦታውም ስም በተለመደው የአማርኛ ቅርጽ ተጽፏል።
- source_word: ἡ μήτηρ αὐτοῦ
  choice: እናቱ
  rationale: ምንጩ የሚለውን ብቻ ይገልጻል፤ በቁጥሩ ያልተጠቀሰውን ‘ማርያም’ የሚለውን ስም አይጨምርም።
- source_word: οἱ ἀδελφοὶ
  choice: ወንድሞቹ
  rationale: የግሪኩ ቃል ወንድ ብዙ ቁጥር ሲሆን በቀጥታ የሚሰጠው ትርጉም ‘ወንድሞች’ ነው። ሰፋ ያለው የዝምድና ትርጉም በማስታወሻ ተጠብቋል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት ውስጥ ቁልፍ የሆነውን የተማሪነትና የተከታይነት ፍቺ የሚይዝ የተለመደ የአማርኛ ቃል ነው።
- source_word: ἐκεῖ ἔμειναν
  choice: በዚያም … አልቆዩም
  rationale: የግሪኩን የብዙ ቁጥር ግስ ጠብቆ መላው ቡድን በዚያ እንደቆየ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὐ πολλὰς ἡμέρας
  choice: ብዙ ቀናት አልቆዩም
  rationale: ‘ጥቂት ቀናት ብቻ’ ብሎ ከመፍታት ይልቅ የምንጩን አሉታዊ አገላለጽ በቅርብ ይጠብቃል።
theological_decisions:
- issue: οἱ ἀδελφοί ከኢየሱስ ጋር ያላቸው የቤተሰብ ዝምድና
  choice: በዋናው ጽሑፍ ‘ወንድሞቹ’ ተብሎ ተተርጉሟል።
  alternative: ‘ዘመዶቹ’ ወይም ሌላ ሰፋ ያለ የቤተሰብ ዝምድና
  rationale: የግሪኩ ወንድ ብዙ ቁጥር ቃል በቀጥታ ‘ወንድሞች’ ማለት ነው፤ ሆኖም በአንዳንድ አውዶች ሰፋ ያለ የዝምድና ፍቺ ሊኖረው ይችላል። ትርጉሙ በኋላ የተነሱ ሥነ መለኮታዊ ክርክሮችን አይፈታም፤ ቀጥተኛውን ፍቺ በዋናው ጽሑፍ፣ አማራጩን በማስታወሻ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እርሱ … ጋር … ወረደ’ የሚለው አወቃቀር የግሪኩን ነጠላ ዋና ግስ ሳያጠፋ አብረውት የሄዱትን ሰዎች ተፈጥሯዊ በሆነ አማርኛ ያስገባል፤ ቀጣዩ የብዙ ቁጥር ግስ ደግሞ ቡድኑን በሙሉ ያመለክታል።
