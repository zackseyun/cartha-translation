  rationale: ἐλάσσων ከዚህ ቀደም ከተጠቀሰው ወይን ጠጅ ጋር በጥራት ያነሰውን ያመለክታል፤ በአማርኛ የተዘለለው “ወይን ጠጅ” ከዐውዱ ይገባል።
- source_word: τετήρηκας
  choice: አቆይተኸዋል
  rationale: የግሪኩ ፍጹም ጊዜ እስከ አሁን የዘለቀውን ውጤት ያሳያል፤ “አቆይተኸዋል” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἕως ἄρτι
  choice: እስከ አሁን
  rationale: ንግግሩ እስከተደረገበት ቅጽበት ድረስ ያለውን ጊዜ በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጻል።
theological_decisions:
