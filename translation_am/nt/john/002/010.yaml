base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: am
  text: እርሱም እንዲህ አለው፦ “ሰው ሁሉ[a] መልካሙን ወይን ጠጅ አስቀድሞ ያቀርባል፤ ከሰከሩ[b] በኋላ ግን ጥራቱ ዝቅ ያለውን ያቀርባል። አንተ ግን መልካሙን ወይን ጠጅ እስከ አሁን አቆይተኸዋል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ አገላለጽ ቃል በቃል “ሰው ሁሉ” የሚል ነጠላ አጠቃላይ አገላለጽ ሲሆን፣ ወንዶችን ብቻ ሳይሆን ሰዎችን በጠቅላላ ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “በሰከሩ ጊዜ።” የግሪኩ ግስ በተለምዶ “መስከር” ማለት ነው፤ አንዳንድ ትርጉሞች “ብዙ ከጠጡ በኋላ” በማለት አገላለጹን ያለዝቡታል።
    reason: lexical_alternative
lexical_decisions:
