  text: በዚያም ለአይሁድ ሥርዓታዊ መንጻት የተዘጋጁ ስድስት የድንጋይ ውኃ ማሰሮዎች ተቀምጠው ነበሩ፤ እያንዳንዳቸውም ሁለት ወይም ሦስት መስፈሪያ[a] የመያዝ አቅም ነበረው።
  philosophy: optimal-equivalence
  footnotes:
