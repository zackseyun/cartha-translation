  choice: የድንጋይ ውኃ ማሰሮዎች
  rationale: የዕቃዎቹን ቁሳቁስና ተግባር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἦσαν δὲ ἐκεῖ ... κείμεναι
  choice: በዚያም ... ተቀምጠው ነበር
  rationale: δέን በቀላል አያያዥ ‘ም’ ያንጸባርቃል፤ ἐκεῖንም ‘በዚያ’ ብሎ ይጠብቃል። κείμεναι ዕቃዎቹ በቦታው ተዘጋጅተው መኖራቸውን ያመለክታል።
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: ለአይሁድ የመንጻት ሥርዓት የሚያገለግሉ
  rationale: κατά በዚህ አውድ ከሥርዓቱ ጋር ያለውን ተግባራዊ ግንኙነት ያሳያል፤ ‘የመንጻት ሥርዓት’ የሥነ ሥርዓታዊ መንጻትን ትርጉም በግልጽነት ያቀርባል።
- source_word: χωροῦσαι
  choice: እያንዳንዳቸውም ... ይይዙ ነበር
  rationale: የእያንዳንዱን ማሰሮ የመያዝ አቅም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: ሁለት ወይም ሦስት መስፈሪያ
  rationale: ἀνά ያለውን አከፋፋይ ኃይል ‘እያንዳንዳቸው’ ያሳያል፤ ጥንታዊውን መለኪያ በዋናው ጽሑፍ ወደ ዘመናዊ አሃዝ በግድ ሳይቀይር ‘መስፈሪያ’ ይጠብቀዋል።
theological_decisions:
