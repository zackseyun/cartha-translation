lexical_decisions:
- source_word: ἐκλήθη
  choice: ታድሞ ነበር
  rationale: በማኅበራዊ ዝግጅት አውድ ውስጥ የκαλέω ተደራጊ ቅርጽ ‘ተጋበዘ’ ማለት ነው፤ ‘ታደመ’ በዘመናዊ አማርኛ ለሰርግ ግብዣ ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ καὶ
  choice: ም
  rationale: δὲ ቀላል አያያዥ ሲሆን ተከታዩ καὶ የመጨመርን ሐሳብ ይሰጣል፤ አማርኛው ‘ኢየሱስም’ የሚለው ቅርጽ ሁለቱንም በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግል ስሙ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ተጽፏል።
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ከደቀ መዛሙርቱ ጋር
  rationale: ሁለተኛው καὶ ኢየሱስንና ደቀ መዛሙርቱን ያስተባብራል፤ ‘ከ…ጋር’ ይህን በተፈጥሯዊ አማርኛ ያቀርባል። μαθηταί የተማሪነትንና ኢየሱስን የሚከተለውን ቡድን ማንነት የሚያቆየው ‘ደቀ መዛሙርት’ ተብሎ ተተርጉሟል።
- source_word: εἰς τὸν γάμον
  choice: ወደ ሰርጉ
  rationale: γάμος እዚህ የሰርግን ዝግጅት ያመለክታል፤ ‘ሰርጉ’ ግብዣ ወይም ድግስ የሚል በግሪኩ ያልተገለጸ ተጨማሪ ቃል ሳያስገባ ትርጉሙን ያስተላልፋል።
