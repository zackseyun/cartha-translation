  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: am
  text: ደቀ መዛሙርቱም፣ “ለቤትህ ያለኝ ቅንዓት ይበላኛል” ተብሎ እንደተጻፈ[a] አስታወሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በልቶኛል።” ይህ በአንዳንድ የጽሑፍ ወጎች የሚገኘውን የመዝሙር 69፥9 አነጋገር ያንጸባርቃል፤ እዚህ ያለው የዮሐንስ ግሪክ ግን “ይበላኛል” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: አስታወሱ
  rationale: የግሪኩ የአንድ ጊዜ ድርጊት ቅርጽ በአማርኛ ተፈጥሯዊ በሆነው «አስታወሱ» ተተርጉሟል፤ «ትዝ አላቸው»ም ይቻላል፣ ግን ይህ በትረካ ውስጥ ቀጥተኛና ክቡር ነው።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደና μαθητήςን በትክክል የሚወክል ቃል ነው።
- source_word: γεγραμμένον ἐστίν
  choice: እንደተጻፈ
  rationale: ቅዱስ መጽሐፍን የሚያስገባውን የተጻፈ ሁኔታ ይጠብቃል፤ በአማርኛው ዓረፍተ ነገርም ተፈጥሯዊ ነው።
- source_word: ζῆλος
  choice: ቅንዓት
  rationale: ለእግዚአብሔር ቤት ያለውን ጽኑ ትጋትና የሚቃጠል ፍላጎት ይገልጣል፤ ቃሉ በአማርኛ የቅዱስ መጽሐፍ ቋንቋም የታወቀ ነው።
- source_word: οἴκου
  choice: ቤት
  rationale: በአውዱ ቤተ መቅደሱን ቢያመለክትም፣ የመዝሙሩን ጥቅስ ቃላትና ምስል ለመጠበቅ «ቤት» ተመርጧል።
- source_word: καταφάγεταί
  choice: ይበላኛል
  rationale: የግሪኩን የወደፊት ጊዜና ‘ፈጽሞ መብላት’ የሚለውን ሕያው ምስል ይጠብቃል። «ያጠፋኛል» ወይም «ይፈጀኛል» ትርጉሙን ሊያብራሩ ቢችሉም የመብላትን ዘይቤ ያደበዝዛሉ።
- source_word: με
  choice: እኔን / -ኛል
  rationale: ቀጥተኛው ተሳቢ በአማርኛ በግሱ ውስጥ «-ኛል» ተብሎ በተፈጥሯዊ ሁኔታ ተካቷል።
theological_decisions:
