  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: am
  text: ርግቦችን ለሚሸጡትም፣ “እነዚህን ከዚህ አስወግዱ፤ የአባቴን ቤት የንግድ ቤት[a] አታድርጉት” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የገበያ ቦታ።” ግሪኩ በይበልጥ ቃል በቃል “የንግድ ቤት” ይላል፤ በዓረፍተ ነገሩም “ቤት” የሚለውን ቃል ደግሞ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: ርግቦችን
  rationale: ቃሉ ለመሥዋዕት ይሸጡ የነበሩትን ወፎች ያመለክታል፤ «ርግቦች» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: πωλοῦσιν
  choice: ለሚሸጡት
  rationale: የአሁን ጊዜው ተሳቢ ቅጽ ሰዎቹን በቀጣይ የንግድ ተግባራቸው ይለያቸዋል፤ ይህ አተረጓጎም ያንን ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: Ἄρατε
  choice: አስወግዱ
  rationale: የትእዛዙን ወሳኝና አፋጣኝ ኃይል ይገልጣል፤ በአውዱም ዕቃዎቹን ከቦታው ማራቅን ያመለክታል።
- source_word: ταῦτα
  choice: እነዚህን
  rationale: ግሪኩ ገለልተኛ ብዙ ቁጥር ሲሆን የሚያመለክተውን ዕቃ በዝርዝር አይወስንም፤ «እነዚህን» ያንን አሻሚነት ይጠብቃል።
- source_word: ἐντεῦθεν
  choice: ከዚህ
  rationale: አሁን ካሉበት ቦታ መወገድን በአጭርና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: μὴ ποιεῖτε
  choice: አታድርጉት
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር የሚሰጠውን ክልከላ በቀጥታ ያስተላልፋል፤ «ወደ … አትለውጡ» የሚለውን ትርጓሜያዊ ማስፋፋት አያስገባም።
- source_word: οἶκον τοῦ πατρός μου
  choice: የአባቴን ቤት
  rationale: የቤተ መቅደሱን ማመልከቻና ኢየሱስ በነጠላ አንደኛ መደብ የገለጸውን ከአብ ጋር ያለውን የልጅነት ግንኙነት ያለማለዘብ ይጠብቃል።
- source_word: οἶκον ἐμπορίου
  choice: የንግድ ቤት
  rationale: ἐμπόριον ንግድን ወይም የንግድ እንቅስቃሴን ያመለክታል፤ «የንግድ ቤት» በግሪኩ ያለውን «ቤት … ቤት» የሚለውን አጽንዖታዊ ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ቤተ መቅደሱን «የአባቴ ቤት» ብሎ መጥራቱ
  choice: የአባቴን ቤት
  alternative: የአባታችንን ቤት፤ የእግዚአብሔርን ቤት
  rationale: ግሪኩ πατρός μου ብሎ የነጠላ አንደኛ መደብ ባለቤትነትን በግልጽ ይገልጣል። ስለዚህ ጽሑፉ የሚያቀርበው የኢየሱስን ልዩ የልጅነት ግንኙነትና ሥልጣን ሳይለወጥ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ «ቤት … ቤት» ድግግሞሽ በዋናው ጽሑፍ ተጠብቋል። በቀረበው የእንግሊዝኛ ጽሑፍ [a] ከ«ርግቦች» ቀጥሎ ቢታይም፣ የማስታወሻው ይዘት በግልጽ ከοἶκον ἐμπορίου ጋር ስለሚዛመድ ምልክቱ ከ«የንግድ ቤት» ቀጥሎ ተቀምጧል።
