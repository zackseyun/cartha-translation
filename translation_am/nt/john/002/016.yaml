    issue: Misattached connective in the opening phrase
    rationale: In ‘ርግቦችንም ለሚሸጡት,’ -ም attaches to ‘doves,’ whereas Greek καὶ modifies the clause ‘and he said to those selling the doves.’ Amharic should read ‘ርግቦችን ለሚሸጡትም’ so that the connective belongs to the people addressed.
