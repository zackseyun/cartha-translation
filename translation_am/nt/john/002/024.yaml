lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: ነገር ግን ኢየሱስ
  rationale: δέ ከቀደመው ቁጥር ጋር ያለውን ተቃርኖ በ«ነገር ግን» ያሳያል፤ αὐτός የሚሰጠው አጽንዖት በቀጣዩ «ራሱን» በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: οὐκ ἐπίστευεν αὑτὸν αὐτοῖς
  choice: ራሱን ለእነርሱ አደራ አልሰጠም
  rationale: πιστεύω እዚህ ከተመላሽ ተውላጠ ስምና ከተቀባይ ጋር «ራስን አደራ መስጠት» ማለት ነው። የአማርኛው አገላለጽ ይህን ፍቺ በተፈጥሯዊ ሁኔታ ያቀርባል። የኢምፐርፌክት ገጽታው በአውዱ የቀጣይነት ወይም የቋሚ አቋም ስሜት ቢኖረውም፣ «አልሰጠም» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: διὰ τὸ αὐτὸν γινώσκειν πάντας
  choice: ምክንያቱም ሰዎችን ሁሉ ያውቅ ነበር
  rationale: διὰ τὸ ምክንያትን ያመለክታል፤ πάντας በዐውዱ ሰዎችን በአጠቃላይ ስለሚያመለክት «ሰዎችን ሁሉ» ተብሏል። γινώσκειν የሚገልጸው እውቀት በ«ያውቅ ነበር» ተላልፏል።
theological_decisions:
- issue: በቁጥር 23–24 ያለውን πιστεύω የቃል ጨዋታ ማቅረብ
  choice: በዚህ ቁጥር «ራሱን…አደራ አልሰጠም» ማለትና የግሪኩን የቃል ድግግሞሽ በማስታወሻ መግለጽ
  alternative: πιστεύωን በሁለቱም ቁጥሮች በአንድ የአማርኛ ግስ መተርጎም
  rationale: አንድ ግስ በቁጥር 23 «ማመን»፣ በቁጥር 24 ግን «ራስን አደራ መስጠት» የሚል ልዩ ሰዋሰዋዊ ፍቺ አለው። ተፈጥሯዊ አማርኛንና የግሪኩን ግንኙነት ለማቆየት ልዩነቱ በማስታወሻ ተገልጿል።
- issue: የπάντας ወሰን
  choice: «ሰዎችን ሁሉ» በማለት በአጠቃላይ ማቅረብ
  alternative: «ሁሉንም» ወይም «ሰውን ሁሉ»
  rationale: የወንድ ብዙ ቁጥሩ ቅርጽ በዐውዱ የሰው ልጆችን በአጠቃላይ ያመለክታል፤ ጽሑፉ ከሚለው በላይ ወደ አንድ የተወሰነ ቡድን አልተገደበም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ራሱን አደራ መስጠት» የግሪኩን ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
