  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: am
  text: ኢየሱስ ራሱ ግን ራሱን ለእነርሱ አደራ አልሰጠም፤[a] ምክንያቱም ሰዎችን ሁሉ ያውቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ እዚህና በቀደመው ቁጥር አንድ ዓይነት ግስ ተጠቅሟል፤ ብዙዎች በኢየሱስ «አመኑ»፣ ኢየሱስ ግን ራሱን ለእነርሱ «አደራ አልሰጠም»።
