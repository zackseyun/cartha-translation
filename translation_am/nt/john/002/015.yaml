  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: am
  text: ከገመዶችም ጅራፍ ሠርቶ ሁሉንም፣ በጎቹንና ከብቶቹንም፣ ከቤተ መቅደሱ ግቢ[a] አስወጣቸው[b]፤ የገንዘብ መንዛሪዎቹን ሳንቲሞች አፈሰሰ፣ ጠረጴዛዎቻቸውንም ገለበጠ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ἱερόν የሚለው ቃል የቤተ መቅደሱን ሕንፃዎችና ግቢዎች በአጠቃላይ ያመለክታል፤ የውስጠኛውን መቅደስ ብቻ አይደለም።
    reason: cultural_note
  - marker: b
    text: የግሪኩ አባባል መጀመሪያ «ሁሉንም» ይላል፣ ከዚያም «በጎቹንና ከብቶቹንም» ብሎ ይጠቅሳል፤ ጅራፉ በሰዎች ላይ እንደተጠቀመ ግን በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: ሠርቶ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን ተግባር ያሳያል፤ «ሠርቶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: ከገመዶች ጅራፍ
  rationale: «ጅራፍ» መሣሪያውን፣ «ከገመዶች» ደግሞ የተሠራበትን ነገር በግልጽ ያሳያል።
- source_word: πάντας
  choice: ሁሉንም
  rationale: የቃሉን አጠቃላይ ኃይል ይጠብቃል፤ ቀጥሎ በጎችና ከብቶች ተጠቅሰዋል፣ ነገር ግን ተውላጠ ስሙን በአንድ ወገን ብቻ አይገድበውም።
- source_word: ἐξέβαλεν
  choice: አስወጣቸው
  rationale: በዚህ ዐውድ ἐκβάλλω በኃይል ከቦታ ማስወጣትን ያመለክታል፤ ይህ ምርጫ በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: τοῦ ἱεροῦ
  choice: ከቤተ መቅደሱ ግቢ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን የቤተ መቅደሱን ሕንፃዎችና አደባባዮች የሚያካትተውን ስፍራ ያመለክታል።
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: በጎቹንና ከብቶቹንም
  rationale: ሁለቱንም የእንስሳት ወገኖች በዘመናዊና በቀላሉ በሚገባ ቃል ያቀርባል፤ βοῦς በዐውዱ «ከብቶች» ተብሎ ሊተረጎም ይችላል።
- source_word: κολλυβιστῶν
  choice: የገንዘብ መንዛሪዎቹ
  rationale: በቤተ መቅደሱ አካባቢ ምንዛሬ የሚለውጡትን ሰዎች በተለመደ አማርኛ ይገልጻል።
- source_word: ἐξέχεεν τὰ κέρματα
  choice: ሳንቲሞች አፈሰሰ
  rationale: ἐκχέω ያለውን «ማፍሰስ» ምስል ይጠብቃል፤ κέρματα ደግሞ ትናንሽ የብር ሳንቲሞችን ያመለክታል።
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: ጠረጴዛዎቻቸውንም ገለበጠ
  rationale: በዐውዱ ἀναστρέφω ጠረጴዛዎቹን መገልበጥ ወይም መጣል ማለት ነው፤ «ገለበጠ» አጭርና ትክክለኛ ነው።
theological_decisions:
- issue: ኢየሱስ ከቤተ መቅደሱ ያስወጣቸው እነማን እንደሆኑና ጅራፉን በሰዎች ላይ መጠቀሙ
  choice: «ሁሉንም» የሚለው ተጠብቆ፣ በጎችና ከብቶች በቀጥታ ተጠቅሰዋል፤ ጅራፉ በሰዎች ላይ እንደዋለ አልተጨመረም።
  alternative: «ሰዎቹንና እንስሳቱን ሁሉ» ወይም «እንስሳቱን ብቻ» ብሎ በግልጽ መወሰን።
  rationale: የግሪኩ πάντας አጠቃላይ ነው፣ ከዚያም በጎችና ከብቶች ይጠቀሳሉ፤ ጽሑፉ ግን ጅራፉ በሰዎች ላይ እንደተጠቀመ በግልጽ አይናገርም። ትርጉሙ ይህን አሻሚነት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ቤተ መቅደሱ ግቢ» የἱερόνን ሰፊ ትርጉም ያሳያል፤ የዓረፍተ ነገሩ ምልክቶች ደግሞ «ሁሉንም» እና ተከትሎ የተጠቀሱትን እንስሳት ሳያደበዝዙ እንዲነበቡ ተደርገዋል።
