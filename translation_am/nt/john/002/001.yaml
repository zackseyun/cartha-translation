id: JHN.2.1
reference: John 2:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: am
  text: በሦስተኛውም ቀን በገሊላ ቃና ሰርግ[a] ነበረ፤ የኢየሱስም እናት በዚያ ነበረች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሰርግ ድግስ»። የግሪኩ ቃል የጋብቻውን ክንውንም ሆነ የሰርጉን ድግስ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ተራኪያዊ አያያዥ በተፈጥሯዊው የአማርኛ አያያዥ ቅጥያ ያስተላልፋል።
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: በሦስተኛው ቀን
  rationale: የተወሰነውን የጊዜ ምልክት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: γάμος
  choice: ሰርግ
  rationale: ቃሉ የጋብቻውን ክንውንም ሆነ የሰርጉን ድግስ ሊያመለክት ይችላል፤ «ሰርግ» በአማርኛ ሰፊና ተፈጥሯዊ ነው።
- source_word: ἐγένετο
  choice: ነበረ
  rationale: በቦታው የነበረውን ክስተት በቀላል ተራኪያዊ አገላለጽ ያቀርባል፤ «ተደረገ» የሚለውን አላስፈላጊ ተጨማሪ አጽንዖት አይጨምርም።
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: በገሊላ ቃና
  rationale: የቦታውን ስምና ክልል በተለመደው የአማርኛ ቅደም ተከተል ይገልጣል።
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: የኢየሱስ እናት
  rationale: የግሪኩን የዝምድና አገላለጽ በቅርብና በክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ቀላሉን የቦታ ተውሳክ ያለ ማብራሪያ መጨመር በቀጥታ ይተረጉማል።
theological_decisions:
- issue: «በሦስተኛው ቀን» የሚለው የጊዜ ምልክት
  choice: እንደ ተራኪያዊ የጊዜ መግለጫ በቀጥታ ተጠብቋል።
  alternative: የትንሣኤ ምሳሌያዊ ፍንጭን በትርጉሙ ውስጥ ግልጽ ማድረግ።
  rationale: በዮሐንስ ትረካ ውስጥ ምሳሌያዊ ድምፅ ሊሰማ ቢችልም፣ ጽሑፉ ራሱ እዚህ የጊዜ ማመልከቻ ይሰጣል፤ ትርጉሙ አንዱን ትርጓሜ አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «-ም» የተራኪያዊውን Καὶ ተፈጥሯዊ በሆነ መንገድ ይይዛል። በእንግሊዝኛው የቀረበው [b] አማራጭ ከዋናው ንባብ ጋር ተመሳሳይ ስለሆነና በግሪኩ የጽሑፍ ልዩነት ስላልሆነ አልተካተተም።
