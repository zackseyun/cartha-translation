  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: am
  text: ስለዚህ አይሁድ[a] መልሰው፣ “እነዚህን ነገሮች ስለምታደርግ ምን ምልክት ታሳየናለህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአይሁድ መሪዎች” ወይም “የይሁዳ ሰዎች።” በዮሐንስ ወንጌል “አይሁድ” የሚለው ቃል እንደ አውዱ መላውን ሕዝብ ሳይሆን ጠባብ ተወካይ ቡድንን፣ በተለይም የይሁዳ ባለሥልጣናትን፣ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: መልሰው … አሉት
  rationale: የንግግር ምላሽን በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል፤ ἀπεκρίθησαν καὶ εἶπαν የሚለውን የግሪክ አገላለጽ ትርጉም ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው የቤተ መቅደስ ድርጊት ጋር ያለውን የትረካና የምክንያት ትስስር ያሳያል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን ቀጥተኛ አገላለጽ ይጠብቃል፤ በዚህ አውድ የአይሁድ መሪዎችን ወይም የይሁዳን አካባቢ ሰዎች ሊያመለክት የሚችለው ጠባብ ትርጉም በማስታወሻ ተገልጧል።
- source_word: Τί σημεῖον
  choice: ምን ምልክት
  rationale: በዮሐንስ ወንጌል ከተአምርነቱ አልፎ ማንነትንና ሥልጣንን የሚያመለክተውን σημεῖον በተመሳሳይ ቃል ያስተላልፋል።
- source_word: δεικνύεις ἡμῖν
  choice: ታሳየናለህ
  rationale: ‘ለእኛ ታሳያለህ’ የሚለውን ትርጉም በተፈጥሯዊና አጭር የአማርኛ ቅርጽ ያቀርባል።
- source_word: ὅτι ταῦτα ποιεῖς
  choice: እነዚህን ነገሮች ስለምታደርግ
  rationale: ὅτιን የጥያቄውን መሠረት እንደሚገልጽ ምክንያታዊ አገናኝ ይወስዳል፤ ταῦτα የሚለውን ብዙ ቁጥርም በግልጽ ይጠብቃል።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚያመለክተው ቡድን
  choice: በዋናው ጽሑፍ “አይሁድ” ተብሎ ተተርጉሟል
  alternative: “የአይሁድ መሪዎች” ወይም “የይሁዳ አካባቢ ሰዎች”
  rationale: ግሪኩ ቡድኑን በግልጽ ‘መሪዎች’ ብሎ አይገድበውም። ሆኖም የዮሐንስ አጠቃቀምና የቅርብ አውድ ቃሉ መላውን የአይሁድ ሕዝብ ሳይሆን ተወካይ ቡድንን፣ በተለይም ባለሥልጣናትን፣ ሊያመለክት እንደሚችል ያሳያሉ፤ ይህ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ጥቅም ላይ ውሏል። “መልሰው … አሉት” የሚለው ቅርጽ የግሪኩን የንግግር መግቢያ ሳያከብድ በተፈጥሯዊ አማርኛ ያቀርባል።
