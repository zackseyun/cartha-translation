- issue: πιστεύω ከዳቲቭ ተሳቢዎች ጋር ያለው ትርጉም
  choice: መጽሐፉንና ... ቃል አመኑ
  alternative: በመጽሐፉና ... በቃሉ ታመኑ / እምነት ጣሉ
  rationale: «አመኑ» የግሪኩን መሠረታዊ ትርጉም ያለ ተጨማሪ ዶክትሪናዊ ጭነት ይጠብቃል። በዐውዱ ደቀ መዛሙርቱ መጽሐፉ የሚለውንና ኢየሱስ የተናገረውን እውነት አድርገው መቀበላቸው ይገለጣል።
