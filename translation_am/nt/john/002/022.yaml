base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: am
  text: ስለዚህ፣ እርሱ ከሙታን በተነሣ ጊዜ፣[a] ደቀ መዛሙርቱ ይህን እንደተናገረ አስታወሱ፤[b] ቅዱስ መጽሐፍንና ኢየሱስ የተናገረውን ቃል አመኑ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሙታን እንደ ተነሣ ጊዜ።» የግሪኩ ግስ ተደራጊ ቅርጽ ነው፤ «በተነሣ» የሚለው ግን በትንሣኤ ዐውድ የተለመደ የአማርኛ አገላለጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ይህን እየተናገረ እንደነበር።» የግሪኩ ኢምፐርፌክት ግስ ቀደም ሲል በሂደት ወይም በተደጋጋሚ የነበረ ንግግርን ሊጠቁም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «ቃል» እዚህ የተነገረ ነገር፣ ንግግር ወይም መልእክት ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: ስለዚህ ... በተነሣ ጊዜ
  rationale: ὅτε የጊዜን ግንኙነት፣ οὖν ደግሞ የትረካውን ቀጣይነትና ውጤት ያመለክታሉ፤ ይህ አተረጓጎም ሁለቱንም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἠγέρθη
  choice: በተነሣ
  rationale: የግሪኩ ግስ ተደራጊ ቅርጽ አለው። በአማርኛ «በተነሣ ጊዜ» ተፈጥሯዊ ቢሆንም ተደራጊውን ቅርጽ በግልጽ አያሳይም፤ ስለዚህ አማራጩ በማስታወሻ ተጠቅሷል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: የትንሣኤውን መደበኛ አገላለጽ በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: ἐμνήσθησαν
  choice: አስታወሱ
  rationale: በዐውዱ ያለፈውን ንግግር ወደ አእምሮ መመለስን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: ይህን ይናገር እንደነበር
  rationale: የἔλεγεν ኢምፐርፌክት ቅርጽ ቀደም ሲል በሂደት የነበረ ንግግርን ሊያመለክት ስለሚችል «ይናገር እንደነበር» ይህን ገጽታ ይጠብቃል፤ ነገር ግን ድግግሞሽን አያስገድድም።
- source_word: ἐπίστευσαν
  choice: አመኑ
  rationale: ቃሉን ያለ ተጨማሪ ትርጓሜ በቀጥታ ይተረጉማል፤ መጽሐፉንና የኢየሱስን ቃል እውነት አድርገው መቀበላቸውን ያሳያል።
- source_word: τῇ γραφῇ
  choice: መጽሐፉን
  rationale: ነጠላውን γραφή በመጠበቅ ለቅዱስ መጽሐፍ ወይም ለተወሰነ የቅዱስ መጽሐፍ ቃል የሚያመለክተውን ስፋት ክፍት ያደርጋል።
- source_word: τῷ λόγῳ
  choice: ቃል
  rationale: በዚህ ዐውድ λόγος የኢየሱስን የተነገረ ቃል ወይም ንግግር ያመለክታል፤ «ቃል» የዮሐንስን የቃላት ትስስር ሳያጠፋ ተፈጥሯዊ ነው።
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: ኢየሱስ የተናገረውን
  rationale: የዝምድና አረፍተ ነገሩ λόγῳን እንደሚገልጽ በግልጽና በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
theological_decisions:
- issue: የትንሣኤውን ግስ ተደራጊ ቅርጽ መጠበቅ
  choice: ከሙታን በተነሣ ጊዜ
