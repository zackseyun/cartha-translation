  verdict: revise
  source_fidelity: The draft conveys the verse’s basic sequence and preserves the singular reference to Scripture and Jesus’ spoken saying. However, «ይህን ይናገር እንደነበር» is not an idiomatic or well-formed Amharic rendering in this clause. The main resurrection expression is acceptable as an idiomatic Amharic passive/middle form, but its footnote contains a typographical error and gives an unhelpful alternative.
  naturalness: A revision is needed for natural modern standard Amharic. «ይህን እንደተናገረ» is clear, idiomatic, and fits the retrospective context; it does not illegitimately force a repeated sense from the Greek imperfect. «መጽሐፉን» can sound merely like ‘the book’; «ቅዱስ መጽሐፍን» clearly conveys γραφή in this biblical context.
  terminology: «ደቀ መዛሙርቱ», «ከሙታን በተነሣ», «ቃል», and «አመኑ» are appropriate. Use «ቅዱስ መጽሐፍ» for the authoritative Scripture intended by γραφή. The footnotes should accurately describe the passive Greek verb and the possible imperfect nuance without presenting malformed Amharic.
  issues:
  - severity: high
    issue: The phrase «ይህን ይናገር እንደነበር» is unidiomatic/grammatically unsuitable in this context.
    rationale: The form «ይናገር» does not naturally express the intended past imperfect within this indirect clause. It impedes comprehension. A simple past, «እንደተናገረ», is natural and contextually faithful; the possible ongoing/repeated nuance can be retained in a footnote.
  - severity: medium
    issue: «መጽሐፉን» is potentially too nonspecific.
    rationale: In ordinary modern Amharic it readily means ‘the book.’ Since γραφή here denotes Scripture, «ቅዱስ መጽሐፍን» communicates the referent clearly while retaining the singular.
  - severity: medium
