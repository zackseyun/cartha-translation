  register: ዘመናዊ፣ ክብር ያለውና ለሰፊው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ደቀ መዛሙርቱ» እና «ከሙታን ተነሣ» የሚሉት የመጽሐፍ ቅዱስ ዐውድ ያላቸው ቢሆኑም በዘመናዊ አማርኛ በስፋት የሚገቡ ናቸው።
