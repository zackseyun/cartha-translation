  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: am
  text: 'እርሱም፣ “አሁን ቅዱና ለግብዣው አስተዳዳሪው[a] አቅርቡት” አላቸው። እነርሱም አመጡት።


    [a] “የግብዣው ኃላፊ” ወይም “ዋና አስተናጋጅ” ሊባልም ይችላል። የግሪኩ ቃል የግብዣውን ሥርዓት የሚቆጣጠረውን ሰው ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የግብዣው ኃላፊ” ወይም “ዋና አስተናጋጅ” ሊባልም ይችላል። የግሪኩ ቃል የግብዣውን ሥርዓት የሚቆጣጠረውን ሰው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: በግሪክ ትረካ ያለው የአሁን ጊዜ ግስ ታሪካዊ አሁን ነው፤ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መጠቀም ተገቢ ነው።
- source_word: Ἀντλήσατε
  choice: ቅዱ
  rationale: ፈሳሽን ከዕቃ ውስጥ ቀድቶ ማውጣትን የሚገልጽ የብዙ ቁጥር ትእዛዝ ነው፤ ከአውዱ የሚታወቀውን ውኃ በዋናው ጽሑፍ ሳይጨምር “ቅዱ” በቂና ተፈጥሯዊ ነው።
- source_word: νῦν
  choice: አሁን
  rationale: የትእዛዙን አፋጣኝነት በቀጥታ ይጠብቃል።
- source_word: φέρετε
  choice: ውሰዱ
  rationale: የተቀዳውን ፈሳሽ ወደ ሌላ ሰው ማድረስን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀρχιτρικλίνῳ
  choice: ወደ ድግሱ አስተዳዳሪ
  rationale: ቃሉ የግብዣውን ሥርዓትና አገልግሎት የሚቆጣጠረውን ሰው ያመለክታል፤ “የድግሱ አስተዳዳሪ” ግልጽ፣ ክብር ያለውና ለዘመናዊ አንባቢ ተረዥ ነው።
- source_word: οἱ δὲ ἤνεγκαν
  choice: እነርሱም ወሰዱ
  rationale: δέ እዚህ ቀላል አያያዥ ሲሆን፣ ἤνεγκαν የትእዛዙን ፈጸማ ይገልጻል። በግሪኩ ግልጽ ያልተጠቀሰውን ተሳቢ በአማርኛም ሳይጨምር አጭር አገላለጹ ተጠብቋል።
