  text: But he was speaking about the temple of his body[a].
translation:
  language: am
  text: እርሱ ግን የሰውነቱን ቤተ መቅደስ[a] በተመለከተ ይናገር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሰውነቱ መቅደስ»፤ እዚህ ያለው የግሪክ ቃል ναός (ናኦስ) ብዙ ጊዜ ከጠቅላላው የቤተ መቅደስ ግቢ ይልቅ በተለይ ውስጣዊውን የመቅደስ ክፍል ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: እርሱ
  rationale: በዐውዱ ወደ ኢየሱስ የሚያመለክት ተውላጠ ስም ሆኖ በተፈጥሯዊ አማርኛ «እርሱ» ተብሏል።
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው ቁጥር ከተገለጠው የአይሁድ አለመረዳት ጋር ያለውን ረጋ ያለ ንጽጽር ያሳያል።
- source_word: ἔλεγεν
  choice: ይናገር የነበረው
  rationale: የግሪኩን ኢምፐርፌክት ገጽታ ገላጭ ያለፈ ድርጊት አድርጎ ይጠብቃል፤ «ማለቱ ነበር» ከሚለውም ያነሰ ትርጓሜ ይጨምራል።
- source_word: περὶ
  choice: ስለ
  rationale: ከጄኒቲቭ ጋር ያለውን «ስለ፣ በተመለከተ» የሚል ትርጉም በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ναοῦ
  choice: ቤተ መቅደስ
  rationale: ναός በተለይ የመቅደሱን ውስጣዊ ቅዱስ ክፍል ሊያመለክት ቢችልም፣ «ቤተ መቅደስ» በአማርኛ የተለመደና በዐውዱ የሚገባ ነው፤ የቃሉ የተለየ ጥበብ በማስታወሻ ተጠብቋል።
- source_word: σώματος
  choice: ሰውነቱ
  rationale: የኢየሱስን ሥጋዊ አካል በግልጽ አማርኛ ይገልጣል፤ ከαὐτοῦ ጋር ያለውን የባለቤትነት ግንኙነትም በቅጥያው ይይዛል።
- source_word: αὐτοῦ
  choice: -ቱ (ሰውነቱ)
  rationale: ሰውነቱ የኢየሱስ ራሱ መሆኑን በተፈጥሯዊው የአማርኛ ባለቤትነት ቅጥያ ያሳያል።
theological_decisions:
- issue: የኢየሱስ ሰውነት ከቤተ መቅደስ ጋር በዘይቤ መለየቱ
  choice: «ስለ ሰውነቱ ቤተ መቅደስ» በማለት የጄኒቲቭ ዘይቤውን በቀጥታ መጠበቅ
  alternative: «ሰውነቱ ቤተ መቅደስ እንደሆነ» ወይም «ሰውነቱን እንደ ቤተ መቅደስ»
  rationale: የዮሐንስን ማብራሪያ ያለ ዶክትሪናዊ ማስፋፊያ በቀጥታ ያቀርባል፤ በሰውነቱና በቤተ መቅደሱ መካከል ያለውን ጠንካራ ዘይቤያዊ ግንኙነትም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ይናገር የነበረው ... ነበር» የሚለው አወቃቀር የግሪኩን ገላጭ ያለፈ ጊዜ በተፈጥሯዊ መንገድ ያስተላልፋል።
