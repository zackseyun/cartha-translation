  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: am
  text: ወይኑም ባለቀ ጊዜ፣[a] የኢየሱስ እናት፣ “ወይን የላቸውም” ትለዋለች።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ «ወይን በጎደለ ጊዜ።»
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው ታሪካዊውን የአሁን ጊዜ፣ «ትለዋለች» ይጠቀማል። አንዳንድ ትርጉሞች «አለችው» ብለው ይተረጉሙታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: ወይኑም ባለቀ ጊዜ
  rationale: የግሪኩ ገላጭ የባለቤት አገባብ ከዋናው ግስ በፊት የተፈጸመውን ሁኔታ ያመለክታል። «ወይኑ ባለቀ» የመጠጡን መጉደል በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: λέγει
  choice: ትለዋለች
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ግስ ጠብቆ የዮሐንስን ሕያው የትረካ ዘይቤ ያሳያል።
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: የኢየሱስ እናት
  rationale: የግሪኩን አጠራርና በዚህ ክፍል ዮሐንስ የሚጠቀምበትን የገጸ ባሕርይ መግለጫ በቀጥታ ይጠብቃል።
- source_word: πρὸς αὐτόν
  choice: ትለዋለች
  rationale: በአማርኛ «ትለዋለች» የሚለው ተዋሃዳዊ ግስ ንግግሩ ወደ እርሱ መቅረቡን ተፈጥሯዊ በሆነ መንገድ ያካትታል።
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: ወይን የላቸውም
  rationale: ያልተጠቀሰውን ብዙ ቁጥር ባለቤት በግሱ ውስጥ ይጠብቃል፤ አስተናጋጆቹ ወይም የሰርጉ ወገኖች ብሎ አይወስነውም።
- source_word: οἶνος
  choice: ወይን
  rationale: በዐውዱ ያለውን መደበኛ የቃሉን ትርጉም ያለማዳከም ይገልጣል።
theological_decisions:
- issue: በዮሐንስ ትረካ ያለው ታሪካዊ የአሁን ጊዜ
  choice: «ትለዋለች» በማለት የአሁን ጊዜውን መጠበቅ
  alternative: ለስላሳ ያለፈ ጊዜ ትረካ ለማድረግ «አለችው» ማለት
  rationale: ይህ የግሪኩን የንግግር ሕያውነት ይጠብቃል፤ በአማርኛም ሊነበብ የሚችል ሲሆን የሥነ መለኮት ትርጉም አይጨምርም።
- issue: «ወይን የላቸውም» ውስጥ ያልተጠቀሰው የብዙ ቁጥር ባለቤት
  choice: በ«የላቸውም» ውስጥ ባለቤቱን አለመግለጽ
  alternative: «የሰርጉ አስተናጋጆች ወይን የላቸውም» ወይም «የሰርጉ ወገኖች ወይን የላቸውም» ማለት
  rationale: የግሪኩ ጽሑፍ ባለቤቱን በስም አይገልጽም። አማርኛውም ይህን አሻሚነት በተፈጥሯዊ መንገድ ይጠብቃል።
