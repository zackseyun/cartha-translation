  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: am
  text: 'ስለዚህ ወንድሞቹ እንዲህ አሉት፦ “ከዚህ ተነሥተህ ወደ ይሁዳ አገር ሂድ፤ ደቀ መዛሙርትህም የምትሠራቸውን ሥራዎች እንዲያዩ[a]።”


    [a] ወይም “እንደሚያዩ” ወይም “በጥሞና እንዲመለከቱ።” የግሪክኛው ግስ በጥሞና ማየትን ወይም መመልከትን ሊያጎላ ይችላል፤ በዚህ ዓላማን በሚገልጽ ሐረግ ውስጥ ያለው የወደፊት ጊዜ ቅርጽም በተለያየ መንገድ ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
