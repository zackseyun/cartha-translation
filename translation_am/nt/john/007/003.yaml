  rationale: የቀደመውን ንግግር ከዚህ ድርጊት ጋር የሚያገናኘውን መደምደሚያዊና ተከታታይ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ወንድሞቹ
  rationale: የግሪክኛው ቃል ወንድ ብዙ ቁጥር ሲሆን፣ በአውዱም የኢየሱስን ወንድ የቤተሰብ አባላት ያመለክታል።
- source_word: Μετάβηθι ἐντεῦθεν
  choice: ከዚህ ተነሥተህ
  rationale: ከአሁኑ ስፍራ መሄድን የሚጠይቀውን ቀጥተኛ ትእዛዝ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: ወደ ይሁዳ አገር ሂድ
  rationale: የእንቅስቃሴውን ትእዛዝና መድረሻውን ግልጽ ያደርጋል፤ “አገር” እዚህ የይሁዳን ክልል ያመለክታል።
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: ደቀ መዛሙርትህም … እንዲያዩ
  rationale: “እንዲ-” ዓላማን ሲገልጽ፣ ከ“ደቀ መዛሙርትህ” ጋር የተያያዘው “-ም” የκαὶን “ደግሞ” ትርጉም ይጠብቃል።
- source_word: θεωρήσουσιν
  choice: እንዲያዩ
  rationale: ከἵνα ጋር ባለው ዓላማ ገላጭ ሐረግ ውስጥ የታሰበውን ውጤት በተፈጥሯዊ አማርኛ ይገልጻል፤ የወደፊት ጊዜውና የበጥሞና መመልከት ፍቺዎች በማስታወሻ ተጠብቀዋል።
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: የምትሠራቸውን ሥራዎች
  rationale: የσοῦን ባለቤትነት ከአንጻራዊው ሐረግ ጋር በአማርኛ ተፈጥሯዊ መዋቅር ያቀርባል፤ “ሥራዎች” በዮሐንስ ውስጥ ያለውን ጭብጣዊ አጠቃቀም ይጠብቃል።
theological_decisions:
- issue: “ወንድሞቹ” የሚለው ማንን እንደሚያመለክት
  choice: በትረካው ውስጥ ተናጋሪዎቹን የኢየሱስ ወንድሞች/የቅርብ ቤተሰብ አባላት በቀጥታ “ወንድሞቹ” ብሎ መጥራት
  alternative: ሰፋ ያለ የዘመድ ወይም የዝምድና ቡድን
  rationale: ዮሐንስ 7፥3–5 ቃሉን በቤተሰባዊ ፍቺው ያቀርባል። ትርጉሙ ጽሑፉ የሚለውን በቀጥታ ይጠብቃል፤ ከዚያ በላይ ያለ የእምነት ትምህርታዊ ድምዳሜ አያስገባም።
- issue: በἵνα ሐረግ ውስጥ ያለው የθεωρήσουσιν የወደፊት ጊዜ ቅርጽ
  choice: ዋናው ጽሑፍ ዓላማን “እንዲያዩ” ብሎ ይገልጻል፤ የወደፊት ጊዜ አማራጩ በማስታወሻ ይቀመጣል
  alternative: “እንደሚያዩ” በማለት የወደፊት ጊዜውን በግልጽ ማቅረብ
  rationale: ἵνα ዓላማን ያመለክታል፣ ነገር ግን ግሱ በቅርጹ የወደፊት ጊዜ ነው። ዋናው ትርጉም ተፈጥሯዊውን የዓላማ ፍቺ ሲያስተላልፍ፣ ቅርጻዊውን አሻሚነት ማስታወሻው ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ደቀ መዛሙርት” እና “ሥራዎች” የዮሐንስን ቁልፍ ቃላት ለመጠበቅ ተመርጠዋል። የማስታወሻው ምልክት በእንግሊዝኛው የምክክር ጽሑፍ ከተቀመጠበት ቦታ ይልቅ በቀጥታ ከሚያብራራው “እንዲያዩ” ጋር ተያይዟል።
