  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: am
  text: ጠባቂዎቹም፣ “እንዲህ የተናገረ ሰው ከቶ የለም” ብለው መለሱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማንም ሰው እንዲህ ተናግሮ አያውቅም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ብለው መለሱ
  rationale: የግሪኩ ግስ በውይይት አውድ ‘መለሱ’ ማለት ነው፤ ‘ብለው’ የሚለው ቀጥተኛውን ንግግር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: οἱ ὑπηρέται
  choice: ጠባቂዎቹ
  rationale: በዮሐንስ 7፥32፣45 አውድ እነዚህ ኢየሱስን ለመያዝ የተላኩ አገልጋይ ሹማምንት ናቸው። ‘ጠባቂዎቹ’ ተግባራቸውን በግልጽና በዘመናዊ አማርኛ ያሳያል፤ ‘የቤተ መቅደሱ ፖሊሶች’ ግን ከጽሑፉ በላይ የሚተረጉም ነው።
- source_word: Οὐδέποτε
  choice: ከቶ የለም
  rationale: ፈጽሞ በየትኛውም ጊዜ እንዳልሆነ የሚገልጠውን ፍጹም እምቢታ ያስተላልፋል።
- source_word: ἐλάλησεν οὕτως
  choice: እንዲህ የተናገረ
  rationale: οὕτως የንግግሩን አኳኋን ያመለክታል፤ ‘እንዲህ የተናገረ’ በአማርኛ ተፈጥሯዊ ሆኖ ይህን ትርጉም ይጠብቃል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ἄνθρωπος እዚህ ነጠላ ቁጥር ቢሆንም ወካይ ኃይል አለው። ‘ሰው’ የምንጩን ሰዋዊ ማመልከቻና ነጠላ ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የἄνθρωπος ወካይ ኃይል
  choice: ሰው
  alternative: ማንም ሰው
  rationale: የግሪኩ ስም ነጠላ ሆኖ ሁሉን ወክሎ ይሠራል። የአማርኛው ‘ሰው’ ይህን ሁለቱንም ገጽታ ይይዛል፤ ‘ማንም ሰው’ ግን በግሪኩ በግልጽ ያልተጻፈውን አጠቃላይ አገላለጽ ይጨምራል።
