id: JHN.7.41
reference: John 7:41
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: am
  text: ሌሎችም፣ “ይህ መሲሑ ነው” ይሉ ነበር።[a] አንዳንዶች ግን፣ “መሲሑ ከገሊላ አይመጣም እንዴ?” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ክርስቶስ ነው።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  choice: ሌሎችም
  rationale: በሕዝቡ ውስጥ ያለ ሌላ ቡድንን ያመለክታል፤ የአማርኛው -ም በዐውዱ ያለውን ተጨማሪ ቡድን በተፈጥሮ ያሳያል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩ ያልተጠናቀቀ ጊዜ በሕዝቡ መካከል ቀጣይ ወይም ተደጋጋሚ ንግግርን ያመለክታል።
- source_word: Οὗτός ἐστιν
  choice: ይህ … ነው
  rationale: ግለሰቡን በቀጥታ የሚለይ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: እዚህ Χριστός የሚጠበቀውን ቅቡዕ ንጉሥ የሚያመለክት ማዕረግ ስለሆነ፣ የዕብራይስጡን መሲሐዊ ትርጉም የሚጠብቀው “መሲሕ” ተመርጧል፤ የተወሰነው አንቀጽ በ“-ሑ” ተንጸባርቋል።
- source_word: οἱ δὲ
  choice: አንዳንዶች ግን
  rationale: የተቃራኒውን ሌላ ቡድን በተፈጥሯዊ አማርኛ ያሳያል፤ “ግን” የδέን ንፅፅር ይጠብቃል።
- source_word: Μὴ γὰρ
  choice: … ይመጣል እንዴ?
  rationale: μή አሉታዊ መልስ የሚጠብቅ ጥያቄ ያቀርባል፤ “እንዴ?” የተናጋሪዎቹን አለማመንና ተቃውሞ በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ τῆς Γαλιλαίας
  choice: ከገሊላ
  rationale: ἐκ እዚህ የመገኛ ወይም የመነሻ ስፍራን ያመለክታል፤ “ከ-” ትክክለኛና ተፈጥሯዊ ነው።
- source_word: ἔρχεται
  choice: ይመጣል
  rationale: ስለ መሲሑ መገኛ ያለውን አጠቃላይ ግምት በአማርኛ የወደፊት/አጠቃላይ ቅርጽ በተፈጥሮ ይገልጣል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ቁጥር Χριστός በሕዝቡ ዘንድ ክርክር የተነሣበትን የተጠበቀ ቅቡዕ ያመለክታል፤ ስለዚህ “መሲሑ” የማዕረጉን የዕብራይስጥ ዳራ ይጠብቃል፣ “ክርስቶስ” ደግሞ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የἔλεγον ቀጣይነት “ይሉ ነበር” ተብሎ ተጠብቋል፤ የአሉታዊ መልስ ግምት ያለበት ጥያቄም “እንዴ?” በሚለው ተፈጥሯዊ አገላለጽ ቀርቧል።
