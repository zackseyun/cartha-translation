lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: τοῦτον
