- source_word: ὁ δὲ χριστός
  choice: መሲሑ … ግን
  rationale: χριστός እዚህ እንደ ሚጠበቀው የመሲሕነት ማዕረግ ስለሚሠራ «መሲሑ» ተብሎ ተተርጉሟል፤ «ግን» ደግሞ ተቃርኖውን ያስቀምጣል።
