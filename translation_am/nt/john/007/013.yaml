  terminology: «አይሁድ» appropriately retains the source term in the main text, while the footnote responsibly records the contextually possible reference to Judean/Jerusalem authorities. The footnote is adjusted slightly for idiomatic grammar and to avoid claiming an overly fixed referent.
  issues:
