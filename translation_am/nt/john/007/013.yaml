  source_fidelity: The draft conveys the verse’s contrast, public openness, subject matter, and causal fear. However, «አይሁድን በመፍራት» shifts the Greek nominal expression “because of the fear of the Jews” into an active participial construction, and the negative imperfect wording is less idiomatic than a clear ongoing-state construction.
