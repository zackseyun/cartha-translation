- source_word: διὰ τὸν φόβον
  choice: በመፍራት
  rationale: διά ከተሳቢ ጋር የሚገልጸውን ምክንያት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν Ἰουδαίων
  choice: አይሁድን
  rationale: የግሪኩን ሰፊ የቃል ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ በዚህ ዐውድ ግን ቃሉ በተለይ በኢየሩሳሌም ያሉትን ኃያላን የአይሁድ መሪዎች ሊያመለክት ስለሚችል ማብራሪያ በግርጌ ማስታወሻ ተሰጥቷል።
theological_decisions:
