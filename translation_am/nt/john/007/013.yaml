  rationale: ዋናው ጽሑፍ የግሪኩን እውነተኛ የትርጉም ስፋት ይጠብቃል፤ ማስታወሻው ደግሞ ቃሉ በዚህ ስፍራ ሁሉንም የአይሁድ ሕዝብ ሳይሆን ኢየሱስን የተቃወሙትን የኢየሩሳሌም ባለሥልጣናት በተለይ ሊያመለክት እንደሚችል ያሳያል፤ በዚህም ታሪካዊ ያልሆነ ፀረ-አይሁድ ንባብን ይከላከላል።
