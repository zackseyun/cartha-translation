theological_decisions:
- issue: የኢየሱስ ትምህርት ከላከው ጋር ያለው ግንኙነት
  choice: “ትምህርቴ የእኔ ሳይሆን የላከኝ ነው” በማለት የምንጭና የባለቤትነት ንፅፅሩ ተጠብቋል።
  alternative: ንግግሩን የኢየሱስን ሥልጣን እንደሚክድ ወይም በአንጻሩ በእርሱና በላከው መካከል ያለውን ልዩነት እንደሚያጠፋ አድርጎ መተርጎም።
  rationale: ጽሑፉ ትምህርቱ በራሱ ተነጥሎ ከኢየሱስ የመነጨ አለመሆኑን ይናገራል፤ ነገር ግን ስለ ሥልጣኑ ወይም ስለ መለኮታዊ ማንነቱ ከቃላቱ በላይ የሚሄድ መደምደሚያ አይጨምርም።
