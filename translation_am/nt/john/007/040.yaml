  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: am
  text: ስለዚህ፣ ከሕዝቡ አንዳንዶች እነዚህን ቃላት በሰሙ ጊዜ፣ “ይህ በእውነት ነቢዩ[a] ነው” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ነቢዩ” የሚለው ምናልባት እንደ ሙሴ ያለ ተጠባቂ ነቢይን ያመለክታል (ዘዳግም 18፥15ን ይመልከቱ)፤ አንዳንድ ተርጓሚዎች ግን ቃሉን በአጠቃላይ “ነቢይ” ብለው ይወስዱታል።
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: ከሕዝቡ አንዳንዶች
  rationale: የግሪኩ ሐረግ ከብዙው ሕዝብ መካከል ከፊሎቹን ያመለክታል፤ ይህ አተረጓጎም የከፊልነቱን ትርጉም በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚመጣውን ውጤትና የትረካውን ቀጣይነት ያሳያል።
- source_word: ἀκούσαντες
  choice: ሲሰሙ
  rationale: የግሪኩን ቀዳሚ ድርጊት በዘመናዊና ተፈጥሯዊ የአማርኛ ጊዜ ሐረግ ይገልጣል።
- source_word: τῶν λόγων τούτων
  choice: እነዚህን ቃላት
  rationale: በቅርቡ የተነገሩትን የኢየሱስ ቃላት ቀጥተኛና ግልጽ በሆነ አገላለጽ ያመለክታል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያለፈውን ቀጣይ ወይም ተደጋጋሚ ንግግር የሚያሳየውን የግሪክ ኢምፐርፌክት ገጽታ ይጠብቃል።
- source_word: Οὗτός ἐστιν
  choice: ይህ ... ነው
  rationale: ተናጋሪዎቹ ወደ ኢየሱስ በቀጥታ የሚያመለክቱበትን ሕያው አገላለጽ ይጠብቃል።
- source_word: ἀληθῶς
  choice: በእውነት
  rationale: የንግግሩን እርግጠኝነትና ክብደት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ προφήτης
  choice: ነቢዩ
  rationale: የግሪኩን የተወሰነ መስተዋድድ በአማርኛው የወሰን ቅጥያ ይጠብቃል፤ አገላለጹን በቀጥታ ‘መሲሑ’ ብሎ በመተርጎም የጽሑፉን አሻሚነት አያስወግድም።
theological_decisions:
- issue: “ὁ προφήτης” የሚያመለክተው ማንነት
  choice: እንደ ተወሰነ መጠሪያ “ነቢዩ” ተብሎ ተተርጉሟል፤ በዋናው ጽሑፍ ከመሲሑ ጋር በግልጽ አልተስተካከለም።
  alternative: አጠቃላይ ትርጉም ያለው “ነቢይ” ወይም በቀጥታ “መሲሑ” ብሎ መተርጎም።
  rationale: የዮሐንስ ዐውድ በዘዳግም 18፥15 የተጠበቀውን እንደ ሙሴ ያለ ነቢይ ሊያመለክት ይችላል፤ ነገር ግን ቁጥሩ ራሱ መጠሪያውን ከመሲሑ ጋር በግልጽ አያንድም። ስለዚህ የጽሑፉ ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ይሉ ነበር” የንግግሩን ቀጣይነት ይጠብቃል፤ የማብራሪያ ምልክቱም በቀጥታ “ነቢዩ” ከሚለው ቃል በኋላ ተቀምጧል።
