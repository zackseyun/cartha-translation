  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: am
  text: “መጽሐፍ መሲሑ ከዳዊት ዘር እንዲሁም ዳዊት ከነበረባት መንደር ከቤተልሔም እንደሚመጣ አላለምን?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γραφή
  choice: መጽሐፍ
  rationale: በዮሐንስ አጠቃቀም የሥልጣን ምንጭ የሆነውን ቅዱስ መጽሐፍ ያመለክታል፤ ‘መጽሐፍ’ በአማርኛ የመጽሐፍ ቅዱስን ምስክርነት ለማመልከት የተለመደ ነው።
- source_word: εἶπεν
  choice: አላለምን
  rationale: ያለፈውን የመጽሐፍ ንግግር በአሁኑ ጊዜ ሥልጣን እንዳለው በሚያሳይ ተፈጥሯዊ የአማርኛ አሉታዊ የንግግር ጥያቄ ተተርጉሟል።
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: ከዳዊት ዘር
  rationale: σπέρμα እዚህ ቀጥተኛ ዘርን ሳይሆን የትውልድ ሐረግን ያመለክታል፤ ‘ዘር’ ይህን በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ Βηθλέεμ
  choice: ከቤተልሔም
  rationale: ἀπό የመነሻ ወይም የመገኛ ቦታ ምንጭን ያመለክታል፤ ‘ከቤተልሔም’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τῆς κώμης
  choice: መንደር
  rationale: κώμη ከተማን ሳይሆን ትንሽ ሰፈር ወይም መንደር ያመለክታል፤ ‘መንደር’ የቃሉን ልዩነት ይጠብቃል።
- source_word: ὅπου ἦν Δαυίδ
  choice: ዳዊት ከነበረባት
  rationale: የግሪኩን ‘ዳዊት በነበረበት’ ቀላልና ያልተብራራ አገላለጽ ይጠብቃል፤ ‘የተወለደባት’ ወይም ‘የመጣባት’ የሚል ትርጓሜ አይጨምርም።
- source_word: ἔρχεται
  choice: ይመጣል
  rationale: የአሁን ጊዜው ግስ በመጽሐፋዊ ተስፋ ውስጥ የመሲሑን መገኛ የሚገልጽ ሲሆን ‘ይመጣል’ ይህን በቀጥታ ያስተላልፋል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: በዚህ የአይሁድ የተስፋ ንጉሥ ውይይት ውስጥ Χριστός እንደ ማዕረግ ይሠራል፤ ‘መሲሑ’ የተቀባውን የተስፋ አዳኝ ማዕረግ በግልጽ ያሳያል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ ቃሉ እንደ ስም ሳይሆን ሕዝቡ ስለሚጠብቀው የዳዊት ዘር ንጉሥ ማዕረግ ነው። ‘መሲሑ’ ይህን ተግባር ያሳያል፤ ‘ክርስቶስ’ ግን በአማርኛ ብዙ ጊዜ እንደ ስም ሊሰማ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመነሻው አሉታዊ የንግግር ጥያቄ ቅርጽ ተጠብቋል፤ ὅπου ἦν Δαυίδ ከሚለው በላይ ዳዊት በዚያ ተወለደ ወይም ከዚያ መጣ የሚል ማብራሪያ አልተጨመረም።
