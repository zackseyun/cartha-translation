review_pass:
  verdict: revise
  source_fidelity: The draft retains the rhetorical negative question, Davidic descent, Bethlehem as a village, and the deliberately non-expanded statement that David ‘was’ there. However, its compressed word order makes the two source phrases governed by ‘comes’ less clear in Amharic.
  naturalness: The wording is understandable, but “ከዳዊት ዘርና ... ከቤተልሔም ይመጣል” is syntactically cramped. Recasting the content clause with “እንደሚመጣ” is natural modern standard Amharic and clearly scopes both origins.
  terminology: “መሲሑ” appropriately renders ὁ χριστός as a title in this Jewish messianic discussion. “መጽሐፍ” is acceptable for ἡ γραφή in this context; no doctrinally loaded expansion is introduced.
  issues:
  - severity: medium
    issue: The coordination and word order obscure the two coordinated origins of the Messiah.
    rationale: The Greek states that the Messiah comes both from David’s offspring and from Bethlehem, with Bethlehem further identified as the village where David was. In the draft, the sequence “ከዳዊት ዘርና ... ከቤተልሔም ይመጣል” is compressed and can momentarily attach the locality awkwardly. An explicit content clause provides clear, idiomatic scope without adding interpretation.
  revised_text: “መጽሐፍ መሲሑ ከዳዊት ዘር እንዲሁም ዳዊት ከነበረባት መንደር ከቤተልሔም እንደሚመጣ አላለምን?”
