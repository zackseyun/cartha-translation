- source_word: ἐὰν μὴ
  choice: ሳይ…
  rationale: በአማርኛ የአሉታዊ ሁኔታ ተውሳክ የሆነው ‘ሳይ…’ በግሪኩ ‘ካልሆነ በቀር’ የሚለውን አስፈላጊ ቅድመ ሁኔታ በተፈጥሯዊነት ያሳያል።
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: አስቀድሞ ከእርሱ ሳይሰማ
