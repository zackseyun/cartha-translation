- source_word: ὁ νόμος ἡμῶν
  choice: ሕጋችን
  rationale: የባለቤትነት ቅጥያው ‘የእኛን ሕግ’ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ሐረጉ የሙሴን መጻሕፍት ብቻ እንዲያመለክት አያጥብም።
- source_word: κρίνει
