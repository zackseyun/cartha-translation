review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the unspecified subset (τινὲς ἐξ αὐτῶν), their intention to seize Jesus (ἤθελον πιάσαι αὐτόν), and the contrast that no one acted (ἀλλ’ οὐδείς). The final Amharic idiom, however, needs adjustment: እጁን አልጫነበትም is less natural and can suggest merely pressing a hand on him rather than the Greek expression for laying hold of someone.'
  naturalness: ከእነርሱም አንዳንዶቹ is natural and clear. Recasting the final clause as ማንም እጁን በእርሱ ላይ አላኖረም gives a more idiomatic, clear modern-Amharic equivalent of ‘laid hands on him.’
  terminology: ሊይዙት appropriately retains the broad, literal sense of πιάσαι without prematurely specifying arrest. The footnote ወይም፣ «ሊያስሩት» appropriately supplies the contextual alternative. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The expression እጁን አልጫነበትም is not the clearest natural equivalent for ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
    rationale: The Greek idiom means to lay hands on or take hold of someone. Adding በእርሱ ላይ and using አላኖረም more directly expresses the physical gesture in standard Amharic.
  revised_text: ከእነርሱም አንዳንዶቹ ሊይዙት[a] ፈለጉ፤ ነገር ግን ማንም እጁን በእርሱ ላይ አላኖረም።
  revised_footnotes:
