  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: am
  text: ከእነርሱም አንዳንዶቹ ሊይዙት[a] ፈለጉ፤ ነገር ግን ማንም እጁን በእርሱ ላይ አላኖረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሊያስሩት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: ከእነርሱም አንዳንዶቹ
  rationale: τινὲς የቡድኑን ያልተወሰነ ክፍል ያመለክታል፤ ἐξ αὐτῶν ደግሞ ‘ከእነርሱ መካከል’ የሚለውን ሐሳብ ይሰጣል። ይህ አገላለጽ በተፈጥሯዊ አማርኛ ሁለቱንም ይጠብቃል፤ δὲ በ‘ም’ ከዐውደ ንባቡ ጋር ተያይዟል።
- source_word: ἤθελον
  choice: ፈለጉ
  rationale: ያለፈ ጊዜ ፍላጎታቸውንና ዓላማቸውን በግልጽ ዘመናዊ አማርኛ ያሳያል፤ የግሪኩን ኢምፐርፌክት አላስፈላጊ በሆነ ማብራሪያ አይጫንም።
- source_word: πιάσαι
  choice: ሊይዙት
  rationale: πιάζω በመሠረቱ በኃይል መያዝን ያመለክታል፤ በዐውደ ንባቡ የማሰር ዓላማ ሊኖረው ቢችልም ‘ሊይዙት’ ሰፊውን የቃሉን ትርጉም ይጠብቃል።
- source_word: ἀλλ’ οὐδεὶς
  choice: ነገር ግን ማንም…አል-
  rationale: በፍላጎታቸውና ባልተፈጸመው ውጤት መካከል ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ የአማርኛ አሉታዊ አወቃቀር ያቀርባል።
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: እጁን አልጫነበትም
  rationale: የግሪኩን ‘እጆችን በእርሱ ላይ መጣል’ ፈሊጣዊ አገላለጽ በአማርኛ የጠላትነት መያዝን በሚያመለክት የተለመደ አገላለጽ ያስተላልፋል። ‘እጁን’ ከ‘ማንም’ ጋር የሚስማማ ነጠላ ቅርጽ ነው።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ἐξ αὐτῶν በ‘ከእነርሱም አንዳንዶቹ’ ውስጥ በግልጽ ስለተካተተ የተለየ ማስታወሻ አላስፈለገውም፤ πιάσαι ግን በዐውደ ንባቡ ‘ማሰር’ ሊሆን ስለሚችል የቃል አማራጭ በእግር ማስታወሻ ቀርቧል።
