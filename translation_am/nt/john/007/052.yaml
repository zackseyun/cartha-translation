  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: am
  text: 'እነርሱም መልሰው እንዲህ አሉት፦ “አንተም ከገሊላ ነህ እንዴ?[a] መርምርና እይ፤ ከገሊላ ነቢይ አይነሣም።[b]”


    [a] ወይም፣ “አንተም ከገሊላ ነህ ወይ?” የግሪክኛው ጥያቄ አሉታዊ መልስ እንደሚጠበቅ ያመለክታል።


    [b] ወይም፣ “እግዚአብሔር ነቢይን ከገሊላ አያስነሣም።” ግሱ ነቢይ መገለጡን ወይም እግዚአብሔር ነቢይን ማስነሣቱን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንተም ከገሊላ ነህ ወይ?” የግሪክኛው ጥያቄ አሉታዊ መልስ እንደሚጠበቅ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እግዚአብሔር ነቢይን ከገሊላ አያስነሣም።” ግሱ ነቢይ መገለጡን ወይም እግዚአብሔር ነቢይን ማስነሣቱን ሊያመለክት ይችላል።
    reason: lexical_alternative
