  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: am
  text: የአይሁድ በዓል የሆነው የዳስ በዓል[a] ቀርቦ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፣ «የዳሶች በዓል»።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ያለ ተለይቶ የተተረጎመ አገናኝ
  rationale: ይህ ቀላል የትረካ አገናኝ ነው፤ በአማርኛ ዐረፍተ ነገሩን በ«እንግዲህ» ወይም «ነገር ግን» መጀመር ያልተገባ ጊዜያዊነትን ወይም ተቃርኖን ሊያጎላ ስለሚችል በተፈጥሯዊው የትረካ ፍሰት ተወክሏል።
- source_word: ἐγγὺς
  choice: ቀርቦ ነበር
  rationale: በዚህ አውድ የጊዜ ቅርበትን በግልጽና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἑορτὴ
  choice: በዓል
  rationale: የሃይማኖታዊ በዓልን ወይም የበዓል ክብረ በዓልን በዘመናዊ አማርኛ በተለመደ መንገድ ያመለክታል።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ … የሆነው
  rationale: ይህ ሐረግ በዓሉ የአይሁድ በዓል መሆኑን ይገልጻል፤ በዚህ አውድ የተቃውሞ ትርጉም አይጨምርም።
- source_word: σκηνοπηγία
  choice: የዳስ በዓል
  rationale: ቃሉ ከጊዜያዊ ዳሶች ጋር የተያያዘውን በዓል ይሰይማል፤ «ዳስ» በአማርኛ የቃሉን ትርጉም በግልጽና በተለመደ መንገድ ያቀርባል።
theological_decisions:
- issue: በበዓል ስያሜ ውስጥ τῶν Ἰουδαίων የሚለውን መተርጎም
  choice: የአይሁድ በዓል የሆነው
  alternative: የአይሁድ በዓል
  rationale: ሐረጉ የበዓሉን ሕዝባዊና ሃይማኖታዊ መለያ ይገልጻል እንጂ በአይሁድ ላይ የተቃውሞ አቋም አይገልጽም።
- issue: σκηνοπηγία የሚለውን የበዓል ስም መስጠት
  choice: የዳስ በዓል
  alternative: የዳሶች በዓል
  rationale: «የዳስ በዓል» በአማርኛ ግልጽና ተፈጥሯዊ ሲሆን የግሪኩን ቃል ታሪካዊ ይዘት ይጠብቃል፤ የብዙ ቁጥር አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዐረፍተ ነገሩ አወቃቀር ἡ ἑορτὴ … ἡ σκηνοπηγία ያለውን አብራሪ ስያሜ በተፈጥሯዊ አማርኛ ያሳያል።
