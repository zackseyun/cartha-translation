  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: am
  text: ይህን የተናገረው፣ በእርሱ ያመኑት ሊቀበሉት ስለነበር መንፈስ[a] ነበር፤ መንፈስ ገና አልነበረም[b]ና፣ ኢየሱስ ገና አልከበረም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ‘መንፈስ’ የሚለው መንፈስ ቅዱስን ያመለክታል፤ በግሪኩ ግን ‘ቅዱስ’ የሚለው ቃል የለም።
    reason: clarification
  - marker: b
    text: ወይም ትርጉሙን ይበልጥ ግልጽ በማድረግ፣ ‘መንፈስ ገና አልተሰጠም ነበር።’ ግሪኩ በቀጥታ ‘መንፈስ ገና አልነበረም’ ይላል፤ ይህንም ኢየሱስ ገና ካለመክበሩ ጋር ያያይዘዋል።
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: መንፈስ
  rationale: በዐውዱ አማኞች የሚቀበሉትን መለኮታዊ መንፈስ ያመለክታል። ‘መንፈስ ቅዱስ’ ማለት በዐውዱ ትክክል ቢሆንም በግሪኩ ἅγιον የለም።
- source_word: οὗ
  choice: ሊቀበሉት
  rationale: የአማርኛው የተሳቢ ቅጥያ ‘-ት’ ወደ ‘መንፈስ’ በግልጽ ሁኔታ ይመለሳል፤ የግሪኩን ዝምድና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔμελλον λαμβάνειν
  choice: ሊቀበሉት ስላላቸው
  rationale: μέλλω ከግስ ስም ጋር ያለውን ወደፊት የሚፈጸም ነገር በተፈጥሯዊ አማርኛ ያሳያል፤ የግድ ዕጣ ፈንታን አይጨምርም።
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: በእርሱ ያመኑት
  rationale: የዮሐንስን πιστεύω εἰς አገባብ በተለመደውና ግልጽ በሆነው ‘በእርሱ ማመን’ ይገልጣል፤ ያልተጠየቀ የቀደመ ጊዜ አይጨምርም።
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: መንፈስ ገና አልነበረምና
  rationale: የግሪኩን አጭርና ከባድ አነጋገር በቅርብ ይጠብቃል፤ ‘ገና አልተሰጠም’ የሚለውን በግሪኩ የሌለ ግስ ወደ ዋናው ጽሑፍ አያስገባም።
- source_word: οὐδέπω ἐδοξάσθη
  choice: ገና አልከበረም ነበር
  rationale: የድርጊቱን አለመፈጸምና ከትረካው ጊዜ ጋር ያለውን ቀደምት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐδοξάσθη
  choice: አልከበረም
  rationale: በዮሐንስ ውስጥ ያለውን የኢየሱስ መክበር ጭብጥ ይጠብቃል፤ ቃሉን ወደ አንድ የሞት፣ የትንሣኤ ወይም የእርገት ደረጃ ብቻ አያጠብበውም።
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμα የሚለውን፣ መንፈስ ከኢየሱስ መክበር በፊት በህልውና አልነበረም እንደሚል ሳያስመስል እንዴት ማቅረብ እንደሚገባ
  choice: በዋናው ጽሑፍ ‘መንፈስ ገና አልነበረም’ በማለት የምንጩን ውጥረት ማቆየት፣ የተለመደውን ማብራሪያ በግርጌ ማስታወሻ መስጠት
  alternative: ‘መንፈስ ገና አልተሰጠም ነበር’ ወይም ‘መንፈስ ገና አልተገለጠም ነበር’
  rationale: ግሪኩ ‘ተሰጠ’ ወይም ‘ተገኘ’ አይልም፤ መንፈስ ‘ገና አልነበረም’ ብሎ ከኢየሱስ አለመክበር ጋር ያያይዘዋል። ስለዚህ የምንጩ የሥነ መለኮት ውጥረት በዋናው ጽሑፍ ተጠብቆ፣ ሊሆን የሚችለው ትርጉም በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አስቸጋሪ አነጋገር ሆን ተብሎ በዋናው ጽሑፍ ተጠብቋል።
