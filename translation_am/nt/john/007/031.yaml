language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: am
  text: ነገር ግን ከሕዝቡ ብዙዎች በእርሱ አመኑ፤ እንዲህም ይሉ ነበር፦ “መሲሑ[a] ሲመጣ፣ ይህ ሰው ካደረጋቸው ይበልጥ ብዙ ምልክቶችን አያደርግም፣ አይደል?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶሱ»። የግሪኩ Χριστός በዚህ የአይሁድ መሲሐዊ አውድ እንደ ማዕረግ ስለተጠቀሰ «መሲሕ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: ነገር ግን ከሕዝቡ ብዙዎች
  rationale: «ከሕዝቡ» ከትልቁ ሕዝብ የተለዩ ብዙ ሰዎችን የሚያመለክተውን ከፊላዊ ትርጉም ይጠብቃል፤ «ነገር ግን» ደግሞ δὲ በአውዱ ያለውን ቀላል ንፅፅር ያሳያል።
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: በእርሱ አመኑ
  rationale: ወደ ኢየሱስ የተመራውን የግል እምነት በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሱን ያልተጠናቀቀ፣ ቀጣይ ወይም ተደጋጋሚ አነጋገር ይጠብቃል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: ቃሉ በዚህ ስፍራ እንደ መጠሪያ ስም ሳይሆን በአይሁድ የመሲሕ ተስፋ አውድ ውስጥ እንደ ማዕረግ ተጠቅሟል፤ የግሪኩን ወሳኝ አመልካች ደግሞ የአማርኛው «-ሁ» ይወክላል።
- source_word: ὅταν ἔλθῃ
  choice: ሲመጣ
  rationale: ወደፊት ስለሚጠበቅ መምጣት በአማርኛ ተፈጥሯዊ ሁኔታ ይገልጻል፤ ጽሑፉን ወደ «ቢመጣ» የሚል ጥርጣሬ አይለውጠውም።
- source_word: πλείονα σημεῖα
  choice: ይበልጥ ብዙ ምልክቶችን
  rationale: πλείονα በዋናነት የቁጥር ብዛትን ስለሚያነጻጽር «ይበልጥ ብዙ» ተብሏል፤ «ታላላቅ» ቢባል የጥራት ንፅፅርን ሊያስገባ ይችላል። «ምልክቶች» የዮሐንስን ልዩ የምልክት ቃላት ይጠብቃል።
- source_word: οὗτος ἐποίησεν
  choice: ይህ ሰው ካደረጋቸው
  rationale: οὗτος በሕዝቡ ንግግር ኢየሱስን በቀጥታ ያመለክታል፤ «ይህ ሰው» በዘመናዊ አማርኛ ተፈጥሯዊ ነው። የተፈጸሙት ምልክቶች አሁን ለንፅፅሩ መሠረት መሆናቸውን አወቃቀሩ ያሳያል።
theological_decisions:
- issue: Χριστός እንደ ማዕረግ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶሱ
  rationale: አገባቡ «ሲመጣ» ከሚለው የአይሁድ ተስፋ ጋር የተያያዘ የመሲሕ ማዕረግ መሆኑን ያሳያል። ስለዚህ «መሲሑ» በዋናው ጽሑፍ ገብቶ፣ ቀጥተኛው የግሪክ ቅርጽ «ክርስቶስ» በማስታወሻ ተጠብቋል።
- issue: μή ባለበት ጥያቄ የሚጠበቀው አሉታዊ መልስ
  choice: አያደርግም፣ አይደል?
  alternative: ያደርግ ይሆን?
  rationale: μή ጥያቄው «አይደለም» የሚል መልስ እንደሚጠብቅ ያመለክታል። የአማርኛው አሉታዊ አረፍተ ነገርና «አይደል?» የሚለው አጭር ጥያቄ ይህን ኃይል ይጠብቃሉ፤ ሕዝቡ ስለ ኢየሱስ ማንነት ያለውን ውጥረት ግን በቀጥታ አይፈቱም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ይሉ ነበር» የቀጣይ ንግግርን፣ «አያደርግም፣ አይደል?» ደግሞ ተፈጥሯዊ የንግግር ጥያቄን ያሳያሉ።
