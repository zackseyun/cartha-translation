  revision_rationale: The revision preserves the Greek's public/open speech, the unqualified “say nothing to him,” and the tentative question. It improves the natural Amharic verbal form and replaces the mismatched footnote with an anchored alternative that faithfully tracks the POB audit trail while retaining መሲሑ in the main text.
