id: JHN.7.26
reference: John 7:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: am
  text: እነሆ፣ በግልጽ ይናገራል፤ እነርሱም ምንም አይሉትም። ባለሥልጣናቱ ይህ ሰው መሲሑ[a] እንደሆነ በእውነት ያውቁ ይሆን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።”
    reason: χριστός የሚለው ቃል እንደ ማዕረግ “መሲሑ” ተተርጉሟል፤ “ክርስቶስ” የሚለው ተለምዶ የተጠቀመ ተለዋጭ አገላለጽ ነው።
lexical_decisions:
- source_word: ἴδε
  choice: እነሆ
  rationale: ተናጋሪው የአድማጮቹን ትኩረት ወደሚታየው ነገር የሚጠራበትን ኃይል በአጭርና በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያስተላልፋል።
- source_word: παρρησίᾳ
  choice: በግልጽ
  rationale: በዐውዱ ውስጥ በይፋና ሳይደብቅ መናገሩን ያሳያል፤ ‘በድፍረት’ ማለት ቃሉ ከሚያስገድደው በላይ ድፍረትን ሊያጎላ ይችላል።
- source_word: λαλεῖ
  choice: ይናገራል
  rationale: በዚያው ጊዜ እየተካሄደ ያለውን ንግግር በተፈጥሯዊ የአማርኛ አሁን ጊዜ ያቀርባል።
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: ምንም አይሉትም
  rationale: የግሪኩን ‘ምንም አይናገሩትም’ የሚለውን ቀጥተኛ ትርጉም ይጠብቃል፤ በግልጽ ያልተባለውን ‘አይቃወሙትም’ የሚል ትርጓሜ አያስገባም።
- source_word: μήποτε
  choice: … ይሆን?
  rationale: ጥያቄው ያለውን መደነቅና ጥርጣሬ በተፈጥሯዊ አማርኛ ይገልጣል፤ ፍጹም እምቢታን አያስገባም።
- source_word: ἀληθῶς
  choice: በእውነት
  rationale: ባለሥልጣናቱ በእርግጥ አውቀው ይሆን የሚለውን አጽንዖት በክብር ያለውና ተፈጥሯዊ ቋንቋ ያስተላልፋል።
- source_word: ἔγνωσαν
  choice: አውቀው
  rationale: የግሪኩ የተፈጸመ ግስ ወደ እውቀት መድረስን ሊያመለክት ቢችልም፣ ከ‘ይሆን?’ ጋር ያለው አገላለጽ ውጤታዊውን ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ ἄρχοντες
  choice: ባለሥልጣናቱ
  rationale: በዐውዱ ያሉትን የአይሁድ የአስተዳደርና የሃይማኖት ሥልጣን ያላቸውን መሪዎች ያመለክታል፤ ‘ገዢዎች’ የፖለቲካ አገዛዝን ብቻ ሊያስታውስ ይችላል።
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: ይህ ሰው መሲሑ እንደሆነ
  rationale: οὗτοςን በተፈጥሯዊ አማርኛ ‘ይህ ሰው’ ብሎ ያቀርባል፤ χριστόςን በዚህ የአይሁድ የመጠባበቅ ዐውድ እንደ ማዕረግ ‘መሲሑ’ ብሎ ይተረጉማል።
theological_decisions:
- issue: ὁ χριστός እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ዐውድ ሕዝቡ ስለሚጠበቀው ቅቡዕ ንጉሥና አዳኝ ማንነት እየጠየቀ ስለሆነ χριστός እንደ ስም ሳይሆን እንደ መሲሐዊ ማዕረግ ተተርጉሟል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር ንግግሮቹና የመደነቅ ጥያቄው የብዙዎቹን ድንገተኛ ምልከታ እንዲያሰሙ ተጠብቀዋል።
