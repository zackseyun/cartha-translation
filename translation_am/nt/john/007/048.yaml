  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: am
  text: ከአለቆቹ ወይም ከፈሪሳውያን መካከል አንድም ሰው በእርሱ አምኗልን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ጥያቄው የተቀረጸበት መንገድ፣ ‘አይደለም’ የሚል መልስ እንደሚጠበቅ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: አንድም ሰው ... አምኗልን?
  rationale: የግሪክኛውን የአይደለም መልስ የሚጠብቅ የአጠያየቅ ኃይል ሙሉ በሙሉ ወደ ግልጽ ክህደት ሳይቀይር፣ በተፈጥሯዊ የአማርኛ ጥያቄ አቀራረብ ያቆያል።
- source_word: ἐκ τῶν ἀρχόντων
  choice: ከአለቆቹ ... መካከል
  rationale: በዚህ አውድ ἄρχοντες የታወቁትን የአይሁድ ገዢ ባለሥልጣናት ያመለክታል፤ ‘አለቆቹ’ አጭር፣ ክቡርና ከአውዱ ጋር የሚስማማ ነው።
- source_word: ἐπίστευσεν
  choice: አምኗል
  rationale: አዎርስት ግሱን በተፈጥሯዊ የአማርኛ ፍጹም ጊዜ ይገልጣል፤ የπιστεύωንም መደበኛ ትርጉም ይጠብቃል።
- source_word: εἰς αὐτόν
  choice: በእርሱ
  rationale: ከ‘ማመን’ ጋር ተፈጥሯዊ በሆነ አማርኛ የዮሐንስን πιστεύω εἰς፣ ‘በእርሱ ማመን’ የሚለውን ግንኙነት ያስተላልፋል።
- source_word: ἢ
  choice: ወይም
  rationale: ሁለቱን ቡድኖች ያለ ተጨማሪ ትርጓሜ በቀላሉ ያስተባብራል።
- source_word: ἐκ τῶν Φαρισαίων
  choice: ከፈሪሳውያን መካከል
  rationale: በቡድኑ ውስጥ አባል መሆንን የሚያመለክተውን ἐκ ይጠብቃል፤ ‘ፈሪሳውያን’ ደግሞ የቡድኑ የተለመደ ስም ነው።
theological_decisions:
- issue: አሉታዊ መልስ የሚጠብቀው የንግግሩ ኃይል
  choice: ‘አይደለም’ የሚል መልስ እንደሚጠበቅ እያመለከተ ንግግሩን በጥያቄ መልክ ማቆየት
  alternative: ‘ከአለቆቹም ሆነ ከፈሪሳውያን አንድም ሰው በእርሱ አላመነም’ ብሎ እንደ ግልጽ ክህደት መተርጎም
  rationale: μή τις ተናጋሪዎቹ ‘አይደለም’ የሚል መልስ እንደሚጠብቁ ያሳያል፤ ሆኖም የግሪክኛው ጽሑፍ ጥያቄ ነው። ይህን መልክ ማቆየት የተናጋሪዎቹን ንቀት ሳያጋንን ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አለቆቹ’ የገዢነትን ማኅበራዊ ሚና ያሳያል፤ ‘መካከል’ ደግሞ የቡድን አባልነትን በተፈጥሯዊ አማርኛ ይገልጣል።
