  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: am
  text: በበዓሉም የመጨረሻውና ታላቁ ቀን ላይ፣ ኢየሱስ ቆሞ ጮክ ብሎ፣ “ማንም የተጠማ ቢኖር ወደ እኔ ይምጣና ይጠጣ” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς
  choice: በበዓሉም የመጨረሻውና ታላቁ ቀን
  rationale: የጊዜውን አገባብ፣ የδέን ቀላል አያያዥነት፣ እንዲሁም ያ ቀን የበዓሉ የመጨረሻውና ታላቁ ቀን መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: ኢየሱስ ቆሞ
  rationale: የἵστημιን የቆመ አቋም በአጭርና ተፈጥሯዊ የትረካ አገላለጽ ይጠብቃል።
- source_word: ἔκραξεν λέγων
  choice: ጮክ ብሎ … አለ
  rationale: የκράζωን ከፍ ያለና ይፋዊ ጥሪ ሳያለዝብ በዘመናዊ አማርኛ በተፈጥሮ ያቀርባል።
- source_word: Ἐάν τις διψᾷ
  choice: ማንም የተጠማ ቢኖር
  rationale: τιςን እንደ አጠቃላይና ያልተወሰነ ግለሰብ ያቀርባል፤ የጥማትንም ምስላዊ ክፍትነት ሳይተረጉም ይጠብቃል።
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: ወደ እኔ ይምጣና ይጠጣ
  rationale: ሁለቱን የአሁን ጊዜ ትእዛዛዊ ቅርጾች እንደ ግብዣና ጥሪ በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የጥማትና የመጠጣት ምስላዊ ትርጉም
  choice: “የተጠማ” እና “ይጠጣ” ተብሎ ምስሉ በቀጥታ ተጠብቋል።
  alternative: ጥማቱን እንደ መንፈሳዊ ናፍቆት፣ መጠጣቱንም እንደ ማመን ወይም መንፈስን መቀበል በዋናው ጽሑፍ መተርጎም።
  rationale: ጥቅሱ ራሱ ምስላዊ ግብዣውን ክፍት አድርጎ ያቀርባል፤ ስለዚህ አብራሪ ሥነ መለኮታዊ ትርጉም በጽሑፉ ውስጥ አልተጨመረም።
- issue: የτις አጠቃላይ ነጠላ አገላለጽ
  choice: “ማንም … ቢኖር … ይምጣና ይጠጣ” የሚለው ተፈጥሯዊ አማርኛ ተመርጧል።
  alternative: ወንድን ብቻ የሚያመለክት ስም ወይም ተውላጠ ስም መጨመር።
  rationale: የግሪኩ አገላለጽ በሰዋሰው ነጠላ ቢሆንም ማንኛውንም ሰው የሚያካትት ነው፤ የአማርኛው አገላለጽም ነጠላውንና አጠቃላይነቱን ያለ ተጨማሪ ማብራሪያ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ጮክ ብሎ” የንግግሩን ኃይል ይጠብቃል፤ “ይምጣና ይጠጣ” ደግሞ ጥሪውን በተፈጥሯዊ አገባብ ያቀርባል። የእንግሊዝኛው ማስታወሻ የእንግሊዝኛ ጾታዊ ተውላጠ ስም ችግርን ብቻ ስለሚመለከትና በአማርኛው አገላለጽ ያ ችግር ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
