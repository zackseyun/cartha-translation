  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: am
  text: እንግዲህ ከኢየሩሳሌም ነዋሪዎች አንዳንዶቹ፣ “ይህ ሰው ሊገድሉት የሚፈልጉት አይደለምን?” ይሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: ይሉ ነበር
  rationale: የግስ ያልተፈጸመ የአለፈ ጊዜ አቀራረብ በትዕይንቱ ውስጥ ቀጣይ ወይም ተደጋጋሚ ንግግርን ያመለክታል፤ ‘ይሉ ነበር’ ይህን ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው አውድ ጋር ያለውን ትረካዊና ምክንያታዊ ትስስር ያሳያል።
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: ከኢየሩሳሌም ነዋሪዎች አንዳንዶቹ
  rationale: ἐκ የሚያሳየውን ‘ከመካከላቸው’ የሚል ከፊል ቡድን ትርጉም ጠብቆ፣ Ἱεροσολυμῖταιን እንደ ከተማዪቱ ነዋሪዎች በግልጽ ይገልጻል።
- source_word: Οὐχ οὗτός ἐστιν
  choice: ይህን ሰው አይደለምን?
  rationale: Οὐχ አዎንታዊ መልስ የሚጠብቅ ጥያቄ ያስገባል፤ ‘አይደለምን?’ ይህን የንግግር ኃይል ይጠብቃል። ‘ሰው’ በአማርኛ ለግልጽነት ተጨምሯል።
- source_word: ζητοῦσιν ἀποκτεῖναι
  choice: ሊገድሉት የሚፈልጉት
  rationale: አሁን ያለውን ቀጣይ ዓላማ እና የመግደል ግልጽ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
