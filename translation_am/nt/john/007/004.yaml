  - severity: medium
    issue: ‘አንዳችን’ does not correctly render the indefinite pronoun τι.
    rationale: The Greek means ‘anything/something.’ Modern standard Amharic requires ‘አንዳች ነገር’ (or an equivalent), not ‘አንዳችን.’
