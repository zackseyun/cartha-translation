  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the contrast between acting secretly and seeking public openness, the conditional statement, the imperative, and κόσμος as ‘ዓለም.’ However, ‘አንዳችን’ is not the appropriate form for the indefinite object τι; it reads as a malformed or unintended expression rather than ‘anything.’
  naturalness: Apart from that form, the sentence is clear and modern. Reordering ‘በስውር’ before the object yields a more natural Amharic flow while retaining the Greek contrast.
  terminology: ‘በግልጽ መታወቅን’ appropriately expresses public/open recognition in this context, and ‘ለዓለም’ preserves the Johannine term κόσμος. ‘ራስህን … ግለጥ’ is a suitable direct rendering of the imperative.
