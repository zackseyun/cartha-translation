  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: am
  text: ማንም በግልጽ መታወቅን እየፈለገ በስውር አንዳች ነገር አያደርግምና። እነዚህን ነገሮች የምታደርግ ከሆነ፣ ራስህን ለዓለም ግለጥ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: ማንም … አያደርግምና
  rationale: የአጠቃላይ አሉታዊውን አነጋገርና ከቀደመው ሐሳብ ጋር ያለውን የምክንያት ግንኙነት በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: አንዳችን በስውር አያደርግም
  rationale: τι የሚያመለክተውን ያልተወሰነ ነገር ‘አንዳችን’ ብሎ፣ ἐν κρυπτῷ የሚያመለክተውን ስውርነት ‘በስውር’ ብሎ በቀጥታ ይጠብቃል።
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: በግልጽ መታወቅን እየፈለገ
  rationale: ζητεῖ የዓላማ ፍለጋን ያሳያል፤ ἐν παρρησίᾳ በዚህ አውድ የሕዝብ ፊት ግልጽ መሆንን ያመለክታል። αὐτός ያለው አጽንዖት በአረፍተ ነገሩ ንፅፅር ውስጥ በተፈጥሮ ተካትቷል።
- source_word: εἰ ταῦτα ποιεῖς
  choice: እነዚህን ነገሮች የምታደርግ ከሆነ
  rationale: ሁኔታዊውን አነጋገር ሳይፈታ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: φανέρωσον σεαυτὸν
  choice: ራስህን … ግለጥ
  rationale: የቆራጥ ትእዛዙንና ራስን በይፋ የማሳየት ሐሳብ በቀጥታ ያስተላልፋል።
- source_word: τῷ κόσμῳ
  choice: ለዓለም
  rationale: የዮሐንስን ቁልፍ ቃል ‘ዓለም’ እንዳለ ይጠብቃል፤ በአውዱም የሕዝብን ፊት ማመልከት ይችላል።
theological_decisions:
- issue: በዮሐንስ አውድ የκόσμος ትርጉም
  choice: ዓለም
  alternative: ሕዝብ / ሁሉም ሰው
  rationale: ቅርብ አውዱ በይፋ ስለመታየት ቢናገርም፣ ‘ዓለም’ የዮሐንስን ሥነ ጽሑፋዊና ሥነ መለኮታዊ ቃል ያለ ትርጓሜያዊ ማጥበብ ይጠብቃል።
- issue: ἐν παρρησίᾳ εἶναι የሚያመለክተው ግልጽነት
  choice: በግልጽ መታወቅ
  alternative: በሕዝብ ፊት መሆን / በይፋ መሆን
  rationale: በዚህ ቦታ የንግግር ድፍረትን ሳይሆን ለሕዝብ የተገለጠ መሆንን ያመለክታል፤ ‘በግልጽ መታወቅ’ ይህን በተፈጥሯዊ አማርኛ ይይዛል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩን ምክንያታዊ ግንኙነት፣ በስውርና በግልጽ መካከል ያለውን ንፅፅር፣ እንዲሁም የመጨረሻውን ቀጥተኛ ትእዛዝ ተጠብቋል።
