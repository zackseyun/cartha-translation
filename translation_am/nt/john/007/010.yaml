    issue: The phrase "በስውር እንደሆነ ሆኖ ነበር" is grammatically and semantically defective.
    rationale: It reads roughly as “being as though it was in secret,” leaves the action insufficiently specified, and introduces an unnecessary stative ending. The Greek adverbial phrase modifies Jesus’ going up.
  - severity: medium
    issue: The footnote’s literal explanation is based on the defective Amharic rendering.
    rationale: It should explain ὡς as a qualifier of the concealed manner of travel, rather than present "በስውር እንደሆነ" as a usable literal equivalent.
