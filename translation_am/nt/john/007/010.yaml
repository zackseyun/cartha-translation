  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ὡς ያለውን ጥንቃቄ ለማቆየት ትንሽ መደበኛ ያልሆነ ግን ሊገባ የሚችል አገላለጽ ተመርጧል።
