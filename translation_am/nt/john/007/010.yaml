    text: ወይም፣ “በስውር ወጣ።” የግሪኩ አገላለጽ ቃል በቃል “በስውር እንደሆነ” የሚል ሲሆን፣ ይህም በስውር መውጣቱን በጥቂቱ ሊያለዝብ ይችላል።
