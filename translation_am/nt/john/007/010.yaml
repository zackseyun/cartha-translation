lexical_decisions:
- source_word: Ὡς δὲ
  choice: ነገር ግን ... ከወጡ በኋላ
  rationale: ὡς ከአኦሪስት ግስ ጋር የጊዜ ቅደም ተከተልን ያሳያል፤ δέ ደግሞ ቀላል ንጽጽርን ወይም የትረካ ሽግግርን ይገልጣል።
- source_word: ἀνέβησαν ... ἀνέβη
  choice: ከወጡ ... ወጣ
  rationale: ἀναβαίνω ቃል በቃል ‘ወደ ላይ መውጣት’ ማለት ሲሆን፣ ወደ ኢየሩሳሌም ስለሚደረግ ጉዞም የተለመደ አገላለጽ ነው። የመጀመሪያው ግስ በጊዜ ንዑስ አረፍተ ነገር ተተርጉሞ ቅደም ተከተሉን ያሳያል።
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ወንድሞቹ
  rationale: በአቅራቢያው ዐውደ ንባብ ἀδελφοί የኢየሱስን ወንድሞች ያመለክታል፤ ጾታን ያላጠቃለለ ግልጽ አተረጓጎም ተመርጧል።
- source_word: εἰς τὴν ἑορτήν
  choice: ወደ በዓሉ
  rationale: ἑορτή በዐውደ ንባቡ የዳስ በዓልን ያመለክታል፤ ‘በዓል’ በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τότε καὶ αὐτὸς
  choice: እርሱም
  rationale: καὶ αὐτός ኢየሱስም እንደ ወንድሞቹ መውጣቱን የሚያክል አጽንዖት አለው፤ τότε የሚያሳየው ቅደም ተከተል ‘ከወጡ በኋላ’ በሚለው አወቃቀር በቂ ሁኔታ ተገልጧል።
- source_word: οὐ φανερῶς
  choice: በግልጽ ሳይሆን
  rationale: φανερῶς በግልጽ ወይም በአደባባይ ማለት ነው፤ ‘በግልጽ ሳይሆን’ የተከታዩን ንጽጽር በቅርብ ይጠብቃል።
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: በስውር እንደሆነ ሆኖ
  rationale: ὡς ያለውን ትንሽ ማለዘቢያ ለመጠበቅ ‘በስውር’ ብቻ አልተባለም፤ የግሪኩን ‘እንደ/እንደሆነ’ ንጥረ ሐሳብ የሚያሳይ አገላለጽ ተመርጧል።
theological_decisions:
- issue: ኢየሱስ ቀደም ሲል ወደ በዓሉ እንደማይወጣ ከተናገረው ጋር የዚህ ድርጊት ግንኙነት
