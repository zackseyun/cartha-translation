  text: ነገር ግን ወንድሞቹ ወደ በዓሉ ከወጡ በኋላ፣ እርሱም ወጣ፤ በግልጽ ሳይሆን፣ ሰውሮ ይመስል ወጣ[a]።
  philosophy: optimal-equivalence
  footnotes:
