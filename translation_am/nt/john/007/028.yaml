- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢ ሊያመለክት ይችላል፤ ይህ አገላለጽ በአማርኛ የተለመደና ሰፊ ነው።
- source_word: διδάσκων … καὶ λέγων
  choice: ሲያስተምር … እንዲህ አለ
  rationale: ንግግሩ በማስተማር ላይ እያለ መነገሩን በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል።
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: እኔን ታውቁኛላችሁ፤ … ታውቃላችሁ
  rationale: በΚἀμὲ ያለውን አጽንዖትና የοἴδατεን ድግግሞሽ ይጠብቃል።
- source_word: πόθεν εἰμί
  choice: ከየትም እንደሆንኩ
  rationale: የመነሻን ጥያቄ ሳያጠብ ይገልጣል፤ ምድራዊ አመጣጥን ብቻ ወይም ሰማያዊ አመጣጥን ብቻ አያስገባም።
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ከራሴ
  rationale: የግሪኩን ‘ከራሴ’ የሚል ምስላዊ አገላለጽ ይጠብቃል፤ ‘በራሴ ተነሳሽነት’ የሚለው ትርጉም በማስታወሻ ቀርቧል።
- source_word: οὐκ ἐλήλυθα
  choice: አልመጣሁም
  rationale: በአማርኛ የመምጣቱን ፍጹም ድርጊት በተፈጥሯዊና ግልጽ መንገድ ይገልጣል።
- source_word: ἀληθινὸς
  choice: እውነተኛ
  rationale: ቃሉ ታማኝነትን እንዲሁም እውነተኛነትንና እውን መሆንን ሊያስተጋባ ይችላል።
- source_word: ὁ πέμψας με
  choice: የላከኝ
  rationale: የላኪውን ግላዊ ድርጊት ይጠብቃል፤ በግሪኩ ያልተጠቀሰውን ‘አብ’ የሚል ስያሜ አይጨምርም።
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: እናንተም እርሱን አታውቁትም
  rationale: የὑμεῖςን አጽንዖትና ቀጥተኛውን ወቀሳ ግልጽ አድርጎ ያቆያል።
theological_decisions:
- issue: “እኔን ታውቁኛላችሁ፤ ከየትም እንደሆንኩ ታውቃላችሁ” የሚለው ንግግር ቀጥተኛ መግለጫ ወይስ ምጸታዊ ጥያቄ መሆኑ
  choice: የግሪኩን መግለጫዊ ቅርጽ በዋናው ጽሑፍ ማቆየት
  alternative: “እኔን ታውቁኛላችሁ? ከየትም እንደሆንኩ ታውቃላችሁ?” ብሎ እንደ ምጸታዊ ጥያቄ መተርጎም
  rationale: ዐውዱ ምጸትን ወይም ተግዳሮትን ሊያሰማ ቢችልም፣ የግሪኩ ሰዋስዋዊ ቅርጽ መግለጫ ነው። ትርጉሙ ይህን ውጥረት ሳይፈታ አቆይቷል።
- issue: “ከየት እንደሆንኩ” እና “ከራሴ አልመጣሁም” የሚሉት የኢየሱስን መነሻ እንዴት እንደሚያመለክቱ
  choice: ምድራዊ መነሻንና መለኮታዊ ተልእኮን ሊያካትት የሚችል ሰፊ አገላለጽ
  alternative: ሐረጉን በምድራዊ ጂኦግራፊ ብቻ መወሰን ወይም ‘ከሰማይ’ የሚል ማብራሪያ መጨመር
  rationale: በዮሐንስ ወንጌል የኢየሱስ መነሻ ድርብ ትርጉም ይኖረዋል፤ ግሪኩ በዚህ ሐረግ ያልወሰነውን ትርጉም ትርጉሙም አልወሰነም።
- issue: “የላከኝ” የሚለው ማንን እንደሚያመለክት
  choice: በጽሑፉ እንዳለው “የላከኝ” ብሎ ማቆየት
  alternative: “የላከኝ አብ” ብሎ በግልጽ መጨመር
  rationale: የዮሐንስ ሰፊ ዐውድ ላኪውን ቢያሳውቅም፣ በዚህ ሐረግ ግሪኩ ‘አብ’ የሚለውን ስያሜ አልጠቀሰም።
