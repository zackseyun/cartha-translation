base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: am
  text: ስለዚህ ኢየሱስ በቤተ መቅደሱ ሲያስተምር ድምፁን ከፍ አድርጎ እንዲህ አለ፦ “እኔን ታውቁኛላችሁ፤ መነሻዬ ከየት እንደሆነም ታውቃላችሁ።[a] እኔ ከራሴ[b] አልመጣሁም፤ የላከኝ ግን እውነተኛ[c] ነው፤ እናንተም እርሱን አታውቁትም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ንግግሩ “እኔን ታውቁኛላችሁ? መነሻዬ ከየት እንደሆነም ታውቃላችሁ?” የሚል ምጸታዊ ወይም ተግዳሮታዊ ስሜት ሊኖረው ይችላል፤ የግሪኩ ቅርጽ ግን መግለጫዊ ነው።
    reason: alternative_reading
  - marker: b
    text: “ከራሴ” የሚለው “በራሴ ተነሳሽነት” ወይም “በራሴ ፈቃድ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: “እውነተኛ” የሚለው ቃል “እውን” ወይም “የሐሰት ያልሆነ” የሚል ስሜትንም ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
