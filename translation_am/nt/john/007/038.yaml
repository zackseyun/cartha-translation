review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the singular substantival participle, the personal object of belief, the plural ‘rivers,’ the literal bodily image of κοιλία, and the future flowing. It also appropriately preserves the debated referent of αὐτοῦ in a footnote. The rendering ‘መጽሐፍ’ alone, however, can denote an ordinary book in modern Amharic and does not adequately identify ἡ γραφή as Scripture.
  naturalness: The verse is generally clear and dignified. ‘መጽሐፍ ቅዱስ እንዳለው’ is more natural and immediately intelligible as a citation formula than personifying an unspecified ‘book’ with ‘እንደተናገረው.’ ‘ሕይወት የሚሰጥ ውኃ’ gives a natural Amharic expression while retaining the established metaphor.
  terminology: ‘መጽሐፍ ቅዱስ’ suitably renders the Johannine singular ἡ γραφή in current standard Amharic. The footnote should retain both the figurative sense of κοιλία and the possible Messianic referent without presenting either as certain.
  issues:
  - severity: medium
    issue: ‘መጽሐፍ’ is underspecified for ἡ γραφή.
    rationale: In modern Amharic, መጽሐፍ normally means simply ‘book.’ Adding ቅዱስ identifies the authoritative scriptural citation intended by the Greek.
  - severity: low
    issue: ‘የሕያው ውኃ’ is an awkward noun phrase in modern Amharic.
    rationale: The genitive-like construction can sound unnatural. ‘ሕይወት የሚሰጥ ውኃ’ naturally communicates the Johannine ‘living water’ metaphor without reducing it to merely literal running water.
  revised_text: በእኔ የሚያምን ሰው፣ መጽሐፍ ቅዱስ እንዳለው፣ ከሆዱ[a] ሕይወት የሚሰጥ ውኃ ወንዞች ይፈስሳሉ።
