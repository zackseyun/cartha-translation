base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: am
  text: እናንተ ወደ በዓሉ ውጡ። እኔ ወደዚህ በዓል አልወጣም።[a] ምክንያቱም የእኔ ጊዜ ገና አልተፈጸመም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “እኔ ገና ወደዚህ በዓል አልወጣም” ይላሉ።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “የተወሰነልኝ ጊዜ ገና አልተፈጸመም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: ውጡ
  rationale: ወደ ኢየሩሳሌምና ወደ በዓሉ የመውጣትን አቅጣጫዊ ሐሳብ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἑορτή
  choice: በዓል
  rationale: ሃይማኖታዊውን የበዓል አውድ በዘመናዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: οὐκ ἀναβαίνω
  choice: አልወጣም
  rationale: የSBLGNTን οὐκ (‘አይደለም/አል’) ንባብ ይከተላል፤ ‘ገና’ የሚለውን የተለዋጭ ንባብ ወደ ዋናው ጽሑፍ አያስገባም። የአማርኛው የአሁን-ወደፊት ቅርጽ በቅርብ ስለሚደረገው ጉዞ ተፈጥሯዊ ነው።
- source_word: ταύτην
  choice: ይህ
  rationale: በውይይቱ የተጠቀሰውን የተወሰነ በዓል በቀጥታ ያመለክታል።
- source_word: καιρός
  choice: ጊዜ
  rationale: አጭርና ተፈጥሯዊ ሲሆን በአውዱ ያለውን የተወሰነ ወይም የተመደበ ጊዜ ፍቺ ክፍት አድርጎ ይጠብቃል።
- source_word: πεπλήρωται
  choice: ተፈጸመ
  rationale: የግሱን የሙላትና የፍጻሜ ሐሳብ ይጠብቃል፤ በ‘ደረሰ’ ብቻ ከሚሰጠው ትርጉም የበለጠ ከምንጩ ጋር ይቀራረባል።
theological_decisions:
- issue: ኢየሱስ ወደ በዓሉ ስለመውጣቱ ያለው የጽሑፍ ልዩነት
  choice: በዋናው ጽሑፍ የSBLGNTን οὐκ (‘አልወጣም’) ንባብ መከተል
  alternative: οὔπω (‘ገና አልወጣም’)
  rationale: የቀረበው የግሪክ መሠረት οὐκ ስለሚል ዋናው ጽሑፍ ያንኑ ይከተላል። በኋላ ወደ በዓሉ ከመውጣቱ ጋር ያለውን የትርጓሜ ውጥረት ሳይፈታ ጉልህ የሆነውን οὔπω ተለዋጭ ንባብ በማስታወሻ ያሳውቃል።
- issue: καιρός እንደ ተመደበ ጊዜ መተርጎም
  choice: በዋናው ጽሑፍ ‘ጊዜ’
  alternative: ‘የተወሰነልኝ ጊዜ’
  rationale: ‘ጊዜ’ የግሪኩን አሻሚነት ይጠብቃል፤ የመለኮታዊ ቀጠሮ ሐሳብን በግድ ወደ ዋናው ጽሑፍ ሳያስገባ አማራጩን በማስታወሻ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ውጡ’ በቅዱስ ጽሑፋዊው የኢየሩሳሌም ጉዞ አውድ የ‘ወደ ላይ መሄድ’ን ሐሳብ በተፈጥሯዊ አገላለጽ ይይዛል።
