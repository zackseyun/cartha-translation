id: JHN.7.11
reference: John 7:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: am
  text: ስለዚህ አይሁዳውያኑ[a] በበዓሉ ላይ እርሱን ይፈልጉት ነበር፤ “ያኛው የት ነው?” እያሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የይሁዳ ሰዎች።” በዮሐንስ ትረካ ዐውድ ይህ በተለይ በይሁዳ ያሉትን የአይሁድ ባለሥልጣናት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ ጋር ያለውን ቀጣይነትና ውጤታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἰουδαῖοι
  choice: አይሁድ
  rationale: ቃሉ በራሱ በዚህ ቁጥር መሪዎችን ብቻ አይወስንም፤ የይሁዳ አይሁድን ወይም ባለሥልጣናትን ሊያመለክት የሚችለው ዐውዳዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐζήτουν
  choice: ይፈልጉት ነበር
  rationale: ያልተጠናቀቀውንና በዚያን ጊዜ ይቀጥል የነበረውን ድርጊት የግስ አቀራረቡ ያሳያል።
- source_word: ἐν τῇ ἑορτῇ
  choice: በበዓሉ ላይ
  rationale: በዐውዱ ቀድሞ የተጠቀሰውን በዓል እንደሚያመለክት በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἔλεγον
  choice: ይሉም ነበር
  rationale: የግሪኩን ያልተጠናቀቀ ግስ በመጠበቅ ቀጣይ ወይም ተደጋጋሚ ንግግርን ያሳያል።
- source_word: ἐκεῖνος
  choice: ያ
  rationale: ከቀላል ‘እርሱ’ ይልቅ የጠቋሚውን ርቀት ይጠብቃል፤ ‘ሰው’ የሚለውን በግሪኩ የሌለ ስም አይጨምርም።
theological_decisions:
- issue: በዮሐንስ ወንጌል የἸουδαῖοι ተጠቃሽ
  choice: በዋናው ጽሑፍ ‘አይሁድ’ ተብሎ ተተርጉሟል።
  alternative: ‘የይሁዳ አይሁድ’፣ ወይም በዐውዱ ‘የአይሁድ ባለሥልጣናት’
  rationale: ቁጥሩ ራሱ ተጠቃሹን ወደ መሪዎች ብቻ አያጠብም። ስለዚህ የቃሉ ሰፊ ትርጉም በዋናው ጽሑፍ፣ ዐውዳዊው የተወሰነ አማራጭ ደግሞ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የሁለቱ ያልተጠናቀቁ ግሶች ቀጣይነት ‘ነበር’ በሚለው አወቃቀር ተጠብቋል፤ የግሪኩ አሻሚነት ሳይፈታ ቀርቧል።
