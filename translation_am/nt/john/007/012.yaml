  choice: “እርሱ በጎ ነው” እና “ሕዝቡን ያሳስታል” የሚሉት ሁለቱም አባባሎች በቀጥተኛ ንግግርና በገለልተኛ ዘገባ ቀርበዋል።
  alternative: አንዱን ግምገማ በቃላት ማለስለስ ወይም ተራኪው እንደሚያጸድቀው አድርጎ መተርጎም።
  rationale: ጥቅሱ የተራኪውን ፍርድ ሳይሆን በሕዝቡ መካከል የነበሩትን ተቃራኒ አመለካከቶች ይዘግባል፤ ትርጉሙም ይህን ውጥረት ሳይፈታ ጠብቋል።
