  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: am
  text: በሕዝቡም መካከል ስለ እርሱ ብዙ ሹክሹክታ ነበር[a]። አንዳንዶች፣ “እርሱ በጎ ነው” ይሉ ነበር፤ ሌሎች ግን፣ “አይ፤ ይልቁንም ሕዝቡን ያሳስታል[b]” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማጉረምረም” ወይም “በሹክሹክታ መነጋገር።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሕዝቡን ያታልላል” ወይም “ሕዝቡን ከመንገድ ያስታል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: ሹክሹክታ
  rationale: ቃሉ በግልጽ የሚደረግ ውይይትን ሳይሆን ዝቅ ባለ ድምፅ የሚነገር ቅሬታን ወይም የሰዎችን ድብቅ ንግግር ያመለክታል። “ሹክሹክታ” የንግግሩን ዝቅተኛና ይፋዊ ያልሆነ ባሕርይ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: περὶ αὐτοῦ
  choice: ስለ እርሱ
  rationale: የግሪኩን ቀጥተኛ ትርጉም በግልጽና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πολύς
  choice: ብዙ
  rationale: የሹክሹክታውን መጠንና መስፋፋት ያጠናክራል።
- source_word: ἐν τοῖς ὄχλοις
  choice: በሕዝቡ መካከል
