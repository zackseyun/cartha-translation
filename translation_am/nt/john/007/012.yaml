- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: አንዳንዶች ... ሌሎች ግን
  rationale: በሕዝቡ ውስጥ ያሉትን ሁለት ተቃራኒ አመለካከቶች ግልጽና ተፈጥሯዊ በሆነ አነጋገር ያሳያል።
- source_word: Ἀγαθός ἐστιν
  choice: እርሱ በጎ ነው
  rationale: “ሰው” የሚለውን ሳይጨምር የግሪኩን ቀጥተኛ ገላጭ ፍርድ ይጠብቃል፤ “በጎ” እዚህ የባሕርይ መልካምነትን ያመለክታል።
- source_word: Οὔ, ἀλλὰ
  choice: አይደለም፤ ከዚህ ይልቅ
  rationale: የቀደመውን አባባል በቀጥታ መካድንና ተቃራኒ ማስተካከያን ያሳያል።
- source_word: πλανᾷ
  choice: ያሳስታል
  rationale: ግሱ ማታለልን ወይም ከትክክለኛው መንገድ ማስወጣትን ሊያመለክት ይችላል። “ያሳስታል” የተግባሩን ውጤት ያስተላልፋል፤ ሆን ተብሎ ማታለል መሆኑን ግን አስገድዶ አይወስንም።
- source_word: τὸν ὄχλον
  choice: ሕዝቡን
  rationale: ነጠላውን የጋራ ስም በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከቀደመው “ሕዝቡ” ጋርም የቃል ግንኙነቱን ይጠብቃል።
