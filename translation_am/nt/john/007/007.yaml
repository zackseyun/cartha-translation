- source_word: τὰ ἔργα αὐτοῦ
  choice: ሥራዎቹ
  rationale: የἔργαን ሰፊ ሥነ ምግባራዊና ሥነ መለኮታዊ ጥላ ሐሳብ ይጠብቃል፤ “ድርጊቶቹ” እንደ አማራጭ በማስታወሻ ቀርቧል።
