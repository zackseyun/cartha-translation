  language: am
  text: እነዚህን ነገሮች ከተናገረ በኋላ፣ እርሱ ራሱ በገሊላ ቆየ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ይህን
  rationale: ግሪክኛው ገለልተኛ ብዙ ቁጥር ሲሆን ከዚህ በፊት የተነገሩትን ነገሮች ይመለከታል፤ በተፈጥሯዊ ዘመናዊ አማርኛ ‘ይህን’ ያንን ሐሳብ በአጭሩ ያስተላልፋል።
- source_word: δὲ … εἰπὼν
  choice: ከተናገረ በኋላ
  rationale: የአኦሪስት አጋዥ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ ይህ አተረጓጎም የጊዜውን ቅደም ተከተል ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: αὐτὸς
  choice: እርሱ ራሱ
  rationale: በግሪክኛው በግልጽ የቀረበው ተውላጠ ስም አጽንዖትን ሊያመለክት ስለሚችል፣ ‘እርሱ ራሱ’ ይህን ቅርጽ ይጠብቃል፤ በአውዱም ከወንድሞቹ እርምጃ ጋር ንጽጽር ሊኖረው ይችላል።
- source_word: ἔμεινεν
  choice: ቆየ
  rationale: μένω በዚህ ትረካዊ አውድ ‘መቆየት’ ማለት ነው፤ ‘ቆየ’ ቀጥተኛ፣ ተፈጥሯዊና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: በገሊላ
  rationale: ቀጥተኛውን የቦታ ትርጉም ያለ ተጨማሪ ትርጓሜ ያስተላልፋል።
theological_decisions: []
