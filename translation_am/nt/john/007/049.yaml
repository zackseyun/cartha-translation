base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: am
  text: ነገር ግን ሕጉን[b] የማያውቀው ይህ ሕዝብ የተረገመ ነው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእርግማን ሥር ነው።»
    reason: lexical_alternative
  - marker: b
    text: እዚህ «ሕጉ» የሚያመለክተው የአይሁድን ሕግ፣ ማለትም ቶራን ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ ὄχλος οὗτος
  choice: ይህ ሕዝብ
  rationale: ὄχλος በዚህ አውድ የተሰበሰበውን ብዙ ሰው ያመለክታል፤ «ሕዝብ» የግሪኩ ቃል የማያስገድደውን የ«ወንበዴ ቡድን» አሉታዊ ስሜት ሳይጨምር በአማርኛ ተፈጥሯዊ ነው።
- source_word: ὁ μὴ γινώσκων
  choice: የማያውቀው
  rationale: የወቅታዊው አሳታፊ ቅጽ ሕዝቡን የሚገልጽ ቀጣይ ሁኔታ መሆኑን በተፈጥሯዊ የአማርኛ አንጻራዊ አረፍተ ነገር ያስተላልፋል።
- source_word: τὸν νόμον
  choice: ሕጉን
  rationale: በአውዱ የሚያመለክተው የአይሁድን ሕግ፣ ማለትም ቶራን ነው፤ የተወሰነውን አመልካች ቅጥያ የያዘው «ሕጉን» ይህን ያንጸባርቃል።
- source_word: ἐπάρατοί εἰσιν
  choice: የተረገመ ነው
  rationale: የተናጋሪዎቹን ኃይለኛና የፍርድ ቃና በግልጽ ዘመናዊ አማርኛ ይጠብቃል፤ የግሪኩ ብዙ ቁጥር በአማርኛ እንደ አንድ ስብስብ ከሚታየው «ሕዝብ» ጋር በነጠላ ሰዋስው ተፈጥሯዊ ሆኗል።
theological_decisions:
- issue: የተናጋሪዎቹን ጠላትነት የተሞላበት ፍርድ እንደ ተራኪው የሥነ መለኮት ማረጋገጫ እንዳይቀርብ
  choice: ቃሉን ሳያለዝብ በቀጥታ ንግግሩ ውስጥ እንዳለ መተርጎም
  alternative: «እነርሱ ይህ ሕዝብ የተረገመ ነው ይላሉ» በማለት ተራኪውን ከንግግሩ በግልጽ ማራቅ
  rationale: የግሪኩ ጽሑፍ ይህን በቀጥታ ንግግር ያቀርባል። ትርጉሙ የተናጋሪዎቹን ከባድ ውግዘት ሳያለዝብ ሊያቀርብ ይገባል፤ ነገር ግን በምንጩ የሌለ የማራቂያ ሐረግ መጨመር የለበትም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ግልጽና ክብር ያለው ነው። «ይህ ሕዝብ» በአውዱ ያለውን የንቀት ቃና ከንግግሩ እንዲታወቅ ያደርጋል፣ ነገር ግን ὄχλος የማያስገድደውን ተጨማሪ አሉታዊ ፍቺ አያስገባም።
