  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: am
  text: ስለዚህ ፈሪሳውያኑ መልሰው፣ “እናንተም ተታላችሁ እንዴ?[a]” አሏቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተም ወደ ስሕተት ተመርታችሁ እንዴ?” የግሪኩ ግስ መታለልን ወይም ወደ ስሕተት መመራትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: መለሱላቸው
  rationale: በውይይት ውስጥ የተሰጠን ምላሽ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ αὐτοῖς የሚለውንም በ«-ላቸው» ያካትታል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በቀደመው ንግግርና በዚህ ምላሽ መካከል ያለውን የውጤት ወይም የተከታታይነት ግንኙነት ያሳያል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የዚህን የአይሁድ ቡድን መደበኛ የአማርኛ መጠሪያ ይጠቀማል።
- source_word: Μὴ καὶ ὑμεῖς
  choice: እናንተም ደግሞ … እንዴ?
  rationale: καί የሚያሳየውን «እናንተም» የሚል አጽንዖት እና μή የሚጠብቀውን አሉታዊ መልስ በተፈጥሯዊ የአማርኛ የአጠያየቅ ቅርጽ ያስተላልፋል።
- source_word: πεπλάνησθε
  choice: ተሳስታችሁ
  rationale: ወደ ስሕተት መመራትን ወይም መሳትን ያመለክታል፤ የግሪኩን ፍጹም ጊዜ ውጤታዊ ሁኔታም በዐውደ ንግግሩ ያስቀራል።
theological_decisions:
- issue: μή ባለበት ጥያቄ የሚጠበቀው አሉታዊ መልስ
  choice: «…እንዴ?» በሚል የአማርኛ ቅርጽ የንግግሩን የመደነቅና የንቀት ኃይል ማሳየት
  alternative: «በእርግጥ እናንተም አልተታለላችሁምን?»
  rationale: የግሪኩ ጥያቄ «አይደለም» የሚል መልስ ይጠብቃል። «እንዴ?» ይህን የንግግር ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ «በእርግጥ» የሚል ተጨማሪ ቃል ግን አያስገባም።
- issue: የπλανάω ትርጉም ስፋት
  choice: በዋናው ጽሑፍ «ተሳስታችሁ» ማለት
  alternative: «ተታላችሁ»
  rationale: ቃሉ ወደ ስሕተት መመራትንም መታለልንም ሊያመለክት ይችላል። «ተሳስታችሁ» ወደ ስሕተት የመሳብን ሐሳብ ሲጠብቅ፣ «ተታላችሁ» የሚለው አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «እንዴ?» የፈሪሳውያኑን የሚጠበቅ አሉታዊ መልስና የንግግር ቃና በተፈጥሯዊ ሁኔታ ያሳያል።
