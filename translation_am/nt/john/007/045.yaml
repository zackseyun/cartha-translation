- source_word: ἀρχιερεῖς
  choice: ካህናት አለቆች
  rationale: የካህናትን መሪ ባለሥልጣናት የሚያመለክት የተለመደ እና ግልጽ አገላለጽ ነው።
- source_word: Φαρισαίους
  choice: ፈሪሳውያን
  rationale: የአይሁድን ቡድን ስም በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
- source_word: ἐκεῖνοι
  choice: እነዚያም
  rationale: በግሪክኛው ያለውን ግልጽ ጠቋሚ ተውላጠ ስም እና በካህናት አለቆችና በፈሪሳውያን ላይ የተደረገውን አጽንዖት ይጠብቃል።
- source_word: Διὰ τί
  choice: ለምን
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ የምክንያት ጥያቄ ነው።
- source_word: ἠγάγετε
  choice: አላመጣችሁትም
  rationale: ያለፈውን ድርጊት የሚጠይቀውን የግሪክኛ አወቃቀር ያስተላልፋል፤ በዚህ አውድ ‘ማምጣት’ ኢየሱስን ይዘው ወደ ላኪዎቻቸው ማቅረብን ያሳያል።
- source_word: αὐτόν
  choice: -ት- (በ‘አላመጣችሁትም’)
  rationale: ኢየሱስን የሚያመለክተው ተሳቢ ተውላጠ ስም በአማርኛ ግስ ውስጥ በተፈጥሮ ተዋሕዷል።
