base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: am
  text: ስለዚህ ጠባቂዎቹ ወደ ካህናት አለቆችና ወደ ፈሪሳውያን መጡ፤ እነዚያም[a]፣ “ለምን አላመጣችሁትም?[b]” አሏቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነርሱም።” ግሪክኛው “እነዚያ” የሚል ጠቋሚ ተውላጠ ስም ይጠቀማል፤ ይህም ካህናት አለቆቹንና ፈሪሳውያኑን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለምን አልመራችሁትም?” ግሱ “መምራት” ወይም “ማምጣት” ሊሆን ይችላል፤ በዚህ አውድ ግን “ማምጣት” ኢየሱስን ይዘው ወደ ላኪዎቻቸው ማቅረብን በተፈጥሮ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
