  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: am
  text: ስለዚህ ኢየሱስም እንዲህ አላቸው፦ “የእኔ ጊዜ[a] ገና አልደረሰም፤ የእናንተ ጊዜ ግን ሁልጊዜ ዝግጁ ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእኔ የተወሰነ ጊዜ።” የግሪኩ ቃል በአጠቃላይ ጊዜን ብቻ ሳይሆን፣ ተስማሚ ወይም የተወሰነ ጊዜንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚነሳውን ድምዳሜያዊ ወይም ትረካዊ ቅጥያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: ኢየሱስ ... አላቸው
  rationale: የግሪኩ ግስ ታሪካዊ የአሁን ጊዜ ቢሆንም፣ በአማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊ ነው፤ አላቸው ደግሞ αὐτοῖςን ያካትታል።
- source_word: καιρός
  choice: ጊዜ
  rationale: ቃሉ ተስማሚ ወይም የተወሰነ ጊዜን ሊያመለክት ቢችልም፣ ጊዜ በዋናው ጽሑፍ አጭርና ተፈጥሯዊ ሆኖ የቃሉን ስፋት ይጠብቃል።
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: የእኔ ጊዜ
  rationale: የባለቤትነት አጽንዖቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὔπω πάρεστιν
  choice: ገና አልደረሰም
  rationale: ጊዜው እስከአሁን እንዳልመጣ የሚገልጸውን ትርጉም በአማርኛ የተለመደ አገላለጽ ያስተላልፋል።
- source_word: δὲ
  choice: ግን
  rationale: በኢየሱስ ጊዜና በወንድሞቹ ጊዜ መካከል ያለውን ንጽጽር ያሳያል።
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: የእናንተ ጊዜ
  rationale: ከየእኔ ጊዜ ጋር ያለውን ትይዩ አወቃቀርና ንጽጽር ይጠብቃል።
- source_word: πάντοτέ ἐστιν ἕτοιμος
  choice: ሁልጊዜ ዝግጁ ነው
  rationale: πάντοτέን ቀጥተኛ በሆነ መንገድ፣ ἕτοιμοςንም በተለመደው የአማርኛ ቃል ይተረጉማል፤ የግሪኩን ያልተለመደ ግን ትርጉም ያለው የጊዜ ዝግጁነት ምስል ይጠብቃል።
theological_decisions:
