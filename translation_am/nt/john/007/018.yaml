  rationale: የቅርብ አውዱ የትምህርቱን ምንጭና ዓላማ ይመለከታል፤ ትርጉሙ ጽሑፉ ከሚናገረው በላይ የኋለኛ ዘመን የእምነት ምድቦችን አያስገባም።
