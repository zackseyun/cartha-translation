    text: በዮሐንስ ወንጌል ሰፊ አውድ “የላከኝ” የሚለው አብን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ንግግር ጋር ያለውን ትረካዊና ምክንያታዊ ቅጥልጥል በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ስለዚህ’ ከሚለው ይልቅ የምክንያት ግንኙነቱን አያጠነክርም።
- source_word: Ἔτι χρόνον μικρόν
  choice: ገና ለጥቂት ጊዜ
  rationale: ἔτι የሚያመለክተውን ‘ገና/አሁንም’ እና χρόνον μικρόν የሚያመለክተውን አጭር የጊዜ ቆይታ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
