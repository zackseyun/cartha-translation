- source_word: πρὸς τὸν πέμψαντά με
  choice: ወደ ላከኝ
  rationale: የተወሰነውን አድራጊ ቦዝ አንቀጽ ‘ወደ ላከኝ’ ብሎ በተፈጥሯዊ አማርኛ ያቀርባል፤ በዋናው ጽሑፍ ውስጥ ማንነቱን ‘አብ’ ብሎ በመጨመር አይፈታውም።
