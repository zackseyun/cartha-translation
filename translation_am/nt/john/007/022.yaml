base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: am
  text: ስለዚህ ሙሴ ግርዛትን ሰጥቷችኋል—ይህ ግን ከሙሴ ስለሆነ ሳይሆን፣ ከአባቶች ስለሆነ ነው[a]—እናንተም በሰንበት ሰውን ትገርዛላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ግርዛት ከሙሴ ስለሆነ ሳይሆን፣ ከአባቶች ስለሆነ ነው።” በመካከል የገባው ይህ ሐረግ ግርዛት ከሙሴ እንዳልጀመረ፣ ከቀደምት አባቶች እንደመጣ ያብራራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የምክንያትና የማብራሪያ ግንኙነቱን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Μωϋσῆς
  choice: ሙሴ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: δέδωκεν ὑμῖν
  choice: ሰጣችሁ
  rationale: የተቋቋመውን ሥርዓት ሙሴ ለእነርሱ እንደሰጠ በተፈጥሯዊ አማርኛ ይገልጻል፤ የግሪኩ ፍጹም ጊዜ ያለው ዘላቂ ውጤት ከአውዱ ይታወቃል።
- source_word: τὴν περιτομήν
  choice: ግርዛትን
  rationale: የቃል ኪዳኑን ሥርዓትና ተግባር በቀጥታ የሚገልጽ የተለመደ ቃል ነው።
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: ይሁን እንጂ ግርዛት ከሙሴ ሳይሆን ከአባቶች ነው
  rationale: የግርዛት ታሪካዊ ምንጭ ሙሴ ሳይሆን ቀደምት አባቶች መሆኑን የሚያብራራውን አጋዥ ሐረግ በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν σαββάτῳ
  choice: በሰንበት
  rationale: የጊዜ ትርጉሙንና ስለ ተለመደ ልማድ የሚነገረውን አጠቃላይ ሐሳብ በአማርኛ በተለመደ አገላለጽ ያቀርባል።
- source_word: περιτέμνετε
  choice: ትገርዛላችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርንና የተለመደ ተግባርን በቀጥታ ያስተላልፋል።
- source_word: ἄνθρωπον
  choice: አንድን ሰው
  rationale: ነጠላውን ሰው በቀጥታ ይገልጻል፤ በዚህ የግርዛት አውድ ውስጥ ወንድ መሆኑ ግልጽ ስለሆነ በጽሑፉ ላይ ተጨማሪ ቃል አልተጫነም።
theological_decisions:
- issue: “አባቶች” የሚለው ማንን እንደሚያመለክት
  choice: ግርዛት ከሙሴ በፊት ከነበሩት ቀደምት አባቶች እንደመጣ የሚገልጽ ሆኖ ተተርጉሟል።
  alternative: በሰፊው የእስራኤል ቀደምት አባቶችን ሁሉ የሚያመለክት ሊሆን ይችላል።
  rationale: ጽሑፉ ግርዛት ከሙሴ ሕግ በፊት መኖሩን ያጎላል፤ ትርጉሙ ከጽሑፉ በላይ ሳይዘረጋ “አባቶች” የሚለውን መጽሐፍ ቅዱሳዊ አገላለጽ ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በሰረዝ መካከል ያለው ሐረግ የግሪኩን አጋዥ ማብራሪያ ይጠብቃል።
