  verdict: revise
  source_fidelity: The draft correctly conveys the ongoing attempt to seize Jesus, the negative outcome, and the Johannine expression “his hour.” However, its word order places the causal clause before “no one laid a hand on him,” and “እጁን አልጫነበትም” is not the clearest natural Amharic rendering of the Greek idiom.
  naturalness: “ማንም በእርሱ ላይ እጁን አላኖረም” is clearer and more idiomatic for the intended sense. Restoring the source order also makes the sentence flow more naturally.
  terminology: “ሊይዙት,” “የእርሱ ሰዓት,” and the footnote’s cautious explanation of the Johannine “hour” are appropriate. The revised wording retains the ambiguity between physical seizure and arrest in the main text.
  issues:
  - severity: medium
    issue: The rendering of ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα is unclear and somewhat unnatural.
    rationale: “እጁን አልጫነበትም” can suggest pressing a hand on him rather than the idiomatic sense of laying a hand on him/taking hold of him. “በእርሱ ላይ እጁን አላኖረም” is clearer while retaining the singular ‘hand.’
  - severity: low
    issue: The causal clause is moved ahead of the action it explains, and footnote b is anchored after the full sentence.
    rationale: The Greek states first that no one laid a hand on him and then gives the reason. Placing the cause afterward and anchoring the note directly to “ሰዓት” better reflects the source and provides a clear footnote anchor.
