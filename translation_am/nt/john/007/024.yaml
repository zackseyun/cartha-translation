review_pass:
  verdict: revise
  source_fidelity: The prohibitive and the repeated imperative are represented accurately. However, ትክክለኛውን ('the correct/right') is weaker and narrower than δικαίαν in this ethical-juridical context; ፍትሐዊ is the closer modern Amharic equivalent. The expression በሚታየው መሠረት is understandable but less direct than the source's idiom of outward appearance.
  naturalness: The draft is generally clear and uses an appropriate respectful plural imperative. Recasting the first clause with በውጫዊ መልክ is more idiomatic and makes explicit the contrast between surface appearance and fair judgment.
  terminology: Use ፍትሐዊ ፍርድ for δικαία κρίσις. This preserves the adjective's justice/fairness sense without importing a denominational sense of 'righteousness.'
  issues:
  - severity: medium
    issue: ትክክለኛውን ፍርድ for τὴν δικαίαν κρίσιν
    rationale: ትክክለኛ commonly denotes factual correctness. δικαία here qualifies judgment as just/fair, including its moral-juridical quality. ፍትሐዊ  is more precise.
  - severity: low
    issue: በሚታየው መሠረት for κατ’ ὄψιν
    rationale: Though intelligible, it is somewhat abstract and may mean judging according to whatever is visible. በውጫዊ መልክ directly conveys judgment based on outward appearance.
  revised_text: በውጫዊ መልክ[a] አትፍረዱ፤ ይልቁንም ፍትሐዊ ፍርድ ፍረዱ።
  revised_footnotes:
  - marker: a
    text: ወይም፦ “በሚታየው ላይ ተመሥርታችሁ አትፍረዱ፤ ይልቁንም ፍትሐዊ ፍርድ ፍረዱ።”
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek parallelism through the repeated ፍረዱ and preserves the imperative contrast. It replaces the broad, abstract first-clause wording with a natural equivalent of κατ’ ὄψιν and renders δικαίαν with the more contextually exact ፍትሐዊ.
