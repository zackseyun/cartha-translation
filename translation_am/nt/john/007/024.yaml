lexical_decisions:
- source_word: μὴ κρίνετε
  choice: አትፍረዱ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር ያለውን የክልከላ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ድርጊቱን ‘አቁሙ’ ብሎ አስፔክቱን ከልክ በላይ አይተረጉምም።
- source_word: κατ’ ὄψιν
  choice: በሚታየው መሠረት
  rationale: በውጫዊ መልክ ወይም በላይ ላዩ እይታ ላይ ተመሥርቶ መፍረድን የሚያመለክተውን ሐረግ በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἀλλὰ
  choice: ይልቁንም
  rationale: የተከለከለውን የፍርድ መንገድ ከታዘዘው መንገድ ጋር የሚያነጻጽረውን ጠንካራ ተቃርኖ ያሳያል።
- source_word: τὴν δικαίαν κρίσιν
  choice: ትክክለኛውን ፍርድ
  rationale: δικαίαν ያለውን የሥነ ምግባርና የፍትሕ ትርጉም በተረዳ አማርኛ ይጠብቃል፤ የግሪኩን ቀጥተኛ ተሳቢም አያጠፋም።
- source_word: κρίνετε
  choice: ፍረዱ
  rationale: በሁለቱም ሐረጎች የተደገመውን የግሪክ ግስ በመድገም የንግግሩን ትይዩነትና አጽንዖት ይጠብቃል።
theological_decisions:
- issue: δικαίαν በሥነ ምግባራዊና በዳኝነታዊ አውድ መተርጎም
  choice: ትክክለኛውን
  alternative: ጻድቅ የሆነውን / ፍትሐዊውን
  rationale: ‘ትክክለኛውን’ የጽድቅንና የፍትሕን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃሉን ወደ ሥርዓታዊ ፍትሕ ብቻ አያጠብበውም፣ የኋለኛ ዘመን የትምህርተ እምነት ልዩነትንም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የ‘ፍረዱ’ ድግግሞሽ የምንጩን አጻጻፍና የሥነ ንግግር አጽንዖት ለመጠበቅ ታስቦ ቀርቷል።
