  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: am
  text: እኔ እርሱን አውቀዋለሁ፤[a] ምክንያቱም ከእርሱ ነኝ፣[b] እርሱም ላከኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔ ከእርሱ እንደሆንኩ አውቃለሁ።” የግሪኩ አያያዥ ቃል “እንደሆነ” የሚል ይዘትን ወይም “ምክንያቱም” የሚል ምክንያትን ሊያስገባ ይችላል፤ ዐውዱ ምክንያታዊውን ትርጉም ይበልጥ ይደግፋል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእርሱ መጣሁ” ወይም “ከእርሱ ፊት ነኝ።” የግሪኩ ሐረግ ከቀላል «ከእርሱ» ይልቅ ምንጭን፣ መነሻን ወይም ከእርሱ ፊት መሆንን በግልጽ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: እኔ
  rationale: ግልጽ የሆነውን የመጀመሪያ ሰው ተውላጠ ስም በመጠበቅ የንግግሩን አጽንዖት ያሳያል።
- source_word: οἶδα αὐτόν
  choice: እርሱን አውቀዋለሁ
  rationale: οἶδα አሁን ያለን የማወቅ ሁኔታ ያመለክታል፤ አማርኛውም ተፈጥሯዊ በሆነ የአሁን ጊዜ አገላለጽ ያቀርበዋል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ ውስጥ ኢየሱስ እርሱን የሚያውቅበትን ምክንያት የሚያስገባ ምክንያታዊ ትርጉም ይበልጥ ይስማማል፤ የይዘት አማራጩ በማስታወሻ ተጠብቋል።
- source_word: παρ’ αὐτοῦ εἰμι
  choice: ከእርሱ ነኝ
  rationale: παρά ከመስተዋድድ ዘር ጋር ምንጭን ወይም መነሻን ሊገልጽ ይችላል። ይህ አተረጓጎም የግሪኩን የአሁን ጊዜ አያያዥ ግስ ይጠብቃል፤ ትርጉሙንም ወደ መምጣት ወይም ወደ ቦታ ብቻ አያጠብበውም።
- source_word: κἀκεῖνός με ἀπέστειλεν
  choice: እርሱም ላከኝ
  rationale: καί + ἐκεῖνος ተፈጥሯዊ በሆነው «እርሱም» ተተርጉሟል፤ የአዎንታዊ አንቀጽ ግስ ደግሞ በቀላል ያለፈ ጊዜ «ላከኝ» ተሰጥቷል።
theological_decisions:
- issue: በπαρ’ αὐτοῦ εἰμι የተገለጸው ኢየሱስ ከአብ ጋር ያለው ግንኙነት
  choice: «ከእርሱ ነኝ» በማለት ምንጭንና መነሻን የሚጠቁመውን ሰፊ ትርጉም መጠበቅ
  alternative: «ከእርሱ መጣሁ» ወይም «ከእርሱ ፊት ነኝ»
  rationale: ዋናው ንባብ የግሪኩን εἰμι በቅርብ ይከተላል፤ የኢየሱስን ምንጭና ልዩ ግንኙነት የያዘውን ሥነ መለኮታዊ ጥልቀት ወደ ተልእኮ ወይም ወደ ቦታ ብቻ ሳይወስን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እኔ» የሚለው አጽንዖት ተጠብቋል፤ የግሪኩም ሥነ መለኮታዊ ክፍትነት ያለ ትርጓሜያዊ ማጥበብ ቀርቧል።
