base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: am
  text: ትፈልጉኛላችሁ[a]፣ እናም አታገኙኝም፤ እኔ ያለሁበት እናንተ ልትመጡ አትችሉም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሌላ ንባብ፦ «ትፈልጉኛላችሁ።»
    reason: textual_variant
  - marker: b
    text: ወይም፦ «መምጣት አትችሉም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσετέ
  choice: ትፈልጉኛላችሁ
  rationale: የወደፊት ጊዜንና የብዙ ሰዎች አድራጊነትን ያሳያል፤ በዚህ አውድ ኢየሱስን ለማግኘት መፈለግን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: με
  choice: -ኛ- (ትፈልጉኛላችሁ)
  rationale: ኢየሱስን የሚያመለክተውን ቀጥተኛ ተሳቢ በአማርኛው ግስ ውስጥ በተፈጥሯዊ ሁኔታ ያካትታል።
- source_word: οὐχ εὑρήσετε
  choice: አታገኙኝም
  rationale: ያለ ተጨማሪ አጽንኦት አሉታዊውን የወደፊት ውጤት በግልጽ ሁኔታ ያስተላልፋል።
- source_word: ὅπου εἰμὶ ἐγώ
  choice: እኔ ያለሁበት
  rationale: የቦታውን አንጻራዊ ሐረግ እና በἐγώ የተገለጠውን የ‘እኔ’ ንጽጽራዊ አጽንኦት ሳይጨምር ወይም ሳያጎድል ያቆያል።
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: ግልጽ የብዙ ሰዎች ተውላጠ ስም ሲሆን ከ‘እኔ’ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ልትመጡ አትችሉም
  rationale: δύνασθε የሚገልጸውን አለመቻል በተፈጥሯዊ አማርኛ ያሳያል፤ እንደ ፈቃድ ክልከላ አያቀርበውም።
theological_decisions:
- issue: ‘እኔ ያለሁበት ... ልትመጡ አትችሉም’ የሚለው አለመቻል ምንነት
  choice: ምክንያቱን ሳይወስን እንደ አለመቻል ተተርጉሟል።
  alternative: ‘መምጣት አይፈቀድላችሁም’ ብሎ እንደ ክልከላ መተርጎም።
  rationale: δύνασθε ችሎታን ወይም መቻልን ይመለከታል፤ ጥቅሱ ግን አለመቻሉ ሥነ ምግባራዊ፣ መንፈሳዊ፣ ፍርዳዊ ወይም ጊዜያዊ መሆኑን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እኔ’ እና ‘እናንተ’ በግልጽ መግባታቸው በግሪክ ያለውን ንጽጽር ይጠብቃል።
