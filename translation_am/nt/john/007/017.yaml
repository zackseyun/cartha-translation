  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: am
  text: ማንም ፈቃዱን ለማድረግ ቢፈልግ፣ ስለዚህ ትምህርት፣ ከእግዚአብሔር እንደሆነ ወይም እኔ ከራሴ[a] እንደምናገር ያውቃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራሴ” ወይም “በራሴ ሥልጣን።” ግሪክኛው ቃል በቃል “ከራሴ” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: ማንም ... ቢፈልግ
  rationale: ἐάν ከተያያዘው ንዑስ አንቀጽ ጋር አጠቃላይ ሁኔታን ያሳያል፤ θέλῃ የፍላጎትንና የፈቃደኝነትን ሐሳብ ይይዛል። ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: τὸ θέλημα αὐτοῦ
  choice: ፈቃዱን
  rationale: αὐτοῦ በዐውዱ እግዚአብሔርን ያመለክታል፤ ሆኖም ግሪክኛው ስሙን ደግሞ ስለማይጠቅስ ተውላጠ ስሙ ተጠብቋል።
- source_word: ποιεῖν
  choice: ለማድረግ
  rationale: θέλημα ποιεῖν የሚለውን ‘ፈቃድን ማድረግ’ የሚለው ቀጥተኛና የተለመደ አገላለጽ በታማኝነት ያስተላልፋል።
- source_word: γνώσεται
  choice: ያውቃል
  rationale: የወደፊት ጊዜው ግስ ከፈቃድና ከተግባር የሚከተል እውቀትን ወይም መለየትን ያሳያል፤ ‘ያውቃል’ አጭርና ተፈጥሯዊ ነው።
- source_word: περὶ τῆς διδαχῆς
  choice: ትምህርቱ ... መሆኑን
  rationale: περί ከዝርዝር ሁለት አማራጮች ጋር ስለ ትምህርቱ ምንጭ የሚታወቀውን ያሳያል። የአማርኛው ሰዋስው ትምህርቱን የ‘ያውቃል’ ይዘት አድርጎ በተፈጥሯዊ መንገድ ያቀርበዋል።
- source_word: πότερον ... ἢ
  choice: '... መሆኑን ወይም ... መሆኑን'
  rationale: ሁለቱን አማራጮች በግልጽ ተመጣጣኝ አወቃቀር ያቀርባል።
- source_word: ἐκ τοῦ θεοῦ
  choice: ከእግዚአብሔር የሆነ
  rationale: ἐκ ምንጭንና መነሻን ያሳያል፤ ‘ከእግዚአብሔር’ ይህን በቀጥታ ያስተላልፋል።
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ከራሴ
  rationale: የግሪክኛውን የምንጭ ምስል በቀጥታ ይጠብቃል፤ ‘በራሴ’ ወይም ‘በራሴ ሥልጣን’ የሚሉት ትርጓሜያዊ አማራጮች በማስታወሻ ቀርበዋል።
- source_word: λαλῶ
  choice: የምናገር
  rationale: በዚህ የንግግር ዐውድ ያለውን የአሁን ጊዜ ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በαὐτοῦ ውስጥ ያለው ተውላጠ ስም ማንን እንደሚያመለክት
  choice: ‘ፈቃዱን’ በማለት ተውላጠ ስሙን ማቆየት፤ በዐውዱ እግዚአብሔርን ያመለክታል።
  alternative: ለግልጽነት ‘የእግዚአብሔርን ፈቃድ’ ማለት።
  rationale: የቅርቡ ዐውድ የኢየሱስ ትምህርት ከእግዚአብሔር መሆኑን ይመለከታል፤ ስለዚህ ማጣቀሻው ግልጽ ቢሆንም የግሪክኛው ተውላጠ ስም እንዳለ ተጠብቋል።
- issue: የἀπ’ ἐμαυτοῦ ኃይል
  choice: ‘ከራሴ’ በማለት የምንጭን አገላለጽ መጠበቅ።
  alternative: ‘በራሴ’ ወይም ‘በራሴ ሥልጣን።’
  rationale: ግሪክኛው በቀጥታ ምንጭን ወይም መነሻን ይገልጻል። ራስን ችሎ በራስ ሥልጣን መናገር የሚለው አንድምታ ቢኖርም፣ ዋናው ጽሑፍ ከቃሉ በላይ እንዳይወስን ቀጥተኛው አገላለጽ ተመርጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ተመጣጣኙ ‘... መሆኑን ወይም ... መሆኑን’ አወቃቀር የግሪክኛውን ሁለት አማራጮች በግልጽነት ይጠብቃል። የማስታወሻው ምልክት በሚያብራራው ‘ከራሴ’ ሐረግ ላይ ተቀምጧል።
