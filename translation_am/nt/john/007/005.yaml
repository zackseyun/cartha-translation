  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞቹ እንኳ በእርሱ አላመኑምና።” የግሪኩ ያልተፈጸመ ግስ ቀላል ያለፈ ድርጊትን (“አላመኑም”) ወይም በያኔው ጊዜ የቀጠለ ሁኔታን (“አያምኑም ነበር”) ሊገልጽ ይችላል።
