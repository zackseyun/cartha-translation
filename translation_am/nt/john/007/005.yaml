- source_word: ἐπίστευον
  choice: አያምኑም ነበር
  rationale: ያልተፈጸመው ግሪክ ግስ በያኔው ጊዜ የቀጠለ ወይም የተለመደ አለማመንን ሊያሳይ ይችላል፤ ‘አያምኑም ነበር’ ይህን ገጽታ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εἰς αὐτόν
  choice: በእርሱ
  rationale: ከπιστεύω ጋር εἰς ወደ ግለሰብ የሚመራ እምነትን ወይም መታመንን ያመለክታል፤ ‘በእርሱ ማመን’ ይህን በመደበኛ አማርኛ ይገልጣል።
theological_decisions:
- issue: በዮሐንስ አጠቃቀም የπιστεύω εἰς αὐτόν ትርጉም
  choice: በኢየሱስ ማመን፣ ማለትም ወደ እርሱ የሚመራ ግላዊ እምነት
  alternative: እርሱን አለመታመን
  rationale: ዮሐንስ πιστεύω ከεἰς ጋር ብዙ ጊዜ በኢየሱስ ማመንን ይገልጽበታል። ትርጉሙ የወንድሞቹን አለማመን ይገልጣል እንጂ ምክንያታቸውን ወይም ከዚያ በኋላ ያለውን መንፈሳዊ ሁኔታቸውን አይወስንም።
