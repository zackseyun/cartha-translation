lexical_decisions:
- source_word: οὐδὲ
  choice: እንኳ ... አያምኑም ነበር
  rationale: οὐδὲ በዚህ ስፍራ ተራ ማያያዣ ሳይሆን አጽንዖት ይሰጣል፤ በአማርኛ ‘እንኳ’ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: γὰρ
  choice: ነበርና
  rationale: γὰρ ሐረጉን ከቀደመው አውድ ጋር በምክንያታዊ ማብራሪያ ያገናኛል፤ የአማርኛው ‘-ና’ ይህን ግንኙነት በተፈጥሯዊና አጭር መንገድ ይገልጣል።
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ወንድሞቹ
