  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: am
  text: ስለዚህ በእርሱ ምክንያት በሕዝቡ መካከል ክፍፍል ተፈጠረ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: መለያየት
  rationale: ቃሉ በሰዎች መካከል የተፈጠረን መከፋፈል ወይም አለመስማማት ያመለክታል፤ «መለያየት» በዚህ አውድ ተፈጥሯዊና ግልጽ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ውይይት የተነሣውን ውጤት ወይም መደምደሚያ ያመለክታል።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: ከσχίσμα ጋር ሲገናኝ መለያየቱ መፈጠሩን የሚገልጽ ቀላልና ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐν τῷ ὄχλῳ
  choice: በሕዝቡ መካከል
  rationale: ὄχλος በዚህ አውድ የተሰበሰበውን ሕዝብ ያመለክታል፤ «በሕዝቡ መካከል» የመለያየቱን ማኅበራዊ ስፍራ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: δι’ αὐτόν
  choice: በእርሱ ምክንያት
  rationale: διά ከተሳቢ ጋር በዚህ ስፍራ ምክንያትን ያመለክታል፤ አገላለጹም የግሪኩን ምክንያታዊ ግንኙነት በግልጽ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: የαὐτόν ተመላካች
  choice: «እርሱ» ኢየሱስን ያመለክታል፤ ነገር ግን በትርጉሙ ስሙ አልተጨመረም።
  alternative: «በኢየሱስ ምክንያት» ብሎ በግልጽ መጻፍ
  rationale: አውዱ ተመላካቹን ግልጽ ያደርገዋል፤ የመነሻውን ተውላጠ ስም መጠበቅ ሳያስፈልግ ትርጓሜን እንዳንጨምር ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ሕዝቡ» የተሰበሰበውን ሕዝብ ይገልጻል፤ የቤተ እምነት ልዩ ቃላት አልገቡም።
