  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: am
  text: '“‘ትፈልጉኛላችሁ እና አታገኙኝም፤ እኔ ባለሁበትም[c][b] እናንተ መምጣት አትችሉም’ ብሎ የተናገረው ይህ አባባል[a] ምንድን ነው?”


    [a] ወይም፣ “‘ትፈልጉኛላችሁ እና አታገኙኝም፤ እኔ ባለሁበትም እናንተ መምጣት አትችሉም’ ብሎ የተናገረው ይህ ቃል ምንድን ነው?” የግሪኩ λόγος እንደ አውዱ “ቃል፣” “አባባል፣” “መግለጫ” ወይም “መልእክት” ማለት ይችላል።


    [b] አንዳንድ ትርጉሞች፣ “ወደምሄድበት እናንተ መምጣት አትችሉም” ብለው ይተረጉሙታል፤ እዚህ ያለው የግሪክ ጽሑፍ ግን “እኔ ባለሁበት” ይላል። ይህም በዮሐንስ አገላለጽ ያለውን ሆን ተብሎ የተጠበቀ ውጥረት ያስቀራል።


    [c] ወይም፣ “‘ትፈልጉኛላችሁ እና አታገኙኝም’ እና ‘እኔ ባለሁበት እናንተ መምጣት አትችሉም’ በማለት የተናገረው ይህ አባባል ምንድን ነው?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
