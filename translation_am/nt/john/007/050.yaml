  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: am
  text: ቀደም ሲል ወደ እርሱ[a] መጥቶ የነበረው፣ ከእነርሱ አንዱ የነበረው ኒቆዲሞስ እንዲህ አላቸው፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «እርሱ» በአውዱ ኢየሱስን ያመለክታል። ወይም፣ «ቀደም ብሎ ወደ እርሱ የመጣው»።
    reason: የግሪኩን ተውላጠ ስም በዋናው ጽሑፍ ጠብቆ፣ በአውድ የሚታወቀውን ማጣቀሻና የጊዜ አገላለጽ አማራጭ ያሳያል።
lexical_decisions:
- source_word: λέγει
  choice: እንዲህ አለ
  rationale: የግሪኩ ቃል በታሪካዊ የአሁን ጊዜ ቢቀርብም፣ በአማርኛ ትረካ ያለፈ ጊዜን መጠቀም ተፈጥሯዊ ነው። ቀጣዩን ቀጥተኛ ንግግር ስለሚያስገባም «እንዲህ አለ» ተመርጧል።
- source_word: Νικόδημος
  choice: ኒቆዲሞስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ልማድ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: πρὸς αὐτούς
  choice: እንዲህ አላቸው
  rationale: πρός ከክስ ቅጽ ጋር ከንግግር ግስ በኋላ የንግግሩን ተቀባዮች ያመለክታል፤ በአማርኛም ተውላጠ ስሙ በግሱ ውስጥ «-ላቸው» ተብሎ በተፈጥሮ ይገለጣል።
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: ቀደም ሲል ወደ እርሱ መጥቶ የነበረው
  rationale: በመስተዋድድ የተሰየመው አሳታፊ ሐረግ ኒቆዲሞስን ይለያል። «መጥቶ የነበረው» ድርጊቱ ከዚህ ንግግር በፊት መፈጸሙን፣ «ቀደም ሲል»ም πρότερονን ያሳያል። «እርሱ» የግሪኩን ተውላጠ ስም ሳይተካ ይጠብቃል።
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: ከእነርሱም አንዱ የነበረው
  rationale: ይህ ሐረግ ኒቆዲሞስ የቡድኑ አባል መሆኑን የጀርባ መረጃ አድርጎ ይገልጣል፤ እንደ ምክንያት በመተርጎም ትርጉሙን አያሰፋም።
theological_decisions:
- issue: በ«ወደ እርሱ» ውስጥ ያለው αὐτόν ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ «እርሱ» ተብሎ ተጠብቋል፤ በአውዱ ኢየሱስን ያመለክታል።
  alternative: በዋናው ጽሑፍ «ወደ ኢየሱስ» ብሎ በግልጽ መጻፍ።
  rationale: ዮሐንስ 3፥1-2 ኒቆዲሞስ ወደ ኢየሱስ እንደመጣ ያሳያል። ሆኖም የግሪኩ ጽሑፍ ስሙን ሳይደግም ተውላጠ ስም ስለሚጠቀም፣ ትርጉሙም ይህን ቅርጽ ጠብቋል።
translation_notes:
