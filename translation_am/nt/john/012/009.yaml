base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: am
  text: ስለዚህ ከአይሁድ[a] መካከል የነበረ ብዙ ሕዝብ ኢየሱስ በዚያ እንዳለ አወቀ፤ እነርሱም የመጡት በኢየሱስ ምክንያት ብቻ ሳይሆን፣ እርሱ ከሙታን ያስነሣውን አልዓዛርንም ለማየት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አይሁድ” ተብሎ የተተረጎመው የግሪክ ቃል በአጠቃላይ የአይሁድን ሕዝብ፣ ወይም በዮሐንስ ወንጌል በአንዳንድ ዐውዶች በተለይ “የይሁዳ ሰዎችን” ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: አወቀ
  rationale: የግሪኩ አዮሪስት እዚህ መረጃውን ማወቅን ወይም መስማትን ያመለክታል፤ ‘አወቀ’ በአማርኛ ትረካ ተፈጥሯዊ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ክፍል ጋር ያለውን የውጤትና የትረካ ትስስር ይጠብቃል።
- source_word: ὄχλος πολὺς
  choice: ብዙ ሕዝብ
  rationale: ብዙ ሰዎች ያሉበትን ስብስብ የሚገልጽ የተለመደና የተከበረ አማርኛ ነው።
- source_word: ἐκ τῶν Ἰουδαίων
  choice: ከአይሁድ መካከል
  rationale: ἐκ የሚገልጸውን ከአንድ ሰፊ ማኅበረሰብ የወጣ ክፍል የሚል ሐሳብ በግልጽ ያሳያል፤ Ἰουδαῖοι የሚለው ቃል ግን በዮሐንስ አንዳንድ ጊዜ ‘የይሁዳ ነዋሪዎች’ ሊል የሚችል በመሆኑ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: ኢየሱስ በዚያ እንዳለ
  rationale: በግሪኩ ያልተገለጸው ባለቤት ከዐውዱ ኢየሱስ መሆኑ ግልጽ ስለሆነ በአማርኛ ለግልጽነት ተጠቅሷል፤ የግሪኩም የአሁን ጊዜ ቅርጽ ‘እንዳለ’ ተጠብቋል።
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: በኢየሱስ ምክንያት ብቻ ሳይሆን
  rationale: διά ከተሳቢ ሁኔታ ጋር የምክንያትን ወይም የአነሳሽነትን ሐሳብ ያሳያል።
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: አልዓዛርንም ለማየት
  rationale: የንጽጽርና የዓላማ ኃይሉን በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጻል።
- source_word: Λάζαρον
  choice: አልዓዛር
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: እርሱ ከሙታን ያስነሣውን
  rationale: ἐγείρω በዚህ ዐውድ አልዓዛርን ወደ ሕይወት መመለስን ያመለክታል፤ አንጻራዊው አረፍተ ነገር ከስሙ በፊት በመቅረቡ ተፈጥሯዊ አማርኛ ሆኗል።
