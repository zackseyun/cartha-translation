  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: am
  text: “ማንም ቢያገለግለኝ[a] ይከተለኝ፤ እኔ ባለሁበት ስፍራ፣ አገልጋዬም በዚያ ይሆናል። ማንም ቢያገለግለኝ አብ ያከብረዋል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው “ማንም ቢያገለግለኝ… አብ ያከብረዋል” የሚለው አገላለጽ ሰዋሰዋዊ ነጠላ ቅጽ ያለው ቢሆንም ማንኛውንም ሰው ያመለክታል።
    reason: የግሪክኛውን አጠቃላይ ነጠላ አወቃቀርና አካታች ትርጉሙን ለማብራራት።
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: ቢያገለግለኝ
  rationale: ግሱ ኢየሱስን ማገልገልን ያመለክታል። “ማገልገል” ተፈጥሯዊና ሰፊ ትርጉም ያለው ሲሆን ለቤተ ክርስቲያን ሹመት የተወሰነ አይደለም።
- source_word: ἀκολουθείτω
  choice: ይከተለኝ
  rationale: የግሪክኛውን የትእዛዝ ኃይል በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል፤ በዐውዱም የደቀ መዝሙርነት መከተልን ያመለክታል።
- source_word: διάκονος
  choice: አገልጋዬ
  rationale: እዚህ ቃሉ ኢየሱስን የሚያገለግልን ሰው በአጠቃላይ ይጠቅሳል እንጂ የተወሰነ የቤተ ክርስቲያን ማዕረግን አያመለክትም።
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: እኔም ባለሁበት ቦታ
  rationale: ግልጽ የሆነውን ἐγώ በ“እኔም” በማሳየት አጽንዖቱን ይጠብቃል፤ “ቦታ” መጨመሩም በአማርኛ አገላለጹን ተፈጥሯዊ ያደርገዋል።
- source_word: ἐκεῖ καὶ
  choice: ደግሞ በዚያ
  rationale: ἐκεῖ የሚያመለክተውን ስፍራና καί የሚያሳየውን ጭማሪ በግልጽ ይጠብቃል።
- source_word: τιμήσει
  choice: ያከብረዋል
  rationale: ቃሉ ክብር መስጠትን ያመለክታል፤ የወደፊቱን ተስፋ ሳያሰፋ ወይም ሳይገድብ በቀጥታ ያስተላልፋል።
- source_word: ὁ πατήρ
  choice: አብ
  rationale: ግሪክኛው “አብ” ይላል እንጂ “አባቴ” አይልም፤ ስለዚህ በምንጩ የሌለ አገናዛቢ አልተጨመረም።
- source_word: τις / αὐτόν
  choice: ማንም / ያከብረዋል
  rationale: “ማንም” የτιςን አጠቃላይ ኃይል ያስተላልፋል፤ በ“ያከብረዋል” ያለው ነጠላ የተሳቢ ቅጥ ደግሞ ወደዚያው ግለሰብ የሚመለሰውን αὐτόν ይወክላል።
theological_decisions:
- issue: በሁኔታዊው አረፍተ ነገር ያለው አጠቃላይ ነጠላ ማጣቀሻ
  choice: τιςን “ማንም” በማለት፣ αὐτόνንም በነጠላው “ያከብረዋል” በማለት መተርጎም
  alternative: ንግግሩን ወደ ብዙ ቁጥር በመቀየር ፆታን ሙሉ በሙሉ ገለልተኛ ማድረግ
  rationale: ይህ አማርኛ ማንኛውንም ሰው የሚያካትተውን ትርጉም እየጠበቀ የግሪክኛውን ነጠላ አወቃቀር ያቆያል።
- issue: አብ ለአገልጋዩ የሚሰጠው ክብር ምንነት
  choice: “አብ ያከብረዋል” ብሎ ቃል ኪዳኑን ሳያብራራ ማቅረብ
  alternative: ክብሩን በዋናው ጽሑፍ ውስጥ በተለይ እንደ ሰማያዊ ሽልማት ወይም እንደ መጨረሻው ክብር መተርጎም
  rationale: ቁጥሩ የክብሩን ትክክለኛ መልክ አይገልጽም፤ ስለዚህ የምንጩ ሥነ መለኮታዊ ስፋት ተጠብቋል።
- issue: አገልጋይ ከኢየሱስ ጋር ባለበት መሆን
  choice: የስፍራውንና የኅብረቱን አገላለጽ በቀጥታ ማቆየት
  alternative: በዋናው ጽሑፍ ይህን ለሰማይ ወይም ለወደፊቱ ዘመን ብቻ መወሰን
  rationale: ዐውዱ ወደ ኢየሱስ ሞትና ክብር ይጠቁማል፣ ነገር ግን ይህ አጭር አረፍተ ነገር ስፍራውን በግልጽ አይሰይምም።
