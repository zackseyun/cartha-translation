base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: am
  text: አሁን የዚህ ዓለም ፍርድ ነው፤ አሁን የዚህ ዓለም ገዥ[a][b] ወደ ውጭ ይጣላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የዚህ ዓለም አለቃ»።
    reason: lexical_alternative
  - marker: b
    text: «የዚህ ዓለም ገዥ» የሚለው አገላለጽ በተለምዶ ሰይጣንን እንደሚያመለክት ይታሰባል።
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: አሁን
  rationale: በሁለቱም ስፍራ የግሪኩን የጊዜ አጽንዖትና ትይዩ አወቃቀር ለመጠበቅ «አሁን» ተደግሟል።
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: ይህ ዓለም የሚፈረድበት ጊዜ ነው
  rationale: ቃል በቃል «የዚህ ዓለም ፍርድ ነው» የሚለው በአማርኛ የተፈጥሮ አነጋገር ስላልሆነ፣ κρίσις እዚህ የሚያመለክተው በዓለም ላይ የሚደረገውን ወሳኝ ፍርድ በግልጽና ተፈጥሯዊ አገላለጽ ተላልፏል።
- source_word: κόσμου τούτου
  choice: ይህ ዓለም / የዚህ ዓለም
  rationale: τοῦτοῦ የሚሰጠውን አመልካች አጽንዖትና በዮሐንስ የሚታየውን የአሁኑ ዓለም ሥርዓት ንጽጽር ለመጠበቅ «ይህ ዓለም» ተብሏል።
- source_word: ἄρχων
  choice: ገዥ
  rationale: ሥልጣን የሚያካሂድን አካል በዘመናዊና ግልጽ አማርኛ ያመለክታል፤ «አለቃ» እንደ ትርጉም አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐκβληθήσεται ἔξω
  choice: ወደ ውጭ ይጣላል
  rationale: የወደፊት ጊዜ ተገብሮ ቅርጹንና ἔξω የሚጨምረውን የማስወገድ አጽንዖት ይጠብቃል።
theological_decisions:
- issue: የ«ዚህ ዓለም ገዥ» ማንነት
  choice: በዋናው ጽሑፍ ማንነቱን ሳይጨምር «የዚህ ዓለም ገዥ» ተብሎ ቀርቧል።
  alternative: ሰይጣን/ዲያብሎስ፣ ወይም የአሁኑ ዓለም ሥርዓት በሰው አምሳል ተገልጦ
  rationale: በዮሐንስ አውድ ይህ ስያሜ በሰፊው ሰይጣንን እንደሚያመለክት ቢታወቅም፣ የግሪኩ ጽሑፍ ስሙን ሳይጠቅስ ማዕረጉን ብቻ ይጠቀማል። ስለዚህ ዋናው ጽሑፍ ይህንኑ የአገላለጽ ውጥረት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ«አሁን» ድግግሞሽና የሁለቱ አረፍተ ነገሮች ትይዩነት ተጠብቋል።
