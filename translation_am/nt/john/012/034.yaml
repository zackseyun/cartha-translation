  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: am
  text: ስለዚህም ሕዝቡ እንዲህ ብሎ መለሰለት፦ “እኛ መሲሑ[a] ለዘላለም እንደሚኖር ከሕጉ ሰምተናል፤ ታዲያ አንተ፣ ‘የሰው ልጅ ከፍ ሊደረግ[b] ግድ ነው’ እንዴት ትላለህ? ይህ የሰው ልጅ ማን ነው?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ “ክርስቶስ”፤ እዚህ ቃሉ እንደ ማዕረግ ስለሚያገለግል “መሲሑ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
  - marker: b
