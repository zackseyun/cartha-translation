review_pass:
  verdict: revise
  source_fidelity: 'The core sense is retained: many among the authorities believed in Jesus, yet did not openly acknowledge him because of the Pharisees, in order to avoid synagogue exclusion. However, “እምነታቸውን አይገልጹም” makes the implicit object an abstract ‘their faith’; the immediate referent of ὡμολόγουν is more directly Jesus. “መሪዎቹ” is also somewhat broader than ἄρχοντες in this setting.'
  naturalness: The draft is generally clear and dignified. Recasting the sequence to follow the Greek contrast and using “እርሱን አይመሰክሩም ነበር” is more idiomatic and precise in modern standard Amharic.
  terminology: “ባለሥልጣናት” better conveys the relevant leading authorities than the generic “መሪዎች.” “መሰከሩ” appropriately renders public acknowledgment/confession without deciding the theological quality of their belief. “ከምኩራብ መገለል” preserves the social-religious exclusion denoted by ἀποσυνάγωγος.
  issues:
  - severity: medium
    issue: The draft renders οὐχ ὡμολόγουν as “እምነታቸውን አይገልጹም ነበር.”
    rationale: Although the Greek object is implicit, the context points directly to Jesus. Rendering it as an abstract confession of their faith is interpretively broader and less direct than acknowledging/confessing him.
  - severity: low
    issue: “መሪዎቹ” is somewhat generic for ἄρχοντες.
    rationale: In this Johannine context the term denotes persons with authority; “ባለሥልጣናቱ” more accurately conveys this while remaining natural.
