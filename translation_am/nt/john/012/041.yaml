  rationale: δόξα በዮሐንስ አውድ ያለውን ከባድ ሃይማኖታዊ ፍቺ 'ክብር' ይጠብቃል፤ የባለቤትነት ተውላጠ ስሙም በ'ክብሩን' ውስጥ ተካትቷል።
- source_word: ἐλάλησεν
