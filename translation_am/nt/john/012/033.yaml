lexical_decisions:
- source_word: τοῦτο
  choice: ይህን
  rationale: ነጠላ ገለልተኛ አመልካች ተውላጠ ስም ሲሆን ኢየሱስ ቀደም ሲል የተናገረውን ይመለከታል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ ጠንካራ ተቃርኖን ሳይሆን ለስላሳ ትስስርን ያሳያል፤ በአማርኛ ከ‘ይህን’ ጋር የተያያዘው ‘-ም’ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἔλεγεν
