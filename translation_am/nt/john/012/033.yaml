  rationale: የግሪኩን ያልተጠናቀቀ የኃላፊ ጊዜ አኳኋን በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: σημαίνων
  choice: ለማመልከት
  rationale: አንድን ነገር በምልክት ወይም በንግግር ማሳወቅን ያሳያል፤ የዮሐንስን የቃሉን አጠቃቀም ይጠብቃል።
- source_word: ποίῳ θανάτῳ
  choice: ምን ዓይነት ሞት
  rationale: የሞቱን መንገድ ወይም ዓይነት ያመለክታል፤ ዋናው ጽሑፍ ቀላልና ተፈጥሯዊ እንዲሆን ያለ ‘በ’ ቀርቧል፣ የመንገድ አጽንዖቱም በማስታወሻ ተጠብቋል።
- source_word: ἤμελλεν
  choice: ሊሞት እንደነበረ
  rationale: በዚህ አውድ የሚመጣውን ሞት ያመለክታል፤ ‘ተወስኖለት ነበር’ የሚል ከቃሉ በላይ የሆነ ሥነ መለኮታዊ ትርጉም አያስገባም።
- source_word: ἀποθνῄσκειν
  choice: ሊሞት
  rationale: ከἤμελλεν ጋር የተያያዘውን የግሥ ማሟያ በተፈጥሯዊ አማርኛ ያቀርባል።
