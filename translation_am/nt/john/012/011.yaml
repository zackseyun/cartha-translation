  verdict: revise
  source_fidelity: The draft correctly represents the causal ὅτι, the partitive sense of πολλοὶ τῶν Ἰουδαίων, Lazarus as the referent of δι’ αὐτόν, and belief directed toward Jesus. However, the coordinated imperfect verbs are more clearly represented in Amharic with parallel finite habitual/past forms than with a progressive participle followed by a finite verb.
