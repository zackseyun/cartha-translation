    rationale: Using “እየሄዱ” with “ያምኑ ነበር” does not parallel the Greek coordinated imperfects as naturally as two finite forms.
  - severity: medium
    issue: Footnote c’s first alternative is potentially ambiguous in Amharic.
    rationale: “ይታመኑ” may be understood passively. “ይተማመኑ” more clearly expresses trusting/relying on Jesus.
