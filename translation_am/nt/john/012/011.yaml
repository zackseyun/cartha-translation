  alternative: በኢየሱስ ይታመኑ ነበር፤ እምነታቸውን በኢየሱስ ላይ ያደርጉ ነበር
  rationale: ግሪኩ ወደ ኢየሱስ የተመራ እምነትን ይገልጻል፤ ‘ደቀ መዛሙርት ሆኑ’ ወይም ‘ዳኑ’ የሚል ጽሑፉ ያልገለጸው ውጤት አልተጨመረም።
