  terminology: “አይሁድ,” “ኢየሱስ,” and “በኢየሱስ ያምኑ” are appropriate. The lexical footnote should avoid “ይታመኑ,” which can be read as passive (‘be trusted’) in Amharic; a clearer alternative is “በኢየሱስ ይተማመኑ ነበር.”
