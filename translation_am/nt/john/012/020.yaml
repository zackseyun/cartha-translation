  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: am
  text: በበዓሉ ለማምለክ ከሚወጡት መካከል አንዳንድ ግሪኮች ነበሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተወሰኑ ግሪኮች።” እነዚህ በበዓሉ ለማምለክ የመጡ አይሁድ ያልሆኑ ሰዎች ሊሆኑ ይችላሉ፤ ጽሑፉ ግን ሃይማኖታዊ ሁኔታቸውን በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ነበሩ
  rationale: ἦσαν የመኖርን ሁኔታ ይገልጻል፤ δέ ደግሞ ለስላሳ የንግግር ሽግግር ስለሆነ በአማርኛው የዓረፍተ ነገሩ አወቃቀር በቂ ሁኔታ ተሸክሞታል።
- source_word: Ἕλληνές τινες
  choice: አንዳንድ ግሪኮች
  rationale: Ἕλληνες በቀጥታ ግሪኮችን ያመለክታል፤ τινες የተወሰኑ ነገር ግን በስም ያልተጠቀሱ ሰዎች መሆናቸውን ይገልጻል። 'አሕዛብ' ማለት የምንጩን የዘርና የባህል መጠሪያ ከሚገባው በላይ ያጠቃልላል።
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: ወደ ኢየሩሳሌም ከሚወጡት መካከል
  rationale: ἐκ የቡድኑ አካል መሆናቸውን ያሳያል፤ ἀναβαινόντων ወደ ኢየሩሳሌም የሚደረገውን የበዓል ጉዞ 'መውጣት' በሚለው የተለመደ አገላለጽ ያቀርባል። መድረሻው በጥቅሱ ውስጥ በስም ባይጠቀስም የአውዱ ግልጽ መድረሻ ስለሆነ ለተፈጥሯዊ አማርኛ ተገልጿል።
- source_word: ἵνα προσκυνήσωσιν
  choice: ለማምለክ
  rationale: ἵνα ከንዑስ አንቀጹ ጋር ዓላማን ይገልጻል፤ προσκυνέω በዚህ አውድ ለእግዚአብሔር የሚቀርብ አምልኮን እንጂ ተራ አካላዊ መስገድን አያመለክትም።
- source_word: ἐν τῇ ἑορτῇ
  choice: በበዓሉ ጊዜ
  rationale: ἑορτή በዮሐንስ አውድ የአይሁድን የበዓል ወቅት ያመለክታል፤ 'በበዓሉ ጊዜ' ἐν የሚገልጸውን የጊዜ/አጋጣሚ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የἝλληνες ማንነት
  choice: '''ግሪኮች'' የሚለውን የዘርና የባህል መጠሪያ ማቆየት'
  alternative: '''አሕዛብ'' ብሎ ማጠቃለል፣ ወይም ግሪክኛ ተናጋሪ አይሁድ፣ ወደ አይሁድነት የገቡ ሰዎች ወይም እግዚአብሔርን የሚፈሩ አሕዛብ እንደሆኑ መወሰን'
  rationale: ምንጩ Ἕλληνες ብሎ ይጠራቸዋል፤ በበዓሉ ለማምለክ መምጣታቸውን ቢገልጽም ሃይማኖታዊ ሁኔታቸውን አይወስንም። ትርጉሙ ይህን ግልጽ ያልሆነ ሁኔታ አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። 'ወደ ኢየሩሳሌም መውጣት' የመጽሐፍ ቅዱስን የሐጅ ጉዞ አገላለጽ ይጠብቃል፤ የግሪኮቹን ትክክለኛ ሃይማኖታዊ ማንነት አይወስንም።
