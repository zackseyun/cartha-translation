review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the existential statement, the indefinite designation “some Greeks,” the group relationship expressed by ἐκ, the purpose of worship, and the feast setting. However, it inserts “ወደ ኢየሩሳሌም” (“to Jerusalem”), which is not stated in this verse. Although Jerusalem is supplied by the wider narrative and is implicit in the pilgrimage idiom, it should not be added in an optimal-equivalence rendering of this verse.
  naturalness: With the unsupported destination removed, the sentence is natural, clear modern standard Amharic. “በበዓሉ ለማምለክ” naturally conveys worship at the feast.
  terminology: “አንዳንድ ግሪኮች” appropriately preserves Ἕλληνές τινες without generalizing it to “Gentiles.” “ለማምለክ” is suitable for προσκυνήσωσιν in this religious context. The note appropriately retains uncertainty about the Greeks’ religious identity.
  issues:
  - severity: medium
    issue: The translation adds “ወደ ኢየሩሳሌም” (“to Jerusalem”).
    rationale: The Greek says only that they were among those “going up” (ἐκ τῶν ἀναβαινόντων). Jerusalem may be inferable from context, but it is not named in John 12:20 and should not be made explicit in the verse translation.
  revised_text: በበዓሉ ለማምለክ ከሚወጡት መካከል አንዳንድ ግሪኮች ነበሩ።[a]
  revised_footnotes:
