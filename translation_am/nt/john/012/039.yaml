  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: am
  text: ስለዚህ ማመን አልቻሉም፤ ምክንያቱም ኢሳይያስ ደግሞ እንዲህ ብሏል፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የቀደመውን አውድ ከሚከተለው የእምነት አለመቻል ጋር በግልጽ የምክንያት ግንኙነት ያያይዛል።
- source_word: οὐκ ἠδύναντο
  choice: አልቻሉም
  rationale: የግሪኩን የአለመቻል ፍቺ በቀጥታ ያስተላልፋል፤ ‘አልፈለጉም’ በማለት ወደ ፈቃድ ጉዳይ አያለዝበውም።
- source_word: πιστεύειν
  choice: ማመን
  rationale: በዮሐንስ አጠቃቀም የግሱን ቀጥተኛና ተፈጥሯዊ ፍቺ ይይዛል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቀጣዩ የኢሳይያስ ጥቅስ ለተጠቀሰው አለመቻል ምክንያት ሆኖ መቅረቡን ያሳያል።
- source_word: πάλιν
  choice: ደግሞ
  rationale: ከቀደመው ጥቅስ በኋላ ሌላ የኢሳይያስ ንግግር መጨመሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπεν
  choice: ብሏል
  rationale: ያለፈውን የነቢዩን ንግግር አሁንም ባለ ሥልጣን ጥቅስ አድርጎ በሚያቀርብ ተፈጥሯዊ የአማርኛ የጥቅስ መግቢያ ተተርጉሟል።
- source_word: Ἠσαΐας
  choice: ኢሳይያስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የነቢዩ ስም ነው።
theological_decisions:
- issue: የማመን አለመቻላቸው ባሕርይ
  choice: ‘ማመን አልቻሉም’ ተብሎ አለመቻሉ በቀጥታ ተጠብቋል።
  alternative: ‘ማመን አልፈለጉም’ ብሎ ወደ አለመፈለግ ማለዘብ።
  rationale: ግሪኩ አለመቻልን ይገልጻል። ሆኖም ይህ አለመቻል እንዴት እንደሚሠራና ከሰው ኃላፊነት ጋር ያለው ግንኙነት በትርጉሙ ውስጥ በአንድ የእምነት ሥርዓት መሠረት አልተፈታም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የጥቅስ መግቢያው ቀጣዩን ቁጥር ስለሚከፍት ‘እንዲህ ብሏል፦’ ተብሏል። የግሪኩ የምክንያት ቅደም ተከተልና የአለመቻል ውጥረት ተጠብቀዋል።
