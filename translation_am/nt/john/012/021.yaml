  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: am
  text: እነዚህም ከገሊላ ከምትገኘው ቤተ ሳይዳ የመጣውን ፊልጶስን ቀርበው፣ “ጌታ ሆይ፣ ኢየሱስን ማየት እንፈልጋለን” እያሉ ይጠይቁት ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌታ ሆይ” የሚለው “ክቡር ሆይ” ወይም “ጌታዬ” የሚል የአክብሮት አነጋገርም ሊሆን ይችላል። የግሪኩ κύριε አንድን ሰው በአክብሮት ለመጥራትም፣ “ጌታ” ብሎ ለመጥራትም ሊያገለግል ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: ስለዚህ እነዚህ
  rationale: የኋላ አመልካቹንና የትረካውን ትስስር ይጠብቃል፤ ‘እነዚህ’ በቀደመው ቁጥር የተጠቀሱትን ግሪኮች ያመለክታል።
- source_word: προσῆλθον
  choice: ቀርበው
  rationale: ወደ አንድ ሰው መቅረብን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: በገሊላ ካለችው ከቤተ ሳይዳ የነበረውን
  rationale: የፊልጶስን መገኛ ቦታ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: ἠρώτων
  choice: እያሉ ጠየቁት
  rationale: የግሪኩ ኢምፐርፌክት የቀጣይነት ገጽታ በ‘እያሉ’ ግንባታ በከፊል ተጠብቋል፣ ዋናው ግስም ተፈጥሯዊ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የκύριοςን መደበኛ መዛግብታዊ አቻ ይጠብቃል፤ በዚህ አውድ ግን ለፊልጶስ የቀረበ የአክብሮት አነጋገር ሊሆን ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- source_word: θέλομεν τὸν Ἰησοῦν ἰδεῖν
  choice: ኢየሱስን ማየት እንፈልጋለን
  rationale: ፍላጎቱንና የ‘ማየት’ን ቀጥተኛ ትርጉም ሳይተረጉም ወደ ‘መገናኘት’ ወይም ‘መነጋገር’ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ለፊልጶስ በቀጥታ የተነገረው κύριε
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ሆይ የሚያህል የአክብሮት አጠራር
  rationale: ቃሉ ‘ጌታ’ የሚለውን መደበኛ ትርጉም ቢኖረውም፣ እዚህ ለኢየሱስ ሳይሆን ለፊልጶስ የተነገረ በመሆኑ የክርስቶሳዊ ማዕረግ መግለጫ ነው ተብሎ አይወሰንም፤ አውዳዊው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ ነው። ‘ማየት’ የሚለው የምንጩን ሆን ተብሎ ያልተወሰነ ስፋት ይጠብቃል፤ ‘ጌታ ሆይ’ የሚለው አውዳዊ አሻሚነት በማስታወሻ ተብራርቷል።
