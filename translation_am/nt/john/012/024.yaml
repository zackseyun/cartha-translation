  text: እውነት፣ እውነት እላችኋለሁ፤ የስንዴ ቅንጣት በመሬት ውስጥ ወድቆ ካልሞተ፣ ብቻውን ይቀራል[a]፤ ቢሞት ግን[b]፣ ብዙ ፍሬ ያፈራል።
  philosophy: optimal-equivalence
  footnotes:
