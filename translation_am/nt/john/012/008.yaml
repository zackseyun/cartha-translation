language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: am
  text: ድሆች ሁልጊዜ ከእናንተ ጋር አሉና፤ እኔ ግን ሁልጊዜ ከእናንተ ጋር የለሁም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πτωχούς
  choice: ድሆች
  rationale: በግሪክ ጽሑፉ ቅጽሉ እንደ ስም ሆኖ ድሆችን በአጠቃላይ ይጠቁማል፤ «ድሆች» ይህን በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: γάρ
  choice: -ና
  rationale: γάρ ከቀደመው ንግግር ጋር የማብራሪያ ምክንያት ግንኙነት ይፈጥራል፤ በአማርኛ በግሱ ላይ የተጨመረው «-ና» ይህን ግንኙነት ተፈጥሯዊ ሆኖ ያሳያል።
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: በሁለቱም ሐረጎች የቀጣይ መገኘትን ወይም የጊዜ ተደራሽነትን ያሳያል፤ «ሁልጊዜ» ግልጽና ዘመናዊ አቻ ነው።
- source_word: ἔχετε
  choice: አሉ / አልሆንም
  rationale: ግሱ እዚህ ባለቤትነትን ሳይሆን ከአንድ ሰው ጋር መገኘትን ያመለክታል። ቃል በቃል «አላችሁ» ከማለት ይልቅ፣ «ከእናንተ ጋር አሉ» እና «ከእናንተ ጋር አልሆንም» በአማርኛ ትርጉሙን ተፈጥሯዊ ሁኔታ ያስተላልፋሉ።
- source_word: μεθ’ ἑαυτῶν
  choice: ከእናንተ ጋር
  rationale: ሐረጉ በተናጋሪዎቹ ኅብረትና አጠገብ መገኘትን ያመለክታል፤ «ከእናንተ ጋር» ተፈጥሯዊው የአማርኛ አገላለጽ ነው።
- source_word: ἐμέ
  choice: እኔ
  rationale: የተጠናከረው የመጀመሪያ ሰው ተውላጠ ስም ኢየሱስን ያመለክታል፤ በአማርኛው የሐረግ አወቃቀር «እኔ» የንጽጽሩ ተሳቢ ሆኖ ቀርቧል።
- source_word: δέ
  choice: ግን
  rationale: የድሆችን ቀጣይ መገኘት ከኢየሱስ ውሱን የአብሮነት ጊዜ ጋር ያነጻጽራል፤ «ግን» ይህን ንጽጽር ግልጽ ያደርጋል።
- source_word: οὐ πάντοτε
  choice: ሁልጊዜ … አልሆንም
  rationale: አሉታዊው አገላለጽ በሁሉም ጊዜ አብሮ አለመኖርን ያሳያል፤ ይህ የአማርኛ አወቃቀር ሐሳቡን ያለ ተጨማሪ ትርጓሜ ያቀርባል።
theological_decisions:
- issue: ንግግሩ ለድሆች የሚደረገውን እንክብካቤ እንደሚያሳንስ ተደርጎ ሊወሰድ መቻሉ
  choice: በድሆች ቀጣይ መገኘትና በኢየሱስ ውሱን የአብሮነት ጊዜ መካከል ያለውን ንጽጽር ብቻ በቀጥታ ማቅረብ
  alternative: ድሆች ከኢየሱስ ያነሰ አስፈላጊ እንደሆኑ በትርጉም መጨመር፣ ወይም ንጽጽሩን ማለዘብ
  rationale: የግሪክ ጽሑፉ የመገኘትና የጊዜ ንጽጽር ያደርጋል፤ ለድሆች እንክብካቤ አስፈላጊ አይደለም አይልም። ስለዚህ ትርጉሙ ንጽጽሩን ይጠብቃል እንጂ ያልተነገረ የሥነ መለኮት ድምዳሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ድሆች» በአማርኛ በተፈጥሮው ስማዊ አገልግሎት ስላለው፣ የእንግሊዝኛውን lexical-alternative የግርጌ ማስታወሻ ማስተላለፍ አላስፈለገም።
