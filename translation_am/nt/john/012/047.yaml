  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: am
  text: ማንም ቃሎቼን ሰምቶ ባይጠብቃቸው፣ እኔ በእርሱ[b] ላይ አልፈርድም[a]፤ ዓለምን ለማዳን እንጂ በዓለም ላይ ለመፍረድ አልመጣሁምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አላወግዘውም።” የግሪኩ ግስ “መፍረድ” ማለት ሲሆን፣ በዚህ ዐውድ ክፉ ውሳኔ ወይም ውግዘት የመስጠትን ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል በቀጥታ “እርሱ” ይላል፤ ነገር ግን አጠቃላይ ኃይል ስላለው የኢየሱስን ቃሎች ሰምቶ የማይጠብቅን ማንኛውንም ሰው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: ማንም … ባይ-
  rationale: የግሪኩን ክፍትና አጠቃላይ የሆነ ሁኔታዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀκούσῃ
  choice: ሰምቶ
  rationale: መሠረታዊውን ‘መስማት’ ትርጉም ይጠብቃል፤ በትኩረት ማዳመጥን በተጨማሪ አያስገባም።
- source_word: τῶν ῥημάτων μου
  choice: ቃሎቼን
  rationale: የኢየሱስን የተነገሩ ቃላት በአጭር፣ ተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: φυλάξῃ
  choice: ባይጠብቃቸው
  rationale: φυλάσσω ያለውን የመጠበቅ፣ የመያዝና በታማኝነት የመፈጸም ሰፊ የትርጉም ክልል ይጠብቃል፤ ‘ባይታዘዛቸው’ ከሚለው ያነሰ ጠባብ ነው።
- source_word: οὐ κρίνω αὐτόν
  choice: በእርሱ ላይ አልፈርድም
  rationale: κρίνωን ‘መፍረድ’ በሚለው ቃል በመተርጎም ከቀጣዩ የዓላማ ሐረግ ጋር ያለውን የቃል ድግግሞሽ ይጠብቃል። ‘አላወግዘውም’ የሚለው አማራጭ ክፉ ውሳኔን ይበልጥ ያጠባል።
- source_word: ἦλθον
  choice: አልመጣሁም
  rationale: የኢየሱስን መምጣትና ተልዕኮ በአጠቃላይ የሚገልጠውን የግሪክ አኦሪስት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἵνα κρίνω τὸν κόσμον
  choice: በዓለም ላይ ለመፍረድ
  rationale: ἵνα የሚገልጠውን ዓላማ በ‘ለመ-’ አወቃቀር ያቀርባል፤ κόσμοςንም በዮሐንስ ወንጌል የተለመደው ‘ዓለም’ ይላል።
- source_word: ἵνα σώσω τὸν κόσμον
  choice: ዓለምን ለማዳን
  rationale: σῴζω ያለውን ዋና የማዳን ትርጉም ይጠብቃል፤ ከመፍረድ ዓላማ ጋር ያለውን ንፅፅርም ግልጽ ያደርጋል።
theological_decisions:
- issue: ‘በእርሱ ላይ አልፈርድም’ የሚለው ከሌሎች የዮሐንስ የፍርድ ንግግሮች ጋር ያለው ውጥረት
  choice: κρίνωን በሁለቱም ቦታ ‘መፍረድ’ ብሎ መተርጎምና የጊዜውን/የተልዕኮውን ልዩነት ለዐውዱ መተው
  alternative: ‘አላወግዘውም’ ማለት ወይም ‘አሁን አልፈርድበትም’ ብሎ በግልጽ መጨመር
  rationale: ጥቅሱ የኢየሱስን የመምጣቱን ዋና ዓላማ ማዳን እንደሆነ ይናገራል። ጽሑፉ ያልገለጸውን ‘አሁን’ ሳይጨምር ከሌሎች የፍርድ ንግግሮች ጋር ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
- issue: αὐτόν የተባለው ነጠላ ተባዕታይ ተውላጠ ስም አጠቃላይ ኃይል
  choice: በዋናው ጽሑፍ ‘በእርሱ ላይ’ ብሎ ማቅረብና አጠቃላይ ኃይሉን በማስታወሻ መግለጽ
  alternative: ‘በዚያ ሰው ላይ’ ብሎ በፆታ ያልተወሰነ አገላለጽ መጠቀም
  rationale: ይህ የግሪኩን ሰዋሰዋዊ ቅርጽ ይጠብቃል፤ ሆኖም ንግግሩ ወንዶችን ብቻ እንደማያመለክት ማስታወሻው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘…እንጂ …አልመጣሁምና’ የሚለው አወቃቀር የግሪኩን οὐ … ἀλλά ንፅፅርና γάρ የሚሰጠውን ምክንያታዊ ግንኙነት በተፈጥሯዊ ሁኔታ ያስተላልፋል።
