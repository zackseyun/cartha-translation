base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: am
  text: ሕዝቡም ይህን ምልክት እንዳደረገ ስለሰሙ፣ በዚህ ምክንያት ሊገናኙት[a] ወጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተገናኙት።” የግሪኩ ግስ አንድን ሰው ለመገናኘት ወደ እርሱ የመሄድን ሐሳብ ይዟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: በዚህም ምክንያት
  rationale: የቀደመውን ዐውደ ንባብ ከሕዝቡ ድርጊት ጋር የሚያያይዘውን ግልጽ የምክንያት ኃይል ይጠብቃል፤ የ‘ም’ ቅጥያውም καὶ ያለውን ጨማሪ ኃይል ያሳያል።
- source_word: ὑπήντησεν αὐτῷ
  choice: ሊቀበሉት ወጡ
  rationale: ግሱ ወደ አንድ ሰው ሄዶ የመገናኘትን አቅጣጫዊ ሐሳብ ይዟል። ‘ሊቀበሉት ወጡ’ በዘመናዊ አማርኛ ይህን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ὁ ὄχλος
  choice: ሕዝቡ
  rationale: በዐውደ ንባቡ ያለውን የተሰበሰበ ሕዝብ በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: ὅτι ἤκουσαν
  choice: ስለሰሙ
  rationale: ὅτι እዚህ የሕዝቡን ድርጊት ምክንያት ያስገባል፤ የአማርኛው ምክንያታዊ ቅርጽ ግንኙነቱን ግልጽ ያደርጋል።
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: ይህን ምልክት እንዳደረገ
  rationale: የተወሰነውን ቀደም ሲል የተጠቀሰ ተግባር ያመለክታል፤ ‘እንዳደረገ’ ከመስማት ግስ ጋር ተፈጥሯዊ የዘገባ አወቃቀር ነው።
- source_word: τὸ σημεῖον
  choice: ምልክት
  rationale: በዮሐንስ ወንጌል ተአምራዊው ተግባር ከራሱ አልፎ የኢየሱስን ማንነትና ተልእኮ እንደሚያመለክት የሚያሳየውን ልዩ የቃሉን ኃይል ይጠብቃል።
theological_decisions:
- issue: የዮሐንስን σημεῖον አተረጓጎም
  choice: ምልክት
  alternative: ተአምር
  rationale: ‘ምልክት’ የተግባሩን አስደናቂነት ብቻ ሳይሆን የሚያመለክተውን መገለጣዊ ፍቺ ይጠብቃል።
