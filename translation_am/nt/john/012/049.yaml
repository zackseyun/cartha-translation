source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: am
  text: እኔ ከራሴ[a] አልተናገርኩምና፤ ነገር ግን የላከኝ አብ ራሱ ምን እንድልና ምን እንድናገር[b] ትእዛዝ ሰጥቶኛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራሴ ተነሳሽነት” ወይም “በራሴ ሥልጣን።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ጽሑፍ “ማለት” እና “መናገር” የሚሉ ሁለት የተለያዩ ግሶችን ይጠቀማል፤ ትርጉሙም ይህን ልዩነት ጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: ከራሴ
  rationale: የግሪኩን ምንጭ የሚያመለክት አገላለጽ በቅርብ ይጠብቃል፤ ኢየሱስ በራሱ ተነሳሽነት ወይም ሥልጣን እንዳልተናገረ ያሳያል።
- source_word: οὐκ ἐλάλησα
  choice: አልተናገርኩም
  rationale: የግሪኩን ያለፈ ጊዜ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ እስከዚያ ድረስ ያደረገውን ንግግር ይመለከታል።
- source_word: ὁ πέμψας με πατήρ
  choice: የላከኝ አብ
  rationale: አሳታፊውን ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል፤ “አብ” በዮሐንስ አውድ የእግዚአብሔር መጠሪያ ነው።
- source_word: αὐτός
  choice: ራሱ
  rationale: በምንጩ ያለውን አጽንዖት በግልጽና በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: ἐντολήν
  choice: ትእዛዝ
  rationale: የቃሉን የሥልጣን ኃይል የሚጠብቅ ዘመናዊና ግልጽ ቃል ነው።
- source_word: δέδωκεν
  choice: ሰጥቶኛል
  rationale: የግሪኩን ፍጹም ጊዜ ውጤት ይጠብቃል፤ ትእዛዙ ቀድሞ ተሰጥቶ አሁንም ተግባራዊ መሆኑን ያሳያል።
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: ምን እንድልና ምን እንድናገር
  rationale: ከትእዛዝ ጋር ያለውን የዓላማ ንዑስ አረፍተ ነገር በተፈጥሯዊ አማርኛ ያቀርባል፤ የሁለቱን የግሪክ ግሶች ልዩነትም “ማለት” እና “መናገር” በማለት ይጠብቃል።
theological_decisions:
- issue: የወልድ ንግግር ከአብ ትእዛዝ ጋር ያለው ግንኙነት
  choice: ኢየሱስ ከራሱ እንዳልተናገረና በላከው አብ ትእዛዝ መሠረት እንደተናገረ ጽሑፉ በግልጽ ያስቀምጣል።
  alternative: ኢየሱስ ከአብ ራሱን ችሎ ነገር ግን ከእርሱ ጋር ተስማምቶ ተናገረ፤ ወይም እንደ ተራ ሰው ነቢይ ብቻ ተናገረ።
  rationale: “ከራሴ አልተናገርኩም” እና “የላከኝ አብ ... ትእዛዝ ሰጥቶኛል” የሚሉትን የተልእኮ ግንኙነት ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ይጠብቃል።
- issue: πατήρ የሚለው መጠሪያ
  choice: አብ
  alternative: አባት
  rationale: በዮሐንስ ወንጌል አውድ ቃሉ እግዚአብሔርን የሚያመለክት መለኮታዊ መጠሪያ ስለሆነ፣ “አብ” ግልጽና የተለመደ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አብ” እና “ትእዛዝ” በቤተ ክርስቲያናዊ አውድ የተለመዱ ሲሆኑ ጥንታዊ ወይም የቡድን ብቻ ቋንቋ አይደሉም።
