id: JHN.12.35
reference: John 12:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: am
  text: ስለዚህ ኢየሱስ እንዲህ አላቸው፦ “ብርሃኑ ገና ለጥቂት ጊዜ በመካከላችሁ[a] ነው። ጨለማው እንዳይደርስባችሁ፣ ብርሃን ሳላችሁ ተመላለሱ። በጨለማ የሚመላለስ ሰው ወዴት እንደሚሄድ አያውቅም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በውስጣችሁ” ወይም “ከእናንተ ጋር” ማለትም ሊሆን ይችላል። የግሪኩ ሐረግ ከአንድ በላይ መንገድ ሊተረጎም ይችላል፤ ሆኖም ኢየሱስ በዚያ ጊዜ በሕዝቡ መካከል በግልጽ መገኘቱን ከሚያሳየው የቅርብ አውድ ጋር “በመካከላችሁ” ይበልጥ ይስማማል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ውይይት ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ ያሳያል፤ አያያዙንም ከሚገባው በላይ አያጠናክርም።
- source_word: Ἔτι μικρὸν χρόνον
  choice: ገና ለጥቂት ጊዜ
  rationale: ἔτι ያለውን ‘ገና’ እና μικρὸν χρόνον ያለውን አጭር የጊዜ መጠን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ φῶς
  choice: ብርሃኑ
  rationale: የዮሐንስን ምሳሌያዊና ክርስቶሳዊ ክብደት ሳይተረጉም የብርሃንን ምስል በቀጥታ ይጠብቃል።
- source_word: ἐν ὑμῖν
  choice: በመካከላችሁ
  rationale: በቅርብ አውዱ ብርሃኑ ማለት ኢየሱስ በሕዝቡ መካከል ለተወሰነ ጊዜ መገኘቱን ያመለክታል። የ‘በውስጣችሁ’ እና ‘ከእናንተ ጋር’ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: περιπατεῖτε / ὁ περιπατῶν
  choice: ተመላለሱ / የሚመላለስ
  rationale: የግሪኩን ‘መራመድ’ ምስል ይጠብቃል፤ በአማርኛም የኑሮ አካሄድን ሊገልጽ የሚችል የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
- source_word: ὡς τὸ φῶς ἔχετε
  choice: ብርሃኑ ሳለላችሁ
  rationale: ὡςን በጊዜ አመልካች አገባብ ‘ሳለ’ ብሎ በመተርጎም የንግግሩን አስቸኳይነት ያሳያል።
- source_word: ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ
  choice: ጨለማው እንዳይውጣችሁ
  rationale: καταλάβῃ ያለውን የመድረስ፣ የመያዝ ወይም የማጥቃት ምስል ‘እንዳይውጣችሁ’ በሚል ተፈጥሯዊ አማርኛ ያቀርባል፤ ‘እንዳያሸንፋችሁ’ ከሚለውም በተሻለ የመያዝን ምስል ይጠብቃል።
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: ወዴት እንደሚሄድ አያውቅም
  rationale: የአቅጣጫውንና የእንቅስቃሴውን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘ብርሃኑ’ ጋር የተያያዘው ἐν ὑμῖν ትርጉም
  choice: በመካከላችሁ
  alternative: በውስጣችሁ፤ ከእናንተ ጋር
  rationale: የቅርብ ትረካው ኢየሱስ እንደ ዓለም ብርሃን በሕዝቡ መካከል የሚቆይበት ጊዜ ውስን መሆኑን ያመለክታል። ‘በመካከላችሁ’ ይህን ይጠብቃል፤ ነገር ግን ἐν ውስጣዊ ወይም አብሮነትን የሚገልጽ ፍቺ ሊኖረው ስለሚችል አማራጮቹ በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ብርሃን/ጨለማ’ እና ‘መመላለስ’ የሚሉት ዋና ምስሎች ሳይፈቱ ተጠብቀዋል፤ ትዕዛዙም ከዓላማ ሐረጉ በኋላ ከሚመጣው የግሪክ ቅደም ተከተል ይልቅ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ቀርቧል።
