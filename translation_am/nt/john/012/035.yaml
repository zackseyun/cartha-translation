review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the temporal limitation of the light, its presence among the listeners, and the final statement about not knowing one’s destination. However, “ጨለማው እንዳይውጣችሁ” does not convey καταλάβῃ (“overtake/catch up with”) and can suggest darkness rising. The command and purpose clause are also better retained in their source order.
  naturalness: “ሳለላችሁ” is not the natural form here; “ሳላችሁ” is idiomatic. “እንዳይደርስባችሁ” naturally expresses darkness coming upon or overtaking the hearers. “ተመላለሱ” is an acceptable established biblical-style rendering of the walking metaphor.
  terminology: “ብርሃን/ጨለማ,” “በመካከላችሁ,” and “የሚመላለስ” appropriately preserve Johannine imagery without doctrinal expansion. The alternative senses of ἐν ὑμῖν should remain footnoted.
  issues:
  - severity: high
    issue: “ጨለማው እንዳይውጣችሁ”
    rationale: The verb “መውጣት” means to rise, emerge, or come out; it does not adequately render καταλαμβάνω in this context, where darkness overtakes or catches someone.
  - severity: medium
    issue: “ሳለላችሁ”
    rationale: This form is not idiomatic modern standard Amharic in this construction. “ብርሃን ሳላችሁ” clearly means “while you have the light.”},{
