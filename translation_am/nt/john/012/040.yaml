id: JHN.12.40
reference: John 12:40
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: am
  text: ዓይኖቻቸውን አሳውሯል፤ ልባቸውንም አደንድኗል። ይህም በዓይኖቻቸው እንዳያዩ፣ በልባቸውም እንዳያስተውሉ፣ እንዳይመለሱም[a][c]፣ እኔም እንዳልፈውሳቸው[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዳይለወጡ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ በቃል በቃል፣ “እኔም እፈውሳቸዋለሁ” ይላል፤ እዚህ ግን ከዓላማና ከውጤት አወቃቀሩ ጋር በአማርኛ “እንዳልፈውሳቸው” ተብሏል።
    reason: lexical_alternative
  - marker: c
    text: ይህ ንግግር ኢሳይያስ 6፥10ን ያስተጋባል።
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: አሳውሯል
  rationale: የግሪኩ ፍጹም ጊዜ የተፈጸመው ድርጊት አሁንም ያለውን ውጤት ያሳያል፤ የአማርኛው ፍጹም ቅርጽም ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἐπώρωσεν
  choice: አደንድኗል
  rationale: ቃሉ ልብን ደንዳናና ለመረዳት የማይቀበል ማድረግን ይገልጣል፤ ይህ ምርጫ የኢሳይያስን ትንቢታዊና የፍርድ አውድ ይጠብቃል።
- source_word: καρδίαν / καρδίᾳ
  choice: ልባቸውን / በልባቸው
  rationale: ‘ልብ’ የመረዳትን ተግባር ጨምሮ የውስጥ ሰውነትን የሚወክል መጽሐፍ ቅዱሳዊ ምስል ነው፤ የግሪኩ ነጠላ ቁጥርም እንደ ማኅበራዊ ነጠላ ተጠብቋል።
- source_word: ἵνα μὴ
  choice: እንዳይ… / እንዳል…
  rationale: ይህ የአማርኛ አወቃቀር በጥቅሱ ያለውን የዓላማ/ውጤት ኃይል በተፈጥሮ ይገልጣል።
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: በዓይኖቻቸው እንዳያዩ
  rationale: የምንጩን ግልጽ ምስልና ከ‘በልባቸው እንዳያስተውሉ’ ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: νοήσωσιν
  choice: እንዳያስተውሉ
  rationale: በዚህ አውድ ቃሉ በአእምሮ መገንዘብን ያመለክታል፤ ‘ማስተዋል’ ከልብ ጋር ተያይዞ ተፈጥሯዊና ክቡር አማርኛ ነው።
- source_word: στραφῶσιν
  choice: እንዳይመለሱ
  rationale: ‘መመለስ’ የነቢያትን አነጋገርና የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ ‘እንዳይለወጡ’ የሚለው ይበልጥ ትርጓሜያዊ ነው።
- source_word: ἰάσομαι
  choice: እኔም እንዳልፈውሳቸው
  rationale: የግሪኩ ቅርጽ የወደፊት ጊዜ ቢሆንም፣ በἵνα μὴ የዓላማ/ውጤት ሰንሰለት ውስጥ ያለውን ተያያዥ አሉታዊ ውጤት የአማርኛው አወቃቀር በተፈጥሮ ያስተላልፋል፤ ቀጥተኛው የወደፊት አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ዓይኖችን በማሳወርና ልብን በማደንደን የእግዚአብሔር ቀጥተኛ ድርጊት
  choice: ግልጽ የሆነውን ነጠላ ድርጊት አድራጊ ‘አሳውሯል… አደንድኗል’ ብሎ ማቆየት
  alternative: የድርጊቱን አድራጊ የሚያደበዝዝ ተደራጊ ወይም ግለሰብ-አልባ አገላለጽ
  rationale: የግሪኩ ጽሑፍ ድርጊቱን ለአንድ ግልጽ አድራጊ ይሰጣል፤ ከመለኮታዊ ፍርድ ጋር ያለው አስቸጋሪ ውጥረት ሳይለሰልስ ተጠብቋል።
- issue: የστραφῶσιν መመለስ/መለወጥ ትርጉም
  choice: በዋናው ጽሑፍ ‘እንዳይመለሱ’
  alternative: ‘እንዳይለወጡ’ ወይም ‘እንዳይለወጡና ወደ እግዚአብሔር እንዳይመጡ’
  rationale: የግሪኩ ግስ ሰፊ ሲሆን ንስሐንና ወደ ኋላ መመለስን ሊያካትት ይችላል፤ ‘መመለስ’ የነቢያትን አገላለጽ ይጠብቃል እንጂ ጠባብ የቤተ እምነት ቃል አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ትይዩ አወቃቀሩ እንዲሰማ አጭር ተከታታይ ሐረጎች ተጠብቀዋል፤ ነጠላው ‘ልባቸው’ የግሪኩን ማኅበራዊ ነጠላ ያንጸባርቃል።
