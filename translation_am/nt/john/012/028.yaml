id: JHN.12.28
reference: John 12:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: am
  text: “አባት ሆይ፣ ስምህን አክብር።” ከዚያም ከሰማይ፣ “አክብሬዋለሁ፤[a] ደግሞም አከብረዋለሁ” የሚል ድምፅ መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “አከበርሁት፤ ደግሞም አከብረዋለሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: አባት ሆይ
  rationale: የቀጥታ ጥሪውን በተፈጥሯዊና በክብር የአማርኛ አነጋገር ያቀርባል፤ በግሪክ የሌለውን “የእኔ” አይጨምርም።
- source_word: δόξασόν
  choice: አክብር
  rationale: የትእዛዝ ቅርጹን ይጠብቃል፤ በዮሐንስ የክብር ቃላት አውድ ውስጥ ያለውን መለኮታዊ ክብር ማሳየትንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σου τὸ ὄνομα
  choice: ስምህን
  rationale: የባለቤትነት ግንኙነቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ “ስም” የሚለውን መጽሐፍ ቅዱሳዊ ክብደት ሳይተረጉም ይጠብቃል።
- source_word: ἦλθεν οὖν
  choice: ከዚያም … መጣ
  rationale: οὖνን እዚህ እንደ ትረካ ቅደም ተከተል አመልካች ያቀርባል፤ የἦλθενንም የመምጣት ምስል ይጠብቃል።
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ … የሚል ድምፅ
  rationale: የተነገረው ቀጥተኛ ንግግር ተራ ድምፅ ሳይሆን የሚናገር ድምፅ መሆኑን ያሳያል፤ “ከሰማይ” መለኮታዊ ምንጩን ይጠብቃል።
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: አክብሬዋለሁ፤ ደግሞም አከብረዋለሁ
  rationale: የመጀመሪያውን አኦሪስት በአሁን ጊዜ ጠቀሜታ ያለው የተፈጸመ ድርጊት አድርጎ ያቀርባል፤ የወደፊቱን ድርጊትና πάλιν የሚያሳየውን “ደግሞ” ይጠብቃል። የተያያዘው “-ዋ-” ቀደም ሲል የተጠቀሰውን ስም ያመለክታል።
theological_decisions:
- issue: በመለኮታዊው መልስ ያልተገለጸው የግስ ተሳቢ
  choice: በአማርኛው ግስ ውስጥ “-ዋ-” በማካተት ወደ “ስምህን” እንዲመለስ ማድረግ
  alternative: “አክብሬአለሁ፤ ደግሞም አከብራለሁ” ብሎ ተሳቢውን ሳይገልጹ መተው
  rationale: ግሪኩ ተሳቢውን ከአውዱ እንዲታወቅ ቢተወውም፣ በአማርኛ በግሱ ውስጥ ማመልከቱ ተፈጥሯዊ ነው፤ አዲስ ተሳቢ ሳያስገባ የአብን ስም እንደሚያመለክት ግልጽ ያደርጋል።
- issue: በዮሐንስ ወንጌል የδοξάζω የሥነ መለኮት ክብደት
  choice: አክብር / አክብሬዋለሁ / አከብረዋለሁ
  alternative: ዝናውን ከፍ አድርግ / አወድስ
  rationale: “አክብር” የክብርን ቃላዊ ግንኙነት ይጠብቃል፤ ሐሳቡን ወደ ዝና ወይም ወደ ምስጋና ብቻ አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛ ተጠቅሟል። “አባት ሆይ” የቀጥታ ጥሪውን ያሳያል፤ የግሪኩ አኦሪስት መደበኛ ቃል በቃል አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
