source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: am
  text: ይህም ነቢዩ ኢሳይያስ፣ “ጌታ ሆይ፣ ዘገባችንን[a] ማን አመነ? የጌታ ክንድስ ለማን ተገለጠ?” ብሎ የተናገረው ቃል እንዲፈጸም ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የሰማነውን ነገር” ወይም “መልእክታችንን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: እንዲፈጸም ነበር
  rationale: የዓላማንና የውጤትን ሁለቱንም ፍንጭ ሙሉ በሙሉ ሳይወስን የግሪኩን የፍጻሜ አያያዥ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: ነቢዩ ኢሳይያስ ... የተናገረው ቃል
  rationale: λόγοςን “ቃል” ብሎ በመተርጎም የትንቢታዊውን ንግግርና የፍጻሜ ቀመርን ይጠብቃል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ ጥሪውን በአማርኛ በተለመደው የጥሪ ቅርጽ ያሳያል።
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: የሰማነውን
  rationale: ἀκοή የመስማትን ድርጊት ወይም የተሰማውንና የተነገረውን መልእክት ሊያመለክት ይችላል፤ “የሰማነውን” የምንጩን አገላለጽ በቅርብ ይከተላል።
- source_word: ἐπίστευσεν
  choice: አመነ
  rationale: በአማርኛ የንግግሩን ጊዜና የአጠያየቁን ኃይል በተፈጥሯዊ ሁኔታ የሚያቀርብ ፍጹም ግስ ነው።
- source_word: ὁ βραχίων κυρίου
  choice: የጌታስ ክንድ
  rationale: የእግዚአብሔርን ኃይልና ተግባር የሚያመለክተውን ቅዱስ መጽሐፋዊ ዘይቤ ሳይተረጉም ይጠብቃል፤ “-ስ” የሁለተኛውን ትይዩ ጥያቄ ያጎላል።
- source_word: ἀπεκαλύφθη
  choice: ተገለጠ
  rationale: የግሪኩን ተደራጊ ቅርጽና የመገለጥን ሐሳብ በግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: የፍጻሜው አገላለጽ ዓላማን ወይስ ውጤትን እንደሚያመለክት
  choice: “እንዲፈጸም ነበር” ተብሎ የἵνα አወቃቀር ተጠብቋል።
  alternative: “ስለዚህ ... ተፈጸመ” ወይም “ይፈጸም ዘንድ”
  rationale: የዮሐንስ አገላለጽ ዓላማን፣ ውጤትን ወይም ሁለቱንም ሊያስተጋባ ስለሚችል ትርጉሙ ይህን ውጥረት በትርጓሜ አይዘጋውም።
- issue: በኢሳይያስ ጥቅስ ውስጥ የἀκοή ትርጉም
  choice: በዋናው ጽሑፍ “የሰማነውን”
  alternative: “መልእክታችንን” ወይም “ዘገባችንን”
  rationale: ቃሉ መስማትንም ሆነ የተሰማውን/የተላለፈውን መልእክት ሊያመለክት ይችላል፤ ዋናው ጽሑፍ የምንጩን ቅርጽ ሲጠብቅ ሌላው ትርጉም በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ትይዩ መዋቅርና “የጌታ ክንድ” የሚለው መጽሐፋዊ ዘይቤ ተጠብቀዋል።
