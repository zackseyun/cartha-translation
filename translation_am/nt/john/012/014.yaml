  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: am
  text: ኢየሱስም የአህያ ውርንጫ[a] አግኝቶ በላዩ ተቀመጠ፤ እንደ ተጻፈው፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አህያ»። የግሪኩ ቃል ὀνάριον አህያን፣ ብዙ ጊዜም ወጣት አህያን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: አግኝቶ
  rationale: የግሪኩ የአኦሪስት አድራጊ ቦዝ አንቀጽ ከዋናው ድርጊት በፊት የተፈጸመውን ነገር ያሳያል፤ «አግኝቶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ተቃርኖን ሳያጠናክር ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ«ኢየሱስ» ጋር የተያያዘው «-ም» ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ὀνάριον
  choice: ውርንጫ
  rationale: ὀνάριον የአህያ ትንሽ ወይም ግልገል ሊያመለክት የሚችል ቃል ነው፤ «ውርንጫ» በዚህ አውድ ወጣት አህያን በአጭርና በተለመደ አማርኛ ያመለክታል። የቃሉ ሰፊ አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: በላዩ ተቀመጠ
  rationale: የግሪኩን ቀጥተኛ አገላለጽ «በእርሱ ላይ ተቀመጠ» በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ «ጋለበው» የሚለውን ተጨማሪ ትርጓሜ አያስገባም።
- source_word: καθώς ἐστιν γεγραμμένον
  choice: ይህም እንደ ተጻፈው ነው
  rationale: ይህ የቅዱሳት መጻሕፍት ጥቅስ መግቢያ ሲሆን καθώς ያለውን የመመሳሰል ኃይልና γεγραμμένον የሚያመለክተውን የተጻፈ ሁኔታ በግልጽ አማርኛ ይጠብቃል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: በግሪክ ትረካ ከግል ስም ጋር ያለው ወሰኝ አመልካች በአማርኛ አይተረጎምም፤ መደበኛው የስሙ አጻጻፍ «ኢየሱስ» ነው።
theological_decisions:
- issue: የኢየሱስ ድርጊት ከተጻፈው የመጽሐፍ ቃል ጋር ያለው ግንኙነት
  choice: ድርጊቱ ከተጻፈው ጋር እንደሚስማማ ብቻ ማቅረብ
  alternative: ኢየሱስ ትንቢቱን ለመፈጸም ሆን ብሎ ይህን እንዳደረገ በግልጽ መተርጎም
  rationale: ቁጥሩ ድርጊቱን ገልጦ የተጻፈውን ቃል ያስገባል፤ ትንቢታዊ መዛመድን ያሳያል እንጂ የኢየሱስን ዓላማ በቀጥታ አይገልጽም። ትርጉሙ ይህን ገደብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቦዝ አንቀጽ ቅደም ተከተል «አግኝቶ» በሚለው ተጠብቋል፤ የጥቅሱ መግቢያም ቀጣዩን ቁጥር ለማስተዋወቅ በነጥብ ሁለት ተዘግቷል።
