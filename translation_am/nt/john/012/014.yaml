review_pass:
  verdict: revise
  source_fidelity: The participial sequence is conveyed well by «አግኝቶ», and «በላዩ ተቀመጠ» accurately renders the act of sitting on the animal. However, «ውርንጫ» by itself does not explicitly identify the animal as a donkey and can be understood more broadly as a foal. Also, «ይህም ... ነው» adds a demonstrative/copular framing not present in the Greek citation formula.
  naturalness: «ኢየሱስም የአህያ ውርንጫ አግኝቶ በላዩ ተቀመጠ፤ እንደ ተጻፈው፦» is clear, idiomatic modern standard Amharic and introduces the following Scripture quotation naturally.
  terminology: «የአህያ ውርንጫ» identifies ὀνάριον as a donkey colt while retaining the diminutive/young-animal sense. The footnote preserves the less specific lexical possibility, since the Greek word can refer to a donkey and often a young one.
  issues:
  - severity: medium
    issue: The main text uses «ውርንጫ» without identifying it as a donkey.
    rationale: ὀνάριον denotes a donkey, often a young one. In Amharic, «ውርንጫ» alone need not communicate donkey specifically; adding «የአህያ» supplies the lexical identification found in the source.
  - severity: low
    issue: The citation formula is rendered «ይህም እንደ ተጻፈው ነው».
    rationale: καθὼς ἐστιν γεγραμμένον is most directly and naturally represented by «እንደ ተጻፈው፦». The omitted demonstrative/copula avoids adding framing not expressed in Greek.
  revised_text: ኢየሱስም የአህያ ውርንጫ[a] አግኝቶ በላዩ ተቀመጠ፤ እንደ ተጻፈው፦
