base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: am
  text: ስለዚህ ኢየሱስ፣ “ለቀብሬ ቀን እንድታቆየው ተዋት።”[a][b] አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተዋት፤ ለቀብሬ ቀን አቆይታዋለች።” አንዳንዶች ይህን ሐረግ ሴቲቱ ወደፊት ልታደርገው የሚችለውን ሳይሆን አስቀድማ ያደረገችውን እንደሚገልጥ ይረዱታል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ተዋት፤ እስከ ቀብሬ ቀን ድረስ እንድታቆየው።” የግሪኩ አገባብ ይበልጥ ግልጽ በሆነ ጊዜያዊ ትርጉምም ሊወሰድ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የትረካውንና የሐሳቡን ቀጣይነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: Ἄφες αὐτήν
  choice: ተዋት
  rationale: በዚህ ዐውድ ሴቲቱን ማወክ እንዲያቆሙ የሚሰጠውን ቀጥተኛና ፈሊጣዊ ትእዛዝ በግልጽ ሁኔታ ይገልጣል።
- source_word: ἵνα
  choice: እንድታቆየው
  rationale: የዓላማ ወይም የታሰበ ውጤት ግንኙነቱን በአማርኛው የግስ አወቃቀር ያስተላልፋል።
- source_word: εἰς τὴν ἡμέραν
  choice: ለ… ቀን
  rationale: ዋናው ትርጉም ወደታሰበው የወደፊት አጋጣሚ የሚያመለክተውን ኃይል ይጠብቃል፤ ‘እስከ’ የሚለውን ይበልጥ ግልጽ ጊዜያዊ አማራጭ በማስታወሻ ያቀርባል።
- source_word: ἐνταφιασμοῦ
  choice: ቀብሬ
  rationale: መቀበርን በቀላል፣ የተለመደና ክብር ባለው አማርኛ ይገልጣል።
- source_word: τηρήσῃ
  choice: እንድታቆየው
  rationale: ነገሩን ለተወሰነ አጋጣሚ ጠብቆ ማቆየትን ይገልጣል፤ የአረፍተ ነገሩ አማራጭ አረዳድ በማስታወሻ ተጠብቋል።
- source_word: αὐτό
  choice: ው (በእንድታቆየው)
  rationale: ግሪኩ ያለውን ተውላጠ ስም በአማርኛ የግስ ቅጥያ ያስተላልፋል፤ ‘ሽቱው’ የሚል በግልጽ ያልተደገመ ስም አይጨምርም።
theological_decisions:
- issue: የኢየሱስ ንግግር ቅባቱን ከሞቱና ከቀብሩ ጋር የሚያያይዝበት መንገድ
  choice: ንግግሩን ወደፊት የሚያመለክት የዓላማ ሐረግ አድርጎ፣ ነገሩን ለቀብሩ ቀን እንድታቆየው እንደሚናገር መተርጎም
  alternative: ‘ተዋት፤ ለቀብሬ ቀን አቆይታዋለች’ ወይም ‘እስከ ቀብሬ ቀን ድረስ እንድታቆየው’ ብሎ መተርጎም
  rationale: የግሪኩ አገባብ አስቸጋሪ ሲሆን ከአንድ በላይ የታመኑ አረዳዶችን ይፈቅዳል። ዋናው ጽሑፍ የἌφες… ἵνα… τηρήσῃን ቀጥተኛ የዓላማ ኃይል ይከተላል፤ እውነተኛው አሻሚነት ግን በማስታወሻዎች ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተፈጥሮ ፍሰት ያለውና ክብር የጠበቀ መደበኛ አማርኛ ተጠቅሟል። ‘ተዋት’ የትእዛዙን ቀጥተኛ ኃይል ይጠብቃል፤ የግሪኩ አገባባዊ አሻሚነት ዋናውን ጽሑፍ በማብራሪያ ሳያስፋፋ በሁለት ማስታወሻዎች ቀርቧል።
