base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: am
  text: ስለዚህ በዚያ ለእርሱ እራት አዘጋጁ፤ ማርታም ምግብ ታቀርብ ነበር፤ አልዓዛር ግን ከእርሱ ጋር ለማዕድ ከተቀመጡት[a] አንዱ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ከእርሱ ጋር ከተጋደሙት አንዱ ነበር።» በመደበኛ የድግስ ምግብ ጊዜ በማዕድ ዙሪያ ተደግፎ መጋደም የተለመደ አቀማመጥ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: አዘጋጁ
  rationale: ከδεῖπνον ጋር ሲመጣ ποιέω ምግብን ማዘጋጀትን ያመለክታል፤ «አዘጋጁ» በአማርኛ ተፈጥሯዊ ሲሆን አዘጋጆቹን ማንነት አይወስንም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ ጋር ያለውን የውጤትና የቀጣይነት ግንኙነት ይጠብቃል።
- source_word: αὐτῷ
  choice: ለእርሱ
  rationale: እራቱ ለኢየሱስ እንደተዘጋጀ የሚያሳየውን የጥቅም ተሳቢ ይገልጻል።
- source_word: δεῖπνον
  choice: እራት
  rationale: ዋናውን፣ ብዙውን ጊዜም የማታውን ምግብ የሚያመለክት ዘመናዊና ግልጽ ቃል ነው።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: በአውዱ ወደተጠቀሰችው ቢታንያ የሚያመለክት ቀጥተኛ የቦታ አገላለጽ ነው።
- source_word: διηκόνει
  choice: ታስተናግድ ነበር
  rationale: ያልተጠናቀቀውን ቀጣይ ድርጊት የግሱን ያለፈ ጊዜ ቀጣይ ገጽታ በተፈጥሯዊ አማርኛ ያሳያል፤ በዚህ አውድ የምግብ አገልግሎትን ያመለክታል።
- source_word: δὲ
  choice: ግን
  rationale: በማርታ ማስተናገድና በአልዓዛር ለማዕድ መቀመጥ መካከል ያለውን ረጋ ያለ ንጽጽር ያሳያል።
- source_word: εἷς ἦν ἐκ
  choice: ከ… አንዱ ነበር
  rationale: አልዓዛር በምግቡ ከነበሩት ቡድን አንዱ መሆኑን በቅርብ ይገልጻል።
- source_word: ἀνακειμένων
  choice: ለማዕድ ከተቀመጡት
  rationale: የግሪኩ ቃል በምግብ አውድ ለመብላት ተደግፎ መጋደምን ያመለክታል፤ ዋናው ጽሑፍ በዘመናዊ አማርኛ ተፈጥሯዊ እንዲሆን «ለማዕድ ተቀመጡ» ተብሏል፣ ባህላዊው አቀማመጥም በማስታወሻ ተገልጿል።
- source_word: σὺν αὐτῷ
  choice: ከእርሱ ጋር
  rationale: ቀላል አብሮነትን ይገልጻል፤ ተውላጠ ስሙም በአውዱ ኢየሱስን ያመለክታል።
