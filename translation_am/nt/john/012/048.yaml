  verdict: revise
  source_fidelity: 'The draft retains the principal contrasts and the future judgment: rejecting Jesus, not receiving his spoken words, the already-present judge, and the word spoken by Jesus judging on the last day. However, «የሚክድ» can primarily suggest denying rather than repudiating/rejecting, and the demonstrative force of ἐκεῖνος is more naturally expressed by «ራሱ».'
