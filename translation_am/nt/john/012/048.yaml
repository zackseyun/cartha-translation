base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: am
  text: እኔን የሚጥለኝና ቃሎቼን የማይቀበል[a] የሚፈርድበት አለው፤ እኔ የተናገርኩት ቃል[b] ራሱ በመጨረሻው ቀን ይፈርድበታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ቃሎቼን የማያስተናግድ»። የግሪኩ ግስ መቀበልን፣ ማስተናገድን ወይም በአዎንታ መቀበልን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እኔ የተናገርኩት መልእክት»። የግሪኩ λόγος (ሎጎስ) እንደ አውዱ «ቃል» ወይም «መልእክት» ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: የሚክድ
  rationale: ግሱ ኢየሱስን እንደ ሰው አለመቀበልንና መቃወምን ያመለክታል፤ «የሚክድ» የግላዊውን ውድቅ ማድረግ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: ቃሎቼን የማይቀበል
  rationale: λαμβάνω በዚህ አውድ መቀበልንና በአዎንታ ማስተናገድን ያካትታል፤ «የማይቀበል» በአማርኛ ይህን ሁለቱንም ገጽታ በተፈጥሮ ይይዛል።
- source_word: ῥήματά
  choice: ቃሎቼን
  rationale: ብዙ ቁጥር ያለውን የተነገሩ ቃላት ይጠብቃል፤ «ንግግሮቼን» ደግሞ ሊባል ቢችልም «ቃሎቼን» ይበልጥ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: የሚፈርድበት አለው
  rationale: የግሪኩን አጭርና ትንሽ ረቂቅ አገባብ ይጠብቃል፤ ተከታዩ ሐረግ ፈራጁ የኢየሱስ ቃል መሆኑን እንዲገልጥ ቦታ ይሰጣል።
- source_word: ὁ λόγος
  choice: ቃል
  rationale: ነጠላ ቁጥሩንና ክብደት ያለውን፣ እንደ ፈራጅ የቀረበውን አገላለጽ ይጠብቃል፤ «መልእክት» የሚለውም በአውዱ የሚቻል ነው።
- source_word: ὃν ἐλάλησα
  choice: እኔ የተናገርኩት
  rationale: የአንድ ጊዜ የተፈጸመ የንግግር ድርጊትን በተፈጥሯዊ አማርኛ ያሳያል፤ «እኔ» የሚለው ባለቤቱን ግልጽ ያደርጋል።
- source_word: ἐκεῖνος
  choice: እሱ
  rationale: ወደ «ቃል» ተመልሶ የሚያመለክተውን አጽንዖት ይጠብቃል፤ ቃሉ እንደ ፈራጅ መቅረቡን ሳያለዝብ ያስተላልፋል።
- source_word: κρινεῖ
  choice: ይፈርድበታል
  rationale: κρίνω የሚለውን ሰፊ የፍርድ ትርጉም ይጠብቃል፤ «ይኮንነዋል» በማለት ውጤቱን ከጽሑፉ በላይ አይወስንም።
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: በመጨረሻው ቀን
  rationale: የዮሐንስን የመጨረሻ ዘመን አገላለጽ በቀጥታና በተለመደ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በቁጥሩ ውስጥ የሚፈርደው ማን ወይም ምን እንደሆነ
  choice: ኢየሱስ የተናገረው ቃል በመጨረሻው ቀን እንደሚፈርድ ጽሑፉ ባለበት መልክ ቀርቧል።
  alternative: ቃሉ የፍርድ መለኪያ ብቻ ነው ወይም ፈራጁ ኢየሱስ ብቻ ነው ብሎ በግልጽ መተርጎም።
  rationale: አገባቡ መጀመሪያ «የሚፈርድበት አለው» ይላል፤ ከዚያም ያንን እንደ ኢየሱስ የተናገረው ቃል ይለያል። ትርጉሙ ይህን አስገራሚ አቀራረብ ከሌሎች የዮሐንስ የፍርድ ንግግሮች ጋር በግድ ሳያስማማ ጠብቆታል።
