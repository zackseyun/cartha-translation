source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: am
  text: እንግዲህ ማርያም አንድ ሊትራ የሚመዝን እጅግ ውድ የሆነ ንጹሕ የናርዶስ ሽቱ[a][b] ወስዳ የኢየሱስን እግሮች ቀባች፤ በፀጉሯም እግሮቹን ጠረገች። ቤቱም በሽቱው መዓዛ ተሞላ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሊትራ የሮማውያን የክብደት መለኪያ ሲሆን፣ ወደ 12 አውንስ ወይም ወደ አንድ ሦስተኛ ኪሎ ግራም ያህል ነበር።
    reason: cultural_note
  - marker: b
    text: ወይም፣ «እውነተኛ የናርዶስ ሽቱ»፤ «ንጹሕ» ተብሎ የተተረጎመው πιστικῆς የሚለው ቃል ትርጉሙ አከራካሪ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ትረካ ከዚህ ድርጊት ጋር የሚያገናኘውን የትረካ ቅጥልጥልና መጠነኛ የውጤት ሐሳብ ይጠብቃል።
- source_word: λαβοῦσα
  choice: ወስዳ
  rationale: ከዋናዎቹ ድርጊቶች በፊት የተፈጸመውን ተከታታይ ድርጊት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: λίτραν
  choice: አንድ ሊትራ የሚመዝን
  rationale: የጥንቱን የሮማውያን የክብደት መለኪያ ሳይተካ ይጠብቃል፤ መጠኑ በማስታወሻ ይብራራል።
- source_word: μύρου
  choice: ሽቱ
  rationale: በዚህ አውድ ለመቀባት የሚውል መዓዛ ያለውን ቅባት በዘመናዊና ቀላል አማርኛ ይገልጻል።
- source_word: νάρδου
  choice: የናርዶስ
  rationale: በምንጩ የተጠቀሰውን የመዓዛ ተክል ስም በተለመደው የአማርኛ ቅርጽ ይጠብቃል።
- source_word: πιστικῆς
  choice: ንጹሕ
  rationale: በአውዱ እውነተኛና ያልተበረዘ ጥራት ያለው ናርዶስ የሚለውን የተለመደ ትርጉም ይሰጣል፤ የቃሉ ትርጉም አከራካሪ መሆኑ በማስታወሻ ተጠብቋል።
- source_word: πολυτίμου
  choice: እጅግ ውድ የሆነ
  rationale: የሽቱውን ከፍተኛ ዋጋ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: ἤλειψεν
  choice: ቀባች
  rationale: የሽቱ ቅባቱን አካላዊ ድርጊት በቀጥታ ያሳያል፤ በአማርኛም የመቀባትን ምሳሌያዊ ድምፀት ሳያስወግድ ተጨማሪ ሥርዓታዊ ትርጉም አያስገድድም።
- source_word: ἐξέμαξεν
  choice: ጠረገች
  rationale: ፀጉሯን መሣሪያ አድርጋ እግሮቹን የማበስና የመጥረግ ድርጊቷን በቀጥታ ይገልጻል።
- source_word: ταῖς θριξὶν αὐτῆς
  choice: በፀጉሯ
  rationale: የመሣሪያ ዳቲቩን በተፈጥሯዊ የአማርኛ አገባብ ያስተላልፋል።
- source_word: ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: በሽቱው መዓዛ ተሞላ
  rationale: መዓዛው ቤቱን ሁሉ እንደሞላ የሚገልጸውን ተጽዕኖ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የመቀባቱን ድርጊት ከጽሑፉ በላይ በሥርዓታዊ ወይም በንጉሣዊ ትርጉም የማንበብ አደጋ
  choice: ἤλειψεν በአውዱ እንደሚገልጸው «ቀባች» ተብሎ ተተርጉሟል።
  alternative: «ቅብዓት ቀባችው» ወይም በበለጠ ገለልተኛ አነጋገር «ሽቱውን በእግሮቹ ላይ አደረገች»
  rationale: «ቀባች» አካላዊ ድርጊቱንና ሊኖረው የሚችለውን ምሳሌያዊ ድምፀት ይጠብቃል፤ ጽሑፉ ያልገለጸውን የሥርዓት ወይም የንግሥና ትርጓሜ ግን አያስገድድም።
