id: JHN.12.1
reference: John 12:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: am
  text: እንግዲህ ኢየሱስ ከፋሲካ ስድስት ቀናት በፊት ወደ ቢታንያ መጣ፤ በዚያም ኢየሱስ ከሙታን መካከል ያስነሣው አልዓዛር ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ክፍል ከዚህ ትረካ ጋር የሚያገናኘውን የውጤት/የትረካ ግንኙነት ያስጠብቃል።
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: ከፋሲካ ስድስት ቀን በፊት
  rationale: የግሪኩን ጊዜያዊ ሐረግ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: ወደ ቢታንያ መጣ
  rationale: ἔρχομαι በትረካው ያለውን መምጣት በቀጥታ ይገልጻል፤ የቦታውም ስም በተለመደው አማርኛ አጻጻፍ ቀርቧል።
- source_word: ὅπου ἦν Λάζαρος
  choice: በዚያም … አልዓዛር ነበር
  rationale: ግሪኩ ስለ መኖር ወይም ስለ መቆየት የማይገልጸውን ዝርዝር ሳይጨምር ቦታዊ አገላለጹን ይጠብቃል።
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν Ἰησοῦς
  choice: ኢየሱስ ከሙታን መካከል ያስነሣው
  rationale: በዐውደ ንባቡ ἐγείρω ከሞት ማስነሣትን ያመለክታል፤ ἐκ νεκρῶν ያለውን የመነሻ ትርጉም ‘ከሙታን መካከል’ በማለት በግልጽ ያስተላልፋል።
theological_decisions:
- issue: አልዓዛርን ከሙታን ያስነሣው ማን እንደሆነ መግለጽ
  choice: ኢየሱስ … ያስነሣው
  alternative: እርሱ … ያስነሣው
  rationale: የግሪኩ ንባብ በአንቀጹ መጨረሻ Ἰησοῦς የሚለውን ስም ደግሞ ይጠቀማል፤ ስሙን ማቆየት ኢየሱስ አስነሺው መሆኑን በምንጩ መሠረት በግልጽ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ከሙታን መካከል’ የሚለው በአማርኛ ተፈጥሯዊ ሲሆን ἐκ νεκρῶν ያለውን ትርጉም በቅርብ ስለሚያስተላልፍ የእንግሊዝኛው የአማራጭ ትርጉም ማስታወሻ አላስፈለገም።
