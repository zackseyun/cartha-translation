    issue: Count noun in the temporal phrase
    rationale: The draft reads «ከፋሲካ ስድስት ቀን በፊት». Modern standard Amharic normally uses the plural form «ስድስት ቀናት» with this numeral in a temporal expression.
  - severity: low
    issue: Strength of the narrative connective
    rationale: «ስለዚህ» is possible, but can sound more conclusively inferential than οὖν requires here. «እንግዲህ» naturally preserves its continuing narrative force.
