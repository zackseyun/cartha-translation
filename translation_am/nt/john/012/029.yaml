  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: am
  text: ስለዚህ በዚያ ቆሞ የነበረውና ድምፁን የሰማው ሕዝብ፣ “ነጎድጓድ ሆኗል” ይል ነበር፤ ሌሎች ደግሞ፣ “መልአክ ተናግሮታል” ይሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው የሰማይ ድምፅ ጋር ያለውን ትረካዊ ትስስርና ውጤት ያሳያል።
- source_word: ὄχλος
  choice: ሕዝብ
  rationale: በቦታው የተሰበሰበውን ብዙ ሰው በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ ἑστὼς
  choice: በዚያ ቆሞ የነበረው
  rationale: የፍጹም ጊዜውን ተሳቢ ቅርጽ እና በቦታው የመቆየት ሁኔታ ይጠብቃል።
- source_word: ἀκούσας
  choice: የሰማው
  rationale: ከዋናው ግስ በፊት የተፈጸመውን መስማት ያሳያል፤ የተሰማው ነገር ከአውዱ ይታወቃል።
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: ያልተጠናቀቀውን ወይም ተደጋጋሚውን የመናገር ገጽታ ይጠብቃል።
- source_word: βροντὴν γεγονέναι
  choice: ነጎድጓድ ሆነ
  rationale: ‘ነጎድጓድ መሆኑን’ የሚለውን የግሪክ አገላለጽ ቅርብነት ጠብቆ በሚገባ የሚረዳ አማርኛ ያቀርባል።
- source_word: ἄλλοι
  choice: ሌሎች
  rationale: በሕዝቡ ውስጥ ያለውን ሁለተኛ ቡድን ይለያል።
- source_word: Ἄγγελος
  choice: መልአክ
  rationale: በዚህ አውድ ሰማያዊ ፍጡርን የሚያመለክት የተለመደ ትርጉም ነው።
- source_word: αὐτῷ
  choice: ተናገረው
  rationale: የድርጊቱ ተቀባይ ኢየሱስ መሆኑን በተፈጥሯዊ አማርኛ በግሱ ላይ ባለው ቅጥያ ይገልጣል።
- source_word: λελάληκεν
  choice: ተናገረው
  rationale: የተፈጸመውንና በአሁኑ ጊዜ ጠቀሜታ ያለውን ንግግር በአውዱ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ይገልጣል።
theological_decisions:
- issue: የሰማያዊው ተናጋሪ ማንነት
  choice: መልአክ ተናገረው
  alternative: መልእክተኛ ተናገረው
  rationale: በቀደመው ቁጥር የተሰማውን የሰማይ ድምፅ ሕዝቡ እንዴት እንደተረዳው አውዱ ያሳያል፤ ስለዚህ ἄγγελοςን ‘መልአክ’ ማለት ሳይጨምር የሚጠበቀውን ሰማያዊ ማጣቀሻ ይገልጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ የጊዜና የግስ ገጽታ በአማርኛ ተፈጥሯዊነት መጠን ተጠብቋል።
