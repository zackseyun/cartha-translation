  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: am
  text: በማግስቱ፣ ወደ በዓሉ መጥቶ የነበረው ብዙ ሕዝብ፣ ኢየሱስ ወደ ኢየሩሳሌም እየመጣ እንደሆነ ሲሰሙ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: በማግስቱ
  rationale: በትረካው ውስጥ የቀጣዩን ቀን በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያመለክታል።
- source_word: ὁ ὄχλος πολὺς
  choice: ብዙ ሕዝብ
  rationale: የሕዝቡን ብዛት በተለመደና ክብር ባለው ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: ወደ በዓሉ መጥቶ የነበረው
  rationale: ተሳቢው ሐረግ ‘ሕዝብ’ን እንደሚገልጽና መምጣቱም ከዚህ ትረካዊ ጊዜ በፊት እንደተፈጸመ ያሳያል። ἑορτή በዚህ ዐውድ ‘በዓል’ ተብሎ በተፈጥሯዊ ሁኔታ ተተርጉሟል።
- source_word: ἀκούσαντες
  choice: ሲሰሙ
  rationale: የግሪኩን ጊዜያዊ ተሳቢ በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ይመልሳል፤ ከነጠላው የስብስብ ስም ወደ ሕዝቡ አባላት የሚደረገውን የቁጥር ለውጥም ይጠብቃል።
- source_word: ὅτι ἔρχεται
  choice: እየመጣ እንደሆነ
  rationale: በግሪክ ታሪካዊ አሁን ጊዜ የቀረበውን ቀጣይ እንቅስቃሴ በአማርኛ ተፈጥሯዊ የተዘዋዋሪ ንግግር ቅርጽ ይገልጻል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግል ስሙ በአማርኛ በተለመደው ቅርጽ ተጽፏል።
- source_word: εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς ከእንቅስቃሴ ግስ ጋር ያለውን ወደ ስፍራው የሚያመራ አቅጣጫ በግልጽ ያሳያል።
