  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ጥቅሱ በቀጣዩ ቁጥር የሚጠናቀቅ የአረፍተ ነገር ክፍል ስለሆነ በኮማ ተዘግቷል። የእንግሊዝኛው የግርጌ ማስታወሻ a በውስጡ ያለው የምልክት አቀማመጥ ከማስታወሻው ይዘት ጋር የማይዛመድ በመሆኑ፣ ‘በዓል’ በአማርኛ ግልጽ ስለሆነ፣ አልተወሰደም። ታሪካዊው አሁን ጊዜም ‘እየመጣ እንደሆነ’ በሚለው ቅርጽ ስለተጠበቀ የግርጌ ማስታወሻ አላስፈለገም።
