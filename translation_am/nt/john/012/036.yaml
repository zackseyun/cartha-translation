    text: ግሪኩ በቃል በቃል “የብርሃን ወንድ ልጆች” ይላል፤ ይህም በብርሃን የሚታወቁ ሰዎችን የሚያመለክት ፈሊጥ ነው።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አገባብ “ሄዶ ከእነርሱ ተሰወረ” የሚል የድርጊት ቅደም ተከተል ያሳያል፤ ወይም “ከእነርሱ ሄደና ተሰወረ” ተብሎ ሊተረጎም ይችላል።
    reason: translation_alternative
