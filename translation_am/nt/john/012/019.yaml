  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: am
  text: ስለዚህ ፈሪሳውያን እርስ በርሳቸው፣ “ምንም እንደማታሳኩ ታያላችሁ። እነሆ፣ ዓለም ተከትሎት ሄዷል[a]” ተባባሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉም ሰው ተከትሎት ሄዷል።” የግሪኩ ጽሑፍ “ዓለም” ይላል፤ ይህም ምናልባት የተጋነነ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትዕይንት የሚመነጨውን ውጤትና የንግግሩን ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς ἑαυτούς
  choice: እርስ በርሳቸው ... ተባባሉ
  rationale: ቡድኑ አባላት እርስ በርሳቸው መነጋገራቸውን የግሪኩን ተውሳካዊ ትርጉም በግልጽ ያስተላልፋል።
- source_word: Θεωρεῖτε
  choice: ታያላችሁ
  rationale: የብዙ ቁጥር የአሁን ጊዜ አመልካች ግስ መሆኑን ጠብቆ፣ በብስጭት የተነገረውን ‘እንደምታዩት’ የሚል ኃይል ያሳያል።
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: ምንም እንዳላሳካችሁ
  rationale: ኢየሱስን ለማስቆም ያደረጉት ጥረት ከንቱ መሆኑን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἴδε
  choice: እነሆ
  rationale: ትኩረት የሚጠራውን ድንገተኛ የንግግር ኃይል በክቡርና ለመጽሐፍ ቅዱስ ንባብ ተስማሚ ቃል ይጠብቃል።
- source_word: κόσμος
  choice: ዓለም
  rationale: የግሪኩን ቀጥተኛ የቃል ምስልና የዮሐንስን የቃል ድግግሞሽ ይጠብቃል፤ እዚህ ያለው የተጋነነ አነጋገር በማስታወሻ ተብራርቷል።
- source_word: ὀπίσω αὐτοῦ ἀπῆλθεν
  choice: ተከትሎት ሄዷል
  rationale: አንድን ሰው ተከትሎ መሄድን የሚገልጸውን ፈሊጣዊ ትርጉምና አሁን የሚታየውን ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በፈሪሳውያን ንግግር ውስጥ κόσμος የሚያመለክተው ወሰን
  choice: በዋናው ጽሑፍ ‘ዓለም’ ተብሎ እንደ ተጋነነ አነጋገር ተጠብቋል።
  alternative: ‘ሁሉም ሰው’ ወይም ‘ሕዝቡ ሁሉ’
  rationale: ፈሪሳውያኑ በብስጭት የተጋነነ ንግግር እየተናገሩ ነው። ‘ዓለም’ የሚለውን ማቆየት የግሪኩን ቃልና የዮሐንስን ድምፀት ይጠብቃል፤ ሰው ሁሉ ቃል በቃል ደቀ መዝሙር ሆነ የሚል መለኮታዊ ድምዳሜ ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነሆ’ የሚለው ቃል የἴδεን የትኩረት ጥሪ ሳያደበዝዝ የጽሑፉን ክብር ይጠብቃል።
