  verdict: revise
  source_fidelity: The draft accurately represents the consequential οὖν, the reciprocal πρὸς ἑαυτούς, the attention call ἴδε, and the lexical ‘world’ (κόσμος). However, ‘ምንም እንዳላሳካችሁ’ can be heard as referring to a completed past failure, whereas the Greek present οὐκ ὠφελεῖτε expresses their presently futile effort.
  naturalness: The wording is generally clear and suitably elevated for modern standard Amharic. Recasting the clause as ‘ምንም እንደማታሳኩ’ gives a more natural and aspectually appropriate expression after ‘ታያላችሁ.’
  terminology: ‘ፈሪሳውያን,’ ‘ዓለም,’ and ‘እነሆ’ are appropriate. Retaining ‘ዓለም’ preserves both the Greek wording and Johannine diction; the footnote appropriately identifies the rhetorical hyperbole without narrowing the main text.
  issues:
  - severity: medium
    issue: The verb form in ‘ምንም እንዳላሳካችሁ ታያላችሁ’ tends toward a past/completed sense.
    rationale: οὐκ ὠφελεῖτε is present tense and describes the Pharisees’ current lack of success. ‘ምንም እንደማታሳኩ’ retains that ongoing force while fitting naturally with ‘ታያላችሁ.’
  revised_text: ስለዚህ ፈሪሳውያን እርስ በርሳቸው፣ “ምንም እንደማታሳኩ ታያላችሁ። እነሆ፣ ዓለም ተከትሎት ሄዷል[a]” ተባባሉ።
