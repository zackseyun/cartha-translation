  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: am
  text: “ይህ ሽቱ በሦስት መቶ ዲናር ተሽጦ ለድሆች ለምን አልተሰጠም?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንድ ዲናር በተለምዶ የአንድ ሠራተኛ የቀን ደመወዝ ነበር፤ ሦስት መቶ ዲናርም፣ ሥራ የማይሠራባቸውን ቀናት ሲታሰብ፣ የአንድ ዓመት ገደማ ገቢ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: ለምን
  rationale: የምክንያት ጥያቄውን በተፈጥሯዊና አጭር ዘመናዊ አማርኛ ይገልጣል።
- source_word: μύρον
  choice: ሽቱ
  rationale: በዐውዱ ውስጥ ለመቀባት የዋለውን ውድና መዓዛ ያለው ቅባት በተለመደ አማርኛ ያመለክታል።
- source_word: ἐπράθη
  choice: ተሽጦ
  rationale: የግሪኩን ተደራጊ ቅርጽና ያለፈ ድርጊት ይጠብቃል፤ ከሚቀጥለው ግስ ጋርም ተፈጥሯዊ የአማርኛ አገባብ ይፈጥራል።
- source_word: τριακοσίων δηναρίων
  choice: በሦስት መቶ ዲናር
  rationale: የዋጋን ትርጉም ያሳያል፤ የታሪካዊውን የገንዘብ መለኪያ ከዘመናዊ ገንዘብ ጋር ሳያመሳስል ይጠብቃል።
- source_word: ἐδόθη
  choice: ገንዘቡ ... አልተሰጠም
  rationale: ‘አልተሰጠም’ የግሪኩን ተደራጊ ቅርጽ ይጠብቃል። ‘ገንዘቡ’ የሚለው በአማርኛ ለድሆች የሚሰጠው የሽያጩ ገቢ መሆኑን በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: πτωχοῖς
  choice: ለድሆች
  rationale: በግሪኩ ስም ሆኖ የገባውን ብዙ ቁጥር ቅጽና የተቀባይነት አገባብ በቀጥታ ይገልጣል።
