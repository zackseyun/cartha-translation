  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: am
  text: የእርሱ ትእዛዝ የዘላለም ሕይወት[a] እንደሆነ አውቃለሁ። ስለዚህ እኔ የምናገረውን፣ አብ እንደነገረኝ እንዲሁ እናገራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእርሱ ትእዛዝ ወደ ዘላለም ሕይወት ይመራል” ወይም “የእርሱ ትእዛዝ የዘላለም ሕይወትን ይመለከታል።” ግሪኩ ይበልጥ ቃል በቃል፣ “የእርሱ ትእዛዝ የዘላለም ሕይወት ነው” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: ትእዛዝ
  rationale: በዘመናዊ አማርኛ ሥልጣን ያለውን ትእዛዝ በተፈጥሯዊና ቀጥተኛ መንገድ ይገልጣል።
- source_word: ζωὴ αἰώνιος
  choice: የዘላለም ሕይወት
  rationale: በዮሐንስ ጽሑፎች የተለመደውን አገላለጽና የማያቋርጥ ሕይወት ነገረ መለኮታዊ ክብደት ይጠብቃል።
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: የግሥ ዘመኑንና የኢየሱስን እርግጠኛነት በቀጥታ ይገልጣል።
- source_word: ἃ
  choice: የምናገረውን
  rationale: የግሪኩን ገለልተኛ ብዙ ቁጥር አንጻራዊ ተውላጠ ስም በተፈጥሯዊ አማርኛ ‘የምናገረውን’ ብሎ ያቀርባል።
- source_word: λαλῶ
  choice: እናገራለሁ
  rationale: በግሪኩ የλαλέω ድግግሞሽ ያለውን የመናገር ሐሳብ ይጠብቃል።
- source_word: καθὼς … οὕτως
  choice: እንደ… እንዲሁ
  rationale: አብ በነገረውና ኢየሱስ በሚናገረው መካከል ያለውን ትክክለኛ መዛመድ ያሳያል።
- source_word: εἴρηκέν μοι
  choice: እንደነገረኝ
  rationale: የተነገረው ቃል ቀጣይ ጠቀሜታ እንዳለው በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ πατήρ
  choice: አብ
  rationale: በዮሐንስ የሚገኘውን የግንኙነት ማዕረግ ይጠብቃል፤ ግሪኩ ‘አብ’ ይላል እንጂ ‘አባቴ’ አይልም።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ሁለተኛው ንግግር ከመጀመሪያው የሚያገኘውን ምክንያታዊ ትስስር ግልጽ ያደርጋል።
theological_decisions:
- issue: “የእርሱ ትእዛዝ የዘላለም ሕይወት ነው” የሚለው አገላለጽ ትርጉም
  choice: የግሪኩን ቀጥተኛ የአቻነት አገላለጽ ‘የዘላለም ሕይወት ነው’ በማለት መጠበቅ
  alternative: ትእዛዙ ወደ ዘላለም ሕይወት ይመራል፤ ወይም ትእዛዙ የዘላለም ሕይወትን ይመለከታል
  rationale: ግሪኩ ቀጥተኛ የአቻነት አረፍተ ነገር ይጠቀማል። ዋናው ጽሑፍ ይህን ነገረ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል፤ ሊሆኑ የሚችሉ ፍቺዎች በማስታወሻ ቀርበዋል።
- issue: ἐγώ የሚያሳየው አጽንዖት
  choice: ‘እኔ’ የሚለውን ግልጽ ተውላጠ ስም ማካተት
  alternative: ተውላጠ ስሙን በግሥ ውስጥ ብቻ ማመልከት
  rationale: በግሪኩ ἐγώ በግልጽ መገኘቱ ኢየሱስ የሚናገረው ከአብ ከተነገረው ጋር ያለውን መዛመድ አጽንዖት ይሰጣል።
