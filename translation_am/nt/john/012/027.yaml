language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: am
  text: አሁን ነፍሴ ታውካለች፤[a] ምንስ ልበል? አባት ሆይ፣ ከዚህ ሰዓት አድነኝ። ነገር ግን ወደዚህ ሰዓት የመጣሁት ለዚህ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ምንስ ልበል? ‘አባት ሆይ፣ ከዚህ ሰዓት አድነኝ’ ልበልን?» የግሪክ ጽሑፉ ቀጥተኛ ልመና ሳይሆን እንደ የንግግር ጥያቄም ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: አሁን
  rationale: የኢየሱስን ወቅታዊ ውስጣዊ ጭንቀት በቀጥታ የሚያመለክት ተፈጥሯዊ የጊዜ ቃል ነው።
- source_word: ἡ ψυχή μου
  choice: ነፍሴ
  rationale: እዚህ ψυχή የኢየሱስን ውስጣዊ ማንነትና ሕይወት ያመለክታል፤ «ነፍሴ» የምንጩን ክብደት ሳያቃልል የተለመደውን መግለጫ ይጠብቃል።
- source_word: τετάρακται
  choice: ታውካለች
  rationale: ፍጹም ተደራጊው ግስ በመታወክ የተፈጠረና አሁንም ያለ ሁኔታን ያሳያል፤ «ታውካለች» የውስጥ መረበሽን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τί εἴπω
  choice: ምንስ ልበል?
  rationale: የምክክር ንዑስ አንቀጽ የሚገልጠውን ውስጣዊ ማሰላሰል ይጠብቃል፤ «ስ» ደግሞ ከቀደመው መታወክ ጋር ተፈጥሯዊ ትስስር ይፈጥራል።
- source_word: πάτερ
  choice: አባት ሆይ
  rationale: ለእግዚአብሔር የቀረበውን ቀጥተኛና ክብር ያለው ጥሪ በዘመናዊ መደበኛ አማርኛ ይገልጣል።
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: ከዚህ ሰዓት አድነኝ
  rationale: σῴζωን «አድነኝ» በማለትና ἐκን «ከ» በማለት የመዳንን ጥያቄና ከመጪው ፈተና መውጣትን በአጭሩ ያስቀምጣል።
- source_word: ὥρα
  choice: ሰዓት
  rationale: በዮሐንስ ወንጌል የኢየሱስን ሥቃይ፣ ሞትና ክብር የሚመለከተውን የተወሰነ ወቅት የሚያመለክት ቁልፍ ቃል ስለሆነ «ሰዓት» በቀጥታ ተጠብቋል።
- source_word: ἀλλὰ διὰ τοῦτο
  choice: ነገር ግን … ለዚህ ነው
  rationale: ἀλλά የሚያሳየውን ተቃርኖና διὰ τοῦτο የሚገልጠውን ምክንያት/ዓላማ በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር አወቃቀር ያቀርባል።
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: ወደዚህ ሰዓት የመጣሁት
  rationale: εἰς ያለውን ወደ አንድ የተወሰነ ጊዜ መድረስ በ«ወደ» ይጠብቃል፤ የተቀናጀው አማርኛ አወቃቀርም የዓላማውን አጽንዖት ግልጽ ያደርጋል።
theological_decisions:
- issue: «አባት ሆይ፣ ከዚህ ሰዓት አድነኝ» ቀጥተኛ የጸሎት ልመና ነው ወይስ «ምንስ ልበል?» የሚለውን የንግግር ጥያቄ የሚቀጥል ነው?
  choice: በዋናው ጽሑፍ እንደ ቀጥተኛ ልመና ተተርጉሟል።
  alternative: «ምንስ ልበል? “አባት ሆይ፣ ከዚህ ሰዓት አድነኝ” ልበልን?» ተብሎ እንደ የንግግር ጥያቄ ሊነበብ ይችላል።
  rationale: በጥንታዊዎቹ ቅጂዎች የሥርዓተ ነጥብ ምልክቶች የመጀመሪያው ጽሑፍ አካል አልነበሩም፤ ስለዚህ ሁለቱም ንባቦች ይቻላሉ። SBLGNT ያቀረበውን ሥርዓተ ነጥብ ተከትሎ ዋናው ጽሑፍ እንደ ቀጥተኛ ልመና ተሰጥቷል፤ ይህም ኢየሱስ ከሰዓቱ ፊት ያለውን እውነተኛ መታወክና ለተልእኮው መታዘዙን በአንድነት ይጠብቃል። አማራጩ ንባብ በግርጌ ማስታወሻ ተቀምጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ነፍሴ» እና «ሰዓት» የሚሉት ቃላት የዮሐንስን ሥነ መለኮታዊ ክብደትና የምንጩን ምስል ለመጠበቅ ቀጥተኛ ሆነው ቀርበዋል።
