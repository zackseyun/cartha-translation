    text: ወይም፣ በባህላዊ አተረጓጎም፣ “የገንዘብ ከረጢቱን።” የግሪኩ ቃል ገንዘብ የሚያዝበትን ዕቃ ሊያመለክት ይችላል።
    reason: lexical_alternative
