  text: ይህን ያለው ለድሆች ደንታ ስለነበረው ሳይሆን፣ ሌባ ስለነበር ነው፤ የገንዘብ ሳጥኑንም[a] ይዞ በውስጡ የሚጨመረውን ይወስድ ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
