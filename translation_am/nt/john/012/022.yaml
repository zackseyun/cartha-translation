  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አጠቃቀም በአማርኛ ተፈጥሯዊ በሆነ የተያያዘ ግስና የአሁን ጊዜ ዋና ግስ ቅርጽ በማቅረብ የትረካው ሕያውነት ተጠብቋል።
- source_word: λέγει / λέγουσιν
  choice: ይነግረዋል / ይነግሩታል
  rationale: በዚህ አውድ ለአንድ ሰው መልእክትን ማድረስ ስለሚያመለክት፣ ‘ይላል’ ከሚለው ይልቅ ‘ይነግራል’ ተፈጥሯዊና ግልጽ ነው።
- source_word: Ἀνδρέᾳ
  choice: እንድርያስ
  rationale: የግል ስሙ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፏል።
- source_word: τῷ Ἰησοῦ
  choice: ለኢየሱስ
  rationale: የግሪኩ ዳቲቭ በአማርኛ ‘ለ-’ በሚለው መስተዋድድ በቀጥታ ተገልጿል።
- source_word: καί
  choice: -ም / እና
  rationale: የግሪኩ ቀላል ተያያዥነት በአማርኛ ተፈጥሯዊ በሆኑት ‘-ም’ እና ‘እና’ ተጠብቋል፤ ተጨማሪ የጊዜ ወይም የምክንያት ትርጉም አልተጨመረም።
- source_word: ὁ Φίλιππος
  choice: ፊልጶስ
  rationale: የግል ስሙ በተለመደው የአማርኛ ቅርጽ ተጽፏል፤ ከስሙ በፊት ያለው የግሪክ አርቲክል በዚህ አውድ ልዩ የትርጉም ክብደት ስለሌለው አልተተረጎመም።
