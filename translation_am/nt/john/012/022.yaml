    text: ግሪኩ በዚህ ቁጥር በሙሉ ታሪካዊውን የአሁን ጊዜ ይጠቀማል፤ ቃል በቃል፣ “ይመጣል … ይነግራል … ይመጣሉ … ይነግራሉ።” ይህ ትረካውን ሕያው የሚያደርግ የተለመደ የትረካ ዘይቤ ነው።
