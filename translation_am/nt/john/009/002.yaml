  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: am
  text: ደቀ መዛሙርቱም፣ “ረቢ፣ ይህ ሰው ዕውር ሆኖ እንዲወለድ ኃጢአት የሠራው ማን ነው—እሱ ወይስ ወላጆቹ?” ብለው ጠየቁት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዕውር ሆኖ የተወለደው?” የግሪኩ ንዑስ ሐረግ በደቀ መዛሙርቱ ጥያቄ ውስጥ እንደታሰበው የዓላማ ወይም የውጤት ግንኙነት ሊገልጽ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ጠየቁት
  rationale: በዚህ አውድ ቀጥተኛ ጥያቄን ያመለክታል፤ ‘ጠየቁት’ ተፈጥሯዊና ግልጽ ነው።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌል ትረካ የመምህርና የተከታይ ግንኙነትን የሚጠብቅ የተለመደ አማርኛ አገላለጽ ነው።
- source_word: λέγοντες
  choice: ብለው
  rationale: የግሪኩን አሳታፊ ግስ በተፈጥሯዊ የአማርኛ የንግግር ማስገቢያ ይወክላል።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: የአይሁድን ታሪካዊ የአጠራር ቅርጽ ለመጠበቅ በድምፅ ተቀራራቢ ሁኔታ ተጽፏል።
- source_word: τίς
  choice: ማን
  rationale: ተጠያቂውን ወገን የሚጠይቅ ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: ἥμαρτεν
  choice: ኃጢአት የሠራው
  rationale: በአማርኛ የጥያቄውን አወቃቀር ግልጽና ተፈጥሯዊ ሲያደርግ የግሪኩን ‘ኃጢአት ሠራ’ ትርጉም ይጠብቃል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: በአውዱ ያለውን ዕውር ሰው በግልጽ ያመለክታል፤ ‘ይህ’ ብቻ ከሚፈጥረው አሻሚነት ይቆጠባል።
- source_word: γονεῖς
  choice: ወላጆቹ
  rationale: አባትና እናትን በአንድነት የሚያመለክት መደበኛና አጭር አማርኛ ነው።
- source_word: ἵνα
  choice: እንዲወለድ
  rationale: የደቀ መዛሙርቱን የታሰበ ዓላማ/ውጤት ግንኙነት በአማርኛ የንዑስ አረፍተ ነገር ቅርጽ ይጠብቃል።
- source_word: τυφλὸς
  choice: ዕውር ሆኖ
  rationale: በትውልድ ጊዜ ያለውን ሁኔታ በግልጽና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: γεννηθῇ
  choice: እንዲወለድ
  rationale: በἵνα የሚመራውን የታሰበ ግንኙነት ይጠብቃል፤ በቀላሉ ‘ተወለደ’ ብሎ ከማለት ይልቅ የጥያቄውን ውጥረት ያስቀራል።
theological_decisions:
- issue: በኃጢአትና በትውልድ ዕውርነት መካከል ያለው የἵνα ግንኙነት
  choice: ‘ዕውር ሆኖ እንዲወለድ’ ተብሎ ተተርጉሟል፤ ይህም የደቀ መዛሙርቱን የታሰበ ግንኙነት ይጠብቃል።
  alternative: ‘ዕውር ሆኖ የተወለደው’ ወይም ‘ውጤቱም ዕውር ሆኖ መወለዱ እንዲሆን’
  rationale: ጥቅሱ የደቀ መዛሙርቱን ጥያቄ ይዘግባል እንጂ የግል ወይም የወላጆች ኃጢአት ዕውርነቱን እንዳስከተለ ተራኪው አያጸድቅም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ረቢ’ ታሪካዊውን የአይሁድ አውድ ይጠብቃል፤ የጥያቄው ቃላት ደግሞ የደቀ መዛሙርቱን ግምት ይዘግባሉ እንጂ እንደ ትምህርተ እምነት አያቀርቡትም።
