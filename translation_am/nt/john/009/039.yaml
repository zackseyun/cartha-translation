id: JHN.9.39
reference: John 9:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: am
  text: ኢየሱስም፣ “ለፍርድ[a] ወደዚህ ዓለም መጣሁ፤ ይህም የማያዩት እንዲያዩ፣ የሚያዩትም ዕውሮች እንዲሆኑ ነው” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለአንድ ፍርድ»። የግሪኩ εἰς κρίμα የኢየሱስ መምጣት ያስከተለውን ፍርዳዊ ውጤት ሊያጎላ ይችላል፤ ትርጉሙ ኩነኔን ብቻ አያመለክትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: ፍርድ
  rationale: ቃሉ የፍርዳዊ መለየትን ውጤት ያመለክታል፤ «ኩነኔ» ማለት ትርጉሙን ወደ ቅጣት ብቻ ያጠበዋል።
- source_word: κόσμον
  choice: ዓለም
  rationale: በዮሐንስ አጠቃቀም የሰውን ዓለምና ከእግዚአብሔር የራቀውን ሥርዓት ሊያመለክት የሚችለውን የተለመደ ትርጉም ይጠብቃል።
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: የማያዩት / የሚያዩት
  rationale: ሁለቱንም የተሳቢ አካላት በትይዩ በመተርጎም የአካላዊና የመንፈሳዊ እይታ አሻሚነትን ይጠብቃል።
- source_word: βλέπωσιν
  choice: እንዲያዩ
  rationale: ከἵνα በኋላ ያለውን ዓላማ/ውጤት በተፈጥሯዊ አማርኛ ይገልጣል፤ አካላዊና መንፈሳዊ ማየትንም ክፍት ያደርጋል።
- source_word: τυφλοὶ
  choice: ዕውሮች
  rationale: የቅጽሉን ጠንካራ ተቃርኖ ይጠብቃል፤ ቃሉ በአውዱ ያለውን መንፈሳዊ ምስል ሳያጠፋ ቀጥተኛውን ምስልም ያቆያል።
- source_word: γένωνται
  choice: እንዲሆኑ
  rationale: የመሆንን ወይም ወደ አንድ ሁኔታ የመግባትን ውጤታዊ ኃይል ይጠብቃል፤ «እንደሆኑ እንዲገለጥ» ብሎ አይፈታውም።
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: ወደዚህ ዓለም መጣሁ
  rationale: የመምጣትን አቅጣጫ እና በዮሐንስ ያለውን የመላክ/ወደ ዓለም መምጣት አነጋገር በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ይህ ቁጥር ከዮሐንስ 3፥17 («ዓለምን ሊፈርድበት አልላከውም») ጋር ያለው ውጥረት
  choice: κρίμαን «ፍርድ» ብሎ መተርጎምና ውጥረቱን አለማለዘብ
  alternative: «መለያየት» ብሎ መተርጎም ወይም «ኩነኔ» ብሎ ወደ ቅጣት ብቻ ማጥበብ
  rationale: ንግግሩ የኢየሱስ መምጣት የሰዎችን እውነተኛ መንፈሳዊ ሁኔታ የሚገልጥ ፍርዳዊ መለያየትን እንደሚያስከትል ያቀርባል። ትርጉሙ ከሌሎች የዮሐንስ ንግግሮች ጋር ያለውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የማየት/ያለማየት ትይዩነትና አካላዊ-መንፈሳዊ ድርብ ፍቺ ተጠብቋል።
