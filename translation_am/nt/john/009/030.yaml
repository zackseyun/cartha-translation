  source_fidelity: The draft accurately conveys the man’s reply, the irony of the authorities’ ignorance, and the literal healing of his eyes. However, “ከየት እንደሆነ” is not a natural or sufficiently clear Amharic expression for πόθεν ἐστίν (“where he is from”).
