  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: am
  text: ሰውየውም መልሶ እንዲህ አላቸው፦ “የሚያስደንቀው ነገርስ ይህ ነው[a]፤ እናንተ ከየት እንደመጣ አታውቁም[b]፣ እርሱ ግን ዓይኖቼን ከፈተልኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚያስገርመው ነገርስ ይህ ነው።”
    reason: lexical_alternative
  - marker: b
    text: በቃል በቃል፣ “ከየት እንደሆነ።”
    reason: literal_rendering
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: ሰውየውም መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመልስ እና የንግግር አወቃቀር በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ “ሰውየው” በዐውዱ ያለውን ከመወለዱ ዕውር የነበረውን ወንድ ያመለክታል።
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: የሚያስደንቀው ነገርስ ይህ ነው
  rationale: የግሪኩን ጠቋሚ አጽንዖትና አስደናቂነት ይጠብቃል። የ“-ስ” ቅጥያ የγάρን ማብራሪያዊና የንግግር አጽንዖት በተፈጥሯዊ መንገድ ያሳያል።
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: እናንተ ... አታውቁም
  rationale: በግሪኩ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም ይጠብቃል።
- source_word: πόθεν ἐστίν
  choice: ከየት እንደሆነ
  rationale: የኢየሱስን ምንጭ ወይም መገኛ የሚመለከተውን ጥያቄ በቀጥታ ያስተላልፋል፤ “ከየት እንደመጣ” የሚለውም ተፈጥሯዊ አማራጭ ነው።
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: እርሱ ግን ዓይኖቼን ከፈተልኝ
  rationale: καί በዐውዱ ያለውን አንጻራዊና ምጸታዊ ኃይል “ግን” ያሳያል። የዓይን መከፈት በቀጥታ አካላዊ ፈውሱን ይገልጻል።
theological_decisions:
- issue: “ዓይኖቼን ከፈተልኝ” የሚለው አነጋገር በዮሐንስ ወንጌል ያለው መንፈሳዊ ጥልቅ ፍቺ
  choice: የአካላዊውን ፈውስ ቀጥተኛ አገላለጽ ማቆየት
  alternative: መንፈሳዊ መገለጥን በትርጉሙ ውስጥ በግልጽ ማከል
  rationale: በቅርብ ዐውዱ የተጠቀሰው የሰውየው አካላዊ ፈውስ ነው። ስለ ማየትና ዕውርነት ያለው መንፈሳዊ ድምፀት ከዐውዱ እንዲገለጥ ተትቷል እንጂ በትርጉሙ ላይ አልተጫነም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሰውየው ምጸታዊ አጽንዖት “እናንተ” እና “ግን” በሚሉት ቃላት ተጠብቋል።
