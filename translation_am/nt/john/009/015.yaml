translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክ ጽሑፉ የሚፈቅደው የ‘ጭቃ/ሸክላማ አፈር’ እና የ‘ማየት/እንደገና ማየት’ ልዩነት በማስታወሻዎች ተጠብቋል። በቀረበው የእንግሊዝኛ ንባብ የማስታወሻ ምልክቶቹ ከማስታወሻ ይዘታቸው ጋር ተቀያይረው ስለነበር፣ እዚህ [a] ከ‘ጭቃ’ ጋር፣ [b] ደግሞ ከ‘ማየት እንደቻለ’ ጋር በትክክል ተያይዘዋል።
