id: JHN.9.15
reference: John 9:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: am
  text: ስለዚህ ፈሪሳውያንም ደግመው እንዴት ማየት እንደጀመረ[b] ጠየቁት። እርሱም፣ “በዓይኖቼ ላይ ጭቃ[a] አደረገ፤ እኔም ታጠብኩ፤ አያለሁ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ሸክላማ አፈር።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “እንዴት እንደገና እንዳየ” ወይም “እንዴት ዓይኑ እንደበራ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ደግመው
  rationale: የጥያቄውን መደገም በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ ጋር ያለውን የቀጣይነትና የውጤት ግንኙነት ያሳያል።
- source_word: ἠρώτων
  choice: ጠየቁት
  rationale: ኢምፐርፌክት የሚያሳየው የተደጋገመ ጥያቄ በ‘ደግመው’ ተገልጧል፤ ይህ ቅርጽም በአማርኛ ተፈጥሯዊ ነው።
- source_word: καὶ οἱ Φαρισαῖοι
  choice: ፈሪሳውያንም
  rationale: የκαίን ‘ደግሞ/ም’ ትርጉም በቅጥያው ጠብቆ ፈሪሳውያንን ከቀደሙት ጠያቂዎች ጋር ያያይዛል።
- source_word: πῶς ἀνέβλεψεν
  choice: እንዴት ማየት እንደቻለ
  rationale: በዚህ የፈውስ አውድ ἀναβλέπω ዕይታን ማግኘት ወይም መልሶ ማየትን ያመለክታል፤ የተመረጠው አገላለጽ ግልጽና ተፈጥሯዊ ነው።
- source_word: Πηλὸν
  choice: ጭቃ
  rationale: πηλός ጭቃን ወይም ሸክላማ አፈርን ሊያመለክት ይችላል፤ ‘ጭቃ’ በዚህ አውድ ቀጥተኛና ለሁሉም የሚገባ ነው።
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: በዓይኖቼ ላይ ጭቃ አደረገልኝ
  rationale: ἐπιτίθημι አንድን ነገር በሌላ ነገር ላይ ማኖርን ያሳያል፤ ይህ አማርኛ ድርጊቱን ያለ ተጨማሪ ትርጓሜ ያቀርባል።
- source_word: ἐνιψάμην
  choice: ታጠብኩ
  rationale: የግሱን መካከለኛ ቅርጽ በተፈጥሯዊ አማርኛ ያሳያል፤ በአውዱ ዓይኖቹን እንደታጠበ ግልጽ ነው።
- source_word: βλέπω
  choice: አሁንም አያለሁ
  rationale: የአሁን ጊዜ ቅርጹ የፈውሱን ወቅታዊና ቀጣይ ውጤት ያሳያል፤ ‘አሁንም’ ይህን በአማርኛ ግልጽ ያደርገዋል።
