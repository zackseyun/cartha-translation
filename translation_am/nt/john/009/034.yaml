review_pass:
  verdict: revise
  source_fidelity: The draft retains the basic accusation and expulsion, but it changes the rhetorical present question by adding “try” (ትሞክራለህ), which is not present in διδάσκεις. It also renders the Greek plural ἁμαρτίαις as singular and adds the temporal connective “then.” The revision preserves the plural where natural and does not add these elements.
  naturalness: The revised wording is idiomatic modern standard Amharic while retaining the insult’s force. “ፈጽሞ በኃጢአቶች ተወልደህ” is a direct, comprehensible rendering; “እኛን ታስተምረናለህ?” naturally conveys the indignant rhetorical question.
  terminology: ኃጢአቶች retains the source’s plural without defining whose sins are meant. “ወደ ውጭ አስወጡት” accurately reflects ἐξέβαλον αὐτὸν ἔξω without prematurely specifying formal synagogue exclusion.
  issues:
  - severity: medium
    issue: “ልታስተምር ትሞክራለህ” adds the idea of attempting to teach.
    rationale: διδάσκεις means “you are teaching”; it does not contain a verb equivalent to “try.” The rhetorical force should arise from the question and emphatic subject, not an added action.
  - severity: medium
    issue: “በኃጢአት” singular does not reflect ἁμαρτίαις.
    rationale: Although singular can sound smoother in Amharic, the Greek plural is meaningful as the accusers’ intensified insult and can be retained naturally as “በኃጢአቶች.”
  - severity: low
    issue: “ከዚያም” adds an explicit temporal sequence.
    rationale: καί simply coordinates the final action; no temporal adverb is required.
  - severity: low
    issue: “አስወጥተው ጣሉት” is needlessly doubled and less precise than an explicit expulsion phrase.
    rationale: “ወደ ውጭ አስወጡት” directly represents the Greek verb plus ἔξω and preserves the contextually open sense.
  revised_text: እነርሱም መልሰው፣ “አንተ ፈጽሞ በኃጢአቶች ተወልደህ፣ እኛን ታስተምረናለህ?” አሉት። ወደ ውጭም አስወጡት።[a]
