  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: am
  text: እነርሱም መልሰው፣ “አንተ ፈጽሞ በኃጢአቶች ተወልደህ፣ እኛን ታስተምረናለህ?” አሉት። ወደ ውጭም አስወጡት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወደ ውጭ አስወጡት” የሚለው ከፊታቸው ማስወጣታቸውን ሊያመለክት ይችላል፤ በዐውዱ ግን ከምኵራብ ማኅበረሰብ ማግለላቸውንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: እነርሱም መልሰው … አሉት
  rationale: የግሪኩን ድርብ የንግግር አገላለጽ ሳይተው፣ በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ አወቃቀር ያቀርባል።
- source_word: Ἐν ἁμαρτίαις
  choice: በኃጢአት
  rationale: የግሪኩ ቃል በቁጥር ብዙ ቢሆንም፣ ‘በኃጢአቶች’ የሚለው በአማርኛ እጅግ እንግዳ ይሰማል፤ የከሳሾቹን ንቀትና የኃጢአት ሁኔታን ለመግለጽ ‘በኃጢአት’ ተመርጧል።
- source_word: ἐγεννήθης ὅλος
  choice: ሙሉ በሙሉ … ተወልደህ
  rationale: ὅλος የሚሰጠውን ሙሉነትና አጽንዖት ‘ሙሉ በሙሉ’ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: እኛን ልታስተምር ትሞክራለህ?
  rationale: ግልጽ የሆነውን σὺ እና የንቀት ጥያቄውን በአማርኛ ተፈጥሯዊ በሆነ ተግሣጽ ያስተላልፋል።
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: አስወጥተው ጣሉት
  rationale: የግሪኩን አጽንዖትና የጠላትነት ማስወጣት የሚያሳይ፣ በአማርኛም የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: ‘በኃጢአት ተወለድህ’ የሚለው ክስ ከልደት ዕውርነቱ ጋር ያለው ግንኙነት
  choice: ንግግሩ ሰውየው ከተወለደ ጀምሮ ሙሉ በሙሉ በኃጢአት እንደነበረ የሚከስ ስድብ ሆኖ ቀርቧል።
  alternative: የራሱን ኃጢአት፣ የወላጆቹን ኃጢአት ወይም የወረሰውን በደል በግልጽ መወሰን።
  rationale: ግሪኩ የከሳሾቹን ንግግር ይመዘግባል እንጂ ኃጢአቱ የማን ወይም በምን መልኩ እንደሆነ አይወስንም፤ ስለዚህ የሥነ መለኮት ውጥረቱ ተጠብቋል።
- issue: ἐξέβαλον αὐτὸν ἔξω የሚያመለክተው የማስወጣት መጠን
  choice: አስወጥተው ጣሉት
  alternative: ከምኵራብ ማኅበረሰብ አባረሩት
  rationale: ጽሑፉ በቀጥታ ከፊታቸው ማስወጣትን ያመለክታል፤ ዐውዱ ከምኵራብ ማኅበረሰብ መገለልን ሊያመለክት ቢችልም ይህን በዋናው ጽሑፍ በግልጽ አልተወሰነም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የከሳሾቹ ንቀት ተጠብቋል፤ ነገር ግን ጽሑፉ ያልወሰነው የኃጢአት ምንጭ ወይም የማስወጣቱ ሕጋዊ ደረጃ አልተጨመረም።
