  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: am
  text: እኛ እግዚአብሔር ለሙሴ እንደተናገረ እናውቃለን፤ ይህ ሰው ግን ከየት እንደሆነ አናውቅም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከየት እንደመጣ።” በዮሐንስ ወንጌል ስለ ኢየሱስ መገኛ የሚነሱ ጥያቄዎች ተራውን የሰው አመጣጥና ጥልቅ ሥነ መለኮታዊ ትርጉምን አብረው ሊይዙ ይችላሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪኩ በግልጽ የተጠቀሰውን አጽንዖታዊና ንጽጽራዊ ተውላጠ ስም ይጠብቃል።
- source_word: οἴδαμεν
  choice: እናውቃለን
  rationale: የእውቀትንና የእርግጠኝነትን አገላለጽ በቀጥታ ያስተላልፋል፤ በሁለቱም የግስ አጠቃቀሞች የቃል ተዛማጅነቱ ተጠብቋል።
- source_word: Μωϋσεῖ
  choice: ለሙሴ
  rationale: የግሪኩን ተቀባይ ቅርጽ በአማርኛ በተፈጥሮ የሚገልጽ ሲሆን የስሙንም የተለመደ የመጽሐፍ ቅዱስ አጻጻፍ ይከተላል።
- source_word: λελάληκεν
  choice: እንደተናገረ
  rationale: ፍጹም ጊዜው የተፈጸመና እንደ ጸና እውነታ የቀረን ንግግር ያሳያል፤ በአማርኛ የይዘት ንዑስ አረፍተ ነገሩ ውስጥ ይህ ቅርጽ ተፈጥሯዊ ነው።
- source_word: ὁ θεός
  choice: እግዚአብሔር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የግሪኩ θεός በዚህ ነጠላና የተወሰነ አገባብ የተለመደ አቻ ነው።
- source_word: τοῦτον δὲ
  choice: ይህ ሰው ግን
  rationale: የተናጋሪዎቹን ርቀት የሚያሳይ ጠቋሚ አገላለጽና ንጽጽሩን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: πόθεν ἐστίν
  choice: ከየት እንደሆነ
  rationale: ስለ ምንጭ፣ መገኛ ወይም አመጣጥ ያለውን ጥያቄ በሰፊ ሁኔታ ይጠብቃል፤ መልክዓ ምድራዊውንና ጥልቅ ሥነ መለኮታዊውን ፍቺ አይወስንም።
theological_decisions:
- issue: በπόθεν ἐστίν ውስጥ የኢየሱስ አመጣጥ ትርጉም
  choice: “ከየት እንደሆነ” ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: “ከየት እንደመጣ” ወይም “አመጣጡ ምን እንደሆነ”
