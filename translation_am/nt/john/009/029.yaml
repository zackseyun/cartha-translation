translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እኛ” የሚለው በግሪኩ ያለውን አጽንዖት ይጠብቃል፤ “ይህ ሰው ግን” የተናጋሪዎቹን ንጽጽራዊና አሳናሽ ርቀት ያሳያል።
