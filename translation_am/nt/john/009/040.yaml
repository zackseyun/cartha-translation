  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: am
  text: ከፈሪሳውያን መካከል ከእርሱ ጋር የነበሩ አንዳንዶች እነዚህን ሰሙ፤ እንዲህም አሉት፦ “እኛም ዕውሮች አይደለንም እንዴ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኛም ዕውሮች ነን እንዴ?” የግሪኩ ጥያቄ μή በሚለው ቃል ስለሚጀምር፣ አሉታዊ መልስን ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ሰምተው
  rationale: በትረካው አውድ የኢየሱስን ንግግር መስማታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκ τῶν Φαρισαίων
  choice: ከፈሪሳውያንም ... አንዳንዶቹ
  rationale: ἐκ ከቡድኑ ውስጥ የተወሰኑትን ብቻ ስለሚያመለክት፣ ሁሉንም ፈሪሳውያን ሳያጠቃልል ከፊልነቱን ይጠብቃል።
- source_word: ταῦτα
  choice: ይህን
  rationale: በአማርኛ ቀደም ሲል የተነገረውን ንግግር በተፈጥሯዊ ሁኔታ ያመለክታል፤ የግሪኩ ብዙ ቁጥር በአማርኛ ነጠላ ጠቋሚ መተርጎሙ የተለመደ ነው።
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: ከእርሱ ጋር የነበሩት
  rationale: ፈሪሳውያኑ በዚያ ከኢየሱስ ጋር መኖራቸውን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: εἶπον αὐτῷ
  choice: አሉት
  rationale: ‘ለእርሱ አሉ’ የሚለውን በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል፤ የቀጥታ ንግግሩ ቅርጽ ጥያቄ መሆኑን ያሳያል።
- source_word: Μὴ
  choice: … ነን እንዴ?
  rationale: μή አሉታዊ መልስ የሚጠብቅ ጥያቄ ነው። ‘እንዴ?’ በዚህ አውድ የመደነቅና ‘አይደለንም’ የሚል መልስ የመጠበቅን ስሜት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ
  choice: እኛም
  rationale: የ“-ም” ቅጥያው ‘እኛም/እኛ ደግሞ’ የሚለውን የማካተት ኃይል በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪኩ የጎላውን ተውላጠ ስም በግልጽ መጥቀስ ትኩረቱን ይጠብቃል።
- source_word: τυφλοί
  choice: ዕውሮች
  rationale: ቃሉን ያለ ትርጓሜያዊ ጭማሪ በቀጥታ ይተረጉማል፤ መንፈሳዊ ዘይቤውን አውዱ እንዲያሳይ ይተዋል።
- source_word: ἐσμεν
  choice: ነን
  rationale: የአሁን ጊዜውን አገናኝ ግስ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: τυφλοί የሚለውን ዘይቤያዊ ትርጉም በግልጽ መጨመር ወይም አለመጨመር
  choice: በዋናው ጽሑፍ ‘ዕውሮች’ ብቻ ማለት
  alternative: ‘በመንፈሳዊ ዕውሮች’ ማለት
  rationale: በአውዱ ዘይቤያዊ ትርጉሙ ቢታወቅም፣ የግሪኩ ጽሑፍ ቃሉን ያለ ተጨማሪ መግለጫ ይጠቀማል። ይህን ማቆየት የዮሐንስን ምፀትና የቃሉን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እንዴ?’ የንግግሩን የመደነቅ ስሜትና አሉታዊ መልስ መጠበቁን ያሳያል፤ የበለጠ ቃል በቃል አማራጭ በግርጌ ማስታወሻው ቀርቧል።
