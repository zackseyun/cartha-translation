base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: am
  text: ኢየሱስም ወደ ውጭ እንዳባረሩት ሰማ፤ አግኝቶትም፣ “አንተ በየሰው ልጅ[a] ታምናለህ?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “የሰው ልጅ” በሚለው ፈንታ “የእግዚአብሔር ልጅ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: አውጥተው እንደጣሉት
  rationale: የግሱንና የἔξωን አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ በዐውደ ንባቡም ከማኅበረሰቡ መባረሩን ያመለክታል።
- source_word: εὑρὼν
  choice: አግኝቶትም
  rationale: የአኦሪስት ተሳቢውን ቀዳሚ ድርጊት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Σὺ πιστεύεις
  choice: አንተ ... ታምናለህ?
  rationale: ግልጽ ተውላጠ ስሙን «አንተ» በማካተት በግሪኩ ያለውን አጽንዖት ይጠብቃል።
- source_word: πιστεύεις εἰς
  choice: በ... ታምናለህ
  rationale: ወደ አንድ ሰው የሚያመራ እምነትንና መታመንን በተለመደው የአማርኛ አገላለጽ ያቀርባል።
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በዳንኤል 7 እና በዮሐንስ ወንጌል ያለውን ርዕሳዊና ጥቅሳዊ ግንኙነት የሚጠብቅ የተለመደ አተረጓጎም ነው።
theological_decisions:
- issue: በጥያቄው ውስጥ ያለው ክርስቶሳዊ ማዕረግ የጽሑፍ ልዩነት
  choice: የሰው ልጅ
  alternative: የእግዚአብሔር ልጅ
  rationale: SBLGNT ἀνθρώπου («ሰው») የሚለውን ንባብ ስለሚከተል ይህ በዋናው ጽሑፍ ተቀምጧል፤ ታሪካዊና ሥነ መለኮታዊ ጠቀሜታ ያለው «የእግዚአብሔር ልጅ» የሚለው አማራጭ ንባብ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት በ«አንተ» ተጠብቋል፤ የጽሑፍ ልዩነቱም ሳይፈታ በማስታወሻ ቀርቧል።
