- from: ኢየሱስም እርሱን አውጥተው እንደጣሉት ሰማ፤ አግኝቶትም፣ “አንተ በሰው ልጅ ታምናለህ?” አለው።[a]
  to: ኢየሱስም ወደ ውጭ እንዳባረሩት ሰማ፤ አግኝቶትም፣ “አንተ በየሰው ልጅ[a] ታምናለህ?” አለው።
