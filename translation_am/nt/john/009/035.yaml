review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the SBLGNT reading “የሰው ልጅ” and represents the emphatic pronoun in the question. Its rendering of ἐξέβαλον ... ἔξω, however, is not idiomatic and can suggest a physical sequence of taking him out and throwing him down, rather than emphatic expulsion.
  naturalness: “አውጥተው እንደጣሉት” is awkward in modern standard Amharic. “ወደ ውጭ እንዳባረሩት” naturally conveys forceful expulsion without specifying an institution not stated in this verse. The footnote marker should immediately follow the title to which the textual variant pertains.
  terminology: “የሰው ልጅ” is the established Amharic rendering of the Johannine title and should remain in the text. The variant “የእግዚአብሔር ልጅ” is accurately and neutrally stated in the footnote.
  issues:
  - severity: medium
    issue: The expression “አውጥተው እንደጣሉት” is semantically and stylistically unsuitable for ἐξέβαλον αὐτὸν ἔξω.
    rationale: It can mean that they took him out and threw him, implying a physical act not required by the Greek. A verb of banishment with “ወደ ውጭ” better preserves the emphatic expulsion.
  - severity: low
    issue: The footnote anchor is placed after the closing quotation rather than after “የሰው ልጅ.”
    rationale: The note concerns the textual reading of the christological title, so its anchor should directly identify that phrase.
