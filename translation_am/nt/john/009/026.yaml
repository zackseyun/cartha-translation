  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: am
  text: ስለዚህ እንዲህ አሉት፦ “ምን አደረገብህ? ዓይኖችህንስ እንዴት ከፈተ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: እንዲህ አሉት
  rationale: የλέγω የአንድ ጊዜ ድርጊት ቅርጽ ሲሆን የቡድኑን ቀጥተኛ ንግግር ያስገባል። ጥያቄ እንደሆነ ከቀጣዩ ንግግር ግልጽ ቢሆንም፣ የግሪኩን ‘አሉ’ በቀጥታ ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ንግግር ተከትሎ የሚመጣውን ውጤትና የንግግር ቀጣይነት ያመለክታል፤ ከጊዜ ቅደም ተከተል ብቻ የበለጠ ግንኙነት አለው።
- source_word: αὐτῷ
  choice: አሉት
  rationale: የማየት ችሎታውን ያገኘውን ሰው የሚያመለክተው የተዘዋዋሪ ተሳቢ በአማርኛው ግስ ላይ በ‘-ት’ ተዋህዷል።
- source_word: Τί
  choice: ምን
  rationale: የመጀመሪያውን ቀጥተኛ ጥያቄ የሚያስገባ ተፈጥሯዊና ትክክለኛ አቻ ነው።
- source_word: ἐποίησέν σοι
  choice: አደረገብህ
  rationale: ποιέω ከዳቲቭ ተሳቢ ጋር ‘በአንተ ላይ/ለአንተ ምን አደረገ?’ የሚል ስፋት አለው። ‘አደረገብህ’ የመርማሪዎቹን ጥብቅ ቃና ሳያለዝብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πῶς
  choice: እንዴት
  rationale: የድርጊቱን አካሄድ ወይም መንገድ የሚጠይቀውን ተውሳክ በቀጥታ ይተረጉማል።
- source_word: ἤνοιξέν
  choice: ከፈተ
  rationale: የἀνοίγωን ንቁ ድርጊትና ያለፈ ጊዜ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σου τοὺς ὀφθαλμούς
  choice: ዓይኖችህን
  rationale: ግሪኩ ከአካል ክፍል ጋር የሚጠቀመውን አመልካችና አገናዛቢ ቅርጽ ተፈጥሯዊ በሆነው የአማርኛ ይዞታ ቅጥ ያቀርባል።
theological_decisions:
- issue: ἐποίησέν σοι ያለው ዳቲቭ ግንኙነት
  choice: አደረገብህ
  alternative: አደረገልህ
  rationale: ‘አደረገልህ’ ድርጊቱን በግልጽ እንደ ውለታ ሊያቀርብ ይችላል። የጥያቄውን የምርመራ ቃናና የግሪኩን ክፍትነት በተሻለ ለመጠበቅ ‘አደረገብህ’ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ ንግግር ተጠቅሟል። ‘ዓይኖችህንስ’ የሚለው ቅጥ ሁለተኛውን ተያያዥ ጥያቄ በተፈጥሯዊ ሁኔታ ያገናኛል።
