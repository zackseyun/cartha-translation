  text: ስለዚህ ያ ሰው እንዲህ ሲል መለሰ፦ “እርሱ ኃጢአተኛ መሆኑን ወይም አለመሆኑን አላውቅም።[a] አንድ ነገር አውቃለሁ፤ ዕውር ነበርኩ፣ አሁን ግን አያለሁ።”
  philosophy: optimal-equivalence
  footnotes:
