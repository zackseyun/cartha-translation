  rationale: የግሪኩን ቀላል አያያዥ በተፈጥሯዊ የአማርኛ ትረካ መንገድ ያቀርባል፤ በዐውዱ የግሱ ባለቤት ኢየሱስ መሆኑንም ያሳያል።
- source_word: παράγων
  choice: እያለፈ ሲሄድ
  rationale: የአሁን ጊዜ ቦዝ አንቀጹ ከዋናው ግስ ጋር በአንድ ጊዜ የቀጠለ የጀርባ ድርጊትን ያሳያል፤ ይህ አገላለጽ ‘እየሄደ ሳለ’ የሚለውን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εἶδεν
