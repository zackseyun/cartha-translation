  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: am
  text: ስለዚህ ጎረቤቶቹና ቀድሞ ለማኝ ሆኖ ሳለ ያዩት የነበሩ ሰዎች፣ “ተቀምጦ ሲለምን የነበረው ሰው ይህ አይደለምን?”[a] ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ተቀምጦ እየለመነ ያለው ይህ አይደለምን?” የግሪኩ ንባብ “ተቀምጦ” እና “እየለመነ” የሚሉ ተሳቢ ግሶችን በመጠቀም ሰውየውን በተለመደው የቀድሞ ተግባሩ ይለየዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ትረካ ከዚህ ምላሽ ጋር የሚያገናኘውን የትረካ ቀጣይነትና የውጤት ስሜት ይጠብቃል።
- source_word: γείτονες
  choice: ጎረቤቶቹ
  rationale: በአቅራቢያው የሚኖሩትን ሰዎች በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: ቀድሞ ... ያዩት የነበሩ
  rationale: ቀደም ሲል ያውቁት ዘንድ ደጋግመው ያዩት እንደነበር የሚጠቁመውን የቀድሞ ጊዜ አውድ ይጠብቃል።
- source_word: ὅτι προσαίτης ἦν
  choice: ለማኝ ሆኖ
  rationale: ὅτι እዚህ የሰውየውን ቀድሞ የሚታወቅበትን ሁኔታ እንደሚያብራራ በተፈጥሯዊ አማርኛ ያቀርባል፤ ግልጽ ያልሆነ የምክንያት ግንኙነት አያስገባም።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩን ያልተጠናቀቀ ግስ ቀጣይ ወይም ተደጋጋሚ ንግግር አድርጎ ያሳያል።
- source_word: Οὐχ οὗτός ἐστιν
  choice: ይህ አይደለምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አሉታዊ ጥያቄ ቅርጽ ይጠብቃል።
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: ተቀምጦ ይለምን የነበረው ሰው
  rationale: ተሳቢ አካላቱ ሰውየውን በተለመደው የቀድሞ ተግባሩ እንደሚለዩት በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
