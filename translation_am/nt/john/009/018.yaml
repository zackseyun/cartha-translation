    text: ወይም “የአይሁድ መሪዎች” ወይም “የይሁዳ ሕዝብ”፤ ይህ በዮሐንስ ወንጌል “አይሁድ” የሚለው ቃል በዚህ አውድ እንዴት እንደተጠቀመበት ላይ ይወሰናል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: አላመኑም
  rationale: ὅτι በሚጀምረው የይዘት ንግግር የቀረበውን እውነታ አለመቀበልን ያመለክታል፤ “አላመኑም” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን ሰፊ እና በዮሐንስ ውስጥ እንደ አውዱ የሚለዋወጥ አጠቃቀም ሳያጠብ ይጠብቃል፤ ሊሆኑ የሚችሉ የአውድ ትርጉሞች በማስታወሻ ተገልጠዋል።
- source_word: περὶ αὐτοῦ
  choice: ስለ እርሱ
  rationale: περί ከባለቤት አገናዛቢ ጋር ያለውን “ስለ/በተመለከተ” ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἦν τυφλὸς
  choice: ዓይነ ስውር እንደነበረ
  rationale: የቀድሞውን ሁኔታ ከተፈወሰበት ጊዜ አንጻር ግልጽ ያደርጋል፤ “ዓይነ ስውር” ደግሞ የተከበረና ዘመናዊ አገላለጽ ነው።
- source_word: ἀνέβλεψεν
  choice: ማየት እንደቻለ
  rationale: በፈውስ አውድ ዓይኑ ተከፍቶ ማየት መቻሉን ያሳያል፤ ከዚህ በፊት ያይ እንደነበር በስህተት አያመለክትም።
- source_word: ἕως ὅτου
  choice: እስኪጠሩ ድረስ
  rationale: የድርጊቱን ጊዜያዊ ወሰን በተለመደ የአማርኛ አገባብ ይገልጣል።
- source_word: ἐφώνησαν
  choice: ጠሩ
  rationale: φωνέω በዚህ አውድ ሰዎችን እንዲቀርቡ መጥራትን ያመለክታል፤ “ጠሩ” ከ“አስጠሩ” ወይም “ጥሪ አቀረቡ” ይበልጥ ቀጥተኛ ነው።
- source_word: γονεῖς
  choice: ወላጆች
  rationale: የግሪኩን መደበኛ የወላጆች ስያሜ በትክክልና በአጭሩ ያስተላልፋል።
- source_word: τοῦ ἀναβλέψαντος
  choice: ማየት የቻለውን ሰው
  rationale: ግለሰቡን ማየት በቻለበት ክስተት የሚለየውን የግሪክ አንቀጽ-አሳታፊ ቅርጽ በተፈጥሯዊ አማርኛ ይወክላል።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚለው አገላለጽ የሚያመለክተው ቡድን
  choice: አይሁድ
  alternative: የአይሁድ መሪዎች፤ የይሁዳ ሰዎች
  rationale: ዋናው ጽሑፍ የግሪኩን ግልጽ ቃል ይጠብቃል፤ በቅርብ አውዱ መርማሪ ባለሥልጣናትን ሊያመለክት ቢችልም ጽሑፉ ራሱ በግልጽ “መሪዎች” አይልም። ስለዚህ የአውዱ አማራጮች የትርጉም ውጥረቱን ሳይፈቱ በማስታወሻ ቀርበዋል።
