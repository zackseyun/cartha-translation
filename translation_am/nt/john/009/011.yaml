- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: ኢየሱስ የሚባለው ሰው
  rationale: ተናጋሪው በዚህ የትረካ ደረጃ ኢየሱስን እንደ ሰው ብቻ መለየቱን ይጠብቃል፤ ከጽሑፉ በላይ የሆነ እምነት-ነክ ማዕረግ አይጨምርም።
- source_word: πηλὸν ἐποίησεν
  choice: ጭቃ ሠርቶ
  rationale: πηλός ጭቃን ወይም ሸክላማ አፈርን ሊያመለክት ይችላል፤ በቅርብ ዐውዱ ከምራቅ ጋር የተሠራውን ነገር ‘ጭቃ’ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
