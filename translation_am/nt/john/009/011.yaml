  text: እርሱም መልሶ፣ “ኢየሱስ የሚባል ሰው ጭቃ[a] ሠርቶ በዓይኖቼ ላይ ቀባ[b]፤ ‘ወደ ሲሎአም ሂድና ታጠብ’ አለኝ። ስለዚህ ሄጄ ታጠብኩ፤ ማየትም ቻልኩ[c]።”
  philosophy: optimal-equivalence
  footnotes:
