  rationale: በፈውስ ዐውድ ግሱ ከዓይነ ስውርነት በኋላ ማየት መቻልን ያመለክታል፤ ‘ወደ ላይ አየሁ’ የሚለውን ከዐውዱ የማይስማማ ትርጉም ያስወግዳል።
