- source_word: εἶπέν μοι ὅτι
  choice: አለኝ
  rationale: ቀጥተኛ ንግግርን በዘመናዊ አማርኛ በተፈጥሮ ያስተዋውቃል።
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: ወደ ሰሊሆም ሂድና ታጠብ
  rationale: ሁለቱንም ትእዛዞች በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ ግሪኩ በዚህ ቁጥር ‘መ池’ የሚለውን ስለማይደግም ስሙን ብቻ ይጠብቃል።
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
