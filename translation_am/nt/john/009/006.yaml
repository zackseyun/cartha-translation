  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: am
  text: እነዚህን ከተናገረ በኋላ፣ መሬት ላይ ተፋ፤ በምራቁም ጭቃ ሠራ፤ ጭቃውንም በዓይኖቹ ላይ ቀባ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ግስ “መቀባ” ወይም “መለቅለቅ” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: ይህን ከተናገረ በኋላ
  rationale: የአኦሪስት አሳታፊው ድርጊት ከዋናዎቹ ድርጊቶች በፊት መፈጸሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἔπτυσεν χαμαί
  choice: መሬት ላይ ተፋ
  rationale: χαμαί የሚያመለክተውን ወደ መሬት የተደረገ ግልጽ አካላዊ ድርጊት በቀጥታ ያስተላልፋል።
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: በምራቁም ጭቃ ሠራ
  rationale: πηλός በዚህ አውድ ከአፈርና ከምራቅ የተሠራ እርጥብ ጭቃን ያመለክታል፤ ἐκ የሚያሳየው ምንጭ በመሣሪያዊው «በምራቁ» በተፈጥሯዊ አማርኛ ተገልጿል።
- source_word: ἐπέχρισεν
  choice: ቀባ
  rationale: «ቀባ» ጭቃውን በዓይኖቹ ላይ የመለቅለቅን አካላዊ ድርጊት በተፈጥሯዊ አማርኛ ይገልጻል፤ ከግሪኩ ግስ ጋር የተያያዘውን «መቀባ/መለቅለቅ» የትርጉም ስፋትም አያጠፋም።
- source_word: αὐτοῦ ... ἐπὶ τοὺς ὀφθαλμούς
  choice: በዓይኖቹ ላይ
  rationale: ተውላጠ ስሙ በአውዱ ዓይነ ስውሩን ሰው እንደሚያመለክት በአማርኛው የባለቤትነት ቅጥያ በግልጽና አጭር መንገድ ተገልጿል።
- source_word: τὸν πηλόν
  choice: ጭቃውን
  rationale: የተወሰነው መስተዋድድ ቀደም ሲል የተሠራውን ጭቃ መልሶ እንደሚያመለክት «ጭቃውን» ይጠብቃል።
theological_decisions:
- issue: ἐπέχρισεν ሊኖረው የሚችለው ሥርዓታዊ የመቀባት ፍንጭ
  choice: በዋናው ጽሑፍ «ቀባ» ተብሎ ተተርጉሟል።
