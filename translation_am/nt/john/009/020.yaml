- source_word: τυφλὸς ἐγεννήθη
  choice: ዕውር ሆኖ እንደተወለደ
  rationale: የግሪኩን አገላለጽ በቅርብ ይከተላል፣ ዓይነ ስውርነቱም ከልደቱ ጀምሮ እንደነበረ ያሳያል።
