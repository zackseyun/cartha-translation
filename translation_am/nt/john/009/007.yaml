source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: am
  text: እርሱም፣ “ሂድ፤ በሰሊሆም የውኃ ገንዳ ውስጥ ታጠብ” አለው። (ይህም “የተላከ” ተብሎ ይተረጎማል።)[a] ስለዚህ ሄዶ ታጠበ፤ እያየም መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ትርጉሙ ‘የተላከ’ ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: ሂድ
  rationale: ቀጥተኛውን የመንቀሳቀስ ትእዛዝ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: νίψαι / ἐνίψατο
  choice: ታጠብ / ታጠበ
  rationale: νίπτω ሙሉ ሰውነትን መታጠብ ብቻ ሳይሆን የአካልን ክፍል ማጠብም ሊያመለክት ስለሚችል፣ አጠቃላዩና ተፈጥሯዊው አማርኛ “መታጠብ” ተመርጧል።
- source_word: εἰς τὴν κολυμβήθραν
  choice: በ…የውኃ ገንዳ
  rationale: κολυμβήθρα የውኃ ገንዳን ወይም ማጠራቀሚያን ያመለክታል፤ ከ“ታጠብ” ጋር “በ…ገንዳ” በአማርኛ ተፈጥሯዊ ነው።
- source_word: Σιλωάμ
  choice: ሰሊሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን የስፍራውን ስም አጻጻፍ ይከተላል።
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: “ሰሊሆም” ማለት “የተላከ” ማለት ነው
  rationale: የግሪኩን ገላጭ ትርጉም ያቆያል፤ Ἀπεσταλμένος ያለውን ተደራጊ አንቀጽ “የተላከ” በቀጥታ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በትእዛዙና በሰውየው ምላሽ መካከል ያለውን ተከታይ ውጤት በግልጽ ሁኔታ ያሳያል።
- source_word: ἀπῆλθεν
  choice: ሄዶ
  rationale: ቀላሉን የትረካ እንቅስቃሴ ያለ ተጨማሪ ትርጓሜ ያቀርባል።
- source_word: ἦλθεν βλέπων
  choice: እያየም መጣ
  rationale: የግሪኩን ተሳቢ አንቀጽ ሕያውነት ይጠብቃል፤ “ተመለሰ” የሚለውን በግሪኩ በግልጽ ያልተጻፈ ሐሳብ ሳይጨምር፣ አሁን ማየት እንደቻለ ያሳያል።
theological_decisions:
- issue: በ“ሰሊሆም” ስም ላይ የተሰጠውን ገላጭ ትርጉም ከመጠን በላይ ምሳሌያዊ ሳያደርጉ ማቅረብ
  choice: “ሰሊሆም” ማለት “የተላከ” ማለት ነው የሚለውን በዋናው ጽሑፍ ውስጥ በቅንፍ ማካተት
  alternative: ኢየሱስ በአብ የተላከ መሆኑን ከዚህ ስም ጋር በግልጽ የሚያገናኝ ትርጓሜ መጨመር
  rationale: ገላጩ ትርጉም በግሪኩ ጽሑፍ ራሱ ውስጥ ስላለ በዋናው ጽሑፍ ይቆያል፤ ሆኖም ዮሐንስ በዚህ ቁጥር በግልጽ ያልተናገረው ምሳሌያዊ ትርጉም አይጨመርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። አጭር የትረካ ቅደም ተከተሉና የመጨረሻው ተሳቢ አንቀጽ ሕያውነት ተጠብቀዋል። የእግር ማጠቢያ ወይም የጥምቀት ስፍራ የሚል ጠባብ ትርጉም እንዳይጫን “የውኃ ገንዳ” ተመርጧል።
