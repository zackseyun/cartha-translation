base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: am
  text: ኢየሱስ አላቸው፤ “ዕውሮች ብትሆኑ ኃጢአት[a] ባልነበራችሁ ነበር፤ አሁን ግን፣ ‘እናያለን’ ትላላችሁ፤ ስለዚህ ኃጢአታችሁ ይቀራል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ኃጢአት” የሚለው ቃል እዚህ የ“በደለኝነት” ወይም የ“በኃጢአት ተጠያቂነት” ሐሳብንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: ዕውሮች
  rationale: ቃሉ በቀጥታ ‘ዕውሮች’ ማለት ነው። በዐውዱ መንፈሳዊ አለማየትን በምሳሌ ቢያመለክትም፣ የምዕራፉን የእውርነትና የማየት የቃላት ጨዋታ ለማቆየት ትርጉሙ አልተስፋፋም።
- source_word: οὐκ ἂν εἴχετε ἁμαρτίαν
  choice: ኃጢአት ባልኖረባችሁም ነበር
  rationale: ከእውነታው ተቃራኒ የሆነውን መላምታዊ ውጤት በተፈጥሯዊ የአማርኛ ሁኔታ ያሳያል፤ ἁμαρτίαንም ‘ኃጢአት’ ብሎ በቀጥታ ይጠብቃል።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: በመላምታዊው ሁኔታና በአሁኑ እውነታ መካከል ያለውን ንጽጽር በአጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: λέγετε ὅτι Βλέπομεν
  choice: ‘እናያለን’ ትላላችሁ
  rationale: ከሁለተኛ መደብ ብዙ ቁጥር ወደ ቀጥተኛው የመጀመሪያ መደብ ብዙ ቁጥር ንግግር የሚደረገውን ለውጥና የንግግሩን ምፀት ይጠብቃል።
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: ኃጢአታችሁ እንዳለ ይኖራል
  rationale: μένει የሚገልጸውን ቀጣይ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ኃጢአት’ የሚለውንም የዮሐንስ ቁልፍ ቃል ይጠብቃል።
theological_decisions:
- issue: ‘ዕውር’ መንፈሳዊ እውርነትን፣ ‘ኃጢአት’ ደግሞ ተጠያቂነትን እንደሚያመለክቱ በዋናው ጽሑፍ ግልጽ ማድረግ ወይም አለማድረግ
