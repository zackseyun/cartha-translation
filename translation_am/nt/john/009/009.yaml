  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: am
  text: አንዳንዶች፣ “እሱ ነው” ይሉ ነበር፤ ሌሎች ደግሞ፣ “አይደለም፤ እሱን ይመስላል እንጂ” ይሉ ነበር። እርሱ ግን፣ “እኔው ነኝ”[a] ይል ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እኔ ነኝ።” እዚህ ላይ ሰውየው እየተነጋገሩበት ያለው ሰው እርሱ መሆኑን እየገለጸ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: አንዳንዶች … ሌሎች ደግሞ
  rationale: በሕዝቡ መካከል የነበሩትን ሁለት የተለያዩ ወገኖች በተፈጥሯዊ አማርኛ ያነጻጽራል።
- source_word: ἔλεγον … ἔλεγεν
  choice: ይሉ ነበር … ይል ነበር
  rationale: የግሱን ያላለቀ ጊዜ በመጠበቅ ውይይቱና የሰውየው ተደጋጋሚ ማረጋገጫ እንደቀጠሉ ያሳያል።
- source_word: Οὗτός ἐστιν
  choice: እሱ ነው
  rationale: በዐውዱ የተጠቀሰውን ሰው በቀጥታ የሚለይ አጭርና ተፈጥሯዊ አገላለጽ ነው።
- source_word: Οὐχί, ἀλλὰ ὅμοιος αὐτῷ ἐστιν
  choice: አይደለም፤ እሱን ይመስላል እንጂ
  rationale: እሱ ያው ሰው ነው የሚለውን ሐሳብ በመቃወም መመሳሰልን ብቻ የሚያሳየውን ንጽጽር ይጠብቃል።
- source_word: ἐκεῖνος
  choice: እርሱ ግን
  rationale: ከሕዝቡ ክርክር ወደ ተፈወሰው ሰው ማረጋገጫ የሚደረገውን ሽግግር ግልጽ ያደርጋል።
- source_word: Ἐγώ εἰμι
  choice: እኔው ነኝ
  rationale: በአማርኛ ተፈጥሯዊ የሆነ ራስን የመለየት አገላለጽ ሲሆን፣ ἐγώ ያለውን አጽንዖትም በ‘እኔው’ ያሳያል።
theological_decisions:
- issue: በዮሐንስ ወንጌል ዐውድ Ἐγώ εἰμιን መተርጎም
  choice: እኔው ነኝ
  alternative: እኔ ነኝ
  rationale: በቅርብ ዐውዱ ተናጋሪው የተፈወሰው ዕውር ሰው ሲሆን፣ ሕዝቡ የሚከራከርበት ሰው እርሱ መሆኑን እያረጋገጠ ነው። ስለዚህ ንግግሩን ክርስቶሳዊ መለኮታዊ መጠሪያ አድርጎ ሳይጭንበት፣ ቀጥተኛውን ራስን የመለየት ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሶቹ ቀጣይነት ‘ይሉ ነበር/ይል ነበር’ በሚሉ ቅርጾች ተጠብቋል።
