  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: am
  text: ኢየሱስም፣ “አይተኸዋል፤ ከአንተ ጋር የሚናገረውም[a] እርሱ ነው” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለአንተ የሚናገረውም እርሱ ነው።” ግሪኩ ቃል በቃል “ከአንተ ጋር የሚናገረው” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: በቀጥተኛ የትረካ ንግግር ውስጥ ያለውን ‘እርሱን አለው’ የሚል ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ነገረው’ ከግሪኩ በላይ የመንገር ኃይል ሊጨምር ይችላል።
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: አይተኸዋል
  rationale: የግሪኩ ፍጹም ጊዜ ቀድሞ የተፈጸመው ማየት አሁንም ያለውን ጠቀሜታ ያሳያል። ‘አይተኸዋል’ ይህን ከ‘አየኸው’ ይልቅ በተሻለ ይጠብቃል። ካί በአማርኛ የንግግሩን ተፈጥሯዊነት ለመጠበቅ በተከታዩ ‘-ም’ ተወክሏል።
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: ከአንተ ጋር የሚናገረው
  rationale: ὁ λαλῶν የአሁን ጊዜ አሳታፊ ቅርጽ ስለሆነ ‘የሚናገረው’ በሚል ተተርጉሟል። μετά ከዝርያ ቅጽ ጋር በመጣቱ ‘ከአንተ ጋር’ የሚለው የግሪኩን ቀጥተኛ አገላለጽ ይጠብቃል።
- source_word: ἐκεῖνός ἐστιν
  choice: እርሱ ነው
  rationale: አጭሩንና ግልጹን የማንነት መግለጫ ይጠብቃል፤ በዚህ ቁጥር ያልተደገመውን ቀዳሚ ማዕረግ አይጨምርም።
theological_decisions:
- issue: ኢየሱስ በቀደመው አውድ የተጠየቀው ሰው እርሱ መሆኑን መግለጹ
  choice: ‘ከአንተ ጋር የሚናገረውም እርሱ ነው’ በሚል ቀጥተኛና ያልተስፋፋ የማንነት መግለጫ መተርጎም
  alternative: ‘የሰው ልጅ እኔ ነኝ’ ብሎ በማስፋት መተርጎም
  rationale: ግሪኩ ኢየሱስን በቀደመው ጥያቄ ከተጠቀሰው አካል ጋር ያንድነታል፣ ነገር ግን ማዕረጉን በዚህ ቁጥር አይደግምም። ትርጉሙ የመገለጡን ኃይል ሳያዳክም ከጽሑፉ በላይ እንዳይሰፋ ተደርጓል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የወንድ ነጠላ ሁለተኛ መደብ ቅርጾች (‘አይተኸዋል፣’ ‘ከአንተ’) ከአውዱ ጋር ይስማማሉ።
