lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የግሪኩን ቀላል አያያዥ በአማርኛው -ም ቅጥያ በተፈጥሯዊ ሁኔታ ያሳያል፤ በትረካው ላይ ተጨማሪ የምክንያት ወይም የጊዜ ትርጉም አይጨምርም።
- source_word: εἶπαν αὐτῷ
  choice: አሉት
  rationale: የብዙ ቁጥር ተናጋሪዎችንና ወንድ ነጠላ ተቀባይን በአንድ ተፈጥሯዊ የአማርኛ ግስ ያሳያል። ንግግሩ ጥያቄ ቢሆንም εἶπαν በቀጥታ ‘አሉ’ ተብሎ ተተርጉሟል።
- source_word: Ποῦ
  choice: የት
  rationale: የቦታ ጥያቄን በዘመናዊ አማርኛ በቀጥታና በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ἐκεῖνος
  choice: ያ ሰው
  rationale: በስም ፈንታ የቆመውን አመልካች ተውላጠ ስም የርቀት አመልካችነት በሚጠብቅና በአማርኛ ተፈጥሯዊ በሆነ አገላለጽ ያሳያል።
- source_word: λέγει
  choice: እርሱም … አለ
  rationale: የዮሐንስን ታሪካዊ የአሁን ጊዜ ግስ በአማርኛ ትረካ ተፈጥሯዊ በሆነው ያለፈ ጊዜ ያቀርባል፤ ተናጋሪውንም ግልጽ ለማድረግ ‘እርሱም’ ተጨምሯል።
- source_word: Οὐκ οἶδα
  choice: አላውቅም
  rationale: አሉታዊውን የመረዳት/የማወቅ አገላለጽ አጭር፣ ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
