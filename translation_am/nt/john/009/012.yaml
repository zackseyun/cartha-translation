  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: am
  text: እነርሱም፣ “ያ ሰው[a] የት ነው?” አሉት። እርሱም፣ “አላውቅም” አለ።
  philosophy: optimal-equivalence
  footnotes:
