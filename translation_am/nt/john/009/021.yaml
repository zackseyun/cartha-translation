source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: am
  text: ነገር ግን አሁን እንዴት እንደሚያይ አናውቅም፤ ወይም ዓይኖቹን ማን እንደከፈተለት እኛ አናውቅም። እርሱን ጠይቁ፤ ዕድሜው ደርሷል። ራሱ ስለ ራሱ ይናገራል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራሱ ስለ ራሱ መናገር ይችላል።” በግሪክኛ ያለው የወደፊት ጊዜ አገላለጽ ራሱ መመለስ እንደሚችል ወይም የመመለስ ኃላፊነት እንዳለበት የሚያሳይ ተግባራዊ አገላለጽ ሊሆን ይችላል።
    reason: የግሪክኛው λαλήσει የወደፊት ጊዜ ቅርጽ ቀጥተኛ የወደፊት ድርጊትን ወይም በአውዱ የችሎታና የኃላፊነት ተግባራዊ ማረጋገጫን ሊገልጥ ይችላል።
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: ነገር ግን አሁን እንዴት እንደሚያይ
  rationale: πῶςን “እንዴት”፣ δέን በለሆሳስ ተቃርኖ የሚያሳይ “ነገር ግን”፣ νῦνን “አሁን” ብሎ ያቀርባል። βλέπει የአሁን ጊዜ ግስ ስለሆነ “መያየት እንደቻለ” በማለት የችሎታን ሐሳብ ሳይጨምር “እንደሚያይ” ተብሏል።
- source_word: οὐκ οἴδαμεν
  choice: አናውቅም
  rationale: οἶδα በዚህ አውድ “ማወቅ” ማለት ነው። በግሪክኛው ያለውን አጽንዖትና የምስክርነት ቅርጽ ለማቆየት ሐረጉ ሁለት ጊዜ ተደግሟል።
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: ወይም ዓይኖቹን ማን እንደከፈተለት
  rationale: ἤ አማራጭ ጥያቄን፣ τίς “ማን”ን፣ ἤνοιξενም “ከፈተ”ን ያመለክታሉ። “ዓይኖቹን ከፈተለት” የትረካውን ተደጋጋሚ ፈውሳዊ ፈሊጥ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: αὐτὸν ἐρωτήσατε
  choice: እሱን ጠይቁት
  rationale: የብዙ ሰዎች ትእዛዝ ቅርጽ ነው። “ጠይቁት” የተናጋሪዎቹን ቀጥተኛና ተፈጥሯዊ ንግግር ያቀርባል።
- source_word: ἡλικίαν ἔχει
  choice: ዕድሜው ደርሷል
  rationale: በዚህ አውድ ἡλικία የሰውነት ቁመትን ሳይሆን ራሱን ችሎ ለመመለስና ለመመስከር የሚያስችል የአዋቂነት ዕድሜን ያመለክታል። “ዕድሜው ደርሷል” ይህን በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: ራሱ ስለ ራሱ ይናገራል
  rationale: αὐτός ያለውን አጽንዖት “ራሱ” ይጠብቃል፤ περὶ ἑαυτοῦ “ስለ ራሱ” ተብሏል፤ λαλήσει የወደፊት ጊዜ ቅርጽ ቢሆንም በአማርኛ “ይናገራል” የወደፊትንም ሆነ ተግባራዊ ማረጋገጫን በተፈጥሯዊ ሁኔታ ሊገልጥ ይችላል።
theological_decisions:
- issue: በዚህ አውድ ἡλικίαν ἔχει የሚለው ትርጉም
  choice: ራሱን ችሎ ለመመለስ በቂ ዕድሜ እንዳለው ያመለክታል
  alternative: አጠቃላይ ብስለትን ወይም፣ እዚህ እጅግ የማይመስለውን፣ የሰውነት ቁመትን ሊያመለክት ይችላል
  rationale: የወላጆቹ ፍርሃትና የመሪዎቹ ጥያቄ የፍርድ ምርመራ መሰል አውድ ይፈጥራሉ። በቁጥር 23 የተደገመው ይህ ንግግርም ወላጆቹ ጠያቂዎቹን ወደ ልጃቸው ለምን እንደመሩ ያስረዳል።
- issue: የαὐτὸς περὶ ἑαυτοῦ λαλήσει ኃይል
  choice: ሰውየው ራሱ ስለ ራሱ ምስክርነት እንደሚሰጥ የሚያረጋግጥ ንግግር
  alternative: ስለ ራሱ እንደሚያወራ ብቻ የሚገልጥ ቀላል የወደፊት ጊዜ ንግግር
  rationale: የጥያቄና መልስ አውዱ የምስክርነት ኃይልን ይደግፋል። ዋናው ትርጉም የግሪክኛውን የወደፊት ጊዜ ቅርጽ ይጠብቃል፤ የችሎታ ወይም የኃላፊነት አገባብ ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ዕድሜው ደርሷል” ሕጋዊ/ማኅበራዊ የአዋቂነትን ሐሳብ በተፈጥሯዊ ፈሊጥ ያቀርባል። ማስታወሻው በምንጩ የሚመለከተው λαλήσει ስለሆነ [a] ምልክቱ ከመጨረሻው ሐረግ በኋላ ተቀምጧል።
