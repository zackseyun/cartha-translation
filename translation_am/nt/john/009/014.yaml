  text: ኢየሱስ ጭቃውን[a] ሠርቶ የዚያን ሰው ዓይኖች[b] የከፈተበት ቀን ሰንበት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሸክላውን።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው፣ “ዓይኖቹን ከፈተ” ይላል፤ ይህ ፈውሱን በተጨባጭ የሚገልጽ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: ሰንበት
  rationale: የግሪኩን የቀን መጠሪያ በቀጥታ ያስተላልፋል፤ በአማርኛም ያለ አላስፈላጊ የአንቀጽ ጭማሪ ተፈጥሯዊ ነው።
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: የ…በት ቀን
  rationale: ጊዜን የሚጠቁመውን ዝምድና በተፈጥሯዊ የአማርኛ አንቀጽ አወቃቀር ይገልጣል።
- source_word: πηλόν
  choice: ጭቃውን
  rationale: በአውዱ ውስጥ ከምራቅና ከመሬት የተሠራውን ነገር ለመግለጽ ተፈጥሯዊና ግልጽ ቃል ነው፤ ‘ሸክላ’ም ሊባል ይችላል።
- source_word: ἐποίησεν
  choice: ሠርቶ
  rationale: የποιέωን ቀላል የመሥራት ትርጉም ይጠብቃል፤ ከቀጣዩ ድርጊት ጋርም በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἀνέῳξεν
  choice: የከፈተበት
  rationale: የግሪኩን ተጨባጭ ‘ከፈተ’ አገላለጽ ይጠብቃል፤ በትርጓሜ ደረጃ ‘አየለት’ ወይም ‘እይታውን መለሰለት’ ብሎ አያሰፋውም።
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: ዓይኖቹን
  rationale: የአካል ክፍሉን በግልጽ ይጠቅሳል፤ ‘እይታውን’ በማለት ተጨባጩን የዮሐንስ አገላለጽ አያደበዝዝም።
- source_word: δὲ
  choice: በአማርኛ በተለየ ቃል አልተገለጸም
  rationale: δέ እዚህ ለስላሳ የትረካ ሽግግር ነው፤ ‘አሁን’ ወይም ‘ነገር ግን’ ማለት በአማርኛ ያልተፈለገ የጊዜ ወይም የተቃርኖ ክብደት ሊጨምር ይችላል።
theological_decisions:
- issue: የሰንበት መጠቀሱና የኢየሱስ ፈውስ
