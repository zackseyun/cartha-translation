  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: am
  text: እንዲህም ብለው ጠየቋቸው፦ “ይህ ዕውር ሆኖ እንደተወለደ የምትሉት ልጃችሁ ነው? ታዲያ አሁን እንዴት ያያል?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: እንዲህም ብለው ጠየቋቸው
  rationale: ዋናውን ግስና የጥያቄውን ይዘት የሚያስተዋውቀውን ቦዝ አንቀጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: ልጃችሁ ይህ ነው?
  rationale: የግሪኩ አወቃቀር በቅርጹ አረጋጋጭ ቢሆንም በዐውዱ ጥያቄ ነው፤ የአማርኛው አቀራረብ ይህን ተግባር በግልጽ ያሳያል።
- source_word: ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη
  choice: ዕውር ሆኖ እንደተወለደ የምትሉት
  rationale: λέγετεን ያለ ተጨማሪ ጥርጣሬ ‘የምትሉት’ ብሎ ያቀርባል፤ τυφλὸς ἐγεννήθηም ከትውልድ ጀምሮ የነበረውን ዕውርነት በተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: πῶς οὖν
  choice: ታዲያ ... እንዴት
  rationale: οὖν ከቀደመው ንግግር የሚነሳውን አመክንዮአዊ ግንኙነት ‘ታዲያ’ ይጠብቃል።
- source_word: βλέπει ἄρτι
  choice: አሁን ... ያያል
  rationale: የአሁኑን የማየት ሁኔታ እንጂ ችሎታን ብቻ አያመለክትም፤ ἄρτι የቀድሞ ዕውርነቱንና የአሁኑን ማየቱን ያነጻጽራል።
