  rationale: የግሪኩን የመልስ ንግግር አወቃቀር በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ ἐκεῖνος በዐውዱ ቀድሞ የታወቀውን ሰው ስለሚያመለክት “እርሱ” ተብሏል።
