  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: am
  text: ቀድሞ ዕውር የነበረውን ሰው ወደ ፈሪሳውያን አመጡት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: አመጡት
  rationale: በግሪክኛው ታሪካዊ የአሁን ጊዜ ቢሆንም፣ በተፈጥሯዊ የአማርኛ ትረካ ቀላል ያለፈ ጊዜ መጠቀም ተገቢ ነው። ቅጥያው -ት ወንዱን ተሳቢ ያመለክታል።
- source_word: αὐτὸν
  choice: -ት / ሰው
  rationale: የግሪክኛው ተውላጠ ስም ‘እርሱን’ ማለት ነው፤ በአማርኛ በግሱ የተሳቢ ቅጥያና ‘ሰው’ በሚለው ግልጽ ስም በተፈጥሯዊ ሁኔታ ተወክሏል።
- source_word: πρὸς τοὺς Φαρισαίους
  choice: ወደ ፈሪሳውያን
  rationale: πρός ከተሳቢ ሙያ ጋር በዚህ ስፍራ ወደ ሰዎች መንቀሳቀስን ያመለክታል፤ ‘ወደ’ ይህን በቀጥታ ያስተላልፋል።
- source_word: Φαρισαίους
  choice: ፈሪሳውያን
  rationale: በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም የታወቀው የቡድኑ ስም ነው።
- source_word: τόν ποτε τυφλόν
  choice: ቀድሞ ዕውር የነበረውን ሰው
  rationale: በግሪክኛው በስም ፈንታ የቆመውን ‘ቀድሞ ዕውር የነበረውን’ የሚለውን ሐረግ፣ በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን ‘ሰው’ በማከል ተተርጉሟል።
- source_word: ποτε
  choice: ቀድሞ
  rationale: የሰውየውን ያለፈ ሁኔታ ከአሁኑ ፈውስ ጋር ያነጻጽራል፤ ‘ቀድሞ’ ይህን ጊዜያዊ ልዩነት ግልጽ ያደርጋል።
- source_word: τυφλόν
  choice: ዕውር
  rationale: የቀድሞውን የማየት እክል በቀጥታ የሚገልጽ የተለመደ የአማርኛ ቃል ነው።
