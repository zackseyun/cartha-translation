base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: am
  text: ወላጆቹ እነዚህን ነገሮች የተናገሩት አይሁድን[a] ስለፈሩ ነበር፤ ምክንያቱም ማንም ሰው እርሱ መሲሕ[b] መሆኑን ቢመሰክር፣ ከምኩራብ እንዲባረር አይሁድ አስቀድመው ተስማምተው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ “አይሁድ።” በዚህ ዐውድ ቃሉ ሁሉንም የአይሁድ ሕዝብ በአጠቃላይ ከማመልከት ይልቅ፣ ከምኩራብ ለማባረር ሥልጣን የነበራቸውን የአይሁድ ባለሥልጣናት ሊያመለክት ይችላል።
    reason: cultural_note
  - marker: b
    text: ወይም፦ “ክርስቶስ መሆኑን” ወይም “እርሱ ክርስቶሱ መሆኑን።”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: እነዚህን የተናገሩት
  rationale: የብዙ ቁጥር አመልካችን ይጠብቃል፤ የአማርኛው ትኩረት ሰጪ አወቃቀርም ለምክንያቱ ተፈጥሯዊ መግቢያ ይሰጣል።
- source_word: ἐφοβοῦντο
