  rationale: በታሪኩ ወቅት የነበረውን ቀጣይ ፍርሃት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪክ ቃሉን ሰፊና በዐውድ የሚወሰን ትርጉም በዋናው ጽሑፍ ይጠብቃል፤ በዚህ ዐውድ የምኩራብ ሥልጣን ያላቸው አመራሮች መሆናቸው በማስታወሻ ተብራርቷል።
- source_word: συνετέθειντο
  choice: አስቀድመው ተስማምተው ነበር
  rationale: ድርጊቱ ከዚህ ንግግር በፊት የተወሰነ የጋራ ስምምነት መሆኑን ይገልጣል።
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
