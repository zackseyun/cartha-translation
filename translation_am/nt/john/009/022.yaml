  rationale: ὁμολογέω የሚያመለክተውን ይፋዊ እውቅና በተፈጥሯዊ አማርኛ ያቀርባል፤ χριστόνንም እዚህ እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል።
- source_word: ἀποσυνάγωγος γένηται
  choice: ከምኩራብ እንዲወገድ
  rationale: ከምኩራብ ማኅበረሰብ የመለየትን ቅጣት ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
