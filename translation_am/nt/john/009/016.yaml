  rationale: ሰንበትን እንደ ትእዛዝ ማክበርና መጠበቅ የሚለውን ትርጉም በተለመደ አማርኛ ያቀርባል።
- source_word: ἁμαρτωλὸς ἄνθρωπος
  choice: ኃጢአተኛ ሰው
  rationale: ἁμαρτωλός ሰውን የሚገልጽ ቅጽል በመሆኑ፣ የግሪኩን አወቃቀርና ትርጉም በቀጥታ ይጠብቃል።
- source_word: τοιαῦτα σημεῖα
  choice: እንደዚህ ያሉ ምልክቶች
  rationale: τοιαῦτα የሚለውን ‘እንደዚህ ያሉ’ ብሎ ያሳያል፤ σημεῖαን ‘ምልክቶች’ ማለት በዮሐንስ ወንጌል ድርጊቶቹ ከራሳቸው ባሻገር የሚጠቁሙትን ራእያዊ ፍቺ ይጠብቃል።
