  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: am
  text: ስለዚህ ከፈሪሳውያን አንዳንዶቹ፣ “ይህ ሰው ሰንበትን ስለማይጠብቅ ከእግዚአብሔር የመጣ አይደለም” ይሉ ነበር። ሌሎች ግን፣ “ኃጢአተኛ ሰው[a] እንደዚህ ያሉ ምልክቶችን[b] እንዴት ሊያደርግ ይችላል?” ይሉ ነበር። በመካከላቸውም መከፋፈል ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአተኛ።” ግሪኩ “ኃጢአተኛ ሰው” ይላል፤ “ኃጢአተኛ” የሚለው ቅጽል “ሰው” የሚለውን ቃል ይገልጻል።
    reason: lexical_alternative
  - marker: b
    text: ዮሐንስ ለኢየሱስ ሥራዎች “ምልክቶች” የሚለውን ቃል ብዙ ጊዜ ይጠቀማል፤ ይህም ሥራዎቹ ስለ ኢየሱስ ማንነት የሚጠቁም ፍቺ እንዳላቸው ያጎላል። እንደ አማራጭ “ተአምራዊ ምልክቶች” ማለት ይህን ፍቺ ይበልጥ ግልጽ ያደርገዋል።
    reason: lexical_alternative
