  rationale: ማሳያ ተውላጠ ስሙንና ወንድ ግለሰብን የሚያመለክተውን ትርጉም ያለ ተጨማሪ ንቀት ይጠብቃል።
- source_word: παρὰ θεοῦ
  choice: ከእግዚአብሔር የመጣ
  rationale: የመነሻን ወይም የምንጭን ሐሳብ ይገልጣል፤ በግሪኩ በቀጥታ የሌለውን ‘የተላከ’ የሚለውን ሐሳብ አይጨምርም።
- source_word: τηρεῖ τὸ σάββατον
