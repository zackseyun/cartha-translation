  rationale: ὅταν ከተያያዘው ንዑስ አንቀጽ ጋር በዚህ ዐውድ ‘በዓለም ውስጥ ባለሁበት ጊዜ/እስካለሁ ድረስ’ የሚል ጊዜያዊ ትርጉም ይሰጣል፤ ይህ አተረጓጎም ‘while’ የሚለውን በተፈጥሯዊ አማርኛ ያቀርባል።
