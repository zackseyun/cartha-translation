  rationale: μή በቀጥተኛ ጥያቄ ውስጥ በተለምዶ አሉታዊ መልስን ይጠብቃል። ይህ ሰውየው ለጠያቂዎቹ የሰጠውን የተገላቢጦሽ ምላሽ ቃና ይጠብቃል፤ የሰዋስው ጉዳይ እንጂ የተለየ የእምነት ትርጓሜ አይጨምርም።
