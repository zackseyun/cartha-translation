  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: am
  text: እርሱም መልሶ እንዲህ አላቸው፤ “አስቀድሜ ነግሬአችኋለሁ፤ እናንተ ግን አልሰማችሁም።[a] እንደገና ለምን መስማት ትፈልጋላችሁ? እናንተም ደግሞ የእርሱ ደቀ መዛሙርት መሆን አትፈልጉም፣ አይደል?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አልሰማችሁም” ተብሎ የተተረጎመው የግሪክኛ ግስ “አልሰማችሁም” ወይም “ጆሮ አልሰጣችሁም” ማለት ሊሆን ይችላል፤ በዚህ አውድ የተነገረውን አለመቀበል ወይም ችላ ማለት የሚለው ሐሳብ ይበልጥ ይገባል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እናንተም ደግሞ የእርሱ ደቀ መዛሙርት መሆን አትፈልጉምን?” የግሪክኛው ጥያቄ አሉታዊ መልስ እንደሚጠበቅ ያመለክታል።
    reason: lexical_alternative
