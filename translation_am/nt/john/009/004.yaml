  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: am
  text: ቀን ሳለ የላከኝ ሰው ሥራዎችን ልንሠራ ይገባናል፤ ማንም ሊሠራ የማይችልበት ሌሊት እየመጣ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “የላከኝ ሰው ሥራዎችን ልሠራ ይገባኛል” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: ልንሠራ ይገባናል
  rationale: ἡμᾶς ከδεῖ ጋር የመጀመሪያ መደብ ብዙ ቁጥርን ያመለክታል፤ በተፈጥሯዊ አማርኛም ‘ልንሠራ ይገባናል’ ተብሎ የግዴታው ኃይል ተጠብቋል።
- source_word: δεῖ
  choice: ይገባናል
  rationale: ግዴታንና አስፈላጊነትን በክብር ያለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: ሥራዎችን ልንሠራ
  rationale: የግሪኩን የተመሳሳይ ሥር ቃላት ግንኙነት በአማርኛ ተፈጥሯዊ በሆነ ‘ሥራዎችን ልንሠራ’ ጠብቋል።
- source_word: τοῦ πέμψαντός με
  choice: የላከኝን የእርሱን
  rationale: አንቀጻዊውን ተሳቢ ‘የላከኝ’ በማለት ይገልጣል፤ ‘የእርሱን’ የሥራዎቹን ባለቤትነት ግልጽ ያደርጋል እንጂ ላኪውን በዋናው ጽሑፍ ከግሪኩ በላይ አይለይም።
- source_word: ἕως ἡμέρα ἐστίν
  choice: ቀን ሳለ
  rationale: ከሚመጣው ሌሊት ጋር ያለውን ንጽጽርና ለሥራ ያለውን ጊዜ በአጭር ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔρχεται νὺξ
  choice: ሌሊት እየመጣ ነው
  rationale: የአሁን ጊዜውን ቅርብ የወደፊት ኃይል ያስተላልፋል።
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: ማንም ሊሠራ የማይችልበት
  rationale: ὅτε የሚያስገባውን የጊዜ አንቀጽ በአማርኛ ተዛማጅ ቅርጽ ያቀርባል፤ οὐδεὶς ሰውን በጾታ ሳይወስን ‘ማንም’ ተብሏል።
theological_decisions:
- issue: በቁጥሩ መጀመሪያ ያለው የጽሑፍ ልዩነት፦ ἡμᾶς (‘እኛ’) ወይስ ἐμέ (‘እኔ’)
  choice: የላከኝን የእርሱን ሥራዎች ልንሠራ ይገባናል
  alternative: የላከኝን የእርሱን ሥራዎች ልሠራ ይገባኛል
  rationale: የተሰጠው SBLGNT ጽሑፍ ἡμᾶς ስለሚል ዋናው ትርጉም የብዙ ቁጥርን ንባብ ይከተላል። የነጠላ ቁጥር ንባብ በብዙ የእጅ ጽሑፎችና ትርጉሞች ስለሚገኝ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሥራዎችን ልንሠራ’ የዮሐንስን የቃላት ግንኙነት ሲጠብቅ፣ የቀንና የሌሊት ዘይቤ ሳይተረጎም በጽሑፉ የራሱ ውጥረት እንዲቆይ ተደርጓል።
