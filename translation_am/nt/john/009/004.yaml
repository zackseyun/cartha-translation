review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly follows the SBLGNT plural reading (ἡμᾶς) and retains the temporal contrast between day and the coming night. However, “የላከኝን የእርሱን ሥራዎች” does not accurately or grammatically express τοῦ πέμψαντός με (“of the one who sent me”): it adds an ill-fitting pronoun and obscures the genitive relationship.'
  naturalness: The overall sentence is fluent modern Amharic, but the noun phrase containing “የእርሱን” is unnatural and structurally defective. Recasting it with “የላከኝ ሰው” makes the referent and possessive relationship clear in idiomatic Amharic.
  terminology: “ሥራዎችን ልንሠራ,” “ይገባናል,” “ቀን ሳለ,” and “ሌሊት እየመጣ ነው” appropriately preserve the verse’s wording, register, and imagery. The footnote rightly records the singular textual variant without preferring it in the main text.
  issues:
  - severity: medium
    issue: The phrase “የላከኝን የእርሱን ሥራዎች” is grammatically and semantically unclear.
    rationale: τοῦ πέμψαντός με identifies the sender as the possessor of the works. The added “የእርሱን” is unsupported by the Greek and, together with the accusative form “የላከኝን,” produces an unnatural construction.
  revised_text: ቀን ሳለ የላከኝ ሰው ሥራዎችን ልንሠራ ይገባናል፤ ማንም ሊሠራ የማይችልበት ሌሊት እየመጣ ነው።[a]
  revised_footnotes:
