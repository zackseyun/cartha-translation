    issue: «ከየብሱ» is not the correct standard Amharic form.
    rationale: The noun is «የብስ»; after «ከ», the expected form is «ከየብስ».
  - severity: low
    issue: The present clause order and «... ብቻ እንጂ ሩቅ ስላልነበሩ» construction are unnecessarily awkward.
    rationale: The Greek gives the arrival first, followed by an explanatory reason and the approximate distance. Recasting this sequence preserves the sense while producing clearer Amharic.
