base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: am
  text: ሌሎቹ ደቀ መዛሙርት ግን በትንሿ ጀልባ መጡ፤ ከየብስ ሩቅ አልነበሩምና፣ ነገር ግን ወደ ሁለት መቶ ክንድ ያህል ብቻ ርቀው ነበር፤ ዓሣዎቹን የያዘውን መረብም እየጎተቱ ነበር።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሁለት መቶ ክንድ ወደ 90 ሜትር ያህል ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ «የዓሣዎቹን መረብ»። የግሪኩ አገላለጽ ቃል በቃል እንዲህ ሊተረጎም ይችላል፤ በዚህ አውድ ግን ዓሣዎቹን የያዘውን መረብ እንደሚያመለክት ይታያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: ሌሎቹ ደቀ መዛሙርት ግን
  rationale: δέ ከቀደመው የጴጥሮስ ድርጊት ጋር ያለውን ተቃርኖ ለማሳየት «ግን» ተብሏል፤ ἄλλοι μαθηταί ደግሞ በተፈጥሯዊ አማርኛ «ሌሎቹ ደቀ መዛሙርት» ተብሏል።
- source_word: τῷ πλοιαρίῳ
  choice: በትንሿ ጀልባ
  rationale: πλοιάριον የመጠን ማሳነሻ ቅርጽ ስለሆነ «ትንሿ ጀልባ» የሚለው የግሪኩን ልዩነት ይጠብቃል።
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: ከየብሱ ... ሩቅ ስላልነበሩ
  rationale: γάρ ምክንያትን ያስተዋውቃል፤ γῆ በዚህ አውድ ከውኃው በተቃራኒ ያለውን የብስ ወይም ዳርቻ ያመለክታል። «የብስ» ቀጥተኛውን ትርጉም ይጠብቃል።
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: ሁለት መቶ ክንድ ያህል ብቻ እንጂ
  rationale: ὡς ግምታዊ ርቀትን ስለሚያመለክት «ያህል» ተብሏል፤ πῆχυς ደግሞ የጥንቱን መለኪያ ለመጠበቅ «ክንድ» ተብሎ ቀርቧል። ἀλλά ከοὐ ... μακράν ጋር «ሩቅ ሳይሆን ... ብቻ» የሚለውን ገዳቢ ንፅፅር ይፈጥራል።
- source_word: σύροντες
  choice: እየጎተቱ
  rationale: የአሁን ጊዜ አሳታፊው ከመምጣታቸው ጋር በአንድ ጊዜ የተከናወነውን ድርጊት ያሳያል፤ «እየጎተቱ» የσύρωን አካላዊ ጥረት ያስተላልፋል።
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: ዓሣዎቹን የያዘውን መረብ
  rationale: የτῶν ἰχθύων ዝምድና በዚህ አውድ ይዘትን—ዓሣዎችን የያዘ መረብን—ሊያመለክት ይችላል። «ሙሉ» የሚለው በግሪኩ በግልጽ ስለሌለ፣ ከልክ በላይ ሳያብራራ «የያዘውን» ተመርጧል።
