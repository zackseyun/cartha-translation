  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: am
  text: ስለ እነዚህ ነገሮች የሚመሰክረውና እነዚህን የጻፈው ደቀ መዝሙር ይህ ነው፤ ምስክርነቱም እውነት እንደሆነ እናውቃለን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὗτός
  choice: ይህ
  rationale: ከዚህ በፊት የተጠቀሰውን ደቀ መዝሙር የሚያመለክት አመልካች ተውላጠ ስም ሲሆን፣ «ይህ» የመለየት ኃይሉን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: μαθητὴς
  choice: ደቀ መዝሙር
  rationale: በዮሐንስ ወንጌል የኢየሱስን ተከታይ ለማመልከት የተለመደውና በአማርኛ የታወቀው ቃል ነው።
- source_word: μαρτυρῶν
  choice: የሚመሰክረው
  rationale: የአሁን ጊዜው አሳታፊ ግስ ቀጣይ ወይም የባሕርይ ተግባርን ያመለክታል፤ «የሚመሰክረው» ይህን ኃይል እና ከ«ምስክርነት» ጋር ያለውን የቃል ዝምድና ይጠብቃል።
- source_word: περὶ τούτων
  choice: ስለ እነዚህ ነገሮች
  rationale: የወንጌሉን ይዘት የሚያመለክተውን ሐረግ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ὁ γράψας ταῦτα
  choice: እነዚህን የጻፈው
  rationale: የተፈጸመውን የመጻፍ ድርጊት ያሳያል፤ በአማርኛ አንጻራዊ ሐረግ ማቅረቡ ለስላሳና ታማኝ ነው።
- source_word: οἴδαμεν
  choice: እናውቃለን
  rationale: በኮይኔ ግሪክ የአሁን ጊዜ ትርጉም ያለውን ፍጹም ቅርጽ በትክክል ያቀርባል፤ የ«እኛ» ተናጋሪዎችን ማንነት አይወስንም።
- source_word: ἀληθὴς
  choice: እውነት
  rationale: ምስክርነቱ ከእውነት ጋር መስማማቱን ቀጥተኛ በሆነ መንገድ ይገልጣል።
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: ምስክርነቱ
  rationale: የባለቤትነት አገባቡን በተፈጥሯዊ አማርኛ ያቀርባል፣ ከ«የሚመሰክረው» ጋርም ያለውን የሥርወ ቃል ግንኙነት ይጠብቃል።
- source_word: μαρτυρία
  choice: ምስክርነት
  rationale: ሕጋዊ የምስክርነት ገጽታንና የእውነት ማረጋገጫን አብሮ ሊይዝ የሚችል ተፈጥሯዊ የአማርኛ ቃል ነው።
theological_decisions:
- issue: «እናውቃለን» የሚለው የመጀመሪያ መደብ ብዙ ቁጥር ድምፅ ማንነት
  choice: «እናውቃለን» ተብሎ ቀጥተኛ ተተርጉሟል፤ ተናጋሪዎቹ አልተለዩም።
  alternative: ወንጌላዊው በአርታኢነት እየተናገረ ነው፤ ወይም የተወደደውን ደቀ መዝሙር ምስክርነት የሚያረጋግጥ ማኅበረሰብ እየተናገረ ነው።
  rationale: የግሪኩ ጽሑፍ የመጀመሪያ መደብ ብዙ ቁጥርን በግልጽ ይጠቀማል፣ ነገር ግን ማንን እንደሚያመለክት አይገልጽም። ትርጉሙ ይህን አሻሚነት ከመፍታት ይልቅ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «የሚመሰክረው/ምስክርነቱ» የሚለው ጥንድ በግሪኩ μαρτυρῶν/μαρτυρία መካከል ያለውን የቃል ዝምድና በተፈጥሯዊ ሁኔታ ስለሚጠብቅ፣ የእንግሊዝኛው የቃላት አማራጭ ማስታወሻ በአማርኛ አላስፈለገም።
