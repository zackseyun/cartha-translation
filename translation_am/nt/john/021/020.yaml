- source_word: ἐν τῷ δείπνῳ
  choice: በእራት ጊዜ
  rationale: የተወሰነውን የምግብ ጊዜ በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: ወደ ኢየሱስ ደረት
  rationale: የተውላጠ ስሙን አመልካች ለአማርኛ አንባቢ ግልጽ በማድረግ፣ አካላዊውን ቅርበት በቀጥታ ያቀርባል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በቀጥታ ንግግር ውስጥ የአክብሮትንና የዮሐንስን ሥነ መለኮታዊ ድምፅ የሚጠብቅ መደበኛ አተረጓጎም ነው።
- source_word: ὁ παραδιδούς σε
  choice: አሳልፎ የሚሰጥህ
  rationale: παραδίδωμι የሚለውን ምስላዊ አገላለጽ ጠብቆ፣ በዚህ የሕማማት አውድ ያለውን የክህደት ትርጉም ያስተላልፋል።
theological_decisions:
- issue: የβλέπει ታሪካዊ የአሁን ጊዜ አተረጓጎም
  choice: በቀላል ያለፈ ጊዜ “አየ”
  alternative: ታሪካዊውን የአሁን ጊዜ “ያያል” ብሎ ማቆየት
  rationale: የአማርኛ ትረካ በዚህ ስፍራ ያለፈ ጊዜን በተፈጥሮ ይጠቀማል፤ ሥነ መለኮታዊ ትርጉም አይቀየርም።
- issue: ከἀκολουθοῦντα ጋር ያልተገለጸውን ተሳቢ ማቅረብ
  choice: ተሳቢ ሳይጨመር “ተከትሎ ሲመጣ”
  alternative: “እነርሱን ተከትሎ” ወይም “እርሱን ተከትሎ”
  rationale: የግሪኩ አሻሚነት ማንን እንደተከተለ በግልጽ አይወስንም፤ አማርኛውም ተሳቢውን ሳይሞላ ተፈጥሯዊ ሊሆን ይችላል።
- issue: παραδιδούς የክህደት አገላለጽ
  choice: “አሳልፎ የሚሰጥህ”
  alternative: “የሚከዳህ”
  rationale: የቃሉን መሠረታዊ ምስል በመጠበቅ በሕማማት ታሪኩ ያለውን የክህደት ስሜት ያቀርባል፤ ከሁለቱ አንዱን ብቻ አያጠብቅም።
