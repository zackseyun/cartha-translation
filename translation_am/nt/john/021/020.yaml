base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: am
  text: ጴጥሮስም ዘወር ብሎ፣ ኢየሱስ ይወደው የነበረውን ደቀ መዝሙር ተከትሎ[a] አየ። እርሱም በእራቱ ጊዜ በኢየሱስ ደረት ላይ ተደግፎ፣ “ጌታ ሆይ፣ አሳልፎ የሚሰጥህ ማን ነው?” ያለው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን ተከትሎ” ወይም “እነርሱን ተከትሎ።” በግሪክኛው የግሱ ተሳቢ በግልጽ አልተጠቀሰም።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: ዘወር ብሎ
  rationale: የጴጥሮስን ቀዳሚ እንቅስቃሴ በተፈጥሯዊ የአማርኛ ተውሳከ ግስ አገባብ ያቀርባል።
- source_word: βλέπει
  choice: አየ
  rationale: በግሪክ ታሪካዊ የአሁን ጊዜ ቢሆንም፣ በአማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊ ነው።
- source_word: μαθητὴν
  choice: ደቀ መዝሙር
  rationale: በዮሐንስ ወንጌል የሚደጋገመውን የተማሪነትና የተከታይነት ትርጉም የሚጠብቅ መደበኛ ቃል ነው።
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ኢየሱስ ይወደው የነበረው
  rationale: ያልተፈጸመውን የግስ ገጽታ በተፈጥሯዊ አማርኛ ሲያቀርብ፣ የግሪኩን ግልጽ ርዕሰ ጉዳይም ይጠብቃል።
- source_word: ἀκολουθοῦντα
  choice: ተከትሎ ሲመጣ
  rationale: የመንቀሳቀስ ሁኔታውን በተፈጥሯዊ አማርኛ ያሳያል፤ ግሪኩ ተከታዩ ማንን እንደተከተለ በግልጽ ስላልጠቀሰ ተሳቢ አልተጨመረም።
- source_word: ἀνέπεσεν
  choice: ዘንበል ብሎ
