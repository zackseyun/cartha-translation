review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Peter’s turning, seeing, the beloved disciple, the implicit object of ‘following,’ and the question about the betrayer. However, ‘ወደ ኢየሱስ ደረት ዘንበል ብሎ’ means more nearly ‘leaning toward Jesus’ chest’ and does not accurately express the stated bodily contact of ἐπὶ τὸ στῆθος αὐτοῦ.
  naturalness: The first clause is understandable, but ‘ተከትሎ ሲመጣ’ adds ‘coming’ beyond the participle and is less direct than necessary. The second sentence’s repetition of ‘ደቀ መዝሙር’ is somewhat heavy. A relative continuation with ‘እርሱም’ is smoother modern standard Amharic.
  terminology: ‘ደቀ መዝሙር,’ ‘ጌታ ሆይ,’ and ‘አሳልፎ የሚሰጥህ’ are appropriate. ‘በኢየሱስ ደረት ላይ ተደግፎ’ more accurately and naturally represents reclining/leaning against his chest.
  issues:
  - severity: medium
    issue: The phrase for reclining locates the disciple merely toward Jesus’ chest.
    rationale: ἐπὶ τὸ στῆθος αὐτοῦ specifies contact ‘upon/against his chest.’ ‘ወደ ... ደረት’ means ‘toward ... chest,’ so it should be corrected to ‘በኢየሱስ ደረት ላይ ተደግፎ.’
  - severity: low
    issue: ‘ሲመጣ’ supplies an additional coming-motion nuance.
    rationale: ἀκολουθοῦντα means ‘following’ and leaves its object unstated; ‘ተከትሎ’ preserves this without adding a separate ‘coming’ action.
  - severity: low
    issue: The resumptive description repeats ‘ደቀ መዝሙር’ unnecessarily.
    rationale: Using ‘እርሱም’ maintains the relative reference and reads more naturally without changing the meaning.
  revised_text: ጴጥሮስም ዘወር ብሎ፣ ኢየሱስ ይወደው የነበረውን ደቀ መዝሙር ተከትሎ[a] አየ። እርሱም በእራቱ ጊዜ በኢየሱስ ደረት ላይ ተደግፎ፣ “ጌታ ሆይ፣ አሳልፎ የሚሰጥህ ማን ነው?” ያለው ነበር።
