review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Jesus as “ጌታ” and preserves the vivid reflexive action of Peter casting himself into the sea. However, the second οὖν is not clearly represented, and the explanatory γάρ clause is placed before the action of girding the outer garment, rather than following it as in the Greek narrative.
  naturalness: 'The Amharic is generally clear and modern. “ቀለል ያለ ልብስ ብቻ ለብሶ” is somewhat over-specified: “ብቻ” can suggest that Peter possessed no other garment, although the following clause says he girded an outer garment. Removing it yields a more natural expression while retaining the contextual sense of γυμνός.'
  terminology: “ያ ደቀ መዝሙር,” “ጌታ,” “የላይኛው ልብስ,” and “ራሱን ... ወረወረ” are suitable modern-standard renderings. The lexical alternative for γυμνός should remain footnoted, since the degree of exposure is contextually debated.
  issues:
  - severity: medium
    issue: The second οὖν is not adequately conveyed.
    rationale: “ስምዖን ጴጥሮስም” adds a simple conjunction, but the Greek οὖν marks narrative consequence/progression. “ስለዚህ ስምዖን ጴጥሮስ” naturally reflects it.
  - severity: low
    issue: The word “ብቻ” overstates the rendering of γυμνός.
    rationale: γυμνός may mean naked or insufficiently/lightly clothed; it does not itself mean that he had only one item of clothing. “ቀለል ያለ ልብስ ለብሶ” preserves the chosen contextual sense without this added implication.
  - severity: low
    issue: The parenthetical explanation is moved ahead of Peter’s girding of the garment.
    rationale: The Greek first reports that he girded the outer garment, then explains that he was γυμνός. Keeping that sequence better preserves the source’s narration and makes the parenthesis clearer.
  revised_text: ስለዚህ ኢየሱስ ይወደው የነበረው ያ ደቀ መዝሙር ጴጥሮስን፣ “ጌታ ነው” አለው። ስለዚህ ስምዖን ጴጥሮስ ጌታ እንደሆነ በሰማ ጊዜ፣ የላይኛውን ልብሱን ታጠቀ፤ ቀለል ያለ ልብስ ለብሶ ነበርና፤ ራሱንም ወደ ባሕሩ ወረወረ።
