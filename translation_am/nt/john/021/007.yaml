id: JHN.21.7
reference: John 21:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: am
  text: ስለዚህ ኢየሱስ ይወደው የነበረው ያ ደቀ መዝሙር ጴጥሮስን፣ “ጌታ ነው” አለው። ስለዚህ ስምዖን ጴጥሮስ ጌታ እንደሆነ በሰማ ጊዜ፣ የላይኛውን ልብሱን ታጠቀ፤ ቀለል ያለ ልብስ ለብሶ ነበርና፤ ራሱንም ወደ ባሕሩ ወረወረ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει οὖν
  choice: ስለዚህ ... አለው
  rationale: οὖν የትረካውን ቀጣይነትና ከቀደመው ነገር የሚነሳውን ውጤት ያመለክታል፤ “ስለዚህ” ይህን ግንኙነት በግልጽ ያስተላልፋል።
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ኢየሱስ ይወደው የነበረው ያ ደቀ መዝሙር
  rationale: ἐκεῖνος የሚያሳየው “ያ” ተጠብቋል፤ ἠγάπα ያለፈውን ቀጣይ ሁኔታ በተፈጥሯዊ አማርኛ ለማሳየት “ይወደው የነበረው” ተብሏል።
- source_word: Ὁ κύριός ἐστιν
  choice: ጌታ ነው
  rationale: κύριος እንደ “ጌታ” ተተርጉሞ በትንሣኤው ትረካ ያለውን የኢየሱስ ማንነት የመለየት ክብደት ይጠብቃል።
- source_word: τὸν ἐπενδύτην
  choice: የላይኛውን ልብሱን
  rationale: ἐπενδύτης በሌላ ልብስ ላይ የሚለበስን ልብስ ያመለክታል፤ “የላይኛው ልብስ” የልብሱን ዓይነት ከሚገባው በላይ ሳይወስን ግልጽ ነው።
- source_word: διεζώσατο
  choice: ታጥቆ
  rationale: ግሱ ልብስን በሰውነት ዙሪያ ማሰርን ወይም ማጥበቅን ያመለክታል፤ “ታጥቆ” አጭር፣ ተፈጥሯዊና የድርጊቱን ኃይል የሚጠብቅ ነው።
- source_word: ἦν γὰρ γυμνός
  choice: ቀለል ያለ ልብስ ብቻ ለብሶ ነበርና
  rationale: γυμνός ፈጽሞ ዕርቃን መሆንን ወይም በቂ ልብስ አለመልበስን ሊያመለክት ይችላል። የጀልባ ሥራውና የላይኛው ልብስ መኖሩ በዚህ አውድ “ቀለል ያለ ልብስ ብቻ ለብሶ” የሚለውን ይደግፋሉ፤ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: ራሱን ወደ ባሕሩ ወረወረ
  rationale: βάλλω ከተመላሽ ተሳቢው ጋር ያለውን ሕያውና ኃይለኛ አገላለጽ “ራሱን ... ወረወረ” ይጠብቃል፤ θάλασσα ደግሞ “ባሕር” ተብሏል።
theological_decisions:
- issue: ኢየሱስን በቀጥታ ሲለዩ κύριος የሚለውን መተርጎም
  choice: ጌታ
  alternative: መምህር / አለቃ
  rationale: “ጌታ” የቃሉን መደበኛ ትርጉምና በትንሣኤው አውድ ያለውን ክርስቶሳዊ ክብደት ሳይብራራ ይጠብቃል።
- issue: γυμνός የጴጥሮስን የአለባበስ ሁኔታ እንዴት እንደሚገልጥ
  choice: ቀለል ያለ ልብስ ብቻ ለብሶ
  alternative: ዕርቃኑን
  rationale: የግሪኩ ቃል ሁለቱንም ሊያመለክት ስለሚችል አውዱን የሚመጥነው ትርጉም በዋናው ጽሑፍ ተመርጧል፤ እውነተኛው የቃላት አሻሚነት ግን በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትረካዊ አያያዝ፣ ሕያው ድርጊትና የγυμνός አሻሚነት ተጠብቀዋል።
