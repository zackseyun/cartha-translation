    text: ወይም፣ “ዓሣ።” የግሪኩ προσφάγιον በተለይ ከእንጀራ ጋር የሚበላ ምግብን ያመለክታል፤ በዚህ የዓሣ ማጥመድ አውድ ግን ዓሣን ሊያመለክት ይችላል።
