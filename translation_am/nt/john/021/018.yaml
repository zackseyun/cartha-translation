  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: am
  text: “እውነት፣ እውነት እልሃለሁ፤ ወጣት ሳለህ ራስህን ትለብስ[a] ነበር፣ ወደ ፈለግህበትም ትሄድ ነበር። ስታረጅ ግን እጆችህን ትዘረጋለህ[b]፤ ሌላ ሰውም ያለብስሃል፣ ወደማትፈልገው ቦታም ይወስድሃል።[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ራስህን ትታጠቅ ነበር”፤ በኋላም “ሌላ ሰው ያስታጥቅሃል።” የግሪኩ ግስ ልብስን ማሰር ወይም መታጠቅን ያመለክታል፤ እዚህ ጴጥሮስ ቀድሞ በራሱ ይወስን እንደነበር፣ በኋላ ግን በሌላ ሰው ላይ ጥገኛ እንደሚሆን ያነጻጽራል።
    reason: lexical_alternative
  - marker: b
    text: “እጆችህን ትዘረጋለህ” የሚለው አባባል ጴጥሮስ በመስቀል ላይ እንደሚሞት የሚያመለክት እንደሆነ ብዙ ጊዜ ይታሰባል። ቀጣዩ ቁጥር ኢየሱስ ይህን ያለው ጴጥሮስ እግዚአብሔርን በምን ዓይነት ሞት እንደሚያከብር ለማመልከት እንደሆነ ያብራራል።
    reason: cross_reference
  - marker: c
    text: ወይም፣ “ይመራሃል” ወይም “ተሸክሞ ይወስድሃል።” የግሪኩ ቃል አንድን ሰው ተሸክሞ መውሰድን ወይም ወደ አንድ መድረሻ ማምጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: እውነት፣ እውነት
  rationale: የተደገመውን የማረጋገጫ አገላለጽና ክብደቱን በግልጽ፣ በተፈጥሯዊ አማርኛ ያቆያል።
