  rationale: ከሚከተለው እርጅና ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐζώννυες σεαυτόν
  choice: ራስህን ታለብስ ነበር
  rationale: ግሪኩ በቀጥታ ልብስን ማሰር ወይም መታጠቅን ቢያመለክትም፣ ይህ አገላለጽ ጴጥሮስ ቀድሞ ራሱን በራሱ ይመራ እንደነበር በዘመናዊ አማርኛ በግልጽ ያስተላልፋል፤ በኋላ ሌላ ሰው ከሚያለብሰው ጋርም ትይዩነቱን ይጠብቃል።
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: ወደፈለግህበትም ትሄድ ነበር
  rationale: እዚህ περιπατέω የተለመደ መንቀሳቀስን እንጂ ምሳሌያዊ የሕይወት አካሄድን አያመለክትም፤ ‘ትሄድ’ የመድረሻ ነጻነቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅταν δὲ γηράσῃς
  choice: ሲያረጅህ ግን
  rationale: ወደፊት የሚሆነውን ሁኔታ ያሳያል፤ ‘ግን’ ደግሞ የδέን መጠነኛ ንጽጽር ይጠብቃል።
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: እጆችህን ትዘረጋለህ
  rationale: ምስሉን ሳይተረጉም በቀጥታ ያቆያል፤ ቀጣዩ ቁጥር የሞቱን ዓይነት ስለሚያብራራ ዋናው ጽሑፍ ስቅለትን በግልጽ አያክልም።
- source_word: ἄλλος σε ζώσει
  choice: ሌላም ሰው ያለብስሃል
  rationale: ከቀደመው ‘ራስህን ታለብስ’ ጋር ያለውን የቃልና የሐሳብ ትይዩነት ጠብቆ፣ ከራስ ነጻነት ወደ ሌላ ሰው ቁጥጥር የሚደረገውን ለውጥ ያሳያል።
- source_word: οἴσει
  choice: ይወስድሃል
  rationale: φέρω መሸከም፣ መውሰድ ወይም አብሮ መውሰድን ሊያመለክት ይችላል፤ ‘ይወስድሃል’ በአማርኛ ተፈጥሯዊ ሆኖ ወደማይፈለግ መድረሻ የመወሰድን ሐሳብ ያቆያል።
- source_word: ὅπου οὐ θέλεις
  choice: ወደማትፈልግበት
  rationale: በግሪኩ የመሄድ ግስ በቀጥታ ባይደገምም፣ የአማርኛው አወቃቀር ከ‘ይወስድሃል’ ጋር ተያይዞ የማይፈለገውን መድረሻ በግልጽ ያሳያል።
