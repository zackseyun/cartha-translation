  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: am
  text: እንግዲህ ቁርስ ከበሉ በኋላ፣ ኢየሱስ ስምዖን ጴጥሮስን፣ “የዮሐንስ ልጅ ስምዖን፣ ከእነዚህ ይልቅ ትወደኛለህን?[b]” አለው። እርሱም፣ “አዎን፣ ጌታ ሆይ፤ እንደምወድህ[a] አንተ ታውቃለህ” አለው። ኢየሱስም፣ “ጠቦቶቼን መግብ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ግሪክኛው ሁለት የተለያዩ ግሶችን ይጠቀማል፤ ኢየሱስ ἀγαπάω (‘መውደድ’) በሚለው ግስ ሲጠይቅ፣ ጴጥሮስ φιλέω (‘መውደድ፣ ፍቅር ማሳየት’) በሚለው ግስ ይመልሳል። አንዳንዶች በመካከላቸው ልዩነት እንዳለ ያያሉ፤ ሌሎች ግን ለአጻጻፍ ልዩነት እንደተጠቀሱ ይቆጥራሉ። ዋናው ጽሑፍ ዐውዱ በግልጽ ያላሳየውን ልዩነት እንዳያጋንን ሁለቱንም ‘መውደድ’ ብሎ ተርጉሟል።
    reason: lexical_alternative
  - marker: b
    text: ‘ከእነዚህ ይልቅ’ ማለት ‘እነዚህ ከሚወዱኝ ይልቅ’ ወይም ‘እነዚህን ከምትወድ ይልቅ’ ሊሆን ይችላል። ግሪክኛው ንጽጽሩን በግልጽ አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: ቁርስ ከበሉ
  rationale: ἀριστάω የጠዋትን ምግብ መብላት ያመለክታል፤ ይህ አተረጓጎም ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Σίμων Ἰωάννου
  choice: የዮሐንስ ልጅ ስምዖን
  rationale: የἸωάννου ዘርፍ አባትነትን የሚገልጽ ስለሆነ ‘የዮሐንስ ልጅ’ ተብሎ ተተርጉሟል፤ ‘የዮና ልጅ’ የሚለውን ሌላ ባህላዊ ንባብ አያስገባም።
- source_word: ἀγαπᾷς / φιλῶ
  choice: ትወደኛለህ / እንደምወድህ
  rationale: ሁለቱም ግሶች በዚህ ዐውድ ‘መውደድ’ ተብለው በተፈጥሯዊ ሁኔታ ሊተረጎሙ ይችላሉ፤ የግሶቹ ልዩነት በማስታወሻ ተጠብቋል።
- source_word: πλέον τούτων
  choice: ከእነዚህ ይልቅ
  rationale: የንጽጽሩ ሁለተኛ ወገን በግሪክኛው አልተገለጸም፤ ይህ አገላለጽ አሻሚነቱን ይጠብቃል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: በዮሐንስ ዐውድ ጴጥሮስ ኢየሱስን በአክብሮት ይጠራዋል፤ ‘ጌታ ሆይ’ κύριεን በቀጥታና በተለመደ መንገድ ያስተላልፋል።
- source_word: Βόσκε τὰ ἀρνία μου
  choice: ጠቦቶቼን መግብ
  rationale: βόσκω በተለይ መመገብን፣ ἀρνία ደግሞ ጠቦቶችን ያመለክታል፤ የእረኝነት ምስሉና የኢየሱስ ባለቤትነት ተጠብቀዋል።
theological_decisions:
- issue: ἀγαπάωንና φιλέωን በዋናው ጽሑፍ በጥብቅ መለየት ወይም አለመለየት
  choice: ሁለቱንም ‘መውደድ’ በሚለው ግስ መተርጎምና የግሪክኛውን ልዩነት በማስታወሻ መግለጽ
