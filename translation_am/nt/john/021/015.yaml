  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የታሪክ የአሁን ጊዜ λέγει በተፈጥሯዊ የአማርኛ ትረካ ‘አለው’ ተብሎ ቀርቧል።
