  rationale: ዮሐንስ በዚህ ስፍራ ግሶቹን ሆን ብሎ በተለያየ ደረጃ መጠቀሙ አከራካሪ ነው። ዋናው ጽሑፍ ግልጽ ያልሆነን የፍቅር ደረጃ አያስገባም።
- issue: πλέον τούτων የሚያመለክተው ንጽጽር
  choice: ‘ከእነዚህ ይልቅ’ በማለት አሻሚነቱን መጠበቅ
  alternative: ‘እነዚህ ከሚወዱኝ ይልቅ’ ወይም ‘እነዚህን ከምትወድ ይልቅ’ ብሎ መወሰን
  rationale: ግሪክኛው ንጽጽሩ የሚደረግበትን ነገር በግልጽ አይጠቅስም፤ አንዱን ትርጓሜ መምረጥ የጽሑፉን ክፍትነት ያጠባል።
