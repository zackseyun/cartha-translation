  text: ስለዚህ፣ ያ ደቀ መዝሙር እንደማይሞት የሚል ይህ ወሬ[a] በወንድሞች[b] መካከል ተሰራጨ። ነገር ግን ኢየሱስ እርሱ እንደማይሞት አላለውም፤ ይልቁንም፣ “እኔ እስክመጣ ድረስ እንዲቆይ ብፈልግ፣ ይህ ምን ያገባሃል?” አለው።[c]
  philosophy: optimal-equivalence
  footnotes:
