  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: am
  text: ጴጥሮስም እርሱን ባየ ጊዜ ኢየሱስን፣ “ጌታ ሆይ፣ ይህ ሰውስ?” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: እርሱን ባየው ጊዜ
  rationale: The demonstrative refers back to the disciple in the preceding context; the Amharic pronoun is natural while retaining the anaphoric reference.
- source_word: λέγει
  choice: አለው
  rationale: The Greek historical present is naturally represented by the Amharic narrative past, without changing the event's meaning.
- source_word: οὗτος δὲ τί;
  choice: ይህስ እንዴት ይሆናል?
  rationale: The elliptical Greek asks what will happen to this person. The suffix -ስ preserves the contrastive force of δέ, while the fuller idiom is clear and natural in modern Amharic.
theological_decisions:
- issue: The ellipsis in Peter's question
  choice: ይህስ እንዴት ይሆናል?
  alternative: ይህስ ምን?
  rationale: The immediate context concerns what lies ahead for the disciples. The selected wording expresses the implied question without specifying a particular fate or ministry and thus avoids doctrinal overinterpretation.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; concise, dignified narrative style. The contrastive -ስ makes Peter's shift from himself to the other disciple clear.
source_grounding:
  english_pob_role: consult_only
