  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: am
  text: ኢየሱስም ይመጣል፤ እንጀራውንም ይወስዳል፤ ለእነርሱም ይሰጣቸዋል፤ ዓሣውንም እንዲሁ ይሰጣቸዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስም መጣ፤ እንጀራውን ወስዶ ሰጣቸው፤ ዓሣውንም እንዲሁ ሰጣቸው።” የግሪኩ ጽሑፍ ያለፈን ድርጊት በአሁን ጊዜ ግሶች ይተርካል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: መጥቶ ... ያነሣል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በዋናው ግስ ላይ በአሁን ጊዜ በማቆየት፣ በአማርኛ ተፈጥሯዊ ለሆነው የተከታታይ ድርጊት አወቃቀር ተተርጉሟል።
- source_word: λαμβάνει
  choice: ያነሣል
  rationale: እዚህ ኢየሱስ ምግቡን ለማደል መውሰዱን የሚገልጽ ቀላልና ተፈጥሯዊ አማርኛ ነው፤ ‘ይቀበላል’ የሚለው በዐውዱ አይስማማም።
- source_word: τὸν ἄρτον
  choice: እንጀራውን
  rationale: የተወሰነውን በቦታው የነበረ የእህል ምግብ ያመለክታል። ‘እንጀራ’ በመጽሐፍ ቅዱሳዊ አማርኛ ἄρτοςን ለመግለጽ የተለመደ ቃል ሲሆን፣ በግድ የኢትዮጵያን እንጀራ ብቻ አያመለክትም።
- source_word: δίδωσιν αὐτοῖς
  choice: ለእነርሱም ይሰጣቸዋል
  rationale: የግሪኩን ቀጥተኛ ‘ለእነርሱ ይሰጣል’ ትርጉም በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ያቀርብላቸዋል’ ከሚለው ያነሰ ትርጓሜያዊ ነው።
- source_word: τὸ ὀψάριον
  choice: ዓሣውን
  rationale: በዮሐንስ ዐውድ ቃሉ ለምግብ የቀረበውን ዓሣ ያመለክታል፤ ‘የተጠበሰው ዓሣ’ ማለት ቃሉ በራሱ የማይጠይቀውን ዝርዝር ይጨምራል።
- source_word: ὁμοίως
  choice: እንዲሁ ያደርጋል
  rationale: ከዓሣውም ጋር እንጀራውን ያነሣና የሰጠበትን ተመሳሳይ ድርጊት እንዳደረገ ያሳያል፤ በአማርኛ የተዘለለውን ግስ መሙላት ግልጽነትን ይሰጣል።
theological_decisions:
- issue: በትንሣኤ ትረካው ውስጥ ያሉ ታሪካዊ የአሁን ጊዜ ግሶች
  choice: በዋና ዋና ግሶች ‘ያነሣል ... ይሰጣቸዋል ... ያደርጋል’ በማለት የአሁን ጊዜውን ማቆየት
  alternative: ‘መጣ፣ አነሣ፣ ሰጣቸው’ ብሎ ሙሉ በሙሉ በአለፈ ጊዜ መተርጎም
  rationale: ይህ የእምነት ትምህርት ልዩነት ሳይሆን የትረካ ቅርጽ ጉዳይ ነው። የአሁን ጊዜውን ማቆየት የዮሐንስን ሕያው የትረካ ዘይቤ ያንጸባርቃል፤ ነገር ግን በአማርኛ የድርጊቶቹን ቅደም ተከተል ለማሳየት ‘መጥቶ’ የሚለው ተያያዥ ግስ ተጠቅሟል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘እንጀራ’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ያቆያል፤ ‘ዓሣውንም እንዲሁ ያደርጋል’ ደግሞ የግሪኩን አጭር ትይዩነት በተፈጥሯዊ አማርኛ ግልጽ ያደርገዋል።
