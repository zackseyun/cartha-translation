base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: am
  text: ኢየሱስ ያደረጋቸው ሌሎች ብዙ ነገሮችም አሉ። እነዚህ አንድ በአንድ ቢጻፉ፣ ዓለም ራሱ እንኳ እነዚያን የሚጻፉ መጻሕፍት ለመያዝ በቂ ቦታ አይኖረውም[a] ብዬ እገምታለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓለም ራሱ እንኳ የሚጻፉትን መጻሕፍት ሊይዝ አይችልም።” የግሪኩ ግስ “በቂ ቦታ መኖር” ወይም “መያዝ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: ሌሎች ብዙ ነገሮችም አሉ
  rationale: ደግሞም የሚለውን የመደመር ኃይል በአማርኛው -ም ያሳያል፤ ἄλλα πολλὰ ደግሞ በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ‘ሌሎች ብዙ ነገሮች’ ተብሏል።
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: ኢየሱስ ያደረጋቸው
  rationale: ποιέω በዚህ አውድ ድርጊቶችን በሰፊው ያመለክታል፤ ‘ያደረጋቸው’ ተፈጥሯዊና ሰፊ ትርጉሙን የሚጠብቅ ነው።
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: አንድ በአንድ ቢጻፉ
  rationale: የግምታዊውን ሁኔታ በ‘ቢጻፉ’፣ የκαθ’ ἕνን አከፋፋይ ኃይል ደግሞ በ‘አንድ በአንድ’ ይጠብቃል።
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: ዓለም ራሱ እንኳ
  rationale: αὐτόν የሚሰጠውን አጽንዖት ‘ራሱ’፣ οὐδέ የሚሰጠውን ‘እንኳ’ በተፈጥሯዊ አማርኛ ያሳያሉ።
- source_word: οἶμαι
  choice: ብዬ አስባለሁ
  rationale: የጸሐፊውን የግልና የማሰላሰል አገላለጽ በግልጽ አማርኛ ይጠብቃል።
- source_word: χωρήσειν τὰ γραφόμενα βιβλία
  choice: ለሚጻፉት መጻሕፍት ... ቦታ አይኖረውም
  rationale: χωρέω ያለውን ‘ቦታ መኖር’ የሚል ምስላዊ ኃይል ይጠብቃል፤ τὰ γραφόμενα βιβλία ደግሞ በግምታዊው ሁኔታ የሚጻፉትን መጻሕፍት ያመለክታል።
theological_decisions:
