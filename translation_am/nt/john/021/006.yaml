base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: am
  text: እርሱም፣ “መረቡን በጀልባው ቀኝ በኩል ጣሉ፤ ታገኛላችሁም[a]” አላቸው። ስለዚህ ጣሉት፤ ከዓሣዎቹም ብዛት የተነሣ ከዚያ በኋላ መረቡን መሳብ አልቻሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓሣ ታገኛላችሁ።” በግሪኩ “ዓሣ” የሚለው ቃል አልተጠቀሰም፤ ከዓሣ ማጥመዱ አውድ ይገባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: ጣሉ
  rationale: በዓሣ ማጥመድ አውድ መረብን ወደ ውኃ መጣልን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: ከጀልባይቱ በቀኝ በኩል
  rationale: የግሪኩን አቅጣጫዊ ትርጉም ያለ መርከበኞች ልዩ ቃል በግልጽ አማርኛ ያስተላልፋል።
- source_word: πλοίου
  choice: ጀልባይቱ
  rationale: በገሊላ የዓሣ ማጥመጃ አውድ ትንሽ መርከብን ለመግለጽ “ጀልባ” ተፈጥሯዊ ነው።
- source_word: τὸ δίκτυον
  choice: መረቡን
  rationale: ነጠላውን የዓሣ ማጥመጃ መረብ በቀጥታ ይገልጣል።
- source_word: εὑρήσετε
  choice: ታገኛላችሁ
  rationale: በግሪኩ የግሱ ተሳቢ አልተገለጸም፤ አማርኛውም ይህን ተጨባጭ አሻሚነት በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: οὐκέτι
  choice: ከእንግዲህ ... አልቻሉም
  rationale: ከብዙ ዓሣ መያዙ በኋላ የተለወጠውን የአቅም ሁኔታ የግሪኩን ጊዜያዊ አሉታ በመጠበቅ ይገልጣል።
- source_word: ἑλκύσαι
  choice: መረቡን መሳብ
  rationale: በአውዱ የተሞላውን መረብ ወደ እነርሱ ለመሳብ የሚደረገውን አካላዊ ተግባር ያሳያል።
- source_word: ἴσχυον
  choice: አልቻሉም
  rationale: እዚህ ἰσχύω ጥንካሬን በረቂቅ ከመግለጽ ይልቅ ተግባሩን ለማድረግ አቅም አለመኖሩን ያመለክታል።
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: ከዓሣዎቹም ብዛት የተነሣ
  rationale: ἀπό በዚህ አውድ ምክንያትን ያሳያል፤ πλῆθος ደግሞ የዓሣዎቹን እጅግ ብዙ መሆን ይገልጣል።
