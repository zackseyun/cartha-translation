  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: am
  text: እንግዲህ ወደ መሬት ሲወጡ[a]፣ በዚያ የተቀመጠ የከሰል እሳት[b]፣ በላዩም የተቀመጠ ዓሣና ዳቦ አዩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ዳርቻ ሲደርሱ።” ግሪኩ ቃል በቃል፣ “ወደ መሬት ሲወጡ” ይላል።
    reason: lexical_alternative
  - marker: b
    text: “የከሰል እሳት” የሚለው ቃል በዮሐንስ 18፥18ም ተጠቅሷል፤ ይህም ይህን ትዕይንት ጴጥሮስ ከካደበት ቦታ ጋር በቃል ያገናኘዋል።
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: እንግዲህ ... በወጡ ጊዜ
  rationale: የὩςን ጊዜያዊ ኃይልና የοὖνን የትረካ ቅጥያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: ወደ ምድር በወጡ ጊዜ
  rationale: ከጀልባው ወጥተው ወደ ደረቅ ምድር መድረሳቸውን ይገልጣል፤ ምንጩ በግልጽ 'ዳርቻ' ስለማይል ይህ ቅርብ ነው።
- source_word: βλέπουσιν
  choice: አዩ
  rationale: በግሪክ ያለው ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ወደ አለፈ ጊዜ ተተርጉሟል።
- source_word: ἀνθρακιὰν
  choice: የከሰል እሳት
  rationale: የከሰል እሳትን ወይም ፍምን ያመለክታል፤ ይህ አገላለጽ ግልጽ ሲሆን ከዮሐንስ 18፥18 ጋር ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: κειμένην
  choice: የተዘጋጀ
  rationale: እሳቱ በዚያ ተደርጎ መኖሩን በተፈጥሯዊ አማርኛ ይገልጣል፤ 'የተኛ' የሚል ቀጥተኛ ትርጉም ለእሳት የማይመች ነው።
- source_word: ὀψάριον
  choice: ዓሣ
  rationale: በዮሐንስ አጠቃቀም ለምግብ የተዘጋጀን ዓሣ በተፈጥሮ ያመለክታል፤ ግን ቃሉ ራሱ 'የተጠበሰ' አይልም።
- source_word: ἐπικείμενον
  choice: በላዩም የተቀመጠ
  rationale: ዓሣው በከሰሉ እሳት ላይ እንዳለ ያሳያል፤ የተውላጠ ስሙ ማጣቀሻ በአማርኛ ግልጽ ነው።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም አጠቃላይ የዳቦ ምግብን ለመግለጽ የተለመደ ቃል ነው፤ ብዛትን ወይም ቅርጽን አይወስንም።
theological_decisions:
- issue: በትረካ ውስጥ የተጠቀሰ የአሁን ጊዜ
  choice: βλέπουσινን በአለፈ ጊዜ 'አዩ' ብሎ መተርጎም
  alternative: የግሪኩን ሕያው የአሁን ጊዜ ጠብቆ 'ያያሉ' ማለት
  rationale: ይህ ከሥነ መለኮት ይልቅ የትረካ ዘይቤ ጉዳይ ነው፤ በዘመናዊ አማርኛ ተፈጥሯዊው የትረካ ቅርጽ አለፈ ጊዜን ይጠቀማል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ዓረፍተ ነገር አቀራረብ በአማርኛ ተፈጥሯዊ ቅደም ተከተል ተደርጓል፤ የከሰል እሳት የሚለው ልዩ ቃል ግን የጽሑፉን ውስጣዊ ግንኙነት ለመጠበቅ ተቀምጧል።
