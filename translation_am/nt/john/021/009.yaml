review_pass:
  verdict: revise
  source_fidelity: The draft conveys the narrative sequence and the main referents accurately. However, «የተዘጋጀ» for κειμένην can suggest that the fire was prepared rather than simply being set/lying there, and «እንጀራ» in modern standard Amharic normally denotes the specific Ethiopian flatbread rather than the unmarked bread (ἄρτον).
  naturalness: «ወደ መሬት ሲወጡ» is a more idiomatic modern-Amharic rendering of coming out onto land than «ወደ ምድር በወጡ ጊዜ». «ዳቦ» naturally communicates ordinary bread without importing a specific local food.
  terminology: Retain «የከሰል እሳት» for ἀνθρακιά, preserving the lexical link with John 18:18. Render ἄρτον as «ዳቦ». The cross-reference footnote anchor should be attached to «የከሰል እሳት», the expression it explains, rather than to the sentence end.
  issues:
  - severity: medium
    issue: «እንጀራ» renders ἄρτον too specifically in modern standard Amharic.
    rationale: In current ordinary usage, «እንጀራ» refers to the distinctive Ethiopian flatbread. The Greek is the general term for bread/loaf and does not specify that food.
  - severity: low
    issue: «የተዘጋጀ» overstates κειμένην.
    rationale: The participle denotes the charcoal fire as lying or being set there; it does not explicitly state that it had been prepared.
  - severity: low
    issue: Footnote b is anchored at the sentence end rather than at «የከሰል እሳት».
    rationale: The footnote specifically explains the term for charcoal fire and its Johannine verbal connection; its anchor should directly follow that term.
