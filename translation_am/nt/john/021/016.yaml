    text: ቃል በቃል፣ “እንደገና፣ ሁለተኛ [ጊዜ]”። ግሪኩ ድግግሞሹን በሁለቱም ቃላት ያጎላል።
    reason: source_emphasis
  - marker: b
    text: በዚህ ልውውጥ ውስጥ ግሪኩ ‘መውደድ’ የሚል ትርጉም ያላቸውን ሁለት የተለያዩ ግሶች ይጠቀማል፤ ኢየሱስ ἀγαπάω የሚለውን ግስ፣ ጴጥሮስ ደግሞ φιλέω የሚለውን ግስ ይጠቀማል። አንዳንዶች በመካከላቸው ልዩነት እንዳለ ያያሉ፤ ሌሎች ግን የአጻጻፍ ልዩነት እንደሆነ ይቆጥሩታል። ዋናው ጽሑፍ ልዩነቱን ከልክ በላይ እንዳያጎላ ሁለቱንም ‘መውደድ’ ብሎ ተርጉሟል።
    reason: lexical_alternative
