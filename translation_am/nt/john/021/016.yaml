  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: am
  text: እንደገና ለሁለተኛ ጊዜ[a]፣ “የዮሐንስ ልጅ ስምዖን ሆይ፣ ትወደኛለህ?” አለው። እርሱም፣ “አዎን፣ ጌታ ሆይ፤ እንደምወድህ አንተ ታውቃለህ” አለው።[b] እርሱም፣ “በጎቼን ጠብቅ” አለው።
  philosophy: optimal-equivalence
  footnotes:
