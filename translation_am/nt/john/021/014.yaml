lexical_decisions:
- source_word: τοῦτο
  choice: ይህም
  rationale: ተውላጠ አመልካቹ ከዚህ በፊት የተተረከውን መገለጥ ያመለክታል፤ «ይህም» የትረካውን ትስስር በተፈጥሮ ይጠብቃል።
- source_word: ἤδη τρίτον
  choice: ሦስተኛው ጊዜ
  rationale: τρίτον በአድቨርብ አገልግሎት የክስተቱን ተራ ይገልጣል፤ ἤδη ቁጥሩ በዚህ የትረካ ነጥብ ሦስት መድረሱን ያሳያል። በአማርኛ «ሦስተኛው ጊዜ ነበር» ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἐφανερώθη
  choice: የተገለጠበት
  rationale: የግሱን ተደራጊ ቅርጽና የዮሐንስን የመገለጥ ቃላት አጠቃቀም ይጠብቃል፤ በዐውዱ «ታየ» የሚለውም የሚቻል አማራጭ ነው።
- source_word: τοῖς μαθηταῖς
  choice: ለደቀ መዛሙርቱ
  rationale: የዳቲቭን አቅጣጫ «ለ» ያስተላልፋል። የግሪኩ የተወሰነ መስተዋድድ በአማርኛ በተፈጥሮ በባለቤትነት ቅጥያው «-ቱ» ተገልጧል።
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: ከሙታን ከተነሣ በኋላ
  rationale: የትንሣኤው ክስተት ከዋናው ግስ በፊት መፈጸሙን «በኋላ» ያብራራል። «ተነሣ» በዘመናዊ አማርኛ የግሪኩን ተደራጊ የትንሣኤ አነጋገር በተፈጥሮ የሚያስተላልፍ ሲሆን፣ «ከሙታን» ἐκ νεκρῶνን በቀጥታ ይወክላል።
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶν የሚለውን የትንሣኤ አነጋገር መተርጎም
  choice: ከሙታን ከተነሣ በኋላ
  alternative: ከሙታን ከተነሣ በኋላ (በይበልጥ ግልጽ ተደራጊ አገላለጽ፦ «ከሙታን ከተነሣሣ በኋላ»)
  rationale: የግሪኩ አካል ተደራጊ ቢሆንም፣ «ተነሣ» በአማርኛ የትንሣኤን እውነታ በተፈጥሮ ያስተላልፋል እንጂ የአድራጊውን ጉዳይ አይወስንም። «ተነሣሣ» የተደራጊነቱን ገጽታ ይበልጥ ሊያጎላ ቢችልም በዚህ ሐረግ ከባድና ያልተፈጥሮ ሊሰማ ይችላል።
- issue: ἐφανερώθη መገለጥ ወይስ መታየት
  choice: የተገለጠበት
  alternative: የታየበት
  rationale: «ተገለጠ» የግሪኩን ተደራጊ ቅርጽና የዮሐንስን የመገለጥ ጭብጥ ይጠብቃል፤ «ታየ» ግን ዐውዳዊና ተፈጥሯዊ አማራጭ ስለሆነ በማስታወሻ ቀርቧል።
