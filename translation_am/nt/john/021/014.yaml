  terminology: ኢየሱስ, ደቀ መዛሙርት, ሙታን, and ተገለጠ are appropriate established biblical terms. የተገለጠበት preserves the manifestation sense of ἐφανερώθη; የታየበት remains a legitimate lexical alternative. ከሙታን ከተነሣ በኋላ is idiomatic Amharic resurrection language, although its form does not foreground the Greek passive as explicitly as English ‘had been raised.’
  issues:
