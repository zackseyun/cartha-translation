  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: am
  text: ለሦስተኛ ጊዜም፣ “የዮሐንስ ልጅ ስምዖን ሆይ፣ ትወደኛለህን?”[a] አለው። ጴጥሮስም ለሦስተኛ ጊዜ፣ “ትወደኛለህን?” ስላለው አዘነ። እንዲህም አለው፤ “ጌታ ሆይ፣ አንተ ሁሉን ታውቃለህ፤ አንተ እንደምወድህ ታውቃለህ።”[b] ኢየሱስም፣ “በጎቼን መግብ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ የግሪኩ ጽሑፍ φιλέω (‘መውደድ፣ ፍቅር ማሳየት’) የሚለውን ግስ ይጠቀማል፤ ኢየሱስ በቀደሙት ሁለት ጥያቄዎች ግን ἀγαπάω የሚለውንም ተጠቅሟል። አንዳንዶች ለዚህ ለውጥ ልዩ ትርጉም ይሰጣሉ፤ ሌሎች ደግሞ በዚህ ዐውድ የሁለቱ ግሶች ትርጉም እንደሚደራረብ ያስባሉ። ትርጉሙ ‘መውደድ’ ብሎ በማቅረብ ግሪኩ በግልጽ ከሚያሳየው በላይ ልዩነት አያስገድድም።
    reason: lexical_alternative
  - marker: b
    text: ጴጥሮስ በሰጠው መልስ ግሪኩ ‘ማወቅ’ የሚል ትርጉም ያላቸውን ሁለት ግሶች፣ οἶδα እና γινώσκω፣ ይጠቀማል። በአማርኛ ሁለቱንም ‘ማወቅ’ ብሎ መተርጎም ተፈጥሯዊ ነው፤ የቃላቱ ለውጥ ረቂቅ ልዩነት ሊጠቁም ቢችልም ያለ ትርጓሜ ጭነት በተለያዩ የአማርኛ ግሶች መግለጽ አይቻልም።
    reason: lexical_alternative
