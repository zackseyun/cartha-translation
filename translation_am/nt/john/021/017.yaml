review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the patronymic, the third questioning, Peter’s grief, the two occurrences of “know,” and the specific command to feed (not merely tend) Jesus’ sheep. However, the explicitly repeated Greek subject pronoun σὺ (“you”) in Peter’s reply is not represented. Adding አንተ to both clauses preserves the source’s marked emphasis without adding interpretation.
  naturalness: The Amharic is clear, dignified, and natural for modern standard usage. The revised reply remains idiomatic while making the Greek emphasis audible. Removing the conjunctive/emphatic -ም from እንደምወድህም avoids suggesting an additional emphasis not required by the Greek.
  terminology: Names, ጌታ ሆይ for Κύριε, መውደድ for φιλέω, and መግብ / በጎቼን for Βόσκε / πρόβατά μου are appropriate. The notes responsibly preserve the debated φιλέω/ἀγαπάω variation and the οἶδα/γινώσκω variation without imposing a theological distinction.
  issues:
  - severity: low
    issue: The repeated emphatic pronoun σὺ in Peter’s reply is unexpressed.
    rationale: Greek has σὺ in both “you know all things” and “you know that I love you.” Amharic verbal morphology conveys the subject, but the explicit አንተ naturally retains the repeated emphasis.
