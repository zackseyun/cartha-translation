  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: am
  text: እውነት፣ እውነት[a] እልሃለሁ፤ የምናውቀውን እንናገራለን፣ ያየነውንም እንመሰክራለን፤ ምስክርነታችንንም[b] አትቀበሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አሜን፣ አሜን እልሃለሁ።»
    reason: lexical_alternative
  - marker: b
    text: በግሪክ ጽሑፍ «እኛ» እና «የእኛ» የሚለው የብዙ ቁጥር አገላለጽ ተደጋግሟል፤ ኢየሱስ በዚህ ውስጥ በትክክል ማንን እንዳካተተ አከራካሪ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: እውነት፣ እውነት
  rationale: የተደገመውን አጽንዖት በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የድምፅ ብድር የሆነው «አሜን» በግርጌ ማስታወሻ ተጠብቋል።
- source_word: λέγω σοι
  choice: እልሃለሁ
  rationale: ለኒቆዲሞስ የቀረበውን ነጠላ ቀጥተኛ ንግግር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: የምናውቀውን እንናገራለን
  rationale: የአንጻራዊውን ሐረግ እና የመጀመሪያ ሰው ብዙ ቁጥርን በቀጥታ ይጠብቃል።
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: ያየነውንም እንመሰክራለን
  rationale: የማየቱን ቀደምት ክስተትና አሁንም ያለውን ጠቀሜታ በአማርኛ ፍጹም ግስ ያቀርባል፤ «እንመሰክራለን» የምስክርነትን ሐሳብ ግልጽ ያደርጋል።
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: ምስክርነታችንን
  rationale: ከ«እንመሰክራለን» ጋር ያለውን የቃል ግንኙነት ጠብቆ የመጀመሪያ ሰው ብዙ ቁጥርን አይቀንስም።
- source_word: οὐ λαμβάνετε
  choice: አትቀበሉም
  rationale: የ«መቀበል»ን ዮሐንሳዊ ቃላዊ ግንኙነት ይጠብቃል፤ የግሪኩን ሁለተኛ ሰው ብዙ ቁጥርም ያሳያል።
- source_word: καὶ ... καὶ
  choice: …ም …ም
  rationale: ግሪኩን ተያያዥ አገናኝ በተፈጥሯዊ የአማርኛ «-ም» ቅጥያ ያቀርባል፤ በጽሑፉ ያልተገለጸ ተቃርኖ አይጨምርም።
theological_decisions:
- issue: «እኛ/የእኛ» የሚሉት የመጀመሪያ ሰው ብዙ ቁጥር ተውላጠ ስሞች ማንን እንደሚያካትቱ
  choice: ብዙ ቁጥሩ «የምናውቀውን፣ እንናገራለን፣ ያየነውን፣ እንመሰክራለን፣ ምስክርነታችንን» ተብሎ ተጠብቋል።
  alternative: ኢየሱስንና ደቀ መዛሙርቱን፣ ወይም የንግግር ብዙ ቁጥርን፣ ወይም ሰፋ ያለ ሰማያዊ/መለኮታዊ ምስክርነትን እንደሚያመለክት በትርጉሙ መወሰን።
  rationale: የግሪኩ ሰዋሰው ብዙ ቁጥርን በግልጽ ያሳያል፣ የተጠቀሰው ቡድን ግን አልተወሰነም። ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱን አይፈታም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከነጠላው «እልሃለሁ» ወደ ብዙ ቁጥሩ «አትቀበሉም» የሚደረገው ለውጥ የግሪኩን σοὶ/λαμβάνετε ልዩነት ይጠብቃል።
