  text: ኒቆዲሞስ እንዲህ አለው፤ “አንድ ሰው[a] አርጅቶ እንዴት ሊወለድ ይችላል? ለሁለተኛ ጊዜ ወደ እናቱ ማሕፀን ገብቶ ሊወለድ አይችልም፣ አይደል?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በሰዋስው ወንዳዊ ነጠላ ቅርጽ ቢኖረውም፣ እዚህ ማንኛውንም ሰው በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
