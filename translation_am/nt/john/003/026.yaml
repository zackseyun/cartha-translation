  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: am
  text: እነርሱም ወደ ዮሐንስ መጥተው እንዲህ አሉት፦ “ረቢ፣ በዮርዳኖስ ማዶ ከአንተ ጋር የነበረውና አንተ ስለ እርሱ የመሰከርከው[a]፣ እነሆ፣ ይህ ሰው እያጠመቀ ነው፤ ሁሉም ወደ እርሱ እየሄዱ ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምስክርነት የሰጠህለት።” የግሪኩ ዳቲቭ አገባብ ምስክርነቱ ስለ እርሱ እንደተሰጠ ወይም ለእርሱ እንደተሰጠ ሊገለጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: ወደ ዮሐንስ መጥተው
  rationale: ወደ ዮሐንስ መቅረባቸውን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: የአይሁድን ታሪካዊና ባህላዊ አውድ ለመጠበቅ ማዕረጉ በድምፅ ተጽፏል።
- source_word: πέραν τοῦ Ἰορδάνου
  choice: በዮርዳኖስ ማዶ
  rationale: የግሪኩን ጂኦግራፊያዊ አገላለጽ በተለመደና ግልጽ አማርኛ ያቀርባል።
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: አንተ ስለ እርሱ የመሰከርከው
  rationale: μαρτυρέω የዮሐንስን የምስክርነት ጭብጥ እንዲጠብቅ ‘መሰከር’ ተመርጧል፤ የግሪኩ ዳቲቭ ግንባታ ሌላ አተረጓጎም ሊፈቅድ ስለሚችል ማስታወሻ ተጨምሯል።
- source_word: ἴδε
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የቃሉን ኃይል በክቡርና በሚታወቅ አማርኛ ይጠብቃል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: ከቀላሉ ‘እርሱ’ ይልቅ የግሪኩን ጠቋሚና አጽንዖታዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βαπτίζει
  choice: እያጠመቀ ነው
  rationale: በዚያን ጊዜ ቀጥሎ የነበረውን ድርጊት የግሪኩን የአሁን ጊዜ ቅርጽ በመጠበቅ ያሳያል።
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: ሁሉም ወደ እርሱ እየሄዱ ነው
  rationale: የተናጋሪዎቹን አጉልቶ የቀረበ ቅሬታ ይጠብቃል፤ ‘ሁሉም’ በአውዱ ውስጥ ንግግራዊ አጠቃላይነት ነው።
theological_decisions:
