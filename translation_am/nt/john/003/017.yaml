  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: am
  text: እግዚአብሔር ልጁን ወደ ዓለም የላከው፣ ዓለምን እንዲፈርድ[a] ሳይሆን፣ ዓለም በእርሱ እንዲድን ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓለምን እንዲኮንን።” የግሪኩ ግስ በዚህ አውድ ይህን ጠባብ ትርጉም ሊይዝ ይችላል፤ መሠረታዊ ትርጉሙ ግን “መፍረድ” ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: አይደለምና
  rationale: የγάρን ከቀደመው ንግግር ጋር የሚያያዝ ማብራሪያዊ ኃይል በአማርኛው ‘-ና’ ቅጥያ በተፈጥሯዊ ሁኔታ ይገልጻል፤ οὐ ደግሞ በአሉታዊው አገባብ ተጠብቋል።
- source_word: ἀπέστειλεν
  choice: የላከው
  rationale: ‘ላከ’ የግሱን መደበኛ ትርጉምና በዮሐንስ ውስጥ ያለውን የመላክ ጭብጥ ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በዘመናዊ መደበኛ አማርኛ የመጽሐፍ ቅዱስ ንባብ θεόςን በግልጽና በክብር የሚወክለው የተለመደ ስያሜ ነው።
- source_word: τὸν υἱὸν
  choice: ልጁን
  rationale: ግሪኩ በቀጥታ ‘ልጁን’ የሚል ባለቤትነት ባይኖረውም፣ የአማርኛ ተፈጥሯዊ አገባብ የአባትነት ግንኙነቱን ከእግዚአብሔር ጋር ግልጽ ያደርጋል፤ የ‘ወልድ’ ቴክኒካዊ ወይም የእምነት ቡድን ልዩ አገላለጽን አያስገባም።
- source_word: εἰς τὸν κόσμον
  choice: ወደ ዓለም
  rationale: εἰς የሚያመለክተውን ወደ አንድ ስፍራ ወይም የሕይወት ክልል መግባት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: በዓለም ላይ እንዲፈርድ
  rationale: ‘መፍረድ’ κρίνω ያለውን ሰፊ የፍርድ ትርጉም ይጠብቃል፤ ‘ለመኮነን’ ብሎ አያጠበውም። ‘በዓለም ላይ’ የሚለው በአማርኛ ከ‘መፍረድ’ ጋር ተፈጥሯዊ የሆነውን አገባብ ይከተላል።
- source_word: ἀλλ’ ἵνα
  choice: እንጂ … እንዲ-
  rationale: ተቃራኒ የዓላማ ሐረጎቹን በተፈጥሯዊ የአማርኛ ‘እንጂ … አይደለም’ አወቃቀር በግልጽ ያገናኛል።
- source_word: σωθῇ
  choice: እንዲድን
  rationale: የσῴζωን ተገብሮ እና የዓላማ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘መዳን’ የማዳንንና የመታደግን ሰፊ መንፈሳዊ ይዘት ይጠብቃል።
- source_word: ὁ κόσμος
  choice: ዓለም
  rationale: κόσμος በሁለቱም ቦታ በተመሳሳይ ቃል ተተርጉሞ የግሪኩን ድግግሞሽና ሰፊ የትርጉም ክልል ይጠብቃል።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ አማካይነት
  rationale: διά ከባለቤት አገባብ ጋር ያለውን የመንገድ ወይም የወኪልነት ሐሳብ ግልጽ በሆነ ዘመናዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በσωθῇ ተቃርኖ ያለው የκρίνῃ ትርጉም
  choice: እንዲፈርድ
  alternative: እንዲኮንን
  rationale: κρίνω በመሠረታዊ ትርጉሙ ‘መፍረድ’ የሚል ሰፊ ቃል ነው። አውዱ የኩነኔን ሐሳብ ሊያካትት ቢችልም፣ በዋናው ጽሑፍ ‘መኮነን’ ማለት የቃሉን ክልል ያጠባል። ስለዚህ የፍርድና የማዳን መለኮታዊ ውጥረት ሳይፈታ ‘መፍረድ’ ተመርጧል፣ ጠባቡ አማራጭም በማስታወሻ ቀርቧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛን ይጠቀማል። የዓላማ ንጽጽሩን በተፈጥሯዊው ‘… እንጂ … አይደለምና’ አወቃቀር ለማቅረብ የግሪኩ ሐረግ ቅደም ተከተል በመጠኑ ተስተካክሏል፤ የቃላት ድግግሞሽና የነገረ መለኮት አሻሚነት ግን ተጠብቋል።
