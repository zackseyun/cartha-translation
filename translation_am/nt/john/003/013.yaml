  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: am
  text: ወደ ሰማይ ያረገ ማንም የለም፤ ከሰማይ የወረደው፣ የሰው ልጅ[a][b] ብቻ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሰማይ የመጣው።”
    reason: lexical_alternative
  - marker: b
    text: “የሰው ልጅ” ኢየሱስ ራሱን በተለምዶ የሚጠራበት መጠሪያ ሲሆን፣ ዳንኤል 7፥13-14ን ያስተጋባል።
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: ማንም የለም
  rationale: አጠቃላይ አሉታዊ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀναβέβηκεν
  choice: ያረገ
  rationale: የተፈጸመውን ወደ ሰማይ መውጣት በክብር ያለው መጽሐፍ ቅዱሳዊ አገላለጽ ይገልጣል፤ የግሪኩን ፍጹም ጊዜ ውጤታዊ አንድምታም በዐውዱ ይጠብቃል።
- source_word: εἰς τὸν οὐρανόν
  choice: ወደ ሰማይ
  rationale: የእንቅስቃሴውን አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰ μὴ
  choice: ብቻ
  rationale: ከቀደመው አሉታዊ አረፍተ ነገር ጋር ሆኖ ብቸኛውን ልዩ ሁኔታ በግልጽ አማርኛ ያሳያል።
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: ከሰማይ የወረደው
  rationale: የግሪኩን በስም ተግባር የዋለ አንቀጽ ይጠብቃል፤ ከ‘ያረገ’ ጋር ያለውን የመውጣትና የመውረድ ተቃርኖም በግልጽ ያቀርባል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በአማርኛ የወንጌል አጠቃቀም የታወቀውን የኢየሱስ ራስ-መጠሪያ ይጠብቃል፤ ከዳንኤል 7 ጋር ያለውን ድምፀት በትርጓሜ አይፈታውም።
theological_decisions:
- issue: ‘የሰው ልጅ’ የሚለው የክርስቶስ መጠሪያ
  choice: በታወቀው መጠሪያ ‘የሰው ልጅ’ ተተርጉሟል።
  alternative: ‘ሰብአዊው’ ወይም ተራ ሰውን የሚያመለክት ሐረግ
  rationale: ሐረጉ በዮሐንስ ዐውድ የተለመደ ሰብአዊ አገላለጽንና የዳንኤል 7 ራእያዊ ድምፀትን አብሮ ይይዛል፤ ትርጉሙ ይህን ውጥረት አልፈታም።
- issue: የመውጣትና የመውረድ ጊዜያዊና ክርስቶሳዊ አንድምታ
  choice: ‘ያረገ’ እና ‘የወረደው’ ተብሎ የሰማያዊ መነሻና ልዩ መዳረሻ አባባሉ ተጠብቋል።
  alternative: አባባሉን በዶክትሪናዊ ማብራሪያ ማስፋት
  rationale: ግሪኩ የሚናገረውን ጠንካራ ክርስቶሳዊ ይዘት ይጠብቃል፤ ነገር ግን ከጽሑፉ በላይ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሴሚኮሎኑ ዋናውን አሉታዊ አባባል ከብቸኛው ልዩ ሁኔታ ይለያል፤ የግሪኩን የመውጣት/መውረድ ተቃርኖ ይጠብቃል።
