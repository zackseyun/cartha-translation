  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: am
  text: ‘ከላይ[a] መወለድ ይገባችኋል’ ስላልኩህ[b] አትደነቅ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደገና» ወይም «ዳግመኛ»። የግሪኩ ἄνωθεν «ከላይ» ወይም «እንደገና» ማለት ይችላል።
    reason: alternative_reading
  - marker: b
    text: «ስላልኩህ» የሚለው ነጠላ ቁጥር ነው፤ «መወለድ ይገባችኋል» የሚለው ግን በግሪኩ ብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: አትደነቅ
  rationale: μή ከአዮሪስት ሳብጃንክቲቭ ጋር ክልከላን ይገልጣል፤ «አትደነቅ» በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የθαυμάζωን ኃይል ይጠብቃል።
- source_word: ὅτι
  choice: ስላልኩህ
  rationale: ὅτι እዚህ የተነገረውን ይዘት ያስገባል፤ በአማርኛ የጥቅሱን ይዘት በቀጥታ ከ«ስላልኩህ» ጋር ማያያዝ ተፈጥሯዊ ነው።
- source_word: εἶπόν σοι
  choice: ስላልኩህ
  rationale: የሁለተኛ መደብ ነጠላ ቁጥር የሆነው σοι በ«-ህ» ቅጥያ በግልጽ ተጠብቋል።
- source_word: Δεῖ
  choice: አለባችሁ
  rationale: Δεῖ ግዴታን ወይም አስፈላጊነትን ይገልጣል፤ «አለባችሁ» ጥንካሬውንና የብዙ ቁጥር አድራሻውን ይጠብቃል።
- source_word: ὑμᾶς
  choice: እናንተ
  rationale: የግሪኩን ብዙ ቁጥር በዋናው ጽሑፍ በግልጽ ያሳያል፤ ይህም ቀደም ካለው ነጠላ σοι ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: γεννηθῆναι
  choice: መወለድ
  rationale: የተገብሮ ድርጊቱን «መወለድ» በተፈጥሯዊና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἄνωθεν
  choice: ከላይ
  rationale: ἄνωθεν «ከላይ» ወይም «እንደገና» ማለት ይችላል። የዮሐንስ አጠቃቀምና ከእግዚአብሔር የሚመጣው ልደት አጽንዖት «ከላይ»ን ለዋናው ጽሑፍ ይደግፋሉ፤ ሌላው ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በአዲስ ልደት ንግግር ውስጥ የἄνωθεν ትርጉም
