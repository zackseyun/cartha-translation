translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እናንተ»ና «-ህ» የነጠላና የብዙ ቁጥር ልዩነቱን በዋናው ጽሑፍ ያሳያሉ።
