lexical_decisions:
- source_word: οὔπω
  choice: ገና ... አል- ... ነበር
  rationale: ድርጊቱ እስከዚያ የትረካ ጊዜ ድረስ እንዳልተፈጸመ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γὰρ
