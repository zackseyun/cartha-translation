  rationale: አውዱ መጥምቁ ዮሐንስ መሆኑን ቢያሳይም፣ የግሪኩ ጽሑፍ ‘ዮሐንስ’ ብቻ ይላል። ስለዚህ ተጨማሪው መለያ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ወኅኒ’ በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ሲሆን እዚህ ‘prison’ የሚለውን በግልጽ ያስተላልፋል።
