  rationale: εἰς ያለውን የአቅጣጫ ትርጉም ይጠብቃል፤ ‘ወኅኒ’ በዚህ አውድ የእስር ቤትን በክብር ያለውና ግልጽ ቋንቋ ይገልጣል።
- source_word: ὁ Ἰωάννης
  choice: ዮሐንስ
