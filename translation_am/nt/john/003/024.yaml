  rationale: γάρ ለአውዱ የሚሰጠውን የማብራሪያ ምክንያት በተፈጥሯዊ የአማርኛ አያያዥ ይገልጣል።
- source_word: ἦν βεβλημένος
  choice: አልተጣለም ነበር
  rationale: የግሪኩን ቀደም ብሎ የተጠናቀቀ ተገብሮ ድርጊት የሚጠቁም ግንባታ ይይዛል፤ ‘ተጣለ’ ደግሞ βάλλω ያለውን ጠንካራ ኃይል ይጠብቃል።
- source_word: εἰς τὴν φυλακήν
