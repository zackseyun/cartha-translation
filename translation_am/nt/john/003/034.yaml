id: JHN.3.34
reference: John 3:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: am
  text: እግዚአብሔር የላከው የእግዚአብሔርን ቃላት ይናገራል፤ ምክንያቱም እግዚአብሔር መንፈስን ያለ ልክ ይሰጣል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምክንያቱም የተላከው መንፈስን ያለ ልክ ይሰጣል።” በግሪክ የ“ይሰጣል” ባለቤት በግልጽ አልተጠቀሰም።
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: የላከው ሰው
  rationale: የወንድ ነጠላ ዘመድ ተውላጠ ስም በአማርኛ ተፈጥሯዊ በሆነ ስማዊ አገላለጽ ተተርጉሟል፤ በአገባቡ የተላከውን ሰው ያመለክታል።
- source_word: ἀπέστειλεν
  choice: የላከው
  rationale: የዮሐንስን የመላክ አገላለጽ በቀጥታ ያቆያል፤ ያለፈውን ድርጊትም በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃላት
  rationale: የብዙ ቁጥርንና የባለቤትነት ግንኙነቱን ጠብቆ የተነገሩ ቃላትን ያመለክታል።
- source_word: λαλεῖ
  choice: ይናገራል
  rationale: በአሁን ጊዜ የሚቀጥል ወይም ባሕርያዊ ንግግርን በተለመደ አማርኛ ይገልጻል።
- source_word: ἐκ μέτρου
  choice: ያለ ልክ
  rationale: ከአሉታው ጋር በመሆን በተወሰነ መጠን አለመስጠትን የሚገልጸውን ዘይቤ በአጭርና ተፈጥሯዊ አማርኛ ያቆያል።
- source_word: δίδωσιν
  choice: ይሰጣል
  rationale: የአሁን ጊዜውን አጠቃላይ መግለጫ በቀጥታ ያስተላልፋል።
- source_word: τὸ πνεῦμα
  choice: መንፈስን
  rationale: በዮሐንስ አገባብ የእግዚአብሔርን መንፈስ ያመለክታል፤ የአማርኛው ቃል ይህን ማጣቀሻ ያስቀምጣል።
theological_decisions:
- issue: የδίδωσιν (‘ይሰጣል’) ድብቅ ባለቤት
  choice: በዋናው ጽሑፍ ‘እርሱ’ ተብሎ ተተወ፣ በአቅራቢያው ያለውን እግዚአብሔርን እንደሚያመለክት በዐውዱ እንዲታወቅ።
  alternative: ‘እርሱ’ የሚለው እግዚአብሔር የላከውን ሰው ሊያመለክት ይችላል።
  rationale: በግሪክ ግሱ የተገለጸ ባለቤት የለውም። የንግግሩ ፍሰትና ቀጣዩ ቁጥር እግዚአብሔርን እንደ ሰጪ ይደግፋሉ፤ ሆኖም የተላከው ሰው እንደ ሰጪ የሚወሰድበት ንባብ ሰዋሰዋዊ እድል ስላለው በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ያለ ልክ’ የመጠን ዘይቤውን ይጠብቃል፤ የግሱ ባለቤት ግልጽ አለመሆንም በተውላጠ ስምና በማስታወሻ ተጠብቋል።
