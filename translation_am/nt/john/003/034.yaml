    reason: alternative_reading
  revision_rationale: The revision removes the unnecessary ‘man’ and explicitly identifies God as the giver in the main text, following the audited contextual reading. Since the Greek verb has no expressed subject and may also be understood to refer to the one sent, that alternative is retained in the footnote without imposing a doctrinal resolution beyond the selected main reading.
