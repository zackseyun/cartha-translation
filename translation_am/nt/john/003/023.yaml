  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: am
  text: 'ዮሐንስም በሳሊም አቅራቢያ በሚገኘው ዓይኖን ያጠምቅ[a] ነበር፤ በዚያ ብዙ ውኃ ነበርና።[b] ሰዎችም እየመጡ ይጠመቁ ነበር።


    [a] “ያጠምቅ” ተብሎ የተተረጎመው ግስ “በውኃ ውስጥ ይነክር” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን የተለመደው “ማጥመቅ” የሚለው ቃል ተጠብቋል። ይህ ቃል ብቻውን የጥምቀቱን አፈጻጸም አይወስንም።


    [b] ቃል በቃል፣ “ብዙ ውኆች በዚያ ነበሩ” ማለት ነው።'
  philosophy: optimal-equivalence
  footnotes:
