  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: am
  text: ዮሐንስም መልሶ እንዲህ አለ፦ “ከሰማይ ካልተሰጠው በቀር፣ ሰው አንዳች እንኳ ሊቀበል አይችልም።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: ዮሐንስም መልሶ እንዲህ አለ
  rationale: የግሪኩን የትረካ አገላለጽ ‘መለሰና አለ’ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል። ‘ም’ ከቀደመው ትረካ ጋር ያገናኛል።
- source_word: Οὐ δύναται
  choice: ሊቀበል አይችልም
  rationale: የችሎታ እጦትን የሚገልጸውን δύναμαι በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በአማርኛ ‘ሰው’ በተፈጥሮ ማንኛውንም ሰው የሚወክል አጠቃላይ ነጠላ ስም ነው፤ ትርጉሙን በወንድ ብቻ አይገድብም።
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: አንዳች እንኳ ሊቀበል
  rationale: λαμβάνειν በዚህ አውድ የተሰጠን መቀበል ሲሆን፣ ‘አንዳች እንኳ’ የοὐδὲ ἓνን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: ካልተሰጠው በቀር
  rationale: የማይካተትበትን ሁኔታ የሚገልጸውን ἐὰν μή እና ቀድሞ ተሰጥቶ ያለውን ሁኔታ የሚያሳየውን ፍጹም ተደራጊ ቅርጽ በአጭርና ግልጽ መንገድ ይይዛል።
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ
  rationale: መለኮታዊውን ምንጭ የሚጠቁመውን ቃል እንዳለ ይጠብቃል፤ ‘ከእግዚአብሔር’ ብሎ በትርጓሜ አይተካውም።
theological_decisions:
- issue: የ‘ከሰማይ መሰጠት’ ወሰን
  choice: ንግግሩ በቅርብ አውዱ የአገልግሎትንና የሥልጣንን ስጦታ ያካትታል፤ ነገር ግን አጠቃላይ አገላለጹን ሳይገድብ ተተርጉሟል።
  alternative: ንግግሩን ስለ ሁሉም የሰው ድርጊት ፍጹም ውሳኔ ብቻ ማድረግ፣ ወይም በዚህ አውድ ለአገልግሎት ሚና ብቻ መገደብ።
  rationale: የቅርብ አውዱ የዮሐንስንና የኢየሱስን አገልግሎት ሲመለከትም፣ የግሪኩ አገላለጽ ሰፊ ነው። ትርጉሙ ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ሰው’ በአማርኛ በቂ አጠቃላይ ትርጉም ስላለው የጾታ አማራጭ የግርጌ ማስታወሻ አያስፈልግም።
