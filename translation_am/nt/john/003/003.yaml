base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አለው፦ “እውነት እውነት እልሃለሁ፤ ማንም ከላይ ካልተወለደ፣[a] የእግዚአብሔርን መንግሥት ማየት አይችልም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዳግመኛ።” የግሪክ ተውሳከ ቃል “ከላይ” እና “ዳግመኛ” የሚሉትን ሁለቱንም ፍቺዎች ሊይዝ ይችላል፤ በቀጣዩ ቁጥር ያለው ውይይት በዚህ ድርብ ፍቺ ላይ የተመሠረተ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: መልሶ እንዲህ አለው
  rationale: ሁለቱን የግሪክ ግሶች በተፈጥሯዊና በክቡር የአማርኛ የትረካ አገላለጽ ያቀርባል።
- source_word: Ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የተደጋገመውን አጽንዖት ጠብቆ ለዘመናዊ አንባቢ በቀጥታ የሚገባ ነው።
- source_word: ἐὰν μή τις
  choice: ማንም … ካል-
  rationale: አጠቃላይና ጾታን የማይወስነውን የግሪኩን አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γεννηθῇ
  choice: ካልተወለደ
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ ‘ዳግመኛ’ የሚለውን የἄνωθεν ትርጉም በግሱ ውስጥ አያስገባም።
- source_word: ἄνωθεν
  choice: ከላይ
  rationale: በዮሐንስ ወንጌል የሚታየውን ሰማያዊ አመጣጥ ያመለክታል፤ ‘ዳግመኛ’ የሚለው እውነተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: οὐ δύναται ἰδεῖν
  choice: ማየት አይችልም
  rationale: የአለመቻልን ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ማየት’ የሚለውን ምስላዊና ጥልቅ የዮሐንስ አጠቃቀም አያጠብም።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: የመግዛትንም ሆነ የግዛትን ፍቺ ሳያጠብ የተለመደውንና ትክክለኛውን የአማርኛ አገላለጽ ይጠቀማል።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ የἄνωθεν ትርጉም
