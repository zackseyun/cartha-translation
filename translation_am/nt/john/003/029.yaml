  rationale: የግሪኩን የባለቤትነት/ግንኙነት አገላለጽ ሳያሰፋ በተፈጥሯዊ አማርኛ ያቀርባል፤ የሠርጉን ምሳሌያዊ አውድም ይጠብቃል።
- source_word: νύμφη / νυμφίος
  choice: ሙሽራይት / ሙሽራ
  rationale: በአማርኛ ግልጽና የተለመደ የሠርግ ቃላት ሲሆኑ በሁለቱ ቃላት መካከል ያለውን ተዛማጅነት ይጠብቃሉ።
- source_word: φίλος τοῦ νυμφίου
  choice: የሙሽራው ወዳጅ
  rationale: ግሪኩ በቀጥታ ‘የሙሽራው ወዳጅ’ ይላል፤ ከጽሑፉ በላይ የባህል ሚና የሚወስን ቃል አልገባም።
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: ቆሞ የሚሰማው
  rationale: የመቆምን ሁኔታና የመስማትን ቀጣይ ድርጊት በቀላል ዘመናዊ አማርኛ ያሳያል፤ ተውላጠ ስሙ በአማርኛ ከአውዱ ስለሚገባ አልተደገመም።
- source_word: χαρᾷ χαίρει
  choice: እጅግ ደስ ይለዋል
  rationale: የተዛማጅ ስምና ግስ የግሪክ አገላለጽ የሚሰጠውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: በሙሽራው ድምፅ
