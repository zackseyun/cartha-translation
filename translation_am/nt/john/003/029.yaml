  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: am
  text: ሙሽራይቱ የሆነችለት እርሱ ሙሽራው ነው። ቆሞ እርሱን የሚሰማው የሙሽራው ወዳጅ ግን በሙሽራው ድምፅ ምክንያት እጅግ ደስ ይለዋል።[a] ስለዚህ ይህ የእኔ ደስታ ሙሉ ሆኗል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሙሽራው ወዳጅ” የሚለው የግሪኩ ቃል በቃል አገላለጽ ነው፤ በአንዳንድ የሠርግ ልማዶች ይህ ሚና የሙሽራውን ዋና አጃቢ ሊመስል ይችላል። “እጅግ ደስ ይለዋል” ቃል በቃል “በደስታ ደስ ይለዋል” ሊባል ይችላል።
    reason: cultural_and_lexical_note
  - marker: b
    text: “ሙሉ ሆኗል” የሚለው “ተፈጽሟል” ወይም “ወደ ሙላት ደርሷል” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
