language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: am
  text: ፍርዱም ይህ ነው፤ ብርሃኑ ወደ ዓለም መጥቷል፤ ሰዎችም ሥራዎቻቸው ክፉ ስለነበሩ፣ ከብርሃኑ ይልቅ ጨለማውን ወደዱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: ፍርድ
  rationale: ቃሉ የመመዘንንና የፍርድን ሰፊ ትርጉም ይጠብቃል፤ ውጤቱን ብቻ ‘ኩነኔ’ ብሎ አያጠብም።
- source_word: τὸ φῶς
  choice: ብርሃኑ
  rationale: የዮሐንስን የብርሃን ምሳሌያዊ አገላለጽ ሳይፈታ ይጠብቃል።
- source_word: ἐλήλυθεν
  choice: መጥቷል
  rationale: የግሪኩን ፍጹም ጊዜ እና የመምጣቱን ቀጣይ ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κόσμον
  choice: ዓለም
  rationale: በዮሐንስ ዘንድ ያለውን ሰፊና ምሳሌያዊ የትርጉም ክልል ይጠብቃል።
- source_word: ἠγάπησαν
  choice: ወደዱ
  rationale: የሰዎችን ምርጫ ብቻ ሳይሆን ከጨለማው ጋር ያላቸውን የልብ ቁርኝትም ያስተላልፋል።
- source_word: οἱ ἄνθρωποι
  choice: ሰዎች
  rationale: ቃሉ እዚህ ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ ያመለክታል፤ ‘ሰዎች’ ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: μᾶλλον ... ἢ
  choice: ከ... ይልቅ
  rationale: የንጽጽር ምርጫውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ σκότος
  choice: ጨለማው
  rationale: ከ‘ብርሃኑ’ ጋር ያለውን ምሳሌያዊ ተቃርኖ ይጠብቃል።
- source_word: πονηρὰ
  choice: ክፉ
  rationale: የሥራዎቹን ሥነ ምግባራዊ ክፋት በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: τὰ ἔργα
  choice: ሥራቸው
  rationale: የግሪኩን ‘ሥራዎች/ድርጊቶች’ ሐሳብ በአማርኛ ተፈጥሯዊ በሆነ የጥቅል ነጠላ አገላለጽ ያቀርባል።
theological_decisions:
- issue: ‘ብርሃኑ’ የሚያመለክተው
  choice: ምሳሌያዊውን ‘ብርሃኑ’ የሚለውን አገላለጽ እንዳለ ማቆየት
  alternative: ‘ኢየሱስ’ ወይም ‘ክርስቶስ’ ብሎ በግልጽ መተካት
  rationale: ዐውደ ንባቡ ብርሃኑን ከወልድ መምጣት ጋር በጥብቅ ቢያያይዘውም፣ ግሪኩ ራሱ ምሳሌውን ይጠቀማል፤ ትርጉሙም ይህን ሥነ መለኮታዊ ቅርጽ ጠብቋል።
- issue: የκρίσις ስፋት
  choice: ‘ፍርድ’ ብሎ ማቅረብ
  alternative: ‘ኩነኔ’ ብሎ ውጤቱን ብቻ ማጉላት
  rationale: ንባቡ የፍርዱን መገለጥ ወይም መሠረት ያቀርባል፤ ‘ፍርድ’ በጽሑፉ ያለውን ሰፊ አሻሚነት ይጠብቃል።
- issue: οἱ ἄνθρωποι ያለው አጠቃላይ ኃይል
  choice: ‘ሰዎች’ ብሎ መተርጎም
  alternative: ‘ወንዶች’ ወይም ‘ሰው ልጆች’
  rationale: በዚህ ስፍራ ቃሉ የሰውን ዘር በአጠቃላይ ያመለክታል፤ ‘ሰዎች’ ፆታዊ ገደብ ሳያስገባ የምንጩን ትርጉም ይይዛል።
