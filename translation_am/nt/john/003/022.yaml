  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: am
  text: ከእነዚህ በኋላ ኢየሱስና ደቀ መዛሙርቱ ወደ ይሁዳ አገር[a] ሄዱ፤ በዚያም ከእነርሱ ጋር ጊዜ እያሳለፈ ያጠምቅ ነበር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ይሁዳ ምድር» ወይም በአጭሩ «ወደ ይሁዳ።»
    reason: lexical_alternative
  - marker: b
    text: ዮሐንስ 4፥2 ኢየሱስ ራሱ እንዳላጠመቀ፣ ያጠመቁት ግን ደቀ መዛሙርቱ እንደነበሩ በኋላ ያብራራል።
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ከዚህ በኋላ
  rationale: የብዙ ቁጥር አመልካቹን በቃል በቃል ከመከተል ይልቅ የዮሐንስን የትረካ ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἦλθεν
  choice: ሄዱ
  rationale: መድረሻው በ«ወደ» ስለተገለጸ፣ ከቀደመው ስፍራ ወደ ይሁዳ የተደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል፤ የብዙ ቁጥሩም ኢየሱስንና ደቀ መዛሙርቱን አንድ ላይ ያመለክታል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: የባለቤትነት ግንኙነቱን በመደበኛውና በተለመደው የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: ወደ ይሁዳ አገር
  rationale: γῆ የሚለውን በቀጥታ «አገር/ምድር» በሚለው ክልላዊ ትርጉም ይጠብቃል፤ ከኢየሩሳሌም ወደ ሰፊው የይሁዳ ክልል መሄድን ያመለክታል።
- source_word: διέτριβεν
  choice: ጊዜ እያሳለፈ
  rationale: የግሡን ቀጣይና የተራዘመ ድርጊት ያሳያል፤ «ቆየ» የሚለው አማራጭም ይቻላል።
- source_word: μετ’ αὐτῶν
  choice: ከእነርሱ ጋር
  rationale: ወደ ደቀ መዛሙርቱ የሚመለሰውን ቀጥተኛ ቅድመ አገናዛቢ ሐረግ በግልጽ ያስተላልፋል።
- source_word: ἐβάπτιζεν
  choice: ያጠምቅ ነበር
  rationale: የኢምፐርፌክት ግሡን ቀጣይ ድርጊት ይጠብቃል፤ «ማጥመቅ» የተለመደው ሃይማኖታዊ ቃል ሲሆን የአፈጻጸሙን ዘዴ አስቀድሞ አይወስንም።
theological_decisions:
- issue: ከዮሐንስ 4፥2 አንጻር የ«ያጠምቅ ነበር» ሰዋሰዋዊ ባለቤት
  choice: በዚህ ቁጥር ኢየሱስን የግሡ ሰዋሰዋዊ ባለቤት አድርጎ ማቆየት
  alternative: ዋናውን ጽሑፍ በመቀየር ደቀ መዛሙርቱ እንዳጠመቁ በቀጥታ መግለጽ
  rationale: በግሪክ አገባብ ነጠላው ግስ በተፈጥሮ ወደ ኢየሱስ ይመለሳል። ዮሐንስ 4፥2 ኢየሱስ ራሱ ሳይሆን ደቀ መዛሙርቱ እንዳጠመቁ በኋላ ያብራራል፤ ይህ ግን የ3፥22ን ሰዋሰዋዊ አቀራረብ እንዲቀየር አያስገድድም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ከዚህ በኋላ» እና «ጊዜ እያሳለፈ» ተፈጥሯዊነትን ሲጠብቁ፣ «ወደ ይሁዳ አገር» ደግሞ የምንጩን γῆ በቅርብ ያንጸባርቃል።
