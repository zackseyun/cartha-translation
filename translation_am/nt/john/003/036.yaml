  terminology: 'Key Johannine and theological terms are well rendered: “ወልድ,” “የዘላለም ሕይወት,” and “የእግዚአብሔር ቁጣ.” The main rendering “ለወልድ የማይታዘዝ” preserves the broader force of ἀπειθῶν without reducing it to mere intellectual unbelief, while the footnote responsibly records the refusal-to-believe sense.'
