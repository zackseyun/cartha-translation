  source_fidelity: 'The Amharic accurately represents the Greek contrasts and verbal aspects: present possession of eternal life (አለው), future non-attainment/experience of life (አያይም), and the continuing present state of God''s wrath (ይኖራል). The personal direction of πιστεύων εἰς and the dative relation in ἀπειθῶν τῷ υἱῷ are retained naturally.'
