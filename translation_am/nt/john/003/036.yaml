id: JHN.3.36
reference: John 3:36
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: am
  text: በወልድ የሚያምን የዘላለም ሕይወት አለው፤ ለወልድ የማይታዘዝ ግን[a] ሕይወትን አያይም፤ ነገር ግን የእግዚአብሔር ቁጣ በእርሱ ላይ ይኖራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለወልድ ለማመን እምቢ የሚል።” የግሪኩ ግስ አለመታዘዝንም ሆነ ለማመን እምቢ ማለትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: በወልድ የሚያምን
  rationale: የግሪኩን አጠቃላይ ነጠላ ተሳታፊ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ πιστεύω ከ εἰς ጋር ወደ ወልድ የሚመራ ግላዊ እምነትን ያመለክታል።
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: ወልድ
  rationale: የዮሐንስን ክርስቶሎጂያዊ ማዕረግ ይጠብቃል፤ በግሪኩ የተጨመረ የባለቤትነት ሐረግ ስለሌለ ‘የእግዚአብሔር ልጅ’ ተብሎ አልተስፋፋም።
- source_word: ἔχει ζωὴν αἰώνιον
  choice: የዘላለም ሕይወት አለው
  rationale: ἔχει የአሁን ጊዜ ግስ በመሆኑ ሕይወቱ አሁን ያለ ርስት መሆኑን ይጠብቃል፤ ‘የዘላለም ሕይወት’ በአማርኛ የተለመደና ግልጽ ነው።
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: ለወልድ የማይታዘዝ ግን
  rationale: ἀπειθέω አለመታዘዝን እንዲሁም ለማመን እምቢ ማለትን ሊያመለክት ይችላል። ዋናው ጽሑፍ ሰፊውን የአለመታዘዝ ትርጉም ይጠብቃል።
- source_word: οὐκ ὄψεται ζωήν
  choice: ሕይወትን አያይም
  rationale: የግሪኩን ‘ሕይወትን ማየት’ የሚለውን ዮሐንሳዊ አገላለጽና የወደፊት አቅጣጫ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: የእግዚአብሔር ቁጣ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ያቀርባል፤ ὀργή የመለኮታዊ ፍርድን ክብደት ሳያለዝብ ‘ቁጣ’ ተብሏል።
- source_word: μένει ἐπ’ αὐτόν
  choice: በእርሱ ላይ ይኖራል
  rationale: μένει የአሁን ጊዜ ቀጣይ ሁኔታን ያመለክታል፤ ‘ይኖራል’ በዘመናዊ አማርኛ ግልጽ ሆኖ ቁጣው በሰውየው ላይ መቆየቱን ያሳያል።
theological_decisions:
- issue: በ πιστεύων እና ἀπειθῶν መካከል ያለው ንፅፅር
  choice: ἀπειθῶν በዋናው ጽሑፍ ‘የማይታዘዝ’ ተብሏል፤ ‘ለማመን እምቢ የሚል’ የሚለው በማስታወሻ ቀርቧል።
  alternative: ለወልድ ለማመን እምቢ የሚል
  rationale: ቃሉ አለማመንንና አለመታዘዝን የሚያገናኝ ስለሆነ የትርጉም ውጥረቱ አልተወገደም፤ ሰፊው ትርጉም በዋናው ጽሑፍ፣ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- issue: የዘላለም ሕይወትና የእግዚአብሔር ቁጣ የጊዜ አቅጣጫ
  choice: የዘላለም ሕይወት አሁን ያለ ርስት፣ ቁጣውም አሁን የሚቀጥል ሁኔታ ሆነው ተተርጉመዋል።
  alternative: ሕይወትንና ቁጣን ወደፊት ብቻ እንደሚፈጸሙ መተርጎም
  rationale: ἔχει እና μένει የአሁን ጊዜ ግሶች ናቸው፤ οὐκ ὄψεται ግን የወደፊት ነው። የአሁንና የወደፊት ውጥረት ሳይስተካከል ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ወልድ’፣ ‘የዘላለም ሕይወት’ እና ‘የእግዚአብሔር ቁጣ’ የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ አረፍተ ነገሩ ግን ተፈጥሯዊና ወቅታዊ ሆኖ ቀርቧል።
