base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: am
  text: ኢየሱስም መለሰ፦ “እውነት እውነት እልሃለሁ፤ ማንም ከውሃና ከመንፈስ[a] ካልተወለደ፣ ወደ እግዚአብሔር መንግሥት ሊገባ አይችልም።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘መንፈስ’ የሚለው ቅዱስ መንፈስን ሊያመለክት ይችላል፤ የግሪኩ ቃል ግን ‘መንፈስ’ ተብሎም ሊነበብ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ‘ከውሃና ከመንፈስ’ የሚለው ሐረግ የመንጻትና የእድሳት ምስል፣ ሥጋዊ ልደትና መንፈሳዊ ልደት፣ ወይም ጥምቀትን የሚያመለክት እንደሆነ በተለያየ መንገድ ተረድተውታል። ትርጉሙ በዋናው ጽሑፍ ይህን የትርጓሜ ጥያቄ ሳይወስን የግሪኩን አነጋገር ጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
