- source_word: οὐ δύναται εἰσελθεῖν
  choice: ሊገባ አይችልም
  rationale: የችሎታ እጦቱን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የመንግሥትን ግዛታዊና ንግሥናዊ ገጽታዎች ሳያጠብ የተለመደውንና ትክክለኛውን የአማርኛ አገላለጽ ይጠቀማል።
theological_decisions:
- issue: በἐξ ὕδατος καὶ πνεύματος ውስጥ πνεύματος የሚያመለክተው
  choice: በዋናነት ቅዱስ መንፈስን እንደሚያመለክት ተወስዷል፤ ዋናው ጽሑፍ ግን ‘መንፈስ’ ይላል
