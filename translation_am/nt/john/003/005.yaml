  rationale: የዮሐንስ አውድና የመጽሐፍ ቅዱስ የመንጻትና የመንፈስ እድሳት ዳራ ቅዱስ መንፈስን የሚያመለክት ንባብን ይደግፋሉ። ሆኖም የግሪኩ ስም ያለ መስተዋድድ ነው፣ አማርኛም በካፒታል ፊደል አይለየውም፤ ስለዚህ አማራጩ በማስታወሻ ተጠብቋል።
- issue: ‘ከውሃና ከመንፈስ’ የሚለው ሐረግ ትርጓሜ
  choice: ሐረጉ ሳይፈታ በግሪኩ አወቃቀር ቅርብ ሆኖ ተጠብቋል
  alternative: ውሃን እንደ ሥጋዊ ልደትና መንፈስን እንደ መንፈሳዊ ልደት መረዳት፤ ወይም ውሃን በተለይ እንደ ጥምቀት መረዳት
  rationale: ዋናው ትርጉም የመንጻትና የእድሳት ምስል፣ ሥጋዊና መንፈሳዊ ልደት፣ ወይም ጥምቀት ከሚሉት ትርጓሜዎች አንዱን በጽሑፉ ውስጥ አያስገድድም።
