  terminology: ፈረደበት appropriately retains the broader judicial range of κρίνω; its contextual condemnatory sense is suitably noted. አንድያ ልጅ appropriately conveys μονογενής as unique/only, without requiring the traditional 'only-begotten' sense in the main text.
