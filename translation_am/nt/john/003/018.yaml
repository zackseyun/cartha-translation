  to: በእርሱ የሚያምን አይፈረድበትም[a]፤ የማያምን ግን አስቀድሞ ተፈርዶበታል፤ ምክንያቱም በየእግዚአብሔር አንድያ ልጅ[b] ስም አላመነም።
