id: JHN.3.18
reference: John 3:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: am
  text: በእርሱ የሚያምን አይፈረድበትም[a]፤ የማያምን ግን አስቀድሞ ተፈርዶበታል፤ ምክንያቱም በየእግዚአብሔር አንድያ ልጅ[b] ስም አላመነም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አይፈረድበትም” እና “ተፈርዶበታል” በዚህ አውድ “አይኮነንም” እና “ተኮንኗል” ተብለውም ሊተረጎሙ ይችላሉ።
    reason: lexical_alternative
  - marker: b
    text: “አንድያ ልጅ” የሚለው “ብቸኛ ልጅ” ወይም “ልዩ ልጅ” ተብሎም ሊተረጎም ይችላል፤ በባህላዊ አተረጓጎም “አንድያ የተወለደ ልጅ” ይባላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: በእርሱ የሚያምን
  rationale: The substantival present participle is rendered as a natural Amharic relative construction, while በእርሱ idiomatically expresses trust directed toward him.
- source_word: οὐ κρίνεται / ἤδη κέκριται
  choice: አይፈረድበትም / አስቀድሞ ተፈርዶበታል
  rationale: ፈረደበት preserves the judicial breadth of κρίνω and can convey an adverse verdict in context. The perfect in κέκριται is reflected by አስቀድሞ plus the resultative perfect form.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: የማያምን ግን
  rationale: This is a concise, natural substantival relative construction; ግን marks the contrast carried by δέ.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: ስላላመነ
  rationale: The causal converb clearly gives the reason. In idiomatic Amharic the negative perfect conveys the resulting condition of failure to believe without cumbersome wording.
- source_word: εἰς τὸ ὄνομα
  choice: በ…ስም
  rationale: This preserves the biblical expression 'in the name,' encompassing the person's revealed identity and authority without expanding it in the text.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: በእግዚአብሔር አንድያ ልጅ
  rationale: አንድያ communicates the unique, sole Son in dignified and familiar Amharic, without building the disputed notion of begetting directly into μονογενής.
theological_decisions:
- issue: Sense of κρίνω
  choice: Use the broader judicial wording ፈረደበት in both clauses
  alternative: አይኮነንም / ተኮንኖበታል ('is not condemned / has been condemned')
  rationale: John 3:17–19 supports an adverse or condemnatory judgment, but the Greek verb itself retains the broader sense 'judge.' The selected Amharic wording preserves that lexical and theological tension while the footnote states the contextual alternative.
- issue: Meaning of μονογενής
  choice: አንድያ
  alternative: ብቸኛ; አንድያ የተወለደ
  rationale: The main text emphasizes the Son's uniqueness and sole status. It avoids imposing a biological overtone while noting the historically familiar 'only-begotten' rendering.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; natural, dignified, and suitable for public Scripture reading. The paired clauses retain Greek parallelism, while the causal clause is ordered idiomatically in Amharic.
