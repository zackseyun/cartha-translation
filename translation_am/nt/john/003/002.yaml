  rationale: በግሪክ ጽሑፍ የተጠበቀውን የአይሁድ የአክብሮት መጠሪያ በትርጉም ፈንታ በድምፅ መልክ ያቀርባል።
- source_word: οἴδαμεν
  choice: እናውቃለን
  rationale: የመጀመሪያ ሰው ብዙ ቁጥርን ሳይለውጥ ይጠብቃል።
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: አስተማሪ ሆነህ ከአምላክ እንደመጣህ
  rationale: መነሻው ከአምላክ መሆኑንና የአስተማሪነት ሚናውን ያስተላልፋል፤ ‘ተልከሃል’ የሚል በጽሑፉ ያልተገለጠ ሐሳብ አያክልም።
