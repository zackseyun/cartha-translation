  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: am
  text: ይህ ሰው በሌሊት[a] ወደ እርሱ መጥቶ፣ “ረቢ፣ ከአምላክ የመጣህ አስተማሪ መሆንህን እናውቃለን፤ ምክንያቱም አምላክ ከእርሱ ጋር ካልሆነ በቀር[c]፣ ማንም አንተ የምታደርጋቸውን እነዚህን ምልክቶች[b] ማድረግ አይችልምና።” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሌሊት ጊዜ።” ይህ ሐረግ በዮሐንስ ወንጌል ውስጥ ሌሊትና ጨለማ ምሳሌያዊ ኃይል ካላቸው አጠቃቀሞች ጋር ጭብጣዊ ትስስር ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እነዚህን ተአምራዊ ምልክቶች።” የግሪክ ቃል σημεῖα በዮሐንስ “ምልክቶች” ተብሎ ተተርጉሟል፤ ይህም እነዚህ ድርጊቶች ከራሳቸው ባሻገር የሚያመለክቱ መሆናቸውን ያስጠብቃል።
    reason: lexical_alternative
  - marker: c
    text: ግሪኩ፣ “አምላክ ከእርሱ ጋር ካልሆነ በቀር” በማለት በኒቆዲሞስ ንግግር ውስጥ ያለውን የሦስተኛ ሰው አገላለጽ ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: በቀደመው ቁጥር የተጠቀሰውን ኒቆዲሞስን የሚያመለክት ሲሆን፣ የአመልካች ቃሉን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: νυκτός
