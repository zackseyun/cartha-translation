  rationale: በምንጩ ያለውን የποιέω ግስ ድግግሞሽ በአማርኛም ይጠብቃል።
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: አምላክ ከእርሱ ጋር ካልሆነ በቀር
  rationale: ኒቆዲሞስ ኢየሱስን በሁለተኛ ሰው ከተናገረ በኋላ ወደ ሦስተኛ ሰው የሚያደርገውን ለውጥ እንዳለ ይጠብቃል።
