- source_word: εἶπον ὑμῖν
  choice: ነግሬአችሁ
  rationale: የቀደመውን የኢየሱስ ንግግርና ለተደራሲዎቹ መናገሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐ πιστεύετε
  choice: ካላመናችሁ
