  rationale: ግሪኩ ቃል ብዙ ጊዜ መለኮታዊ ግድነትን ሊጠቁም ቢችልም፣ በዚህ ጥቅስ የግድነቱ አሠራር በግልጽ አልተወሰነም። «ይገባል» ክብደቱን ይጠብቃል፣ ነገር ግን ጽሑፉ ያልገለጠውን ትምህርት አይጨምርም።
