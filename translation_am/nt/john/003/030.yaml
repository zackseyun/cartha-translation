- source_word: ἐμὲ
  choice: እኔ
  rationale: የግሪኩ ተውላጠ ስም የግሱ ምክንያታዊ ባለቤት ስለሆነ በተፈጥሯዊ አማርኛ «እኔ» ተብሏል።
- source_word: δὲ
