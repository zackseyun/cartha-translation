    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially misleading comparative «ሊበልጥ» with «ሊበዛ,» which accurately reflects αὐξάνειν (‘increase’) while preserving the terse antithetical form of the Greek. The footnote is corrected to a natural, complete alternative that reflects the demonstrative force of ἐκεῖνον without changing the verse’s meaning.
