  rationale: በኢየሱስ መበለጥና በዮሐንስ ማነስ መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλαττοῦσθαι
  choice: ላንስ
  rationale: ቃሉ ያነሰ መሆንን ወይም መቀነስን ያመለክታል፤ «ላንስ» ከ«ሊበልጥ» ጋር ያለውን አጭርና ሚዛናዊ ንጽጽር ይጠብቃል።
