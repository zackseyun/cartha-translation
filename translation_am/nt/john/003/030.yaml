review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast and the necessity expressed by δεῖ. However, «ሊበልጥ» normally means ‘to surpass/be superior to’ and can imply an unstated comparison, rather than αὐξάνειν, ‘to increase/grow.’ «ሊበዛ» directly conveys the intended increase and retains the concise parallelism with «ላንስ.»
  naturalness: The proposed revision is idiomatic, concise modern standard Amharic with an appropriately elevated scriptural register. The existing footnote’s «ያነስኩ ልሆን» is not natural in this construction.
  terminology: «ይገባል» suitably renders δεῖ without specifying the exact nature of the necessity. «ሊበዛ / ላንስ» provides a natural and semantically faithful contrast for αὐξάνειν / ἐλαττοῦσθαι. «ያ ሰው» is retained in the alternative footnote as a more explicit rendering of ἐκεῖνον.
  issues:
  - severity: medium
    issue: «ሊበልጥ» for αὐξάνειν
    rationale: It most readily communicates surpassing someone or being better, whereas the Greek refers to Jesus’ increasing prominence. «ሊበዛ» expresses increase without adding a comparative object.
  - severity: medium
    issue: Footnote wording «ያነስኩ ልሆን»
    rationale: This is grammatically and idiomatically unsuitable here and needlessly departs from the main clause’s concise infinitival construction.
  revised_text: እርሱ ሊበዛ[a]፣ እኔ ግን ላንስ ይገባል።
  revised_footnotes:
