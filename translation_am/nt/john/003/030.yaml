  rationale: በዐውዱ የሚያመለክተው ኢየሱስን ነው፤ የግሪኩ የአመልካች ተውላጠ ስም በአማርኛ በተፈጥሯዊ አነጋገር «እርሱ» ተብሎ ተተርጉሟል።
