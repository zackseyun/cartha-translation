    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: ከላይ
  rationale: በዚህ አውድ ቃሉ መደገምን ሳይሆን ከላይ የሆነን መነሻ ያመለክታል። «ከላይ» የሚለው ትርጉም ከ«ከምድር» ጋር ያለውን ንጽጽር ይጠብቃል፤ በኋላ ያለው «ከሰማይ» የሚለውም ትርጉሙን ያብራራል።
- source_word: ἐρχόμενος
  choice: የሚመጣው
  rationale: መስተዋድዱ ከአንቀጽ ጋር ሆኖ ሰውን የሚያመለክት ስለሆነ፣ «የሚመጣው» ተፈጥሯዊና ገላጭ ነው።
- source_word: ἐπάνω πάντων
  choice: ከሁሉ በላይ
  rationale: ሐረጉ ከፍተኛነትንና የበላይነትን ይገልጣል፤ ይህ አተረጓጎም ቦታዊውን ምስልና የማዕረግ ትርጉሙን አብሮ ይጠብቃል።
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: ከምድር የሆነው
  rationale: የግሪኩን አንቀጻዊ አወቃቀርና በመነሻው ላይ ያለውን አጽንዖት ይጠብቃል።
- source_word: γῆ
  choice: ምድር
  rationale: በዚህ ስፍራ ቃሉ ከሰማይ ጋር ይነጻጸራል፤ ስለዚህ «ምድር» ከ«መሬት» ወይም «አገር» ይልቅ ተገቢ ነው።
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: ከምድር ነው
  rationale: በዋናው ጽሑፍ ያለው የ«ከምድር» ድግግሞሽ የምድራዊ መነሻንና ባሕርይን ስለሚያጎላ፣ ሳይለሰልስ ተጠብቋል።
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: ከምድርም ይናገራል
  rationale: የἐκን ድግግሞሽ ጠብቆ ንግግሩ ምንጭን፣ ዓለምን ወይም ርእሰ ጉዳይን ስለማመልከቱ ያለውን አሻሚነት ክፍት ይተዋል።
- source_word: οὐρανός
  choice: ሰማይ
  rationale: በዮሐንስ አውድ መለኮታዊውንና ሰማያዊውን ዓለም ያመለክታል፤ «ሰማይ» ይህን በተፈጥሮ ያስተላልፋል።
theological_decisions:
- issue: በ«ከላይ»ና በ«ከሰማይ» መካከል ያለው ግንኙነት
  choice: ἄνωθενን «ከላይ»፣ ἐκ τοῦ οὐρανοῦን ደግሞ «ከሰማይ» ብሎ መተርጎም
  alternative: ሁለቱንም «ከሰማይ» ብሎ መተርጎም
  rationale: የግሪኩ ጽሑፍ የተዛመዱ ነገር ግን የተለያዩ አገላለጾችን ይጠቀማል። ልዩነቱን መጠበቅ የመጀመሪያውን አገላለጽ በሁለተኛው እንዲብራራ ያደርጋል፤ የሰማያዊ መነሻንና የበላይነትንም ሳያስፋፋ ያሳያል።
- issue: የምድርን የሚጠቅሰው ድግግሞሽ
  choice: «ከምድር ... ከምድር ... ከምድር» የሚለውን ድግግሞሽ መጠበቅ
  alternative: «ምድራዊው ምድራዊ ነው፤ በምድራዊ መንገድም ይናገራል» ብሎ ማለስለስ
  rationale: ድግግሞሹ በምድራዊና በሰማያዊ መነሻ መካከል ያለውን ንጽጽር ያጎላል። እሱን መጠበቅ ከጽሑፉ በላይ የሆነ ትርጓሜ ከማስገባት ይቆጠባል።
