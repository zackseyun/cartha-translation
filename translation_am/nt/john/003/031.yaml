base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: am
  text: 'ከላይ የሚመጣው ከሁሉ በላይ ነው።[a] ከምድር የሆነው ከምድር ነው፤ ከምድርም ይናገራል።[b] ከሰማይ የሚመጣው ከሁሉ በላይ ነው።


    [a] በመጀመሪያው ሐረግ «ከላይ» በሚለው ፈንታ «ከሰማይ» ሊባልም ይችላል። ἄνωθεν የሚለው የግሪክ ቃል መነሻው ከላይ መሆኑን ያመለክታል፤ በኋላ ያለው «ከሰማይ» የሚለው ሐረግም ይህን ያብራራል።


    [b] «ስለ ምድር ይናገራል» ተብሎም ሊተረጎም ይችላል። የግሪኩ ንባብ «ከምድር» የሚለውን ቃል ይደግማል፤ ይህም የንግግሩን ምንጭ፣ የሚነገርበትን ዓለም ወይም ርእሰ ጉዳዩን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
