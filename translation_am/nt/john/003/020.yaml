  rationale: φαῦλα በዚህ የዮሐንስ የብርሃንና የጨለማ ንጽጽር ውስጥ ሥነ ምግባራዊ ክፋትን ያመለክታል። የአሁን ጊዜው ተሳቢ πράσσων ባሕርይ የሆነን ወይም ቀጣይ ድርጊትን የሚያሳይ ሲሆን፣ የአማርኛው “የሚያደርግ” ይህን ያስተላልፋል።
- source_word: μισεῖ τὸ φῶς
