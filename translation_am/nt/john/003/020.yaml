- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: ወደ ብርሃኑ አይመጣም
  rationale: የግሪኩን ቀላል የእንቅስቃሴ ምስልና የዮሐንስን የመገለጥ ዘይቤ በተፈጥሮአዊ አማርኛ ይጠብቃል።
- source_word: ἵνα μὴ ἐλεγχθῇ
  choice: እንዳይጋለጡ
