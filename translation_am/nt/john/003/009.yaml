  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: am
  text: ኒቆዲሞስም መልሶ፣ “እነዚህ ነገሮች እንዴት ሊሆኑ[a] ይችላሉ?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚህ ነገሮች እንዴት ሊከሰቱ ይችላሉ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መልሶ
  rationale: በውይይት ውስጥ የመመለስን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Νικόδημος
  choice: ኒቆዲሞስ
  rationale: የግል ስሙን በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ይጠብቃል።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: የግሪኩን ‘ለእርሱ አለ’ ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ኢየሱስን’ የሚል ስም አይጨምርም።
- source_word: Πῶς
  choice: እንዴት
  rationale: የአኳኋን ወይም የመቻልን ጥያቄ በቀጥታ ያስተላልፋል።
- source_word: δύναται
  choice: ሊሆኑ ይችላሉ
  rationale: የችሎታንና የእድልን ሞዳላዊ ኃይል በዘመናዊ አማርኛ ይገልጻል።
- source_word: ταῦτα
  choice: እነዚህ ነገሮች
  rationale: የግሪኩን ገለጻዊ ብዙ ቁጥር ጠብቆ ቀደም ሲል ወደተነገሩት ጉዳዮች ያመለክታል።
- source_word: γενέσθαι
  choice: ሊሆኑ
  rationale: γίνομαι ሊያመለክት የሚችለውን ‘መሆን፣ መፈጠር፣ መከሰት’ ስፋት በአጭርና ተፈጥሯዊ አገላለጽ ይይዛል።
theological_decisions:
- issue: ኒቆዲሞስ ስለ ተገለጹት ነገሮች የጠየቀውን የመቻልና የመፈጸም ጥያቄ መተርጎም
  choice: እነዚህ ነገሮች እንዴት ሊሆኑ ይችላሉ?
  alternative: እነዚህ ነገሮች እንዴት ሊፈጸሙ ይችላሉ?
  rationale: ‘ሊሆኑ’ የγίνομαιን ሰፊ የትርጉም ክልል ይጠብቃል፤ ጥያቄው ስለ መኖራቸው ነው ወይስ ስለ መፈጸማቸው የሚለውን ልዩነት በግድ አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘መልሶ ... አለው’ የግሪኩን የውይይት ቅርጽ ሳይጎዳ ተፈጥሯዊ አገላለጽ ይሰጣል።
