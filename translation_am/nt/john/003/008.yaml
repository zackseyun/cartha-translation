    text: የግሪኩ πνεῦμα የሚለው ቃል ‘ነፋስ’ ወይም ‘መንፈስ’ ማለት ይችላል። ኢየሱስ በዚህ ቁጥር በሁለቱም ክፍሎች ያንኑ ቃል በመጠቀም የቃላት ጨዋታ ይፈጥራል።
