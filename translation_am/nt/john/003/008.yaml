  rationale: φωνή ድምፅን ወይም ድምፀ ንግግርን ሊያመለክት ይችላል፤ ከነፋስ ጋር ‘ድምፅ’ ተፈጥሯዊ ሲሆን የምንጩን ሰፊ ትርጉምም ይጠብቃል።
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
