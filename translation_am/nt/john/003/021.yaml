- issue: የ ὅτι ሚና
  choice: የሚገለጠውን ይዘት እንደሚያስተዋውቅ ተተርጉሟል።
  alternative: ሥራዎቹ የሚገለጡበትን ምክንያት፣ «ምክንያቱም በእግዚአብሔር ተደርገዋል» ብሎ ማቅረብ
  rationale: ከ «እንዲገለጡ» በኋላ ὅτι የመገለጡን ይዘት ማስተዋወቁ ተፈጥሯዊ ነው፤ የምክንያት ንባቡ ግን ሰዋሰዋዊ አማራጭ ስለሆነ በማስታወሻ ተጠቅሷል።
- issue: የ ἐν θεῷ ሥነ መለኮታዊ ስፋት
  choice: «በእግዚአብሔር» ተብሎ ክፍት ተቀምጧል።
  alternative: «በእግዚአብሔር ኃይል»፣ «በእግዚአብሔር አማካይነት» ወይም «ከእግዚአብሔር ጋር በአንድነት»
  rationale: የግሪኩ አገላለጽ መለኮታዊ አድራጊነትን፣ የእግዚአብሔርን የተጽዕኖ ክልል ወይም ግንኙነትን ሊያመለክት ይችላል፤ ትርጉሙ ከምንጩ የበለጠ እንዳይጠብ አንድ ፍቺ ብቻ አልተጫነበትም።
