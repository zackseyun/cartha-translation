  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: am
  text: ነገር ግን እውነትን የሚያደርግ ወደ ብርሃኑ ይመጣል፤ ሥራዎቹ በእግዚአብሔር የተደረጉ መሆናቸው እንዲገለጥ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «እውነትን የሚያደርግ» የግሪኩ ቀጥተኛ አገላለጽ ነው፤ «እውነትን የሚተገብር» ወይም «እውነተኛውን የሚያደርግ» ተብሎም ሊገለጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አያያዥ ቃል የሚገለጠውን ይዘት ወይም የመገለጡን ምክንያት ሊያስተዋውቅ ይችላል። ስለዚህ «ሥራዎቹ በእግዚአብሔር ስለተደረጉ እንዲገለጡ» ተብሎም ሊተረጎም ይችላል። «በእግዚአብሔር» የሚለውም «በእግዚአብሔር ኃይል» ወይም «በእግዚአብሔር አማካይነት» የሚል ፍቺ ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: ነገር ግን እውነትን የሚያደርግ
  rationale: δέ ከቀደመው ቁጥር ጋር ያለውን ለስላሳ ንፅፅር «ነገር ግን» በማለት ያሳያል። የግሪኩ ሐረግ ቃል በቃል «እውነትን የሚያደርግ» ስለሚል፣ እውነትን እንደ ተግባርና አኗኗር የሚያቀርበው የዮሐንስ አገላለጽ ተጠብቋል።
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: ወደ ብርሃኑ ይመጣል
  rationale: πρός ከእንቅስቃሴ ግስ ጋር ወደ አንድ ነገር መቅረብን ያሳያል፤ «ወደ ብርሃኑ» ይህን ዘይቤ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: ሥራዎቹ ... እንዲገለጡ
  rationale: ἵνα የዓላማ ፍቺን ያሳያል፤ የግሪኩ ተደራጊ ቅርጽም «እንዲገለጡ» በሚለው ተጠብቋል። ἔργα ምግባራዊ ትርጉሙን አስቀድሞ ሳይወስን «ሥራዎች» ተብሏል።
- source_word: ὅτι
  choice: እንደ
  rationale: እዚህ ὅτι የሚገለጠውን ይዘት እንደሚያስተዋውቅ ተወስዷል፤ «እንደተደረጉ እንዲገለጡ» የሚለው በአማርኛ ተፈጥሯዊ ሆኖ ይህን ንባብ ይጠብቃል። «ምክንያቱም» የሚለው የምክንያት ንባብም ይቻላል።
- source_word: ἐν θεῷ
  choice: በእግዚአብሔር
  rationale: የአማርኛው «በ» በእግዚአብሔር ውስጥ፣ በእግዚአብሔር ኃይል ወይም ከእርሱ ጋር ባለ ግንኙነት የመደረግን ክፍት ፍቺ ሊሸከም ይችላል፤ አንዱን ብቻ አይወስንም።
- source_word: ἐστιν εἰργασμένα
  choice: እንደተደረጉ
  rationale: የተደረገ ድርጊትና የቀጠለ ውጤቱን የሚያመለክተው ፍጹም ተደራጊ አገላለጽ በተደራጊው «ተደረጉ» ተላልፏል።
theological_decisions:
- issue: የ ποιῶν τὴν ἀλήθειαν ፈሊጣዊ አገላለጽ
  choice: «እውነትን የሚያደርግ» በሚል ቀጥተኛ አገላለጽ ተተርጉሟል።
