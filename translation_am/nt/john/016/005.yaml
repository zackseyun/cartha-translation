  terminology: “ላከኝ” suitably preserves Johannine sending language without inserting “አብ.” “ጠይቀኝ” accurately conveys asking a question, and “ወዴት ትሄዳለህ?” is a natural rendering of Ποῦ ὑπάγεις;.
