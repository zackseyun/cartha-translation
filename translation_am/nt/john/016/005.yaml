id: JHN.16.5
reference: John 16:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: am
  text: አሁን ግን ወደ ላከኝ እሄዳለሁ፤ ከእናንተም አንድም ሰው፣ “ወዴት ትሄዳለህ?” ብሎ አይጠይቀኝም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: የδέን ንግግራዊ ንፅፅር በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὑπάγω
  choice: እሄዳለሁ
  rationale: በዐውደ ንባቡ ያለውን የእንቅስቃሴ ትርጉምና በቅርብ የሚፈጸም መሄድን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘እለያለሁ’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: πρὸς τὸν πέμψαντά με
  choice: ወደ ላከኝ
  rationale: አንቀጹን በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ ሐረግ ያቀርባል፤ ግሪኩ በዚህ ስፍራ ‘አብ’ ብሎ ስለማይጠቅስ አይጨምርም።
- source_word: πέμψαντά
  choice: ላከኝ
  rationale: πέμπω በዮሐንስ የተልእኮን ሐሳብ የሚያሳይ ሲሆን ‘ላከ’ ቀጥተኛና የተለመደ አቻ ነው።
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: ከእናንተም አንድም ሰው
  rationale: ከቡድኑ ውስጥ ማንም እንደሌለ የሚገልጠውን ከፊላዊ አወቃቀርና አጽንዖት ይጠብቃል።
- source_word: ἐρωτᾷ με
  choice: አይጠይቀኝም
  rationale: በዚህ ዐውደ ንባብ ἐρωτάω ጥያቄ መጠየቅን ያመለክታል፤ ይህም በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: Ποῦ ὑπάγεις;
  choice: ወዴት ትሄዳለህ?
  rationale: የቦታ ጥያቄውንና የመሄድ እንቅስቃሴውን በተፈጥሯዊ የአማርኛ ጥያቄ ያቀርባል።
theological_decisions:
- issue: ‘የላከኝ’ ማንነት
  choice: ‘ወደ ላከኝ’ ተብሎ በአጠቃላይ እንዲቀርብ፣ ‘አብ’ የሚለው በዋናው ጽሑፍ እንዳይጨመር
  alternative: ‘ወደ ላከኝ አብ’
  rationale: በዮሐንስ መለኮታዊ ዐውድ ጠቋሚው ግልጽ ቢሆንም፣ የግሪኩ ሐረግ በቀጥታ ‘አብ’ አይልም። ስለዚህ ትርጉሙ ያልተገለጸውን መጠሪያ ሳይጨምር የምንጩን አወቃቀር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ በጥቅስ ምልክት ተለይቷል፤ አስፈላጊ የጽሑፍ ልዩነት ወይም ማብራሪያ ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
