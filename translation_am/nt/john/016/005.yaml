  source_fidelity: 'The draft accurately renders every clause of the Greek: νῦν δέ as “አሁን ግን,” the movement verb ὑπάγω as “እሄዳለሁ,” the unspecified personal sender as “ላከኝ,” and the emphatic negative partitive expression as “ከእናንተም አንድም ሰው.” The direct question preserves both its content and its interrogative force. No doctrinal identification beyond the Greek is added.'
