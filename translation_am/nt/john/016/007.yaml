  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: am
  text: ነገር ግን እኔ እውነቱን እነግራችኋለሁ፤ እኔ መሄዴ ይጠቅማችኋል። ምክንያቱም እኔ ካልሄድሁ፣ ጠበቃው[a] በፍጹም ወደ እናንተ አይመጣም፤ እኔ ብሄድ ግን ወደ እናንተ እልከዋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ረዳቱ፣” “አማካሪው፣” “አጽናኙ”፤ በግሪክኛ “ጰራቅሊጦስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: በቀደመው አውድ ከተገለጠው የደቀ መዛሙርቱ ሐዘን ጋር ያለውን ንጽጽር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: እኔ እውነቱን እነግራችኋለሁ
  rationale: የቃሉን ግልጽና አጽንዖት ያለው የእውነት ማረጋገጫ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: συμφέρει ὑμῖν
  choice: ይጠቅማችኋል
  rationale: ግሱ ለተናጋሪዎቹ የሚሆንን ጥቅም ወይም ብልጫ ያመለክታል፤ ይህ አገላለጽ አጭርና ግልጽ ነው።
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: እኔ መሄዴ
  rationale: ለእነርሱ የሚጠቅመውን ነገር፣ ማለትም የኢየሱስን መሄድ፣ በተፈጥሯዊ የአማርኛ ስም-አረፍተ ነገር ይገልጣል።
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: እኔ ካልሄድሁ
  rationale: የግሪኩን አሉታዊ ሁኔታዊ አወቃቀርና የ‘መሄድ’ ድግግሞሽ ይጠብቃል፤ የማብራሪያው ግንኙነት በአማርኛው የአረፍተ ነገር ቅደም ተከተል ግልጽ ነው።
- source_word: ὁ παράκλητος
  choice: ጠበቃው
  rationale: ቃሉ በአንድ ሰው ፈንታ የሚቆምን፣ የሚደግፍንና የሚረዳን ግለሰባዊ ወኪል ሊያመለክት ይችላል። ‘ጠበቃው’ የውክልናውን ገጽታ ይጠብቃል፤ ሰፊው የትርጉም ክልል በግርጌ ማስታወሻ ተገልጧል።
- source_word: οὐ μὴ ἔλθῃ
  choice: በፍጹም ... አይመጣም
  rationale: οὐ μή ከንዑስ አንቀጽ ጋር ያለውን ጠንካራ አሉታዊ አጽንዖት በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πρὸς ὑμᾶς
  choice: ወደ እናንተ
  rationale: ወደ ደቀ መዛሙርቱ የሚደረገውን እንቅስቃሴ ቀጥታ ይገልጣል።
- source_word: ἐὰν δὲ πορευθῶ
  choice: እኔ ብሄድ ግን
  rationale: ከቀደመው አሉታዊ ሁኔታ ጋር ያለውን ንጽጽር እና የግሪኩን ሁኔታዊ አወቃቀር ይጠብቃል።
- source_word: πέμψω αὐτὸν
  choice: እልከዋለሁ
  rationale: የመላክን ቀጥተኛ ትርጉም ይሰጣል፤ የወንድ አንቀጽ ተውላጠ ስም በ‘-ዋ-’ ቅጥያ በግለሰባዊ ሁኔታ ተወክሏል።
theological_decisions:
- issue: በዮሐንስ ንግግር ውስጥ παράκλητος የሚለው ማዕረግ
  choice: ጠበቃው
