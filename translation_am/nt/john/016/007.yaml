  alternative: እልከዋለሁ የሚለውን ግለሰባዊ ማጣቀሻ በገለልተኛ ነገር መተካት
  rationale: ግሪኩ αὐτόν ወንድ ነጠላ ተውላጠ ስም ነው፤ ዐውዱም ጠበቃውን እንደሚመጣና እንደሚላክ ግለሰባዊ ወኪል ያቀርበዋል። አማርኛው ይህን የምንጩን ግለሰባዊ አቀራረብ ይጠብቃል።
