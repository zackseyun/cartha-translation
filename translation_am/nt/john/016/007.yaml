  rationale: የግሪኩ ቃል የውክልና፣ የእርዳታ፣ የምክርና የማጽናናት ገጽታዎችን የሚያካትት ሰፊ የትርጉም ክልል አለው። ‘ጠበቃው’ በኢየሱስ ፈንታ የሚመጣውን ግለሰባዊ ወኪል ገጽታ ያጎላል፤ ሌሎቹን ሕጋዊ የትርጉም አማራጮች ማስታወሻው ይጠብቃል።
- issue: ለጠበቃው የተሰጠው ግለሰባዊ ማጣቀሻ
