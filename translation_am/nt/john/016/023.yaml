source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: am
  text: በዚያም ቀን ምንም ነገር አትጠይቁኝም።[a] እውነት፣ እውነት እላችኋለሁ፤ በስሜ ከአብ የምትለምኑትን ሁሉ እርሱ ይሰጣችኋል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚህ ቁጥር “መጠየቅ” ለሚለው ሐሳብ ሁለት የተለያዩ የግሪክ ግሦች ተጠቅመዋል፤ መጀመሪያ ኢየሱስን ስለመጠየቅ ἐρωτάω፣ ቀጥሎም ከአብ ስለመለመን αἰτέω ተጠቅመዋል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ የእጅ ጽሑፍ ማስረጃ ውስጥ “የምትለምኑትን ሁሉ” እና “በስሜ” በሚሉት አገላለጾች ላይ የንባብ ልዩነት አለ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያም ቀን
  rationale: የጊዜውን አገላለጽ በቀጥታ ያቆያል፤ በዮሐንስ ንግግር ያለውን ልዩ ክብደትም አያጠፋም።
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: ምንም ነገር አትጠይቁኝም
  rationale: ἐμέ የሚለውን ‘እኔን’ በግሱ ውስጥ ግልጽ ያደርጋል፤ οὐδέν ያለውን ፍጹም አሉታዊነትም ይጠብቃል።
- source_word: ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የተደገመውን አጽንዖት ጠብቆ ለዘመናዊ አማርኛ አንባቢ ግልጽ ነው።
- source_word: ἄν τι αἰτήσητε
  choice: የምትለምኑትን ሁሉ
  rationale: ያልተወሰነውን የጥያቄ ወሰን በተፈጥሯዊ አማርኛ ይገልጣል፤ αἰτέω እዚህ የልመና ወይም የጥያቄ ስሜት ስላለው ‘መለመን’ ተመርጧል።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: ግሪኩ ‘አብ’ ብቻ ይላል፤ ‘አባቴን’ የሚል ባለቤትነት አልተጨመረም።
- source_word: δώσει ὑμῖν
  choice: ይሰጣችኋል
  rationale: የሚሰጠው ነገር ከቀደመው አንጻራዊ አረፍተ ነገር ይታወቃል፤ ስለዚህ ተጨማሪ ተውሳከ ቃል ሳያስፈልግ ተፈጥሯዊ ነው።
- source_word: ἐν τῷ ὀνόματί μου
  choice: በስሜ
  rationale: የዮሐንስን አስፈላጊ አገላለጽ በቀጥታ ይጠብቃል፤ ትክክለኛ ሥነ መለኮታዊ ወሰኑንም በትርጓሜ አይገድብም።
theological_decisions:
- issue: ἐρωτάω ከኢየሱስ ጋር፣ αἰτέω ደግሞ ከአብ ጋር የተጠቀሙበት ልዩነት
  choice: የመጀመሪያውን ‘መጠየቅ’፣ ሁለተኛውን ‘መለመን’ በማለት ልዩነቱን በዋናው ጽሑፍ በተፈጥሯዊ መጠን ማሳየት
  alternative: ሁለቱንም ‘መጠየቅ’ ብሎ መተርጎም፣ ወይም የመጀመሪያውን ‘መጠየቅ/መመርመር’ በሚል በላይ መወሰን
  rationale: ሁለቱ ግሶች የተለያዩ ናቸው፤ ነገር ግን የመጀመሪያውን ‘መመርመር’ ብሎ መወሰን አሻሚነቱን ሊያጠፋ ይችላል። ‘ጠይቁኝ’ እና ‘ለምኑ’ ተፈጥሯዊ ልዩነት ያሳያሉ።
- issue: ‘በስሜ’ የተባለው የጸሎት ተስፋ ወሰን
  choice: ቃሉን በቀጥታ ማቅረብና በዋናው ጽሑፍ ያልተጠቀሱ ሥነ መለኮታዊ ቅድመ ሁኔታዎችን አለመጨመር
  alternative: ‘ከፈቃዱ ጋር የሚስማማውን’ የሚል ገደብ በትርጉሙ ውስጥ መጨመር
  rationale: ሰፊው የዮሐንስ አውድ ለትርጓሜ ጠቃሚ ቢሆንም፣ ይህ ቁጥር ተስፋውን በቀጥታ ይናገራል፤ ትርጉሙም ያልተጻፈ ገደብ ማከል የለበትም።
- issue: ‘በስሜ’ የሚለው ከ‘ለምኑ’ ወይም ከ‘ይሰጣችኋል’ ጋር ያለው አገናኝ
  choice: ከመለመን ጋር አያይዞ ‘አብን በስሜ የምትለምኑትን’ ማለት
  alternative: ‘አብ በስሜ ይሰጣችኋል’ ብሎ ከመስጠት ጋር ማያያዝ
  rationale: የግሪክ የእጅ ጽሑፍ ማስረጃ እና የሐረግ አቀማመጥ ልዩነት ሁለቱንም ግንኙነቶች እንዲታሰቡ ያደርጋል። ዋናው ጽሑፍ የተለመደውን ከመለመን ጋር ያለውን ግንኙነት ተከትሏል፤ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘አብ’ የሚለው የተለመደ መጽሐፍ ቅዱሳዊ ቃል እንደሆነ ተጠብቋል፤ አረፍተ ነገሩ ግን ጥንታዊ ወይም ከባድ እንዳይሆን በዘመናዊ አገባብ ቀርቧል።
