    text: ወይም፣ «በእውነት ሁሉ ይመራችኋል።» ግሪኩ በቅርብ አተረጓጎም «በእውነት ሁሉ» ይላል፤ ከ«መምራት» ጋር ግን «ወደ» የሚለው አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
