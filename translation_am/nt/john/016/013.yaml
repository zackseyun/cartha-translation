  choice: ነገር ግን ... በሚመጣበት ጊዜ
  rationale: ὅταν የወደፊት ጊዜ ሁኔታን ያመለክታል፤ δέ ከቀደመው ንግግር ጋር ያለውን ለስላሳ ንጽጽር በ«ነገር ግን» ይጠብቃል።
- source_word: ἔλθῃ ἐκεῖνος
  choice: እርሱ ... በሚመጣበት ጊዜ
  rationale: ἐκεῖνος ያለውን ግላዊ አመልካችነት «እርሱ» ይጠብቃል፤ ከὅταν ጋር ያለው አወቃቀር በተፈጥሯዊ አማርኛ የጊዜ ንዑስ ሐረግ ሆኖ ተተርጉሟል።
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: የእውነት መንፈስ
  rationale: የዮሐንስን ልዩ መጠሪያና የግሪኩን የባለቤትነት አወቃቀር በቀጥታ ይጠብቃል።
- source_word: ὁδηγήσει ὑμᾶς
  choice: ይመራችኋል
  rationale: ὁδηγέω በዚህ ዘይቤያዊ አጠቃቀም «መምራት» ማለት ሲሆን፣ ቅጥያው የብዙ ቁጥር ተቀባዮችን ያሳያል።
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: ወደ እውነት ሁሉ
  rationale: ἐν በመደበኛነት «በ/ውስጥ» ቢሆንም፣ ከὁδηγέω ጋር ያለው የአቅጣጫ ስሜት በአማርኛ «ወደ ... ይመራ» በተፈጥሮ ይገለጣል። የቅርብ መዋቅራዊ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: ከራሱ አይናገርምና
  rationale: «ከራሱ» የἀφ’ ἑαυτοῦን ምንጭ ጠቋሚ አገላለጽ ይጠብቃል፤ -ና ደግሞ γάρ የሚሰጠውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: የሚሰማውን ሁሉ ይናገራል
  rationale: የመስማትና የመናገርን ቅደም ተከተል ይጠብቃል፤ ὅσα በ«...ውን ሁሉ» ተገልጧል። የአማርኛው ሐረግ ከቀደመው አሉታዊ ንጽጽር በሥርዓተ ነጥብ ተያይዟል።
- source_word: τὰ ἐρχόμενα
  choice: የሚመጡትን ነገሮች
  rationale: በአንቀጽ የተወሰነውን የአሁን ጊዜ ቦዝ አንቀጽ በቀጥተኛና ግልጽ መንገድ ያስተላልፋል፤ የወደፊት ክስተቶችን ያመለክታል።
- source_word: ἀναγγελεῖ ὑμῖν
  choice: ይነግራችኋል
  rationale: ἀναγγέλλω የማሳወቅ፣ የመናገር ወይም የማወጅ ስሜት አለው፤ «ይነግራችኋል» ለዘመናዊ አንባቢ ተፈጥሯዊና ክቡር ነው።
