  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: am
  text: ነገር ግን እነዚህን ነገሮች ስለነገርኳችሁ፣ ሐዘን ልባችሁን[a] ሞልቶታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልቦቻችሁን።” በግሪክ ብዙ ቁጥር ያለው “የእናንተ” ከነጠላው “ልብ” ጋር ተጠቅሷል፤ ይህም የቡድኑን የጋራ ውስጣዊ ሐዘን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ንፅፅር በተፈጥሯዊና በግልጽ አማርኛ ያሳያል።
- source_word: ὅτι
  choice: ስለ
  rationale: በዐውዱ የደቀ መዛሙርቱን ሐዘን ምክንያት የሚያስገባ ስለሆነ፣ ምክንያታዊ ኃይሉን ይጠብቃል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥርና ኢየሱስ ቀደም ሲል የተናገራቸውን ጉዳዮች የሚያመለክተውን ትርጉም ይጠብቃል።
- source_word: λελάληκα
  choice: ነገርኳችሁ
  rationale: የተናገረው ነገር አሁን ያለውን ውጤት ያስከተለ መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተቀባዩን ብዙ ቁጥርም በግስ ውስጥ ይገልጻል።
- source_word: ἡ λύπη
  choice: ሐዘን
  rationale: ጥልቅ የውስጥ ስቃይንና ኀዘንን በክብር ያለው ዘመናዊ አማርኛ ይገልጻል።
- source_word: πεπλήρωκεν
  choice: ሞልቶታል
  rationale: የπληρόωን መሠረታዊ የመሙላት ምስል እና የፍጹም ጊዜውን አሁናዊ ውጤት ይጠብቃል።
- source_word: ὑμῶν τὴν καρδίαν
  choice: ልባችሁን
  rationale: ብዙ ባለቤትን ከነጠላ ‘ልብ’ ጋር በማጣመር የግሪኩን ሰዋሰዋዊ ቅርጽና የቡድኑን የጋራ ውስጣዊ ሐዘን ይጠብቃል።
theological_decisions:
- issue: የጋራ ነጠላ ‘ልብ’ ወይም የተከፋፈለ ብዙ ‘ልቦች’
  choice: ልባችሁን
  alternative: ልቦቻችሁን
  rationale: ግሪኩ ብዙ ባለቤት ከነጠላ καρδίαν ጋር ይጠቀማል። ‘ልባችሁን’ ይህን ቅርጽ በተፈጥሯዊ አማርኛ እያቆየ የደቀ መዛሙርቱን የጋራ ውስጣዊ ሁኔታ ሊያመለክት የሚችለውን አሻሚነት አይዘጋም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። ‘ልባችሁን ሞልቶታል’ የሚለው የምንጩን ምስላዊ አነጋገር ይጠብቃል፤ ከ‘አሸንፏችኋል’ ወይም ‘ዋጣችሁ’ ከሚሉ የበለጠ ትርጓሜያዊ አማራጮች ተቆጥቧል።
