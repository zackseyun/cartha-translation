  text: concerning sin[a], because they do not believe in me;
translation:
  language: am
  text: ስለ ኃጢአትም፣ በእኔ ስለማያምኑ ነው፤[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእኔ እንደማያምኑ።» የግሪኩ አያያዥ ቃል በሁለቱም መንገድ ሊተረጎም ይችላል፤ ነገር ግን «ስለማያምኑ ነው» የሚለው በዐውዱ ያለውን የማብራሪያ ወይም የምክንያት ኃይል ይበልጥ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: ስለ
  rationale: ከተከታዮቹ ቁጥሮች ጋር በሚኖረው ትይዩ አወቃቀር መንፈስ የሚያሳምንበትን ጉዳይ በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: ἁμαρτίας
  choice: ኃጢአት
  rationale: ነጠላውን ረቂቅ ስም ጠብቆ የኃጢአትን ምድብ ይገልጣል፤ የተወሰኑ ኃጢአቶችን አይጨምርም።
- source_word: μέν
  choice: ም
  rationale: μέν የተከታታዩን የመጀመሪያ ክፍል ያመለክታል። የአማርኛው አያያዥ «ም» ከቀደመው ንግግር ጋር ያገናኘዋል፤ በቁ. 10–11 ያለው ትይዩ ድግግሞሽም የተከታታዩን ተግባር ይጠብቃል።
- source_word: ὅτι
  choice: ስለማያምኑ ነው
  rationale: ὅτι ከ«ስለ ኃጢአት» በኋላ ምክንያትን ወይም ማብራሪያውን ያቀርባል። «…ስለሆነ ነው» የሚለው አወቃቀር ይህን ኃይል በዘመናዊ አማርኛ ግልጽ ያደርጋል።
- source_word: οὐ πιστεύουσιν
  choice: አያምኑም
  rationale: የአሁን ጊዜ አመልካች ግስ የአለማመናቸውን ቀጣይ እውነታ ይገልጣል፤ «ማመን» ተፈጥሯዊና መደበኛ ትርጉም ነው።
- source_word: εἰς ἐμέ
  choice: በእኔ
  rationale: ከ«ማመን» ጋር «በእኔ» የሚለው በአማርኛ ለኢየሱስ የተመራውን ግላዊ እምነትና መታመን በተፈጥሯዊ ሁኔታ ይገልጣል።
theological_decisions:
- issue: በቁጥሩ የተገለጠው የኃጢአት ባሕርይ
  choice: በዚህ ዐውድ በኢየሱስ አለማመን የኃጢአት ወሳኝ መገለጫ ወይም በተለይ የተጠቀሰው ኃጢአት መሆኑን ጽሑፉ ያሳያል።
  alternative: ቁጥሩ በአጠቃላይ የሰውን ኃጢአተኝነት ይጠቅሳል፤ አለማመንም አንድ ምሳሌ ነው።
  rationale: በὅτι የተዋወቀው ሐረግ «ስለ ኃጢአት» የሚለውን በቀጥታ ያብራራዋል። ትርጉሙ ይህን ግንኙነት ይጠብቃል፤ ጽሑፉ ያልገለጸውን ሰፊ የአስተምህሮ ድምዳሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ስለ … ም» የሚለው አወቃቀር ከቁ. 10–11 ጋር ያለውን ትይዩነት ለመጠበቅ ያስችላል።
