base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: am
  text: ይህን ሁሉ ተናግሬአችኋለሁ፤ በእኔ ሰላም እንዲኖራችሁ ነው። በዓለም መከራ[a] አለባችሁ፤ ነገር ግን አይዟችሁ[b]፤ እኔ ዓለምን ድል ነሥቻለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መከራ” የሚለው “ችግር፣” “ስቃይ” ወይም “ጭንቀት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ልባችሁ ይጽና።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ይህን ሁሉ
  rationale: የብዙ ቁጥሩን አመልካች ቃል በተፈጥሯዊ አማርኛ ይገልጣል፤ ኢየሱስ ቀደም ሲል የተናገረውን ንግግር በአጠቃላይ ያመለክታል።
- source_word: λελάληκα
  choice: የተናገርኋችሁ
  rationale: የተጠናቀቀውን ንግግርና አሁንም ያለውን ጠቀሜታ በአማርኛ ተፈጥሯዊ በሆነ አገባብ ያሳያል።
- source_word: ἵνα
  choice: እንዲኖራችሁ
  rationale: የንግግሩን ዓላማ ግልጽ በሆነ የዓላማ አገባብ ያቀርባል።
- source_word: ἐν ἐμοὶ
  choice: በእኔ
  rationale: በዮሐንስ ወንጌል ያለውን ከኢየሱስ ጋር የመኖር ትርጉም ሳያጠብ ወይም ሳይተረጉም የመስተዋድዱን አገላለጽ ይጠብቃል።
- source_word: εἰρήνην
  choice: ሰላም
  rationale: የመረጋጋትን፣ የደኅንነትንና ከኢየሱስ ጋር ያለውን የተሟላ ደኅንነት የሚያካትት መደበኛና ግልጽ አቻ ነው።
- source_word: ἐν τῷ κόσμῳ
  choice: በዓለም
  rationale: የዮሐንስን ተደጋጋሚ አገላለጽ ይጠብቃል፤ ‘ይህ የወደቀ ዓለም’ የሚል ትርጓሜያዊ ጭማሪ አያደርግም።
- source_word: θλῖψιν
  choice: መከራ
  rationale: ጫናን፣ ስቃይንና ጭንቀትን የሚያመለክተውን ከባድ ትርጉም በዘመናዊና በሚገባ በሚታወቅ አማርኛ ያስተላልፋል።
- source_word: θαρσεῖτε
  choice: አይዟችሁ
  rationale: በመከራ ፊት እንዲበረቱ የሚሰጠውን ትእዛዝ ተፈጥሯዊ፣ አጽናኝና የተከበረ በሆነ የአማርኛ አገላለጽ ያቀርባል።
- source_word: νενίκηκα
  choice: ድል ነሥቻለሁ
  rationale: የተፈጸመውንና ውጤቱ የሚቀጥለውን ድል ያሳያል፤ በትረካው ውስጥ ከመስቀሉ በፊት የተነገረውን የተረጋገጠ ድል ይጠብቃል።
theological_decisions:
- issue: በዮሐንስ አገባብ κόσμος ያለው ስፋት
  choice: ሁለቱም ጊዜ ‘ዓለም’ ተብሎ ተተርጉሟል።
  alternative: ‘የዓለም ሥርዓት’ ወይም ‘ይህ የወደቀ ዓለም’
  rationale: ‘በእኔ’ ካለው ሰላም ጋር ‘በዓለም’ ያለውን መከራ ያነጻጽራል፤ ኢየሱስም ‘ዓለምን’ ድል እንደነሣ ይናገራል። ቃሉን በቀጥታ ማቆየት የዮሐንስን ሰፊና ብዙ ገጽታ ያለው አጠቃቀም ሳያጠብ ይጠብቃል።
- issue: የግሪኩ ፍጹም ጊዜ ግሶች ኃይል
  choice: የተጠናቀቀ ድርጊትንና ቀጣይ ውጤቱን የሚያሳይ የአማርኛ አገላለጽ ተመርጧል።
  alternative: ቀላል ያለፈ ጊዜ፦ ‘ተናገርሁ’፣ ‘ድል ነሣሁ’
  rationale: λελάληκα እና νενίκηκα የተፈጸሙት ድርጊቶች አሁንም ጠቀሜታና ውጤት እንዳላቸው ያመለክታሉ፤ በተለይ ኢየሱስ በትረካው ውስጥ ከመስቀሉ በፊት ድሉን የተፈጸመ አድርጎ መናገሩ መጠበቅ አለበት።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይህን ሁሉ’ የግሪኩን ብዙ ቁጥር በተፈጥሯዊ አማርኛ ያሳያል፤ ‘አይዟችሁ’ ደግሞ የትእዛዙን አጽናኝ ኃይል ይይዛል። በቀረበው የእንግሊዝኛ የማማከሪያ ጽሑፍ ውስጥ የግርጌ ማስታወሻዎቹ ምልክቶች ከሚያብራሯቸው ቃላት ጋር ተቀያይረው የተቀመጡ ስለሚመስሉ፣ እዚህ [a] ከ‘መከራ’ በኋላ፣ [b] ከ‘አይዟችሁ’ በኋላ በምንጩ መሠረት ተቀምጠዋል።
