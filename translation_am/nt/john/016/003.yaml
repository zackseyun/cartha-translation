  text: እነዚህንም ነገሮች አብንም ሆነ እኔን ስላላወቁ ያደርጉታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አብንም ሆነ እኔን ስለማያውቁ»፤ ወይም፣ «አብንም ሆነ እኔን ስላልተዋወቁ»። የግሪኩ ግስ በዚህ ስፍራ በእነዚህ ወይም ተመሳሳይ ተፈጥሯዊ አገላለጾች ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ከቀደመው ንግግር ጋር ያለውን ቀላል አያያዥነት በተፈጥሯዊ የአማርኛ አነጋገር ያሳያል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥርና ወደ ቀደሙት የጥላቻ ድርጊቶች የሚመለሰውን ማመልከቻ ይጠብቃል።
- source_word: ποιήσουσιν
  choice: የሚያደርጉት
  rationale: የወደፊት ድርጊትን በምክንያት ዓረፍተ ነገር ውስጥ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὅτι
  choice: ስላላወቁ ነው
  rationale: ὅτι የድርጊቶቹን ምክንያት ስለሚያስገባ፣ የምክንያት ግንኙነቱን ግልጽ ያደርጋል።
- source_word: οὐκ ἔγνωσαν
  choice: ስላላወቁ
  rationale: የአኦሪስት ግሱን በቀላል ያለፈ ጊዜ ይገልጣል፤ ዐውዱ ደግሞ የግንኙነት ዕውቀትን እንጂ ተራ መረጃን አያመለክትም።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: በዮሐንስ አጠቃቀም ይህ ለእግዚአብሔር የሚውል የግንኙነት መጠሪያ ነው፤ «አብ» በአማርኛ የመጽሐፍ ቅዱስ ንባብ የተለመደና ክቡር ነው።
- source_word: οὐδὲ ἐμέ
  choice: አብንም ሆነ እኔን
  rationale: የοὐδέን ‘አንዱንም ሌላውንም አይደለም’ የሚለውን አሉታዊ ማስተባበር በተፈጥሯዊ አማርኛ ይጠብቃል።
