  naturalness: The wording is clear and dignified modern standard Amharic. Recasting the sentence with ያደርጉታል makes the future action explicit while remaining natural.
  terminology: አብ is an established reverential biblical designation here, and አብንም ሆነ እኔን naturally expresses the scope of the negation without adding theological interpretation.
