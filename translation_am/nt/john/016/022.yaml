source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: am
  text: እናንተም እንዲሁ አሁን ሐዘን አለባችሁ፤ ነገር ግን እንደገና አያችኋለሁ[a]፣ ልባችሁም ደስ ይላል፤ ደስታችሁንም ማንም ከእናንተ አይወስድም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደገና ታዩኛላችሁ።” ግሪኩ ቃል በቃል፣ “እኔ እንደገና አያችኋለሁ” ይላል፤ ይህም ኢየሱስ ወደ ደቀ መዛሙርቱ በመመለሱ የሚወስደውን ተነሳሽነት ሊያጎላ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: እንዲሁ
  rationale: ከቀደመው የወሊድ ምሳሌ ጋር ያለውን የድምዳሜና የተግባራዊ አያያዝ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: νῦν μὲν λύπην ἔχετε
  choice: አሁን ሐዘን አለባችሁ
  rationale: λύπη የሚገልጸውን ሐዘንና የልብ ጭንቀት ይጠብቃል፤ μέν የሚያዘጋጀው ንጽጽር በቀጣዩ ‘ነገር ግን’ ተወክሏል።
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: ነገር ግን ደግሜ አያችኋለሁ
  rationale: δέ አሁን ካለው ሐዘን ጋር ያለውን ንጽጽር ያሳያል፤ ὄψομαι የመጀመሪያ መደብ ባለቤትና ὑμᾶς ተሳቢ መሆናቸውን በግልጽ ይጠብቃል።
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: ልባችሁም ደስ ይለዋል
  rationale: የ‘ልብ’ን ምስልና χαρήσεται ያለውን የደስታ ግስ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τὴν χαρὰν ὑμῶν
  choice: ደስታችሁን
  rationale: ከχαρήσεται ጋር ያለውን የቃል ትስስር ይጠብቃል።
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: ማንም ከእናንተ አይወስድም
  rationale: αἴρει በግሪኩ የአሁን ጊዜ ቢሆንም በዐውዱ ቀጣይ የማይቀለበስ እውነትን ይገልጻል፤ የአማርኛው አሉታዊ ያልተፈጸመ ግስ ይህን ከወደፊቱ አቅጣጫ ጋር ተፈጥሯዊ አድርጎ ያስተላልፋል።
theological_decisions:
- issue: የወደፊቱ ዳግም መገናኘት ባለቤትና አጽንዖት
  choice: ደግሜ አያችኋለሁ
  alternative: እንደገና ታዩኛላችሁ
  rationale: ግሪኩ ኢየሱስን ባለቤት፣ ደቀ መዛሙርቱንም ተሳቢ አድርጎ ያቀርባል። ይህን መጠበቅ ከአቅራቢያው አገላለጽ ጋር ከማስማማት ይልቅ የኢየሱስን ተነሳሽነት የሚያሳየውን ረቂቅ አጽንዖት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሐዘን’፣ ‘ልብ’ እና ‘ደስታ’ የጥቅሱን ስሜታዊና ሥነ ጽሑፋዊ ትስስር ይጠብቃሉ።
