review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the first-person subject of ὄψομαι ὑμᾶς (‘I will see you’) and the contrast between present sorrow and coming joy. However, ደግሜ means ‘having repeated’/‘I repeated,’ not ‘again’; it must be replaced with እንደገና. The final Amharic imperfect negative naturally expresses the Greek present in its future-oriented context.
  naturalness: 'ልባችሁም ደስ ይለዋል is nonstandard in agreement: ልብ is singular, so the natural form is ልባችሁም ደስ ይላል. The revised wording is clear, modern, and appropriately dignified.'
  terminology: ሐዘን, ልብ, and ደስታ faithfully convey the emotional vocabulary and preserve the association between χαρήσεται and χαρά. No doctrinal interpretation is introduced.
  issues:
  - severity: high
    issue: ‘ደግሜ’ is used for πάλιν (‘again’).
    rationale: ደግሜ does not function as the adverb ‘again’ in this sentence and distorts the intended sense. እንደገና is the natural modern Amharic equivalent.
  - severity: medium
    issue: Verb agreement in ‘ልባችሁም ደስ ይለዋል.’
    rationale: The possessed noun ልባችሁ is grammatically singular; the idiomatic verb form is ደስ ይላል.
  revised_text: እናንተም እንዲሁ አሁን ሐዘን አለባችሁ፤ ነገር ግን እንደገና አያችኋለሁ[a]፣ ልባችሁም ደስ ይላል፤ ደስታችሁንም ማንም ከእናንተ አይወስድም።
