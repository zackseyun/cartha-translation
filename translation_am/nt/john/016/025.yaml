base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: am
  text: እነዚህን ነገሮች በምሳሌያዊ አነጋገር[a] ተናግሬአችኋለሁ። በምሳሌያዊ አነጋገር ዳግመኛ የማልናገራችሁ፣ ነገር ግን ስለ አብ በግልጽ[c] የምነግራችሁ ሰዓት[b] ይመጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምሳሌዎች” ወይም “በተሸፈኑ አባባሎች።” የግሪኩ ቃል እዚህ ምሳሌያዊ ወይም ቀጥተኛ ያልሆነ ንግግርን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ጊዜ ይመጣል።” ዮሐንስ “ሰዓት” የሚለውን ቃል ብዙ ጊዜ ልዩ ሥነ መለኮታዊ ፋይዳ ባለው መንገድ ይጠቀምበታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በገሃድ” ወይም “ያለ ማወላወል።” እዚህ ሐሳቡ ቀጥተኛና ምሳሌያዊ ያልሆነ ንግግር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: በምሳሌያዊ አነጋገር
  rationale: በዮሐንስ ወንጌል ያለውን የምሳሌያዊ ወይም ቀጥተኛ ያልሆነ ንግግር ሐሳብ ያስተላልፋል፤ ‘ምሳሌ’ ብቻ በማለት ከሌሎቹ ወንጌላት ቴክኒካዊ የምሳሌ ትረካ ጋር እንዳይወሰን ያደርጋል።
- source_word: λελάληκα
  choice: ተናግሬአችኋለሁ
  rationale: የግሪኩን ፍጹም ጊዜ፣ ማለትም ቀደም ብሎ የተደረገና አሁንም ጠቀሜታ ያለውን ንግግር፣ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔρχεται ὥρα
  choice: ሰዓት ይመጣል
  rationale: ‘ሰዓት’ የዮሐንስን ልዩ አገላለጽና ሥነ መለኮታዊ ድምፅ ይጠብቃል፤ የግሪኩ ስም ያለ መስተዋድድ ስለሆነ የተወሰነውን ‘ሰዓቱ’ አይልም።
- source_word: οὐκέτι
  choice: ከእንግዲህ … የማልናገራችሁ
  rationale: ወደፊት ያለውን ‘ከዚያ በኋላ አይደለም’ የሚል ተቃርኖ ተፈጥሯዊ በሆነ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: λαλήσω
  choice: የማልናገራችሁ
  rationale: ከλελάληκα ጋር ያለውን የቃል ግንኙነት ለመጠበቅ ‘መናገር’ ተመርጧል።
- source_word: παρρησίᾳ
  choice: በግልጽ
  rationale: ከምሳሌያዊ አነጋገር ጋር ባለው ተቃርኖ ዋናው ሐሳብ ድፍረት ሳይሆን ግልጽና ቀጥተኛ መናገር ነው።
- source_word: ἀπαγγελῶ
  choice: የምነግራችሁ
  rationale: ኢየሱስ ስለ አብ በቀጥታ መግለጡን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከλαλέω ያለውን ቀላል የቃል ልዩነትም ያሳያል።
- source_word: περὶ τοῦ πατρὸς
  choice: ስለ አብ
  rationale: የግሪኩን ‘ስለ/በተመለከተ’ ትርጉም በአጭርና በተለመደ አማርኛ ይገልጣል፤ ‘አብ’ ደግሞ የዮሐንስን ሥነ መለኮታዊ መጠሪያ ይጠብቃል።
