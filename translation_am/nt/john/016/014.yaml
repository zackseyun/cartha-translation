  text: እርሱ እኔን ያከብራል፤ ምክንያቱም ከእኔ ከሆነው ይወስዳል[a]፣ ለእናንተም ያሳውቃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእኔ ከሆነው ይቀበላል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: እርሱ
  rationale: በቅርብ ዐውድ ወደ መንፈስ ይመለሳል፤ የግል ተውላጠ ስም በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን አጽንዖትም በቂ ሁኔታ ያሳያል።
- source_word: ἐμὲ δοξάσει
  choice: እኔን ያከብረኛል
  rationale: ‘ያከብረኛል’ በዮሐንስ አጠቃቀም የኢየሱስን ክብር ማሳየትን ይገልጣል፤ ከተራ ሰብዓዊ አክብሮት በላይ ያለውን ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: እዚህ ላይ መንፈስ ኢየሱስን የሚያከብርበትን ምክንያት ያስገባል።
- source_word: ἐκ τοῦ ἐμοῦ
  choice: ከእኔ ከሆነው
  rationale: በቃል በቃል ‘ከእኔ ከሆነው’ የሚለውን ሰፊ ትርጉም ይጠብቃል፤ ይህን ትምህርት፣ ሥልጣን ወይም ራእይ ብሎ አያጠብበውም።
- source_word: λήμψεται
  choice: ይወስዳል
  rationale: λαμβάνω እንደ ዐውዱ ‘መውሰድ’ ወይም ‘መቀበል’ ሊሆን ይችላል፤ ‘ከእኔ ከሆነው’ ከሚለው ሐረግ ጋር ‘ይወስዳል’ ተፈጥሯዊ ነው፣ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀναγγελεῖ ὑμῖν
  choice: ለእናንተም ያሳውቃል
  rationale: ἀναγγέλλω ማሳወቅን ወይም መግለጽን ያመለክታል፤ ‘ያሳውቃል’ ግልጽና ወቅታዊ አማርኛ ነው። ‘ለእናንተ’ የሁለተኛ መደብ ብዙ ቁጥርን በግልጽ ያሳያል።
theological_decisions:
- issue: በ‘ἐκ τοῦ ἐμοῦ λήμψεται’ ውስጥ የመንፈስ ከኢየሱስ ጋር ያለው ግንኙነት
  choice: ከእኔ ከሆነው ይወስዳል
  alternative: ከእኔ ይቀበላል / የእኔ ከሆነው ይቀበላል
  rationale: ሐረጉ መንፈስ የወልድ የሆነውን እንደሚያሳውቅ የሚገልጸውን ሰፊ የዮሐንስ ሐሳብ ይጠብቃል፤ ጥቅሱን ወደ ኋላ በተቀረጸ ቴክኒካዊ የእምነት ቀመር አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የወደፊት ጊዜ ግሶችና የምክንያት ግንኙነት ተጠብቀዋል።
