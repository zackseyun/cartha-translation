  rationale: ቃሉ ከምኩራብ ማኅበረሰብ ማስወጣትን ወይም ማግለልን ያመለክታል። ይህ አተረጓጎም የποιέωን አስደራጊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ብዙ ቁጥሩንም በ«ምኩራቦች» ይጠብቃል።
