base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: am
  text: በዚያ ቀን በስሜ ትለምናላችሁ፤ እኔም ስለ እናንተ አብን እለምነዋለሁ ብዬ አልላችሁም[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ስለ እናንተ» የሚለው «እናንተን በተመለከተ» ወይም «ለእናንተ፣ በእናንተ ፈንታ» ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው በዚህ ቁጥር ሁለት የተለያዩ «መለመን» የሚሉ ግሦች ተጠቅመዋል፤ ለደቀ መዛሙርቱ αἰτέω፣ ኢየሱስ አብን ስለሚለምንበት ደግሞ ἐρωτάω ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያ ቀን
  rationale: ጊዜን የሚያመለክተውን ሐረግና የሩቅ አመልካቹን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῷ ὀνόματί μου
  choice: በስሜ
  rationale: ከኢየሱስ ማንነትና ሥልጣን ጋር ተያይዞ መለመንን የሚገልጠውን የዮሐንስ አገላለጽ ያለ ትርጓሜያዊ ማስፋፋት ይጠብቃል።
- source_word: αἰτήσεσθε
  choice: ትለምናላችሁ
  rationale: የወደፊት ጊዜና የሁለተኛ መደብ ብዙ ቁጥርን ይጠብቃል፤ በጸሎት አውድም ተፈጥሯዊ ነው።
- source_word: οὐ λέγω ὑμῖν ὅτι
  choice: እያልኋችሁ አይደለም
  rationale: ὅτι የንግግሩን ይዘት እንደሚያስገባ በተፈጥሯዊ የአማርኛ ቀጥተኛ አገባብ ያቀርባል፤ ኢየሱስ እዚህ የማይናገረውን እንጂ ፈጽሞ የማያደርገውን አያሰፋም።
- source_word: ἐρωτήσω
  choice: እለምነዋለሁ
  rationale: ከአብ የሚቀርብ ጥያቄን በክብር የሚገልጽ ተፈጥሯዊ ቃል ነው፤ ከαἰτέω ጋር ያለው የግስ ልዩነት በማስታወሻ ተጠብቋል።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: ግሪኩ ግልጽ የባለቤትነት ተውላጠ ስም ስለሌለው፣ «አብን» ቀጥተኛውንና በዮሐንስ የተለመደውን መለኮታዊ መጠሪያ ይጠብቃል።
- source_word: περὶ ὑμῶν
  choice: ስለ እናንተ
  rationale: «እናንተን በተመለከተ» እና «ስለ እናንተ ጥቅም» የሚሉትን አጋጣሚዎች ሳይዘጋ ቀላልና ቀጥተኛ ነው።
theological_decisions:
- issue: ኢየሱስ ወደፊት ምንም የምልጃ ሚና እንደሌለው ይክዳል ወይስ በዚህ አውድ የደቀ መዛሙርቱን ወደ አብ መቅረብ በእርሱ ልመና ላይ እንደተመሠረተ አይገልጽም?
  choice: ንባቡ ኢየሱስ እዚህ እንዲህ እያላቸው እንዳልሆነ ብቻ ይገልጻል፤ ምልጃውን ሁሉ እንደካደ አያስተረጉም።
  alternative: ኢየሱስ ለእነርሱ ፈጽሞ እንደማይማልድ ወይም ከማንኛውም አማላጅነት ውጭ ቀጥተኛ መዳረሻ ብቻ እንዳላቸው በግልጽ ማስፋፋት።
  rationale: የቅርብ አውዱ በኢየሱስ ስም ከአብ መለመንን ያጎላል፤ ሌሎች የአዲስ ኪዳን ክፍሎች ግን ስለ ኢየሱስ ምልጃና ጥብቅና ይናገራሉ። ስለዚህ ትርጉሙ ውጥረቱን አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። «እያልኋችሁ አይደለም» የግሪኩን የንግግር ይዘት በተፈጥሯዊ አገባብ ያሳያል። በእንግሊዝኛው ማስታወሻ a የቀረበው “On/In that day” ልዩነት በአማርኛ «በዚያ ቀን» ውስጥ አይኖርም፣ ስለዚህ አልተደገመም።
