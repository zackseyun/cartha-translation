  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: am
  text: 'እውነት እውነት እላችኋለሁ፤ እናንተ ታለቅሳላችሁ ዋይ ዋይም ትላላችሁ፤ ዓለም ግን ደስ ይለዋል። እናንተ ታዝናላችሁ፤ ነገር ግን ሐዘናችሁ ወደ ደስታ ይለወጣል።[a]


    [a] ወይም፦ “ሐዘናችሁ ደስታ ይሆናል።”'
  philosophy: optimal-equivalence
  footnotes:
