  rationale: በቁጥሩ ውስጥ ἐν παρρησίᾳ በቀጥታ ከπαροιμίαν οὐδεμίαν ጋር ስለሚነጻጸር፣ ዋናው ሐሳብ የአነጋገር ግልጽነት ነው። የቃሉ ሌሎች ትርጉሞች በማስታወሻ ተጠብቀዋል።
