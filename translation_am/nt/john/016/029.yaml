    issue: Footnote a includes an imprecise alternative
    rationale: በነጻነት normally means ‘in freedom,’ and ያለ ማወላወል emphasizes lack of hesitation. Neither is the best lexical alternative for παρρησίᾳ in its contrast with figurative speech.
  - severity: medium
