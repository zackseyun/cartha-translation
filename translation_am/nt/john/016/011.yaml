lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: ስለ ፍርድም
  rationale: περί ከዝርያ ቅጽ ጋር የንግግሩን ርዕስ ‘ስለ’ ብሎ ያስተዋውቃል፤ δέ በአማርኛው ተያያዥ ‘-ም’ ተገልጿል። κρίσις በአውዱ ውስጥ ‘ፍርድ’ ተብሎ ቀጥተኛና ተፈጥሯዊ ሆኖ ይተረጎማል።
- source_word: ὅτι
  choice: -ና
  rationale: ὅτι እዚህ ምክንያትን ያሳያል፤ በተፈጥሯዊ አማርኛ በግሱ ላይ የተጨመረው ‘-ና’ ‘ምክንያቱም/ስለሆነ’ የሚለውን ኃይል ይይዛል።
- source_word: ὁ ἄρχων
  choice: ገዥ
  rationale: ἄρχων ሥልጣን ያለውንና የሚገዛውን ያመለክታል። ‘ገዥ’ በዘመናዊ አማርኛ ግልጽ ሲሆን ‘ልዑል’ ሊያመጣ የሚችለውን የንጉሥ ልጅነት ትርጉም አያስገባም።
- source_word: τοῦ κόσμου τούτου
  choice: የዚህ ዓለም
  rationale: κόσμος በዮሐንስ አጠቃቀም በመደበኛነት ‘ዓለም’ ተብሎ ይተረጎማል፤ የግሪኩን የጠቋሚ አገላለጽም ‘ይህ’ በማለት ይጠብቃል።
- source_word: κέκριται
  choice: ተፈርዶበታል
  rationale: ይህ የκρίνω ፍጹም ጊዜ ተደራጊ አመልካች ቅጽ ነው። ‘ተፈርዶበታል’ ተደራጊነቱንና ቀድሞ የተፈጸመው ፍርድ ውጤቱ እንደሚቀጥል የሚያሳየውን ፍጹም ጊዜ ኃይል ይጠብቃል፤ ‘ተወግዟል’ ከሚለው ይልቅ የቃሉን ስፋት አያጠብም።
theological_decisions:
- issue: የ‘ዚህ ዓለም ገዥ’ ማንነትና የአገላለጹ ኃይል
  choice: በዋናው ጽሑፍ ሰይጣን ብሎ ሳይሰይም የግሪኩን ማዕረግ ‘የዚህ ዓለም ገዥ’ ብሎ ማቆየት
  alternative: ‘የዚህ ዓለም ገዥ የሆነው ሰይጣን’ ብሎ በትርጓሜ መግለጽ
  rationale: በዮሐንስ 12፥31 እና 14፥30 አውድ ሐረጉ ሰይጣንን እንደሚያመለክት በሰፊው ይገባል፤ ነገር ግን ይህ ቁጥር ራሱ የግል ስሙን ሳይጠቀም ማዕረጉን ይጠቀማል። ስለዚህ ዋናው ጽሑፍ ያለውን የአገላለጽ ውጥረት ይጠብቃል፤ መለያው በማስታወሻ ይገለጣል።
- issue: የκέκριται ትርጉም
  choice: ‘ተፈርዶበታል’ ብሎ መተርጎም
  alternative: ‘ተወግዟል’ ወይም ‘በውግዘት ሥር ነው’ ብሎ መተርጎም
  rationale: κρίνω ፍርድን ያመለክታል፤ በአውዱ የውግዘት ውጤት ቢጠቆምም፣ ‘ተፈርዶበታል’ የግሪኩን የቃል ወሰን ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ስለ ፍርድም’ ከቀደሙት የኃጢአትና የጽድቅ ሐረጎች ጋር ያለውን ትይዩነት ይጠብቃል፤ የምክንያት አንቀጹም በተፈጥሯዊው ‘-ና’ ተገልጿል።
