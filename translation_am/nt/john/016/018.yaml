  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: am
  text: ስለዚህ እነርሱ፣ “እርሱ ‘ጥቂት ጊዜ’ የሚለው ይህ ምንድን ነው? ምን እንደሚናገር አናውቅም” እያሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ይባባሉ ነበር
  rationale: ያልተጠናቀቀውን የኢምፐርፌክት ገጽታ እና ደቀ መዛሙርቱ እርስ በርሳቸው ይነጋገሩ እንደነበር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር ጋር ያለውን የውጤትና የቀጣይነት ግንኙነት ያሳያል።
- source_word: Τί ἐστιν τοῦτο
  choice: ይህ … ምንድን ነው?
  rationale: ጥያቄውን በቀጥታ በመጠበቅ የተናጋሪዎቹን ግራ መጋባት ያሳያል።
- source_word: ὃ λέγει μικρόν
  choice: ‘ጥቂት ጊዜ’ የሚለው
  rationale: μικρόνን እንደተጠቀሰ ሐረግ ጎልቶ ያቀርባል፤ የግሪኩን አወቃቀር ቃል በቃል ሳይከተል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μικρόν
  choice: ጥቂት ጊዜ
  rationale: በዚህ ዐውድ አጭር የጊዜ ርዝመትን የሚያመለክተውን ኤሊፕቲካዊ አጠቃቀም በግልጽ አማርኛ ያስተላልፋል።
- source_word: οὐκ οἴδαμεν
  choice: አናውቅም
  rationale: የአሁን ጊዜ ፍቺ ያለውን አሉታዊ ግስ በቀጥታና በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: τί λαλεῖ
  choice: ምን እንደሚናገር
  rationale: λαλεῖን በቀጥታ ይወክላል፤ ‘ምን ማለቱ ነው’ ብሎ ትርጉሙን ከሚተረጉመው አማራጭ ይልቅ የግሪኩን አሻሚነት ይጠብቃል።
