id: JHN.16.12
reference: John 16:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: am
  text: ገና የምነግራችሁ ብዙ ነገር አለኝ፤ አሁን ግን ልትሸከሙት[a] አትችሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አሁን ልትቋቋሙት አትችሉም።» የግሪኩ ግስ መሸከምን፣ መታገሥን ወይም መቋቋምን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: ገና
  rationale: በዚህ ዐውደ ንባብ ኢየሱስ የሚናገረው ተጨማሪ ነገር እንዳለው ያመለክታል፤ «ገና» ይህን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πολλὰ
  choice: ብዙ ነገር
  rationale: ገለልተኛው ብዙ ቁጥር ቅጽ በስም ተግባር ስለዋለ፣ «ብዙ ነገር» የተሰወረውን ነገር በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ἔχω ὑμῖν λέγειν
  choice: የምነግራችሁ … አለኝ
  rationale: የግሪኩን «የምላችሁ ነገር አለኝ» ፍቺ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል፤ «መንገር» ለተቀባዮቹ የሚተላለፍ ንግግርን ያሳያል።
- source_word: ἀλλ’
  choice: ግን
  rationale: የንፅፅር ግንኙነቱን በአማርኛ ተፈጥሯዊ ቦታ ላይ የሚያሳይ መስተዋድድ ነው።
- source_word: οὐ δύνασθε
  choice: አትችሉም
  rationale: የችሎታ እጥረትን በቀጥታና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: βαστάζειν
  choice: ልትሸከሙት
  rationale: የግሪኩን መሸከም፣ መቻል ወይም መቋቋም የሚያካትት ምሳሌያዊ ክብደት ይጠብቃል፤ ፍቺውን «መረዳት» ብቻ ወይም «መታገሥ» ብቻ ብሎ አይወስነውም። ነጠላው «-ት» ብዙዎቹን የሚነገሩ ነገሮች እንደ አንድ የትምህርት ይዘት በተፈጥሯዊ አማርኛ ይመለከታል።
- source_word: ἄρτι
  choice: አሁን
  rationale: አሁን ያለውን የደቀ መዛሙርቱን ሁኔታ ከቀጣዩ ጊዜ ጋር በግልጽ ያነፃፅራል።
theological_decisions:
- issue: βαστάζειν የደቀ መዛሙርቱን የአሁኑን አለመቻል እንዴት እንደሚገልጥ
  choice: «ልትሸከሙት» በማለት የተጨማሪውን ትምህርት ክብደት አሁን ለመቀበል ያላቸውን አለመቻል ማሳየት
  alternative: «አሁን ልትረዱት አትችሉም» ወይም «አሁን ልትታገሡት አትችሉም»
  rationale: βαστάζειν አእምሯዊ መረዳትንም ሆነ መንፈሳዊና ስሜታዊ መቋቋምን ሊያካትት ይችላል። «መሸከም» ይህን ውጥረትና የክብደት ምስል ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛን ይጠቀማል። «ልትሸከሙት» በተፈጥሯዊ አማርኛ ነጠላ ተውላጠ ስም ቢጠቀምም፣ «ብዙ ነገር»ን በአጠቃላይ ይወክላል።
