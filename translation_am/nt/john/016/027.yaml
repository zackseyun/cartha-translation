    text: ወይም፣ «ከእግዚአብሔር ዘንድ እንደመጣሁ»፤ የግሪኩ አገላለጽ ከእግዚአብሔር ፊት ወይም ከእርሱ መገኘት መምጣትንም ሊያመለክት ይችላል።
    reason: lexical_alternative
