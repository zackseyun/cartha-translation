  text: እናንተ እኔን ስለወደዳችሁና እኔ ከእግዚአብሔር ዘንድ እንደወጣሁ[a] ስላመናችሁ፣ አብ ራሱ ይወዳችኋልና።
  philosophy: optimal-equivalence
  footnotes:
