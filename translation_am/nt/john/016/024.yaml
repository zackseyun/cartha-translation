    text: “በስሜ” ማለት ከኢየሱስ ማንነት፣ ሥልጣንና ተልእኮ ጋር በተያያዘ መለመንን ሊያመለክት ይችላል፤ ትርጉሙ ይህን ወደ አንድ ማብራሪያ ሳያጠብ ቀጥተኛውን አገላለጽ ጠብቋል።
