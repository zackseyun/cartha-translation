id: JHN.16.21
reference: John 16:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: am
  text: ሴት ስትወልድ፣ ሰዓቷ ስለደረሰ ሐዘን ይሰማታል፤ ልጁን ከወለደች በኋላ ግን፣ ሰው ወደ ዓለም ስለተወለደ በሚሰማት ደስታ ምክንያት መከራዋን ከእንግዲህ አታስታውስም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνή
  choice: ሴት
  rationale: አውዱ ስለ ወሊድ የሚናገር አጠቃላይ ምሳሌ ስለሆነ፣ ‘ሴት’ ከ‘ሚስት’ ይልቅ የግሪኩን ግልጽ ሐሳብ ያስተላልፋል።
- source_word: ὅταν τίκτῃ
  choice: ልትወልድ በምትቃረብበት ጊዜ
  rationale: በአማርኛ ተፈጥሯዊ አነጋገር የወሊድን ቀጣይ ሂደትና ጊዜያዊ ሁኔታ ይገልጣል።
- source_word: λύπην ἔχει
  choice: ሐዘን ይሰማታል
  rationale: λύπη አካላዊ ሕመምን ብቻ ሳይሆን ሐዘንንና ጭንቀትን ይጨምራል፤ ይህም በአውዱ ውስጥ ሐዘን ወደ ደስታ ከመለወጡ ጋር ይስማማል።
- source_word: ἡ ὥρα αὐτῆς
  choice: ሰዓቷ
  rationale: ‘ሰዓት’ የወሊዷን የተወሰነ ጊዜ በተፈጥሯዊ ሁኔታ እያመለከተ፣ በዮሐንስ ወንጌል ያለውን የὥρα ጭብጣዊ ክብደት ይጠብቃል።
- source_word: γεννήσῃ τὸ παιδίον
  choice: ልጁን ከወለደች በኋላ
  rationale: የወሊዱን ድርጊት መጠናቀቅ በግልጽና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκέτι μνημονεύει
  choice: ከእንግዲህ አታስታውስም
  rationale: የግሪኩን ቀጥተኛ ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῆς θλίψεως
  choice: መከራዋን
  rationale: በወሊድ አውድ ውስጥ θλῖψις ከባድ ጭንቀትንና ሥቃይን ያመለክታል፤ ‘መከራ’ ይህን ስፋት ይይዛል።
- source_word: διὰ τὴν χαράν
  choice: ከሚሰማት ደስታ የተነሣ
  rationale: διά ከተሳቢ ጋር የምክንያት ግንኙነትን እንደሚገልጥ በግልጽ ያሳያል።
- source_word: ὅτι ἐγεννήθη
  choice: በመወለዱ
  rationale: ለደስታዋ መሠረት የሆነው የተፈጸመ መወለድ መሆኑን በአማርኛ ተፈጥሯዊ ቅርጽ ይገልጣል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በዚህ አውድ ἄνθρωπος ወንድን ብቻ ሳይሆን አዲስ የተወለደን የሰው ሕይወት በአጠቃላይ ያመለክታል፤ ‘ሰው’ ይህን አሻሚነት ያለ አላስፈላጊ የፆታ ምልክት ይጠብቃል።
- source_word: εἰς τὸν κόσμον
  choice: ወደ ዓለም
  rationale: ሕፃኑ የተወለደበትን ዓለም በቀጥታና በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: ἄνθρωποςን በአጠቃላይ ትርጉም መተርጎም
  choice: ሰው
  alternative: ወንድ ልጅ፣ ልጅ፣ የሰው ልጅ
  rationale: ስሙ በሰዋሰው ወንድ ቢሆንም፣ በዚህ አውድ ትርጉሙ አጠቃላይ ነው። ‘ሰው’ የግሪኩን ሰብአዊ አጽንዖት ይጠብቃል፣ ሕፃኑም ወንድ ብቻ እንደሆነ አያስመስልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅመናል። የዮሐንስን ‘ሰዓት’ ጭብጥ ለመጠበቅ ‘ሰዓቷ’ ተቀምጧል፤ ἄνθρωπος ደግሞ በአማርኛ ‘ሰው’ ተብሎ ሲተረጎም አጠቃላይ ትርጉሙ በቂ ስለሆነ የግርጌ ማስታወሻ አላስፈለገም።
