base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: am
  text: አሁን ሁሉን እንደምታውቅና ማንም እንዲጠይቅህ እንደማያስፈልግህ አውቀናል።[a] ከዚህም የተነሣ ከእግዚአብሔር እንደመጣህ እናምናለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማንም ጥያቄ እንዲያቀርብልህ።” የግሪኩ ግስ ‘መጠየቅ’ ወይም ‘ጥያቄ ማቅረብ’ ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: አሁን
  rationale: የደቀ መዛሙርቱን ወቅታዊ ግንዛቤ በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: οἴδαμεν
  choice: አውቀናል
  rationale: οἶδα የአሁን ጊዜ ትርጉም ቢኖረውም፣ በዚህ የአማርኛ ዐውድ አሁን የደረሱበትን ግንዛቤ ‘አውቀናል’ በተፈጥሯዊነት ይገልጻል።
- source_word: οἶδας πάντα
  choice: ሁሉን እንደምታውቅ
  rationale: πάντα ያለውን ሰፊና አጠቃላይ ኃይል ሳያጠብ ግልጽ ያደርጋል።
- source_word: οὐ χρείαν ἔχεις
  choice: እንደማያስፈልግህ
  rationale: ‘አያስፈልግህም’ የሚለውን ሐሳብ በዐረፍተ ነገሩ ውስጥ በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: ማንም እንዲጠይቅህ
  rationale: ἐρωτάω ‘መጠየቅ’ ወይም ‘ጥያቄ ማቅረብ’ ማለት ሊሆን ይችላል፤ ‘እንዲጠይቅህ’ ይህን ስፋት ይጠብቃል።
- source_word: ἐν τούτῳ
  choice: ከዚህም የተነሣ
  rationale: የደቀ መዛሙርቱ እምነት በቀደመው ነገር ላይ የተመሠረተ መሆኑን በግልጽ አማርኛ ያሳያል።
- source_word: πιστεύομεν
  choice: እናምናለን
  rationale: በዚህ የእምነት ኑዛዜ ዐውድ πιστεύωን በቀጥታና ተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: ἀπὸ θεοῦ
  choice: ከእግዚአብሔር
  rationale: ግሪኩ ‘ከእግዚአብሔር’ ይላል፤ ‘ከአብ’ በማለት የሌለውን ዝርዝር አይጨምርም።
- source_word: ἐξῆλθες
  choice: እንደመጣህ
  rationale: ከመለኮታዊ ምንጭና ተልእኮ ጋር በተያያዘ ἐξέρχομαιን በዘመናዊ አማርኛ ተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: ‘ሁሉን ታውቃለህ’ የሚለው ክርስቶሎጂያዊ ክብደት
  choice: የደቀ መዛሙርቱን ንግግር ያለ ትርጓሜያዊ መስፋፋት በቀጥታ ማቅረብ
  alternative: ‘ሁሉን ዐዋቂ ነህ’ ብሎ የኦምኒሳይንስ ዶክትሪንን በግልጽ መጨመር
  rationale: ጥቅሱ ስለ ኢየሱስ እውቀት የደቀ መዛሙርቱን ኑዛዜ ያቀርባል፤ ትርጉሙ የግሪኩን ሥነ መለኮታዊ ክብደት ይጠብቃል እንጂ የሌለ ማብራሪያ አይጨምርም።
- issue: ἀπὸ θεοῦ ἐξῆλθες የሚለው ሐረግ
  choice: ከእግዚአብሔር እንደመጣህ
  alternative: ከአብ እንደመጣህ
  rationale: መለኮታዊ ምንጭንና ተልእኮን በቀጥታ ያሳያል፤ በአቅራቢያው ዐውድ መሠረት ‘አብ’ ብሎ ማስማማት ግን የዚህን ጥቅስ ቃል ያልጠበቀ ጭማሪ ይሆናል።
