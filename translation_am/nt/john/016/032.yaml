base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: am
  text: እነሆ፣ ጊዜ እየመጣ ነው፤ አሁንም ደርሷል፤ እያንዳንዳችሁ ወደ የራሱ[a] ነገር የምትበተኑበትና እኔን ብቻዬን የምትተዉበት። ነገር ግን አብ ከእኔ ጋር ስለሆነ ብቻዬን አይደለሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወደ የራሱ ነገር” የሚለው “እያንዳንዱ ወደ የራሱ ቤት፣ ስፍራ ወይም ንብረት” ማለት ሊሆን ይችላል። ግሪክኛው ከአንድ የተወሰነ ስፍራ የሰፋ ትርጉም ያለው ሲሆን፣ ለእያንዳንዱ የራሱ የሆነውን በአጠቃላይ ሊያመለክት ይችላል።
