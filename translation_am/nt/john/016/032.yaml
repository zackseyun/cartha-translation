lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአድማጮችን ትኩረት የሚጠራውንና የንግግሩን ክብደት የሚያሳየውን ኃይል ይጠብቃል።
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: ጊዜ ይመጣል፤ አሁንም ደርሷል
  rationale: ወሳኙ ጊዜ በመምጣት ላይ መሆኑንና አስቀድሞ መድረሱን በአንድነት የሚያቀርበውን የግሪክኛውን ውጥረት ይጠብቃል። “ጊዜ” እዚህ የስድሳ ደቂቃ ሰዓትን ሳይሆን ወሳኝ ወቅትን ያመለክታል።
- source_word: ἵνα σκορπισθῆτε
  choice: የምትበተኑበት
  rationale: ἵνα እዚህ የጊዜውን ይዘት ያስተዋውቃል፤ ተገብሮአዊው ግስ ደቀ መዛሙርቱ ተለያይተው እንደሚበተኑ ያሳያል።
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: እያንዳንዳችሁ ወደየራሳችሁ
  rationale: የስርጭት አጽንዖቱን ይጠብቃል፤ τὰ ἴδια ቤትን፣ ስፍራን፣ ንብረትን ወይም የግል ጉዳይን ሊያመለክት ስለሚችል ትርጉሙ በግርጌ ማስታወሻ ተገልጧል።
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: እኔን ብቻዬን የምትተዉበት
  rationale: ደቀ መዛሙርቱ ኢየሱስን ብቻውን ትተው እንደሚሄዱ በተፈጥሯዊ አማርኛ ያሳያል፤ “መክዳት” ወይም “መተውና መካድ” የሚል ከጽሑፉ በላይ የሆነ ትርጉም አልተጨመረም።
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: ነገር ግን ... ብቻዬን አይደለሁም
  rationale: καί ከቀደመው ሐሳብ ጋር ያለውን ተቃርኖ በአማርኛ በግልጽ ያሳያል።
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: አብ ከእኔ ጋር ስለሆነ
  rationale: ኢየሱስ ብቻውን ያለመሆኑን ምክንያት በቀጥታ ይገልጣል፤ ὁ πατήρ የሚለው ግልጽ የዝምድና ማዕረግ “አብ” ተብሎ ተጠብቋል።
theological_decisions:
- issue: በἕκαστος ያለው የእያንዳንድነት አጽንዖት
  choice: እያንዳንዳችሁ ወደየራሳችሁ
  alternative: እያንዳንዳችሁ ወደየቤታችሁ
  rationale: በአማርኛ የሁለተኛ መደብ ብዙ ቁጥር ቅርጽ ተፈጥሯዊ ሲሆን የምንጩን የእያንዳንድነት አጽንዖት ይጠብቃል። “ቤት” ብሎ መወሰን የግሪክኛውን ስፋት ያጠባል።
- issue: ደቀ መዛሙርቱ መተዋቸውና የአብ መገኘት
  choice: ነገር ግን አብ ከእኔ ጋር ስለሆነ ብቻዬን አይደለሁም
  alternative: እኔ ግን ብቻዬን አይደለሁም፤ አብ ከእኔ ጋር ነውና
  rationale: ደቀ መዛሙርቱ በእውነት እንደሚተዉት፣ ሆኖም አብ ከእርሱ ጋር በመሆኑ ብቻውን እንዳልሆነ ያለውን የጽሑፉን ውጥረት ይጠብቃል፤ ከቁጥሩ በላይ የሆነ ዶክትሪናዊ መደምደሚያ አይጨምርም።
