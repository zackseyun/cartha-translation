review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the scattering, the disciples’ leaving Jesus, and the Father’s presence. However, the wording "ወደየራሳችሁ" is not a well-formed natural Amharic expression for εἰς τὰ ἴδια; a minimally explicit noun is needed. Reordering the first clause also better retains the Greek’s juxtaposition: the hour is coming and has already come.'
  naturalness: The register is appropriately dignified and modern. "ወደየራሳችሁ" is awkward/unidiomatic, while "ወደ የራሱ ነገር" naturally expresses a return to one’s own sphere or concerns and permits the lexical breadth to remain explained in the footnote.
  terminology: '"እነሆ," "ጊዜ," "አብ," and "ብቻዬን አይደለሁም" are suitable and theologically restrained. The rendering preserves the contrast between the disciples’ departure and the Father’s presence without adding doctrinal interpretation.'
  issues:
  - severity: medium
    issue: '"ወደየራሳችሁ" is grammatically incomplete and unnatural.'
    rationale: The possessive/genitive form requires an understood or expressed noun in this construction. The Greek τὰ ἴδια is substantivized and broad; Amharic needs a noun such as "ነገር" to convey the corresponding broad sense.
  - severity: low
    issue: The temporal announcement is split so that "አሁንም ደርሷል" follows the dependent description of the hour.
    rationale: This remains understandable, but placing "ጊዜ እየመጣ ነው፤ አሁንም ደርሷል" together more clearly preserves ἔρχεται ... καὶ ἐλήλυθεν and its deliberate present-plus-perfect tension.
  revised_text: እነሆ፣ ጊዜ እየመጣ ነው፤ አሁንም ደርሷል፤ እያንዳንዳችሁ ወደ የራሱ[a] ነገር የምትበተኑበትና እኔን ብቻዬን የምትተዉበት። ነገር ግን አብ ከእኔ ጋር ስለሆነ ብቻዬን አይደለሁም።
