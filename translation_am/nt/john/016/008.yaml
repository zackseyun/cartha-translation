  - severity: medium
    issue: Temporal wording is less idiomatic
    rationale: «በመጣ ጊዜ» is less natural in this future-oriented context than «ሲመጣ».
  - severity: medium
    issue: Footnote overstates the lexical form of ἐκεῖνος
    rationale: ἐκεῖνος is an emphatic demonstrative, but glossing it as «ያ ሰው» unnecessarily supplies «ሰው» and is not an accurate description of the Greek form.
