  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: am
  text: እርሱም ሲመጣ፣ ዓለምን ስለ ኃጢአት፣ ስለ ጽድቅና ስለ ፍርድ ይወቅሳል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «እርሱ» የግሪኩን አጽንዖታዊ ጠቋሚ ተውላጠ ስም ይወክላል፤ ቃል በቃል «ያኛው» ሊባል ይችላል። በቅርብ ዐውድ ወደሚመጣው ጰራቅሊጦስ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: «ጽድቅ» ወይም «ፍትሕ»።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθὼν
  choice: በመጣ ጊዜ
  rationale: የግሪኩ ያለፈ ጊዜ አሳታፊ ግስ እዚህ ጊዜን የሚገልጥ ነው፤ «በመጣ ጊዜ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκεῖνος
  choice: እርሱ
  rationale: አጽንዖት ያለው ጠቋሚ ተውላጠ ስም ሲሆን በቅርብ ዐውድ ወደ ጰራቅሊጦስ ይመለሳል። «እርሱ» በአማርኛ ባዶውን የግስ ተሳቢ ከመጠቀም ይልቅ አጽንዖቱን ይጠብቃል።
- source_word: ἐλέγξει
  choice: በደለኛነቱን ያሳያል
  rationale: ግሱ ስህተትን ማጋለጥ፣ በደልን ማስረዳት ወይም ተሳስቶ መገኘቱን ማሳየት የሚለውን ሥነ ምግባራዊና የፍርድ ኃይል ይይዛል። ይህ አገላለጽ ከሕጋዊ «ይፈርድበታል» ጋር ሳያመሳስለው ያንን ኃይል ያስተላልፋል።
- source_word: κόσμον
  choice: ዓለምን
  rationale: በዮሐንስ አጠቃቀም ቃሉ ብዙ ጊዜ ከእግዚአብሔር የራቀውን የሰው ዓለም ያመለክታል፤ መደበኛው ትርጉም ስፋቱንና ዐውዳዊ ውጥረቱን ይጠብቃል።
- source_word: περὶ
  choice: ስለ
  rationale: በሦስቱም ስሞች ፊት የተደገመውን መስተዋድድ በመድገም የግሪኩን ትይዩ አወቃቀር ይጠብቃል።
- source_word: ἁμαρτίας
  choice: ኃጢአት
  rationale: የἁμαρτία መደበኛ አማርኛ አቻ ሲሆን የግሪኩ ነጠላ ቁጥር ተጠብቋል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በቀጣዩ ቁጥር ከኢየሱስ ወደ አብ መሄድ ጋር ያለውን ዐውድ የሚስማማ እና የቃሉን ሥነ መለኮታዊ ስፋት የሚጠብቅ መደበኛ ትርጉም ነው።
- source_word: κρίσεως
  choice: ፍርድ
  rationale: የቃሉን ሕጋዊና መጨረሻዊ ፍርድ ኃይል ይጠብቃል፤ ውጤቱን «ኩነኔ» ብሎ አስቀድሞ አያጠብበውም።
theological_decisions:
- issue: የἐκεῖνος ማጣቀሻና አጽንዖት
  choice: በቅርብ ዐውድ ያለውን ጰራቅሊጦስን የሚያመለክት አጽንዖታዊ «እርሱ»
  alternative: ተውላጠ ስሙን ሳይገልጡ በግሱ ተሳቢ ብቻ መተርጎም
  rationale: ግሪኩ የተጠቀመው ጠቋሚ ተውላጠ ስም ግልጽ አጽንዖት አለው፤ «እርሱ» በተፈጥሯዊ አማርኛ ይህን ያቆያል።
- issue: የδικαιοσύνη ትርጉም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: «ጽድቅ» የቃሉን ሰፊ ክልልና በቁጥር 10 ያለውን ክርስቶሳዊ ዐውድ ይጠብቃል፤ «ፍትሕ» ግን የሕግና የማኅበራዊ ፍትሕን ገጽታ ሊያጎላ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሦስቱ «ስለ» ሐረጎች ድግግሞሽ የምንጩን የንግግር ትይዩነት ለመጠበቅ ተቀምጧል።
