  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አሁን ታምናላችሁ።” የግሪኩ አባባል እንደ መግለጫ ሊነበብ ይችላል፤ ሆኖም አውዱ አጽንዖታዊ ጥያቄ መሆኑን ይደግፋል።
