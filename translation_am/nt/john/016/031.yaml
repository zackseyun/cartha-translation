  verdict: revise
  source_fidelity: The core rendering faithfully conveys ἀπεκρίθη αὐτοῖς Ἰησοῦς and the interrogative reading of Ἄρτι πιστεύετε;. However, the enclitic -ም ('also/and') on ኢየሱስ and the introductory እንዲህ ሲል are not represented in the Greek and are unnecessary here.
  naturalness: መለሰላቸው and አሁን ታምናላችሁን? are natural modern standard Amharic. A direct narrative introduction without እንዲህ ሲል is equally natural and is closer to the concise source.
  terminology: ኢየሱስ is the standard Amharic form of the name. ታምናላችሁ appropriately renders the second-person plural present πιστεύετε. The footnote properly preserves the viable declarative construal without deciding theological implications.
  issues:
  - severity: low
    issue: Unnecessary connective and speech-introduction material
    rationale: ኢየሱስም includes -ም, and እንዲህ ሲል adds a 'saying thus' introduction. Neither is present in the Greek. While idiomatic in some Amharic narrative contexts, both can be omitted without loss and doing so better reflects the source's compact wording.
  revised_text: ኢየሱስ መለሰላቸው፤ “አሁን ታምናላችሁን?[a]”
