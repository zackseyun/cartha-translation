lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰላቸው
  rationale: በንግግር አውድ የተለመደና ተፈጥሯዊ የአማርኛ አተረጓጎም ሲሆን፣ የግሪኩን የትረካ አኦሪስት ያለ ተጨማሪ ፍቺ ያስተላልፋል።
- source_word: αὐτοῖς
  choice: -ላቸው
  rationale: የብዙ ቁጥር ተዘዋዋሪ ተሳቢን በተፈጥሯዊ የአማርኛ ግስ ቅጥያ ይገልጻል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውን የስሙን አጻጻፍ ይከተላል።
- source_word: Ἄρτι
  choice: አሁን
  rationale: የአሁኑን ጊዜና ፈጣን ጊዜያዊነት በአጭርና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: πιστεύετε
  choice: ታምናላችሁ
  rationale: የπιστεύωን የአሁን ጊዜ፣ ሁለተኛ መደብ ብዙ ቁጥር ቅርጽ በግልጽና በተለመደ አማርኛ ይገልጻል።
theological_decisions:
- issue: የἌρτι πιστεύετε; ንግግራዊ ኃይል
  choice: “አሁን ታምናላችሁን?” ብሎ እንደ አጽንዖታዊ ጥያቄ መተርጎም
  alternative: “አሁን ታምናላችሁ።” ብሎ እንደ መግለጫ ማንበብ
  rationale: የግሪኩ ጽሑፍ በራሱ እንደ ጥያቄም ሆነ እንደ መግለጫ ሊነበብ ይችላል፤ የሚከተለው ቁጥር ስለ ደቀ መዛሙርቱ መበተን ስለሚናገር፣ የጥያቄው ንባብ በአውዱ የሚታየውን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። “እንዲህ ሲል” የሚለው በአማርኛ ቀጥተኛ ንግግርን በተፈጥሯዊ ሁኔታ ያስገባል፤ የግሪኩን አሻሚነት የግርጌ ማስታወሻው ይጠብቃል።
