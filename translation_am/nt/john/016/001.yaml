  text: I have spoken these things to you so that you may not fall away.
translation:
  language: am
  text: እነዚህን ነገሮች እንዳትሰናከሉ[a] ነግሬአችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእምነታችሁ እንዳትወድቁ።” የግሪኩ ግስ “መሰናከልን፣” “እንዲሰናከል መደረግን፣” ወይም “ቅር መሰኘትን” ሊያመለክት ይችላል፤ በዚህ አውድ ደግሞ እምነትን እስከ መተው የሚደርስ መንፈሳዊ ውድቀትን ሊጠቁም ይችላል።
    reason: የቃሉን ምስላዊ አገላለጽና በዚህ አውድ ያለውን ከባድ ትርጉም ለማስጠበቅ።
lexical_decisions:
