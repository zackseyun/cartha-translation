- source_word: σκανδαλισθῆτε
  choice: እንዳትሰናከሉ
  rationale: የመሰናከልን ምስላዊ አገላለጽ ጠብቆ፣ በመጪው ስደት ምክንያት እምነት ሊናወጥ ወይም ሊተው የሚችልበትን ከባድ ትርጉም ክፍት ያደርጋል።
