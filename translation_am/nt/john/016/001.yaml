- source_word: λελάληκα
  choice: ነግሬአችኋለሁ
  rationale: የፍጹም ጊዜውን ቀደም ሲል ተናግሮ አሁንም ውጤቱ የሚቆይ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ የብዙ ቁጥር ተቀባዮችንም ይገልጣል።
- source_word: ἵνα μὴ
  choice: እንዳት…
