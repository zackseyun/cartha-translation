  rationale: ጥቅሱ ራሱ መነሻውንና መመለሻውን ከአብ ጋር ያያይዛል። ትርጉሙ ይህን ከፍ ያለ ክርስቶሎጂያዊ አነጋገር ይጠብቃል፤ ነገር ግን ግሪኩ ያልገለጸውን ዶክትሪናዊ ማብራሪያ አይጨምርም።
