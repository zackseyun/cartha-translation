- source_word: πάλιν
  choice: እንደገና
  rationale: የመጀመሪያውን ከአብ ወደ ዓለም የሆነ እንቅስቃሴ ከዓለም ወደ አብ ከሚሆነው ተመላሽ እንቅስቃሴ ጋር ያያይዛል።
- source_word: ἀφίημι τὸν κόσμον
  choice: ዓለምን እተዋለሁ
  rationale: በዐውደ ንባቡ ἀφίημι ከዓለም መለየትን ወይም መሄድን ያመለክታል። የአማርኛው የአሁን-ወደፊት ቅርጽ በቅርቡ የሚፈጸመውን ድርጊት ተፈጥሯዊ በሆነ መንገድ ያሳያል።
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: ወደ አብም እሄዳለሁ
  rationale: πρός የእንቅስቃሴውን አቅጣጫ ያሳያል፤ «ወደ አብ» ምንም ተጨማሪ የትርጓሜ ሐሳብ ሳያስገባ ይህን በግልጽ ያቀርባል።
theological_decisions:
