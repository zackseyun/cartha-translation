lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: ከአብ ዘንድ ወጣሁ
  rationale: የἐξέρχομαι የመውጣት እንቅስቃሴን፣ ἐκ ደግሞ ምንጭን ወይም መነሻን ያመለክታሉ። «ከአብ ዘንድ» በአማርኛ ክብር ያለውና ተፈጥሯዊ የመነሻ አገላለጽ ነው።
- source_word: ἐλήλυθα εἰς τὸν κόσμον
