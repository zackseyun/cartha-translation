  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: am
  text: ስለዚህ ከደቀ መዛሙርቱ አንዳንዶቹ እርስ በርሳቸው፣ “ለእኛ፣ ‘ከጥቂት ጊዜ በኋላ አታዩኝም፤ ደግሞም ከጥቂት ጊዜ በኋላ ታዩኛላችሁ’ የሚለው ይህ ምንድን ነው? እንዲሁም፣ ‘ወደ አብ ስለምሄድ’[a] የሚለው?” ተባባሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ አብ እንደምሄድ።” የግሪኩ አያያዥ ቃል የተጠቀሰውን የንግግር ይዘት እንደሚያስገባ ወይም ምክንያትን (“ስለ”) እንደሚያመለክት ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው የኢየሱስ ንግግር የሚነሣውን የትረካና የምክንያት ቅደም ተከተል ያሳያል።
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ አንዳንዶቹ
  rationale: ἐκ የሚያመለክተው ሁሉንም ሳይሆን ከደቀ መዛሙርቱ መካከል ከፊሎቹን ነው።
- source_word: πρὸς ἀλλήλους
  choice: እርስ በርሳቸው … ተባባሉ
  rationale: የጋራ መነጋገራቸውን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: ብሎ የሚነግረን ምንድን ነው?
  rationale: የግሪኩን የጥያቄ አወቃቀርና የደቀ መዛሙርቱን ግራ መጋባት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Μικρὸν
  choice: ጥቂት ጊዜ ከቆየ በኋላ
  rationale: በዚህ አውድ ቃሉ አጭር የጊዜ ርዝመትን ያመለክታል፤ አገላለጹም በአማርኛ የሚከተለውን ሁኔታ በግልጽ ያያይዛል።
- source_word: θεωρεῖτέ με / ὄψεσθέ με
  choice: አታዩኝም / ታዩኛላችሁ
  rationale: ሁለቱ የግሪክ ግሶች ቢለያዩም እዚህ ያለውን የእይታ ትይዩነትና ድግግሞሽ በአንድ የተለመደ የአማርኛ ግስ ይጠብቃል።
- source_word: πάλιν
  choice: ደግሞም
  rationale: የተደገመውን ሁኔታ በተፈጥሯዊና በግልጽ ሁኔታ ያመለክታል።
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: ወደ አብ ስለምሄድ ነው
  rationale: ὅτιን በምክንያታዊ ኃይሉ ይተረጉማል፤ ሐረጉ የደቀ መዛሙርቱን ጥያቄ ከቀደመው ንግግር ጋር ያያይዛል። ሌላው ሰዋሰዋዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τὸν πατέρα
  choice: አብ
  rationale: የግሪኩን ‘አብ’ ይጠብቃል፤ ‘አባቴ’ ብሎ ያልተጻፈውን አያክልም።
theological_decisions:
- issue: ኢየሱስ መሄዱና እንደገና መታየቱ የሚያመለክተው ምን እንደሆነ
  choice: ጥቅሱ የሚያቀርበው የደቀ መዛሙርቱ ጥያቄ ብቻ ስለሆነ፣ ዋቢው ሳይወሰን ተጠብቋል።
  alternative: ሞትና ትንሣኤ፤ ዕርገትና መንፈሳዊ መገኘት፤ ከትንሣኤ በኋላ መታየት
  rationale: ጥቅሱ ራሱ የደቀ መዛሙርቱን ግራ መጋባት ያሳያል እንጂ ዋቢውን አይፈታም፤ ስለዚህ ትርጉሙ አንድን ትርጓሜ አያስገድድም።
- issue: የὅτι ትርጉም
  choice: ምክንያታዊ፦ ‘ስለምሄድ ነው’
  alternative: የተጠቀሰ ይዘት፦ ‘ወደ አብ እንደምሄድ’
  rationale: ὅτι ምክንያትንም ሆነ የንግግር ይዘትን ሊያስገባ ይችላል፤ ዋናው ጽሑፍ ምክንያታዊውን ንባብ ይዟል፣ እውነተኛው አሻሚነት ግን በማስታወሻ ተጠብቋል።
