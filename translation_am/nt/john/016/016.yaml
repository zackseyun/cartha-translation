  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: am
  text: “ጥቂት ጊዜ በኋላ ከእንግዲህ አታዩኝም፤ እንደገናም ጥቂት ጊዜ በኋላ ታዩኛላችሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ በዚህ ስፍራ “ማየት” ለሚለው ሁለት የተለያዩ ግሶች ተጠቅመዋል፤ በመጀመሪያው ሐረግ θεωρέω፣ በሁለተኛው ደግሞ ὁράω ነው። ይህ የትርጉም ጥላ ልዩነት ሊጠቁም ቢችልም፣ በዚህ ቁጥር ዋናው ንፅፅር የጊዜ ስለሆነ ሁለቱም “ማየት” ተብለው ተተርጉመዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: ጥቂት ጊዜ ብቻ / ጥቂት ጊዜ ቆይቶ
  rationale: ገለልተኛ ነጠላው ቅጽ በተውሳከ ግስ አገልግሎት አጭር የጊዜ ርዝመትን ያመለክታል። በሁለተኛው ሐረግ ‘ቆይቶ’ መጨመሩ በአማርኛ የተፈጥሮ የወደፊት ቅደም ተከተልን ያሳያል።
- source_word: οὐκέτι
  choice: ከእንግዲህ ... አታዩኝም
  rationale: ከዚያ ጊዜ ጀምሮ የማየቱን መቋረጥ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: θεωρεῖτέ
  choice: አታዩኝም
  rationale: θεωρέω የማስተዋል ወይም በትኩረት የመመልከት ጥላ ትርጉም ሊኖረው ቢችልም፣ እዚህ ‘ማየት’ ግልጽና ተፈጥሯዊ ነው።
- source_word: πάλιν
  choice: ደግሞም
  rationale: ቀጥሎ የሚመጣውን የሁኔታ መመለስ ወይም ድግግሞሽ ይጠብቃል።
- source_word: ὄψεσθέ
  choice: ታዩኛላችሁ
  rationale: የὁράω የወደፊት ቅጽ ሲሆን ወደፊት ማየትን በቀጥታ ይገልጣል፤ ከθεωρεῖτε ጋር ሰው ሠራሽ የትርጉም ልዩነት አልተጫነበትም።
- source_word: με
  choice: -ኝ
  rationale: ኢየሱስን የሚያመለክተው ቀጥተኛ ተሳቢ ተውላጠ ስም በአማርኛ በግሱ ላይ በቅጥያ ተገልጧል።
- source_word: καὶ
  choice: ከዚያም / ደግሞም
  rationale: የግሪኩን ሚዛናዊ የሐረግ አወቃቀር ጠብቆ በአማርኛ ግንኙነቱንና ቅደም ተከተሉን በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: θεωρέω እና ὁράω በተለያዩ የአማርኛ ግሶች ተተርጉመው የተለያየ የማየት ዓይነት ማመልከት አለባቸውን?
  choice: ሁለቱንም ‘ማየት’ በሚለው ግስ መተርጎም
  alternative: የመጀመሪያውን ‘መመልከት’ ወይም ‘ማስተዋል’፣ ሁለተኛውን ደግሞ ‘ማየት’ ብሎ መለየት
  rationale: በዮሐንስ አጠቃቀም የሁለቱ ግሶች ትርጉም በእጅጉ ይደራረባል። ጽሑፉ በግልጽ ያልጫነውን ሥነ መለኮታዊ ልዩነት ከማስገባት ይልቅ የጊዜውን ንፅፅር ማስጠበቅ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ሚዛናዊ የጊዜ ሐረጎች ተጠብቀዋል፤ በግሶቹ መካከል ያለው ሊኖር የሚችል ጥላ ልዩነት በማስታወሻ ተገልጧል።
