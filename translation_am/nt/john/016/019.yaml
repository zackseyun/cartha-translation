  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: am
  text: ኢየሱስ ሊጠይቁት እንደፈለጉ አውቆ እንዲህ አላቸው፤ “ ‘ጥቂት ጊዜ በኋላ አታዩኝም፤ እንደገናም ጥቂት ጊዜ በኋላ ታዩኛላችሁ’ ስላልኩ፣ ስለዚህ ነገር እርስ በርሳችሁ ትወያያላችሁን?[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ስላልኩ” የሚለው “ያልኩትን በተመለከተ” ወይም “ያልኩትን ማለት ነው” ተብሎም ሊተረጎም ይችላል። የግሪኩ አገናኝ የውይይቱን ምክንያት ወይም ይዘት ሊያስገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ግሪኩ እዚህ ለ“ማየት” ሁለት የተለያዩ ግሶችን ይጠቀማል፤ በመጀመሪያ θεωρέω (መመልከት/ማስተዋል)፣ ከዚያ ὁράω (ማየት)። በዋናው ጽሑፍ የንጽጽሩን ተፈጥሯዊነት ለመጠበቅ ሁለቱም “ማየት” ተብለዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: አውቆ
  rationale: የኢየሱስን የደቀ መዛሙርቱ ፍላጎት ማወቅ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: ሊጠይቁት እንደፈለጉ
  rationale: የቀጠለውን ፍላጎት እና የግል ጥያቄን በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: ስለዚህ ነገር እርስ በርሳችሁ ትነጋገራላችሁን?
  rationale: ζητέω በዚህ አውድ ትርጉሙን በመካከላቸው ለማጣራት መወያየታቸውን ያመለክታል፤ የጥያቄውንም ቅርጽ ይጠብቃል።
- source_word: ὅτι εἶπον
  choice: ስላልኩ
  rationale: ὅτι የውይይታቸውን ምክንያት ከቀጥታው ጥቅስ ጋር በተፈጥሯዊ አማርኛ ያገናኛል፤ የይዘት አገናኝ መሆኑም በማስታወሻ ተጠቅሷል።
- source_word: Μικρὸν
  choice: ጥቂት ጊዜ ቆይቶ
  rationale: የአጭር ጊዜ ልዩነትን በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὐ θεωρεῖτέ με
  choice: አታዩኝም
  rationale: የግሪኩን አሉታዊ የአሁን ቅርጽ በቅርብ ይከተላል፤ የጊዜው መጪነት ከ‘ጥቂት ጊዜ ቆይቶ’ ይገባል።
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: ደግሞም ጥቂት ጊዜ ቆይቶ ታዩኛላችሁ
  rationale: πάλινን ‘ደግሞም’ ብሎ ያስተላልፋል፤ የὄψεσθεን የወደፊት ኃይልም በ‘ታዩኛላችሁ’ ይጠብቃል።
theological_decisions:
- issue: በθεωρέω እና ὁράω መካከል ያለው የቃላት ልዩነት
  choice: ሁለቱንም በዋናው ጽሑፍ ‘ማየት’ በሚለው ሥር መተርጎም
  alternative: የመጀመሪያውን ‘ትመለከቱኛላችሁ’፣ ሁለተኛውን ‘ታዩኛላችሁ’ ብሎ መለየት
  rationale: በዚህ አውድ ዋናው ንጽጽር ጊዜያዊ አለመታየትና ዳግመኛ መታየት ነው፤ ያልተረጋገጠ ሥነ መለኮታዊ ልዩነት እንዳይጫን የግሪኩ የቃል ልዩነት በማስታወሻ ተጠብቋል።
- issue: የὅτι ተግባር
  choice: ‘ስላልኩ’ ብሎ የምክንያት ንባብን በዋናው ጽሑፍ ማቅረብ
  alternative: ‘ያልኩትን ማለት ነው’ ወይም የይዘት አገናኝ አድርጎ መተርጎም
  rationale: የግሪኩ አገናኝ ምክንያትንም ሆነ የውይይቱን ይዘት ሊያስገባ ይችላል። የምክንያት ቅርጹ በአማርኛ ተፈጥሯዊ ሲሆን ሌላው ንባብ በማስታወሻ ተጠብቋል።
- issue: የኢየሱስ ንግግር ጥያቄ ወይስ መግለጫ መሆኑ
  choice: እውነተኛ ጥያቄ አድርጎ መተርጎም
  alternative: ‘ስለዚህ ነገር እርስ በርሳችሁ ትጠያየቃላችሁ’ የሚል መግለጫ
  rationale: የምንጩ ሥርዓተ ነጥብና የአውዱ ንግግር ኢየሱስ የደቀ መዛሙርቱን ውይይት በጥያቄ እንደገለጠ ይደግፋሉ።
