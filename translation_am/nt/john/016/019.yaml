  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ጥያቄያዊ ቅርጽና የተደጋጋሚው ‘ጥቂት ጊዜ’ አወቃቀር ተጠብቋል።
