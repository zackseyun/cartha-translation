source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: am
  text: ስለ ጽድቅም[a]፣ ወደ አብ ስለምሄድና ከእንግዲህ በኋላ ስለማታዩኝ፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ።” የግሪኩ ቃል ጽድቅንም ፍትሕንም ሊያመለክት ይችላል፤ በዚህ አውድ ግን ኢየሱስ ወደ አብ መሄዱ ማጽደቁን ከማሳየቱ ጋር ስለሚያያዝ፣ በዋናው ጽሑፍ “ጽድቅ” ተብሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: ስለ
  rationale: በቁጥር 9–11 የተደጋገመውን የዝርዝር አወቃቀር በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: ጽድቅ የቃሉን የቀናነትና ትክክለኛ መሆን ስፋት ይይዛል፤ በዚህ አውድም ኢየሱስ ወደ አብ በመሄዱ ከሚገለጠው ትክክለኛነቱ ጋር ይስማማል።
- source_word: δέ
  choice: -ም
  rationale: ኃይለኛ ተቃርኖን ሳይጨምር ወደ ቀጣዩ የዝርዝሩ ነጥብ መሸጋገሩን ያሳያል።
- source_word: ὅτι
  choice: ስለም- / ስለማ-
  rationale: የምክንያት ግንኙነቱን በተፈጥሯዊ የአማርኛ ሐረግ ያቀርባል።
- source_word: πρὸς τὸν πατέρα
  choice: ወደ አብ
  rationale: πρός ከእንቅስቃሴ ግስ ጋር ያለውን አቅጣጫ ያሳያል፤ ግሪኩም ‘ወደ አብ’ እንጂ ‘ወደ አባቴ’ አይልም።
- source_word: ὑπάγω
  choice: ስለምሄድ
  rationale: በአውዱ የቀረበውን ቅርብ የወደፊት እርምጃ በግልጽና ወቅታዊ አማርኛ ይገልጣል።
- source_word: οὐκέτι
  choice: ከእንግዲህ
  rationale: ከዚያ ጊዜ ጀምሮ ማየቱ እንደሚቋረጥ ያሳያል።
- source_word: θεωρεῖτέ με
  choice: ስለማታዩኝ
  rationale: በዚህ አውድ θεωρέω የዓይን እይታን ያመለክታል፤ ‘ማየት’ ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: በዚህ ሥነ መለኮታዊ ክብደት ባለው አውድ δικαιοσύνηን መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ የሞራል ቀናነትንና ትክክለኛ ሆኖ መገኘትን ይገልጣል፤ ኢየሱስ ወደ አብ መሄዱ ከሚያሳየው ማጽደቅ ጋር ይስማማል። ሆኖም ቃሉ የፍትሕንም ትርጉም ሊይዝ ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከቀዳሚውና ከተከታዩ ንጥሎች ጋር ያለውን የዝርዝር ቅርጽ ለማቆየት ከፊል ዓረፍተ ነገርነቱ ተጠብቋል።
