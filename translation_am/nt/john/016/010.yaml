review_pass:
  verdict: revise
  source_fidelity: The main rendering correctly retains the repeated subject matter marker, δικαιοσύνη as ጽድቅ, the movement ‘to the Father,’ and the disciples’ future loss of sight. However, ከእንግዲህ alone is less explicit than οὐκέτι (‘no longer’); adding በኋላ clearly expresses cessation from that point onward.
  naturalness: The verse fragment appropriately preserves the syntactic dependence on the preceding sentence. ከእንግዲህ በኋላ ስለማታዩኝ is natural, clear modern standard Amharic in this context.
  terminology: ጽድቅ is an appropriate primary rendering for δικαιοσύνη here. The footnote properly retains ፍትሕ as a lexical alternative. Its explanatory wording is adjusted to speak of Jesus’ vindication rather than merely his correctness.
  issues:
  - severity: low
    issue: The phrase ከእንግዲህ does not fully and explicitly convey οὐκέτι.
    rationale: While understandable in context, ከእንግዲህ በኋላ more plainly means ‘from now on/no longer,’ preserving the cessation expressed by the Greek adverb.
  - severity: low
    issue: The footnote explains the context as Jesus’ ‘correctness’ (ትክክለኛነቱ).
    rationale: The contextual sense is better stated as vindication (ማጽደቁ / ጽድቁ መገለጡ), which reflects the interpretive rationale without reducing δικαιοσύνη to simple correctness.
  revised_text: ስለ ጽድቅም[a]፣ ወደ አብ ስለምሄድና ከእንግዲህ በኋላ ስለማታዩኝ፤
