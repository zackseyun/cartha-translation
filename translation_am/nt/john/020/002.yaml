  rationale: ማርያም ብቻዋን እየተናገረች ቢሆንም የግሪኩ ጽሑፍ ብዙ ቁጥርን ይጠቀማል። ይህን ወደ ነጠላ ቁጥር መለወጥ ጽሑፉ ያልገለጸውን ታሪካዊ ጥያቄ አስቀድሞ ይፈታል፤ ስለዚህ አሻሚነቱ ተጠብቋል።
