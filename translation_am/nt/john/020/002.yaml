base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: am
  text: ስለዚህ ሮጣ ወደ ስምዖን ጴጥሮስና ኢየሱስ ይወደው ወደ ነበረው ሌላው ደቀ መዝሙር[a] መጣች፤ እንዲህም አለቻቸው፦ “ጌታን ከመቃብሩ ወስደውታል፤ የት እንዳኖሩትም አናውቅም[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ፦ “ኢየሱስ ይወደው የነበረው ሌላው ደቀ መዝሙር።” እዚህ ያለው φιλέω ፍቅርን ወይም ቅርብ ወዳጅነትን ሊያጎላ ይችላል፤ እንደ አማራጭ “ኢየሱስ ይወደው ነበር” ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ማርያም “አናውቅም” ትላለች፤ ይህም በግሪኩ ያለውን የመጀመሪያ ሰው ብዙ ቁጥር ይጠብቃል። አንዳንዶች ይህ ከእርሷ ጋር የነበሩ ሌሎች ሴቶችን እንደሚያካትት ይረዱታል፤ ጽሑፉ ግን ብዙ ቁጥሩን በዚህ ስፍራ አያብራራም።
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: ስለዚህ ሮጣ … መጥታ
  rationale: οὖν ከቀደመው ትረካ የሚከተለውን ውጤት ያሳያል፤ የግሪኩን ታሪካዊ የአሁን ጊዜ በአማርኛ ተፈጥሯዊ የትረካ ቅደም ተከተል ለማቅረብ “ሮጣ … መጥታ” ተመርጧል።
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: ወደ ስምዖን ጴጥሮስና … ወደ ሌላው ደቀ መዝሙር
  rationale: πρός ወደ ሰዎቹ የተደረገውን እንቅስቃሴ ያሳያል፤ μαθητής በወንጌላት አውድ “ደቀ መዝሙር” ተብሎ በተለመደ መንገድ ተተርጉሟል።
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: ኢየሱስ ይወደው ወደ ነበረው
  rationale: φιλέω ፍቅርንና ቅርብ ወዳጅነትን ሊያመለክት ይችላል፤ “ይወደው ነበር” የግሪኩን ያልተጠናቀቀ የኃላፊ ጊዜ ቅርጽ እና ተፈጥሯዊ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: ጌታን ከመቃብሩ አውጥተው ወስደውታል
  rationale: Ἦραν የተፈጸመው ድርጊት አሁንም ያለውን ውጤት ስለሚያሳይ “ወስደውታል” ተብሏል፤ ἐκ የመውጣትን አቅጣጫ በግልጽ ለማሳየት “አውጥተው” ተጨምሯል። μνημεῖον በዚህ አውድ የቀብር ስፍራ ስለሆነ “መቃብር” ተብሏል።
- source_word: οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν
  choice: የት እንዳኖሩትም አናውቅም
  rationale: οἴδαμεν በግልጽ የመጀመሪያ ሰው ብዙ ቁጥር ነው፤ “አናውቅም” ይህን ሳያስተካክል ይጠብቃል። τίθημι በዚህ አውድ ማኖርን ወይም ማስቀመጥን ያመለክታል።
theological_decisions:
