base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: am
  text: ኢየሱስ፣ “ማርያም!” ይላታል። እርሷም ዘወር ብላ፣ በዕብራይስጥ[a]፣ “ረቡኒ!” ትለዋለች፤ ትርጉሙም፣ “መምህር” ማለት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአራማይክ ቋንቋ።” ዮሐንስ “በዕብራይስጥ” ሲል፣ በይሁዳ ምድር ይነገር የነበረውን ሴማዊ ቋንቋ በሰፊ ትርጉም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: ይላታል / ትለዋለች
  rationale: የዮሐንስን ሕያው የትረካ አቀራረብ ለመጠበቅ ሁለቱም የታሪክ የአሁን ጊዜ ግሶች በአሁን ጊዜ ተተርጉመዋል፤ ተሳቢዎቹም በአማርኛው ግስ ውስጥ በተፈጥሮ ተካትተዋል።
- source_word: Μαριάμ
  choice: ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ንባብ የተለመደውንና በቀላሉ የሚታወቀውን የስሙን ቅርጽ ይጠቀማል።
- source_word: στραφεῖσα
  choice: ዘወር ብላ
  rationale: የአኦሪስት አሳታፊውን ቀዳሚ ድርጊት በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያሳያል።
- source_word: ἐκείνη
  choice: እርሷም
  rationale: በዚህ ዐውድ ጠቋሚው ቃል እንደ ተውላጠ ስም ስለሚሠራ፣ በአማርኛ ተፈጥሯዊ በሆነ መንገድ ተገልጿል።
- source_word: Ἑβραϊστί
  choice: በዕብራይስጥ
  rationale: የግሪኩን ቀጥተኛ ቃል በዋናው ጽሑፍ ይጠብቃል፤ አራማይክን ሊያመለክት ይችላል የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: Ραββουνι
  choice: ረቡኒ
  rationale: ወንጌላዊው ወዲያው ትርጉሙን ስለሚሰጥ፣ የአጠራሩን ባህላዊና ስሜታዊ ኃይል ለመጠበቅ በድምፅ ቅርብ ሆኖ ተጽፏል።
- source_word: ὃ λέγεται Διδάσκαλε
  choice: ትርጉሙም “መምህር ሆይ!” ማለት ነው
  rationale: λέγεται የቃሉን ፍቺ እንደሚያስረዳ በተፈጥሯዊ አማርኛ ቀርቧል፤ የΔιδάσκαλε የጥሪ ቅርጽም “ሆይ” በማለት ተጠብቋል።
theological_decisions:
- issue: በዮሐንስ ትረካ የἙβραϊστί አተረጓጎም
  choice: በዕብራይስጥ
  alternative: በአራማይክ ቋንቋ
  rationale: ለዋናው ቋንቋ ቅድሚያ በመስጠት የግሪኩ ቀጥተኛ አገላለጽ በዋናው ጽሑፍ ተጠብቋል። ቃሉ የይሁዳን የዘመኑን አራማይክ ንግግር ሊያመለክት ይችላል የሚለው እውነተኛ አሻሚነት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የታሪክ የአሁን ጊዜ አቀራረብ ተጠብቋል፤ የጥሪ ቃሉም በተፈጥሯዊ አማርኛ “ሆይ” ተገልጿል።
