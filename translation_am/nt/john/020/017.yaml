source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: am
  text: ኢየሱስም እንዲህ አላት፤ “አትጣበቂብኝ፤[a] ገና ወደ አብ አላረግሁምና። ነገር ግን ወደ ወንድሞቼ[b] ሂጂና፣ ‘ወደ አባቴና ወደ አባታችሁ፣ ወደ አምላኬና ወደ አምላካችሁ ልወጣ ነው’ ንገሪያቸው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አትንኪኝ” ወይም “አትያዢኝ።” የግሪክኛው አገላለጽ ከቀላል መንካት ይልቅ ተጣብቆ መያዝን ወይም መያዙን መቀጠልን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ወንድሞች” የሚለው በግሪክኛ በወንድ ጾታ ብዙ ቁጥር የተጻፈውን ቃል ይተረጉማል፤ በዚህ ስፍራ የኢየሱስን ደቀ መዛሙርት ያመለክታል፣ ሰፋ ያለ ወካይ ቡድንንም ሊያካትት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: አትጣበቂብኝ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር መምጣቱ እየተካሄደ ያለን ድርጊት ማቆም ወይም መቀጠሉን መከልከል ሊያመለክት ይችላል፤ “አትጣበቂብኝ” ቀላል መንካትን ሳይሆን አጥብቆ መያዝን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: ገና ወደ አብ አላረግሁምና
  rationale: “ገና…አላረግሁም” የοὔπωንና የፍጹም ጊዜውን ኃይል ይጠብቃል፤ “ማረግ” በዮሐንስ አውድ ወደ አብ መውጣትን የሚገልጽ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: πρὸς τὸν πατέρα
  choice: ወደ አብ
  rationale: በመጀመሪያው ሐረግ የባለቤትነት ተውላጠ ስም ስለሌለ፣ “ወደ አብ” የሚለው ምንጩን ይጠብቃል፤ ቀጣዩ ንግግር “አባቴና አባታችሁ” ብሎ ግንኙነቱን በግልጽ ይለያል።
- source_word: ἀδελφούς
  choice: ወንድሞቼ
  rationale: የግሪክኛውን ወንድ ፆታ ብዙ ቁጥርና የምንጩን ቃል ቀጥተኛ ትርጉም ይጠብቃል፤ በአውዱ ያለው የማካተት ስፋት በማስታወሻ ተገልጿል።
- source_word: Ἀναβαίνω
  choice: እያረግሁ ነው
  rationale: የግሪክኛውን የአሁን ጊዜ ሕያውነትና በቅርብ የሚፈጸም እንቅስቃሴን ይጠብቃል።
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: ወደ አባቴና ወደ አባታችሁ
  rationale: ሆን ተብሎ የተደረገውን ትይዩነትና የግንኙነት ልዩነት ይጠብቃል።
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: ወደ አምላኬና ወደ አምላካችሁ
  rationale: ከ“አባቴና አባታችሁ” ጋር ያለውን ትይዩ አወቃቀር ጠብቆ ያለ ሥነ መለኮታዊ ማለስለስ በቀጥታ ይተረጉማል።
theological_decisions:
- issue: የΜή μου ἅπτου ትርጉም
  choice: መጣበቅን ወይም አጥብቆ መያዝን እንዳትቀጥል የሚከለክል ትእዛዝ
  alternative: ምንም ዓይነት አካላዊ ንክኪ እንዳይኖር “አትንኪኝ”
  rationale: የግሪክኛው ግስና ጊዜያዊ ገጽታ የቀጠለ ድርጊትን ይደግፋሉ፤ ሆኖም “መንካት” የሚለው ሊሆን የሚችል አማራጭ በማስታወሻ ተጠብቋል።
- issue: በመጀመሪያው ሐረግ πατέραን መተርጎም
  choice: አብ
  alternative: አባቴ
  rationale: በምንጩ በዚህ ሐረግ μου የለም፤ ትርጉሙ ይህን ጠብቆ በቀጣዩ ንግግር የሚመጣውን ግልጽ የግንኙነት ልዩነት አያስቀድምም።
- issue: “አምላኬና አምላካችሁ” የሚለው ክርስቶሎጂያዊ ክብደት
  choice: ሐረጉን ያለ ማለስለስ በቀጥታ መተርጎም
  alternative: “አምላኬ” የሚለውን ኃይል የሚያዳክም ትርጓሜያዊ ማብራሪያ
  rationale: የጥቅሱ ሥነ መለኮታዊ ውጥረትና የዮሐንስ አውድ እንዳለ መቆየት አለበት፤ የትርጉም ሥራ ቀድሞ የተወሰነ ዶክትሪን ለመከላከል የጽሑፉን ቃል ማለስለስ የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “አብ” እና “ማረግ” የሚሉት ቃላት የመጽሐፍ ቅዱስን ክብርና የዮሐንስን የሥነ መለኮት አውድ ሲጠብቁ፣ የሐረጉ አወቃቀር ተፈጥሯዊ አማርኛ እንዲሆን ተደርጓል።
