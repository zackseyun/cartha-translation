review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the narrative sequence, Peter's following the other disciple, entry into the tomb, and the Greek historical present in θεωρεῖ. However, «የተልባ እግር ጨርቆቹ» introduces «እግር» (“foot”), which has no source basis and corrupts the referent of τὰ ὀθόνια. The final clause also needs an object-marked, grammatically complete construction.
  naturalness: «ተቀምጠው ያያል» is not natural or complete Amharic syntax for seeing cloths in a given state. «በዚያ ተቀምጠው ያሉትን ያያል» is clear modern standard Amharic and retains the visual/state sense of κείμενα.
  terminology: «ስምዖን ጴጥሮስ» and «መቃብር» are suitable. «የተልባ ጨርቆች» accurately conveys the linen cloths without adding an unsupported body-part term or the more interpretive “burial wrappings.”
  issues:
  - severity: high
    issue: Unsupported and erroneous phrase «የተልባ እግር ጨርቆቹ»
    rationale: τὰ ὀθόνια denotes cloths/linen cloths; the Greek contains no term corresponding to «እግር» (“foot”). This materially distorts the referent.
  - severity: medium
    issue: The final clause lacks a natural object construction
    rationale: The cloths must be marked as what Peter sees, and their position/state expressed with a complete relative or complement construction. «ተቀምጠው ያያል» does not do this idiomatically.
  revised_text: ከዚያም ስምዖን ጴጥሮስ እርሱን ተከትሎ መጣ፤ ወደ መቃብሩም ገባ፤ የተልባ ጨርቆቹ በዚያ ተቀምጠው ያሉትን ያያል።[a]
