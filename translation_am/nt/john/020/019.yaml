  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: am
  text: እንግዲህ በዚያው ቀን፣ በሳምንቱ የመጀመሪያው ቀን፣ ሲመሽ፣ ደቀ መዛሙርቱ አይሁድን[a] ስለፈሩ ባሉበት ቦታ በሮቹ ተቆልፈው ሳሉ፣ ኢየሱስ መጥቶ በመካከላቸው ቆመና፣ “ሰላም ለእናንተ”[b] አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እንደ ዐውዱ፣ “የአይሁድ መሪዎችን” ወይም “የይሁዳ ነዋሪዎችን” ማለት ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም “ሰላም ከእናንተ ጋር ይሁን።” የግሪኩ ቃል በቃል “ሰላም ለእናንተ” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: ስለዚህ ... ምሽት ሲሆን
  rationale: የግሪኩን የጊዜ አመልካች የጄኒቲቭ አብሶሉት አወቃቀርና οὖν የሚያሳየውን የትረካ ቀጣይነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: በዚያው ቀን፣ ከሳምንቱ የመጀመሪያው ቀን
  rationale: የተጠቀሰው ቀን የሳምንቱ የመጀመሪያ ቀን መሆኑን ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ይጠብቃል።
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: በሮቹ ተቆልፈው ሳሉ
  rationale: ፍጹም ተደራጊ አንቀጹ ከቀደመ ድርጊት የተገኘን ቀጣይ ሁኔታ ያሳያል፤ በፍርሃት ዐውድ ውስጥ ‘ተቆልፈው’ የደኅንነት ዓላማውን በተገቢው ያሳያል።
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ ... ባሉበት ቦታ
  rationale: ግሪኩ የሚገልጸውን ቀላል የቦታ ግንኙነት ያለ ተጨማሪ ግምት ያስተላልፋል።
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: አይሁድን ስለፈሩ
  rationale: διά ከአኩዛቲቭ ጋር የሚገልጸውን ምክንያት በተፈጥሯዊ አማርኛ ይሰጣል፤ Ἰουδαίων የሚለው በዋናው ጽሑፍ ሳይጠበብ እንደ አይሁድ ተተርጉሟል።
- source_word: ἔστη εἰς τὸ μέσον
  choice: በመካከላቸው ቆመ
  rationale: ‘ወደ መካከል ቆመ’ የሚለውን ግልጽ የቦታ ምስል በተለመደ አማርኛ ይጠብቃል።
- source_word: Εἰρήνη ὑμῖν
  choice: ሰላም ለእናንተ ይሁን
  rationale: የግሪኩን ቀጥተኛ ‘ሰላም ለእናንተ’ አገላለጽ በአማርኛ እንደ ሙሉና ክብር ያለው የሰላምታ ምኞት ያቀርባል።
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: በግሪክ ታሪካዊ የአሁን ጊዜ የተጻፈውን ግስ ለአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ያቀርባል።
theological_decisions:
- issue: በዮሐንስ ወንጌል τῶν Ἰουδαίων የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘አይሁድን’ ተብሎ ተተርጉሞ የዐውዱ አማራጮች በማስታወሻ ተገልጸዋል።
  alternative: ‘የአይሁድ መሪዎችን’ ወይም ‘የይሁዳ ሰዎችን’
  rationale: የግሪኩ ቃል በዐውዱ አይሁድን በአጠቃላይ፣ የአይሁድ ባለሥልጣናትን ወይም የይሁዳን ነዋሪዎች ሊያመለክት ይችላል። ዋናው ጽሑፍ ማመልከቻውን ከግሪኩ ይልቅ አያጠብም፤ ማስታወሻው ግን በኢየሩሳሌም ያለውን የተቃውሞ ዐውድ ለአንባቢው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የትረካው ረጅም የግሪክ አወቃቀር ግንኙነቱን ሳያጣ በአማርኛ ሊነበብ በሚችል ቅደም ተከተል ቀርቧል፤ ባህላዊው ‘ደቀ መዛሙርት’ የሚለውም በዘመናዊ አንባቢዎች ዘንድ የታወቀ ስለሆነ ተጠብቋል።
