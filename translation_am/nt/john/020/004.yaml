review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the two runners, preserves the imperfect/progressive force of ἔτρεχον, Peter, the comparative speed, and the other disciple's first arrival at the tomb. However, its rendering of προέδραμεν as «ቀድሞ ሮጠ» is somewhat unnatural and can be more clearly expressed as overtaking/running ahead of Peter. The existing footnote's proposed alternative also conflates running ahead with arriving.
  naturalness: «ሁለቱም አብረው ይሮጡ ነበር» is understandable, but «እየሮጡ ነበር» is the normal modern Amharic narrative progressive form. «ቀድሞ ሮጠ» is less idiomatic in this context than «ቀድሞት ሮጠ» or an explicit expression of running ahead.
  terminology: «ደቀ መዝሙር», «ጴጥሮስ», and «መቃብር» are appropriate, standard biblical terms. «ወደ መቃብሩ» appropriately conveys arrival at the tomb rather than entry into it.
  issues:
  - severity: medium
    issue: The progressive past wording is not optimally natural.
    rationale: The Greek imperfect ἔτρεχον depicts an ongoing past action. Modern standard Amharic naturally expresses this here with «እየሮጡ ነበር», rather than «ይሮጡ ነበር».
  - severity: medium
    issue: «ቀድሞ ሮጠ» is awkward and the footnote alternative blurs two distinct actions.
    rationale: προέδραμεν denotes running ahead of/outpacing Peter, whereas ἦλθεν πρῶτος separately states that he arrived first. «ቀድሞት ሮጠ» makes the first action clear, and the footnote should identify «ከጴጥሮስ በፍጥነት ቀደመው» as an idiomatic alternative without turning it into arrival.
  revised_text: ሁለቱም አብረው እየሮጡ ነበር፤ ሌላውም ደቀ መዝሙር ከጴጥሮስ ይልቅ ፈጥኖ ቀድሞት ሮጠ፣ ወደ መቃብሩም ቀድሞ ደረሰ።[a]
