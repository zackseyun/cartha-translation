  alternative: “እግዚአብሔር ሰርዮላቸዋል / ይዞባቸዋል” በማለት ፈጻሚውን በግልጽ መጨመር፣ ወይም “ይሰረይላቸዋል / ይያዝባቸዋል” ብሎ በቀላል ጊዜ መተርጎም።
  rationale: ግሪክኛው ፈጻሚውን በስም አይጠቅስም። ስለዚህ እግዚአብሔርን በትርጉሙ ውስጥ በቀጥታ መጨመር ጽሑፉ ያልገለጸውን የትርጓሜ ውሳኔ ያስገባል። ተደራጊውንና ፍጹም ገጽታውን ማቆየት በሰው ድርጊትና በመለኮታዊ ይቅርታ መካከል ያለውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ያቆየዋል።
