  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: am
  text: 'የማናቸውንም ሰዎች ኃጢአት ብትሰርዩ፣ ተሰርዮላቸዋል፤[a] የማናቸውንም ሰዎች ኃጢአት ብትይዙባቸው፣ ተይዞባቸዋል።[b]


    [a] በሌላ አገላለጽ፦ “የማንንም ኃጢአት ብትሰርዩ፣ ኃጢአቱ ተሰርዮለታል።” በግሪክኛው በሁለቱም የውጤት አንቀጾች ያሉት ግሶች ፍጹም ጊዜ ተደራጊ ቅርጽ ስላላቸው፣ የተፈጸመንና ውጤቱ የቀጠለን ድርጊት ሊያጎሉ ይችላሉ።


    [b] “ኃጢአት ብትይዙባቸው” የሚለው፣ “ኃጢአታቸውን ሳትሰርዩ ብታስቀሩባቸው” ተብሎም ሊገለጽ ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
