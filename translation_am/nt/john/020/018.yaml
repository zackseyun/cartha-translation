review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Mary Magdalene’s arrival, her report to the disciples, her seeing the Lord, and the likely reading that Jesus’ words to her are included in her report. However, the main Amharic sentence joins the report clauses awkwardly: “ብላና ... አበሰረች” obscures the parallel contents of what she announced.'
  naturalness: The wording is generally modern and understandable, but the placement of “አበሰረች” after two differently formed complements is not idiomatic enough for polished standard Amharic. Recasting the announcement with a colon gives a clear, natural report.
  terminology: “መግደላዊት ማርያም,” “ደቀ መዛሙርት,” and “ጌታ” are appropriate established Amharic biblical terms. The alternative-reading footnote preserves the Greek syntactic ambiguity responsibly.
  issues:
  - severity: medium
    issue: Awkward coordination of the reported content
    rationale: In “'ጌታን አይቻለሁ' ብላና እርሱ ... እንደነገራት አበሰረች,” the conjunction እና joins a quotative clause and an indirect-content clause in a cumbersome way. A colon after “አበሰረች” clearly presents both clauses as the content of Mary’s announcement.
  revised_text: መግደላዊት ማርያም ወደ ደቀ መዛሙርቱ መጥታ አበሰረቻቸው፦ «ጌታን አይቻለሁ፤ እርሱም እነዚህን ነገሮች ነግሮኛል።»[a]
