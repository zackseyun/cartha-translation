  alternative: የተራኪው የተለየ አስተያየት፦ ‘እርሱም እነዚህን ነገሮች ነገራት’
  rationale: ሁለተኛ ὅτι ባይኖርም ሐረጉ የἀγγέλλουσαን ይዘት በተፈጥሮ ሊቀጥል ይችላል። ሆኖም የተራኪው አስተያየት አድርጎ ማንበብም ሰዋሰዋዊ ዕድል ስላለው በማስታወሻ ተጠብቋል።
