  text: መግደላዊት ማርያም ወደ ደቀ መዛሙርቱ መጥታ አበሰረቻቸው፦ «ጌታን አይቻለሁ፤ እርሱም እነዚህን ነገሮች ነግሮኛል።»[a]
  philosophy: optimal-equivalence
  footnotes:
