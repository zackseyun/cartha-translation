    text: ወይም፣ «መግደላዊት ማርያም ወደ ደቀ መዛሙርቱ መጥታ፣ “ጌታን አይቻለሁ” አለች፤ እርሱም እነዚህን ነገሮች ነገራት።» የመጨረሻው ሐረግ የማርያም ዘገባ ክፍል ወይም የተራኪው አስተያየት ተደርጎ ሊወሰድ ይችላል።
