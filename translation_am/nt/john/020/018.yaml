lexical_decisions:
- source_word: ἔρχεται
  choice: መጥታ
  rationale: የግሪኩ የአሁን ጊዜ ግስ ታሪካዊ አሁን ነው፤ በአማርኛ የትረካውን ክስተት በተፈጥሮ ለማቅረብ ያለፈ ጊዜ ተጠቅሟል።
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: መግደላዊት ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውንና ለዘመናዊ አንባቢ የሚታወቀውን የስም ቅርጽ ይጠብቃል።
- source_word: ἀγγέλλουσα
  choice: አበሰረች
  rationale: ቃሉ መልእክትን ማድረስን ያመለክታል፤ ‘አበሰረች’ ይህን ኃይል በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς μαθηταῖς
  choice: ወደ ደቀ መዛሙርቱ
  rationale: ‘ደቀ መዛሙርት’ የተለመደና ትክክለኛ አቻ ነው። የአማርኛው ቅጥያ ቡድኑን በአውዱ የታወቀ አድርጎ ያቀርባል፤ ባለቤትነትን አይጨምርም።
- source_word: Ἑώρακα
  choice: አይቻለሁ
  rationale: የግሪኩን ፍጹም ጊዜ፣ ማለትም የተፈጸመ ድርጊት አሁናዊ ጠቀሜታ እንዳለው፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: ‘ጌታ’ የκύριοςን የተለመደ ሥነ መለኮታዊ ክብደት ይጠብቃል፤ የድርጊት ተቀባይነቱም በ‘-ን’ ተገልጿል።
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: እርሱ እነዚህን ነገሮች እንደነገራት
  rationale: ክፍሉን የማርያም ዘገባ ቀጣይ ይዘት አድርጎ ያቀርባል፤ ‘እንደነገራት’ የጌታው ንግግር ከማርያም ማብሰር በፊት መሆኑን በተፈጥሮ ያሳያል።
theological_decisions:
- issue: በትንሣኤው አውድ κύριοςን መተርጎም
