  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: am
  text: ይህንም ከተናገረ በኋላ እጆቹንና ጎኑን አሳያቸው። ደቀ መዛሙርቱም ጌታን ባዩ ጊዜ ደስ አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: ይህንም ከተናገረ በኋላ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ ይህ አተረጓጎም የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔδειξεν
  choice: አሳያቸው
  rationale: δείκνυμι በዚህ አውድ ለዓይን ማቅረብን ወይም ማሳየትን ይገልጣል፤ የተውላጠ ስሙ ተቀባዮች αὐτοῖς በአማርኛው ግስ ውስጥ በተፈጥሮ ተካቷል።
- source_word: τὰς χεῖρας
  choice: እጆቹን
  rationale: ግሪኩ የባለቤትነት ተውላጠ ስም ባይጠቀምም፣ እየታዩ ያሉት የኢየሱስ እጆች መሆናቸውን አውዱ ያሳያል፤ በአማርኛም የባለቤትነት ቅጥያው ተፈጥሯዊ ነው።
- source_word: τὴν πλευράν
  choice: ጎኑን
  rationale: πλευρά በዚህ ቦታ ‘ጎን’ ማለት ነው፤ ቃሉ በምዕራፉ ቀደም ብሎ የተጠቀሰውን ቁስል ሳይጨምር እንዲያስታውስ ቀጥተኛው ትርጉም ተጠብቋል።
- source_word: ἐχάρησαν
  choice: ደስ አላቸው
  rationale: χαίρω ደስ መሰኘትን ወይም ሐሴት ማድረግን ይገልጣል፤ ‘ደስ አላቸው’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ሲሆን የደስታውን ኃይል አያዳክምም።
- source_word: οὖν
  choice: -ም
  rationale: οὖν የውጤትን ወይም የትረካ ቀጣይነትን ያመለክታል፤ በ‘ደቀ መዛሙርቱም’ ያለው ‘-ም’ ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ μαθηταί
  choice: ደቀ መዛሙርቱ
  rationale: ይህ በወንጌላት ውስጥ μαθηταίን ለመግለጽ የተለመደ፣ የተከበረና በሰፊው የሚገባ የአማርኛ ቃል ነው።
- source_word: ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የአኦሪስት አሳታፊው ግስ ደስታቸው የተከሰተበትን ጊዜና ምክንያታዊ አጋጣሚ ያመለክታል፤ ‘ባዩ ጊዜ’ ይህን በግልጽ ያስተላልፋል።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: κύριος በዚህ የትንሣኤ መገለጥ አውድ የኢየሱስ መጠሪያና ክርስቶሎጂያዊ ማዕረግ ነው፤ ‘ጌታ’ ሁለቱንም ገጽታዎች ይጠብቃል።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: መምህር / አለቃ
  rationale: በትንሣኤው መገለጥ አውድ ቃሉ ተራ የክብር አጠራር ብቻ ሳይሆን የኢየሱስን ማንነትና ሥልጣን የሚገልጥ ማዕረግ ነው፤ ‘ጌታ’ ይህን ሥነ መለኮታዊ ክብደት ሳያጋንን ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። የግሪኩን የድርጊት ቅደም ተከተልና የደቀ መዛሙርቱን ምላሽ በተፈጥሯዊ የአማርኛ አገባብ ጠብቋል።
