  rationale: የግል ቁርኝቱንና አክብሮቱን ይጠብቃል፤ κύριος በአውዱ ያለውን ክርስቶሳዊና ማኅበራዊ የትርጉም ስፋት ሳይዘጋ ይተረጉማል።
