  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: am
  text: እነርሱም፣ “ሴት ሆይ፣ ስለ ምን ታለቅሻለሽ?[a]” አሏት። እርሷም፣ “ጌታዬን[b] ወስደውታል፤ የት እንዳስቀመጡትም አላውቅም” አለቻቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክኛው በቃል ደረጃ “ምን” ይላል፤ በዚህ አውድ ግን ትርጉሙ “ለምን ታለቅሻለሽ?” የሚል ነው።
    reason: lexical_alternative
  - marker: b
    text: “ጌታዬ” የግሪክኛው κύριος (ኪርዮስ) ትርጉም ነው። ቃሉ በአውዱ እንደ “አለቃዬ” ያለ የአክብሮት መጠሪያም ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
