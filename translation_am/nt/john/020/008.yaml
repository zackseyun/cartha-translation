  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: am
  text: ከዚያም ወደ መቃብሩ አስቀድሞ የደረሰው ሌላው ደቀ መዝሙር ደግሞ ገባ፤[a] አየም፣ አመነም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ውስጥ ገባ።»
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ «አመነ» ብቻ ይላል፤ ምን እንዳመነ በግልጽ አይናገርም። አንዳንዶች ትንሣኤውን እንዳመነ፣ ሌሎች በፊቱ ያየውን ማስረጃ ወይም ቀደም ሲል የተነገረውን ዘገባ እንዳመነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: ከዚያም
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል፤ οὖν የሚያክለውን ቀላል የውጤት ወይም የቀጣይነት ጥላ በ«ም» አያያዥነት ያስተላልፋል።
- source_word: εἰσῆλθεν
  choice: ገባ
  rationale: ወደ መቃብሩ ውስጥ የተደረገውን ተጨባጭ እንቅስቃሴ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ ἄλλος μαθητής
  choice: ሌላው ደቀ መዝሙር
  rationale: በዮሐንስ ትረካ ያለውን መደበኛ መለያ ይጠብቃል፤ «ደቀ መዝሙር» ለμαθητής የተለመደና ትክክለኛ የአማርኛ ቃል ነው።
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: ወደ መቃብሩ አስቀድሞ የደረሰው
  rationale: ይህ ደቀ መዝሙር ከጴጥሮስ በፊት ወደ መቃብሩ መድረሱን በግልጽና ተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: μνημεῖον
  choice: መቃብር
  rationale: በዚህ የትንሣኤ ትረካ ውስጥ ቃሉ ኢየሱስ የተቀበረበትን ስፍራ ያመለክታል፤ «መቃብር» ግልጽና የተለመደ ነው።
- source_word: καὶ εἶδεν
  choice: አየም
  rationale: የግሪኩን ቀጥተኛ ትርጉምና ከቀደመው ድርጊት ጋር ያለውን ትስስር ይጠብቃል።
- source_word: ἐπίστευσεν
  choice: አመነም
  rationale: ግሪኩ የታመነውን ነገር በግልጽ ስለማይናገር፣ ግሱን ያለ ተጨማሪ ተሳቢ መተርጎም የምንጩን አጭርነትና አሻሚነት ይጠብቃል።
theological_decisions:
- issue: ደቀ መዝሙሩ ያመነው ምን እንደሆነ
  choice: «አመነም» ብሎ የእምነቱን ይዘት ሳይጨምር መተርጎም
  alternative: ኢየሱስ ከሞት መነሣቱን አመነ፤ ወይም የማርያምን ቀደምት ዘገባ አመነ
  rationale: ἐπίστευσεν ተሳቢውን አይገልጽም። በተለይ ከቀጣዩ ቁጥር አንጻር አንድን ትርጓሜ በጽሑፉ ላይ መጨመር የምንጩን ሥነ መለኮታዊና ትረካዊ ውጥረት ያስወግዳል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ καί በ«ደግሞ» እና በ«ም» አያያዦች ተንጸባርቋል፤ የእምነቱ ይዘት ሆን ተብሎ አልተገለጸም።
