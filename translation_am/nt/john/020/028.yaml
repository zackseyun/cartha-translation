  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: am
  text: ቶማስም መልሶ፣ “ጌታዬና አምላኬ!” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ያነሰ ዕድል ያለው ሌላ አረዳድ፦ ቶማስ “ጌታዬና አምላኬ!” ብሎ እንደ ድንጋጤ አባባል ተናገረ። ሆኖም የግሪክኛው ጽሑፍ ‘ለእርሱ አለ’ ስለሚል፣ ቃሉ በቀጥታ ለኢየሱስ መነገሩን ይደግፋል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መልሶ
  rationale: የትረካውን ‘መለሰ’ የሚለውን መደበኛ ትርጉም በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: Θωμᾶς
  choice: ቶማስ
  rationale: የግል ስሙ በተለመደው የአማርኛ አጻጻፍ ተጽፏል።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: በግሪክኛው ያለውን ነጠላ ተባዕታይ ተውላጠ ስም ‘ለእርሱ’ በተፈጥሯዊና አጭር የአማርኛ አገባብ ይጠብቃል፤ ‘ኢየሱስ’ የሚለውን ስም አይጨምርም።
- source_word: Ὁ κύριός μου
  choice: ጌታዬ
  rationale: κύριος የሚያመለክተውን ክብርና ሥነ መለኮታዊ ክብደት ይጠብቃል፤ μου የሚለው ባለቤትነት በ‘-ዬ’ ተገልጿል።
- source_word: ὁ θεός μου
  choice: አምላኬ
  rationale: θεόςን ‘አምላክ’፣ μουን ደግሞ ‘-ዬ’ በማለት የግል እምነት ኑዛዜውን በቀጥታ ያስተላልፋል።
- source_word: καὶ
  choice: -ም
  rationale: ሁለቱን ማዕረጎች የሚያስተሳስረውን ‘እና/ደግሞ’ ትርጉም በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያቀርባል።
theological_decisions:
- issue: የቶማስ ቃል በቀጥታ ለኢየሱስ የቀረበ ኑዛዜ ነው ወይስ ለእግዚአብሔር የተነገረ የድንጋጤ አባባል?
  choice: በቀጥታ ለኢየሱስ የቀረበ፣ ‘ጌታዬ፣ አምላኬም!’ የሚል ኑዛዜ
  alternative: ኢየሱስን በቀጥታ ሳይጠራ ለእግዚአብሔር የተነገረ የድንጋጤ አባባል
  rationale: αὐτῷ (‘ለእርሱ’) ቶማስ ቃሉን ለኢየሱስ እንደተናገረ በግልጽ ያሳያል። ὁ κύριός μου καὶ ὁ θεός μου የሚሉት በአንቀጽ የቀረቡ የስም አውራ ቅርጾች በኮይኔ ግሪክኛ የቀጥታ ጥሪ ሆነው ሊሠሩ ይችላሉ። ስለዚህ ጽሑፉ ያለውን ክርስቶሎጂያዊ ክብደት ሳያለዝብ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገባብ ተጠቅሟል። ‘አለው’ የሚለው የግሪክኛውን ቀጥተኛ ተቀባይ በተፈጥሯዊ መንገድ ይጠብቃል።
