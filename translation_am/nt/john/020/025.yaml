  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: am
  text: ስለዚህ ሌሎቹ ደቀ መዛሙርት፣ “ጌታን አይተናል” እያሉ ይነግሩት ነበር። እርሱ ግን፣ “በእጆቹ ላይ የምስማሮቹን ምልክት ካላየሁ፣ ጣቴንም በምስማሮቹ ምልክት ውስጥ ካላስገባሁ፣ እጄንም በጎኑ ውስጥ ካላስገባሁ፣ በፍጹም አላምንም[a]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በፍጹም አላምንም” የሚለው “ከቶ አላምንም” ተብሎም ሊተረጎም ይችላል፤ ግሪክኛው አጽንዖት ያለውን አሉታዊ አገላለጽ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: እያሉ ይነግሩት ነበር
  rationale: ያልተጠናቀቀው የግስ ጊዜ በቀደመው ጊዜ የቀጠለ ወይም የተደጋገመ ንግግርን ያመለክታል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: የትረካውን ቀጣይነትና ከቀደመው ሁኔታ የሚመጣውን ውጤት ያሳያል።
- source_word: Ἑωράκαμεν
  choice: አይተነዋል
  rationale: የተፈጸመው ማየት አሁንም ጠቀሜታ እንዳለው የፍጹም ጊዜውን ኃይል ይጠብቃል።
- source_word: κύριον
  choice: ጌታን
  rationale: በዚህ አውድ ከሞት የተነሣውን ኢየሱስ የሚያመለክት የክብር ማዕረግ ነው።
- source_word: τύπον
  choice: ምልክት
  rationale: ምስማሮቹ በእጆቹ ላይ ያስቀሩትን የሚታይ አሻራ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βάλω ... εἰς
  choice: ካላስገባሁ ... ውስጥ
  rationale: ወደ ውስጥ የሚደረግን እንቅስቃሴ እና የቶማስን ግልጽ ጥያቄ ይጠብቃል።
- source_word: οὐ μὴ πιστεύσω
  choice: በፍጹም አላምንም
  rationale: ድርብ አሉታዊው አገላለጽ የሚያሳየውን ጠንካራና አጽንዖታዊ እምቢታ ያስተላልፋል።
theological_decisions:
- issue: በοὐ μὴ πιστεύσω ውስጥ ያለው የቶማስ እምቢታ ኃይል
  choice: በፍጹም አላምንም
  alternative: ፈጽሞ አላምንም / ከቶ አላምንም
  rationale: ግሪክኛው ጠንካራ አሉታዊ አጽንዖት አለው፤ ሆኖም ይህ እምቢታ ከተጠቀሱት ሁኔታዎች ጋር የተያያዘ ስለሆነ፣ ለዘላለም ፈጽሞ እንደማያምን የሚያስመስል ትርጓሜ አልተጨመረም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “እያሉ ይነግሩት ነበር” የተደጋጋሚውን ንግግር፣ “በፍጹም አላምንም” ደግሞ የግሪክኛውን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያሉ።
