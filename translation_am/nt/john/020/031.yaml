base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: am
  text: እነዚህ ግን ኢየሱስ መሲሑ[b]፣ የእግዚአብሔር ልጅ እንደሆነ እንድታምኑ[a]፣ እንዲሁም በማመናችሁ በስሙ ሕይወት እንዲኖራችሁ ተጽፈዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የጥንት የእጅ ጽሑፎች ‘ወደ እምነት እንድትመጡ’ የሚል ሐሳብ የሚያጎላውን የግስ ቅርጽ (aorist) ይዘዋል፤ ሌሎች ደግሞ ‘ማመናችሁን እንድትቀጥሉ’ የሚል ሐሳብ ሊያመለክት የሚችለውን የአሁን ጊዜ ቅርጽ ይደግፋሉ። ዋናው ጽሑፍ ሁለቱንም ሳይገድብ ‘እንድታምኑ’ ይላል።
    reason: textual_variant
  - marker: b
    text: ወይም፣ ‘ክርስቶስ።’ Χριστός የሚለው የግሪክ ማዕረግ እንደ ማዕረግ ያለውን ትርጉም ለመጠበቅ እዚህ ‘መሲሑ’ ተብሎ ተተርጉሟል።
    reason: alternative_reading
