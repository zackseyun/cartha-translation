  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: am
  text: ኢየሱስ በደቀ መዛሙርቱ ፊት ሌሎች ብዙ ምልክቶችን[a] አደረገ፤ እነዚህም በዚህ መጽሐፍ አልተጻፉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተአምራት።” የግሪኩ ቃል “ምልክቶች” ሲሆን፣ እነዚህ ድርጊቶች ከራሳቸው አልፈው ኢየሱስ ማን እንደሆነ እንደሚጠቁሙ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: ሌሎች ብዙ …ም
  rationale: የብዛትንና የተጨማሪነትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ οὖν እና μέν ከቁጥር 31 ጋር ያላቸው የንግግር ትስስር በቃላት ተጭኖ አልተተረጎመም።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: በዮሐንስ ወንጌል ተአምራዊ ድርጊቶቹ ከራሳቸው አልፈው የኢየሱስን ማንነት እንደሚጠቁሙ የሚያሳየውን ቁልፍ ቃል ይጠብቃል።
- source_word: ἐποίησεν
  choice: አደረገ
  rationale: ποιέω በዚህ አውድ ያለውን ሰፊና ቀጥተኛ ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: በደቀ መዛሙርቱ ፊት
  rationale: ድርጊቶቹ ደቀ መዛሙርቱ ባሉበትና እነርሱ ምስክሮች ሆነው ሳሉ እንደተደረጉ ያሳያል። የአማርኛው የይዞታ ቅጥያ የታወቀውን የደቀ መዛሙርት ቡድን በተፈጥሯዊ ሁኔታ ይጠቁማል።
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: ያልተጻፉ
  rationale: የግሪኩን ተደራጊ ቅርጽና በመጽሐፉ ውስጥ ተጽፈው ያለመኖራቸውን ሁኔታ ይጠብቃል።
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: በዚህ መጽሐፍ
  rationale: የተጻፈውን ወንጌል እንደ ሥነ ጽሑፍ ሥራ በግልጽና በተለመደ አማርኛ ይጠቅሳል።
theological_decisions:
- issue: በዮሐንስ ወንጌል የσημεῖα አጠቃቀም
  choice: ምልክቶች
  alternative: ተአምራት
  rationale: የኢየሱስ ድርጊቶች የኃይል ሥራዎች ብቻ ሳይሆኑ ማንነቱንና ተልእኮውን የሚገልጡ ጠቋሚዎች መሆናቸውን የዮሐንስ አጽንዖት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የዮሐንስን ቁልፍ ቃል “ምልክቶች” በዋናው ጽሑፍ ጠብቆ፣ “ተአምራት” የሚለውን አማራጭ በማስታወሻ ያቀርባል።
