review_pass:
  verdict: revise
  source_fidelity: The draft conveys Jesus' performance of many additional σημεῖα before the disciples and their absence from this book. However, the embedded Amharic relative clause is less clear than a clause that explicitly resumes the signs, and the enclitic -ም on “ምልክቶችንም” is not needed to represent the Greek expression.
  naturalness: “በዚህ መጽሐፍ ያልተጻፉ ሌሎች ብዙ ምልክቶችንም” is grammatically possible but densely premodifies the object and can momentarily obscure what the non-written qualifier modifies. Two coordinated sentences are clear, natural modern standard Amharic.
  terminology: “ምልክቶች” appropriately preserves Johannine σημεῖα; “ተአምራት” is suitably retained as a lexical alternative in the footnote. “በደቀ መዛሙርቱ ፊት” and “በዚህ መጽሐፍ” are accurate and idiomatic.
  issues:
  - severity: low
    issue: The relative clause is embedded before the object noun.
    rationale: Although intelligible, this ordering is heavier and less immediately clear in modern Amharic than explicitly referring back to the signs in a following clause.
  - severity: low
    issue: The additive enclitic -ም on “ምልክቶችንም” is unnecessary.
    rationale: The sense of additional signs is already expressed by “ሌሎች ብዙ”; retaining -ም can sound like an unmotivated additional emphasis.
  revised_text: ኢየሱስ በደቀ መዛሙርቱ ፊት ሌሎች ብዙ ምልክቶችን[a] አደረገ፤ እነዚህም በዚህ መጽሐፍ አልተጻፉም።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “ተአምራት።” የግሪኩ ቃል “ምልክቶች” ሲሆን፣ እነዚህ ድርጊቶች ከራሳቸው አልፈው ኢየሱስ ማን እንደሆነ እንደሚጠቁሙ ያጎላል።
    reason: lexical_alternative
  revision_rationale: The revision keeps every source component while using a natural resumptive clause (“እነዚህም”) for the Greek relative clause. It preserves the passive meaning of γεγραμμένα and places the lexical-note anchor directly on “ምልክቶች.”
