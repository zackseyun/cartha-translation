review_pass:
  verdict: revise
  source_fidelity: The sequential opening, the twofold invitation to bring finger and hand, the plural ‘hands,’ and the belief-oriented contrast all reflect the Greek well. However, አግባ is intransitive (‘enter’), so it does not faithfully express βάλε with Thomas’s hand as the item being put into Jesus’ side.
  naturalness: ለቶማስ እንዲህ አለው is more natural modern Amharic than the draft’s ቶማስን እንዲህ አለው. Replacing አግባ with አስገባ supplies the needed transitive command and is idiomatic.
  terminology: ጎኔ appropriately renders πλευρά (‘side’), and የማታምን / የምታምን appropriately maintains the contextual contrast of unbelieving and believing. The alternative faithful/faithless sense is suitably retained in the footnote.
  issues:
  - severity: high
    issue: በጎኔ ውስጥ አግባ
    rationale: አግባ normally means ‘enter’ and presents Thomas himself as entering. The Greek βάλε commands him to put his hand into Jesus’ side; አስገባ is required.
  - severity: low
    issue: ቶማስን እንዲህ አለው
    rationale: Although understandable in elevated biblical style, ለቶማስ እንዲህ አለው is the clearer, natural modern standard construction for ‘he said to Thomas.’
  revised_text: ከዚያም ለቶማስ እንዲህ አለው፦ “ጣትህን ወደዚህ አምጣና እጆቼን ተመልከት፤ እጅህንም አምጣና ወደ ጎኔ አስገባ። የማታምን አትሁን፤ የምታምን ሁን።”[a]
