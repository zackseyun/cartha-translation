language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: am
  text: ከዚያም ለቶማስ እንዲህ አለው፦ “ጣትህን ወደዚህ አምጣና እጆቼን ተመልከት፤ እጅህንም አምጣና ወደ ጎኔ አስገባ። የማታምን አትሁን፤ የምታምን ሁን።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝ ያልሆንክ አትሁን፤ ታማኝ ሁን።” የግሪኩ ቅጽሎች ሁለቱንም ትርጉሞች ሊይዙ ይችላሉ፤ በዚህ አውድ ግን ንጽጽሩ ቶማስ በተነሣው ኢየሱስ ማመኑ ላይ ያተኩራል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: ከዚያም
  rationale: የትረካውን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ኃላፊ ጊዜ ተተርጉሟል።
- source_word: Φέρε
  choice: አምጣ / አምጥተህ
  rationale: ጣቱንና እጁን ወደ ኢየሱስ እንዲያቀርብ የሚጋብዘውን ትእዛዝ እና የግሪኩን የግስ ድግግሞሽ ይጠብቃል።
- source_word: δάκτυλόν σου ὧδε
  choice: ጣትህን ወደዚህ
  rationale: ὧδε ያለውን ቦታ ጠቋሚ ኃይል በግልጽ አማርኛ ያቆያል።
- source_word: ἴδε τὰς χεῖράς μου
  choice: እጆቼን ተመልከት
  rationale: በዚህ አውድ ἴδε የሚያመለክተውን በትኩረት የማየት ግብዣ በተፈጥሯዊ አማርኛ ይገልጣል፤ የእጆች ብዙ ቁጥርም ተጠብቋል።
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: በጎኔ ውስጥ አግባ
  rationale: βάλε የሚሰጠውን ቀጥተኛ ትእዛዝና εἰς ያለውን ወደ ውስጥ የመግባት አቅጣጫ ይጠብቃል።
- source_word: μὴ γίνου
  choice: አትሁን
  rationale: በአማርኛ ተፈጥሯዊ የሆነ የመከልከል አገላለጽ ሲሆን፣ በተከታዩ ‘ሁን’ ጋር የግሪኩን ንጽጽር ያቆያል።
- source_word: ἄπιστος / πιστός
  choice: የማታምን / የምታምን
  rationale: የቅርብ አውዱ ቶማስ በተነሣው ኢየሱስ ማመኑን ስለሚመለከት፣ የእምነትን ትርጉም በቀዳሚነት ያሳያል፤ ሌላው የ‘ታማኝ/ታማኝ ያልሆነ’ ትርጉም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ἄπιστος / πιστός የሚለውን ንጽጽር መተርጎም
  choice: የማታምን / የምታምን
  alternative: ታማኝ ያልሆነ / ታማኝ
  rationale: ቶማስ የኢየሱስን ትንሣኤ ምስክርነት ከማመኑ ጋር የተያያዘው የቅርብ አውድ የ‘ማመን’ን ትርጉም ያጠናክራል። ሆኖም የግሪኩ ቅጽሎች ‘ታማኝ ያልሆነ/ታማኝ’ ማለትም ሊችሉ ስለሚችሉ ይህ አማራጭ አልተሰወረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘አምጣ/አምጥተህ’ ድግግሞሽና የመጨረሻው ተቃርኖ ተጠብቀዋል።
