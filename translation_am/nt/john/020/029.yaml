id: JHN.20.29
reference: John 20:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: am
  text: ኢየሱስ፣ “ስላየኸኝ አምነሃልን?[a] ሳያዩ ያመኑ ብፁዓን ናቸው” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስላየኸኝ አምነሃል።” የግሪኩ ንግግር እንደ ጥያቄም ሆነ እንደ መግለጫ ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም … አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል፤ αὐτῷ የሚያመለክተው ቶማስን ስለሆነ “አለው” ይዞታውን ይጠብቃል።
- source_word: Ὅτι ἑώρακάς με πεπίστευκας
  choice: ስላየኸኝ አምነሃልን?
  rationale: Ὅτι በምክንያታዊ ትርጉሙ “ስለ” ተብሏል። የሁለቱ ግሶች ፍጹም አኳኋን ያለፈው ድርጊት አሁን ያለውን ውጤት እንደሚያሳይ “አይተሃል/አምነሃል” በሚለው የአማርኛ ፍጹም ቅርጽ ተወክሏል፤ “ስላየኸኝ” የተዋሃደና ተፈጥሯዊ ቅርጹ ነው።
- source_word: μακάριοι
  choice: ብፁዓን ናቸው
  rationale: በብፅዕና ንግግሮች የተለመደውን፣ ከግላዊ ደስታ ይልቅ የእግዚአብሔርን ሞገስ የሚያመለክተውን ክቡር መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: ሳያዩ ያመኑ
  rationale: ስማዊ አገልግሎት ያላቸውን ሁለት ቦዝ አንቀጾች በተፈጥሯዊ አማርኛ ተዛማጅ ቅርጽ ያቀርባል። καί በግሪኩ የሌለውን “ሆኖም” ሳይጨምር፣ “ሳያዩ ያመኑ” በሚለው አወቃቀር ግልጽ የሆነውን ንፅፅር ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ የመጀመሪያ ንግግር ጥያቄ ወይስ መግለጫ መሆኑ
  choice: “ስላየኸኝ አምነሃልን?” ተብሎ እንደ ጥያቄ ቀርቧል።
  alternative: “ስላየኸኝ አምነሃል።” ተብሎ እንደ መግለጫ ሊነበብ ይችላል።
  rationale: ዘመናዊ የግሪክ እትሞች የጥያቄውን ንባብ ይደግፋሉ፣ ዐውደ ንባቡም የቶማስን በማየት ላይ የተመሠረተ እምነት ሳያዩ ካመኑት ጋር ያነፃፅራል። ሆኖም የጥንት ቅጂዎች ዘመናዊ ሥርዓተ ነጥብ ስላልነበራቸው የመግለጫው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። “ብፁዓን” የመጽሐፍ ቅዱስን ክብር ሲጠብቅ፣ የዓረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ ዘመናዊ አማርኛን ይከተላል።
