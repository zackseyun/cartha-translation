- source_word: εἰσῆλθεν
  choice: ወደ ውስጥ አልገባም
  rationale: ወደ መቃብሩ ውስጥ አለመግባቱን በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
