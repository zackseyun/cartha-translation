    text: ወይም፣ “አጎንብሶ የተልባ ጨርቆቹ ተዘርግተው እንዳሉ ያያል።” በግሪኩ ያለው “ተዘርግተው እንዳሉ” የሚለው አሳታፊ ግስ ከጨርቆቹ ጋር በቅርብ ሊያያዝ ስለሚችል፣ “ወደ ውስጥ” የሚለው በግልጽ ሳይጨመር ሊተረጎም ይችላል።
