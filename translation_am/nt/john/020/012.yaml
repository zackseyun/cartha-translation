  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: am
  text: ነጭ ለብሰው የተቀመጡ ሁለት መላእክትን አየች፤ የኢየሱስ አካል ተኝቶ በነበረበት ቦታ፣ አንዱ በራስጌው ሌላውም በእግርጌው ተቀምጠው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωρεῖ
  choice: አየች
  rationale: በትረካው ዐውድ ባለቤቱ መግደላዊት ማርያም ናት። የግሪኩ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ በኃላፊ ጊዜ ተተርጉሟል።
- source_word: ἀγγέλους
  choice: መላእክትን
  rationale: የባዶው መቃብር ዐውድና ነጭ ልብሳቸው ሰማያዊ ፍጥረታትን እንደሚያመለክት ያሳያል፤ ‘መልእክተኞች’ ከማለት ይልቅ ‘መላእክት’ ግልጽ ነው።
- source_word: ἐν λευκοῖς
  choice: ነጭ ልብስ የለበሱ
  rationale: የግሪኩ አገላለጽ ቃል በቃል ‘በነጭ’ ቢሆንም፣ በዐውዱ ነጭ ልብስ መልበሳቸውን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: καθεζομένους
  choice: ተቀምጠው
  rationale: ተሳቢው የመላእክቱን አቀማመጥ ይገልጣል፤ ‘ተቀምጠው’ ይህን በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: አንዱ … ራስጌ፣ ሌላውም እግርጌ
  rationale: πρός ከዳቲቭ ጋር በዚህ ስፍራ ቅርበትንና አቀማመጥን ያመለክታል። ‘ራስጌ’ እና ‘እግርጌ’ በአማርኛ የተኛ አካል ሁለቱን ጫፎች በተፈጥሮ ይገልጣሉ።
- source_word: ἔκειτο
  choice: ተኝቶ በነበረበት
  rationale: የኢምፐርፌክት ቅርጹ ከማየቷ በፊት የነበረውን ቀጣይ ሁኔታ ያመለክታል። ይህ አገላለጽ አካሉ ቀደም ሲል በዚያ ተኝቶ እንደነበር ያሳያል።
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: የኢየሱስ አካል
  rationale: ‘አካል’ የσῶμαን መሠረታዊ ትርጉም በክብርና በግልጽነት ያስተላልፋል፤ ‘አስከሬን’ ከምንጩ ይልቅ ጠንካራ ነው።
theological_decisions:
- issue: በትንሣኤው ዐውድ የἀγγέλους ማንነት
  choice: ሰማያዊ መላእክት
  alternative: ሰብአዊ መልእክተኞች
  rationale: ἄγγελος ‘መልእክተኛ’ ሊል ቢችልም፣ የባዶው መቃብር ዐውድና ነጭ ልብስ ሰማያዊ መላእክት መሆናቸውን በግልጽ ይደግፋሉ።
- issue: የἔκειτο ጊዜያዊ ኃይል
  choice: አካሉ ከዚያ በፊት በዚያ ተኝቶ እንደነበር መግለጽ
  alternative: ‘የኢየሱስ አካል በተኛበት’ የሚል ቀላል ያለፈ ጊዜ
  rationale: ትረካው አካሉ ከመጥፋቱ በፊት የነበረበትን ቦታ ያመለክታል። ‘ተኝቶ በነበረበት’ ይህን ቀዳሚ ሁኔታ ያብራራል፣ ነገር ግን የግሪኩን ኢምፐርፌክት ሌላ አተረጓጎም አያስቀርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል፤ የምንጩ ፍቺ ግን አልተለወጠም።
