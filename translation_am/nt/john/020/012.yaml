review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Mary as the implicit female subject, renders the angels’ white attire and seated posture, and preserves the two positions at the head and feet. However, its final clause syntactically makes the angels themselves the subject of “was,” rather than clearly stating that each was seated at one end of the place where Jesus’ body had lain.
  naturalness: The sequence “መላእክትን ተቀምጠው አየች” is awkward because the participial posture is insufficiently integrated, and “አንዱ … ራስጌ፣ ሌላውም እግርጌ ነበር” is incomplete/ambiguous in modern standard Amharic. A relative participle and explicit location markers make the sentence natural and clear.
  terminology: መላእክት, ኢየሱስ, and አካል are appropriate. “ነጭ ለብሰው” is a natural concise rendering of ἐν λευκοῖς. The past-perfect-like “ተኝቶ በነበረበት” is acceptable in context, though the Greek imperfect itself need not be treated as inherently requiring a past perfect.
  issues:
  - severity: medium
    issue: The angels’ seated posture and their respective locations are not syntactically expressed clearly.
    rationale: The Greek has two angels sitting, one at the head and one at the feet. The draft’s final “ነበር” leaves the locations without a clear predicate and can suggest that “one” and “the other” simply were the head and feet.
  - severity: low
    issue: The footnote b explanation overstates the temporal force of the Greek imperfect.
    rationale: ἔκειτο denotes that the body lay in that location; the wider narrative can support an Amharic prior-state expression, but the imperfect does not by itself demand a past-perfect rendering.
  revised_text: ነጭ ለብሰው የተቀመጡ ሁለት መላእክትን አየች፤ የኢየሱስ አካል ተኝቶ በነበረበት ቦታ፣ አንዱ በራስጌው ሌላውም በእግርጌው ተቀምጠው ነበር።
