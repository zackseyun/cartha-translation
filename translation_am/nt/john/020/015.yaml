review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ questions, Mary’s mistaken supposition that he is the gardener, and the conditional request. However, the final verb ወስጄዋለሁ is perfect (‘I have taken him’) rather than the Greek future ἀρῶ (‘I will take/lift him’). The footnote also inaccurately calls κύριε a direct equivalent of the possessive ጌታዬ.
  naturalness: The narrative is generally natural modern standard Amharic. Retaining ጌታዬ is a plausible respectful form of address, but the note should explain its contextual polite sense rather than assert a possessive Greek meaning. Changing the final clause to እወስደዋለሁ gives a natural and clear future promise.
  terminology: ሴት ሆይ appropriately preserves the direct vocative without conveying contempt. አትክልተኛው, አንሥተው ወስደውት, and አኖሩት are suitable. ጌታዬ may remain as an Amharic respectful address, with a footnote preserving that κύριε here most likely means ‘Sir,’ not a recognition of Jesus’ lordship.
  issues:
  - severity: medium
    issue: ወስጄዋለሁ renders the final verb as perfect aspect.
    rationale: 'κἀγὼ αὐτὸν ἀρῶ contains future ἀρῶ: Mary promises a future action, ‘I will take him away.’ እወስደዋለሁ preserves this.'
  - severity: medium
    issue: The footnote describes κύριε as directly meaning the possessive form ጌታዬ.
    rationale: κύριε is the vocative singular of κύριος (‘lord/sir’); Greek does not contain a possessive ‘my.’ In this context Mary believes she is speaking to the gardener, so its likely force is a respectful ‘Sir.’
  - severity: low
    issue: The footnote’s wording ‘መጠቀሟ አይቀርም’ is unnecessarily absolute.
    rationale: The contextual sense is strongly likely, but the note should state it as the likely polite usage and preserve the lexical alternative without overclaiming.
  revised_text: ኢየሱስም፣ “ሴት ሆይ፣ ለምን ታለቅሻለሽ? ማንን ትፈልጊያለሽ?” አላት። እርሷም እርሱ አትክልተኛው መስሏት፣ “ጌታዬ[a]፣ እርስዎ አንሥተው ወስደውት ከሆነ፣ የት እንዳኖሩት ንገሩኝ፤ እኔም እወስደዋለሁ” አለችው።
