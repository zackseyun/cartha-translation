id: JHN.20.15
reference: John 20:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: am
  text: ኢየሱስም፣ “ሴት ሆይ፣ ለምን ታለቅሻለሽ? ማንን ትፈልጊያለሽ?” አላት። እርሷም እርሱ አትክልተኛው መስሏት፣ “ጌታዬ[a]፣ እርስዎ አንሥተው ወስደውት ከሆነ፣ የት እንዳኖሩት ንገሩኝ፤ እኔም እወስደዋለሁ” አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ κύριε በቀጥታ “ጌታ ሆይ” ወይም አክብሮታዊ “ክቡር ሆይ” ሊሆን ይችላል። ማርያም እርሱን አትክልተኛው መስሏት ስለነበር፣ እዚህ በአክብሮት “ጌታዬ” ብላ መጥራቷ ነው የሚመስለው።
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: ሴት ሆይ
  rationale: የግሪኩን ቀጥተኛ የአነጋገር ቅርጽ ይጠብቃል፤ “ሆይ” በአማርኛ ንቀት ሳይጨምር የጥሪውን ቅርጽ በክብር ያቀርባል።
- source_word: τί κλαίεις
  choice: ለምን ታለቅሻለሽ?
  rationale: κλαίω ማልቀስን ያመለክታል፤ τί በዚህ አገባብ ምክንያትን የሚጠይቅ “ለምን” ነው።
- source_word: τίνα ζητεῖς
  choice: ማንን ትፈልጊያለሽ?
  rationale: የግሪኩን ሰው የሚያመለክት ቀጥተኛ ተሳቢ እና የመፈለግን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δοκοῦσα
  choice: መስሏት
  rationale: የማርያምን የተሳሳተ ግምት በአጭርና ተፈጥሯዊ የትረካ ቅርጽ ይገልጣል።
- source_word: ὁ κηπουρός
  choice: አትክልተኛው
  rationale: κηπουρός በቀጥታ የአትክልት ቦታን የሚንከባከብ ሰው ማለት ነው።
- source_word: Κύριε
  choice: ጌታዬ
  rationale: “ጌታዬ” የκύριεን መሠረታዊ ቅርጽ ይጠብቃል፤ በአማርኛም እንደ አክብሮታዊ “ጌታ” ሊሠራ ስለሚችል በአውዱ ያለውን ድርብ አማራጭ አይዘጋም።
- source_word: ἐβάστασας αὐτόν
  choice: አንሥተው ወስደውት
  rationale: βαστάζω የመሸከምን ወይም አንሥቶ የመውሰድን አካላዊ ሐሳብ ይይዛል፤ ይህ ትርጉም አስከሬኑን ከቦታው ማንቀሳቀስን በግልጽ ያሳያል።
- source_word: ποῦ ἔθηκας αὐτόν
  choice: የት እንዳኖሩት
  rationale: τίθημι ማኖርን፣ ማስቀመጥን ወይም መጣልን ሊያመለክት ይችላል፤ “አኖሩት” በዚህ የአስከሬን አውድ ተፈጥሯዊና ክብር ያለው ነው።
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: እኔም ወስጄዋለሁ
  rationale: αἴρω አንሥቶ መውሰድን ወይም ከቦታ ማስወገድን ያመለክታል፤ የወደፊቱ እርምጃም በ“እወስደዋለሁ” ቅርጽ ተጠብቋል።
theological_decisions:
- issue: ማርያም ኢየሱስን ሳታውቀው κύριε ብላ መጥራቷ
  choice: ጌታዬ
  alternative: ጌታ ሆይ / ክቡር ሆይ
  rationale: ማርያም የምታነጋግረው አትክልተኛውን እንደሆነ ስለገመተች፣ ቃሉ እዚህ የክርስቶስን ጌትነት እንደተገነዘበች የሚያሳይ ኑዛዜ ሳይሆን አክብሮታዊ አጠራር መሆኑ ይበልጥ ይስማማል። ሆኖም “ጌታዬ” የግሪኩን ቃል ዋና ትርጉም ስለሚጠብቅ ሥነ መለኮታዊውን የቃል ግንኙነት አያጠፋም፤ የአውዱ አጠቃቀም በማስታወሻ ተገልጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ይጠቀማል። “ሴት ሆይ” የግሪኩን ቀጥተኛ ጥሪ ይጠብቃል፤ ለታሰበው አትክልተኛ ደግሞ የአማርኛ አክብሮት ቅርጽ (“እርስዎ፣ ንገሩኝ”) ተጠቅሟል።
