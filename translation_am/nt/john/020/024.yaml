base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: am
  text: ቶማስ ግን፣ ከአሥራ ሁለቱ አንዱ የሆነውና መንታ[a] ተብሎ የሚጠራው፣ ኢየሱስ በመጣ ጊዜ ከእነርሱ ጋር አልነበረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ «ዲዲሞስ»፤ ትርጉሙ «መንታ» ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: እዚህ δέ ቶማስ ከሌሎቹ ጋር አለመኖሩን በማጉላት ትኩረቱን ወደ እርሱ የሚያዞር ለስላሳ የትረካ ማገናኛ ነው፤ «ግን» ይህን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: ከአሥራ ሁለቱ አንዱ
  rationale: ቶማስ በ«አሥራ ሁለቱ» ተብሎ በሚታወቀው የሐዋርያት ቡድን ውስጥ እንደነበረ በቀጥታ ያሳያል።
- source_word: ὁ λεγόμενος Δίδυμος
  choice: ዲዲሞስ የሚባለው
  rationale: Δίδυμος በአውዱ የቶማስ የግሪክ መጠሪያ ሆኖ ስለቀረበ፣ በዋናው ጽሑፍ «ዲዲሞስ» ተብሎ ተጽፏል፤ ትርጉሙ «መንታ» መሆኑ ለአንባቢ በግርጌ ማስታወሻ ተገልጿል።
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: ከእነርሱ ጋር አልነበረም
  rationale: የቶማስን በዚያ ጊዜ ከቡድኑ መቅረት ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: ኢየሱስ በመጣ ጊዜ
  rationale: የግሪኩን የጊዜ አንቀጽና የἔρχομαιን መሠረታዊ ትርጉም በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የΔίδυμος አተረጓጎም
  choice: በዋናው ጽሑፍ «ዲዲሞስ» ብሎ መጻፍና ትርጉሙን በግርጌ ማስታወሻ መግለጽ
  alternative: በዋናው ጽሑፍ «መንታ የሚባለው» ብሎ መተርጎም
  rationale: ይህ አማራጭ ዲዲሞስ የተለመደ መጠሪያ መሆኑን ይጠብቃል፣ ትርጉሙንም አይሰውርም፤ በጉዳዩ ላይ የሥነ መለኮት አቋም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ቶማስ ግን» የሚለው አወቃቀር የትረካውን ለስላሳ የትኩረት ለውጥ ያሳያል፤ «አሥራ ሁለቱ» ደግሞ የታወቀውን ቡድን እንደ ስያሜ ያቆያል።
