source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: am
  text: ከስምንት ቀናት በኋላ ደቀ መዛሙርቱ እንደገና በቤት ውስጥ ነበሩ፤ ቶማስም ከእነርሱ ጋር ነበር። በሮቹ ተዘግተው ሳሉ ኢየሱስ መጥቶ በመካከላቸው ቆመና፣ “ሰላም ለእናንተ ይሁን” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: ከስምንት ቀን በኋላ
  rationale: የግሪኩን አገላለጽ በቅርብ ይከተላል፤ እንደ ‘ከሳምንት በኋላ’ በመተርጎም የጥንቱን አካታች የቀን አቆጣጠር በጽሑፉ ውስጥ አይተረጉምም።
- source_word: ἔσω
  choice: በቤት ውስጥ
  rationale: በአማርኛ ‘ውስጥ’ ብቻ ከማለት ይልቅ ተፈጥሯዊ ሲሆን፣ ከአውዱ የሚታወቀውን የውስጥ ቦታ ያመለክታል።
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: በሮቹ ተዘግተው ሳሉ
  rationale: የግሪኩን ፍጹም ተሳቢ አገላለጽ የበሮቹ የተዘጉ ሁኔታ እንደቀጠለ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔρχεται
  choice: መጥቶ
  rationale: በግሪኩ የታሪክ አሁን ጊዜ ቢሆንም፣ በዘመናዊ አማርኛ ትረካ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: Εἰρήνη ὑμῖν
  choice: ሰላም ለእናንተ ይሁን
  rationale: የሴማዊውን ሰላምታና የቃሉን ሙሉ የሰላም ምኞት የሚያስተላልፍ የተለመደና ክቡር አገላለጽ ነው።
theological_decisions:
- issue: በሮቹ ተዘግተው ሳሉ ኢየሱስ መምጣቱ የሚያመለክተው ዘዴ
  choice: የተዘጉትን በሮችና የኢየሱስን መምጣት ብቻ መግለጽ
  alternative: ኢየሱስ በበሮቹ ውስጥ እንዳለፈ በግልጽ መጨመር
  rationale: ምንጩ በሮቹ ተዘግተው እንደነበርና ኢየሱስ እንደመጣ ይናገራል፤ የመግቢያውን ዘዴ ግን አይገልጽም። ትርጉሙ ይህን ክፍትነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የትረካው ፍሰት ተፈጥሯዊ እንዲሆን የግሪኩ ታሪካዊ አሁን ጊዜ በአማርኛ የትረካ ቅደም ተከተል ተሰጥቷል።
