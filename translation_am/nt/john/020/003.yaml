  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: am
  text: ስለዚህ ጴጥሮስና ሌላው ደቀ መዝሙር ወጡ፤ ወደ መቃብሩም እየሄዱ ነበር[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ መቃብሩ ሄዱ።» የግሪኩ ያላለቀ ግስ በቀላሉ እንዲህ ሊተረጎም ይችላል፤ «እየሄዱ ነበር» የሚለው ግን ድርጊቱ በሂደት ላይ እንደነበር ይበልጥ በግልጽ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ወጡ
  rationale: ከነበሩበት ስፍራ መውጣታቸውን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል። በግሪክ ግሱ ነጠላ ቢሆንም ጴጥሮስና ሌላው ደቀ መዝሙር ሁለቱም የድርጊቱ ባለቤቶች ስለሆኑ ብዙ ቁጥር በአማርኛ ተፈጥሯዊ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ የሚከተለውን ውጤት ወይም ምላሽ የሚያመለክተውን አያያዥ ኃይል ይጠብቃል።
- source_word: ὁ Πέτρος
  choice: ጴጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: ὁ ἄλλος μαθητής
  choice: ሌላው ደቀ መዝሙር
  rationale: ἄλλος በአውዱ ከጴጥሮስ የተለየውን፣ አስቀድሞ የታወቀውን ደቀ መዝሙር ያመለክታል፤ μαθητής ደግሞ በወንጌላዊ ትረካ ውስጥ «ደቀ መዝሙር» ተብሎ በተለመደ መንገድ ተተርጉሟል።
- source_word: ἤρχοντο
  choice: እየሄዱ ነበር
  rationale: የግሪኩን ያላለቀና በሂደት ላይ የነበረ ያለፈ ድርጊት በግልጽ ያሳያል።
- source_word: εἰς τὸ μνημεῖον
  choice: ወደ መቃብሩ
  rationale: በዚህ አውድ μνημεῖον የኢየሱስን መቃብር ያመለክታል። «ወደ» የመድረሻ አቅጣጫን እንጂ ወደ መቃብሩ ውስጥ መግባትን አያመለክትም።
