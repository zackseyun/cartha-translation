- source_word: μνημεῖον
  choice: መቃብር
  rationale: በዚህ የቀብርና የትንሣኤ አውድ ለተጠቀሰው የቀብር ስፍራ ተፈጥሯዊና የተለመደ የአማርኛ ቃል ነው።
- source_word: κλαίουσα / ἔκλαιεν
  choice: ታለቅስ ነበር / እያለቀሰች
