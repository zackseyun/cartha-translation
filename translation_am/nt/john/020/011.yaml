- source_word: ὡς οὖν
  choice: እያለቀሰችም
  rationale: ቀጣዩ ድርጊት በልቅሶዋ መካከል መፈጸሙን ያሳያል፤ ከልክ ያለፈ የምክንያት ትርጉም አይጨምርም።
- source_word: παρέκυψεν
  choice: ለማየት ጎንበስ አለች
  rationale: ወደ ውስጥ ለማየት ዝቅ ወይም ጎንበስ የማለትን አካላዊ እንቅስቃሴ ይገልጻል።
- source_word: εἰς τὸ μνημεῖον
  choice: ወደ መቃብሩ ውስጥ
  rationale: እይታዋ ወደ መቃብሩ ውስጣዊ ክፍል መቅናቱን በግልጽ ያሳያል።
