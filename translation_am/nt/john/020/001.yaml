  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: am
  text: በሳምንቱ የመጀመሪያው ቀን[a]፣ መግደላዊት ማርያም ገና ጨለማ ሳለ ማልዳ ወደ መቃብሩ ትመጣለች፤ ድንጋዩ ከመቃብሩ ተወግዶ እንዳለ ታያለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከሰንበታት በአንዷ”፤ ይህ ፈሊጣዊ አገላለጽ “በሳምንቱ የመጀመሪያው ቀን” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: በሳምንቱ የመጀመሪያ ቀን
  rationale: የግሪኩ አገላለጽ ቃል በቃል ‘ከሰንበታት በአንዱ’ ቢሆንም፣ በኮይኔ ግሪክ የሳምንቱን የመጀመሪያ ቀን የሚያመለክት ፈሊጥ ነው። በአማርኛ ግልጽና ተፈጥሯዊ በሆነ መንገድ ተተርጉሟል።
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: መግደላዊት ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስሞች አጠቃቀም የተለመደውን የግለሰቡን ስምና የቦታ መጠሪያ ይጠብቃል።
- source_word: ἔρχεται
  choice: ትመጣለች
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አጠቃቀም በመጠበቅ ለትረካው ሕያውነት ይሰጣል።
- source_word: πρωῒ σκοτίας ἔτι οὔσης
  choice: ገና ጨለማ ሳለ ማልዳ
  rationale: πρωῒ የጠዋትን ቀደምት ሰዓት ያመለክታል፤ ተከታዩ ሐረግም ጨለማው ገና እንዳልጠፋ ይገልጣል። ሁለቱም መረጃዎች ሳይዋሐዱ ተጠብቀዋል።
- source_word: εἰς τὸ μνημεῖον
  choice: ወደ መቃብሩ
  rationale: በዚህ ዐውድ μνημεῖον አስከሬን የተቀበረበትን መቃብር ያመለክታል።
- source_word: βλέπει
  choice: ታያለች
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ በመጠበቅ ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου
  choice: ድንጋዩም ከመቃብሩ ተወግዶ
  rationale: ፍጹም ተደራጊ አካፋይ የተጠናቀቀ ድርጊትንና የድርጊቱን ውጤት ያሳያል፤ ‘ተወግዶ’ ድንጋዩ ማርያም ስትደርስ አስቀድሞ ከቦታው እንደተነሣ ያስተላልፋል።
theological_decisions:
- issue: በትንሣኤው ትረካ ውስጥ የግስ ጊዜ
  choice: ታሪካዊውን የአሁን ጊዜ (‘ትመጣለች፣’ ‘ታያለች’) መጠበቅ
  alternative: ግሶቹን በአለፈ ጊዜ (‘መጣች፣’ ‘አየች’) መተርጎም
  rationale: የአሁን ጊዜ ግሶቹ የግሪኩን ሕያው የትረካ ስልት ያንጸባርቃሉ፤ ትምህርታዊ ትርጓሜ ሳይጨምሩ የክስተቱን ቅርበት ይጠብቃሉ።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለውን መደበኛ አማርኛ ይጠቀማል። የግሪኩ ታሪካዊ የአሁን ጊዜ ለትረካዊ ሕያውነት ተጠብቋል፤ የፈሊጡ ቃል በቃል ቅርጽ በግርጌ ማስታወሻ ቀርቧል።
