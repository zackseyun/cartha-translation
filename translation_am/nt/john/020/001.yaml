review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the first day of the week, Mary Magdalene’s early arrival while it remains dark, the tomb, and the stone’s removal. However, its final clause is grammatically incomplete/ambiguous in Amharic: “ተወግዶ ታያለች” does not clearly express that Mary sees the stone in its removed state.'
  naturalness: The historical presents ትመጣለች and ታያለች are natural enough in a vivid formal narrative. Adding እንዳለ after the perfect passive construction makes the final observation idiomatic and unambiguous. የመጀመሪያው agrees more naturally with the definite noun ቀን.
  terminology: መግደላዊት ማርያም and መቃብር are appropriate standard biblical Amharic terms. The footnote is retained, with its literal phrasing adjusted to avoid the masculine form አንዱ for the feminine expression it glosses.
  issues:
  - severity: medium
    issue: The predicate sequence “ድንጋዩም ከመቃብሩ ተወግዶ ታያለች” is syntactically unclear.
    rationale: It can fail to establish that Mary sees the stone as already removed; እንዳለ explicitly and naturally renders βλέπει τὸν λίθον ἠρμένον.
  - severity: low
    issue: “የመጀመሪያ ቀን” lacks the more natural definite adjective form.
    rationale: “በሳምንቱ የመጀመሪያው ቀን” is the standard, fully definite Amharic expression for “on the first day of the week.”
  - severity: low
    issue: The footnote’s “በአንዱ” uses a masculine form in a literal gloss of a feminine Greek numeral expression.
    rationale: Using “በአንዷ” is linguistically cleaner for the Amharic literal gloss without affecting the stated idiomatic meaning.
  revised_text: በሳምንቱ የመጀመሪያው ቀን[a]፣ መግደላዊት ማርያም ገና ጨለማ ሳለ ማልዳ ወደ መቃብሩ ትመጣለች፤ ድንጋዩ ከመቃብሩ ተወግዶ እንዳለ ታያለች።
