  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: am
  text: እርሱ ከሙታን መካከል ሊነሣ እንደሚገባው የሚናገረውን የመጽሐፍ ቃል ገና አልተረዱም ነበርና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሙታን መካከል እንዲነሣ እንደሚገባው።» እዚህ በግሪክ ያለው ግስ አድራጊ ቅርጽ ሲሆን በቀጥታ «ሊነሣ» ማለት ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: ገና አል...ም ነበር
  rationale: እስከዚያ ጊዜ ድረስ መረዳታቸው እንዳልተከሰተ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γὰρ
  choice: ነበርና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት ያሳያል።
- source_word: ᾔδεισαν
  choice: አልተረዱም
  rationale: በዚህ አውድ የመጽሐፉን ቃል ትርጉም መገንዘብን ይጠቁማል፤ ቃሉ መኖሩን ብቻ ማወቅን አይደለም።
- source_word: τὴν γραφὴν
  choice: የመጽሐፍ ቃል
  rationale: ነጠላውን γραφή ጠብቆ ሥልጣን ያለውን ቅዱስ ጽሑፍ ወይም የተወሰነ የመጽሐፍ ምስክርነት በተለመደ አማርኛ ይገልጣል።
- source_word: ὅτι
  choice: እንደሚ...ው የሚናገረውን
  rationale: ግሪኩ የሚያስገባውን የይዘት ሐረግ በተፈጥሯዊ የአማርኛ አወቃቀር ከ‘የመጽሐፍ ቃል’ ጋር ያገናኛል።
- source_word: δεῖ
  choice: ሊ... እንደሚገባው
  rationale: በትረካው አውድ ያለውን አስፈላጊነት፣ በተለይም መለኮታዊ ግዴታን፣ ይጠብቃል።
- source_word: αὐτὸν
  choice: በ‘ሊነሣ’ ውስጥ የተካተተው የሦስተኛ መደብ ወንድ ተሳቢ
  rationale: የግሪኩን ‘እርሱን/እርሱ’ በአማርኛው ግስ ውስጥ በተፈጥሯዊነት ያካትታል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን መካከል
  rationale: የνεκρῶνን ብዙ ቁጥርና ‘ከሞቱት መካከል’ የሚለውን ምስል በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀναστῆναι
  choice: ሊነሣ
  rationale: የግሪኩን አድራጊ ቅርጽ በአድራጊ አገላለጽ ይጠብቃል፤ ተገብሮአዊ አገላለጽን ወደ ዋናው ጽሑፍ አያስገባም።
theological_decisions:
- issue: የትንሣኤው አገላለጽና አድራጊነት
  choice: ከሙታን መካከል ሊነሣ
  alternative: ከሙታን መካከል ሊነሣ ነበረበት / ከሙታን ሊነሣ እንደሚገባው
  rationale: ἀναστῆναι አድራጊ ቅርጽ ስለሆነ ዋናው ጽሑፍ ‘ሊነሣ’ ብሎ ያቀርበዋል። ተገብሮአዊው ‘ሊነሣ እንዲደረግ’ የሚል አተረጓጎም በሌሎች የአዲስ ኪዳን አውዶች ከሥነ መለኮት አንጻር ሊስማማ ቢችልም፣ እዚህ የግሪኩን ቅርጽ አይወክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘የመጽሐፍ ቃል’ በአማርኛ የተለመደውን ቅዱስ ጽሑፋዊ አገላለጽ ይጠብቃል፤ ‘ከሙታን መካከል’ ደግሞ የምንጩን ብዙ ቁጥር ያንጸባርቃል።
