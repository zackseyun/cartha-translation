language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: am
  text: 'እኔን የማይወድ ቃሎቼን አይጠብቅም። የምትሰሙትም ቃል[a] የእኔ ሳይሆን የላከኝ የአብ ነው።


    [a] ወይም፣ “የምትሰሙት መልእክት የእኔ ሳይሆን ከላከኝ ከአብ የመጣ ነው።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የምትሰሙት መልእክት የእኔ ሳይሆን ከላከኝ ከአብ የመጣ ነው።”
    reason: λόγος በዚህ አውድ “ቃል” ወይም በስብስብ ስሜት “መልእክት” ሊሆን ይችላል፤ አማራጩም የሙሉ ንጽጽር አንቀጽን ያቀርባል።
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: እኔን የማይወድ
  rationale: በመስተዋድድ የተደገፈው የአሁን ጊዜ አሉታዊ ተሳቢ በአጠቃላይ ኢየሱስን የማይወድን ሰው ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ሆኖ የግሪኩን አወቃቀር ይጠብቃል።
- source_word: τοὺς λόγους μου
  choice: ቃሎቼን
  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ የኢየሱስን ንግግሮችና ትምህርት በሰፊው ያመለክታል።
- source_word: τηρεῖ
  choice: አይጠብቅም
  rationale: τηρέω በዮሐንስ አጠቃቀም ቃልን በታማኝነት መያዝንና መታዘዝን አብሮ ያሳያል፤ “ይጠብቃል” ይህን ስፋት ይይዛል።
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: የምትሰሙትም ቃል
  rationale: ነጠላው λόγος እንደ አንድ የተዋሐደ ቃል ወይም መልእክት የኢየሱስን ትምህርት ሊያመለክት ይችላል፤ “ቃል” የዮሐንስን የቃላት ትስስር ይጠብቃል።
- source_word: οὐκ ἔστιν ἐμὸς
  choice: የእኔ ሳይሆን
  rationale: ἐμός የባለቤትነትን ወይም የምንጭነትን ግንኙነት ያሳያል፤ ይህ አገላለጽ ቀጥተኛውን ንጽጽር ይጠብቃል።
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: የላከኝ የአብ ነው
  rationale: የግሪኩን የባለቤትነት/ምንጭነት አገናኝ በአማርኛ ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል፤ “የላከኝ” የሚለውም አብን በግልጽ ይገልጻል።
theological_decisions:
- issue: የኢየሱስ ትምህርትና የአብ ቃል ግንኙነት
  choice: “የእኔ ሳይሆን የላከኝ የአብ ነው”
  alternative: “ከላከኝ ከአብ የመጣ ነው”
  rationale: ዋናው ትርጉም የግሪኩን የባለቤትነት/ምንጭነት ንጽጽር በቅርብ ይጠብቃል። ኢየሱስና አብ ተለይተው ሲቀርቡ የሚሰማው ቃል ከአብ ጋር ያለውም ግንኙነት ሳይፈታ ይቀራል፤ ከጽሑፉ በላይ የሆነ ዶግማዊ ማብራሪያ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ቃሎቼን አይጠብቅም” የመጽሐፍ ቅዱስን የቃላት ትስስር ሳያጠፋ መታዘዝንና ታማኝ መሆንን ያመለክታል።
