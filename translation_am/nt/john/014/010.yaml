  choice: ‘እኔ በአብ ውስጥ ... አብም በእኔ ውስጥ’ የሚለውን ቀጥተኛ ግንኙነታዊ አገላለጽ መጠበቅ
  alternative: ‘እኔና አብ አንድ ነን’ ወይም ‘ከአብ ጋር ኅብረት አለኝ’
