base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: am
  text: እኔ በአብ ውስጥ እንዳለሁ እና አብም በእኔ ውስጥ እንዳለ አታምንምን? እኔ የምላችሁን ቃላት ከራሴ[a] አልናገርም፤ ነገር ግን በእኔ ውስጥ የሚኖረው[b] አብ ሥራዎቹን ይሠራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘በራሴ ተነሳሽነት።’ ‘ከራሴ’ የሚለው ሐረግ አንድ ሰው በራሱ ተነሳሽነት ወይም ሥልጣን መናገሩን ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘በእኔ ውስጥ የሚቆየው።’
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: አታምንምን?
  rationale: የዮሐንስን ተደጋጋሚ የማመን ቃል ይጠብቃል፤ የግሱ ነጠላ ቁጥርም በአማርኛው ተጠብቋል።
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: በአብ ውስጥ ... በእኔ ውስጥ
  rationale: የግሪኩን የእርስ በርስ መኖር አገላለጽ በቀጥታ ይጠብቃል፤ ‘አንድ ነን’ የሚል ትርጓሜያዊ መስፋፋትን አያስገባም።
- source_word: ῥήματα
  choice: ቃላት
  rationale: በዚህ ዐውድ ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: λέγω ... λαλῶ
  choice: የምላችሁን ... አልናገርም
  rationale: የሁለቱን የግሪክ ግሶች ልዩነት ሳያጋንን በተፈጥሯዊ አማርኛ ያንጸባርቃል።
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ከራሴ
  rationale: የምንጭን፣ የራስን ተነሳሽነትና ሥልጣንን ሊያመለክት የሚችለውን ሰፊ ፍቺ ይጠብቃል።
- source_word: μένων
  choice: የሚኖረው
  rationale: የቀጣይነት ሐሳቡን በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል፤ ‘የሚቆየው’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: ሥራዎቹን ይሠራል
  rationale: የባለቤትነት አመልካቹን αὐτοῦ ይወክላል፤ የዮሐንስን ‘ሥራ’ ቃላትም ይጠብቃል።
theological_decisions:
