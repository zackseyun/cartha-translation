- issue: በኢየሱስ ንግግርና በአብ ሥራ ያለው አድራጊነት
  choice: ‘ከራሴ አልናገርም’ እና ‘አብ ሥራዎቹን ይሠራል’ የሚለውን ሚዛን መጠበቅ
  alternative: ‘በራሴ ሥልጣን አልናገርም’ ወይም ‘አብ በእኔ በኩል ይሠራል’
  rationale: የአብና የወልድን ልዩነት እንዲሁም በተልእኮ ያላቸውን አንድነት ሳይፈታ ይተዋል፤ ጽሑፉ ከሚለው በላይ አይወስንም።
