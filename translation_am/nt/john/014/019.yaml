review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal contrast, the contrast between the world and the disciples, and the causal connection in the final clause. However, «ሕያዋን ትሆናላችሁ» can suggest becoming alive and thus narrows the broad future ζήσετε more than the Greek requires. «ትኖራላችሁ» preserves the verbal sense and its intended breadth. The wording for Jesus' present life is more directly represented by «እኔ ሕያው ነኝና».
  naturalness: The revision uses idiomatic modern standard Amharic. «ከዚህ በኋላ አታየኝም» is a clearer future-oriented expression of οὐκέτι than «ከእንግዲህ».
  terminology: «ዓለም» appropriately preserves κόσμος without interpretive expansion. «ማየት» retains the openness of θεωρέω in context. «ሕያው ነኝና ... ትኖራላችሁ» maintains the lexical and theological connection of ζῶ / ζήσετε without specifying the mode of life.
  issues:
  - severity: medium
    issue: «ሕያዋን ትሆናላችሁ» may imply becoming alive.
    rationale: The future ζήσετε broadly means “you will live”; it need not specifically denote coming alive or becoming living. «ትኖራላችሁ» better preserves the Greek's open scope.
  - severity: low
    issue: Footnote a is anchored only after the disciples' instance of “see,” although its wording explicitly concerns both occurrences.
    rationale: Placing the anchor after the first occurrence makes the scope of the note clear and avoids a misleadingly narrow attachment.
  - severity: low
    issue: «ከእንግዲህ» is less clearly future-oriented in this sentence.
    rationale: «ከዚህ በኋላ» naturally expresses the impending cessation conveyed by ἔτι μικρὸν and οὐκέτι.
