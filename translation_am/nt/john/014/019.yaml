  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: am
  text: ጥቂት ጊዜ ቀርቷል፤ ዓለም ከዚህ በኋላ አታየኝም[a]፤ እናንተ ግን ታዩኛላችሁ። እኔ ሕያው ነኝና፣ እናንተም ትኖራላችሁ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በሁለቱም ቦታ «ታዘቡኝ» ወይም «በጥሞና ታዩኝ» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ግስ ከተራ ጨረፍታ የበለጠ እይታን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «እናንተም ትኖራላችሁ» የሚለው ደቀ መዛሙርቱ በኢየሱስ የትንሣኤ ሕይወት መካፈላቸውን፣ ከእርሱ ጋር ባላቸው ኅብረት መንፈሳዊ ሕይወት ማግኘታቸውን፣ ወይም ሁለቱንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: ጥቂት ጊዜ ብቻ ቀርቷል
  rationale: በተፈጥሯዊ ዘመናዊ አማርኛ አጭር የቀረ ጊዜንና በቅርብ የሚመጣውን ለውጥ ያሳያል።
- source_word: κόσμος
  choice: ዓለም
  rationale: የዮሐንስን ሰፊና ትርጉማዊ ውጥረት ያለውን አጠቃቀም ሳይገድብ የተለመደውን ቃል ይጠብቃል።
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: አያየኝም / ታዩኛላችሁ
  rationale: θεωρέω ከቀላል ጨረፍታ የበለጠ ማስተዋልን ሊያመለክት ቢችልም፣ እዚህ «ማየት» ተፈጥሯዊ ሲሆን የአካላዊና የመንፈሳዊ እይታ አሻሚነትን ይጠብቃል።
- source_word: οὐκέτι
  choice: ከእንግዲህ
  rationale: በቅርቡ ከሚመጣ አንድ ነጥብ ጀምሮ ድርጊቱ እንደሚቋረጥ በአጭሩ ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: በዓለምና በደቀ መዛሙርቱ መካከል ያለውን ተቃርኖ በግልጽ ያሳያል።
- source_word: ὅτι
  choice: ስለሆንሁ
  rationale: የኢየሱስ ሕያው መሆን ለደቀ መዛሙርቱ ሕይወት ምክንያት መሆኑን የሚያሳየውን ምክንያታዊ ኃይል ይገልጣል።
- source_word: ἐγὼ ζῶ
  choice: እኔ ሕያው ስለሆንሁ
  rationale: የግሪኩን የአሁን ጊዜና የኢየሱስን ሕያው እውነታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ ὑμεῖς ζήσετε
  choice: እናንተም ሕያዋን ትሆናላችሁ
  rationale: የወደፊት ጊዜውን በግልጽ ያሳያል፤ καί የሚገልጠውንም ከኢየሱስ ሕይወት ጋር ያለውን ትስስር «እናንተም» ያስተላልፋል።
theological_decisions:
- issue: ደቀ መዛሙርቱ ኢየሱስን «ማየታቸው» ምንነት
  choice: ሳይገደብ «ታዩኛላችሁ» ተብሎ ተተርጉሟል።
  alternative: ከትንሣኤ በኋላ በአካል ማየት፣ በእምነት መንፈሳዊ ማስተዋል፣ ወይም ሁለቱንም የሚያካትት ንባብ።
  rationale: ግሪኩ የእይታውን ዓይነት አይወስንም፤ ቀላሉ አተረጓጎም የዮሐንስን ብዙ አቅጣጫ ያለው ትርጉም ይጠብቃል።
- issue: «ሕያዋን ትሆናላችሁ» የሚለው ወሰን
  choice: የሕይወቱን ዓይነት ሳይገድብ በሰፊው ተተርጉሟል።
  alternative: የትንሣኤ ሕይወት፣ አሁናዊ መንፈሳዊ ሕይወት፣ ወይም በኢየሱስ ጋር በኅብረት የሚገኝ ዘላለማዊ ሕይወት።
  rationale: ζήσετε አሁናዊ የሕይወት ተሳትፎንና የወደፊት ትንሣኤን ሊያስተጋባ ስለሚችል፣ ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት አልፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አሻሚ የሆኑት የ«ማየት»ና የ«መኖር» ሐሳቦች በዋናው ጽሑፍ ሳይገደቡ ቀርተዋል።
