base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: am
  text: በአባቴ ቤት ብዙ መኖሪያዎች[a] አሉ። እንዲህ ባይሆን ኖሮ፣ ለእናንተ ስፍራ ላዘጋጅ እየሄድሁ መሆኑን በነገርኳችሁ ነበርን?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ብዙ ክፍሎች።» የግሪኩ ቃል ሰዎች የሚቆዩበትን ወይም የሚኖሩበትን ስፍራ ሊያመለክት ይችላል፤ «መኖሪያዎች» የሚለው ሰፋ ያለ ሲሆን በዚህ ምዕራፍ ካለው የመኖር ጭብጥ ጋር ያለውን ትስስር ይጠብቃል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እንዲህ ባይሆን ኖሮ በነገርኳችሁ ነበር፤ ለእናንተ ስፍራ ላዘጋጅ እየሄድሁ ነውና።» የግሪኩ ሐረግ ከአጽንዖት ጥያቄ ይልቅ እንደ መግለጫ ሊወሰድም ይችላል።
    reason: alternative_reading
