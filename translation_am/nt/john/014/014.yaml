id: JHN.14.14
reference: John 14:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: am
  text: በስሜ ማንኛውንም ነገር ብትለምኑኝ፣ እኔ አደርገዋለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “በስሜ ማንኛውንም ነገር ብትለምኑ፣ አደርገዋለሁ” ይላሉ፤ “እኔን” የሚለውን ያስቀራሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: ብት-
  rationale: ከንዑስ አንቀጹ ግስ ጋር ተዋሕዶ ሁኔታዊውን ‘ብትለምኑኝ’ ይፈጥራል፤ ይህም በአማርኛ ተፈጥሯዊ የ‘እንደሆነ’ ሁኔታን ያሳያል።
- source_word: τι
  choice: ማንኛውንም ነገር
  rationale: በሁኔታዊው አንቀጽ ውስጥ ያለውን ሰፊና ያልተወሰነ ወሰን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: αἰτήσητέ
  choice: ብትለምኑኝ
  rationale: ሁለተኛ መደብ ብዙ ቁጥር ያለውን ሁኔታዊ ግስ ይጠብቃል፤ ‘መለመን’ በጸሎት ወይም በጥያቄ አውድ ውስጥ የተከበረና ተፈጥሯዊ ነው።
- source_word: με
  choice: -ኝ
  rationale: በSBLGNT ያለውን ቀጥተኛ ተሳቢ በግሱ ላይ በሚጣበቅ የመጀመሪያ መደብ ነጠላ ተሳቢ ቅጥያ በግልጽ ይተረጉማል።
- source_word: ἐν τῷ ὀνόματί μου
  choice: በስሜ
  rationale: የኢየሱስን ስም፣ ሥልጣንና ማንነት የሚመለከተውን የዮሐንስ አገላለጽ ትርጉሙን ሳያጠብ በአጭርና በተለመደ መልኩ ያቀርባል።
- source_word: ἐγὼ
  choice: እኔ
  rationale: የግሪኩን ግልጽ እና በመጠኑ አጽንዖታዊ ተውላጠ ስም በመግለጽ ይጠብቃል።
- source_word: ποιήσω
  choice: አደርገዋለሁ
  rationale: የወደፊት ድርጊትን ይገልጻል፤ ‘-ዋ-’ የሚለው ተሳቢ ቅጥያ ቀደም ሲል የተጠቀሰውን ‘ማንኛውንም ነገር’ በተፈጥሯዊ አማርኛ ይመለሳል።
theological_decisions:
- issue: በዮሐንስ 14፥14 ውስጥ με (‘እኔን/እኔን ለምኑ’) መኖሩና ጥያቄው በቀጥታ ለኢየሱስ መቅረቡ
  choice: በዋናው ጽሑፍ ‘ብትለምኑኝ’ ተብሎ ተተርጉሟል።
  alternative: ‘በስሜ ማንኛውንም ነገር ብትለምኑ፣ አደርገዋለሁ’—‘እኔን’ የሚለውን የሚያስቀር የእጅ ጽሑፍ ንባብ።
  rationale: የቀረበው SBLGNT ጽሑፍ μεን ስለያዘ ዋናው ትርጉም በቀጥታ ያካትተዋል። ይህ ጥያቄው ለኢየሱስ መቅረቡን በግልጽ ስለሚያሳይ፣ የሚያስቀረው ንባብ በግርጌ ማስታወሻ በግልጽ ተጠብቋል፤ ከጽሑፉ በላይ የሆነ የእምነት ድምዳሜ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛን ተፈጥሯዊ የቃላት ቅደም ተከትሎ ‘በስሜ’ ከጥያቄው በፊት ቀርቧል፤ የግሪኩ ቀጥተኛ ተሳቢ με ግን ‘-ኝ’ በሚለው ቅጥያ ሳይደበቅ ተጠብቋል።
