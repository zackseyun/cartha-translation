  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: am
  text: “እኔ እሄዳለሁ፤ ወደ እናንተም እመጣለሁ” እንዳልኳችሁ ሰምታችኋል። ብትወዱኝ ኖሮ፣ ወደ አብ ስለምሄድ ደስ ባላችሁ ነበር[a]፤ ምክንያቱም አብ ከእኔ ይበልጣል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ደስ ትሉ ነበር።» የግሪኩ ቅርጽ በይበልጥ አጠቃላይ ሁኔታ ሊተረጎም ይችላል፤ «ደስ ባላችሁ ነበር» ግን በዐውዱ ካለው ከእውነታ ተቃራኒ ሁኔታ ጋር ይበልጥ ይስማማል።
    reason: lexical_alternative
  - marker: b
    text: «አብ ከእኔ ይበልጣል» የሚለው እንደተጻፈው ተተርጉሟል፤ «በሚና» ወይም «በማዕረግ» የሚል ትርጓሜያዊ ገደብ አልተጨመረበትም።
    reason: alternative_reading
