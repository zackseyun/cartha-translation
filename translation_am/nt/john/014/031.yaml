  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: am
  text: ነገር ግን ዓለም አብን እንደምወድ እንዲያውቅ፣[a] አብ እንዳዘዘኝ እንዲሁ አደርጋለሁ። ተነሱ፤ ከዚህ እንሂድ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ዓለም አብን እንደምወድና አብ እንዳዘዘኝ እንዲሁ እንደማደርግ እንዲያውቅ።”
    reason: የአገባብ አማራጭ
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ተቃርኖ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα γνῷ
  choice: እንዲያውቅ
  rationale: ἵνα ከአውሪስት ሰብጃንክቲቭ ጋር የሚገልጸውን የዓላማ ትርጉም በቀጥታ ይጠብቃል።
- source_word: ὁ κόσμος
  choice: ዓለም
  rationale: በዮሐንስ ዘንድ κόσμος ያለውን ሰፊ ሰብአዊና ሥነ መለኮታዊ ድምፀት ይጠብቃል።
- source_word: ἀγαπῶ τὸν πατέρα
  choice: አብን እንደምወድ
  rationale: የአሁን ጊዜውን ግስ በተፈጥሯዊ አማርኛ ያቀርባል፤ τὸν πατέρα ላይ በግሪኩ የሌለውን የባለቤትነት ተውላጠ ስም ሳይጨምር ‘አብ’ የሚለውን መጠሪያ ይጠብቃል።
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: አብ እንዳዘዘኝ እንዲሁ አደርጋለሁ
  rationale: καθώς ... οὕτως የሚያሳየውን ትክክለኛ ተመሳሳይነት ‘እንደ... እንዲሁ’ በሚለው አወቃቀር ይጠብቃል፤ ἐντέλλομαι ያለውን ጠንካራ የትእዛዝ ኃይል ‘አዘዘኝ’ ያስተላልፋል።
- source_word: Ἐγείρεσθε
  choice: ተነሱ
  rationale: ለብዙ ሰዎች የተሰጠውን ትእዛዝ በአጭር፣ ግልጽና ክቡር አገላለጽ ያቀርባል።
- source_word: ἄγωμεν ἐντεῦθεν
  choice: ከዚህ እንሂድ
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር አበረታች ሰብጃንክቲቭንና ከአሁኑ ስፍራ መነሳትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በዮሐንስ ክርስቶሎጂ ውስጥ πατήρ የሚለው የግንኙነት መጠሪያ
  choice: አብ
  alternative: አባቴ
  rationale: ግሪኩ ግልጽ የባለቤትነት ተውላጠ ስም ስለሌለው ‘አብ’ የሚለው ምርጫ የጽሑፉን ቅርጽና የአብና የወልድን ግንኙነት ያለ ትርጓሜያዊ ጭማሪ ይጠብቃል።
- issue: የἐντέλλομαι ኃይል እና የወልድ መታዘዝ
  choice: አዘዘኝ
  alternative: አስተማረኝ / መመሪያ ሰጠኝ
  rationale: ግሱ ትእዛዝ ወይም ጥብቅ አደራ መስጠትን ያመለክታል። ሥነ መለኮታዊ ውጥረቱን ለማለስለስ የቃሉን ኃይል አይቀንስም።
- issue: የἵνα አንቀጽና የκαθώς ... οὕτως አንቀጽ የአገባብ ግንኙነት
  choice: የዓላማውን አንቀጽ ከ‘አብን እንደምወድ’ ጋር በዋናነት ማገናኘት፣ ቀጣዩንም እንደ ዋና ንግግር ማቅረብ
  alternative: ሁለቱንም እውነቶች—አብን መውደድና እንዳዘዘ ማድረግ—ዓለም እንዲያውቅ በአንድ የዓላማ አንቀጽ ሥር ማቅረብ
  rationale: የግሪኩ የቃላት ቅደም ተከተልና ነጥብ አጠቃቀም ዋናውን ትርጉም ይደግፋሉ፤ ሆኖም የአገባቡ ግንኙነት ሌላውን ንባብ ሊፈቅድ ስለሚችል በማስታወሻ ተጠብቋል።
