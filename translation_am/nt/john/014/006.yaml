base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: am
  text: ኢየሱስም፣ “እኔ መንገድና እውነት ሕይወትም ነኝ። በእኔ በኩል ካልሆነ ወደ አብ የሚመጣ ማንም የለም” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ኢየሱስ ለእርሱ ይላል።” ግሪኩ እዚህ በትረካ ውስጥ ታሪካዊ የአሁን ጊዜን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መልክ ያቀርባል፤ የተዘዋዋሪ ተሳቢውንም ‘ለእርሱ’ በ‘-ው’ ይጠብቃል።
- source_word: Ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: በግሪክ ያለውን ግልጽና አጽንዖታዊ የመጀመሪያ መደብ አገላለጽ ይጠብቃል።
- source_word: ἡ ὁδὸς
  choice: መንገዱ
  rationale: ቃሉ ቃል በቃል መንገድንም ወደ አብ የመድረሻ ዘይቤያዊ መንገድንም ሊያመለክት የሚችለውን ስፋት ይጠብቃል።
- source_word: ἡ ἀλήθεια
  choice: እውነቱ
  rationale: የቃሉን መሠረታዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἡ ζωή
  choice: ሕይወቱ
  rationale: በዮሐንስ ወንጌል ያለውን ሰፊ ሥነ መለኮታዊ ክብደት ያለ ተጨማሪ ትርጓሜ እንደተከፈተ ይተዋል።
- source_word: οὐδεὶς ἔρχεται
  choice: የሚመጣ ማንም የለም
  rationale: አጠቃላይና ዘመን አይሽሬ አሉታዊ መግለጫውን በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: πρὸς τὸν πατέρα
  choice: ወደ አብ
  rationale: πρός የሚገልጸውን ወደ አንድ መዳረሻ መንቀሳቀስ ይጠብቃል፤ ‘አብ’ም በዚህ አውድ የእግዚአብሔር ግላዊ መጠሪያ ነው።
- source_word: εἰ μὴ δι’ ἐμοῦ
  choice: በእኔ በኩል ካልሆነ በቀር
  rationale: εἰ μή ያለውን ልዩ ማድረጊያ ኃይልና διά ከዘር ተሳቢ ጋር ያለውን የአማካይነት ወይም የመንገድነት ሐሳብ በአንድነት ይጠብቃል።
theological_decisions:
- issue: ወደ አብ መምጣት በኢየሱስ በኩል ብቻ መሆኑ
  choice: “በእኔ በኩል ካልሆነ በቀር ... ማንም የለም” የሚለውን ቀጥተኛ አግላይ ንግግር ሳይለሰልስ ማቆየት
  alternative: “በእኔ ካልሆነ” ወይም “በእኔ አማካይነት ብቻ”
  rationale: የግሪኩ εἰ μὴ δι’ ἐμοῦ ወደ አብ የመምጣትን ብቸኛ መንገድ በግልጽ ይናገራል፤ ትርጉሙ ይህን ሊያለሰልስም ሆነ ከጥቅሱ በላይ ሊያስፋፋ አይገባም።
- issue: የሦስቱ መገለጫዎች አወቃቀር
  choice: “መንገዱ፣ እውነቱና ሕይወቱ” በማለት እያንዳንዱን በውስን ቅጥያ ማቅረብ
  alternative: “መንገድ፣ እውነትና ሕይወት”
  rationale: ግሪኩ ከእያንዳንዱ ስም ጋር የተወሰነ መስተዋድድ ይደግማል። አማርኛው በ‘-ው/-ቱ’ ቅጥያዎች ይህን ልዩነትና ሥነ ንግግራዊ ክብደት በተፈጥሯዊነት ያንጸባርቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አጽንዖት በ“እኔ ነኝ” ተጠብቋል፤ የትረካው ታሪካዊ የአሁን ጊዜ ግን ለተፈጥሯዊ አማርኛ “አለው” ተብሏል። የእንግሊዝኛው [b] ማስታወሻ ከጥቅሱ ሁለተኛ ንግግር ጋር የሚዛመድ ቢሆንም ምልክቱ በ“life” ላይ የተቀመጠ ይመስላል፤ በአማርኛው “ካልሆነ በቀር” ሁለቱንም ‘except/unless’ አቀራረቦች በተፈጥሯዊነት ስለሚይዝ ተጨማሪ ማስታወሻ አልተጨመረም።
