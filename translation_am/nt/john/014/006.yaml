review_pass:
  verdict: revise
  source_fidelity: The draft retains the main Greek sense, including Jesus’ emphatic self-identification and the exclusive means of coming to the Father. However, ሕይወቱ naturally reads as “his life,” not as the definite predicate “the life,” and the exceptive construction በእኔ በኩል ካልሆነ በቀር is redundantly and less naturally formed.
  naturalness: The narrative framing ኢየሱስም … አለው is natural modern Amharic. The predicate series is more idiomatic without possessive/definite-looking suffixes, and the final condition is smoother as በእኔ በኩል ካልሆነ.
  terminology: መንገድ, እውነት, ሕይወት, and አብ are established and suitable terms. The revision preserves their breadth without doctrinal expansion.
  issues:
  - severity: medium
    issue: ሕይወቱ is semantically misleading.
    rationale: In modern Amharic, the suffix -ቱ is ordinarily understood possessively here (“his life”). It does not naturally represent the Greek article in this predicate sequence.
  - severity: medium
    issue: The phrase በእኔ በኩል ካልሆነ በቀር is redundant and awkward.
    rationale: ካልሆነ already supplies the “unless/if not” condition; adding በቀር produces an unnecessarily doubled exceptive expression. Removing it preserves εἰ μὴ δι’ ἐμοῦ more naturally.
