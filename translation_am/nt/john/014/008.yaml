id: JHN.14.8
reference: John 14:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: am
  text: ፊልጶስም፣ “ጌታ ሆይ፣ አብን አሳየን፤ ይህም ይበቃናል” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: አለው
  rationale: ግሪክኛው ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በዘመናዊ አማርኛ ትረካ ያለፈ ጊዜው «አለው» ተፈጥሯዊ ነው፤ የንግግሩን ተቀባይም ያሳያል።
- source_word: Φίλιππος
  choice: ፊልጶስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የጥሪ ቅርጹንና ለኢየሱስ የቀረበውን ክብር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δεῖξον ἡμῖν
  choice: አሳየን
  rationale: ቀጥተኛውን የጥያቄ/ትእዛዝ ቅርጽ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: በዮሐንስ ዐውድ የኢየሱስን አባት፣ እግዚአብሔርን፣ ለመጥቀስ በአማርኛ የተለመደው ክቡር መጠሪያ «አብ» ነው።
- source_word: καὶ ἀρκεῖ ἡμῖν
  choice: ይህም ይበቃናል
  rationale: καὶን በ«-ም» በማስተላለፍ ንግግሩን ተፈጥሯዊ ያደርጋል፤ ἀρκεῖ ἡμῖν የሚለውንም «ይበቃናል» በትክክል ይገልጣል።
theological_decisions:
- issue: Κύριε ለኢየሱስ የቀረበ መጠሪያ
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ / ጌታዬ
  rationale: «ጌታ ሆይ» የκύριοςን ክብርና በዮሐንስ ወንጌል ያለውን ክርስቶሳዊ ክብደት ሳይጨምር ይጠብቃል። «መምህር» የቃሉን ወሰን ያጠባል፣ «ጌታዬ» ደግሞ የግለሰብ ባለቤትነትን በግልጽ ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ። የግሪክኛው ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ተተርጉሟል። «አብ» በአማርኛ ክርስቲያናዊ አጠቃቀም የታወቀ ቢሆንም ለመደበኛ አንባቢም ግልጽ ነው።
