  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: am
  text: ከእንግዲህ ከእናንተ ጋር ብዙ አልናገርም፤ የዓለም ገዢ[a] እየመጣ ነውና። እርሱም በእኔ ምንም የለውም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዚህ ዓለም ገዢ።” አንዳንድ ትርጉሞች በዮሐንስ ውስጥ ካሉ ተመሳሳይ አገላለጾች ጋር በማስማማት “የዚህ” የሚለውን ይጨምራሉ፤ እዚህ ግን ግሪኩ “የዓለም” ብቻ ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእኔ ላይ ምንም መብት የለውም” ወይም “በእኔ ላይ ምንም መያዣ የለውም።” ግሪኩ ቃል በቃል፣ “በእኔ ምንም የለውም” ይላል።
    reason: alternative_reading
