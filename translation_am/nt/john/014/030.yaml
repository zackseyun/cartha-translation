  rationale: በዮሐንስ አውድ ማዕረጉ ሰይጣንን እንደሚያመለክት ቢታወቅም፣ ዋናው ጽሑፍ የገለጸውን ማዕረግ ራሱን መጠበቅ ማንነቱን በትርጉም እንዳይተካ ያደርጋል።
- issue: ‘በእኔ ምንም የለውም’ የሚለው አገላለጽ
  choice: ቃል በቃል ቅርብ የሆነውንና ትርጉሙን ክፍት የሚተወውን አገላለጽ ማቆየት
  alternative: ‘በእኔ ላይ ምንም መብት የለውም፣’ ‘በእኔ ላይ ምንም መያዣ የለውም፣’ ወይም ‘በእኔ ላይ ሥልጣን የለውም’
  rationale: አገላለጹ የመብት፣ የመያዣ፣ የቁጥጥር ወይም የጋራ መሠረት አለመኖርን ሊያመለክት ይችላል፤ አንዱን ብቻ መምረጥ የግሪኩን ሆን ብሎ ያልገደበውን ኃይል ያጠባል።
