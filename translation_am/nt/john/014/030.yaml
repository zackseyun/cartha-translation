- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር
  rationale: ከደቀ መዛሙርቱ ጋር ያለውን ቀጥተኛ ንግግርና ኅብረት በግልጽ ያሳያል።
- source_word: ἔρχεται
  choice: እየመጣ ነው
  rationale: በቅርብ የሚፈጸም መምጣትን የሚያሳየውን የግሪኩን የአሁን ጊዜ ቅርጽ ይጠብቃል።
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: የዓለም ገዢ
  rationale: ἄρχωνን በዘመናዊና ግልጽ ‘ገዢ’ ይተረጉማል፤ በግሪኩ የሌለውን ‘የዚህ’ የሚለውን ቃል በዋናው ጽሑፍ አይጨምርም።
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: በእኔ ምንም የለውም
  rationale: የግሪኩን አጭርና ሆን ብሎ ክፍት የተወውን አገላለጽ በቅርብ መልኩ ይጠብቃል፤ ‘መብት፣ ቁጥጥር ወይም መያዣ የለውም’ ብሎ ትርጉሙን በዋናው ጽሑፍ አያጠብም።
theological_decisions:
- issue: ‘የዓለም ገዢ’ ማንነትና የማዕረጉ ኃይል
  choice: ግሪኩ እንዳለው ‘የዓለም ገዢ’ የሚለውን ማዕረግ ማቆየት
