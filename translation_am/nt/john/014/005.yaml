  text: ቶማስ እንዲህ አለው፦ “ጌታ ሆይ፣ ወዴት እንደምትሄድ አናውቅም፤ መንገዱን እንዴት ልናውቅ እንችላለን?[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መንገዱን ማወቅ እንዴት እንችላለን?”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ «ማወቅ» የሚለው ግስ በዚህ ቁጥር ሁለት ጊዜ፣ በ«አናውቅም» እና በ«ልናውቅ» ውስጥ ተጠቅሷል።
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: ቶማስም እንዲህ አለው
  rationale: በትረካ ውስጥ ያለው ታሪካዊ የአሁን ጊዜ ግስ λέγει በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ቀርቧል፤ αὐτῷ የሚያመለክተው ተቀባይ በ«አለው» ውስጥ ተጠብቋል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የጥሪ ቅርጹንና በዮሐንስ ወንጌል ያለውን የክብርና የደቀ መዝሙርነት አድራሻ ሳያቃልል ያስተላልፋል።
- source_word: οὐκ οἴδαμεν
  choice: አናውቅም
  rationale: ግሱ በዚህ አውድ እውቀትን ይገልጣል፤ «አናውቅም» ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ποῦ ὑπάγεις
  choice: ወዴት እንደምትሄድ
  rationale: ὑπάγω በዮሐንስ ውስጥ የመሄድን ወይም የመለየትን ጥልቅ አውድ ሊይዝ ቢችልም፣ እዚህ የመድረሻውን ቦታ በገለልተኛ ቋንቋ ማቅረብ የቶማስን አለማወቅ ይጠብቃል።
- source_word: πῶς
  choice: እንዴት
  rationale: ግልጽ ተያያዥ ቃል ሳይጨመር የቶማስን የአስተሳሰብ ችግር በጥያቄ ያቀርባል።
- source_word: δυνάμεθα
  choice: እንችላለን
  rationale: የችሎታን ሞዳላዊ ኃይል በዘመናዊና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὴν ὁδὸν
  choice: መንገዱን
  rationale: «መንገድ» ቀጥተኛና ተፈጥሯዊ ትርጉም ሲሆን ከቀጣዩ ቁጥር ጋር ያለውን ጭብጣዊ ግንኙነት ይጠብቃል።
- source_word: εἰδέναι
  choice: ልናውቅ
  rationale: ከδυνάμεθα ጋር የተያያዘውን የችሎታ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል፤ ከ«አናውቅም» ጋር ተመሳሳይ የ«ማወቅ» ሥር በመጠቀም የግሪኩን ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: በዮሐንስ አውድ ውስጥ የὑπάγεις ሥነ መለኮታዊ ፍንጭ
  choice: «ወዴት እንደምትሄድ» ተብሎ በገለልተኛ አነጋገር ተተርጉሟል።
  alternative: «ወዴት እንደምትለየን» ወይም «ወዴት እንደምትሄድብን»
  rationale: በወንጌሉ ውስጥ የኢየሱስ መድረሻ ሥነ መለኮታዊ ክብደት አለው፤ ሆኖም የቶማስ ንግግር ወደ አብ መመለስን አይተረጉምም። ገለልተኛው አቀራረብ የትረካውን ውጥረትና ክፍትነት ይጠብቃል።
