  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። የግሪኩ የ«ማወቅ» ድግግሞሽ በአማርኛም ተጠብቋል።
