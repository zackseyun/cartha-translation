  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: am
  text: በዚያ ቀን፣ እኔ በአባቴ እንዳለሁ፣ እናንተም በእኔ እንዳላችሁ፣ እኔም በእናንተ እንዳለሁ ታውቃላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በ» የሚለው ቃል በሦስቱም ሐረጎች የግሪኩን ἐν በቀጥታ ይከተላል። «ከ… ጋር በኅብረት» ተብሎ ሊብራራ ይችላል፤ ይህ ግን የበለጠ ትርጓሜያዊ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያ ቀን
  rationale: የጊዜ አገላለጹንና የἐκείνῃን ጠቋሚ ልዩነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስቀምጣል።
- source_word: γνώσεσθε ὑμεῖς
  choice: ታውቃላችሁ
  rationale: የወደፊት ጊዜ እውቀትን ወይም መገንዘብን በቀጥታና ተፈጥሯዊ ሁኔታ ይገልጣል፤ የብዙ ቁጥር ቅጥያውም ὑμεῖςን ያመለክታል።
- source_word: ὅτι
  choice: እንደ…
  rationale: ደቀ መዛሙርቱ የሚያውቁትን ይዘት በአማርኛ የተፈጥሮ የተዘዋዋሪ ንግግር ቅርጽ ያስገባል፤ የምክንያት ትርጉም አይሰጠውም።
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: እኔ በአባቴ እንዳለሁ
  rationale: ἐνን «በ» ብሎ በማቆየት የዮሐንስን በአንዱ በሌላው የመኖር ምስላዊና ሥነ መለኮታዊ አገላለጽ ያለ ትርጓሜያዊ ማስፋፊያ ያቀርባል።
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: እናንተም በእኔ እንዳላችሁ
  rationale: ግልጽ የሆነውን ὑμεῖς በ«እናንተም» ያሳያል፤ የተደገመውን ἐνም «በ» በማለት ይጠብቃል።
- source_word: κἀγὼ ἐν ὑμῖν
  choice: እኔም በእናንተ እንዳለሁ
  rationale: κἀγώን «እኔም» ብሎ ያስተላልፋል፤ የጋራ መኖር ቋንቋውን ሳያጠብ ወይም ሳያሰፋ ተመሳሳይ «በ» ይጠቀማል።
theological_decisions:
- issue: የዮሐንስ የጋራ መኖር አገላለጽ (ἐν … ἐν … ἐν)
  choice: በሦስቱም ሐረጎች «በ» የሚለውን ድግግሞሽ መጠበቅ።
  alternative: «ከ… ጋር አንድ መሆን» ወይም «ከ… ጋር ኅብረት መኖር» ብሎ መተርጎም።
  rationale: የምንጩ ቋንቋ የሚፈቅደውን ጥልቅና ዘርፈ ብዙ ግንኙነት ይጠብቃል፤ አገላለጹን ወደ አንድ የሥነ መለኮት ትርጓሜ አያጠብም።
- issue: የኢየሱስ ከአብ ጋር ያለው ግንኙነት
  choice: «እኔ በአባቴ እንዳለሁ» ብሎ በቀጥታ ማቅረብ።
  alternative: «እኔና አባቴ በባሕርይ አንድ ነን» ወይም «እኔ ከአባቴ ጋር ነኝ» ብሎ ማስፋት ወይም ማላላት።
  rationale: የጥቅሱን ከፍ ያለ ክርስቶሎጂያዊ ኃይል ሳያዳክም፣ ጥቅሱ ራሱ ያልተናገረውን የኋላ ዘመን ቀመር ወደ ጽሑፉ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአማርኛ ተፈጥሯዊ የይዘት ሐረግ ቅደም ተከተል ተከትሎ «ታውቃላችሁ» በመጨረሻ ተቀምጧል፤ የἐν ድግግሞሽ ግን በሦስቱም ክፍሎች ተጠብቋል።
