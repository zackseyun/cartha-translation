  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: am
  text: የእውነት መንፈስን[a] ዓለም ሊቀበለው አይችልም፤ ምክንያቱም አያየውም፣ አያውቀውምም። እናንተ ግን ታውቁታላችሁ፤ እርሱ ከእናንተ ጋር ይኖራልና፣ በእናንተም ውስጥ ይሆናል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ «መንፈስ» (πνεῦμα) ለሚለው ቃል ገለልተኛ ሰዋሰዋዊ ጾታ ይጠቀማል፤ ስለዚህ አንጻራዊው ተውላጠ ስምና ተውላጠ ስሞቹ በሰዋስው ገለልተኛ ናቸው። ትርጉሙ ግን ከአውዱ ጋር በማስማማት ግለሰባዊ አገላለጽን ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በመካከላችሁ ይሆናል»። ተውላጠ ስሙ ብዙ ቁጥር ስለሆነ ግሪኩ በማኅበራዊ ትርጉም ሊነበብ ይችላል፤ «በእናንተ ውስጥ» ግን «ከእናንተ ጋር» ከሚለው ጋር ያለውን ልዩነት ይበልጥ ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: የእውነት መንፈስ
  rationale: የግሪኩን የባለቤትነት አገባብ እና በዮሐንስ የተለመደውን አገላለጽ ይጠብቃል። ከአውዱ የተነሣም «መንፈስ» የግል ባሕርይ ያለውን መንፈስ ያመለክታል።
- source_word: ὁ κόσμος
  choice: ዓለም
  rationale: በዮሐንስ ጽሑፎች የκόσμοςን ሰፊ ትርጉም ሳያጠብ የሚያስተላልፍ የተለመደ ቃል ነው።
- source_word: οὐ δύναται λαβεῖν
  choice: ሊቀበለው አይችልም
  rationale: δύναται የሚገልጠውን አለመቻልና λαβεῖν የሚገልጠውን መቀበል በተፈጥሯዊ የአማርኛ አገባብ ይጠብቃል።
- source_word: θεωρεῖ
  choice: ያያል
  rationale: የማየትን ቀጥተኛ ስሜት ይጠብቃል፤ «ያስተውላል» ማለት ከጽሑፉ በላይ ትርጓሜ ሊጨምር ይችላል።
- source_word: γινώσκει / γινώσκετε
  choice: ያውቃል / ታውቃላችሁ
  rationale: ዓለም አለማወቁንና ደቀ መዛሙርቱ ማወቃቸውን በአንድ የቃል ሥር በመግለጽ የግሪኩን ተቃርኖ ይጠብቃል።
- source_word: παρ’ ὑμῖν μένει
  choice: ከእናንተ ጋር ይኖራል
  rationale: παρά የሚገልጠውን «ከ…ጋር» ግንኙነትና μένει የሚገልጠውን ቀጣይ መኖር በዘመናዊና ተፈጥሯዊ ቋንቋ ያስተላልፋል።
- source_word: ἐν ὑμῖν ἔσται
  choice: በእናንተ ውስጥ ይሆናል
  rationale: ἐνን «ውስጥ» ብሎ በመተርጎም ከቀደመው «ከእናንተ ጋር» ጋር ያለውን የቦታ አገላለጽ ልዩነት ይጠብቃል፤ ἔσταιንም በወደፊት ጊዜ ያቀርባል።
theological_decisions:
- issue: ሰዋሰዋዊ ጾታው ገለልተኛ ቢሆንም መንፈሱን እንደ ግለሰብ ማመልከት
  choice: «እርሱ» እና የወንድ ጾታ ተውላጠ ስም ቅጥያ «-ው» መጠቀም
  alternative: መንፈሱን ግለሰባዊ ባልሆነ አገላለጽ ማቅረብ
  rationale: πνεῦμα በግሪክ ሰዋስው ገለልተኛ ቢሆንም በቅርብ አውዱ የተገለጠው ማወቅና መኖር ያለው ግለሰባዊ ዋቢ ነው። የአማርኛው አገላለጽ ይህን ዋቢ ግልጽ ያደርጋል፤ የግሪኩን ሰዋሰዋዊ ሁኔታ ግን በማስታወሻ ያሳውቃል።
- issue: መንፈሱ ከአማኞች ጋርና በእነርሱ ውስጥ መሆኑ
  choice: «ከእናንተ ጋር» እና «በእናንተ ውስጥ» የሚሉትን ሁለት አገላለጾች ለይቶ ማቆየት
  alternative: ሁለቱንም «ከእናንተ ጋር» ወይም «በመካከላችሁ» ብሎ ማጠቃለል
  rationale: ግሪኩ παρά እና ἐν የሚሉ የተለያዩ መስተዋድዶችን ይጠቀማል። ትርጉሙ ይህን ልዩነትና ያለውን ሥነ መለኮታዊ ውጥረት ሳያስወግድ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ይኖራል» ተፈጥሯዊነትን ሲጠብቅ የμένωን ቀጣይነት ያስተላልፋል፤ «እናንተ ግን» የተገለጸውን ὑμεῖς እና ከዓለም ጋር ያለውን ተቃርኖ ግልጽ ያደርጋል።
